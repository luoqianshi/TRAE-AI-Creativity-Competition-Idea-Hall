<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>言值 —— 每次对话，都往更好的方向推进</title>
<style>
/* ============ CSS Variables ============ */
:root {
  --bg: #070b1a;
  --bg-card: rgba(20,28,58,0.75);
  --bg-card-solid: #141c3a;
  --bg-input: rgba(12,18,40,0.9);
  --border: rgba(100,130,200,0.15);
  --border-hover: rgba(100,160,220,0.3);
  --text: #e8ecf4;
  --text-muted: #8899bb;
  --text-dim: #4a5578;
  --accent: #36d7b7;
  --accent-2: #48c6ef;
  --accent-glow: rgba(54,215,183,0.25);
  --gold: #f0b429;
  --gold-glow: rgba(240,180,41,0.2);
  --warm: #f98a5b;
  --success: #3dd68c;
  --success-glow: rgba(61,214,140,0.25);
  --radius: 16px;
  --radius-sm: 12px;
  --transition: 0.3s cubic-bezier(0.22,0.61,0.36,1);
  --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --glass-bg: rgba(20,28,58,0.6);
  --glass-border: rgba(100,160,220,0.12);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { font-size:16px; scroll-behavior:smooth; }
body {
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  line-height:1.7;
  overflow-x:hidden;
  position:relative;
}
body::before {
  content:''; position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(ellipse 80% 60% at 15% 10%, rgba(54,215,183,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 90%, rgba(240,180,41,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 50% 50%, rgba(72,198,239,0.03) 0%, transparent 60%);
}
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

/* ============ Layout ============ */
.app-container {
  max-width:860px;
  margin:0 auto;
  padding:24px 18px 80px;
  display:flex;
  flex-direction:column;
  gap:22px;
}

/* ============ Header ============ */
.header {
  text-align:center;
  padding:36px 0 8px;
  position:relative;
}
.header .logo {
  font-size:2.2rem;
  font-weight:900;
  letter-spacing:0.5px;
  background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 50%, var(--gold) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 2px 8px rgba(54,215,183,0.2));
}
.header .slogan {
  font-size:0.9rem;
  color:var(--text-muted);
  margin-top:8px;
  letter-spacing:0.5px;
  opacity:0.8;
}
.header .level-badge {
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  padding:6px 16px;
  border-radius:20px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  font-size:0.78rem;
  color:var(--text-muted);
}
.level-badge .lvl-name { color:var(--accent); font-weight:700; }
.level-badge .lvl-bar {
  width:80px; height:4px;
  background:rgba(255,255,255,0.08);
  border-radius:2px;
  overflow:hidden;
  margin:0 4px;
}
.level-badge .lvl-fill {
  height:100%;
  background:linear-gradient(90deg, var(--accent), var(--gold));
  border-radius:2px;
  transition:width 0.6s ease;
}

/* ============ Stats Bar ============ */
.stats-bar {
  display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
}
.stat-card {
  background:var(--glass-bg);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);
  padding:12px 16px;
  text-align:center;
  min-width:80px;
  flex:1;
  max-width:150px;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
}
.stat-card::after {
  content:''; position:absolute;
  top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity:0.5;
}
.stat-card:hover { border-color:var(--border-hover); transform:translateY(-2px); box-shadow:var(--glass-shadow); }
.stat-card .stat-value { font-size:1.5rem; font-weight:800; color:var(--accent); transition:var(--transition); }
.stat-card .stat-label { font-size:0.68rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:1.2px; margin-top:2px; }
.stat-card .stat-sub { font-size:0.6rem; color:var(--text-dim); margin-top:1px; }

/* ============ Mode Tabs ============ */
.mode-tabs {
  display:flex; gap:4px;
  background:var(--glass-bg);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-radius:var(--radius);
  padding:5px;
  border:1px solid var(--glass-border);
}
.mode-tab {
  flex:1; padding:13px 8px; text-align:center; border-radius:12px;
  cursor:pointer; font-size:0.85rem; font-weight:600;
  color:var(--text-muted); border:none; background:transparent;
  transition:var(--transition); white-space:nowrap; position:relative;
}
.mode-tab:hover { color:var(--text); }
.mode-tab.active {
  background:linear-gradient(135deg, rgba(54,215,183,0.2), rgba(72,198,239,0.1));
  color:var(--accent); font-weight:700;
  box-shadow:0 0 20px rgba(54,215,183,0.1);
}
.mode-tab .tab-icon { display:block; font-size:1.3rem; margin-bottom:3px; }

/* ============ Arena ============ */
.arena {
  background:var(--glass-bg);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  padding:30px 26px;
  min-height:280px;
  display:flex;
  flex-direction:column;
  gap:20px;
  position:relative;
  overflow:hidden;
  transition:all 0.4s ease;
  box-shadow:0 4px 24px rgba(0,0,0,0.25);
}
.arena.active { border-color:rgba(54,215,183,0.35); box-shadow:0 0 40px var(--accent-glow), 0 4px 24px rgba(0,0,0,0.25); }
.arena.great { border-color:rgba(61,214,140,0.4); box-shadow:0 0 50px var(--success-glow), 0 4px 24px rgba(0,0,0,0.25); }
.arena::before {
  content:''; position:absolute;
  top:-50%; left:-50%; width:200%; height:200%;
  background:radial-gradient(ellipse at 30% 0%, rgba(54,215,183,0.04) 0%, transparent 50%);
  pointer-events:none;
}
.arena-state { position:relative; z-index:1; }
.arena-empty { text-align:center; padding:60px 24px; color:var(--text-muted); }
.arena-empty .empty-icon { font-size:3.5rem; display:block; margin-bottom:16px; opacity:0.7; animation:float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.arena-empty .empty-title { font-size:1.15rem; font-weight:700; color:var(--text); margin-bottom:8px; }
.arena-empty .empty-desc { font-size:0.88rem; line-height:1.7; }

/* Scenario bubble */
.scenario-bubble {
  display:flex; gap:14px; align-items:flex-start;
  animation:slideIn 0.5s ease;
}
@keyframes slideIn {
  from { opacity:0; transform:translateY(16px); }
  to { opacity:1; transform:translateY(0); }
}
.scenario-avatar {
  width:48px;height:48px; border-radius:50%;
  background:linear-gradient(135deg, var(--accent), #1a8970);
  display:flex; align-items:center; justify-content:center;
  font-size:1.5rem; flex-shrink:0;
  box-shadow:0 0 20px var(--accent-glow);
}
.scenario-content {
  flex:1;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:20px;
  border-top-left-radius:2px;
}
.scenario-content .scene-tag {
  font-size:0.7rem; color:var(--accent);
  text-transform:uppercase; letter-spacing:1.5px;
  font-weight:700; margin-bottom:10px;
}
.scenario-content .scene-text { font-size:1.02rem; line-height:1.8; color:var(--text); }
.scenario-content .scene-context {
  font-size:0.8rem; color:var(--text-muted); margin-top:12px;
  padding:8px 14px; background:rgba(255,255,255,0.02);
  border-radius:8px; border-left:2px solid var(--accent);
}
.scenario-content .scene-hint {
  display:inline-block; margin-top:14px;
  font-size:0.75rem; color:var(--accent);
  background:rgba(54,215,183,0.06);
  padding:7px 14px; border-radius:20px;
}

/* ============ Response Area ============ */
.response-section { position:relative; z-index:1; }
.response-label {
  font-size:0.82rem; color:var(--text-muted);
  margin-bottom:10px; font-weight:600;
  display:flex; align-items:center; gap:6px;
}
.response-label::before {
  content:''; display:inline-block;
  width:9px;height:9px;
  background:var(--accent); border-radius:50%;
  animation:pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:0.4; transform:scale(1.4); }
}
.response-textarea {
  width:100%; min-height:120px;
  background:rgba(255,255,255,0.02);
  border:2px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text); padding:18px 20px;
  font-size:0.95rem; font-family:var(--font);
  resize:vertical; transition:var(--transition); outline:none;
  line-height:1.8;
}
.response-textarea:focus { border-color:var(--accent); box-shadow:0 0 18px var(--accent-glow); background:rgba(255,255,255,0.04); }
.response-textarea::placeholder { color:var(--text-dim); }
.response-footer {
  display:flex; align-items:center; justify-content:space-between;
  gap:8px; margin-top:8px; flex-wrap:wrap;
}
.response-footer .char-count {
  font-size:0.72rem; color:var(--text-dim);
}
.response-footer .char-count.warn { color:var(--warm); }
.response-hint {
  font-size:0.74rem; color:var(--text-dim);
  display:flex; align-items:center; gap:4px;
}
.btn-row { display:flex; gap:10px; margin-top:14px; }

/* ============ Buttons ============ */
.btn {
  padding:12px 24px; border-radius:var(--radius-sm);
  border:none; font-size:0.9rem; font-weight:700;
  cursor:pointer; transition:var(--transition);
  font-family:var(--font); letter-spacing:0.3px;
  position:relative; overflow:hidden;
}
.btn::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.08) 50%, transparent 60%);
  transition:transform 0.5s ease;
  transform:translateX(-100%);
}
.btn:hover::after { transform:translateX(100%); }
.btn:active { transform:scale(0.96); }
.btn-primary {
  flex:1; background:linear-gradient(135deg, var(--accent), #1a8970);
  color:#070b1a;
  box-shadow:0 4px 20px var(--accent-glow);
}
.btn-primary:hover { box-shadow:0 6px 28px var(--accent-glow); transform:translateY(-1px); }
.btn-primary:disabled { background:var(--border); color:var(--text-dim); box-shadow:none; cursor:not-allowed; transform:none; }
.btn-primary:disabled::after { display:none; }
.btn-secondary {
  background:rgba(255,255,255,0.04); color:var(--text);
  border:1px solid var(--border);
}
.btn-secondary:hover { border-color:var(--accent); color:var(--accent); background:rgba(54,215,183,0.06); }
.btn-sm { padding:8px 16px; font-size:0.78rem; }
.btn-warm {
  flex:1; background:linear-gradient(135deg, var(--warm), #e06a3c);
  color:#070b1a; font-weight:700;
}
.btn-warm:hover { opacity:0.9; }
.btn-ghost { background:transparent; border:1px dashed var(--border); color:var(--text-muted); }
.btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
.btn-xs { padding:5px 12px; font-size:0.7rem; border-radius:20px; }
.btn-icon { display:inline-flex; align-items:center; gap:4px; }

/* ============ Result Panel ============ */
.result-panel {
  background:rgba(255,255,255,0.02);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:24px;
  animation:slideIn 0.5s ease;
}
.result-header {
  display:flex; align-items:center; gap:12px;
  margin-bottom:18px;
}
.result-score {
  font-size:2.8rem; font-weight:900; line-height:1;
  font-variant-numeric:tabular-nums;
}
.result-score.great { color:var(--success); text-shadow:0 0 20px var(--success-glow); }
.result-score.good { color:var(--accent); text-shadow:0 0 14px var(--accent-glow); }
.result-score.ok { color:var(--gold); }
.result-score.meh { color:var(--warm); }
.result-verdict { font-size:1.05rem; font-weight:700; }
.result-breakdown { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
.result-item {
  flex:1; min-width:80px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.04);
  border-radius:10px; padding:14px 8px; text-align:center;
  transition:var(--transition);
}
.result-item:hover { border-color:var(--border-hover); transform:translateY(-2px); }
.result-item .ri-score { font-size:1.2rem; font-weight:700; color:var(--accent); }
.result-item .ri-bar {
  height:3px; background:rgba(255,255,255,0.06);
  border-radius:2px; margin:6px auto 0;
  width:60%; overflow:hidden;
}
.result-item .ri-bar-fill {
  height:100%; background:var(--accent);
  border-radius:2px; transition:width 0.8s ease;
}
.result-item .ri-label { font-size:0.68rem; color:var(--text-muted); margin-top:6px; }
.result-my-response {
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 16px; margin-bottom:14px;
  font-size:0.85rem; color:var(--text-muted); line-height:1.7;
  max-height:120px; overflow-y:auto;
}
.result-my-response .rmr-label {
  font-size:0.7rem; color:var(--text-dim); margin-bottom:6px;
}
.result-feedback {
  background:rgba(54,215,183,0.05);
  border-left:3px solid var(--accent);
  padding:16px 18px;
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  font-size:0.88rem; color:var(--text);
  margin-bottom:14px; line-height:1.75;
}
.result-sample {
  background:rgba(240,180,41,0.04);
  border-left:3px solid var(--gold);
  padding:16px 18px;
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  font-size:0.86rem; color:var(--gold);
  line-height:1.75; position:relative;
}
.result-sample .copy-btn {
  position:absolute; top:8px; right:8px;
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border);
  color:var(--text-muted);
  padding:4px 10px; border-radius:6px;
  font-size:0.7rem; cursor:pointer;
  transition:var(--transition);
}
.result-sample .copy-btn:hover { border-color:var(--accent); color:var(--accent); }
.result-time {
  font-size:0.7rem; color:var(--text-dim);
  margin-top:8px; text-align:right;
}

/* ============ Technique Grid ============ */
.technique-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
  gap:8px; margin-top:8px;
}
.technique-chip {
  padding:12px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--glass-bg);
  cursor:pointer; font-size:0.8rem;
  color:var(--text-muted); text-align:center;
  transition:var(--transition);
  backdrop-filter:blur(8px);
}
.technique-chip:hover { border-color:var(--accent); color:var(--accent); transform:translateY(-1px); }
.technique-chip.selected {
  background:linear-gradient(135deg, rgba(54,215,183,0.3), rgba(72,198,239,0.15));
  border-color:var(--accent); color:var(--accent); font-weight:600;
  box-shadow:0 0 16px var(--accent-glow);
}

/* ============ Encyclopedia ============ */
.ency-search {
  width:100%; padding:12px 16px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text); font-size:0.88rem;
  outline:none; transition:var(--transition);
  margin-bottom:8px;
}
.ency-search:focus { border-color:var(--accent); }
.ency-search::placeholder { color:var(--text-dim); }
.encyclopedia-list { display:flex; flex-direction:column; gap:8px; position:relative; z-index:1; }
.ency-entry {
  background:rgba(255,255,255,0.02);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  overflow:hidden; transition:var(--transition);
}
.ency-entry:hover { border-color:var(--border-hover); }
.ency-header {
  display:flex; justify-content:space-between; align-items:center;
  padding:16px 20px; cursor:pointer;
  font-weight:600; font-size:0.95rem;
  transition:var(--transition);
}
.ency-entry.open .ency-header { background:rgba(54,215,183,0.04); }
.ency-body {
  display:none; padding:0 20px 18px;
  font-size:0.87rem; color:var(--text-muted); line-height:1.8;
}
.ency-entry.open .ency-body { display:block; }
.ency-body .eny-section { margin-top:14px; }
.ency-body .eny-section strong { color:var(--accent); font-size:0.78rem; display:block; margin-bottom:6px; }
.eny-example {
  background:rgba(240,180,41,0.04);
  padding:14px 16px; border-radius:10px;
  margin:6px 0; color:var(--gold);
  border:1px solid rgba(240,180,41,0.08);
}
.eny-sample {
  background:rgba(54,215,183,0.04);
  padding:14px 16px; border-radius:10px;
  margin:6px 0; color:var(--accent);
  border:1px solid rgba(54,215,183,0.08);
}

/* ============ History ============ */
.history-section {
  background:var(--glass-bg);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  padding:24px;
}
.history-header {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:16px;
}
.history-header h3 { font-size:1.05rem; color:var(--text); }
.history-actions { display:flex; gap:6px; }
.history-list { display:flex; flex-direction:column; gap:6px; max-height:320px; overflow-y:auto; }
.history-item {
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; background:rgba(255,255,255,0.02);
  border:1px solid transparent;
  border-radius:10px; font-size:0.8rem;
  transition:var(--transition);
}
.history-item:hover { border-color:var(--border); background:rgba(255,255,255,0.04); }
.history-item .hi-result {
  width:32px;height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:0.75rem; flex-shrink:0;
  font-weight:700;
}
.hi-great { background:rgba(61,214,140,0.2); color:var(--success); }
.hi-good { background:rgba(54,215,183,0.2); color:var(--accent); }
.hi-ok { background:rgba(240,180,41,0.2); color:var(--gold); }
.hi-meh { background:rgba(249,138,91,0.2); color:var(--warm); }
.history-item .hi-info { flex:1; min-width:0; }
.history-item .hi-scene { color:var(--accent); font-weight:600; }
.history-item .hi-time { color:var(--text-dim); font-size:0.7rem; margin-top:2px; }
.history-item .hi-score { font-weight:700; font-size:0.85rem; min-width:40px; text-align:right; }

/* ============ Confetti ============ */
.confetti-container {
  position:fixed; inset:0; pointer-events:none; z-index:2000;
}
.confetti-piece {
  position:absolute;
  width:10px; height:10px;
  border-radius:2px;
  animation:confettiFall 1.6s ease-out forwards;
}
@keyframes confettiFall {
  0% { transform:translateY(-10vh) rotate(0deg) scale(1); opacity:1; }
  70% { opacity:1; }
  100% { transform:translateY(105vh) rotate(720deg) scale(0.3); opacity:0; }
}

/* ============ Toast ============ */
.toast {
  position:fixed; bottom:36px; left:50%;
  transform:translateX(-50%) translateY(120px);
  background:var(--glass-bg);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--accent);
  padding:14px 28px; border-radius:30px;
  font-size:0.85rem; font-weight:600; z-index:1000;
  opacity:0; transition:all 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
  pointer-events:none;
  box-shadow:0 4px 24px rgba(0,0,0,0.4);
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ============ Daily Stats ============ */
.scene-stats {
  display:flex; flex-wrap:wrap; gap:4px; margin-bottom:14px;
}
.scene-stat-tag {
  font-size:0.65rem; padding:3px 8px;
  border-radius:12px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  color:var(--text-muted);
}

/* ============ Responsive ============ */
@media (max-width:640px) {
  .app-container { padding:14px 10px 60px; gap:16px; }
  .header { padding:24px 0 4px; }
  .header .logo { font-size:1.6rem; }
  .arena { padding:20px 14px; }
  .mode-tab { padding:11px 4px; font-size:0.73rem; }
  .mode-tab .tab-icon { font-size:1.1rem; }
  .stat-card { padding:10px 10px; }
  .stat-card .stat-value { font-size:1.2rem; }
  .result-score { font-size:2.2rem; }
  .technique-grid { grid-template-columns:repeat(auto-fill, minmax(105px,1fr)); }
  .scenario-content { padding:16px; }
  .btn-row { flex-wrap:wrap; }
  .scene-stats { gap:2px; }
  .scene-stat-tag { font-size:0.6rem; padding:2px 6px; }
}
</style>
</head>
<body>

<div class="app-container">
  <header class="header">
    <div class="logo">💬 言值</div>
    <div class="slogan">每次对话，都往更好的方向推进</div>
    <div class="level-badge" id="levelBadge">
      <span class="lvl-name" id="lvlName">🌱 新手</span>
      <div class="lvl-bar"><div class="lvl-fill" id="lvlFill" style="width:0%"></div></div>
      <span id="lvlProgress">0/100</span>
    </div>
  </header>

  <div class="stats-bar" id="statsBar">
    <div class="stat-card">
      <div class="stat-value" id="statRounds">0</div>
      <div class="stat-label">总练习</div>
      <div class="stat-sub" id="statToday">今日 0</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statGreat">0</div>
      <div class="stat-label">出色</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statAvg">0</div>
      <div class="stat-label">均分</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statStreak">0</div>
      <div class="stat-label">连优</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statBest">0</div>
      <div class="stat-label">最高分</div>
    </div>
  </div>

  <nav class="mode-tabs" id="modeTabs">
    <button class="mode-tab active" data-mode="free">
      <span class="tab-icon">🎲</span> 随机挑战
    </button>
    <button class="mode-tab" data-mode="targeted">
      <span class="tab-icon">🎯</span> 专项训练
    </button>
    <button class="mode-tab" data-mode="encyclopedia">
      <span class="tab-icon">📖</span> 技巧百科
    </button>
  </nav>

  <main class="arena" id="arena">
    <div class="arena-state" id="arenaContent">
      <div class="arena-empty">
        <span class="empty-icon">💬</span>
        <div class="empty-title">每次对话都是一次练习</div>
        <div class="empty-desc">AI 将为你呈现真实的职场沟通困境<br>试着用高情商的方式回应，系统会从四个维度给你评分和建议</div>
      </div>
    </div>
  </main>

  <div id="responseArea" style="display:none;">
    <div class="response-section">
      <div class="response-label">写下你的高情商回应</div>
      <textarea class="response-textarea" id="responseInput"
        placeholder="面对这个场景，你会怎么说？

💡 试着做到：
· 先共情对方的情绪或立场
· 用「我」开头表达感受和需求
· 提出建设性的解决方案
· 保持边界的同时展现善意" rows="4"></textarea>
      <div class="response-footer">
        <span class="char-count" id="charCount">0 字</span>
        <span class="response-hint">💡 试试先说「我理解你的感受…」</span>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnSubmit" onclick="submitResponse()">✨ 提交回答</button>
        <button class="btn btn-ghost btn-sm" onclick="skipRound()">跳过 → 看范例</button>
      </div>
    </div>
  </div>

  <div id="targetedPanel" style="display:none;">
    <div class="response-label" style="margin-top:8px;">选择要专项训练的场景类型（可多选）：</div>
    <div class="technique-grid" id="techniqueGrid"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnTargetedStart" onclick="startTargetedRound()">🎯 开始专项训练</button>
    </div>
  </div>

  <div class="history-section" id="historySection">
    <div class="history-header">
      <h3>📜 练习记录</h3>
      <div class="history-actions" id="historyActions">
        <button class="btn btn-ghost btn-xs" onclick="clearHistory()" id="btnClearHistory" style="display:none;">🗑 清空</button>
      </div>
    </div>
    <div class="scene-stats" id="sceneStats"></div>
    <div class="history-list" id="historyList">
      <div style="color:var(--text-dim);text-align:center;padding:28px;font-size:0.85rem;">还没有练习记录，来试试第一题吧！</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="confetti-container" id="confetti"></div>
</div>

<script>
// ============================================================
const EQ_SCENES = [
  {
    id:'empathy', name:'情绪共情', icon:'🤝',
    summary:'先理解对方情绪，再讲道理',
    description:'面对情绪激动的同事或下属，第一时间不是讲道理或反驳，而是先识别并回应对方的情绪。让对方感到被理解，才能打开理性沟通的大门。',
    detectKeys:['理解','感受','情绪','我知道','能体会','确实','不容易','辛苦了','共情','认可'],
    scenarios:[
      {situation:'你的下属因连续加班两周，在会议上情绪崩溃。散会后来找你说："我真的快撑不住了，这个项目简直在消耗我的生命。"',context:'你是他的直属领导，项目紧张，但他的状态已经明显影响工作。'},
      {situation:'同事在群里发了一长段话抱怨客户反复改需求、领导不帮挡，最后说"我真的受够了，要不是为了房贷我早走了"。群里气氛瞬间凝固。',context:'你是他的平级同事，关系还不错，你知道他最近压力很大。'},
      {situation:'合作方负责人打来电话语气很差："你们团队的交付质量我忍了很久，这次问题必须在明天下班前解决，否则终止合作。"',context:'你刚接手对接，历史问题确实存在，但不完全是你们的责任。'},
      {situation:'你在电梯里遇到CEO，他突然问你："听说你们项目进度不太乐观？" 你没预料到会被这样问，心跳加速。',context:'你是项目成员，CEO平时很少关注细节，你只有30秒回答。'},
      {situation:'你带的新人突然递了辞职信，说"我觉得自己不适合这份工作"。你知道他其实很有潜力，只是最近连续被客户刁难了几次。',context:'你投入了很多精力培养他，他的离开对你和团队都是损失。'},
    ],
    samples:[
      '基础回应："我完全理解你的感受，连续加班确实太消耗人了。你愿意现在跟我聊具体是哪些部分让你最累吗？我们一起看看能不能调整。"',
      '更好回应："谢谢你愿意跟我说这些。我听到的是你已经尽力在扛，但身体和心理都到极限了——这种感觉我也有过。先不谈项目，先聊聊你现在的状态。你觉得当下最需要什么？休息一天？还是我帮你协调任务？"',
    ],
  },
  {
    id:'nvc', name:'非暴力沟通', icon:'🕊️',
    summary:'观察 + 感受 + 需求 + 请求',
    description:'马歇尔·卢森堡提出的经典框架：客观描述事实 → 表达感受 → 说出需求 → 提出请求。核心是"不带攻击地表达自己，不委屈地理解对方"。',
    detectKeys:['我的感受','我需要','我希望','不是批评','观察','因为','能否','可不可以','我注意到','我觉得'],
    scenarios:[
      {situation:'你提前一周约好的会议，对方开始前3分钟发消息说"不好意思临时有事，改天吧"。这已是本月第三次。',context:'对方是跨部门协作伙伴，项目进度需要他的输入，频繁改约严重影响你的节奏。'},
      {situation:'你的需求文档明确写了A功能，开发做成了B。你去找开发沟通，对方说："你写得太模糊了，我问你又不在线，我就按自己理解的做了。"',context:'你是产品经理，和开发首次合作，不想关系搞僵但问题必须解决。'},
      {situation:'辛苦做了一周的方案发给领导，只收到三个字："重做一下"。没有任何其他反馈。',context:'你很想知道哪里需要改，但领导的回复让你沮丧又无从下手。'},
      {situation:'你负责的项目到了关键阶段，需要设计部配合出一套视觉方案。你在群里@了设计负责人，对方已读不回了两天。',context:'你的deadline快到了，没有设计稿后续环节全部卡住。你对设计负责人没有管理权。'},
      {situation:'实习生连续三次把同样的低级错误犯到你面前。你当面提醒过、也一对一教过，但下一次还是会犯。',context:'你不想打击他的积极性，但这个错误频率已经影响到团队效率。'},
    ],
    samples:[
      '基础回应："我注意到这是我们第三次临时改期了（观察）。这让我有些困扰（感受），因为项目进度需要你的及时输入（需求）。你能不能看看这周哪两个时间段比较稳定，我们锁定一个？（请求）"',
      '更好回应："我看了你做出来的版本，方向确实和我预期有差异。这不是批评——我想了解是不是需求文档哪里没说清楚？下次关键点加粗标注，或者我们花10分钟过一遍。如果你觉得不明确随时留言，我看到会第一时间回复。一起找到协作的默契，好吗？"',
    ],
  },
  {
    id:'reframe', name:'积极重构', icon:'🔄',
    summary:'把问题框成机会，把冲突转成共识',
    description:'认知重构是心理学核心技术：同一个事实换个叙事框架就能改变反应。不是粉饰太平，而是找到事实中积极、可建设的角度重新描述。',
    detectKeys:['换个角度看','其实','也说明','意味着','另一方面','值得','好消息','反过来','从积极','机会'],
    scenarios:[
      {situation:'你负责的新功能上线后用户数据没涨反跌5%。老板在会上说："这个功能方向是不是有问题？" 全场安静等你回答。',context:'你是产品负责人，功能花了团队两个月，你需要保护团队士气同时回应质疑。'},
      {situation:'客户突然要求把两周交付压缩到五天，说"竞品比你们快多了"。团队成员士气大降，私下说"不可能完成"。',context:'你是项目经理，既要安抚团队，又要给客户积极回应。'},
      {situation:'申请了三个月的外部培训预算，HR回复"今年培训经费砍了50%，申请被拒"。非常失望。',context:'你需要决定如何回应HR，如何调整自己的成长计划。'},
      {situation:'你投入大量精力的项目被公司战略性放弃了。老板说"市场反应不如预期，先停掉"。团队情绪低落。',context:'你是项目核心成员，项目是你半年来的全部心血。你需要面对团队和老板。'},
      {situation:'你在内部竞聘中落选了，当选的是你平时并不认可的同事。几个关系好的人来安慰你，但你觉得更难受了。',context:'你需要回应同事的关心，同时为下一次竞聘做准备。'},
    ],
    samples:[
      '基础回应："数据下跌不是期待的结果，但反过来看，说明用户对新功能有感知——我们触达到他们了。接下来分析是功能问题还是引导问题，这反而是找到用户痛点的机会。"',
      '更好回应："竞品比我们快这个信息很有价值，说明市场需求是真实的。五天确实紧，但让我和团队梳理核心交付和分批上线。如果客户看到第一版的质量和态度，反而是建立信任的机会。我先拉方案明天对齐。"',
    ],
  },
  {
    id:'boundary', name:'温和边界', icon:'🛡️',
    summary:'不伤关系的拒绝，不委屈的坚持',
    description:'高情商不是一味讨好，是在保护边界和维持关系之间找平衡。真正边界表达：明确立场 + 解释原因 + 提供替代方案。',
    detectKeys:['边界','做不到','不方便','不','无法','目前','暂时','替代','另一个','不过','我可以'],
    scenarios:[
      {situation:'周五下午五点领导把30页报告放桌上："周一早上9点前给我"。你今晚答应陪家人，周末也有安排。',context:'你不确定是紧急还是领导习惯压任务，但接了这活周末就泡汤。'},
      {situation:'同事总推工作："你Excel好，这个报表帮我弄一下，我这会儿太忙了"。本周第四次，你自己的工作堆积如山。',context:'你确实Excel好，但发现对方不是不会做而是不想做。'},
      {situation:'朋友介绍了一个合作机会，你评估后发现和方向不匹配。对方非常热情已经帮你约好了下周三见面。',context:'你不想辜负好意，也不想浪费对方时间。'},
      {situation:'团队outing安排在了你预留的周末，组织者说"必须全员参加"。但那两天是你早就订好的重要个人计划。',context:'你不想被贴上不合群的标签，但也不想放弃个人计划。'},
      {situation:'你跳槽后前同事频繁找你问上家项目的资料和对接人，你已配合了几次但对方越问越多，甚至让你"顺手帮忙改个方案"。',context:'你想维持好关系，但你已经不是那个项目的负责人了，这样下去没完没了。'},
    ],
    samples:[
      '基础回应："这份报告周一早上确实很紧。目前我可以在周一中午12点前给你高质量的结果。如需更早，建议数据分析部分拆出来先给关键结论。你觉得哪个方案更合适？"',
      '更好回应："很感谢你信任我的Excel能力。不过我现在三个项目在跑，这周确实没办法帮你深入做报表。我可以花15分钟教你几个公式，解决80%的问题。或者你先把数据给我，我画个模板框架，具体数据你自己填——这样以后你也能用。如何？"',
    ],
  },
  {
    id:'deescalate', name:'冲突降温', icon:'🌡️',
    summary:'让火药味变成建设性对话',
    description:'冲突升温往往来自双方都想赢。有效降温策略：先卸掉对方防御（不争对错），再引导到共同目标。承认合理部分 + 转向共同利益 + 小步尝试。',
    detectKeys:['你说的有道理','我同意','共同目标','我们都','冷静','先不争','回到','重要','理解','的确'],
    scenarios:[
      {situation:'两个部门在复盘会上互相甩锅。市场部说产品部交付质量差，产品部说市场部需求三天两头改。气氛紧张，你是主持人。',context:'你需要在不对任何一方站队的情况下把会议拉回正轨。'},
      {situation:'客户发火："你们承诺的功能一个都没兑现，我当初选你们简直瞎了眼。你给我一个解释！"',context:'你是项目经理，过去两个月交付确实有问题。'},
      {situation:'室友把你放在公共区的东西扔了，你觉得太过分。对方却说"堆那一个月都不收，我以为你不要了"。你现在怒气上涌。',context:'你们关系还不错，但这件事让你觉得不被尊重。'},
      {situation:'你负责的交付出了事故，大客户在全员邮件里抄送了你的老板和老板的老板，质疑你们团队的专业性。',context:'这封邮件被整个管理层看到了，你需要回复但不能激化矛盾。'},
      {situation:'会议上你的方案被同事公开质疑："你这个数据来源有问题吧？我查到的完全不一样。" 现场所有人都看着你。',context:'你对自己的数据有信心，但对方的语气带着明显的挑衅意味。'},
    ],
    samples:[
      '基础回应："我听到了两边的困扰。市场部因频繁改需求确实疲惫，产品部反复修改也消耗了大量精力。现在让我们一起回顾流程，找出最关键的3个卡点，优先解决影响最大的那个，好吗？"',
      '更好回应："我完全理解你的愤怒，那几个功能确实延迟了，这是我们责任，没有借口。但我想说——你还在打这个电话，说明你对我们的期待还在，我也很珍惜这个机会。今天不找理由，我拉真正可交付的计划发你，你先看，不满意再谈。我的目标是让你觉得当初选我们不是错误。"',
    ],
  },
  {
    id:'managing_up', name:'向上沟通', icon:'📊',
    summary:'让领导觉得靠谱的说话方式',
    description:'核心公式：先说结论 → 再说背景 → 给选项和风险 → 请求决策。让领导做选择题而不是问答题。',
    detectKeys:['结论','建议','方案','选项','风险','决策','汇报','进度','数据','成果','下一步'],
    scenarios:[
      {situation:'项目遇到技术难题，延期风险很大。你需要在周报里汇报，又不想让领导觉得找借口。',context:'领导是结果导向的，最讨厌"一堆理由但没有方案"的汇报。'},
      {situation:'你觉得团队加班文化有问题，想跟领导提"减少无效加班"。但领导本人就是加班狂，担心被贴"没奋斗精神"的标签。',context:'你想推动改变，又不想引火烧身。'},
      {situation:'发现一个业务风险，涉及部门不在你管辖范围。需要让领导意识到严重性，又不希望被当成"告状"。',context:'跨部门风险需要领导协调，但要说得体。'},
      {situation:'你被邀请参加高管战略会，需要代表团队汇报上半年的成果和下半年的方向。你在电梯里得知这个安排，距离会议开始只剩15分钟。',context:'你没有PPT，没有准备时间，但这次汇报直接影响下半年的资源分配。'},
      {situation:'领导突然把你叫到办公室："我听说你想离职？" 你确实有在观望外部机会，但还没决定。',context:'这是一个高度敏感的话题，说错一个字就会影响领导的信任。'},
    ],
    samples:[
      '基础回应："汇报A项目进展：已完成70%，但数据对接遇到技术卡点。梳理两个方案——引入外援支持预计增加3天和N万预算；降级交付范围先上线核心功能。倾向方案二，核心价值不受影响。您觉得呢？"',
      '更好回应："关于加班问题，我想从效率角度聊而非态度角度。最近三个月数据：加班时长增长40%，核心产出仅增8%。说明很多加班是被低效流程拖出来的。建议做'无效加班源头分析'——不是让大家少干活，是让时间花在刀刃上。如释放20%有效工作时长，对项目有实质帮助。值得做吗？"',
    ],
  },
  {
    id:'feedback', name:'建设性反馈', icon:'🌱',

const LEVELS = [
  {name:'🌱 新手', min:0, max:100},
  {name:'🌿 练习生', min:100, max:300},
  {name:'🌳 沟通者', min:300, max:600},
  {name:'⭐ 说服者', min:600, max:1000},
  {name:'🌟 共情大师', min:1000, max:1600},
  {name:'👑 沟通艺术家', min:1600, max:99999},
];

// ============================================================
let gameState = {
  mode:'free', currentScene:null, currentScenario:null, isActive:false,
  selectedTechniques:[], history:[], responseStartTime:0, lastResponse:'',
  stats:{totalRounds:0, great:0, good:0, ok:0, meh:0, highScore:0, streak:0, maxStreak:0, totalScore:0, todayRounds:0, todayDate:''},
  sceneStats:{},
};

function loadState() {
  try {
    const saved = localStorage.getItem('eq_trainer_v2');
    if (saved) {
      const data = JSON.parse(saved);
      gameState.stats = {...gameState.stats, ...data.stats};
      gameState.history = data.history||[];
      gameState.sceneStats = data.sceneStats||{};
    }
  } catch(e){}
}
function saveState() {
  try {
    localStorage.setItem('eq_trainer_v2', JSON.stringify({
      stats:gameState.stats, history:gameState.history, sceneStats:gameState.sceneStats,
    }));
  } catch(e){}
}

// ============================================================
function generateScenario(targetId) {
  let pool = EQ_SCENES;
  if (targetId) pool=EQ_SCENES.filter(s=>s.id===targetId);
  else if(gameState.selectedTechniques.length>0) pool=EQ_SCENES.filter(s=>gameState.selectedTechniques.includes(s.id));
  if(pool.length===0) pool=EQ_SCENES;

  const scene=pool[Math.floor(Math.random()*pool.length)];
  const scenario=scene.scenarios[Math.floor(Math.random()*scene.scenarios.length)];
  gameState.currentScene=scene; gameState.currentScenario=scenario; gameState.isActive=true;
  gameState.responseStartTime=Date.now();
}

// ============================================================
function evaluateResponse(response) {
  const scene=gameState.currentScene, r=response.trim(), rl=r.toLowerCase();

  if(r.length<8) {
    return {totalScore:10, levels:{empathy:3,constructive:2,clarity:3,boundary:2},
      tier:'meh',tierText:'回复太简短',
      feedback:'你的回复太短了。试着先理解对方的感受，再说出你的想法。练习的关键不在于"快"，而在于"周全"。',
      sample:scene.samples[1]};
  }

  // 共情力
  let es=0,he=false;
  const ek=['理解','感受','不容易','确实','辛苦','我知道','体会','心情','情绪','感受得到','我能想象','换做是我','站在','角度','谢谢你'];
  let eh=0;
  for(const k of ek) {if(rl.includes(k)){eh++;he=true;}}
  es=Math.min(35,eh*4+(rl.includes('谢谢你')?6:0));
  if(!he)es=Math.max(es,r.length>40?8:4);

  // 建设性
  let cs=0;
  const sk=['建议','方案','解决','可以','一起','下一步','不如','试试','先','调整','计划','安排','沟通','流程','机制'];
  let sh=0;
  for(const k of sk) {if(rl.includes(k))sh++;}
  cs=Math.min(30,sh*3+(r.length>60?5:0)+(r.length>120?5:0));

  // 表达力
  let cls=8+Math.min(12,Math.floor(r.length/20));
  if(r.includes('。')&&r.includes('，'))cls=Math.min(20,cls+3);

  // 边界感
  let bs=6;
  const bk=['不','有限','目前','替代','另一个','暂时','我可以','我能','做不到','没办法','换个','我的','自己'];
  let bh=0;
  for(const k of bk) {if(rl.includes(k))bh++;}
  bs=Math.min(15,6+bh*2);

  // 语气
  const hostile=['傻','蠢','垃圾','废物','脑残','白痴','弱智','有病','放屁','滚','妈的'];
  let hc=0;
  for(const h of hostile) {if(rl.includes(h))hc++;}
  const hp=hc*8;

  const total=Math.max(5,es+cs+cls+bs-hp);

  let tier,tt,fb,si;
  if(total>=80)  {tier='great';tt='大师级沟通';fb='展现真正的共情能力，同时提出了建设性方案。边界清晰、表达得体——完美示范。';si=1;}
  else if(total>=60){tier='good';tt='很好的回应';fb='具备优秀沟通者核心素质。多一点共情（先理解情绪再讲方案），回应会更让人舒服和接受。';si=1;}
  else if(total>=40){tier='ok';tt='基本得体';fb='方向对，没激化矛盾。但缺少共情环节——对方情绪没被"接住"。试先认可感受再给建议。';si=0;}
  else           {tier='meh';tt='还可以更好';fb='还有提升空间。别灰心，沟通力可以练习提升。看下方参考范例，注意如何先处理情绪再处理问题。';si=0;}

  return {totalScore:total, levels:{empathy:es,constructive:cs,clarity:cls,boundary:bs},
    tier,tierText:tt,feedback:fb, sample:scene.samples[si]};
}

// ============================================================
function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._timeout); t._timeout=setTimeout(()=>t.classList.remove('show'),2500);
}

function spawnConfetti() {
  const c=document.getElementById('confetti');
  const colors=['#36d7b7','#f0b429','#3dd68c','#48c6ef','#f98a5b','#a78bfa','#fb7185'];
  const frag=document.createDocumentFragment();
  for(let i=0;i<60;i++) {
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.left=Math.random()*100+'%';
    p.style.top=-(Math.random()*20)+'%';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.width=(6+Math.random()*10)+'px';
    p.style.height=(6+Math.random()*10)+'px';
    p.style.animationDuration=(1.2+Math.random()*1.8)+'s';
    p.style.animationDelay=Math.random()*0.4+'s';
    frag.appendChild(p);
  }
  c.innerHTML=''; c.appendChild(frag);
  setTimeout(()=>{c.innerHTML='';},2500);
}

function getLevel() {
  const ts=gameState.stats.totalScore||0;
  for(let i=LEVELS.length-1;i>=0;i--) {if(ts>=LEVELS[i].min)return LEVELS[i];}
  return LEVELS[0];
}

function updateLevel() {
  const lv=getLevel();
  const next=LEVELS[LEVELS.indexOf(lv)+1]||lv;
  const prog=Math.min(100,((gameState.stats.totalScore||0)-lv.min)/(lv.max-lv.min)*100);
  document.getElementById('lvlName').textContent=lv.name;
  document.getElementById('lvlFill').style.width=prog+'%';
  document.getElementById('lvlProgress').textContent=Math.round(prog)+'%';
}

function updateStats() {
  const s=gameState.stats;
  const total=s.totalRounds;
  const today=new Date().toLocaleDateString('zh-CN');
  if(s.todayDate!==today){s.todayRounds=0; s.todayDate=today;}
  document.getElementById('statRounds').textContent=total;
  document.getElementById('statGreat').textContent=s.great;
  document.getElementById('statAvg').textContent=total>0?Math.round((s.totalScore||0)/total):0;
  document.getElementById('statStreak').textContent=s.streak;
  document.getElementById('statBest').textContent=s.highScore;
  document.getElementById('statToday').textContent='今日 '+s.todayRounds;
  updateLevel();
  updateSceneStats();
}

function updateSceneStats() {
  const el=document.getElementById('sceneStats');
  const ss=gameState.sceneStats;
  const entries=Object.entries(ss).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const map={};
  EQ_SCENES.forEach(s=>{map[s.id]=s;});
  if(entries.length===0){el.innerHTML='';return;}
  el.innerHTML=entries.map(([id,count])=>{
    const s=map[id]; if(!s)return'';
    return`<span class="scene-stat-tag">${s.icon} ${s.name} ×${count}</span>`;
  }).join('');
}

function updateHistory() {
  const list=document.getElementById('historyList');
  const btnClear=document.getElementById('btnClearHistory');
  if(gameState.history.length===0) {
    list.innerHTML='<div style="color:var(--text-dim);text-align:center;padding:28px;font-size:0.85rem;">还没有练习记录，来试试第一题吧！</div>';
    btnClear.style.display='none'; return;
  }
  btnClear.style.display='inline-block';
  const emoji={great:'⭐',good:'✓',ok:'○',meh:'△'};
  const cls={great:'hi-great',good:'hi-good',ok:'hi-ok',meh:'hi-meh'};
  const colors={great:'var(--success)',good:'var(--accent)',ok:'var(--gold)',meh:'var(--warm)'};
  list.innerHTML=gameState.history.slice().reverse().slice(0,50).map(h=>`
    <div class="history-item">
      <div class="hi-result ${cls[h.tier]}">${emoji[h.tier]}</div>
      <div class="hi-info">
        <div class="hi-scene">${h.sceneName}</div>
        <div class="hi-time">${h.time}</div>
      </div>
      <div class="hi-score" style="color:${colors[h.tier]}">${h.score}</div>
    </div>
  `).join('');
}

function clearHistory() {
  if(!confirm('确定要清空所有练习记录吗？此操作不可撤销。'))return;
  gameState.history=[];
  gameState.sceneStats={};
  gameState.stats.totalRounds=0; gameState.stats.great=0; gameState.stats.good=0;
  gameState.stats.ok=0; gameState.stats.meh=0; gameState.stats.highScore=0;
  gameState.stats.streak=0; gameState.stats.maxStreak=0; gameState.stats.totalScore=0;
  gameState.stats.todayRounds=0;
  saveState(); updateStats(); updateHistory();
  showToast('🗑 记录已清空');
}

function copySample(text) {
  navigator.clipboard.writeText(text).then(()=>{showToast('📋 已复制到剪贴板');}).catch(()=>{showToast('复制失败，请手动复制');});
}

function setArenaClass(cls) {
  const a=document.getElementById('arena'); a.classList.remove('active','great');
  if(cls)a.classList.add(cls);
}

function renderScenario() {

  content.innerHTML=`
    <div class="scenario-bubble">
      <div class="scenario-avatar">💬</div>
      <div class="scenario-content">
        <div class="scene-tag">🎯 ${gameState.currentScene.icon} ${gameState.currentScene.name} · ${gameState.currentScene.summary}</div>
        <div class="scene-text">${gameState.currentScenario.situation}</div>
        <div class="scene-context">📌 ${gameState.currentScenario.context}</div>
        <div class="scene-hint">💡 面对这个场景，你会怎么回应？</div>
      </div>
    </div>`;
  setArenaClass('active');
  document.getElementById('responseArea').style.display='block';
  const inp=document.getElementById('responseInput'); inp.value=''; inp.focus();

  document.getElementById('charCount').textContent='0 字';
  gameState.responseStartTime=Date.now();
}

function renderResult(result) {
  const content=document.getElementById('arenaContent');
  const scene=gameState.currentScene;
  const l=result.levels;
  const elapsed=Math.round((Date.now()-gameState.responseStartTime)/1000);
  const timeStr=elapsed<60?elapsed+'秒':Math.floor(elapsed/60)+'分'+(elapsed%60)+'秒';
  const maxScore=Math.max(l.empathy,l.constructive,l.clarity,l.boundary);

  const tierClass=result.tier==='great'?'great':result.tier==='good'?'good':result.tier==='ok'?'ok':'meh';
  const emoji=result.tier==='great'?'🌟':result.tier==='good'?'👏':result.tier==='ok'?'🤔':'🌱';
  const verdictColor=result.tier==='great'?'var(--success)':result.tier==='good'?'var(--accent)':result.tier==='ok'?'var(--gold)':'var(--warm)';

  content.innerHTML=`
    <div class="scenario-bubble">
      <div class="scenario-avatar">💬</div>
      <div class="scenario-content">
        <div class="scene-tag">🎯 ${scene.icon} ${scene.name}</div>
        <div class="scene-text">${gameState.currentScenario.situation}</div>
      </div>
    </div>
    <div class="result-panel">
      <div class="result-header">
        <span style="font-size:2rem;">${emoji}</span>
        <span class="result-score ${tierClass}">${result.totalScore}</span>
        <span style="font-size:0.8rem;color:var(--text-muted);">/ 100</span>
        <span class="result-verdict" style="color:${verdictColor};margin-left:auto;">${result.tierText}</span>
      </div>
      <div class="result-breakdown">
        <div class="result-item">
          <div class="ri-score">${l.empathy}</div>
          <div class="ri-bar"><div class="ri-bar-fill" style="width:${(l.empathy/35*100)}%"></div></div>
          <div class="ri-label">共情力</div>
        </div>
        <div class="result-item">
          <div class="ri-score">${l.constructive}</div>
          <div class="ri-bar"><div class="ri-bar-fill" style="width:${(l.constructive/30*100)}%"></div></div>
          <div class="ri-label">建设性</div>
        </div>
        <div class="result-item">
          <div class="ri-score">${l.clarity}</div>
          <div class="ri-bar"><div class="ri-bar-fill" style="width:${(l.clarity/20*100)}%"></div></div>
          <div class="ri-label">表达力</div>
        </div>
        <div class="result-item">
          <div class="ri-score">${l.boundary}</div>
          <div class="ri-bar"><div class="ri-bar-fill" style="width:${(l.boundary/15*100)}%"></div></div>
          <div class="ri-label">边界感</div>
        </div>
      </div>
      <div class="result-my-response">
        <div class="rmr-label">📝 你的回应：</div>
        ${gameState.lastResponse||'(无内容)'}
      </div>
      <div class="result-feedback">${result.feedback}</div>
      <div style="font-size:0.75rem;color:var(--text-muted);margin:10px 0 4px;">
        场景类型：<span style="color:var(--accent);font-weight:700;">${scene.icon} ${scene.name} · ${scene.summary}</span>
      </div>
      <div class="result-sample">
        <span style="display:block;font-size:0.75rem;color:var(--text-dim);margin-bottom:8px;">💡 参考范例</span>
        ${result.sample}
        <button class="copy-btn" onclick="copySample(\`${result.sample.replace(/`/g,'\\`').replace(/\\/g,'\\\\')}\`)">📋 复制</button>
      </div>
      <div class="result-time">⏱ 用时 ${timeStr}</div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="nextRound()">✨ 再来一题</button>
        <button class="btn btn-secondary btn-sm" onclick="showEncyclopediaForScene('${scene.id}')">📖 技巧详情</button>
      </div>
    </div>`;
  setArenaClass(result.tier==='great'?'great':result.tier==='good'?'active':'');

  const s=gameState.stats;
  s.totalRounds++; s.todayRounds++;
  if(result.tier==='great'){s.great++;s.streak++;}
  else if(result.tier==='good'){s.good++;s.streak++;}
  else if(result.tier==='ok'){s.ok++;s.streak=0;}
  else{s.meh++;s.streak=0;}
  if(s.streak>s.maxStreak)s.maxStreak=s.streak;
  if(result.totalScore>s.highScore)s.highScore=result.totalScore;
  s.totalScore=(s.totalScore||0)+result.totalScore;

  const sid=scene.id;
  gameState.sceneStats[sid]=(gameState.sceneStats[sid]||0)+1;

  const now=new Date();
  gameState.history.push({
    time:`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
    sceneName:scene.name,tier:result.tier,score:result.totalScore,
  });

  saveState();updateStats();updateHistory();
  document.getElementById('responseArea').style.display='none';

  if(result.tier==='great'){spawnConfetti();showToast('🌟 大师级回复！完美的共情与建设性！');}
  else if(result.tier==='good')showToast('👏 很好的回应！继续保持！');
  else if(result.tier==='ok')showToast('🤔 方向对但缺共情，看看范例吧');
  else showToast('🌱 没关系，每次练习都在成长！');
}

function renderEncyclopedia(filter) {
  const content=document.getElementById('arenaContent');
  const f=(filter||'').toLowerCase();
  let scenes=EQ_SCENES;
  if(f) scenes=EQ_SCENES.filter(s=>s.name.includes(f)||s.summary.includes(f)||s.description.includes(f));

  content.innerHTML=`
    <input class="ency-search" id="encySearch" type="text" placeholder="🔍 搜索技巧（如：共情、边界、冲突…）" value="${filter||''}" oninput="renderEncyclopedia(this.value)">
    <div class="encyclopedia-list">
      ${scenes.map(s=>`
        <div class="ency-entry" id="ency-${s.id}">
          <div class="ency-header" onclick="toggleEncyclopedia('${s.id}')">
            <span>${s.icon} ${s.name} · <span style="color:var(--accent);font-weight:400;">${s.summary}</span></span>
            <span style="color:var(--text-dim);font-size:0.8rem;">展开 ▼</span>
          </div>
          <div class="ency-body">
            <p style="margin-bottom:12px;color:var(--text);">${s.description}</p>
            <div class="eny-section">
              <strong>📌 典型场景：</strong>
              <div class="eny-example">${s.scenarios[0].situation}</div>
            </div>
            <div class="eny-section">
              <strong>✨ 参考回应：</strong>
              <div class="eny-sample">${s.samples[0]}</div>
            </div>
            <div style="margin-top:12px;">
              <button class="btn btn-secondary btn-sm" onclick="startTargetedForScene('${s.id}')">🎯 专项训练</button>
            </div>
          </div>
        </div>
      `).join('')}
      ${scenes.length===0?'<div style="text-align:center;padding:40px;color:var(--text-dim);">没有匹配的技巧，试试其他关键词</div>':''}
    </div>`;
  setArenaClass('');
  document.getElementById('responseArea').style.display='none';
  document.getElementById('targetedPanel').style.display='none';
}

function toggleEncyclopedia(id) {
  const el=document.getElementById('ency-'+id);
  el.classList.toggle('open');
  el.querySelector('.ency-header span:last-child').textContent=el.classList.contains('open')?'收起 ▲':'展开 ▼';
}

function showEncyclopediaForScene(id) {
  switchMode('encyclopedia');
  setTimeout(()=>{
    const el=document.getElementById('ency-'+id);
    if(el){el.classList.add('open');el.scrollIntoView({behavior:'smooth',block:'center'});
    el.querySelector('.ency-header span:last-child').textContent='收起 ▲';}
  },300);
}

function renderEmptyArena() {
  const content=document.getElementById('arenaContent');
  content.innerHTML=`
    <div class="arena-empty">
      <span class="empty-icon">💬</span>
      <div class="empty-title">每次对话都是一次练习</div>
      <div class="empty-desc">AI 将为你呈现真实的职场沟通困境<br>试着用高情商的方式回应，系统会从四个维度给你评分和建议</div>
    </div>`;
  setArenaClass('');
  document.getElementById('responseArea').style.display='none';
  document.getElementById('targetedPanel').style.display='none';
}

function renderTechniqueGrid() {
  const grid=document.getElementById('techniqueGrid');
  grid.innerHTML=EQ_SCENES.map(s=>`
    <button class="technique-chip ${gameState.selectedTechniques.includes(s.id)?'selected':''}"
      onclick="toggleTechniqueSelection('${s.id}')">
      ${s.icon} ${s.name}
    </button>
  `).join('');
}

function switchMode(mode) {
  gameState.mode=mode;gameState.isActive=false;gameState.selectedTechniques=[];
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.mode-tab[data-mode="${mode}"]`).classList.add('active');
  if(mode==='free'){renderEmptyArena();document.getElementById('targetedPanel').style.display='none';}
  else if(mode==='targeted'){renderEmptyArena();renderTechniqueGrid();document.getElementById('targetedPanel').style.display='block';}
  else if(mode==='encyclopedia'){renderEncyclopedia();document.getElementById('targetedPanel').style.display='none';}
}

function startRound() {
  if(gameState.mode==='encyclopedia')switchMode('free');
  if(gameState.mode==='targeted'&&gameState.selectedTechniques.length===0){showToast('请先选择至少一个场景类型');return;}
  if(gameState.mode==='targeted'){
    const id=gameState.selectedTechniques[Math.floor(Math.random()*gameState.selectedTechniques.length)];
    generateScenario(id);
  }else{generateScenario();}
  renderScenario();
}

function startTargetedForScene(id) {
  gameState.selectedTechniques=[id];switchMode('targeted');renderTechniqueGrid();
  generateScenario(id);renderScenario();
}

function startTargetedRound() {
  if(gameState.selectedTechniques.length===0){showToast('请先选择至少一个场景类型');return;}
  startRound();
}

function submitResponse() {
  if(!gameState.isActive)return;
  const input=document.getElementById('responseInput');
  gameState.lastResponse=input.value;
  document.getElementById('btnSubmit').disabled=true;
  const result=evaluateResponse(input.value);
  renderResult(result);gameState.isActive=false;
}

function skipRound() {
  if(!gameState.isActive)return;
  gameState.lastResponse='（已跳过）';
  const result={totalScore:0,levels:{empathy:0,constructive:0,clarity:2,boundary:2},
    tier:'meh',tierText:'已跳过',
    feedback:'你选择了跳过。没关系，看看下方的参考范例，学习在这种场景下如何用高情商的方式回应。每次模仿都是一次进步。',
    sample:gameState.currentScene.samples[1]};
  renderResult(result);gameState.isActive=false;
}

function nextRound(){startRound();}

function toggleTechniqueSelection(id) {
  const idx=gameState.selectedTechniques.indexOf(id);
  if(idx>-1)gameState.selectedTechniques.splice(idx,1);
  else gameState.selectedTechniques.push(id);
  renderTechniqueGrid();
}

document.addEventListener('keydown',(e)=>{
  if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();if(gameState.isActive)submitResponse();else startRound();}
  if(e.key==='Enter'&&!e.ctrlKey&&!e.shiftKey&&gameState.isActive){
    const input=document.getElementById('responseInput');
    if(document.activeElement===input){e.preventDefault();submitResponse();}
  }
});

document.getElementById('responseInput').addEventListener('input',function(){
  const len=this.value.length;
  const cc=document.getElementById('charCount');
  cc.textContent=len+' 字';
  if(len>300)cc.classList.add('warn');else cc.classList.remove('warn');
});

document.querySelectorAll('.mode-tab').forEach(tab=>{
  tab.addEventListener('click',()=>switchMode(tab.dataset.mode));
});

window.startRound=startRound;window.submitResponse=submitResponse;
window.skipRound=skipRound;window.nextRound=nextRound;
window.toggleTechniqueSelection=toggleTechniqueSelection;
window.toggleEncyclopedia=toggleEncyclopedia;
window.showEncyclopediaForScene=showEncyclopediaForScene;
window.startTargetedForScene=startTargetedForScene;
window.startTargetedRound=startTargetedRound;
window.switchMode=switchMode;window.copySample=copySample;
window.clearHistory=clearHistory;window.renderEncyclopedia=renderEncyclopedia;

loadState();updateStats();updateHistory();
setTimeout(()=>startRound(),700);
</script>

</body>
</html>
