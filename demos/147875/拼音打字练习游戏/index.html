<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼音打字练习</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="start-screen active" id="start-screen">
            <h1>拼音打字练习</h1>
            
            <div class="difficulty-selector">
                <button class="difficulty-btn easy selected" data-level="easy">初级</button>
                <button class="difficulty-btn medium" data-level="medium">中级</button>
                <button class="difficulty-btn hard" data-level="hard">高级</button>
            </div>

            <div class="difficulty-info" id="difficulty-info">简单汉字，每字10秒，共20字</div>

            <button class="start-btn" id="start-btn">开始游戏</button>
        </div>

        <div class="game-screen" id="game-screen">
            <div class="game-header">
                <div class="timer">
                    <span id="timer">10</span>
                </div>
                <div class="level">
                    <span id="current-level">1/20</span>
                </div>
                <div class="score">
                    <span id="score">0</span>
                </div>
            </div>

            <div class="character-display" id="character-display">字</div>

            <input type="text" class="pinyin-input" id="pinyin-input" placeholder="输入拼音..." autocomplete="off">

            <div class="feedback" id="feedback"></div>
        </div>

        <div class="end-screen" id="end-screen">
            <h2>游戏结束</h2>
            
            <div class="final-stats">
                <div class="stat-item">
                    <div class="stat-value" id="final-score">0</div>
                    <div class="stat-label">得分</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="final-accuracy">0%</div>
                    <div class="stat-label">正确率</div>
                </div>
            </div>

            <button class="restart-btn" id="restart-btn">再玩一次</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
