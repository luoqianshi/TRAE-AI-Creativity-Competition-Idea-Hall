<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>今日灵感罐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body {
            background: linear-gradient(145deg, #f7f0e6, #e8dccc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 32px 24px 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
            text-align: center;
        }
        h1 {
            font-size: 26px;
            font-weight: 600;
            color: #3d2c1f;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .sub {
            color: #7f6b58;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .jar-icon {
            font-size: 72px;
            margin: 10px 0 16px;
            display: block;
        }
        .scene-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .scene-btn {
            background: #ede4d9;
            border: none;
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 14px;
            color: #3d2c1f;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        .scene-btn.active {
            background: #b48b6a;
            color: #fff;
        }
        .btn-shake {
            background: #b48b6a;
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            padding: 18px 32px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px 0 #7a5f47;
            transition: 0.1s ease;
            width: 100%;
            letter-spacing: 1px;
        }
        .btn-shake:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #7a5f47;
        }
        .inspiration-box {
            margin-top: 28px;
            background: #fff9f2;
            border-radius: 28px;
            padding: 24px 18px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid #e6d6c4;
        }
        .inspiration-title {
            font-size: 18px;
            font-weight: 600;
            color: #3d2c1f;
            margin-bottom: 6px;
        }
        .inspiration-desc {
            font-size: 15px;
            color: #5a4a38;
            line-height: 1.6;
        }
        .tag {
            display: inline-block;
            background: #ebdccf;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 12px;
            color: #5a4a38;
            margin-top: 12px;
        }
        .footer-note {
            margin-top: 24px;
            font-size: 12px;
            color: #a28d7a;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="jar-icon">🏺</span>
        <h1>今日灵感罐</h1>
        <p class="sub">选个场景 · 摇出专属惊喜</p>
        <div class="scene-selector">
            <button class="scene-btn active" data-scene="eat">🍜 吃什么</button>
            <button class="scene-btn" data-scene="go">🚶 去哪玩</button>
            <button class="scene-btn" data-scene="do">🎯 做什么</button>
        </div>
        <button class="btn-shake" id="shakeBtn">✨ 摇一摇</button>
        <div class="inspiration-box" id="inspirationBox">
            <div class="inspiration-title" id="ideaTitle">选择场景，点击摇一摇</div>
            <div class="inspiration-desc" id="ideaDesc">AI 为你匹配今日灵感</div>
            <span class="tag" id="ideaTag">🍃 生活灵感</span>
        </div>
        <p class="footer-note">⭐ 收藏你喜欢的灵感</p>
    </div>
    <script>
        const ideas = {
            eat: [
                { title: "🍜 吃碗暖胃的汤面", desc: "去附近那家你一直路过的兰州拉面，加个蛋，慢慢吃", tag: "🍜 面食" },
                { title: "🥗 试试轻食沙拉", desc: "换换口味，点一份你从来没试过的鸡胸肉沙拉", tag: "🥗 健康" },
                { title: "🍲 自己煮个小火锅", desc: "下班去超市买点肥牛和蔬菜，回家涮个一人食", tag: "🍲 自制" },
                { title: "🍣 打卡日料店", desc: "搜一下附近评分高的日料，点一份鳗鱼饭或刺身", tag: "🍣 日料" },
                { title: "🌮 找家墨西哥餐厅", desc: "尝试塔可或牛油果酱，感受异国风情", tag: "🌮 异国" },
                { title: "🥘 吃顿东南亚菜", desc: "冬阴功汤或咖喱蟹，酸辣开胃", tag: "🥘 东南亚" },
                { title: "🍕 点一份超薄底披萨", desc: "选个你从未试过的奇葩口味，比如榴莲或芝麻菜", tag: "🍕 西餐" },
                { title: "🥟 去老字号吃小吃", desc: "找一家开了几十年的小店，点招牌包子或锅贴", tag: "🥟 传统" },
                { title: "🍱 尝试素食便当", desc: "点一份全素食的便当，看看能不能吃出惊喜", tag: "🥗 素食" },
                { title: "🍜 来碗越南河粉", desc: "找一家越南餐厅，点一碗火车头河粉，加青柠", tag: "🍜 东南亚" },
                { title: "🧀 自己做奶酪三明治", desc: "买点好面包和奶酪，烤一个外酥里嫩的热压三明治", tag: "🧀 自制" },
                { title: "🍣 尝试一次omakase", desc: "如果预算允许，去一家omakase，让厨师决定你今天吃什么", tag: "🍣 日料" },
                { title: "🍜 吃一碗麻辣烫", desc: "选一堆你平时不常加的食材，放重辣，过瘾", tag: "🌶️ 麻辣" },
                { title: "🥪 打卡网红brunch", desc: "找一家周末排队的brunch店，点班尼迪克蛋", tag: "🥪 西餐" }
            ],
            go: [
                { title: "🚶 走一条没走过的路", desc: "提前一站下地铁，步行回家，看看路边新开的小店", tag: "🚶 散步" },
                { title: "🌳 去一个没去过的公园", desc: "在地图上随机选一个绿色区域，带上水杯出发", tag: "🌳 户外" },
                { title: "🏛️ 逛一家小众博物馆", desc: "搜一下城市里的冷门博物馆（比如钟表、相机、邮票）", tag: "🏛️ 文化" },
                { title: "🚲 骑共享单车沿河兜风", desc: "扫一辆车，沿着河边骑行半小时，吹吹风", tag: "🚲 骑行" },
                { title: "🛍️ 探访老城区菜市场", desc: "去最老的菜市场，买点没见过的新奇蔬菜", tag: "🛍️ 市井" },
                { title: "📚 去一家独立书店", desc: "找一家小众书店，翻一本你从未涉及领域的书", tag: "📚 文艺" },
                { title: "🧵 逛逛手工材料店", desc: "即使不买，看看各种布料、珠子也能激发灵感", tag: "🧵 手工" },
                { title: "🌄 去城市制高点", desc: "登上电视塔或高楼观景台，看一次日落", tag: "🌄 观景" },
                { title: "⛲ 探访大学校园", desc: "去你所在城市最老的大学，感受书卷气", tag: "⛲ 校园" },
                { title: "🚢 坐一趟轮渡", desc: "如果有水，坐一趟轮渡，从水上看看城市", tag: "🚢 水上游" },
                { title: "🌿 去植物园", desc: "专门去看多肉或热带植物，拍照很出片", tag: "🌿 自然" },
                { title: "🏘️ 逛一条老巷子", desc: "找一条历史悠久的巷子，看看老建筑和涂鸦", tag: "🏘️ 人文" },
                { title: "🎨 去免费画展", desc: "搜一下城市画廊正在展出的免费展览，假装懂艺术", tag: "🎨 艺术" },
                { title: "🚶 夜游滨江路", desc: "晚上去江边或湖边散步，看夜景灯光", tag: "🌃 夜景" }
            ],
            do: [
                { title: "📖 读一首短诗", desc: "翻开你书架里最薄的那本书，读一首诗，然后分享给一个人", tag: "📚 文艺" },
                { title: "🎧 听一张全专", desc: "找一张你喜欢的歌手的旧专辑，从头听到尾，不准切歌", tag: "🎵 音乐" },
                { title: "🧘 做5分钟冥想", desc: "关掉屏幕，闭上眼睛，专注呼吸5分钟，感受当下", tag: "🧘 自我" },
                { title: "📝 写三件今日好事", desc: "拿出手机备忘录，写下今天发生的三件微小好事", tag: "✍️ 记录" },
                { title: "🌿 整理一个角落", desc: "把你书桌或床头柜整理干净，扔掉一件不需要的东西", tag: "🧹 整理" },
                { title: "📺 看一集老动画", desc: "重温《猫和老鼠》或《哆啦A梦》一集，找回童心", tag: "📺 怀旧" },
                { title: "🎨 画一幅涂鸦", desc: "随便找张纸，乱画几分钟，不追求好看", tag: "🎨 创作" },
                { title: "📞 给老朋友打个电话", desc: "拨一个很久没联系的号码，聊10分钟近况", tag: "📞 社交" },
                { title: "🧩 拼一张拼图", desc: "如果家里有拼图，拿出来拼30分钟，放松大脑", tag: "🧩 专注" },
                { title: "💃 跳一支舞", desc: "放一首你喜欢的快歌，独自乱跳3分钟，释放情绪", tag: "💃 运动" },
                { title: "📖 读一篇短篇小说", desc: "找一位你喜欢的作家的短篇，一口气读完", tag: "📖 阅读" },
                { title: "🌱 种一颗种子", desc: "找颗豆子或花种，种进花盆，每天浇水观察", tag: "🌱 园艺" },
                { title: "♨️ 泡一次脚", desc: "用热水泡脚，加几片姜或艾草，放松15分钟", tag: "♨️ 放松" },
                { title: "📸 拍一组主题照片", desc: "定一个主题（比如"蓝色"），在房间里找10个相关物品拍下来", tag: "📸 摄影" },
                { title: "🧶 学一个绳结", desc: "上网搜一个绳结教程（比如称人结），亲手打一个", tag: "🧶 手工" }
            ]
        };

        let currentScene = 'eat';
        const sceneBtns = document.querySelectorAll('.scene-btn');
        const btn = document.getElementById('shakeBtn');
        const titleEl = document.getElementById('ideaTitle');
        const descEl = document.getElementById('ideaDesc');
        const tagEl = document.getElementById('ideaTag');

        sceneBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                sceneBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentScene = this.dataset.scene;
                updateIdea();
            });
        });

        function updateIdea() {
            const list = ideas[currentScene];
            const random = list[Math.floor(Math.random() * list.length)];
            titleEl.textContent = random.title;
            descEl.textContent = random.desc;
            tagEl.textContent = random.tag;
            const box = document.getElementById('inspirationBox');
            box.style.transition = '0.15s';
            box.style.transform = 'scale(0.96)';
            setTimeout(() => { box.style.transform = 'scale(1)'; }, 150);
        }

        btn.addEventListener('click', updateIdea);
        window.onload = updateIdea;
    </script>
</body>
</html>
