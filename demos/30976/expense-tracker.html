    body {

    label {

    input, select {
      padding: 0.6rem 0.75rem;

    th, td {

    }

    }

    .amount {
      font-weight: 700;
      color: var(--danger);
    }

    .category-badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #e0e7ff;
      color: #4338ca;
    }

    .category-badge.餐饮 { background: #fee2e2; color: #b91c1c; }
    .category-badge.交通 { background: #dbeafe; color: #1d4ed8; }
    .category-badge.购物 { background: #dcfce7; color: #15803d; }
    .category-badge.娱乐 { background: #f3e8ff; color: #7c3aed; }
    .category-badge.居住 { background: #fef3c7; color: #b45309; }
    .category-badge.医疗 { background: #fce7f3; color: #be185d; }
    .category-badge.教育 { background: #ccfbf1; color: #0f766e; }
    .category-badge.其他 { background: #f3f4f6; color: #4b5563; }

    .actions {
      display: flex;
      gap: 0.4rem;
    }

    .actions .btn {
      padding: 0.35rem 0.6rem;
      font-size: 0.75rem;
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 0.5rem;
      opacity: 0.5;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;

      z-index: 1000;

    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg2);
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .modal h3 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .modal .form-group {
      margin-bottom: 0.75rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 1rem;
    }

    @media (max-width: 600px) {
      .summary-cards { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      th, td { padding: 0.55rem 0.5rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>日常花销记录</h1>
      <p>轻松记录每一笔支出，掌握消费动态</p>
    </header>

    <div class="summary-cards">
      <div class="summary-card total">
        <div class="label">总支出</div>
        <div class="value" id="totalAmount">¥0.00</div>
      </div>
      <div class="summary-card count">
        <div class="label">笔数</div>
        <div class="value" id="totalCount">0</div>
      </div>
      <div class="summary-card avg">
        <div class="label">平均</div>
        <div class="value" id="avgAmount">¥0.00</div>
      </div>
    </div>

    <div class="form-section">
      <h2>记一笔</h2>
      <form id="expenseForm">
        <div class="form-row">
          <div class="form-group">
            <label for="date">日期</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label for="category">分类</label>
            <select id="category" required>
              <option value="">请选择</option>
              <option value="餐饮">餐饮</option>
              <option value="交通">交通</option>
              <option value="购物">购物</option>
              <option value="娱乐">娱乐</option>
              <option value="居住">居住</option>
              <option value="医疗">医疗</option>
              <option value="教育">教育</option>
              <option value="其他">其他</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="amount">金额 (元)</label>
            <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
          </div>
          <div class="form-group">
            <label for="item">项目</label>
            <input type="text" id="item" placeholder="例如：午餐、打车" required>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">添加记录</button>
          <button type="reset" class="btn btn-secondary">重置</button>
        </div>
      </form>
    </div>

    <div class="list-section">
      <h2>支出明细</h2>
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="搜索项目...">
        <select id="filterCategory">
          <option value="">全部分类</option>
          <option value="餐饮">餐饮</option>
          <option value="交通">交通</option>
          <option value="购物">购物</option>
          <option value="娱乐">娱乐</option>
          <option value="居住">居住</option>
          <option value="医疗">医疗</option>
          <option value="教育">教育</option>
          <option value="其他">其他</option>
        </select>
        <input type="date" id="filterDate" placeholder="筛选日期">
      </div>
      <div class="expense-table-wrap">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>分类</th>
              <th>项目</th>
              <th>金额</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="expenseTableBody">
            <!-- 动态填充 -->
          </tbody>
        </table>
      </div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="M9 14h.01"/><path d="M9 17h.01"/><path d="M12 14h.01"/><path d="M12 17h.01"/><path d="M15 14h.01"/><path d="M15 17h.01"/></svg>
        <p>暂无记录，快去记一笔吧！</p>
      </div>
    </div>
  </div>

  <!-- 编辑弹窗 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3>编辑记录</h3>
      <form id="editForm">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label for="editDate">日期</label>
          <input type="date" id="editDate" required>
        </div>
        <div class="form-group">
          <label for="editCategory">分类</label>
          <select id="editCategory" required>
            <option value="">请选择</option>
            <option value="餐饮">餐饮</option>
            <option value="交通">交通</option>
            <option value="购物">购物</option>
            <option value="娱乐">娱乐</option>
            <option value="居住">居住</option>
            <option value="医疗">医疗</option>
            <option value="教育">教育</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="form-group">
          <label for="editItem">项目</label>
          <input type="text" id="editItem" required>
        </div>
        <div class="form-group">
          <label for="editAmount">金额 (元)</label>
          <input type="number" id="editAmount" step="0.01" min="0.01" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
          <button type="submit" class="btn btn-success">保存修改</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function() {
      const STORAGE_KEY = 'expense_tracker_data';

      function loadData() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch {
          return [];
        }
      }

      function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function formatMoney(n) {
        return '¥' + Number(n).toFixed(2);
      }

      function formatDate(d) {
        return d;
      }

      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      let expenses = loadData();

      // 默认日期为今天
      document.getElementById('date').valueAsDate = new Date();

      const tableBody = document.getElementById('expenseTableBody');
      const emptyState = document.getElementById('emptyState');
      const totalAmountEl = document.getElementById('totalAmount');
      const totalCountEl = document.getElementById('totalCount');
      const avgAmountEl = document.getElementById('avgAmount');

      function updateSummary(list) {
        const total = list.reduce((s, e) => s + Number(e.amount), 0);
        const count = list.length;
        totalAmountEl.textContent = formatMoney(total);
        totalCountEl.textContent = count;
        avgAmountEl.textContent = formatMoney(count ? total / count : 0);
      }

      function renderTable(list) {
        tableBody.innerHTML = '';
        if (list.length === 0) {
          emptyState.style.display = 'block';
          updateSummary(list);
          return;
        }
        emptyState.style.display = 'none';

        // 按日期降序
        const sorted = list.slice().sort((a, b) => b.date.localeCompare(a.date));

        sorted.forEach(exp => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${formatDate(exp.date)}</td>
            <td><span class="category-badge ${exp.category}">${exp.category}</span></td>
            <td>${exp.item}</td>
            <td class="amount">${formatMoney(exp.amount)}</td>
            <td>
              <div class="actions">
                <button class="btn btn-primary" onclick="openEdit('${exp.id}')">编辑</button>
                <button class="btn btn-danger" onclick="deleteExpense('${exp.id}')">删除</button>
              </div>
            </td>
          `;
          tableBody.appendChild(tr);
        });

        updateSummary(list);
      }

      function getFiltered() {
        const search = document.getElementById('searchInput').value.trim().toLowerCase();
        const cat = document.getElementById('filterCategory').value;
        const date = document.getElementById('filterDate').value;
        return expenses.filter(e => {
          if (search && !e.item.toLowerCase().includes(search)) return false;
          if (cat && e.category !== cat) return false;
          if (date && e.date !== date) return false;
          return true;
        });
      }

      // 添加
      document.getElementById('expenseForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const date = document.getElementById('date').value;
        const category = document.getElementById('category').value;
        const amount = parseFloat(document.getElementById('amount').value);
        const item = document.getElementById('item').value.trim();
        if (!date || !category || !amount || !item) return;

        expenses.push({ id: uid(), date, category, amount, item });
        saveData(expenses);
        renderTable(getFiltered());
        this.reset();
        document.getElementById('date').valueAsDate = new Date();
      });

      // 筛选
      ['searchInput', 'filterCategory', 'filterDate'].forEach(id => {
        document.getElementById(id).addEventListener('input', () => renderTable(getFiltered()));
      });

      // 删除
      window.deleteExpense = function(id) {
        if (!confirm('确定要删除这条记录吗？')) return;
        expenses = expenses.filter(e => e.id !== id);
        saveData(expenses);
        renderTable(getFiltered());
      };

      // 编辑弹窗
      const editModal = document.getElementById('editModal');

      window.openEdit = function(id) {
        const exp = expenses.find(e => e.id === id);
        if (!exp) return;
        document.getElementById('editId').value = exp.id;
        document.getElementById('editDate').value = exp.date;
        document.getElementById('editCategory').value = exp.category;
        document.getElementById('editItem').value = exp.item;
        document.getElementById('editAmount').value = exp.amount;
        editModal.classList.add('active');
      };

      window.closeModal = function() {
        editModal.classList.remove('active');
      };

      document.getElementById('editForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = document.getElementById('editId').value;
        const exp = expenses.find(e => e.id === id);
        if (!exp) return;
        exp.date = document.getElementById('editDate').value;
        exp.category = document.getElementById('editCategory').value;
        exp.item = document.getElementById('editItem').value.trim();
        exp.amount = parseFloat(document.getElementById('editAmount').value);
        saveData(expenses);
        renderTable(getFiltered());
        closeModal();
      });

      // 点击遮罩关闭弹窗
      editModal.addEventListener('click', function(e) {
        if (e.target === editModal) closeModal();
      });

      // 初始渲染
      renderTable(expenses);
    })();
  </script>
</body>
</html>
