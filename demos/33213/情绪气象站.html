<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#7C7CF5">
<link rel="manifest" href="manifest.json">
<title>情绪气象站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#F0EFFA;--surface:#FFF;--primary:#7C7CF5;--primary-light:#A78BFA;--text:#1A1A2E;--text2:#6B6B89;--r:16px;--nav-h:64px;--sunny:#F9C74F;--cloudy:#90A4AE;--rainy:#64B5F6;--stormy:#5C6BC0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--surface);position:relative;overflow:hidden}
@media(min-width:481px){#app{margin:0 auto;border-radius:24px;height:90vh;margin-top:5vh}}
.hdr{text-align:center;padding:14px 20px 6px;flex-shrink:0}
.hdr h1{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr .sub{font-size:11px;color:var(--text2);margin-top:1px}
.pc{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;padding:0 16px 16px;opacity:0;transform:translateY(12px);transition:all .35s ease;pointer-events:none}
.page.active{opacity:1;transform:translateY(0);pointer-events:auto}
.page::-webkit-scrollbar{display:none}

/* Mood grid */
#mg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:6px}
.mc{background:var(--bg);border-radius:var(--r);padding:16px 8px 12px;text-align:center;cursor:pointer;transition:.2s;border:2px solid transparent}
.mc:active{transform:scale(.93)}
.mc .e{font-size:32px;display:block}
.mc .l{font-size:13px;font-weight:600;margin-top:4px}
.mc .d{font-size:10px;color:var(--text2);margin-top:1px}
.mc[data-m="sunny"].s,.mc[data-m="sunny"]:hover{background:#FFF8E1;border-color:var(--sunny)}
.mc[data-m="c-sunny"].s,.mc[data-m="c-sunny"]:hover{background:#F1F8E9;border-color:#AED581}
.mc[data-m="cloudy"].s,.mc[data-m="cloudy"]:hover{background:#ECEFF1;border-color:var(--cloudy)}
.mc[data-m="rainy"].s,.mc[data-m="rainy"]:hover{background:#E3F2FD;border-color:var(--rainy)}
.mc[data-m="stormy"].s,.mc[data-m="stormy"]:hover{background:#EDE7F6;border-color:var(--stormy)}

/* Response */
#ra{display:none;margin-top:12px}
#ra.show{display:block}
#rc{background:linear-gradient(135deg,#F3E8FF,#E8F0FE);border-radius:var(--r);padding:20px;text-align:center}
#rc .wi{font-size:42px;display:block;margin-bottom:8px}
#rc .msg{font-size:15px;line-height:1.7;font-weight:500}
#rc .sub{font-size:12px;color:var(--text2);margin-top:8px;line-height:1.5}
#rc .tt{font-size:10px;background:rgba(124,124,245,.1);color:var(--primary);padding:2px 10px;border-radius:10px;display:inline-block;margin-top:6px}
#rf{background:none;border:1px solid #D0D0E8;color:var(--text2);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;margin-top:8px;transition:.2s;display:inline-flex;align-items:center;gap:4px}
#rf:active{background:var(--bg)}

/* Actions */
.ab{display:flex;gap:8px;margin-top:10px}
.ab button{flex:1;border:none;border-radius:12px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
.ab button:active{opacity:.7}
.bp{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff}
.bs{background:var(--bg);color:var(--text)}
#na{display:none;margin-top:10px}
#na.show{display:block}
#na textarea{width:100%;border:2px solid #E8E8F0;border-radius:12px;padding:10px 12px;font-size:13px;resize:none;height:54px;font-family:inherit;background:var(--bg);color:var(--text);outline:none}
#na textarea:focus{border-color:var(--primary-light)}

/* Tree */
.tsc{text-align:center;padding:10px 0 6px}
.tst{display:flex;justify-content:center;gap:20px;font-size:12px;color:var(--text2);margin-bottom:8px}
.tst span strong{color:var(--primary);font-size:16px}
.tcv{width:220px;height:240px;margin:0 auto;position:relative;display:flex;align-items:flex-end;justify-content:center}
.ttr{width:24px;height:60px;background:linear-gradient(90deg,#8D6E63,#A1887F,#8D6E63);border-radius:4px 4px 8px 8px;position:absolute;bottom:20px;z-index:1}
.tf{position:absolute;border-radius:50%;z-index:2;transition:all .6s ease}
.tf.l0{display:none}
.tf.l1{width:30px;height:30px;background:radial-gradient(circle at 40% 40%,#81C784,#388E3C);bottom:70px;left:95px}
.tf.l2{width:60px;height:52px;border-radius:50% 50% 40% 40%;background:radial-gradient(circle at 40% 35%,#A5D6A7,#43A047);bottom:80px;left:80px}
.tf.l3{width:90px;height:70px;border-radius:50% 50% 40% 40%;background:radial-gradient(circle at 35% 30%,#C8E6C9,#2E7D32);bottom:92px;left:65px}
.tf.l4{width:130px;height:90px;border-radius:50% 50% 40% 40%;background:radial-gradient(circle at 30% 25%,#E8F5E9,#1B5E20);bottom:100px;left:45px}
.tf.l5{width:160px;height:100px;border-radius:50% 50% 40% 40%;background:radial-gradient(circle at 30% 20%,#F1F8E9,#1B5E20);bottom:108px;left:30px}
.tfl{position:absolute;z-index:3;pointer-events:none;display:none}
.tfl.show{display:block}
.tfl span{position:absolute;font-size:14px;animation:fl 3s ease-in-out infinite}
.tfl span:nth-child(1){top:30px;left:30px;animation-delay:0s}
.tfl span:nth-child(2){top:45px;left:70px;animation-delay:.5s}
.tfl span:nth-child(3){top:20px;left:110px;animation-delay:1s}
.tfl span:nth-child(4){top:55px;left:40px;animation-delay:1.5s}
.tfl span:nth-child(5){top:35px;left:130px;animation-delay:2s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.gnd{position:absolute;bottom:16px;width:180px;height:8px;background:linear-gradient(90deg,#A5D6A7,#81C784,#A5D6A7);border-radius:4px;z-index:0}
.gnd2{position:absolute;bottom:14px;width:200px;height:3px;background:linear-gradient(90deg,transparent,#C8E6C9,transparent);border-radius:50%;z-index:0}
.tpr{max-width:320px;margin:6px auto 0}
.tpr .pl{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:4px}
.tpr .pb{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.tpr .pf{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));border-radius:4px;transition:width .5s ease;min-width:0}
.tsn{font-size:14px;font-weight:600;color:var(--primary);text-align:center;margin:4px 0 2px}
.ttip{text-align:center;font-size:11px;color:var(--text2);margin-top:4px}
.tc{display:flex;gap:8px;justify-content:center;margin-top:8px}
.tc button{background:var(--bg);border:none;border-radius:12px;padding:8px 16px;font-size:12px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:4px}
.tc button:active{transform:scale(.95)}
.tc button:disabled{opacity:.4;cursor:default;transform:none}

/* Tree hole */
.hs{text-align:center;padding:4px 0 10px;font-size:12px;color:var(--text2)}
.hs strong{color:var(--primary);font-size:16px}
.hf{display:flex;gap:8px;margin-bottom:12px}
.hf input{flex:1;border:2px solid #E8E8F0;border-radius:12px;padding:10px 14px;font-size:13px;outline:none;background:var(--bg);color:var(--text);font-family:inherit}
.hf input:focus{border-color:var(--primary-light)}
.hf button{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;border-radius:12px;padding:0 18px;font-size:13px;font-weight:600;cursor:pointer}
.hf button:active{opacity:.8}
#hl{display:flex;flex-direction:column;gap:8px}
.hi{background:var(--bg);border-radius:12px;padding:12px 14px;animation:fu .3s ease}
.hi .msg{font-size:13px;line-height:1.6}
.hi .meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px;color:var(--text2)}
.hi .lk{background:none;border:none;color:var(--text2);cursor:pointer;font-size:12px;display:flex;align-items:center;gap:3px;padding:4px 8px;border-radius:8px}
.hi .lk:active{background:rgba(124,124,245,.1)}
.he{text-align:center;padding:40px 20px;color:var(--text2)}
.he .e{font-size:40px;display:block;margin-bottom:8px}
.he p{font-size:13px}

/* Report */
.rph{display:flex;justify-content:space-between;align-items:center;padding:6px 0 10px}
.rph button{background:none;border:none;font-size:20px;cursor:pointer;padding:4px 12px;color:var(--primary);border-radius:8px}
.rph button:active{background:var(--bg)}
.rph .ml{font-size:15px;font-weight:600}
.rc{background:var(--bg);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.rc h3{font-size:13px;color:var(--text2);margin-bottom:8px;font-weight:600}
.rc .bn{font-size:32px;font-weight:700;color:var(--primary);display:inline-block;margin-right:4px}
.dr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dr .dl{font-size:11px;width:50px;text-align:right;flex-shrink:0}
.dr .dw{flex:1;height:16px;background:rgba(255,255,255,.5);border-radius:8px;overflow:hidden}
.dr .df{height:100%;border-radius:8px;transition:width .6s ease;min-width:0}
.dr .dv{font-size:11px;width:32px;text-align:left;color:var(--text2)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cg .dh{font-size:10px;color:var(--text2);padding:3px 0;font-weight:600}
.cd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:12px;cursor:default;position:relative}
.cd.tdy{font-weight:700}
.cd.tdy::after{content:"";position:absolute;bottom:1px;width:3px;height:3px;border-radius:50%;background:var(--primary)}
.cd .dt{width:5px;height:5px;border-radius:50%;margin-top:1px}
.cd .dt.s{background:var(--sunny)}
.cd .dt.c{background:#AED581}
.cd .dt.cl{background:var(--cloudy)}
.cd .dt.r{background:var(--rainy)}
.cd .dt.st{background:var(--stormy)}
.st{font-size:14px;line-height:1.7;padding:6px 0}
.sb{display:flex;gap:16px;justify-content:center;text-align:center}
.sb .nm{font-size:24px;font-weight:700;color:var(--primary)}
.sb .lb{font-size:11px;color:var(--text2)}

/* Nav */
.bn{display:flex;border-top:1px solid #EEE;background:var(--surface);flex-shrink:0;height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;color:var(--text2);font-size:10px;-webkit-user-select:none;user-select:none;transition:color .2s}
.ni .ic{font-size:20px;line-height:1}
.ni.act{color:var(--primary);font-weight:600}

/* Toast */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:8px 18px;border-radius:12px;font-size:13px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;max-width:300px;text-align:center}
#toast.show{opacity:1}

/* Sprinkle */
.sc{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.sp{position:absolute;width:6px;height:6px;border-radius:50%;opacity:0;animation:sf 1.8s ease-out forwards}
@keyframes sf{0%{opacity:1;transform:translateY(-10px) scale(1)}100%{opacity:0;transform:translateY(100vh) scale(.3)}}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* PWA banner */
#pwb{display:none;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:10px 16px;align-items:center;gap:10px;font-size:13px;flex-shrink:0}
#pwb.show{display:flex}
#pwb .cb{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:14px;flex-shrink:0}
#pwb .ib{background:#fff;color:var(--primary);border:none;border-radius:8px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:12px;white-space:nowrap;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <div id="pwb"><span>📲 安装到主屏幕</span><button class="ib" id="instBtn">安装</button><button class="cb" id="closeB">✕</button></div>
  <div class="hdr"><h1>🌤 情绪气象站</h1><div class="sub" id="greet"></div></div>
  <div class="pc">
    <div class="page active" id="pm">
      <div id="mg"></div>
      <div id="ra">
        <div id="rc"><span class="wi" id="ri"></span><div class="msg" id="rm"></div><div class="sub" id="rs"></div><div class="tt" id="rt"></div><button id="rf">🔄 换个说法</button></div>
        <div class="ab"><button class="bs" id="snBtn">📝 写感受</button><button class="bp" id="qsBtn">🌱 存树洞</button></div>
        <div id="na"><textarea id="ni" placeholder="写下此刻想说的话…（可选）"></textarea></div>
      </div>
    </div>
    <div class="page" id="pt">
      <div class="tsc">
        <div class="tst"><span>🌱 成长值 <strong id="tp">0</strong></span><span>📆 记录了 <strong id="td">0</strong> 天</span></div>
        <div class="tcv" id="tcv"><div class="gnd"></div><div class="gnd2"></div><div class="ttr"></div><div class="tf l0" id="fol"></div><div class="tfl" id="flw"><span>🌸</span><span>🌺</span><span>🌸</span><span>🌷</span><span>🌸</span></div></div>
        <div class="tsn" id="tsn"></div>
        <div class="tpr"><div class="pl"><span id="tsl">种子</span><span id="tnl">嫩芽</span></div><div class="pb"><div class="pf" id="tpf" style="width:0%"></div></div></div>
        <div class="ttip" id="ttip"></div>
        <div class="tc"><button id="wb">💧 浇水</button><button id="trb">📊 月报</button></div>
      </div>
    </div>
    <div class="page" id="ph">
      <div class="hs">🌱 已有 <strong id="hc">0</strong> 条悄悄话</div>
      <div class="hf"><input id="hi" placeholder="写一句想说的话…" maxlength="200"><button id="hsub">📨 投放</button></div>
      <div id="hl"></div>
    </div>
    <div class="page" id="pr">
      <div class="rph"><button id="rpp">‹</button><span class="ml" id="rpl"></span><button id="rpn">›</button></div>
      <div class="rc"><h3>📊 心情分布</h3><div id="db"></div></div>
      <div class="rc"><h3>🏆 本月统计</h3><div class="sb"><div class="si"><div class="nm" id="rd">0</div><div class="lb">记录天数</div></div><div class="si"><div class="nm" id="rst">0</div><div class="lb">最长连续</div></div><div class="si"><div class="nm" id="rbst">-</div><div class="lb">最佳状态</div></div></div></div>
      <div class="rc"><h3>📅 日历</h3><div class="cg" id="rcal"></div></div>
      <div class="rc"><h3>💬 月报总结</h3><div class="st" id="rsum"></div></div>
    </div>
  </div>
  <nav class="bn">
    <div class="ni act" data-p="mood"><span class="ic">☀️</span>今日心情</div>
    <div class="ni" data-p="tree"><span class="ic">🌱</span>成长树</div>
    <div class="ni" data-p="hole"><span class="ic">🌳</span>树洞</div>
    <div class="ni" data-p="report"><span class="ic">📊</span>月报</div>
  </nav>
</div>
<div id="toast"></div>
<script>
const MOODS=[
  {id:"sunny",emoji:"☀️",label:"晴天",desc:"开心",color:"var(--sunny)",pts:10},
  {id:"c-sunny",emoji:"⛅",label:"多云转晴",desc:"还行",color:"#AED581",pts:8},
  {id:"cloudy",emoji:"☁️",label:"阴天",desc:"一般",color:"var(--cloudy)",pts:5},
  {id:"rainy",emoji:"🌧️",label:"小雨",desc:"低落",color:"var(--rainy)",pts:3},
  {id:"stormy",emoji:"⛈️",label:"暴雨",desc:"糟糕",color:"var(--stormy)",pts:1}
];
const MN={sunny:"开心","c-sunny":"还行",cloudy:"一般",rainy:"低落",stormy:"糟糕"};
const TL=[
  {name:"🌰 种子",pts:0,fol:"l0",tip:"播下了一颗心情种子，每天记录让它发芽 🌱"},
  {name:"🌱 嫩芽",pts:15,fol:"l1",tip:"小芽破土而出！每天的阳光和雨露都是养分 ☀️"},
  {name:"🌿 幼苗",pts:40,fol:"l2",tip:"幼苗在慢慢长大，坚持记录就是最好的浇水 💧"},
  {name:"🌲 小树",pts:80,fol:"l3",tip:"已经是一棵小树啦！看得见的变化 🌳"},
  {name:"🌳 大树",pts:140,fol:"l4",tip:"根深叶茂，你的情绪森林越来越茁壮 🏕️"},
  {name:"🌸 开花树",pts:220,fol:"l5",tip:"开花了！你的坚持让森林有了颜色 ✨"}
];
const TP=[
  {k:"morning",r:[5,11],lb:"早上好 🌅",ms:{sunny:"晨光一样明亮，新的一天充满可能 ✨","c-sunny":"今天会是变好的一天，慢慢来 🌤",cloudy:"今天不一定完美，但你值得被温柔对待 ☕",rainy:"如果觉得累就慢慢来，雨也温柔 🌧️",stormy:"我知道起床就很难了，你已经很棒了 💜"}},
  {k:"afternoon",r:[11,17],lb:"下午好 ☀️",ms:{sunny:"好心情让一切亮了起来 🌈","c-sunny":"今天过得怎么样？希望一切往好的方向走 🌿",cloudy:"天空灰灰的，但你的存在本身就是光 💛",rainy:"绵绵细雨陪下午，正是休息的时候 🛋️",stormy:"下午很难熬的话，我在这里陪你 🌈"}},
  {k:"evening",r:[17,21],lb:"傍晚好 🌆",ms:{sunny:"落日和你今天的笑容一样温暖 🌇","c-sunny":"无论今天几分你都做得很棒 👍",cloudy:"一天结束了，你不需要完美 💙",rainy:"夜幕降临，放下今天的重量 🌙",stormy:"又撑过了一天，你很勇敢 ❤️"}},
  {k:"night",r:[21,5],lb:"夜深了 🌙",ms:{sunny:"带着这份温暖入眠吧 🌠","c-sunny":"夜幕下一切都会好起来的 ⭐",cloudy:"睡前别想太多，明天又是新一天 🛏️",rainy:"睡不着也没关系，树洞一直开着 🫂",stormy:"黑暗总会过去，晚安 🌈"}}
];
const AR={
  sunny:["像今天这样的好心情，值得好好珍惜 ☀️","你笑起来的样子比阳光还温暖 ✨","今天真是太棒了，记住这种感觉！","好心情会传染，你身边的人也被照亮了 🌈"],
  "c-sunny":["乌云正在散去，光透进来了 🌤","心情在回暖，是个好开始 🌱","从阴到晴只差一个深呼吸 ☁️→☀️","变好往往就在一瞬间 ✨"],
  cloudy:["不用强迫自己开心，平凡的一天也很好 🌿","阴天也很舒服，泡杯热饮吧 ☕","没什么大事也没关系，你本来就很好 💙","允许自己偶尔没有颜色"],
  rainy:["下雨天可以哭一会儿，但记得撑伞 ☂️","抱抱你，今天辛苦了 🤗","低落的你也很真实，这不可怕 🌧️","雨总会停的 🌈"],
  stormy:["你不需要一个人扛着所有 💜","暴风雨总会过去，我在这里陪着你 ❤️","允许自己脆弱，你已经很勇敢了","最黑的夜之后黎明一定会来 🌈"]
};
const today=new Date();
const tdy=today.getFullYear()+"-"+(today.getMonth()+1)+"-"+today.getDate();
let rpy=today.getMonth(),rpm=today.getFullYear(),sm=null,dp=null;
function ky(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function ls(k,d){return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}
function ss(k,v){localStorage.setItem(k,JSON.stringify(v))}
function pr(){
  var h=today.getHours();
  for(var i=0;i<TP.length;i++){var tp=TP[i];if(h>=tp.r[0]&&h<tp.r[1])return tp}
  return TP[3];
}

function cTP(){
  var moods=ls("emoji_moods",{});var total=0;var count=0;
  Object.keys(moods).forEach(function(k){var m=MOODS.find(function(x){return x.id===moods[k]});if(m){total+=m.pts;count++}});
  var waters=ls("emoji_waters",{});Object.keys(waters).forEach(function(k){if(waters[k])total+=2});
  var streak=getS();total+=Math.floor(streak/5)*5;
  return {pts:total,days:count};
}
function getS(){
  var moods=ls("emoji_moods",{});var dates=Object.keys(moods).sort();if(!dates.length)return 0;
  var maxS=1,cur=1;
  for(var i=1;i<dates.length;i++){
    var d1=new Date(dates[i-1]),d2=new Date(dates[i]);
    if((d2-d1)/(86400000)===1){cur++;if(cur>maxS)maxS=cur}else{cur=1}
  }
  return maxS;
}
function gTL(pts){for(var i=TL.length-1;i>=0;i--){if(pts>=TL[i].pts)return i}return 0}
function recT(){
  var tp=cTP();var pts=tp.pts,days=tp.days;
  var level=gTL(pts);var lv=TL[level];
  var nextLv=TL[Math.min(level+1,TL.length-1)];
  var maxPts=nextLv.pts;var minPts=lv.pts;
  var progress=maxPts>minPts?(pts-minPts)/(maxPts-minPts)*100:100;
  document.getElementById("tp").textContent=pts;
  document.getElementById("td").textContent=days;
  document.getElementById("tsn").textContent=lv.name;
  document.getElementById("tsl").textContent=lv.name;
  document.getElementById("tnl").textContent=nextLv.name;
  document.getElementById("ttip").textContent=lv.tip;
  var fill=document.getElementById("tpf");fill.style.width=Math.min(progress,100)+"%";
  var foliage=document.getElementById("fol");foliage.className="tf "+lv.fol;
  var fl=document.getElementById("flw");fl.classList.toggle("show",lv.fol==="l5");
}

function rR(){
  var label=document.getElementById("rpl");
  var months=["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
  label.textContent=(rpm)+"年 "+months[rpy];
  var moods=ls("emoji_moods",{});
  rRCal(moods);
  var dist={sunny:0,"c-sunny":0,cloudy:0,rainy:0,stormy:0};var dim=0;
  Object.keys(moods).forEach(function(k){
    var parts=k.split("-");var y=parseInt(parts[0]),m=parseInt(parts[1])-1;
    if(y===rpm&&m===rpy){dist[moods[k]]=(dist[moods[k]]||0)+1;dim++}
  });
  var bars=document.getElementById("db");
  var maxV=Math.max(1,Math.max.apply(null,Object.values(dist)));
  bars.innerHTML=MOODS.map(function(m){
    var val=dist[m.id]||0;var pct=(val/maxV*100)||0;
    return '<div class="dr"><span class="dl">'+m.emoji+" "+m.label+'</span><div class="dw"><div class="df" style="width:'+pct+'%;background:'+m.color+'"></div></div><span class="dv">'+val+"天</span></div>";
  }).join("");
  document.getElementById("rd").textContent=dim;
  document.getElementById("rst").textContent=getS();
  var bestM="-",bestC=0;
  Object.keys(dist).forEach(function(k){if(dist[k]>bestC){bestC=dist[k];bestM=MN[k]||k}});
  document.getElementById("rbst").textContent=bestC>0?bestM:"-";
  var sum="";var total=Object.values(dist).reduce(function(a,b){return a+b},0);
  if(total===0){sum="这个月还没有记录心情，从今天开始吧 🌱"}
  else{
    var sp=Math.round((dist.sunny+dist["c-sunny"])/total*100);
    if(sp>=70)sum="这个月你大部分时间心情都不错，继续保持！☀️ 开心天占"+sp+"%";
    else if(sp>=40)sum="这个月有晴有雨，整体还不错～ 🌤 积极天占"+sp+"%";
    else if(sp>=20)sum="这个月有点低落，但坚持记录已经很棒了 💪";
    else sum="这个月可能不太容易，但你每一天都在面对，很了不起 ❤️";
    if(dim>=20)sum+=" 几乎每天都在记录，很有毅力！🌟";
    else if(dim>=10)sum+=" 记录超过一半的天数，继续加油！🌱";
    else sum+=" 下个月争取多记录一些～ 📝";
    var streak=getS();
    if(streak>=10)sum+=" 最长连续"+streak+"天，太厉害了！🔥";
    else if(streak>=5)sum+=" 最长连续"+streak+"天，好习惯正在养成 ✨";
  }
  document.getElementById("rsum").textContent=sum;
}
function rRCal(moods){

  for(var i=0;i<firstD;i++)html+="<div></div>";
