<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI时光修复师 - 选择API服务</title>
    <style>
        :root {
            --sky-blue: #87CEEB;
            --sky-light: #B0E0E6;
            --sky-dark: #4682B4;
            --cloud-white: rgba(255, 255, 255, 0.9);
            --bg-gradient-start: #E0F4FF;
            --bg-gradient-mid: #A8D8EA;
            --bg-gradient-end: #7EC8E3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            filter: blur(10px);
            animation: floatCloud 20s ease-in-out infinite;
        }

        .cloud:nth-child(1) { width: 200px; height: 80px; top: 10%; left: 10%; animation-delay: 0s; }
        .cloud:nth-child(2) { width: 150px; height: 60px; top: 25%; right: 15%; animation-delay: -5s; }
        .cloud:nth-child(3) { width: 180px; height: 70px; top: 60%; left: 20%; animation-delay: -10s; }
        .cloud:nth-child(4) { width: 120px; height: 50px; top: 40%; right: 30%; animation-delay: -15s; }

        @keyframes floatCloud {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(50px); }
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 60px 0 40px;
        }

        .logo {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            font-size: 3rem;
            color: #1E3A5F;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
        }

        .subtitle {
            font-size: 1.3rem;
            color: #365F8B;
            font-weight: 400;
        }

        .providers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-top: 50px;
        }

        .provider-card {
            background: var(--cloud-white);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            border: 3px solid transparent;
            box-shadow: 0 10px 30px rgba(70, 130, 180, 0.15);
        }

        .provider-card:hover {
            transform: translateY(-10px);
            border-color: var(--sky-dark);
            box-shadow: 0 20px 40px rgba(70, 130, 180, 0.25);
        }

        

        .provider-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1E3A5F;
            margin-bottom: 10px;
        }

        .provider-desc {
            font-size: 0.95rem;
            color: #5A7A9A;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .provider-features {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .feature-tag {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .feature-tag.supported {
            background: rgba(34, 197, 94, 0.15);
            color: #16A34A;
        }

        .feature-tag.not-supported {
            background: rgba(239, 68, 68, 0.15);
            color: #DC2626;
        }

        .footer {
            text-align: center;
            padding: 50px 0 30px;
            color: #5A7A9A;
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .providers-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.2rem;
            }

            .provider-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>

    <div class="container">
        <header>
            <div class="logo">🖼️</div>
            <h1>AI时光修复师</h1>
            <p class="subtitle">选择您的AI服务，开始修复老照片</p>
        </header>

        <div class="providers-grid">
            <div class="provider-card" onclick="selectProvider('siliconflow')">
                <div class="provider-name">SiliconFlow 硅基流动</div>
                <div class="provider-desc">国内领先的AI推理平台，性价比高，支持多种图像模型</div>
                <div class="provider-features">
                    <span class="feature-tag supported">修图 ✅</span>
                    <span class="feature-tag supported">故事 ✅</span>
                </div>
            </div>

            <div class="provider-card" onclick="selectProvider('deepseek')">
                <div class="provider-name">DeepSeek</div>
                <div class="provider-desc">专注于推理的AI模型，文本生成能力强大</div>
                <div class="provider-features">
                    <span class="feature-tag not-supported">修图 ❌</span>
                    <span class="feature-tag supported">故事 ✅</span>
                </div>
            </div>

            <div class="provider-card" onclick="selectProvider('openai')">
                <div class="provider-name">OpenAI</div>
                <div class="provider-desc">全球领先的AI技术，GPT-4支持图像理解</div>
                <div class="provider-features">
                    <span class="feature-tag supported">修图 ✅</span>
                    <span class="feature-tag supported">故事 ✅</span>
                </div>
            </div>

            <div class="provider-card" onclick="selectProvider('doubao')">
                <div class="provider-name">豆包 Doubao</div>
                <div class="provider-desc">字节跳动旗下AI助手，多模态能力出众</div>
                <div class="provider-features">
                    <span class="feature-tag supported">修图 ✅</span>
                    <span class="feature-tag supported">故事 ✅</span>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>AI时光修复师 · 让每一张老照片都有新故事</p>
        </div>
    </div>

    <script>
        function selectProvider(provider) {
            localStorage.setItem('selected_provider', provider);
            window.location.href = 'app.html';
        }
    </script>
</body>
</html>
