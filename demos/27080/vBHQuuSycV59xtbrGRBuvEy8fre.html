<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大宗原材料价格走势分析大屏</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0e1a;
            color: #fff;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow-x: hidden;
        }
        
        .dashboard {
            min-height: 100vh;
            padding: 20px;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(0,100,255,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(255,100,0,0.06) 0%, transparent 50%),
                linear-gradient(180deg, #0a0e1a 0%, #0d1429 100%);
        }
        
        /* 头部 */
        .header {
            text-align: center;
            padding: 20px 0;
            position: relative;
        }
        
        .header h1 {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(90deg, #00d4ff, #0099ff, #00d4ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            letter-spacing: 8px;
        }
        
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        
        .header .subtitle {
            color: #4a90d9;
            font-size: 16px;
            margin-top: 10px;
            letter-spacing: 4px;
        }
        
        .header .time {
            position: absolute;
            right: 0;
            top: 20px;
            color: #00d4ff;
            font-size: 18px;
            font-family: 'Courier New', monospace;
        }
        
        /* 网格布局 */
        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        
        /* 卡片样式 */
        .card {
            background: rgba(16, 30, 60, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
            animation: scan 3s linear infinite;
        }
        
        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .card:hover {
            border-color: rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
        }
        
        .card-title {
            font-size: 18px;
            color: #00d4ff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, #00d4ff, #0066ff);
            border-radius: 2px;
        }
        
        /* KPI卡片 */
        .kpi-grid {
            grid-column: span 12;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }
        
        .kpi-card {
            background: rgba(16, 30, 60, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 12px;
            padding: 25px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .kpi-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--kpi-color, #00d4ff);
            opacity: 0.6;
        }
        
        .kpi-card:hover {
            transform: translateY(-5px);
            border-color: var(--kpi-color, #00d4ff);
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.15);
        }
        
        .kpi-card.active {
            border-color: var(--kpi-color, #00d4ff);
            background: rgba(0, 212, 255, 0.08);
        }
        
        .kpi-name {
            font-size: 16px;
            color: #8ba3c7;
            margin-bottom: 10px;
        }
        
        .kpi-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--kpi-color, #00d4ff);
            font-family: 'Courier New', monospace;
        }
        
        .kpi-unit {
            font-size: 14px;
            color: #5a7a9a;
            margin-left: 4px;
        }
        
        .kpi-change {
            margin-top: 10px;
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        
        .kpi-change.up {
            background: rgba(255, 50, 50, 0.15);
            color: #ff6b6b;
        }
        
        .kpi-change.down {
            background: rgba(50, 255, 100, 0.15);
            color: #6bff8a;
        }
        
        /* 图表区域 */
        .chart-main {
            grid-column: span 8;
            height: 500px;
        }
        
        .chart-side {
            grid-column: span 4;
            height: 500px;
        }
        
        .chart-full {
            grid-column: span 12;
            height: 400px;
        }
        
        .chart-half {
            grid-column: span 6;
            height: 350px;
        }
        
        .chart-container {
            width: 100%;
            height: calc(100% - 40px);
        }
        
        /* 数据表格 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        .data-table th {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }
        
        .data-table td {
            padding: 10px 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #b0c4de;
        }
        
        .data-table tr:hover td {
            background: rgba(0, 212, 255, 0.05);
        }
        
        .data-table .up { color: #ff6b6b; }
        .data-table .down { color: #6bff8a; }
        
        /* 详情弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: linear-gradient(135deg, #0d1b3a 0%, #0a0e1a 100%);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 1200px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 50%;
            background: transparent;
            color: #00d4ff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .modal-close:hover {
            background: rgba(0, 212, 255, 0.2);
        }
        
        .modal h2 {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        /* 装饰元素 */
        .corner-decoration {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 212, 255, 0.3);
        }
        
        .corner-tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .corner-tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
        .corner-br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
        
        /* 响应式 */
        @media (max-width: 1200px) {
            .kpi-grid { grid-template-columns: repeat(3, 1fr); }
            .chart-main, .chart-side, .chart-half { grid-column: span 12; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- 头部 -->
        <div class="header">
            <h1>大宗原材料价格走势分析</h1>
            <div class="subtitle">2025年6月 - 2026年6月 | 实时监控大屏</div>
            <div class="time" id="currentTime"></div>
        </div>
        
        <!-- KPI指标卡 -->
        <div class="kpi-grid" id="kpiGrid"></div>
        
        <!-- 主图表区 -->
        <div class="grid">
            <!-- 价格走势图 -->
            <div class="card chart-main">
                <div class="corner-decoration corner-tl"></div>
                <div class="corner-decoration corner-tr"></div>
                <div class="corner-decoration corner-bl"></div>
                <div class="corner-decoration corner-br"></div>
                <div class="card-title">价格走势对比图</div>
                <div class="chart-container" id="priceChart"></div>
            </div>
            
            <!-- 涨跌幅分析 -->
            <div class="card chart-side">
                <div class="corner-decoration corner-tl"></div>
                <div class="corner-decoration corner-tr"></div>
                <div class="corner-decoration corner-bl"></div>
                <div class="corner-decoration corner-br"></div>
                <div class="card-title">期间涨跌幅</div>
                <div class="chart-container" id="changeChart"></div>
            </div>
            
            <!-- 归一化走势图 -->
            <div class="card chart-full">
                <div class="corner-decoration corner-tl"></div>
                <div class="corner-decoration corner-tr"></div>
                <div class="corner-decoration corner-bl"></div>
                <div class="corner-decoration corner-br"></div>
                <div class="card-title">归一化走势对比 (基准=100)</div>
                <div class="chart-container" id="normalizedChart"></div>
            </div>
            
            <!-- 波动率分析 -->
            <div class="card chart-half">
                <div class="corner-decoration corner-tl"></div>
                <div class="corner-decoration corner-tr"></div>
                <div class="corner-decoration corner-bl"></div>
                <div class="corner-decoration corner-br"></div>
                <div class="card-title">价格波动率</div>
                <div class="chart-container" id="volatilityChart"></div>
            </div>
            
            <!-- 价格区间 -->
            <div class="card chart-half">
                <div class="corner-decoration corner-tl"></div>
                <div class="corner-decoration corner-tr"></div>
                <div class="corner-decoration corner-bl"></div>
                <div class="corner-decoration corner-br"></div>
                <div class="card-title">价格区间统计</div>
                <div class="chart-container" id="rangeChart"></div>
            </div>
            
            <!-- 数据明细表 -->
            <div class="card chart-full">
                <div class="corner-decoration corner-tl"></div>
                <div class="corner-decoration corner-tr"></div>
                <div class="corner-decoration corner-bl"></div>
                <div class="corner-decoration corner-br"></div>
                <div class="card-title">月度价格明细 (点击行查看详情)</div>
                <div style="overflow-x: auto;">
                    <table class="data-table" id="dataTable">
                        <thead>
                            <tr>
                                <th>月份</th>
                                <th>黄金 (元/克)</th>
                                <th>电解铜 (元/吨)</th>
                                <th>白银 (元/千克)</th>
                                <th>锡 (元/吨)</th>
                                <th>钢材(螺纹钢) (元/吨)</th>
                                <th>综合涨跌</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">×</button>
            <h2 id="modalTitle">品种详情</h2>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // 数据
        const rawData = {"months":["25/6","25/7","25/8","25/9","25/10","25/11","25/12","26/1","26/2","26/3","26/4","26/5","26/6"],"materials":{"黄金":{"prices":[776.72,772.58,775.75,831.6,938.23,932.1,973.03,1098.0,1100.04,1076.74,1040.44,1002.21,940.0],"unit":"元/克","color":"#FFD700","stats":{"max":1100.04,"min":772.58,"avg":942.88,"volatility":0.129061502572041}},"电解铜":{"prices":[79000.0,79449.0,79084.0,80778.0,86421.0,86614.0,93450.0,102166.0,101810.0,98671.0,100524.0,104943.0,103500.0],"unit":"元/吨","color":"#B87333","stats":{"max":104943.0,"min":79000.0,"avg":92031.5384615385,"volatility":0.11300924341575}},"白银":{"prices":[8742.0,9086.0,9193.0,10061.0,11493.0,11916.0,15399.0,24516.0,23231.0,19891.0,18827.0,19375.0,15500.0],"unit":"元/千克","color":"#C0C0C0","stats":{"max":24516.0,"min":8742.0,"avg":15171.5384615385,"volatility":0.366049929984373}},"锡":{"prices":[259650.0,266761.0,268935.0,271000.0,280000.0,292480.0,327000.0,374000.0,395000.0,375000.0,382000.0,424960.0,398000.0],"unit":"元/吨","color":"#4169E1","stats":{"max":424960.0,"min":259650.0,"avg":331906.615384615,"volatility":0.183595394669387}},"钢材(螺纹钢)":{"prices":[3376.0,3425.0,3428.0,3378.0,3336.0,3330.0,3361.0,3341.0,3157.0,3180.0,3150.0,3423.0,3390.0],"unit":"元/吨","color":"#DC143C","stats":{"max":3428.0,"min":3150.0,"avg":3328.84615384615,"volatility":0.030193716413624}}},"composite":[null,0.016320957252018,0.00406217630240909,0.0361854887706365,0.0722379097280455,0.0150555106943835,0.108493405704246,0.190306939587449,-0.0105929899912303,-0.0478267819803818,-0.0118384235697647,0.0470900229266307,-0.0697810143631273],"normalized":{"黄金":[100.0,99.5,99.9,107.1,120.8,120.0,125.3,141.4,141.6,138.6,134.0,129.0,121.0],"电解铜":[100.0,100.6,100.1,102.3,109.4,109.6,118.3,129.3,128.9,124.9,127.2,132.8,131.0],"白银":[100.0,103.9,105.2,115.1,131.5,136.3,176.1,280.4,265.7,227.5,215.4,221.6,177.3],"锡":[100.0,102.7,103.6,104.4,107.8,112.6,125.9,144.0,152.1,144.4,147.1,163.7,153.3],"钢材(螺纹钢)":[100.0,101.5,101.5,100.1,98.8,98.6,99.6,99.0,93.5,94.2,93.3,101.4,100.4]},"detail":{"黄金":{"months":["25/6","25/7","25/8","25/9","25/10","25/11","25/12","26/1","26/2","26/3","26/4","26/5","26/6"],"prices":[776.72,772.58,775.75,831.6,938.23,932.1,973.03,1098.0,1100.04,1076.74,1040.44,1002.21,940.0],"changes":[null,-0.53,0.41,7.19,12.82,-0.65,4.39,12.84,0.19,-2.12,-3.37,-3.67,-6.21]},"电解铜":{"months":["25/6","25/7","25/8","25/9","25/10","25/11","25/12","26/1","26/2","26/3","26/4","26/5","26/6"],"prices":[79000.0,79449.0,79084.0,80778.0,86421.0,86614.0,93450.0,102166.0,101810.0,98671.0,100524.0,104943.0,103500.0],"changes":[null,0.57,-0.46,2.14,6.99,0.22,7.89,9.33,-0.35,-3.08,1.88,4.39,-1.38]},"白银":{"months":["25/6","25/7","25/8","25/9","25/10","25/11","25/12","26/1","26/2","26/3","26/4","26/5","26/6"],"prices":[8742.0,9086.0,9193.0,10061.0,11493.0,11916.0,15399.0,24516.0,23231.0,19891.0,18827.0,19375.0,15500.0],"changes":[null,3.93,1.18,9.44,14.23,3.68,29.23,59.21,-5.24,-14.38,-5.35,2.91,-20.0]},"锡":{"months":["25/6","25/7","25/8","25/9","25/10","25/11","25/12","26/1","26/2","26/3","26/4","26/5","26/6"],"prices":[259650.0,266761.0,268935.0,271000.0,280000.0,292480.0,327000.0,374000.0,395000.0,375000.0,382000.0,424960.0,398000.0],"changes":[null,2.74,0.82,0.77,3.32,4.46,11.8,14.37,5.61,-5.06,1.87,11.25,-6.34]},"钢材(螺纹钢)":{"months":["25/6","25/7","25/8","25/9","25/10","25/11","25/12","26/1","26/2","26/3","26/4","26/5","26/6"],"prices":[3376.0,3425.0,3428.0,3378.0,3336.0,3330.0,3361.0,3341.0,3157.0,3180.0,3150.0,3423.0,3390.0],"changes":[null,1.45,0.09,-1.46,-1.24,-0.18,0.93,-0.6,-5.51,0.73,-0.94,8.67,-0.96]}}};
        
        const materialNames = ['黄金', '电解铜', '白银', '锡', '钢材(螺纹钢)'];
        const materialColors = ['#FFD700', '#B87333', '#C0C0C0', '#4169E1', '#DC143C'];
        let selectedMaterial = null;
        let charts = {};
        
        // 初始化
        function init() {
            updateTime();
            setInterval(updateTime, 1000);
            renderKPIs();
            renderCharts();
            renderTable();
            window.addEventListener('resize', handleResize);
        }
        
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = 
                now.toLocaleString('zh-CN', { 
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
        }
        
        // 渲染KPI卡片
        function renderKPIs() {
            const container = document.getElementById('kpiGrid');
            const lastIdx = rawData.months.length - 1;
            
            materialNames.forEach((name, idx) => {
                const mat = rawData.materials[name];
                const currentPrice = mat.prices[lastIdx];
                const prevPrice = mat.prices[lastIdx - 1];
                const change = ((currentPrice - prevPrice) / prevPrice * 100).toFixed(2);
                const isUp = change >= 0;
                
                const card = document.createElement('div');
                card.className = 'kpi-card';
                card.style.setProperty('--kpi-color', mat.color);
                card.dataset.material = name;
                card.innerHTML = `
                    <div class="kpi-name">${name}</div>
                    <div class="kpi-value">${currentPrice.toLocaleString()}<span class="kpi-unit">${mat.unit}</span></div>
                    <div class="kpi-change ${isUp ? 'up' : 'down'}">${isUp ? '↑' : '↓'} ${Math.abs(change)}%</div>
                `;
                card.addEventListener('click', () => selectMaterial(name));
                container.appendChild(card);
            });
        }
        
        // 选择材料
        function selectMaterial(name) {
            selectedMaterial = selectedMaterial === name ? null : name;
            
            document.querySelectorAll('.kpi-card').forEach(card => {
                card.classList.toggle('active', card.dataset.material === selectedMaterial);
            });
            
            updateCharts();
        }
        
        // 渲染图表
        function renderCharts() {
            renderPriceChart();
            renderChangeChart();
            renderNormalizedChart();
            renderVolatilityChart();
            renderRangeChart();
        }
        
        // 价格走势图
        function renderPriceChart() {
            const chart = echarts.init(document.getElementById('priceChart'));
            charts.price = chart;
            
            const series = materialNames.map((name, idx) => ({
                name: name,
                type: 'line',
                data: rawData.materials[name].prices,
                smooth: true,
                symbol: 'circle',
                symbolSize: 8,
                lineStyle: { width: 3, color: materialColors[idx] },
                itemStyle: { color: materialColors[idx] },
                areaStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: materialColors[idx] + '40' },
                        { offset: 1, color: materialColors[idx] + '05' }
                    ])
                },
                emphasis: {
                    focus: 'series',
                    blurScope: 'coordinateSystem'
                }
            }));
            
            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(10, 14, 26, 0.9)',
                    borderColor: '#00d4ff',
                    borderWidth: 1,
                    textStyle: { color: '#fff' },
                    axisPointer: {
                        type: 'cross',
                        crossStyle: { color: '#00d4ff' }
                    }
                },
                legend: {
                    data: materialNames,
                    textStyle: { color: '#8ba3c7' },
                    top: 0,
                    itemGap: 20
                },
                grid: { left: '3%', right: '4%', bottom: '3%', top: '15%', containLabel: true },
                xAxis: {
                    type: 'category',
                    data: rawData.months,
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
                    axisLabel: { color: '#8ba3c7' }
                },
                yAxis: {
                    type: 'value',
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
                    axisLabel: { color: '#8ba3c7' },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } }
                },
                series: series
            };
            
            chart.setOption(option);
            chart.on('click', params => showDetail(params.seriesName));
        }
        
        // 涨跌幅图
        function renderChangeChart() {
            const chart = echarts.init(document.getElementById('changeChart'));
            charts.change = chart;
            
            const changes = materialNames.map(name => {
                const prices = rawData.materials[name].prices;
                const first = prices[0];
                const last = prices[prices.length - 1];
                return ((last - first) / first * 100).toFixed(2);
            });
            
            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(10, 14, 26, 0.9)',
                    borderColor: '#00d4ff',
                    textStyle: { color: '#fff' }
                },
                grid: { left: '3%', right: '10%', bottom: '3%', top: '5%', containLabel: true },
                xAxis: {
                    type: 'value',
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
                    axisLabel: { color: '#8ba3c7', formatter: '{value}%' },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } }
                },
                yAxis: {
                    type: 'category',
                    data: materialNames,
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
                    axisLabel: { color: '#8ba3c7' }
                },
                series: [{
                    type: 'bar',
                    data: changes.map((val, idx) => ({
                        value: val,
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                                { offset: 0, color: materialColors[idx] },
                                { offset: 1, color: materialColors[idx] + '80' }
                            ])
                        }
                    })),
                    label: {
                        show: true,
                        position: 'right',
                        formatter: '{c}%',
                        color: '#fff'
                    },
                    barWidth: '60%'
                }]
            };
            
            chart.setOption(option);
            chart.on('click', params => showDetail(params.name));
        }
        
        // 归一化走势图
        function renderNormalizedChart() {
            const chart = echarts.init(document.getElementById('normalizedChart'));
            charts.normalized = chart;
            
            const series = materialNames.map((name, idx) => ({
                name: name,
                type: 'line',
                data: rawData.normalized[name],
                smooth: true,
                symbol: 'circle',
                symbolSize: 6,
                lineStyle: { width: 2, color: materialColors[idx] },
                itemStyle: { color: materialColors[idx] },
                emphasis: { focus: 'series' }
            }));
            
            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(10, 14, 26, 0.9)',
                    borderColor: '#00d4ff',
                    textStyle: { color: '#fff' }
                },
                legend: {
                    data: materialNames,
                    textStyle: { color: '#8ba3c7' },
                    top: 0
                },
                grid: { left: '3%', right: '4%', bottom: '3%', top: '15%', containLabel: true },
                xAxis: {
                    type: 'category',
                    data: rawData.months,
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
                    axisLabel: { color: '#8ba3c7' }
                },
                yAxis: {
                    type: 'value',
                    name: '指数',
                    nameTextStyle: { color: '#8ba3c7' },
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
                    axisLabel: { color: '#8ba3c7' },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } }
                },
                series: series
            };
            
            chart.setOption(option);
            chart.on('click', params => showDetail(params.seriesName));
        }
        
        // 波动率图
        function renderVolatilityChart() {
            const chart = echarts.init(document.getElementById('volatilityChart'));
            charts.volatility = chart;
            
            const volatilities = materialNames.map(name => 
                (rawData.materials[name].stats.volatility * 100).toFixed(2)
            );
            
            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(10, 14, 26, 0.9)',
                    borderColor: '#00d4ff',
                    textStyle: { color: '#fff' },
                    formatter: '{b}: {c}%'
                },
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    center: ['50%', '55%'],
                    data: materialNames.map((name, idx) => ({
                        name: name,
                        value: volatilities[idx],
                        itemStyle: { color: materialColors[idx] }
                    })),
                    label: {
                        color: '#8ba3c7',
                        formatter: '{b}\n{c}%'
                    },
                    labelLine: { lineStyle: { color: 'rgba(255,255,255,0.2)' } },
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 20,
                            shadowColor: 'rgba(0, 212, 255, 0.5)'
                        }
                    }
                }]
            };
            
            chart.setOption(option);
            chart.on('click', params => showDetail(params.name));
        }
        
        // 价格区间图
        function renderRangeChart() {
            const chart = echarts.init(document.getElementById('rangeChart'));
            charts.range = chart;
            
            const data = materialNames.map(name => {
                const stats = rawData.materials[name].stats;
                return {
                    name: name,
                    value: [stats.min, stats.avg, stats.max],
                    itemStyle: { color: rawData.materials[name].color }
                };
            });
            
            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(10, 14, 26, 0.9)',
                    borderColor: '#00d4ff',
                    textStyle: { color: '#fff' },
                    formatter: function(params) {
                        const p = params[0];
                        return `${p.name}<br/>最低: ${p.value[1].toLocaleString()}<br/>平均: ${p.value[2].toLocaleString()}<br/>最高: ${p.value[3].toLocaleString()}`;
                    }
                },
                grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
                xAxis: {
                    type: 'category',
                    data: materialNames,
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
                    axisLabel: { color: '#8ba3c7' }
                },
                yAxis: {
                    type: 'value',
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
                    axisLabel: { color: '#8ba3c7' },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } }
                },
                series: [{
                    type: 'custom',
                    renderItem: function(params, api) {
                        const categoryIndex = api.value(0);
                        const minVal = api.value(1);
                        const avgVal = api.value(2);
                        const maxVal = api.value(3);
                        
                        const start = api.coord([categoryIndex, minVal]);
                        const end = api.coord([categoryIndex, maxVal]);
                        const avg = api.coord([categoryIndex, avgVal]);
                        
                        const width = api.size([0, 0])[0] * 0.5;
                        
                        return {
                            type: 'group',
                            children: [
                                {
                                    type: 'line',
                                    shape: { x1: start[0], y1: start[1], x2: end[0], y2: end[1] },
                                    style: { stroke: api.visual('color'), lineWidth: 2 }
                                },
                                {
                                    type: 'rect',
                                    shape: { x: start[0] - width/2, y: start[1], width: width, height: 6 },
                                    style: { fill: api.visual('color') }
                                },
                                {
                                    type: 'rect',
                                    shape: { x: end[0] - width/2, y: end[1] - 6, width: width, height: 6 },
                                    style: { fill: api.visual('color') }
                                },
                                {
                                    type: 'circle',
                                    shape: { cx: avg[0], cy: avg[1], r: 6 },
                                    style: { fill: '#00d4ff', stroke: api.visual('color'), lineWidth: 2 }
                                }
                            ]
                        };
                    },
                    data: data.map((item, idx) => [idx, ...item.value]),
                    encode: { x: 0, y: [1, 2, 3] }
                }]
            };
            
            chart.setOption(option);
            chart.on('click', params => showDetail(params.name));
        }
        
        // 更新图表（联动）
        function updateCharts() {
            if (!selectedMaterial) {
                // 恢复全部显示
                Object.values(charts).forEach(chart => {
                    chart.dispatchAction({ type: 'legendAllSelect' });
                });
                return;
            }
            
            // 高亮选中
            const idx = materialNames.indexOf(selectedMaterial);
            
            Object.values(charts).forEach(chart => {
                materialNames.forEach((name, i) => {
                    chart.dispatchAction({
                        type: i === idx ? 'legendSelect' : 'legendUnSelect',
                        name: name
                    });
                });
            });
        }
        
        // 渲染数据表
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            
            rawData.months.forEach((month, idx) => {
                const row = document.createElement('tr');
                row.style.cursor = 'pointer';
                
                let html = `<td><strong>${month}</strong></td>`;
                
                materialNames.forEach(name => {
                    const price = rawData.materials[name].prices[idx];
                    const change = rawData.detail[name].changes[idx];
                    
                    if (change !== null) {
                        const color = change >= 0 ? 'up' : 'down';
                        html += `<td>${price.toLocaleString()} <span class="${color}">(${change >= 0 ? '+' : ''}${change}%)</span></td>`;
                    } else {
                        html += `<td>${price.toLocaleString()} <span style="color:#666">-</span></td>`;
                    }
                });
                
                const composite = rawData.composite[idx];
                if (composite !== null) {
                    const color = composite >= 0 ? 'up' : 'down';
                    html += `<td class="${color}">${(composite * 100).toFixed(2)}%</td>`;
                } else {
                    html += `<td>-</td>`;
                }
                
                row.innerHTML = html;
                row.addEventListener('click', () => showMonthDetail(idx));
                tbody.appendChild(row);
            });
        }
        
        // 显示品种详情（穿透）
        function showDetail(materialName) {
            const modal = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const content = document.getElementById('modalContent');
            
            title.textContent = materialName + ' - 详细分析';
            
            const mat = rawData.materials[materialName];
            const detail = rawData.detail[materialName];
            const stats = mat.stats;
            
            const totalChange = ((mat.prices[mat.prices.length - 1] - mat.prices[0]) / mat.prices[0] * 100).toFixed(2);
            
            content.innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px;">
                    <div style="background: rgba(0,212,255,0.1); padding: 20px; border-radius: 8px; text-align: center;">
                        <div style="color: #8ba3c7; font-size: 14px;">期间最高价</div>
                        <div style="color: ${mat.color}; font-size: 28px; font-weight: bold; margin-top: 10px;">${stats.max.toLocaleString()}</div>
                    </div>
                    <div style="background: rgba(0,212,255,0.1); padding: 20px; border-radius: 8px; text-align: center;">
                        <div style="color: #8ba3c7; font-size: 14px;">期间最低价</div>
                        <div style="color: ${mat.color}; font-size: 28px; font-weight: bold; margin-top: 10px;">${stats.min.toLocaleString()}</div>
                    </div>
                    <div style="background: rgba(0,212,255,0.1); padding: 20px; border-radius: 8px; text-align: center;">
                        <div style="color: #8ba3c7; font-size: 14px;">期间均价</div>
                        <div style="color: ${mat.color}; font-size: 28px; font-weight: bold; margin-top: 10px;">${stats.avg.toFixed(2).toLocaleString()}</div>
                    </div>
                    <div style="background: rgba(0,212,255,0.1); padding: 20px; border-radius: 8px; text-align: center;">
                        <div style="color: #8ba3c7; font-size: 14px;">总涨跌幅</div>
                        <div style="color: ${totalChange >= 0 ? '#ff6b6b' : '#6bff8a'}; font-size: 28px; font-weight: bold; margin-top: 10px;">${totalChange >= 0 ? '+' : ''}${totalChange}%</div>
                    </div>
                </div>
                <div id="detailChart" style="width: 100%; height: 400px;"></div>
            `;
            
            modal.classList.add('active');
            
            setTimeout(() => {
                const detailChart = echarts.init(document.getElementById('detailChart'));
                
                const option = {
                    backgroundColor: 'transparent',
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: 'rgba(10, 14, 26, 0.9)',
                        borderColor: mat.color,
                        textStyle: { color: '#fff' }
                    },
                    grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
                    xAxis: {
                        type: 'category',
                        data: rawData.months,
                        axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
                        axisLabel: { color: '#8ba3c7' }
                    },
                    yAxis: [
                        {
                            type: 'value',
                            name: '价格',
                            nameTextStyle: { color: '#8ba3c7' },
                            axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
                            axisLabel: { color: '#8ba3c7' },
                            splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } }
                        },
                        {
                            type: 'value',
                            name: '涨跌幅(%)',
                            nameTextStyle: { color: '#8ba3c7' },
                            axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
                            axisLabel: { color: '#8ba3c7', formatter: '{value}%' },
                            splitLine: { show: false }
                        }
                    ],
                    series: [
                        {
                            name: '价格',
                            type: 'line',
                            data: mat.prices,
                            smooth: true,
                            symbol: 'circle',
                            symbolSize: 8,
                            lineStyle: { width: 3, color: mat.color },
                            itemStyle: { color: mat.color },
                            areaStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: mat.color + '60' },
                                    { offset: 1, color: mat.color + '05' }
                                ])
                            }
                        },
                        {
                            name: '环比涨跌',
                            type: 'bar',
                            yAxisIndex: 1,
                            data: detail.changes.map(v => v !== null ? v : 0),
                            itemStyle: {
                                color: params => params.value >= 0 ? '#ff6b6b' : '#6bff8a'
                            },
                            barWidth: '40%'
                        }
                    ]
                };
                
                detailChart.setOption(option);
            }, 100);
        }
        
        // 显示月份详情
        function showMonthDetail(monthIdx) {
            const modal = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const content = document.getElementById('modalContent');
            
            title.textContent = rawData.months[monthIdx] + ' - 月度对比分析';
            
            let html = `
                <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-bottom: 30px;">
            `;
            
            materialNames.forEach(name => {
                const price = rawData.materials[name].prices[monthIdx];
                const change = rawData.detail[name].changes[monthIdx];
                const color = rawData.materials[name].color;
                const changeStr = change !== null ? `${change >= 0 ? '+' : ''}${change}%` : '-';
                const changeColor = change !== null ? (change >= 0 ? '#ff6b6b' : '#6bff8a') : '#666';
                
                html += `
                    <div style="background: rgba(0,212,255,0.05); border: 1px solid ${color}40; padding: 20px; border-radius: 8px; text-align: center;">
                        <div style="color: ${color}; font-size: 16px; margin-bottom: 10px;">${name}</div>
                        <div style="color: #fff; font-size: 24px; font-weight: bold;">${price.toLocaleString()}</div>
                        <div style="color: ${changeColor}; font-size: 14px; margin-top: 8px;">${changeStr}</div>
                    </div>
                `;
            });
            
            html += '</div>';
            
            // 添加雷达图
            html += '<div id="radarChart" style="width: 100%; height: 400px;"></div>';
            
            content.innerHTML = html;
            modal.classList.add('active');
            
            setTimeout(() => {
                const radarChart = echarts.init(document.getElementById('radarChart'));
                
                // 计算相对强度 (归一化到0-100)
                const values = materialNames.map(name => {
                    const prices = rawData.materials[name].prices;
                    const current = prices[monthIdx];
                    const max = Math.max(...prices);
                    const min = Math.min(...prices);
                    return ((current - min) / (max - min) * 100).toFixed(1);
                });
                
                const option = {
                    backgroundColor: 'transparent',
                    tooltip: {
                        backgroundColor: 'rgba(10, 14, 26, 0.9)',
                        borderColor: '#00d4ff',
                        textStyle: { color: '#fff' }
                    },
                    radar: {
                        indicator: materialNames.map((name, idx) => ({
                            name: name,
                            max: 100,
                            color: materialColors[idx]
                        })),
                        center: ['50%', '50%'],
                        radius: '65%',
                        axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
                        splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } },
                        splitArea: {
                            areaStyle: {
                                color: ['rgba(0,212,255,0.02)', 'rgba(0,212,255,0.05)']
                            }
                        }
                    },
                    series: [{
                        type: 'radar',
                        data: [{
                            value: values,
                            name: '价格相对强度',
                            areaStyle: {
                                color: new echarts.graphic.RadialGradient(0.5, 0.5, 1, [
                                    { offset: 0, color: 'rgba(0,212,255,0.3)' },
                                    { offset: 1, color: 'rgba(0,212,255,0.05)' }
                                ])
                            },
                            lineStyle: { color: '#00d4ff', width: 2 },
                            itemStyle: { color: '#00d4ff' }
                        }]
                    }]
                };
                
                radarChart.setOption(option);
            }, 100);
        }
        
        // 关闭弹窗
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }
        
        // 点击遮罩关闭
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        
        // 窗口大小改变
        function handleResize() {
            Object.values(charts).forEach(chart => chart.resize());
        }
        
        // 启动
        init();
    </script>
</body>
</html>
