<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>如果世界模拟器 | What-If World Simulator</title>
<style>
/* ===== 全局样式 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a0f;
  --bg2: #12121a;
  --panel: #161620;
  --border: #2a2a3a;
  --text: #e0e0e8;
  --text2: #9090a0;
  --accent: #00f0ff;
  --accent2: #ff2a6d;
  --accent3: #05ffa1;
  --warn: #ffaa00;
}
html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  overflow: hidden;
}
#app { width: 100%; height: 100%; position: relative; }

/* ===== 开场画面 ===== */
#intro {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 100;
  background: radial-gradient(ellipse at center, #141428 0%, #050510 100%);
  transition: opacity 1.2s ease, visibility 1.2s;
}
#intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.intro-title {
  font-size: clamp(1.6rem, 5vw, 3.2rem);
  font-weight: 700;
  letter-spacing: 0.15em;
  text-shadow: 0 0 20px var(--accent), 0 0 40px rgba(0,240,255,0.3);
  margin-bottom: 12px;
  animation: flicker 3s infinite alternate;
}
@keyframes flicker {
  0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
  20%, 24%, 55% { opacity: 0.6; }
}
.intro-sub {
  font-size: clamp(0.85rem, 2vw, 1.1rem);
  color: var(--text2);
  margin-bottom: 48px;
  letter-spacing: 0.3em;
}
/* 电话亭视觉（原创设计） */
.phone-booth {
  width: 140px; height: 220px;
  position: relative;
  margin-bottom: 40px;
}
.booth-body {
  position: absolute; inset: 0;
  border: 3px solid var(--accent);
  border-radius: 8px 8px 4px 4px;
  background: linear-gradient(180deg, rgba(0,240,255,0.08) 0%, rgba(0,240,255,0.02) 100%);
  box-shadow: 0 0 30px rgba(0,240,255,0.15), inset 0 0 20px rgba(0,240,255,0.05);
}
.booth-roof {
  position: absolute; top: -18px; left: 10px; right: 10px;
  height: 18px;
  border: 3px solid var(--accent);
  border-bottom: none;
  border-radius: 50% 50% 0 0;
  background: rgba(0,240,255,0.06);
}
.booth-door {
  position: absolute; bottom: 0; left: 20px; right: 20px; height: 70%;
  border: 2px solid var(--accent);
  border-bottom: none;
  background: rgba(0,240,255,0.04);
}
.booth-window {
  position: absolute; top: 30px; left: 24px; right: 24px; height: 50px;
  border: 2px solid var(--accent);
  background: rgba(0,240,255,0.08);
  animation: boothGlow 2s ease-in-out infinite alternate;
}
@keyframes boothGlow {
  from { box-shadow: inset 0 0 10px rgba(0,240,255,0.1); }
  to { box-shadow: inset 0 0 25px rgba(0,240,255,0.35); }
}
.booth-label {
  position: absolute; top: -36px; left: 50%; transform: translateX(-50%);
  font-size: 0.65rem; letter-spacing: 0.2em;
  color: var(--accent); white-space: nowrap;
  text-shadow: 0 0 8px var(--accent);
}

/* 输入区域 */
.input-area {
  display: flex; align-items: center; gap: 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 20px;
  max-width: 90vw; width: 520px;
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
}
.input-area span { color: var(--accent); font-size: 1.1rem; white-space: nowrap; }
#whatIfInput {
  flex: 1; background: transparent; border: none;
  color: var(--text); font-size: 1.05rem;
  outline: none; padding: 4px 0;
}
#whatIfInput::placeholder { color: #505060; }
#goBtn {
  background: linear-gradient(135deg, var(--accent), #0088aa);
  border: none; color: #000; font-weight: 700;
  padding: 10px 28px; border-radius: 8px;
  cursor: pointer; font-size: 0.95rem;
  transition: transform 0.2s, box-shadow 0.2s;
}
#goBtn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,240,255,0.3); }
.hint-list {
  margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; max-width: 90vw;
}
.hint-chip {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  color: var(--text2); font-size: 0.8rem;
  padding: 6px 14px; border-radius: 20px;
  cursor: pointer; transition: all 0.2s;
}
.hint-chip:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,240,255,0.06); }

/* ===== 加载画面 ===== */
#loading {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 90; background: var(--bg);
}
#loading.active { display: flex; }
.loading-ring {
  width: 80px; height: 80px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 24px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  font-size: 1.1rem; color: var(--accent);
  letter-spacing: 0.15em;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
.loading-steps {
  margin-top: 20px; font-size: 0.85rem; color: var(--text2);
  text-align: center; line-height: 1.8;
}

/* ===== 主界面 ===== */
#main {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  z-index: 10;
}
#main.active { display: flex; }

/* 顶部栏 */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  background: rgba(10,10,15,0.85); backdrop-filter: blur(10px);
}
.top-bar .logo { font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: 0.1em; }
.top-bar .world-title { font-size: 0.95rem; color: var(--text2); max-width: 50vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-bar button {
  background: var(--panel); border: 1px solid var(--border);
  color: var(--text2); padding: 6px 16px; border-radius: 6px;
  cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
}
.top-bar button:hover { border-color: var(--accent); color: var(--accent); }

/* 内容区 */
.content {
  flex: 1; display: flex; overflow: hidden;
}

/* 左侧：世界详情（原右侧内容移过来） */
.left-panel {
  width: 340px; min-width: 280px;
  border-right: 1px solid var(--border);
  background: var(--bg2);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel-header {
  padding: 14px 16px; font-size: 0.85rem;
  font-weight: 700; color: var(--accent);
  border-bottom: 1px solid var(--border);
  letter-spacing: 0.1em; text-transform: uppercase;
}
#chainCanvas {
  flex: 1; width: 100%; cursor: grab;
}
#chainCanvas:active { cursor: grabbing; }

/* 中间：场景 */
.center-panel {
  flex: 1; display: flex; flex-direction: column;
  position: relative; overflow: hidden;
}
.scene-tabs {
  display: flex; gap: 0; border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.scene-tab {
  flex: 1; text-align: center; padding: 12px;
  font-size: 0.85rem; color: var(--text2);
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: all 0.2s; background: transparent; border: none;
}
.scene-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(0,240,255,0.04); }
.scene-tab:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.03); }
#sceneContainer {
  flex: 1; position: relative; overflow: hidden;
  background: #0c0c14;
}
#worldScene {
  width: 100%; height: 100%; display: block;
}
.scene-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 16px 20px;
  background: linear-gradient(transparent, rgba(10,10,15,0.95));
  pointer-events: none;
}
.scene-desc {
  font-size: 0.9rem; color: var(--text);
  line-height: 1.6; max-width: 700px;
}
.scene-time {
  font-size: 0.75rem; color: var(--accent);
  margin-bottom: 6px; letter-spacing: 0.1em;
}

/* 右侧：连锁反应网络（原左侧内容移过来） */
.right-panel {
  width: 320px; min-width: 260px;
  border-left: 1px solid var(--border);
  background: var(--bg2);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.detail-section { padding: 16px; border-bottom: 1px solid var(--border); }
.detail-section h3 {
  font-size: 0.8rem; color: var(--accent);
  margin-bottom: 10px; letter-spacing: 0.1em;
  text-transform: uppercase;
}
.detail-text { font-size: 0.88rem; color: var(--text); line-height: 1.7; }
.reaction-list { display: flex; flex-direction: column; gap: 8px; }
.reaction-item {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px;
  font-size: 0.85rem; line-height: 1.5;
  position: relative; overflow: hidden;
}
.reaction-item::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--accent);
}
.reaction-item.level-2::before { background: var(--accent3); }
.reaction-item.level-3::before { background: var(--accent2); }
.reaction-item .level-tag {
  font-size: 0.65rem; padding: 2px 6px; border-radius: 4px;
  background: rgba(0,240,255,0.12); color: var(--accent);
  margin-right: 6px; vertical-align: middle;
}
.reaction-item.level-2 .level-tag { background: rgba(5,255,161,0.12); color: var(--accent3); }
.reaction-item.level-3 .level-tag { background: rgba(255,42,109,0.12); color: var(--accent2); }

/* 数据对比 */
.compare-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.compare-item {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px; text-align: center;
}
.compare-item .label { font-size: 0.7rem; color: var(--text2); margin-bottom: 4px; }
.compare-item .real { font-size: 0.85rem; color: var(--text); }
.compare-item .alt { font-size: 1rem; color: var(--accent2); font-weight: 700; margin-top: 2px; }
.compare-item .arrow { font-size: 0.7rem; color: var(--text2); margin: 2px 0; }

/* 时间轴 */
.timeline-wrap {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.timeline-track {
  position: relative; height: 36px;
  background: var(--panel); border-radius: 18px;
  overflow: hidden;
}
.timeline-progress {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--accent), var(--accent3));
  border-radius: 18px; width: 100%;
  transition: width 0.3s;
}
.timeline-labels {
  display: flex; justify-content: space-between;
  margin-top: 6px; font-size: 0.7rem; color: var(--text2);
}
#yearSlider {
  width: 100%; margin-top: 8px;
  -webkit-appearance: none; appearance: none;
  height: 4px; background: var(--border); border-radius: 2px; outline: none;
}
#yearSlider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent); cursor: pointer;
  box-shadow: 0 0 10px rgba(0,240,255,0.5);
}

/* 对话弹窗 */
.dialogue-box {
  position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
  max-width: 560px; width: 90vw;
  background: rgba(18,18,30,0.96);
  border: 1px solid var(--accent);
  border-radius: 12px; padding: 16px 20px;
  display: none; z-index: 50;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 20px rgba(0,240,255,0.1);
  animation: dialogueIn 0.3s ease;
}
@keyframes dialogueIn {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.dialogue-box.active { display: block; }
.dialogue-speaker {
  font-size: 0.8rem; color: var(--accent);
  margin-bottom: 8px; font-weight: 700;
}
.dialogue-text {
  font-size: 0.9rem; color: var(--text); line-height: 1.7;
}
.dialogue-close {
  position: absolute; top: 8px; right: 12px;
  background: none; border: none; color: var(--text2);
  font-size: 1.2rem; cursor: pointer;
}
.dialogue-close:hover { color: var(--accent); }

/* 粒子背景 */
#particles {
  position: absolute; inset: 0; pointer-events: none; z-index: 1;
}

/* 响应式 */
@media (max-width: 1024px) {
  .left-panel { width: 260px; min-width: 220px; }
  .right-panel { width: 280px; min-width: 240px; }
}
@media (max-width: 768px) {
  .content { flex-direction: column; }
  .left-panel, .right-panel { width: 100%; min-width: unset; border: none; border-bottom: 1px solid var(--border); max-height: 35vh; }
  .right-panel { border-bottom: none; border-top: 1px solid var(--border); }
  .center-panel { min-height: 40vh; }
}

/* ===== 虚拟方向键（移动端） ===== */
#virtualControls {
  position: absolute;
  bottom: 10px;
  left: 0;
  right: 0;
  display: none;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 20px;
  pointer-events: none;
  z-index: 30;
}
@media (max-width: 768px), (pointer: coarse) {
  #virtualControls { display: flex !important; }
}
.vpad-dpad {
  display: grid;
  grid-template-columns: 44px 44px 44px;
  grid-template-rows: 44px 44px 44px;
  gap: 4px;
  pointer-events: auto;
}
.vpad-btn {
  width: 44px; height: 44px;
  background: rgba(0,240,255,0.12);
  border: 1px solid rgba(0,240,255,0.35);
  color: #00f0ff;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  padding: 0;
}
.vpad-btn:active { background: rgba(0,240,255,0.35); }
.vpad-up { grid-column: 2; grid-row: 1; }
.vpad-left { grid-column: 1; grid-row: 2; }
.vpad-center { grid-column: 2; grid-row: 2; background: rgba(0,240,255,0.06); border-style: dashed; }
.vpad-right { grid-column: 3; grid-row: 2; }
.vpad-down { grid-column: 2; grid-row: 3; }
.vpad-action {
  width: 60px; height: 60px;
  background: rgba(255,42,109,0.15);
  border: 2px solid rgba(255,42,109,0.4);
  color: #ff2a6d;
  border-radius: 50%;
  font-size: 18px; font-weight: bold;
  cursor: pointer;
  pointer-events: auto;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  margin-bottom: 8px;
}
.vpad-action:active { background: rgba(255,42,109,0.4); }
</style>
</head>
<body>
<div id="app">
  <!-- 粒子背景 -->
  <canvas id="particles"></canvas>

  <!-- 开场 -->
  <div id="intro">
    <div class="phone-booth">
      <div class="booth-label">WORLD MIRROR</div>
      <div class="booth-roof"></div>
      <div class="booth-body">
        <div class="booth-window"></div>
        <div class="booth-door"></div>
      </div>
    </div>
    <div class="intro-title">你想改变这个世界吗？</div>
    <div class="intro-sub">输入一个「如果」，见证蝴蝶效应</div>
    <div class="input-area">
      <span>如果</span>
      <input id="whatIfInput" type="text" placeholder="世界上没有自行车" autocomplete="off">
      <button id="goBtn">生成世界</button>
    </div>
    <div class="hint-list">
      <span class="hint-chip" data-hint="世界上没有自行车">没有自行车</span>
      <span class="hint-chip" data-hint="人类不会用火">人类不会用火</span>
      <span class="hint-chip" data-hint="纸张从未被发明">纸张从未被发明</span>
      <span class="hint-chip" data-hint="没有互联网">没有互联网</span>
      <span class="hint-chip" data-hint="恐龙没有灭绝">恐龙没有灭绝</span>
      <span class="hint-chip" data-hint="没有钟表">没有钟表</span>
      <span class="hint-chip" data-hint="玻璃从未被发明">玻璃从未被发明</span>
      <span class="hint-chip" data-hint="没有轮子">没有轮子</span>
      <span class="hint-chip" data-hint="电力从未被发现">电力从未被发现</span>
      <span class="hint-chip" data-hint="没有抗生素">没有抗生素</span>
      <span class="hint-chip" data-hint="大家都喜欢吃铜锣烧">大家都喜欢吃铜锣烧</span>
      <span class="hint-chip" data-hint="所有人都穿裙子">所有人都穿裙子</span>
      <span class="hint-chip" data-hint="人类不会笑">人类不会笑</span>
      <span class="hint-chip" data-hint="世界没有颜色">世界没有颜色</span>
      <span class="hint-chip" data-hint="生物不需要睡觉">生物不需要睡觉</span>
      <span class="hint-chip" data-hint="地球没有重力">地球没有重力</span>
      <span class="hint-chip" data-hint="镜子从未被发明">镜子从未被发明</span>
      <span class="hint-chip" data-hint="音乐从未存在">音乐从未存在</span>
      <span class="hint-chip" data-hint="人类不能说谎">人类不能说谎</span>
      <span class="hint-chip" data-hint="物体没有影子">物体没有影子</span>
    </div>
  </div>

  <!-- 加载 -->
  <div id="loading">
    <div class="loading-ring"></div>
    <div class="loading-text" id="loadingText">正在计算蝴蝶效应...</div>
    <div class="loading-steps" id="loadingSteps"></div>
  </div>

  <!-- 主界面 -->
  <div id="main">
    <div class="top-bar">
      <div class="logo">WOMIRROR</div>
      <div class="world-title" id="worldTitle">世界标题</div>
      <button id="resetBtn">返回</button>
    </div>
    <div class="timeline-wrap">
      <div class="timeline-track">
        <div class="timeline-progress" id="timelineProgress"></div>
      </div>
      <input type="range" id="yearSlider" min="0" max="100" value="100">
      <div class="timeline-labels">
        <span id="startYear">起点</span>
        <span id="currentYearLabel">现在</span>
      </div>
    </div>
    <div class="content">
      <!-- 左侧：世界详情 -->
      <div class="left-panel">
        <div class="panel-header">世界详情</div>
        <div style="flex:1; overflow-y:auto;">
          <div class="detail-section">
            <h3>世界设定</h3>
            <div class="detail-text" id="worldDesc"></div>
          </div>
          <div class="detail-section">
            <h3>连锁反应</h3>
            <div class="reaction-list" id="reactionList"></div>
          </div>
          <div class="detail-section">
            <h3>数据对比</h3>
            <div class="compare-grid" id="compareGrid"></div>
          </div>
        </div>
      </div>
      <!-- 中间场景 -->
      <div class="center-panel">
        <div class="scene-tabs" id="sceneTabs"></div>
        <div id="sceneContainer">
          <canvas id="worldScene"></canvas>
          <div class="scene-overlay">
            <div class="scene-time" id="sceneTime"></div>
            <div class="scene-desc" id="sceneDesc"></div>
          </div>
          <div class="dialogue-box" id="dialogueBox">
            <button class="dialogue-close" id="dialogueClose">&times;</button>
            <div class="dialogue-speaker" id="dialogueSpeaker"></div>
            <div class="dialogue-text" id="dialogueText"></div>
          </div>
          <div id="virtualControls">
            <div class="vpad-dpad">
              <button class="vpad-btn vpad-up" data-dir="up">&#9650;</button>
              <button class="vpad-btn vpad-left" data-dir="left">&#9664;</button>
              <button class="vpad-btn vpad-center"></button>
              <button class="vpad-btn vpad-right" data-dir="right">&#9654;</button>
              <button class="vpad-btn vpad-down" data-dir="down">&#9660;</button>
            </div>
            <button class="vpad-action" data-action="interact">F</button>
          </div>
        </div>
      </div>
      <!-- 右侧：连锁反应网络 -->
      <div class="right-panel">
        <div class="panel-header">连锁反应网络</div>
        <canvas id="chainCanvas"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   「如果」世界模拟器 - 知识引擎与渲染系统
   ============================================================ */

// ===== 知识库 =====
const KNOWLEDGE = {
  entities: {
    "自行车": {
      year: 1885, impacts: ["交通","运动","环保","城市设计","物流","制造业"],
      alternatives: ["马车","步行","汽车"], events: ["环法自行车赛","共享单车革命"],
      related: ["轮胎","链条","道路","橡胶"], category: "交通工具"

  ],
  "轮子": [
    { time: "公元前3500年，苏美尔", desc: "重物靠滚木和滑橇运输。轮子的概念从未被完善，文明发展受限。", hotspots: [{x:0.3,y:0.55,r:0.07,name:"搬运工",dialogue:"我们用圆木垫在石头下面推，但木头会磨损，路不好就走不动。"},{x:0.75,y:0.5,r:0.06,name:"首领",dialogue:"战车？那是什么？我们的战士步行，物资靠畜力拖。征服远方？太难了。"}] },
    { time: "公元前500年，欧亚大陆", desc: "没有轮式车辆，贸易范围极小。文明各自孤立，技术和思想传播缓慢。", hotspots: [{x:0.35,y:0.6,r:0.07,name:"商人",dialogue:"我走路三个月到邻国，带的货不多。如果有什么能滚动的车...但那只是传说。"},{x:0.8,y:0.55,r:0.06,name:"农民",dialogue:"犁靠人拉，地耕不深。收成看天，工具限制了我们的能力。"}] },
    { time: "2024年，无轮世界", desc: "没有汽车，没有飞机起落架，没有机械齿轮。世界依靠轨道、磁悬浮和步行。", hotspots: [{x:0.4,y:0.55,r:0.07,name:"工程师",dialogue:"我们发明了磁悬浮和气垫技术。但简单的推车？不存在。基础机械完全不同。"},{x:0.75,y:0.6,r:0.06,name:"旅行者",dialogue:"我坐磁悬浮列车穿越大陆。但去乡下？走路，或者骑一种没有轮子的悬浮滑板。"}] }
  ],
  "电": [
    { time: "1752年，费城", desc: "富兰克林没有捕捉闪电。电仍是神秘的自然现象，人类尚未开始驯服它。", hotspots: [{x:0.3,y:0.55,r:0.07,name:"科学家",dialogue:"我研究静电，但不知道如何利用。闪电是神的武器，凡人不可触碰。"},{x:0.75,y:0.5,r:0.06,name:"市民",dialogue:"夜晚靠蜡烛和油灯。读书伤眼睛，但没有办法。"}] },
    { time: "1880年，世界", desc: "没有电灯，没有电报。蒸汽机是唯一的动力源，城市被煤烟笼罩。", hotspots: [{x:0.35,y:0.6,r:0.07,name:"工厂工人",dialogue:"机器靠蒸汽驱动，锅炉房又热又危险。但这是我们唯一知道的动力。"},{x:0.8,y:0.55,r:0.06,name:"记者",dialogue:"消息靠蒸汽火车和信鸽传递。电报？那是科幻小说里的东西。"}] },
    { time: "2024年，蒸汽纪元", desc: "蒸汽和核能并存，但没有电子计算机。机械计算机庞大而缓慢。", hotspots: [{x:0.4,y:0.55,r:0.07,name:"程序员",dialogue:"我用机械计算机编程，打孔纸带。程序跑一天，结果可能还是错的。"},{x:0.75,y:0.6,r:0.06,name:"医生",dialogue:"没有X光，没有心电图。诊断靠听诊器和经验。很多病发现时已经太晚。"}] }
  ],
  "抗生素": [
    { time: "1928年，伦敦", desc: "弗莱明没有发现青霉素。细菌感染仍是绝症，一个小伤口可能致命。", hotspots: [{x:0.3,y:0.55,r:0.07,name:"医生",dialogue:"我尽力了。伤口感染，只能截肢。很多时候，连截肢都来不及。"},{x:0.75,y:0.5,r:0.06,name:"病人",dialogue:"我发烧了，医生给我放血。能不能活，看运气。"}] },
    { time: "1950年，全球", desc: "二战中无数士兵死于感染而非枪伤。人口增长缓慢，医疗水平停滞。", hotspots: [{x:0.35,y:0.6,r:0.07,name:"战地护士",dialogue:"伤口感染比子弹更可怕。我们消毒、清创，但细菌太强大了。"},{x:0.8,y:0.55,r:0.06,name:"统计员",dialogue:"平均寿命只比1900年长了五岁。婴儿死亡率依然很高。"}] },
    { time: "2024年，后感染时代", desc: "没有抗生素，卫生标准极高。手术风险大，人口控制严格。", hotspots: [{x:0.4,y:0.55,r:0.07,name:"外科医生",dialogue:"每台手术都是冒险。我们在无菌室里工作，穿得像宇航员。"},{x:0.75,y:0.6,r:0.06,name:"普通人",dialogue:"我从不让孩子在外面玩得太疯。一个小伤口，可能改变一生。"}] }
  ],
  "铜锣烧": [
    { time: "1914年，东京", desc: "铜锣烧突然成为全民狂热。街头巷尾都是红豆香气，人们排队数小时只为一个。", hotspots: [{x:0.3,y:0.55,r:0.07,name:"糕点师",dialogue:"我一天做三千个铜锣烧！红豆用完了，现在用绿豆、黑豆、甚至巧克力馅。"},{x:0.75,y:0.5,r:0.06,name:"食客",dialogue:"我早餐吃铜锣烧，午餐吃铜锣烧，晚餐...还是铜锣烧。我的血糖？那是什么？"}] },
    { time: "1960年，全球", desc: "铜锣烧取代面包成为主食。世界经济围绕红豆和面粉波动，糖尿病研究成为显学。", hotspots: [{x:0.35,y:0.6,r:0.07,name:"经济学家",dialogue:"红豆期货决定了股市走向。去年干旱，全球陷入'铜锣烧危机'。"},{x:0.8,y:0.55,r:0.06,name:"医生",dialogue:"我们发明了'铜锣烧替代品'，但没人吃。人们说：'没有红豆馅，活着有什么意义？'"}] },
    { time: "2024年，甜蜜纪元", desc: "铜锣烧成为宗教般的存在。人们建造铜锣烧形状的建筑，婚礼上要交换铜锣烧。", hotspots: [{x:0.4,y:0.55,r:0.07,name:"建筑师",dialogue:"我设计了世界上最高的铜锣烧塔，高828米。每层都是不同口味。"},{x:0.75,y:0.6,r:0.06,name:"新娘",dialogue:"我的婚纱是铜锣烧色的。婚礼蛋糕？不，是婚礼铜锣烧塔，一百层！"}] }
  ],
  "裙子": [
    { time: "公元前3000年，古埃及", desc: "所有人，无论男女，都穿裙子。裤子从未被发明，骑马的民族只能侧坐。", hotspots: [{x:0.3,y:0.55,r:0.07,name:"裁缝",dialogue:"我只会做裙子。长裙、短裙、百褶裙...但有人问我'裤子是什么'，我不知道。"},{x:0.75,y:0.5,r:0.06,name:"士兵",dialogue:"我们穿裙子上战场。风大的时候很尴尬，但传统就是传统。"}] },
    { time: "1850年，欧洲", desc: "裙子成为权力象征。裙摆越大，地位越高。贵族女士的裙子需要十人搀扶。", hotspots: [{x:0.35,y:0.6,r:0.07,name:"贵族",dialogue:"我的裙摆直径五米，需要四个仆人抬着。这才是身份的象征！"},{x:0.8,y:0.55,r:0.06,name:"工人",dialogue:"我们穿短裙干活。贵族说我们不体面，但至少能走路。"}] },
    { time: "2024年，裙裾时代", desc: "裙子成为 universal fashion。男性穿裙子上班，学校统一裙装。裤子只在博物馆里。", hotspots: [{x:0.4,y:0.55,r:0.07,name:"上班族",dialogue:"我穿西装裙上班，配领带。空调房里有点冷，但大家都这样。"},{x:0.75,y:0.6,r:0.06,name:"学生",dialogue:"我们的校服是百褶裙，男生女生都一样。有人说想试试'裤子'，被老师骂了。"}] }
  ],
  "笑声": [
    { time: "公元前50000年，非洲", desc: "人类不会笑。表达愉悦的方式是拍打地面或发出嗡嗡声。社交很尴尬。", hotspots: [{x:0.3,y:0.55,r:0.07,name:"部落成员",dialogue:"我很高兴，所以我拍地。你很高兴，你也拍地。我们就这样交流。"},{x:0.75,y:0.5,r:0.06,name:"孩子",dialogue:"我看到有趣的事，想发出那种'哈哈'的声音，但喉咙做不到。"}] },
    { time: "1800年，全球", desc: "没有笑声的世界，喜剧靠文字描述。莎士比亚的悲剧很受欢迎，但'喜剧'没人看得懂。", hotspots: [{x:0.35,y:0.6,r:0.07,name:"剧作家",dialogue:"我写了一个剧本，里面的人说'这很好笑'，然后停顿。观众点头，但不笑。"},{x:0.8,y:0.55,r:0.06,name:"观众",dialogue:"我知道这是喜剧，因为剧本上写着。但我只能微笑，然后鼓掌。"}] },
    { time: "2024年，寂静星球", desc: "笑声被当作疾病治疗。有人偷偷练习笑，被视为怪胎。", hotspots: [{x:0.4,y:0.55,r:0.07,name:"心理医生",dialogue:"我治疗了一个病人，他会发出'哈哈'的声音。我诊断他为'过度愉悦症'。"},{x:0.75,y:0.6,r:0.06,name:"地下笑者",dialogue:"我们在地下室聚会，偷偷练习笑。被发现的话，会被送去'安静治疗'。"}] }
  ],
  "颜色": [
    { time: "大爆炸后", desc: "宇宙只有黑白灰。彩虹是七种灰色的渐变，夕阳是深灰到浅灰。", hotspots: [{x:0.3,y:0.55,r:0.07,name:"物理学家",dialogue:"光谱存在，但我们只能感知亮度。波长？那是什么？能吃吗？"},{x:0.75,y:0.5,r:0.06,name:"画家",dialogue:"我用不同深浅的灰作画。这幅叫'红色的愤怒'，其实是深灰色。"}] },
    { time: "2024年，灰度世界", desc: "交通灯是黑白闪烁，红绿灯不存在。时尚靠纹理区分，艺术靠明暗。", hotspots: [{x:0.35,y:0.6,r:0.07,name:"交警",dialogue:"红灯是快速闪烁，绿灯是慢速闪烁。色盲？那是什么？大家都一样。"},{x:0.8,y:0.55,r:0.06,name:"时尚设计师",dialogue:"今年流行'深灰配浅灰'，加上豹纹纹理。颜色？没听说过。"}] },
    { time: "3024年，光谱觉醒", desc: "有人突然能看到颜色了！被视为超能力者，被政府追捕。", hotspots: [{x:0.4,y:0.55,r:0.07,name:"觉醒者",dialogue:"我看到天空是...蓝色的？草是...绿色的？我不敢告诉别人，他们会把我关起来。"},{x:0.75,y:0.6,r:0.06,name:"政府特工",dialogue:"报告：发现一名'色觉异常者'。建议立即收容，防止社会恐慌。"}] }
  ],
  "睡眠": [
    { time: "公元前4亿年", desc: "生物不需要睡眠。24小时活动，进化速度极快，但也极累。", hotspots: [{x:0.3,y:0.55,r:0.07,name:"原始鱼",dialogue:"我不睡觉，一直游。累？那是什么？我只知道我一直在动。"},{x:0.75,y:0.5,r:0.06,name:"进化论者",dialogue:"没有睡眠，就没有梦境，就没有潜意识。文明发展路径完全不同。"}] },
    { time: "1800年，工业革命", desc: "工人24小时轮班，机器不停。没有睡眠，就没有休息，工伤率极高。", hotspots: [{x:0.35,y:0.6,r:0.07,name:"工厂主",dialogue:"我的工人三班倒，每人工作16小时。没有睡眠？他们不知道那是什么。"},{x:0.8,y:0.55,r:0.06,name:"工人",dialogue:"我累了就喝咖啡，再累就喝更多咖啡。倒下？那是机器的事，不是人的。"}] },
    { time: "2024年，永醒社会", desc: "发明了'休息替代技术'，但没人用。人们崇拜'不眠者'，睡觉被视为懒惰。", hotspots: [{x:0.4,y:0.55,r:0.07,name:"CEO",dialogue:"我每天工作20小时，只休息4小时。睡觉？那是失败者的事。"},{x:0.75,y:0.6,r:0.06,name:"地下睡客",dialogue:"我在地下室偷偷睡觉。那种失去意识的感觉...太美妙了。但被发现就完了。"}] }
  ],
  "重力": [
    { time: "大爆炸后", desc: "没有重力，物质无法聚集。宇宙是稀薄的粒子汤，没有星球，没有生命。", hotspots: [{x:0.3,y:0.55,r:0.07,name:"宇宙学家",dialogue:"物质均匀分布，没有聚集。没有恒星，没有行星，只有漂浮的尘埃。"},{x:0.75,y:0.5,r:0.06,name:"虚无",dialogue:"（没有生命，没有观察者，只有量子涨落）"}] },
    { time: "2024年，漂浮地球", desc: "地球没有重力，所有人住在固定在地壳上的建筑里。出门要系安全绳。", hotspots: [{x:0.35,y:0.6,r:0.07,name:"建筑师",dialogue:"我们的房子用磁力固定在地壳上。窗户朝内，因为外面是深渊。"},{x:0.8,y:0.55,r:0.06,name:"孩子",dialogue:"我出生就没感受过'站'的感觉。我们飘来飘去，靠磁力鞋走路。"}] },
    { time: "3024年，星际游牧", desc: "人类适应了无重力，成为星际游牧民族。星球只是补给站。", hotspots: [{x:0.4,y:0.55,r:0.07,name:"船长",dialogue:"我们的飞船没有重力系统。船员都是第三代无重力人，骨骼中空，像鸟。"},{x:0.75,y:0.6,r:0.06,name:"历史学家",dialogue:"古籍说祖先曾经'站'在'地面'上。我无法想象那种感觉。"}] }
  ],
  "镜子": [
    { time: "公元前6000年", desc: "没有镜子，人们靠水面看自己。化妆靠手感，理发靠信任。", hotspots: [{x:0.3,y:0.55,r:0.07,name:"女人",dialogue:"我每天早上到河边化妆。风一吹，水面波动，眼线就画歪了。"},{x:0.75,y:0.5,r:0.06,name:"理发师",dialogue:"我凭手感剪发。客人看不到背面，只能靠摸。投诉？他们不知道背面什么样。"}] },
    { time: "1850年，欧洲", desc: "镜子是奢侈品，只有贵族有。普通人一生不知道自己长什么样。", hotspots: [{x:0.35,y:0.6,r:0.07,name:"贵族",dialogue:"我的镜子是银制的，价值连城。我每天照十次，确认我还活着。"},{x:0.8,y:0.55,r:0.06,name:"农民",dialogue:"我听说国王有'能看到自己的神器'。我？我只在雨天水坑里看过模糊的影子。"}] },
    { time: "2024年，无镜社会", desc: "自拍不存在，社交媒体没有头像。人们靠他人描述认识自己。", hotspots: [{x:0.4,y:0.55,r:0.07,name:"网红",dialogue:"我有十万粉丝，但从没见过自己。粉丝说我很美，我选择相信。"},{x:0.75,y:0.6,r:0.06,name:"心理医生",dialogue:"'自我认知障碍'患者激增。人们不知道自己长什么样，导致身份危机。"}] }
  ],
  "音乐": [
    { time: "公元前50000年", desc: "人类不会创造音乐。只有自然声音：风声、雨声、兽吼。", hotspots: [{x:0.3,y:0.55,r:0.07,name:"部落长者",dialogue:"我们敲打骨头，但那只是信号，不是'音乐'。什么是音乐？能吃吗？"},{x:0.75,y:0.5,r:0.06,name:"孩子",dialogue:"我听到风吹过洞穴，发出好听的声音。我想再听，但风不总是吹。"}] },
    { time: "1800年，全球", desc: "没有乐器，没有歌曲。军队靠鼓点行军，教堂靠朗诵经文。", hotspots: [{x:0.35,y:0.6,r:0.07,name:"牧师",dialogue:"我们朗诵圣经，没有旋律。有人说'唱'是什么，但没人知道怎么做。"},{x:0.8,y:0.55,r:0.06,name:"士兵",dialogue:"我们靠鼓点行军。节奏？那是什么？我们只懂快和慢。"}] },
    { time: "2024年，寂静星球", desc: "有人突然能'听到'不存在的声音！被视为精神病患者。", hotspots: [{x:0.4,y:0.55,r:0.07,name:"患者",dialogue:"我脑子里有声音！旋律！节奏！它们不让我睡觉！医生，救救我！"},{x:0.75,y:0.6,r:0.06,name:"医生",dialogue:"典型的'幻听症'。我们用电击治疗，但声音越来越多...等等，我也听到了？"}] }
  ],
  "谎言": [
    { time: "公元前10万年", desc: "人类只能说真话。社交极其尴尬，婚姻靠抽签，政治不存在。", hotspots: [{x:0.3,y:0.55,r:0.07,name:"原始人",dialogue:"你问我这兽皮好看吗？我说'不，你很胖'。然后她哭了。我说的是真话啊！"},{x:0.75,y:0.5,r:0.06,name:"酋长",dialogue:"我宣布：'我不想当酋长，我只是怕死'。然后大家选了我。为什么？"}] },
    { time: "1800年，欧洲", desc: "文学只有纪实，小说不存在。戏剧只有纪录片，演员就是他们自己。", hotspots: [{x:0.35,y:0.6,r:0.07,name:"作家",dialogue:"我想写一个人变成虫的故事。但那是假的，所以我不能写。我只能写日记。"},{x:0.8,y:0.55,r:0.06,name:"演员",dialogue:"我演哈姆雷特，但我不是哈姆雷特。导演说：'你只能演你自己'。票房惨淡。"}] },
    { time: "2024年，诚实乌托邦", desc: "谎言检测器随身携带。约会时双方先看体检报告和信用记录。", hotspots: [{x:0.4,y:0.55,r:0.07,name:"约会者",dialogue:"你好，这是我的诚实档案：我自私、懒惰、偶尔出轨。你呢？"},{x:0.75,y:0.6,r:0.06,name:"政客",dialogue:"我竞选总统。我的政见是：我不知道怎么治理国家，我只是想要权力。请投我一票？"}] }
  ],
  "影子": [
    { time: "大爆炸后", desc: "没有影子，光直接穿透物体。建筑没有阴影，人没有轮廓。", hotspots: [{x:0.3,y:0.55,r:0.07,name:"物理学家",dialogue:"光子和物质不相互作用。我们看到物体，但看不到它们的形状。"},{x:0.75,y:0.5,r:0.06,name:"艺术家",dialogue:"我画了一幅画，但分不清画的是人还是树。没有影子，没有轮廓。"}] },
    { time: "2024年，无影世界", desc: "建筑靠发光区分，人靠声音识别。摄影不存在，因为照片没有层次。", hotspots: [{x:0.35,y:0.6,r:0.07,name:"摄影师",dialogue:"我拍了张照片，但所有东西都一样亮。分不清前景和背景，艺术不存在了。"},{x:0.8,y:0.55,r:0.06,name:"建筑师",dialogue:"我们的建筑靠不同颜色的光区分。阴影？那是什么？我们靠亮度做设计。"}] },

// ===== 解析器 =====
function parseIfStatement(text) {
  const t = text.trim();
  // 匹配模式：没有/不存在/从未被发明/从未被发现/没有灭绝/消失/从未出现
  const patterns = [
    { regex: /没有(.+?)[了$]?/, type: "没有" },
    { regex: /(.+?)不存在/, type: "不存在" },
    { regex: /(.+?)从未被发明/, type: "从未被发明" },
    { regex: /(.+?)从未被发现/, type: "从未被发现" },
    { regex: /(.+?)没有灭绝/, type: "没有灭绝" },
    { regex: /(.+?)消失/, type: "没有" },
    { regex: /(.+?)从未出现/, type: "不存在" }
  ];
  for (const p of patterns) {
    const m = t.match(p.regex);
    if (m) {
      let entity = m[1].trim();
      // 去除末尾的"的话""呢"等语气词
      entity = entity.replace(/[的话呢吗]/g, "").trim();
      return { entity, changeType: p.type };
    }
  }
  // 兜底：提取最后的名词
  const lastNoun = t.replace(/如果|世界|上|里|中|的/g, "").trim();
  return { entity: lastNoun || "未知", changeType: "没有" };
}

function findEntity(entityName) {
  const keys = Object.keys(KNOWLEDGE.entities);
  // 精确匹配
  if (KNOWLEDGE.entities[entityName]) return entityName;
  // 模糊匹配
  for (const k of keys) {
    if (entityName.includes(k) || k.includes(entityName)) return k;
  }
  // 关键词匹配
  const aliasMap = {
    "自行车": ["单车", "脚踏车", "两轮车", "bike"],
    "火": ["火焰", "燃烧", "火种"],
    "纸": ["纸张", "造纸", "纸浆"],
    "互联网": ["网络", "因特网", "web", "net"],
    "恐龙": ["dinosaur", "巨龙"],
    "钟表": ["时钟", "手表", "计时器", "时间"],
    "玻璃": ["玻璃窗", "镜片", "琉璃"],
    "轮子": ["车轮", "轮胎", "轮轴"],
    "电": ["电力", "电能", "电流"],
    "抗生素": ["青霉素", "抗菌", "药物"],
    "铜锣烧": ["铜锣", "红豆饼", "dorayaki", "甜食"],
    "裙子": ["裙", "裙装", "裙裾", "dress", "skirt"],
    "笑声": ["笑", "哈哈", "微笑", "大笑", "laugh"],
    "颜色": ["色彩", "彩色", "色", "color", "colour"],
    "睡眠": ["睡觉", "睡", "休息", "sleep", "梦境"],
    "重力": ["引力", "地心引力", "gravity"],
    "镜子": ["镜", "反射", "mirror"],
    "音乐": ["歌曲", "旋律", "乐器", "music", "song"],
    "谎言": ["谎", "假话", "欺骗", "lie", "撒谎"],
    "影子": ["影", "阴影", "shadow", "剪影"]
  };
  for (const [k, aliases] of Object.entries(aliasMap)) {
    if (k === entityName || aliases.some(a => entityName.includes(a) || a.includes(entityName))) {
      return k;
    }
  }
  return null;
}

// ===== 世界生成器 =====
function generateWorld(ifStatement) {
  const { entity: rawEntity, changeType } = parseIfStatement(ifStatement);
  const matchedKey = findEntity(rawEntity);
  const entityInfo = matchedKey ? KNOWLEDGE.entities[matchedKey] : null;
  const entity = matchedKey || rawEntity;

  const chainReactions = [];
  const scenes = [];

  if (entityInfo) {
    const rule = KNOWLEDGE.rules[changeType] || KNOWLEDGE.defaultRule;
    const impacts = entityInfo.impacts;
    const alternatives = entityInfo.alternatives;
    const related = entityInfo.related;
    const events = entityInfo.events;

    // 第一层：直接影响
    rule.effects.forEach((tpl, i) => {
      const text = tpl
        .replace(/{entity}/g, entity)
        .replace(/{impact}/g, impacts[i % impacts.length])
        .replace(/{alternative}/g, alternatives[i % alternatives.length])
        .replace(/{related}/g, related[i % related.length])
        .replace(/{event}/g, events[i % events.length]);
      chainReactions.push({ level: 1, text });
    });

    // 第二层：间接影响
    rule.downstream.forEach((tpl, i) => {
      const text = tpl
        .replace(/{entity}/g, entity)
        .replace(/{impact}/g, impacts[i % impacts.length])
        .replace(/{alternative}/g, alternatives[i % alternatives.length])
        .replace(/{related}/g, related[i % related.length])
        .replace(/{event}/g, events[i % events.length]);
      chainReactions.push({ level: 2, text });
    });

    // 第三层：深远影响（基于实体特性生成）
    const deepEffects = generateDeepEffects(entity, entityInfo, changeType);
    deepEffects.forEach(t => chainReactions.push({ level: 3, text: t }));

    // 场景
    const sceneKey = matchedKey || Object.keys(SCENE_TEMPLATES)[0];
    scenes.push(...(SCENE_TEMPLATES[sceneKey] || DEFAULT_SCENES));
  } else {
    // 未知实体：生成通用连锁反应
    chainReactions.push(
      { level: 1, text: `${entity}的缺失直接影响了依赖它的领域` },
      { level: 1, text: `替代方案被迫提前发展` },
      { level: 2, text: `社会结构因${entity}的消失而逐步调整` },
      { level: 2, text: `相关技术路径发生根本性改变` },
      { level: 3, text: `长期来看，人类文明发展轨迹被显著改变` },
      { level: 3, text: `文化、经济、科技呈现完全不同的面貌` }
    );
    scenes.push(...DEFAULT_SCENES);
  }

  // 世界描述
  const worldDescription = generateWorldDescription(entity, entityInfo, changeType, chainReactions);

  // 数据对比
  const comparisons = generateComparisons(entity, entityInfo, changeType);

  return { entity, changeType, entityInfo, worldDescription, chainReactions, scenes, comparisons, year: entityInfo ? entityInfo.year : 1900 };
}

// 粒子背景
function initParticles() {
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");
  let W, H, particles = [];
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
      r: Math.random() * 1.5 + 0.5, alpha: Math.random() * 0.5 + 0.1
    });
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,240,255,${p.alpha})`;
      ctx.fill();
    });
    // 连线
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(0,240,255,${0.08 * (1 - d / 120)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
}

// 连锁反应图
function buildChainGraph(world) {
  const nodes = [];
  const links = [];
  const reactions = world.chainReactions;
  const cx = 160, startY = 40, gapY = 70;

  // 根节点
  nodes.push({ id: "root", x: cx, y: startY, r: 28, label: world.entity, level: 0 });

  // 按层级分配节点
  const levels = [[], [], []];
  reactions.forEach((r, i) => {
    if (r.level >= 1 && r.level <= 3) levels[r.level - 1].push({ ...r, idx: i });
  });

  levels.forEach((lvl, li) => {
    const count = lvl.length || 1;
    const spread = Math.min(240, count * 70);
    const startX = cx - spread / 2;
    const step = count > 1 ? spread / (count - 1) : 0;
    lvl.forEach((item, i) => {
      const nx = count === 1 ? cx : startX + step * i;
      const ny = startY + (li + 1) * gapY;
      const nid = `n${li}_${i}`;
      nodes.push({ id: nid, x: nx, y: ny, r: 18, label: getShortLabel(item.text), level: item.level, fullText: item.text });
      // 连接父节点
      if (li === 0) {
        links.push({ from: "root", to: nid });
      } else {
        // 连接到上一层的最近节点
        const prevLevel = levels[li - 1];
        const prevCount = prevLevel.length;
        const parentIdx = Math.min(Math.floor((i / count) * prevCount), prevCount - 1);
        links.push({ from: `n${li - 1}_${parentIdx}`, to: nid });
      }
    });
  });

  return { nodes, links };
}

function getShortLabel(text) {
  // 提取前6-8个字符作为标签
  if (text.length <= 8) return text;
  return text.slice(0, 7) + "...";
}

function drawChainGraph() {
  const canvas = document.getElementById("chainCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height - 40; // 减去header高度

  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  if (!chainNodes.length) return;

  // 绘制连线
  chainLinks.forEach(l => {
    const a = chainNodes.find(n => n.id === l.from);
    const b = chainNodes.find(n => n.id === l.to);
    if (!a || !b) return;
    const ax = a.x + chainOffset.x, ay = a.y + chainOffset.y;
    const bx = b.x + chainOffset.x, by = b.y + chainOffset.y;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    const grad = ctx.createLinearGradient(ax, ay, bx, by);
    grad.addColorStop(0, "rgba(0,240,255,0.4)");
    grad.addColorStop(1, "rgba(255,42,109,0.4)");
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // 绘制节点
  chainNodes.forEach(n => {
    const x = n.x + chainOffset.x, y = n.y + chainOffset.y;
    const color = n.level === 0 ? "#00f0ff" : n.level === 1 ? "#00f0ff" : n.level === 2 ? "#05ffa1" : "#ff2a6d";
    // 外发光
    ctx.beginPath();
    ctx.arc(x, y, n.r + 6, 0, Math.PI * 2);
    ctx.fillStyle = color + "18";
    ctx.fill();
    // 节点
    ctx.beginPath();
    ctx.arc(x, y, n.r, 0, Math.PI * 2);
    ctx.fillStyle = "#161620";
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
    // 文字
    ctx.fillStyle = color;
    ctx.font = n.level === 0 ? "bold 12px sans-serif" : "10px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(n.label, x, y);
  });
}

function createSeededRNG(seed) {
  let s = seed;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

// ===== 获取场景风格 =====
function getSceneStyle(timeStr) {
  if (timeStr.includes("公元前") || timeStr.includes("远古") || timeStr.includes("大爆炸") || timeStr.includes("年前")) return "ancient";
  if (timeStr.includes("中世纪") || /\b1\d{3}\b/.test(timeStr)) return "medieval";
  if (timeStr.includes("3024") || timeStr.includes("未来") || timeStr.includes("星际")) return "future";
  return "modern";
}

function isSolidTile(tile) {
  return tile === TILE.WALL || tile === TILE.WATER || tile === TILE.TREE ||
         tile === TILE.ROCK || tile === TILE.TABLE || tile === TILE.CHAIR ||
         tile === TILE.BED || tile === TILE.DESK || tile === TILE.MACHINE ||
         tile === TILE.FENCE;
}

// ===== 生成RPG地图 =====
function generateRPGMap(scene, entityName, sceneIndex) {
  const width = 22;
  const height = 16;
  const map = [];
  for (let y = 0; y < height; y++) {
    const row = [];
    for (let x = 0; x < width; x++) row.push(TILE.EMPTY);
    map.push(row);
  }

  // 边界墙
  for (let x = 0; x < width; x++) { map[0][x] = TILE.WALL; map[height-1][x] = TILE.WALL; }
  for (let y = 0; y < height; y++) { map[y][0] = TILE.WALL; map[y][width-1] = TILE.WALL; }

  const style = getSceneStyle(scene.time || "");
  const seed = (entityName || "default").length * 31 + sceneIndex * 17;
  const rng = createSeededRNG(seed);

  // 内部障碍物
  const obstacleCount = 6 + Math.floor(rng() * 6);
  for (let i = 0; i < obstacleCount; i++) {
    const ox = 2 + Math.floor(rng() * (width - 4));
    const oy = 2 + Math.floor(rng() * (height - 4));
    if (map[oy][ox] === TILE.EMPTY) {
      const r = rng();
      if (r < 0.25) map[oy][ox] = TILE.TREE;
      else if (r < 0.45) map[oy][ox] = TILE.ROCK;
      else if (r < 0.6) map[oy][ox] = TILE.TABLE;
      else if (r < 0.75) map[oy][ox] = TILE.SIGN;
      else map[oy][ox] = TILE.MACHINE;
    }
  }

  // 风格化房间/区域
  if (style === "ancient") {
    for (let i = 0; i < 4; i++) {
      const cx = 3 + Math.floor(rng() * (width - 6));
      const cy = 3 + Math.floor(rng() * (height - 6));
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const px = cx + dx, py = cy + dy;
          if (px > 1 && px < width - 2 && py > 1 && py < height - 2 && rng() > 0.3) {
            map[py][px] = TILE.ROCK;
          }
        }
      }
    }
  } else if (style === "medieval") {
    for (let i = 0; i < 2; i++) {
      const rx = 3 + Math.floor(rng() * (width - 7));
      const ry = 3 + Math.floor(rng() * (height - 7));
      const rw = 3 + Math.floor(rng() * 3);
      const rh = 3 + Math.floor(rng() * 2);
      for (let dy = 0; dy < rh; dy++) {
        for (let dx = 0; dx < rw; dx++) {
          const px = rx + dx, py = ry + dy;
          if (px > 0 && px < width - 1 && py > 0 && py < height - 1) {
            if (dx === 0 || dx === rw - 1 || dy === 0 || dy === rh - 1) {
              if (map[py][px] === TILE.EMPTY) map[py][px] = TILE.WALL;
            } else {
              map[py][px] = TILE.FLOOR;
            }
          }
        }
      }
      const doorSide = Math.floor(rng() * 4);
      let ddx = 0, ddy = 0;
      if (doorSide === 0) { ddx = Math.floor(rw / 2); ddy = 0; }
      else if (doorSide === 1) { ddx = rw - 1; ddy = Math.floor(rh / 2); }
      else if (doorSide === 2) { ddx = Math.floor(rw / 2); ddy = rh - 1; }
      else { ddx = 0; ddy = Math.floor(rh / 2); }
      const dpx = rx + ddx, dpy = ry + ddy;
      if (dpx > 0 && dpx < width - 1 && dpy > 0 && dpy < height - 1) map[dpy][dpx] = TILE.DOOR;
    }
  } else if (style === "future") {
    for (let i = 0; i < 5; i++) {
      const mx = 2 + Math.floor(rng() * (width - 4));
      const my = 2 + Math.floor(rng() * (height - 4));
      if (map[my][mx] === TILE.EMPTY) map[my][mx] = TILE.MACHINE;
    }
  } else {
    const streetY = Math.floor(height / 2);
    for (let x = 1; x < width - 1; x++) map[streetY][x] = TILE.SAND;
    for (let x = 3; x < width - 3; x += 4) {
      for (let y = 1; y < streetY - 1; y++) if (map[y][x] === TILE.EMPTY && rng() > 0.4) map[y][x] = TILE.WALL;
      for (let y = streetY + 2; y < height - 1; y++) if (map[y][x] === TILE.EMPTY && rng() > 0.4) map[y][x] = TILE.WALL;
    }
    for (let i = 0; i < 3; i++) {
      const tx = 2 + Math.floor(rng() * (width - 4));
      const ty = streetY + (rng() > 0.5 ? 1 : -1);
      if (tx > 0 && tx < width - 1 && ty > 0 && ty < height - 1 && map[ty][tx] === TILE.EMPTY) map[ty][tx] = TILE.TREE;
    }
  }

  // 实体特定元素
  const cx = Math.floor(width / 2);
  const cy = Math.floor(height / 2);
  switch (entityName) {
    case "铜锣烧":
      if (sceneIndex === 2) { map[cy][cx] = TILE.TABLE; map[cy-1][cx] = TILE.TABLE; }
      break;
    case "裙子":
      if (sceneIndex === 1) { for (let x = 4; x < width - 4; x++) { map[cy-1][x] = TILE.CARPET; map[cy][x] = TILE.CARPET; } }
      break;
    case "睡眠":
      if (sceneIndex === 2) { for (let x = 3; x < width - 3; x += 3) for (let y = 4; y < height - 3; y += 2) if (map[y][x] === TILE.EMPTY) map[y][x] = TILE.BED; }
      break;
    case "镜子":
      if (sceneIndex === 1) { for (let x = 2; x < width - 2; x++) map[cy-1][x] = TILE.CARPET; }
      break;
    case "音乐":
      if (sceneIndex === 2) { for (let x = 3; x < width - 3; x += 2) if (map[cy][x] === TILE.EMPTY) map[cy][x] = TILE.TABLE; }
      break;
    case "影子":
      if (sceneIndex === 2) { for (let i = 0; i < 8; i++) { const sx = 2 + Math.floor(rng() * (width - 4)); const sy = 2 + Math.floor(rng() * (height - 4)); if (map[sy][sx] === TILE.EMPTY) map[sy][sx] = TILE.ROCK; } }
      break;
  }

  // 生成NPC
  const npcs = [];
  if (scene.hotspots) {
    scene.hotspots.forEach((hp) => {
      const nx = Math.floor(2 + hp.x * (width - 4));
      const ny = Math.floor(2 + hp.y * (height - 4));
      if (map[ny] && map[ny][nx] === TILE.EMPTY) {
        npcs.push({
          x: nx * TILE_SIZE + TILE_SIZE / 2,
          y: ny * TILE_SIZE + TILE_SIZE / 2,
          mapX: nx, mapY: ny,
          name: hp.name,
          dialogue: hp.dialogue,
          sprite: getNPCSprite(hp.name),
          direction: DIRECTION.DOWN,
          moving: false,
          color: getNPCColor(hp.name)
        });
      }
    });
  }
  if (npcs.length === 0) {
    const defaults = [
      { name: "路人", dialogue: "这个世界很奇怪，不是吗？" },
      { name: "村民", dialogue: "你也是从另一个时间线来的吗？" }
    ];
    defaults.forEach((d, i) => {
      const nx = 4 + i * 8, ny = 5 + i * 3;
      if (map[ny] && map[ny][nx] === TILE.EMPTY) {
        npcs.push({ x: nx * TILE_SIZE + TILE_SIZE / 2, y: ny * TILE_SIZE + TILE_SIZE / 2,
          mapX: nx, mapY: ny, name: d.name, dialogue: d.dialogue,
          sprite: "👤", direction: DIRECTION.DOWN, moving: false, color: "#00f0ff" });
      }
    });
  }

  // 玩家起始位置
  let px = cx, py = cy;
  if (map[py][px] !== TILE.EMPTY) {
    for (let r = 1; r < 5; r++) {
      let found = false;
      for (let dy = -r; dy <= r && !found; dy++) {
        for (let dx = -r; dx <= r && !found; dx++) {
          const ty = py + dy, tx = px + dx;
          if (ty >= 0 && ty < height && tx >= 0 && tx < width && map[ty][tx] === TILE.EMPTY) {
            px = tx; py = ty; found = true;
          }
        }
      }
      if (found) break;
    }
  }

  return { width, height, tiles: map, npcs, playerStart: { x: px * TILE_SIZE + TILE_SIZE / 2, y: py * TILE_SIZE + TILE_SIZE / 2 } };
}

// ===== 初始化游戏 =====
function initGame(scene, entityName, sceneIndex) {
  const mapData = generateRPGMap(scene, entityName, sceneIndex);
  gameState.map = mapData.tiles;
  gameState.mapWidth = mapData.width;
  gameState.mapHeight = mapData.height;
  gameState.npcs = mapData.npcs;
  gameState.player.x = mapData.playerStart.x;
  gameState.player.y = mapData.playerStart.y;
  gameState.player.direction = DIRECTION.DOWN;
  gameState.player.moving = false;
  gameState.camera.x = 0;
  gameState.camera.y = 0;
  gameState.inDialogue = false;
  gameState.active = true;
  gameState.animFrame = 0;

  const canvas = document.getElementById("worldScene");
  if (canvas) {
    const container = document.getElementById("sceneContainer");
    const tileW = Math.max(20, Math.min(44, Math.floor(container.clientWidth / 12)));
    const tileH = Math.max(20, Math.min(44, Math.floor(container.clientHeight / 10)));
    gameState.tileSize = Math.min(tileW, tileH);
  }
  gameState.lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function stopGame() {
  gameState.active = false;
}

// ===== 游戏循环 =====
function gameLoop(timestamp) {
  if (!gameState.active) return;
  const dt = timestamp - (gameState.lastTime || timestamp);
  gameState.lastTime = timestamp;
  gameState.animFrame += dt;
  updateGame(dt);
  renderGame();
  requestAnimationFrame(gameLoop);
}

// ===== 更新逻辑 =====
function updateGame(dt) {
  if (gameState.inDialogue) return;

  let dx = 0, dy = 0;
  if (gameState.keys["ArrowUp"] || gameState.keys["w"] || gameState.keys["W"] || gameState.virtualKeys.up) { dy = -PLAYER_SPEED; gameState.player.direction = DIRECTION.UP; }
  if (gameState.keys["ArrowDown"] || gameState.keys["s"] || gameState.keys["S"] || gameState.virtualKeys.down) { dy = PLAYER_SPEED; gameState.player.direction = DIRECTION.DOWN; }
  if (gameState.keys["ArrowLeft"] || gameState.keys["a"] || gameState.keys["A"] || gameState.virtualKeys.left) { dx = -PLAYER_SPEED; gameState.player.direction = DIRECTION.LEFT; }
  if (gameState.keys["ArrowRight"] || gameState.keys["d"] || gameState.keys["D"] || gameState.virtualKeys.right) { dx = PLAYER_SPEED; gameState.player.direction = DIRECTION.RIGHT; }

  if (dx !== 0 && dy !== 0) { const f = 1 / Math.sqrt(2); dx *= f; dy *= f; }
  gameState.player.moving = (dx !== 0 || dy !== 0);

  if (dx !== 0 || dy !== 0) {
    const newX = gameState.player.x + dx;
    const newY = gameState.player.y + dy;
    if (!checkCollision(newX, gameState.player.y)) gameState.player.x = newX;
    if (!checkCollision(gameState.player.x, newY)) gameState.player.y = newY;

    const ts = gameState.tileSize;
    gameState.player.x = Math.max(ts / 2, Math.min(gameState.mapWidth * ts - ts / 2, gameState.player.x));
    gameState.player.y = Math.max(ts / 2, Math.min(gameState.mapHeight * ts - ts / 2, gameState.player.y));
  }

  // 相机跟随
  const canvas = document.getElementById("worldScene");
  if (canvas) {
    const targetCamX = gameState.player.x - canvas.width / 2;
    const targetCamY = gameState.player.y - canvas.height / 2;
    gameState.camera.x += (targetCamX - gameState.camera.x) * 0.12;
    gameState.camera.y += (targetCamY - gameState.camera.y) * 0.12;
  }

  // NPC随机移动
  gameState.npcs.forEach(npc => {
    if (Math.random() < 0.004) {
      const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
      const dir = dirs[Math.floor(Math.random() * 4)];
      const newNx = npc.x + dir[0] * PLAYER_SPEED * 0.4;
      const newNy = npc.y + dir[1] * PLAYER_SPEED * 0.4;
      if (!checkCollision(newNx, newNy)) {
        npc.x = newNx; npc.y = newNy;
        if (dir[1] < 0) npc.direction = DIRECTION.UP;
        else if (dir[1] > 0) npc.direction = DIRECTION.DOWN;
        else if (dir[0] < 0) npc.direction = DIRECTION.LEFT;
        else npc.direction = DIRECTION.RIGHT;
        npc.moving = true;
      }
    } else {
      npc.moving = false;
    }
  });
}

function checkCollision(x, y) {
  const ts = gameState.tileSize;
  const half = PLAYER_SIZE / 2;
  const corners = [
    { x: x - half + 2, y: y - half + 2 },
    { x: x + half - 2, y: y - half + 2 },
    { x: x - half + 2, y: y + half - 2 },
    { x: x + half - 2, y: y + half - 2 }
  ];
  for (const c of corners) {
    const tx = Math.floor(c.x / ts);
    const ty = Math.floor(c.y / ts);
    if (ty < 0 || ty >= gameState.mapHeight || tx < 0 || tx >= gameState.mapWidth) return true;
    if (isSolidTile(gameState.map[ty][tx])) return true;
  }
  for (const npc of gameState.npcs) {
    if (Math.sqrt((x - npc.x) ** 2 + (y - npc.y) ** 2) < PLAYER_SIZE - 2) return true;
  }
  return false;
}

// ===== 渲染系统 =====
function renderGame() {
  const canvas = document.getElementById("worldScene");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const ts = gameState.tileSize;

  ctx.fillStyle = "#0a0a14";
  ctx.fillRect(0, 0, W, H);

  const startCol = Math.floor(gameState.camera.x / ts) - VIEW_PADDING;
  const endCol = startCol + Math.ceil(W / ts) + VIEW_PADDING * 2;
  const startRow = Math.floor(gameState.camera.y / ts) - VIEW_PADDING;
  const endRow = startRow + Math.ceil(H / ts) + VIEW_PADDING * 2;

  // 绘制地图
  for (let row = Math.max(0, startRow); row < Math.min(gameState.mapHeight, endRow); row++) {
    for (let col = Math.max(0, startCol); col < Math.min(gameState.mapWidth, endCol); col++) {
      drawTile(ctx, gameState.map[row][col], col * ts - gameState.camera.x, row * ts - gameState.camera.y, ts, row, col);
    }
  }

  // 深度排序并绘制角色
  const renderList = [];
  gameState.npcs.forEach(npc => renderList.push({ type: 'npc', y: npc.y, obj: npc }));
  renderList.push({ type: 'player', y: gameState.player.y, obj: gameState.player });
  renderList.sort((a, b) => a.y - b.y);
  renderList.forEach(item => {
    if (item.type === 'npc') drawNPC(ctx, item.obj);
    else drawPlayer(ctx);
  });

  // 操作提示
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(10, H - 34, 195, 22);
  ctx.fillStyle = "#00f0ff";
  ctx.font = "11px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("方向键/WASD移动 | F对话", 16, H - 20);
}

function getTileColor(tile, row, col) {
  const base = ((row + col) % 2 === 0) ? "#1a1a2e" : "#161628";
  switch (tile) {
    case TILE.WALL: return "#2a2a3a";
    case TILE.WATER: return "#0a1a3a";
    case TILE.TREE: return base;
    case TILE.ROCK: return base;
    case TILE.TABLE: return base;
    case TILE.CHAIR: return base;
    case TILE.BED: return base;
    case TILE.DOOR: return base;
    case TILE.MACHINE: return base;
    case TILE.SIGN: return base;
    case TILE.FENCE: return base;
    case TILE.GRASS: return "#1a3015";
    case TILE.SAND: return "#2a2520";
    case TILE.FLOOR: return "#2a2a35";
    case TILE.CARPET: return "#2a1515";
    default: return base;
  }
}

function drawTile(ctx, tile, x, y, size, row, col) {
  ctx.fillStyle = getTileColor(tile, row, col);
  ctx.fillRect(x, y, size, size);

  switch (tile) {
    case TILE.WALL:
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 4, y + 4, size - 8, size - 8);
      break;
    case TILE.WATER:
      ctx.fillStyle = "rgba(0,100,200,0.25)";
      ctx.fillRect(x, y, size, size);
      const wo = Math.sin(gameState.animFrame / 500 + col * 0.5) * 3;
      ctx.fillStyle = "rgba(0,150,255,0.15)";
      ctx.fillRect(x + wo, y + size / 2, size, 2);
      break;
    case TILE.TREE:
      ctx.fillStyle = "#2d5016";
      ctx.beginPath(); ctx.arc(x + size / 2, y + size / 2, size * 0.32, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#1a3009";
      ctx.beginPath(); ctx.arc(x + size / 2, y + size / 2, size * 0.18, 0, Math.PI * 2); ctx.fill();
      break;
    case TILE.ROCK:
      ctx.fillStyle = "#555";
      ctx.beginPath(); ctx.arc(x + size / 2, y + size / 2 + 2, size * 0.28, 0, Math.PI, true); ctx.fill();
      ctx.fillStyle = "#777";
      ctx.beginPath(); ctx.arc(x + size / 2, y + size / 2, size * 0.18, 0, Math.PI, true); ctx.fill();
      break;
    case TILE.TABLE:
      ctx.fillStyle = "#8B4513";
      ctx.fillRect(x + size * 0.15, y + size * 0.3, size * 0.7, size * 0.4);
      ctx.fillStyle = "#A0522D";
      ctx.fillRect(x + size * 0.1, y + size * 0.25, size * 0.8, size * 0.1);
      break;
    case TILE.CHAIR:
      ctx.fillStyle = "#8B4513";
      ctx.fillRect(x + size * 0.3, y + size * 0.4, size * 0.4, size * 0.35);
      ctx.fillRect(x + size * 0.25, y + size * 0.2, size * 0.5, size * 0.08);
      break;
    case TILE.BED:
      ctx.fillStyle = "#4a4a6a";
      ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
      ctx.fillStyle = "#ddd";
      ctx.fillRect(x + 4, y + size * 0.3, size - 8, size * 0.5);
      break;
    case TILE.DOOR:
      ctx.fillStyle = "#654321";
      ctx.fillRect(x + size * 0.2, y + 2, size * 0.6, size - 4);
      ctx.fillStyle = "#FFD700";
      ctx.beginPath(); ctx.arc(x + size * 0.7, y + size / 2, 3, 0, Math.PI * 2); ctx.fill();
      break;
    case TILE.MACHINE:
      ctx.fillStyle = "#444";
      ctx.fillRect(x + 4, y + 4, size - 8, size - 8);
      ctx.fillStyle = "#0ff";
      ctx.fillRect(x + 8, y + 8, size - 16, 4);
      ctx.fillStyle = "#f0f";
      ctx.fillRect(x + 8, y + size - 12, size - 16, 4);
      break;
    case TILE.SIGN:
      ctx.fillStyle = "#8B4513";
      ctx.fillRect(x + size * 0.4, y + size * 0.3, size * 0.2, size * 0.5);
      ctx.fillStyle = "#DEB887";
      ctx.fillRect(x + size * 0.12, y + size * 0.12, size * 0.76, size * 0.28);
      break;
    case TILE.FENCE:
      ctx.fillStyle = "#666";
      ctx.fillRect(x + size * 0.45, y, size * 0.1, size);
      ctx.fillRect(x, y + size * 0.3, size, size * 0.1);
      ctx.fillRect(x, y + size * 0.7, size, size * 0.1);
      break;
    case TILE.GRASS:
      ctx.fillStyle = "#228B22";
      for (let i = 0; i < 3; i++) ctx.fillRect(x + 4 + i * 8, y + 4 + (i % 2) * 8, 3, 6);
      break;
    case TILE.CARPET:
      ctx.fillStyle = "#8B0000";
      ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
      ctx.strokeStyle = "#FFD700";
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 4, y + 4, size - 8, size - 8);
      break;
  }
  ctx.strokeStyle = "rgba(255,255,255,0.02)";
  ctx.lineWidth = 0.5;
  ctx.strokeRect(x, y, size, size);
}

function drawPlayer(ctx) {
  const px = gameState.player.x - gameState.camera.x;
  const py = gameState.player.y - gameState.camera.y;
  const size = PLAYER_SIZE;

  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath(); ctx.ellipse(px, py + size / 2 + 2, size / 2, size / 4, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = "#00f0ff";
  ctx.beginPath(); ctx.arc(px, py, size / 2, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = "#fff";
  const off = getDirOffset(gameState.player.direction, size / 3);
  ctx.beginPath(); ctx.arc(px + off.x, py + off.y, 3, 0, Math.PI * 2); ctx.fill();

  if (gameState.player.moving) {
    const bounce = Math.sin(gameState.animFrame / 100) * 2;
    ctx.fillStyle = "rgba(0,240,255,0.15)";
    ctx.beginPath(); ctx.arc(px, py + bounce, size / 2 + 2, 0, Math.PI * 2); ctx.fill();
  }
}

function drawNPC(ctx, npc) {
  const nx = npc.x - gameState.camera.x;
  const ny = npc.y - gameState.camera.y;
  const size = PLAYER_SIZE;

  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath(); ctx.ellipse(nx, ny + size / 2 + 2, size / 2, size / 4, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = npc.color || "#00f0ff";
  ctx.beginPath(); ctx.arc(nx, ny, size / 2, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = "#fff";
  const off = getDirOffset(npc.direction, size / 3);
  ctx.beginPath(); ctx.arc(nx + off.x, ny + off.y, 2, 0, Math.PI * 2); ctx.fill();

  // 名称标签
  ctx.font = "9px sans-serif";
  const tw = ctx.measureText(npc.name).width + 8;
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(nx - tw / 2, ny - size / 2 - 18, tw, 14);
  ctx.fillStyle = npc.color || "#00f0ff";
  ctx.textAlign = "center";
  ctx.fillText(npc.name, nx, ny - size / 2 - 11);
}

function getDirOffset(dir, dist) {
  switch (dir) {
    case DIRECTION.UP: return { x: 0, y: -dist };
    case DIRECTION.DOWN: return { x: 0, y: dist };
    case DIRECTION.LEFT: return { x: -dist, y: 0 };
    case DIRECTION.RIGHT: return { x: dist, y: 0 };
    default: return { x: 0, y: dist };
  }
}

// ===== 交互系统 =====
function interact() {
  if (gameState.inDialogue) {
    hideDialogue();
    gameState.inDialogue = false;
    return;
  }

  const ts = gameState.tileSize;
  let checkX = gameState.player.x;
  let checkY = gameState.player.y;
  const dist = ts * 0.8;
  switch (gameState.player.direction) {
    case DIRECTION.UP: checkY -= dist; break;
    case DIRECTION.DOWN: checkY += dist; break;
    case DIRECTION.LEFT: checkX -= dist; break;
    case DIRECTION.RIGHT: checkX += dist; break;
  }

  // 检测NPC
  for (const npc of gameState.npcs) {
    if (Math.sqrt((checkX - npc.x) ** 2 + (checkY - npc.y) ** 2) < ts) {
      showDialogue(npc.name, npc.dialogue);
      gameState.inDialogue = true;
      const dx = gameState.player.x - npc.x;
      const dy = gameState.player.y - npc.y;
      if (Math.abs(dx) > Math.abs(dy)) npc.direction = dx > 0 ? DIRECTION.RIGHT : DIRECTION.LEFT;
      else npc.direction = dy > 0 ? DIRECTION.DOWN : DIRECTION.UP;
      return;
    }
  }

  // 检测物体
  const tx = Math.floor(checkX / ts);
  const ty = Math.floor(checkY / ts);
  if (ty >= 0 && ty < gameState.mapHeight && tx >= 0 && tx < gameState.mapWidth) {
    const tile = gameState.map[ty][tx];
    if (tile === TILE.DOOR) { showDialogue("门", "这扇门被锁住了。也许在另一个时间线里，它是开着的..."); gameState.inDialogue = true; }
    else if (tile === TILE.SIGN) { showDialogue("告示牌", "欢迎来到这个平行世界。一切都不是你以为的那样。"); gameState.inDialogue = true; }
    else if (tile === TILE.MACHINE) { showDialogue("机器", "这台机器发出奇怪的嗡嗡声。它似乎在维持这个世界的稳定。"); gameState.inDialogue = true; }
  }
}

// ===== 旧场景渲染（保留兼容） =====
function drawScene() {
  if (gameState.active) return; // RPG模式激活时不运行旧渲染
  const canvas = document.getElementById("worldScene");
  if (!canvas || !currentWorld) return;
  const ctx = canvas.getContext("2d");
  const container = document.getElementById("sceneContainer");
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
  const W = canvas.width, H = canvas.height;
  const scene = currentWorld.scenes[currentSceneIndex] || currentWorld.scenes[0];

  let bgGrad;
  const timeStr = scene.time;
  if (timeStr.includes("夜") || timeStr.includes("黑暗")) {
    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, "#0a0a18"); bgGrad.addColorStop(1, "#141428");
  } else if (timeStr.includes("公元前") || timeStr.includes("远古")) {
    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, "#1a1810"); bgGrad.addColorStop(1, "#2a2418");
  } else {
    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, "#12121a"); bgGrad.addColorStop(1, "#1a1a2e");
  }
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "rgba(255,255,255,0.03)";
  for (let i = 0; i < 15; i++) {
    const bw = 30 + Math.random() * 60;
    const bh = 40 + Math.random() * 120;
    const bx = (i / 15) * W + Math.random() * 20;
    const by = H - bh - 60;
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = "rgba(0,240,255,0.08)";
    for (let w = 0; w < 3; w++) for (let h = 0; h < 4; h++) if (Math.random() > 0.5) ctx.fillRect(bx + 4 + w * 8, by + 6 + h * 10, 4, 4);
    ctx.fillStyle = "rgba(255,255,255,0.03)";
  }

  ctx.fillStyle = "rgba(255,255,255,0.04)";
  ctx.fillRect(0, H - 60, W, 60);
  ctx.strokeStyle = "rgba(0,240,255,0.1)";
  ctx.setLineDash([20, 20]);
  ctx.beginPath(); ctx.moveTo(0, H - 30); ctx.lineTo(W, H - 30); ctx.stroke();
  ctx.setLineDash([]);

  if (scene.hotspots) {
    scene.hotspots.forEach((hp, i) => {
      const hx = hp.x * W, hy = hp.y * H;
      const pulse = (Date.now() / 1000 + i) % 2;
      const pr = hp.r * Math.min(W, H) * (0.8 + 0.2 * Math.sin(pulse * Math.PI));
      ctx.beginPath(); ctx.arc(hx, hy, pr * 1.6, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,240,255,${0.1 - pulse * 0.05})`; ctx.fill();
      ctx.beginPath(); ctx.arc(hx, hy, pr, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,240,255,0.15)"; ctx.fill();
      ctx.strokeStyle = "#00f0ff"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "#00f0ff"; ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("?", hx, hy);
    });
  }

  for (let i = 0; i < 20; i++) {
    const px = ((Date.now() / 50 + i * 137) % W);
    const py = H - 50 + Math.sin((Date.now() / 1000) + i) * 10;
    ctx.beginPath(); ctx.arc(px, py, 1, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,240,255,${0.1 + Math.random() * 0.1})`; ctx.fill();
  }

  requestAnimationFrame(drawScene);
}

// 场景点击检测（旧版兼容）
function handleSceneClick(e) {
  if (gameState.active) return; // RPG模式下禁用点击热点
  if (!currentWorld) return;
  const canvas = document.getElementById("worldScene");
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  const scene = currentWorld.scenes[currentSceneIndex];
  if (!scene || !scene.hotspots) return;
  for (const hp of scene.hotspots) {
    const dx = x - hp.x;
    const dy = y - hp.y;
    if (Math.sqrt(dx * dx + dy * dy) < hp.r * 2) {
      showDialogue(hp.name, hp.dialogue);
      return;
    }
  }
}

function showDialogue(speaker, text) {
  document.getElementById("dialogueSpeaker").textContent = speaker;
  document.getElementById("dialogueText").textContent = text;
  document.getElementById("dialogueBox").classList.add("active");
}

function hideDialogue() {
  document.getElementById("dialogueBox").classList.remove("active");
}

// 更新UI
function updateUI(world) {
  currentWorld = world;
  currentSceneIndex = 0;

  // 标题
  const titleMap = { "没有": "没有", "不存在": "不存在", "从未被发明": "未被发明", "从未被发现": "未被发现", "没有灭绝": "未灭绝" };
  document.getElementById("worldTitle").textContent = `如果${titleMap[world.changeType] || ""}${world.entity}`;

  // 世界描述
  document.getElementById("worldDesc").textContent = world.worldDescription;

  // 连锁反应列表
  const rList = document.getElementById("reactionList");
  rList.innerHTML = "";
  world.chainReactions.forEach(r => {
    const div = document.createElement("div");
    div.className = `reaction-item level-${r.level}`;
    div.innerHTML = `<span class="level-tag">L${r.level}</span>${r.text}`;
    rList.appendChild(div);
  });

  // 数据对比
  const cGrid = document.getElementById("compareGrid");
  cGrid.innerHTML = "";
  world.comparisons.forEach(c => {
    const div = document.createElement("div");
    div.className = "compare-item";
    div.innerHTML = `<div class="label">${c.label}</div><div class="real">现实: ${c.real}</div><div class="arrow">↓</div><div class="alt">假想: ${c.alt}</div>`;
    cGrid.appendChild(div);
  });

  // 场景标签
  const tabs = document.getElementById("sceneTabs");
  tabs.innerHTML = "";
  world.scenes.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.className = "scene-tab" + (i === 0 ? " active" : "");
    btn.textContent = `场景${i + 1}`;
    btn.onclick = () => {
      currentSceneIndex = i;
      document.querySelectorAll(".scene-tab").forEach((b, bi) => b.classList.toggle("active", bi === i));
      updateSceneInfo();
      // 启动RPG游戏
      const scene = world.scenes[i];
      if (scene) {
        stopGame();
        setTimeout(() => initGame(scene, world.entity, i), 50);
      }
    };
    tabs.appendChild(btn);
  });

  // 时间轴
  const startY = world.year || 0;
  const endY = 2024;
  document.getElementById("startYear").textContent = startY > 0 ? startY + "年" : Math.abs(startY) + "年前";
  document.getElementById("currentYearLabel").textContent = endY + "年";
  const slider = document.getElementById("yearSlider");
  slider.min = startY;
  slider.max = endY;
  slider.value = endY;
  slider.oninput = () => {
    const ratio = (slider.value - startY) / (endY - startY);
    document.getElementById("timelineProgress").style.width = (ratio * 100) + "%";
    // 根据年份切换场景
    const sceneIdx = Math.min(Math.floor(ratio * world.scenes.length), world.scenes.length - 1);
    if (sceneIdx !== currentSceneIndex) {
      currentSceneIndex = sceneIdx;
      document.querySelectorAll(".scene-tab").forEach((b, bi) => b.classList.toggle("active", bi === sceneIdx));
      updateSceneInfo();
    }
  };

  // 连锁反应图
  const graph = buildChainGraph(world);
  chainNodes = graph.nodes;
  chainLinks = graph.links;
  chainOffset = { x: 0, y: 20 };
  drawChainGraph();

  updateSceneInfo();

  // 启动第一个场景的RPG游戏
  if (world.scenes && world.scenes[0]) {
    stopGame();
    setTimeout(() => initGame(world.scenes[0], world.entity, 0), 100);
  }
}

function updateSceneInfo() {
  if (!currentWorld) return;
  const scene = currentWorld.scenes[currentSceneIndex];
  document.getElementById("sceneTime").textContent = scene.time;
  document.getElementById("sceneDesc").textContent = scene.desc;
}

// ===== 事件绑定 =====
document.getElementById("goBtn").addEventListener("click", startSimulation);
document.getElementById("whatIfInput").addEventListener("keydown", e => { if (e.key === "Enter") startSimulation(); });

// 提示芯片
document.querySelectorAll(".hint-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.getElementById("whatIfInput").value = chip.dataset.hint;
    startSimulation();
  });
});

// 返回按钮
document.getElementById("resetBtn").addEventListener("click", () => {
  stopGame();
  document.getElementById("main").classList.remove("active");
  document.getElementById("intro").classList.remove("hidden");
  currentWorld = null;
});

// 对话关闭
document.getElementById("dialogueClose").addEventListener("click", () => {
  hideDialogue();
  gameState.inDialogue = false;
});

// 场景点击（旧版兼容）
document.getElementById("worldScene").addEventListener("click", handleSceneClick);

// ===== RPG游戏键盘控制 =====
document.addEventListener("keydown", (e) => {
  gameState.keys[e.key] = true;
  if (e.key === "f" || e.key === "F") {
    e.preventDefault();
    interact();
  }
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
    e.preventDefault();
  }
});
document.addEventListener("keyup", (e) => {
  gameState.keys[e.key] = false;
});

// ===== 虚拟方向键事件（移动端） =====
function setupVirtualControls() {
  const controls = document.getElementById("virtualControls");
  if (!controls) return;

  controls.querySelectorAll(".vpad-btn[data-dir]").forEach(btn => {
    const dir = btn.dataset.dir;
    const start = (e) => { e.preventDefault(); gameState.virtualKeys[dir] = true; };
    const end = (e) => { e.preventDefault(); gameState.virtualKeys[dir] = false; };
    btn.addEventListener("touchstart", start, { passive: false });
    btn.addEventListener("touchend", end, { passive: false });
    btn.addEventListener("touchcancel", end, { passive: false });
    btn.addEventListener("mousedown", start);
    btn.addEventListener("mouseup", end);
    btn.addEventListener("mouseleave", end);
  });

  const actionBtn = controls.querySelector(".vpad-action");
  if (actionBtn) {
    const act = (e) => { e.preventDefault(); interact(); };
    actionBtn.addEventListener("touchstart", act, { passive: false });
    actionBtn.addEventListener("mousedown", act);
  }
}
setupVirtualControls();

// 连锁反应图拖拽
const chainCanvas = document.getElementById("chainCanvas");
chainCanvas.addEventListener("mousedown", e => {
  chainDragging = true;
  chainLastMouse = { x: e.clientX, y: e.clientY };
});
window.addEventListener("mousemove", e => {
  if (!chainDragging) return;
  chainOffset.x += e.clientX - chainLastMouse.x;
  chainOffset.y += e.clientY - chainLastMouse.y;
  chainLastMouse = { x: e.clientX, y: e.clientY };
  drawChainGraph();
});
window.addEventListener("mouseup", () => { chainDragging = false; });

// 启动模拟
function startSimulation() {
  const input = document.getElementById("whatIfInput").value.trim();
  if (!input) return;

  // 显示加载
  document.getElementById("intro").classList.add("hidden");
  document.getElementById("loading").classList.add("active");

  const steps = [
    "解析输入语句...",
    "检索知识库...",
    "匹配实体与规则...",
    "计算第一层连锁反应...",
    "推导第二层间接影响...",
    "推演第三层深远后果...",
    "生成场景与对话...",
    "构建数据对比...",
    "渲染世界..."
  ];
  let stepIdx = 0;
  const stepEl = document.getElementById("loadingSteps");
  const textEl = document.getElementById("loadingText");

  const interval = setInterval(() => {
    if (stepIdx < steps.length) {
      stepEl.textContent = steps.slice(0, stepIdx + 1).join("\n");
      textEl.textContent = steps[stepIdx];
      stepIdx++;
    } else {
      clearInterval(interval);
      // 生成世界
      const world = generateWorld(input);
      // 隐藏加载，显示主界面
      document.getElementById("loading").classList.remove("active");
      document.getElementById("main").classList.add("active");
      updateUI(world);
      drawScene();
    }
  }, 350);
}

// 窗口大小改变时重绘
window.addEventListener("resize", () => {
  drawChainGraph();
  if (currentWorld) {
    if (gameState.active) {
      // RPG模式下重新计算图块大小
      const container = document.getElementById("sceneContainer");
      const tileW = Math.max(20, Math.min(44, Math.floor(container.clientWidth / 12)));
      const tileH = Math.max(20, Math.min(44, Math.floor(container.clientHeight / 10)));
      gameState.tileSize = Math.min(tileW, tileH);
    } else {
      drawScene();
    }
  }
});

// 初始化
initParticles();
</script>
