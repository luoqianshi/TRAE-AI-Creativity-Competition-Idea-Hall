<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEDAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'light-bg': 'rgba(255,255,255,0.08)',
                        'light-card': 'rgba(255,255,255,0.06)',
                        'dark-text': '#e0ddd8',
                        'medium-text': '#9a9690',
                        'light-text': '#d2d2d7',
                        'accent-red': '#ff3b30',
                        'accent-blue': '#4da3ff',
                    },
                    fontFamily: {
                        'display': ['SF Pro Display', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        'body': ['SF Pro Text', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Courier New', 'Noto Sans SC', Courier, monospace;
            background-color: rgb(28, 25, 23);
            color: #e0ddd8;
            overflow-x: hidden;
        }

        .card {
            background-color: transparent;
            border-radius: 12px;
            box-shadow: none;
        }

        .speedometer {
            position: relative;
            width: min(420px, 80vw);
            height: min(420px, 80vw);
            border-radius: 50%;
            overflow: hidden;
        }

        @media (max-width: 640px) {
            .speedometer {
                width: min(320px, 75vw);
                height: min(320px, 75vw);
            }
        }

        #speedometerCanvas {
            display: block;
        }

        .control-btn {
            transition: all 0.15s ease;
            border-radius: 0;
            font-weight: 500;
            letter-spacing: -0.01em;
            background: none;
            border: none;
            box-shadow: none;
            padding: 8px;
        }

        .control-btn:active:not(:disabled),
        .control-btn.is-pressed {
            transform: translateY(4px);
            box-shadow: none;
        }

        .acceleration-btn {
            background: none;
            color: #c0c0c0;
        }

        .acceleration-btn:active:not(:disabled),
        .acceleration-btn.is-pressed {
            color: #808080;
        }

        .brake-btn {
            background: none;
            color: #c0c0c0;
        }

        .brake-btn:active:not(:disabled),
        .brake-btn.is-pressed {
            color: #e04040;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .info-card {
            transition: all 0.2s ease;
            border-radius: 12px;
            background-color: rgba(255,255,255,0.06);
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e0ddd8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1rem;
        }

        select option {
            background-color: rgb(40, 37, 35);
            color: #e0ddd8;
        }

        /* 桌面端：三列布局 */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr 1.4fr 1fr;
                gap: 1.5rem;
            }
        }

        @media (min-width: 768px) and (max-width: 1023px) {
            .main-layout {
                grid-template-columns: 1fr 1.4fr;
                gap: 1.25rem;
            }
            .main-layout .left-panel {
                grid-column: 1;
                grid-row: 1;
            }
            .main-layout .center-panel {
                grid-column: 2;
                grid-row: 1 / 3;
            }
            .main-layout .right-panel {
                grid-column: 1;
                grid-row: 2;
            }
        }

        /* 手机端：车型选择折叠 */
        @media (max-width: 767px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            .left-panel .card {
                padding: 1rem;
            }
            .left-panel .car-info-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.5rem;
            }
            .center-panel .card {
                padding: 1rem;
            }
        }

        /* 手机端底部固定控制按钮 */
        @media (max-width: 767px) {
            .mobile-controls {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: #1a1a1a;
                padding: 12px 16px;
                padding-bottom: max(12px, env(safe-area-inset-bottom));
                z-index: 100;
                display: flex;
                gap: 12px;
            }
            .mobile-controls button {
                flex: 1;
                min-height: 56px;
            }
            body {
                padding-bottom: 90px;
            }
        }

        @media (min-width: 768px) {
            .mobile-controls {
                display: none;
            }
        }

        /* 桌面端隐藏移动端按钮区 */
        .desktop-controls {
            display: flex;
        }
        @media (max-width: 767px) {
            .desktop-controls {
                display: none;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-up {
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .key-hint {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            margin-left: 4px;
        }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-4 md:p-6 lg:p-8 pb-32 md:pb-8">
    <div class="max-w-7xl mx-auto">

        <header class="mb-4 md:mb-6 lg:mb-8 text-center fade-in">
            <h1 class="text-2xl md:text-3xl font-semibold mb-1 md:mb-2 tracking-tight" style="font-family: 'Courier New', Courier, monospace;">PEDAL</h1>
        </header>

        <div class="main-layout">
            <!-- Left Panel - Car Selection -->
            <div class="left-panel">
                <div class="card p-4 md:p-6 slide-up">
                    <h2 class="text-base md:text-lg font-semibold mb-3 md:mb-4 flex items-center">
                        选择车型
                    </h2>

                    <!-- Brand Selection -->
                    <div class="mb-3 md:mb-4">
                        <label class="block text-xs md:text-sm text-medium-text mb-1 md:mb-2" for="brandSelect">品牌</label>
                        <select id="brandSelect" class="w-full bg-light-bg border border-gray-700 rounded-lg p-2.5 md:p-3 text-sm md:text-base text-dark-text focus:outline-none focus:border-accent-blue transition-colors" aria-label="选择品牌">
                            <option value="">选择品牌</option>
                        </select>
                    </div>

                    <!-- Model Selection -->
                    <div class="mb-4 md:mb-6">
                        <label class="block text-xs md:text-sm text-medium-text mb-1 md:mb-2" for="modelSelect">车型</label>
                        <select id="modelSelect" class="w-full bg-light-bg border border-gray-700 rounded-lg p-2.5 md:p-3 text-sm md:text-base text-dark-text focus:outline-none focus:border-accent-blue transition-colors" disabled aria-label="选择车型">
                            <option value="">先选择品牌</option>
                        </select>
                    </div>

                    <!-- Selected Car Info -->
                    <div id="carInfo" class="hidden">
                        <div class="bg-light-bg rounded-xl p-3 md:p-4 mb-4">
                            <div class="flex items-center justify-between mb-2 md:mb-3">
                                <h3 id="carName" class="text-sm md:text-lg font-semibold"></h3>
                                <span id="carYear" class="text-xs md:text-sm text-medium-text"></span>
                            </div>

                            <div class="car-info-grid grid grid-cols-2 gap-2 md:gap-3">
                                <div class="bg-light-card rounded-lg p-2 md:p-3">
                                    <div class="text-xs text-medium-text mb-0.5 md:mb-1">0-100 km/h</div>
                                    <div id="accelerationTime" class="text-base md:text-xl font-semibold text-accent-blue"></div>
                                </div>
                                <div class="bg-light-card rounded-lg p-2 md:p-3">
                                    <div class="text-xs text-medium-text mb-0.5 md:mb-1">最高时速</div>
                                    <div id="maxSpeed" class="text-base md:text-xl font-semibold text-dark-text"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center Panel - Speedometer -->
            <div class="center-panel">
                <div class="card p-4 md:p-6 flex flex-col items-center slide-up" style="animation-delay: 0.1s;">

                    <!-- Speedometer -->
                    <div class="speedometer mb-4 md:mb-6">
                        <canvas id="speedometerCanvas" width="800" height="800" style="width:100%;height:100%;"></canvas>
                    </div>

                    <!-- Desktop Control Buttons -->
                    <div class="desktop-controls hidden md:flex md:gap-6 w-full max-w-xs justify-center items-end">
                        <button id="brakeBtn" class="brake-btn control-btn flex items-center justify-center" disabled aria-label="刹车减速">

                                <path d="M 10 8 Q 10 4 14 4 L 46 4 Q 50 4 50 8 L 52 70 Q 52 76 46 76 L 14 76 Q 8 76 8 70 Z"/>
                                <!-- 踏板表面纹理线 -->
                                <line x1="18" y1="20" x2="42" y2="20" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
                                <line x1="18" y1="30" x2="42" y2="30" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
                                <line x1="18" y1="40" x2="42" y2="40" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
                                <line x1="18" y1="50" x2="42" y2="50" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
                                <line x1="18" y1="60" x2="42" y2="60" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
                            </svg>
                        </button>

                                <!-- 油门踏板：窄长，略微倾斜的楔形 -->

                                <!-- 踏板表面纹理线 -->

                                <line x1="18" y1="26" x2="34" y2="26" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
                                <line x1="18" y1="36" x2="34" y2="36" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
                                <line x1="18" y1="46" x2="34" y2="46" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
                                <line x1="18" y1="56" x2="34" y2="56" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
                                <line x1="18" y1="66" x2="34" y2="66" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
                            </svg>
                        </button>
                    </div>

                </div>
            </div>

            <!-- Right Panel (placeholder for future content) -->
            <div class="right-panel">
            </div>

        </div>

    const SimulationEngine = {

        targetRpm: 0,       // 目标RPM（用于平滑过渡）
        gear: 'N',
        currentGearIndex: 0, // 当前档位索引（用于判断是否换挡）

        totalDistance: 0,    // 米

        // 计算当前 RPM（基于档位和速度）
        calculateRPM(speed, gearIndex) {
            if (gearIndex < 0 || gearIndex >= CONSTANTS.GEAR_SPEED_RANGES.length) {
                return CONSTANTS.IDLE_RPM;
            }
            const [minSpeed, maxSpeed] = CONSTANTS.GEAR_SPEED_RANGES[gearIndex];
            const range = maxSpeed - minSpeed;
            if (range <= 0) return CONSTANTS.IDLE_RPM;
            const ratio = Math.max(0, Math.min(1, (speed - minSpeed) / range));
            return CONSTANTS.IDLE_RPM + ratio * (CONSTANTS.MAX_RPM - CONSTANTS.IDLE_RPM);
        },

        // 更新RPM（带平滑过渡）
        // 加速时RPM快速跟随，刹车/滑行时RPM缓慢下降
        updateRPM(speed, gearIndex, deltaTime) {
            const targetRpm = speed > 0 ? this.calculateRPM(speed, gearIndex) : CONSTANTS.IDLE_RPM;
            this.targetRpm = Math.max(CONSTANTS.IDLE_RPM, targetRpm);

            // RPM变化速率：加速时快速响应，减速时缓慢下降
            let rpmChangeRate;
            if (this.isAccelerating) {
                rpmChangeRate = 8000; // 加速时RPM快速上升（rpm/s）
            } else if (this.isBraking) {
                rpmChangeRate = 3000; // 刹车时RPM缓慢下降（模拟发动机制动）
            } else {
                rpmChangeRate = 2500; // 滑行时RPM缓慢下降
            }

            const rpmDiff = this.targetRpm - this.rpm;
            if (Math.abs(rpmDiff) < 10) {
                this.rpm = this.targetRpm;
            } else {
                const maxChange = rpmChangeRate * deltaTime;
                if (rpmDiff > 0) {
                    this.rpm = Math.min(this.rpm + maxChange, this.targetRpm);
                } else {
                    this.rpm = Math.max(this.rpm - maxChange, this.targetRpm);
                }
            }

            // 确保RPM不低于怠速
            this.rpm = Math.max(CONSTANTS.IDLE_RPM, this.rpm);

        determineGear(speed) {
            const ranges = CONSTANTS.GEAR_SPEED_RANGES;

            return 0;

        // 返回 0-1 之间的值，表示当前速度下的扭矩输出比例
        calculateTorqueFactor(speed) {
            if (!this.selectedCar) return 0;
            const car = this.selectedCar;
            const maxSpeed = car.maxSpeed;
            const speedMs = speed / 3.6;
            const maxSpeedMs = maxSpeed / 3.6;
            const speedRatio = speedMs / maxSpeedMs;

            let torqueFactor;

            if (car.isEV) {
                // === 电动车加速模型 ===
                // 1. 起步牵引力建立（0-15 km/h）：最小值不低于 0.85
                let tractionRamp = 1;
                if (speed < 15) {
                    const s = this.smoothstep(speed / 15);
                    tractionRamp = 0.85 + 0.15 * s;
                }

                // 2. 扭矩曲线：flat 类型使用 1 - speedRatio^1.5（更慢的衰减）
                const baseTorque = 1 - Math.pow(speedRatio, 1.5);

                torqueFactor = baseTorque * tractionRamp;

                // === 燃油车加速模型 ===
                // 1. 离合器接合（0-30 km/h）：最小值不低于 0.70

                if (speed < 30) {

                } else {

                let gearShiftFactor = 1.0;

                if (shiftCount > 0) {

                            const dip = car.shiftIntensity * (1 + Math.cos(dist * Math.PI)) / 2;
                            gearShiftFactor = Math.min(gearShiftFactor, 1 - dip);

                if (car.torqueCurve === "peaky") {

                        engineTorque = 0.92 + 0.08 * this.smoothstep(t);

                    }

            let speedLimiter = 1.0;
            if (speedRatio > 0.85) {
                const t = Math.min(1, (speedRatio - 0.85) / 0.15);
                speedLimiter = 1 - t * t * (3 - 2 * t); // smoothstep反转
            }

            // 空气阻力（与速度平方成正比）
            const airCoeff = this.airDragCoeff || CONSTANTS.AIR_RESISTANCE_COEFF;
            const airDrag = airCoeff * speedMs * speedMs;
            // 滚动阻力
            const rollingDrag = CONSTANTS.ROLLING_RESISTANCE;
            // 净加速度 m/s²
            // speedLimiter 确保在 speedRatio→1 时驱动力趋近0
            // 同时空气阻力也在增大，双重作用确保速度渐近收敛到maxSpeed
            const netAccelMs2 = baseAccelMs2 * torqueFactor * speedLimiter - airDrag - rollingDrag;
            return Math.max(0, netAccelMs2 * 3.6); // 转换为 km/h/s
        },

        // 模拟0-100加速（用于校准），返回达到100km/h所需时间
        simulate0to100(scale) {
            const dt = 0.005;
            let speed = 0;
            let time = 0;
            const maxSpeed = this.selectedCar.maxSpeed;
            const baseAccelMs2 = (100 / this.selectedCar.acceleration) * scale;

            while (speed < 100 && time < 30) {
                const speedMs = speed / 3.6;
                const maxSpeedMs = maxSpeed / 3.6;
                const speedRatio = speedMs / maxSpeedMs;

                // 使用共享的扭矩因子计算方法
                const torqueFactor = this.calculateTorqueFactor(speed);

                // 软限速因子
                let speedLimiter = 1.0;
                if (speedRatio > 0.85) {
                    const t = Math.min(1, (speedRatio - 0.85) / 0.15);
                    speedLimiter = 1 - t * t * (3 - 2 * t);
                }

                const airCoeff = this.airDragCoeff || CONSTANTS.AIR_RESISTANCE_COEFF;
                const airDrag = airCoeff * speedMs * speedMs;
                const rollingDrag = CONSTANTS.ROLLING_RESISTANCE;
                const netAccelMs2 = baseAccelMs2 * torqueFactor * speedLimiter - airDrag - rollingDrag;
                speed += Math.max(0, netAccelMs2 * 3.6) * dt;
                time += dt;
            }
            return time;
        },

        // 校准加速度缩放系数和空气阻力系数
        // 确保0-100加速时间和最高车速都严格匹配车型数据
        calibrateAcceleration() {
            if (!this.selectedCar) return;
            const targetTime = this.selectedCar.acceleration;
            const targetMaxSpeed = this.selectedCar.maxSpeed;

            // 第一步：在无空气阻力下校准accelScale，确保0-100时间匹配
            let low = 0.3, high = 8.0;
            for (let i = 0; i < 30; i++) {
                const mid = (low + high) / 2;
                // 临时将airDragCoeff设为0进行0-100校准
                const savedAir = this.airDragCoeff;
                this.airDragCoeff = 0;
                const simTime = this.simulate0to100(mid);
                this.airDragCoeff = savedAir;
                if (simTime < targetTime) {
                    high = mid;
                } else {
                    low = mid;
                }
            }
            this.accelScale = (low + high) / 2;

            // 第二步：校准空气阻力系数，确保最高车速匹配
            // airDragCoeff越小→最高车速越高，越大→最高车速越低
            let airLow = 0.00005, airHigh = 0.08;
            for (let i = 0; i < 40; i++) {
                const mid = (airLow + airHigh) / 2;
                this.airDragCoeff = mid;
                // 模拟最高车速
                const simMax = this.simulateMaxSpeed();
                if (simMax > targetMaxSpeed) {
                    airLow = mid; // 最高车速太高，增大阻力
                } else {
                    airHigh = mid; // 最高车速太低，减小阻力
                }
            }
            this.airDragCoeff = (airLow + airHigh) / 2;

            // 第三步：重新校准accelScale，补偿空气阻力对0-100的影响
            // 扩大搜索范围确保能充分补偿
            low = this.accelScale * 0.70;
            high = this.accelScale * 1.50;
            for (let i = 0; i < 40; i++) {
                const mid = (low + high) / 2;
                const simTime = this.simulate0to100(mid);
                if (simTime < targetTime) {
                    high = mid;
                } else {
                    low = mid;
                }
            }
            this.accelScale = (low + high) / 2;

            // 第四步：最终验证，如果误差仍超过0.05秒则再次微调
            const finalTime = this.simulate0to100(this.accelScale);
            if (Math.abs(finalTime - targetTime) > 0.02) {
                low = this.accelScale * 0.95;
                high = this.accelScale * 1.05;
                for (let i = 0; i < 50; i++) {
                    const mid = (low + high) / 2;
                    const simTime = this.simulate0to100(mid);
                    if (simTime < targetTime) {
                        high = mid;
                    } else {
                        low = mid;
                    }
                }
                this.accelScale = (low + high) / 2;
            }
        },

        // 模拟最高车速（用于校准），返回能达到的稳态最高速度
        simulateMaxSpeed() {
            const dt = 0.01;
            let speed = 0;
            const maxSpeed = this.selectedCar.maxSpeed;
            const baseAccelMs2 = (100 / this.selectedCar.acceleration) * this.accelScale;

            for (let i = 0; i < 20000; i++) {
                const accel = this.calculateAcceleration(speed);
                speed += accel * dt;
                if (accel < 0.01 && speed > 50) break;
            }
            return speed;
        },

        // 计算刹车减速度（km/h/s）
        calculateBrakeDeceleration() {
            if (!this.selectedCar) return 0;
            // 紧急制动减速度：基于刹车距离计算，但使用更真实的数值
            // 典型紧急制动减速度 8-12 m/s²（约29-43 km/h/s）
            // brakePerformance 是100-0km/h刹车距离（米），距离越短制动越好
            const brakeMs2 = 1000 / this.selectedCar.brakePerformance; // m/s²
            return Math.min(brakeMs2 * 3.6, 180); // 转换为 km/h/s，上限 180
        },

        // 更新加速模拟
        updateAcceleration(timestamp) {
            if (!this.isAccelerating) return;

            const deltaTime = Math.min((timestamp - this.lastTimestamp) / 1000, 0.05); // 限制最大 delta 防止跳帧
            this.lastTimestamp = timestamp;
            this.elapsedTime = (timestamp - this.startTime) / 1000;

            // 更新速度（由物理模型自然收敛到maxSpeed，无需硬性限速）
            const accel = this.calculateAcceleration(this.speed);
            this.speed = Math.max(0, this.speed + accel * deltaTime);

            // 更新档位和 RPM
            const gearIndex = this.determineGear(this.speed);
            this.currentGearIndex = gearIndex;
            this.gear = String(gearIndex + 1);
            this.updateRPM(this.speed, gearIndex, deltaTime);

            // 更新距离
            this.totalDistance += (this.speed / 3.6) * deltaTime;

            // 记录速度数据（限长）
            this.speedData.push({ time: this.elapsedTime, speed: this.speed });
            if (this.speedData.length > CONSTANTS.MAX_SPEED_DATA_POINTS) {
                this.speedData = this.speedData.slice(-CONSTANTS.MAX_SPEED_DATA_POINTS);
            }

            this.animationFrame = requestAnimationFrame((t) => this.updateAcceleration(t));
        },

        // 更新刹车模拟
        updateBraking(timestamp) {
            if (!this.isBraking) return;

            const deltaTime = Math.min((timestamp - this.lastTimestamp) / 1000, 0.05);
            this.lastTimestamp = timestamp;

            const decel = this.calculateBrakeDeceleration();
            this.speed = Math.max(0, this.speed - decel * deltaTime);

            // 更新档位和 RPM（刹车时档位保持或降挡，RPM缓慢下降）
            const gearIndex = this.determineGear(this.speed);
            this.currentGearIndex = gearIndex;
            this.gear = this.speed > 0 ? String(gearIndex + 1) : 'N';
            this.updateRPM(this.speed, gearIndex, deltaTime);

            // 更新距离
            this.totalDistance += (this.speed / 3.6) * deltaTime;

            // 速度为0时自动停止
            if (this.speed <= 0) {
                this.stopBraking();
                return;
            }

            this.animationFrame = requestAnimationFrame((t) => this.updateBraking(t));
        },

        // 自然减速（滑行）
        updateCoasting(timestamp) {
            if (this.isAccelerating || this.isBraking || this.speed <= 0) {
                this.stopCoasting();
                return;
            }

            const deltaTime = Math.min((timestamp - this.lastTimestamp) / 1000, 0.05);
            this.lastTimestamp = timestamp;

            // 自然减速 = 滚动阻力 + 空气阻力
            // 滑行时空气阻力效果更显著（使用独立系数）
            const speedMs = this.speed / 3.6;
            const coastAirDrag = 0.003 * speedMs * speedMs; // 滑行空气阻力系数
            const totalDecel = (CONSTANTS.NATURAL_DECEL + coastAirDrag * 3.6);
            this.speed = Math.max(0, this.speed - totalDecel * deltaTime);

            // 更新档位和 RPM
            const gearIndex = this.determineGear(this.speed);
            this.currentGearIndex = gearIndex;
            this.gear = this.speed > 0 ? String(gearIndex + 1) : 'N';
            this.updateRPM(this.speed, gearIndex, deltaTime);

            if (this.speed <= 0) {
                this.stopCoasting();
                return;
            }

            this.animationFrame = requestAnimationFrame((t) => this.updateCoasting(t));
        },

        startAcceleration() {
            if (!this.selectedCar || this.isAccelerating) return;
            this.isAccelerating = true;
            this.isBraking = false;
            this.stopCoasting();

            if (this.speed === 0) {
                this.startTime = performance.now();
                this.elapsedTime = 0;
                this.totalDistance = 0;
                this.speedData = [];
            }

            this.lastTimestamp = performance.now();
            this.animationFrame = requestAnimationFrame((t) => this.updateAcceleration(t));
        },

        stopAcceleration() {
            if (!this.isAccelerating) return;
            this.isAccelerating = false;
            if (this.animationFrame) {
                cancelAnimationFrame(this.animationFrame);
                this.animationFrame = null;
            }
            // 如果还有速度，启动滑行减速
            if (this.speed > 0) {
                this.lastTimestamp = performance.now();
                this.animationFrame = requestAnimationFrame((t) => this.updateCoasting(t));
            }
        },

        startBraking() {
            if (!this.selectedCar || this.isBraking) return;
            this.isBraking = true;
            this.isAccelerating = false;
            this.stopCoasting();

            if (this.animationFrame) {
                cancelAnimationFrame(this.animationFrame);
                this.animationFrame = null;
            }

            this.lastTimestamp = performance.now();
            this.animationFrame = requestAnimationFrame((t) => this.updateBraking(t));
        },

        stopBraking() {
            if (!this.isBraking) return;
            this.isBraking = false;
            if (this.animationFrame) {
                cancelAnimationFrame(this.animationFrame);
                this.animationFrame = null;
            }
            // 如果还有速度，启动滑行减速
            if (this.speed > 0) {
                this.lastTimestamp = performance.now();
                this.animationFrame = requestAnimationFrame((t) => this.updateCoasting(t));
            }
        },

        stopCoasting() {
            if (this.animationFrame && !this.isAccelerating && !this.isBraking) {
                cancelAnimationFrame(this.animationFrame);
                this.animationFrame = null;
            }
        },

        reset() {
            this.stopAcceleration();
            this.stopBraking();
            this.stopCoasting();
            this.speed = 0;
            this.rpm = 0;
            this.targetRpm = 0;
            this.gear = 'N';
            this.currentGearIndex = 0;
            this.elapsedTime = 0;
            this.totalDistance = 0;
            this.speedData = [];
        },

        selectCar(car) {
            this.selectedCar = car;
            // 动态调整速度表量程（向上取整到最近的40的倍数，且至少240）
            this.speedometerMax = Math.max(240, Math.ceil(car.maxSpeed / 40) * 40);
            // 校准加速度缩放系数，确保0-100时间严格匹配车型数据
            this.calibrateAcceleration();
        }
    };

    // ============================================================
    // UI 层 - DOM 操作与渲染
    // ============================================================
    const UI = {
        // DOM 缓存
        elements: {},

        // 图表离屏 Canvas（网格层）
        chartGridCanvas: null,

        // 仪表盘离屏 Canvas（静态层：底面+刻度）
        speedometerStaticCanvas: null,

        // 仪表盘绘制参数（基于800x800 Canvas，拟物风格）
        SP: {
            cx: 400, cy: 400,           // 中心

            bezelOuterR: 390,            // 金属边框外半径
            bezelInnerR: 370,            // 金属边框内半径
            faceR: 365,                  // 表盘面半径
            tickOuterR: 325,             // 刻度线外端
            majorTickLen: 28,            // 大刻度线长度
            minorTickLen: 14,            // 小刻度线长度
            labelR: 270,                 // 数字标注半径
            innerRingR: 215,             // 内圈装饰环
            needleLen: 310,              // 指针长度
            needleTailLen: 20,           // 指针尾部
            needleBaseW: 14,              // 指针底部宽度
            capR: 15,                    // 中心帽半径
            infoBoxTop: 450,             // 信息框顶部位置
            infoBoxH: 110,               // 信息框高度
        },

        // 初始化 DOM 引用
        cacheElements() {
            const ids = [
                'brandSelect', 'modelSelect', 'carInfo', 'carName', 'carYear',
                'accelerationTime', 'maxSpeed',
                'speedometerCanvas',
                'accelerateBtn', 'brakeBtn',
                'accelerateBtnMobile', 'brakeBtnMobile'
            ];
            ids.forEach(id => {
                this.elements[id] = document.getElementById(id);
            });
        },

        // 填充品牌下拉
        populateBrandSelect() {
            const brandSelect = this.elements.brandSelect;
            for (const brand in carData) {
                const option = document.createElement('option');
                option.value = brand;
                option.textContent = brand;
                brandSelect.appendChild(option);

        // ============================================================
        // Canvas 仪表盘绘制
        // ============================================================

        // 角度辅助：将速度值映射到弧度（0点在12点方向，顺时针为正）
        speedToAngle(speed, maxSpeed) {
            const startDeg = CONSTANTS.SPEEDOMETER_START_ANGLE; // -135
            const rangeDeg = CONSTANTS.SPEEDOMETER_ANGLE_RANGE; // 270
            const deg = startDeg + (speed / maxSpeed) * rangeDeg;
            return (deg - 90) * Math.PI / 180; // 转为标准数学角度（0=右，逆时针），-90让0点在上方
        },

        // 圆角矩形辅助函数
        roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        },

        // 绘制仪表盘静态层（拟物风格，多层光影质感）
        drawSpeedometerStatic(maxSpeed) {
            const sp = this.SP;
            const size = 800;

            if (!this.speedometerStaticCanvas) {
                this.speedometerStaticCanvas = document.createElement('canvas');
            }
            this.speedometerStaticCanvas.width = size;
            this.speedometerStaticCanvas.height = size;
            const ctx = this.speedometerStaticCanvas.getContext('2d');

            ctx.clearRect(0, 0, size, size);

            // === 1. 最外层投影（Canvas 外阴影） ===
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 25;
            ctx.shadowOffsetY = 5;
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, sp.outerR, 0, Math.PI * 2);
            ctx.fillStyle = '#000';
            ctx.fill();
            ctx.restore();

            // === 2. 金属外圈（多层渐变，模拟拉丝金属） ===
            // 外圈底色
            const outerBase = ctx.createRadialGradient(sp.cx, sp.cy, sp.outerR - 30, sp.cx, sp.cy, sp.outerR);
            outerBase.addColorStop(0, '#3a3a3a');
            outerBase.addColorStop(0.5, '#252525');
            outerBase.addColorStop(1, '#151515');
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, sp.outerR, 0, Math.PI * 2);
            ctx.fillStyle = outerBase;
            ctx.fill();

            // 外圈顶部弧光（模拟上方光源照射金属外缘）
            ctx.save();
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, sp.outerR, 0, Math.PI * 2);
            ctx.clip();
            const outerTopLight = ctx.createLinearGradient(sp.cx, sp.cy - sp.outerR, sp.cx, sp.cy - sp.outerR * 0.4);
            outerTopLight.addColorStop(0, 'rgba(255,255,255,0.12)');
            outerTopLight.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = outerTopLight;
            ctx.fillRect(sp.cx - sp.outerR, sp.cy - sp.outerR, sp.outerR * 2, sp.outerR * 0.6);
            ctx.restore();

            // 外圈底部暗面
            ctx.save();
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, sp.outerR, 0, Math.PI * 2);
            ctx.clip();
            const outerBottomDark = ctx.createLinearGradient(sp.cx, sp.cy + sp.outerR * 0.5, sp.cx, sp.cy + sp.outerR);
            outerBottomDark.addColorStop(0, 'rgba(0,0,0,0)');
            outerBottomDark.addColorStop(1, 'rgba(0,0,0,0.3)');
            ctx.fillStyle = outerBottomDark;
            ctx.fillRect(sp.cx - sp.outerR, sp.cy, sp.outerR * 2, sp.outerR);
            ctx.restore();

            // === 3. 银色金属边框环（拉丝质感 + 多层渐变） ===
            ctx.save();
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, sp.bezelOuterR, 0, Math.PI * 2);
            ctx.arc(sp.cx, sp.cy, sp.bezelInnerR, 0, Math.PI * 2, true);
            // 主渐变：上亮下暗
            const bezelGrad = ctx.createLinearGradient(sp.cx, sp.cy - sp.bezelOuterR, sp.cx, sp.cy + sp.bezelOuterR);
            bezelGrad.addColorStop(0, '#e8e8e8');
            bezelGrad.addColorStop(0.15, '#c0c0c0');
            bezelGrad.addColorStop(0.35, '#a0a0a0');
            bezelGrad.addColorStop(0.5, '#d0d0d0');
            bezelGrad.addColorStop(0.65, '#909090');
            bezelGrad.addColorStop(0.85, '#707070');
            bezelGrad.addColorStop(1, '#555555');
            ctx.fillStyle = bezelGrad;
            ctx.fill();

            // 边框环顶部高光（模拟金属反光）
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, sp.bezelOuterR - 1, -Math.PI * 0.85, -Math.PI * 0.15);
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // 边框环底部暗线
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, sp.bezelOuterR - 1, Math.PI * 0.15, Math.PI * 0.85);
            ctx.strokeStyle = 'rgba(0,0,0,0.25)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // 边框内缘暗线（与表盘分界）
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, sp.bezelInnerR + 0.5, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0,0,0,0.4)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // 边框外缘细高光
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, sp.bezelOuterR - 0.5, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 0.8;
            ctx.stroke();
            ctx.restore();

            // === 4. 表盘底色（银灰色，带顶部光源效果 + 径向渐变） ===
            const faceGrad = ctx.createRadialGradient(sp.cx, sp.cy - 80, 20, sp.cx, sp.cy + 30, sp.faceR);
            faceGrad.addColorStop(0, '#e0e0e0');
            faceGrad.addColorStop(0.2, '#d0d0d0');
            faceGrad.addColorStop(0.5, '#b8b8b8');
            faceGrad.addColorStop(0.75, '#a5a5a5');
            faceGrad.addColorStop(1, '#909090');
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, sp.faceR, 0, Math.PI * 2);
            ctx.fillStyle = faceGrad;
            ctx.fill();

            // 表盘顶部大面积弧形高光（模拟光源从上方照射）
            ctx.save();
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, sp.faceR - 2, 0, Math.PI * 2);
            ctx.clip();
            const highlightGrad = ctx.createLinearGradient(sp.cx, sp.cy - sp.faceR, sp.cx, sp.cy - sp.faceR * 0.1);
            highlightGrad.addColorStop(0, 'rgba(255,255,255,0.22)');
            highlightGrad.addColorStop(0.3, 'rgba(255,255,255,0.08)');
            highlightGrad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = highlightGrad;
            ctx.fillRect(sp.cx - sp.faceR, sp.cy - sp.faceR, sp.faceR * 2, sp.faceR * 0.9);
            ctx.restore();

            // 表盘底部微暗（模拟下方阴影）
            ctx.save();
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, sp.faceR - 2, 0, Math.PI * 2);
            ctx.clip();
            const faceBottom = ctx.createLinearGradient(sp.cx, sp.cy + sp.faceR * 0.3, sp.cx, sp.cy + sp.faceR);
            faceBottom.addColorStop(0, 'rgba(0,0,0,0)');
            faceBottom.addColorStop(1, 'rgba(0,0,0,0.08)');
            ctx.fillStyle = faceBottom;
            ctx.fillRect(sp.cx - sp.faceR, sp.cy, sp.faceR * 2, sp.faceR);
            ctx.restore();

            // 表盘内圈细暗线（装饰环）
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, sp.tickOuterR + 12, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0,0,0,0.12)';
            ctx.lineWidth = 0.8;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, sp.innerRingR, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(0,0,0,0.08)';
            ctx.lineWidth = 0.6;
            ctx.stroke();

            // --- 3. (黑色圆形装饰已移除) ---
            // --- 5. (右侧扇形装饰图案已移除) ---

            // === 6. 刻度线和数字（三层绘制：阴影+主体+高光，凸起质感） ===
            const majorStep = 20;
            const minorStep = 10;
            const tickCount = maxSpeed / minorStep;

            for (let i = 0; i <= tickCount; i++) {
                const speedVal = i * minorStep;
                const angle = this.speedToAngle(speedVal, maxSpeed);
                const isMajor = speedVal % majorStep === 0;

                const tickLen = isMajor ? sp.majorTickLen : sp.minorTickLen;
                const outerR = sp.tickOuterR;
                const innerR = outerR - tickLen;

                const x1 = sp.cx + Math.cos(angle) * outerR;
                const y1 = sp.cy + Math.sin(angle) * outerR;
                const x2 = sp.cx + Math.cos(angle) * innerR;
                const y2 = sp.cy + Math.sin(angle) * innerR;

                // 第一层：右下阴影（凸起投影）
                ctx.beginPath();
                ctx.moveTo(x1 + 1, y1 + 1.2);
                ctx.lineTo(x2 + 1, y2 + 1.2);
                ctx.strokeStyle = 'rgba(0,0,0,0.25)';
                ctx.lineWidth = isMajor ? 5 : 2.8;
                ctx.lineCap = 'butt';
                ctx.stroke();

                // 第二层：刻度线主体（深灰色）
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = '#1a1a1a';
                ctx.lineWidth = isMajor ? 3.5 : 1.5;
                ctx.lineCap = 'butt';
                ctx.stroke();

                // 第三层：左上高光（凸起顶部反光）
                ctx.beginPath();
                ctx.moveTo(x1 - 0.8, y1 - 0.8);
                ctx.lineTo(x2 - 0.8, y2 - 0.8);
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = isMajor ? 1.2 : 0.5;
                ctx.lineCap = 'butt';
                ctx.stroke();

                // 大刻度数字标注
                if (isMajor) {
                    const labelX = sp.cx + Math.cos(angle) * sp.labelR;
                    const labelY = sp.cy + Math.sin(angle) * sp.labelR;

                    // 数字投影（右下偏移）
                    ctx.save();
                    ctx.translate(labelX + 1, labelY + 1.2);
                    ctx.fillStyle = 'rgba(0,0,0,0.18)';
                    ctx.font = '700 30px "Courier New", Courier, monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(String(speedVal), 0, 0);
                    ctx.restore();

                    // 数字主体
                    ctx.save();
                    ctx.translate(labelX, labelY);
                    ctx.fillStyle = '#1a1a1a';
                    ctx.font = '700 30px "Courier New", Courier, monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(String(speedVal), 0, 0);
                    ctx.restore();
                }
            }

            // === 7. 表盘边缘黑色内圈线 ===
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, sp.faceR - 4, 0, Math.PI * 2);
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // === 8. 玻璃罩反光效果（多层） ===
            ctx.save();
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, sp.faceR - 6, 0, Math.PI * 2);
            ctx.clip();

            // 主反光：上方大面积弧形渐变
            const glassGrad = ctx.createLinearGradient(sp.cx, sp.cy - sp.faceR, sp.cx, sp.cy - sp.faceR * 0.15);
            glassGrad.addColorStop(0, 'rgba(255,255,255,0.16)');
            glassGrad.addColorStop(0.3, 'rgba(255,255,255,0.06)');
            glassGrad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = glassGrad;
            ctx.fillRect(sp.cx - sp.faceR, sp.cy - sp.faceR, sp.faceR * 2, sp.faceR * 0.85);

            // 左上角椭圆形反光斑
            ctx.beginPath();
            ctx.ellipse(sp.cx - 90, sp.cy - 140, 130, 45, -0.3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            ctx.fill();

            // 右下角微弱反光（模拟环境光反射）
            ctx.beginPath();
            ctx.ellipse(sp.cx + 100, sp.cy + 120, 80, 30, 0.4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.025)';
            ctx.fill();
            ctx.restore();
        },

        // 绘制指针（粗暗红+白边+光影质感）
        drawNeedle(ctx, speed, maxSpeed) {
            const sp = this.SP;
            const angle = this.speedToAngle(speed, maxSpeed);

            ctx.save();
            ctx.translate(sp.cx, sp.cy);
            ctx.rotate(angle + Math.PI / 2);

            // 指针投影
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetX = 1.5;
            ctx.shadowOffsetY = 2.5;

            // 主体：粗长三角（顶端圆钝，底部宽柄）
            const baseW = sp.needleBaseW * 1.5;
            const tipW = baseW * 0.25;  // 顶端更宽，圆钝感
            const stemLen = 28;

            ctx.beginPath();
            ctx.moveTo(-tipW / 2, -sp.needleLen);   // 顶端左
            ctx.lineTo(tipW / 2, -sp.needleLen);    // 顶端右
            ctx.lineTo(baseW / 2, -stemLen);         // 右底三角端
            ctx.lineTo(baseW / 2, 0);                // 右柄底
            ctx.lineTo(-baseW / 2, 0);               // 左柄底
            ctx.lineTo(-baseW / 2, -stemLen);        // 左底三角端
            ctx.closePath();

            // 暗红渐变填充（更深色，两侧极暗，中间略亮）
            const needleGrad = ctx.createLinearGradient(-baseW / 2, 0, baseW / 2, 0);
            needleGrad.addColorStop(0, '#4a0e0e');
            needleGrad.addColorStop(0.2, '#6a1818');
            needleGrad.addColorStop(0.45, '#7a2020');
            needleGrad.addColorStop(0.55, '#7a2020');
            needleGrad.addColorStop(0.8, '#6a1818');
            needleGrad.addColorStop(1, '#4a0e0e');
            ctx.fillStyle = needleGrad;
            ctx.fill();

            // 白色边缘描线
            ctx.shadowColor = 'transparent';
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 0.8;
            ctx.stroke();

            // 左侧暗面（增强立体感）
            ctx.beginPath();
            ctx.moveTo(-tipW / 2, -sp.needleLen);
            ctx.lineTo(-baseW / 2, -stemLen);
            ctx.lineTo(-baseW / 2, 0);
            ctx.lineTo(0, 0);
            ctx.lineTo(0, -sp.needleLen);
            ctx.closePath();
            ctx.fillStyle = 'rgba(0,0,0,0.12)';
            ctx.fill();

            // 中心纵向高光条
            ctx.beginPath();
            ctx.moveTo(0, -sp.needleLen);
            ctx.lineTo(1.5, -stemLen);
            ctx.lineTo(1.5, 0);
            ctx.lineTo(-1.5, 0);
            ctx.lineTo(-1.5, -stemLen);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fill();

            // 底部暗线（柄底阴影）
            ctx.beginPath();
            ctx.moveTo(-baseW / 2, 0);
            ctx.lineTo(baseW / 2, 0);
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 0.6;
            ctx.stroke();

            ctx.restore();
        },

        // 绘制中心帽（大尺寸金属螺丝头质感）
        drawCenterCap(ctx) {
            const sp = this.SP;
            const capR = sp.capR * 2;  // 放大2倍

            ctx.save();

            // 1. 最外深色圈
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, capR + 5, 0, Math.PI * 2);
            ctx.fillStyle = '#111111';
            ctx.fill();

            // 2. 金属主体环（外侧暗）
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, capR + 3, 0, Math.PI * 2);
            const outerRingGrad = ctx.createRadialGradient(sp.cx, sp.cy, capR, sp.cx, sp.cy, capR + 3);
            outerRingGrad.addColorStop(0, '#606060');
            outerRingGrad.addColorStop(1, '#2a2a2a');
            ctx.fillStyle = outerRingGrad;
            ctx.fill();

            // 3. 金属斜面（上亮下暗，模拟圆形凸起受光）
            const bevelGrad = ctx.createRadialGradient(sp.cx, sp.cy - 3, capR * 0.3, sp.cx, sp.cy + 3, capR + 1);
            bevelGrad.addColorStop(0, '#c0c0c0');
            bevelGrad.addColorStop(0.35, '#909090');
            bevelGrad.addColorStop(0.65, '#555555');
            bevelGrad.addColorStop(1, '#2a2a2a');
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, capR, 0, Math.PI * 2);
            ctx.fillStyle = bevelGrad;
            ctx.fill();

            // 4. 顶部高光弧（圆弧状的反光，模拟凸起圆顶）
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, capR - 1, -Math.PI * 0.85, -Math.PI * 0.15);
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // 5. 内圈深色凹陷（螺丝孔）
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, capR * 0.5, 0, Math.PI * 2);
            const innerHoleGrad = ctx.createRadialGradient(sp.cx, sp.cy - 1, 0, sp.cx, sp.cy, capR * 0.5);
            innerHoleGrad.addColorStop(0, '#080808');
            innerHoleGrad.addColorStop(0.6, '#151515');
            innerHoleGrad.addColorStop(1, '#282828');
            ctx.fillStyle = innerHoleGrad;
            ctx.fill();

            // 6. 内孔边缘细高光（凹陷边缘反光）
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, capR * 0.5, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.18)';
            ctx.lineWidth = 0.6;
            ctx.stroke();

            // 7. 中心极细小点
            ctx.beginPath();
            ctx.arc(sp.cx, sp.cy, 1.5, 0, Math.PI * 2);
            ctx.fillStyle = '#080808';
            ctx.fill();

            ctx.restore();
        },

        // 7段LED数码管字符映射
        // 段位顺序: a(上), b(右上), c(右下), d(下), e(左下), f(左上), g(中)
        // 位映射: bit6=a, bit5=b, bit4=c, bit3=d, bit2=e, bit1=f, bit0=g
        LED_7SEG_MAP: {
            '0': 0b1111110, // a,b,c,d,e,f
            '1': 0b0110000, // b,c
            '2': 0b1101101, // a,b,d,e,g
            '3': 0b1111001, // a,b,c,d,g
            '4': 0b0110011, // b,c,f,g
            '5': 0b1011011, // a,c,d,f,g
            '6': 0b1011111, // a,c,d,e,f,g
            '7': 0b1110000, // a,b,c
            '8': 0b1111111, // a,b,c,d,e,f,g
            '9': 0b1111011, // a,b,c,d,f,g
        },

        // 绘制单个7段LED数字
        drawLEDDigit(ctx, x, y, w, h, digit, brightness) {
            const segBits = this.LED_7SEG_MAP[digit];
            if (segBits === undefined) return;

            const segW = w * 0.18;  // 段宽度（加粗，模拟粗体7段LED）
            const gap = segW * 0.10; // 段间微小间隙
            const cornerR = segW * 0.30; // 段端点圆角

            // 7段位置（绝对坐标）
            const segs = [
                // a: 顶横
                { x: x + segW, y: y + 1, w: w - segW * 2, h: segW - 1 },
                // b: 右上竖
                { x: x + w - segW, y: y + segW + 1, w: segW - 1, h: (h - segW * 2) / 2 - gap },
                // c: 右下竖
                { x: x + w - segW, y: y + h / 2 + gap + 1, w: segW - 1, h: (h - segW * 2) / 2 - gap },
                // d: 底横
                { x: x + segW, y: y + h - segW, w: w - segW * 2, h: segW - 1 },
                // e: 左下竖
                { x: x + 1, y: y + h / 2 + gap + 1, w: segW - 1, h: (h - segW * 2) / 2 - gap },
                // f: 左上竖
                { x: x + 1, y: y + segW + 1, w: segW - 1, h: (h - segW * 2) / 2 - gap },
                // g: 中横
                { x: x + segW, y: y + h / 2 - segW / 2, w: w - segW * 2, h: segW - 1 },
            ];

            // 激活色：红橙色渐变（上亮下暗，模拟LED管芯发光）
            const r = 255;
            const g = Math.floor(35 + 55 * brightness);
            const b = Math.floor(5 + 20 * brightness);
            const a = (0.6 + 0.4 * brightness).toFixed(2);

            for (let i = 0; i < 7; i++) {
                const isActive = (segBits >> (6 - i)) & 1;
                const s = segs[i];

                if (isActive) {
                    // 激活段：渐变填充（上亮下暗，模拟LED管芯）
                    const segGrad = ctx.createLinearGradient(s.x, s.y, s.x, s.y + s.h);
                    segGrad.addColorStop(0, `rgba(${r},${Math.min(255, g + 30)},${Math.min(255, b + 15)},${a})`);
                    segGrad.addColorStop(0.5, `rgba(${r},${g},${b},${a})`);
                    segGrad.addColorStop(1, `rgba(${Math.floor(r * 0.85)},${Math.floor(g * 0.7)},${Math.floor(b * 0.5)},${(parseFloat(a) * 0.9).toFixed(2)})`);
                    ctx.fillStyle = segGrad;
                    UI.roundRect(ctx, s.x, s.y, s.w, s.h, cornerR);
                    ctx.fill();

                    // 段中心高光条（模拟LED管芯反光）
                    ctx.fillStyle = `rgba(255,255,220,${0.12 * brightness})`;
                    if (s.w > s.h) {
                        // 横向段：中间一条细高光
                        ctx.fillRect(s.x + 2, s.y + s.h * 0.3, s.w - 4, s.h * 0.2);
                    } else {
                        // 纵向段：中间一条细高光
                        ctx.fillRect(s.x + s.w * 0.3, s.y + 2, s.w * 0.2, s.h - 4);
                    }
                } else {
                    // 未激活段：暗色微轮廓
                    ctx.fillStyle = 'rgba(45,16,10,0.3)';
                    ctx.beginPath();
                    ctx.roundRect(s.x, s.y, s.w, s.h, cornerR);
                    ctx.fill();
                }
            }
        },

        // 绘制7段LED数字车速显示（真实汽车仪表盘质感）
        drawDigitalSpeed(ctx, speed) {
            const sp = this.SP;
            const digitW = 30;     // 单数字宽度
            const digitH = 48;     // 单数字高度
            const gap = 5;         // 数字间距
            const totalW = digitW * 3 + gap * 2;
            const startX = sp.cx - totalW / 2;
            const startY = sp.cy + 95; // 中心帽下方

            // 速度转字符串（右对齐，补零到3位）
            const speedInt = Math.max(0, Math.min(999, Math.round(speed)));
            const speedStr = speedInt.toString().padStart(3, '0');

            // 背景凹槽尺寸
            const padX = 14, padY = 10;
            const bgW = totalW + padX * 2;
            const bgH = digitH + padY * 2;
            const bgX = startX - padX;
            const bgY = startY - padY;

            // === 1. 外框金属边（银色金属质感） ===
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 3;
            UI.roundRect(ctx, bgX - 2, bgY - 2, bgW + 4, bgH + 4, 6);
            const bezelGrad = ctx.createLinearGradient(bgX, bgY, bgX, bgY + bgH);
            bezelGrad.addColorStop(0, '#888');
            bezelGrad.addColorStop(0.15, '#aaa');
            bezelGrad.addColorStop(0.3, '#666');
            bezelGrad.addColorStop(0.7, '#444');
            bezelGrad.addColorStop(0.85, '#555');
            bezelGrad.addColorStop(1, '#333');
            ctx.fillStyle = bezelGrad;
            ctx.fill();
            ctx.restore();

            // 确保阴影状态完全清除
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            // === 2. 金属边框内缘高光 ===
            UI.roundRect(ctx, bgX - 1, bgY - 1, bgW + 2, bgH + 2, 5);
            ctx.strokeStyle = 'rgba(200,200,200,0.25)';
            ctx.lineWidth = 0.8;
            ctx.stroke();

            // === 3. 深色显示面板（内凹） ===
            UI.roundRect(ctx, bgX, bgY, bgW, bgH, 4);
            const panelGrad = ctx.createRadialGradient(
                sp.cx, bgY + bgH * 0.3, bgW * 0.2,
                sp.cx, bgY + bgH * 0.5, bgW * 0.8
            );
            panelGrad.addColorStop(0, '#1c1c1c');
            panelGrad.addColorStop(0.5, '#141414');
            panelGrad.addColorStop(1, '#0c0c0c');
            ctx.fillStyle = panelGrad;
            ctx.fill();

            // === 4. 内凹阴影（上边缘暗、下边缘亮，模拟凹陷） ===
            ctx.save();
            ctx.beginPath();
            UI.roundRect(ctx, bgX, bgY, bgW, bgH, 4);
            ctx.clip();
            // 上边缘暗影
            const topShadow = ctx.createLinearGradient(bgX, bgY, bgX, bgY + 8);
            topShadow.addColorStop(0, 'rgba(0,0,0,0.5)');
            topShadow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = topShadow;
            ctx.fillRect(bgX, bgY, bgW, 8);
            // 下边缘微亮
            const bottomLight = ctx.createLinearGradient(bgX, bgY + bgH - 6, bgX, bgY + bgH);
            bottomLight.addColorStop(0, 'rgba(255,255,255,0)');
            bottomLight.addColorStop(1, 'rgba(255,255,255,0.03)');
            ctx.fillStyle = bottomLight;
            ctx.fillRect(bgX, bgY + bgH - 6, bgW, 6);
            ctx.restore();

            // === 5. 绘制3个LED数字 ===
            const brightness = Math.min(1, 0.35 + speedInt / 250 * 0.65);
            for (let i = 0; i < 3; i++) {
                ctx.save();
                const dx = startX + i * (digitW + gap);
                this.drawLEDDigit(ctx, dx, startY, digitW, digitH, speedStr[i], brightness);
                ctx.restore();
            }

            // === 6. LED 整体辉光（叠加层） ===
            ctx.save();
            ctx.beginPath();
            UI.roundRect(ctx, bgX + 2, bgY + 2, bgW - 4, bgH - 4, 3);
            ctx.clip();
            ctx.globalCompositeOperation = 'screen';
            ctx.globalAlpha = 0.08 * brightness;
            const glowGrad = ctx.createRadialGradient(sp.cx, startY + digitH / 2, 5, sp.cx, startY + digitH / 2, bgW * 0.6);
            glowGrad.addColorStop(0, 'rgba(255,80,30,1)');
            glowGrad.addColorStop(1, 'rgba(255,40,10,0)');
            ctx.fillStyle = glowGrad;
            ctx.fillRect(bgX, bgY, bgW, bgH);
            ctx.restore();

            // === 7. 玻璃罩反光（上半部分弧形高光） ===
            ctx.save();
            ctx.beginPath();
            UI.roundRect(ctx, bgX, bgY, bgW, bgH, 4);
            ctx.clip();
            // 主反光
            const glassGrad = ctx.createLinearGradient(bgX, bgY, bgX, bgY + bgH * 0.5);
            glassGrad.addColorStop(0, 'rgba(255,255,255,0.07)');
            glassGrad.addColorStop(0.5, 'rgba(255,255,255,0.02)');
            glassGrad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = glassGrad;
            ctx.fillRect(bgX, bgY, bgW, bgH * 0.5);
            // 左上角小亮点
            const spotGrad = ctx.createRadialGradient(bgX + bgW * 0.15, bgY + 4, 0, bgX + bgW * 0.15, bgY + 4, bgW * 0.3);
            spotGrad.addColorStop(0, 'rgba(255,255,255,0.06)');
            spotGrad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = spotGrad;
            ctx.fillRect(bgX, bgY, bgW * 0.5, bgH * 0.4);
            ctx.restore();

            // === 8. km/h 单位标注 ===
            ctx.save();
            ctx.font = '9px "Courier New", monospace';
            ctx.fillStyle = 'rgba(180,170,160,0.5)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('km/h', sp.cx, bgY + bgH + 5);
            ctx.restore();
        },

        // 完整渲染仪表盘
        renderSpeedometer() {
            const canvas = this.elements.speedometerCanvas;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const eng = SimulationEngine;
            const maxSpeed = eng.speedometerMax;

            // 绘制静态层（如果量程变化需要重绘）
            if (!this.speedometerStaticCanvas || this._lastStaticMaxSpeed !== maxSpeed) {
                this.drawSpeedometerStatic(maxSpeed);
                this._lastStaticMaxSpeed = maxSpeed;
            }

            // 清空并绘制静态层
            ctx.clearRect(0, 0, 800, 800);
            ctx.drawImage(this.speedometerStaticCanvas, 0, 0);

            // 绘制指针
            this.drawNeedle(ctx, eng.speed, maxSpeed);

            // 绘制16段LED数字车速
            this.drawDigitalSpeed(ctx, eng.speed);

            // 绘制中心帽
            this.drawCenterCap(ctx);
        },

        // 更新速度表显示
        updateSpeedometer() {
            // Canvas 渲染仪表盘
            this.renderSpeedometer();
        },

        updateStats() {
            // 性能数据面板已移除
        },

        setStatus(className, text) {

        },

        // 更新车型信息
        updateCarInfo(brand, car) {
            this.elements.carName.textContent = `${brand} ${car.model}`;
            this.elements.carYear.textContent = car.year;
            this.elements.accelerationTime.textContent = `${car.acceleration}秒`;
            this.elements.maxSpeed.textContent = `${car.maxSpeed} km/h`;

            this.elements.carInfo.classList.remove('hidden');
        },

        // 初始化图表（绘制网格到离屏 Canvas）
        initChart() {
            // 速度曲线图表已移除
        },

        // 更新图表曲线
        updateChart() {
            // 速度曲线图表已移除
        },

        // 重置 UI
        resetUI() {
            this.updateSpeedometer();
            this.setStatus('bg-green-500', '准备就绪');
        }
    };

    // ============================================================
    // 控制器 - 事件绑定与协调
    // ============================================================
    const Controller = {
        // 渲染循环 ID
        renderFrame: null,

        init() {
            UI.cacheElements();
            UI.populateBrandSelect();
            // 初始渲染仪表盘（空状态）
            UI.renderSpeedometer();

            this.bindEvents();
        },

        bindEvents() {
            const el = UI.elements;

            // 品牌选择
            el.brandSelect.addEventListener('change', () => this.handleBrandChange());

            // 车型选择
            el.modelSelect.addEventListener('change', () => this.handleModelChange());

            // 油门按钮
            el.accelerateBtn.addEventListener('mousedown', (e) => { e.preventDefault(); this.startAcceleration(); UI.elements.accelerateBtn.classList.add('is-pressed'); });
            el.accelerateBtn.addEventListener('mouseup', () => { this.stopAcceleration(); UI.elements.accelerateBtn.classList.remove('is-pressed'); });
            el.accelerateBtn.addEventListener('mouseleave', () => { this.stopAcceleration(); UI.elements.accelerateBtn.classList.remove('is-pressed'); });
            el.accelerateBtn.addEventListener('touchstart', (e) => { e.preventDefault(); this.startAcceleration(); UI.elements.accelerateBtn.classList.add('is-pressed'); });
            el.accelerateBtn.addEventListener('touchend', () => { this.stopAcceleration(); UI.elements.accelerateBtn.classList.remove('is-pressed'); });

            // 刹车按钮
            el.brakeBtn.addEventListener('mousedown', (e) => { e.preventDefault(); this.startBraking(); UI.elements.brakeBtn.classList.add('is-pressed'); });
            el.brakeBtn.addEventListener('mouseup', () => { this.stopBraking(); UI.elements.brakeBtn.classList.remove('is-pressed'); });
            el.brakeBtn.addEventListener('mouseleave', () => { this.stopBraking(); UI.elements.brakeBtn.classList.remove('is-pressed'); });
            el.brakeBtn.addEventListener('touchstart', (e) => { e.preventDefault(); this.startBraking(); UI.elements.brakeBtn.classList.add('is-pressed'); });
            el.brakeBtn.addEventListener('touchend', () => { this.stopBraking(); UI.elements.brakeBtn.classList.remove('is-pressed'); });

            // 移动端油门按钮
            el.accelerateBtnMobile.addEventListener('touchstart', (e) => { e.preventDefault(); this.startAcceleration(); UI.elements.accelerateBtnMobile.classList.add('is-pressed'); });
            el.accelerateBtnMobile.addEventListener('touchend', () => { this.stopAcceleration(); UI.elements.accelerateBtnMobile.classList.remove('is-pressed'); });
            el.accelerateBtnMobile.addEventListener('mousedown', (e) => { e.preventDefault(); this.startAcceleration(); UI.elements.accelerateBtnMobile.classList.add('is-pressed'); });
            el.accelerateBtnMobile.addEventListener('mouseup', () => { this.stopAcceleration(); UI.elements.accelerateBtnMobile.classList.remove('is-pressed'); });

            // 移动端刹车按钮
            el.brakeBtnMobile.addEventListener('touchstart', (e) => { e.preventDefault(); this.startBraking(); UI.elements.brakeBtnMobile.classList.add('is-pressed'); });
            el.brakeBtnMobile.addEventListener('touchend', () => { this.stopBraking(); UI.elements.brakeBtnMobile.classList.remove('is-pressed'); });
            el.brakeBtnMobile.addEventListener('mousedown', (e) => { e.preventDefault(); this.startBraking(); UI.elements.brakeBtnMobile.classList.add('is-pressed'); });
            el.brakeBtnMobile.addEventListener('mouseup', () => { this.stopBraking(); UI.elements.brakeBtnMobile.classList.remove('is-pressed'); });

            // 键盘控制
            document.addEventListener('keydown', (e) => this.handleKeyDown(e));
            document.addEventListener('keyup', (e) => this.handleKeyUp(e));
        },

        handleBrandChange() {
            const brand = UI.elements.brandSelect.value;
            const modelSelect = UI.elements.modelSelect;
            modelSelect.innerHTML = '<option value="">选择车型</option>';

            if (brand) {
                modelSelect.disabled = false;
                carData[brand].forEach((car, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = car.model;
                    modelSelect.appendChild(option);
                });
            } else {
                modelSelect.disabled = true;
            }

            UI.elements.carInfo.classList.add('hidden');
            SimulationEngine.selectedCar = null;
            UI.elements.accelerateBtn.disabled = true;
            UI.elements.brakeBtn.disabled = true;
            UI.elements.accelerateBtnMobile.disabled = true;
            UI.elements.brakeBtnMobile.disabled = true;
            UI.setStatus('bg-gray-400', '请选择车型');
        },

        handleModelChange() {
            const brand = UI.elements.brandSelect.value;
            const modelIndex = UI.elements.modelSelect.value;

            if (brand && modelIndex !== '') {
                const car = carData[brand][modelIndex];
                SimulationEngine.selectCar(car);
                UI.updateCarInfo(brand, car);
                // 仪表盘静态层会在renderSpeedometer中自动重绘（量程变化时）
                UI.renderSpeedometer();

                UI.elements.accelerateBtn.disabled = false;
                UI.elements.brakeBtn.disabled = false;
                UI.elements.accelerateBtnMobile.disabled = false;
                UI.elements.brakeBtnMobile.disabled = false;
                UI.setStatus('bg-green-500', '准备就绪');
            } else {
                UI.elements.carInfo.classList.add('hidden');
                SimulationEngine.selectedCar = null;
                UI.elements.accelerateBtn.disabled = true;
                UI.elements.brakeBtn.disabled = true;
                UI.elements.accelerateBtnMobile.disabled = true;
                UI.elements.brakeBtnMobile.disabled = true;
                UI.setStatus('bg-gray-400', '请选择车型');
            }
        },

        startAcceleration() {
            SimulationEngine.startAcceleration();
            UI.setStatus('bg-red-500', '加速中...');
            this.startRenderLoop();
        },

        stopAcceleration() {
            SimulationEngine.stopAcceleration();
            if (SimulationEngine.speed > 0) {
                UI.setStatus('bg-yellow-500', '滑行中...');
            } else {
                UI.setStatus('bg-green-500', '准备就绪');
                this.stopRenderLoop();
            }
        },

        startBraking() {
            SimulationEngine.startBraking();
            UI.setStatus('bg-yellow-500', '刹车中...');
            this.startRenderLoop();
        },

        stopBraking() {
            SimulationEngine.stopBraking();
            if (SimulationEngine.speed > 0) {
                UI.setStatus('bg-yellow-500', '滑行中...');
            } else {
                UI.setStatus('bg-green-500', '准备就绪');
                this.stopRenderLoop();
            }
        },

        resetSimulation() {
            SimulationEngine.reset();
            this.stopRenderLoop();
            UI.resetUI();
        },

        // 键盘控制
        handleKeyDown(e) {
            if (e.repeat) return;
            const key = e.key.toLowerCase();

            if ((key === 'w' || key === 'arrowup') && !SimulationEngine.isAccelerating) {
                if (SimulationEngine.selectedCar) {
                    this.startAcceleration();
                    UI.elements.accelerateBtn?.classList.add('is-pressed');
                    UI.elements.accelerateBtnMobile?.classList.add('is-pressed');
                }
            } else if ((key === 's' || key === 'arrowdown') && !SimulationEngine.isBraking) {
                if (SimulationEngine.selectedCar && SimulationEngine.speed > 0) {
                    this.startBraking();
                    UI.elements.brakeBtn?.classList.add('is-pressed');
                    UI.elements.brakeBtnMobile?.classList.add('is-pressed');
                }
            }
        },

        handleKeyUp(e) {
            const key = e.key.toLowerCase();

            if (key === 'w' || key === 'arrowup') {
                this.stopAcceleration();
                UI.elements.accelerateBtn?.classList.remove('is-pressed');
                UI.elements.accelerateBtnMobile?.classList.remove('is-pressed');
            } else if (key === 's' || key === 'arrowdown') {
                this.stopBraking();
                UI.elements.brakeBtn?.classList.remove('is-pressed');
                UI.elements.brakeBtnMobile?.classList.remove('is-pressed');
            }
        },

        // 按需渲染循环
        startRenderLoop() {
            if (this.renderFrame) return;
            const render = () => {
                UI.updateSpeedometer();
                if (SimulationEngine.speed > 0 || SimulationEngine.isAccelerating || SimulationEngine.isBraking) {
                    this.renderFrame = requestAnimationFrame(render);
                } else {
                    this.renderFrame = null;
                }
            };
            this.renderFrame = requestAnimationFrame(render);
        },

        stopRenderLoop() {
            if (this.renderFrame) {
                cancelAnimationFrame(this.renderFrame);
                this.renderFrame = null;
            }
            // 最终更新一次确保 UI 一致
            UI.updateSpeedometer();
        }
    };

    // ============================================================
    // 启动
    // ============================================================
    Controller.init();
    </script>
    <div style="text-align:center; padding: 12px 0; font-size: 12px; color: #999; font-family: 'Courier New', 'Noto Sans SC', Courier, monospace;">pedal.abetterplace2.live</div>
</body>
</html>
