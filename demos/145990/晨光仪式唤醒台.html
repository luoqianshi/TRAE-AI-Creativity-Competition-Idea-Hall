<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晨光仪式唤醒台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Segoe UI',sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#FFE4B5 0%,#FFA07A 40%,#FF6B6B 100%);
    display:flex;flex-direction:column;align-items:center;
    padding:40px 20px;overflow-x:hidden;
  }
  .sky{position:fixed;top:0;left:0;width:100%;height:60%;pointer-events:none;z-index:0}
  .sun{
    position:fixed;top:60px;right:80px;width:140px;height:140px;
    background:radial-gradient(circle,#FFF5C4 0%,#FFD700 40%,#FF8C42 100%);
    border-radius:50%;box-shadow:0 0 80px rgba(255,200,80,.8);
    animation:sunPulse 4s ease-in-out infinite;z-index:0;
  }
  @keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .cloud{position:absolute;background:rgba(255,255,255,.6);border-radius:50px;filter:blur(2px)}
  .c1{top:120px;left:-100px;width:200px;height:70px;animation:drift 30s linear infinite}
  .c2{top:200px;left:30%;width:150px;height:50px;animation:drift 40s linear infinite reverse}
  .c3{top:80px;right:30%;width:180px;height:60px;animation:drift 35s linear infinite}
  @keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
  header{position:relative;z-index:2;text-align:center;margin-bottom:30px;color:#5A2D0C}
  header h1{font-size:42px;font-weight:800;letter-spacing:2px;text-shadow:2px 2px 0 rgba(255,255,255,.5)}
  header p{font-size:16px;margin-top:8px;opacity:.85}
  .date-box{
    background:rgba(255,255,255,.45);backdrop-filter:blur(10px);
    padding:12px 28px;border-radius:30px;margin-top:14px;
    display:inline-flex;gap:20px;align-items:center;font-weight:600;
  }
  .date-box span{display:flex;align-items:center;gap:6px}
  .mood-pick{position:relative;z-index:2;display:flex;gap:10px;margin:20px 0;flex-wrap:wrap;justify-content:center}
  .mood-btn{
    padding:10px 20px;border:none;border-radius:25px;
    background:rgba(255,255,255,.5);font-size:14px;font-weight:600;
    cursor:pointer;transition:.3s;color:#5A2D0C;
  }
  .mood-btn:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.15)}
  .mood-btn.active{background:#5A2D0C;color:#FFE4B5}
  .cards{position:relative;z-index:2;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;max-width:1100px;width:100%}
  .card{perspective:1000px;height:240px;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transition:transform .8s;transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .front{
    background:linear-gradient(145deg,rgba(255,255,255,.7),rgba(255,230,200,.7));
    backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(255,140,80,.25);
    border:2px solid rgba(255,255,255,.6);
  }
  .back{
    background:linear-gradient(145deg,#5A2D0C,#8B4513);color:#FFE4B5;
    transform:rotateY(180deg);box-shadow:0 8px 24px rgba(90,45,12,.4);
  }
  .icon{font-size:48px;margin-bottom:12px}
  .card h3{font-size:18px;font-weight:700}
  .front h3{color:#5A2D0C}
  .back .step{font-size:13px;line-height:1.7;text-align:center;opacity:.95}
  .back .dur{margin-top:10px;padding:4px 14px;background:rgba(255,228,181,.2);border-radius:15px;font-size:12px}
  .progress-wrap{position:relative;z-index:2;width:100%;max-width:600px;margin-top:40px;background:rgba(255,255,255,.4);border-radius:20px;height:14px;overflow:hidden}
  .bar{height:100%;width:0;background:linear-gradient(90deg,#FFD700,#FF6B6B);transition:width .6s ease;border-radius:20px}
  .stat{position:relative;z-index:2;display:flex;gap:30px;margin-top:18px;color:#5A2D0C;font-weight:600}
</style>
</head>
<body>
<div class="sun"></div>
<div class="sky"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>
<header>
  <h1>晨光仪式唤醒台</h1>
  <p>根据今日心情，生成专属唤醒流程</p>
  <div class="date-box">
    <span id="dateTxt"></span><span>|</span><span id="weekTxt"></span>
  </div>
</header>
<div class="mood-pick">
  <button class="mood-btn active" data-mood="活力">活力满满</button>
  <button class="mood-btn" data-mood="平和">平和舒缓</button>
  <button class="mood-btn" data-mood="焦虑">略带焦虑</button>
  <button class="mood-btn" data-mood="慵懒">慵懒起床</button>
</div>
<div class="cards" id="cardArea"></div>
<div class="stat"><span>已完成 <b id="done">0</b>/6</span><span>累计专注 <b id="min">0</b> 分钟</span></div>
<div class="progress-wrap"><div class="bar" id="bar"></div></div>
<script>
const rituals={
  '活力':[['冥想呼吸','深吸4秒，屏息4秒，缓呼6秒','5','🧘'],['全身拉伸','唤醒每一寸肌肉与关节','8','🤸'],['温水唤醒','一杯温水启动代谢','3','💧'],['晨间阅读','读三页让你心动的书','15','📖'],['目标确认','写下今天最重要的三件事','5','✍️'],['能量早餐','高蛋白搭配开启一天','10','🥑']],
  '平和':[['正念扫描','从脚到头感受每一处','6','🧘'],['轻柔拉伸','缓慢转动颈肩腰背','6','🌿'],['慢饮温水','小口感受温度流过身体','4','💧'],['感恩记录','写下三件感恩的小事','8','📓'],['阳光漫步','走到窗边或阳台两分钟','2','☀️'],['清淡早餐','水果与坚果的简单组合','10','🥜']],
  '焦虑':[['箱式呼吸','4秒吸气4秒屏息4秒呼气','5','🫁'],['肩颈释放','转动肩膀画大圆','6','💆'],['温热饮','蜂蜜水温暖胃部','3','☕'],['清空大脑','把所有担心写到纸上','10','📝'],['三件小事','只列三件今天能完成的事','5','🎯'],['舒缓早餐','燕麦与香蕉的组合','10','🍌']],
  '慵懒':[['被窝伸展','在被里伸展四肢','3','🛏️'],['睁眼微笑','对天花板笑三次','1','😊'],['坐起喝水','床头放好的温水','2','💧'],['五分钟动','下床走动让血液循环','5','🚶'],['冷水洗脸','用凉水轻拍面部','2','💦'],['简单早餐','吐司与牛奶的快手组合','8','🍞']]
};
let cur='活力';let done=0;let mins=0;
function render(){
  const area=document.getElementById('cardArea');area.innerHTML='';
  rituals[cur].forEach((r,i)=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="inner"><div class="face front"><div class="icon">${r[3]}</div><h3>${r[0]}</h3></div><div class="face back"><div class="step">${r[1]}</div><div class="dur">约 ${r[2]} 分钟</div></div></div>`;
    c.addEventListener('click',()=>{
      if(!c.classList.contains('flipped')){done++;mins+=parseInt(r[2]);update();}
      else{done--;mins-=parseInt(r[2]);update();}
      c.classList.toggle('flipped');
    });
    area.appendChild(c);
  });
  done=0;mins=0;update();
}
function update(){
  document.getElementById('done').textContent=done;
  document.getElementById('min').textContent=mins;
  document.getElementById('bar').style.width=(done/6*100)+'%';
}
document.querySelectorAll('.mood-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.mood-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');cur=b.dataset.mood;render();
  });
});
const d=new Date();
document.getElementById('dateTxt').textContent=`${d.getMonth()+1}月${d.getDate()}日`;
document.getElementById('weekTxt').textContent=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
render();
</script>
</body>
</html>
