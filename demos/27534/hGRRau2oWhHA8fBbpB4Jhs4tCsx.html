      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--accent);
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }
    h2 .num {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: var(--accent);
      letter-spacing: 0.1em;
    }
    h3 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: 0.03em;
      color: var(--accent2);
      margin: 2rem 0 0.75rem;
    }
    h4 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
      margin: 1.25rem 0 0.5rem;
    }

    /* === LEAD === */
    .lead {
      font-size: 1.15rem;
      color: var(--ink);
      line-height: 1.8;
      margin-bottom: 2rem;
      padding-left: 1rem;
      border-left: 3px solid var(--accent2);
    }

    /* === STAT GRID === */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin: 2rem 0 3rem;
    }
    .stat {
      background: var(--bg2);
      padding: 1.5rem 1.25rem;
      border-left: 3px solid var(--accent);
    }
    .stat .num {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 2.4rem;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 0.4rem;
    }
    .stat .num small {
      font-size: 1rem;
      color: var(--accent2);
      margin-left: 0.15rem;
    }
    .stat .label {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* === FLOW STEPS === */
    .flow {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin: 1.5rem 0 2rem;
      counter-reset: step;
    }
    .flow-step {
      background: var(--bg2);
      padding: 1.5rem 1.25rem 1.25rem;
      position: relative;
      border-top: 3px solid var(--accent2);
    }
    .flow-step::before {
      counter-increment: step;
      content: "0" counter(step);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent);
      letter-spacing: 0.15em;
    }
    .flow-step h4 {
      margin: 0.4rem 0 0.6rem;
      font-size: 1.05rem;
      color: var(--ink);
    }
    .flow-step p {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
    }

    /* === STALL CARDS === */
    .stall-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin: 1.5rem 0 2rem;
    }
    .stall {
      background: var(--bg2);
      padding: 1.25rem;
      border-left: 4px solid var(--accent);
      position: relative;
    }
    .stall.featured { border-left-color: var(--accent2); }
    .stall-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
      gap: 0.75rem;
    }
    .stall-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--ink);
      letter-spacing: 0.02em;
    }
    .stall-price {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }
    .stall-meta {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
    }
    .stall-meta span + span::before {
      content: "·";
      margin: 0 0.4rem;
      color: var(--rule);
    }
    .stall-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.6rem;
    }
    .tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 2px 8px;
      border: 1px solid var(--rule);
      color: var(--accent2);
      letter-spacing: 0.05em;
      border-radius: 2px;
    }
    .tag.hot { color: var(--accent); border-color: var(--accent); }
    .stall-desc {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.55;
      margin-top: 0.5rem;
    }
    .rating {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--accent2);
    }

    /* === TABLE === */
    .table-wrap {
      overflow-x: auto;
      overflow-y: auto;
      max-height: 600px;
      margin: 1.5rem 0 2rem;
      border: 1px solid var(--rule);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
