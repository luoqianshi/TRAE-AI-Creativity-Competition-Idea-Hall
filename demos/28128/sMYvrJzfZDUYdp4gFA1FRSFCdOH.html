    body{

    .top-actions{
      padding: 10px 14px 12px;
      border-bottom: 1px solid var(--rule);
      background: rgba(255,255,255,0.98);
    }

    .loc-row{
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
    }
    .pin{

      position: relative;
    }
    .search .icon::after{
      content:"";
      position:absolute;
      inset: 4px;
      border: 2px solid rgba(255,255,255,.9);
      border-radius: 999px;
      transform: translate(-1px, -1px);
    }
    .search .placeholder{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .chips{

    .chip{

    }

    .content{

    }

      box-shadow: var(--shadow2);
      border: 1px solid var(--rule);
      padding: 14px 14px;

      grid-template-columns: 1fr 118px;
      gap: 12px;
      align-items: center;

    .hero-title{

      line-height: 1.15;

    }

        radial-gradient(140px 90px at 35% 65%, rgba(34,197,94,0.22), transparent 55%),

    .mini-map::before{
      content:"";
      position:absolute;
      width: 10px; height: 10px;
      background: var(--accent);
      border-radius: 999px;
      left: 38%;
      top: 62%;
      box-shadow: 0 0 0 6px rgba(34,197,94,0.18);
    }

    .list{
      margin-top: 12px;
      display: grid;
      gap: 10px;
    }
    .item{
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--rule);
      box-shadow: var(--shadow2);
      padding: 12px 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .item h4{
      margin: 0 0 2px;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .sub{
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .tags{
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .tag{
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(15,23,42,0.05);
      border: 1px solid rgba(15,23,42,0.08);

      white-space: nowrap;
    }
    .tag.free{ background: rgba(34,197,94,0.10); border-color: rgba(34,197,94,0.22); color: #0f5132; font-weight: 650; }
    .tag.score{ background: rgba(59,130,246,0.09); border-color: rgba(59,130,246,0.22); color: #1d4ed8; }
    .crowd{
      font-size: 11px;

      border-radius: 999px;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .crowd.empty{ background: rgba(34,197,94,0.12); color: #0f5132; border-color: rgba(34,197,94,0.25); }

    .crowd.full{ background: rgba(239,68,68,0.12); color: #991b1b; border-color: rgba(239,68,68,0.22); }

    .btn{
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 0;
      background: linear-gradient(135deg, rgba(59,130,246,1), rgba(59,130,246,0.85));

    /* bottom tab */
    .tabbar{

      grid-template-columns: repeat(4, 1fr);

    .tab{

      border-color: rgba(34,197,94,0.28);

    }

    /* small helper */
    .hint{
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce){

    }
