<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录 - mt-bill</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="prototype-body">
<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-status">
    <span>9:41</span>
    <span>📶 📡 🔋</span>
  </div>

  <div class="phone-content" style="padding-bottom:20px;">
    <div class="login-container">
      <div class="login-brand">
        <div class="login-logo">💰</div>
        <div class="login-title">mt-bill</div>
        <div class="login-subtitle">简单高效的记账工具</div>
      </div>

      <div style="height:40px;"></div>

      <!-- Login card -->
      <div style="background:white; border-radius:16px; padding:24px; box-shadow:0 4px 20px rgba(0,0,0,0.08);">
        <!-- Username -->
        <div class="login-field">
          <span class="login-field-icon">👤</span>
          <input type="text" class="login-field-input" placeholder="用户名 / 邮箱" style="border:none; outline:none; flex:1; font-size:15px;">
        </div>

        <!-- Password -->
        <div class="login-field" style="margin-top:12px;">
          <span class="login-field-icon">🔒</span>
          <input type="password" class="login-field-input" placeholder="密码" value="••••••••" style="border:none; outline:none; flex:1; font-size:15px;">
          <span style="font-size:14px; color:#909399; cursor:pointer;">👁</span>
        </div>

        <!-- Login button -->
        <div style="padding:0; margin-top:20px;">
          <div class="btn btn-primary" style="width:100%;">登 录</div>
        </div>

        <!-- Links -->
        <div class="login-links" style="margin-top:16px;">
          <span class="login-link">注册新账号</span>
          <span class="login-link">忘记密码？</span>
        </div>
      </div>

      <!-- Footer -->
      <div style="text-align:center; font-size:11px; color:#909399; line-height:1.8; margin-top:32px;">
        登录即表示同意
        <br>
        <span style="color:#4A90D9;">《服务条款》</span>
        和
        <span style="color:#4A90D9;">《隐私政策》</span>
      </div>
    </div>
  </div>

  <div class="phone-home-indicator"><div class="phone-home-bar"></div></div>
</div>

</body>
</html>
