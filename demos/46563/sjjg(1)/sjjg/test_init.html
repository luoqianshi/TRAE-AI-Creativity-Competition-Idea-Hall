<!DOCTYPE html>
<html>
<head>
<title>Test init</title>
</head>
<body>
<h1>Test</h1>
<div id="result"></div>
<script src="questions_data.js"></script>
<script>
window._testLog = [];
window.addEventListener('error', e => window._testLog.push('ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno));
</script>
<script src="app.js"></script>
<script>
setTimeout(() => {
  var log = window._testLog;
  var saveBtn = document.getElementById('btn-save-settings');
  var openBtn = document.getElementById('btn-open-settings');
  var settingsDialog = document.getElementById('settings-dialog');
  document.getElementById('result').innerHTML = `
    <p>errors: ${JSON.stringify(log)}</p>
    <p>saveBtn exists: ${!!saveBtn}</p>
    <p>openBtn exists: ${!!openBtn}</p>
    <p>settingsDialog exists: ${!!settingsDialog}</p>
    <p>aiAddWorkspace exists: ${!!document.getElementById('ai-add-workspace')}</p>
  `;
}, 500);
</script>
</body>
</html>
