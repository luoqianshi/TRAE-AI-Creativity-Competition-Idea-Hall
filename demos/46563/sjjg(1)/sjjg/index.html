<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description"
    content="Claude Exam Reviewer - A premium warm-canvas editorial interface to review, annotate, and re-do exam questions with a built-in wrong questions notebook.">
  <title>数据结构 错题复习本 | 思考型备考伴侣</title>

  <!-- Font loading: Cormorant Garamond for serif display, Inter for body sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <div class="brand-container" id="brand-nav">
      <!-- Custom SVG for Anthropic Radial-Spike Mark -->
      <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2v20M2 12h20M5 5l14 14M5 19L19 5" />
      </svg>
      <span class="brand-name">数据结构 错题复习本</span>
    </div>
    <nav class="nav-links">
      <button class="nav-link active" data-nav-mode="study">题目复习</button>
      <button class="nav-link" data-nav-mode="wrong">错题本 (重做)</button>
      <button class="nav-link" data-nav-mode="stats">进度统计</button>
      <button class="nav-link" data-nav-mode="add">AI 添加</button>
      <button class="nav-icon-btn" id="btn-save-progress" title="保存进度" aria-label="保存进度">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span class="save-badge" id="save-badge"></span>
      </button>
      <button class="nav-icon-btn" id="btn-open-settings" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
      </button>
    </nav>
  </header>

  <!-- App Main Content Workspace -->
  <main class="app-container">

    <!-- Sidebar -->
    <aside class="sidebar" id="app-sidebar">

      <!-- Stats Summary Card inside Sidebar -->
      <div class="stats-card" id="stats-summary-card">
        <!-- Populated dynamically by app.js -->
      </div>

      <!-- List of questions -->
      <div class="question-list-wrapper" id="question-list-container">
        <!-- Populated dynamically by app.js -->
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <section class="workspace" id="workspace-container">
      <!-- Populated dynamically by app.js -->
    </section>

    <!-- Stats Dashboard View (Hidden by default) -->
    <section class="stats-workspace" id="stats-workspace" style="display: none;">
      <!-- Populated dynamically by app.js -->
    </section>

    <!-- AI Add Question View (Hidden by default) -->
    <section class="ai-add-workspace" id="ai-add-workspace" style="display: none;">
      <!-- Populated dynamically by app.js -->
    </section>

  </main>

  <!-- Settings Dialog (Modal) -->
  <dialog id="settings-dialog" class="image-dialog">
    <div class="dialog-header">
      <h3>设置</h3>
      <button class="btn-close" id="btn-close-settings" aria-label="关闭">×</button>
    </div>
    <div class="dialog-body">
      <div class="form-group">
        <label class="form-label" for="input-api-key">DeepSeek API Key</label>
        <input type="password" id="input-api-key" class="text-input" placeholder="sk-..." autocomplete="off">
        <p class="form-hint">仅保存在本地浏览器 localStorage，不会上传到任何服务器。</p>
      </div>
      <div id="settings-status" class="settings-status" style="display: none;"></div>
      <div class="dialog-actions">
        <button class="btn btn-secondary" id="btn-test-api">测试连接</button>
        <button class="btn btn-primary" id="btn-save-settings">保存</button>
      </div>
    </div>
  </dialog>

  <!-- Tesseract.js for OCR fallback -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- Core Javascript Application Logic -->
  <script src="questions_data.js"></script>
  <script src="app.js"></script>
</body>

</html>
