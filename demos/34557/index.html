<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="PaperDeep v3 — AI驱动的论文写作指挥中心，集成6大引擎、多Agent协作、RAG知识检索">
  <meta name="keywords" content="AI论文写作,数学建模,论文生成,学术写作,多Agent协作,RAG检索">
  <meta name="author" content="PaperDeep Team">
  <meta name="theme-color" content="#f8fafc">
  <meta property="og:title" content="PaperDeep v3 — AI论文写作指挥中心">
  <meta property="og:description" content="AI驱动的论文写作指挥中心，集成6大引擎、多Agent协作、RAG知识检索">
  <title>PaperDeep v3 — AI论文写作指挥中心</title>
  <script src="./_shared/js/echarts.min.js"></script>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/effects.css">
  <link rel="stylesheet" href="./css/themes.css">
</head>
<body>
  <!-- Background Effects -->
  <canvas id="particleCanvas"></canvas>

  <!-- Floating Elements -->
  <div id="toastContainer"></div>
  <div id="contextToolbar" class="context-toolbar" role="toolbar" aria-label="文本操作">
    <button onclick="PaperDeep.copySelection()" aria-label="复制选中文本">📋 复制</button>
    <button onclick="PaperDeep.bookmarkSelection()" aria-label="收藏选中文本">📚 收藏</button>
    <button onclick="PaperDeep.askAgent()" aria-label="将选中文本发送给Agent">🤖 问Agent</button>
  </div>

  <!-- Topbar -->
  <nav class="topbar" id="topbar" role="navigation" aria-label="主导航">
    <button class="mobile-menu-btn" onclick="PaperDeep.toggleMobileSidebar()" aria-label="打开侧边栏菜单" aria-expanded="false" aria-controls="sidebar">☰</button>
    <div class="logo">
      <div class="logo-icon">PD</div>
      <span class="neon-text">PaperDeep</span>
      <span style="font-size:0.72rem;color:var(--muted);font-weight:500">v3</span>
    </div>
    <div class="spacer"></div>
    <button class="btn" onclick="PaperDeep.State.set('showDashboard',true)" aria-label="仪表盘" title="仪表盘">📊 仪表盘</button>
    <button class="btn btn-icon" onclick="PaperDeep.AgentPanel.toggle()" aria-label="Agent 活动流" title="Agent 活动流">📡</button>
    <button class="btn btn-icon" onclick="PaperDeep.Settings.open()" aria-label="设置" title="设置">⚙️</button>
    <button class="btn-theme" id="themeBtn" onclick="PaperDeep.Theme.toggle()" aria-label="切换主题" title="切换主题">🌙</button>
  </nav>

  <!-- App Layout -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="PaperDeep.toggleMobileSidebar(false)"></div>
  <div class="app-layout" id="appLayout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Main Area -->
    <main class="main-area" id="mainArea">
      <!-- Dashboard -->
      <div class="dashboard active" id="dashboard"></div>

      <!-- Content View -->
      <div class="content-view" id="contentView">
        <!-- Unified Toolbar (merged: layout + paper type + actions) -->
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="tb-group">
              <span class="tb-label">类型</span>
              <button class="type-chip active" data-type="mathmodel" onclick="PaperDeep.State.set('paperType','mathmodel')">数学建模</button>
              <button class="type-chip" data-type="thesis" onclick="PaperDeep.State.set('paperType','thesis')">毕业论文</button>
              <button class="type-chip" data-type="journal" onclick="PaperDeep.State.set('paperType','journal')">期刊论文</button>
            </div>
            <div class="tb-divider"></div>
            <div class="tb-group">
              <div class="layout-toggle">
                <button class="layout-btn active" data-layout="single" onclick="PaperDeep.State.set('layout','single')">单屏</button>
                <button class="layout-btn" data-layout="split" onclick="PaperDeep.State.set('layout','split')">分屏</button>
              </div>
              <div class="view-mode" style="display:none">
                <span style="font-size:0.72rem;color:var(--muted)">拖拽</span>
                <div class="mode-switch drag-enabled" id="dragSwitch" onclick="PaperDeep.State.set('dragEnabled',!PaperDeep.State.dragEnabled)">
                  <div class="mode-switch-knob"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="toolbar-right">
            <button class="btn btn-sm sec" onclick="PaperDeep.Layout.swapPanels()">🔄 交换</button>
            <button class="btn btn-sm sec" onclick="PaperDeep.Layout.refreshPreview()">🔄 刷新</button>
            <button class="btn btn-sm" style="background:linear-gradient(135deg,var(--accent),var(--accent4));color:#fff" onclick="PaperDeep.State.set('demoRunning',true);setTimeout(()=>PaperDeep.State.set('demoRunning',false),3000)">▶ 演示</button>
            <button class="btn btn-sm sec" onclick="PaperDeep.Tour.start()">🚶 导览</button>
          </div>
        </div>

        <!-- Content Container -->
        <div class="content-container">
          <!-- Single Panel -->
          <div id="singlePanel">
            <!-- Section Header -->
            <div class="section-header" id="sectionHeader">
              <h2><span class="sh-icon math">🧮</span>建模引擎</h2>
              <p>数学建模全流程：赛题拆解 → 模型构建 → 论文生成</p>
            </div>

            <!-- Modules Grid -->
            <div class="modules-drag-grid" id="modulesGrid"></div>

            <!-- Workspace -->
            <div class="workspace" id="workspace">
              <div class="workspace-tabs" id="workspaceTabs"></div>
              <div class="workspace-header">
                <div class="ws-title" id="workspaceTitle">
                  <span class="ws-dot"></span>工作区
                </div>
                <div style="display:flex;gap:6px">
                  <button class="btn btn-xs sec" onclick="PaperDeep.Workspace.save()">💾 保存</button>
                  <button class="btn btn-xs sec" onclick="PaperDeep.Workspace.export()">📤 导出</button>
                </div>
              </div>
              <div class="workspace-body" id="workspaceBody">
                <div class="ws-empty">
                  <div style="font-size:2rem;margin-bottom:10px">👋</div>
                  <div style="font-weight:700;margin-bottom:6px">欢迎使用 PaperDeep</div>
                  <div style="font-size:0.8rem">点击上方模块开始工作，或按 <span class="shortcut-key">Ctrl</span>+<span class="shortcut-key">H</span> 查看快捷键</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Split Panel -->
          <div class="content-split" id="splitPanel">
            <div class="panel-split" id="leftPanel">
              <div class="panel-title">工作区 <span style="font-size:0.68rem;color:var(--muted)">(编辑)</span></div>
              <div id="splitLeftContent">
                <div class="ws-empty">
                  <div style="font-size:1.5rem;margin-bottom:8px">📝</div>
                  <div style="font-size:0.76rem">左侧编辑区</div>
                </div>
              </div>
            </div>
            <div class="panel-split" id="rightPanel">
              <div class="panel-title">预览 <span style="font-size:0.68rem;color:var(--muted)">(只读)</span></div>
              <div id="splitRightContent">
                <div class="ws-empty">
                  <div style="font-size:1.5rem;margin-bottom:8px">👁️</div>
                  <div style="font-size:0.76rem">右侧预览区</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- App Entry -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
