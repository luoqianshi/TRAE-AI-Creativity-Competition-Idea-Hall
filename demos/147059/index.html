<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏网络诊断工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: #aaa;
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .stat-card .icon {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .stat-card .label {
            color: #aaa;
            font-size: 0.9rem;
        }

        .stat-card.good .value { color: #00ff88; }
        .stat-card.warning .value { color: #ffaa00; }
        .stat-card.bad .value { color: #ff4444; }

        .section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
            font-weight: 600;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .server-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }

        .server-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s;
        }

        .server-card:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .server-card.selected {
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.1);
        }

        .server-card .server-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .server-card .server-name {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .server-card .region {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .server-card .info {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .server-card .ping {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .server-card .status {
            font-size: 0.9rem;
            padding: 4px 12px;
            border-radius: 4px;
            display: inline-block;
        }

        .status.online { background: rgba(0, 255, 136, 0.2); color: #00ff88; }
        .status.offline { background: rgba(255, 68, 68, 0.2); color: #ff4444; }
        .status.error { background: rgba(255, 170, 0, 0.2); color: #ffaa00; }

        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 16px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border-radius: 4px;
            transition: width 0.3s;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .report-summary {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 210, 255, 0.1);
            border-radius: 12px;
            border-left: 4px solid #00d2ff;
        }

        .report-summary h3 {
            margin-bottom: 10px;
        }

        .report-summary ul {
            list-style: none;
            padding-left: 0;
        }

        .report-summary li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .report-summary li:last-child {
            border-bottom: none;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #00d2ff;
        }

        .timestamp {
            font-size: 0.85rem;
            color: #666;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 游戏网络诊断工具</h1>
            <p>测试你的网络连接质量，为游戏优化提供数据支持</p>
        </header>

        <div class="section">
            <div class="section-title">
                <span>📊</span> 带宽测试
            </div>
            <div class="stats-grid" id="bandwidthStats">
                <div class="stat-card">
                    <div class="icon">⬇️</div>
                    <div class="value">--</div>
                    <div class="label">下载速度 (Mbps)</div>
                </div>
                <div class="stat-card">
                    <div class="icon">⬆️</div>
                    <div class="value">--</div>
                    <div class="label">上传速度 (Mbps)</div>
                </div>
                <div class="stat-card">
                    <div class="icon">⏱️</div>
                    <div class="value">--</div>
                    <div class="label">延迟 (ms)</div>
                </div>
                <div class="stat-card">
                    <div class="icon">📍</div>
                    <div class="value" style="font-size: 1rem;">--</div>
                    <div class="label">测试节点</div>
                </div>
            </div>
            <div style="text-align: center;">
                <button class="btn" id="btnBandwidth" onclick="testBandwidth()">开始带宽测试</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">
                <span>🎯</span> 游戏服务器延迟测试
            </div>
            <div style="margin-bottom: 20px;">
                <button class="btn" id="btnTestAll" onclick="testAllServers()">测试所有服务器</button>
                <button class="btn-secondary" style="margin-left: 10px;" onclick="toggleSelectAll()">全选/取消</button>
            </div>
            <div class="server-list" id="serverList">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>加载服务器列表中...</p>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">
                <span>📝</span> 完整诊断报告
            </div>
            <div style="text-align: center;">
                <button class="btn" id="btnFullTest" onclick="runFullTest()">生成完整报告</button>
            </div>
            <div id="fullReport" style="display: none;">
                <div class="report-summary">
                    <h3>诊断结果汇总</h3>
                    <div id="reportContent"></div>
                    <div class="timestamp" id="reportTimestamp"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        let servers = [];
        let selectedServerIds = new Set();

        async function fetchServers() {
            try {
                const response = await fetch(`${API_BASE}/servers`);
                servers = await response.json();
                renderServerList();
            } catch (error) {
                console.error('Failed to fetch servers:', error);
                document.getElementById('serverList').innerHTML = 
                    '<p style="text-align: center; color: #ff4444;">加载服务器列表失败</p>';
            }
        }

        function renderServerList() {
            const container = document.getElementById('serverList');
            container.innerHTML = '';

            servers.forEach((server, index) => {
                const card = document.createElement('div');
                card.className = 'server-card';
                card.dataset.index = index;
                
                card.innerHTML = `
                    <div class="server-header">
                        <div>
                            <div class="server-name">${server.name}</div>
                            <div style="font-size: 0.85rem; color: #888;">${server.game}</div>
                        </div>
                        <div class="region">${server.region}</div>
                    </div>
                    <div class="info">
                        <span>📍 ${server.address}:${server.port}</span>
                    </div>
                    <div class="checkbox-label">
                        <input type="checkbox" ${selectedServerIds.has(index) ? 'checked' : ''} 
                               onchange="toggleServerSelection(${index})">
                        <span>选择测试</span>
                    </div>
                    <div class="ping" id="ping-${index}">--</div>
                    <div class="status" id="status-${index}">未测试</div>
                `;
                
                card.addEventListener('click', () => {
                    const checkbox = card.querySelector('input[type="checkbox"]');
                    checkbox.checked = !checkbox.checked;
                    toggleServerSelection(index);
                });
                
                container.appendChild(card);
            });
        }

        function toggleServerSelection(index) {
            if (selectedServerIds.has(index)) {
                selectedServerIds.delete(index);
            } else {
                selectedServerIds.add(index);
            }
            updateServerCardSelection();
        }

        function toggleSelectAll() {
            if (selectedServerIds.size === servers.length) {
                selectedServerIds.clear();
            } else {
                servers.forEach((_, index) => selectedServerIds.add(index));
            }
            updateServerCardSelection();
            document.querySelectorAll('.server-card input[type="checkbox"]').forEach((cb, i) => {
                cb.checked = selectedServerIds.has(i);
            });
        }

        function updateServerCardSelection() {
            document.querySelectorAll('.server-card').forEach((card, index) => {
                if (selectedServerIds.has(index)) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            });
        }

        async function testBandwidth() {
            const btn = document.getElementById('btnBandwidth');
            btn.disabled = true;
            btn.textContent = '测试中...';

            try {
                const response = await fetch(`${API_BASE}/bandwidth`);
                const result = await response.json();

                const stats = document.querySelectorAll('#bandwidthStats .stat-card');
                stats[0].querySelector('.value').textContent = result.download_mbps.toFixed(1);
                stats[1].querySelector('.value').textContent = result.upload_mbps.toFixed(1);
                stats[2].querySelector('.value').textContent = result.ping_ms;
                stats[3].querySelector('.value').textContent = result.location;

                setStatCardClass(stats[0], result.download_mbps, 100, 50);
                setStatCardClass(stats[1], result.upload_mbps, 50, 20);
                setStatCardClass(stats[2], result.ping_ms, 50, 100, true);
            } catch (error) {
                alert('带宽测试失败: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '开始带宽测试';
            }
        }

        function setStatCardClass(card, value, goodThreshold, warningThreshold, isLowerBetter = false) {
            card.classList.remove('good', 'warning', 'bad');
            if (isLowerBetter) {
                if (value <= goodThreshold) card.classList.add('good');
                else if (value <= warningThreshold) card.classList.add('warning');
                else card.classList.add('bad');
            } else {
                if (value >= goodThreshold) card.classList.add('good');
                else if (value >= warningThreshold) card.classList.add('warning');
                else card.classList.add('bad');
            }
        }

        async function testAllServers() {
            const btn = document.getElementById('btnTestAll');
            btn.disabled = true;
            btn.textContent = '测试中...';

            const promises = servers.map(async (server, index) => {
                try {
                    const response = await fetch(`${API_BASE}/test-server?address=${server.address}&port=${server.port}`);
                    const result = await response.json();
                    updateServerResult(index, result);
                } catch (error) {
                    updateServerResult(index, { status: 'error' });
                }
                await new Promise(resolve => setTimeout(resolve, 200));
            });

            await Promise.all(promises);
            
            btn.disabled = false;
            btn.textContent = '测试所有服务器';
        }

        function updateServerResult(index, result) {
            const pingEl = document.getElementById(`ping-${index}`);
            const statusEl = document.getElementById(`status-${index}`);

            if (result.status === 'error') {
                pingEl.textContent = '--';
                statusEl.textContent = '连接失败';
                statusEl.className = 'status error';
            } else {
                pingEl.textContent = `${result.latency_ms}ms`;
                statusEl.textContent = '在线';
                statusEl.className = 'status online';
                
                const card = document.querySelector(`.server-card[data-index="${index}"]`);
                if (result.latency_ms <= 50) pingEl.style.color = '#00ff88';
                else if (result.latency_ms <= 100) pingEl.style.color = '#ffaa00';
                else pingEl.style.color = '#ff4444';
            }
        }

        async function runFullTest() {
            const btn = document.getElementById('btnFullTest');
            btn.disabled = true;
            btn.textContent = '生成报告中...';

            const serverIds = Array.from(selectedServerIds);

            try {
                const response = await fetch(`${API_BASE}/full-test`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ server_ids: serverIds.length > 0 ? serverIds : null }),
                });

                const report = await response.json();
                renderFullReport(report);
            } catch (error) {
                alert('生成报告失败: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '生成完整报告';
            }
        }

        function renderFullReport(report) {
            const container = document.getElementById('fullReport');
            const content = document.getElementById('reportContent');
            const timestamp = document.getElementById('reportTimestamp');

            let html = `
                <p><strong>玩家IP:</strong> ${report.player_ip}</p>
                <p><strong>测试位置:</strong> ${report.player_location}</p>
                <p><strong>下载速度:</strong> ${report.bandwidth.download_mbps.toFixed(1)} Mbps</p>
                <p><strong>上传速度:</strong> ${report.bandwidth.upload_mbps.toFixed(1)} Mbps</p>
                <p><strong>平均延迟:</strong> ${report.bandwidth.ping_ms} ms</p>
                <br>
                <h4>服务器测试结果:</h4>
                <ul>
            `;

            report.server_results.forEach(server => {
                let statusColor = '#888';
                let statusText = '未知';
                
                if (server.status === 'online') {
                    if (server.latency_ms <= 50) {
                        statusColor = '#00ff88';
                        statusText = '流畅';
                    } else if (server.latency_ms <= 100) {
                        statusColor = '#ffaa00';
                        statusText = '一般';
                    } else {
                        statusColor = '#ff4444';
                        statusText = '卡顿';
                    }
                } else {
                    statusColor = '#ff4444';
                    statusText = '不可达';
                }

                html += `
                    <li>
                        <strong>${server.server_name}</strong> (${server.region})
                        <br>延迟: <span style="color: ${statusColor}; font-weight: bold;">${server.latency_ms || '--'}ms</span>
                        <span style="margin-left: 10px; color: ${statusColor};">${statusText}</span>
                        ${server.player_count > 0 ? `<br>在线人数: ${server.player_count}/${server.max_players}` : ''}
                        ${server.map_name ? `<br>地图: ${server.map_name}` : ''}
                    </li>
                `;
            });

            html += '</ul>';
            content.innerHTML = html;
            timestamp.textContent = `测试时间: ${new Date(report.timestamp).toLocaleString('zh-CN')}`;
            container.style.display = 'block';
        }

        window.addEventListener('load', () => {
            fetchServers();
        });
    </script>
</body>
</html>
