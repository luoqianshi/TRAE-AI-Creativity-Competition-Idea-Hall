<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensoryDraft - 情绪草稿本 | TRAE AI创造力大赛</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
            overflow: hidden;
            background: #1a1a2e;
        }
        
        /* 流体背景Canvas */
        #fluid-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }
        
        /* 粒子Canvas */
        #particle-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        
        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            width: 65%; height: 82%;
            margin: 4vh auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 35px 45px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* 头部 */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .logo-section {
            display: flex; align-items: center; gap: 12px;
        }
        
        .logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .header h2 {
            color: #fff; font-size: 22px; font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, #a8b2d1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .status-section {
            display: flex; align-items: center; gap: 12px;
        }
        
        .status-badge {
            padding: 8px 18px; border-radius: 20px;
            font-size: 13px; font-weight: 600;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; gap: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .status-indicator {
            width: 8px; height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }
        
        .typing-wave {
            display: flex; align-items: flex-end;
            gap: 2px; height: 20px;
        }
        
        .wave-bar {
            width: 3px; background: rgba(255,255,255,0.6);
            border-radius: 2px;
            transition: height 0.1s ease;
        }
        
        /* 编辑器 */
        .editor-wrapper {
            flex: 1; position: relative;
            margin: 10px 0;
        }
        
        textarea {
            width: 100%; height: 100%;
            background: transparent; border: none; outline: none;
            font-size: 17px; line-height: 1.9;
            color: #e2e8f0;
            resize: none;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        textarea::placeholder { 
            color: rgba(255, 255, 255, 0.25);
            font-style: italic;
        }
        
        /* 呼吸引导 */
        .breath-guide {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 20;
            pointer-events: none;
        }
        
        .breath-circle {
            width: 120px; height: 120px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex; align-items: center; justify-content: center;
            animation: breathe 4s ease-in-out infinite;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
        }
        
        .breath-circle-inner {
            width: 60px; height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            animation: breatheInner 4s ease-in-out infinite;
        }
        
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; }
        }
        
        @keyframes breatheInner {
            0%, 100% { transform: scale(0.8); }
            50% { transform: scale(1.2); }
        }
        
        .breath-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            letter-spacing: 2px;
            animation: breathText 4s ease-in-out infinite;
        }
        
        @keyframes breathText {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        /* 底部信息栏 */
        .footer-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 10px; padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .emotion-stats {
            display: flex; gap: 20px;
            font-size: 12px; color: rgba(255, 255, 255, 0.4);
        }
        
        .stat-item {
            display: flex; align-items: center; gap: 6px;
        }
        
        .stat-bar {
            width: 60px; height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .stat-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.5s ease;
        }
        
        .footer-note {
            font-size: 11px; color: rgba(255, 255, 255, 0.25);
        }
        
        /* 情绪历史 */
        .emotion-history {
            position: fixed;
            right: 20px; top: 50%;
            transform: translateY(-50%);
            width: 40px; height: 200px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-end;
            padding: 10px 0;
            gap: 2px;
        }
        
        .history-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            transition: all 0.3s;
        }
        
        /* 音频控制 */
        .audio-control {
            position: fixed;
            left: 20px; bottom: 20px;
            z-index: 10;
        }
        
        .audio-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
            font-size: 18px;
        }
        
        .audio-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        
        /* 大赛标识 */
        .contest-badge {
            position: fixed;
            top: 20px; left: 20px;
            z-index: 10;
            padding: 6px 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            border-radius: 20px;
            opacity: 0.8;
            pointer-events: none;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .container { width: 90%; height: 85%; padding: 25px; }
            .header { flex-direction: column; gap: 15px; align-items: flex-start; }
            .emotion-history { display: none; }
        }
    </style>
</head>
<body>
    <div class="contest-badge">TRAE AI创造力大赛 | 学习工作赛道</div>
    
    <canvas id="fluid-canvas"></canvas>
    <canvas id="particle-canvas"></canvas>
    
    <div class="container" id="mainContainer">
        <div class="header">
            <div class="logo-section">
                <div class="logo-icon">✨</div>
                <h2>SensoryDraft</h2>
            </div>
            <div class="status-section">
                <div class="typing-wave" id="typingWave"></div>
                <div class="status-badge" id="status">
                    <span class="status-indicator" id="statusIndicator"></span>
                    <span id="statusText">平静 - 请开始写作</span>
                </div>
            </div>
        </div>
        
        <div class="editor-wrapper">
            <textarea id="editor" placeholder="在此倾诉你的想法...&#10;&#10;感受屏幕随你情绪流动的色彩&#10;• 流畅打字 → 明亮心流&#10;• 停顿思考 → 柔和舒缓&#10;• 频繁删改 → 深呼吸引导&#10;&#10;让每一次敲击都成为治愈的开始..."></textarea>
            
            <div class="breath-guide" id="breathGuide">
                <div class="breath-circle">
                    <div class="breath-circle-inner"></div>
                </div>
                <div class="breath-text">深呼吸</div>
            </div>
        </div>
        
        <div class="footer-bar">
            <div class="emotion-stats">
                <div class="stat-item">
                    <span>心流</span>
                    <div class="stat-bar"><div class="stat-fill" id="flowBar" style="width: 0%; background: #48bb78;"></div></div>
                </div>
                <div class="stat-item">
                    <span>舒缓</span>
                    <div class="stat-bar"><div class="stat-fill" id="calmBar" style="width: 0%; background: #4299e1;"></div></div>
                </div>
                <div class="stat-item">
                    <span>焦虑</span>
                    <div class="stat-bar"><div class="stat-fill" id="anxiousBar" style="width: 0%; background: #f56565;"></div></div>
                </div>
            </div>
            <div class="footer-note">基于 TRAE Work 生成 | 你的输入节奏改变这个世界的色彩</div>
        </div>
    </div>
    
    <div class="emotion-history" id="emotionHistory"></div>
    
    <div class="audio-control">
        <button class="audio-btn" id="audioBtn" onclick="toggleAudio()">🔇</button>
    </div>

    <script>
        // ============ 流体背景系统 ============
        const fluidCanvas = document.getElementById('fluid-canvas');
        const fluidCtx = fluidCanvas.getContext('2d');
        let width, height;
        
        function resizeFluid() {
            width = fluidCanvas.width = window.innerWidth;
            height = fluidCanvas.height = window.innerHeight;
        }
        resizeFluid();
        window.addEventListener('resize', resizeFluid);
        
        // 流体噪声
        class FluidNoise {
            constructor() {
                this.time = 0;
                this.particles = [];
                for (let i = 0; i < 15; i++) {
                    this.particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        size: 100 + Math.random() * 200,
                        hue: Math.random() * 60
                    });
                }
            }
            
            update(emotionState, intensity) {
                this.time += 0.005 + intensity * 0.01;
                
                const speed = emotionState === 'flow' ? 2 : emotionState === 'anxious' ? 3 : 0.5;
                this.particles.forEach(p => {
                    p.x += p.vx * speed;
                    p.y += p.vy * speed;
                    if (p.x < -p.size) p.x = width + p.size;
                    if (p.x > width + p.size) p.x = -p.size;
                    if (p.y < -p.size) p.y = height + p.size;
                    if (p.y > height + p.size) p.y = -p.size;
                });
            }
            
            draw(emotionState) {
                fluidCtx.fillStyle = '#1a1a2e';
                fluidCtx.fillRect(0, 0, width, height);
                
                const colors = {
                    flow: ['#48bb78', '#38b2ac', '#4299e1'],
                    calm: ['#667eea', '#764ba2', '#6b46c1'],
                    anxious: ['#f56565', '#ed8936', '#ecc94b']
                };
                
                const palette = colors[emotionState] || colors.calm;
                
                this.particles.forEach((p, i) => {
                    const gradient = fluidCtx.createRadialGradient(
                        p.x, p.y, 0,
                        p.x, p.y, p.size
                    );
                    const color = palette[i % palette.length];
                    gradient.addColorStop(0, color + '40');
                    gradient.addColorStop(0.5, color + '15');
                    gradient.addColorStop(1, 'transparent');
                    
                    fluidCtx.fillStyle = gradient;
                    fluidCtx.beginPath();
                    fluidCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    fluidCtx.fill();
                });
            }
        }
        
        // ============ 粒子系统 ============
        const particleCanvas = document.getElementById('particle-canvas');
        const particleCtx = particleCanvas.getContext('2d');
        
        function resizeParticle() {
            particleCanvas.width = window.innerWidth;
            particleCanvas.height = window.innerHeight;
        }
        resizeParticle();
        window.addEventListener('resize', resizeParticle);
        
        class ParticleSystem {
            constructor() {
                this.particles = [];
                this.maxParticles = 80;
            }
            
            emit(x, y, emotion) {
                const configs = {
                    flow: { color: '#48bb78', size: [2, 4], speed: [1, 3], life: [60, 120] },
                    calm: { color: '#667eea', size: [1, 3], speed: [0.5, 1.5], life: [100, 200] },
                    anxious: { color: '#f56565', size: [3, 6], speed: [2, 5], life: [30, 80] }
                };
                
                const config = configs[emotion] || configs.calm;
                
                for (let i = 0; i < 3; i++) {
                    if (this.particles.length >= this.maxParticles) this.particles.shift();
                    
                    const angle = Math.random() * Math.PI * 2;
                    const speed = config.speed[0] + Math.random() * (config.speed[1] - config.speed[0]);
                    
                    this.particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 1,
                        size: config.size[0] + Math.random() * (config.size[1] - config.size[0]),
                        color: config.color,
                        life: config.life[0] + Math.random() * (config.life[1] - config.life[0]),
                        maxLife: config.life[0] + Math.random() * (config.life[1] - config.life[0]),
                        opacity: 1
                    });
                }
            }
            
            update() {
                this.particles.forEach((p, i) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.05;
                    p.life--;
                    p.opacity = p.life / p.maxLife;
                    
                    if (p.life <= 0) this.particles.splice(i, 1);
                });
            }
            
            draw() {
                particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
                
                this.particles.forEach(p => {
                    particleCtx.save();
                    particleCtx.globalAlpha = p.opacity * 0.8;
                    particleCtx.fillStyle = p.color;
                    particleCtx.beginPath();
                    particleCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    particleCtx.fill();
                    particleCtx.restore();
                });
            }
        }
        
        // ============ 音频系统 ============
        let audioCtx = null;
        let oscillators = [];
        let gainNode = null;
        let isAudioOn = false;
        
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain();
            gainNode.connect(audioCtx.destination);
            gainNode.gain.value = 0;
            
            // 创建环境音层
            const freqs = [220, 330, 440];
            freqs.forEach(f => {
                const osc = audioCtx.createOscillator();
                const oscGain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = f;
                osc.connect(oscGain);
                oscGain.connect(gainNode);
                oscGain.gain.value = 0.05;
                osc.start();
                oscillators.push({ osc, gain: oscGain, baseFreq: f });
            });
        }
        
        function updateAudio(emotion, intensity) {
            if (!isAudioOn || !audioCtx) return;
            
            const configs = {
                flow: { freqMult: [1, 1.5, 2], gains: [0.08, 0.06, 0.04] },
                calm: { freqMult: [1, 1.25, 1.5], gains: [0.06, 0.04, 0.03] },
                anxious: { freqMult: [0.8, 1.2, 1.8], gains: [0.04, 0.08, 0.06] }
            };
            
            const config = configs[emotion] || configs.calm;
            
            oscillators.forEach((o, i) => {
                o.osc.frequency.setTargetAtTime(
                    o.baseFreq * config.freqMult[i],
                    audioCtx.currentTime, 0.5
                );
                o.gain.gain.setTargetAtTime(
                    config.gains[i] * (0.5 + intensity * 0.5),
                    audioCtx.currentTime, 0.5
                );
            });
            
            gainNode.gain.setTargetAtTime(0.3, audioCtx.currentTime, 0.5);
        }
        
        function toggleAudio() {
            const btn = document.getElementById('audioBtn');
            if (!isAudioOn) {
                initAudio();
                isAudioOn = true;
                btn.textContent = '🔊';
                if (gainNode) gainNode.gain.setTargetAtTime(0.3, audioCtx.currentTime, 1);
            } else {
                isAudioOn = false;
                btn.textContent = '🔇';
                if (gainNode) gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
            }
        }
        
        // ============ 打字波形 ============
        const waveContainer = document.getElementById('typingWave');
        const waveBars = [];
        const barCount = 12;
        
        for (let i = 0; i < barCount; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-bar';
            bar.style.height = '4px';
            waveContainer.appendChild(bar);
            waveBars.push(bar);
        }
        
        function updateWave(intensity) {
            waveBars.forEach((bar, i) => {
                const h = 4 + Math.sin(Date.now() * 0.005 + i * 0.5) * intensity * 16;
                bar.style.height = Math.max(4, h) + 'px';
            });
        }
        
        // ============ 情绪历史 ============
        const historyContainer = document.getElementById('emotionHistory');
        const emotionHistory = [];
        const maxHistory = 20;
        
        function addEmotionToHistory(emotion) {
            const colors = { flow: '#48bb78', calm: '#667eea', anxious: '#f56565' };
            emotionHistory.push(emotion);
            if (emotionHistory.length > maxHistory) emotionHistory.shift();
            
            historyContainer.innerHTML = '';
            emotionHistory.forEach(e => {
                const dot = document.createElement('div');
                dot.className = 'history-dot';
                dot.style.background = colors[e] || colors.calm;
                historyContainer.appendChild(dot);
            });
        }
        
        // ============ 情绪统计 ============
        const stats = { flow: 0, calm: 0, anxious: 0 };
        const total = { flow: 0, calm: 0, anxious: 0 };
        
        function updateStats(emotion) {
            total[emotion]++;
            const sum = total.flow + total.calm + total.anxious;
            if (sum === 0) return;
            
            document.getElementById('flowBar').style.width = (total.flow / sum * 100) + '%';
            document.getElementById('calmBar').style.width = (total.calm / sum * 100) + '%';
            document.getElementById('anxiousBar').style.width = (total.anxious / sum * 100) + '%';
        }
        
        // ============ 情绪检测逻辑 ============
        const editor = document.getElementById('editor');
        const statusBadge = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const statusIndicator = document.getElementById('statusIndicator');
        const breathGuide = document.getElementById('breathGuide');
        const mainContainer = document.getElementById('mainContainer');
        
        let typingTimer;
        let deleteCount = 0;
        let lastLength = 0;
        let currentEmotion = 'calm';
        let emotionIntensity = 0;
        let lastTypeTime = 0;
        let typeSpeedHistory = [];
        
        const fluidNoise = new FluidNoise();
        const particleSystem = new ParticleSystem();
        
        function setEmotion(emotion, intensity) {
            if (currentEmotion === emotion && Math.abs(emotionIntensity - intensity) < 0.1) return;
            
            currentEmotion = emotion;
            emotionIntensity = intensity;
            
            const configs = {
                flow: {
                    text: '心流如泉 ✦',
                    color: '#48bb78',
                    bg: 'rgba(72, 187, 120, 0.15)',
                    border: 'rgba(72, 187, 120, 0.3)',
                    indicator: '#48bb78'
                },
                calm: {
                    text: '沉思舒缓 ○',
                    color: '#667eea',
                    bg: 'rgba(102, 126, 234, 0.15)',
                    border: 'rgba(102, 126, 234, 0.3)',
                    indicator: '#667eea'
                },
                anxious: {
                    text: '深呼吸，慢慢来...',
                    color: '#f56565',
                    bg: 'rgba(245, 101, 101, 0.15)',
                    border: 'rgba(245, 101, 101, 0.3)',
                    indicator: '#f56565'
                }
            };
            
            const config = configs[emotion];
            statusText.textContent = config.text;
            statusBadge.style.background = config.bg;
            statusBadge.style.borderColor = config.border;
            statusBadge.style.color = config.color;
            statusIndicator.style.background = config.indicator;
            
            mainContainer.style.borderColor = config.border;
            
            // 呼吸引导
            breathGuide.style.display = emotion === 'anxious' ? 'flex' : 'none';
            
            addEmotionToHistory(emotion);
            updateStats(emotion);
            updateAudio(emotion, intensity);
        }
        
        editor.addEventListener('input', (e) => {
            const now = Date.now();
            const currentLength = editor.value.length;
            
            // 计算打字速度
            if (lastTypeTime > 0) {
                const delta = now - lastTypeTime;
                typeSpeedHistory.push(1000 / delta);
                if (typeSpeedHistory.length > 10) typeSpeedHistory.shift();
            }
            lastTypeTime = now;
            
            // 平均打字速度
            const avgSpeed = typeSpeedHistory.length > 0 
                ? typeSpeedHistory.reduce((a, b) => a + b, 0) / typeSpeedHistory.length 
                : 0;
            
            clearTimeout(typingTimer);
            
            // 检测退格焦虑
            if (currentLength < lastLength) {
                deleteCount++;
                if (deleteCount > 2) {
                    setEmotion('anxious', Math.min(deleteCount / 8, 1));
                    // 在光标位置发射焦虑粒子
                    const rect = editor.getBoundingClientRect();
                    particleSystem.emit(
                        rect.left + rect.width / 2,
                        rect.top + rect.height / 2,
                        'anxious'
                    );
                }
            } else {
                deleteCount = Math.max(0, deleteCount - 1);
                
                // 根据打字速度判断状态
                if (avgSpeed > 5) {
                    setEmotion('flow', Math.min(avgSpeed / 10, 1));
                    // 发射心流粒子
                    const rect = editor.getBoundingClientRect();
                    particleSystem.emit(
                        rect.left + Math.random() * rect.width,
                        rect.top + rect.height - 20,
                        'flow'
                    );
                } else {
                    setEmotion('calm', 0.5);
                }
            }
            
            lastLength = currentLength;
            
            // 停顿检测
            typingTimer = setTimeout(() => {
                deleteCount = Math.max(0, deleteCount - 2);
                typeSpeedHistory = [];
                setEmotion('calm', 0.3);
            }, 2500);
        });
        
        // ============ 动画循环 ============
        function animate() {
            fluidNoise.update(currentEmotion, emotionIntensity);
            fluidNoise.draw(currentEmotion);
            
            particleSystem.update();
            particleSystem.draw();
            
            updateWave(emotionIntensity);
            
            requestAnimationFrame(animate);
        }
        
        animate();
        
        // 初始化
        setEmotion('calm', 0);
    </script>
</body>
</html>
