<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食养助手 - 健康饮食筛查与计划</title>
  <style>
    :root {
      --bg-primary: #0f0f1a;
      --bg-card: #1a1a2e;
      --bg-hover: #252542;
      --accent: #e94560;
      --accent-light: #ff6b81;
      --text-primary: #f0f0f5;
      --text-secondary: #8b8ba7;
      --border: #2a2a45;
      --green: #34d399;
      --green-bg: #34d39920;
      --yellow: #fbbf24;
      --yellow-bg: #fbbf2420;
      --red: #ef4444;
      --red-bg: #ef444420;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .app { max-width: 1200px; margin: 0 auto; padding: 20px; }

    /* 导航 */
    .nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 24px; background: var(--bg-card);
      border-radius: var(--radius); margin-bottom: 24px; box-shadow: var(--shadow);
      flex-wrap: wrap; gap: 12px;
    }

    .logo { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

    .nav-tabs {
      display: flex; gap: 4px; background: var(--bg-hover); padding: 4px;
      border-radius: 12px;
    }

    .nav-tab {
      background: transparent; border: none; color: var(--text-secondary);
      padding: 8px 20px; border-radius: 10px; cursor: pointer; font-size: 0.9rem;
      font-weight: 500; transition: all 0.2s;
    }

    .nav-tab:hover { color: var(--text-primary); }

    .nav-tab.active { background: var(--accent); color: white; }

    .search-box {
      position: relative; flex: 1; max-width: 300px;
    }

    .search-box input {
      width: 100%; background: var(--bg-hover); border: 2px solid var(--border);
      color: var(--text-primary); padding: 10px 16px 10px 40px;
      border-radius: 12px; font-size: 0.95rem; outline: none;
    }

    .search-box input:focus { border-color: var(--accent); }

    .search-box::before {
      content: '\1F50D'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      font-size: 1rem; opacity: 0.6;
    }

    /* 视图 */
    .view { display: none; }
    .view.active { display: block; }

    /* 模式选择 */
    .mode-section { margin-bottom: 24px; }

    .section-title {
      font-size: 1rem; color: var(--text-secondary); margin-bottom: 12px;
    }

    .mode-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    }

    .mode-card {
      background: var(--bg-card); border: 2px solid var(--border);
      border-radius: var(--radius); padding: 20px; text-align: center;
      cursor: pointer; transition: all 0.3s;
    }

    .mode-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .mode-card.active {
      border-color: var(--accent); background: var(--bg-hover);
      box-shadow: 0 0 20px rgba(233, 69, 96, 0.2);
    }

    .mode-icon { font-size: 2rem; margin-bottom: 8px; }

    .mode-name { font-weight: 600; margin-bottom: 4px; }

    .mode-desc { font-size: 0.8rem; color: var(--text-secondary); }

    /* 排序选择 */
    .sort-bar {
      display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;
    }

    .sort-bar .label { color: var(--text-secondary); font-size: 0.9rem; margin-right: 8px; }

    .sort-btn {
      background: var(--bg-card); border: 2px solid var(--border);
      color: var(--text-primary); padding: 8px 16px; border-radius: 10px;
      cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
    }

    .sort-btn:hover { border-color: var(--accent); }

    .sort-btn.active {
      background: var(--accent); border-color: var(--accent); color: white;
    }

    .result-info {
      color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 16px;
    }

    .result-info span { color: var(--accent); font-weight: 600; }

    /* 食物列表 */
    .food-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .food-card {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 20px; transition: all 0.3s; border: 2px solid transparent;
      cursor: pointer;
    }

    .food-card:hover { border-color: var(--border); transform: translateY(-2px); }

    .food-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 12px;
    }

    .food-name { font-size: 1.1rem; font-weight: 600; }

    .food-category {
      font-size: 0.75rem; background: var(--bg-hover); color: var(--text-secondary);
      padding: 4px 10px; border-radius: 20px;
    }

    .food-badge {
      display: inline-block; font-size: 0.75rem; padding: 4px 10px;
      border-radius: 20px; margin-top: 8px; font-weight: 500;
    }

    .badge-recommend { background: var(--green-bg); color: var(--green); }
    .badge-moderate { background: var(--yellow-bg); color: var(--yellow); }
    .badge-avoid { background: var(--red-bg); color: var(--red); }

    .nutrient-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }

    .nutrient-row {
      display: grid; grid-template-columns: 60px 1fr 50px; align-items: center; gap: 8px;
    }

    .nutrient-label { font-size: 0.8rem; color: var(--text-secondary); }

    .nutrient-bar-bg {
      height: 8px; background: var(--bg-hover); border-radius: 4px; overflow: hidden;
    }

    .nutrient-bar {
      height: 100%; border-radius: 4px; transition: width 0.5s ease;
    }

    .nutrient-value { font-size: 0.8rem; text-align: right; font-weight: 500; }

    .color-green { color: var(--green); }
    .color-yellow { color: var(--yellow); }
    .color-red { color: var(--red); }
    .bg-green { background: var(--green); }
    .bg-yellow { background: var(--yellow); }
    .bg-red { background: var(--red); }

    /* ===== 饮食计划 ===== */
    .plan-layout {
      display: grid; grid-template-columns: 280px 1fr;
      gap: 20px; margin-top: 20px;
    }

    .food-panel {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 20px; box-shadow: var(--shadow); max-height: calc(100vh - 200px);
      overflow-y: auto;
    }

    .food-panel h3 {
      font-size: 1rem; margin-bottom: 12px; color: var(--text-primary);
    }

    .food-panel .hint {
      font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px;
    }

    .food-panel-list {
      display: flex; flex-direction: column; gap: 8px;
    }

    .panel-food-item {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg-hover); padding: 10px 14px; border-radius: 10px;
      cursor: pointer; transition: all 0.2s; border: 2px solid transparent;
    }

    .panel-food-item:hover {
      border-color: var(--accent); background: var(--border);
    }

    .panel-food-name { font-size: 0.9rem; font-weight: 500; }

    .panel-food-cal { font-size: 0.8rem; color: var(--text-secondary); }

    .panel-food-actions {
      display: flex; gap: 4px; align-items: center;
    }

    .meal-add-btn {
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-secondary); padding: 4px 10px; border-radius: 6px;
      font-size: 0.75rem; cursor: pointer; transition: all 0.2s; font-weight: 500;
    }

    .meal-add-btn:hover {
      background: var(--accent); border-color: var(--accent); color: white;
    }

    .plan-table-wrapper {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 20px; box-shadow: var(--shadow); overflow-x: auto;
    }

    .plan-day-tabs {
      display: flex; gap: 4px; margin-bottom: 16px;
    }

    .day-tab {
      background: var(--bg-hover); border: none; color: var(--text-secondary);
      padding: 10px 16px; border-radius: 10px; cursor: pointer;
      font-size: 0.9rem; font-weight: 500; transition: all 0.2s; white-space: nowrap;
    }

    .day-tab:hover { color: var(--text-primary); }

    .day-tab.active { background: var(--accent); color: white; }

    .meal-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    }

    .meal-card {
      background: var(--bg-hover); border-radius: 12px; padding: 16px;
      min-height: 180px; border: 2px solid transparent; transition: all 0.2s;
    }

    .meal-card.highlight { border-color: var(--accent); }

    .meal-title {
      font-size: 0.95rem; font-weight: 600; margin-bottom: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .meal-cal { font-size: 0.8rem; color: var(--text-secondary); font-weight: 400; }

    .meal-items {
      display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px;
    }

    .meal-item-tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--bg-card); color: var(--text-primary);
      padding: 4px 10px; border-radius: 20px; font-size: 0.8rem;
      border: 1px solid var(--border);
    }

    .meal-item-tag .remove {
      cursor: pointer; color: var(--text-secondary); font-size: 1rem; line-height: 1;
    }

    .meal-item-tag .remove:hover { color: var(--red); }

    .meal-empty {
      font-size: 0.8rem; color: var(--text-secondary); padding: 8px 0;
    }

    .day-summary {
      margin-top: 20px; padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .day-summary h4 {
      font-size: 0.95rem; margin-bottom: 12px; color: var(--accent);
    }

    .summary-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
    }

    .summary-item {
      background: var(--bg-hover); padding: 14px; border-radius: 10px; text-align: center;
    }

    .summary-label { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 4px; }

    .summary-value { font-size: 1.3rem; font-weight: 700; }

    .summary-unit { font-size: 0.75rem; color: var(--text-secondary); }

    /* 弹窗 */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7); z-index: 100;
      justify-content: center; align-items: center; padding: 20px;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: var(--bg-card); border-radius: var(--radius); padding: 32px;
      max-width: 500px; width: 100%; position: relative; box-shadow: var(--shadow);
    }

    .modal-close {
      position: absolute; top: 16px; right: 20px; background: none; border: none;
      color: var(--text-secondary); font-size: 1.5rem; cursor: pointer;
    }

    .modal h3 { margin-bottom: 16px; color: var(--accent); }

    .modal p { color: var(--text-secondary); line-height: 1.7; margin-bottom: 8px; }

    .modal .tip-list { margin-top: 12px; }

    .modal .tip-list li {
      color: var(--text-secondary); margin-bottom: 8px; margin-left: 20px; line-height: 1.6;
    }

    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--text-secondary);
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }

    /* 响应式 */
    @media (max-width: 768px) {
      .mode-grid { grid-template-columns: repeat(2, 1fr); }
      .food-grid { grid-template-columns: 1fr; }
      .nav { flex-direction: column; }
      .search-box { max-width: 100%; width: 100%; }
      .plan-layout { grid-template-columns: 1fr; }
      .meal-grid { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 导航 -->
    <nav class="nav">
      <div class="logo">&#129367; 食养助手</div>
      <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchView('query')">&#128269; 食物查询</button>
        <button class="nav-tab" onclick="switchView('plan')">&#128197; 饮食计划</button>
      </div>
      <div class="search-box" id="navSearchBox">
        <input type="text" id="searchInput" placeholder="搜索食物..." oninput="renderFoods()">
      </div>
    </nav>

    <!-- ===== 食物查询视图 ===== -->
    <div class="view active" id="viewQuery">
      <div class="mode-section">
        <div class="section-title">选择饮食关注模式</div>
        <div class="mode-grid">
          <div class="mode-card" data-mode="diabetes" onclick="selectMode('diabetes')">
            <div class="mode-icon">&#129656;</div>
            <div class="mode-name">糖尿病饮食</div>
            <div class="mode-desc">关注含糖量</div>
          </div>
          <div class="mode-card" data-mode="gout" onclick="selectMode('gout')">
            <div class="mode-icon">&#129516;</div>
            <div class="mode-name">痛风饮食</div>
            <div class="mode-desc">关注嘌呤含量</div>
          </div>
          <div class="mode-card" data-mode="hypertension" onclick="selectMode('hypertension')">
            <div class="mode-icon">&#128147;</div>
            <div class="mode-name">高血压饮食</div>
            <div class="mode-desc">关注钠钾含量</div>
          </div>
          <div class="mode-card" data-mode="weightloss" onclick="selectMode('weightloss')">
            <div class="mode-icon">&#9878;&#65039;</div>
            <div class="mode-name">减脂饮食</div>
            <div class="mode-desc">关注热量</div>
          </div>
        </div>
      </div>

      <div class="sort-bar">
        <span class="label">排序方式：</span>
        <button class="sort-btn active" data-sort="default" onclick="selectSort('default')">默认</button>
        <button class="sort-btn" data-sort="sugar" onclick="selectSort('sugar')">含糖量 &#8595;</button>
        <button class="sort-btn" data-sort="purine" onclick="selectSort('purine')">嘌呤 &#8595;</button>
        <button class="sort-btn" data-sort="sodium" onclick="selectSort('sodium')">钠含量 &#8595;</button>
        <button class="sort-btn" data-sort="potassium" onclick="selectSort('potassium')">钾含量 &#8595;</button>
        <button class="sort-btn" data-sort="calories" onclick="selectSort('calories')">热量 &#8595;</button>
      </div>

      <div class="result-info">共找到 <span id="resultCount">0</span> 种食物</div>

      <div class="food-grid" id="foodGrid"></div>
    </div>

    <!-- ===== 饮食计划视图 ===== -->
    <div class="view" id="viewPlan">
      <div class="plan-layout">
        <!-- 左侧食物面板 -->
        <div class="food-panel">
          <h3>&#129367; 选择食物</h3>
          <div class="hint">点击食物添加到当前选中的餐次</div>
          <div class="search-box" style="margin-bottom: 12px; max-width: 100%;">
            <input type="text" id="planSearchInput" placeholder="搜索食物..." oninput="renderPlanFoodList()">
          </div>
          <div class="food-panel-list" id="planFoodList"></div>
        </div>

        <!-- 右侧计划表 -->
        <div class="plan-table-wrapper">
          <div class="plan-day-tabs" id="dayTabs"></div>

          <div class="meal-grid" id="mealGrid"></div>

          <div class="day-summary" id="daySummary"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 详情弹窗 -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&#215;</button>
      <h3 id="modalTitle">食物详情</h3>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- 份量输入弹窗 -->
  <div class="modal" id="gramsModal">
    <div class="modal-content" style="max-width: 360px;">
      <button class="modal-close" onclick="closeGramsModal()">&#215;</button>
      <h3 id="gramsModalTitle">添加食物</h3>
      <div style="margin: 20px 0;">
        <p style="color: var(--text-secondary); margin-bottom: 12px; font-size: 0.9rem;">请输入食用份量（克）</p>
        <input type="number" id="gramsInput" value="100" min="1" max="2000"
          style="width: 100%; background: var(--bg-hover); border: 2px solid var(--border); color: var(--text-primary);
                 padding: 14px 16px; border-radius: 12px; font-size: 1.1rem; text-align: center; outline: none;">
        <p style="color: var(--text-secondary); margin-top: 8px; font-size: 0.8rem; text-align: center;">每100g的营养成分 × 实际份量</p>
      </div>
      <button onclick="confirmAddFood()"
        style="width: 100%; background: var(--accent); color: white; border: none; padding: 14px;
               border-radius: 12px; cursor: pointer; font-size: 1rem; font-weight: 600;">确认添加</button>
    </div>
  </div>

      { name: '猪肝', category: '肉类', sugar: 5.0, purine: 275, sodium: 80, potassium: 235, calories: 134 },
      { name: '带鱼', category: '肉类', sugar: 0, purine: 290, sodium: 112, potassium: 280, calories: 127 },
      { name: '鱿鱼', category: '肉类', sugar: 0, purine: 260, sodium: 280, potassium: 300, calories: 92 },
      { name: '螃蟹', category: '肉类', sugar: 0.5, purine: 180, sodium: 260, potassium: 230, calories: 97 },
      { name: '鸭肉', category: '肉类', sugar: 0, purine: 130, sodium: 60, potassium: 210, calories: 190 },

      { name: '豆腐', category: '豆制品', sugar: 0.5, purine: 55, sodium: 7, potassium: 125, calories: 76 },
      { name: '豆浆', category: '豆制品', sugar: 0.7, purine: 27, sodium: 3, potassium: 48, calories: 16 },
      { name: '黄豆', category: '豆制品', sugar: 2.6, purine: 190, sodium: 2, potassium: 1797, calories: 359 },
      { name: '腐竹', category: '豆制品', sugar: 2.0, purine: 160, sodium: 15, potassium: 450, calories: 460 },
      { name: '豆腐干', category: '豆制品', sugar: 0.8, purine: 65, sodium: 230, potassium: 140, calories: 140 },

      { name: '牛奶', category: '饮品', sugar: 4.8, purine: 2, sodium: 50, potassium: 132, calories: 54 },
      { name: '酸奶', category: '饮品', sugar: 4.7, purine: 2, sodium: 70, potassium: 156, calories: 70 },
      { name: '绿茶', category: '饮品', sugar: 0, purine: 3, sodium: 3, potassium: 27, calories: 1 },
      { name: '咖啡', category: '饮品', sugar: 0, purine: 2, sodium: 2, potassium: 49, calories: 2 },
      { name: '可乐', category: '饮品', sugar: 10.6, purine: 0, sodium: 4, potassium: 1, calories: 42 },
      { name: '啤酒', category: '饮品', sugar: 0, purine: 15, sodium: 4, potassium: 40, calories: 43 },

      { name: '核桃', category: '坚果', sugar: 2.6, purine: 40, sodium: 2, potassium: 441, calories: 654 },
      { name: '花生', category: '坚果', sugar: 4.7, purine: 79, sodium: 6, potassium: 705, calories: 567 },
      { name: '蜂蜜', category: '其他', sugar: 82.4, purine: 2, sodium: 4, potassium: 52, calories: 304 },
      { name: '巧克力', category: '其他', sugar: 51.5, purine: 8, sodium: 24, potassium: 372, calories: 546 },
      { name: '蛋糕', category: '其他', sugar: 36.0, purine: 5, sodium: 200, potassium: 80, calories: 350 },
      { name: '薯片', category: '其他', sugar: 0.3, purine: 20, sodium: 530, potassium: 1200, calories: 536 },
      { name: '咸菜', category: '其他', sugar: 1.5, purine: 8, sodium: 4200, potassium: 200, calories: 25 },
    ];

    const thresholds = {
      sugar: { low: 5, mid: 15, max: 30 },
      purine: { low: 50, mid: 150, max: 300 },
      sodium: { low: 120, mid: 400, max: 1000 },
      potassium: { low: 100, mid: 400, max: 1000 },
      calories: { low: 100, mid: 300, max: 500 }
    };

    const modeConfig = {
      diabetes: {
        name: '糖尿病饮食', icon: '\u{1F489}', focus: 'sugar',
        tips: [
          '优先选择低糖食物（每100g含糖量<5g）',
          '避免高糖水果如榴莲、葡萄',
          '主食建议选择燕麦、红薯等粗粮',
          '蔬菜类大多数都适合，可放心食用'
        ]
      },
      gout: {
        name: '痛风饮食', icon: '\u{1F9B6}', focus: 'purine',
        tips: [
          '严格限制高嘌呤食物（每100g嘌呤>150mg）',
          '避免动物内脏、海鲜（带鱼、鱿鱼、螃蟹）',
          '豆制品适量食用，急性期减少',
          '多喝水，每日饮水2000ml以上'
        ]
      },
      hypertension: {
        name: '高血压饮食', icon: '\u{1F493}', focus: 'sodium',
        tips: [
          '控制钠摄入，每日食盐<5g',
          '避免咸菜、薯片、加工食品',
          '多吃高钾食物（香蕉、土豆、菠菜）帮助排钠',
          '选择低钠调味品，少用酱油'
        ]
      },
      weightloss: {
        name: '减脂饮食', icon: '\u{2696}\u{FE0F}', focus: 'calories',
        tips: [
          '选择低热量高饱腹感食物',
          '蔬菜类热量普遍很低，可多吃',
          '控制坚果、油脂摄入',
          '优先选择鸡胸肉、虾等低脂高蛋白食物'
        ]
      }
    };

    const STORAGE_KEY = 'diet-helper-data';
    const PLAN_KEY = 'diet-plan-data';
    const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    const meals = [
      { key: '早', label: '早餐' },
      { key: '中', label: '午餐' },
      { key: '晚', label: '晚餐' }
    ];

    let currentMode = null;
    let currentSort = 'default';
    let searchQuery = '';
    let currentView = 'query';
    let currentPlanDay = '周一';
    let planData = getPlanData();
    let pendingFood = null;
    let pendingMealKey = null;

    // ========== 工具函数 ==========
    function getBarColor(value, type) {
      const t = thresholds[type];
      if (value <= t.low) return 'bg-green';
      if (value <= t.mid) return 'bg-yellow';
      return 'bg-red';
    }

    function getTextColor(value, type) {
      const t = thresholds[type];
      if (value <= t.low) return 'color-green';
      if (value <= t.mid) return 'color-yellow';
      return 'color-red';
    }

    function getBarWidth(value, type) {
      const t = thresholds[type];
      const pct = (value / t.max) * 100;
      return Math.min(pct, 100);
    }

    function getDietBadge(food) {
      if (!currentMode) return null;
      const cfg = modeConfig[currentMode];
      const val = food[cfg.focus];
      const t = thresholds[cfg.focus];

      if (currentMode === 'hypertension') {
        if (food.sodium <= t.low && food.potassium >= 200) {
          return { text: '推荐', class: 'badge-recommend' };
        }
        if (food.sodium <= t.mid) return { text: '适量', class: 'badge-moderate' };
        return { text: '少吃', class: 'badge-avoid' };
      }
      if (val <= t.low) return { text: '推荐', class: 'badge-recommend' };
      if (val <= t.mid) return { text: '适量', class: 'badge-moderate' };
      return { text: '少吃', class: 'badge-avoid' };
    }

    function fuzzyMatch(text, query) {
      if (!query) return true;
      const t = text.toLowerCase();
      const q = query.toLowerCase();
      if (t.includes(q)) return true;
      const pinyinMap = {
        '米饭':'mf','馒头':'mt','面条':'mt','燕麦':'ym','红薯':'hs','玉米':'ym',
        '全麦面包':'qmmb','小米粥':'xmz','菠菜':'bc','西兰花':'xlh','西红柿':'xhs',
        '黄瓜':'hg','白菜':'bc','芹菜':'qc','茄子':'qz','南瓜':'ng','土豆':'td',
        '胡萝卜':'hlb','洋葱':'yc','蘑菇':'mg','豆芽':'dy','海带':'hd','紫菜':'zc',
        '苹果':'pg','香蕉':'xj','橙子':'cz','葡萄':'pt','西瓜':'xg','草莓':'cm',
        '猕猴桃':'mht','蓝莓':'lm','榴莲':'ll','芒果':'mg','梨':'l','柚子':'yz',
        '鸡胸肉':'jxr','牛肉':'nr','猪肉':'zr','羊肉':'yr','三文鱼':'swn','虾':'x',
        '鸡蛋':'jd','猪肝':'zg','带鱼':'dy','鱿鱼':'yy','螃蟹':'px','鸭肉':'yr',
        '豆腐':'df','豆浆':'dj','黄豆':'hd','腐竹':'fz','豆腐干':'dfg',
        '牛奶':'nn','酸奶':'sn','绿茶':'lc','咖啡':'kf','可乐':'kl','啤酒':'pj',
        '核桃':'ht','花生':'hs','蜂蜜':'fm','巧克力':'qkl','蛋糕':'dg','薯片':'sp','咸菜':'xc'
      };
      if (pinyinMap[text] && pinyinMap[text].includes(q)) return true;
      return false;
    }

    function getFoodByName(name) {
      return foods.find(f => f.name === name);
    }

    function getPlanData() {
      const raw = localStorage.getItem(PLAN_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        // 数据迁移：旧版字符串数组 → 新版对象数组
        days.forEach(d => {
          if (data[d]) {
            ['早', '中', '晚'].forEach(meal => {
              if (data[d][meal] && data[d][meal].length > 0 && typeof data[d][meal][0] === 'string') {
                data[d][meal] = data[d][meal].map(name => ({ name, grams: 100 }));
              }
            });
          }
        });
        return data;
      }
      const empty = {};
      days.forEach(d => {
        empty[d] = { '早': [], '中': [], '晚': [] };
      });
      return empty;
    }

    function savePlanData() {
      localStorage.setItem(PLAN_KEY, JSON.stringify(planData));
    }

    // ========== 视图切换 ==========
    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view' + view.charAt(0).toUpperCase() + view.slice(1)));
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.textContent.includes(view === 'query' ? '食物查询' : '饮食计划')));
      document.getElementById('navSearchBox').style.display = view === 'query' ? 'block' : 'none';
      if (view === 'plan') {
        renderPlanFoodList();
        renderDayTabs();
        renderMealGrid();
        renderDaySummary();
      }
    }

    // ========== 食物查询 ==========
    function getFilteredFoods() {
      let result = foods.filter(f => fuzzyMatch(f.name, searchQuery));
      if (currentSort !== 'default') {
        result.sort((a, b) => b[currentSort] - a[currentSort]);
      }
      return result;
    }

    function renderFoods() {
      searchQuery = document.getElementById('searchInput').value.trim();
      const list = getFilteredFoods();
      document.getElementById('resultCount').textContent = list.length;
      const grid = document.getElementById('foodGrid');
      if (list.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;"><div class="icon">&#128269;</div><div>没有找到匹配的食物</div></div>';
        return;
      }
      grid.innerHTML = list.map(food => {
        const badge = getDietBadge(food);
        const badgeHtml = badge ? `<span class="food-badge ${badge.class}">${badge.text}</span>` : '';
        const focusField = currentMode ? modeConfig[currentMode].focus : null;
        const nutrients = [
          { key: 'sugar', label: '糖', unit: 'g', value: food.sugar },
          { key: 'purine', label: '嘌呤', unit: 'mg', value: food.purine },
          { key: 'sodium', label: '钠', unit: 'mg', value: food.sodium },
          { key: 'potassium', label: '钾', unit: 'mg', value: food.potassium },
          { key: 'calories', label: '热量', unit: 'kcal', value: food.calories },
        ];
        const nutrientRows = nutrients.map(n => {
          const isFocus = focusField === n.key;
          const barWidth = getBarWidth(n.value, n.key);
          const barColor = getBarColor(n.value, n.key);
          const textColor = getTextColor(n.value, n.key);
          const focusStyle = isFocus ? 'font-weight: 600;' : '';
          const focusLabel = isFocus ? ` ${n.label}` : n.label;
          return `<div class="nutrient-row"><div class="nutrient-label" style="${focusStyle}">${focusLabel}</div><div class="nutrient-bar-bg"><div class="nutrient-bar ${barColor}" style="width: ${barWidth}%"></div></div><div class="nutrient-value ${textColor}" style="${focusStyle}">${n.value}${n.unit}</div></div>`;
        }).join('');
        return `<div class="food-card" onclick="showDetail('${food.name}')">
          <div class="food-header"><div><div class="food-name">${food.name}</div>${badgeHtml}</div><span class="food-category">${food.category}</span></div>
          <div class="nutrient-list">${nutrientRows}</div>
        </div>`;
      }).join('');
    }

    function selectMode(mode) {
      currentMode = currentMode === mode ? null : mode;
      document.querySelectorAll('.mode-card').forEach(card => {
        card.classList.toggle('active', card.dataset.mode === currentMode);
      });
      renderFoods();
    }

    function selectSort(sort) {
      currentSort = sort;
      document.querySelectorAll('.sort-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.sort === sort);
      });
      renderFoods();
    }

    function showDetail(name) {
      const food = getFoodByName(name);
      if (!food) return;
      document.getElementById('modalTitle').textContent = `${food.name} 营养详情`;
      const badge = getDietBadge(food);
      const badgeHtml = badge ? `<span class="food-badge ${badge.class}" style="margin-left: 8px;">${badge.text}</span>` : '';
      document.getElementById('modalBody').innerHTML = `
        <p style="font-size: 1.1rem; margin-bottom: 16px;">类别：<span style="color: var(--text-primary);">${food.category}</span>${badgeHtml}</p>
        <p>&#127852; 含糖量：<strong>${food.sugar}g</strong>/100g — ${food.sugar <= 5 ? '低糖 &#9989;' : food.sugar <= 15 ? '中糖 &#9888;&#65039;' : '高糖 &#10060;'}</p>
        <p>&#129460; 嘌呤含量：<strong>${food.purine}mg</strong>/100g — ${food.purine <= 50 ? '低嘌呤 &#9989;' : food.purine <= 150 ? '中嘌呤 &#9888;&#65039;' : '高嘌呤 &#10060;'}</p>
        <p>&#129474; 钠含量：<strong>${food.sodium}mg</strong>/100g — ${food.sodium <= 120 ? '低钠 &#9989;' : food.sodium <= 400 ? '中钠 &#9888;&#65039;' : '高钠 &#10060;'}</p>
        <p>&#127820; 钾含量：<strong>${food.potassium}mg</strong>/100g — ${food.potassium >= 400 ? '高钾 &#9989;' : food.potassium >= 100 ? '中钾' : '低钾'}</p>
        <p>&#128293; 热量：<strong>${food.calories}kcal</strong>/100g — ${food.calories <= 100 ? '低热量 &#9989;' : food.calories <= 300 ? '中热量 &#9888;&#65039;' : '高热量 &#10060;'}</p>
        ${currentMode ? `<hr style="border: none; border-top: 1px solid var(--border); margin: 16px 0;"><p style="color: var(--accent); font-weight: 600;">&#128161; 饮食建议</p><ul class="tip-list">${modeConfig[currentMode].tips.map(t => `<li>${t}</li>`).join('')}</ul>` : ''}`;
      document.getElementById('detailModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
    }

    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target.id === 'detailModal') closeModal();
    });

    // ========== 饮食计划 ==========
    function renderPlanFoodList() {
      const query = document.getElementById('planSearchInput').value.trim();
      const list = foods.filter(f => fuzzyMatch(f.name, query));
      const container = document.getElementById('planFoodList');
      if (list.length === 0) {
        container.innerHTML = '<div class="empty-state" style="padding: 20px;"><div>没有找到匹配的食物</div></div>';
        return;
      }
      container.innerHTML = list.map(food => {
        return `<div class="panel-food-item">
          <div><div class="panel-food-name">${food.name}</div><div class="panel-food-cal">${food.calories} kcal/100g · ${food.category}</div></div>
          <div class="panel-food-actions">
            <button class="meal-add-btn" onclick="openGramsModal('${food.name}', '早')">早</button>
            <button class="meal-add-btn" onclick="openGramsModal('${food.name}', '中')">中</button>
            <button class="meal-add-btn" onclick="openGramsModal('${food.name}', '晚')">晚</button>
          </div>
        </div>`;
      }).join('');
    }

    function renderDayTabs() {
      const container = document.getElementById('dayTabs');
      container.innerHTML = days.map(day => {
        return `<button class="day-tab ${day === currentPlanDay ? 'active' : ''}" onclick="selectPlanDay('${day}')">${day}</button>`;
      }).join('');
    }

    function selectPlanDay(day) {
      currentPlanDay = day;
      renderDayTabs();
      renderMealGrid();
      renderDaySummary();
    }

    function getNutrientByGrams(food, grams, nutrient) {
      return (food[nutrient] * grams / 100);
    }

    function renderMealGrid() {
      const container = document.getElementById('mealGrid');
      container.innerHTML = meals.map(meal => {
        const items = planData[currentPlanDay][meal.key];
        let mealCal = 0;
        items.forEach(item => {
          const f = getFoodByName(item.name);
          if (f) mealCal += getNutrientByGrams(f, item.grams, 'calories');
        });
        const itemsHtml = items.length > 0
          ? items.map((item, idx) => `<span class="meal-item-tag">${item.name} ${item.grams}g <span class="remove" onclick="event.stopPropagation(); removeFoodFromPlan('${meal.key}', ${idx})">&times;</span></span>`).join('')
          : '<div class="meal-empty">点击左侧食物，选择份量后添加</div>';
        return `<div class="meal-card">
          <div class="meal-title">${meal.label}<span class="meal-cal">${Math.round(mealCal)} kcal</span></div>
          <div class="meal-items">${itemsHtml}</div>
        </div>`;
      }).join('');
    }

    function openGramsModal(foodName, mealKey) {
      pendingFood = foodName;
      pendingMealKey = mealKey;
      document.getElementById('gramsModalTitle').textContent = `添加 ${foodName} 到${mealalLabel(mealKey)}`;
      document.getElementById('gramsInput').value = 100;
      document.getElementById('gramsModal').classList.add('active');
    }

    function mealalLabel(key) {
      return key === '早' ? '早餐' : key === '中' ? '午餐' : '晚餐';
    }

    function closeGramsModal() {
      document.getElementById('gramsModal').classList.remove('active');
      pendingFood = null;
      pendingMealKey = null;
    }

    function confirmAddFood() {
      const grams = parseInt(document.getElementById('gramsInput').value, 10);
      if (!grams || grams < 1) {
        alert('请输入有效的份量');
        return;
      }
      planData[currentPlanDay][pendingMealKey].push({ name: pendingFood, grams });
      savePlanData();
      closeGramsModal();
      renderMealGrid();
      renderDaySummary();
    }

    document.getElementById('gramsModal').addEventListener('click', (e) => {
      if (e.target.id === 'gramsModal') closeGramsModal();
    });

    function removeFoodFromPlan(mealKey, idx) {
      planData[currentPlanDay][mealKey].splice(idx, 1);
      savePlanData();
      renderMealGrid();
      renderDaySummary();
    }

    function renderDaySummary() {
      const container = document.getElementById('daySummary');
      const dayPlan = planData[currentPlanDay];
      let total = { calories: 0, sugar: 0, purine: 0, sodium: 0, potassium: 0 };
      Object.values(dayPlan).forEach(mealItems => {
        mealItems.forEach(item => {
          const f = getFoodByName(item.name);
          if (f) {
            total.calories += getNutrientByGrams(f, item.grams, 'calories');
            total.sugar += getNutrientByGrams(f, item.grams, 'sugar');
            total.purine += getNutrientByGrams(f, item.grams, 'purine');
            total.sodium += getNutrientByGrams(f, item.grams, 'sodium');
            total.potassium += getNutrientByGrams(f, item.grams, 'potassium');
          }
        });
      });

      const items = [
        { label: '总热量', value: Math.round(total.calories), unit: 'kcal', color: getSummaryColor(total.calories, 'calories') },
        { label: '总糖分', value: total.sugar.toFixed(1), unit: 'g', color: getSummaryColor(total.sugar, 'sugar') },
        { label: '总嘌呤', value: Math.round(total.purine), unit: 'mg', color: getSummaryColor(total.purine, 'purine') },
        { label: '总钠', value: Math.round(total.sodium), unit: 'mg', color: getSummaryColor(total.sodium, 'sodium') },
        { label: '总钾', value: Math.round(total.potassium), unit: 'mg', color: total.potassium >= 2000 ? 'color-green' : 'color-yellow' },
      ];

      container.innerHTML = `
        <h4>&#128200; ${currentPlanDay} 营养汇总</h4>
        <div class="summary-grid">
          ${items.map(item => `
            <div class="summary-item">
              <div class="summary-label">${item.label}</div>
              <div class="summary-value ${item.color}">${item.value}</div>
              <div class="summary-unit">${item.unit}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function getSummaryColor(value, type) {
      // 每日总量参考值
      const dailyLimits = {
        calories: { low: 1500, mid: 2200 },
        sugar: { low: 25, mid: 50 },
        purine: { low: 200, mid: 400 },
        sodium: { low: 1500, mid: 2300 }
      };
      const limit = dailyLimits[type];
      if (!limit) return '';
      if (value <= limit.low) return 'color-green';
      if (value <= limit.mid) return 'color-yellow';
      return 'color-red';
    }

    // ========== 初始化 ==========
    renderFoods();
  </script>
</body>
</html>
