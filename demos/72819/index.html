<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技能拼图 - Skill Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@3.0.3/tsparticles.bundle.min.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a3e;
            --bg-gradient-start: #0d1b2a;
            --bg-gradient-mid: #1b263b;
            --bg-gradient-end: #415a77;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --accent-blue: #00d4ff;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
            --skill-unlocked: linear-gradient(135deg, #00d4ff, #a855f7);
            --skill-locked: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text-primary);
        }

        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app-wrapper {
            position: relative;
            z-index: 1;
            padding: 24px;
            min-height: 100vh;
        }

        .app-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .app-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 40px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: 4px;
        }

        .app-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }

        .career-switch {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .switch-btn {
            padding: 10px 24px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            color: var(--text-secondary);
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .switch-btn.active {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-color: transparent;
            color: white;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .switch-btn:hover {
            background: var(--glass-hover);
            transform: translateY(-2px);
        }

        .switch-btn.active:hover {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .app-container {
            display: grid;
            grid-template-columns: 300px 1fr 360px;
            gap: 20px;
            max-width: 1800px;
            margin: 0 auto;
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 28px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            opacity: 0.5;
        }

        .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 2px;
        }

        .panel-title::before {
            content: '';
            width: 3px;
            height: 20px;
            background: linear-gradient(180deg, var(--accent-blue), var(--accent-purple));
            border-radius: 2px;
        }

        .skill-tree-wrapper {
            position: relative;
            width: 100%;
            height: calc(100vh - 280px);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .skill-tree-wrapper::-webkit-scrollbar {
            width: 4px;
        }

        .skill-tree-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .skill-tree-wrapper::-webkit-scrollbar-thumb {
            background: var(--accent-blue);
            border-radius: 2px;
        }

        .skill-tree-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .skill-tree-svg line {
            stroke: rgba(0, 212, 255, 0.2);
            stroke-width: 2;
            transition: stroke 0.3s ease;
        }

        .skill-tree-svg line.unlocked {
            stroke: rgba(0, 212, 255, 0.5);
        }

        .skill-nodes {
            position: relative;
            width: 100%;
            min-height: 500px;
            z-index: 2;
        }

        .skill-node {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            overflow: hidden;
        }

        .skill-node.unlocked {
            background: var(--skill-unlocked);
            box-shadow: 0 0 0 1px rgba(0, 212, 255, 0.3), 0 4px 20px rgba(0, 212, 255, 0.3);
        }

        .skill-node.locked {
            background: var(--skill-locked);
            box-shadow: none;
            filter: grayscale(100%);
        }

        .skill-node:hover {
            transform: scale(1.2);
            z-index: 10;
        }

        .skill-node.unlocked:hover {
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.5), 0 0 40px rgba(0, 212, 255, 0.5);
        }

        .skill-icon {
            font-size: 24px;
            margin-bottom: 4px;
            z-index: 2;
        }

        .skill-node.locked .skill-icon {
            opacity: 0.5;
        }

        .skill-name {
            font-size: 10px;
            font-weight: 600;
            color: white;
            text-align: center;
            z-index: 2;
            letter-spacing: 1px;
        }

        .skill-progress-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(0, 0, 0, 0.3);
        }

        .skill-progress-fill {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .skill-unlock-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #10b981;
            color: white;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulseGlow 2s infinite;
            z-index: 3;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
        }

        .todo-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .xp-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 16px;
            background: var(--glass-bg);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }

        .xp-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .xp-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .todo-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-right: 4px;
        }

        .todo-list::-webkit-scrollbar {
            width: 4px;
        }

        .todo-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .todo-list::-webkit-scrollbar-thumb {
            background: var(--accent-purple);
            border-radius: 2px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px;
            background: var(--glass-bg);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .todo-item:hover {
            background: var(--glass-hover);
            border-color: var(--accent-blue);
            transform: translateX(4px);
        }

        .todo-item.completed {
            opacity: 0.6;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .todo-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--accent-blue);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .todo-checkbox:hover {
            transform: scale(1.1);
            border-color: var(--accent-purple);
        }

        .todo-checkbox.checked {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            animation: checkBounce 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes checkBounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .todo-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: 700;
            animation: checkAppear 0.3s ease;
        }

        @keyframes checkAppear {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        .todo-content {
            flex: 1;
        }

        .todo-text {
            font-size: 15px;
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 6px;
            transition: all 0.3s ease;
        }

        .todo-text.completed {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .todo-meta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .todo-skill-tag {
            font-size: 11px;
            color: var(--accent-blue);
            background: rgba(0, 212, 255, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        .todo-xp {
            font-size: 11px;
            color: var(--accent-purple);
            font-weight: 600;
        }

        .checkin-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .checkin-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        .checkin-btn:active {
            transform: scale(0.95);
        }

        .xp-fly-animation {
            position: fixed;
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--accent-blue);
            pointer-events: none;
            z-index: 1000;
            animation: xpFly 1.2s ease-out forwards;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
        }

        @keyframes xpFly {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -100px) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -200px) scale(0.8);
            }
        }

        .radar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .radar-chart-wrapper {
            width: 100%;
            max-width: 280px;
            height: 280px;
            position: relative;
            margin-bottom: 24px;
        }

        .radar-svg {
            width: 100%;
            height: 100%;
        }

        .radar-bg {
            fill: none;
            stroke: rgba(0, 212, 255, 0.1);
            stroke-width: 1;
        }

        .radar-axis {
            stroke: rgba(0, 212, 255, 0.2);
            stroke-width: 1;
        }

        .radar-label {
            fill: var(--text-secondary);
            font-size: 11px;
            font-family: 'Poppins', sans-serif;
            text-anchor: middle;
        }

        .radar-path {
            fill: rgba(0, 212, 255, 0.15);
            stroke: var(--accent-blue);
            stroke-width: 2;
        }

        .radar-point {
            fill: var(--accent-blue);
            stroke: white;
            stroke-width: 2;
            opacity: 0;
            animation: fadeInPoints 0.5s ease forwards;
        }

        @keyframes fadeInPoints {
            to {
                opacity: 1;
            }
        }

        .radar-center {
            fill: var(--accent-purple);
            opacity: 0;
            animation: pulseCenter 2s ease infinite;
            animation-delay: 2s;
        }

        @keyframes pulseCenter {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.5); opacity: 0; }
        }

        .achievements-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            letter-spacing: 2px;
            text-align: center;
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            margin-bottom: 24px;
        }

        .achievement-badge {
            aspect-ratio: 1;
            background: var(--glass-bg);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .achievement-badge.unlocked {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .achievement-badge.locked {
            filter: grayscale(100%);
            opacity: 0.5;
        }

        .achievement-badge:hover {
            transform: scale(1.08);
        }

        .achievement-icon {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .achievement-name {
            font-size: 10px;
            color: var(--text-secondary);
            text-align: center;
            font-weight: 500;
        }

        .achievement-glow {
            position: absolute;
            inset: -2px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s ease;
        }

        .achievement-badge.unlocked:hover .achievement-glow {
            opacity: 0.5;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
        }

        .stat-card {
            padding: 16px;
            background: var(--glass-bg);
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.2);
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .panel.fading {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        @media (max-width: 1300px) {
            .app-container {
                grid-template-columns: 280px 1fr;
            }
            .radar-container {
                grid-column: span 2;
            }
        }

        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
            }
            .app-title {
                font-size: 28px;
            }
            .skill-tree-wrapper {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    
    <div class="app-wrapper">
        <div class="app-header">
            <div class="app-title">SKILL PUZZLE</div>
            <div class="app-subtitle">BUILD YOUR FUTURE ONE SKILL AT A TIME</div>
        </div>

        <div class="career-switch">
            <button class="switch-btn active" data-career="frontend">前端工程师</button>
            <button class="switch-btn" data-career="dataAnalyst">数据分析师</button>
        </div>

        <div class="app-container">
            <div class="panel">
                <div class="panel-title">技能树</div>
                <div class="skill-tree-wrapper">
                    <svg class="skill-tree-svg" id="skillTreeSvg" viewBox="0 0 280 550"></svg>
                    <div class="skill-nodes" id="skillNodes"></div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">今日任务</div>
                <div class="todo-container">
                    <div class="xp-display">
                        <span class="xp-label">总经验值</span>
                        <span class="xp-value" id="xpDisplay">0 XP</span>
                    </div>
                    <div class="todo-list" id="todoList"></div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">能力雷达</div>
                <div class="radar-container">
                    <div class="radar-chart-wrapper">
                        <svg class="radar-svg" viewBox="0 0 200 200">
                            <g transform="translate(100, 100)">
                                <circle class="radar-bg" r="80" />
                                <circle class="radar-bg" r="60" />
                                <circle class="radar-bg" r="40" />
                                <circle class="radar-bg" r="20" />
                                <line class="radar-axis" x1="0" y1="-80" x2="0" y2="80" />
                                <line class="radar-axis" x1="-80" y1="0" x2="80" y2="0" />
                                <line class="radar-axis" x1="-56.6" y1="-56.6" x2="56.6" y2="56.6" />
                                <line class="radar-axis" x1="-56.6" y1="56.6" x2="56.6" y2="-56.6" />
                                <circle class="radar-center" r="8" />
                                <path class="radar-path" id="radarPath" />
                            </g>
                            <g id="radarLabels"></g>
                            <g id="radarPoints"></g>
                        </svg>
                    </div>
                    <div class="achievements-title">🏆 成就徽章</div>
                    <div class="achievements-grid" id="achievementsGrid"></div>
                    <div class="stats-grid" id="statsGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const careers = {
            frontend: {
                name: '前端工程师',
                skills: {
                    id: 'root',
                    name: '前端',
                    icon: '🎯',
                    unlocked: true,
                    progress: 100,
                    x: 140,
                    y: 30,
                    children: [
                        {
                            id: 'core',
                            name: '核心',
                            icon: '⚡',
                            unlocked: true,
                            progress: 80,
                            x: 140,
                            y: 130,
                            children: [
                                { id: 'html', name: 'HTML', icon: '📄', unlocked: true, progress: 95, x: 60, y: 230 },
                                { id: 'css', name: 'CSS', icon: '🎨', unlocked: true, progress: 85, x: 140, y: 230 },
                                { id: 'js', name: 'JS', icon: '🟨', unlocked: true, progress: 75, x: 220, y: 230 }
                            ]
                        },
                        {
                            id: 'framework',
                            name: '框架',
                            icon: '🏗️',
                            unlocked: true,
                            progress: 60,
                            x: 140,
                            y: 330,
                            children: [
                                { id: 'vue', name: 'Vue', icon: '💚', unlocked: true, progress: 70, x: 60, y: 430 },
                                { id: 'react', name: 'React', icon: '⚛️', unlocked: true, progress: 55, x: 140, y: 430 },
                                { id: 'node', name: 'Node.js', icon: '🟢', unlocked: false, progress: 0, x: 220, y: 430 }
                            ]
                        }
                    ]
                },
                baseRadarData: [95, 85, 75, 70, 55, 40],
                radarLabels: ['HTML', 'CSS', 'JavaScript', 'Vue', 'React', 'Node.js'],
                todos: [
                    { id: 1, text: '阅读Vue3 Composition API文档', skill: 'Vue', xp: 10, completed: false },
                    { id: 2, text: '完成CSS Grid布局练习', skill: 'CSS', xp: 10, completed: false },
                    { id: 3, text: '复习JavaScript闭包和作用域', skill: 'JS', xp: 10, completed: false }
                ],
                stats: [
                    { label: '已解锁', value: '6/8' },
                    { label: '熟练度', value: '72%' },

                    { id: 'sql_pro', name: 'SQL高手', icon: '🗄️', unlocked: true },
                    { id: 'python_master', name: 'Python大师', icon: '🐍', unlocked: false },

                    { id: 'ml_pioneer', name: 'ML先锋', icon: '🤖', unlocked: false },
                    { id: 'data_scientist', name: '数据科学家', icon: '🏅', unlocked: false }

        let currentCareer = 'frontend';
        let currentXP = 0;
        let nextTodoId = 100;

        function initParticles() {
            tsParticles.load("particles-js", {
                particles: {
                    number: { value: 40, density: { enable: true, width: 800, height: 800 } },
                    color: { value: ["#00d4ff", "#a855f7", "#ec4899"] },
                    shape: { type: "circle" },
                    opacity: { value: 0.5, random: true },
                    size: { value: 3, random: true },
                    move: {
                        enable: true,
                        speed: 0.5,
                        direction: "none",
                        random: true,
                        straight: false,
                        outModes: { default: "out" },
                    },
                    links: {
                        enable: true,
                        distance: 150,
                        color: "#00d4ff",
                        opacity: 0.2,
                        width: 1,
                    },
                },
                interactivity: {
                    events: {
                        onHover: { enable: true, mode: "grab" },
                        onClick: { enable: true, mode: "push" },
                    },
                    modes: {
                        grab: { distance: 140, links: { opacity: 0.5 } },
                        push: { quantity: 4 },
                    },
                },
                detectRetina: true,
            });
        }

        function renderSkillTree() {
            const svg = document.getElementById('skillTreeSvg');
            const nodesContainer = document.getElementById('skillNodes');
            const skills = careers[currentCareer].skills;
            
            svg.innerHTML = '';
            nodesContainer.innerHTML = '';

            const connections = [];

            function addNode(node) {
                const nodeEl = document.createElement('div');
                nodeEl.className = `skill-node ${node.unlocked ? 'unlocked' : 'locked'}`;
                nodeEl.style.left = `${node.x - 40}px`;
                nodeEl.style.top = `${node.y - 40}px`;
                nodeEl.dataset.id = node.id;

                const icon = document.createElement('span');
                icon.className = 'skill-icon';
                icon.textContent = node.icon;
                nodeEl.appendChild(icon);

                const name = document.createElement('span');
                name.className = 'skill-name';
                name.textContent = node.name;
                nodeEl.appendChild(name);

                const progressBg = document.createElement('div');
                progressBg.className = 'skill-progress-bg';
                nodeEl.appendChild(progressBg);

                const progressFill = document.createElement('div');
                progressFill.className = 'skill-progress-fill';
                progressFill.style.width = `${node.progress}%`;
                progressBg.appendChild(progressFill);

                if (node.unlocked && node.id !== 'root') {
                    const badge = document.createElement('span');
                    badge.className = 'skill-unlock-badge';
                    badge.textContent = '✓';
                    nodeEl.appendChild(badge);
                }

                nodeEl.addEventListener('click', () => {
                    if (!node.unlocked) {
                        showToast('🔒 该技能尚未解锁');
                    } else {
                        showToast(`✅ ${node.name}: ${node.progress}%`);
                    }
                });

                nodesContainer.appendChild(nodeEl);

                if (node.children) {
                    node.children.forEach(child => {
                        connections.push({
                            from: { x: node.x, y: node.y + 40 },
                            to: { x: child.x, y: child.y - 40 },
                            unlocked: node.unlocked && child.unlocked
                        });
                        addNode(child);
                    });
                }
            }

            addNode(skills);

            connections.forEach(conn => {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', conn.from.x);
                line.setAttribute('y1', conn.from.y);
                line.setAttribute('x2', conn.to.x);
                line.setAttribute('y2', conn.to.y);
                line.className = conn.unlocked ? 'unlocked' : '';
                svg.appendChild(line);
            });
        }

        function renderTodos() {
            const todoList = document.getElementById('todoList');
            const todos = careers[currentCareer].todos;
            
            todoList.innerHTML = '';

            todos.forEach(todo => {
                const item = document.createElement('div');
                item.className = `todo-item ${todo.completed ? 'completed' : ''}`;

                const checkbox = document.createElement('span');
                checkbox.className = `todo-checkbox ${todo.completed ? 'checked' : ''}`;
                checkbox.addEventListener('click', () => toggleTodo(todo.id));
                item.appendChild(checkbox);

                const content = document.createElement('div');
                content.className = 'todo-content';

                const text = document.createElement('span');
                text.className = `todo-text ${todo.completed ? 'completed' : ''}`;
                text.textContent = todo.text;
                content.appendChild(text);

                const meta = document.createElement('div');
                meta.className = 'todo-meta';

                const tag = document.createElement('span');
                tag.className = 'todo-skill-tag';
                tag.textContent = todo.skill;
                meta.appendChild(tag);

                const xp = document.createElement('span');
                xp.className = 'todo-xp';
                xp.textContent = `+${todo.xp} XP`;
                meta.appendChild(xp);

                content.appendChild(meta);
                item.appendChild(content);

                const checkinBtn = document.createElement('button');
                checkinBtn.className = 'checkin-btn';
                checkinBtn.textContent = '打卡';
                checkinBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleCheckin(todo);
                });
                item.appendChild(checkinBtn);

                todoList.appendChild(item);
            });
        }

        function toggleTodo(id) {
            const todos = careers[currentCareer].todos;
            const todo = todos.find(t => t.id === id);
            if (!todo) return;

            todo.completed = !todo.completed;
            renderTodos();
            renderRadarChart();
        }

        function handleCheckin(todo) {
            if (todo.completed) return;

            todo.completed = true;
            currentXP += todo.xp;
            
            showXpAnimation(todo.xp);
            updateSkillProgress(todo.skill);
            updateXPDisplay();
            renderTodos();
            renderRadarChart();
        }

        function showXpAnimation(amount) {
            const animation = document.createElement('div');
            animation.className = 'xp-fly-animation';
            animation.textContent = `+${amount} XP`;
            animation.style.left = '50%';
            animation.style.top = '50%';
            document.body.appendChild(animation);

            setTimeout(() => {
                animation.remove();
            }, 1200);
        }

        function updateSkillProgress(skillName) {
            const skills = careers[currentCareer].skills;

            function updateNode(node) {
                if (node.name === skillName || skillName.includes(node.name) || node.name.includes(skillName)) {
                    if (!node.unlocked) node.unlocked = true;
                    node.progress = Math.min(node.progress + 10, 100);
                }
                if (node.children) {
                    node.children.forEach(child => updateNode(child));
                }
            }

            updateNode(skills);
            renderSkillTree();
        }

        function updateXPDisplay() {
            const display = document.getElementById('xpDisplay');
            display.textContent = `${currentXP} XP`;
        }

        function renderRadarChart() {
            const baseData = careers[currentCareer].baseRadarData;
            const labels = careers[currentCareer].radarLabels;
            const todos = careers[currentCareer].todos;
            const completedSkills = todos.filter(t => t.completed).map(t => t.skill);
            
            const data = baseData.map((base, index) => {
                const skill = labels[index];
                if (completedSkills.some(s => skill.includes(s) || s.includes(skill))) {
                    return Math.min(base + 10, 100);
                }
                return base;
            });

            const path = document.getElementById('radarPath');
            const labelsGroup = document.getElementById('radarLabels');
            const pointsGroup = document.getElementById('radarPoints');

            const center = 100;
            const maxRadius = 80;
            const numPoints = data.length;
            const angleStep = (Math.PI * 2) / numPoints;
            
            let pathD = '';
            labelsGroup.innerHTML = '';
            pointsGroup.innerHTML = '';

            data.forEach((value, index) => {
                const angle = index * angleStep - Math.PI / 2;
                const radius = (value / 100) * maxRadius;
                const x = center + radius * Math.cos(angle);
                const y = center + radius * Math.sin(angle);
                
                pathD += index === 0 ? `M ${x} ${y}` : ` L ${x} ${y}`;

                const labelX = center + (maxRadius + 15) * Math.cos(angle);
                const labelY = center + (maxRadius + 15) * Math.sin(angle);
                
                const labelEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                labelEl.setAttribute('x', labelX);
                labelEl.setAttribute('y', labelY);
                labelEl.setAttribute('class', 'radar-label');
                labelEl.textContent = labels[index];
                labelsGroup.appendChild(labelEl);

                const pointEl = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                pointEl.setAttribute('cx', x);
                pointEl.setAttribute('cy', y);
                pointEl.setAttribute('r', 5);
                pointEl.setAttribute('class', 'radar-point');
                pointEl.style.animationDelay = `${index * 0.1}s`;
                pointsGroup.appendChild(pointEl);
            });

            pathD += ' Z';
            path.setAttribute('d', pathD);

            setTimeout(() => {
                const length = path.getTotalLength();
                path.style.transition = 'none';
                path.style.strokeDasharray = length;
                path.style.strokeDashoffset = length;
                path.getBoundingClientRect();
                path.style.transition = 'stroke-dashoffset 2s ease-out';
                path.style.strokeDashoffset = '0';
            }, 100);
        }

        function renderAchievements() {
            const grid = document.getElementById('achievementsGrid');
            const achievements = careers[currentCareer].achievements;
            
            grid.innerHTML = '';

            achievements.forEach((achievement, index) => {
                const badge = document.createElement('div');
                badge.className = `achievement-badge ${achievement.unlocked ? 'unlocked' : 'locked'}`;
                badge.style.animationDelay = `${index * 0.1}s`;

                const glow = document.createElement('div');
                glow.className = 'achievement-glow';
                badge.appendChild(glow);

                const icon = document.createElement('span');
                icon.className = 'achievement-icon';
                icon.textContent = achievement.icon;
                badge.appendChild(icon);

                const name = document.createElement('span');
                name.className = 'achievement-name';
                name.textContent = achievement.name;
                badge.appendChild(name);

                badge.addEventListener('click', () => {
                    if (achievement.unlocked) {
                        showToast(`🏅 ${achievement.name} - 已获得`);
                    } else {
                        showToast(`🔒 ${achievement.name} - 尚未解锁`);
                    }
                });

                grid.appendChild(badge);
            });
        }

        function renderStats() {
            const grid = document.getElementById('statsGrid');
            const stats = careers[currentCareer].stats;
            
            grid.innerHTML = '';

            stats.forEach((stat, index) => {
                const card = document.createElement('div');
                card.className = 'stat-card';
                card.style.animationDelay = `${index * 0.1}s`;

                const value = document.createElement('div');
                value.className = 'stat-value';
                value.textContent = stat.value;
                card.appendChild(value);

                const label = document.createElement('div');
                label.className = 'stat-label';
                label.textContent = stat.label;
                card.appendChild(label);

                grid.appendChild(card);
            });
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.position = 'fixed';
            toast.style.top = '20px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.background = 'rgba(0, 212, 255, 0.2)';
            toast.style.backdropFilter = 'blur(10px)';
            toast.style.border = '1px solid rgba(0, 212, 255, 0.3)';
            toast.style.color = 'white';
            toast.style.padding = '12px 24px';
            toast.style.borderRadius = '25px';
            toast.style.fontSize = '14px';
            toast.style.zIndex = '1000';
            toast.style.animation = 'fadeInUp 0.3s ease';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        function switchCareer(career) {
            if (currentCareer === career) return;

            const panels = document.querySelectorAll('.panel');
            panels.forEach(panel => panel.classList.add('fading'));

            setTimeout(() => {
                currentCareer = career;
                currentXP = 0;

                document.querySelectorAll('.switch-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.career === career) btn.classList.add('active');
                });

                renderSkillTree();
                renderTodos();
                renderRadarChart();
                renderAchievements();
                renderStats();
                updateXPDisplay();

                setTimeout(() => {
                    panels.forEach(panel => panel.classList.remove('fading'));
                }, 50);
            }, 300);
        }

        document.querySelectorAll('.switch-btn').forEach(btn => {
            btn.addEventListener('click', () => switchCareer(btn.dataset.career));
        });

        initParticles();
        renderSkillTree();
        renderTodos();
        renderRadarChart();
        renderAchievements();
        renderStats();
        updateXPDisplay();
    </script>
