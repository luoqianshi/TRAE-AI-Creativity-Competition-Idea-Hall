<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奥特莱斯 HR+行政 方案框架生成器</title>
    <script src="https://unpkg.com/docx@8.5.0/build/index.umd.min.js"></script>
    <script src="https://unpkg.com/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #f0f4ff;
            --bg-header: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --bg-body: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-input: #ffffff;
            --bg-card: #f8f9fa;
            --bg-card-hover: #f0f4ff;
            --bg-result: #f0f8ff;
            --bg-result-inner: #ffffff;
            --bg-sensitive: #ffebee;
            --bg-checklist: #e8f5e9;
            --bg-disclaimer: #fff8e1;
            --bg-footer: #fafafa;
            --bg-nav: rgba(255,255,255,0.95);
            --bg-skeleton: #e0e0e0;
            --bg-skeleton-shine: #f5f5f5;
            --bg-dropdown: #ffffff;
            --bg-tooltip: rgba(0,0,0,0.85);
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --text-header: #ffffff;
            --text-link: #1976d2;
            --text-sensitive: #c62828;
            --text-checklist: #2e7d32;
            --text-disclaimer: #856404;
            --border-primary: #e9ecef;
            --border-focus: #667eea;
            --border-result: #b3d9ff;
            --border-sensitive: #ef9a9a;
            --border-checklist: #a5d6a7;
            --border-disclaimer: #ffc107;
            --shadow-card: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-hover: 0 5px 15px rgba(102,126,234,0.4);
            --shadow-container: 0 20px 60px rgba(0,0,0,0.3);
            --accent: #667eea;
            --accent-dark: #1e3c72;
            --radius-card: 12px;
            --radius-btn: 8px;
            --radius-container: 20px;
            --font-size: 14px;
            --font-size-sm: 12px;
            --font-size-xs: 11px;
            --font-size-xxs: 10px;
            --font-size-lg: 16px;
            --font-size-xl: 20px;
            --font-size-xxl: 28px;
        }
        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --bg-header: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
            --bg-body: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            --bg-input: #1e1e3a;
            --bg-card: #1e1e3a;
            --bg-card-hover: #2a2a4a;
            --bg-result: #1a1a35;
            --bg-result-inner: #1e1e3a;
            --bg-sensitive: #2d1b1b;
            --bg-checklist: #1b2d1b;
            --bg-disclaimer: #2d2b1b;
            --bg-footer: #16213e;
            --bg-nav: rgba(26,26,46,0.95);
            --bg-skeleton: #2a2a4a;
            --bg-skeleton-shine: #3a3a5a;
            --bg-dropdown: #1e1e3a;
            --bg-tooltip: rgba(0,0,0,0.95);
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0b0;
            --text-muted: #707080;
            --text-link: #64b5f6;
            --text-sensitive: #ef5350;
            --text-checklist: #66bb6a;
            --text-disclaimer: #ffb74d;
            --border-primary: #2a2a4a;
            --border-result: #1a3a5a;
            --border-sensitive: #5a2a2a;
            --border-checklist: #2a5a2a;
            --border-disclaimer: #5a4a1a;
            --shadow-card: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-hover: 0 5px 15px rgba(102,126,234,0.2);
            --shadow-container: 0 20px 60px rgba(0,0,0,0.5);
        }
        [data-fontsize="small"] {
            --font-size: 13px;
            --font-size-sm: 11px;
            --font-size-xs: 10px;
            --font-size-xxs: 9px;
            --font-size-lg: 15px;
            --font-size-xl: 18px;
            --font-size-xxl: 24px;
        }
        [data-fontsize="large"] {
            --font-size: 16px;
            --font-size-sm: 14px;
            --font-size-xs: 13px;
            --font-size-xxs: 12px;
            --font-size-lg: 18px;
            --font-size-xl: 22px;
            --font-size-xxl: 32px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
            font-size: var(--font-size);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
        }

        /* === Skeleton Screen === */
        .skeleton-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-body);
            display: flex; justify-content: center; align-items: flex-start;
            padding: 10px; z-index: 9999;
            transition: opacity 0.5s;
        }
        .skeleton-overlay.fade-out { opacity: 0; pointer-events: none; }
        .skeleton-container {
            width: 100%; max-width: 480px;
            background: var(--bg-primary); border-radius: var(--radius-container);
            box-shadow: var(--shadow-container); overflow: hidden;
        }
        .skel-header {
            height: 100px;
            background: linear-gradient(135deg, #2a4a7a, #3a5a9a);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        }
        .skel-line { border-radius: 4px; background: var(--bg-skeleton); position: relative; overflow: hidden; }
        .skel-line::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--bg-skeleton-shine), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0%{left:-100%} 100%{left:100%} }
        .skel-h1 { width: 140px; height: 20px; }
        .skel-p { width: 200px; height: 12px; }
        .skel-tag { width: 80px; height: 16px; margin-top: 4px; }
        .skel-disclaimer { height: 40px; background: var(--bg-skeleton); margin: 0; }
        .skel-content { padding: 15px; }
        .skel-title-bar { width: 60%; height: 16px; margin-bottom: 15px; }
        .skel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .skel-card { height: 90px; border-radius: var(--radius-card); }
        .skel-input { margin: 15px 0; }
        .skel-textarea { height: 70px; border-radius: var(--radius-btn); }
        .skel-btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .skel-btn { flex: 1; height: 44px; border-radius: var(--radius-btn); }

        /* === App Container === */
        .app-container {
            width: 100%; max-width: 480px;
            background: var(--bg-primary); border-radius: var(--radius-container);
            box-shadow: var(--shadow-container); overflow: hidden;
            margin-top: 10px;
            transition: background 0.3s;
        }

        /* === Header === */
        .app-header {
            background: var(--bg-header); color: var(--text-header);
            padding: 16px 20px; text-align: center; position: relative;
        }
        .app-header h1 { font-size: var(--font-size-xl); font-weight: 600; margin-bottom: 4px; }
        .app-header p { font-size: var(--font-size-sm); opacity: 0.9; }
        .version-tag {
            display: inline-block; background: rgba(255,255,255,0.2);
            padding: 2px 10px; border-radius: 10px; font-size: var(--font-size-xxs); margin-top: 6px;
        }
        .header-controls {
            position: absolute; top: 10px; right: 10px;
            display: flex; gap: 6px; align-items: center;
        }
        .icon-btn {
            width: 32px; height: 32px; border: none; border-radius: 50%;
            background: rgba(255,255,255,0.2); color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; transition: background 0.3s;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.35); }
        .icon-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        .fontsize-menu {
            position: absolute; top: 36px; right: 0;
            background: var(--bg-dropdown); border: 1px solid var(--border-primary);
            border-radius: 8px; padding: 4px; min-width: 80px;
            box-shadow: var(--shadow-card); display: none; z-index: 100;
        }
        .fontsize-menu.show { display: block; }
        .fontsize-option {
            padding: 6px 12px; border: none; background: none; width: 100%;
            text-align: left; font-size: var(--font-size-sm); color: var(--text-primary);
            cursor: pointer; border-radius: 6px;
        }
        .fontsize-option:hover { background: var(--bg-tertiary); }
        .fontsize-option.active { background: var(--accent); color: white; }

        /* === Disclaimer === */
        .disclaimer {
            background: var(--bg-disclaimer); padding: 10px 15px;
            font-size: var(--font-size-xs); color: var(--text-disclaimer);
            border-left: 4px solid var(--border-disclaimer);
        }

        /* === Content === */
        .app-content { padding: 15px; }

        /* === Recent & Search === */
        .recent-search-bar { margin-bottom: 12px; }
        .search-box {
            display: flex; align-items: center;
            border: 1px solid var(--border-primary); border-radius: var(--radius-btn);
            background: var(--bg-input); overflow: hidden; margin-bottom: 10px;
        }
        .search-box svg { width: 16px; height: 16px; margin-left: 10px; flex-shrink: 0; color: var(--text-muted); }
        .search-box input {
            flex: 1; border: none; padding: 8px 10px; font-size: var(--font-size-sm);
            background: transparent; color: var(--text-primary); outline: none;
        }
        .recent-label {
            font-size: var(--font-size-xs); color: var(--text-muted); margin-bottom: 6px;
        }
        .recent-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .recent-tag {
            padding: 4px 10px; border-radius: 12px; font-size: var(--font-size-xxs);
            background: var(--bg-tertiary); color: var(--accent); cursor: pointer;
            border: 1px solid transparent; transition: all 0.2s;
            white-space: nowrap;
        }
        .recent-tag:hover { border-color: var(--accent); }
        .recent-tag .remove-recent {
            margin-left: 4px; opacity: 0.5; cursor: pointer;
        }
        .recent-tag .remove-recent:hover { opacity: 1; }

        /* === Category & Grid === */
        .category-title {
            font-size: var(--font-size-sm); font-weight: 600; color: var(--text-primary);
            margin: 12px 0 10px; padding-left: 8px;
            border-left: 4px solid var(--accent);
        }
        .category-title:first-child { margin-top: 0; }
        .skill-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;
        }
        .skill-card {
            background: var(--bg-card); border: 2px solid var(--border-primary);
            border-radius: var(--radius-card); padding: 14px; cursor: pointer;
            transition: all 0.3s ease; opacity: 0; transform: translateY(20px);
            position: relative;
        }
        .skill-card.visible { opacity: 1; transform: translateY(0); }
        .skill-card:hover { border-color: var(--accent); background: var(--bg-card-hover); transform: translateY(-2px); }
        .skill-card:active { transform: translateY(0); }
        .skill-card.active { border-color: var(--accent); background: var(--bg-card-hover); box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
        .skill-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .skill-icon { font-size: 24px; margin-bottom: 6px; }
        .skill-name { font-size: var(--font-size-sm); font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
        .skill-desc { font-size: var(--font-size-xxs); color: var(--text-secondary); line-height: 1.4; }
        .skill-time-badge {
            position: absolute; top: 6px; right: 6px;
            background: rgba(102,126,234,0.15); color: var(--accent);
            font-size: 9px; padding: 2px 6px; border-radius: 8px;
            opacity: 0; transition: opacity 0.2s;
        }
        .skill-card:hover .skill-time-badge { opacity: 1; }

        /* === Input Section === */
        .input-section {
            padding: 15px; background: var(--bg-secondary);
            border-top: 1px solid var(--border-primary);
        }
        .input-label { font-size: var(--font-size-sm); color: var(--text-primary); margin-bottom: 8px; font-weight: 500; }
        .input-wrapper { position: relative; }
        .input-history-dropdown {
            position: absolute; top: 100%; left: 0; right: 0;
            background: var(--bg-dropdown); border: 1px solid var(--border-primary);
            border-radius: 0 0 8px 8px; max-height: 150px; overflow-y: auto;
            display: none; z-index: 50; box-shadow: var(--shadow-card);
        }
        .input-history-dropdown.show { display: block; }
        .input-history-item {
            padding: 8px 10px; font-size: var(--font-size-sm); cursor: pointer;
            border-bottom: 1px solid var(--border-primary); color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .input-history-item:hover { background: var(--bg-tertiary); }
        .input-history-item:last-child { border-bottom: none; }
        textarea {
            width: 100%; min-height: 70px; padding: 10px;
            border: 1px solid var(--border-primary); border-radius: var(--radius-btn);
            font-size: var(--font-size-sm); resize: vertical; outline: none;
            background: var(--bg-input); color: var(--text-primary);
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: var(--accent); }
        .char-count {
            text-align: right; font-size: var(--font-size-xxs); color: var(--text-muted);
            margin-top: 4px;
        }
        .button-group {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;
        }
        .btn {
            padding: 12px; border: none; border-radius: var(--radius-btn);
            font-size: var(--font-size); font-weight: 600; cursor: pointer;
            transition: all 0.3s; position: relative; overflow: hidden;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-secondary { background: var(--bg-card); color: var(--text-secondary); }
        .btn-secondary:hover { background: var(--border-primary); }
        .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .shortcut-hint {
            font-size: var(--font-size-xxs); opacity: 0.7; margin-top: 6px;
            text-align: center; color: var(--text-muted);
        }
        .shortcut-hint kbd {
            background: var(--bg-card); padding: 1px 5px; border-radius: 3px;
            border: 1px solid var(--border-primary); font-family: inherit;
        }

        /* === Loading Animation === */
        .loading-overlay {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.85); z-index: 10;
            align-items: center; justify-content: center; flex-direction: column; gap: 12px;
            border-radius: var(--radius-btn);
        }
        [data-theme="dark"] .loading-overlay { background: rgba(26,26,46,0.85); }
        .loading-overlay.show { display: flex; }
        .loading-spinner {
            width: 36px; height: 36px; border: 3px solid var(--border-primary);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: var(--font-size-sm); color: var(--text-secondary); }

        /* === Sticky Outline Nav === */
        .outline-nav {
            position: sticky; top: 0; z-index: 20;
            background: var(--bg-nav); backdrop-filter: blur(10px);
            padding: 8px 15px; display: none;
            border-bottom: 1px solid var(--border-primary);
            max-height: 120px; overflow-y: auto;
        }
        .outline-nav.show { display: block; }
        .outline-nav-label { font-size: var(--font-size-xxs); color: var(--text-muted); margin-bottom: 4px; }
        .outline-links { display: flex; flex-wrap: wrap; gap: 4px; }
        .outline-link {
            padding: 3px 8px; border-radius: 10px; font-size: var(--font-size-xxs);
            background: var(--bg-tertiary); color: var(--accent); cursor: pointer;
            text-decoration: none; transition: background 0.2s;
        }
        .outline-link:hover { background: var(--accent); color: white; }

        /* === Result Section === */
        .result-section {
            display: none; margin-top: 15px;
            padding: 15px; background: var(--bg-result);
            border-radius: var(--radius-card); border: 1px solid var(--border-result);
            position: relative;
        }
        .result-section.show { display: block; }
        .result-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px;
        }
        .result-title { font-size: var(--font-size-sm); font-weight: 600; color: var(--accent-dark); }
        .export-btns { display: flex; gap: 6px; }
        .export-btn {
            padding: 4px 10px; border: 1px solid var(--border-primary); border-radius: 6px;
            background: var(--bg-primary); color: var(--text-primary); font-size: var(--font-size-xxs);
            cursor: pointer; transition: all 0.2s;
        }
        .export-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* === Collapsible Sections === */
        .result-content {
            font-size: var(--font-size-sm); line-height: 1.8; color: var(--text-primary);
            white-space: pre-wrap; word-break: break-word;
            background: var(--bg-result-inner); padding: 12px; border-radius: 8px;
            border: 1px solid var(--border-primary);
        }
        .section-block { margin-bottom: 2px; }
        .section-header {
            display: flex; align-items: center; gap: 6px; cursor: pointer;
            padding: 6px 0; user-select: none; font-weight: 600;
            color: var(--accent-dark); font-size: var(--font-size-sm);
        }
        .section-header:hover { color: var(--accent); }
        .section-toggle {
            display: inline-flex; width: 18px; height: 18px; align-items: center;
            justify-content: center; font-size: 12px; transition: transform 0.2s;
            background: var(--bg-tertiary); border-radius: 4px; flex-shrink: 0;
        }
        .section-toggle.collapsed { transform: rotate(-90deg); }
        .section-body { padding-left: 24px; }
        .section-body.collapsed-content { display: none; }

        .highlight-sensitive {
            background: rgba(198,40,40,0.12); color: var(--text-sensitive);
            padding: 1px 3px; border-radius: 3px; font-weight: 600;
            cursor: pointer; text-decoration: underline dotted;
            position: relative;
        }
        .highlight-sensitive:hover { background: rgba(198,40,40,0.2); }
        .fill-blank {
            color: var(--text-link); font-weight: 600;
            border-bottom: 1px dashed var(--text-link);
        }

        /* === Sensitive Word Law Popup === */
        .law-popup-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 200;
            align-items: center; justify-content: center; padding: 20px;
        }
        .law-popup-overlay.show { display: flex; }
        .law-popup {
            background: var(--bg-primary); border-radius: var(--radius-card);
            max-width: 440px; width: 100%; max-height: 80vh; overflow-y: auto;
            padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .law-popup-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border-primary);
        }
        .law-popup-title { font-size: var(--font-size); font-weight: 600; color: var(--text-sensitive); }
        .law-popup-close {
            width: 28px; height: 28px; border: none; border-radius: 50%;
            background: var(--bg-card); color: var(--text-secondary); cursor: pointer;
            font-size: 16px; display: flex; align-items: center; justify-content: center;
        }
        .law-popup-close:hover { background: var(--border-primary); }
        .law-item {
            padding: 12px; margin-bottom: 8px; border-radius: 8px;
            border: 1px solid var(--border-primary); background: var(--bg-secondary);
        }
        .law-item-number { font-size: var(--font-size-xxs); color: var(--accent); font-weight: 600; margin-bottom: 4px; }
        .law-item-keywords { font-size: var(--font-size-xxs); color: var(--text-muted); margin-bottom: 6px; }
        .law-item-text { font-size: var(--font-size-sm); color: var(--text-primary); line-height: 1.6; margin-bottom: 8px; }
        .law-item-advice {
            font-size: var(--font-size-xs); color: var(--text-checklist); padding: 8px;
            background: var(--bg-checklist); border-radius: 6px;
            border: 1px solid var(--border-checklist);
        }
        .law-item-advice::before { content: "操作建议："; font-weight: 600; }

        /* === Sensitive Box === */
        .sensitive-box {
            margin-top: 12px; padding: 10px;
            background: var(--bg-sensitive); border-radius: 8px;
            border: 1px solid var(--border-sensitive);
        }
        .sensitive-title {
            font-size: var(--font-size-sm); font-weight: 600; color: var(--text-sensitive);
            margin-bottom: 6px;
        }
        .sensitive-list { font-size: var(--font-size-xs); color: var(--text-primary); line-height: 1.6; }
        .sensitive-word-tag {
            display: inline-block; padding: 2px 8px; margin: 2px 4px 2px 0;
            border-radius: 10px; font-size: var(--font-size-xxs);
            background: rgba(198,40,40,0.15); color: var(--text-sensitive);
            cursor: pointer; transition: background 0.2s;
            text-decoration: none;
        }
        .sensitive-word-tag:hover { background: rgba(198,40,40,0.3); }

        /* === Checklist with Progress === */
        .checklist-box {
            margin-top: 12px; padding: 12px;
            background: var(--bg-checklist); border-radius: 8px;
            border: 1px solid var(--border-checklist);
        }
        .checklist-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px;
        }
        .checklist-title { font-size: var(--font-size-sm); font-weight: 600; color: var(--text-checklist); }
        .checklist-progress-wrapper { display: flex; align-items: center; gap: 6px; }

        // ===================== STATE =====================

        let selectedSkill = null;
        let currentRawText = '';
        let currentFoundWords = [];
        let autoSaveTimer = null;

        // ===================== INIT =====================

        function init() {
            // Skeleton screen: hide after 800ms
            setTimeout(function() {
                document.getElementById('skeletonOverlay').classList.add('fade-out');
                document.getElementById('appContainer').style.opacity = '1';
                setTimeout(function() {
                    document.getElementById('skeletonOverlay').style.display = 'none';
                }, 500);
            }, 800);

            // Load saved state
            loadTheme();
            loadFontSize();
            loadDraft();
            renderRecentTags();
            renderSkills();

            // Restore auto-save
            var input = document.getElementById('userInput');
            input.addEventListener('input', autoSaveDraft);
            input.addEventListener('keydown', handleCtrlEnter);

            // Card stagger animation
            setTimeout(function() {
                var cards = document.querySelectorAll('.skill-card');
                cards.forEach(function(card, i) {
                    setTimeout(function() {
                        card.classList.add('visible');
                    }, i * 80);
                });
            }, 900);
        }

        // ===================== THEME =====================

        function toggleTheme() {
            var html = document.documentElement;
            var isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('hrapp-theme', isDark ? 'light' : 'dark');
            updateThemeIcon(isDark ? 'light' : 'dark');
        }

        function loadTheme() {
            var saved = localStorage.getItem('hrapp-theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
            updateThemeIcon(saved);
        }

        function updateThemeIcon(theme) {
            var icon = document.getElementById('themeIcon');
            if (theme === 'dark') {
                icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
            } else {
                icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>';
            }
        }

        // ===================== FONT SIZE =====================

        function toggleFontsizeMenu() {
            document.getElementById('fontsizeMenu').classList.toggle('show');
        }

        function setFontSize(size) {
            document.documentElement.setAttribute('data-fontsize', size);
            localStorage.setItem('hrapp-fontsize', size);
            var btns = document.querySelectorAll('.fontsize-option');
            btns.forEach(function(b) {
                b.classList.toggle('active', b.textContent === {small:'小',medium:'中',large:'大'}[size]);
            });
            document.getElementById('fontsizeMenu').classList.remove('show');
        }

        function loadFontSize() {
            var saved = localStorage.getItem('hrapp-fontsize') || 'medium';
            document.documentElement.setAttribute('data-fontsize', saved);
            var btns = document.querySelectorAll('.fontsize-option');
            btns.forEach(function(b) {
                b.classList.toggle('active', b.textContent === {small:'小',medium:'中',large:'大'}[saved]);
            });
        }

        // Close menus on outside click
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.fontsize-menu') && !e.target.closest('[aria-label="调整字号"]')) {
                document.getElementById('fontsizeMenu').classList.remove('show');
            }
        });

        // ===================== RECENT & SEARCH =====================

        function getRecentSkills() {
            try { return JSON.parse(localStorage.getItem('hrapp-recent') || '[]'); } catch(e) { return []; }
        }

        function saveRecentSkill(skillId) {
            var recent = getRecentSkills();
            recent = recent.filter(function(id) { return id !== skillId; });
            recent.unshift(skillId);
            if (recent.length > 5) recent = recent.slice(0, 5);
            localStorage.setItem('hrapp-recent', JSON.stringify(recent));
            renderRecentTags();
        }

        function renderRecentTags() {
            var recent = getRecentSkills();
            var section = document.getElementById('recentSection');
            var container = document.getElementById('recentTags');
            if (recent.length === 0) { section.style.display = 'none'; return; }
            section.style.display = 'block';
            container.innerHTML = recent.map(function(id) {
                var skill = skillsData.find(function(s) { return s.id === id; });
                if (!skill) return '';
                return '<span class="recent-tag" onclick="selectSkill(\'' + id + '\')" tabindex="0" role="button" aria-label="快速选择' + skill.name + '">' +
                    skill.icon + ' ' + skill.name +
                    ' <span class="remove-recent" onclick="event.stopPropagation();removeRecent(\'' + id + '\')" aria-label="移除">&times;</span></span>';
            }).join('');
        }

        function removeRecent(id) {
            var recent = getRecentSkills().filter(function(r) { return r !== id; });
            localStorage.setItem('hrapp-recent', JSON.stringify(recent));
            renderRecentTags();
        }

        function filterScenes() {
            var query = document.getElementById('searchInput').value.trim().toLowerCase();
            var cards = document.querySelectorAll('.skill-card');
            cards.forEach(function(card) {
                var name = card.querySelector('.skill-name').textContent.toLowerCase();
                var desc = card.querySelector('.skill-desc').textContent.toLowerCase();
                var match = !query || name.indexOf(query) !== -1 || desc.indexOf(query) !== -1;
                card.style.display = match ? '' : 'none';
            });
        }

        // ===================== SKILLS RENDER =====================

        function renderSkills() {
            var container = document.getElementById('skillGrid');
            container.innerHTML = skillsData.map(function(skill) {
                return '<div class="skill-card" id="' + skill.id + '" tabindex="0" role="button" aria-label="' + skill.name + '" onclick="selectSkill(\'' + skill.id + '\')" onkeydown="if(event.key===\'Enter\')selectSkill(\'' + skill.id + '\')">' +
                    '<span class="skill-time-badge">' + skill.time + '</span>' +
                    '<div class="skill-icon">' + skill.icon + '</div>' +
                    '<div class="skill-name">' + skill.name + '</div>' +
                    '<div class="skill-desc">' + skill.desc + '</div>' +
                    '</div>';
            }).join('');
        }

        function selectSkill(skillId) {
            document.querySelectorAll('.skill-card').forEach(function(card) { card.classList.remove('active'); });
            var el = document.getElementById(skillId);
            if (el) el.classList.add('active');
            selectedSkill = skillId;
            saveRecentSkill(skillId);
            // Auto scroll to input
            document.getElementById('userInput').scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(function() { document.getElementById('userInput').focus(); }, 400);
        }

        // ===================== INPUT HISTORY & AUTO-SAVE =====================

        function getInputHistory() {
            try { return JSON.parse(localStorage.getItem('hrapp-input-history') || '[]'); } catch(e) { return []; }
        }

        function saveInputHistory(title) {
            var history = getInputHistory();
            history = history.filter(function(t) { return t !== title; });
            history.unshift(title);
            if (history.length > 10) history = history.slice(0, 10);
            localStorage.setItem('hrapp-input-history', JSON.stringify(history));
        }

        function showInputHistory() {
            var history = getInputHistory();
            var dd = document.getElementById('inputHistoryDropdown');
            if (history.length === 0) { dd.classList.remove('show'); return; }
            dd.innerHTML = history.map(function(t) {
                return '<div class="input-history-item" onmousedown="selectHistoryItem(\'' + t.replace(/'/g, "\\'") + '\')">' + escapeHtml(t) + '</div>';
            }).join('');
            dd.classList.add('show');
        }

        function selectHistoryItem(text) {
            document.getElementById('userInput').value = text;
            document.getElementById('inputHistoryDropdown').classList.remove('show');
            updateCharCount();
            autoSaveDraft();
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.input-wrapper')) {
                document.getElementById('inputHistoryDropdown').classList.remove('show');
            }
        });

        function onInputChange() {
            updateCharCount();
            document.getElementById('inputHistoryDropdown').classList.remove('show');
        }

        function updateCharCount() {
            var len = document.getElementById('userInput').value.length;
            document.getElementById('charCount').textContent = len;
        }

        function autoSaveDraft() {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(function() {
                localStorage.setItem('hrapp-draft', document.getElementById('userInput').value);
            }, 500);
        }

        function loadDraft() {
            var draft = localStorage.getItem('hrapp-draft') || '';
            document.getElementById('userInput').value = draft;
            updateCharCount();
        }

        function handleCtrlEnter(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                generateResult();
            }
        }

        // ===================== ESCAPE =====================

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===================== SENSITIVE WORDS & LAW POPUP =====================

        function highlightSensitive(text) {
            var html = escapeHtml(text);
            var found = [];
            sensitiveWords.forEach(function(word) {
                var regex = new RegExp(word, 'g');
                if (regex.test(text)) {
                    if (found.indexOf(word) === -1) found.push(word);
                    var escaped = escapeHtml(word);
                    html = html.split(escaped).join('<span class="highlight-sensitive" onclick="openLawPopupForWord(\'' + word + '\')" title="点击查看法规条文" role="button" aria-label="查看' + word + '相关法规">' + escaped + '</span>');
                }
            });
            return { html: html, found: found };
        }

        function openLawPopupForWord(word) {
            var lawIds = sensitiveWordLawMap[word] || [];
            var laws = lawIds.map(function(id) { return regulationsData.find(function(r) { return r.id === id; }); }).filter(Boolean);
            var title = document.getElementById('lawPopupTitle');
            title.textContent = '\u26A0 "' + word + '" 相关法规条文';
            var content = document.getElementById('lawPopupContent');
            if (laws.length === 0) {
                content.innerHTML = '<p style="color:var(--text-muted);font-size:var(--font-size-sm);">暂无关联法规条文</p>';
            } else {
                content.innerHTML = laws.map(function(law) {
                    return '<div class="law-item">' +
                        '<div class="law-item-number">' + law.law + ' ' + law.article + '</div>' +
                        '<div class="law-item-keywords">关键词：' + law.keywords + '</div>' +
                        '<div class="law-item-text">' + law.text + '</div>' +
                        '<div class="law-item-advice">' + law.advice + '</div>' +
                        '</div>';
                }).join('');
            }
            document.getElementById('lawPopupOverlay').classList.add('show');
        }

        function closeLawPopup(e) {
            if (e && e.target !== document.getElementById('lawPopupOverlay')) return;
            document.getElementById('lawPopupOverlay').classList.remove('show');
        }
        // Also handle no-argument call
        window.closeLawPopupNoArg = function() {
            document.getElementById('lawPopupOverlay').classList.remove('show');
        };

        // ===================== CHECKLIST WITH PROGRESS =====================

        function renderChecklist(skillId) {
            var items = checklists[skillId] || checklists['admin'];
            var container = document.getElementById('checklistContent');
            container.innerHTML = items.map(function(item, idx) {
                var law = item.law ? regulationsData.find(function(r) { return r.id === item.law; }) : null;
                var lawHtml = '';
                if (law) {
                    lawHtml = '<span class="checklist-law-toggle" onclick="toggleChecklistLaw(event,' + idx + ')" tabindex="0" aria-label="查看法规依据">法规依据</span>' +
                        '<div class="checklist-law-content" id="checklist-law-' + idx + '">' +
                        '<b>' + law.law + ' ' + law.article + '</b><br>' + law.text +
                        '</div>';
                }
                return '<label class="checklist-item" id="check-item-' + idx + '">' +
                    '<input type="checkbox" onchange="toggleCheck(' + idx + ')" aria-label="' + item.text + '">' +
                    '<span>' + item.text + '</span>' + lawHtml +
                    '</label>';
            }).join('');
            updateChecklistProgress();
        }

        function toggleCheck(idx) {
            var item = document.getElementById('check-item-' + idx);
            var cb = item.querySelector('input');
            item.classList.toggle('checked', cb.checked);
            updateChecklistProgress();
        }

        function updateChecklistProgress() {
            var items = document.querySelectorAll('#checklistContent .checklist-item');
            var checked = document.querySelectorAll('#checklistContent .checklist-item.checked');
            var total = items.length;
            var done = checked.length;
            var pct = total > 0 ? Math.round(done / total * 100) : 0;
            document.getElementById('checklistProgressFill').style.width = pct + '%';
            document.getElementById('checklistProgressText').textContent = done + '/' + total;
        }

        function toggleChecklistLaw(e, idx) {
            e.stopPropagation();
            var el = document.getElementById('checklist-law-' + idx);
            el.classList.toggle('show');
        }

        // ===================== OUTLINE NAV =====================

        function buildOutlineNav(text) {
            var lines = text.split('\n');
            var headings = [];
            lines.forEach(function(line) {
                var match = line.match(/^(#{1,3})\s+(.+)/);
                if (match) {
                    var level = match[1].length;
                    var title = match[2].replace(/\s*\(.*?\)\s*/, '').trim();
                    headings.push({ level: level, title: title, anchor: 'section-' + headings.length });
                }
            });

            var nav = document.getElementById('outlineNav');
            var links = document.getElementById('outlineLinks');
            if (headings.length <= 1) { nav.classList.remove('show'); return; }

            links.innerHTML = headings.map(function(h, i) {
                return '<a class="outline-link" href="javascript:void(0)" onclick="scrollToSection(' + i + ')" style="' +
                    (h.level > 1 ? 'font-weight:normal;' : 'font-weight:600;') +
                    '">' + h.title + '</a>';
            }).join('');
            nav.classList.add('show');
        }

        function scrollToSection(idx) {
            var el = document.getElementById('section-anchor-' + idx);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ===================== GENERATE RESULT =====================

        function generateResult() {
            var demand = document.getElementById('userInput').value.trim();
            if (!selectedSkill) {
                alert('请先选择一个场景模块');
                return;
            }

            // Save to history
            if (demand) saveInputHistory(demand);

            // Show loading
            var btn = document.getElementById('generateBtn');
            var overlay = document.getElementById('loadingOverlay');
            btn.disabled = true;
            overlay.classList.add('show');

            // Simulate generation delay
            setTimeout(function() {
                var rawText = templates[selectedSkill](demand);
                rawText += '\n\n---\n\u3010\u751F\u6210\u65F6\u95F4\u3011' + new Date().toLocaleString('zh-CN') + ' | \u672C\u6846\u67B6\u9700\u6839\u636E\u5B9E\u9645\u60C5\u51B5\u8865\u5145\u6570\u636E\u540E\u4F7F\u7528';
                currentRawText = rawText;

                // Build result with collapsible sections
                var resultEl = document.getElementById('resultContent');
                resultEl.innerHTML = buildCollapsibleContent(rawText);

                // Sensitive words
                var highlighted = highlightSensitive(rawText);
                currentFoundWords = highlighted.found;

                // Re-highlight within collapsible content
                resultEl.innerHTML = buildCollapsibleContent(rawText, true);

                var sensitiveBox = document.getElementById('sensitiveBox');
                var sensitiveList = document.getElementById('sensitiveList');
                if (highlighted.found.length > 0) {
                    sensitiveBox.style.display = 'block';
                    sensitiveList.innerHTML = '本框架涉及以下敏感内容，请点击关键词查看法规条文：<br>' +
                        highlighted.found.map(function(w) {
                            return '<span class="sensitive-word-tag" onclick="openLawPopupForWord(\'' + w + '\')" tabindex="0" role="button" aria-label="查看' + w + '法规">\u26A0 ' + w + '</span>';
                        }).join('');
                } else {
                    sensitiveBox.style.display = 'none';
                }

                // Checklist
                renderChecklist(selectedSkill);

                // Outline nav
                buildOutlineNav(rawText);

                // Timestamp
                document.getElementById('resultTimestamp').textContent = '生成时间：' + new Date().toLocaleString('zh-CN');

                // Show result
                document.getElementById('resultSection').classList.add('show');

                // Hide loading
                overlay.classList.remove('show');
                btn.disabled = false;

                // Scroll
                setTimeout(function() {
                    document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
                }, 100);
            }, 600);
        }

        function buildCollapsibleContent(text, withHighlights) {
            var lines = text.split('\n');
            var sectionIdx = 0;
            var html = '';
            var inTable = false;
            var tableContent = '';
            var tableSectionIdx = 0;

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                var hMatch = line.match(/^(#{1,3})\s+(.+)/);

                if (hMatch) {
                    // Flush table if any
                    if (inTable) {
                        html += '<div class="section-body">' + tableContent + '</div></div>';
                        tableContent = '';
                        inTable = false;
                    }
                    var level = hMatch[1].length;
                    var title = hMatch[2];
                    var processedTitle = withHighlights ? processTextForHighlight(title) : escapeHtml(title);

                    if (level === 1) {
                        // Top-level heading: not collapsible
                        html += '<div class="section-block" id="section-anchor-' + sectionIdx + '">';
                        html += '<div class="section-header" style="cursor:default;">';
                        html += processedTitle;
                        html += '</div>';
                        html += '<div class="section-body">';
                    } else {
                        // Sub-heading: collapsible
                        html += '<div class="section-block" id="section-anchor-' + sectionIdx + '">';
                        html += '<div class="section-header" onclick="toggleSection(this)">';
                        html += '<span class="section-toggle">\u25BC</span> ';
                        html += processedTitle;
                        html += '</div>';
                        html += '<div class="section-body">';
                    }
                    sectionIdx++;
                } else if (line.match(/^\|/) && !line.match(/^\|\s*-+\s*\|/)) {
                    // Table row (not separator)
                    if (!inTable) {
                        inTable = true;
                        tableContent = '<div style="overflow-x:auto;margin:4px 0;">';
                        tableContent += '<table style="width:100%;border-collapse:collapse;font-size:var(--font-size-xs);">';
                    }
                    var cells = line.split('|').slice(1, -1);
                    tableContent += '<tr>';
                    cells.forEach(function(cell) {
                        var cellContent = cell.trim();
                        if (withHighlights) {
                            cellContent = processTextForHighlight(cellContent);
                        } else {
                            cellContent = escapeHtml(cellContent);
                        }
                        tableContent += '<td style="border:1px solid var(--border-primary);padding:4px 6px;">' + cellContent + '</td>';
                    });
                    tableContent += '</tr>';
                } else if (line.match(/^\|\s*-/) && inTable) {
                    // Table separator - skip
                } else {
                    if (inTable) {
                        tableContent += '</table></div></div>';
                        html += tableContent;
                        tableContent = '';
                        inTable = false;
                    }
                    // Check for checkbox items
                    if (line.match(/^\s*-\s*□/) || line.match(/^\s*-\s*â–¡/)) {
                        var processedLine = withHighlights ? processTextForHighlight(line) : escapeHtml(line);
                        html += processedLine + '<br>';
                    } else if (line.trim() === '---') {
                        html += '<hr style="border:none;border-top:1px dashed var(--border-primary);margin:8px 0;">';
                    } else {
                        var processedLine2 = withHighlights ? processTextForHighlight(line) : escapeHtml(line);
                        if (processedLine2.trim() === '') {
                            html += '<br>';
                        } else {
                            html += processedLine2 + '<br>';
                        }
                    }
                }
            }

            // Flush remaining table
            if (inTable) {
                tableContent += '</table></div>';
                html += tableContent;
            }

            // Close open section-body tags
            // Count opened section-blocks and close them
            var openDivs = (html.match(/<div class="section-body">/g) || []).length;
            var closeDivs = (html.match(/<\/div><\/div>/g) || []).length;
            // We need to close remaining open sections
            // Simple approach: just ensure the HTML is well-formed
            for (var j = 0; j < openDivs - closeDivs; j++) {
                html += '</div></div>';
            }

            return html;
        }

        function processTextForHighlight(text) {
            var result = escapeHtml(text);
            sensitiveWords.forEach(function(word) {
                var escaped = escapeHtml(word);
                if (result.indexOf(escaped) !== -1) {
                    result = result.split(escaped).join(
                        '<span class="highlight-sensitive" onclick="openLawPopupForWord(\'' + word + '\')" title="点击查看法规条文" role="button" aria-label="查看' + word + '相关法规">' + escaped + '</span>'
                    );
                }
            });
            return result;
        }

        function toggleSection(headerEl) {
            var toggle = headerEl.querySelector('.section-toggle');
            var body = headerEl.nextElementSibling;
            if (toggle && body) {
                toggle.classList.toggle('collapsed');
                body.classList.toggle('collapsed-content');
            }
        }

        // ===================== CLEAR =====================

        function clearAll() {
            document.getElementById('userInput').value = '';
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('outlineNav').classList.remove('show');
            document.querySelectorAll('.skill-card').forEach(function(card) { card.classList.remove('active'); });
            selectedSkill = null;
            currentRawText = '';
            currentFoundWords = [];
            updateCharCount();
            localStorage.removeItem('hrapp-draft');
        }

        // ===================== COPY =====================

        function copyResult() {
            var el = document.getElementById('resultContent');
            var text = el.innerText || el.textContent;
            navigator.clipboard.writeText(text).then(function() {
                var notice = document.getElementById('copyNotice');
                notice.classList.add('show');
                setTimeout(function() { notice.classList.remove('show'); }, 2000);
            }).catch(function() {
                // Fallback
                var ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                var notice = document.getElementById('copyNotice');
                notice.classList.add('show');
                setTimeout(function() { notice.classList.remove('show'); }, 2000);
            });
        }

        // ===================== EXPORT MARKDOWN =====================

        function exportMarkdown() {
            if (!currentRawText) { alert('请先生成方案框架'); return; }
            var demand = document.getElementById('userInput').value.trim() || '奥特莱斯方案';
            var filename = demand.replace(/[<>:"/\\|?*]/g, '_') + '.md';
            var blob = new Blob([currentRawText], { type: 'text/markdown;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(function() {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }

        // ===================== EXPORT WORD =====================

        function exportWord() {
            if (!currentRawText) { alert('请先生成方案框架'); return; }

            try {
                var demand = document.getElementById('userInput').value.trim() || '奥特莱斯方案';
                var filename = demand.replace(/[<>:"/\\|?*]/g, '_') + '.docx';

                var lines = currentRawText.split('\n');
                var children = [];

                for (var i = 0; i < lines.length; i++) {
                    var line = lines[i];

                    // Skip table separators
                    if (line.match(/^\|\s*[-:\s|]+\|$/)) continue;

                    var hMatch = line.match(/^(#{1,3})\s+(.+)/);
                    if (hMatch) {
                        var level = hMatch[1].length;
                        var text = hMatch[2];
                        var heading = new docx.Heading({
                            text: text,
                            heading: level === 1 ? docx.HeadingLevel.HEADING_1 :
                                    level === 2 ? docx.HeadingLevel.HEADING_2 :
                                    docx.HeadingLevel.HEADING_3,
                            alignment: docx.AlignmentType.LEFT
                        });
                        children.push(heading);
                    } else if (line.match(/^\|/)) {
                        // Table row
                        var cells = line.split('|').slice(1, -1);
                        var rowChildren = cells.map(function(cell) {
                            return new docx.TableCell({
                                children: [new docx.Paragraph({
                                    children: [new docx.TextRun({ text: cell.trim(), size: 20 })],
                                    alignment: docx.AlignmentType.LEFT
                                })],
                                width: { size: Math.floor(9000 / cells.length), type: docx.WidthType.DXA }
                            });
                        });
                        children.push(new docx.Table({
                            rows: [new docx.TableRow({ children: rowChildren })],
                            width: { size: 9000, type: docx.WidthType.DXA }
                        }));
                    } else if (line.trim() === '---') {
                        children.push(new docx.Paragraph({
                            children: [new docx.TextRun({ text: '————————————————', size: 20, color: '999999' })],
                            alignment: docx.AlignmentType.CENTER
                        }));
                    } else if (line.trim() !== '') {
                        children.push(new docx.Paragraph({
                            children: [new docx.TextRun({ text: line, size: 22 })],
                            spacing: { after: 120 }
                        }));
                    } else {
                        children.push(new docx.Paragraph({ children: [] }));
                    }
                }

                var doc = new docx.Document({
                    sections: [{
                        properties: {},
                        children: children
                    }]
                });

                docx.Packer.toBlob(doc).then(function(blob) {
                    saveAs(blob, filename);
                });
            } catch(e) {
                console.error('Word export error:', e);
                alert('导出Word失败：' + e.message + '\n请尝试使用Markdown导出。');
            }
        }

        // ===================== MAKE FUNCTIONS GLOBAL =====================
        // (Needed because onclick handlers are inline in HTML)

        window.selectSkill = selectSkill;
        window.generateResult = generateResult;
        window.clearAll = clearAll;
        window.copyResult = copyResult;
        window.exportMarkdown = exportMarkdown;
        window.exportWord = exportWord;
        window.toggleTheme = toggleTheme;
        window.toggleFontsizeMenu = toggleFontsizeMenu;
        window.setFontSize = setFontSize;
        window.filterScenes = filterScenes;
        window.removeRecent = removeRecent;
        window.selectHistoryItem = selectHistoryItem;
        window.toggleCheck = toggleCheck;
        window.toggleChecklistLaw = toggleChecklistLaw;
        window.toggleSection = toggleSection;
        window.scrollToSection = scrollToSection;
        window.openLawPopupForWord = openLawPopupForWord;
        window.closeLawPopup = function(e) {
            if (e && e.target && e.target.id !== 'lawPopupOverlay') return;
            document.getElementById('lawPopupOverlay').classList.remove('show');
        };
        window.onInputChange = onInputChange;
        window.showInputHistory = showInputHistory;

        // ===================== START =====================
        init();

    })();
    </script>
</body>
