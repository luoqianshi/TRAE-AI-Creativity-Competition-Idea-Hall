<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>随手记账 - 我的</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background-color: #E5E5EA; }
body {
  width: 100%;
  max-width: 390px;
  margin: 0 auto;
  min-height: 100vh;
  background-color: #F0F0F5;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  font-size: 14px;
  color: #333;
  padding-bottom: 160px;
  position: relative;
  overflow-x: hidden;
  box-shadow: 0 0 60px rgba(0,0,0,0.12);
}

/* 导航栏 */
.nav-bar {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 390px;
  height: 44px;
  background: linear-gradient(135deg, #4F6BF6 0%, #818CF8 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  color: white;
  font-size: 17px;
  font-weight: 600;
}

/* 容器 */
.container { padding: 54px 10px 20px; }

/* 通用卡片 */
.card {
  background: #FFFFFF;
  border-radius: 24px;
  margin-bottom: 10px;
  box-shadow: 0 1px 1px rgba(0,0,0,0.02), 0 2px 2px rgba(0,0,0,0.03), 0 2px 4px rgba(0,0,0,0.04), 0 4px 8px rgba(0,0,0,0.05), 0 8px 16px rgba(0,0,0,0.06), 0 12px 24px rgba(0,0,0,0.04);
  border: 0.5px solid rgba(255,255,255,0.9);
  position: relative;
  overflow: hidden;
}

/* 用户头部 */
.profile-header-native {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 14px;
  margin-bottom: 10px;
}
.profile-header-native .avatar {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  background: #F1F5F9;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  font-weight: 700;
  color: #64748B;
  flex-shrink: 0;
}
.profile-header-native .info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.profile-header-native .name { font-size: 25px; font-weight: 700; color: #0F172A; }
.profile-header-native .id { font-size: 12px; color: #94A3B8; font-family: monospace; }
.profile-actions { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; align-self: flex-start; margin-top: 2px; }
.action-capsule {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 70px;
  height: 28px;
  border-radius: 500px;
  font-size: 12px;
  font-weight: 600;
}
.action-capsule-pink {
  background: linear-gradient(135deg, #F9A8D4 0%, #F472B6 50%, #EC4899 100%);
  color: #FFFFFF;
  box-shadow: 0 1px 4px rgba(236,72,153,0.25);
}
.action-capsule-red {
  background: linear-gradient(135deg, #F43F5E 0%, #FB7185 100%);
  color: #FFFFFF;
  box-shadow: 0 1px 4px rgba(244,63,94,0.25);
}

/* 默认账本信息条 */
.default-book-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  background: linear-gradient(135deg, #FEF2F2 0%, #FEE2E2 100%);
  box-shadow: 0 4px 12px rgba(239,68,68,0.12), 0 1px 4px rgba(0,0,0,0.06);
}
.dbar-icon { font-size: 20px; flex-shrink: 0; }
.dbar-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.dbar-label { font-size: 11px; color: #B91C1C; font-weight: 600; }
.dbar-name { font-size: 15px; color: #991B1B; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 区域卡片 */
.section-card {
  padding: 0;
  overflow: hidden;
  border-radius: 24px;
  box-shadow: 0 4px 12px rgba(59,130,246,0.1), 0 1px 4px rgba(0,0,0,0.06);
}
.section-header {
  padding: 12px 14px;
  font-size: 21px;
  font-weight: 700;
  color: #0F172A;
  display: flex;
  align-items: center;
  gap: 6px;
  border-bottom: 0.5px solid #F1F5F9;
}
.section-header-icon { width: 38px; height: 38px; flex-shrink: 0; }
.menu-list { display: flex; flex-direction: column; }
.menu-item {
  display: flex;
  align-items: center;
  padding: 5px 14px;
  border-bottom: 0.5px solid #F1F5F9;
}
.menu-item:last-child { border-bottom: none; }
.item-icon-img { width: 30px; height: 30px; border-radius: 8px; margin-right: 10px; flex-shrink: 0; }
.item-text-wrap { flex: 1; display: flex; flex-direction: column; }
.item-text { font-size: 17px; color: #0F172A; font-weight: 500; }
.item-sub { font-size: 12px; color: #94A3B8; margin-top: 2px; }
.item-arrow { font-size: 12px; color: #CBD5E1; }
.default-tag {
  display: inline-block;
  padding: 1px 5px;
  margin-right: 3px;
  background: linear-gradient(135deg, #F43F5E 0%, #FB7185 100%);
  color: #FFFFFF;
  font-size: 13px;
  font-weight: 700;
  border-radius: 4px;
  vertical-align: middle;
}
.menu-action {
  font-size: 13px;
  color: #F43F5E;
  padding: 4px 8px;
  background: #FEE2E2;
  border-radius: 6px;
}
.empty-tip { text-align: center; padding: 20px; color: #94A3B8; font-size: 14px; }

/* 底部按钮 */
.btn-row { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 8px; gap: 10px; }
.source-btn {
  flex: 1;
  padding: 14px 0;
  border-radius: 20px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: white;
  background: linear-gradient(135deg, #4F6BF6 0%, #818CF8 100%);
  box-shadow: 0 4px 12px rgba(59,130,246,0.4);
}
.email-btn {
  flex: 1;
  padding: 14px 0;
  border-radius: 20px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: white;
  background: linear-gradient(135deg, #F59E0B 0%, #FBBF24 50%, #FDE68A 100%);
  box-shadow: 0 4px 12px rgba(245,158,11,0.4);
}
.source-url { display: block; text-align: center; font-size: 12px; color: #CBD5E1; padding: 0 10px 20px; word-break: break-all; }

/* 底部标签栏 */
.tab-bar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 24px);
  max-width: 366px;
  bottom: 12px;
  height: 65px;
  display: flex;
  align-items: stretch;
  z-index: 999;
  overflow: visible;
}
.tab-bar-bg {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 25px;
  border: 0.5px solid rgba(255,255,255,0.6);
  box-shadow: 0 1px 2px rgba(0,0,0,0.02), 0 4px 8px rgba(0,0,0,0.06), 0 8px 16px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.06), inset 0 0.5px 0 rgba(255,255,255,0.8);
  z-index: 0;
  pointer-events: none;
}
.tab-bar-side { flex: 1; display: flex; align-items: stretch; height: 100%; position: relative; z-index: 2; }
.tab-bar-side.left { padding-left: 4px; }
.tab-bar-side.right { padding-right: 4px; }
.tab-bar-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-decoration: none; }
.tab-icon { width: 27px; height: 27px; margin-bottom: 2px; display: flex; align-items: center; justify-content: center; }
.tab-icon-img { width: 100%; height: 100%; opacity: 0.6; filter: grayscale(100%); }
.tab-bar-item.active .tab-icon-img { opacity: 1; filter: none; transform: scale(1.05); }
.tab-text { font-size: 10px; color: #999999; }
.tab-bar-item.active .tab-text { color: #4F6BF6; font-weight: 600; }
.center-btn-wrap { flex: 1; position: relative; height: 100%; z-index: 3; pointer-events: none; }
.center-btn {
  position: absolute;
  left: 50%;
  bottom: 40px;
  transform: translateX(-50%);
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #1A1A1A;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2), 0 8px 16px rgba(0,0,0,0.25), 0 12px 24px rgba(0,0,0,0.2);
  z-index: 1002;
  pointer-events: auto;
  border: 2px solid rgba(255,255,255,0.9);
  cursor: pointer;
}
.icon-line { position: absolute; background: #FFFFFF; border-radius: 1px; }
.line-h { width: 16px; height: 2px; }
.line-v { width: 2px; height: 16px; }
</style>
</head>
<body>

<div class="nav-bar">我的</div>

<div class="container">
  <!-- 用户信息头部 -->
  <div class="profile-header-native card">
    <div class="avatar">张</div>
    <div class="info">
      <span class="name">张三</span>
      <span class="id">oKj8x5mGqL_nR2pT...</span>
    </div>
    <div class="profile-actions">
      <div class="action-capsule action-capsule-pink">改昵称</div>
      <div class="action-capsule action-capsule-red">注销</div>

  <!-- 默认账本信息 -->

        <span class="item-arrow">▶</span>
      </div>
    </div>
  </div>

  <!-- 账本管理 -->
  <div class="section-card card">
    <div class="section-header">
      <span>📒</span>
      <span>账本管理</span>
    </div>
    <div class="menu-list">
      <div class="menu-item">
        <div class="item-text-wrap">

        </div>
        <span class="item-arrow">▶</span>
      </div>
      <div class="menu-item">
        <div class="item-text-wrap">
          <span class="item-text">公司差旅</span>
          <span class="item-sub">45笔记录 · 成员</span>
        </div>
        <span class="menu-action">退出</span>
      </div>

  </div>

  <!-- 底部按钮 -->
  <div class="btn-row">
    <div class="source-btn">🔗 查看源代码和使用方法</div>
    <div class="email-btn">✉️ 向作者提意见和建议</div>
  </div>
  <span class="source-url">https://gitee.com/Yjkangkang/wechat-mini-program</span>
</div>

<!-- 底部标签栏 -->
<div class="tab-bar">
  <div class="tab-bar-bg"></div>
  <div class="tab-bar-side left">

    <a class="tab-bar-item" href="stats.html">

    </a>
  </div>
  <div class="center-btn-wrap">
    <a href="navbar.html" class="center-btn" style="text-decoration:none;">
      <div class="icon-line line-h"></div>

  <div class="tab-bar-side right">
