<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>随手记账 - 分类管理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background-color: #E5E5EA; }
body {
  width: 100%;
  max-width: 390px;
  margin: 0 auto;
  min-height: 100vh;
  background-color: #F0F0F5;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  font-size: 14px;
  color: #333;
  padding-bottom: 160px;
  position: relative;
  overflow-x: hidden;
  box-shadow: 0 0 60px rgba(0,0,0,0.12);
}

/* 导航栏 */
.nav-bar {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 390px;
  height: 44px;
  background: linear-gradient(135deg, #4F6BF6 0%, #818CF8 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  color: white;
  font-size: 17px;
  font-weight: 600;
}

/* 容器 */
.container { padding: 54px 10px 20px; }

/* 滑动切换器 */
.slide-switcher {
  position: relative;
  display: flex;
  background: #F1F5F9;
  border-radius: 18px;
  padding: 2px;
  margin: 6px 0 12px;
  height: 44px;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
}
.slide-switcher .slide-bg {
  position: absolute;
  top: 2px;
  left: 2px;
  width: calc(50% - 2px);
  height: calc(100% - 4px);
  border-radius: 18px;
  background: linear-gradient(135deg, #EF4444 0%, #F87171 100%);
  box-shadow: 0 4px 12px rgba(239,68,68,0.4);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  z-index: 1;
}
.slide-switcher .slide-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 700;
  color: #64748B;
  z-index: 2;
  border-radius: 18px;
}
.slide-switcher .slide-btn.active { color: white; }

/* 添加分类按钮 */
.add-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px;
  background: #FFFFFF;
  border: 1px dashed #E2E8F0;
  border-radius: 18px;
  color: #64748B;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
  box-shadow: 0 4px 12px rgba(59,130,246,0.15), 0 1px 4px rgba(0,0,0,0.06);
}
.add-icon { font-size: 18px; font-weight: bold; }

/* 分类列表项 */
.category-list-item {
  background: #FFFFFF;
  border-radius: 18px;
  margin-bottom: 8px;
  overflow: hidden;
  box-shadow: 0 4px 12px rgba(59,130,246,0.12), 0 1px 4px rgba(0,0,0,0.06);
}
.cat-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
}
.cat-list-icon {
  width: 60px;
  height: 40px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
}
.cat-list-icon.expense { background: #FEE2E2; }
.cat-list-icon.income { background: #D1FAE5; }
.cat-list-info { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cat-name-text { font-size: 17px; font-weight: 600; color: #0F172A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub-count { font-size: 12px; color: #94A3B8; }
.cat-actions { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
.icon-btn {
  width: 28px;
  height: 28px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.icon-btn.delete { background: #FEE2E2; color: #EF4444; }
.icon-btn.expand { background: #F1F5F9; color: #64748B; font-size: 12px; }
.icon-btn.expand.expanded { transform: rotate(180deg); }

/* 展开区域 */
.sub-list {
  background: #F8FAFC;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}
.sub-list.show { max-height: 1000px; }

/* 别名区域 */
.alias-section { padding: 8px 14px 8px 50px; border-bottom: 0.5px solid #F1F5F9; }
.alias-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.alias-title { font-size: 13px; color: #64748B; font-weight: 600; }
.alias-edit-btn { font-size: 12px; color: #3B82F6; font-weight: 500; }
.alias-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.alias-tag {
  font-size: 12px;
  color: #3B82F6;
  background: #EFF6FF;
  border: 0.5px solid #BFDBFE;
  padding: 3px 8px;
  border-radius: 8px;
  font-weight: 500;
}
.alias-empty-tip { font-size: 12px; color: #94A3B8; }

/* 添加二级分类 */
.add-sub-btn {
  padding: 7px 14px 7px 50px;
  color: #3B82F6;
  font-size: 15px;
  font-weight: 500;
  border-bottom: 0.5px solid #F1F5F9;
}

/* 二级分类项 */
.sub-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 14px 7px 50px;
  border-bottom: 0.5px solid #F1F5F9;
}
.sub-name { font-size: 16px; color: #64748B; }
.delete-sub-btn {
  font-size: 14px;
  color: #EF4444;
  padding: 4px 8px;
  background: #FEE2E2;
  border-radius: 50%;
}

/* 底部标签栏 */
.tab-bar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 24px);
  max-width: 366px;
  bottom: 12px;
  height: 65px;
  display: flex;
  align-items: stretch;
  z-index: 999;
  overflow: visible;
}
.tab-bar-bg {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 25px;
  border: 0.5px solid rgba(255,255,255,0.6);
  box-shadow: 0 1px 2px rgba(0,0,0,0.02), 0 4px 8px rgba(0,0,0,0.06), 0 8px 16px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.06), inset 0 0.5px 0 rgba(255,255,255,0.8);
  z-index: 0;
  pointer-events: none;
}
.tab-bar-side { flex: 1; display: flex; align-items: stretch; height: 100%; position: relative; z-index: 2; }
.tab-bar-side.left { padding-left: 4px; }
.tab-bar-side.right { padding-right: 4px; }
.tab-bar-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-decoration: none; }
.tab-icon { width: 27px; height: 27px; margin-bottom: 2px; display: flex; align-items: center; justify-content: center; }
.tab-icon-img { width: 100%; height: 100%; opacity: 0.6; filter: grayscale(100%); }
.tab-bar-item.active .tab-icon-img { opacity: 1; filter: none; transform: scale(1.05); }
.tab-text { font-size: 10px; color: #999999; }
.tab-bar-item.active .tab-text { color: #4F6BF6; font-weight: 600; }
.center-btn-wrap { flex: 1; position: relative; height: 100%; z-index: 3; pointer-events: none; }
.center-btn {
  position: absolute;
  left: 50%;
  bottom: 40px;
  transform: translateX(-50%);
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #1A1A1A;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2), 0 8px 16px rgba(0,0,0,0.25), 0 12px 24px rgba(0,0,0,0.2);
  z-index: 1002;
  pointer-events: auto;
  border: 2px solid rgba(255,255,255,0.9);
  cursor: pointer;
}
.icon-line { position: absolute; background: #FFFFFF; border-radius: 1px; }
.line-h { width: 16px; height: 2px; }
.line-v { width: 2px; height: 16px; }
</style>
</head>
<body>

<div class="nav-bar">分类管理</div>

        <span class="icon-btn expand">▼</span>

  </div>

  <!-- 收起的分类3 -->

        <span class="icon-btn delete">🗑️</span>
        <span class="icon-btn expand">▼</span>
      </div>
    </div>
  </div>

  <!-- 收起的分类4 -->
  <div class="category-list-item">
    <div class="cat-header">
      <div class="cat-list-icon expense">🏠</div>
      <div class="cat-list-info">
        <span class="cat-name-text">住房</span>

        <span class="icon-btn delete">🗑️</span>

      </div>
    </div>
  </div>

  <!-- 收起的分类5 -->
  <div class="category-list-item">

      <div class="cat-list-icon expense">🎮</div>
      <div class="cat-list-info">
        <span class="cat-name-text">娱乐</span>
