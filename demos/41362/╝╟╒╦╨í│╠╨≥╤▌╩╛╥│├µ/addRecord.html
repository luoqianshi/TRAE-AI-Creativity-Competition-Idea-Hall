<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>随手记账 - 记一笔</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background-color: #E5E5EA; }
body {
  width: 100%;
  max-width: 390px;
  margin: 0 auto;
  min-height: 100vh;
  background-color: #F0F0F5;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  font-size: 14px;
  color: #333;
  padding-bottom: 30px;
  position: relative;
  overflow-x: hidden;
  box-shadow: 0 0 60px rgba(0,0,0,0.12);
}

/* 导航栏 */
.nav-bar {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 390px;
  height: 44px;
  background: linear-gradient(135deg, #4F6BF6 0%, #818CF8 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  color: white;
  font-size: 17px;
  font-weight: 600;
}
.nav-back {
  position: absolute;
  left: 12px;
  font-size: 22px;
  color: white;
  text-decoration: none;
  line-height: 44px;
}

/* 容器 */
.container { padding: 54px 10px 20px; }

/* 通用卡片 */
.card {
  background: #FFFFFF;
  border-radius: 24px;
  padding: 15px;
  margin-bottom: 10px;
  box-shadow: 0 1px 1px rgba(0,0,0,0.02), 0 2px 2px rgba(0,0,0,0.03), 0 2px 4px rgba(0,0,0,0.04), 0 4px 8px rgba(0,0,0,0.05), 0 8px 16px rgba(0,0,0,0.06), 0 12px 24px rgba(0,0,0,0.04);
  border: 0.5px solid rgba(255,255,255,0.9);
  position: relative;
  overflow: hidden;
}

/* 滑动切换器 */
.slide-switcher {
  position: relative;
  display: flex;
  background: #F1F5F9;
  border-radius: 24px;
  padding: 2px;
  margin: 6px 0 10px;
  height: 44px;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
}
.slide-bg {
  position: absolute;
  top: 2px;
  left: 2px;
  width: calc(50% - 2px);
  height: calc(100% - 4px);
  border-radius: 24px;
  background: linear-gradient(135deg, #F43F5E 0%, #FB7185 100%);
  box-shadow: 0 2px 4px rgba(244,63,94,0.15), 0 4px 12px rgba(244,63,94,0.2);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  z-index: 1;
}
.slide-switcher.income-active .slide-bg {
  transform: translateX(calc(100% - 2px));
  background: linear-gradient(135deg, #10B981 0%, #34D399 100%);
  box-shadow: 0 2px 4px rgba(16,185,129,0.15), 0 4px 12px rgba(16,185,129,0.2);
}
.slide-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 700;
  color: #64748B;
  z-index: 2;
  transition: color 0.3s;
  border-radius: 24px;
  cursor: pointer;
}
.slide-btn.active { color: white; }

/* 日期输入 */
.input-group {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
}
.input-group .input-icon { font-size: 18px; color: #94A3B8; }
.input-group .input-value {
  flex: 1;
  font-size: 15px;
  font-weight: 600;
  color: #0F172A;
}

/* 金额输入 */
.amount-input-wrap {
  text-align: center;
  padding: 16px 14px;
  position: relative;
}
.amount-display {
  font-size: 31px;
  font-weight: 800;
  color: #0F172A;
  letter-spacing: -0.5px;
  display: block;
  margin-bottom: 8px;
}

/* 分类区域 */
.category-section { padding: 12px 8px; }
.section-title {
  font-size: 13px;
  color: #64748B;
  font-weight: 700;
  display: block;
  margin-bottom: 10px;
  padding: 0 7px;
}
.category-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 3px;
}
.category-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 2px 0;
  border-radius: 24px;
}
.category-icon-wrap {
  width: 77px;
  height: 42px;
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #F1F5F9;
  box-shadow: 0 1px 1px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.06);
  transition: all 0.2s;
}
.cat-icon { font-size: 26px; line-height: 1; white-space: nowrap; }
.cat-name {
  font-size: 11px;
  color: #64748B;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 75px;
  padding: 0 2px;
  font-weight: 500;
}
/* 支出选中状态 */
.category-item.active-expense .category-icon-wrap {
  background: linear-gradient(135deg, #F43F5E 0%, #FB7185 100%);
  box-shadow: 0 2px 4px rgba(244,63,94,0.15), 0 4px 12px rgba(244,63,94,0.2);
}
.category-item.active-expense .cat-icon { color: white; }
.category-item.active-expense .cat-name { color: #F43F5E; font-weight: 700; }
/* 收入选中状态 */
.category-item.active-income .category-icon-wrap {
  background: linear-gradient(135deg, #10B981 0%, #34D399 100%);
  box-shadow: 0 2px 4px rgba(16,185,129,0.15), 0 4px 12px rgba(16,185,129,0.2);
}
.category-item.active-income .cat-icon { color: white; }
.category-item.active-income .cat-name { color: #10B981; font-weight: 700; }

/* 二级分类 */
.sub-section { padding: 12px 14px; }
.subcategory-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  padding: 7px 14px;
  border-radius: 24px;
  font-size: 13px;
  background: #FFFFFF;
  color: #64748B;
  box-shadow: 0 1px 1px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.06);
  font-weight: 600;
}
.tag.active-expense {
  background: linear-gradient(135deg, #F43F5E 0%, #FB7185 100%);
  color: white;
  border-color: transparent;
  box-shadow: 0 2px 4px rgba(244,63,94,0.15), 0 4px 12px rgba(244,63,94,0.2);
}
.tag.active-income {
  background: linear-gradient(135deg, #10B981 0%, #34D399 100%);
  color: white;
  border-color: transparent;
  box-shadow: 0 2px 4px rgba(16,185,129,0.15), 0 4px 12px rgba(16,185,129,0.2);
}

/* 备注输入 */
.remark-input-box {
  flex: 1;
  font-size: 15px;
  color: #0F172A;
  background: transparent;
  border: none;
  outline: none;
}
.remark-input-box::placeholder { color: #94A3B8; font-weight: 500; }

/* 保存按钮 */
.save-btn {
  margin: 15px 0 10px;
  padding: 14px 0;
  font-size: 16px;
  font-weight: 700;
  width: 100%;
  text-align: center;
  color: white;
  background: linear-gradient(135deg, #4F6BF6 0%, #818CF8 100%);
  border-radius: 24px;
  box-shadow: 0 2px 4px rgba(59,130,246,0.15), 0 4px 12px rgba(59,130,246,0.2), 0 8px 24px rgba(59,130,246,0.15);
}
</style>
</head>
<body>

<div class="nav-bar">
  <a class="nav-back" href="index.html">◀</a>
  记一笔
</div>

<div class="container">
  <!-- 类型切换 -->
  <div class="slide-switcher">
    <div class="slide-bg"></div>
    <div class="slide-btn active">支出</div>
    <div class="slide-btn">收入</div>
  </div>

  <!-- 日期选择 -->
  <div class="input-group card">
    <span class="input-icon">📅</span>
    <span class="input-value">2025-06-23</span>
  </div>

  <!-- 金额输入 -->
  <div class="amount-input-wrap card">
    <span class="amount-display">0.00</span>
  </div>

  <!-- 一级分类 -->
  <div class="category-section card">
    <span class="section-title">选择分类</span>
    <div class="category-grid">
      <div class="category-item active-expense">
        <div class="category-icon-wrap"><span class="cat-icon">🍜</span></div>
        <span class="cat-name">餐饮</span>
      </div>
      <div class="category-item">
        <div class="category-icon-wrap"><span class="cat-icon">🚌</span></div>
        <span class="cat-name">交通</span>
      </div>
      <div class="category-item">
        <div class="category-icon-wrap"><span class="cat-icon">🛒</span></div>
        <span class="cat-name">购物</span>
      </div>
      <div class="category-item">
        <div class="category-icon-wrap"><span class="cat-icon">🏠</span></div>
        <span class="cat-name">住房</span>
      </div>
      <div class="category-item">
        <div class="category-icon-wrap"><span class="cat-icon">🎮</span></div>
        <span class="cat-name">娱乐</span>
      </div>
      <div class="category-item">
        <div class="category-icon-wrap"><span class="cat-icon">💊</span></div>
        <span class="cat-name">医疗</span>
      </div>
      <div class="category-item">
        <div class="category-icon-wrap"><span class="cat-icon">📱</span></div>
        <span class="cat-name">通讯</span>
      </div>
      <div class="category-item">
        <div class="category-icon-wrap"><span class="cat-icon">📚</span></div>
        <span class="cat-name">教育</span>
      </div>
    </div>
  </div>

  <!-- 二级分类 -->
  <div class="sub-section card">
    <span class="section-title">二级分类</span>
    <div class="subcategory-tags">
      <span class="tag active-expense">早餐</span>
      <span class="tag">午餐</span>
      <span class="tag">晚餐</span>
      <span class="tag">夜宵</span>
      <span class="tag">饮品</span>
      <span class="tag">水果</span>
      <span class="tag">零食</span>
      <span class="tag">外卖</span>
    </div>
  </div>

  <!-- 备注 -->
  <div class="input-group card">
    <span class="input-icon">📝</span>
    <input class="remark-input-box" placeholder="添加备注（可选）" />
  </div>

  <!-- 保存按钮 -->
  <div class="save-btn">保存记录</div>
</div>

</body>
</html>
