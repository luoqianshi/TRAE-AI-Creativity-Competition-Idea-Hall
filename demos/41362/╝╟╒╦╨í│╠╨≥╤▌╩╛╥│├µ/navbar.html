<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>随手记账 - 导航栏交互</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background-color: #E5E5EA; }
body {
  width: 100%;
  max-width: 390px;
  margin: 0 auto;
  min-height: 100vh;
  background-color: #F0F0F5;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  font-size: 14px;
  color: #333;
  padding-bottom: 160px;
  position: relative;
  overflow-x: hidden;
  box-shadow: 0 0 60px rgba(0,0,0,0.12);
}

/* 导航栏 */
.nav-bar {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 390px;
  height: 44px;
  background: linear-gradient(135deg, #4F6BF6 0%, #818CF8 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  color: white;
  font-size: 17px;
  font-weight: 600;
}

/* 容器 */
.container { padding: 54px 10px 20px; }

/* 通用卡片 */
.card {
  background: #FFFFFF;
  border-radius: 24px;
  padding: 15px;
  margin-bottom: 10px;
  box-shadow: 0 1px 1px rgba(0,0,0,0.02), 0 2px 2px rgba(0,0,0,0.03), 0 2px 4px rgba(0,0,0,0.04), 0 4px 8px rgba(0,0,0,0.05), 0 8px 16px rgba(0,0,0,0.06), 0 12px 24px rgba(0,0,0,0.04);
  border: 0.5px solid rgba(255,255,255,0.9);
  position: relative;
  overflow: hidden;
}

/* 提示文字 */
.hint-section { text-align: center; padding: 40px 20px; }
.hint-icon { font-size: 60px; margin-bottom: 16px; opacity: 0.7; }
.hint-title { font-size: 20px; font-weight: 700; color: #0F172A; margin-bottom: 12px; }
.hint-sub { font-size: 14px; color: #64748B; line-height: 1.6; }
.hint-arrow {
  display: inline-block;
  font-size: 30px;
  color: #1A1A1A;
  margin-top: 24px;
  animation: bounce 1.5s infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* ============== 遮罩层 ============== */
.overlay {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 390px;
  height: 100%;
  background: rgba(0, 0, 0, 0);
  z-index: 997;
  pointer-events: none;
  transition: background 0.32s ease;
}
.overlay.active {
  background: rgba(0, 0, 0, 0.32);
  pointer-events: auto;
}

/* ============== 底栏主体：胶囊样式，悬浮不贴底 ============== */
.tab-bar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 24px);
  max-width: 366px;
  bottom: 12px;
  height: 65px;
  background: transparent;
  display: flex;
  align-items: stretch;
  z-index: 999;
  overflow: visible;
}
.tab-bar-bg {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 25px;
  border: 0.5px solid rgba(255,255,255,0.6);
  box-shadow: 0 1px 2px rgba(0,0,0,0.02), 0 4px 8px rgba(0,0,0,0.06), 0 8px 16px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.06), inset 0 0.5px 0 rgba(255,255,255,0.8);
  z-index: 0;
  pointer-events: none;
}

/* 两侧 tab */
.tab-bar-side { flex: 1; display: flex; align-items: stretch; height: 100%; position: relative; z-index: 2; }
.tab-bar-side.left { padding-left: 4px; }
.tab-bar-side.right { padding-right: 4px; }
.tab-bar-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  text-decoration: none;
  cursor: pointer;
}
.tab-icon { width: 27px; height: 27px; margin-bottom: 2px; display: flex; align-items: center; justify-content: center; }
.tab-icon-img {
  width: 100%;
  height: 100%;
  opacity: 0.6;
  filter: grayscale(100%);
  transition: filter 0.25s ease, opacity 0.25s ease, transform 0.25s ease;
}
.tab-bar-item.active .tab-icon-img { opacity: 1; filter: none; transform: scale(1.05); }
.tab-text { font-size: 10px; color: #999999; transition: color 0.25s ease; }
.tab-bar-item.active .tab-text { color: #4F6BF6; font-weight: 600; }

/* ============== 中间黑色按钮 ============== */
.center-btn-wrap { flex: 1; position: relative; height: 100%; z-index: 3; pointer-events: none; }
.center-btn {
  position: absolute;
  left: 50%;
  bottom: 40px;
  transform: translateX(-50%);
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #1A1A1A;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2), 0 8px 16px rgba(0,0,0,0.25), 0 12px 24px rgba(0,0,0,0.2);
  transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
  z-index: 1002;
  pointer-events: auto;
  border: 2px solid rgba(255,255,255,0.9);
  cursor: pointer;
}
.center-btn:active { transform: translateX(-50%) scale(0.9); }
.center-btn.open {
  box-shadow: 0 6px 12px rgba(0,0,0,0.25), 0 12px 24px rgba(0,0,0,0.3), 0 16px 32px rgba(0,0,0,0.25);
  transform: translateX(-50%) rotate(45deg);
}

/* + 号两条线 */
.icon-line {
  position: absolute;
  background: #FFFFFF;
  border-radius: 1px;
  transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
}
.line-h { width: 16px; height: 2px; }
.line-v { width: 2px; height: 16px; }
.center-btn.open .line-h { transform: rotate(90deg); }
.center-btn.open .line-v { transform: rotate(90deg); }

/* ============== 三个弹出的轨道按钮 ============== */
.orbit-group {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 77px;
  width: 0;
  height: 0;
  z-index: 1001;
  pointer-events: none;
}

.orbit-btn {
  position: absolute;
  left: -25px;
  top: -25px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 2px solid #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.06), 0 4px 8px rgba(0,0,0,0.04);
  pointer-events: none;
  transform-origin: 25px 25px;
  opacity: 0;
  transform: rotate(-90deg) translateY(-70px) scale(0);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
}

.orbit-btn .orbit-icon {
  font-size: 24px;
  line-height: 1;
  transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
}

.orbit-group.open .orbit-btn.expense {
  opacity: 1;
  pointer-events: auto;
  transform: rotate(-60deg) translateY(-70px) scale(1);
  animation: orbit-out-45 0.42s cubic-bezier(0.22,1,0.36,1) forwards;
}
.orbit-group.open .orbit-btn.voice {
  opacity: 1;
  pointer-events: auto;
  animation: orbit-out-90 0.46s cubic-bezier(0.22,1,0.36,1) 0.04s forwards;
}
.orbit-group.open .orbit-btn.transfer {
  opacity: 1;
  pointer-events: auto;
  animation: orbit-out-135 0.50s cubic-bezier(0.22,1,0.36,1) 0.08s forwards;
}

.orbit-group.has-opened:not(.open) .orbit-btn.expense {
  animation: orbit-in-45 0.32s cubic-bezier(0.4,0,0.2,1) forwards;
}
.orbit-group.has-opened:not(.open) .orbit-btn.voice {
  animation: orbit-in-90 0.32s cubic-bezier(0.4,0,0.2,1) 0.04s forwards;
}
.orbit-group.has-opened:not(.open) .orbit-btn.transfer {
  animation: orbit-in-135 0.32s cubic-bezier(0.4,0,0.2,1) 0.08s forwards;
}

/* 图标反向旋转 */
.orbit-group.open .orbit-btn.expense .orbit-icon { animation: icon-out-45 0.42s cubic-bezier(0.22,1,0.36,1) forwards; }
.orbit-group.open .orbit-btn.voice .orbit-icon { animation: icon-out-90 0.46s cubic-bezier(0.22,1,0.36,1) 0.04s forwards; }
.orbit-group.open .orbit-btn.transfer .orbit-icon { animation: icon-out-135 0.50s cubic-bezier(0.22,1,0.36,1) 0.08s forwards; }
.orbit-group.has-opened:not(.open) .orbit-btn.expense .orbit-icon { animation: icon-in-45 0.32s cubic-bezier(0.4,0,0.2,1) forwards; }
.orbit-group.has-opened:not(.open) .orbit-btn.voice .orbit-icon { animation: icon-in-90 0.32s cubic-bezier(0.4,0,0.2,1) 0.04s forwards; }
.orbit-group.has-opened:not(.open) .orbit-btn.transfer .orbit-icon { animation: icon-in-135 0.32s cubic-bezier(0.4,0,0.2,1) 0.08s forwards; }

.orbit-btn.expense { background: #EF4444; }
.orbit-btn.voice { background: #10B981; }
.orbit-btn.transfer { background: #4F6BF6; }

@keyframes orbit-out-45 {
  0%   { transform: rotate(-90deg) translateY(-70px) scale(1); opacity: 1; }
  100% { transform: rotate(-60deg) translateY(-70px) scale(1); opacity: 1; }
}
@keyframes orbit-in-45 {
  0%   { transform: rotate(-60deg) translateY(-70px) scale(1); opacity: 1; }
  99%  { transform: rotate(-90deg) translateY(-70px) scale(1); opacity: 1; }
  100% { transform: rotate(-90deg) translateY(-70px) scale(0); opacity: 0; }
}
@keyframes orbit-out-90 {
  0%   { transform: rotate(-90deg) translateY(-70px) scale(1); opacity: 1; }
  100% { transform: rotate(0deg) translateY(-70px) scale(1); opacity: 1; }
}
@keyframes orbit-in-90 {
  0%   { transform: rotate(0deg) translateY(-70px) scale(1); opacity: 1; }
  99%  { transform: rotate(-90deg) translateY(-70px) scale(1); opacity: 1; }
  100% { transform: rotate(-90deg) translateY(-70px) scale(0); opacity: 0; }
}
@keyframes orbit-out-135 {
  0%   { transform: rotate(-90deg) translateY(-70px) scale(1); opacity: 1; }
  100% { transform: rotate(60deg) translateY(-70px) scale(1); opacity: 1; }
}
@keyframes orbit-in-135 {
  0%   { transform: rotate(60deg) translateY(-70px) scale(1); opacity: 1; }
  99%  { transform: rotate(-90deg) translateY(-70px) scale(1); opacity: 1; }
  100% { transform: rotate(-90deg) translateY(-70px) scale(0); opacity: 0; }
}

@keyframes icon-out-45 {
  0%   { transform: rotate(90deg); }
  100% { transform: rotate(60deg); }
}
@keyframes icon-in-45 {
  0%   { transform: rotate(60deg); }
  99%  { transform: rotate(90deg); }
  100% { transform: rotate(90deg); }
}
@keyframes icon-out-90 {
  0%   { transform: rotate(90deg); }
  100% { transform: rotate(0deg); }
}
@keyframes icon-in-90 {
  0%   { transform: rotate(0deg); }
  99%  { transform: rotate(90deg); }
  100% { transform: rotate(90deg); }
}
@keyframes icon-out-135 {
  0%   { transform: rotate(90deg); }
  100% { transform: rotate(-60deg); }
}
@keyframes icon-in-135 {
  0%   { transform: rotate(-60deg); }
  99%  { transform: rotate(90deg); }
  100% { transform: rotate(90deg); }
}

.orbit-btn:active { transform: rotate(var(--ang, -90deg)) translateY(-70px) scale(0.9); }

/* ============== 标签 ============== */
.orbit-label {
  position: absolute;
  left: 0;
  top: 0;
  font-size: 11px;
  color: #FFFFFF;
  background: rgba(0,0,0,0.55);
  padding: 2px 7px;
  border-radius: 8px;
  white-space: nowrap;
  font-weight: 600;
  text-align: center;
  pointer-events: none;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  opacity: 0;
  transform-origin: 0 0;
  transform: rotate(-90deg) translateY(-120px) translate(-50%, -50%) scale(0);
}

.orbit-group.open .orbit-label.label-45 {
  animation: label-out-45 0.42s cubic-bezier(0.22,1,0.36,1) forwards;
}
.orbit-group.open .orbit-label.label-90 {
  animation: label-out-90 0.46s cubic-bezier(0.22,1,0.36,1) 0.04s forwards;
}
.orbit-group.open .orbit-label.label-135 {
  animation: label-out-135 0.50s cubic-bezier(0.22,1,0.36,1) 0.08s forwards;
}
.orbit-group.has-opened:not(.open) .orbit-label.label-45 {
  animation: label-in-45 0.32s cubic-bezier(0.4,0,0.2,1) forwards;
}
.orbit-group.has-opened:not(.open) .orbit-label.label-90 {
  animation: label-in-90 0.32s cubic-bezier(0.4,0,0.2,1) 0.04s forwards;
}
.orbit-group.has-opened:not(.open) .orbit-label.label-135 {
  animation: label-in-135 0.32s cubic-bezier(0.4,0,0.2,1) 0.08s forwards;
}

@keyframes label-out-45 {
  0%   { transform: rotate(-90deg) translateY(-120px) translate(-50%, -50%) scale(0); opacity: 0; }
  30%  { opacity: 1; }
  100% { transform: rotate(-60deg) translateY(-120px) translate(-50%, -50%) scale(1); opacity: 1; }
}
@keyframes label-in-45 {
  0%   { transform: rotate(-60deg) translateY(-120px) translate(-50%, -50%) scale(1); opacity: 1; }
  70%  { opacity: 1; }
  100% { transform: rotate(-90deg) translateY(-120px) translate(-50%, -50%) scale(0); opacity: 0; }
}
@keyframes label-out-90 {
  0%   { transform: rotate(-90deg) translateY(-120px) translate(-50%, -50%) scale(0); opacity: 0; }
  30%  { opacity: 1; }
  100% { transform: rotate(0deg) translateY(-120px) translate(-50%, -50%) scale(1); opacity: 1; }
}
@keyframes label-in-90 {
  0%   { transform: rotate(0deg) translateY(-120px) translate(-50%, -50%) scale(1); opacity: 1; }
  70%  { opacity: 1; }
  100% { transform: rotate(-90deg) translateY(-120px) translate(-50%, -50%) scale(0); opacity: 0; }
}
@keyframes label-out-135 {
  0%   { transform: rotate(-90deg) translateY(-120px) translate(-50%, -50%) scale(0); opacity: 0; }
  30%  { opacity: 1; }
  100% { transform: rotate(60deg) translateY(-120px) translate(-50%, -50%) scale(1); opacity: 1; }
}
@keyframes label-in-135 {
  0%   { transform: rotate(60deg) translateY(-120px) translate(-50%, -50%) scale(1); opacity: 1; }
  70%  { opacity: 1; }
  100% { transform: rotate(-90deg) translateY(-120px) translate(-50%, -50%) scale(0); opacity: 0; }
}

/* 页面说明卡片 */
.desc-card {
  padding: 20px;
  margin-bottom: 10px;
}
.desc-title {
  font-size: 18px;
  font-weight: 700;
  color: #0F172A;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.desc-list { padding-left: 18px; }
.desc-list li {
  font-size: 13px;
  color: #64748B;
  line-height: 2;
  font-weight: 500;
}
.desc-list li strong {
  color: #0F172A;
  font-weight: 600;
}
.desc-dot-red { color: #EF4444; font-weight: 700; }
.desc-dot-green { color: #10B981; font-weight: 700; }
.desc-dot-blue { color: #4F6BF6; font-weight: 700; }
</style>
</head>
<body>

<div class="nav-bar">随手记账</div>

<div class="container">
  <!-- 提示区域 -->
  <div class="hint-section">
    <div class="hint-icon">📌</div>
    <div class="hint-title">导航栏交互演示</div>
    <div class="hint-sub">
      点击底部中间的<span style="color:#1A1A1A;font-weight:700;">黑色圆形按钮</span>，<br>
      体验三个功能按钮的弹出动画效果
    </div>
    <div class="hint-arrow">⬇️</div>
  </div>

  <!-- 说明卡片 -->
  <div class="desc-card card">
    <div class="desc-title">🔘 三个功能按钮</div>
    <ul class="desc-list">
      <li><span class="desc-dot-red">●</span> <strong>记支出</strong> — 快速记录一笔支出</li>
      <li><span class="desc-dot-green">●</span> <strong>语音记</strong> — 语音记账，自动识别</li>
      <li><span class="desc-dot-blue">●</span> <strong>详情页</strong> — 查看默认账本详情</li>
    </ul>
  </div>

  <div class="desc-card card">
    <div class="desc-title">📑 四个标签页</div>
    <ul class="desc-list">
      <li><strong>📕 账本</strong> — 查看所有账本列表</li>
      <li><strong>📊 统计</strong> — 汇总分析与图表</li>
      <li><strong>🏷️ 分类</strong> — 管理收支分类</li>
      <li><strong>💙 我的</strong> — 个人信息与数据管理</li>
    </ul>
  </div>
</div>

<!-- 遮罩层 -->
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- 三个轨道按钮 + 标签 -->
<div class="orbit-group" id="orbitGroup">
  <div class="orbit-label label-45">记支出</div>
  <div class="orbit-label label-90">语音记</div>
  <div class="orbit-label label-135">详情页</div>

  <div class="orbit-btn expense" style="--ang: -60deg;" onclick="onOrbitTap('expense')">
    <span class="orbit-icon">✏️</span>
  </div>
  <div class="orbit-btn voice" style="--ang: 0deg;" onclick="onOrbitTap('voice')">
    <span class="orbit-icon">🎙️</span>
  </div>
  <div class="orbit-btn transfer" style="--ang: 60deg;" onclick="onOrbitTap('detail')">
    <span class="orbit-icon">📋</span>
  </div>
</div>

<!-- 底栏 -->
<div class="tab-bar">
  <div class="tab-bar-bg"></div>
  <div class="tab-bar-side left">
    <a class="tab-bar-item active" href="index.html" onclick="closeMenu()">
      <div class="tab-icon"><span style="font-size:22px">📕</span></div>
      <div class="tab-text">账本</div>
    </a>
    <a class="tab-bar-item" href="stats.html" onclick="closeMenu()">
      <div class="tab-icon"><span style="font-size:22px">📊</span></div>
      <div class="tab-text">统计</div>
    </a>
  </div>
  <div class="center-btn-wrap">
    <div class="center-btn" id="centerBtn" onclick="toggleMenu()">
      <div class="icon-line line-h"></div>
      <div class="icon-line line-v"></div>
    </div>
  </div>
  <div class="tab-bar-side right">
    <a class="tab-bar-item" href="category.html" onclick="closeMenu()">
      <div class="tab-icon"><span style="font-size:22px">🏷️</span></div>
      <div class="tab-text">分类</div>
    </a>
    <a class="tab-bar-item" href="profile.html" onclick="closeMenu()">
      <div class="tab-icon"><span style="font-size:22px">💙</span></div>
      <div class="tab-text">我的</div>
    </a>
  </div>
</div>

<script>
var menuOpen = false;
var hasOpened = false;

function toggleMenu() {
  if (menuOpen) {
    closeMenu();
  } else {
    openMenu();
  }
}

function openMenu() {
  menuOpen = true;
  hasOpened = true;
  document.getElementById('centerBtn').classList.add('open');
  document.getElementById('orbitGroup').classList.add('open');
  document.getElementById('orbitGroup').classList.add('has-opened');
  document.getElementById('overlay').classList.add('active');
}

function closeMenu() {
  if (!menuOpen) return;
  menuOpen = false;
  document.getElementById('centerBtn').classList.remove('open');
  document.getElementById('orbitGroup').classList.remove('open');
  document.getElementById('overlay').classList.remove('active');
}

function onOrbitTap(action) {
  var pages = {
    expense: 'addRecord.html',
    voice: 'index.html',
    detail: 'book.html'
  };
  // 关闭菜单后跳转
  setTimeout(function() {
    closeMenu();
    if (pages[action]) {
      window.location.href = pages[action];
    }
  }, 200);
}
</script>

</body>
</html>
