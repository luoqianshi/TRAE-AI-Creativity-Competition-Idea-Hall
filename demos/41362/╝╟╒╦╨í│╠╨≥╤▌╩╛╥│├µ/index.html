<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>随手记账 - 账本</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background-color: #E5E5EA; }
body {
  width: 100%;
  max-width: 390px;
  margin: 0 auto;
  min-height: 100vh;
  background-color: #F0F0F5;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  font-size: 14px;
  color: #333;
  padding-bottom: 160px;
  position: relative;
  overflow-x: hidden;
  box-shadow: 0 0 60px rgba(0,0,0,0.12);
}

/* 导航栏 */
.nav-bar {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 390px;
  height: 44px;
  background: linear-gradient(135deg, #4F6BF6 0%, #818CF8 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  color: white;
  font-size: 17px;
  font-weight: 600;
}
.nav-bar::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 0.5px;
  background: rgba(0,0,0,0.1);
}

/* 页面内容 */
.container {
  padding: 54px 10px 20px;
}

/* 页面头部 */
.page-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding: 0 3px;
}
.page-header-row .title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 18px;
  font-weight: 800;
  color: #0F172A;
  letter-spacing: -0.15px;
}
.page-header-row .title .icon { font-size: 20px; }
.new-ledger-btn {
  background: linear-gradient(135deg, #4F6BF6 0%, #818CF8 100%);
  color: white;
  padding: 7px 14px;
  border-radius: 24px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(79,107,246,0.08), 0 2px 4px rgba(79,107,246,0.12), 0 4px 8px rgba(129,140,248,0.1);
}

/* 卡片 */
.ledger-card {
  background: #FFFFFF;
  border-radius: 24px;
  margin-bottom: 10px;
  border: 0.5px solid rgba(255,255,255,0.9);
  position: relative;
  overflow: hidden;
  box-shadow: 0 1px 1px rgba(0,0,0,0.02), 0 2px 2px rgba(0,0,0,0.03), 0 2px 4px rgba(0,0,0,0.04), 0 4px 8px rgba(0,0,0,0.05), 0 8px 16px rgba(0,0,0,0.06), 0 12px 24px rgba(0,0,0,0.04);
}
.default-stripe {
  height: 5px;
  background: linear-gradient(135deg, #F43F5E 0%, #FB7185 100%);
  border-radius: 3px;
  margin: 4px 16px 10px 16px;
}
.card-body { padding: 12px 14px 3px 14px; }
.ledger-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 5px;
}
.ledger-name {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  overflow: hidden;
}
.ledger-name .name {
  font-size: 16px;
  font-weight: 700;
  color: #0F172A;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.label-badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 24px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
  box-shadow: 0 1px 1px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.06);
}
.badge-admin { background: linear-gradient(135deg, #FEF3C7, #FDE68A); color: #B45309; }
.badge-member { background: #F1F5F9; color: #64748B; }
.ledger-actions { display: flex; gap: 8px; flex-shrink: 0; }
.act-btn {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
.act-btn.edit { background: #DBEAFE; }
.act-btn.del { background: #FEE2E2; }
.ledger-amounts { display: flex; gap: 20px; margin-bottom: 2px; }
.ledger-amounts .lbl {
  font-size: 11px;
  color: #94A3B8;
  margin-bottom: 2px;
  display: block;
  font-weight: 500;
}
.ledger-amounts .val { font-size: 20px; font-weight: 800; letter-spacing: -0.25px; }
.ledger-amounts .val-exp { color: #F43F5E; }
.ledger-amounts .val-inc { color: #10B981; }
.ledger-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 5px;
  padding-top: 4px;
  border-top: 0.5px solid #F1F5F9;
  gap: 8px;
}
.ledger-meta { font-size: 11px; color: #94A3B8; font-weight: 500; flex: 1; min-width: 0; }
.default-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 5px 11px;
  border-radius: 500px;
  font-size: 11px;
  font-weight: 600;
  line-height: 1;
}
.default-btn-idle {
  background: #EFF6FF;
  color: #4F6BF6;
  border: 0.5px solid #DBEAFE;
}
.default-btn-active {
  background: linear-gradient(135deg, #F43F5E 0%, #FB7185 100%);
  color: #FFFFFF;
  box-shadow: 0 1px 2px rgba(244,63,94,0.08), 0 2px 4px rgba(244,63,94,0.12);
}

/* 底部标签栏 */
.tab-bar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 24px);
  max-width: 366px;
  bottom: 12px;
  height: 65px;
  display: flex;
  align-items: stretch;
  z-index: 999;
  overflow: visible;
}
.tab-bar-bg {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 25px;
  border: 0.5px solid rgba(255,255,255,0.6);
  box-shadow: 0 1px 2px rgba(0,0,0,0.02), 0 4px 8px rgba(0,0,0,0.06), 0 8px 16px rgba(0,0,0,0.08), 0 12px 32px rgba(0,0,0,0.06), inset 0 0.5px 0 rgba(255,255,255,0.8);
  z-index: 0;
  pointer-events: none;
}
.tab-bar-side {
  flex: 1;
  display: flex;
  align-items: stretch;
  height: 100%;
  position: relative;
  z-index: 2;
}
.tab-bar-side.left { padding-left: 4px; }
.tab-bar-side.right { padding-right: 4px; }
.tab-bar-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  text-decoration: none;
}
.tab-icon {
  width: 27px;
  height: 27px;
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.tab-icon-img {
  width: 100%;
  height: 100%;
  opacity: 0.6;
  filter: grayscale(100%);
}
.tab-bar-item.active .tab-icon-img {
  opacity: 1;
  filter: none;
  transform: scale(1.05);
}
.tab-text {
  font-size: 10px;
  color: #999999;
}
.tab-bar-item.active .tab-text {
  color: #4F6BF6;
  font-weight: 600;
}
.center-btn-wrap {
  flex: 1;
  position: relative;
  height: 100%;
  z-index: 3;
  pointer-events: none;
}
.center-btn {
  position: absolute;
  left: 50%;
  bottom: 40px;
  transform: translateX(-50%);
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #1A1A1A;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2), 0 8px 16px rgba(0,0,0,0.25), 0 12px 24px rgba(0,0,0,0.2);
  z-index: 1002;
  pointer-events: auto;
  border: 2px solid rgba(255,255,255,0.9);
  cursor: pointer;
  transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
}
.center-btn:active { transform: translateX(-50%) scale(0.9); }
.icon-line {
  position: absolute;
  background: #FFFFFF;
  border-radius: 1px;
}
.line-h { width: 16px; height: 2px; }
.line-v { width: 2px; height: 16px; }

/* 页面导航提示 */
.page-nav-hint {
  position: fixed;
  top: 50px;
  right: 10px;
  z-index: 200;
  background: rgba(0,0,0,0.5);
  color: white;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 11px;
}
</style>
</head>
<body>

<div class="nav-bar">想记就记</div>

<div class="container">
  <div class="page-header-row">
    <div class="title">
      <span class="icon">📒</span>
      <span>我的账本</span>
    </div>
    <div class="new-ledger-btn">+ 新建账本</div>
  </div>

  <!-- 默认账本卡片 -->
  <div class="ledger-card">
    <div class="card-body">
      <div class="default-stripe"></div>
      <div class="ledger-header">
        <div class="ledger-name">
          <span class="name">日常开销</span>
          <span class="label-badge badge-admin">管理员</span>
        </div>
        <div class="ledger-actions">
          <span class="act-btn edit">✏️</span>
          <span class="act-btn del">🗑️</span>
        </div>
      </div>
      <div class="ledger-amounts">
        <div>
          <span class="lbl">支出</span>
          <span class="val val-exp">3,856.50</span>
        </div>
        <div>
          <span class="lbl">收入</span>
          <span class="val val-inc">12,000.00</span>
        </div>
      </div>
      <div class="ledger-footer">
        <span class="ledger-meta">创建于 2025-01-15 · 共 128 笔记录</span>
        <span class="default-btn default-btn-active">✓ 默认账本</span>
      </div>
    </div>
  </div>

  <!-- 普通账本卡片 -->
  <div class="ledger-card">
    <div class="card-body">
      <div class="ledger-header">
        <div class="ledger-name">
          <span class="name">家庭共享账本</span>
          <span class="label-badge badge-admin">管理员</span>
        </div>
        <div class="ledger-actions">
          <span class="act-btn edit">✏️</span>
          <span class="act-btn del">🗑️</span>
        </div>
      </div>
      <div class="ledger-amounts">
        <div>
          <span class="lbl">支出</span>
          <span class="val val-exp">8,230.80</span>
        </div>
        <div>
          <span class="lbl">收入</span>
          <span class="val val-inc">25,600.00</span>
        </div>
      </div>
      <div class="ledger-footer">
        <span class="ledger-meta">创建于 2025-03-08 · 共 256 笔记录</span>
        <span class="default-btn default-btn-idle">设为默认账本</span>
      </div>
    </div>
  </div>

  <!-- 成员账本卡片 -->
  <div class="ledger-card">
    <div class="card-body">
      <div class="ledger-header">
        <div class="ledger-name">
          <span class="name">公司差旅</span>
          <span class="label-badge badge-member">👤 成员</span>
        </div>
      </div>
      <div class="ledger-amounts">
        <div>
          <span class="lbl">支出</span>
          <span class="val val-exp">1,580.00</span>
        </div>
        <div>
          <span class="lbl">收入</span>
          <span class="val val-inc">0.00</span>
        </div>
      </div>
      <div class="ledger-footer">
        <span class="ledger-meta">创建于 2025-06-01 · 共 45 笔记录</span>
        <span class="default-btn default-btn-idle">设为默认账本</span>
      </div>
    </div>
  </div>
</div>

<!-- 底部标签栏 -->
<div class="tab-bar">
  <div class="tab-bar-bg"></div>
  <div class="tab-bar-side left">
    <a class="tab-bar-item active" href="index.html">
      <div class="tab-icon"><span style="font-size:22px">📕</span></div>
      <div class="tab-text">账本</div>
    </a>
    <a class="tab-bar-item" href="stats.html">
      <div class="tab-icon"><span style="font-size:22px">📊</span></div>
      <div class="tab-text">统计</div>
    </a>
  </div>
  <div class="center-btn-wrap">
    <a href="navbar.html" class="center-btn" style="text-decoration:none;">
      <div class="icon-line line-h"></div>
      <div class="icon-line line-v"></div>
    </a>
  </div>
  <div class="tab-bar-side right">
    <a class="tab-bar-item" href="category.html">
      <div class="tab-icon"><span style="font-size:22px">🏷️</span></div>
      <div class="tab-text">分类</div>
    </a>
    <a class="tab-bar-item" href="profile.html">
      <div class="tab-icon"><span style="font-size:22px">💙</span></div>
      <div class="tab-text">我的</div>
    </a>
  </div>
</div>

</body>
</html>
