<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>眠光钮 · 语音调光模拟器</title>
  <style>
    :root {
      --bg-dark: #0a1929;
      --bg-card: #12253d;
      --text-primary: #e0e7ff;
      --text-secondary: #a5b4fc;
      --accent-gold: #fbbf24;
      --accent-gold-light: #fcd34d;
      --border: #1e3a5f;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      --transition: all 0.3s ease;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      background: linear-gradient(135deg, var(--bg-dark), #0c1d33);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    @media (max-width: 768px) {
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 16px;
    }
    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 8px;
      background: linear-gradient(to right, var(--accent-gold), var(--accent-gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      max-width: 420px;
      margin: 0 auto;
    }
    .card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 28px;
      transition: var(--transition);
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    .scene-desc {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
      text-align: center;
      line-height: 1.5;
    }
    .voice-bubble {
      position: relative;
      width: 100%;
      max-width: 320px;
      margin: 0 auto 32px;
      padding: 24px 20px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid rgba(251, 191, 36, 0.2);
    }
    .voice-bubble:hover {
      background: rgba(251, 191, 36, 0.08);
      border-color: rgba(251, 191, 36, 0.4);
    }
    .voice-icon {
      font-size: 2.2rem;
      margin-bottom: 12px;
      color: var(--accent-gold);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }
    .voice-text {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .voice-hint {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .status-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      margin: 20px auto;
      overflow: hidden;
      max-width: 280px;
      display: none;
    }
    .status-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-gold), #fcd34d);
      width: 0%;
      transition: width 0.1s linear;
    }
    .result {
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      min-height: 28px;
      margin-top: 12px;
      color: var(--accent-gold-light);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.3s, transform 0.3s;
    }
    .result.show {
      opacity: 1;
      transform: translateY(0);
    }
    .controls {
      margin-top: 24px;
    }
    .control-group {
      margin-bottom: 24px;
    }
    .control-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.95rem;
      color: var(--text-secondary);
    }
    .slider-container {
      position: relative;
      height: 40px;
      margin: 12px 0;
    }
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.08);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-gold);
      cursor: pointer;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.5);
      transition: var(--transition);
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow: 0 0 16px rgba(251, 191, 36, 0.7);
    }
    .light-preview {
      width: 100%;
      height: 180px;
      border-radius: 12px;
      margin: 24px 0;
      background: radial-gradient(circle at 50% 50%, #fff8e1, #1e3a5f);
      box-shadow: inset 0 0 40px rgba(251, 191, 36, 0.2);
      position: relative;
      overflow: hidden;
      transition: background 0.4s ease;
    }
    .light-preview::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.9), transparent 70%);
      opacity: 0.3;
      transition: opacity 0.4s ease;
    }
    .preview-info {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-top: 12px;
    }
    footer {
      text-align: center;
      margin-top: auto;
      padding: 24px 0;
      color: var(--text-secondary);
      font-size: 0.85rem;
      width: 100%;
      max-width: 560px;
    }
    @media (max-width: 480px) {
      h1 { font-size: 1.5rem; }
      .card { padding: 22px 20px; }
      .voice-bubble { padding: 20px 16px; }
      .voice-icon { font-size: 1.8rem; }
      .light-preview { height: 140px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>眠光钮</h1>
      <p class="subtitle">说一句，3秒进入睡眠模式｜适配百元蓝牙台灯</p>
    </header>

    <main>
      <div class="card">
        <p class="scene-desc">你已躺下，手机在手，床头灯亮着 —— 现在，只需说：<br><strong>“眠光暖一点”</strong> 或 <strong>“调暗些”</strong></p>

        <div class="voice-bubble" id="voiceTrigger">
          <div class="voice-icon">🎤</div>
          <div class="voice-text">点击唤醒语音</div>
          <div class="voice-hint">无需联网｜不传录音｜本地模拟</div>
          <div class="status-bar">
            <div class="status-fill" id="statusFill"></div>
          </div>
          <div class="result" id="resultText"></div>
        </div>

        <div class="light-preview" id="lightPreview"></div>
        <div class="preview-info">当前灯光效果：柔和暖光 · 亮度 65% · 色温 2700K</div>

        <div class="controls">
          <div class="control-group">
            <div class="control-label">
              <span>亮度</span>
              <span id="brightnessValue">65%</span>
            </div>
            <div class="slider-container">
              <input type="range" id="brightnessSlider" min="10" max="100" value="65">
            </div>
          </div>

          <div class="control-group">
            <div class="control-label">
              <span>色温</span>
              <span id="tempValue">2700K</span>
            </div>
            <div class="slider-container">
              <input type="range" id="tempSlider" min="2200" max="4500" step="100" value="2700">
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>眠光钮 · 微信扫码即用｜无需安装App｜兼容小米米家/Yeelight等百元蓝牙台灯</p>
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const voiceTrigger = document.getElementById('voiceTrigger');
      const statusFill = document.getElementById('statusFill');
      const resultText = document.getElementById('resultText');
      const lightPreview = document.getElementById('lightPreview');
      const brightnessSlider = document.getElementById('brightnessSlider');
      const tempSlider = document.getElementById('tempSlider');
      const brightnessValue = document.getElementById('brightnessValue');
      const tempValue = document.getElementById('tempValue');

      // 初始预览
      updateLightPreview();

      // 模拟语音触发
      voiceTrigger.addEventListener('click', () => {
        // 重置状态
        resultText.classList.remove('show');
        statusFill.style.width = '0%';
        
        // 显示进度条
        const statusBar = voiceTrigger.querySelector('.status-bar');
        statusBar.style.display = 'block';

        // 模拟3秒识别过程
        let progress = 0;
        const interval = setInterval(() => {
          progress += 2;
          statusFill.style.width = `${progress}%`;
          if (progress >= 100) {
            clearInterval(interval);
            
            // 随机选择响应文案
            const responses = [
              '✅ 已调至柔光模式',
              '🌙 眠光已启动',
              '✨ 暖光已就位',
              '💤 睡前光效已生效'
            ];
            const randomResp = responses[Math.floor(Math.random() * responses.length)];
            
            resultText.textContent = randomResp;
            resultText.classList.add('show');
            
            // 触发一次灯光预览更新（模拟指令执行）
            setTimeout(() => {
              // 小幅降低亮度、偏暖色温
              const currBri = parseInt(brightnessSlider.value);
              const currTemp = parseInt(tempSlider.value);
              brightnessSlider.value = Math.max(30, currBri - 15);
              tempSlider.value = Math.min(3000, currTemp + 200);
              updateLightPreview();
            }, 300);
            
            // 3秒后隐藏进度条
            setTimeout(() => {
              statusBar.style.display = 'none';
            }, 1500);
          }
        }, 60);
      });

      // 滑块联动预览
      brightnessSlider.addEventListener('input', updateLightPreview);
      tempSlider.addEventListener('input', updateLightPreview);

      function updateLightPreview() {
        const bri = parseInt(brightnessSlider.value);
        const temp = parseInt(tempSlider.value);

        // 更新显示值
        brightnessValue.textContent = `${bri}%`;
        tempValue.textContent = `${temp}K`;

        // 计算暖光颜色（2200K–4500K → 暖黄→中性白）
        const r = Math.min(255, Math.max(200, 255 - (temp - 2200) * 0.1));
        const g = Math.min(255, Math.max(150, 200 - (temp - 2200) * 0.05));
        const b = Math.min(255, Math.max(100, 180 - (temp - 2200) * 0.03));

        // 应用亮度调节（基础色叠加透明度）
        const opacity = bri / 100;
        const bgColor = `radial-gradient(circle at 50% 50%, 
          rgba(${r}, ${g}, ${b}, ${opacity}), 
          rgba(30, 58, 95, ${opacity * 0.7}))`;

        lightPreview.style.background = bgColor;
      }
    });
  </script>
</body>
</html>
