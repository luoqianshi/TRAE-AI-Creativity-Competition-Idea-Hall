<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重新做人模拟器</title>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-green: #10B981;
      --primary-red: #EF4444;
      --bg-white: #FFFFFF;
      --text-dark: #1F2937;
      --text-light: #6B7280;
      --border-gray: #E5E7EB;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.15);
      --radius: 20px;
      --radius-sm: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
      min-height: 100vh;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
      position: relative;
    }

    .page {
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideLeft {
      from { transform: translateX(0); }
      to { transform: translateX(-150%); opacity: 0; }
    }

    @keyframes slideRight {
      from { transform: translateX(0); }
      to { transform: translateX(150%); opacity: 0; }
    }

    @keyframes slideInRight {
      from { transform: translateX(150%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .slide-left {
      animation: slideLeft 0.3s ease-out forwards;
    }

    .slide-right {
      animation: slideRight 0.3s ease-out forwards;
    }

    .slide-in-right {
      animation: slideInRight 0.3s ease-out forwards;
    }

    .pop-in {
      animation: popIn 0.3s ease-out;
    }

    .btn {
      border: none;
      border-radius: var(--radius-sm);
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-green {
      background-color: var(--primary-green);
      color: white;
    }

    .btn-green:hover {
      background-color: #059669;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }

    .btn-red {
      background-color: var(--primary-red);
      color: white;
    }

    .btn-red:hover {
      background-color: #DC2626;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }

    .btn-outline {
      background-color: transparent;
      border: 2px solid var(--border-gray);
      color: var(--text-dark);
    }

    .btn-outline:hover {
      border-color: var(--primary-green);
      color: var(--primary-green);
    }

    .btn-large {
      padding: 18px 32px;
      font-size: 18px;
      border-radius: var(--radius);
    }

    .card {
      background: var(--bg-white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
    }

    .category-card {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .category-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .category-icon.mastered {
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--primary-green);
    }

    .category-icon.learning {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--primary-red);
    }

    .category-icon.locked {
      background-color: rgba(107, 114, 128, 0.1);
      color: var(--text-light);
    }

    .category-info {
      flex: 1;
    }

    .category-title {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 4px;
    }

    .category-count {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .progress-bar-container {
      height: 8px;
      background-color: #E5E7EB;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-green), #34D399);
      border-radius: 4px;
      transition: width 0.5s ease-out;
    }

    .progress-text {
      font-size: 14px;
      color: var(--text-light);
      text-align: center;
    }

    .hero-section {
      text-align: center;
      padding: 40px 20px;
    }

    .hero-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 12px;
    }

    .hero-subtitle {
      font-size: 16px;
      color: var(--text-light);
      margin-bottom: 30px;
    }

    .index-display {
      background: linear-gradient(135deg, var(--primary-green) 0%, #059669 100%);
      border-radius: var(--radius);
      padding: 30px;
      margin-bottom: 24px;
      color: white;
      text-align: center;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
    }

    .index-number {
      font-size: 56px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 8px;
    }

    .index-label {
      font-size: 16px;
      opacity: 0.9;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }

    .card-game {
      position: relative;
      height: 520px;
      perspective: 1000px;
    }

    .card-item {
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--bg-white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      cursor: grab;
      transition: transform 0.2s ease;
    }

    .card-item:active {
      cursor: grabbing;
    }

    

    .card-image {
      width: 100%;
      height: 65%;
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .card-image img {
      max-width: 100%;
      max-height: 100%;
      object-fit: cover;
    }

    .card-image-placeholder {
      font-size: 64px;
      opacity: 0.3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-image-placeholder iconify-icon {
      opacity: 1;
    }

    .card-image-placeholder .no-icon {
      font-size: 48px;
      font-weight: 700;
      color: var(--text-light);
      opacity: 0.6;
    }

    .card-content {
      padding: 24px;
      text-align: center;
    }

    .card-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 20px;
    }

    .card-actions {
      display: flex;
      gap: 16px;
    }

    .card-action-btn {
      flex: 1;
      padding: 16px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .card-action-btn:active {
      transform: scale(0.95);
    }

    .btn-know {
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--primary-green);
    }

    .btn-know:hover {
      background-color: rgba(16, 185, 129, 0.2);
    }

    .btn-unknown {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--primary-red);
    }

    .btn-unknown:hover {
      background-color: rgba(239, 68, 68, 0.2);
    }

    .swipe-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 14px 28px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 25px;
      color: white;
      font-size: 14px;
      backdrop-filter: blur(10px);
    }

    .hint-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      backdrop-filter: blur(5px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-white);
      border-radius: var(--radius);
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      overflow-y: auto;
      animation: popIn 0.3s ease-out;
    }

    .modal-header {
      position: relative;
      height: 200px;
      background: linear-gradient(135deg, var(--primary-red) 0%, #DC2626 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .modal-image {
      font-size: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-image iconify-icon {
      font-size: 80px;
    }

    .modal-image .no-icon {
      font-size: 56px;
      font-weight: 700;
      color: var(--text-light);
    }

    .modal-body {
      padding: 24px;
    }

    .modal-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-dark);
      text-align: center;
      margin-bottom: 12px;
    }

    .modal-desc {
      font-size: 16px;
      color: var(--text-light);
      text-align: center;
      margin-bottom: 24px;
      padding: 16px;
      background: #F9FAFB;
      border-radius: var(--radius-sm);
    }

    .modal-steps {
      margin-bottom: 20px;
    }

    .step-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-gray);
    }

    .step-item:last-child {
      border-bottom: none;
    }

    .step-number {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--primary-green);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .step-text {
      font-size: 15px;
      color: var(--text-dark);
      padding-top: 4px;
    }

    .modal-fun-fact {
      background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
      padding: 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 24px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .fun-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .fun-text {
      font-size: 14px;
      color: #92400E;
    }

    .modal-footer {
      padding: 0 24px 24px;
    }

    .stats-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .back-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-white);
      border: none;
      box-shadow: var(--shadow);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .back-btn:hover {
      transform: scale(1.05);
    }

    .stats-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .stats-tabs {
      display: flex;
      background: var(--bg-white);
      border-radius: var(--radius);
      padding: 6px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: calc(var(--radius) - 6px);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-light);
      background: transparent;
    }

    .tab-btn.active {
      background: var(--primary-green);
      color: white;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card {
      background: var(--bg-white);
      border-radius: var(--radius-sm);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .item-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #F3F4F6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .item-icon iconify-icon {
      font-size: 24px;
    }

    .item-icon .no-icon {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-light);
    }

    .item-info {
      flex: 1;
    }

    .reset-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border-gray);
      background: transparent;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-light);
    }

    .reset-btn:hover {
      border-color: var(--primary-red);
      color: var(--primary-red);
      background: rgba(239, 68, 68, 0.05);
    }

    .reset-btn:active {
      transform: scale(0.9);
    }

    .item-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dark);
    }

    .item-category {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-icon {
      font-size: 64px;
      opacity: 0.3;
      margin-bottom: 16px;
    }

    .empty-text {
      font-size: 16px;
      color: var(--text-light);
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }

      .hero-title {
        font-size: 24px;
      }

      .card-game {
        height: 480px;
      }

      .modal-header {
        height: 160px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="home-page" class="page active">
      <div class="hero-section">
        <h1 class="hero-title">重新做人模拟器</h1>
        <p class="hero-subtitle">盘点生活中那些「本该认识但其实不会用」的东西</p>
      </div>

      <div class="index-display">
        <div class="index-number" id="human-index">0</div>
        <div class="index-label">做人指数</div>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
      </div>
      <div class="progress-text" id="progress-text">今日已认识 0 / 0 件</div>

      <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 24px;">
        <div class="card category-card">
          <div class="category-icon mastered">🟢</div>
          <div class="category-info">
            <div class="category-title">已掌握</div>
            <div class="category-count" id="mastered-count">0</div>
          </div>
        </div>

        <div class="card category-card">
          <div class="category-icon learning">🔴</div>
          <div class="category-info">
            <div class="category-title">待学习</div>
            <div class="category-count" id="learning-count">0</div>
          </div>
        </div>

        <div class="card category-card">
          <div class="category-icon locked">⏳</div>
          <div class="category-info">
            <div class="category-title">未解锁</div>
            <div class="category-count" id="locked-count">0</div>
          </div>
        </div>
      </div>

      <div class="action-buttons">
        <button class="btn btn-green btn-large" onclick="startGame()">
          🎮 开始挑战
        </button>
        <button class="btn btn-outline btn-large" onclick="goToStats()">
          📊 查看统计
        </button>
      </div>
    </div>

    <div id="card-page" class="page">
      <div class="stats-header">
        <button class="back-btn" onclick="goHome()">←</button>
        <div class="stats-title">认识物品</div>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar" id="game-progress-bar" style="width: 0%"></div>
      </div>
      <div class="progress-text" id="game-progress-text">剩余 0 张卡片</div>

      <div class="card-game" id="card-game">
        <div class="card-item" id="current-card">
          <div class="card-image">
            <div class="card-image-placeholder" id="card-icon">❓</div>
          </div>
          <div class="card-content">
            <h2 class="card-name" id="card-name">加载中...</h2>
            <div class="card-actions">
              <button class="card-action-btn btn-unknown" onclick="handleUnknown()">
                <span style="font-size: 20px;">😅</span>
                <span>不会用</span>
              </button>
              <button class="card-action-btn btn-know" onclick="handleKnow()">
                <span style="font-size: 20px;">😎</span>
                <span>会用</span>
              </button>
            </div>
          </div>
        </div>
        <div class="card-item next" id="next-card" style="display: none;">
          <div class="card-image">
            <span class="card-image-placeholder">❓</span>
          </div>
          <div class="card-content">
            <h2 class="card-name">下一张</h2>
          </div>
        </div>
      </div>

      <div class="swipe-hint">
        <span>点击按钮选择 | 键盘 <span class="hint-key">B</span> = 不会 | <span class="hint-key">空格</span> = 会用</span>
      </div>
    </div>

    <div id="stats-page" class="page">
      <div class="stats-header">
        <button class="back-btn" onclick="goHome()">←</button>
        <div class="stats-title">我的物品</div>
      </div>

      <div class="stats-tabs">
        <button class="tab-btn active" onclick="switchTab('mastered')">已掌握</button>
        <button class="tab-btn" onclick="switchTab('learning')">待学习</button>
        <button class="tab-btn" onclick="switchTab('locked')">未解锁</button>
      </div>

      <div class="item-list" id="item-list">
      </div>

      <div class="action-buttons" style="margin-top: 30px;">
        <button class="btn btn-green btn-large" onclick="startReview()" id="review-btn">
          📖 复习待学习
        </button>
        <button class="btn btn-outline btn-large" onclick="resetAllProgress()">
          🔄 一键重置所有进度
        </button>
      </div>
    </div>

    <div class="modal-overlay" id="detail-modal">
      <div class="modal-content">
        <div class="modal-header">
          <button class="modal-close" onclick="closeModal()">×</button>
          <div class="modal-image" id="modal-icon">📚</div>
        </div>
        <div class="modal-body">
          <h2 class="modal-title" id="modal-title">物品名称</h2>
          <div class="modal-desc" id="modal-desc">这是一个物品</div>
          <div class="modal-steps" id="modal-steps">
          </div>
          <div class="modal-fun-fact" id="modal-fun-fact" style="display: none;">
            <span class="fun-icon">💡</span>
            <span class="fun-text">冷知识</span>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-green btn-large" onclick="handleNext()">
            ➡️ 下一个
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cardsData = [

    let userProgress = {
      mastered: [],
      learning: [],
      todayCount: 0,
      lastPlayDate: ""
    };

    let currentCardIndex = 0;
    let currentCards = [];
    let currentTab = 'mastered';
    let isReviewMode = false;

    function loadProgress() {
      const saved = localStorage.getItem('reborn_simulator_progress');
      if (saved) {
        userProgress = JSON.parse(saved);
      }
      const today = new Date().toDateString();
      if (userProgress.lastPlayDate !== today) {
        userProgress.todayCount = 0;
        userProgress.lastPlayDate = today;
        saveProgress();
      }
    }

    function saveProgress() {
      localStorage.setItem('reborn_simulator_progress', JSON.stringify(userProgress));
    }

    function updateHomeStats() {
      const masteredCount = userProgress.mastered.length;
      const learningCount = userProgress.learning.length;
      const notSeenCount = cardsData.length - masteredCount - learningCount;

      document.getElementById('mastered-count').textContent = masteredCount;
      document.getElementById('learning-count').textContent = learningCount;
      document.getElementById('locked-count').textContent = notSeenCount;

      const total = cardsData.length;
      const progress = Math.round((masteredCount / total) * 100);
      document.getElementById('human-index').textContent = `${progress}%`;
      document.getElementById('progress-bar').style.width = `${progress}%`;
      document.getElementById('progress-text').textContent = `今日已认识 ${userProgress.todayCount} / ${total} 件`;
    }

    function goHome() {
      document.getElementById('home-page').classList.add('active');
      document.getElementById('card-page').classList.remove('active');
      document.getElementById('stats-page').classList.remove('active');
      updateHomeStats();
    }

    function goToStats() {
      document.getElementById('home-page').classList.remove('active');
      document.getElementById('card-page').classList.remove('active');
      document.getElementById('stats-page').classList.add('active');
      renderItemList('mastered');
    }

    function startGame() {
      isReviewMode = false;
      currentCards = cardsData.filter(c => 
        !userProgress.mastered.includes(c.id) && !userProgress.learning.includes(c.id));
      
      if (currentCards.length === 0) {
        currentCards = cardsData.filter(c => !userProgress.mastered.includes(c.id));
      }

      if (currentCards.length === 0) {
        alert('所有卡片都已掌握！🎉');
        return;
      }

      currentCardIndex = 0;
      document.getElementById('home-page').classList.remove('active');
      document.getElementById('card-page').classList.add('active');
      renderCurrentCard();
      updateGameProgress();
    }

    function startReview() {
      if (userProgress.learning.length === 0) {
        alert('没有待学习的卡片！');
        return;
      }
      isReviewMode = true;
      currentCards = cardsData.filter(c => userProgress.learning.includes(c.id));
      currentCardIndex = 0;
      document.getElementById('stats-page').classList.remove('active');
      document.getElementById('card-page').classList.add('active');
      renderCurrentCard();
      updateGameProgress();
    }

    function playSwipeSound() {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.1);
      
      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
      
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.1);
    }

    function generatePixelIcon(iconName, size = 64) {
      const icon = pixelIcons[iconName];
      if (!icon) return '';
      const pixelSize = size / 16;
      let rects = '';
      for (let y = 0; y < 16; y++) {
        for (let x = 0; x < 16; x++) {
          const pixel = icon.pixels[y][x];
          if (pixel !== '0') {
            const color = icon.palette[parseInt(pixel) - 1];
            rects += `<rect x="${x * pixelSize}" y="${y * pixelSize}" width="${pixelSize}" height="${pixelSize}" fill="${color}"/>`;
          }
        }
      }
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
    }

    function getIconDisplay(card) {
      return `<div class="no-icon">${card.name.charAt(0)}</div>`;
    }

    function renderCurrentCard() {
      if (currentCardIndex >= currentCards.length) {
        finishGame();
        return;
      }

      const card = currentCards[currentCardIndex];
      const iconEl = document.getElementById('card-icon');
      iconEl.innerHTML = getIconDisplay(card);
      if (card.icon === 'NO_ICON') {
        iconEl.classList.add('no-icon');
      } else {
        iconEl.classList.remove('no-icon');
      }
      document.getElementById('card-name').textContent = card.name;

      document.getElementById('current-card').classList.remove('slide-left', 'slide-right');
    }

    function updateGameProgress() {
      const remaining = currentCards.length - currentCardIndex;
      document.getElementById('game-progress-text').textContent = `剩余 ${remaining} 张卡片`;
      const progress = Math.round(((currentCardIndex) / currentCards.length) * 100);
      document.getElementById('game-progress-bar').style.width = `${progress}%`;
    }

    function handleKnow() {
      const card = currentCards[currentCardIndex];
      if (!userProgress.mastered.includes(card.id)) {
        userProgress.mastered.push(card.id);
        if (!isReviewMode) {
          userProgress.todayCount++;
        }
        saveProgress();
      }

      playSwipeSound();

      document.getElementById('current-card').classList.add('slide-right');
      setTimeout(() => {
        currentCardIndex++;
        updateGameProgress();
        renderCurrentCard();
      }, 300);
    }

    function handleUnknown() {
      const card = currentCards[currentCardIndex];
      if (!userProgress.learning.includes(card.id)) {
        userProgress.learning.push(card.id);
        if (!isReviewMode) {
          userProgress.todayCount++;
        }
        saveProgress();
      }

      document.getElementById('current-card').classList.add('slide-left');
      setTimeout(() => {
        showDetailModal(card);
      }, 300);
    }

    function showDetailModal(card) {
      const modalIconEl = document.getElementById('modal-icon');
      modalIconEl.innerHTML = getIconDisplay(card);
      if (card.icon === 'NO_ICON') {
        modalIconEl.classList.add('no-icon');
      } else {
        modalIconEl.classList.remove('no-icon');
      }
      document.getElementById('modal-title').textContent = card.name;
      document.getElementById('modal-desc').textContent = card.description;

      const stepsContainer = document.getElementById('modal-steps');
      stepsContainer.innerHTML = '';
      card.steps.forEach((step, index) => {
        const stepItem = document.createElement('div');
        stepItem.className = 'step-item';
        stepItem.innerHTML = `
          <div class="step-number">${index + 1}</div>
          <div class="step-text">${step}</div>
        `;
        stepsContainer.appendChild(stepItem);
      });

      const funFact = document.getElementById('modal-fun-fact');
      if (card.fun_fact) {
        funFact.style.display = 'flex';
        funFact.querySelector('.fun-text').textContent = card.fun_fact;
      } else {
        funFact.style.display = 'none';
      }

      document.getElementById('detail-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.remove('active');
    }

    function handleNext() {
      closeModal();
      currentCardIndex++;
      updateGameProgress();
      renderCurrentCard();
    }

    function finishGame() {
      alert(isReviewMode ? '复习完成！' : '挑战完成！🎉');
      goHome();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderItemList(tab);
    }

    function renderItemList(tab) {
      const container = document.getElementById('item-list');
      let items = [];

      if (tab === 'mastered') {
        items = cardsData.filter(c => userProgress.mastered.includes(c.id));
      } else if (tab === 'learning') {
        items = cardsData.filter(c => userProgress.learning.includes(c.id));
      } else {
        items = cardsData.filter(c => !userProgress.mastered.includes(c.id) && !userProgress.learning.includes(c.id));
      }

      if (items.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${tab === 'mastered' ? '🎉' : tab === 'learning' ? '📚' : '✨'}</div>
            <div class="empty-text">${tab === 'mastered' ? '还没有掌握任何物品' : tab === 'learning' ? '没有待学习的物品' : '所有物品都已学习过'}</div>
          </div>
        `;
        document.getElementById('review-btn').style.display = tab === 'learning' && items.length > 0 ? 'block' : 'none';
        return;
      }

      container.innerHTML = items.map(card => `
        <div class="item-card">
          <div class="item-icon ${card.icon === 'NO_ICON' ? 'no-icon' : ''}">${getIconDisplay(card)}</div>
          <div class="item-info">
            <div class="item-name">${card.name}</div>
            <div class="item-category">${card.category}</div>
          </div>
          ${(tab === 'mastered' || tab === 'learning') ? `
            <button class="reset-btn" onclick="resetCard('${card.id}', '${tab}')" title="重置">
              ↺
            </button>
          ` : ''}
        </div>
      `).join('');

      document.getElementById('review-btn').style.display = tab === 'learning' && items.length > 0 ? 'block' : 'none';
    }

    function resetCard(cardId, fromTab) {
      if (confirm('确定要重置此物品吗？')) {
        if (fromTab === 'mastered') {
          userProgress.mastered = userProgress.mastered.filter(id => id !== cardId);
        } else if (fromTab === 'learning') {
          userProgress.learning = userProgress.learning.filter(id => id !== cardId);
        }
        saveProgress();
        renderItemList(currentTab);
        updateHomeStats();
      }
    }

    function resetAllProgress() {
      if (confirm('确定要重置所有学习进度吗？这将清除所有已掌握和待学习的记录。')) {
        userProgress.mastered = [];
        userProgress.learning = [];
        userProgress.todayCount = 0;
        saveProgress();
        renderItemList(currentTab);
        updateHomeStats();
        alert('所有进度已重置！');
      }
    }

    let touchStartX = 0;
    let touchEndX = 0;

    function handleTouchStart(e) {
      touchStartX = e.touches[0].clientX;
    }

    function handleTouchEnd(e) {
      touchEndX = e.changedTouches[0].clientX;
      handleSwipe();
    }

    function handleSwipe() {
      const diff = touchEndX - touchStartX;
      const minSwipeDistance = 50;

      if (Math.abs(diff) > minSwipeDistance) {
        if (diff > 0) {
          handleKnow();
        } else {
          handleUnknown();
        }
      }
    }

    function handleKeydown(e) {
      if (document.getElementById('card-page').classList.contains('active')) {
        if (e.code === 'Space') {
          e.preventDefault();
          handleKnow();
        } else if (e.key.toLowerCase() === 'b') {
          handleUnknown();
        }
      }
    }

    

    document.addEventListener('DOMContentLoaded', () => {
      loadProgress();
      updateHomeStats();
      
      const cardElement = document.getElementById('current-card');
      cardElement.addEventListener('touchstart', handleTouchStart, false);
      cardElement.addEventListener('touchend', handleTouchEnd, false);
      
      document.addEventListener('keydown', handleKeydown);
    });
  </script>
</body>
</html>
