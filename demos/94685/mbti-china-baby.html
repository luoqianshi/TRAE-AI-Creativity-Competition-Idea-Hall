<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070716">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>更适合中国宝宝体质的 MBTI 测试</title>
<style>
  :root{
    --bg0:#05050f; --bg1:#0b0b22; --bg2:#131336;
    --ink:#eef0ff; --ink-dim:#a9aedb; --ink-faint:#6b6f9c;
    --gold:#ffcf6b; --gold-2:#ff9d5c;
    --cyan:#67e8f9; --purple:#b794ff; --pink:#ff8fc7;
    --line:rgba(255,255,255,.10);
    --glass:rgba(255,255,255,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    background:var(--bg0);color:var(--ink);
    overflow:hidden;position:fixed;inset:0;
    -webkit-font-smoothing:antialiased;
  }
  #stars{position:fixed;inset:0;z-index:0;display:block}
  .nebula{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 50% at 78% 12%, rgba(183,148,255,.20), transparent 60%),
      radial-gradient(55% 45% at 12% 88%, rgba(103,232,249,.14), transparent 60%),
      radial-gradient(40% 35% at 50% 55%, rgba(255,143,199,.10), transparent 65%);
    mix-blend-mode:screen;
  }
  #app{position:relative;z-index:2;width:100%;height:100%;
    max-width:480px;margin:0 auto;overflow:hidden}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px)}
  .screen.active{display:flex;animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ===== Start ===== */
  .start{align-items:center;justify-content:center;text-align:center}
  .crest{width:96px;height:96px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff7e0, var(--gold) 45%, #c87b2e 75%, #5a3410 100%);
    box-shadow:0 0 50px rgba(255,207,107,.45), inset 0 0 20px rgba(255,255,255,.4);
    display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:22px;
    animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .kicker{font-size:12px;letter-spacing:6px;color:var(--gold);margin-bottom:12px;text-transform:uppercase}
  .title{font-size:30px;line-height:1.25;font-weight:800;letter-spacing:1px;
    background:linear-gradient(120deg,#fff,#c9b8ff 60%,#8de9ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px}
  .sub{font-size:14px;color:var(--ink-dim);line-height:1.7;max-width:300px;margin:0 auto 30px}
  .meta-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
  .chip{font-size:11px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;
    color:var(--ink-dim);background:var(--glass);backdrop-filter:blur(8px)}
  .chip b{color:var(--gold);font-weight:600}
  .btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:700}
  .btn-primary{font-size:16px;padding:16px 0;width:100%;border-radius:16px;color:#1a1030;
    background:linear-gradient(120deg,var(--gold),var(--gold-2));
    box-shadow:0 12px 40px -8px rgba(255,157,92,.6);transition:transform .15s, box-shadow .2s}
  .btn-primary:active{transform:scale(.98)}
  .btn-ghost{font-size:14px;padding:14px 0;width:100%;border-radius:14px;color:var(--ink);
    background:var(--glass);border:1px solid var(--line);margin-top:12px}
  .start .btn{max-width:300px}

  /* ===== Setup ===== */
  .setup{justify-content:flex-start}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
    background:var(--glass);color:var(--ink);font-size:18px;flex:none}
  .step-tag{font-size:11px;color:var(--ink-faint);letter-spacing:2px}
  .h-title{font-size:24px;font-weight:800;margin:18px 0 6px}
  .h-desc{font-size:13px;color:var(--ink-dim);margin-bottom:22px;line-height:1.6}
  .seg-label{font-size:12px;color:var(--gold);letter-spacing:3px;margin-bottom:12px}
  .gender-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:30px}
  .g-card{border:1px solid var(--line);border-radius:18px;background:var(--glass);
    padding:22px 12px;text-align:center;transition:all .2s;position:relative;overflow:hidden}
  .g-card .emoji{font-size:34px;display:block;margin-bottom:8px}
  .g-card .gt{font-size:15px;font-weight:700}
  .g-card.on{border-color:var(--gold);background:rgba(255,207,107,.12);
    box-shadow:0 0 0 1px var(--gold), 0 10px 30px -10px rgba(255,207,107,.5)}
  .zodiac-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .z-card{border:1px solid var(--line);border-radius:14px;background:var(--glass);
    padding:12px 4px;text-align:center;transition:all .2s}
  .z-card .ze{font-size:22px;display:block;line-height:1}
  .z-card .zt{font-size:12px;margin-top:5px;color:var(--ink-dim)}
  .z-card.on{border-color:var(--purple);background:rgba(183,148,255,.14);
    box-shadow:0 0 0 1px var(--purple), 0 8px 24px -10px rgba(183,148,255,.5)}
  .z-card.on .zt{color:var(--ink)}
  .setup .btn-primary{margin-top:auto}

  /* ===== Cards ===== */
  .cards{padding:0;justify-content:space-between}
  .card-head{padding:calc(env(safe-area-inset-top) + 16px) 20px 0}
  .progress-wrap{display:flex;align-items:center;gap:10px}
  .progress-text{font-size:12px;color:var(--ink-faint);white-space:nowrap}
  .progress-bar{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
  .progress-fill{height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--purple),var(--cyan));transition:width .35s ease}
  .phase-tag{font-size:10px;letter-spacing:2px;padding:3px 9px;border-radius:999px;
    border:1px solid var(--line);color:var(--ink-dim);margin-left:auto}
  .phase-tag.interest{color:var(--pink);border-color:rgba(255,143,201,.4)}
  .phase-tag.mbti{color:var(--cyan);border-color:rgba(103,232,249,.4)}

  .card-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
    padding:16px 20px;perspective:1200px}
  .card{position:absolute;width:100%;max-width:340px;border-radius:26px;
    background:linear-gradient(160deg,rgba(30,30,66,.92),rgba(15,15,40,.96));
    border:1px solid var(--line);box-shadow:0 30px 70px -20px rgba(0,0,0,.8);
    padding:26px 24px;backdrop-filter:blur(14px);will-change:transform;
    touch-action:none;user-select:none}
  .card.q-interest{border-top:3px solid var(--pink)}
  .card.q-mbti{border-top:3px solid var(--cyan)}
  .card-idx{font-size:11px;letter-spacing:3px;color:var(--ink-faint);margin-bottom:14px}
  .card-q{font-size:21px;font-weight:700;line-height:1.45;margin-bottom:22px;min-height:60px}
  .card-opts{display:flex;flex-direction:column;gap:12px}
  .opt{border:1px solid var(--line);border-radius:16px;padding:16px;background:rgba(255,255,255,.04);
    transition:all .15s;display:flex;align-items:center;gap:12px}
  .opt .dot{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:15px;font-weight:800;border:1px solid var(--line)}
  .opt.a .dot{color:var(--cyan);border-color:rgba(103,232,249,.5)}
  .opt.b .dot{color:var(--pink);border-color:rgba(255,143,201,.5)}
  .opt .ot{font-size:14px;line-height:1.45;flex:1}
  .opt:active{background:rgba(255,255,255,.10)}
  .swipe-hint{display:flex;justify-content:space-between;padding:0 30px 8px;font-size:11px;
    color:var(--ink-faint)}
  .swipe-hint .l{color:var(--pink)}
  .swipe-hint .r{color:var(--cyan)}
  .stamp{position:absolute;top:18px;padding:6px 14px;border-radius:10px;font-size:13px;font-weight:800;
    border:3px solid;opacity:0;transform:rotate(-12deg);transition:opacity .1s;pointer-events:none}
  .stamp.left{left:18px;color:var(--pink);border-color:var(--pink)}
  .stamp.right{right:18px;color:var(--cyan);border-color:var(--cyan)}

  /* ===== Result ===== */
  .result{overflow-y:auto;align-items:stretch;padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
  .result::-webkit-scrollbar{width:0}
  .r-head{text-align:center;padding:6px 0 18px}
  .r-emoji{font-size:50px;display:block;margin-bottom:8px;animation:float 4s ease-in-out infinite}
  .r-kicker{font-size:11px;letter-spacing:4px;color:var(--gold);margin-bottom:8px}
  .r-type{font-size:34px;font-weight:900;letter-spacing:1px;
    background:linear-gradient(120deg,#fff,#ffe0a8 50%,var(--purple));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .r-sub{font-size:13px;color:var(--ink-dim);margin-top:8px}
  .dim{border:1px solid var(--line);border-radius:20px;background:var(--glass);
    backdrop-filter:blur(10px);padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
  .dim::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none}
  .dim.d1::before{background:radial-gradient(80% 60% at 0% 0%, rgba(255,207,107,.12), transparent 60%)}
  .dim.d2::before{background:radial-gradient(80% 60% at 100% 0%, rgba(255,143,201,.14), transparent 60%)}
  .dim.d3::before{background:radial-gradient(80% 60% at 50% 100%, rgba(103,232,249,.12), transparent 60%)}
  .dim-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:relative}
  .dim-no{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;flex:none}
  .d1 .dim-no{background:rgba(255,207,107,.2);color:var(--gold)}
  .d2 .dim-no{background:rgba(255,143,201,.2);color:var(--pink)}
  .d3 .dim-no{background:rgba(103,232,249,.2);color:var(--cyan)}
  .dim-title{font-size:16px;font-weight:800}
  .dim-title small{font-size:11px;color:var(--ink-faint);font-weight:400;margin-left:6px;letter-spacing:1px}
  .dim-body{font-size:14px;line-height:1.75;color:var(--ink-dim);position:relative}
  .dim-body .hl{color:var(--ink);font-weight:600}
  .dim-body .gold{color:var(--gold)}
  .dim-body .cyan{color:var(--cyan)}
  .dim-body .pink{color:var(--pink)}
  .dim-body .pur{color:var(--purple)}
  .dim-body p+p{margin-top:8px}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;position:relative}
  .tag{font-size:11px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:var(--ink)}
  .manual{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;position:relative}
  .m-cell{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.03)}
  .m-cell .mh{font-size:10px;letter-spacing:2px;color:var(--ink-faint);margin-bottom:6px}
  .m-cell .mc{font-size:13px;line-height:1.5;color:var(--ink)}
  .r-actions{display:flex;gap:10px;margin-top:8px}
  .r-actions .btn-primary{flex:1;margin:0}
  .r-actions .btn-ghost{flex:none;width:54px;margin:0;padding:14px 0;font-size:18px}
  .r-foot{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:18px;line-height:1.7}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%) translateY(20px);
    background:rgba(20,20,45,.95);border:1px solid var(--line);color:var(--ink);
    padding:12px 22px;border-radius:14px;font-size:13px;z-index:99;opacity:0;transition:all .3s;backdrop-filter:blur(10px);
    box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-height:680px){
    .card-q{font-size:19px;min-height:50px}
    .crest{width:78px;height:78px;font-size:32px;margin-bottom:16px}
    .title{font-size:26px}
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="nebula"></div>
<div id="app">

  <!-- ===== Start ===== -->
  <section class="screen start active" id="scr-start">
    <div class="crest">✦</div>
    <div class="kicker">CHINA · BABY · MBTI</div>
    <h1 class="title">更适合中国宝宝<br>体质的 MBTI 测试</h1>
    <p class="sub">星座 × MBTI × 兴趣 三维度融合<br> Tinder 式滑动，3 分钟刷出专属你的性格宇宙</p>
    <div class="meta-row">
      <span class="chip"><b>23</b> 张卡片</span>
      <span class="chip"><b>12</b> 星座</span>
      <span class="chip"><b>16</b> 型人格</span>
      <span class="chip"><b>3</b> 分钟</span>
    </div>
    <button class="btn btn-primary" id="go-setup">开始测试 ✦</button>
    <button class="btn btn-ghost" id="go-about">这是什么测试？</button>
  </section>

  <!-- ===== Setup ===== -->
  <section class="screen setup" id="scr-setup">
    <div class="topbar">
      <button class="back" data-back="start">‹</button>
      <span class="step-tag">STEP 1 / 2 · 基础信息</span>
    </div>
    <h2 class="h-title">先告诉我你是谁</h2>
    <p class="h-desc">性别和星座会参与你的性格报告生成，放心，只在本机算。</p>

    <div class="seg-label">你的性别</div>
    <div class="gender-grid">
      <div class="g-card" data-gender="男"><span class="emoji">👦</span><span class="gt">男生</span></div>
      <div class="g-card" data-gender="女"><span class="emoji">👧</span><span class="gt">女生</span></div>
    </div>

    <div class="seg-label">你的星座</div>
    <div class="zodiac-grid" id="zodiac-grid"></div>

    <button class="btn btn-primary" id="go-cards" disabled style="opacity:.4">选好星座再出发 →</button>
  </section>

  <!-- ===== Cards ===== -->
  <section class="screen cards" id="scr-cards">
    <div class="card-head">
      <div class="progress-wrap">
        <span class="progress-text" id="prog-text">1 / 23</span>
        <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
        <span class="phase-tag interest" id="phase-tag">兴趣篇</span>
      </div>
    </div>
    <div class="card-stage" id="card-stage"></div>
    <div class="swipe-hint">
      <span class="l">‹ 左滑 / 点上</span>
      <span class="r">右滑 / 点下 ›</span>
    </div>
  </section>

  <!-- ===== Result ===== -->
  <section class="screen result" id="scr-result">
    <div class="r-head">
      <span class="r-emoji" id="r-emoji">🌟</span>
      <div class="r-kicker">你的三维度性格报告</div>
      <div class="r-type" id="r-type">ENFJ</div>
      <div class="r-sub" id="r-sub">狮子座 · 男生</div>
    </div>
    <div id="r-body"></div>
    <div class="r-actions">
      <button class="btn btn-primary" id="share-btn">一键分享我的性格</button>
      <button class="btn btn-ghost" id="retry-btn">↻</button>
    </div>
    <div class="r-foot">更适合中国宝宝体质的 MBTI 测试<br>娱乐向，结果仅供参考，你永远独一无二 ✦</div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== DATA ===================== */
const ZODIAC = [
  {n:"白羊座",e:"♈",el:"火"},{n:"金牛座",e:"♉",el:"土"},{n:"双子座",e:"♊",el:"风"},
  {n:"巨蟹座",e:"♋",el:"水"},{n:"狮子座",e:"♌",el:"火"},{n:"处女座",e:"♍",el:"土"},
  {n:"天秤座",e:"♎",el:"风"},{n:"天蝎座",e:"♏",el:"水"},{n:"射手座",e:"♐",el:"火"},
  {n:"摩羯座",e:"♑",el:"土"},{n:"水瓶座",e:"♒",el:"风"},{n:"双鱼座",e:"♓",el:"水"},
];

// 兴趣卡：8 张，每个选项映射一个兴趣标签
const INTEREST_Q = [
  {q:"周末终于闲下来，你最想干点啥？",a:["去打球/健身出一身汗","宅家躺平追剧打游戏"],tag:["运动","宅家"]},
  {q:"如果有一笔闲钱想犒劳自己，你会花在？",a:["好吃的好喝的必须安排","数码装备/游戏皮肤"],tag:["美食","科技"]},
  {q:"理想中的假期是哪种？",a:["说走就走，去看世界","在家睡到自然醒最香"],tag:["旅行","宅家"]},
  {q:"朋友约你聚会，你更喜欢的形式是？",a:["唱K剧本杀人越多越嗨","两三好友咖啡馆聊聊"],tag:["社交","文艺"]},
  {q:"想学个新技能，你会pick？",a:["摄影/绘画/乐器","编程/剪辑/做自媒体"],tag:["文艺","科技"]},
  {q:"无聊刷手机，你主要在看？",a:["旅行vlog/穿搭美食","科技数码/游戏攻略"],tag:["旅行","科技"]},
  {q:"朋友眼里的你，更像？",a:["组局达人，永远在张罗","隐藏美食家，懂的店最多"],tag:["社交","美食"]},
  {q:"给你一笔钱升级生活，你会？",a:["换个新手机/外设","报个班学个爱好"],tag:["科技","文艺"]},
];

// MBTI 卡：15 张，E/I 4，S/N 4，T/F 4，J/P 3
const MBTI_Q = [
  // E/I
  {q:"周末朋友突然喊你出门聚餐，你的第一反应？",a:["立刻答应，出去嗨才对味","有点想留在家里待着"],dim:"EI",a0:"E",a1:"I"},
  {q:"到一个谁都不认识的新环境，你会？",a:["主动找人搭话，很快混熟","等别人来找我，先观察一波"],dim:"EI",a0:"E",a1:"I"},
  {q:"团建嗨了一整天，结束后的你？",a:["意犹未尽，还想再续个摊","电量耗尽，急需独处回血"],dim:"EI",a0:"E",a1:"I"},
  {q:"遇到超开心的事，你会？",a:["马上发朋友圈广而告之","自己偷偷乐，或只跟最亲的人说"],dim:"EI",a0:"E",a1:"I"},
  // S/N
  {q:"学一个新东西，你更喜欢？",a:["一步步照着教程做，踏实","先搞懂整体框架和原理"],dim:"SN",a0:"S",a1:"N"},
  {q:"别人跟你讲一个计划，你更在意？",a:["具体怎么落地、要花多少钱","未来能做成什么样、有多远大"],dim:"SN",a0:"S",a1:"N"},
  {q:"看一部电影，你最看重？",a:["画面细节、剧情合不合理","主题立意、有没有隐喻"],dim:"SN",a0:"S",a1:"N"},
  {q:"朋友跟你倒苦水，你倾向于？",a:["帮他理清问题、列出解决步骤","先共情安慰，聊聊这事的意义"],dim:"SN",a0:"S",a1:"N"},
  // T/F
  {q:"朋友做了个明显有问题的决定，你会？",a:["直接指出问题在哪","先照顾他情绪，再委婉说"],dim:"TF",a0:"T",a1:"F"},
  {q:"团队里产生分歧，你更看重？",a:["谁说的更有道理、更有效","大家关系别闹僵、和气为主"],dim:"TF",a0:"T",a1:"F"},
  {q:"刷到超感人的短视频，你？",a:["理性分析是真是假、怎么拍的","眼眶直接红了，共情到位"],dim:"TF",a0:"T",a1:"F"},

// 社交使用说明书（按 MBTI 维度组合）
function manualOf(type, el, gender, topTags){
  const ie = type[0], sn = type[1], tf = type[2], jp = type[3];
  // 适合相处
  let fit;
  if(ie==="E") fit = topTags.includes("社交")||topTags.includes("运动")?"跟你一样能折腾的同类":"愿意陪你出门、也能陪你宅的人";
  else fit = "懂你沉默、不强行拉你社交的灵魂伴侣";
  // 雷区
  let mine;
  if(tf==="T") mine = "情绪绑架 / 不讲逻辑的反复纠结";
  else if(tf==="F") mine = "冷暴力 / 被忽视感受 / 当众下不来台";
  else mine = "突然打乱你计划的事";
  if(jp==="J") mine = "频繁爽约 / 临到头改计划";
  if(jp==="P") mine = "被安排得死死的 / 没有任何弹性";
  // 充电方式
  let charge;
  if(ie==="E") charge = topTags.includes("宅家")?"偶尔也要独处放空一下":"跟朋友嗨一场 + 做件热爱的事";
  else charge = topTags.includes("宅家")?"独处 + 一部剧/一个游戏就够了":"独自旅行、独自看展、安静的爱好";
  // 技能点
  let skill;
  if(sn==="N"&&tf==="F") skill="读空气 / 共情 / 画大饼能手";
  else if(sn==="N"&&tf==="T") skill="战略脑 / 灵感输出 / 拆解复杂问题";
  else if(sn==="S"&&tf==="T") skill="执行力 / 排雷 / 把事落地";
  else skill="照顾人 / 记住细节 / 制造安心感";
  if(el==="火") skill += " / 自带热场BGM";
  if(el==="水") skill += " / 情绪雷达";
  return {fit,mine,charge,skill};
}

(function(){
  const c=document.getElementById('stars'),x=c.getContext('2d');
  let w,h,stars=[];
  function rs(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;
    stars=[];const n=Math.min(160,Math.floor(w*h/26000));
    for(let i=0;i<n;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.3,
      a:Math.random(),s:Math.random()*.02+.005,tw:Math.random()*Math.PI*2});}
  function draw(){x.clearRect(0,0,w,h);
    for(const s of stars){s.tw+=s.s;const al=.4+Math.abs(Math.sin(s.tw))*.6;
      x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fillStyle=`rgba(255,255,255,${al})`;x.fill();}
    requestAnimationFrame(draw);}
  addEventListener('resize',rs);rs();draw();
})();

function renderStage(){

  remain.forEach((c,i)=>{

}
function makeCard(c,stackIdx){
  const el=document.createElement('div');el.className='card '+(c.type==='interest'?'q-interest':'q-mbti');
  const total=state.cards.length,num=state.idx+stackIdx+1;
  const isA=true;
  el.innerHTML=`

    <div class="card-idx">CARD ${String(num).padStart(2,'0')} / ${total}</div>
    <div class="card-q">${c.q.q}</div>
    <div class="card-opts">
      <div class="opt a"><div class="dot">A</div><div class="ot">${c.q.a[0]}</div></div>
      <div class="opt b"><div class="dot">B</div><div class="ot">${c.q.a[1]}</div></div>
    </div>`;
  const scale=1-stackIdx*0.045,ty=stackIdx*14;
  el.style.transform=`translateY(${ty}px) scale(${scale})`;el.style.zIndex=10-stackIdx;
  el.style.opacity=stackIdx>1?.4:1;
  return el;
}
function updateProgress(){
  const i=state.idx,total=state.cards.length;
  document.getElementById('prog-text').textContent=`${Math.min(i+1,total)} / ${total}`;
  document.getElementById('prog-fill').style.width=((i)/total*100)+'%';
  const c=state.cards[i];
  const tag=document.getElementById('phase-tag');
  if(c&&c.type==='interest'){tag.textContent='兴趣篇';tag.className='phase-tag interest';}
  else{tag.textContent='MBTI篇';tag.className='phase-tag mbti';}
}

/* swipe + tap */
function bindTop(){
  const stage=document.getElementById('card-stage');
  const top=stage.firstChild;if(!top)return;
  const c=state.cards[state.idx];
  let sx=0,sy=0,dx=0,dy=0,drag=false,decided=null;
  const sl=top.querySelector('.stamp.left'),sr=top.querySelector('.stamp.right');
  function setT(x,y){top.style.transform=`translate(${x}px,${y}px) rotate(${x/14}deg)`;
    const r=Math.abs(x)/120;
    if(x<-30){sl.style.opacity=Math.min(1,r);decided='A';}
    else if(x>30){sr.style.opacity=Math.min(1,r);decided='B';}
    else{sl.style.opacity=0;sr.style.opacity=0;decided=null;}}
  function down(e){drag=true;const p=pt(e);sx=p.x;sy=p.y;}
  function mv(e){if(!drag)return;const p=pt(e);dx=p.x-sx;dy=p.y-sy;setT(dx,dy);}
  function up(){if(!drag)return;drag=false;
    if(Math.abs(dx)>90||decided){commit(decided||(dx>0?'B':'A'));}
    else{top.style.transition='transform .3s';top.style.transform='translateY(0) scale(1) rotate(0)';
      sl.style.opacity=0;sr.style.opacity=0;setTimeout(()=>top.style.transition='',300);}}
  function pt(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
  top.addEventListener('touchstart',down,{passive:true});
  top.addEventListener('touchmove',mv,{passive:true});
  top.addEventListener('touchend',up);
  top.addEventListener('mousedown',down);
  addEventListener('mousemove',mv);
  addEventListener('mouseup',up);
  // tap options
  top.querySelectorAll('.opt').forEach((o,oi)=>{
    o.onclick=()=>commit(oi===0?'A':'B');});
  function commit(ch){
    top.style.transition='transform .35s ease';
    const x=ch==='A'?-innerWidth:innerWidth;
    top.style.transform=`translate(${x}px,0) rotate(${x/10}deg)`;top.style.opacity=0;
    recordAnswer(c,ch);
    setTimeout(()=>{state.idx++;if(state.idx>=state.cards.length){finishTest();}
      else renderStage();},340);
  }
}
function recordAnswer(c,ch){
  if(c.type==='interest'){
    const tag=c.q.tag[ch==='A'?0:1];
    state.answers.push({type:'interest',tag});
  }else{
    const pole=ch==='A'?c.q.a0:c.q.a1;
    state.answers.push({type:'mbti',dim:c.q.dim,pole});
  }
}

/* ===================== RESULT ===================== */
function finishTest(){
  // MBTI type
  const cnt={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  state.answers.filter(a=>a.type==='mbti').forEach(a=>cnt[a.pole]++);
  const type=(cnt.E>=cnt.I?'E':'I')+(cnt.S>=cnt.N?'S':'N')+(cnt.T>=cnt.F?'T':'F')+(cnt.J>=cnt.P?'J':'P');
  // interests
  const ic={};state.answers.filter(a=>a.type==='interest').forEach(a=>ic[a.tag]=(ic[a.tag]||0)+1);
  const topTags=Object.entries(ic).sort((a,b)=>b[1]-a[1]).map(e=>e[0]).slice(0,2);
  while(topTags.length<2)topTags.push(['运动','美食','旅行'][topTags.length]);
  renderResult(type,topTags);
  show('scr-result');
}
