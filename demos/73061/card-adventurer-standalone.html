<!-- PDD-COMBAT-001 战斗系统程序设计文档 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡牌冒险者 - 战斗系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            width: 800px;
            height: 600px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .enemy-area {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(248, 81, 73, 0.05);
            border-bottom: 2px dashed rgba(248, 81, 73, 0.3);
        }

        .enemy-info {
            text-align: center;
            width: 100%;
        }

        .enemy-name {
            font-size: 24px;
            font-weight: bold;
            color: #f56565;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(245, 101, 101, 0.5);
        }

        .enemy-hp-bar-container {
            width: 300px;
            height: 25px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(248, 81, 73, 0.3);
        }

        .enemy-hp-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff4d4f 0%, #ff7875 100%);
            border-radius: 12px;
            transition: width 0.5s ease;
        }

        .enemy-hp-text {
            color: #ff7875;
            font-size: 14px;
            margin-top: 5px;
        }

        /* 敌人意图显示（Bug 2修复） */
        .enemy-intent {
            margin-top: 10px;
            color: #ffa940;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 169, 64, 0.5);
        }

        .battle-area {
            flex: 0.4;
            min-height: 60px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .battle-message {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
        }

        .player-area {
            flex: 1.8;
            min-height: 280px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: rgba(63, 185, 80, 0.05);
        }

        .player-stats {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }

        .player-info {
            text-align: center;
        }

        .player-name {
            font-size: 20px;
            font-weight: bold;
            color: #67c23a;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(103, 194, 58, 0.5);
        }

        .stat-bar-container {
            width: 200px;
            height: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(103, 194, 58, 0.3);
        }

        .hp-bar {
            height: 100%;
            background: linear-gradient(90deg, #52c41a 0%, #95de64 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .mana-bar-container {
            width: 150px;
            height: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(64, 158, 255, 0.3);
        }

        .mana-bar {
            height: 100%;
            background: linear-gradient(90deg, #1890ff 0%, #69c0ff 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .shield-bar-container {
            width: 150px;
            height: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(250, 204, 21, 0.3);
        }

        .shield-bar {
            height: 100%;
            background: linear-gradient(90deg, #d4af37 0%, #ffd700 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .stat-text {
            color: #95de64;
            font-size: 13px;
            margin-top: 4px;
        }

        .mana-text {
            color: #69c0ff;
            font-size: 13px;
            margin-top: 4px;
        }

        .shield-text {
            color: #ffd700;
            font-size: 13px;
            margin-top: 4px;
        }

        .equipment-slot {
            cursor: pointer;
            border: 2px dashed rgba(255, 215, 0, 0.5);
            border-radius: 8px;
            padding: 8px 12px;
            min-width: 80px;
            text-align: center;
        }
        .equipment-slot:hover { border-color: #ffd700; }
        .equipment-label { color: #ffd700; font-size: 12px; }
        .equipment-card { color: #d4af37; font-size: 14px; font-weight: bold; }

        /* 牌组/弃牌堆信息（新功能） */
        .pile-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: center;
            min-width: 80px;
        }
        .pile-text {
            color: #8c8c8c;
            font-size: 12px;
        }

        .hand-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            min-height: 180px;
            align-items: center;
        }

        .card {
            width: 120px;
            height: 160px;
            background: linear-gradient(145deg, #2d3748 0%, #1a202c 100%);
            border-radius: 10px;
            border: 2px solid #4a5568;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 255, 255, 0.2);
            border-color: #68d391;
        }

        .card-cost {
            width: 28px;
            height: 28px;
            background: linear-gradient(145deg, #4299e1 0%, #3182ce 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(66, 153, 225, 0.4);
        }

        .card-name {
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
        }

        .card-description {
            color: #a0aec0;
            font-size: 12px;
            text-align: center;
        }

        .action-area {
            margin-top: 10px;
            text-align: right;
            width: 800px;
        }

        .end-turn-btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #fa8c16 0%, #ffc53d 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(250, 140, 22, 0.4);
            transition: all 0.3s ease;
        }

        .end-turn-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(250, 140, 22, 0.6);
        }

        .end-turn-btn:active {
            transform: translateY(0);
        }

        /* 选卡奖励遮罩层（GDD §5 战斗胜利→选卡奖励） */
        .reward-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .reward-title {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .reward-cards {
            display: flex;
            gap: 20px;
        }

        /* 奖励卡牌放大，hover高亮 */
        .reward-cards .card {
            transform: scale(1.1);
        }

        .reward-cards .card:hover {
            transform: scale(1.2);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="enemy-area">
            <div class="enemy-info">
                <div class="enemy-name">史莱姆</div>
                <div class="enemy-hp-bar-container">
                    <div class="enemy-hp-bar" style="width: 100%"></div>
                </div>
                <div class="enemy-hp-text">HP: 50/50</div>
                <div class="enemy-intent" id="enemyIntent" style="display:none">
                    意图：<span id="enemyIntentText"></span>
                </div>
            </div>
        </div>

        <div class="battle-area">
            <div class="battle-message">战斗开始！</div>
        </div>

        <div class="player-area">
            <div class="player-stats">
                <div class="player-info">
                    <div class="player-name">战士</div>
                    <div class="stat-bar-container">
                        <div class="hp-bar" style="width: 100%"></div>
                    </div>
                    <div class="stat-text">HP: 200/200</div>
                </div>
                <div class="player-info">
                    <div class="player-name">法力</div>
                    <div class="mana-bar-container">
                        <div class="mana-bar" style="width: 100%"></div>
                    </div>
                    <div class="mana-text">MANA: 1/1</div>
                </div>
                <div class="player-info">
                    <div class="player-name">护盾</div>
                    <div class="shield-bar-container">
                        <div class="shield-bar" style="width: 0%"></div>
                    </div>
                    <div class="shield-text">SHIELD: 0</div>
                </div>
                <div class="equipment-slot" id="equipmentSlot" onclick="unequipCard()">
                    <span class="equipment-label">装备栏</span>
                    <div class="equipment-card" id="equipmentCard">空</div>
                </div>
                <div class="pile-info" id="pileInfo">
                    <span class="pile-text">牌组: <span id="deckCount">0</span></span>
                    <span class="pile-text">弃牌堆: <span id="discardCount">0</span></span>
                </div>
            </div>
            <div class="hand-area" id="handArea"></div>
        </div>

        <!-- 选卡奖励遮罩层（GDD §5 战斗胜利→选卡奖励） -->
        <div class="reward-overlay" id="rewardOverlay" style="display:none">
            <div class="reward-title">选择一张卡牌加入牌库！</div>
            <div class="reward-cards" id="rewardCards"></div>
        </div>
    </div>

    <div class="action-area">
        <button class="end-turn-btn">结束回合</button>
    </div>

    <script>
        // ========== CSV 数据加载与解析层 ==========
        var cardDefinitions = {};
        var enemyDataMap = {};

        // CSV 解析器：跳过 # 开头的注释行
        function parseCSV(csvText) {
            var allLines = csvText.split('\n');
            var dataLines = [];
            for (var i = 0; i < allLines.length; i++) {
                var line = allLines[i].trim();
                if (line && line[0] !== '#') dataLines.push(line);
            }
            if (dataLines.length === 0) return [];
            var headers = dataLines[0].split(',').map(function(h) { return h.trim(); });
            var result = [];
            for (var r = 1; r < dataLines.length; r++) {
                var values = dataLines[r].split(',').map(function(v) { return v.trim(); });
                var obj = {};
                for (var j = 0; j < headers.length; j++) {
                    obj[headers[j]] = (j < values.length) ? values[j] : '';
                }
                result.push(obj);
            }
            return result;
        }

        // ========== 内嵌游戏数据（单文件版，无需服务器） ==========
        var EMBEDDED_CSV = {
            cards: '# 卡牌配置 | card_id:编号 | name_zh:中文名 | name_en:英文名 | type:类型(basic/skill/equip/status) | cost:费用 | rarity:稀有度(common/uncommon/rare/epic) | tags:标签(逗号分隔)\ncard_id,name_zh,name_en,type,cost,rarity,tags\nC001,攻击,Attack,basic,0,common,\nC002,防御,Defend,basic,0,common,\nC003,重击,Heavy Strike,skill,1,common,\nC004,治疗,Heal,skill,1,common,\nC005,护甲,Armor,equip,1,common,装备\nC006,武器,Weapon,equip,1,common,装备\nC007,斩击,Slash,skill,1,common,',
            cardEffects: '# 卡牌效果配置 | card_id:关联卡牌 | effect_type:效果类型 | value:数值 | target:目标(self/enemy) | timing:触发时机(on_play/turn_start/turn_end) | duration:持续回合(0=瞬时,-1=永久)\ncard_id,effect_type,value,target,timing,duration\nC001,damage,10,enemy,on_play,0\nC002,shield,5,self,on_play,0\nC003,damage,25,enemy,on_play,0\nC004,heal,15,self,on_play,0\nC005,shield_per_turn,3,self,turn_start,-1\nC006,damage_bonus,5,self,on_play,-1\nC007,damage,20,enemy,on_play,0\nC007,heal,2,self,on_play,0',
            enemies: '# 敌人配置 | enemy_id:编号 | name_zh:中文名 | name_en:英文名 | hp:生命值 | atk:攻击力\nenemy_id,name_zh,name_en,hp,atk\nE001,史莱姆,Slime,50,8\nE002,哥布林,Goblin,70,10\nE003,骷髅兵,Skeleton,90,12\nE004,狼人,Werewolf,110,14\nE005,暗影领主,Shadow Lord,150,15',
            enemySkills: '# 敌人技能配置 | enemy_id:敌人编号 | name_zh:技能名 | name_en:英文名 | probability:概率权重 | damage:伤害 | heal:治疗 | shield:护盾 | buff:增益类型(berserk/flee) | desc_zh:描述\nenemy_id,name_zh,name_en,probability,damage,heal,shield,buff,desc_zh\nE001,普通攻击,Normal Attack,0.60,8,0,0,,造成8点伤害\nE001,跳跃攻击,Jump Attack,0.30,15,0,0,,造成15点伤害\nE001,分裂,Split,0.10,0,5,0,,恢复5点生命值\nE002,普通攻击,Normal Attack,0.50,10,0,0,,造成10点伤害\nE002,投掷匕首,Dagger Throw,0.35,18,0,0,,造成18点伤害\nE002,逃跑,Flee,0.15,0,0,0,flee,跳过回合\nE003,普通攻击,Normal Attack,0.45,12,0,0,,造成12点伤害\nE003,骨盾,Bone Shield,0.35,0,0,5,,获得5点护盾\nE003,召唤,Summon,0.20,0,10,0,,恢复10点生命值\nE004,普通攻击,Normal Attack,0.40,14,0,0,,造成14点伤害\nE004,狂暴,Berserk,0.35,0,0,0,berserk,下回合攻击力翻倍\nE004,恢复,Regenerate,0.25,0,15,0,,恢复15点生命值\nE005,暗影打击,Shadow Strike,0.50,20,0,0,,造成20点伤害\nE005,黑暗护盾,Dark Shield,0.30,0,0,10,,获得10点护盾\nE005,召唤暗影,Summon Shadow,0.20,0,20,0,,恢复20点生命值',
            professions: '# 职业配置 | prof_id:编号 | name_zh:中文名 | name_en:英文名 | hp:生命值 | mana:法力上限\nprof_id,name_zh,name_en,hp,mana\nP001,战士,Warrior,200,1',
            profStartingDeck: '# 职业初始牌组 | prof_id:职业编号 | card_id:卡牌编号 | count:数量\nprof_id,card_id,count\nP001,C001,3\nP001,C002,1\nP001,C007,1',
            statusEffects: '# 状态效果配置 | status_id:编号 | name_zh:中文名 | name_en:英文名 | effect_desc_zh:中文描述 | effect_desc_en:英文描述 | duration_type:持续类型 | duration_value:持续回合数\nstatus_id,name_zh,name_en,effect_desc_zh,effect_desc_en,duration_type,duration_value\nS001,护盾,Shield,抵消伤害,Block incoming damage,current_turn,1\nS002,狂暴,Berserk,攻击力翻倍,ATK doubled,in_turns,1\nS003,虚弱,Weakness,攻击力减半,ATK halved,in_turns,2',
            equipmentSlots: '# 装备栏规则配置 | key:规则键 | value_zh:中文说明 | value_en:英文说明\nkey,value_zh,value_en\nINITIAL_SLOTS,1 个通用栏位,1 universal slot\nMAX_EQUIP,最多同时装备 1 件,Max 1 equipped at a time\nUNEQUIP_TIMING,随时可卸（免费动作）,Free action anytime\nUNEQUIP_AFTER,装备卡移入弃牌堆可参与重抽,Equipment card moves to discard pile\nBATTLE_END,装备栏不回溯影响牌库,Equipment slot does not affect collection'
        };

        var csvData = {};

        // 效果类型 → 显示描述映射
        var effectDescMap = {
            'damage': function(v) { return '造成' + v + '点伤害'; },
            'shield': function(v) { return '获得' + v + '点护盾'; },
            'heal': function(v) { return '恢复' + v + '点生命值'; },
            'shield_per_turn': function(v) { return '每回合开始获得' + v + '点护盾'; },
            'damage_bonus': function(v) { return '每回合攻击伤害+' + v; }
        };

        // 从 cards.csv + card_effects.csv 构建 cardDefinitions
        function buildCardDefinitions() {
            cardDefinitions = {};
            // Step 1: 卡牌元数据
            csvData.cards.forEach(function(row) {
                cardDefinitions[row.card_id] = {
                    id: row.card_id,
                    name: row.name_zh,
                    type: row.type,
                    cost: parseInt(row.cost) || 0,
                    rarity: row.rarity || 'common',
                    tags: row.tags || '',
                    effects: []  // 由 card_effects.csv 填充
                };
            });
            // Step 2: 合并效果（一卡可有多行）
            csvData.cardEffects.forEach(function(eff) {
                var card = cardDefinitions[eff.card_id];
                if (!card) return;
                var val = parseInt(eff.value) || 0;
                card.effects.push({
                    type: eff.effect_type,
                    value: val,
                    target: eff.target || 'enemy',
                    timing: eff.timing || 'on_play',
                    duration: parseInt(eff.duration) || 0
                });
            });
            // Step 3: 生成多效果描述 + 向后兼容属性
            Object.keys(cardDefinitions).forEach(function(cid) {
                var card = cardDefinitions[cid];
                var parts = [];
                card.effects.forEach(function(eff) {
                    var descFn = effectDescMap[eff.type];
                    if (descFn) parts.push(descFn(eff.value));
                    else parts.push(eff.type);
                });
                card.description = parts.join('，') || '(无效果)';
                // 向后兼容：从首个效果推导 effectType
                if (card.effects.length > 0) {
                    var first = card.effects[0];
                    card.effectType = first.type;
                    switch (first.type) {
                        case 'damage': card.damage = first.value; break;
                        case 'shield': card.shield = first.value; break;
                        case 'heal': card.heal = first.value; break;
                        case 'shield_per_turn': card.shieldPerTurn = first.value; card.effectType = 'equipment_shield'; break;
                        case 'damage_bonus': card.bonusDamage = first.value; card.effectType = 'equipment_damage'; break;
                    }
                }
            });
        }

        // 从 enemy_skills.csv 构建敌人技能映射
        function buildEnemySkillMap() {
            var map = {};
            csvData.enemySkills.forEach(function(row) {
                if (!map[row.enemy_id]) map[row.enemy_id] = [];
                var skill = {
                    name: row.name_zh,
                    weight: parseFloat(row.probability)
                };
                var dmg = parseInt(row.damage) || 0;
                var heal = parseInt(row.heal) || 0;
                var shield = parseInt(row.shield) || 0;
                if (dmg > 0) skill.damage = dmg;
                if (heal > 0) skill.heal = heal;
                if (shield > 0) skill.shield = shield;
                if (row.buff === 'berserk') skill.isBerserk = true;
                if (row.buff === 'flee') skill.isFlee = true;
                map[row.enemy_id].push(skill);
            });
            return map;
        }

        // 从 enemies.csv 构建敌人基础数据
        function buildEnemyData(skillMap) {
            var result = {};
            csvData.enemies.forEach(function(row) {
                result[row.enemy_id] = {
                    id: row.enemy_id,
                    name: row.name_zh,
                    hp: parseInt(row.hp),
                    maxHp: parseInt(row.hp),
                    attack: parseInt(row.atk),
                    shield: 0,
                    intents: skillMap[row.enemy_id] || []
                };
            });
            return result;
        }

        // 从 professions.csv + profession_starting_deck.csv 填充玩家数据
        function buildPlayerFromCSV() {
            var prof = csvData.professions[0];
            player.id = prof.prof_id;
            player.name = prof.name_zh;
            player.hp = parseInt(prof.hp);
            player.maxHp = parseInt(prof.hp);
            player.maxMana = parseInt(prof.mana);
            player.mana = parseInt(prof.mana);

            // 从 profession_starting_deck.csv 构建初始牌组
            player.collection = [];
            csvData.profStartingDeck.forEach(function(row) {
                if (row.prof_id !== player.id) return;
                var count = parseInt(row.count) || 0;
                for (var i = 0; i < count; i++) {
                    var cd = cardDefinitions[row.card_id];
                    if (cd) player.collection.push(JSON.parse(JSON.stringify(cd)));
                }
            });
        }

        // 主加载入口：解析内嵌 CSV → 构建运行时数据 → 启动游戏（单文件版，无需服务器）
        function loadAllGameData() {
            csvData.cards = parseCSV(EMBEDDED_CSV.cards);
            csvData.cardEffects = parseCSV(EMBEDDED_CSV.cardEffects);
            csvData.enemies = parseCSV(EMBEDDED_CSV.enemies);
            csvData.enemySkills = parseCSV(EMBEDDED_CSV.enemySkills);
            csvData.professions = parseCSV(EMBEDDED_CSV.professions);
            csvData.profStartingDeck = parseCSV(EMBEDDED_CSV.profStartingDeck);
            csvData.statusEffects = parseCSV(EMBEDDED_CSV.statusEffects);
            csvData.equipmentSlots = parseCSV(EMBEDDED_CSV.equipmentSlots);

            buildCardDefinitions();
            var skillMap = buildEnemySkillMap();
            enemyDataMap = buildEnemyData(skillMap);
            buildPlayerFromCSV();

            // 初始敌人
            Object.assign(enemy, enemyDataMap['E001']);

            // 启动战斗
            initializeDeck();
            player.mana = player.maxMana;
            drawCard(5);
            renderPlayerStats();
            renderEnemyStats();
            renderPileInfo();
            var firstIntent = selectIntent();
            showEnemyIntent(firstIntent);
            document.querySelector('.battle-message').textContent = '战斗开始！你遇到了 ' + enemy.name + '！';
        }

        // ========== 游戏数据（由 CSV 加载填充） ==========
        const player = {
            id: "P001",
            name: "",
            hp: 200,
            maxHp: 200,
            mana: 1,
            maxMana: 1,
            shield: 0,
            deck: [],
            hand: [],
            discard: [],
            equipment: { slot: null },
            collection: []
        };

        const enemy = {
            id: "E001",
            name: "",
            hp: 50,
            maxHp: 50,
            attack: 8,
            shield: 0,
            intents: []
        };

        const gameState = {
            player: player,
            enemy: enemy,
            turn: "player_turn",
            battleNumber: 1,
            isVictory: false,
            isDefeat: false,
            selectedCard: null
        };

        // 当前敌人意图（Bug 2修复：敌人在玩家回合开始时展示意图）
        var currentEnemyIntent = null;

        function renderPlayerStats() {
            const hpBar = document.querySelector('.hp-bar');
            const hpText = document.querySelector('.stat-text');
            const manaBar = document.querySelector('.mana-bar');
            const manaText = document.querySelector('.mana-text');
            const shieldBar = document.querySelector('.shield-bar');
            const shieldText = document.querySelector('.shield-text');

            const hpPercent = (player.hp / player.maxHp) * 100;
            const manaPercent = (player.mana / player.maxMana) * 100;
            const shieldPercent = Math.min(100, (player.shield / 50) * 100);

            hpBar.style.width = hpPercent + '%';
            hpText.textContent = `HP: ${player.hp}/${player.maxHp}`;
            manaBar.style.width = manaPercent + '%';
            manaText.textContent = `MANA: ${player.mana}/${player.maxMana}`;
            shieldBar.style.width = shieldPercent + '%';
            shieldText.textContent = `SHIELD: ${player.shield}`;
        }

        function renderEnemyStats() {
            const hpBar = document.querySelector('.enemy-hp-bar');
            const hpText = document.querySelector('.enemy-hp-text');

            const hpPercent = (enemy.hp / enemy.maxHp) * 100;

            hpBar.style.width = hpPercent + '%';
            hpText.textContent = `HP: ${enemy.hp}/${enemy.maxHp}`;
        }

        function renderHand() {
            const handArea = document.getElementById('handArea');
            handArea.innerHTML = '';

            player.hand.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card';
                cardElement.dataset.index = index;
                cardElement.innerHTML = `
                    <div class="card-cost">${card.cost}</div>
                    <div class="card-name">${card.name}</div>
                    <div class="card-description">${card.description}</div>
                `;
                cardElement.addEventListener('click', () => playCard(card.id));
                handArea.appendChild(cardElement);
            });
            renderPileInfo();
        }

        function addShield(amount) {
            player.shield += amount;
        }

        // 洗牌工具函数：Fisher-Yates 算法，原地洗牌
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 战斗开始：从牌库深拷贝构建牌组，随机洗牌（GDD §4.3）
        function initializeDeck() {
            player.deck = JSON.parse(JSON.stringify(player.collection));
            shuffleArray(player.deck);
        }

        // 将弃牌堆洗入牌组（GDD §4.3：牌组空时触发）
        function shuffleDiscardToDeck() {
            // 弃牌堆所有卡牌移入牌组
            while (player.discard.length > 0) {
                player.deck.push(player.discard.pop());
            }
            shuffleArray(player.deck);
        }

        // 从牌组抽指定数量卡牌到手牌（GDD §4.3：牌组空时先洗入弃牌堆）
        function drawCard(count) {
            for (let i = 0; i < count; i++) {
                if (player.deck.length === 0) {
                    shuffleDiscardToDeck();
                }
                if (player.deck.length > 0) {
                    player.hand.push(player.deck.pop());
                }
            }
            renderHand();
        }

        // 弃置所有手牌到弃牌堆（GDD §4.3：回合结束动作）
        function discardHand() {
            while (player.hand.length > 0) {
                player.discard.push(player.hand.pop());
            }
            player.hand = [];
            renderHand();
        }

        // 显示敌人意图（Bug 2修复）
        function showEnemyIntent(intent) {
            currentEnemyIntent = intent;
            document.getElementById('enemyIntent').style.display = 'block';
            document.getElementById('enemyIntentText').textContent = intent.name;
        }

        // 隐藏敌人意图（Bug 2修复）
        function hideEnemyIntent() {
            document.getElementById('enemyIntent').style.display = 'none';
        }

        // 渲染牌组/弃牌堆数量（新功能）
        function renderPileInfo() {
            document.getElementById('deckCount').textContent = player.deck.length;
            document.getElementById('discardCount').textContent = player.discard.length;
        }

        // 开始指定场次的战斗（Bug 3修复：选牌后触发下一场，GDD §2.3/§4.2/§4.4）
        function startBattle(battleNumber) {
            // 从 CSV 加载的 enemyDataMap 中按顺序取敌人
            var enemyOrder = Object.keys(enemyDataMap);
            var enemyIndex = Math.min(battleNumber - 1, enemyOrder.length - 1);
            var enemyId = enemyOrder[enemyIndex];
            var enemyData = JSON.parse(JSON.stringify(enemyDataMap[enemyId]));

            // 动态计算HP = 50 + 20*(battleNumber-1)（GDD §4.4），Boss保持CSV定义的HP
            if (battleNumber < enemyOrder.length) {
                var dynamicHp = 50 + 20 * (battleNumber - 1);
                enemyData.hp = dynamicHp;
                enemyData.maxHp = dynamicHp;
            }

            // 重置敌人
            Object.assign(enemy, enemyData);

            // 重置战斗状态
            gameState.battleNumber = battleNumber;
            gameState.isVictory = false;
            gameState.isDefeat = false;
            gameState.turn = "player_turn";
            document.querySelector('.end-turn-btn').disabled = false;

            // 重置玩家临时战斗数据（保留HP/collection/equipment，GDD §4.5）
            player.deck = [];
            player.hand = [];
            player.discard = [];
            player.shield = 0;
            player.mana = player.maxMana;

            // 重建牌组并抽牌（GDD §4.3）
            initializeDeck();
            drawCard(5);

            // 预选并显示敌人意图（Bug 2修复）
            var intent = selectIntent();
            showEnemyIntent(intent);

            // 更新UI
            document.querySelector('.enemy-name').textContent = enemy.name;
            document.querySelector('.battle-message').textContent =
                '战斗开始！你遇到了 ' + enemy.name + '！（第' + battleNumber + '场）';

            renderPlayerStats();
            renderEnemyStats();
            renderEquipment();
            renderPileInfo();
        }

        function playCard(cardId) {
            if (gameState.turn !== "player_turn") {
                return;
            }

            var cardIndex = player.hand.findIndex(function(c) { return c.id === cardId; });
            if (cardIndex === -1) {
                return;
            }

            var card = player.hand[cardIndex];
            if (player.mana < card.cost) {
                return;
            }

            player.mana -= card.cost;

            // 装备牌走装备流程
            if (card.type === 'equip') {
                equipCard(cardId);
                return;
            }

            // 遍历所有 effects，执行 timing=on_play 的效果
            var effects = card.effects || [];
            for (var i = 0; i < effects.length; i++) {
                var eff = effects[i];
                if (eff.timing !== 'on_play') continue;
                executeEffect(eff);
            }

            // 基本牌/技能牌：移入弃牌堆（GDD §4.3）
            player.discard.push(card);
            player.hand.splice(cardIndex, 1);

            renderPlayerStats();
            renderEnemyStats();
            renderHand();
            checkBattleEnd();
        }

        // 执行单个效果
        function executeEffect(eff) {
            var val = eff.value || 0;
            switch (eff.type) {
                case 'damage':
                    var totalDamage = val;
                    if (eff.target === 'enemy' && player.equipment.slot && player.equipment.slot.bonusDamage) {
                        totalDamage += player.equipment.slot.bonusDamage;
                    }
                    if (eff.target === 'enemy') {
                        enemy.hp = Math.max(0, enemy.hp - totalDamage);
                    } else if (eff.target === 'self') {
                        // 自伤效果
                        takeDamage(totalDamage);
                    }
                    break;
                case 'shield':
                    if (eff.target === 'self') {
                        addShield(val);
                    }
                    break;
                case 'heal':
                    if (eff.target === 'self') {
                        player.hp = Math.min(player.maxHp, player.hp + val);
                    }
                    break;
            }
        }

        // 装备卡牌到装备栏（GDD §2.5/§4.7）
        function equipCard(cardId) {
            var cardIndex = player.hand.findIndex(function(c) { return c.id === cardId; });
            if (cardIndex === -1) return;

            var card = player.hand[cardIndex];
            // 从手牌移除
            player.hand.splice(cardIndex, 1);

            // 如果装备栏已有装备，先卸下→移入弃牌堆（GDD §2.5）
            if (player.equipment.slot) {
                player.discard.push(player.equipment.slot);
            }

            // 装备卡存入装备栏（不进弃牌堆）
            player.equipment.slot = card;

            renderPlayerStats();
            renderEnemyStats();
            renderHand();
            renderEquipment();
        }

        // 卸下装备栏中的卡牌（GDD §2.5）
        function unequipCard() {
            // 装备栏为空，不操作
            if (!player.equipment.slot) return;

            // 装备卡移入弃牌堆（GDD §2.5）
            player.discard.push(player.equipment.slot);
            player.equipment.slot = null;

            renderPlayerStats();
            renderEnemyStats();
            renderHand();
            renderEquipment();
        }

        // 渲染装备栏 UI
        function renderEquipment() {
            var slot = document.getElementById('equipmentCard');
            if (player.equipment.slot) {
                slot.textContent = player.equipment.slot.name;
                slot.style.color = '#ffd700';
            } else {
                slot.textContent = '空';
                slot.style.color = '#666';
            }
        }

        // 敌人AI：加权随机选择意图（TDD §5.4 selectIntent）
        function selectIntent() {
            var totalWeight = enemy.intents.reduce(function(sum, i) { return sum + i.weight; }, 0);
            var roll = Math.random() * totalWeight;
            var cumulative = 0;
            for (var i = 0; i < enemy.intents.length; i++) {
                cumulative += enemy.intents[i].weight;
                if (roll <= cumulative) {
                    return enemy.intents[i];
                }
            }
            return enemy.intents[enemy.intents.length - 1];
        }

        // 执行敌人意图（TDD §5.4 executeIntent）
        function executeIntent(intent) {
            hideEnemyIntent();
            var msg = enemy.name + ' 使用 ' + intent.name;
            // 狂暴：伤害 = 敌人攻击力 × 2
            if (intent.isBerserk) {
                var berserkDmg = enemy.attack * 2;
                msg += '，造成 ' + berserkDmg + ' 点伤害';
                takeDamage(berserkDmg);
            }
            if (intent.damage) {
                msg += '，造成 ' + intent.damage + ' 点伤害';
                takeDamage(intent.damage);
            }
            if (intent.heal) {
                msg += '，恢复 ' + intent.heal + ' 点生命';
                enemy.hp = Math.min(enemy.maxHp, enemy.hp + intent.heal);
            }
            if (intent.shield) {
                msg += '，获得 ' + intent.shield + ' 点护盾';
                enemy.shield += intent.shield;
            }
            // buff类（如狂暴）和特殊类（如逃跑）在prototype阶段暂不实现（GDD §4.2标注）
            document.querySelector('.battle-message').textContent = msg;
        }

        // 玩家受到伤害，护盾优先消耗（GDD §2.4 S001）
        function takeDamage(amount) {
            if (player.shield > 0) {
                if (player.shield >= amount) {
                    player.shield -= amount;
                    amount = 0;
                } else {
                    amount -= player.shield;
                    player.shield = 0;
                }
            }
            player.hp = Math.max(0, player.hp - amount);
        }

        // 检查战斗结束条件（TDD §5.2 checkBattleEnd）
        function checkBattleEnd() {
            if (enemy.hp <= 0) {
                gameState.isVictory = true;
                gameState.turn = "battle_end";
                document.querySelector('.battle-message').textContent = '胜利！击败了 ' + enemy.name + '！';
                document.querySelector('.end-turn-btn').disabled = true;
                // 延迟显示选卡奖励界面（GDD §5 战斗胜利→选卡奖励）
                setTimeout(function() {
                    showRewardScreen();
                }, 1200);
            } else if (player.hp <= 0) {
                gameState.isDefeat = true;
                document.querySelector('.battle-message').textContent = '失败...被 ' + enemy.name + ' 击败了';
                document.querySelector('.end-turn-btn').disabled = true;
            }
        }

        // 添加卡牌到持久化牌库（TDD §5.1 addToCollection，GDD §4.5 深拷贝规则）
        function addToCollection(card) {
            var cardCopy = JSON.parse(JSON.stringify(card));
            player.collection.push(cardCopy);
        }

        // 显示选卡奖励界面（TDD §5.2 showRewardScreen，GDD §5 战斗胜利→选卡奖励）
        function showRewardScreen() {
            // 从 cardDefinitions 中随机选3张不重复的卡牌
            var allCardIds = Object.keys(cardDefinitions);
            shuffleArray(allCardIds);
            var rewardCards = allCardIds.slice(0, 3);

            // 渲染奖励卡牌
            var container = document.getElementById('rewardCards');
            container.innerHTML = '';
            rewardCards.forEach(function(cardId) {
                var card = cardDefinitions[cardId];
                var el = document.createElement('div');
                el.className = 'card';
                el.style.margin = '0 10px';
                el.innerHTML =
                    '<div class="card-cost">' + card.cost + '</div>' +
                    '<div class="card-name">' + card.name + '</div>' +
                    '<div class="card-description">' + card.description + '</div>';
                el.addEventListener('click', function() {
                    // 深拷贝后加入牌库（GDD §4.5）
                    addToCollection(card);
                    // 关闭奖励遮罩层
                    document.getElementById('rewardOverlay').style.display = 'none';
                    // 更新战斗消息
                    document.querySelector('.battle-message').textContent = '获得新卡牌：' + card.name + '！';
                    // Bug 3修复：延迟后开始下一场战斗
                    setTimeout(function() {
                        startBattle(gameState.battleNumber + 1);
                    }, 1500);
                });
                container.appendChild(el);
            });

            // 显示奖励遮罩层
            document.getElementById('rewardOverlay').style.display = 'flex';
        }

        function endPlayerTurn() {
            if (gameState.turn !== "player_turn") return;

            // 回合结束：弃置所有手牌（GDD §4.3）
            discardHand();

            gameState.turn = "enemy_turn";

            // 敌人AI：选择意图并执行（TDD §5.4）
            var intent = selectIntent();
            setTimeout(function() {
                executeIntent(intent);
                renderPlayerStats();
                renderEnemyStats();
                checkBattleEnd();

                if (!gameState.isVictory && !gameState.isDefeat) {
                    // 护盾在回合结束后清零（GDD §2.4 S001持续本回合）
                    player.shield = 0;
                    // 装备效果触发（GDD §4.7）：护甲每回合开始+护盾
                    if (player.equipment.slot && player.equipment.slot.effectType === "equipment_shield") {
                        player.shield += player.equipment.slot.shieldPerTurn;
                    }
                    // 法力重置（GDD §4.3）
                    player.mana = player.maxMana;
                    // 抽5张牌（GDD §4.3）
                    drawCard(5);
                    gameState.turn = "player_turn";
                    // Bug 2修复：预选并显示下回合敌人意图
                    var nextIntent = selectIntent();
                    showEnemyIntent(nextIntent);
                    renderPileInfo();
                }
                renderPlayerStats();
                renderEnemyStats();
            }, 800);
        }

        document.querySelector('.end-turn-btn').addEventListener('click', endPlayerTurn);

        // 加载内嵌数据并启动游戏
        loadAllGameData();
    </script>
</body>
</html>
