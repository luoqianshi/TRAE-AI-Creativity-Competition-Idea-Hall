<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>字造 · Word Alchemy</title>
<style>
  :root{
    --bg1:#fdf6ec; --bg2:#f6e4cf;
    --ink:#4a3b2a; --muted:#8a7560; --soft:#a98b6e;
    --accent:#e8826a; --accent2:#f4a25a;
    --card:#fff7ee; --line:#ead9c2;
    --shadow:0 6px 18px rgba(120,80,40,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:radial-gradient(130% 90% at 50% -10%, #fff3e2 0%, var(--bg1) 42%, var(--bg2) 100%);
    background-attachment:fixed;
    min-height:100vh; overflow-x:hidden;
    user-select:none; -webkit-user-select:none;
  }
  #app{max-width:760px;margin:0 auto;padding:14px 14px 280px;position:relative;}

  header{text-align:center;padding:4px 0 8px;}
  .brand{font-size:13px;letter-spacing:6px;color:var(--muted);margin:0;font-weight:600;}
  .brand b{color:var(--accent);}
  .lvl{display:inline-block;margin-top:8px;font-size:12px;color:var(--muted);
    background:#fff3e6;border:1px solid var(--line);border-radius:999px;padding:3px 14px;}

  .target-wrap{margin:16px auto 4px;text-align:center;}
  .target-label{font-size:11px;color:var(--muted);letter-spacing:3px;}
  .target{
    display:inline-block;margin-top:8px;font-size:34px;font-weight:800;letter-spacing:5px;
    padding:10px 30px;border-radius:20px;color:#fff;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    box-shadow:0 12px 26px rgba(232,130,106,.38), inset 0 1px 0 rgba(255,255,255,.45);
    animation:floaty 3.2s ease-in-out infinite;
  }
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  .controls{display:flex;justify-content:center;gap:10px;margin:14px 0 4px;}
  .btn{border:1px solid var(--line);background:#fff7ee;color:var(--ink);
    border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer;
    box-shadow:var(--shadow);transition:transform .15s, background .15s; font-weight:600;}
  .btn:active{transform:scale(.94);}
  .btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border:none;}
  .btn.ghost{background:rgba(255,255,255,.6);}

  #pool{margin-top:16px;min-height:220px;display:flex;flex-wrap:wrap;justify-content:center;
    align-items:center;gap:12px;padding:10px 6px;}
  .card{position:relative;cursor:grab;min-width:60px;text-align:center;
    padding:14px 18px;border-radius:16px;font-size:22px;font-weight:700;letter-spacing:2px;
    color:#5a4632;background:var(--card);
    box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7);
    transition:transform .18s ease, box-shadow .18s ease;touch-action:none;}
  .card:hover{transform:translateY(-2px) scale(1.04);}
  .card:active{cursor:grabbing;}
  .card.dragging{opacity:.32;}
  .card.pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both;}
  @keyframes pop{0%{transform:scale(0) rotate(-8deg);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
  .card.merging{transform:translate(var(--mx,0),0) scale(.35) rotate(6deg);opacity:0;
    transition:transform .38s cubic-bezier(.5,0,.75,0),opacity .38s ease;}
  .card.hint{animation:hint .9s ease 2;}
  @keyframes hint{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 6px rgba(232,130,106,.4),0 6px 18px rgba(232,130,106,.3)}}

  #lab{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;max-width:calc(100vw - 24px);
    background:rgba(255,247,238,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:24px;padding:12px 16px;
    box-shadow:0 14px 34px rgba(120,80,40,.2);z-index:20;}
  .slot{width:76px;height:76px;border-radius:16px;border:2px dashed #d8bfa0;
    display:flex;align-items:center;justify-content:center;background:#fff3e6;transition:all .18s;}
  .slot.over{border-color:var(--accent);background:#fff0e2;
    box-shadow:0 0 0 5px rgba(232,130,106,.22);transform:scale(1.06);}
  .slot .card{padding:10px 12px;font-size:20px;min-width:auto;box-shadow:none;border:none;}
  .op{font-size:24px;color:var(--accent);font-weight:800;}
  .lab-title{position:absolute;top:-22px;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:3px;color:var(--soft);white-space:nowrap;}

  #fx{position:fixed;inset:0;pointer-events:none;z-index:50;}
  .ghost{position:fixed;z-index:80;pointer-events:none;opacity:.85;
    transform:scale(1.06) rotate(-3deg);box-shadow:0 14px 30px rgba(0,0,0,.28);
    border-radius:16px;padding:14px 18px;font-size:22px;font-weight:700;letter-spacing:2px;
    color:#5a4632;}

  .toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);
    background:#4a3b2a;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;
    z-index:70;animation:pop .3s both;box-shadow:var(--shadow);}

  #modal{position:fixed;inset:0;background:rgba(60,40,20,.55);display:none;
    align-items:center;justify-content:center;z-index:60;padding:16px;}
  #modal.show{display:flex;}
  .modal-card{background:#fff7ee;border-radius:22px;padding:18px;max-width:440px;width:100%;
    text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .42s both;max-height:92vh;overflow:auto;}
  .modal-card h2{margin:6px 0 2px;color:var(--accent);font-size:26px;letter-spacing:2px;}
  .modal-card .sub{font-size:13px;color:var(--muted);margin-bottom:8px;}
  .share-img{width:100%;border-radius:14px;margin:8px 0;box-shadow:var(--shadow);display:block;}
  .modal-btns{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap;}
  .tip{font-size:12px;color:var(--soft);margin-top:8px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <p class="brand">字造 · <b>Word Alchemy</b></p>
    <span class="lvl" id="lvlLabel">第 1 关</span>
  </header>

  <div class="target-wrap">
    <div class="target-label">目 标 词</div>
    <div class="target" id="targetEl">…</div>
  </div>

  <div class="controls">
    <button class="btn ghost" id="hintBtn">提示</button>
    <button class="btn ghost" id="resetBtn">重置本关</button>
  </div>

  <div id="pool"></div>

  <div id="lab">
    <span class="lab-title">合 成 台</span>
    <div class="slot" id="slotA"></div>
    <span class="op">+</span>
    <div class="slot" id="slotB"></div>
    <span class="op">=</span>
    <span class="op" style="font-size:26px">✨</span>
  </div>
</div>

<canvas id="fx"></canvas>

<div id="modal">
  <div class="modal-card">
    <h2>造字成功！</h2>
    <div class="sub" id="modalSub">恭喜过关</div>
    <img class="share-img" id="shareImg" alt="分享图">
    <div class="tip">长按图片保存（移动端）或右键另存为（桌面端）</div>
    <div class="modal-btns">
      <button class="btn ghost" id="saveBtn">下载分享图</button>
      <button class="btn primary" id="nextBtn">下一关</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ================== 数据与状态 ================== */
// 内置词库：当 fetch rules.json 失败（如本地 file:// 打开）时兜底，保证可运行
const FALLBACK_RULES = [
  {"wordA":"日","wordB":"月","result":"明","explain":"日月交辉，化而为明"},
  {"wordA":"花","wordB":"好","result":"花好","explain":"花开正好，岁月静好"},
  {"wordA":"月","wordB":"圆","result":"月圆","explain":"月轮圆满，清辉万里"},
  {"wordA":"花好","wordB":"月圆","result":"花好月圆","explain":"花好月圆，美满团圆"},
  {"wordA":"风","wordB":"花","result":"风花","explain":"风中飞花，纷纷扬扬"},
  {"wordA":"雪","wordB":"月","result":"雪月","explain":"雪映月光，清寒皎洁"},
  {"wordA":"风花","wordB":"雪月","result":"风花雪月","explain":"风花雪月，四时佳景"},
  {"wordA":"山","wordB":"清","result":"山清","explain":"山色清幽，峰峦如洗"},
  {"wordA":"水","wordB":"秀","result":"水秀","explain":"水波秀美，明澈如镜"},
  {"wordA":"山清","wordB":"水秀","result":"山清水秀","explain":"山清水秀，风光旖旎"},
  {"wordA":"春","wordB":"暖","result":"春暖","explain":"春日送暖，万物复苏"},
  {"wordA":"花","wordB":"开","result":"花开","explain":"花朵绽放，芳香四溢"},
  {"wordA":"春暖","wordB":"花开","result":"春暖花开","explain":"春暖花开，万象更新"},
  {"wordA":"星","wordB":"河","result":"星河","explain":"星汉灿烂，横亘夜空"},
  {"wordA":"入","wordB":"梦","result":"入梦","explain":"悄然入梦，虚实难分"},
  {"wordA":"星河","wordB":"入梦","result":"星河入梦","explain":"星河入梦，浪漫至极"},
  {"wordA":"海","wordB":"上","result":"海上","explain":"海天之上，烟波浩渺"},
  {"wordA":"明","wordB":"月","result":"明月","explain":"明月高悬，清辉满地"},
  {"wordA":"海上","wordB":"明月","result":"海上明月","explain":"海上明月，共潮而生"},
  {"wordA":"光","wordB":"阴","result":"光阴","explain":"日月如梭，光阴荏苒"},
  {"wordA":"似","wordB":"箭","result":"似箭","explain":"疾如飞箭，一去不返"},
  {"wordA":"光阴","wordB":"似箭","result":"光阴似箭","explain":"光阴似箭，岁月如流"},
  {"wordA":"云","wordB":"淡","result":"云淡","explain":"云气淡薄，天高云远"},
  {"wordA":"风","wordB":"轻","result":"风轻","explain":"微风轻拂，不惊波澜"},
  {"wordA":"云淡","wordB":"风轻","result":"云淡风轻","explain":"云淡风轻，天朗气清"},
  {"wordA":"水","wordB":"落","result":"水落","explain":"水退而下，浅滩见底"},
  {"wordA":"石","wordB":"出","result":"石出","explain":"石头显露，棱角分明"},
  {"wordA":"水落","wordB":"石出","result":"水落石出","explain":"水落石出，真相大白"},
  {"wordA":"柳","wordB":"暗","result":"柳暗","explain":"柳色深暗，绿意浓重"},
  {"wordA":"花","wordB":"明","result":"花明","explain":"花色明艳，一树繁花"},
  {"wordA":"柳暗","wordB":"花明","result":"柳暗花明","explain":"柳暗花明，又一村也"},
  {"wordA":"日","wordB":"久","result":"日久","explain":"时日长久，滴水穿石"},
  {"wordA":"天","wordB":"长","result":"天长","explain":"天长地远，浩瀚无垠"},
  {"wordA":"日久","wordB":"天长","result":"日久天长","explain":"日久天长，情谊绵长"}
];

const CARD_COLORS=['#FDE4CF','#FCD5B5','#F9D79C','#FBE2C6','#F6C9A8','#EFC9B6','#E7B89C','#F4D6A5'];
const PARTICLE_COLORS=['#e8826a','#f4a25a','#e9c46a','#f9d79c','#e76f51','#c9ada7','#fcd5b5'];
const QUIPS=[
  "我这脑洞，连仓颉看了都得鼓掌。",
  "字字珠玑，句句得意，今日宜造词。",
  "今日合成一词，明日合成宇宙。",
  "词典编委正在紧急联系我。",
  "这不是拼字，这是文学的化学反应。",
  "语文老师沉默三秒，然后默默点赞。",
  "键盘侠退散，造字侠上线。",
  "字海无涯，而我已抵达彼岸。",
  "一加一大于二，这就是炼字的魔法。"
];

let rules = [];
let ruleMap = {};          // key: 排序后的 "a|b" -> rule
let level = 1;
let target = "";
let solution = [];         // 本关合成路径（提示/校验用）
let levelLeaves = [];      // 本关初始词（用于重置）
let poolData = [];         // [{id, word}]
let history = [];          // 已完成的合成步骤 [{a,b,result,explain}]
let synthesizing = false;
let synthTimer = null;
let idCounter = 1;

// 拖拽临时变量
let draggedCard = null;    // Drag API
let touchGhost = null;
let touchOffsetX = 0, touchOffsetY = 0;
let touchCard = null;

/* ================== DOM ================== */
const $ = id => document.getElementById(id);
const targetEl = $('targetEl'), lvlLabel = $('lvlLabel'), pool = $('pool');
const slotA = $('slotA'), slotB = $('slotB'), lab = $('lab');
const fx = $('fx'), ctx = fx.getContext('2d');
const modal = $('modal'), shareImg = $('shareImg'), shareCanvas = document.createElement('canvas');

/* ================== 工具 ================== */
function cid(){ return 'c' + (idCounter++); }
function colorFor(word){ let h=0; for(const c of word) h=(h*31+c.charCodeAt(0))>>>0; return CARD_COLORS[h%CARD_COLORS.length]; }
function key(a,b){ return [a,b].sort((x,y)=>x.localeCompare(y)).join('|'); }
function lookup(a,b){ return ruleMap[key(a,b)]; }
function isBase(word){ return !rules.some(r=>r.result===word); }
function showToast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ================== 规则加载与映射表 ================== */
function buildMap(){
  ruleMap = {};
  for(const r of rules){
    ruleMap[key(r.wordA, r.wordB)] = r;
  }
}

async function loadRules(){
  try{
    const res = await fetch('rules.json', {cache:'no-cache'});
    if(!res.ok) throw new Error('http '+res.status);
    const data = await res.json();
    if(!Array.isArray(data) || !data.length) throw new Error('empty');
    rules = data;
  }catch(e){
    rules = FALLBACK_RULES.slice();
    showToast('未加载到 rules.json，已用内置词库');
  }
  buildMap();
}

/* ================== 关卡生成：倒推初始词卡 ================== */
function decompose(target){
  // 从目标词自顶向下分解，直到全部为 base 词
  let current = [target];
  const decompSteps = [];
  let guard = 0;
  while(current.some(w=>!isBase(w)) && guard++ < 60){
    const idx = current.findIndex(w=>!isBase(w));
    const w = current[idx];
    const rule = rules.find(r=>r.result===w);
    if(!rule) break; // 理论上不会
    current = current.slice(0,idx).concat([rule.wordA, rule.wordB], current.slice(idx+1));
    decompSteps.push({a:rule.wordA, b:rule.wordB, result:rule.result, explain:rule.explain});
  }
  // 玩家合成顺序 = 分解顺序的逆序
  return { leaves: current, steps: decompSteps.slice().reverse() };
}

function generateLevel(){
  // 筛选创意型目标词：优先选择难度>=2 或 结果词长度>=3 的，避免简单拼接（如 加+班=加班）
  const allTargets = [...new Set(rules.map(r=>r.result))];
  const creativeTargets = allTargets.filter(t=>{
    const rule = rules.find(r=>r.result===t);
    return rule && (rule.difficulty >= 2 || t.length >= 3);
  });
  // 如果没有创意型目标词，兜底使用全部
  const candidateTargets = creativeTargets.length > 0 ? creativeTargets : allTargets;

  let info = null, chosen = null;
  for(let i=0;i<120;i++){
    const t = candidateTargets[Math.floor(Math.random()*candidateTargets.length)];
    const d = decompose(t);
    if(d.leaves.length>=4 && d.leaves.length<=6){ chosen=t; info=d; break; }
  }
  if(!chosen){ chosen=candidateTargets[0]; info=decompose(chosen); } // 兜底
  target = chosen;
  solution = info.steps;
  levelLeaves = info.leaves.slice();
  poolData = info.leaves.map(w=>({id:cid(), word:w}));

  // 添加 1-2 张干扰词卡（不参与本关合成的 base 词）
  const allBaseWords = [...new Set(rules.map(r=>r.wordA).concat(rules.map(r=>r.wordB)).filter(w=>isBase(w)))];
  const distractorCount = Math.random() < 0.5 ? 1 : 2;
  const distractors = [];
  const usedWords = new Set(levelLeaves);
  // 打乱 base 词列表后选取不在关卡中的
  for(const w of allBaseWords.sort(()=>Math.random()-0.5)){
    if(distractors.length >= distractorCount) break;
    if(!usedWords.has(w)){ distractors.push(w); usedWords.add(w); }
  }
  for(const w of distractors){
    poolData.push({id:cid(), word:w});
  }

  history = [];
  renderAll();
}

function renderAll(){
  targetEl.textContent = target;
  // 清空卡池与槽位
  pool.innerHTML = '';
  slotA.innerHTML = ''; slotB.innerHTML = '';
  clearTimeout(synthTimer);
  // 创建卡牌（轻微随机旋转，营造“散落”感）
  poolData.forEach(data=>{
    const card = createCard(data);
    const rot = (Math.random()*10 - 5).toFixed(1);
    card.style.transform = `rotate(${rot}deg)`;
    pool.appendChild(card);
  });
}

function createCard(data){
  const el = document.createElement('div');
  el.className = 'card';
  el.textContent = data.word;
  el.dataset.word = data.word;
  el.dataset.id = data.id;
  el.style.background = colorFor(data.word);
  el.draggable = true;
  attachDragHandlers(el);
  return el;
}

/* ================== 拖拽：Drag API（桌面）+ Touch（移动） ================== */
function attachDragHandlers(card){
  // ---- HTML5 Drag API（鼠标）----
  card.addEventListener('dragstart', e=>{
    if(synthesizing) return;
    if(!card.parentElement || !document.body.contains(card)) return;
    draggedCard = card;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', card.dataset.id);
    // 自定义半透明跟随图
    const ghost = card.cloneNode(true);
    ghost.style.position='absolute'; ghost.style.top='-9999px'; ghost.style.opacity='.85';
    ghost.style.transform='scale(1.06) rotate(-3deg)';
    document.body.appendChild(ghost);
    try{ e.dataTransfer.setDragImage(ghost, ghost.offsetWidth/2, ghost.offsetHeight/2); }catch(_){}
    setTimeout(()=>ghost.remove(),0);
    card.classList.add('dragging');
  });
  card.addEventListener('dragend', ()=>{
    card.classList.remove('dragging');
    draggedCard = null;
  });

  // ---- Touch Events（移动端）----
  card.addEventListener('touchstart', e=>{
    if(synthesizing) return;
    const t = e.touches[0];
    touchCard = card;
    const rect = card.getBoundingClientRect();
    touchOffsetX = t.clientX - rect.left;
    touchOffsetY = t.clientY - rect.top;
    touchGhost = card.cloneNode(true);
    touchGhost.classList.add('ghost');
    touchGhost.style.background = colorFor(card.dataset.word);
    touchGhost.style.left = (t.clientX - touchOffsetX) + 'px';
    touchGhost.style.top  = (t.clientY - touchOffsetY) + 'px';
    document.body.appendChild(touchGhost);
    card.classList.add('dragging');
    e.preventDefault(); // 阻止后续鼠标兼容事件，避免与 Drag API 冲突
  }, {passive:false});

  card.addEventListener('touchmove', e=>{
    if(!touchGhost) return;
    const t = e.touches[0];
    touchGhost.style.left = (t.clientX - touchOffsetX) + 'px';
    touchGhost.style.top  = (t.clientY - touchOffsetY) + 'px';
    // 高亮所处槽位
    clearSlotOver();
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if(el){ const s = el.closest('.slot'); if(s && !s.querySelector('.card')) s.classList.add('over'); }
    e.preventDefault();
  }, {passive:false});

  card.addEventListener('touchend', e=>{
    // 即使 touchGhost 被 touchcancel 清理了，也要完成拖拽收尾
    const t = e.changedTouches[0];
    let el = null;
    if(touchGhost){
      el = document.elementFromPoint(t.clientX, t.clientY);
      touchGhost.remove(); touchGhost = null;
    }
    card.classList.remove('dragging');
    clearSlotOver();
    let dropSlot = null;
    if(el){
      const s = el.closest('.slot');
      if(s && !s.querySelector('.card')) dropSlot = s;
    }
    if(dropSlot){
      moveCardToSlot(card, dropSlot);
    } else if(card.parentElement && card.parentElement.classList.contains('slot')){
      // 如果卡在槽位中且没有放到有效目标，退回卡池
      returnCardToPool(card);
    }
    touchCard = null;
  }, {passive:false});

  card.addEventListener('touchcancel', ()=>{
    if(touchGhost){ touchGhost.remove(); touchGhost=null; }
    if(touchCard){ touchCard.classList.remove('dragging'); touchCard=null; }
    clearSlotOver();
  });
}

function clearSlotOver(){ slotA.classList.remove('over'); slotB.classList.remove('over'); }

// 槽位 / 卡池的放置目标（Drag API）
[slotA, slotB].forEach(slot=>{
  slot.addEventListener('dragover', e=>{ e.preventDefault(); if(!slot.querySelector('.card')) slot.classList.add('over'); });
  slot.addEventListener('dragleave', ()=> slot.classList.remove('over'));
  slot.addEventListener('drop', e=>{
    e.preventDefault(); slot.classList.remove('over');
    if(draggedCard && !slot.querySelector('.card')) moveCardToSlot(draggedCard, slot);
  });
});
pool.addEventListener('dragover', e=> e.preventDefault());
pool.addEventListener('drop', e=>{
  e.preventDefault();
  if(draggedCard && draggedCard.parentElement && draggedCard.parentElement.classList.contains('slot')){
    returnCardToPool(draggedCard);
  }
});

function moveCardToSlot(card, slot){
  if(synthesizing) return;
  // 防止同一张卡重复放入
  if(card.parentElement === slot) return;
  slot.appendChild(card);
  card.style.transform = '';
  clearTimeout(synthTimer);
  if(slotA.firstElementChild && slotB.firstElementChild){
    synthTimer = setTimeout(trySynth, 620);
  }
}
function returnCardToPool(card){
  if(!card || !card.parentElement) return;
  pool.appendChild(card);
  const rot = (Math.random()*10 - 5).toFixed(1);
  card.style.transform = `rotate(${rot}deg)`;
  clearTimeout(synthTimer);
}

/* ================== 合成逻辑 ================== */
function trySynth(){
  if(synthesizing) return;
  const ca = slotA.firstElementChild, cb = slotB.firstElementChild;
  if(!ca || !cb) return;
  const rule = lookup(ca.dataset.word, cb.dataset.word);
  if(!rule){ failShake(); return; }
  clearTimeout(synthTimer);
  successAnim(ca, cb, rule);
}

function failShake(){
  if(synthesizing) return;
  synthesizing = true;
  clearTimeout(synthTimer);
  slotA.classList.add('shake'); slotB.classList.add('shake');
  showToast('这两个词擦不出火花～');
  // 安全兜底：1500ms 后强制解锁
  const safety = setTimeout(()=>{ synthesizing = false; }, 1500);
  setTimeout(()=>{
    clearTimeout(safety);
    slotA.classList.remove('shake'); slotB.classList.remove('shake');
    const a = slotA.querySelector('.card'), b = slotB.querySelector('.card');
    if(a) returnCardToPool(a);
    if(b) returnCardToPool(b);
    synthesizing = false;
  }, 460);
}

function successAnim(ca, cb, rule){
  synthesizing = true;
  clearTimeout(synthTimer);
  const r = lab.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  ca.style.setProperty('--mx', '32px');
  cb.style.setProperty('--mx', '-32px');
  ca.classList.add('merging');
  cb.classList.add('merging');
  setTimeout(()=>burst(cx, cy, 30), 200);
  // 安全兜底：2000ms 后强制解锁
  const safety = setTimeout(()=>{ synthesizing = false; }, 2000);
  setTimeout(()=>{
    clearTimeout(safety);
    // 从 poolData 中移除被消耗的两张卡
    const idA = ca.dataset.id, idB = cb.dataset.id;
    poolData = poolData.filter(d=>d.id!==idA && d.id!==idB);
    ca.remove(); cb.remove();
    const data = {id:cid(), word:rule.result};
    poolData.push(data);
    const card = createCard(data);
    card.classList.add('pop');
    pool.appendChild(card);
    history.push({a:rule.wordA, b:rule.wordB, result:rule.result, explain:rule.explain});
    synthesizing = false;
    if(rule.result === target){
      setTimeout(win, 460);
    }
  }, 410);
}

/* ================== 粒子动画 ================== */
let particles = [], rafId = null;
function resizeFx(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  fx.width = innerWidth*dpr; fx.height = innerHeight*dpr;
  fx.style.width = innerWidth+'px'; fx.style.height = innerHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function burst(x, y, n){
  n = n||26;
  for(let i=0;i<n;i++){
    const ang = Math.random()*Math.PI*2, sp = 2 + Math.random()*5.5;
    particles.push({x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 2,
      life:1, r:3+Math.random()*4, color:PARTICLE_COLORS[Math.floor(Math.random()*PARTICLE_COLORS.length)]});
  }
  if(!rafId) tick();
}
function tick(){
  ctx.clearRect(0,0,fx.width,fx.height);
  particles = particles.filter(p=>p.life>0);
  for(const p of particles){
    p.x += p.vx; p.y += p.vy; p.vy += 0.16; p.life -= 0.018;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if(particles.length){ rafId = requestAnimationFrame(tick); } else { rafId = null; }
}

/* ================== 提示 ================== */
function hint(){
  // 在当前可用词卡（卡池+槽位）中找一对可合成
  const cards = [...pool.querySelectorAll('.card'), ...slotA.querySelectorAll('.card'), ...slotB.querySelectorAll('.card')];
  for(let i=0;i<cards.length;i++){
    for(let j=i+1;j<cards.length;j++){
      if(lookup(cards[i].dataset.word, cards[j].dataset.word)){
        flash(cards[i]); flash(cards[j]);
        return;
      }
    }
  }
  showToast('没有可合成的一对，试试重置本关');
}
function flash(el){ el.classList.remove('hint'); void el.offsetWidth; el.classList.add('hint'); }

/* ================== 胜利与分享图 ================== */
function win(){
  const cx = innerWidth/2, cy = innerHeight*0.4;
  for(let i=0;i<7;i++) setTimeout(()=>burst(cx+(Math.random()-.5)*260, cy+(Math.random()-.5)*140, 34), i*110);
  $('modalSub').textContent = `「${target}」合成完成！`;
  buildShare();
  modal.classList.add('show');
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

// 伪二维码占位图
function drawQR(c, x, y, s){
  c.save();
  roundRect(c, x, y, s, s, 10);
  c.fillStyle = '#fff'; c.fill();
  const n = 21, cs = s/n;
  c.fillStyle = '#2a2218';
  function finder(ox, oy){
    for(let i=0;i<7;i++) for(let j=0;j<7;j++){
      const edge = i===0||i===6||j===0||j===6;
      const mid = i>=2&&i<=4&&j>=2&&j<=4;
      if(edge||mid) c.fillRect(x+ox*cs+i*cs, y+oy*cs+j*cs, cs+0.6, cs+0.6);
    }
  }
  // 随机模块（避开定位符区域）
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){
    const inFinder = (i<8&&j<8)||(i<8&&j>12)||(i>12&&j<8);
    if(inFinder) continue;
    if(Math.random()<0.48) c.fillRect(x+i*cs, y+j*cs, cs+0.6, cs+0.6);
  }
  finder(0,0); finder(14,0); finder(0,14);
  c.restore();
}

function buildShare(){
  const W=900, H=1280;
  shareCanvas.width=W; shareCanvas.height=H;
  const c = shareCanvas.getContext('2d');

  // 背景
  const g = c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#fff3e2'); g.addColorStop(1,'#f6e4cf');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  c.fillStyle='rgba(232,130,106,.08)'; c.beginPath(); c.arc(120,140,170,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(810,1140,210,0,Math.PI*2); c.fill();

  // 标题
  c.textAlign='center';
  c.fillStyle='#4a3b2a';
  c.font='800 62px "PingFang SC",sans-serif';
  c.fillText('字造 · Word Alchemy', W/2, 120);
  c.fillStyle='#8a7560'; c.font='400 26px sans-serif';
  c.fillText(`第 ${level} 关 · 通关留念`, W/2, 168);

  // 目标药丸
  c.font='800 44px sans-serif';
  const tw = c.measureText(target).width + 90;
  roundRect(c, (W-tw)/2, 200, tw, 86, 20);
  const tg = c.createLinearGradient(0,0,tw,0);
  tg.addColorStop(0,'#f4a25a'); tg.addColorStop(1,'#e8826a');
  c.fillStyle=tg; c.fill();
  c.fillStyle='#fff'; c.textBaseline='middle';
  c.fillText(target, W/2, 244);
  c.textBaseline='alphabetic';

  // 合成之路
  c.fillStyle='#4a3b2a'; c.font='700 30px sans-serif';
  c.fillText('— 合成之路 —', W/2, 352);

  let y = 404;
  history.forEach((s, i)=>{
    c.fillStyle='#a98b6e'; c.font='500 22px sans-serif';
    c.fillText(`步骤 ${i+1}`, W/2, y); y += 34;
    c.fillStyle='#4a3b2a'; c.font='700 38px sans-serif';
    c.fillText(`${s.a}  +  ${s.b}  →  ${s.result}`, W/2, y); y += 44;
    c.fillStyle='#a98b6e'; c.font='400 22px sans-serif';
    c.fillText(s.explain, W/2, y); y += 56;
  });

  // 俏皮话
  const quip = QUIPS[Math.floor(Math.random()*QUIPS.length)];
  y = Math.max(y, 880);
  c.font='600 26px sans-serif';
  const qw = Math.min(W-120, c.measureText(quip).width + 70);
  roundRect(c, (W-qw)/2, y, qw, 74, 18);
  c.fillStyle='#fff7ee'; c.fill();
  c.fillStyle='#e8826a'; c.textBaseline='middle';
  c.fillText(quip, W/2, y+37);
  c.textBaseline='alphabetic';

  // 二维码占位
  const qs=168, qx=W/2-qs/2, qy=H-qs-150;
  drawQR(c, qx, qy, qs);
  c.fillStyle='#8a7560'; c.font='400 24px sans-serif';
  c.fillText('扫码来挑战', W/2, qy+qs+38);

  // 页脚
  c.fillStyle='#a98b6e'; c.textAlign='left'; c.font='500 22px sans-serif';
  c.fillText('字造 · Word Alchemy', 70, H-58);
  c.textAlign='right';
  c.fillText('一路合成，字字生辉', W-70, H-58);

  shareImg.src = shareCanvas.toDataURL('image/png');
}

/* ================== 事件绑定 ================== */
$('hintBtn').addEventListener('click', hint);
$('resetBtn').addEventListener('click', ()=>{
  synthesizing = false;
  clearTimeout(synthTimer);
  poolData = levelLeaves.map(w=>({id:cid(), word:w}));
  history = [];
  renderAll();
  showToast('已重置本关');
});
$('nextBtn').addEventListener('click', ()=>{
  synthesizing = false;
  clearTimeout(synthTimer);
  level = parseInt(localStorage.getItem('wa_level')||'1', 10) + 1;
  localStorage.setItem('wa_level', String(level));
  modal.classList.remove('show');
  generateLevel();
  updateLevelLabel();
});
$('saveBtn').addEventListener('click', ()=>{
  const a = document.createElement('a');
  a.href = shareImg.src;
  a.download = `字造_第${level}关_${target}.png`;
  document.body.appendChild(a); a.click(); a.remove();
});
window.addEventListener('resize', resizeFx);

function updateLevelLabel(){ lvlLabel.textContent = `第 ${level} 关`; }

// shake 动画
const styleTag = document.createElement('style');
styleTag.textContent = `@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}.slot.shake{animation:shake .42s}`;
document.head.appendChild(styleTag);

/* ================== 启动 ================== */
(async function init(){
  resizeFx();
  level = parseInt(localStorage.getItem('wa_level')||'1', 10);
  if(!level || level<1) level=1;
  updateLevelLabel();
  await loadRules();
  generateLevel();
})();
</script>
