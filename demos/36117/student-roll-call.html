<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生点名系统</title>
<style>
  :root {
    --bg: #0f172a;
    --bg2: #1e293b;
    --bg3: #334155;
    --ink: #f1f5f9;
    --muted: #94a3b8;
    --rule: #475569;
    --accent: #3b82f6;
    --accent2: #f59e0b;
    --danger: #ef4444;
    --success: #22c55e;
    --radius: 12px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --subject-glow: rgba(59,130,246,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.6;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ===== Top Bar ===== */
  .topbar {
    background: var(--bg2);
    border-bottom: 1px solid var(--rule);
    padding: 0.6rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-shrink: 0;
    z-index: 10;
  }
  .topbar-left { display: flex; align-items: center; gap: 0.8rem; }
  .topbar-left h1 { font-size: 1.1rem; font-weight: 700; white-space: nowrap; }
  .topbar-left .date { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  .topbar-right { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
    padding: 0.45rem 0.8rem; border: none; border-radius: 8px;
    font-family: inherit; font-size: 0.78rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-warning { background: var(--accent2); color: #fff; }
  .btn-ghost { background: var(--bg3); color: var(--ink); border: 1px solid var(--rule); }
  .btn-ghost:hover { background: var(--rule); }
  .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.72rem; }

  /* ===== Subject Tabs ===== */
  .tab-bar {
    background: var(--bg2);
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    padding: 0 1rem;
    gap: 0.25rem;
    flex-shrink: 0;
    overflow-x: auto;
    z-index: 9;
  }
  .tab-bar::-webkit-scrollbar { height: 3px; }
  .tab-bar::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 2px; }
  .tab-item {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.55rem 0.9rem;
    border-radius: 8px 8px 0 0;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    border: 1.5px solid transparent;
    border-bottom: none;
    position: relative;
    color: var(--muted);
    background: transparent;
    user-select: none;
  }
  .tab-item:hover { color: var(--ink); background: var(--bg3); }
  .tab-item.active {
    color: #fff;
    border-color: var(--rule);
    border-bottom-color: transparent;
  }
  .tab-item .tab-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .tab-item .tab-name {
    max-width: 80px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab-item .tab-edit-input {
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 0.1rem 0.3rem;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink);
    width: 70px;
    outline: none;
  }
  .tab-item .tab-actions {
    display: none;
    gap: 0.1rem;
    margin-left: 0.2rem;
  }
  .tab-item:hover .tab-actions { display: flex; }
  .tab-item .tab-actions button {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 0.7rem; padding: 0.1rem 0.2rem; border-radius: 3px;
    line-height: 1;
  }
  .tab-item .tab-actions button:hover { color: var(--danger); background: rgba(239,68,68,0.15); }
  .tab-add {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px;
    border-radius: 6px;
    border: 1.5px dashed var(--rule);
    background: transparent;
    color: var(--muted);
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    margin-left: 0.3rem;
  }
  .tab-add:hover { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,0.1); }

  /* ===== Main Roll Call Area ===== */
  .rollcall-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .rollcall-main::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--subject-glow) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .student-count-badge {
    position: absolute; top: 1.2rem; left: 50%; transform: translateX(-50%);
    background: var(--bg3); color: var(--muted);
    padding: 0.25rem 0.8rem; border-radius: 20px;
    font-size: 0.78rem; font-weight: 600;
    border: 1px solid var(--rule); z-index: 5;
  }

  @keyframes selectedPulse {
    0% { transform: scale(1); }
    25% { transform: scale(1.12); }
    50% { transform: scale(0.96); }
    75% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  /* ===== All Names Display ===== */
  .all-names-display {
    flex: 1;
    display: flex; flex-wrap: wrap;
    align-content: center; justify-content: center;
    gap: 1.2rem; padding: 4rem 3rem 1rem;
    overflow: auto; z-index: 1;
  }
  .all-names-display::-webkit-scrollbar { width: 6px; }
  .all-names-display::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
  .name-tag {
    padding: 0.8rem 1.6rem; border-radius: 14px;
    font-size: 1.4rem; font-weight: 700;
    background: var(--bg2); color: var(--muted);
    border: 1.5px solid var(--rule);
    transition: all 0.1s; cursor: default; user-select: none;
  }
  .name-tag.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
    box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 50%, transparent), 0 0 48px color-mix(in srgb, var(--accent) 25%, transparent);
    transform: scale(1.2); z-index: 2;
  }
  .name-tag.selected {
    background: var(--danger); color: #fff; border-color: var(--danger);
    box-shadow: 0 0 36px rgba(239,68,68,0.6), 0 0 72px rgba(239,68,68,0.35);
    transform: scale(1.3); z-index: 2;
    animation: selectedPulse 0.6s ease;
  }
  .name-tag.picked-manual {
    background: var(--accent2); color: #fff; border-color: var(--accent2);
    box-shadow: 0 0 24px rgba(245,158,11,0.5);
    transform: scale(1.2); z-index: 2;
  }

  /* Roll Controls */
  .roll-controls {
    display: flex; gap: 1.2rem; justify-content: center;
    padding: 1rem 0 1.5rem; position: relative; z-index: 1; flex-shrink: 0;
  }
  .btn-roll-start {
    background: var(--success); color: #fff;
    padding: 1rem 3rem; font-size: 1.2rem; border-radius: 50px;
    font-weight: 700; border: none; cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(34,197,94,0.3); font-family: inherit;
  }
  .btn-roll-start:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(34,197,94,0.4); }
  .btn-roll-stop {
    background: var(--danger); color: #fff;
    padding: 1rem 3rem; font-size: 1.2rem; border-radius: 50px;
    font-weight: 700; border: none; cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(239,68,68,0.3); font-family: inherit;
    animation: stopPulse 1s ease infinite;
  }
  @keyframes stopPulse {
    0%, 100% { box-shadow: 0 4px 20px rgba(239,68,68,0.3); }
    50% { box-shadow: 0 4px 30px rgba(239,68,68,0.6); }
  }
  .btn-roll-manual {
    background: var(--bg3); color: var(--ink);
    padding: 1rem 2rem; font-size: 1rem; border-radius: 50px;
    font-weight: 600; border: 1.5px solid var(--rule);
    cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .btn-roll-manual:hover { border-color: var(--accent); background: var(--accent); color: #fff; }
  .btn-roll-manual.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }

  .keyboard-hint {
    position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%);
    font-size: 0.75rem; color: var(--muted); opacity: 0.5;
  }
  .keyboard-hint kbd {
    background: var(--bg3); border: 1px solid var(--rule);
    border-radius: 4px; padding: 0.1rem 0.4rem; font-family: inherit; font-size: 0.72rem;
  }

  /* ===== Overview Panel ===== */
  .overview-panel {
    flex: 1; overflow-y: auto; padding: 2rem; z-index: 1;
  }
  .overview-panel::-webkit-scrollbar { width: 6px; }
  .overview-panel::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
  }
  .overview-subject-card {
    background: var(--bg2);
    border-radius: var(--radius);
    padding: 1.2rem;
    border: 1px solid var(--rule);
    border-left: 4px solid var(--accent);
  }
  .overview-subject-card h3 {
    font-size: 1rem; font-weight: 700; margin-bottom: 0.6rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .overview-subject-card h3 .dot {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .overview-stats-row {
    display: flex; gap: 1rem; font-size: 0.82rem; color: var(--muted);
  }
  .overview-stats-row span strong { color: var(--ink); }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    z-index: 100; display: none; align-items: center; justify-content: center; padding: 1rem;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--bg2); border-radius: 16px; box-shadow: var(--shadow);
    width: 100%; max-width: 700px; max-height: 85vh;
    display: flex; flex-direction: column;
    animation: modalIn 0.25s ease; border: 1px solid var(--rule);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--rule); flex-shrink: 0;
  }
  .modal-header h2 { font-size: 1.1rem; font-weight: 700; }
  .modal-close {
    width: 32px; height: 32px; border-radius: 8px; border: none;
    background: var(--bg3); color: var(--muted); font-size: 1.2rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: var(--danger); color: #fff; }
  .modal-body { padding: 1.5rem; overflow-y: auto; flex: 1; }
  .modal-footer {
    padding: 1rem 1.5rem; border-top: 1px solid var(--rule);
    display: flex; justify-content: flex-end; gap: 0.5rem; flex-shrink: 0;
  }

  /* ===== Student Management Modal ===== */
  .batch-input-area textarea {
    width: 100%; min-height: 80px;
    border: 1.5px solid var(--rule); border-radius: 10px; padding: 0.8rem;
    font-family: inherit; font-size: 0.85rem; resize: vertical;
    background: var(--bg); color: var(--ink);
  }
  .batch-input-area textarea:focus { outline: none; border-color: var(--accent); }
  .batch-input-area textarea::placeholder { color: var(--muted); }
  .batch-input-area .hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.4rem; }
  .batch-input-actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
  .section-title {
    font-size: 0.85rem; font-weight: 700; color: var(--ink);
    margin: 1.2rem 0 0.6rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--rule);
  }

  .student-table {
    width: 100%; border-collapse: collapse; font-size: 0.82rem;
    border: 1px solid var(--rule); border-radius: 10px; overflow: hidden;
  }
  .student-table thead { position: sticky; top: 0; z-index: 1; }
  .student-table th {
    background: var(--bg3); color: var(--ink);
    padding: 0.6rem 0.5rem; text-align: left; font-weight: 600; font-size: 0.78rem;
  }
  .student-table td { padding: 0.4rem 0.5rem; border-bottom: 1px solid rgba(71,85,105,0.3); }
  .student-table tbody tr:hover { background: var(--bg); }
  .student-table tbody tr:last-child td { border-bottom: none; }
  .student-table .cell-input {
    width: 100%; background: var(--bg); border: 1.5px solid var(--rule);
    border-radius: 6px; padding: 0.35rem 0.5rem;
    font-family: inherit; font-size: 0.8rem; color: var(--ink);
  }
  .student-table .cell-input:focus { outline: none; border-color: var(--accent); }
  .student-table .cell-input::placeholder { color: var(--muted); opacity: 0.6; }
  .student-table .actions { display: flex; gap: 0.3rem; }
  .student-table .actions .btn { padding: 0.25rem 0.5rem; font-size: 0.72rem; }
  .gender-badge {
    display: inline-block; padding: 0.15rem 0.5rem;
    border-radius: 10px; font-size: 0.72rem; font-weight: 600;
  }
  .gender-badge.m { background: rgba(59,130,246,0.2); color: #60a5fa; }
  .gender-badge.f { background: rgba(236,72,153,0.2); color: #f472b6; }
  .list-footer { margin-top: 0.6rem; font-size: 0.8rem; color: var(--muted); }

  /* ===== Stats ===== */
  .stats-summary {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 0.6rem; margin-bottom: 1rem;
  }
  .summary-card {
    background: var(--bg); border-radius: 10px; padding: 0.7rem;
    text-align: center; border: 1px solid var(--rule);
  }
  .summary-card .num { font-size: 1.4rem; font-weight: 700; }
  .summary-card .label { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }
  .summary-card.total .num { color: var(--accent); }
  .summary-card.random .num { color: var(--success); }
  .summary-card.manual .num { color: var(--accent2); }
  .summary-card.sessions .num { color: var(--ink); }

  .stats-filter { display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
  .stats-filter label { font-size: 0.82rem; color: var(--muted); font-weight: 600; }
  .filter-tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; }
  .date-range-picker {
    display: flex; align-items: center; gap: 0.5rem;
    margin-bottom: 1rem; flex-wrap: wrap;
  }
  .date-range-picker input[type="date"] {
    background: var(--bg); color: var(--ink);
    border: 1.5px solid var(--rule); border-radius: 8px;
    font-family: inherit; font-size: 0.8rem;
  }
  .date-range-picker input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.7); cursor: pointer;
  }
  .filter-tab {
    padding: 0.3rem 0.7rem; border: 1.5px solid var(--rule); border-radius: 20px;
    background: var(--bg); font-size: 0.78rem; font-weight: 600;
    cursor: pointer; transition: all 0.15s; color: var(--muted); font-family: inherit;
  }
  .filter-tab:hover { border-color: var(--accent); color: var(--accent); }
  .filter-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .stats-table-wrap {
    overflow: auto; max-height: 300px; border-radius: 10px; border: 1px solid var(--rule);
  }
  .stats-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  .stats-table thead { position: sticky; top: 0; z-index: 1; }
  .stats-table th {
    background: var(--bg3); color: var(--ink);
    padding: 0.6rem 0.7rem; text-align: left; font-weight: 600; font-size: 0.78rem;
  }
  .stats-table td { padding: 0.5rem 0.7rem; border-bottom: 1px solid rgba(71,85,105,0.3); }
  .stats-table tbody tr:hover { background: var(--bg); }
  .stats-table .total-col { font-weight: 700; color: var(--accent); }
  .stats-table .random-col { color: var(--success); }
  .stats-table .manual-col { color: var(--accent2); }
  .stats-table .bar-cell { width: 100px; }
  .stats-table .bar-bg { width: 100%; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
  .stats-table .bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
  .stats-table .empty-row td { text-align: center; color: var(--muted); padding: 2rem; }

  /* ===== Toast ===== */
  .toast-container {
    position: fixed; top: 1rem; right: 1rem; z-index: 9999;
    display: flex; flex-direction: column; gap: 0.5rem;
  }
  .toast {
    padding: 0.7rem 1.2rem; border-radius: 10px; font-size: 0.85rem;
    font-weight: 600; color: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    animation: toastIn 0.3s ease; max-width: 320px;
  }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  .toast.info { background: var(--accent); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

  .hidden-input { display: none; }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    .topbar { padding: 0.5rem 0.8rem; }
    .topbar-left h1 { font-size: 0.95rem; }
    .topbar-right { gap: 0.3rem; }
    .btn { padding: 0.4rem 0.6rem; font-size: 0.72rem; }
    .name-tag { font-size: 1.1rem; padding: 0.5rem 1rem; }
    .all-names-display { gap: 0.8rem; padding: 3rem 1.5rem 0.5rem; }
    .btn-roll-start, .btn-roll-stop { padding: 0.8rem 2rem; font-size: 1rem; }
    .btn-roll-manual { padding: 0.8rem 1.5rem; font-size: 0.9rem; }
    .modal { max-width: 100%; max-height: 90vh; }
    .stats-summary { grid-template-columns: repeat(2, 1fr); }
    .keyboard-hint { display: none; }
    .overview-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    .roll-controls { flex-direction: column; align-items: center; }
    .name-tag { font-size: 1rem; padding: 0.4rem 0.8rem; }
    .all-names-display { gap: 0.6rem; padding: 2.5rem 1rem 0.5rem; }
  }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>
<input type="file" id="fileInput" class="hidden-input" accept=".json">

<header class="topbar">
  <div class="topbar-left">
    <h1 id="pageTitle">学生点名系统</h1>
    <span class="date" id="headerDate"></span>
  </div>
  <div class="topbar-right">
    <button class="btn btn-ghost" onclick="openModal('studentModal')">班级管理</button>
    <button class="btn btn-ghost" onclick="openModal('statsModal')">数据统计</button>
    <button class="btn btn-ghost" onclick="saveToFile()">保存数据</button>
    <button class="btn btn-ghost" onclick="loadFromFile()">加载数据</button>
  </div>
</header>

<!-- Subject Tabs -->
<div class="tab-bar" id="tabBar"></div>

<!-- Main Area -->
<main class="rollcall-main" id="mainArea">
  <!-- Overview Panel (shown when 总览 tab is active) -->
  <div class="overview-panel" id="overviewPanel" style="display:none;"></div>

  <!-- Roll Call Panel (shown when a subject tab is active) -->
  <div id="rollCallPanel">
    <div class="student-count-badge" id="countBadge">共 0 名学生</div>
    <div class="all-names-display" id="allNamesDisplay"></div>
    <div class="roll-controls">
      <button class="btn-roll-start" id="btnStart" onclick="startRoll()">开始滚动</button>
      <button class="btn-roll-stop" id="btnStop" onclick="stopRoll()" style="display:none;">停 止</button>
      <button class="btn-roll-manual" id="btnManual" onclick="toggleManualMode()">手动点名</button>
    </div>
    <div class="keyboard-hint" id="kbHint">按 <kbd>空格</kbd> 开始/停止滚动</div>
  </div>
</main>

<!-- ===== Class Management Modal ===== -->
<div class="modal-overlay" id="studentModal">
  <div class="modal">
    <div class="modal-header">
      <h2>班级管理</h2>
      <button class="modal-close" onclick="closeModal('studentModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="section-title">班级信息</div>
      <div style="display:flex;flex-direction:column;gap:1rem;margin-bottom:1.2rem;">
        <div>
          <label style="display:block;font-size:0.82rem;color:var(--muted);margin-bottom:0.3rem;font-weight:600;">年级班级</label>
          <input type="text" id="classNameInput" class="cell-input" style="width:100%;padding:0.6rem 0.8rem;font-size:0.9rem;" placeholder="例如：三年级二班">
        </div>
      </div>
      <div class="section-title">学生管理</div>
      <div class="batch-input-area">

    html += '<div class="tab-item' + ovActive + '" onclick="switchTab(\'overview\')" style="background:' + (activeTabId === 'overview' ? 'var(--bg3)' : '') + '">' +
      '<span class="tab-dot" style="background:var(--muted);"></span>' +
      '<span class="tab-name">总览</span></div>';

    // Subject tabs
    subjects.forEach(function(s) {
      var isActive = activeTabId === s.id;
      var color = SUBJECT_COLORS[s.colorIndex % SUBJECT_COLORS.length];
      var activeStyle = isActive ? 'background:' + color.accent + ';color:#fff;border-color:' + color.accent + ';' : '';
      html += '<div class="tab-item' + (isActive ? ' active' : '') + '" data-id="' + s.id + '" onclick="switchTab(\'' + s.id + '\')" style="' + activeStyle + '">' +
        '<span class="tab-dot" style="background:' + color.accent + ';"></span>' +
        '<span class="tab-name">' + escapeHtml(s.name) + '</span>' +
        '<span class="tab-actions">' +
          '<button onclick="event.stopPropagation();startRenameTab(\'' + s.id + '\')" title="重命名">✎</button>' +
          (subjects.length > 1 ? '<button onclick="event.stopPropagation();removeTab(\'' + s.id + '\')" title="删除">✕</button>' : '') +

  window.switchTab = function(id) {
    if (isRolling) stopRoll();
    if (isManualMode) toggleManualMode();
    activeTabId = id;
    applySubjectTheme();
    renderTabs();
    renderMainContent();
  };

  window.addTab = function() {
    var colorIndex = subjects.length % SUBJECT_COLORS.length;
    var id = 's' + Date.now();
    subjects.push({ id: id, name: '新科目', colorIndex: colorIndex, records: [], sessionCount: 0 });
    switchTab(id);
    startRenameTab(id);
    showToast('已添加新科目', 'success');
  };

  window.removeTab = function(id) {
    if (subjects.length <= 1) { showToast('至少保留一个科目', 'error'); return; }
    var sub = subjects.find(function(s) { return s.id === id; });
    if (!confirm('确定删除科目"' + sub.name + '"及其所有点名记录吗？')) return;
    subjects = subjects.filter(function(s) { return s.id !== id; });
    if (activeTabId === id) {
      activeTabId = subjects[0].id;
    }
    renderTabs();
    renderMainContent();
    showToast('已删除科目"' + sub.name + '"', 'info');
  };

  window.startRenameTab = function(id) {
    var sub = subjects.find(function(s) { return s.id === id; });
    if (!sub) return;
    var t = document.querySelector('.tab-item[data-id="' + id + '"]');
    if (!t) return;
    var nameSpan = t.querySelector('.tab-name');
    if (!nameSpan) return;
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'tab-edit-input';
    input.value = sub.name;
    input.onclick = function(e) { e.stopPropagation(); };
    nameSpan.style.display = 'none';
    t.insertBefore(input, nameSpan);
    input.focus();
    input.select();

    function finishRename() {
      var newName = input.value.trim();
      if (newName && newName !== sub.name) {
        sub.name = newName;
        showToast('已重命名为"' + newName + '"', 'success');
      }
      input.remove();
      nameSpan.style.display = '';
      renderTabs();
    }
    input.onblur = finishRename;
    input.onkeydown = function(e) {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      if (e.key === 'Escape') { input.value = sub.name; input.blur(); }
    };
  };

  // ===== Subject Theme =====
  function applySubjectTheme() {

      document.documentElement.style.setProperty('--accent', '#3b82f6');

    }
    var sub = getActiveSubject();
    if (!sub) return;
    var color = SUBJECT_COLORS[sub.colorIndex % SUBJECT_COLORS.length];
    document.documentElement.style.setProperty('--accent', color.accent);
    document.documentElement.style.setProperty('--subject-glow', color.glow);
  }

    if (new Date(s) > new Date(e)) { showToast('开始日期不能晚于结束日期', 'error'); return; }
    overviewCustomRange.start = s;
    overviewCustomRange.end = e;
    renderOverview();
    showToast('已应用自定义时间段', 'success');
  };

  function getOverviewDateRange() {
    var now = new Date();
    var start, end;
    end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
    switch(overviewPeriod) {
      case 'day': start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0); break;
      case 'week': var dow = now.getDay() || 7; start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow + 1, 0, 0, 0, 0); break;
      case 'month': start = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0); break;
      case 'year': start = new Date(now.getFullYear(), 0, 1, 0, 0, 0, 0); break;
      case 'custom':
        if (overviewCustomRange.start && overviewCustomRange.end) {
          start = new Date(overviewCustomRange.start);
          end = new Date(overviewCustomRange.end);
          end.setHours(23, 59, 59, 999);
        } else {
          start = new Date(2000, 0, 1); end = new Date(2099, 11, 31);
        }
        break;
      default: start = new Date(2000, 0, 1); end = new Date(2099, 11, 31);
    }
    return { start: start.getTime(), end: end.getTime() };
  }

  function renderOverview() {
    var panel = document.getElementById('overviewPanel');

    var range = getOverviewDateRange();
    var html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;flex-wrap:wrap;gap:0.8rem;">' +

      '</div>' +
      '<div class="overview-grid">';

    var allFilteredRecords = [];
    var allFilteredSessions = 0;

    subjects.forEach(function(sub) {
      var color = SUBJECT_COLORS[sub.colorIndex % SUBJECT_COLORS.length];
      var filtered = sub.records.filter(function(r) { return r.timestamp >= range.start && r.timestamp <= range.end; });
      var total = filtered.length;
      var random = filtered.filter(function(r) { return r.type === 'random'; }).length;
      var manual = filtered.filter(function(r) { return r.type === 'manual'; }).length;
      var sessions = 0, seen = {};
      filtered.forEach(function(r) { var k = Math.floor(r.timestamp / 1000); if (!seen[k]) { seen[k] = true; sessions++; } });
      allFilteredRecords = allFilteredRecords.concat(filtered);
      allFilteredSessions += sessions;
      html += '<div class="overview-subject-card" style="border-left-color:' + color.accent + ';">' +
        '<h3><span class="dot" style="background:' + color.accent + ';"></span>' + escapeHtml(sub.name) + '</h3>' +
        '<div class="overview-stats-row">' +
          '<span>总次数 <strong>' + total + '</strong></span>' +
          '<span>随机 <strong>' + random + '</strong></span>' +
          '<span>手动 <strong>' + manual + '</strong></span>' +
          '<span>轮次 <strong>' + sessions + '</strong></span>' +
        '</div></div>';
    });

    var totalAll = allFilteredRecords.length;
    var randomAll = allFilteredRecords.filter(function(r) { return r.type === 'random'; }).length;
    var manualAll = allFilteredRecords.filter(function(r) { return r.type === 'manual'; }).length;
    html += '<div class="overview-subject-card" style="border-left-color:var(--muted);">' +
      '<h3><span class="dot" style="background:var(--muted);"></span>全部合计</h3>' +
      '<div class="overview-stats-row">' +
        '<span>总次数 <strong>' + totalAll + '</strong></span>' +
        '<span>随机 <strong>' + randomAll + '</strong></span>' +
        '<span>手动 <strong>' + manualAll + '</strong></span>' +
        '<span>轮次 <strong>' + allFilteredSessions + '</strong></span>' +
      '</div></div>';

    html += '</div>';
    panel.innerHTML = html;
  }

  // ===== Date Helpers =====
  var customDateRange = { start: null, end: null };

  function getDateRange(period) {
    var now = new Date();
    var start, end;
    end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
    switch(period) {
      case 'day': start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0); break;
      case 'week': var dow = now.getDay() || 7; start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow + 1, 0, 0, 0, 0); break;
      case 'month': start = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0); break;
      case 'year': start = new Date(now.getFullYear(), 0, 1, 0, 0, 0, 0); break;
      case 'custom':
        if (customDateRange.start && customDateRange.end) {
          start = new Date(customDateRange.start);
          end = new Date(customDateRange.end);
          end.setHours(23, 59, 59, 999);
        } else {
          start = new Date(2000, 0, 1); end = new Date(2099, 11, 31);
        }
        break;
      default: start = new Date(2000, 0, 1); end = new Date(2099, 11, 31);
    }
    return { start: start.getTime(), end: end.getTime() };
  }

  // ===== File Save / Load =====
  window.saveToFile = function() {
    var data = {
      version: 2,
      savedAt: new Date().toISOString(),
      className: className,
      students: students,
      subjects: subjects
    };
    var json = JSON.stringify(data, null, 2);
    var blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = getFileNamePrefix() + '_' + new Date().toLocaleDateString('zh-CN').replace(/\//g, '-') + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('数据已保存到文件', 'success');
  };

  window.loadFromFile = function() { document.getElementById('fileInput').click(); };
  document.getElementById('fileInput').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (!data.students || !Array.isArray(data.students)) { showToast('文件格式不正确', 'error'); return; }
        students = data.students;
        subjects = data.subjects || [];
        className = data.className || '';
        // Ensure at least one subject
        if (subjects.length === 0) {
          subjects = [
            { id: 's1', name: '语文', colorIndex: 0, records: [], sessionCount: 0 }
          ];
        }
        activeTabId = subjects[0].id;
        updatePageTitle();
        applySubjectTheme();
        renderTabs();
        renderMainContent();
        showToast('成功加载 ' + students.length + ' 名学生、' + subjects.length + ' 个科目的数据', 'success');
      } catch(err) { showToast('文件读取失败：' + err.message, 'error'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ===== Student Management =====
  function parseStudentLine(line) {
    line = line.trim(); if (!line) return null;
    var parts = line.split(/\s+/);
    var name = '', id = '', gender = '';
    if (parts.length === 1) {
      if (/^\d+$/.test(parts[0])) id = parts[0]; else name = parts[0];
    } else if (parts.length === 2) {
      if (/^\d+$/.test(parts[0]) && /^[男女]$/.test(parts[1])) { id = parts[0]; gender = parts[1]; }
      else { name = parts[0]; id = parts[1]; }
    } else {
      name = parts[0]; id = parts[1]; gender = parts[2];
      if (!/^[男女]$/.test(gender)) gender = '';
    }
    if (!name && !id) return null;
    return { name: name, id: id, gender: gender };
  }

  window.addStudents = function() {
    var input = document.getElementById('studentInput');
    var text = input.value.trim();
    if (!text) { showToast('请输入学生信息', 'error'); return; }
    var lines = text.split('\n').filter(function(l) { return l.trim(); });
    var added = 0;
    lines.forEach(function(line) {
      var parsed = parseStudentLine(line);
      if (!parsed) return;
      var exists = students.some(function(s) {
        return (parsed.name && s.name === parsed.name) || (parsed.id && s.id === parsed.id);
      });
      if (exists) return;
      students.push(parsed);
      added++;
    });
    if (added > 0) { input.value = ''; renderStudentList(); renderMainContent(); showToast('成功添加 ' + added + ' 名学生', 'success'); }
    else { showToast('没有新学生可添加', 'error'); }
  };

  window.removeStudent = function(index) {
    var display = getDisplayName(students[index]);
    students.splice(index, 1);
    renderStudentList();
    renderMainContent();
    showToast('已移除 ' + display, 'info');
  };

  window.updateStudent = function(index) {
    var n = (document.getElementById('editName_' + index).value || '').trim();
    var i = (document.getElementById('editId_' + index).value || '').trim();
    var g = (document.getElementById('editGender_' + index).value || '').trim();
    if (!n && !i) { showToast('姓名和学号至少填一个', 'error'); return; }
    if (g && !/^[男女]$/.test(g)) { showToast('性别请填"男"或"女"', 'error'); return; }
    students[index].name = n; students[index].id = i; students[index].gender = g;
    renderStudentList(); renderMainContent();
    showToast('已更新学生信息', 'success');
  };

  window.clearAllStudents = function() {
    if (students.length === 0) return;
    if (!confirm('确定要清空所有学生吗？')) return;
    students = [];
    renderStudentList(); renderMainContent();
    showToast('已清空所有学生', 'info');
  };

  function getDisplayName(s) { return (s.name && s.id) ? s.name : (s.name || s.id || ''); }
  function getGenderBadge(g) {
    if (!g) return '';
    return '<span class="gender-badge ' + (g === '男' ? 'm' : 'f') + '">' + escapeHtml(g) + '</span>';
  }

  function renderStudentList() {
    var tbody = document.getElementById('studentListBody');
    var count = document.getElementById('studentCount');
    if (students.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:2rem;">暂无学生</td></tr>';
      count.textContent = ''; return;
    }
    var html = '';
    students.forEach(function(s, i) {
      html += '<tr>' +
        '<td><input type="text" class="cell-input" id="editName_' + i + '" value="' + escapeHtml(s.name || '') + '" placeholder="姓名"></td>' +
        '<td><input type="text" class="cell-input" id="editId_' + i + '" value="' + escapeHtml(s.id || '') + '" placeholder="学号"></td>' +
        '<td><input type="text" class="cell-input" id="editGender_' + i + '" value="' + escapeHtml(s.gender || '') + '" placeholder="男/女" style="width:50px;"></td>' +
        '<td class="actions"><button class="btn btn-primary btn-sm" onclick="updateStudent(' + i + ')">保存</button><button class="btn btn-danger btn-sm" onclick="removeStudent(' + i + ')">删除</button></td></tr>';
    });
    tbody.innerHTML = html;
    count.textContent = '共 ' + students.length + ' 名学生';
  }

  // ===== Roll Call Display =====
  function renderCountBadge() {
    document.getElementById('countBadge').textContent = '共 ' + students.length + ' 名学生';
  }
  function updateRollingState() {
    if (students.length === 0) {
      document.getElementById('allNamesDisplay').innerHTML = '<div style="color:var(--muted);font-size:1.2rem;">请先添加学生</div>';
      document.getElementById('kbHint').style.display = 'none';
    } else if (!isRolling) { document.getElementById('kbHint').style.display = ''; }
  }
  function renderAllNamesDisplay() {
    var c = document.getElementById('allNamesDisplay');
    if (students.length === 0) { c.innerHTML = '<div style="color:var(--muted);font-size:1.2rem;">请先添加学生</div>'; return; }
    var html = '';
    students.forEach(function(s, i) {
      var d = getDisplayName(s);
      var cur = isManualMode ? ' style="cursor:pointer;"' : '';
      var clk = isManualMode ? ' onclick="manualPick(' + i + ')"' : '';
      html += '<div class="name-tag" data-index="' + i + '" id="nameTag_' + i + '"' + cur + clk + '>' + escapeHtml(d) + '</div>';
    });
    c.innerHTML = html;
  }

  // ===== Roll Call =====
  window.startRoll = function() {
    if (students.length === 0) { showToast('请先添加学生', 'error'); return; }
    if (isManualMode) toggleManualMode();
    isRolling = true;
    document.getElementById('btnStart').style.display = 'none';
    document.getElementById('btnStop').style.display = '';
    document.getElementById('kbHint').style.display = 'none';
    document.querySelectorAll('.name-tag').forEach(function(t) { t.classList.remove('selected', 'active', 'picked-manual'); });
    var last = -1;
    rollingInterval = setInterval(function() {
      var idx;
      do { idx = Math.floor(Math.random() * students.length); } while (idx === last && students.length > 1);
      last = idx;
      document.querySelectorAll('.name-tag').forEach(function(t, i) { t.classList.toggle('active', i === idx); });
    }, 45);
  };

  window.stopRoll = function() {
    if (!isRolling) return;
    isRolling = false;
    clearInterval(rollingInterval); rollingInterval = null;
    document.getElementById('btnStart').style.display = '';
    document.getElementById('btnStop').style.display = 'none';
    document.getElementById('kbHint').style.display = '';
    var at = document.querySelector('.name-tag.active');
    var si = -1;
    if (at) { si = parseInt(at.dataset.index); at.classList.remove('active'); at.classList.add('selected'); }
    else if (students.length > 0) { si = Math.floor(Math.random() * students.length); var t = document.getElementById('nameTag_' + si); if (t) t.classList.add('selected'); }
    if (si >= 0 && si < students.length) {
      var st = students[si], dn = getDisplayName(st);
      var sub = getActiveSubject();
      if (sub) {
        sub.records.push({ studentId: st.id, name: dn, type: 'random', timestamp: Date.now() });
        sub.sessionCount++;
      }
      showToast('随机选中：' + dn, 'success');
    }
  };

  // ===== Manual Mode =====
  window.toggleManualMode = function() {
    isManualMode = !isManualMode;
    var btn = document.getElementById('btnManual');
    if (isManualMode) {
      btn.textContent = '退出手动'; btn.classList.add('active');
      if (students.length === 0) { showToast('请先添加学生', 'error'); isManualMode = false; btn.textContent = '手动点名'; btn.classList.remove('active'); return; }
      if (isRolling) { isRolling = false; clearInterval(rollingInterval); rollingInterval = null; document.getElementById('btnStart').style.display = ''; document.getElementById('btnStop').style.display = 'none'; }
      renderAllNamesDisplay();
    } else {
      btn.textContent = '手动点名'; btn.classList.remove('active');
      renderAllNamesDisplay();
    }
  };

  window.manualPick = function(index) {
    if (!isManualMode) return;
    var st = students[index], dn = getDisplayName(st);
    document.querySelectorAll('.name-tag').forEach(function(t) { t.classList.remove('selected', 'active', 'picked-manual'); });
    var tag = document.getElementById('nameTag_' + index);
    if (tag) tag.classList.add('picked-manual');
    var sub = getActiveSubject();
    if (sub) {
      sub.records.push({ studentId: st.id, name: dn, type: 'manual', timestamp: Date.now() });
      sub.sessionCount++;
    }
    showToast('手动点名：' + dn, 'info');
  };

  // ===== Statistics =====
  window.setPeriod = function(period) {
    currentPeriod = period;
    document.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.toggle('active', t.dataset.period === period); });
    var picker = document.getElementById('dateRangePicker');
    if (period === 'custom') {
      picker.style.display = 'flex';
    } else {
      picker.style.display = 'none';
    }
    renderStats();
  };

  window.applyCustomDateRange = function() {
    var s = document.getElementById('customStartDate').value;
    var e = document.getElementById('customEndDate').value;
    if (!s || !e) { showToast('请选择开始和结束日期', 'error'); return; }
    if (new Date(s) > new Date(e)) { showToast('开始日期不能晚于结束日期', 'error'); return; }
    customDateRange.start = s;
    customDateRange.end = e;
    renderStats();
    showToast('已应用自定义时间段', 'success');
  };

  function renderStats() {
    var sub = statsViewSubject || getActiveSubject();
    var title = document.getElementById('statsTitle');
    title.textContent = sub ? sub.name + ' · 点名统计' : '点名统计';

    var records = sub ? sub.records : [];
    var range = getDateRange(currentPeriod);
    var filtered = records.filter(function(r) { return r.timestamp >= range.start && r.timestamp <= range.end; });

    document.getElementById('sumTotal').textContent = filtered.length;
    document.getElementById('sumRandom').textContent = filtered.filter(function(r) { return r.type === 'random'; }).length;
    document.getElementById('sumManual').textContent = filtered.filter(function(r) { return r.type === 'manual'; }).length;
    var sessions = 0, seen = {};
    filtered.forEach(function(r) { var k = Math.floor(r.timestamp / 1000); if (!seen[k]) { seen[k] = true; sessions++; } });
    document.getElementById('sumSessions').textContent = sessions;

    var map = {};
    students.forEach(function(s) {
      var k = s.id || s.name || '';
      map[k] = { name: getDisplayName(s), id: s.id, gender: s.gender, total: 0, random: 0, manual: 0 };
    });
    filtered.forEach(function(r) {
      var k = r.studentId || r.name || '';
      if (!map[k]) map[k] = { name: r.name, id: r.studentId, gender: '', total: 0, random: 0, manual: 0 };
      map[k].total++;
      if (r.type === 'random') map[k].random++; else map[k].manual++;
    });

    var arr = Object.values(map).sort(function(a, b) { return b.total - a.total; });
    var tbody = document.getElementById('statsBody');
    if (arr.length === 0) { tbody.innerHTML = '<tr class="empty-row"><td colspan="7">暂无点名记录</td></tr>'; return; }

    var html = '';
    arr.forEach(function(s) {
      var pct = filtered.length > 0 ? Math.round(s.total / filtered.length * 100) : 0;
      var bc = s.random >= s.manual ? 'var(--success)' : 'var(--accent2)';
      html += '<tr><td><strong>' + escapeHtml(s.name) + '</strong></td><td style="color:var(--muted);">' + escapeHtml(s.id || '') + '</td><td>' + getGenderBadge(s.gender) + '</td><td class="total-col">' + s.total + '</td><td class="random-col">' + s.random + '</td><td class="manual-col">' + s.manual + '</td><td class="bar-cell"><div class="bar-bg"><div class="bar-fill" style="width:' + pct + '%;background:' + bc + ';"></div></div></td></tr>';
    });
    tbody.innerHTML = html;
  }

  window.exportStats = function() {
    var sub = getActiveSubject();
    var records = sub ? sub.records : [];
    var range = getDateRange(currentPeriod);
    var filtered = records.filter(function(r) { return r.timestamp >= range.start && r.timestamp <= range.end; });
    var csv = '\uFEFF科目,姓名,学号,类型,时间\n';
    filtered.forEach(function(r) {
      csv += (sub ? sub.name : '') + ',' + r.name + ',' + (r.studentId || '') + ',' + (r.type === 'random' ? '随机点名' : '手动点名') + ',' + new Date(r.timestamp).toLocaleString('zh-CN') + '\n';
    });
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '点名统计_' + (sub ? sub.name : '') + '_' + currentPeriod + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('数据已导出', 'success');
  };

  window.clearCurrentSubjectStats = function() {
    var sub = getActiveSubject();
    if (!sub || sub.records.length === 0) return;
    if (!confirm('确定清空"' + sub.name + '"的所有点名记录吗？')) return;
    sub.records = []; sub.sessionCount = 0;
    renderStats(); showToast('已清空"' + sub.name + '"的统计', 'info');
  };

  // ===== Utility =====
  function escapeHtml(str) { var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

  // ===== Init =====
  function init() {
    var now = new Date();
    document.getElementById('headerDate').textContent = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    updatePageTitle();
    applySubjectTheme();
    renderTabs();
    renderMainContent();

    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') { e.preventDefault(); if (isRolling) stopRoll(); else startRoll(); }
    });
  }

  init();
})();
</script>
</body>
</html>
