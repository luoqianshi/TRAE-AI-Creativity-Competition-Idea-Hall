<script>
        // 简单的标签切换交互
        const tags = document.querySelectorAll('.interest-tag');
        tags.forEach(tag => {
            tag.addEventListener('click', () => {
                tag.classList.toggle('active');
                if (tag.classList.contains('active')) {
                    tag.classList.remove('bg-white');
                } else {
                    tag.classList.add('bg-white');
                }
            });
        });
    </script>
