<script>
        // 简单的切换交互
        const avatarCards = document.querySelectorAll('.avatar-card');
        avatarCards.forEach(card => {
            card.addEventListener('click', () => {
                avatarCards.forEach(c => c.classList.remove('active'));
                card.classList.add('active');
            });
        });
    </script>
