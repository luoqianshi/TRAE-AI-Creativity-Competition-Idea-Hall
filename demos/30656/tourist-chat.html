<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI 数字导游 - 智能对话</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
        body { font-family: 'PingFang SC', sans-serif; overflow: hidden; }
        .chat-bg { background-color: #f8fafc; }
        .message-bubble-ai { background: white; border-bottom-left-radius: 4px; }
        .message-bubble-user { background: #16a34a; color: white; border-bottom-right-radius: 4px; }
        .pulse-ring {
            position: absolute;
            width: 80px;
            height: 80px;
            background: rgba(22, 163, 74, 0.2);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row chat-bg">
<!-- 左侧：对话区域 -->
<div class="flex-1 flex flex-col h-full border-r border-slate-200 bg-white">
<!-- 顶部栏 -->
<header class="h-16 flex items-center justify-between px-6 border-b border-slate-100 flex-shrink-0">
<div class="flex items-center space-x-3">
<a class="p-2 hover:bg-slate-100 rounded-full transition-colors" href="tourist-home.html">
<iconify-icon class="text-2xl text-slate-600" icon="solar:alt-arrow-left-outline"></iconify-icon>
</a>
<div>
<h1 class="font-bold text-slate-800">AI 数字导游</h1>
<div class="flex items-center space-x-1">
<span class="w-2 h-2 bg-green-500 rounded-full"></span>
<span class="text-[10px] text-slate-400 uppercase tracking-tighter">Live Support</span>
</div>
</div>
</div>
<button class="text-slate-400 hover:text-slate-600">
<iconify-icon class="text-2xl" icon="solar:menu-dots-bold"></iconify-icon>
</button>
</header>
<!-- 消息列表 -->
<div class="flex-grow overflow-y-auto p-6 space-y-6" id="chat-messages">
<!-- AI 欢迎语 -->
<div class="flex items-start space-x-3">
<div class="w-10 h-10 rounded-full bg-green-100 flex-shrink-0 flex items-center justify-center overflow-hidden">
<img alt="AI Avatar" class="w-full h-full object-cover" src="https://modao.cc/agent-py/media/generated_images/2026-06-04/79894492f209442ea803043c60c3d700.jpg"/>
</div>
<div class="max-w-[80%]">
<div class="message-bubble-ai p-4 rounded-2xl shadow-sm border border-slate-100 text-slate-700 leading-relaxed">
                        您好！欢迎来到翠微山风景区。我是您的数字导游小翠。请问有什么我可以帮您的吗？您可以问我关于景点介绍、门票价格或者游览路线。
                    </div>
<span class="text-[10px] text-slate-300 mt-1 block ml-1">10:24 AM</span>
</div>
</div>
<!-- 用户提问示例 -->
<div class="flex items-start justify-end space-x-3">
<div class="max-w-[80%] text-right">
<div class="message-bubble-user p-4 rounded-2xl shadow-md text-left leading-relaxed">
                        今天天气怎么样？适合爬山吗？
                    </div>
<span class="text-[10px] text-slate-300 mt-1 block mr-1">10:25 AM</span>
</div>
<div class="w-10 h-10 rounded-full bg-slate-200 flex-shrink-0 flex items-center justify-center">
<iconify-icon class="text-slate-500 text-xl" icon="solar:user-bold"></iconify-icon>
</div>
</div>
<!-- AI 回复示例 -->
<div class="flex items-start space-x-3">
<div class="w-10 h-10 rounded-full bg-green-100 flex-shrink-0 flex items-center justify-center overflow-hidden">
<img alt="AI Avatar" class="w-full h-full object-cover" src="https://modao.cc/agent-py/media/generated_images/2026-06-04/79894492f209442ea803043c60c3d700.jpg"/>
</div>
<div class="max-w-[80%]">
<div class="message-bubble-ai p-4 rounded-2xl shadow-sm border border-slate-100 text-slate-700 leading-relaxed">
                        今天翠微山天气晴朗，气温在 18°C 到 25°C 之间，非常适合户外活动。山上的能见度很高，您可以在云端栈道欣赏到绝美的云海景观。建议您带上一件轻薄的外套，山顶风力稍大。
                    </div>
<span class="text-[10px] text-slate-300 mt-1 block ml-1">10:25 AM</span>
</div>
</div>
</div>
<!-- 快捷操作 -->
<div class="px-6 py-2 flex flex-wrap gap-2 flex-shrink-0">
<button class="text-xs bg-slate-100 hover:bg-green-50 hover:text-green-700 px-3 py-1.5 rounded-full text-slate-600 transition-colors border border-slate-200">介绍一下这个景区</button>
<button class="text-xs bg-slate-100 hover:bg-green-50 hover:text-green-700 px-3 py-1.5 rounded-full text-slate-600 transition-colors border border-slate-200">有什么必看的景点</button>
<button class="text-xs bg-slate-100 hover:bg-green-50 hover:text-green-700 px-3 py-1.5 rounded-full text-slate-600 transition-colors border border-slate-200">推荐一条游览路线</button>
</div>
<!-- 输入区域 -->
<div class="p-6 border-t border-slate-100 bg-white flex-shrink-0">
<div class="flex items-center space-x-3">
<div class="flex-grow relative">
<input class="w-full bg-slate-100 border-none rounded-2xl px-5 py-3 pr-12 focus:ring-2 focus:ring-green-500 transition-all outline-none" placeholder="输入您的问题..." type="text"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
<iconify-icon class="text-2xl" icon="solar:face-smile-bold-duotone"></iconify-icon>
</button>
</div>
<div class="relative flex items-center justify-center">
<div class="hidden pulse-ring" id="voice-pulse"></div>
<button class="w-12 h-12 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center hover:bg-green-100 hover:text-green-600 transition-all shadow-sm" id="voice-btn">
<iconify-icon class="text-2xl" icon="solar:microphone-bold-duotone"></iconify-icon>
</button>
</div>
<button class="w-12 h-12 bg-green-600 text-white rounded-full flex items-center justify-center hover:bg-green-700 transition-all shadow-lg shadow-green-900/20">
<iconify-icon class="text-2xl" icon="solar:plain-bold"></iconify-icon>
</button>
</div>
</div>
</div>
<!-- 右侧：数字人展示区域 -->
<div class="hidden md:flex flex-col w-[400px] bg-gradient-to-b from-green-50 to-white h-full relative overflow-hidden">
<!-- 背景装饰 -->
<div class="absolute top-20 left-10 w-64 h-64 bg-green-200/30 blur-3xl rounded-full"></div>
<div class="absolute bottom-20 right-10 w-48 h-48 bg-emerald-200/30 blur-3xl rounded-full"></div>
<div class="relative flex-grow flex flex-col items-center justify-center p-8">
<!-- 数字人 -->
<div class="relative w-full aspect-[3/4] max-h-[600px] rounded-[3rem] overflow-hidden shadow-2xl border-4 border-white bg-white/40 backdrop-blur-md">
<img alt="Realistic 3D digital human guide" class="w-full h-full object-cover" src="https://modao.cc/agent-py/media/generated_images/2026-06-04/ebed1693c12d43c8825a1b311bd25d78.jpg"/>
<!-- 状态标签 -->
<div class="absolute top-6 left-6 flex items-center space-x-2 bg-black/20 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20">
<div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
<span class="text-xs text-white font-medium" id="avatar-status">😊 微笑中</span>
</div>
<!-- 口型同步示意 -->
<div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex items-end space-x-1 h-8">
<div class="w-1.5 bg-white/80 rounded-full animate-[bounce_0.6s_infinite_0s]"></div>
<div class="w-1.5 bg-white/80 rounded-full animate-[bounce_0.6s_infinite_0.1s] h-6"></div>
<div class="w-1.5 bg-white/80 rounded-full animate-[bounce_0.6s_infinite_0.2s] h-4"></div>
<div class="w-1.5 bg-white/80 rounded-full animate-[bounce_0.6s_infinite_0.3s] h-7"></div>
<div class="w-1.5 bg-white/80 rounded-full animate-[bounce_0.6s_infinite_0.4s] h-5"></div>
</div>
</div>
<!-- 说明 -->
<div class="mt-8 text-center">
<h2 class="text-lg font-bold text-slate-800">数字人导游：小翠</h2>
<p class="text-sm text-slate-500 mt-1">支持多语言交互与情感化表达</p>
</div>
</div>
</div>
<script>
        // 模拟语音录音状态
        const voiceBtn = document.getElementById('voice-btn');
        const voicePulse = document.getElementById('voice-pulse');
        let isRecording = false;

        voiceBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                voicePulse.classList.remove('hidden');
                voiceBtn.classList.add('bg-green-600', 'text-white');
            } else {
                voicePulse.classList.add('hidden');
                voiceBtn.classList.remove('bg-green-600', 'text-white');
            }
        });

        // 模拟数字人状态切换
        const statusEl = document.getElementById('avatar-status');
        const statuses = ["😊 微笑中", "🗣️ 讲解中", "🤔 思考中", "👋 欢迎中"];
        let statusIndex = 0;

        setInterval(() => {
            statusIndex = (statusIndex + 1) % statuses.length;
            statusEl.textContent = statuses[statusIndex];
        }, 5000);
    </script>
</body>
</html>
