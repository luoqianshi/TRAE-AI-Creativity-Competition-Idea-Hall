<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI全科个性化学习规划助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background-color: #f0f7ff;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px #00000015;
        }

        h1 {
            text-align: center;
            color: #2b7def;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .box {
            background: #f8fbff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h3 {
            color: #2b7def;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .item {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cce0f5;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background: #2b7def;
            color: #fff;
        }

        .btn-primary:hover {
            background: #1e6cd8;
        }

        .btn-default {
            background: #e8f0fc;
            color: #2b7def;
        }

        .result-box {
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 14px;
        }

        .record-item {
            padding: 10px;
            background: #fff;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid #eee;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>AI全科个性化学习规划助手</h1>

        <div class="box">
            <h3>📝 填写你的学习信息</h3>
            <div class="item">
                <label>所在年级</label>
                <select id="grade">
                    <option value="小学">小学</option>
                    <option value="初中">初中</option>
                    <option value="高中">高中</option>
                    <option value="大学/备考">大学/备考</option>
                </select>
            </div>
            <div class="item">
                <label>每日可用学习时长（小时）</label>
                <input type="number" id="time" placeholder="例如：4" value="4">
            </div>
            <div class="item">
                <label>薄弱科目（多个用逗号隔开）</label>
                <input type="text" id="weak" placeholder="例如：数学,英语">
            </div>
            <div class="item">
                <label>本次学习目标</label>
                <input type="text" id="goal" placeholder="例如：查漏补缺、考前冲刺、夯实基础">
            </div>
            <div class="btn-group">
                <button class="btn-primary" onclick="createPlan()">✨ 一键生成学习计划</button>
                <button class="btn-default" onclick="resetAll()">🔄 重置信息</button>
            </div>
        </div>

        <div class="box">
            <h3>📅 专属学习方案 & 考点总结</h3>
            <textarea id="result" class="result-box" readonly placeholder="你的个性化学习计划将在这里生成..."></textarea>
            <div class="btn-group" style="margin-top:15px;">
                <button class="btn-primary" onclick="downloadPlan()">💾 导出计划文本</button>
            </div>
        </div>

        <div class="box">
            <h3>📒 每日打卡 & 错题复盘</h3>
            <div class="item">
                <label>今日学习总结 / 错题记录</label>
                <textarea id="note" placeholder="记录今日错题、薄弱点、学习收获..."></textarea>
            </div>
            <div class="btn-group">
                <button class="btn-primary" onclick="saveRecord()">✅ 保存记录</button>
                <button class="btn-default" onclick="showRecord()">📋 查看历史记录</button>
            </div>
            <div id="recordList" style="margin-top:15px;"></div>
        </div>

    </div>

    <script>
        // 生成学习计划
        function createPlan() {
            const grade = document.getElementById('grade').value;
            const time = document.getElementById('time').value;
            const weak = document.getElementById('weak').value || "无";
            const goal = document.getElementById('goal').value || "夯实基础，稳步提升";

            let plan = "";
            plan += "【AI个性化学习计划】\n";
            plan += `适配学段：${grade}\n`;
            plan += `每日学习时长：${time}小时\n`;
            plan += `薄弱学科：${weak}\n`;
            plan += `学习目标：${goal}\n\n`;

            // 智能时段分配
            let t = parseFloat(time);
            plan += "🕒 分时段学习安排：\n";
            plan += "1. 晨间记忆时段（占比30%）：主攻背诵类、知识点记忆、单词、公式、古诗文\n";
            plan += "2. 午间刷题时段（占比40%）：针对薄弱科目专项刷题、错题复盘\n";
            plan += "3. 晚间梳理时段（占比30%）：总结当日知识点、整理错题、规划次日重点\n\n";

            plan += "📌 薄弱科目提升建议：\n";
            if (weak.includes("数学")) {
                plan += "【数学】优先梳理公式定理，针对性刷基础题型，整理错题本，总结解题模板\n";
            }
            if (weak.includes("英语")) {
                plan += "【英语】每日固定单词背诵+短句积累，精读短文，练习基础语法题型\n";
            }
            if (weak.includes("语文")) {
                plan += "【语文】背诵古诗文与文言实词，积累作文素材，练习阅读答题模板\n";
            }
            if (weak.includes("物理") || weak.includes("化学")) {
                plan += "【理科】熟记概念公式，重视实验题型，错题归类整理，针对性突破薄弱模块\n";
            }
            if (weak === "无") {
                plan += "全科基础扎实，以保持手感、拔高训练、拓展题型为主\n";
            }

            plan += "\n💡 学习小贴士：每日坚持打卡，优先攻克薄弱点，循序渐进提升，避免盲目刷题！";

            document.getElementById('result').value = plan;
        }

        // 重置
        function resetAll() {
            document.getElementById('grade').value = "小学";
            document.getElementById('time').value = "4";
            document.getElementById('weak').value = "";
            document.getElementById('goal').value = "";
            document.getElementById('result').value = "";
            document.getElementById('note').value = "";
        }

        // 导出计划
        function downloadPlan() {
            const text = document.getElementById('result').value;
            if (!text) {
                alert("请先生成学习计划！");
                return;
            }
            const blob = new Blob([text], { type: "text/plain" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "AI个性化学习计划.txt";
            a.click();
        }

        // 本地存储记录
        function saveRecord() {
            const note = document.getElementById('note').value;
            if (!note) {
                alert("请输入学习记录！");
                return;
            }
            let list = JSON.parse(localStorage.getItem("studyRecord") || "[]");
            list.push({
                time: new Date().toLocaleString(),
                content: note
            });
            localStorage.setItem("studyRecord", JSON.stringify(list));
            alert("记录保存成功！");
            document.getElementById('note').value = "";
        }

        // 展示记录
        function showRecord() {
            let list = JSON.parse(localStorage.getItem("studyRecord") || "[]");
            let html = "";
            if (list.length === 0) {
                html = "<div class='record-item'>暂无学习记录</div>";
            } else {
                list.forEach(item => {
                    html += `<div class='record-item'><b>${item.time}</b><p>${item.content}</p></div>`;
                })
            }
            document.getElementById('recordList').innerHTML = html;
        }
    </script>
</body>

</html>
