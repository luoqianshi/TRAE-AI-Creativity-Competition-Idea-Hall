<style>

html.light{--bg:#f6f7fb;--bg-soft:#fff;--card:#fff;--card-2:#f1f3f9;--line:#e3e6ef;--txt:#1a1d26;--txt-dim:#525866;--txt-mute:#8a90a0;--shadow:0 8px 30px rgba(20,30,60,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 600px at 80% -10%,rgba(255,107,74,.12),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(90,169,255,.10),transparent 60%),var(--bg);color:var(--txt);line-height:1.65;min-height:100vh;padding-bottom:64px;transition:background .3s,color .3s}
html.light body{background:radial-gradient(1200px 600px at 80% -10%,rgba(255,107,74,.08),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(90,169,255,.07),transparent 60%),var(--bg)}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(15,17,21,.78);border-bottom:1px solid var(--line)}
html.light header.top{background:rgba(255,255,255,.82)}
.top-in{display:flex;align-items:center;gap:16px;padding:14px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.5px}
.logo .fire{font-size:22px}
.logo small{font-weight:600;color:var(--txt-mute);font-size:11px;letter-spacing:1px}
.nav{display:flex;gap:6px;margin-left:8px}
.nav button{background:transparent;border:1px solid transparent;color:var(--txt-dim);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;transition:.18s}
.nav button:hover{color:var(--txt);background:var(--card)}
.nav button.active{color:var(--txt);background:var(--card-2);border-color:var(--line)}
.spacer{flex:1}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#1a1208;border:none;padding:10px 18px;border-radius:999px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(255,107,74,.35);transition:.18s;font-size:14px}

.hero{padding:40px 0 14px;text-align:center}

.hero h1 .grad{background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}

.hero .stats{display:flex;justify-content:center;gap:26px;margin-top:18px;flex-wrap:wrap}
.hero .stat{text-align:center}
.hero .stat b{display:block;font-size:22px;color:var(--accent-2)}
.hero .stat span{font-size:12px;color:var(--txt-mute)}
.toolbar{display:flex;gap:10px;align-items:center;margin:22px 0 10px;flex-wrap:wrap}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px}
.search input{flex:1;background:transparent;border:none;outline:none;color:var(--txt);font-size:14px}
.search input::placeholder{color:var(--txt-mute)}
.sort{display:flex;gap:6px}
.filters{display:flex;flex-direction:column;gap:10px;margin:8px 0 14px}
.filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-row .label{font-size:12px;color:var(--txt-mute);min-width:64px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);color:var(--txt-dim);padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s;font-weight:600}
.chip:hover{color:var(--txt);border-color:#3a4159}
.chip.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#1a1208;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:10px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;transition:.2s;position:relative;overflow:hidden}
.card:hover{border-color:#3a4159;transform:translateY(-2px);box-shadow:var(--shadow)}
.card.open{box-shadow:var(--shadow)}
.card .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--accent-2);background:rgba(255,181,71,.10);padding:4px 10px;border-radius:999px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:16.5px;line-height:1.45}
.card .count{color:var(--txt-mute);font-size:13px;display:flex;align-items:center;gap:6px}
.card .meta{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:12px;color:var(--txt-mute)}

.card .actions button:hover{border-color:var(--accent);color:var(--accent)}
.card .emoji{position:absolute;right:14px;top:14px;font-size:22px;opacity:.55}
.card .fav-star{position:absolute;right:14px;top:48px;font-size:16px;cursor:pointer;opacity:.5;transition:.15s}
.card .fav-star:hover{opacity:1}
.card .fav-star.on{opacity:1;color:var(--accent-2)}
.detail{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:none}
.card.open .detail{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.detail .block{margin-bottom:14px}
.detail .block h4{margin:0 0 4px;font-size:12px;color:var(--accent);letter-spacing:1px;font-weight:700}
.detail .block p{margin:0;color:var(--txt);font-size:14.5px;line-height:1.75}
.detail .block.warn p{color:var(--warn)}
.detail .block.again p{color:var(--good)}
.detail .foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;padding:12px 0 0;border-top:1px solid var(--line)}
.mood{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:4px 12px;border-radius:999px}
.mood.后悔{background:rgba(255,93,108,.14);color:#ff8a96}
.mood.尴尬{background:rgba(255,194,75,.14);color:var(--warn)}
.mood.后怕{background:rgba(90,169,255,.14);color:var(--info)}
.mood.释然{background:rgba(70,211,154,.14);color:var(--good)}
.mood.愤怒{background:rgba(255,107,74,.14);color:var(--accent)}
.like-btn{background:var(--card-2);border:1px solid var(--line);color:var(--txt);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.like-btn:hover{border-color:var(--accent);color:var(--accent)}
.like-btn.liked{background:rgba(255,107,74,.16);border-color:var(--accent);color:var(--accent)}
.comments{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.comments h5{margin:0 0 10px;font-size:12px;color:var(--txt-mute);letter-spacing:1px;font-weight:700}
.cmt{display:flex;gap:10px;margin-bottom:10px}

.board{margin-top:30px;background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--radius);padding:20px}

.board li .t{flex:1;font-size:14.5px}
.board li .n{color:var(--txt-mute);font-size:13px;font-weight:700}
.page{display:none}

.quiz-wrap{max-width:820px;margin:24px auto}
.quiz-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}

.quiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.quiz-head .idx{color:var(--accent-2);font-weight:800;font-size:14px}
.quiz-head .diff{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}

.diff.困难{background:rgba(255,93,108,.16);color:var(--bad)}
.quiz-head .timer{color:var(--txt-dim);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--card-2);border-radius:999px;overflow:hidden;margin-bottom:20px}

.scenario{background:var(--bg-soft);border-left:3px solid var(--accent);padding:16px 18px;border-radius:0 10px 10px 0;font-size:15.5px;margin-bottom:20px;color:var(--txt);line-height:1.8}
.q-title{font-weight:700;margin-bottom:14px;font-size:15px;color:var(--txt-dim)}
.opts{display:flex;flex-direction:column;gap:10px}

.opt:hover{border-color:var(--accent);transform:translateX(2px)}
.opt .key{width:26px;height:26px;flex:none;border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-2);font-size:13px}
.opt.correct{border-color:var(--good);background:rgba(70,211,154,.12)}

.opt.wrong{border-color:var(--bad);background:rgba(255,93,108,.10)}
.opt.disabled{pointer-events:none;opacity:.7}
.feedback{display:none;margin-top:18px;background:var(--bg-soft);border:1px solid var(--line);border-radius:12px;padding:18px}
.feedback.show{display:block;animation:fade .3s ease}
.feedback h4{margin:0 0 10px;color:var(--accent-2);font-size:14px}
.stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:10px}

.tip{margin-top:12px;padding:12px;background:var(--card);border-radius:8px;font-size:14px;color:var(--txt);line-height:1.7}

.quiz-foot{display:flex;justify-content:space-between;margin-top:22px;gap:10px;flex-wrap:wrap}
.result{text-align:center;padding:24px 10px}

.share-card .row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--txt-dim)}

.result .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.review-list{margin-top:18px;text-align:left}

.review-item .ri-y{color:var(--bad);font-size:12.5px}
.review-item .ri-c{color:var(--good);font-size:12.5px;margin-top:2px}
.bottom-tab{display:none;position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(15,17,21,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
html.light .bottom-tab{background:rgba(255,255,255,.92)}
.bottom-tab .inner{display:flex;justify-content:space-around;max-width:480px;margin:0 auto}
.bottom-tab button{background:transparent;border:none;color:var(--txt-mute);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 14px}
.bottom-tab button.active{color:var(--accent)}

@media(max-width:760px){.bottom-tab{display:block}.nav{display:none}.hero{padding-top:24px}body{padding-bottom:74px}header.top .btn#shareBtn{display:none}}
footer{margin-top:40px;padding:24px 0;border-top:1px solid var(--line);color:var(--txt-mute);font-size:13px;text-align:center}
.empty{text-align:center;color:var(--txt-mute);padding:40px 0;font-size:14px}
.load-more{display:block;margin:24px auto;background:var(--card);border:1px solid var(--line);color:var(--txt-dim);padding:10px 22px;border-radius:999px;cursor:pointer;font-weight:600;transition:.15s}

.fav-empty-state{background:var(--bg-soft);border:1px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--txt-mute);font-size:14px}
.quiz-intro{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--radius);padding:24px;text-align:center;max-width:560px;margin:24px auto}
.quiz-intro h2{margin:0 0 8px}

.quiz-intro .meta-row{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;color:var(--txt-mute);font-size:13px;margin-bottom:20px}
.quiz-intro .meta-row span{display:flex;align-items:center;gap:6px}
</style>
</head>

{id:3,scene:"沟通",mood:"尴尬",emoji:"🌙",title:"凌晨1点给领导发了60秒语音方阵",brief:"加班到凌晨，突然想到一个重要问题，直接发了微信语音",people:856,date:"2025-01-20",situation:"加班到凌晨，突然想到一个重要问题，直接发了微信语音。",did:"连续发了4条60秒语音，内容其实是明天也能说的事。",result:"第二天领导说「以后别发语音，尤其半夜」，语气很冷。",again:"编辑成文字，设为定时发送，第二天早上8点发出。",warning:"发完第一条语音时其实已经后悔了，但继续发了3条。",comments:[{n:"匿名·运营",a:"🦊",t:"语音方阵是职场核武器，没有特殊情况不要用。"}]},

{id:5,scene:"晋升",mood:"后悔",emoji:"🪜",title:"晋升答辩，我把前领导批了一顿",brief:"晋升答辩被问「上一段经历最大收获」，我开始吐槽前领导",people:489,date:"2025-05-06",situation:"晋升答辩，评委问「上一段经历你最大的收获是什么」。",did:"我顺势吐槽前领导管理混乱、抢功劳，讲了三分钟。",result:"评委里有一位和我前领导很熟。答辩没过，HR反馈「格局有提升空间」。",again:"把负向经历转成正向成长：「我学会了在资源有限时如何独立推进项目」。",warning:"把答辩当成了情绪出口；只想着证明「离开是对的」，没想过评委的人脉网。",comments:[{n:"匿名·总监",a:"🐲",t:"晋升答辩是看你能不能扛更大的盘子，不是给你开吐槽大会。"}]},
{id:6,scene:"离职",mood:"释然",emoji:"🚪",title:"离职时没交接清楚，三个月后还被追着问",brief:"拿到offer后心已经飞了，交接草草了事",people:721,date:"2025-03-25",situation:"拿到心仪offer后心已经飞了，最后两周交接草草了事。",did:"把文档丢给接手的同事，没做任何面对面讲解就走了。",result:"离职三个月后还在被前同事微信追问；接手的同事跟我前领导抱怨；行业内口碑受损。",again:"列一份「接手清单」，每个模块当面过一遍，留一份带截图的操作文档。",warning:"离职期的态度，会被前同事记很久；「人走茶凉」是职场最大误解。",comments:[{n:"匿名·猎头",a:"🦊",t:"背调时前同事的评价权重比你想象的高。"}]},
{id:7,scene:"沟通",mood:"愤怒",emoji:"⚡",title:"开会时当众反驳同事，场面一度很僵",brief:"会议上同事甩锅给我，我当场拍桌子怼回去",people:538,date:"2025-02-14",situation:"跨部门会议上，同事当众把责任推到我头上。",did:"我当场提高音量反驳，还翻出对方的历史问题一一列举。",result:"会议中断15分钟。领导事后说「你是对的，但方式不对」。双方关系至今没修复。",again:"当场说「这个问题我们下来对齐一下数据和责任归属」，把争议挪到私下。",warning:"被当众甩锅时第一反应是还击；把「证明我对」看得比「解决问题」重要。",comments:[{n:"匿名·PM",a:"🐯",t:"当众争论没有赢家，挪场是成熟职场人的本能。"}]},
{id:8,scene:"面试",mood:"后怕",emoji:"😰",title:"面试时把简历项目夸大了，被深挖穿帮",brief:"把「参与」写成了「主导」，面试官开始深挖细节",people:967,date:"2025-04-22",situation:"面试时把简历上一个「参与」的项目说成了「主导」。",did:"面试官追问架构决策、关键trade-off，我硬着头皮编，越编越乱。",result:"面试官最后说「我们聊聊你真正负责的部分吧」。当场社死，面试挂了。",again:"「主导」改成「深度参与，负责其中XX模块」；不熟悉的细节直接说「这部分是XX同事主导」。",warning:"简历包装的边界是「不虚构、不冒领」；深挖技术细节时，编不下去就是死局。",comments:[{n:"匿名·面试官",a:"🦉",t:"深挖两个问题就能判断真假，包装别越界。"}]},
{id:9,scene:"汇报",mood:"尴尬",emoji:"😳",title:"季度汇报，我把大老板的名字念错了",brief:"汇报时多次提到集团副总裁，名字念错了一整个字",people:412,date:"2025-05-18",situation:"季度汇报，PPT里多次引用集团副总裁的指示，但我把名字念错了一个字。",did:"全程念错，没人当场纠正，我还以为自己讲得不错。",result:"散会后同事私下告诉我。直属领导说「以后引用谁，先把名字念三遍」。",again:"汇报前把所有出现的人名、职位、数据逐项核对一遍，重点念出来录音回放。",warning:"把「内容」当成了全部，忽略了「细节准确性」也是一种尊重。",comments:[]},
{id:10,scene:"技术",mood:"释然",emoji:"🧹",title:"我删了同事的代码，还说是「清理冗余」",brief:"看不惯同事的代码，悄悄删了一大段，结果是他正在调试的",people:318,date:"2025-03-30",situation:"觉得同事提交的代码很乱，自作主张删了一大段，注释写「清理冗余」。",did:"直接提交了，没跟同事说。结果那段是他正在调试的核心逻辑。",result:"同事排查了一下午才找到原因，差点误了deadline。从此他对我的PR一律要求解释。",again:"动别人代码前先私聊确认；删除前留个备份分支；PR里说明动机，而不是默默提交。",warning:"「我以为是在帮他」其实是越界；代码所有权比代码整洁度更重要。",comments:[{n:"匿名·后端",a:"🐻",t:"别人的代码再丑也是别人的，动之前问一句是底线。"}]},
{id:11,scene:"邮件",mood:"后怕",emoji:"📧",title:"回复全部，把吐槽发给了全公司",brief:"收到全员邮件，本想私下吐槽，手滑点了「回复全部」",people:1542,date:"2025-04-01",situation:"收到一封全员通告邮件，我本想在正文里吐槽两句发给旁边的同事。",did:"手滑点了「回复全部」，吐槽内容秒发到全公司三千人的邮箱。",result:"3分钟内撤回，但已经有人截图。HR约谈，被记一次书面警告。",again:"吐槽永远在脱机文档里写；邮件客户端禁用「回复全部」快捷键；发送前看收件人列表。",warning:"用了快捷键Ctrl+Shift+R；吐槽和工作邮件在同一窗口；没开启「延迟发送」。",comments:[{n:"匿名·行政",a:"🐧",t:"延迟发送10秒，能救你90%的社死。"}]},
{id:12,scene:"薪资",mood:"后悔",emoji:"💰",title:"谈薪时我先报了底价，后来发现低了30%",brief:"HR问期望薪资，我脱口而出一个数字，事后才知道市场价更高",people:874,date:"2025-02-10",situation:"终面HR问「你的期望薪资是多少」，我没做准备，脱口说了一个数字。",did:"报了一个比现薪涨20%的数，HR立刻答应，表情过于爽快。",result:"入职后从同事口中得知，同岗位比我高30%。涨薪窗口要等一年。",again:"反问「这个岗位的薪资带宽是多少」；报一个区间而非单点；让HR先出价。",warning:"没做市场薪酬调研；被问时第一反应是「赶紧答完」；报了底线而非锚点。",comments:[{n:"匿名·猎头",a:"🦊",t:"谁先报数谁吃亏，这是谈判铁律。"}]},
{id:13,scene:"远程",mood:"尴尬",emoji:"🎥",title:"视频会议忘关麦，全家吵架被全公司听见",brief:"远程会议我轮不到发言，去厨房倒水，没意识到麦还开着",people:689,date:"2025-01-08",situation:"全员视频会议，我发言完毕后以为麦自动关了，去厨房倒水。",did:"和家人为「谁洗碗」吵了两分钟，全程被会议麦直播。",result:"同事在群里刷「精彩」。领导会后单独提醒「注意会议礼仪」。半年后被当段子提起。",again:"发言完主动点静音；除非要说话，否则默认静音；戴耳机避免环境音泄露。",warning:"以为「不说话就不会传声」；没养成「说完即静音」的肌肉记忆。",comments:[{n:"匿名·远程两年",a:"🦉",t:"默认静音是远程第一原则，没有例外。"}]},
{id:14,scene:"出差",mood:"后怕",emoji:"✈️",title:"报销单贴错发票，差点被认定虚报",brief:"出差回来报销，把私人聚餐发票混进了差旅报销单",people:256,date:"2025-03-18",situation:"出差一周回来报销，把几十张发票一股脑贴上去，没逐张核对。",did:"一张私人聚餐的发票混了进去，金额800元。",result:"财务审核发现，退回并标记「疑似虚报」。直属领导找我谈话，差点上诚信档案。",again:"报销前逐张核对发票抬头、日期、金额；私人费用单独标记不混入；保留行程对照表。",warning:"图省事一次性贴票；没区分「商务」和「私人」；以为财务不会细看。",comments:[{n:"匿名·财务",a:"🐱",t:"财务看的比你想的细，800元不值得赌上诚信。"}]},
{id:15,scene:"管理",mood:"后悔",emoji:"👔",title:"我在群里当众批评下属，他第二天提了离职",brief:"下属犯了低级错误，我在部门群直接点名批评",people:478,date:"2025-04-26",situation:"下属在客户邮件里写错了报价，我气头上在部门群@他点名批评。",did:"用了「这种低级错误」「是不是没带脑子」这种措辞，群里20个人看着。",result:"下属第二天提了离职，HR调查后认为我管理方式有问题，扣了我季度管理分。",again:"私下1对1沟通，对事不对人；公开场合只表扬，批评永远私下；先问原因再下判断。",warning:"把情绪宣泄当成了管理手段；当众批评等于公开处刑；没给对方解释机会。",comments:[{n:"匿名·HRBP",a:"🐯",t:"公开表扬，私下批评，这是管理第一课。"}]},
{id:16,scene:"汇报",mood:"后怕",emoji:"📤",title:"把内部数据截图发到了客户群",brief:"客户问数据，我随手截了内部看板发过去，里面有竞对分析",people:367,date:"2025-05-09",situation:"客户在群里问某个指标，我顺手截了内部数据看板发过去。",did:"截图里除了客户问的指标，还有「竞对分析」「内部成本」两个tab的内容。",result:"客户截图保存。法务介入，差点触发保密协议违约。被记重大失误。",again:"截图前先裁剪只保留必要信息；内部数据用文字转述而非截图；敏感数据加水印。",warning:"截图不裁剪是本能疏忽；没意识到「看板」本身就是机密；图快没走脱敏流程。",comments:[{n:"匿名·法务",a:"🐲",t:"截图一旦发出就不可撤回，先裁剪再发送。"}]},
{id:17,scene:"沟通",mood:"尴尬",emoji:"💬",title:"吐槽老板的消息，发到了有老板的群",brief:"和同事吐槽领导，结果发错了群，领导就在那个群里",people:923,date:"2025-02-20",situation:"想发给同组同事吐槽领导刚开的无聊会议，内容是「又开两小时废话会」。",did:"发到了「项目协调群」，领导也在群里。等我发现时已经过了2分钟撤回时限。",result:"领导没当场回复，但下一周排期我被打包了三个最难的活。",again:"吐槽只在当面或电话里说；微信群里不发任何关于第三方的负面评价；发前看群名。",warning:"同时开了多个群窗口；习惯性从最近聊天往上点；没核对群名头像。",comments:[{n:"匿名·产品",a:"🐼",t:"微信群里没有秘密，包括撤回的也有截图风险。"}]},
{id:18,scene:"技术",mood:"后怕",emoji:"💥",title:"git push -f 覆盖了同事两天的提交",brief:"想强推自己的分支，结果推到了master，覆盖了同事的代码",people:445,date:"2025-03-05",situation:"本地分支落后于远程，我想图省事直接 force push。",did:"git push -f 时没看分支名，把master上的同事提交覆盖了。",result:"同事两天的工作差点丢失，靠reflog找回。CTO在群里发了「禁用force push」公告。",again:"force push前二次确认分支名；master/main分支加保护规则；用rebase替代force push。",warning:"图省事没pull rebase；没看分支提示；没开启分支保护。",comments:[{n:"匿名·架构师",a:"🦉",t:"分支保护规则该开就开，别省那点时间。"}]},
{id:19,scene:"面试",mood:"尴尬",emoji:"🤔",title:"反问环节问「公司加班多吗」，面试凉了",brief:"面试官问「你有什么想问我的吗」，我问了加班和福利",people:612,date:"2025-01-15",situation:"面试官最后问「你有什么想问我的吗」，我没准备。",did:"脱口问「公司平时加班多吗」「年假几天」「有没有餐补」。",result:"面试官表情微妙，草草结束。一周后收到感谢信，理由是「价值观不太匹配」。",again:"准备3个问题：团队结构、业务挑战、岗位成长路径；福利问题留给HR谈offer阶段。",warning:"把反问当成了「问清楚待遇」的机会；没准备意味着「对这个岗位不感兴趣」。",comments:[{n:"匿名·面试官",a:"🦊",t:"反问环节考的是「你有多想加入」，不是答疑时间。"}]},

/* ====================== 存储 ====================== */
function getLikes(){return JSON.parse(localStorage.getItem("wfl_likes")||"{}");}
function getLiked(){return JSON.parse(localStorage.getItem("wfl_liked")||"[]");}
function getFavs(){return JSON.parse(localStorage.getItem("wfl_favs")||"[]");}
function setFavs(a){localStorage.setItem("wfl_favs",JSON.stringify(a));}
function likeBase(id){return Math.floor(CASES.find(c=>c.id===id).people/400);}
function likeCount(id){return (getLikes()[id]||0)+likeBase(id);}

/* ====================== Toast ====================== */
const toastEl=document.getElementById("toast");
let toastTimer=null;
function showToast(msg){toastEl.textContent=msg;toastEl.classList.add("show");if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove("show"),1800);}

/* ====================== 档案渲染 ====================== */
const SCENES=["全部","面试","汇报","沟通","技术","晋升","离职","邮件","薪资","远程","出差","管理","维权"];
const MOODS=["全部","尴尬","后悔","后怕","释然","愤怒"];
let curScene="全部",curMood="全部",showCount=8,curSort="hot",curSearch="";

const grid=document.getElementById("cardGrid");
const emptyHint=document.getElementById("emptyHint");
const sceneChips=document.getElementById("sceneChips");
const moodChips=document.getElementById("moodChips");

function buildChips(container,arr,onPick){
  container.innerHTML="";
  arr.forEach((t,i)=>{
    const c=document.createElement("button");
    c.className="chip"+(i===0?" active":"");
    c.textContent=t;
    c.onclick=()=>{container.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));c.classList.add("active");onPick(t);};
    container.appendChild(c);
  });
}
buildChips(sceneChips,SCENES,t=>{curScene=t;showCount=8;renderCards();});
buildChips(moodChips,MOODS,t=>{curMood=t;showCount=8;renderCards();});

document.getElementById("sortGroup").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON")return;
  document.querySelectorAll("#sortGroup .chip").forEach(x=>x.classList.remove("active"));
  e.target.classList.add("active");
  curSort=e.target.dataset.sort;showCount=8;renderCards();
});
document.getElementById("searchInput").addEventListener("input",e=>{curSearch=e.target.value.trim().toLowerCase();showCount=8;renderCards();});

function filtered(){
  let list=CASES.filter(c=>{
    if(curScene!=="全部"&&c.scene!==curScene) return false;
    if(curMood!=="全部"&&c.mood!==curMood) return false;
    if(curSearch){
      const hay=(c.title+" "+c.brief+" "+c.situation+" "+c.did+" "+c.scene+" "+c.mood).toLowerCase();
      if(!hay.includes(curSearch)) return false;
    }
    return true;
  });
  if(curSort==="hot") list.sort((a,b)=>b.people-a.people);
  else if(curSort==="new") list.sort((a,b)=>new Date(b.date)-new Date(a.date));
  else if(curSort==="people") list.sort((a,b)=>b.people-a.people);
  return list;
}

function moodEmoji(m){return {后悔:"😤",尴尬:"😳",后怕:"😰",释然:"😮‍💨",愤怒:"😡"}[m]||"";}

function renderComments(c){
  if(!c.comments||c.comments.length===0) return "";
  return '<div class="comments"><h5>💬 匿名同行评论</h5>'+c.comments.map(cm=>'<div class="cmt"><div class="av">'+cm.a+'</div><div class="body"><div class="name">'+cm.n+'</div><div class="txt">'+cm.t+'</div></div></div>').join("")+'</div>';
}

function renderCards(){
  const list=filtered();
  const view=list.slice(0,showCount);
  grid.innerHTML="";
  if(view.length===0){emptyHint.style.display="block";document.getElementById("loadMore").style.display="none";return;}
  emptyHint.style.display="none";
  document.getElementById("loadMore").style.display = view.length<list.length ? "block":"none";
  const favs=getFavs();
  view.forEach(c=>{
    const el=document.createElement("article");
    el.className="card";
    const isFav=favs.includes(c.id);
    el.innerHTML='<div class="emoji">'+c.emoji+'</div>'
      +'<span class="fav-star '+(isFav?"on":"")+'" data-fav="'+c.id+'">'+(isFav?"⭐":"☆")+'</span>'
      +'<span class="tag">📌 '+c.scene+'</span>'
      +'<h3>'+c.title+'</h3>'
      +'<div class="count">👥 '+c.people.toLocaleString()+' 人也搞砸过</div>'
      +'<div class="meta"><span>'+moodEmoji(c.mood)+' '+c.mood+'</span><span class="dot">·</span><span>'+c.date+'</span></div>'
      +'<div class="actions"><button class="ex">展开详情</button><button class="same">看同类</button></div>'
      +'<div class="detail">'
      +'<div class="block"><h4>当时情况</h4><p>'+c.situation+'</p></div>'
      +'<div class="block"><h4>我做了什么</h4><p>'+c.did+'</p></div>'
      +'<div class="block warn"><h4>后果</h4><p>'+c.result+'</p></div>'
      +'<div class="block again"><h4>如果重来</h4><p>'+c.again+'</p></div>'
      +'<div class="block"><h4>预警信号</h4><p>'+c.warning+'</p></div>'
      +'<div class="foot"><span class="mood '+c.mood+'">'+moodEmoji(c.mood)+' '+c.mood+'</span>'
      +'<span style="color:var(--txt-mute);font-size:13px">同类错事：'+c.people.toLocaleString()+' 人</span>'
      +'<button class="like-btn" data-id="'+c.id+'">我也搞砸过 👍 <span class="lc">'+likeCount(c.id)+'</span></button></div>'
      +renderComments(c)+'</div>';
    el.querySelector(".ex").onclick=()=>{el.classList.toggle("open");el.querySelector(".ex").textContent=el.classList.contains("open")?"收起":"展开详情";};
    el.querySelector(".same").onclick=()=>{
      curScene=c.scene;curMood="全部";curSearch="";showCount=8;
      document.getElementById("searchInput").value="";
      sceneChips.querySelectorAll(".chip").forEach((x,i)=>x.classList.toggle("active",SCENES[i]===c.scene));
      moodChips.querySelectorAll(".chip").forEach((x,i)=>x.classList.toggle("active",i===0));
      renderCards();window.scrollTo({top:0,behavior:"smooth"});
    };
    el.querySelector(".like-btn").onclick=(e)=>{e.stopPropagation();toggleLike(c.id,el.querySelector(".like-btn"),el.querySelector(".lc"));};
    el.querySelector(".fav-star").onclick=(e)=>{e.stopPropagation();toggleFav(c.id,el.querySelector(".fav-star"));};
    grid.appendChild(el);
  });
}

function toggleLike(id,btn,lcEl){
  const m=getLikes(),liked=getLiked();
  if(liked.includes(id)){m[id]=(m[id]||1)-1;liked.splice(liked.indexOf(id),1);btn.classList.remove("liked");}
  else{m[id]=(m[id]||0)+1;liked.push(id);btn.classList.add("liked");showToast("已记录，你的搞砸时刻不再孤单");}
  localStorage.setItem("wfl_likes",JSON.stringify(m));
  localStorage.setItem("wfl_liked",JSON.stringify(liked));
  lcEl.textContent=likeCount(id);
}

function toggleFav(id,star){
  let favs=getFavs();
  if(favs.includes(id)){favs=favs.filter(x=>x!==id);star.classList.remove("on");star.textContent="☆";showToast("已取消收藏");}
  else{favs.push(id);star.classList.add("on");star.textContent="⭐";showToast("已收藏，随时复盘");}
  setFavs(favs);
  if(document.getElementById("pageFav").classList.contains("active")) renderFav();
}

function renderRank(){
  const list=[...CASES].sort((a,b)=>b.people-a.people).slice(0,6);
  const ol=document.getElementById("rankList");
  ol.innerHTML=list.map(c=>'<li data-id="'+c.id+'"><span class="t">'+c.emoji+' '+c.title+'</span><span class="n">'+c.people.toLocaleString()+' 人</span></li>').join("");
  ol.querySelectorAll("li").forEach(li=>{
    li.onclick=()=>{
      const id=+li.dataset.id;const c=CASES.find(x=>x.id===id);
      curScene=c.scene;curMood="全部";curSearch="";showCount=8;
      document.getElementById("searchInput").value="";
      sceneChips.querySelectorAll(".chip").forEach((x,i)=>x.classList.toggle("active",SCENES[i]===c.scene));
      moodChips.querySelectorAll(".chip").forEach((x,i)=>x.classList.toggle("active",i===0));
      renderCards();
      setTimeout(()=>{
        const card=[...document.querySelectorAll("#cardGrid .card")].find(el=>el.querySelector("h3").textContent===c.title);
        if(card){card.classList.add("open");card.querySelector(".ex").textContent="收起";card.scrollIntoView({behavior:"smooth",block:"center"});}
      },80);
    };
  });
}

document.getElementById("loadMore").onclick=()=>{showCount+=8;renderCards();};

/* ====================== 收藏页 ====================== */
function renderFav(){
  const favs=getFavs();
  const area=document.getElementById("favArea");
  if(favs.length===0){
    area.innerHTML='<div class="fav-empty-state"><div style="font-size:40px;margin-bottom:10px">⭐</div>还没有收藏的错事。<br>去档案页点击卡片右上角的 ☆，把想反复提醒自己的坑收藏起来。</div>';
    return;
  }
  const list=favs.map(id=>CASES.find(c=>c.id===id)).filter(Boolean);
  area.innerHTML='<div class="grid" id="favGrid"></div>';
  const fg=document.getElementById("favGrid");
  list.forEach(c=>{
    const el=document.createElement("article");
    el.className="card";
    el.innerHTML='<div class="emoji">'+c.emoji+'</div>'
      +'<span class="fav-star on" data-fav="'+c.id+'">⭐</span>'
      +'<span class="tag">📌 '+c.scene+'</span>'
      +'<h3>'+c.title+'</h3>'
      +'<div class="count">👥 '+c.people.toLocaleString()+' 人也搞砸过</div>'
      +'<div class="meta"><span>'+moodEmoji(c.mood)+' '+c.mood+'</span><span class="dot">·</span><span>'+c.date+'</span></div>'
      +'<div class="actions"><button class="ex">展开详情</button></div>'
      +'<div class="detail">'
      +'<div class="block"><h4>当时情况</h4><p>'+c.situation+'</p></div>'
      +'<div class="block"><h4>我做了什么</h4><p>'+c.did+'</p></div>'
      +'<div class="block warn"><h4>后果</h4><p>'+c.result+'</p></div>'
      +'<div class="block again"><h4>如果重来</h4><p>'+c.again+'</p></div>'
      +'<div class="block"><h4>预警信号</h4><p>'+c.warning+'</p></div></div>';
    el.querySelector(".ex").onclick=()=>{el.classList.toggle("open");el.querySelector(".ex").textContent=el.classList.contains("open")?"收起":"展开详情";};
    el.querySelector(".fav-star").onclick=()=>toggleFav(c.id,el.querySelector(".fav-star"));
    fg.appendChild(el);
  });
}

/* ====================== 演练 ====================== */
const quizArea=document.getElementById("quizArea");
let qIdx=0,qRight=0,qWrong=[],qStart=0,qTimer=null,qAnswered=false;

function renderQuizIntro(){
  quizArea.innerHTML='<div class="quiz-intro">'
    +'<h2>🧠 职场存活能力测试</h2>'
    +'<p>8 道基于真实错事改编的情景题，覆盖汇报、沟通、技术、管理、薪资谈判等场景。选择后会看到同类案例的真实反馈数据。</p>'
    +'<div class="meta-row"><span>📋 '+QUIZ.length+' 道题</span><span>⏱ 约 5-8 分钟</span><span>📊 难度分级</span><span>🔁 可重复作答</span></div>'
    +'<button class="btn" id="startQuiz">开始演练</button></div>';
  document.getElementById("startQuiz").onclick=startQuiz;
}

function startQuiz(){
  qIdx=0;qRight=0;qWrong=[];qStart=Date.now();
  renderQuiz();
}

function renderQuiz(){
  if(qIdx>=QUIZ.length){renderResult();return;}
  qAnswered=false;
  const q=QUIZ[qIdx];
  const pct=Math.round((qIdx)/QUIZ.length*100);
  quizArea.innerHTML='<div class="quiz-card">'
    +'<div class="quiz-head"><span class="idx">📋 场景 #'+(qIdx+1)+' · '+q.scene+'</span><span class="diff '+q.diff+'">'+q.diff+'</span><span class="timer" id="timer">⏱ 00:00</span></div>'
    +'<div class="progress"><span style="width:'+pct+'%"></span></div>'
    +'<div class="scenario">'+q.emoji+' '+q.story+'</div>'
    +'<div class="q-title">如果是你，你会？</div>'
    +'<div class="opts" id="opts"></div>'
    +'<div class="feedback" id="fb"></div>'
    +'<div class="quiz-foot"><button class="btn ghost" id="backArchive">返回档案</button><button class="btn" id="nextQ" style="display:none">'+(qIdx===QUIZ.length-1?"查看结果":"下一题")+'</button></div></div>';
  const opts=document.getElementById("opts");
  q.options.forEach(o=>{
    const b=document.createElement("div");
    b.className="opt";
    b.innerHTML='<span class="key">'+o.key+'</span><span>'+o.text+'</span>';
    b.onclick=()=>pickAnswer(o,b);
    opts.appendChild(b);
  });
  document.getElementById("backArchive").onclick=()=>{if(qTimer)clearInterval(qTimer);switchPage("archive");};
  document.getElementById("nextQ").onclick=()=>{if(qIdx<QUIZ.length-1){qIdx++;renderQuiz();}else renderResult();};
  if(qTimer)clearInterval(qTimer);
  qTimer=setInterval(()=>{
    const t=document.getElementById("timer");if(!t)return;
    const s=Math.floor((Date.now()-qStart)/1000);
    t.textContent="⏱ "+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  },500);
}

function pickAnswer(o,el){
  if(qAnswered)return; qAnswered=true;
  const q=QUIZ[qIdx];
  const opts=document.querySelectorAll(".opt");
  opts.forEach(x=>x.classList.add("disabled"));
  if(o.best){el.classList.add("correct");qRight++;}
  else{
    el.classList.add("wrong");qWrong.push({scene:q.scene,story:q.story,you:o.text,correct:q.options.find(op=>op.best).text});
    opts.forEach(x=>{if(x.querySelector(".key").textContent===q.options.find(op=>op.best).key) x.classList.add("correct");});
  }
  const fb=document.getElementById("fb");
  fb.innerHTML='<h4>📊 基于真实案例的选择反馈</h4>'
    +q.stats.map(s=>'<div class="stat-row '+(s.best?"best":"")+'"><span>'+s.label+'</span><span>'+s.value+'</span></div>').join("")
    +'<div class="tip"><b>💡 关键技巧：</b>'+q.tip+'</div>';
  fb.classList.add("show");
  document.getElementById("nextQ").style.display="block";
  if(qIdx===QUIZ.length-1) document.getElementById("nextQ").textContent="查看结果";
}

function renderResult(){
  if(qTimer)clearInterval(qTimer);
  const total=QUIZ.length;
  const pct=Math.round(qRight/total*100);
  const used=Math.floor((Date.now()-qStart)/1000);
  const usedStr=String(Math.floor(used/60)).padStart(2,"0")+":"+String(used%60).padStart(2,"0");
  let level,big,msg;
  if(pct>=80){level="职场老司机";big="🏆";msg="你已经在无数次踩坑中练就了雷达，能避开大多数职场陷阱。继续把经验分享给新人吧。";}
  else if(pct>=60){level="稳健中坚";big="💪";msg="你的职场直觉不错，但在高压场景下还需要再稳一点。多翻翻错事档案，查漏补缺。";}
  else if(pct>=40){level="仍在成长";big="🌱";msg="你踩的坑还不够多——这是好事。建议把每个错事档案都展开读一遍，提前给自己装上避雷针。";}
  else {level="高危新人";big="⚠️";msg="别慌，每个老司机都从这里走过。强烈建议先通读全部档案，把别人的血泪变成你的护甲。"}
  let reviewHtml="";
  if(qWrong.length>0){
    reviewHtml='<div class="review-list"><h4>📝 错题回顾（'+qWrong.length+' 道需要复盘）</h4>'
      +qWrong.map(w=>'<div class="review-item"><div class="ri-t">'+w.scene+'：'+w.story+'</div><div class="ri-y">❌ 你的选择：'+w.you+'</div><div class="ri-c">✅ 参考答案：'+w.correct+'</div></div>').join("")
      +'</div>';
  }
  quizArea.innerHTML='<div class="quiz-card"><div class="result">'
    +'<div class="big">'+big+'</div>'
    +'<h2>'+level+'</h2>'
    +'<div class="score">'+qRight+' / '+total+' · '+pct+'%</div>'
    +'<div class="time-used">⏱ 用时 '+usedStr+' · 错题 '+qWrong.length+' 道</div>'
    +'<p>'+msg+'</p>'
    +'<div class="share-card">'
    +'<div class="row"><span>测评结果</span><b>'+level+'</b></div>'
    +'<div class="row"><span>正确率</span><b>'+pct+'%</b></div>'
    +'<div class="row"><span>用时</span><b>'+usedStr+'</b></div>'
    +'<div class="row"><span>来源</span><b>职场错事本</b></div>'
    +'</div>'
    +reviewHtml
    +'<div class="actions"><button class="btn" id="redo">再测一次</button><button class="btn ghost" id="toArc">去看错事档案</button></div>'
    +'</div></div>';
  document.getElementById("redo").onclick=()=>{qIdx=0;qRight=0;qWrong=[];qStart=Date.now();renderQuiz();};
  document.getElementById("toArc").onclick=()=>switchPage("archive");
}

/* ====================== 页面切换 ====================== */
function switchPage(name){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("navArchive").classList.toggle("active",name==="archive");
  document.getElementById("navQuiz").classList.toggle("active",name==="quiz");
  document.getElementById("navFav").classList.toggle("active",name==="fav");
  document.getElementById(name==="archive"?"pageArchive":name==="quiz"?"pageQuiz":"pageFav").classList.add("active");
  document.querySelectorAll(".bottom-tab button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));
  window.scrollTo({top:0,behavior:"smooth"});
  if(name==="fav") renderFav();
  if(name==="quiz" && !qAnswered && qIdx===0 && qRight===0) renderQuizIntro();
}
document.getElementById("navArchive").onclick=()=>switchPage("archive");
document.getElementById("navQuiz").onclick=()=>switchPage("quiz");
document.getElementById("navFav").onclick=()=>switchPage("fav");

/* 底部Tab（移动端） */
document.querySelectorAll(".bottom-tab button").forEach(b=>{
  b.onclick=()=>{
    if(b.dataset.tab==="theme"){toggleTheme();return;}
    switchPage(b.dataset.tab);
  };
});

/* 主题切换 */
function toggleTheme(){
  const isLight=document.documentElement.classList.toggle("light");
  document.getElementById("themeBtn").textContent=isLight?"☀️":"🌙";
  localStorage.setItem("wfl_theme",isLight?"light":"dark");
}
document.getElementById("themeBtn").onclick=toggleTheme;
if(localStorage.getItem("wfl_theme")==="light"){document.documentElement.classList.add("light");document.getElementById("themeBtn").textContent="☀️";}

/* 分享按钮 */
document.getElementById("shareBtn").onclick=()=>{
  alert("📝 分享入口（Demo）\n\n感谢你愿意把自己的「搞砸时刻」公开出来。\n正式版将支持匿名提交，经审核后进入档案流。\n\n——让每一次搞砸，都变成别人的避雷针。");
};

/* ====================== 初始化 ====================== */
document.getElementById("stTotal").textContent=CASES.length;
document.getElementById("stPeople").textContent=CASES.reduce((s,c)=>s+c.people,0).toLocaleString();
document.getElementById("stScenes").textContent=new Set(CASES.map(c=>c.scene)).size;
renderCards();
renderRank();
renderQuizIntro();
</script>
