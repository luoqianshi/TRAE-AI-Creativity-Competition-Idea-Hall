<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花开远方·文学知识小达人</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--coral:#FF6B6B;--teal:#4ECDC4;--gold:#FFE66D;--coral-light:#FF8E8E;--teal-light:#7EDDD6;--gold-light:#FFF0A0;--bg:#FFF8F0;--text:#2C3E50;--text-light:#7F8C8D;--white:#FFFFFF;--shadow:0 4px 20px rgba(0,0,0,0.08);--radius:16px;--radius-sm:10px}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.app{max-width:800px;margin:0 auto;padding:16px;min-height:100vh}
.header{background:linear-gradient(135deg,var(--coral),var(--gold));border-radius:var(--radius);padding:20px 24px;margin-bottom:20px;color:var(--white);text-align:center;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 60%);animation:headerShine 6s ease-in-out infinite}
@keyframes headerShine{0%,100%{transform:translate(0,0)}50%{transform:translate(10%,10%)}}
.header h1{font-size:1.6em;font-weight:800;position:relative;z-index:1;text-shadow:2px 2px 4px rgba(0,0,0,0.1)}
.header p{font-size:0.9em;opacity:0.9;margin-top:4px;position:relative;z-index:1}
.header .user-info{position:absolute;top:12px;right:16px;font-size:0.8em;opacity:0.9;z-index:1;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 28px;border:none;border-radius:50px;font-size:1em;font-weight:700;cursor:pointer;transition:all 0.3s ease;text-decoration:none;gap:8px}
.btn:active{transform:scale(0.96)}
.btn-primary{background:linear-gradient(135deg,var(--coral),var(--coral-light));color:var(--white);box-shadow:0 4px 15px rgba(255,107,107,0.3)}
.btn-primary:hover{box-shadow:0 6px 20px rgba(255,107,107,0.4);transform:translateY(-2px)}
.btn-secondary{background:linear-gradient(135deg,var(--teal),var(--teal-light));color:var(--white);box-shadow:0 4px 15px rgba(78,205,196,0.3)}
.btn-secondary:hover{box-shadow:0 6px 20px rgba(78,205,196,0.4);transform:translateY(-2px)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--text);box-shadow:0 4px 15px rgba(255,230,109,0.3)}
.btn-gold:hover{box-shadow:0 6px 20px rgba(255,230,109,0.4);transform:translateY(-2px)}
.btn-outline{background:transparent;border:2px solid var(--coral);color:var(--coral)}
.btn-outline:hover{background:var(--coral);color:var(--white)}
.btn-sm{padding:8px 18px;font-size:0.85em}
.btn-block{width:100%}
.card{background:var(--white);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:16px}
.card:hover{transform:translateY(-2px)}
.card-title{font-size:1.2em;font-weight:700;margin-bottom:12px;color:var(--coral)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-weight:600;margin-bottom:6px;font-size:0.9em;color:var(--text)}
.form-group input{width:100%;padding:12px 16px;border:2px solid #E8E8E8;border-radius:var(--radius-sm);font-size:1em;transition:border-color 0.3s;outline:none}
.form-group input:focus{border-color:var(--coral)}
.form-group input.error{border-color:var(--coral);animation:shake 0.4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.login-box{max-width:400px;margin:60px auto;text-align:center}
.login-box .logo{font-size:3em;margin-bottom:10px}
.login-box h2{color:var(--coral);margin-bottom:8px}
.login-box p{color:var(--text-light);margin-bottom:24px;font-size:0.9em}
.login-tabs{display:flex;margin-bottom:20px;border-radius:50px;overflow:hidden;border:2px solid var(--coral)}
.login-tab{flex:1;padding:10px;text-align:center;cursor:pointer;font-weight:600;transition:all 0.3s;background:var(--white);color:var(--coral)}
.login-tab.active{background:var(--coral);color:var(--white)}
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.course-card{background:var(--white);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:all 0.3s;border:3px solid transparent;position:relative;overflow:hidden}
.course-card:hover{transform:translateY(-4px);box-shadow:0 8px 25px rgba(0,0,0,0.12)}
.course-card .course-num{font-size:1.8em;font-weight:800;background:linear-gradient(135deg,var(--coral),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.course-card .course-title{font-size:0.8em;color:var(--text-light);margin-top:4px;line-height:1.3}
.course-card .badge-icon{position:absolute;top:6px;right:6px;font-size:1.2em}
.course-card.completed{border-color:var(--teal)}
.course-card.completed::after{content:'✓';position:absolute;top:6px;left:6px;background:var(--teal);color:white;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.8em;font-weight:700}
.course-card.badged{border-color:var(--gold);background:linear-gradient(135deg,#FFFDF0,#FFF8E0)}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.quiz-progress{font-size:0.9em;color:var(--text-light)}
.quiz-progress-bar{height:6px;background:#E8E8E8;border-radius:3px;overflow:hidden;margin-bottom:20px}
.quiz-progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--coral),var(--gold));border-radius:3px;transition:width 0.5s ease}
.quiz-question{font-size:1.15em;font-weight:600;margin-bottom:20px;line-height:1.6}
.quiz-options{display:flex;flex-direction:column;gap:10px}
.quiz-option{padding:14px 18px;border:2px solid #E8E8E8;border-radius:var(--radius-sm);cursor:pointer;transition:all 0.3s;font-size:0.95em;background:var(--white)}
.quiz-option:hover{border-color:var(--coral);background:#FFF5F5}
.quiz-option.selected{border-color:var(--coral);background:#FFE8E8}
.quiz-option.correct{border-color:var(--teal);background:#E8FFF8;animation:pulse 0.5s ease}
.quiz-option.wrong{border-color:var(--coral);background:#FFE8E8;animation:shake 0.4s ease}
.quiz-option.disabled{cursor:default;opacity:0.7}
.quiz-option .option-label{font-weight:700;margin-right:8px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.result-box{text-align:center;padding:20px 0}
.result-score{font-size:3em;font-weight:800;background:linear-gradient(135deg,var(--coral),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-label{font-size:1em;color:var(--text-light);margin:4px 0 16px}
.result-detail{margin:16px 0;text-align:left}
.result-detail .q-item{padding:12px;border-radius:var(--radius-sm);margin-bottom:8px;background:#F8F8F8}
.result-detail .q-item.correct{border-left:4px solid var(--teal)}
.result-detail .q-item.wrong{border-left:4px solid var(--coral)}
.result-detail .q-item .q-text{font-weight:600;margin-bottom:4px}
.result-detail .q-item .q-explain{font-size:0.85em;color:var(--text-light);margin-top:4px;padding:8px;background:var(--white);border-radius:6px}
.result-detail .q-item .q-tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:0.75em;background:var(--gold-light);color:var(--text);margin-top:4px}
.wrong-list .wrong-item{padding:14px;border-radius:var(--radius-sm);margin-bottom:10px;background:#FFF5F5;border-left:4px solid var(--coral)}
.wrong-list .wrong-item .w-q{font-weight:600;margin-bottom:6px}
.wrong-list .wrong-item .w-answer{font-size:0.85em;color:var(--text-light)}
.wrong-list .wrong-item .w-explain{font-size:0.85em;color:var(--teal);margin-top:4px;padding:8px;background:var(--white);border-radius:6px}
.wrong-list .wrong-item .w-tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:0.75em;background:var(--coral-light);color:white;margin-top:4px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.badge-item{text-align:center;padding:16px 8px;border-radius:var(--radius);background:var(--white);box-shadow:var(--shadow);transition:all 0.3s}
.badge-item .badge-emoji{font-size:2.5em;display:block;margin-bottom:6px}
.badge-item .badge-name{font-size:0.8em;font-weight:600;color:var(--text)}
.badge-item.locked{opacity:0.4;filter:grayscale(1)}
.badge-item.locked .badge-emoji{filter:grayscale(1)}
.badge-item.earned{border:2px solid var(--gold);background:linear-gradient(135deg,#FFFDF0,#FFF8E0)}
.teacher-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--shadow)}
.stat-card .stat-num{font-size:2em;font-weight:800;color:var(--coral)}
.stat-card .stat-label{font-size:0.85em;color:var(--text-light);margin-top:4px}
.student-list .student-item{padding:14px;border-radius:var(--radius-sm);margin-bottom:8px;background:var(--white);box-shadow:var(--shadow);cursor:pointer;transition:all 0.3s}
.student-item:hover{transform:translateX(4px)}
.student-item .s-name{font-weight:700;color:var(--coral)}
.student-item .s-progress{font-size:0.85em;color:var(--text-light);margin-top:4px}
.student-item .s-progress-bar{height:4px;background:#E8E8E8;border-radius:2px;overflow:hidden;margin-top:6px}
.student-item .s-progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--coral),var(--gold));border-radius:2px;transition:width 0.5s}
.course-stats-table{width:100%;border-collapse:collapse;font-size:0.85em}
.course-stats-table th,.course-stats-table td{padding:8px 10px;text-align:center;border-bottom:1px solid #E8E8E8}
.course-stats-table th{background:var(--coral);color:var(--white);font-weight:600}
.course-stats-table tr:nth-child(even){background:#FFF8F0}
.course-stats-table .rate-bar{height:6px;background:#E8E8E8;border-radius:3px;overflow:hidden;min-width:60px}
.course-stats-table .rate-bar .fill{height:100%;border-radius:3px;transition:width 0.5s}
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}
.nav-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;justify-content:center}
.nav-bar .nav-btn{padding:8px 16px;border-radius:50px;border:none;font-size:0.85em;font-weight:600;cursor:pointer;transition:all 0.3s;background:var(--white);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.nav-bar .nav-btn:hover{background:var(--coral);color:var(--white)}
.nav-bar .nav-btn.active{background:var(--coral);color:var(--white)}
.weak-points{padding:12px;border-radius:var(--radius-sm);background:#FFF8F0;margin:12px 0}
.weak-points h4{color:var(--coral);margin-bottom:8px;font-size:0.95em}
.weak-points .wp-item{display:inline-block;padding:4px 12px;border-radius:20px;font-size:0.8em;margin:3px;background:var(--coral-light);color:white}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:50px;font-weight:600;z-index:10000;animation:toastIn 0.3s ease;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.toast.success{background:var(--teal);color:white}
.toast.error{background:var(--coral);color:white}
.toast.info{background:var(--text);color:white}
@keyframes toastIn{0%{opacity:0;transform:translateX(-50%) translateY(-20px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}
@media(max-width:480px){.app{padding:10px}.header h1{font-size:1.2em}.course-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.badge-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.teacher-stats{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.login-box{margin:30px auto}.result-score{font-size:2.5em}}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--coral-light);border-radius:3px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-light)}
.empty-state .empty-icon{font-size:3em;margin-bottom:12px}
.back-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:50px;border:2px solid #E8E8E8;background:var(--white);cursor:pointer;font-size:0.85em;font-weight:600;color:var(--text-light);transition:all 0.3s;margin-bottom:12px}
.back-btn:hover{border-color:var(--coral);color:var(--coral)}
.section-title{font-size:1.1em;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title .emoji{font-size:1.2em}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-tab{padding:6px 14px;border-radius:20px;border:1px solid #E8E8E8;background:var(--white);cursor:pointer;font-size:0.8em;font-weight:600;transition:all 0.3s;color:var(--text-light)}
.filter-tab.active{background:var(--coral);color:var(--white);border-color:var(--coral)}
.filter-tab:hover:not(.active){border-color:var(--coral);color:var(--coral)}
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="app" id="app"></div>
<script>
const courseQuestions = [
  {courseId:1,title:"第1讲 唐宋八大家——苏洵、苏轼和苏辙（上）",badgeName:"三苏小达人",questions:[{q:"下面哪位不是「唐宋八大家」中的人物？",options:["A. 韩愈","B. 柳宗元","C. 杜甫","D. 欧阳修"],answer:2,explain:"杜甫是唐代伟大的现实主义诗人，但不在「唐宋八大家」之列。唐宋八大家是唐代的韩愈、柳宗元，宋代的苏洵、苏轼、苏辙、欧阳修、王安石、曾巩。",tag:"唐宋八大家"},{q:"「三苏」指的是哪三个人？",options:["A. 苏洵、苏轼、苏辙","B. 苏轼、苏辙、苏小妹","C. 苏洵、苏轼、苏小妹","D. 苏洵、苏辙、苏东坡"],answer:0,explain:"「三苏」指的是苏洵、苏轼、苏辙父子三人，他们都是唐宋八大家中的成员。",tag:"三苏"},{q:"苏轼的号是什么？",options:["A. 老泉","B. 东坡居士","C. 颍滨遗老","D. 六一居士"],answer:1,explain:"苏轼字子瞻，号东坡居士。苏洵号老泉，苏辙号颍滨遗老，欧阳修号六一居士。",tag:"苏轼"},{q:"词又被称为诗余和什么？",options:["A. 格律诗","B. 长短句","C. 散曲","D. 乐府"],answer:1,explain:"词是一种能够配合音乐演唱的、句子长短不齐的格律诗，又称诗余和长短句。",tag:"词的基本知识"},{q:"「谁道人生无再少？门前流水尚能西！」出自苏轼的哪首词？",options:["A. 《临江仙·夜归临皋》","B. 《水调歌头·明月几时有》","C. 《浣溪沙》","D. 《江城子·密州出猎》"],answer:2,explain:"这两句出自苏轼的《浣溪沙》，表现了苏轼豁达乐观的生活态度。",tag:"苏轼作品"},{q:"「小舟从此逝，江海寄余生」表达了苏轼怎样的情怀？",options:["A. 悲伤绝望","B. 潇洒旷达","C. 愤怒不平","D. 胆小怕事"],answer:1,explain:"「小舟从此逝，江海寄余生」出自《临江仙·夜归临皋》，表达出潇洒如仙的旷达襟怀。",tag:"苏轼作品"}]},
  {courseId:2,title:"第2讲 唐宋八大家——苏洵、苏轼和苏辙（下）",badgeName:"词坛领袖",questions:[{q:"苏轼是继谁之后北宋文坛的领袖人物？",options:["A. 王安石","B. 欧阳修","C. 曾巩","D. 韩愈"],answer:1,explain:"苏轼是继欧阳修之后北宋文坛的领袖人物，他改变了词的风格，开创了豪放词风。",tag:"苏轼文坛地位"},{q:"「苏门四学士」不包括下面哪一位？",options:["A. 黄庭坚","B. 秦观","C. 晁补之","D. 王安石"],answer:3,explain:"「苏门四学士」是黄庭坚、秦观、晁补之、张耒四人。",tag:"苏门四学士"},{q:"「宋四家」指的是哪四位书法家？",options:["A. 苏轼、黄庭坚、米芾、蔡襄","B. 苏轼、黄庭坚、米芾、欧阳修","C. 苏轼、王安石、黄庭坚、米芾","D. 苏轼、蔡襄、欧阳修、米芾"],answer:0,explain:"「宋四家」即北宋四大书法家：苏轼、蔡襄、黄庭坚、米芾。",tag:"宋四家"},{q:"《江城子·乙卯正月二十日夜记梦》是苏轼写给谁的？",options:["A. 弟弟苏辙","B. 亡妻王弗","C. 朋友","D. 老师欧阳修"],answer:1,explain:"这首词是苏轼写给亡妻王弗的悼亡词。",tag:"苏轼作品"},{q:"「但愿人长久，千里共婵娟」中的「婵娟」指的是什么？",options:["A. 美女","B. 花朵","C. 月亮","D. 星星"],answer:2,explain:"「婵娟」是月亮的别称。出自《水调歌头·明月几时有》。",tag:"苏轼作品"},{q:"「天涯何处无芳草」出自苏轼的哪首词？",options:["A. 《蝶恋花·春景》","B. 《水调歌头》","C. 《江城子·密州出猎》","D. 《浣溪沙》"],answer:0,explain:"「天涯何处无芳草」出自《蝶恋花·春景》。",tag:"苏轼作品"}]},
  {courseId:3,title:"第3讲 唐宋八大家——欧阳修、王安石和曾巩",badgeName:"古文大家",questions:[{q:"欧阳修晚年自号什么？",options:["A. 醉翁","B. 六一居士","C. 半山","D. 南丰先生"],answer:1,explain:"欧阳修字永叔，号醉翁，晚年又号六一居士，谥号「文忠」。",tag:"欧阳修"},{q:"中国历史上第一篇驳论文是哪一篇？",options:["A. 欧阳修《蝶恋花》","B. 王安石《读孟尝君传》","C. 曾巩《墨池记》","D. 王安石《明妃曲》"],answer:1,explain:"王安石的《读孟尝君传》是中国历史上第一篇驳论文。",tag:"王安石"},{q:"曾巩被人们尊称为什么？",options:["A. 半山先生","B. 六一居士","C. 南丰先生","D. 老泉先生"],answer:2,explain:"曾巩字子固，世称「南丰先生」。",tag:"曾巩"},{q:"「月上柳梢头，人约黄昏后」描写的是哪个节日？",options:["A. 中秋节","B. 元宵节","C. 端午节","D. 七夕节"],answer:1,explain:"这两句出自欧阳修的《生查子·元夕》，「元夕」就是元宵节。",tag:"欧阳修作品"},{q:"王安石《明妃曲》中的「明妃」指的是谁？",options:["A. 杨贵妃","B. 王昭君","C. 西施","D. 貂蝉"],answer:1,explain:"「明妃」指的是王昭君。",tag:"王安石作品"},{q:"「泪眼问花花不语，乱红飞过秋千去」出自谁的哪首作品？",options:["A. 欧阳修《蝶恋花》","B. 苏轼《水调歌头》","C. 王安石《明妃曲》","D. 曾巩《墨池记》"],answer:0,explain:"这两句出自欧阳修的《蝶恋花》。",tag:"欧阳修作品"}]},
  {courseId:4,title:"第4讲 陆游（上）",badgeName:"爱国诗圣",questions:[{q:"陆游是什么朝代的诗人？",options:["A. 北宋","B. 南宋","C. 唐代","D. 元代"],answer:1,explain:"陆游是南宋诗人，号放翁。",tag:"陆游"},{q:"陆游一生写了多少首诗？",options:["A. 三千多首","B. 六千多首","C. 九千四百多首","D. 一万多首"],answer:2,explain:"陆游的诗有九千四百多首，是中国古代诗作最多的诗人。",tag:"陆游"},{q:"「出师一表真名世，千载谁堪伯仲间」中的「出师一表」指的是什么？",options:["A. 《出师表》","B. 《陈情表》","C. 《谏太宗十思疏》","D. 《论积贮疏》"],answer:0,explain:"「出师一表」指的是诸葛亮的《出师表》。",tag:"陆游作品"},{q:"「零落成泥碾作尘，只有香如故」出自陆游的哪首词？",options:["A. 《诉衷情》","B. 《卜算子·咏梅》","C. 《钗头凤》","D. 《书愤》"],answer:1,explain:"这两句出自陆游的《卜算子·咏梅》。",tag:"陆游作品"},{q:"「此生谁料，心在天山，身老沧洲」表达了陆游怎样的感情？",options:["A. 快乐满足","B. 壮志未酬的悲愤","C. 悠闲自在","D. 思乡之情"],answer:1,explain:"这句出自陆游的《诉衷情》，表达了壮志未酬的悲愤。",tag:"陆游作品"},{q:"下面哪个不是陆游的称号？",options:["A. 务观","B. 放翁","C. 稼轩","D. 爱国主义诗人"],answer:2,explain:"「稼轩」是辛弃疾的号，不是陆游的。",tag:"陆游"}]},
  {courseId:5,title:"第5讲 陆游（下）",badgeName:"伤心诗人",questions:[{q:"陆游的词风接近哪位词人？",options:["A. 苏轼","B. 李清照","C. 辛弃疾","D. 柳永"],answer:2,explain:"陆游的爱国词风接近辛弃疾，词史上有「辛陆」之称。",tag:"陆游词风"},{q:"下面哪部是陆游的散文代表作？",options:["A. 《漱玉词》","B. 《入蜀记》","C. 《稼轩长短句》","D. 《词论》"],answer:1,explain:"陆游的散文代表作有《入蜀记》和《老学庵笔记》。",tag:"陆游作品"},{q:"《钗头凤·红酥手》写的是陆游和谁的爱情悲剧？",options:["A. 李清照","B. 唐琬","C. 王弗","D. 朝云"],answer:1,explain:"《钗头凤·红酥手》写的是陆游和唐琬的爱情悲剧。",tag:"陆游作品"},{q:"陆游晚年写的《沈园二首》被称为什么？",options:["A. 千古绝唱","B. 绝等伤心之诗","C. 天下第一诗","D. 伤心之作"],answer:1,explain:"陆游晚年的《沈园二首》被称作「绝等伤心之诗」。",tag:"陆游作品"},{q:"「曾是惊鸿照影来」中的「惊鸿」在《沈园二首》中指谁？",options:["A. 一只鸟","B. 唐琬","C. 陆游自己","D. 一位仙女"],answer:1,explain:"「惊鸿」在诗中指唐琬。",tag:"陆游作品"},{q:"词史上有「辛陆」之称，指的是哪两位词人？",options:["A. 辛弃疾和陆游","B. 辛弃疾和陆羽","C. 辛弃疾和陆机","D. 辛弃疾和陆云"],answer:0,explain:"「辛陆」指的是辛弃疾和陆游。",tag:"陆游词风"}]},
  {courseId:6,title:"第6讲 辛弃疾",badgeName:"词坛飞将",questions:[{q:"辛弃疾的号是什么？",options:["A. 幼安","B. 稼轩","C. 放翁","D. 东坡居士"],answer:1,explain:"辛弃疾字幼安，号稼轩。他和苏轼并称「苏辛」。",tag:"辛弃疾"},{q:"辛弃疾的词集叫什么？",options:["A. 《漱玉词》","B. 《稼轩长短句》","C. 《东坡乐府》","D. 《淮海词》"],answer:1,explain:"辛弃疾的词集叫《稼轩长短句》。",tag:"辛弃疾"},{q:"「青山遮不住，毕竟东流去」出自辛弃疾的哪首词？",options:["A. 《青玉案·元夕》","B. 《菩萨蛮》","C. 《破阵子》","D. 《丑奴儿》"],answer:1,explain:"「青山遮不住，毕竟东流去」出自《菩萨蛮》。",tag:"辛弃疾作品"},{q:"《青玉案·元夕》描写的是哪个节日？",options:["A. 中秋节","B. 元宵节","C. 端午节","D. 重阳节"],answer:1,explain:"「元夕」就是元宵节。",tag:"辛弃疾作品"},{q:"辛弃疾曾向朝廷上过哪些策论？",options:["A. 《出师表》《陈情表》","B. 《美芹十论》《九议》","C. 《论积贮疏》《谏太宗十思疏》","D. 《过秦论》《六国论》"],answer:1,explain:"辛弃疾曾向朝廷上过《美芹十论》《九议》等策论。",tag:"辛弃疾"},{q:"《丑奴儿》这首词主要运用了什么手法来写「愁」？",options:["A. 比喻","B. 对比","C. 拟人","D. 排比"],answer:1,explain:"《丑奴儿》运用了对比手法。",tag:"辛弃疾作品"}]},
  {courseId:7,title:"第7讲 李清照",badgeName:"千古第一才女",questions:[{q:"李清照是哪个词派的代表人物？",options:["A. 豪放词派","B. 婉约词派","C. 花间词派","D. 边塞词派"],answer:1,explain:"李清照是婉约词派的代表人物，被称为「千古第一才女」。",tag:"李清照"},{q:"李清照和辛弃疾并称什么？",options:["A. 苏辛","B. 二安","C. 二李","D. 周李"],answer:1,explain:"李清照（易安居士）和辛弃疾（幼安）并称「济南二安」。",tag:"李清照"},{q:"「知否？知否？应是绿肥红瘦」出自李清照的哪首词？",options:["A. 《醉花阴》","B. 《如梦令》","C. 《一剪梅》","D. 《武陵春》"],answer:1,explain:"「知否？知否？应是绿肥红瘦」出自《如梦令》。",tag:"李清照作品"},{q:"「莫道不销魂，帘卷西风，人比黄花瘦」表达了李清照怎样的感情？",options:["A. 思念丈夫","B. 思念家乡","C. 报国无门","D. 孤独寂寞"],answer:0,explain:"这两句出自《醉花阴》，表达了李清照对远方丈夫的思念。",tag:"李清照作品"},{q:"「只恐双溪舴艋舟，载不动许多愁」把「愁」写得怎样？",options:["A. 很轻","B. 很有重量","C. 很漂亮","D. 很甜"],answer:1,explain:"这两句出自《武陵春》，把抽象的「愁」写得有重量。",tag:"李清照作品"},{q:"李清照的词集叫什么？",options:["A. 《漱玉词》","B. 《易安体》","C. 《词论》","D. 《珠玉词》"],answer:0,explain:"李清照的词集叫《漱玉词》。",tag:"李清照"}]},
  {courseId:8,title:"第8讲 其他婉约派词人及作品",badgeName:"婉约词迷",questions:[{q:"北宋婉约词人柳永原名是什么？",options:["A. 柳永","B. 柳三变","C. 柳耆卿","D. 柳屯田"],answer:1,explain:"柳永原名三变。",tag:"柳永"},{q:"「无可奈何花落去，似曾相识燕归来」是谁的名句？",options:["A. 柳永","B. 晏殊","C. 秦观","D. 蒋捷"],answer:1,explain:"这是晏殊的名句。",tag:"晏殊"},{q:"林逋被称为「梅妻鹤子」，这是为什么？",options:["A. 他娶了姓梅的妻子","B. 他以梅为妻、以鹤为子","C. 他喜欢梅花和仙鹤","D. 他养了一只鹤叫梅妻"],answer:1,explain:"林逋一生未娶，以梅为妻、以鹤为子。",tag:"林逋"},{q:"秦观是「苏门四学士」之一，他的号是什么？",options:["A. 山谷道人","B. 淮海居士","C. 后山居士","D. 清真居士"],answer:1,explain:"秦观号淮海居士。",tag:"秦观"},{q:"蒋捷因哪句词被称为「樱桃进士」？",options:["A. 红了樱桃，绿了芭蕉","B. 流光容易把人抛","C. 樱桃好吃树难栽","D. 一树樱桃带雨红"],answer:0,explain:"蒋捷因「流光容易把人抛，红了樱桃，绿了芭蕉」被称为「樱桃进士」。",tag:"蒋捷"},{q:"下面哪位不属于婉约派词人？",options:["A. 柳永","B. 秦观","C. 苏轼","D. 晏几道"],answer:2,explain:"苏轼是豪放词的开创者。",tag:"婉约派"}]},
  {courseId:9,title:"第9讲 其他豪放派词人及作品",badgeName:"豪放少年",questions:[{q:"豪放词的创始人是谁？",options:["A. 辛弃疾","B. 苏轼","C. 范仲淹","D. 岳飞"],answer:1,explain:"豪放词的创始人是苏轼。",tag:"豪放派"},{q:"范仲淹主持过什么改革？",options:["A. 王安石变法","B. 庆历新政","C. 戊戌变法","D. 商鞅变法"],answer:1,explain:"范仲淹主持了「庆历新政」。",tag:"范仲淹"},{q:"岳飞被谁以「莫须有」的罪名杀害？",options:["A. 宋高宗","B. 秦桧","C. 金国","D. 韩世忠"],answer:1,explain:"岳飞被秦桧以「莫须有」的罪名杀害。",tag:"岳飞"},{q:"《满江红·怒发冲冠》代表了岳飞怎样的精神？",options:["A. 归隐山林","B. 精忠报国","C. 儿女情长","D. 伤春悲秋"],answer:1,explain:"《满江红》代表了岳飞「精忠报国」的英雄之志。",tag:"岳飞作品"},{q:"《渔家傲·秋思》抒发了什么感情？",options:["A. 思乡报国的愁情","B. 对秋天的喜爱","C. 对朝廷的不满","D. 隐居的快乐"],answer:0,explain:"《渔家傲·秋思》抒发思乡报国的愁情。",tag:"范仲淹作品"},{q:"岳飞的《小重山》表达了什么感慨？",options:["A. 打了胜仗的喜悦","B. 知音难遇的感慨","C. 归隐田园的快乐","D. 对美景的赞美"],answer:1,explain:"《小重山》表达了岳飞知音难遇的感慨。",tag:"岳飞作品"}]},
  {courseId:10,title:"第10讲 元曲概说和小令选讲",badgeName:"元曲新秀",questions:[{q:"元曲包括哪两部分？",options:["A. 小令和套数","B. 杂剧和散曲","C. 南曲和北曲","D. 戏曲和歌剧"],answer:1,explain:"元曲包括杂剧和散曲两部分。",tag:"元曲"},{q:"「元曲四大家」不包括下面哪位？",options:["A. 关汉卿","B. 白朴","C. 王实甫","D. 马致远"],answer:2,explain:"「元曲四大家」是关汉卿、白朴、马致远、郑光祖。",tag:"元曲四大家"},{q:"马致远的《天净沙·秋思》被誉为什么？",options:["A. 秋思之祖","B. 天下第一曲","C. 千古绝唱","D. 小令之王"],answer:0,explain:"《天净沙·秋思》被誉为「秋思之祖」。",tag:"马致远"},{q:"「兴，百姓苦；亡，百姓苦」出自哪首元曲？",options:["A. 《天净沙·秋思》","B. 《山坡羊·潼关怀古》","C. 《卖花声·怀古》","D. 《窦娥冤》"],answer:1,explain:"这两句出自张养浩的《山坡羊·潼关怀古》。",tag:"元曲名句"},{q:"《天净沙·秋思》抒发的是什么感情？",options:["A. 对秋天的喜爱","B. 游子思念故乡","C. 对战争的厌恶","D. 对朋友的思念"],answer:1,explain:"《天净沙·秋思》抒发了游子思念故乡之情。",tag:"马致远"},{q:"散曲的两种基本形式是什么？",options:["A. 杂剧和散曲","B. 小令和套数","C. 南曲和北曲","D. 诗词和曲赋"],answer:1,explain:"散曲分小令和套数两种基本形式。",tag:"元曲"}]},
  {courseId:11,title:"第11讲 元曲杂剧选讲（上）",badgeName:"杂剧小行家",questions:[{q:"关汉卿被誉为什么？",options:["A. 曲圣","B. 诗圣","C. 词圣","D. 文圣"],answer:0,explain:"关汉卿被誉为「曲圣」。",tag:"关汉卿"},{q:"元杂剧「四大悲剧」不包括下面哪一部？",options:["A. 《窦娥冤》","B. 《汉宫秋》","C. 《西厢记》","D. 《赵氏孤儿》"],answer:2,explain:"元杂剧四大悲剧是《窦娥冤》《汉宫秋》《梧桐雨》《赵氏孤儿》。",tag:"元杂剧"},{q:"元杂剧中，「旦」是指什么角色？",options:["A. 女角色","B. 男角色","C. 丑角","D. 配角"],answer:0,explain:"元杂剧的角色有旦（女角色）、末（男角色）、净、杂等。",tag:"元杂剧"},{q:"窦娥在临刑前发了哪三桩誓愿？",options:["A. 血溅白练、六月飞雪、亢旱三年","B. 天崩地裂、海水倒流、日月无光","C. 血溅白练、天降巨石、三年洪水","D. 六月飞雪、三年洪水、天崩地裂"],answer:0,explain:"窦娥的三桩誓愿是：血溅白练、六月飞雪、亢旱三年。",tag:"窦娥冤"},{q:"《赵氏孤儿》中，谁用自己的孩子换下了赵氏孤儿？",options:["A. 公孙杵臼","B. 程婴","C. 赵盾","D. 屠岸贾"],answer:1,explain:"程婴用自己的孩子换下了赵氏孤儿。",tag:"赵氏孤儿"},{q:"元杂剧中圆括号里的文字叫什么？",options:["A. 唱词","B. 科介","C. 旁白","D. 宾白"],answer:1,explain:"元杂剧中圆括号里的文字叫「科介」，是舞台提示。",tag:"元杂剧"}]},
  {courseId:12,title:"第12讲 元曲杂剧选讲（下）",badgeName:"西厢小书童",questions:[{q:"马致远的杂剧代表作是什么？",options:["A. 《西厢记》","B. 《汉宫秋》","C. 《梧桐雨》","D. 《墙头马上》"],answer:1,explain:"马致远的杂剧代表作是《汉宫秋》。",tag:"马致远"},{q:"王实甫的代表作是什么？",options:["A. 《窦娥冤》","B. 《汉宫秋》","C. 《西厢记》","D. 《倩女离魂》"],answer:2,explain:"王实甫的代表作是《西厢记》。",tag:"王实甫"},{q:"元杂剧「四大爱情剧」不包括下面哪一部？",options:["A. 《西厢记》","B. 《拜月亭》","C. 《窦娥冤》","D. 《墙头马上》"],answer:2,explain:"《窦娥冤》是悲剧。",tag:"元杂剧"},{q:"《汉宫秋》中是谁逃到匈奴挑唆两国关系？",options:["A. 张生","B. 毛延寿","C. 红娘","D. 程婴"],answer:1,explain:"画师毛延寿逃到匈奴挑唆。",tag:"汉宫秋"},{q:"在《西厢记》中，聪明机智的侍女是谁？",options:["A. 崔莺莺","B. 红娘","C. 杜丽娘","D. 春香"],answer:1,explain:"红娘是崔莺莺的侍女，现在「红娘」也指媒人。",tag:"西厢记"},{q:"《汉宫秋》中的两位主人公是谁？",options:["A. 张生和崔莺莺","B. 汉元帝和王昭君","C. 唐明皇和杨贵妃","D. 梁山伯和祝英台"],answer:1,explain:"《汉宫秋》主人公是汉元帝和王昭君。",tag:"汉宫秋"}]},
  {courseId:13,title:"第13讲 古典文学四大名著（上）",badgeName:"名著小学究",questions:[{q:"中国四大名著中，哪一部是第一部长篇章回小说？",options:["A. 《水浒传》","B. 《三国演义》","C. 《西游记》","D. 《红楼梦》"],answer:1,explain:"《三国演义》是中国第一部长篇章回小说。",tag:"四大名著"},{q:"《水浒传》的作者是谁？",options:["A. 罗贯中","B. 施耐庵","C. 吴承恩","D. 曹雪芹"],answer:1,explain:"《水浒传》的作者是施耐庵。",tag:"四大名著"},{q:"在《西游记》中，孙悟空最具反抗精神的事件是什么？",options:["A. 三打白骨精","B. 大闹天宫","C. 真假美猴王","D. 偷吃人参果"],answer:1,explain:"孙悟空最具反抗精神的是大闹天宫。",tag:"西游记"},{q:"《红楼梦》中，「金玉良缘」指的是谁和谁的姻缘？",options:["A. 宝玉和黛玉","B. 宝玉和宝钗","C. 宝玉和湘云","D. 宝玉和妙玉"],answer:1,explain:"「金玉良缘」指贾宝玉和薛宝钗。",tag:"红楼梦"},{q:"贾府四姐妹的名字暗寓什么意思？",options:["A. 春回大地","B. 原应叹息","C. 春风得意","D. 春满人间"],answer:1,explain:"元春、迎春、探春、惜春暗寓「原应叹息」。",tag:"红楼梦"},{q:"唐僧师徒取经成功后，孙悟空被封为什么？",options:["A. 旃檀功德佛","B. 斗战胜佛","C. 净坛使者","D. 金身罗汉"],answer:1,explain:"孙悟空被封为斗战胜佛。",tag:"西游记"}]},
  {courseId:14,title:"第14讲 古典文学四大名著（下）",badgeName:"名著小博士",questions:[{q:"《西游记》是我国第一部什么类型的浪漫主义长篇神魔小说？",options:["A. 历史小说","B. 神魔小说","C. 讽刺小说","D. 爱情小说"],answer:1,explain:"《西游记》是浪漫主义长篇神魔小说。",tag:"西游记"},{q:"曹雪芹，名霑，字梦阮，号什么？",options:["A. 雪芹","B. 梦阮","C. 芹圃","D. 以上都是"],answer:3,explain:"曹雪芹号雪芹、芹圃、芹溪。",tag:"曹雪芹"},{q:"《红楼梦》标志着我国古典长篇小说创作达到了什么高度？",options:["A. 开始起步","B. 一般水平","C. 高峰","D. 低谷"],answer:2,explain:"《红楼梦》标志着古典长篇小说创作达到了高峰。",tag:"红楼梦"},{q:"《西游记》的故事源于什么历史事件？",options:["A. 张骞出使西域","B. 玄奘取经","C. 郑和下西洋","D. 鉴真东渡"],answer:1,explain:"《西游记》源于唐代玄奘取经。",tag:"西游记"},{q:"曹雪芹是什么朝代的作家？",options:["A. 宋代","B. 元代","C. 明代","D. 清代"],answer:3,explain:"曹雪芹是清代作家。",tag:"曹雪芹"},{q:"下面关于四大名著的描述，哪一项是错误的？",options:["A. 《三国演义》是长篇历史小说","B. 《水浒传》反映农民起义","C. 《西游记》是历史小说","D. 《红楼梦》写四大家族兴衰"],answer:2,explain:"《西游记》是神魔小说，不是历史小说。",tag:"四大名著"}]},
  {courseId:15,title:"第15讲 明清其他小说简介",badgeName:"小说小达人",questions:[{q:"「三言」的编著者是谁？",options:["A. 凌濛初","B. 冯梦龙","C. 吴敬梓","D. 蒲松龄"],answer:1,explain:"「三言」是冯梦龙编著的。",tag:"三言"},{q:"「二拍」指的是哪两部作品？",options:["A. 《喻世明言》和《警世通言》","B. 《初刻拍案惊奇》和《二刻拍案惊奇》","C. 《醒世恒言》和《初刻拍案惊奇》","D. 《儒林外史》和《聊斋志异》"],answer:1,explain:"「二拍」是《初刻拍案惊奇》和《二刻拍案惊奇》。",tag:"二拍"},{q:"《儒林外史》是一部什么样的小说？",options:["A. 浪漫主义神魔小说","B. 现实主义长篇讽刺小说","C. 英雄传奇小说","D. 才子佳人小说"],answer:1,explain:"《儒林外史》是现实主义长篇讽刺小说。",tag:"儒林外史"},{q:"蒲松龄的《聊斋志异》是什么体裁的小说集？",options:["A. 白话短篇小说","B. 文言短篇小说","C. 章回体小说","D. 日记体小说"],answer:1,explain:"《聊斋志异》是文言短篇小说的巅峰之作。",tag:"聊斋志异"},{q:"郭沫若评价蒲松龄的哪句话最准确？",options:["A. 诗中有画，画中有诗","B. 写鬼写妖高人一等，刺贪刺虐入骨三分","C. 笔落惊风雨，诗成泣鬼神","D. 清水出芙蓉，天然去雕饰"],answer:1,explain:"郭沫若评价蒲松龄「写鬼写妖高人一等，刺贪刺虐入骨三分」。",tag:"聊斋志异"},{q:"《范进中举》中范进得知中举后怎么了？",options:["A. 大哭一场","B. 喜极而疯","C. 离家出走","D. 默默不语"],answer:1,explain:"范进喜极而疯，讽刺了科举制度。",tag:"儒林外史"}]},
  {courseId:16,title:"第16讲 鲁迅",badgeName:"文学小斗士",questions:[{q:"鲁迅的原名是什么？",options:["A. 周作人","B. 周树人","C. 周建人","D. 周豫才"],answer:1,explain:"鲁迅原名周树人，字豫才。",tag:"鲁迅"},{q:"中国现代文学史上第一篇白话文小说是什么？",options:["A. 《孔乙己》","B. 《阿Q正传》","C. 《狂人日记》","D. 《祝福》"],answer:2,explain:"《狂人日记》是中国现代文学史上第一篇白话文小说。",tag:"鲁迅作品"},{q:"鲁迅的《朝花夕拾》是一部什么类型的文集？",options:["A. 小说集","B. 散文诗集","C. 回忆性散文集","D. 杂文集"],answer:2,explain:"《朝花夕拾》是回忆性散文集。",tag:"鲁迅作品"},{q:"鲁迅的《孔乙己》揭露了什么制度的残害？",options:["A. 封建科举制度","B. 封建婚姻制度","C. 封建等级制度","D. 封建土地制度"],answer:0,explain:"《孔乙己》揭露了封建科举制度的残害。",tag:"鲁迅作品"},{q:"阿Q的「精神胜利法」不包括下面哪一项？",options:["A. 妄自尊大","B. 自轻自贱","C. 乐于助人","D. 麻木健忘"],answer:2,explain:"阿Q的精神胜利法不包括乐于助人。",tag:"鲁迅作品"},{q:"鲁迅的小说集《呐喊》《彷徨》之外，还有哪部散文集？",options:["A. 《热风》","B. 《朝花夕拾》","C. 《坟》","D. 《华盖集》"],answer:1,explain:"鲁迅的散文集是《朝花夕拾》。",tag:"鲁迅作品"}]},
  {courseId:17,title:"第17讲 郭沫若",badgeName:"女神小传人",questions:[{q:"郭沫若的原名是什么？",options:["A. 郭开贞","B. 郭鼎堂","C. 郭沫","D. 郭若"],answer:0,explain:"郭沫若原名郭开贞。",tag:"郭沫若"},{q:"郭沫若的哪部诗集开创了「一代诗风」？",options:["A. 《星空》","B. 《女神》","C. 《恢复》","D. 《瓶》"],answer:1,explain:"郭沫若的诗集《女神》开创了「一代诗风」。",tag:"郭沫若作品"},{q:"《凤凰涅槃》中的名句是什么？",options:["A. 我是一只小小鸟","B. 我们更生了","C. 凤凰浴火","D. 重生吧凤凰"],answer:1,explain:"《凤凰涅槃》中的名句是「我们更生了」。",tag:"郭沫若作品"},{q:"在《炉中煤》中，郭沫若把祖国比喻成什么？",options:["A. 母亲","B. 年青的女郎","C. 太阳","D. 大地"],answer:1,explain:"在《炉中煤》中，郭沫若把祖国比喻为「年青的女郎」。",tag:"郭沫若作品"},{q:"下面哪部是郭沫若创作的历史剧？",options:["A. 《雷雨》","B. 《屈原》","C. 《茶馆》","D. 《龙须沟》"],answer:1,explain:"郭沫若创作了历史剧《屈原》。",tag:"郭沫若作品"},{q:"郭沫若的《地球，我的母亲》和《炉中煤》属于什么体裁？",options:["A. 小说","B. 诗歌","C. 散文","D. 戏剧"],answer:1,explain:"这两部都是郭沫若创作的诗歌。",tag:"郭沫若作品"}]},
  {courseId:18,title:"第18讲 茅盾和巴金",badgeName:"文学双星",questions:[{q:"茅盾的原名是什么？",options:["A. 沈雁冰","B. 沈德鸿","C. 沈从文","D. 沈端先"],answer:1,explain:"茅盾原名沈德鸿，字雁冰。",tag:"茅盾"},{q:"茅盾的《子夜》在中国现代文学史上有什么地位？",options:["A. 第一篇白话小说","B. 现实主义文学发展的里程碑","C. 第一部章回小说","D. 第一部散文集"],answer:1,explain:"茅盾的《子夜》是中国现代现实主义文学发展的里程碑。",tag:"茅盾作品"},{q:"巴金的原名是什么？",options:["A. 李尧棠","B. 李芾甘","C. 李尧棠，字芾甘","D. 李青甘"],answer:2,explain:"巴金原名李尧棠，字芾甘。",tag:"巴金"},{q:"巴金的「激流三部曲」是哪三部作品？",options:["A. 《雾》《雨》《电》","B. 《家》《春》《秋》","C. 《春》《夏》《秋》","D. 《家》《国》《天下》"],answer:1,explain:"巴金的「激流三部曲」是《家》《春》《秋》。",tag:"巴金作品"},{q:"巴金《家》中的高觉新是以谁为原型创作的？",options:["A. 巴金自己","B. 巴金的大哥","C. 巴金的父亲","D. 巴金的朋友"],answer:1,explain:"高觉新以巴金的大哥为原型。",tag:"巴金作品"},{q:"标志巴金现实主义创作最高成就的作品是哪一部？",options:["A. 《家》","B. 《春》","C. 《秋》","D. 《寒夜》"],answer:3,explain:"巴金的《寒夜》标志着他现实主义创作的最高成就。",tag:"巴金作品"}]},
  {courseId:19,title:"第19讲 老舍、曹禺和冰心",badgeName:"文坛三杰",questions:[{q:"老舍的原名是什么？",options:["A. 舒庆春，字舍予","B. 舒舍予，字庆春","C. 舒乙","D. 舒绣文"],answer:0,explain:"老舍原名舒庆春，字舍予。",tag:"老舍"},{q:"老舍因哪部作品被授予「人民艺术家」称号？",options:["A. 《骆驼祥子》","B. 《四世同堂》","C. 《龙须沟》","D. 《茶馆》"],answer:2,explain:"老舍因《龙须沟》被授予「人民艺术家」称号。",tag:"老舍"},{q:"曹禺的处女作是什么？",options:["A. 《日出》","B. 《原野》","C. 《雷雨》","D. 《北京人》"],answer:2,explain:"曹禺的处女作《雷雨》一问世就轰动了文坛。",tag:"曹禺"},{q:"曹禺唯一一部以农村生活为题材的剧作是哪一部？",options:["A. 《雷雨》","B. 《日出》","C. 《原野》","D. 《北京人》"],answer:2,explain:"《原野》是曹禺唯一一部以农村生活为题材的剧作。",tag:"曹禺"},{q:"冰心的诗集《繁星》《春水》被茅盾称为什么？",options:["A. 冰心体","B. 繁星格、春水体","C. 小诗派","D. 现代诗体"],answer:1,explain:"冰心的诗集被茅盾称为「繁星格」「春水体」。",tag:"冰心"},{q:"《骆驼祥子》中，祥子经历了三起三落后变成了什么样？",options:["A. 勤劳奋斗的工人","B. 麻木潦倒的行尸走肉","C. 成功的商人","D. 幸福的车夫"],answer:1,explain:"祥子变成了麻木潦倒的行尸走肉。",tag:"老舍作品"}]},
  {courseId:20,title:"第20讲 其他著名现代作家",badgeName:"现代文豪",questions:[{q:"徐志摩是哪个文学流派的代表作家？",options:["A. 京派","B. 新月派","C. 鸳鸯蝴蝶派","D. 创造社"],answer:1,explain:"徐志摩是新月派代表作家，代表作《再别康桥》具有绘画美、音乐美、建筑美。",tag:"徐志摩"},{q:"沈从文的小说《边城》塑造了哪位经典人物形象？",options:["A. 翠翠","B. 萧萧","C. 三三","D. 夭夭"],answer:0,explain:"沈从文是京派小说代表人物，《边城》塑造了翠翠这个纯真少女形象。",tag:"沈从文"},{q:"钱钟书的《围城》被誉为什么？",options:["A. 新儒林外史","B. 现代红楼梦","C. 当代水浒传","D. 新聊斋志异"],answer:0,explain:"钱钟书的《围城》被誉为「新儒林外史」，主人公是方鸿渐。",tag:"钱钟书"},{q:"被称为「雨巷诗人」的是谁？",options:["A. 徐志摩","B. 戴望舒","C. 卞之琳","D. 闻一多"],answer:1,explain:"戴望舒因《雨巷》一诗被称为「雨巷诗人」。",tag:"戴望舒"},{q:"徐志摩《再别康桥》的「三美」不包括以下哪一项？",options:["A. 绘画美","B. 音乐美","C. 建筑美","D. 意境美"],answer:3,explain:"新月派诗歌具有绘画美、音乐美、建筑美「三美」特征。",tag:"徐志摩"},{q:"沈从文的小说大多以什么地方为背景？",options:["A. 北京","B. 上海","C. 湘西","D. 四川"],answer:2,explain:"沈从文的作品大多以湘西为背景。",tag:"沈从文"}]},
  {courseId:21,title:"第21讲 港台当代作家",badgeName:"港台文星",questions:[{q:"琼瑶是哪一类小说的代表作家？",options:["A. 武侠小说","B. 言情小说","C. 科幻小说","D. 历史小说"],answer:1,explain:"琼瑶是台湾著名言情小说家。",tag:"琼瑶"},{q:"三毛的哪部作品记录了她在撒哈拉沙漠的生活？",options:["A. 《雨季不再来》","B. 《撒哈拉的故事》","C. 《梦里花落知多少》","D. 《万水千山走遍》"],answer:1,explain:"三毛的《撒哈拉的故事》记录了她与丈夫荷西在撒哈拉沙漠的生活。",tag:"三毛"},{q:"金庸原名是什么？",options:["A. 查良镛","B. 查良铮","C. 金良镛","D. 查大侠"],answer:0,explain:"金庸原名查良镛，他将「镛」字拆开作为笔名。",tag:"金庸"},{q:"余光中的《乡愁》运用了什么修辞手法？",options:["A. 排比和比喻","B. 拟人和夸张","C. 对偶和借代","D. 反复和设问"],answer:0,explain:"余光中的《乡愁》运用排比和比喻，将乡愁比作邮票、船票、坟墓、海峡。",tag:"余光中"},{q:"席慕蓉的第一本诗集叫什么？",options:["A. 《无怨的青春》","B. 《七里香》","C. 《时光九篇》","D. 《边缘光影》"],answer:1,explain:"席慕蓉的第一本诗集是《七里香》。",tag:"席慕蓉"},{q:"金庸小说对联「飞雪连天射白鹿，笑书神侠倚碧鸳」中，「碧」指的是哪部小说？",options:["A. 《碧血剑》","B. 《碧海潮生》","C. 《碧玉刀》","D. 《碧云天》"],answer:0,explain:"「碧」指的是《碧血剑》。",tag:"金庸"}]},
  {courseId:22,title:"第22讲 古希腊神话",badgeName:"神话探险家",questions:[{q:"古希腊文学的主要成就是什么？",options:["A. 戏剧和诗歌","B. 神话和《荷马史诗》","C. 寓言和散文","D. 哲学和史诗"],answer:1,explain:"古希腊文学的主要成就是神话和《荷马史诗》。",tag:"古希腊文学"},{q:"古希腊神话分为哪两部分？",options:["A. 神的故事和英雄传说","B. 创世神话和爱情故事","C. 战争故事和冒险故事","D. 天神故事和凡人故事"],answer:0,explain:"古希腊神话分为「神的故事」和「英雄传说」两部分。",tag:"古希腊神话"},{q:"古希腊神话中，众神之王是谁？",options:["A. 波塞冬","B. 哈迪斯","C. 宙斯","D. 阿波罗"],answer:2,explain:"宙斯是众神之王。",tag:"古希腊神话"},{q:"雅典娜是古希腊神话中的什么神？",options:["A. 爱与美之神","B. 智慧与战争女神","C. 月亮与狩猎女神","D. 婚姻与家庭女神"],answer:1,explain:"雅典娜是智慧与战争女神。",tag:"古希腊神话"},{q:"古希腊神话中，阿波罗是什么神？",options:["A. 战神","B. 太阳神","C. 商业之神","D. 火神"],answer:1,explain:"阿波罗是太阳神。",tag:"古希腊神话"},{q:"古希腊神话中，爱神阿佛洛狄忒在罗马神话中叫什么？",options:["A. 维纳斯","B. 朱诺","C. 密涅瓦","D. 狄安娜"],answer:0,explain:"阿佛洛狄忒在罗马神话中对应的是维纳斯。",tag:"古希腊神话"}]},
  {courseId:23,title:"第23讲 《伊索寓言》和《荷马史诗》",badgeName:"寓言小智者",questions:[{q:"伊索是世界四大寓言家之一，以下哪位不属于四大寓言家？",options:["A. 拉封丹","B. 莱辛","C. 克雷洛夫","D. 安徒生"],answer:3,explain:"世界四大寓言家是伊索、拉封丹、莱辛、克雷洛夫。",tag:"伊索寓言"},{q:"《伊索寓言》在世界文学史上有什么地位？",options:["A. 最早的童话集","B. 最早的寓言故事集","C. 最早的诗歌集","D. 最早的神话集"],answer:1,explain:"《伊索寓言》是世界上最早的寓言故事集。",tag:"伊索寓言"},{q:"「欧洲四大史诗诗人」不包括以下哪位？",options:["A. 荷马","B. 维吉尔","C. 但丁","D. 莎士比亚"],answer:3,explain:"欧洲四大史诗诗人是荷马、维吉尔、但丁、弥尔顿。",tag:"荷马史诗"},{q:"《荷马史诗》由哪两部作品组成？",options:["A. 《伊利亚特》和《奥德赛》","B. 《伊尼特》和《变形记》","C. 《神曲》和《失乐园》","D. 《埃涅阿斯纪》和《奥德赛》"],answer:0,explain:"《荷马史诗》由《伊利亚特》和《奥德赛》组成。",tag:"荷马史诗"},{q:"「阿喀琉斯之踵」这个成语用来比喻什么？",options:["A. 一个人的优点","B. 一个人的弱点","C. 一个人的勇气","D. 一个人的智慧"],answer:1,explain:"「阿喀琉斯之踵」指一个人的致命弱点。",tag:"荷马史诗"},{q:"《伊索寓言》中「龟兔赛跑」告诉我们什么道理？",options:["A. 兔子跑得快","B. 乌龟跑得慢","C. 骄傲使人落后，坚持就是胜利","D. 比赛要公平"],answer:2,explain:"骄傲使人落后，坚持不懈才能取得胜利。",tag:"伊索寓言"}]},
  {courseId:24,title:"第24讲 拉伯雷和塞万提斯",badgeName:"骑士小勇士",questions:[{q:"拉伯雷的《巨人传》是哪国文学史上的第一部长篇小说？",options:["A. 英国","B. 法国","C. 德国","D. 意大利"],answer:1,explain:"《巨人传》是法国文学史上第一部长篇小说。",tag:"拉伯雷"},{q:"《巨人传》中神瓶启示的答案是什么？",options:["A. 爱","B. 喝","C. 笑","D. 梦"],answer:1,explain:"神瓶启示的答案是「喝」——寓意要畅饮知识、畅饮真理。",tag:"拉伯雷"},{q:"塞万提斯的《堂·吉诃德》中，主人公的原名是什么？",options:["A. 堂·吉诃德","B. 阿隆索·吉哈达","C. 桑丘·潘沙","D. 杜尔西内娅"],answer:1,explain:"主人公原名阿隆索·吉哈达，自封为堂·吉诃德。",tag:"塞万提斯"},{q:"《堂·吉诃德》中，堂·吉诃德的仆人是谁？",options:["A. 桑丘·潘沙","B. 杜尔西内娅","C. 卡拉斯科","D. 安东尼奥"],answer:0,explain:"桑丘·潘沙是堂·吉诃德的忠实仆人。",tag:"塞万提斯"},{q:"《堂·吉诃德》中，堂·吉诃德最终被谁打败？",options:["A. 桑丘·潘沙","B. 白月骑士","C. 风车巨人","D. 杜尔西内娅"],answer:1,explain:"堂·吉诃德被白月骑士打败后回到了家乡。",tag:"塞万提斯"},{q:"《巨人传》共分为几部？",options:["A. 三部","B. 四部","C. 五部","D. 六部"],answer:2,explain:"《巨人传》共五部。",tag:"拉伯雷"}]},
  {courseId:25,title:"第25讲 莎士比亚（上）",badgeName:"莎剧小演员",questions:[{q:"莎士比亚被誉为什么？",options:["A. 英国诗歌之父","B. 英国戏剧之父","C. 英国小说之父","D. 英国散文之父"],answer:1,explain:"莎士比亚是英国戏剧之父，创作了37部戏剧、154首十四行诗。",tag:"莎士比亚"},{q:"莎士比亚的四大悲剧不包括以下哪一部？",options:["A. 《奥赛罗》","B. 《李尔王》","C. 《罗密欧与朱丽叶》","D. 《麦克白》"],answer:2,explain:"四大悲剧是《奥赛罗》《李尔王》《麦克白》《哈姆雷特》。",tag:"莎士比亚"},{q:"莎士比亚的四大喜剧不包括以下哪一部？",options:["A. 《仲夏夜之梦》","B. 《皆大欢喜》","C. 《威尼斯商人》","D. 《罗密欧与朱丽叶》"],answer:3,explain:"四大喜剧是《仲夏夜之梦》《皆大欢喜》《第十二夜》《威尼斯商人》。",tag:"莎士比亚"},{q:"莎士比亚一生创作了多少部戏剧？",options:["A. 27部","B. 37部","C. 47部","D. 57部"],answer:1,explain:"莎士比亚创作了37部戏剧。",tag:"莎士比亚"},{q:"莎士比亚的《哈姆雷特》中，哈姆雷特是哪国的王子？",options:["A. 英国","B. 法国","C. 丹麦","D. 挪威"],answer:2,explain:"哈姆雷特是丹麦王子。",tag:"哈姆雷特"},{q:"莎士比亚的作品体现了什么思想？",options:["A. 封建主义思想","B. 人文主义思想","C. 禁欲主义思想","D. 神秘主义思想"],answer:1,explain:"莎士比亚的作品充满了人文主义思想。",tag:"莎士比亚"}]},

const SFX = {
  ctx: null,
  getCtx() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); return this.ctx; },
  playCorrect() {
    try {
      const ctx = this.getCtx(), osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc.frequency.setValueAtTime(523, ctx.currentTime);
      osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
      osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.4);
    } catch(e) {}
  },
  playWrong() {
    try {
      const ctx = this.getCtx(), osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sawtooth';
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.frequency.setValueAtTime(200, ctx.currentTime);
      osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
    } catch(e) {}
  },
  playBadge() {
    try {
      const ctx = this.getCtx();
      [523, 659, 784, 1047].forEach((freq, i) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        const t = ctx.currentTime + i * 0.15;
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
        osc.frequency.setValueAtTime(freq, t);
        osc.start(t); osc.stop(t + 0.2);
      });
    } catch(e) {}
  }
};

const Confetti = {
  canvas: null, ctx: null, particles: [], running: false,
  init() {
    this.canvas = document.getElementById('confetti-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
  },
  resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
  start(count) {
    if (this.running) return;
    this.running = true;
    this.particles = [];
    const colors = ['#FF6B6B','#4ECDC4','#FFE66D','#FF8E8E','#7EDDD6','#FFF0A0','#FF9FF3','#54A0FF'];
    for (let i = 0; i < (count||80); i++) {
      this.particles.push({
        x: Math.random() * this.canvas.width, y: -20 - Math.random() * 100,
        w: 6 + Math.random() * 8, h: 4 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 4, vy: 2 + Math.random() * 3,
        rot: Math.random() * 360, rotV: (Math.random() - 0.5) * 8, opacity: 1
      });
    }
    this.animate();
  },
  animate() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    let alive = false;
    this.particles.forEach(p => {
      p.x += p.vx; p.vy += 0.05; p.y += p.vy; p.rot += p.rotV;
      if (p.y > this.canvas.height + 20) p.opacity -= 0.02;
      if (p.opacity <= 0) return;
      alive = true;
      this.ctx.save();
      this.ctx.translate(p.x, p.y);
      this.ctx.rotate(p.rot * Math.PI / 180);
      this.ctx.globalAlpha = Math.max(0, p.opacity);
      this.ctx.fillStyle = p.color;
      this.ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      this.ctx.restore();
    });
    if (alive) requestAnimationFrame(() => this.animate());
    else { this.running = false; this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); }
  }
};

function showToast(msg, type) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast ' + (type||'info');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function navigate(hash) {
  window.location.hash = hash;
  render();
}

function getRoute() {
  const hash = window.location.hash.slice(1) || 'login';
  const parts = hash.split('/');
  return { page: parts[0], params: parts.slice(1) };
}

function render() {
  const route = getRoute();
  const user = DB.getCurrentUser();
  const app = document.getElementById('app');
  if (!user && route.page !== 'login') { navigate('login'); return; }
  switch(route.page) {
    case 'login': renderLogin(app); break;
    case 'courses': renderCourses(app); break;
    case 'quiz': renderQuiz(app, parseInt(route.params[0])); break;
    case 'wrongbook': renderWrongBook(app); break;
    case 'badges': renderBadges(app); break;
    case 'teacher': renderTeacher(app); break;
    default: navigate('courses');
  }
}

let quizState = { courseId: null, current: 0, answers: [], submitted: false };

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuiz(app, courseId) {
  const course = courseQuestions.find(c => c.courseId === courseId);
  if (!course) { navigate('courses'); return; }
  const user = DB.getCurrentUser();
  const userData = DB.getUserData(user.username);
  const prev = userData.progress[courseId];
  quizState = { courseId, current: 0, answers: prev&&prev.answers ? [...prev.answers] : [], submitted: prev&&prev.completed||false };
  if (quizState.submitted) { navigate('courses'); return; }
  renderQuizQuestion(app, course);
}

function renderQuizQuestion(app, course) {
  const q = course.questions[quizState.current];
  const total = course.questions.length;
  const progress = (quizState.current / total) * 100;
  const answeredCount = quizState.answers.filter(a=>a!==undefined&&a!==null).length;
  app.innerHTML = `
    <div class="header">
      <div class="user-info" onclick="navigate('login'); DB.logout(); showToast('已退出登录','info')">${DB.getCurrentUser().username} ⬇退出</div>
      <h1>🌸 ${course.title}</h1>
    </div>
    <button class="back-btn" onclick="navigate('courses')">← 返回课程</button>
    <div class="card">
      <div class="quiz-header">
        <span class="quiz-progress">第 ${quizState.current+1}/${total} 题</span>
        <span style="font-size:0.85em;color:var(--text-light)">已答 ${answeredCount}/${total}</span>
      </div>
      <div class="quiz-progress-bar"><div class="fill" style="width:${progress}%"></div></div>
      <div class="quiz-question">${q.q}</div>
      <div class="quiz-options" id="quiz-options">
        ${q.options.map((opt, i) => '<div class="quiz-option" data-idx="'+i+'"><span class="option-label">'+opt.charAt(0)+'</span>'+opt.substring(2)+'</div>').join('')}
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
        ${quizState.current > 0 ? '<button class="btn btn-outline btn-sm" id="prev-btn">← 上一题</button>' : ''}
        ${quizState.current === total - 1 ? '<button class="btn btn-primary btn-sm" id="submit-btn" style="display:none">📮 查看结果</button>' : ''}
      </div>
    </div>`;
  const savedAnswer = quizState.answers[quizState.current];
  if (savedAnswer !== undefined && savedAnswer !== null) {
    document.querySelectorAll('.quiz-option').forEach((el, i) => { if (i === savedAnswer) el.classList.add('selected'); });
  }
  document.querySelectorAll('.quiz-option').forEach(el => {
    el.addEventListener('click', () => {
      if (quizState.submitted) return;
      const alreadyAnswered = quizState.answers[quizState.current] !== undefined && quizState.answers[quizState.current] !== null;
      if (alreadyAnswered) return;
      document.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      const idx = parseInt(el.dataset.idx);
      quizState.answers[quizState.current] = idx;
      document.querySelectorAll('.quiz-option').forEach(o => o.style.pointerEvents = 'none');
      const isCorrect = idx === q.answer;
      if (isCorrect) {
        el.classList.add('correct');
        SFX.playCorrect();
        Confetti.start(30);
      } else {
        el.classList.add('wrong');
        SFX.playWrong();
        document.querySelectorAll('.quiz-option')[q.answer].classList.add('correct');
      }
      setTimeout(() => {
        if (quizState.current < total - 1) {
          quizState.current++;
          renderQuizQuestion(app, course);
        } else {
          const sb = document.getElementById('submit-btn');
          if (sb) { sb.style.display = 'inline-block'; }
        }
      }, 1500);
    });
  });
  const pv = document.getElementById('prev-btn');
  if (pv) pv.addEventListener('click', () => { if (quizState.current > 0) { quizState.current--; renderQuizQuestion(app, course); } });
  const sm = document.getElementById('submit-btn');
  if (sm) sm.addEventListener('click', () => {
    const unanswered = quizState.answers.filter(a => a===undefined||a===null).length;
    if (unanswered > 0) { showToast('还有 '+unanswered+' 题未作答，请完成所有题目', 'error'); return; }
    quizState.submitted = true;
    submitQuiz(app, course);
  });
}

function submitQuiz(app, course) {
  const user = DB.getCurrentUser();
  const userData = DB.getUserData(user.username);
  const total = course.questions.length;
  let correct = 0;
  const wrongItems = [];
  course.questions.forEach((q, i) => {
    if (quizState.answers[i] === q.answer) correct++;
    else wrongItems.push({ courseId: course.courseId, courseTitle: course.title, q: q.q, options: q.options, answer: q.answer, userAnswer: quizState.answers[i], explain: q.explain, tag: q.tag });
  });
  const allCorrect = correct === total;
  const hasBadge = allCorrect && !userData.badges.some(b => b.courseId === course.courseId);
  userData.progress[course.courseId] = { answers: [...quizState.answers], score: correct, completed: true, badge: allCorrect };
  wrongItems.forEach(w => { if (!userData.wrongBook.some(item => item.q === w.q && item.courseId === w.courseId)) userData.wrongBook.push(w); });
  if (hasBadge) userData.badges.push({ courseId: course.courseId, badgeName: course.badgeName });
  DB.saveUserData(user.username, userData);
  if (allCorrect) { SFX.playBadge(); setTimeout(() => Confetti.start(100), 200); }
  else if (correct >= total * 0.5) SFX.playCorrect();
  else SFX.playWrong();
  renderResult(app, course.courseId);
}

let wrongQuizState = null;

function startWrongQuiz() {
  const user = DB.getCurrentUser();
  const userData = DB.getUserData(user.username);
  const wrongs = userData.wrongBook;
  if (wrongs.length === 0) { showToast('没有错题需要重练', 'info'); return; }
  wrongQuizState = {
    items: wrongs.map(w => {
      const shuffled = shuffleArray(w.options);
      const correctText = w.options[w.answer];
      const newAnswerIdx = shuffled.indexOf(correctText);
      return { ...w, shuffledOptions: shuffled, shuffledAnswer: newAnswerIdx };
    }),
    current: 0,
    results: []
  };
  renderWrongQuizQuestion(document.getElementById('app'));
}

function renderWrongQuizQuestion(app) {
  if (!wrongQuizState || wrongQuizState.current >= wrongQuizState.items.length) {
    finishWrongQuiz(app);
    return;
  }
  const item = wrongQuizState.items[wrongQuizState.current];
  const total = wrongQuizState.items.length;
  app.innerHTML = `
    <div class="header">
      <div class="user-info" onclick="navigate('login'); DB.logout(); showToast('已退出登录','info')">${DB.getCurrentUser().username} ⬇退出</div>
      <h1>🔄 错题重练</h1>
    </div>
    <button class="back-btn" onclick="wrongQuizState=null;navigate('wrongbook')">← 返回错题本</button>
    <div class="card">
      <div class="quiz-header">
        <span class="quiz-progress">第 ${wrongQuizState.current+1}/${total} 题</span>
        <span style="font-size:0.85em;color:var(--text-light)">${item.courseTitle}</span>
      </div>
      <div class="quiz-progress-bar"><div class="fill" style="width:${(wrongQuizState.current/total)*100}%"></div></div>
      <div class="quiz-question">${item.q}</div>
      <div class="quiz-options" id="quiz-options">
        ${item.shuffledOptions.map((opt, i) => '<div class="quiz-option" data-idx="'+i+'"><span class="option-label">'+opt.charAt(0)+'</span>'+opt.substring(2)+'</div>').join('')}
      </div>
    </div>`;
  document.querySelectorAll('.quiz-option').forEach(el => {
    el.addEventListener('click', () => {
      if (el.classList.contains('correct') || el.classList.contains('wrong')) return;
      document.querySelectorAll('.quiz-option').forEach(o => { o.style.pointerEvents = 'none'; });
      const idx = parseInt(el.dataset.idx);
      const isCorrect = idx === item.shuffledAnswer;
      if (isCorrect) {
        el.classList.add('correct');
        SFX.playCorrect();
        Confetti.start(30);
        const user = DB.getCurrentUser();
        const userData = DB.getUserData(user.username);
        userData.wrongBook = userData.wrongBook.filter(w => !(w.q === item.q && w.courseId === item.courseId));
        DB.saveUserData(user.username, userData);
        wrongQuizState.results.push({ q: item.q, correct: true });
      } else {
        el.classList.add('wrong');
        SFX.playWrong();
        document.querySelectorAll('.quiz-option')[item.shuffledAnswer].classList.add('correct');
        wrongQuizState.results.push({ q: item.q, correct: false });
      }
      setTimeout(() => {
        wrongQuizState.current++;
        renderWrongQuizQuestion(app);
      }, 1500);
    });
  });
}

function finishWrongQuiz(app) {
  const total = wrongQuizState.results.length;
  const correct = wrongQuizState.results.filter(r => r.correct).length;
  wrongQuizState = null;
  app.innerHTML = `
    <div class="header"><h1>🎉 错题重练完成</h1></div>
