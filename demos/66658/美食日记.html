<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ 美食日记 - 今天吃什么？</title>
<style>
/* ========== CSS Variables & Reset ========== */
:root {
  --clr-primary: #FF6D3F;
  --clr-primary-dark: #E55A2B;
  --clr-secondary: #FFB347;
  --clr-bg: #FFF9F2;
  --clr-card: #FFFFFF;
  --clr-text: #3D2C2C;
  --clr-text-light: #8B7355;
  --clr-border: #F0E6DC;
  --clr-green: #4CAF50;
  --clr-green-light: #E8F5E9;
  --clr-blue: #3F51B5;
  --clr-blue-light: #E8EAF6;
  --clr-red: #EF5350;
  --clr-star: #FFB300;
  --shadow-sm: 0 2px 8px rgba(0,0,0,.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,.10);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.12);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: .25s cubic-bezier(.4,0,.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--clr-bg);
  color: var(--clr-text);
  min-height: 100vh;
  line-height: 1.6;
}

/* ========== Layout ========== */
.app { max-width: 960px; margin: 0 auto; padding: 0 16px 40px; }

/* ========== Header ========== */
.header {
  text-align: center;
  padding: 32px 0 20px;
  position: sticky;
  top: 0;
  background: var(--clr-bg);
  z-index: 100;
}
.header h1 {
  font-size: 2rem;
  background: linear-gradient(135deg, var(--clr-primary), var(--clr-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
}
.header .subtitle { color: var(--clr-text-light); font-size: .9rem; }

/* ========== Navigation ========== */
.nav {
  display: flex;
  gap: 4px;
  justify-content: center;
  margin-top: 16px;
  background: var(--clr-card);
  border-radius: 28px;
  padding: 4px;
  box-shadow: var(--shadow-sm);
}
.nav-btn {
  flex: 1;
  max-width: 160px;
  padding: 10px 8px;
  border: none;
  background: transparent;
  border-radius: 24px;
  cursor: pointer;
  font-size: .9rem;
  color: var(--clr-text-light);
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
}
.nav-btn:hover { color: var(--clr-text); background: rgba(0,0,0,.03); }
.nav-btn.active {
  background: var(--clr-primary);
  color: #fff;
  box-shadow: 0 2px 8px rgba(255,109,63,.35);
}

/* ========== Sections ========== */
.section { display: none; animation: fadeIn .3s ease; }
.section.active { display: block; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ========== Toolbar ========== */
.toolbar {
  display: flex;
  gap: 10px;
  align-items: center;
  margin: 20px 0;
  flex-wrap: wrap;
}
.toolbar .search {
  flex: 1;
  min-width: 180px;
  padding: 10px 16px;
  border: 2px solid var(--clr-border);
  border-radius: 24px;
  font-size: .9rem;
  outline: none;
  transition: var(--transition);
  background: var(--clr-card);
}
.toolbar .search:focus { border-color: var(--clr-primary); }
.toolbar .stats {
  font-size: .85rem;
  color: var(--clr-text-light);
  white-space: nowrap;
}
.toolbar .stats span { font-weight: 700; color: var(--clr-primary); }

/* ========== Buttons ========== */
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 24px;
  cursor: pointer;
  font-size: .9rem;
  font-weight: 600;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.btn-primary { background: var(--clr-primary); color: #fff; box-shadow: 0 2px 8px rgba(255,109,63,.3); }
.btn-primary:hover { background: var(--clr-primary-dark); transform: translateY(-1px); }
.btn-outline { background: transparent; border: 2px solid var(--clr-border); color: var(--clr-text); }
.btn-outline:hover { border-color: var(--clr-primary); color: var(--clr-primary); }
.btn-sm { padding: 6px 14px; font-size: .8rem; }
.btn-danger { background: var(--clr-red); color: #fff; }
.btn-danger:hover { opacity: .85; }

/* ========== Food Cards Grid ========== */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
  margin-top: 16px;
}
.card {
  background: var(--clr-card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
  position: relative;
  border: 2px solid transparent;
}
.card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--clr-border); }
.card .dish-name { font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; }
.card .restaurant { color: var(--clr-primary); font-weight: 600; font-size: .9rem; margin-bottom: 2px; }
.card .location { color: var(--clr-text-light); font-size: .82rem; margin-bottom: 8px; }
.card .location::before { content: "📍 "; }
.card .meta { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; color: var(--clr-text-light); }
.card .stars { color: var(--clr-star); font-size: 1rem; letter-spacing: 2px; }
.card .date { color: var(--clr-text-light); }
.card .note { margin-top: 8px; font-size: .82rem; color: var(--clr-text-light); font-style: italic; background: #FFFBF5; padding: 8px 10px; border-radius: 8px; border-left: 3px solid var(--clr-secondary); }
.card .delete-btn {
  position: absolute;
  top: 10px;
  right: 12px;
  width: 28px;
  height: 28px;
  border: none;
  background: rgba(0,0,0,.04);
  border-radius: 50%;
  cursor: pointer;
  font-size: .8rem;
  opacity: 0;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}
.card:hover .delete-btn { opacity: 1; }
.card .delete-btn:hover { background: var(--clr-red); color: #fff; }
.card-img {
  width: 100%;
  height: 160px;
  overflow: hidden;
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
}
.card-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .3s ease;
}
.card:hover .card-img img { transform: scale(1.05); }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--clr-text-light);
}
.empty-state .icon { font-size: 3.5rem; margin-bottom: 12px; }
.empty-state p { font-size: .95rem; }

/* ========== Modal ========== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--clr-card);
  border-radius: var(--radius);
  padding: 28px 24px;
  width: 100%;
  max-width: 440px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: modalIn .3s ease;
}
@keyframes modalIn { from { opacity: 0; transform: scale(.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal h3 { margin-bottom: 20px; font-size: 1.2rem; text-align: center; }
.modal .form-group { margin-bottom: 14px; }
.modal label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 4px; color: var(--clr-text); }
.modal input, .modal textarea, .modal select {
  width: 100%;
  padding: 10px 14px;
  border: 2px solid var(--clr-border);
  border-radius: var(--radius-sm);
  font-size: .9rem;
  outline: none;
  transition: var(--transition);
  font-family: inherit;
  resize: vertical;
}
.modal input:focus, .modal textarea:focus, .modal select:focus { border-color: var(--clr-primary); }
.modal .form-row { display: flex; gap: 10px; }
.modal .form-row > * { flex: 1; }
.modal .star-picker { display: flex; gap: 4px; font-size: 1.5rem; }
.modal .star-picker span { cursor: pointer; transition: var(--transition); color: #ddd; }
.modal .star-picker span.active { color: var(--clr-star); }
.modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

/* ========== Wheel Section ========== */
.wheel-layout {
  display: flex;
  gap: 24px;
  align-items: flex-start;
  flex-wrap: wrap;
  margin-top: 20px;
}
.wheel-main {
  flex: 0 0 380px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.wheel-container {
  position: relative;
  width: 340px;
  height: 340px;
}
.wheel-pointer {
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 16px solid transparent;
  border-right: 16px solid transparent;
  border-top: 28px solid var(--clr-primary);
  z-index: 10;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.2));
}
.wheel-pointer::after {
  content: "";
  position: absolute;
  top: -34px;
  left: -6px;
  width: 12px;
  height: 12px;
  background: var(--clr-primary);
  border-radius: 50%;
}
#wheelCanvas { width: 100%; height: 100%; border-radius: 50%; }
.spin-btn {
  padding: 14px 48px;
  border: none;
  border-radius: 28px;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  background: linear-gradient(135deg, var(--clr-primary), var(--clr-secondary));
  color: #fff;
  box-shadow: 0 4px 16px rgba(255,109,63,.4);
  transition: var(--transition);
  letter-spacing: 1px;
}
.spin-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(255,109,63,.5); }
.spin-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.spin-btn.spinning { animation: pulse .5s infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

.wheel-sidebar {
  flex: 1;
  min-width: 240px;
}
.wheel-sidebar h4 { margin-bottom: 10px; font-size: 1rem; }
.wheel-list {
  list-style: none;
  max-height: 280px;
  overflow-y: auto;
  margin-bottom: 12px;
}
.wheel-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: var(--clr-card);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  font-size: .9rem;
  box-shadow: var(--shadow-sm);
}
.wheel-list li .remove-wheel-item {
  border: none;
  background: none;
  cursor: pointer;
  color: #ccc;
  font-size: 1.1rem;
  transition: var(--transition);
  padding: 2px 6px;
}
.wheel-list li .remove-wheel-item:hover { color: var(--clr-red); }
.wheel-add-row { display: flex; gap: 8px; }
.wheel-add-row input { flex: 1; }
.wheel-sidebar .hint { font-size: .8rem; color: var(--clr-text-light); margin-top: 8px; }

.result-popup {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 300;
  align-items: center;
  justify-content: center;
}
.result-popup.open { display: flex; }
.result-card {
  background: #fff;
  border-radius: var(--radius);
  padding: 40px;
  text-align: center;
  box-shadow: var(--shadow-lg);
  animation: modalIn .3s ease;
}
.result-card .result-emoji { font-size: 4rem; margin-bottom: 12px; }
.result-card .result-label { font-size: .9rem; color: var(--clr-text-light); margin-bottom: 4px; }
.result-card .result-dish { font-size: 1.8rem; font-weight: 700; color: var(--clr-primary); margin-bottom: 20px; }
.result-card .btn { margin: 0 6px; }

/* ========== Fitness Section ========== */
.fitness-tabs {
  display: flex;
  gap: 0;
  margin: 20px 0;
  border-radius: 28px;
  overflow: hidden;
  border: 2px solid var(--clr-border);
}
.fitness-tab {
  flex: 1;
  padding: 12px;
  border: none;
  cursor: pointer;
  font-size: .95rem;
  font-weight: 600;
  transition: var(--transition);
  text-align: center;
}
.fitness-tab.fatloss { background: transparent; color: var(--clr-green); }
.fitness-tab.fatloss.active { background: var(--clr-green); color: #fff; }
.fitness-tab.muscle { background: transparent; color: var(--clr-blue); }
.fitness-tab.muscle.active { background: var(--clr-blue); color: #fff; }

.fitness-panel { display: none; }
.fitness-panel.active { display: block; animation: fadeIn .3s ease; }

.fitness-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
  margin-top: 16px;
}
.fitness-card {
  background: var(--clr-card);
  border-radius: var(--radius-sm);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: var(--transition);
  border-left: 4px solid transparent;
}
.fitness-card.fatloss-card { border-left-color: var(--clr-green); }
.fitness-card.muscle-card { border-left-color: var(--clr-blue); }
.fitness-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.fitness-card .fitness-info h5 { font-size: .95rem; margin-bottom: 4px; }
.fitness-card .fitness-info .macros { font-size: .78rem; color: var(--clr-text-light); display: flex; gap: 10px; flex-wrap: wrap; }
.fitness-card .fitness-info .macros span { background: #f5f5f5; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.fitness-card .remove-fitness {
  border: none;
  background: none;
  cursor: pointer;
  color: #ccc;
  font-size: 1.2rem;
  padding: 4px;
  transition: var(--transition);
}
.fitness-card .remove-fitness:hover { color: var(--clr-red); }

.fitness-add-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.fitness-add-row input { flex: 1; min-width: 100px; }
.fitness-add-row input, .fitness-add-row .btn { font-size: .82rem; }

/* ========== Regional Food Section ========== */
.region-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 16px;
  flex-wrap: nowrap;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.region-chips::-webkit-scrollbar { height: 4px; }
.region-chips::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }
.region-chip {
  flex-shrink: 0;
  padding: 8px 18px;
  border: 2px solid var(--clr-border);
  border-radius: 22px;
  background: var(--clr-card);
  cursor: pointer;
  font-size: .88rem;
  font-weight: 600;
  transition: var(--transition);
  white-space: nowrap;
  color: var(--clr-text);
}
.region-chip:hover { border-color: var(--clr-primary); color: var(--clr-primary); }
.region-chip.active {
  background: var(--clr-primary);
  color: #fff;
  border-color: var(--clr-primary);
  box-shadow: 0 2px 10px rgba(255,109,63,.35);
}
.regional-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}
.regional-card {
  background: var(--clr-card);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}
.regional-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.regional-img {
  width: 100%;
  height: 200px;
  overflow: hidden;
  background: linear-gradient(135deg, #f5f0e8, #ede4d8);
  position: relative;
}
.regional-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .4s ease;
}
.regional-card:hover .regional-img img { transform: scale(1.06); }
.regional-img .no-photo {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #c0b8a8;
  font-size: 3rem;
}
.regional-img .no-photo span { font-size: .85rem; margin-top: 4px; }
.regional-info { padding: 16px; }
.regional-info .regional-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.regional-info .regional-name .search-real {
  font-size: .75rem;
  text-decoration: none;
  opacity: .5;
  transition: var(--transition);
}
.regional-info .regional-name .search-real:hover { opacity: 1; transform: scale(1.2); }
.regional-info .regional-desc { font-size: .85rem; color: var(--clr-text-light); line-height: 1.5; }
.regional-info .regional-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.regional-info .regional-tags .tag {
  font-size: .73rem;
  padding: 3px 10px;
  border-radius: 12px;
  background: #FFF3E8;
  color: var(--clr-primary);
  font-weight: 600;
}

/* ========== Toast ========== */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 400; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 20px;
  background: #333;
  color: #fff;
  border-radius: 24px;
  font-size: .85rem;
  box-shadow: var(--shadow-md);
  animation: slideIn .3s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

/* ========== Responsive ========== */
@media (max-width: 768px) {
  .header h1 { font-size: 1.5rem; }
  .nav-btn { font-size: .78rem; padding: 8px 4px; }
  .wheel-layout { justify-content: center; }
  .wheel-main { flex: 0 0 300px; }
  .wheel-container { width: 280px; height: 280px; }
  .card-grid { grid-template-columns: 1fr; }
  .fitness-grid { grid-template-columns: 1fr; }
  .regional-grid { grid-template-columns: 1fr; }
  .regional-img { height: 180px; }
}
@media (max-width: 480px) {
  .nav-btn { font-size: .72rem; gap: 4px; }
  .toolbar { flex-direction: column; }
  .toolbar .search { width: 100%; }
  .fitness-add-row { flex-direction: column; }
}
</style>
</head>
<body>

<div class="app">
  <!-- ====== Header ====== -->
  <header class="header">
    <h1>🍽️ 美食日记</h1>
    <p class="subtitle">记录每一餐的美味，再也不纠结吃什么！</p>
    <nav class="nav">
      <button class="nav-btn active" data-tab="collection">📒 美食收藏</button>
      <button class="nav-btn" data-tab="wheel">🎡 今天吃啥</button>
      <button class="nav-btn" data-tab="fitness">💪 健身专区</button>
      <button class="nav-btn" data-tab="regional">🗺️ 地方美食</button>
    </nav>
  </header>

  <!-- ====== Tab 1: 美食收藏 ====== -->
  <section class="section active" id="section-collection">
    <div class="toolbar">
      <input type="text" class="search" id="searchInput" placeholder="🔍 搜菜名、餐厅、地点…">
      <span class="stats">共 <span id="totalCount">0</span> 道美食 · 均分 <span id="avgRating">0</span> ⭐</span>
      <button class="btn btn-primary" id="btnAddFood">➕ 添加美食</button>
    </div>
    <div class="card-grid" id="foodGrid"></div>
  </section>

  <!-- ====== Tab 2: 今天吃啥 ====== -->
  <section class="section" id="section-wheel">
    <div class="wheel-layout">
      <div class="wheel-main">
        <div class="wheel-container">
          <div class="wheel-pointer"></div>
          <canvas id="wheelCanvas" width="680" height="680"></canvas>
        </div>
        <button class="spin-btn" id="spinBtn">🎰 开 转！</button>
      </div>
      <div class="wheel-sidebar">
        <h4>🎯 转盘菜单</h4>
        <ul class="wheel-list" id="wheelList"></ul>
        <div class="wheel-add-row">
          <input type="text" id="wheelQuickAdd" placeholder="快速添加菜名…" class="search">
          <button class="btn btn-primary btn-sm" id="btnWheelAdd">添加</button>
        </div>
        <button class="btn btn-outline btn-sm" style="margin-top:8px;width:100%" id="btnImportAll">📥 从收藏夹一键导入</button>
        <button class="btn btn-outline btn-sm" style="margin-top:4px;width:100%;color:var(--clr-red);border-color:var(--clr-red)" id="btnClearWheel">🗑 清空转盘</button>
        <p class="hint">💡 把拿不定主意的菜加进来，让命运帮你做决定！</p>
      </div>
    </div>
    <div class="result-popup" id="resultPopup">
      <div class="result-card">
        <div class="result-emoji">🎉</div>
        <div class="result-label">今天就去吃</div>
        <div class="result-dish" id="resultDish"></div>
        <button class="btn btn-primary" id="btnCloseResult">好的！</button>
        <button class="btn btn-outline" id="btnRespin">🔄 再转一次</button>
      </div>
    </div>
  </section>

  <!-- ====== Tab 3: 健身专区 ====== -->
  <section class="section" id="section-fitness">
    <div class="fitness-tabs">

function renderFoodCollection(filter = '') {
  const grid = document.getElementById('foodGrid');

  );

  document.getElementById('totalCount').textContent = foods.length;
  const avg = foods.length ? (foods.reduce((s, f) => s + f.rating, 0) / foods.length).toFixed(1) : '0';
  document.getElementById('avgRating').textContent = avg;

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>还没有记录美食哦～<br>点击"添加美食"开始记录你的美食地图吧！</p></div>`;
    return;

  grid.innerHTML = filtered.map(f => `

      <button class="delete-btn" data-id="${f.id}" title="删除">✕</button>
      ${f.image ? `<div class="card-img"><img src="${esc(f.image)}" alt="${esc(f.dish)}" loading="lazy" onerror="this.parentElement.style.display='none'"></div>` : ''}
      <div class="dish-name">${esc(f.dish)}</div>

      </div>

// ════════════════════════════
//  SPINNING WHEEL
// ════════════════════════════
const wheelCanvas = document.getElementById('wheelCanvas');
const wheelCtx = wheelCanvas.getContext('2d');

const WHEEL_COLORS = [
  '#FF6D3F', '#FFB347', '#FF8A65', '#FFD54F', '#FF7043',
  '#FFCA28', '#FFAB40', '#FFE082', '#FF7E47', '#FFCC02',
  '#FF9E80', '#FFC107', '#FF6E40', '#FFD740', '#FF8D67',
];

function drawWheel(items) {
  const ctx = wheelCtx;
  const cx = wheelCanvas.width / 2;
  const cy = wheelCanvas.height / 2;
  const r = cx - 10;
  ctx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);

  if (!items.length) {
    ctx.fillStyle = '#F5F0E8';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#C0B8A8';
    ctx.font = 'bold 28px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('请添加菜单', cx, cy);
    return;
  }

  const arc = (Math.PI * 2) / items.length;
  const startAngle = -Math.PI / 2;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(wheelRotation);

  // draw segments
  items.forEach((item, i) => {
    const a0 = startAngle + i * arc;
    const a1 = a0 + arc;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, a0, a1);
    ctx.closePath();
    ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // text
    ctx.save();
    ctx.rotate(a0 + arc / 2);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,.3)';
    ctx.shadowBlur = 4;
    const text = item.length > 5 ? item.slice(0, 5) + '…' : item;
    ctx.fillText(text, r - 24, 0);
    ctx.shadowBlur = 0;
    ctx.restore();
  });

  // center circle
  ctx.beginPath();
  ctx.arc(0, 0, 40, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#eee';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#FF6D3F';
  ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🍽️', 0, 0);

  // outer ring decoration
  ctx.beginPath();
  ctx.arc(0, 0, r + 4, 0, Math.PI * 2);
  ctx.strokeStyle = '#FF6D3F';
  ctx.lineWidth = 6;
  ctx.stroke();

  ctx.restore();
}

function renderWheel() {
  drawWheel(wheelItems);
  const list = document.getElementById('wheelList');
  if (!wheelItems.length) {
    list.innerHTML = '<li style="color:#999;justify-content:center">还没有添加项目</li>';
  } else {
    list.innerHTML = wheelItems.map((item, i) => `
      <li>
        <span>${(i + 1)}. ${esc(item)}</span>
        <button class="remove-wheel-item" data-i="${i}">✕</button>
      </li>
    `).join('');
    list.querySelectorAll('.remove-wheel-item').forEach(btn => {
      btn.addEventListener('click', () => {
        wheelItems.splice(+btn.dataset.i, 1);
        saveWheel(wheelItems);
        renderWheel();
        toast('已移除');
      });
    });
  }
}

// Spin logic
document.getElementById('spinBtn').addEventListener('click', () => {
  if (isSpinning) return;
  if (!wheelItems.length) return toast('请先在右侧添加转盘项目');
  isSpinning = true;
  const btn = document.getElementById('spinBtn');
  btn.disabled = true;
  btn.classList.add('spinning');
  btn.textContent = '🎰 转盘中…';

  const minSpins = 4;
  const maxSpins = 8;
  const extraAngle = Math.random() * Math.PI * 2;
  const totalRotation = (Math.PI * 2 * (minSpins + Math.random() * (maxSpins - minSpins))) + extraAngle;
  const duration = 4000 + Math.random() * 2000;
  const startRotation = wheelRotation;
  const targetRotation = startRotation + totalRotation;
  const startTime = performance.now();

  function animate(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    // ease-out cubic
    const eased = 1 - Math.pow(1 - progress, 3);
    wheelRotation = startRotation + totalRotation * eased;
    drawWheel(wheelItems);

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      // done — find the segment under the pointer (at top, -π/2)
      wheelRotation = targetRotation;
      drawWheel(wheelItems);
      const arc = (Math.PI * 2) / wheelItems.length;
      const normRot = ((wheelRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      // In the rotated frame, where does the pointer (top, -π/2) land?
      const pointerAngle = ((-Math.PI / 2 - normRot) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      // Segments start at -π/2 (≡ 3π/2 in 0..2π range). Shift so seg-0 starts at 0.
      const adjusted = (pointerAngle - 3 * Math.PI / 2 + Math.PI * 2) % (Math.PI * 2);
      const idx = Math.floor(adjusted / arc);
      const realWinner = wheelItems[idx];

      isSpinning = false;
      btn.disabled = false;
      btn.classList.remove('spinning');
      btn.textContent = '🎰 开 转！';

      document.getElementById('resultDish').textContent = realWinner;
      document.getElementById('resultPopup').classList.add('open');
    }
  }

  requestAnimationFrame(animate);
});

function renderFitness() {
  renderFitnessPanel('fatloss', 'fatlossGrid');

}

function renderFitnessPanel(type, gridId) {
  const grid = document.getElementById(gridId);
  const items = fitnessData[type] || [];
  if (!items.length) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">🥗</div><p>暂无数据</p></div>`;
    return;
  }
  const cardClass = type === 'fatloss' ? 'fatloss-card' : 'muscle-card';
  grid.innerHTML = items.map((f, i) => `
    <div class="fitness-card ${cardClass}">
      <div class="fitness-info">
        <h5>${esc(f.name)}</h5>
        <div class="macros">
          <span>🔥 ${f.kcal} kcal/100g</span>
          <span>💪 ${f.protein}g 蛋白质/100g</span>
        </div>
      </div>
      <button class="remove-fitness" data-type="${type}" data-i="${i}" title="删除">✕</button>
    </div>
  `).join('');

  grid.querySelectorAll('.remove-fitness').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = btn.dataset.type;
      const i = +btn.dataset.i;
      fitnessData[t].splice(i, 1);
      saveFitness(fitnessData);
      renderFitnessPanel(t, gridId);
    });
  });
}

function addFitnessFood(type) {
  const nameEl = document.getElementById(type + 'Name');
  const kcalEl = document.getElementById(type + 'Kcal');
  const proteinEl = document.getElementById(type + 'Protein');
  const name = nameEl.value.trim();
  const kcal = parseFloat(kcalEl.value);
  const protein = parseFloat(proteinEl.value);
  if (!name) return toast('请输入食物名称');
  if (isNaN(kcal) || isNaN(protein)) return toast('请输入有效的数值');
  fitnessData[type].push({ name, kcal, protein });
  saveFitness(fitnessData);
  nameEl.value = '';
  kcalEl.value = '';
  proteinEl.value = '';
  renderFitnessPanel(type, type === 'fatloss' ? 'fatlossGrid' : 'muscleGrid');
  toast('已添加');
}

document.getElementById('btnFatlossAdd').addEventListener('click', () => addFitnessFood('fatloss'));
document.getElementById('btnMuscleAdd').addEventListener('click', () => addFitnessFood('muscle'));

// Enter key for fitness inputs
['fatloss', 'muscle'].forEach(type => {
  ['Name', 'Kcal', 'Protein'].forEach(field => {
    document.getElementById(type + field).addEventListener('keydown', (e) => {

let currentRegion = REGIONAL_FOODS[0].province;

function renderRegional() {
  const chips = document.getElementById('regionChips');
  const grid = document.getElementById('regionalGrid');

  chips.innerHTML = REGIONAL_FOODS.map(r => `
    <button class="region-chip ${r.province === currentRegion ? 'active' : ''}" data-province="${r.province}">${r.province}</button>
  `).join('');

  chips.querySelectorAll('.region-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      currentRegion = chip.dataset.province;
      renderRegional();
    });
  });

  const region = REGIONAL_FOODS.find(r => r.province === currentRegion);
  if (!region) return;

  grid.innerHTML = region.dishes.map(d => `
    <div class="regional-card">
      <div class="regional-img">
        <img src="${d.img}" alt="${d.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <div class="no-photo" style="display:none">🍽️<span>${d.name}</span></div>
      </div>
      <div class="regional-info">
        <div class="regional-name">${d.name} <a href="https://image.baidu.com/search/index?tn=baiduimage&word=${encodeURIComponent(d.name)}" target="_blank" class="search-real" title="搜${d.name}真实图片">🔍</a></div>
        <div class="regional-desc">${d.desc}</div>
        <div class="regional-tags">${d.tags.map(t => `<span class="tag">#${t}</span>`).join(' ')}</div>
      </div>
    </div>
  `).join('');
}
