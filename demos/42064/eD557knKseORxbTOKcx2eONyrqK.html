<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>药箱体检 创意提案</title><body style="font-family:Arial,Microsoft YaHei,sans-serif;padding:40px;line-height:1.7;background:#f3faf7;color:#10231d"><h1>药箱体检</h1><h2>拍一下药箱，30秒生成家庭用药安全报告</h2><p>面向家庭照护者、老人家庭和有儿童的家庭。产品不做诊断、不推荐剂量，只帮助用户整理家庭药箱，识别过期药、重复用药、儿童误服和缺少常备药风险。</p><h3>核心能力</h3><ol><li>过期药识别</li><li>重复用药风险</li><li>儿童误服预警</li><li>家庭药箱健康评分</li><li>一键生成安全报告</li></ol><p>目标是让家庭药箱从“堆在抽屉里”变成“看得见风险、知道怎么整理”的安全系统。</p></body></html>
