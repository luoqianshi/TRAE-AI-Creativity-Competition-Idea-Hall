<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专注倒计时钟</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.2) 0%, transparent 50%);
            pointer-events: none;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 30px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        input[type="number"] {
            width: 100px;
            height: 50px;
            padding: 0 20px;
            font-size: 1.5rem;
            font-family: 'Orbitron', sans-serif;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: #7877c6;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(120, 119, 198, 0.3);
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .unit {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        .timer-display {
            margin: 30px 0;
            position: relative;
        }

        .circle {
            width: 280px;
            height: 280px;
            margin: 0 auto;
            position: relative;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #7877c6 0%, #ff77c6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .circle::before {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .circle::after {
            content: '';
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: transparent;
            border: 3px solid rgba(255, 255, 255, 0.1);
        }

        .time-text {
            position: relative;
            z-index: 2;
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px rgba(120, 119, 198, 0.5);
            letter-spacing: 5px;
        }

        .time-text span {
            font-size: 2rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.6);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            padding: 15px 35px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-start {
            background: linear-gradient(135deg, #7877c6 0%, #ff77c6 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(120, 119, 198, 0.4);
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(120, 119, 198, 0.5);
        }

        .btn-start:active {
            transform: translateY(-1px);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .btn-pause {
            background: linear-gradient(135deg, #ff9f43 0%, #ff6b6b 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }

        .btn-pause:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.5);
        }

        .btn-resume {
            background: linear-gradient(135deg, #00d2d3 0%, #54a0ff 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(84, 160, 255, 0.4);
        }

        .btn-resume:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(84, 160, 255, 0.5);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .celebration-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .celebration-overlay.active {
            display: flex;
        }

        .celebration-content {
            text-align: center;
            animation: bounceIn 0.8s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .celebration-icon {
            font-size: 8rem;
            margin-bottom: 20px;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .celebration-text {
            font-size: 2.5rem;
            color: #fff;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(255, 119, 198, 0.8);
        }

        .celebration-subtext {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }

        .btn-close {
            padding: 15px 40px;
            font-size: 1rem;
            background: linear-gradient(135deg, #7877c6 0%, #ff77c6 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-close:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(120, 119, 198, 0.5);
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: var(--color);
            border-radius: 50%;
            animation: confetti-fall var(--duration) linear forwards;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .progress-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
                margin: 20px;
            }

            h1 {
                font-size: 1.3rem;
                letter-spacing: 2px;
            }

            .circle {
                width: 220px;
                height: 220px;
            }

            .circle::before {
                width: 195px;
                height: 195px;
            }

            .circle::after {
                width: 205px;
                height: 205px;
            }

            .time-text {
                font-size: 3rem;
                letter-spacing: 3px;
            }

            .time-text span {
                font-size: 1.5rem;
            }

            .celebration-icon {
                font-size: 5rem;
            }

            .celebration-text {
                font-size: 1.8rem;
            }

            input[type="number"] {
                width: 80px;
                height: 45px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <h1>专注倒计时</h1>
        <p class="subtitle">让每一分钟都充满意义</p>

        <div class="input-section">
            <div class="input-group">
                <input type="number" id="minutes-input" placeholder="0" min="1" max="120" value="25">
                <span class="unit">分钟</span>
            </div>
        </div>

        <div class="timer-display">
            <div class="circle">
                <div class="time-text" id="time-display">25<span>:00</span></div>
            </div>
        </div>

        <div class="controls" id="controls">
            <button class="btn-start" id="btn-start">开始</button>
            <button class="btn-reset" id="btn-reset">重置</button>
        </div>
    </div>

    <div class="celebration-overlay" id="celebration">
        <div class="celebration-content">
            <div class="celebration-icon">🎉</div>
            <h2 class="celebration-text">时间到！</h2>
            <p class="celebration-subtext">你已完成专注时光</p>
            <button class="btn-close" id="btn-close">再来一次</button>
        </div>
    </div>

    <script>
        const minutesInput = document.getElementById('minutes-input');
        const timeDisplay = document.getElementById('time-display');
        const controls = document.getElementById('controls');
        const btnStart = document.getElementById('btn-start');
        const btnReset = document.getElementById('btn-reset');
        const celebration = document.getElementById('celebration');
        const btnClose = document.getElementById('btn-close');
        const starsContainer = document.getElementById('stars');

        let totalSeconds = 0;
        let remainingSeconds = 0;
        let timerInterval = null;
        let isPaused = false;

        function createStars() {
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }

        function updateDisplay(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            timeDisplay.innerHTML = `${mins.toString().padStart(2, '0')}<span>:${secs.toString().padStart(2, '0')}</span>`;
        }

        function startTimer() {
            const minutes = parseInt(minutesInput.value) || 25;
            totalSeconds = minutes * 60;
            remainingSeconds = totalSeconds;
            
            minutesInput.disabled = true;
            btnStart.style.display = 'none';
            
            const btnPause = document.createElement('button');
            btnPause.className = 'btn-pause';
            btnPause.id = 'btn-pause';
            btnPause.textContent = '暂停';
            btnPause.addEventListener('click', pauseTimer);
            controls.insertBefore(btnPause, btnReset);

            timerInterval = setInterval(() => {
                if (!isPaused) {
                    remainingSeconds--;
                    updateDisplay(remainingSeconds);

                    if (remainingSeconds <= 0) {
                        clearInterval(timerInterval);
                        showCelebration();
                    }
                }
            }, 1000);
        }

        function pauseTimer() {
            isPaused = true;
            const btnPause = document.getElementById('btn-pause');
            btnPause.remove();

            const btnResume = document.createElement('button');
            btnResume.className = 'btn-resume';
            btnResume.id = 'btn-resume';
            btnResume.textContent = '继续';
            btnResume.addEventListener('click', resumeTimer);
            controls.insertBefore(btnResume, btnReset);
        }

        function resumeTimer() {
            isPaused = false;
            const btnResume = document.getElementById('btn-resume');
            btnResume.remove();

            const btnPause = document.createElement('button');
            btnPause.className = 'btn-pause';
            btnPause.id = 'btn-pause';
            btnPause.textContent = '暂停';
            btnPause.addEventListener('click', pauseTimer);
            controls.insertBefore(btnPause, btnReset);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isPaused = false;
            remainingSeconds = parseInt(minutesInput.value) || 25;
            updateDisplay(remainingSeconds * 60);
            minutesInput.disabled = false;
            
            const btnPause = document.getElementById('btn-pause');
            const btnResume = document.getElementById('btn-resume');
            if (btnPause) btnPause.remove();
            if (btnResume) btnResume.remove();
            
            btnStart.style.display = 'block';
        }

        function showCelebration() {
            celebration.classList.add('active');
            createConfetti();
            playNotificationSound();
        }

        function closeCelebration() {
            celebration.classList.remove('active');
            resetTimer();
            clearConfetti();
        }

        function createConfetti() {
            const colors = ['#ff77c6', '#7877c6', '#00d2d3', '#ff9f43', '#54a0ff', '#ff6b6b'];
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.setProperty('--color', colors[Math.floor(Math.random() * colors.length)]);
                confetti.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
                confetti.style.animationDelay = Math.random() * 2 + 's';
                celebration.appendChild(confetti);
            }
        }

        function clearConfetti() {
            const confettiElements = celebration.querySelectorAll('.confetti');
            confettiElements.forEach(el => el.remove());
        }

        function playNotificationSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
                oscillator.frequency.setValueAtTime(1100, audioContext.currentTime + 0.1);
                oscillator.frequency.setValueAtTime(1320, audioContext.currentTime + 0.2);
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        btnStart.addEventListener('click', startTimer);
        btnReset.addEventListener('click', resetTimer);
        btnClose.addEventListener('click', closeCelebration);

        minutesInput.addEventListener('change', () => {
            const minutes = parseInt(minutesInput.value) || 25;
            if (minutes < 1) minutesInput.value = 1;
            if (minutes > 120) minutesInput.value = 120;
            updateDisplay(minutes * 60);
        });

        createStars();
        updateDisplay(25 * 60);
    </script>
</body>
</html>
