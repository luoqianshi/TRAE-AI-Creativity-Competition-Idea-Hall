    @keyframes trajectoryFlow {

    @keyframes nodeDrift {

      }

    .galaxy-group {

    .timeline {

    .node {

      width: 128px;
      min-width: 128px;
      height: 128px;
      border: 0;
      border-radius: 0;

      cursor: pointer;
      box-shadow: none;
      transition: transform 0.2s ease;
      isolation: isolate;
    }

    .node::after {

    }

    .node.active {
      transform: translateY(-6px);
    }

    .node.related-node .node-day {

      place-items: center;

      box-shadow:

    .node-day::after {

      border: 1px solid rgba(34, 211, 238, 0.18);

        0 0 42px rgba(34, 211, 238, 0.62),
        0 0 72px rgba(139, 92, 246, 0.38);

    .node-title {

    .node-preview {

      left: 50%;
      bottom: -7px;

      height: 12px;

    .keyword-orbit {

      inset: -56px;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.72);
      transition: opacity 0.18s ease, transform 0.24s ease;

    .node > div:not(.keyword-orbit):not(.node-preview) {

      z-index: 2;

    .node:hover .keyword-orbit {

        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.9), rgba(34, 211, 238, 0.82) 36%, rgba(139, 92, 246, 0.42) 72%, transparent 100%);
      box-shadow:
        0 0 10px rgba(34, 211, 238, 0.95),
        0 0 24px rgba(34, 211, 238, 0.42),
        0 0 42px rgba(139, 92, 246, 0.24);
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .keyword-link {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--distance);
      height: 1px;
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.7), rgba(139, 92, 246, 0.08));
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.28);
      transform-origin: left center;
      transform: translate(0, -50%) rotate(var(--angle)) scaleX(0);
      opacity: 0;
      z-index: 1;
    }

    .node:hover .keyword-link {
      animation: linkGrow 0.42s ease both;
    }

    .keyword-particle::after {
      content: attr(data-keyword);
      position: absolute;
      left: 18px;
      top: 50%;
      min-width: max-content;
      transform: translateY(-50%);
      color: rgba(226, 232, 240, 0.9);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-shadow: 0 0 12px rgba(34, 211, 238, 0.55);
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .node:hover .keyword-particle::after {
      opacity: 1;
    }

    .node:hover .keyword-particle {
      animation: keywordBurst 0.52s ease both, keywordFloat 2.6s ease-in-out 0.52s infinite;
    }

    @keyframes linkGrow {
      from {
        opacity: 0;
        transform: translate(0, -50%) rotate(var(--angle)) scaleX(0);
      }
      to {
        opacity: 1;
        transform: translate(0, -50%) rotate(var(--angle)) scaleX(1);
      }
    }

    @keyframes keywordBurst {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.55);
      }
      to {
        opacity: 1;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1);
      }
    }

    @keyframes keywordFloat {
      0%, 100% {
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1);
      }
      50% {
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y) - 7px)) scale(1.04);
      }
    }

    .connector {
      width: 80px;
      min-width: 80px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent2), rgba(139, 92, 246, 0.18));
      position: relative;
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.35);
    }

    .connector::after {
      content: "";
      position: absolute;
      right: -1px;
      top: 50%;
      width: 9px;
      height: 9px;
      border-right: 2px solid var(--accent2);
      border-top: 2px solid var(--accent2);
      transform: translateY(-50%) rotate(45deg);
    }

    .empty {
      min-height: 260px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(34, 211, 238, 0.32);
      border-radius: var(--radius);
      background: rgba(15, 23, 42, 0.5);
    }

    .detail {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      margin-top: 18px;
    }

    .detail-card {
      border: 1px solid var(--rule);
      border-radius: var(--radius-sm);
      padding: 18px;
      background: rgba(15, 23, 42, 0.56);
    }

    .detail-card h3 {
      margin: 0 0 8px;

    .detail-card p {

    }

    .conflict-grid {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .conflict-box {
      border: 1px solid rgba(34, 211, 238, 0.16);
      border-radius: 14px;
      padding: 14px;
      background: rgba(2, 6, 23, 0.28);
    }

    .conflict-box span {
      display: block;
      margin-bottom: 6px;
      color: var(--accent2);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.05em;
    }

    .recall-card {
      margin-bottom: 18px;
      padding: 16px;
      border: 1px solid rgba(34, 211, 238, 0.28);
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.12), rgba(139, 92, 246, 0.12));
      box-shadow: inset 0 0 34px rgba(34, 211, 238, 0.05);
    }

    .recall-card h3 {
      margin: 0 0 8px;
      color: var(--accent2);
      font-size: 16px;
    }

    .recall-card p {
      margin: 0 0 12px;
      color: var(--muted);

    }

    .recall-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .insight-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .insight-card {
      padding: 14px;
      border: 1px solid rgba(34, 211, 238, 0.18);
      border-radius: var(--radius-sm);
      background: rgba(2, 6, 23, 0.3);
    }

    .insight-card span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .insight-card b {
      display: block;
      margin-top: 6px;
      color: var(--accent2);
      font-size: 16px;
      line-height: 1.4;
    }

    .coach-card {
      margin-bottom: 18px;
      padding: 16px;
      border: 1px solid rgba(139, 92, 246, 0.26);
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.14), rgba(34, 211, 238, 0.08));
    }

    .coach-card h3 {
      margin: 0 0 10px;
      color: var(--accent2);
    }

    .coach-card p {
      color: var(--muted);
      line-height: 1.7;
      margin: 8px 0;
    }

    .heat-list {
      display: grid;
      gap: 8px;
      margin: 12px 0;
    }

    .heat-row {
      display: grid;
      grid-template-columns: 96px 1fr auto;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .heat-bar {
      height: 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.8);
      overflow: hidden;
    }

    .heat-bar i {
      display: block;
      height: 100%;
      width: var(--w);
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      box-shadow: 0 0 16px rgba(34, 211, 238, 0.34);
    }

    .related-picker {
      display: grid;
      max-height: 180px;

    .optional-relations {

    .optional-relations summary {

      font-weight: 900;

    .optional-relations .field {

    .emotion-options {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .emotion-options input {

    .emotion-options span {
      display: grid;
      place-items: center;

    .check-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      color: var(--muted);

      line-height: 1.5;

    }

    .mini-grid {
      display: grid;
      gap: 10px;

      border-radius: 14px;

    .tag-line {

    .tag {

      border-radius: 999px;

      background: rgba(139, 92, 246, 0.16);
      border: 1px solid rgba(139, 92, 246, 0.25);
      font-size: 12px;

    .note-modal-content {

    .modal {

      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(2, 6, 23, 0.68);
      z-index: 20;
      backdrop-filter: blur(10px);
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(560px, 100%);
      max-height: 90vh;
      overflow-y: auto;

      border-radius: var(--radius);
      background: var(--bg2);
      border: 1px solid var(--rule);

      .hero,
      .layout,
      .detail {

      }

      .timer-card {

      }

      .galaxy-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .galaxy-viewport {
        padding: 100px 56px 64px;
      }
    }

    @media (max-width: 640px) {
      .app {
        width: min(100vw - 20px, 1180px);
        padding-top: 16px;
      }

      .hero-card,
      .panel,
      .quick-form {
        padding: 18px;
      }

      .stats,
      .row,
      .form-actions,
      .data-actions {

      }

      .track-actions {
        width: 100%;
      }

      .track-actions .btn {

      }

        position: static;
      }

        justify-content: space-between;

        margin-inline: 0;
      }

      .galaxy-group {
        min-width: 440px;
        padding-inline: 44px;
      }

      .galaxy-nodes {
        grid-template-columns: repeat(3, 128px);
      }
    }
  </style>
</head>
<body>
  <canvas class="particle-canvas" id="particleCanvas" aria-hidden="true"></canvas>
  <main class="app">
    <section class="hero">
      <div class="hero-card">
        <span class="eyebrow">知识拓扑 · 认知教练</span>
        <h1>记录学习轨迹</h1>
        <p>用一段自由叙述记录今天的困惑、误解和新理解。系统会提取关键词、识别关联，并把零散笔记沉淀成一张可回看的知识图谱。</p>
        <div class="stats">
          <div class="stat">
            <b id="statTopics">0</b>
            <span>主题</span>
          </div>
          <div class="stat">
            <b id="statRecords">0</b>
            <span>记录</span>
          </div>
          <div class="stat">
            <b id="statHours">0h</b>
            <span>累计投入</span>
          </div>
        </div>
      </div>

      <form class="quick-form hero-card" id="topicForm">
        <h2>新建学习主题</h2>
        <div class="field">
          <label for="topicName">主题名称</label>
          <input id="topicName" required placeholder="例如：人工智能" />
        </div>
        <div class="field">
          <label for="topicGoal">你想解决什么问题？</label>
          <textarea id="topicGoal" placeholder="例如：建立 AI 基础框架，理解机器学习与大模型应用之间的关系"></textarea>
        </div>
        <button class="btn" type="submit">开始这个主题</button>
        <p class="hint">记录会保存在当前浏览器中。建议定期导出 JSON，方便备份和迁移。</p>
        <div class="data-actions">
          <button class="btn secondary" id="exportData" type="button">导出 JSON</button>
          <button class="btn secondary" id="importData" type="button">导入 JSON</button>
          <button class="btn secondary" id="generateDemo" type="button">生成 Demo</button>
        </div>
        <input id="importFile" type="file" accept="application/json,.json" hidden />
      </form>
    </section>

    <section class="layout">
      <aside class="panel">
        <h2>学习主题</h2>
        <div class="topic-list" id="topicList"></div>
      </aside>

      <section class="panel">
        <div id="trackRoot"></div>
      </section>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal" id="recordModal" aria-hidden="true">
    <form class="modal-card" id="recordForm">
      <div class="modal-head">
        <h2>添加一条知识连接</h2>
        <button class="icon-btn" type="button" id="closeModal" aria-label="关闭">×</button>
      </div>

      <input id="recordDate" type="hidden" />
      <input id="recordDuration" type="hidden" />
      <input id="recordTitle" type="hidden" />
      <input id="oldBelief" type="hidden" />
      <input id="newUnderstanding" type="hidden" />
      <input id="recordContent" type="hidden" />
      <input id="recordTags" type="hidden" />
      <p class="hint" id="autoMetaHint">先把闪光点记下来。标题、关键词、理解状态会自动提取，知识连接可以之后再整理。</p>

      <div class="field">
        <label for="freeNarrative">今天哪个问题改变了你的理解？</label>
        <textarea id="freeNarrative" required placeholder="例如：今天我又卡在过拟合上。以前我以为训练准确率高就说明模型学得好，现在意识到验证集表现更能说明泛化能力。这也帮我重新理解了模型训练和评估指标。"></textarea>
      </div>

      <div class="field">
        <label>当下的感觉</label>
        <div class="emotion-options">
          <label><input type="radio" name="recordEmotion" value="卡住" checked /><span>😣 卡住</span></label>
          <label><input type="radio" name="recordEmotion" value="困惑" /><span>🤔 困惑</span></label>
          <label><input type="radio" name="recordEmotion" value="顿悟" /><span>💡 顿悟</span></label>
          <label><input type="radio" name="recordEmotion" value="通透" /><span>😌 通透</span></label>
        </div>
      </div>

      <details class="optional-relations">
        <summary>可选：现在就关联旧问题</summary>
        <div class="field">
          <label>这次理解连接到了哪些旧问题？</label>
          <div class="related-picker" id="relatedPicker"></div>
        </div>
        <div class="field">
          <label for="relationNote">它和旧问题之间的关系是什么？</label>
          <textarea id="relationNote" placeholder="例如：这次理解了验证集，补上了之前“如何判断模型真的学会了”的缺口"></textarea>
        </div>
      </details>

      <input id="recordLevel" type="hidden" />

      <div class="form-actions">
        <button class="btn secondary" type="button" id="cancelRecord">取消</button>
        <button class="btn" type="submit">保存到知识图谱</button>
      </div>
    </form>
  </div>

  <script>
    const STORAGE_KEY = "learning-path-prototype-v1";

    function createId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return `id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    const initialData = {
      topics: [
        {
          id: createId(),
          name: "人工智能",
          goal: "从 AI 基础概念出发，逐步理解机器学习、神经网络与大模型应用之间的关系。",
          records: [
            {
              id: createId(),
              date: "2026-07-06",
              title: "基本概念",
              stuck_point: "AI 到底和普通软件有什么不同？",
              old_belief: "我之前以为 AI 只是功能更复杂的软件。",
              new_understanding: "现在我理解为，AI 的核心区别在于它可以通过数据学习模式，并在不明确写死规则的情况下做出预测或生成内容。",
              content: "了解人工智能的定义、核心概念、典型应用场景，以及它和传统软件的区别。",
              duration: 60,
              tags: ["AI 基础", "核心概念", "应用场景"],
              level: "基本理解",
              emotion: "顿悟",
              narrative: "今天我卡在 AI 和普通软件到底有什么不同。我之前以为 AI 只是功能更复杂的软件，现在理解到它的核心区别是能通过数据学习模式，并在没有写死规则的情况下做预测或生成内容。",
              relatedRecordIds: [],
              relationNotes: {}
            }
          ]
        }
      ],
      activeTopicId: null,
      activeRecordId: null,
      recallPrompt: null,
      timer: null
    };
    initialData.activeTopicId = initialData.topics[0].id;
    initialData.activeRecordId = initialData.topics[0].records[0].id;

    let state = loadState();
    let timerTick = null;
    let galaxyScale = 1;
    let selectedGraphRecordId = null;
    let showReferenceLinks = false;

    function initParticleBackground() {
      const canvas = document.querySelector("#particleCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const pointer = { x: -9999, y: -9999, active: false, pulse: 0 };
      let particles = [];
      let width = 0;
      let height = 0;
      let deviceRatio = Math.min(window.devicePixelRatio || 1, 2);
      let animationFrameId = null;
      let isRunning = false;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        deviceRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * deviceRatio);
        canvas.height = Math.floor(height * deviceRatio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(deviceRatio, 0, 0, deviceRatio, 0, 0);
        createParticles();
      }

      function createParticles() {
        const baseCount = prefersReducedMotion ? 26 : Math.min(110, Math.max(48, Math.floor((width * height) / 15000)));
        particles = Array.from({ length: baseCount }, (_, index) => ({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * (prefersReducedMotion ? 0.12 : 0.42),
          vy: (Math.random() - 0.5) * (prefersReducedMotion ? 0.12 : 0.42),
          radius: Math.random() * 1.8 + 0.8,
          hue: index % 3 === 0 ? "cyan" : "violet"
        }));
      }

      function drawParticle(particle) {
        const glow = particle.hue === "cyan" ? "34, 211, 238" : "139, 92, 246";
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${glow}, 0.82)`;
        ctx.shadowColor = `rgba(${glow}, 0.68)`;
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function connectParticles(first, second, opacity) {
        const gradient = ctx.createLinearGradient(first.x, first.y, second.x, second.y);
        gradient.addColorStop(0, `rgba(34, 211, 238, ${opacity})`);
        gradient.addColorStop(1, `rgba(139, 92, 246, ${opacity})`);
        ctx.beginPath();
        ctx.moveTo(first.x, first.y);
        ctx.lineTo(second.x, second.y);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);

        for (const particle of particles) {
          const dx = pointer.x - particle.x;
          const dy = pointer.y - particle.y;
          const distance = Math.hypot(dx, dy);

          if (pointer.active && distance < 150) {
            const force = (150 - distance) / 150;
            particle.vx -= (dx / Math.max(distance, 1)) * force * 0.028;
            particle.vy -= (dy / Math.max(distance, 1)) * force * 0.028;
          }

          if (pointer.pulse > 0 && distance < 220) {
            const pulseForce = (220 - distance) / 220;
            particle.vx -= (dx / Math.max(distance, 1)) * pulseForce * 0.08;
            particle.vy -= (dy / Math.max(distance, 1)) * pulseForce * 0.08;
          }

          particle.x += particle.vx;
          particle.y += particle.vy;
          particle.vx *= 0.992;
          particle.vy *= 0.992;

          if (particle.x < -20) particle.x = width + 20;
          if (particle.x > width + 20) particle.x = -20;
          if (particle.y < -20) particle.y = height + 20;
          if (particle.y > height + 20) particle.y = -20;
        }

        for (let i = 0; i < particles.length; i += 1) {
          for (let j = i + 1; j < particles.length; j += 1) {
            const first = particles[i];
            const second = particles[j];
            const distance = Math.hypot(first.x - second.x, first.y - second.y);
            if (distance < 118) {
              connectParticles(first, second, (1 - distance / 118) * 0.16);
            }
          }
        }

        if (pointer.active) {
          for (const particle of particles) {
            const distance = Math.hypot(pointer.x - particle.x, pointer.y - particle.y);
            if (distance < 170) {
              connectParticles({ x: pointer.x, y: pointer.y }, particle, (1 - distance / 170) * 0.28);
            }
          }
        }

        for (const particle of particles) {
          drawParticle(particle);
        }

        if (pointer.pulse > 0) {
          ctx.beginPath();
          ctx.arc(pointer.x, pointer.y, (1 - pointer.pulse) * 140 + 18, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(34, 211, 238, ${pointer.pulse * 0.38})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          pointer.pulse = Math.max(0, pointer.pulse - 0.035);
        }

        if (isRunning) {
          animationFrameId = requestAnimationFrame(animate);
        }
      }

      function startAnimation() {
        if (isRunning) return;
        isRunning = true;
        animationFrameId = requestAnimationFrame(animate);
      }

      function stopAnimation() {
        isRunning = false;
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
      }

      window.addEventListener("resize", resize);
      window.addEventListener("pointermove", event => {
        pointer.x = event.clientX;
        pointer.y = event.clientY;
        pointer.active = true;
      });
      window.addEventListener("pointerleave", () => {
        pointer.active = false;
        pointer.x = -9999;
        pointer.y = -9999;
      });
      window.addEventListener("pointerdown", event => {
        pointer.x = event.clientX;
        pointer.y = event.clientY;
        pointer.active = true;
        pointer.pulse = 1;
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          stopAnimation();
        } else {
          startAnimation();
        }
      });

      resize();
      startAnimation();
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) {
        normalizeConflictRecords(initialData);
        initialData.cleanedToSingleExample = true;
        return initialData;
      }
      try {
        const parsed = JSON.parse(saved);
        if (!parsed.topics || !Array.isArray(parsed.topics)) return initialData;
        if (!("timer" in parsed)) parsed.timer = null;
        if (!("recallPrompt" in parsed)) parsed.recallPrompt = null;
        normalizeConflictRecords(parsed);
        trimToSingleExample(parsed);
        return parsed;
      } catch {
        return initialData;
      }
    }

    function trimToSingleExample(data) {
      if (data.cleanedToSingleExample) return;
      const topic = data.topics.find(item => item.name === "人工智能");
      if (!topic) return;
      if (topic.records.length > 1) {
        topic.records = [topic.records[0]];
      }
      topic.records[0].relatedRecordIds = [];
      topic.records[0].relationNotes = {};
      data.topics = [topic];
      data.activeTopicId = topic.id;
      data.activeRecordId = topic.records[0]?.id || null;
      data.recallPrompt = null;
      data.timer = null;
      data.cleanedToSingleExample = true;
    }

    function normalizeConflictRecords(data) {
      data.topics.forEach(topic => {
        topic.records.forEach(record => {
          if (!record.stuck_point) record.stuck_point = record.title || "未命名的问题";
          record.stuck_point = record.stuck_point.replace(/^关于「(.+)」我真正卡住的问题是什么？$/, "$1");
          if (!record.old_belief) record.old_belief = "之前只是记录了学过什么，还没有说清原来的理解。";
          if (!record.new_understanding) record.new_understanding = record.content || "新的理解还没有补充。";
          if (!record.narrative) record.narrative = [record.stuck_point, record.old_belief, record.new_understanding, record.content].filter(Boolean).join(" ");
          if (!Array.isArray(record.relatedRecordIds)) record.relatedRecordIds = record.linked_record_id ? [record.linked_record_id] : [];
          if (!record.relationNotes) record.relationNotes = {};
          if (!record.emotion) record.emotion = /顿悟|理解|发现|意识到/.test(record.narrative || record.content || "") ? "顿悟" : "困惑";
        });
      });
    }

    function seedDemoRelations(topic) {
      if (topic.records.some(record => (record.relatedRecordIds || []).length)) return;
      topic.records.forEach((record, index) => {
        if (index === 0) return;
        const related = [];
        if (topic.records[index - 1]) related.push(topic.records[index - 1].id);
        if (index > 3 && index % 3 === 0) related.push(topic.records[Math.max(0, index - 3)].id);
        record.relatedRecordIds = related;
        record.relationNotes = Object.fromEntries(related.map(id => [id, "这条记录补充或修正了对旧问题的理解。"]));
      });
    }

    function renderGalaxyMap(records, activeRecord) {
      const layout = createParticleTrajectoryLayout(records.length);
      const positionById = new Map(records.map((record, index) => [record.id, layout.positions[index]]));
      const relatedIds = selectedGraphRecordId ? getDirectRelatedIds(records, selectedGraphRecordId) : new Set();

      return `
        <div class="galaxy-viewport">
          <div class="galaxy-map-shell" id="galaxyShell">
            <div class="galaxy-map" id="galaxyMap" style="--galaxy-scale:${galaxyScale};--node-title-size:${Math.max(10, Math.min(12, 12 / galaxyScale)).toFixed(1)}px;width:${layout.width}px;height:${layout.height}px">
              <svg class="trajectory-links" viewBox="0 0 ${layout.width} ${layout.height}" aria-hidden="true">
                ${layout.positions.slice(0, -1).map((point, index) => {
                  const next = layout.positions[index + 1];
                  const c1x = point.cx + (next.cx - point.cx) * 0.45;
                  const c1y = point.cy + Math.sin(index * 0.8) * 52;
                  const c2x = point.cx + (next.cx - point.cx) * 0.65;
                  const c2y = next.cy + Math.cos(index * 0.7) * 52;
                  return `<path class="trajectory-link" d="M ${point.cx} ${point.cy} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${next.cx} ${next.cy}"></path>`;
                }).join("")}
                ${showReferenceLinks ? records.flatMap(record => {
                  const from = positionById.get(record.id);
                  return (record.relatedRecordIds || []).map(targetId => {
                    const to = positionById.get(targetId);
                    if (!from || !to) return "";
                    const strength = getRelationStrength(record, targetId);
                    const highlighted = selectedGraphRecordId && (record.id === selectedGraphRecordId || targetId === selectedGraphRecordId);
                    const dim = selectedGraphRecordId && !highlighted;
                    const c1x = from.cx + (to.cx - from.cx) * 0.35;
                    const c1y = from.cy - 70;
                    const c2x = from.cx + (to.cx - from.cx) * 0.65;
                    const c2y = to.cy + 70;
                    return `<path class="reference-link ${highlighted ? "highlight" : ""} ${dim ? "dim" : ""}" stroke-width="${strength}" marker-end="url(#arrowGlow)" d="M ${from.cx} ${from.cy} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${to.cx} ${to.cy}"></path>`;
                  });
                }).join("") : ""}
                <defs>
                  <marker id="arrowGlow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="rgba(251, 191, 36, 0.9)"></path>
                  </marker>
                </defs>
              </svg>
              ${records.map((record, index) => {
                const point = layout.positions[index];
                const relatedClass = relatedIds.has(record.id) ? "related-node" : "";
                return `
                  <article class="node ${record.id === activeRecord?.id ? "active" : ""} ${relatedClass}" data-record-id="${record.id}" role="button" tabindex="0" aria-label="查看第 ${index + 1} 条记录：${escapeHtml(getStuckPoint(record))}" style="left:${point.x}px;top:${point.y}px;--drift-delay:${(index % 7) * -0.38}s">
                    <div class="keyword-orbit" aria-hidden="true">
                      ${renderKeywordParticles(record)}
                    </div>
                    <div>
                      <div class="node-day">${index + 1}</div>
                      <div class="node-title">${escapeHtml(getStuckPoint(record))}</div>
                    </div>
                    <div class="node-preview">
                      <b>${escapeHtml(getStuckPoint(record))}</b>
                      <p>${escapeHtml(getNewUnderstanding(record))}</p>
                    </div>
                  </article>
                `;
              }).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function createParticleTrajectoryLayout(count) {
      const nodeSize = 128;
      const gapX = 180;
      const padding = 118;
      const width = padding * 2 + Math.max(0, count - 1) * gapX + nodeSize;
      const height = padding * 2 + nodeSize + 36;

      const positions = Array.from({ length: count }, (_, index) => {
        const x = padding + index * gapX;
        const y = padding + Math.sin(index * 0.9) * 18;
        return {
          x: Math.round(x),
          y: Math.round(y),
          cx: Math.round(x + nodeSize / 2),
          cy: Math.round(y + nodeSize / 2)
        };
      });

      return { width, height, positions };
    }

    function bindGalaxyZoom() {
      const map = trackRoot.querySelector("#galaxyMap");
      const shell = trackRoot.querySelector("#galaxyShell");
      const viewport = trackRoot.querySelector(".galaxy-viewport");
      const zoomValue = trackRoot.querySelector("#zoomValue");
      if (!map || !shell || !viewport || !zoomValue) return;

      const updateZoom = () => {
        map.style.setProperty("--galaxy-scale", galaxyScale);
        map.style.setProperty("--node-title-size", `${Math.max(10, Math.min(12, 12 / galaxyScale)).toFixed(1)}px`);
        zoomValue.textContent = `${Math.round(galaxyScale * 100)}%`;
        requestAnimationFrame(() => {
          shell.style.width = `${map.scrollWidth * galaxyScale}px`;
          shell.style.height = `${map.scrollHeight * galaxyScale}px`;
        });
      };

      const zoomOut = trackRoot.querySelector("#zoomOut");
      const zoomIn = trackRoot.querySelector("#zoomIn");
      const zoomReset = trackRoot.querySelector("#zoomReset");
      const toggleReferences = trackRoot.querySelector("#toggleReferences");

      zoomOut?.addEventListener("click", () => {
        galaxyScale = Math.max(0.55, Number((galaxyScale - 0.15).toFixed(2)));
        updateZoom();
      });

      zoomIn?.addEventListener("click", () => {
        galaxyScale = Math.min(1.7, Number((galaxyScale + 0.15).toFixed(2)));
        updateZoom();
      });

      zoomReset?.addEventListener("click", () => {
        galaxyScale = 1;
        updateZoom();
      });

      toggleReferences?.addEventListener("change", event => {
        showReferenceLinks = event.target.checked;
        renderTrack();
      });

      bindGalaxyDrag(viewport);
      updateZoom();
    }

    function bindGalaxyDrag(viewport) {
      let isDragging = false;
      let startX = 0;
      let startY = 0;
      let scrollLeft = 0;
      let scrollTop = 0;

      viewport.addEventListener("pointerdown", event => {
        if (event.target.closest("button, input, textarea, select, .node")) return;
        isDragging = true;
        viewport.classList.add("dragging");
        viewport.setPointerCapture(event.pointerId);
        startX = event.clientX;
        startY = event.clientY;
        scrollLeft = viewport.scrollLeft;
        scrollTop = viewport.scrollTop;
      });

      viewport.addEventListener("pointermove", event => {
        if (!isDragging) return;
        viewport.scrollLeft = scrollLeft - (event.clientX - startX);
        viewport.scrollTop = scrollTop - (event.clientY - startY);
      });

      const stopDragging = event => {
        if (!isDragging) return;
        isDragging = false;
        viewport.classList.remove("dragging");
        if (viewport.hasPointerCapture(event.pointerId)) {
          viewport.releasePointerCapture(event.pointerId);
        }
      };

      viewport.addEventListener("pointerup", stopDragging);
      viewport.addEventListener("pointercancel", stopDragging);
      viewport.addEventListener("pointerleave", stopDragging);
    }

    function getRelationStrength(record, targetId) {

    function getDirectRelatedIds(records, id) {
      const ids = new Set([id]);
      const selected = records.find(record => record.id === id);
      (selected?.relatedRecordIds || []).forEach(item => ids.add(item));
      records.forEach(record => {
        if ((record.relatedRecordIds || []).includes(id)) ids.add(record.id);
      });
      return ids;
    }

    function analyzeKnowledgeGraph(records) {
      const incoming = new Map(records.map(record => [record.id, 0]));
      let edgeCount = 0;
      records.forEach(record => {
        (record.relatedRecordIds || []).forEach(id => {
          if (incoming.has(id)) {
            incoming.set(id, incoming.get(id) + 1);
            edgeCount += 1;
          }
        });
      });
      const foundation = records.reduce((best, record) => {
        if (!best) return record;
        return (incoming.get(record.id) || 0) > (incoming.get(best.id) || 0) ? record : best;
      }, null);
      const memo = new Map();
      const depth = record => {
        if (!record || memo.has(record.id)) return memo.get(record?.id) || 0;
        const children = records.filter(item => (item.relatedRecordIds || []).includes(record.id));
        const value = children.length ? 1 + Math.max(...children.map(depth)) : 1;
        memo.set(record.id, value);
        return value;
      };
      const longestChain = records.length ? Math.max(...records.map(depth)) : 0;
      return { foundation: edgeCount ? foundation : null, edgeCount, longestChain };
    }

    function extractNarrativeMeta(text) {
      const clean = text.trim();
      const sentences = clean.split(/[。！？!?；;\n]/).map(item => item.trim()).filter(Boolean);
      const stuck = sentences.find(item => /卡|不懂|不会|困惑|问题|为什么|哪里不爽/.test(item)) || sentences[0] || "新的学习问题";
      const old = sentences.find(item => /以前|之前|原来|以为|误以为/.test(item)) || "原来的理解还没有完全说清。";
      const newer = sentences.find(item => /现在|发现|理解|意识到|原来是|其实/.test(item) && item !== old) || sentences.at(-1) || clean;
      const tags = extractKeywords(clean);
      const level = /能解释|讲清楚|复述/.test(clean) ? "能解释清楚" : /应用|迁移|实战/.test(clean) ? "能迁移应用" : /理解|发现|意识到/.test(clean) ? "有新理解" : "还卡着";
      return {
        title: stuck.slice(0, 32),
        stuck_point: stuck,
        old_belief: old,
        new_understanding: newer,
        content: clean,
        tags,
        level
      };
    }

    function extractKeywords(text) {
      const dictionary = ["机器学习", "神经网络", "深度学习", "过拟合", "泛化", "验证集", "训练集", "损失函数", "梯度下降", "Transformer", "注意力", "RAG", "提示词", "大语言模型", "评估指标", "NLP", "CNN", "RNN"];
      const found = dictionary.filter(word => text.includes(word));
      return found.length ? found.slice(0, 5) : text.split(/[，,。.；;、\s]+/).filter(item => item.length >= 2).slice(0, 5);
    }

    function generateWeeklyReview(records) {
      const now = new Date();
      const sevenDaysAgo = new Date(now);
      sevenDaysAgo.setDate(now.getDate() - 7);
      const weekRecords = records.filter(record => !record.date || new Date(record.date + "T00:00:00") >= sevenDaysAgo);
      const source = weekRecords.length ? weekRecords : records.slice(-7);
      const areas = new Map();
      source.forEach(record => {
        const area = classifyArea(record);
        areas.set(area, (areas.get(area) || 0) + Number(record.duration || 0));
      });
      const total = Array.from(areas.values()).reduce((sum, value) => sum + value, 0) || 1;
      const heatmap = Array.from(areas.entries())
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(([name, minutes]) => ({ name, minutes, percent: Math.max(8, Math.round(minutes / total * 100)) }));
      const top = heatmap[0];
      const repeated = top && top.percent > 55;
      const emotionCount = source.reduce((map, record) => {
        const key = record.emotion || "困惑";
        map[key] = (map[key] || 0) + 1;
        return map;
      }, {});
      const stuckCount = (emotionCount["卡住"] || 0) + (emotionCount["困惑"] || 0);
      const insightCount = (emotionCount["顿悟"] || 0) + (emotionCount["通透"] || 0);
      const emotionLine = `本周状态：${stuckCount} 次卡住/困惑，${insightCount} 次顿悟/通透。`;
      return {
        heatmap,
        summary: `本周复盘基于 ${source.length} 条记录生成。这里不按日期排列，而是看你的注意力真正流向了哪些知识领域。${emotionLine}`,
        comment: repeated
          ? `教练提醒：你本周 ${top.percent}% 的精力都集中在「${top.name}」。如果这里的“卡住/困惑”偏多，先别急着加新内容，试着把它和旧问题连起来。`
          : `教练点评：这周的知识分布比较均衡。若“顿悟/通透”开始变多，可以把这些节点主动连接到过去的卡点上。`
      };
    }

    function classifyArea(record) {
      const text = [record.title, record.stuck_point, record.content, ...(record.tags || [])].join(" ");
      if (/Transformer|注意力|大语言|提示词|RAG|NLP/.test(text)) return "大模型 / NLP";
      if (/神经|深度|CNN|RNN|卷积|循环/.test(text)) return "神经网络";
      if (/监督|无监督|训练|损失|梯度|过拟合|评估|决策树|森林|泛化/.test(text)) return "机器学习基础";
      if (/产品|应用|场景|反馈|设计/.test(text)) return "AI 应用设计";
      return "基础概念";
    }

    function chooseRecallPrompt(topic, newRecord) {
      const currentDate = new Date((newRecord.date || new Date().toISOString().slice(0, 10)) + "T00:00:00");
      const sevenDaysBefore = new Date(currentDate);
      sevenDaysBefore.setDate(currentDate.getDate() - 7);
      const oldEnough = topic.records.filter(record => {
        if (record.id === newRecord.id || !record.date) return false;
        return new Date(record.date + "T00:00:00") <= sevenDaysBefore;
      });
      const fallback = topic.records.filter(record => record.id !== newRecord.id);
      const basePool = oldEnough.length ? oldEnough : fallback;
      const priorityPool = basePool.filter(record => ["卡住", "困惑"].includes(record.emotion));
      const pool = priorityPool.length ? priorityPool : basePool;
      if (!pool.length) return null;
      const selected = pool[Math.floor(Math.random() * pool.length)];
      return {
        topicId: topic.id,
        recordId: selected.id
      };
    }

    function formatElapsed(milliseconds) {
      const totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
      const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
      const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${hours}:${minutes}:${seconds}`;
    }

      if (timerTick) {
        clearInterval(timerTick);
        timerTick = null;
      }
      if (state.timer) {
        timerTick = setInterval(updateTimerDisplay, 1000);
        updateTimerDisplay();
      }

    function startTimer() {
      const topic = getActiveTopic();
      if (!topic) return;
      if (state.timer && state.timer.topicId !== topic.id) {
        const confirmed = confirm("另一个主题正在计时，是否停止它并为当前主题重新开始？");
        if (!confirmed) return;
      }
      state.timer = {
        topicId: topic.id,
        startedAt: Date.now()
      };
      render();
    }

      const topic = getActiveTopic();
      if (!topic || state.timer?.topicId !== topic.id) return;
      const elapsedMinutes = Math.max(1, Math.ceil((Date.now() - state.timer.startedAt) / 60000));
      state.timer = null;
      saveState();
      openRecordModal(elapsedMinutes);
      renderStats();
      renderTrack();
      syncTimerInterval();

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

          duration: 40,
          tags: ["准确率", "召回率", "F1"],
          level: "能解释清楚",
          emotion: "顿悟"
        },
        {
          date: "2026-07-05",
          title: "注意力机制",
          stuck_point: "注意力机制到底在注意什么？",
          old_belief: "我之前把注意力理解成模型随便挑重点。",
          new_understanding: "注意力是在不同输入之间计算相关性，让模型动态决定哪些信息更重要。",
          content: "注意力机制刚开始很抽象，但和阅读时抓关键词类比后，理解顺了很多。",
          duration: 55,
          tags: ["注意力", "相关性", "上下文"],
          level: "有新理解",
          emotion: "顿悟"
        },
        {
          date: "2026-07-06",
          title: "RAG",
          stuck_point: "为什么大模型还需要外部知识库？",
          old_belief: "我以为模型参数里已经包含了所有知识。",
          new_understanding: "参数记忆不等于可靠知识，RAG 可以把最新、可追溯的信息带进回答上下文。",
          content: "今天理解了 RAG 的价值：不是让模型更会背，而是让回答有来源、有边界。",
          duration: 60,
          tags: ["RAG", "知识库", "检索"],
          level: "能解释清楚",
          emotion: "通透"
        },
        {
          date: "2026-07-07",
          title: "阶段复盘",
          stuck_point: "这些概念之间到底怎么连起来？",
          old_belief: "我之前把每个概念当成独立知识点。",
          new_understanding: "数据质量影响训练，训练效果要靠评估验证，RAG 又是在应用层补足模型边界。",
          content: "复盘后发现自己不是学了很多散点，而是在逐渐形成一条从数据到应用的理解链。",
          duration: 30,
          tags: ["复盘", "知识连接", "学习路径"],
          level: "能迁移应用",
          emotion: "通透"
        }
      ].map(item => ({
        ...item,
        id: createId(),
        narrative: item.content,
        relatedRecordIds: [],
        relationNotes: {}
      }));

      const byTitle = Object.fromEntries(demo.map(record => [record.title, record]));
      const connect = (from, to, note) => {
        byTitle[from].relatedRecordIds.push(byTitle[to].id);
        byTitle[from].relationNotes[byTitle[to].id] = note;
      };
      connect("训练数据", "AI 与普通软件", "理解数据后，才意识到 AI 的学习不是写规则，而是从样本中抽取模式。");
      connect("过拟合", "训练数据", "过拟合说明数据和训练方式会直接影响模型是否真的学会。");
      connect("评估指标", "过拟合", "评估指标帮助判断模型是在泛化，还是只是在记训练集。");
      connect("注意力机制", "评估指标", "理解指标后，再看注意力机制，更容易区分模型关注的信息是否有效。");
      connect("RAG", "注意力机制", "RAG 把外部知识放进上下文，注意力机制决定模型如何利用这些信息。");
      connect("阶段复盘", "RAG", "RAG 是从模型能力走向真实应用的一步。");
      connect("阶段复盘", "训练数据", "数据质量是整条理解链的起点。");
      return demo;
    }

    generateDemoButton.addEventListener("click", () => {
      let topic = getActiveTopic();
      if (!topic) {
        topic = {
          id: createId(),
          name: "人工智能",
          goal: "用一组演示记录理解 AI 学习路径如何从零散笔记变成知识图谱。",
          records: []
        };
        state.topics.unshift(topic);
        state.activeTopicId = topic.id;
      }
      topic.records = buildDemoRecords();
      topic.goal = "用一组演示记录理解 AI 学习路径如何从零散笔记变成知识图谱。";
      state.activeRecordId = topic.records[0].id;
      state.recallPrompt = null;
      showReferenceLinks = true;
      render();
      showToast("Demo 已生成");
    });

    recordForm.addEventListener("submit", event => {
      event.preventDefault();
      const topic = getActiveTopic();
      if (!topic) return;
      const narrative = freeNarrative.value.trim();
      const relatedIds = Array.from(recordModal.querySelectorAll(".related-record-choice:checked")).map(input => input.value);
      const meta = extractNarrativeMeta(narrative);
      const emotion = recordModal.querySelector('input[name="recordEmotion"]:checked')?.value || "困惑";
      const relationText = relationNote.value.trim() || "这条记录和旧问题存在关联，之后可以再补充具体说明。";
      const relationNotes = Object.fromEntries(relatedIds.map(id => [id, relationText]));

      const record = {
        id: createId(),
        date: recordDate.value,
        title: meta.title,
        stuck_point: meta.stuck_point,
        old_belief: meta.old_belief,
        new_understanding: meta.new_understanding,
        content: meta.content,
        narrative,
        duration: Number(recordDuration.value || 0),
        tags: meta.tags,
        level: meta.level,
        emotion,
        relatedRecordIds: relatedIds,
        relationNotes
      };

      topic.records.push(record);
      topic.records.sort((a, b) => String(a.date).localeCompare(String(b.date)));
      state.activeRecordId = record.id;
      state.recallPrompt = chooseRecallPrompt(topic, record);
      closeRecordModal();
      render();
      showToast("记录已加入知识图谱");
    });

    closeModal.addEventListener("click", closeRecordModal);
    cancelRecord.addEventListener("click", closeRecordModal);
    recordModal.addEventListener("click", event => {
      if (event.target === recordModal) closeRecordModal();
    });
    window.addEventListener("keydown", event => {
      if (event.key === "Escape") closeRecordModal();
    });

    initParticleBackground();
    render();
  </script>
</body>
</html>
