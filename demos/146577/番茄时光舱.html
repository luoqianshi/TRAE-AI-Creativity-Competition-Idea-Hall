<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄时光舱 · Pomodoro Capsule</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--space:#1a1a2e;--space2:#16213e;--navy:#0f3460;--orange:#ee6c4d;--cream:#f8f4e3;--gold:#e8b14f;--teal:#3aafa9;--text:#c4c4c4;--muted:#5a5a7a}
  body{font-family:'IBM Plex Mono','Consolas','PingFang SC',monospace;background:var(--space);color:var(--text);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(circle at 50% 0%,rgba(238,108,77,.08),transparent 50%),radial-gradient(circle at 80% 80%,rgba(58,175,169,.06),transparent 50%)}
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite}
  @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.8}}
  .capsule{max-width:900px;margin:0 auto;padding:28px 20px;position:relative;z-index:1}
  header{text-align:center;margin-bottom:32px}
  header .mission{display:inline-block;padding:4px 16px;border:1px solid var(--orange);border-radius:20px;font-size:11px;letter-spacing:4px;color:var(--orange);margin-bottom:12px;text-transform:uppercase}
  header h1{font-size:clamp(24px,4.5vw,36px);font-weight:700;letter-spacing:3px;color:var(--cream)}
  header h1 .tomato{color:var(--orange)}
  header p{margin-top:8px;font-size:13px;color:var(--muted);letter-spacing:2px}

  .mode-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:24px}
  .mtab{padding:9px 20px;background:var(--space2);border:1px solid rgba(238,108,77,.2);color:var(--muted);cursor:pointer;font-size:13px;letter-spacing:1px;transition:all .3s;font-family:inherit;border-radius:6px}
  .mtab:hover{color:var(--cream);border-color:var(--orange)}
  .mtab.active{background:var(--orange);color:var(--space);border-color:var(--orange);font-weight:700}

  .timer-core{background:linear-gradient(145deg,var(--space2),var(--navy));border:1px solid rgba(238,108,77,.2);border-radius:24px;padding:36px;text-align:center;margin-bottom:24px;position:relative;overflow:hidden}
  .timer-core::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--orange),transparent)}
  .timer-ring{position:relative;width:240px;height:240px;margin:0 auto 20px}
  .timer-ring svg{transform:rotate(-90deg);width:100%;height:100%}
  .timer-ring circle{fill:none;stroke-width:8;stroke-linecap:round}
  .timer-ring .track{stroke:rgba(255,255,255,.08)}
  .timer-ring .prog{stroke:var(--orange);transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 6px var(--orange))}
  .timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .timer-display{font-size:52px;font-weight:700;color:var(--cream);letter-spacing:2px;font-variant-numeric:tabular-nums}
  .timer-phase{font-size:12px;color:var(--orange);letter-spacing:3px;margin-top:6px;text-transform:uppercase}
  .timer-controls{display:flex;gap:12px;justify-content:center}
  .tbtn{padding:12px 28px;border:none;border-radius:30px;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:8px}
  .tbtn.primary{background:var(--orange);color:var(--space)}
  .tbtn.primary:hover{background:var(--gold);box-shadow:0 4px 20px rgba(238,108,77,.4)}
  .tbtn.secondary{background:transparent;border:1px solid var(--muted);color:var(--muted)}
  .tbtn.secondary:hover{border-color:var(--cream);color:var(--cream)}

  .session-dots{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
  .sdot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.1);transition:all .4s}
  .sdot.done{background:var(--orange);box-shadow:0 0 8px var(--orange)}
  .sdot.current{background:var(--gold);box-shadow:0 0 12px var(--gold);animation:currentPulse 1.5s infinite}
  @keyframes currentPulse{50%{transform:scale(1.3)}}
  .session-info{text-align:center;font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:28px}

  .two-col{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;margin-bottom:24px}
  .task-box{background:var(--space2);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px}
  .task-box h3{font-size:13px;color:var(--orange);letter-spacing:2px;margin-bottom:14px;text-transform:uppercase}
  .task-input-row{display:flex;gap:8px;margin-bottom:14px}
  .task-input{flex:1;padding:10px 14px;background:var(--space);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:var(--cream);font-family:inherit;font-size:13px;outline:none}
  .task-input:focus{border-color:var(--orange)}
  .task-add{padding:10px 18px;background:var(--orange);color:var(--space);border:none;border-radius:8px;font-family:inherit;font-weight:700;cursor:pointer;font-size:13px}
  .task-list{display:flex;flex-direction:column;gap:8px}
  .task-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--space);border-radius:10px;border:1px solid transparent;transition:all .3s;cursor:pointer}
  .task-item:hover{border-color:rgba(238,108,77,.3)}
  .task-item.active{border-color:var(--orange);background:rgba(238,108,77,.08)}
  .task-item.done{opacity:.4}
  .task-item.done .ti-text{text-decoration:line-through}
  .ti-check{width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
  .task-item.done .ti-check{background:var(--teal);border-color:var(--teal)}
  .task-item.done .ti-check::after{content:'✓';color:var(--space);font-size:12px;font-weight:700}
  .ti-text{flex:1;font-size:13px;color:var(--cream)}
  .ti-pomos{font-size:11px;color:var(--orange);font-weight:700}

  .stats-box{background:var(--space2);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px}
  .stats-box h3{font-size:13px;color:var(--orange);letter-spacing:2px;margin-bottom:14px;text-transform:uppercase}
  .stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
  .stat-row:last-child{border:none}
  .stat-row .sr-label{color:var(--muted)}
  .stat-row .sr-val{color:var(--cream);font-weight:700}
  .stat-row .sr-val .unit{color:var(--muted);font-size:11px;font-weight:400}

  .week-chart{background:var(--space2);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px;margin-bottom:24px}
  .week-chart h3{font-size:13px;color:var(--orange);letter-spacing:2px;margin-bottom:16px;text-transform:uppercase}
  .week-bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px}
  .wb-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
  .wb{width:100%;max-width:30px;background:linear-gradient(180deg,var(--orange),rgba(238,108,77,.3));border-radius:6px 6px 0 0;transition:all .4s cubic-bezier(.34,1.56,.64,1);min-height:4px;position:relative}
  .wb-col:hover .wb{filter:brightness(1.2);transform:scaleY(1.05)}
  .wb .wb-val{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--cream);opacity:0;transition:opacity .3s}
  .wb-col:hover .wb-val{opacity:1}
  .wb-label{font-size:11px;color:var(--muted)}

  .settings-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
  .setting{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--space2);border:1px solid rgba(255,255,255,.08);border-radius:8px;font-size:12px;color:var(--muted)}
  .setting input{width:50px;background:var(--space);border:1px solid rgba(255,255,255,.1);border-radius:4px;color:var(--cream);font-family:inherit;padding:4px 8px;text-align:center;outline:none}
  .setting input:focus{border-color:var(--orange)}

  footer{text-align:center;padding:28px 0;color:var(--muted);font-size:12px;letter-spacing:2px}
  footer .rocket{font-size:18px;margin-bottom:8px}
  @media(max-width:600px){.two-col{grid-template-columns:1fr}.timer-ring{width:200px;height:200px}.timer-display{font-size:40px}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="capsule">
  <header>
    <div class="mission">◆ MISSION: FOCUS ◆</div>
    <h1>番茄<span class="tomato">时光舱</span></h1>
    <p>POMODORO CAPSULE · 专注是一次星际旅行</p>
  </header>

  <div class="mode-tabs">
    <div class="mtab active" data-m="25">🍅 专注 25min</div>
    <div class="mtab" data-m="5">☕ 短休 5min</div>
    <div class="mtab" data-m="15">🌙 长休 15min</div>
  </div>

  <div class="timer-core">
    <div class="timer-ring">
      <svg viewBox="0 0 240 240"><circle class="track" cx="120" cy="120" r="110"/><circle class="prog" id="ringProg" cx="120" cy="120" r="110" stroke-dasharray="691" stroke-dashoffset="0"/></svg>
      <div class="timer-center">
        <div class="timer-display" id="tDisplay">25:00</div>
        <div class="timer-phase" id="tPhase">FOCUS TIME</div>
      </div>
    </div>
    <div class="timer-controls">
      <button class="tbtn primary" id="startBtn">▶ 开始专注</button>
      <button class="tbtn secondary" id="resetBtn">↻ 重置</button>
    </div>
  </div>

  <div class="session-dots" id="sessionDots"></div>
  <div class="session-info" id="sessionInfo">第 1 个番茄 · 完成4个后进入长休息</div>

  <div class="two-col">
    <div class="task-box">
      <h3>📋 任务清单</h3>
      <div class="task-input-row">
        <input class="task-input" id="taskInput" placeholder="输入任务，按回车添加...">
        <button class="task-add" id="taskAdd">+ 添加</button>
      </div>
      <div class="task-list" id="taskList"></div>
    </div>
    <div class="stats-box">
      <h3>📊 今日战绩</h3>
      <div class="stat-row"><span class="sr-label">完成番茄</span><span class="sr-val" id="stPomos">6 <span class="unit">个</span></span></div>
      <div class="stat-row"><span class="sr-label">专注时长</span><span class="sr-val" id="stFocus">150 <span class="unit">分钟</span></span></div>
      <div class="stat-row"><span class="sr-label">完成任务</span><span class="sr-val" id="stTasks">3 <span class="unit">个</span></span></div>
      <div class="stat-row"><span class="sr-label">中断次数</span><span class="sr-val" id="stBreak">1 <span class="unit">次</span></span></div>
      <div class="stat-row"><span class="sr-label">效率评分</span><span class="sr-val" id="stScore">87 <span class="unit">分</span></span></div>
    </div>
  </div>

  <div class="week-chart">
    <h3>📈 本周专注趋势</h3>
    <div class="week-bars" id="weekBars"></div>
  </div>

  <div class="settings-row">
    <div class="setting">🍅 专注 <input type="number" id="setFocus" value="25" min="1" max="60"> min</div>
    <div class="setting">☕ 短休 <input type="number" id="setShort" value="5" min="1" max="30"> min</div>
    <div class="setting">🌙 长休 <input type="number" id="setLong" value="15" min="1" max="60"> min</div>
    <div class="setting">🔁 长休间隔 <input type="number" id="setInterval" value="4" min="2" max="8"> 个</div>
  </div>

  <footer><div class="rocket">🚀 🍅 🚀</div>STAY FOCUSED · TRUST THE PROCESS · 番茄时光舱 © 2026</footer>
</div>
<script>
for(let i=0;i<60;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*2+1;s.style.width=sz+'px';s.style.height=sz+'px';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';document.getElementById('stars').appendChild(s);}

let mode='25',modeMin=25,timeLeft=25*60,running=false,timer=null,session=0,pomoCount=6;
const circ=691;
const phases={25:'FOCUS TIME',5:'SHORT BREAK',15:'LONG BREAK'};
const colors={25:'var(--orange)',5:'var(--teal)',15:'var(--gold)'};

function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function render(){
  document.getElementById('tDisplay').textContent=fmt(timeLeft);
  document.getElementById('tPhase').textContent=phases[mode];
  const pct=timeLeft/(modeMin*60);
  document.getElementById('ringProg').style.strokeDashoffset=circ-circ*(1-pct);
  document.getElementById('ringProg').style.stroke=colors[mode];
  document.getElementById('tPhase').style.color=colors[mode];
}
document.querySelectorAll('.mtab').forEach(t=>{
  t.onclick=()=>{
    if(running)return;
    document.querySelectorAll('.mtab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');mode=t.dataset.m;modeMin=parseInt(mode);timeLeft=modeMin*60;render();
    document.getElementById('startBtn').textContent='▶ '+(mode==='25'?'开始专注':mode==='5'?'开始短休':'开始长休');
  };
});
document.getElementById('startBtn').onclick=function(){
  if(!running){running=true;this.textContent='⏸ 暂停';timer=setInterval(()=>{
    timeLeft--;render();
    if(timeLeft<=0){
      running=false;clearInterval(timer);
      if(mode==='25'){session++;pomoCount++;updateStats();updateDots();checkLongBreak();}
      else{session=0;updateDots();}
      document.getElementById('startBtn').textContent='▶ 开始'+(mode==='25'?'短休':'专注');
      alert(mode==='25'?'番茄完成！该休息了~":"休息结束！开始下一个番茄吧~");
    }
  },1000);}
  else{running=false;this.textContent='▶ 继续';clearInterval(timer);}
};
document.getElementById('resetBtn').onclick=()=>{running=false;clearInterval(timer);timeLeft=modeMin*60;render();document.getElementById('startBtn').textContent='▶ '+(mode==='25'?'开始专注':mode==='5'?'开始短休':'开始长休');};

function checkLongBreak(){
  const interval=parseInt(document.getElementById('setInterval').value)||4;
  if(session>=interval){document.querySelector('[data-m="15"]').click();}
  else{document.querySelector('[data-m="5"]').click();}
}
function updateDots(){
  const interval=parseInt(document.getElementById('setInterval').value)||4;
  const sd=document.getElementById('sessionDots');sd.innerHTML='';
  for(let i=0;i<interval;i++){
    const d=document.createElement('div');d.className='sdot';
    if(i<session)d.classList.add('done');
    else if(i===session)d.classList.add('current');
    sd.appendChild(d);
  }
  document.getElementById('sessionInfo').textContent=`第 ${session+1} 个番茄 · 完成${interval}个后进入长休息`;
}
updateDots();
function updateStats(){
  document.getElementById('stPomos').innerHTML=pomoCount+' <span class="unit">个</span>';
  document.getElementById('stFocus').innerHTML=(pomoCount*25)+' <span class="unit">分钟</span>';
}

// 任务
const tasks=[
  {text:'完成项目方案文档',pomos:2,done:false},{text:'回复重要邮件',pomos:1,done:true},
  {text:'学习React新特性',pomos:3,done:false},{text:'整理本周周报',pomos:1,done:true}
];
let activeTask=0;
function renderTasks(){
  const tl=document.getElementById('taskList');tl.innerHTML='';
  tasks.forEach((t,i)=>{
    const item=document.createElement('div');item.className='task-item'+(t.done?' done':'')+(i===activeTask?' active':'');
    item.innerHTML=`<div class="ti-check"></div><div class="ti-text">${t.text}</div><div class="ti-pomos">🍅 ${t.pomos}</div>`;
    item.querySelector('.ti-check').onclick=(e)=>{e.stopPropagation();t.done=!t.done;renderTasks();updateTaskStats();};
    item.onclick=()=>{activeTask=i;renderTasks();};
    tl.appendChild(item);
  });
  updateTaskStats();
}
function updateTaskStats(){document.getElementById('stTasks').innerHTML=tasks.filter(t=>t.done).length+' <span class="unit">个</span>';}
renderTasks();
document.getElementById('taskAdd').onclick=addTask;
document.getElementById('taskInput').onkeydown=(e)=>{if(e.key==='Enter')addTask();};
function addTask(){const inp=document.getElementById('taskInput');if(!inp.value.trim())return;tasks.push({text:inp.value.trim(),pomos:0,done:false});inp.value='';renderTasks();}

// 周图表
const week=[{d:'一',v:5},{d:'二',v:8},{d:'三',v:6},{d:'四',v:9},{d:'五',v:7},{d:'六',v:3},{d:'日',v:6}];
const wb=document.getElementById('weekBars');
const maxV=Math.max(...week.map(w=>w.v));
week.forEach(w=>{
  const c=document.createElement('div');c.className='wb-col';
  c.innerHTML=`<div class="wb" style="height:${w.v/maxV*100}%"><span class="wb-val">${w.v}🍅</span></div><div class="wb-label">${w.d}</div>`;
  wb.appendChild(c);
});

// 设置
['setFocus','setShort','setLong'].forEach(id=>{
  document.getElementById(id).onchange=function(){
    const val=parseInt(this.value);const m=document.querySelector('.mtab.active');
    if(id==='setFocus'&&m.dataset.m==='25'){modeMin=val;timeLeft=val*60;render();}
    if(id==='setShort'&&m.dataset.m==='5'){modeMin=val;timeLeft=val*60;render();}
    if(id==='setLong'&&m.dataset.m==='15'){modeMin=val;timeLeft=val*60;render();}
  };
});
document.getElementById('setInterval').onchange=function(){updateDots();};
render();
</script>
</body>
</html>
