<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>球序 - 羽毛球线下匹配对战表</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background: #f5f7fa;
      padding: 12px;
      font-size: 15px;
      color: #222;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px #00000012;
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #0d7bff;
    }
    input, button {
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 15px;
      margin-bottom: 10px;
    }
    button {
      border: none;
      background: #0d7bff;
      color: white;
      font-weight: 500;
    }
    button.gray {
      background: #999;
    }
    button.success {
      background: #00b460;
    }
    .player-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }
    .player-tag {
      background: #e8f2ff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
    }
    .match-item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      margin: 10px 0;
    }
    .rank-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .hide {
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">🏸 球序 - 羽毛球对战表</div>
    <input type="text" id="playerInput" placeholder="输入选手姓名，回车添加">
    <button onclick="addPlayer()">添加选手</button>
    <div class="player-list" id="playerBox"></div>
    <button onclick="genMatch()" class="success">随机生成对战循环赛</button>
    <button onclick="clearAll()" class="gray">清空全部数据</button>
  </div>

  <div class="card">
    <div class="title">📋 对战赛程</div>
    <div id="matchBox"></div>
  </div>

  <div class="card">
    <div class="title">🏆 实时积分排名</div>
    <div id="rankBox"></div>
  </div>

  <script>
    let players = [];
    let matches = [];
    let scoreData = {};

    // 添加选手
    function addPlayer() {
      const val = document.getElementById('playerInput').value.trim();
      if (!val || players.includes(val)) return;
      players.push(val);
      scoreData[val] = { win: 0, lose: 0, point: 0 };
      document.getElementById('playerInput').value = '';
      renderPlayer();
    }
    // 渲染选手标签
    function renderPlayer() {
      const box = document.getElementById('playerBox');
      box.innerHTML = '';
      players.forEach(p => {
        box.innerHTML += `<span class="player-tag">${p}</span>`;
      });
    }

    // 随机生成两两对战循环赛
    function genMatch() {
      if (players.length < 2) {
        alert('至少添加2名选手才能生成对战');
        return;
      }
      matches = [];
      // 生成全部两两组合
      for (let i = 0; i < players.length; i++) {
        for (let j = i + 1; j < players.length; j++) {
          matches.push({
            p1: players[i],
            p2: players[j],
            p1Score: null,
            p2Score: null
          });
        }
      }
      // 打乱顺序随机
      matches.sort(() => Math.random() - 0.5);
      renderMatch();
      calcRank();
    }

    // 渲染对战列表
    function renderMatch() {
      const box = document.getElementById('matchBox');
      box.innerHTML = '';
      matches.forEach((m, idx) => {
        let html = `<div class="match-item">
          <div>${idx+1}. ${m.p1} VS ${m.p2}</div>
          <div style="margin-top:8px;display:flex;gap:6px">
            <input value="${m.p1Score??''}" onchange="setScore(${idx},1,this.value)" placeholder="${m.p1}分数">
            <input value="${m.p2Score??''}" onchange="setScore(${idx},2,this.value)" placeholder="${m.p2}分数">
          </div>
        </div>`;
        box.innerHTML += html;
      });
    }

    // 设置单场比分并更新积分
    function setScore(idx, side, num) {
      const n = Number(num);
      if (isNaN(n)) return;
      const m = matches[idx];
      if (side === 1) m.p1Score = n;
      else m.p2Score = n;
      // 重置积分重新计算
      resetScore();
      matches.forEach(mat => {
        const s1 = mat.p1Score, s2 = mat.p2Score;
        if (s1 == null || s2 == null) return;
        if (s1 > s2) {
          scoreData[mat.p1].win++;
          scoreData[mat.p1].point += 2;
          scoreData[mat.p2].lose++;
        } else if (s2 > s1) {
          scoreData[mat.p2].win++;
          scoreData[mat.p2].point += 2;
          scoreData[mat.p1].lose++;
        }
      })
      calcRank();
    }

    // 清空积分数据
    function resetScore() {
      players.forEach(p => {
        scoreData[p] = { win: 0, lose: 0, point: 0 };
      })
    }

    // 计算并渲染排名
    function calcRank() {
      const box = document.getElementById('rankBox');
      const arr = players.map(name => ({
        name,
        ...scoreData[name]
      }))
      // 积分降序、胜场降序
      arr.sort((a,b)=>{
        if(b.point !== a.point) return b.point - a.point;
        return b.win - a.win;
      })
      box.innerHTML = '';
      arr.forEach((item, i) => {
        box.innerHTML += `
        <div class="rank-row">
          <span>${i+1}. ${item.name}</span>
          <span>胜${item.win} 负${item.lose} 积分${item.point}</span>
        </div>`
      })
    }

    // 清空所有数据
    function clearAll() {
      players = [];
      matches = [];
      scoreData = {};
      document.getElementById('playerBox').innerHTML = '';
      document.getElementById('matchBox').innerHTML = '';
      document.getElementById('rankBox').innerHTML = '';
    }

    // 回车快速添加选手
    document.getElementById('playerInput').addEventListener('keydown', e=>{
      if(e.key === 'Enter') addPlayer();
    })
  </script>
</body>
</html>
