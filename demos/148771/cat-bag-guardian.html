<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵呜！小猫书包守护神 🎒🐾</title>
<style>
/* ==================== 全局基础样式 ==================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  overflow-x: hidden;
  position: relative;
  transition: background 0.8s ease;
}

/* ---- 晚上模式：深蓝紫色星空背景 ---- */
body.mode-night {
  background: linear-gradient(165deg, #1E1B4B 0%, #312E81 25%, #4338CA 50%, #5B21B6 75%, #4C1D95 100%);
}

/* ---- 早上模式：暖橙黄朝阳背景 ---- */
body.mode-morning {
  background: linear-gradient(165deg, #FFF7ED 0%, #FFEDD5 30%, #FED7AA 55%, #FDBA74 80%, #FB923C 100%);
}

/* ==================== 背景装饰 ==================== */
body::before,
body::after {
  content: "";
  position: fixed;
  border-radius: 50%;
  z-index: 0;
  pointer-events: none;
  transition: all 0.8s ease;
}

body.mode-night::before {
  width: 350px; height: 350px;
  background: radial-gradient(circle, rgba(167,139,250,0.25) 0%, transparent 70%);
  top: -100px; left: -100px;
}
body.mode-night::after {
  width: 450px; height: 450px;
  background: radial-gradient(circle, rgba(196,181,253,0.15) 0%, transparent 70%);
  bottom: -150px; right: -150px;
}

body.mode-morning::before {
  width: 350px; height: 350px;
  background: radial-gradient(circle, rgba(251,191,36,0.3) 0%, transparent 70%);
  top: -100px; right: -100px;
}
body.mode-morning::after {
  width: 450px; height: 450px;
  background: radial-gradient(circle, rgba(251,146,60,0.2) 0%, transparent 70%);
  bottom: -150px; left: -150px;
}

/* 云朵装饰 */
.cloud {
  position: fixed;
  background: rgba(255,255,255,0.5);
  border-radius: 50px;
  z-index: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
}
body.mode-night .cloud { opacity: 0.15; }
body.mode-morning .cloud { opacity: 0.7; }
.cloud::before, .cloud::after {
  content: "";
  position: absolute;
  background: inherit;
  border-radius: 50%;
}
.cloud-1 { width: 120px; height: 40px; top: 60px; left: 10%; animation: floatCloud 20s ease-in-out infinite; }
.cloud-1::before { width: 50px; height: 50px; top: -25px; left: 20px; }
.cloud-1::after { width: 70px; height: 55px; top: -28px; left: 50px; }
.cloud-2 { width: 100px; height: 35px; top: 120px; right: 15%; animation: floatCloud 25s ease-in-out infinite reverse; }
.cloud-2::before { width: 45px; height: 45px; top: -22px; left: 15px; }
.cloud-2::after { width: 60px; height: 48px; top: -25px; left: 40px; }
.cloud-3 { width: 90px; height: 30px; bottom: 180px; left: 5%; animation: floatCloud 22s ease-in-out infinite 3s; }
.cloud-3::before { width: 40px; height: 40px; top: -20px; left: 12px; }
.cloud-3::after { width: 55px; height: 42px; top: -22px; left: 35px; }

@keyframes floatCloud {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(30px); }
}

/* 漂浮猫爪 */
.floating-paw {
  position: fixed;
  font-size: 28px;
  z-index: 0;
  pointer-events: none;
  animation: floatPaw 15s ease-in-out infinite;
  transition: opacity 0.8s ease;
}
body.mode-night .floating-paw { opacity: 0.08; }
body.mode-morning .floating-paw { opacity: 0.15; }
.floating-paw:nth-child(4) { top: 20%; left: 85%; animation-delay: 0s; font-size: 24px; }
.floating-paw:nth-child(5) { top: 45%; left: 92%; animation-delay: 3s; font-size: 32px; }
.floating-paw:nth-child(6) { top: 70%; left: 3%; animation-delay: 6s; font-size: 26px; }
.floating-paw:nth-child(7) { top: 85%; left: 80%; animation-delay: 9s; font-size: 20px; }
.floating-paw:nth-child(8) { top: 30%; left: 50%; animation-delay: 2s; font-size: 22px; }

@keyframes floatPaw {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-15px) rotate(10deg); }
  75% { transform: translateY(10px) rotate(-5deg); }
}

/* 小星星（仅晚上模式显示） */
.star {
  position: fixed;
  width: 4px; height: 4px;
  background: white;
  border-radius: 50%;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.8s ease;
}
body.mode-night .star { opacity: 0.6; animation: twinkle 2s ease-in-out infinite; }
body.mode-morning .star { opacity: 0; }
.star-1 { top: 15%; left: 20%; animation-delay: 0s; }
.star-2 { top: 25%; left: 80%; animation-delay: 0.5s; }
.star-3 { top: 10%; left: 55%; animation-delay: 1s; }
.star-4 { top: 40%; left: 10%; animation-delay: 1.5s; }
.star-5 { top: 35%; left: 90%; animation-delay: 0.3s; }
.star-6 { top: 5%; left: 35%; animation-delay: 0.8s; }

@keyframes twinkle {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.5); }
}

/* 小太阳（仅早上模式显示） */
.sun-ray {
  position: fixed;
  width: 80px; height: 80px;
  border-radius: 50%;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.8s ease;
}
body.mode-morning .sun-ray { opacity: 0.4; }
body.mode-night .sun-ray { opacity: 0; }
.sun-ray-1 { top: 5%; right: 10%; background: radial-gradient(circle, #FCD34D 0%, transparent 70%); animation: sunPulse 3s ease-in-out infinite; }
.sun-ray-2 { top: 8%; right: 15%; width: 60px; height: 60px; background: radial-gradient(circle, #FBBF24 0%, transparent 70%); animation: sunPulse 3s ease-in-out infinite 0.5s; }

@keyframes sunPulse {
  0%, 100% { transform: scale(1); opacity: 0.4; }
  50% { transform: scale(1.2); opacity: 0.6; }
}

/* ==================== 主容器 ==================== */
.main-container {
  position: relative;
  z-index: 1;
  max-width: 600px;
  margin: 0 auto;
  padding: 20px 20px 40px;
}

/* ==================== 模式切换按钮 ==================== */
.mode-switcher {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-bottom: 25px;
}

.mode-btn {
  padding: 14px 32px;
  font-size: 20px;
  font-weight: 800;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  letter-spacing: 2px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  position: relative;
  overflow: hidden;
}

.mode-btn-night {
  background: linear-gradient(135deg, #4C1D95, #7C3AED);
  color: #E9D5FF;
}
.mode-btn-night:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 6px 20px rgba(124,58,237,0.4); }
.mode-btn-night.active {
  background: linear-gradient(135deg, #6D28D9, #A855F7);
  color: #FFFFFF;
  box-shadow: 0 0 20px rgba(168,85,247,0.5), inset 0 2px 8px rgba(255,255,255,0.2);
  transform: scale(1.08);
}

.mode-btn-morning {
  background: linear-gradient(135deg, #EA580C, #F97316);
  color: #FFF7ED;
}
.mode-btn-morning:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 6px 20px rgba(249,115,22,0.4); }
.mode-btn-morning.active {
  background: linear-gradient(135deg, #F97316, #FB923C);
  color: #FFFFFF;
  box-shadow: 0 0 20px rgba(251,146,60,0.5), inset 0 2px 8px rgba(255,255,255,0.2);
  transform: scale(1.08);
}

/* ==================== 顶部标题区域 ==================== */
.title-section {
  text-align: center;
  margin-bottom: 30px;
  position: relative;
}

/* CSS 纯代码猫耳朵 */
.cat-ears {
  position: relative;
  display: inline-block;
  margin-bottom: 8px;
}

.cat-ear {
  position: absolute;
  top: -40px;
  width: 0;
  height: 0;
  border-left: 26px solid transparent;
  border-right: 26px solid transparent;
  border-bottom: 48px solid;
  z-index: 2;
  transition: border-bottom-color 0.8s ease;
}
body.mode-night .cat-ear { border-bottom-color: #A78BFA; }
body.mode-morning .cat-ear { border-bottom-color: #FDBA74; }

.cat-ear-left { left: -45px; transform: rotate(-12deg); }
.cat-ear-right { right: -45px; transform: rotate(12deg); }

.cat-ear::after {
  content: "";
  position: absolute;
  top: 16px;
  left: -14px;
  width: 0;
  height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-bottom: 26px solid;
  transition: border-bottom-color 0.8s ease;
}
body.mode-night .cat-ear::after { border-bottom-color: #C4B5FD; }
body.mode-morning .cat-ear::after { border-bottom-color: #FED7AA; }

.title-text {
  display: inline-block;
  font-size: 30px;
  font-weight: 900;
  padding: 14px 32px;
  border-radius: 30px;
  position: relative;
  transition: all 0.8s ease;
}

body.mode-night .title-text {
  background: rgba(30,27,75,0.7);
  box-shadow: 0 4px 25px rgba(139,92,246,0.3);
  border: 2px solid rgba(167,139,250,0.3);
}
body.mode-morning .title-text {
  background: rgba(255,255,255,0.9);
  box-shadow: 0 4px 25px rgba(251,146,60,0.2);
  border: 2px solid rgba(253,186,116,0.4);
}

.title-text::before {
  content: "喵呜！小猫书包守护神 🎒🐾";
  position: absolute;
  inset: 0;
  padding: 14px 32px;
  border-radius: 30px;
  transition: all 0.8s ease;
}
body.mode-night .title-text::before {
  background: linear-gradient(135deg, #C4B5FD, #E9D5FF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
body.mode-morning .title-text::before {
  background: linear-gradient(135deg, #EA580C, #F97316);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.subtitle {
  font-size: 17px;
  margin-top: 14px;
  letter-spacing: 2px;
  font-weight: 600;
  transition: color 0.8s ease;
}
body.mode-night .subtitle { color: #C4B5FD; }
body.mode-morning .subtitle { color: #C2410C; }

/* ==================== 卡片网格 ==================== */
.card-grid {
  display: grid;
  gap: 20px;
  padding: 10px 0 30px;
  transition: all 0.5s ease;
}

/* 4列晚上模式 */
.card-grid.grid-4 {
  grid-template-columns: repeat(2, 1fr);
}

/* 3列早上模式 */
.card-grid.grid-3 {
  grid-template-columns: repeat(3, 1fr);
}

@media (max-width: 480px) {
  .card-grid.grid-3 { grid-template-columns: repeat(2, 1fr); }
}

/* 单个物品卡片 —— 更加圆润、对比更强 */
.item-card {
  border-radius: 36px;
  padding: 32px 14px 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
  user-select: none;
  border: 5px solid;
}

/* 未选中状态 */
body.mode-night .item-card {
  background: rgba(49,46,129,0.6);
  border-color: #7C3AED;
  box-shadow: 0 4px 18px rgba(124,58,237,0.25);
}
body.mode-morning .item-card {
  background: rgba(255,255,255,0.92);
  border-color: #FDBA74;
  box-shadow: 0 4px 18px rgba(251,146,60,0.2);
}

.item-card:hover {
  transform: translateY(-4px) scale(1.04);
}
body.mode-night .item-card:hover {
  box-shadow: 0 8px 28px rgba(139,92,246,0.4);
}
body.mode-morning .item-card:hover {
  box-shadow: 0 8px 28px rgba(251,146,60,0.35);
}

.item-card:active {
  transform: translateY(0) scale(0.96);
}

/* 卡片 emoji */
.card-emoji {
  font-size: 52px;
  display: block;
  margin-bottom: 12px;
  transition: transform 0.3s ease;
}

.item-card:hover .card-emoji {
  transform: scale(1.2) rotate(-5deg);
}

/* 卡片文字 */
.card-label {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 1px;
  transition: color 0.3s ease;
}
body.mode-night .card-label { color: #DDD6FE; }
body.mode-morning .card-label { color: #9A3412; }

/* ---- 选中状态 —— 对比更明显 ---- */
body.mode-night .item-card.selected {
  background: linear-gradient(135deg, #10B981, #34D399);
  border-color: #6EE7B7;
  box-shadow: 0 6px 24px rgba(16,185,129,0.45);
}
body.mode-morning .item-card.selected {
  background: linear-gradient(135deg, #84CC16, #A3E635);
  border-color: #D9F99D;
  box-shadow: 0 6px 24px rgba(132,204,22,0.45);
}

body.mode-night .item-card.selected .card-label { color: #064E3B; }
body.mode-morning .item-card.selected .card-label { color: #365314; }

/* 选中后浮现的猫爪印 */
.paw-stamp {
  position: absolute;
  top: 6px;
  right: 10px;
  font-size: 32px;
  opacity: 0;
  transform: scale(0) rotate(-20deg);
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
}
.item-card.selected .paw-stamp {
  opacity: 1;
  transform: scale(1) rotate(-10deg);
}

/* 波纹动画 */
.ripple-effect {
  position: absolute;
  border-radius: 50%;
  transform: scale(0);
  animation: ripple 0.6s ease-out forwards;
  pointer-events: none;
}
body.mode-night .ripple-effect { background: rgba(167,139,250,0.4); }
body.mode-morning .ripple-effect { background: rgba(251,146,60,0.35); }

@keyframes ripple {
  to { transform: scale(4); opacity: 0; }
}

/* ==================== 底部状态栏 ==================== */
.status-bar {
  border-radius: 32px;
  padding: 22px 28px;
  text-align: center;
  transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
  border: 4px solid;
}

/* 晚上模式未选中 */
body.mode-night .status-bar.sleeping {
  background: linear-gradient(135deg, rgba(76,29,149,0.7), rgba(109,40,217,0.6));
  border-color: #8B5CF6;
}
body.mode-night .status-bar.sleeping .status-text { color: #E9D5FF; }

/* 早上模式未选中 */
body.mode-morning .status-bar.sleeping {
  background: linear-gradient(135deg, #FEF3C7, #FDE68A);
  border-color: #FCD34D;
}
body.mode-morning .status-bar.sleeping .status-text { color: #92400E; }

.status-cat-face {
  font-size: 48px;
  margin-bottom: 10px;
  transition: all 0.5s ease;
}

.status-text {
  font-size: 22px;
  font-weight: 800;
  line-height: 1.6;
}

/* 进度圆点 */
.progress-dots {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 14px;
}

.progress-dot {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 4px solid;
  transition: all 0.3s ease;
}

body.mode-night .progress-dot {
  border-color: #7C3AED;
  background: rgba(49,46,129,0.5);
}
body.mode-morning .progress-dot {
  border-color: #FCD34D;
  background: #FEF3C7;
}

body.mode-night .progress-dot.filled {
  background: #A78BFA;
  border-color: #C4B5FD;
  transform: scale(1.25);
  box-shadow: 0 0 10px rgba(167,139,250,0.5);
}
body.mode-morning .progress-dot.filled {
  background: #F97316;
  border-color: #FB923C;
  transform: scale(1.25);
  box-shadow: 0 0 10px rgba(251,146,60,0.4);
}

/* ---- 守护成功状态 ---- */
body.mode-night .status-bar.success {
  background: linear-gradient(135deg, #059669, #10B981);
  border-color: #34D399;
  animation: successPulse 1.5s ease-in-out infinite;
}
body.mode-morning .status-bar.success {
  background: linear-gradient(135deg, #65A30D, #84CC16);
  border-color: #A3E635;
  animation: successPulse 1.5s ease-in-out infinite;
}

@keyframes successPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0.4); }
  50% { box-shadow: 0 0 25px 10px rgba(74,222,128,0.25); }
}

.status-bar.success .status-text { color: #FFFFFF !important; }

/* ==================== 胜利遮罩层 ==================== */
.victory-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,0.4);
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.victory-overlay.show {
  display: flex;
  opacity: 1;
}

/* CSS 纯绘制卡通小猫咪 */
.css-cat {
  position: relative;
  width: 220px;
  height: 200px;
  animation: catBounce 0.8s ease-in-out infinite;
}

@keyframes catBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-18px); }
}

.cat-head {
  position: absolute;
  bottom: 65px;
  left: 50%;
  transform: translateX(-50%);
  width: 150px;
  height: 130px;
  background: #FDE68A;
  border-radius: 75px 75px 55px 55px;
  border: 5px solid #F59E0B;
}

.cat-head::before,
.cat-head::after {
  content: "";
  position: absolute;
  width: 0;
  height: 0;
  border-left: 24px solid transparent;
  border-right: 24px solid transparent;
  border-bottom: 48px solid #FDE68A;
  top: -36px;
}
.cat-head::before { left: 14px; transform: rotate(-10deg); }
.cat-head::after { right: 14px; transform: rotate(10deg); }

.cat-ear-inner-l,
.cat-ear-inner-r {
  position: absolute;
  width: 0;
  height: 0;
  border-left: 13px solid transparent;
  border-right: 13px solid transparent;
  border-bottom: 26px solid #FBCFE8;
  top: -22px;
  z-index: 3;
}
.cat-ear-inner-l { left: 24px; transform: rotate(-10deg); }
.cat-ear-inner-r { right: 24px; transform: rotate(10deg); }

.cat-eye {
  position: absolute;
  width: 28px;
  height: 30px;
  background: #1F2937;
  border-radius: 50%;
  top: 42px;
  animation: catBlink 3s ease-in-out infinite;
}
.cat-eye-left { left: 32px; }
.cat-eye-right { right: 32px; }

.cat-eye::after {
  content: "";
  position: absolute;
  width: 11px;
  height: 11px;
  background: white;
  border-radius: 50%;
  top: 6px;
  left: 6px;
}

@keyframes catBlink {
  0%, 42%, 46%, 100% { transform: scaleY(1); }
  44% { transform: scaleY(0.1); }
}

.cat-nose {
  position: absolute;
  width: 20px;
  height: 16px;
  background: #F9A8D4;
  border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
  top: 68px;
  left: 50%;
  transform: translateX(-50%);
}

.cat-mouth {
  position: absolute;
  top: 82px;
  left: 50%;
  transform: translateX(-50%);
  width: 44px;
  height: 20px;
}
.cat-mouth::before,
.cat-mouth::after {
  content: "";
  position: absolute;
  width: 22px;
  height: 16px;
  border-bottom: 3px solid #92400E;
  border-radius: 0 0 50% 50%;
  top: 0;
}
.cat-mouth::before { left: 0; }
.cat-mouth::after { right: 0; }

.cat-blush {
  position: absolute;
  width: 26px;
  height: 18px;
  background: rgba(249,168,212,0.6);
  border-radius: 50%;
  top: 76px;
}
.cat-blush-l { left: 16px; }
.cat-blush-r { right: 16px; }

.cat-body {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 130px;
  height: 85px;
  background: #FDE68A;
  border-radius: 35px 35px 25px 25px;
  border: 5px solid #F59E0B;
}

.cat-paw-wave {
  position: absolute;
  top: -12px;
  right: -22px;
  width: 40px;
  height: 34px;
  background: #FDE68A;
  border-radius: 50% 50% 40% 40%;
  border: 4px solid #F59E0B;
  transform-origin: bottom center;
  animation: pawWave 0.6s ease-in-out infinite alternate;
}

.cat-paw-wave::after {
  content: "";
  position: absolute;
  bottom: 7px;
  left: 50%;
  transform: translateX(-50%);
  width: 18px;
  height: 14px;
  background: #FBCFE8;
  border-radius: 50%;
}

@keyframes pawWave {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(-25deg); }
}

.cat-tail {
  position: absolute;
  bottom: 18px;
  right: -38px;
  width: 65px;
  height: 65px;
  border: 7px solid #F59E0B;
  border-color: #F59E0B transparent transparent transparent;
  border-radius: 50%;
  transform: rotate(-30deg);
  animation: tailWag 1s ease-in-out infinite alternate;
}

@keyframes tailWag {
  0% { transform: rotate(-30deg); }
  100% { transform: rotate(-10deg); }
}

.victory-text {
  margin-top: 35px;
  font-size: 32px;
  font-weight: 900;
  color: #FFFFFF;
  text-shadow: 0 3px 18px rgba(0,0,0,0.35);
  animation: victoryPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes victoryPop {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.victory-sub {
  margin-top: 12px;
  font-size: 18px;
  color: rgba(255,255,255,0.9);
  font-weight: 600;
}

/* ==================== 礼花 Canvas 层 ==================== */
#confetti-canvas {
  position: fixed;
  inset: 0;
  z-index: 99;
  pointer-events: none;
}

/* ==================== 重置按钮 ==================== */
.reset-btn {

  margin: 25px auto 0;

  color: white;
  border: none;

}

body.mode-night .reset-btn {

}

}

.reset-btn:hover {

  box-shadow: 0 6px 24px rgba(0,0,0,0.25);
}

}

/* ==================== 响应式适配 ==================== */
@media (max-width: 480px) {
  .title-text { font-size: 22px; padding: 12px 22px; }
  .title-text::before { font-size: 22px; padding: 12px 22px; }

  .status-text { font-size: 18px; }
  .css-cat { transform: scale(0.8); }
  .mode-btn { padding: 12px 22px; font-size: 17px; }
  .card-grid.grid-3 { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body class="mode-night">

<!-- 漂浮云朵装饰 -->
<div class="cloud cloud-1"></div>
<div class="cloud cloud-2"></div>
<div class="cloud cloud-3"></div>

<!-- 漂浮猫爪装饰 -->
<span class="floating-paw">🐾</span>
<span class="floating-paw">🐾</span>
<span class="floating-paw">🐾</span>
<span class="floating-paw">🐾</span>
<span class="floating-paw">🐾</span>

<!-- 小星星（仅晚上模式） -->
<span class="star star-1"></span>
<span class="star star-2"></span>
<span class="star star-3"></span>
<span class="star star-4"></span>
<span class="star star-5"></span>

<span class="sun-ray sun-ray-2"></span>

<!-- 主内容区 -->
<div class="main-container">

  <div class="mode-switcher">

    </button>

    </button>

  <!-- 顶部标题 -->
  <div class="title-section">

    <p class="subtitle" id="subtitle-text">晚上啦，把课本和作业装进书包，小猫帮你守着！</p>

<!-- 胜利遮罩层 -->

  <div class="css-cat">

      <div class="cat-ear-inner-l"></div>

      <div class="cat-eye cat-eye-right"></div>

      <div class="cat-blush cat-blush-l"></div>
      <div class="cat-blush cat-blush-r"></div>

    </div>
  </div>

  <div class="victory-sub" id="victory-sub-text">书包整理完毕，明天又是完美的一天～</div>

<script>
// ==================== 模式配置数据 ====================
// 晚上模式：4个卡片 —— 课本、作业本、笔袋、课堂用具
const NIGHT_ITEMS = [
  { emoji: '📘', label: '课本' },
  { emoji: '📝', label: '作业本' },
  { emoji: '✏️', label: '笔袋' },
  { emoji: '🛠️', label: '课堂用具' },
];

// 早上模式：3个卡片 —— 红领巾、水杯、钥匙
const MORNING_ITEMS = [
  { emoji: '🧣', label: '红领巾' },
  { emoji: '🥛', label: '水杯' },
  { emoji: '🔑', label: '钥匙' },
];

// 当前模式
let currentMode = 'night';
// 记录每一张卡片的选中状态
let cardStates = [];
// 是否已经触发过胜利
let hasWon = false;

// ==================== 音频引擎 (Web Audio API) ====================
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

/**
 * 播放"喵~"提示音
 */
function playMeow() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(800, now);
  osc.frequency.exponentialRampToValueAtTime(500, now + 0.15);
  osc.frequency.exponentialRampToValueAtTime(350, now + 0.3);
  gain.gain.setValueAtTime(0.3, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.4);
}

/**
 * 播放"叮咚"提示音
 */
function playDingDong() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;

  const osc1 = ctx.createOscillator();
  const gain1 = ctx.createGain();
  osc1.type = 'sine';
  osc1.frequency.setValueAtTime(1200, now);
  gain1.gain.setValueAtTime(0.25, now);
  gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
  osc1.connect(gain1);
  gain1.connect(ctx.destination);
  osc1.start(now);
  osc1.stop(now + 0.25);

  const osc2 = ctx.createOscillator();
  const gain2 = ctx.createGain();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(800, now + 0.15);
  gain2.gain.setValueAtTime(0, now);
  gain2.gain.setValueAtTime(0.25, now + 0.15);
  gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
  osc2.connect(gain2);
  gain2.connect(ctx.destination);
  osc2.start(now + 0.15);
  osc2.stop(now + 0.5);
}

/**
 * 播放"胜利通关"小乐曲
 */
function playVictoryMusic() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;

  const notes = [
    [523, 0],
    [587, 0.15],
    [659, 0.3],
    [784, 0.45],
    [880, 0.6],
    [1047, 0.8],
    [880, 1.0],
    [1047, 1.2],
    [1175, 1.4],
  ];

  notes.forEach(([freq, offset]) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now + offset);
    gain.gain.setValueAtTime(0, now);
    gain.gain.setValueAtTime(0.2, now + offset);
    gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.2);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now + offset);
    osc.stop(now + offset + 0.25);
  });

  const chordDelay = 1.6;
  [523, 659, 784, 1047].forEach((freq) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now + chordDelay);
    gain.gain.setValueAtTime(0.12, now + chordDelay);
    gain.gain.exponentialRampToValueAtTime(0.01, now + chordDelay + 0.8);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now + chordDelay);
    osc.stop(now + chordDelay + 0.85);
  });
}

// ==================== 模式切换 ====================

/**
 * 切换到指定模式
 * @param {string} mode - 'night' 或 'morning'
 */
function switchMode(mode) {
  if (mode === currentMode) return;
  currentMode = mode;

  // 更新 body 的 class
  document.body.className = mode === 'night' ? 'mode-night' : 'mode-morning';

  // 更新按钮状态
  document.getElementById('btn-night').classList.toggle('active', mode === 'night');
  document.getElementById('btn-morning').classList.toggle('active', mode === 'morning');

  // 更新副标题
  const subtitle = document.getElementById('subtitle-text');
  if (mode === 'night') {
    subtitle.textContent = '晚上啦，把课本和作业装进书包，小猫帮你守着！';
  } else {
    subtitle.textContent = '早上好！出门前要检查红领巾、水杯和钥匙带齐哦～';
  }

  // 重置状态并重新渲染卡片
  hasWon = false;
  renderCards();
  updateProgress();

  // 隐藏胜利遮罩和重置按钮
  document.getElementById('victory-overlay').classList.remove('show');
  document.getElementById('reset-btn').classList.remove('show');

  // 清除礼花
  if (confettiAnimId) {
    cancelAnimationFrame(confettiAnimId);
    confettiAnimId = null;
  }
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  confettiParticles = [];
}

// ==================== 渲染卡片 ====================

/**
 * 根据当前模式渲染卡片和进度圆点
 */
function renderCards() {
  const items = currentMode === 'night' ? NIGHT_ITEMS : MORNING_ITEMS;
  const grid = document.getElementById('card-grid');
  const dotsContainer = document.getElementById('progress-dots');

  // 重置卡片状态数组
  cardStates = new Array(items.length).fill(false);

  // 设置网格列数
  grid.className = currentMode === 'night' ? 'card-grid grid-4' : 'card-grid grid-3';

  // 生成卡片 HTML
  grid.innerHTML = items.map((item, i) => `
    <div class="item-card" onclick="toggleCard(this)" data-index="${i}">
      <span class="paw-stamp">🐾</span>
      <span class="card-emoji">${item.emoji}</span>
      <span class="card-label">${item.label}</span>
    </div>
  `).join('');

  // 生成进度圆点
  dotsContainer.innerHTML = items.map((_, i) => `
    <div class="progress-dot" data-index="${i}"></div>
  `).join('');

  // 重置状态栏
  const statusBar = document.getElementById('status-bar');
  const statusFace = document.getElementById('status-face');
  const statusText = document.getElementById('status-text');

  statusBar.className = 'status-bar sleeping';
  statusFace.textContent = '😸';

  if (currentMode === 'night') {
    statusText.innerHTML = '💤 小猫在睡觉，书包还没整理完喵...';
  } else {
    statusText.innerHTML = '☀️ 小猫刚睡醒，出门前别忘了检查喵...';
  }
}

// ==================== 卡片点击逻辑 ====================

function toggleCard(card) {
  if (hasWon) return;

  const index = parseInt(card.dataset.index);
  cardStates[index] = !cardStates[index];

  if (cardStates[index]) {
    card.classList.add('selected');
    if (Math.random() > 0.5) {
      playMeow();
    } else {
      playDingDong();
    }
    addRipple(card);
  } else {
    card.classList.remove('selected');
    playMeow();
  }

  updateProgress();
  checkVictory();
}

function addRipple(card) {
  const ripple = document.createElement('div');
  ripple.classList.add('ripple-effect');
  ripple.style.width = '50px';
  ripple.style.height = '50px';
  ripple.style.left = '50%';
  ripple.style.top = '50%';
  ripple.style.marginLeft = '-25px';
  ripple.style.marginTop = '-25px';
  card.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
}

// ==================== 进度更新 ====================

function updateProgress() {
  const count = cardStates.filter(s => s).length;
  const total = cardStates.length;
  const dots = document.querySelectorAll('.progress-dot');
  const statusBar = document.getElementById('status-bar');
  const statusFace = document.getElementById('status-face');
  const statusText = document.getElementById('status-text');

  dots.forEach((dot, i) => {
    if (cardStates[i]) {
      dot.classList.add('filled');
    } else {
      dot.classList.remove('filled');
    }
  });

  if (count === 0) {
    statusFace.textContent = '😸';
    if (currentMode === 'night') {
      statusText.innerHTML = '💤 小猫在睡觉，书包还没整理完喵...';
    } else {
      statusText.innerHTML = '☀️ 小猫刚睡醒，出门前别忘了检查喵...';
    }
    statusBar.className = 'status-bar sleeping';
  } else if (count < total) {
    statusFace.textContent = '🐱';
    statusText.innerHTML = `🔍 已检查 ${count}/${total} 件物品，继续加油喵！`;
    statusBar.className = 'status-bar sleeping';
  }
}

// ==================== 胜利检测与特效 ====================

function checkVictory() {
  const allSelected = cardStates.every(s => s);
  const total = cardStates.length;

  if (allSelected && !hasWon) {
    hasWon = true;

    const statusBar = document.getElementById('status-bar');
    const statusFace = document.getElementById('status-face');
    const statusText = document.getElementById('status-text');
    const victorySub = document.getElementById('victory-sub-text');

    statusBar.className = 'status-bar success';
    statusFace.textContent = '😻';

    if (currentMode === 'night') {
      statusText.innerHTML = '🌙 守护成功！书包整理完毕，安心睡觉吧，喵呜！';
      victorySub.textContent = '书包整理完毕，明天又是完美的一天～';
    } else {
      statusText.innerHTML = '☀️ 守护成功！出门物品带齐啦，祝你一天愉快，喵呜！';
      victorySub.textContent = '出门前检查完毕，放心去上学吧～';
    }

    setTimeout(() => {
      document.getElementById('victory-overlay').classList.add('show');
    }, 400);

    setTimeout(() => {
      startConfetti();
    }, 300);

    setTimeout(() => {
      playVictoryMusic();
    }, 500);

    setTimeout(() => {
      document.getElementById('reset-btn').classList.add('show');
    }, 2000);
  }
}

// ==================== 礼花特效 (Canvas 绘制) ====================

let confettiParticles = [];
let confettiAnimId = null;

function startConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');

  const colors = [
    '#F472B6', '#EC4899', '#F9A8D4',
    '#FBBF24', '#FDE68A', '#FCD34D',
    '#60A5FA', '#93C5FD', '#BFDBFE',
    '#4ADE80', '#86EFAC', '#BBF7D0',
    '#C084FC', '#D8B4FE',
  ];

  for (let i = 0; i < 200; i++) {
    confettiParticles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height * 0.5 - canvas.height * 0.3,
      size: Math.random() * 10 + 4,
      vy: Math.random() * 3 + 1.5,
      vx: (Math.random() - 0.5) * 3,
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      type: Math.floor(Math.random() * 3),
      wobble: Math.random() * 10,
      wobbleSpeed: Math.random() * 0.1 + 0.02,
      alpha: 1,
    });
  }

  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    frame++;

    let aliveCount = 0;
    confettiParticles.forEach(p => {
      p.y += p.vy;
      p.x += p.vx + Math.sin(frame * p.wobbleSpeed) * 0.8;
      p.rotation += p.rotationSpeed;

      if (p.y > canvas.height) {
        p.alpha -= 0.02;
      }

      if (p.alpha > 0) {
        aliveCount++;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;

        if (p.type === 0) {
          ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        } else if (p.type === 1) {
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          const s = p.size / 2;
          ctx.beginPath();
          ctx.arc(0, 0, s, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(-s * 0.7, -s * 0.8, s * 0.45, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(s * 0.7, -s * 0.8, s * 0.45, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(0, -s * 1.3, s * 0.45, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    });

    if (aliveCount > 0) {
      confettiAnimId = requestAnimationFrame(animate);
    } else {
      cancelAnimationFrame(confettiAnimId);
      confettiAnimId = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  animate();
}

// ==================== 关闭胜利遮罩 & 重置 ====================

function closeVictory() {
  document.getElementById('victory-overlay').classList.remove('show');
}

function resetAll() {
  hasWon = false;
  cardStates.fill(false);

  document.querySelectorAll('.item-card').forEach(card => {
    card.classList.remove('selected');
  });

  const statusBar = document.getElementById('status-bar');
  const statusFace = document.getElementById('status-face');
  const statusText = document.getElementById('status-text');

  statusBar.className = 'status-bar sleeping';
  statusFace.textContent = '😸';

  if (currentMode === 'night') {
    statusText.innerHTML = '💤 小猫在睡觉，书包还没整理完喵...';
  } else {
    statusText.innerHTML = '☀️ 小猫刚睡醒，出门前别忘了检查喵...';
  }

  document.querySelectorAll('.progress-dot').forEach(dot => {
    dot.classList.remove('filled');
  });

  document.getElementById('victory-overlay').classList.remove('show');
  document.getElementById('reset-btn').classList.remove('show');

  if (confettiAnimId) {
    cancelAnimationFrame(confettiAnimId);
    confettiAnimId = null;
  }
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  confettiParticles = [];
}

// ==================== 页面初始化 ====================
document.addEventListener('DOMContentLoaded', () => {
  // 默认渲染晚上模式
  renderCards();

  // 首次点击唤醒 AudioContext
  document.body.addEventListener('click', () => {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }, { once: true });
});
</script>
