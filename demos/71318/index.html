<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS 射击游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
        
        #game-container { width: 100vw; height: 100vh; position: relative; }
        #game-container canvas { display: block; width: 100%; height: 100%; }
        
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        #top-hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; }
        
        #health-section { display: flex; flex-direction: column; }
        #health-label { color: #ff4444; font-size: 14px; font-weight: bold; margin-bottom: 4px; }
        #health-bar-container { width: 200px; height: 24px; background: rgba(0,0,0,0.6); border-radius: 4px; overflow: hidden; border: 2px solid #333; }
        #health-bar { height: 100%; background: linear-gradient(90deg, #ff0000, #ff6600); transition: width 0.2s; }
        
        #wave-section { text-align: center; color: #fff; font-size: 24px; font-weight: bold; text-shadow: 0 0 10px rgba(255, 200, 0, 0.8); }
        #wave-number { color: #ffd700; }
        #wave-progress { font-size: 14px; color: #aaa; margin-top: 4px; }
        
        #ammo-section { display: flex; flex-direction: column; align-items: flex-end; }
        #ammo-label { color: #44ff44; font-size: 14px; font-weight: bold; margin-bottom: 4px; }
        #ammo-display { font-size: 28px; font-weight: bold; color: #fff; }
        #ammo-count { color: #44ff44; }
        #ammo-divider { color: #666; margin: 0 4px; }
        #reserve-count { color: #888; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.8); }
        #crosshair::before { width: 2px; height: 40px; top: 0; left: 50%; transform: translateX(-50%); }
        #crosshair::after { width: 40px; height: 2px; top: 50%; left: 0; transform: translateY(-50%); }
        #crosshair-center { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: #ff4444; border-radius: 50%; transform: translate(-50%, -50%); }
        
        #hit-marker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; opacity: 0; pointer-events: none; }
        #hit-marker::before, #hit-marker::after { content: ''; position: absolute; background: #ff0000; }
        #hit-marker::before { width: 4px; height: 30px; top: 35px; left: 48px; }
        #hit-marker::after { width: 30px; height: 4px; top: 48px; left: 35px; }
        
        #damage-indicator { position: absolute; top: 40%; left: 50%; transform: translateX(-50%); color: #ff0000; font-size: 36px; font-weight: bold; opacity: 0; text-shadow: 0 0 20px rgba(255,0,0,0.8); }
        
        #kill-streak { position: absolute; top: 100px; right: 20px; color: #ffd700; font-size: 20px; font-weight: bold; opacity: 0; text-shadow: 0 0 10px rgba(255,215,0,0.8); }
        
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #start-screen h1 { color: #ff4500; font-size: 5rem; margin-bottom: 1rem; text-shadow: 0 0 30px rgba(255,69,0,0.8); }
        #start-screen p { color: #fff; font-size: 1.2rem; margin-bottom: 0.5rem; }
        #start-btn { margin-top: 2rem; padding: 1.2rem 4rem; font-size: 1.8rem; background: linear-gradient(45deg, #ff4500, #ff6347); border: none; border-radius: 10px; color: #fff; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        #start-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255,69,0,0.8); }
        
        #death-screen, #victory-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #death-screen h1 { color: #ff0000; font-size: 5rem; margin-bottom: 1rem; text-shadow: 0 0 30px rgba(255,0,0,0.8); }
        #victory-screen h1 { color: #00ff00; font-size: 5rem; margin-bottom: 1rem; text-shadow: 0 0 30px rgba(0,255,0,0.8); }
        .end-score { color: #fff; font-size: 2rem; margin-bottom: 1rem; }
        .end-score span { color: #ffd700; }
        .retry-btn { padding: 1.2rem 4rem; font-size: 1.8rem; background: linear-gradient(45deg, #00ff00, #32cd32); border: none; border-radius: 10px; color: #000; cursor: pointer; transition: transform 0.2s; }
        .retry-btn:hover { transform: scale(1.05); }
        
        #click-to-play { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 99; cursor: pointer; }
        #click-to-play p { color: #fff; font-size: 2rem; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        
        #enemy-health-bars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .enemy-health-bar { position: absolute; transform: translateX(-50%); }
        .enemy-health-bar-container { width: 60px; height: 6px; background: rgba(0,0,0,0.6); border-radius: 3px; overflow: hidden; }
        .enemy-health-fill { height: 100%; background: #ff0000; }
        .enemy-health-label { text-align: center; color: #ff0000; font-size: 10px; margin-top: 2px; }
        
        #muzzle-flash { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; background: radial-gradient(circle, rgba(255,200,0,1) 0%, rgba(255,100,0,0.5) 50%, transparent 70%); border-radius: 50%; transform: translate(-50%, -50%); opacity: 0; pointer-events: none; z-index: 5; }
        
        #reload-indicator { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); color: #ffaa00; font-size: 24px; font-weight: bold; opacity: 0; text-shadow: 0 0 10px rgba(255,170,0,0.8); }
        
        #inventory { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; pointer-events: none; }
        .inventory-slot { width: 60px; height: 60px; background: rgba(0,0,0,0.7); border: 2px solid #444; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; }
        .inventory-slot:hover { border-color: #ffaa00; }
        .inventory-slot.full { border-color: #ff4444; }
        .inventory-item-name { font-size: 10px; color: #fff; text-align: center; }
        .inventory-item-price { font-size: 8px; color: #44ff44; }
        
        #inventory-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; z-index: 200; }
        #inventory-header { padding: 20px; text-align: center; color: #fff; font-size: 24px; font-weight: bold; }
        #inventory-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 40px; }
        .inventory-slot-large { width: 150px; height: 150px; background: rgba(255,255,255,0.1); border: 3px solid #444; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .inventory-slot-large:hover { border-color: #ffaa00; transform: scale(1.05); }
        .inventory-slot-large.full { border-color: #ff4444; }
        .inventory-slot-large.common { border-color: #4CAF50; }
        .inventory-slot-large.uncommon { border-color: #2196F3; }
        .inventory-slot-large.rare { border-color: #9C27B0; }
        .inventory-slot-large.legendary { border-color: #FFC107; }
        .inventory-item-name-large { font-size: 16px; color: #fff; text-align: center; font-weight: bold; }
        .inventory-item-price-large { font-size: 14px; color: #44ff44; }
        .inventory-item-desc-large { font-size: 12px; color: #aaa; text-align: center; margin-top: 5px; }
        #inventory-hint { text-align: center; color: #666; font-size: 14px; padding: 10px; }
        
        #search-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; z-index: 200; }
        #search-header { padding: 20px; text-align: center; color: #fff; font-size: 24px; font-weight: bold; }
        #search-items { flex: 1; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .search-item { background: rgba(50,50,50,0.8); border: 2px solid #333; border-radius: 8px; padding: 15px; cursor: pointer; transition: all 0.2s; }
        .search-item:hover { border-color: #ffaa00; transform: scale(1.02); }
        .search-item.common { border-color: #888; }
        .search-item.uncommon { border-color: #44ff44; }
        .search-item.rare { border-color: #4488ff; }
        .search-item.legendary { border-color: #ffaa00; }
        .search-item-name { color: #fff; font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .search-item-price { color: #44ff44; font-size: 14px; margin-bottom: 5px; }
        .search-item-desc { color: #aaa; font-size: 12px; }
        #search-close { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 12px 40px; font-size: 18px; background: #ff4444; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        #search-close:hover { background: #ff6666; }
        
        #item-info { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); border: 2px solid #444; border-radius: 8px; padding: 15px 25px; display: none; pointer-events: none; max-width: 300px; }
        #item-info-name { color: #fff; font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        #item-info-price { color: #44ff44; font-size: 14px; margin-bottom: 5px; }
        #item-info-desc { color: #aaa; font-size: 12px; }
        
        #search-prompt { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(45deg, #ff4500, #ff6347); color: #fff; padding: 15px 30px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; display: none; z-index: 50; box-shadow: 0 0 20px rgba(255,69,0,0.5); pointer-events: none; }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; }
        
        #map-name { position: absolute; top: 60px; left: 20px; color: #fff; font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        class AudioManager {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.enabled = true;
            }

            playShot() {
                if (!this.enabled) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playHit() {
                if (!this.enabled) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.05);
                
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }

            playDeath() {
                if (!this.enabled) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.3);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playReload() {
                if (!this.enabled) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.setValueAtTime(600, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playDamage() {
                if (!this.enabled) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.2);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
        }

        class Item {
            constructor(data) {
                this.id = Math.random().toString(36).substr(2, 9);
                this.name = data.name;
                this.price = data.price;
                this.desc = data.desc;
                this.rarity = data.rarity;
            }
        }

        class Inventory {
            constructor(game) {
                this.game = game;
                this.slots = new Array(5).fill(null);
                this.element = document.getElementById('inventory');
                this.updateUI();
            }

            addItem(item) {
                for (let i = 0; i < this.slots.length; i++) {
                    if (this.slots[i] === null) {
                        this.slots[i] = item;
                        this.updateUI();
                        return true;
                    }
                }
                return false;
            }

            removeItem(index) {
                const item = this.slots[index];
                if (item) {
                    this.slots[index] = null;
                    this.updateUI();
                    return item;
                }
                return null;
            }

            isFull() {
                return this.slots.every(slot => slot !== null);
            }

            getEmptySlots() {
                return this.slots.filter(slot => slot === null).length;
            }

            updateUI() {
                const slots = this.element.querySelectorAll('.inventory-slot');
                slots.forEach((slot, index) => {
                    const item = this.slots[index];
                    slot.innerHTML = '';
                    slot.classList.remove('full');
                    
                    if (item) {
                        slot.classList.add('full');
                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'inventory-item-name';
                        nameSpan.textContent = item.name;
                        const priceSpan = document.createElement('span');
                        priceSpan.className = 'inventory-item-price';
                        priceSpan.textContent = `$${item.price}`;
                        slot.appendChild(nameSpan);
                        slot.appendChild(priceSpan);
                        
                        slot.onclick = () => {
                            if (this.game.player.isSearching) return;
                            const removed = this.removeItem(index);
                            if (removed) {
                                this.game.dropItem(removed);
                            }
                        };
                    } else {
                        slot.onclick = null;
                    }
                });
            }
        }

        class SupplyPoint {
            constructor(game, position, name, rarityMultiplier = 1) {
                this.game = game;
                this.position = position;
                this.name = name;
                this.rarityMultiplier = rarityMultiplier;
                this.searched = false;
                this.items = [];
                
                this.mesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.5, 0.5, 0.3, 16),
                    new THREE.MeshStandardMaterial({ color: 0xffaa00 })
                );
                this.mesh.position.set(position.x, 0.15, position.z);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                game.scene.add(this.mesh);
                
                const glow = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.6, 0.6, 0.2, 16),
                    new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.3 })
                );
                glow.position.set(position.x, 0.15, position.z);
                this.glow = glow;
                game.scene.add(glow);
                
                this.generateItems();
            }

            generateItems() {
                const itemCount = 3 + Math.floor(Math.random() * 4);
                for (let i = 0; i < itemCount; i++) {
                    const item = this.generateRandomItem();
                    this.items.push(item);
                }
            }

            generateRandomItem() {
                const rand = Math.random() * 100;
                let rarity;
                
                const weights = {
                    common: 60 / this.rarityMultiplier,
                    uncommon: 25 / this.rarityMultiplier,
                    rare: 12 / this.rarityMultiplier,
                    legendary: 3 / this.rarityMultiplier
                };
                
                const totalWeight = weights.common + weights.uncommon + weights.rare + weights.legendary;
                
                const normalizedRand = rand / 100 * totalWeight;
                
                if (normalizedRand < weights.common) {
                    rarity = 'common';
                } else if (normalizedRand < weights.common + weights.uncommon) {
                    rarity = 'uncommon';
                } else if (normalizedRand < weights.common + weights.uncommon + weights.rare) {
                    rarity = 'rare';
                } else {
                    rarity = 'legendary';
                }
                
                const itemData = ITEM_TYPES[rarity][Math.floor(Math.random() * ITEM_TYPES[rarity].length)];
                return new Item({ ...itemData, rarity });
            }

            getItems() {
                return this.items;
            }

            removeItem(itemId) {
                const index = this.items.findIndex(item => item.id === itemId);
                if (index !== -1) {
                    return this.items.splice(index, 1)[0];
                }
                return null;
            }

            hasItems() {
                return this.items.length > 0;
            }

            update(dt) {
                const time = Date.now() * 0.005;
                this.glow.scale.setScalar(1 + Math.sin(time) * 0.2);
                this.glow.material.opacity = 0.3 + Math.sin(time) * 0.1;
            }
        }

        class Player {
            constructor(game) {
                this.game = game;
                this.scene = game.scene;
                this.camera = game.camera;
                
                this.position = new THREE.Vector3(0, 2, 5);
                this.velocity = new THREE.Vector3();
                
                this.yaw = 0;
                this.pitch = 0;
                
                this.moveSpeed = 5;
                this.jumpForce = 0.45;
                this.gravity = 9.8;
                
                this.width = 0.6;
                this.height = 1.8;
                
                this.health = 100;
                this.maxHealth = 100;
                
                this.isOnGround = true;
                this.isDead = false;
                this.isSearching = false;
                
                this.weapon = new Weapon(this);
                this.gunModel = this.createGunModel();
                this.inventory = new Inventory(game);
                
                this.keys = {};
                this.setupInput();
            }

            createGunModel() {
                const group = new THREE.Group();
                
                const bodyGeo = new THREE.BoxGeometry(0.4, 0.15, 1.2);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8, roughness: 0.2 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.set(0, 0, -0.6);
                body.castShadow = true;
                group.add(body);
                
                const barrelGeo = new THREE.CylinderGeometry(0.04, 0.05, 0.8, 16);
                const barrelMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9, roughness: 0.1 });
                const barrel = new THREE.Mesh(barrelGeo, barrelMat);
                barrel.rotation.z = Math.PI / 2;
                barrel.position.set(0, 0.02, -1.2);
                barrel.castShadow = true;
                group.add(barrel);
                
                const gripGeo = new THREE.BoxGeometry(0.2, 0.25, 0.5);
                const gripMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.6, roughness: 0.3 });
                const grip = new THREE.Mesh(gripGeo, gripMat);
                grip.position.set(0, -0.15, -0.2);
                grip.castShadow = true;

                const sightMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.9, roughness: 0.1 });
                const sight = new THREE.Mesh(sightGeo, sightMat);
                sight.position.set(0, 0.08, -0.3);
                group.add(sight);
                
                const stockGeo = new THREE.BoxGeometry(0.3, 0.2, 0.6);

                stock.position.set(0, -0.02, 0.3);
                group.add(stock);
                
                group.position.set(0.2, -0.15, -0.5);
                this.camera.add(group);
                this.scene.add(this.camera);
                
                return group;
            }

            setupInput() {
                document.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    if (e.code === 'Space' && this.isOnGround && !this.isDead) {
                        this.jump();
                    }
                    if (e.code === 'KeyR' && !this.isDead) {
                        this.weapon.reload();
                    }
                    if (e.code === 'KeyF' && !this.isDead) {
                        if (this.isSearching) {
                            this.game.closeSearchUI();
                        } else if (this.game.currentSupplyPoint && this.game.currentSupplyPoint.hasItems()) {
                            this.game.openSearchUI(this.game.currentSupplyPoint);
                        }
                    }
                    if (e.code === 'KeyB' && !this.isDead && this.game.searchUI.style.display !== 'flex') {
                        if (this.game.isInventoryOpen) {
                            this.game.closeInventory();
                        } else {
                            document.exitPointerLock();
                            setTimeout(() => {
                                this.game.openInventory();
                            }, 50);
                        }
                    }
                    if (e.code === 'Escape' && this.isSearching) {
                        this.game.closeSearchUI();
                    }
                });
                
                document.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });
                
                document.addEventListener('mousemove', (e) => {
                    if (this.game.isRunning && document.pointerLockElement) {
                        const sensitivity = 0.002;
                        this.yaw -= e.movementX * sensitivity;
                        this.pitch -= e.movementY * sensitivity;
                        this.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, this.pitch));
                    }
                });
                
                document.addEventListener('mousedown', (e) => {
                    if (e.button === 0 && !this.isDead && !this.isSearching) {
                        this.weapon.shoot();
                    }
                });
            }

            jump() {
                this.velocity.y = Math.sqrt(2 * this.jumpForce * this.gravity);
                this.isOnGround = false;
            }

            update(dt) {
                if (this.isDead || this.isSearching) return;
                
                this.velocity.y -= this.gravity * dt;
                
                const moveDir = new THREE.Vector3();
                if (this.keys['KeyW']) moveDir.z -= 1;
                if (this.keys['KeyS']) moveDir.z += 1;
                if (this.keys['KeyA']) moveDir.x -= 1;
                if (this.keys['KeyD']) moveDir.x += 1;
                
                if (moveDir.length() > 0) {
                    moveDir.normalize();
                    moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw);
                    moveDir.y = 0;
                    this.velocity.x = moveDir.x * this.moveSpeed;
                    this.velocity.z = moveDir.z * this.moveSpeed;
                } else {
                    this.velocity.x = 0;
                    this.velocity.z = 0;
                }
                
                const moveAmount = this.velocity.clone().multiplyScalar(dt);
                
                const nextPosX = this.position.clone();
                nextPosX.x += moveAmount.x;
                
                const nextPosZ = this.position.clone();
                nextPosZ.z += moveAmount.z;
                
                const nextPosFull = this.position.clone().add(moveAmount);
                
                if (!this.checkWallCollision(nextPosX)) {
                    this.position.x = nextPosX.x;
                }
                
                if (!this.checkWallCollision(nextPosZ)) {
                    this.position.z = nextPosZ.z;
                }
                
                this.position.y += moveAmount.y;
                
                const groundY = this.getGroundHeight(this.position);
                if (this.position.y - this.height / 2 <= groundY + 0.1) {
                    this.position.y = groundY + this.height / 2;
                    this.velocity.y = 0;
                    this.isOnGround = true;
                } else {
                    this.isOnGround = false;
                }
                
                this.updateCamera();
                this.weapon.update(dt);
            }

            updateCamera() {
                this.camera.position.copy(this.position);
                this.camera.rotation.set(this.pitch, this.yaw, 0, 'YXZ');
                
                if (this.gunModel) {
                    const recoil = this.weapon.recoil;
                    this.gunModel.position.x = 0.2 + recoil * 0.1;
                    this.gunModel.position.y = -0.15 - recoil * 0.05;
                    this.gunModel.position.z = -0.5 - recoil * 0.1;
                }
            }

            checkGroundCollision(pos) {
                const groundY = this.getGroundHeight(pos);
                return pos.y - this.height / 2 <= groundY + 0.1;
            }

            getGroundHeight(pos) {
                if (Math.abs(pos.x) > 48 || Math.abs(pos.z) > 48) {
                    return -1000;
                }
                
                let height = 0;
                this.game.obstacles.forEach(obs => {
                    const box = new THREE.Box3().setFromObject(obs);
                    if (pos.x > box.min.x - this.width && pos.x < box.max.x + this.width &&
                        pos.z > box.min.z - this.width && pos.z < box.max.z + this.width) {
                        const obsTop = box.max.y;
                        if (obsTop > height) height = obsTop;
                    }
                });
                return height;
            }

            checkWallCollision(pos) {
                const playerBox = new THREE.Box3(
                    new THREE.Vector3(pos.x - this.width/2, pos.y - this.height/2, pos.z - this.width/2),
                    new THREE.Vector3(pos.x + this.width/2, pos.y + this.height/2, pos.z + this.width/2)
                );
                
                for (const wall of this.game.walls) {
                    const wallBox = new THREE.Box3().setFromObject(wall);
                    if (playerBox.intersectsBox(wallBox)) return true;
                }
                
                for (const obs of this.game.obstacles) {
                    const obsBox = new THREE.Box3().setFromObject(obs);
                    if (playerBox.intersectsBox(obsBox)) return true;
                }
                
                return false;
            }

            takeDamage(amount) {
                this.health -= amount;
                this.game.hud.showDamage(amount);
                this.game.audio.playDamage();
                
                if (this.health <= 0) {
                    this.health = 0;
                    this.die();
                }
                
                this.game.hud.updateHealth(this.health, this.maxHealth);
            }

            die() {
                this.isDead = true;
                this.game.gameOver();
            }
        }

        class Weapon {
            constructor(player) {
                this.player = player;
                this.game = player.game;
                
                this.ammo = 30;
                this.maxAmmo = 30;
                this.reserveAmmo = 120;
                
                this.fireRate = 0.12;
                this.lastShotTime = 0;
                
                this.damage = 25;
                this.range = 100;
                
                this.isReloading = false;
                this.reloadTime = 1.2;
                this.reloadStartTime = 0;
                
                this.recoil = 0;
                this.recoilDecay = 8;
                
                this.game.hud.updateAmmo(this.ammo, this.reserveAmmo);
            }

            shoot() {
                if (this.isReloading || this.ammo <= 0 || !this.game.isRunning) return;
                
                const now = Date.now();
                if (now - this.lastShotTime < this.fireRate * 1000) return;
                
                this.lastShotTime = now;
                this.ammo--;
                
                this.recoil = 1;
                this.game.hud.showMuzzleFlash();
                this.game.audio.playShot();
                
                this.game.hud.updateAmmo(this.ammo, this.reserveAmmo);
                
                const raycaster = new THREE.Raycaster();
                raycaster.set(this.player.camera.position, this.player.camera.getWorldDirection(new THREE.Vector3()));
                
                const intersects = raycaster.intersectObjects(this.game.enemies.map(e => e.mesh), true);
                
                if (intersects.length > 0) {
                    const hit = intersects[0];
                    let obj = hit.object;
                    while (obj && !obj.userData.enemy) obj = obj.parent;
                    
                    if (obj && obj.userData.enemy) {
                        obj.userData.enemy.takeDamage(this.damage);
                        this.game.hud.showHitMarker();
                        this.game.audio.playHit();
                    }
                }
                
                if (this.ammo === 0 && this.reserveAmmo > 0) {
                    this.reload();
                }
            }

            reload() {
                if (this.isReloading || this.ammo === this.maxAmmo || this.reserveAmmo === 0) return;
                
                this.isReloading = true;
                this.reloadStartTime = Date.now();
                this.game.hud.showReload(true);
                this.game.audio.playReload();
            }

            update(dt) {
                if (this.isReloading) {
                    const elapsed = (Date.now() - this.reloadStartTime) / 1000;
                    if (elapsed >= this.reloadTime) {
                        const amount = Math.min(this.maxAmmo - this.ammo, this.reserveAmmo);
                        this.ammo += amount;
                        this.reserveAmmo -= amount;
                        this.isReloading = false;
                        this.game.hud.showReload(false);
                        this.game.hud.updateAmmo(this.ammo, this.reserveAmmo);
                    }
                }
                
                this.recoil -= this.recoilDecay * dt;
                if (this.recoil < 0) this.recoil = 0;
            }
        }

        class Enemy {
            constructor(game, type = 'normal') {
                this.game = game;
                this.type = type;
                this.active = true;
                
                this.stats = this.getStats(type);
                this.health = this.stats.health;
                this.maxHealth = this.stats.health;
                
                this.position = this.getSpawnPosition();
                this.velocity = new THREE.Vector3();
                this.targetPosition = new THREE.Vector3();
                
                this.mesh = this.createMesh();
                this.game.scene.add(this.mesh);
                
                this.attackTimer = 0;
                this.patrolTimer = 0;
                this.moveDir = new THREE.Vector3((Math.random()-0.5), 0, (Math.random()-0.5)).normalize();
                
                this.healthBarId = this.game.hud.createEnemyHealthBar(this);
            }

            getStats(type) {
                switch(type) {
                    case 'fast':
                        return { health: 30, speed: 3, damage: 10, color: 0xffaa00 };
                    case 'tank':
                        return { health: 100, speed: 1.2, damage: 25, color: 0x888888 };
                    default:
                        return { health: 50, speed: 1.8, damage: 15, color: 0xff0000 };
                }
            }

            getSpawnPosition() {
                const side = Math.floor(Math.random() * 4);
                let x, z;
                switch(side) {
                    case 0: x = -35 - Math.random() * 5; z = (Math.random() - 0.5) * 50; break;
                    case 1: x = 35 + Math.random() * 5; z = (Math.random() - 0.5) * 50; break;
                    case 2: x = (Math.random() - 0.5) * 50; z = -35 - Math.random() * 5; break;
                    case 3: x = (Math.random() - 0.5) * 50; z = 35 + Math.random() * 5; break;
                }
                return new THREE.Vector3(x, 1, z);
            }

            createMesh() {
                const group = new THREE.Group();
                
                const bodyGeo = new THREE.BoxGeometry(1.2, 1.6, 1.2);
                const bodyMat = new THREE.MeshStandardMaterial({ color: this.stats.color });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.8;
                body.castShadow = true;
                body.receiveShadow = true;
                body.userData.enemy = this;
                group.add(body);
                
                const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
                const headMat = new THREE.MeshStandardMaterial({ color: this.stats.color });
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 2;
                head.castShadow = true;
                head.receiveShadow = true;
                group.add(head);
                
                const eyeGeo = new THREE.SphereGeometry(0.1, 8, 8);
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
                eyeL.position.set(-0.25, 2.1, 0.35);
                group.add(eyeL);
                const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
                eyeR.position.set(0.25, 2.1, 0.35);
                group.add(eyeR);
                
                const pupilGeo = new THREE.SphereGeometry(0.05, 8, 8);
                const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                const pupilL = new THREE.Mesh(pupilGeo, pupilMat);
                pupilL.position.set(-0.25, 2.1, 0.38);
                group.add(pupilL);
                const pupilR = new THREE.Mesh(pupilGeo, pupilMat);
                pupilR.position.set(0.25, 2.1, 0.38);
                group.add(pupilR);
                
                group.position.copy(this.position);
                return group;
            }

            update(dt) {
                if (!this.active) return;
                
                const playerPos = this.game.player.position;
                const currentPos = this.mesh.position.clone();
                const toPlayer = new THREE.Vector3().subVectors(playerPos, currentPos);
                const distance = toPlayer.length();
                
                this.patrolTimer += dt;
                
                if (distance < 25) {
                    this.moveDir = toPlayer.normalize();
                    this.moveDir.y = 0;
                } else if (this.patrolTimer > 3) {
                    this.moveDir.set((Math.random()-0.5), 0, (Math.random()-0.5)).normalize();
                    this.patrolTimer = 0;
                }
                
                const moveAmount = this.moveDir.clone().multiplyScalar(this.stats.speed * dt);
                
                let nextPos = currentPos.clone().add(moveAmount);
                nextPos.y = 1;
                
                const enemySize = 0.6;
                const enemyBox = new THREE.Box3(
                    new THREE.Vector3(nextPos.x - enemySize, 0.2, nextPos.z - enemySize),
                    new THREE.Vector3(nextPos.x + enemySize, 2.4, nextPos.z + enemySize)
                );
                
                let canMove = true;
                
                for (const wall of this.game.walls) {
                    const wallBox = new THREE.Box3().setFromObject(wall);
                    if (enemyBox.intersectsBox(wallBox)) {
                        canMove = false;
                        break;
                    }
                }
                
                if (canMove) {
                    for (const obs of this.game.obstacles) {
                        const obsBox = new THREE.Box3().setFromObject(obs);
                        if (enemyBox.intersectsBox(obsBox)) {
                            canMove = false;
                            break;
                        }
                    }
                }
                
                if (canMove) {
                    for (const enemy of this.game.enemies) {
                        if (enemy === this || !enemy.active) continue;
                        const otherBox = new THREE.Box3(
                            new THREE.Vector3(enemy.mesh.position.x - enemySize, 0.2, enemy.mesh.position.z - enemySize),
                            new THREE.Vector3(enemy.mesh.position.x + enemySize, 2.4, enemy.mesh.position.z + enemySize)
                        );
                        if (enemyBox.intersectsBox(otherBox)) {
                            canMove = false;
                            break;
                        }
                    }
                }
                
                if (canMove) {
                    nextPos.x = Math.max(-43, Math.min(43, nextPos.x));
                    nextPos.z = Math.max(-43, Math.min(43, nextPos.z));
                    this.mesh.position.copy(nextPos);
                }
                
                this.mesh.lookAt(playerPos.x, this.mesh.position.y, playerPos.z);
                
                const actualDistance = this.mesh.position.distanceTo(playerPos);
                this.attackTimer += dt;
                if (actualDistance < 1.8 && this.attackTimer > 1.2) {
                    this.game.player.takeDamage(this.stats.damage);
                    this.attackTimer = 0;
                }
                
                this.game.hud.updateEnemyHealthBar(this);
            }

            takeDamage(amount) {
                this.health -= amount;
                
                if (this.health <= 0) {
                    this.die();
                }
                
                this.game.hud.updateEnemyHealthBar(this);
            }

            die() {
                this.active = false;
                this.game.scene.remove(this.mesh);
                this.game.hud.removeEnemyHealthBar(this.healthBarId);
                this.game.audio.playDeath();
                
                this.game.addKill();
                
                const explosionParticles = [];
                for (let i = 0; i < 20; i++) {
                    const geo = new THREE.SphereGeometry(0.2, 8, 8);
                    const mat = new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xff6600 : 0xffff00 });
                    const p = new THREE.Mesh(geo, mat);
                    p.position.copy(this.mesh.position);
                    p.position.y += 1;
                    p.userData = {
                        vel: new THREE.Vector3((Math.random()-0.5)*8, (Math.random()-0.5)*8, (Math.random()-0.5)*8),
                        life: 1
                    };
                    this.game.scene.add(p);
                    explosionParticles.push(p);
                }
                
                setTimeout(() => {
                    explosionParticles.forEach(p => this.game.scene.remove(p));
                }, 500);
            }
        }

        class HUD {
            constructor(game) {
                this.game = game;
                
                this.healthBar = document.getElementById('health-bar');
                this.ammoCount = document.getElementById('ammo-count');
                this.reserveCount = document.getElementById('reserve-count');
                this.waveNumber = document.getElementById('wave-number');
                this.waveProgress = document.getElementById('wave-progress');
                
                this.hitMarker = document.getElementById('hit-marker');
                this.damageIndicator = document.getElementById('damage-indicator');
                this.killStreak = document.getElementById('kill-streak');
                this.muzzleFlash = document.getElementById('muzzle-flash');
                this.reloadIndicator = document.getElementById('reload-indicator');
                
                this.enemyHealthBars = {};
            }

            updateHealth(health, maxHealth) {
                const percent = (health / maxHealth) * 100;
                this.healthBar.style.width = `${percent}%`;
                
                if (percent > 50) {
                    this.healthBar.style.background = 'linear-gradient(90deg, #00ff00, #44ff44)';
                } else if (percent > 25) {
                    this.healthBar.style.background = 'linear-gradient(90deg, #ffaa00, #ffcc00)';
                } else {
                    this.healthBar.style.background = 'linear-gradient(90deg, #ff0000, #ff6600)';
                }
            }

            updateAmmo(ammo, reserve) {
                this.ammoCount.textContent = ammo;
                this.reserveCount.textContent = reserve;
                
                if (ammo < 10) {
                    this.ammoCount.style.color = '#ff4444';
                } else {
                    this.ammoCount.style.color = '#44ff44';
                }
            }

            updateWave(wave, current, total) {
                this.waveNumber.textContent = wave;
                this.waveProgress.textContent = `${current}/${total}`;
            }

            showHitMarker() {
                this.hitMarker.style.opacity = '1';
                setTimeout(() => {
                    this.hitMarker.style.opacity = '0';
                }, 200);
            }

            showDamage(amount) {
                this.damageIndicator.textContent = `-${amount}`;
                this.damageIndicator.style.opacity = '1';
                this.damageIndicator.style.transform = 'translateX(-50%) translateY(0)';
                
                setTimeout(() => {
                    this.damageIndicator.style.opacity = '0';
                    this.damageIndicator.style.transform = 'translateX(-50%) translateY(-30px)';
                }, 500);
            }

            showKillStreak(streak) {
                if (streak >= 5) {
                    this.killStreak.textContent = `连杀 x${streak}!`;
                    this.killStreak.style.opacity = '1';
                    setTimeout(() => {
                        this.killStreak.style.opacity = '0';
                    }, 1500);
                }
            }

            showMuzzleFlash() {
                this.muzzleFlash.style.opacity = '1';
                setTimeout(() => {
                    this.muzzleFlash.style.opacity = '0';
                }, 50);
            }

            showReload(show) {
                this.reloadIndicator.style.opacity = show ? '1' : '0';
            }

            createEnemyHealthBar(enemy) {
                const id = Math.random().toString(36).substr(2, 9);
                const bar = document.createElement('div');
                bar.className = 'enemy-health-bar';
                bar.id = `enemy-hp-${id}`;
                bar.innerHTML = `
                    <div class="enemy-health-bar-container">
                        <div class="enemy-health-fill" style="width: 100%"></div>
                    </div>
                    <div class="enemy-health-label">${enemy.type === 'fast' ? '快速' : enemy.type === 'tank' ? '重装' : '普通'}</div>
                `;
                document.getElementById('enemy-health-bars').appendChild(bar);
                this.enemyHealthBars[id] = bar;
                return id;
            }

            updateEnemyHealthBar(enemy) {
                const bar = this.enemyHealthBars[enemy.healthBarId];
                if (!bar) return;
                
                const screenPos = enemy.mesh.position.clone();
                screenPos.y += 2.5;
                screenPos.project(this.game.camera);
                
                const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;
                
                if (screenPos.z > 1) {
                    bar.style.display = 'none';
                } else {
                    bar.style.display = 'block';
                    bar.style.left = `${x}px`;
                    bar.style.top = `${y}px`;
                    
                    const fill = bar.querySelector('.enemy-health-fill');
                    fill.style.width = `${(enemy.health / enemy.maxHealth) * 100}%`;
                }
            }

            removeEnemyHealthBar(id) {
                const bar = document.getElementById(`enemy-hp-${id}`);
                if (bar) bar.remove();
                delete this.enemyHealthBars[id];
            }
        }

            setupScene() {
                this.scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);
                
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
                this.scene.add(ambientLight);
                
                const dirLight = new THREE.DirectionalLight(0xffffff, 1);
                dirLight.position.set(20, 40, 20);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 2048;
                dirLight.shadow.mapSize.height = 2048;
                dirLight.shadow.camera.near = 0.5;
                dirLight.shadow.camera.far = 100;
                dirLight.shadow.camera.left = -50;
                dirLight.shadow.camera.right = 50;
                dirLight.shadow.camera.top = 50;
                dirLight.shadow.camera.bottom = -50;
                this.scene.add(dirLight);
                
                const hemisphereLight = new THREE.HemisphereLight(0x87ceeb, 0x567d46, 0.3);
                this.scene.add(hemisphereLight);
                
                const grassTexture = this.createGrassTexture();
                const brickTexture = this.createBrickTexture();
                const woodTexture = this.createWoodTexture();
                const metalTexture = this.createMetalTexture();
                
                const groundGeo = new THREE.PlaneGeometry(100, 100);
                const groundMat = new THREE.MeshStandardMaterial({ map: grassTexture });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                this.scene.add(ground);
                
                this.createOuterWalls(brickTexture);
                this.createBuildings(brickTexture, woodTexture, metalTexture);

                this.createLampPosts();

            createGrassTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#567d46';
                ctx.fillRect(0, 0, 256, 256);
                
                for (let i = 0; i < 2000; i++) {
                    const x = Math.random() * 256;
                    const y = Math.random() * 256;
                    const size = Math.random() * 2 + 1;
                    const green = Math.floor(Math.random() * 30 + 60);
                    ctx.fillStyle = `rgb(${green}, ${green + 20}, ${green - 10})`;
                    ctx.fillRect(x, y, size, size);
                }
                
                for (let i = 0; i < 500; i++) {
                    const x = Math.random() * 256;
                    const y = Math.random() * 256;
                    ctx.fillStyle = '#3d5a33';
                    ctx.fillRect(x, y, 3, 3);
                }
                
                const texture = new THREE.CanvasTexture(canvas);
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(5, 5);
                return texture;
            }
            
            createBrickTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(0, 0, 256, 256);
                
                ctx.strokeStyle = '#3d1a00';
                ctx.lineWidth = 2;
                
                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const offset = row % 2 === 0 ? 0 : 16;
                        const x = col * 32 + offset;
                        const y = row * 32;
                        ctx.strokeRect(x, y, 30, 28);
                        
                        const lightness = Math.random() * 0.2 + 0.8;
                        ctx.fillStyle = `rgba(139, 69, 19, ${lightness})`;
                        ctx.fillRect(x + 1, y + 1, 28, 26);
                    }
                }
                
                const texture = new THREE.CanvasTexture(canvas);
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(3, 3);
                return texture;
            }
            
            createWoodTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#8b7355';
                ctx.fillRect(0, 0, 256, 256);
                
                ctx.strokeStyle = '#5d4e37';
                ctx.lineWidth = 1;
                
                for (let i = 0; i < 30; i++) {
                    const y = Math.random() * 256;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.bezierCurveTo(64, y + Math.random() * 4 - 2, 192, y + Math.random() * 4 - 2, 256, y);
                    ctx.stroke();
                }
                
                ctx.strokeStyle = '#6b5344';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, 80);
                ctx.lineTo(256, 80);
                ctx.moveTo(0, 176);
                ctx.lineTo(256, 176);
                ctx.stroke();
                
                const texture = new THREE.CanvasTexture(canvas);
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(2, 2);
                return texture;
            }
            
            createMetalTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#4a4a4a';
                ctx.fillRect(0, 0, 256, 256);
                
                for (let i = 0; i < 1000; i++) {
                    const x = Math.random() * 256;
                    const y = Math.random() * 256;
                    const size = Math.random() * 3;
                    const gray = Math.floor(Math.random() * 50 + 80);
                    ctx.fillStyle = `rgb(${gray}, ${gray}, ${gray})`;
                    ctx.fillRect(x, y, size, size);
                }
                
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.strokeRect(10, 10, 236, 236);
                ctx.strokeRect(50, 50, 156, 156);
                
                const texture = new THREE.CanvasTexture(canvas);
                return texture;
            }
