                    { pos: [10, 1.5, -20], size: [2, 2.5, 2], rotation: 0 },
                    { pos: [0, 1.5, -10], size: [1.8, 2.8, 1.8], rotation: 0.2 },
                    { pos: [0, 1.5, 10], size: [1.8, 2.8, 1.8], rotation: -0.2 },
                    { pos: [-15, 1.5, 25], size: [2, 3, 2], rotation: 0.4 },
                    { pos: [15, 1.5, 25], size: [2, 3, 2], rotation: -0.4 },
                    { pos: [-5, 1.5, -30], size: [2, 3, 2], rotation: 0.3 },
                    { pos: [5, 1.5, -30], size: [2, 3, 2], rotation: -0.3 },
                    { pos: [-25, 1.5, 5], size: [2, 3, 2], rotation: 0.5 },
                    { pos: [25, 1.5, 5], size: [2, 3, 2], rotation: -0.5 }
                ];
                
                crateConfigs.forEach(c => {
                    const geo = new THREE.BoxGeometry(...c.size);
                    const crate = new THREE.Mesh(geo, woodMat);
                    crate.position.set(c.pos[0], c.pos[1], c.pos[2]);
                    crate.rotation.y = c.rotation;
                    crate.castShadow = true;
                    crate.receiveShadow = true;
                    this.scene.add(crate);
                    this.obstacles.push(crate);
                });
            }
            
            createBarrels(metalTexture) {
                const metalMat = new THREE.MeshStandardMaterial({ map: metalTexture });
                const rustMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
                
                const barrelPositions = [
                    [-35, 1.2, -5], [35, 1.2, -5], [-35, 1.2, 5], [35, 1.2, 5],
                    [-5, 1.2, -38], [5, 1.2, -38], [-5, 1.2, 38], [5, 1.2, 38],
                    [-20, 1.2, -5], [20, 1.2, -5], [-20, 1.2, 5], [20, 1.2, 5],
                    [-30, 1.2, -20], [30, 1.2, -20], [-30, 1.2, 20], [30, 1.2, 20],
                    [-10, 1.2, -25], [10, 1.2, -25], [-10, 1.2, 25], [10, 1.2, 25]
                ];
                
                barrelPositions.forEach(pos => {
                    const group = new THREE.Group();
                    
                    const bodyGeo = new THREE.CylinderGeometry(0.9, 0.9, 2, 16);
                    const body = new THREE.Mesh(bodyGeo, rustMat);
                    body.castShadow = true;
                    body.receiveShadow = true;
                    group.add(body);
                    
                    const topGeo = new THREE.CylinderGeometry(0.95, 0.95, 0.3, 16);
                    const top = new THREE.Mesh(topGeo, metalMat);
                    top.position.y = 1.15;
                    top.castShadow = true;
                    group.add(top);
                    
                    const bottomGeo = new THREE.CylinderGeometry(0.95, 0.95, 0.3, 16);
                    const bottom = new THREE.Mesh(bottomGeo, metalMat);
                    bottom.position.y = -1.15;
                    bottom.castShadow = true;
                    group.add(bottom);
                    
                    const ringGeo = new THREE.CylinderGeometry(1.02, 1.02, 0.2, 16);
                    const ring1 = new THREE.Mesh(ringGeo, metalMat);
                    ring1.position.y = 0.5;
                    group.add(ring1);
                    const ring2 = new THREE.Mesh(ringGeo, metalMat);
                    ring2.position.y = -0.5;
                    group.add(ring2);
                    
                    group.position.set(pos[0], pos[1], pos[2]);
                    group.rotation.y = Math.random() * Math.PI;
                    this.scene.add(group);
                    this.obstacles.push(group);
                });
            }
            
            createSandbags() {
                const sandbagMat = new THREE.MeshStandardMaterial({ color: 0x8b7355 });
                
                const sandbagPositions = [
                    { pos: [-20, 0.5, -35], count: 5 },
                    { pos: [20, 0.5, -35], count: 5 },
                    { pos: [-15, 0.5, 35], count: 5 },
                    { pos: [15, 0.5, 35], count: 5 },
                    { pos: [-35, 0.5, -10], count: 6 },
                    { pos: [35, 0.5, -10], count: 6 },
                    { pos: [-35, 0.5, 10], count: 6 },
                    { pos: [35, 0.5, 10], count: 6 },
                    { pos: [0, 0.5, -15], count: 4 },
                    { pos: [0, 0.5, 15], count: 4 }
                ];
                
                sandbagPositions.forEach(sp => {
                    for (let i = 0; i < sp.count; i++) {
                        const x = sp.pos[0] + (i - sp.count / 2) * 1.2;
                        const z = sp.pos[2];
                        
                        const bagGeo = new THREE.CylinderGeometry(0.4, 0.5, 0.8, 12);
                        const bag = new THREE.Mesh(bagGeo, sandbagMat);
                        bag.position.set(x, sp.pos[1], z);
                        bag.rotation.z = Math.PI / 2;
                        bag.castShadow = true;
                        bag.receiveShadow = true;
                        this.scene.add(bag);
                        this.obstacles.push(bag);
                        
                        if (i % 2 === 0) {
                            const bag2 = new THREE.Mesh(bagGeo, sandbagMat);
                            bag2.position.set(x + 0.6, sp.pos[1] + 0.5, z);
                            bag2.rotation.z = Math.PI / 2;
                            bag2.castShadow = true;
                            bag2.receiveShadow = true;
                            this.scene.add(bag2);
                            this.obstacles.push(bag2);
                        }
                    }
                });
            }
            
            createLampPosts() {
                const metalMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
                
                const lampPositions = [
                    [-40, 0, -40], [40, 0, -40], [-40, 0, 40], [40, 0, 40],
                    [0, 0, -40], [0, 0, 40], [-40, 0, 0], [40, 0, 0],
                    [-25, 0, -30], [25, 0, -30], [-25, 0, 30], [25, 0, 30],
                    [-15, 0, -15], [15, 0, -15], [-15, 0, 15], [15, 0, 15],
                    [-35, 0, -25], [35, 0, -25], [-35, 0, 25], [35, 0, 25]
                ];
                
                lampPositions.forEach(pos => {
                    const poleGeo = new THREE.CylinderGeometry(0.15, 0.15, 6, 8);
                    const pole = new THREE.Mesh(poleGeo, metalMat);
                    pole.position.set(pos[0], 3, pos[1]);
                    pole.castShadow = true;
                    this.scene.add(pole);
                    
                    const headGeo = new THREE.BoxGeometry(0.8, 0.3, 0.8);
                    const head = new THREE.Mesh(headGeo, metalMat);
                    head.position.set(pos[0], 5.9, pos[1]);
                    head.castShadow = true;
                    this.scene.add(head);
                    
                    const light = new THREE.PointLight(0xffffaa, 1.5, 25);
                    light.position.set(pos[0], 6, pos[1]);
                    this.scene.add(light);
                });
            }
            
            createDebris() {
                const woodMat = new THREE.MeshStandardMaterial({ color: 0x5d4e37 });
                const stoneMat = new THREE.MeshStandardMaterial({ color: 0x666666 });
                
                const debrisConfigs = [
                    { type: 'wood', pos: [-32, 0.2, -32], size: [2, 0.3, 0.5], rotation: [0.2, 0.4, 0.1] },
                    { type: 'wood', pos: [32, 0.2, -32], size: [1.5, 0.3, 0.4], rotation: [-0.1, -0.3, 0.2] },
                    { type: 'wood', pos: [-32, 0.2, 32], size: [1.8, 0.3, 0.5], rotation: [0.3, 0.2, -0.1] },
                    { type: 'wood', pos: [32, 0.2, 32], size: [2.2, 0.3, 0.6], rotation: [-0.2, 0.1, 0.3] },
                    { type: 'stone', pos: [-10, 0.1, -35], size: [0.5, 0.4, 0.6], rotation: [0.5, 0.3, 0.2] },
                    { type: 'stone', pos: [10, 0.1, -35], size: [0.4, 0.5, 0.4], rotation: [0.2, 0.5, 0.3] },
                    { type: 'stone', pos: [-20, 0.1, 15], size: [0.6, 0.3, 0.5], rotation: [0.3, 0.2, 0.4] },
                    { type: 'stone', pos: [20, 0.1, 15], size: [0.5, 0.4, 0.5], rotation: [0.4, 0.3, 0.2] }
                ];
                
                debrisConfigs.forEach(d => {
                    const mat = d.type === 'wood' ? woodMat : stoneMat;
                    const geo = new THREE.BoxGeometry(...d.size);
                    const debris = new THREE.Mesh(geo, mat);
                    debris.position.set(d.pos[0], d.pos[1], d.pos[2]);
                    debris.rotation.set(...d.rotation);
                    debris.castShadow = true;
                    debris.receiveShadow = true;
                    this.scene.add(debris);
                    this.obstacles.push(debris);
                });
            }

            createSupplyPoints() {
                const supplyPointConfigs = [
                    { pos: [0, 0, 0], name: '中心花园物资点', rarityMultiplier: 1 },
                    { pos: [-20, 0, -25], name: '宿舍区物资点', rarityMultiplier: 1.2 },
                    { pos: [20, 0, -25], name: '中控区物资点', rarityMultiplier: 1.5 },
                    { pos: [-20, 0, 25], name: '浮力室物资点', rarityMultiplier: 1.3 },
                    { pos: [20, 0, 25], name: '蓝室物资点', rarityMultiplier: 1.4 },
                    { pos: [-30, 0, -15], name: '仓库物资点', rarityMultiplier: 1 },
                    { pos: [30, 0, -15], name: '工业区物资点', rarityMultiplier: 1.6 },
                    { pos: [-30, 0, 15], name: '离心机室物资点', rarityMultiplier: 1.4 },
                    { pos: [30, 0, 15], name: '总裁室物资点', rarityMultiplier: 1.8 },
                    { pos: [0, 0, -30], name: '中控桥物资点', rarityMultiplier: 1.1 },
                    { pos: [0, 0, 30], name: '黑室物资点', rarityMultiplier: 1.7 },
                    { pos: [-15, 0, -35], name: '边缘物资点', rarityMultiplier: 0.8 },
                    { pos: [15, 0, -35], name: '边缘物资点', rarityMultiplier: 0.8 },
                    { pos: [-15, 0, 35], name: '边缘物资点', rarityMultiplier: 0.8 },
                    { pos: [15, 0, 35], name: '边缘物资点', rarityMultiplier: 0.8 },
                ];

                supplyPointConfigs.forEach(config => {
                    const sp = new SupplyPoint(this, new THREE.Vector3(...config.pos), config.name, config.rarityMultiplier);
                    this.supplyPoints.push(sp);
                });
            }

            setupInput() {
                this.searchClose.addEventListener('click', () => {
                    this.closeSearchUI();
                });
                
                document.getElementById('start-btn').addEventListener('click', () => {
                    this.start();
                });
                
                document.getElementById('click-to-play').addEventListener('click', () => {
                    document.getElementById('click-to-play').style.display = 'none';
                    document.body.requestPointerLock();
                });
                
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            start() {
                this.isRunning = true;
                this.wave = 1;
                this.kills = 0;
                this.score = 0;
                this.killStreak = 0;
                this.maxKillStreak = 0;
                
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('death-screen').style.display = 'none';
                document.getElementById('victory-screen').style.display = 'none';
                document.getElementById('click-to-play').style.display = 'flex';
                
                if (this.player) {
                    this.scene.remove(this.player.camera);
                }
                
                this.player = new Player(this);
                this.hud.updateHealth(this.player.health, this.player.maxHealth);
                
                this.spawnWave();
            }

            spawnWave() {
                this.totalEnemies = 5 + this.wave * 3;
                this.enemiesRemaining = this.totalEnemies;
                this.hud.updateWave(this.wave, 0, this.totalEnemies);
                
                const spawnDelay = 500;
                for (let i = 0; i < this.totalEnemies; i++) {
                    setTimeout(() => {
                        if (!this.isRunning) return;
                        
                        let type = 'normal';
                        if (this.wave >= 3 && Math.random() < 0.2) type = 'fast';
                        if (this.wave >= 5 && Math.random() < 0.15) type = 'tank';
                        
                        const enemy = new Enemy(this, type);
                        this.enemies.push(enemy);
                    }, i * spawnDelay);
                }
            }

            addKill() {
                this.kills++;
                this.killStreak++;
                this.enemiesRemaining--;
                
                const streakBonus = this.killStreak * 10;
                this.score += 100 + streakBonus;
                
                if (this.killStreak > this.maxKillStreak) {
                    this.maxKillStreak = this.killStreak;
                }
                
                this.hud.updateWave(this.wave, this.totalEnemies - this.enemiesRemaining, this.totalEnemies);
                this.hud.showKillStreak(this.killStreak);
                
                if (this.enemiesRemaining === 0) {
                    if (this.wave >= 10) {
                        this.victory();
                    } else {
                        setTimeout(() => {
                            this.wave++;
                            this.spawnWave();
                        }, 3000);
                    }
                }
            }

            gameOver() {
                this.isRunning = false;
                this.closeSearchUI();
                this.closeInventory();
                document.getElementById('final-score').textContent = this.score;
                document.getElementById('max-streak').textContent = this.maxKillStreak;
                document.getElementById('death-screen').style.display = 'flex';
            }

            victory() {
                this.isRunning = false;
                this.closeSearchUI();
                this.closeInventory();
                document.getElementById('victory-score').textContent = this.score;
                document.getElementById('victory-streak').textContent = this.maxKillStreak;
                document.getElementById('victory-screen').style.display = 'flex';
            }

            restart() {
                this.enemies.forEach(e => {
                    if (e.active) {
                        this.scene.remove(e.mesh);
                        this.hud.removeEnemyHealthBar(e.healthBarId);
                    }
                });
                this.enemies = [];
                
                this.groundItems.forEach(item => item.destroy());
                this.groundItems = [];
                
                this.start();
            }

            openSearchUI(supplyPoint) {
                this.currentSupplyPoint = supplyPoint;
                this.player.isSearching = true;
                
                document.exitPointerLock();
                
                this.searchHeader.textContent = supplyPoint.name;
                this.searchItems.innerHTML = '';
                
                supplyPoint.getItems().forEach(item => {
                    const itemElement = document.createElement('div');
                    itemElement.className = `search-item ${item.rarity}`;
                    itemElement.innerHTML = `
                        <div class="search-item-name">${item.name}</div>
                        <div class="search-item-price">$${item.price}</div>
                        <div class="search-item-desc">${item.desc}</div>
                    `;
                    const game = this;
                    itemElement.addEventListener('dblclick', function() {
                        if (!game.player.inventory.isFull()) {
                            const removed = supplyPoint.removeItem(item.id);
                            if (removed) {
                                game.player.inventory.addItem(removed);
                                itemElement.remove();
                                if (!supplyPoint.hasItems()) {
                                    game.closeSearchUI();
                                }
                            }
                        }
                    }, { once: true });
                    this.searchItems.appendChild(itemElement);
                });
                
                this.searchUI.style.display = 'flex';
                this.searchButton.style.display = 'none';
            }

            closeSearchUI() {
                this.player.isSearching = false;
                this.searchUI.style.display = 'none';
                this.currentSupplyPoint = null;
                
                try {
                    document.body.requestPointerLock();
                } catch (e) {
                    setTimeout(() => {
                        try {
                            document.body.requestPointerLock();
                        } catch (e2) {}
                    }, 100);
                }
            }

            toggleInventory() {
                if (this.isInventoryOpen) {
                    this.closeInventory();
                } else {
                    this.openInventory();
                }
            }

            openInventory() {
                this.isInventoryOpen = true;
                this.player.isSearching = true;
                
                document.exitPointerLock();
                
                this.updateInventoryUI();
                
                this.inventoryUI.style.display = 'flex';
                document.getElementById('inventory').style.display = 'none';
                
                const canvas = document.querySelector('canvas');
                if (canvas) canvas.style.pointerEvents = 'none';
            }

            closeInventory() {
                if (!this.isInventoryOpen) return;
                
                this.isInventoryOpen = false;
                this.player.isSearching = false;
                this.inventoryUI.style.display = 'none';
                document.getElementById('inventory').style.display = 'flex';
                
                const canvas = document.querySelector('canvas');
                if (canvas) canvas.style.pointerEvents = 'auto';
                
                try {
                    document.body.requestPointerLock();
                } catch (e) {
                    setTimeout(() => {
                        try {
                            document.body.requestPointerLock();
                        } catch (e2) {}
                    }, 100);
                }
            }

            updateInventoryUI() {
                this.inventoryGrid.innerHTML = '';
                const game = this;
                
                this.player.inventory.slots.forEach((item, index) => {
                    const slot = document.createElement('div');
                    slot.className = 'inventory-slot-large';
                    
                    if (item) {
                        slot.classList.add('full');
                        slot.classList.add(item.rarity);
                        
                        const nameSpan = document.createElement('div');
                        nameSpan.className = 'inventory-item-name-large';
                        nameSpan.textContent = item.name;
                        
                        const priceSpan = document.createElement('div');
                        priceSpan.className = 'inventory-item-price-large';
                        priceSpan.textContent = '$' + item.price;
                        
                        const descSpan = document.createElement('div');
                        descSpan.className = 'inventory-item-desc-large';
                        descSpan.textContent = item.desc;
                        
                        slot.appendChild(nameSpan);
                        slot.appendChild(priceSpan);
                        slot.appendChild(descSpan);
                        
                        let lastClickTime = 0;
                        slot.addEventListener('click', function(e) {
                            console.log('点击背包物品:', item.name, '索引:', index);
                            const now = Date.now();
                            console.log('距离上次点击:', now - lastClickTime, 'ms');
                            if (now - lastClickTime < 400) {
                                console.log('检测到双击，尝试丢弃物品');
                                const removed = game.player.inventory.removeItem(index);
                                if (removed) {
                                    console.log('成功丢弃:', removed.name);
                                    game.dropItem(removed);
                                    game.updateInventoryUI();
                                } else {
                                    console.log('丢弃失败：物品不存在');
                                }
                            }
                            lastClickTime = now;
                        });
                    }
                    
                    this.inventoryGrid.appendChild(slot);
                });
            }

            dropItem(item) {
                const dropPos = this.player.position.clone();
                dropPos.x += (Math.random() - 0.5) * 1;
                dropPos.z += (Math.random() - 0.5) * 1;
                
                const groundItem = new GroundItem(this, item, dropPos);
                this.groundItems.push(groundItem);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                
                const dt = 0.016;
                
                if (this.isRunning && this.player) {
                    this.player.update(dt);
                    
                    this.supplyPoints.forEach(sp => sp.update(dt));
                    
                    this.groundItems = this.groundItems.filter(item => {
                        item.update(dt);
                        return true;
                    });
                    
                    this.checkNearbyItems();
                    
                    this.enemies = this.enemies.filter(e => e.active);
                    this.enemies.forEach(e => e.update(dt));
                }
                
                this.renderer.render(this.scene, this.camera);
            }

            checkNearbyItems() {
                const playerPos = this.player.position;
                
                let nearbyGroundItem = null;
                let minDistance = 2;
                
                for (const item of this.groundItems) {
                    const distance = item.getDistanceTo(playerPos);
                    if (distance < minDistance) {
                        minDistance = distance;
                        nearbyGroundItem = item;
                    }
                }
                
                if (nearbyGroundItem) {
                    this.itemInfoName.textContent = nearbyGroundItem.item.name;
                    this.itemInfoPrice.textContent = `$${nearbyGroundItem.item.price}`;
                    this.itemInfoDesc.textContent = nearbyGroundItem.item.desc;
                    this.itemInfo.style.display = 'block';
                } else {
                    this.itemInfo.style.display = 'none';
                }
                
                let nearbySupplyPoint = null;
                minDistance = 3;
                
                for (const sp of this.supplyPoints) {
                    const distance = sp.position.distanceTo(playerPos);
                    if (distance < minDistance) {
                        minDistance = distance;
                        nearbySupplyPoint = sp;
                    }
                }
                
                if (nearbySupplyPoint && nearbySupplyPoint.hasItems()) {
                    this.currentSupplyPoint = nearbySupplyPoint;
                    this.searchButton.style.display = 'block';
                } else {
                    this.searchButton.style.display = 'none';
                }
            }
        }

        const game = new Game();
    </script>
</body>
</html>
