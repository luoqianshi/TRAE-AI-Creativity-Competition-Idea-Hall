<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务边界管家 · 切换损耗管理</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f6f4f0;
            color: #1e1e1e;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: center;
            line-height: 1.5;
        }
        .app {
            max-width: 720px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.05);
            padding: 2rem 1.8rem 2.5rem;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        h1 small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #8a8a8a;
        }
        .subhead {
            color: #6a6a6a;
            border-left: 3px solid #d0ccc4;
            padding-left: 1rem;
            margin: 0.2rem 0 1.5rem 0;
            font-size: 0.95rem;
        }
        .stats {
            display: flex;
            gap: 1.8rem;
            background: #f9f8f5;
            border-radius: 16px;
            padding: 0.8rem 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .stats div {
            display: flex;
            align-items: baseline;
            gap: 0.2rem;
        }
        .stats .num {
            font-weight: 700;
            font-size: 1.3rem;
            color: #2c2c2c;
        }
        .stats .label {
            font-size: 0.85rem;
            color: #7a7a7a;
        }

        .task-input {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }
        .task-input input {
            flex: 1;
            padding: 0.65rem 1rem;
            border: 1px solid #ddd8d0;
            border-radius: 40px;
            font-size: 0.95rem;
            background: #faf9f7;
            outline: none;
            transition: 0.2s;
        }
        .task-input input:focus {
            border-color: #b0a89a;
            background: white;
        }
        .task-input button {
            padding: 0.65rem 1.6rem;
            background: #2c2c2c;
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .task-input button:hover {
            background: #1a1a1a;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        .task-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 0.8rem 0.6rem 1.2rem;
            background: #faf9f6;
            border-radius: 60px;
            border: 1px solid #efede8;
            transition: 0.15s;
        }
        .task-item.active {
            background: #f0eee9;
            border-color: #b8ae9e;
        }
        .task-item .name {
            flex: 1;
            font-weight: 450;
        }
        .task-item .status {
            font-size: 0.75rem;
            color: #7a7a7a;
            background: #eae7e1;
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
        }
        .task-item .actions {
            display: flex;
            gap: 0.3rem;
        }
        .task-item .actions button {
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 450;
            transition: 0.1s;
        }
        .btn-start {
            color: #2c6e4f;
            background: #e2efe8;
        }
        .btn-start:hover:not(:disabled) {
            background: #c5ded0;
        }
        .btn-start:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-delete {
            color: #999;
            background: transparent;
        }
        .btn-delete:hover {
            background: #eee;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 1.5rem 0 0.6rem 0;
            border-bottom: 1px solid #efede8;
            padding-bottom: 0.3rem;
        }
        .switch-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 0.8rem;
        }
        .switch-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem 0.8rem;
            background: #faf9f6;
            border-radius: 12px;
            font-size: 0.85rem;
            border-left: 4px solid #c6bfb4;
        }
        .switch-item .switch-info {
            display: flex;
            flex-direction: column;
        }
        .switch-item .switch-info .from-to {
            font-weight: 450;
        }
        .switch-item .switch-info .time {
            color: #8a8a8a;
            font-size: 0.7rem;
        }
        .switch-item .loss {
            background: #ece9e2;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #3d3d3d;
            font-weight: 500;
        }
        .clear-btn {
            background: none;
            border: none;
            color: #a0a0a0;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline dotted;
        }
        .clear-btn:hover {
            color: #6a6a6a;
        }
        .recommend {
            background: #f4f1eb;
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #3a3a3a;
        }
        .recommend strong {
            font-weight: 600;
        }
        .empty-tip {
            color: #aaa;
            font-size: 0.9rem;
            padding: 0.3rem 0;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            border-radius: 24px;
            padding: 2rem 2rem 1.8rem;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal h3 {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .modal p {
            color: #555;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        .modal input {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid #ddd;
            border-radius: 40px;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        .modal .btn-group {
            display: flex;
            gap: 0.6rem;
            justify-content: flex-end;
        }
        .modal .btn-group button {
            padding: 0.5rem 1.4rem;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
        }
        .modal .btn-primary {
            background: #2c2c2c;
            color: white;
        }
        .modal .btn-primary:hover {
            background: #1a1a1a;
        }
        .modal .btn-secondary {
            background: #eae7e1;
            color: #333;
        }
        .modal .btn-secondary:hover {
            background: #ddd8d0;
        }
        @media (max-width: 500px) {
            .app { padding: 1.2rem; }
            .stats { gap: 1rem; }
            .task-item { flex-wrap: wrap; }
            .task-item .actions { margin-left: auto; }
        }
    </style>
</head>
<body>
<div class="app">
    <h1>
        🔄 任务边界管家
        <small>· 切换损耗管理</small>
    </h1>
    <div class="subhead">记录每次任务切换，量化恢复耗时，优化工作流</div>

    <!-- 统计 -->
    <div class="stats" id="statsPanel">
        <div><span class="num" id="switchCount">0</span><span class="label">次切换</span></div>
        <div><span class="num" id="totalLoss">0</span><span class="label">分钟损耗</span></div>
        <div><span class="num" id="avgLoss">0</span><span class="label">平均损耗</span></div>
    </div>

    <!-- 添加任务 -->
    <div class="task-input">
        <input type="text" id="taskNameInput" placeholder="输入任务名称" />
        <button id="addTaskBtn">➕ 添加</button>
    </div>

    <!-- 任务列表 -->
    <div id="taskList" class="task-list"></div>

    <!-- 切换记录 -->
    <div class="section-title">📋 切换记录</div>
    <div id="switchList" class="switch-list"></div>
    <button id="clearSwitchesBtn" class="clear-btn">清空所有记录</button>

    <!-- 智能推荐 -->
    <div id="recommendBox" class="recommend"></div>
</div>

<!-- 模态框：输入恢复耗时 -->
<div id="lossModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <h3>⏳ 恢复耗时</h3>
        <p>切换到 <span id="modalTaskName"></span>，你花了多久才进入状态？</p>
        <input type="number" id="lossInput" min="0" step="0.5" placeholder="分钟（如 2.5）" />
        <div class="btn-group">
            <button class="btn-secondary" id="modalCancel">跳过</button>
            <button class="btn-primary" id="modalConfirm">确认</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ----- 数据 -----
        const TASKS_KEY = 'bt_tasks';
        const SWITCHES_KEY = 'bt_switches';

        let tasks = [];           // { id, name }
        let switches = [];        // { fromTaskId, toTaskId, fromName, toName, timestamp, lossMinutes }
        let currentActiveTaskId = null; // 当前正在进行的任务id

        // 加载数据
        function loadData() {
            try {
                const t = localStorage.getItem(TASKS_KEY);
                if (t) tasks = JSON.parse(t);
                const s = localStorage.getItem(SWITCHES_KEY);
                if (s) switches = JSON.parse(s);
            } catch(e) { /* ignore */ }
            // 确保任务id是数字
            tasks = tasks.map(t => ({ ...t, id: Number(t.id) }));
        }

        function saveTasks() {
            localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
        }

        function saveSwitches() {
            localStorage.setItem(SWITCHES_KEY, JSON.stringify(switches));
        }

        // ----- 核心逻辑 -----
        function startTask(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            // 如果当前已有激活任务，且不是同一个，则触发切换
            if (currentActiveTaskId !== null && currentActiveTaskId !== taskId) {
                const prevTask = tasks.find(t => t.id === currentActiveTaskId);
                if (prevTask) {
                    // 弹出模态框让用户输入恢复耗时
                    showLossModal(prevTask, task);
                    return; // 异步处理，回调中完成切换
                }
            }

            // 没有激活任务，或激活的就是自己
            if (currentActiveTaskId === taskId) {
                // 已经是激活状态，不做任何事
                return;
            }

            // 直接激活（没有切换）
            currentActiveTaskId = taskId;
            renderAll();
        }

        // 实际执行切换（由模态框回调触发）
        function performSwitch(fromTask, toTask, lossMinutes) {
            // 记录切换
            const switchRecord = {
                fromTaskId: fromTask.id,
                toTaskId: toTask.id,
                fromName: fromTask.name,
                toName: toTask.name,
                timestamp: Date.now(),
                lossMinutes: parseFloat(lossMinutes) || 0
            };
            switches.push(switchRecord);
            saveSwitches();

            // 更新当前激活任务
            currentActiveTaskId = toTask.id;
            renderAll();
            closeModal();
        }

        // 停止当前任务（取消激活）
        function stopCurrentTask() {
            currentActiveTaskId = null;
            renderAll();
        }

        // 删除任务（如果正在激活则先停止）
        function deleteTask(taskId) {
            if (currentActiveTaskId === taskId) {
                currentActiveTaskId = null;
            }
            tasks = tasks.filter(t => t.id !== taskId);
            saveTasks();
            renderAll();
        }

        // 添加任务
        function addTask(name) {
            const trimmed = name.trim();
            if (!trimmed) return;
            if (tasks.some(t => t.name === trimmed)) {
                alert('已存在同名任务');
                return;
            }
            const newTask = {
                id: Date.now() + Math.random() * 1000,
                name: trimmed
            };
            tasks.push(newTask);
            saveTasks();
            renderAll();
        }

        // 清空切换记录
        function clearSwitches() {
            if (switches.length === 0) return;
            if (confirm('确定清空所有切换记录吗？')) {
                switches = [];
                saveSwitches();
                renderAll();
            }
        }

        // ----- 模态框 -----
        let modalResolve = null;

        function showLossModal(fromTask, toTask) {
            const overlay = document.getElementById('lossModal');
            document.getElementById('modalTaskName').textContent = toTask.name;
            document.getElementById('lossInput').value = '';
            overlay.style.display = 'flex';
            // 聚焦输入
            setTimeout(() => document.getElementById('lossInput').focus(), 100);

            // 移除旧监听
            const confirmBtn = document.getElementById('modalConfirm');
            const cancelBtn = document.getElementById('modalCancel');
            const input = document.getElementById('lossInput');

            const onConfirm = () => {
                const val = parseFloat(input.value);
                const loss = isNaN(val) ? 0 : val;
                performSwitch(fromTask, toTask, loss);
            };
            const onCancel = () => {
                performSwitch(fromTask, toTask, 0);
            };
            const onKeydown = (e) => {
                if (e.key === 'Enter') onConfirm();
                else if (e.key === 'Escape') onCancel();
            };

            confirmBtn.onclick = onConfirm;
            cancelBtn.onclick = onCancel;
            input.onkeydown = onKeydown;
            // 点击背景关闭（但不保存损耗，相当于跳过）
            overlay.onclick = (e) => {
                if (e.target === overlay) onCancel();
            };
        }

        function closeModal() {
            document.getElementById('lossModal').style.display = 'none';
        }

        // ----- 统计与推荐 -----
        function calcStats() {
            const today = new Date();
            const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();
            const todaySwitches = switches.filter(s => s.timestamp >= todayStart);
            const count = todaySwitches.length;
            let totalLoss = 0;
            todaySwitches.forEach(s => totalLoss += s.lossMinutes || 0);
            const avg = count > 0 ? (totalLoss / count) : 0;
            return { count, totalLoss, avg };
        }

        function generateRecommendation() {
            if (switches.length === 0) {
                return '还没有切换记录，开始使用后我将给你建议。';
            }
            // 找出损耗最小的切换对（推荐重复该组合）
            let minLoss = Infinity;
            let bestPair = null;
            switches.forEach(s => {
                const loss = s.lossMinutes || 0;
                if (loss < minLoss) {
                    minLoss = loss;
                    bestPair = { from: s.fromName, to: s.toName, loss: loss };
                }
            });
            if (bestPair && bestPair.loss >= 0) {
                return `💡 推荐组合：从「${bestPair.from}」切换到「${bestPair.to}」时，你的恢复耗时仅 ${bestPair.loss.toFixed(1)} 分钟，效率较高。建议将这两个任务安排在一起执行。`;
            }
            return '继续使用，数据越多推荐越精准。';
        }

        // ----- 渲染 -----
        function renderAll() {
            renderTasks();
            renderSwitches();
            renderStats();
            renderRecommendation();
        }

        function renderTasks() {
            const container = document.getElementById('taskList');
            if (tasks.length === 0) {
                container.innerHTML = `<div class="empty-tip">还没有任务，添加第一个任务吧</div>`;
                return;
            }
            let html = '';
            tasks.forEach(task => {
                const isActive = (currentActiveTaskId === task.id);
                const activeClass = isActive ? 'active' : '';
                const statusText = isActive ? '⏳ 进行中' : '待开始';
                html += `
                    <div class="task-item ${activeClass}" data-id="${task.id}">
                        <span class="name">${escapeHtml(task.name)}</span>
                        <span class="status">${statusText}</span>
                        <div class="actions">
                            <button class="btn-start" data-action="start" data-id="${task.id}" ${isActive ? 'disabled' : ''}>
                                ${isActive ? '● 进行中' : '▶ 开始'}
                            </button>
                            <button class="btn-delete" data-action="delete" data-id="${task.id}">✕</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            // 事件委托
            container.querySelectorAll('[data-action]').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const action = this.dataset.action;
                    const id = Number(this.dataset.id);
                    if (action === 'start') {
                        startTask(id);
                    } else if (action === 'delete') {
                        deleteTask(id);
                    }
                });
            });
        }

        function renderSwitches() {
            const container = document.getElementById('switchList');
            if (switches.length === 0) {
                container.innerHTML = `<div class="empty-tip">暂无切换记录</div>`;
                return;
            }
            // 按时间倒序
            const sorted = [...switches].sort((a,b) => b.timestamp - a.timestamp);
            let html = '';
            sorted.forEach(s => {
                const date = new Date(s.timestamp);
                const timeStr = date.toLocaleString('zh-CN', { hour12: false });
                const loss = (s.lossMinutes || 0).toFixed(1);
                html += `
                    <div class="switch-item">
                        <div class="switch-info">
                            <span class="from-to">${escapeHtml(s.fromName)} → ${escapeHtml(s.toName)}</span>
                            <span class="time">${timeStr}</span>
                        </div>
                        <span class="loss">⏱ ${loss} 分钟</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderStats() {
            const stats = calcStats();
            document.getElementById('switchCount').textContent = stats.count;
            document.getElementById('totalLoss').textContent = stats.totalLoss.toFixed(1);
            document.getElementById('avgLoss').textContent = stats.avg.toFixed(1);
        }

        function renderRecommendation() {
            const box = document.getElementById('recommendBox');
            const text = generateRecommendation();
            box.innerHTML = `<strong>🧠 智能推荐</strong><br>${text}`;
        }

        // 工具
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ----- 初始化 -----
        loadData();
        // 如果任务列表为空，添加示例任务
        if (tasks.length === 0) {
            tasks = [
                { id: 1, name: '写报告' },
                { id: 2, name: '看论文' },
                { id: 3, name: '整理笔记' }
            ];
            saveTasks();
        }
        // 如果没有激活任务，默认无
        currentActiveTaskId = null;
        renderAll();

        // 事件绑定
        document.getElementById('addTaskBtn').addEventListener('click', function() {
            const input = document.getElementById('taskNameInput');
            addTask(input.value);
            input.value = '';
            input.focus();
        });
        document.getElementById('taskNameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('addTaskBtn').click();
        });
        document.getElementById('clearSwitchesBtn').addEventListener('click', clearSwitches);

        // 页面关闭前保存
        window.addEventListener('beforeunload', function() {
            saveTasks();
            saveSwitches();
        });
    })();
</script>
</body>
</html>
