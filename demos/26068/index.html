<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>深呼吸助手 - 科学呼吸引导工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a365d;
      --accent: #38b2ac;
      --accent-glow: rgba(56, 178, 172, 0.4);
      --bg-dark: #0f172a;
      --bg-light: #1e293b;
      --text-white: #ffffff;
      --text-gray: #e2e8f0;
      --text-muted: #94a3b8;
      --circle-size: 280px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-white);
      overflow: hidden;
    }

    .container {
      max-width: 480px;
      width: 100%;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: 0.1em;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .breathing-circle-container {
      position: relative;
      width: var(--circle-size);
      height: var(--circle-size);
      margin: 0 auto 2rem;
    }

    .breathing-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, #2d4a7c 100%);
      box-shadow: 
        0 0 60px var(--accent-glow),
        inset 0 0 40px rgba(56, 178, 172, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }

    .breathing-circle::before {
      content: '';
      position: absolute;
      width: 85%;
      height: 85%;
      border-radius: 50%;
      border: 2px solid rgba(56, 178, 172, 0.3);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.05); opacity: 0.6; }
    }

    .phase-text {
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--text-white);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .phase-text.fade {
      opacity: 0.3;
    }

    .phase-timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3rem;
      font-weight: 500;
      color: var(--accent);
      margin-top: 0.5rem;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2rem;
      font-size: 0.875rem;
      color: var(--text-gray);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--text-white);
      margin-bottom: 0.25rem;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .btn {
      padding: 0.875rem 2rem;
      border: none;
      border-radius: 50px;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      outline: none;
    }

    .btn:focus-visible {
      box-shadow: 0 0 0 3px var(--accent);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, #319795 100%);
      color: var(--bg-dark);
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px var(--accent-glow);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-white);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .settings {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .mode-selector {
      margin-bottom: 1.5rem;
    }

    .mode-label {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .mode-options {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
    }

    .mode-btn {
      padding: 0.625rem 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      background: transparent;
      color: var(--text-gray);
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .mode-btn:hover {
      border-color: var(--accent);
      color: var(--text-white);
    }

    .mode-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg-dark);
      font-weight: 500;
    }

    .mode-btn:focus-visible {
      box-shadow: 0 0 0 2px var(--accent);
    }

    .mode-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .duration-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .duration-label {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .duration-input {
      width: 60px;
      padding: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-white);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      text-align: center;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .duration-input:focus {
      border-color: var(--accent);
    }

    .duration-input::-webkit-inner-spin-button,
    .duration-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .duration-unit {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      :root {
        --circle-size: 200px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .phase-timer {
        font-size: 2.5rem;
      }

      .btn {
        padding: 0.75rem 1.5rem;
        font-size: 0.875rem;
      }

      .mode-options {
        flex-wrap: wrap;
      }

      .controls {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>深呼吸助手</h1>
    <p class="subtitle">科学呼吸引导，让身心回归平静</p>

    <div class="breathing-circle-container">
      <div class="breathing-circle" id="breathingCircle">
        <div>
          <div class="phase-text" id="phaseText">准备开始</div>
          <div class="phase-timer" id="phaseTimer">0</div>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-value" id="cycleCount">0</span>
        <span>完成周期</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="timeRemaining">5:00</span>
        <span>剩余时间</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="startBtn">开始</button>
      <button class="btn btn-secondary" id="pauseBtn" disabled>暂停</button>
      <button class="btn btn-secondary" id="resetBtn" disabled>重置</button>
    </div>

    <div class="settings">
      <div class="mode-selector">
        <div class="mode-label">选择呼吸模式</div>
        <div class="mode-options">
          <button class="mode-btn active" data-mode="4-7-8">4-7-8 放松</button>
          <button class="mode-btn" data-mode="4-4-4">4-4-4 平衡</button>
          <button class="mode-btn" data-mode="4-6">4-6 常规</button>
        </div>
        <div class="mode-desc" id="modeDesc">吸气4秒 → 屏息7秒 → 呼气8秒</div>
      </div>

      <div class="duration-selector">
        <span class="duration-label">练习时长</span>
        <input type="number" class="duration-input" id="durationInput" value="5" min="1" max="60">
        <span class="duration-unit">分钟</span>
      </div>
    </div>
  </div>

  <script>
    const MODES = {
      '4-7-8': { inhale: 4, hold: 7, exhale: 8, desc: '吸气4秒 → 屏息7秒 → 呼气8秒' },
      '4-4-4': { inhale: 4, hold: 4, exhale: 4, desc: '吸气4秒 → 屏息4秒 → 呼气4秒' },
      '4-6': { inhale: 4, hold: 0, exhale: 6, desc: '吸气4秒 → 呼气6秒' }
    };

    const state = {
      mode: '4-7-8',
      duration: 5,
      isRunning: false,
      isPaused: false,
      phase: 'idle',
      cycleCount: 0,
      timeRemaining: 300,
      phaseTimeRemaining: 0,
      timerId: null,
      phaseTimerId: null
    };

    const elements = {
      breathingCircle: document.getElementById('breathingCircle'),
      phaseText: document.getElementById('phaseText'),
      phaseTimer: document.getElementById('phaseTimer'),
      cycleCount: document.getElementById('cycleCount'),
      timeRemaining: document.getElementById('timeRemaining'),
      startBtn: document.getElementById('startBtn'),
      pauseBtn: document.getElementById('pauseBtn'),
      resetBtn: document.getElementById('resetBtn'),
      modeDesc: document.getElementById('modeDesc'),
      durationInput: document.getElementById('durationInput')
    };

    const modeButtons = document.querySelectorAll('.mode-btn');

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function updateDisplay() {
      elements.cycleCount.textContent = state.cycleCount;
      elements.timeRemaining.textContent = formatTime(state.timeRemaining);
      elements.phaseTimer.textContent = state.phaseTimeRemaining;
    }

    function setCircleScale(scale) {
      elements.breathingCircle.style.transform = `scale(${scale})`;
    }

    function setPhase(phase, duration) {
      state.phase = phase;
      state.phaseTimeRemaining = duration;

      const phaseNames = {
        idle: '准备开始',
        inhale: '吸气',
        hold: '屏息',
        exhale: '呼气'
      };

      elements.phaseText.textContent = phaseNames[phase];
      elements.phaseText.classList.remove('fade');

      clearTimeout(state.phaseTimerId);

      if (phase === 'idle') {
        setCircleScale(0.6);
        return;
      }

      const config = MODES[state.mode];
      let targetScale, transitionDuration;

      if (phase === 'inhale') {
        targetScale = 1;
        transitionDuration = config.inhale;
        elements.breathingCircle.style.transition = `transform ${config.inhale}s ease-out`;
      } else if (phase === 'hold') {
        targetScale = 1;
        transitionDuration = config.hold;
        elements.breathingCircle.style.transition = 'none';
      } else if (phase === 'exhale') {
        targetScale = 0.6;
        transitionDuration = config.exhale;
        elements.breathingCircle.style.transition = `transform ${config.exhale}s ease-in`;
      }

      setCircleScale(targetScale);

      state.phaseTimerId = setInterval(() => {
        state.phaseTimeRemaining--;
        updateDisplay();

        if (state.phaseTimeRemaining <= 0) {
          clearInterval(state.phaseTimerId);
          nextPhase();
        }
      }, 1000);
    }

    function nextPhase() {
      const config = MODES[state.mode];

      if (state.phase === 'inhale') {
        if (config.hold > 0) {
          setPhase('hold', config.hold);
        } else {
          setPhase('exhale', config.exhale);
        }
      } else if (state.phase === 'hold') {
        setPhase('exhale', config.exhale);
      } else if (state.phase === 'exhale') {
        state.cycleCount++;
        state.timeRemaining -= Math.ceil((config.inhale + config.hold + config.exhale));
        updateDisplay();

        if (state.timeRemaining <= 0) {
          completeSession();
          return;
        }

        setPhase('inhale', config.inhale);
      }
    }

    function startBreathing() {
      state.isRunning = true;
      state.isPaused = false;

      elements.startBtn.disabled = true;
      elements.pauseBtn.disabled = false;
      elements.resetBtn.disabled = false;
      elements.durationInput.disabled = true;
      modeButtons.forEach(btn => btn.disabled = true);

      const config = MODES[state.mode];
      setPhase('inhale', config.inhale);
    }

    function pauseBreathing() {
      if (state.isPaused) {
        state.isPaused = false;
        elements.pauseBtn.textContent = '暂停';

        const remaining = state.phaseTimeRemaining;
        state.phaseTimerId = setInterval(() => {
          state.phaseTimeRemaining--;
          updateDisplay();

          if (state.phaseTimeRemaining <= 0) {
            clearInterval(state.phaseTimerId);
            nextPhase();
          }
        }, 1000);
      } else {
        state.isPaused = true;
        elements.pauseBtn.textContent = '继续';
        clearInterval(state.phaseTimerId);
      }
    }

    function resetBreathing() {
      clearInterval(state.phaseTimerId);

      state.isRunning = false;
      state.isPaused = false;
      state.phase = 'idle';
      state.cycleCount = 0;
      state.timeRemaining = state.duration * 60;
      state.phaseTimeRemaining = 0;

      elements.startBtn.disabled = false;
      elements.pauseBtn.disabled = true;
      elements.pauseBtn.textContent = '暂停';
      elements.resetBtn.disabled = true;
      elements.durationInput.disabled = false;
      modeButtons.forEach(btn => btn.disabled = false);

      elements.phaseText.textContent = '准备开始';
      setCircleScale(0.6);
      elements.breathingCircle.style.transition = 'transform 0.5s ease-out';

      updateDisplay();
    }

    function completeSession() {
      clearInterval(state.phaseTimerId);

      state.isRunning = false;
      state.phase = 'idle';

      elements.phaseText.textContent = '练习完成';
      elements.phaseText.classList.add('fade');
      elements.startBtn.disabled = false;
      elements.pauseBtn.disabled = true;
      elements.resetBtn.disabled = false;
      elements.durationInput.disabled = false;
      modeButtons.forEach(btn => btn.disabled = false);

      setCircleScale(0.6);
    }

    function selectMode(mode) {
      state.mode = mode;
      elements.modeDesc.textContent = MODES[mode].desc;

      modeButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });

      if (!state.isRunning) {
        resetBreathing();
      }
    }

    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => selectMode(btn.dataset.mode));
    });

    elements.startBtn.addEventListener('click', startBreathing);
    elements.pauseBtn.addEventListener('click', pauseBreathing);
    elements.resetBtn.addEventListener('click', resetBreathing);

    elements.durationInput.addEventListener('change', (e) => {
      let value = parseInt(e.target.value) || 5;
      value = Math.max(1, Math.min(60, value));
      e.target.value = value;
      state.duration = value;
      if (!state.isRunning) {
        state.timeRemaining = value * 60;
        updateDisplay();
      }
    });

    elements.durationInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.target.blur();
      }
    });

    updateDisplay();
  </script>
</body>
</html>
