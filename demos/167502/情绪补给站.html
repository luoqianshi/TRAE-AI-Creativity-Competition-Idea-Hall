<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情绪补给站</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=ZCOOL+KuaiLe&display=swap');
        
        :root {
            --soft-pink: #FCE7F3;
            --light-pink: #FBCFE8;
            --baby-pink: #F9A8D4;
            --cream-yellow: #FEF3C7;
            --soft-yellow: #FDE68A;
            --baby-blue: #DBEAFE;
            --light-blue: #93C5FD;
            --warm-white: #FFFBF5;
            --text-primary: #831843;
            --text-secondary: #BE185D;
            --text-light: #C084FC;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, var(--warm-white) 0%, var(--soft-pink) 30%, var(--cream-yellow) 70%, var(--baby-blue) 100%);
            position: relative;
        }

        .polka-dots {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            background-image: 
                radial-gradient(circle, rgba(251, 207, 232, 0.3) 18%, transparent 18%),
                radial-gradient(circle, rgba(219, 234, 254, 0.25) 15%, transparent 15%),
                radial-gradient(circle, rgba(254, 230, 138, 0.2) 12%, transparent 12%);
            background-size: 200px 200px, 250px 250px, 300px 300px;
            background-position: 0 0, 125px 125px, 80px 80px;
            animation: polkaMove 50s linear infinite;
        }

        @keyframes polkaMove {
            from { background-position: 0 0, 125px 125px, 80px 80px; }
            to { background-position: 200px 200px, 375px 375px, 380px 380px; }
        }

        .floating-elements {
            position: fixed; width: 100%; height: 100%;
            pointer-events: none; z-index: 1; overflow: hidden;
        }

        .float-item {
            position: absolute; opacity: 0.35;
            animation: float 20s infinite ease-in-out;
        }

        .float-item:nth-child(1) {
            width: 140px; height: 140px;
            background: radial-gradient(circle, var(--baby-pink) 20%, transparent 80%);
            border-radius: 50%;
            top: 8%; left: 5%;
            animation-delay: 0s;
        }

        .float-item:nth-child(2) {
            width: 160px; height: 160px;
            background: radial-gradient(circle, var(--baby-blue) 15%, transparent 85%);
            border-radius: 50%;
            top: 22%; right: 6%;
            animation-delay: -5s;
        }

        .float-item:nth-child(3) {
            width: 120px; height: 120px;
            background: radial-gradient(circle, var(--soft-yellow) 20%, transparent 80%);
            border-radius: 50%;
            top: 48%; left: 12%;
            animation-delay: -10s;
        }

        .float-item:nth-child(4) {
            width: 150px; height: 150px;
            background: radial-gradient(circle, var(--light-blue) 12%, transparent 88%);
            border-radius: 50%;
            top: 68%; right: 10%;
            animation-delay: -15s;
        }

        .float-item:nth-child(5) {
            width: 100px; height: 100px;
            background: radial-gradient(circle, var(--light-pink) 25%, transparent 75%);
            border-radius: 50%;
            top: 38%; left: 72%;
            animation-delay: -20s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -35px) scale(1.05); }
            50% { transform: translate(-25px, -20px) scale(0.95); }
            75% { transform: translate(18px, 28px) scale(1.02); }
        }

        .interactive-cats {
            position: fixed; width: 100%; height: 100%;
            pointer-events: auto; z-index: 5; overflow: hidden;
        }

        .cat {
            position: absolute;
            font-size: 3.5rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: catFloat 14s infinite ease-in-out;
        }

        .cat:hover {
            transform: scale(1.4);
        }

        .cat.active {
            animation: catRoll 0.9s ease-in-out;
        }

        @keyframes catFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-18px) rotate(6deg); }
            50% { transform: translateY(-8px) rotate(-4deg); }
            75% { transform: translateY(-22px) rotate(4deg); }
        }

        @keyframes catRoll {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.3); }
            50% { transform: rotate(180deg) scale(1.4); }
            75% { transform: rotate(270deg) scale(1.3); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .cat:nth-child(1) { top: 6%; left: 10%; animation-delay: 0s; font-size: 3rem; }
        .cat:nth-child(2) { top: 12%; right: 12%; animation-delay: -3.5s; font-size: 2.7rem; }
        .cat:nth-child(3) { top: 62%; left: 8%; animation-delay: -7s; font-size: 3.2rem; }
        .cat:nth-child(4) { top: 82%; right: 15%; animation-delay: -10.5s; font-size: 2.8rem; }

        .cat-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .cat-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid rgba(255, 255, 255, 0.9);
        }

        .cat:hover .cat-bubble {
            opacity: 1;
        }

        .container {
            position: relative; z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; padding: 30px 20px;
        }

        .logo {
            font-size: 2.6rem; 
            color: var(--text-secondary);
            margin-bottom: 45px;
            font-weight: 500;
            display: flex; align-items: center; gap: 14px;
            animation: gentleBounce 3s ease-in-out infinite;
        }

        .logo-icon {
            font-size: 3rem;
            animation: spin 12s linear infinite;
        }

        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .quote-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(18px);
            border-radius: 36px;
            padding: 50px 40px;
            max-width: 450px;
            text-align: center;
            margin-bottom: 55px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .quote-card:hover {
            transform: translateY(-6px);
        }

        .quote-card::before {
            content: ''; position: absolute; top: -60%; left: -60%;
            width: 220%; height: 220%;
            background: radial-gradient(circle at 30% 30%, rgba(251, 207, 232, 0.1) 0%, transparent 60%);
            animation: rotateSlow 25s linear infinite;
        }

        .quote-card::after {
            content: ''; position: absolute; bottom: -40%; right: -40%;
            width: 180%; height: 180%;
            background: radial-gradient(circle at 70% 70%, rgba(219, 234, 254, 0.08) 0%, transparent 55%);
            animation: rotateSlow 20s linear infinite reverse;
        }

        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .quote-icon {
            font-size: 2.2rem;
            margin-bottom: 22px;
            opacity: 0.45;
        }

        .quote-text {
            font-size: 1.5rem; line-height: 1.7;
            color: var(--text-primary);
            margin-bottom: 28px;
            position: relative; z-index: 1;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .quote-author {
            font-size: 1rem; color: var(--text-light);
            font-family: 'ZCOOL KuaiLe', cursive;
            position: relative; z-index: 1;
        }

        .refresh-btn {
            background: linear-gradient(135deg, var(--soft-pink) 0%, var(--light-pink) 100%);
            border: none; 
            width: 48px; height: 48px;
            border-radius: 50%; 
            cursor: pointer;
            margin-top: 22px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem;
            color: var(--text-secondary);
        }

        .refresh-btn:hover {
            transform: rotate(360deg) scale(1.15);
            background: linear-gradient(135deg, var(--baby-blue) 0%, var(--light-blue) 100%);
            color: white;
        }

        .hug-btn {
            background: linear-gradient(135deg, var(--baby-pink) 0%, var(--light-pink) 50%, var(--soft-yellow) 100%);
            color: var(--text-primary);
            border: none; padding: 22px 55px; font-size: 1.4rem;
            border-radius: 55px; cursor: pointer;
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 500;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative; overflow: hidden;
            display: flex; align-items: center; gap: 12px;
        }

        .hug-btn::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            transition: left 0.6s ease;
        }

        .hug-btn:hover::before { left: 100%; }
        .hug-btn:hover {
            transform: translateY(-8px) scale(1.06);
        }
        .hug-btn:active { transform: translateY(-3px) scale(1.03); }

        .hug-icon { font-size: 1.7rem; }

        .falling-items {
            position: fixed; width: 100%; height: 100%;
            pointer-events: none; z-index: 50; overflow: hidden;
        }

        .falling-item {
            position: absolute; font-size: 2.2rem;
            opacity: 0; animation: fall 4.5s infinite;
        }

        @keyframes fall {
            0% { opacity: 0; transform: translateY(-100vh) rotate(0deg) scale(0.4); }
            12% { opacity: 1; transform: translateY(-75vh) rotate(72deg) scale(1); }
            88% { opacity: 1; transform: translateY(75vh) rotate(648deg) scale(0.8); }
            100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(0.2); }
        }

        .image-modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(255, 251, 245, 0.9);
            backdrop-filter: blur(12px); z-index: 100;
            justify-content: center; align-items: center;
            animation: fadeIn 0.4s ease;
        }

        .image-modal.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background: white; border-radius: 40px; padding: 0;
            max-width: 85%; max-height: 85%;
            text-align: center;
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-image-wrapper {
            width: 100%; padding: 35px;
            background: linear-gradient(180deg, var(--soft-pink) 0%, var(--warm-white) 100%);
        }

        .modal-image {
            max-width: 100%; max-height: 55vh;
            border-radius: 28px;
            object-fit: contain;
        }

        .modal-info {
            padding: 28px 35px 40px;
        }

        .modal-title {
            font-size: 1.5rem; color: var(--text-secondary);
            margin-bottom: 12px;
            font-family: 'ZCOOL KuaiLe', cursive;
        }

        .modal-subtitle {
            font-size: 1rem; color: var(--text-light);
            line-height: 1.6;
        }

        .close-btn {
            position: absolute; top: 18px; right: 18px;
            background: rgba(251, 207, 232, 0.4); border: none;
            width: 45px; height: 45px; border-radius: 50%;
            font-size: 1.1rem; color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
        }

        .close-btn:hover {
            background: rgba(251, 207, 232, 0.6);
            transform: rotate(90deg);
        }

        .footer {
            position: fixed; bottom: 28px; left: 0; width: 100%;
            text-align: center; z-index: 10;
        }

        .footer-text {
            font-size: 0.95rem; color: var(--text-light);
            font-weight: 300;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .logo { font-size: 2.1rem; margin-bottom: 35px; }
            .quote-card { padding: 38px 28px; margin-bottom: 45px; }
            .quote-text { font-size: 1.3rem; }
            .hug-btn { padding: 18px 40px; font-size: 1.2rem; }
            .modal-content { max-width: 92%; }
            .modal-image-wrapper { padding: 25px; }
            .cat { font-size: 2.5rem !important; }
        }
    </style>
</head>
<body>
    <div class="polka-dots"></div>
    <div class="floating-elements">
        <div class="float-item"></div>
        <div class="float-item"></div>
        <div class="float-item"></div>
        <div class="float-item"></div>
        <div class="float-item"></div>
    </div>
    <div class="interactive-cats" id="cats-container"></div>
    <div class="falling-items" id="falling-container"></div>

    <div class="container">
        <div class="logo">
            <span class="logo-icon">🌸</span>
            <span>情绪补给站</span>
        </div>

        <div class="quote-card">
            <div class="quote-icon">🌷</div>
            <p class="quote-text" id="quote-text">加载中...</p>
            <p class="quote-author" id="quote-author"></p>
            <button class="refresh-btn" onclick="refreshQuote()" title="换一句">🔄</button>
        </div>

        <button class="hug-btn" onclick="showHug()">
            <span class="hug-icon">🐾</span>
            <span>让我抱抱你</span>
        </button>
    </div>

    <div class="footer">
        <p class="footer-text">你永远值得被温柔以待 ✨</p>
    </div>

    <div class="image-modal" id="image-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div class="modal-image-wrapper">
                <img src="" alt="可爱小动物" class="modal-image" id="modal-image">
            </div>
            <div class="modal-info">
                <p class="modal-title" id="modal-title">给你一个大大的拥抱!</p>
                <p class="modal-subtitle" id="modal-subtitle">希望这个小可爱能带给你好心情~</p>
            </div>
        </div>
    </div>

    <script>
        const quotes = [
            { text: "人生就像一盒巧克力，你永远不知道下一颗是什么味道——不过没关系，反正都是甜的。", author: "—— 巧克力爱好者" },
            { text: "星星不一定会发光，但你会呀。", author: "—— 夜空观察员" },
            { text: "允许自己当一天废物，毕竟废物也有废物的可爱之处。", author: "—— 摆烂专家" },
            { text: "你不是胖，你是被生活打肿了。", author: "—— 安慰大师" },
            { text: "如果事与愿违，那一定是另有安排——比如安排你去吃顿火锅。", author: "—— 火锅之神" },
            { text: "难过的时候就照照镜子，你会发现——原来世界上还有这么好看的人在难过。", author: "—— 自恋狂魔" },
            { text: "生活不止眼前的苟且，还有诗和远方的田野——以及楼下的便利店。", author: "—— 现实主义者" },
            { text: "把烦恼装进垃圾袋，然后——扔掉！", author: "—— 垃圾分类小能手" },
            { text: "你是独一无二的，就像——世界上没有两片完全相同的薯片。", author: "—— 薯片哲学家" },
            { text: "今天的你已经很棒了，给自己颁发一朵小红花吧。", author: "—— 幼儿园老师" },
            { text: "累了就歇会儿，反正明天也不一定会变好——但至少今天你休息了。", author: "—— 人间清醒" },
            { text: "不要和别人比，你是限量版，他们是批量生产的。", author: "—— 奢侈品鉴定师" },
            { text: "心情不好的时候，就去买杯奶茶——三分糖，去冰，加珍珠，心情立刻+100分。", author: "—— 奶茶续命" },
            { text: "你比你想象中更强大，只是你还没发现——就像你不知道自己能吃多少东西。", author: "—— 干饭达人" },
            { text: "哭吧哭吧不是罪，哭过之后——记得补个妆。", author: "—— 精致女孩" },
            { text: "生活虽然艰难，但你更难——所以你赢了。", author: "—— 逻辑鬼才" },
            { text: "把不开心的事写在沙滩上，让海浪带走——然后去吃海鲜。", author: "—— 海边度假" },
            { text: "你不需要完美，你只需要——比昨天的自己好一点点。", author: "—— 慢慢来" },
            { text: "今天的烦恼就到此为止，明天的烦恼——明天再说。", author: "—— 拖延症患者" },
            { text: "你笑起来的样子很好看，就像——春天的花，夏天的冰，秋天的奶茶，冬天的火锅。", author: "—— 吃货诗人" },
            { text: "不管发生什么，我都会在这里——陪你一起吃好吃的。", author: "—— 饭搭子" },
            { text: "你是值得被爱的，就像——奶茶值得被喝完，蛋糕值得被吃光。", author: "—— 甜品代言人" },
            { text: "累了就停下来，我给你讲个笑话——从前有个包子，它饿了，就把自己吃了。", author: "—— 冷笑话大王" },
            { text: "你已经做得很好了，真的——不信你问镜子里的自己。", author: "—— 镜子对话" },
            { text: "生活就像过山车，有高潮也有低谷——但至少过山车有安全带，你也有我。", author: "—— 游乐场伙伴" },
            { text: "别担心，一切都会好起来的——虽然我不知道什么时候，但一定会。", author: "—— 乐观主义者" },
            { text: "你是最棒的，就像——方便面是最好吃的，奶茶是最甜的，火锅是最香的。", author: "—— 美食家" },
            { text: "想哭就哭，想笑就笑——反正没人看你（开玩笑的）。", author: "—— 损友" },
            { text: "今天的你也辛苦了，奖励自己——一个抱抱，一杯奶茶，一顿大餐。", author: "—— 奖励机制" },
            { text: "你比自己想象中更勇敢，就像——你敢一个人去看恐怖电影。", author: "—— 恐怖片爱好者" },
            { text: "不要着急，最好的总会在最不经意的时候出现——比如外卖。", author: "—— 外卖小哥" },
            { text: "你是独一无二的存在，就像——世界上只有一个你，也只有一个我。", author: "—— 哲学家" },
            { text: "累了就歇会儿，又不是所有问题都要今天解决——反正明天也解决不了。", author: "—— 摆烂有理" },
            { text: "你笑起来真好看，像春天的花一样——不对，比春天的花好看多了。", author: "—— 彩虹屁选手" },
            { text: "不管怎么样，你都是我心中最可爱的人——没有之一。", author: "—— 真爱粉" },
            { text: "难过的时候就想想开心的事——比如今天吃了什么好吃的。", author: "—— 吃货思维" },
            { text: "你值得拥有所有美好的东西——包括我。", author: "—— 表白选手" },
            { text: "别担心，我会一直在你身边——除非我去吃火锅。", author: "—— 火锅重度患者" },
            { text: "今天的你也很棒，给自己点个赞——然后去吃点甜的。", author: "—— 甜党" },
            { text: "你是最棒的，不需要证明什么——因为我已经证明了。", author: "—— 数学学霸" }
        ];

        const catEmojis = ['🐱', '😺', '😸', '😻', '😽', '🐈', '🐾', '💕'];
        const catBubbles = ['喵呜~', '蹭蹭你~', '摸摸~', '呼噜呼噜~', '陪你哦~', '抱抱~', '撒娇~', '喜欢你~'];

        const animalImages = [
            { url: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=cute%20cartoon%20chibi%20white%20cat%20kitten%20big%20sparkling%20eyes%20sitting%20softly%20pastel%20pink%20background%20kawaii%20style%20gentle%20lighting&image_size=square_hd", title: "萌萌小猫咪", subtitle: "喵~我来陪你啦" },
            { url: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=cute%20cartoon%20chibi%20golden%20retriever%20puppy%20wagging%20tail%20happy%20smile%20soft%20yellow%20background%20kawaii%20style%20warm&image_size=square_hd", title: "快乐小狗狗", subtitle: "汪汪！要一起玩吗~" },
            { url: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=cute%20cartoon%20chibi%20hamster%20eating%20sunflower%20seed%20round%20chubby%20soft%20blue%20background%20kawaii%20style%20adorable&image_size=square_hd", title: "圆滚滚仓鼠", subtitle: "咔嚓咔嚓~一起吃零食吧" },
            { url: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=cute%20cartoon%20chibi%20rabbit%20bunny%20long%20ears%20flower%20crown%20soft%20pink%20flowers%20background%20kawaii%20style%20gentle&image_size=square_hd", title: "花花小兔子", subtitle: "蹦蹦跳跳来找你啦~" },
            { url: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=cute%20cartoon%20chibi%20panda%20bear%20eating%20bamboo%20black%20white%20soft%20green%20background%20kawaii%20style%20peaceful&image_size=square_hd", title: "懒懒大熊猫", subtitle: "竹子给你，抱抱给我~" },
            { url: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=cute%20cartoon%20chibi%20penguin%20baby%20standing%20on%20ice%20adorable%20waddling%20soft%20blue%20white%20background%20kawaii%20style%20cute&image_size=square_hd", title: "呆萌小企鹅", subtitle: "摇摇摆摆来取暖啦~" },
            { url: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=cute%20cartoon%20chibi%20fox%20cub%20orange%20red%20fur%20big%20bushes%20soft%20green%20forest%20background%20kawaii%20style%20playful&image_size=square_hd", title: "调皮小狐狸", subtitle: "我来给你讲个故事吧~" },
            { url: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=cute%20cartoon%20chibi%20owl%20baby%20big%20round%20eyes%20perched%20on%20branch%20soft%20brown%20background%20kawaii%20style%20wise&image_size=square_hd", title: "聪明小猫头鹰", subtitle: "睡不着的话，我陪你~" },
            { url: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=cute%20cartoon%20chibi%20koala%20bear%20sleeping%20on%20eucalyptus%20tree%20grey%20fur%20soft%20green%20background%20kawaii%20style%20sleepy&image_size=square_hd", title: "睡睡小考拉", subtitle: "困了就睡会儿，我守着你~" },
            { url: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=cute%20cartoon%20chibi%20sheep%20soft%20white%20wool%20green%20meadow%20sunny%20day%20kawaii%20style%20fluffy&image_size=square_hd", title: "软绵绵小羊", subtitle: "咩~让我来温暖你~" }
        ];

        const fallingItems = ['✨', '⭐', '🌟', '🍬', '🍭', '🍰', '🧁', '🍪', '🌸', '🌺', '🌷', '🍩', '🎀', '🍓', '🍒', '💫', '💎', '🧚', '🦋', '🐾', '💖', '🌙', '☁️'];

        function getRandomIndex(arr) { return Math.floor(Math.random() * arr.length); }

        function createCats() {
            const container = document.getElementById('cats-container');
            container.innerHTML = '';
            
            for (let i = 0; i < 4; i++) {
                const cat = document.createElement('div');
                cat.className = 'cat';
                cat.textContent = catEmojis[getRandomIndex(catEmojis)];
                
                const bubble = document.createElement('div');
                bubble.className = 'cat-bubble';
                bubble.textContent = catBubbles[getRandomIndex(catBubbles)];
                bubble.style.top = '-45px';
                bubble.style.left = '50%';
                bubble.style.transform = 'translateX(-50%)';
                
                cat.appendChild(bubble);
                cat.addEventListener('click', function() {
                    cat.classList.add('active');
                    setTimeout(() => cat.classList.remove('active'), 900);
                });
                
                container.appendChild(cat);
            }
        }

        function refreshQuote() {
            const quote = quotes[getRandomIndex(quotes)];
            const textElement = document.getElementById('quote-text');
            const authorElement = document.getElementById('quote-author');
            
            textElement.style.opacity = '0';
            authorElement.style.opacity = '0';
            
            setTimeout(() => {
                textElement.textContent = quote.text;
                authorElement.textContent = quote.author;
                textElement.style.transition = 'opacity 0.6s ease';
                authorElement.style.transition = 'opacity 0.6s ease';
                textElement.style.opacity = '1';
                authorElement.style.opacity = '1';
            }, 300);
        }

        function createFallingItems() {
            const container = document.getElementById('falling-container');
            container.innerHTML = '';
            
            for (let i = 0; i < 30; i++) {
                const item = document.createElement('div');
                item.className = 'falling-item';
                item.textContent = fallingItems[getRandomIndex(fallingItems)];
                item.style.left = Math.random() * 100 + '%';
                item.style.animationDelay = Math.random() * 6 + 's';
                item.style.fontSize = (1.2 + Math.random() * 1.8) + 'rem';
                container.appendChild(item);
            }
        }

        function showHug() {
            createFallingItems();
            const imageData = animalImages[getRandomIndex(animalImages)];
            const modal = document.getElementById('image-modal');
            const modalImage = document.getElementById('modal-image');
            const modalTitle = document.getElementById('modal-title');
            const modalSubtitle = document.getElementById('modal-subtitle');
            
            modalImage.src = imageData.url;
            modalTitle.textContent = imageData.title;
            modalSubtitle.textContent = imageData.subtitle;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('image-modal').classList.remove('active');
        }

        document.getElementById('image-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        window.addEventListener('load', function() {
            refreshQuote();
            createCats();
        });
    </script>
</body>
</html>
