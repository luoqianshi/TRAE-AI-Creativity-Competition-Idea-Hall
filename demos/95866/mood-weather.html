<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>灵魂天气 · MoodWeather</title>
<style>
  :root {
    --bg1: #0f1226;
    --bg2: #1b1f3b;
    --ink: #eef1ff;
    --muted: #9aa3c7;
    --accent: #7cc4ff;
    --accent2: #ffb86b;
    --card: rgba(255,255,255,.06);
    --line: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(124,196,255,.18), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(255,184,107,.14), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 28px 18px 60px; }
  header { text-align: center; margin-bottom: 22px; }
  h1 {
    font-size: 30px; margin: 0; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--muted); font-size: 14px; margin-top: 8px; }

  .tabs { display: flex; gap: 8px; justify-content: center; margin: 18px 0 20px; }
  .tab {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    padding: 9px 18px; border-radius: 999px; cursor: pointer; font-size: 14px;
    transition: .2s; user-select: none;
  }
  .tab.active { color: #0c1024; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-color: transparent; font-weight: 600; }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { display: none; }
  .panel.active { display: block; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .q { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .q-title { font-size: 15px; margin-bottom: 12px; }
  .q-title b { color: var(--accent); }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    text-align: left; border: 1px solid var(--line); background: rgba(255,255,255,.03);
    color: var(--ink); padding: 11px 13px; border-radius: 11px; cursor: pointer; font-size: 14px;
    transition: .15s;
  }
  .opt:hover { border-color: var(--accent); background: rgba(124,196,255,.10); }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt.sel { border-color: var(--accent2); background: rgba(255,184,107,.14); }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 12px 16px; border-radius: 14px; cursor: pointer; font-size: 15px; transition: .15s;
  }
  .chip:hover { transform: translateY(-2px); border-color: var(--accent); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip .e { font-size: 18px; margin-right: 6px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: 14px; padding: 13px 20px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: .15s; color: #0c1024;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .center { text-align: center; margin-top: 18px; }

  /* ===== Card preview ===== */
  .card {
    position: relative; width: 100%; max-width: 380px; margin: 0 auto;
    aspect-ratio: 720 / 1160; border-radius: 24px; overflow: hidden;
    box-shadow: 0 30px 70px rgba(0,0,0,.45); background: #4e6e8e;
    animation: pop .4s ease;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  .card-sky { position: absolute; inset: 0; }
  .card-anim { position: absolute; inset: 0; overflow: hidden; }
  .card-scrim {
    position: absolute; left: 0; right: 0; bottom: 0; height: 56%;
    background: linear-gradient(to bottom, transparent, rgba(0,0,0,.62));
  }
  .card-text { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 26px 22px; color: #fff; }
  .c-brand { font-size: 13px; letter-spacing: 1px; opacity: .85; text-align: center; margin-bottom: 14px; }
  .c-name { font-size: 46px; font-weight: 800; line-height: 1; }
  .c-label { font-size: 17px; opacity: .85; margin-top: 6px; }
  .c-divider { height: 1px; background: rgba(255,255,255,.25); margin: 16px 0; }
  .c-forecast { font-size: 16px; line-height: 1.55; opacity: .95; min-height: 50px; }
  .c-meta { display: flex; justify-content: space-between; font-size: 14px; opacity: .85; margin-top: 14px; }
  .c-caption { font-size: 15px; line-height: 1.5; opacity: .92; margin-top: 14px; font-style: italic; }
  .c-wm { text-align: center; font-size: 12px; opacity: .5; margin-top: 16px; letter-spacing: 1px; }

  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }

  /* ===== Weather animation layers ===== */
  .sun {
    position: absolute; width: 86px; height: 86px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fff7cf, #ffd24d);
    box-shadow: 0 0 50px rgba(255,210,77,.8);
  }
  .rays {
    position: absolute; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255,225,130,.55) 0deg 5deg, transparent 5deg 18deg);
    animation: spin 22s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cloud {
    position: absolute; background: #fff; border-radius: 50%;
    filter: blur(1px); opacity: .92;
    box-shadow: 30px 6px 0 -4px #fff, -28px 8px 0 -6px #fff, 8px -10px 0 -2px #fff;
    animation: drift linear infinite;
  }
  .cloud.dark { background: #8b95a7; box-shadow: 30px 6px 0 -4px #8b95a7, -28px 8px 0 -6px #8b95a7, 8px -10px 0 -2px #8b95a7; opacity: .8; }
  @keyframes drift { from { transform: translateX(-40%); } to { transform: translateX(140%); } }

  .drop {
    position: absolute; top: -12%; width: 2px; height: 46px;
    background: linear-gradient(transparent, rgba(255,255,255,.7));
    animation: fall linear infinite;
  }
  @keyframes fall { to { transform: translateY(130%); opacity: .25; } }

  .flake {
    position: absolute; top: -6%; width: 7px; height: 7px; border-radius: 50%;
    background: #fff; opacity: .9; animation: snowfall linear infinite;
  }
  @keyframes snowfall {
    0% { transform: translate(0, -10%); }
    100% { transform: translate(22px, 130%); }
  }

  .fogband {
    position: absolute; left: -25%; width: 150%; height: 64px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
    filter: blur(10px); animation: fogmove linear infinite;
  }
  @keyframes fogmove { from { transform: translateX(-10%); } to { transform: translateX(10%); } }

  .flash {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 62% 28%, rgba(255,255,255,.95), transparent 55%);
    mix-blend-mode: screen; animation: flash 4.5s infinite;
  }
  @keyframes flash {
    0%, 90%, 100% { opacity: 0; }
    91% { opacity: .9; } 93% { opacity: 0; }
    96% { opacity: .7; } 98% { opacity: 0; }
  }

  .rainbow { position: absolute; left: 50%; bottom: 30%; transform: translateX(-50%); width: 300px; height: 150px; }
  .rainbow i {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    border-radius: 999px 999px 0 0; border: 9px solid; border-bottom: none;
  }

  .windline {
    position: absolute; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
    animation: windblow linear infinite;
  }
  @keyframes windblow { from { transform: translateX(-30%) rotate(-4deg); } to { transform: translateX(130%) rotate(-4deg); } }

  .hidden { display: none !important; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 26px; line-height: 1.6; }

  @media (prefers-reduced-motion: reduce) {
    .rays, .cloud, .drop, .flake, .fogband, .flash, .windline, .card, .panel.active { animation: none !important; }
  }
</style>
</head>

</div>

    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    var wk = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][d.getDay()];
    return { line: y + "." + m + "." + day + " " + wk, file: y + m + day };
  }

  // ===== 状态 =====
  var quizSel = {};       // questionIndex -> weather key
  var current = null;     // current card data

  // ===== 渲染题库 =====
  function renderQuiz() {
    var box = $("quizBox");
    box.innerHTML = "";
    QUIZ.forEach(function (item, qi) {
      var q = document.createElement("div");
      q.className = "q";
      var title = document.createElement("div");
      title.className = "q-title";
      title.innerHTML = "<b>Q" + (qi + 1) + ".</b> " + item.q;
      q.appendChild(title);
      var opts = document.createElement("div");
      opts.className = "opts";
      item.opts.forEach(function (o, oi) {
        var b = document.createElement("button");
        b.className = "opt";
        b.type = "button";
        b.textContent = o.t;
        b.setAttribute("aria-pressed", "false");
        b.addEventListener("click", function () {
          opts.querySelectorAll(".opt").forEach(function (x) { x.classList.remove("sel"); x.setAttribute("aria-pressed", "false"); });
          b.classList.add("sel"); b.setAttribute("aria-pressed", "true");
          quizSel[qi] = o.w;
        });
        opts.appendChild(b);
      });
      q.appendChild(opts);
      box.appendChild(q);
    });
  }

  function renderChips() {
    var box = $("chipBox");
    box.innerHTML = "";
    MOODS.forEach(function (m) {
      var b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.innerHTML = '<span class="e">' + m.e + "</span>" + m.t;
      b.addEventListener("click", function () { generate(m.w); });
      box.appendChild(b);
    });
  }

  // ===== 生成卡片 =====
  function generate(key) {
    var w = WEATHER[key];
    var d = fmtDate(new Date());
    current = {
      key: key,
      name: w.name,
      label: w.label,
      forecast: pick(w.forecasts),
      caption: pick(w.captions),
      index: rand(w.index[0], w.index[1]),
      dateLine: d.line,
      dateFile: d.file,
      sky: w.sky,
      flags: w.flags
    };
    paintCard(current);
    showPanel("result");
  }

  function reword() {
    if (!current) return;
    var w = WEATHER[current.key];
    current.forecast = pick(w.forecasts);
    current.caption = pick(w.captions);
    paintCard(current);
  }

  // ===== 绘制预览（CSS 动画）=====
  function paintCard(data) {
    $("cardSky").style.background = "linear-gradient(160deg," + data.sky[0] + "," + data.sky[1] + ")";
    var anim = $("cardAnim");
    anim.innerHTML = "";
    var f = data.flags;

    if (f.sun) {
      var sunWrap = document.createElement("div");
      sunWrap.style.position = "absolute";
      sunWrap.style.left = f.sunLow ? "50%" : "68%";
      sunWrap.style.top = f.sunLow ? "52%" : "14%";
      sunWrap.style.transform = "translate(-50%,-50%)";
      var rays = document.createElement("div");
      rays.className = "rays";
      rays.style.width = "180px"; rays.style.height = "180px";
      rays.style.left = "-47px"; rays.style.top = "-47px";
      if (f.sunset) { rays.style.background = "repeating-conic-gradient(from 0deg, rgba(255,180,120,.5) 0deg 5deg, transparent 5deg 18deg)"; }
      var sun = document.createElement("div");
      sun.className = "sun";
      if (f.sunset) { sun.style.background = "radial-gradient(circle at 40% 40%, #fff0cf, #ff9a52)"; sun.style.boxShadow = "0 0 50px rgba(255,150,80,.8)"; }
      sunWrap.appendChild(rays); sunWrap.appendChild(sun);
      anim.appendChild(sunWrap);
    }

    var cloudCount = f.clouds || 0;
    for (var i = 0; i < cloudCount; i++) {
      var c = document.createElement("div");
      c.className = "cloud" + (f.cloudDark ? " dark" : "");
      var wpx = rand(90, 150);
      c.style.width = wpx + "px"; c.style.height = (wpx * 0.5) + "px";
      c.style.top = rand(8, 45) + "%";
      c.style.left = rand(-10, 30) + "%";
      c.style.animationDuration = rand(22, 40) + "s";
      c.style.animationDelay = (-rand(0, 20)) + "s";
      if (f.sunset) { c.style.opacity = ".55"; c.style.filter = "blur(2px)"; c.style.background = "rgba(255,200,160,.7)"; c.style.boxShadow = "30px 6px 0 -4px rgba(255,200,160,.7),-28px 8px 0 -6px rgba(255,200,160,.7)"; }
      anim.appendChild(c);
    }

    if (f.fog) {
      for (var k = 0; k < 4; k++) {
        var fb = document.createElement("div");
        fb.className = "fogband";
        fb.style.top = (20 + k * 18) + "%";
        fb.style.animationDuration = rand(14, 26) + "s";
        fb.style.animationDelay = (-rand(0, 10)) + "s";
        anim.appendChild(fb);
      }
    }

    if (f.precip === "rain") {
      var n = f.heavy ? 90 : 45;
      for (var r = 0; r < n; r++) {
        var dp = document.createElement("div");
        dp.className = "drop";
        dp.style.left = rand(0, 100) + "%";
        dp.style.animationDuration = (f.heavy ? rand(5, 9) : rand(7, 12)) / 10 + "s";
        dp.style.animationDelay = (-rand(0, 12)) + "s";
        if (f.heavy) { dp.style.height = "60px"; dp.style.opacity = ".85"; }
        anim.appendChild(dp);
      }
    }
    if (f.precip === "snow") {
      for (var s = 0; s < 60; s++) {
        var fl = document.createElement("div");
        fl.className = "flake";
        fl.style.left = rand(0, 100) + "%";
        var sz = rand(4, 9); fl.style.width = sz + "px"; fl.style.height = sz + "px";
        fl.style.animationDuration = rand(6, 13) + "s";
        fl.style.animationDelay = (-rand(0, 12)) + "s";
        anim.appendChild(fl);
      }
    }

    if (f.lightning) {
      var fl2 = document.createElement("div");
      fl2.className = "flash";
      anim.appendChild(fl2);
    }

    if (f.rainbow) {
      var rb = document.createElement("div");
      rb.className = "rainbow";
      var colors = ["#ff5d5d", "#ffa94d", "#ffe066", "#69db7c", "#4dabf7", "#b197fc"];
      for (var ci = 0; ci < 6; ci++) {
        var arc = document.createElement("i");
        var size = 300 - ci * 44;
        arc.style.width = size + "px";
        arc.style.height = (size / 2) + "px";
        arc.style.borderColor = colors[ci];
        rb.appendChild(arc);
      }
      anim.appendChild(rb);
    }

    if (f.wind) {
      for (var wi = 0; wi < 4; wi++) {
        var wl = document.createElement("div");
        wl.className = "windline";
        wl.style.top = (15 + wi * 16) + "%";
        wl.style.left = "-10%";
        wl.style.width = rand(120, 200) + "px";
        wl.style.animationDuration = rand(3, 6) + "s";
        wl.style.animationDelay = (-rand(0, 4)) + "s";
        anim.appendChild(wl);
      }
    }

    // 文本
    $("cName").textContent = data.name;
    $("cLabel").textContent = data.label;
    $("cForecast").textContent = data.forecast;
    $("cIndex").textContent = "情绪指数 " + data.index + "°";
    $("cDate").textContent = data.dateLine;
    $("cCaption").textContent = data.caption;
    $("card").setAttribute("aria-label", "你的内心天气预报：" + data.name + "，" + data.label + "。" + data.forecast);
  }

  // ===== 面板切换 =====
  function showPanel(name) {
    ["quiz", "pick", "result"].forEach(function (p) {
      $("panel" + p.charAt(0).toUpperCase() + p.slice(1)).classList.toggle("active", p === name);
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ===== Canvas 导出 =====
  function drawArc(ctx, cx, cy, r, color) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, Math.PI, 2 * Math.PI);
    ctx.lineWidth = 11;
    ctx.strokeStyle = color;
    ctx.stroke();
  }

  function drawCardCanvas(ctx, W, H, data) {
    // 天空
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, data.sky[0]);
    g.addColorStop(1, data.sky[1]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    var f = data.flags;

    // 太阳
    if (f.sun) {
      var sx = f.sunLow ? W * 0.5 : W * 0.72;
      var sy = f.sunLow ? H * 0.5 : H * 0.16;
      ctx.save();
      ctx.translate(sx, sy);
      // 光芒
      ctx.strokeStyle = f.sunset ? "rgba(255,180,120,.45)" : "rgba(255,225,130,.5)";
      ctx.lineWidth = 4;
      for (var a = 0; a < 24; a++) {
        var ang = (a / 24) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang) * 70, Math.sin(ang) * 70);
        ctx.lineTo(Math.cos(ang) * 96, Math.sin(ang) * 96);
        ctx.stroke();
      }
      var sg = ctx.createRadialGradient(-12, -12, 6, 0, 0, 56);
      sg.addColorStop(0, f.sunset ? "#fff0cf" : "#fff7cf");
      sg.addColorStop(1, f.sunset ? "#ff9a52" : "#ffd24d");
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(0, 0, 56, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // 云
    function blob(x, y, s, col) {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.ellipse(x, y, s, s * 0.55, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + s * 0.7, y + 6, s * 0.7, s * 0.45, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x - s * 0.7, y + 8, s * 0.6, s * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    }
    var cloudN = f.clouds || 0;
    for (var i = 0; i < cloudN; i++) {
      var cx = W * (0.18 + i * 0.26) + rand(-20, 20);
      var cy = H * (0.12 + (i % 2) * 0.08);
      var col = f.cloudDark ? "rgba(139,149,167,.85)" : (f.sunset ? "rgba(255,200,160,.7)" : "rgba(255,255,255,.92)");
      blob(cx, cy, rand(40, 60), col);
    }

    // 雾
    if (f.fog) {
      for (var k = 0; k < 4; k++) {
        var fy = H * (0.18 + k * 0.16);
        var fg = ctx.createLinearGradient(0, fy, W, fy);
        fg.addColorStop(0, "rgba(255,255,255,0)");
        fg.addColorStop(0.5, "rgba(255,255,255,.4)");
        fg.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = fg;
        ctx.fillRect(0, fy, W, 60);
      }
    }

    // 雨
    if (f.precip === "rain") {
      ctx.strokeStyle = "rgba(255,255,255,.6)";
      ctx.lineWidth = 2;
      var rn = f.heavy ? 90 : 45;
      for (var r = 0; r < rn; r++) {
        var rx = rand(0, W), ry = rand(0, H * 0.7);
        ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 6, ry + 26); ctx.stroke();
      }
    }
    // 雪
    if (f.precip === "snow") {
      ctx.fillStyle = "rgba(255,255,255,.9)";
      for (var s = 0; s < 60; s++) {
        ctx.beginPath(); ctx.arc(rand(0, W), rand(0, H * 0.7), rand(2, 4), 0, Math.PI * 2); ctx.fill();
      }
    }

    // 闪电
    if (f.lightning) {
      ctx.save();
      ctx.shadowColor = "rgba(255,240,150,.9)"; ctx.shadowBlur = 24;
      ctx.fillStyle = "rgba(255,245,180,.95)";
      ctx.beginPath();
      ctx.moveTo(W * 0.6, H * 0.1);
      ctx.lineTo(W * 0.56, H * 0.32);
      ctx.lineTo(W * 0.62, H * 0.32);
      ctx.lineTo(W * 0.55, H * 0.52);
      ctx.lineTo(W * 0.66, H * 0.3);
      ctx.lineTo(W * 0.6, H * 0.3);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // 彩虹
    if (f.rainbow) {
      var colors = ["#ff5d5d", "#ffa94d", "#ffe066", "#69db7c", "#4dabf7", "#b197fc"];
      var baseY = H * 0.62;
      for (var ci = 0; ci < 6; ci++) {
        drawArc(ctx, W * 0.5, baseY, 150 - ci * 22, colors[ci]);
      }
    }

    // 风
    if (f.wind) {
      ctx.strokeStyle = "rgba(255,255,255,.55)";
      ctx.lineWidth = 3;
      for (var wi = 0; wi < 4; wi++) {
        var wy = H * (0.16 + wi * 0.14);
        ctx.beginPath();
        ctx.moveTo(0, wy);
        ctx.bezierCurveTo(W * 0.3, wy - 20, W * 0.6, wy + 20, W, wy - 6);
        ctx.stroke();
      }
    }

    // 底部遮罩
    var sc = ctx.createLinearGradient(0, H * 0.42, 0, H);
    sc.addColorStop(0, "rgba(0,0,0,0)");
    sc.addColorStop(1, "rgba(0,0,0,.62)");
    ctx.fillStyle = sc;
    ctx.fillRect(0, H * 0.42, W, H * 0.58);

    // 文本
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.font = "600 22px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("灵魂天气 · 你的内心天气预报", W / 2, H * 0.06);

    ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    ctx.font = "800 66px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText(data.name, 50, H * 0.58);

    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.font = "500 28px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText(data.label, 50, H * 0.58 + 44);

    // 分割线
    ctx.strokeStyle = "rgba(255,255,255,.25)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(50, H * 0.58 + 70);
    ctx.lineTo(W - 50, H * 0.58 + 70);
    ctx.stroke();

    // 预报（自动换行）
    ctx.fillStyle = "rgba(255,255,255,.95)";
    ctx.font = "400 28px 'PingFang SC','Microsoft YaHei',sans-serif";
    var fy = H * 0.58 + 120;
    var lines = wrapCJK(ctx, data.forecast, W - 100, 42);
    lines.forEach(function (ln, i) { ctx.fillText(ln, 50, fy + i * 42); });

    var metaY = fy + lines.length * 42 + 26;
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.font = "500 26px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText("情绪指数 " + data.index + "°", 50, metaY);
    ctx.textAlign = "right";
    ctx.fillText(data.dateLine, W - 50, metaY);
    ctx.textAlign = "left";

    // 朋友圈文案
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.font = "italic 500 26px 'PingFang SC','Microsoft YaHei',sans-serif";
    var cy = metaY + 50;
    var cl = wrapCJK(ctx, data.caption, W - 100, 38);
    cl.forEach(function (ln, i) { ctx.fillText(ln, 50, cy + i * 38); });

    // 水印
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.font = "400 20px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("MoodWeather · 灵魂天气", W / 2, H - 26);
    ctx.textAlign = "left";
  }

  function wrapCJK(ctx, text, maxW, lh) {
    var line = "", lines = [];
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      var test = line + ch;
      if (ctx.measureText(test).width > maxW && line) {
        lines.push(line); line = ch;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function download() {
    if (!current) return;
    var W = 720, H = 1160, scale = 2;
    var canvas = document.createElement("canvas");
    canvas.width = W * scale; canvas.height = H * scale;
    var ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    drawCardCanvas(ctx, W, H, current);
    canvas.toBlob(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "灵魂天气-" + current.name + "-" + current.dateFile + ".png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }, "image/png");
  }

  // ===== 事件绑定 =====
  function setTab(which) {
    var quiz = which === "quiz";
    $("tabQuiz").classList.toggle("active", quiz);
    $("tabPick").classList.toggle("active", !quiz);
    $("tabQuiz").setAttribute("aria-selected", quiz ? "true" : "false");
    $("tabPick").setAttribute("aria-selected", quiz ? "false" : "true");
    $("panelQuiz").classList.toggle("active", quiz);
    $("panelPick").classList.toggle("active", !quiz);
  }
  $("tabQuiz").addEventListener("click", function () { setTab("quiz"); });
  $("tabPick").addEventListener("click", function () { setTab("pick"); });
  $("tabQuiz").addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setTab("quiz"); } });
  $("tabPick").addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setTab("pick"); } });

  $("quizSubmit").addEventListener("click", function () {
    var tally = {};
    var answered = 0;
    QUIZ.forEach(function (item, qi) {
      var k = quizSel[qi];
      if (k) { tally[k] = (tally[k] || 0) + 1; answered++; }
    });
    if (answered < QUIZ.length) {
      alert("还有 " + (QUIZ.length - answered) + " 题没选哦～");
      return;
    }
    var best = null, bestN = -1;
    Object.keys(tally).forEach(function (k) {
      if (tally[k] > bestN) { bestN = tally[k]; best = k; }
    });
    generate(best);
  });

  $("downloadBtn").addEventListener("click", download);
  $("rewordBtn").addEventListener("click", reword);
  $("retryBtn").addEventListener("click", function () { showPanel("quiz"); setTab("quiz"); });

  // 初始化
  renderQuiz();
  renderChips();
})();
</script>
</body>
