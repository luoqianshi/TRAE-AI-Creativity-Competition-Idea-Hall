<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA现役球员数据分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 30%, #312e81 60%, #1e1b4b 100%);
            min-height: 100vh;
            color: #fff;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(245, 101, 101, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(66, 153, 225, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(245, 101, 101, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            padding: 20px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #f56565, #fc8181, #fbd38d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #f56565, #fc8181);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 4px 15px rgba(245, 101, 101, 0.4);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        nav a {
            color: #a0aec0;
            text-decoration: none;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 25px;
            transition: all 0.3s ease;
            position: relative;
        }

        nav a:hover {
            background: rgba(245, 101, 101, 0.15);
            color: #f56565;
            transform: translateY(-2px);
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #f56565, #fc8181);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        nav a:hover::after {
            width: 60%;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 50px;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '🏀';
            position: absolute;
            top: -50px;
            right: -50px;
            font-size: 200px;
            opacity: 0.05;
            transform: rotate(15deg);
        }

        .hero-section h2 {
            font-size: 42px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #fff, #e2e8f0, #a0aec0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            text-shadow: 0 0 60px rgba(255, 255, 255, 0.2);
        }

        .hero-section p {
            color: #a0aec0;
            font-size: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #f56565, #fc8181, #fbd38d);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .stat-card:hover::before {
            transform: scaleX(1);
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(245, 101, 101, 0.2);
            border-color: rgba(245, 101, 101, 0.3);
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 15px;
            transition: transform 0.4s ease;
        }

        .stat-card:hover .stat-icon {
            transform: scale(1.2) rotate(5deg);
        }

        .stat-value {
            font-size: 52px;
            font-weight: 800;
            background: linear-gradient(135deg, #f56565, #fc8181);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 15px;
            color: #a0aec0;
            font-weight: 500;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 700;
        }

        .section-title::before {
            content: '';
            width: 5px;
            height: 30px;
            background: linear-gradient(180deg, #f56565, #fc8181);
            border-radius: 3px;
            box-shadow: 0 0 15px rgba(245, 101, 101, 0.5);
        }

        .ranking-section {
            margin-bottom: 50px;
        }

        .ranking-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            color: #a0aec0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 14px;
        }

        .tab:hover {
            background: rgba(245, 101, 101, 0.1);
            border-color: rgba(245, 101, 101, 0.3);
            color: #f56565;
        }

        .tab.active {
            background: linear-gradient(135deg, #f56565, #fc8181);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 20px rgba(245, 101, 101, 0.4);
        }

        .player-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .player-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(245, 101, 101, 0.1) 0%, transparent 70%);
            transform: translate(50%, -50%);
        }

        .player-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(245, 101, 101, 0.15);
            border-color: rgba(245, 101, 101, 0.3);
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .player-rank {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #f56565, #fc8181);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(245, 101, 101, 0.4);
        }

        .avatar-container {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .player-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s ease;
        }

        .player-avatar-fallback {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #4299e1, #63b3ed);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .player-card:hover .player-avatar {
            transform: scale(1.05);
        }

        .player-card:hover .player-avatar-fallback {
            transform: scale(1.05);
        }

        .player-info h3 {
            font-size: 20px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .player-info p {
            font-size: 14px;
            color: #a0aec0;
        }

        .player-info .team-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(66, 153, 225, 0.15);
            border-radius: 12px;
            font-size: 12px;
            margin-top: 8px;
            color: #63b3ed;
        }

        .player-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .mini-stat {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .player-card:hover .mini-stat {
            background: rgba(245, 101, 101, 0.1);
        }

        .mini-stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #f56565;
        }

        .mini-stat-label {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(550px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            transition: all 0.4s ease;
        }

        .chart-card:hover {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .chart-card h3 {
            margin-bottom: 25px;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-icon {
            font-size: 24px;
        }

        .chart-container {
            height: 320px;
        }

        .compare-section {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px;
        }

        .compare-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .compare-select-wrapper {
            display: flex;
            gap: 15px;
        }

        .compare-select {
            padding: 12px 25px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            min-width: 180px;
            transition: all 0.3s ease;
        }

        .compare-select:hover {
            border-color: rgba(245, 101, 101, 0.5);
            background: rgba(245, 101, 101, 0.05);
        }

        .compare-select option {
            background: #0f172a;
            color: #fff;
            padding: 10px;
        }

        .compare-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            overflow: hidden;
        }

        .compare-table th,
        .compare-table td {
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .compare-table th {
            background: linear-gradient(90deg, rgba(245, 101, 101, 0.15), rgba(245, 101, 101, 0.05));
            color: #f56565;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .compare-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .compare-table tr:last-child td {
            border-bottom: none;
        }

        .player-name-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .player-name-cell .avatar-container {
            width: 50px;
            height: 50px;
        }

        .player-name-cell .player-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(245, 101, 101, 0.3);
        }

        .player-name-cell .player-avatar-fallback {
            width: 100%;
            height: 100%;
            font-size: 16px;
            border: 2px solid rgba(245, 101, 101, 0.3);
        }

        .player-name-cell span {
            font-weight: 600;
            font-size: 15px;
        }

        .highlight {
            background: rgba(245, 101, 101, 0.2);
            border-radius: 8px;
            font-weight: 700;
            color: #f56565;
            box-shadow: 0 0 15px rgba(245, 101, 101, 0.2);
        }

        footer {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            padding: 40px;
            text-align: center;
            margin-top: 60px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        .footer-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .footer-logo h3 {
            font-size: 22px;
            background: linear-gradient(90deg, #f56565, #fc8181);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #a0aec0;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: #f56565;
        }

        .footer-copyright {
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 20px;
            }

            nav ul {
                gap: 15px;
            }

            nav a {
                padding: 8px 15px;
                font-size: 14px;
            }

            .hero-section {
                padding: 40px 15px;
            }

            .hero-section h2 {
                font-size: 28px;
            }

            .hero-section p {
                font-size: 16px;
            }

            .stats-cards {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .stat-card {
                padding: 20px;
            }

            .stat-value {
                font-size: 36px;
            }

            .charts-section {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 250px;
            }

            .compare-header {
                flex-direction: column;
                align-items: stretch;
            }

            .compare-select-wrapper {
                flex-direction: column;
            }

            .compare-table {
                font-size: 12px;
            }

            .compare-table th,
            .compare-table td {
                padding: 12px 5px;
            }

            .player-name-cell {
                flex-direction: column;
                gap: 5px;
            }

            .player-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🏀</div>
                <h1>NBA数据中心</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="#home">首页</a></li>
                    <li><a href="#ranking">球员排名</a></li>
                    <li><a href="#charts">数据图表</a></li>
                    <li><a href="#compare">球员对比</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <section id="home" class="hero-section">
            <h2>NBA现役球员数据分析平台</h2>
            <p>实时追踪联盟顶级球员表现，深度分析数据趋势，为篮球爱好者提供最全面的球员数据洞察</p>
        </section>

        <section class="stats-cards">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-value">450+</div>
                <div class="stat-label">现役球员</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏢</div>
                <div class="stat-value">30</div>
                <div class="stat-label">联盟球队</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value">82</div>
                <div class="stat-label">常规赛</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <div class="stat-value">16</div>
                <div class="stat-label">季后赛球队</div>
            </div>
        </section>

        <section id="ranking" class="ranking-section">
            <h2 class="section-title">球员排名</h2>
            <div class="ranking-tabs">
                <button class="tab active" onclick="switchTab('points')">得分榜</button>
                <button class="tab" onclick="switchTab('rebounds')">篮板榜</button>
                <button class="tab" onclick="switchTab('assists')">助攻榜</button>
                <button class="tab" onclick="switchTab('steals')">抢断榜</button>
                <button class="tab" onclick="switchTab('blocks')">盖帽榜</button>
            </div>
            <div class="player-cards" id="playerCards">
            </div>
        </section>

        <section id="charts" class="charts-section">
            <div class="chart-card">
                <h3><span class="chart-icon">📈</span>联盟数据分布对比</h3>
                <div class="chart-container">
                    <canvas id="distributionChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3><span class="chart-icon">👤</span>位置分布</h3>
                <div class="chart-container">
                    <canvas id="positionChart"></canvas>
                </div>
            </div>
        </section>

        <section id="compare" class="compare-section">
            <div class="compare-header">
                <h2 class="section-title">球员对比</h2>
                <div class="compare-select-wrapper">
                    <select class="compare-select" id="player1Select" onchange="updateCompare()">
                    </select>
                    <select class="compare-select" id="player2Select" onchange="updateCompare()">
                    </select>
                </div>
            </div>
            <table class="compare-table" id="compareTable">
                <thead>
                    <tr>
                        <th>数据类型</th>
                        <th id="comparePlayer1">球员1</th>
                        <th id="comparePlayer2">球员2</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>场均得分</td><td id="c-p1-p"></td><td id="c-p2-p"></td></tr>
                    <tr><td>场均篮板</td><td id="c-p1-r"></td><td id="c-p2-r"></td></tr>
                    <tr><td>场均助攻</td><td id="c-p1-a"></td><td id="c-p2-a"></td></tr>
                    <tr><td>场均抢断</td><td id="c-p1-s"></td><td id="c-p2-s"></td></tr>
                    <tr><td>场均盖帽</td><td id="c-p1-b"></td><td id="c-p2-b"></td></tr>
                    <tr><td>投篮命中率</td><td id="c-p1-fg"></td><td id="c-p2-fg"></td></tr>
                    <tr><td>三分命中率</td><td id="c-p1-3p"></td><td id="c-p2-3p"></td></tr>
                    <tr><td>罚球命中率</td><td id="c-p1-ft"></td><td id="c-p2-ft"></td></tr>
                </tbody>
            </table>
        </section>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-logo">
                <span class="logo-icon">🏀</span>
                <h3>NBA数据中心</h3>
            </div>
            <div class="footer-links">
                <a href="#home">首页</a>
                <a href="#ranking">球员排名</a>
                <a href="#charts">数据图表</a>
                <a href="#compare">球员对比</a>
            </div>
            <p class="footer-copyright">© 2024 NBA数据中心 - 为篮球爱好者提供最全面的球员数据分析</p>
        </div>
    </footer>

    <script>
        const players = [
            { id: 1, name: '勒布朗·詹姆斯', team: '洛杉矶湖人', position: 'SF', age: 39, avatar: 'https://cdn.nba.com/headshots/nba/latest/1040x760/2544.png', initials: 'LJ', stats: { points: 25.5, rebounds: 8.3, assists: 7.1, steals: 1.1, blocks: 0.6, fg: 52.4, three: 34.2, ft: 76.8, gp: 70, mpg: 34.6 } },

        ];

        const currentTab = { type: 'points', label: '得分榜' };

        function getSortedPlayers(type) {
            const sortMap = {
                points: p => p.stats.points,
                rebounds: p => p.stats.rebounds,
                assists: p => p.stats.assists,
                steals: p => p.stats.steals,
                blocks: p => p.stats.blocks
            };
            return [...players].sort((a, b) => sortMap[type](b) - sortMap[type](a));
        }

        function renderPlayerCards() {
            const sortedPlayers = getSortedPlayers(currentTab.type);
            const cardsDiv = document.getElementById('playerCards');
            cardsDiv.innerHTML = '';

            sortedPlayers.slice(0, 6).forEach((player, index) => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.innerHTML = `
                    <div class="player-header">
                        <div class="player-rank">${index + 1}</div>
                        <div class="avatar-container">
                            <img src="${player.avatar}" alt="${player.name}" class="player-avatar" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="player-avatar-fallback">${player.initials}</div>
                        </div>
                        <div class="player-info">
                            <h3>${player.name}</h3>
                            <p>${player.position} | ${player.age}岁</p>
                            <span class="team-badge">${player.team}</span>
                        </div>
                    </div>
                    <div class="player-stats">
                        <div class="mini-stat"><div class="mini-stat-value">${player.stats.points}</div><div class="mini-stat-label">得分</div></div>
                        <div class="mini-stat"><div class="mini-stat-value">${player.stats.rebounds}</div><div class="mini-stat-label">篮板</div></div>
                        <div class="mini-stat"><div class="mini-stat-value">${player.stats.assists}</div><div class="mini-stat-label">助攻</div></div>
                    </div>
                `;
                cardsDiv.appendChild(card);
            });
        }

        function switchTab(type) {
            currentTab.type = type;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderPlayerCards();
        }

        function initCompareSelects() {
            const p1Select = document.getElementById('player1Select');
            const p2Select = document.getElementById('player2Select');

            players.forEach(player => {
                const opt1 = document.createElement('option');
                opt1.value = player.id;
                opt1.textContent = player.name;
                p1Select.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = player.id;
                opt2.textContent = player.name;
                p2Select.appendChild(opt2);
            });

            p2Select.value = 2;
            updateCompare();
        }

        function updateCompare() {
            const p1Id = parseInt(document.getElementById('player1Select').value);
            const p2Id = parseInt(document.getElementById('player2Select').value);

            const p1 = players.find(p => p.id === p1Id);
            const p2 = players.find(p => p.id === p2Id);

            document.getElementById('comparePlayer1').innerHTML = `<div class="player-name-cell"><div class="avatar-container"><img src="${p1.avatar}" alt="${p1.name}" class="player-avatar" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="player-avatar-fallback">${p1.initials}</div></div><span>${p1.name}</span></div>`;
            document.getElementById('comparePlayer2').innerHTML = `<div class="player-name-cell"><div class="avatar-container"><img src="${p2.avatar}" alt="${p2.name}" class="player-avatar" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="player-avatar-fallback">${p2.initials}</div></div><span>${p2.name}</span></div>`;

            const statKeys = ['p', 'r', 'a', 's', 'b', 'fg', '3p', 'ft'];
            const statValues1 = [p1.stats.points, p1.stats.rebounds, p1.stats.assists, p1.stats.steals, p1.stats.blocks, p1.stats.fg, p1.stats.three, p1.stats.ft];
            const statValues2 = [p2.stats.points, p2.stats.rebounds, p2.stats.assists, p2.stats.steals, p2.stats.blocks, p2.stats.fg, p2.stats.three, p2.stats.ft];

            statKeys.forEach((key, i) => {
                const cell1 = document.getElementById(`c-p1-${key}`);
                const cell2 = document.getElementById(`c-p2-${key}`);
                cell1.textContent = statValues1[i] + (key === 'fg' || key === '3p' || key === 'ft' ? '%' : '');
                cell2.textContent = statValues2[i] + (key === 'fg' || key === '3p' || key === 'ft' ? '%' : '');
                
                cell1.classList.remove('highlight');
                cell2.classList.remove('highlight');
                
                if (statValues1[i] > statValues2[i]) {
                    cell1.classList.add('highlight');
                } else if (statValues2[i] > statValues1[i]) {
                    cell2.classList.add('highlight');
                }
            });
        }

            const ctx2 = document.getElementById('positionChart').getContext('2d');
            new Chart(ctx2, {

                data: {
                    labels: ['控球后卫(PG)', '得分后卫(SG)', '小前锋(SF)', '大前锋(PF)', '中锋(C)'],
                    datasets: [{
                        data: [22, 24, 26, 18, 10],

                            'rgba(245, 101, 101, 0.85)',

                            'rgba(48, 209, 88, 0.85)',
                            'rgba(250, 204, 21, 0.85)',
                            'rgba(168, 85, 247, 0.85)'
                        ],
                        borderWidth: 0,
                        hoverOffset: 15
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { 
                                color: '#a0aec0',
                                font: { size: 12 },
                                padding: 15,
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#fff',
                            bodyColor: '#a0aec0',
                            borderColor: 'rgba(255, 255, 255, 0.1)',
                            borderWidth: 1,
                            padding: 12,
                            cornerRadius: 8,
                            callbacks: {
                                label: function(context) {
                                    const value = context.raw;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = ((value / total) * 100).toFixed(1);
                                    return `${context.label}: ${percentage}%`;
                                }
                            }
                        }
                    },
                    cutout: '65%'
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderPlayerCards();
            initCompareSelects();
            initCharts();
        });
    </script>
