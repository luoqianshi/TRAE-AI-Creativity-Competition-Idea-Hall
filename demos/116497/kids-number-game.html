<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>儿童数字敲键盘游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .game-container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 420px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .game-title {
            font-size: 32px;
            color: #FF6B6B;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0 rgba(255,107,107,0.2);
        }

        .target-area {
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            border-radius: 25px;
            padding: 40px 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
        }

        .target-label {
            font-size: 20px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 10px;
        }

        .target-number {
            font-size: 120px;
            font-weight: bold;
            color: white;
            text-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .feedback-area {
            min-height: 60px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feedback-text {
            font-size: 28px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 20px;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
        }

        .feedback-text.show {
            opacity: 1;
            transform: scale(1);
        }

        .feedback-text.correct {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .feedback-text.wrong {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #f0f0f0;
            border-radius: 6px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF6B6B, #FFE66D);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 6px;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .key-btn {
            width: 100%;
            height: 80px;
            font-size: 36px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
        }

        .key-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgba(0,0,0,0.15);
        }

        .key-btn.used {
            opacity: 0.5;
            pointer-events: none;
        }

        .key-1 { background: #FF6B6B; color: white; }
        .key-2 { background: #4ECDC4; color: white; }
        .key-3 { background: #FFE66D; color: #333; }
        .key-4 { background: #95E1D3; color: #333; }
        .key-5 { background: #F38181; color: white; }
        .key-6 { background: #AA96DA; color: white; }
        .key-7 { background: #FCBAD3; color: #333; }
        .key-8 { background: #A8D8EA; color: #333; }
        .key-9 { background: #FF9A9E; color: white; }

        .score-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .score-item {
            font-size: 18px;
            font-weight: bold;
            color: #666;
        }

        .score-value {
            color: #FF6B6B;
            font-size: 24px;
        }

        .restart-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(102,126,234,0.4);
            transition: all 0.2s ease;
        }

        .restart-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 rgba(102,126,234,0.4);
        }

        .stars {
            margin-bottom: 20px;
            font-size: 40px;
        }

        .star {
            display: inline-block;
            margin: 0 5px;
            color: #DDD;
            transition: color 0.3s ease;
        }

        .star.active {
            color: #FFE66D;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.3s ease;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #FF6B6B;
            border-radius: 50%;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(500px) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">🎮 数字大挑战</h1>
        
        <div class="score-board">
            <div class="score-item">得分: <span class="score-value" id="score">0</span></div>
            <div class="score-item">正确: <span class="score-value" id="correct-count">0</span></div>
        </div>

        <div class="stars" id="stars">
            <span class="star">⭐</span>
            <span class="star">⭐</span>
            <span class="star">⭐</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <div class="target-area">
            <div class="target-label">请找到数字</div>
            <div class="target-number" id="target-number">?</div>
        </div>

        <div class="feedback-area">
            <div class="feedback-text" id="feedback"></div>
        </div>

        <div class="keyboard" id="keyboard">
            <button class="key-btn key-1" data-number="1">1</button>
            <button class="key-btn key-2" data-number="2">2</button>
            <button class="key-btn key-3" data-number="3">3</button>
            <button class="key-btn key-4" data-number="4">4</button>
            <button class="key-btn key-5" data-number="5">5</button>
            <button class="key-btn key-6" data-number="6">6</button>
            <button class="key-btn key-7" data-number="7">7</button>
            <button class="key-btn key-8" data-number="8">8</button>
            <button class="key-btn key-9" data-number="9">9</button>
        </div>

        <button class="restart-btn" id="restart-btn" style="display: none;">🔄 再玩一次</button>
    </div>

    <script>
        const targetNumberEl = document.getElementById('target-number');
        const feedbackEl = document.getElementById('feedback');
        const keyboard = document.getElementById('keyboard');
        const scoreEl = document.getElementById('score');
        const correctCountEl = document.getElementById('correct-count');
        const progressEl = document.getElementById('progress');
        const starsEl = document.getElementById('stars');
        const restartBtn = document.getElementById('restart-btn');

        let currentTarget = 0;
        let score = 0;
        let correctCount = 0;
        let totalRounds = 9;
        let round = 0;
        let usedNumbers = [];

        function getRandomNumber() {
            const available = [1, 2, 3, 4, 5, 6, 7, 8, 9].filter(n => !usedNumbers.includes(n));
            if (available.length === 0) return null;
            return available[Math.floor(Math.random() * available.length)];
        }

        function startRound() {
            currentTarget = getRandomNumber();
            if (currentTarget === null) {
                gameOver();
                return;
            }
            
            targetNumberEl.textContent = currentTarget;
            round++;
            updateProgress();
            updateStars();
        }

        function updateProgress() {
            const percent = ((round - 1) / totalRounds) * 100;
            progressEl.style.width = percent + '%';
        }

        function updateStars() {
            const stars = starsEl.querySelectorAll('.star');
            const activeStars = Math.min(3, Math.floor(correctCount / 3));
            stars.forEach((star, index) => {
                star.classList.toggle('active', index < activeStars);
            });
        }

        function showFeedback(message, isCorrect) {
            feedbackEl.textContent = message;
            feedbackEl.className = 'feedback-text show ' + (isCorrect ? 'correct' : 'wrong');
            
            if (!isCorrect) {
                targetNumberEl.parentElement.classList.add('shake');
                setTimeout(() => {
                    targetNumberEl.parentElement.classList.remove('shake');
                }, 300);
            }

            setTimeout(() => {
                feedbackEl.classList.remove('show');
            }, 1500);
        }

        function createConfetti() {
            const container = document.querySelector('.game-container');
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#95E1D3', '#AA96DA'][Math.floor(Math.random() * 5)];
                confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                container.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.remove();
                }, 4000);
            }
        }

        function handleKeyPress(number) {
            const num = parseInt(number);
            
            if (usedNumbers.includes(num)) return;

            if (num === currentTarget) {
                score += 10;
                correctCount++;
                usedNumbers.push(num);
                
                showFeedback('🎉 你真棒！', true);
                createConfetti();
                
                const keyBtn = keyboard.querySelector(`[data-number="${num}"]`);
                if (keyBtn) keyBtn.classList.add('used');
                
                setTimeout(() => {
                    startRound();
                }, 1000);
            } else {
                showFeedback('💪 再试一次！', false);
            }

            scoreEl.textContent = score;
            correctCountEl.textContent = correctCount;
        }

        function gameOver() {
            progressEl.style.width = '100%';
            keyboard.style.display = 'none';
            restartBtn.style.display = 'block';
            
            let message = '';
            if (correctCount === 9) {
                message = '🏆 太棒了！你全部答对了！';
            } else if (correctCount >= 6) {
                message = '🌟 做得很好！继续加油！';
            } else {
                message = '💪 不错哦！再玩一次吧！';
            }
            
            feedbackEl.textContent = message;
            feedbackEl.className = 'feedback-text show correct';
        }

        function restartGame() {
            usedNumbers = [];
            score = 0;
            correctCount = 0;
            round = 0;
            
            scoreEl.textContent = '0';
            correctCountEl.textContent = '0';
            progressEl.style.width = '0%';
            
            const keyBtns = keyboard.querySelectorAll('.key-btn');
            keyBtns.forEach(btn => btn.classList.remove('used'));
            
            keyboard.style.display = 'grid';
            restartBtn.style.display = 'none';
            feedbackEl.classList.remove('show');
            
            const stars = starsEl.querySelectorAll('.star');
            stars.forEach(star => star.classList.remove('active'));
            
            startRound();
        }

        keyboard.addEventListener('click', (e) => {
            const btn = e.target.closest('.key-btn');
            if (btn) {
                handleKeyPress(btn.dataset.number);
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '9') {
                handleKeyPress(e.key);
                
                const btn = keyboard.querySelector(`[data-number="${e.key}"]`);
                if (btn) {
                    btn.style.transform = 'translateY(6px)';
                    btn.style.boxShadow = '0 0 0 rgba(0,0,0,0.15)';
                    setTimeout(() => {
                        btn.style.transform = '';
                        btn.style.boxShadow = '';
                    }, 200);
                }
            }
        });

        restartBtn.addEventListener('click', restartGame);

        startRound();
    </script>
</body>
</html>
