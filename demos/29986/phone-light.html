<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>手机补光灯</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* 全屏补光层 */
  #light-screen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #fff;
    transition: background-color 0.15s ease;
    z-index: 0;
  }

  /* 主容器 */
  #app {
    position: relative;
    z-index: 1;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 16px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }

  /* 顶部状态栏 */
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    padding-top: max(12px, env(safe-area-inset-top));
    z-index: 10;
  }

  .top-bar .title {
    font-size: 16px;
    font-weight: 600;
    color: rgba(0,0,0,0.6);
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }

  .top-bar .lock-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }

  .top-bar .lock-btn:active { transform: scale(0.9); }
  .top-bar .lock-btn svg { width: 18px; height: 18px; }

  /* 控制面板 */
  .control-panel {
    background: rgba(0,0,0,0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 24px 20px 20px;
    margin-bottom: 8px;
    transition: opacity 0.3s;
  }

  .control-panel.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* 亮度显示 */
  .brightness-display {
    text-align: center;
    margin-bottom: 16px;
  }

  .brightness-value {
    font-size: 48px;
    font-weight: 200;
    color: rgba(0,0,0,0.7);
    line-height: 1;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
  }

  .brightness-label {
    font-size: 12px;
    color: rgba(0,0,0,0.4);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* 滑块样式 */
  .slider-container {
    margin-bottom: 20px;
  }

  .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .slider-label {
    font-size: 13px;
    font-weight: 500;
    color: rgba(0,0,0,0.5);
  }

  .slider-value {
    font-size: 13px;
    color: rgba(0,0,0,0.4);
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2), 0 0 0 1px rgba(0,0,0,0.05);
    cursor: pointer;
    transition: transform 0.15s;
  }

  input[type="range"]::-webkit-slider-thumb:active {
    transform: scale(1.15);
  }

  #brightness-slider {
    background: linear-gradient(to right, rgba(0,0,0,0.15), rgba(0,0,0,0.8));
  }

  #warmth-slider {
    background: linear-gradient(to right, #ff8c42, #fff5e6, #b8d4ff, #6eb5ff);
  }

  /* 颜色预设 */
  .color-presets {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .color-preset {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .color-preset:active { transform: scale(0.9); }

  .color-preset.active {
    border-color: rgba(0,0,0,0.4);
    box-shadow: 0 0 0 3px rgba(0,0,0,0.1);
  }

  /* 美颜预设 */
  .beauty-section {
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: rgba(0,0,0,0.5);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .section-title::before {
    content: '';
    width: 3px;
    height: 14px;
    border-radius: 2px;
    background: rgba(0,0,0,0.3);
  }

  .beauty-presets {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .beauty-presets::-webkit-scrollbar { display: none; }

  .beauty-preset {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.2s;
    padding: 8px 12px;
    border-radius: 14px;
    border: 2px solid transparent;
    background: rgba(255,255,255,0.3);
    min-width: 68px;
  }

  .beauty-preset:active { transform: scale(0.95); }

  .beauty-preset.active {
    border-color: rgba(0,0,0,0.3);
    background: rgba(255,255,255,0.6);
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .beauty-preset .swatch {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }

  .beauty-preset .swatch::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.06);
  }

  .beauty-preset .swatch-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
  }

  .beauty-preset .preset-name {
    font-size: 11px;
    font-weight: 500;
    color: rgba(0,0,0,0.5);
    white-space: nowrap;
  }

  .beauty-preset.active .preset-name {
    color: rgba(0,0,0,0.7);
  }

  .beauty-preset .preset-desc {
    font-size: 9px;
    color: rgba(0,0,0,0.3);
    white-space: nowrap;
  }

  /* 模式切换 */
  .mode-tabs {
    display: flex;
    gap: 4px;
    background: rgba(0,0,0,0.08);
    border-radius: 12px;
    padding: 3px;
    margin-bottom: 16px;
  }

  .mode-tab {
    flex: 1;
    padding: 8px 12px;
    border: none;
    border-radius: 10px;
    background: transparent;
    font-size: 13px;
    font-weight: 500;
    color: rgba(0,0,0,0.4);
    cursor: pointer;
    transition: all 0.2s;
  }

  .mode-tab.active {
    background: rgba(255,255,255,0.8);
    color: rgba(0,0,0,0.7);
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  /* 底部操作栏 */
  .bottom-actions {
    display: flex;
    justify-content: center;
    gap: 16px;
    padding: 8px 0;
  }

  .action-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.12);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }

  .action-btn:active { transform: scale(0.9); }
  .action-btn svg { width: 22px; height: 22px; }

  .action-btn.active {
    background: rgba(0,0,0,0.25);
  }

  /* SOS 模式闪烁动画 */
  @keyframes sos-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  #light-screen.sos-mode {
    animation: sos-blink 0.5s ease-in-out infinite;
  }

  /* 呼吸灯模式 */
  @keyframes breathe {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  #light-screen.breathe-mode {
    animation: breathe 3s ease-in-out infinite;
  }

  /* 频闪模式 */
  @keyframes strobe {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  #light-screen.strobe-mode {
    animation: strobe 0.1s step-end infinite;
  }

  /* 提示信息 */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  .toast.show { opacity: 1; }

  /* 颜色选择器容器 */
  .custom-color-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .custom-color-input {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    padding: 0;
    overflow: hidden;
  }

  .custom-color-input::-webkit-color-swatch-wrapper { padding: 0; }
  .custom-color-input::-webkit-color-swatch { border: none; border-radius: 50%; }

  .custom-color-label {
    font-size: 13px;
    color: rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<div id="light-screen"></div>

<div class="top-bar">
  <div class="title" id="mode-title">补光灯</div>
  <button class="lock-btn" id="wake-lock-btn" title="保持屏幕常亮">
    <svg viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
  </button>
</div>

<div id="app">
  <div class="control-panel" id="control-panel">
    <!-- 亮度显示 -->
    <div class="brightness-display">
      <div class="brightness-value" id="brightness-value">100%</div>
      <div class="brightness-label">亮度</div>
    </div>

    <!-- 亮度滑块 -->
    <div class="slider-container">
      <input type="range" id="brightness-slider" min="1" max="100" value="100">
    </div>

    <!-- 模式切换 -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="constant">常亮</button>
      <button class="mode-tab" data-mode="breathe">呼吸灯</button>
      <button class="mode-tab" data-mode="strobe">频闪</button>
      <button class="mode-tab" data-mode="sos">SOS</button>
    </div>

    <!-- 色温滑块 -->
    <div class="slider-container" id="warmth-container">
      <div class="slider-header">
        <span class="slider-label">色温</span>
        <span class="slider-value" id="warmth-value">6500K</span>
      </div>
      <input type="range" id="warmth-slider" min="2700" max="10000" value="6500">
    </div>

    <!-- 美颜预设色板 -->
    <div class="beauty-section" id="beauty-section">
      <div class="section-title">美颜光效</div>
      <div class="beauty-presets" id="beauty-presets"></div>
    </div>

    <!-- 颜色预设 -->
    <div class="color-presets" id="color-presets">
      <div class="color-preset active" data-color="white" style="background: #ffffff;" title="白色"></div>
      <div class="color-preset" data-color="#FFF5E6" style="background: #FFF5E6;" title="暖白"></div>
      <div class="color-preset" data-color="#FFE0B2" style="background: #FFE0B2;" title="暖黄"></div>
      <div class="color-preset" data-color="#FF8C42" style="background: #FF8C42;" title="烛光"></div>
      <div class="color-preset" data-color="#B8D4FF" style="background: #B8D4FF;" title="冷白"></div>
      <div class="color-preset" data-color="#6EB5FF" style="background: #6EB5FF;" title="冷蓝"></div>
      <div class="color-preset" data-color="#C8E6C9" style="background: #C8E6C9;" title="浅绿"></div>
      <div class="color-preset" data-color="#F8BBD0" style="background: #F8BBD0;" title="浅粉"></div>
    </div>

    <!-- 自定义颜色 -->
    <div class="custom-color-row">
      <input type="color" class="custom-color-input" id="custom-color" value="#ffffff">
      <span class="custom-color-label">自定义颜色</span>
    </div>
  </div>

  <!-- 底部操作 -->
  <div class="bottom-actions">
    <button class="action-btn" id="toggle-panel" title="显示/隐藏控制面板">
      <svg viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button class="action-btn" id="fullscreen-btn" title="全屏模式">
      <svg viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 3 21 3 21 9"/>
        <polyline points="9 21 3 21 3 15"/>
        <line x1="21" y1="3" x2="14" y2="10"/>
        <line x1="3" y1="21" x2="10" y2="14"/>
      </svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  // ===== 状态管理 =====
  const state = {
    brightness: 100,
    warmth: 6500,
    mode: 'constant', // constant, breathe, strobe, sos
    color: '#ffffff',
    panelVisible: true,
    wakeLock: null,
    isFullscreen: false
  };

  // ===== DOM 元素 =====
  const lightScreen = document.getElementById('light-screen');
  const brightnessSlider = document.getElementById('brightness-slider');
  const brightnessValue = document.getElementById('brightness-value');
  const warmthSlider = document.getElementById('warmth-slider');
  const warmthValue = document.getElementById('warmth-value');
  const controlPanel = document.getElementById('control-panel');
  const modeTitle = document.getElementById('mode-title');
  const wakeLockBtn = document.getElementById('wake-lock-btn');
  const togglePanelBtn = document.getElementById('toggle-panel');
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const customColorInput = document.getElementById('custom-color');
  const colorPresets = document.getElementById('color-presets');
  const toastEl = document.getElementById('toast');
  const modeTabs = document.querySelectorAll('.mode-tab');
  const colorPresetBtns = document.querySelectorAll('.color-preset');
  const beautyPresetsContainer = document.getElementById('beauty-presets');

  // ===== 美颜预设数据 =====
  const beautyPresets = [
    {
      id: 'cool-white',
      name: '冷白皮',
      desc: '通透冷调',
      color: '#E8F0FF',
      warmth: 8000,
      brightness: 95,
      gradient: 'linear-gradient(135deg, #E8F0FF, #D4E4FF)'
    },
    {
      id: 'soft-focus',
      name: '磨皮感',
      desc: '柔光扩散',
      color: '#FFF8F0',
      warmth: 5500,
      brightness: 85,
      gradient: 'linear-gradient(135deg, #FFF8F0, #FFE8D6)'
    },
    {
      id: 'girly',
      name: '少女感',
      desc: '甜美粉调',
      color: '#FFE8EE',
      warmth: 6000,
      brightness: 90,
      gradient: 'linear-gradient(135deg, #FFE8EE, #FFD6E0)'
    },
    {
      id: 'honey-glow',
      name: '蜜桃光',
      desc: '暖橘氛围',
      color: '#FFECD2',
      warmth: 4500,
      brightness: 88,
      gradient: 'linear-gradient(135deg, #FFECD2, #FFD4A8)'
    },
    {
      id: 'moonlight',
      name: '月光白',
      desc: '清冷月光',
      color: '#F0F4FF',
      warmth: 9000,
      brightness: 80,
      gradient: 'linear-gradient(135deg, #F0F4FF, #DCE6FF)'
    },
    {
      id: 'morning',
      name: '晨光感',
      desc: '清新自然',
      color: '#FFF5E1',
      warmth: 5000,
      brightness: 92,
      gradient: 'linear-gradient(135deg, #FFF5E1, #FFE8C4)'
    },
    {
      id: 'film',
      name: '胶片感',
      desc: '复古色调',
      color: '#F5EDE0',
      warmth: 4200,
      brightness: 82,
      gradient: 'linear-gradient(135deg, #F5EDE0, #E8D8C4)'
    },
    {
      id: 'studio',
      name: '棚拍光',
      desc: '专业中性',
      color: '#FAFAFA',
      warmth: 6500,
      brightness: 100,
      gradient: 'linear-gradient(135deg, #FAFAFA, #F0F0F0)'
    },
    {
      id: 'sunset',
      name: '落日金',
      desc: '温暖金调',
      color: '#FFE4B5',
      warmth: 3500,
      brightness: 85,
      gradient: 'linear-gradient(135deg, #FFE4B5, #FFD080)'
    },
    {
      id: 'jelly',
      name: '果冻肌',
      desc: '通透水光',
      color: '#F0F8FF',
      warmth: 7000,
      brightness: 93,
      gradient: 'linear-gradient(135deg, #F0F8FF, #E0F0FF)'
    },
    {
      id: 'milk',
      name: '奶白光',
      desc: '柔和奶调',
      color: '#FFF9F0',
      warmth: 5800,
      brightness: 88,
      gradient: 'linear-gradient(135deg, #FFF9F0, #FFF0E0)'
    },
    {
      id: 'vampire',
      name: '吸血鬼',
      desc: '苍白冷白',
      color: '#E8EAFF',
      warmth: 9500,
      brightness: 78,
      gradient: 'linear-gradient(135deg, #E8EAFF, #D8DCFF)'
    }
  ];

  // ===== 渲染美颜预设 =====
  let activeBeautyPreset = null;

  function renderBeautyPresets() {
    beautyPresetsContainer.innerHTML = '';
    beautyPresets.forEach(preset => {
      const el = document.createElement('div');
      el.className = 'beauty-preset';
      el.dataset.id = preset.id;
      el.innerHTML = `
        <div class="swatch">
          <div class="swatch-inner" style="background: ${preset.gradient};"></div>
        </div>
        <div class="preset-name">${preset.name}</div>
        <div class="preset-desc">${preset.desc}</div>
      `;
      el.addEventListener('click', () => applyBeautyPreset(preset));
      beautyPresetsContainer.appendChild(el);
    });
  }

  function applyBeautyPreset(preset) {
    // 更新激活状态
    activeBeautyPreset = preset.id;
    document.querySelectorAll('.beauty-preset').forEach(el => {
      el.classList.toggle('active', el.dataset.id === preset.id);
    });

    // 清除颜色预设激活
    colorPresetBtns.forEach(b => b.classList.remove('active'));

    // 应用预设参数
    state.color = preset.color;
    state.warmth = preset.warmth;
    state.brightness = preset.brightness;

    // 同步 UI 控件
    brightnessSlider.value = state.brightness;
    brightnessValue.textContent = state.brightness + '%';
    warmthSlider.value = state.warmth;
    warmthValue.textContent = state.warmth + 'K';
    customColorInput.value = preset.color;

    updateLight();
    showToast(`已切换：${preset.name}`);
  }

  function clearBeautyPreset() {
    activeBeautyPreset = null;
    document.querySelectorAll('.beauty-preset').forEach(el => el.classList.remove('active'));
  }

  // ===== 色温到颜色转换 =====
  function warmthToColor(kelvin) {
    const temp = kelvin / 100;
    let r, g, b;

    if (temp <= 66) {
      r = 255;
      g = Math.min(255, Math.max(0, 99.4708025861 * Math.log(temp) - 161.1195681661));
      if (temp <= 19) {
        b = 0;
      } else {
        b = Math.min(255, Math.max(0, 138.5177312231 * Math.log(temp - 10) - 305.0447927307));
      }
    } else {
      r = Math.min(255, Math.max(0, 329.698727446 * Math.pow(temp - 60, -0.1332047592)));
      g = Math.min(255, Math.max(0, 288.1221695283 * Math.pow(temp - 60, -0.0755148492)));
      b = 255;
    }

    return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
  }

  // ===== 更新补光屏幕 =====
  function updateLight() {
    // 清除所有动画类
    lightScreen.classList.remove('sos-mode', 'breathe-mode', 'strobe-mode');

    let bgColor = state.color;

    // 如果是白色预设，使用色温颜色
    if (state.color === 'white' || state.color === '#ffffff') {
      bgColor = warmthToColor(state.warmth);
    }

    lightScreen.style.backgroundColor = bgColor;
    lightScreen.style.opacity = state.brightness / 100;

    // 应用模式动画
    if (state.mode === 'sos') {
      lightScreen.classList.add('sos-mode');
    } else if (state.mode === 'breathe') {
      lightScreen.classList.add('breathe-mode');
    } else if (state.mode === 'strobe') {
      lightScreen.classList.add('strobe-mode');
    }

    // 更新标题
    const modeNames = {
      'constant': '补光灯',
      'breathe': '呼吸灯',
      'strobe': '频闪灯',
      'sos': 'SOS 信号灯'
    };
    modeTitle.textContent = modeNames[state.mode] || '补光灯';
  }

  // ===== 亮度控制 =====
  brightnessSlider.addEventListener('input', function() {
    state.brightness = parseInt(this.value);
    brightnessValue.textContent = state.brightness + '%';
    updateLight();
  });

  // ===== 色温控制 =====
  warmthSlider.addEventListener('input', function() {
    state.warmth = parseInt(this.value);
    warmthValue.textContent = state.warmth + 'K';
    // 自动切换到白色模式
    state.color = 'white';
    colorPresetBtns.forEach(btn => btn.classList.remove('active'));
    colorPresetBtns[0].classList.add('active');
    customColorInput.value = '#ffffff';
    updateLight();
  });

  // ===== 模式切换 =====
  modeTabs.forEach(tab => {
    tab.addEventListener('click', function() {
      modeTabs.forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      state.mode = this.dataset.mode;
      updateLight();
    });
  });

  // ===== 颜色预设 =====
  colorPresetBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      colorPresetBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      state.color = this.dataset.color;
      customColorInput.value = state.color === 'white' ? '#ffffff' : state.color;
      clearBeautyPreset();
      updateLight();
    });
  });

  // ===== 自定义颜色 =====
  customColorInput.addEventListener('input', function() {
    state.color = this.value;
    colorPresetBtns.forEach(b => b.classList.remove('active'));
    clearBeautyPreset();
    updateLight();
  });

  // ===== 控制面板显示/隐藏 =====
  togglePanelBtn.addEventListener('click', function() {
    state.panelVisible = !state.panelVisible;
    controlPanel.classList.toggle('hidden', !state.panelVisible);
    this.classList.toggle('active', !state.panelVisible);
  });

  // ===== 全屏模式 =====
  fullscreenBtn.addEventListener('click', function() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const el = document.documentElement;
      if (el.requestFullscreen) {
        el.requestFullscreen();
      } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      }
      state.isFullscreen = true;
      this.classList.add('active');
      showToast('已进入全屏模式');
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
      state.isFullscreen = false;
      this.classList.remove('active');
      showToast('已退出全屏模式');
    }
  });

  // ===== 屏幕常亮（Wake Lock API） =====
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        state.wakeLock = await navigator.wakeLock.request('screen');
        state.wakeLock.addEventListener('release', () => {
          state.wakeLock = null;
          wakeLockBtn.classList.remove('active');
        });
        wakeLockBtn.classList.add('active');
        showToast('屏幕常亮已开启');
      } else {
        showToast('您的浏览器不支持屏幕常亮功能');
      }
    } catch (err) {
      showToast('无法开启屏幕常亮');
    }
  }

  async function releaseWakeLock() {
    if (state.wakeLock) {
      await state.wakeLock.release();
      state.wakeLock = null;
      wakeLockBtn.classList.remove('active');
      showToast('屏幕常亮已关闭');
    }
  }

  wakeLockBtn.addEventListener('click', function() {
    if (state.wakeLock) {
      releaseWakeLock();
    } else {
      requestWakeLock();
    }
  });

  // 页面可见性变化时重新获取 Wake Lock
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && state.wakeLock !== null) {
      await requestWakeLock();
    }
  });

  // ===== Toast 提示 =====
  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toastEl.classList.remove('show');
    }, 1500);
  }

  // ===== 双击屏幕切换面板 =====
  let lastTapTime = 0;
  lightScreen.addEventListener('click', function(e) {
    const now = Date.now();
    if (now - lastTapTime < 300) {
      state.panelVisible = !state.panelVisible;
      controlPanel.classList.toggle('hidden', !state.panelVisible);
      togglePanelBtn.classList.toggle('active', !state.panelVisible);
    }
    lastTapTime = now;
  });

  // ===== 防止页面滚动 =====
  document.body.addEventListener('touchmove', function(e) {
    e.preventDefault();
  }, { passive: false });

  // ===== 初始化 =====
  function init() {
    renderBeautyPresets();
    updateLight();
    // 自动请求屏幕常亮
    requestWakeLock();
  }

  init();
})();
</script>
</body>
</html>
