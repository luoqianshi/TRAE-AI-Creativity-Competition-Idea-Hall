<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ 面试通关主页</title>
<style>
  :root {
    --text-primary: #333333;
    --text-number: #e67e22; /* 橙色数字 */
    --glass-bg: rgba(255, 255, 255, 0.45);
    --glass-border: rgba(255, 255, 255, 0.3);
    --card-bg: rgba(252, 250, 246, 0.9); /* 柔和的米白色 */
    --theme-blue: #2c3e50;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    overflow: hidden;
  }

  .app-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
    background: rgba(255, 200, 150, 0.1); 
    z-index: 1;
  }

  /* 巨大的 C++ 背景水印，点明主题但不过分抢眼 */
  .bg-watermark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 35vw;
    font-weight: 900;
    color: rgba(255, 255, 255, 0.15);
    z-index: 0;
    pointer-events: none;
    font-family: monospace;
    letter-spacing: -2vw;
  }

  /* ================= 头部 ================= */
  header {
    padding: 30px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 2;
  }

  .logo-title {
    font-size: 24px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    background: var(--theme-blue);
    color: white;
    padding: 4px 8px;
    border-radius: 6px;
    font-family: monospace;
    font-size: 18px;
  }

  .avatar-wrapper {
    position: relative;
    cursor: pointer;
  }

  .avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.6);
    object-fit: cover;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  .badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background-color: #f13c45;
    color: white;
    font-size: 12px;
    font-weight: bold;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }

  /* ================= 中间核心工作区 (三栏布局) ================= */
  main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 60px; /* 栏间距 */
    z-index: 2;
    padding: 0 40px;
  }

  /* --- 左侧：知识模块导航 --- */
  .module-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 220px;
  }

  .module-item {
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
    padding: 16px 20px;
    border-radius: 12px;
    font-weight: 500;
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .module-item:hover, .module-item.active {
    background: var(--card-bg);
    transform: translateX(10px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
  }

  .module-item.active {
    border-left: 4px solid var(--text-number);
  }

  .item-count {
    font-size: 12px;
    background: rgba(0,0,0,0.05);
    padding: 2px 8px;
    border-radius: 10px;
    color: #666;
  }

  /* --- 中间：核心签到与数据 --- */
  .core-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  .sign-in-widget {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 40px 60px;
    text-align: center;
    color: var(--text-primary);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease;
    cursor: pointer;
    width: 200px;
  }

  .sign-in-widget:hover {
    transform: translateY(-5px);
  }

  .sign-in-icon {
    width: 48px;
    height: 48px;
    margin-bottom: 15px;
    fill: none;
    stroke: var(--text-primary);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .sign-in-title {
    font-size: 24px;
    font-weight: 500;
    margin: 0 0 10px 0;
    letter-spacing: 2px;
  }

  .sign-in-date {
    font-size: 16px;
    font-weight: 400;
    margin: 0;
    opacity: 0.8;
  }

  .stats-container {
    display: flex;
    gap: 30px;
  }

  .stat-card {
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 30px 40px;
    width: 130px; 
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    transition: all 0.3s ease;
    cursor: pointer;
    text-align: center;
  }

  .stat-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
  }

  .stat-title {
    font-size: 18px;
    font-weight: 500;
    color: var(--text-primary);
    margin: 0 0 10px 0;
  }

  .stat-num {
    font-size: 28px;
    font-weight: 600;
    color: var(--text-number);
    margin: 0;
  }

  /* --- 右侧：每日真题卡片 --- */
  .daily-card {
    background: var(--card-bg);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 30px;
    width: 320px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
  }

  .daily-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .tag-hot {
    background: #ffecd9;
    color: #e67e22;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 8px;
  }

  .q-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--theme-blue);
    line-height: 1.5;
    margin: 0 0 15px 0;
  }

  .q-hints {
    list-style: none;
    padding: 0;
    margin: 0 0 25px 0;
    font-size: 14px;
    color: #555;
    line-height: 2;
  }

  .q-hints li::before {
    content: '•';
    color: var(--text-number);
    margin-right: 8px;
  }

  .btn-start {
    width: 100%;
    background: var(--text-number);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s;
  }

  .btn-start:hover {
    background: #d67118;
  }

  /* ================= 底部导航栏 ================= */
  footer {
    padding: 30px 0;
    display: flex;
    justify-content: center;
    gap: 80px;
    z-index: 2;
  }

  .nav-icon {
    width: 32px;
    height: 32px;
    fill: none;
    stroke: var(--text-primary);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    cursor: pointer;
    transition: transform 0.2s, stroke 0.2s;
  }

  .nav-icon:hover {
    transform: scale(1.1);
    stroke: var(--text-number);
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="bg-watermark">C++</div>

  <header>
    <div class="logo-title">
      <span class="logo-icon">C++</span>
      <span>Offer Prep</span>
    </div>
    <div class="avatar-wrapper">
      <img src="https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?auto=format&fit=crop&w=100&q=80" alt="User Avatar" class="avatar">
      <span class="badge">4</span>
    </div>
  </header>

  <main>
    <div class="module-list">
      <div class="module-item active">
        <span>C++ 底层原理</span>
        <span class="item-count">48题</span>
      </div>
      <div class="module-item">
        <span>Linux 系统编程</span>
        <span class="item-count">32题</span>
      </div>
      <div class="module-item">
        <span>网络与 Epoll</span>
        <span class="item-count">25题</span>
      </div>
      <div class="module-item">
        <span>数据结构与算法</span>
        <span class="item-count">100+题</span>
      </div>
    </div>

    <div class="core-center">
      <div class="sign-in-widget">
        <svg class="sign-in-icon" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
          <circle cx="12" cy="15" r="1.5" fill="var(--text-primary)" stroke="none"></circle>
        </svg>
        <h2 class="sign-in-title">签到</h2>
        <p class="sign-in-date">06/17 Wed.</p>
      </div>

      <div class="stats-container">
        <div class="stat-card">
          <h3 class="stat-title">Learn</h3>
          <p class="stat-num">148</p>
        </div>
        <div class="stat-card">
          <h3 class="stat-title">Review</h3>
          <p class="stat-num">1242</p>
        </div>
      </div>
    </div>

    <div class="daily-card">
      <div class="daily-header">
        <span class="tag-hot">每日一题</span>
        <span style="color: #888; font-size: 14px;">🔥 字节跳动频出</span>
      </div>
      <h3 class="q-title">std::string 的底层实现方式有哪几种？其各自的特点是什么？</h3>
      <ul class="q-hints">
        <li>立即深拷贝 (Eager Copy)</li>
        <li>写时复制 (COW)</li>
        <li>短字符串优化 (SSO)</li>
      </ul>
      <button class="btn-start">开始解析</button>
    </div>
  </main>

  <footer>
    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
    </svg>
    <svg class="nav-icon" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="3" y1="9" x2="21" y2="9"></line>
      <line x1="9" y1="21" x2="9" y2="9"></line>
    </svg>
    <svg class="nav-icon" viewBox="0 0 24 24">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
    </svg>
  </footer>
</div>

</body>
</html>
