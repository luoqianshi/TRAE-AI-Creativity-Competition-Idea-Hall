<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>死亡周历 · 看见你的人生</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f1e8;
    --card: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #6a6a6a;
    --ink-light: #d4cdb8;
    --accent: #c84a3a;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 40px 20px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .container { max-width: 720px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 48px; }

  .epigraph {
    font-family: "Noto Serif SC", "Source Han Serif", "Songti SC", serif;
    color: var(--ink-soft);
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 20px;
    font-style: italic;
  }

  h1 {
    font-family: "Noto Serif SC", "Source Han Serif", "Songti SC", serif;
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 12px;
    line-height: 1.1;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 6px;
    font-weight: 500;
  }

  .input-card {
    background: var(--card);
    padding: 36px;
    border-radius: 12px;
    box-shadow: 0 2px 30px rgba(0,0,0,0.04);
    margin-bottom: 32px;
  }

  .form-row { display: flex; gap: 24px; margin-bottom: 24px; }
  .form-group { flex: 1; }

  label.field-label {
    display: block;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 10px;
    font-weight: 500;
    letter-spacing: 2px;
  }

  input[type="date"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #e5e0d0;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    background: #fafaf5;
    color: var(--ink);
  }
  input[type="date"]:focus { outline: none; border-color: var(--ink); background: #fff; }

  .gender-group { display: flex; gap: 10px; }

  .gender-option {
    flex: 1;
    padding: 12px;
    text-align: center;
    border: 1px solid #e5e0d0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
    background: #fafaf5;
    user-select: none;
  }
  .gender-option.selected { background: var(--ink); color: #fff; border-color: var(--ink); }
  .gender-option input { display: none; }
  .gender-meta { display: block; font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .gender-option.selected .gender-meta { color: #999; }

  button.generate-btn {
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 14px 32px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
    font-weight: 500;
    letter-spacing: 2px;
    transition: all 0.2s;
  }
  button.generate-btn:hover { background: #000; letter-spacing: 4px; }

  .stats-card {
    background: var(--ink);
    color: var(--bg);
    padding: 48px 36px;
    border-radius: 12px;
    margin-bottom: 32px;
    display: none;
  }
  .stats-card.show { display: block; animation: slideUp 0.6s ease; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .stats-row { display: flex; justify-content: space-around; text-align: center; gap: 16px; }

  .stat-item .num {
    font-family: "Noto Serif SC", "Source Han Serif", "Songti SC", serif;
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 12px;
  }
  .stat-item.remaining .num { color: var(--accent); }
  .stat-item .label { font-size: 11px; color: #999; letter-spacing: 2px; }

  .progress-bar {
    margin-top: 36px;
    background: #2a2a2a;
    height: 4px;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    background: var(--bg);
    height: 100%;
    width: 0%;
    transition: width 1.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .progress-text {
    margin-top: 16px;
    text-align: center;
    font-size: 13px;
    color: #999;
    letter-spacing: 1px;
  }

  .calendar-section {
    background: var(--card);
    padding: 48px 36px;
    border-radius: 12px;
    box-shadow: 0 2px 30px rgba(0,0,0,0.04);
    display: none;
  }
  .calendar-section.show { display: block; animation: slideUp 0.6s ease 0.2s both; }
  .calendar-section h2 {
    text-align: center;
    font-size: 13px;
    margin-bottom: 36px;
    color: var(--ink-soft);
    font-weight: 500;
    letter-spacing: 3px;
  }

  .year-row { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }

  .age-label {
    width: 36px;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .age-label.current { color: var(--accent); font-weight: 700; }

  .week-grid { display: grid; grid-template-columns: repeat(52, 1fr); gap: 2px; flex: 1; }

  .week-cell {
    width: 100%;
    aspect-ratio: 1;
    border: 1px solid var(--ink-light);
    border-radius: 50%;
    background: transparent;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .week-cell.lived { background: var(--ink); border-color: var(--ink); }
  .week-cell.current {
    background: var(--accent);
    border-color: var(--accent);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200, 74, 58, 0.6); }
    50% { box-shadow: 0 0 0 4px rgba(200, 74, 58, 0); }
  }
  .week-cell:hover { transform: scale(1.8); z-index: 2; position: relative; }

  .legend {
    display: flex;
    gap: 32px;
    justify-content: center;
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid #eee;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  .reflection {
    margin-top: 32px;
    padding: 24px;
    background: #fafaf5;
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.8;
    display: none;
  }
  .reflection.show { display: block; }
  .reflection strong { color: var(--ink); }

  .footer-quote {
    text-align: center;
    margin-top: 48px;
    padding: 32px 0;
    color: var(--ink-soft);
    font-family: "Noto Serif SC", "Source Han Serif", "Songti SC", serif;
    font-size: 15px;
    font-style: italic;
    line-height: 1.8;
  }
  .footer-quote .small {
    display: block;
    margin-top: 10px;
    font-size: 11px;
    color: #aaa;
    font-style: normal;
    letter-spacing: 2px;
  }

  @media (max-width: 600px) {
    body { padding: 24px 12px; }
    h1 { font-size: 36px; }
    .stat-item .num { font-size: 36px; }
    .form-row { flex-direction: column; gap: 16px; }
    .stats-row { flex-direction: row; gap: 8px; }
    .input-card, .stats-card { padding: 24px 18px; }
    .calendar-section { padding: 24px 12px; overflow-x: auto; }
    .week-grid { min-width: 360px; }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <p class="epigraph">"求你指教我们怎样数算自己的日子，好叫我们得着智慧的心。"</p>
      <h1>死亡周历</h1>
      <p class="subtitle">LIFE · WEEK · CALENDAR</p>
    </header>

    <div class="input-card">
      <div class="form-row">
        <div class="form-group">
          <label class="field-label">你的生日</label>
          <input type="date" id="birthday" />
        </div>
        <div class="form-group">
          <label class="field-label">性别</label>
          <div class="gender-group">
            <label class="gender-option selected" data-gender="male">
              <input type="radio" name="gender" value="male" checked />
              男
              <span class="gender-meta">预期 78.6 岁</span>
            </label>
            <label class="gender-option" data-gender="female">
              <input type="radio" name="gender" value="female" />
              女
              <span class="gender-meta">预期 84.0 岁</span>
            </label>
          </div>
        </div>
      </div>
      <button class="generate-btn" id="generateBtn">生成我的人生周历</button>
    </div>

    <div class="stats-card" id="statsCard">
      <div class="stats-row">
        <div class="stat-item">
          <div class="num" id="livedWeeks">0</div>
          <div class="label">已度过</div>
        </div>
        <div class="stat-item remaining">
          <div class="num" id="remainingWeeks">0</div>
          <div class="label">还剩下</div>
        </div>
        <div class="stat-item">
          <div class="num" id="ageYears">0</div>
          <div class="label">你今年</div>
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">你的人生已经走过了 0%</div>
    </div>

    <div class="calendar-section" id="calendarSection">
      <h2>每一格 = 一周 · 每一行 = 一年</h2>
      <div id="calendarGrid"></div>
      <div class="reflection" id="reflection">
        <strong>一句给现在的你：</strong><span id="reflectionText"></span>
      </div>
      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--ink);"></div>
          <span>已度过</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--accent);"></div>
          <span>此刻</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: transparent; border: 1px solid var(--ink-light);"></div>
          <span>未来</span>
        </div>
      </div>
    </div>

    <div class="footer-quote">
      愿你活过的每一周<br>都不辜负这一格
      <span class="small">— 死亡周历 · 一周一周看见剩下的人生</span>
    </div>
  </div>

  <script>
    const LIFE_EXPECTANCY = { male: 78.6, female: 84.0 };

    const REFLECTIONS = [
      "如果你活到平均寿命，今天这一周大约是第 {lived} 周。剩下的 {left} 周，你打算怎么用？",
      "你已经走过 {pct}% 的人生。剩下的 {left} 周，去做那些一直想做、却总说「等有时间」的事吧。",
      "一周很短，七天；一生很短，四千多个七天。把它们涂黑很容易，把它们活成想要的颜色——需要每一天都不糊弄。",
      "时间不站在任何人这边。你以为你还有很多 {left} 周，但每一个「以后再说」，都在悄悄把它们涂黑。",
      "如果把每一天都当作倒数第 {left} 周里的一天来过——你今天还会这样过吗？"
    ];

    document.querySelectorAll('.gender-option').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.gender-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        opt.querySelector('input').checked = true;
      });
    });

    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];
    const birthdayInput = document.getElementById('birthday');
    birthdayInput.max = todayStr;
    const defaultDate = new Date(today.getFullYear() - 30, today.getMonth(), today.getDate());
    birthdayInput.value = defaultDate.toISOString().split('T')[0];

    document.getElementById('generateBtn').addEventListener('click', generate);

    function generate() {
      const birthdayStr = birthdayInput.value;
      const gender = document.querySelector('input[name="gender"]:checked').value;

      if (!birthdayStr) { alert('请先填写你的生日'); return; }

      const birthday = new Date(birthdayStr);
      if (isNaN(birthday.getTime()) || birthday > today) {
        alert('请填写有效的生日'); return;
      }

      const lifeExp = LIFE_EXPECTANCY[gender];
      const totalWeeks = Math.floor(lifeExp * 52);
      const totalRows = Math.ceil(lifeExp);

      const msLived = today - birthday;
      const weeksLived = Math.min(Math.floor(msLived / (1000 * 60 * 60 * 24 * 7)), totalWeeks);
      const weeksRemaining = Math.max(0, totalWeeks - weeksLived);
      const progressPct = Math.min(100, (weeksLived / totalWeeks * 100));
      const ageYears = (msLived / (1000 * 60 * 60 * 24 * 365.25)).toFixed(1);

      const statsCard = document.getElementById('statsCard');
      statsCard.classList.add('show');
      animateNumber('livedWeeks', weeksLived);
      animateNumber('remainingWeeks', weeksRemaining);
      animateNumber('ageYears', ageYears, 1);
      setTimeout(() => {
        document.getElementById('progressFill').style.width = progressPct + '%';
      }, 100);
      document.getElementById('progressText').textContent =
        `你的人生已经走过了 ${progressPct.toFixed(1)}%`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      const currentYear = Math.floor(weeksLived / 52);

      const fragment = document.createDocumentFragment();

      for (let year = 0; year < totalRows; year++) {
        const row = document.createElement('div');
        row.className = 'year-row';

        const ageLabel = document.createElement('div');
        ageLabel.className = 'age-label';
        if (year === currentYear) {
          ageLabel.classList.add('current');
          ageLabel.textContent = year + ' ←';
        } else {
          ageLabel.textContent = year;
        }
        row.appendChild(ageLabel);

        const weekGrid = document.createElement('div');
        weekGrid.className = 'week-grid';

        for (let week = 0; week < 52; week++) {
          const cell = document.createElement('div');
          cell.className = 'week-cell';

          const weekNum = year * 52 + week;

          if (weekNum < weeksLived) {
            cell.classList.add('lived');
            cell.title = `${year} 岁 · 第 ${week + 1} 周 · 已度过`;
          } else if (weekNum === weeksLived) {
            cell.classList.add('current');
            cell.title = `${year} 岁 · 第 ${week + 1} 周 · 此刻`;
          } else {
            cell.title = `${year} 岁 · 第 ${week + 1} 周 · 未来`;
          }

          weekGrid.appendChild(cell);
        }

        row.appendChild(weekGrid);
        fragment.appendChild(row);
      }

      grid.appendChild(fragment);

      const reflection = REFLECTIONS[Math.floor(Math.random() * REFLECTIONS.length)]
        .replace('{lived}', weeksLived.toLocaleString())
        .replace('{left}', weeksRemaining.toLocaleString())
        .replace('{pct}', progressPct.toFixed(1));
      document.getElementById('reflectionText').textContent = reflection;
      document.getElementById('reflection').classList.add('show');

      document.getElementById('calendarSection').classList.add('show');

      setTimeout(() => {
        statsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 200);
    }

    function animateNumber(id, target, decimals = 0) {
      const el = document.getElementById(id);
      const duration = 1200;
      const startTime = Date.now();

      function update() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const current = target * easeOut;
        el.textContent = decimals > 0
          ? current.toFixed(decimals)
          : Math.floor(current).toLocaleString();
        if (progress < 1) requestAnimationFrame(update);
      }
      update();
    }
  </script>
</body>
</html>
