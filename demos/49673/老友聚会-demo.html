<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>老友聚会 - Demo</title>
<style>
:root {
  --primary: #FF8C42;
  --primary-light: #FFB07A;
  --primary-bg: rgba(255, 140, 66, 0.1);
  --text-primary: #333333;
  --text-secondary: #666666;
  --text-tertiary: #999999;
  --bg-page: #f7f7f7;
  --bg-card: #ffffff;
  --border: #f0f0f0;
  --shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-primary);
  background: #e8e8e8;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

img {
  display: block;
  max-width: 100%;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  outline: none;
  background: none;
}

a {
  text-decoration: none;
  color: inherit;
}

ul, ol {
  list-style: none;
}

h1, h2, h3, h4, h5, h6 {
  font-weight: 500;
}

.app-container {
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg-page);
  position: relative;
  overflow: hidden;
}

.page {
  display: none;
  min-height: 100vh;
  padding-bottom: 80px;
  box-sizing: border-box;
}

.page.active {
  display: block;
}

.page-header {
  padding: 20px 16px 16px;
  background: linear-gradient(135deg, #FF8C42 0%, #FFB07A 100%);
  color: #fff;
}

.page-title {
  font-size: 24px;
  font-weight: 600;
  margin: 0;
}

.page-subtitle {
  font-size: 14px;
  opacity: 0.9;
  margin: 4px 0 0;
}

/* ========== 首页 ========== */
.upcoming-section {
  padding: 16px 12px 0;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding: 0 4px;
}

.section-header .section-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin: 0;
}

.section-more {
  font-size: 13px;
  color: var(--primary);
  cursor: pointer;
}

.upcoming-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}

.upcoming-scroll::-webkit-scrollbar {
  display: none;
}

.upcoming-card {
  flex-shrink: 0;
  width: 280px;
  background: var(--bg-card);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
}

.upcoming-card-cover {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.upcoming-card-content {
  padding: 12px 14px;
}

.upcoming-card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  margin: 0 0 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.upcoming-card-meta {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 10px;
}

.upcoming-card-meta .meta-item {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.upcoming-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.upcoming-attendees {
  display: flex;
  align-items: center;
}

.upcoming-attendee-avatar {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid #fff;
  margin-left: -6px;
  background: #f5f5f5;
}

.upcoming-attendee-avatar:first-child {
  margin-left: 0;
}

.upcoming-count {
  font-size: 12px;
  color: var(--text-tertiary);
}

.feed-list {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.post-card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
}

.post-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.post-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #f5f5f5;
}

.post-user-info {
  flex: 1;
}

.post-username {
  font-size: 15px;
  font-weight: 500;
  color: #333;
}

.post-time {
  font-size: 12px;
  color: #999;
  margin-top: 2px;
}

.post-content {
  font-size: 14px;
  line-height: 1.6;
  color: #333;
  margin-bottom: 12px;
}

.post-images {
  display: grid;
  gap: 4px;
  margin-bottom: 12px;
  border-radius: 8px;
  overflow: hidden;
}

.post-images-1 {
  grid-template-columns: 1fr;
}

.post-images-2 {
  grid-template-columns: 1fr 1fr;
}

.post-images-3 {
  grid-template-columns: 1fr 1fr 1fr;
}

.post-image {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
}

.post-actions {
  display: flex;
  gap: 24px;
  padding-top: 12px;
  border-top: 1px solid #f5f5f5;
}

.post-action {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  color: #666;
  cursor: pointer;
}

.action-icon {
  font-size: 16px;
}

/* ========== 聚会列表 ========== */
.gatherings-content {
  padding: 16px 12px;
}

.gatherings-section {
  margin-bottom: 24px;
}

.gatherings-section .section-title {
  font-size: 16px;
  font-weight: 600;
  color: #333;
  margin: 0 0 12px 4px;
}

.gathering-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.gathering-card {
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  cursor: pointer;
}

.gathering-card.past {
  opacity: 0.8;
}

.gathering-cover {
  width: 100%;
  height: 140px;
  object-fit: cover;
}

.gathering-info {
  padding: 12px 14px 14px;
}

.gathering-title {
  font-size: 16px;
  font-weight: 600;
  color: #333;
  margin: 0 0 8px;
}

.gathering-meta {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 12px;
}

.meta-item {
  font-size: 13px;
  color: #666;
}

.gathering-attendees {
  display: flex;
  align-items: center;
  gap: 8px;
}

.attendee-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid #fff;
  margin-left: -8px;
  background: #f5f5f5;
}

.attendee-avatar:first-child {
  margin-left: 0;
}

.attendee-count {
  font-size: 12px;
  color: #999;
  margin-left: 4px;
}

.fab-btn {
  position: fixed;
  bottom: 80px;
  right: calc(50% - 215px + 20px);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: #fff;
  font-size: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(255, 140, 66, 0.4);
  cursor: pointer;
  z-index: 50;
  border: none;
  transition: transform 0.2s ease;
}

.fab-btn:active {
  transform: scale(0.95);
}

.fab-icon {
  line-height: 1;
  font-weight: 300;
}

@media (max-width: 430px) {
  .fab-btn {
    right: 20px;
  }
}

/* ========== 聚会详情 ========== */
.gathering-detail-page {
  padding-bottom: 80px;
}

.detail-header {
  position: relative;
  width: 100%;
}

.detail-cover {
  width: 100%;
  height: 240px;
  object-fit: cover;
}

.detail-back-btn {
  position: absolute;
  top: 16px;
  left: 16px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #fff;
  font-size: 20px;
}

.back-icon {
  font-size: 18px;
  line-height: 1;
}

.detail-content {
  padding: 16px 12px;
}

.detail-info-section {
  background: var(--bg-card);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.detail-title {
  font-size: 20px;
  font-weight: 600;
  color: var(--text-primary);
  margin: 0 0 16px;
}

.detail-meta-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.detail-meta-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: var(--text-secondary);
}

.meta-icon {
  font-size: 16px;
  width: 20px;
  text-align: center;
}

.meta-text {
  flex: 1;
}

.detail-section {
  background: var(--bg-card);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.detail-section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.detail-section-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin: 0 0 12px;
}

.detail-section-header .detail-section-title {
  margin-bottom: 0;
}

.section-count {
  font-size: 14px;
  font-weight: 400;
  color: var(--text-tertiary);
}

.detail-description {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-secondary);
  margin: 0;
}

.attendees-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.attendee-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.attendee-avatar-lg {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #f5f5f5;
}

.attendee-name {
  font-size: 12px;
  color: var(--text-secondary);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
}

.photo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 4px;
  border-radius: 8px;
  overflow: hidden;
}

.photo-item {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  cursor: pointer;
}

.vote-entry-card {
  background: var(--primary-bg);
  border-radius: 10px;
  padding: 14px;
  cursor: pointer;
}

.vote-entry-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.vote-entry-desc {
  font-size: 12px;
  color: var(--text-secondary);
}

.detail-footer {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  padding: 12px 16px;
  background: #fff;
  border-top: 1px solid var(--border);
  z-index: 100;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
}

.join-btn {
  width: 100%;
  height: 48px;
  border-radius: 24px;
  background: var(--primary);
  color: #fff;
  font-size: 16px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
}

.join-btn.joined {
  background: #e8e8e8;
  color: var(--text-secondary);
}

/* ========== 发起聚会 ========== */
.create-gathering-page {
  padding-bottom: 100px;
  background: var(--bg-page);
  min-height: 100vh;
}

.create-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 16px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: #fff;
}

.create-back-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 18px;
}

.header-placeholder {
  width: 36px;
}

.create-title {
  font-size: 18px;
  font-weight: 600;
  margin: 0;
}

.create-form {
  padding: 16px 12px;
}

.form-section {
  background: var(--bg-card);
  border-radius: 12px;
  padding: 4px 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.form-group {
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.form-group:last-child {
  border-bottom: none;
}

.form-label {
  display: block;
  font-size: 13px;
  color: var(--text-tertiary);
  margin-bottom: 8px;
}

.form-input {
  width: 100%;
  height: 36px;
  border: none;
  outline: none;
  font-size: 15px;
  color: var(--text-primary);
  background: transparent;
  font-family: inherit;
}

.form-input::placeholder {
  color: var(--text-tertiary);
}

.form-textarea {
  width: 100%;
  border: none;
  outline: none;
  font-size: 15px;
  color: var(--text-primary);
  background: transparent;
  resize: none;
  line-height: 1.6;
  font-family: inherit;
}

.form-textarea::placeholder {
  color: var(--text-tertiary);
}

.form-footer {
  padding: 20px 4px 0;
}

.submit-btn {
  width: 100%;
  height: 50px;
  border-radius: 25px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: #fff;
  font-size: 16px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(255, 140, 66, 0.3);
}

.submit-btn:active {
  opacity: 0.9;
}

/* ========== 日程 ========== */
.schedule-content {
  padding: 16px 12px;
}

.schedule-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 24px;
}

.schedule-card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
}

.schedule-header {
  margin-bottom: 16px;
}

.schedule-title {
  font-size: 16px;
  font-weight: 600;
  color: #333;
  margin: 0 0 4px;
}

.schedule-gathering {
  font-size: 12px;
  color: #FF8C42;
  background: rgba(255, 140, 66, 0.1);
  padding: 2px 8px;
  border-radius: 4px;
}

.schedule-options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 16px;
}

.schedule-option {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  padding: 4px;
  border-radius: 8px;
  transition: background 0.2s ease;
}

.schedule-option:not(.voted):active {
  background: var(--primary-bg);
}

.schedule-option.selected {
  background: var(--primary-bg);
}

.schedule-option.selected .option-label {
  color: var(--primary);
  font-weight: 500;
}

.schedule-option.selected .option-votes {
  color: var(--primary);
  font-weight: 500;
}

.schedule-option.voted {
  cursor: default;
}

.option-label {
  font-size: 14px;
  color: #333;
  min-width: 90px;
  flex-shrink: 0;
}

.option-bar-wrapper {
  flex: 1;
  height: 8px;
  background: #f5f5f5;
  border-radius: 4px;
  overflow: hidden;
}

.option-bar {
  height: 100%;
  background: linear-gradient(90deg, #FF8C42, #FFB07A);
  border-radius: 4px;
  transition: width 0.3s ease;
}

.option-votes {
  font-size: 12px;
  color: #999;
  min-width: 40px;
  text-align: right;
}

.schedule-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 12px;
  border-top: 1px solid #f5f5f5;
}

.deadline {
  font-size: 12px;
  color: #999;
}

.vote-btn {
  background: #FF8C42;
  color: #fff;
  border: none;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}

.vote-btn.voted {
  background: #e8e8e8;
  color: #999;
  cursor: not-allowed;
}

.empty-state {
  text-align: center;
  padding: 40px 0;
}

.empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
}

.empty-text {
  font-size: 14px;
  color: #999;
  margin: 0;
}

/* ========== 相册 ========== */
.album-content {
  padding: 16px 12px;
}

.album-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 28px;
}

.album-card {
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  cursor: pointer;
}

.album-cover-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
}

.album-cover {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.album-photo-count {
  position: absolute;
  bottom: 8px;
  right: 8px;
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.photo-icon {
  font-size: 12px;
}

.album-info {
  padding: 10px 12px 12px;
}

.album-title {
  font-size: 14px;
  font-weight: 500;
  color: #333;
  margin: 0 0 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.album-date {
  font-size: 12px;
  color: #999;
  margin: 0;
}

.memory-timeline {
  margin-bottom: 24px;
}

.timeline-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
  padding-left: 20px;
}

.timeline-list::before {
  content: '';
  position: absolute;
  left: 5px;
  top: 8px;
  bottom: 8px;
  width: 2px;
  background: #f0f0f0;
}

.timeline-item {
  position: relative;
  cursor: pointer;
}

.timeline-dot {
  position: absolute;
  left: -20px;
  top: 16px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #FF8C42;
  border: 3px solid #fff;
  box-shadow: 0 0 0 2px #FF8C42;
}

.timeline-content {
  display: flex;
  gap: 12px;
  background: #fff;
  border-radius: 10px;
  padding: 12px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
}

.timeline-image {
  width: 70px;
  height: 70px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
}

.timeline-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
}

.timeline-title {
  font-size: 14px;
  font-weight: 500;
  color: #333;
  margin: 0;
}

.timeline-date {
  font-size: 12px;
  color: #999;
  margin: 0;
}

.timeline-desc {
  font-size: 12px;
  color: #FF8C42;
  margin: 0;
}

/* ========== 相册详情 ========== */
.album-detail-page {
  padding-bottom: 20px;
  background: var(--bg-page);
  min-height: 100vh;
}

.album-detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 16px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: #fff;
}

.album-detail-title {
  font-size: 18px;
  font-weight: 600;
  margin: 0;
}

.album-detail-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #fff;
  border-bottom: 1px solid var(--border);
}

.album-detail-info .album-date {
  font-size: 13px;
  color: var(--text-secondary);
}

.album-detail-info .album-count {
  font-size: 13px;
  color: var(--primary);
}

.photo-grid-container {
  padding: 8px;
}

.photo-masonry {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 4px;
}

.photo-item-wrapper {
  width: 100%;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 4px;
  cursor: pointer;
  background: #f0f0f0;
}

.masonry-photo {
  width: 100%;
  height: 100%;
  object-fit: cover;

// ========== 工具函数 ==========
function getUserById(id) {
  return users.find((u) => u.id === id);
}

function getGatheringById(id) {
  return gatherings.find((g) => g.id === id);
}

// ========== 页面路由 ==========
let pageHistory = ['home'];
let currentGatheringId = null;
let currentAlbumId = null;
let isJoined = false;

function showPage(pageName, data) {
  document.querySelectorAll('.page').forEach((p) => p.classList.remove('active'));
  const targetPage = document.getElementById('page-' + pageName);
  if (targetPage) {
    targetPage.classList.add('active');
  }

  const mainPages = ['home', 'gatherings', 'schedule', 'album', 'profile'];
  const bottomNav = document.getElementById('bottomNav');
  if (mainPages.includes(pageName)) {
    bottomNav.style.display = 'flex';
    document.querySelectorAll('.nav-item').forEach((item) => {
      item.classList.toggle('active', item.dataset.page === pageName);
    });
    pageHistory = [pageName];
  } else {
    bottomNav.style.display = 'none';
    if (pageHistory[pageHistory.length - 1] !== pageName) {
      pageHistory.push(pageName);
    }
  }

  if (pageName === 'gathering-detail' && data) {
    renderGatheringDetail(data);
  }
  if (pageName === 'album-detail' && data) {
    renderAlbumDetail(data);
  }

  window.scrollTo(0, 0);
}

function goBack() {
  if (pageHistory.length > 1) {
    pageHistory.pop();
    const prevPage = pageHistory[pageHistory.length - 1];
    const mainPages = ['home', 'gatherings', 'schedule', 'album', 'profile'];
    document.querySelectorAll('.page').forEach((p) => p.classList.remove('active'));
    const targetPage = document.getElementById('page-' + prevPage);
    if (targetPage) {
      targetPage.classList.add('active');
    }
    const bottomNav = document.getElementById('bottomNav');
    if (mainPages.includes(prevPage)) {
      bottomNav.style.display = 'flex';
      document.querySelectorAll('.nav-item').forEach((item) => {
        item.classList.toggle('active', item.dataset.page === prevPage);
      });
    } else {
      bottomNav.style.display = 'none';
    }
  }
  window.scrollTo(0, 0);
}

// ========== 渲染首页 ==========
function renderHome() {
  const upcomingGatherings = gatherings.filter((g) => g.status === 'upcoming').slice(0, 2);

  // 即将到来的聚会横向滚动
  const upcomingHtml = upcomingGatherings
    .map((gathering) => {
      const attendeeAvatars = gathering.attendees
        .slice(0, 3)
        .map((userId) => {
          const user = getUserById(userId);
          return `<img src="${user.avatar}" alt="${user.name}" class="upcoming-attendee-avatar" />`;
        })
        .join('');
      return `
        <div class="upcoming-card" onclick="showGatheringDetail(${gathering.id})">
          <img src="${gathering.cover}" alt="${gathering.title}" class="upcoming-card-cover" />
          <div class="upcoming-card-content">
            <h3 class="upcoming-card-title">${gathering.title}</h3>
            <div class="upcoming-card-meta">
              <span class="meta-item">📅 ${gathering.date} ${gathering.time}</span>
              <span class="meta-item">📍 ${gathering.location}</span>
            </div>
            <div class="upcoming-card-footer">
              <div class="upcoming-attendees">
                ${attendeeAvatars}
              </div>
              <span class="upcoming-count">${gathering.attendees.length}人参加</span>
            </div>
          </div>
        </div>
      `;
    })
    .join('');
  document.getElementById('upcomingScroll').innerHTML = upcomingHtml;

  // 动态流
  const feedHtml = posts
    .map((post) => {
      const user = getUserById(post.userId);
      let imagesHtml = '';
      if (post.images.length > 0) {
        const imgClass = `post-images post-images-${post.images.length}`;
        const imgs = post.images
          .map((img) => `<img src="${img}" alt="" class="post-image" />`)
          .join('');
        imagesHtml = `<div class="${imgClass}">${imgs}</div>`;
      }
      return `
        <div class="post-card">
          <div class="post-header">
            <img src="${user.avatar}" alt="${user.name}" class="post-avatar" />
            <div class="post-user-info">
              <div class="post-username">${user.name}</div>
              <div class="post-time">${post.createdAt}</div>
            </div>
          </div>
          <div class="post-content">${post.content}</div>
          ${imagesHtml}
          <div class="post-actions">
            <div class="post-action">
              <span class="action-icon">❤️</span>
              <span class="action-count">${post.likes}</span>
            </div>
            <div class="post-action">
              <span class="action-icon">💬</span>
              <span class="action-count">${post.comments}</span>
            </div>
          </div>
        </div>
      `;
    })
    .join('');
  document.getElementById('feedList').innerHTML = feedHtml;
}

// ========== 渲染聚会列表 ==========
function renderGatherings() {
  const upcomingGatherings = gatherings.filter((g) => g.status === 'upcoming');
  const pastGatherings = gatherings.filter((g) => g.status === 'past');

  const renderCard = (gathering, showAttendees) => {
    let attendeesHtml = '';
    if (showAttendees) {
      const avatars = gathering.attendees
        .slice(0, 4)
        .map((userId) => {
          const user = getUserById(userId);
          return `<img src="${user.avatar}" alt="${user.name}" class="attendee-avatar" />`;
        })
        .join('');
      attendeesHtml = `
        <div class="gathering-attendees">
          ${avatars}
          <span class="attendee-count">${gathering.attendees.length}人参加</span>
        </div>
      `;
    }
    return `
      <div class="gathering-card ${gathering.status === 'past' ? 'past' : ''}" onclick="showGatheringDetail(${gathering.id})">
        <img src="${gathering.cover}" alt="${gathering.title}" class="gathering-cover" />
        <div class="gathering-info">
          <h3 class="gathering-title">${gathering.title}</h3>
          <div class="gathering-meta">
            <span class="meta-item">📅 ${gathering.date} ${gathering.status === 'past' ? '' : gathering.time}</span>
            <span class="meta-item">📍 ${gathering.location}</span>
          </div>
          ${attendeesHtml}
        </div>
      </div>
    `;
  };

  document.getElementById('upcomingList').innerHTML = upcomingGatherings
    .map((g) => renderCard(g, true))
    .join('');
  document.getElementById('pastList').innerHTML = pastGatherings
    .map((g) => renderCard(g, false))
    .join('');
}

function showGatheringDetail(id) {
  currentGatheringId = id;
  isJoined = false;
  showPage('gathering-detail', id);

// ========== 渲染聚会详情 ==========
function renderGatheringDetail(id) {
  const gathering = getGatheringById(id);
  if (!gathering) return;

  const organizer = getUserById(gathering.organizerId);
  const attendees = gathering.attendees.map(getUserById);

  document.getElementById('detailCover').src = gathering.cover;
  document.getElementById('detailTitle').textContent = gathering.title;
  document.getElementById('detailDateTime').textContent = `${gathering.date} ${gathering.time}`;
  document.getElementById('detailLocation').textContent = gathering.location;
  document.getElementById('detailOrganizer').textContent = `组织者：${organizer?.name || '未知'}`;
  document.getElementById('detailDescription').textContent = gathering.description;
  document.getElementById('attendeeCount').textContent = `(${attendees.length}人)`;

  // 参与者头像
  const attendeesHtml = attendees
    .map(
      (user) => `
    <div class="attendee-item">
      <img src="${user.avatar}" alt="${user.name}" class="attendee-avatar-lg" />
      <span class="attendee-name">${user.name}</span>
    </div>
  `
    )
    .join('');
  document.getElementById('attendeesGrid').innerHTML = attendeesHtml;

  // 相关照片
  const relatedPosts = posts.filter((p) => p.gatheringId === gathering.id);
  const photos = relatedPosts.flatMap((p) => p.images);
  const relatedAlbum = albums.find((a) => a.gatheringId === gathering.id);

  if (photos.length > 0) {
    document.getElementById('detailPhotoSection').style.display = 'block';
    document.getElementById('detailPhotoCount').textContent = `(${photos.length}张)`;
    const photoHtml = photos
      .slice(0, 9)
      .map(
        (photo) =>
          `<img src="${photo}" alt="" class="photo-item" onclick="openPhotoPreview('${photo.replace('w=400&h=400', 'w=800&h=800')}')" />`
      )
      .join('');
    document.getElementById('detailPhotoGrid').innerHTML = photoHtml;
    const albumLink = document.getElementById('detailAlbumLink');
    if (relatedAlbum) {
      albumLink.style.display = 'inline';
      albumLink.onclick = () => showAlbumDetail(relatedAlbum.id);
    } else {
      albumLink.style.display = 'none';
    }
  } else {
    document.getElementById('detailPhotoSection').style.display = 'none';
  }

  // 投票入口
  const activeVote = schedules.find(
    (s) => s.gatheringId === gathering.id && s.status === 'voting'
  );
  if (activeVote) {
    document.getElementById('detailVoteSection').style.display = 'block';
    document.getElementById('voteEntryTitle').textContent = activeVote.title;
    document.getElementById('voteEntryDesc').textContent = `${activeVote.options.length}个选项 · 截止${activeVote.deadline}`;
    document.getElementById('voteEntryCard').onclick = () => showPage('schedule');
  } else {
    document.getElementById('detailVoteSection').style.display = 'none';
  }

  // 报名按钮
  const joinBtn = document.getElementById('joinBtn');
  joinBtn.classList.remove('joined');
  joinBtn.textContent = '我要报名';
}

function toggleJoin() {
  isJoined = !isJoined;
  const joinBtn = document.getElementById('joinBtn');
  if (isJoined) {
    joinBtn.classList.add('joined');
    joinBtn.textContent = '✓ 已报名';
  } else {
    joinBtn.classList.remove('joined');
    joinBtn.textContent = '我要报名';
  }
}

// ========== 发起聚会 ==========
function handleCreateGathering(e) {
  e.preventDefault();
  const form = e.target;
  const title = form.title.value;
  const date = form.date.value;
  const time = form.time.value;
  const location = form.location.value;

  if (!title || !date || !time || !location) {
    alert('请填写完整信息');
    return;
  }
  alert('聚会发起成功！');
  showPage('gatherings');
}

// ========== 渲染日程 ==========
function renderSchedule() {
  const html = schedules
    .map((schedule) => {
      const gathering = getGatheringById(schedule.gatheringId);
      const hasVoted = schedule.voted;
      const votedOption = schedule.selectedOption;

      const optionsHtml = schedule.options
        .map((option, idx) => {
          let currentVotes = option.votes.length;
          if (hasVoted && votedOption === idx) {
            currentVotes += 1;
          }
          const optionCounts = schedule.options.map((opt, i) => {
            let count = opt.votes.length;
            if (hasVoted && votedOption === i) count += 1;
            return count;
          });
          const maxVotes = Math.max(...optionCounts);
          const percentage = maxVotes > 0 ? (currentVotes / maxVotes) * 100 : 0;
          const isSelected = votedOption === idx;
          const classes = `schedule-option ${isSelected ? 'selected' : ''} ${hasVoted ? 'voted' : ''}`;

          return `
            <div class="${classes}" onclick="handleVote(${schedule.id}, ${idx})">
              <div class="option-label">${option.date}</div>
              <div class="option-bar-wrapper">
                <div class="option-bar" style="width: ${percentage}%"></div>
              </div>
              <div class="option-votes">${currentVotes}票</div>
            </div>
          `;
        })
        .join('');

      return `
        <div class="schedule-card">
          <div class="schedule-header">
            <h3 class="schedule-title">${schedule.title}</h3>
            <span class="schedule-gathering">${gathering?.title || ''}</span>
          </div>
          <div class="schedule-options">
            ${optionsHtml}
          </div>
          <div class="schedule-footer">
            <span class="deadline">截止：${schedule.deadline}</span>
            <button class="vote-btn ${hasVoted ? 'voted' : ''}" ${hasVoted ? 'disabled' : ''}>
              ${hasVoted ? '已投票' : '参与投票'}
            </button>
          </div>
        </div>
      `;
    })
    .join('');

  document.getElementById('scheduleList').innerHTML = html;
}

function handleVote(scheduleId, optionIndex) {
  const schedule = schedules.find((s) => s.id === scheduleId);
  if (!schedule || schedule.voted) return;

  schedule.voted = true;
  schedule.selectedOption = optionIndex;
  renderSchedule();
}

}

// ========== 渲染相册详情 ==========
function renderAlbumDetail(id) {
  const album = albums.find((a) => a.id === id);
  if (!album) return;

  document.getElementById('albumDetailTitle').textContent = album.title;
  document.getElementById('albumDetailDate').textContent = album.date;
  document.getElementById('albumDetailCount').textContent = `${album.photoCount}张照片`;

  const photos = Array.from({ length: Math.min(album.photoCount, 24) }, (_, idx) => {
    const seed = photoSeeds[(idx + album.id) % photoSeeds.length];
    return `https://images.unsplash.com/photo-${seed}?w=400&h=400&fit=crop`;
  });

  const gridHtml = photos
    .map(
      (url) => `
    <div class="photo-item-wrapper" onclick="openPhotoPreview('${url.replace('w=400&h=400', 'w=800&h=800')}')">
      <img src="${url}" alt="" class="masonry-photo" />
    </div>
  `
    )
    .join('');
  document.getElementById('photoGrid').innerHTML = gridHtml;
}

function openPhotoPreview(url) {
  document.getElementById('previewImg').src = url;
  document.getElementById('photoPreview').classList.add('show');
}

function closePhotoPreview() {
  document.getElementById('photoPreview').classList.remove('show');
}

      <span class="friend-name">${u.name}</span>

    .join('');

}
