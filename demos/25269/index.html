<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent MV - AI 音乐视频创作助手</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">Agent MV</h1>
        <p class="app-subtitle">AI 音乐视频创作助手</p>
      </div>
      <div class="header-right">
        <div class="project-selector">
          <select id="project-select" class="project-select">
            <option value="">选择项目</option>
          </select>
          <button id="new-project-btn" class="btn btn-secondary">新建项目</button>
        </div>
        <select id="model-select" class="model-select">
          <option value="">选择模型</option>
        </select>
        <select id="bg-style-select" class="bg-style-select">
          <option value="dark">🌙 暗黑模式</option>
          <option value="light">☀️ 明亮模式</option>
          <option value="gradient">🌈 渐变模式</option>
          <option value="sunset">🌅 日落模式</option>
          <option value="ocean">🌊 海洋模式</option>
          <option value="forest">🌲 森林模式</option>
        </select>
        <button id="restart-btn" class="btn btn-secondary">🔄 重启</button>
      </div>
    </header>
    
    <div class="main-content">
      <div class="left-panel">
        <div class="upload-area">
          <div class="upload-header" id="upload-header">
            <span class="upload-title">📁 文件上传</span>
            <span class="upload-toggle" id="upload-toggle">▼</span>
          </div>
          <div class="upload-content" id="upload-content">
            <div class="upload-tabs">
              <button class="upload-tab active" data-type="audio">🎵 音乐</button>
              <button class="upload-tab" data-type="lyrics">📝 歌词</button>
              <button class="upload-tab" data-type="image">🖼️ 图片</button>
              <button class="upload-tab" data-type="video">🎬 视频</button>
            </div>
            <div class="upload-dropzone" id="upload-dropzone">
              <input type="file" id="file-input" class="file-input" accept="*" multiple>
              <div class="dropzone-content">
                <div class="dropzone-icon">📁</div>
                <p>拖拽文件到此处或点击上传</p>
                <p class="dropzone-hint">支持 MP3, WAV, TXT, PNG, JPG, MP4 等格式</p>
              </div>
            </div>
            <div class="upload-list" id="upload-list"></div>
          </div>
        </div>
        
        <div class="chat-container">
          <div class="chat-header">
            <h3>与 Agent 对话</h3>
          </div>
          <div class="chat-messages" id="chat-messages">
            <div class="message message-system">
              <div class="message-content">
                👋 您好！我是您的 MV 创作助手。告诉我您想要实现的效果，我会帮您完成！
              </div>
            </div>
          </div>
          <div class="chat-input-area">
            <textarea id="chat-input" placeholder="输入您的需求...例如：在右上角添加一个淡入淡出的作者名字"></textarea>
            <button id="send-btn" class="btn btn-primary">发送</button>
          </div>
        </div>
      </div>
      
      <div class="right-panel">
        <div class="preview-header">
          <h3>MV 预览</h3>
          <div class="preview-controls">
            <button id="play-btn" class="btn btn-secondary">▶️ 播放</button>
            <button id="restore-btn" class="btn btn-secondary">⏪ 还原</button>
            <button id="save-btn" class="btn btn-secondary">💾 保存</button>
            <button id="refresh-btn" class="btn btn-secondary">🔄 刷新</button>
            <div class="export-container">
              <button id="export-btn" class="btn btn-primary">📥 导出 WebM</button>
              <select id="export-duration" class="export-duration">
                <option value="full">整首歌</option>
                <option value="30s">前30秒</option>
              </select>
            </div>
          </div>
        </div>
        <div class="preview-container">
          <iframe id="preview-iframe" src="" sandbox="allow-scripts allow-modals allow-same-origin allow-downloads"></iframe>
        </div>
      </div>
    </div>
    
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3>新建项目</h3>
          <button class="modal-close" id="modal-close">×</button>
        </div>
        <div class="modal-body">
          <input type="text" id="project-name-input" placeholder="输入项目名称">
          <div class="platform-selector">
            <label class="platform-label">
              <input type="radio" name="platform" value="pc" checked>
              <span>PC版</span>
            </label>
            <label class="platform-label">
              <input type="radio" name="platform" value="mobile">
              <span>手机版</span>
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="modal-cancel">取消</button>
          <button class="btn btn-primary" id="modal-confirm">创建</button>
        </div>
      </div>
    </div>
    
    <div class="modal-overlay" id="restore-modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3>历史版本</h3>
          <button class="modal-close" id="restore-modal-close">×</button>
        </div>
        <div class="modal-body">
          <div id="version-list" class="version-list"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="restore-modal-cancel">取消</button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="js/chat.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/models.js"></script>
</body>
</html>
