<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>篮球训练助手 - Basketball Training Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- 侧边导航 -->
        <nav class="sidebar">
            <div class="logo">
                <i class="fas fa-basketball-ball"></i>
                <span>篮球训练助手</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active" data-page="record">
                    <i class="fas fa-edit"></i>
                    <span>训练记录</span>
                </li>
                <li class="nav-item" data-page="stats">
                    <i class="fas fa-chart-bar"></i>
                    <span>数据统计</span>
                </li>
                <li class="nav-item" data-page="courts">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>球场查找</span>
                </li>
                <li class="nav-item" data-page="profile">
                    <i class="fas fa-user"></i>
                    <span>个人中心</span>
                </li>
            </ul>
        </nav>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 训练记录页面 -->
            <section id="record-page" class="page active">
                <header class="page-header">
                    <h1>训练记录</h1>
                    <p>记录每一次进步，见证成长轨迹</p>
                </header>

                <div class="content-grid">
                    <!-- 快速记录卡片 -->
                    <div class="card record-form">
                        <h2><i class="fas fa-plus-circle"></i> 新建训练记录</h2>
                        <form id="training-form">
                            <div class="form-group">
                                <label>训练日期</label>
                                <input type="date" id="training-date" required>
                            </div>
                            <div class="form-group">
                                <label>训练类型</label>
                                <select id="training-type" required>
                                    <option value="">请选择训练类型</option>
                                    <option value="shooting">投篮训练</option>
                                    <option value="dribbling">运球训练</option>
                                    <option value="defense">防守训练</option>
                                    <option value="physical">体能训练</option>
                                    <option value="game">实战对抗</option>
                                    <option value="other">其他</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>训练时长 (分钟)</label>
                                    <input type="number" id="training-duration" min="1" max="300" placeholder="60" required>
                                </div>
                                <div class="form-group">
                                    <label>投篮命中 / 总出手</label>
                                    <div class="shooting-inputs">
                                        <input type="number" id="shots-made" min="0" placeholder="命中">
                                        <span>/</span>
                                        <input type="number" id="shots-total" min="1" placeholder="总出手">
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>训练感受</label>
                                <div class="mood-selector">
                                    <button type="button" class="mood-btn" data-mood="great">
                                        <i class="fas fa-grin-stars"></i>
                                        <span>超棒</span>
                                    </button>
                                    <button type="button" class="mood-btn" data-mood="good">
                                        <i class="fas fa-smile"></i>
                                        <span>不错</span>
                                    </button>
                                    <button type="button" class="mood-btn" data-mood="normal">
                                        <i class="fas fa-meh"></i>
                                        <span>一般</span>
                                    </button>
                                    <button type="button" class="mood-btn" data-mood="tired">
                                        <i class="fas fa-tired"></i>
                                        <span>疲惫</span>
                                    </button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>备注</label>
                                <textarea id="training-notes" rows="3" placeholder="记录今天的训练要点、心得体会..."></textarea>
                            </div>
                            <button type="submit" class="btn-primary">
                                <i class="fas fa-save"></i> 保存记录
                            </button>
                        </form>
                    </div>

                    <!-- 最近记录列表 -->
                    <div class="card recent-records">
                        <h2><i class="fas fa-history"></i> 最近训练</h2>
                        <div id="records-list" class="records-list">
                            <div class="empty-state">
                                <i class="fas fa-clipboard-list"></i>
                                <p>还没有训练记录</p>
                                <span>开始记录你的第一次训练吧！</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 数据统计页面 -->
            <section id="stats-page" class="page">
                <header class="page-header">
                    <h1>数据统计</h1>
                    <p>用数据说话，看见自己的进步</p>
                </header>

                <div class="stats-overview">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-fire"></i>
                        </div>
                        <div class="stat-info">
                            <span class="stat-value" id="total-sessions">0</span>
                            <span class="stat-label">总训练次数</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="stat-info">
                            <span class="stat-value" id="total-hours">0</span>
                            <span class="stat-label">总训练时长(小时)</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-bullseye"></i>
                        </div>
                        <div class="stat-info">
                            <span class="stat-value" id="avg-shooting">0%</span>
                            <span class="stat-label">平均投篮命中率</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-calendar-check"></i>
                        </div>
                        <div class="stat-info">
                            <span class="stat-value" id="current-streak">0</span>
                            <span class="stat-label">连续训练天数</span>
                        </div>
                    </div>
                </div>

                <div class="content-grid">
                    <div class="card chart-card">
                        <h2><i class="fas fa-chart-line"></i> 训练趋势</h2>
                        <div id="trend-chart" class="chart-container">
                            <canvas id="trendCanvas"></canvas>
                        </div>
                    </div>
                    <div class="card chart-card">
                        <h2><i class="fas fa-chart-pie"></i> 训练类型分布</h2>
                        <div id="type-chart" class="chart-container">
                            <canvas id="typeCanvas"></canvas>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 球场查找页面 -->
            <section id="courts-page" class="page">
                <header class="page-header">
                    <h1>球场查找</h1>
                    <p>发现身边的篮球场，随时开练</p>
                </header>

                <div class="search-bar">
                    <div class="search-input">
                        <i class="fas fa-search"></i>
                        <input type="text" id="court-search" placeholder="搜索球场名称或地址...">
                    </div>
                    <button class="btn-primary" onclick="searchCourts()">
                        <i class="fas fa-location-arrow"></i> 查找附近
                    </button>
                </div>

                <div class="courts-grid" id="courts-list">
                    <!-- 球场卡片将通过JS动态生成 -->
                </div>
            </section>

            <!-- 个人中心页面 -->
            <section id="profile-page" class="page">
                <header class="page-header">
                    <h1>个人中心</h1>
                    <p>管理你的篮球档案</p>
                </header>

                <div class="profile-content">
                    <div class="card profile-card">
                        <div class="profile-avatar">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <div class="profile-info">
                            <h2>篮球爱好者</h2>
                            <p>坚持训练，每天进步一点点</p>
                        </div>
                    </div>

                    <div class="card settings-card">
                        <h2><i class="fas fa-cog"></i> 设置</h2>
                        <div class="setting-item">
                            <span>每日训练提醒</span>
                            <label class="toggle">
                                <input type="checkbox" id="reminder-toggle">
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                        <div class="setting-item">
                            <span>目标训练时长 (分钟/天)</span>
                            <input type="number" id="daily-goal" value="60" min="10" max="300">
                        </div>
                        <div class="setting-item">
                            <span>主要位置</span>
                            <select id="player-position">
                                <option value="guard">后卫 (Guard)</option>
                                <option value="forward">前锋 (Forward)</option>
                                <option value="center">中锋 (Center)</option>
                                <option value="flexible">灵活多变</option>
                            </select>
                        </div>
                        <button class="btn-primary" onclick="saveSettings()">
                            <i class="fas fa-save"></i> 保存设置
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 提示消息 -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
