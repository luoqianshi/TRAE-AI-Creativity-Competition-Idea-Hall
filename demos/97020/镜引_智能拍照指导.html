<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>镜引 - 智能拍照指导</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Playfair Display';
            font-style: normal;
            font-weight: 400;
            src: local('Playfair Display'), local('PlayfairDisplay-Regular'),
                 local('Georgia'), local('Times New Roman');
        }
        @font-face {
            font-family: 'Playfair Display';
            font-style: normal;
            font-weight: 600;
            src: local('Playfair Display SemiBold'), local('PlayfairDisplay-SemiBold'),
                 local('Georgia'), local('Times New Roman');
        }
        @font-face {
            font-family: 'Playfair Display';
            font-style: normal;
            font-weight: 700;
            src: local('Playfair Display Bold'), local('PlayfairDisplay-Bold'),
                 local('Georgia'), local('Times New Roman');
        }
        @font-face {
            font-family: 'Lato';
            font-style: normal;
            font-weight: 300;
            src: local('Lato Light'), local('Lato-Light'),
                 local('Helvetica Neue'), local('Arial'), sans-serif;
        }
        @font-face {
            font-family: 'Lato';
            font-style: normal;
            font-weight: 400;
            src: local('Lato Regular'), local('Lato-Regular'),
                 local('Helvetica Neue'), local('Arial'), sans-serif;
        }
        @font-face {
            font-family: 'Lato';
            font-style: normal;
            font-weight: 500;
            src: local('Lato Medium'), local('Lato-Medium'),
                 local('Helvetica Neue'), local('Arial'), sans-serif;
        }
        @font-face {
            font-family: 'Lato';
            font-style: normal;
            font-weight: 700;
            src: local('Lato Bold'), local('Lato-Bold'),
                 local('Helvetica Neue'), local('Arial'), sans-serif;
        }

        :root {
            --primary: #0D9488;
            --primary-light: #14B8A6;
            --secondary: #F59E0B;
            --accent: #8B5CF6;
            --dark: #1E293B;
            --light: #F8FAFC;
            --gray: #94A3B8;
            --card-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            color: var(--dark);
            overflow-x: hidden;
        }

        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: -1;
        }

        .bg-blob-1 {
            width: 600px;
            height: 600px;
            background: var(--primary);
            top: -100px;
            left: -100px;
        }

        .bg-blob-2 {
            width: 500px;
            height: 500px;
            background: var(--accent);
            bottom: -100px;
            right: -100px;
        }

        .bg-blob-3 {
            width: 400px;
            height: 400px;
            background: var(--secondary);
            top: 50%;
            right: 20%;
            transform: translateY(-50%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            color: white;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        header p {
            color: var(--gray);
            font-size: 18px;
            font-weight: 300;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: var(--dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title svg {
            width: 24px;
            height: 24px;
            color: var(--primary);
        }

        .upload-area {
            border: 3px dashed var(--gray);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(13, 148, 136, 0.05);
        }

        .upload-area.has-image {
            border-style: solid;
            border-color: var(--primary);
            padding: 0;
        }

        .upload-area.has-image .upload-content {
            display: none;
        }

        .upload-area.has-image img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 13px;
        }

        .upload-content {
            color: var(--gray);
        }

        .upload-content svg {
            width: 50px;
            height: 50px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .upload-content h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .upload-content p {
            font-size: 14px;
        }

        .upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .saved-photos {
            margin-top: 20px;
        }

        .saved-photos-title {
            font-size: 14px;
            color: var(--gray);
            margin-bottom: 12px;
        }

        .saved-photos-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        @media (max-width: 640px) {
            .saved-photos-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .saved-photo-item {
            aspect-ratio: 3/4;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s ease;
            position: relative;
        }

        .saved-photo-item:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .saved-photo-item.selected {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.3);
        }

        .saved-photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .saved-photo-item .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .saved-photo-item:hover .delete-btn {
            opacity: 1;
        }

        .saved-photo-item .delete-btn svg {
            width: 14px;
            height: 14px;
            color: white;
        }

        .styles-section {
            grid-column: span 2;
        }

        @media (max-width: 1024px) {
            .styles-section {
                grid-column: span 1;
            }
        }

        .styles-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 15px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        .styles-container::-webkit-scrollbar {
            height: 6px;
        }

        .styles-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .styles-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }

        .style-card {
            flex-shrink: 0;
            width: 160px;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s ease;
            background: white;
        }

        .style-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary-light);
        }

        .style-card.selected {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.2);
        }

        .style-card .style-preview {
            height: 100px;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .style-card .style-info {
            padding: 12px;
        }

        .style-card .style-info h4 {
            font-size: 14px;
            color: var(--dark);
            margin-bottom: 4px;
        }

        .style-card .style-info p {
            font-size: 11px;
            color: var(--gray);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .generate-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 40px auto;
            padding: 20px 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(13, 148, 136, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(13, 148, 136, 0.5);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .preview-section {
            display: none;
        }

        .preview-section.active {
            display: block;
        }

        .preview-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow);
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .preview-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--dark);
        }

        .preview-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary {
            background: white;
            color: var(--dark);
            border: 2px solid var(--gray);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-light);
        }

        .btn-success {
            background: var(--secondary);
            color: white;
        }

        .btn-success:hover {
            background: #D97706;
        }

        .preview-canvas-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
            background: #1E293B;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        #previewCanvas {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 16px;
        }

        .preview-styles {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .preview-style-btn {
            flex-shrink: 0;
            padding: 10px 20px;
            border-radius: 20px;
            background: white;
            border: 2px solid var(--gray);
            color: var(--dark);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preview-style-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .preview-style-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-content p {
            font-size: 18px;
            font-weight: 500;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--dark);
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: var(--primary);
        }

        .toast.error {
            background: #EF4444;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--gray);
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .empty-state p {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
    <div class="bg-blob bg-blob-3"></div>

    <div class="container">
        <header>
            <h1>镜引</h1>
            <p>智能拍照指导 - 让每个人都能拍出专业级照片</p>
            <button id="downloadToolBtn" class="btn btn-primary" style="margin-top: 15px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                下载本工具
            </button>
        </header>

        <div class="main-grid">
            <div class="card">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    风景背景图
                </div>
                <div id="landscapeUpload" class="upload-area">
                    <div class="upload-content">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 10h-1.26a4 4 0 0 0-7.48 0H6"></path>
                            <polyline points="14 15 14 20 20 20 20 15"></polyline>
                            <line x1="16" y1="5" x2="16" y2="10"></line>
                            <line x1="8" y1="5" x2="8" y2="10"></line>
                            <line x1="3" y1="15" x2="21" y2="15"></line>
                        </svg>
                        <h3>上传风景图片</h3>
                        <p>支持 JPG、PNG 格式，拖拽或点击上传</p>
                    </div>
                    <img id="landscapePreview" style="display: none;">
                    <input type="file" id="landscapeInput" accept="image/*">
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    用户全身图
                </div>
                <div id="userUpload" class="upload-area">
                    <div class="upload-content">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <h3>上传用户全身图片</h3>
                        <p>图片将保存至本地，下次可直接使用</p>
                    </div>
                    <img id="userPreview" style="display: none;">
                    <input type="file" id="userInput" accept="image/*">
                </div>

                <div class="saved-photos">
                    <div class="saved-photos-title">已保存的照片</div>
                    <div id="savedPhotosGrid" class="saved-photos-grid">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <h3>暂无保存的照片</h3>
                            <p>上传用户图片后将自动保存</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card styles-section">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="6"></circle>
                        <circle cx="12" cy="12" r="2"></circle>
                    </svg>
                    选择构图风格
                </div>
                <div id="stylesContainer" class="styles-container">
                <div class="style-card selected" data-style="ruleOfThirds">
                    <div class="style-preview">
                        <svg viewBox="0 0 100 100" width="80" height="80">
                            
                        <rect width="100" height="100" fill="#f1f5f9"></rect>
                        <line x1="33.3" y1="0" x2="33.3" y2="100" stroke="#0D9488" stroke-width="1"></line>
                        <line x1="66.6" y1="0" x2="66.6" y2="100" stroke="#0D9488" stroke-width="1"></line>
                        <line x1="0" y1="33.3" x2="100" y2="33.3" stroke="#0D9488" stroke-width="1"></line>
                        <line x1="0" y1="66.6" x2="100" y2="66.6" stroke="#0D9488" stroke-width="1"></line>
                        <circle cx="16.6" cy="16.6" r="3" fill="#F59E0B"></circle>
                        <circle cx="50" cy="16.6" r="3" fill="#F59E0B"></circle>
                        <circle cx="83.3" cy="16.6" r="3" fill="#F59E0B"></circle>
                        <circle cx="16.6" cy="50" r="3" fill="#F59E0B"></circle>
                        <circle cx="83.3" cy="50" r="3" fill="#F59E0B"></circle>
                        <circle cx="16.6" cy="83.3" r="3" fill="#F59E0B"></circle>
                        <circle cx="50" cy="83.3" r="3" fill="#F59E0B"></circle>
                        <circle cx="83.3" cy="83.3" r="3" fill="#F59E0B"></circle>
                    
                        </svg>
                    </div>
                    <div class="style-info">
                        <h4>三分法</h4>
                        <p>经典构图，将画面分为九格</p>
                    </div>
                </div>
            
                <div class="style-card " data-style="leadingLines">
                    <div class="style-preview">
                        <svg viewBox="0 0 100 100" width="80" height="80">
                            
                        <rect width="100" height="100" fill="#f1f5f9"></rect>
                        <path d="M10 90 Q30 60 50 50 T90 10" stroke="#0D9488" stroke-width="2" fill="none"></path>
                        <path d="M20 90 Q40 70 60 55 T90 25" stroke="#0D9488" stroke-width="1.5" fill="none" stroke-dasharray="3,2"></path>
                        <circle cx="90" cy="10" r="4" fill="#F59E0B"></circle>
                    
                        </svg>
                    </div>
                    <div class="style-info">
                        <h4>引导线</h4>
                        <p>利用线条引导视线</p>
                    </div>
                </div>
            
                <div class="style-card " data-style="goldenRatio">
                    <div class="style-preview">
                        <svg viewBox="0 0 100 100" width="80" height="80">
                            
                        <rect width="100" height="100" fill="#f1f5f9"></rect>
                        <path d="M61.8 0 L100 0 L100 38.2 L61.8 38.2 L61.8 61.8 L38.2 61.8 L38.2 85.4 L23.6 85.4" fill="#0D9488" fill-opacity="0.3" stroke="#0D9488" stroke-width="1"></path>
                        <circle cx="38.2" cy="38.2" r="23.6" fill="none" stroke="#F59E0B" stroke-width="2"></circle>
                        <circle cx="61.8" cy="38.2" r="14.4" fill="none" stroke="#F59E0B" stroke-width="2"></circle>
                        <circle cx="61.8" cy="52.6" r="8.8" fill="none" stroke="#F59E0B" stroke-width="2"></circle>
                        <circle cx="52.6" cy="61.8" r="5.4" fill="none" stroke="#F59E0B" stroke-width="2"></circle>
                    
                        </svg>
                    </div>
                    <div class="style-info">
                        <h4>黄金比例</h4>
                        <p>斐波那契螺旋构图</p>
                    </div>
                </div>
            
                <div class="style-card " data-style="framing">
                    <div class="style-preview">
                        <svg viewBox="0 0 100 100" width="80" height="80">
                            
                        <rect width="100" height="100" fill="#f1f5f9"></rect>
                        <rect x="15" y="15" width="70" height="70" fill="none" stroke="#0D9488" stroke-width="3"></rect>
                        <path d="M0 20 L15 20" stroke="#0D9488" stroke-width="4" stroke-linecap="round"></path>
                        <path d="M0 80 L15 80" stroke="#0D9488" stroke-width="4" stroke-linecap="round"></path>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">

        </div>

    <div id="toast" class="toast"></div>

    <script>
        const LANDSCAPE_STORAGE_KEY = 'photoguide_landscape';
        const USER_IMAGES_KEY = 'photoguide_user_images';
        const SELECTED_USER_IMAGE_KEY = 'photoguide_selected_user';

        let landscapeImage = null;
        let userImage = null;
        let savedUserImages = [];
        let selectedStyle = 'ruleOfThirds';

        const styles = [
            {
                id: 'ruleOfThirds',
                name: '三分法',
                description: '经典构图，将画面分为九格',
                draw: drawRuleOfThirds
            },
            {
                id: 'leadingLines',
                name: '引导线',
                description: '利用线条引导视线',
                draw: drawLeadingLines
            },
            {
                id: 'goldenRatio',
                name: '黄金比例',
                description: '斐波那契螺旋构图',
                draw: drawGoldenRatio
            },
            {
                id: 'framing',
                name: '框架构图',
                description: '利用场景元素框住主体',
                draw: drawFraming
            },
            {
                id: 'symmetry',
                name: '对称构图',
                description: '平衡对称的画面',
                draw: drawSymmetry
            },
            {
                id: 'dynamic',
                name: '动态构图',
                description: '对角线创造动感',
                draw: drawDynamic
            }
        ];

        function init() {
            loadSavedUserImages();
            loadSelectedUserImage();
            initStyleCards();
            initEventListeners();
            updateGenerateButton();
        }

        function loadSavedUserImages() {
            try {
                const saved = localStorage.getItem(USER_IMAGES_KEY);
                if (saved) {
                    savedUserImages = JSON.parse(saved);
                    renderSavedPhotos();
                }
            } catch (e) {
                console.error('Failed to load saved user images:', e);
            }
        }

        function loadSelectedUserImage() {
            try {
                const selected = localStorage.getItem(SELECTED_USER_IMAGE_KEY);
                if (selected) {
                    const img = savedUserImages.find(i => i.id === selected);
                    if (img) {
                        setUserImage(img.dataUrl);
                        highlightSelectedPhoto(img.id);
                    }
                }
            } catch (e) {
                console.error('Failed to load selected user image:', e);
            }
        }

        async function saveUserImageToStorage(dataUrl, fileName) {
            const thumbnail = await createThumbnail(dataUrl);
            const newImage = {
                id: Date.now().toString(),
                name: fileName,
                dataUrl: dataUrl,
                thumbnail: thumbnail,
                createdAt: Date.now()
            };

            savedUserImages.unshift(newImage);
            localStorage.setItem(USER_IMAGES_KEY, JSON.stringify(savedUserImages));
            localStorage.setItem(SELECTED_USER_IMAGE_KEY, newImage.id);
            renderSavedPhotos();
            highlightSelectedPhoto(newImage.id);
            showToast('照片已保存，下次可直接使用', 'success');
        }

        function createThumbnail(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxSize = 100;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        height = (height / width) * maxSize;
                        width = maxSize;
                    } else {
                        width = (width / height) * maxSize;
                        height = maxSize;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = dataUrl;
            });
        }

        async function deleteSavedImage(id) {
            savedUserImages = savedUserImages.filter(img => img.id !== id);
            localStorage.setItem(USER_IMAGES_KEY, JSON.stringify(savedUserImages));
            
            if (localStorage.getItem(SELECTED_USER_IMAGE_KEY) === id) {
                localStorage.removeItem(SELECTED_USER_IMAGE_KEY);
                userImage = null;
                document.getElementById('userUpload').classList.remove('has-image');
                document.getElementById('userPreview').style.display = 'none';
            }
            
            renderSavedPhotos();
            updateGenerateButton();
            showToast('照片已删除', 'success');
        }

        function renderSavedPhotos() {
            const grid = document.getElementById('savedPhotosGrid');
            
            if (savedUserImages.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <h3>暂无保存的照片</h3>
                        <p>上传用户图片后将自动保存</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = savedUserImages.map(img => `
                <div class="saved-photo-item" data-id="${img.id}">
                    <img src="${img.thumbnail}" alt="${img.name}" />
                    <div class="delete-btn" data-delete="${img.id}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </div>
                </div>
            `).join('');
        }

        function highlightSelectedPhoto(id) {
            document.querySelectorAll('.saved-photo-item').forEach(item => {
                item.classList.toggle('selected', item.dataset.id === id);
            });
        }

        function initStyleCards() {
            const container = document.getElementById('stylesContainer');
            container.innerHTML = styles.map(style => `
                <div class="style-card ${style.id === selectedStyle ? 'selected' : ''}" data-style="${style.id}">
                    <div class="style-preview">
                        <svg viewBox="0 0 100 100" width="80" height="80">
                            ${getStylePreviewSVG(style.id)}
                        </svg>
                    </div>
                    <div class="style-info">
                        <h4>${style.name}</h4>
                        <p>${style.description}</p>
                    </div>
                </div>
            `).join('');
        }

        function getStylePreviewSVG(styleId) {
            switch (styleId) {
                case 'ruleOfThirds':
                    return `
                        <rect width="100" height="100" fill="#f1f5f9"/>
                        <line x1="33.3" y1="0" x2="33.3" y2="100" stroke="#0D9488" stroke-width="1"/>
                        <line x1="66.6" y1="0" x2="66.6" y2="100" stroke="#0D9488" stroke-width="1"/>
                        <line x1="0" y1="33.3" x2="100" y2="33.3" stroke="#0D9488" stroke-width="1"/>
                        <line x1="0" y1="66.6" x2="100" y2="66.6" stroke="#0D9488" stroke-width="1"/>
                        <circle cx="16.6" cy="16.6" r="3" fill="#F59E0B"/>
                        <circle cx="50" cy="16.6" r="3" fill="#F59E0B"/>
                        <circle cx="83.3" cy="16.6" r="3" fill="#F59E0B"/>
                        <circle cx="16.6" cy="50" r="3" fill="#F59E0B"/>
                        <circle cx="83.3" cy="50" r="3" fill="#F59E0B"/>
                        <circle cx="16.6" cy="83.3" r="3" fill="#F59E0B"/>
                        <circle cx="50" cy="83.3" r="3" fill="#F59E0B"/>
                        <circle cx="83.3" cy="83.3" r="3" fill="#F59E0B"/>
                    `;
                case 'leadingLines':
                    return `
                        <rect width="100" height="100" fill="#f1f5f9"/>
                        <path d="M10 90 Q30 60 50 50 T90 10" stroke="#0D9488" stroke-width="2" fill="none"/>
                        <path d="M20 90 Q40 70 60 55 T90 25" stroke="#0D9488" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
                        <circle cx="90" cy="10" r="4" fill="#F59E0B"/>
                    `;
                case 'goldenRatio':
                    return `
                        <rect width="100" height="100" fill="#f1f5f9"/>
                        <path d="M61.8 0 L100 0 L100 38.2 L61.8 38.2 L61.8 61.8 L38.2 61.8 L38.2 85.4 L23.6 85.4" 
                              fill="#0D9488" fill-opacity="0.3" stroke="#0D9488" stroke-width="1"/>
                        <circle cx="38.2" cy="38.2" r="23.6" fill="none" stroke="#F59E0B" stroke-width="2"/>
                        <circle cx="61.8" cy="38.2" r="14.4" fill="none" stroke="#F59E0B" stroke-width="2"/>
                        <circle cx="61.8" cy="52.6" r="8.8" fill="none" stroke="#F59E0B" stroke-width="2"/>
                        <circle cx="52.6" cy="61.8" r="5.4" fill="none" stroke="#F59E0B" stroke-width="2"/>
                    `;
                case 'framing':
                    return `
                        <rect width="100" height="100" fill="#f1f5f9"/>
                        <rect x="15" y="15" width="70" height="70" fill="none" stroke="#0D9488" stroke-width="3"/>
                        <path d="M0 20 L15 20" stroke="#0D9488" stroke-width="4" stroke-linecap="round"/>
                        <path d="M0 80 L15 80" stroke="#0D9488" stroke-width="4" stroke-linecap="round"/>
                        <path d="M100 30 L85 30" stroke="#0D9488" stroke-width="4" stroke-linecap="round"/>
                        <path d="M100 70 L85 70" stroke="#0D9488" stroke-width="4" stroke-linecap="round"/>
                        <path d="M20 0 L20 15" stroke="#0D9488" stroke-width="4" stroke-linecap="round"/>
                        <path d="M80 0 L80 15" stroke="#0D9488" stroke-width="4" stroke-linecap="round"/>
                        <path d="M30 100 L30 85" stroke="#0D9488" stroke-width="4" stroke-linecap="round"/>
                        <path d="M70 100 L70 85" stroke="#0D9488" stroke-width="4" stroke-linecap="round"/>
                    `;
                case 'symmetry':
                    return `
                        <rect width="100" height="100" fill="#f1f5f9"/>
                        <line x1="50" y1="0" x2="50" y2="100" stroke="#0D9488" stroke-width="2" stroke-dasharray="5,3"/>
                        <line x1="0" y1="50" x2="100" y2="50" stroke="#0D9488" stroke-width="1" stroke-dasharray="3,2"/>
                        <rect x="5" y="5" width="40" height="40" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
                        <rect x="55" y="5" width="40" height="40" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
                        <rect x="5" y="55" width="40" height="40" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
                        <rect x="55" y="55" width="40" height="40" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
                        <circle cx="50" cy="50" r="8" fill="#F59E0B"/>
                    `;
                case 'dynamic':
                    return `
                        <rect width="100" height="100" fill="#f1f5f9"/>
                        <line x1="0" y1="0" x2="100" y2="100" stroke="#0D9488" stroke-width="2"/>
                        <line x1="100" y1="0" x2="0" y2="100" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="4,2"/>
                        <polygon points="0,0 100,30 60,100" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1"/>
                        <polygon points="100,0 0,70 40,100" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1"/>
                        <circle cx="70" cy="30" r="4" fill="#0D9488"/>
                    `;
                default:
                    return '';
            }
        }

        function initEventListeners() {
            document.getElementById('landscapeInput').addEventListener('change', handleLandscapeUpload);
            document.getElementById('userInput').addEventListener('change', handleUserUpload);
            
            document.getElementById('landscapeUpload').addEventListener('dragover', (e) => {
                e.preventDefault();
                e.target.classList.add('dragover');
            });
            
            document.getElementById('landscapeUpload').addEventListener('dragleave', (e) => {
                e.target.classList.remove('dragover');
            });
            
            document.getElementById('landscapeUpload').addEventListener('drop', (e) => {
                e.preventDefault();
                e.target.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    processImage(file, setLandscapeImage);
                }
            });

            document.getElementById('userUpload').addEventListener('dragover', (e) => {
                e.preventDefault();
                e.target.classList.add('dragover');
            });
            
            document.getElementById('userUpload').addEventListener('dragleave', (e) => {
                e.target.classList.remove('dragover');
            });
            
            document.getElementById('userUpload').addEventListener('drop', (e) => {
                e.preventDefault();
                e.target.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    processImage(file, handleUserImageProcessed);
                }
            });

            document.getElementById('savedPhotosGrid').addEventListener('click', (e) => {
                const deleteBtn = e.target.closest('[data-delete]');
                if (deleteBtn) {
                    deleteSavedImage(deleteBtn.dataset.delete);
                    return;
                }
                
                const item = e.target.closest('.saved-photo-item');
                if (item) {
                    const img = savedUserImages.find(i => i.id === item.dataset.id);
                    if (img) {
                        setUserImage(img.dataUrl);
                        localStorage.setItem(SELECTED_USER_IMAGE_KEY, img.id);
                        highlightSelectedPhoto(img.id);
                    }
                }
            });

            document.getElementById('stylesContainer').addEventListener('click', (e) => {
                const card = e.target.closest('.style-card');
                if (card) {
                    selectedStyle = card.dataset.style;
                    document.querySelectorAll('.style-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    updateGenerateButton();
                }
            });

            document.getElementById('generateBtn').addEventListener('click', generateGuidance);
            document.getElementById('backBtn').addEventListener('click', showHome);
            document.getElementById('downloadBtn').addEventListener('click', downloadImage);
            document.getElementById('downloadToolBtn').addEventListener('click', downloadTool);
        }

        function handleLandscapeUpload(e) {
            const file = e.target.files[0];
            if (file) {
                processImage(file, setLandscapeImage);
            }
        }

        function handleUserUpload(e) {
            const file = e.target.files[0];
            if (file) {
                processImage(file, handleUserImageProcessed);
            }
        }

        async function handleUserImageProcessed(dataUrl, fileName) {
            setUserImage(dataUrl);
            await saveUserImageToStorage(dataUrl, fileName);
        }

        function processImage(file, callback) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxSize = 1200;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxSize || height > maxSize) {
                        if (width > height) {
                            height = (height / width) * maxSize;
                            width = maxSize;
                        } else {
                            width = (width / height) * maxSize;
                            height = maxSize;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.9), file.name);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function setLandscapeImage(dataUrl) {
            landscapeImage = dataUrl;
            const upload = document.getElementById('landscapeUpload');
            const preview = document.getElementById('landscapePreview');
            
            upload.classList.add('has-image');
            preview.src = dataUrl;
            preview.style.display = 'block';
            
            localStorage.setItem(LANDSCAPE_STORAGE_KEY, dataUrl);
            updateGenerateButton();
        }

        function setUserImage(dataUrl) {
            userImage = dataUrl;
            const upload = document.getElementById('userUpload');
            const preview = document.getElementById('userPreview');
            
            upload.classList.add('has-image');
            preview.src = dataUrl;
            preview.style.display = 'block';
            
            updateGenerateButton();
        }

        function updateGenerateButton() {
            const btn = document.getElementById('generateBtn');
            btn.disabled = !landscapeImage || !userImage;
        }

        let previewListenerInitialized = false;

        async function generateGuidance() {
            if (!landscapeImage || !userImage) return;

            document.getElementById('loadingOverlay').classList.add('active');

            await new Promise(resolve => setTimeout(resolve, 500));

            await renderPreview();

            if (!previewListenerInitialized) {
                initPreviewStyleListener();
                previewListenerInitialized = true;
            }

            document.getElementById('loadingOverlay').classList.remove('active');
            document.getElementById('previewSection').classList.add('active');
            document.querySelector('.main-grid').style.display = 'none';
            document.getElementById('generateBtn').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function renderPreview() {
            const canvas = document.getElementById('previewCanvas');
            const ctx = canvas.getContext('2d');

            const [landscapeImg, userImg] = await Promise.all([
                loadImage(landscapeImage),
                loadImage(userImage)
            ]);

            canvas.width = landscapeImg.width;
            canvas.height = landscapeImg.height;

            ctx.drawImage(landscapeImg, 0, 0);

            const userWidth = landscapeImg.width * 0.25;
            const userHeight = (userImg.height / userImg.width) * userWidth;
            const userX = landscapeImg.width * 0.5 - userWidth * 0.5;
            const userY = landscapeImg.height * 0.65 - userHeight * 0.5;

            ctx.globalAlpha = 0.9;
            ctx.drawImage(userImg, userX, userY, userWidth, userHeight);
            ctx.globalAlpha = 1;

            drawPoseGuide(ctx, userX, userY, userWidth, userHeight);

            const style = styles.find(s => s.id === selectedStyle);
            if (style) {
                style.draw(ctx, canvas.width, canvas.height);
            }

            renderPreviewStyleButtons();
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
            });
        }

        function renderPreviewStyleButtons() {
            const container = document.getElementById('previewStyles');
            container.innerHTML = styles.map(style => `
                <button class="preview-style-btn ${style.id === selectedStyle ? 'active' : ''}" 
                        data-style="${style.id}">
                    ${style.name}
                </button>
            `).join('');
        }

        function initPreviewStyleListener() {
            const container = document.getElementById('previewStyles');
            container.addEventListener('click', (e) => {
                const btn = e.target.closest('.preview-style-btn');
                if (btn) {
                    selectedStyle = btn.dataset.style;
                    document.querySelectorAll('.preview-style-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderPreview();
                }
            });
        }

        function drawRuleOfThirds(ctx, width, height) {
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.8)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 5]);

            ctx.beginPath();
            ctx.moveTo(width / 3, 0);
            ctx.lineTo(width / 3, height);
            ctx.moveTo(width * 2 / 3, 0);
            ctx.lineTo(width * 2 / 3, height);
            ctx.moveTo(0, height / 3);
            ctx.lineTo(width, height / 3);
            ctx.moveTo(0, height * 2 / 3);
            ctx.lineTo(width, height * 2 / 3);
            ctx.stroke();

            ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(245, 158, 11, 0.9)';
            
            const points = [
                [width / 6, height / 6],
                [width / 2, height / 6],
                [width * 5 / 6, height / 6],
                [width / 6, height / 2],
                [width * 5 / 6, height / 2],
                [width / 6, height * 5 / 6],
                [width / 2, height * 5 / 6],
                [width * 5 / 6, height * 5 / 6]
            ];

            points.forEach(([x, y]) => {
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(x, y, 12, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(245, 158, 11, 0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        function drawLeadingLines(ctx, width, height) {
            ctx.strokeStyle = 'rgba(13, 148, 136, 0.8)';
            ctx.lineWidth = 3;
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.moveTo(width * 0.1, height * 0.9);
            ctx.quadraticCurveTo(width * 0.3, height * 0.6, width * 0.5, height * 0.5);
            ctx.quadraticCurveTo(width * 0.7, height * 0.4, width * 0.9, height * 0.1);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(13, 148, 136, 0.5)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 4]);

            ctx.beginPath();
            ctx.moveTo(width * 0.2, height * 0.9);
            ctx.quadraticCurveTo(width * 0.4, height * 0.7, width * 0.6, height * 0.55);
            ctx.quadraticCurveTo(width * 0.8, height * 0.4, width * 0.9, height * 0.25);
            ctx.stroke();

            ctx.fillStyle = 'rgba(245, 158, 11, 0.9)';
            ctx.beginPath();
            ctx.arc(width * 0.9, height * 0.1, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(width * 0.9, height * 0.1, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawGoldenRatio(ctx, width, height) {
            const centerX = width * 0.618;
            const centerY = height * 0.382;
            let radius = Math.min(width, height) * 0.382;

            ctx.fillStyle = 'rgba(13, 148, 136, 0.2)';
            ctx.strokeStyle = 'rgba(13, 148, 136, 0.6)';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(width * 0.618, 0);
            ctx.lineTo(width, 0);
            ctx.lineTo(width, height * 0.382);
            ctx.lineTo(width * 0.618, height * 0.382);
            ctx.lineTo(width * 0.618, height * 0.618);
            ctx.lineTo(width * 0.382, height * 0.618);
            ctx.lineTo(width * 0.382, height * 0.854);
            ctx.lineTo(width * 0.236, height * 0.854);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = 'rgba(245, 158, 11, 0.8)';
            ctx.lineWidth = 3;

            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, Math.PI * 1.5, Math.PI * 1.5 + Math.PI * 0.5);
                ctx.stroke();

                const nextCenterX = i % 2 === 0 ? centerX - radius : centerX;
                const nextCenterY = i % 2 === 0 ? centerY : centerY + radius;
                centerX = nextCenterX;
                centerY = nextCenterY;
                radius *= 0.618;
            }

            ctx.fillStyle = 'rgba(245, 158, 11, 0.9)';
            ctx.beginPath();
            ctx.arc(width * 0.382, height * 0.382, 8, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawFraming(ctx, width, height) {
            ctx.strokeStyle = 'rgba(13, 148, 136, 0.8)';
            ctx.lineWidth = 4;
            ctx.setLineDash([]);

            const padding = width * 0.15;
            ctx.strokeRect(padding, padding, width - padding * 2, height - padding * 2);

            ctx.lineWidth = 6;
            ctx.lineCap = 'round';

            const frameSize = width * 0.08;

            ctx.beginPath();
            ctx.moveTo(0, padding);
            ctx.lineTo(frameSize, padding);
            ctx.moveTo(0, padding + (height - padding * 2) * 0.3);
            ctx.lineTo(frameSize, padding + (height - padding * 2) * 0.3);
            ctx.moveTo(0, padding + (height - padding * 2) * 0.7);
            ctx.lineTo(frameSize, padding + (height - padding * 2) * 0.7);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(width, padding);
            ctx.lineTo(width - frameSize, padding);
            ctx.moveTo(width, padding + (height - padding * 2) * 0.3);
            ctx.lineTo(width - frameSize, padding + (height - padding * 2) * 0.3);
            ctx.moveTo(width, padding + (height - padding * 2) * 0.7);
            ctx.lineTo(width - frameSize, padding + (height - padding * 2) * 0.7);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(padding, 0);
            ctx.lineTo(padding, frameSize);
            ctx.moveTo(padding + (width - padding * 2) * 0.3, 0);
            ctx.lineTo(padding + (width - padding * 2) * 0.3, frameSize);
            ctx.moveTo(padding + (width - padding * 2) * 0.7, 0);
            ctx.lineTo(padding + (width - padding * 2) * 0.7, frameSize);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(padding, height);
            ctx.lineTo(padding, height - frameSize);
            ctx.moveTo(padding + (width - padding * 2) * 0.3, height);
            ctx.lineTo(padding + (width - padding * 2) * 0.3, height - frameSize);
            ctx.moveTo(padding + (width - padding * 2) * 0.7, height);
            ctx.lineTo(padding + (width - padding * 2) * 0.7, height - frameSize);
            ctx.stroke();

            ctx.fillStyle = 'rgba(245, 158, 11, 0.9)';
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, 10, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawSymmetry(ctx, width, height) {
            ctx.strokeStyle = 'rgba(13, 148, 136, 0.7)';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 5]);

            ctx.beginPath();
            ctx.moveTo(width / 2, 0);
            ctx.lineTo(width / 2, height);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(139, 92, 246, 0.5)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 3]);

            ctx.beginPath();
            ctx.moveTo(0, height / 2);
            ctx.lineTo(width, height / 2);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(139, 92, 246, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([]);

            const quadSize = width * 0.4;
            const quadX = width * 0.05;
            const quadY = height * 0.05;

            ctx.strokeRect(quadX, quadY, quadSize, quadSize);
            ctx.strokeRect(width - quadSize - quadX, quadY, quadSize, quadSize);
            ctx.strokeRect(quadX, height - quadSize - quadY, quadSize, quadSize);
            ctx.strokeRect(width - quadSize - quadX, height - quadSize - quadY, quadSize, quadSize);

            ctx.fillStyle = 'rgba(245, 158, 11, 0.9)';
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, 6, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawDynamic(ctx, width, height) {
            ctx.strokeStyle = 'rgba(13, 148, 136, 0.8)';
            ctx.lineWidth = 3;
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(width, height);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(13, 148, 136, 0.5)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 4]);

            ctx.beginPath();
            ctx.moveTo(width, 0);
            ctx.lineTo(0, height);
            ctx.stroke();

            ctx.fillStyle = 'rgba(139, 92, 246, 0.15)';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(width, height * 0.3);
            ctx.lineTo(width * 0.6, height);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'rgba(245, 158, 11, 0.15)';
            ctx.beginPath();
            ctx.moveTo(width, 0);
            ctx.lineTo(0, height * 0.7);
            ctx.lineTo(width * 0.4, height);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(139, 92, 246, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(width, height * 0.3);
            ctx.lineTo(width * 0.6, height);
            ctx.closePath();
            ctx.stroke();

            ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
            ctx.beginPath();
            ctx.moveTo(width, 0);
            ctx.lineTo(0, height * 0.7);
            ctx.lineTo(width * 0.4, height);
            ctx.closePath();
            ctx.stroke();

            ctx.fillStyle = 'rgba(13, 148, 136, 0.9)';
            ctx.beginPath();
            ctx.arc(width * 0.7, height * 0.3, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(width * 0.7, height * 0.3, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPoseGuide(ctx, x, y, w, h) {
            ctx.save();
            
            const centerX = x + w / 2;
            const headY = y + h * 0.12;
            const neckY = y + h * 0.22;
            const shoulderY = y + h * 0.24;
            const chestY = y + h * 0.35;
            const waistY = y + h * 0.5;
            const hipY = y + h * 0.58;
            const kneeY = y + h * 0.78;
            const ankleY = y + h * 0.95;
            
            const shoulderWidth = w * 0.55;
            const hipWidth = w * 0.45;
            
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.6)';
            ctx.lineWidth = 3;
            ctx.setLineDash([6, 4]);
            
            ctx.beginPath();
            ctx.arc(centerX, headY, w * 0.15, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(centerX, neckY);
            ctx.lineTo(centerX, chestY);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(centerX - shoulderWidth / 2, shoulderY);
            ctx.lineTo(centerX + shoulderWidth / 2, shoulderY);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(centerX - shoulderWidth / 2, shoulderY);
            ctx.lineTo(centerX - w * 0.15, waistY);
            ctx.lineTo(centerX - w * 0.1, hipY);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(centerX + shoulderWidth / 2, shoulderY);
            ctx.lineTo(centerX + w * 0.2, waistY);
            ctx.lineTo(centerX + w * 0.15, hipY);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(centerX - hipWidth / 2, hipY);
            ctx.lineTo(centerX - w * 0.12, kneeY);
            ctx.lineTo(centerX - w * 0.08, ankleY);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(centerX + hipWidth / 2, hipY);
            ctx.lineTo(centerX + w * 0.15, kneeY);
            ctx.lineTo(centerX + w * 0.12, ankleY);
            ctx.stroke();
            
            ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(245, 158, 11, 0.8)';
            
            ctx.beginPath();
            ctx.arc(centerX, headY, 5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(centerX - w * 0.1, hipY, 5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(centerX + w * 0.15, kneeY, 5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'rgba(13, 148, 136, 0.8)';
            ctx.font = `${Math.max(12, w * 0.08)}px Lato, sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('推荐站位', centerX, y - 10);
            
            ctx.restore();
        }

        function showHome() {
            document.getElementById('previewSection').classList.remove('active');
            document.querySelector('.main-grid').style.display = 'grid';
            document.getElementById('generateBtn').style.display = 'flex';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function downloadImage() {
            const canvas = document.getElementById('previewCanvas');
            const link = document.createElement('a');
            link.download = `photoguide-${selectedStyle}-${Date.now()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
            showToast('图片已下载', 'success');
        }

        function downloadTool() {
            fetch(window.location.href)
                .then(response => response.text())
                .then(text => {
                    const blob = new Blob([text], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = '镜引_智能拍照指导.html';
                    link.href = url;
                    link.click();
                    URL.revokeObjectURL(url);
                    showToast('工具已下载，直接用浏览器打开即可使用', 'success');
                })
                .catch(() => {
                    const text = document.documentElement.outerHTML;
                    const blob = new Blob([text], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = '镜引_智能拍照指导.html';
                    link.href = url;
                    link.click();
                    URL.revokeObjectURL(url);
                    showToast('工具已下载，直接用浏览器打开即可使用', 'success');
                });
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        init();
    </script>

</body></html>
