<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree创造力大赛 - 报名表单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.8;
            font-size: 16px;
        }

        .form-section {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="url"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .radio-group, .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .radio-option, .checkbox-option {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .radio-option:hover, .checkbox-option:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .radio-option input[type="radio"],
        .checkbox-option input[type="checkbox"] {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .radio-option.selected, .checkbox-option.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .track-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .track-lifestyle {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
        }

        .track-work {
            background: linear-gradient(135deg, #48dbfb, #0abde3);
            color: white;
        }

        .track-service {
            background: linear-gradient(135deg, #1dd1a1, #10ac84);
            color: white;
        }

        .track-hardware {
            background: linear-gradient(135deg, #ff9ff3, #f368e0);
            color: white;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #1a1a2e;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
            display: inline-block;
        }

        .success-message {
            display: none;
            background: linear-gradient(135deg, #1dd1a1, #10ac84);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .error-message {
            display: none;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .char-count {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
            text-align: right;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }

            .form-section {
                padding: 25px;
            }

            .radio-group, .checkbox-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌲 Tree创造力大赛</h1>
            <p>释放你的创造力，打造精彩项目！</p>
        </div>

        <div class="form-section">
            <div class="success-message" id="successMessage">
                <strong>🎉 报名成功！</strong><br>
                感谢你的参与，我们会尽快审核你的项目。
            </div>

            <div class="error-message" id="errorMessage"></div>

            <form id="registrationForm" onsubmit="return validateAndSubmit()">
                <div class="section-title">基本信息</div>
                
                <div class="form-group">
                    <label>参赛赛道 <span style="color: #ff6b6b;">*</span></label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="track" value="生活娱乐">
                            <span class="track-badge track-lifestyle">生活娱乐</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="track" value="学习工作">
                            <span class="track-badge track-work">学习工作</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="track" value="社会服务">
                            <span class="track-badge track-service">社会服务</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="track" value="硬件交互">
                            <span class="track-badge track-hardware">硬件交互</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Demo名称 <span style="color: #ff6b6b;">*</span></label>
                    <input type="text" id="demoName" name="demoName" placeholder="请输入你的项目名称" maxlength="50">
                </div>

                <div class="form-group">
                    <label>参赛者姓名 <span style="color: #ff6b6b;">*</span></label>
                    <input type="text" id="name" name="name" placeholder="请输入你的姓名">
                </div>

                <div class="form-group">
                    <label>联系邮箱 <span style="color: #ff6b6b;">*</span></label>
                    <input type="email" id="email" name="email" placeholder="请输入你的邮箱地址">
                </div>

                <div class="section-title">项目介绍</div>

                <div class="form-group">
                    <label>Demo简介 <span style="color: #ff6b6b;">*</span></label>
                    <textarea id="description" name="description" placeholder="请简要介绍你的项目，包括核心功能和特色（200字以内）" maxlength="200"></textarea>
                    <div class="char-count" id="descCount">0/200</div>
                </div>

                <div class="form-group">
                    <label>创作思路 <span style="color: #ff6b6b;">*</span></label>
                    <textarea id="idea" name="idea" placeholder="请详细描述你的创作思路，包括用户痛点、项目意义、商业价值等（500字以内）" maxlength="500"></textarea>
                    <div class="char-count" id="ideaCount">0/500</div>
                </div>

                <div class="form-group">
                    <label>体验地址 <span style="color: #ff6b6b;">*</span></label>
                    <input type="url" id="experienceUrl" name="experienceUrl" placeholder="请输入项目的在线体验地址或GitHub仓库地址">
                </div>

                <div class="section-title">TRAE实践过程</div>

                <div class="form-group">
                    <label>开发环境</label>
                    <input type="text" id="env" name="env" placeholder="例如：Windows + pnpm + Tauri 2">
                </div>

                <div class="form-group">
                    <label>技术栈</label>
                    <input type="text" id="tech" name="tech" placeholder="例如：HTML、CSS、JavaScript、React">
                </div>

                <div class="form-group">
                    <label>实践过程描述</label>
                    <textarea id="process" name="process" placeholder="请描述你在TRAE中的开发过程，遇到的问题及解决方案" maxlength="500"></textarea>
                    <div class="char-count" id="processCount">0/500</div>
                </div>

                <div class="section-title">审核信息</div>

                <div class="form-group">
                    <label>审核帖子链接</label>
                    <input type="url" id="reviewUrl" name="reviewUrl" placeholder="请输入审核帖子的链接地址">
                </div>

                <div class="form-group">
                    <label>项目截图（可选）</label>
                    <input type="text" id="screenshots" name="screenshots" placeholder="请输入截图的URL地址，多个截图用逗号分隔">
                </div>

                <button type="submit" class="submit-btn">🚀 提交报名</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const description = document.getElementById('description');
            const idea = document.getElementById('idea');
            const process = document.getElementById('process');

            description.addEventListener('input', function() {
                document.getElementById('descCount').textContent = this.value.length + '/200';
            });

            idea.addEventListener('input', function() {
                document.getElementById('ideaCount').textContent = this.value.length + '/500';
            });

            process.addEventListener('input', function() {
                document.getElementById('processCount').textContent = this.value.length + '/500';
            });

            const radioOptions = document.querySelectorAll('.radio-option');
            radioOptions.forEach(function(option) {
                option.addEventListener('click', function() {
                    radioOptions.forEach(function(opt) {
                        opt.classList.remove('selected');
                    });
                    this.classList.add('selected');
                });
            });

            const checkboxOptions = document.querySelectorAll('.checkbox-option');
            checkboxOptions.forEach(function(option) {
                option.addEventListener('click', function() {
                    const checkbox = this.querySelector('input[type="checkbox"]');
                    if (checkbox.checked) {
                        this.classList.add('selected');
                    } else {
                        this.classList.remove('selected');
                    }
                });
            });
        });

        function validateAndSubmit() {
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            const track = document.querySelector('input[name="track"]:checked');
            const demoName = document.getElementById('demoName').value.trim();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const description = document.getElementById('description').value.trim();
            const idea = document.getElementById('idea').value.trim();
            const experienceUrl = document.getElementById('experienceUrl').value.trim();

            const errors = [];

            if (!track) {
                errors.push('请选择参赛赛道');
            }
            if (!demoName) {
                errors.push('请输入Demo名称');
            }
            if (!name) {
                errors.push('请输入参赛者姓名');
            }
            if (!email) {
                errors.push('请输入联系邮箱');
            } else if (!isValidEmail(email)) {
                errors.push('请输入有效的邮箱地址');
            }
            if (!description) {
                errors.push('请输入Demo简介');
            }
            if (!idea) {
                errors.push('请输入创作思路');
            }
            if (!experienceUrl) {
                errors.push('请输入体验地址');
            } else if (!isValidUrl(experienceUrl)) {
                errors.push('请输入有效的体验地址');
            }

            if (errors.length > 0) {
                errorMessage.textContent = errors.join('\n');
                errorMessage.style.display = 'block';
                return false;
            }

            const formData = {
                track: track.value,
                demoName: demoName,
                name: name,
                email: email,
                description: description,
                idea: idea,
                experienceUrl: experienceUrl,
                env: document.getElementById('env').value.trim(),
                tech: document.getElementById('tech').value.trim(),
                process: document.getElementById('process').value.trim(),
                reviewUrl: document.getElementById('reviewUrl').value.trim(),
                screenshots: document.getElementById('screenshots').value.trim()
            };

            console.log('报名信息:', formData);

            successMessage.style.display = 'block';
            
            return false;
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function isValidUrl(url) {
            try {
                new URL(url);
                return true;
            } catch (e) {
                return false;
            }
        }
    </script>
</body>
</html>
