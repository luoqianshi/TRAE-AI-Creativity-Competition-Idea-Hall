<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灵感贴贴 · 桌面便签</title>
    <style>
        /* ========== 全局重置 & 字体 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: -apple-system, "Segoe UI", "PingFang SC",
                "Microsoft YaHei", sans-serif;
            background: #eef0f3;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            position: relative;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(200, 215, 235, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(200, 215, 235, 0.3) 0%, transparent 60%);
        }

        /* ========== 便签容器 ========== */
        #note-container {
            position: relative;
            width: 100vw;
            width: 100dvw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* ========== 单个便签 ========== */
        .note {
            position: absolute;
            width: 270px;
            min-height: 120px;
            max-height: 360px;
            border-radius: 16px;
            box-shadow:
                0 8px 28px rgba(0, 0, 0, 0.10),
                0 2px 8px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.2s ease, transform 0.15s ease;
            cursor: grab;
            will-change: transform, left, top;
            backdrop-filter: blur(2px);
            overflow: hidden;
            z-index: 1;
        }

        .note:active {
            cursor: grabbing;
        }

        .note:hover {
            box-shadow:
                0 14px 40px rgba(0, 0, 0, 0.16),
                0 4px 12px rgba(0, 0, 0, 0.08);
        }

        .note.active {
            z-index: 100 !important;
            box-shadow:
                0 18px 48px rgba(0, 0, 0, 0.20),
                0 6px 16px rgba(0, 0, 0, 0.10);
        }

        /* ===== 便签头部（拖拽手柄 + 删除） ===== */
        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px 6px 16px;
            flex-shrink: 0;
            cursor: grab;
            min-height: 38px;
            background: rgba(0, 0, 0, 0.02);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            transition: background 0.2s;
        }

        .note-header:active {
            cursor: grabbing;
        }

        .note-header:hover {
            background: rgba(0, 0, 0, 0.04);
        }

        .note-time {
            font-size: 11px;
            font-weight: 500;
            color: rgba(0, 0, 0, 0.40);
            letter-spacing: 0.3px;
            pointer-events: none;
        }

        .note-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ===== 颜色切换按钮 ===== */
        .note-color-btn {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.10);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            flex-shrink: 0;
            background: currentColor;
            position: relative;
        }

        .note-color-btn:hover {
            transform: scale(1.20);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        }

        .note-color-btn::after {
            content: '🎨';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .note-color-btn:hover::after {
            opacity: 1;
        }

        /* ===== 删除按钮 ===== */
        .note-delete {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: rgba(0, 0, 0, 0.30);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            flex-shrink: 0;
            font-weight: 300;
        }

        .note-delete:hover {
            background: rgba(220, 60, 60, 0.15);
            color: #d63031;
            transform: scale(1.10);
        }

        .note-delete:active {
            transform: scale(0.90);
        }

        /* ===== 便签内容 ===== */
        .note-content {
            flex: 1;
            padding: 12px 16px 16px 16px;
            font-size: 14px;
            line-height: 1.65;
            color: rgba(0, 0, 0, 0.82);
            outline: none;
            cursor: text;
            overflow-y: auto;
            min-height: 60px;
            max-height: 280px;
            word-wrap: break-word;
            white-space: pre-wrap;
            user-select: text;
            -webkit-user-select: text;
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 0, 0, 0.10) transparent;
        }

        .note-content::-webkit-scrollbar {
            width: 4px;
        }

        .note-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .note-content::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.12);
            border-radius: 4px;
        }

        .note-content:empty::before {
            content: '写下想法…';
            color: rgba(0, 0, 0, 0.30);
            font-style: italic;
        }

        .note-content:focus {
            background: rgba(255, 255, 255, 0.20);
            border-radius: 0 0 16px 16px;
        }

        /* ===== 空状态提示 ===== */
        .empty-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(0, 0, 0, 0.20);
            pointer-events: none;
            font-size: 16px;
            line-height: 1.8;
            letter-spacing: 0.5px;
        }

        .empty-hint .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-hint .sub {
            font-size: 13px;
            opacity: 0.6;
        }

        /* ========== 添加按钮 ========== */
        #add-btn {
            position: fixed;
            bottom: 32px;
            right: 32px;
            width: 58px;
            height: 58px;
            border: none;
            border-radius: 50%;
            background: #4a6cf7;
            color: #fff;
            font-size: 32px;
            font-weight: 300;
            cursor: pointer;
            box-shadow:
                0 8px 28px rgba(74, 108, 247, 0.35),
                0 2px 8px rgba(74, 108, 247, 0.20);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            line-height: 1;
            user-select: none;
        }

        #add-btn:hover {
            transform: scale(1.10) rotate(90deg);
            box-shadow:
                0 12px 36px rgba(74, 108, 247, 0.45),
                0 4px 12px rgba(74, 108, 247, 0.25);
            background: #3b5de7;
        }

        #add-btn:active {
            transform: scale(0.92) rotate(90deg);
        }

        /* ========== 底部信息栏 ========== */
        #info-bar {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.45);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 998;
            pointer-events: none;
            letter-spacing: 0.3px;
        }

        #info-bar span {
            pointer-events: none;
        }

        #info-bar .dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.15);
        }

        #clear-btn {
            pointer-events: auto;
            background: none;
            border: none;
            color: rgba(0, 0, 0, 0.30);
            font-size: 12px;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 12px;
            transition: all 0.2s;
            font-family: inherit;
        }

        #clear-btn:hover {
            color: rgba(220, 60, 60, 0.7);
            background: rgba(220, 60, 60, 0.06);
        }

        /* ========== 便签颜色主题（通过数据属性控制） ========== */
        .note[data-color="yellow"] {
            background: #fff3c9;
        }
        .note[data-color="pink"] {
            background: #ffd9e6;
        }
        .note[data-color="blue"] {
            background: #d4e8ff;
        }
        .note[data-color="green"] {
            background: #d4edda;
        }
        .note[data-color="purple"] {
            background: #e8d5f5;
        }
        .note[data-color="orange"] {
            background: #ffe4c4;
        }
        .note[data-color="mint"] {
            background: #c8f0e6;
        }
        .note[data-color="rose"] {
            background: #fcd5d5;
        }

        .note[data-color="yellow"] .note-color-btn {
            color: #f7d44a;
        }
        .note[data-color="pink"] .note-color-btn {
            color: #f8a5b8;
        }
        .note[data-color="blue"] .note-color-btn {
            color: #74b9ff;
        }
        .note[data-color="green"] .note-color-btn {
            color: #6abf8a;
        }
        .note[data-color="purple"] .note-color-btn {
            color: #b48ad9;
        }
        .note[data-color="orange"] .note-color-btn {
            color: #f5a623;
        }
        .note[data-color="mint"] .note-color-btn {
            color: #4ecdc4;
        }
        .note[data-color="rose"] .note-color-btn {
            color: #e77a7a;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 640px) {
            .note {
                width: 220px;
                min-height: 100px;
                max-height: 280px;
                border-radius: 14px;
            }
            .note-content {
                font-size: 13px;
                padding: 10px 14px 14px 14px;
                min-height: 50px;
                max-height: 210px;
            }
            .note-header {
                padding: 8px 12px 4px 14px;
                min-height: 32px;
            }
            .note-time {
                font-size: 10px;
            }
            #add-btn {
                width: 50px;
                height: 50px;
                font-size: 28px;
                bottom: 24px;
                right: 24px;
            }
            #info-bar {
                font-size: 11px;
                padding: 4px 16px;
                bottom: 12px;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .empty-hint .icon {
                font-size: 36px;
            }
            .empty-hint {
                font-size: 14px;
            }
        }

        @media (max-width: 400px) {
            .note {
                width: 180px;
                min-height: 80px;
                max-height: 220px;
            }
            .note-content {
                font-size: 12px;
                padding: 8px 10px 10px 10px;
                min-height: 40px;
                max-height: 160px;
            }
            .note-header {
                padding: 6px 8px 4px 10px;
                min-height: 28px;
            }
            .note-delete {
                width: 20px;
                height: 20px;
                font-size: 14px;
            }
            .note-color-btn {
                width: 14px;
                height: 14px;
            }
            #add-btn {
                width: 44px;
                height: 44px;
                font-size: 24px;
                bottom: 16px;
                right: 16px;
            }
        }

        /* 便签出现动画 */
        .note-enter {
            animation: notePop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes notePop {
            0% {
                transform: scale(0.6) rotate(-4deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .note-remove {
            animation: noteShrink 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes noteShrink {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: scale(0.5) rotate(6deg);
                opacity: 0;
            }
        }

        /* 颜色切换微动画 */
        .note-color-flash {
            animation: colorFlash 0.3s ease;
        }

        @keyframes colorFlash {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.04);
                filter: brightness(1.08);
            }
            100% {
                transform: scale(1);
            }
        }

        /* 拖拽时的辅助样式 */
        .note.dragging {
            transition: none !important;
            cursor: grabbing !important;
            z-index: 200 !important;
            box-shadow:
                0 24px 56px rgba(0, 0, 0, 0.22),
                0 8px 24px rgba(0, 0, 0, 0.12) !important;
        }

        /* 选中便签的高亮边框（聚焦） */
        .note.focused .note-content {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 0 0 16px 16px;
        }
    </style>
</head>
<body>

    <!-- ========== 便签容器 ========== -->
    <div id="note-container">
        <!-- 空状态提示（默认显示，有便签时隐藏） -->
        <div class="empty-hint" id="empty-hint">
            <span class="icon">📌</span>
            还没有便签<br />
            <span class="sub">点击右下角 <strong>+</strong> 创建一张</span>
        </div>
    </div>

    <!-- ========== 添加按钮 ========== -->
    <button id="add-btn" aria-label="添加便签" title="添加便签 (Ctrl+N)">+</button>

    <!-- ========== 底部信息栏 ========== -->
    <div id="info-bar">
        <span id="note-count">0 张便签</span>
        <span class="dot"></span>
        <span>双击便签换色 · 拖拽移动</span>
        <span class="dot"></span>
        <button id="clear-btn" title="清空所有便签">清空全部</button>
    </div>

    <script>
        // ============================================================
        //  数据层
        // ============================================================
        const COLORS = ['yellow', 'pink', 'blue', 'green', 'purple', 'orange', 'mint', 'rose'];
        const COLOR_NAMES = {
            yellow: '💛',
            pink: '💗',
            blue: '💙',
            green: '💚',
            purple: '💜',
            orange: '🧡',
            mint: '💚',
            rose: '❤️'
        };

        // 默认便签位置（会在屏幕中央区域随机偏移）
        const DEFAULT_POS = { x: 120, y: 80 };
        const SPREAD = 60;

        let notes = []; // 存储所有便签数据
        let nextId = 1;
        let dragState = null; // 拖拽状态
        let activeNoteId = null;

        // DOM 引用
        const container = document.getElementById('note-container');
        const emptyHint = document.getElementById('empty-hint');
        const noteCountEl = document.getElementById('note-count');
        const addBtn = document.getElementById('add-btn');
        const clearBtn = document.getElementById('clear-btn');

        // ============================================================
        //  存储
        // ============================================================
        function loadData() {
            try {
                const raw = localStorage.getItem('stickynotes_data');
                if (!raw) return;
                const data = JSON.parse(raw);
                if (data.notes && Array.isArray(data.notes)) {
                    notes = data.notes;
                    nextId = data.nextId || 1;
                }
            } catch (_) { /* ignore */ }
        }

        function saveData() {
            try {
                localStorage.setItem('stickynotes_data', JSON.stringify({
                    notes,
                    nextId
                }));
            } catch (_) { /* ignore */ }
        }

        // ============================================================
        //  便签 DOM 操作
        // ============================================================
        function createNoteElement(data) {
            const el = document.createElement('div');
            el.className = 'note note-enter';
            el.dataset.id = data.id;
            el.dataset.color = data.color || 'yellow';
            el.style.left = data.x + 'px';
            el.style.top = data.y + 'px';

            // --- 头部 ---
            const header = document.createElement('div');
            header.className = 'note-header';
            header.dataset.dragHandle = 'true';

            const time = document.createElement('span');
            time.className = 'note-time';
            const d = data.createdAt ? new Date(data.createdAt) : new Date();
            time.textContent = d.toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit', month: 'short',
                day: 'numeric' });

            const actions = document.createElement('div');
            actions.className = 'note-actions';

            // 颜色切换按钮
            const colorBtn = document.createElement('button');
            colorBtn.className = 'note-color-btn';
            colorBtn.title = '切换颜色';
            colorBtn.dataset.colorToggle = 'true';
            // 颜色用小圆点表示，背景色由父级控制

            // 删除按钮
            const delBtn = document.createElement('button');
            delBtn.className = 'note-delete';
            delBtn.innerHTML = '×';
            delBtn.title = '删除便签';
            delBtn.dataset.delete = 'true';

            actions.appendChild(colorBtn);
            actions.appendChild(delBtn);
            header.appendChild(time);
            header.appendChild(actions);

            // --- 内容 ---
            const content = document.createElement('div');
            content.className = 'note-content';
            content.contentEditable = true;
            content.textContent = data.content || '';
            content.dataset.content = 'true';

            el.appendChild(header);
            el.appendChild(content);

            // --- 事件绑定 ---
            // 删除
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteNote(data.id);
            });

            // 颜色切换（点击按钮）
            colorBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                cycleColor(data.id);
            });

            // 内容编辑 - 自动保存
            content.addEventListener('input', () => {
                updateNoteContent(data.id, content.textContent);
            });

            // 聚焦样式
            content.addEventListener('focus', () => {
                el.classList.add('focused');
                setActiveNote(data.id);
            });
            content.addEventListener('blur', () => {
                el.classList.remove('focused');
                // 内容已通过 input 保存
            });

            // 点击便签置顶
            el.addEventListener('mousedown', (e) => {
                // 如果点击的是可编辑区域或按钮，不处理置顶（但置顶由聚焦处理）
                if (e.target.closest('.note-content') || e.target.closest('button')) return;
                setActiveNote(data.id);
            });

            // --- 拖拽 ---
            // 只在 header 上拖拽
            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('button')) return;
                startDrag(e, data.id);
            });

            // 双击切换颜色
            el.addEventListener('dblclick', (e) => {
                // 如果双击的是内容区域，不触发颜色切换（避免干扰编辑）
                if (e.target.closest('.note-content')) return;
                cycleColor(data.id);
            });

            return el;
        }

        // ============================================================
        //  核心 CRUD
        // ============================================================
        function addNote(x, y, color, content) {
            const id = nextId++;
            const noteData = {
                id,
                content: content || '',
                x: x ?? (DEFAULT_POS.x + (Math.random() - 0.5) * SPREAD * 2),
                y: y ?? (DEFAULT_POS.y + (Math.random() - 0.5) * SPREAD * 2),
                color: color || 'yellow',
                createdAt: Date.now(),
            };
            notes.push(noteData);
            renderNote(noteData);
            saveData();
            updateUI();
            return id;
        }

        function deleteNote(id) {
            const idx = notes.findIndex(n => n.id === id);
            if (idx === -1) return;
            const el = container.querySelector(`.note[data-id="${id}"]`);
            if (el) {
                el.classList.remove('note-enter');
                el.classList.add('note-remove');
                setTimeout(() => {
                    if (el.parentNode) el.remove();
                }, 280);
            }
            notes.splice(idx, 1);
            saveData();
            updateUI();
            if (activeNoteId === id) activeNoteId = null;
        }

        function updateNoteContent(id, content) {
            const note = notes.find(n => n.id === id);
            if (!note) return;
            note.content = content;
            saveData();
        }

        function updateNotePosition(id, x, y) {
            const note = notes.find(n => n.id === id);
            if (!note) return;
            note.x = x;
            note.y = y;
            saveData();
        }

        function cycleColor(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;
            const idx = COLORS.indexOf(note.color);
            const next = (idx + 1) % COLORS.length;
            note.color = COLORS[next];
            const el = container.querySelector(`.note[data-id="${id}"]`);
            if (el) {
                el.dataset.color = note.color;
                el.classList.remove('note-color-flash');
                // 强制回流后添加动画
                void el.offsetWidth;
                el.classList.add('note-color-flash');
            }
            saveData();
        }

        function setActiveNote(id) {
            // 取消所有 active
            container.querySelectorAll('.note.active').forEach(el => el.classList.remove('active'));
            if (id !== undefined && id !== null) {
                const el = container.querySelector(`.note[data-id="${id}"]`);
                if (el) {
                    el.classList.add('active');
                    activeNoteId = id;
                }
            } else {
                activeNoteId = null;
            }
        }

        function clearAllNotes() {
            if (notes.length === 0) return;
            if (!confirm('确定要清空所有便签吗？')) return;
            const els = container.querySelectorAll('.note');
            els.forEach(el => {
                el.classList.remove('note-enter');
                el.classList.add('note-remove');
            });
            setTimeout(() => {
                els.forEach(el => {
                    if (el.parentNode) el.remove();
                });
                notes = [];
                saveData();
                updateUI();
                activeNoteId = null;
            }, 280);
        }

        // ============================================================
        //  渲染
        // ============================================================
        function renderNote(data) {
            const el = createNoteElement(data);
            container.appendChild(el);
            // 自动聚焦新便签的内容
            const content = el.querySelector('.note-content');
            if (content && !data.content) {
                setTimeout(() => {
                    content.focus();
                    // 选中全部内容
                    const range = document.createRange();
                    range.selectNodeContents(content);
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                }, 400);
            }
            setActiveNote(data.id);
        }

        function renderAllNotes() {
            // 清除所有便签 DOM（保留空状态提示）
            container.querySelectorAll('.note').forEach(el => el.remove());

            // 按创建时间排序（旧的在下，新的在上，但我们在UI中按id顺序）
            const sorted = [...notes].sort((a, b) => a.id - b.id);
            sorted.forEach(data => {
                const el = createNoteElement(data);
                container.appendChild(el);
                // 移除入场动画（避免刷新时全部弹入）
                el.classList.remove('note-enter');
            });

            if (notes.length > 0) {
                // 激活最后一个便签
                const last = notes[notes.length - 1];
                setActiveNote(last.id);
            } else {
                setActiveNote(null);
            }
            updateUI();
        }

        function updateUI() {
            const count = notes.length;
            noteCountEl.textContent = count + ' 张便签';
            emptyHint.style.display = count === 0 ? 'block' : 'none';
        }

        // ============================================================
        //  拖拽系统
        // ============================================================
        function startDrag(e, id) {
            if (e.button !== 0) return;
            const el = container.querySelector(`.note[data-id="${id}"]`);
            if (!el) return;

            // 防止选中文本
            e.preventDefault();

            const rect = el.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();

            dragState = {
                id,
                el,
                offsetX: e.clientX - rect.left,
                offsetY: e.clientY - rect.top,
                startX: parseInt(el.style.left) || 0,
                startY: parseInt(el.style.top) || 0,
                containerRect,
            };

            el.classList.add('dragging');
            setActiveNote(id);

            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('mouseup', onDragEnd);
        }

        function onDragMove(e) {
            if (!dragState) return;
            e.preventDefault();

            const { el, offsetX, offsetY, containerRect } = dragState;

            // 计算新位置（相对于容器）
            let x = e.clientX - containerRect.left - offsetX;
            let y = e.clientY - containerRect.top - offsetY;

            // 边界约束（防止完全拖出视野）
            const maxX = containerRect.width - parseInt(el.offsetWidth) - 10;
            const maxY = containerRect.height - parseInt(el.offsetHeight) - 10;
            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));

            el.style.left = x + 'px';
            el.style.top = y + 'px';
        }

        function onDragEnd(e) {
            if (!dragState) return;
            const { id, el } = dragState;

            el.classList.remove('dragging');

            // 保存最终位置
            const x = parseInt(el.style.left) || 0;
            const y = parseInt(el.style.top) || 0;
            updateNotePosition(id, x, y);

            document.removeEventListener('mousemove', onDragMove);
            document.removeEventListener('mouseup', onDragEnd);
            dragState = null;
        }

        // ============================================================
        //  窗口大小变化时，修正便签位置防止超出
        // ============================================================
        function clampNotesToView() {
            const containerRect = container.getBoundingClientRect();
            let changed = false;
            notes.forEach(note => {
                const el = container.querySelector(`.note[data-id="${note.id}"]`);
                if (!el) return;
                const w = el.offsetWidth;
                const h = el.offsetHeight;
                const maxX = containerRect.width - w - 10;
                const maxY = containerRect.height - h - 10;
                let nx = note.x,
                    ny = note.y;
                if (nx > maxX) nx = Math.max(0, maxX);
                if (ny > maxY) ny = Math.max(0, maxY);
                if (nx !== note.x || ny !== note.y) {
                    note.x = nx;
                    note.y = ny;
                    el.style.left = nx + 'px';
                    el.style.top = ny + 'px';
                    changed = true;
                }
            });
            if (changed) saveData();
        }

        // ============================================================
        //  快捷键
        // ============================================================
        function handleKeydown(e) {
            // Ctrl + N 新建
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                createNewNote();
            }
            // Escape 取消聚焦
            if (e.key === 'Escape') {
                const active = document.activeElement;
                if (active && active.closest('.note-content')) {
                    active.blur();
                }
            }
            // Delete / Backspace 在非编辑状态下删除选中的便签
            if ((e.key === 'Delete' || e.key === 'Backspace') && activeNoteId !== null) {
                const activeEl = container.querySelector(`.note[data-id="${activeNoteId}"]`);
                if (activeEl && !activeEl.contains(document.activeElement)) {
                    e.preventDefault();
                    deleteNote(activeNoteId);
                }
            }
        }

        // ============================================================
        //  创建新便签（智能定位）
        // ============================================================
        function createNewNote() {
            // 计算一个合适的位置：在屏幕中央区域分散
            const containerRect = container.getBoundingClientRect();
            const baseX = containerRect.width * 0.35 + (Math.random() - 0.5) * SPREAD * 1.5;
            const baseY = containerRect.height * 0.30 + (Math.random() - 0.5) * SPREAD * 1.5;
            const x = Math.max(20, Math.min(baseX, containerRect.width - 320));
            const y = Math.max(20, Math.min(baseY, containerRect.height - 200));
            const color = COLORS[Math.floor(Math.random() * COLORS.length)];
            addNote(x, y, color, '');
        }

        // ============================================================
        //  初始化
        // ============================================================
        function init() {
            loadData();
            renderAllNotes();

            // 如果没有便签，自动创建一个欢迎便签
            if (notes.length === 0) {
                const containerRect = container.getBoundingClientRect();
                const x = containerRect.width * 0.35;
                const y = containerRect.height * 0.30;
                addNote(x, y, 'yellow', '👋 欢迎使用灵感贴贴！\n双击便签切换颜色，拖拽移动位置。');
            }

            // 事件监听
            addBtn.addEventListener('click', createNewNote);
            clearBtn.addEventListener('click', clearAllNotes);

            // 点击空白区域取消激活
            container.addEventListener('mousedown', (e) => {
                if (e.target === container || e.target === emptyHint) {
                    setActiveNote(null);
                    // 取消所有编辑焦点
                    document.activeElement?.blur();
                }
            });

            // 键盘快捷键
            document.addEventListener('keydown', handleKeydown);

            // 窗口变化时修正位置
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(clampNotesToView, 300);
            });

            // 定期保存（额外安全）
            setInterval(() => {
                // 如果有拖拽状态，不保存（避免冲突）
                if (!dragState) {
                    // 确保所有内容已同步
                    saveData();
                }
            }, 30000);

            // 更新UI
            updateUI();

            console.log('📌 灵感贴贴已启动 — 按 Ctrl+N 新建便签');
        }

        // 等DOM完全加载后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
