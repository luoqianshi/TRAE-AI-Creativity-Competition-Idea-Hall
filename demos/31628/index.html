<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Echo - 重复与变化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: white;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d9ff, #ff6ec7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 1.1em;
            color: #8892b0;
            margin-bottom: 30px;
        }
        
        .upload-container {
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed #64ffda;
            border-radius: 20px;
            padding: 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
            width: 100%;
            max-width: 600px;
        }
        
        .upload-container:hover {
            background: rgba(100, 255, 218, 0.1);
            border-color: #00d9ff;
            transform: scale(1.02);
        }
        
        .upload-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
        
        .upload-text {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        
        .upload-hint {
            font-size: 0.9em;
            color: #8892b0;
        }
        
        #audio-file {
            display: none;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            background: linear-gradient(90deg, #00d9ff, #64ffda);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.4);
        }
        
        button:disabled {
            background: #8892b0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .visualization-container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        canvas {
            width: 100%;
            height: 300px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .info-panel {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .info-panel h2 {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #64ffda;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
        }
        
        .info-label {
            font-size: 0.85em;
            color: #8892b0;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 1.2em;
            font-weight: bold;
            color: #00d9ff;
        }
        
        .concept {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.1), rgba(255, 110, 199, 0.1));
            border-left: 4px solid #64ffda;
            padding: 25px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .concept h3 {
            color: #64ffda;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .concept p {
            color: #ccd6f6;
            line-height: 1.6;
            font-size: 0.95em;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(100, 255, 218, 0.2);
            border-top-color: #64ffda;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>Pattern Echo</h1>
    <p class="subtitle">看见音乐中的重复与变化</p>
    
    <div class="upload-container" onclick="document.getElementById('audio-file').click()">
        <div class="upload-icon">🎵</div>
        <div class="upload-text">上传音乐文件</div>
        <div class="upload-hint">支持 MP3, WAV, OGG 等格式</div>
    </div>
    <input type="file" id="audio-file" accept="audio/*">
    
    <div class="controls">
        <button id="play-btn" disabled>▶ 播放</button>
        <button id="pause-btn" disabled>⏸ 暂停</button>
        <button id="stop-btn" disabled>⏹ 停止</button>
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>正在分析音频...</div>
    </div>
    
    <div class="visualization-container">
        <canvas id="visualizer"></canvas>
    </div>
    
    <div class="info-panel">
        <h2>🎼 音频信息</h2>
        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">当前时间</div>
                <div class="info-value" id="current-time">0:00</div>
            </div>
            <div class="info-item">
                <div class="info-label">总时长</div>
                <div class="info-value" id="duration">0:00</div>
            </div>
            <div class="info-item">
                <div class="info-label">平均频率</div>
                <div class="info-value" id="avg-freq">-- Hz</div>
            </div>
            <div class="info-item">
                <div class="info-label">峰值频率</div>
                <div class="info-value" id="peak-freq">-- Hz</div>
            </div>
        </div>
    </div>
    
    <div class="concept">
        <h3>💡 核心理念</h3>
        <p>
            音乐是一种时间的艺术，而"重复与变化"是音乐最核心的美学原则。
            从巴赫的赋格到现代流行音乐，作曲家们都在运用这一原则创造令人难忘的作品。
            Pattern Echo 旨在让每个人都能"看见"音乐中的这些pattern，理解音乐为什么如此动听。
        </p>
    </div>

    <script>
        // Web Audio API 核心变量
        let audioContext;
        let analyser;
        let audioSource;
        let audioBuffer;
        let isPlaying = false;
        
        // Canvas 相关
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        
        // DOM 元素
        const fileInput = document.getElementById('audio-file');
        const playBtn = document.getElementById('play-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const stopBtn = document.getElementById('stop-btn');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const avgFreqEl = document.getElementById('avg-freq');
        const peakFreqEl = document.getElementById('peak-freq');
        const loadingEl = document.getElementById('loading');
        
        // 初始化 Canvas 尺寸
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth * window.devicePixelRatio;
            canvas.height = canvas.offsetHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // 文件选择处理
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            loadingEl.classList.add('show');
            
            try {
                // 初始化 Audio Context
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                // 解码音频文件
                const arrayBuffer = await file.arrayBuffer();
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                
                // 创建 Analyser
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.8;
                
                // 更新UI
                durationEl.textContent = formatTime(audioBuffer.duration);
                playBtn.disabled = false;
                
                loadingEl.classList.remove('show');
                alert(`✅ 音频加载成功！\n\n文件名：${file.name}\n时长：${formatTime(audioBuffer.duration)}\n\n点击"播放"开始可视化体验。`);
                
            } catch (error) {
                loadingEl.classList.remove('show');
                alert('❌ 音频加载失败，请尝试其他文件。');
                console.error(error);
            }
        });
        
        // 播放音频
        playBtn.addEventListener('click', () => {
            if (!audioBuffer) return;
            
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            // 停止之前的播放
            if (audioSource) {
                audioSource.stop();
            }
            
            // 创建新的音频源
            audioSource = audioContext.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.connect(analyser);
            analyser.connect(audioContext.destination);
            
            audioSource.start(0);
            isPlaying = true;
            
            playBtn.disabled = true;
            pauseBtn.disabled = false;
            stopBtn.disabled = false;
            
            // 开始可视化
            visualize();
            
            // 更新时间
            updateTime();
        });
        
        // 暂停音频
        pauseBtn.addEventListener('click', () => {
            if (audioContext.state === 'running') {
                audioContext.suspend();
                isPlaying = false;
                playBtn.disabled = false;
                pauseBtn.disabled = true;
            } else {
                audioContext.resume();
                isPlaying = true;
                playBtn.disabled = true;
                pauseBtn.disabled = false;
                visualize();
                updateTime();
            }
        });
        
        // 停止音频
        stopBtn.addEventListener('click', () => {
            if (audioSource) {
                audioSource.stop();
                isPlaying = false;
                playBtn.disabled = false;
                pauseBtn.disabled = true;
                stopBtn.disabled = true;
                currentTimeEl.textContent = '0:00';
                
                // 重绘空白
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });
        
        // 可视化函数
        function visualize() {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            function draw() {
                if (!isPlaying) return;
                
                requestAnimationFrame(draw);
                
                // 获取频率数据
                analyser.getByteFrequencyData(dataArray);
                
                // 清空画布
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 绘制频谱
                const barWidth = (canvas.offsetWidth / bufferLength) * 2.5;
                let x = 0;
                
                let sum = 0;
                let maxVal = 0;
                let maxIndex = 0;
                
                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = dataArray[i] * 1.5;
                    
                    // 渐变色
                    const hue = (i / bufferLength) * 60 + 180; // 从蓝到绿
                    ctx.fillStyle = `hsla(${hue}, 100%, 50%, ${0.8 + dataArray[i] / 512})`;
                    
                    // 绘制矩形
                    ctx.fillRect(x, canvas.offsetHeight - barHeight, barWidth - 2, barHeight);
                    
                    x += barWidth;
                    
                    // 计算统计数据
                    sum += dataArray[i];
                    if (dataArray[i] > maxVal) {
                        maxVal = dataArray[i];
                        maxIndex = i;
                    }
                }
                
                // 更新频率信息
                const avgFreq = Math.round(sum / bufferLength * 100);
                const sampleRate = audioContext.sampleRate;
                const peakFreq = Math.round(maxIndex * sampleRate / analyser.fftSize);
                
                avgFreqEl.textContent = avgFreq + ' Hz';
                peakFreqEl.textContent = peakFreq + ' Hz';
            }
            
            draw();
        }
        
        // 更新时间
        function updateTime() {
            if (!isPlaying) return;
            
            const currentTime = audioContext.currentTime;
            currentTimeEl.textContent = formatTime(currentTime);
            
            if (currentTime < audioBuffer.duration) {
                requestAnimationFrame(updateTime);
            } else {
                stopBtn.click();
            }
        }
        
        // 格式化时间
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
