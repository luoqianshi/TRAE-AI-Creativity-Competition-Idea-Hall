<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>超级准确的测试</title>
  <style>
    :root {
      --bg-1: #fff7ed;
      --bg-2: #ffe4e6;
      --card: rgba(255, 255, 255, 0.88);
      --text: #3f2a1d;
      --muted: #7c5b4a;
      --accent: #f97316;
      --accent-dark: #c2410c;
      --shadow: 0 24px 60px rgba(194, 65, 12, 0.18);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 18%, rgba(251, 146, 60, 0.34), transparent 28%),
        radial-gradient(circle at 88% 12%, rgba(244, 114, 182, 0.26), transparent 32%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(960px, 100%);
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
      position: relative;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, rgba(255,255,255,0.45), transparent 42%);
      pointer-events: none;
    }

    header {
      padding: 42px 44px 22px;
      position: relative;
      z-index: 1;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #ffedd5;
      color: var(--accent-dark);
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.05;
      letter-spacing: -1.5px;
    }

    .subtitle {
      max-width: 620px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
      margin: 18px 0 0;
    }

    main {
      padding: 22px 44px 44px;
      position: relative;
      z-index: 1;
    }

    .panel {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 28px;
    }

    .start-area {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 22px;
      align-items: center;
    }

    .food-cloud {
      min-height: 220px;
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(255, 237, 213, 0.78), rgba(254, 205, 211, 0.64));
      display: grid;
      place-items: center;
      padding: 22px;
      font-size: 56px;
      letter-spacing: 8px;
      text-align: center;
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 22px;
      padding: 16px 26px;
      border-radius: 999px;
      background: linear-gradient(135deg, #fb923c, #f43f5e);
      color: white;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 14px 28px rgba(244, 63, 94, 0.24);
    }

    .primary-btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
      box-shadow: none;
    }

    .primary-btn:hover,
    .food-card:hover {
      transform: translateY(-3px);
    }

    .progress-wrap {
      margin-bottom: 22px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .progress {
      height: 12px;
      background: #ffedd5;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #fb923c, #f43f5e);
      border-radius: inherit;
      transition: width 0.35s ease;
    }

    .question {
      font-size: clamp(24px, 4vw, 36px);
      margin: 0 0 20px;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .food-card {
      min-height: 190px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 14px 28px rgba(124, 91, 74, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }

    .food-card.selected {
      outline: 4px solid rgba(249, 115, 22, 0.35);
      background: #fff7ed;
      box-shadow: 0 16px 34px rgba(249, 115, 22, 0.2);
      transform: translateY(-3px);
    }

    .emoji {
      font-size: 62px;
      margin-bottom: 14px;
    }

    .food-name {
      font-size: 22px;
      font-weight: 900;
    }

    .category-badge {
      margin-top: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #ffedd5;
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .category-summary {
      display: grid;
      gap: 16px;
      padding: 22px;
      border-radius: 24px;
      background: linear-gradient(135deg, #fff7ed, #ffe4e6);
    }

    .category-summary h3 {
      margin: 0;
      font-size: 24px;
    }

    .pie-layout {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 20px;
      align-items: center;
    }

    .pie-chart {
      width: 180px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #ffedd5;
      box-shadow: inset 0 0 0 14px rgba(255, 255, 255, 0.72);
    }

    .legend {
      display: grid;
      gap: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-weight: 800;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .summary-text {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.8;
    }

    .result {
      display: grid;
      gap: 18px;
    }

    .result-title {
      font-size: clamp(28px, 4vw, 44px);
      margin: 0;
    }

    .chosen-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 4px 0 0;
      padding: 0;
      list-style: none;
    }

    .chosen-list li {
      padding: 10px 14px;
      border-radius: 999px;
      background: #ffedd5;
      color: var(--accent-dark);
      font-weight: 800;
    }

    .chosen-list .category-badge {
      margin: 0 0 0 6px;
      background: rgba(255, 255, 255, 0.72);
    }

    .secondary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      padding: 13px 20px;
      border-radius: 999px;
      background: #fff7ed;
      color: var(--accent-dark);
      border: 2px solid #fed7aa;
      font-size: 16px;
      font-weight: 900;
    }

    .secondary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(194, 65, 12, 0.12);
    }

    .details {
      display: grid;
      gap: 12px;
    }

    .detail-card {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(254, 215, 170, 0.9);
      border-radius: 20px;
      padding: 16px 18px;
      line-height: 1.7;
    }

    .detail-card strong {
      display: block;
      color: var(--text);
      font-size: 18px;
      margin-bottom: 4px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 760px) {
      body {
        padding: 14px;
      }

      header,
      main {
        padding-left: 22px;
        padding-right: 22px;
      }

      .start-area,
      .options,
      .pie-layout {
        grid-template-columns: 1fr;
      }

      .food-cloud {
        min-height: 150px;
        font-size: 42px;
      }
    }
  </style>
</head>
<body>
  <section class="app" aria-live="polite">
    <header>
      <div class="tag">🍽️ 食物测试研究所</div>
      <h1>超级准确的测试</h1>
      <p class="subtitle">点击开始后，先选择性别和年龄，再进行 8 轮单选食物题。题库里混入了不同分类的奇特选项，完成后系统会总结你的选择。</p>
    </header>

    <main>
      <section id="startScreen" class="panel start-area">
        <div>
          <h2 class="question">准备好开始测试了吗？</h2>
          <p class="subtitle">不用纠结太久，凭第一感觉选择就好。你的胃，可能比你更了解你自己。</p>
          <button id="startBtn" class="primary-btn" type="button">开始测试 →</button>
        </div>
        <div class="food-cloud" aria-hidden="true">🍕 🍜 🍰 🍣 🥗 🍔</div>
      </section>

      <section id="quizScreen" class="panel hidden">
        <div class="progress-wrap">
          <div class="progress-top">
            <span id="roundText">第 1 / 10 题</span>
            <span id="stepHint">先选择基础信息</span>
          </div>
          <div class="progress">
            <div id="bar" class="bar"></div>
          </div>
        </div>
        <h2 id="questionTitle" class="question">请选择你的性别</h2>
        <div id="options" class="options"></div>
        <button id="nextBtn" class="primary-btn hidden" type="button" disabled>进入下一题 →</button>
      </section>

      <section id="resultScreen" class="panel result hidden">
        <h2 id="resultTitle" class="result-title">测试完成</h2>
        <div>
          <p id="resultIntro" class="subtitle">你最喜欢吃这些食物：</p>
          <ul id="chosenList" class="chosen-list"></ul>
        </div>
        <div id="categoryPanel" class="category-summary hidden">
          <h3>分类占比</h3>
          <div class="pie-layout">
            <div id="pieChart" class="pie-chart" aria-label="分类占比饼状图"></div>
            <div id="categoryLegend" class="legend"></div>
          </div>
          <p id="categorySummary" class="summary-text"></p>
        </div>
        <button id="detailBtn" class="secondary-btn hidden" type="button">查看详情</button>
        <div id="detailPanel" class="details hidden"></div>
        <button id="restartBtn" class="primary-btn" type="button">再测一次 →</button>
      </section>
    </main>
  </section>

  <script>
    const profileSteps = [
      {
        key: "gender",
        question: "请选择你的性别",
        hint: "选择性别",
        options: [
          { name: "男", emoji: "👦", value: "male" },
          { name: "女", emoji: "👧", value: "female" },
          { name: "其他", emoji: "✨", value: "expandOther" }
        ]
      },
      {
        key: "age",
        question: "请选择你的年龄",
        hint: "选择年龄",
        options: [
          { name: "12 岁及以下", emoji: "🧒", value: "child" },
          { name: "13-17 岁", emoji: "🎒", value: "teen" },
          { name: "18-29 岁", emoji: "🌟", value: "young" },
          { name: "30-49 岁", emoji: "💼", value: "middle" },
          { name: "50 岁及以上", emoji: "🌻", value: "senior" }
        ]
      }
    ];

    const otherGenderOptions = [
      { name: "外星人", emoji: "👽", value: "alien" },
      { name: "沃尔玛购物袋", emoji: "🛍️", value: "bag" },
      { name: "武装直升机", emoji: "🚁", value: "helicopter" },
      { name: "会说话的冰箱", emoji: "🧊", value: "talkingFridge" },
      { name: "以上都不是", emoji: "❓", value: "noneOfAbove" }
    ];

    const rounds = [
      [
        { name: "火锅", emoji: "🍲", category: "食物类" },
        { name: "寿司", emoji: "🍣", category: "食物类" },
        { name: "炸鸡", emoji: "🍗", category: "食物类" },
        { name: "猫", emoji: "🐱", category: "生物类" },
        { name: "纸张", emoji: "📄", category: "文具类" },
        { name: "钢筋混凝土", emoji: "🏗️", category: "材料类" }
      ],
      [
        { name: "奶茶", emoji: "🧋", category: "食物类" },
        { name: "沙拉", emoji: "🥗", category: "食物类" },
        { name: "拉面", emoji: "🍜", category: "食物类" },
        { name: "狗", emoji: "🐶", category: "生物类" },
        { name: "洗衣液", emoji: "🧴", category: "生活用品类" },
        { name: "月亮", emoji: "🌕", category: "天体类" }
      ],
      [
        { name: "披萨", emoji: "🍕", category: "食物类" },
        { name: "蛋糕", emoji: "🍰", category: "食物类" },
        { name: "牛排", emoji: "🥩", category: "食物类" },
        { name: "人类", emoji: "🧍", category: "生物类" },
        { name: "橡皮擦", emoji: "🧽", category: "文具类" },
        { name: "键盘", emoji: "⌨️", category: "数码类" }
      ],
      [
        { name: "汉堡", emoji: "🍔", category: "食物类" },
        { name: "饺子", emoji: "🥟", category: "食物类" },
        { name: "咖喱饭", emoji: "🍛", category: "食物类" },
        { name: "袜子", emoji: "🧦", category: "生活用品类" },
        { name: "砖头", emoji: "🧱", category: "材料类" },
        { name: "说明书", emoji: "📘", category: "文具类" }
      ],
      [
        { name: "冰淇淋", emoji: "🍦", category: "食物类" },
        { name: "烤串", emoji: "🍢", category: "食物类" },
        { name: "水果", emoji: "🍓", category: "食物类" },
        { name: "太阳", emoji: "☀️", category: "天体类" },
        { name: "沙发", emoji: "🛋️", category: "家具类" },
        { name: "铅笔", emoji: "✏️", category: "文具类" }
      ],
      [
        { name: "巧克力", emoji: "🍫", category: "食物类" },
        { name: "苹果派", emoji: "🥧", category: "食物类" },
        { name: "粥", emoji: "🥣", category: "食物类" },
        { name: "仙人掌", emoji: "🌵", category: "植物类" },
        { name: "螺丝钉", emoji: "🔩", category: "材料类" },
        { name: "雨云", emoji: "🌧️", category: "自然现象类" }
      ],
      [
        { name: "麻辣香锅", emoji: "🥘", category: "食物类" },
        { name: "三明治", emoji: "🥪", category: "食物类" },
        { name: "布丁", emoji: "🍮", category: "食物类" },
        { name: "拖鞋", emoji: "🩴", category: "生活用品类" },
        { name: "冰箱", emoji: "🧊", category: "家电类" },
        { name: "彗星", emoji: "☄️", category: "天体类" }
      ],
      [
        { name: "小笼包", emoji: "🥟", category: "食物类" },
        { name: "薯条", emoji: "🍟", category: "食物类" },
        { name: "玉米", emoji: "🌽", category: "食物类" },
        { name: "章鱼", emoji: "🐙", category: "生物类" },
        { name: "马克杯", emoji: "☕", category: "生活用品类" },
        { name: "飞船", emoji: "🛸", category: "交通工具类" }
      ]
    ];

    const allFoodItems = rounds.flat();

    const startScreen = document.querySelector("#startScreen");
    const quizScreen = document.querySelector("#quizScreen");
    const resultScreen = document.querySelector("#resultScreen");
    const optionsEl = document.querySelector("#options");
    const roundText = document.querySelector("#roundText");
    const stepHint = document.querySelector("#stepHint");
    const questionTitle = document.querySelector("#questionTitle");
    const bar = document.querySelector("#bar");
    const resultTitle = document.querySelector("#resultTitle");
    const resultIntro = document.querySelector("#resultIntro");
    const chosenList = document.querySelector("#chosenList");
    const categoryPanel = document.querySelector("#categoryPanel");
    const pieChart = document.querySelector("#pieChart");
    const categoryLegend = document.querySelector("#categoryLegend");
    const categorySummary = document.querySelector("#categorySummary");
    const detailBtn = document.querySelector("#detailBtn");
    const detailPanel = document.querySelector("#detailPanel");
    const nextBtn = document.querySelector("#nextBtn");
    const startBtn = document.querySelector("#startBtn");
    const restartBtn = document.querySelector("#restartBtn");

    let currentStep = 0;
    let choices = [];
    let profile = {
      gender: "male",
      age: "teen"
    };
    let currentLikedFoods = [];
    let genderOtherExpanded = false;
    let displayedFoodNames = new Set();
    let extraRoundsRemaining = 0;
    let requestedExtraRounds = 0;

    function showScreen(screen) {
      [startScreen, quizScreen, resultScreen].forEach(item => item.classList.add("hidden"));
      screen.classList.remove("hidden");
    }

    function updateProgress() {
      const total = profileSteps.length + rounds.length;
      roundText.textContent = `第 ${currentStep + 1} / ${total} 题`;
      bar.style.width = `${(currentStep / total) * 100}%`;
    }

    function renderStep() {
      updateProgress();
      optionsEl.innerHTML = "";

      if (currentStep < profileSteps.length) {
        renderProfileStep();
      } else {
        renderFoodRound();
      }
    }

    function renderProfileStep() {
      const step = profileSteps[currentStep];
      questionTitle.textContent = step.question;
      stepHint.textContent = step.hint;
      nextBtn.classList.add("hidden");
      nextBtn.disabled = true;

      const options = step.key === "gender" && genderOtherExpanded
        ? [...step.options, ...otherGenderOptions]
        : step.options;

      options.forEach(option => {
        const button = document.createElement("button");
        button.className = "food-card";
        button.type = "button";
        button.innerHTML = `
          <span class="emoji">${option.emoji}</span>
          <span class="food-name">${option.name}</span>
        `;
        button.addEventListener("click", () => chooseProfile(option));
        optionsEl.appendChild(button);
      });
    }

    function getRandomItems(items, count) {
      return [...items]
        .sort(() => Math.random() - 0.5)
        .slice(0, count);
    }

    function renderFoodRound() {
      const foodRoundIndex = currentStep - profileSteps.length;
      const foods = getRandomItems(rounds[foodRoundIndex], 3);
      markFoodsAsDisplayed(foods);

      questionTitle.textContent = "下面这些里面，你最喜欢吃哪一个？";
      stepHint.textContent = "食物题为单选，点击后进入下一题";
      nextBtn.classList.add("hidden");
      nextBtn.disabled = true;

      foods.forEach(food => {
        const button = document.createElement("button");
        button.className = "food-card";
        button.type = "button";
        button.innerHTML = `
          <span class="emoji">${food.emoji}</span>
          <span class="food-name">${food.name}</span>
        `;
        button.addEventListener("click", () => chooseFood(food));
        optionsEl.appendChild(button);
      });

      const dislikeButton = document.createElement("button");
      dislikeButton.className = "food-card";
      dislikeButton.type = "button";
      dislikeButton.innerHTML = `
        <span class="emoji">🙅</span>
        <span class="food-name">都不喜欢</span>
      `;
      dislikeButton.addEventListener("click", () => chooseFood({
        name: "都不喜欢",
        emoji: "🙅",
        category: "无"
      }));
      optionsEl.appendChild(dislikeButton);
    }

    function markFoodsAsDisplayed(foods) {
      foods.forEach(food => displayedFoodNames.add(food.name));
    }

    function getRemainingFoodItems() {
      return allFoodItems.filter(food => !displayedFoodNames.has(food.name));
    }

    function renderNeedMoreQuestion() {
      const remainingCount = getRemainingFoodItems().length;

      if (remainingCount === 0) {
        showResult();
        return;
      }

      roundText.textContent = "基础题完成";
      stepHint.textContent = `题库还剩 ${remainingCount} 个未展示选项`;
      bar.style.width = "100%";
      questionTitle.textContent = "是否需要再多答几题？";
      optionsEl.innerHTML = "";
      nextBtn.classList.add("hidden");
      nextBtn.disabled = true;

      [
        { name: "需要", emoji: "✅", action: renderExtraCountQuestion },
        { name: "不需要", emoji: "🙅", action: showResult }
      ].forEach(option => {
        const button = document.createElement("button");
        button.className = "food-card";
        button.type = "button";
        button.innerHTML = `
          <span class="emoji">${option.emoji}</span>
          <span class="food-name">${option.name}</span>
        `;
        button.addEventListener("click", option.action);
        optionsEl.appendChild(button);
      });
    }

    function renderExtraCountQuestion() {
      const remainingCount = getRemainingFoodItems().length;
      const maxRounds = Math.ceil(remainingCount / 3);

      roundText.textContent = "选择追加轮次";
      stepHint.textContent = `最多还能追加 ${maxRounds} 轮`;
      questionTitle.textContent = "你需要多答几轮？";
      optionsEl.innerHTML = "";

      Array.from({ length: maxRounds }, (_, index) => index + 1).forEach(count => {
        const button = document.createElement("button");
        button.className = "food-card";
        button.type = "button";
        button.innerHTML = `
          <span class="emoji">➕</span>
          <span class="food-name">${count} 轮</span>
        `;
        button.addEventListener("click", () => startExtraRounds(count));
        optionsEl.appendChild(button);
      });
    }

    function startExtraRounds(count) {
      extraRoundsRemaining = count;
      requestedExtraRounds = count;
      renderExtraFoodRound();
    }

    function renderExtraFoodRound() {
      const remainingItems = getRemainingFoodItems();

      if (remainingItems.length === 0) {
        showResult();
        return;
      }

      const foods = getRandomItems(remainingItems, Math.min(3, remainingItems.length));
      const currentExtraRound = requestedExtraRounds - extraRoundsRemaining + 1;
      markFoodsAsDisplayed(foods);

      roundText.textContent = `追加第 ${currentExtraRound} / ${requestedExtraRounds} 轮`;
      stepHint.textContent = `剩余未展示选项 ${getRemainingFoodItems().length} 个`;
      questionTitle.textContent = "下面这些里面，你最喜欢吃哪一个？";
      optionsEl.innerHTML = "";
      nextBtn.classList.add("hidden");
      nextBtn.disabled = true;

      foods.forEach(food => {
        const button = document.createElement("button");
        button.className = "food-card";
        button.type = "button";
        button.innerHTML = `
          <span class="emoji">${food.emoji}</span>
          <span class="food-name">${food.name}</span>
        `;
        button.addEventListener("click", () => chooseFood(food));
        optionsEl.appendChild(button);
      });

      const dislikeButton = document.createElement("button");
      dislikeButton.className = "food-card";
      dislikeButton.type = "button";
      dislikeButton.innerHTML = `
        <span class="emoji">🙅</span>
        <span class="food-name">都不喜欢</span>
      `;
      dislikeButton.addEventListener("click", () => chooseFood({
        name: "都不喜欢",
        emoji: "🙅",
        category: "无"
      }));
      optionsEl.appendChild(dislikeButton);
    }

    function goNextStep() {
      currentStep += 1;

      if (currentStep >= profileSteps.length + rounds.length) {
        renderNeedMoreQuestion();
      } else {
        renderStep();
      }
    }

    function chooseProfile(option) {
      const step = profileSteps[currentStep];
      if (step.key === "gender" && option.value === "expandOther") {
        genderOtherExpanded = true;
        optionsEl.innerHTML = "";
        renderProfileStep();
        return;
      }

      profile[step.key] = option.value;
      goNextStep();
    }

    function chooseFood(food) {
      choices.push(food);

      if (currentStep < profileSteps.length + rounds.length) {
        goNextStep();
        return;
      }

      extraRoundsRemaining -= 1;

      if (getRemainingFoodItems().length === 0) {
        showResult();
      } else if (extraRoundsRemaining > 0) {
        renderExtraFoodRound();
      } else {
        renderNeedMoreQuestion();
      }
    }

      const yellowFaces = [

      const categoryComments = {
        "食物类": "这是一个靠谱又让人安心的选择，说明你的快乐来源非常稳定。",
        "生物类": "这个选择生命力很强，但系统建议先和它培养感情，不要直接上桌。",

    function renderDetails() {
      detailPanel.innerHTML = "";

      currentLikedFoods.forEach(food => {
        const item = document.createElement("div");
        item.className = "detail-card";
        item.innerHTML = `
          <strong>${food.emoji} ${food.name} · ${food.category}</strong>
          <span>${getFoodComment(food)}</span>
        `;
        detailPanel.appendChild(item);
      });
    }

    function toggleDetails() {
      const shouldShow = detailPanel.classList.contains("hidden");

      if (shouldShow) {
        renderDetails();
        detailPanel.classList.remove("hidden");
        detailBtn.textContent = "收起详情";
      } else {
        detailPanel.classList.add("hidden");
        detailBtn.textContent = "查看详情";
      }
    }

    function getCategoryStats(foods) {
      return foods.reduce((stats, food) => {
        stats[food.category] = (stats[food.category] || 0) + 1;
        return stats;
      }, {});
    }

    function getCategoryColor(category, index) {
      const colors = {
        "食物类": "#fb923c",
        "生物类": "#22c55e",
        "文具类": "#3b82f6",
        "材料类": "#64748b",
        "生活用品类": "#ec4899",
        "天体类": "#a855f7",
        "数码类": "#06b6d4",
        "家具类": "#f59e0b",
        "植物类": "#84cc16",
        "自然现象类": "#38bdf8",
        "家电类": "#6366f1",
        "交通工具类": "#ef4444"
      };
      const fallback = ["#fb7185", "#14b8a6", "#eab308", "#8b5cf6", "#f97316"];
      return colors[category] || fallback[index % fallback.length];
    }

    function renderCategoryChart(foods) {
      const stats = getCategoryStats(foods);
      const entries = Object.entries(stats).sort((a, b) => b[1] - a[1]);
      const total = foods.length;
      let start = 0;

      pieChart.style.background = entries.length
        ? `conic-gradient(${entries.map(([category, count], index) => {
            const degrees = (count / total) * 360;
            const end = start + degrees;
            const segment = `${getCategoryColor(category, index)} ${start}deg ${end}deg`;
            start = end;
            return segment;
          }).join(", ")})`
        : "#ffedd5";

      categoryLegend.innerHTML = "";
      entries.forEach(([category, count], index) => {
        const percent = Math.round((count / total) * 100);
        const item = document.createElement("div");
        item.className = "legend-item";
        item.innerHTML = `
          <span class="legend-color" style="background:${getCategoryColor(category, index)}"></span>
          <span>${category}：${count} 个，占 ${percent}%</span>
        `;
        categoryLegend.appendChild(item);
      });

      categorySummary.textContent = `${getCategorySummary(entries, total)} ${getIdentitySummary(foods)}`;
    }

    function getIdentitySummary(foods) {
      const foodCount = foods.filter(food => food.category === "食物类").length;
      const weirdCount = foods.length - foodCount;
      const weirdRatio = weirdCount / foods.length;
      const title = getUserTitle();

      if (profile.gender === "alien") {
        return `作为${title}，你能同时消化地球美食和奇怪物件，外星朋友的胃口果然值得尊敬。`;
      }

      if (profile.gender === "helicopter") {
        return `作为${title}，你的选择路线非常飘逸，系统怀疑你是一边悬停一边点餐，驾驶技术相当稳定。`;
      }

      if (profile.gender === "bag") {
        return `作为${title}，你装下了这么多选择，系统只担心最后会不会真的拿不动。`;
      }

      if (profile.gender === "talkingFridge") {
        return `作为${title}，你不是在选择食物，你是在思考哪些东西值得被冷藏。`;
      }

      if (profile.gender === "noneOfAbove") {
        return `作为${title}，你已经超出了普通分类学范围，系统选择先鼓掌，再慢慢理解。`;
      }

      if (["male", "female"].includes(profile.gender) && weirdRatio >= 0.5) {
        return `不过你明明选择了正常性别，却挑了这么多奇特选项，系统开始认真怀疑你的人类身份。`;
      }

      if (["male", "female"].includes(profile.gender)) {
        return `整体来看，你的人类身份暂时安全，虽然菜单里偶尔出现了一点离谱小火花。`;
      }

      return `你的身份和口味都很难预测，系统认为这份结果非常有研究价值。`;
    }

    function getCategorySummary(entries, total) {
      const [topCategory, topCount] = entries[0];
      const topPercent = Math.round((topCount / total) * 100);
      const foodCount = entries.find(([category]) => category === "食物类")?.[1] || 0;
      const weirdCount = total - foodCount;
      const specialSummaries = {
        "食物类": `你的选择里有 ${topPercent}% 都是正经食物，系统非常欣慰：你不是来拆菜单的，你是真的来吃饭的。`,
        "生物类": `你的选择里${topCategory}特别多，系统建议你先确认它们愿不愿意成为晚餐，这份口味有点野性但很有生命力。`,
        "文具类": `你的${topCategory}占比高达 ${topPercent}%，看得出来你很爱学习，只是学习资料不一定适合蘸酱吃。`,
        "材料类": `你的${topCategory}选择明显偏多，系统判断你不是饿了，你可能是准备承包一个工地。`,
        "生活用品类": `你的${topCategory}占比很高，居家感直接拉满，但这些东西通常负责服务生活，不负责成为夜宵。`,
        "天体类": `你的${topCategory}选择特别突出，别人点餐看菜单，你点餐看星图，想象力已经进入太空轨道。`,
        "数码类": `你的${topCategory}偏好很明显，科技感很强，但请记住：胃不支持 USB-C 输入。`,
        "家具类": `你的${topCategory}占比很高，系统认为你可能不是想吃东西，而是想找个舒服地方躺下。`,
        "植物类": `你的${topCategory}特别突出，整体很自然，但建议先区分“可食用”和“看起来很绿色”。`,
        "自然现象类": `你的${topCategory}选择偏多，口味非常诗意，就是厨师可能不知道怎么把天气端上桌。`,
        "家电类": `你的${topCategory}占比很高，这说明你格局很大，已经不满足于吃食物，而是想吃保存食物的设备。`,
        "交通工具类": `你的${topCategory}特别多，这顿饭可能还没开吃，已经准备出发了。`
      };

      if (topCount >= Math.ceil(total * 0.5)) {
        return specialSummaries[topCategory] || `你的选择有 ${topPercent}% 集中在${topCategory}，这个偏好非常明显，系统已经记在小本本上了。`;
      }

      if (weirdCount === 0) {
        return `你的选择 ${topPercent}% 集中在${topCategory}，整体非常靠谱，是一个认真吃饭、快乐生活的优秀样本。`;
      }

      if (foodCount === 0) {
        return `你的选择完全避开了传统食物，系统怀疑你不是来点餐的，而是来给宇宙万物重新分类的。`;
      }

      if (weirdCount > foodCount) {
        return `你的奇特选项比正常食物还多，主打一个“胃口不一定大，但想象力一定很大”。`;
      }

      return `你的选择以${topCategory}为主，同时混入了 ${weirdCount} 个奇特选项，说明你既懂得享受美食，也愿意让菜单保持一点离谱的幽默感。`;
    }

    function showResult() {
      bar.style.width = "100%";
      chosenList.innerHTML = "";
      categoryLegend.innerHTML = "";
      categorySummary.textContent = "";
      detailPanel.innerHTML = "";
      detailPanel.classList.add("hidden");
      detailBtn.textContent = "查看详情";
      const likedFoods = choices.filter(food => food.name !== "都不喜欢");
      currentLikedFoods = likedFoods;
      const userTitle = getUserTitle();
      const yellowFace = getRandomYellowFace();

      if (likedFoods.length === 0) {
        resultTitle.textContent = `你是一个挑食的${userTitle} ${yellowFace}`;
        resultIntro.classList.add("hidden");
        chosenList.classList.add("hidden");
        categoryPanel.classList.add("hidden");
        detailBtn.classList.add("hidden");
        showScreen(resultScreen);
        return;
      }

      const likedFoodNames = likedFoods.map(food => food.name).join("、");
      resultTitle.textContent = `你是一个喜欢${likedFoodNames}的${userTitle} ${yellowFace}`;
      resultIntro.classList.remove("hidden");
      chosenList.classList.remove("hidden");
      categoryPanel.classList.remove("hidden");
      detailBtn.classList.remove("hidden");
      renderCategoryChart(likedFoods);

      likedFoods.forEach(food => {
        const item = document.createElement("li");
        item.textContent = `${food.emoji} ${food.name}`;
        chosenList.appendChild(item);
      });

      showScreen(resultScreen);
    }

    function startQuiz() {
      currentStep = 0;
      choices = [];
      currentLikedFoods = [];
      categoryPanel.classList.add("hidden");
      genderOtherExpanded = false;
      displayedFoodNames = new Set();
      extraRoundsRemaining = 0;
      requestedExtraRounds = 0;
      profile = {
        gender: "male",
        age: "teen"
      };
      showScreen(quizScreen);
      renderStep();
    }

    startBtn.addEventListener("click", startQuiz);
    detailBtn.addEventListener("click", toggleDetails);
    restartBtn.addEventListener("click", startQuiz);
  </script>
</body>
