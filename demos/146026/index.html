<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>潜入营救：第一关</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app">
    <section id="menu" class="screen screen-active">
      <div class="poster">
        <p class="eyebrow">单人 · 3D潜入任务原型</p>
        <h1>潜入营救</h1>
        <p class="summary">从敌营外侧树林出发，在 7 分钟内潜入营地、找到证人并安全撤离。按 Tab 查看任务简报，越高难度信息越少，甚至可能出现偏差。</p>
        <div class="menu-actions">
          <button id="startBtn" class="primary">开始游戏</button>
          <button id="achieveBtn">成就库</button>
          <button id="medalBtn">勋章屋</button>
          <button id="settingsBtn">设置</button>
        </div>
      </div>
      <div class="radar-panel" aria-label="任务预览">
        <div class="radar-sweep"></div>
        <div class="radar-dot d1"></div>
        <div class="radar-dot d2"></div>
        <div class="radar-dot d3"></div>
        <p>任务代号<br><strong>FOREST ENTRY</strong></p>
      </div>
    </section>

    <section id="difficulty" class="screen">
      <div class="difficulty-wrap">
        <p class="eyebrow">选择难度与默认人称</p>
        <h2>信息越少，越接近真实潜入</h2>
        <div class="difficulty-grid">
          <button class="difficulty-card" data-difficulty="easy">
            <span>简单模式</span>
            <strong>第三人称</strong>
            <small>完整简报，无偏差；拥有消音手枪和击晕能力。</small>
          </button>
          <button class="difficulty-card" data-difficulty="normal">
            <span>普通模式</span>
            <strong>第一视角</strong>
            <small>简报可能有轻微偏差；更窄视野，强调潜入路线。</small>
          </button>
          <button class="difficulty-card" data-difficulty="hard">
            <span>困难模式</span>
            <strong>第二人称</strong>
            <small>信息较少；通过敌人、证人、监控视角观察自己。</small>
          </button>
        </div>
        <button id="backMenuBtn" class="ghost">返回首页</button>
      </div>
    </section>

    <section id="game" class="screen">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>

      <div class="hud top-left">
        <div class="hud-title">第一关：证人撤离</div>
        <div id="objective">潜入敌营，寻找证人</div>
      </div>

      <div class="hud top-right">
        <div class="timer" id="timer">07:00</div>
        <div id="alertText" class="alert-state">未警戒</div>
      </div>

      <div class="hud bottom-left">
        <div>移动：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div>
        <div>简报：<kbd>Tab</kbd> 互动：<kbd>E</kbd> 击晕：<kbd>F</kbd> 干扰：<kbd>Q</kbd></div>
        <div id="perspectiveHint">视角：第三人称</div>
      </div>

      <div class="hud bottom-right">
        <div id="resourceText">道具准备中</div>
        <button id="pauseBtn">暂停</button>
      </div>

      <aside id="briefing" class="briefing hidden">
        <div class="briefing-head">
          <div>
            <p class="eyebrow">任务简报 · Tab</p>
            <h2>敌营情报</h2>
          </div>
          <button id="closeBriefing">关闭</button>
        </div>
        <div id="briefingContent"></div>
      </aside>

      <aside id="result" class="result hidden">
        <p class="eyebrow" id="resultKicker">任务结束</p>
        <h2 id="resultTitle">任务完成</h2>
        <p id="resultDesc"></p>
        <div class="result-actions">
          <button id="retryBtn" class="primary">重新开始</button>
          <button id="resultMenuBtn">返回首页</button>
        </div>
      </aside>
    </section>

    <section id="panel" class="screen">
      <div class="panel-wrap">
        <p class="eyebrow" id="panelKicker">资料库</p>
        <h2 id="panelTitle">成就库</h2>
        <div id="panelContent" class="panel-content"></div>
        <button id="panelBackBtn" class="primary">返回首页</button>
      </div>
    </section>
  </main>

  <script src="./game.js"></script>
</body>
</html>
