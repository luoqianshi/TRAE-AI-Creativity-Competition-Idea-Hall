<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>觅音 — 寻找心灵角落的声音</title>
    <style>
        /* ========== 全局样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');

        body {
            font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
            background: linear-gradient(135deg, #FFF8F0 0%, #FFE8D6 50%, #F5E6D3 100%);
            min-height: 100vh;
            color: #5D4E37;
            overflow-x: hidden;
        }

        /* ========== 浮动粒子 ========== */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: float-up linear infinite;
            opacity: 0;
        }
        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ========== 页面容器 ========== */
        .page {
            display: none;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            animation: fadeIn 0.6s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 首页 ========== */
        .home-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 30px;
            animation: breathe 4s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .logo-text {
            font-size: 52px;
            font-weight: 700;
            background: linear-gradient(135deg, #E8A87C 0%, #D4845E 50%, #C4704B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 12px;
        }

        .home-theme {
            font-size: 13px;
            color: #C4B8A8;
            letter-spacing: 3px;
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeUp 0.8s ease 0.2s forwards;
        }
        .tagline {
            font-size: 18px;
            color: #A89279;
            margin-bottom: 12px;
            letter-spacing: 4px;
            font-weight: 400;
            opacity: 0;
            animation: fadeUp 0.8s ease 0.3s forwards;
        }
        .home-desc {
            max-width: 420px;
            font-size: 15px;
            color: #8B7355;
            line-height: 2.2;
            margin-bottom: 50px;
            opacity: 0;
            animation: fadeUp 1s ease 0.5s forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            display: inline-block;
            padding: 16px 48px;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
        }
        .btn:active::after {
            width: 300px; height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #E8A87C 0%, #D4845E 100%);
            color: #fff;
            box-shadow: 0 4px 20px rgba(212, 132, 94, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(212, 132, 94, 0.4);
        }

        .btn-secondary {
            background: rgba(232, 168, 124, 0.15);
            color: #C4704B;
            margin-left: 12px;
        }
        .btn-secondary:hover {
            background: rgba(232, 168, 124, 0.25);
            transform: translateY(-2px);
        }

        .btn-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* ========== 创建/加入家庭 ========== */
        .setup-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 40px;
        }

        .setup-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 40px rgba(168, 146, 121, 0.15);
        }

        .setup-card h2 {
            font-size: 22px;
            color: #5D4E37;
            margin-bottom: 8px;
            text-align: center;
        }
        .setup-card .subtitle {
            font-size: 14px;
            color: #A89279;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #8B7355;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #F0E6D6;
            border-radius: 14px;
            font-size: 16px;
            font-family: inherit;
            background: rgba(255,255,255,0.8);
            color: #5D4E37;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #E8A87C;
            box-shadow: 0 0 0 3px rgba(232, 168, 124, 0.15);
        }
        .form-group input::placeholder {
            color: #C4B8A8;
        }

        .family-code-display {
            background: linear-gradient(135deg, #FFF5ED 0%, #FFE8D6 100%);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }
        .family-code-display .code-label {
            font-size: 13px;
            color: #A89279;
            margin-bottom: 8px;
        }
        .family-code-display .code-value {
            font-size: 32px;
            font-weight: 700;
            color: #C4704B;
            letter-spacing: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .family-code-display .code-value:hover {
            transform: scale(1.05);
        }
        .family-code-display .code-hint {
            font-size: 12px;
            color: #B8A898;
            margin-top: 8px;
        }

        .btn-full {
            width: 100%;
            padding: 16px;
            font-size: 17px;
        }

        .btn-back {
            background: none;
            border: none;
            color: #A89279;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            margin-bottom: 20px;
            padding: 8px 16px;
            transition: color 0.3s;
        }
        .btn-back:hover {
            color: #C4704B;
        }

        /* ========== 主界面 ========== */
        .main-page {
            padding: 0 20px 40px;
        }

        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            max-width: 600px;
            margin: 0 auto;
        }
        .main-header .app-title {
            font-size: 24px;
            font-weight: 700;
            color: #C4704B;
            letter-spacing: 4px;
        }
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .family-info {
            font-size: 13px;
            color: #A89279;
            background: rgba(232, 168, 124, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
        }

        /* 导航标签 */
        .nav-tabs {
            display: flex;
            max-width: 600px;
            margin: 0 auto 30px;
            gap: 0;
            background: rgba(255,255,255,0.6);
            border-radius: 16px;
            padding: 4px;
        }
        .nav-tab {
            flex: 1;
            padding: 14px;
            text-align: center;
            font-size: 15px;
            color: #A89279;
            cursor: pointer;
            border-radius: 13px;
            transition: all 0.3s ease;
            border: none;
            background: none;
            font-family: inherit;
            font-weight: 600;
        }
        .nav-tab.active {
            background: rgba(255,255,255,0.9);
            color: #C4704B;
            box-shadow: 0 2px 12px rgba(168, 146, 121, 0.1);
        }
        .nav-tab:hover:not(.active) {
            color: #8B7355;
        }

        /* ========== 留声（写信） ========== */
        .compose-section {
            max-width: 600px;
            margin: 0 auto;
        }

        .compose-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 36px 30px;
            box-shadow: 0 8px 40px rgba(168, 146, 121, 0.12);
        }

        .compose-card h3 {
            font-size: 20px;
            color: #5D4E37;
            margin-bottom: 6px;
        }
        .compose-card .compose-subtitle {
            font-size: 14px;
            color: #A89279;
            margin-bottom: 28px;
        }

        .member-select {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .member-chip {
            padding: 10px 20px;
            border: 2px solid #F0E6D6;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.6);
            color: #8B7355;
            font-family: inherit;
        }
        .member-chip:hover {
            border-color: #E8A87C;
        }
        .member-chip.selected {
            border-color: #E8A87C;
            background: linear-gradient(135deg, #FFF5ED 0%, #FFE8D6 100%);
            color: #C4704B;
            font-weight: 600;
        }

        .message-input {
            width: 100%;
            min-height: 100px;
            padding: 18px;
            border: 2px solid #F0E6D6;
            border-radius: 16px;
            font-size: 16px;
            font-family: inherit;
            line-height: 1.8;
            color: #5D4E37;
            background: rgba(255,255,255,0.8);
            resize: none;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 8px;
        }
        .message-input:focus {
            border-color: #E8A87C;
            box-shadow: 0 0 0 3px rgba(232, 168, 124, 0.15);
        }
        .message-input::placeholder {
            color: #C4B8A8;
        }
        .char-count {
            font-size: 12px;
            color: #B8A898;
            text-align: right;
            margin-bottom: 16px;
        }

        /* 录音按钮 */
        .record-area {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
            padding: 14px 18px;
            background: rgba(255,255,255,0.6);
            border-radius: 14px;
            border: 2px solid #F0E6D6;
        }
        .record-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #F0E6D6;
            background: rgba(255,255,255,0.8);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .record-btn:hover {
            border-color: #E8A87C;
            background: #FFF5ED;
        }
        .record-btn.recording {
            border-color: #E85D5D;
            background: rgba(232, 93, 93, 0.08);
            animation: pulse-record 1.5s ease-in-out infinite;
        }
        @keyframes pulse-record {
            0%, 100% { box-shadow: 0 0 0 0 rgba(232, 93, 93, 0.3); }
            50% { box-shadow: 0 0 0 12px rgba(232, 93, 93, 0); }
        }
        .record-info {
            flex: 1;
            min-width: 0;
        }
        .record-status {
            font-size: 13px;
            color: #A89279;
        }
        .record-status.recording-text {
            color: #E85D5D;
        }
        .record-timer {
            font-size: 12px;
            color: #B8A898;
            margin-top: 2px;
        }
        .record-play {
            display: none;
            font-size: 14px;
            color: #C4704B;
            cursor: pointer;
            padding: 6px 14px;
            background: rgba(232, 168, 124, 0.12);
            border: none;
            border-radius: 10px;
            font-family: inherit;
            transition: background 0.3s;
        }
        .record-play:hover {
            background: rgba(232, 168, 124, 0.22);
        }
        .record-play.show {
            display: inline-block;
        }
        .record-delete {
            display: none;
            font-size: 14px;
            color: #C4704B;
            cursor: pointer;
            padding: 6px 10px;
            background: none;
            border: none;
            font-family: inherit;
        }
        .record-delete.show {
            display: inline-block;
        }
        .voice-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #C4704B;
            background: rgba(232, 168, 124, 0.1);
            padding: 4px 10px;
            border-radius: 8px;
        }
        .voice-tag .voice-wave {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 14px;
        }
        .voice-tag .voice-wave span {
            display: block;
            width: 2px;
            background: #C4704B;
            border-radius: 1px;
            animation: wave-anim 0.8s ease-in-out infinite;
        }
        .voice-tag .voice-wave span:nth-child(1) { height: 6px; animation-delay: 0s; }
        .voice-tag .voice-wave span:nth-child(2) { height: 12px; animation-delay: 0.1s; }
        .voice-tag .voice-wave span:nth-child(3) { height: 8px; animation-delay: 0.2s; }
        .voice-tag .voice-wave span:nth-child(4) { height: 14px; animation-delay: 0.3s; }
        .voice-tag .voice-wave span:nth-child(5) { height: 6px; animation-delay: 0.4s; }
        @keyframes wave-anim {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }
        .detail-voice {
            margin: 16px 0 8px;
        }
        .detail-voice-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #FFF5ED, #FFE8D6);
            border: 1px solid #F0E6D6;
            border-radius: 20px;
            font-size: 14px;
            color: #C4704B;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        .detail-voice-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 2px 12px rgba(232,168,124,0.2);
        }

        .mode-select {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
        }
        .mode-option {
            flex: 1;
            padding: 16px;
            border: 2px solid #F0E6D6;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.6);
            text-align: center;
            font-family: inherit;
        }
        .mode-option:hover {
            border-color: #E8A87C;
        }
        .mode-option.selected {
            border-color: #E8A87C;
            background: linear-gradient(135deg, #FFF5ED 0%, #FFE8D6 100%);
        }
        .mode-option .mode-icon {
            font-size: 28px;
            margin-bottom: 6px;
        }
        .mode-option .mode-name {
            font-size: 15px;
            color: #5D4E37;
            font-weight: 600;
        }
        .mode-option .mode-desc {
            font-size: 12px;
            color: #A89279;
            margin-top: 4px;
        }

        .capsule-date {
            display: none;
            margin-bottom: 24px;
        }
        .capsule-date.show {
            display: block;
        }
        .capsule-date input[type="date"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #F0E6D6;
            border-radius: 14px;
            font-size: 16px;
            font-family: inherit;
            background: rgba(255,255,255,0.8);
            color: #5D4E37;
            outline: none;
            transition: all 0.3s;
        }
        .capsule-date input[type="date"]:focus {
            border-color: #E8A87C;
        }

        /* ========== 预览卡片 ========== */
        .preview-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(93, 78, 55, 0.6);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .preview-overlay.show {
            display: flex;
        }

        .preview-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            padding: 40px 32px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(93, 78, 55, 0.2);
            animation: cardPop 0.5s ease;
        }
        @keyframes cardPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .preview-card .card-decoration {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .preview-card .card-to {
            font-size: 13px;
            color: #A89279;
            margin-bottom: 4px;
        }
        .preview-card .card-member {
            font-size: 18px;
            font-weight: 600;
            color: #C4704B;
            margin-bottom: 24px;
        }
        .preview-card .card-message {
            font-size: 20px;
            color: #5D4E37;
            line-height: 2;
            margin-bottom: 24px;
            padding: 0 10px;
            font-style: italic;
        }
        .preview-card .card-from {
            font-size: 13px;
            color: #B8A898;
            margin-bottom: 8px;
        }
        .preview-card .card-from-name {
            font-size: 15px;
            color: #8B7355;
            font-weight: 600;
        }
        .preview-card .card-capsule-info {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px dashed #F0E6D6;
            font-size: 13px;
            color: #A89279;
        }

        .preview-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        .preview-actions .btn {
            flex: 1;
            padding: 14px 20px;
            font-size: 15px;
        }

        /* ========== 收信 ========== */
        .inbox-section {
            max-width: 600px;
            margin: 0 auto;
        }

        .inbox-empty {
            text-align: center;
            padding: 80px 20px;
            color: #B8A898;
        }
        .inbox-empty .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .inbox-empty p {
            font-size: 15px;
            line-height: 1.8;
        }

        .message-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-item {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(168, 146, 121, 0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .message-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(168, 146, 121, 0.15);
        }
        .message-item.capsule-locked {
            opacity: 0.7;
        }
        .message-item.capsule-locked:hover {
            opacity: 0.85;
        }

        .message-item .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .message-item .item-from {
            font-size: 14px;
            font-weight: 600;
            color: #C4704B;
        }
        .message-item .item-time {
            font-size: 12px;
            color: #B8A898;
        }
        .message-item .item-preview {
            font-size: 16px;
            color: #5D4E37;
            line-height: 1.6;
        }
        .message-item .item-capsule-badge {
            display: inline-block;
            margin-top: 12px;
            font-size: 12px;
            color: #D4845E;
            background: rgba(232, 168, 124, 0.15);
            padding: 4px 12px;
            border-radius: 12px;
        }
        .message-item .item-capsule-badge.unlocked {
            color: #7BAF6E;
            background: rgba(123, 175, 110, 0.12);
        }

        /* ========== 留言详情弹窗 ========== */
        .detail-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(93, 78, 55, 0.6);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .detail-overlay.show {
            display: flex;
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            padding: 40px 32px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(93, 78, 55, 0.2);
            animation: cardPop 0.5s ease;
        }

        .detail-card .detail-decoration {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .detail-card .detail-from-label {
            font-size: 13px;
            color: #A89279;
            margin-bottom: 4px;
        }
        .detail-card .detail-from-name {
            font-size: 18px;
            font-weight: 600;
            color: #C4704B;
            margin-bottom: 8px;
        }
        .detail-card .detail-to-label {
            font-size: 13px;
            color: #A89279;
            margin-bottom: 4px;
        }
        .detail-card .detail-to-name {
            font-size: 18px;
            font-weight: 600;
            color: #8B7355;

<script>
// ========== 数据管理 ==========
const STORAGE_KEY = 'miyin_data';
const DECO_OPTIONS = ['🌸', '🌿', '🍀', '☀️', '🌙', '⭐', '🌷', '🌻', '🦋', '☁️', '🎐', '🕯️', '🌿', '🪷'];

// 录音相关
let mediaRecorder = null;
let audioChunks = [];
let recordedBlob = null;
let isRecording = false;
let recordTimer = null;
let recordSeconds = 0;
let currentPlayingAudio = null;

function getData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
}

function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function generateCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
}

function getRandomDeco() {
    return DECO_OPTIONS[Math.floor(Math.random() * DECO_OPTIONS.length)];
}

function analyzeWarmth(text) {
    const warmWords = ['爱', '想', '谢谢', '辛苦', '宝贝', '加油', '骄傲', '温暖', '快乐', '幸福', '好', '喜欢', '祝福', '健康', '平安', '开心', '幸福', '爱你', '感谢', '陪伴', '支持', '永远', '重要', '珍惜', '希望', '梦想', '勇敢', '微笑'];
    let score = 30; // 基础分
    for (const w of warmWords) {
        if (text.includes(w)) score += 10;
    }
    return Math.min(100, Math.max(30, score));
}

function formatDate(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function formatDateShort(ts) {
    const d = new Date(ts);
    return `${d.getMonth()+1}月${d.getDate()}日`;
}

// ========== 录音功能 ==========
async function toggleRecording() {
    if (isRecording) {
        stopRecording();
    } else {
        await startRecording();
    }
}

async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
            stream.getTracks().forEach(t => t.stop());

            document.getElementById('record-btn').classList.remove('recording');
            document.getElementById('record-status').textContent = `录音完成 (${recordSeconds}秒)`;
            document.getElementById('record-status').classList.remove('recording-text');
            document.getElementById('record-timer').textContent = '';
            document.getElementById('record-play').classList.add('show');
            document.getElementById('record-delete').classList.add('show');
            document.getElementById('record-btn').textContent = '🎙️';

            // 停止计时
            clearInterval(recordTimer);
            recordTimer = null;
        };

        mediaRecorder.start();
        isRecording = true;
        recordSeconds = 0;

        document.getElementById('record-btn').classList.add('recording');
        document.getElementById('record-btn').textContent = '⏹';
        document.getElementById('record-status').textContent = '正在录音中…';
        document.getElementById('record-status').classList.add('recording-text');
        document.getElementById('record-play').classList.remove('show');
        document.getElementById('record-delete').classList.remove('show');

        recordTimer = setInterval(() => {
            recordSeconds++;
            document.getElementById('record-timer').textContent = `${recordSeconds}s`;
            if (recordSeconds >= 30) stopRecording(); // 最长30秒
        }, 1000);

    } catch (err) {
        showToast('无法使用麦克风，请检查浏览器权限设置');
    }
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
    }
    isRecording = false;
}

function playRecording() {
    if (!recordedBlob) return;
    const url = URL.createObjectURL(recordedBlob);
    const audio = new Audio(url);
    audio.play();
    // 更新按钮状态
    const btn = document.getElementById('record-play');
    const origText = btn.textContent;
    btn.textContent = '♪ 播放中…';
    audio.onended = () => {
        btn.textContent = origText;
        URL.revokeObjectURL(url);
    };
}

function deleteRecording() {
    recordedBlob = null;
    audioChunks = [];
    recordSeconds = 0;
    document.getElementById('record-status').textContent = '点击录音，用声音传递心意';
    document.getElementById('record-status').classList.remove('recording-text');
    document.getElementById('record-timer').textContent = '';
    document.getElementById('record-play').classList.remove('show');
    document.getElementById('record-delete').classList.remove('show');
    document.getElementById('record-btn').textContent = '🎙️';
}

// 将录音转为 base64 存储
function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
}

// ========== 页面切换 ==========
function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
}

// ========== 创建家庭 ==========
function createFamily() {
    const familyName = document.getElementById('family-name').value.trim();
    const creatorName = document.getElementById('creator-name').value.trim();
    const creatorRole = document.getElementById('creator-role').value;

    if (!familyName) { showToast('请输入家庭名称'); return; }
    if (!creatorName) { showToast('请输入你的昵称'); return; }

    const familyCode = generateCode();
    const data = {
        familyCode,
        familyName,
        members: [{ id: Date.now(), name: creatorName, role: creatorRole }],
        messages: [],
        currentUser: { name: creatorName, role: creatorRole }
    };
    saveData(data);

    // 显示家庭码
    document.getElementById('family-code-value').textContent = familyCode;
    document.getElementById('family-code-box').style.display = 'block';
    showToast('小窝搭好啦！把暗号发给家人吧');
    setTimeout(() => enterMain(), 2000);
}

// ========== 加入家庭 ==========
function joinFamily() {
    const code = document.getElementById('join-code').value.trim().toUpperCase();
    const joinerName = document.getElementById('joiner-name').value.trim();
    const joinerRole = document.getElementById('joiner-role').value;

    if (code.length !== 6) { showToast('请输入 6 位家庭码'); return; }
    if (!joinerName) { showToast('请输入你的昵称'); return; }

    const data = getData();
    if (!data || data.familyCode !== code) {
        showToast('家庭码不正确，请检查');
        return;
    }

    // 检查是否已存在同名成员
    const exists = data.members.find(m => m.name === joinerName && m.role === joinerRole);
    if (!exists) {
        data.members.push({ id: Date.now(), name: joinerName, role: joinerRole });
    }
    data.currentUser = { name: joinerName, role: joinerRole };
    saveData(data);
    showToast(`欢迎回家，${data.familyName}等你很久了`);
    setTimeout(() => enterMain(), 600);
}

// ========== 进入主界面 ==========
function enterMain() {
    const data = getData();
    if (!data) { showPage('page-home'); return; }

    showPage('page-main');
    document.getElementById('family-info-display').textContent = `${data.familyName} · 码: ${data.familyCode}`;

    renderMemberSelect();
    renderInbox();
}

// ========== 渲染家庭成员选择 ==========
function renderMemberSelect() {
    const data = getData();
    const container = document.getElementById('member-select');
    container.innerHTML = '';

    data.members.forEach(m => {
        if (data.currentUser && m.name === data.currentUser.name && m.role === data.currentUser.role) return;
        const chip = document.createElement('button');
        chip.className = 'member-chip';
        chip.textContent = `${m.role}·${m.name}`;
        chip.onclick = () => selectMember(chip);
        container.appendChild(chip);
    });

    if (container.children.length === 0) {
        container.innerHTML = '<div style="color:#B8A898;font-size:14px;padding:10px;line-height:2;">家人们还没到齐呢<br>把家庭码发到群里，喊他们来吧</div>';
    }
}

let selectedMember = null;
function selectMember(chip) {
    document.querySelectorAll('.member-chip').forEach(c => c.classList.remove('selected'));
    chip.classList.add('selected');
    selectedMember = chip.textContent;
}

// ========== 模式选择 ==========
let currentMode = 'instant';
function selectMode(mode, el) {
    currentMode = mode;
    document.querySelectorAll('.mode-option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');

    const dateInput = document.getElementById('capsule-date');
    if (mode === 'capsule') {
        dateInput.classList.add('show');
        // 设置最小日期为明天
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('capsule-unlock-date').min = tomorrow.toISOString().split('T')[0];
    } else {
        dateInput.classList.remove('show');
    }
}

// ========== 字数统计 ==========
function updateCharCount() {
    const count = document.getElementById('message-text').value.length;
    document.getElementById('char-count').textContent = count;
}

// ========== 预览 ==========
function previewMessage() {
    const data = getData();
    if (!selectedMember) { showToast('请选择一个家庭成员'); return; }
    const text = document.getElementById('message-text').value.trim();
    if (!text) { showToast('写点什么吧，哪怕一句话'); return; }
    if (currentMode === 'capsule') {
        const dateVal = document.getElementById('capsule-unlock-date').value;
        if (!dateVal) { showToast('请选择解锁日期'); return; }
    }

    document.getElementById('preview-to').textContent = selectedMember;
    document.getElementById('preview-message').textContent = `"${text}"`;
    document.getElementById('preview-from').textContent = `${data.currentUser.role}·${data.currentUser.name}`;

    const capsuleInfo = document.getElementById('preview-capsule-info');
    if (currentMode === 'capsule') {
        const dateVal = document.getElementById('capsule-unlock-date').value;
        capsuleInfo.textContent = `🫧 时光瓶 · 将于 ${dateVal} 解锁`;
        capsuleInfo.style.display = 'block';
    } else {
        capsuleInfo.textContent = '';
        capsuleInfo.style.display = 'none';
    }

    document.getElementById('preview-card').querySelector('.card-decoration').textContent = getRandomDeco();

    // 显示语音标记
    const voiceHint = document.getElementById('preview-voice-hint');
    if (recordedBlob) {
        voiceHint.textContent = '附带语音留言';
        voiceHint.style.display = 'block';
    } else {
        voiceHint.style.display = 'none';
    }

    document.getElementById('preview-overlay').classList.add('show');
}

function closePreview() {
    document.getElementById('preview-overlay').classList.remove('show');
}

// ========== 发送消息 ==========
async function sendMessage() {
    const data = getData();
    const text = document.getElementById('message-text').value.trim();
    const isCapsule = currentMode === 'capsule';
    const unlockDate = isCapsule ? document.getElementById('capsule-unlock-date').value : null;

    // 如果有录音，转为 base64
    let audioBase64 = null;
    if (recordedBlob) {
        audioBase64 = await blobToBase64(recordedBlob);
    }

    const msg = {
        id: Date.now(),
        from: { name: data.currentUser.name, role: data.currentUser.role },
        to: selectedMember,
        text: text,
        mode: isCapsule ? 'capsule' : 'instant',
        unlockDate: unlockDate,
        createdAt: Date.now(),
        deco: getRandomDeco(),
        warmth: analyzeWarmth(text),
        read: false,
        audio: audioBase64
    };

    data.messages.push(msg);
    saveData(data);

    closePreview();
    showToast(isCapsule ? '话已封好，等那个特别的日子再打开 🫧' : '心意已出发，TA会感受到的 💌');

    // 清空输入
    document.getElementById('message-text').value = '';
    updateCharCount();
    deleteRecording(); // 清理录音
    document.querySelectorAll('.member-chip').forEach(c => c.classList.remove('selected'));
    selectedMember = null;
    currentMode = 'instant';
    document.querySelectorAll('.mode-option').forEach((o, i) => {
        o.classList.toggle('selected', i === 0);
    });
    document.getElementById('capsule-date').classList.remove('show');

    renderInbox();
}

// ========== 渲染收信箱 ==========
function renderInbox() {
    const data = getData();
    const container = document.getElementById('inbox-content');

    if (!data.messages || data.messages.length === 0) {
        container.innerHTML = `
            <div class="inbox-empty">
                <div class="empty-icon">🕊️</div>
                <p>这里还安静着<br>等家人把那些说不出口的心里话<br>悄悄放进你的信箱</p>
            </div>
        `;
        return;
    }

    // 显示所有消息（因为是同一浏览器，多成员共用数据）
    const myMessages = data.messages;

    if (myMessages.length === 0) {
        container.innerHTML = `
            <div class="inbox-empty">
                <div class="empty-icon">🕊️</div>
                <p>你的信箱还安静着<br>下次聚餐的时候<br>偷偷把家庭码分享给家人吧</p>
            </div>
        `;
        return;
    }

    // 按时间倒序
    myMessages.sort((a, b) => b.createdAt - a.createdAt);

    let html = '<div class="message-list">';
    myMessages.forEach(msg => {
        const isLocked = msg.mode === 'capsule' && msg.unlockDate && new Date(msg.unlockDate) > new Date();
        const isUnlocked = msg.mode === 'capsule' && msg.unlockDate && new Date(msg.unlockDate) <= new Date();

        html += `
            <div class="message-item ${isLocked ? 'capsule-locked' : ''}" onclick="openMessage(${msg.id})">
                <div class="item-header">
                    <span class="item-from">${msg.from.role}·${msg.from.name}</span>
                    <span class="item-time">${formatDate(msg.createdAt)}</span>
                </div>
                <div class="item-preview">${isLocked ? '🫧 这句话被封存在时光瓶中……' : `"${msg.text}"`}</div>
                ${msg.audio && !isLocked ? `<div class="voice-tag" style="margin-top:8px;"><div class="voice-wave"><span></span><span></span><span></span><span></span><span></span></div> 语音留言</div>` : ''}
                ${isLocked ? '<div class="item-capsule-badge">🫧 时光瓶 · ' + msg.unlockDate + ' 解锁</div>' : ''}
                ${isUnlocked ? '<div class="item-capsule-badge unlocked">🫧 时光瓶已开启</div>' : ''}
            </div>
        `;
    });
    html += '</div>';
    container.innerHTML = html;
}

// ========== 查看消息详情 ==========
function openMessage(msgId) {
    const data = getData();
    const msg = data.messages.find(m => m.id === msgId);
    if (!msg) return;

    const isLocked = msg.mode === 'capsule' && msg.unlockDate && new Date(msg.unlockDate) > new Date();
    if (isLocked) {
        showToast('还不到时候哦，再等等，那天会到的 🫧');
        return;
    }

    document.getElementById('detail-card').querySelector('.detail-decoration').textContent = msg.deco || '💌';
    document.getElementById('detail-from').textContent = `${msg.from.role}·${msg.from.name}`;
    document.getElementById('detail-to').textContent = msg.to;
    document.getElementById('detail-message').textContent = `"${msg.text}"`;

    // 语音播放
    const voiceContainer = document.getElementById('detail-voice');
    if (msg.audio) {
        voiceContainer.innerHTML = `<button class="detail-voice-btn" onclick="playMessageAudio('${msg.id}')"><div class="voice-wave"><span></span><span></span><span></span><span></span><span></span></div> 听听TA的声音</button>`;
    } else {
        voiceContainer.innerHTML = '';
    }

    document.getElementById('detail-time').textContent = formatDate(msg.createdAt);

    const capsuleTag = document.getElementById('detail-capsule-tag');
    if (msg.mode === 'capsule') {
        capsuleTag.textContent = '🫧 来自时光瓶';
        capsuleTag.style.display = 'inline-block';
    } else {
        capsuleTag.style.display = 'none';
    }

    // 温度动画
    const warmth = msg.warmth || 50;
    const warmthLabel = document.getElementById('warmth-label');
    document.getElementById('warmth-fill').style.width = '0%';
    warmthLabel.textContent = '';

    document.getElementById('detail-overlay').classList.add('show');

    setTimeout(() => {
        document.getElementById('warmth-fill').style.width = warmth + '%';
        warmthLabel.textContent = `温暖度 ${warmth}%`;
    }, 400);

    // 标记已读
    msg.read = true;
    saveData(data);
}

function closeDetail(event) {
    if (event && event.target && event.target !== document.getElementById('detail-overlay')) return;
    document.getElementById('detail-overlay').classList.remove('show');
    // 停止正在播放的音频
    if (currentPlayingAudio) {
        currentPlayingAudio.pause();
        currentPlayingAudio = null;
    }
}

// 播放消息中的语音
function playMessageAudio(msgId) {
    const data = getData();
    const msg = data.messages.find(m => m.id == msgId);
    if (!msg || !msg.audio) return;

    // 停止之前的播放
    if (currentPlayingAudio) {
        currentPlayingAudio.pause();
    }

    const audio = new Audio(msg.audio);
    currentPlayingAudio = audio;
    audio.play().catch(() => showToast('语音播放失败'));
    audio.onended = () => { currentPlayingAudio = null; };
}

// ========== Tab 切换 ==========
function switchTab(tab, el) {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');

    document.getElementById('tab-compose').style.display = tab === 'compose' ? 'block' : 'none';
    document.getElementById('tab-inbox').style.display = tab === 'inbox' ? 'block' : 'none';

    if (tab === 'inbox') renderInbox();
}

// ========== 复制家庭码 ==========
function copyFamilyCode() {
    const data = getData();
    if (!data) return;
    navigator.clipboard.writeText(data.familyCode).then(() => {
        showToast('家庭码已复制！');
    }).catch(() => {
        showToast('家庭码: ' + data.familyCode);
    });
}

// ========== 重置数据（用于测试） ==========
function resetData() {
    if (confirm('确定要离开这个小窝吗？所有留言都会被清除哦')) {
        localStorage.removeItem(STORAGE_KEY);
        showPage('page-home');
        showToast('下次再来，我们还在');
    }
}

// ========== Toast ==========
function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

// ========== 粒子效果 ==========
function createParticles() {
    const container = document.getElementById('particles');
    const colors = ['#E8A87C', '#D4845E', '#C4704B', '#F0C8A0', '#E8D5C0'];

    for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 8 + 3;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.animationDuration = (Math.random() * 15 + 10) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        container.appendChild(p);
    }
}
