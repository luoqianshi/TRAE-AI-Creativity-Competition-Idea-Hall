<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 微信群好物关键词监控系统</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <i class="fa fa-wechat fa-3x"></i>
                <h2>用户注册</h2>
                <p>加入微信群好物关键词监控系统</p>
            </div>
            <form id="registerForm" class="login-form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <div class="input-group">
                        <span class="input-group-addon"><i class="fa fa-user"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="nickname">昵称</label>
                    <div class="input-group">
                        <span class="input-group-addon"><i class="fa fa-address-card"></i></span>
                        <input type="text" class="form-control" id="nickname" name="nickname" placeholder="请输入昵称（可选）">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="input-group">
                        <span class="input-group-addon"><i class="fa fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <div class="input-group">
                        <span class="input-group-addon"><i class="fa fa-lock"></i></span>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码" required>
                    </div>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-success btn-block">
                        <i class="fa fa-user-plus"></i> 注册
                    </button>
                </div>
                <div class="form-group text-center">
                    <a href="/login" class="btn btn-link">已有账号？立即登录</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#registerForm').on('submit', function(e) {
                e.preventDefault();
                var username = $('#username').val();
                var nickname = $('#nickname').val();
                var password = $('#password').val();
                var confirmPassword = $('#confirmPassword').val();

                if (password !== confirmPassword) {
                    alert('两次输入的密码不一致');
                    return;
                }

                $.ajax({
                    url: '/api/register',
                    type: 'POST',
                    data: {
                        username: username,
                        nickname: nickname,
                        password: password
                    },
                    success: function(response) {
                        if (response.code === 200) {
                            alert('注册成功，请登录');
                            window.location.href = '/login';
                        } else {
                            alert(response.message);
                        }
                    },
                    error: function() {
                        alert('注册失败，请稍后重试');
                    }
                });
            });
        });
    </script>
</body>
</html>
