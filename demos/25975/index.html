<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>督督熊 - AI备考顾问</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 400px; margin: 0 auto; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    
    /* Header */
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px; text-align: center; }
    .logo { width: 80px; height: 80px; border-radius: 50%; background: white; display: inline-flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .app-name { color: white; font-size: 24px; font-weight: bold; margin-top: 12px; }
    .app-subtitle { color: rgba(255,255,255,0.8); font-size: 14px; margin-top: 4px; }
    
    /* Stats Cards */
    .stats-section { padding: 20px; }
    .stats-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
    .stat-card { background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); border-radius: 16px; padding: 16px; }
    .stat-card.main { grid-column: span 2; }
    .stat-value { font-size: 28px; font-weight: bold; color: #667eea; }
    .stat-label { font-size: 12px; color: #6c757d; margin-top: 4px; }
    .stat-icon { font-size: 20px; }
    .progress-bar { height: 8px; background: #e9ecef; border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 4px; animation: progress 2s ease-out; }
    @keyframes progress { from { width: 0; } to { width: 75%; } }
    
    /* Feature Cards */
    .features-section { padding: 0 20px 20px; }
    .feature-card { background: white; border: 2px solid #f0f0f0; border-radius: 16px; padding: 20px; margin-bottom: 12px; transition: all 0.3s ease; }
    .feature-card:hover { border-color: #667eea; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.15); }
    .feature-header { display: flex; align-items: center; margin-bottom: 10px; }
    .feature-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-right: 12px; }
    .feature-title { font-size: 16px; font-weight: bold; color: #333; }
    .feature-desc { font-size: 13px; color: #666; line-height: 1.5; }
    .feature-arrow { margin-left: auto; color: #ccc; font-size: 18px; }
    
    /* Persona Section */
    .persona-section { padding: 0 20px 20px; }
    .section-title { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 12px; }
    .persona-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .persona-card { background: white; border: 2px solid #f0f0f0; border-radius: 16px; padding: 16px; text-align: center; transition: all 0.3s ease; }
    .persona-card:hover { border-color: #667eea; transform: scale(1.02); }
    .persona-emoji { font-size: 32px; margin-bottom: 8px; }
    .persona-name { font-size: 14px; font-weight: bold; color: #333; }
    .persona-desc { font-size: 11px; color: #999; margin-top: 4px; }
    
    /* Bottom Nav */
    .bottom-nav { display: flex; justify-content: space-around; padding: 16px 20px; border-top: 1px solid #f0f0f0; background: white; }
    .nav-item { text-align: center; }
    .nav-icon { font-size: 24px; margin-bottom: 4px; }
    .nav-text { font-size: 11px; color: #999; }
    .nav-item.active .nav-icon { color: #667eea; }
    .nav-item.active .nav-text { color: #667eea; font-weight: bold; }
    
    /* Footer */
    .footer { padding: 20px; text-align: center; background: #f8f9fa; }
    .footer-text { font-size: 12px; color: #999; }
    .footer-version { font-size: 11px; color: #ccc; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">🐻</div>
      <div class="app-name">督督熊</div>
      <div class="app-subtitle">您的专属AI备考顾问</div>
    </div>
    
    <!-- Stats Cards -->
    <div class="stats-section">
      <div class="stats-grid">
        <div class="stat-card main">
          <div style="display: flex; align-items: center;">
            <span class="stat-icon">⏰</span>
            <div style="margin-left: 8px;">
              <div class="stat-value">2小时35分</div>
              <div class="stat-label">今日学习时长</div>
            </div>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: 75%;"></div>
          </div>
          <div style="font-size: 11px; color: #999; margin-top: 6px;">今日目标：完成 75%</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">🔥 7</div>
          <div class="stat-label">连续打卡</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">⭐ 42</div>
          <div class="stat-label">今日积分</div>
        </div>
      </div>
    </div>
    
    <!-- Feature Cards -->
    <div class="features-section">
      <div class="feature-card">
        <div class="feature-header">
          <div class="feature-icon" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white;">💬</div>
          <div>
            <div class="feature-title">AI对话</div>
            <div class="feature-desc">风格化督学 · 知识问答</div>
          </div>
          <span class="feature-arrow">→</span>
        </div>
        <div style="background: #f8f9fa; border-radius: 12px; padding: 12px; font-size: 13px; color: #666; line-height: 1.6;">
          "同学你好！今天也要加油学习哦～需要我帮你制定学习计划吗？"
        </div>
      </div>
      
      <div class="feature-card">
        <div class="feature-header">
          <div class="feature-icon" style="background: linear-gradient(135deg, #22C55E, #16A34A); color: white;">🎯</div>
          <div>
            <div class="feature-title">专注学习</div>
            <div class="feature-desc">番茄钟 · 倒计时</div>
          </div>
          <span class="feature-arrow">→</span>
        </div>
      </div>
      
      <div class="feature-card">
        <div class="feature-header">
          <div class="feature-icon" style="background: linear-gradient(135deg, #F59E0B, #D97706); color: white;">✅</div>
          <div>
            <div class="feature-title">学习打卡</div>
            <div class="feature-desc">任务清单 · 每日计划</div>
          </div>
          <span class="feature-arrow">→</span>
        </div>
      </div>
    </div>
    
    <!-- Persona Section -->
    <div class="persona-section">
      <div class="section-title">选择你的督学伙伴</div>
      <div class="persona-grid">
        <div class="persona-card">
          <div class="persona-emoji">🐻</div>
          <div class="persona-name">督督熊</div>
          <div class="persona-desc">大众亲和型</div>
        </div>
        <div class="persona-card">
          <div class="persona-emoji">🌸</div>
          <div class="persona-name">甜心熊</div>
          <div class="persona-desc">治愈陪伴型</div>
        </div>
        <div class="persona-card">
          <div class="persona-emoji">👔</div>
          <div class="persona-name">霸总熊</div>
          <div class="persona-desc">严格鞭策型</div>
        </div>
        <div class="persona-card">
          <div class="persona-emoji">📚</div>
          <div class="persona-name">熊主任</div>
          <div class="persona-desc">专业严谨型</div>
        </div>
      </div>
    </div>
    
    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <div class="nav-item active">
        <div class="nav-icon">🏠</div>
        <div class="nav-text">首页</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">✅</div>
        <div class="nav-text">打卡</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">⏱️</div>
        <div class="nav-text">专注</div>
      </div>
      <div class="nav-item">
        <div class="nav-icon">👤</div>
        <div class="nav-text">我的</div>
      </div>
    </div>
    
    <!-- Footer -->
    <div class="footer">
      <div class="footer-text">让学习更有趣 · 让备考更轻松</div>
      <div class="footer-version">版本 1.0.0</div>
    </div>
  </div>
</body>
</html>
