<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>初行指南</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: #f5f5f5;
    color: #333;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
}

.app-container {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: #f5f5f5;
    position: relative;
    padding-bottom: 90px;
}

/* ========== 小程序顶部导航栏 ========== */
.nav-bar {
    position: sticky;
    top: 0;
    z-index: 1000;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nav-bar-bg {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, #07c160 0%, #05a350 100%);
}

.nav-content {
    position: relative;
    z-index: 1;
}

.nav-title {
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.5px;
}

/* 胶囊按钮 */
.capsule {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.25);
    border-radius: 16px;
    padding: 4px 8px;
    z-index: 2;
    backdrop-filter: blur(4px);
}

.capsule-btn {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    cursor: pointer;
}

.capsule-divider {
    width: 1px;
    height: 18px;
    background: rgba(255,255,255,0.3);
    margin: 0 2px;
}

/* ========== 顶部品牌区 ========== */
.brand-header {
    background: linear-gradient(135deg, #07c160 0%, #05a350 100%);
    padding: 12px 16px 20px;
    color: white;
}

.brand-content {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-icon {
    width: 48px;
    height: 48px;
    background: rgba(255,255,255,0.2);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
}

.brand-text h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 2px;
}

.brand-text p {
    font-size: 13px;
    opacity: 0.85;
    font-weight: 300;
}

/* ========== 场景标签页 ========== */
.scene-tabs {
    display: flex;
    background: #fff;
    padding: 10px 12px;
    gap: 8px;
    position: sticky;
    top: 44px;
    z-index: 100;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}

.scene-tabs::-webkit-scrollbar {
    display: none;
}

.scene-tab {
    flex: 1;
    min-width: 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 4px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #666;
    background: #f7f7f7;
    border: none;
}

.scene-tab .tab-icon {
    font-size: 22px;
    line-height: 1;
}

.scene-tab .tab-text {
    font-size: 11px;
    font-weight: 500;
}

.scene-tab.active {
    background: linear-gradient(135deg, #07c160 0%, #05a350 100%);
    color: white;
    box-shadow: 0 2px 8px rgba(7, 193, 96, 0.25);
}

/* ========== 主内容区 ========== */
.main-content {
    padding: 12px;
}

.scene-panel {
    display: none;
}

.scene-panel.active {
    display: block;
    animation: fadeIn 0.25s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

/* 场景头部 */
.scene-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    padding: 14px 16px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
}

.scene-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
}

.scene-info h2 {
    font-size: 16px;
    font-weight: 600;
    color: #333;
    margin-bottom: 2px;
}

.scene-info p {
    font-size: 12px;
    color: #999;
}

/* ========== 问题列表 ========== */
.question-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.question-card {
    background: #fff;
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
}

.question-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: #07c160;
    border-radius: 12px 0 0 12px;
}

.question-card:active {
    transform: scale(0.98);
    opacity: 0.9;
}

.question-title {
    font-size: 15px;
    font-weight: 600;
    color: #333;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1.4;
}

.question-preview {
    font-size: 13px;
    color: #999;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.question-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    font-size: 11px;
    color: #bbb;
}

.question-meta span {
    display: flex;
    align-items: center;
    gap: 3px;
}

.hot-badge {
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    color: white;
    padding: 1px 6px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 600;
    flex-shrink: 0;
}

/* ========== 底部提问按钮 ========== */
.ask-button-wrap {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    padding: 8px 16px 24px;
    background: linear-gradient(to top, rgba(245,245,245,1) 0%, rgba(245,245,245,0.95) 60%, transparent 100%);
    z-index: 90;
}

.ask-button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #07c160 0%, #05a350 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    box-shadow: 0 4px 12px rgba(7, 193, 96, 0.3);
    transition: all 0.2s ease;
}

.ask-button:active {
    transform: scale(0.97);
    box-shadow: 0 2px 6px rgba(7, 193, 96, 0.2);
}

.ask-icon {
    display: flex;
    align-items: center;
}

/* ========== 弹窗（小程序风格全屏页面） ========== */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2000;
}

.modal.active {
    display: block;
    animation: fadeIn 0.2s ease;
}

.modal-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.4);
}

.modal-content {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: #f5f5f5;
    animation: slideInRight 0.25s ease;
    display: flex;
    flex-direction: column;
}

@keyframes slideInRight {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
}

/* 弹窗导航栏 */
.modal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    height: 44px;
    background: #fff;
    border-bottom: 0.5px solid #e5e5e5;
    flex-shrink: 0;
}

.modal-back {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
    cursor: pointer;
    border-radius: 50%;
}

.modal-back:active {
    background: #f0f0f0;
}

.modal-nav h3 {
    font-size: 16px;
    font-weight: 600;
    color: #333;
    flex: 1;
    text-align: center;
}

.modal-placeholder {
    width: 32px;
}

.modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    -webkit-overflow-scrolling: touch;
}

/* ========== 详情弹窗内容 ========== */
.detail-content {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
}

.detail-content h4 {
    font-size: 15px;
    color: #07c160;
    margin: 18px 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
}

.detail-content h4:first-child {
    margin-top: 0;
}

.detail-content p, .detail-content li {
    font-size: 14px;
    line-height: 1.8;
    color: #555;
}

.detail-content ol, .detail-content ul {
    padding-left: 18px;
    margin: 8px 0;
}

.detail-content li {
    margin: 6px 0;
    padding-left: 4px;
}

.tip-box {
    background: #fff8e1;
    border-radius: 10px;
    padding: 12px 14px;
    margin: 12px 0;
    font-size: 13px;
    color: #666;
    line-height: 1.6;
}

.tip-box.warning {
    background: #ffebee;
}

.tip-box strong {
    color: #333;
}

/* ========== 提问表单 ========== */
.ask-form textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    font-size: 15px;
    resize: none;
    font-family: inherit;
    transition: border-color 0.2s;
    margin-bottom: 16px;
    background: #fff;
    -webkit-appearance: none;
}

.ask-form textarea:focus {
    outline: none;
    border-color: #07c160;
}

.ask-options {
    display: flex;
    gap: 10px;
}

.option-card {
    flex: 1;
    padding: 18px 12px;
    border: 1.5px solid #e5e5e5;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    background: #fff;
}

.option-card:active {
    transform: scale(0.97);
}

.option-card.premium {
    background: linear-gradient(135deg, #fff8e1 0%, #fff3e0 100%);
    border-color: #ffc107;
}

.option-icon {
    font-size: 28px;
    margin-bottom: 6px;
    line-height: 1;
}

.option-title {
    font-size: 14px;
    font-weight: 600;
    color: #333;
    margin-bottom: 3px;
}

.option-desc {
    font-size: 11px;
    color: #999;
}

.coin-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: linear-gradient(135deg, #ffc107, #ff8f00);
    color: white;
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(255, 193, 7, 0.3);
}

/* ========== Toast提示 ========== */
.toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 3000;
    transition: all 0.25s ease;
    pointer-events: none;
    text-align: center;
    max-width: 280px;
    line-height: 1.5;
}

.toast.show {
    transform: translate(-50%, -50%) scale(1);
}

/* ========== 响应式 ========== */
@media (max-width: 430px) {
    .app-container {
        max-width: 100%;
    }
}

/* ========== 安全区域适配 ========== */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
    .ask-button-wrap {
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
    .app-container {
        padding-bottom: calc(90px + env(safe-area-inset-bottom));
    }
}

/* ========== 滚动条美化 ========== */
::-webkit-scrollbar {
    width: 0;
    display: none;
}

</style>
</head>

        this.renderQuestions('travel');
        this.renderQuestions('entertainment');
        this.renderQuestions('life');
        this.renderQuestions('social');
    }

    bindEvents() {
        // 场景标签切换
        document.querySelectorAll('.scene-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                const scene = e.currentTarget.dataset.scene;
                this.switchScene(scene);
            });
        });

        // 提问按钮
        document.getElementById('askBtn').addEventListener('click', () => {
            this.openAskModal();
        });

        // 关闭详情弹窗
        document.getElementById('closeDetail').addEventListener('click', () => {
            this.closeModal('detailModal');
        });

        // 关闭提问弹窗
        document.getElementById('closeAsk').addEventListener('click', () => {
            this.closeModal('askModal');
        });

        // 点击弹窗背景关闭
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) this.closeModal('detailModal');
        });

        document.getElementById('askModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) this.closeModal('askModal');
        });

        // 免费提问
        document.getElementById('freeAsk').addEventListener('click', () => {
            this.handleFreeAsk();
        });

        // 付费提问
        document.getElementById('premiumAsk').addEventListener('click', () => {
            this.handlePremiumAsk();
        });
    }

    switchScene(scene) {
        // 更新标签状态
        document.querySelectorAll('.scene-tab').forEach(tab => {
            tab.classList.remove('active');
            if (tab.dataset.scene === scene) {
                tab.classList.add('active');
            }
        });

        // 更新内容显示
        document.querySelectorAll('.scene-panel').forEach(panel => {
            panel.classList.remove('active');
        });
        document.getElementById(`scene-${scene}`).classList.add('active');

        this.currentScene = scene;
    }

    renderQuestions(scene) {
        const container = document.getElementById(`${scene}-questions`);
        const questions = sceneData[scene];

        container.innerHTML = questions.map((q, index) => `
            <div class="question-card ${scene}" data-id="${q.id}" data-scene="${scene}">
                <div class="question-title">
                    ${q.title}
                    ${q.isHot ? '<span class="hot-badge">热门</span>' : ''}
                </div>
                <div class="question-preview">${q.preview}</div>
                <div class="question-meta">
                    <span>👁 ${this.formatNumber(q.views)}</span>
                    <span>📖 阅读指南</span>
                </div>
            </div>
        `).join('');

        // 绑定点击事件
        container.querySelectorAll('.question-card').forEach(card => {
            card.addEventListener('click', () => {
                const id = card.dataset.id;
                const sceneType = card.dataset.scene;
                this.showDetail(id, sceneType);
            });
        });
    }

    showDetail(id, scene) {
        const question = sceneData[scene].find(q => q.id === id);
        if (!question) return;

        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        modalTitle.textContent = question.title;

        const content = question.content;
        modalBody.innerHTML = `
            <div class="detail-content">
                <h4>📋 操作步骤</h4>
                <ol>
                    ${content.steps.map(step => `<li>${step}</li>`).join('')}
                </ol>

                <h4>📎 必备材料</h4>
                <ul>
                    ${content.materials.map(m => `<li>${m}</li>`).join('')}
                </ul>

                <div class="tip-box">
                    <strong>💡 温馨提示：</strong>${content.tips}
                </div>

                <div class="tip-box warning">
                    <strong>🚨 应急方案：</strong>${content.emergency}
                </div>
            </div>
        `;

        this.openModal('detailModal');
    }

    openModal(modalId) {
        document.getElementById(modalId).classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    closeModal(modalId) {
        document.getElementById(modalId).classList.remove('active');
        document.body.style.overflow = '';
    }

    openAskModal() {
        document.getElementById('questionInput').value = '';
        this.openModal('askModal');
    }

    handleFreeAsk() {
        const question = document.getElementById('questionInput').value.trim();
        if (!question) {
            this.showToast('请先输入你的问题');
            return;
        }

        this.closeModal('askModal');
        this.showToast('问题已发布，等待社区回复...');

        // 模拟发布成功
        setTimeout(() => {
            this.showToast('已有3位用户关注了你的问题');
        }, 2000);
    }

    handlePremiumAsk() {
        const question = document.getElementById('questionInput').value.trim();
        if (!question) {
            this.showToast('请先输入你的问题');
            return;
        }

        if (userCoins < 50) {
            this.showToast(`金币不足，当前余额：${userCoins}💰\n需要50金币才能使用专人即时回复`);
            return;
        }

        userCoins -= 50;
        this.closeModal('askModal');
        this.showToast('AI正在为你生成专属指南...');

        // 模拟AI回复
        setTimeout(() => {
            this.showAIResponse(question);
        }, 1500);
    }

    showAIResponse(question) {
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');

        modalTitle.textContent = '💬 AI专属指南';
        modalBody.innerHTML = `
            <div class="detail-content">
                <p style="color: #667eea; font-weight: 600; margin-bottom: 16px;">你的问题：${question}</p>
                
                <h4>📋 操作步骤</h4>
                <ol>
                    <li>首先确认具体场景和需求，做好前期信息收集</li>
                    <li>准备所需材料和证件，建议提前列清单核对</li>
                    <li>提前了解流程，可通过官方渠道查询最新要求</li>
                    <li>预留充足时间，建议提前15-30分钟到达</li>
                    <li>保持冷静，遇到问题可向工作人员求助</li>
                </ol>

                <h4>📎 建议准备</h4>
                <ul>
                    <li>身份证原件（必备）</li>
                    <li>手机（用于查询和支付）</li>
                    <li>相关证明材料（根据具体场景）</li>
                    <li>现金或银行卡（备用）</li>
                </ul>

                <div class="tip-box">
                    <strong>💡 温馨提示：</strong>第一次做任何事情紧张是正常的，提前做好准备可以大大增加自信心。建议提前查阅相关攻略，或者询问有经验的朋友。
                </div>

                <div class="tip-box warning">
                    <strong>🚨 应急方案：</strong>如果遇到突发情况，保持冷静是第一步。可以寻求现场工作人员帮助，或者拨打相关服务热线咨询。
                </div>

                <p style="margin-top: 20px; color: #888; font-size: 13px; text-align: center;">
                    🤖 以上内容由AI生成，仅供参考
                </p>
            </div>
        `;

        this.openModal('detailModal');
    }

    showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');

        setTimeout(() => {
            toast.classList.remove('show');
        }, 2500);
    }

    formatNumber(num) {
        if (num >= 10000) {
            return (num / 10000).toFixed(1) + 'w';
        }
        if (num >= 1000) {
            return (num / 1000).toFixed(1) + 'k';
        }
        return num.toString();
    }
}

// 初始化应用
document.addEventListener('DOMContentLoaded', () => {
    new ChuxingGuide();
});

</script>
</body>
</html>
