<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白昼玻璃约束网格</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 规范1：全局基础色系反转为亮色 */
        body { background-color: #FAFAFA; color: #171717; }

        /* 规范2：纯 CSS 驱动的网格布局引擎 (对应 Flutter 的 StaggeredGrid) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-flow: dense;
            gap: 4px;
        }
        .item-lg { grid-column: span 2; grid-row: span 2; aspect-ratio: 1/1; }
        .item-wide { grid-column: span 2; grid-row: span 1; aspect-ratio: 2/1; }
        .item-sm { grid-column: span 1; grid-row: span 1; aspect-ratio: 1/1; }

        /* 规范3：状态驱动的 UI 显隐 */
        .checkbox-overlay { display: none; }
        .grid-item.selected .checkbox-overlay { display: flex; }

        /* 隐藏滚动条，保持极简视觉 */
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="flex justify-center min-h-screen">
<!-- 对应 Flutter: Scaffold. body: Stack -->
<div id="app-container" class="flex flex-col h-screen w-full max-w-sm bg-[#FAFAFA] border-x border-black/5 overflow-hidden relative">

    <!-- ==================== 顶部 AppBar (绝对定位) ==================== -->
    <!-- 对应 Flutter: Positioned(top:0) -> ClipRect -> BackdropFilter -->
    <div class="absolute top-0 left-0 w-full shrink-0 bg-white/80 backdrop-blur-md border-b border-black/5 z-20 transition-all duration-300">
        <header class="p-4 pt-12 flex justify-between items-center">
            <h1 id="title" class="text-2xl font-bold tracking-tight text-[#171717]">照片墙</h1>
            <div class="flex items-center gap-1 text-[#171717]">
                <!-- 选择模式切换按钮 (圆润线性风格) -->
                <button id="select-btn" class="hover:opacity-50 transition-opacity p-2 z-10">
                    <svg viewBox="0 0 24 24" class="w-6 h-6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M8 12l2 2 4-4"></path>
                    </svg>
                </button>

                <!-- 拍照/上传功能组 -->
                <div class="relative">
                    <button id="add-btn" class="hover:opacity-50 transition-all duration-200 p-2 flex items-center justify-center">
                        <svg viewBox="0 0 24 24" class="w-6 h-6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                    </button>

                    <!-- 下拉菜单 (Popover) -->
                    <div id="popover" class="absolute top-12 right-2 w-36 bg-white/95 border border-black/5 rounded-lg shadow-xl opacity-0 scale-95 pointer-events-none transition-all duration-150 z-50 py-1 backdrop-blur-lg">
                        <button class="w-full text-left px-4 py-2.5 text-xs text-[#171717] hover:bg-black/5 flex items-center gap-2.5 transition-colors">
                            <svg viewBox="0 0 24 24" class="w-4 h-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                            拍照
                        </button>
                        <button class="w-full text-left px-4 py-2.5 text-xs text-[#171717] hover:bg-black/5 flex items-center gap-2.5 transition-colors">
                            <svg viewBox="0 0 24 24" class="w-4 h-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            从相册选择
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 双标签过滤栏 -->
        <div id="tab-bar" class="px-4 pb-1 flex gap-6 text-sm">
            <button id="tab-all" class="text-[#171717] font-medium pb-2 border-b-2 border-[#171717] transition-all flex items-center gap-1.5">
                <svg viewBox="0 0 24 24" class="w-4 h-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                    <line x1="21" y1="12" x2="3" y2="12"></line>
                    <line x1="12" y1="3" x2="12" y2="21"></line>
                </svg>
                全部
            </button>
            <button id="tab-fav" class="text-neutral-400 hover:text-[#171717] pb-2 border-b-2 border-transparent transition-all flex items-center gap-1.5">
                <svg viewBox="0 0 24 24" class="w-4 h-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                收藏
            </button>
        </div>
    </div>

    <!-- ==================== 滚动内容区 ==================== -->
    <!-- 对应 Flutter: CustomScrollView. pt 和 pb 为顶部/底部的安全避让区 -->
    <main class="h-full overflow-y-auto pt-[132px] pb-[84px] p-2 bg-[#FAFAFA]">
        <div id="grid-container" class="grid-container"></div>
    </main>

    <!-- ==================== 底部导航/动作栏 (绝对定位) ==================== -->
    <!-- 对应 Flutter: Positioned(bottom:0) -> ClipRect -> BackdropFilter -->

    <!-- 普通模式底部导航 -->
    <footer id="nav-footer" class="absolute bottom-0 left-0 w-full h-20 border-t border-black/5 flex justify-around items-center text-[10px] text-neutral-400 z-20 transition-opacity duration-200" style="background-color: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">
        <div class="flex flex-col items-center gap-1 cursor-pointer hover:text-[#171717]">
            <svg viewBox="0 0 24 24" class="w-5 h-5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 14 14"></polyline></svg>
            时光
        </div>
        <div class="flex flex-col items-center gap-1 text-[#171717] font-medium cursor-pointer">
            <svg viewBox="0 0 24 24" class="w-5 h-5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            照片墙
        </div>
        <div class="flex flex-col items-center gap-1 cursor-pointer hover:text-[#171717]">
            <svg viewBox="0 0 24 24" class="w-5 h-5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            足迹
        </div>
    </footer>

    <!-- 选择模式批量操作栏 -->
    <footer id="action-footer" class="absolute bottom-0 left-0 w-full h-20 border-t border-black/5 hidden grid grid-cols-3 z-20 transition-opacity duration-200" style="background-color: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">
        <button class="flex flex-col items-center justify-center gap-1 text-xs text-red-500 hover:opacity-80">
            <svg viewBox="0 0 24 24" class="w-5 h-5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            删除
        </button>
        <button class="flex flex-col items-center justify-center gap-1 text-xs text-neutral-400 hover:text-[#171717]">
            <svg viewBox="0 0 24 24" class="w-5 h-5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            保存本地
        </button>
        <button class="flex flex-col items-center justify-center gap-1 text-xs text-neutral-400 hover:text-[#171717]">
            <svg viewBox="0 0 24 24" class="w-5 h-5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
            分享
        </button>
    </footer>
</div>

<script>
    // ==================== 状态管理与 DOM 引用 (方便转译为 Flutter State) ====================
    const container = document.getElementById('grid-container');
    const selectBtn = document.getElementById('select-btn');
    const addBtn = document.getElementById('add-btn');
    const popover = document.getElementById('popover');
    const navFooter = document.getElementById('nav-footer');
    const actionFooter = document.getElementById('action-footer');
    const title = document.getElementById('title');

    const tabAll = document.getElementById('tab-all');
    const tabFav = document.getElementById('tab-fav');

    // Flutter 中的 bool 状态变量
    let isSelecting = false;
    let isPopoverOpen = false;
    const photos = [];

    // 图标状态映射
    const selectIcons = {
        normal: `
            <svg viewBox="0 0 24 24" class="w-6 h-6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M8 12l2 2 4-4"></path>
            </svg>
        `,
        active: `
            <svg viewBox="0 0 24 24" class="w-6 h-6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
        `
    };

    // ==================== 数据初始化 ====================
    const layoutPatterns = ['item-lg', 'item-sm', 'item-sm', 'item-wide', 'item-sm', 'item-sm', 'item-sm', 'item-sm'];
    for (let i = 0; i < 30; i++) {
        photos.push({
            id: i,
            cls: layoutPatterns[i % layoutPatterns.length],
            src: `https://picsum.photos/600/600?random=${i}`,
            selected: false
        });
    }

    // ==================== 渲染逻辑 ====================
    photos.forEach(photo => {
        const div = document.createElement('div');
        // 白昼模式下的占位色改为亮灰色 bg-neutral-200
        div.className = `${photo.cls} grid-item bg-neutral-200 overflow-hidden rounded-sm relative cursor-pointer transition-all duration-200`;
        div.innerHTML = `
            <img src="${photo.src}" class="w-full h-full object-cover">
            <!-- 纯净黑底白对勾 勾选圆圈 -->
            <div class="checkbox-overlay absolute top-2 right-2 w-6 h-6 rounded-full bg-[#171717] items-center justify-center shadow-md">
                <svg viewBox="0 0 24 24" class="w-4 h-4 text-white" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
        `;

        // 点击照片交互逻辑
        div.onclick = function() {
            if(!isSelecting) return;

            photo.selected = !photo.selected;
            this.classList.toggle('selected', photo.selected);
            this.classList.toggle('opacity-70', photo.selected); // 白昼模式下选中压暗效果
        };
        container.appendChild(div);
    });

    // ==================== 交互控制器 ====================

    // popover 显隐控制
    function togglePopover(open) {
        isPopoverOpen = open;
        if (open) {
            popover.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
            popover.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
        } else {
            popover.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
            popover.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
        }
    }

    addBtn.onclick = (e) => {
        e.stopPropagation();
        if (isSelecting) return;
        togglePopover(!isPopoverOpen);
    };

    document.addEventListener('click', (e) => {
        if (isPopoverOpen && !popover.contains(e.target) && e.target !== addBtn) {
            togglePopover(false);
        }
    });

    // 选择模式状态机
    selectBtn.onclick = () => {
        isSelecting = !isSelecting;
        document.body.classList.toggle('is-selecting', isSelecting);

        // 切换底部工具栏
        navFooter.classList.toggle('hidden', isSelecting);
        actionFooter.classList.toggle('hidden', !isSelecting);
        title.innerText = isSelecting ? '选择照片' : '照片墙';

        // 处理冲突状态
        if (isSelecting) {
            addBtn.classList.add('opacity-0', 'pointer-events-none');
            togglePopover(false);
        } else {
            addBtn.classList.remove('opacity-0', 'pointer-events-none');
        }

        // 重置选中数据
        if (!isSelecting) {
            photos.forEach(photo => photo.selected = false);
            document.querySelectorAll('.grid-item').forEach(el => {
                el.classList.remove('selected', 'opacity-70');
            });
        }

        // 切换顶部图标
        selectBtn.innerHTML = isSelecting ? selectIcons.active : selectIcons.normal;
    };

    // Tab栏切换逻辑
    function switchTab(activeTab, inactiveTab) {
        activeTab.classList.remove('text-neutral-400', 'border-transparent');
        activeTab.classList.add('text-[#171717]', 'font-medium', 'border-[#171717]');

        inactiveTab.classList.remove('text-[#171717]', 'font-medium', 'border-[#171717]');
        inactiveTab.classList.add('text-neutral-400', 'border-transparent');
    }

    tabAll.onclick = () => switchTab(tabAll, tabFav);
    tabFav.onclick = () => switchTab(tabFav, tabAll);
</script>
</body>
</html>
