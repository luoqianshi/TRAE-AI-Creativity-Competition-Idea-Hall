<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉字小达人 - 趣味识字游戏</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            position: relative;
        }

        /* 首页样式 */
        .home-screen {
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        .game-title {
            font-size: 4rem;
            color: #fff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        .game-subtitle {
            font-size: 1.5rem;
            color: #ffeaa7;
            margin-bottom: 40px;
        }

        .mascot {
            font-size: 8rem;
            margin: 30px 0;
            animation: float 3s ease-in-out infinite;
        }

        .start-btn {
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 2rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        .start-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.6);
        }

        /* 关卡选择页 */
        .level-screen {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .level-title {
            font-size: 3rem;
            color: #fff;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        .level-card {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .level-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .level-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .level-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .level-name {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 10px;
        }

        .level-stars {
            font-size: 1.5rem;
            color: #ffd700;
        }

        /* 游戏界面 */
        .game-screen {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 25px;
            background: rgba(255,255,255,0.2);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        .score-display, .timer-display {
            font-size: 1.5rem;
            color: #fff;
        }

        .pause-btn {
            background: rgba(255,255,255,0.3);
            border: 2px solid #fff;
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .pause-btn:hover {
            background: rgba(255,255,255,0.5);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            transition: all 0.3s ease;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
        }

        .card.flipped {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            animation: flip 0.6s ease-out;
        }

        .card.matched {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            animation: matchSuccess 0.8s ease-out forwards;
        }

        .card-content {
            display: none;
        }

        .card.flipped .card-content,
        .card.matched .card-content {
            display: block;
        }

        .card-back {
            font-size: 2.5rem;
            color: rgba(255,255,255,0.8);
        }

        .card.flipped .card-back,
        .card.matched .card-back {
            display: none;
        }

        /* 结果页面 */
        .result-screen {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .result-title {
            font-size: 3.5rem;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .result-stars {
            font-size: 4rem;
            margin: 30px 0;
            animation: starBurst 1s ease-out;
        }

        .result-score {
            font-size: 2rem;
            color: #ffeaa7;
            margin-bottom: 40px;
        }

        .result-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .result-btn {
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .result-btn:hover {
            transform: translateY(-3px) scale(1.05);
        }

        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes flip {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(90deg); }
            100% { transform: rotateY(0deg); }
        }

        @keyframes matchSuccess {
            0% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(0.9); }
            75% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 0.7; }
        }

        @keyframes starBurst {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); opacity: 1; }
        }

        /* 粒子效果 */
        .particle {
            position: fixed;
            pointer-events: none;
            animation: particleFloat 3s ease-out forwards;
            font-size: 2rem;
        }

        @keyframes particleFloat {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(0); opacity: 0; }
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .game-title { font-size: 2.5rem; }
            .cards-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .card { font-size: 2rem; }
            .level-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 首页 -->
        <div class="home-screen" id="homeScreen">
            <h1 class="game-title">汉字小达人</h1>
            <p class="game-subtitle">趣味识字，快乐学习！</p>
            <div class="mascot">🐻</div>
            <button class="start-btn" onclick="showLevelScreen()">开始游戏</button>
        </div>

        <!-- 关卡选择 -->
        <div class="level-screen" id="levelScreen">
            <h2 class="level-title">选择关卡</h2>
            <div class="level-grid">
                <div class="level-card" onclick="startGame('animals')">
                    <div class="level-icon">🐾</div>
                    <div class="level-name">动物世界</div>
                    <div class="level-stars">⭐⭐⭐</div>
                </div>
                <div class="level-card" onclick="startGame('fruits')">
                    <div class="level-icon">🍎</div>
                    <div class="level-name">水果乐园</div>
                    <div class="level-stars">⭐⭐</div>
                </div>
                <div class="level-card locked">
                    <div class="level-icon">🏠</div>
                    <div class="level-name">日常生活</div>
                    <div class="level-stars">🔒</div>
                </div>
            </div>
        </div>

        <!-- 游戏界面 -->
        <div class="game-screen" id="gameScreen">
            <div class="game-header">
                <div class="score-display">得分: <span id="score">0</span></div>
                <div class="timer-display">时间: <span id="timer">60</span>秒</div>
                <button class="pause-btn" onclick="pauseGame()">暂停</button>
            </div>
            <div class="cards-grid" id="cardsGrid"></div>
        </div>

        <!-- 结果页面 -->
        <div class="result-screen" id="resultScreen">
            <h2 class="result-title">🎉 太棒了！</h2>
            <div class="result-stars" id="resultStars">⭐⭐⭐</div>
            <p class="result-score">得分: <span id="finalScore">0</span> | 用时: <span id="finalTime">0</span>秒</p>
            <div class="result-buttons">
                <button class="result-btn" onclick="restartGame()">再玩一次</button>
                <button class="result-btn" onclick="showLevelScreen()">选择关卡</button>
            </div>
        </div>
    </div>

    <script>
        // 游戏数据
        const gameData = {
            animals: [
                { char: '猫', icon: '🐱', pinyin: 'māo' },
                { char: '狗', icon: '🐶', pinyin: 'gǒu' },
                { char: '鸟', icon: '🐦', pinyin: 'niǎo' },
                { char: '鱼', icon: '🐟', pinyin: 'yú' },
                { char: '兔', icon: '🐰', pinyin: 'tù' },
                { char: '马', icon: '🐴', pinyin: 'mǎ' }
            ],
            fruits: [
                { char: '苹', icon: '🍎', pinyin: 'píng' },
                { char: '橙', icon: '🍊', pinyin: 'chéng' },
                { char: '香', icon: '🍌', pinyin: 'xiāng' },
                { char: '西', icon: '🍉', pinyin: 'xī' },
                { char: '草', icon: '🍓', pinyin: 'cǎo' },
                { char: '葡', icon: '🍇', pinyin: 'pú' }
            ]
        };

        // 游戏状态
        let currentLevel = '';
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let isPaused = false;
        let gameStartTime = 0;

        // 切换页面
        function showScreen(screenId) {
            document.querySelectorAll('.home-screen, .level-screen, .game-screen, .result-screen').forEach(screen => {
                screen.style.display = 'none';
            });
            document.getElementById(screenId).style.display = 'block';
        }

        function showLevelScreen() {
            showScreen('levelScreen');
        }

        // 开始游戏
        function startGame(level) {
            currentLevel = level;
            matchedPairs = 0;
            score = 0;
            timeLeft = 60;
            flippedCards = [];
            isPaused = false;
            gameStartTime = Date.now();

            document.getElementById('score').textContent = '0';
            document.getElementById('timer').textContent = '60';

            createCards(level);
            showScreen('gameScreen');
            startTimer();
        }

        // 创建卡片
        function createCards(level) {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            const levelData = gameData[level];
            const cardPairs = [];

            // 创建汉字卡片和图标卡片对
            levelData.forEach(item => {
                cardPairs.push({ type: 'char', content: item.char, pinyin: item.pinyin, pairId: item.char });
                cardPairs.push({ type: 'icon', content: item.icon, pinyin: item.pinyin, pairId: item.char });
            });

            // 打乱顺序
            cards = shuffleArray(cardPairs);

            // 渲染卡片
            cards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card';
                cardElement.dataset.index = index;
                cardElement.dataset.pairId = card.pairId;
                cardElement.onclick = () => flipCard(index);

                cardElement.innerHTML = `
                    <div class="card-back">❓</div>
                    <div class="card-content">${card.content}</div>
                `;

                grid.appendChild(cardElement);
            });
        }

        // 打乱数组
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 翻牌
        function flipCard(index) {
            if (isPaused) return;
            if (flippedCards.length >= 2) return;
            if (flippedCards.includes(index)) return;
            if (cards[index].matched) return;

            const cardElement = document.querySelector(`[data-index="${index}"]`);
            cardElement.classList.add('flipped');
            flippedCards.push(index);

            // 播放翻牌音效（使用 Web Audio API 模拟）
            playSound(800, 0.1, 0.1);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        // 检查匹配
        function checkMatch() {
            const [index1, index2] = flippedCards;
            const card1 = cards[index1];
            const card2 = cards[index2];

            if (card1.pairId === card2.pairId) {
                // 匹配成功
                setTimeout(() => {
                    const element1 = document.querySelector(`[data-index="${index1}"]`);
                    const element2 = document.querySelector(`[data-index="${index2}"]`);
                    element1.classList.add('matched');
                    element2.classList.add('matched');
                    element1.classList.remove('flipped');
                    element2.classList.remove('flipped');

                    card1.matched = true;
                    card2.matched = true;

                    score += 100;
                    document.getElementById('score').textContent = score;
                    matchedPairs++;

                    // 播放成功音效
                    playSound(1200, 0.2, 0.15);
                    createParticles(element1);
                    createParticles(element2);

                    flippedCards = [];

                    // 检查是否完成
                    if (matchedPairs === cards.length / 2) {
                        endGame();
                    }
                }, 600);
            } else {
                // 匹配失败
                setTimeout(() => {
                    const element1 = document.querySelector(`[data-index="${index1}"]`);
                    const element2 = document.querySelector(`[data-index="${index2}"]`);
                    element1.classList.remove('flipped');
                    element2.classList.remove('flipped');

                    // 播放失败音效
                    playSound(300, 0.1, 0.2);

                    flippedCards = [];
                }, 1000);
            }
        }

        // 计时器
        function startTimer() {
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    timeLeft--;
                    document.getElementById('timer').textContent = timeLeft;

                    if (timeLeft <= 0) {
                        endGame();
                    }
                }
            }, 1000);
        }

        // 暂停游戏
        function pauseGame() {
            isPaused = !isPaused;
            event.target.textContent = isPaused ? '继续' : '暂停';
        }

        // 结束游戏
        function endGame() {
            clearInterval(timerInterval);
            const totalTime = Math.floor((Date.now() - gameStartTime) / 1000);
            const finalScore = score + (timeLeft * 10);

            document.getElementById('finalScore').textContent = finalScore;
            document.getElementById('finalTime').textContent = totalTime;

            // 计算星星
            let stars = '⭐';
            if (finalScore >= 500) stars = '⭐⭐';
            if (finalScore >= 800) stars = '⭐⭐⭐';
            document.getElementById('resultStars').textContent = stars;

            showScreen('resultScreen');
        }

        // 重新开始
        function restartGame() {
            startGame(currentLevel);
        }

        // 创建粒子效果
        function createParticles(element) {
            const rect = element.getBoundingClientRect();
            const particles = ['✨', '🌟', '💫', '⭐'];

            for (let i = 0; i < 5; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = particles[Math.floor(Math.random() * particles.length)];
                particle.style.left = rect.left + rect.width / 2 + (Math.random() - 0.5) * 100 + 'px';
                particle.style.top = rect.top + rect.height / 2 + 'px';
                particle.style.animationDelay = Math.random() * 0.5 + 's';
                document.body.appendChild(particle);

                setTimeout(() => particle.remove(), 3000);
            }
        }

        // 播放音效
        function playSound(frequency, duration, volume) {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            } catch (e) {
                // 音频播放失败时静默处理
            }
        }
    </script>
</body>
</html>
