    <script>
    // ==================== 完整的韩语课程数据 ====================
    const CourseData = {
        // 课程列表
        courses: [
            {
                id: 'hangeul-basic',
                title: '韩语字母入门',
                titleKr: '한글 기초',
                description: '从零开始学习韩语字母系统，包括元音、辅音和收音',
                level: '入门',
                duration: '约4小时',
                lessonsCount: 16,
                category: '字母',
                icon: 'fa-font',
                color: 'primary',
                chapters: [
                    {
                        id: 'ch1',
                        title: '第一章：韩语字母概述',
                        lessons: [
                            {
                                id: 'l1-1',
                                title: '1.1 韩语字母系统简介',
                                type: 'lecture',
                                duration: '10分钟',
                                content: {
                                    text: `
                                        <h2 class="text-2xl font-bold mb-4">韩语字母系统简介</h2>
                                        <p class="mb-4">韩语字母（한글，Hangeul）是朝鲜王朝世宗大王于1443年创制的文字系统。它是世界上少数几个人工创制的文字系统之一，以其科学性和易学性著称。</p>
                                        
                                        <h3 class="text-xl font-semibold mb-3 mt-6">韩语字母的特点</h3>
                                        <ul class="list-disc list-inside space-y-2 mb-4">
                                            <li><strong>科学性</strong>：字母的形状模仿发音器官的形态</li>
                                            <li><strong>系统性</strong>：元音和辅音有规律可循</li>
                                            <li><strong>组合性</strong>：字母组合成音节方块</li>
                                            <li><strong>易学性</strong>：几小时内就能学会基本读写</li>
                                        </ul>

                                        <h3 class="text-xl font-semibold mb-3 mt-6">字母组成</h3>
                                        <p class="mb-4">韩语字母由以下部分组成：</p>
                                        <div class="grid grid-cols-3 gap-4 mb-6">
                                            <div class="bg-primary/10 p-4 rounded-lg text-center">
                                                <div class="text-3xl font-kr font-bold text-primary mb-2">ㅏㅑㅓㅕ</div>
                                                <div class="text-sm text-gray-600">元音 (21个)</div>
                                            </div>
                                            <div class="bg-secondary/10 p-4 rounded-lg text-center">
                                                <div class="text-3xl font-kr font-bold text-secondary mb-2">ㄱㄴㄷㄹ</div>
                                                <div class="text-sm text-gray-600">辅音 (19个)</div>
                                            </div>
                                            <div class="bg-accent/10 p-4 rounded-lg text-center">
                                                <div class="text-3xl font-kr font-bold text-accent mb-2">ㄱㄴㄷㅁ</div>
                                                <div class="text-sm text-gray-600">收音 (27个)</div>
                                            </div>
                                        </div>

                                        <h3 class="text-xl font-semibold mb-3 mt-6">音节结构</h3>
                                        <p class="mb-4">韩语音节以方块形式呈现，基本结构为：</p>
                                        <div class="bg-gray-100 p-6 rounded-lg mb-4">
                                            <div class="flex items-center justify-center space-x-8">
                                                <div class="text-center">
                                                    <div class="text-5xl font-kr font-bold text-primary mb-2">한</div>
                                                    <div class="text-sm text-gray-500">辅音+元音+收音</div>
                                                </div>
                                                <div class="text-2xl">=</div>
                                                <div class="text-center">
                                                    <div class="text-4xl font-kr mb-1">ㅎ</div>
                                                    <div class="text-xs text-gray-500">辅音</div>
                                                </div>
                                                <div class="text-2xl">+</div>
                                                <div class="text-center">
                                                    <div class="text-4xl font-kr mb-1">ㅏ</div>
                                                    <div class="text-xs text-gray-500">元音</div>
                                                </div>
                                                <div class="text-2xl">+</div>
                                                <div class="text-center">
                                                    <div class="text-4xl font-kr mb-1">ㄴ</div>
                                                    <div class="text-xs text-gray-500">收音</div>
                                                </div>
                                            </div>
                                        </div>
                                    `
                                }
                            },
                            {
                                id: 'l1-2',
                                title: '1.2 基本元音',
                                type: 'lecture',
                                duration: '20分钟',
                                content: {
                                    text: `
                                        <h2 class="text-2xl font-bold mb-4">基本元音</h2>
                                        <p class="mb-4">韩语有10个基本元音，它们是构成韩语音节的核心。每个元音都有其特定的发音方式和口型。</p>
                                        
                                        <h3 class="text-xl font-semibold mb-4 mt-6">十个基本元音</h3>
                                        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
                                            <div class="bg-white shadow-md rounded-lg p-4 text-center">
                                                <div class="korean-letter font-kr text-primary">ㅏ</div>
                                                <div class="text-lg font-semibold mt-2">a</div>
                                                <div class="text-sm text-gray-500">啊</div>
                                            </div>
                                            <div class="bg-white shadow-md rounded-lg p-4 text-center">
                                                <div class="korean-letter font-kr text-primary">ㅑ</div>
                                                <div class="text-lg font-semibold mt-2">ya</div>
                                                <div class="text-sm text-gray-500">呀</div>
                                            </div>
                                            <div class="bg-white shadow-md rounded-lg p-4 text-center">
                                                <div class="korean-letter font-kr text-primary">ㅓ</div>
                                                <div class="text-lg font-semibold mt-2">eo</div>
                                                <div class="text-sm text-gray-500">额</div>
                                            </div>
                                            <div class="bg-white shadow-md rounded-lg p-4 text-center">
                                                <div class="korean-letter font-kr text-primary">ㅕ</div>
                                                <div class="text-lg font-semibold mt-2">yeo</div>
                                                <div class="text-sm text-gray-500">哟</div>
                                            </div>
                                            <div class="bg-white shadow-md rounded-lg p-4 text-center">
                                                <div class="korean-letter font-kr text-primary">ㅗ</div>
                                                <div class="text-lg font-semibold mt-2">o</div>
                                                <div class="text-sm text-gray-500">哦</div>
                                            </div>
                                            <div class="bg-white shadow-md rounded-lg p-4 text-center">
                                                <div class="korean-letter font-kr text-primary">ㅛ</div>
                                                <div class="text-lg font-semibold mt-2">yo</div>
                                                <div class="text-sm text-gray-500">哟</div>
                                            </div>
                                            <div class="bg-white shadow-md rounded-lg p-4 text-center">
                                                <div class="korean-letter font-kr text-primary">ㅜ</div>
                                                <div class="text-lg font-semibold mt-2">u</div>
                                                <div class="text-sm text-gray-500">呜</div>
                                            </div>
                                            <div class="bg-white shadow-md rounded-lg p-4 text-center">
                                                <div class="korean-letter font-kr text-primary">ㅠ</div>
                                                <div class="text-lg font-semibold mt-2">yu</div>
                                                <div class="text-sm text-gray-500">由</div>
                                            </div>
                                            <div class="bg-white shadow-md rounded-lg p-4 text-center">
                                                <div class="korean-letter font-kr text-primary">ㅡ</div>
                                                <div class="text-lg font-semibold mt-2">eu</div>
                                                <div class="text-sm text-gray-500">呃</div>
                                            </div>
                                            <div class="bg-white shadow-md rounded-lg p-4 text-center">
                                                <div class="korean-letter font-kr text-primary">ㅣ</div>
                                                <div class="text-lg font-semibold mt-2">i</div>
                                                <div class="text-sm text-gray-500">一</div>
                                            </div>
                                        </div>

                                        <h3 class="text-xl font-semibold mb-3 mt-6">发音要点</h3>
                                        <div class="space-y-3">
                                            <div class="bg-blue-50 p-4 rounded-lg">
                                                <h4 class="font-semibold text-blue-700">ㅏ (a)</h4>
                                                <p class="text-sm">嘴巴自然张开，舌头放平，发出"啊"的声音。是韩语中最基本的元音。</p>
                                            </div>
                                            <div class="bg-green-50 p-4 rounded-lg">
                                                <h4 class="font-semibold text-green-700">ㅓ (eo)</h4>
                                                <p class="text-sm">嘴巴半开，舌头稍向后缩，发出介于"额"和"奥"之间的声音。</p>
                                            </div>
                                            <div class="bg-yellow-50 p-4 rounded-lg">
                                                <h4 class="font-semibold text-yellow-700">ㅗ (o) / ㅜ (u)</h4>
                                                <p class="text-sm">ㅗ嘴唇圆拢向前，ㅜ嘴唇圆拢向后，类似中文的"哦"和"呜"。</p>
                                            </div>
                                            <div class="bg-purple-50 p-4 rounded-lg">
                                                <h4 class="font-semibold text-purple-700">ㅡ (eu)</h4>
                                                <p class="text-sm">独特的元音，嘴唇向两侧拉开，发出类似呃的声音，中文中没有对应音。</p>
                                            </div>
                                        </div>
                                    `
                                }
                            },
                            {
                                id: 'l1-3',
                                title: '1.3 基本元音练习',
                                type: 'practice',
                                duration: '15分钟',
                                content: {
                                    exercises: [
                                        {
                                            type: 'choice',
                                            question: '以下哪个字母的发音是 "a" (啊)？',
                                            options: ['ㅏ', 'ㅓ', 'ㅗ', 'ㅜ'],
                                            correct: 0,
                                            explanation: 'ㅏ 发音为 "a"，嘴巴自然张开，是最基本的元音。'
                                        },
                                        {
                                            type: 'choice',
                                            question: 'ㅗ 的发音接近中文的哪个字？',
                                            options: ['啊', '哦', '呜', '一'],
                                            correct: 1,
                                            explanation: 'ㅗ 发音为 "o"，嘴唇圆拢向前，类似中文的"哦"。'
                                        },
                                        {
                                            type: 'choice',
                                            question: '以下哪个是 "yu" 的韩语元音？',
                                            options: ['ㅑ', 'ㅕ', 'ㅠ', 'ㅛ'],
                                            correct: 2,
                                            explanation: 'ㅠ 发音为 "yu"，是 ㅜ (u) + ㅣ (i) 的组合。'
                                        },
                                        {
                                            type: 'match',
                                            question: '请将韩语元音与对应的罗马音匹配：',
                                            pairs: [['ㅏ', 'a'], ['ㅓ', 'eo'], ['ㅗ', 'o'], ['ㅜ', 'u'], ['ㅣ', 'i']]
                                        },
                                        {
                                            type: 'choice',
                                            question: 'ㅡ 这个元音的特点是什么？',
                                            options: ['嘴巴张开最大', '嘴唇圆拢', '嘴巴向两侧拉开', '嘴唇紧闭'],
                                            correct: 2,
                                            explanation: 'ㅡ 是韩语独特的元音，发音时嘴巴向两侧拉开，发出类似"呃"的声音。'
                                        }
                                    ]
                                }
                            }
                        ]
                    },
                    {
                        id: 'ch2',
                        title: '第二章：基本辅音',
                        lessons: [
                            {
                                id: 'l2-1',
                                title: '2.1 基本辅音 ㄱㄴㄷㄹㅁ',
                                type: 'lecture',
                                duration: '20分钟',
                                content: {
                                    text: `
                                        <h2 class="text-2xl font-bold mb-4">基本辅音 ㄱㄴㄷㄹㅁ</h2>
                                        <p class="mb-4">韩语辅音按照发音器官的形状设计，非常具有科学性。让我们先学习五个最基本的辅音。</p>
                                        
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                            <div class="bg-white shadow-md rounded-lg p-6">
                                                <div class="flex items-center justify-between mb-4">
                                                    <div class="korean-letter font-kr text-secondary">ㄱ</div>
                                                    <div class="text-right">
                                                        <div class="text-xl font-semibold">g/k</div>
                                                        <div class="text-sm text-gray-500">ㄱ = 根 (gēn)</div>
                                                    </div>
                                                </div>
                                                <p class="text-sm text-gray-600">发音时舌根抵住软腭，然后突然放开，让气流冲出。词首发k音，词中词尾发g音。</p>
                                                <div class="mt-3 bg-gray-50 p-3 rounded">
                                                    <span class="text-sm font-semibold">例词：</span>
                                                    <span class="font-kr">가요 (kayo) 가다 (gada)</span>
                                                </div>
                                            </div>
                                            <div class="bg-white shadow-md rounded-lg p-6">
                                                <div class="flex items-center justify-between mb-4">
                                                    <div class="korean-letter font-kr text-secondary">ㄴ</div>
                                                    <div class="text-right">
                                                        <div class="text-xl font-semibold">n</div>
                                                        <div class="text-sm text-gray-500">ㄴ = 你 (nǐ)</div>
                                                    </div>
                                                </div>
                                                <p class="text-sm text-gray-600">发音时舌尖抵住上齿龈，让气流从鼻腔流出。与中文"你"的声母相同。</p>
                                                <div class="mt-3 bg-gray-50 p-3 rounded">
                                                    <span class="text-sm font-semibold">例词：</span>
                                                    <span class="font-kr">나무 (namu) 너 (neo)</span>
                                                </div>
                                            </div>
                                            <div class="bg-white shadow-md rounded-lg p-6">
                                                <div class="flex items-center justify-between mb-4">
                                                    <div class="korean-letter font-kr text-secondary">ㄷ</div>
                                                    <div class="text-right">
                                                        <div class="text-xl font-semibold">d/t</div>
                                                        <div class="text-sm text-gray-500">ㄷ = 得 (dé)</div>
                                                    </div>
                                                </div>
                                                <p class="text-sm text-gray-600">发音时舌尖抵住上齿龈，然后突然放开。词首发t音，词中词尾发d音。</p>
                                                <div class="mt-3 bg-gray-50 p-3 rounded">
                                                    <span class="text-sm font-semibold">例词：</span>
                                                    <span class="font-kr">다리 (tari) 두 (du)</span>
                                                </div>
                                            </div>
                                            <div class="bg-white shadow-md rounded-lg p-6">
                                                <div class="flex items-center justify-between mb-4">
                                                    <div class="korean-letter font-kr text-secondary">ㄹ</div>
                                                    <div class="text-right">
                                                        <div class="text-xl font-semibold">r/l</div>
                                                        <div class="text-sm text-gray-500">ㄹ = 混合r和l</div>
                                                    </div>
                                                </div>
                                                <p class="text-sm text-gray-600">发音介于r和l之间。词首接近r，词尾接近l。是韩语学习者需重点练习的音。</p>

        getDefault() {
            return {
                user: { name: '学习者', studyHours: 0, coursesCompleted: 0, completedLessons: [], quizResults: {}, badges: ['beginner'], vocab: [], postsCount: 0, contribPoints: 0 },
                courseProgress: {},

                favorites: [],
                wordBank: [],
                following: [],
                myPosts: [],
                songScores: {},
                contributions: [],
                contribPoints: 0,
                videoProgress: {}
            };
        },
        get() { return JSON.parse(localStorage.getItem(this.key) || '{}'); },
        set(d) { localStorage.setItem(this.key, JSON.stringify(d)); },
        update(path, val) { const d = this.get(); const keys = path.split('.'); let t = d; for (let i = 0; i < keys.length - 1; i++) t = t[keys[i]]; t[keys[keys.length - 1]] = val; this.set(d); return d; },
        push(path, item) { const d = this.get(); const keys = path.split('.'); let t = d; for (let i = 0; i < keys.length - 1; i++) t = t[keys[i]]; t[keys[keys.length - 1]].push(item); this.set(d); return d; }
    };

    // ==================== UI 工具 ====================
    const UI = {
        toast(msg, type = 'success') {
            const c = document.getElementById('toast-container');
            const colors = { success: 'bg-green-500', error: 'bg-red-500', info: 'bg-primary' };
            const icons = { success: 'fa-check', error: 'fa-exclamation', info: 'fa-info' };
            const el = document.createElement('div');
            el.className = `${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg flex items-center space-x-2 toast-enter`;
            el.innerHTML = `<i class="fas ${icons[type]}"></i><span>${msg}</span>`;
            c.appendChild(el);
            setTimeout(() => { el.classList.remove('toast-enter'); el.classList.add('toast-exit'); setTimeout(() => el.remove(), 300); }, 2500);
        },
        formatNumber(n) { return n >= 10000 ? (n/10000).toFixed(1)+'万' : n >= 1000 ? (n/1000).toFixed(1)+'k' : n; },
        modal(title, content, onConfirm, onCancel) {
            const existing = document.getElementById('ui-modal'); if (existing) existing.remove();
            const el = document.createElement('div'); el.id = 'ui-modal'; el.className = 'fixed inset-0 z-[70] flex items-center justify-center modal-bg';
            el.innerHTML = `<div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4 overflow-hidden slide-in"><div class="px-6 py-4 border-b"><h3 class="text-lg font-bold">${title}</h3></div><div class="px-6 py-4">${content}</div><div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3"><button id="modal-cancel" class="px-4 py-2 text-gray-600 hover:bg-gray-200 rounded-lg">取消</button><button id="modal-confirm" class="px-4 py-2 bg-primary text-white rounded-lg hover:opacity-90">确定</button></div></div>`;
            document.body.appendChild(el);
            document.getElementById('modal-confirm').onclick = () => { el.remove(); if (onConfirm) onConfirm(); };
            document.getElementById('modal-cancel').onclick = () => { el.remove(); if (onCancel) onCancel(); };
            el.onclick = (e) => { if (e.target === el) { el.remove(); if (onCancel) onCancel(); } };
        },
        openSearch() {
            const existing = document.getElementById('search-modal'); if (existing) { existing.remove(); return; }
            const el = document.createElement('div'); el.id = 'search-modal'; el.className = 'fixed inset-0 z-[70] flex items-start justify-center pt-24 modal-bg';
            el.innerHTML = `<div class="bg-white rounded-xl shadow-2xl max-w-lg w-full mx-4 overflow-hidden slide-in"><div class="p-4 border-b flex items-center space-x-3"><i class="fas fa-search text-gray-400"></i><input type="text" id="search-input" placeholder="搜索视频、艺人、课程..." class="flex-grow outline-none text-lg" autofocus></div><div id="search-results" class="max-h-80 overflow-y-auto p-2"></div></div>`;
            document.body.appendChild(el);
            const input = document.getElementById('search-input');
            input.focus();
            input.oninput = () => {
                const q = input.value.trim().toLowerCase();
                const results = document.getElementById('search-results');
                if (!q) { results.innerHTML = '<div class="p-4 text-center text-gray-500">输入关键词开始搜索</div>'; return; }
                let html = '';
                const videos = MockData.videos.filter(v => v.title.toLowerCase().includes(q) || v.artist.toLowerCase().includes(q));
                const artists = MockData.artists.filter(a => a.name.toLowerCase().includes(q));
                const courses = CourseData.courses.filter(c => c.title.includes(q));
                if (videos.length) { html += '<div class="text-xs text-gray-500 px-3 py-2">视频</div>' + videos.map(v => `<div class="px-3 py-2 hover:bg-gray-100 rounded cursor-pointer flex items-center space-x-3" onclick="app.router.navigate('learn');document.getElementById('search-modal')?.remove();"><span class="text-xl">${v.thumbnail}</span><div><div class="font-semibold text-sm">${v.title}</div><div class="text-xs text-gray-500">${v.artist}</div></div></div>`).join(''); }
                if (artists.length) { html += '<div class="text-xs text-gray-500 px-3 py-2">艺人</div>' + artists.map(a => `<div class="px-3 py-2 hover:bg-gray-100 rounded cursor-pointer flex items-center space-x-3" onclick="app.router.navigate('bias','${a.id}');document.getElementById('search-modal')?.remove();"><div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold" style="background:${a.color}">${a.name[0]}</div><div><div class="font-semibold text-sm">${a.name}</div><div class="text-xs text-gray-500">${a.biasName}</div></div></div>`).join(''); }
                if (courses.length) { html += '<div class="text-xs text-gray-500 px-3 py-2">课程</div>' + courses.map(c => `<div class="px-3 py-2 hover:bg-gray-100 rounded cursor-pointer flex items-center space-x-3" onclick="app.router.navigate('course-detail','${c.id}');document.getElementById('search-modal')?.remove();"><i class="fas ${c.icon} text-primary"></i><div><div class="font-semibold text-sm">${c.title}</div><div class="text-xs text-gray-500">${c.description}</div></div></div>`).join(''); }
                if (!html) html = '<div class="p-4 text-center text-gray-500">未找到相关结果</div>';
                results.innerHTML = html;
            };
            input.oninput();
            el.onclick = (e) => { if (e.target === el) el.remove(); };
        }
    };

    // ==================== 路由 ====================
    const Router = {
        currentPage: 'home',
        routes: ['home','discover','learn','courses','course-detail','lesson','community','bias','profile'],
        init() {
            window.addEventListener('hashchange', () => this.handleHash());
            this.handleHash();
            document.querySelectorAll('.nav-item, nav.fixed.bottom-0 a').forEach(el => {
                el.addEventListener('click', (e) => { e.preventDefault(); this.navigate(el.dataset.page); });
            });
            document.getElementById('mobile-menu-btn')?.addEventListener('click', () => document.getElementById('mobile-menu').classList.toggle('hidden'));
        },
        handleHash() {
            const hash = location.hash.replace('#/', '') || 'home';
            const parts = hash.split('/');
            const page = parts[0];
            if (page === 'course-detail' && parts[1]) this.render('course-detail', parts[1]);
            else if (page === 'lesson' && parts[1] && parts[2]) this.render('lesson', parts[1], parts[2]);
            else if (page === 'bias' && parts[1]) this.render('bias', parts[1]);
            else this.render(this.routes.includes(page) ? page : 'home');
        },
        navigate(page, param1, param2) {
            let hash = '#/' + page;
            if (param1) hash += '/' + param1;
            if (param2) hash += '/' + param2;
            location.hash = hash;
        },
        render(page, param1, param2) {
            this.currentPage = page;
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.toggle('nav-active', el.dataset.page === page);
                el.classList.toggle('text-gray-600', el.dataset.page !== page);
            });
            document.querySelectorAll('nav.fixed.bottom-0 a').forEach(el => {
                el.classList.toggle('text-primary', el.dataset.page === page);
                el.classList.toggle('text-gray-400', el.dataset.page !== page);
            });
            document.getElementById('mobile-menu')?.classList.add('hidden');
            const main = document.getElementById('main-content');
            const renderers = { home: Pages.home, discover: Pages.discover, learn: Pages.learn, courses: Pages.courses, 'course-detail': Pages.courseDetail, lesson: Pages.lesson, community: Pages.community, bias: Pages.bias, profile: Pages.profile };
            main.innerHTML = renderers[page] ? renderers[page](param1, param2) : Pages.home();
            window.scrollTo(0, 0);
        }
    };

            return `<div class="slide-in"><div class="bg-${course.color} text-white py-12"><div class="max-w-7xl mx-auto px-4"><div class="flex items-center space-x-4 mb-4"><button onclick="app.router.navigate('courses')" class="p-2 bg-white/20 rounded-lg hover:bg-white/30"><i class="fas fa-arrow-left"></i></button><h1 class="text-3xl font-bold">${course.title}</h1></div><p class="font-kr text-xl opacity-80 mb-4">${course.titleKr}</p><div class="flex items-center space-x-6 text-sm opacity-80"><span><i class="fas fa-clock mr-2"></i>${course.duration}</span><span><i class="fas fa-book mr-2"></i>${course.lessonsCount}课时</span><span><i class="fas fa-signal mr-2"></i>${course.level}</span></div></div></div><div class="max-w-7xl mx-auto px-4 py-8">${course.chapters.map((ch, chi) => `<div class="mb-8"><h2 class="text-xl font-bold mb-4">${ch.title}</h2><div class="space-y-2">${ch.lessons.map((l, li) => {
                const lessonId = l.id;
                const isCompleted = db.user.completedLessons.includes(lessonId);
                const isCurrent = !isCompleted && (li === 0 || db.user.completedLessons.includes(ch.lessons[li-1].id));

            const course = CourseData.courses.find(c => c.id === courseId);
            if (!course) return '<div class="p-8">课程不存在</div>';
            let lesson = null;
            let chapterIndex = 0, lessonIndex = 0;
            course.chapters.forEach((ch, ci) => { ch.lessons.forEach((l, li) => { if (l.id === lessonId) { lesson = l; chapterIndex = ci; lessonIndex = li; } }); });

            const allLessons = course.chapters.flatMap(ch => ch.lessons);

            const nextLesson = currentIdx < allLessons.length - 1 ? allLessons[currentIdx + 1] : null;

            const isCompleted = db.user.completedLessons.includes(lessonId);

                const state = db.quizState || { currentIndex: 0, answers: {}, finished: false, score: 0 };
                const ex = exercises[state.currentIndex] || exercises[0];

                return `<div class="slide-in"><div class="bg-${course.color} text-white py-8"><div class="max-w-4xl mx-auto px-4"><div class="flex items-center space-x-4"><button onclick="app.router.navigate('course-detail','${courseId}')" class="p-2 bg-white/20 rounded-lg hover:bg-white/30"><i class="fas fa-arrow-left"></i></button><div><div class="text-sm opacity-80">${course.title} · ${lesson.title}</div><div class="text-lg font-bold">${lesson.type === 'test' ? '综合测试' : '课后练习'}</div></div></div></div></div><div class="max-w-4xl mx-auto px-4 py-8">${!state.finished ? `<div class="bg-white rounded-xl shadow-md p-6"><div class="flex items-center justify-between mb-6"><span class="text-sm text-gray-500">第 ${state.currentIndex + 1} / ${exercises.length} 题</span><div class="flex-grow h-2 bg-gray-200 rounded-full mx-4"><div class="h-full bg-${course.color} rounded-full" style="width:${(state.currentIndex / exercises.length) * 100}%"></div></div></div>${ex.type === 'choice' ? `<div class="mb-8"><h3 class="text-xl font-semibold mb-6">${ex.question}</h3><div class="space-y-3">${ex.options.map((opt, i) => `<div class="quiz-option border-2 border-gray-200 rounded-lg p-4 ${state.answers[state.currentIndex] === i ? 'selected' : ''}" onclick="app.quiz.selectAnswer(${i})"><span class="font-semibold mr-3">${['A','B','C','D'][i]}.</span>${opt}</div>`).join('')}</div></div>` : ex.type === 'fill' ? `<div class="mb-8"><h3 class="text-xl font-semibold mb-6">${ex.question}</h3><input type="text" id="fill-answer" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg text-lg focus:outline-none focus:border-${course.color}" placeholder="请输入答案" value="${state.answers[state.currentIndex] || ''}" oninput="app.quiz.saveFillAnswer(this.value)"></div>` : ex.type === 'match' ? `<div class="mb-8"><h3 class="text-xl font-semibold mb-6">${ex.question}</h3><div class="grid grid-cols-2 gap-4">${ex.pairs.map((p, i) => `<div class="bg-gray-50 p-3 rounded-lg"><span class="font-kr font-bold">${p[0]}</span></div><div class="bg-gray-50 p-3 rounded-lg">${p[1]}</div>`).join('')}</div></div>` : ''}<div class="flex justify-between"><button onclick="app.quiz.prevQuestion()" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50" ${state.currentIndex === 0 ? 'disabled' : ''}>上一题</button><button onclick="app.quiz.nextQuestion()" class="px-6 py-2 bg-${course.color} text-white rounded-lg hover:opacity-90">${state.currentIndex === exercises.length - 1 ? '提交' : '下一题'}</button></div></div>` : `<div class="bg-white rounded-xl shadow-md p-8 text-center"><div class="w-24 h-24 mx-auto bg-${course.color}/10 rounded-full flex items-center justify-center mb-6"><span class="text-4xl font-bold text-${course.color}">${state.score}</span></div><h3 class="text-2xl font-bold mb-2">测试完成</h3><p class="text-gray-600 mb-6">正确率 ${Math.round(state.score / exercises.length * 100)}%</p><div class="flex justify-center space-x-4"><button onclick="app.quiz.restart()" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">重新测试</button><button onclick="app.quiz.finishAndContinue()" class="px-6 py-2 bg-${course.color} text-white rounded-lg hover:opacity-90">继续学习</button></div></div>`}</div></div>`;
            }

            return `<div class="slide-in"><div class="bg-${course.color} text-white py-8"><div class="max-w-4xl mx-auto px-4"><div class="flex items-center space-x-4"><button onclick="app.router.navigate('course-detail','${courseId}')" class="p-2 bg-white/20 rounded-lg hover:bg-white/30"><i class="fas fa-arrow-left"></i></button><div><div class="text-sm opacity-80">${course.title}</div><div class="text-lg font-bold">${lesson.title}</div></div></div></div></div><div class="max-w-4xl mx-auto px-4 py-8"><div class="bg-white rounded-xl shadow-md p-6">${lesson.content.text}</div><div class="flex justify-between mt-6">${prevLesson ? `<button onclick="app.router.navigate('lesson','${courseId}','${prevLesson.id}')" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50"><i class="fas fa-chevron-left mr-2"></i>上一课</button>` : '<div></div>'}<button onclick="app.lesson.complete('${courseId}','${lessonId}')" class="px-6 py-2 bg-${course.color} text-white rounded-lg hover:opacity-90">${isCompleted ? '已学完' : '标记为已学完'}</button>${nextLesson ? `<button onclick="app.router.navigate('lesson','${courseId}','${nextLesson.id}')" class="px-6 py-2 bg-${course.color} text-white rounded-lg hover:opacity-90">下一课<i class="fas fa-chevron-right ml-2"></i></button>` : '<button onclick="app.router.navigate(\'course-detail\',\''+courseId+'\')" class="px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600">完成课程</button>'}</div></div></div>`;
        },
        community() {
            const db = DB.get();

            let posts = [...MockData.posts, ...(db.myPosts||[])];
            if (tagFilter !== 'all') posts = posts.filter(p => p.tag === tags[tagFilter] || (tagFilter==='material'&&p.tag==='物料') || (tagFilter==='comeback'&&p.tag==='回归') || (tagFilter==='discuss'&&p.tag==='讨论') || (tagFilter==='trade'&&p.tag==='换物') || (tagFilter==='study'&&p.tag==='学习'));
            return `<div class="max-w-7xl mx-auto px-4 py-8 slide-in">
                <div class="flex items-center justify-between mb-6">

                <div class="grid lg:grid-cols-4 gap-6">
                    <div class="lg:col-span-3 space-y-4">
                        ${posts.map(p => `<div class="bg-white rounded-xl shadow-md p-5">
                            <div class="flex items-center justify-between mb-3">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold">${p.avatar}</div>

                                <button onclick="app.community.toggleSave('${p.id}')" class="flex items-center space-x-1 hover:text-primary ${p.saved?'text-primary':''}"><i class="fas fa-bookmark"></i><span>${p.saved?'已收藏':'收藏'}</span></button>
                                <span class="flex items-center space-x-1"><i class="fas fa-comment"></i><span>${p.comments}</span></span>

                    </div>
                    <div class="space-y-4">
                        <div class="bg-white rounded-xl shadow-md p-4">
                            <h3 class="font-bold mb-3">热门话题</h3>
                            <div class="space-y-2">
                                ${['IVE世界巡演','NewJeans日本出道','aespa正规一辑','LE SSERAFIM回归'].map((t,i) => `<div class="flex items-center space-x-2 text-sm"><span class="text-primary font-bold">${i+1}</span><span class="text-gray-700">${t}</span></div>`).join('')}
                            </div>
                        </div>
                        <div class="bg-white rounded-xl shadow-md p-4">
                            <h3 class="font-bold mb-3">推荐站子</h3>
                            <div class="space-y-2">
                                ${MockData.artists.map(a => `<div class="flex items-center justify-between"><div class="flex items-center space-x-2"><div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold" style="background:${a.color}">${a.name[0]}</div><span class="text-sm">${a.name}_CN</span></div><button onclick="app.bias.toggleFollow('${a.id}')" class="text-xs px-2 py-1 rounded ${(db.following||[]).includes(a.id)?'bg-gray-200 text-gray-600':'bg-primary text-white'}">${(db.following||[]).includes(a.id)?'已关注':'关注'}</button></div>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        },
        bias(artistId) {
            const db = DB.get();
            const artist = MockData.artists.find(a => a.id === artistId) || MockData.artists[0];
            const isFollowing = (db.following || []).includes(artist.id);
            const artistAlbums = MockData.albums.filter(al => al.artist === artist.name);
            return `<div class="slide-in">
                <div class="h-48 bg-gradient-to-r from-primary to-secondary relative">
                    <div class="absolute inset-0 flex items-center justify-center text-white/20 text-9xl font-bold">${artist.name[0]}</div>
                    <div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black/60 to-transparent">
                        <div class="max-w-7xl mx-auto flex items-end justify-between">
                            <div class="text-white">
                                <div class="font-kr text-2xl font-bold mb-1">${artist.biasName}</div>
                                <div class="text-sm opacity-80">${artist.fans} 粉丝 · ${artist.albumCount} 张专辑</div>
                            </div>
                            <button onclick="app.bias.toggleFollow('${artist.id}')" class="px-6 py-2 rounded-full font-bold ${isFollowing?'bg-white text-primary':'bg-primary text-white'}">${isFollowing?'<i class="fas fa-check mr-2"></i>已关注':'<i class="fas fa-plus mr-2"></i>关注'}</button>
                        </div>
                    </div>
                </div>
                <div class="max-w-7xl mx-auto px-4 py-8">
                    <div class="grid md:grid-cols-3 gap-6 mb-8">
                        <div class="bg-white rounded-xl shadow-md p-5"><h3 class="font-bold mb-3">成员</h3><div class="flex flex-wrap gap-2">${artist.members.map(m=>`<span class="px-3 py-1 bg-primary/10 text-primary text-sm rounded-full">${m}</span>`).join('')}</div></div>
                        <div class="bg-white rounded-xl shadow-md p-5"><h3 class="font-bold mb-3">近期行程</h3><p class="text-sm text-gray-600">${artist.upcoming}</p></div>
                        <div class="bg-white rounded-xl shadow-md p-5"><h3 class="font-bold mb-3">出道日期</h3><p class="text-sm text-gray-600">${artist.debut}</p></div>
                    </div>
                    <h2 class="text-xl font-bold mb-4">专辑库</h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        ${artistAlbums.length?artistAlbums.map(al=>`<div class="bg-white rounded-xl shadow-md p-4 text-center"><div class="text-4xl mb-3">${al.cover}</div><div class="font-bold text-sm">${al.title}</div><div class="text-xs text-gray-500 mt-1">${al.date}</div></div>`).join(''):'<div class="text-gray-400 col-span-4 text-center py-8">暂无专辑数据</div>'}
                    </div>
                    <div class="mt-8">
                        <h2 class="text-xl font-bold mb-4">其他艺人</h2>
                        <div class="flex space-x-4 overflow-x-auto scrollbar-hide">
                            ${MockData.artists.filter(a=>a.id!==artist.id).map(a=>`<button onclick="app.router.navigate('bias','${a.id}')" class="flex-shrink-0 p-4 bg-white rounded-xl shadow-md text-center hover:shadow-lg"><div class="w-14 h-14 mx-auto rounded-full flex items-center justify-center text-white font-bold mb-2" style="background:${a.color}">${a.name[0]}</div><div class="font-semibold text-sm">${a.name}</div></button>`).join('')}
                        </div>
                    </div>
                </div>
            </div>`;
        },
        profile() {
            const db = DB.get();
            const totalCompleted = db.user.completedLessons.length;
            const favs = db.favorites || [];
            const favVideos = MockData.videos.filter(v => favs.includes(v.id));
            const words = db.wordBank || [];
            const following = db.following || [];
            const followedArtists = MockData.artists.filter(a => following.includes(a.id));
            return `<div class="max-w-7xl mx-auto px-4 py-8 slide-in">
                <div class="bg-white rounded-xl shadow-md p-6 mb-8">
                    <div class="flex items-center space-x-6">
                        <div class="w-20 h-20 bg-primary rounded-full flex items-center justify-center text-white text-3xl font-bold">${db.user.name[0]}</div>
                        <div><h1 class="text-2xl font-bold">${db.user.name}</h1><p class="text-gray-600">韩语学习者</p><div class="flex items-center space-x-6 mt-2"><span class="text-sm text-gray-500"><i class="fas fa-book mr-1"></i>已完成 ${totalCompleted} 课时</span><span class="text-sm text-gray-500"><i class="fas fa-clock mr-1"></i>学习 ${db.user.studyHours} 小时</span><span class="text-sm text-gray-500"><i class="fas fa-heart mr-1"></i>收藏 ${favs.length}</span></div></div>
                    </div>
                </div>
                <div class="grid md:grid-cols-4 gap-4 mb-8">
                    <div class="bg-white rounded-xl shadow-md p-4 text-center"><div class="text-2xl font-bold text-primary">${db.user.studyHours}</div><div class="text-xs text-gray-500">学习时长(小时)</div></div>
                    <div class="bg-white rounded-xl shadow-md p-4 text-center"><div class="text-2xl font-bold text-secondary">${totalCompleted}</div><div class="text-xs text-gray-500">完成课时</div></div>
                    <div class="bg-white rounded-xl shadow-md p-4 text-center"><div class="text-2xl font-bold text-accent">${words.length}</div><div class="text-xs text-gray-500">生词数</div></div>
                    <div class="bg-white rounded-xl shadow-md p-4 text-center"><div class="text-2xl font-bold text-green-500">${Object.keys(db.songScores||{}).length}</div><div class="text-xs text-gray-500">跟唱歌曲</div></div>
                </div>
                ${followedArtists.length?`<div class="mb-8"><h2 class="text-xl font-bold mb-4">我的本命</h2><div class="flex space-x-4 overflow-x-auto scrollbar-hide">${followedArtists.map(a=>`<button onclick="app.router.navigate('bias','${a.id}')" class="flex-shrink-0 p-4 bg-white rounded-xl shadow-md text-center"><div class="w-14 h-14 mx-auto rounded-full flex items-center justify-center text-white font-bold mb-2" style="background:${a.color}">${a.name[0]}</div><div class="font-semibold text-sm">${a.name}</div></button>`).join('')}</div></div>`:''}
                <div class="mb-8">
                    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">我的收藏</h2>${favVideos.length?`<button onclick="app.discover.clearFavs()" class="text-sm text-red-500">清空</button>`:''}</div>
                    ${favVideos.length?`<div class="grid md:grid-cols-2 lg:grid-cols-4 gap-4">${favVideos.map(v=>`<div class="bg-white rounded-xl shadow-md overflow-hidden"><div class="h-24 bg-gradient-to-br from-primary/20 to-secondary/20 flex items-center justify-center"><span class="text-3xl">${v.thumbnail}</span></div><div class="p-3"><div class="font-bold text-sm">${v.title}</div><div class="flex items-center justify-between mt-2"><span class="text-xs text-gray-500">${v.artist}</span><button onclick="app.discover.toggleFav('${v.id}')" class="text-red-500 text-xs"><i class="fas fa-heart"></i></button></div></div></div>`).join('')}</div>`:'<div class="text-center text-gray-400 py-8">暂无收藏，去发现页看看吧</div>'}
                </div>
                <div class="mb-8">
                    <h2 class="text-xl font-bold mb-4">成就徽章</h2>
                    <div class="grid grid-cols-3 md:grid-cols-6 gap-4">
                        ${MockData.badges.map(b => `<div class="text-center cursor-pointer" onclick="UI.toast('${b.name}: ${b.desc}','info')"><div class="w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-2 ${b.unlocked?'bg-primary/10 text-primary':'bg-gray-200 text-gray-400'}"><i class="fas ${b.icon} text-2xl"></i></div><div class="text-xs font-semibold">${b.name}</div></div>`).join('')}
                    </div>
                </div>
                <div>
                    <h2 class="text-xl font-bold mb-4">学习进度</h2>
                    <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">${CourseData.courses.map(c => { const progress = db.courseProgress[c.id] || { completed: 0, total: c.lessonsCount }; const pct = Math.round(progress.completed / progress.total * 100); return `<div class="bg-white rounded-xl shadow-md p-4"><div class="flex items-center space-x-3 mb-3"><div class="w-10 h-10 bg-${c.color}/10 rounded-full flex items-center justify-center"><i class="fas ${c.icon} text-${c.color}"></i></div><span class="font-semibold">${c.title}</span></div><div class="flex items-center space-x-2"><div class="flex-grow h-2 bg-gray-200 rounded-full"><div class="h-full bg-${c.color} rounded-full" style="width:${pct}%"></div></div><span class="text-sm text-gray-500">${pct}%</span></div></div>`; }).join('')}</div>
                </div>
            </div>`;
        }
    };

    // ==================== 功能模块 ====================
    const Lesson = {
        complete(courseId, lessonId) {
            const db = DB.get();
            if (!db.user.completedLessons.includes(lessonId)) {
                db.user.completedLessons.push(lessonId);
                const course = CourseData.courses.find(c => c.id === courseId);
                if (course) {
                    const completedCount = course.chapters.flatMap(ch => ch.lessons).filter(l => db.user.completedLessons.includes(l.id)).length;
                    db.courseProgress[courseId] = { completed: completedCount, total: course.lessonsCount };
                }
                db.user.studyHours += 0.25;
                DB.set(db);
                UI.toast('课程已标记为完成！');
                Router.render('lesson', courseId, lessonId);
            } else {
                UI.toast('已经学过这节课了', 'info');
            }
        }
    };

    const Quiz = {
        selectAnswer(idx) {
            const db = DB.get();
            if (!db.quizState) db.quizState = { currentIndex: 0, answers: {}, finished: false, score: 0 };
            db.quizState.answers[db.quizState.currentIndex] = idx;
            DB.set(db);
            Router.render('lesson', Router.currentPage, location.hash.split('/')[2]);
        },
        saveFillAnswer(val) {
            const db = DB.get();
            if (!db.quizState) db.quizState = { currentIndex: 0, answers: {}, finished: false, score: 0 };
            db.quizState.answers[db.quizState.currentIndex] = val;
            DB.set(db);
        },
        prevQuestion() {
            const db = DB.get();
            if (db.quizState && db.quizState.currentIndex > 0) {
                db.quizState.currentIndex--;
                DB.set(db);
                Router.render('lesson', Router.currentPage, location.hash.split('/')[2]);
            }
        },
        nextQuestion() {
            const db = DB.get();
            if (!db.quizState) return;
            const hash = location.hash.split('/');
            const courseId = hash[1];
            const lessonId = hash[2];
            const course = CourseData.courses.find(c => c.id === courseId);
            if (!course) return;
            let lesson;
            course.chapters.forEach(ch => ch.lessons.forEach(l => { if (l.id === lessonId) lesson = l; }));
            if (!lesson) return;
            const exercises = lesson.content.exercises;

            if (db.quizState.currentIndex < exercises.length - 1) {
                db.quizState.currentIndex++;
                DB.set(db);
                Router.render('lesson', courseId, lessonId);
            } else {
                let score = 0;
                exercises.forEach((ex, i) => {
                    const ans = db.quizState.answers[i];
                    if (ex.type === 'choice' && ans === ex.correct) score++;
                    if (ex.type === 'fill' && ans && ans.trim().toLowerCase() === ex.answer.toLowerCase()) score++;
                });
                db.quizState.finished = true;
                db.quizState.score = score;
                DB.set(db);
                Router.render('lesson', courseId, lessonId);
            }
        },
        restart() {
            const db = DB.get();
            db.quizState = { currentIndex: 0, answers: {}, finished: false, score: 0 };
            DB.set(db);
            Router.render('lesson', Router.currentPage, location.hash.split('/')[2]);
        },
        finishAndContinue() {
            const db = DB.get();
            const hash = location.hash.split('/');
            const courseId = hash[1];
            const lessonId = hash[2];
            const course = CourseData.courses.find(c => c.id === courseId);
            if (!course) return;
            let chapterIdx = 0, lessonIdx = 0;
            course.chapters.forEach((ch, ci) => ch.lessons.forEach((l, li) => { if (l.id === lessonId) { chapterIdx = ci; lessonIdx = li; } }));
            if (!db.user.completedLessons.includes(lessonId)) {
                db.user.completedLessons.push(lessonId);
                const completedCount = course.chapters.flatMap(ch => ch.lessons).filter(l => db.user.completedLessons.includes(l.id)).length;
                db.courseProgress[courseId] = { completed: completedCount, total: course.lessonsCount };
            }
            db.quizState = null;
            DB.set(db);
            Router.navigate('course-detail', courseId);
        }
    };

    // ==================== App 初始化 ====================
    const Discover = {
        toggleFav(videoId) {
            const db = DB.get();
            db.favorites = db.favorites || [];
            const idx = db.favorites.indexOf(videoId);
            if (idx > -1) { db.favorites.splice(idx, 1); UI.toast('已取消收藏'); }
            else { db.favorites.push(videoId); UI.toast('已添加到学习清单'); }
            DB.set(db);
            Router.render(Router.currentPage);
        },
        clearFavs() {
            UI.modal('确认清空', '确定要清空所有收藏吗？', () => {
                const db = DB.get(); db.favorites = []; DB.set(db); UI.toast('收藏已清空'); Router.render('profile');
            });
        }
    };

    const Learn = {
        togglePlay() {
            window._watchPlaying = !window._watchPlaying;
            if (window._watchPlaying) {
                window._watchTimer = setInterval(() => {
                    window._watchProgress = (window._watchProgress || 0) + 1;
                    if (window._watchProgress >= 30) { window._watchProgress = 0; }
                    Router.render('learn');
                }, 1000);
            } else {
                clearInterval(window._watchTimer);
            }
            Router.render('learn');
        },
        seek(e, el) {
            const rect = el.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            window._watchProgress = Math.floor(pct * 30);
            Router.render('learn');
        },
        seekTo(time) {
            window._watchProgress = time;
            Router.render('learn');
        },
        showWord(word) {
            const meanings = { '풍덩':'噗通（拟声词）', '빠지다':'陷入', '절로':'自然而然地', '넘어가다':'越过', '다이빙':'diving（潜水）', '사랑':'爱情', '눈빛':'眼神', '알다':'知道', '원하다':'想要', '가져가다':'拿走', '모두':'全部' };
            const meaning = meanings[word] || '点击查看详情';
            const db = DB.get();
            db.wordBank = db.wordBank || [];
            const exists = db.wordBank.find(w => w.word === word);
            UI.modal(word, `<p class="text-gray-600 mb-4">${meaning}</p>`, () => {
                if (!exists) { db.wordBank.push({ word, meaning }); DB.set(db); UI.toast('已添加到生词本'); Router.render('learn'); }
                else { UI.toast('生词本中已有此词', 'info'); }
            });
        },
        removeWord(word) {
            const db = DB.get();
            db.wordBank = db.wordBank.filter(w => w.word !== word);
            DB.set(db); UI.toast('已移除'); Router.render('learn');
        },
        toggleFullscreen() {
            const el = document.querySelector('.aspect-video');
            if (el) el.requestFullscreen?.() || UI.toast('全屏模式');
        },
        startSing() {
            window._isSinging = true; window._singIndex = 0;
            window._singTimer = setInterval(() => {
                window._singIndex = (window._singIndex || 0) + 1;
                const song = MockData.lyrics[window._singSong || 'v1'];
                if (window._singIndex >= song.lines.length) {
                    clearInterval(window._singTimer);
                    window._isSinging = false;
                    const score = Math.floor(Math.random() * 30) + 70;
                    const db = DB.get(); db.songScores = db.songScores || {}; db.songScores[window._singSong || 'v1'] = Math.max(score, db.songScores[window._singSong || 'v1'] || 0); DB.set(db);
                    UI.modal('跟唱完成！', `<div class="text-center"><div class="text-5xl font-bold text-primary mb-2">${score}</div><div class="text-gray-500">综合评分</div></div>`, () => Router.render('learn'));
                }
                Router.render('learn');
            }, 2000);
            Router.render('learn');
        },
        stopSing() {
            window._isSinging = false; clearInterval(window._singTimer);
            Router.render('learn');
        },
        resetScore(songId) {
            const db = DB.get(); delete (db.songScores || {})[songId]; DB.set(db); UI.toast('已重置'); Router.render('learn');
        },
        claimTask(taskId) {
            const db = DB.get();
            db.contributions = db.contributions || [];
            if (!db.contributions.includes(taskId)) {
                db.contributions.push(taskId);
                const task = MockData.translations.find(t => t.id === taskId);
                db.contribPoints = (db.contribPoints || 0) + (task ? task.points : 0);
                DB.set(db); UI.toast('任务领取成功！'); Router.render('learn');
            }
        }
    };

    const Community = {
        showPostForm() {
            UI.modal('发布帖子', `<div class="space-y-3"><input id="post-title" class="w-full border rounded-lg px-3 py-2" placeholder="标题"><textarea id="post-content" class="w-full border rounded-lg px-3 py-2 h-24" placeholder="内容"></textarea><select id="post-tag" class="w-full border rounded-lg px-3 py-2"><option value="讨论">讨论</option><option value="物料">物料</option><option value="换物">换物</option><option value="学习">学习</option></select></div>`, () => {
                const title = document.getElementById('post-title').value.trim();
                const content = document.getElementById('post-content').value.trim();
                const tag = document.getElementById('post-tag').value;
                if (!title || !content) { UI.toast('请填写标题和内容', 'error'); return; }
                const db = DB.get(); db.myPosts = db.myPosts || [];
                db.myPosts.unshift({ id: 'my'+Date.now(), author: db.user.name, avatar: db.user.name[0], tag, title, content, likes: 0, liked: false, saved: false, comments: 0, time: '刚刚' });
                db.user.postsCount = (db.user.postsCount || 0) + 1;
                DB.set(db); UI.toast('发布成功！'); Router.render('community');
            });
        },
        toggleLike(postId) {
            const post = MockData.posts.find(p => p.id === postId) || (DB.get().myPosts || []).find(p => p.id === postId);
            if (post) { post.liked = !post.liked; post.likes += post.liked ? 1 : -1; Router.render('community'); }
        },
        toggleSave(postId) {
            const post = MockData.posts.find(p => p.id === postId) || (DB.get().myPosts || []).find(p => p.id === postId);
            if (post) { post.saved = !post.saved; Router.render('community'); UI.toast(post.saved ? '已收藏' : '已取消收藏'); }
        }
    };

    const Bias = {
        toggleFollow(artistId) {
            const db = DB.get(); db.following = db.following || [];
            const idx = db.following.indexOf(artistId);
            if (idx > -1) { db.following.splice(idx, 1); UI.toast('已取消关注'); }
            else { db.following.push(artistId); UI.toast('关注成功！'); }
            DB.set(db); Router.render(Router.currentPage);
        }
    };

    const app = { router: Router, lesson: Lesson, quiz: Quiz, discover: Discover, learn: Learn, community: Community, bias: Bias, init() { DB.init(); Router.init(); } };
    app.init();
    </script>
</body>
</html>`
