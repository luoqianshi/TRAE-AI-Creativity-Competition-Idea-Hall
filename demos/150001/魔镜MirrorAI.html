<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>魔镜MirrorAI · 智能化妆镜</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Segoe UI', Roboto, -apple-system, sans-serif;
            background: #1a1418;
            background-image: radial-gradient(ellipse at 30% 20%, #2d2228 0%, #0f0c0e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* ===== 镜子主体 ===== */
        .mirror {
            max-width: 420px;
            width: 100%;
            background: linear-gradient(145deg, #2a2126, #161114);
            border-radius: 48px 48px 32px 32px;
            padding: 20px 20px 28px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 215, 215, 0.06) inset,
                0 0 40px rgba(255, 180, 180, 0.04);
            position: relative;
            transition: all 0.3s;
        }

        /* 镜面高光装饰 */
        .mirror::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 30%;
            width: 40%;
            height: 6px;
            background: radial-gradient(ellipse, rgba(255, 220, 220, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(4px);
            pointer-events: none;
        }

        /* ===== 镜面屏幕 ===== */
        .screen {
            background: #0d0a0c;
            border-radius: 28px;
            padding: 20px 18px 18px;
            box-shadow: 0 0 0 1px rgba(255, 200, 200, 0.05) inset, 0 8px 32px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        /* 屏幕顶部光晕 */
        .screen::after {
            content: '';
            position: absolute;
            top: -40px;
            left: -20%;
            width: 140%;
            height: 80px;
            background: radial-gradient(ellipse, rgba(255, 200, 240, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ===== 状态栏 ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 16px;
            position: relative;
            z-index: 2;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.3);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.85);
            }
        }

        .status-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .status-label strong {
            color: #f0e0e8;
            font-weight: 500;
        }

        .status-time {
            color: rgba(255, 255, 255, 0.35);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* ===== 头像 / 检测区域 ===== */
        .face-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 18px;
            position: relative;
            z-index: 2;
        }

        .face-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 30%, #3d2e36, #1f171c);
            border: 2px solid rgba(255, 200, 200, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            position: relative;
            transition: all 0.4s;
            user-select: none;
        }

        .face-avatar .scan-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            border-top-color: rgba(255, 180, 220, 0.25);
            animation: spin-scan 4s linear infinite;
        }

        @keyframes spin-scan {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .face-status-text {
            margin-top: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .face-status-text span {
            color: #c8b0bc;
            font-weight: 400;
        }

        /* ===== 分区检测网格 ===== */
        .zone-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 18px;
            position: relative;
            z-index: 2;
        }

        .zone-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 12px 6px 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s;
            cursor: default;
        }

        .zone-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 200, 200, 0.08);
        }

        .zone-icon {
            font-size: 20px;
            display: block;
            margin-bottom: 4px;
        }

        .zone-name {
            color: rgba(255, 255, 255, 0.35);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .zone-status {
            font-size: 11px;
            font-weight: 500;
            margin-top: 4px;
            display: block;
        }

        .zone-status.ok {
            color: #4ade80;
        }
        .zone-status.warn {
            color: #fbbf24;
        }
        .zone-status.fix {
            color: #f87171;
        }

        /* ===== 建议面板 ===== */
        .suggestion-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 16px;
            border-left: 3px solid rgba(255, 180, 200, 0.2);
            position: relative;
            z-index: 2;
        }

        .suggestion-title {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 6px;
        }

        .suggestion-text {
            color: #e8dce2;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.6;
        }

        .suggestion-text .highlight {
            color: #f9b8d4;
            font-weight: 500;
        }

        /* ===== 心情选择器 ===== */
        .mood-section {
            margin-bottom: 16px;
            position: relative;
            z-index: 2;
        }

        .mood-label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 10px;
            display: block;
        }

        .mood-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mood-btn {
            flex: 1;
            min-width: 60px;
            padding: 10px 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            text-align: center;
        }

        .mood-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 200, 200, 0.1);
            color: rgba(255, 255, 255, 0.6);
        }

        .mood-btn.active {
            background: rgba(255, 180, 200, 0.10);
            border-color: rgba(255, 180, 200, 0.2);
            color: #f0dce6;
            box-shadow: 0 0 20px rgba(255, 180, 200, 0.04);
        }

        .mood-btn .emoji {
            display: block;
            font-size: 22px;
            margin-bottom: 4px;
        }

        /* ===== 发型推荐 ===== */
        .hair-section {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            position: relative;
            z-index: 2;
        }

        .hair-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 12px 6px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s;
        }

        .hair-card .icon {
            font-size: 26px;
            display: block;
            margin-bottom: 4px;
        }

        .hair-card .name {
            color: rgba(255, 255, 255, 0.35);
            font-size: 11px;
        }

        .hair-card .recommend {
            color: #f9b8d4;
            font-size: 10px;
            font-weight: 500;
            margin-top: 4px;
            display: block;
            opacity: 0.7;
        }

        .hair-card.active {
            background: rgba(255, 180, 200, 0.06);
            border-color: rgba(255, 180, 200, 0.12);
        }

        /* ===== 语音辅助开关 ===== */
        .accessibility-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 6px;
            position: relative;
            z-index: 2;
        }

        .accessibility-row .label {
            color: rgba(255, 255, 255, 0.35);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .accessibility-row .label .icon {
            font-size: 18px;
        }

        .toggle {
            width: 44px;
            height: 24px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            padding: 0;
        }

        .toggle.active {
            background: rgba(74, 222, 128, 0.2);
        }

        .toggle .thumb {
            width: 18px;
            height: 18px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: all 0.3s;
        }

        .toggle.active .thumb {
            left: 23px;
            background: #4ade80;
            box-shadow: 0 0 16px rgba(74, 222, 128, 0.2);
        }

        /* ===== 底部 ===== */
        .footer-brand {
            text-align: center;
            margin-top: 16px;
            color: rgba(255, 255, 255, 0.08);
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 440px) {
            .mirror {
                padding: 14px 14px 20px;
                border-radius: 32px 32px 24px 24px;
            }
            .screen {
                padding: 14px 12px 14px;
                border-radius: 20px;
            }
            .zone-grid {
                gap: 5px;
            }
            .zone-card {
                padding: 10px 4px 8px;
            }
            .mood-btn {
                min-width: 48px;
                font-size: 12px;
                padding: 8px 4px;
            }
            .mood-btn .emoji {
                font-size: 18px;
            }
            .face-avatar {
                width: 80px;
                height: 80px;
                font-size: 38px;
            }
            .suggestion-text {
                font-size: 14px;
            }
        }

        @media (max-width: 360px) {
            .zone-grid {
                grid-template-columns: 1fr 1fr;
            }
            .hair-section {
                flex-wrap: wrap;
            }
            .hair-card {
                flex: 1 1 40%;
            }
        }
    </style>
</head>
<body>

    <div class="mirror">
        <div class="screen">

            <!-- ===== 状态栏 ===== -->
            <div class="status-bar">
                <div class="status-left">
                    <div class="status-dot"></div>
                    <span class="status-label">AI 检测中 · <strong>已就绪</strong></span>
                </div>
                <span class="status-time">14:28</span>
            </div>

            <!-- ===== 面部区域 ===== -->
            <div class="face-area">
                <div class="face-avatar">
                    <span>🧑‍🦰</span>
                    <div class="scan-ring"></div>
                </div>
                <div class="face-status-text">
                    <span>✨ 面部识别完成 · 5 个区域待优化</span>
                </div>
            </div>

            <!-- ===== 分区检测 ===== -->
            <div class="zone-grid">
                <div class="zone-card">
                    <span class="zone-icon">👁️</span>
                    <span class="zone-name">眼妆</span>
                    <span class="zone-status ok">✓ 均匀</span>
                </div>
                <div class="zone-card">
                    <span class="zone-icon">🫦</span>
                    <span class="zone-name">唇部</span>
                    <span class="zone-status warn">⚠ 补色</span>
                </div>
                <div class="zone-card">
                    <span class="zone-icon">🫧</span>
                    <span class="zone-name">底妆</span>
                    <span class="zone-status ok">✓ 服帖</span>
                </div>
                <div class="zone-card">
                    <span class="zone-icon">🌸</span>
                    <span class="zone-name">腮红</span>
                    <span class="zone-status fix">↻ 调整</span>
                </div>
                <div class="zone-card">
                    <span class="zone-icon">👃</span>
                    <span class="zone-name">修容</span>
                    <span class="zone-status warn">⚠ 淡化</span>
                </div>
                <div class="zone-card">
                    <span class="zone-icon">🌙</span>
                    <span class="zone-name">高光</span>
                    <span class="zone-status ok">✓ 自然</span>
                </div>
            </div>

            <!-- ===== 智能建议 ===== -->
            <div class="suggestion-box" id="suggestionBox">
                <div class="suggestion-title">💡 智能建议</div>
                <div class="suggestion-text" id="suggestionText">
                    腮红位置偏高了 <span class="highlight">下调 1cm</span>，唇部中央补一点光泽感更显饱满。
                </div>
            </div>

            <!-- ===== 心情选妆容 ===== -->
            <div class="mood-section">
                <span class="mood-label">🎭 今天的心情 · 选一个吧</span>
                <div class="mood-options">
                    <button class="mood-btn active" data-mood="happy">
                        <span class="emoji">😊</span> 开心
                    </button>
                    <button class="mood-btn" data-mood="gentle">
                        <span class="emoji">🌷</span> 温柔
                    </button>
                    <button class="mood-btn" data-mood="cool">
                        <span class="emoji">🔥</span> 酷飒
                    </button>
                    <button class="mood-btn" data-mood="lazy">
                        <span class="emoji">🛋️</span> 慵懒
                    </button>
                </div>
            </div>

            <!-- ===== 发型推荐 ===== -->
            <div class="hair-section">
                <div class="hair-card active">
                    <span class="icon">💇‍♀️</span>
                    <span class="name">锁骨发</span>
                    <span class="recommend">★ 推荐</span>
                </div>
                <div class="hair-card">
                    <span class="icon">🎀</span>
                    <span class="name">高马尾</span>
                    <span class="recommend">适配</span>
                </div>
                <div class="hair-card">
                    <span class="icon">🌊</span>
                    <span class="name">大波浪</span>
                    <span class="recommend">适配</span>
                </div>
            </div>

            <!-- ===== 无障碍语音辅助 ===== -->
            <div class="accessibility-row">
                <span class="label">
                    <span class="icon">🔊</span> 语音辅助播报
                </span>
                <button class="toggle active" id="voiceToggle" aria-label="切换语音辅助">
                    <span class="thumb"></span>
                </button>
            </div>

            <div class="footer-brand">✦ MIRROR AI · 魔镜 ✦</div>

        </div>
    </div>

    <script>
        // ============================================================
        //  交互逻辑
        // ============================================================

        // -------- 心情切换 + 动态建议 --------
        const moodButtons = document.querySelectorAll('.mood-btn');
        const suggestionText = document.getElementById('suggestionText');

        const moodMap = {
            happy: {
                makeup: '蜜桃色系腮红 + 水光唇釉，元气满满！',
                hair: '高马尾或丸子头，活力加分',
                suggestion: '腮红打在苹果肌最高点，唇部选镜面质感的#03 蜜桃色。'
            },
            gentle: {
                makeup: '豆沙色腮红 + 柔雾唇膏，温柔知性',
                hair: '锁骨发或低盘发，优雅气质',
                suggestion: '腮红从颧骨斜向轻扫，唇部选低饱和度的玫瑰豆沙色。'
            },
            cool: {
                makeup: '橘棕调腮红 + 哑光吃土色唇，高级感拉满',
                hair: '大波浪或拳击辫，气场全开',
                suggestion: '腮红打在颧骨下方修容位置，唇部选哑光#05 脏橘色。'
            },
            lazy: {
                makeup: '裸色腮红 + 有色润唇膏， effortless chic',
                hair: '自然披发或低马尾，随性慵懒',
                suggestion: '腮红轻扫在鼻梁和脸颊，唇部选自然提气色的润唇膏即可。'
            }
        };

        moodButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                // 移除所有 active
                moodButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const mood = this.dataset.mood;
                const data = moodMap[mood];
                if (data) {
                    suggestionText.innerHTML = `
                            ${data.suggestion}
                            <br style="margin-top:4px; display:block;" />
                            <span style="font-size:13px; opacity:0.6;">💄 ${data.makeup} · 发型建议：${data.hair}</span>
                        `;
                }
            });
        });

        // -------- 语音辅助开关 --------
        const toggleBtn = document.getElementById('voiceToggle');
        let voiceOn = true;

        toggleBtn.addEventListener('click', function() {
            voiceOn = !voiceOn;
            this.classList.toggle('active');
            // 模拟语音反馈
            const statusLabel = document.querySelector('.status-label');
            if (voiceOn) {
                statusLabel.innerHTML = 'AI 检测中 · <strong>已就绪</strong>';
                // 简单语音提示 (浏览器支持时)
                if ('speechSynthesis' in window) {
                    const msg = new SpeechSynthesisUtterance('语音辅助已开启，随时为您播报妆容建议');
                    msg.lang = 'zh-CN';
                    msg.rate = 0.9;
                    speechSynthesis.speak(msg);
                }
            } else {
                statusLabel.innerHTML = 'AI 检测中 · <strong>语音已关闭</strong>';
                if ('speechSynthesis' in window) {
                    const msg = new SpeechSynthesisUtterance('语音辅助已关闭');
                    msg.lang = 'zh-CN';
                    msg.rate = 0.9;
                    speechSynthesis.speak(msg);
                }
            }
        });

        // -------- 发型卡片交互 (视觉反馈) --------
        const hairCards = document.querySelectorAll('.hair-card');
        hairCards.forEach(card => {
            card.addEventListener('click', function() {
                hairCards.forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                // 更新建议中的发型部分
                const hairName = this.querySelector('.name')?.textContent || '这款发型';
                const currentSuggestion = suggestionText.innerHTML;
                // 只在包含"发型建议"时替换，保持友好
                if (currentSuggestion.includes('发型建议')) {
                    const newSuggestion = currentSuggestion.replace(/发型建议：.*?(?=<\/span>|$)/, `发型建议：${hairName} ✨`);
                    suggestionText.innerHTML = newSuggestion;
                }
            });
        });

        // -------- 模拟实时检测 (动态状态变化) --------
        const zoneStatuses = document.querySelectorAll('.zone-status');
        const zoneData = [
            { el: zoneStatuses[0], states: ['✓ 均匀', '✓ 完美', '✓ 自然'] },
            { el: zoneStatuses[1], states: ['⚠ 补色', '⚠ 滋润', '⚠ 勾边'] },
            { el: zoneStatuses[2], states: ['✓ 服帖', '✓ 细腻', '✓ 通透'] },
            { el: zoneStatuses[3], states: ['↻ 调整', '↻ 上移', '↻ 轻扫'] },
            { el: zoneStatuses[4], states: ['⚠ 淡化', '⚠ 晕染', '⚠ 过渡'] },
            { el: zoneStatuses[5], states: ['✓ 自然', '✓ 通透', '✓ 细腻'] },
        ];

        // 每8秒轮换一次状态文字 (模拟AI持续分析)
        setInterval(() => {
            zoneData.forEach((item, index) => {
                if (item.el) {
                    const current = item.el.textContent;
                    const states = item.states;
                    let nextIdx = (states.indexOf(current) + 1) % states.length;
                    // 如果当前文字不在列表中，随机选一个
                    if (!states.includes(current)) {
                        nextIdx = Math.floor(Math.random() * states.length);
                    }
                    item.el.textContent = states[nextIdx];
                    // 更新颜色类
                    const text = states[nextIdx];
                    item.el.className = 'zone-status';
                    if (text.startsWith('✓')) {
                        item.el.classList.add('ok');
                    } else if (text.startsWith('⚠')) {
                        item.el.classList.add('warn');
                    } else if (text.startsWith('↻')) {
                        item.el.classList.add('fix');
                    }
                }
            });

            // 同时更新面部状态文字
            const faceStatus = document.querySelector('.face-status-text span');
            if (faceStatus) {
                const msgs = [
                    '✨ 面部识别完成 · 实时追踪中',
                    '🔄 正在分析妆容细节...',
                    '✨ 检测到 4 个区域可优化',
                    '💄 建议调整腮红与唇部',
                ];
                const randomMsg = msgs[Math.floor(Math.random() * msgs.length)];
                faceStatus.textContent = randomMsg;
            }
        }, 8000);

        // -------- 初始化语音 (页面加载时播报欢迎) --------
        window.addEventListener('load', function() {
            if ('speechSynthesis' in window && voiceOn) {
                setTimeout(() => {
                    const msg = new SpeechSynthesisUtterance('欢迎使用魔镜 MirrorAI，我是您的智能化妆助理');
                    msg.lang = 'zh-CN';
                    msg.rate = 0.85;
                    speechSynthesis.speak(msg);
                }, 600);
            }
        });

        // 点击页面任意处可停止当前语音 (避免烦人)
        document.addEventListener('click', function() {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
            }
        });

    </script>

</body>
</html>
