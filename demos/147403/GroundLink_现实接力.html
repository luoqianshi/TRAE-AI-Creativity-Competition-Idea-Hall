<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GroundLink 现实接力</title>
  <style>
    :root {
      --bg: #f6f7f8;
      --panel: #fff;
      --text: #15171c;
      --muted: #68707d;
      --line: #e2e6ea;
      --soft: #f0f2f4;
      --black: #111318;
      --green: #16803c;
      --green-soft: #eaf7ee;
      --orange: #b35b00;
      --orange-soft: #fff4e5;
      --red: #b42318;
      --red-soft: #fff0ee;
      --focus: #2563eb;
      --radius: 8px;
      --nav: 236px;
      --shadow: 0 8px 24px rgba(17, 19, 24, .055);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { overflow-x: hidden; font-size: 14px; line-height: 1.5; }
    button, input, textarea, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    button:disabled { opacity: .56; cursor: not-allowed; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    .app { min-height: 100vh; display: grid; grid-template-columns: var(--nav) minmax(0, 1fr); }
    .sidebar { background: #fff; border-right: 1px solid var(--line); padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow: auto; z-index: 10; }
    .brand { display: flex; gap: 10px; align-items: center; padding: 0 8px 16px; border-bottom: 1px solid var(--line); }
    .brand-mark { width: 34px; height: 34px; border: 1px solid var(--black); border-radius: 8px; display: grid; place-items: center; flex: 0 0 auto; }
    .brand h1 { margin: 0; font-size: 15px; line-height: 1.2; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .nav { display: grid; gap: 6px; margin-top: 16px; }
    .nav button { width: 100%; min-height: 42px; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; background: transparent; color: var(--muted); text-align: left; }
    .nav button:not(:disabled):hover { background: var(--soft); color: var(--text); }
    .nav button.active { background: var(--black); color: #fff; }
    .nav button.locked { color: #9aa2ad; }
    .side-note { margin: 18px 4px 0; padding: 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font-size: 12px; background: #fff; }

    .main { min-width: 0; }
    .topbar { min-height: 64px; position: sticky; top: 0; z-index: 8; background: rgba(246,247,248,.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 10px 24px; }
    .page-title { min-width: 0; }
    .page-title h2 { margin: 0; font-size: 17px; line-height: 1.2; }
    .page-title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 54vw; }
    .top-actions { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .segmented { display: grid; grid-template-columns: 1fr 1fr; min-width: 230px; background: #e9ecef; border-radius: 8px; padding: 3px; gap: 3px; }
    .segmented button { border-radius: 6px; padding: 8px 10px; background: transparent; color: var(--muted); white-space: nowrap; }
    .segmented button.active { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(17,19,24,.08); }
    .content { width: 100%; max-width: 1240px; margin: 0 auto; padding: 20px 24px 36px; min-width: 0; }

    .relay-top { display: grid; gap: 14px; margin-bottom: 16px; }
    .progress-card, .action-card, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
    .progress-card { padding: 14px 16px; }
    .stage-row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; align-items: start; }
    .stage { min-width: 0; position: relative; }
    .stage::after { content: ""; position: absolute; left: 28px; right: -8px; top: 10px; height: 1px; background: var(--line); z-index: 0; }
    .stage:last-child::after { display: none; }
    .stage-head { display: flex; align-items: center; gap: 7px; min-width: 0; position: relative; z-index: 1; }
    .stage-dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; flex: 0 0 auto; color: var(--muted); }
    .stage.done .stage-dot { background: var(--green); border-color: var(--green); color: #fff; }
    .stage.current .stage-dot { background: var(--orange); border-color: var(--orange); color: #fff; }
    .stage-title { font-weight: 700; font-size: 13px; white-space: normal; word-break: break-word; }
    .stage small { color: var(--muted); display: block; margin: 5px 0 0 27px; font-size: 12px; }
    .stage-count { margin-top: 10px; color: var(--muted); font-size: 12px; }

    .action-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, .74fr); gap: 16px; }
    .action-card { padding: 16px; display: grid; gap: 12px; }
    .action-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .action-header h3 { margin: 0; font-size: 15px; }
    .action-header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .summary-item { border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
    .summary-item span { color: var(--muted); font-size: 12px; display: block; }
    .summary-item strong { display: block; margin-top: 3px; word-break: break-word; }

    .handoff { padding: 16px; }
    .handoff h3 { margin: 0 0 10px; font-size: 15px; }
    .event-list { display: grid; gap: 10px; max-height: 320px; overflow: auto; padding-right: 4px; }
    .event { display: grid; grid-template-columns: 46px 82px minmax(0,1fr); gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .event:last-child { border-bottom: 0; padding-bottom: 0; }
    .event time, .event b { font-size: 12px; color: var(--muted); }
    .event span { word-break: break-word; }

    .grid { display: grid; gap: 16px; }
    .grid.two { grid-template-columns: minmax(0, 1.12fr) minmax(300px, .88fr); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .panel-header { padding: 16px 16px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .panel-header h3 { margin: 0; font-size: 15px; }
    .panel-header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .panel-body { padding: 16px; min-width: 0; }

    .field { display: grid; gap: 6px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    label { font-size: 12px; color: #394150; font-weight: 700; }
    input, textarea, select { width: 100%; min-width: 0; border: 1px solid #d8dde3; border-radius: 8px; padding: 10px 11px; color: var(--text); background: #fff; }
    textarea { resize: vertical; min-height: 112px; }
    .hint { color: var(--muted); font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 9px 12px; border-radius: 8px; border: 1px solid transparent; max-width: 100%; white-space: normal; }
    .btn.primary { background: var(--black); color: #fff; }
    .btn.secondary { background: #fff; color: var(--text); border-color: var(--line); }
    .btn.green { background: var(--green); color: #fff; }
    .btn.orange { background: var(--orange); color: #fff; }
    .btn.red { background: var(--red); color: #fff; }
    .btn.ghost { background: transparent; color: var(--muted); }
    .btn.icon-only { width: 38px; padding: 0; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tag { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; border-radius: 999px; padding: 3px 8px; font-size: 12px; border: 1px solid var(--line); color: #394150; background: #fff; max-width: 100%; }
    .tag.green { color: var(--green); background: var(--green-soft); border-color: #c8e9d3; }
    .tag.orange { color: var(--orange); background: var(--orange-soft); border-color: #f6d49e; }
    .tag.red { color: var(--red); background: var(--red-soft); border-color: #fac7c1; }
    .tag.black { color: #fff; background: var(--black); border-color: var(--black); }

    ul.clean { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    ul.clean li { display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: 0 0 auto; margin-top: 7px; }
    .plain-box { border: 1px solid var(--line); border-radius: 8px; padding: 13px; background: #fff; min-width: 0; }
    .plain-box h4 { margin: 0 0 8px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
    .split-list { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }

    .candidate-list { display: grid; gap: 12px; }
    .candidate { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 12px; background: #fff; min-width: 0; }
    .candidate.selected { border-color: var(--green); box-shadow: 0 0 0 2px rgba(22,128,60,.12); }
    .person { display: flex; gap: 12px; align-items: center; min-width: 0; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; background: #2f343d; flex: 0 0 auto; }
    .person-info { min-width: 0; }
    .person-info strong { display: block; word-break: break-word; }
    .person-info span { color: var(--muted); font-size: 12px; }
    .candidate-meta { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; color: var(--muted); font-size: 12px; }
    .candidate-meta b { color: var(--text); display: block; font-size: 13px; margin-top: 2px; word-break: break-word; }
    .plan-text { background: var(--soft); border-radius: 8px; padding: 10px; color: #394150; }

    .evidence-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
    .evidence { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; min-width: 0; }
    .evidence img { width: 100%; aspect-ratio: 4 / 3; display: block; object-fit: cover; background: #f1f3f5; }
    .evidence figcaption { padding: 10px; color: #394150; font-size: 12px; }
    .result-list { display: grid; gap: 10px; }
    .result-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); min-width: 0; }
    .result-item:last-child { border-bottom: 0; padding-bottom: 0; }
    .result-item span:first-child { color: var(--muted); }
    .result-item strong { text-align: right; word-break: break-word; }

    .empty-state, .error-state { min-height: 150px; display: grid; place-items: center; text-align: center; color: var(--muted); border: 1px dashed #cfd5dc; border-radius: 8px; padding: 18px; background: #fff; }
    .error-state { color: var(--red); background: var(--red-soft); border-color: #fac7c1; }
    .security-list { display: grid; gap: 10px; }
    .security-item { display: flex; gap: 10px; align-items: flex-start; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
    .security-item:last-child { border-bottom: 0; padding-bottom: 0; }
    .wallet-row { display: flex; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .wallet-row:last-child { border-bottom: 0; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(17,19,24,.42); display: none; align-items: center; justify-content: center; padding: 18px; }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(720px, 100%); max-height: min(82vh, 760px); overflow: auto; background: #fff; border-radius: 8px; border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(17,19,24,.28); }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; padding: 16px 16px 0; }
    .modal-header h3 { margin: 0; font-size: 16px; }
    .modal-body { padding: 16px; }
    .chat { display: grid; gap: 10px; }
    .chat-line { display: grid; grid-template-columns: 82px minmax(0,1fr); gap: 8px; align-items: start; }
    .chat-line b { font-size: 12px; color: var(--muted); padding-top: 8px; }
    .bubble { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; background: var(--soft); min-width: 0; word-break: break-word; }
    .toast-region { position: fixed; right: 18px; bottom: 18px; z-index: 80; display: grid; gap: 10px; width: min(360px, calc(100vw - 36px)); }
    .toast { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--green); border-radius: 8px; box-shadow: var(--shadow); padding: 11px 12px; color: #394150; }
    .toast.error { border-left-color: var(--red); }
    .toast.warn { border-left-color: var(--orange); }
    .icon { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; flex: 0 0 auto; }
    .hidden { display: none !important; }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: sticky; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px; }
      .brand { padding: 0 4px 10px; }
      .nav { display: flex; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
      .nav::-webkit-scrollbar { display: none; }
      .nav button { width: auto; flex: 0 0 auto; }
      .side-note { display: none; }
      .topbar { top: 96px; }
      .action-layout, .grid.two, .grid.three { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .evidence-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }

    @media (max-width: 560px) {
      body { font-size: 13px; }
      .brand h1 { font-size: 14px; }
      .topbar { top: 94px; height: auto; padding: 10px 12px; align-items: stretch; flex-direction: column; }
      .page-title p { white-space: normal; max-width: 100%; }
      .top-actions, .segmented { width: 100%; min-width: 0; }
      .content { padding: 14px 12px 28px; }
      .stage-row { grid-template-columns: 1fr; gap: 10px; }
      .stage::after { left: 10px; right: auto; top: 22px; bottom: -10px; height: auto; width: 1px; }
      .stage small { margin-left: 27px; }
      .form-grid, .split-list, .summary-grid, .candidate-meta, .evidence-grid { grid-template-columns: 1fr; }
      .panel-header, .action-header { flex-direction: column; align-items: stretch; }
      .actions .btn { width: 100%; }
      .event { grid-template-columns: 44px minmax(0,1fr); }
      .event b { grid-column: 2; }
      .event span { grid-column: 2; }
      .chat-line { grid-template-columns: 1fr; gap: 4px; }
      .result-item { display: grid; }
      .result-item strong { text-align: left; }
      .modal-backdrop { padding: 10px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M9 18l6-12"/><path d="M5 8h9a5 5 0 0 1 0 10H5z"/></svg></div>
        <div><h1>GroundLink 现实接力</h1><p>AI Agent × 线下执行者</p></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-note"><strong>接力原则</strong><p>每一步都有明确行动者：A 描述和确认，A-Agent 拆解与协商，B-Agent 辅助执行者，B 线下接单和回传证据。</p></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-title">
          <h2 id="pageTitle">任务总览</h2>
          <p id="pageSubtitle">围绕四方交接查看当前阶段、下一步和最近事件。</p>
        </div>
        <div class="top-actions">
          <div class="segmented" role="tablist" aria-label="演示视角">
            <button id="roleA" type="button" role="tab" aria-selected="true">委托方视角</button>
            <button id="roleB" type="button" role="tab" aria-selected="false">执行方视角</button>
          </div>
          <button class="btn secondary icon-only" id="resetBtn" type="button" title="重置演示数据" aria-label="重置演示数据"><svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg></button>
        </div>
      </header>
      <section class="content" id="content" aria-live="polite"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-header">
        <div><h3 id="modalTitle">确认操作</h3><p class="hint" id="modalHint"></p></div>
        <button class="btn ghost icon-only" id="modalClose" type="button" title="关闭弹窗" aria-label="关闭弹窗"><svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-label="操作反馈"></div>

  <script>
    const STORAGE_KEY = "groundlink_relay_demo_v2";

    const stateOrder = [
      "draft",
      "decomposed",
      "published",
      "candidate_selected",
      "negotiation_confirmed",
      "authorized",
      "accepted",
      "arrived",
      "executing",
      "evidence_submitted",
      "agent_verified",
      "human_confirmed"
    ];

    const stages = [
      { id: "define", title: "定义任务", actor: "A + A-Agent", states: ["draft", "decomposed"], view: "create" },
      { id: "publish", title: "发布匹配", actor: "A-Agent", states: ["published"], view: "match" },
      { id: "negotiate", title: "协商授权", actor: "A-Agent ↔ B-Agent，最后由 A", states: ["candidate_selected", "negotiation_confirmed"], view: "match" },
      { id: "execute", title: "接单执行", actor: "B", states: ["authorized", "accepted", "arrived", "executing"], view: "progress" },
      { id: "evidence", title: "证据回传", actor: "B + B-Agent", states: ["evidence_submitted"], view: "evidence" },
      { id: "verify", title: "验收完成", actor: "A-Agent + A", states: ["agent_verified", "human_confirmed"], view: "evidence" }
    ];

    const navItems = [
      ["overview", "任务总览", "layout-dashboard"],
      ["create", "发起委托", "send"],
      ["match", "Agent 匹配", "users"],
      ["progress", "执行中", "route"],
      ["evidence", "证据验收", "shield-check"],
      ["wallet", "我的钱包", "wallet"]
    ];

    const candidates = [
      { id: "b1", name: "林阿姨代办", initials: "林", verified: "实名认证", distance: "0.8 km", arrival: "18 分钟", skill: "社区核验、拍照取证", completion: "98%", rating: "4.9", price: "68 元", plan: "先确认店名与门牌，拍摄入口坡道、门槛和室内主通道，再向工作人员询问营业时间、当天菜单和收费标准。" },
      { id: "b2", name: "小周跑腿核验", initials: "周", verified: "实名认证", distance: "1.4 km", arrival: "26 分钟", skill: "商户走访、票据上传", completion: "95%", rating: "4.8", price: "72 元", plan: "到店后按清单逐项拍照，补充门口道路情况和高峰排队情况，必要时电话说明异常。" },
      { id: "b3", name: "银龄友好观察员", initials: "友", verified: "实名认证", distance: "2.1 km", arrival: "34 分钟", skill: "适老环境观察", completion: "99%", rating: "5.0", price: "88 元", plan: "重点评估轮椅通行、桌椅间距、入口坡度和现场指引，并提交结构化备注。" }
    ];

    const defaultState = {
      role: "A",
      view: "overview",
      workflowState: "draft",
      taskText: "帮我确认父母家附近的社区助老食堂是否有无障碍入口，并拍下菜单和营业时间。",
      address: "安和路 18 号附近，阳光社区助老食堂",
      deadline: "今天 18:00 前",
      budget: 68,
      acceptance: "入口、室内通道、菜单、营业时间、收费标准均需照片或文字证据；照片需含时间和地点水印。",
      selectedCandidateId: "",
      escrow: "未托管",
      dispute: false,
      evidenceSubmitted: false,
      verified: false,
      events: [{ time: "14:01", actor: "系统", text: "演示已准备，等待 A 描述线下核验需求" }]
    };

    let state = loadState();
    const $ = (selector) => document.querySelector(selector);

    function loadState() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (!stored) return { ...defaultState };
        const parsed = JSON.parse(stored);
        return { ...defaultState, ...parsed, events: Array.isArray(parsed.events) ? parsed.events : defaultState.events };
      } catch {
        return { ...defaultState };
      }
    }

    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

    function updateState(patch, event) {
      state = { ...state, ...patch };
      if (event) state.events = [...state.events, { time: currentTime(), ...event }].slice(-24);
      saveState();
      render();
    }

    function currentTime() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    }

    function stateAtLeast(name) { return stateOrder.indexOf(state.workflowState) >= stateOrder.indexOf(name); }
    function stateIs(...names) { return names.includes(state.workflowState); }
    function currentStageIndex() { return stages.findIndex(stage => stage.states.includes(state.workflowState)); }
    function currentStage() { return stages[currentStageIndex()] || stages[0]; }
    function selectedCandidate() { return candidates.find(c => c.id === state.selectedCandidateId); }

    function icon(name) {
      const paths = {
        "layout-dashboard": '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
        send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
        users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
        route: '<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7H6.5a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>',
        "shield-check": '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
        wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3v4a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V5"/><path d="M18 12h.01"/>',
        check: '<path d="M20 6 9 17l-5-5"/>',
        lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
        alert: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
        camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
        "map-pin": '<path d="M20 10c0 4.99-5.5 10.5-7.4 12a1 1 0 0 1-1.2 0C9.5 20.5 4 15 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
        clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
        upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
        file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
        play: '<polygon points="6 3 20 12 6 21 6 3"/>',
        x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'
      };
      return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${paths[name] || paths.check}</svg>`;
    }

    function setPage(title, subtitle) {
      $("#pageTitle").textContent = title;
      $("#pageSubtitle").textContent = subtitle;
    }

    function render() {
      renderNav();
      $("#roleA").classList.toggle("active", state.role === "A");
      $("#roleB").classList.toggle("active", state.role === "B");
      $("#roleA").setAttribute("aria-selected", state.role === "A");
      $("#roleB").setAttribute("aria-selected", state.role === "B");

      const renderers = { overview: renderOverview, create: renderCreate, match: renderMatch, progress: renderProgress, evidence: renderEvidence, wallet: renderWallet };
      (renderers[state.view] || renderOverview)();
    }

    function navAccess(view) {
      const map = {
        overview: [true, "随时可查看当前阶段"],
        create: [true, "随时可编辑委托"],
        match: [stateAtLeast("published"), "需要先完成任务拆解并确认发布"],
        progress: [stateAtLeast("authorized"), "需要 A 确认方案并托管后解锁"],
        evidence: [stateAtLeast("evidence_submitted"), "需要 B 上传现场证据后解锁"],
        wallet: [stateAtLeast("authorized"), "需要进入模拟托管后解锁"]
      };
      return map[view] || [false, "尚未解锁"];
    }

    function renderNav() {
      $("#nav").innerHTML = navItems.map(([id, label, iconName]) => {
        const [open, reason] = navAccess(id);
        return `<button type="button" class="${state.view === id ? "active" : ""} ${open ? "" : "locked"}" data-view="${id}" ${open ? "" : "disabled"} title="${open ? label : "未解锁：" + reason}" aria-label="${open ? label : label + "，未解锁，" + reason}">
          ${icon(open ? iconName : "lock")}<span>${label}</span>
        </button>`;
      }).join("");
    }

    function shell(inner) {
      $("#content").innerHTML = relayHeader() + inner;
      bindActions();
      if (stateAtLeast("evidence_submitted")) generateEvidenceImages();
    }

    function relayHeader() {
      return `
        <div class="relay-top">
          <section class="progress-card" aria-label="任务接力进度条">
            <div class="stage-row">
              ${stages.map((stage, index) => {
                const cls = index < currentStageIndex() ? "done" : index === currentStageIndex() ? "current" : "";
                return `<div class="stage ${cls}">
                  <div class="stage-head"><span class="stage-dot">${index < currentStageIndex() ? icon("check") : ""}</span><span class="stage-title">${index + 1}. ${stage.title}</span></div>
                  <small>${stage.actor}</small>
                </div>`;
              }).join("")}
            </div>
            <div class="stage-count">当前 ${currentStageIndex() + 1} / 6：${currentStage().title}</div>
          </section>

          <div class="action-layout">
            <section class="action-card" aria-label="当前行动卡">
              ${currentActionCard()}
            </section>
            <aside class="handoff" aria-label="任务接力记录">
              <h3>任务接力记录</h3>
              <div class="event-list">
                ${state.events.slice().reverse().map(event => `<div class="event"><time>${event.time}</time><b>${event.actor}</b><span>${escapeHTML(event.text)}</span></div>`).join("")}
              </div>
            </aside>
          </div>
        </div>
      `;
    }

    function currentActionCard() {

          button: ["让 Agent 拆解", "decompose", "primary"]
        },
        decomposed: {
          actor: "委托方 A",
          title: "A-Agent 已拆分线上准备和线下执行部分",

          next: "下一步：确认发布并开始匹配",
          button: ["确认发布并开始匹配", "publish", "green"]

        },
        evidence_submitted: {

        },

        }
      };
      const c = cards[state.workflowState] || cards.draft;
      return `
        <div class="action-header">
          <div><h3>当前行动者：${c.actor}</h3><p>${c.title}</p></div>
          <span class="tag ${state.workflowState === "human_confirmed" ? "green" : "orange"}">${currentStage().title}</span>
        </div>

          <div class="summary-item"><span>报价</span><strong>${stateAtLeast("negotiation_confirmed") ? "68 元" : "待协商"}</strong></div>

          <div class="summary-item"><span>托管状态</span><strong>${state.escrow}</strong></div>
          <div class="summary-item"><span>证据</span><strong>${state.evidenceSubmitted ? "已回传" : "未回传"}</strong></div>

    function renderOverview() {
      setPage("任务总览", "只展示当前阶段、下一步和最近接力事件。");
      shell(`
        <div class="grid two">
          <section class="panel">
            <div class="panel-header"><div><h3>当前阶段</h3><p>首页聚焦任务接力，而不是展示所有次级功能。</p></div></div>
            <div class="panel-body">
              <p>${escapeHTML(state.taskText)}</p>
              <div class="tag-row">
                <span class="tag">${icon("map-pin")}${displayAddress()}</span>
                <span class="tag">${icon("clock")}${escapeHTML(state.deadline)}</span>
                <span class="tag green">${icon("shield-check")}低风险</span>
                <span class="tag orange">${icon("wallet")}${state.escrow}</span>
              </div>
            </div>

          <section class="panel">
            <div class="panel-header"><div><h3>最近事件</h3><p>用于观察 A、A-Agent、B-Agent、B 之间的交接。</p></div></div>
            <div class="panel-body">
              <ul class="clean">${state.events.slice(-5).reverse().map(e => `<li><span class="dot"></span><span><strong>${e.time} ${e.actor}</strong>：${escapeHTML(e.text)}</span></li>`).join("")}</ul>
            </div>
          </section>
        </div>
      `);
    }

    function renderCreate() {
      setPage("发起委托", "定义任务和发布匹配阶段只能由 A 与 A-Agent 推进。");
      shell(`
        <div class="grid two">
          <section class="panel">
            <div class="panel-header"><div><h3>自然语言委托</h3><p>预填演示场景，A 可以修改。</p></div><span class="tag ${stateAtLeast("decomposed") ? "green" : "orange"}">${stateAtLeast("decomposed") ? "已拆解" : "待拆解"}</span></div>
            <div class="panel-body">
              <div class="field"><label for="taskText">任务描述</label><textarea id="taskText">${escapeHTML(state.taskText)}</textarea></div>
              <div class="actions">${stateIs("draft") ? `<button class="btn primary" type="button" data-action="decompose">${icon("send")}让 Agent 拆解</button>` : `<button class="btn secondary" type="button" data-action="save-draft">保存修改</button>`}<button class="btn secondary" type="button" data-action="validate-risk">${icon("shield-check")}安全预检查</button></div>
            </div>
          </section>
          <section class="panel">
            <div class="panel-header"><div><h3>需要 A 确认的权限</h3><p>Agent 不能越权发布、付款或替人接单。</p></div></div>
            <div class="panel-body">
              <ul class="clean">
                <li><span class="dot"></span><span>允许 A-Agent 使用公开地址信息整理核验清单。</span></li>
                <li><span class="dot"></span><span>允许向已认证 B-Agent 展示模糊位置和任务类型。</span></li>
                <li><span class="dot"></span><span>付款前必须由用户 A 人工授权模拟托管。</span></li>
                <li><span class="dot"></span><span>高风险任务不能由 Agent 自动发布。</span></li>
              </ul>
            </div>
          </section>
        </div>

        ${stateAtLeast("decomposed") ? decompositionPanel() : `<div class="empty-state" style="margin-top:16px"><div><strong>等待 Agent 拆解任务</strong><p>拆解后才会出现确认发布入口。</p></div></div>`}
        <section class="panel" style="margin-top:16px">
          <div class="panel-header"><div><h3>发布前编辑</h3><p>确认预算、地址、截止时间和验收条件。</p></div></div>
          <div class="panel-body">
            <div class="form-grid">
              <div class="field"><label for="address">核验地址</label><input id="address" value="${escapeHTML(state.address)}"></div>
              <div class="field"><label for="deadline">截止时间</label><input id="deadline" value="${escapeHTML(state.deadline)}"></div>
              <div class="field"><label for="budget">预算金额（元）</label><input id="budget" type="number" min="1" value="${state.budget}"></div>
              <div class="field"><label for="riskLevel">风险等级</label><select id="riskLevel"><option selected>低</option><option>中，需要人工复核</option><option>高，不允许 Agent 自动发布</option></select></div>
              <div class="field full"><label for="acceptance">验收条件</label><textarea id="acceptance">${escapeHTML(state.acceptance)}</textarea></div>
            </div>
            <div class="actions">${stateIs("decomposed") ? `<button class="btn green" type="button" data-action="publish">${icon("check")}确认发布并开始匹配</button>` : `<button class="btn secondary" type="button" data-action="save-draft">保存草稿</button>`}</div>
          </div>
        </section>
      `);
    }

    function decompositionPanel() {
      return `
        <section class="panel" style="margin-top:16px">
          <div class="panel-header"><div><h3>Agent 拆解结果</h3><p>低风险线下核验任务，建议预算 68 元，预计 45 分钟。</p></div><div class="tag-row"><span class="tag green">风险低</span><span class="tag orange">45 分钟</span><span class="tag black">68 元</span></div></div>
          <div class="panel-body">
            <div class="split-list">
              <div class="plain-box"><h4>${icon("check")}Agent 在线完成</h4><ul class="clean"><li><span class="dot"></span><span>搜索公开地址和营业主体信息。</span></li><li><span class="dot"></span><span>整理核验清单：入口、通道、菜单、价格、营业时间。</span></li><li><span class="dot"></span><span>设定证据要求：照片、GPS、拍摄时间、执行者备注。</span></li></ul></div>
              <div class="plain-box"><h4>${icon("camera")}人类线下完成</h4><ul class="clean"><li><span class="dot"></span><span>到达社区助老食堂并确认门牌。</span></li><li><span class="dot"></span><span>观察是否有无障碍入口和通道阻挡。</span></li><li><span class="dot"></span><span>拍照并询问当天菜单、价格和营业时间。</span></li></ul></div>
            </div>
          </div>
        </section>`;
    }

    function renderMatch() {
      setPage("Agent 匹配", "选择 B-Agent 后先进入协商中，不能直接跳到授权或执行。");
      if (!stateAtLeast("published")) return lockedPage("Agent 匹配尚未解锁", "请先完成拆解并确认发布。", "create");
      shell(`
        <section class="panel">
          <div class="panel-header"><div><h3>候选 B-Agent</h3><p>选择后进入 A-Agent ↔ B-Agent 协商；A 仍需最终确认方案。</p></div><span class="tag ${state.selectedCandidateId ? "green" : "orange"}">${state.selectedCandidateId ? "已选择" : "等待选择"}</span></div>
          <div class="panel-body"><div class="candidate-list">${candidates.map(candidateCard).join("")}</div></div>
        </section>
      `);
    }

    function candidateCard(c) {
      const selected = state.selectedCandidateId === c.id;
      const canSelect = stateIs("published") || stateIs("candidate_selected");
      return `<article class="candidate ${selected ? "selected" : ""}">
        <div class="person"><div class="avatar" aria-hidden="true">${c.initials}</div><div class="person-info"><strong>${c.name}</strong><span>${c.verified} · ${c.skill}</span></div></div>
        <div class="candidate-meta"><span>距离<b>${c.distance}</b></span><span>可到达<b>${c.arrival}</b></span><span>完成率<b>${c.completion}</b></span><span>评分 / 报价<b>${c.rating} / ${c.price}</b></span></div>
        <div class="plan-text"><strong>B-Agent 执行计划：</strong>${c.plan}</div>
        <div class="actions">
          <button class="btn ${selected ? "green" : "primary"}" type="button" data-action="select-candidate" data-id="${c.id}" ${canSelect ? "" : "disabled"}>${icon(selected ? "check" : "users")}${selected ? "已选择" : "选择并发起协商"}</button>
          <button class="btn secondary" type="button" data-action="open-negotiation" data-id="${c.id}" ${selected || stateAtLeast("candidate_selected") ? "" : "disabled"}>${icon("file")}查看协商记录</button>
        </div>
      </article>`;
    }

    function renderProgress() {
      setPage("执行中", "执行过程只允许 B 端按顺序接单、到达、执行，不能由通用按钮自动完成。");
      if (!stateAtLeast("authorized")) return lockedPage("执行流程尚未解锁", "需要 A 确认协商方案并授权模拟托管。", "match");
      shell(`
        <div class="grid two">
          <section class="panel">
            <div class="panel-header"><div><h3>执行方操作</h3><p>每次只显示当前阶段唯一主操作，防止跳步。</p></div><span class="tag ${state.role === "B" ? "green" : "orange"}">${state.role === "B" ? "执行方视角" : "委托方视角"}</span></div>
            <div class="panel-body">${executorOperationPanel()}</div>
          </section>
          <section class="panel">
            <div class="panel-header"><div><h3>B-Agent 执行清单</h3><p>执行清单由 Agent 整理，但现场动作必须由人类 B 完成。</p></div></div>
            <div class="panel-body">

    function executorOperationPanel() {
      if (state.role !== "B") return `<div class="empty-state"><div><strong>需要切换到执行方视角</strong><p>当前阶段由人类 B 推进，委托方不能代替接单或上传证据。</p><button class="btn primary" type="button" data-action="switch-b">${icon("users")}切换到执行方视角</button></div></div>`;
      if (stateIs("authorized")) return `<p>托管已生效，但 B 尚未接单。接单后才显示精确地址。</p><div class="actions"><button class="btn primary" type="button" data-action="b-accept">${icon("check")}B 人工确认接单</button></div>`;
      if (stateIs("accepted")) return `<p>精确地址已解锁：${escapeHTML(state.address)}。请到达现场后再推进。</p><div class="actions"><button class="btn primary" type="button" data-action="b-arrive">${icon("map-pin")}B 确认已到达</button></div>`;
      if (stateIs("arrived")) return `<p>B 已到达。开始核验前请确认安全提示，避开无关人员隐私。</p><div class="actions"><button class="btn primary" type="button" data-action="b-start-executing">${icon("play")}开始执行核验清单</button></div>`;
      if (stateIs("executing")) return `<p>B 正在采集入口、通道、菜单、GPS、时间和备注。只有此按钮会生成证据。</p><div class="actions"><button class="btn green" type="button" data-action="b-submit-evidence">${icon("upload")}提交现场证据</button></div>`;
      return `<div class="empty-state"><div><strong>执行方操作已完成</strong><p>证据已回传，等待 A-Agent 初验和 A 最终确认。</p></div></div>`;
    }

    function renderEvidence() {
      setPage("证据验收", "证据只能由 B 的上传动作产生，完成只能由 A 最终确认。");
      if (!stateAtLeast("evidence_submitted")) return lockedPage("证据验收尚未解锁", "需要 B 在执行方视角提交现场证据。", "progress");
      shell(`
        <div class="grid two">
          <section class="panel">
            <div class="panel-header"><div><h3>模拟现场证据</h3><p>图片由本地 Canvas 生成，包含现场证据、时间和地点水印。</p></div><span class="tag green">B 已上传</span></div>
            <div class="panel-body">
              <div class="evidence-grid">${evidenceFigure("entrance", "无障碍入口照片")}${evidenceFigure("hall", "食堂内部通道照片")}${evidenceFigure("menu", "当天菜单照片")}</div>
              <div class="plain-box" style="margin-top:12px"><h4>${icon("map-pin")}GPS 与备注</h4><p>GPS 位置：31.2312, 121.4746，阳光社区助老食堂门口 15 米范围内。</p><p>拍摄时间：今天 11:42，执行者备注：门口有缓坡，通道可通过轮椅，但午餐高峰桌椅间距会变窄。</p></div>
            </div>
          </section>
          <section class="panel">
            <div class="panel-header"><div><h3>A-Agent 验收结果</h3><p>证据不足时不能自动放款，最终完成必须由 A 点击确认。</p></div></div>
            <div class="panel-body">${stateAtLeast("agent_verified") ? validationResult() : `<div class="empty-state"><div><strong>等待 A-Agent 初验</strong><p>请点击当前行动卡中的“A-Agent 初验”。</p></div></div>`}</div>
          </section>
        </div>
      `);
    }

    function evidenceFigure(id, label) {
      return `<figure class="evidence"><img id="img-${id}" alt="${label}，含时间和地点水印"><figcaption>${label}</figcaption></figure>`;
    }

    function validationResult() {
      return `<div class="result-list">
        <div class="result-item"><span>无障碍入口</span><strong>通过</strong></div>
        <div class="result-item"><span>室内通道宽度</span><strong>基本符合</strong></div>
        <div class="result-item"><span>营业时间</span><strong>10:30-13:30</strong></div>
        <div class="result-item"><span>老年餐价格</span><strong>12 元</strong></div>
        <div class="result-item"><span>证据完整度</span><strong>96%</strong></div>
        <div class="result-item"><span>建议</span><strong>首次前往时由家属陪同确认实际坡度。</strong></div>
      </div>
      <div class="actions">
        <button class="btn green" type="button" data-action="confirm-complete" ${stateIs("human_confirmed") ? "disabled" : ""}>${icon("check")}${stateIs("human_confirmed") ? "已确认完成" : "确认完成"}</button>
        <button class="btn orange" type="button" data-action="request-more" ${stateIs("human_confirmed") ? "disabled" : ""}>${icon("camera")}要求补充</button>
        <button class="btn red" type="button" data-action="start-dispute">${icon("alert")}发起争议</button>
      </div>`;

    function renderWallet() {
      setPage("我的钱包", "模拟托管付款、收益与争议冻结，不接入真实支付。");
      if (!stateAtLeast("authorized")) return lockedPage("钱包尚未解锁", "需要 A 确认方案并授权模拟托管。", "match");
      shell(`
        <div class="grid two">
          <section class="panel"><div class="panel-header"><div><h3>委托方资金</h3><p>付款前必须由用户 A 人工授权。</p></div></div><div class="panel-body">
            <div class="wallet-row"><span>任务预算</span><strong>${state.budget} 元</strong></div>
            <div class="wallet-row"><span>托管状态</span><strong>${state.escrow}</strong></div>
            <div class="wallet-row"><span>放款条件</span><strong>证据完整且用户确认</strong></div>
            <div class="wallet-row"><span>争议状态</span><strong>${state.dispute ? "争议处理中" : "无争议"}</strong></div>

    function lockedPage(title, text, targetView) {
      shell(`<div class="error-state"><div><strong>${title}</strong><p>${text}</p><button class="btn primary" type="button" data-action="goto-view" data-view="${targetView}">返回可操作页面</button></div></div>`);
    }

    function securityPanel() {
      return `<section class="panel"><div class="panel-header"><div><h3>完整安全规则</h3><p>次级页面集中展示平台安全边界。</p></div></div><div class="panel-body"><div class="security-list">
        <div class="security-item">${icon("lock")}<span>付款前必须由用户 A 人工授权，付款采用模拟托管状态。</span></div>
        <div class="security-item">${icon("check")}<span>接单前必须由人类 B 人工确认，Agent 只做协商辅助。</span></div>
        <div class="security-item">${icon("map-pin")}<span>精确地址只有接单后才显示，匹配阶段只展示模糊位置。</span></div>
        <div class="security-item">${icon("alert")}<span>平台自动拦截违法、危险、骚扰和侵犯隐私的任务，高风险任务不能由 Agent 自动发布。</span></div>
        <div class="security-item">${icon("shield-check")}<span>证据不足时不能自动放款，双方都可以发起争议。</span></div>
      </div></div></section>`;
    }

    function displayAddress() {
      return stateAtLeast("accepted") || state.role === "A" ? escapeHTML(state.address) : "阳光社区附近，精确地址接单后显示";
    }

    function bindActions() {
      document.querySelectorAll("[data-action]").forEach(button => button.addEventListener("click", handleAction));
      document.querySelectorAll("#nav [data-view]").forEach(button => {
        button.addEventListener("click", () => {
          const [open, reason] = navAccess(button.dataset.view);
          if (!open) return toast(reason, "warn");
          updateState({ view: button.dataset.view });
        });
      });
    }

    function handleAction(event) {
      const button = event.currentTarget;
      const action = button.dataset.action;
      const id = button.dataset.id;

      if (action === "goto-view") return updateState({ view: button.dataset.view });
      if (action === "goto-match") return updateState({ view: "match" });
      if (action === "goto-evidence") return updateState({ view: "evidence", role: "A" });
      if (action === "switch-b") return updateState({ role: "B" }, { actor: "平台", text: "演示视角切换到执行方 B" });
      if (action === "switch-b-accept") {
        if (!stateIs("authorized")) return toast("需要 A 授权托管后才能接单。", "warn");
        return updateState({ role: "B", view: "progress", workflowState: "accepted" }, { actor: "B", text: "切换到执行方视角并人工确认接单，精确地址已解锁" });
      }

      if (action === "save-draft") {
        saveForm();
        saveState();
        return toast("修改已保存，刷新后仍会保留。");
      }

      if (action === "validate-risk") {
        const text = $("#taskText")?.value || state.taskText;
        return /跟踪|偷拍|骚扰|闯入|危险|违法/.test(text) ? toast("安全预检查未通过：疑似高风险或侵犯隐私任务。", "error") : toast("安全预检查通过：当前任务为低风险社区核验。");
      }

      if (action === "decompose") {
        const text = ($("#taskText")?.value || state.taskText).trim();
        if (!text) return toast("请先填写任务描述。", "error");
        updateState({ taskText: text, workflowState: "decomposed", view: "create" }, { actor: "A", text: "提交线下核验需求" });
        updateState({ workflowState: "decomposed" }, { actor: "A-Agent", text: "拆分线上准备和线下执行部分，生成预算、时间和证据要求" });
        return toast("A-Agent 已完成拆解。");
      }

      if (action === "publish") {
        saveForm();
        const risk = $("#riskLevel")?.value || "低";
        if (!stateIs("decomposed")) return toast("请先完成 Agent 拆解。", "warn");
        if (risk.startsWith("高")) return toast("高风险任务不能由 Agent 自动发布。", "error");
        return updateState({ workflowState: "published", view: "match", role: "A" }, { actor: "平台", text: "找到 3 个可用 B-Agent，等待 A 选择协商对象" });
      }

      if (action === "select-candidate") {
        if (!stateIs("published", "candidate_selected")) return toast("当前阶段不能重新选择执行者。", "warn");
        const c = candidates.find(item => item.id === id);
        updateState({ selectedCandidateId: id, workflowState: "candidate_selected", view: "match" }, { actor: "A-Agent", text: `向 ${c.name} Agent 发起协商` });
        updateState({ workflowState: "candidate_selected" }, { actor: "B-Agent", text: "接受 68 元报价和证据标准，等待 A 确认方案" });
        return openNegotiation(id);
      }

      if (action === "open-negotiation") return openNegotiation(id || state.selectedCandidateId);

      if (action === "authorize") {
        if (!stateIs("negotiation_confirmed")) return toast("请先确认协商方案。", "warn");
        return confirmDialog("确认方案并托管 68 元", "付款前必须由用户 A 人工确认。", `<p>确认接受协商方案，并将 68 元进入模拟托管吗？</p><div class="actions"><button class="btn green" type="button" data-confirm="authorize">${icon("check")}确认托管</button><button class="btn secondary" type="button" data-confirm="cancel">取消</button></div>`);
      }

      if (action === "b-accept") {
        if (!stateIs("authorized")) return toast("需要 A 授权托管后才能接单。", "warn");
        return updateState({ workflowState: "accepted", role: "B", view: "progress" }, { actor: "B", text: "人工确认接单，精确地址已解锁" });
      }

      if (action === "b-arrive") {
        if (!stateIs("accepted")) return toast("请先由 B 人工确认接单。", "warn");
        return updateState({ workflowState: "arrived", role: "B", view: "progress" }, { actor: "B", text: "到达社区助老食堂现场并记录位置" });
      }

      if (action === "b-start-executing") {
        if (!stateIs("arrived")) return toast("请先标记已到达。", "warn");
        return updateState({ workflowState: "executing", role: "B", view: "progress" }, { actor: "B-Agent", text: "向 B 展示入口、通道、菜单、价格和营业时间核验清单" });
      }

      if (action === "b-submit-evidence") {
        if (!stateIs("executing")) return toast("只有执行中阶段才能提交证据。", "warn");
        return updateState({ workflowState: "evidence_submitted", evidenceSubmitted: true, role: "B", view: "evidence" }, { actor: "B", text: "上传入口、通道、菜单照片、GPS、时间和备注" });
      }

      if (action === "agent-verify") {
        if (!stateIs("evidence_submitted")) return toast("请先由 B 提交现场证据。", "warn");
        return updateState({ workflowState: "agent_verified", verified: true, role: "A", view: "evidence" }, { actor: "A-Agent", text: "完成证据初验并生成简洁核验报告" });
      }

      if (action === "confirm-complete") {
        if (!stateIs("agent_verified")) return toast("需要 A-Agent 初验后，A 才能确认完成。", "warn");
        return confirmDialog("A 确认完成", "只有委托方 A 可以结束任务并触发模拟放款。", `<p>确认接受 A-Agent 核验报告并完成任务吗？</p><div class="actions"><button class="btn green" type="button" data-confirm="complete">${icon("check")}确认完成</button><button class="btn secondary" type="button" data-confirm="cancel">再检查一下</button></div>`);
      }

      if (action === "request-more") {
        if (!stateAtLeast("agent_verified")) return toast("请先完成 A-Agent 初验。", "warn");
        return updateState({ workflowState: "executing", role: "B", view: "progress", evidenceSubmitted: false, verified: false }, { actor: "A", text: "要求 B 补充现场证据，流程退回执行中" });
      }

      if (action === "start-dispute") {
        return confirmDialog("发起争议", "争议期间模拟托管款会冻结，双方可补充说明。", `<div class="field"><label for="disputeReason">争议说明</label><textarea id="disputeReason">证据中的通道宽度需要进一步确认，希望执行者补充现场测量或更多照片。</textarea></div><div class="actions"><button class="btn red" type="button" data-confirm="dispute">${icon("alert")}提交争议</button><button class="btn secondary" type="button" data-confirm="cancel">取消</button></div>`);
      }
    }

    function saveForm() {
      state = {
        ...state,
        taskText: $("#taskText")?.value.trim() || state.taskText,
        address: $("#address")?.value.trim() || state.address,
        deadline: $("#deadline")?.value.trim() || state.deadline,
        budget: Math.max(1, Number($("#budget")?.value || state.budget)),
        acceptance: $("#acceptance")?.value.trim() || state.acceptance
      };
      saveState();
    }

    function openNegotiation(id) {
      const c = candidates.find(item => item.id === id) || selectedCandidate();
      if (!c) return toast("请先选择一个 B-Agent。", "warn");
      confirmDialog("A-Agent 与 B-Agent 协商记录", `${c.name} · ${c.distance} · 报价 ${c.price}`, `
        <div class="chat">
          <div class="chat-line"><b>A-Agent</b><div class="bubble">任务范围限定为社区助老食堂公开空间核验，不拍摄住户、顾客面部或无关门牌。</div></div>
          <div class="chat-line"><b>B-Agent</b><div class="bubble">可以执行。将到店确认无障碍入口、室内通道、菜单、营业时间和收费标准。</div></div>
          <div class="chat-line"><b>A-Agent</b><div class="bubble">最终报价 68 元，最晚完成时间为 ${escapeHTML(state.deadline)}，需提交 3 张照片、GPS、拍摄时间和文字备注。</div></div>
          <div class="chat-line"><b>B-Agent</b><div class="bubble">接受。若现场有人阻止拍照，将改为文字说明并拍摄公开告示；若涉及隐私或危险情况会停止并发起争议。</div></div>
          <div class="chat-line"><b>平台</b><div class="bubble">取消规则：接单前可免费取消；到达后取消需说明原因。争议规则：证据不足、定位异常或隐私投诉时冻结模拟托管款。</div></div>
        </div>
        <div class="actions">
          <button class="btn green" type="button" data-confirm="acceptNegotiation" data-id="${c.id}" ${stateIs("candidate_selected") ? "" : "disabled"}>${icon("check")}${stateIs("candidate_selected") ? "A 确认协商方案" : "协商已确认"}</button>
          <button class="btn secondary" type="button" data-confirm="cancel">关闭</button>
        </div>
      `);
    }

    function confirmDialog(title, hint, body) {
      $("#modalTitle").textContent = title;
      $("#modalHint").textContent = hint || "";
      $("#modalBody").innerHTML = body;
      $("#modalBackdrop").classList.add("open");
      $("#modalBody").querySelectorAll("[data-confirm]").forEach(button => button.addEventListener("click", handleConfirm));
    }

    function closeModal() {
      $("#modalBackdrop").classList.remove("open");
      $("#modalBody").innerHTML = "";
    }

    function handleConfirm(event) {
      const action = event.currentTarget.dataset.confirm;
      const id = event.currentTarget.dataset.id;
      if (action === "cancel") return closeModal();
      if (action === "acceptNegotiation") {
        closeModal();
        return updateState({ selectedCandidateId: id || state.selectedCandidateId, workflowState: "negotiation_confirmed", role: "A", view: "match" }, { actor: "等待 A", text: "确认方案并授权托管" });
      }
      if (action === "authorize") {
        closeModal();
        return updateState({ workflowState: "authorized", escrow: "已托管", role: "A", view: "progress" }, { actor: "A", text: "确认协商方案并授权 68 元进入模拟托管" });
      }
      if (action === "complete") {
        closeModal();
        return updateState({ workflowState: "human_confirmed", escrow: "可放款", dispute: false, role: "A", view: "evidence" }, { actor: "A", text: "查看证据并确认任务完成" });
      }
      if (action === "dispute") {
        closeModal();
        return updateState({ dispute: true, escrow: "争议冻结" }, { actor: state.role === "B" ? "B" : "A", text: "发起争议，模拟托管款冻结" });
      }
      if (action === "reset") {
        localStorage.removeItem(STORAGE_KEY);
        state = { ...defaultState, events: [...defaultState.events] };
        closeModal();
        render();
        return toast("演示数据已重置。");
      }
    }

    function generateEvidenceImages() {
      const specs = [
        ["img-entrance", "无障碍入口", "#e9f7ee", "#16803c", ["入口缓坡", "门槛低", "现场证据"]],
        ["img-hall", "室内通道", "#f0f2f4", "#394150", ["主通道", "轮椅可通行", "避开人脸"]],
        ["img-menu", "当天菜单", "#fff4e5", "#b35b00", ["老年餐 12 元", "10:30-13:30", "菜单公示"]]
      ];
      specs.forEach(([id, title, bg, color, lines]) => {
        const img = document.getElementById(id);
        if (!img) return;
        const canvas = document.createElement("canvas");
        canvas.width = 900;
        canvas.height = 675;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#cfd5dc";
        ctx.lineWidth = 8;
        ctx.strokeRect(28, 28, canvas.width - 56, canvas.height - 56);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(80, 110, 740, 360);
        ctx.strokeStyle = color;
        ctx.lineWidth = 6;
        ctx.strokeRect(80, 110, 740, 360);
        ctx.fillStyle = color;
        ctx.font = "700 54px sans-serif";
        ctx.fillText(title, 118, 190);
        ctx.font = "500 34px sans-serif";
        lines.forEach((line, index) => ctx.fillText(line, 122, 270 + index * 58));
        ctx.fillStyle = "rgba(17,19,24,.78)";
        ctx.fillRect(0, 560, canvas.width, 115);
        ctx.fillStyle = "#fff";
        ctx.font = "700 28px sans-serif";
        ctx.fillText("现场证据 · 今天 11:42 · 阳光社区助老食堂", 44, 610);
        ctx.font = "500 22px sans-serif";
        ctx.fillText("GPS 31.2312, 121.4746 · GroundLink 水印", 44, 646);
        img.src = canvas.toDataURL("image/png");
      });
    }

    function toast(message, type = "success") {
      const el = document.createElement("div");
      el.className = `toast ${type === "error" ? "error" : type === "warn" ? "warn" : ""}`;
      el.textContent = message;
      $("#toastRegion").appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transform = "translateY(6px)";
        el.style.transition = "all .2s ease";
      }, 2600);
      setTimeout(() => el.remove(), 3100);
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    $("#roleA").addEventListener("click", () => updateState({ role: "A" }, { actor: "平台", text: "演示视角切换到委托方 A" }));
    $("#roleB").addEventListener("click", () => updateState({ role: "B" }, { actor: "平台", text: "演示视角切换到执行方 B" }));
    $("#resetBtn").addEventListener("click", () => {
      confirmDialog("重置演示数据", "这会清除本地保存的任务进度。", `<p>确认重置 GroundLink 演示状态吗？</p><div class="actions"><button class="btn red" type="button" data-confirm="reset">${icon("x")}确认重置</button><button class="btn secondary" type="button" data-confirm="cancel">取消</button></div>`);
    });
    $("#modalClose").addEventListener("click", closeModal);
    $("#modalBackdrop").addEventListener("click", (event) => { if (event.target.id === "modalBackdrop") closeModal(); });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeModal(); });

    render();
  </script>
</body>
</html>
