    <!-- 布局模式提示 -->
    <div class="layout-badge" id="layoutBadge">画布: 1920×1080 | 自动检测中</div>

    <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)">
    <input type="file" id="replaceInput" accept="image/*" style="display:none" onchange="handleReplaceFile(this.files[0])">

    <script>
        // 全局状态
        let images = [];
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };
        let draggedCard = null;
        let draggedCardId = null;
        let dragStartClientX = 0;
        let dragStartClientY = 0;
        let dragStartCardLeft = 0;
        let dragStartCardTop = 0;
        let randomAngleEnabled = false;
        let keepRatioEnabled = false;
        let canvasResolution = { w: 1920, h: 1080 };
        let displayScale = 1;
        let currentPositions = []; // 记录当前排版位置（画布坐标）
        let cardRadius = 16;
        let paddingConfig = { top: 16, bottom: 16, left: 16, right: 16 };
        let paddingGuideEnabled = false;
        let replaceTargetId = null;
        let layoutLocked = false;
        let currentTemplate = null;
        let canvasBgColor = '#ffffff';
        let textItems = [];

        // 自由调整拖拽变量
        let isFreeMoving = false;
        let freeMovedCard = null;
        let freeMoveStartX = 0;
        let freeMoveStartY = 0;
        let freeMoveStartLeft = 0;
        let freeMoveStartTop = 0;

        // DOM 元素
        const uploadZone = document.getElementById('uploadZone');
        const gallery = document.getElementById('gallery');
        const fileInput = document.getElementById('fileInput');
        const imageCount = document.getElementById('imageCount');
        const layoutBadge = document.getElementById('layoutBadge');
        const angleToggle = document.getElementById('angleToggle');
        const exportMenu = document.getElementById('exportMenu');
        const exportOverlay = document.getElementById('exportOverlay');
        const paddingGuideToggle = document.getElementById('paddingGuideToggle');
        const replaceInput = document.getElementById('replaceInput');

        // ==================== 文字图层功能 ====================

        function openTextPanel() {
            const overlay = document.createElement('div');
            overlay.className = 'text-panel-overlay';
            overlay.id = 'textPanelOverlay';
            overlay.innerHTML = `
                <div class="text-panel">
                    <h3>添加文字</h3>
                    <div class="form-group">
                        <label>文字内容</label>
                        <input type="text" id="textContent" placeholder="输入文字..." value="输入文字">
                    </div>
                    <div class="form-group">
                        <label>字体大小：<span id="textSizeValue">32</span>px</label>
                        <input type="range" id="textSize" min="12" max="120" value="32" oninput="document.getElementById('textSizeValue').textContent = this.value">
                    </div>
                    <div class="form-group">
                        <label>字体颜色</label>
                        <div class="color-picker-row">
                            <input type="color" id="textColor" value="#000000">
                            <input type="text" id="textColorHex" value="#000000" onchange="document.getElementById('textColor').value = this.value">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>对齐方式</label>
                        <select id="textAlign">
                            <option value="center">居中</option>
                            <option value="left">左对齐</option>
                            <option value="right">右对齐</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-group">
                            <input type="checkbox" id="textShadow" checked> 添加阴影
                        </label>
                    </div>
                    <div class="text-controls">
                        <button class="btn btn-secondary" onclick="closeTextPanel()">取消</button>
                        <button class="btn btn-primary" onclick="addTextItem()">添加</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function closeTextPanel() {
            const overlay = document.getElementById('textPanelOverlay');
            if (overlay) overlay.remove();
        }

        function addTextItem() {
            const content = document.getElementById('textContent').value || '输入文字';
            const size = parseInt(document.getElementById('textSize').value);
            const color = document.getElementById('textColor').value;
            const align = document.getElementById('textAlign').value;
            const shadow = document.getElementById('textShadow').checked;

            const textItem = {
                id: Date.now() + Math.random(),
                content: content,
                size: size,
                color: color,
                align: align,
                shadow: shadow,
                x: canvasResolution.w / 2 - 100,
                y: canvasResolution.h / 2 - size / 2,
                width: 200,
                height: size
            };

            textItems.push(textItem);

            gallery.style.display = 'block';
            uploadZone.classList.add('hidden');
            updateCanvasSize();

            renderTextItem(textItem);
            closeTextPanel();
        }

        function renderTextItem(textItem) {
            const el = document.createElement('div');
            el.className = 'canvas-text-item';
            el.dataset.id = textItem.id;
            el.style.left = textItem.x * displayScale + 'px';
            el.style.top = textItem.y * displayScale + 'px';
            el.style.width = textItem.width * displayScale + 'px';
            el.style.fontSize = textItem.size * displayScale + 'px';
            el.style.color = textItem.color;
            el.style.textAlign = textItem.align;
            if (textItem.shadow) {
                el.style.textShadow = '2px 2px 4px rgba(0,0,0,0.5)';
            }

            el.textContent = textItem.content;

            el.addEventListener('mousedown', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.canvas-text-item').forEach(t => t.classList.remove('selected'));
                el.classList.add('selected');
                startTextDrag(e, textItem, el);
            });

            el.addEventListener('dblclick', () => {
                editTextItem(textItem, el);
            });

            // 删除按钮
            const delBtn = document.createElement('button');
            delBtn.className = 'text-delete-btn';
            delBtn.innerHTML = '×';
            delBtn.title = '删除文字';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteTextItem(textItem.id);
            });
            el.appendChild(delBtn);

            gallery.appendChild(el);
        }

        function startTextDrag(e, textItem, el) {
            const startX = e.clientX;
            const startY = e.clientY;
            const startLeft = textItem.x;
            const startTop = textItem.y;

            function onMove(e) {
                const dx = (e.clientX - startX) / displayScale;
                const dy = (e.clientY - startY) / displayScale;
                textItem.x = Math.max(0, Math.min(startLeft + dx, canvasResolution.w - textItem.width));
                textItem.y = Math.max(0, Math.min(startTop + dy, canvasResolution.h - textItem.height));
                el.style.left = textItem.x * displayScale + 'px';
                el.style.top = textItem.y * displayScale + 'px';
            }

            function onUp() {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
            }

            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        }

        function editTextItem(textItem, el) {
            const textarea = document.createElement('textarea');
            textarea.className = 'text-edit-area';
            textarea.value = textItem.content;
            textarea.style.fontSize = textItem.size * displayScale + 'px';
            textarea.style.color = textItem.color;
            textarea.style.width = '100%';
            textarea.style.height = textItem.height * displayScale + 'px';
            textarea.style.textAlign = textItem.align;

            el.innerHTML = '';
            el.appendChild(textarea);
            textarea.focus();

            textarea.addEventListener('blur', () => {
                textItem.content = textarea.value || '输入文字';
                el.textContent = textItem.content;
            });

            textarea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    textarea.blur();
                }
            });
        }

        function deleteTextItem(id) {
            textItems = textItems.filter(t => t.id !== id);
            const el = gallery.querySelector(`.canvas-text-item[data-id="${id}"]`);
            if (el) el.remove();
        }

        function clearTextItems() {
            gallery.querySelectorAll('.canvas-text-item').forEach(el => el.remove());
        }

        // ==================== 背景色设置 ====================

        function selectBgColor(btn) {
            document.querySelectorAll('.color-preset').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            canvasBgColor = btn.dataset.color;
            applyBgColor(canvasBgColor);
        }

        function applyCustomBgColor(color) {
            canvasBgColor = color;
            document.querySelectorAll('.color-preset').forEach(b => b.classList.remove('active'));
            applyBgColor(color);
        }

        function applyBgColor(color) {
            gallery.style.background = color;
            document.getElementById('customBgColor').value = color;
        }

        // ==================== 分辨率设置 ====================

        function toggleResolutionMenu(e) {
            if (e) e.stopPropagation();
            closeAllToolbarDropdowns();
            const menu = document.getElementById('resolutionMenu');
            menu.classList.toggle('show');
        }

        function toggleCanvasStyleMenu(e) {
            if (e) e.stopPropagation();
            closeAllToolbarDropdowns();
            const menu = document.getElementById('canvasStyleMenu');
            menu.classList.toggle('show');
        }

        function togglePaddingGuideMenu(e) {
            if (e) e.stopPropagation();
            closeAllToolbarDropdowns();
            const menu = document.getElementById('paddingGuideMenu');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        }

        function toggleRadiusMenu(e) {
            if (e) e.stopPropagation();
            closeAllToolbarDropdowns();
            const menu = document.getElementById('radiusMenu');
            menu.classList.toggle('show');
        }

        function closeAllToolbarDropdowns() {
            const r = document.getElementById('resolutionMenu');
            const c = document.getElementById('canvasStyleMenu');
            const p = document.getElementById('paddingGuideMenu');
            const rad = document.getElementById('radiusMenu');
            if (r) r.classList.remove('show');
            if (c) c.classList.remove('show');
            if (p) p.style.display = 'none';
            if (rad) rad.classList.remove('show');
        }

        function selectPreset(btn) {
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const w = parseInt(btn.dataset.w);
            const h = parseInt(btn.dataset.h);
            canvasResolution = { w, h };
            document.getElementById('customW').value = '';
            document.getElementById('customH').value = '';
            applyResolution();
            closeAllToolbarDropdowns();
        }

        function applyCustomRes() {
            const w = parseInt(document.getElementById('customW').value);
            const h = parseInt(document.getElementById('customH').value);
            if (!w || !h || w < 100 || h < 100) {
                alert('请输入有效的分辨率（最小 100×100）');
                return;
            }
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            canvasResolution = { w, h };
            applyResolution();
        }

        function applyResolution() {
            updateCanvasSize();
            updateLayoutBadge();
            updateGallery();
        }

        // ==================== 圆角 & 边距调整 ====================

        function updateCardRadius(value) {
            cardRadius = parseInt(value);
            document.getElementById('radiusValue').textContent = cardRadius + 'px';
            document.documentElement.style.setProperty('--card-radius', cardRadius + 'px');
            // 实时更新已有卡片
            document.querySelectorAll('.photo-card').forEach(card => {
                card.style.borderRadius = cardRadius + 'px';
            });
        }

        function updatePadding() {
            paddingConfig.top = parseInt(document.getElementById('padTop').value) || 0;
            paddingConfig.bottom = parseInt(document.getElementById('padBottom').value) || 0;
            paddingConfig.left = parseInt(document.getElementById('padLeft').value) || 0;
            paddingConfig.right = parseInt(document.getElementById('padRight').value) || 0;
            updateGallery();
        }

        function updateCanvasSize() {
            const mainContent = document.querySelector('.main-content');
            const maxDisplayW = mainContent.clientWidth - 48;
            const maxDisplayH = window.innerHeight - 200;

            const scaleX = maxDisplayW / canvasResolution.w;
            const scaleY = maxDisplayH / canvasResolution.h;
            displayScale = Math.min(scaleX, scaleY, 1);

            const displayW = Math.round(canvasResolution.w * displayScale);
            const displayH = Math.round(canvasResolution.h * displayScale);

            gallery.style.width = displayW + 'px';
            gallery.style.height = displayH + 'px';
            gallery.classList.remove('empty');
        }

        // ==================== 自由调整开关 ====================

        function toggleAngle() {
            randomAngleEnabled = angleToggle.checked;
            updateGallery();
        }

        function toggleKeepRatio() {
            keepRatioEnabled = document.getElementById('keepRatioToggle').checked;
            updateGallery();
        }

        function toggleLayoutLock() {
            layoutLocked = document.getElementById('layoutLockToggle').checked;
            if (layoutLocked && !currentTemplate && images.length > 0) {
                // 锁定前保存当前模板
                computeLayout();
            }
        }

        function togglePaddingGuide() {
            paddingGuideEnabled = paddingGuideToggle.checked;
            const paddingSettingsRow = document.getElementById('paddingSettingsRow');
            paddingSettingsRow.style.display = paddingGuideEnabled ? 'flex' : 'none';
            updatePaddingGuideLines();
        }

        function createPaddingGuideLines() {
            const directions = ['Top', 'Bottom', 'Left', 'Right'];
            directions.forEach(dir => {
                const line = document.createElement('div');
                line.id = 'line' + dir;
                line.className = 'padding-guide-line ' + (dir === 'Top' || dir === 'Bottom' ? 'horizontal' : 'vertical');
                line.style.display = 'none';
                gallery.appendChild(line);
            });
            setupPaddingGuideDrag();
        }

        function updatePaddingGuideLines() {
            const lines = {
                Top: document.getElementById('lineTop'),
                Bottom: document.getElementById('lineBottom'),
                Left: document.getElementById('lineLeft'),
                Right: document.getElementById('lineRight')
            };
            if (!lines.Top) {
                createPaddingGuideLines();
                return updatePaddingGuideLines();
            }

            const hasImages = images.length > 0;
            const show = paddingGuideEnabled && hasImages;
            const s = displayScale;

            if (lines.Top) {
                lines.Top.style.display = show ? 'block' : 'none';
                lines.Top.style.top = (paddingConfig.top * s) + 'px';
            }
            if (lines.Bottom) {
                lines.Bottom.style.display = show ? 'block' : 'none';
                lines.Bottom.style.bottom = (paddingConfig.bottom * s) + 'px';
            }
            if (lines.Left) {
                lines.Left.style.display = show ? 'block' : 'none';
                lines.Left.style.left = (paddingConfig.left * s) + 'px';
            }
            if (lines.Right) {
                lines.Right.style.display = show ? 'block' : 'none';
                lines.Right.style.right = (paddingConfig.right * s) + 'px';
            }
        }

        function setupPaddingGuideDrag() {
            let draggingLine = null;
            let dragDir = null;
            let startClient = 0;
            let startValue = 0;

            const lines = ['Top', 'Bottom', 'Left', 'Right'];
            lines.forEach(dir => {
                const line = document.getElementById('line' + dir);
                if (!line) return;

                const onMouseDown = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    draggingLine = line;
                    dragDir = dir;
                    if (dir === 'Top' || dir === 'Bottom') {
                        startClient = e.clientY;
                    } else {
                        startClient = e.clientX;
                    }
                    startValue = paddingConfig[dir.toLowerCase()];
                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                };

                line.addEventListener('mousedown', onMouseDown);
            });

            function onMouseMove(e) {
                if (!draggingLine) return;
                e.preventDefault();
                let delta;
                if (dragDir === 'Top' || dragDir === 'Bottom') {
                    delta = (e.clientY - startClient) / displayScale;
                    if (dragDir === 'Bottom') delta = -delta;
                } else {
                    delta = (e.clientX - startClient) / displayScale;
                    if (dragDir === 'Right') delta = -delta;
                }
                let newValue = Math.round(startValue + delta);
                if (newValue < 0) newValue = 0;
                const maxPad = Math.min(canvasResolution.w, canvasResolution.h) - 20;
                if (newValue > maxPad) newValue = maxPad;
                paddingConfig[dragDir.toLowerCase()] = newValue;

                const s = displayScale;
                if (dragDir === 'Top') draggingLine.style.top = (newValue * s) + 'px';
                if (dragDir === 'Bottom') draggingLine.style.bottom = (newValue * s) + 'px';
                if (dragDir === 'Left') draggingLine.style.left = (newValue * s) + 'px';
                if (dragDir === 'Right') draggingLine.style.right = (newValue * s) + 'px';

                const tooltip = document.getElementById('guideTooltip');
                tooltip.textContent = newValue + 'px';
                tooltip.classList.add('show');
                if (dragDir === 'Top' || dragDir === 'Bottom') {
                    tooltip.style.left = (e.clientX + 12) + 'px';
                    tooltip.style.top = (e.clientY - 30) + 'px';
                } else {
                    tooltip.style.left = (e.clientX + 12) + 'px';
                    tooltip.style.top = (e.clientY - 30) + 'px';
                }
            }

            function onMouseUp() {
                document.getElementById('guideTooltip').classList.remove('show');
                if (draggingLine) {
                    document.getElementById('pad' + dragDir).value = paddingConfig[dragDir.toLowerCase()];
                    if (layoutLocked && currentTemplate) {
                        updateGalleryLocked();
                    } else {
                        updateGallery();
                    }
                }
                draggingLine = null;
                dragDir = null;
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }
        }

        // ==================== 布局徽章 ====================

        function updateLayoutBadge() {
            const mode = getLayoutMode();
            layoutBadge.textContent = `画布: ${canvasResolution.w}×${canvasResolution.h} | ${mode.name} (${images.length} 张图片)`;
        }

        function getLayoutMode() {
            const w = canvasResolution.w;
            if (w < 768) return { name: '手机端', cols: 2, gap: 10 };
            if (w < 1024) return { name: '平板端', cols: 3, gap: 14 };
            if (w < 1440) return { name: '桌面端', cols: 4, gap: 16 };
            return { name: '大屏端', cols: 5, gap: 18 };
        }

        // ==================== 图片计数 ====================

        function updateImageCount() {
            if (images.length === 0) {
                imageCount.textContent = '暂无图片';
            } else {
                imageCount.textContent = `共 ${images.length} 张图片`;
            }
        }

        // ==================== 文件处理 ====================

        function handleFiles(files) {
            let hasImages = false;
            for (const file of files) {
                if (file.type.startsWith('image/')) {
                    hasImages = true;
                    break;
                }
            }
            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const compressedSrc = e.target.result;
                    const img = new Image();
                    img.onload = () => {
                        images.push({
                            id: Date.now() + Math.random(),
                            src: compressedSrc,
                            origW: img.width,
                            origH: img.height,
                            ratio: img.width / img.height,
                            crop: { x: 0, y: 0, w: img.width, h: img.height },
                            originalSize: file.size,
                            lockedRatio: null
                        });
                        updateGallery();
                    };
                    img.src = compressedSrc;
                };
                reader.readAsDataURL(file);
            }
        }

        // ==================== 创建图片卡片 ====================

        function createCard(imageData, x, y, w, h, rotation) {
            const card = document.createElement('div');
            card.className = 'photo-card ' + (randomAngleEnabled ? 'random-angle' : 'no-angle');
            card.style.left = x + 'px';
            card.style.top = y + 'px';
            card.style.width = w + 'px';
            card.style.height = h + 'px';
            card.style.borderRadius = cardRadius + 'px';
            card.style.setProperty('--rotation', rotation + 'deg');
            card.style.transform = `rotate(${rotation}deg)`;
            card.style.zIndex = Math.floor(Math.random() * 10) + 1;
            card.dataset.id = imageData.id;

            const img = document.createElement('img');
            img.src = imageData.src;
            img.alt = '图片';
            img.draggable = false;
            // keepRatio 模式下用 contain 确保图片不被裁切
            img.style.objectFit = keepRatioEnabled ? 'contain' : 'cover';

            const info = document.createElement('div');
            info.className = 'photo-info';
            info.textContent = `${imageData.origW} × ${imageData.origH}`;

            const delBtn = document.createElement('button');
            delBtn.className = 'photo-delete';
            delBtn.innerHTML = '×';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                deleteImage(imageData.id);
            };

            const replaceBtn = document.createElement('button');
            replaceBtn.className = 'photo-replace';
            replaceBtn.innerHTML = '⟳';
            replaceBtn.title = '替换图片';
            replaceBtn.onclick = (e) => {
                e.stopPropagation();
                replaceImage(imageData.id);
            };

            card.appendChild(img);
            card.appendChild(info);
            card.appendChild(delBtn);
            card.appendChild(replaceBtn);

            const handles = ['nw','ne','sw','se'];
            handles.forEach(cls => {
                const h = document.createElement('div');
                h.className = 'resize-handle ' + cls;
                h.addEventListener('mousedown', (ev) => startResize(ev, imageData.id, cls));
                card.appendChild(h);
            });
            const rotHandle = document.createElement('div');
            rotHandle.className = 'rotate-handle';
            rotHandle.addEventListener('mousedown', (ev) => startRotate(ev, imageData.id));
            card.appendChild(rotHandle);

            card.addEventListener('mousedown', startDrag);
            card.addEventListener('touchstart', startDrag, { passive: false });
            card.addEventListener('dblclick', () => openAspectRatioPanel(imageData));

            return card;
        }

        // ==================== 比例限定面板 ====================

        function openAspectRatioPanel(imageData) {
            const overlay = document.createElement('div');
            overlay.className = 'aspect-ratio-overlay';
            overlay.id = 'aspectRatioOverlay';

            const panel = document.createElement('div');
            panel.className = 'aspect-ratio-panel';

            const title = document.createElement('h3');
            title.textContent = '设定图片比例';
            panel.appendChild(title);

            // 预设比例
            const presets = [
                { label: '1:1', ratio: 1 },
                { label: '4:3', ratio: 4/3 },
                { label: '16:9', ratio: 16/9 },
                { label: '9:16', ratio: 9/16 },
                { label: '3:4', ratio: 3/4 },
                { label: '2:3', ratio: 2/3 },
                { label: '3:2', ratio: 3/2 },
                { label: '原图比例', ratio: imageData.ratio }
            ];

            const presetsDiv = document.createElement('div');
            presetsDiv.className = 'ratio-presets';

            let currentRatio = imageData.lockedRatio || imageData.ratio;
            let selectedBtn = null;

            presets.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'ratio-preset-btn';
                btn.textContent = p.label;
                if (Math.abs(currentRatio - p.ratio) < 0.01) {
                    btn.classList.add('active');
                    selectedBtn = btn;
                }
                btn.onclick = () => {
                    if (selectedBtn) selectedBtn.classList.remove('active');
                    btn.classList.add('active');
                    selectedBtn = btn;
                    currentRatio = p.ratio;
                    customW.value = '';
                    customH.value = '';
                    updatePreview();
                };
                presetsDiv.appendChild(btn);
            });
            panel.appendChild(presetsDiv);

            // 自定义输入
            const customDiv = document.createElement('div');
            customDiv.className = 'ratio-custom';
            customDiv.innerHTML = '<span>自定义：</span>';
            const customW = document.createElement('input');
            customW.type = 'number';
            customW.placeholder = '宽';
            customW.min = 1;
            const customH = document.createElement('input');
            customH.type = 'number';
            customH.placeholder = '高';
            customH.min = 1;
            const customLabel = document.createElement('span');
            customLabel.textContent = '×';
            customDiv.appendChild(customW);
            customDiv.appendChild(customLabel);
            customDiv.appendChild(customH);
            panel.appendChild(customDiv);

            function onCustomInput() {
                const w = parseFloat(customW.value);
                const h = parseFloat(customH.value);
                if (w > 0 && h > 0) {
                    currentRatio = w / h;
                    if (selectedBtn) selectedBtn.classList.remove('active');
                    selectedBtn = null;
                    updatePreview();
                }
            }
            customW.addEventListener('input', onCustomInput);
            customH.addEventListener('input', onCustomInput);

            // 预览区
            const previewDiv = document.createElement('div');
            previewDiv.className = 'ratio-preview';
            const previewImg = document.createElement('img');
            previewImg.src = imageData.src;
            previewDiv.appendChild(previewImg);
            const previewMask = document.createElement('div');
            previewMask.className = 'ratio-preview-mask';
            previewDiv.appendChild(previewMask);
            panel.appendChild(previewDiv);

            function updatePreview() {
                const imgW = previewImg.naturalWidth || previewImg.width || 300;
                const imgH = previewImg.naturalHeight || previewImg.height || 200;
                const containerW = previewDiv.clientWidth;
                const containerH = previewDiv.clientHeight;
                const containerRatio = containerW / containerH;
                const imgRatio = imgW / imgH;

                let drawW, drawH;
                if (imgRatio > containerRatio) {
                    drawW = containerW;
                    drawH = containerW / imgRatio;
                } else {
                    drawH = containerH;
                    drawW = containerH * imgRatio;
                }

                const drawX = (containerW - drawW) / 2;
                const drawY = (containerH - drawH) / 2;

                let maskW, maskH, maskX, maskY;
                const targetRatio = currentRatio;
                const drawAspectRatio = drawW / drawH;

                if (targetRatio > drawAspectRatio) {
                    maskW = drawW;
                    maskH = drawW / targetRatio;
                    maskX = drawX;
                    maskY = drawY + (drawH - maskH) / 2;
                } else {
                    maskH = drawH;
                    maskW = drawH * targetRatio;
                    maskX = drawX + (drawW - maskW) / 2;
                    maskY = drawY;
                }

                previewMask.style.left = maskX + 'px';
                previewMask.style.top = maskY + 'px';
                previewMask.style.width = maskW + 'px';
                previewMask.style.height = maskH + 'px';
                previewMask.style.background = 'rgba(0,0,0,0.35)';
            }

            previewImg.onload = updatePreview;
            setTimeout(updatePreview, 100);

            // 按钮
            const controls = document.createElement('div');
            controls.className = 'ratio-controls';

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn btn-secondary';
            cancelBtn.textContent = '取消';
            cancelBtn.onclick = () => overlay.remove();

            const confirmBtn = document.createElement('button');
            confirmBtn.className = 'btn btn-primary';
            confirmBtn.textContent = '确定';
            confirmBtn.onclick = () => {
                const originalImg = images.find(img => img.id === imageData.id);
                if (originalImg) {
                    originalImg.lockedRatio = currentRatio;
                }
                overlay.remove();
                updateGallery();
            };

            controls.appendChild(cancelBtn);
            controls.appendChild(confirmBtn);
            panel.appendChild(controls);

            overlay.appendChild(panel);
            document.body.appendChild(overlay);

            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.remove();
            });
        }

        // ==================== 布局计算（模板化排列组合） ====================

        function getRotation() {
            if (randomAngleEnabled) {
                return (Math.random() - 0.5) * 16;
            }
            return 0;
        }

        // 获取最大列数（根据画布宽度）
        function getMaxCols(canvasW) {
            if (canvasW < 500) return 2;
            if (canvasW < 768) return 2;
            if (canvasW < 1024) return 3;
            if (canvasW < 1440) return 4;
            return 5;
        }

        function getGap(canvasW) {
            if (canvasW < 768) return 10;
            if (canvasW < 1024) return 14;
            if (canvasW < 1440) return 16;
            return 18;
        }

        // ==================== 画布自适应排版引擎 ====================
        // 核心规则：
        // 1. 排版严格限制在画布分辨率范围内
        // 2. 同行图片统一高度，顶底完美对齐
        // 3. 图片不会溢出画布
        // 4. 支持不等宽排列（如 2:1 宽度比）

        // 模板格式说明：
        //   [3, 2]              -> 等宽：第一行3个，第二行2个
        //   [[2, 1], [1, 1, 1]] -> 不等宽：第一行2个宽比2:1，第二行3个等宽
        //   [1, [2, 1], 2]      -> 混合：第一行1个全宽，第二行2:1，第三行2个等宽

        function computeLayout() {
            if (images.length === 0) return [];

            const canvasW = canvasResolution.w;
            const canvasH = canvasResolution.h;
            const maxCols = getMaxCols(canvasW);
            const gap = getGap(canvasW);
            const count = images.length;

            // 生成该图片数量下所有可能的模板
            let templates = generateTemplates(count, maxCols);

            // 过滤掉会超出画布高度的模板
            templates = templates.filter(tpl => {
                const estimatedH = estimateTotalHeight(tpl, canvasW, gap);
                return estimatedH <= canvasH + gap;
            });

            if (templates.length === 0) {
                templates = [normalizeTemplate([count])];
            }

            const template = templates[Math.floor(Math.random() * templates.length)];
            currentTemplate = template;

            // 根据模板排列图片
            return applyTemplate(template, canvasW, canvasH, gap);
        }

        // 标准化模板：统一转为 {counts, ratios} 格式
        function normalizeTemplate(raw) {
            const counts = [];
            const ratios = [];

            raw.forEach(row => {
                if (Array.isArray(row)) {
                    counts.push(row.length);
                    ratios.push(row);
                } else {
                    counts.push(row);
                    ratios.push(new Array(row).fill(1));
                }
            });

            return { counts, ratios };
        }

        // 获取模板占用的图片总数
        function getTemplateItemCount(tpl) {
            if (tpl.counts) return tpl.counts.reduce((s, c) => s + c, 0);
            return tpl.reduce((s, r) => s + (Array.isArray(r) ? r.length : r), 0);
        }

        // 估算模板总高度（用于过滤）
        // 逻辑：先算原始高度，若超出画布则模拟 applyTemplate 的压缩
        function estimateTotalHeight(tpl, canvasW, gap) {
            const norm = tpl.counts ? tpl : normalizeTemplate(tpl);
            const padL = paddingConfig.left;
            const padR = paddingConfig.right;
            const padT = paddingConfig.top;
            const padB = paddingConfig.bottom;
            const usableW = canvasW - padL - padR;
            let totalH = padT + padB;
            let imgIndex = 0;

            norm.counts.forEach((count, idx) => {
                const ratio = norm.ratios[idx];
                const ratioSum = ratio.reduce((s, r) => s + r, 0);
                const rowGapTotal = gap * (count - 1);

                if (count === 1) {
                    const img = images[imgIndex];
                    const w = usableW;
                    const h = keepRatioEnabled ? (w / img.ratio) : Math.min(w / img.ratio, canvasResolution.h * 0.8);
                    totalH += h + gap;
                    imgIndex++;
                } else {
                    const unitW = (usableW - rowGapTotal) / ratioSum;
                    let maxH = 0;
                    for (let i = 0; i < count; i++) {
                        const img = images[imgIndex + i];
                        const w = unitW * ratio[i];
                        const h = w / img.ratio;
                        maxH = Math.max(maxH, h);
                    }
                    if (!keepRatioEnabled) maxH = Math.min(maxH, canvasResolution.h * 0.8);
                    totalH += maxH + gap;
                    imgIndex += count;
                }
            });

            // 模拟 applyTemplate 的压缩逻辑：估算最终高度
            if (totalH > canvasResolution.h) {
                const contentH = totalH - padT - padB - gap * (norm.counts.length - 1);
                const targetH = canvasResolution.h - padT - padB - gap * (norm.counts.length - 1);
                if (targetH > 0 && contentH > 0) {
                    totalH = targetH + padT + padB + gap * (norm.counts.length - 1);
                }
            }

            return totalH;
        }

        // ==================== 模板生成器 ====================

        function generateTemplates(count, maxCols) {
            const templates = [];

            // 1. 自动生成等宽模板
            const rowsList = partitionRows(count, maxCols);
            rowsList.forEach(rows => {
                templates.push(normalizeTemplate(rows));
            });

            // 2. 手动添加不等宽经典模板
            const extra = getExtraTemplates(count, maxCols);
            extra.forEach(tpl => {
                if (getTemplateItemCount(tpl) === count) {
                    templates.push(normalizeTemplate(tpl));
                }
            });

            // 去重
            const seen = new Set();
            const unique = [];
            templates.forEach(t => {
                const key = t.counts.join(',') + '|' + t.ratios.map(r => r.join(':')).join(',');
                if (!seen.has(key)) {
                    seen.add(key);
                    unique.push(t);
                }
            });

            if (unique.length === 0) {
                unique.push(normalizeTemplate([count]));
            }

            return unique;
        }

        const GOLDEN_RATIO = 1.618;

        // 黄金分割模板库 - 所有模板严格遵循1:1.618比例
        function getExtraTemplates(count, maxCols) {
            const extras = [];

            if (count === 2) {
                extras.push(
                    [[GOLDEN_RATIO, 1]],    // 左大图右小图 (61.8% : 38.2%)
                    [[1, GOLDEN_RATIO]]     // 左小图右大图
                );
            }

            if (count === 3) {
                extras.push(
                    [GOLDEN_RATIO, [1, 1]],      // 上大图(61.8%) + 下双小图
                    [[1, 1], GOLDEN_RATIO],      // 上双小图 + 下大图
                    [[GOLDEN_RATIO, 1], 1],      // 上左大右小 + 下全宽
                    [[1, GOLDEN_RATIO], 1]       // 上左小右大 + 下全宽
                );
            }

            if (count === 4) {
                extras.push(
                    [[GOLDEN_RATIO, 1], [GOLDEN_RATIO, 1]],  // 两行都是黄金分割
                    [[1, GOLDEN_RATIO], [1, GOLDEN_RATIO]],  // 两行反向黄金分割
                    [GOLDEN_RATIO, [1, 1, 1]],               // 上大图 + 下三小图
                    [[1, 1, 1], GOLDEN_RATIO],               // 上三小图 + 下大图
                    [[GOLDEN_RATIO, 1, 1]],                  // 单行左大右双小
                    [[1, 1, GOLDEN_RATIO]]                   // 单行左双小右大
                );
            }

            if (count === 5) {
                extras.push(
                    [[GOLDEN_RATIO, [1, 1]], [1, 1]],        // 上左大右双小 + 下双小
                    [[1, 1], [GOLDEN_RATIO, [1, 1]]],        // 上双小 + 下左大右双小
                    [[GOLDEN_RATIO, 1], [1, 1, 1]],           // 上黄金分割 + 下三小图
                    [[1, 1, 1], [GOLDEN_RATIO, 1]],           // 上三小图 + 下黄金分割
                    [1, [GOLDEN_RATIO, 1], 1]                // 上全宽 + 中黄金分割 + 下全宽
                );
            }

            if (count === 6) {
                extras.push(
                    [[GOLDEN_RATIO, 1], [GOLDEN_RATIO, 1], 1],      // 两行黄金分割 + 下全宽
                    [1, [GOLDEN_RATIO, 1], [GOLDEN_RATIO, 1]],      // 上全宽 + 两行黄金分割
                    [[GOLDEN_RATIO, [1, 1]], [GOLDEN_RATIO, [1, 1]]], // 两行都是左大右双小
                    [[GOLDEN_RATIO, 1, 1], [1, 1, 1]],             // 上左大右双小 + 下三小图
                    [[1, 1, 1], [GOLDEN_RATIO, 1, 1]]              // 上三小图 + 下左大右双小
                );
            }

            if (count === 7) {
                extras.push(
                    [[GOLDEN_RATIO, [1, 1]], [1, 1, 1]],           // 上左大右双小 + 下三小图
                    [[1, 1, 1], [GOLDEN_RATIO, [1, 1]]],           // 上三小图 + 下左大右双小
                    [[GOLDEN_RATIO, 1], [GOLDEN_RATIO, 1], [1, 1]], // 两行黄金分割 + 下双小
                    [[1, GOLDEN_RATIO], [1, GOLDEN_RATIO], [1, 1]]  // 两行反向黄金分割 + 下双小
                );
            }

            if (count >= 8) {
                extras.push(
                    [[GOLDEN_RATIO, 1], [GOLDEN_RATIO, 1], [1, 1, 1]], // 两行黄金分割 + 下三小图
                    [[1, GOLDEN_RATIO], [1, GOLDEN_RATIO], [1, 1, 1]], // 两行反向黄金分割 + 下三小图
                    [[GOLDEN_RATIO, [1, 1]], [GOLDEN_RATIO, [1, 1]]],   // 两行都是左大右双小
                    [[GOLDEN_RATIO, 1, 1], [GOLDEN_RATIO, 1, 1]]        // 两行都是左大右双小
                );
            }

            return extras;
        }

        // 将 count 分成多行（每行元素数之和 = count）
        function partitionRows(count, maxCols) {
            const results = [];
            const maxRowSize = maxCols;

            // 1 行
            if (count <= maxRowSize) {
                results.push([count]);
            }

            // 2 行
            if (count >= 2) {
                for (let first = 1; first < count && first <= maxRowSize; first++) {
                    const second = count - first;
                    if (second <= maxRowSize && second > 0) {
                        results.push([first, second]);
                    }
                }
            }

            // 3 行
            if (count >= 3) {
                for (let first = 1; first <= Math.min(maxRowSize, count - 2); first++) {
                    for (let second = 1; second <= Math.min(maxRowSize, count - first - 1); second++) {
                        const third = count - first - second;
                        if (third <= maxRowSize && third > 0) {
                            results.push([first, second, third]);
                        }
                    }
                }
            }

            // 4 行
            if (count >= 4 && maxRowSize >= 3) {
                for (let first = 1; first <= Math.min(maxRowSize, count - 3); first++) {
                    for (let second = 1; second <= Math.min(maxRowSize, count - first - 2); second++) {
                        for (let third = 1; third <= Math.min(maxRowSize, count - first - second - 1); third++) {
                            const fourth = count - first - second - third;
                            if (fourth <= maxRowSize && fourth > 0) {
                                results.push([first, second, third, fourth]);
                            }
                        }
                    }
                }
            }

            // 5 行
            if (count >= 5 && maxRowSize >= 2) {
                for (let first = 1; first <= 2; first++) {
                    for (let second = 1; second <= 2; second++) {
                        for (let third = 1; third <= 2; third++) {
                            for (let fourth = 1; fourth <= 2; fourth++) {
                                const fifth = count - first - second - third - fourth;
                                if (fifth <= 2 && fifth > 0) {
                                    results.push([first, second, third, fourth, fifth]);
                                }
                            }
                        }
                    }
                }
            }

            return results;
        }

        // ==================== 模板应用 ====================
        // 核心：同行图片统一高度，整体不溢出画布，支持不等宽

        function applyTemplate(tpl, canvasW, canvasH, gap) {
            const positions = [];
            const norm = tpl.counts ? tpl : normalizeTemplate(tpl);
            const totalItems = norm.counts.reduce((s, c) => s + c, 0);
            if (totalItems !== images.length) return [];

            const padL = paddingConfig.left;
            const padR = paddingConfig.right;
            const padT = paddingConfig.top;
            const padB = paddingConfig.bottom;
            const usableW = canvasW - padL - padR;

            // 先计算每行的自然高度
            let imgIndex = 0;
            const rowInfos = [];

            function getEffectiveRatio(img) {
                return img.lockedRatio || img.ratio;
            }

            norm.counts.forEach((count, idx) => {
                const ratio = norm.ratios[idx];
                const ratioSum = ratio.reduce((s, r) => s + r, 0);
                const rowGapTotal = gap * (count - 1);

                if (count === 1) {
                    const img = images[imgIndex];
                    let w, h;
                    w = usableW;
                    h = keepRatioEnabled ? (w / getEffectiveRatio(img)) : Math.min(w / getEffectiveRatio(img), canvasH * 0.8);
                    rowInfos.push({ count: 1, widths: [usableW], heights: [h], h, startIndex: imgIndex });
                    imgIndex++;
                } else {
                    const unitW = (usableW - rowGapTotal) / ratioSum;
                    const widths = ratio.map(r => unitW * r);
                    let maxH = 0;
                    const heights = [];
                    for (let i = 0; i < count; i++) {
                        const img = images[imgIndex + i];
                        const h = widths[i] / getEffectiveRatio(img);
                        heights.push(h);
                        if (!keepRatioEnabled) maxH = Math.max(maxH, h);
                    }
                    if (keepRatioEnabled) {
                        maxH = Math.max(...heights);
                    } else {
                        maxH = Math.min(maxH, canvasH * 0.8);
                    }
                    rowInfos.push({ count, widths, heights, h: maxH, isKeepRatio: keepRatioEnabled, startIndex: imgIndex });
                    imgIndex += count;
                }
            });

            // 检查总高度，如果超过画布，按比例压缩
            let totalH = padT + padB;
            rowInfos.forEach(r => totalH += r.h + gap);

            if (totalH > canvasH) {
                const contentH = totalH - padT - padB - gap * (norm.counts.length - 1);
                const targetH = canvasH - padT - padB - gap * (norm.counts.length - 1);
                if (targetH > 0 && contentH > 0) {
                    const scale = targetH / contentH;
                    rowInfos.forEach(r => {
                        r.h *= scale;
                        if (r.heights) {
                            r.heights = r.heights.map(h => h * scale);
                        }
                    });
                }
            }

            // 放置图片
            const actualContentH = totalH - padT - padB - gap * (norm.counts.length - 1);
            const availableH = canvasH - padT - padB - gap * (norm.counts.length - 1);
            let yOffset = 0;
            if (actualContentH < availableH && availableH > 0) {
                yOffset = (availableH - actualContentH) / 2;
            }
            let y = padT + yOffset;
            imgIndex = 0;

            norm.counts.forEach((count, idx) => {
                const info = rowInfos[idx];
                const rowH = info.h;

                if (count === 1) {
                    const img = images[imgIndex];
                    let w = info.widths[0];
                    let h = info.isKeepRatio ? info.heights[0] : rowH;

                    // 如果该图片有锁定比例，强制按锁定比例计算尺寸
                    if (img.lockedRatio) {
                        const availableW = w;
                        const availableH = h;
                        const targetW = availableH * img.lockedRatio;
                        if (targetW <= availableW) {
                            w = targetW;
                        } else {
                            h = availableW / img.lockedRatio;
                        }
                    }

                    const x = padL + (info.widths[0] - w) / 2;
                    const yOffset = (info.isKeepRatio ? info.heights[0] : rowH) - h;
                    positions.push({ ...img, x, y: y + yOffset / 2, w, h, rotation: getRotation() });
                    y += rowH + gap;
                    imgIndex++;
                } else {
                    let x = padL;
                    for (let i = 0; i < count; i++) {
                        const img = images[imgIndex + i];
                        let w = info.widths[i];
                        let h = info.isKeepRatio ? info.heights[i] : rowH;

                        // 如果该图片有锁定比例，强制按锁定比例计算尺寸
                        if (img.lockedRatio) {
                            const availableW = w;
                            const availableH = h;
                            const targetW = availableH * img.lockedRatio;
                            if (targetW <= availableW) {
                                w = targetW;
                            } else {
                                h = availableW / img.lockedRatio;
                            }
                        }

                        const xOffset = (info.widths[i] - w) / 2;
                        const baseYOffset = info.isKeepRatio ? (rowH - (info.isKeepRatio ? info.heights[i] : rowH)) / 2 : 0;
                        const yOffset = (info.isKeepRatio ? info.heights[i] : rowH) - h;
                        positions.push({ ...img, x: x + xOffset, y: y + baseYOffset + yOffset / 2, w, h, rotation: getRotation() });
                        x += info.widths[i] + gap;
                    }
                    y += rowH + gap;
                    imgIndex += count;
                }
            });

            return positions;
        }

        // ==================== 更新画廊（带神奇移动动画） ====================

        function updateGallery() {
            if (images.length === 0 && textItems.length === 0) {
                gallery.style.display = 'none';
                uploadZone.classList.remove('hidden');
                updateImageCount();
                updateLayoutBadge();
                return;
            }
            if (images.length === 0 && textItems.length > 0) {
                gallery.style.display = 'block';
                uploadZone.classList.add('hidden');
                updateImageCount();
                updateLayoutBadge();
                return;
            }

            // 检查是否有已有卡片（用于判断是否需要动画）
            const hasExistingCards = gallery.querySelectorAll('.photo-card').length > 0;

            // 记录旧位置快照（FLIP 第一步：First）
            const oldPositions = {};
            if (hasExistingCards) {
                const oldCards = gallery.querySelectorAll('.photo-card');
                oldCards.forEach(card => {
                    const id = card.dataset.id;
                    const rect = card.getBoundingClientRect();
                    const galleryRect = gallery.getBoundingClientRect();
                    oldPositions[id] = {
                        left: rect.left - galleryRect.left,
                        top: rect.top - galleryRect.top,
                        width: rect.width,
                        height: rect.height
                    };
                });
            }

            gallery.style.display = 'block';
            uploadZone.classList.add('hidden');

            // 先重置画布高度
            updateCanvasSize();

            const positions = computeLayout();
            currentPositions = positions;
            let maxH = 0;

            // 清除旧卡片，保留边距线
            gallery.querySelectorAll('.photo-card').forEach(c => c.remove());
            updatePaddingGuideLines();

            // 创建新卡片
            const newCards = [];
            positions.forEach(pos => {
                const dx = pos.x * displayScale;
                const dy = pos.y * displayScale;
                const dw = pos.w * displayScale;
                const dh = pos.h * displayScale;

                const card = createCard(pos, dx, dy, dw, dh, pos.rotation);
                gallery.appendChild(card);
                newCards.push({ card, id: pos.id, dx, dy, dw, dh });
                maxH = Math.max(maxH, pos.y + pos.h);
            });

            if (maxH > canvasResolution.h) {
                const newDisplayH = maxH * displayScale;
                gallery.style.height = newDisplayH + 'px';
            }

            // FLIP 动画：从旧位置过渡到新位置
            if (hasExistingCards && Object.keys(oldPositions).length > 0) {
                newCards.forEach(({ card, id, dx, dy, dw, dh }) => {
                    const old = oldPositions[id];
                    if (old) {
                        // 该图片在旧布局中存在，计算位移
                        card.classList.add('magic-move');
                        card.style.transition = 'none';
                        // 先设置到旧位置
                        card.style.left = old.left + 'px';
                        card.style.top = old.top + 'px';
                        card.style.width = old.width + 'px';
                        card.style.height = old.height + 'px';

                        // 下一帧过渡到新位置
                        requestAnimationFrame(() => {
                            requestAnimationFrame(() => {
                                card.style.transition = '';
                                card.style.left = dx + 'px';
                                card.style.top = dy + 'px';
                                card.style.width = dw + 'px';
                                card.style.height = dh + 'px';
                            });
                        });
                    } else {
                        // 新图片，淡入效果
                        card.classList.add('magic-move-entering');
                        requestAnimationFrame(() => {
                            requestAnimationFrame(() => {
                                card.classList.add('show');
                            });
                        });
                    }
                });
            }

            updateImageCount();
            updateLayoutBadge();
            clearTextItems();
            textItems.forEach(renderTextItem);
        }

        function updateGalleryLocked() {
            if (!currentTemplate || images.length === 0) return;
            updateCanvasSize();
            const positions = applyTemplate(currentTemplate, canvasResolution.w, canvasResolution.h, getGap(canvasResolution.w));
            currentPositions = positions;

            // 清除旧卡片
            gallery.querySelectorAll('.photo-card').forEach(c => c.remove());
            let maxH = 0;
            positions.forEach(pos => {
                const dx = pos.x * displayScale;
                const dy = pos.y * displayScale;
                const dw = pos.w * displayScale;
                const dh = pos.h * displayScale;
                const card = createCard(pos, dx, dy, dw, dh, pos.rotation);
                gallery.appendChild(card);
                maxH = Math.max(maxH, pos.y + pos.h);
            });
            if (maxH > canvasResolution.h) {
                gallery.style.height = (maxH * displayScale) + 'px';
            }
            updatePaddingGuideLines();
            updateImageCount();
            updateLayoutBadge();
            clearTextItems();
            textItems.forEach(renderTextItem);
        }

        // ==================== 重新排版 ====================

        function relayout() {
            updateGallery();
        }

        // ==================== 删除/清空 ====================

        function deleteImage(id) {
            images = images.filter(img => img.id !== id);
            updateGallery();
        }

        function replaceImage(id) {
            replaceTargetId = id;
            replaceInput.click();
        }

        function handleReplaceFile(file) {
            if (!file || !replaceTargetId) return;
            if (!file.type.startsWith('image/')) {
                alert('请选择图片文件');
                replaceInput.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const target = images.find(img => img.id === replaceTargetId);
                    if (target) {
                        target.src = e.target.result;
                        target.origW = img.width;
                        target.origH = img.height;
                        target.ratio = img.width / img.height;
                        updateGallery();
                    }
                    replaceTargetId = null;
                    replaceInput.value = '';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearAll() {
            if (images.length === 0) return;
            if (confirm('确定要清空所有图片吗？')) {
                images = [];
                updateGallery();
            }
        }

        // ==================== 导出功能 ====================

        // 居中裁切绘制：保持图片原始比例，像 CSS object-fit: cover
        function drawImageCover(ctx, imgElement, pos, useCenterCoords) {
            const crop = pos.crop || { x: 0, y: 0, w: pos.origW, h: pos.origH };
            const imgRatio = crop.w / crop.h;
            const targetW = pos.w;
            const targetH = pos.h;
            const targetRatio = targetW / targetH;

            let sx, sy, sWidth, sHeight;

            if (imgRatio > targetRatio) {
                sHeight = crop.h;
                sWidth = sHeight * targetRatio;
                sx = crop.x + (crop.w - sWidth) / 2;
                sy = crop.y;
            } else {
                sWidth = crop.w;
                sHeight = sWidth / targetRatio;
                sx = crop.x;
                sy = crop.y + (crop.h - sHeight) / 2;
            }

            if (useCenterCoords) {
                ctx.drawImage(imgElement, sx, sy, sWidth, sHeight,
                              -targetW / 2, -targetH / 2, targetW, targetH);
            } else {
                ctx.drawImage(imgElement, sx, sy, sWidth, sHeight,
                              pos.x, pos.y, targetW, targetH);
            }
        }

        function toggleExportMenu() {
            closeAllToolbarDropdowns();
            exportMenu.classList.toggle('show');
        }

        // 点击其他区域关闭所有下拉菜单
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.export-dropdown')) {
                exportMenu.classList.remove('show');
            }
            if (!e.target.closest('.toolbar-dropdown')) {
                closeAllToolbarDropdowns();
            }
        });

        async function exportImage(format) {
            exportMenu.classList.remove('show');

            if (images.length === 0) {
                alert('请先添加图片再导出');
                return;
            }

            exportOverlay.classList.add('show');

            // 使用 requestAnimationFrame 确保遮罩已渲染
            await new Promise(r => requestAnimationFrame(r));
            await new Promise(r => setTimeout(r, 50));

            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // 获取实际需要的画布高度
                let maxH = canvasResolution.h;
                currentPositions.forEach(pos => {
                    const bottom = pos.y + pos.h;
                    if (bottom > maxH) maxH = bottom;
                });

                canvas.width = canvasResolution.w;
                canvas.height = maxH;

                // 填充背景
                ctx.fillStyle = canvasBgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 按顺序绘制所有图片（使用居中裁切保持比例）
                const drawPromises = currentPositions.map(pos => {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => {
                            ctx.save();

                            if (pos.rotation !== 0) {
                                // 围绕图片中心旋转
                                const cx = pos.x + pos.w / 2;
                                const cy = pos.y + pos.h / 2;
                                ctx.translate(cx, cy);
                                ctx.rotate(pos.rotation * Math.PI / 180);
                                drawImageCover(ctx, img, pos, true);
                            } else {
                                drawImageCover(ctx, img, pos, false);
                            }

                            ctx.restore();
                            resolve();
                        };
                        img.onerror = resolve;
                        img.src = pos.src;
                    });
                });

                await Promise.all(drawPromises);

                // 绘制文字图层
                textItems.forEach(textItem => {
                    ctx.save();
                    ctx.font = textItem.size + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.fillStyle = textItem.color;
                    ctx.textAlign = textItem.align;
                    if (textItem.shadow) {
                        ctx.shadowColor = 'rgba(0,0,0,0.5)';
                        ctx.shadowBlur = 4;
                        ctx.shadowOffsetX = 2;
                        ctx.shadowOffsetY = 2;
                    }

                    const lines = textItem.content.split('\n');
                    const lineHeight = textItem.size * 1.4;
                    lines.forEach((line, i) => {
                        const y = textItem.y + lineHeight * (i + 0.5);
                        if (textItem.align === 'center') {
                            ctx.fillText(line, textItem.x + textItem.width / 2, y);
                        } else if (textItem.align === 'right') {
                            ctx.fillText(line, textItem.x + textItem.width, y);
                        } else {
                            ctx.fillText(line, textItem.x, y);
                        }
                    });

                    ctx.restore();
                });

                // 导出
                let dataURL, filename;
                if (format === 'png') {
                    dataURL = canvas.toDataURL('image/png');
                    filename = `排版_${canvasResolution.w}x${maxH}_${Date.now()}.png`;
                } else if (format === 'webp') {
                    dataURL = canvas.toDataURL('image/webp', 0.92);
                    filename = `排版_${canvasResolution.w}x${maxH}_${Date.now()}.webp`;
                } else {
                    dataURL = canvas.toDataURL('image/jpeg', 0.92);
                    filename = `排版_${canvasResolution.w}x${maxH}_${Date.now()}.jpg`;
                }

                // 触发下载
                const link = document.createElement('a');
                link.download = filename;
                link.href = dataURL;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

            } catch (err) {
                console.error('导出失败:', err);
                alert('导出失败，请重试');
            }

            exportOverlay.classList.remove('show');
        }

        // ==================== 拖拽功能 ====================

        function startDrag(e) {
            if (e.target.classList.contains('photo-delete') || e.target.classList.contains('photo-replace')) return;
            if (e.target.classList.contains('resize-handle') || e.target.classList.contains('rotate-handle')) return;
            e.preventDefault();
            
            const card = e.currentTarget;
            
            // 自由调整模式：选中卡片并支持拖拽移动
            if (randomAngleEnabled) {
                // 清除之前的选中
                document.querySelectorAll('.photo-card.free-selected').forEach(c => {
                    c.classList.remove('free-selected');
                    c.querySelectorAll('.resize-handle').forEach(h => h.classList.remove('show'));
                    c.querySelectorAll('.rotate-handle').forEach(h => h.classList.remove('show'));
                });
                // 选中当前卡片
                card.classList.add('free-selected');
                card.querySelectorAll('.resize-handle').forEach(h => h.classList.add('show'));
                card.querySelectorAll('.rotate-handle').forEach(h => h.classList.add('show'));

                // 启动自由拖拽移动
                isFreeMoving = true;
                freeMovedCard = card;
                const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                freeMoveStartX = clientX;
                freeMoveStartY = clientY;
                freeMoveStartLeft = parseFloat(card.style.left) || 0;
                freeMoveStartTop = parseFloat(card.style.top) || 0;
                card.style.transition = 'none';
                document.addEventListener('mousemove', onFreeMove);
                document.addEventListener('mouseup', stopFreeMove);
                document.addEventListener('touchmove', onFreeMove, { passive: false });
                document.addEventListener('touchend', stopFreeMove);
                return;
            }
            
            // 非自由调整模式：拖拽交换
            isDragging = true;
            draggedCard = card;
            draggedCardId = draggedCard.dataset.id;
            draggedCard.classList.add('dragging');

            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

            // 使用相对位移，避免 getBoundingClientRect() 受旋转影响
            dragStartClientX = clientX;
            dragStartClientY = clientY;
            dragStartCardLeft = parseFloat(draggedCard.style.left) || 0;
            dragStartCardTop = parseFloat(draggedCard.style.top) || 0;

            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchmove', onDrag, { passive: false });
            document.addEventListener('touchend', stopDrag);
        }

        function onDrag(e) {
            if (!isDragging || !draggedCard) return;
            e.preventDefault();

            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

            const dx = clientX - dragStartClientX;
            const dy = clientY - dragStartClientY;

            draggedCard.style.left = (dragStartCardLeft + dx) + 'px';
            draggedCard.style.top = (dragStartCardTop + dy) + 'px';
        }

        function stopDrag(e) {
            let didSwap = false;
            if (draggedCard) {
                let clientX, clientY;
                if (e.type && e.type.includes('touch')) {
                    if (e.changedTouches && e.changedTouches.length > 0) {
                        clientX = e.changedTouches[0].clientX;
                        clientY = e.changedTouches[0].clientY;
                    }
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                if (clientX !== undefined && clientY !== undefined) {
                    draggedCard.style.visibility = 'hidden';
                    const targetEl = document.elementFromPoint(clientX, clientY);
                    draggedCard.style.visibility = '';

                    if (targetEl) {
                        const targetCard = targetEl.closest('.photo-card');
                        if (targetCard && targetCard.dataset.id !== draggedCardId) {
                            const targetId = targetCard.dataset.id;
                            const fromIndex = images.findIndex(img => img.id == draggedCardId);
                            const toIndex = images.findIndex(img => img.id == targetId);
                            if (fromIndex !== -1 && toIndex !== -1) {
                                [images[fromIndex], images[toIndex]] = [images[toIndex], images[fromIndex]];
                                didSwap = true;
                            }
                        }
                    }
                }

                draggedCard.classList.remove('dragging');
                draggedCardId = null;
                // 只有交换了位置才重新排版；否则保持拖拽后的自由位置
                if (didSwap) {
                    updateGallerySameLayout();
                }
            }
            isDragging = false;
            draggedCard = null;

            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchmove', onDrag);
            document.removeEventListener('touchend', stopDrag);
        }

        function onFreeMove(e) {
            if (!isFreeMoving || !freeMovedCard) return;
            e.preventDefault();
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            const dx = clientX - freeMoveStartX;
            const dy = clientY - freeMoveStartY;
            freeMovedCard.style.left = (freeMoveStartLeft + dx) + 'px';
            freeMovedCard.style.top = (freeMoveStartTop + dy) + 'px';
        }

        function stopFreeMove() {
            if (freeMovedCard) {
                freeMovedCard.style.transition = '';
            }
            isFreeMoving = false;
            freeMovedCard = null;
            document.removeEventListener('mousemove', onFreeMove);
            document.removeEventListener('mouseup', stopFreeMove);
            document.removeEventListener('touchmove', onFreeMove);
            document.removeEventListener('touchend', stopFreeMove);
        }

        function updateGallerySameLayout() {
            if (images.length === 0) return;
            updateCanvasSize();
            if (!currentTemplate) {
                updateGallery();
                return;
            }
            const positions = applyTemplate(currentTemplate, canvasResolution.w, canvasResolution.h, getGap(canvasResolution.w));
            currentPositions = positions;
            
            // 清除旧卡片
            gallery.querySelectorAll('.photo-card').forEach(c => c.remove());
            let maxH = 0;
            positions.forEach(pos => {
                const dx = pos.x * displayScale;
                const dy = pos.y * displayScale;
                const dw = pos.w * displayScale;
                const dh = pos.h * displayScale;
                const card = createCard(pos, dx, dy, dw, dh, pos.rotation);
                gallery.appendChild(card);
                maxH = Math.max(maxH, pos.y + pos.h);
            });
            if (maxH > canvasResolution.h) {
                gallery.style.height = (maxH * displayScale) + 'px';
            }
            updatePaddingGuideLines();
            updateImageCount();
            updateLayoutBadge();
        }

        function startResize(e, cardId, handleType) {
            e.preventDefault();
            e.stopPropagation();
            const card = document.querySelector(`.photo-card[data-id="${cardId}"]`);
            if (!card) return;
            
            const startX = e.clientX;
            const startY = e.clientY;
            const startW = parseFloat(card.style.width);
            const startH = parseFloat(card.style.height);
            const startLeft = parseFloat(card.style.left);
            const startTop = parseFloat(card.style.top);
            
            function onResizeMove(ev) {
                const dx = ev.clientX - startX;
                const dy = ev.clientY - startY;
                let newW = startW, newH = startH, newLeft = startLeft, newTop = startTop;
                if (handleType.includes('e')) { newW = Math.max(40, startW + dx); }
                if (handleType.includes('w')) { newW = Math.max(40, startW - dx); newLeft = startLeft + dx; }
                if (handleType.includes('s')) { newH = Math.max(40, startH + dy); }
                if (handleType.includes('n')) { newH = Math.max(40, startH - dy); newTop = startTop + dy; }
                card.style.width = newW + 'px';
                card.style.height = newH + 'px';
                card.style.left = newLeft + 'px';
                card.style.top = newTop + 'px';
            }
            
            function onResizeUp() {
                document.removeEventListener('mousemove', onResizeMove);
                document.removeEventListener('mouseup', onResizeUp);
            }
            
            document.addEventListener('mousemove', onResizeMove);
            document.addEventListener('mouseup', onResizeUp);
        }

        function startRotate(e, cardId) {
            e.preventDefault();
            e.stopPropagation();
            const card = document.querySelector(`.photo-card[data-id="${cardId}"]`);
            if (!card) return;
            
            const rect = card.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const startAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
            const currentRotation = parseFloat(card.style.getPropertyValue('--rotation')) || 0;
            
            function onRotateMove(ev) {
                const angle = Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180 / Math.PI;
                const newRot = currentRotation + (angle - startAngle);
                card.style.setProperty('--rotation', newRot + 'deg');
                card.style.transform = 'rotate(' + newRot + 'deg)';
            }
            
            function onRotateUp() {
                document.removeEventListener('mousemove', onRotateMove);
                document.removeEventListener('mouseup', onRotateUp);
            }
            
            document.addEventListener('mousemove', onRotateMove);
            document.addEventListener('mouseup', onRotateUp);
        }

        // ==================== 拖放上传 ====================

        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        gallery.addEventListener('mousedown', (e) => {
            if (e.target === gallery || e.target.classList.contains('padding-guide-line')) {
                document.querySelectorAll('.photo-card.free-selected').forEach(c => {
                    c.classList.remove('free-selected');
                    c.querySelectorAll('.resize-handle').forEach(h => h.classList.remove('show'));
                    c.querySelectorAll('.rotate-handle').forEach(h => h.classList.remove('show'));
                });
            }
        });

        gallery.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        gallery.addEventListener('drop', (e) => {
            e.preventDefault();
            handleFiles(e.dataTransfer.files);
        });

        // ==================== 窗口大小变化 ====================

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                updateCanvasSize();
                updateGallery();
            }, 250);
        });

        // ==================== 快捷键支持 ====================

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                // 快捷键保留占位
            }
        });

        // ==================== 初始化 ====================

        // 设置 CSS 变量
        document.documentElement.style.setProperty('--card-radius', cardRadius + 'px');

        // 同步边距输入框初始值
        const initialGap = getGap(canvasResolution.w);
        paddingConfig = { top: initialGap, bottom: initialGap, left: initialGap, right: initialGap };
        document.getElementById('padTop').value = initialGap;
        document.getElementById('padBottom').value = initialGap;
        document.getElementById('padLeft').value = initialGap;
        document.getElementById('padRight').value = initialGap;

        // 初始化背景色
        gallery.style.background = canvasBgColor;
        document.querySelector('.color-preset[data-color="#ffffff"]').classList.add('active');

        updateCanvasSize();
        updateImageCount();
        updateLayoutBadge();
    </script>
    <div class="guide-tooltip" id="guideTooltip"></div>
</body>
</html>
