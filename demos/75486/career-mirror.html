/* ============================================================
   BLOCK 7: INIT — 初始化
   ============================================================ */
function init(){
  loadFromLocalStorage();
  // 数据版本检查
  var storedVersion=state.dataVersion||null;
  if(storedVersion&&storedVersion<DATA_VERSION){
    state.dataVersion=DATA_VERSION;saveToLocalStorage();
    setTimeout(function(){showToast('职场镜像已升级到新版本 🎉')},500);
  }
  state.dataVersion=DATA_VERSION;
  // 初始化时：重置未完成的测试状态，避免刷新后卡在测试页
  var hadResult=state.dominantType!==null;
  if(!hadResult){
    // 没有测试结果：如果有未完成的测试进度，重置到首页
    if(state.testStep>0||state.currentPage==='test'||state.currentPage==='report'){
      state.currentPage='home';
    }
    state.testStep=0;state.testDialogStep=0;
    state.testAnswers=[];state.testDialogHistory=[];
    state.trainScene=null;state.trainCurrentRound=0;state.trainDialogHistory=[];
  }else{
    // 有测试结果：如果当前在测试页，跳转到报告页
    if(state.currentPage==='test'){state.currentPage='report';}
  }
  state.isLoading=false;
  saveToLocalStorage();
  render();
  // Logo click (header is outside #app, so needs its own listener)
  var logoEl=document.querySelector('.logo');
  if(logoEl){
    logoEl.style.cursor='pointer';
    logoEl.style.pointerEvents='auto';
    logoEl.style.zIndex='200';
    logoEl.addEventListener('click',function(e){
      e.preventDefault();
      e.stopPropagation();
      handleNavigate('home',true);
    });
    // 确保logo内所有子元素也能点击
    logoEl.querySelectorAll('*').forEach(function(child){
      child.style.pointerEvents='none';
    });
  }
  // Event delegation
  app.addEventListener('click',function(e){
    var el=e.target.closest('[data-action]');if(!el)return;
    var action=el.dataset.action;
    switch(action){
      case'start-test':handleStartTest();break;
      case'select-option':handleSelectOption(parseInt(el.dataset.optionIndex,10));break;
      case'start-train':handleStartTrain(el.dataset.sceneId);break;
      case'set-difficulty':
        state.trainDifficulty=el.dataset.diff;
        if(el.dataset.diff!=='easy'&&!state.shareUnlocked){
          showToast(el.dataset.diff==='medium'?'中级为会员专属难度，Demo期间可免费体验':'高级为会员专属难度，Demo期间可免费体验');
        }
        saveToLocalStorage();render();break;
      case'toggle-all-materials':{
        var panel=document.getElementById('allStudyMaterials');
        var btn=document.getElementById('toggleAllMaterials');
        if(panel){var isOpen=panel.style.display!=='none';panel.style.display=isOpen?'none':'block';if(btn)btn.textContent=isOpen?'📖 查看学习资料':'📖 收起学习资料'}
        break;}
      case'toggle-study-material':{
        var matId=el.dataset.matId;
        var body=document.getElementById('mat-body-'+matId);
        var toggle=document.getElementById('mat-toggle-'+matId);
        if(body){var isExp=body.classList.contains('expanded');body.classList.toggle('expanded');if(toggle)toggle.classList.toggle('expanded')}
        break;}
      case'share-unlock':handleShareUnlock();break;
      case'back-to-train-select':handleBackToTrainSelect();break;
      case'retake-test':handleRetakeTest();break;
      case'go-home':handleNavigate('home');break;
      case'go-report':handleNavigate('report');break;
      case'go-train':handleNavigate('train');break;
      case'go-dashboard':handleNavigate('dashboard');break;
      case'go-train-scene':handleGoTrainScene(el.dataset.sceneId);break;
      case'undo-test':handleUndoTest();break;
      case'download-share-card':downloadShareCard();break;
      case'copy-share-text':copyShareText();break;
      case'unlock-report':handleUnlockReport();break;
      case'unlock-member':handleUnlockMember();break;
      case'activate-vip':handleActivateVip();break;
      case'toggle-depth':
        var dac=document.getElementById('depthArticleContent');
        if(dac){
          var isHidden=dac.style.display==='none';
          dac.style.display=isHidden?'block':'none';
          el.setAttribute('aria-expanded',isHidden?'true':'false');
        }
        break;
      default:break;
    }
  });
  // Step indicator click navigation (outside #app, in header)
  document.getElementById('pageIndicator').addEventListener('click',function(e){
    var el=e.target.closest('[data-action]');if(!el)return;
    var action=el.dataset.action;
    if(action==='go-test'){
      if(state.dominantType){handleNavigate('report')}else{handleStartTest()}
    }else if(action==='go-report'){if(state.dominantType)handleNavigate('report')}
    else if(action==='go-train'){if(state.dominantType)handleNavigate('train')}
    else if(action==='go-dashboard'){if(state.dominantType)handleNavigate('dashboard')}
  });
  app.addEventListener('submit',function(e){
    e.preventDefault();
    var form=e.target;
    if(form.dataset.formType==='free-input'){
      var inp=form.querySelector('input[name="freeInput"]');
      if(inp&&inp.value.trim()){handleFreeInput(inp.value.trim())}
    }else if(form.dataset.formType==='train-input'){
      var inp2=form.querySelector('input[name="trainInput"]');
      if(inp2&&inp2.value.trim()){handleTrainInput(inp2.value.trim())}
    }
  });
  // Keyboard shortcuts for test options (A-E)
  document.addEventListener('keydown',function(e){
    if(state.currentPage!=='test')return;
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    var key=e.key.toUpperCase();
    if(key>='A'&&key<='E'){
      e.preventDefault();
      var idx=key.charCodeAt(0)-65;
      var btn=document.querySelector('[data-action="select-option"][data-option-index="'+idx+'"]');
      if(btn&&!btn.disabled){handleSelectOption(idx)}
    }
  });
  // Leave confirmation during test
  window.addEventListener('beforeunload',function(e){
    flushSave();
    if(state.currentPage==='test'||(state.currentPage==='train'&&state.trainScene!==null)){
      e.preventDefault();e.returnValue='';
    }
  });
  // prefers-reduced-motion 媒体查询响应
  var prefersReducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
  window._prefersReducedMotion=prefersReducedMotion.matches;
  prefersReducedMotion.addEventListener('change',function(e){
    window._prefersReducedMotion=e.matches;
    if(e.matches){
      document.documentElement.style.setProperty('--reduced-motion','1');
    }else{
      document.documentElement.style.removeProperty('--reduced-motion');
    }
  });
  gsap.matchMedia().add('(prefers-reduced-motion: reduce)',function(){
    gsap.globalTimeline.timeScale(0.01);
    gsap.defaults({duration:0.01,ease:'none'});
    if(window._pageTransitionTL){window._pageTransitionTL.kill();}
    return function(){
      gsap.globalTimeline.timeScale(1);
      gsap.defaults({duration:0.5,ease:'power2.out'});
    };
  });
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}


})();
