.pricing-unit{font-size:var(--text-sm);color:var(--text-muted);font-weight:500;margin-left:4px}
.pricing-features{list-style:none;padding:0;margin:var(--space-md) 0;flex:1}

.empty-state-hint{font-size:var(--text-sm);color:var(--text-muted);max-width:280px;margin:0 auto}

/* ========== Responsive ========== */
@media(min-width:768px){
  .bento-grid{grid-template-columns:repeat(2,1fr)}
  .report-charts{grid-template-columns:1fr 1fr}
  .train-scene-selector{grid-template-columns:repeat(3,1fr)}
  .dashboard-grid{grid-template-columns:1fr 1fr}
  .process-steps{grid-template-columns:repeat(4,1fr);align-items:center}
  .process-arrow{display:block;text-align:center;color:var(--accent);font-size:24px}
  .process-step{position:relative}
  .video-grid{grid-template-columns:repeat(2,1fr)}
  .pricing-cards{grid-template-columns:repeat(2,1fr)}
  .path-cards{grid-template-columns:repeat(1,1fr)}
  .goal-steps{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1024px){
  .bento-grid{grid-template-columns:repeat(3,1fr)}

}
@media(max-width:480px){
  body{padding:var(--space-md)}
  .hero-title{font-size:var(--text-3xl)}
  .hero-subtitle{font-size:var(--text-base)}

  .report-type-name{font-size:var(--text-2xl)}
  .train-scene-selector{grid-template-columns:1fr}
  .process-steps{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  #particle-canvas{display:none!important}
  .scroll-reveal{opacity:1!important;transform:none!important}
  .confetti{display:none!important}
  .loading-mirror svg{animation:none!important}
  .loading-mirror-outer,.loading-mirror-mid,.loading-mirror-inner{animation:none!important}
  .loading-progress-fill{animation:none!important;width:100%!important}
}
/* ========== Utility ========== */
.text-center{text-align:center}
.mt-md{margin-top:var(--space-md)}
.mt-lg{margin-top:var(--space-lg)}
.mb-md{margin-bottom:var(--space-md)}
.mb-lg{margin-bottom:var(--space-lg)}

.modal-overlay{position:fixed;inset:0;background:rgba(8,12,23,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s ease}

.modal-overlay.modal-visible .modal-card{transform:scale(1) translateY(0)}
.modal-icon{font-size:2rem;margin-bottom:var(--space-sm);line-height:1}
.modal-message{color:var(--text-secondary);font-size:var(--text-base);line-height:1.6;margin-bottom:var(--space-lg)}

/* Study Materials */
.study-materials{margin:var(--space-lg) 0}
.study-materials-title{font-family:var(--font-heading);font-weight:700;font-size:var(--text-lg);color:var(--text-primary);margin-bottom:var(--space-md);display:flex;align-items:center;gap:var(--space-sm)}
.study-material-card{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-md);margin-bottom:var(--space-sm);transition:border-color var(--transition-normal),box-shadow var(--transition-normal)}
.study-material-card:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.study-material-header{display:flex;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-sm);cursor:pointer}

.study-material-name{font-weight:600;color:var(--text-primary);font-size:var(--text-base);flex:1}
.study-material-toggle{color:var(--text-muted);font-size:var(--text-sm);transition:transform var(--transition-normal)}
.study-material-toggle.expanded{transform:rotate(180deg)}
.study-material-body{display:none;color:var(--text-secondary);font-size:var(--text-sm);line-height:1.7;white-space:pre-wrap;padding-top:var(--space-sm);border-top:1px solid var(--border)}
.study-material-body.expanded{display:block;animation:fadeInUp .3s ease both}

/* Hero Enhancement */
.hero-bg-orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.15;pointer-events:none;animation:orbFloat 8s ease-in-out infinite}
.hero-bg-orb-1{width:300px;height:300px;background:var(--accent);top:-100px;right:-50px;animation-delay:0s}

@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,-20px) scale(1.1)}66%{transform:translate(-15px,15px) scale(.95)}}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(124,92,252,.1);border:1px solid rgba(124,92,252,.25);border-radius:var(--radius-full);font-size:var(--text-xs);color:var(--text-accent);margin-bottom:var(--space-md);animation:fadeInUp .5s .1s ease both}

.hero-title-gradient{background:linear-gradient(135deg,var(--text-primary) 0%,var(--accent) 50%,var(--brand-secondary) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 4s ease-in-out infinite}
@keyframes gradientShift{0%,100%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(15deg)}}
/* Dashboard differentiation */
.dashboard-hero{background:linear-gradient(135deg,rgba(124,92,252,.08),rgba(6,182,212,.05));border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-lg);margin-bottom:var(--space-lg);display:flex;align-items:center;gap:var(--space-lg)}

/* Video card enhancement */
.video-card-enhanced{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-md);background:linear-gradient(135deg,rgba(124,92,252,.08),rgba(6,182,212,.04));border:1px solid rgba(124,92,252,.2);border-radius:var(--radius-md);text-decoration:none;color:inherit;transition:transform var(--transition-normal),box-shadow var(--transition-normal),border-color var(--transition-normal);cursor:pointer}
.video-card-enhanced:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3);border-color:var(--accent)}

.video-title-enhanced{font-weight:600;color:var(--text-primary);font-size:var(--text-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-meta-enhanced{font-size:var(--text-xs);color:var(--text-muted);margin-top:2px;display:flex;align-items:center;gap:6px}

/* Next-step CTA */
.next-step-cta{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-md);background:linear-gradient(135deg,rgba(124,92,252,.06),rgba(16,185,129,.03));border:1px dashed rgba(124,92,252,.3);border-radius:var(--radius-md);margin-top:var(--space-md);text-decoration:none;color:inherit;transition:border-color var(--transition-normal),background var(--transition-normal)}
.next-step-cta:hover{border-color:var(--accent);background:linear-gradient(135deg,rgba(124,92,252,.12),rgba(16,185,129,.06))}

.vip-benefit-card{display:flex;align-items:center;gap:16px;padding:16px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:12px;transition:all .3s ease}

.vip-benefit-desc{font-size:var(--text-xs);color:var(--text-muted);line-height:1.5}

  "salary":{"title":"薪资谈判：用数据说话","scenario":"老板说：「今年公司效益不好，加薪可能要等等。」","badResponse":"「哦...那好吧，我再等等。」","goodResponse":"「我理解公司的压力。过去一年我负责的项目带来了35%的增长，根据市场调研同岗位薪资上浮约20%，希望能重新评估我的薪资。」","tip":"核心技巧：先共情+再摆数据+明确诉求。不要直接接受「再等等」，而是用业绩数据建立谈判筹码。"},
  "reject":{"title":"温柔拒绝：三步法","scenario":"同事说：「帮我做一下这个PPT呗，你最擅长了！」","badResponse":"「啊...好吧，我今晚加班帮你弄。」","goodResponse":"「谢谢认可！但我手上的项目本周要交付，实在排不开。我可以发你一个模板，你先搭框架，有问题我帮你看看？」","tip":"核心技巧：认可+说明限制+给出替代方案。拒绝事不拒绝人，态度温和但立场坚定。"},
  "report":{"title":"工作汇报：STAR法则","scenario":"老板问：「这个季度你做了什么？」","badResponse":"「嗯...做了一些项目，还挺忙的，处理了很多事情。」","goodResponse":"「Q3核心成果：我负责的获客项目(S)，目标是降低CPA(T)，通过A/B测试优化了5个渠道预算(A)，最终CPA降了15%、省了3万(R)。」","tip":"核心技巧：先说结论和数字，再讲情境-任务-行动-结果。老板注意力只有30秒，第一句就要给核心信息。"},
  "boss":{"title":"向上沟通：给选择题","scenario":"老板临时加任务：「这个方案明天给我。」","badResponse":"「啊？明天？这根本做不完啊！」","goodResponse":"「明白，这个方案很急。目前我手上有A和B两个优先级任务，如果要明天出这个方案，A需要延后一天，或者您看能否让小李先帮忙做调研部分？」","tip":"核心技巧：不直接说「做不完」，而是给出风险和选项，让老板做决策。"},
  "criticism":{"title":"接受批评：复盘模型","scenario":"领导说：「你这次的报告数据有问题，太不仔细了。」","badResponse":"「那个数据是XX部门给的，不是我的问题...」","goodResponse":"「谢谢您指出，我马上核对修正。想请教一下，除了数据准确性，报告的结构和结论是否也需要调整？我之后会多加一道交叉校验。」","tip":"核心技巧：先承担+再请教+给改进承诺。被批评时不要急着辩解，先接住反馈再展现成长姿态。"},
  "relationship":{"title":"跨部门沟通：利益对齐","scenario":"其他部门不配合你的项目。","badResponse":"「你们怎么这么不配合？这是老板定的项目！」","goodResponse":"「我知道大家都很忙。这个项目如果做成，你们部门的XX指标也会受益，我这边可以承担主要的执行工作，只需要你们每周花1小时配合评审，你看可行吗？」","tip":"核心技巧：找到对方利益点+降低对方成本+给出具体承诺。跨部门协作的本质是利益交换。"},
  "meeting":{"title":"会议异议：结构化表达","scenario":"开会时你不同意同事的方案。","badResponse":"「我觉得这个方案不行，太理想化了。」","goodResponse":"「这个方案有两个优点我认同：A和B。我有一点担心：如果C情况发生，风险可能比较大。建议增加一个D预案，你们觉得呢？」","tip":"核心技巧：先肯定+再提顾虑+最后给建议。用「我担心」代替「你错了」，减少对方防御。"},
  "conflict":{"title":"冲突化解：非暴力沟通","scenario":"同事在公开场合质疑你的方案。","badResponse":"「你懂什么？上次你的方案还不是失败了！」","goodResponse":"「我听到你对这个方案有顾虑（观察），我有点意外（感受），因为我花了很多时间论证（需要）。我们会后单独聊一下具体哪里有问题，好吗（请求）？」","tip":"核心技巧：观察-感受-需要-请求。不做人身攻击，把焦点从「谁对谁错」转到「如何解决」。"},
  "professional":{"title":"技术沟通：翻译价值","scenario":"你需要向非技术领导解释技术方案。","badResponse":"「我们用了微服务架构+K8s容器化+CQRS模式，实现了...」","goodResponse":"「这次升级后，系统稳定性从99%提升到99.99%，相当于每月少故障4小时，预计节省XX万损失。」","tip":"核心技巧：用业务语言（收入/成本/效率/风险）翻译技术决策。领导不关心用什么技术，关心带来什么价值。"},

function createInitialState(overrides){
  var base={
    currentPage:'home',testStep:0,testAnswers:[],testDialogHistory:[],testDialogStep:0,reportUnlocked:false,isVipMember:false,
    personalityScores:null,dominantType:null,

  };
  if(overrides)Object.keys(overrides).forEach(function(k){base[k]=overrides[k]});

}
var state=createInitialState();
var DATA_VERSION=3;
function updateState(partial){
  Object.keys(partial).forEach(function(k){state[k]=partial[k]});
  saveToLocalStorage();render();
}
function resetState(keepHistory){
  var oldCount=state.testCount||0,oldBest=state.bestTrainScore||0,oldHist=state.scoreHistory||[];
  var oldSkillLevels=state.skillLevels||{},oldUnlocked=state.unlockedScenes||[],oldShare=state.shareUnlocked||false;
  state=createInitialState({
    testCount:keepHistory?oldCount+1:oldCount,
    bestTrainScore:keepHistory?oldBest:0,
    scoreHistory:keepHistory?oldHist:[],
    trainDifficulty:state.trainDifficulty||'medium',
    unlockedScenes:oldUnlocked,skillLevels:oldSkillLevels,
    shareUnlocked:oldShare,dataVersion:state.dataVersion||DATA_VERSION
  });
  saveToLocalStorage();
}
var _saveTimer=null;
function saveToLocalStorage(){
  if(_saveTimer)clearTimeout(_saveTimer);
  _saveTimer=setTimeout(function(){
    try{
      var d=serializeState();
      localStorage.setItem('career_mirror_data',JSON.stringify(d));
    }catch(e){if(typeof showToast==='function')showToast('数据保存失败，可能存储空间不足');}
    _saveTimer=null;
  },ANIM.TRANSITION);
}
function flushSave(){
  if(_saveTimer){clearTimeout(_saveTimer);_saveTimer=null;
    try{
      var d=serializeState();
      localStorage.setItem('career_mirror_data',JSON.stringify(d));
    }catch(e){if(typeof showToast==='function')showToast('数据保存失败，可能存储空间不足');}
  }
}
function serializeState(){
  return{personalityScores:state.personalityScores,dominantType:state.dominantType,
    trainScores:state.trainScores,trainCompleted:state.trainCompleted,
    testCount:state.testCount,bestTrainScore:state.bestTrainScore,
    scoreHistory:state.scoreHistory,fingerprint:state.fingerprint,
    dataVersion:state.dataVersion||DATA_VERSION,trainDifficulty:state.trainDifficulty,
    unlockedScenes:state.unlockedScenes,skillLevels:state.skillLevels,
    shareUnlocked:state.shareUnlocked,reportUnlocked:state.reportUnlocked,isVipMember:state.isVipMember,
    currentPage:state.currentPage,testStep:state.testStep,testDialogStep:state.testDialogStep,
    testAnswers:state.testAnswers,testDialogHistory:state.testDialogHistory,
    trainScene:state.trainScene,trainCurrentRound:state.trainCurrentRound,
    trainDialogHistory:state.trainDialogHistory,preTrainScores:state.preTrainScores};
}
function loadFromLocalStorage(){
  try{
    var d=localStorage.getItem('career_mirror_data');
    if(d){
      var p=JSON.parse(d);
      Object.keys(p).forEach(function(k){state[k]=p[k]});
      state.trainDifficulty=state.trainDifficulty||'medium';
      state.unlockedScenes=state.unlockedScenes||[];
      state.skillLevels=state.skillLevels||{};
      state.shareUnlocked=!!state.shareUnlocked;
      state.currentPage=state.currentPage||'home';
      state.testStep=state.testStep||0;
      state.testDialogStep=state.testDialogStep||0;
      state.testAnswers=state.testAnswers||[];
      state.testDialogHistory=state.testDialogHistory||[];
      state.trainScene=state.trainScene||null;
      state.trainCurrentRound=state.trainCurrentRound||0;
      state.trainDialogHistory=state.trainDialogHistory||[];
      state.preTrainScores=state.preTrainScores||null;
      // 若页面刷新时停留在test/train页但dominantType为null（测试没做完），强制回首页避免白屏
      if((state.currentPage==='test'||state.currentPage==='loading')&&state.dominantType===null){
        state.currentPage='home';
        state.testStep=0;state.testDialogStep=0;state.testAnswers=[];state.testDialogHistory=[];
      }
      // 若停留在train对话页但trainScene为null，重置到train选择页
      if(state.currentPage==='train'&&state.trainScene===null&&state.dominantType===null){
        state.currentPage='home';
      }
    }
  }catch(e){}
}

function calculatePersonalityScores(answers){
  var s={avoider:0,fighter:0,pleaser:0,analyst:0,social:0};
  answers.forEach(function(a){if(a.scores){Object.keys(a.scores).forEach(function(t){s[t]+=a.scores[t]})}});
  return s;
}
function getDominantType(scores){
  var max=0,d='avoider';
  Object.keys(scores).forEach(function(t){if(scores[t]>max){max=scores[t];d=t}});
  return d;
}
function getRecommendedScenes(type){return TYPE_TRAIN_MAP[type]||['salary','reject','report']}
function scoreReply(userInput,sceneId,roundIdx){
  var scene=TRAIN_SCENARIOS[sceneId];
  if(!scene||!scene.rounds[roundIdx])return{score:5,feedback:'继续努力！',coachNote:'先试着表达完整观点',dimensions:{sentenceDiversity:5,semanticRichness:5,strategyDepth:5,empathyScore:5,keywordMatch:5}};
  var round=scene.rounds[roundIdx];
  var input=(userInput||'').toLowerCase().trim();
  var difficulty=state.trainDifficulty||'medium';
  var avoidPenalty=difficulty==='easy'?1:difficulty==='hard'?3:2;
  var lengthBonusThreshold=difficulty==='easy'?15:difficulty==='hard'?40:25;
  
  // 1. 关键词匹配（占40%）— 含否定前缀排除
  var negPrefixes=['不','没','别','勿','未','无','非'];
  function matchKeyword(input,kw){
    var idx=input.indexOf(kw.toLowerCase());
    if(idx===-1)return false;
    if(idx>0){var prev=input.charAt(idx-1);if(negPrefixes.indexOf(prev)!==-1)return false;}
    return true;
  }
  var ideal=0,avoid=0,matchedIdeal=[];
  round.idealKeywords.forEach(function(kw){
    if(matchKeyword(input,kw)){ideal++;matchedIdeal.push(kw)}
  });
  round.avoidKeywords.forEach(function(kw){if(matchKeyword(input,kw))avoid++});
  var keywordScore=Math.max(1,Math.min(10,3+ideal*1.5-avoid*avoidPenalty));
  
  // 2. 语义相似度（占30%）：与理想回复的字符/词重叠度
  var idealText=(round.betterHint||'').toLowerCase();
  var semanticScore=5;
  if(input.length>0&&idealText.length>0){
    var inputWords=input.split(/[\s，。！？、；：,.!?;:\/]+/).filter(function(w){return w.length>=2});
    var idealWords=idealText.split(/[\s，。！？、；：,.!?;:\/]+/).filter(function(w){return w.length>=2});
    var overlap=0;
    inputWords.forEach(function(w){if(idealWords.indexOf(w)!==-1)overlap++});
    var inputUniq={};inputWords.forEach(function(w){inputUniq[w]=1});
    var idealUniq={};idealWords.forEach(function(w){idealUniq[w]=1});
    var unionCount=Object.keys(inputUniq).length+Object.keys(idealUniq).length;
    var overlapUniq=0;Object.keys(inputUniq).forEach(function(w){if(idealUniq[w])overlapUniq++});
    var jaccard=unionCount>0?overlapUniq/(unionCount-overlapUniq):0;
    semanticScore=Math.max(1,Math.min(10,3+jaccard*10+overlap*0.5));
  }
  
  // 3. 表达完整度（占15%）
  var hasSubject=/我|我们|你|你们|他|她|它|这个|那个|方案|项目|数据|老板|同事|客户/.test(input);
  var hasVerb=/是|有|要|想|做|说|建议|认为|希望|觉得|申请|拒绝|同意|理解|完成|提升|增长|可以|需要/.test(input);
  var hasObject=/数据|方案|建议|想法|问题|时间|价值|贡献|反馈|支持|帮助|目标|计划|需求/.test(input);
  var completenessScore=(hasSubject&&hasVerb&&hasObject)?7:(hasSubject&&hasVerb)?5:(input.length>5)?3:1;
  if(input.length>lengthBonusThreshold)completenessScore+=1;
  if(input.length>lengthBonusThreshold+20)completenessScore+=1;
  completenessScore=Math.min(10,completenessScore);
  
  // 4. 情商与语气（占15%）
  var positiveWords=['感谢','理解','支持','信任','期待','认可','辛苦','贡献','价值','成长','一起','合作','共赢','抱歉','对不起','感受','情绪','尊重','商量'];
  var negativeWords=['不行','不对','错了','失败','糟糕','烦','讨厌','垃圾','stupid','废物','没用','扯淡','滚','凭什么','你错了','闭嘴','白痴'];
  var posCount=0,negCount=0;
  positiveWords.forEach(function(w){if(input.indexOf(w)!==-1)posCount++});
  negativeWords.forEach(function(w){if(input.indexOf(w)!==-1)negCount++});
  var empathyScore=5;
  if(posCount>0)empathyScore=Math.min(10,5+posCount);
  if(negCount>0)empathyScore=Math.max(1,empathyScore-negCount*3);
  
  // 5. 数据支撑加分（新增）— 识别数字、百分比、金额等数据表达
  var hasNumber=/\d/.test(input);
  var hasPercent=/\d+\s*%/.test(input);
  var hasCurrency=/\d+\s*[万千元元]/.test(input)||/\d+\s*\/\s*月/.test(input);
  var hasDecimal=/\d+\.\d+/.test(input);
  var dataKeywords=['数据','业绩','增长','订单','收入','利润','转化率','留存率','用户数','客户','项目','完成','提升','降低','成本','预算','KPI','OKR','指标','报告','分析','对比','样本','置信度','调研','市场'];
  var dataKwCount=dataKeywords.filter(function(kw){return input.indexOf(kw)!==-1}).length;
  var dataBonus=0;
  if(hasNumber)dataBonus+=1.0;
  if(hasPercent)dataBonus+=0.8;
  if(hasCurrency)dataBonus+=0.8;
  if(hasDecimal)dataBonus+=0.5;
  if(dataKwCount>0)dataBonus+=Math.min(2,dataKwCount*0.5);
  dataBonus=Math.min(3.5,dataBonus);
  // 数据支撑也提升完整度分
  if(dataBonus>=2)completenessScore=Math.min(10,completenessScore+1);
  
  // 综合评分
  var score=keywordScore*0.35+semanticScore*0.25+completenessScore*0.15+empathyScore*0.1+Math.min(10,5+dataBonus)*0.15;
  if(matchedIdeal.length>=4)score+=1;
  else if(matchedIdeal.length>=2)score+=0.5;
  if(difficulty==='easy')score+=0.5;
  else if(difficulty==='hard')score-=0.3;
  score=Math.max(1,Math.min(10,Math.round(score)));
  
  var level=score>=8?'high':score>=5?'medium':'low';
  
  // 反馈分层：feedback=问题分析，coachNote=鼓励策略，followUp=具体建议
  var critiqueParts=[];
  if(matchedIdeal.length===0)critiqueParts.push('没有命中任何关键策略词');
  else if(matchedIdeal.length<2)critiqueParts.push('关键策略词覆盖不足（'+matchedIdeal.length+'个）');
  if(dataBonus<1)critiqueParts.push('缺少具体数据支撑');
  if(input.length<lengthBonusThreshold)critiqueParts.push('表达偏短，可以更充分展开');
  if(negCount>0)critiqueParts.push('语气偏冲，建议软化表达');
  if(critiqueParts.length===0)critiqueParts.push('表达基本到位，还有优化空间');
  
  var fb='【'+critiqueParts.join('；')+'】';
  if(difficulty==='easy'){
    fb+=' 提示：试着用更多关键词，比如：'+round.idealKeywords.slice(0,3).join('、');
  }
  if(dataBonus>=2){
    fb+=' ✅ 好样的，你用了具体数据来支撑观点！';
  }
  
  var coachNote='';
  if(score>=8){
    coachNote='🌟 表达完整且有策略，数据运用到位。继续保持这个水准！';
  }else if(score>=5){
    var tip=dataBonus<1?'薪资谈判中，数据是你最有力的武器——业绩数字、市场水平、涨幅比例，缺一不可。':'你已经用数据支撑了观点，如果再补上明确的诉求和跟进节点会更完美。';
    coachNote='📈 '+tip+' 继续练习，你会越来越稳！';
  }else{
    var lowTip=dataBonus<1?'职场沟通中，模糊的表达会削弱你的底气。试着用具体数字和明确诉求来替代笼统的描述。':'有数据意识了，但表达结构还需要优化——先说结论，再给依据。';
    coachNote='💪 '+lowTip+' 每一次练习都在帮你建立职场底气！';
  }
  
  return{score:score,feedback:fb,coachNote:coachNote,matched:matchedIdeal,
    dimensions:{sentenceDiversity:Math.round(completenessScore),semanticRichness:Math.round(semanticScore),strategyDepth:Math.round(keywordScore),empathyScore:Math.round(empathyScore),keywordMatch:Math.round(keywordScore)},level:level};
}function generateFingerprint(scores){
  var types=['avoider','fighter','pleaser','analyst','social'];
  var fp='CM-';
  types.forEach(function(t,i){fp+=t.charAt(0).toUpperCase()+scores[t]+(i<4?'-':'')});
  return fp;
}
function getCompatibility(type){return COMPATIBILITY_MATRIX[type]||{}}
function getPercentages(scores){
  var total=0;Object.keys(scores).forEach(function(t){total+=scores[t]});
  if(total===0)total=1;
  var p={};Object.keys(scores).forEach(function(t){p[t]=Math.round((scores[t]/total)*100)});
  return p;
}
function getScoreColor(s){return s>=8?'var(--success)':s>=5?'var(--warning)':'var(--danger)'}
function getAvgScore(scores){
  if(!scores||scores.length===0)return 0;
  return scores.reduce(function(a,b){return a+b},0)/scores.length;
}

   BLOCK 4: RENDER — 渲染函数
   ============================================================ */
var app=document.getElementById('app');
var loadingTimeout=null;
var renderRAF=null;

function render(){
  if(renderRAF){cancelAnimationFrame(renderRAF);}
  renderRAF=requestAnimationFrame(function(){
    renderRAF=null;
    doRender();
  });
}
function doRender(){
  if(loadingTimeout){clearTimeout(loadingTimeout);loadingTimeout=null;}
  stopCarousel();
  if(state.currentPage!=='home')stopParticles();

  var isFirstRender=!app.innerHTML.trim();
  // Apply personality theme globally before rendering
  if(state.dominantType){applyPersonalityTheme(state.dominantType)}
  var executeRender=function(){
    app.innerHTML='';app.className='page-enter';
    switch(state.currentPage){
      case'home':renderHome();break;
      case'test':renderTest();break;
      case'loading':renderLoading();break;
      case'report':renderReport();break;
      case'train':renderTrain();break;
      case'dashboard':renderDashboard();break;
      case'deep-report':renderDeepReport();break;
      case'vip':renderVip();break;
      default:renderHome();
    }
    updatePageIndicator();window.scrollTo(0,0);
  };

  if(isFirstRender){executeRender();return;}

  if(window._pageTransitionTL){window._pageTransitionTL.kill();}
  window._pageTransitionTL=gsap.timeline({onReverseComplete:function(){window._pageTransitionTL=null;}})
    .to('#app',{opacity:0,y:-15,duration:ANIM.PAGE_TRANSITION_OUT/1000,ease:'power2.in'})
    .call(executeRender)
    .fromTo('#app',{opacity:0,y:15},{opacity:1,y:0,duration:ANIM.PAGE_TRANSITION_IN/1000,ease:'power2.out'});
}
function updatePageIndicator(){
  var ind=document.getElementById('pageIndicator');
  var order=['home','test','loading','report','train','dashboard'];
  var ci=order.indexOf(state.currentPage);
  var steps=[{n:1,p:'test',label:'测试'},{n:2,p:'report',label:'报告'},{n:3,p:'train',label:'特训'},{n:4,p:'dashboard',label:'仪表盘'}];
  var h='';
  steps.forEach(function(s,i){
    var si=order.indexOf(s.p);
    var cls=ci===si||(state.currentPage==='loading'&&s.p==='report')?'active':ci>si?'completed':'';
    var canNav=ci>si||ci===si; // can navigate to completed or current steps
    var actionAttr=canNav?'data-action="go-'+s.p+'"':'';
    var titleAttr='title="'+s.label+'"';
    h+='<div class="indicator-step"><div class="indicator-dot '+cls+'" '+actionAttr+' '+titleAttr+'>'+s.n+'</div></div>';
    if(i<3)h+='<div class="indicator-line '+(ci>si?'active':'')+'"></div>';
  });
  ind.innerHTML=h;
}

function switchSceneImage(nextImage){
  var wrap=document.getElementById('sceneImageWrap');
  var img=document.getElementById('testSceneImage');
  if(!wrap||!img)return;
  var tl=gsap.timeline();
  tl.to(img,{opacity:0,scale:0.8,duration:0.3,ease:'power2.in'})
    .call(function(){
      if(nextImage)img.src=nextImage;
      var isRound2=state.testDialogStep===1;
      wrap.classList.toggle('round-2',isRound2);
      var badge=wrap.querySelector('.round-badge');
      if(badge)badge.textContent=isRound2?'第 2 回合 · 局势升级':'第 1 回合';
    })
    .to(img,{opacity:1,scale:1,duration:0.4,ease:'power2.out'});
}
function showOptionFeedback(sceneImage,optionImage,text,type,callback){
  var wrap=document.getElementById('sceneImageWrap');
  var img=document.getElementById('testSceneImage');
  if(!wrap||!img){if(callback)callback();return;}
  var pt=PERSONALITY_TYPES[type]||{};
  wrap.classList.add('option-feedback');
  img.src=optionImage||sceneImage||PLACEHOLDER_IMAGE;
  wrap.style.setProperty('--feedback-color',pt.color||'#7c5cfc');
  var badge=wrap.querySelector('.round-badge');if(badge){badge.textContent='你的选择';badge.style.background='linear-gradient(135deg,'+(pt.color||'#7c5cfc')+',#06b6d4)';}
  var existing=wrap.querySelector('.option-caption');if(existing)existing.remove();
  var existingBadge=wrap.querySelector('.option-type-badge');if(existingBadge)existingBadge.remove();
  var cap=document.createElement('div');cap.className='option-caption';cap.textContent=text;wrap.appendChild(cap);
  var typeName=pt.name||type;
  var tb=document.createElement('span');tb.className='option-type-badge';tb.textContent=typeName;tb.style.background='linear-gradient(135deg,'+(pt.color||'#7c5cfc')+',var(--accent))';wrap.appendChild(tb);
  // GSAP 滑入弹跳动画
  gsap.fromTo(cap,{x:40,opacity:0},{x:0,opacity:1,duration:0.4,ease:'back.out(1.4)'});
  gsap.fromTo(tb,{x:40,opacity:0},{x:0,opacity:1,duration:0.4,ease:'back.out(1.4)',delay:0.1});
  setTimeout(function(){
    wrap.classList.remove('option-feedback');
    wrap.style.removeProperty('--feedback-color');
    if(badge)badge.style.background='';
    var c=wrap.querySelector('.option-caption');if(c)c.remove();
    var t=wrap.querySelector('.option-type-badge');if(t)t.remove();
    if(callback)callback();
  },ANIM.FEEDBACK_DELAY);
}

var DEEP_REPORTS={
  avoider:{
    title:'回避型沟通者深度解析',
    sections:[
      {h:'一、人格画像：沉默的观察者',p:'回避型沟通者在职场中像一位安静的观察者。你习惯用沉默和退让来避免冲突，这让你成为团队中的稳定器，却也容易让关键声音被淹没。在萨提亚的沟通模式理论中，你属于典型的"讨好型"与"超理智型"的混合体——面对压力时，你倾向于压抑自己的需求，用"算了""没事"来化解紧张气氛。这种模式源于对安全感的深层需求：在你的成长经历中，可能曾因为表达真实想法而遭遇否定或冲突，于是你学会了用"不说话"来保护自己。在Thomas-Kilmann冲突模式中，你对应"回避"策略——既不追求自身利益，也不追求他人利益，选择退出冲突场景。这种策略在短期内有效降低了人际摩擦，但长期来看，它让你错失了表达需求、争取资源、建立边界的关键机会。你的沉默不是因为没有想法，而是因为你把"说出想法"等同于"制造麻烦"。这个等式需要被打破。'},
      {h:'二、核心优势：情绪觉察与稳定性',p:'你的深层优势在于情绪觉察力强、善于倾听，能在纷繁的人际张力中保持冷静。当团队陷入争论时，你往往是那个能听到所有人声音的人。你不急于表态，这让你在收集信息、理解全局方面有天然优势。在需要耐心和细致的工作中——如数据分析、质量控制、用户调研——你的稳定性是团队最可靠的基石。同时，你对他人情绪的敏感让你擅长在幕后协调关系，虽然你不站在台前，但很多团队的和谐运转离不开你的默默付出。心理学研究显示，回避型沟通者往往拥有极高的"内在觉察力"——你对自己的情绪变化有清晰的感知，只是在表达上存在障碍。这种觉察力一旦被转化为有意识的表达，将成为你最大的沟通资产。你不需要变成外向的社交者，只需要学会在关键时刻把自己的观察说出来。你的安静不是弱点，而是一种尚未被释放的力量。'},
      {h:'三、典型困境：被忽视与被消耗',p:'然而，长期的压抑会让你积累委屈，甚至被贴上"好说话"的标签。在薪资谈判中，你可能因为不敢开口而错失应得的回报——研究显示，回避型沟通者的平均薪资比同级别同事低8-12%；在项目汇报中，你可能因为谦虚而让自己的贡献被忽视，导致晋升评估时缺乏有力证据；在跨部门协作中，你可能因为不拒绝而承担过多不属于你的工作，最终精力透支、效率下降。最典型的困境是：你明明有想法，却在会议上一言不发，事后又懊恼"为什么当时不说"。这种"想说却不说"的内耗，是回避型沟通者最大的能量泄漏点。更严重的是，长期的沉默会让你的存在感逐渐降低——当同事习惯了你的不表态，他们在做决策时就不会再主动征求你的意见，你的专业价值被系统性低估。'},
      {h:'四、盲区分析：沉默的代价',p:'你的沉默在别人眼中可能被解读为"没想法"或"不关心"，这与你内心的丰富思考形成巨大反差。在职场中，不被看见的贡献等于不存在——这不是不公平，而是人类认知的局限：人们只能根据"看到的"来评价你，而不是根据"你心里有的"。当你总是退让，别人会逐渐习惯性地忽略你的需求，这不是因为他们不善良，而是因为你从未教过他们如何尊重你的边界。更深层的盲区在于：你可能把"避免冲突"等同于"维护关系"，但真正的关系需要真实的表达来维系。一段从不表达分歧的关系，表面和谐，内里却可能正在疏远。此外，回避型沟通者常有一个隐藏的信念："如果我说了不同意见，别人会不喜欢我"。但职场心理学研究表明，适度的建设性冲突反而能提升团队决策质量和人际信任。你的回避不是在保护关系，而是在削弱它。'},
      {h:'五、成长策略：小步表达法',p:'成长的关键不是强迫自己变成斗士，而是学会"小步表达"。第一步：先写下自己的诉求——书写比说话压力更小，你可以先在备忘录里整理思路，把模糊的感受转化为清晰的语句。第二步：选择一个低风险场景说出来——比如在1对1沟通中先练习，而不是在大会上发言。从"我有个小建议"开始，逐步建立表达的肌肉记忆。第三步：使用"我观察到…我希望…"句式——这种结构既表达了需求，又不会显得攻击性，对方更容易接受。第四步：练习"温和的拒绝"——当遇到不合理请求时，用"我很想帮你，但我现在手上有X和Y要完成"来替代沉默接受。当你能够把"我不想"清晰传达时，你会发现，尊重往往比顺从更能换来真正的安全感。记住：表达不等于对抗，你可以在保持温和的同时，坚定地说出自己的想法。每一次开口，都是在重新定义你在职场中的存在方式。'},
      {h:'六、场景应对剧本',p:'【薪资谈判】"老板，我整理了入职以来的业绩数据，希望能聊聊薪资调整。我负责的A项目让转化率提升了15%，B项目按时交付节省了20%成本。基于这些产出，我希望能有15%的涨幅。这是详细的数据报告，您看方便约个时间聊聊吗？"【会议发言】"我补充一个视角，从用户调研的数据来看，方案A的留存率更高，建议我们优先验证这个方向。如果大家觉得有道理，我可以出一份数据对比报告。"【拒绝同事】"我理解你急需帮忙，但我手上有两个本周截止的任务，实在排不开。建议你找老王协调一下，或者下周我有空了主动帮你。"【向上管理】"老板，关于这个方案我有一些不同看法，想跟您单独聊聊。不是反对，是想补充一个可能被忽略的风险点。"'},
      {h:'七、30天提升计划',p:'第1-7天：每天在备忘录写下3个"想说但没说"的想法，不需要发给任何人，只为自己建立"我有想法"的认知。第8-14天：选择1个低风险场景（如1对1沟通）练习表达，使用"我观察到…我希望…"句式。第15-21天：在团队会议上至少发言1次，提前准备好要说的内容，用备忘录辅助。第22-28天：练习1次"温和的拒绝"，用"我可以，但…"替代直接答应。记录对方的反应——你会发现，拒绝并没有你想象的那么可怕。第29-30天：复盘30天的表达记录，找出最舒服的表达方式，形成自己的沟通模板。将这个模板贴在工位上，作为日常提醒。30天后，你会发现自己不再是那个"想说却不说"的人，而是一个"温和但坚定"的沟通者。<p style="color:var(--text-secondary);line-height:1.8;font-size:var(--text-sm);margin-top:var(--space-sm)">此外，回避型沟通者要特别注意自我关怀。长期压抑情绪会导致身心俱疲，因此你需要建立健康的情绪出口——运动、写作、冥想或与信任的朋友倾诉。只有当你的内在能量充足时，你才敢在职场中表达自己。不要把自己逼成另一个人，而是在保持本真的基础上，增加一个"表达开关"。当你累了，你可以选择安静；当关键时刻到来，你可以坚定地发声。这种弹性的沟通能力，才是回避型人格最终要达到的健康状态。</p>'},
      {h:'八、常见误区与行动清单',p:'误区一："等我准备好了再说。"你永远不会有100%准备好的时刻，80%的准备就可以开口。误区二："说多了会让别人烦。"适度表达不会让人烦，过度沉默才会让人忽视你。误区三："温和等于软弱。"真正的温和是坚定但不攻击，这是最高级的沟通力量。行动清单：①明天找一个1对1场景，说一句你原本不会说的话。②本周内拒绝一次不合理请求。③本月内在团队会议上发言至少一次。④准备一个"我的贡献"文档，记录你的工作成果。⑤找到一个可以信任的同事或导师，定期交流你的职场困惑。当你把这些小行动坚持下去，你会发现，表达不再是一件可怕的事，而是你越来越熟练的工具。在实践小步表达的过程中，反复和退缩是正常的。某一天你鼓起勇气在会议上发言，却发现对方反应冷淡，甚至打断你，这时你可能会立刻缩回沉默的壳里，告诉自己果然还是不该说。但请记住，一次不理想的表达不代表你错了，只代表你需要调整方式、选择更合适的场景或措辞。沟通本质上是一种技能，而任何技能的提升都必然伴随试错。你可以把每一次表达当作一个小型实验：记录你说了什么、对方的反应、你当时的感受，以及下次可以如何改进。通过这种有意识的复盘，你会逐渐形成最适合自己的表达风格。长期来看，回避型沟通者最重要的突破点不是一次性大声说，而是持续地小步说。只要你保持每周至少一次的真实表达，半年之内你的职场存在感就会发生显著变化。与此同时，建议你主动寻找一个支持性的环境：选择一位至少会认真倾听你说话的同事、朋友或导师，从TA开始练习表达。当你在安全的关系中反复体验到表达不会被惩罚、真实不会带来灾难，你的表达肌肉就会越来越强壮，你也会在更多场合敢于发出自己的声音。最后，请把这次深度解析当作一个起点，而不是终点。改变沟通模式是一个长期的过程，不需要你在一夜之间变成外向的演说家。你可以从明天早上的第一句话开始：在会议上分享一个你观察到的小细节，在群聊里表达一次真实的赞同或反对，在1对1沟通中提出一个你真正关心的问题。每一个微小的表达，都是在为你的职场存在感添砖加瓦。同时，也要学会接纳自己的节奏。有些周你可能说得很多，有些周你可能只想安静观察，这都是正常的。重要的是，你正在朝着一个更加真实、更加有力量的自己前进。当你不再把沉默当作唯一的保护壳，你会发现，原来你的声音一直都值得被听见。职场镜像会一直陪伴你，见证你从一个安静的观察者，成长为一个温和而坚定的表达者。'}
    ]
  },
  fighter:{
    title:'对抗型沟通者深度解析',
    sections:[
      {h:'一、人格画像：天生的推进者',p:'对抗型沟通者是天生的推进者。你敢于直面问题、快速决策，在混乱中能迅速找到突破口。在TKI冲突模式理论中，你属于"竞争型"——面对分歧时，你倾向于坚持自己的立场，用实力和逻辑推动结果。这种模式源于对效率和掌控感的追求：在你的认知中，直接解决问题比绕圈子更高效，"把话说清楚"比"照顾情绪"更重要。你的能量和果断是团队最稀缺的资源之一，尤其在需要打破僵局、做出艰难决策的时刻。在萨提亚沟通模式中，你偏向"指责型"——面对压力时，你倾向于强调他人的不足，用攻击性语言来维护自己的立场。这并不意味着你不关心他人，而是你的"关心"被包裹在锋利的表达中，对方需要透过层层防御才能接收到你的善意。你的挑战不是缺乏能力，而是让你的能力被更多人接受。'},
      {h:'二、核心优势：决断力与推动力',p:'你的核心优势在于决断力和推动力。当团队犹豫不决时，你敢于拍板；当项目陷入泥潭时，你能一刀切开症结。你不怕得罪人，这让你在需要"说真话"的场景中极具价值——比如指出方案的致命缺陷、挑战不合理的流程、推动被搁置的决策。在高压环境中，你的战斗力反而会提升，这种"越挫越勇"的特质让你在危机管理中表现出色。同时，你的直率也意味着沟通成本低——别人不需要猜你的意思，你说什么就是什么。研究显示，对抗型沟通者在创业、销售、项目管理等需要快速决策的领域有显著优势。你的"攻击性"在正确使用时，是一种推动变革的领导力。许多伟大的变革者都具备这种特质——他们不怕冲突，因为他们知道，有些问题不通过冲突就无法解决。你的锋芒是你的武器，关键在于学会何时出鞘、何时入鞘。'},
      {h:'三、典型困境：孤立与防御',p:'然而，战斗姿态也容易让同事进入防御模式，长期下来可能让你在协作中孤立无援。你可能发现：开会时大家不太愿意发言，因为你总是第一个反驳；跨部门协作时，其他团队对你"敬而远之"；甚至在你需要支持时，很少有人主动站出来。最典型的困境是：你赢了争论，却输了关系；你推动了结果，却消耗了人心。这种"赢了战场、输了战争"的模式，是对抗型沟通者最需要警惕的陷阱。更深层的问题是，你的"直率"可能被对方体验为"攻击"——当你说"这个方案有问题"时，你是在讨论方案，但对方听到的是"你能力不行"。这种认知错位导致你的专业意见被情绪反应淹没。此外，对抗型沟通者常有一个隐藏的信念："如果我退让，就是示弱"。但真正的强者不是永远战斗，而是知道何时战斗、何时倾听。你的战斗力和你的同理心不是对立的——它们是同一枚硬币的两面。'},
      {h:'四、盲区分析：强硬的外壳下',p:'你的强硬在别人眼中可能被解读为"不近人情"或"自以为是"，这与你内心"想把事情做好"的初衷形成反差。你可能没有意识到：当你用"你错了"开场时，对方的杏仁核会立即进入战斗模式，之后无论你的论点多么正确，对方都很难真正听进去。神经科学研究显示，当人感受到被攻击时，大脑的前额叶皮层（负责理性思考）活动会降低，而杏仁核（负责战斗或逃跑反应）活动会增强——这意味着你的"讲道理"在对方处于防御状态时完全无效。更深层的盲区在于：你可能把"不同意"等同于"不尊重"，把"沉默"等同于"软弱"。但真正的领导力不是让所有人闭嘴，而是让不同声音都能被整合进最终决策。你可能还忽略了：你的"直接"在某些文化背景下（如东亚职场）会被视为冒犯，即使你的本意只是高效沟通。适应不同听众的沟通风格，不是妥协，而是智慧。'},
      {h:'五、成长策略：带剑入鞘',p:'你真正的成长不是放弃锋芒，而是学会"带剑入鞘"。第一步：在表达立场之前先确认对方的诉求——"我理解你的出发点是…"这一句话就能让对方从防御模式切换到倾听模式。第二步：用"我观察到…我担心…"替代"你错了"——前者描述事实和感受，后者直接攻击人格。第三步：练习"先肯定，再补充"——"你说得对，同时我补充一个视角…"这种结构既保留了你的锋芒，又不会让对方感到被否定。第四步：学会"战略性沉默"——不是所有战场都需要你冲锋，有些时候让子弹飞一会儿，问题会自行解决。第五步：定期"关系存款"——在非冲突时刻主动关心同事，建立信任储备，这样在下次需要战斗时，你的锋芒不会伤害关系根基。当你的强硬被同理心包裹，你的影响力会从对抗升级为引领。真正的领导力不是"我说了算"，而是"大家愿意跟我走"。'},
      {h:'六、场景应对剧本',p:'【意见分歧】"我理解你的方案出发点是好的，同时我观察到数据上有三个风险点。我建议我们先验证这几个关键假设，再做最终决定。如果你有不同看法，我们可以一起看看数据。"【向上管理】"老板，我不同意这个方向，原因有三。但如果您决定推进，我会全力执行。这是我的风险预案，确保即使方向有偏差，我们也能及时调整。"【团队冲突】"大家都说了自己的想法，我来总结一下。A方案的优势是…B方案的优势是…我建议我们取两者之长，大家觉得呢？"【给予反馈】"你最近的工作有几个亮点，同时有一个地方需要改进。具体来说，报告的数据分析部分需要更严谨。我给你一些建议，你看怎么样？"'},
      {h:'七、30天提升计划',p:'第1-7天：每天记录1次"想说但忍住了"的时刻，反思如果换一种方式表达会怎样。同时记录1次"说了但后悔说太重"的时刻。第8-14天：练习"先肯定再补充"句式，至少在3次对话中使用。观察对方的反应变化。第15-21天：在1次争论中主动停下来问对方"你的顾虑是什么？"记录这个暂停对对话走向的影响。第22-28天：选择1个"对手"，主动找TA喝咖啡，了解TA的视角。不带评判地倾听，只问"你当时是怎么想的？"第29-30天：复盘30天的人际反馈，找出"带剑入鞘"最有效的场景。将这些场景整理成你的"沟通 playbook"，作为未来类似情境的参考。30天后，你会发现自己不再是那个"赢了争论输了人心"的人，而是一个"既有锋芒又有温度"的领导者。<p style="color:var(--text-secondary);line-height:1.8;font-size:var(--text-sm);margin-top:var(--space-sm)">此外，对抗型沟通者需要学会识别"战斗疲劳"。长期处于高度防御和攻击状态会消耗大量精力，也可能让你把职场中的战斗模式带入亲密关系，造成不必要的伤害。定期问自己："这个问题真的需要我战斗吗？""我是在推动事情，还是在证明自己对？"这种自我觉察能帮你把战斗力用在真正重要的战场上。记住，最强的不是永远战斗的人，而是能选择何时战斗、何时合作的人。你的目标不是消灭所有反对声音，而是带领团队走向更好的结果。</p>'},
      {h:'八、常见误区与行动清单',p:'误区一："只有赢了才对。"职场不是零和博弈，合作往往能创造比竞争更大的价值。误区二："直接就是高效。"不考虑对方接受度的直接，往往导致低效和反弹。误区三："情绪是弱点。"忽视情绪不会让你更专业，只会让你更难说服别人。行动清单：①明天在表达反对意见前先说一句"我理解你的出发点是…"。②本周内主动倾听一个你不同意的观点，不反驳。③本月内给一位同事真诚的正面反馈。④找一位"对手"进行一次非工作话题的交流。⑤在每次激烈讨论后，发一条简短的信息维护关系。当你开始把关系也当作目标，你的战斗力会获得更广泛的拥护。在带剑入鞘的修炼中，最大的挑战往往不是改变表达方式，而是改变深层的自我认知。你可能长期以来把直接等同于真实，把委婉等同于虚伪，把考虑他人感受等同于软弱。但请认真区分：真诚并不等于不加修饰，直接也并不等于可以不顾及他人感受。你完全可以依旧保持锋芒，只是让锋芒指向问题本身，而不是指向与你讨论问题的人。一个非常有用的练习是事后修复：每次经历激烈的讨论或争论之后，主动给相关人员发一条简短的信息，表达你对事不对人的态度，并肯定对方在讨论中的贡献或立场。这种战后重建能极大减少关系的损耗，也能让别人看到你的温度。长期而言，对抗型沟通者真正要追求的不是赢得每一场争论，而是成为能够推动团队穿越冲突、抵达更好共识的人。当你不再把冲突视为胜负场，而是视为集体智慧的磨刀石，你的影响力会从让人敬畏升级为让人愿意跟随。这种领导力的获得，不是靠更强硬的表达，而是靠更有智慧的表达。最后，请把这次深度解析当作一面镜子，照见你既有锋芒也有温度的可能性。你不需要否定自己的果断和力量，你只需要学会让这份力量服务于团队，而不是凌驾于团队之上。下一次当你想要直接反驳时，先深呼吸一次，问自己：我的目标是赢得这场争论，还是让团队做出更好的决策？如果你的答案是后者，请选择一种能让对方听进去的表达方式。长期练习之后，你会发现，真正的权威不是来自音量，而是来自别人对你的信任和尊重。当你既有能力推动事情，又有智慧维护关系，你就成为了团队中不可替代的领导者。职场镜像相信，你的锋芒可以成为变革的力量，而你的温度可以让这份力量被更多人接受。记住，最有力量的声音，不是最响的声音，而是最能被听进去的声音。当你学会让自己的锋芒被理解，你的影响力将不再依赖对抗，而来自尊重。'}
    ]
  },
  pleaser:{
    title:'讨好型沟通者深度解析',
    sections:[
      {h:'一、人格画像：温暖的黏合剂',p:'讨好型沟通者是团队里的温暖黏合剂。你敏感于他人情绪，擅长维系和谐，总能在气氛紧张时递出台阶。在萨提亚理论中，你属于典型的"讨好型"——面对压力时，你倾向于忽略自己的需求，优先满足他人。这种模式源于对被认可的深层渴望：在你的成长经历中，可能只有"乖""听话"才能获得关注和爱，于是你学会了用"让别人满意"来确认自己的价值。你的温暖和包容是团队不可或缺的软实力。在依恋理论中，你可能偏向"焦虑型依恋"——你过度关注他人的反应，害怕被拒绝或抛弃，因此用讨好来维系关系。这种模式在短期内让你获得了"好人缘"，但长期来看，它让你失去了自我。你把"被需要"等同于"被爱"，把"不拒绝"等同于"被认可"，但真正的认可不是来自无底线的付出，而是来自有价值的贡献和被尊重的边界。'},
      {h:'二、核心优势：共情力与关系维护',p:'你的核心优势在于共情力和关系维护能力。你能敏锐感知团队的情绪变化，在冲突爆发前就做好缓冲。你擅长倾听、善于安慰、总愿意伸出援手，这让你在团队中拥有极高的人气。在需要跨部门协作、客户关系维护、团队氛围建设的场景中，你的"润滑剂"作用无可替代。同时，你的善良和真诚让你容易获得信任，别人愿意对你敞开心扉，这让你在信息收集和人际网络方面有独特优势。心理学研究显示，讨好型沟通者往往拥有极高的"情绪智力"——你能准确识别他人的情绪状态，并做出恰当的回应。这种能力在客户成功、人力资源、团队管理等角色中极其宝贵。你的"讨好"如果被重新定义为"高度的人际敏感度"，它就不再是弱点，而是一种可以被战略化运用的核心能力。关键在于：把这种能力从"被动响应"升级为"主动选择"——你选择何时付出、对谁付出、付出多少，而不是无差别地满足所有人。'},
      {h:'三、典型困境：边界模糊与自我消耗',p:'但过度的迎合会让你失去边界，把"让别人满意"误当成自己的价值来源。你容易疲惫、难以拒绝，也常常在事后懊恼"为什么又答应了"。最典型的困境是：同事临时甩锅，你不好意思拒绝就接了；领导安排额外任务，你怕让TA失望就扛了；朋友借钱，你担心关系破裂就借了。结果你的时间被碎片化，精力被消耗殆尽，真正重要的工作反而没时间做好。更深层的问题是：当你从不拒绝，别人会逐渐把你的付出视为理所当然——这不是因为他们不感恩，而是因为人类大脑会自动适应"常态"，你的"总是答应"成了别人的"默认预期"。研究显示，讨好型沟通者的职业倦怠率是其他类型的2.3倍，因为你的能量持续外流而没有得到补充。最讽刺的是：你为了维系关系而不断付出，但过度付出的结果是——你没有精力经营真正重要的关系，你的"广撒网"式讨好让你在关键时刻反而缺乏深度支持。'},
      {h:'四、盲区分析：讨好不等于善良',p:'你的"好说话"在别人眼中可能被解读为"没原则"或"好欺负"。你可能没有意识到：当你总是说"好的没问题"，别人会认为你的时间不值钱；当你从不表达不满，别人会以为你真的不在意。更深层的盲区在于：你可能把"拒绝"等同于"伤害关系"，但真正的关系不是从不拒绝，而是拒绝之后依然被尊重。一段需要你不断牺牲自己才能维系的关系，本身就不健康。你的讨好不是善良，而是一种对冲突的恐惧。更隐蔽的盲区是：你的"讨好"可能暗含一种控制欲——"如果我对你足够好，你就不会离开我/否定我"。这种隐性契约让你在关系中始终处于焦虑状态，因为你无法控制对方的反应。当对方没有按你的预期回报你的付出时，你会感到深深的委屈和背叛。但问题是：对方从未同意过这份"契约"，TA只是在接受你的好意，并不知道你内心有着"等价交换"的期待。这种未说出口的期待，是讨好型沟通者最大的关系陷阱。'},
      {h:'五、成长策略：温柔的边界',p:'成长的关键是建立"温柔的边界"。第一步：先承认自己想帮忙的善意——"我很想帮你"这一句话确认了你的善意，让对方知道你不是不愿意。第二步：再明确表达能力和时间的限制——"但我手上有三个截止任务，这周实在排不开"。第三步：提供替代方案——"下周我有空了主动找你"或"建议你找老王，他对这块更熟"。学会把"我可以"换成"我可以，但…"是你最该练习的句式。第四步：练习"延迟回应"——当收到请求时，不要立即答应，而是说"让我看看日程表，下午回复你"。这个缓冲期让你有时间评估自己是否真的有能力帮忙。第五步：建立"优先级清单"——把你的核心任务和个人目标列出来，当请求与这些优先级冲突时，拒绝就有了客观依据。记住：温柔的边界不是冷漠，而是对自己和他人都负责的表现。一个精力充沛、边界清晰的你可以帮3个人，远胜于一个精疲力竭、没有边界的你勉强帮10个人。'},
      {h:'六、场景应对剧本',p:'【拒绝同事】"我很想帮你，但我今晚有三个任务要截止，实在排不开。建议你找老王协调一下优先级，或者下周我有空了主动问你需不需要支持。"【表达不满】"上次那件事我其实有些不舒服，不是怪你，是想跟你聊聊我的感受，下次我们能不能换个方式？我希望我们的合作更顺畅。"【争取权益】"谢谢老板认可我的付出！基于今年的业绩，我希望能聊聊薪资调整的可能性。我整理了几个关键项目的数据，您看方便约个时间聊聊吗？"【设置边界】"我理解这个需求很紧急，但我需要先完成手上的核心项目。如果你能跟我的leader协调一下优先级，我可以重新安排。"'},
      {h:'七、30天提升计划',p:'第1-7天：每天记录1次"想拒绝但答应了"的时刻，反思拒绝的话可以怎么说。同时记录答应后的感受——是否后悔、是否疲惫。第8-14天：练习"我可以，但…"句式，至少拒绝3次不合理请求。记录对方的反应——你会发现，大多数人并不会因为被拒绝而生气。第15-21天：在1次沟通中主动表达自己的不满或需求。使用"我感到…我希望…"句式，避免指责。第22-28天：每天给自己留1小时"不被打扰"的时间，学会对自己好。这段时间用来做对你最重要的事，而不是回应别人的需求。第29-30天：复盘30天的边界练习，找出最舒服的拒绝方式。将这些方式整理成你的"温柔边界手册"，作为未来参考。30天后，你会发现自己不再是那个"什么都答应"的人，而是一个"有温度但有原则"的沟通者。<p style="color:var(--text-secondary);line-height:1.8;font-size:var(--text-sm);margin-top:var(--space-sm)">此外，讨好型沟通者要学会区分"帮助他人"和"拯救他人"。帮助他人是提供支持，拯救他人是承担别人的责任。你不需要为每个人的情绪和结果负责，那超出了你的能力范围。真正的善良是有边界的善良——你知道自己能帮助多少，也知道自己需要保留多少。同时，试着把对自己的温柔也纳入"讨好"的范围：如果你能对别人的需求如此敏感，为什么不能对自己的疲惫和需求同样敏感？当你开始善待自己，你会发现自己反而有更多能量去帮助真正重要的人。</p>'},
      {h:'八、常见误区与行动清单',p:'误区一："拒绝会让我失去朋友。"真正会因为合理拒绝而离开的人，本就不是真正的朋友。误区二："帮忙越多越被喜欢。"无底线的帮忙换来的不是喜欢，而是理所当然。误区三："让别人开心是我的责任。"每个人都有管理自己情绪的义务，你不需要为所有人的情绪买单。行动清单：①明天当有人求助时，先说"让我看一下时间"，给自己缓冲。②本周内明确拒绝一次超出能力范围的请求。③本月内主动表达一次自己的真实需求。④准备一个"我的优先级"清单，放在显眼位置。⑤每天睡前问自己：今天我为自己做了什么？当你开始把自己的需求放在同等重要的位置，你的付出会更有价值，关系也会更健康。建立温柔边界的过程中，你几乎必然会经历内疚感的反扑。当你第一次拒绝别人的请求，对方可能平静地接受了，甚至完全没放在心上，但你心里却可能反复响起我是不是太自私了、这样会不会伤害关系的声音。这种内疚感不是因为你做错了什么，而是因为你正在打破旧有的讨好模式，你的神经系统还不习惯新的互动方式。请允许自己感到不适，但不要因此立刻妥协。你可以温柔地对自己说：我的需求同样重要，合理的边界不是冷漠，而是对这段关系真正负责。同时，不要试图一次性改变所有关系，先从风险最低、最安全的人开始练习拒绝。随着你一次次体验到拒绝并不会让关系破裂、设立边界反而赢得尊重，你的内疚感会逐渐降低，边界会越来越清晰。最终你会发现，那些真正值得你付出的关系，会因为你的边界而更加珍惜你；而那些只希望你无条件付出、一旦你拒绝就疏远你的人，本来也没有真正尊重过你。允许他们淡出，不是损失，而是一种必要的筛选，它会让你的精力更集中地投入到真正重要的关系里。最后，请把这次深度解析当作一封写给自己的允许信：允许你说不，允许你先照顾自己，允许你不必让所有人都满意。你的善良和敏感是珍贵的，但它们只有在被尊重的边界内才能持续发光。明天开始，试着在一次小请求面前停下来，问问自己：这是我真心想做的，还是我害怕拒绝才答应的？如果是后者，请温柔而坚定地说出你的选择。你不需要为别人的情绪负责，你只需要为自己的选择负责。随着你越来越习惯这种有边界的付出，你会发现，真正重要的人不仅没有离开你，反而更加尊重你。职场镜像会一直支持你，从一个讨好者成长为一个有原则、有温度、有力量的沟通者。'}
    ]
  },
  analyst:{
    title:'理性型沟通者深度解析',
    sections:[
      {h:'一、人格画像：数据锚点',p:'理性型沟通者是职场中的"数据锚"。你擅长在混乱中抽离情绪、看清结构，用逻辑和事实推动决策。在MBTI框架中，你可能偏向INTJ或INTP型——面对问题时，你的第一反应不是"我感觉怎样"，而是"数据怎么说"。这种模式源于对确定性和公平性的追求：在你的认知中，基于事实的决策比基于情绪的决策更可靠，"用数据说话"比"凭感觉判断"更专业。你的冷静和理性是团队在复杂决策中最需要的锚点。在萨提亚沟通模式中，你属于"超理智型"——面对压力时，你倾向于引用数据、逻辑和规则来应对，而忽略自己和对方的情感需求。这并不意味着你没有情感，而是你把情感视为"干扰项"，认为只有理性分析才能产出最优解。这种信念在技术决策中是优势，但在人际沟通中可能成为障碍——因为人不是机器，决策不仅依赖逻辑，还依赖信任、共鸣和情感连接。'},
      {h:'二、核心优势：逻辑力与客观性',p:'你的核心优势在于逻辑分析能力和客观性。当团队被情绪裹挟时，你能抽离出来看到问题的本质；当方案存在漏洞时，你能用数据和逻辑精准定位。你擅长构建分析框架、设计实验验证假设、用可视化呈现复杂信息。在需要战略规划、风险评估、绩效分析的场景中，你的"数据驱动"能力让决策更有依据。同时，你的公平性让你在处理争议时显得公正——你不偏袒任何一方，只尊重事实。研究显示，理性型沟通者在数据分析、战略咨询、风险管理、技术研发等领域的表现显著优于其他类型。你的"客观性"在需要中立判断的场景中（如审计、质检、评估）是无可替代的优势。你的分析能力不仅体现在数据层面，还体现在系统性思维上——你能看到事物之间的关联，预判连锁反应，这种"全局视角"让你在复杂决策中具有独特的战略价值。你的冷静不是冷漠，而是一种在压力下保持清晰思考的能力。'},
      {h:'三、典型困境：被误解为冷漠',p:'但这种能力在高压环境中极其珍贵，却也容易让你被误解为冷漠或高高在上。你可能发现：同事在遇到困难时不太愿意找你，因为你总是"就事论事"而忽略了他们的感受；在团队讨论中，你的"数据反驳"让别人觉得自己被"打脸"了；甚至在你提出建设性意见时，别人反应不是感激而是防御。最典型的困境是：你的分析完全正确，但没有人愿意听。这种"对但没用"的尴尬，是理性型沟通者最需要突破的瓶颈。更深层的问题是：你可能把"情绪"视为"不专业"的表现，但组织行为学研究显示，70%的决策最终受情感因素影响——即使决策者自认为是"理性"的。当你只提供数据而不提供"为什么这些数据重要"的叙事，你的分析就缺少了说服力。此外，你的"客观"可能被对方体验为"傲慢"——当你用数据否定别人的经验时，对方感受到的不是"你在帮我优化方案"，而是"你觉得我蠢"。这种认知错位让你的专业价值被情绪反应淹没。'},
      {h:'四、盲区分析：数据的温度',p:'你的"就事论事"在别人眼中可能被解读为"不近人情"或"缺乏同理心"。你可能没有意识到：当同事说"这个方案我做了很久"，TA不是在讨论方案质量，而是在寻求情感认可；当你直接说"数据有问题"，对方听到的不是"方案需要优化"，而是"你能力不行"。更深层的盲区在于：你可能把"情绪"视为"噪音"，但情绪本身就是沟通信息的重要组成部分。忽视情绪不等于专业，反而可能让你错失理解问题本质的关键线索。神经科学研究表明，纯逻辑的信息在大脑中的留存率仅为5-10%，而带有情感叙事的信息留存率高达65-70%。这意味着你的"纯数据"表达实际上大大降低了你的说服力。另一个盲区是：你可能认为"事实自明"——只要数据足够清晰，结论就不言而喻。但事实从来不会自己说话，它需要你来赋予意义。当你只呈现数据而不解读"这对我们意味着什么"，你把理解的重担推给了听众，而大多数听众没有你那样的分析能力来消化这些数据。'},
      {h:'五、成长策略：为理性披上温度',p:'你的成长不是放弃理性，而是为理性披上温度。第一步：在给出结论之前先承认对方的处境——"我理解这个方案你花了很多心思"这一句话就能让对方从防御切换到开放。第二步：用"我理解你的担心，同时数据告诉我们…"来连接头脑与心灵——这种结构既保留了你的逻辑优势，又让对方感到被尊重。第三步：在呈现数据时加入"这对我们意味着什么"的解读——数据本身不会说话，你需要帮别人理解数据背后的故事。第四步：学习"叙事化数据"——不要只展示冰冷的图表，而是用"想象一下…"来帮听众进入数据背后的场景。第五步：在分析之前先问"你的感受是什么？"——这个问题不会削弱你的客观性，反而能帮你理解对方的关注点，让你的分析更有针对性。当你能让数据和共情并肩而行，你的说服力会成倍放大。真正的专业不是只有理性，而是在理性之上叠加人性洞察。'},
      {h:'六、场景应对剧本',p:'【方案质疑】"我理解这个方案花了很多心思，同时我注意到第三页和第五页的数据有矛盾。我建议我们先核实一下数据，确保方案的基础是扎实的。如果你方便，我们可以一起看看。"【向上汇报】"老板，Q3的核心数据我整理好了。转化率提升了12%，但获客成本上升了8%。这意味着我们的增长效率在下降。我建议下季度重点关注获客效率，这是详细的分析报告和三个优化方案。"【团队反馈】"大家辛苦了，我补充一个数据视角。从用户留存来看，方案A的长期效果更好，建议我们往这个方向深入。当然，这只是数据层面的建议，最终决策还是看大家。"【跨部门协作】"我理解你们部门的顾虑，从数据来看，如果我们调整一下排期，两个部门的目标都能达成。我做了一个对比分析，你们看看是否可行。"'},
      {h:'七、30天提升计划',p:'第1-7天：每天在1次对话中先说"我理解…"再表达观点。记录对方的反应变化——你会发现先共情再分析，对方更容易接受。第8-14天：练习用"数据+解读"的方式呈现分析结果。每次分析后加一句"这意味着…"，帮听众理解数据的意义。第15-21天：在1次争论中主动问对方"你的感受是什么？"记录这个问题对对话走向的影响。第22-28天：选择1个"感性话题"（如团队氛围），尝试用共情方式参与讨论。不提供数据，只提供感受和观察。第29-30天：复盘30天的沟通记录，找出理性与共情结合最有效的场景。将这些场景整理成你的"理性沟通模板"，包含"共情开场+数据论证+意义解读+开放结尾"四步结构。30天后，你会发现自己不再是那个"对但没人听"的人，而是一个"既有逻辑又有温度"的分析者。<p style="color:var(--text-secondary);line-height:1.8;font-size:var(--text-sm);margin-top:var(--space-sm)">此外，理性型沟通者要警惕"分析瘫痪"。当数据不够完美、信息不够完整时，你可能迟迟无法做出决定，错失行动的最佳时机。要接受一个事实：职场中的大多数决策都是在信息不完备的情况下做出的。你的分析能力应该是加速决策的工具，而不是拖延决策的借口。学会设定"足够好"的标准——当你拥有80%的关键信息时，就可以做出判断了。剩下的20%可以在行动中验证和调整。数据是导航仪，但方向盘始终在人手中。</p>'},
      {h:'八、常见误区与行动清单',p:'误区一："数据足够充分才能决策。"等待完美数据往往会错失最佳时机。误区二："情绪会干扰判断。"情绪本身也是信息，完全排除情绪可能让你忽略关键信号。误区三："我说清楚了别人就应该懂。"真正的沟通是确保对方理解，而不是自己说完了。行动清单：①明天在分享数据时，先问一句"大家对这个问题最关心什么"。②本周内用故事化的方式呈现一次数据分析。③本月内主动了解一个你不太熟悉的同事的工作感受。④准备一个"数据解读模板"，每次汇报都包含"结论+原因+建议"。⑤在团队讨论中，练习先肯定再补充至少三次。当你能让数据"活"起来，你的分析会真正推动决策。为理性披上温度的过程中，你需要特别警惕伪共情的陷阱。所谓伪共情，是指机械地在每句话前面加上我理解你、我知道你的感受，但内心其实依然在评判和计算。这种表面的话语不仅无法建立连接，反而会让对方感到被敷衍和被操控。真正的共情不是一种话术技巧，而是一种 genuinely 关心对方处境和感受的态度。一个有效的练习方法是：在每一次数据分析之前，先花三分钟了解数据背后的人。比如当你看到转化率下降时，不仅要看数字本身，也要想一想一线销售当前面临的压力、用户在使用产品时可能遇到的真实障碍、产品团队对迭代节奏的焦虑。当你能够把冰冷的数据和真实的人的故事连接起来，你的分析就不再是居高临下的判断，而是有温度、有洞察、能引发行动的思考。另一个关键点是在团队汇报中加入价值叙事：不要只说这个指标增长了百分之十二，而要进一步解释这意味着我们帮助了更多用户解决了他们真正关心的问题。人们不仅会被逻辑说服，更会被意义打动。当你能让数据和意义并肩而行，你的说服力会成倍放大。最后，请把这次深度解析当作一次提醒：在追求精确和逻辑的同时，别忘了沟通的对象是活生生的人。数据可以告诉你发生了什么，但只有理解人的动机、恐惧和期待，你才能知道为什么发生，以及接下来该做什么。下一次汇报时，试着在数据后面加一个真实的故事；下一次讨论时，试着先问一句你关心的是什么；下一次同事犯错时，试着在指出问题前先肯定对方的努力。这些小改变不会削弱你的专业，反而会让你的分析更有影响力。当你成为那个既有数据深度、又有人文温度的人，你就拥有了稀缺的复合型领导力。职场镜像期待看到你用理性点亮方向，用温度凝聚人心。'}
    ]
  },
  social:{
    title:'社交型沟通者深度解析',
    sections:[
      {h:'一、人格画像：天生的连接者',p:'社交型沟通者是职场中的"连接者"。你天生擅长读懂气氛、建立关系，能让对话在轻松中推进。在DISC理论中，你可能属于"I型"——外向、热情、善于表达。这种模式源于对人际连接的天然热爱：在你的认知中，关系是一切工作的基础，"先做朋友再做事"比"公事公办"更高效。你的社交能力在需要协作、谈判或动员资源的场景中是巨大的优势。你的热情和感染力能点燃团队的士气，让你在需要"人气"的项目中如鱼得水。在萨提亚沟通模式中，你偏向"打岔型"——面对压力时，你可能用幽默或转移话题来化解紧张，而不是直面问题。这种策略在短期内有效缓解了气氛，但长期来看，它可能让你回避了真正需要解决的问题。你的社交能力是一把双刃剑：用得好，你是团队的粘合剂；用得过度，你可能成为"只说不做"的人。关键在于：把你的社交能力从"回避工具"升级为"推进工具"。'},
      {h:'二、核心优势：影响力与资源整合',p:'你的核心优势在于人际影响力和资源整合能力。你能在5分钟内和陌生人建立信任，在跨部门协作中迅速找到关键人物，在团队低迷时用一句话点燃士气。你擅长"读空气"——感知谁需要被鼓励、谁需要被倾听、谁需要被认可。在需要动员资源、推动变革、处理复杂人际关系的场景中，你的"关系网络"就是最强大的工具。同时，你的乐观和幽默让你成为团队的"情绪稳定器"，在压力下依然能保持积极氛围。研究显示，社交型沟通者在销售、商务拓展、公关、团队领导等需要"人际杠杆"的角色中表现突出。你的"人气"不是肤浅的社交技巧，而是一种深层的"社会智力"——你能准确感知人际动态，并在合适的时机做出合适的回应。你的幽默感是化解冲突的利器，你的热情是推动项目的引擎，你的关系网络是解决问题的资源库。这些能力在"连接经济"时代越来越重要——谁能连接更多人，谁就能创造更大价值。'},
      {h:'三、典型困境：回避艰难对话',p:'但社交型也容易把"关系好"当成"问题解决了"，回避真正艰难的对话。你可能发现：当需要给下属负面反馈时，你总是"绕圈子"而无法直说；当需要拒绝不合理请求时，你因为"怕伤关系"而勉强答应；当团队存在矛盾时，你选择"和稀泥"而不是直面问题。最典型的困境是：你人缘很好，但执行力被质疑；你认识很多人，但关键时刻能调动的不多。这种"广而不深"的人际网络，在需要硬仗的时候可能力不从心。更深层的问题是：你可能把"受欢迎"等同于"有影响力"，但两者有本质区别——受欢迎是"大家喜欢你"，有影响力是"大家愿意为你行动"。当你只维护表面和谐而不解决实质问题，你的"关系好"就成了一层薄薄的糖衣，经不起真正的考验。此外，社交型沟通者常有一个隐藏的恐惧："如果我不有趣/不热情，别人就不会喜欢我"。这个信念让你在社交中始终戴着面具，无法展现真实的自己——包括你的脆弱、你的不确定、你的严肃面。长期戴着面具让你疲惫，也让你的关系缺乏深度。'},
      {h:'四、盲区分析：关系的深度',p:'你的"关系好"在别人眼中可能被解读为"不够专业"或"只说不做"。你可能没有意识到：当你总是用"改天吃饭"来回避实质问题，别人会逐渐觉得你"不靠谱"；当你为了维持和谐而隐瞒真实意见，别人会认为你"没有立场"。更深层的盲区在于：你可能把"受欢迎"等同于"有影响力"，但真正的影响力不是让所有人喜欢你，而是让关键人物信任你。关系网络庞大但缺乏深度，在硬仗中难以服众。另一个盲区是：你的"热情"可能让某些人感到不适——不是所有人都喜欢高频社交，对于内向型同事来说，你的热情可能是一种压力。此外，你可能高估了自己的人际判断力——"我觉得我们关系很好"可能只是你的主观感受，对方未必有同样的认知。研究显示，社交型沟通者对"关系质量"的自我评估比实际水平平均高出23%。这意味着你以为的"铁哥们"可能只是"熟人"，你以为的"深度信任"可能只是"表面客气"。这种认知偏差让你在关键时刻高估了自己能调动的人脉资源。'},
      {h:'五、成长策略：从受欢迎到被信任',p:'你的成长在于把影响力从"让大家开心"升级为"带大家前进"。第一步：学会在需要的时候说"不"——拒绝不是伤害关系，而是让对方知道你的边界和原则。一个从不拒绝的人，他的"好"没有价值；一个会拒绝的人，他的"好"才珍贵。第二步：在关系中保持原则——"我很重视我们的关系，但这件事我必须坚持我的专业判断"这种表达既维护了关系，又展现了立场。第三步：深化关键关系——与其维护100个浅层关系，不如深耕10个关键关系，让信任有深度。深度关系的标志是：你们可以坦诚讨论分歧，而不用担心关系破裂。第四步：练习"建设性冲突"——在团队中主动提出不同意见，用"我有一个不同视角"来开场，而不是用幽默回避。第五步：把你的社交能力从"润滑剂"升级为"催化剂"——润滑剂只是减少摩擦，催化剂能加速反应。当你既有温度又有边界，你就是不可替代的leader。'},
      {h:'六、场景应对剧本',p:'【负面反馈】"你最近的工作我很关注，有几个地方我们需要聊聊。不是否定你的努力，是想帮你做得更好。具体来说，报告的数据分析部分需要更严谨。我给你几个具体的改进建议，你看怎么样？"【拒绝请求】"我很重视我们的合作，但这个需求超出了我的能力范围。我可以帮你推荐更合适的人选，或者下周我们一起想想替代方案。"【推动变革】"大家信任我，我也信任大家。正因为如此，我必须跟你们说实话——现在的流程效率太低了，我建议我们做以下调整。我知道改变不容易，但如果我们一起努力，一定能做到。"【表达分歧】"我有一个不同的视角，想跟大家分享一下。我不是反对当前方案，而是想补充一个可能被忽略的角度。大家觉得呢？"'},
      {h:'七、30天提升计划',p:'第1-7天：每天在1次对话中练习"先肯定关系，再表达立场"。记录对方的反应——你会发现，有立场的你反而更被尊重。第8-14天：选择1个需要拒绝的请求，用"温柔但坚定"的方式说不。观察拒绝后关系的变化——你会发现，真正的朋友不会因为一次拒绝而离开。第15-21天：给1个下属或同事提供具体的、建设性的负面反馈。使用"肯定+改进+支持"三步法。第22-28天：选择3个关键关系，主动进行1次深度对话（超过30分钟）。不聊八卦，只聊真实想法和感受。第29-30天：复盘30天的关系深度变化，找出从"受欢迎"到"被信任"最有效的做法。将这些做法整理成你的"深度关系指南"，作为未来参考。30天后，你会发现自己不再是那个"谁都认识但谁都不深"的人，而是一个"朋友不多但每个都铁"的连接者。<p style="color:var(--text-secondary);line-height:1.8;font-size:var(--text-sm);margin-top:var(--space-sm)">此外，社交型沟通者要注意"社交倦怠"。频繁的社交互动虽然让你充满活力，但如果没有独处和恢复的时间，你也会感到空虚和疲惫。不要把所有空闲时间都填满社交活动，给自己留一些沉淀和思考的空间。同时，要意识到不是所有关系都需要同等投入——把你的热情分配给真正重要的人，而不是均匀地撒在每一个人身上。深度关系不是通过频繁的点赞和寒暄建立的，而是通过真诚的对话、共同的经历和在困难时刻的陪伴建立的。</p>'},
      {h:'八、常见误区与行动清单',p:'误区一："认识人多就有资源。"真正有价值的不是你认识多少人，而是有多少人愿意在关键时刻支持你。误区二："气氛好就等于合作好。"和谐的氛围不能替代清晰的分工和决策。误区三："我必须随时保持热情。"真实的你比永远热情的你更有吸引力。行动清单：①明天列出5个最重要的职场关系，计划逐一深耕。②本周内进行一次艰难的但必要的对话，不逃避。③本月内减少一次无目的的社交活动，把时间留给自己。④准备一个"深度对话问题清单"，如"你最近在忙什么挑战"。⑤每周留出一小时独处，复盘自己的人际投入产出。当你从"社交广泛"转向"关系深厚"，你的影响力会从表面的热闹变成真正的领导力。从受欢迎到被信任的转型，需要你从根本上重新定义什么叫社交成功。过去你可能习惯于用认识多少人、收到多少点赞、在多少场合成为焦点来衡量自己的社交价值，但真正成熟的社交成功，是在关键时刻有多少人愿意相信你、支持你、为你行动。为了建立这种深度信任，你需要有意识地降低社交的广度频率，提高每一次互动的质量。每周选择一到两个对你真正重要的关键关系，安排一次超过半小时的深度对话。在这些对话中，暂时放下你的幽默、表演和活跃气氛的本能，尝试展现你真实的一面，包括你的困惑、压力、失败的经历，以及你真正严肃的长期目标。当人们看到你不仅会聊天、能活跃气氛，而且能在关键时刻承担责任、解决问题、守护承诺时，真正的信任才会建立。记住，最持久、最有价值的职场关系，往往不是建立在饭局、寒暄和点赞之上，而是建立在共同经历挑战、相互支持解决问题、在困难时刻彼此见证的基础上。深度关系不需要你时刻保持有趣，它只需要你持续地真实和可靠。最后，请把这次深度解析当作一次邀请：邀请你从表面的热闹走向真实的连接。你的人际天赋已经让你在职场中拥有了很多熟人，但接下来，你要做的不是继续扩大名单，而是把名单上的某些人变成真正的伙伴。找一个你信任的人，进行一次深入的对话；在朋友遇到困难时，提供具体的帮助而不是一句客气的安慰；在自己疲惫时，也敢于向别人展示脆弱的一面。真正的关系经得起真实，也只有真实才能带来深度。当你从社交的广度转向关系的深度，你会发现，你的人气不再是浮于表面的热闹，而是沉甸甸的信任和影响力。职场镜像愿意陪你一起，成为一个既受欢迎、又被深深信任的人。'}
    ]
  }
};

/* ===== 深度报告页面 ===== */
function renderDeepReport(){
  if(!state.dominantType){updateState({currentPage:'home'});return}
  var pt=PERSONALITY_TYPES[state.dominantType];
  var report=DEEP_REPORTS[state.dominantType]||DEEP_REPORTS.avoider;
  var sectionsHtml=report.sections.map(function(s,idx){
    return'<div class="report-section deep-report-section scroll-reveal" style="animation-delay:'+(idx*0.05)+'s">'+
      '<div class="report-section-title">'+s.h+'</div>'+
      '<p style="color:var(--text-secondary);line-height:1.8;font-size:var(--text-sm);margin-top:var(--space-sm)">'+s.p+'</p></div>';
  }).join('');
  var wordCount=report.sections.reduce(function(sum,s){return sum+s.p.length+s.h.length},0);
  app.innerHTML=

// 事件绑定：点击"查看演示"按钮播放对话动画
function bindSkillDemoButtons(container){
  var root=container||document;
  var btns=root.querySelectorAll('.skill-demo-btn');
  btns.forEach(function(btn){
    btn.addEventListener('click',function(){
      var targetId=btn.dataset.demoTarget;
      var card=document.getElementById(targetId);
      if(!card)return;
      var badEl=card.querySelector('.skill-demo-bad');
      var goodEl=card.querySelector('.skill-demo-good');
      var tipEl=card.parentElement.querySelector('.skill-demo-tip');
      if(btn.textContent.indexOf('查看演示')!==-1){
        // 播放动画：错误回应淡出 -> 正确回应淡入 -> 技巧提示展开
        btn.disabled=true;
        btn.textContent='演示中...';
        if(badEl){badEl.style.transition='opacity .4s';badEl.style.opacity='0.4';badEl.style.transform='scale(.97)';}
        setTimeout(function(){
          if(goodEl){goodEl.style.display='block';goodEl.style.animation='bubbleIn .5s cubic-bezier(.34,1.56,.64,1) both';}
        },400);
        setTimeout(function(){
          if(tipEl){tipEl.style.display='block';tipEl.style.animation='bubbleIn .4s ease both';}
          btn.textContent='↺ 再看一次';
          btn.disabled=false;
        },900);
      }else{
        // 重置
        if(badEl){badEl.style.opacity='1';badEl.style.transform='scale(1)';}
        if(goodEl){goodEl.style.display='none';}
        if(tipEl){tipEl.style.display='none';}
        btn.textContent='▶ 查看演示';
      }
    });
  });
}
// 事件绑定：点击视频覆盖层播放视频
function bindVideoOverlays(container){
  var root=container||document;
  var overlays=root.querySelectorAll('.scene-video-overlay');
  overlays.forEach(function(overlay){
    if(overlay.dataset.bound==='1')return;
    overlay.dataset.bound='1';
    overlay.addEventListener('click',function(e){
      e.preventDefault();e.stopPropagation();
      var wrapper=overlay.closest('.scene-video-wrapper');
      if(!wrapper)return;
      var video=wrapper.querySelector('video');
      if(!video)return;
      overlay.classList.add('hidden');
      var p=video.play();
      if(p&&typeof p.then==='function'){
        p.catch(function(){overlay.classList.remove('hidden');});
      }
    });
  });
  var videos=root.querySelectorAll('video[data-scene-video]');
  videos.forEach(function(video){
    if(video.dataset.errBound==='1')return;
    video.dataset.errBound='1';
    video.addEventListener('error',function(){
      var w=video.closest('.scene-video-wrapper');
      if(w){var o=w.querySelector('.scene-video-overlay');
        if(o){o.innerHTML='<div style="text-align:center;color:rgba(255,255,255,.85);font-size:13px;padding:16px;line-height:1.5">⚠️ 视频加载失败<br>请检查网络后刷新页面</div>';o.classList.remove('hidden');}
      }
    });
  });
}

/* ----- 雷达图绘制（SVG） ----- */
function _svgContainer(canvas){
  if(!canvas)return null;
  if(canvas.tagName==='CANVAS'){
    if(canvas._svgContainer)return canvas._svgContainer;
    var w=canvas.width,h=canvas.height;
    var div=document.createElement('div');
    div.style.cssText='width:'+w+'px;height:'+h+'px;overflow:hidden;';
    div.setAttribute('data-svg-chart','true');
    if(canvas.parentNode)canvas.parentNode.replaceChild(div,canvas);
    canvas._svgContainer=div;
    return div;
  }
  if(canvas.getAttribute&&canvas.getAttribute('data-svg-chart')==='true')return canvas;
  return null;
}
function renderRadarChart(canvas,scores,opt){
  opt=opt||{};
  var container=_svgContainer(canvas);
  if(!container)return;
  var w=parseInt(container.style.width,10)||canvas.width||280;
  var h=parseInt(container.style.height,10)||canvas.height||280;
  var cx=w/2,cy=h/2;
  var radius=Math.max(10,Math.min(w,h)/2-(opt.padding||30));
  var types=['avoider','fighter','pleaser','analyst','social'];
  var typeLabels=['冲突处理','沟通表达','情绪管理','边界建立','协作能力'];
  var n=types.length;
  var max=0;types.forEach(function(t){max=Math.max(max,scores[t]||0)});
  if(max===0)max=1;
  var gridLines='';
  for(var lv=1;lv<=5;lv++){
    var pts=[];for(var i=0;i<=n;i++){var a=(Math.PI*2*i/n)-Math.PI/2;var r=radius*lv/5;pts.push((i===0?'M':'L')+(cx+Math.cos(a)*r).toFixed(1)+' '+(cy+Math.sin(a)*r).toFixed(1));}
    gridLines+='<path d="'+pts.join(' ')+'" fill="none" stroke="rgba(255,255,255,'+(lv===5?'0.1':'0.06')+')" stroke-width="1"/>';
  }
  var axisLines='';
  for(var i=0;i<n;i++){var a=(Math.PI*2*i/n)-Math.PI/2;axisLines+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(a)*radius).toFixed(1)+'" y2="'+(cy+Math.sin(a)*radius).toFixed(1)+'" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>';}
  var dataPts=[];for(var i=0;i<n;i++){var a=(Math.PI*2*i/n)-Math.PI/2;var v=(scores[types[i]]||0)/max;var r=radius*v;dataPts.push((cx+Math.cos(a)*r).toFixed(1)+','+(cy+Math.sin(a)*r).toFixed(1));}
  var polygon='<polygon points="'+dataPts.join(' ')+'" fill="rgba(124,92,252,0.15)" stroke="#7c5cfc" stroke-width="2" stroke-linejoin="round"/>';
  var markers='';for(var i=0;i<n;i++){var a=(Math.PI*2*i/n)-Math.PI/2;var v=(scores[types[i]]||0)/max;var r=radius*v;markers+='<circle cx="'+(cx+Math.cos(a)*r).toFixed(1)+'" cy="'+(cy+Math.sin(a)*r).toFixed(1)+'" r="4" fill="'+PERSONALITY_TYPES[types[i]].color+'"/>';}
  var gridLabels='';for(var lv=1;lv<=5;lv++){gridLabels+='<text x="'+(cx+2).toFixed(1)+'" y="'+(cy-radius*lv/5+4).toFixed(1)+'" text-anchor="start" fill="rgba(255,255,255,0.2)" font-size="8" font-family="Outfit,sans-serif">'+(lv*20)+'%</text>';}
  var labels='';
  if(!opt.noLabels){
    for(var i=0;i<n;i++){var a=(Math.PI*2*i/n)-Math.PI/2;var lr=radius+18;var x=cx+Math.cos(a)*lr,y=cy+Math.sin(a)*lr;labels+='<text x="'+x.toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" fill="'+PERSONALITY_TYPES[types[i]].color+'" font-size="11" font-family="Outfit,sans-serif">'+PERSONALITY_TYPES[types[i]].icon+'</text><text x="'+x.toFixed(1)+'" y="'+(y+7).toFixed(1)+'" text-anchor="middle" fill="#c4c8d8" font-size="11" font-family="Outfit,sans-serif">'+PERSONALITY_TYPES[types[i]].name+'</text>';}
  }
  var legend='';
  if(!opt.noLabels){
    legend='<g transform="translate('+(w-122)+','+(h-90)+')"><rect x="0" y="0" width="114" height="'+(n*16+10)+'" rx="4" fill="rgba(15,20,37,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>';
    for(var i=0;i<n;i++){legend+='<rect x="6" y="'+(8+i*16)+'" width="8" height="8" rx="2" fill="'+PERSONALITY_TYPES[types[i]].color+'"/><text x="20" y="'+(15+i*16)+'" fill="#c4c8d8" font-size="9" font-family="Outfit,sans-serif">'+typeLabels[i]+'</text>';}
    legend+='</g>';
  }
  container.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="人格雷达图：展示五种人格类型得分">'+gridLines+axisLines+gridLabels+polygon+markers+labels+legend+'</svg>';
  return container;
}

function renderTrendChart(canvas,history){
  var container=_svgContainer(canvas);
  if(!container)return;
  var w=parseInt(container.style.width,10)||canvas.width||320;
  var h=parseInt(container.style.height,10)||canvas.height||140;
  if(!history||history.length<1){container.innerHTML='';return;}
  var pad=30,padBottom=25,padTop=15,padRight=20;
  var maxScore=10;
  var plotW=w-pad-padRight;
  var plotH=h-padBottom-padTop;
  var sum=0;history.forEach(function(e){sum+=e.avg});
  var overallAvg=history.length>0?sum/history.length:0;
  // Y-axis grid lines
  var yGrid='';
  for(var yv=0;yv<=maxScore;yv+=2){
    var gy=h-padBottom-(yv/maxScore)*plotH;

  // Area fill (close path)

function renderComparisonRadar(canvas,before,after){
  var container=_svgContainer(canvas);
  if(!container)return;
  var w=parseInt(container.style.width,10)||canvas.width||280;
  var h=parseInt(container.style.height,10)||canvas.height||280;
  var cx=w/2,cy=h/2;
  var radius=Math.min(w,h)/2-30;
  var types=['avoider','fighter','pleaser','analyst','social'];
  var typeLabels=['冲突处理','沟通表达','情绪管理','边界建立','协作能力'];
  var n=types.length;
  // Grid lines
  var gridLines='';
  for(var lv=1;lv<=5;lv++){
    var pts=[];for(var i=0;i<=n;i++){var a=(Math.PI*2*i/n)-Math.PI/2;var r=radius*lv/5;pts.push((i===0?'M':'L')+(cx+Math.cos(a)*r).toFixed(1)+' '+(cy+Math.sin(a)*r).toFixed(1));}
    gridLines+='<path d="'+pts.join(' ')+'" fill="none" stroke="rgba(255,255,255,'+(lv===5?'0.1':'0.06')+')" stroke-width="1"/>';
  }
  var axisLines='';
  for(var i=0;i<n;i++){var a=(Math.PI*2*i/n)-Math.PI/2;axisLines+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(a)*radius).toFixed(1)+'" y2="'+(cy+Math.sin(a)*radius).toFixed(1)+'" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>';}
  function polySvg(scores,color,fill,isDashed,sharedMax){
    var max=sharedMax||1;
    var pts=[];for(var i=0;i<n;i++){var a=(Math.PI*2*i/n)-Math.PI/2;var v=(scores[types[i]]||0)/max;var r=radius*v;pts.push((cx+Math.cos(a)*r).toFixed(1)+','+(cy+Math.sin(a)*r).toFixed(1));}
    var dash=isDashed?' stroke-dasharray="4,4"':'';
    return '<polygon points="'+pts.join(' ')+'" fill="'+fill+'" stroke="'+color+'" stroke-width="2" stroke-linejoin="round"'+dash+'/>';
  }
  var sharedMax=0;types.forEach(function(t){sharedMax=Math.max(sharedMax,before[t]||0,after[t]||0)});if(sharedMax===0)sharedMax=1;
  var beforePoly=polySvg(before,'#6b7094','rgba(107,112,148,0.1)',true,sharedMax);
  var afterPoly=polySvg(after,'#7c5cfc','rgba(124,92,252,0.15)',false,sharedMax);
  var labels='';
  for(var i=0;i<n;i++){var a=(Math.PI*2*i/n)-Math.PI/2;var lr=radius+18;var x=cx+Math.cos(a)*lr,y=cy+Math.sin(a)*lr;labels+='<text x="'+x.toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" fill="'+PERSONALITY_TYPES[types[i]].color+'" font-size="11" font-family="Outfit,sans-serif">'+PERSONALITY_TYPES[types[i]].icon+'</text><text x="'+x.toFixed(1)+'" y="'+(y+7).toFixed(1)+'" text-anchor="middle" fill="#c4c8d8" font-size="11" font-family="Outfit,sans-serif">'+PERSONALITY_TYPES[types[i]].name+'</text>';}
  // Legend
  var legend='<g transform="translate('+(w-122)+','+(h-28)+')"><rect x="0" y="0" width="114" height="22" rx="4" fill="rgba(15,20,37,0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>'+
    '<line x1="6" y1="7" x2="22" y2="7" stroke="#6b7094" stroke-width="2" stroke-dasharray="4,4"/><text x="28" y="10" fill="#6b7094" font-size="9" font-family="Outfit,sans-serif">训练前</text>'+
    '<line x1="62" y1="7" x2="78" y2="7" stroke="#7c5cfc" stroke-width="2"/><text x="84" y="10" fill="#7c5cfc" font-size="9" font-family="Outfit,sans-serif">训练后</text></g>';
  container.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="训练前后对比雷达图：虚线为训练前，实线为训练后">'+gridLines+axisLines+beforePoly+afterPoly+labels+legend+'</svg>';
}
var particleRAF=null;
var particleResizeHandler=null;
function initParticles(){
  var c=document.getElementById('particle-canvas');if(!c)return;
  if(particleRAF){cancelAnimationFrame(particleRAF);particleRAF=null;}
  if(particleResizeHandler){window.removeEventListener('resize',particleResizeHandler);particleResizeHandler=null;}
  var ctx=c.getContext('2d');var w,h;function resize(){w=c.width=c.offsetWidth;h=c.height=c.offsetHeight;}resize();
  particleResizeHandler=resize;
  window.addEventListener('resize',particleResizeHandler,{passive:true});
  var pType=state.dominantType||'analyst';
  // 人格类型粒子配置
  var pConfig={
    avoider:{color:'rgba(99,102,241,',shape:'circle',speed:0.15,size:2,count:50,rise:true},
    fighter:{color:'rgba(244,63,94,',shape:'triangle',speed:0.8,size:3,count:35,rise:false},
    pleaser:{color:'rgba(245,158,11,',shape:'circle',speed:0.25,size:2.5,count:45,wave:true},
    analyst:{color:'rgba(6,182,212,',shape:'square',speed:0.1,size:3,count:30,grid:true},
    social:{color:'rgba(16,185,129,',shape:'diamond',speed:0.4,size:2.5,count:40,rotate:true}
  };
  var cfg=pConfig[pType]||pConfig.analyst;
  var particles=[];
  for(var i=0;i<cfg.count;i++){
    var p={x:Math.random()*w,y:Math.random()*h,r:cfg.size*(Math.random()*0.5+0.75),shape:cfg.shape,
      vx:cfg.grid?0:(Math.random()-0.5)*cfg.speed*2,
      vy:cfg.rise?-Math.random()*cfg.speed*2:(Math.random()-0.5)*cfg.speed*2,
      o:Math.random()*0.5+0.15,phase:Math.random()*Math.PI*2,rot:Math.random()*Math.PI*2,
      rv:cfg.rotate?(Math.random()-0.5)*0.02:0,origX:cfg.grid?0:0,origY:cfg.grid?0:0};
    if(cfg.grid){p.origX=Math.round(Math.random()*Math.floor(w/50))*50+25;p.origY=Math.round(Math.random()*Math.floor(h/50))*50+25;p.x=p.origX;p.y=p.origY;}
    if(cfg.wave){p.origX=p.x;p.origY=p.y;p.amp=Math.random()*20+10;p.freq=Math.random()*0.02+0.01;}
    particles.push(p);
  }
  function drawShape(ctx,p){
    ctx.beginPath();
    if(p.shape==='circle'){ctx.arc(p.x,p.y,p.r,0,Math.PI*2);}
    else if(p.shape==='triangle'){var s=p.r*1.5;ctx.moveTo(p.x,p.y-s);ctx.lineTo(p.x+s*0.866,p.y+s*0.5);ctx.lineTo(p.x-s*0.866,p.y+s*0.5);ctx.closePath();}
    else if(p.shape==='square'){ctx.rect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);}
    else if(p.shape==='diamond'){ctx.moveTo(p.x,p.y-p.r*1.3);ctx.lineTo(p.x+p.r*1.3,p.y);ctx.lineTo(p.x,p.y+p.r*1.3);ctx.lineTo(p.x-p.r*1.3,p.y);ctx.closePath();}
    ctx.fillStyle=cfg.color+p.o+')';ctx.fill();
  }
  function loop(){
    if(!document.body.contains(c)){cancelAnimationFrame(particleRAF);particleRAF=null;return;}
    ctx.clearRect(0,0,w,h);
    var pType=state.dominantType||'analyst';
    cfg=pConfig[pType]||pConfig.analyst;
    particles.forEach(function(p,i){
      p.shape=cfg.shape;
      if(cfg.rise){
        p.y-=cfg.speed*(0.5+0.5*(p.r/cfg.size));
        p.x+=Math.sin(p.phase+i*0.3)*0.2;
        if(p.y<-10){p.y=h+10;p.x=Math.random()*w;}
      }else if(cfg.grid){
        var t=Date.now()*0.001;
        p.x=p.origX+Math.sin(t+p.phase)*3;
        p.y=p.origY+Math.cos(t+p.phase)*3;
        p.o=0.15+Math.sin(t+p.phase)*0.1;
      }else if(cfg.wave){
        p.x=p.origX+Math.sin(Date.now()*p.freq+p.phase)*p.amp;
        p.y=p.origY+Math.cos(Date.now()*p.freq*0.7+p.phase)*p.amp*0.6;
      }else{
        p.x+=p.vx;p.y+=p.vy;
        if(p.x<0||p.x>w)p.vx*=-1;
        if(p.y<0||p.y>h)p.vy*=-1;
      }
      if(cfg.rotate){p.rot+=p.rv;}
      drawShape(ctx,p);
    });
    // 连线（仅对于非网格类型）
    if(!cfg.grid){
      for(var i=0;i<particles.length;i++){
        for(var j=i+1;j<particles.length;j++){
          var dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,d=Math.sqrt(dx*dx+dy*dy);
          if(d<80){
            ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);
            ctx.strokeStyle=cfg.color+(0.05*(1-d/80))+')';ctx.stroke();
          }
        }
      }
    }
    particleRAF=requestAnimationFrame(loop);
  }
  loop();
}

var _modalCallback=null;
function showConfirm(message,onConfirm){
  var existing=document.getElementById('confirmModal');
  if(existing)existing.remove();
  _modalCallback=onConfirm;
  var overlay=document.createElement('div');
  overlay.id='confirmModal';
  overlay.className='modal-overlay';
  overlay.innerHTML='<div class="modal-card"><div class="modal-icon">⚠️</div><div class="modal-message">'+message+'</div><div class="modal-actions"><button class="btn-secondary" data-modal="cancel">取消</button><button class="btn-primary" data-modal="confirm">确认</button></div></div>';
  document.body.appendChild(overlay);
  requestAnimationFrame(function(){overlay.classList.add('modal-visible')});
  overlay.addEventListener('click',function(e){
    var action=e.target.getAttribute('data-modal');
    if(action==='confirm'){var cb=_modalCallback;_modalCallback=null;closeModal();if(cb)cb()}
    else if(action==='cancel'||e.target===overlay){_modalCallback=null;closeModal()}
  });
  overlay.tabIndex=-1;overlay.focus();
  overlay.addEventListener('keydown',function(e){
    if(e.key==='Escape'){_modalCallback=null;closeModal()}
    else if(e.key==='Enter'){var cb=_modalCallback;_modalCallback=null;closeModal();if(cb)cb()}
  });
}

  state.testDialogStep++;
  var nextImage=null;
  if(state.testDialogStep>=scenario.rounds.length){
    state.testStep++;
    state.testDialogStep=0;
    state.testDialogHistory=[];
    if(state.testStep>=TEST_SCENARIOS.length){
      state.currentPage='loading';saveToLocalStorage();render();return false;
    }
    var next=TEST_SCENARIOS[state.testStep];
    nextImage=(next.rounds[0].roundImages&&next.rounds[0].roundImages[0])||next.image;
    state.testDialogHistory.push({role:'ai',speaker:next.rounds[0].aiName,text:next.rounds[0].aiMessage});
  }else{
    var nextRound=scenario.rounds[state.testDialogStep];
    nextImage=(nextRound.roundImages&&nextRound.roundImages[0])||scenario.image;
    state.testDialogHistory.push({role:'ai',speaker:nextRound.aiName,text:nextRound.aiMessage});
  }
  showTestThinking(function(){
    hideTestThinking();
    switchSceneImage(nextImage);
    saveToLocalStorage();render();
  });
  return true;
}
function handleSelectOption(idx){
  var scenario=TEST_SCENARIOS[state.testStep];
  if(!scenario)return;
  var round=scenario.rounds[state.testDialogStep];
  if(!round||!round.options[idx])return;
  var opt=round.options[idx];
  // Disable options during feedback to prevent double clicks
  document.querySelectorAll('[data-action="select-option"]').forEach(function(el){el.disabled=true;el.style.pointerEvents='none';});
  // Show option feedback image first
  showOptionFeedback(opt.sceneImage,opt.optionImage,opt.text,opt.type,function(){
    state.testAnswers.push({scenario:scenario.id,round:state.testDialogStep,choice:idx,text:opt.text,scores:optionScores(opt.type)});
    state.testDialogHistory.push({role:'user',text:opt.text});
    advanceTestStep(scenario);
  });
}
function freeInputScores(text,freeKeywords){
  var input=text.toLowerCase().trim();
  var s={avoider:0,fighter:0,pleaser:0,analyst:0,social:0};
  if(!freeKeywords)return s;
  var bestType=null,bestCount=0;
  Object.keys(freeKeywords).forEach(function(type){
    var patterns=freeKeywords[type].split('|');
    var count=0;
    patterns.forEach(function(p){if(p&&input.indexOf(p.toLowerCase())!==-1)count++});
    if(count>bestCount){bestCount=count;bestType=type}
  });
  if(bestType&&bestCount>0){s[bestType]=3}
  return s;
}
function handleFreeInput(text){
  if(text.length>500){showToast('回复过长，请精简到500字以内');return;}
  var scenario=TEST_SCENARIOS[state.testStep];
  if(!scenario)return;
  var round=scenario.rounds[state.testDialogStep];
  var scores=freeInputScores(text,round.freeKeywords);
  state.testAnswers.push({scenario:scenario.id,round:state.testDialogStep,choice:-1,text:text,scores:scores});
  state.testDialogHistory.push({role:'user',text:text});
  advanceTestStep(scenario);
}
function handleUndoTest(){
  if(state.testAnswers.length===0)return;
  var removed=state.testAnswers.pop();
  // 同步对话历史
  if(state.testDialogHistory.length>0){
    // 找到最后一个用户消息并移除，以及其后的AI消息
    var lastIdx=state.testDialogHistory.length-1;
    while(lastIdx>=0&&state.testDialogHistory[lastIdx].role==='ai'){
      state.testDialogHistory.pop();lastIdx--;
    }
    if(lastIdx>=0&&state.testDialogHistory[lastIdx].role==='user'){
      state.testDialogHistory.pop();
    }
  }
  // 回退步骤
  if(state.testDialogStep>0){
    state.testDialogStep--;
  }else if(state.testStep>0){
    state.testStep--;
    var prevScenario=TEST_SCENARIOS[state.testStep];
    state.testDialogStep=prevScenario.rounds.length-1;
    // 重建对话历史
    state.testDialogHistory=[];
    for(var i=0;i<prevScenario.rounds.length;i++){
      state.testDialogHistory.push({role:'ai',speaker:prevScenario.rounds[i].aiName,text:prevScenario.rounds[i].aiMessage});
      if(i<state.testDialogStep){
        // 找到对应的答案
        var ans=state.testAnswers.filter(function(a){return a.scenario===prevScenario.id&&a.round===i})[0];
        if(ans)state.testDialogHistory.push({role:'user',text:ans.text});
      }
    }
  }
  saveToLocalStorage();render();
}
function handleStartTrain(sceneId){
  state.trainScene=sceneId;state.trainDialogHistory=[];state.trainCurrentRound=0;
  if(!state.trainScores[sceneId])state.trainScores[sceneId]=[];
  // 记录训练前雷达图（首次训练该场景时）
  if(!state.preTrainScores&&state.personalityScores)state.preTrainScores=JSON.parse(JSON.stringify(state.personalityScores));
  var scene=TRAIN_SCENARIOS[sceneId];
  state.trainDialogHistory.push({role:'ai',text:scene.rounds[0].aiMessage});
  saveToLocalStorage();render();
}
function handleTrainInput(text){
  if(text.length>500){showToast('回复过长，请精简到500字以内');return;}
  var scene=TRAIN_SCENARIOS[state.trainScene];
  if(!scene||state.isTrainAnalyzing)return;
  if(state.trainCurrentRound>=scene.rounds.length)return;
  state.isTrainAnalyzing=true;
  // 显示 AI 分析中
  state.trainDialogHistory.push({role:'analysis'});
  renderTrainDialog();
  setTimeout(function(){
    state.isTrainAnalyzing=false;
    // 移除 analysis
    state.trainDialogHistory=state.trainDialogHistory.filter(function(m){return m.role!=='analysis'});
    var result=scoreReply(text,state.trainScene,state.trainCurrentRound);
    state.trainDialogHistory.push({role:'user',text:text});
    var round=scene.rounds[state.trainCurrentRound];
    var followUp='继续努力！';
    if(round&&round.betterHint){
      if(result.score>=8){
        followUp='👍 做得很好！'+round.coachFollowUp.high;
      }else{
        followUp='💡 改进建议：'+round.betterHint;
      }
    }
    state.trainDialogHistory.push({role:'score',score:result.score,feedback:result.feedback,coachNote:result.coachNote,dimensions:result.dimensions});
    state.trainDialogHistory.push({role:'coach',text:followUp});
    if(!state.trainScores[state.trainScene])state.trainScores[state.trainScene]=[];
    state.trainScores[state.trainScene].push(result.score);
    if(result.score>state.bestTrainScore)state.bestTrainScore=result.score;
    // EXP 与技能等级
    var expGain=Math.max(5,Math.round(result.score*2));
    showExpPopup('+'+expGain+' EXP');
    var currentLv=state.skillLevels[state.trainScene]||1;
    var totalExp=(state.trainScores[state.trainScene].length-1)*20+expGain;
    var newLv=Math.min(5,1+Math.floor(totalExp/40));
    if(newLv>currentLv){
      state.skillLevels[state.trainScene]=newLv;
    }
    state.trainCurrentRound++;
    if(state.trainCurrentRound<scene.rounds.length){
      var nextRound=scene.rounds[state.trainCurrentRound];
      state.trainDialogHistory.push({role:'ai',text:nextRound.aiMessage});
    }else{
      if(state.trainCompleted.indexOf(state.trainScene)===-1)state.trainCompleted.push(state.trainScene);
    }
    saveToLocalStorage();render();
  },ANIM.TRAIN_ANALYSIS_DELAY);
}
/* Canvas 2D 迷你雷达图（仅用于分享卡下载） */
function _renderRadarMiniCanvas(canvas,scores){
  var ctx=canvas.getContext('2d');
  var w=canvas.width,h=canvas.height,cx=w/2,cy=h/2;
  var radius=Math.max(10,Math.min(w,h)/2-20);
  var types=['avoider','fighter','pleaser','analyst','social'];
  var n=types.length;
  ctx.clearRect(0,0,w,h);
  for(var lv=1;lv<=4;lv++){
    ctx.beginPath();
    for(var i=0;i<=n;i++){
      var a=(Math.PI*2*i/n)-Math.PI/2;
      var r=radius*lv/4;
      var x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.stroke();
  }
  var max=0;types.forEach(function(t){max=Math.max(max,scores[t]||0)});
  if(max===0)max=1;
  ctx.beginPath();
  for(var i=0;i<n;i++){
    var a=(Math.PI*2*i/n)-Math.PI/2;
    var v=(scores[types[i]]||0)/max;
    var r=radius*v;
    var x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle='rgba(124,92,252,0.15)';ctx.fill();
  ctx.strokeStyle='#7c5cfc';ctx.lineWidth=2;ctx.stroke();
  for(var i=0;i<n;i++){
    var a=(Math.PI*2*i/n)-Math.PI/2;
    var v=(scores[types[i]]||0)/max;
    var r=radius*v;
    var x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fillStyle=PERSONALITY_TYPES[types[i]].color;ctx.fill();
  }
}
function downloadShareCard(){
  var card=document.querySelector('.share-card');
  if(!card){showToast('分享卡不存在');return}
  var rect=card.getBoundingClientRect();
  var scale=2;

  canvas.height=Math.max(1,Math.round(rect.height*scale));
  var ctx=canvas.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle='#0f1425';
  ctx.fillRect(0,0,rect.width,rect.height);
  var content=card.querySelector('.share-card-content');
  if(!content)return;
  ctx.textAlign='center';
  ctx.fillStyle='#c4c8d8';
  ctx.font='10px Outfit,sans-serif';

  if(logo)ctx.fillText(logo.textContent,rect.width/2,30);
  var typeEl=content.querySelector('.share-card-type');
  if(typeEl){ctx.font='40px sans-serif';ctx.fillText(typeEl.textContent,rect.width/2,80);}
  var nameEl=content.querySelector('.share-card-name');
  if(nameEl){ctx.fillStyle='#eef0f8';ctx.font='bold 22px Outfit,sans-serif';ctx.fillText(nameEl.textContent,rect.width/2,120);}

  link.href=canvas.toDataURL('image/png');
  link.click();
}
function generatePersonalityTotem(scores){
  var types=['avoider','fighter','pleaser','analyst','social'];
  var colors=types.map(function(t){return PERSONALITY_TYPES[t].color;});
  var max=0;types.forEach(function(t){max=Math.max(max,scores[t]||0)});if(max===0)max=1;
  var cx=64,cy=64,R=50;
  var points=types.map(function(t,i){
    var angle=(Math.PI*2*i/5)-Math.PI/2;
    var r=R*((scores[t]||0)/max);
    return [cx+Math.cos(angle)*r,cy+Math.sin(angle)*r];
  });
  var d='M'+points[0][0]+' '+points[0][1];
  for(var i=1;i<points.length;i++)d+=' L'+points[i][0]+' '+points[i][1];
  d+=' Z';
  var circles=points.map(function(p,i){
    return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="'+colors[i]+'"/>';
  }).join('');
  var labels=types.map(function(t,i){
    var angle=(Math.PI*2*i/5)-Math.PI/2;
    var lx=cx+Math.cos(angle)*(R+10),ly=cy+Math.sin(angle)*(R+10);
    return '<text x="'+lx+'" y="'+ly+'" fill="'+colors[i]+'" font-size="6" text-anchor="middle" dominant-baseline="middle">'+PERSONALITY_TYPES[t].icon+'</text>';
  }).join('');
  return '<svg viewBox="0 0 128 128" width="100%" height="100%" role="img" aria-label="人格图腾：五维人格分布可视化">'+
    '<defs><radialGradient id="totemGrad" cx="50%" cy="50%"><stop offset="0%" stop-color="rgba(124,92,252,0.3)"/><stop offset="100%" stop-color="rgba(124,92,252,0.05)"/></radialGradient></defs>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="url(#totemGrad)" stroke="rgba(124,92,252,0.2)" stroke-width="1"/>'+
    '<path d="'+d+'" fill="rgba(124,92,252,0.2)" stroke="#7c5cfc" stroke-width="2" stroke-linejoin="round"/>'+
    circles+labels+'</svg>';
}
function handleBackToTrainSelect(){
  state.trainScene=null;state.trainDialogHistory=[];state.trainCurrentRound=0;
  saveToLocalStorage();render();
}
function handleRetakeTest(){
  showConfirm('确定重新测试吗？当前测试结果将保留在历史记录中。',function(){
    resetState(true);
    state.currentPage='test';state.testStep=0;state.testDialogStep=0;
    state.testDialogHistory=[{role:'ai',speaker:TEST_SCENARIOS[0].rounds[0].aiName,text:TEST_SCENARIOS[0].rounds[0].aiMessage}];

  });
}
function handleNavigate(page){
  if(page==='home'){
    // 返回首页时重置测试/训练进行中状态，但保留历史数据
    state.testStep=0;
    state.testDialogStep=0;
    state.testAnswers=[];
    state.testDialogHistory=[];
    state.trainScene=null;
    state.trainCurrentRound=0;
    state.trainDialogHistory=[];
  }
  state.currentPage=page;saveToLocalStorage();render()
}

/* ============================================================
   BLOCK 6: ANIM — 动画效果
   ============================================================ */
function animateRadarChart(canvas,scores){
  if(window._prefersReducedMotion){renderRadarChart(canvas,scores);return;}
  if(canvas._radarRAF){cancelAnimationFrame(canvas._radarRAF);}
  var progress=0;
  var lastTime=0;
  var animatedScores={avoider:0,fighter:0,pleaser:0,analyst:0,social:0};
  var duration=600;
  function step(timestamp){
    if(!lastTime)lastTime=timestamp;
    var delta=timestamp-lastTime;
    lastTime=timestamp;
    progress+=delta/duration;
    if(progress>=1){
      renderRadarChart(canvas,scores);
      canvas._radarRAF=null;
      return;
    }
    var eased=1-Math.pow(1-progress,3);
    Object.keys(scores).forEach(function(k){animatedScores[k]=scores[k]*eased});
    renderRadarChart(canvas,animatedScores);
    canvas._radarRAF=requestAnimationFrame(step);
  }
  canvas._radarRAF=requestAnimationFrame(step);
}
function typeWriter(element,text,speed,callback){
  if(window._prefersReducedMotion){element.textContent=text;if(callback)callback();return;}
  if(element._typeTimer){clearTimeout(element._typeTimer);}
  speed=speed||30;
  var i=0;
  element.textContent='';
  element.classList.add('typing-cursor');
  function type(){
    if(i<text.length){
      element.textContent+=text.charAt(i);
      i++;
      element._typeTimer=setTimeout(type,speed);
    }else{
      element._typeTimer=null;
      element.classList.remove('typing-cursor');
      if(callback)callback();
    }
  }
  type();
}
