<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDA 学习工坊</title>
  <style>
    :root {
      --bg: #050d14;
      --panel: rgba(8, 18, 30, 0.9);
      --panel-2: rgba(12, 24, 40, 0.85);
      --text: #e0ecf8;
      --text-soft: #b8d4ee;
      --text-dim: #a8c0da;
      --muted: #6a84a5;
      --brand: #3af0d0;
      --brand-2: #c084fc;
      --brand-glow: rgba(58, 240, 208, 0.3);
      --ok: #3af0d0;
      --ok-glow: rgba(58, 240, 208, 0.3);
      --warn: #fbbf24;
      --bad: #fb7185;
      --line: rgba(255, 255, 255, 0.06);
      --line-strong: rgba(58, 240, 208, 0.16);
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.46);
      --shadow-sm: 0 10px 28px rgba(0, 0, 0, 0.24);
      --radius: 18px;
      --radius-sm: 12px;
      --mono: "JetBrains Mono", "SF Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
    }

    body.light {
      --bg: #f6f9fc;
      --panel: rgba(255, 255, 255, 0.9);
      --panel-2: rgba(248, 252, 255, 0.9);
      --text: #0c1b2e;
      --text-soft: #31506d;
      --text-dim: #3b5068;
      --muted: #5e7a9a;
      --brand: #0d9488;
      --brand-2: #7c3aed;
      --brand-glow: rgba(13, 148, 136, 0.18);
      --ok: #0d9488;
      --ok-glow: rgba(13, 148, 136, 0.18);
      --warn: #b45309;
      --bad: #db2777;
      --line: rgba(12, 27, 46, 0.07);
      --line-strong: rgba(13, 148, 136, 0.14);
      --shadow: 0 16px 48px rgba(12, 27, 46, 0.1);
      --shadow-sm: 0 2px 12px rgba(12, 27, 46, 0.06);
    }

    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes tracePulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.7; } }
    @keyframes ledPulse { 0%,100% { box-shadow: 0 0 4px var(--brand); } 50% { box-shadow: 0 0 16px var(--brand), 0 0 32px var(--brand-glow); } }
    @keyframes slideOut { from { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); } to { opacity: 0; transform: translateX(-90px) scale(0.94); filter: blur(6px); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(90px) scale(0.94); filter: blur(6px); } to { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); } }
    @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100vh); } }
    @keyframes overlayIn { from { opacity: 0; backdrop-filter: blur(0px); } to { opacity: 1; backdrop-filter: blur(14px); } }
    @keyframes overlayOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes routeBar { 0% { transform: scaleX(0); transform-origin: left; } 50% { transform: scaleX(1); transform-origin: left; } 50.01% { transform-origin: right; } 100% { transform: scaleX(0); transform-origin: right; } }
    @keyframes breadcrumbFlash { 0% { background: rgba(58,240,208,0.32); border-color: var(--brand); } 100% { background: transparent; border-color: var(--line); } }
    @keyframes ripple { from { transform: scale(0); opacity: 0.6; } to { transform: scale(2.5); opacity: 0; } }
    @keyframes cardIn { 0% { opacity: 0; transform: translateY(20px) scale(0.92); } 60% { opacity: 1; transform: translateY(-4px) scale(1.02); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes urlGlow { 0% { text-shadow: 0 0 0 transparent, 0 0 0 transparent; } 50% { text-shadow: 0 0 18px var(--brand), 0 0 36px var(--brand-2); } 100% { text-shadow: 0 0 0 transparent, 0 0 0 transparent; } }
    @keyframes arrowSlide { 0% { transform: translateX(-12px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateX(12px); opacity: 0; } }
    @keyframes pulseDot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.6; } }
    @keyframes shellEnter { 0% { opacity: 0; transform: translateY(28px) scale(0.985); filter: blur(4px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
    @keyframes heroTitleEnter { 0% { opacity: 0; transform: translateX(-40px); letter-spacing: -0.05em; } 100% { opacity: 1; transform: translateX(0); letter-spacing: -0.02em; } }
    #moduleShell { position: relative; }
    #moduleShell.shell-enter > * { animation: shellEnter 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; }
    #moduleShell.shell-enter > *:nth-child(1) .hero-title { animation: heroTitleEnter 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both; }

    .page-exit { animation: slideOut 0.32s cubic-bezier(0.4, 0, 1, 1) forwards; }
    .page-enter { animation: slideIn 0.42s cubic-bezier(0, 0, 0.2, 1) forwards; }
    body.page-switching { pointer-events: none; }

    /* ── Route transition overlay (full-screen) ── */
    .route-overlay {
      position: fixed; inset: 0; z-index: 999;
      display: grid; place-items: center;
      background: rgba(5, 13, 20, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: overlayIn 0.22s ease-out forwards;
    }
    body.light .route-overlay { background: rgba(246, 249, 252, 0.94); }
    .route-overlay.hide { animation: overlayOut 0.22s ease-in forwards; }
    .route-card {
      position: relative; overflow: hidden;
      padding: 32px 44px; border: 1px solid var(--line-strong);
      border-radius: var(--radius); background: var(--panel);
      text-align: center; min-width: 360px; max-width: 480px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.65), 0 0 0 1px rgba(58,240,208,0.15);
      animation: cardIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .route-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--brand), transparent);
    }
    .route-card::after {
      content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--brand-2), transparent);
    }
    .route-card-label { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 14px; font-family: var(--mono); }
    .route-card-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 12px; }
    .route-card-from { color: var(--muted); font-size: 14px; font-family: var(--mono); padding: 4px 10px; border: 1px dashed var(--line); border-radius: var(--radius-sm); }
    .route-card-arrow { color: var(--brand); font-size: 18px; position: relative; }
    .route-card-arrow::before { content: "→"; animation: arrowSlide 1s ease-in-out infinite; display: inline-block; }
    .route-card-url { color: var(--brand); font-size: 22px; font-weight: 800; font-family: var(--mono); letter-spacing: 0.04em; padding: 6px 14px; border: 1px solid var(--brand); border-radius: var(--radius-sm); background: rgba(58,240,208,0.08); animation: urlGlow 1.2s ease-in-out infinite; }
    .route-card-title { color: var(--text); font-size: 18px; font-weight: 700; margin: 6px 0 14px; }
    .route-card-meta { color: var(--muted); font-size: 12px; font-family: var(--mono); margin-bottom: 14px; }
    .route-spinner { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .route-spinner span { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); animation: pulseDot 1.1s ease-in-out infinite; }
    .route-spinner span:nth-child(2) { animation-delay: 0.15s; }
    .route-spinner span:nth-child(3) { animation-delay: 0.3s; }
    .route-progress-bar { height: 2px; margin-top: 14px; background: rgba(255,255,255,0.08); border-radius: 1px; overflow: hidden; }
    .route-progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--brand), var(--brand-2)); animation: routeBar 0.7s ease-in-out forwards; }

    /* ── Top route bar (fixed under header area) ── */
    .route-bar {
      position: fixed; top: 0; left: 292px; right: 0; height: 2px;
      background: rgba(255,255,255,0.05); z-index: 50; pointer-events: none;
    }
    .route-bar > div { height: 100%; width: 100%; background: linear-gradient(90deg, transparent, var(--brand), var(--brand-2), transparent); transform: scaleX(0); }
    .route-bar.active > div { animation: routeBar 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

    /* ── Breadcrumb (top of content area) ── */
    .breadcrumb {
      display: flex; align-items: center; gap: 6px;
      margin: 0 0 12px; padding: 8px 12px;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: rgba(0,0,0,0.12); font-size: 11px; color: var(--muted);
      font-family: var(--mono);
    }
    .breadcrumb .crumb-home { color: var(--brand); font-weight: 600; }
    .breadcrumb .crumb-sep { color: var(--muted); opacity: 0.5; }
    .breadcrumb .crumb-cur { color: var(--text); font-weight: 600; }
    .breadcrumb.flash { animation: breadcrumbFlash 0.8s ease-out; }

    /* ── Ripple on nav buttons ── */
    .ripple { position: absolute; border-radius: 50%; background: var(--brand); pointer-events: none; animation: ripple 0.6s ease-out forwards; }

    * { box-sizing: border-box; }
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
    *::-webkit-scrollbar-thumb {
      border: 2px solid transparent; border-radius: 999px;
      background: linear-gradient(180deg, rgba(58,240,208,0.55), rgba(192,132,252,0.45)) border-box;
      background-clip: padding-box, border-box;
    }

    body {
      margin: 0; min-height: 100vh;
      color: var(--text);
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(58,240,208,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(58,240,208,0.035) 1px, transparent 1px),
        radial-gradient(circle, rgba(58, 240, 208, 0.12) 1px, transparent 1px);
      background-size: 42px 42px, 42px 42px, 24px 24px;
      -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,0.85), rgba(0,0,0,0.3));
      mask-image: linear-gradient(90deg, rgba(0,0,0,0.85), rgba(0,0,0,0.3));
    }

    body::after {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse 60% 40% at 10% -5%, rgba(58, 240, 208, 0.06), transparent),
                  radial-gradient(ellipse 40% 50% at 90% 20%, rgba(192, 132, 252, 0.05), transparent);
    }

    .app { position: relative; z-index: 1; display: grid; grid-template-columns: 292px 1fr; min-height: 100vh; }

    aside {
      position: sticky; top: 0; height: 100vh; padding: 20px 16px;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(12,28,43,0.86), rgba(3,10,18,0.9)),
        rgba(6, 14, 22, 0.78);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      display: flex; flex-direction: column; overflow: auto;
      z-index: 2; box-shadow: 18px 0 50px rgba(0,0,0,0.18);
    }

    main {
      padding: 24px clamp(18px, 3vw, 42px) 48px;
      will-change: transform, opacity;
      position: relative;
      max-width: 1480px;
    }

    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding: 2px 4px; }
    .chip-logo {
      width: 48px; height: 48px; display: grid; place-items: center;
      border-radius: 14px; color: #021018; font-weight: 900; font-size: 15px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow: 0 14px 34px -12px rgba(192,132,252,0.6), inset 0 1px 0 rgba(255,255,255,0.45);
      position: relative; font-family: var(--mono); overflow: hidden;
    }
    .chip-logo::before {
      content: ""; position: absolute; inset: -6px; border-radius: 18px;
      background: conic-gradient(from 210deg, rgba(58,240,208,0.15), transparent 35%, rgba(192,132,252,0.2), transparent 70%, rgba(58,240,208,0.15));
      animation: ringRotate 18s linear infinite; filter: blur(4px); pointer-events: none;
    }
    .chip-logo::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      border: 1px solid rgba(255,255,255,0.3); pointer-events: none;
    }
    .chip-logo span { position: relative; z-index: 1; text-shadow: 0 1px 0 rgba(255,255,255,0.4); }
    .logo h1 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15;
      background: linear-gradient(120deg, #ffffff, #e0ecf8 50%, #c084fc); -webkit-background-clip: text;
      background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
    .logo p { margin: 2px 0 0; color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 0.01em; font-family: var(--mono); }

    .nav-title { margin: 16px 0 6px; padding: 0 2px; color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; }
    .nav-search { margin: 0 0 10px; padding: 0 2px; }
    .nav-search input {
      padding: 11px 12px 11px 34px; border-radius: 14px;
      background: rgba(255,255,255,0.045); border: 1px solid var(--line);
      color: var(--text); font-size: 12px; outline: none; width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .nav-search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(58, 240, 208, 0.08); }

    .learning-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 6px 0 10px;
    }
    .learning-grid .nav-btn {
      min-height: 76px;
      margin: 0;
      padding: 11px 10px 10px 12px;
      font-size: 12px;
      line-height: 1.25;
      border-radius: 13px;
    }
    .learning-grid .nav-btn span {
      margin-top: 5px;
      font-size: 9px;
      line-height: 1.35;
    }

    /* Top reading-progress bar (per-module) */
    .top-progress {
      position: fixed; left: 0; top: 0; height: 2px; width: 0%;
      background: linear-gradient(90deg, var(--brand) 0%, var(--brand-2) 100%);
      z-index: 1000; pointer-events: none; transition: width 0.18s ease-out;
      box-shadow: 0 0 8px rgba(58, 240, 208, 0.45);
    }
    body.light .top-progress { background: linear-gradient(90deg, #0d9486 0%, #7c3aed 100%); box-shadow: 0 0 8px rgba(13, 148, 136, 0.4); }

    /* Keyboard shortcut help panel */
    .shortcut-panel[hidden] { display: none; }
    .shortcut-panel {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(2, 6, 12, 0.65);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      animation: shortcutIn 0.18s ease-out;
    }
    @keyframes shortcutIn { from { opacity: 0; } to { opacity: 1; } }
    .shortcut-card {
      width: min(720px, 100%); max-height: 80vh; overflow: auto;
      background: var(--bg-2, #0e1318); color: var(--text, #cfd6e2);
      border: 1px solid var(--line, #2a3140); border-radius: 14px;
      padding: 20px 22px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    }
    body.light .shortcut-card { background: #ffffff; border-color: #d6dde6; color: #1f2937; box-shadow: 0 20px 50px rgba(20, 30, 50, 0.18); }
    .shortcut-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .shortcut-head h3 { margin: 0; font-size: 17px; font-weight: 700; }
    .shortcut-close {
      width: 28px; height: 28px; line-height: 1; font-size: 22px;
      border: 1px solid var(--line); background: transparent; color: inherit;
      border-radius: 6px; cursor: pointer; transition: 0.16s;
    }
    .shortcut-close:hover { border-color: var(--brand); color: var(--brand); }
    .shortcut-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }
    .shortcut-group h4 {
      margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--brand);
    }
    body.light .shortcut-group h4 { color: #0d9486; }
    .shortcut-group dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; }
    .shortcut-group dt { white-space: nowrap; }
    .shortcut-group dd { margin: 0; color: var(--muted, #7e8ba0); font-size: 12px; line-height: 1.5; }
    kbd {
      display: inline-block; min-width: 18px; padding: 1px 6px;
      font: 600 11px/1.6 var(--mono, ui-monospace, Menlo, Consolas, monospace);
      color: inherit; background: rgba(58, 240, 208, 0.08);
      border: 1px solid var(--line); border-bottom-width: 2px;
      border-radius: 4px; text-align: center; vertical-align: 1px;
    }
    body.light kbd { background: #f1f5f9; border-color: #cbd5e1; }
    .shortcut-foot {
      margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line);
      color: var(--muted, #7e8ba0); font-size: 11px; text-align: center;
    }

    /* Stronger focus ring on nav buttons for keyboard users */
    .nav-btn:focus-visible {
      outline: 2px solid var(--brand); outline-offset: 2px;
      box-shadow: 0 0 0 4px rgba(58, 240, 208, 0.18);
    }

    /* Detail expand button gets a chevron icon hint */
    .detail-open-btn,
    .detail-close-btn {
      position: relative;
    }
    .detail-open-btn::after,
    .detail-close-btn::after {
      content: "⌄";
      position: absolute;
      right: 6px;
      top: 50%;
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1.5px solid rgba(58, 240, 208, 0.55);
      background: rgba(58,240,208,0.08);
      color: var(--brand);
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
      transform: translateY(-50%) rotate(0deg);
      transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, color 0.22s ease;
      box-shadow: inset 0 0 0 2px transparent;
      box-sizing: border-box;
    }
    .detail-submenu summary { position: relative; padding-right: 46px; }
    .detail-submenu summary::after {
      content: "▾";
      position: absolute;
      right: 12px;
      top: 50%;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1.5px solid rgba(58, 240, 208, 0.55);
      background: rgba(58, 240, 208, 0.08);
      color: var(--brand);
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      transform: translateY(-50%) rotate(0deg);
      transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, color 0.22s ease;
      box-shadow: inset 0 0 0 2px transparent;
    }
    .detail-open-btn:hover::after,
    .detail-close-btn:hover::after,
    .detail-submenu summary:hover::after {
      background: rgba(58, 240, 208, 0.18);
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(58, 240, 208, 0.15);
    }
    .detail-open-btn:focus-visible::after,
    .detail-close-btn:focus-visible::after,
    .detail-submenu summary:focus-visible::after {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(58, 240, 208, 0.28);
    }
    .lesson-body.detail-expanded .detail-open-btn::after,
    .detail-submenu details[open] summary::after {
      transform: translateY(-50%) rotate(180deg);
      background: rgba(192, 132, 252, 0.16);
      border-color: var(--brand-2);
      color: var(--brand-2);
    }

    /* Theme switch button focus */
    .nav-btn:focus, .btn:focus, button:focus-visible { outline: none; }
    .btn:focus-visible, button.nav-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .learning-grid .nav-btn.completed::after {
      top: 8px;
      right: 8px;
      transform: none;
    }

    body.device-phone .learning-grid {
      grid-template-columns: 1fr;
      gap: 7px;
    }
    body.device-phone .learning-grid .nav-btn {
      min-height: 58px;
      padding: 10px 12px;
      font-size: 12.5px;
    }
    body.device-tablet .learning-grid .nav-btn {
      min-height: 68px;
    }
    body.input-touch .nav-btn {
      min-height: 44px;
    }
    body.device-phone .scroll-cue-page {
      top: 10px;
      max-width: calc(100vw - 28px);
      white-space: nowrap;
      font-size: 11px;
      padding: 7px 12px;
    }

    .nav-btn {
      position: relative; width: 100%; margin: 4px 0; padding: 12px 12px 12px 18px;
      border: 1px solid transparent; border-left: 2px solid transparent; border-radius: 14px;
      color: var(--text-dim); text-align: left; cursor: pointer;
      background: transparent; transition: all 0.18s ease; font-size: 13px; font-weight: 500;
      overflow: hidden;
    }
    .nav-btn:hover { color: var(--text); border-color: var(--line); border-left-color: var(--line-strong); background: rgba(58, 240, 208, 0.055); transform: translateX(2px); }
    .nav-btn.active {
      color: var(--text); border-color: rgba(58,240,208,0.16); border-left-color: var(--brand);
      background: linear-gradient(90deg, rgba(58, 240, 208, 0.16), rgba(58,240,208,0.045));
      font-weight: 700; box-shadow: inset 0 0 24px rgba(58,240,208,0.035), 0 8px 22px rgba(0,0,0,0.16);
    }
    .nav-btn.active::before {
      content: ""; position: absolute; left: 0; top: 50%; transform: translate(-50%, -50%);
      width: 7px; height: 7px; border-radius: 50%; background: var(--brand);
      animation: ledPulse 2s ease-in-out infinite;
    }
    .nav-btn.completed::after {
      content: "✓"; position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
      width: 18px; height: 18px; display: grid; place-items: center; border-radius: 2px;
      color: #030d14; background: var(--ok); font-size: 10px; font-weight: 900;
    }
    .nav-btn span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; font-weight: 400; }

    .progress-card {
      margin-top: auto; padding: 16px;
      border: 1px solid rgba(58,240,208,0.14);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(58,240,208,0.06), rgba(192,132,252,0.04) 50%, rgba(0,0,0,0.2));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 14px 32px -20px rgba(192,132,252,0.5);
    }
    .progress-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; font-family: var(--mono); }
    .progress-top span:last-child { color: var(--brand); font-weight: 800; font-size: 13px; letter-spacing: 0; }
    .bar { height: 6px; border-radius: 999px; background: rgba(58,240,208,0.08); overflow: hidden; }
    .bar > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--brand), var(--brand-2)); transition: width 0.35s ease; box-shadow: 0 0 10px rgba(58,240,208,0.5); }
    .bar > div {
      width: 0%; height: 100%; background: linear-gradient(90deg, var(--brand), var(--ok), var(--brand-2));
      background-size: 200% 100%; animation: shimmer 3s linear infinite;
      transition: width 0.5s cubic-bezier(0.25, 0, 1, 1);
      box-shadow: 0 0 8px var(--brand-glow);
    }

    .hero { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 14px; margin-bottom: 16px; animation: fadeSlideUp 0.4s ease-out; }
    .hero-main { padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; }
    .hero-main .hero-title { font-size: 28px; font-weight: 800; line-height: 1.15; margin: 0; background: linear-gradient(135deg, var(--text), var(--text-soft)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.02em; }
    .hero-main .lead { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0; }

    /* Module accent themes — top bar color + glow */
    .accent-from-cyan-to-blue { --accent-a: #06b6d4; --accent-b: #3b82f6; --accent-glow: rgba(6, 182, 212, 0.3); }
    .accent-from-green-to-cyan { --accent-a: #10b981; --accent-b: #06b6d4; --accent-glow: rgba(16, 185, 129, 0.3); }
    .accent-from-purple-to-pink { --accent-a: #8b5cf6; --accent-b: #ec4899; --accent-glow: rgba(139, 92, 246, 0.3); }
    .accent-from-amber-to-orange { --accent-a: #f59e0b; --accent-b: #f97316; --accent-glow: rgba(245, 158, 11, 0.3); }
    .accent-from-cyan-to-purple { --accent-a: #06b6d4; --accent-b: #8b5cf6; --accent-glow: rgba(6, 182, 212, 0.3); }
    .accent-from-pink-to-red { --accent-a: #ec4899; --accent-b: #ef4444; --accent-glow: rgba(236, 72, 153, 0.3); }
    .accent-from-green-to-amber { --accent-a: #10b981; --accent-b: #f59e0b; --accent-glow: rgba(16, 185, 129, 0.3); }
    .accent-from-blue-to-cyan { --accent-a: #3b82f6; --accent-b: #06b6d4; --accent-glow: rgba(59, 130, 246, 0.3); }
    .accent-from-red-to-amber { --accent-a: #ef4444; --accent-b: #f59e0b; --accent-glow: rgba(239, 68, 68, 0.35); }
    .hero-main[class*="accent-"]::after {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
      box-shadow: 0 0 20px var(--accent-glow);
      animation: accentGlow 2.2s ease-in-out infinite;
    }
    .hero-main[class*="accent-"] .badge {
      color: var(--accent-a);
      border-color: var(--accent-a);
      background: rgba(58,240,208,0.08);
      background: color-mix(in srgb, var(--accent-a) 8%, transparent);
    }
    .hero-main[class*="accent-"] .badge::before { background: var(--accent-a); }
    @keyframes accentGlow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    .card {
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--panel); backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px); box-shadow: var(--shadow);
      transition: border-color 0.25s, box-shadow 0.25s;
      position: relative; overflow: hidden;
    }
    .card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--brand), transparent);
      opacity: 0.4; pointer-events: none;
    }
    .card:hover { border-color: var(--line-strong); box-shadow: var(--shadow), 0 0 0 1px rgba(58, 240, 208, 0.04); }

    .hero-main { padding: 24px 28px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
      border: 1px solid rgba(58, 240, 208, 0.18); border-radius: 2px;
      color: var(--brand); background: rgba(58, 240, 208, 0.05);
      font-size: 11px; font-weight: 600; font-family: var(--mono); letter-spacing: 0.04em;
    }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); animation: ledPulse 2s ease-in-out infinite; }

    h2 { margin: 14px 0 8px; font-size: clamp(26px, 4vw, 46px); font-weight: 800; line-height: 1.06; letter-spacing: -0.04em; }
    .lead { max-width: 760px; color: var(--text-dim); font-size: 14px; line-height: 1.7; }

    .hero-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .primary, .secondary, .ghost {
      padding: 9px 16px; border: 0; border-radius: var(--radius-sm); cursor: pointer;
      font-size: 13px; font-weight: 600; transition: all 0.18s ease; position: relative;
    }
    .primary { color: #030d14; background: var(--brand); box-shadow: 0 0 16px var(--brand-glow); }
    .primary:hover { transform: translateY(-1px); box-shadow: 0 0 24px var(--brand-glow); }
    .secondary { color: var(--text); border: 1px solid var(--line); background: rgba(255,255,255,0.04); }
    .secondary:hover { border-color: var(--line-strong); transform: translateY(-1px); }
    .ghost { color: var(--brand); background: transparent; }
    .ghost:hover { background: rgba(58, 240, 208, 0.05); }
    .primary:active, .secondary:active, .ghost:active { transform: scale(0.97); }

    .hero-aside { padding: 14px; display: grid; gap: 8px; align-content: start; }
    .metric {
      padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: rgba(0,0,0,0.15); transition: border-color 0.2s;
    }
    .metric:hover { border-color: var(--line-strong); }
    .metric strong { display: block; font-size: 24px; font-weight: 800; margin-bottom: 1px; font-family: var(--mono); }
    .metric span { color: var(--muted); font-size: 11px; font-weight: 500; }
    .achievement-list { display: grid; gap: 4px; margin-top: 4px; }
    .achievement {
      padding: 6px 9px; border: 1px solid var(--line); border-radius: 2px;
      color: var(--muted); background: rgba(0,0,0,0.15); font-size: 10px; font-weight: 500;
      transition: all 0.2s;
    }
    .achievement.unlocked {
      color: #030d14; border-color: transparent;
      background: linear-gradient(135deg, var(--ok), var(--brand));
      font-weight: 700; box-shadow: 0 0 12px var(--ok-glow);
    }

    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; animation: fadeSlideUp 0.4s ease-out; }
    .section { grid-column: span 8; padding: 20px; }
    .toolbox { grid-column: span 4; padding: 20px; }

    .section h3, .toolbox h3 { margin: 0 0 4px; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .section-desc { margin: 0 0 14px; color: var(--text-dim); font-size: 13px; line-height: 1.6; }

    .module-list { display: grid; gap: 8px; }
    .module {
      display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
      padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: rgba(0,0,0,0.15); transition: all 0.18s ease; cursor: default;
    }
    .module:hover { border-color: var(--line-strong); transform: translateX(4px); }
    .module-num {
      width: 36px; height: 36px; display: grid; place-items: center; border-radius: 2px;
      color: #030d14; font-weight: 900; font-size: 13px; font-family: var(--mono);
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
    }
    .module h4 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
    .module p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .pill { padding: 4px 8px; border-radius: 999px; color: var(--muted); border: 1px solid var(--line); font-size: 10px; font-weight: 500; white-space: nowrap; }

    .lesson-body {
      margin-top: 12px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: rgba(0,0,0,0.15); line-height: 1.7; transition: border-color 0.2s;
    }
    .lesson-body:hover { border-color: var(--line-strong); }
    .lesson-body h4 { margin: 0 0 8px; font-size: 15px; font-weight: 700; color: var(--brand); }
    .lesson-body ul { padding-left: 16px; }
    .lesson-body li { margin: 5px 0; font-size: 13px; }

    .tool { margin-top: 10px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: rgba(0,0,0,0.15); }
    .tool label { display: block; margin: 6px 0 4px; color: var(--muted); font-size: 11px; font-weight: 600; }
    select, input, textarea {
      width: 100%; color: var(--text); border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: rgba(2, 8, 14, 0.6); padding: 9px 10px; outline: none; font-size: 13px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(58, 240, 208, 0.08); }
    textarea { min-height: 100px; resize: vertical; font-family: var(--mono); font-size: 12px; line-height: 1.5; }

    .truth-table { width: 100%; margin-top: 8px; border-collapse: collapse; border-radius: var(--radius-sm); overflow: hidden; font-size: 12px; }
    .truth-table th, .truth-table td { padding: 8px; border-bottom: 1px solid var(--line); text-align: center; }
    .truth-table th { color: var(--brand); background: rgba(58, 240, 208, 0.05); font-weight: 700; font-size: 11px; font-family: var(--mono); }
    .truth-table td { font-family: var(--mono); font-weight: 500; }

    .quiz-card { display: none; margin-top: 12px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: rgba(0,0,0,0.15); }
    .quiz-card.active { display: block; animation: fadeSlideUp 0.25s ease-out; }
    .quiz-card strong { font-size: 14px; font-weight: 600; }
    .answers { display: grid; gap: 6px; margin-top: 10px; }
    .answer {
      padding: 10px 12px; color: var(--text-dim); text-align: left; border: 1px solid var(--line);
      border-radius: var(--radius-sm); background: rgba(0,0,0,0.15); cursor: pointer;
      font-size: 13px; font-weight: 500; transition: all 0.15s ease;
    }
    .answer:hover:not(:disabled) { border-color: var(--brand); background: rgba(58, 240, 208, 0.05); transform: translateX(4px); }
    .answer.correct { color: #0a4030; border-color: rgba(58, 240, 208, 0.4); background: rgba(58, 240, 208, 0.12); font-weight: 700; }
    .answer.wrong { border-color: rgba(251, 113, 133, 0.4); background: rgba(251, 113, 133, 0.08); }
    .feedback { margin-top: 8px; color: var(--muted); min-height: 20px; font-size: 12px; line-height: 1.6; }

    .roadmap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
    .roadmap-step {
      padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: rgba(0,0,0,0.15); transition: all 0.18s ease;
    }
    .roadmap-step:hover { border-color: var(--line-strong); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    .roadmap-step strong { display: block; color: var(--brand); margin-bottom: 4px; font-size: 13px; font-weight: 700; }
    .roadmap-step span { color: var(--muted); font-size: 11px; line-height: 1.5; }

    .note-actions { display: flex; gap: 6px; margin-top: 6px; }
    .toast {
      position: fixed; right: 16px; bottom: 16px; z-index: 100;
      padding: 10px 14px; border: 1px solid rgba(58, 240, 208, 0.25); border-radius: var(--radius-sm);
      color: #c8ffd9; background: rgba(6, 18, 16, 0.96);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      font-size: 12px; font-weight: 600; opacity: 0; transform: translateY(12px);
      pointer-events: none; transition: 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
      font-family: var(--mono);
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .back-to-top {
      position: fixed; right: 16px; bottom: 60px; z-index: 99;
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid rgba(58, 240, 208, 0.32);
      background: rgba(8, 14, 22, 0.92); color: #3af0d0;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transform: translateY(8px) scale(0.9);
      pointer-events: none; transition: 0.22s cubic-bezier(0.25, 0.1, 0.25, 1);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .back-to-top.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .back-to-top:hover { background: rgba(8, 14, 22, 1); border-color: rgba(58, 240, 208, 0.55); }
    .back-to-top:focus-visible { outline: 2px solid #3af0d0; outline-offset: 2px; }
    body.light .back-to-top { background: rgba(255, 255, 255, 0.94); border-color: rgba(13, 148, 136, 0.32); color: #0d9486; }

    .nav-search-empty {
      margin-top: 4px; padding: 8px 10px;
      border: 1px dashed rgba(58, 240, 208, 0.28); border-radius: var(--radius-sm);
      color: var(--muted); font-size: 11px; line-height: 1.5;
      display: flex; align-items: center; gap: 6px;
    }
    body.light .nav-search-empty { border-color: rgba(13, 148, 136, 0.32); }

    .nav-btn[aria-current="page"] {
      box-shadow: inset 0 0 0 1px rgba(58, 240, 208, 0.55);
      background: linear-gradient(135deg, rgba(58, 240, 208, 0.16), rgba(58, 240, 208, 0.04));
    }

    .terminal {
      padding: 12px; border-radius: var(--radius-sm); color: #c8ffd9; background: #03080e;
      border: 1px solid rgba(58, 240, 208, 0.15); font-family: var(--mono);
      font-size: 11px; line-height: 1.6; white-space: pre-wrap; min-height: 80px;
      position: relative;
    }
    .terminal::before { content: "> verilog"; display: block; color: var(--muted); margin-bottom: 6px; font-size: 10px; }
    body.light .terminal { color: #0b5c3f; background: #f6fbff; border-color: rgba(13, 148, 136, 0.15); }

    .waveform {
      display: grid; gap: 5px; margin-top: 8px; padding: 12px;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: rgba(0,0,0,0.15); font-family: var(--mono); font-size: 10px; overflow-x: auto;
    }
    .wave-row { display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 8px; min-width: 300px; }
    .wave-name { color: var(--brand); font-weight: 800; font-size: 11px; }
    .wave-cells { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
    .wave-cell {
      padding: 5px 2px; border-radius: 2px; text-align: center;
      color: var(--text-dim); background: rgba(58, 240, 208, 0.04);
      border: 1px solid rgba(58, 240, 208, 0.08); font-size: 9px; font-weight: 600;
    }
    .wave-cell.high { color: #030d14; background: var(--ok); border-color: transparent; }

    .sample-actions { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: end; }
    .flashcards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .flashcard {
      min-height: 100px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: rgba(0,0,0,0.15); cursor: pointer; transition: all 0.18s ease;
    }
    .flashcard:hover { border-color: var(--brand); background: rgba(58, 240, 208, 0.03); transform: translateY(-2px); }
    .flashcard strong { display: block; margin-bottom: 4px; color: var(--brand); font-size: 13px; font-family: var(--mono); }
    .flashcard p { margin: 0; color: var(--text-dim); font-size: 12px; line-height: 1.6; }
    .hidden { display: none; }
    .footer-note { margin: 10px 0 0; color: var(--muted); font-size: 10px; line-height: 1.5; }

    .trace {
      position: absolute; pointer-events: none; opacity: 0.25;
      border: 1px solid var(--brand); border-radius: 0;
      animation: tracePulse 4s ease-in-out infinite;
    }
    .trace-h { height: 1px; background: var(--brand); }
    .trace-v { width: 1px; background: var(--brand); }
    .trace-corner {
      width: 24px; height: 24px;
      border: 1px solid var(--brand);
      border-top: 0; border-left: 0;
    }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      aside { position: relative; height: auto; }
      .hero, .grid { grid-template-columns: 1fr; }
      .section, .toolbox { grid-column: span 1; }
      .flashcards { grid-template-columns: 1fr; }
      .roadmap { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── Level Badge System ── */
    .level-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 2px; font-size: 10px;
      font-weight: 700; font-family: var(--mono); letter-spacing: 0.04em;
      margin-left: 8px; vertical-align: middle;
    }
    .level-l1 { color: #3af0d0; border: 1px solid rgba(58,240,208,0.3); background: rgba(58,240,208,0.08); }
    .level-l2 { color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); background: rgba(251,191,36,0.08); }
    .level-l3 { color: #c084fc; border: 1px solid rgba(192,132,252,0.3); background: rgba(192,132,252,0.08); }
    body.light .level-l1 { color: #0d9488; }
    body.light .level-l2 { color: #b45309; }
    body.light .level-l3 { color: #7c3aed; }

    .lesson-body[data-level] {
      position: relative; padding-left: 20px;
      border-left: 3px solid transparent;
      transition: border-color 0.25s, background 0.25s;
    }
    .lesson-body[data-level="L1"] { border-left-color: rgba(58,240,208,0.25); }
    .lesson-body[data-level="L2"] { border-left-color: rgba(251,191,36,0.25); }
    .lesson-body[data-level="L3"] { border-left-color: rgba(192,132,252,0.25); }
    .lesson-body.level-hidden { display: none; }

    .level-filter-bar {
      display: flex; gap: 6px; margin: 10px 0 14px; flex-wrap: wrap;
    }
    .level-filter-btn {
      padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px;
      background: rgba(0,0,0,0.15); color: var(--text-dim); cursor: pointer;
      font-size: 11px; font-weight: 600; transition: all 0.18s ease;
    }
    .level-filter-btn:hover { border-color: var(--line-strong); }
    .level-filter-btn.active-l1 { color: #3af0d0; border-color: rgba(58,240,208,0.5); background: rgba(58,240,208,0.1); }
    .level-filter-btn.active-l2 { color: #fbbf24; border-color: rgba(251,191,36,0.5); background: rgba(251,191,36,0.1); }
    .level-filter-btn.active-l3 { color: #c084fc; border-color: rgba(192,132,252,0.5); background: rgba(192,132,252,0.1); }
    .level-filter-btn.active-all { color: var(--text); border-color: var(--brand); background: rgba(58,240,208,0.08); }
    body.light .level-filter-btn.active-l1 { color: #0d9488; }
    body.light .level-filter-btn.active-l2 { color: #92400e; }
    body.light .level-filter-btn.active-l3 { color: #7c3aed; }

    /* ── Section Navigation (table of contents) ── */
    .section-nav {
      display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px;
      padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: rgba(0,0,0,0.1);
    }
    .section-nav a {
      color: var(--text-dim); font-size: 11px; text-decoration: none;
      padding: 3px 8px; border-radius: 2px; transition: all 0.15s;
      cursor: pointer;
    }
    .section-nav a:hover { color: var(--brand); background: rgba(58,240,208,0.06); }

    /* ── Collapsible section ── */
    .collapse-toggle {
      cursor: pointer; user-select: none;
      display: flex; align-items: center; gap: 6px;
    }
    .collapse-toggle::before {
      content: "\25B8"; display: inline-block; transition: transform 0.2s;
      font-size: 10px; color: var(--muted);
    }
    .collapse-toggle.open::before { transform: rotate(90deg); }
    .collapse-content { overflow: hidden; transition: max-height 0.35s ease; }
    .collapse-content.closed { max-height: 0 !important; }

    /* ── Level progress in sidebar ── */
    .level-progress { display: flex; gap: 4px; margin-top: 4px; }
    .level-dot { flex: 1; height: 3px; border-radius: 0; background: rgba(255,255,255,0.06); transition: background 0.3s; }
    .level-dot.l1-done { background: rgba(58,240,208,0.5); }
    .level-dot.l2-done { background: rgba(251,191,36,0.5); }
    .level-dot.l3-done { background: rgba(192,132,252,0.5); }


    /* ── Level Badge System ── */
    .level-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 2px; font-size: 10px;
      font-weight: 700; font-family: var(--mono); letter-spacing: 0.04em;
      margin-left: 8px; vertical-align: middle;
    }
    .level-l1 { color: #3af0d0; border: 1px solid rgba(58,240,208,0.3); background: rgba(58,240,208,0.08); }
    .level-l2 { color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); background: rgba(251,191,36,0.08); }
    .level-l3 { color: #c084fc; border: 1px solid rgba(192,132,252,0.3); background: rgba(192,132,252,0.08); }
    body.light .level-l1 { color: #0d9488; }
    body.light .level-l2 { color: #b45309; }
    body.light .level-l3 { color: #7c3aed; }

    .lesson-body[data-level] {
      position: relative; padding-left: 20px;
      border-left: 3px solid transparent;
      transition: border-color 0.25s, background 0.25s;
    }
    .lesson-body[data-level="L1"] { border-left-color: rgba(58,240,208,0.25); }
    .lesson-body[data-level="L2"] { border-left-color: rgba(251,191,36,0.25); }
    .lesson-body[data-level="L3"] { border-left-color: rgba(192,132,252,0.25); }
    .lesson-body.level-hidden { display: none; }

    .level-filter-bar {
      display: flex; gap: 6px; margin: 10px 0 14px; flex-wrap: wrap;
    }
    .level-filter-btn {
      padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px;
      background: rgba(0,0,0,0.15); color: var(--text-dim); cursor: pointer;
      font-size: 11px; font-weight: 600; transition: all 0.18s ease;
    }
    .level-filter-btn:hover { border-color: var(--line-strong); }
    .level-filter-btn.active-l1 { color: #3af0d0; border-color: rgba(58,240,208,0.5); background: rgba(58,240,208,0.1); }
    .level-filter-btn.active-l2 { color: #fbbf24; border-color: rgba(251,191,36,0.5); background: rgba(251,191,36,0.1); }
    .level-filter-btn.active-l3 { color: #c084fc; border-color: rgba(192,132,252,0.5); background: rgba(192,132,252,0.1); }
    .level-filter-btn.active-all { color: var(--text); border-color: var(--brand); background: rgba(58,240,208,0.08); }
    body.light .level-filter-btn.active-l1 { color: #0d9488; }
    body.light .level-filter-btn.active-l2 { color: #92400e; }
    body.light .level-filter-btn.active-l3 { color: #7c3aed; }

    /* ── Section Navigation (table of contents) ── */
    .section-nav {
      display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px;
      padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: rgba(0,0,0,0.1);
    }
    .section-nav a {
      color: var(--text-dim); font-size: 11px; text-decoration: none;
      padding: 3px 8px; border-radius: 2px; transition: all 0.15s;
      cursor: pointer;
    }
    .section-nav a:hover { color: var(--brand); background: rgba(58,240,208,0.06); }

    /* ── Collapsible section ── */
    .collapse-toggle {
      cursor: pointer; user-select: none;
      display: flex; align-items: center; gap: 6px;
    }
    .collapse-toggle::before {
      content: "\25B8"; display: inline-block; transition: transform 0.2s;
      font-size: 10px; color: var(--muted);
    }
    .collapse-toggle.open::before { transform: rotate(90deg); }
    .collapse-content { overflow: hidden; transition: max-height 0.35s ease; }
    .collapse-content.closed { max-height: 0 !important; }

    /* ── Level progress in sidebar ── */
    .level-progress { display: flex; gap: 4px; margin-top: 4px; }
    .level-dot { flex: 1; height: 3px; border-radius: 0; background: rgba(255,255,255,0.06); transition: background 0.3s; }
    .level-dot.l1-done { background: rgba(58,240,208,0.5); }
    .level-dot.l2-done { background: rgba(251,191,36,0.5); }
    .level-dot.l3-done { background: rgba(192,132,252,0.5); }

    /* ── Interface polish layer ── */
    .breadcrumb {
      position: sticky; top: 14px; z-index: 20;
      width: fit-content; max-width: 100%;
      padding: 10px 14px; margin-bottom: 16px;
      border-radius: 999px;
      background: rgba(5,13,20,0.64);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
    }
    body.light .breadcrumb { background: rgba(255,255,255,0.72); }

    .card {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015)),
        var(--panel);
      border-color: rgba(255,255,255,0.08);
    }
    .card:hover { transform: translateY(-1px); }
    .hero { gap: 18px; margin-bottom: 18px; }
    .hero-main {
      min-height: 250px;
      justify-content: center;
      background:
        radial-gradient(circle at 18% 12%, rgba(58,240,208,0.16), transparent 34%),
        radial-gradient(circle at 88% 18%, rgba(192,132,252,0.12), transparent 30%),
        linear-gradient(135deg, rgba(255,255,255,0.055), rgba(255,255,255,0.012)),
        var(--panel);
      background:
        radial-gradient(circle at 18% 12%, color-mix(in srgb, var(--accent-a, var(--brand)) 18%, transparent), transparent 34%),
        radial-gradient(circle at 88% 18%, color-mix(in srgb, var(--accent-b, var(--brand-2)) 13%, transparent), transparent 30%),
        linear-gradient(135deg, rgba(255,255,255,0.055), rgba(255,255,255,0.012)),
        var(--panel);
    }
    .hero-main .hero-title {
      font-size: clamp(34px, 4.8vw, 58px);
      max-width: 820px;
    }
    .hero-main .lead {
      max-width: 760px;
      font-size: 15px;
      color: var(--text-soft);
    }
    .hero-actions { gap: 10px; }
    .primary, .secondary, .ghost {
      min-height: 38px;
      border-radius: 999px;
      letter-spacing: 0.01em;
    }
    .primary {
      background: linear-gradient(135deg, var(--brand), #77ffe8);
      box-shadow: 0 0 22px var(--brand-glow), inset 0 1px 0 rgba(255,255,255,0.45);
    }
    .secondary {
      background: rgba(255,255,255,0.055);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .ghost { padding-inline: 12px; }

    .hero-aside { gap: 10px; }
    .metric {
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(0,0,0,0.13));
    }
    .metric strong { font-size: 28px; letter-spacing: -0.04em; }
    .achievement { border-radius: 12px; padding: 8px 10px; }

    .grid { gap: 18px; align-items: start; }
    .section, .toolbox { padding: clamp(18px, 2vw, 26px); }
    .toolbox {
      position: sticky; top: 72px;
      max-height: calc(100vh - 92px);
      overflow: auto;
    }
    .section h3, .toolbox h3 { font-size: 20px; }
    .section-desc { font-size: 13.5px; color: var(--text-soft); }

    .level-filter-bar {
      position: sticky; top: 64px; z-index: 15;
      padding: 10px; margin: 14px 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(5,13,20,0.66);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    body.light .level-filter-bar { background: rgba(255,255,255,0.76); }
    .level-filter-btn { padding: 7px 14px; border-radius: 999px; }
    .section-nav {
      gap: 8px; padding: 10px; margin: 0 0 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(58,240,208,0.055), rgba(192,132,252,0.035));
    }
    .section-nav::before {
      content: "本页目录";
      color: var(--brand);
      font-size: 11px;
      font-family: var(--mono);
      font-weight: 800;
      padding: 5px 8px 5px 0;
    }
    .section-nav a {
      padding: 6px 10px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: rgba(255,255,255,0.035);
    }
    .section-nav a:hover {
      border-color: var(--line-strong);
      transform: translateY(-1px);
    }

    .lesson-body {
      padding: 18px 18px 18px 20px;
      border-radius: 16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.035), rgba(0,0,0,0.13)),
        rgba(0,0,0,0.12);
    }
    .lesson-body:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .lesson-body h4 { font-size: 16px; }
    .level-badge { border-radius: 999px; padding: 3px 9px; }

    .module, .tool, .roadmap-step, .quiz-card, .answer, .flashcard, .terminal, .waveform {
      border-radius: 16px;
    }
    .module {
      padding: 14px;
      background: linear-gradient(135deg, rgba(255,255,255,0.035), rgba(0,0,0,0.12));
    }
    .module-num { border-radius: 12px; }
    .tool { background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(0,0,0,0.13)); }
    .truth-table { border-radius: 14px; }

    @media (max-width: 1180px) {
      .app { grid-template-columns: 260px 1fr; }
      .route-bar { left: 260px; }
      .hero { grid-template-columns: 1fr; }
      .toolbox { position: relative; top: auto; max-height: none; }
    }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      aside { position: relative; height: auto; max-height: none; }
      .route-bar { left: 0; }
      .breadcrumb, .level-filter-bar { position: relative; top: auto; }
      main { padding: 18px; }
      .hero, .grid { grid-template-columns: 1fr; }
      .section, .toolbox { grid-column: span 1; }
    }
    @media (max-width: 640px) {
      .hero-main { min-height: auto; padding: 22px; }
      .hero-main .hero-title { font-size: 32px; }
      .hero-actions, .sample-actions { grid-template-columns: 1fr; display: grid; }
      .primary, .secondary, .ghost { width: 100%; }
      .roadmap, .flashcards { grid-template-columns: 1fr; }
      .module { grid-template-columns: 1fr; }
      .pill { width: fit-content; }
      .section-nav::before { width: 100%; }
    }

    /* ── Academic depth + premium visual layer ── */
    .academic-block {
      position: relative;
      margin: 16px 0;
      padding: 20px;
      border: 1px solid rgba(58,240,208,0.18);
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(58,240,208,0.08), rgba(192,132,252,0.045) 46%, rgba(255,255,255,0.025)),
        rgba(0,0,0,0.16);
      box-shadow: 0 18px 50px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .academic-block::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 12%, rgba(58,240,208,0.18), transparent 28%),
        radial-gradient(circle at 92% 10%, rgba(192,132,252,0.16), transparent 26%);
      opacity: 0.8;
    }
    .academic-block > * { position: relative; z-index: 1; }
    .academic-kicker {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      color: var(--brand);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .academic-kicker::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--brand);
      box-shadow: 0 0 18px var(--brand-glow);
    }
    .academic-block h4 {
      color: var(--text);
      margin-bottom: 12px;
      font-size: 18px;
      letter-spacing: -0.01em;
    }
    .formula-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .formula-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
    }
    .formula-card code {
      display: block;
      margin-bottom: 8px;
      color: var(--brand);
      font-family: var(--mono);
      font-size: 13px;
      white-space: normal;
    }
    .formula-card span {
      color: var(--text-soft);
      font-size: 12.5px;
      line-height: 1.6;
    }
    .research-questions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .research-questions li {
      list-style: none;
      margin: 0;
      padding: 12px 12px 12px 34px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.035);
      position: relative;
    }
    .research-questions li::before {
      content: "∴";
      position: absolute;
      left: 12px;
      top: 11px;
      color: var(--brand);
      font-weight: 800;
    }
    body.light .academic-block {
      background:
        linear-gradient(135deg, rgba(6,182,212,0.09), rgba(139,92,246,0.055), rgba(255,255,255,0.75)),
        rgba(255,255,255,0.82);
    }
    @media (max-width: 760px) {
      .formula-grid, .research-questions { grid-template-columns: 1fr; }
      .academic-block { padding: 16px; border-radius: 18px; }
    }

    /* ── Domestic textbook alignment ── */
    .textbook-block {
      position: relative;
      margin: 16px 0;
      padding: 20px;
      border: 1px solid rgba(251,191,36,0.22);
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(251,191,36,0.08), rgba(58,240,208,0.045), rgba(255,255,255,0.025)),
        rgba(0,0,0,0.14);
      box-shadow: 0 16px 44px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.07);
      overflow: hidden;
    }
    .textbook-block::before {
      content: "TEXTBOOK";
      position: absolute;
      right: 18px;
      top: 14px;
      color: rgba(251,191,36,0.18);
      font-family: var(--mono);
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.08em;
      pointer-events: none;
    }
    .textbook-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: #fbbf24;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .textbook-kicker::before {
      content: "";
      width: 9px; height: 9px;
      border-radius: 3px;
      background: #fbbf24;
      box-shadow: 0 0 18px rgba(251,191,36,0.65);
    }
    .textbook-block h4 { font-size: 18px; margin-bottom: 12px; }
    .textbook-map {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .textbook-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,0.035);
    }
    .textbook-card strong {
      display: block;
      color: var(--text);
      margin-bottom: 8px;
      font-size: 13px;
    }
    .textbook-card p, .textbook-card li {
      color: var(--text-soft);
      font-size: 12.5px;
      line-height: 1.65;
    }
    .textbook-card ul { margin: 0; padding-left: 17px; }
    /* ── Field Insight cards ── */
    .field-insight {
      position: relative;
      background:
        linear-gradient(135deg, rgba(192,132,252,0.085), rgba(58,240,208,0.045)),
        rgba(0,0,0,0.14);
    }
    .field-insight::before {
      content: "FIELD";
      position: absolute;
      right: 18px;
      top: 14px;
      color: rgba(192,132,252,0.18);
      font-family: var(--mono);
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.08em;
      pointer-events: none;
    }
    .insight-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: #c084fc;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.14em;
    }
    .insight-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .insight-card {
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.035);
    }
    .insight-card strong {
      display: block;
      color: var(--brand-2);
      margin-bottom: 6px;
      font-size: 12.5px;
    }
    .insight-card p {
      color: var(--text-soft);
      font-size: 12.5px;
      line-height: 1.65;
      margin: 0;
    }
    @media (max-width: 700px) {
      .insight-grid { grid-template-columns: 1fr; }
    }
    .textbook-example {
      margin-top: 12px;
      padding: 13px 14px;
      border: 1px dashed rgba(251,191,36,0.35);
      border-radius: 16px;
      background: rgba(251,191,36,0.045);
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.7;
    }
    body.light .textbook-block {
      background:
        linear-gradient(135deg, rgba(251,191,36,0.11), rgba(6,182,212,0.055), rgba(255,255,255,0.82)),
        rgba(255,255,255,0.86);
    }
    @media (max-width: 900px) {
      .textbook-map { grid-template-columns: 1fr; }
      .textbook-block::before { font-size: 24px; opacity: 0.8; }
    }

    /* ── Detailed expansion panel ── */
    .lesson-headline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .lesson-headline > *:first-child {
      flex: 1 1 auto;
      min-width: 0;
    }
    .detail-open-btn, .detail-close-btn {
      flex: 0 0 auto;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: rgba(58,240,208,0.08);
      color: var(--brand);
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      padding: 8px 56px 8px 14px;
      min-width: 112px;
      white-space: nowrap;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }
    .detail-open-btn:hover, .detail-close-btn:hover {
      border-color: var(--brand);
      background: rgba(58,240,208,0.14);
      transform: translateY(-1px);
    }
    .lesson-detail-panel {
      display: none;
      margin-top: 14px;
      padding: 18px;
      border: 1px solid rgba(58,240,208,0.18);
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(58,240,208,0.07), rgba(192,132,252,0.045)),
        rgba(0,0,0,0.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 16px 38px rgba(0,0,0,0.16);
    }
    .lesson-body.detail-expanded .lesson-detail-panel { display: block; animation: fadeSlideUp 0.22s ease-out; }
    .lesson-body.detail-expanded .detail-open-btn {
      background: rgba(192,132,252,0.12);
      border-color: rgba(192,132,252,0.35);
      color: var(--brand-2);
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .detail-card {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.035);
    }
    .detail-card strong {
      display: block;
      margin-bottom: 7px;
      color: var(--text);
      font-size: 13px;
    }
    .detail-card p, .detail-card li {
      color: var(--text-soft);
      font-size: 12.5px;
      line-height: 1.65;
    }
    .detail-card ul {
      margin: 0;
      padding-left: 16px;
    }
    .detail-submenu {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .detail-submenu details {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      background: rgba(0,0,0,0.13);
      overflow: hidden;
    }
    .detail-submenu summary {
      cursor: pointer;
      list-style: none;
      padding: 9px 14px 9px 16px;
      padding-right: 46px;
      color: var(--text);
      font-size: 12.5px;
      font-weight: 800;
    }
    .detail-submenu summary::-webkit-details-marker { display: none; }
    .detail-submenu details[open] summary::after { /* base rule, hover/expanded styles set above */ }
    .detail-submenu ul {
      margin: 0;
      padding: 0 12px 11px 26px;
    }
    .detail-submenu li { margin: 4px 0; }
    body.light .detail-submenu details {
      background: rgba(255,255,255,0.62);
      border-color: rgba(13,148,136,0.13);
    }
    .detail-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .detail-footnote {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
    }
    body.light .lesson-detail-panel {
      background:
        linear-gradient(135deg, rgba(13,148,136,0.06), rgba(124,58,237,0.045)),
        rgba(255,255,255,0.72);
    }

    /* ── Graphic transition examples ── */
    .graph-demo {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        radial-gradient(circle at 18% 18%, rgba(58,240,208,0.12), transparent 34%),
        linear-gradient(135deg, rgba(255,255,255,0.04), rgba(0,0,0,0.14));
      overflow: hidden;
    }
    .graph-stage {
      min-height: 220px;
      padding: 10px;
      background-image:
        linear-gradient(rgba(58,240,208,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(58,240,208,0.045) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    .graph-stage svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 205px;
    }
    .graph-controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      border-top: 1px solid var(--line);
      background: rgba(0,0,0,0.13);
    }
    .graph-btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      color: var(--text-soft);
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      padding: 8px 9px;
      transition: transform 0.18s ease, border-color 0.18s ease, color 0.18s ease, background 0.18s ease;
    }
    .graph-btn:hover, .graph-btn.active {
      color: var(--brand);
      border-color: var(--brand);
      background: rgba(58,240,208,0.1);
      transform: translateY(-1px);
    }
    /* ── 可交互图形 ── */
    .graph-stage svg { user-select: none; }
    .fsm-state { cursor: pointer; transition: transform 0.18s ease; }
    .fsm-state:hover { transform: translateY(-1px); }
    .fsm-state:focus { outline: none; }
    .fsm-state:focus circle { stroke-width: 4; }
    .fsm-edge { transition: stroke 0.25s ease, stroke-width 0.25s ease, stroke-dasharray 0.25s ease; }
    .graph-flow-edge-on {
      stroke-dasharray: 6 4;
      animation: fsm-edge-flow 1s linear infinite;
    }
    @keyframes fsm-edge-flow {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -20; }
    }
    .synth-handle { transition: r 0.18s ease, stroke-width 0.18s ease; }
    .synth-handle:hover { r: 11; stroke-width: 3; }
    .signal-toggle { transition: fill 0.18s ease, stroke 0.18s ease; }
    .signal-toggle:hover { stroke-width: 2.5; }
    @media (prefers-reduced-motion: reduce) {
      .graph-flow-edge-on, .fsm-state, .synth-handle, .signal-toggle { animation: none; transition: none; }
    }
    .graph-caption {
      padding: 0 12px 12px;
      color: var(--text-soft);
      font-size: 12.5px;
      line-height: 1.6;
    }
    .graph-node {
      transition: transform 0.28s ease, opacity 0.28s ease, filter 0.28s ease;
      transform-box: fill-box;
      transform-origin: center;
    }
    .graph-hot {
      filter: drop-shadow(0 0 10px rgba(58,240,208,0.85));
      animation: graphPulse 1.1s ease-in-out infinite;
    }
    .graph-flow {
      stroke-dasharray: 10 8;
      animation: graphDash 1.2s linear infinite;
    }
    @keyframes graphDash { to { stroke-dashoffset: -36; } }
    @keyframes graphPulse { 0%,100% { opacity: 0.72; } 50% { opacity: 1; } }
    body.light .graph-demo { background: linear-gradient(135deg, rgba(6,182,212,0.08), rgba(255,255,255,0.75)); }
    @media (max-width: 640px) {
      .graph-controls { grid-template-columns: 1fr; }
      .graph-stage { min-height: 190px; }
    }

    /* ── Sidebar scroll-cue effect (triggered on nav-btn click) ── */
    @keyframes navCuePulse {
      0%   { box-shadow: 0 0 0 0 rgba(58,240,208,0.55), 0 0 0 0 rgba(192,132,252,0.35); transform: translateX(2px) scale(1); }
      40%  { box-shadow: 0 0 0 6px rgba(58,240,208,0.18), 0 0 22px 4px rgba(192,132,252,0.45); transform: translateX(2px) scale(1.012); }
      100% { box-shadow: 0 0 0 0 rgba(58,240,208,0), 0 0 0 0 rgba(192,132,252,0); transform: translateX(2px) scale(1); }
    }
    .nav-btn.nav-cue { animation: navCuePulse 0.6s cubic-bezier(0.16,1,0.3,1) both; }

    @keyframes scrollCueArrowFloat {
      0%   { opacity: 0; transform: translate(-50%, -8px) scale(0.85); }
      25%  { opacity: 1; transform: translate(-50%, 0) scale(1); }
      75%  { opacity: 1; transform: translate(-50%, 14px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, 26px) scale(0.9); }
    }
    @keyframes scrollCueRingFade {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      30%  { opacity: 0.9; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); }
    }
    @keyframes scrollCueBeam {
      0%   { opacity: 0; transform: scaleY(0.2); transform-origin: top; }
      30%  { opacity: 1; transform: scaleY(1); transform-origin: top; }
      100% { opacity: 0; transform: scaleY(1); transform-origin: top; }
    }
    .scroll-cue {
      position: absolute; pointer-events: none; z-index: 6;
      width: 56px; height: 96px;
      left: 50%; top: 0; transform: translateX(-50%);
    }
    .scroll-cue::before {
      content: ""; position: absolute;
      left: 50%; top: 6px; width: 2px; height: 70px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(58,240,208,0.95), rgba(192,132,252,0.0));
      border-radius: 2px;
      animation: scrollCueBeam 0.55s cubic-bezier(0.16,1,0.3,1) both;
      box-shadow: 0 0 14px rgba(58,240,208,0.55);
    }
    .scroll-cue .cue-ring {
      position: absolute; left: 50%; top: 4px;
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid rgba(58,240,208,0.85);
      animation: scrollCueRingFade 0.55s ease-out both;
      box-shadow: 0 0 18px rgba(58,240,208,0.45) inset, 0 0 18px rgba(58,240,208,0.25);
    }
    .scroll-cue .cue-arrow {
      position: absolute; left: 50%; top: 30px;
      width: 22px; height: 22px;
      transform: translate(-50%, 0);
      animation: scrollCueArrowFloat 0.7s cubic-bezier(0.16,1,0.3,1) both;
      color: var(--brand);
      filter: drop-shadow(0 0 8px rgba(58,240,208,0.6));
    }
    .scroll-cue .cue-arrow::before,
    .scroll-cue .cue-arrow::after {
      content: ""; position: absolute; left: 50%; top: 0;
      width: 14px; height: 14px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: translateX(-50%) rotate(45deg);
    }
    .scroll-cue .cue-arrow::after {
      top: 8px; opacity: 0.55;
    }
    body.light .scroll-cue::before {
      background: linear-gradient(180deg, rgba(20,138,255,0.95), rgba(124,58,237,0.0));
      box-shadow: 0 0 14px rgba(20,138,255,0.5);
    }
    body.light .scroll-cue .cue-ring { border-color: rgba(20,138,255,0.85); box-shadow: 0 0 18px rgba(20,138,255,0.45) inset, 0 0 18px rgba(20,138,255,0.25); }

    /* Floating page-edge cue (used when whole-page scrolling) */
    .scroll-cue-page {
      position: fixed; left: 50%; top: 14px;
      transform: translateX(-50%);
      z-index: 998; pointer-events: none;
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(58,240,208,0.18), rgba(192,132,252,0.18));
      border: 1px solid rgba(58,240,208,0.55);
      color: var(--text);
      font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25), 0 0 24px rgba(58,240,208,0.3);
      opacity: 0; animation: pageCueIn 0.22s ease-out forwards;
    }
    .scroll-cue-page.hide { animation: pageCueOut 0.22s ease-in forwards; }
    .scroll-cue-page .cue-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--brand);
      box-shadow: 0 0 12px var(--brand);
      animation: pulseDot 0.9s ease-in-out infinite;
    }
    .scroll-cue-page svg { width: 14px; height: 14px; }
    @keyframes pageCueIn  { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes pageCueOut { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -10px); } }

    /* ======== aesthetic refinements ======== */
    @keyframes heroGlow  { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes softPulse { 0%,100% { opacity: .55; transform: translate(-50%,-50%) scale(1); } 50% { opacity: .85; transform: translate(-50%,-50%) scale(1.05); } }
    @keyframes ringRotate { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    .hero-main .hero-title {

      background: linear-gradient(120deg, #e0ecf8 0%, #ffffff 30%, #3af0d0 55%, #c084fc 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 2px 12px rgba(58,240,208,0.18));
    }
    .hero-main {

      background:
        linear-gradient(180deg, rgba(12, 24, 40, 0.8), rgba(6, 14, 26, 0.72)),

    }
    .security-card h5 { margin: 0 0 4px; font-size: 14px; }
    .security-card p { margin: 0; color: var(--text-dim); font-size: 12px; line-height: 1.45; }
    .security-log { margin-top: 18px; }
    .security-log label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
    .security-log .terminal { min-height: 80px; }
    .auth-terminal::before { content: "> auth-log"; }
    .security-mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .security-mini-grid button { padding: 8px 6px; font-size: 11px; }

    /* Authorization overlay base */
    .auth-overlay {
      position: fixed; inset: 0; z-index: 3000;
      display: grid; place-items: center;
      background: rgba(2, 6, 10, 0.78);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      animation: authFadeIn 0.22s ease-out forwards;
    }
    body.light .auth-overlay { background: rgba(246, 249, 252, 0.85); }
    @keyframes authFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes authFadeOut { from { opacity: 1; } to { opacity: 0; } }
    .auth-overlay.closing { animation: authFadeOut 0.18s ease-in forwards; }

    .auth-card {
      width: min(92vw, 420px); max-width: 100%;
      padding: 24px; border: 1px solid var(--line-strong); border-radius: var(--radius);
      background: var(--panel); box-shadow: var(--shadow), 0 0 0 1px rgba(239, 68, 68, 0.12);
      animation: authCardIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes authCardIn { from { opacity: 0; transform: translateY(16px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .auth-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .auth-shield {
      width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
      background: rgba(239, 68, 68, 0.12); color: var(--bad);
    }
    .auth-shield svg { width: 20px; height: 20px; }
    .auth-title { margin: 0; font-size: 17px; font-weight: 800; }
    .auth-requester { margin: 0 0 12px; color: var(--muted); font-size: 12px; font-family: var(--mono); }
    .auth-body { color: var(--text-soft); font-size: 13px; line-height: 1.6; margin-bottom: 18px; }
    .auth-risk {
      padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid rgba(251, 191, 36, 0.25);
      background: rgba(251, 191, 36, 0.08); color: var(--warn); font-size: 12px; margin-bottom: 14px;
    }
    .auth-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .auth-actions.stacked { grid-template-columns: 1fr; }
    .auth-btn {
      padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all 0.16s ease; border: 1px solid transparent;
    }
    .auth-btn-deny { color: var(--text); background: rgba(255,255,255,0.05); border-color: var(--line); }
    .auth-btn-deny:hover { background: rgba(255,255,255,0.1); }
    .auth-btn-allow { color: #030d14; background: var(--bad); }
    .auth-btn-allow:hover { filter: brightness(1.08); }
    .auth-btn-allow:disabled { opacity: 0.55; cursor: not-allowed; }

    /* Bottom sheet variant */
    .auth-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 3000;
      padding: 18px 18px 24px;
      border-top: 1px solid var(--line-strong); border-radius: 22px 22px 0 0;
      background: var(--panel); box-shadow: 0 -18px 60px rgba(0,0,0,0.55);
      animation: sheetSlideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      max-height: 80vh; overflow: auto;
    }
    @keyframes sheetSlideUp { from { transform: translateY(110%); } to { transform: translateY(0); } }
    @keyframes sheetSlideDown { from { transform: translateY(0); } to { transform: translateY(110%); } }
    .auth-sheet.closing { animation: sheetSlideDown 0.22s ease-in forwards; }
    .auth-sheet-handle {
      width: 42px; height: 4px; border-radius: 2px; background: var(--line-strong);
      margin: 0 auto 14px;
    }
    .auth-sheet .auth-actions { margin-top: 16px; }

    /* Full-screen takeover */
    .auth-takeover {
      position: fixed; inset: 0; z-index: 3000;
      display: grid; place-items: center;
      background: var(--bg); padding: 24px;
      animation: authFadeIn 0.28s ease-out forwards;
    }
    .auth-takeover .auth-card { width: min(94vw, 460px); box-shadow: none; border-color: var(--line-strong); }

    /* Biometric variant */
    .auth-bio-ring {
      width: 72px; height: 72px; border-radius: 50%; margin: 8px auto 16px;
      border: 3px solid rgba(58, 240, 208, 0.18); border-top-color: var(--brand);
      animation: bioSpin 1.1s linear infinite;
    }
    @keyframes bioSpin { to { transform: rotate(360deg); } }
    .auth-bio-icon {
      width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 12px;
      display: grid; place-items: center;
      background: rgba(58,240,208,0.1); color: var(--brand);
    }
    .auth-bio-icon svg { width: 32px; height: 32px; }
    .auth-bio-text { text-align: center; color: var(--text-dim); font-size: 12px; margin-bottom: 18px; }

    /* PIN input */
    .auth-pin {
      display: flex; gap: 8px; justify-content: center; margin: 14px 0;
    }
    .auth-pin input {
      width: 44px; height: 52px; text-align: center; font-size: 20px; font-weight: 800;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: rgba(0,0,0,0.18); color: var(--text); outline: none;
    }
    .auth-pin input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(58,240,208,0.1); }
    body.light .auth-pin input { background: rgba(12,27,46,0.04); }

    /* Risk details expansion */
    .auth-risk-detail { margin-bottom: 14px; }
    .auth-risk-detail summary {
      cursor: pointer; padding: 10px 12px; border-radius: var(--radius-sm);
      background: rgba(251, 191, 36, 0.08); color: var(--warn); font-size: 12px; font-weight: 600;
      list-style: none; position: relative;
    }
    .auth-risk-detail summary::-webkit-details-marker { display: none; }
    .auth-risk-detail summary::after {
      content: "▾"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    }
    .auth-risk-detail[open] summary::after { transform: translateY(-50%) rotate(180deg); }
    .auth-risk-detail ul {
      margin: 8px 0 0; padding: 10px 12px 10px 26px; border: 1px solid var(--line);
      border-radius: var(--radius-sm); background: rgba(0,0,0,0.1); color: var(--text-dim); font-size: 12px; line-height: 1.7;
    }

    @media (max-width: 640px) {
      .security-grid { grid-template-columns: 1fr; }
      .security-card { grid-template-columns: auto 1fr; }
      .security-card button { grid-column: 1 / -1; }
      .auth-actions { grid-template-columns: 1fr; }
    }

  </style>
</head>
