  <script>
    const modules = {overview:{title:"把 EDA 流程学成一条线",lead:"从逻辑门、Verilog、仿真验证，到综合、布局布线和签核检查，用交互练习理解芯片设计工具链。",contentTitle:"推荐学习路径",contentDesc:"先建立数字电路与 HDL 的基本语感，再理解 EDA 工具如何把 RTL 逐步变成可制造的版图。",html:`<div class="module-list">${[["01","数字逻辑","掌握布尔代数、门电路、组合逻辑与时序逻辑。","基础"],["02","Verilog HDL","用模块化方式描述硬件行为，理解 wire、reg、always、assign。","编码"],["03","仿真验证","写 testbench，观察波形，定位功能错误。","验证"],["04","逻辑综合","把 RTL 转成门级网表，学习时钟、面积和功耗约束。","工具流"],["05","布局布线","理解 floorplan、placement、routing 与时序收敛。","后端"],["06","签核检查","用 STA、DRC、LVS 确认设计能工作且能制造。","收尾"]].map(item=>`<div class="module"><div class="module-num">${item[0]}</div><div><h4>${item[1]}</h4><p>${item[2]}</p></div><span class="pill">${item[3]}</span></div>`).join("")}</div><div class="lesson-body" data-level="L1"><h4>学习目标<span class="level-badge level-l1">L1</span></h4><ul><li>能解释 RTL 到 GDSII 的主要阶段。</li><li>能写简单 Verilog 模块和 testbench。</li><li>能读懂基本真值表、波形和时序约束。</li><li>知道 DRC、LVS、STA 分别解决什么问题。</li></ul></div><div class="roadmap"><div class="roadmap-step"><strong>第 1-2 周</strong><span>数字逻辑、真值表、组合逻辑和寄存器。</span></div><div class="roadmap-step"><strong>第 3-4 周</strong><span>Verilog 模块、testbench、波形阅读。</span></div><div class="roadmap-step"><strong>第 5-6 周</strong><span>综合约束、时序报告、面积功耗取舍。</span></div><div class="roadmap-step"><strong>第 7-8 周</strong><span>布局布线、DRC、LVS、STA 签核。</span></div></div><div class="lesson-body" data-level="L2"><h4>结课小项目<span class="level-badge level-l2">L2</span></h4><p>实现一个 4 位计数器：写 RTL、写 testbench、观察波形，再说明综合和签核阶段会检查哪些问题。</p></div>`},logic:{title:"数字逻辑",lead:"EDA 的输入不是普通软件代码，而是硬件结构和时序行为。数字逻辑是所有芯片设计工具的共同语言。",contentTitle:"数字逻辑核心",contentDesc:"先学会把需求拆成输入、输出、状态和时钟，再考虑如何用硬件实现。",html:`<div class="lesson-body" data-level="L1"><h4>布尔代数基础<span class="level-badge level-l1">L1</span></h4><p>所有数字电路都可以用布尔代数描述。核心定律：</p><ul><li><b>交换律</b>：A + B = B + A，A · B = B · A</li><li><b>结合律</b>：(A + B) + C = A + (B + C)</li><li><b>分配律</b>：A · (B + C) = A · B + A · C</li><li><b>德摩根律</b>：~(A · B) = ~A + ~B，~(A + B) = ~A · ~B</li><li><b>同一律</b>：A + 0 = A，A · 1 = A</li><li><b>互补律</b>：A + ~A = 1，A · ~A = 0</li></ul></div><div class="lesson-body" data-level="L1"><h4>卡诺图化简<span class="level-badge level-l1">L1</span></h4><p>卡诺图（Karnaugh Map）是一种图形化布尔表达式化简方法。将真值表按格雷码顺序排列成二维网格，相邻方格仅有一位不同。圈出相邻的 1，每次圈 2<sup>n</sup> 个方格，写出对应的乘积项，即可得到最简与或式。</p><p><b>示例</b>：三变量函数 F(A,B,C) = Σ(1,2,3,6,7)，在卡诺图上圈出后得到 F = B + A·C。</p></div><div class="lesson-body" data-level="L1"><h4>重点概念<span class="level-badge level-l1">L1</span></h4><ul><li>组合逻辑：当前输出只取决于当前输入，例如加法器、译码器、多路选择器、编码器。</li><li>时序逻辑：输出还取决于历史状态，例如寄存器、计数器、移位寄存器、状态机。</li><li>时钟边沿：同步电路通常在时钟上升沿或下降沿更新状态。</li><li>建立时间（Setup Time）：数据必须在时钟边沿之前稳定保持的最小时间。</li><li>保持时间（Hold Time）：数据必须在时钟边沿之后继续保持的最小时间。</li><li>传播延迟（t<sub>pd</sub>）：输入变化到输出稳定之间的延迟。</li><li>污染延迟（t<sub>cd</sub>）：输入变化到输出开始变化的最短延迟。</li></ul></div><div class="lesson-body" data-level="L2"><h4>状态机：Moore 与 Mealy<span class="level-badge level-l2">L2</span></h4><ul><li><b>Moore 状态机</b>：输出仅取决于当前状态。输出变化与时钟同步，更稳定，但状态数可能更多。</li><li><b>Mealy 状态机</b>：输出取决于当前状态和当前输入。输出可能异步变化，状态数更少。</li><li>状态编码：二进制编码、独热码（One-hot）、格雷码各有优劣。FPGA 通常偏好独热码。</li></ul></div><div class="lesson-body" data-level="L2"><h4>竞争冒险与毛刺<span class="level-badge level-l2">L2</span></h4><ul><li><b>静态-0 冒险</b>：输出本应保持 0，却出现正向毛刺。原因是不同路径延迟导致信号到达时间不同。</li><li><b>静态-1 冒险</b>：输出本应保持 1，却出现负向毛刺。同样由路径延迟差异引起。</li><li><b>动态冒险</b>：输出从 0 变为 1（或 1 变为 0）时，在稳定前出现多次翻转。</li><li><b>消除方法</b>：添加冗余项（consensus term）覆盖冒险条件；在卡诺图中添加额外质蕴含项；使用同步输出寄存器。</li></ul></div><div class="lesson-body" data-level="L2"><h4>时序约束基础<span class="level-badge level-l2">L2</span></h4><ul><li><b>建立时间余量</b>：<code>setup_slack = T_clk - T_clk2q - T_comb_max - T_setup + T_skew</code></li><li><b>保持时间余量</b>：<code>hold_slack = T_clk2q + T_comb_min - T_hold - T_skew</code></li><li><b>最大频率</b>：<code>f_max = 1 / (T_clk2q + T_comb_max + T_setup + T_skew)</code></li><li><b>时钟偏斜</b>：时钟到达不同寄存器的时间差异。正偏斜有利于建立时间，不利于保持时间。</li></ul></div><div class="lesson-body" data-level="L3"><h4>异步电路设计考量<span class="level-badge level-l3">L3</span></h4><ul><li><b>同步器</b>：将异步信号通过两级寄存器同步到本地时钟域，降低亚稳态概率。</li><li><b>MTBF</b>：Mean Time Between Failures，同步器的平均无故障时间。与时钟频率、数据变化率和同步级数有关。</li><li><b>多级同步器</b>：两级触发器是最常见的同步器，每增加一级，MTBF 呈指数级提升。</li><li><b>异步 FIFO</b>：用格雷码指针实现跨时钟域数据传输，避免多比特信号同时变化。</li></ul></div><div class="lesson-body" data-level="L1"><h4>练习<span class="level-badge level-l1">L1</span></h4><p>用右侧真值表工具分别查看 AND、OR、XOR。想一想：为什么 XOR 常用于加法器的 sum 位？尝试用德摩根律推导 NAND 如何实现任意逻辑。</p></div>`},hdl:{title:"Verilog HDL",lead:"Verilog 描述的是硬件，不是逐行执行的软件。一个模块可以同时有很多逻辑并行工作。",contentTitle:"从 RTL 开始",contentDesc:"RTL 表示寄存器传输级描述，重点是每个时钟周期数据如何在寄存器之间流动。",html:`<div class="lesson-body" data-level="L1"><h4>最小模块<span class="level-badge level-l1">L1</span></h4><div class="terminal">module mux2(input a, input b, input sel, output y);\nassign y = sel ? b : a;\nendmodule</div><ul><li><code>module</code> 定义硬件模块边界。</li><li><code>input</code> 和 <code>output</code> 定义端口。</li><li><code>assign</code> 常用于连续组合逻辑。</li><li><code>always @(posedge clk)</code> 常用于时序逻辑。</li></ul></div><div class="lesson-body" data-level="L1"><h4>wire vs reg 详解<span class="level-badge level-l1">L1</span></h4><ul><li><b>wire</b>：连线类型，表示硬件中的物理连线，不能保存状态。用于 <code>assign</code> 连续赋值或模块端口连接。</li><li><b>reg</b>：存储单元，表示可以保存值的变量。在 <code>always</code> 块中赋值必须用 reg 类型。</li><li>关键区分：<code>reg</code> 不一定会综合成寄存器——组合逻辑 always 块中的 reg 综合后仍是组合电路。</li><li>记忆口诀：<b>assign 用 wire，always 用 reg</b>。</li></ul></div><div class="lesson-body" data-level="L2"><h4>阻塞赋值 vs 非阻塞赋值<span class="level-badge level-l2">L2</span></h4><ul><li><b>阻塞赋值 =</b>：顺序执行，赋值立即生效，后续语句看到新值。适合组合逻辑 <code>always @(*)</code>。</li><li><b>非阻塞赋值 <=</b>：并发更新，所有右侧表达式先求值，在时间步结束时统一赋值。适合时序逻辑 <code>always @(posedge clk)</code>。</li><li>错误示例：时序逻辑中用 = 可能导致仿真与综合行为不一致（race condition）。</li><li>核心规则：<b>时序逻辑用 <=，组合逻辑用 =</b>。两者绝不混用在同一 always 块中。</li></ul></div><div class="lesson-body" data-level="L2"><h4>参数化模块<span class="level-badge level-l2">L2</span></h4><ul><li><b>parameter</b>：模块级常量，可在例化时通过 <code>#(.WIDTH(16))</code> 覆盖，实现可配置设计。</li><li><b>localparam</b>：模块内部常量，不可从外部覆盖，用于派生参数或内部计算。</li><li><b>defparam</b>：传统参数覆盖方式（不推荐），现代代码建议使用命名参数传递。</li><li>示例：<code>parameter WIDTH = 8;</code> 定义一个可配置位宽，复用同一模块处理不同数据宽度。</li></ul></div><div class="lesson-body" data-level="L2"><h4>generate 语句<span class="level-badge level-l2">L2</span></h4><ul><li><b>generate-for</b>：批量例化相同模块（如多通道处理、总线slice）。编译器在综合前展开为多个实例。</li><li><b>generate-if</b>：根据参数条件选择不同硬件结构（如不同数据宽度的实现）。</li><li><b>generate-case</b>：多分支条件选择，适合多模式配置。</li><li>典型场景：<code>genvar i; generate for (i=0; i<8; i=i+1) begin : gen_blk ... end endgenerate</code></li></ul></div><div class="lesson-body" data-level="L2"><h4>常见编码模式<span class="level-badge level-l2">L2</span></h4><ul><li><b>FSM 三段式模板</b>：第一段——时序逻辑做状态跳转；第二段——组合逻辑计算下一状态；第三段——描述输出逻辑。三段分离、结构清晰、易于维护。</li><li><b>流水线寄存器</b>：在组合逻辑路径中插入寄存器，将长路径切分为多级短路径，提升时钟频率。代价是增加延迟（latency）和面积。</li><li><b>握手协议</b>：valid/ready 信号对，发送方置 valid，接收方置 ready，双方同时为高时完成一次传输。</li></ul></div><div class="lesson-body" data-level="L3"><h4>时序违例与修复<span class="level-badge level-l3">L3</span></h4><ul><li><b>建立时间违例</b>：数据到达太晚。修复方法：减少组合逻辑级数、插入流水线寄存器、提高驱动强度、降低时钟频率。</li><li><b>保持时间违例</b>：数据变化太快。修复方法：增加数据路径延迟（插入 buffer）、调整时钟偏斜。</li><li><b>流水线修复</b>：在关键路径中插入寄存器，将长路径拆分为多个短路径，以吞吐量换时钟频率。</li><li><b>逻辑重构</b>：重组组合逻辑以减少关键路径延迟，例如用并行前缀结构替代串行进位链。</li></ul></div><div class="lesson-body" data-level="L3"><h4>跨时钟域 CDC 深度<span class="level-badge level-l3">L3</span></h4><ul><li><b>两级同步器</b>：<code>always @(posedge clk_b) begin sync1 <= async_in; sync2 <= sync1; end</code> —— 最基础的 CDC 同步。</li><li><b>格雷码 FIFO</b>：异步 FIFO 使用格雷码编码读写指针，每次仅变化 1 bit，减少亚稳态风险。</li><li><b>握手同步器</b>：发送域发出请求，接收域同步后应答，适用于低频控制信号。</li><li><b>CDC 验证</b>：需要在 CDC 工具中声明所有跨时钟域路径，避免遗漏导致硅后失效。</li></ul></div><div class="lesson-body" data-level="L3"><h4>综合优化技巧<span class="level-badge level-l3">L3</span></h4><ul><li><b>资源共享</b>：多个互斥操作共享同一个运算单元，减少面积。例如：<code>if (sel) result = a + b; else result = a + c;</code> 可共享一个加法器。</li><li><b>Retiming</b>：在组合逻辑间移动寄存器位置，平衡路径延迟，提高最大频率而不改变功能。</li><li><b>算子平衡</b>：重组运算树以减少关键路径，例如将 <code>(a+b)+(c+d)</code> 改为平衡树结构。</li></ul></div><div class="lesson-body" data-level="L1"><h4>常见误区<span class="level-badge level-l1">L1</span></h4><ul><li>阻塞 / 非阻塞混用：组合 always 块里误用 &lt;= 或时序 always 块里用 =，仿真器会按代码顺序执行，导致 race condition。</li><li>未声明位宽：assign y = 4&apos;b0000 + z 容易因 z 位宽不匹配产生隐式截断。</li><li>敏感列表不全：always @(a) 漏写 b，仿真与综合行为可能不一致。</li><li>case 没有 default：综合工具会推断锁存器；建议 always 加 default 分支。</li><li>initial 块在可综合代码中：initial 仅用于 testbench 初始化，综合会被忽略。</li></ul></div>`},simulation:{title:"仿真验证",lead:"仿真的目标不是证明设计永远正确，而是在进入后端流程前尽早暴露功能问题。",contentTitle:"Testbench 思维",contentDesc:"一个好的 testbench 会产生输入激励、检查输出结果，并覆盖关键边界条件。",html:`<div class="lesson-body" data-level="L1"><h4>验证流程<span class="level-badge level-l1">L1</span></h4><ul><li>写激励：给 DUT 输入不同组合、时钟和复位。</li><li>看波形：检查信号是否按预期变化。</li><li>自动检查：用 if、assert 或 scoreboard 比对期望值。</li><li>覆盖率：确认关键场景已经被测试到。</li></ul></div><div class="lesson-body" data-level="L1"><h4>Testbench 结构详解<span class="level-badge level-l1">L1</span></h4><ul><li><b>时钟生成</b>：<code>always #5 clk = ~clk;</code> 产生周期为 10 个时间单位的时钟信号。</li><li><b>复位序列</b>：初始阶段拉低复位，若干周期后释放，模拟上电复位行为。</li><li><b>激励生成</b>：用 <code>initial</code> 块按时间顺序产生输入波形，覆盖典型值、边界值和随机值。</li><li><b>自检比对器</b>：在 testbench 中用 <code>if (output !== expected)</code> 自动报错，避免人工看波形。</li><li><b>$display / $monitor</b>：<code>$display</code> 即时打印，<code>$monitor</code> 在信号变化时自动输出，辅助调试。</li></ul></div><div class="lesson-body" data-level="L2"><h4>覆盖率类型<span class="level-badge level-l2">L2</span></h4><ul><li><b>代码覆盖率</b>：行覆盖率（line）、分支覆盖率（branch）、条件覆盖率（condition）、翻转覆盖率（toggle），衡量 RTL 代码被测试执行的充分程度。</li><li><b>功能覆盖率</b>：<code>covergroup</code> 定义覆盖率模型，<code>coverpoint</code> 指定关注的信号和仓（bin），验证功能场景是否被覆盖。</li><li><b>断言覆盖率</b>：基于 SVA 断言的覆盖统计，检查关键时序行为是否被触发过。</li></ul></div><div class="lesson-body" data-level="L2"><h4>SystemVerilog 断言 (SVA) 入门<span class="level-badge level-l2">L2</span></h4><ul><li><b>sequence</b>：定义信号随时间变化的序列模式，如 <code>a ##1 b</code> 表示 a 有效后一个周期 b 有效。</li><li><b>property</b>：封装 sequence 和时序关系，支持 implication（<code>|-></code>）和重叠 implication（<code>|=></code>）。</li><li><b>assert</b>：检查 property 是否成立，违例时报告错误。用于形式验证和动态仿真。</li><li><b>cover</b>：记录 property 是否被触发过，用于覆盖率收集。</li></ul></div><div class="lesson-body" data-level="L2"><h4>UVM 方法论简介<span class="level-badge level-l2">L2</span></h4><ul><li><b>uvm_agent</b>：封装 driver、monitor 和 sequencer，代表一个接口的验证组件。</li><li><b>uvm_driver</b>：从 sequencer 获取 transaction，按接口时序驱动到 DUT 引脚。</li><li><b>uvm_monitor</b>：被动观察 DUT 接口信号，收集 transaction 发送给 scoreboard。</li><li><b>uvm_scoreboard</b>：比对期望数据和实际输出，检查 DUT 功能是否正确。</li><li><b>sequence / virtual sequencer</b>：sequence 生成激励 transaction；virtual sequencer 协调多个 agent 的 sequence 同步。</li></ul></div><div class="lesson-body" data-level="L2"><h4>定向测试 vs 随机测试<span class="level-badge level-l2">L2</span></h4><ul><li><b>定向测试</b>：针对特定场景编写固定激励，适合验证已知功能和边界条件。简单直接，但覆盖率有限。</li><li><b>约束随机测试</b>：在约束范围内随机生成激励，能覆盖更多意外场景，发现定向测试遗漏的 bug。</li><li><b>覆盖率驱动验证</b>：用覆盖率指标指导随机测试方向，自动调整约束权重以命中未覆盖区域。</li></ul></div><div class="lesson-body" data-level="L3"><h4>UVM Sequence 详解<span class="level-badge level-l3">L3</span></h4><ul><li><b>uvm_sequence</b>：生成并发送 transaction 到 sequencer，是 UVM 激励生成的核心机制。</li><li><b>uvm_sequencer</b>：负责仲裁和路由 sequence 产生的 transaction 到 driver。</li><li><b>Virtual Sequence</b>：协调多个 sequencer 上的 sequence，实现跨接口的复杂测试场景。</li><li><b>p_sequencer</b>：通过宏 <code>&#96;uvm_declare_p_sequencer</code> 获取具体 sequencer 类型的句柄，访问 sequencer 的配置和资源。</li></ul></div><div class="lesson-body" data-level="L3"><h4>形式验证入门<span class="level-badge level-l3">L3</span></h4><ul><li><b>形式验证 vs 仿真</b>：形式验证用数学方法穷举所有可能状态，仿真只覆盖有限测试场景。</li><li><b>SVA 在形式验证中</b>：SystemVerilog Assertions 既能用于仿真检查，也能作为形式验证的属性规约。</li><li><b>有界模型检查</b>：在有限步数内穷举状态空间，检查属性是否成立。若找到反例，输出最短路径的波形。</li></ul></div><div class="lesson-body" data-level="L1"><h4>波形阅读口诀<span class="level-badge level-l1">L1</span></h4><ul><li>先看时钟：确认 clk、rst_n 状态，确认复位已释放。</li><li>再看输入：观察激励切换点，对照预期行为。</li><li>看输出变化：每一次跳变是否在时钟边沿之后一拍？</li><li>检查 X / Z 态：不定态常常是未初始化或位宽不匹配。</li><li>对照断言：所有 assertion 是否都通过？</li><li>采样覆盖率：是否还有未覆盖到的行 / 条件 / 翻转？</li></ul></div>`},synthesis:{title:"综合约束",lead:"综合工具把 RTL 转成门级网表，但工具需要你告诉它时钟、输入输出延迟和优化目标。",contentTitle:"RTL 到网表",contentDesc:"综合阶段会在功能等价的前提下，在速度、面积和功耗之间做取舍。",html:`<div class="lesson-body" data-level="L1"><h4>核心输入<span class="level-badge level-l1">L1</span></h4><ul><li>RTL：设计功能描述。</li><li>库文件：标准单元的面积、时序、功耗信息。</li><li>约束文件：时钟周期、I/O 延迟、false path、multicycle path。</li></ul></div><div class="lesson-body" data-level="L2"><h4>时序路径分类<span class="level-badge level-l2">L2</span></h4><ul><li><b>input-to-reg</b>：从输入端口到第一级寄存器的路径，受 <code>set_input_delay</code> 约束。</li><li><b>reg-to-reg</b>：寄存器到寄存器的内部路径，是时序分析的核心，受时钟周期约束。</li><li><b>reg-to-output</b>：从最后一级寄存器到输出端口的路径，受 <code>set_output_delay</code> 约束。</li><li><b>input-to-output</b>：纯组合逻辑从输入到输出的路径（无寄存器），通常用于胶合逻辑。</li></ul></div><div class="lesson-body" data-level="L2"><h4>跨时钟域 CDC 处理<span class="level-badge level-l2">L2</span></h4><ul><li><b>亚稳态</b>：信号在时钟边沿附近变化时，触发器输出可能进入不确定状态，需要时间恢复。</li><li><b>双触发器同步器</b>：两个串联触发器，将异步信号同步到目标时钟域，是单比特 CDC 的标准方案。</li><li><b>异步 FIFO</b>：用格雷码指针比较空满状态，实现多比特数据跨时钟域传输，无需握手。</li><li><b>握手协议</b>：发送方置请求，接收方响应确认，适合低频跨域传输，延迟较大但可靠。</li></ul></div><div class="lesson-body" data-level="L2"><h4>优化策略<span class="level-badge level-l2">L2</span></h4><ul><li><b>retiming 重定时</b>：在组合逻辑路径中移动寄存器位置，平衡各级延迟，不改变功能。</li><li><b>pipelining 流水线</b>：插入寄存器将长路径切分为多级，提高吞吐率，代价是增加延迟。</li><li><b>resource sharing 资源共享</b>：多个互斥操作共享同一运算单元（如加法器），减小面积。</li><li><b>operator balancing</b>：重组表达式树结构（如平衡加法树），降低关键路径深度。</li></ul></div><div class="lesson-body" data-level="L2"><h4>SDC 约束入门<span class="level-badge level-l2">L2</span></h4><ul><li><b>create_clock</b>：定义时钟源，指定周期和波形。如 <code>create_clock -period 10 [get_ports clk]</code>。</li><li><b>set_input_delay / set_output_delay</b>：约束外部逻辑到达/离开芯片的时序预算。</li><li><b>set_false_path</b>：标记不需要时序分析的路径（如异步复位、静态配置信号），避免工具浪费优化资源。</li><li><b>set_multicycle_path</b>：允许多周期路径，放宽时序约束，减少不必要的优化压力。</li></ul></div><div class="lesson-body" data-level="L2"><h4>低功耗设计技术<span class="level-badge level-l2">L2</span></h4><ul><li><b>时钟门控</b>：在寄存器不工作时关闭时钟，节省动态功耗。综合工具可自动插入门控单元。</li><li><b>电源门控</b>：关闭未使用模块的电源，节省静态漏电功耗。需要隔离单元和状态保持寄存器。</li><li><b>多阈值电压</b>：关键路径用低 Vt 单元（高速高漏电），非关键路径用高 Vt 单元（低速低漏电）。</li><li><b>DVFS</b>：动态电压频率调节，根据负载需求调整电压和频率，在性能与功耗间动态平衡。</li></ul></div><div class="lesson-body" data-level="L3"><h4>DFT 可测试性设计<span class="level-badge level-l3">L3</span></h4><ul><li><b>扫描链</b>：将所有寄存器串成移位寄存器链，测试时通过扫描链灌入测试向量并读出结果。</li><li><b>ATPG</b>：自动测试向量生成，基于故障模型（如 stuck-at 故障）自动生成覆盖率最优的测试向量。</li><li><b>BIST</b>：内建自测试，在芯片内部集成测试向量生成和结果比较逻辑，可在线测试存储器等模块。</li><li><b>JTAG 边界扫描</b>：IEEE 1149.1 标准，通过 TAP 控制器访问芯片 I/O 引脚，用于板级互连测试。</li></ul></div><div class="lesson-body" data-level="L3"><h4>多时钟域与异步路径处理<span class="level-badge level-l3">L3</span></h4><ul><li><b>set_clock_groups</b>：声明异步时钟组，告诉 STA 工具不要分析这些时钟之间的时序路径。</li><li><b>set_false_path</b>：将某些路径标记为不需要时序检查，如异步复位路径、测试模式路径。</li><li><b>异步复位处理</b>：复位释放时需要与时钟同步，避免复位释放边沿临近时钟边沿导致亚稳态。</li></ul></div><div class="lesson-body" data-level="L1"><h4>关键指标<span class="level-badge level-l1">L1</span></h4><ul><li>面积（Area）：等价门数（gate equivalent）或 um²。越小越省钱，但可能牺牲性能。</li><li>性能（Fmax / slack）：最高工作频率 / 关键路径余量。</li><li>功耗（Power）：动态功耗 + 静态功耗，单位 mW。</li><li>时序违例（Violation）：setup / hold slack 为负的路径数。</li><li>DRC / LVS 错误数：必须为 0 才能签核。</li></ul></div>`},layout:{title:"布局布线",lead:"后端设计把逻辑门放到芯片版图上，并连接金属线。物理位置会强烈影响时序、拥塞和功耗。",contentTitle:"后端流程",contentDesc:"布局布线不是简单画图，而是在物理限制下让设计满足性能和制造要求。",html:`<div class="lesson-body" data-level="L1"><h4>主要步骤<span class="level-badge level-l1">L1</span></h4><ul><li>Floorplan：规划芯片尺寸、宏单元、电源网络和 I/O。</li><li>Placement：放置标准单元，控制拥塞和线长。</li><li>CTS：构建时钟树，降低时钟偏斜。</li><li>Routing：完成信号线连接，并修复设计规则问题。</li></ul></div><div class="lesson-body" data-level="L2"><h4>Floorplan 深入<span class="level-badge level-l2">L2</span></h4><ul><li><b>宏单元布局策略</b>：SRAM、PLL 等大宏通常放在芯片边缘，留出中心区域给标准单元。宏之间需要预留布线通道。</li><li><b>电源网络规划</b>：power ring + power stripe 结构，确保每个标准单元都能获得稳定供电，减小 IR drop。</li><li><b>布线阻塞</b>：宏单元周围形成布线瓶颈，需提前规划 pin 位置和布线资源。</li><li><b>I/O pad 规划</b>：信号 pad 和电源 pad 交替排列，考虑 ESD 保护和封装 bond wire 方向。</li></ul></div><div class="lesson-body" data-level="L2"><h4>Placement 深入<span class="level-badge level-l2">L2</span></h4><ul><li><b>拥塞分析</b>：高密度区域可能导致绕线资源不足，需通过 spread 或 density screen 控制单元密度。</li><li><b>时序驱动放置</b>：关键路径上的单元应靠近放置，减少线延迟，工具会根据时序约束优化位置。</li><li><b>scan chain reorder</b>：根据物理位置重排扫描链连接顺序，减少 scan 模式下的绕线长度和拥塞。</li></ul></div><div class="lesson-body" data-level="L2"><h4>CTS 深入<span class="level-badge level-l2">L2</span></h4><ul><li><b>时钟树拓扑</b>：H-tree 适合对称布局，X-tree 减少层次，spine（鱼骨）结构适合高频设计。</li><li><b>skew 最小化</b>：通过插入缓冲器平衡不同路径延迟，目标是将时钟偏斜控制在工作频率允许范围内。</li><li><b>insertion delay 平衡</b>：确保时钟到达所有寄存器的时间尽可能一致，对 hold time 修复尤其关键。</li></ul></div><div class="lesson-body" data-level="L2"><h4>Routing 深入<span class="level-badge level-l2">L2</span></h4><ul><li><b>global routing</b>：粗粒度分配布线资源，确定信号走线的大致路径和金属层。</li><li><b>detailed routing</b>：精确到每个网格点的走线，解决 DRC 冲突，完成实际金属连线。</li><li><b>天线效应修复</b>：长金属线在制造过程中会积累电荷，需要插入天线二极管或跳层来保护栅氧。</li><li><b>DRC 自动修复</b>：工具自动检测并修复线宽、间距等制造规则违例，迭代直到 clean。</li></ul></div><div class="lesson-body" data-level="L3"><h4>ECO 工程变更<span class="level-badge level-l3">L3</span></h4><ul><li><b>功能 ECO</b>：在网表级别修改逻辑功能，利用备用单元（spare cell）实现，避免重新走完整流程。</li><li><b>时序 ECO</b>：修复时序违例，通过插入 buffer、调整驱动强度、交换 VT 类型等方式。</li><li><b>Metal-Only Fix</b>：仅修改金属层，不动底层器件。成本最低、周期最短的 ECO 方式。</li></ul></div><div class="lesson-body" data-level="L3"><h4>IR Drop 与电源完整性<span class="level-badge level-l3">L3</span></h4><ul><li><b>静态 IR Drop</b>：平均电流在电源网络上产生的压降，导致部分区域供电电压偏低。</li><li><b>动态 IR Drop</b>：瞬态电流变化引起的电压波动，发生在时钟边沿大量寄存器同时翻转时。</li><li><b>去耦电容</b>：在电源网络插入 decap 单元，提供局部电荷缓冲，抑制动态电压降。</li></ul></div><div class="lesson-body" data-level="L3"><h4>先进工艺挑战<span class="level-badge level-l3">L3</span></h4><ul><li><b>FinFET</b>：鳍式场效应晶体管，3D 结构提供更好的栅极控制，减少短沟道效应和漏电。</li><li><b>多重曝光</b>：单次光刻分辨率不足时，将图案拆分到多个掩模上分次曝光，实现更细线宽。</li><li><b>设计规则爆炸</b>：先进工艺的设计规则数量呈指数增长，DRC 检查成为流程瓶颈。</li></ul></div><div class="lesson-body" data-level="L1"><h4>直觉<span class="level-badge level-l1">L1</span></h4><ul><li>布局布线 = 真实版图。综合只看逻辑，PnR 才看物理。</li><li>关键路径来自组合深度，floorplan 影响拥塞和时序。</li><li>CTS 决定时钟偏斜，placement 决定线长，routing 决定信号完整性。</li><li>时序收敛是迭代过程：估算 → 实现 → 分析 → 修 ECO → 收敛。</li></ul></div>`},signoff:{title:"签核检查",lead:"签核是流片前的最后防线：功能要等价，时序要满足，版图要可制造。",contentTitle:"DRC、LVS、STA",contentDesc:"不同检查面向不同风险，任何一类严重问题都可能导致芯片失败。",html:`<div class="lesson-body" data-level="L1"><h4>三类检查<span class="level-badge level-l1">L1</span></h4><ul><li>DRC：Design Rule Check，检查版图是否符合工艺制造规则。</li><li>LVS：Layout Versus Schematic，检查版图连接是否等价于原理图或网表。</li><li>STA：Static Timing Analysis，静态时序分析，检查所有路径是否满足时序。</li></ul></div><div class="lesson-body" data-level="L2"><h4>STA 深入<span class="level-badge level-l2">L2</span></h4><ul><li><b>时序弧</b>：从一个节点到另一个节点的延迟关系，包括 cell delay（单元内部）和 net delay（连线延迟）。</li><li><b>时钟不确定性</b>：包含 clock jitter（随机抖动）和 clock skew（空间偏差），STA 用 uncertainty 统一建模。</li><li><b>OCV 片上变异</b>：同一芯片不同区域因工艺偏差导致延迟差异，STA 通过 timing derate 为不同路径设定缩放因子。</li><li><b>timing derate</b>：对 launch 和 capture 时钟路径分别应用不同的延迟缩放因子，建模最差情况。</li><li><b>multi-corner multi-mode</b>：在不同 PVT（工艺、电压、温度）条件和不同工作模式下分别进行 STA，确保全场景覆盖。</li></ul></div><div class="lesson-body" data-level="L2"><h4>IR Drop 与 EM<span class="level-badge level-l2">L2</span></h4><ul><li><b>IR Drop 电源压降</b>：电流流过电源网络电阻产生的电压降，过大的 IR drop 导致标准单元供电不足、时序恶化。</li><li><b>EM 电迁移</b>：高电流密度下金属原子迁移，长期可能导致连线断路或短路。需检查电流密度是否超过工艺限制。</li><li><b>信号完整性</b>：包括串扰（crosstalk）、地弹（ground bounce）和电源噪声，影响信号质量和时序。</li><li><b>串扰</b>：相邻走线之间的电容耦合导致信号跳变干扰，可能引起 delta delay 或 glitch。</li></ul></div><div class="lesson-body" data-level="L2"><h4>形式等价性验证 LEC<span class="level-badge level-l2">L2</span></h4><ul><li><b>组合等价性</b>：检查 RTL 与综合后网表的组合逻辑是否等价。用 SAT/BBD 算法比对两个电路。</li><li><b>时序等价性</b>：检查带状态元素的电路是否等价，需考虑寄存器映射和重定时变换。</li><li><b>应用场景</b>：RTL vs 综合网表、综合网表 vs 布局后网表、ECO 前后比对。</li></ul></div><div class="lesson-body" data-level="L3"><h4>信号完整性 SI 分析<span class="level-badge level-l3">L3</span></h4><ul><li><b>Crosstalk Delay</b>：相邻线同时翻转时，耦合电容改变等效负载，导致延迟变化。</li><li><b>Crosstalk Noise/Glitch</b>：攻击线翻转时，在受害线上耦合出毛刺。毛刺幅度足够大可能导致逻辑错误。</li><li><b>Victim/Aggressor</b>：受害线（victim）受攻击线（aggressor）的耦合影响。</li><li><b>修复方法</b>：增加线间距、插入屏蔽线、调整驱动强度、减少并行长度。</li></ul></div><div class="lesson-body" data-level="L3"><h4>ESD 与可靠性<span class="level-badge level-l3">L3</span></h4><ul><li><b>ESD 保护</b>：静电放电保护电路，防止制造、封装和使用过程中的静电损坏。</li><li><b>Latch-up</b>：CMOS 寄生的 PNPN 结构触发闩锁效应，导致大电流和器件损坏。</li><li><b>NBTI</b>：负偏压温度不稳定性，PMOS 阈值电压随时间漂移，导致性能退化。</li><li><b>HCI</b>：热载流子注入，NMOS 中的高能载流子注入栅氧层，导致阈值电压漂移。</li></ul></div><div class="lesson-body" data-level="L1"><h4>学习建议<span class="level-badge level-l1">L1</span></h4><ul><li>先掌握 STA 报告阅读：slack、path group、derate、uncertainty。</li><li>了解 SDC 中 create_clock、set_input_delay、set_output_delay 的语义。</li><li>对 ECO 流程建立完整心智模型：哪一步改、哪一步验证、哪一步签核。</li><li>对 SI / EM 至少了解原理，不需要手算，但需要能读报告。</li><li>重点理解 LEC 的 compare point 概念，能区分组合 / 时序等价性。</li></ul></div>`},lab:{title:"交互实验室",lead:"用小工具把抽象概念变成可观察的输入和输出。",contentTitle:"小型网表挑战",contentDesc:"根据输入表达式，判断它代表什么电路。",html:`<div class="lesson-body" data-level="L1"><h4>挑战 1<span class="level-badge level-l1">L1</span></h4><p><code>assign y = (a & ~b) | (~a & b);</code></p><p>这其实是 XOR 的结构化写法：当 a、b 不相等时输出 1。</p></div><div class="lesson-body" data-level="L1"><h4>挑战 2<span class="level-badge level-l1">L1</span></h4><p><code>always @(posedge clk) q &lt;= d;</code></p><p>这表示一个 D 触发器：每个时钟上升沿把 d 采样到 q。</p></div><div class="lesson-body" data-level="L1"><h4>挑战 3<span class="level-badge level-l1">L1</span></h4><p><code>always @(posedge clk) if (en) q &lt;= d;</code></p><p>带使能的 D 触发器：en 为高时，时钟沿采样 d 到 q；en 为低时 q 保持原值。综合后会在 D 触发器前加一个 MUX 选择反馈路径。</p></div><div class="lesson-body" data-level="L2"><h4>挑战 4<span class="level-badge level-l2">L2</span></h4><p>三段式 FSM 状态机模板：</p><div class="terminal">// 第一段：状态跳转\nalways @(posedge clk or negedge rst_n)\n  if (!rst_n) state <= IDLE;\n  else state <= next_state;\n// 第二段：下一状态逻辑\nalways @(*) case (state)\n  IDLE: next_state = (start) ? WORK : IDLE;\n  ...\nendcase\n// 第三段：输出逻辑\nalways @(posedge clk) begin\n  case (state) ... endcase\nend</div><p>三段分离：状态寄存器、组合逻辑计算下一状态、输出逻辑各自独立，结构清晰且易于时序收敛。</p></div><div class="lesson-body" data-level="L2"><h4>挑战 5<span class="level-badge level-l2">L2</span></h4><p><code>assign prod = a * b;</code> —— 流水线乘法器的时序优化思路：</p><p>直接组合乘法器路径长、频率低。优化方法：在乘法器中间插入寄存器，将乘法分解为多级流水（如 Booth 编码 + Wallace 树 + 最终加法），每级由寄存器隔开，吞吐率提升但延迟增加 3-5 周期。</p></div><div class="lesson-body" data-level="L3"><h4>挑战 6：交通灯控制器 FSM<span class="level-badge level-l3">L3</span></h4><p>设计一个三状态交通灯控制器：RED（红灯 30s）→ GREEN（绿灯 25s）→ YELLOW（黄灯 5s）→ RED。提示：</p><ul><li>用计数器在状态内计时。</li><li>状态跳转条件：计数器达到该状态的持续时间。</li><li>输出：三位的灯信号。</li><li>思考：如何让持续时间可配置？</li></ul></div>`},quiz:{title:"阶段测验",lead:"用几个小题检查你是否理解 EDA 的基本流程和核心术语。",contentTitle:"即时测验",contentDesc:"选择答案后会立即显示解释，得分会计入学习进度。",html:`<button class="secondary" id="resetQuiz" style="margin-bottom:4px">重新开始测验</button><div id="quizSummary"></div><div id="quizArea"></div>`},glossary:{title:"术语卡片",lead:"点击卡片查看解释，快速建立 EDA 术语表。",contentTitle:"常用术语",contentDesc:"这些词会频繁出现在芯片设计课程、工具报告和项目讨论里。",html:`<div class="flashcards">${[["RTL","Register Transfer Level，描述寄存器之间数据如何流动的硬件抽象层级。"],["DUT","Design Under Test，被测试的设计模块，通常由 testbench 驱动。"],["Netlist","门级网表，描述标准单元实例以及它们之间的连接。"],["Slack","时序裕量。正数表示满足时序，负数表示时序违例。"],["DRC","设计规则检查，确认版图满足制造工艺的几何规则。"],["LVS","版图与网表一致性检查，确认物理连接没有接错或漏接。"],["CDC","Clock Domain Crossing，跨时钟域。当信号在不同时钟域之间传递时，需要同步器防止亚稳态。"],["OCV","On-Chip Variation，片上工艺变异。同一芯片不同区域的晶体管延迟可能不同，STA 需用 derate 建模。"],["CTS","Clock Tree Synthesis，时钟树综合。构建从时钟源到所有寄存器的缓冲树，控制时钟偏斜和延迟。"],["Metastability","亚稳态。触发器在 setup/hold 违例时输出可能进入不确定状态，需要时间恢复。"],["Fanout","扇出。一个逻辑门输出驱动多少个后续门的输入，影响延迟和驱动能力。"],["Slew","信号翻转速率（上升/下降时间）。过慢的 slew 会导致短路功耗和时序问题。"]].map(([term,desc])=>`<div class="flashcard" onclick="this.querySelector('p').classList.toggle('hidden')"><strong>${term}</strong><p class="hidden">${desc}</p><span class="pill">点击显示/隐藏</span></div>`).join("")}</div>`}};

    Object.assign(modules, {
      security: {
        title: "授权弹窗设计",
        lead: "针对手机环境的安全授权提示，提供多种固定、不可旁路、防误触的弹窗方案，供对比与选用。",
        contentTitle: "授权弹窗方案库",
        contentDesc: "点击任意方案卡片中的「演示」按钮，体验不同授权提示的交互与视觉表现。所有弹窗均设计为不可通过点击遮罩、返回键或空白处关闭。",
        html: `<div class="lesson-body" data-level="L1"><h4>设计原则<span class="level-badge level-l1">L1</span></h4><p>授权弹窗是「用户意图确认」的最后一道防线。手机环境下，好的授权提示必须同时满足三点：视觉层级最高、无法被轻易绕过、操作语义明确。</p><ul><li><b>固定焦点</b>：弹窗出现后，焦点被锁定在弹窗内部，其他区域不可交互。</li><li><b>不可旁路</b>：禁止通过点击遮罩、返回键、系统手势或外部脚本关闭。</li><li><b>风险可见</b>：在确认前清晰展示操作类型、请求者和潜在后果。</li><li><b>最小授权</b>：只请求当前操作所需权限，避免一次性索取过多。</li></ul></div>
        <div class="lesson-body" data-level="L2"><h4>六种备选方案<span class="level-badge level-l2">L2</span></h4><p>下面提供六种可在网页中实现的授权弹窗交互模式。每个方案都考虑了手机端单手操作、误触预防和视觉一致性。</p>
        <div class="security-grid">
          <div class="security-card" data-scheme="modal"><div class="security-icon">A</div><div><h5>系统模态居中</h5><p>经典居中弹窗，深色高斯模糊遮罩，仅允许「允许 / 拒绝」二选一。</p></div><button class="secondary" data-demo="modal">演示</button></div>
          <div class="security-card" data-scheme="sheet"><div class="security-icon">B</div><div><h5>底部固定抽屉</h5><p>从底部滑出的半屏卡片，贴合手机拇指热区，支持上滑展开详情。</p></div><button class="secondary" data-demo="sheet">演示</button></div>
          <div class="security-card" data-scheme="2fa"><div class="security-icon">C</div><div><h5>双因子确认</h5><p>需要输入 PIN 并二次点击确认，适合高风险操作（如安装配置、病毒库更新）。</p></div><button class="secondary" data-demo="2fa">演示</button></div>
          <div class="security-card" data-scheme="risk"><div class="security-icon">D</div><div><h5>风险详情卡片</h5><p>默认折叠风险摘要，点击展开完整说明，强制阅读后才能确认。</p></div><button class="secondary" data-demo="risk">演示</button></div>
          <div class="security-card" data-scheme="biometric"><div class="security-icon">E</div><div><h5>生物识别模拟</h5><p>模拟指纹 / 面容识别的系统级弹窗样式，强调「本人操作」。</p></div><button class="secondary" data-demo="biometric">演示</button></div>
          <div class="security-card" data-scheme="takeover"><div class="security-icon">F</div><div><h5>全屏接管</h5><p>完全覆盖当前页面，隐藏所有其他 UI，适合最高敏感度的阻断式授权。</p></div><button class="secondary" data-demo="takeover">演示</button></div>
        </div>
        <div class="security-log"><label>事件日志</label><div class="terminal auth-terminal" id="authLog"></div></div>
        </div>
        <div class="lesson-body" data-level="L3"><h4>实现要点<span class="level-badge level-l3">L3</span></h4><p>在真实工程中，授权弹窗需要与浏览器 / 系统能力配合，并考虑攻击面。</p><ul><li><b>焦点陷阱</b>：使用 <code>inert</code> 或手动管理 <code>tabindex</code>，确保键盘和屏幕阅读器无法离开弹窗。</li><li><b>返回键拦截</b>：监听 <code>popstate</code> 或 <code>keydown</code> 中的 Escape / Back 键，仅允许「拒绝」关闭弹窗。</li><li><b>防点击劫持</b>：弹窗使用独立的最高层级 <code>z-index</code>，并校验触发来源是否在可视区域。</li><li><b>超时降级</b>：若用户长时间不响应，应自动拒绝而非默认允许。</li></ul></div>`
      }

    const quiz=[{q:"RTL 的主要作用是什么？",answers:["描述网页交互","描述寄存器之间的数据流动","检查版图线宽","生成芯片封装"],correct:1,exp:"RTL 是寄存器传输级描述，关注每个时钟周期数据如何在寄存器间传递。"},{q:"DRC 主要检查什么？",answers:["功能波形是否正确","版图是否符合制造规则","Verilog 语法是否漂亮","测试用例是否足够多"],correct:1,exp:"DRC 是设计规则检查，用于发现线宽、间距、重叠等制造规则问题。"},{q:"下面哪个语句常用于组合逻辑连续赋值？",answers:["assign","posedge","initial forever","endmodule only"],correct:0,exp:"assign 常用于连续赋值，适合简单组合逻辑。"},{q:"STA 中 slack 为负通常意味着什么？",answers:["面积太小","路径时序不满足","复位信号太多","模块没有端口"],correct:1,exp:"负 slack 表示数据到达太晚或约束过紧，需要修复时序。"},{q:"建立时间（setup time）描述的是什么？",answers:["时钟频率上限","数据在时钟边沿前必须稳定的时间","芯片面积","功耗上限"],correct:1,exp:"setup time 是数据在时钟有效边沿到达之前必须保持稳定的最小时间。"},{q:"Moore 状态机与 Mealy 状态机的主要区别是什么？",answers:["Moore 有状态 Mealy 没有","Moore 输出仅依赖状态，Mealy 输出依赖状态和输入","Moore 更快","两者完全相同"],correct:1,exp:"Moore 的输出仅取决于当前状态；Mealy 的输出同时取决于当前状态和输入，可能异步变化。"},{q:"Verilog 中，时序逻辑 always 块推荐使用哪种赋值？",answers:["阻塞赋值 =","非阻塞赋值 <=","连续赋值 assign","force 赋值"],correct:1,exp:"时序逻辑（posedge clk）中推荐使用非阻塞赋值 <=，以保证并发硬件行为。"},{q:"LVS（Layout Versus Schematic）主要检查什么？",answers:["版图颜色是否美观","版图连接是否与网表一致","版图面积是否最小","版图功耗是否达标"],correct:1,exp:"LVS 检查物理版图的器件连接是否与原始网表或原理图完全等价。"}];

    function detectDeviceProfile(){
      const root=document.documentElement;
      const w=window.innerWidth || root.clientWidth || 1024;
      const h=window.innerHeight || root.clientHeight || 768;
      const minSide=Math.min(w,h), maxSide=Math.max(w,h);
      const coarse=!!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
      const hoverNone=!!(window.matchMedia && window.matchMedia("(hover: none)").matches);
      const phoneLandscapeSize = h<=430 && w<=932;
      let device="desktop";
      if(w<=640 || phoneLandscapeSize || (coarse && minSide<=760)) device="phone";
      else if(w<=980 || (coarse && minSide<=900 && maxSide<=1280)) device="tablet";
      else if(w<=1180) device="compact";
      const orientation=w>=h?"landscape":"portrait";
      const density=(window.devicePixelRatio||1)>=1.5?"high":"normal";
      document.body.classList.remove("device-phone","device-tablet","device-compact","device-desktop","orientation-landscape","orientation-portrait","input-touch","input-mouse","density-high","density-normal");
      document.body.classList.add("device-"+device,"orientation-"+orientation,coarse||hoverNone?"input-touch":"input-mouse","density-"+density);
      document.body.dataset.device=device;
      document.body.dataset.orientation=orientation;
      document.body.dataset.pointer=coarse||hoverNone?"touch":"mouse";
      root.style.setProperty("--vh",(h*0.01)+"px");
      root.style.setProperty("--device-width",w+"px");
      return {device,orientation,pointer:document.body.dataset.pointer,width:w,height:h,density};
    }

    function renderProgress(){
      const pct=Math.round((doneSet.size/TOTAL_MODULES)*100);
      const progressText=$("progressText"),progressBar=$("progressBar"),doneCount=$("doneCount"),quizScore=$("quizScore"),nextStep=$("nextStep"),levelName=$("levelName"),achievementList=$("achievementList");
      if(progressText) progressText.textContent=pct+"%";
      if(progressBar) progressBar.style.width=pct+"%";
      if(doneCount) doneCount.textContent=doneSet.size+" / "+TOTAL_MODULES;
      if(quizScore) quizScore.textContent=rawState.score;
      const next=moduleOrder.find(n=>!doneSet.has(n));
      if(nextStep) nextStep.textContent=next?modules[next].title:"全部完成";
      const lvls=["入门者","RTL 练习生","流程掌握者","签核达人"];
      if(levelName) levelName.textContent=lvls[pct>=90?3:pct>=60?2:pct>=30?1:0];
      if(achievementList) achievementList.innerHTML=[[doneSet.size>=1,"完成第一个模块"],[pct>=50,"学习过半"],[rawState.score>=MAX_SCORE,"测验满分"],[Boolean(rawState.notes.trim()),"写下笔记"]].map(([u,t])=>`<div class="achievement${u?" unlocked":""}">${u?"✓":"○"} ${t}</div>`).join("");
      document.querySelectorAll(".nav-btn[data-module]").forEach(btn=>btn.classList.toggle("completed",doneSet.has(btn.dataset.module)));
    }

    function showRouteOverlay(name, callback) {
      const item = modules[name];
      if (!item) { callback(); return; }
      const old = document.getElementById("routeOverlay");
      if (old) old.remove();
      const ov = document.createElement("div");
      ov.className = "route-overlay";
      ov.id = "routeOverlay";
      const fromName = currentModule && modules[currentModule] ? currentModule : "overview";
      const fromTitle = currentModule && modules[currentModule] ? modules[currentModule].title : "EDA Studio";
      const total = item.html.match(/data-level="(L[123])"/g) || [];
      const lc = { L1: 0, L2: 0, L3: 0 };
      total.forEach(t => { const m = t.match(/L[123]/); if (m) lc[m[0]]++; });
      const lvlMeta = `L1 基础 ${lc.L1} · L2 进阶 ${lc.L2} · L3 高级 ${lc.L3}`;
      ov.innerHTML = `<div class="route-card">
        <div class="route-card-label">导航跳转 · Route</div>
        <div class="route-card-row">
          <span class="route-card-from">#/${fromName}</span>
          <span class="route-card-arrow"></span>
          <span class="route-card-url">#/${name}</span>
        </div>
        <div class="route-card-title">${item.title}</div>
        <div class="route-card-meta">${lvlMeta}</div>
        <div class="route-spinner"><span></span><span></span><span></span></div>
        <div class="route-progress-bar"><div></div></div>
      </div>`;
      document.body.appendChild(ov);
      const bar = $("routeBar");
      if (bar) { bar.classList.remove("active"); void bar.offsetWidth; bar.classList.add("active"); setTimeout(() => bar.classList.remove("active"), 900); }
      // Longer hold so user clearly sees the transition; total ~620ms
      setTimeout(() => { ov.classList.add("hide"); setTimeout(() => { ov.remove(); callback(); }, 220); }, 480);
    }

        synthesis:{title:"逻辑综合的初识",level:"L1",body:"综合是把 RTL 翻译成门级网表的过程。初学者要理解：同样的 RTL，在不同约束下会得到不同的电路；面积、速度、功耗是综合时最常见的三个目标。",formulas:[["Area","电路占用的硅片面积"],["Timing","信号从输入到输出允许的最大延迟"],["Power","电路消耗的功耗"],["Clock constraint","告诉综合器时钟频率的约束"]],questions:["综合和编译普通程序有什么不同？","为什么提高时钟频率通常会让电路变大？","面积、速度、功耗之间为什么要权衡？","如果综合报告出现负 slack，说明什么问题？"]},
        layout:{title:"物理设计的初识",level:"L1",body:"布局布线把门级网表「画」到芯片上。初学者要理解：标准单元摆在行里，然后用金属线连接它们；floorplan 决定大局，placement 决定位置，routing 决定连线。",formulas:[["Standard cell","预先设计好的小逻辑单元库"],["Floorplan","芯片面积的大致划分"],["Placement","把单元放到芯片上的位置"],["Routing","用金属线连接所有单元"]],questions:["为什么门电路不能直接堆在一起，而要按行摆放？","floorplan 和 placement 的区别是什么？","布线拥塞会对设计产生什么影响？","为什么物理版图越紧凑，时序越难保证？"]},
        signoff:{title:"签核检查的初识",level:"L1",body:"签核是在流片前确认设计「真的能做出来」。初学者先记住三大检查：DRC 检查制造规则，LVS 检查版图与网表是否一致，STA 检查时序是否满足。",formulas:[["DRC","设计规则检查：线宽、间距等"],["LVS","版图与电路图一致性检查"],["STA","静态时序分析：检查所有路径的延迟"],["Corner","不同工艺、电压、温度条件的组合"]],questions:["为什么仿真通过还不够，还要做 STA？","DRC 和 LVS 分别检查什么？","什么是 PVT corner，为什么要检查多个 corner？","签核三大检查中，哪一项和「能不能制造」最直接相关？"]},
        lab:{title:"实验学习的初识",level:"L1",body:"实验课不是「跑通就行」，而是把纸上的设计和工具结果对照起来。初学者应养成记录输入、输出和异常的习惯，让实验结果可以被他人复现。",formulas:[["Truth table","列出输入与输出所有组合的表"],["Schematic","用符号表示电路连接关系的图"],["Waveform","信号随时间变化的波形图"],["Log","工具运行时的输出记录"]],questions:["为什么同一个逻辑可以用真值表、表达式和电路图三种方式表示？","实验记录应该包含哪些关键信息？","当仿真结果和预期不一致时，应该先看什么？","一份可复现的实验报告对团队协作有什么价值？"]},
        quiz:{title:"测验复习的初识",level:"L1",body:"测验不只是检查记忆，更是帮我们定位哪里没真正理解。初学阶段建议把错题按概念、计算、设计三类分类整理，形成个人补漏清单。",formulas:[["Concept","需要准确复述的定义或术语"],["Calculation","需要按步骤计算的逻辑函数或时序"],["Design","需要从需求出发画出电路或写出代码"],["Review cycle","学习 → 测验 → 错题 → 再学习"]],questions:["为什么一道题做错后，光看答案往往不够？","如何把错题变成下一次复习的重点？","用自己的话讲清一个概念为什么很重要？","考前复习时，「一页速查」应该怎么整理？"]},
        glossary:{title:"术语学习的初识",level:"L1",body:"EDA 术语很多，初学时不要孤立背诵。建议按「主题」分组记忆，例如逻辑门类、时序类、流程类、签核类，并在每个术语旁补充一个使用场景。",formulas:[["Term","一个概念的名称"],["Definition","用一句话说明它是什么"],["Scenario","一个使用该概念的具体场景"],["Related terms","一组相关的术语"]],questions:["为什么同一个英文术语在不同教材里中文翻译不同？","记忆术语时，只背定义有什么问题？","如何用语义网络把多个术语联系起来？","为一个你刚学会的术语写一句教材式定义。"]},
        security:{title:"授权弹窗的初识",level:"L1",body:"授权弹窗是让用户明确确认敏感操作的交互组件。手机环境下，它的核心不是「美观」，而是「不可绕过」和「意图明确」。",formulas:[["Modal","模态弹窗：强制用户必须先响应弹窗才能操作其他内容"],["Non-dismissible","不可关闭：不能通过点击遮罩、返回键或外部脚本绕过"],["Least privilege","最小权限：只请求当前操作所需授权"],["Timeout deny","超时拒绝：无响应时默认拒绝而非允许"]],questions:["为什么授权弹窗不能被点击遮罩关闭？","「允许」和「拒绝」按钮在视觉设计上应该注意什么？","为什么高风险操作需要二次确认或 PIN？","手机环境下底部抽屉弹窗有什么优势？"]}
      };
      const b=blocks[name]||blocks.overview;
      return `<div class="lesson-body academic-block academic-primary" data-level="${b.level}">

        <div class="formula-grid">${b.formulas.map(([f,d])=>`<div class="formula-card"><code>${f}</code><span>${d}</span></div>`).join("")}</div>
        <ul class="research-questions">${b.questions.map(q=>`<li>${q}</li>`).join("")}</ul>
      </div>`;
    }

        hdl:{title:"对齐 Verilog 数字系统设计教程",level:"L2",chapter:"从模块、端口、数据类型、连续赋值、过程块开始，再进入组合逻辑建模、时序逻辑建模、状态机、testbench 与常用 IP 例化。",example:"典型例题：把教材中的译码器、选择器、计数器和状态机例题改写为可综合 Verilog，并写 testbench 检查波形，再用综合器观察综合报告。",exercise:["分别用 assign 和 always @(*) 描述二选一选择器。","写一个带同步复位的 4 位计数器。","为状态机写一个覆盖全部状态转移的 testbench。","用 generate 块实现一个参数化的 N 位加法器。"]},

        layout:{title:"连接数字集成电路设计课程",level:"L3",chapter:"布局布线属于数字集成电路设计和 ASIC 设计流程内容，常与 CMOS 工艺、标准单元、互连延迟、时钟树和功耗分析一起学习。",example:"典型例题：观察同一网表在不同利用率下的拥塞变化，说明 floorplan 对后续布线和时序的影响；再比较宏单元摆放位置对时钟偏移的影响。",exercise:["解释标准单元行、宏单元和电源网络的作用。","说明线长增加为什么会影响延迟和功耗。","比较 placement 与 routing 的输入输出。","为什么 buffer/inverter 插入是修复 hold 的常用手段？"]},

          {k:"ECO 思维",v:"前期保留可调单元和可配置时钟，是后期 ECO 救命的成本。"}
        ]},
        layout:{title:"物理设计的工程洞察",level:"L3",items:[
          {k:"floorplan 决定论",v:"70% 的时序与拥塞问题在 floorplan 阶段就基本决定了，后期难以根治。"},
          {k:"电源/地完整性",v:"PDN 不仅是供电网络，也是返回路径；与信号完整性、EMI 强耦合。"},
          {k:"3D / 2.5D 演进",v:"先进封装让 placement 从 die 内扩展到 package 与 chiplet 之间，问题规模跨数量级。"},
          {k:"可制造性",v:"DFM 规则不是“附加检查”，而是直接决定良率与成本。"}
        ]},
        signoff:{title:"签核阶段的工程洞察",level:"L3",items:[
          {k:"全 corner 思维",v:"一个 corner 通过不代表设计 OK；多 corner + 统计型分析才能反映真实良率。"},
          {k:"STA 与 PVT",v:"OCV / AOCV / SOCV 越来越重要，纯单 corner 静态分析会过度乐观。"},

        lab:{title:"实验课的工程洞察",level:"L2",items:[
          {k:"工程表达",v:"一份能复现的实验报告，比一份漂亮的实验报告更接近工业实践。"},
          {k:"版本管理",v:"把实验代码纳入 Git 仓库、写好 commit message，是研究-工程衔接的最低成本。"},
          {k:"观察-假设闭环",v:"任何“反常现象”都先记录现象再下结论，是避免“调试误入歧途”的关键习惯。"},
          {k:"工具与理论",v:"实验中遇到的现象，回到理论公式里找解释，才能形成长期知识而不是经验碎片。"}
        ]},
        quiz:{title:"测验与能力模型的洞察",level:"L2",items:[
          {k:"题型分布",v:"概念题、计算题、设计题、工具题 分别训练不同能力，需要在复习时分类训练。"},
          {k:"错题归因",v:"把错题按“概念/计算/设计/工具”分类，能更快定位薄弱环节。"},
          {k:"表达训练",v:"能用一句话讲清概念，比能在草稿纸上演算更能反映真实掌握度。"},
          {k:"考试节奏",v:"先做有把握的题、留下检查时间，是工程化的时间管理方式。"}
        ]},
        glossary:{title:"术语学习的工程洞察",level:"L2",items:[

          {k:"术语差异",v:"中文术语在不同教材里有差异，建议以英文术语为主、中文为辅建立索引。"},
          {k:"应用情境",v:"每个术语至少记住一个“使用场景”和一个“反例”，是最小可用的掌握度。"},
          {k:"速查工具",v:"把术语按工艺、流程、验证、签核分类做成速查表，是面试和入职阶段的实战工具。"}
        ]},
        security:{title:"授权弹窗的工程洞察",level:"L2",items:[

      };
      const b=blocks[name]||blocks.overview;

    function addSectionNav(){
      const area=$("contentArea"),bar=$("levelFilterBar");
      if(!area||!bar)return;
      const headings=[...area.querySelectorAll(".lesson-body h4")];
      if(headings.length<2)return;
      const nav=document.createElement("div");
      nav.className="section-nav";
      nav.setAttribute("aria-label","本页章节导航");
      headings.forEach((h,idx)=>{
        const body=h.closest(".lesson-body");
        const id="section-"+idx+"-"+h.textContent.replace(/\s+/g,"-").replace(/[^\u4e00-\u9fa5a-zA-Z0-9-]/g,"").slice(0,24);
        body.id=id;
        const label=h.textContent.replace(/L[123]\s*$/,"").trim();
        const link=document.createElement("a");
        link.href="#"+id;
        link.dataset.section=id;
        link.textContent=label;
        nav.appendChild(link);
      });
      nav.addEventListener("click",e=>{
        const a=e.target.closest("a[data-section]");
        if(!a)return;
        e.preventDefault();
        const target=document.getElementById(a.dataset.section);
        if(target)safeScrollIntoView(target);
      });
      bar.insertAdjacentElement("afterend",nav);
    }

    function safeScrollTop(smooth=true){
      try{window.scrollTo({top:0,behavior:smooth?"smooth":"auto"});}
      catch(_){window.scrollTo(0,0);}
    }

    function safeScrollIntoView(el){
      try{el.scrollIntoView({behavior:"smooth",block:"start"});}
      catch(_){el.scrollIntoView(true);}
    }

    function escapeHtml(text){
      return String(text||"").replace(/[&<>"']/g,function(ch){
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
      });
    }

    function getModuleDetailBlocks(name){
      const blocks = {
        overview: {
          priority: "<ul><li>抽象层定位是排查的起点。功能异常若在规格层未对齐，继续向下追查 RTL 只是缘木求鱼；只有先确认问题出现在规格语义、RTL 行为、综合网表还是物理实现，才能找到对应的可观测证据。</li><li>异常类型决定了优先查看哪一类证据。功能错误通常反映在激励与响应的对应关系上；时序错误更多体现为约束遗漏或关键路径余量为负；物理错误则出现在 DRC/LVS 报告与寄生参数中。</li><li>验证手段的选择应优先走证据链最短的静态路径。形式化检查与静态时序分析覆盖范围更完整，而 exhaustive 仿真成本极高，宜作为补充而非首选。</li></ul>",
          minimize: "<ul><li>最小复现的关键是把无关模块屏蔽在外。只保留与异常直接相关的 RTL、约束或版图片段，总线、存储器与复杂控制逻辑会引入大量干扰变量。</li><li>环境一致性决定了问题能否被他人复现。记录综合器、仿真器、PVT corner 与工具参数，相当于为异常建立可重放的上下文。</li><li>激励应精确到刚好触发异常。用一至三个测试向量或单一时钟序列呈现期望输出与实际输出的差异，避免在随机浪潮中捞针。</li></ul>",
          misconception: "<ul><li>把 EDA 流程当作普通软件编译链是一种常见误解。RTL 在不同工艺库、不同约束下会生成面积与时序截然不同的网表，因此“一次通过、到处运行”并不成立。</li><li>抽象层之间存在语义间隙，不能简单用顺序执行思维理解并发硬件。RTL 中的非阻塞赋值“<=”对应的是寄存器传输与并发更新，若误作软件顺序赋值，会在多驱动与 delta cycle 上产生误判。</li></ul>",
          flow: "<ul><li>上游输入包括系统规格、算法模型、接口协议以及约束文件（SDC、UPF、DFT 脚本），它们共同定义了设计的语义边界与优化目标。</li><li>当前位置处于 RTL → 门级网表 → 物理版图 → GDSII 的抽象层下降过程中，每个概念都对应某一确定层级的数据表示。</li><li>下游输出与检查包括功能仿真报告、综合 QoR 报告、STA 时序报告、物理 DRC/LVS 报告以及最终签核清单，形成从行为到制造的证据链。</li></ul>"
        },
        logic: {
          priority: "<ul><li>组合逻辑异常应首先回到真值表或逻辑表达式层面。未覆盖的输入组合、冗余项遗漏或卡诺图分组不当，往往是功能偏差的最直接原因。</li><li>时序逻辑异常通常与时钟边沿、复位策略和建立/保持时间相关。状态机若进入未定义状态，多半源于复位不完整或转移条件覆盖不全。</li><li>毛刺与竞争并非布尔表达式本身错误，而是各路径传播延迟差异在输出端的叠加。此时优先分析门延迟与布线差异，比修改逻辑函数更有效。</li></ul>",
          minimize: "<ul><li>输入维度最小化意味着把多输入函数降到两至三个变量，用完整真值表枚举所有组合，从而把问题压缩到可穷举的布尔空间。</li><li>状态空间最小化要求先把时序电路复位到已知状态，再每次只改变一个输入观察次态，避免多变量同时跳变带来的干扰。</li><li>结构最小化则用最少数量的逻辑门或标准单元搭建等价电路，以确认异常来自布尔函数本身，而非实现方式或工艺参数。</li></ul>",
          misconception: "<ul><li>Verilog 的 reg 类型并不天然等价于硬件寄存器。在 always @(*) 中赋值的 reg 变量综合后仍是组合逻辑，只有带时钟边沿触发的 reg 才会被综合成触发器。</li><li>卡诺图的价值并不限于四变量以下。对于五到六变量，可借助双卡诺图或 Espresso、ABC 等开源最小化工具完成质蕴含项覆盖，其相邻合并思想仍然适用。</li></ul>",
          flow: "<ul><li>上游输入是布尔函数、真值表、状态图与时序约束，它们共同决定逻辑行为的数学描述。</li><li>当前位置位于 RTL 描述之前的“数学层”，布尔代数与时序约束在此决定后续门级网表的结构与关键路径长度。</li><li>下游输出与检查包括门级网表、关键路径延迟、建立/保持时间余量以及功耗估计，为综合与物理实现提供量化依据。</li></ul>"
        },
        hdl: {
          priority: "<ul><li>仿真与综合结果不一致时，首先应审视阻塞赋值与非阻塞赋值的使用场景，以及敏感列表是否完整。IEEE 1364/1800 对过程赋值的调度语义有明确区分，误用常导致仿真与综合行为分叉。</li><li>出现意外 latch 或寄存器时，需检查 always 块中所有分支是否都对输出赋值，以及复位策略是否匹配设计意图。不完整的条件分支会被综合器推断为锁存器。</li><li>综合 QoR 异常应优先检查可综合子集、位宽匹配与 generate 边界。RTL 描述越贴近综合器可识别模式，结果越稳定。</li></ul>",
          minimize: "<ul><li>提取可疑的 always 或 assign 块到独立 module，端口只保留相关信号，可排除周边逻辑对判断的干扰。</li><li>固定综合约束为单一时钟、简单复位，避免多周期路径与复杂 SDC 在初期引入额外变量。</li><li>对同一功能分别用 assign 与 always 实现并对比综合网表与仿真波形，能快速定位描述风格导致的不一致。</li></ul>",
          misconception: "<ul><li>把 Verilog 当作顺序执行的程序语言是典型误区。多个 always 块在仿真调度中并发执行，非阻塞赋值的更新发生在时间步末尾；若用阻塞赋值模拟时序更新，会得到与综合网表不一致的仿真结果。</li><li>wire 与 reg 的区分在于驱动方式而非是否综合成寄存器。wire 用于连续驱动和端口连接，reg 用于过程赋值；reg 是否成为物理寄存器取决于触发条件，而非类型关键字本身。</li></ul>",
          flow: "<ul><li>上游输入包括规格说明、算法伪代码、接口协议与时序约束，它们共同定义了 RTL 需要实现的行为。</li><li>当前位置处于 RTL 抽象层，连接行为描述与综合后的门级结构，是功能验证与逻辑综合的共同起点。</li><li>下游输出与检查包括可综合 RTL、仿真波形、综合网表、STA 报告以及形式等价性验证（LEC）结果。</li></ul>"
        },
        simulation: {
          priority: "<ul><li>功能错误应优先检查测试平台激励覆盖率与参考模型正确性。验证的本质是对照规格，若参考模型本身有偏，后续所有比较都失去意义。</li><li>未知态 X 的传播需要追溯源头。未初始化寄存器、多驱动冲突、未覆盖的 case 分支或异步复位亚稳态，都会让 X 沿数据通路扩散。</li><li>覆盖率不足时不应盲目增加随机种子，而应优先查看功能覆盖率与断言覆盖率。种子再多，未覆盖的功能空间依旧存在。</li></ul>",
          minimize: "<ul><li>最小 DUT 只保留触发异常的子模块，去掉总线接口和外围模型，把故障隔离到最小逻辑边界。</li><li>最小激励采用确定性向量而非随机激励，精确控制触发条件和时钟周期数，使异常出现时刻可预期。</li><li>最小检查只保留一个断言或一组波形观测点，聚焦异常出现的具体时刻与信号，避免在海量波形中迷失。</li></ul>",
          misconception: "<ul><li>仿真通过并不意味着设计正确。仿真只能验证被激励覆盖到的行为空间，未覆盖的 corner、异步路径和 PVT 变化仍可能导致硅后失效。</li><li>波形中的 X 不应被简单当作“还没赋值”。X 往往是多驱动冲突、未初始化存储器或断言失败的直接信号，提示设计或测试平台存在语义歧义。</li></ul>",
          flow: "<ul><li>上游输入包括 RTL 设计、验证计划、测试场景、参考模型与覆盖率目标，构成验证活动的边界与度量标准。</li><li>当前位置处于功能验证层，通过动态仿真与静态断言确认 RTL 行为符合规格。</li><li>下游输出与检查包括波形文件、断言报告、覆盖率报告、回归测试日志与 bug 跟踪清单。</li></ul>"
        },
        synthesis: {
          priority: "<ul><li>时序违例首先应检查 SDC 约束完整性。create_clock、set_input_delay、set_output_delay 与 clock uncertainty 的缺失或过于乐观，都会让关键路径失去真实约束。</li><li>面积或功耗异常通常与 RTL 编码风格有关。资源共享、算子平衡与寄存器推断方式直接决定了综合器能生成的结构优劣。</li><li>QoR 波动时，应先确认工艺库、PVT corner 与工具参数是否一致。跨环境比较往往把真实的设计问题掩盖在配置差异中。</li></ul>",
          minimize: "<ul><li>最小 RTL 只保留触发违例的组合逻辑或时序路径，去掉无关模块和接口，让综合器聚焦关键结构。</li><li>最小约束使用单一时钟、理想时钟网络，禁用复杂多周期与伪路径约束，先把基础时序收敛看清楚。</li><li>最小库固定一个标准单元库和一个 corner，先确认综合器行为符合预期，再逐步引入真实约束与多 corner 分析。</li></ul>",
          misconception: "<ul><li>综合并非 RTL 到网表的机械翻译。综合器在时序、面积、功耗约束下进行大量启发式优化，同一 RTL 在不同约束下可能产生拓扑结构完全不同的网表。</li><li>约束对结果具有决定性作用。遗漏 create_clock 会让综合器假设无限大的时钟周期，从而生成看似时序完美但完全不可用的网表。</li></ul>",
          flow: "<ul><li>上游输入包括可综合 RTL、SDC 约束、UPF 低功耗约束、标准单元库与工艺文件，它们共同定义了优化空间。</li><li>当前位置是从行为描述到门级结构的转换层，决定时序、面积、功耗的初步实现。</li><li>下游输出与检查包括门级网表、SDF 时序反标文件、综合 QoR 报告以及时序/面积/功耗估计。</li></ul>"
        },
        layout: {
          priority: "<ul><li>布线后时序恶化通常源于寄生 RC 延迟、时钟偏斜与关键路径上的单元摆放。物理实现把逻辑连接转化为几何结构，延迟模型也从单元延迟扩展到互连延迟。</li><li>DRC 违例应按类型分类处理。线宽、间距、金属密度与天线效应等不同规则对应不同的版图修改策略，混为一谈会降低定位效率。</li><li>拥塞问题优先查看全局布线与详细布线的拥塞图。识别热点区域后，再决定是否需要调整 floorplan 或单元密度。</li></ul>",
          minimize: "<ul><li>最小网表用仅含触发路径的标准单元构建 tiny design，并固定 I/O 位置，排除无关逻辑对物理结果的干扰。</li><li>最小 floorplan 采用简单矩形核与固定行高，先排除复杂宏单元与电源网络带来的变量。</li><li>最小工艺层聚焦单一金属层的布线问题，在单层规则解释清楚后再扩展到多层耦合分析。</li></ul>",
          misconception: "<ul><li>placement 不仅影响面积，也深刻影响时序。单元摆放决定了互连线长与驱动负载，差的 placement 即使综合时序良好，布线后也可能大量违例。</li><li>物理效应不能被忽视。天线效应在制造过程中会积累电荷并击穿栅氧，必须通过跳线或二极管保护解决，这是纯逻辑验证无法发现的。</li></ul>",
          flow: "<ul><li>上游输入包括门级网表、时序约束、floorplan 规划、电源网络、物理库（LEF）与工艺规则。</li><li>当前位置处于物理实现层，将逻辑连接转化为可制造的几何版图。</li><li>下游输出与检查包括 DEF/LEF、GDSII、DRC/LVS 报告、寄生参数提取（SPEF）与布线后 STA 报告。</li></ul>"
        },
        signoff: {
          priority: "<ul><li>建立/保持违例应首先确认 PVT corner、OCV/AOCV/SOCV 设置与 clock uncertainty 是否合理。过度乐观会掩盖风险，过度悲观则会造成不必要的面积与功耗开销。</li><li>LVS 不一致通常源于版图与网表之间的命名映射、短路/开路、未连接节点或层次展开差异。从拓扑等价角度排查比盲目改版图更高效。</li><li>DRC/DFM 问题需要区分致命违例与可制造性警告。前者必须清零，后者则需评估对良率的真实影响。</li></ul>",
          minimize: "<ul><li>单路径 STA 从完整设计中提取一条关键路径，单独分析 setup、hold 与 slack，把问题从整片时序报告中剥离出来。</li><li>单单元 LVS 只保留一个标准单元或简单门，确认版图与网表映射规则是否正确解释。</li><li>单规则 DRC 在空白版图中只画触发该规则的最小图形，验证工艺规则本身的解释与工具检查是否一致。</li></ul>",
          misconception: "<ul><li>STA 不是仿真的替代。STA 检查所有路径在最坏 corner 下的时序裕量，不验证功能正确性；功能错误仍需仿真或形式验证覆盖。</li><li>LVS 通过并不代表可以流片。LVS 只保证拓扑等价，无法覆盖天线效应、IR Drop、电迁移、ESD 等物理可靠性问题。</li></ul>",
          flow: "<ul><li>上游输入包括最终门级网表、最终物理版图、寄生参数、SDC、工艺规则与可靠性规范。</li><li>当前位置处于流片前的最终验证层，确认设计在功能、时序、物理上均可制造。</li><li>下游输出与检查包括 STA signoff 报告、LVS 报告、DRC/ERC/DFM 报告以及良率与可靠性评估。</li></ul>"
        },
        lab: {
          priority: "<ul><li>工具报错时应先完整阅读日志，区分 error、warning 与 info，并定位第一个出错点。后续报错往往是首个错误的级联产物。</li><li>结果异常时需核对输入假设：库文件、约束、激励与工具参数是否都符合实验目标。一个参数偏差可能让正确的设计表现出错误行为。</li><li>理论与实践不一致时，应检查模型简化假设是否过度。零延迟门、理想时钟与单 corner 等简化在课堂上有价值，却可能掩盖真实工程问题。</li></ul>",
          minimize: "<ul><li>最小设计只保留触发异常的核心电路，排除无关 IP 与复杂接口，让实验变量可控。</li><li>最小工具链用命令行或脚本记录从输入到输出的完整步骤，确保实验可被他人复现。</li><li>最小变量要求每次只改变一个参数，观察其对结果的影响，避免多因素同时变化导致无法归因。</li></ul>",
          misconception: "<ul><li>实验“跑通”并不等同于理解。在不理解约束和工具参数的情况下得到正确结果，换一套工艺库或 corner 后可能立刻失效。</li><li>只看最终结果不看中间产物会错过关键线索。综合报告中的 warning、仿真日志中的 X 传播、DRC 中的密度违例，往往比最终错误信息更能揭示根本原因。</li></ul>",
          flow: "<ul><li>上游输入包括课程目标、理论知识、设计规格、实验指导书与参考工具链，构成实验的问题边界。</li><li>当前位置是理论与实践的结合点，通过动手验证加深对抽象概念的理解。</li><li>下游输出与检查包括实验记录、波形/网表/版图截图、log 摘要以及结论与反思。</li></ul>"
        },
        quiz: {
          priority: "<ul><li>概念性错误应回归定义与术语边界。凭直觉判断容易越过概念的适用域，官方文档与教材定义是最稳妥的锚点。</li><li>计算性错误通常源于假设条件、单位换算或边界情况未厘清。重新检查这些前提比重新随机做题更能命中要害。</li><li>设计性错误可通过画图来定位。把文字题转化为数据通路或状态转移图，能暴露隐含条件与结构冲突。</li></ul>",
          minimize: "<ul><li>最小考点是把错题提炼成一句话核心概念，明确自己真正没掌握的知识点。</li><li>最小反例为每个考点构造一个正例与一个反例，通过边界对比加深对概念适用域的理解。</li><li>最小迁移是用同一知识点解答不同表述的新题，检验是否真正掌握还是只记住了题目特征。</li></ul>",
          misconception: "<ul><li>只关注正确答案而不做错题归因是一种低效学习。同一错误在换题面后反复出现，说明未建立概念网络，只是记住了题目特征。</li><li>把复杂问题简单归因于“粗心”会掩盖真实薄弱点。计算错误往往源于约束条件理解不清或单位换算不熟练，需要通过结构化检查清单系统消除。</li></ul>",
          flow: "<ul><li>上游输入包括课程知识体系、教材定义、工具原理与工程经验，构成答题的知识基础。</li><li>当前位置处于学习评估层，通过题目检验知识掌握的深度与迁移能力。</li><li>下游输出与检查包括错题本、归因标签、补漏计划与复述讲解记录。</li></ul>"

          <details><summary>误区反例</summary>${d.misconception}</details>
          <details><summary>流程定位</summary>${d.flow}</details>

    function enhanceLessonDetails(moduleName){
      const area=$("contentArea");
      if(!area)return;
      const lessons=[].slice.call(area.querySelectorAll(".lesson-body"));
      lessons.forEach(function(lesson,idx){
        if(lesson.classList.contains("detail-ready"))return;
        const heading=lesson.querySelector("h4");
        if(!heading)return;
        lesson.classList.add("detail-ready");
        const rawTitle=heading.textContent.replace(/L[123]\s*$/,"").trim();
        const level=lesson.getAttribute("data-level")||"综合";
        const detailId="detail-panel-"+idx+"-"+rawTitle.replace(/\s+/g,"-").replace(/[^\u4e00-\u9fa5a-zA-Z0-9-]/g,"").slice(0,24);
        const wrap=document.createElement("div");
        wrap.className="lesson-headline";
        heading.parentNode.insertBefore(wrap,heading);
        wrap.appendChild(heading);
        const btn=document.createElement("button");
        btn.type="button";
        btn.className="detail-open-btn";
        btn.setAttribute("aria-expanded","false");
        btn.setAttribute("aria-controls",detailId);
        btn.textContent="展开详细";
        wrap.appendChild(btn);
        const panel=document.createElement("div");
        panel.className="lesson-detail-panel";
        panel.id=detailId;
        panel.innerHTML=getDetailHtml(rawTitle,level,moduleName);
        lesson.appendChild(panel);
      });
      if(!area.dataset.detailBound){
        area.addEventListener("click",handleDetailToggle);
        area.dataset.detailBound="1";
      }
    }

    function handleDetailToggle(e){
      const openBtn=e.target.closest(".detail-open-btn");
      const closeBtn=e.target.closest(".detail-close-btn");
      if(!openBtn&&!closeBtn)return;
      const lesson=e.target.closest(".lesson-body");
      if(!lesson)return;
      if(openBtn){
        const expanded=lesson.classList.contains("detail-expanded");
        [].slice.call(document.querySelectorAll(".lesson-body.detail-expanded")).forEach(function(el){
          if(el!==lesson){
            el.classList.remove("detail-expanded");
            const btn=el.querySelector(".detail-open-btn");
            if(btn){btn.textContent="展开详细";btn.setAttribute("aria-expanded","false");}
          }
        });
        lesson.classList.toggle("detail-expanded",!expanded);
        openBtn.textContent=expanded?"展开详细":"收起详细";
        openBtn.setAttribute("aria-expanded",expanded?"false":"true");
      }
      if(closeBtn){
        lesson.classList.remove("detail-expanded");
        const btn=lesson.querySelector(".detail-open-btn");
        if(btn){btn.textContent="展开详细";btn.setAttribute("aria-expanded","false");btn.focus();}
      }
    }

    function renderModule(name, force=false){
      if(!modules[name]) name="overview";
      const isFirstRender = currentModule === null;
      if(!force && !isFirstRender && currentModule===name&&name!=="quiz")return;
      if(name==="quiz"){quizListenersBound=false;}
      if(transitioning)return;
      transitioning=true;
      const main=$("mainContent");
      const onReady = () => {
        main.classList.remove("page-exit");
        currentModule=name;
        updateBreadcrumb(name);
        try { history.replaceState(null, "", "#/" + name); } catch(_) { location.hash = "#/" + name; }
        const item=modules[name];
        // Build full shell
        $("moduleShell").innerHTML = buildShell(name, item);
        // Restore note value
        const noteEl = $("studyNote"); if(noteEl) noteEl.value = rawState.notes || "";
        const themeBtn = $("toggleTheme");
        if(themeBtn) themeBtn.textContent = rawState.theme==="light" ? "切换深色" : "切换浅色";
        // Wire up level filter bar
        const levelBar = $("levelFilterBar");
        if(levelBar){
          levelBar.addEventListener("click",e=>{
            const btn=e.target.closest(".level-filter-btn");
            if(btn) filterByLevel(btn.dataset.lvl);
          });
        }
        addSectionNav();
        enhanceLessonDetails(name);
        if(rawState.levelFilter && rawState.levelFilter!=="all") filterByLevel(rawState.levelFilter);
        else filterByLevel("all");
        // combined single-pass marker update — also clears stale aria-current from previous module
        (function(){
          const all=document.querySelectorAll(".nav-btn[data-module]");
          for(let i=0;i<all.length;i++){
            const btn=all[i];
            const cur=btn.dataset.module===name;
            btn.classList.toggle("active",cur);
            if(cur) btn.setAttribute("aria-current","page");
            else btn.removeAttribute("aria-current");
          }
        })();
        // Re-bind module-specific controls
        rebindModuleControls(name);
        if(name==="quiz") renderQuiz();
        scheduleRender();
        const skipMainScroll = skipNextMainScrollTop;
        skipNextMainScrollTop = false;
        if(!skipMainScroll) safeScrollTop(!isFirstRender);
        // Restore previously-saved scroll position for this module (session-only)
        let restoredY = 0;
        if(!isFirstRender){
          try{
            const saved = sessionStorage.getItem("edaScroll:"+name);
            restoredY = saved ? Math.max(0, parseInt(saved,10) || 0) : 0;
          }catch(_){ restoredY = 0; }
        }
        if(restoredY > 0){
          suppressScrollMemory = true;
          requestAnimationFrame(()=>{
            try{ window.scrollTo(0, restoredY); }catch(_){}
            setTimeout(()=>{ suppressScrollMemory = false; }, 220);
          });
        }
        // Trigger re-flow animation
        requestAnimationFrame(()=>{
          const shell = $("moduleShell");
          shell.classList.add("shell-enter");
          setTimeout(()=>{ shell.classList.remove("shell-enter"); transitioning=false; document.body.classList.remove("page-switching"); }, 480);
        });
      };
      if(isFirstRender){
        onReady();
      } else {
        showRouteOverlay(name, onReady);
      }
    }

    function rebindModuleControls(name){
      // Re-wire global controls that exist in every shell
      const md = $("markDone"); if(md) md.addEventListener("click", ()=>markDone());
      const rp = $("resetProgress"); if(rp) rp.addEventListener("click", ()=>{ if(confirm("确定重置学习进度和测验得分吗？")){ doneSet.clear(); answeredSet.clear(); rawState.score=0; rawState.notes=""; const n=$("studyNote"); if(n) n.value=""; persist(); renderModule(currentModule,true); } });
      const tt = $("toggleTheme"); if(tt) tt.addEventListener("click", toggleTheme);
      const er = $("exportReport"); if(er) er.addEventListener("click", exportReport);
      const jq = $("jumpQuiz"); if(jq) jq.addEventListener("click", (e)=>navigateTo("quiz",e));
      const sn = $("saveNote"); if(sn) sn.addEventListener("click", ()=>{ const noteInput=$("studyNote"); rawState.notes = noteInput ? noteInput.value : ""; persist(); showToast("已保存"); });
      const cn = $("clearNote"); if(cn) cn.addEventListener("click", ()=>{ const n=$("studyNote"); if(n) n.value=""; rawState.notes=""; persist(); showToast("已清空"); });
      // Module-specific controls
      if(name==="logic" || name==="lab" || name==="overview"){
        const gs = $("gateSelect"); if(gs){ gs.addEventListener("change", renderTruthTable); renderTruthTable(); }
      }
      if(name==="logic" || name==="lab"){
        bindGraphDemo();
      }
      if(name==="logic"){
        const rw = $("runWave"); if(rw) rw.addEventListener("click", renderWaveform);
      }
      if(name==="hdl" || name==="lab"){
        const ls = $("loadSample"); if(ls) ls.addEventListener("click", loadSampleCode);
        const ah = $("analyzeHdl"); if(ah) ah.addEventListener("click", analyzeHdl);
      }
      if(name==="overview"){
        const qj = $("quickJumpBtn"); if(qj) qj.addEventListener("click", ()=>{ const quickJump=$("quickJump"); const v = quickJump ? quickJump.value : ""; if(v) navigateTo(v); });
      }
      if(name==="security"){
        bindSecurityDemos();
      }
    }

    function navigateTo(name, ev){
      if(!moduleOrder.includes(name)) name="overview";
      if(name!==currentModule||name==="quiz"){
        // Ripple effect on the clicked nav button
        if(ev && ev.currentTarget){
          const rect = ev.currentTarget.getBoundingClientRect();
          const ripple = document.createElement("span");
          ripple.className = "ripple";
          const size = Math.max(rect.width, rect.height);
          ripple.style.width = ripple.style.height = size + "px";
          ripple.style.left = (ev.clientX - rect.left - size/2) + "px";
          ripple.style.top = (ev.clientY - rect.top - size/2) + "px";
          ev.currentTarget.appendChild(ripple);
          setTimeout(()=>ripple.remove(), 650);
        }
        // Scroll cue only for sidebar nav buttons. Do not combine this with
        // the main page's top reset, otherwise mobile layouts may up-then-down.
        if(ev && ev.currentTarget && ev.currentTarget.classList && ev.currentTarget.classList.contains("nav-btn")){
          skipNextMainScrollTop = true;
          triggerNavScrollCue(ev.currentTarget);
        }
        location.hash="#/"+name;
      }
    }

    /* ── Scroll cue: visible feedback + measured glide so the "工具" block
          ends up just out of view (no overshoot, no fixed length). ── */
    function triggerNavScrollCue(btn){
      try{
        const aside = document.querySelector("aside");
        const tools = document.getElementById("toolsSection");
        if(!aside || !tools) return;

        // Decide which container actually scrolls: sticky/fixed sidebar on desktop,
        // document/window on stacked mobile/tablet layout.
        const asideStyle = window.getComputedStyle ? getComputedStyle(aside) : null;
        const isStacked = asideStyle && asideStyle.position !== "sticky" &&
                          asideStyle.position !== "fixed";
        const useAside = !isStacked;

        // Visual cue 1: pulse the clicked button
        if(btn && btn.classList){
          btn.classList.remove("nav-cue");
          // restart animation
          void btn.offsetWidth;
          btn.classList.add("nav-cue");
          setTimeout(()=>{ if(btn && btn.classList) btn.classList.remove("nav-cue"); }, 700);
        }

        // Visual cue 2: drop a beam+ring+arrow next to the button (inside aside)
        if(btn && btn.parentNode){
          const cue = document.createElement("div");
          cue.className = "scroll-cue";
          cue.innerHTML = '<span class="cue-ring"></span><span class="cue-arrow"></span>';
          // place under the button so it visually points downward
          const parent = btn.parentNode;
          const parentPos = window.getComputedStyle(parent).position;
          if(parentPos === "static") parent.style.position = "relative";
          cue.style.left = (btn.offsetLeft + btn.offsetWidth/2) + "px";
          cue.style.top  = (btn.offsetTop + btn.offsetHeight - 4) + "px";
          cue.style.transform = "translateX(-50%)";
          parent.appendChild(cue);
          setTimeout(()=>{ if(cue.parentNode) cue.parentNode.removeChild(cue); }, 720);
        }

        // Visual cue 3: floating page-top capsule "下滑定位"
        const oldCap = document.getElementById("scrollCueCapsule");
        if(oldCap && oldCap.parentNode) oldCap.parentNode.removeChild(oldCap);
        const cap = document.createElement("div");
        cap.id = "scrollCueCapsule";
        cap.className = "scroll-cue-page";
        cap.innerHTML = '<span class="cue-dot"></span><span>下滑定位 · 工具区收起</span>'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
        document.body.appendChild(cap);
        setTimeout(()=>{ cap.classList.add("hide"); setTimeout(()=>{ if(cap.parentNode) cap.parentNode.removeChild(cap); }, 240); }, 820);

        // Measure target: scroll so that the BOTTOM edge of the "工具" group
        // (the last button after #toolsSection, i.e. 术语卡片 / progress card) is
        // at—or just above—the top of the visible viewport, meaning the whole
        // "工具" cluster has just disappeared.
        // We use the LAST element in the "工具" group as the reference because
        // when its bottom edge passes the top of the viewport, the whole group
        // is offscreen.
        let lastTool = tools;
        let cur = tools.nextElementSibling;
        while(cur){
          // stop at progress-card; include nav-btn[data-module] siblings
          if(cur.classList && cur.classList.contains("progress-card")) break;
          lastTool = cur;
          cur = cur.nextElementSibling;
        }
        // small breathing margin so the "工具" group truly leaves view but
        // the next focal area (progress card / main content) is comfortably
        // visible without overshoot
        const device = (document.body && document.body.dataset) ? document.body.dataset.device : "desktop";
        const margin = device==="phone" ? 1 : device==="tablet" ? 2 : 2;

        let getCurrent, applyScroll, target, correctEnd;
        if(useAside){
          const asideRect = aside.getBoundingClientRect();
          const lastRect  = lastTool.getBoundingClientRect();
          // distance the aside must scroll DOWN so lastTool's bottom hits the top of aside
          const desired = (lastRect.bottom - asideRect.top) + margin;
          // If aside doesn't naturally have enough overflow, temporarily pad it
          // so the "工具" group can actually leave the viewport without overshoot.
          let max = aside.scrollHeight - aside.clientHeight;
          const need = aside.scrollTop + desired;
          if(need > max){
            let spacer = aside.querySelector(".aside-scroll-spacer");
            if(!spacer){
              spacer = document.createElement("div");
              spacer.className = "aside-scroll-spacer";
              spacer.setAttribute("aria-hidden","true");
              spacer.style.cssText = "flex:0 0 auto;width:1px;pointer-events:none;height:0";
              aside.appendChild(spacer);
            }
            let guard = 0;
            while(need > max && guard < 4){
              const curH = parseInt(spacer.style.height,10) || 0;
              spacer.style.height = (curH + (need - max) + 8) + "px";
              max = aside.scrollHeight - aside.clientHeight;
              guard++;
            }
          }
          target = Math.max(0, Math.min(max, aside.scrollTop + desired));
          getCurrent = ()=>aside.scrollTop;
          applyScroll = (v)=>{ aside.scrollTop = v; };
          correctEnd = ()=>{
            const max2 = aside.scrollHeight - aside.clientHeight;
            const delta2 = lastTool.getBoundingClientRect().bottom - aside.getBoundingClientRect().top + margin;
            if(delta2>1) aside.scrollTop = Math.max(0, Math.min(max2, aside.scrollTop + delta2));
          };
        } else {
          const lastRect = lastTool.getBoundingClientRect();
          const curScroll = window.pageYOffset || document.documentElement.scrollTop || 0;
          const delta = lastRect.bottom + margin; // distance below current viewport top
          const max = (document.documentElement.scrollHeight || document.body.scrollHeight)
                      - (window.innerHeight || document.documentElement.clientHeight);
          target = Math.max(0, Math.min(max, curScroll + delta));
          getCurrent = ()=>(window.pageYOffset || document.documentElement.scrollTop || 0);
          applyScroll = (v)=>{
            try{ window.scrollTo(0, v); }
            catch(_){ document.documentElement.scrollTop = v; document.body.scrollTop = v; }
          };
          correctEnd = ()=>{
            const max2 = (document.documentElement.scrollHeight || document.body.scrollHeight)
                         - (window.innerHeight || document.documentElement.clientHeight);
            const cur2 = window.pageYOffset || document.documentElement.scrollTop || 0;
            const delta2 = lastTool.getBoundingClientRect().bottom + margin;
            if(delta2>1) applyScroll(Math.max(0, Math.min(max2, cur2 + delta2)));
          };
        }

        const start = getCurrent();
        const distance = target - start;
        if(Math.abs(distance) < 2) return; // already there

        // Respect reduced-motion
        const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const HOLD = device==="phone" ? 90 : device==="tablet" ? 105 : 120;
        const minDur = device==="phone" ? 260 : device==="tablet" ? 285 : 300;
        const maxDur = device==="phone" ? 460 : device==="tablet" ? 500 : 520;
        const DURATION = reduce ? 0 : Math.max(minDur, Math.min(maxDur, Math.abs(distance) * 1.02));

        const ease = (t)=> 1 - Math.pow(1 - t, 3); // easeOutCubic, no overshoot

        setTimeout(()=>{
          const freshStart = getCurrent();
          let freshTarget = target;
          if(useAside){
            const maxNow = aside.scrollHeight - aside.clientHeight;
            const deltaNow = lastTool.getBoundingClientRect().bottom - aside.getBoundingClientRect().top + margin;
            freshTarget = Math.max(0, Math.min(maxNow, freshStart + Math.max(0, deltaNow)));
          }else{
            const maxNow = (document.documentElement.scrollHeight || document.body.scrollHeight)
                           - (window.innerHeight || document.documentElement.clientHeight);
            const deltaNow = lastTool.getBoundingClientRect().bottom + margin;
            freshTarget = Math.max(0, Math.min(maxNow, freshStart + Math.max(0, deltaNow)));
          }
          const freshDistance = freshTarget - freshStart;
          if(Math.abs(freshDistance) < 2) return;
          if(reduce){ applyScroll(freshTarget); if(correctEnd) correctEnd(); return; }
          const t0 = (window.performance && performance.now) ? performance.now() : Date.now();
          const step = (now)=>{
            const cur2 = (window.performance && performance.now) ? now : Date.now();
            const elapsed = cur2 - t0;
            const p = Math.min(1, elapsed / DURATION);
            applyScroll(freshStart + freshDistance * ease(p));
            if(p < 1){
              if(window.requestAnimationFrame) requestAnimationFrame(step);
              else setTimeout(()=>step(Date.now()), 16);
            } else {
              applyScroll(freshTarget); // snap to exact target, no overshoot
              if(correctEnd) correctEnd();
            }
          };
          if(window.requestAnimationFrame) requestAnimationFrame(step);
          else setTimeout(()=>step(Date.now()), 16);
        }, HOLD);
      } catch(_){ /* swallow: scroll cue is non-critical */ }
    }

    function markDone(name=currentModule){
      if(!modules[name])return;
      if(!doneSet.has(name)){doneSet.add(name);save();showToast("已完成："+modules[name].title);}

    function filterByLevel(lvl) {
      if(!lvl) lvl="all";
      lvl = lvl.toString().toLowerCase();
      document.querySelectorAll(".lesson-body[data-level]").forEach(el => {

    const gateCalc={AND:(a,b)=>a&b,OR:(a,b)=>a|b,XOR:(a,b)=>a^b,NAND:(a,b)=>Number(!(a&b)),NOR:(a,b)=>Number(!(a|b))};
    const truthRows=[[0,0],[0,1],[1,0],[1,1]];
    const gatePattern=/^(AND|OR|XOR|NAND|NOR)/;
    function renderTruthTable(){
      const gateSelect=$("gateSelect"),truthTable=$("truthTable");
      if(!gateSelect||!truthTable)return;
      const gateRaw=gateSelect.value;
      const gate=(gateRaw.match(gatePattern)||["AND"])[0];
      const calc=gateCalc[gate];
      truthTable.innerHTML=`<table class="truth-table"><thead><tr><th>A</th><th>B</th><th>${gate}</th></tr></thead><tbody>${truthRows.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td><td>${calc(a,b)}</td></tr>`).join("")}</tbody></table>`;
    }

    function analyzeHdl(){
      const input=$("hdlInput"),output=$("hdlOutput");
      if(!input||!output)return;
      const code=input.value,tips=[],r=HdlRegex;
      if(r.hasModule.test(code))tips.push("✓ 找到 module 定义。");else tips.push("✗ 没有找到 module 定义。");
      if(r.hasPort.test(code))tips.push("✓ 找到端口方向声明。");else tips.push("提示：建议明确写出 input、output 或 inout。");
      if(r.hasAssign.test(code))tips.push("✓ 包含 assign，可能有组合逻辑。");
      if(r.hasPosedge.test(code))tips.push("✓ 包含时钟上升沿 always 块，可能有时序逻辑。");
      if(r.hasAlwaysStar.test(code))tips.push("✓ 包含 always @(*)，适合组合逻辑。");
      if(r.hasEndmodule.test(code))tips.push("✓ 找到 endmodule。");else tips.push("✗ 缺少 endmodule。");
      if(r.hasAssignNoSemi.test(code))tips.push("提示：assign 语句末尾通常需要分号。");
      if(r.hasNonBlock.test(code))tips.push("提示：非阻塞赋值 <= 通常用于时序逻辑。");
      if(r.hasBlockNoAssign.test(code)&&!r.hasAssign.test(code)&&!r.hasNonBlock.test(code))tips.push("提示：阻塞赋值 = 常用于组合 always 块。");
      if(r.hasRegNoAlways.test(code)&&!/always/i.test(code))tips.push("提示：reg 类型通常会在 always 块中赋值。");
      if(!tips.length)tips.push("输入太短，请粘贴一个 Verilog 模块。");
      output.textContent=tips.join("\n");
    }
