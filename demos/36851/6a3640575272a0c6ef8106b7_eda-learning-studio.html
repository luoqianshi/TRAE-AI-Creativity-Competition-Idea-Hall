    // FSM: 点击节点切换当前态，路径动画 + 文字同步
    function wireFsm(stage){
      const states=stage.querySelectorAll('.fsm-state');
      const edges=stage.querySelectorAll('.fsm-edge');
      const cur=stage.querySelector('#fsmCurrent');
      const nxt=stage.querySelector('#fsmNext');
      const nextMap={0:1,1:2,2:0};
      const setHot=(idx)=>{
        states.forEach((g,i)=>{ g.classList.toggle('graph-hot', i===idx); });
        edges.forEach(p=>{
          if(parseInt(p.getAttribute('data-edge').split('->')[0],10)===idx) p.classList.add('graph-flow-edge-on');
          else p.classList.remove('graph-flow-edge-on');
        });
        if(cur) cur.textContent="S"+idx;
        if(nxt) nxt.textContent="S"+nextMap[idx];
      };
      states.forEach((g,i)=>{
        const on=()=>setHot(i);
        g.addEventListener('click',on);
        g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();on();} });
      });
    }

    // Synth: 拖动中间分隔线改变 RTL/门级两侧可视区域
    function wireSynth(stage, p){
      const svg=stage.querySelector('svg');
      const handle=stage.querySelector('#splitHandle');
      const line=stage.querySelector('#splitLine');
      const lcr=stage.querySelector('#leftClipRect');
      const rcr=stage.querySelector('#rightClipRect');
      if(!svg||!handle||!line||!lcr||!rcr)return;
      const setSplit=(x)=>{
        x=Math.max(60,Math.min(360,x));
        handle.setAttribute('cx',x);
        line.setAttribute('x1',x); line.setAttribute('x2',x);
        lcr.setAttribute('width',x);
        rcr.setAttribute('x',x); rcr.setAttribute('width',420-x);
      };
      let dragging=false;
      const toSvgX=(clientX)=>{
        const pt=svg.createSVGPoint();
        pt.x=clientX; pt.y=0;
        return pt.matrixTransform(svg.getScreenCTM().inverse()).x;
      };
      const move=(e)=>{ if(!dragging)return; const t=e.touches?e.touches[0]:e; setSplit(toSvgX(t.clientX)); };
      const up=()=>{ dragging=false; document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); document.removeEventListener('touchmove',move); document.removeEventListener('touchend',up); };
      const down=(e)=>{ dragging=true; e.preventDefault(); document.addEventListener('mousemove',move); document.addEventListener('mouseup',up); document.addEventListener('touchmove',move,{passive:false}); document.addEventListener('touchend',up); };
      handle.addEventListener('mousedown',down);
      handle.addEventListener('touchstart',down,{passive:false});
      handle.style.cursor='ew-resize';
    }

    // Signal: 切换 A/B 输入位，更新 XOR 节点和路径高亮
    function wireSignal(stage, p){
      const toggles=stage.querySelectorAll('.signal-toggle');
      const vals=stage.querySelectorAll('.signal-val');
      const edges=stage.querySelectorAll('.signal-edge');
      const xorOut=stage.querySelector('#xorOut');
      const xorText=stage.querySelector('#xorText');
      const state={A:1,B:0};
      const apply=()=>{
        const Y=state.A ^ state.B;
        toggles.forEach(t=>{
          const bit=t.getAttribute('data-bit');
          t.setAttribute('fill', state[bit] ? 'rgba(58,240,208,0.32)' : 'rgba(168,192,218,0.18)');
          t.setAttribute('stroke', state[bit] ? '#3af0d0' : '#a8c0da');
        });
        vals.forEach(v=>{ const bit=v.getAttribute('data-target'); v.textContent=String(state[bit]); });
        edges.forEach(e=>{
          const from=e.getAttribute('data-from');
          if(state[from]){ e.setAttribute('stroke','#3af0d0'); e.setAttribute('stroke-width','4'); }
          else { e.setAttribute('stroke','rgba(168,192,218,0.5)'); e.setAttribute('stroke-width','4'); }
        });
        if(xorText) xorText.textContent='Y='+Y;
        if(xorOut) xorOut.setAttribute('fill', Y ? `url(#nodeGrad-${p})` : 'rgba(168,192,218,0.25)');
        const cap=$('graphCaption');
        if(cap) cap.textContent = state.A===state.B ? '信号翻转示例：A、B 相同时 XOR 输出 0，节点变为灰色。' : '信号翻转示例：A、B 不同时 XOR 输出 1，绿色高亮表示当前传播路径。';
      };
      toggles.forEach(t=>{
        t.style.cursor='pointer';
        t.addEventListener('click',()=>{ const bit=t.getAttribute('data-bit'); state[bit]=state[bit]?0:1; apply(); });
      });
      apply();
    }

    function renderWaveform(){
      const waveform=$("waveform");
      if(!waveform)return;
      const cycles=8,vals=Array.from({length:cycles},(_,i)=>i);
      const clk=vals.map(i=>i%2),rst=vals.map(i=>i===0?0:1);
      const q=vals.map(i=>i===0?"0":((i-1)&15).toString(16).toUpperCase());
      const row=(name,values,highFn=v=>v===1)=>`<div class="wave-row"><span class="wave-name">${name}</span><div class="wave-cells">${values.map(v=>`<span class="wave-cell${highFn(v)?" high":""}">${v}</span>`).join("")}</div></div>`;
      waveform.innerHTML=row("cycle",vals,()=>false)+row("clk",clk)+row("rst",rst)+row("q",q,v=>v!=="0")+`<p class="footer-note">复位释放后，计数器在每个时钟上升沿递增。这里用 8 个周期展示 RTL 行为。</p>`;
    }

    function exportReport(){
      const pct=Math.round((doneSet.size/TOTAL_MODULES)*100);
      const lvls=["入门者","RTL 练习生","流程掌握者","签核达人"];
      const report=["EDA 学习工坊学习报告","生成时间："+new Date().toLocaleString("zh-CN"),"完成进度："+pct+"%","已完成模块："+([...doneSet].map(n=>(modules[n]&&modules[n].title)||n).join("、")||"暂无"),"测验得分："+rawState.score,"学习等级："+lvls[pct>=90?3:pct>=60?2:pct>=30?1:0],"","学习笔记：",rawState.notes||"暂无笔记"].join("\n");
      const blob=new Blob([report],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob);
      const a=document.createElement("a");a.href=url;a.download="EDA学习报告.txt";a.click();
      URL.revokeObjectURL(url);showToast("学习报告已导出");
    }

    document.addEventListener("keydown",e=>{
      if(e.target && e.target.closest && e.target.closest("input,textarea,select"))return;
      const idx=moduleOrder.indexOf(currentModule);
      if(e.key==="ArrowDown"||e.key==="j"){e.preventDefault();navigateTo(moduleOrder[(idx+1)%TOTAL_MODULES]);}
      if(e.key==="ArrowUp"||e.key==="k"){e.preventDefault();navigateTo(moduleOrder[(idx-1+TOTAL_MODULES)%TOTAL_MODULES]);}
      if(e.key==="ArrowRight"||e.key==="l"){e.preventDefault();markDone();}
      if(e.key==="0" && !e.shiftKey){e.preventDefault();filterByLevel("all");}
      if(e.key==="1" && !e.shiftKey){e.preventDefault();filterByLevel("L1");}
      if(e.key==="2" && !e.shiftKey){e.preventDefault();filterByLevel("L2");}
      if(e.key==="3" && !e.shiftKey){e.preventDefault();filterByLevel("L3");}
      // Shift+1..9 → jump directly to module 1..9 (overview is Shift+0)
      if(e.shiftKey && e.key==="0"){e.preventDefault();navigateTo("overview");}
      if(e.shiftKey && e.key==="1"){e.preventDefault();navigateTo("logic");}
      if(e.shiftKey && e.key==="2"){e.preventDefault();navigateTo("hdl");}
      if(e.shiftKey && e.key==="3"){e.preventDefault();navigateTo("simulation");}
      if(e.shiftKey && e.key==="4"){e.preventDefault();navigateTo("synthesis");}
      if(e.shiftKey && e.key==="5"){e.preventDefault();navigateTo("layout");}
      if(e.shiftKey && e.key==="6"){e.preventDefault();navigateTo("signoff");}
      if(e.shiftKey && e.key==="7"){e.preventDefault();navigateTo("lab");}
      if(e.shiftKey && e.key==="8"){e.preventDefault();navigateTo("quiz");}
      if(e.shiftKey && e.key==="9"){e.preventDefault();navigateTo("glossary");}
      if(e.key==="t"||e.key==="T"){e.preventDefault();toggleTheme();}
      if(e.key==="g"||e.key==="G"){e.preventDefault();safeScrollTop(true);}
      if(e.key==="?"){
        e.preventDefault();
        if(typeof toggleShortcut === "function") toggleShortcut();
      }
      if(e.key==="Home"){e.preventDefault();safeScrollTop(true);}
      if(e.key==="End"){
        e.preventDefault();
        try{
          const max = (document.documentElement.scrollHeight || document.body.scrollHeight)
                      - (window.innerHeight || document.documentElement.clientHeight);
          window.scrollTo(0, Math.max(0, max));
        }catch(_){}
      }
    });

    // Esc: close shortcut panel first, otherwise collapse any expanded detail panel
    document.addEventListener("keydown",e=>{
      if(e.key !== "Escape") return;
      if(e.target && e.target.closest && e.target.closest("input,textarea,select")) return;
      if(typeof shortcutPanel !== "undefined" && shortcutPanel && !shortcutPanel.hasAttribute("hidden")){
        e.preventDefault();
        toggleShortcut(false);
        return;
      }
      const open = document.querySelector(".lesson-body.detail-expanded");
      if(open){
        e.preventDefault();
        open.classList.remove("detail-expanded");
        const btn = open.querySelector(".detail-open-btn");
        if(btn){ btn.textContent = "展开详细"; btn.setAttribute("aria-expanded","false"); btn.focus(); }
      }
    });

    // Focus the search box with "/"
    document.addEventListener("keydown",e=>{
      if(e.target && e.target.closest && e.target.closest("input,textarea,select"))return;
      if(e.key==="/"){
        e.preventDefault();
        const s=$("moduleSearch"); if(s){ s.focus(); s.select && s.select(); }
      }
    });

    // ── Single rAF-batched scroll/resize handler (was 3 scroll + 2 resize) ──
    let _scrollRaf=false;
    let _scrollSaveTimer=null;
    const _topP=$("topProgress");
    const _b2t=$("backToTop");
    function _onScroll(){
      if(_scrollRaf) return;
      _scrollRaf=true;
      requestAnimationFrame(function(){
        _scrollRaf=false;
        const y=window.pageYOffset||document.documentElement.scrollTop||0;
        // ① back-to-top button
        if(_b2t) _b2t.classList.toggle("show",y>400);
        // ② top reading-progress bar
        if(_topP){
          const docH=Math.max(1,(document.documentElement.scrollHeight||document.body.scrollHeight)-(window.innerHeight||document.documentElement.clientHeight));
          _topP.style.width=(Math.max(0,Math.min(1,y/docH))*100).toFixed(2)+"%";
        }
        // ③ persist scroll position per module (debounced 180ms)
        if(suppressScrollMemory||transitioning||!currentModule) return;
        lastUserScroll=y;
        clearTimeout(_scrollSaveTimer);
        _scrollSaveTimer=setTimeout(function(){
          try{ sessionStorage.setItem("edaScroll:"+currentModule,String(y)); }catch(_){}
        },180);
      });
    }
    let _resizeTimer=null;
    function _onResize(){
      clearTimeout(_resizeTimer);
      _resizeTimer=setTimeout(function(){ _onScroll(); scheduleDeviceDetect(); }, 150);
    }
    window.addEventListener("scroll",_onScroll,{passive:true});
    window.addEventListener("resize",_onResize,{passive:true});
    window.addEventListener("orientationchange",_onResize,{passive:true});
    document.addEventListener("DOMContentLoaded",_onScroll);
    setTimeout(_onScroll,200);
    if(_b2t) _b2t.addEventListener("click",function(){ safeScrollTop(true); });

    // Keyboard shortcut help panel
    const shortcutPanel = $("shortcutPanel");
    const shortcutClose = $("shortcutClose");
    function toggleShortcut(force){
      if(!shortcutPanel) return;
      const willShow = (typeof force === "boolean") ? force : shortcutPanel.hasAttribute("hidden");
      if(willShow){
        shortcutPanel.removeAttribute("hidden");
        setTimeout(()=>{ shortcutClose && shortcutClose.focus(); }, 30);
      }else{
        shortcutPanel.setAttribute("hidden","");
      }
    }
    if(shortcutClose) shortcutClose.addEventListener("click", ()=> toggleShortcut(false));
    if(shortcutPanel) shortcutPanel.addEventListener("click", (e)=>{
      if(e.target === shortcutPanel) toggleShortcut(false);
    });

    window.addEventListener("hashchange",()=>{
      const hash=location.hash.replace("#/","")||"overview";
      if(moduleOrder.includes(hash)&&hash!==currentModule)renderModule(hash);
      else if(!moduleOrder.includes(hash))location.hash="#/overview";
    });

    // Listen to popstate (back/forward buttons)
    window.addEventListener("popstate",()=>{
      const hash=location.hash.replace("#/","")||"overview";
      if(moduleOrder.includes(hash))renderModule(hash);
    });
    // (resize + orientationchange handled by _onResize above)

    document.querySelectorAll(".nav-btn[data-module]").forEach(btn=>btn.addEventListener("click",(e)=>navigateTo(btn.dataset.module,e)));
    const moduleSearch=$("moduleSearch"); if(moduleSearch) moduleSearch.addEventListener("input",filterModules);
    document.body.classList.toggle("light",rawState.theme==="light");
    detectDeviceProfile();

    const initHash=location.hash.replace("#/","")||"overview";
    const startName=moduleOrder.includes(initHash)?initHash:"overview";
    currentModule=null; // Force initial render
    renderModule(startName);
    updateBreadcrumb(startName);
    renderProgress();

    /* ── Security authorization popup demo logic ── */
    function logAuth(msg){ const el=$("authLog"); if(!el) return; const t=new Date().toLocaleTimeString("zh-CN"); const line="["+t+"] "+msg; el.textContent=el.textContent?line+"\n"+el.textContent:line; }
    function clearAuthLog(){ const el=$("authLog"); if(el) el.textContent="等待操作..."; }

    function closeAuth(overlay, onDone){
      overlay.classList.add("closing");
      setTimeout(()=>{ overlay.remove(); if(typeof onDone==="function") onDone(); }, 220);
    }

    function createAuthBase(variant){
      const ov=document.createElement("div");
      ov.className=variant==="sheet"?"auth-sheet":(variant==="takeover"?"auth-takeover":"auth-overlay");
      ov.setAttribute("role","dialog");
      ov.setAttribute("aria-modal","true");
      ov.setAttribute("aria-labelledby","authTitle");
      ov.tabIndex=-1;
      return ov;
    }

    function wireNonDismissible(overlay){
      // Block clicks outside card / sheet
      overlay.addEventListener("click",e=>{
        if(e.target===overlay){ logAuth("尝试点击遮罩关闭 — 已拦截"); }
      });
      // Block Escape / Back button
      function keyBlock(ev){
        if(ev.key==="Escape"){ ev.preventDefault(); logAuth("按 Esc 尝试关闭 — 已拦截"); }
      }
      document.addEventListener("keydown",keyBlock);
      overlay._keyBlock=keyBlock;
      // Cleanup on remove
      const mo=new MutationObserver(()=>{
        if(!overlay.parentNode){ document.removeEventListener("keydown",keyBlock); mo.disconnect(); }
      });
      mo.observe(document.body,{childList:true,subtree:true});
    }

    function openAuthModal(){
      const ov=createAuthBase("modal");
      ov.innerHTML=`<div class="auth-card">
        <div class="auth-head"><div class="auth-shield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div><h3 class="auth-title" id="authTitle">系统授权请求</h3></div>
        <div class="auth-requester">请求者：安全管家 · 操作：安装配置描述文件</div>
        <div class="auth-body">该操作将允许应用修改系统级安全策略，包括网络过滤和证书信任列表。建议仅在您主动发起时允许。</div>
        <div class="auth-risk">⚠ 风险：若来源不可信，可能导致隐私泄露或设备被远程控制。</div>
        <div class="auth-actions"><button class="auth-btn auth-btn-deny" data-act="deny">拒绝</button><button class="auth-btn auth-btn-allow" data-act="allow">允许</button></div>
      </div>`;
      document.body.appendChild(ov); ov.focus(); wireNonDismissible(ov);
      ov.querySelectorAll("button[data-act]").forEach(b=>b.addEventListener("click",()=>{ logAuth("系统模态："+(b.dataset.act==="allow"?"已允许":"已拒绝")); closeAuth(ov); }));
    }

    function openAuthSheet(){
      const ov=createAuthBase("sheet");
      ov.innerHTML=`<div class="auth-sheet-handle"></div>
        <div class="auth-head"><div class="auth-shield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div><h3 class="auth-title" id="authTitle">底部授权抽屉</h3></div>
        <div class="auth-requester">请求者：病毒扫描引擎 · 操作：执行全盘扫描</div>
        <div class="auth-body">全盘扫描将读取设备上的应用列表和文件元数据，以检测已知木马特征。病毒库每月更新一次。</div>
        <div class="auth-risk">⚠ 该操作不会上传文件内容，但会消耗较多电量。</div>
        <div class="auth-actions"><button class="auth-btn auth-btn-deny" data-act="deny">拒绝</button><button class="auth-btn auth-btn-allow" data-act="allow">允许扫描</button></div>`;
      document.body.appendChild(ov); ov.focus(); wireNonDismissible(ov);
      ov.querySelectorAll("button[data-act]").forEach(b=>b.addEventListener("click",()=>{ logAuth("底部抽屉："+(b.dataset.act==="allow"?"已允许":"已拒绝")); closeAuth(ov); }));
    }

    function openAuth2FA(){
      const ov=createAuthBase("modal");
      ov.innerHTML=`<div class="auth-card">
        <div class="auth-head"><div class="auth-shield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><circle cx="12" cy="11" r="3"/></svg></div><h3 class="auth-title" id="authTitle">双因子身份确认</h3></div>
        <div class="auth-requester">操作：更新病毒库并授予特殊访问权限</div>
        <div class="auth-body">请输入 4 位 PIN 码，然后点击「我确认授权」。本操作每月仅执行一次。</div>
        <div class="auth-pin"><input type="password" maxlength="1" inputmode="numeric" aria-label="PIN 第 1 位"><input type="password" maxlength="1" inputmode="numeric" aria-label="PIN 第 2 位"><input type="password" maxlength="1" inputmode="numeric" aria-label="PIN 第 3 位"><input type="password" maxlength="1" inputmode="numeric" aria-label="PIN 第 4 位"></div>
        <div class="auth-actions stacked"><button class="auth-btn auth-btn-deny" data-act="deny">取消</button><button class="auth-btn auth-btn-allow" data-act="allow" disabled>我确认授权</button></div>
      </div>`;
      document.body.appendChild(ov); ov.focus(); wireNonDismissible(ov);
      const inputs=[...ov.querySelectorAll(".auth-pin input")];
      const allowBtn=ov.querySelector("button[data-act='allow']");
      inputs.forEach((inp,i)=>{
        inp.addEventListener("input",()=>{
          inp.value=inp.value.replace(/\D/g,"");
          const full=inputs.every(x=>x.value.length===1);
          allowBtn.disabled=!full;
          if(inp.value && i<inputs.length-1) inputs[i+1].focus();
        });
        inp.addEventListener("keydown",e=>{ if(e.key==="Backspace"&&!inp.value&&i>0){ inputs[i-1].focus(); } });
      });
      ov.querySelectorAll("button[data-act]").forEach(b=>b.addEventListener("click",()=>{ logAuth("双因子："+(b.dataset.act==="allow"?"已确认授权（PIN 已输入）":"已取消")); closeAuth(ov); }));
    }

    function openAuthRisk(){
      const ov=createAuthBase("modal");
      ov.innerHTML=`<div class="auth-card">
        <div class="auth-head"><div class="auth-shield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div><h3 class="auth-title" id="authTitle">风险详情确认</h3></div>
        <div class="auth-requester">请求者：未知来源应用 · 操作：启用辅助功能服务</div>
        <div class="auth-body">辅助功能服务可以读取屏幕内容。请阅读下方风险说明后再决定是否允许。</div>
        <details class="auth-risk-detail">
          <summary>查看完整风险说明（必须阅读）</summary>
          <ul><li>该服务可监听屏幕点击和输入内容。</li><li>恶意应用可能利用此权限窃取银行密码或聊天信息。</li><li>仅在您主动安装并信任的安全软件需要此权限。</li><li>允许后可在系统设置中随时撤销。</li></ul>
        </details>
        <div class="auth-actions"><button class="auth-btn auth-btn-deny" data-act="deny">拒绝</button><button class="auth-btn auth-btn-allow" data-act="allow" disabled>已阅读，允许</button></div>
      </div>`;
      document.body.appendChild(ov); ov.focus(); wireNonDismissible(ov);
      const details=ov.querySelector(".auth-risk-detail");
      const allowBtn=ov.querySelector("button[data-act='allow']");
      details.addEventListener("toggle",()=>{ allowBtn.disabled=!details.open; });
      ov.querySelectorAll("button[data-act]").forEach(b=>b.addEventListener("click",()=>{ logAuth("风险详情："+(b.dataset.act==="allow"?"已允许":"已拒绝")); closeAuth(ov); }));
    }

    function openAuthBiometric(){
      const ov=createAuthBase("modal");
      ov.innerHTML=`<div class="auth-card">
        <div class="auth-bio-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 0-10 10c0 5.523 4.477 10 10 10s10-4.477 10-10A10 10 0 0 0 12 2z"/><path d="M12 6a6 6 0 0 0-6 6"/><path d="M12 10a2 2 0 0 0-2 2"/></svg></div>
        <div class="auth-bio-ring"></div>
        <h3 class="auth-title" id="authTitle" style="text-align:center">验证身份</h3>
        <div class="auth-bio-text">请使用指纹或面容识别确认本人操作。<br>请求：授权特殊访问</div>
        <div class="auth-actions stacked"><button class="auth-btn auth-btn-deny" data-act="deny">取消</button></div>
      </div>`;
      document.body.appendChild(ov); ov.focus(); wireNonDismissible(ov);
      const ring=ov.querySelector(".auth-bio-ring");
      setTimeout(()=>{
        if(!ring||!ring.parentNode) return;
        ring.style.animation="none"; ring.style.borderColor="var(--ok)";
        logAuth("生物识别：验证通过（模拟）");
        setTimeout(()=>closeAuth(ov), 420);
      }, 2200);
      ov.querySelector("button[data-act='deny']").addEventListener("click",()=>{ logAuth("生物识别：已取消"); closeAuth(ov); });
    }

    function openAuthTakeover(){
      const ov=createAuthBase("takeover");
      ov.innerHTML=`<div class="auth-card">
        <div class="auth-head"><div class="auth-shield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div><h3 class="auth-title" id="authTitle">最高敏感操作确认</h3></div>
        <div class="auth-requester">系统级阻断 · 操作：授予设备管理员权限</div>
        <div class="auth-body">此操作将允许该应用远程擦除数据、强制锁屏或禁用摄像头。除非您明确了解后果，否则请拒绝。</div>
        <div class="auth-risk">⚠ 设备管理员权限是手机上最高的应用权限之一，恶意使用将造成不可逆损失。</div>
        <div class="auth-actions"><button class="auth-btn auth-btn-deny" data-act="deny">拒绝并返回</button><button class="auth-btn auth-btn-allow" data-act="allow">我了解风险，继续</button></div>
      </div>`;
      document.body.appendChild(ov); ov.focus(); wireNonDismissible(ov);
      ov.querySelectorAll("button[data-act]").forEach(b=>b.addEventListener("click",()=>{ logAuth("全屏接管："+(b.dataset.act==="allow"?"已允许":"已拒绝")); closeAuth(ov); }));
    }

    function bindSecurityDemos(){
      const shell=$("moduleShell");
      if(!shell||shell._securityBound) return;
      shell._securityBound=true;
      shell.addEventListener("click",e=>{
        const btn=e.target.closest("[data-demo]");
        if(!btn) return;
        const scheme=btn.dataset.demo;
        logAuth("打开方案 "+scheme.toUpperCase());
        if(scheme==="modal") openAuthModal();
        else if(scheme==="sheet") openAuthSheet();
        else if(scheme==="2fa") openAuth2FA();
        else if(scheme==="risk") openAuthRisk();
        else if(scheme==="biometric") openAuthBiometric();
        else if(scheme==="takeover") openAuthTakeover();
      });
      const clearBtn=$("clearAuthLog");
      if(clearBtn) clearBtn.addEventListener("click", clearAuthLog);
    }
  </script>
</body>
</html>
