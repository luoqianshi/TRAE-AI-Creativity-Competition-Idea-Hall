    watchlist = ['600519', '002594', '300750', '000858', '601318'];
    saveWatchlist();
  }

  function saveWatchlist() {
    localStorage.setItem('myWatchlist', JSON.stringify(watchlist));
  }

  // ================== DOM Refs ==================
  const stockGrid = document.getElementById('stockGrid');
  const emptyState = document.getElementById('emptyState');
  const watchCount = document.getElementById('watchCount');
  const stockInput = document.getElementById('stockInput');
  const addBtn = document.getElementById('addBtn');
  const suggestions = document.getElementById('suggestions');
  const detailOverlay = document.getElementById('detailOverlay');
  const detailClose = document.getElementById('detailClose');
  const detailTitle = document.getElementById('detailTitle');
  const announcementList = document.getElementById('announcementList');
  const newsList = document.getElementById('newsList');

  // ================== Render ==================
  function renderWatchlist() {
    watchCount.textContent = watchlist.length + ' 只';
    if (watchlist.length === 0) {
      stockGrid.innerHTML = '';
      stockGrid.appendChild(emptyState);
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';
    stockGrid.innerHTML = '';
    watchlist.forEach((code, idx) => {
      const stock = stockDB.find(s => s.code === code);
      if (!stock) return;
      const card = document.createElement('div');
      card.className = 'stock-card ' + getChangeClass(stock.change);
      card.style.animationDelay = (idx * 0.05) + 's';
      const changeAmount = (stock.price * stock.change / 100).toFixed(2);
      card.innerHTML = `
        <div class="stock-header">
          <div>
            <div class="stock-name">${stock.name}</div>
            <div class="stock-code">${stock.code} · ${stock.industry}</div>
          </div>
          <button class="stock-remove" data-code="${stock.code}" title="删除">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="stock-price-row">
          <span class="stock-price" style="color: var(--${getChangeClass(stock.change)})">${formatNumber(stock.price)}</span>
          <span class="stock-change ${getChangeClass(stock.change)}">${getChangeSign(stock.change)}${formatNumber(stock.change)}%</span>
          <span class="stock-change ${getChangeClass(stock.change)}">${getChangeSign(stock.change)}${changeAmount}</span>
        </div>
        <div class="stock-extra">
          <span>今开: ${(stock.price * (1 - stock.change/100*0.3)).toFixed(2)}</span>
          <span>最高: ${(stock.price * 1.015).toFixed(2)}</span>
          <span>最低: ${(stock.price * 0.985).toFixed(2)}</span>
        </div>
        <div class="sparkline" id="spark-${stock.code}"></div>
      `;
      card.addEventListener('click', (e) => {
        if (e.target.closest('.stock-remove')) return;
        openDetail(stock);
      });
      card.querySelector('.stock-remove').addEventListener('click', (e) => {
        e.stopPropagation();
        removeStock(stock.code);
      });
      stockGrid.appendChild(card);

      // Sparkline
      setTimeout(function() {
        if (window.WatchlistCharts) {
          window.WatchlistCharts.initSparkline('spark-' + stock.code, stock);
        }
      }, 0);
    });
  }

  function removeStock(code) {
    watchlist = watchlist.filter(c => c !== code);
    saveWatchlist();
    renderWatchlist();
  }

  function addStock(code) {
    const stock = stockDB.find(s => s.code === code || s.name === code);
    if (!stock) { alert('未找到该股票，请尝试其他代码或名称'); return; }
    if (watchlist.includes(stock.code)) { alert('该股票已在自选股中'); return; }
    watchlist.push(stock.code);
    saveWatchlist();
    renderWatchlist();
    stockInput.value = '';
    suggestions.classList.remove('active');
  }

  // ================== Search Suggestions ==================
  function showSuggestions(query) {
    if (!query) { suggestions.classList.remove('active'); return; }
    const matched = stockDB.filter(s =>
      s.code.includes(query) || s.name.includes(query)
    ).slice(0, 6);
    if (matched.length === 0) { suggestions.classList.remove('active'); return; }
    suggestions.innerHTML = matched.map(s => `
      <div class="suggestion-item" data-code="${s.code}">
        <span class="sug-name">${s.name}</span>
        <span class="sug-code">${s.code}</span>
      </div>
    `).join('');
    suggestions.classList.add('active');
    suggestions.querySelectorAll('.suggestion-item').forEach(item => {
      item.addEventListener('click', () => addStock(item.dataset.code));
    });
  }

  stockInput.addEventListener('input', (e) => showSuggestions(e.target.value.trim()));
  stockInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addStock(stockInput.value.trim());
  });
  addBtn.addEventListener('click', () => addStock(stockInput.value.trim()));
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-box')) suggestions.classList.remove('active');
  });

  // ================== Detail Panel ==================
  let detailChartInstance = null;

  function openDetail(stock) {
    detailTitle.innerHTML = `<span style="color:var(--accent2)">${stock.name}</span> <span style="font-size:0.85rem;color:var(--muted)">${stock.code}</span>`;
    const anns = announcementsDB[stock.code] || announcementsDB['default'];
    const news = newsDB[stock.code] || newsDB['default'];
    announcementList.innerHTML = anns.map(a => `
      <div class="info-item">
        <div class="info-title">${a.title}</div>
        <div class="info-meta">
          <span>${a.date}</span>
          <span class="info-tag ${a.type}">${a.type === 'announcement' ? '公告' : '新闻'}</span>
        </div>
      </div>
    `).join('');
    newsList.innerHTML = news.map(n => `
      <div class="info-item">
        <div class="info-title">${n.title}</div>
        <div class="info-meta">
          <span>${n.source} · ${n.date}</span>
          <span class="info-tag ${n.type}">新闻</span>
        </div>
      </div>
    `).join('');
    detailOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';

    setTimeout(function() {
      if (detailChartInstance) { detailChartInstance.dispose(); detailChartInstance = null; }
      if (window.WatchlistCharts) {
        detailChartInstance = window.WatchlistCharts.initDetailChart('detailChart', stock);
      }
    }, 50);
  }

  function closeDetail() {
    detailOverlay.classList.remove('active');
    document.body.style.overflow = '';
    if (detailChartInstance) { detailChartInstance.dispose(); detailChartInstance = null; }
  }

  detailClose.addEventListener('click', closeDetail);
  detailOverlay.addEventListener('click', (e) => { if (e.target === detailOverlay) closeDetail(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

  // ================== Clock ==================
  function updateTime() {
    const now = new Date();
    document.getElementById('currentTime').textContent =
      now.toLocaleDateString('zh-CN') + ' ' + now.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
  }
  setInterval(updateTime, 1000); updateTime();

  // ================== Init ==================
  renderWatchlist();
})();
</script>
</body>
</html>
