<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神经网络构建器 - 科普AI原理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #0f1631;
            --node-input: #00d4ff;
            --node-hidden: #a855f7;
            --node-output: #ff9f43;
            --link-color: #38bdf8;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --glow-intensity: 0.6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1f4e 50%, var(--bg-primary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 星空背景 */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 主容器 */
        .app-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 标题栏 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--node-input), var(--node-hidden));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            font-family: 'Noto Sans SC', sans-serif;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-reset {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.3);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .btn-help {
            background: rgba(56, 189, 248, 0.2);
            color: var(--link-color);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .btn-help:hover {
            background: rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        /* 主内容区 */
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 左侧节点库 */
        .node-library {
            width: 160px;
            padding: 20px 16px;
            background: rgba(10, 14, 39, 0.6);
            border-right: 1px solid rgba(56, 189, 248, 0.15);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .library-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .node-template {
            padding: 14px;
            border-radius: 12px;
            cursor: grab;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .node-template::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 12px;
        }

        .node-template:hover::before {
            opacity: 1;
        }

        .node-template:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .node-template.input-node {
            background: rgba(0, 212, 255, 0.15);
            border: 2px solid rgba(0, 212, 255, 0.4);
            color: var(--node-input);
        }

        .node-template.input-node::before {
            background: radial-gradient(circle at center, rgba(0, 212, 255, 0.3), transparent 70%);
        }

        .node-template.input-node:hover {
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
            border-color: var(--node-input);
        }

        .node-template.hidden-node {
            background: rgba(168, 85, 247, 0.15);
            border: 2px solid rgba(168, 85, 247, 0.4);
            color: var(--node-hidden);
        }

        .node-template.hidden-node::before {
            background: radial-gradient(circle at center, rgba(168, 85, 247, 0.3), transparent 70%);
        }

        .node-template.hidden-node:hover {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
            border-color: var(--node-hidden);
        }

        .node-template.output-node {
            background: rgba(255, 159, 67, 0.15);
            border: 2px solid rgba(255, 159, 67, 0.4);
            color: var(--node-output);
        }

        .node-template.output-node::before {
            background: radial-gradient(circle at center, rgba(255, 159, 67, 0.3), transparent 70%);
        }

        .node-template.output-node:hover {
            box-shadow: 0 0 25px rgba(255, 159, 67, 0.4);
            border-color: var(--node-output);
        }

        .node-icon {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        .node-label {
            font-size: 0.8rem;
            font-weight: 500;
        }

        .node-desc {
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* 画布区域 */
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .canvas-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-secondary);
            pointer-events: none;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .canvas-hint.hidden {
            opacity: 0;
        }

        .canvas-hint-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .canvas-hint-text {
            font-size: 0.9rem;
        }

        /* 节点样式 */
        .canvas-node {
            position: absolute;
            min-width: 80px;
            padding: 12px 16px;
            border-radius: 12px;
            text-align: center;
            cursor: move;
            transition: box-shadow 0.3s ease, transform 0.2s ease;
            user-select: none;
            z-index: 10;
        }

        .canvas-node::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translateY(-50%);
            cursor: crosshair;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .canvas-node:hover::after {
            opacity: 1;
        }

        .canvas-node.input {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 212, 255, 0.1));
            border: 2px solid var(--node-input);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3), inset 0 0 20px rgba(0, 212, 255, 0.1);
            color: var(--node-input);
        }

        .canvas-node.input::after {
            right: -6px;
            background: var(--node-input);
            box-shadow: 0 0 10px var(--node-input);
        }

        .canvas-node.hidden {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(168, 85, 247, 0.1));
            border: 2px solid var(--node-hidden);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3), inset 0 0 20px rgba(168, 85, 247, 0.1);
            color: var(--node-hidden);
        }

        .canvas-node.hidden::after {
            right: -6px;
            background: var(--node-hidden);
            box-shadow: 0 0 10px var(--node-hidden);
        }

        .canvas-node.output {
            background: linear-gradient(135deg, rgba(255, 159, 67, 0.2), rgba(255, 159, 67, 0.1));
            border: 2px solid var(--node-output);
            box-shadow: 0 0 20px rgba(255, 159, 67, 0.3), inset 0 0 20px rgba(255, 159, 67, 0.1);
            color: var(--node-output);
        }

        .canvas-node.output::after {
            right: -6px;
            background: var(--node-output);
            box-shadow: 0 0 10px var(--node-output);
        }

        .canvas-node:hover {
            transform: scale(1.05);
        }

        .canvas-node.active {
            animation: nodePulse 0.5s ease;
        }

        @keyframes nodePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .canvas-node .node-icon {
            font-size: 1.2rem;
        }

        .canvas-node .node-title {
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 4px;
        }

        .canvas-node .node-value {
            font-size: 0.65rem;
            font-family: 'Orbitron', sans-serif;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* 节点删除按钮 */
        .node-delete {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ef4444;
            border: none;
            color: white;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .canvas-node:hover .node-delete {
            opacity: 1;
        }

        .node-delete:hover {
            transform: scale(1.2);
        }

        /* 底部操作栏 */
        footer {
            padding: 16px 24px;
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-run {
            background: linear-gradient(135deg, var(--node-hidden), var(--node-input));
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
        }

        .btn-run:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(168, 85, 247, 0.5);
        }

        .btn-run:active {
            transform: translateY(0);
        }

        .btn-run:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--node-input);
            animation: statusPulse 2s infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* 帮助弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-primary));
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--node-input), var(--node-hidden));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-section {
            margin-bottom: 16px;
        }

        .modal-section h3 {
            font-size: 0.9rem;
            color: var(--node-input);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-section p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        /* 连接中高亮状态 */
        .connecting {
            cursor: crosshair !important;
        }

        .connecting .canvas-node {
            cursor: crosshair !important;
        }

        /* 节点放置动画 */
        @keyframes nodeSpawn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .canvas-node.spawning {
            animation: nodeSpawn 0.4s ease forwards;
        }

        /* 流动粒子 */
        .flow-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--link-color);
            box-shadow: 0 0 10px var(--link-color), 0 0 20px var(--link-color);
            pointer-events: none;
            z-index: 15;
        }

        /* 移动端提示 */
        @media (max-width: 768px) {
            .node-library {
                width: 120px;
                padding: 12px 10px;
            }

            .node-template {
                padding: 10px 8px;
            }

            .node-desc {
                display: none;
            }

            .logo {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div id="starfield"></div>

    <div class="app-container">
        <header>
            <h1 class="logo">神经网络构建器</h1>
            <div class="header-actions">
                <button class="btn btn-reset" onclick="resetCanvas()">
                    <span>↺</span> 重置
                </button>
                <button class="btn btn-help" onclick="showHelp()">
                    <span>?</span> 帮助
                </button>
            </div>
        </header>

        <main>
            <aside class="node-library">
                <div class="library-title">节点库</div>

                <div class="node-template input-node"
                     draggable="true"
                     data-type="input"
                     ondragstart="onDragStart(event)">
                    <div class="node-icon">📥</div>
                    <div class="node-label">输入层</div>
                    <div class="node-desc">接收数据</div>
                </div>

                <div class="node-template hidden-node"
                     draggable="true"
                     data-type="hidden"
                     ondragstart="onDragStart(event)">
                    <div class="node-icon">⚙️</div>
                    <div class="node-label">隐藏层</div>
                    <div class="node-desc">处理信息</div>
                </div>

                <div class="node-template output-node"
                     draggable="true"
                     data-type="output"
                     ondragstart="onDragStart(event)">
                    <div class="node-icon">📤</div>
                    <div class="node-label">输出层</div>
                    <div class="node-desc">展示结果</div>
                </div>
            </aside>

            <div class="canvas-container"
                 id="canvasContainer"
                 ondragover="onDragOver(event)"
                 ondrop="onDrop(event)">
                <canvas id="mainCanvas"></canvas>

                <div class="canvas-hint" id="canvasHint">
                    <div class="canvas-hint-icon">🧠</div>
                    <div class="canvas-hint-text">从左侧拖拽节点到这里开始构建</div>
                </div>
            </div>
        </main>

        <footer>
            <div class="action-buttons">
                <button class="btn-run" id="runBtn" onclick="runNetwork()">
                    <span>▶</span> 运行网络
                </button>
            </div>
            <div class="status-text">
                <span class="status-dot"></span>
                <span id="statusText">准备就绪</span>
            </div>
        </footer>
    </div>

    <!-- 帮助弹窗 -->
    <div class="modal-overlay" id="helpModal" onclick="closeHelp(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 class="modal-title">🧠 如何使用</h2>

            <div class="modal-section">
                <h3>📥 添加节点</h3>
                <p>从左侧节点库拖拽你需要的节点类型到画布上</p>
            </div>

            <div class="modal-section">
                <h3>🔗 连接节点</h3>
                <p>从一个节点的右侧圆点拖拽到另一个节点的任意位置，即可建立连接。数据会从输入层流向输出层。</p>
            </div>

            <div class="modal-section">
                <h3>▶️ 运行网络</h3>
                <p>点击"运行网络"按钮，观察数据（光点）如何在网络中流动，理解AI的处理过程。</p>
            </div>

            <div class="modal-section">
                <h3>💡 提示</h3>
                <p>尝试创建多层隐藏层，观察数据如何在复杂的网络中传递和变换。每个隐藏层会对数据进行不同的处理和转换。</p>
            </div>

            <button class="btn btn-run" style="width: 100%; margin-top: 16px;" onclick="closeHelp(event)">
                我学会了，开始！
            </button>
        </div>
    </div>

    <script>
        // ==================== 数据结构 ====================
        const nodes = [];
        const links = [];
        let nodeIdCounter = 0;
        let isConnecting = false;
        let connectStartNode = null;

        const nodeTypeConfig = {
            input: {
                icon: '📥',
                title: '输入层',
                color: '#00d4ff',
                bgColor: 'rgba(0, 212, 255, 0.15)'
            },
            hidden: {
                icon: '⚙️',
                title: '隐藏层',
                color: '#a855f7',
                bgColor: 'rgba(168, 85, 247, 0.15)'
            },
            output: {
                icon: '📤',
                title: '输出层',
                color: '#ff9f43',
                bgColor: 'rgba(255, 159, 67, 0.15)'
            }
        };

        // ==================== 画布初始化 ====================
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');

        function resizeCanvas() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            drawConnections();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ==================== 星空背景 ====================
        function createStarfield() {
            const starfield = document.getElementById('starfield');
            const starCount = 100;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = star.style.height = (Math.random() * 2 + 1) + 'px';
                star.style.animationDelay = Math.random() * 3 + 's';
                starfield.appendChild(star);
            }
        }

        createStarfield();

        // ==================== 拖拽相关 ====================
        let draggedType = null;

        function onDragStart(event) {
            draggedType = event.target.dataset.type;
            event.dataTransfer.effectAllowed = 'copy';
        }

        function onDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'copy';
        }

        function onDrop(event) {
            event.preventDefault();

            if (!draggedType) return;

            const rect = container.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            createNode(draggedType, x, y);

            draggedType = null;

            // 隐藏提示
            document.getElementById('canvasHint').classList.add('hidden');
        }

        // ==================== 节点操作 ====================
        function createNode(type, x, y) {
            if (nodes.length >= 20) {
                updateStatus('节点数量已达上限 (20个)');
                return;
            }

            const id = 'node_' + (nodeIdCounter++);
            const config = nodeTypeConfig[type];

            const nodeData = {
                id,
                type,
                x,
                y,
                value: type === 'input' ? Math.random().toFixed(2) : '—',
                element: null
            };

            // 创建DOM元素
            const nodeEl = document.createElement('div');
            nodeEl.className = `canvas-node ${type} spawning`;
            nodeEl.id = id;
            nodeEl.style.left = (x - 40) + 'px';
            nodeEl.style.top = (y - 30) + 'px';
            nodeEl.innerHTML = `
                <button class="node-delete" onclick="deleteNode('${id}')">×</button>
                <div class="node-icon">${config.icon}</div>
                <div class="node-title">${config.title}</div>
                <div class="node-value" id="${id}_value">${nodeData.value}</div>
            `;

            // 添加拖拽事件
            nodeEl.addEventListener('mousedown', (e) => onNodeMouseDown(e, id));
            nodeEl.addEventListener('mousemove', (e) => onNodeMouseMove(e, id));
            nodeEl.addEventListener('mouseup', (e) => onNodeMouseUp(e, id));
            nodeEl.addEventListener('mouseleave', onNodeMouseUp);

            // 连接点事件
            const connectPoint = document.createElement('div');
            connectPoint.style.cssText = `
                position: absolute;
                right: -6px;
                top: 50%;
                transform: translateY(-50%);
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: ${config.color};
                cursor: crosshair;
                box-shadow: 0 0 10px ${config.color};
                z-index: 20;
            `;
            connectPoint.addEventListener('mousedown', (e) => startConnection(e, id));
            nodeEl.appendChild(connectPoint);

            container.appendChild(nodeEl);
            nodeData.element = nodeEl;

            // 移除spawning动画类
            setTimeout(() => nodeEl.classList.remove('spawning'), 400);

            nodes.push(nodeData);
            drawConnections();
            updateStatus(`已添加 ${config.title}`);
        }

        function deleteNode(id) {
            const index = nodes.findIndex(n => n.id === id);
            if (index === -1) return;

            // 移除连接
            const connectedLinks = links.filter(l => l.from === id || l.to === id);
            connectedLinks.forEach(l => {
                const el = document.getElementById(`link_${l.id}`);
                if (el) el.remove();
            });

            // 从links数组中移除
            for (let i = links.length - 1; i >= 0; i--) {
                if (links[i].from === id || links[i].to === id) {
                    links.splice(i, 1);
                }
            }

            // 移除DOM
            const nodeEl = document.getElementById(id);
            if (nodeEl) nodeEl.remove();

            // 从nodes数组移除
            nodes.splice(index, 1);

            drawConnections();

            if (nodes.length === 0) {
                document.getElementById('canvasHint').classList.remove('hidden');
            }

            updateStatus('节点已删除');
        }

        // ==================== 节点拖拽移动 ====================
        let isDraggingNode = false;
        let dragNodeId = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        function onNodeMouseDown(e, id) {
            if (e.target.classList.contains('node-delete') || e.target.classList.contains('node-icon')) {
                return;
            }
            isDraggingNode = true;
            dragNodeId = id;

            const nodeEl = document.getElementById(id);
            const rect = nodeEl.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;

            nodeEl.style.zIndex = '100';
        }

        function onNodeMouseMove(e, id) {
            if (!isDraggingNode || dragNodeId !== id) return;

            const containerRect = container.getBoundingClientRect();
            let newX = e.clientX - containerRect.left - dragOffsetX;
            let newY = e.clientY - containerRect.top - dragOffsetY;

            // 边界限制
            newX = Math.max(0, Math.min(newX, containerRect.width - 80));
            newY = Math.max(0, Math.min(newY, containerRect.height - 60));

            const node = nodes.find(n => n.id === id);
            if (node) {
                node.x = newX + 40;
                node.y = newY + 30;
            }

            const nodeEl = document.getElementById(id);
            nodeEl.style.left = newX + 'px';
            nodeEl.style.top = newY + 'px';

            drawConnections();
        }

        function onNodeMouseUp(e, id) {
            if (isDraggingNode && dragNodeId === id) {
                isDraggingNode = false;
                dragNodeId = null;

                const nodeEl = document.getElementById(id);
                nodeEl.style.zIndex = '10';
            }
        }

        // ==================== 连接操作 ====================
        function startConnection(e, nodeId) {
            e.stopPropagation();
            e.preventDefault();

            isConnecting = true;
            connectStartNode = nodeId;
            container.classList.add('connecting');

            document.addEventListener('mouseup', endConnection);
        }

        function endConnection(e) {
            if (!isConnecting) return;

            // 检查是否点击在某个节点上
            const targetEl = e.target.closest('.canvas-node');

            if (targetEl) {
                const targetId = targetEl.id;

                // 不能连接到自己
                if (targetId !== connectStartNode) {
                    // 检查是否已存在连接
                    const exists = links.some(l =>
                        (l.from === connectStartNode && l.to === targetId) ||
                        (l.from === targetId && l.to === connectStartNode)
                    );

                    if (!exists) {
                        createLink(connectStartNode, targetId);
                    }
                }
            }

            isConnecting = false;
            connectStartNode = null;
            container.classList.remove('connecting');

            document.removeEventListener('mouseup', endConnection);
        }

        function createLink(fromId, toId) {
            const id = 'link_' + Date.now();

            const link = {
                id,
                from: fromId,
                to: toId,
                weight: (Math.random() * 2 - 1).toFixed(2)
            };

            links.push(link);
            drawConnections();

            updateStatus('连接已建立');
        }

        // ==================== 绘制连接线 ====================
        function drawConnections() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            links.forEach(link => {
                const fromNode = nodes.find(n => n.id === link.from);
                const toNode = nodes.find(n => n.id === link.to);

                if (!fromNode || !toNode) return;

                const fromEl = document.getElementById(link.from);
                const toEl = document.getElementById(link.to);

                if (!fromEl || !toEl) return;

                // 计算连接点位置
                const fromRect = fromEl.getBoundingClientRect();
                const toRect = toEl.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();

                const fromX = fromRect.right - containerRect.left;
                const fromY = fromRect.top + fromRect.height / 2 - containerRect.top;
                const toX = toRect.left - containerRect.left;
                const toY = toRect.top + toRect.height / 2 - containerRect.top;

                // 绘制贝塞尔曲线
                const midX = (fromX + toX) / 2;

                ctx.beginPath();
                ctx.moveTo(fromX, fromY);
                ctx.bezierCurveTo(midX, fromY, midX, toY, toX, toY);
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 绘制箭头
                const angle = Math.atan2(toY - fromY, toX - fromX);
                const arrowLength = 10;

                ctx.beginPath();
                ctx.moveTo(toX, toY);
                ctx.lineTo(
                    toX - arrowLength * Math.cos(angle - Math.PI / 6),
                    toY - arrowLength * Math.sin(angle - Math.PI / 6)
                );
                ctx.lineTo(
                    toX - arrowLength * Math.cos(angle + Math.PI / 6),
                    toY - arrowLength * Math.sin(angle + Math.PI / 6)
                );
                ctx.closePath();
                ctx.fillStyle = 'rgba(56, 189, 248, 0.8)';
                ctx.fill();

                // 绘制权重标签
                ctx.fillStyle = 'rgba(56, 189, 248, 0.5)';
                ctx.font = '10px Orbitron';
                ctx.fillText(link.weight, midX, (fromY + toY) / 2 - 10);
            });
        }

        // ==================== 运行网络 ====================
        function runNetwork() {
            if (nodes.length === 0) {
                updateStatus('请先添加节点');
                return;
            }

            if (links.length === 0) {
                updateStatus('请先建立连接');
                return;
            }

            // 检查是否有输出节点
            const hasOutput = nodes.some(n => n.type === 'output');
            if (!hasOutput) {
                updateStatus('请添加至少一个输出层节点');
                return;
            }

            updateStatus('神经网络运行中...');
            document.getElementById('runBtn').disabled = true;

            // 准备初始数据
            const nodeValues = {};
            nodes.forEach(n => {
                nodeValues[n.id] = n.type === 'input' ? Math.random() : 0;
            });

            // 按拓扑排序处理
            const processed = new Set();
            const animationPromises = [];

            function processNode(nodeId) {
                if (processed.has(nodeId)) return Promise.resolve();

                const node = nodes.find(n => n.id === nodeId);
                if (!node) return Promise.resolve();

                // 获取输入连接
                const inputLinks = links.filter(l => l.to === nodeId);

                return Promise.all(inputLinks.map(link => {
                    if (!processed.has(link.from)) {
                        return processNode(link.from).then(() => {
                            animateDataFlow(link.from, link.to);
                        });
                    }
                    return Promise.resolve();
                })).then(() => {
                    // 计算节点值
                    if (node.type !== 'input') {
                        let sum = 0;
                        inputLinks.forEach(link => {
                            const fromNode = nodes.find(n => n.id === link.from);
                            const weight = parseFloat(link.weight);
                            sum += parseFloat(nodeValues[link.from]) * weight;
                        });
                        // 激活函数 (ReLU)
                        nodeValues[node.id] = Math.max(0, sum).toFixed(2);
                    }

                    // 更新显示
                    const valueEl = document.getElementById(`${node.id}_value`);
                    if (valueEl) {
                        valueEl.textContent = nodeValues[node.id];

                        // 高亮动画
                        node.element.classList.add('active');
                        setTimeout(() => node.element.classList.remove('active'), 500);
                    }

                    processed.add(nodeId);
                });
            }

            // 找到所有输出节点并处理
            const outputNodes = nodes.filter(n => n.type === 'output');

            Promise.all(outputNodes.map(node => processNode(node.id)))
                .then(() => {
                    setTimeout(() => {
                        updateStatus('运行完成！');
                        document.getElementById('runBtn').disabled = false;
                    }, 500);
                });
        }

        // ==================== 数据流动动画 ====================
        function animateDataFlow(fromId, toId) {
            return new Promise(resolve => {
                const fromNode = nodes.find(n => n.id === fromId);
                const toNode = nodes.find(n => n.id === toId);

                if (!fromNode || !toNode) {
                    resolve();
                    return;
                }

                const fromEl = document.getElementById(fromId);
                const toEl = document.getElementById(toId);

                const fromRect = fromEl.getBoundingClientRect();
                const toRect = toEl.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();

                const startX = fromRect.right - containerRect.left;
                const startY = fromRect.top + fromRect.height / 2 - containerRect.top;
                const endX = toRect.left - containerRect.left;
                const endY = toRect.top + toRect.height / 2 - containerRect.top;

                const particle = document.createElement('div');
                particle.className = 'flow-particle';
                particle.style.left = startX + 'px';
                particle.style.top = startY + 'px';
                container.appendChild(particle);

                const duration = 600;
                const startTime = performance.now();

                function animate(currentTime) {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    // 贝塞尔曲线插值
                    const midX = (startX + endX) / 2;
                    const t = progress;
                    const x = Math.pow(1-t, 3) * startX + 3 * Math.pow(1-t, 2) * t * midX + 3 * (1-t) * t * t * midX + Math.pow(t, 3) * endX;
                    const y = Math.pow(1-t, 3) * startY + 3 * Math.pow(1-t, 2) * t * startY + 3 * (1-t) * t * t * endY + Math.pow(t, 3) * endY;

                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        particle.remove();
                        resolve();
                    }
                }

                requestAnimationFrame(animate);
            });
        }

        // ==================== 工具函数 ====================
        function resetCanvas() {
            // 清除所有节点
            nodes.forEach(node => {
                if (node.element) {
                    node.element.remove();
                }
            });

            // 清除所有连接DOM
            links.forEach(link => {
                const el = document.getElementById(`link_${link.id}`);
                if (el) el.remove();
            });

            // 清空数组
            nodes.length = 0;
            links.length = 0;

            // 重绘画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 显示提示
            document.getElementById('canvasHint').classList.remove('hidden');

            updateStatus('画布已重置');
        }

        function updateStatus(text) {
            document.getElementById('statusText').textContent = text;
        }

        function showHelp() {
            document.getElementById('helpModal').classList.add('active');
        }

        function closeHelp(e) {
            if (e.target.classList.contains('modal-overlay') || e.target.textContent.includes('我学会了')) {
                document.getElementById('helpModal').classList.remove('active');
            }
        }

        // 首次打开显示帮助
        setTimeout(() => {
            showHelp();
        }, 500);
    </script>
</body>
</html>
