<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地鼠王国 - 儿童互动教育游戏</title>
<style>
  :root {
    --sky: #87CEEB;
    --grass: #7CB342;
    --grass-dark: #558B2F;
    --dirt: #8D6E63;
    --dirt-dark: #5D4037;
    --wood: #A1887F;
    --accent: #FF7043;
    --accent-light: #FFAB91;
    --yellow: #FFD54F;
    --bomb: #546E7A;
    --red: #EF5350;
    --green: #66BB6A;
    --blue: #42A5F5;
    --purple: #AB47BC;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif;
    background: linear-gradient(180deg, var(--sky) 0%, #E1F5FE 60%, var(--grass) 60%, var(--grass-dark) 100%);
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 100px;
    opacity: 0.9;
    animation: floatCloud linear infinite;
  }
  .cloud::before {
    content: '';
    position: absolute;
    background: #fff;
    border-radius: 100px;
  }
  @keyframes floatCloud {
    from { transform: translateX(-200px); }
    to { transform: translateX(calc(100vw + 200px)); }
  }

  /* ===== 主菜单 ===== */
  #mainMenu {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2vh;
    position: relative;
  }

  .game-title {
    font-size: clamp(3rem, 8vw, 7rem);
    color: var(--accent);
    text-shadow: 4px 4px 0 #BF360C, 8px 8px 0 rgba(0,0,0,0.15);
    margin-bottom: 1vh;
    animation: bounceIn 1s ease-out;
    letter-spacing: 0.1em;
  }
  .game-subtitle {
    font-size: clamp(1rem, 2.5vw, 2rem);
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    margin-bottom: 4vh;
  }

  @keyframes bounceIn {
    0% { transform: scale(0) rotate(-10deg); opacity: 0; }
    50% { transform: scale(1.1) rotate(2deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .module-grid {
    display: flex;
    gap: 3vw;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 1200px;
  }

  .module-card {
    width: clamp(200px, 25vw, 300px);
    aspect-ratio: 1;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 6px solid rgba(255,255,255,0.6);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    position: relative;
    overflow: hidden;
  }
  .module-card:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  .module-card:active { transform: translateY(-2px) scale(0.98); }

  .module-card.pinyin { background: linear-gradient(135deg, #FFCC80, #FFAB91); }
  .module-card.hanzi { background: linear-gradient(135deg, #A5D6A7, #80CBC4); }
  .module-card.math { background: linear-gradient(135deg, #90CAF9, #CE93D8); }

  .module-icon {
    font-size: clamp(3rem, 7vw, 5rem);
    margin-bottom: 1vh;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
  }
  .module-name {
    font-size: clamp(1.2rem, 3vw, 2rem);
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }
  .module-desc {
    font-size: clamp(0.7rem, 1.5vw, 1rem);
    color: rgba(255,255,255,0.9);
    margin-top: 0.5vh;
  }

  /* ===== 设置界面 ===== */
  #settingsScreen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2vh;
  }
  .settings-panel {
    background: rgba(255,255,255,0.95);
    border-radius: 32px;
    padding: 4vh 5vw;
    max-width: 700px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    border: 4px solid var(--yellow);
  }
  .settings-title {
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    color: var(--dirt-dark);
    text-align: center;
    margin-bottom: 3vh;
  }
  .setting-group {
    margin-bottom: 3vh;
  }
  .setting-label {
    font-size: clamp(1rem, 2.5vw, 1.5rem);
    color: var(--dirt-dark);
    margin-bottom: 1.5vh;
    display: block;
  }
  .option-row {
    display: flex;
    gap: 2vw;
    flex-wrap: wrap;
    justify-content: center;
  }
  .option-btn {
    padding: 1.5vh 3vw;
    border: 3px solid var(--wood);
    border-radius: 16px;
    background: #fff;
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
    font-size: clamp(1rem, 2vw, 1.3rem);
    cursor: pointer;
    transition: all 0.2s;
    color: var(--dirt-dark);
  }
  .option-btn:hover { background: var(--yellow); }
  .option-btn.selected {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    transform: scale(1.08);
  }

  .btn-row {
    display: flex;
    gap: 3vw;
    justify-content: center;
    margin-top: 4vh;
  }
  .big-btn {
    padding: 2vh 5vw;
    border: none;
    border-radius: 20px;
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  }
  .big-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  .big-btn:active { transform: translateY(0); }
  .big-btn.primary { background: var(--green); color: #fff; }
  .big-btn.secondary { background: var(--wood); color: #fff; }

  /* ===== 游戏界面 ===== */
  #gameScreen {
    display: none;
    flex-direction: column;
    min-height: 100vh;
    padding: 1.5vh 2vw;
    position: relative;
  }

  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.9);
    border-radius: 20px;
    padding: 1.5vh 3vw;
    margin-bottom: 2vh;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    border: 3px solid var(--yellow);
  }
  .header-left { display: flex; align-items: center; gap: 2vw; }
  .back-btn {
    background: var(--wood);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 1vh 2vw;
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    font-size: clamp(0.8rem, 2vw, 1.2rem);
    cursor: pointer;
  }
  .target-display {
    font-size: clamp(1.2rem, 3vw, 2rem);
    color: var(--dirt-dark);
    background: var(--yellow);
    padding: 1vh 3vw;
    border-radius: 16px;
    border: 3px solid var(--accent);
  }
  .target-display .label { font-size: 0.7em; color: #666; }
  .target-display .value { font-weight: 900; color: var(--accent); font-size: 1.3em; }

  .header-right { display: flex; gap: 2vw; align-items: center; }
  .stat-box {
    background: linear-gradient(135deg, #E3F2FD, #BBDEFB);
    padding: 1vh 2vw;
    border-radius: 14px;
    text-align: center;
    border: 2px solid var(--blue);
    min-width: 70px;
  }
  .stat-box.bomb-stat { background: linear-gradient(135deg, #FFEBEE, #FFCDD2); border-color: var(--red); }
  .stat-box .stat-num {
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    font-weight: 900;
    color: var(--dirt-dark);
  }
  .stat-box .stat-label {
    font-size: clamp(0.6rem, 1.5vw, 0.9rem);
    color: #666;
  }

  .timer-bar-container {
    width: 100%;
    height: 12px;
    background: #E0E0E0;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 1vh;
    border: 2px solid #fff;
  }
  .timer-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--yellow), var(--red));
    border-radius: 10px;
    transition: width 0.1s linear;
  }

  /* 游戏区域 */
  .game-board {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2vh 0;
  }
  .holes-grid {
    display: grid;
    gap: 3vw;
    padding: 2vw;
  }
  .holes-grid.grid-2 { grid-template-columns: repeat(2, 1fr); }
  .holes-grid.grid-3 { grid-template-columns: repeat(3, 1fr); }
  .holes-grid.grid-4 { grid-template-columns: repeat(4, 1fr); }

  .hole-wrapper {
    position: relative;
    width: clamp(120px, 20vw, 200px);
    height: clamp(120px, 20vw, 200px);
  }

  .hole {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 35%;
    background: radial-gradient(ellipse at center, var(--dirt-dark) 0%, var(--dirt) 70%);
    border-radius: 50%;
    box-shadow: inset 0 5px 15px rgba(0,0,0,0.4), 0 3px 8px rgba(0,0,0,0.2);
    z-index: 1;
  }
  .hole::before {
    content: '';
    position: absolute;
    top: -5px;
    left: 10%;
    right: 10%;
    height: 15px;
    background: linear-gradient(90deg, transparent, var(--grass-dark), transparent);
    border-radius: 50%;
  }

  .mole {
    position: absolute;
    bottom: 15%;
    left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 70%;
    aspect-ratio: 1;
    border-radius: 50% 50% 45% 45%;
    cursor: pointer;
    z-index: 2;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 900;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    border: 3px solid rgba(255,255,255,0.4);
  }
  .mole.up { transform: translateX(-50%) translateY(0); }
  .mole.hit { transform: translateX(-50%) translateY(-20%) scale(0.9); }
  .mole.wrong {
    animation: shakeWrong 0.4s ease-in-out;
    border-color: var(--red) !important;
  }
  @keyframes shakeWrong {
    0%, 100% { transform: translateX(-50%) translateY(0) rotate(0); }
    20% { transform: translateX(-55%) translateY(0) rotate(-8deg); }
    40% { transform: translateX(-45%) translateY(0) rotate(8deg); }
    60% { transform: translateX(-52%) translateY(0) rotate(-4deg); }
    80% { transform: translateX(-48%) translateY(0) rotate(4deg); }
  }

  .mole-face {
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
  }
  .eye {
    width: 18%;
    aspect-ratio: 1;
    background: #fff;
    border-radius: 50%;
    position: relative;
    border: 2px solid rgba(0,0,0,0.2);
  }
  .eye::after {
    content: '';
    position: absolute;
    top: 30%;
    right: 20%;
    width: 50%;
    height: 50%;
    background: #333;
    border-radius: 50%;
  }
  .nose {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translateX(-50%);
    width: 15%;
    height: 12%;
    background: #FF8A80;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.1);
  }

  .mole-content {
    position: relative;
    z-index: 3;
    margin-top: 15%;
    font-size: 0.85em;
    text-align: center;
    line-height: 1.1;
  }
  .mole-content small {
    font-size: 0.55em;
    display: block;
    opacity: 0.9;
    margin-top: 2px;
  }

  .mole.normal { background: linear-gradient(180deg, #BCAAA4, #8D6E63); }
  .mole.target { background: linear-gradient(180deg, #AED581, #7CB342); }
  .mole.bomb {
    background: linear-gradient(180deg, #78909C, #546E7A);
    font-size: clamp(2rem, 5vw, 3rem);
  }
  .mole.bomb .eye { background: #FFEB3B; }
  .mole.bomb .eye::after { background: #F44336; width: 70%; height: 70%; top: 15%; right: 15%; }

  /* 弹出分数 */
  .score-popup {
    position: absolute;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 900;
    pointer-events: none;
    z-index: 100;
    animation: scoreFloat 0.8s ease-out forwards;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }
  @keyframes scoreFloat {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
  }
  .score-popup.positive { color: var(--green); }
  .score-popup.negative { color: var(--red); }

  /* 题目完成弹窗 */
  #roundOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .round-message {
    font-size: clamp(2rem, 6vw, 4rem);
    color: #fff;
    text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-align: center;
  }
  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 结果界面 */
  #resultScreen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2vh;
    position: relative;
  }
  .result-panel {
    background: rgba(255,255,255,0.95);
    border-radius: 40px;
    padding: 5vh 6vw;
    text-align: center;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 25px 80px rgba(0,0,0,0.25);
    border: 6px solid var(--yellow);
    animation: popIn 0.6s ease-out;
  }
  .result-title {
    font-size: clamp(2rem, 6vw, 3.5rem);
    margin-bottom: 2vh;
  }
  .result-title.amazing { color: var(--accent); }
  .result-title.great { color: var(--purple); }
  .result-title.good { color: var(--blue); }
  .result-stars {
    font-size: clamp(2rem, 6vw, 4rem);
    margin: 2vh 0;
    letter-spacing: 0.2em;
  }
  .result-stats {
    display: flex;
    justify-content: center;
    gap: 4vw;
    margin: 3vh 0;
    flex-wrap: wrap;
  }
  .result-stat {
    background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
    padding: 2vh 3vw;
    border-radius: 20px;
    min-width: 120px;
  }
  .result-stat .rnum {
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 900;
    color: var(--dirt-dark);
  }
  .result-stat .rlabel {
    font-size: clamp(0.8rem, 2vw, 1.1rem);
    color: #666;
  }

  .confetti {
    position: fixed;
    width: 12px;
    height: 12px;
    pointer-events: none;
    z-index: 300;
    animation: confettiFall 2s ease-out forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  .hidden { display: none !important; }

  /* 开始倒计时 */
  #countdownOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 250;
    align-items: center;
    justify-content: center;
    font-size: clamp(5rem, 20vw, 15rem);
    color: #fff;
    font-weight: 900;
    text-shadow: 4px 4px 10px rgba(0,0,0,0.5);
  }

  /* 连击显示 */
  .combo-display {
    position: fixed;
    top: 15vh;
    right: 5vw;
    font-size: clamp(1.2rem, 3vw, 2rem);
    color: var(--accent);
    font-weight: 900;
    z-index: 50;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .combo-display.show { opacity: 1; animation: comboPulse 0.5s ease-out; }
  @keyframes comboPulse {
    0% { transform: scale(1.5); }
    100% { transform: scale(1); }
  }

  @media (max-width: 600px) {
    .module-grid { gap: 4vw; }
    .holes-grid { gap: 4vw; }
    .game-header { flex-wrap: wrap; gap: 1vh; }
  }
</style>
</head>
<body>

<!-- 云朵背景 -->
<div class="cloud" style="width:120px;height:50px;top:8%;animation-duration:25s;"></div>
<div class="cloud" style="width:180px;height:60px;top:15%;animation-duration:35s;animation-delay:-10s;"></div>
<div class="cloud" style="width:100px;height:40px;top:5%;animation-duration:30s;animation-delay:-20s;"></div>

<!-- ===== 主菜单 ===== -->
<div id="mainMenu">
  <div class="game-title">地鼠王国</div>
  <div class="game-subtitle">大声说出答案，一起打地鼠！</div>
  <div class="module-grid">
    <div class="module-card pinyin" data-module="pinyin">
      <div class="module-icon">&#128048;</div>
      <div class="module-name">拼音洞穴</div>
      <div class="module-desc">找出正确的拼音</div>
    </div>
    <div class="module-card hanzi" data-module="hanzi">
      <div class="module-icon">&#127807;</div>
      <div class="module-name">汉字森林</div>
      <div class="module-desc">找出指定的汉字</div>
    </div>
    <div class="module-card math" data-module="math">
      <div class="module-icon">&#9971;</div>
      <div class="module-name">数学矿山</div>
      <div class="module-desc">算出正确答案</div>
    </div>
  </div>
</div>

<!-- ===== 设置界面 ===== -->
<div id="settingsScreen">
  <div class="settings-panel">
    <div class="settings-title" id="settingsTitle">选择难度</div>
    <div class="setting-group">
      <span class="setting-label">格子数量</span>
      <div class="option-row" id="gridOptions">
        <button class="option-btn selected" data-grid="2">2 x 2</button>
        <button class="option-btn" data-grid="3">3 x 3</button>
        <button class="option-btn" data-grid="4">4 x 4</button>
      </div>
    </div>
    <div class="setting-group">
      <span class="setting-label">挑战轮数</span>
      <div class="option-row" id="roundOptions">
        <button class="option-btn selected" data-round="3">3轮</button>
        <button class="option-btn" data-round="5">5轮</button>
        <button class="option-btn" data-round="8">8轮</button>
      </div>
    </div>
    <div class="btn-row">
      <button class="big-btn secondary" id="backToMenu">返回</button>
      <button class="big-btn primary" id="startGame">开始游戏</button>
    </div>
  </div>
</div>

<!-- ===== 游戏界面 ===== -->
<div id="gameScreen">
  <div class="game-header">
    <div class="header-left">
      <button class="back-btn" id="gameBack">返回</button>
      <div class="target-display">
        <span class="label">找这个：</span>
        <span class="value" id="targetValue">?</span>
      </div>
    </div>
    <div class="header-right">
      <div class="stat-box">
        <div class="stat-num" id="scoreDisplay">0</div>
        <div class="stat-label">得分</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="roundDisplay">1/3</div>
        <div class="stat-label">轮次</div>
      </div>
      <div class="stat-box bomb-stat">
        <div class="stat-num" id="livesDisplay">3</div>
        <div class="stat-label">生命</div>
      </div>
    </div>
  </div>
  <div class="timer-bar-container">
    <div class="timer-bar" id="timerBar" style="width:100%"></div>
  </div>
  <div class="game-board">
    <div class="holes-grid" id="holesGrid"></div>
  </div>
</div>

<!-- ===== 结果界面 ===== -->
<div id="resultScreen">
  <div class="result-panel">
    <div class="result-title amazing" id="resultTitle">太棒了！</div>
    <div class="result-stars" id="resultStars">&#11088;&#11088;&#11088;</div>
    <div class="result-stats">
      <div class="result-stat">
        <div class="rnum" id="finalScore">0</div>
        <div class="rlabel">总分</div>
      </div>
      <div class="result-stat">
        <div class="rnum" id="finalAccuracy">0%</div>
        <div class="rlabel">正确率</div>
      </div>
      <div class="result-stat">
        <div class="rnum" id="finalCombo">0</div>
        <div class="rlabel">最高连击</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="big-btn secondary" id="resultMenu">主菜单</button>

<script>
// ============================================
// Web Audio API 音效系统
// ============================================
const AudioSys = {
  ctx: null,
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  play(type) {
    this.init();
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.connect(g);
    g.connect(this.ctx.destination);
    switch(type) {
      case 'pop':
        o.type = 'sine';
        o.frequency.setValueAtTime(500, t);
        o.frequency.exponentialRampToValueAtTime(800, t + 0.1);
        g.gain.setValueAtTime(0.3, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
        o.start(t); o.stop(t + 0.15);
        break;
      case 'hit':
        o.type = 'square';
        o.frequency.setValueAtTime(600, t);
        o.frequency.exponentialRampToValueAtTime(1200, t + 0.1);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
        o.start(t); o.stop(t + 0.2);
        // 和声
        const o2 = this.ctx.createOscillator();
        const g2 = this.ctx.createGain();
        o2.connect(g2); g2.connect(this.ctx.destination);
        o2.type = 'sine';
        o2.frequency.setValueAtTime(900, t);
        g2.gain.setValueAtTime(0.15, t);
        g2.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
        o2.start(t); o2.stop(t + 0.2);
        break;
      case 'wrong':
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(300, t);
        o.frequency.exponentialRampToValueAtTime(150, t + 0.3);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        o.start(t); o.stop(t + 0.3);
        break;
      case 'bomb':
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(200, t);
        o.frequency.exponentialRampToValueAtTime(50, t + 0.5);
        g.gain.setValueAtTime(0.3, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
        o.start(t); o.stop(t + 0.5);
        // 噪声
        const bufSize = this.ctx.sampleRate * 0.3;
        const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i/bufSize);
        const ns = this.ctx.createBufferSource();
        ns.buffer = buf;
        const ng = this.ctx.createGain();
        ng.gain.setValueAtTime(0.2, t);
        ng.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        ns.connect(ng); ng.connect(this.ctx.destination);
        ns.start(t);
        break;
      case 'roundWin':
        [523, 659, 784, 1047].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t + i * 0.12);
          gain.gain.setValueAtTime(0.2, t + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.01, t + i * 0.12 + 0.3);
          osc.start(t + i * 0.12); osc.stop(t + i * 0.12 + 0.3);
        });
        break;
      case 'gameWin':
        [523, 659, 784, 1047, 784, 1047].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t + i * 0.15);
          gain.gain.setValueAtTime(0.2, t + i * 0.15);
          gain.gain.exponentialRampToValueAtTime(0.01, t + i * 0.15 + 0.4);
          osc.start(t + i * 0.15); osc.stop(t + i * 0.15 + 0.4);
        });
        break;
      case 'tick':
        o.type = 'sine';
        o.frequency.setValueAtTime(800, t);
        g.gain.setValueAtTime(0.1, t);
        g.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
        o.start(t); o.stop(t + 0.05);
        break;
    }
  }
};

const Game = {
  module: null,
  gridSize: 2,
  totalRounds: 3,
  currentRound: 1,
  score: 0,
  lives: 3,
  combo: 0,
  maxCombo: 0,
  correctCount: 0,
  wrongCount: 0,
  roundData: null,
  foundTargets: 0,
  totalTargets: 0,
  activeMoles: [],
  timer: null,
  timeLeft: 0,
  roundTime: 0,
  gameActive: false,
  moleTimer: null,

  switchScreen(name) {
    ['mainMenu','settingsScreen','gameScreen','resultScreen'].forEach(id => {
      document.getElementById(id).style.display = id === name ? 'flex' : 'none';
    });
  },

  initMenu() {
    document.querySelectorAll('.module-card').forEach(card => {
      card.addEventListener('click', () => {
        AudioSys.play('pop');
        this.module = card.dataset.module;
        const names = { pinyin: '拼音洞穴', hanzi: '汉字森林', math: '数学矿山' };
        document.getElementById('settingsTitle').textContent = names[this.module] + ' - 选择难度';
        this.switchScreen('settingsScreen');
      });
    });

    document.getElementById('backToMenu').addEventListener('click', () => {
      AudioSys.play('pop');
      this.switchScreen('mainMenu');
    });

    document.getElementById('startGame').addEventListener('click', () => {
      AudioSys.play('pop');
      this.startGame();
    });

    document.querySelectorAll('#gridOptions .option-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        AudioSys.play('tick');
        document.querySelectorAll('#gridOptions .option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        this.gridSize = parseInt(btn.dataset.grid);
      });
    });

    document.querySelectorAll('#roundOptions .option-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        AudioSys.play('tick');
        document.querySelectorAll('#roundOptions .option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        this.totalRounds = parseInt(btn.dataset.round);
      });
    });

    document.getElementById('gameBack').addEventListener('click', () => this.endGame());
    document.getElementById('resultMenu').addEventListener('click', () => {
      AudioSys.play('pop');
      this.switchScreen('mainMenu');
    });
    document.getElementById('resultReplay').addEventListener('click', () => {
      AudioSys.play('pop');
      this.startGame();
    });

    // 键盘快捷键
    document.addEventListener('keydown', e => {
      if (!this.gameActive) return;
      const key = parseInt(e.key);
      if (key >= 1 && key <= this.gridSize * this.gridSize) {
        this.hitMole(key - 1);
      }
    });
  },

  startGame() {
    this.currentRound = 1;
    this.score = 0;
    this.lives = 3;
    this.combo = 0;
    this.maxCombo = 0;
    this.correctCount = 0;
    this.wrongCount = 0;
    this.gameActive = true;
    this.switchScreen('gameScreen');
    this.updateHeader();
    this.showCountdown(() => this.startRound());
  },

  showCountdown(callback) {
    const overlay = document.getElementById('countdownOverlay');
    overlay.style.display = 'flex';
    let count = 3;
    const el = document.getElementById('countdownOverlay');
    el.textContent = count;
    AudioSys.play('tick');
    const iv = setInterval(() => {
      count--;
      if (count > 0) {
        el.textContent = count;
        AudioSys.play('tick');
      } else if (count === 0) {
        el.textContent = '开始！';
        AudioSys.play('roundWin');
      } else {
        clearInterval(iv);
        overlay.style.display = 'none';
        callback();
      }
    }, 600);
  },

  startRound() {
    this.foundTargets = 0;
    this.activeMoles = [];
    this.combo = 0;
    this.updateCombo();
    this.updateHeader();

    // 随机选择题目
    const pool = GameData[this.module].targets;
    this.roundData = pool[Math.floor(Math.random() * pool.length)];

    // 生成目标值显示
    let targetText = this.roundData.target;
    if (this.module === 'math') {
      document.querySelector('.target-display .label').textContent = this.roundData.q + ' =';
    } else if (this.module === 'pinyin') {
      document.querySelector('.target-display .label').textContent = '找拼音：';
    } else {
      document.querySelector('.target-display .label').textContent = '找汉字：';
    }
    document.getElementById('targetValue').textContent = targetText;

    // 创建地鼠洞
    this.createGrid();

    // 计算目标数量和干扰项
    const totalCells = this.gridSize * this.gridSize;
    this.totalTargets = Math.min(Math.floor(totalCells * 0.4) + 1, Math.floor(totalCells / 2));
    const bombCount = Math.min(Math.floor(this.currentRound / 2), Math.floor(totalCells / 4));
    const distractorCount = totalCells - this.totalTargets - bombCount;

    // 填充内容
    const contents = [];
    const targetVal = this.module === 'pinyin' ? this.roundData.target : this.roundData.target;

    // 目标
    for (let i = 0; i < this.totalTargets; i++) {
      if (this.module === 'pinyin') {
        const opt = this.roundData.options.find(o => o.t === targetVal);
        contents.push({ type: 'target', text: opt.t, sub: opt.c });
      } else if (this.module === 'hanzi') {
        contents.push({ type: 'target', text: targetVal });
      } else {
        contents.push({ type: 'target', text: targetVal });
      }
    }

    // 干扰项
    const distractors = this.module === 'pinyin'
      ? this.roundData.options.filter(o => o.t !== targetVal).map(o => ({ type: 'normal', text: o.t, sub: o.c }))
      : this.roundData.options.filter(o => o !== targetVal).map(o => ({ type: 'normal', text: o }));

    for (let i = 0; i < distractorCount; i++) {
      const d = distractors[i % distractors.length];
      contents.push({ ...d });
    }

    // 炸弹
    for (let i = 0; i < bombCount; i++) {
      contents.push({ type: 'bomb', text: '💣' });
    }

    // 打乱
    this.contents = this.shuffle([...contents]);

    // 设置时间限制
    this.roundTime = Math.max(8, 12 - this.gridSize + this.totalTargets * 2);
    this.timeLeft = this.roundTime;
    this.startTimer();

    // 开始冒地鼠
    this.spawnMoles();
  },

  createGrid() {
    const grid = document.getElementById('holesGrid');
    grid.className = 'holes-grid grid-' + this.gridSize;
    grid.innerHTML = '';
    const total = this.gridSize * this.gridSize;
    for (let i = 0; i < total; i++) {
      const wrapper = document.createElement('div');
      wrapper.className = 'hole-wrapper';
      wrapper.innerHTML = `
        <div class="hole"></div>
        <div class="mole" id="mole-${i}" data-index="${i}">
          <div class="mole-face"><div class="eye"></div><div class="eye"></div></div>
          <div class="nose"></div>
          <div class="mole-content"></div>
        </div>
      `;
      wrapper.querySelector('.mole').addEventListener('click', () => this.hitMole(i));
      grid.appendChild(wrapper);
    }
  },

  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  },

  spawnMoles() {
    const total = this.gridSize * this.gridSize;
    const spawnDelay = Math.max(300, 800 - this.currentRound * 50);

    const spawnOne = () => {
      if (!this.gameActive) return;

      // 找一个空的洞
      const emptyIndices = [];
      for (let i = 0; i < total; i++) {
        if (!this.activeMoles.includes(i)) emptyIndices.push(i);
      }
      if (emptyIndices.length === 0) return;

      const idx = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      const mole = document.getElementById('mole-' + idx);
      const content = this.contents[idx];

      mole.className = 'mole up ' + content.type;
      const mc = mole.querySelector('.mole-content');
      mc.innerHTML = content.sub
        ? `<div>${content.text}</div><small>${content.sub}</small>`
        : content.text;

      this.activeMoles.push(idx);
      AudioSys.play('pop');

      // 自动缩回
      const stayTime = Math.max(1500, 2500 - this.currentRound * 150);
      setTimeout(() => {
        if (this.activeMoles.includes(idx)) {
          mole.classList.remove('up');
          this.activeMoles = this.activeMoles.filter(m => m !== idx);
        }
      }, stayTime);
    };

    // 初始批量冒出
    for (let i = 0; i < Math.min(total, 3); i++) {
      setTimeout(spawnOne, i * 200);
    }

    // 持续冒出
    this.moleTimer = setInterval(() => {
      if (this.activeMoles.length < total) spawnOne();
    }, spawnDelay);
  },

  hitMole(index) {
    if (!this.gameActive || !this.activeMoles.includes(index)) return;

    const mole = document.getElementById('mole-' + index);
    const content = this.contents[index];
    const rect = mole.getBoundingClientRect();

    if (content.type === 'bomb') {
      // 炸弹
      AudioSys.play('bomb');
      this.lives--;
      this.combo = 0;
      this.wrongCount++;
      this.showScorePopup(rect.left + rect.width/2, rect.top, '-1', 'negative');
      this.updateCombo();
      mole.classList.add('wrong');

      if (this.lives <= 0) {
        this.gameOver(false);
        return;
      }
    } else if (content.type === 'target') {
      // 正确
      AudioSys.play('hit');
      this.correctCount++;
      this.combo++;
      if (this.combo > this.maxCombo) this.maxCombo = this.combo;
      const points = 1 + Math.floor(this.combo / 3);
      this.score += points;
      this.showScorePopup(rect.left + rect.width/2, rect.top, '+' + points, 'positive');
      this.updateCombo();
      this.foundTargets++;
      mole.classList.add('hit');

      if (this.foundTargets >= this.totalTargets) {
        this.roundComplete();
        return;
      }
    } else {
      // 错误（干扰项）
      AudioSys.play('wrong');
      this.wrongCount++;
      this.combo = 0;
      mole.classList.add('wrong');
      this.updateCombo();

      // 短暂显示红框
      setTimeout(() => mole.classList.remove('wrong'), 400);
      return;
    }

    // 移除地鼠
    this.activeMoles = this.activeMoles.filter(m => m !== index);
    setTimeout(() => mole.classList.remove('up', 'hit', 'wrong'), 300);
    this.updateHeader();
  },

  showScorePopup(x, y, text, type) {
    const popup = document.createElement('div');
    popup.className = 'score-popup ' + type;
    popup.textContent = text;
    popup.style.left = x + 'px';
    popup.style.top = y + 'px';
    document.body.appendChild(popup);
    setTimeout(() => popup.remove(), 800);
  },

  updateCombo() {
    const cd = document.getElementById('comboDisplay');
    if (this.combo >= 2) {
      cd.textContent = '连击 x' + this.combo + '!';
      cd.classList.add('show');
    } else {
      cd.classList.remove('show');
    }
  },

  startTimer() {
    clearInterval(this.timer);
    const bar = document.getElementById('timerBar');
    bar.style.width = '100%';
    this.timer = setInterval(() => {
      this.timeLeft -= 0.1;
      const pct = Math.max(0, (this.timeLeft / this.roundTime) * 100);
      bar.style.width = pct + '%';
      if (this.timeLeft <= 0) {
        this.roundComplete(false);
      }
    }, 100);
  },

  roundComplete(success = true) {
    clearInterval(this.timer);
    clearInterval(this.moleTimer);
    this.gameActive = false;

    // 隐藏所有地鼠
    document.querySelectorAll('.mole').forEach(m => m.classList.remove('up'));
    this.activeMoles = [];

    if (success) {
      AudioSys.play('roundWin');
      const timeBonus = Math.floor(this.timeLeft);
      this.score += timeBonus;
      this.showRoundMessage('太棒了！+' + timeBonus + '时间奖励');
    } else {
      this.showRoundMessage('时间到！');
    }

    setTimeout(() => {
      if (this.currentRound >= this.totalRounds) {
        this.gameOver(true);
      } else {
        this.currentRound++;
        this.gameActive = true;
        this.updateHeader();
        this.startRound();
      }
    }, 2000);
  },

  showRoundMessage(text) {
    const overlay = document.getElementById('roundOverlay');
    document.getElementById('roundMessage').textContent = text;
    overlay.style.display = 'flex';
    setTimeout(() => { overlay.style.display = 'none'; }, 1500);
  },

  gameOver(completed) {
    clearInterval(this.timer);
    clearInterval(this.moleTimer);
    this.gameActive = false;

    if (completed) {
      AudioSys.play('gameWin');
      this.createConfetti();
    }

    const accuracy = this.correctCount + this.wrongCount > 0
      ? Math.round((this.correctCount / (this.correctCount + this.wrongCount)) * 100)
      : 0;

    // 评级
    let title, stars, titleClass;
    if (this.score >= this.totalRounds * 5) {
      title = '太厉害了！'; stars = '⭐⭐⭐'; titleClass = 'amazing';
    } else if (this.score >= this.totalRounds * 3) {
      title = '做得真棒！'; stars = '⭐⭐'; titleClass = 'great';
    } else {
      title = '继续加油！'; stars = '⭐'; titleClass = 'good';
    }

    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultTitle').className = 'result-title ' + titleClass;
    document.getElementById('resultStars').textContent = stars;
    document.getElementById('finalScore').textContent = this.score;
    document.getElementById('finalAccuracy').textContent = accuracy + '%';
    document.getElementById('finalCombo').textContent = this.maxCombo;

    this.switchScreen('resultScreen');
  },

  createConfetti() {
    const colors = ['#FF7043','#FFD54F','#66BB6A','#42A5F5','#AB47BC','#EF5350'];
    for (let i = 0; i < 50; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.animationDelay = Math.random() * 1 + 's';
      c.style.animationDuration = (1.5 + Math.random()) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3000);
    }
  },

  updateHeader() {
    document.getElementById('scoreDisplay').textContent = this.score;
    document.getElementById('roundDisplay').textContent = this.currentRound + '/' + this.totalRounds;
    document.getElementById('livesDisplay').textContent = this.lives;
  },

  endGame() {
    clearInterval(this.timer);
    clearInterval(this.moleTimer);
    this.gameActive = false;
    this.switchScreen('mainMenu');
  }
};

// 启动
Game.initMenu();
</script>
