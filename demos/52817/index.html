<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AI Lens - 智能相机</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
    <div id="app">
        <div id="camera-view" class="view active">
            <div class="viewfinder-container">
                <video id="camera-video" autoplay muted playsinline webkit-playsinline disablepictureinpicture x5-playsinline></video>
                <canvas id="filter-canvas"></canvas>
                <canvas id="guide-canvas"></canvas>
            </div>

            <div class="top-bar">
                <button class="icon-btn gallery-btn" id="gallery-btn" aria-label="相册">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <span class="photo-count" id="photo-count">0</span>
                </button>
                <div class="ai-status">
                    <div class="ai-indicator" id="ai-indicator">
                        <span class="pulse-dot"></span>
                        <span class="ai-text">AI</span>
                    </div>
                    <span id="ai-scene-label" class="ai-scene-label">场景识别中</span>
                    <div class="recommend-filters" id="recommend-filters"></div>
                </div>
                <div class="top-right-btns">
                    <button class="icon-btn" id="flash-btn" aria-label="闪光灯">
                        <svg id="flash-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                    </button>
                    <button class="icon-btn" id="switch-cam-btn" aria-label="切换摄像头">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/><path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"/><polyline points="13 21 21 13"/><polyline points="21 21 13 13"/></svg>
                    </button>
                </div>
            </div>

            <div class="bottom-controls">
                <div class="filter-strip" id="filter-strip"></div>
                <div class="shutter-row">
                    <button class="filter-toggle-btn" id="filter-toggle-btn" aria-label="滤镜">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
                        <span class="btn-label">滤镜</span>
                    </button>
                    <button class="shutter-btn" id="shutter-btn" aria-label="拍照">
                        <span class="shutter-outer">
                            <span class="shutter-inner"></span>
                        </span>
                    </button>
                    <button class="cam-switch-btn-small" id="cam-switch-btn-small" aria-label="翻转">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.9l2-2h4.2l2 2H20a2 2 0 0 1 2 2v3"/><path d="M16 18l4-4-4-4"/><path d="M20 14H9"/></svg>
                        <span class="btn-label">翻转</span>
                    </button>
                </div>
            </div>

            <div id="permission-modal" class="modal">
                <div class="modal-content">
                    <div class="modal-icon" id="permission-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    </div>
                    <h2 id="permission-title">需要相机权限</h2>
                    <p id="permission-desc">AI Lens 需要访问您的相机才能拍照，请点击按钮授权访问。</p>
                    <div id="permission-detail" class="permission-detail" style="display:none;"></div>
                    <div id="https-hint" class="https-hint" style="display:none;">
                        <div class="hint-title">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            请使用HTTPS地址访问
                        </div>
                        <p class="hint-text">手机浏览器要求摄像头必须在加密连接下使用，请在手机浏览器地址栏输入以下HTTPS地址：</p>
                        <div class="https-url-box" id="https-url-box">
                            <span id="https-url-text">加载中...</span>
                            <button id="copy-url-btn" class="copy-btn" style="display:none;">复制</button>
                        </div>
                        <p class="hint-warning">首次访问会提示"不安全"，请点击"高级"→"继续访问"即可。</p>
                    </div>
                    <button class="primary-btn" id="grant-permission-btn">允许访问相机</button>
                </div>
            </div>
        </div>

        <div id="preview-view" class="view">
            <div class="preview-container">
                <img id="preview-image" alt="拍摄的照片">
                <div class="crop-suggestion" id="crop-suggestion">
                    <div class="crop-box" id="crop-box"></div>
                    <div class="crop-label" id="crop-label-text">AI构图建议</div>
                </div>
            </div>
            <div class="preview-top-bar">
                <button class="icon-btn" id="back-to-camera-btn" aria-label="返回">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
                </button>
                <div class="preview-filter-strip" id="preview-filter-strip"></div>
            </div>
            <div class="preview-bottom-bar">
                <button class="action-btn" id="retake-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    <span>重拍</span>
                </button>
                <button class="action-btn primary" id="save-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                    <span>保存</span>
                </button>
                <button class="action-btn" id="apply-crop-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.13 1L6 16a2 2 0 0 0 2 2h15"/><path d="M1 6.13L16 6a2 2 0 0 1 2 2v15"/></svg>
                    <span>AI裁剪</span>
                </button>
            </div>
        </div>

        <div id="gallery-view" class="view">
            <div class="gallery-header">
                <button class="icon-btn" id="gallery-back-btn" aria-label="返回">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
                </button>
                <h1>我的相册</h1>
                <span class="gallery-count" id="gallery-count">0张</span>
            </div>
            <div class="gallery-grid" id="gallery-grid"></div>
            <div class="gallery-empty" id="gallery-empty">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <p>还没有照片</p>
                <button class="primary-btn" id="start-shooting-btn">去拍第一张</button>
            </div>
        </div>

        <div id="lightbox-view" class="view">
            <div class="lightbox-header">
                <button class="icon-btn" id="lightbox-back-btn" aria-label="返回相册">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
                </button>
                <button class="icon-btn delete-btn" id="delete-photo-btn" aria-label="删除">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>
            <div class="lightbox-container">
                <img id="lightbox-image" alt="照片详情">
            </div>
            <div class="lightbox-footer">
                <button class="action-btn" id="download-photo-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>下载</span>
                </button>
                <span class="photo-date" id="photo-date"></span>
            </div>
        </div>

        <div id="toast" class="toast"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
    <script src="js/filters.js?v=6"></script>
    <script src="js/ai.js?v=6"></script>
    <script src="js/storage.js?v=6"></script>
    <script src="js/camera.js?v=6"></script>
    <script src="js/app.js?v=6"></script>
</body>
</html>
