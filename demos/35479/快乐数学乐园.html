<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快乐数学乐园 - 幼儿园数学启蒙</title>
    <style>
        /* ===== 基础重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== 页面背景 ===== */
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 头部标题区 ===== */
        .header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(180deg, #ff9a9e 0%, #fecfef 100%);
            border-radius: 0 0 40px 40px;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
        }

        .header h1 {
            font-size: 2.5em;
            color: #fff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        .header p {
            color: rgba(255,255,255,0.95);
            font-size: 1.2em;
            font-weight: 500;
        }

        /* ===== 主内容区 ===== */
        .main-content {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* ===== 游戏卡片 ===== */
        .game-section {
            background: #fff;
            border-radius: 30px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 1.8em;
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .section-title span {
            font-size: 1.5em;
        }

        /* ===== 数字认知区 ===== */
        .number-showcase {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        .number-card {
            background: linear-gradient(145deg, #fff 0%, #f0f0f0 100%);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .number-card:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: #ff9a9e;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
        }

        .number-card .num {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #ffa502);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .number-card .items {
            font-size: 1.5em;
            margin-top: 10px;
        }

        .number-card .word {
            font-size: 1em;
            color: #666;
            margin-top: 5px;
        }

        /* ===== 计数游戏 ===== */
        .counting-game {
            text-align: center;
        }

        .counting-area {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-radius: 25px;
            padding: 30px;
            margin: 20px 0;
            min-height: 200px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .counting-item {
            font-size: 3em;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .counting-question {
            font-size: 2em;
            color: #333;
            margin: 20px 0;
        }

        .answer-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .answer-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(145deg, #ff9a9e, #ff6b6b);
            color: #fff;
            box-shadow: 0 6px 15px rgba(255, 107, 107, 0.4);
        }

        .answer-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }

        .answer-btn.correct {
            background: linear-gradient(145deg, #7bed9f, #2ed573);
            animation: pulse 0.5s ease;
        }

        .answer-btn.wrong {
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a);
            animation: shake 0.5s ease;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* ===== 加减法游戏 ===== */
        .math-game {
            text-align: center;
        }

        .math-problem {
            font-size: 3em;
            color: #333;
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%);
            border-radius: 20px;
        }

        .math-problem .symbol {
            color: #ff6b6b;
            margin: 0 15px;
        }

        .math-problem .equals {
            color: #666;
            margin: 0 15px;
        }

        .math-input {
            width: 120px;
            height: 60px;
            font-size: 2em;
            text-align: center;
            border: 3px solid #ff9a9e;
            border-radius: 15px;
            outline: none;
            margin: 0 10px;
        }

        .math-input:focus {
            border-color: #ff6b6b;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.3);
        }

        .check-btn {
            padding: 15px 40px;
            font-size: 1.3em;
            background: linear-gradient(145deg, #74b9ff, #0984e3);
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(9, 132, 227, 0.4);
            margin-top: 20px;
        }

        .check-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(9, 132, 227, 0.5);
        }

        .result-message {
            font-size: 2em;
            margin-top: 20px;
            min-height: 50px;
        }

        .result-message.success {
            color: #2ed573;
        }

        .result-message.error {
            color: #ff6b6b;
        }

        /* ===== 形状认知 ===== */
        .shapes-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            text-align: center;
        }

        .shape-card {
            background: #fff;
            border-radius: 20px;
            padding: 25px 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .shape-card:hover {
            border-color: #74b9ff;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(116, 185, 255, 0.3);
        }

        .shape-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
        }

        .shape-name {
            font-size: 1.3em;
            color: #333;
            font-weight: bold;
        }

        .shape-tip {
            font-size: 0.9em;
            color: #888;
            margin-top: 5px;
        }

        /* ===== 反馈动画 ===== */
        .feedback-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: #fff;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .feedback-popup.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .feedback-popup .emoji {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .feedback-popup .text {
            font-size: 2em;
            color: #333;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }

        .overlay.show {
            display: block;
        }

        /* ===== 底部装饰 ===== */
        .footer {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 0.9em;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .number-showcase {
                grid-template-columns: repeat(3, 1fr);
            }

            .shapes-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .math-problem {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>

    <!-- 头部标题 -->
    <header class="header">
        <h1>🎈 快乐数学乐园 🎈</h1>
        <p>和小动物们一起学数学吧！</p>
    </header>

    <!-- 主内容 -->
    <main class="main-content">

        <!-- 数字认知 -->
        <section class="game-section">
            <h2 class="section-title"><span>🔢</span> 认识数字</h2>
            <div class="number-showcase">
                <div class="number-card" onclick="playNumber(1)">
                    <div class="num">1</div>
                    <div class="items">🍎</div>
                    <div class="word">一</div>
                </div>
                <div class="number-card" onclick="playNumber(2)">
                    <div class="num">2</div>
                    <div class="items">🍎🍎</div>
                    <div class="word">二</div>
                </div>
                <div class="number-card" onclick="playNumber(3)">
                    <div class="num">3</div>
                    <div class="items">🍎🍎🍎</div>
                    <div class="word">三</div>
                </div>
                <div class="number-card" onclick="playNumber(4)">
                    <div class="num">4</div>
                    <div class="items">🍎🍎🍎🍎</div>
                    <div class="word">四</div>
                </div>
                <div class="number-card" onclick="playNumber(5)">
                    <div class="num">5</div>
                    <div class="items">🍎🍎🍎🍎🍎</div>
                    <div class="word">五</div>
                </div>
                <div class="number-card" onclick="playNumber(6)">
                    <div class="num">6</div>
                    <div class="items">🐟🐟🐟🐟🐟🐟</div>
                    <div class="word">六</div>
                </div>
                <div class="number-card" onclick="playNumber(7)">
                    <div class="num">7</div>
                    <div class="items">🌟🌟🌟🌟🌟🌟🌟</div>
                    <div class="word">七</div>
                </div>
                <div class="number-card" onclick="playNumber(8)">
                    <div class="num">8</div>
                    <div class="items">🦋🦋🦋🦋🦋🦋🦋🦋</div>
                    <div class="word">八</div>
                </div>
                <div class="number-card" onclick="playNumber(9)">
                    <div class="num">9</div>
                    <div class="items">🌸🌸🌸🌸🌸🌸🌸🌸🌸</div>
                    <div class="word">九</div>
                </div>
                <div class="number-card" onclick="playNumber(10)">
                    <div class="num">10</div>
                    <div class="items">⭐⭐⭐⭐⭐⭐⭐⭐⭐⭐</div>
                    <div class="word">十</div>
                </div>
            </div>
        </section>

        <!-- 计数游戏 -->
        <section class="game-section">
            <h2 class="section-title"><span>🎯</span> 数数小游戏</h2>
            <div class="counting-game">
                <p class="counting-question" id="countQuestion">数一数有多少个小动物？</p>
                <div class="counting-area" id="countingArea"></div>
                <div class="answer-buttons" id="answerButtons"></div>
            </div>
        </section>

        <!-- 加减法 -->
        <section class="game-section">
            <h2 class="section-title"><span>🧮</span> 简单加减</h2>
            <div class="math-game">
                <p class="counting-question">算一算，答案是什么？</p>
                <div class="math-problem" id="mathProblem">
                    <span id="num1">2</span>
                    <span class="symbol" id="operator">+</span>
                    <span id="num2">3</span>
                    <span class="equals">=</span>
                    <span class="symbol">?</span>
                </div>
                <input type="number" class="math-input" id="mathAnswer" min="0" max="20">
                <br>
                <button class="check-btn" onclick="checkMathAnswer()">检查答案</button>
                <div class="result-message" id="mathResult"></div>
            </div>
        </section>

        <!-- 形状认知 -->
        <section class="game-section">
            <h2 class="section-title"><span>🔷</span> 认识形状</h2>
            <div class="shapes-grid">
                <div class="shape-card" onclick="showShape('circle')">
                    <svg class="shape-icon" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" fill="#ff6b6b"/>
                    </svg>
                    <div class="shape-name">圆形</div>
                    <div class="shape-tip">像太阳一样圆圆的</div>
                </div>
                <div class="shape-card" onclick="showShape('square')">
                    <svg class="shape-icon" viewBox="0 0 100 100">
                        <rect x="15" y="15" width="70" height="70" fill="#74b9ff"/>
                    </svg>
                    <div class="shape-name">正方形</div>
                    <div class="shape-tip">四条边一样长</div>
                </div>
                <div class="shape-card" onclick="showShape('triangle')">
                    <svg class="shape-icon" viewBox="0 0 100 100">
                        <polygon points="50,10 90,90 10,90" fill="#ffe66d"/>
                    </svg>
                    <div class="shape-name">三角形</div>
                    <div class="shape-tip">有三个角</div>
                </div>
                <div class="shape-card" onclick="showShape('rectangle')">
                    <svg class="shape-icon" viewBox="0 0 100 100">
                        <rect x="10" y="30" width="80" height="50" fill="#7bed9f"/>
                    </svg>
                    <div class="shape-name">长方形</div>
                    <div class="shape-tip">像门一样长长的</div>
                </div>
            </div>
        </section>

    </main>

    <!-- 反馈弹窗 -->
    <div class="overlay" id="overlay"></div>
    <div class="feedback-popup" id="feedbackPopup">
        <div class="emoji" id="feedbackEmoji">🎉</div>
        <div class="text" id="feedbackText">太棒了！</div>
    </div>

    <!-- 底部 -->
    <footer class="footer">
        <p>🎈 快乐数学乐园 - 让每个孩子爱上数学 🎈</p>
    </footer>

    <script>
        /* ===== 数字认知功能 ===== */
        // 点击数字卡片时的反馈
        function playNumber(num) {
            const emojis = ['👏', '🎉', '⭐', '🌟', '💫'];
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            showFeedback(randomEmoji, `这是数字 ${num}！`);
        }

        /* ===== 计数游戏功能 ===== */
        const countingAnimals = ['🐶', '🐱', '🐰', '🦊', '🐻', '🐼', '🐨', '🦁', '🐸', '🐷'];
        let currentCount = 0;

        // 初始化计数游戏
        function initCountingGame() {
            currentCount = Math.floor(Math.random() * 6) + 2; // 2-7
            const animal = countingAnimals[Math.floor(Math.random() * countingAnimals.length)];
            
            // 生成小动物
            let animalsHTML = '';
            for (let i = 0; i < currentCount; i++) {
                animalsHTML += `<span class="counting-item" style="animation-delay: ${i * 0.1}s">${animal}</span>`;
            }
            document.getElementById('countingArea').innerHTML = animalsHTML;

            // 生成答案按钮
            const correctIndex = Math.floor(Math.random() * 4);
            let answers = [];
            for (let i = 0; i < 4; i++) {
                if (i === correctIndex) {
                    answers.push(currentCount);
                } else {
                    let wrongAnswer;
                    do {
                        wrongAnswer = Math.floor(Math.random() * 8) + 1;
                    } while (wrongAnswer === currentCount || answers.includes(wrongAnswer));
                    answers.push(wrongAnswer);
                }
            }

            let buttonsHTML = '';
            answers.forEach((answer, index) => {
                buttonsHTML += `<button class="answer-btn" onclick="checkCountAnswer(${answer}, this)">${answer}</button>`;
            });
            document.getElementById('answerButtons').innerHTML = buttonsHTML;
        }

        // 检查计数答案
        function checkCountAnswer(answer, btn) {
            if (answer === currentCount) {
                btn.classList.add('correct');
                showFeedback('🎉', '数对了！真聪明！');
                setTimeout(initCountingGame, 2000);
            } else {
                btn.classList.add('wrong');
                setTimeout(() => btn.classList.remove('wrong'), 500);
                showFeedback('💪', '再数数看！');
            }
        }

        /* ===== 加减法游戏功能 ===== */
        function generateMathProblem() {
            const isAddition = Math.random() > 0.5;
            let num1, num2, result;

            if (isAddition) {
                num1 = Math.floor(Math.random() * 6) + 1;
                num2 = Math.floor(Math.random() * 6) + 1;
                result = num1 + num2;
                document.getElementById('operator').textContent = '+';
            } else {
                num1 = Math.floor(Math.random() * 8) + 2;
                num2 = Math.floor(Math.random() * num1) + 1;
                result = num1 - num2;
                document.getElementById('operator').textContent = '-';
            }

            document.getElementById('num1').textContent = num1;
            document.getElementById('num2').textContent = num2;
            document.getElementById('mathAnswer').value = '';
            document.getElementById('mathResult').textContent = '';
            document.getElementById('mathResult').className = 'result-message';
        }

        // 检查数学答案
        function checkMathAnswer() {
            const operator = document.getElementById('operator').textContent;
            const num1 = parseInt(document.getElementById('num1').textContent);
            const num2 = parseInt(document.getElementById('num2').textContent);
            const userAnswer = parseInt(document.getElementById('mathAnswer').value);
            
            let correctAnswer = operator === '+' ? num1 + num2 : num1 - num2;
            const resultDiv = document.getElementById('mathResult');

            if (userAnswer === correctAnswer) {
                resultDiv.textContent = '🎉 太棒了！完全正确！';
                resultDiv.className = 'result-message success';
                setTimeout(generateMathProblem, 2000);
            } else {
                resultDiv.textContent = '💪 加油！再想想看~';
                resultDiv.className = 'result-message error';
            }
        }

        /* ===== 形状认知功能 ===== */
        function showShape(shape) {
            const shapeInfo = {
                circle: { emoji: '⭕', text: '这是圆形！像太阳和气球一样~' },
                square: { emoji: '🔲', text: '这是正方形！四条边一样长~' },
                triangle: { emoji: '🔺', text: '这是三角形！有三个角~' },
                rectangle: { emoji: '📱', text: '这是长方形！像门和窗户~' }
            };
            const info = shapeInfo[shape];
            showFeedback(info.emoji, info.text);
        }

        /* ===== 通用反馈弹窗 ===== */
        function showFeedback(emoji, text) {
            document.getElementById('feedbackEmoji').textContent = emoji;
            document.getElementById('feedbackText').textContent = text;
            document.getElementById('overlay').classList.add('show');
            document.getElementById('feedbackPopup').classList.add('show');
            
            setTimeout(() => {
                document.getElementById('overlay').classList.remove('show');
                document.getElementById('feedbackPopup').classList.remove('show');
            }, 1500);
        }

        // 点击遮罩关闭弹窗
        document.getElementById('overlay').addEventListener('click', () => {
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('feedbackPopup').classList.remove('show');
        });

        // 页面加载时初始化游戏
        window.onload = function() {
            initCountingGame();
            generateMathProblem();
        };
    </script>

</body>
</html>
