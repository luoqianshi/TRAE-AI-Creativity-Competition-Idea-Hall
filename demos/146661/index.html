<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>倒推日程｜Deadline 智能计划生成器</title>
<style>
:root{--bg:#f4f1eb;--paper:#fbfaf6;--ink:#22211f;--muted:#77716a;--line:#ded8cf;--accent:#635bff;--accent-soft:#e9e7ff;--warn:#b2672d;--good:#3d7a56;--shadow:0 10px 28px rgba(43,38,32,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}
body{margin:0;background:#e5e2dc;color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}
.wrap{width:100%;max-width:480px;min-height:100vh;margin:0 auto;padding:0 0 98px;background:var(--bg);box-shadow:0 0 50px rgba(43,38,32,.12)}
.top{position:relative;overflow:hidden;padding:18px 18px 24px;border:0;border-bottom:1px solid var(--line);border-radius:0 0 28px 28px;background:linear-gradient(155deg,#fcfbf7 0%,#eceaff 100%)}
.top:after{content:"";position:absolute;width:180px;height:180px;border:30px solid rgba(99,91,255,.09);border-radius:50%;right:-76px;top:-82px}
.brand{position:relative;z-index:1;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800}.logo{width:38px;height:38px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(99,91,255,.24)}
h1{position:relative;z-index:1;margin:24px 0 10px;font-family:Georgia,"Songti SC",serif;font-size:30px;line-height:1.16;letter-spacing:-.5px}.sub{position:relative;z-index:1;color:var(--muted);font-size:14px;line-height:1.7}
.badges{position:relative;z-index:1;display:flex;gap:8px;margin-top:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.badges::-webkit-scrollbar{display:none}.badges span{flex:0 0 auto;border:1px solid #d9d5ee;background:rgba(255,255,255,.7);border-radius:99px;padding:7px 10px;font-size:11px;color:#625d70}
.grid{display:block;margin:14px 14px 0}.card{margin-bottom:14px;padding:16px;background:rgba(251,250,246,.98);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);scroll-margin-top:12px}.card h2{font-size:17px;margin:0 0 14px}
.form{display:grid;gap:14px}label span{display:block;margin-bottom:7px;color:var(--muted);font-size:12px}input,select{width:100%;min-height:46px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 12px;color:var(--ink);outline:none}input:focus,select:focus{border-color:#aaa4ff;box-shadow:0 0 0 3px rgba(99,91,255,.1)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{min-height:50px;border:0;background:var(--accent);color:#fff;border-radius:14px;padding:13px 15px;font-weight:800;box-shadow:0 10px 22px rgba(99,91,255,.22)}.primary:active{transform:scale(.985)}
.ghost{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.notice{padding:11px;border-radius:12px;background:#f3f0ea;color:var(--muted);font-size:11px;line-height:1.65}
.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:13px}.headrow h2{margin:0}.status{flex:0 0 auto;padding:7px 9px;border-radius:99px;background:var(--accent-soft);color:#4e47c7;font-size:11px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}.stat{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}.stat b{display:block;margin-top:4px;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.empty{padding:50px 18px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted);font-size:13px;line-height:1.6}.timeline{display:grid;gap:10px;position:relative}.timeline:before{content:"";position:absolute;left:17px;top:30px;bottom:30px;width:2px;background:#ddd9f3}
.phase{position:relative;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff}.phase-no{position:relative;z-index:1;width:34px;height:34px;border-radius:11px;background:var(--accent-soft);color:#4f49cc;display:grid;place-items:center;font-weight:900}.phase h3{margin:0 0 5px;font-size:14px}.phase p{margin:0;padding-right:0;color:var(--muted);font-size:11px;line-height:1.5}.date{grid-column:2;margin-top:6px;text-align:left;color:#5f5952;font-size:11px;line-height:1.5}
.today{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}.today-list{display:grid;gap:8px}.todo{display:flex;gap:10px;align-items:flex-start;min-height:48px;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:13px;line-height:1.5}.todo input{width:20px;height:20px;min-height:0;margin:0}.todo.done span{text-decoration:line-through;color:#aaa}.progress{height:9px;margin:14px 0 6px;overflow:hidden;border-radius:99px;background:#e7e2da}.bar{width:0;height:100%;background:var(--accent);transition:.25s}.risk{margin-top:14px;padding:11px;border-left:4px solid #d59258;border-radius:10px;background:#fff4e9;color:#8a5228;font-size:12px;line-height:1.55}
.footer{margin:18px 14px 0;text-align:center;color:var(--muted);font-size:11px}.bottom-nav{position:fixed;z-index:30;left:50%;bottom:0;width:100%;max-width:480px;transform:translateX(-50%);display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(251,250,246,.94);border-top:1px solid var(--line);backdrop-filter:blur(18px)}.bottom-nav button{min-height:48px;border:0;border-radius:14px;background:#eeebe5;color:#665f58;font-size:12px;font-weight:700}.bottom-nav .nav-primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(99,91,255,.22)}
@media(max-width:370px){.two,.actions{grid-template-columns:1fr}h1{font-size:27px}}
@media(min-width:700px){body{padding:24px 0}.wrap{min-height:calc(100vh - 48px);border-radius:30px;overflow:hidden}.bottom-nav{bottom:24px;border-radius:0 0 30px 30px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="top">
    <div class="brand"><div class="logo">⇤</div><span>倒推日程 · Deadline 智能计划生成器</span></div>
    <h1>不要从“有空再做”开始，<br>要从截止日期向今天倒推。</h1>
    <div class="sub">输入任务、截止日期和每天可投入时间，系统会生成阶段计划、今日行动与风险缓冲。</div>
  </section>

  <div class="grid">
    <aside class="card" id="settings">
      <h2>创建倒推计划</h2>
      <div class="form">
        <label><span>任务名称</span><input id="task" value="完成产品创意报名方案" placeholder="例如：完成论文初稿"></label>
        <label><span>任务类型</span><select id="type"><option>产品方案</option><option>考试复习</option><option>论文写作</option><option>设计交付</option><option>开发任务</option><option>活动筹备</option></select></label>
        <div class="two">
          <label><span>开始日期</span><input type="date" id="start"></label>
          <label><span>截止日期</span><input type="date" id="deadline"></label>
        </div>
        <div class="two">
          <label><span>每天可投入</span><select id="hours"><option value="0.5">0.5 小时</option><option value="1" selected>1 小时</option><option value="2">2 小时</option><option value="3">3 小时</option><option value="4">4 小时</option></select></label>
          <label><span>任务难度</span><select id="difficulty"><option value="1">简单</option><option value="1.3" selected>中等</option><option value="1.65">较难</option></select></label>
        </div>
        <button class="primary" id="generate">生成倒推计划</button>
        <div class="actions"><button class="ghost" id="delay">模拟延误 1 天</button><button class="ghost" id="copy">复制计划摘要</button></div>
        <div class="notice">演示版采用本地规则拆解任务，不上传任何数据，也不依赖真实 AI 接口。</div>
      </div>
    </aside>

    <main class="card" id="plan">
      <div class="headrow">
        <div><h2 id="planTitle">我的计划</h2><div style="font-size:12px;color:var(--muted);margin-top:5px" id="planRange">等待生成</div></div>
        <div class="status" id="status">尚未开始</div>
      </div>
      <div id="content"><div class="empty">📅<br><br>填写任务信息，系统会从截止日期向前倒推执行节奏。</div></div>
    </main>
  </div>
  <div class="footer">概念演示 · 进度只保存在当前浏览器会话中</div>
</div>
<nav class="bottom-nav" aria-label="移动端快捷操作">
  <button id="navSettings">⚙️ 设置</button>
  <button class="nav-primary" id="navGenerate">生成计划</button>
  <button id="navDelay">↻ 重排</button>
</nav>
<script>
const $=id=>document.getElementById(id);
const today=new Date(); const fmtInput=d=>d.toISOString().slice(0,10);
$("start").value=fmtInput(today);
const d2=new Date(today);d2.setDate(d2.getDate()+7);$("deadline").value=fmtInput(d2);
let delayDays=0,currentPlan=null;

const templates={
 "产品方案":[["明确目标与验收标准","梳理需求、用户和交付边界"],["收集素材与形成结构","完成信息收集和页面框架"],["完成核心内容","集中产出最关键的主体内容"],["检查与优化","校对逻辑、视觉和完整性"],["最终提交","保留缓冲并完成归档"]],
 "考试复习":[["盘点范围与诊断","列出考试范围并识别薄弱项"],["重点知识复习","按章节完成核心知识复盘"],["刷题与纠错","通过练习定位错误模式"],["模拟测试","按正式时间完成一轮模拟"],["回顾与休息","只复习错题并保证状态"]],
 "论文写作":[["确定问题与提纲","明确研究问题和章节结构"],["资料整理","完成文献与证据卡片"],["撰写初稿","先完整写完再局部优化"],["修改与引用检查","补证据、统一格式和引用"],["定稿提交","完成最终校对与备份"]],
 "设计交付":[["确认需求","明确尺寸、风格和交付格式"],["探索方案","完成草图与关键页面方向"],["高保真实现","制作主要视觉与交互"],["评审修订","处理反馈与边界状态"],["打包交付","导出文件并检查命名"]],
 "开发任务":[["澄清范围","确定功能、接口和验收标准"],["技术拆解","完成模块、数据与风险设计"],["编码实现","优先完成主流程"],["测试修复","覆盖异常、兼容和回归"],["发布交付","构建、说明与回滚准备"]],
 "活动筹备":[["确定目标与资源","明确人群、预算和负责人"],["安排流程","完成时间表、物料和分工"],["执行准备","确认场地、内容和通知"],["彩排检查","模拟流程并处理风险"],["活动执行","按清单执行并复盘"]]
};
function fmt(d){return `${d.getMonth()+1}月${d.getDate()}日`}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function generate(){
 const name=$("task").value.trim()||"未命名任务"; const type=$("type").value;
 const start=new Date($("start").value+"T00:00:00"); const deadline=new Date($("deadline").value+"T00:00:00");
 if(isNaN(start)||isNaN(deadline)||deadline<=start){alert("截止日期必须晚于开始日期");return}
 const total=Math.max(1,Math.ceil((deadline-start)/86400000)); const buffer=Math.max(1,Math.round(total*.15));
 const workDays=Math.max(1,total-buffer-delayDays); const tpl=templates[type];
 const weights=[.16,.22,.34,.18,.10], phases=[]; let cursor=new Date(start);
 tpl.forEach((p,i)=>{let days=i===tpl.length-1?Math.max(1,Math.ceil(workDays*.10)):Math.max(1,Math.round(workDays*weights[i]));if(i===tpl.length-1)cursor=addDays(deadline,-buffer);let end=i===tpl.length-1?deadline:addDays(cursor,days-1);if(end>deadline)end=deadline;phases.push({title:p[0],desc:p[1],start:new Date(cursor),end:new Date(end)});cursor=addDays(end,1)});
 const effort=Math.round(total*(+$("hours").value)*(+$("difficulty").value)*10)/10;
 currentPlan={name,type,start,deadline,total,buffer,effort,phases};
 render();
}
function render(){
 const p=currentPlan;$("planTitle").textContent=p.name;$("planRange").textContent=`${fmt(p.start)} — ${fmt(p.deadline)} · ${p.type}`;$("status").textContent=delayDays?`已延误 ${delayDays} 天`:"计划已生成";
 const todos=p.phases.slice(0,3).map((x,i)=>`${i===0?"今天":"接下来"}：${x.title}`);
 $("content").innerHTML=`
  <div class="stats">
   <div class="stat"><span>总周期</span><b>${p.total} 天</b></div>
   <div class="stat"><span>预计投入</span><b>${p.effort} h</b></div>
   <div class="stat"><span>风险缓冲</span><b>${p.buffer} 天</b></div>
   <div class="stat"><span>执行阶段</span><b>${p.phases.length} 个</b></div>
  </div>
  <div class="timeline">${p.phases.map((x,i)=>`
   <div class="phase"><div class="phase-no">${i+1}</div><div><h3>${x.title}</h3><p>${x.desc}</p></div><div class="date">${fmt(x.start)}<br>至 ${fmt(x.end)}</div></div>`).join("")}
  </div>
  <div class="today">
   <div class="headrow"><div><h2>今日行动</h2><div style="font-size:12px;color:var(--muted)">先完成最小可交付动作</div></div><div id="progressText" class="status">0 / ${todos.length}</div></div>
   <div class="today-list">${todos.map((t,i)=>`<label class="todo"><input type="checkbox" onchange="updateProgress()"><span>${t}</span></label>`).join("")}</div>
   <div class="progress"><div class="bar" id="bar"></div></div>
   <div class="risk">已自动在截止日前预留 ${p.buffer} 天缓冲，用于修改、突发事项和最终提交。</div>
  </div>`;
}
function updateProgress(){const boxes=[...document.querySelectorAll(".todo input")];boxes.forEach(x=>x.parentElement.classList.toggle("done",x.checked));const n=boxes.filter(x=>x.checked).length;$("bar").style.width=`${n/boxes.length*100}%`;$("progressText").textContent=`${n} / ${boxes.length}`;$("status").textContent=n===boxes.length?"今日任务完成":"执行中"}
$("generate").onclick=()=>{delayDays=0;generate()};
$("delay").onclick=()=>{if(!currentPlan)generate();delayDays++;generate()};
$("copy").onclick=async()=>{if(!currentPlan)generate();const p=currentPlan;const text=`${p.name}\n周期：${fmt(p.start)}—${fmt(p.deadline)}\n缓冲：${p.buffer}天\n\n${p.phases.map((x,i)=>`${i+1}. ${x.title}（${fmt(x.start)}—${fmt(x.end)}）`).join("\n")}`;try{await navigator.clipboard.writeText(text);$("copy").textContent="已复制";setTimeout(()=>$("copy").textContent="复制计划摘要",1200)}catch(e){alert(text)}};
document.getElementById("navSettings").onclick=()=>document.getElementById("settings").scrollIntoView({behavior:"smooth"});
document.getElementById("navGenerate").onclick=()=>{delayDays=0;generate();document.getElementById("plan").scrollIntoView({behavior:"smooth"})};
document.getElementById("navDelay").onclick=()=>{document.getElementById("delay").click();document.getElementById("plan").scrollIntoView({behavior:"smooth"})};
generate();
</script>
</body>
</html>
