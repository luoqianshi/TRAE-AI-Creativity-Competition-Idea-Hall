<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    
    <!-- 霓虹蓝色渐变 -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0099ff"/>
    </linearGradient>
    
    <!-- 渐变绿色（安全） -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    
    <!-- 渐变橙色（警告） -->
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    
    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 柔和阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" stroke="url(#neonBlue)" stroke-width="4"/>
  
  <!-- 外圈装饰 -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#neonBlue)" stroke-width="1" opacity="0.3"/>
  
  <!-- 汽车轮廓 - 背景 -->
  <g opacity="0.4">
    <!-- 车身 -->
    <path d="M100,320 Q120,280 160,260 L200,240 L312,240 L352,260 Q392,280 412,320 L430,360 L430,380 L82,380 L82,360 Z" 
          fill="none" stroke="url(#neonBlue)" stroke-width="4"/>
    <!-- 车窗 -->
    <path d="M170,250 L200,235 L312,235 L342,250 L340,270 L172,270 Z" 
          fill="none" stroke="url(#neonBlue)" stroke-width="3"/>
    <!-- 车轮 -->
    <circle cx="150" cy="375" r="35" fill="none" stroke="url(#neonBlue)" stroke-width="4"/>
    <circle cx="362" cy="375" r="35" fill="none" stroke="url(#neonBlue)" stroke-width="4"/>
  </g>
  
  <!-- 眼睛主体 -->
  <g filter="url(#shadow)">
    <!-- 眼眶 -->
    <ellipse cx="256" cy="230" rx="110" ry="70" fill="none" stroke="url(#neonBlue)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- 眼球背景 -->
    <ellipse cx="256" cy="230" rx="90" ry="55" fill="#0a1628" opacity="0.8"/>
    
    <!-- 虹膜 + 瞳孔 + 高光 - 组合组 -->
    <g>
      <!-- 虹膜 -->
      <ellipse cx="256" cy="230" rx="50" ry="45" fill="url(#neonGreen)">
        <animate attributeName="ry" values="45;0;45" dur="4s" repeatCount="indefinite" 
                 keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
      </ellipse>
      
      <!-- 瞳孔 -->
      <circle cx="256" cy="230" r="20" fill="#0f172a">
        <animate attributeName="cy" values="230;230;230" dur="4s" repeatCount="indefinite"
                 keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
        <animate attributeName="r" values="20;0;20" dur="4s" repeatCount="indefinite"
                 keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
      </circle>
      
      <!-- 高光 -->
      <ellipse cx="240" cy="215" rx="10" ry="7" fill="white" opacity="0.9">
        <animate attributeName="cy" values="215;215;215" dur="4s" repeatCount="indefinite"
                 keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
        <animate attributeName="ry" values="7;0;7" dur="4s" repeatCount="indefinite"
                 keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
      </ellipse>
      <circle cx="268" cy="242" r="4" fill="white" opacity="0.5">
        <animate attributeName="cy" values="242;242;242" dur="4s" repeatCount="indefinite"
                 keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
        <animate attributeName="r" values="4;0;4" dur="4s" repeatCount="indefinite"
                 keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
      </circle>
    </g>
    
    <!-- 上眼睑 - 动画遮罩 -->
    <ellipse cx="256" cy="195" rx="110" ry="55" fill="url(#bgGradient)">
      <animate attributeName="ry" values="0;60;0" dur="4s" repeatCount="indefinite"
               keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    </ellipse>
    
    <!-- 下眼睑 - 动画遮罩 -->
    <ellipse cx="256" cy="265" rx="110" ry="55" fill="url(#bgGradient)">
      <animate attributeName="ry" values="0;60;0" dur="4s" repeatCount="indefinite"
               keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    </ellipse>
    
    <!-- 眼睫毛/眼睑线 -->
    <path d="M150,195 Q256,160 362,195" fill="none" stroke="url(#neonBlue)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="d" values="M150,195 Q256,160 362,195;M150,230 Q256,230 362,230;M150,195 Q256,160 362,195" 
               dur="4s" repeatCount="indefinite"
               keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    </path>
    <path d="M150,265 Q256,300 362,265" fill="none" stroke="url(#neonBlue)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="d" values="M150,265 Q256,300 362,265;M150,230 Q256,230 362,230;M150,265 Q256,300 362,265" 
               dur="4s" repeatCount="indefinite"
               keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    </path>
  </g>
  
  <!-- 方向盘 - 眼睛下方 -->
  <g transform="translate(256, 360)" filter="url(#glow)">
    <!-- 外圈 -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#neonBlue)" stroke-width="5"/>
    <!-- 内圈 -->
    <circle cx="0" cy="0" r="15" fill="url(#neonBlue)" opacity="0.8"/>
    
    <!-- 方向盘辐条 -->
    <line x1="0" y1="-15" x2="0" y2="-60" stroke="url(#neonBlue)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-52" y1="30" x2="-15" y2="10" stroke="url(#neonBlue)" stroke-width="5" stroke-linecap="round"/>
    <line x1="52" y1="30" x2="15" y2="10" stroke="url(#neonBlue)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- 方向盘握把 -->
    <circle cx="0" cy="-60" r="8" fill="url(#neonOrange)"/>
    <circle cx="-52" cy="30" r="8" fill="url(#neonOrange)"/>
    <circle cx="52" cy="30" r="8" fill="url(#neonOrange)"/>
  </g>
  
  <!-- 速度指示线 - 左右两侧 -->
  <g opacity="0.4" stroke="url(#neonBlue)" stroke-width="2" stroke-linecap="round">
    <!-- 左侧 -->
    <line x1="60" y1="230" x2="80" y2="230"/>
    <line x1="50" y1="210" x2="65" y2="210"/>
    <line x1="50" y1="250" x2="65" y2="250"/>
    
    <!-- 右侧 -->
    <line x1="452" y1="230" x2="432" y2="230"/>
    <line x1="462" y1="210" x2="447" y2="210"/>
    <line x1="462" y1="250" x2="447" y2="250"/>
  </g>
  
  <!-- 信号波纹 - 监测中 -->
  <g transform="translate(256, 230)" opacity="0.5">
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#neonGreen)" stroke-width="2" stroke-dasharray="10 5">
      <animate attributeName="r" values="90;100;90" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#neonGreen)" stroke-width="1" stroke-dasharray="8 8">
      <animate attributeName="r" values="110;125;110" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
