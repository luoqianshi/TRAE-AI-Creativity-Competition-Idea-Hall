<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0099ff"/>
    </linearGradient>
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ffaa00"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" stroke="url(#neonBlue)" stroke-width="4"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#neonBlue)" stroke-width="1" opacity="0.3"/>
  <g transform="translate(120, 100)" filter="url(#glow)">
    <polygon points="0,-25 6,-10 22,-10 10,2 14,18 0,10 -14,18 -10,2 -22,-10 -6,-10" fill="url(#starGold)" opacity="0.6"/>
  </g>
  <g transform="translate(392, 120) scale(0.7)" filter="url(#glow)">
    <polygon points="0,-25 6,-10 22,-10 10,2 14,18 0,10 -14,18 -10,2 -22,-10 -6,-10" fill="url(#starGold)" opacity="0.5"/>
  </g>
  <g transform="translate(380, 380) scale(0.8)" filter="url(#glow)">
    <polygon points="0,-25 6,-10 22,-10 10,2 14,18 0,10 -14,18 -10,2 -22,-10 -6,-10" fill="url(#starGold)" opacity="0.7"/>
  </g>
  <g transform="translate(100, 350) scale(0.5)" filter="url(#glow)">
    <polygon points="0,-25 6,-10 22,-10 10,2 14,18 0,10 -14,18 -10,2 -22,-10 -6,-10" fill="url(#starGold)" opacity="0.4"/>
  </g>
  <g filter="url(#shadow)">
    <ellipse cx="256" cy="260" rx="130" ry="80" fill="none" stroke="url(#neonBlue)" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="256" cy="260" rx="110" ry="65" fill="#0a1628" opacity="0.8"/>
    <ellipse cx="256" cy="260" rx="60" ry="55" fill="url(#neonBlue)"/>
    <circle cx="256" cy="260" r="25" fill="#0f172a"/>
    <ellipse cx="236" cy="240" rx="12" ry="8" fill="white" opacity="0.8"/>
    <circle cx="270" cy="275" r="5" fill="white" opacity="0.5"/>
    <path d="M130,220 Q256,180 382,220" fill="none" stroke="url(#neonBlue)" stroke-width="4" stroke-linecap="round"/>
    <path d="M130,300 Q256,340 382,300" fill="none" stroke="url(#neonBlue)" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(256, 140) scale(1.2)" filter="url(#glow)">
    <polygon points="0,-35 8,-14 30,-14 14,3 20,25 0,14 -20,25 -14,3 -30,-14 -8,-14" fill="url(#starGold)"/>
    <polygon points="0,-20 4,-10 15,-10 8,0 10,10 0,5 -10,10 -8,0 -15,-10 -4,-10" fill="#fff" opacity="0.3"/>
  </g>
  <g transform="translate(256, 420)" opacity="0.6">
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#neonBlue)" stroke-width="3"/>
    <line x1="0" y1="-45" x2="0" y2="-70" stroke="url(#neonBlue)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-39" y1="22" x2="-60" y2="35" stroke="url(#neonBlue)" stroke-width="3" stroke-linecap="round"/>
    <line x1="39" y1="22" x2="60" y2="35" stroke="url(#neonBlue)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="12" fill="url(#neonBlue)" opacity="0.8"/>
  </g>
</svg>
