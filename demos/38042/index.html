<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时光记事馆</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#5E9CEC',
            secondary: '#FF9F89',
            quad1: '#FFE5E5',
            quad2: '#E5F4FF',
            quad3: '#FFF9E5',
            quad4: '#E5FFEF',
            appleText: '#1D1D1F',
            appleGray: '#86868B'
          },
          fontFamily: {
            apple: ['-apple-system', 'BlinkMacSystemFont', 'San Francisco', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .apple-card {
        @apply bg-white/80 backdrop-blur-lg rounded-2xl shadow-lg border border-white/50;
      }
      .apple-btn {
        @apply rounded-xl transition-all duration-300 hover:scale-[1.02] active:scale-[0.97] shadow-md;
      }
      .time-line-item {
        @apply relative pl-6 border-l-2 border-primary/40 py-4 ml-4;
      }
      .time-line-dot {
        @apply absolute w-3 h-3 rounded-full bg-primary left-[-7px] top-5;
      }
    }
    body {
      background: linear-gradient(135deg, #f7fafc 0%, #fef6f6 100%);
    }
    /* 滚动条美化 苹果风格 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 10px;
    }
  </style>
</head>
<body class="font-apple text-appleText min-h-screen p-6">
  <div class="max-w-[1600px] mx-auto p-6" style="background-color:antiquewhite;  ">
    <!-- 顶部标题 -->
    <header class="mb-6">
      <h1 class="text-[26px] font-semibold">
        <i class="fa fa-book text-primary mr-2"></i>时光记事馆
      </h1>
      <p class="text-appleGray mt-1">记录生活，高效规划每一天</p>
    </header>

    <!-- 左右主布局 左70% 右30% -->
    <div class="flex gap-6">
      <!-- 左侧：日记区域 70% -->
      <section class="w-[70%] apple-card p-6 relative min-h-[85vh]">
        <h2 class="text-xl font-semibold mb-5 flex items-center">
          <i class="fa fa-calendar-check-o text-secondary mr-2"></i>我的日记时间轴
        </h2>

        <!-- 日记列表容器 -->
        <div id="diaryList" class="overflow-y-auto max-h-[72vh] pr-2">
          <div class="text-appleGray text-center py-20" id="emptyTip">
            <i class="fa fa-file-text-o text-4xl mb-3 block"></i>
            暂无日记，点击右下角按钮开始记录第一篇心情吧
          </div>
        </div>

        <!-- 新增日记悬浮按钮 -->
        <button id="addDiaryBtn" class="apple-btn fixed bottom-10 left-[calc(90%)] bg-primary text-white w-14 h-14 rounded-full text-xl flex items-center justify-center z-10">
          <i class="fa fa-plus"></i>
        </button>
      </section>

      <!-- 右侧：四象限时间管理 30% -->
      <section class="w-[30%] apple-card p-6">
        <h2 class="text-xl font-semibold mb-4 flex items-center">
          <i class="fa fa-pie-chart text-primary mr-2"></i>时间四象限
        </h2>
        <div class="grid grid-cols-2 gap-3 h-[78vh]">
          <!-- 象限1：重要紧急 -->
          <div class="bg-quad1 rounded-xl p-3 overflow-hidden flex flex-col">
            <h3 class="text-sm font-semibold mb-2 text-red-600">重要·紧急</h3>
            <div class="flex-1 overflow-y-auto task-container" data-type="1"></div>
            <button onclick="openAddTask(1)" class="mt-2 w-full py-1.5 bg-red-200 rounded-lg text-sm apple-btn">
              <i class="fa fa-plus"></i> 添加待办
            </button>
          </div>
          <!-- 象限2：重要不紧急 -->
          <div class="bg-quad2 rounded-xl p-3 overflow-hidden flex flex-col">
            <h3 class="text-sm font-semibold mb-2 text-blue-600">重要·不紧急</h3>
            <div class="flex-1 overflow-y-auto task-container" data-type="2"></div>
            <button onclick="openAddTask(2)" class="mt-2 w-full py-1.5 bg-blue-200 rounded-lg text-sm apple-btn">
              <i class="fa fa-plus"></i> 添加待办
            </button>
          </div>
          <!-- 象限3：紧急不重要 -->
          <div class="bg-quad3 rounded-xl p-3 overflow-hidden flex flex-col">
            <h3 class="text-sm font-semibold mb-2 text-amber-600">紧急·不重要</h3>
            <div class="flex-1 overflow-y-auto task-container" data-type="3"></div>
            <button onclick="openAddTask(3)" class="mt-2 w-full py-1.5 bg-amber-200 rounded-lg text-sm apple-btn">
              <i class="fa fa-plus"></i> 添加待办
            </button>
          </div>
          <!-- 象限4：不重要不紧急 -->
          <div class="bg-quad4 rounded-xl p-3 overflow-hidden flex flex-col">
            <h3 class="text-sm font-semibold mb-2 text-emerald-600">不重要·不紧急</h3>
            <div class="flex-1 overflow-y-auto task-container" data-type="4"></div>
            <button onclick="openAddTask(4)" class="mt-2 w-full py-1.5 bg-emerald-200 rounded-lg text-sm apple-btn">
              <i class="fa fa-plus"></i> 添加待办
            </button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- 新增日记弹窗 -->
  <div id="diaryModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="apple-card w-[550px] p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold">写下今日日记</h3>
        <button id="closeDiaryModal" class="text-appleGray hover:text-red-500 text-xl">
          <i class="fa fa-times"></i>
        </button>
      </div>
      <input type="text" id="diaryTitle" placeholder="日记标题（例如：美好的午后时光）" class="w-full border border-gray-200 rounded-xl px-4 py-3 mb-4 outline-primary/60 focus:border-primary">
      <textarea id="diaryContent" rows="8" placeholder="记录下此刻的心情、见闻、小感悟..." class="w-full border border-gray-200 rounded-xl px-4 py-3 mb-5 resize-none outline-primary/60 focus:border-primary"></textarea>
      <button id="saveDiary" class="w-full py-3 bg-primary text-white rounded-xl apple-btn font-medium">保存日记</button>
    </div>
  </div>

  <!-- 新增待办弹窗 -->
  <div id="taskModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="apple-card w-[420px] p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold">添加待办事项</h3>
        <button onclick="closeTaskModal()" class="text-appleGray hover:text-red-500 text-xl">
          <i class="fa fa-times"></i>
        </button>
      </div>
      <input type="text" id="taskInput" placeholder="输入待办内容" class="w-full border border-gray-200 rounded-xl px-4 py-3 mb-5 outline-primary/60 focus:border-primary">
      <button onclick="saveTask()" class="w-full py-3 bg-secondary text-white rounded-xl apple-btn font-medium">确认添加</button>
    </div>
  </div>

  <script>
    // 初始化本地存储
    let diaryList = JSON.parse(localStorage.getItem('diaryData')) || [];
    let taskList = JSON.parse(localStorage.getItem('taskData')) || [];
    let currentQuadType = 1;

    // 日记DOM元素
    const addDiaryBtn = document.getElementById('addDiaryBtn');
    const diaryModal = document.getElementById('diaryModal');
    const closeDiaryModal = document.getElementById('closeDiaryModal');
    const saveDiary = document.getElementById('saveDiary');
    const diaryTitle = document.getElementById('diaryTitle');
    const diaryContent = document.getElementById('diaryContent');
    const diaryWrap = document.getElementById('diaryList');
    const emptyTip = document.getElementById('emptyTip');

    // 打开新增日记弹窗
    addDiaryBtn.addEventListener('click', () => {
      diaryModal.classList.remove('hidden');
      diaryModal.classList.add('flex');
      diaryTitle.value = '';
      diaryContent.value = '';
    })

    // 关闭日记弹窗
    closeDiaryModal.addEventListener('click', () => {
      diaryModal.classList.add('hidden');
      diaryModal.classList.remove('flex');
    })

    // 保存日记
    saveDiary.addEventListener('click', () => {
      const title = diaryTitle.value.trim();
      const content = diaryContent.value.trim();
      if (!title || !content) {
        alert('请填写日记标题和内容');
        return;
      }
      const diaryItem = {
        id: Date.now(),
        title,
        content,
        createTime: new Date().toLocaleString()
      }
      diaryList.unshift(diaryItem);
      localStorage.setItem('diaryData', JSON.stringify(diaryList));
      renderDiary();
      diaryModal.classList.add('hidden');
      diaryModal.classList.remove('flex');
    })

    // 渲染日记时间轴
    function renderDiary() {
      if (diaryList.length === 0) {
        emptyTip.style.display = 'block';
        diaryWrap.innerHTML = '';
        return;
      }
      emptyTip.style.display = 'none';
      let html = '';
      diaryList.forEach(item => {
        html += `
          <div class="time-line-item">
            <span class="text-xs text-appleGray">${item.createTime}</span>
            <span class="time-line-dot"></span>
            <div class="bg-white/60 rounded-xl p-4 shadow-sm">
              <h4 class="font-semibold text-[17px]">${item.title}</h4>
              <p class="mt-2 text-sm leading-relaxed whitespace-pre-wrap">${item.content}</p>
              <button onclick="delDiary(${item.id})" class="mt-3 text-xs text-red-400 hover:text-red-600">
                <i class="fa fa-trash"></i> 删除日记
              </button>
            </div>
          </div>
        `
      })
      diaryWrap.innerHTML = html;
    }

    // 删除日记
    function delDiary(id) {
      if (!confirm('确定要删除这条日记吗？')) return;
      diaryList = diaryList.filter(item => item.id !== id);
      localStorage.setItem('diaryData', JSON.stringify(diaryList));
      renderDiary();
    }

    // 待办相关方法
    function openAddTask(type) {
      currentQuadType = type;
      document.getElementById('taskModal').classList.remove('hidden');
      document.getElementById('taskModal').classList.add('flex');
      document.getElementById('taskInput').value = '';
    }
    function closeTaskModal() {
      document.getElementById('taskModal').classList.add('hidden');
      document.getElementById('taskModal').classList.remove('flex');
    }
    function saveTask() {
      const val = document.getElementById('taskInput').value.trim();
      if (!val) {
        alert('请输入待办事项内容');
        return;
      }
      taskList.push({
        id: Date.now(),
        type: currentQuadType,
        content: val
      })
      localStorage.setItem('taskData', JSON.stringify(taskList));
      renderTask();
      closeTaskModal();
    }

    // 渲染四象限待办
    function renderTask() {
      document.querySelectorAll('.task-container').forEach(dom => dom.innerHTML = '');
      taskList.forEach(item => {
        const targetDom = document.querySelector(`.task-container[data-type="${item.type}"]`);
        targetDom.innerHTML += `
          <div class="bg-white/70 rounded-lg px-2 py-2 mb-2 text-sm flex justify-between items-center">
            <span class="truncate">${item.content}</span>
            <button onclick="delTask(${item.id})" class="text-red-400 text-xs">
              <i class="fa fa-times"></i>
            </button>
          </div>
        `
      })
    }

    // 删除待办
    function delTask(id) {
      taskList = taskList.filter(item => item.id !== id);
      localStorage.setItem('taskData', JSON.stringify(taskList));
      renderTask();
    }

    // 页面初始化渲染
    renderDiary();
    renderTask();
  </script>
</body>
</html>
