<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拾光文案馆 - AI朋友圈文案生成器</title>
    <style>
        /* ========================================
           基础重置与CSS变量
           ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 奶油清新风配色 */
            --bg: #FEFCF8;
            --bg2: #FFF9F0;
            --surface: #FFFFFF;
            --ink: #4A4A4A;
            --muted: #8C8C8C;
            --rule: #F0E6D8;
            --accent: #C4A8E0;
            --accent2: #E8D5F2;
            --accent3: #A68BC8;
            --hover: #F5F0FA;
            --shadow: rgba(196, 168, 224, 0.15);
            --shadow-lg: rgba(196, 168, 224, 0.25);
            --success: #A8D8B9;
            --warning: #F5D0A9;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ========================================
           顶部标题区
           ======================================== */
        .header {
            text-align: center;
            padding: 24px 16px 16px;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
            border-bottom: 1px solid var(--rule);
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent3);
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .header .slogan {
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 400;
        }

        /* ========================================
           主布局容器
           ======================================== */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 200px 1fr 380px;
            gap: 20px;
            min-height: calc(100vh - 120px);
        }

        /* ========================================
           左侧模板栏
           ======================================== */
        .sidebar-left {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 20px 14px;
            box-shadow: 0 4px 20px var(--shadow);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar-left h3 {
            font-size: 0.95rem;
            color: var(--accent3);
            margin-bottom: 14px;
            text-align: center;
            font-weight: 600;
        }

        .template-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .template-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border: none;
            border-radius: var(--radius-md);
            background: var(--bg2);
            color: var(--ink);
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
        }

        .template-btn:hover {
            background: var(--accent2);
            transform: translateX(4px);
            box-shadow: 0 2px 8px var(--shadow);
        }

        .template-btn.active {
            background: var(--accent);
            color: white;
        }

        .template-btn .icon {
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }

        /* ========================================
           中间表单区
           ======================================== */
        .form-section {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: 0 4px 20px var(--shadow);
            height: fit-content;
        }

        .form-section h2 {
            font-size: 1.1rem;
            color: var(--accent3);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--rule);
            border-radius: var(--radius-md);
            background: var(--bg);
            color: var(--ink);
            font-size: 0.9rem;
            transition: var(--transition);
            font-family: inherit;
        }

        .form-group input[type="text"]:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--shadow);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* 风格多选 */
        .style-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .style-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border: 1.5px solid var(--rule);
            border-radius: 20px;
            background: var(--bg);
            color: var(--muted);
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        .style-tag:hover {
            border-color: var(--accent);
            color: var(--accent3);
        }

        .style-tag.selected {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* 长度单选 */
        .length-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .length-option {
            flex: 1;
            min-width: 80px;
            padding: 10px;
            border: 1.5px solid var(--rule);
            border-radius: var(--radius-md);
            background: var(--bg);
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.85rem;
        }

        .length-option:hover {
            border-color: var(--accent);
        }

        .length-option.selected {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .length-option .length-label {
            font-weight: 600;
            display: block;
            margin-bottom: 2px;
        }

        .length-option .length-desc {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        /* 生成按钮 */
        .generate-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--shadow-lg);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .generate-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* ========================================
           右侧结果区
           ======================================== */
        .sidebar-right {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .result-section {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: 0 4px 20px var(--shadow);
            flex: 1;
        }

        .result-section h2 {
            font-size: 1.1rem;
            color: var(--accent3);
            margin-bottom: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .result-count {
            font-size: 0.75rem;
            color: var(--muted);
            font-weight: 400;
        }

        /* 文案卡片 */
        .copy-card {
            background: var(--bg);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--rule);
            transition: var(--transition);
            position: relative;
        }

        .copy-card:hover {
            box-shadow: 0 4px 12px var(--shadow);
            border-color: var(--accent2);
        }

        .copy-card .copy-text {
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--ink);
            margin-bottom: 12px;
            min-height: 40px;
        }

        .copy-card .copy-text.typing::after {
            content: '|';
            animation: blink 1s infinite;
            color: var(--accent);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .copy-card .card-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .card-btn {
            padding: 5px 10px;
            border: 1px solid var(--rule);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--muted);
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .card-btn:hover {
            background: var(--accent2);
            border-color: var(--accent);
            color: var(--accent3);
        }

        .card-btn.copied {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .card-btn.favorited {
            background: var(--warning);
            border-color: var(--warning);
            color: white;
        }

        /* 折叠面板 */
        .expand-panel {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--rule);
            display: none;
        }

        .expand-panel.open {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .expand-panel .panel-section {
            margin-bottom: 8px;
        }

        .expand-panel .panel-label {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .expand-panel .panel-content {
            font-size: 0.8rem;
            color: var(--ink);
        }

        .expand-panel .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .expand-panel .tag {
            padding: 2px 8px;
            background: var(--accent2);
            border-radius: 10px;
            font-size: 0.75rem;
            color: var(--accent3);
        }

        /* 微调菜单 */
        .tweak-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--rule);
            border-radius: var(--radius-md);
            padding: 10px;
            margin-top: 6px;
            box-shadow: 0 8px 24px var(--shadow-lg);
            z-index: 10;
            animation: slideDown 0.2s ease;
        }

        .tweak-menu.open {
            display: block;
        }

        .tweak-menu .tweak-title {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .tweak-menu .tweak-options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        /* 收藏夹 */
        .favorites-section {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: 0 4px 20px var(--shadow);
            max-height: 300px;
            overflow-y: auto;
        }

        .favorites-section h3 {
            font-size: 1rem;
            color: var(--accent3);
            margin-bottom: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .fav-count {
            font-size: 0.75rem;
            color: var(--muted);
            font-weight: 400;
        }

        .fav-item {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 10px;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: var(--ink);
            position: relative;
            border: 1px solid var(--rule);
        }

        .fav-item .fav-text {
            margin-bottom: 6px;
            line-height: 1.5;
        }

        .fav-item .fav-actions {
            display: flex;
            gap: 4px;
        }

        .fav-item .fav-btn {
            padding: 3px 8px;
            border: none;
            border-radius: 4px;
            background: var(--surface);
            color: var(--muted);
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .fav-item .fav-btn:hover {
            background: var(--accent2);
            color: var(--accent3);
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        /* ========================================
           手机端模板选择下拉
           ======================================== */
        .mobile-template-select {
            display: none;
            margin-bottom: 16px;
        }

        .mobile-template-select select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--rule);
            border-radius: var(--radius-md);
            background: var(--bg);
            color: var(--ink);
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
        }

        /* ========================================
           底部说明
           ======================================== */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 0.75rem;
            color: var(--muted);
            border-top: 1px solid var(--rule);
            margin-top: 20px;
        }

        /* ========================================
           响应式布局
           ======================================== */
        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 160px 1fr 320px;
                gap: 14px;
                padding: 14px;
            }
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
                gap: 16px;
                padding: 12px;
            }

            .sidebar-left {
                display: none;
            }

            .mobile-template-select {
                display: block;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .sidebar-right {
                order: 3;
            }

            .form-section {
                order: 1;
            }

            .result-section {
                order: 2;
            }

            .favorites-section {
                order: 4;
            }
        }

        /* ========================================
           加载动画
           ======================================== */
        .loading-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent2);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
    </style>
</head>
<body>
    <!-- 顶部标题 -->
    <header class="header">
        <h1>✨ 拾光文案馆</h1>
        <p class="slogan">输入你的日常，AI替你写好朋友圈</p>
    </header>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 左侧：场景模板栏 -->
        <aside class="sidebar-left">
            <h3>🎨 场景模板</h3>
            <div class="template-list">
                <button class="template-btn" data-scene="travel">
                    <span class="icon">✈️</span>旅行
                </button>
                <button class="template-btn" data-scene="food">
                    <span class="icon">🍰</span>美食
                </button>
                <button class="template-btn" data-scene="birthday">
                    <span class="icon">🎂</span>生日
                </button>
                <button class="template-btn" data-scene="work">
                    <span class="icon">💼</span>打工人
                </button>
                <button class="template-btn" data-scene="pet">
                    <span class="icon">🐱</span>宠物
                </button>
                <button class="template-btn" data-scene="couple">
                    <span class="icon">💕</span>情侣
                </button>
                <button class="template-btn" data-scene="exhibition">
                    <span class="icon">🎨</span>看展
                </button>
                <button class="template-btn" data-scene="festival">
                    <span class="icon">🎉</span>节日
                </button>
            </div>
        </aside>

        <!-- 中间：参数填写表单 -->
        <section class="form-section">
            <h2>📝 填写参数</h2>

            <!-- 手机端模板下拉 -->
            <div class="mobile-template-select">
                <select id="mobileTemplate">
                    <option value="">选择场景模板...</option>
                    <option value="travel">✈️ 旅行</option>
                    <option value="food">🍰 美食</option>
                    <option value="birthday">🎂 生日</option>
                    <option value="work">💼 打工人</option>
                    <option value="pet">🐱 宠物</option>
                    <option value="couple">💕 情侣</option>
                    <option value="exhibition">🎨 看展</option>
                    <option value="festival">🎉 节日</option>
                </select>
            </div>

            <div class="form-group">
                <label for="theme">① 活动主题</label>
                <input type="text" id="theme" placeholder="例如：周末海边度假">
            </div>

            <div class="form-group">
                <label for="location">② 地点</label>
                <input type="text" id="location" placeholder="例如：三亚亚龙湾">
            </div>

            <div class="form-group">
                <label for="feeling">③ 个人简短感受</label>
                <textarea id="feeling" placeholder="例如：阳光很好，心情很放松，想记录这一刻"></textarea>
            </div>

            <div class="form-group">
                <label>④ 文案风格（可多选）</label>
                <div class="style-options" id="styleOptions">
                    <span class="style-tag" data-style="healing">治愈温柔</span>
                    <span class="style-tag" data-style="funny">搞笑沙雕</span>
                    <span class="style-tag" data-style="minimal">高级极简</span>
                    <span class="style-tag" data-style="artistic">文艺氛围感</span>
                    <span class="style-tag" data-style="cute">可爱软萌</span>
                    <span class="style-tag" data-style="cool">酷拽冷淡</span>
                    <span class="style-tag" data-style="chinese">国风诗意</span>
                    <span class="style-tag" data-style="work">打工人吐槽</span>
                    <span class="style-tag" data-style="xiaohongshu">小红书爆款</span>
                </div>
            </div>

            <div class="form-group">
                <label>⑤ 文案长度</label>
                <div class="length-options" id="lengthOptions">
                    <div class="length-option" data-length="short">
                        <span class="length-label">短文案</span>
                        <span class="length-desc">1-2行</span>
                    </div>
                    <div class="length-option selected" data-length="medium">
                        <span class="length-label">中等</span>
                        <span class="length-desc">3-5行</span>
                    </div>
                    <div class="length-option" data-length="long">
                        <span class="length-label">长随笔</span>
                        <span class="length-desc">自由发挥</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="custom">⑥ 自定义需求</label>
                <textarea id="custom" placeholder="可填写：禁用词、必带关键词、情绪要求等..."></textarea>
            </div>

            <button class="generate-btn" id="generateBtn">
                ✨ 生成朋友圈文案
            </button>
        </section>

        <!-- 右侧：AI文案生成结果 -->
        <aside class="sidebar-right">
            <div class="result-section">
                <h2>
                    💫 生成结果
                    <span class="result-count" id="resultCount"></span>
                </h2>
                <div id="resultContainer">
                    <div class="empty-state">
                        填写参数后点击生成按钮<br>AI将为你创作朋友圈文案
                    </div>
                </div>
            </div>

            <div class="favorites-section">
                <h3>
                    ⭐ 我的收藏
                    <span class="fav-count" id="favCount">0</span>
                </h3>
                <div id="favoritesContainer">
                    <div class="empty-state">暂无收藏文案</div>
                </div>
            </div>
        </aside>
    </div>

    <!-- 底部 -->
    <footer class="footer">
        <p>🏆 AI创意大赛参赛作品 | 拾光文案馆 - AI朋友圈文案生成器 | 纯前端原生实现，无外部依赖</p>
        <p>本作品为演示用途，文案由前端模拟生成</p>
    </footer>

    <script>
        // ========================================
        // 数据与配置
        // ========================================

        // 场景模板数据
        const sceneTemplates = {
            travel: {
                theme: '说走就走的旅行',
                location: '大理古城',
                feeling: '风吹日晒，自由自在，想把每一帧风景都装进心里',
                styles: ['healing', 'artistic', 'minimal'],
                length: 'medium'
            },
            food: {
                theme: '探店美食打卡',
                location: '市中心网红餐厅',
                feeling: '味蕾在跳舞，幸福感爆棚，这就是生活的味道',
                styles: ['cute', 'funny', 'xiaohongshu'],
                length: 'short'
            },
            birthday: {
                theme: '生日快乐',
                location: '家里',
                feeling: '又长大一岁，感谢身边所有人的陪伴与爱',
                styles: ['healing', 'artistic', 'chinese'],
                length: 'medium'
            },
            work: {
                theme: '加班日常',

            const templates = styleTemplates[style] || styleTemplates.healing;
            const custom = customInput.value.trim();

            // 智能分析用户输入的情感倾向
            const feelingTone = analyzeFeelingTone(feeling);

            // 获取地点氛围词

            // 动态构建文案结构
            let copy = buildCopyWithUserInput(theme, location, feeling, style, templates, feelingTone, vibeWords);

            // 处理自定义需求
            if (custom) {
                copy = applyCustomRequirements(copy, custom);
            }

            // 根据长度调整
            copy = adjustLengthSmart(copy, length, style, templates);

            // 添加emoji
            copy = addEmojiSmart(copy, style, feelingTone);

            return copy;
        }

        // 分析情感倾向
        function analyzeFeelingTone(feeling) {
            if (!feeling) return 'neutral';
            const text = feeling.toLowerCase();

            for (const word of feelingKeywords.positive) {
                if (text.includes(word)) return 'positive';
            }
            for (const word of feelingKeywords.negative) {
                if (text.includes(word)) return 'negative';
            }
            for (const word of feelingKeywords.calm) {
                if (text.includes(word)) return 'calm';
            }
            for (const word of feelingKeywords.excited) {
                if (text.includes(word)) return 'excited';
            }
            return 'neutral';
        }

        // 获取地点氛围词
        function getLocationVibe(location) {
            if (!location) return [];
            const text = location.toLowerCase();

            if (text.includes('海') || text.includes('滩') || text.includes('岛') || text.includes('湾')) {
                return locationVibe.sea;
            }
            if (text.includes('山') || text.includes('林') || text.includes('峰') || text.includes('谷')) {
                return locationVibe.mountain;
            }
            if (text.includes('家') || text.includes('屋') || text.includes('室')) {
                return locationVibe.home;
            }
            if (text.includes('咖') || text.includes('馆') || text.includes('店')) {
                return locationVibe.cafe;
            }
            if (text.includes('草') || text.includes('花') || text.includes('树') || text.includes('园')) {
                return locationVibe.nature;
            }
            return locationVibe.city;
        }

        // 使用用户输入动态构建文案
        function buildCopyWithUserInput(theme, location, feeling, style, templates, feelingTone, vibeWords) {
            // 随机选择开头
            const opener = templates.openers[Math.floor(Math.random() * templates.openers.length)];

            // 处理feeling - 确保以句号或感叹号结尾
            let processedFeeling = feeling || '感觉还不错';
            if (!processedFeeling.match(/[。！？]$/)) {
                processedFeeling += '。';
            }

            // 替换基础变量
            let copy = opener
                .replace(/{theme}/g, theme)
                .replace(/{location}/g, location)
                .replace(/{feeling}/g, processedFeeling);

            // 根据情感倾向添加中间连接句
            if (Math.random() > 0.4) {
                const connector = templates.connectors[Math.floor(Math.random() * templates.connectors.length)];

                // 如果地点有氛围词，智能融入
                if (vibeWords.length > 0 && Math.random() > 0.5) {
                    const vibe = vibeWords[Math.floor(Math.random() * vibeWords.length)];
                    copy = copy.replace(/{vibe}/g, vibe);
                }

                copy += connector;
            }

            // 添加结尾
            const closer = templates.closers[Math.floor(Math.random() * templates.closers.length)];
            copy += closer;

            return copy;
        }

        // 应用自定义需求
        function applyCustomRequirements(copy, custom) {
            // 处理禁用词
            if (custom.includes('禁用') || custom.includes('不要') || custom.includes('别用')) {
                const bannedWords = extractBannedWords(custom);
                for (const word of bannedWords) {
                    copy = copy.replace(new RegExp(word, 'g'), '');
                }
            }

            // 处理必带关键词
            if (custom.includes('必带') || custom.includes('必须') || custom.includes('要加')) {
                const requiredWords = extractRequiredWords(custom);
                for (const word of requiredWords) {
                    if (!copy.includes(word)) {
                        copy = word + '。' + copy;
                    }
                }
            }

            return copy;
        }

        // 提取禁用词
        function extractBannedWords(custom) {
            const words = [];
            const patterns = [
                /禁用[：:]?(.+?)(?=，|。|；|$)/,
                /不要[用说]?(.+?)(?=，|。|；|$)/,
                /别用(.+?)(?=，|。|；|$)/
            ];
            for (const pattern of patterns) {
                const match = custom.match(pattern);
                if (match) {
                    words.push(...match[1].split(/[、,]/).map(w => w.trim()).filter(w => w));
                }
            }
            return words;
        }

        // 提取必带关键词
        function extractRequiredWords(custom) {
            const words = [];
            const patterns = [
                /必带[：:]?(.+?)(?=，|。|；|$)/,
                /必须[带加]?(.+?)(?=，|。|；|$)/,
                /要加(.+?)(?=，|。|；|$)/
            ];
            for (const pattern of patterns) {
                const match = custom.match(pattern);
                if (match) {
                    words.push(...match[1].split(/[、,]/).map(w => w.trim()).filter(w => w));
                }
            }
            return words;
        }

        // 智能调整长度
        function adjustLengthSmart(copy, length, style, templates) {
            if (length === 'short') {
                // 短文案：只保留开头+核心感受
                const sentences = copy.split(/[。！？]/).filter(s => s.trim());
                if (sentences.length >= 2) {
                    return sentences[0] + '。' + sentences[1] + '。';
                }
                return copy;
            } else if (length === 'long') {
                // 长文案：添加更多细节
                const extraDetails = [
                    '回想起这一天的点点滴滴，心里满是感慨。',
                    '这样的经历，会成为我记忆里最珍贵的一部分。',
                    '或许很多年后，我依然会记得今天的这份心情。',
                    '生活总是这样，在不经意间给我们惊喜。',
                    '想把这份感动，分享给每一个在乎的人。'
                ];
                const extra = extraDetails[Math.floor(Math.random() * extraDetails.length)];
                return copy + extra;
            }
            return copy;
        }

        // 智能添加emoji
        function addEmojiSmart(copy, style, feelingTone) {
            const emojis = styleConfig[style]?.emoji || ['✨'];
            let emoji = emojis[Math.floor(Math.random() * emojis.length)];

            // 根据情感倾向调整emoji
            if (feelingTone === 'positive' && style !== 'cool') {
                const positiveEmojis = ['😊', '🌟', '💖', '🎉', '✨'];
                emoji = positiveEmojis[Math.floor(Math.random() * positiveEmojis.length)];
            } else if (feelingTone === 'negative' && style === 'funny') {
                const funnyEmojis = ['😂', '🤣', '😅', '🙃', '😭'];
                emoji = funnyEmojis[Math.floor(Math.random() * funnyEmojis.length)];
            }

            if (emoji && Math.random() > 0.3) {
                return emoji + ' ' + copy;
            }
            return copy;
        }

        // 检测场景（保留用于标签和配图）
        function detectScene(theme, location) {
            const text = (theme + location).toLowerCase();
            if (text.includes('旅行') || text.includes('游') || text.includes('景')) return 'travel';
            if (text.includes('吃') || text.includes('食') || text.includes('餐') || text.includes('美味')) return 'food';
            if (text.includes('生日') || text.includes('寿') || text.includes('岁')) return 'birthday';
            if (text.includes('班') || text.includes('工作') || text.includes('办公')) return 'work';
            if (text.includes('猫') || text.includes('狗') || text.includes('宠') || text.includes('毛孩子')) return 'pet';
            if (text.includes('情侣') || text.includes('约会') || text.includes('爱') || text.includes('恋')) return 'couple';
            if (text.includes('展') || text.includes('馆') || text.includes('艺术')) return 'exhibition';
            if (text.includes('节') || text.includes('年') || text.includes('庆')) return 'festival';
            return 'travel';
        }

        // 获取随机话题标签
        function getRandomHashtags(theme) {
            const scene = detectScene(theme, '');
            const tags = hashtagLibrary[scene] || hashtagLibrary.travel;
            const shuffled = [...tags].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, 3);
        }

        // 获取随机配图建议
        function getRandomImages(theme) {
            const scene = detectScene(theme, '');
            const images = imageLibrary[scene] || imageLibrary.travel;
            const shuffled = [...images].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, 3);
        }

        // ========================================
        // 渲染文案卡片
        // ========================================
        function renderCopies(copies) {
            resultCount.textContent = `共 ${copies.length} 条`;

            copies.forEach((copy, index) => {
                const card = createCopyCard(copy, index);
                resultContainer.appendChild(card);

                // 打字机动画
                setTimeout(() => {
                    typeText(card.querySelector('.copy-text'), copy.text);
                }, index * 300);
            });
        }

        // 创建文案卡片
        function createCopyCard(copy, index) {
            const card = document.createElement('div');
            card.className = 'copy-card';
            card.dataset.id = copy.id;

            const styleName = styleConfig[copy.style]?.name || copy.style;

            card.innerHTML = `
                <div class="copy-text typing" data-full-text="${escapeHtml(copy.text)}"></div>
                <div class="card-actions">
                    <button class="card-btn copy-btn" onclick="copyText(${copy.id})">
                        📋 复制
                    </button>
                    <button class="card-btn tweak-btn" onclick="toggleTweak(${copy.id})">
                        ✏️ 微调
                    </button>
                    <button class="card-btn favorite-btn" onclick="toggleFavorite(${copy.id})">
                        ⭐ 收藏
                    </button>
                    <button class="card-btn expand-btn" onclick="toggleExpand(${copy.id})">
                        📎 展开
                    </button>
                </div>
                <div class="tweak-menu" id="tweak-${copy.id}">
                    <div class="tweak-title">微调选项</div>
                    <div class="tweak-options">
                        <button class="card-btn" onclick="tweakCopy(${copy.id}, 'shorter')">缩短</button>
                        <button class="card-btn" onclick="tweakCopy(${copy.id}, 'longer')">加长</button>
                        <button class="card-btn" onclick="tweakCopy(${copy.id}, 'changeStyle')">换风格</button>
                        <button class="card-btn" onclick="tweakCopy(${copy.id}, 'addEmoji')">+emoji</button>
                        <button class="card-btn" onclick="tweakCopy(${copy.id}, 'removeEmoji')">-emoji</button>
                    </div>
                </div>
                <div class="expand-panel" id="expand-${copy.id}">
                    <div class="panel-section">
                        <div class="panel-label">🏷️ 推荐话题标签</div>
                        <div class="panel-content tag-list">
                            ${copy.hashtags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                    <div class="panel-section">
                        <div class="panel-label">📸 配图建议</div>
                        <div class="panel-content">${copy.images.join('、')}</div>
                    </div>
                    <div class="panel-section">
                        <div class="panel-label">🎨 当前风格</div>
                        <div class="panel-content">${styleName}</div>
                    </div>
                </div>
            `;

            return card;
        }

        // 打字机动画
        function typeText(element, text) {
            let index = 0;
            element.textContent = '';
            element.classList.add('typing');

            const timer = setInterval(() => {
                if (index < text.length) {
                    element.textContent += text.charAt(index);
                    index++;
                } else {
                    clearInterval(timer);
                    element.classList.remove('typing');
                }
            }, 30);
        }

        // ========================================
        // 交互功能
        // ========================================

        // 复制文案
        window.copyText = function(id) {
            const copy = generatedCopies.find(c => c.id === id);
            if (!copy) return;

            navigator.clipboard.writeText(copy.text).then(() => {
                const btn = document.querySelector(`.copy-card[data-id="${id}"] .copy-btn`);
                btn.classList.add('copied');
                btn.textContent = '✅ 已复制';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.textContent = '📋 复制';
                }, 2000);
            });
        };

        // 切换微调菜单
        window.toggleTweak = function(id) {
            const menu = document.getElementById(`tweak-${id}`);
            menu.classList.toggle('open');
        };

        // 切换展开面板
        window.toggleExpand = function(id) {
            const panel = document.getElementById(`expand-${id}`);
            panel.classList.toggle('open');
        };

        // 微调文案
        window.tweakCopy = function(id, action) {
            const copy = generatedCopies.find(c => c.id === id);
            if (!copy) return;

            let newText = copy.text;

            switch (action) {
                case 'shorter':
                    const sentences = newText.split(/[。！？]/);
                    newText = sentences.slice(0, 1).join('。') + '。';
                    break;
                case 'longer':
                    const endings = [
                        '这就是生活，简单却美好。',
                        '愿每一天都如此刻般温柔。',
                        '时光会走远，但记忆永存。'
                    ];
                    newText += endings[Math.floor(Math.random() * endings.length)];
                    break;
                case 'changeStyle':
                    const styles = Object.keys(styleConfig);
                    const newStyle = styles[Math.floor(Math.random() * styles.length)];
                    copy.style = newStyle;
                    newText = generateSingleCopy(copy.theme, copy.location, '', newStyle, selectedLength);
                    break;
                case 'addEmoji':
                    const emojis = styleConfig[copy.style]?.emoji || ['✨'];
                    const emoji = emojis[Math.floor(Math.random() * emojis.length)];
                    newText = emoji + ' ' + newText;
                    break;
                case 'removeEmoji':
                    newText = newText.replace(/[\u{1F300}-\u{1F9FF}]/gu, '').trim();
                    break;
            }

            copy.text = newText;
            const textElement = document.querySelector(`.copy-card[data-id="${id}"] .copy-text`);
            textElement.textContent = newText;

            // 关闭微调菜单
            document.getElementById(`tweak-${id}`).classList.remove('open');
        };

        // 收藏/取消收藏
        window.toggleFavorite = function(id) {
            const copy = generatedCopies.find(c => c.id === id);
            if (!copy) return;

            const index = favorites.findIndex(f => f.id === id);
            const btn = document.querySelector(`.copy-card[data-id="${id}"] .favorite-btn`);

            if (index === -1) {
                favorites.push({ ...copy });
                btn.classList.add('favorited');
                btn.textContent = '❤️ 已收藏';
            } else {
                favorites.splice(index, 1);
                btn.classList.remove('favorited');
                btn.textContent = '⭐ 收藏';
            }

            saveFavorites();
            renderFavorites();
        };

        // 保存收藏到localStorage
        function saveFavorites() {
            localStorage.setItem('shiguang_favorites', JSON.stringify(favorites));
        }

        // 渲染收藏列表
        function renderFavorites() {
            favCount.textContent = favorites.length;

            if (favorites.length === 0) {
                favoritesContainer.innerHTML = '<div class="empty-state">暂无收藏文案</div>';
                return;
            }

            favoritesContainer.innerHTML = favorites.map(fav => `
                <div class="fav-item">
                    <div class="fav-text">${escapeHtml(fav.text)}</div>
                    <div class="fav-actions">
                        <button class="fav-btn" onclick="copyFavorite(${fav.id})">复制</button>
                        <button class="fav-btn" onclick="removeFavorite(${fav.id})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // 复制收藏
        window.copyFavorite = function(id) {
            const fav = favorites.find(f => f.id === id);
            if (!fav) return;

            navigator.clipboard.writeText(fav.text).then(() => {
                alert('已复制到剪贴板');
            });
        };

        // 删除收藏
        window.removeFavorite = function(id) {
            const index = favorites.findIndex(f => f.id === id);
            if (index > -1) {
                favorites.splice(index, 1);
                saveFavorites();
                renderFavorites();
            }
        };

        // ========================================
        // 工具函数
        // ========================================
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========================================
        // 启动
        // ========================================
        init();
    </script>
</body>
</html>
