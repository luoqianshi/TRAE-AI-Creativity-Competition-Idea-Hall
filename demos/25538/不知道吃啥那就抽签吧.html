.stick{

}
.stick::after{
  content:'';position:absolute;top:4px;left:0;right:0;height:2px;

}
.stick.result-stick{

.stick.breakfast{background:linear-gradient(180deg,#FFF3CD,#FFE082);border-color:#D4A017}

<script>
// ═══════════ Data Layer ═══════════
const STORAGE_KEY_RECIPES = 'diet_recipes';
const STORAGE_KEY_HISTORY = 'diet_history';
const STORAGE_KEY_INIT = 'diet_initialized';
const MEAL_LABELS = ['早餐','午餐','晚餐','加餐'];
const CARD_IDS = ['card-breakfast','card-lunch','card-dinner','card-snack'];

let recipes = [];
let history = [];
let currentFilter = -1;
let editingId = null;
let currentDraw = null;
let drawAnimating = false;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8) }

function loadData(){
  recipes = JSON.parse(localStorage.getItem(STORAGE_KEY_RECIPES)||'[]');
  history = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY)||'[]');
  if(!localStorage.getItem(STORAGE_KEY_INIT)){
    initPresets();
    localStorage.setItem(STORAGE_KEY_INIT,'1');
  }
}

function saveRecipes(){ localStorage.setItem(STORAGE_KEY_RECIPES,JSON.stringify(recipes)) }
function saveHistory(){ localStorage.setItem(STORAGE_KEY_HISTORY,JSON.stringify(history)) }

function initPresets(){
  recipes = [
    {id:uid(),name:'燕麦粥',calories:120,mealTypes:[0]},
    {id:uid(),name:'全麦面包+鸡蛋',calories:250,mealTypes:[0]},
    {id:uid(),name:'无糖豆浆',calories:80,mealTypes:[0]},
    {id:uid(),name:'鸡胸肉沙拉',calories:280,mealTypes:[1,2]},
    {id:uid(),name:'西兰花炒虾仁',calories:220,mealTypes:[1,2]},
    {id:uid(),name:'番茄牛肉汤',calories:300,mealTypes:[1,2]},
    {id:uid(),name:'清蒸鱼',calories:200,mealTypes:[1,2]},
    {id:uid(),name:'杂粮饭',calories:180,mealTypes:[1,2]},
    {id:uid(),name:'凉拌黄瓜',calories:50,mealTypes:[1,2,3]},
    {id:uid(),name:'希腊酸奶',calories:80,mealTypes:[0,3]},
    {id:uid(),name:'苹果',calories:90,mealTypes:[3]},
    {id:uid(),name:'水煮蛋',calories:70,mealTypes:[0,3]},
  ];
  saveRecipes();
}

// ═══════════ Navigation ═══════════
function switchTab(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
  var titles={lottery:'减脂抽签',recipes:'签筒',history:'抽签历史'};
  document.getElementById('pageTitle').textContent=titles[tab];
  if(tab==='recipes') renderRecipes();
  if(tab==='history') renderHistory();
  if(tab==='lottery') refreshLottery();
  updateRecipeCount();
}

function updateRecipeCount(){
  document.getElementById('recipeCount').textContent=recipes.length+' 道食谱';
}

// ═══════════ Toast ═══════════
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},1800);
}

// ═══════════ Lottery ═══════════
function initSticks(){
  var container=document.getElementById('sticksContainer');
  var html='';
  for(var i=0;i<40;i++){
    var h=55+Math.floor(Math.random()*50);
    html+='<div class="stick" style="height:'+h+'px;animation-delay:'+(Math.random()*0.3).toFixed(2)+'s"></div>';
  }
  container.innerHTML=html;
}

function refreshLottery(){
  var now=new Date();
  var week=['日','一','二','三','四','五','六'];
  document.getElementById('todayDate').textContent=
    (now.getMonth()+1)+'月'+now.getDate()+'日 周'+week[now.getDay()];
  var today=now.toISOString().slice(0,10);
  var todayRecord=history.find(function(h){return h.date===today});
  if(todayRecord){
    currentDraw=todayRecord;
    document.getElementById('lotteryStatus').textContent='今日已抽签';
    showDrawResult(todayRecord);
    document.getElementById('btnDraw').textContent='🎋 全部重抽';
  }else{
    currentDraw=null;
    document.getElementById('lotteryStatus').textContent='今日尚未抽签';
    resetCards();
    document.getElementById('btnDraw').textContent='🎋 开始抽签';
    document.getElementById('totalCal').innerHTML='全天合计: <strong>0</strong> kcal';
  }
}

function resetCards(){
  CARD_IDS.forEach(function(id){
    var card=document.getElementById(id);
    card.classList.remove('drawn');
    card.querySelector('.result-stick-visual').classList.remove('pop');
    card.querySelector('.result-stick-name').textContent='???';
    card.querySelector('.result-stick-cal').textContent='-- kcal';
  });
}

function showDrawResult(record){
  var meals=[record.breakfast,record.lunch,record.dinner,record.snack];
  CARD_IDS.forEach(function(id,i){
    var card=document.getElementById(id);
    card.classList.add('drawn');
    var vis=card.querySelector('.result-stick-visual');
    vis.classList.remove('pop');
    void vis.offsetWidth;
    vis.classList.add('pop');
    card.querySelector('.result-stick-name').textContent=meals[i].name;
    card.querySelector('.result-stick-cal').textContent=meals[i].calories+' kcal';
  });
  document.getElementById('totalCal').innerHTML='全天合计: <strong>'+record.totalCalories+'</strong> kcal';
  document.getElementById('btnDraw').textContent='🎋 全部重抽';
}

function getCandidates(mealType){
  return recipes.filter(function(r){return r.mealTypes.indexOf(mealType)!==-1});
}

function randomPick(arr){
  if(arr.length===0) return null;
  return arr[Math.floor(Math.random()*arr.length)];
}

function startDraw(){
  if(drawAnimating) return;
  for(var i=0;i<4;i++){
    var cand=getCandidates(i);
    if(cand.length===0){
      showToast('「'+MEAL_LABELS[i]+'」没有可用食谱，请先去签筒添加');
      return;
    }
  }
  drawAnimating=true;
  document.getElementById('btnDraw').disabled=true;
  resetCards();
  document.getElementById('lotteryStatus').textContent='摇签中...';

  // Pick final results
  var results=[];
  for(var i=0;i<4;i++){
    results.push(randomPick(getCandidates(i)));
  }

  // Shake the tube!
  var scene=document.getElementById('tubeScene');
  scene.classList.add('shaking');

  // Stop shaking after 1.5s
  setTimeout(function(){
    scene.classList.remove('shaking');
    // Pop results
    showDrawResult({
      breakfast:{recipeId:results[0].id,name:results[0].name,calories:results[0].calories},
      lunch:{recipeId:results[1].id,name:results[1].name,calories:results[1].calories},
      dinner:{recipeId:results[2].id,name:results[2].name,calories:results[2].calories},
      snack:{recipeId:results[3].id,name:results[3].name,calories:results[3].calories},
      totalCalories:results.reduce(function(s,r){return s+r.calories},0)
    });
    finishDraw(results);
  },1500);
}

function finishDraw(results){
  drawAnimating=false;
  document.getElementById('btnDraw').disabled=false;
  document.getElementById('btnDraw').textContent='🎋 全部重抽';
  document.getElementById('lotteryStatus').textContent='今日已抽签';
  var totalCal=results.reduce(function(s,r){return s+r.calories},0);
  document.getElementById('totalCal').innerHTML='全天合计: <strong>'+totalCal+'</strong> kcal';

  var now=new Date();
  var today=now.toISOString().slice(0,10);
  var record={
    id:uid(),
    date:today,
    breakfast:{recipeId:results[0].id,name:results[0].name,calories:results[0].calories},
    lunch:{recipeId:results[1].id,name:results[1].name,calories:results[1].calories},
    dinner:{recipeId:results[2].id,name:results[2].name,calories:results[2].calories},
    snack:{recipeId:results[3].id,name:results[3].name,calories:results[3].calories},
    totalCalories:totalCal
  };
  history=history.filter(function(h){return h.date!==today});
  history.unshift(record);
  var cutoff=new Date();cutoff.setDate(cutoff.getDate()-90);
  var cutoffStr=cutoff.toISOString().slice(0,10);
  history=history.filter(function(h){return h.date>=cutoffStr});
  saveHistory();
  currentDraw=record;
}

function retryMeal(mealType){
  if(drawAnimating) return;
  if(!currentDraw) return;
  var cands=getCandidates(mealType);
  if(cands.length===0){showToast('该餐次无可用食谱');return}
  var pick=randomPick(cands);

  var card=document.getElementById(CARD_IDS[mealType]);
  var vis=card.querySelector('.result-stick-visual');
  vis.classList.remove('pop');
  void vis.offsetWidth;
  vis.classList.add('pop');

  // Quick mini shake
  var scene=document.getElementById('tubeScene');
  scene.classList.add('shaking');
  setTimeout(function(){
    scene.classList.remove('shaking');
    card.querySelector('.result-stick-name').textContent=pick.name;
    card.querySelector('.result-stick-cal').textContent=pick.calories+' kcal';
    var mealKeys=['breakfast','lunch','dinner','snack'];
    currentDraw[mealKeys[mealType]]={recipeId:pick.id,name:pick.name,calories:pick.calories};
    var totalCal=0;
    mealKeys.forEach(function(k){totalCal+=currentDraw[k].calories});
    currentDraw.totalCalories=totalCal;
    document.getElementById('totalCal').innerHTML='全天合计: <strong>'+totalCal+'</strong> kcal';
    var today=new Date().toISOString().slice(0,10);
    var idx=history.findIndex(function(h){return h.date===today});
    if(idx!==-1) history[idx]=currentDraw;
    saveHistory();
  },400);
}

// ═══════════ Recipes ═══════════
function filterRecipes(type){
  currentFilter=type;
  var btns=document.querySelectorAll('#tabBar button');
  btns.forEach(function(b){b.classList.remove('active')});
  btns[type===-1?0:type+1].classList.add('active');
  renderRecipes();
}

function renderRecipes(){
  var filtered=recipes;
  if(currentFilter!==-1){
    filtered=recipes.filter(function(r){return r.mealTypes.indexOf(currentFilter)!==-1});
  }
  var list=document.getElementById('recipeList');
  var empty=document.getElementById('recipeEmpty');
  if(filtered.length===0){
    list.innerHTML='';empty.style.display='block';
  }else{
    empty.style.display='none';
    list.innerHTML=filtered.map(function(r){
      var tags=r.mealTypes.map(function(t){return '<span class="tag">'+MEAL_LABELS[t]+'</span>'}).join('');
      return '<div class="recipe-item">'+
        '<div class="recipe-info">'+
          '<div class="name">'+escHtml(r.name)+'</div>'+
          '<div class="tags">'+tags+'</div>'+
        '</div>'+
        '<div class="recipe-cal">'+r.calories+' kcal</div>'+
        '<div class="recipe-actions">'+
          '<button onclick="openEditPage(\''+r.id+'\')" title="编辑">✎</button>'+
          '<button onclick="deleteRecipe(\''+r.id+'\')" title="删除">✕</button>'+
        '</div>'+
      '</div>';
    }).join('');
  }
  updateRecipeCount();
}

function openEditPage(id){
  editingId=id||null;
  document.getElementById('editPage').classList.add('show');
  document.getElementById('formError').style.display='none';
  if(id){
    document.getElementById('editTitle').textContent='编辑食谱';
    var r=recipes.find(function(r){return r.id===id});
    if(r){
      document.getElementById('inputName').value=r.name;
      document.getElementById('inputCal').value=r.calories;
      var checks=document.querySelectorAll('#mealChecks input');
      checks.forEach(function(cb){cb.checked=r.mealTypes.indexOf(parseInt(cb.value))!==-1});
    }
  }else{
    document.getElementById('editTitle').textContent='添加食谱';
    document.getElementById('inputName').value='';
    document.getElementById('inputCal').value='';
    var checks=document.querySelectorAll('#mealChecks input');
    checks.forEach(function(cb){cb.checked=false});
  }
}

function closeEditPage(){
  document.getElementById('editPage').classList.remove('show');
  editingId=null;
}

function saveRecipe(){
  var name=document.getElementById('inputName').value.trim();
  var cal=parseInt(document.getElementById('inputCal').value);
  var mealTypes=[];
  document.querySelectorAll('#mealChecks input:checked').forEach(function(cb){
    mealTypes.push(parseInt(cb.value));
  });
  // Validate
  if(!name){showToast('请输入菜名');return}
  if(!cal||cal<1){showToast('请输入有效热量');return}
  if(mealTypes.length===0){
    document.getElementById('formError').style.display='block';return;
  }
  document.getElementById('formError').style.display='none';

  if(editingId){
    var idx=recipes.findIndex(function(r){return r.id===editingId});
    if(idx!==-1){
      recipes[idx].name=name;
      recipes[idx].calories=cal;
      recipes[idx].mealTypes=mealTypes;
    }
  }else{
    recipes.unshift({id:uid(),name:name,calories:cal,mealTypes:mealTypes});
  }
  saveRecipes();
  closeEditPage();
  renderRecipes();
  showToast(editingId?'已更新':'已添加');
  updateRecipeCount();
}

function deleteRecipe(id){
  if(!confirm('确定删除这道食谱吗？')) return;
  recipes=recipes.filter(function(r){return r.id!==id});
  saveRecipes();
  renderRecipes();
  showToast('已删除');
}

// ═══════════ History ═══════════
function renderHistory(){
  var list=document.getElementById('historyList');
  var empty=document.getElementById('historyEmpty');
  if(history.length===0){
    list.innerHTML='';empty.style.display='block';
  }else{
    empty.style.display='none';
    list.innerHTML=history.map(function(h){
      var d=new Date(h.date+'T00:00:00');
      var week=['日','一','二','三','四','五','六'];
      var dateStr=(d.getMonth()+1)+'月'+d.getDate()+'日 周'+week[d.getDay()];
      return '<div class="history-card">'+
        '<div class="history-date"><span>'+dateStr+'</span></div>'+
        '<div class="history-meals">'+
          '<span>早:</span>'+escHtml(h.breakfast.name)+' '+h.breakfast.calories+' kcal<br>'+
          '<span>午:</span>'+escHtml(h.lunch.name)+' '+h.lunch.calories+' kcal<br>'+
          '<span>晚:</span>'+escHtml(h.dinner.name)+' '+h.dinner.calories+' kcal<br>'+
          '<span>加:</span>'+escHtml(h.snack.name)+' '+h.snack.calories+' kcal'+
        '</div>'+
        '<div class="history-total">合计: '+h.totalCalories+' kcal</div>'+
        '<div class="history-actions">'+
          '<button onclick="shareRecord(\''+h.id+'\')">分享</button>'+
          '<button onclick="deleteRecord(\''+h.id+'\')">删除</button>'+
        '</div>'+
      '</div>';
    }).join('');
  }
}

function deleteRecord(id){
  if(!confirm('确定删除这条记录吗？')) return;
  history=history.filter(function(h){return h.id!==id});
  saveHistory();
  renderHistory();
  showToast('已删除');
}

// ═══════════ Share ═══════════
function shareRecord(id){
  var record=history.find(function(h){return h.id===id});
  if(!record) return;
  var text='【减脂菜单抽签】\n'+
    '日期: '+record.date+'\n'+
    '━━━━━━━━━━\n'+
    '早餐: '+record.breakfast.name+' ('+record.breakfast.calories+' kcal)\n'+
    '午餐: '+record.lunch.name+' ('+record.lunch.calories+' kcal)\n'+
    '晚餐: '+record.dinner.name+' ('+record.dinner.calories+' kcal)\n'+
    '加餐: '+record.snack.name+' ('+record.snack.calories+' kcal)\n'+
    '━━━━━━━━━━\n'+
    '全天合计: '+record.totalCalories+' kcal\n'+
    '—— 来自「减脂菜单抽签」';
  document.getElementById('shareText').textContent=text;
  document.getElementById('shareModal').classList.add('show');
}

function closeShare(){ document.getElementById('shareModal').classList.remove('show') }

function copyShare(){
  var text=document.getElementById('shareText').textContent;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){
      showToast('已复制到剪贴板');closeShare();
    });
  }else{
    var ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';
    document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    showToast('已复制到剪贴板');closeShare();
  }
}

// ═══════════ Utils ═══════════
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

// ═══════════ Init ═══════════
loadData();
initSticks();
refreshLottery();
updateRecipeCount();
</script>
