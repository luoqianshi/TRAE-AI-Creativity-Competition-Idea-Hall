<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 换发型 & 虚拟试衣 - 创意大赛</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-pulse-custom { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .animate-spin-custom { animation: spin 1s linear infinite; }
    .animate-slide-up { animation: slideUp 0.3s ease-out; }
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
  <div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-xl relative overflow-hidden">
    <div id="page-container" class="min-h-screen"></div>
  </div>

  <script>
    const routes = {
      home: { path: '/', title: '首页' },
      hairUpload: { path: '/hair', title: '换发型' },
      hairSelect: { path: '/hair/select', title: '选择发型' },
      hairGenerating: { path: '/hair/generating', title: '生成中' },
      hairResult: { path: '/hair/result', title: '生成结果' },
      clothingUpload: { path: '/clothing', title: '虚拟试衣' },
      clothingSize: { path: '/clothing/size', title: '输入尺码' },
      clothingSelect: { path: '/clothing/select', title: '选择衣服' },
      clothingGenerating: { path: '/clothing/generating', title: '生成中' },
      clothingResult: { path: '/clothing/result', title: '试衣结果' },
      profile: { path: '/profile', title: '个人中心' },
      history: { path: '/history', title: '我的作品' },
      vip: { path: '/vip', title: '开通会员' },
    };

    const hairTemplates = [
      { id: 1, name: '时尚短发', category: '短发', image: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=modern%20short%20hairstyle%20for%20women%20professional%20salon%20style&image_size=square' },
      { id: 2, name: '长卷发', category: '长发', image: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=beautiful%20long%20curly%20hairstyle%20elegant%20woman&image_size=square' },
      { id: 3, name: '波波头', category: '短发', image: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=bob%20hairstyle%20modern%20fashion%20woman&image_size=square' },
      { id: 4, name: '丸子头', category: '盘发', image: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=cute%20bun%20hairstyle%20asian%20woman&image_size=square' },
      { id: 5, name: '渐变染发', category: '染发', image: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=gradient%20dyed%20hair%20colorful%20fashion%20hairstyle&image_size=square' },
      { id: 6, name: '帅气寸头', category: '短发', image: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=handsome%20buzzcut%20hairstyle%20modern%20man&image_size=square' },
    ];

    const clothingTemplates = [
      { id: 1, name: '休闲T恤', category: '上衣', image: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=casual%20white%20t-shirt%20fashion%20clothing%20product&image_size=square' },
      { id: 2, name: '优雅连衣裙', category: '裙装', image: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=elegant%20summer%20dress%20fashion%20women%20clothing&image_size=square' },
      { id: 3, name: '商务西装', category: '套装', image: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=business%20suit%20professional%20men%20fashion&image_size=square' },
      { id: 4, name: '潮流卫衣', category: '上衣', image: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=trendy%20hoodie%20streetwear%20fashion&image_size=square' },
      { id: 5, name: '牛仔裤', category: '下装', image: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=blue%20jeans%20fashion%20casual%20pants&image_size=square' },
      { id: 6, name: '风衣外套', category: '外套', image: 'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=trench%20coat%20fashion%20outerwear%20elegant&image_size=square' },
    ];

    const mockResults = {
      hair: [
        'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=beautiful%20woman%20with%20modern%20hairstyle%20professional%20portrait&image_size=portrait_4_3',
        'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=fashion%20woman%20with%20stylish%20haircut%20studio%20photography&image_size=portrait_4_3',
        'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=elegant%20woman%20with%20curly%20hair%20beauty%20portrait&image_size=portrait_4_3',
      ],
      clothing: [
        'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=fashion%20model%20wearing%20stylish%20clothes%20full%20body%20shot&image_size=portrait_4_3',
        'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=elegant%20woman%20in%20fashionable%20dress%20full%20body%20portrait&image_size=portrait_4_3',
        'https://neeko-copilot.bytedance.net/api/text_to_image?prompt=stylish%20man%20in%20business%20attire%20full%20body%20photography&image_size=portrait_4_3',
      ],
    };

    let state = {
      user: JSON.parse(localStorage.getItem('user') || 'null') || {
        id: 'guest',
        nickname: '用户',
        isVip: false,
        vipExpireAt: null,
      },
      history: JSON.parse(localStorage.getItem('history') || '[]'),
      dailyCount: parseInt(localStorage.getItem('dailyCount') || '0'),
      dailyDate: localStorage.getItem('dailyDate') || new Date().toDateString(),
      temp: {},
    };

    function saveState() {
      localStorage.setItem('user', JSON.stringify(state.user));
      localStorage.setItem('history', JSON.stringify(state.history));
      localStorage.setItem('dailyCount', state.dailyCount.toString());
      localStorage.setItem('dailyDate', state.dailyDate);
    }

    function checkDailyLimit() {
      const today = new Date().toDateString();
      if (state.dailyDate !== today) {
        state.dailyDate = today;
        state.dailyCount = 0;
        saveState();
      }
      return state.user.isVip || state.dailyCount < 3;
    }

    function consumeDailyLimit() {
      if (!state.user.isVip) {
        state.dailyCount++;
        saveState();
      }
    }

    function getRemainingCount() {
      if (state.user.isVip) return -1;
      return Math.max(0, 3 - state.dailyCount);
    }

    function navigate(path, params = {}) {
      state.temp[path] = params;
      window.history.pushState({}, '', path);
      render();
    }

    function goBack() {
      window.history.back();
    }

    function Header({ title, showBack = true, rightAction }) {
      return `
        <div class="sticky top-0 bg-white border-b border-gray-100 px-4 py-3 flex items-center gap-4 z-50">
          ${showBack ? `
            <button onclick="goBack()" class="p-1 -ml-1">
              <span class="material-icons text-gray-700">arrow_back</span>
            </button>
          ` : ''}
          <h1 class="text-lg font-semibold text-gray-900 flex-1">${title}</h1>
          ${rightAction || ''}
        </div>
      `;
    }

    function Uploader({ onUpload, label = '点击上传照片', preview }) {
      return `
        <div onclick="document.getElementById('upload-input').click()" 
             class="relative border-2 border-dashed rounded-xl p-8 text-center cursor-pointer transition-all ${preview ? 'border-blue-500 bg-blue-50' : 'border-gray-300 hover:border-blue-400 hover:bg-gray-50'}">
          <input id="upload-input" type="file" accept="image/*" class="hidden" 
                 onchange="handleFileUpload(event, this)">
          ${preview ? `
            <div class="relative">
              <img src="${preview}" alt="预览" class="max-h-48 mx-auto rounded-lg object-contain">
              <div class="absolute inset-0 flex items-center justify-center bg-black/30 rounded-lg">
                <span class="material-icons text-white">refresh</span>
              </div>
            </div>
          ` : `
            <div class="flex flex-col items-center gap-3">
              <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center">
                <span class="material-icons text-gray-400 text-3xl">add_a_photo</span>
              </div>
              <p class="text-gray-600 font-medium">${label}</p>
              <p class="text-sm text-gray-400">支持 JPG、PNG 格式，最大 5MB</p>
            </div>
          `}
        </div>
      `;
    }

    function TemplateCard({ item, type, isSelected, onClick }) {
      return `
        <div onclick="${onClick}" 
             class="relative rounded-xl overflow-hidden cursor-pointer transition-all ${isSelected ? 'ring-2 ring-blue-500 ring-offset-2' : 'hover:ring-2 hover:ring-gray-300'}">
          <img src="${item.image}" alt="${item.name}" class="w-full aspect-square object-cover">
          <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-3">
            <p class="text-white text-sm font-medium">${item.name}</p>
          </div>
          ${isSelected ? `
            <div class="absolute top-2 right-2 w-6 h-6 bg-blue-500 rounded-full flex items-center justify-center">
              <span class="material-icons text-white text-xs">check</span>
            </div>
          ` : ''}
        </div>
      `;
    }

    function Toast({ message, type = 'info' }) {
      const colors = {
        info: 'bg-gray-800',
        success: 'bg-green-600',
        error: 'bg-red-600',
      };
      return `
        <div class="fixed bottom-8 left-1/2 -translate-x-1/2 ${colors[type]} text-white px-6 py-3 rounded-full shadow-lg animate-fade-in z-50">
          ${message}
        </div>
      `;
    }

    function HomePage() {
      return `
        <div class="min-h-screen bg-gradient-to-br from-purple-500 via-pink-500 to-orange-400 flex flex-col items-center justify-center p-6">
          <div class="text-center mb-12">
            <div class="w-24 h-24 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center mx-auto mb-6">
              <span class="material-icons text-white text-5xl">sparkles</span>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">AI 换发型 & 虚拟试衣</h1>
            <p class="text-white/80">让美丽触手可及</p>
          </div>

          <div class="w-full max-w-sm space-y-4">
            <button onclick="navigate('/hair')" 
                    class="w-full bg-white rounded-2xl p-6 flex items-center gap-4 shadow-xl hover:shadow-2xl transition-shadow">
              <div class="w-14 h-14 bg-purple-100 rounded-xl flex items-center justify-center">
                <span class="material-icons text-purple-600 text-3xl">content_cut</span>
              </div>
              <div class="text-left">
                <h3 class="text-lg font-semibold text-gray-900">AI 换发型</h3>
                <p class="text-sm text-gray-500">上传照片，一键换发型</p>
              </div>
            </button>

            <button onclick="navigate('/clothing')" 
                    class="w-full bg-white rounded-2xl p-6 flex items-center gap-4 shadow-xl hover:shadow-2xl transition-shadow">
              <div class="w-14 h-14 bg-pink-100 rounded-xl flex items-center justify-center">
                <span class="material-icons text-pink-600 text-3xl">shirt</span>
              </div>
              <div class="text-left">
                <h3 class="text-lg font-semibold text-gray-900">虚拟试衣</h3>
                <p class="text-sm text-gray-500">输入尺码，预览穿衣效果</p>
              </div>
            </button>
          </div>

          <div class="mt-8 flex items-center gap-4 text-white/80">
            <button onclick="navigate('/profile')" class="text-sm hover:text-white transition-colors">
              <span class="material-icons text-lg mr-1">person</span>个人中心
            </button>
            <span class="text-xs">|</span>
            <span class="text-sm">今日剩余 ${getRemainingCount() === -1 ? '无限' : getRemainingCount()} 次</span>
          </div>
        </div>
      `;
    }

    function HairUploadPage() {
      return `
        <div class="min-h-screen bg-white">
          ${Header({ title: '换发型' })}
          <div class="p-4">
            <div class="bg-blue-50 rounded-xl p-4 mb-4">
              <div class="flex items-start gap-3">
                <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0">
                  <span class="material-icons text-blue-600 text-sm">camera_alt</span>
                </div>
                <div>
                  <h3 class="text-blue-800 font-semibold">拍摄建议</h3>
                  <ul class="text-blue-600 text-sm mt-1 space-y-1">
                    <li>• 请上传正面清晰照片</li>
                    <li>• 光线充足，避免逆光</li>
                    <li>• 头发不要遮挡脸部</li>
                  </ul>
                </div>
              </div>
            </div>

            ${Uploader({ 
              onUpload: 'handleHairImageUpload', 
              preview: state.temp.hairImage 
            })}

            <button onclick="handleHairUploadNext()" 
                    disabled="${!state.temp.hairImage}"
                    class="w-full mt-6 py-3 rounded-xl font-semibold transition-all ${state.temp.hairImage ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg hover:shadow-xl' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}">
              下一步
            </button>
          </div>
        </div>
      `;
    }

    function HairSelectPage() {
      const selectedId = state.temp.selectedHairTemplate;
      return `
        <div class="min-h-screen bg-gray-50">
          ${Header({ title: '选择发型' })}
          <div class="p-4">
            <div class="mb-6">
              <h3 class="text-gray-700 font-semibold mb-3">推荐发型</h3>
              <div class="grid grid-cols-3 gap-3">
                ${hairTemplates.map(t => TemplateCard({
                  item: t,
                  isSelected: selectedId === t.id,
                  onClick: `selectHairTemplate(${t.id})`
                })).join('')}
              </div>
            </div>

            <div class="mb-6">
              <div class="flex items-center gap-2 mb-3">
                <span class="material-icons text-gray-500 text-sm">add</span>
                <h3 class="text-gray-700 font-semibold">自定义发型</h3>
              </div>
              ${Uploader({ 
                onUpload: 'handleCustomHairUpload', 
                label: '上传喜欢的发型图片',
                preview: state.temp.customHairImage 
              })}
            </div>

            <button onclick="handleHairGenerate()" 
                    disabled="${!selectedId && !state.temp.customHairImage}"
                    class="w-full py-3 rounded-xl font-semibold flex items-center justify-center gap-2 transition-all ${selectedId || state.temp.customHairImage ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg hover:shadow-xl' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}">
              <span class="material-icons">sparkles</span>
              开始生成
            </button>
          </div>
        </div>
      `;
    }

    function HairGeneratingPage() {
      return `
        <div class="min-h-screen bg-gradient-to-br from-purple-500 to-pink-500 flex flex-col items-center justify-center p-4">
          <div class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mb-6 animate-pulse-custom">
            <span class="material-icons text-white text-5xl">sparkles</span>
          </div>
          <h2 class="text-white text-xl font-semibold mb-2">AI 正在为您生成</h2>
          <p class="text-white/70 text-sm">预计需要 10-30 秒</p>
          <div class="mt-8 w-48 h-1.5 bg-white/20 rounded-full overflow-hidden">
            <div class="h-full bg-white animate-[loading_1.5s_ease-in-out_infinite]" style="width: 30%"></div>
          </div>
        </div>
      `;
    }

    function HairResultPage() {
      const result = state.temp.hairResult;
      return `
        <div class="min-h-screen bg-white">
          ${Header({ title: '生成结果' })}
          <div class="p-4">
            <div class="rounded-xl overflow-hidden shadow-lg mb-6">
              <img src="${result}" alt="换发型效果" class="w-full">
            </div>

            <div class="grid grid-cols-3 gap-3">
              <button onclick="saveImage('${result}')" class="flex flex-col items-center gap-2 py-4 bg-blue-50 rounded-xl hover:bg-blue-100 transition-colors">
                <span class="material-icons text-blue-600">download</span>
                <span class="text-sm text-blue-600 font-medium">保存图片</span>
              </button>
              <button onclick="navigate('/hair/select')" class="flex flex-col items-center gap-2 py-4 bg-purple-50 rounded-xl hover:bg-purple-100 transition-colors">
                <span class="material-icons text-purple-600">refresh</span>
                <span class="text-sm text-purple-600 font-medium">重新生成</span>
              </button>
              <button onclick="shareImage('${result}')" class="flex flex-col items-center gap-2 py-4 bg-green-50 rounded-xl hover:bg-green-100 transition-colors">
                <span class="material-icons text-green-600">share</span>
                <span class="text-sm text-green-600 font-medium">分享</span>
              </button>
            </div>

            <button onclick="navigate('/')" class="w-full mt-6 py-3 bg-gray-100 text-gray-600 rounded-xl font-semibold hover:bg-gray-200 transition-colors">
              返回首页
            </button>
          </div>
        </div>
      `;
    }

    function ClothingUploadPage() {
      return `
        <div class="min-h-screen bg-white">
          ${Header({ title: '虚拟试衣' })}
          <div class="p-4">
            <div class="bg-pink-50 rounded-xl p-4 mb-4">
              <div class="flex items-start gap-3">
                <div class="w-8 h-8 bg-pink-100 rounded-full flex items-center justify-center flex-shrink-0">
                  <span class="material-icons text-pink-600 text-sm">camera_alt</span>
                </div>
                <div>
                  <h3 class="text-pink-800 font-semibold">拍摄建议</h3>
                  <ul class="text-pink-600 text-sm mt-1 space-y-1">
                    <li>• 请上传全身站立照片</li>
                    <li>• 穿着简单贴身衣物</li>
                    <li>• 背景干净整洁</li>
                  </ul>
                </div>
              </div>
            </div>

            ${Uploader({ 
              onUpload: 'handleClothingImageUpload', 
              preview: state.temp.clothingImage 
            })}

            <button onclick="handleClothingUploadNext()" 
                    disabled="${!state.temp.clothingImage}"
                    class="w-full mt-6 py-3 rounded-xl font-semibold transition-all ${state.temp.clothingImage ? 'bg-gradient-to-r from-pink-500 to-orange-500 text-white shadow-lg hover:shadow-xl' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}">
              下一步
            </button>
          </div>
        </div>
      `;
    }

    function ClothingSizePage() {
      const size = state.temp.sizeInfo || {};
      return `
        <div class="min-h-screen bg-white">
          ${Header({ title: '输入尺码' })}
          <div class="p-4">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="text-gray-600 text-sm font-medium mb-1 block">身高 (cm) *</label>
                <input type="number" value="${size.height || ''}" 
                       oninput="updateSizeInfo('height', this.value)"
                       class="w-full border border-gray-200 rounded-lg px-4 py-3 text-gray-800 focus:border-pink-500 focus:ring-1 focus:ring-pink-500 outline-none transition-all"
                       placeholder="170">
              </div>
              <div>
                <label class="text-gray-600 text-sm font-medium mb-1 block">体重 (kg) *</label>
                <input type="number" value="${size.weight || ''}" 
                       oninput="updateSizeInfo('weight', this.value)"
                       class="w-full border border-gray-200 rounded-lg px-4 py-3 text-gray-800 focus:border-pink-500 focus:ring-1 focus:ring-pink-500 outline-none transition-all"
                       placeholder="65">
              </div>
              <div>
                <label class="text-gray-600 text-sm font-medium mb-1 block">肩宽 (cm)</label>
                <input type="number" value="${size.shoulder || ''}" 
                       oninput="updateSizeInfo('shoulder', this.value)"
                       class="w-full border border-gray-200 rounded-lg px-4 py-3 text-gray-800 focus:border-pink-500 focus:ring-1 focus:ring-pink-500 outline-none transition-all"
                       placeholder="42">
              </div>
              <div>
                <label class="text-gray-600 text-sm font-medium mb-1 block">胸围 (cm)</label>
                <input type="number" value="${size.bust || ''}" 
                       oninput="updateSizeInfo('bust', this.value)"
                       class="w-full border border-gray-200 rounded-lg px-4 py-3 text-gray-800 focus:border-pink-500 focus:ring-1 focus:ring-pink-500 outline-none transition-all"
                       placeholder="88">
              </div>
              <div>
                <label class="text-gray-600 text-sm font-medium mb-1 block">腰围 (cm)</label>
                <input type="number" value="${size.waist || ''}" 
                       oninput="updateSizeInfo('waist', this.value)"
                       class="w-full border border-gray-200 rounded-lg px-4 py-3 text-gray-800 focus:border-pink-500 focus:ring-1 focus:ring-pink-500 outline-none transition-all"
                       placeholder="72">
              </div>
              <div>
                <label class="text-gray-600 text-sm font-medium mb-1 block">臀围 (cm)</label>
                <input type="number" value="${size.hip || ''}" 
                       oninput="updateSizeInfo('hip', this.value)"
                       class="w-full border border-gray-200 rounded-lg px-4 py-3 text-gray-800 focus:border-pink-500 focus:ring-1 focus:ring-pink-500 outline-none transition-all"
                       placeholder="92">
              </div>
            </div>

            <p class="text-gray-400 text-sm mt-4">* 为必填项，其他可选</p>

            <button onclick="handleSizeNext()" 
                    disabled="${!size.height || !size.weight}"
                    class="w-full mt-6 py-3 rounded-xl font-semibold transition-all ${size.height && size.weight ? 'bg-gradient-to-r from-pink-500 to-orange-500 text-white shadow-lg hover:shadow-xl' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}">
              下一步
            </button>
          </div>
        </div>
      `;
    }

    function ClothingSelectPage() {
      const selectedId = state.temp.selectedClothingTemplate;
      return `
        <div class="min-h-screen bg-gray-50">
          ${Header({ title: '选择衣服' })}
          <div class="p-4">

    function render() {
      const path = window.location.pathname;
      const container = document.getElementById('page-container');
      
      if (!container) return;

      switch (path) {
        case '/hair':
          container.innerHTML = HairUploadPage();
          break;
        case '/hair/select':
          container.innerHTML = HairSelectPage();
          break;
        case '/hair/generating':
          container.innerHTML = HairGeneratingPage();
          setTimeout(completeHairGeneration, 3000);
          break;
        case '/hair/result':
          container.innerHTML = HairResultPage();
          break;
        case '/clothing':
          container.innerHTML = ClothingUploadPage();
          break;
        case '/clothing/size':
          container.innerHTML = ClothingSizePage();
          break;
        case '/clothing/select':
          container.innerHTML = ClothingSelectPage();
          break;
        case '/clothing/generating':
          container.innerHTML = ClothingGeneratingPage();
          setTimeout(completeClothingGeneration, 3000);
          break;
        case '/clothing/result':
          container.innerHTML = ClothingResultPage();
          break;
        case '/profile':
          container.innerHTML = ProfilePage();
          break;
        case '/history':
          container.innerHTML = HistoryPage();
          break;
        case '/vip':
          container.innerHTML = VipPage();
          break;
        default:
          container.innerHTML = HomePage();
      }
    }

    window.handleFileUpload = function(event, input) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024) {
        alert('文件大小不能超过5MB');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const result = e.target.result;
        const path = window.location.pathname;
        
        if (path.startsWith('/hair')) {
          state.temp.hairImage = result;
        } else if (path.startsWith('/clothing')) {
          state.temp.clothingImage = result;
        } else if (path === '/hair/select') {
          state.temp.customHairImage = result;
          state.temp.selectedHairTemplate = null;
        } else if (path === '/clothing/select') {
          state.temp.customClothingImage = result;
          state.temp.selectedClothingTemplate = null;
        }
        render();
      };
      reader.readAsDataURL(file);
      input.value = '';
    };

    window.handleHairUploadNext = function() {
      if (!checkDailyLimit()) {
        alert('今日免费次数已用完，请开通会员');
        navigate('/vip');
        return;
      }
      navigate('/hair/select');
    };

    window.selectHairTemplate = function(id) {
      state.temp.selectedHairTemplate = id;
      state.temp.customHairImage = null;
      render();
    };

    window.handleCustomHairUpload = function() {};

    window.handleHairGenerate = function() {
      if (!checkDailyLimit()) {
        alert('今日免费次数已用完，请开通会员');
        navigate('/vip');
        return;
      }
      consumeDailyLimit();
      navigate('/hair/generating');
    };

    window.completeHairGeneration = function() {
      const results = mockResults.hair;
      const randomResult = results[Math.floor(Math.random() * results.length)];
      state.temp.hairResult = randomResult;
      
      state.history.unshift({
        type: 'hair',
        resultUrl: randomResult,
        createdAt: new Date().toISOString(),
      });
      saveState();
      
      navigate('/hair/result');

    window.saveImage = function(url) {

    window.handleBuyVip = function() {
      state.user.isVip = true;
      state.user.vipExpireAt = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

    window.handleLogout = function() {

        navigate('/');

    window.showSettings = function() {
      alert('设置功能开发中...');

    window.addEventListener('popstate', render);
