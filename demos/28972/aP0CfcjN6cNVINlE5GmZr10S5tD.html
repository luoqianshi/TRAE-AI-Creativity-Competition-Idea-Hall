<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今天吃什么？ · 拯救选择困难症</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --orange-50: #FFF4EC;
    --orange-100: #FFE4D1;
    --orange-200: #FFC9A4;
    --orange-300: #FFA876;
    --orange-400: #FF8A4C;
    --orange-500: #FF7A2E;
    --orange-600: #F25A11;
    --orange-700: #C73E00;
    --cream: #FFF8F1;
    --butter: #FFE9A8;
    --leaf: #6FB36A;
    --ink: #3A2418;
    --ink-soft: #6E4A3A;
    --shadow-soft: 0 14px 28px -16px rgba(255, 90, 17, 0.35), 0 4px 10px -4px rgba(255, 122, 46, 0.2);
    --shadow-pop: 0 26px 50px -20px rgba(255, 90, 17, 0.45), 0 6px 14px -6px rgba(255, 122, 46, 0.3);
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: "Noto Sans SC", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 8%, #FFD9B8 0%, transparent 38%),
      radial-gradient(circle at 88% 14%, #FFE9A8 0%, transparent 42%),
      radial-gradient(circle at 50% 100%, #FFE4D1 0%, transparent 55%),
      var(--cream);
    overflow-x: hidden;
    line-height: 1.6;
  }

  /* 飘动的小食物表情 */
  .floating-emoji {
    position: fixed;
    font-size: 28px;
    opacity: 0.55;
    pointer-events: none;
    user-select: none;
    z-index: 0;
    filter: drop-shadow(0 6px 8px rgba(255, 122, 46, 0.25));
    animation: floatY 7s ease-in-out infinite;
  }
  .floating-emoji.e1 { top: 12%; left: 6%; animation-delay: 0s; }
  .floating-emoji.e2 { top: 22%; right: 8%; animation-delay: 1.2s; font-size: 32px; }
  .floating-emoji.e3 { top: 60%; left: 4%; animation-delay: 2.4s; font-size: 24px; }
  .floating-emoji.e4 { top: 72%; right: 6%; animation-delay: 0.8s; }
  .floating-emoji.e5 { top: 40%; left: 92%; animation-delay: 3.2s; font-size: 22px; }

  @keyframes floatY {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-18px) rotate(6deg); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 980px;
    margin: 0 auto;
    padding: 36px 22px 80px;
  }

  /* ----- HEADER ----- */
  header {
    text-align: center;
    margin-bottom: 28px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 2px dashed var(--orange-300);
    color: var(--orange-600);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    box-shadow: 0 6px 14px -8px rgba(255, 122, 46, 0.4);
  }
  .badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--orange-500);
    box-shadow: 0 0 0 4px rgba(255, 122, 46, 0.18);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }

  h1.title {
    font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: clamp(48px, 8vw, 84px);
    margin: 12px 0 6px;
    letter-spacing: 4px;
    color: var(--orange-600);
    text-shadow:
      4px 4px 0 #fff,
      6px 6px 0 var(--orange-200);
    display: inline-flex;
    align-items: center;
    gap: 14px;
  }
  h1.title .emoji {
    font-size: 0.85em;
    display: inline-block;
    animation: wobble 2.8s ease-in-out infinite;
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(-8deg) scale(1); }
    50% { transform: rotate(12deg) scale(1.08); }
  }

  .subtitle {
    font-family: "Fraunces", serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 16px;
    margin: 0;
  }
  .subtitle b {
    background: linear-gradient(180deg, transparent 60%, var(--butter) 60%);
    padding: 0 4px;
    color: var(--ink);
  }

  /* ----- MAIN DISPLAY ----- */
  .stage {
    margin: 36px auto 0;
    background: #fff;
    border-radius: var(--radius-lg);
    padding: 40px 28px 36px;
    box-shadow: var(--shadow-pop);
    border: 1px solid #FFE4D1;
    position: relative;
    overflow: hidden;
  }
  .stage::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 6px;
    background: repeating-linear-gradient(
      90deg,
      var(--orange-500) 0 24px,
      var(--butter) 24px 48px,
      var(--orange-300) 48px 72px,
      #fff 72px 96px
    );
  }
  .stage::after {
    content: "";
    position: absolute;
    bottom: -40px; right: -40px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, var(--orange-100), transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .plate {
    margin: 8px auto 0;
    width: min(420px, 92%);
    aspect-ratio: 1.8 / 1;
    background:
      radial-gradient(ellipse at center, #fff 0%, #fff 55%, var(--orange-50) 56%, var(--orange-50) 64%, var(--orange-100) 65%, var(--orange-100) 100%);
    border-radius: 50%;
    box-shadow: inset 0 0 0 6px #fff, inset 0 0 0 8px var(--orange-200), 0 14px 28px -16px rgba(255, 90, 17, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .dish {
    font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: clamp(32px, 7vw, 56px);
    color: var(--orange-700);
    letter-spacing: 3px;
    text-align: center;
    transition: transform 0.18s ease, opacity 0.18s ease;
    user-select: none;
    padding: 0 12px;
  }
  .dish.placeholder {
    font-family: "Noto Sans SC", sans-serif;
    font-size: clamp(16px, 3.4vw, 22px);
    color: var(--ink-soft);
    font-weight: 500;
    letter-spacing: 1px;
  }
  .dish.rolling {
    animation: rollFlash 0.08s linear infinite;
    filter: blur(0.4px);
  }
  @keyframes rollFlash {
    0% { transform: translateY(-6px); opacity: 0.85; }
    50% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(6px); opacity: 0.85; }
  }
  .dish.landed {
    animation: bounceIn 0.7s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes bounceIn {
    0% { transform: scale(0.6); opacity: 0; }
    60% { transform: scale(1.18); opacity: 1; }
    100% { transform: scale(1); }
  }

  .stage-meta {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 22px;
    flex-wrap: wrap;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--orange-50);
    color: var(--orange-700);
    border: 1.5px solid var(--orange-200);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
  }

  /* ----- ROLL BUTTON ----- */
  .actions {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .roll-btn {
    position: relative;
    border: none;
    cursor: pointer;
    padding: 20px 56px;
    font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: clamp(22px, 4vw, 30px);
    letter-spacing: 6px;
    color: #fff;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--orange-400), var(--orange-600));
    box-shadow:
      0 0 0 6px #fff,
      0 0 0 8px var(--orange-300),
      0 18px 30px -12px rgba(255, 90, 17, 0.6),
      inset 0 -4px 0 rgba(0, 0, 0, 0.12),
      inset 0 2px 0 rgba(255, 255, 255, 0.4);
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    overflow: hidden;
  }
  .roll-btn:hover {
    transform: translateY(-2px);
    box-shadow:
      0 0 0 6px #fff,
      0 0 0 8px var(--orange-400),
      0 24px 36px -12px rgba(255, 90, 17, 0.65),
      inset 0 -4px 0 rgba(0, 0, 0, 0.12),
      inset 0 2px 0 rgba(255, 255, 255, 0.45);
  }
  .roll-btn:active { transform: translateY(2px) scale(0.98); }
  .roll-btn:disabled { cursor: not-allowed; filter: saturate(0.85); }
  .roll-btn::after {
    content: "";
    position: absolute;
    top: 0; left: -120%;
    width: 60%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.55), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
  }
  .roll-btn:hover::after { left: 130%; }

  .hint {
    color: var(--ink-soft);
    font-size: 13px;
  }
  .hint kbd {
    background: #fff;
    border: 1.5px solid var(--orange-200);
    border-radius: 6px;
    padding: 2px 8px;
    font-family: inherit;
    font-size: 12px;
    color: var(--orange-700);
    box-shadow: 0 2px 0 var(--orange-200);
  }

  /* ----- TOOL BAR ----- */
  .toolbar {
    margin-top: 36px;
    background: #fff;
    border-radius: var(--radius-md);
    padding: 18px;
    box-shadow: var(--shadow-soft);
    border: 1px solid #FFE4D1;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .toolbar input {
    flex: 1 1 220px;
    min-width: 0;
    padding: 12px 16px;
    border-radius: 999px;
    border: 2px solid var(--orange-100);
    background: var(--cream);
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .toolbar input::placeholder { color: #C8A99A; }
  .toolbar input:focus {
    border-color: var(--orange-400);
    background: #fff;
    box-shadow: 0 0 0 4px var(--orange-100);
  }

  .btn {
    border: none;
    cursor: pointer;
    padding: 12px 20px;
    border-radius: 999px;
    font-family: "Noto Sans SC", sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
    transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--orange-500);
    color: #fff;
    box-shadow: 0 6px 14px -6px rgba(255, 90, 17, 0.5);
  }
  .btn-primary:hover { background: var(--orange-600); transform: translateY(-1px); }
  .btn-ghost {
    background: var(--orange-50);
    color: var(--orange-700);
    border: 1.5px solid var(--orange-200);
  }
  .btn-ghost:hover { background: var(--orange-100); }

  /* ----- MENU LIST ----- */
  .menu-section {
    margin-top: 36px;
  }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .section-head h2 {
    font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: 28px;
    color: var(--ink);
    margin: 0;
    letter-spacing: 2px;
  }
  .section-head h2 span {
    color: var(--orange-500);
  }
  .section-head .count {
    font-family: "Fraunces", serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
  }

  .card {
    position: relative;
    background: #fff;
    border-radius: var(--radius-md);
    padding: 18px 14px;
    border: 1.5px solid #FFE4D1;
    box-shadow: 0 8px 16px -10px rgba(255, 122, 46, 0.25);
    text-align: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    overflow: hidden;
    animation: cardIn 0.4s ease backwards;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px) scale(0.96); }
    to { opacity: 1; transform: none; }
  }
  .card:hover {
    transform: translateY(-4px) rotate(-1deg);
    border-color: var(--orange-300);
    box-shadow: 0 16px 24px -12px rgba(255, 122, 46, 0.4);
  }
  .card.highlight {
    border-color: var(--orange-500);
    background: linear-gradient(180deg, #FFF8F1, #FFE4D1);
    box-shadow: 0 16px 28px -10px rgba(255, 90, 17, 0.45);
    transform: translateY(-4px) scale(1.04);
  }
  .card.highlight::after {
    content: "✨ 就是它";
    position: absolute;
    top: 8px; right: 8px;
    background: var(--orange-500);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    letter-spacing: 1px;
  }

  .card .emoji {
    font-size: 30px;
    display: block;
    margin-bottom: 6px;
    filter: drop-shadow(0 4px 6px rgba(255, 122, 46, 0.25));
  }
  .card .name {
    font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: 18px;
    color: var(--ink);
    letter-spacing: 1px;
  }
  .card .remove {
    position: absolute;
    top: 6px; left: 6px;
    width: 22px; height: 22px;
    border: none;
    background: transparent;
    color: var(--orange-300);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.2s ease, background 0.2s ease, color 0.2s ease;
  }
  .card:hover .remove { opacity: 1; }
  .card .remove:hover { background: var(--orange-500); color: #fff; }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--ink-soft);
    padding: 30px;
    background: #fff;
    border: 2px dashed var(--orange-200);
    border-radius: var(--radius-md);
  }

  /* ----- TOAST ----- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%) translateY(80px);
    background: var(--ink);
    color: #fff;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 14px 28px -12px rgba(0, 0, 0, 0.4);
    opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
    z-index: 50;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ----- FOOTER ----- */
  footer {
    text-align: center;
    margin-top: 50px;
    color: var(--ink-soft);
    font-size: 13px;
    font-family: "Fraunces", serif;
    font-style: italic;
  }

  /* ----- RESPONSIVE ----- */
  @media (max-width: 600px) {
    .container { padding: 22px 14px 60px; }
    .stage { padding: 30px 18px 26px; border-radius: 22px; }
    .toolbar { padding: 14px; }
    .toolbar input { flex: 1 1 100%; }
    .menu-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .card { padding: 14px 8px; }
    .roll-btn { padding: 16px 38px; letter-spacing: 4px; }
    .floating-emoji { display: none; }
  }

  /* 撒花动画 */
  .confetti {
    position: fixed;
    pointer-events: none;
    width: 10px; height: 14px;
    border-radius: 2px;
    z-index: 99;
    animation: fall 1.6s ease-in forwards;
  }
  @keyframes fall {
    0% { transform: translateY(-20vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="floating-emoji e1">🍣</div>
  <div class="floating-emoji e2">🍔</div>
  <div class="floating-emoji e3">🍜</div>
  <div class="floating-emoji e4">🍕</div>
  <div class="floating-emoji e5">🥟</div>

  <div class="container">
    <header>
      <span class="badge"><span class="dot"></span>拯救选择困难症 · 第 1 号</span>
      <h1 class="title">
        <span class="emoji">🍱</span>今天吃什么？
      </h1>
      <p class="subtitle">点一下，把烦恼丢给<b>命运</b>，剩下的交给胃。</p>
    </header>

    <section class="stage">
      <div class="plate">
        <div class="dish placeholder" id="dishDisplay">点击下方按钮开始抽饭</div>
      </div>
      <div class="stage-meta">
        <span class="chip">🎯 随机选择</span>
        <span class="chip">⏱ 3 秒揭晓</span>
        <span class="chip">🎉 不许耍赖</span>
      </div>
      <div class="actions">
        <button class="roll-btn" id="rollBtn">开始抽饭</button>
        <p class="hint">小提示：按下 <kbd>空格</kbd> 也能开抽 · 双击卡片可快速移除</p>
      </div>
    </section>

    <section class="toolbar">
      <input type="text" id="dishInput" placeholder="想吃啥？输入菜名 + 回车，比如「黄焖鸡米饭」" maxlength="14" />
      <button class="btn btn-primary" id="addBtn">＋ 添加菜品</button>
      <button class="btn btn-ghost" id="resetBtn">↺ 清空菜单</button>
    </section>

    <section class="menu-section">
      <div class="section-head">
        <h2>🍴 菜单 <span>·</span> 库</h2>
        <span class="count" id="countText">共 0 道好菜</span>
      </div>
      <div class="menu-grid" id="menuGrid"></div>
    </section>

    <footer>Made with 🧡 — Bon appétit!</footer>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const DEFAULT_DISHES = [
    "汉堡","炸鸡","披萨","麻辣烫","火锅","烤肉","螺蛳粉","盖浇饭","面条","饺子",
    "馄饨","寿司","沙拉","三明治","蛋炒饭","黄焖鸡","酸菜鱼","烤鱼","小龙虾","奶茶"
  ];

  const EMOJI_MAP = {
    "汉堡":"🍔","炸鸡":"🍗","披萨":"🍕","麻辣烫":"🌶️","火锅":"🍲","烤肉":"🥩",
    "螺蛳粉":"🍜","盖浇饭":"🍛","面条":"🍝","饺子":"🥟","馄饨":"🥟","寿司":"🍣",
    "沙拉":"🥗","三明治":"🥪","蛋炒饭":"🍚","黄焖鸡":"🍗","酸菜鱼":"🐟",
    "烤鱼":"🐠","小龙虾":"🦐","奶茶":"🧋","咖啡":"☕","蛋糕":"🍰","面包":"🍞",
    "牛排":"🥩","拉面":"🍜","煲仔饭":"🍚","煎饺":"🥟","包子":"🥟","粥":"🥣",
    "粉":"🍜","饭":"🍚","面":"🍜","鸡":"🍗","鱼":"🐟","虾":"🦐","蛋":"🍳",
    "汤":"🍲","菜":"🥬","豆腐":"🍢","串":"🍢","茶":"🍵"
  };
  const FALLBACK_EMOJIS = ["🍴","🥢","🍽️","🌮","🍙","🍡","🥡","🍢","🍤","🍥"];

  function getEmojiFor(name) {
    if (EMOJI_MAP[name]) return EMOJI_MAP[name];
    for (const key of Object.keys(EMOJI_MAP)) {
      if (name.includes(key)) return EMOJI_MAP[key];
    }
    let h = 0;
    for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return FALLBACK_EMOJIS[h % FALLBACK_EMOJIS.length];
  }

  const STORAGE_KEY = "lucky-meal-dishes-v1";
  let dishes = loadDishes();
  let isRolling = false;
  let rolledOnce = false;
  let highlightName = null;

  const dishDisplay = document.getElementById("dishDisplay");
  const rollBtn = document.getElementById("rollBtn");
  const dishInput = document.getElementById("dishInput");
  const addBtn = document.getElementById("addBtn");
  const resetBtn = document.getElementById("resetBtn");
  const menuGrid = document.getElementById("menuGrid");
  const countText = document.getElementById("countText");
  const toast = document.getElementById("toast");

  function loadDishes() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        const arr = JSON.parse(stored);
        if (Array.isArray(arr)) return arr;
      }
    } catch (e) {}
    return [...DEFAULT_DISHES];
  }

  function saveDishes() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(dishes)); } catch (e) {}
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 1800);
  }

  function renderMenu() {
    menuGrid.innerHTML = "";
    countText.textContent = `共 ${dishes.length} 道好菜`;

    if (dishes.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = "🍽️ 菜单空空如也<br>添加几道你爱吃的，或者点「清空菜单」恢复默认菜单。";
      menuGrid.appendChild(empty);
      return;
    }

    dishes.forEach((name, idx) => {
      const card = document.createElement("div");
      card.className = "card";
      if (name === highlightName) card.classList.add("highlight");
      card.style.animationDelay = `${Math.min(idx * 30, 600)}ms`;
      card.innerHTML = `
        <button class="remove" title="移除" aria-label="移除${name}">✕</button>
        <span class="emoji">${getEmojiFor(name)}</span>
        <span class="name">${escapeHTML(name)}</span>
      `;
      card.querySelector(".remove").addEventListener("click", (e) => {
        e.stopPropagation();
        removeDish(idx);
      });
      card.addEventListener("dblclick", () => removeDish(idx));
      menuGrid.appendChild(card);
    });
  }

  function escapeHTML(str) {
    return str.replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }

  function addDish() {
    const val = dishInput.value.trim();
    if (!val) { showToast("写点啥再加吧～"); dishInput.focus(); return; }
    if (val.length > 14) { showToast("名字太长啦，14 字以内"); return; }
    if (dishes.includes(val)) { showToast(`「${val}」已经在菜单里啦`); return; }
    dishes.push(val);
    saveDishes();
    dishInput.value = "";
    renderMenu();
    showToast(`已添加：${val} ${getEmojiFor(val)}`);
  }

  function removeDish(idx) {
    const name = dishes[idx];
    dishes.splice(idx, 1);
    if (highlightName === name) highlightName = null;
    saveDishes();
    renderMenu();
    showToast(`移除了：${name}`);
  }

  function resetDishes() {
    if (!confirm("确定要清空当前菜单，恢复成默认 20 道菜吗？")) return;
    dishes = [...DEFAULT_DISHES];
    highlightName = null;
    saveDishes();
    renderMenu();
    showToast("已恢复默认菜单 🍽️");
  }

  function pickRandom(exclude) {
    if (dishes.length === 0) return null;
    if (dishes.length === 1) return dishes[0];
    let candidate;
    let tries = 0;
    do {
      candidate = dishes[Math.floor(Math.random() * dishes.length)];
      tries++;
    } while (candidate === exclude && tries < 8);
    return candidate;
  }

  function startRoll() {
    if (isRolling) return;
    if (dishes.length === 0) {
      showToast("菜单空空如也，先加几道菜～");
      dishInput.focus();
      return;
    }

    isRolling = true;
    rollBtn.disabled = true;
    rollBtn.textContent = "抽抽抽…";
    highlightName = null;
    renderMenu();

    dishDisplay.classList.remove("placeholder", "landed");
    dishDisplay.classList.add("rolling");

    const startTime = Date.now();
    const totalDuration = 3000;
    let currentInterval = 60;

    let lastShown = null;

    function tick() {
      const elapsed = Date.now() - startTime;
      const next = pickRandom(lastShown);
      lastShown = next;
      dishDisplay.textContent = next;

      if (elapsed < totalDuration) {
        const progress = elapsed / totalDuration;
        currentInterval = 60 + Math.pow(progress, 2.4) * 280;
        setTimeout(tick, currentInterval);
      } else {
        finishRoll(next);
      }
    }

    tick();
  }

  function finishRoll(finalName) {
    dishDisplay.classList.remove("rolling");
    dishDisplay.classList.add("landed");
    dishDisplay.textContent = finalName;
    highlightName = finalName;
    rolledOnce = true;
    isRolling = false;
    rollBtn.disabled = false;
    rollBtn.textContent = "再抽一次";
    renderMenu();
    burstConfetti();
    const card = [...menuGrid.querySelectorAll(".card")].find(c => c.querySelector(".name")?.textContent === finalName);
    if (card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function burstConfetti() {
    const colors = ["#FF7A2E","#FFC9A4","#FFE9A8","#6FB36A","#FFF","#F25A11"];
    const stage = document.querySelector(".stage").getBoundingClientRect();
    const cx = stage.left + stage.width / 2;
    const cy = stage.top + 60;
    for (let i = 0; i < 26; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = (cx + (Math.random() - 0.5) * 200) + "px";
      c.style.top = (cy) + "px";
      c.style.background = colors[i % colors.length];
      c.style.animationDelay = (Math.random() * 0.3) + "s";
      c.style.transform = `rotate(${Math.random() * 360}deg)`;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 2200);
    }
  }

  rollBtn.addEventListener("click", startRoll);
  addBtn.addEventListener("click", addDish);
  resetBtn.addEventListener("click", resetDishes);
  dishInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); addDish(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && document.activeElement !== dishInput) {
      e.preventDefault();
      startRoll();
    }
  });

  renderMenu();
</script>
</body>
</html>
