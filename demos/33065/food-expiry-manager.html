<body>
  <div class="container">
    <header>
      <h1>食品保质期管理</h1>
      <p>记录、追踪、提醒 — 让食物不再被遗忘</p>
      <div class="today" id="todayLabel"></div>
    </header>

    <!-- Add Form -->
    <section class="card">
      <h2>添加食品</h2>
      <div class="form-grid">
        <div class="field">
          <label for="foodName">食品名称</label>
          <input type="text" id="foodName" placeholder="例如:牛奶、面包、鸡蛋…" maxlength="40">
        </div>
        <div class="field">
          <label for="expiryDate">过期日期</label>
          <input type="date" id="expiryDate">
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="primary" id="addBtn">+ 添加</button>
        </div>
      </div>
    </section>

    <!-- Stats -->
    <section class="stats">
      <div class="stat total"><div class="num" id="statTotal">0</div><div class="label">总数</div></div>
      <div class="stat safe"><div class="num" id="statSafe">0</div><div class="label">安全</div></div>
      <div class="stat warn"><div class="num" id="statWarn">0</div><div class="label">即将过期</div></div>
      <div class="stat danger"><div class="num" id="statDanger">0</div><div class="label">已过期</div></div>
    </section>

    <!-- List -->
    <section>
      <div class="toolbar">
        <h2>食品列表</h2>
        <div class="toolbar-actions">
          <select class="sort" id="sortSelect">
            <option value="days-asc">按剩余天数(升序)</option>
            <option value="days-desc">按剩余天数(降序)</option>
            <option value="name">按名称</option>
            <option value="added">按添加顺序</option>
          </select>
          <button class="ghost" id="clearBtn">清空全部</button>
        </div>
      </div>
      <div class="list" id="itemList"></div>
    </section>

    <footer>
      数据保存在本地浏览器中 · 刷新页面不会丢失
    </footer>
  </div>

<script>
(function() {
  'use strict';

  var STORAGE_KEY = 'food-expiry-items-v1';
  var foodNameEl = document.getElementById('foodName');
  var expiryDateEl = document.getElementById('expiryDate');
  var addBtn = document.getElementById('addBtn');
  var listEl = document.getElementById('itemList');
  var sortEl = document.getElementById('sortSelect');
  var clearBtn = document.getElementById('clearBtn');
  var todayLabel = document.getElementById('todayLabel');

  var items = [];

  // ---- Date helpers ----
  function todayMidnight() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function parseDate(str) {
    // str: 'YYYY-MM-DD'
    var parts = str.split('-');
    return new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  }
  function formatDate(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }
  function daysUntil(dateStr) {
    var target = parseDate(dateStr);
    target.setHours(0,0,0,0);
    var diffMs = target.getTime() - todayMidnight().getTime();
    return Math.round(diffMs / (1000 * 60 * 60 * 24));
  }

  // ---- Storage ----
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return [];
      return arr;
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
    catch (e) { alert('保存失败:' + e.message); }
  }

  // ---- Status classification ----
  function statusOf(days) {
    if (days < 0) return 'expired';
    if (days <= 3) return 'danger';
    if (days <= 7) return 'warn';
    return 'safe';
  }
  function statusLabel(days) {
    if (days < 0) return '已过期 ' + Math.abs(days) + ' 天';
    if (days === 0) return '今天到期';
    return '剩余天数';
  }
  function daysText(days) {
    if (days < 0) return Math.abs(days);
    return days;
  }
  function daysSuffix(days) {
    if (days === 0) return '';
    return '天';
  }

  // ---- Render ----
  function getSorted() {
    var arr = items.slice();
    var mode = sortEl.value;
    if (mode === 'days-asc') {
      arr.sort(function(a,b){ return daysUntil(a.date) - daysUntil(b.date); });
    } else if (mode === 'days-desc') {
      arr.sort(function(a,b){ return daysUntil(b.date) - daysUntil(a.date); });
    } else if (mode === 'name') {
      arr.sort(function(a,b){ return a.name.localeCompare(b.name, 'zh'); });
    } else if (mode === 'added') {
      arr.sort(function(a,b){ return a.createdAt - b.createdAt; });
    }
    return arr;
  }

  function render() {
    var sorted = getSorted();

    // stats
    var total = items.length, safe = 0, warn = 0, danger = 0;
    items.forEach(function(it){
      var d = daysUntil(it.date);
      var s = statusOf(d);
      if (s === 'safe') safe++;
      else if (s === 'warn') warn++;
      else danger++; // danger or expired
    });
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statSafe').textContent = safe;
    document.getElementById('statWarn').textContent = warn;
    document.getElementById('statDanger').textContent = danger;

    // list
    if (sorted.length === 0) {
      listEl.innerHTML = '<div class="empty"><div class="icon">📦</div><p>还没有添加任何食品</p><p style="font-size:0.85rem;">在上方输入名称和过期日期开始记录</p></div>';
      return;
    }

    var html = '';
    sorted.forEach(function(it){
      var days = daysUntil(it.date);
      var st = statusOf(days);
      var nameSafe = escapeHtml(it.name);
      var dateText = it.date;
      var daysShown = daysText(days);
      var suffix = daysSuffix(days);
      var label = statusLabel(days);

      html += '<div class="item ' + st + '" data-id="' + it.id + '">';
      html += '  <div class="item-info">';
      html += '    <div class="name">' + nameSafe + '</div>';
      html += '    <div class="date">过期日期:' + dateText + '</div>';
      html += '  </div>';
      html += '  <div class="item-status">';
      html += '    <div class="days">' + daysShown + (days === 0 ? '' : ' ' + suffix) + '</div>';
      html += '    <div class="tag">' + label + '</div>';
      html += '  </div>';
      html += '  <div class="item-actions"><button data-action="delete" data-id="' + it.id + '">删除</button></div>';
      html += '</div>';
    });
    listEl.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  // ---- Actions ----
  function addItem() {
    var name = foodNameEl.value.trim();
    var date = expiryDateEl.value;
    if (!name) { alert('请输入食品名称'); foodNameEl.focus(); return; }
    if (!date) { alert('请选择过期日期'); expiryDateEl.focus(); return; }

    items.push({
      id: 'f_' + Date.now() + '_' + Math.floor(Math.random()*1000),
      name: name,
      date: date,
      createdAt: Date.now()
    });
    save();
    render();
    foodNameEl.value = '';
    expiryDateEl.value = '';
    foodNameEl.focus();
  }

  function deleteItem(id) {
    var it = items.find(function(x){ return x.id === id; });
    if (!it) return;
    if (!confirm('确定删除「' + it.name + '」吗?')) return;
    items = items.filter(function(x){ return x.id !== id; });
    save();
    render();
  }

  function clearAll() {
    if (items.length === 0) return;
    if (!confirm('确定清空全部 ' + items.length + ' 条记录吗?此操作不可恢复。')) return;
    items = [];
    save();
    render();
  }

  // ---- Events ----
  addBtn.addEventListener('click', addItem);
  foodNameEl.addEventListener('keydown', function(e){ if (e.key === 'Enter') addItem(); });
  expiryDateEl.addEventListener('keydown', function(e){ if (e.key === 'Enter') addItem(); });
  sortEl.addEventListener('change', render);
  clearBtn.addEventListener('click', clearAll);

  listEl.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-action="delete"]');
    if (btn) {
      deleteItem(btn.getAttribute('data-id'));
    }
  });

  // ---- Init ----
  function init() {
    items = load();
    // default expiry date: today + 7
    var d = new Date();
    d.setDate(d.getDate() + 7);
    expiryDateEl.value = formatDate(d);
    // min date: today
    expiryDateEl.min = formatDate(new Date());
    // remove min restriction so user can also add already-expired items
    expiryDateEl.removeAttribute('min');

    todayLabel.textContent = '今天:' + formatDate(new Date());
    render();
  }

  init();
})();
</script>
</body>
</html>
