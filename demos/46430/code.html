<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程学习中心</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: {
          50: '#eef2ff',
          100: '#e0e7ff',
          200: '#c7d2fe',
          300: '#a5b4fc',
          400: '#818cf8',
          500: '#6366f1',
          600: '#4f46e5',
          700: '#4338ca',
          800: '#3730a3',
          900: '#312e81',
        },
        accent: {
          50: '#ecfdf5',
          100: '#d1fae5',
          200: '#a7f3d0',
          300: '#6ee7b7',
          400: '#34d399',
          500: '#10b981',
          600: '#059669',
          700: '#047857',
        },
        warning: {
          50: '#fffbeb',
          100: '#fef3c7',
          200: '#fde68a',
          300: '#fcd34d',
          400: '#fbbf24',
          500: '#f59e0b',
        }
      },
      fontFamily: {
        sans: ['Inter', 'system-ui', 'sans-serif'],
      },
      animation: {
        'fade-in': 'fadeIn 0.5s ease-in-out',
        'slide-down': 'slideDown 0.3s ease-out',
        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
      }
    }
  }
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { 
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
  }
  
  .glass {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.3);
  }
  
  .glass-light {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  
  .custom-scroll::-webkit-scrollbar {
    width: 6px;
  }
  
  .custom-scroll::-webkit-scrollbar-track {
    background: #f1f5f9;
    border-radius: 10px;
  }
  
  .custom-scroll::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 10px;
  }
  
  .custom-scroll::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }
  
  .chapter-item {
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  .lesson-item {
    transition: all 0.2s ease;
  }
  
  .lesson-item:hover {
    transform: translateX(4px);
  }
  
  /* 统一的状态图标样式 - 仅通过颜色区分 */
  .status-completed {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  }
  
  .status-incomplete {
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
  }
  
  .status-locked {
    background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
    box-shadow: 0 4px 12px rgba(148, 163, 184, 0.3);
  }
  
  .progress-ring {
    transform: rotate(-90deg);
  }
  
  .progress-ring__circle {
    transition: stroke-dashoffset 0.5s ease-in-out;
    stroke-linecap: round;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  @keyframes slideDown {
    from { max-height: 0; opacity: 0; }
    to { max-height: 500px; opacity: 1; }
  }
  
  .animate-fade-in {
    animation: fadeIn 0.5s ease-in-out;
  }
  
  .tree-line {
    position: relative;
  }
  
  .tree-line::before {
    content: '';
    position: absolute;
    left: 15px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, #e2e8f0, #cbd5e1);
  }
  
  .tree-line::after {
    content: '';
    position: absolute;
    left: 15px;
    top: 20px;
    width: 12px;
    height: 2px;
    background: #cbd5e1;
  }
  
  .input-glow:focus {
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
  }
  
  .btn-primary {
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    transition: all 0.3s ease;
  }
  
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
  }
  
  .btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    transition: all 0.3s ease;
  }
  
  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
  }
  
  .chapter-toggle {
    transition: transform 0.3s ease;
  }
  
  .chapter-toggle.collapsed {
    transform: rotate(-90deg);
  }
</style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-6xl mx-auto">
  
  <!-- 页面标题 -->
  <div class="text-center mb-8 animate-fade-in">
    <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-3 tracking-tight">
      <i class="fas fa-graduation-cap mr-3"></i>课程学习中心
    </h1>
    <p class="text-white/80 text-lg font-medium">追踪你的学习进度，开启知识探索之旅</p>
  </div>
  
  <!-- 主容器 -->
  <div class="glass rounded-3xl shadow-2xl overflow-hidden">
    
    <!-- 顶部搜索和操作栏 -->
    <div class="p-6 border-b border-gray-200/50">
      <div class="flex flex-col md:flex-row gap-4 items-stretch md:items-center">
        
        <!-- 搜索输入框 -->
        <div class="flex-1 relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <i class="fas fa-search text-gray-400"></i>
          </div>
          <input 
            type="text" 
            id="searchInput"
            placeholder="搜索课程内容..." 
            class="input-glow w-full pl-12 pr-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-primary-500 transition-all duration-300 text-gray-700 placeholder-gray-400"
          />
          <button 
            id="clearSearch"
            class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600 hidden"
          >
            <i class="fas fa-times-circle"></i>
          </button>
        </div>
        
        <!-- 筛选按钮组 -->
        <div class="flex gap-2">
          <button 
            class="filter-btn px-5 py-3 bg-primary-600 text-white rounded-2xl font-semibold hover:bg-primary-700 transition-all duration-300 shadow-lg shadow-primary-500/30" 
            data-filter="all"
          >
            <i class="fas fa-list mr-2"></i>全部
          </button>
          <button 
            class="filter-btn px-5 py-3 bg-white text-gray-700 border-2 border-gray-200 rounded-2xl font-semibold hover:border-accent-500 hover:text-accent-600 transition-all duration-300" 
            data-filter="completed"
          >
            <i class="fas fa-check-circle mr-2"></i>已完成
          </button>
          <button 
            class="filter-btn px-5 py-3 bg-white text-gray-700 border-2 border-gray-200 rounded-2xl font-semibold hover:border-warning-500 hover:text-warning-600 transition-all duration-300" 
            data-filter="incomplete"
          >
            <i class="fas fa-clock mr-2"></i>未完成
          </button>
        </div>
        
        <!-- 开始学习按钮 -->
        <button 
          id="startLearning"
          class="btn-primary px-6 py-3 bg-gradient-to-r from-primary-600 to-primary-700 text-white rounded-2xl font-semibold shadow-lg"
        >
          <i class="fas fa-play mr-2"></i>继续学习
        </button>
      </div>
      
      <!-- 学习进度概览 -->
      <div class="mt-6 grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="glass-light rounded-2xl p-4 flex items-center gap-3">
          <div class="w-12 h-12 rounded-xl bg-primary-100 flex items-center justify-center">
            <i class="fas fa-book-open text-primary-600 text-xl"></i>
          </div>
          <div>
            <p class="text-2xl font-bold text-gray-800" id="totalLessons">0</p>
            <p class="text-sm text-gray-500">总课时</p>
          </div>
        </div>
        <div class="glass-light rounded-2xl p-4 flex items-center gap-3">
          <div class="w-12 h-12 rounded-xl bg-accent-100 flex items-center justify-center">
            <i class="fas fa-check-double text-accent-600 text-xl"></i>
          </div>
          <div>
            <p class="text-2xl font-bold text-gray-800" id="completedLessons">0</p>
            <p class="text-sm text-gray-500">已完成</p>
          </div>
        </div>
        <div class="glass-light rounded-2xl p-4 flex items-center gap-3">
          <div class="w-12 h-12 rounded-xl bg-warning-100 flex items-center justify-center">
            <i class="fas fa-hourglass-half text-warning-600 text-xl"></i>
          </div>
          <div>
            <p class="text-2xl font-bold text-gray-800" id="incompleteLessons">0</p>
            <p class="text-sm text-gray-500">未完成</p>
          </div>
        </div>
        <div class="glass-light rounded-2xl p-4 flex items-center gap-3">
          <div class="relative w-12 h-12">
            <svg class="progress-ring w-12 h-12" viewBox="0 0 48 48">
              <circle cx="24" cy="24" r="20" fill="none" stroke="#e2e8f0" stroke-width="4"/>
              <circle id="progressCircle" class="progress-ring__circle" cx="24" cy="24" r="20" fill="none" stroke="#6366f1" stroke-width="4" stroke-dasharray="125.6" stroke-dashoffset="125.6"/>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
              <span class="text-sm font-bold text-gray-700" id="progressPercent">0%</span>
            </div>
          </div>
          <div>
            <p class="text-sm font-bold text-gray-800">学习进度</p>
            <p class="text-xs text-gray-500">继续加油！</p>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 课程树状列表 -->
    <div class="p-6 max-h-[600px] overflow-y-auto custom-scroll" id="courseList">
      <!-- 课程内容将通过JavaScript动态生成 -->
    </div>
    
    <!-- 底部操作栏 -->
    <div class="p-6 border-t border-gray-200/50 bg-gray-50/50">
      <div class="flex flex-col sm:flex-row gap-3 justify-between items-center">
        <div class="flex gap-3">
          <button class="px-5 py-2.5 bg-white border-2 border-gray-200 rounded-xl text-gray-700 font-medium hover:border-primary-500 hover:text-primary-600 transition-all duration-300">
            <i class="fas fa-download mr-2"></i>下载资料
          </button>
          <button class="px-5 py-2.5 bg-white border-2 border-gray-200 rounded-xl text-gray-700 font-medium hover:border-primary-500 hover:text-primary-600 transition-all duration-300">
            <i class="fas fa-bookmark mr-2"></i>收藏课程
          </button>
        </div>
        <button class="btn-primary px-8 py-2.5 bg-gradient-to-r from-primary-600 to-primary-700 text-white rounded-xl font-semibold shadow-lg">
          <i class="fas fa-certificate mr-2"></i>查看证书
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// 课程数据 - 树状结构
const courseData = [
  {
    id: 1,
    title: "第一章：Web开发基础",
    description: "了解Web开发的基本概念和核心技术",
    icon: "fa-code",
    lessons: [
      { id: 101, title: "1.1 HTML基础入门", duration: "25分钟", status: "completed", type: "video" },
      { id: 102, title: "1.2 CSS样式设计", duration: "35分钟", status: "completed", type: "video" },
      { id: 103, title: "1.3 JavaScript基础语法", duration: "45分钟", status: "completed", type: "video" },
      { id: 104, title: "1.4 实战练习：制作个人主页", duration: "60分钟", status: "incomplete", type: "practice" },
      { id: 105, title: "1.5 章节测试", duration: "15分钟", status: "locked", type: "quiz" }
    ]
  },
  {
    id: 2,
    title: "第二章：前端框架进阶",
    description: "深入学习现代前端框架和工具链",
    icon: "fa-layer-group",
    lessons: [
      { id: 201, title: "2.1 React框架入门", duration: "40分钟", status: "incomplete", type: "video" },
      { id: 202, title: "2.2 Vue.js核心概念", duration: "38分钟", status: "incomplete", type: "video" },
      { id: 203, title: "2.3 状态管理方案对比", duration: "30分钟", status: "locked", type: "video" },
      { id: 204, title: "2.4 组件化开发实战", duration: "55分钟", status: "locked", type: "practice" }
    ]
  },
  {
    id: 3,
    title: "第三章：后端开发技术",
    description: "掌握服务器端开发与API设计",
    icon: "fa-server",
    lessons: [
      { id: 301, title: "3.1 Node.js服务器搭建", duration: "42分钟", status: "locked", type: "video" },
      { id: 302, title: "3.2 RESTful API设计", duration: "35分钟", status: "locked", type: "video" },
      { id: 303, title: "3.3 数据库集成操作", duration: "50分钟", status: "locked", type: "video" },
      { id: 304, title: "3.4 用户认证与授权", duration: "45分钟", status: "locked", type: "video" },
      { id: 305, title: "3.5 项目部署与上线", duration: "60分钟", status: "locked", type: "practice" }
    ]
  },
  {
    id: 4,
    title: "第四章：项目实战与优化",
    description: "通过完整项目巩固所学知识",
    icon: "fa-rocket",
    lessons: [
      { id: 401, title: "4.1 全栈项目架构设计", duration: "45分钟", status: "locked", type: "video" },
      { id: 402, title: "4.2 性能优化策略", duration: "38分钟", status: "locked", type: "video" },
      { id: 403, title: "4.3 安全防护实践", duration: "42分钟", status: "locked", type: "video" },
      { id: 404, title: "4.4 最终项目展示", duration: "90分钟", status: "locked", type: "practice" }
    ]
  }
];

// 渲染课程列表
function renderCourseList(data, filter = 'all') {
  const courseList = document.getElementById('courseList');
  courseList.innerHTML = '';
  
  let totalLessons = 0;
  let completedLessons = 0;
  
  data.forEach((chapter, chapterIndex) => {
    const chapterEl = document.createElement('div');
    chapterEl.className = 'chapter-item mb-4 animate-fade-in';
    chapterEl.style.animationDelay = `${chapterIndex * 0.1}s`;
    
    let chapterCompleted = 0;
    let chapterTotal = chapter.lessons.length;
    
    chapter.lessons.forEach(lesson => {
      totalLessons++;
      if (lesson.status === 'completed') {
        completedLessons++;
        chapterCompleted++;
      }
    });
    
    const chapterProgress = Math.round((chapterCompleted / chapterTotal) * 100);
    
    chapterEl.innerHTML = `
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <!-- 章节标题 -->
        <div class="chapter-header p-5 cursor-pointer hover:bg-gray-50 transition-all duration-300" data-chapter-id="${chapter.id}">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center text-white shadow-lg">
                <i class="fas ${chapter.icon} text-lg"></i>
              </div>
              <div>
                <h3 class="text-lg font-bold text-gray-800">${chapter.title}</h3>
                <p class="text-sm text-gray-500">${chapter.description}</p>
              </div>
            </div>
            <div class="flex items-center gap-4">
              <div class="hidden md:flex items-center gap-2">
                <div class="w-24 h-2 bg-gray-200 rounded-full overflow-hidden">
                  <div class="h-full bg-gradient-to-r from-accent-400 to-accent-600 rounded-full transition-all duration-500" style="width: ${chapterProgress}%"></div>
                </div>
                <span class="text-sm font-semibold text-gray-600">${chapterCompleted}/${chapterTotal}</span>
              </div>
              <i class="fas fa-chevron-down chapter-toggle text-gray-400 transition-transform"></i>
            </div>
          </div>
        </div>
        
        <!-- 课程列表 -->
        <div class="chapter-content border-t border-gray-100">
          ${chapter.lessons.map((lesson, lessonIndex) => {
            const shouldShow = filter === 'all' || lesson.status === filter;
            if (!shouldShow) return '';
            
            let statusBadge, statusIcon, statusText, statusClass;
            // 统一使用圆形图标，仅通过颜色和内部符号区分状态
            if (lesson.status === 'completed') {
              statusBadge = 'status-completed';
              statusIcon = 'fa-check'; // 绿色圆圈带勾
              statusText = '已完成';
              statusClass = 'text-accent-600';
            } else if (lesson.status === 'incomplete') {
              statusBadge = 'status-incomplete';
              statusIcon = 'fa-exclamation'; // 橙色圆圈带叹号
              statusText = '未完成';
              statusClass = 'text-warning-600';
            } else {
              statusBadge = 'status-locked';
              statusIcon = ''; // 灰色空心圆，无内部图标
              statusText = '未开始';
              statusClass = 'text-gray-400';
            }
            
            let typeIcon, typeText;
            if (lesson.type === 'video') {
              typeIcon = 'fa-play-circle';
              typeText = '视频课程';
            } else if (lesson.type === 'practice') {
              typeIcon = 'fa-laptop-code';
              typeText = '实战练习';
            } else {
              typeIcon = 'fa-question-circle';
              typeText = '章节测试';
            }
            
            return `
              <div class="lesson-item flex items-center justify-between p-4 pl-8 hover:bg-gray-50 cursor-pointer ${lessonIndex !== chapter.lessons.length - 1 ? 'border-b border-gray-50' : ''} ${lesson.status === 'locked' ? 'opacity-60' : ''}">
                <div class="flex items-center gap-4 flex-1">
                  <div class="tree-line relative pl-8">
                    <div class="w-8 h-8 rounded-full ${statusBadge} flex items-center justify-center text-white text-xs shadow-md">
                      ${statusIcon ? `<i class="fas ${statusIcon}"></i>` : ''}
                    </div>
                  </div>
                  <div class="flex-1">
                    <h4 class="font-semibold text-gray-800 ${lesson.status === 'locked' ? 'text-gray-400' : ''}">${lesson.title}</h4>
                    <div class="flex items-center gap-3 mt-1">
                      <span class="text-xs text-gray-500 flex items-center gap-1">
                        <i class="fas ${typeIcon}"></i>${typeText}
                      </span>
                      <span class="text-xs text-gray-400">•</span>
                      <span class="text-xs text-gray-500 flex items-center gap-1">
                        <i class="far fa-clock"></i>${lesson.duration}
                      </span>
                    </div>
                  </div>
                </div>
                <div class="flex items-center gap-3">
                  <span class="text-xs font-semibold ${statusClass} px-3 py-1 rounded-full ${lesson.status === 'completed' ? 'bg-accent-50' : lesson.status === 'incomplete' ? 'bg-warning-50' : 'bg-gray-100'}">
                    ${statusText}
                  </span>
                  ${lesson.status !== 'locked' ? `
                    <button class="w-9 h-9 rounded-full bg-primary-50 hover:bg-primary-100 flex items-center justify-center text-primary-600 transition-all duration-300 hover:scale-110">
                      <i class="fas fa-arrow-right text-sm"></i>
                    </button>
                  ` : `
                    <div class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-400">
                      <i class="fas fa-lock text-sm"></i>
                    </div>
                  `}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
    
    courseList.appendChild(chapterEl);
  });
  
  // 更新统计数据
  document.getElementById('totalLessons').textContent = totalLessons;
  document.getElementById('completedLessons').textContent = completedLessons;
  document.getElementById('incompleteLessons').textContent = totalLessons - completedLessons;
  
  const progressPercent = Math.round((completedLessons / totalLessons) * 100);
  document.getElementById('progressPercent').textContent = `${progressPercent}%`;
  
  const circumference = 2 * Math.PI * 20;
  const offset = circumference - (progressPercent / 100) * circumference;
  document.getElementById('progressCircle').style.strokeDashoffset = offset;
  
  // 绑定章节展开/收起事件
  document.querySelectorAll('.chapter-header').forEach(header => {
    header.addEventListener('click', function() {
      const content = this.nextElementSibling;
      const toggle = this.querySelector('.chapter-toggle');
      
      content.style.display = content.style.display === 'none' ? 'block' : 'none';
      toggle.classList.toggle('collapsed');
    });
  });
}

// 搜索功能
document.getElementById('searchInput').addEventListener('input', function(e) {
  const searchTerm = e.target.value.toLowerCase();
  const clearBtn = document.getElementById('clearSearch');
  
  if (searchTerm) {
    clearBtn.classList.remove('hidden');
  } else {
    clearBtn.classList.add('hidden');
  }
  
  const filteredData = courseData.map(chapter => {
    const filteredLessons = chapter.lessons.filter(lesson => 
      lesson.title.toLowerCase().includes(searchTerm) ||
      chapter.title.toLowerCase().includes(searchTerm)
    );
    return { ...chapter, lessons: filteredLessons };
  }).filter(chapter => chapter.lessons.length > 0);
  
  renderCourseList(filteredData);
});

// 清除搜索
document.getElementById('clearSearch').addEventListener('click', function() {
  document.getElementById('searchInput').value = '';
  this.classList.add('hidden');
  renderCourseList(courseData);
});

// 筛选按钮
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.remove('bg-primary-600', 'text-white', 'shadow-lg', 'shadow-primary-500/30');
      b.classList.add('bg-white', 'text-gray-700', 'border-2', 'border-gray-200');
    });
    this.classList.add('bg-primary-600', 'text-white', 'shadow-lg', 'shadow-primary-500/30');
    this.classList.remove('bg-white', 'text-gray-700', 'border-2', 'border-gray-200');
    
    const filter = this.dataset.filter;
    renderCourseList(courseData, filter);
  });
});

// 开始学习按钮
document.getElementById('startLearning').addEventListener('click', function() {
  // 找到第一个未完成的课程
  for (let chapter of courseData) {
    for (let lesson of chapter.lessons) {
      if (lesson.status === 'incomplete') {
        alert(`开始学习：${lesson.title}`);
        return;
      }
    }
  }
  alert('恭喜！您已完成所有课程！');
});

// 初始化渲染
renderCourseList(courseData);
</script>
