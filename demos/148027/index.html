[{id:"basics",title:"书法入门基础",content:'学习书法首先要掌握正确的姿势和基本工具的使用方法。"文房四宝"指笔、墨、纸、砚，是书法的基本工具。写字时要头正、身直、臂开、足安，做到"指实掌虚"。',keyPoints:["五指执笔法：擫、押、钩、格、抵","枕腕与悬腕：小字枕腕，大字悬腕","运笔方式：指运、腕运、肘运","身法：头正、身直、肩平、足安"]},{id:"yongzibafa",title:"永字八法",content:'"永字八法"是中国书法用笔的基本法则，以"永"字的八个笔画为例，阐述楷书笔势的基本方法。八法分别为：侧（点）、勒（横）、弩（竖）、趯（钩）、策（提）、掠（长撇）、啄（短撇）、磔（捺）。',keyPoints:["侧（点）：如高峰坠石，磕磕然实如崩也","勒（横）：如千里阵云，隐隐然其实有形","弩（竖）：如万岁枯藤，劲健挺拔","趯（钩）：如人踢脚，猝然有力","策（提）：如策马扬鞭，轻快有力","掠（长撇）：如梳掠长发，舒展流畅","啄（短撇）：如鸟之啄物，迅捷利落","磔（捺）：如刀割肉，沉着痛快"]},{id:"strokes",title:"基本笔画",content:"汉字的基本笔画包括横、竖、撇、捺、点、提、折、钩八种。掌握这些基本笔画的写法是学好书法的基础。每一种笔画都有起笔、行笔、收笔三个过程。",keyPoints:["起笔：逆锋起笔，欲右先左，欲下先上","行笔：中锋行笔，笔锋在笔画中央运行","收笔：回锋收笔，有往必收，有垂必缩","转折：折处顿笔，转处圆劲"]},{id:"structure",title:"间架结构",content:"间架结构指字的点画布置和排列关系。汉字结构有独体字和合体字之分，合体字又包括左右结构、上下结构、包围结构等。要做到重心平稳、疏密匀称、主次分明、呼应连贯。",keyPoints:["重心平稳：横平竖直，支撑有力","疏密匀称：间距均匀，布白得当","主次分明：主笔突出，次笔衬托","呼应连贯：笔断意连，气韵贯通","参差变化：避免雷同，生动自然"]},{id:"styles",title:"五体书法",content:'中国书法主要有篆书、隶书、楷书、行书、草书五种书体，合称"五体"。它们在历史上先后出现，各具特色。篆书古朴，隶书典雅，楷书端正，行书流畅，草书奔放。',keyPoints:["篆书：线条均匀，圆转对称，是最早的成熟书体","隶书：蚕头燕尾，字形扁方，由篆书简化演变而来","楷书：横平竖直，结构端正，又称正书、真书","行书：介于楷草之间，书写便捷，最为实用","草书：笔画简约，连绵环绕，艺术性最强"]},{id:"history",title:"书法简史",content:"中国书法历史悠久，从甲骨文、金文演变为大篆、小篆、隶书，至东汉、魏、晋的草书、楷书、行书诸体，书法一直散发着独特的艺术魅力。涌现出了王羲之、颜真卿、柳公权、欧阳询等众多书法大家。",keyPoints:["先秦：甲骨文、金文、石鼓文","秦代：李斯统一文字为小篆","汉代：隶书成熟，草书出现",'魏晋：王羲之"书圣"，行书、楷书成熟',"唐代：欧阳询、虞世南、褚遂良、颜真卿、柳公权，楷书鼎盛","宋元：苏轼、黄庭坚、米芾、赵孟頫，文人书法兴起"]}],vC=()=>xC;function wC(){var m;const n=vC(),[r,i]=A.useState(((m=n[0])==null?void 0:m.id)||""),[a,l]=A.useState(new Set),u=y=>{i(r===y?"":y)},p=y=>{l(g=>{const v=new Set(g);return v.has(y)?v.delete(y):v.add(y),v})},f=Math.round(a.size/n.length*100);return h.jsx("div",{"trae-inspector-start-line":"30","trae-inspector-start-column":"4","trae-inspector-end-line":"198","trae-inspector-end-column":"10","trae-inspector-file-path":"src/pages/Tutorial.tsx","trae-inspector-static-props":"%7B%22cwd%22%3A%22%2FUsers%2Fbytedance%2FDownloads%2Ftrae_shufa%22%7D",className:"min-h-screen paper-bg py-12",chi
