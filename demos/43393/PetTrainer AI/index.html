<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetTrainer AI - 宠物智能训练师</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <span class="logo-icon">🐕</span>
            <h1>PetTrainer AI</h1>
        </div>
        <p class="tagline">让每一只宠物都能获得专业训练指导</p>
    </header>

    <main class="main-content">
        <section class="guide-section">
            <h2>🎉 欢迎使用 PetTrainer AI</h2>
            <div class="guide-steps">
                <div class="guide-step">
                    <div class="step-number">1</div>
                    <div class="step-content">
                        <h4>添加你的宠物</h4>
                        <p>点击下方"添加宠物"按钮，填写宠物基本信息</p>
                    </div>
                </div>
                <div class="guide-step">
                    <div class="step-number">2</div>
                    <div class="step-content">
                        <h4>选择宠物卡片</h4>
                        <p>点击宠物卡片，查看专属训练计划</p>
                    </div>
                </div>
                <div class="guide-step">
                    <div class="step-number">3</div>
                    <div class="step-content">
                        <h4>获取训练方案</h4>
                        <p>AI根据宠物特点生成个性化训练方案</p>
                    </div>
                </div>
                <div class="guide-step">
                    <div class="step-number">4</div>
                    <div class="step-content">
                        <h4>开始训练之旅</h4>
                        <p>按照计划每日训练，见证宠物的成长</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="pets-section">
            <h2>🐾 我的宠物</h2>
            <div id="petsContainer" class="pets-container">
            </div>
        </section>

        <section class="add-pet-section">
            <button id="addPetToggleBtn" class="add-pet-toggle-btn">
                <span class="plus-icon">+</span>
                添加新宠物
            </button>
            <div id="addPetFormWrapper" class="add-pet-form-wrapper" style="display: none;">
                <h3>填写宠物信息</h3>
                <form id="addPetForm" class="pet-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="petName">宠物名称</label>
                            <input type="text" id="petName" required placeholder="输入宠物名字">
                        </div>
                        <div class="form-group">
                            <label for="petType">宠物类型</label>
                            <select id="petType" required>
                                <option value="">请选择</option>
                                <option value="dog">狗狗</option>
                                <option value="cat">猫咪</option>
                                <option value="bird">鸟类</option>
                                <option value="rabbit">兔子</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="petBreed">品种</label>
                            <input type="text" id="petBreed" placeholder="例如：金毛、英短">
                        </div>
                        <div class="form-group">
                            <label for="petAge">年龄</label>
                            <input type="number" id="petAge" min="0" placeholder="输入年龄（月）">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="petGender">性别</label>
                            <select id="petGender">
                                <option value="male">公</option>
                                <option value="female">母</option>
                                <option value="unknown">未知</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="petWeight">体重（kg）</label>
                            <input type="number" id="petWeight" min="0" step="0.1" placeholder="输入体重">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="petBehavior">行为问题</label>
                        <textarea id="petBehavior" rows="3" placeholder="描述宠物的行为问题，如：拆家、乱吠、随地大小便等"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" id="cancelAddBtn" class="cancel-btn">取消</button>
                        <button type="submit" class="submit-btn">确认添加</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="training-section" id="trainingSection" style="display: none;">
            <h2>训练计划</h2>
            <div id="selectedPetInfo" class="selected-pet-info">
            </div>
            <div id="trainingPlan" class="training-plan">
            </div>
            <div class="training-actions">
                <button id="startTrainingBtn" class="start-training-btn">
                    <span class="play-icon">▶</span>
                    开始训练
                </button>
                <button id="viewHistoryBtn" class="view-history-btn">
                    <span class="history-icon">📋</span>
                    查看历史记录
                </button>
            </div>

            <div id="activeTrainingSection" class="active-training-section" style="display: none;">
                <div class="training-header">
                    <h3>🔥 训练进行中</h3>
                    <div id="trainingTimer" class="training-timer">00:00</div>
                </div>
                <div class="checkin-list">
                    <h4>今日打卡</h4>
                    <ul id="checkinList" class="checkin-items">
                    </ul>
                    <div class="checkin-action">
                        <input type="text" id="checkinInput" placeholder="记录训练内容..." class="checkin-input">
                        <button id="addCheckinBtn" class="add-checkin-btn">打卡</button>
                    </div>
                </div>
                <button id="endTrainingBtn" class="end-training-btn">结束训练</button>
            </div>

            <div id="historySection" class="history-section" style="display: none;">
                <div class="history-header">
                    <h3>📜 训练历史记录</h3>
                    <button id="closeHistoryBtn" class="close-history-btn">返回</button>
                </div>
                <div id="historyList" class="history-list">
                </div>
            </div>

            <button id="backBtn" class="back-btn">返回宠物列表</button>
        </section>
    </main>

    <footer class="footer">
        <p>© 2024 PetTrainer AI - 让训练更简单</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
