function showCuttingDetail(orderId) {
    const orders = loadData(STORAGE_KEYS.orders) || [];
    const o = orders.find(x => x.id == orderId);
    if (!o) return;
    const prods = loadData(STORAGE_KEYS.products) || [];
    // 计算下料清单
    let calcItems = [];
    (o.items || []).forEach(it => {
        const prod = prods.find(p => p.name === it.productName && p.categoryId == it.categoryId);
        if (!prod || !prod.formulas || !prod.formulas.length) {
            // 没有公式，显示基本信息
            calcItems.push({
                productName: it.productName,
                spec: `${it.width || 0}×${it.height || 0}`,
                qty: it.quantity,
                rows: [{ name: it.productName, unit: '个', perUse: 1, totalUse: it.quantity, remark: '' }]
            });
        } else {
            // 根据公式计算
            const formulaRows = (prod.formulas || []).map(f => {
                let perUse = 0;
                try {
                    const vars = { '宽': it.width || 0, '高': it.height || 0, '数量': it.quantity };
                    // 支持变量格式: {宽}, {高}, {数量}
                    let expr = (f.formula || f.expression || '').toString();
                    Object.keys(vars).forEach(k => { expr = expr.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]); });
                    perUse = eval(expr) || 0;
                } catch(e) { perUse = 0; }
                const totalUse = perUse * (it.quantity || 1);
                return { name: f.name || '', unit: f.unit || '个', perUse: perUse, totalUse: totalUse, remark: f.remark || '' };
            });
            calcItems.push({
                productName: it.productName,
                spec: `${it.width || 0}×${it.height || 0}`,
                qty: it.quantity,
                rows: formulaRows
            });
        }
    });
    // 合并相同材料
    let mergedRows = {};
    calcItems.forEach(item => {
        item.rows.forEach(r => {
            const key = r.name + '_' + r.unit;
            if (!mergedRows[key]) mergedRows[key] = { name: r.name, unit: r.unit, totalUse: 0, remark: r.remark };
            mergedRows[key].totalUse += r.totalUse;
        });
    });
    let summaryRows = Object.values(mergedRows);
    let detailRows = calcItems.map(item => {
        let subRows = item.rows.map((r, i) => `<tr class="cut-detail-row" data-parent="${item.productName}"><td>${i === 0 ? item.productName : ''}</td><td>${i === 0 ? item.spec : ''}</td><td>${i === 0 ? item.qty : ''}</td><td>${r.name}</td><td><input type="number" value="${r.perUse.toFixed(2)}" class="cut-input" onchange="calcCutTotal(this)"></td><td>${r.unit}</td><td class="cut-total">${r.totalUse.toFixed(2)}</td><td>${escapeHtml(r.remark)}</td></tr>`).join('');
        return subRows;
    }).join('');
    let summaryHtml = summaryRows.map(r => `<tr><td colspan="3"></td><td>${escapeHtml(r.name)}</td><td colspan="2"></td><td>${r.totalUse.toFixed(2)} ${r.unit}</td><td>${escapeHtml(r.remark)}</td></tr>`).join('');
    const html = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px">
        <div><strong>订单号：</strong>${escapeHtml(o.orderNo)}</div>
        <div><strong>客户：</strong>${escapeHtml(o.customerName)}</div>
        <div><strong>地址：</strong>${escapeHtml(o.installAddress || '')}</div>
        <div><strong>备注：</strong>${escapeHtml(o.remark || '')}</div>
    </div>
    <h4>产品下料明细</h4>
    <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="background:#f0f0f0"><th>产品名称</th><th>规格(mm)</th><th>数量</th><th>材料名称</th><th>单件用量</th><th>单位</th><th>总用量</th><th>备注</th></tr></thead>
        <tbody>${detailRows}</tbody>
    </table>
    <h4>材料汇总</h4>
    <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="background:#f0f0f0"><th colspan="3"></th><th>材料名称</th><th colspan="2"></th><th>总用量</th><th>备注</th></tr></thead>
        <tbody>${summaryHtml}</tbody>
    </table>
    <div style="text-align:right;margin-top:15px">
        <button class="btn btn-primary" onclick="printCuttingList('${orderId}')">🖨️ 打印</button>
    </div>`;
    showDynModal('下料单 - ' + o.orderNo, html, '90%');
}
function calcCutTotal(input) {
    const row = input.closest('tr');
    const perUse = parseFloat(input.value) || 0;
    const qty = parseInt(row.querySelector('td:nth-child(3)').textContent) || 1;
    row.querySelector('.cut-total').textContent = (perUse * qty).toFixed(2);
}
function printCuttingList(orderId) {
    const printContent = document.querySelector('.dyn-modal-content')?.innerHTML || '';
    const printWin = window.open('', '_blank');
    printWin.document.write(`<html><head><title>下料单</title><style>body{font-family:SimSun;font-size:12px;padding:20px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #000;padding:5px}th{background:#f0f0f0}</style></head><body>${printContent}</body></html>`);
    printWin.document.close();
    printWin.print();
}

// ==================== 客户管理 ====================
function renderCustomersPage(c) {
    const customers = loadData(STORAGE_KEYS.customers) || [];
    c.innerHTML = `<div class="stat-row">
        <div class="stat-card"><h4>客户总数</h4><div class="num">${customers.length}</div></div>
    </div>
    <div class="card">
        <h3>👥 客户管理</h3>
        <div class="form-grid">
            <div class="form-group"><label class="required">姓名</label><input id="custName" placeholder="客户姓名"></div>
            <div class="form-group"><label class="required">电话</label><input id="custPhone" placeholder="手机号"></div>
            <div class="form-group"><label>地址</label><input id="custAddress" placeholder="地址"></div>
            <div class="form-group"><label>微信</label><input id="custWechat" placeholder="微信号"></div>
            <div class="form-group" style="grid-column:1/-1"><label>备注</label><textarea id="custRemark" rows="2" placeholder="备注"></textarea></div>
        </div>
        <div style="text-align:right;margin-top:10px">
            <button class="btn btn-primary" onclick="saveCustomer()">💾 保存客户</button>
        </div>
    </div>
    <div class="card">
        <h3>客户列表</h3>
        <div class="filter-bar">
            <input id="custKw" placeholder="搜索姓名/电话" style="flex:1;max-width:300px;padding:8px" oninput="refreshCustomerList()">
            <button class="btn btn-success" onclick="exportCustomersExcel()">导出Excel</button>
            <input type="file" id="custFile" style="display:none" accept=".xlsx,.xls" onchange="importCustomersExcel(this)">
            <button class="btn btn-warning" onclick="document.getElementById('custFile').click()">导入Excel</button>
        </div>        </div>
        <div id="custList"></div>
    </div>`;
    window._editingCustId = null;
    refreshCustomerList();
}
function refreshCustomerList() {
    const kw = (document.getElementById('custKw')?.value || '').toLowerCase();
    let list = (loadData(STORAGE_KEYS.customers) || []).filter(c => !kw || (c.name || '').toLowerCase().includes(kw) || (c.phone || '').includes(kw));
    const wrap = document.getElementById('custList');
    if (!wrap) return;
    if (!list.length) { wrap.innerHTML = '<p style="padding:20px;text-align:center;color:#999">暂无客户</p>'; return; }
    let html = '<table><thead><tr><th>#</th><th>姓名</th><th>电话</th><th>地址</th><th>微信</th><th>操作</th></tr></thead><tbody>';
    list.forEach((c, i) => {
        html += `<tr><td>${i+1}</td><td>${escapeHtml(c.name)}</td><td>${escapeHtml(c.phone)}</td><td>${escapeHtml(c.address || '')}</td><td>${escapeHtml(c.wechat || '')}</td>
            <td><button class="btn btn-sm btn-primary" onclick="editCustomer(${c.id})">编辑</button> <button class="btn btn-sm btn-danger" onclick="deleteCustomer(${c.id})">删除</button></td></tr>`;
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;
}
function saveCustomer() {
    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    const address = document.getElementById('custAddress').value.trim();
    const wechat = document.getElementById('custWechat').value.trim();
    const remark = document.getElementById('custRemark').value.trim();
    if (!name) { showToast('请输入客户姓名', 'error'); return; }
    if (!phone) { showToast('请输入电话号码', 'error'); return; }
    let customers = loadData(STORAGE_KEYS.customers) || [];
    if (window._editingCustId) {
        const idx = customers.findIndex(c => c.id == window._editingCustId);
        if (idx > -1) { customers[idx] = { ...customers[idx], name, phone, address, wechat, remark }; }
        window._editingCustId = null;
        document.getElementById('custName').value = '';
        document.getElementById('custPhone').value = '';
        document.getElementById('custAddress').value = '';
        document.getElementById('custWechat').value = '';
        document.getElementById('custRemark').value = '';
        showToast('客户已更新', 'success');
    } else {
        if (customers.find(c => c.phone === phone)) { showToast('该电话已存在', 'error'); return; }
        customers.push({ id: genId(customers), name, phone, address, wechat, remark, createTime: new Date().toISOString() });
        showToast('客户添加成功', 'success');
        document.getElementById('custName').value = '';
        document.getElementById('custPhone').value = '';
        document.getElementById('custAddress').value = '';
        document.getElementById('custWechat').value = '';
        document.getElementById('custRemark').value = '';
    }
    saveData(STORAGE_KEYS.customers, customers);
    refreshCustomerList();
}
function editCustomer(id) {
    const customers = loadData(STORAGE_KEYS.customers) || [];
    const c = customers.find(x => x.id == id);
    if (!c) return;
    window._editingCustId = id;
    document.getElementById('custName').value = c.name || '';
    document.getElementById('custPhone').value = c.phone || '';
    document.getElementById('custAddress').value = c.address || '';
    document.getElementById('custWechat').value = c.wechat || '';
    document.getElementById('custRemark').value = c.remark || '';
    showToast('正在编辑：' + c.name, 'info');
}
function deleteCustomer(id) {
    if (!confirm('确定删除该客户？')) return;
    let customers = loadData(STORAGE_KEYS.customers) || [];
    customers = customers.filter(c => c.id != id);
    saveData(STORAGE_KEYS.customers, customers);
    showToast('客户已删除', 'success');
    refreshCustomerList();
}
function exportCustomersExcel() {
    const customers = loadData(STORAGE_KEYS.customers) || [];
    const rows = [['姓名', '电话', '地址', '微信', '备注']];
    customers.forEach(c => { rows.push([c.name, c.phone, c.address || '', c.wechat || '', c.remark || '']); });
    const wb = XLSX.utils.book_new(); const ws = XLSX.utils.aoa_to_sheet(rows); XLSX.utils.book_append_sheet(wb, ws, '客户列表'); XLSX.writeFile(wb, `客户列表_${new Date().toISOString().slice(0,10)}.xlsx`);
}
function importCustomersExcel(input) {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const arr = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
        if (arr.length < 2) { showToast('文件为空', 'error'); return; }
        let customers = loadData(STORAGE_KEYS.customers) || [];
        let added = 0;
        arr.slice(1).forEach(r => {
            if (!r[0]) return;
            const name = String(r[0]).trim(); const phone = String(r[1] || '').trim();
            if (!name || !phone) return;
            if (!customers.find(c => c.phone === phone)) {
                customers.push({ id: genId(customers), name, phone, address: String(r[2] || '').trim(), wechat: String(r[3] || '').trim(), remark: String(r[4] || '').trim(), createTime: new Date().toISOString() });
                added++;
            }
        });
        saveData(STORAGE_KEYS.customers, customers);
        showToast(`成功导入 ${added} 个客户`, 'success');
        refreshCustomerList();
    };
    reader.readAsText(file); input.value = '';
}

// ==================== 系统设置 ====================
function renderSettingsPage(c) {
    c.innerHTML = `<div class="card">
        <h3>⚙️ 系统设置</h3>
        <div class="form-grid">
            <div class="form-group"><label>店铺名称</label><input id="setShopName" value="${escapeHtml(appSettings.shopName || '')}" placeholder="店铺名称"></div>
            <div class="form-group"><label>联系电话</label><input id="setPhone" value="${escapeHtml(appSettings.phone || '')}" placeholder="电话"></div>
            <div class="form-group"><label>店铺地址</label><input id="setAddress" value="${escapeHtml(appSettings.address || '')}" placeholder="地址"></div>
            <div class="form-group"><label>默认单位</label><input id="setUnit" value="${escapeHtml(appSettings.defaultUnit || '㎡')}" placeholder="默认单位"></div>
            <div class="form-group" style="grid-column:1/-1"><label>Logo图片（URL）</label><input id="setLogo" value="${escapeHtml(appSettings.logoUrl || '')}" placeholder="图片URL"></div>
            <div class="form-group" style="grid-column:1/-1"><label>颜色预设（逗号分隔）</label><input id="setColors" value="${(appSettings.colorPresets || []).join(',')}" placeholder="黑色,白色,灰色"></div>
            <div class="form-group" style="grid-column:1/-1"><label>玻璃样式（逗号分隔）</label><input id="setGlass" value="${(appSettings.glassStyles || []).join(',')}" placeholder="透明,磨砂,LOW-E"></div>
        </div>
        <div style="text-align:right;margin-top:15px">
            <button class="btn btn-primary" onclick="saveSettings()">💾 保存设置</button>
        </div>
    </div>
    <div class="card">
        <h3>📋 数据管理</h3>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn btn-warning" onclick="exportAllData()">📤 导出全部数据</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importAllData(this)">
            <button class="btn btn-success" onclick="document.getElementById('importFile').click()">📥 导入数据</button>
            <button class="btn btn-danger" onclick="clearAllData()">🗑️ 清空所有数据</button>
        </div>
    </div>`;
}
function saveSettings() {
    appSettings.shopName = document.getElementById('setShopName').value.trim();
    appSettings.phone = document.getElementById('setPhone').value.trim();
    appSettings.address = document.getElementById('setAddress').value.trim();
    appSettings.defaultUnit = document.getElementById('setUnit').value.trim() || '㎡';
    appSettings.logoUrl = document.getElementById('setLogo').value.trim();
    appSettings.colorPresets = document.getElementById('setColors').value.split(',').map(s => s.trim()).filter(Boolean);
    appSettings.glassStyles = document.getElementById('setGlass').value.split(',').map(s => s.trim()).filter(Boolean);
    saveData(STORAGE_KEYS.settings, appSettings);
    updateSidebarInfo();
    showToast('设置已保存', 'success');
}
function exportAllData() {
    const data = {
        products: loadData(STORAGE_KEYS.products) || [],
        orders: loadData(STORAGE_KEYS.orders) || [],
        customers: loadData(STORAGE_KEYS.customers) || [],
        purchases: loadData(STORAGE_KEYS.purchases) || [],
        shipments: loadData(STORAGE_KEYS.shipments) || [],
        bills: loadData(STORAGE_KEYS.bills) || [],
        inventoryLogs: loadData(STORAGE_KEYS.inventoryLogs) || [],
        recycleBin: loadData(STORAGE_KEYS.recycleBin) || [],
        settings: appSettings,
        exportTime: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `fyx_backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
    URL.revokeObjectURL(url);
    showToast('数据已导出', 'success');
}
function importAllData(input) {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if (data.products) saveData(STORAGE_KEYS.products, data.products);
            if (data.orders) saveData(STORAGE_KEYS.orders, data.orders);
            if (data.customers) saveData(STORAGE_KEYS.customers, data.customers);
            if (data.purchases) saveData(STORAGE_KEYS.purchases, data.purchases);
            if (data.shipments) saveData(STORAGE_KEYS.shipments, data.shipments);
            if (data.bills) saveData(STORAGE_KEYS.bills, data.bills);
            if (data.inventoryLogs) saveData(STORAGE_KEYS.inventoryLogs, data.inventoryLogs);
            if (data.recycleBin) saveData(STORAGE_KEYS.recycleBin, data.recycleBin);
            if (data.settings) { appSettings = { ...appSettings, ...data.settings }; saveData(STORAGE_KEYS.settings, appSettings); }
            migrateOrderStatuses();
            showToast('数据导入成功，请刷新页面', 'success');
            setTimeout(() => location.reload(), 1500);
        } catch(err) { showToast('导入失败：' + err.message, 'error'); }
    };
    reader.readAsText(file); input.value = '';
}
function clearAllData() {
    if (!confirm('确定清空所有数据？此操作不可恢复！')) return;
    if (!confirm('再次确认：清空所有业务数据？')) return;
    Object.values(STORAGE_KEYS).forEach(key => localStorage.removeItem(key));
    showToast('所有数据已清空', 'success');
    setTimeout(() => location.reload(), 1500);
}

// ==================== 备份恢复 ====================
function renderBackupPage(c) {
    const backups = loadData(STORAGE_KEYS.backup) || [];
    c.innerHTML = `<div class="card">
        <h3>💾 备份与恢复</h3>
        <div class="stat-row">
            <div class="stat-card"><h4>备份记录</h4><div class="num">${backups.length}</div></div>
        </div>
        <div class="filter-bar" style="margin:15px 0">
            <button class="btn btn-primary" onclick="createBackup()">➕ 创建备份</button>
        </div>
        <div id="backupList"></div>
    </div>`;
    refreshBackupList();
}
function refreshBackupList() {
    const backups = loadData(STORAGE_KEYS.backup) || [];
    const wrap = document.getElementById('backupList');
    if (!wrap) return;
    if (!backups.length) { wrap.innerHTML = '<p style="padding:20px;text-align:center;color:#999">暂无备份记录</p>'; return; }
    let html = '<table><thead><tr><th>#</th><th>备份名称</th><th>时间</th><th>操作</th></tr></thead><tbody>';
    backups.slice().reverse().forEach((b, i) => {
        html += `<tr><td>${i+1}</td><td>${escapeHtml(b.name || '备份' + b.id)}</td><td>${b.createTime || ''}</td>
            <td><button class="btn btn-sm btn-success" onclick="restoreBackup(${b.id})">恢复</button> <button class="btn btn-sm btn-danger" onclick="deleteBackup(${b.id})">删除</button></td></tr>`;
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;
}
function createBackup() {
    const name = prompt('请输入备份名称：', '备份_' + new Date().toLocaleString());
    if (!name) return;
    const data = {
        products: loadData(STORAGE_KEYS.products) || [],
        orders: loadData(STORAGE_KEYS.orders) || [],
        customers: loadData(STORAGE_KEYS.customers) || [],
        purchases: loadData(STORAGE_KEYS.purchases) || [],
        shipments: loadData(STORAGE_KEYS.shipments) || [],
        bills: loadData(STORAGE_KEYS.bills) || [],
        inventoryLogs: loadData(STORAGE_KEYS.inventoryLogs) || []
    };
    let backups = loadData(STORAGE_KEYS.backup) || [];
    backups.push({ id: genId(backups), name, data, createTime: new Date().toLocaleString() });
    saveData(STORAGE_KEYS.backup, backups);
    showToast('备份创建成功', 'success');
    refreshBackupList();
}
function restoreBackup(id) {
    if (!confirm('确定恢复此备份？当前数据将被覆盖！')) return;
    const backups = loadData(STORAGE_KEYS.backup) || [];
    const b = backups.find(x => x.id == id);
    if (!b || !b.data) { showToast('备份数据无效', 'error'); return; }
    const d = b.data;
    if (d.products) saveData(STORAGE_KEYS.products, d.products);
    if (d.orders) saveData(STORAGE_KEYS.orders, d.orders);
    if (d.customers) saveData(STORAGE_KEYS.customers, d.customers);
    if (d.purchases) saveData(STORAGE_KEYS.purchases, d.purchases);
    if (d.shipments) saveData(STORAGE_KEYS.shipments, d.shipments);
    if (d.bills) saveData(STORAGE_KEYS.bills, d.bills);
    if (d.inventoryLogs) saveData(STORAGE_KEYS.inventoryLogs, d.inventoryLogs);
    showToast('数据已恢复，请刷新页面', 'success');
    setTimeout(() => location.reload(), 1500);
}
function deleteBackup(id) {
    if (!confirm('确定删除此备份？')) return;
    let backups = loadData(STORAGE_KEYS.backup) || [];
    backups = backups.filter(x => x.id != id);
    saveData(STORAGE_KEYS.backup, backups);
    showToast('备份已删除', 'success');
    refreshBackupList();
}

// ==================== 页面初始化 ====================
document.addEventListener('DOMContentLoaded', () => {
    migrateLegacyData();
    const settings = loadData(STORAGE_KEYS.settings);
    if (settings) appSettings = { ...appSettings, ...settings };
    updateSidebarInfo();
    renderModule('orders');
});
</script>
