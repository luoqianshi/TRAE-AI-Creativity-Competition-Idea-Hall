    <script>
        // ==================== Data Management ====================
        const StorageKeys = {
            PRODUCTS: 'warehouse_products',
            RECORDS: 'warehouse_records'
        };

        let products = [];
        let records = [];
        let selectedProductId = null;

        function loadData() {
            try {
                const p = localStorage.getItem(StorageKeys.PRODUCTS);
                const r = localStorage.getItem(StorageKeys.RECORDS);
                if (p) products = JSON.parse(p);
                if (r) records = JSON.parse(r);
            } catch (e) {
                console.error('加载数据失败:', e);
                products = [];
                records = [];
            }
        }

        function saveData() {
            localStorage.setItem(StorageKeys.PRODUCTS, JSON.stringify(products));
            localStorage.setItem(StorageKeys.RECORDS, JSON.stringify(records));
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        // ==================== UI Utilities ====================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function formatMoney(amount) {
            return '¥' + Number(amount).toFixed(2);
        }

        // ==================== Custom Select Handlers ====================
        function setupCustomSelect(selectId, wrapperId, inputId) {
            const select = document.getElementById(selectId);
            const wrapper = document.getElementById(wrapperId);
            const input = document.getElementById(inputId);

            select.addEventListener('change', () => {
                if (select.value === 'custom') {
                    wrapper.classList.add('show');
                    input.required = true;
                } else {
                    wrapper.classList.remove('show');
                    input.required = false;
                    input.value = '';
                }
            });
        }

        setupCustomSelect('product-spec', 'custom-spec-wrapper', 'custom-spec');
        setupCustomSelect('product-unit', 'custom-unit-wrapper', 'custom-unit');
        setupCustomSelect('product-category', 'custom-category-wrapper', 'custom-category');
        setupCustomSelect('stock-in-unit', 'stock-custom-unit-wrapper', 'stock-custom-unit');
        setupCustomSelect('stock-in-category', 'stock-custom-category-wrapper', 'stock-custom-category');

        // ==================== Update All UI ====================
        function refreshAll() {
            updateDashboard();
            renderProductList();
            renderStockInProducts();
            updateRecentRecords();
        }

        // ==================== Dashboard ====================
        function updateDashboard() {
            const totalProducts = products.length;
            const totalQuantity = products.reduce((sum, p) => sum + p.quantity, 0);
            const totalValue = products.reduce((sum, p) => sum + p.totalValue, 0);
            const categories = new Set(products.map(p => p.category)).size;

            document.getElementById('stat-total-products').textContent = totalProducts;
            document.getElementById('stat-total-quantity').textContent = totalQuantity;
            document.getElementById('stat-total-value').textContent = formatMoney(totalValue);
            document.getElementById('stat-categories').textContent = categories;
        }

        // ==================== Recent Records ====================
        function updateRecentRecords() {
            const recentRecordsEl = document.getElementById('recent-records');
            if (records.length === 0) {
                recentRecordsEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p>暂无入库记录</p>
                    </div>
                `;
                return;
            }

            const recent = records.slice(0, 10);
            recentRecordsEl.innerHTML = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>商品</th>
                                <th>规格</th>
                                <th>数量</th>
                                <th>单价</th>
                                <th>总价</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${recent.map(r => `
                                <tr>
                                    <td>${formatDate(r.createdAt)}</td>
                                    <td><strong>${escapeHtml(r.productName)}</strong></td>
                                    <td>${escapeHtml(r.productSpec)}</td>
                                    <td>${r.quantity} ${escapeHtml(r.unit)}</td>
                                    <td>${formatMoney(r.price)}</td>
                                    <td><span class="badge badge-green">${formatMoney(r.totalAmount)}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function formatDate(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('zh-CN', {
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // ==================== Add Product ====================
        document.getElementById('add-product-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('product-name').value.trim();
            const specSelect = document.getElementById('product-spec');
            const spec = specSelect.value === 'custom'
                ? document.getElementById('custom-spec').value.trim()
                : specSelect.value;
            const categorySelect = document.getElementById('product-category');
            const category = categorySelect.value === 'custom'
                ? document.getElementById('custom-category').value.trim()
                : categorySelect.value;
            const quantity = parseFloat(document.getElementById('product-quantity').value) || 0;
            const unitSelect = document.getElementById('product-unit');
            const unit = unitSelect.value === 'custom'
                ? document.getElementById('custom-unit').value.trim()
                : unitSelect.value;
            const price = parseFloat(document.getElementById('product-price').value) || 0;

            if (!name || !spec || !category || !unit) {
                showToast('请填写所有必填项', 'error');
                return;
            }

            if (specSelect.value === 'custom' && !spec) {
                showToast('请输入自定义规格', 'error');
                return;
            }

            if (categorySelect.value === 'custom' && !category) {
                showToast('请输入自定义类别', 'error');
                return;
            }

            if (unitSelect.value === 'custom' && !unit) {
                showToast('请输入自定义单位', 'error');
                return;
            }

            const product = {
                id: generateId(),
                name,
                spec,
                category,
                quantity,
                unit,
                price,
                totalValue: quantity * price,
                createdAt: new Date().toISOString()
            };

            products.push(product);

            if (quantity > 0) {
                records.unshift({
                    id: generateId(),
                    productId: product.id,
                    productName: product.name,
                    productSpec: product.spec,
                    quantity,
                    unit,
                    price,
                    totalAmount: quantity * price,
                    category,
                    type: 'initial',
                    createdAt: new Date().toISOString()
                });
            }

            saveData();
            showToast('商品添加成功！');
            document.getElementById('add-product-form').reset();
            document.querySelectorAll('.custom-input-wrapper').forEach(w => w.classList.remove('show'));
            refreshAll();
        });

        // ==================== Product List ====================
        function renderProductList(searchTerm = '') {
            const tbody = document.getElementById('product-table-body');
            const emptyState = document.getElementById('product-list-empty');
            const table = document.getElementById('product-table');

            let filtered = products;
            if (searchTerm.trim()) {
                const term = searchTerm.toLowerCase();
                filtered = products.filter(p =>
                    p.name.toLowerCase().includes(term) ||
                    p.spec.toLowerCase().includes(term) ||
                    p.category.toLowerCase().includes(term)
                );
            }

            if (filtered.length === 0) {
                tbody.innerHTML = '';
                table.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            table.classList.remove('hidden');
            emptyState.classList.add('hidden');

            tbody.innerHTML = filtered.map(p => `
                <tr>
                    <td><strong>${escapeHtml(p.name)}</strong></td>
                    <td><span class="badge badge-gray">${escapeHtml(p.spec)}</span></td>
                    <td><span class="badge badge-blue">${escapeHtml(p.category)}</span></td>
                    <td><strong>${p.quantity}</strong></td>
                    <td>${escapeHtml(p.unit)}</td>
                    <td>${formatMoney(p.price)}</td>
                    <td><span class="badge badge-green">${formatMoney(p.totalValue)}</span></td>
                </tr>
            `).join('');
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            renderProductList(e.target.value);
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            document.getElementById('search-input').value = '';
            renderProductList();
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== Stock In ====================
        function renderStockInProducts(searchTerm = '') {
            const grid = document.getElementById('stock-product-grid');

            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1; padding: 2rem;">
                        <div class="empty-state-icon">📭</div>
                        <p>暂无商品，请先添加商品</p>
                    </div>
                `;
                return;
            }

            let filtered = products;
            if (searchTerm.trim()) {
                const term = searchTerm.toLowerCase();
                filtered = products.filter(p =>
                    p.name.toLowerCase().includes(term) ||
                    p.spec.toLowerCase().includes(term)
                );
            }

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1; padding: 2rem;">
                        <div class="empty-state-icon">🔍</div>
                        <p>未找到匹配的商品</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="product-select-card ${selectedProductId === p.id ? 'selected' : ''}" data-id="${p.id}">
                    <div class="product-info">
                        <h4>${escapeHtml(p.name)}</h4>
                        <p>规格: ${escapeHtml(p.spec)} | 库存: ${p.quantity} ${escapeHtml(p.unit)}</p>
                        <div class="product-meta">
                            <span class="badge badge-blue">${escapeHtml(p.category)}</span>
                            <span class="badge badge-gray">${formatMoney(p.price)}/${escapeHtml(p.unit)}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            grid.querySelectorAll('.product-select-card').forEach(card => {
                card.addEventListener('click', () => {
                    selectedProductId = card.dataset.id;
                    renderStockInProducts(document.getElementById('stock-search-input').value);
                    showStockInForm(selectedProductId);
                });
            });
        }

        function showStockInForm(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            document.getElementById('stock-product-name').value = product.name;
            document.getElementById('stock-product-spec').value = product.spec;
            document.getElementById('stock-step1').style.display = 'none';
            document.getElementById('stock-step2').style.display = 'block';
            document.getElementById('stock-in-quantity').value = '';
            document.getElementById('stock-in-price').value = '';
            document.getElementById('stock-in-unit').value = '';
            document.getElementById('stock-in-category').value = product.category || '';
            document.getElementById('stock-custom-unit-wrapper').classList.remove('show');
            document.getElementById('stock-custom-category-wrapper').classList.remove('show');
            updateTotalAmount();
        }

        document.getElementById('stock-search-input').addEventListener('input', (e) => {
            renderStockInProducts(e.target.value);
        });

        document.getElementById('cancel-stock-in').addEventListener('click', () => {
            selectedProductId = null;
            document.getElementById('stock-step1').style.display = 'block';
            document.getElementById('stock-step2').style.display = 'none';
            document.getElementById('stock-in-form').reset();
            renderStockInProducts();
        });

        // Calculate total amount
        function updateTotalAmount() {
            const quantity = parseFloat(document.getElementById('stock-in-quantity').value) || 0;
            const price = parseFloat(document.getElementById('stock-in-price').value) || 0;
            const total = quantity * price;
            document.getElementById('stock-total-amount').textContent = formatMoney(total);
        }

        document.getElementById('stock-in-quantity').addEventListener('input', updateTotalAmount);
        document.getElementById('stock-in-price').addEventListener('input', updateTotalAmount);

        document.getElementById('stock-in-form').addEventListener('submit', (e) => {
            e.preventDefault();

            if (!selectedProductId) {
                showToast('请先选择商品', 'error');
                return;
            }

            const product = products.find(p => p.id === selectedProductId);
            if (!product) {
                showToast('商品不存在', 'error');
                return;
            }

            const quantity = parseFloat(document.getElementById('stock-in-quantity').value);
            const price = parseFloat(document.getElementById('stock-in-price').value);
            const unitSelect = document.getElementById('stock-in-unit');
            const unit = unitSelect.value === 'custom'
                ? document.getElementById('stock-custom-unit').value.trim()
                : unitSelect.value;
            const categorySelect = document.getElementById('stock-in-category');
            const category = categorySelect.value === 'custom'
                ? document.getElementById('stock-custom-category').value.trim()
                : categorySelect.value || product.category;

            if (!quantity || quantity <= 0) {
                showToast('请输入有效的入库数量', 'error');
                return;
            }

            if (price === undefined || price === null || isNaN(price) || price < 0) {
                showToast('请输入有效的入库单价', 'error');
                return;
            }

            if (!unit) {
                showToast('请选择单位', 'error');
                return;
            }

            if (unitSelect.value === 'custom' && !unit) {
                showToast('请输入自定义单位', 'error');
                return;
            }

            const totalAmount = quantity * price;
            product.quantity += quantity;
            const oldValue = (product.quantity - quantity) * product.price;
            const newValue = totalAmount;
            product.price = (oldValue + newValue) / product.quantity;
            product.totalValue = product.quantity * product.price;
            if (category) product.category = category;

            records.unshift({
                id: generateId(),
                productId: product.id,
                productName: product.name,
                productSpec: product.spec,
                quantity,
                unit,
                price,
                totalAmount,
                category,
                type: 'stock_in',
                createdAt: new Date().toISOString()
            });

            saveData();
            showToast(`成功入库 ${quantity} ${unit} ${product.name}，总价 ${formatMoney(totalAmount)}`);

            selectedProductId = null;
            document.getElementById('stock-step1').style.display = 'block';
            document.getElementById('stock-step2').style.display = 'none';
            document.getElementById('stock-in-form').reset();
            document.querySelectorAll('#stock-step2 .custom-input-wrapper').forEach(w => w.classList.remove('show'));
            refreshAll();
        });

        // ==================== Initialization ====================
        loadData();
        refreshAll();
    </script>
</body>
</html>
