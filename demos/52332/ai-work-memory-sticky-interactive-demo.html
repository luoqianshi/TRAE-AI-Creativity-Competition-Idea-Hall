<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 工作记忆便签 - 交互式创意展示</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #657184;
      --line: #dfe4ea;
      --blue: #2563eb;
      --green: #138a5b;
      --amber: #b7791f;
      --red: #c2410c;
      --shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.55;
    }

    header {
      background: #0f172a;
      color: #fff;
      padding: 30px 24px 26px;
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      gap: 24px;
      align-items: end;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      max-width: 760px;
      color: #cbd5e1;
      font-size: 16px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .badge {
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      color: #e2e8f0;
      font-size: 13px;
      background: rgba(255,255,255,.08);
    }

    main {
      max-width: 1180px;
      margin: 24px auto 48px;
      padding: 0 24px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .tabs {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .tab {
      border: 0;
      border-right: 1px solid var(--line);
      background: #fff;
      padding: 9px 13px;
      cursor: pointer;
      color: var(--muted);
      font-size: 14px;
    }

    .tab:last-child { border-right: 0; }
    .tab.active { color: #fff; background: var(--blue); }

    .primary {
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 650;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.22);
    }

    .secondary {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: 0.95fr 1.25fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
    }

    .source-list {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .source {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfe;
      transition: border-color .15s, transform .15s, background .15s;
    }

    .source.active {
      border-color: rgba(37, 99, 235, .55);
      background: #f0f6ff;
      transform: translateY(-1px);
    }

    .source-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 10px;
    }

    .type {
      font-size: 12px;
      color: #fff;
      border-radius: 999px;
      padding: 3px 8px;
      background: #475569;
      white-space: nowrap;
    }

    .type.note { background: var(--blue); }
    .type.calendar { background: var(--green); }
    .type.doc { background: var(--amber); }
    .type.link { background: var(--red); }

    .source-title {
      font-weight: 700;
      font-size: 15px;
    }

    .source p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .result {
      padding: 18px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfe;
    }

    .metric strong {
      display: block;
      font-size: 24px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .metric span {
      font-size: 13px;
      color: var(--muted);
    }

    .section {
      border-top: 1px solid var(--line);
      padding-top: 16px;
      margin-top: 16px;
    }

    .section h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
      min-height: 88px;
    }

    .item b {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .item small {
      color: var(--muted);
      display: block;
      margin-top: 6px;
    }

    .timeline {
      display: grid;
      gap: 8px;
    }

    .time-row {
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 12px;
      align-items: start;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
    }

    .time {
      color: var(--blue);
      font-weight: 700;
      white-space: nowrap;
    }

    .memory-path {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .step {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      background: #fbfcfe;
      font-size: 13px;
      color: var(--muted);
    }

    .step.active {
      color: #fff;
      background: var(--green);
      border-color: var(--green);
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 42px 20px;
    }

    footer {
      max-width: 1180px;
      margin: 0 auto 36px;
      padding: 0 24px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .header-inner, .grid { grid-template-columns: 1fr; }
      .badges { justify-content: flex-start; }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .cards { grid-template-columns: 1fr; }
      .memory-path { grid-template-columns: 1fr; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .tabs { width: 100%; }
      .tab { flex: 1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>AI 工作记忆便签</h1>
        <p class="lead">把分散的便签、日程、会议、文档和链接整理成可执行的每日工作记忆，让 AI 不只做一次性总结，而是持续理解、追踪和沉淀你的学习工作上下文。</p>
      </div>
      <div class="badges">
        <span class="badge">学习工作</span>
        <span class="badge">本地优先</span>
        <span class="badge">每日整理</span>
        <span class="badge">知识沉淀</span>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="tabs" aria-label="场景选择">
        <button class="tab active" data-scenario="work">工作日</button>
        <button class="tab" data-scenario="study">学习复盘</button>
        <button class="tab" data-scenario="startup">创业项目</button>
      </div>
      <div>
        <button class="secondary" id="resetBtn">重置输入</button>
        <button class="primary" id="organizeBtn">整理今日工作记忆</button>
      </div>
    </div>

    <div class="grid">
      <section class="panel">
        <div class="panel-head">
          <h2>分散来源</h2>
          <span class="hint">点击卡片可选择/取消输入</span>
        </div>
        <div class="source-list" id="sourceList"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>AI 整理结果</h2>
          <span class="hint" id="resultHint">等待整理</span>
        </div>
        <div class="result" id="result">
          <div class="empty">选择左侧资料后，点击“整理今日工作记忆”。</div>
        </div>
      </section>
    </div>
  </main>

  <footer>
    展示说明：这是创意方案的交互式原型，用模拟数据展示“资料导入、归一化、生成待办、生成日程、知识沉淀、来源追溯”的核心体验。
  </footer>

  <script>
    const scenarios = {
      work: {
        label: "工作日",
        sources: [
          { id: "n1", type: "note", typeLabel: "便签", title: "产品想法", text: "今天要把 AI 便签改成工作记忆助手，重点是能读日程、会议和本地资料。" },
          { id: "c1", type: "calendar", typeLabel: "日程", title: "10:30 项目评审", text: "需要确认演示材料、提交文案和技术边界。" },
          { id: "d1", type: "doc", typeLabel: "文档", title: "会议纪要", text: "评审建议：默认不扫描全盘，只读取用户配置的固定资料目录。" },
          { id: "l1", type: "link", typeLabel: "链接", title: "行业文章", text: "AI PC 的价值在于本地隐私、低延迟和长期上下文。" }
        ],
        output: {
          focus: "完成 AI 工作记忆便签的参赛方案表达，并准备可上传的 HTML 展示页。",
          tasks: [
            ["补齐提交正文", "整理创意名称、目标用户、痛点和价值说明。", "来源：产品想法 / 会议纪要"],
            ["完善演示材料", "用交互页展示资料导入、整理、知识沉淀和来源追溯。", "来源：项目评审"],
            ["确认隐私边界", "说明只读取用户明确配置的目录和授权来源。", "来源：会议纪要"]
          ],
          schedule: [
            ["10:30", "项目评审：确认参赛方向和展示材料"],
            ["15:00", "检查 HTML 交互原型和提交文案"],
            ["18:00", "复盘今天沉淀的产品定位"]
          ],
          knowledge: [
            ["产品定位", "AI 工作记忆便签不是单一便签 App，而是可迁移的本地工作记忆层。"],
            ["隐私原则", "默认只读取用户明确授权的资料来源，拒绝全盘扫描。"]
          ]
        }
      },
      study: {
        label: "学习复盘",
        sources: [
          { id: "n2", type: "note", typeLabel: "课堂便签", title: "论文阅读", text: "今天读了本地 RAG 和知识图谱相关内容，需要沉淀成复习卡片。" },
          { id: "c2", type: "calendar", typeLabel: "学习计划", title: "20:00 复习", text: "复习昨天的机器学习笔记，整理不懂的问题。" },
          { id: "d2", type: "doc", typeLabel: "Markdown", title: "课程笔记", text: "向量检索适合语义召回，结构化结果适合后续复盘和追踪。" },
          { id: "l2", type: "link", typeLabel: "网页", title: "技术博客", text: "文章介绍了如何把碎片知识整理成长期可用的个人知识库。" }
        ],
        output: {
          focus: "把今天的阅读、课程笔记和复习计划整理成学习记忆。",
          tasks: [
            ["整理复习卡片", "把 RAG、向量检索、结构化结果三个概念做成卡片。", "来源：论文阅读 / 课程笔记"],
            ["记录疑问", "列出向量检索和关键词检索的差异，明天继续查资料。", "来源：课程笔记"],
            ["晚间复习", "20:00 前打开复习材料并补充错题。", "来源：学习计划"]
          ],
          schedule: [
            ["20:00", "复习机器学习笔记"],
            ["21:30", "整理今日学习记忆"]
          ],
          knowledge: [
            ["学习方法", "碎片笔记需要转化成可复习、可追踪、可再次召回的结构化知识。"],
            ["技术理解", "语义召回解决找得到，结构化输出解决用得上。"]
          ]
        }
      },
      startup: {
        label: "创业项目",
        sources: [
          { id: "n3", type: "note", typeLabel: "灵感", title: "客户反馈", text: "客户说团队资料太分散，新员工很难快速知道项目进展。" },
          { id: "c3", type: "calendar", typeLabel: "会议", title: "14:00 投资人沟通", text: "需要准备产品价值、用户痛点和商业化路径。" },
          { id: "d3", type: "doc", typeLabel: "BP", title: "商业计划", text: "产品可以作为个人知识管理、团队协作和 AI PC 的本地记忆层。" },
          { id: "l3", type: "link", typeLabel: "竞品", title: "知识库产品分析", text: "传统知识库重存储，AI 工作记忆重整理、追踪和行动。" }
        ],
        output: {
          focus: "围绕 AI 工作记忆便签准备创业项目沟通材料。",
          tasks: [
            ["提炼客户痛点", "说明资料分散、新人上手慢、历史决策难追踪。", "来源：客户反馈"],
            ["准备投资人材料", "突出本地工作记忆层、AI PC 场景和办公套件适配。", "来源：投资人沟通 / BP"],
            ["补竞品差异", "强调从资料存储升级到自动整理、追踪和写回。", "来源：竞品分析"]
          ],
          schedule: [
            ["14:00", "投资人沟通：产品价值和商业化路径"],
            ["17:30", "复盘沟通反馈并更新 BP"]
          ],
          knowledge: [
            ["商业价值", "AI 工作记忆可以作为办公套件和智能体平台的上下文基础设施。"],
            ["差异化", "传统知识库保存资料，工作记忆系统负责把资料变成行动和长期上下文。"]
          ]
        }
      }
    };

    let currentScenario = "work";
    let selected = new Set();

    const sourceList = document.getElementById("sourceList");
    const result = document.getElementById("result");
    const resultHint = document.getElementById("resultHint");

    function renderSources() {
      const data = scenarios[currentScenario];
      sourceList.innerHTML = "";
      data.sources.forEach((source) => {
        if (!selected.size) selected.add(source.id);
        const node = document.createElement("article");
        node.className = "source" + (selected.has(source.id) ? " active" : "");
        node.tabIndex = 0;
        node.innerHTML = `
          <div class="source-top">
            <div class="source-title">${source.title}</div>
            <span class="type ${source.type}">${source.typeLabel}</span>
          </div>
          <p>${source.text}</p>
        `;
        node.addEventListener("click", () => toggleSource(source.id));
        node.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleSource(source.id);
          }
        });
        sourceList.appendChild(node);
      });
    }

    function toggleSource(id) {
      if (selected.has(id)) {
        selected.delete(id);
      } else {
        selected.add(id);
      }
      renderSources();
      resultHint.textContent = selected.size ? `已选择 ${selected.size} 条来源` : "未选择来源";
    }

    function organize() {
      const data = scenarios[currentScenario];
      if (!selected.size) {
        result.innerHTML = `<div class="empty">请至少选择一条来源。</div>`;
        resultHint.textContent = "需要输入来源";
        return;
      }
      const selectedSources = data.sources.filter((item) => selected.has(item.id));
      resultHint.textContent = `${data.label}已整理`;
      result.innerHTML = `
        <div class="summary">
          <div class="metric"><strong>${selectedSources.length}</strong><span>已导入来源</span></div>
          <div class="metric"><strong>${data.output.tasks.length}</strong><span>今日待办</span></div>
          <div class="metric"><strong>${data.output.schedule.length}</strong><span>日程事件</span></div>
          <div class="metric"><strong>${data.output.knowledge.length}</strong><span>知识沉淀</span></div>
        </div>

        <div class="section">
          <h3>今日重点</h3>
          <div class="item"><b>${data.output.focus}</b><small>根据已选择来源自动归纳</small></div>
        </div>

        <div class="section">
          <h3>今日待办</h3>
          <div class="cards">
            ${data.output.tasks.map((task) => `
              <div class="item">
                <b>${task[0]}</b>
                <div>${task[1]}</div>
                <small>${task[2]}</small>
              </div>
            `).join("")}
          </div>
        </div>

        <div class="section">
          <h3>今日日程</h3>
          <div class="timeline">
            ${data.output.schedule.map((row) => `
              <div class="time-row">
                <div class="time">${row[0]}</div>
                <div>${row[1]}</div>
              </div>
            `).join("")}
          </div>
        </div>

        <div class="section">
          <h3>知识沉淀</h3>
          <div class="cards">
            ${data.output.knowledge.map((item) => `
              <div class="item">
                <b>${item[0]}</b>
                <div>${item[1]}</div>
              </div>
            `).join("")}
          </div>
        </div>

        <div class="section">
          <h3>工作记忆流程</h3>
          <div class="memory-path">
            <div class="step active">显式授权来源</div>
            <div class="step active">本地导入</div>
            <div class="step active">去重召回</div>
            <div class="step active">AI 结构化整理</div>
            <div class="step active">写回每日记忆</div>
          </div>
        </div>
      `;
    }

    function switchScenario(name) {
      currentScenario = name;
      selected = new Set(scenarios[name].sources.map((source) => source.id));
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.classList.toggle("active", tab.dataset.scenario === name);
      });
      renderSources();
      result.innerHTML = `<div class="empty">已切换到“${scenarios[name].label}”场景，点击“整理今日工作记忆”查看结果。</div>`;
      resultHint.textContent = "等待整理";
    }

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => switchScenario(tab.dataset.scenario));
    });

    document.getElementById("organizeBtn").addEventListener("click", organize);
    document.getElementById("resetBtn").addEventListener("click", () => switchScenario(currentScenario));

    switchScenario("work");
  </script>
</body>
</html>
