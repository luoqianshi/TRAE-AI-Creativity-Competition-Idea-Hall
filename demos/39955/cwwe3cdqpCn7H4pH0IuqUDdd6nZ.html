<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI小说氛围音乐同步器 | AI Novel Atmosphere Music Synchronizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        /* ===== 基础样式与CSS变量 ===== */
        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #12121f;
            --bg-tertiary: #1a1a2e;
            --text-primary: #e8e6e3;
            --text-secondary: #a0a0b0;
            --accent-tension: #ff4757;
            --accent-warm: #ffa502;
            --accent-sad: #70a1ff;
            --accent-hot: #ff6b81;
            --accent-mystery: #a55eea;
            --accent-peace: #2ed573;
            --glow-intensity: 0.3;
            --transition-speed: 0.5s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== 粒子背景效果 ===== */
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.6;
            transition: opacity var(--transition-speed) ease;
        }

        /* ===== 主布局 ===== */
        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ===== 左侧小说文本区域 ===== */
        .novel-section {
            flex: 1;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .novel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .novel-title {
            font-family: 'ZCOOL XiaoWei', cursive;
            font-size: 1.8rem;
            background: linear-gradient(90deg, var(--accent-mystery), var(--accent-warm));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(165, 94, 234, 0.3);
        }

        .novel-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: var(--bg-tertiary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Serif SC', serif;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .control-btn.active {
            background: linear-gradient(135deg, var(--accent-mystery), var(--accent-sad));
            color: white;
            border-color: transparent;
        }

        .novel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            line-height: 1.8;
            font-size: 1.1rem;
            scroll-behavior: smooth;
            position: relative;
        }

        .novel-content::-webkit-scrollbar {
            width: 6px;
        }

        .novel-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .novel-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .novel-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .novel-paragraph {
            margin-bottom: 20px;
            text-indent: 2em;
            transition: all var(--transition-speed) ease;
        }

        .novel-paragraph.highlight {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid var(--accent-mystery);
            padding-left: 15px;
            margin-left: -15px;
            border-radius: 0 4px 4px 0;
        }

        .page-indicator {
            text-align: center;
            margin-top: 15px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* ===== 右侧控制面板 ===== */
        .control-panel {
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 情绪分析卡片 */
        .emotion-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all var(--transition-speed) ease;
        }

        .card-title {
            font-family: 'ZCOOL XiaoWei', cursive;
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(to bottom, var(--accent-mystery), var(--accent-sad));
            border-radius: 2px;
        }

        .emotion-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .emotion-tag {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .emotion-tag::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .emotion-tag:hover::before {
            left: 100%;
        }

        .emotion-tag.tension {
            background: rgba(255, 71, 87, 0.2);
            color: var(--accent-tension);
            border: 1px solid rgba(255, 71, 87, 0.3);
        }

        .emotion-tag.warm {
            background: rgba(255, 165, 2, 0.2);
            color: var(--accent-warm);
            border: 1px solid rgba(255, 165, 2, 0.3);
        }

        .emotion-tag.sad {
            background: rgba(112, 161, 255, 0.2);
            color: var(--accent-sad);
            border: 1px solid rgba(112, 161, 255, 0.3);
        }

        .emotion-tag.hot {
            background: rgba(255, 107, 129, 0.2);
            color: var(--accent-hot);
            border: 1px solid rgba(255, 107, 129, 0.3);
        }

        .emotion-tag.mystery {
            background: rgba(165, 94, 234, 0.2);
            color: var(--accent-mystery);
            border: 1px solid rgba(165, 94, 234, 0.3);
        }

        .emotion-tag.peace {
            background: rgba(46, 213, 115, 0.2);
            color: var(--accent-peace);
            border: 1px solid rgba(46, 213, 115, 0.3);
        }

        .emotion-tag.active {
            transform: scale(1.05);
            box-shadow: 0 0 15px currentColor;
        }

        .emotion-confidence {
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
        }

        .confidence-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .confidence-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-mystery), var(--accent-sad));
            border-radius: 3px;
            transition: width var(--transition-speed) ease;
            width: 0%;
        }

        /* 音乐播放器 */
        .music-player {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .album-art {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-primary));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .track-info {
            flex: 1;
        }

        .track-title {
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .track-artist {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .player-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .player-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1);
        }

        .player-btn.play-btn {
            background: linear-gradient(135deg, var(--accent-mystery), var(--accent-sad));
            color: white;
            width: 60px;
            height: 60px;
            font-size: 1.8rem;
        }

        .player-btn.play-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 0 20px rgba(165, 94, 234, 0.5);
        }

        .progress-container {
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-mystery), var(--accent-sad));
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-handle {
            position: absolute;
            top: 50%;
            left: 0%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .progress-bar:hover .progress-handle {
            opacity: 1;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .volume-icon {
            color: var(--text-secondary);
            cursor: pointer;
        }

        .volume-slider {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
        }

        /* 氛围效果控制 */
        .atmosphere-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .atmosphere-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .atmosphere-option {
            background: var(--bg-tertiary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .atmosphere-option:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .atmosphere-option.active {
            border-color: var(--accent-mystery);
            background: rgba(165, 94, 234, 0.1);
        }

        .atmosphere-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .atmosphere-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .intensity-control {
            margin-top: 15px;
        }

        .intensity-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .intensity-slider {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
        }

        .intensity-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, var(--accent-mystery), var(--accent-sad));
            border-radius: 50%;
            cursor: pointer;
        }

        /* ===== 响应式设计 ===== */
        @media (max-width: 1200px) {
            .container {
                flex-direction: column;
                padding: 15px;
            }

            .control-panel {
                width: 100%;
            }

            .novel-section {
                min-height: 60vh;
            }
        }

        @media (max-width: 768px) {
            .novel-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .novel-controls {
                justify-content: center;
            }

            .novel-content {
                padding: 15px;
                font-size: 1rem;
            }

            .emotion-tags {
                justify-content: center;
            }

            .atmosphere-options {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
                gap: 15px;
            }

            .novel-section,
            .emotion-card,
            .music-player,
            .atmosphere-card {
                padding: 20px;
            }

            .novel-title {
                font-size: 1.5rem;
            }

            .card-title {
                font-size: 1.1rem;
            }

            .atmosphere-options {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ===== 动画效果 ===== */
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 5px currentColor;
            }
            50% {
                box-shadow: 0 0 20px currentColor;
            }
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

        .pulsing {
            animation: pulse 2s ease-in-out infinite;
        }

        .glowing {
            animation: glow 2s ease-in-out infinite;
        }

        /* ===== 加载状态 ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--accent-mystery);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* ===== 特殊效果 ===== */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            opacity: 0.3;
            transition: background var(--transition-speed) ease;
        }

        .emotion-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent-mystery);
            box-shadow: 0 0 20px var(--accent-mystery);
            z-index: 100;
            transition: all var(--transition-speed) ease;
        }

        /* ===== 工具提示 ===== */
        .tooltip {
            position: relative;
        }

        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .tooltip:hover::after {
            opacity: 1;
            visibility: visible;
            bottom: calc(100% + 5px);
        }

        /* ===== 选择小说片段 ===== */
        .novel-selector {
            margin-bottom: 20px;
        }

        .selector-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .novel-select {
            width: 100%;
            padding: 10px 15px;
            background: var(--bg-tertiary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: 'Noto Serif SC', serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .novel-select:hover {
            border-color: var(--accent-mystery);
        }

        .novel-select:focus {
            outline: none;
            border-color: var(--accent-mystery);
            box-shadow: 0 0 10px rgba(165, 94, 234, 0.3);
        }

        .novel-select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <!-- 加载覆盖层 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在初始化AI小说氛围音乐同步器...</div>
    </div>

    <!-- 背景渐变 -->
    <div class="bg-gradient" id="bgGradient"></div>

    <!-- 粒子背景 -->
    <div id="particles-js"></div>

    <!-- 情绪指示器 -->
    <div class="emotion-indicator" id="emotionIndicator"></div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 左侧小说文本区域 -->
        <section class="novel-section">
            <div class="novel-header">
                <h1 class="novel-title">AI小说氛围音乐同步器</h1>
                <div class="novel-controls">
                    <button class="control-btn" id="autoScrollBtn" data-tooltip="自动滚动">自动滚动</button>
                    <button class="control-btn" id="prevPageBtn" data-tooltip="上一页">上一页</button>
                    <button class="control-btn" id="nextPageBtn" data-tooltip="下一页">下一页</button>
                </div>
            </div>

            <!-- 小说选择器 -->
            <div class="novel-selector">
                <label class="selector-label" for="novelSelect">选择小说片段：</label>
                <select class="novel-select" id="novelSelect">
                    <option value="tension">紧张悬疑片段</option>
                    <option value="warm">温馨感人片段</option>
                    <option value="sad">悲伤离别片段</option>
                    <option value="hot">热血战斗片段</option>
                    <option value="mystery">神秘奇幻片段</option>
                </select>
            </div>

            <!-- 小说内容 -->
            <div class="novel-content" id="novelContent">
                <!-- 内容将通过JavaScript动态加载 -->
            </div>

            <div class="page-indicator" id="pageIndicator">第 1 页 / 共 1 页</div>
        </section>

        <!-- 右侧控制面板 -->
        <aside class="control-panel">
            <!-- 情绪分析卡片 -->
            <div class="emotion-card">
                <h2 class="card-title">AI情绪分析</h2>
                <div class="emotion-tags" id="emotionTags">
                    <span class="emotion-tag tension" data-emotion="tension">紧张</span>
                    <span class="emotion-tag warm" data-emotion="warm">温馨</span>
                    <span class="emotion-tag sad" data-emotion="sad">悲伤</span>
                    <span class="emotion-tag hot" data-emotion="hot">热血</span>
                    <span class="emotion-tag mystery" data-emotion="mystery">神秘</span>
                    <span class="emotion-tag peace" data-emotion="peace">平静</span>
                </div>
                <div class="emotion-confidence">
                    <div class="confidence-header">
                        <span>情绪置信度</span>
                        <span id="confidenceValue">0%</span>
                    </div>
                    <div class="confidence-bar">
                        <div class="confidence-fill" id="confidenceFill"></div>
                    </div>
                </div>
            </div>

            <!-- 音乐播放器 -->
            <div class="music-player">
                <h2 class="card-title">氛围音乐</h2>
                <div class="player-info">
                    <div class="album-art" id="albumArt">🎵</div>
                    <div class="track-info">
                        <div class="track-title" id="trackTitle">等待选择...</div>
                        <div class="track-artist" id="trackArtist">AI生成音乐</div>
                    </div>
                </div>
                <div class="player-controls">
                    <button class="player-btn" id="prevTrackBtn">⏮</button>
                    <button class="player-btn play-btn" id="playPauseBtn">▶</button>

            sad: { keywords: ["悲伤", "眼泪", "离别", "离开", "心碎", "痛苦", "失去", "告别", "孤独", "思念", "遗憾", "无奈", "信", "车站"], weight: 1.3 },
            hot: { keywords: ["热血", "战斗", "力量", "胜利", "挑战", "勇气", "拼搏", "奋斗", "燃烧", "沸腾", "冠军", "巅峰", "拳头", "吼"], weight: 1.4 },

        // ===== 应用状态 =====
        const state = {

        // ===== 初始化函数 =====
        function init() {
            // 隐藏加载界面
            setTimeout(() => {
                elements.loadingOverlay.style.opacity = "0";
                setTimeout(() => {
                    elements.loadingOverlay.style.display = "none";
                }, 500);
            }, 1500);

            // 初始化音频上下文
            initAudioContext();

            // 加载默认小说
            loadNovel(state.currentNovel);

            // 初始化粒子系统
            initParticleSystem();

            // 绑定事件监听器
            bindEventListeners();

            // 初始化情绪分析
            analyzeCurrentEmotion();

            // 开始动画循环
            animate();
        }

        // ===== 音频初始化 =====
        function initAudioContext() {
            try {
                state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // 创建分析器
                state.analyser = state.audioContext.createAnalyser();
                state.analyser.fftSize = 256;
                
                // 创建主音量节点
                state.gainNode = state.audioContext.createGain();
                state.gainNode.connect(state.analyser);
                state.analyser.connect(state.audioContext.destination);
                
                state.gainNode.gain.value = state.volume / 100;
                
            } catch (error) {
                console.error("音频初始化失败:", error);
            }
        }

        // ===== 小说加载 =====
        function loadNovel(novelKey) {
            state.currentNovel = novelKey;
            state.currentPage = 0;
            
            const novel = novelData[novelKey];
            const totalPages = Math.ceil(novel.content.length / state.pagesPerView);
            
            // 更新页面指示器
            updatePageIndicator(totalPages);
            
            // 渲染当前页内容
            renderCurrentPage();
            
            // 分析情绪
            analyzeCurrentEmotion();
            
            // 更新音乐
            updateMusic(novel.primaryEmotion);
            
            // 更新视觉氛围
            updateVisualAtmosphere(novel.primaryEmotion);
        }

        // ===== 渲染页面 =====
        function renderCurrentPage() {
            const novel = novelData[state.currentNovel];
            const startIndex = state.currentPage * state.pagesPerView;
            const endIndex = Math.min(startIndex + state.pagesPerView, novel.content.length);
            
            let html = "";
            for (let i = startIndex; i < endIndex; i++) {
                const paragraph = novel.content[i];
                const isHighlight = i === startIndex; // 高亮第一段
                html += `<p class="novel-paragraph ${isHighlight ? 'highlight' : ''}">${paragraph}</p>`;
            }
            
            elements.novelContent.innerHTML = html;
            
            // 滚动到顶部
            elements.novelContent.scrollTop = 0;
        }

        // ===== 页面导航 =====
        function updatePageIndicator(totalPages) {
            elements.pageIndicator.textContent = `第 ${state.currentPage + 1} 页 / 共 ${totalPages} 页`;
        }

        function goToPage(pageIndex) {
            const novel = novelData[state.currentNovel];
            const totalPages = Math.ceil(novel.content.length / state.pagesPerView);
            
            if (pageIndex >= 0 && pageIndex < totalPages) {
                state.currentPage = pageIndex;
                renderCurrentPage();
                updatePageIndicator(totalPages);
                analyzeCurrentEmotion();
            }
        }

        function nextPage() {
            const novel = novelData[state.currentNovel];
            const totalPages = Math.ceil(novel.content.length / state.pagesPerView);
            
            if (state.currentPage < totalPages - 1) {
                goToPage(state.currentPage + 1);
            }
        }

        function prevPage() {
            if (state.currentPage > 0) {
                goToPage(state.currentPage - 1);
            }
        }

        // ===== 自动滚动 =====
        function toggleAutoScroll() {
            state.isAutoScrolling = !state.isAutoScrolling;
            
            if (state.isAutoScrolling) {
                elements.autoScrollBtn.classList.add("active");
                startAutoScroll();
            } else {
                elements.autoScrollBtn.classList.remove("active");
                stopAutoScroll();
            }
        }

        function startAutoScroll() {
            if (state.scrollInterval) {
                clearInterval(state.scrollInterval);
            }
            
            state.scrollInterval = setInterval(() => {
                const novel = novelData[state.currentNovel];
                const totalPages = Math.ceil(novel.content.length / state.pagesPerView);
                
                if (state.currentPage < totalPages - 1) {
                    nextPage();
                } else {
                    // 到达最后一页，停止自动滚动
                    toggleAutoScroll();
                }
            }, 5000); // 每5秒翻一页
        }

        function stopAutoScroll() {
            if (state.scrollInterval) {
                clearInterval(state.scrollInterval);
                state.scrollInterval = null;
            }
        }

        // ===== 情绪分析 =====
        function analyzeCurrentEmotion() {
            const novel = novelData[state.currentNovel];
            const startIndex = state.currentPage * state.pagesPerView;
            const endIndex = Math.min(startIndex + state.pagesPerView, novel.content.length);
            
            // 合并当前页文本
            let text = "";
            for (let i = startIndex; i < endIndex; i++) {
                text += novel.content[i];
            }
            
            // 关键词匹配情绪分析 (带权重)
            const emotionScores = {};
            let totalMatches = 0;
            
            Object.keys(emotionKeywords).forEach(emotion => {
                const config = emotionKeywords[emotion];
                let score = 0;
                config.keywords.forEach(keyword => {
                    const regex = new RegExp(keyword, "g");
                    const matches = text.match(regex);
                    if (matches) {
                        score += matches.length * config.weight;
                        totalMatches += matches.length;
                    }
                });
                emotionScores[emotion] = score;
            });
            
            // 计算置信度
            let maxScore = 0;
            let detectedEmotion = "mystery"; // 默认情绪
            
            Object.keys(emotionScores).forEach(emotion => {
                if (emotionScores[emotion] > maxScore) {
                    maxScore = emotionScores[emotion];
                    detectedEmotion = emotion;
                }
            });
            
            // 计算置信度百分比
            const confidence = totalMatches > 0 ? Math.min(100, Math.round((maxScore / (totalMatches * 1.5)) * 100)) : 50;
            
            // 更新状态
            state.currentEmotion = detectedEmotion;
            state.confidence = confidence;
            
            // 更新UI
            updateEmotionUI(detectedEmotion, confidence);
            
            return detectedEmotion;
        }

        function updateEmotionUI(emotion, confidence) {
            // 更新情绪标签
            const tags = elements.emotionTags.querySelectorAll(".emotion-tag");
            tags.forEach(tag => {
                tag.classList.remove("active");
                if (tag.dataset.emotion === emotion) {
                    tag.classList.add("active");
                }
            });
            
            // 更新置信度
            elements.confidenceValue.textContent = `${confidence}%`;
            elements.confidenceFill.style.width = `${confidence}%`;
            
            // 更新情绪指示器颜色
            elements.emotionIndicator.style.background = emotionColors[emotion];
            elements.emotionIndicator.style.boxShadow = `0 0 20px ${emotionColors[emotion]}`;
            
            // 更新背景渐变
            updateBackgroundGradient(emotion);
        }

        function updateBackgroundGradient(emotion) {
            const color = emotionColors[emotion];
            elements.bgGradient.style.background = `radial-gradient(circle at 50% 50%, ${color}22 0%, transparent 70%)`;
        }

        // ===== 音乐控制 =====
        function updateMusic(emotion) {
            // 更新UI
            const emojiMap = {
                tension: "🔍", warm: "☀️", sad: "🌧️", hot: "⚔️", mystery: "🌲", peace: "🕊️"
            };
            const titleMap = {
                tension: "悬疑追踪", warm: "冬日暖阳", sad: "离别之曲", hot: "战斗序曲", mystery: "神秘森林", peace: "宁静时光"
            };
            
            elements.albumArt.textContent = emojiMap[emotion] || "🎵";
            elements.trackTitle.textContent = titleMap[emotion] || "AI氛围音乐";
            elements.trackArtist.textContent = "Web Audio API 实时生成";
            
            // 如果正在播放，切换音乐风格
            if (state.isPlaying) {
                stopSynth();
                playSynth(emotion);
            }
        }

        function togglePlayPause() {
            if (!state.audioContext) {
                initAudioContext();
            }
            
            // 确保音频上下文已启动
            if (state.audioContext.state === "suspended") {
                state.audioContext.resume();
            }
            
            if (state.isPlaying) {
                stopSynth();
                state.isPlaying = false;
                elements.playPauseBtn.textContent = "▶";
            } else {
                playSynth(state.currentEmotion);
                state.isPlaying = true;
                elements.playPauseBtn.textContent = "⏸";
            }
        }

        function playSynth(emotion) {
            if (state.synthInterval) clearInterval(state.synthInterval);
            if (state.drumInterval) clearInterval(state.drumInterval);
            if (state.bassInterval) clearInterval(state.bassInterval);
            
            // 和弦进行定义（根音、三度、五度）
            const chordProgressions = {
                tension: [
                    [220, 261.63, 329.63], // Am
                    [174.61, 220, 261.63], // F
                    [130.81, 164.81, 196], // C
                    [196, 246.94, 293.66]  // G
                ],
                warm: [
                    [130.81, 164.81, 196], // C
                    [196, 246.94, 293.66], // G
                    [220, 261.63, 329.63], // Am
                    [174.61, 220, 261.63]  // F
                ],
                sad: [
                    [220, 261.63, 329.63], // Am
                    [164.81, 196, 246.94], // Em
                    [174.61, 220, 261.63], // F
                    [130.81, 164.81, 196]  // C
                ],
                hot: [
                    [164.81, 207.65, 246.94], // E5
                    [246.94, 311.13, 369.99], // B5
                    [130.81, 164.81, 196],    // C5
                    [146.83, 185, 220]        // D5
                ],
                mystery: [
                    [130.81, 146.83, 196], // Csus2
                    [174.61, 196, 261.63], // Fsus2
                    [196, 220, 293.66],    // Gsus2
                    [130.81, 146.83, 196]  // Csus2
                ],
                peace: [
                    [130.81, 164.81, 196], // C
                    [174.61, 220, 261.63], // F
                    [130.81, 164.81, 196], // C
                    [196, 246.94, 293.66]  // G
                ]
            };
            
            // 旋律音阶（五声音阶）
            const melodyScales = {
                tension: [440, 523.25, 587.33, 659.25, 783.99], // A小调五声
                warm: [523.25, 587.33, 659.25, 783.99, 880],    // C大调五声
                sad: [440, 523.25, 587.33, 659.25, 783.99],     // A小调五声
                hot: [659.25, 783.99, 880, 1046.5, 1174.66],    // E大调五声
                mystery: [523.25, 587.33, 659.25, 783.99, 880], // C大调五声
                peace: [523.25, 587.33, 659.25, 783.99, 880]    // C大调五声
            };
            
            // 速度（BPM）
            const tempos = {
                tension: 120, warm: 80, sad: 70, hot: 140, mystery: 90, peace: 60
            };
            
            // 当前情绪设置
            const progression = chordProgressions[emotion] || chordProgressions.mystery;
            const scale = melodyScales[emotion] || melodyScales.mystery;
            const bpm = tempos[emotion] || 90;
            const beatDuration = 60 / bpm; // 秒每拍
            
            let currentChordIndex = 0;
            let currentBeat = 0;
            
            // 创建混响效果（简单延迟）
            const delay = state.audioContext.createDelay(1.0);
            delay.delayTime.value = 0.3;
            const feedback = state.audioContext.createGain();
            feedback.gain.value = 0.3;
            delay.connect(feedback);
            feedback.connect(delay);
            delay.connect(state.gainNode);
            
            // 播放和弦琶音
            const playChordArpeggio = () => {
                const chord = progression[currentChordIndex % progression.length];
                const arpeggioOrder = [0, 1, 2, 1]; // 根-三-五-三
                
                arpeggioOrder.forEach((noteIndex, i) => {
                    setTimeout(() => {
                        if (!state.isPlaying) return;
                        
                        const osc = state.audioContext.createOscillator();
                        const gain = state.audioContext.createGain();
                        
                        osc.connect(gain);
                        gain.connect(delay);
                        gain.connect(state.gainNode);
                        
                        // 使用更丰富的音色
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(chord[noteIndex], state.audioContext.currentTime);
                        
                        // 添加轻微的失谐效果
                        const detune = state.audioContext.createOscillator();
                        const detuneGain = state.audioContext.createGain();
                        detune.connect(detuneGain);
                        detuneGain.connect(gain);
                        detune.frequency.setValueAtTime(chord[noteIndex] * 1.002, state.audioContext.currentTime);
                        detuneGain.gain.value = 0.3;
                        detune.start();
                        
                        // 包络
                        gain.gain.setValueAtTime(0, state.audioContext.currentTime);
                        gain.gain.linearRampToValueAtTime(0.2, state.audioContext.currentTime + 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.001, state.audioContext.currentTime + beatDuration * 0.8);
                        
                        osc.start();
                        osc.stop(state.audioContext.currentTime + beatDuration * 0.8);
                        detune.stop(state.audioContext.currentTime + beatDuration * 0.8);
                    }, i * beatDuration * 0.25 * 1000);
                });
                
                currentChordIndex++;
            };
            
            // 播放旋律音符
            const playMelodyNote = () => {
                if (Math.random() > 0.6) { // 40%的概率播放旋律
                    const note = scale[Math.floor(Math.random() * scale.length)];
                    
                    const osc = state.audioContext.createOscillator();
                    const gain = state.audioContext.createGain();
                    
                    osc.connect(gain);
                    gain.connect(delay);
                    gain.connect(state.gainNode);
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(note, state.audioContext.currentTime);
                    
                    // 包络
                    gain.gain.setValueAtTime(0, state.audioContext.currentTime);
                    gain.gain.linearRampToValueAtTime(0.15, state.audioContext.currentTime + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, state.audioContext.currentTime + beatDuration * 0.5);
                    
                    osc.start();
                    osc.stop(state.audioContext.currentTime + beatDuration * 0.5);
                }
            };
            
            // 播放低音线
            const playBassNote = () => {
                const chord = progression[(currentChordIndex - 1 + progression.length) % progression.length];
                const bassNote = chord[0] / 2; // 低一个八度
                
                const osc = state.audioContext.createOscillator();
                const gain = state.audioContext.createGain();
                const filter = state.audioContext.createBiquadFilter();
                
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(state.gainNode);
                
                osc.type = 'sawtooth';
                filter.type = 'lowpass';
                filter.frequency.value = 200;
                filter.Q.value = 5;
                
                osc.frequency.setValueAtTime(bassNote, state.audioContext.currentTime);
                
                // 包络
                gain.gain.setValueAtTime(0, state.audioContext.currentTime);
                gain.gain.linearRampToValueAtTime(0.2, state.audioContext.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, state.audioContext.currentTime + beatDuration * 0.9);
                
                osc.start();
                osc.stop(state.audioContext.currentTime + beatDuration * 0.9);
            };
            
            // 播放鼓点
            const playDrum = () => {
                // 底鼓
                if (currentBeat % 4 === 0) {
                    const kick = state.audioContext.createOscillator();
                    const kickGain = state.audioContext.createGain();
                    
                    kick.connect(kickGain);
                    kickGain.connect(state.gainNode);
                    
                    kick.frequency.setValueAtTime(150, state.audioContext.currentTime);
                    kick.frequency.exponentialRampToValueAtTime(0.01, state.audioContext.currentTime + 0.5);
                    kickGain.gain.setValueAtTime(0.8, state.audioContext.currentTime);
                    kickGain.gain.exponentialRampToValueAtTime(0.01, state.audioContext.currentTime + 0.5);
                    
                    kick.start();
                    kick.stop(state.audioContext.currentTime + 0.5);
                }
                
                // 军鼓（每2拍）
                if (currentBeat % 4 === 2) {
                    const noise = state.audioContext.createBufferSource();
                    const noiseBuffer = state.audioContext.createBuffer(1, state.audioContext.sampleRate * 0.2, state.audioContext.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    
                    for (let i = 0; i < output.length; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    
                    noise.buffer = noiseBuffer;
                    
                    const noiseFilter = state.audioContext.createBiquadFilter();
                    noiseFilter.type = 'highpass';
                    noiseFilter.frequency.value = 1000;
                    
                    const noiseGain = state.audioContext.createGain();
                    noiseGain.gain.setValueAtTime(0.5, state.audioContext.currentTime);
                    noiseGain.gain.exponentialRampToValueAtTime(0.01, state.audioContext.currentTime + 0.2);
                    
                    noise.connect(noiseFilter);
                    noiseFilter.connect(noiseGain);
                    noiseGain.connect(state.gainNode);
                    
                    noise.start();
                }
                
                // 踩镲（每拍）
                const hihat = state.audioContext.createBufferSource();
                const hihatBuffer = state.audioContext.createBuffer(1, state.audioContext.sampleRate * 0.1, state.audioContext.sampleRate);
                const hihatOutput = hihatBuffer.getChannelData(0);
                
                for (let i = 0; i < hihatOutput.length; i++) {
                    hihatOutput[i] = Math.random() * 2 - 1;
                }
                
                hihat.buffer = hihatBuffer;
                
                const hihatFilter = state.audioContext.createBiquadFilter();
                hihatFilter.type = 'bandpass';
                hihatFilter.frequency.value = 10000;
                hihatFilter.Q.value = 1;
                
                const hihatGain = state.audioContext.createGain();
                hihatGain.gain.setValueAtTime(0.3, state.audioContext.currentTime);
                hihatGain.gain.exponentialRampToValueAtTime(0.01, state.audioContext.currentTime + 0.1);
                
                hihat.connect(hihatFilter);
                hihatFilter.connect(hihatGain);
                hihatGain.connect(state.gainNode);
                
                hihat.start();
                
                currentBeat++;
            };
            
            // 开始播放
            playChordArpeggio(); // 立即播放第一个和弦
            
            // 设置定时器
            state.synthInterval = setInterval(() => {
                playChordArpeggio();
                playMelodyNote();
            }, beatDuration * 1000);
            
            state.bassInterval = setInterval(playBassNote, beatDuration * 2000); // 每2拍
            
            state.drumInterval = setInterval(playDrum, beatDuration * 1000); // 每拍
            
            // 更新进度条动画
            const progressInterval = setInterval(() => {
                if (!state.isPlaying) {
                    clearInterval(progressInterval);
                    return;
                }
                const progress = (Date.now() % 30000) / 300;
                elements.progressFill.style.width = `${progress % 100}%`;
                elements.progressHandle.style.left = `${progress % 100}%`;
            }, 100);
        }

        function stopSynth() {
            if (state.synthInterval) {
                clearInterval(state.synthInterval);
                state.synthInterval = null;
            }
            if (state.drumInterval) {
                clearInterval(state.drumInterval);
                state.drumInterval = null;
            }
            if (state.bassInterval) {
                clearInterval(state.bassInterval);
                state.bassInterval = null;
            }
        }function setVolume(value) {
            state.volume = value;
            if (state.gainNode) {
                state.gainNode.gain.value = value / 100;
            }
            
            // 更新音量图标
            if (value === 0) {
                elements.volumeIcon.textContent = "🔇";
            } else if (value < 50) {
                elements.volumeIcon.textContent = "🔉";
            } else {
                elements.volumeIcon.textContent = "🔊";
            }
        }

        // ===== 视觉氛围效果 =====
        function updateVisualAtmosphere(emotion) {
            // 更新粒子颜色
            updateParticleColors(emotion);
            
            // 更新背景渐变
            updateBackgroundGradient(emotion);
        }

        function setAtmosphere(atmosphereType) {
            state.atmosphere = atmosphereType;
            
            // 更新UI
            const options = elements.atmosphereOptions.querySelectorAll(".atmosphere-option");
            options.forEach(option => {
                option.classList.remove("active");
                if (option.dataset.atmosphere === atmosphereType) {
                    option.classList.add("active");
                }
            });
            
            // 重新初始化粒子系统
            initParticleSystem();
        }

        function setIntensity(value) {
            state.intensity = value;
            elements.intensityValue.textContent = `${value}%`;
            
            // 更新粒子透明度
            const opacity = 0.2 + (value / 100) * 0.8;
            elements.particlesCanvas.style.opacity = opacity;
        }

        // ===== 粒子系统 =====
        function initParticleSystem() {
            // 清除现有粒子
            state.particles = [];
            
            // 根据氛围类型创建粒子
            switch (state.atmosphere) {
                case "particles":
                    createFloatingParticles();
                    break;
                case "glow":
                    createGlowParticles();
                    break;
                case "waves":
                    createWaveParticles();
                    break;
                case "stars":
                    createStarParticles();
                    break;
            }
        }

        function createFloatingParticles() {
            const canvas = document.createElement("canvas");
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.position = "fixed";
            canvas.style.top = "0";
            canvas.style.left = "0";
            canvas.style.zIndex = "-1";
            canvas.style.pointerEvents = "none";
            
            // 清除现有canvas
            const existingCanvas = elements.particlesCanvas.querySelector("canvas");
            if (existingCanvas) {
                existingCanvas.remove();
            }
            elements.particlesCanvas.appendChild(canvas);
            
            const ctx = canvas.getContext("2d");
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                state.particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 3 + 1,
                    speedX: (Math.random() - 0.5) * 0.5,
                    speedY: (Math.random() - 0.5) * 0.5,
                    opacity: Math.random() * 0.5 + 0.1,
                    color: emotionColors[state.currentEmotion]
                });
            }
            
            // 开始动画
            if (state.animationFrame) {
                cancelAnimationFrame(state.animationFrame);
            }
            
            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 获取音频数据
                let audioLevel = 0;
                if (state.analyser) {
                    const dataArray = new Uint8Array(state.analyser.frequencyBinCount);
                    state.analyser.getByteFrequencyData(dataArray);
                    // 计算平均音量
                    const sum = dataArray.reduce((a, b) => a + b, 0);
                    audioLevel = sum / dataArray.length / 255; // 0.0 - 1.0
                }
                
                state.particles.forEach(particle => {
                    // 更新位置 (随音频震动)
                    const shakeX = state.isPlaying ? (Math.random() - 0.5) * audioLevel * 5 : 0;
                    const shakeY = state.isPlaying ? (Math.random() - 0.5) * audioLevel * 5 : 0;
                    
                    particle.x += particle.speedX + shakeX;
                    particle.y += particle.speedY + shakeY;
                    
                    // 边界检查
                    if (particle.x < 0 || particle.x > canvas.width) {
                        particle.speedX *= -1;
                    }
                    if (particle.y < 0 || particle.y > canvas.height) {
                        particle.speedY *= -1;
                    }
                    
                    // 绘制粒子 (大小随音频变化)
                    const currentSize = state.isPlaying ? particle.size + (audioLevel * 5) : particle.size;
                    
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, currentSize, 0, Math.PI * 2);
                    ctx.fillStyle = particle.color;
                    ctx.globalAlpha = particle.opacity + (state.isPlaying ? audioLevel * 0.3 : 0);
                    ctx.fill();
                });
                
                state.animationFrame = requestAnimationFrame(animateParticles);
            }
            
            animateParticles();
        }

        function createGlowParticles() {
            // 简化版本：使用CSS实现光晕效果
            elements.particlesCanvas.style.background = `radial-gradient(circle at 50% 50%, ${emotionColors[state.currentEmotion]}33 0%, transparent 50%)`;
        }

        function createWaveParticles() {
            // 简化版本：使用CSS实现波纹效果
            elements.particlesCanvas.style.background = `linear-gradient(45deg, ${emotionColors[state.currentEmotion]}11 25%, transparent 25%, transparent 75%, ${emotionColors[state.currentEmotion]}11 75%)`;
            elements.particlesCanvas.style.backgroundSize = "20px 20px";
        }

        function createStarParticles() {
            // 简化版本：使用CSS实现星空效果
            elements.particlesCanvas.style.background = `radial-gradient(2px 2px at 20px 30px, ${emotionColors[state.currentEmotion]}, transparent), radial-gradient(2px 2px at 40px 70px, ${emotionColors[state.currentEmotion]}, transparent), radial-gradient(2px 2px at 50px 160px, ${emotionColors[state.currentEmotion]}, transparent), radial-gradient(2px 2px at 90px 40px, ${emotionColors[state.currentEmotion]}, transparent), radial-gradient(2px 2px at 130px 80px, ${emotionColors[state.currentEmotion]}, transparent)`;
            elements.particlesCanvas.style.backgroundSize = "200px 200px";
        }

        function updateParticleColors(emotion) {
            const color = emotionColors[emotion];
            state.particles.forEach(particle => {
                particle.color = color;
            });
        }

        // ===== 动画循环 =====
        function animate() {
            // 这里可以添加持续动画效果
            requestAnimationFrame(animate);
        }

        // ===== 事件绑定 =====
        function bindEventListeners() {
            // 小说选择
            elements.novelSelect.addEventListener("change", (e) => {
                loadNovel(e.target.value);
            });
            
            // 页面导航
            elements.autoScrollBtn.addEventListener("click", toggleAutoScroll);
            elements.prevPageBtn.addEventListener("click", prevPage);
            elements.nextPageBtn.addEventListener("click", nextPage);
            
            // 音乐控制
            elements.playPauseBtn.addEventListener("click", togglePlayPause);
            // elements.progressBar.addEventListener("click", seekTo); // 移除手动拖动，由合成器控制
            elements.volumeSlider.addEventListener("input", (e) => {
                setVolume(parseInt(e.target.value));
            });
            
            // 氛围控制
            elements.atmosphereOptions.addEventListener("click", (e) => {
                const option = e.target.closest(".atmosphere-option");
                if (option) {
                    setAtmosphere(option.dataset.atmosphere);
                }
            });
            
            elements.intensitySlider.addEventListener("input", (e) => {
                setIntensity(parseInt(e.target.value));
            });
            
            // 情绪标签点击
            elements.emotionTags.addEventListener("click", (e) => {
                const tag = e.target.closest(".emotion-tag");
                if (tag) {
                    const emotion = tag.dataset.emotion;
                    state.currentEmotion = emotion;
                    updateEmotionUI(emotion, state.confidence);
                    updateMusic(emotion);
                    updateVisualAtmosphere(emotion);
                }
            });
            
            // 窗口大小变化
            window.addEventListener("resize", () => {
                // 重新初始化粒子系统
                initParticleSystem();
            });
            
            // 键盘快捷键
            document.addEventListener("keydown", (e) => {
                switch (e.key) {
                    case "ArrowLeft":
                        prevPage();
                        break;
                    case "ArrowRight":
                        nextPage();
                        break;
                    case " ":
                        e.preventDefault();
                        togglePlayPause();
                        break;
                    case "a":
                    case "A":
                        toggleAutoScroll();
                        break;
                }
            });
        }

        // ===== 启动应用 =====
        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
