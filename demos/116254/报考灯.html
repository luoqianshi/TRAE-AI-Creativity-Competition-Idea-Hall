<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>报考灯 — 考试报名流程导航</title>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --accent: #3b82f6;
            --accent-light: #93c5fd;
            --success: #10b981;
            --warning: #f59e0b;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
            --radius: 12px;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .dark-theme {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --accent: #60a5fa;
            --accent-light: #3b82f6;
            --success: #34d399;
            --warning: #fbbf24;
            --shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 16px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
            padding-top: 12px;
        }

        h1 {
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .theme-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title i {
            font-size: 1.1rem;
        }

        /* 时间模块 */
        .countdown-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .date-select {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 1rem;
        }

        .countdown-display {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: var(--accent-light);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            min-width: 80px;
            text-align: center;
        }

        /* 材料模块 */
        .materials-list {
            list-style: none;
        }

        .material-item {
            display: flex;
            align-items: flex-start;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .material-item:last-child {
            border-bottom: none;
        }

        .material-checkbox {
            margin-top: 4px;
            margin-right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .material-text {
            flex: 1;
            font-size: 1rem;
        }

        .material-note {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* 截图模块 */
        .screenshot-area {
            background: #f1f5f9;
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .screenshot-area:hover {
            border-color: var(--accent);
            background: #e2e8f0;
        }

        .screenshot-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .screenshot-text {
            margin-bottom: 16px;
            font-size: 0.95rem;
        }

        .screenshot-hint {
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 8px 12px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 8px;
        }

        .result-box {
            margin-top: 16px;
            padding: 12px 16px;
            background: #dbeafe;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #4f46e5;
            display: none;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .countdown-group {
                flex-direction: column;
            }

            .countdown-item {
                min-width: 70px;
                padding: 6px 12px;
                font-size: 0.9rem;
            }
        }

        /* 动画基础 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            animation: fadeIn 0.4s ease-out;
        }

        .theme-toggle {
            position: fixed;
        }

        footer {
            text-align: center;
            margin-top: 32px;
            padding: 16px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式">☀️</button>

    <div class="container">
        <header>
            <h1>报考灯</h1>
            <p class="subtitle">中考 / 高考 / 教资 / 自考报名流程一键导航 · 家长专用</p>
        </header>

        <!-- 时间提醒模块 -->
        <section class="card">
            <h2 class="card-title">⏰ 报名截止倒计时</h2>
            <p>请先选择您关注的考试类型与截止日期：</p>
            <div class="countdown-group">
                <select class="date-select" id="examSelect">
                    <option value="gaokao">2025年高考报名（10月25日截止）</option>
                    <option value="zhongkao">2025年中考报名（3月18日截止）</option>
                    <option value="jiaozige">2025上半年教资报名（1月13日截止）</option>
                    <option value="zikaog">2025年4月自考报名（2月26日截止）</option>
                </select>
            </div>
            <div class="countdown-display">
                <div class="countdown-item"><span id="days">0</span>天</div>
                <div class="countdown-item"><span id="hours">0</span>小时</div>
                <div class="countdown-item"><span id="minutes">0</span>分</div>
            </div>
        </section>

        <!-- 材料清单模块 -->
        <section class="card">
            <h2 class="card-title">📄 必备材料清单</h2>
            <p>勾选已完成准备的材料，实时记录进度：</p>
            <ul class="materials-list">
                <li class="material-item">
                    <input type="checkbox" class="material-checkbox" id="photo" data-key="photo">
                    <label class="material-text" for="photo">本人近期免冠证件照（JPG格式，≤200KB）<br><span class="material-note">建议用手机原图，勿美颜</span></label>
                </li>
                <li class="material-item">
                    <input type="checkbox" class="material-checkbox" id="idcard" data-key="idcard">
                    <label class="material-text" for="idcard">身份证正反面扫描件（PDF或JPG）<br><span class="material-note">需清晰、四角完整</span></label>
                </li>
                <li class="material-item">
                    <input type="checkbox" class="material-checkbox" id="household" data-key="household">
                    <label class="material-text" for="household">户口簿本人页+户主页（加盖派出所公章）<br><span class="material-note">非本市户籍另需居住证</span></label>
                </li>
                <li class="material-item">
                    <input type="checkbox" class="material-checkbox" id="schoolproof" data-key="schoolproof">
                    <label class="material-text" for="schoolproof">学籍证明（学校教务处盖章）<br><span class="material-note">初三/高三学生必交</span></label>
                </li>
                <li class="material-item">
                    <input type="checkbox" class="material-checkbox" id="health" data-key="health">
                    <label class="material-text" for="health">体检表（指定医院盖章）<br><span class="material-note">中考报名前3个月内有效</span></label>
                </li>
            </ul>
        </section>

        <!-- 截图识别模块 -->
        <section class="card">
            <h2 class="card-title">📱 截图辅助定位</h2>
            <p>遇到卡在某一步？截一张报名页面图，我们帮您判断当前所处环节：</p>
            <div class="screenshot-area" id="screenshotZone">
                <div class="screenshot-icon">📷</div>
                <p class="screenshot-text">点击此处上传报名页面截图<br>（支持PNG/JPG，小于5MB）</p>
                <div class="screenshot-hint">示例：截图含「上传照片」「填写学籍号」「提交确认」等文字即可</div>
            </div>
            <div class="result-box" id="resultBox">
                ✅ 已识别到「上传照片」步骤 —— 您正在第2步，请检查文件格式与大小
            </div>
        </section>

        <footer>
            <p>报考灯 · 专为家长设计的考试报名导航助手 | 所有数据本地处理，不上传服务器</p>
        </footer>
    </div>

    <script>
        // 主题切换
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
            themeToggle.innerHTML = '🌙';
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            if (document.body.classList.contains('dark-theme')) {
                localStorage.setItem('theme', 'dark');
                themeToggle.innerHTML = '🌙';
            } else {
                localStorage.setItem('theme', 'light');
                themeToggle.innerHTML = '☀️';
            }
        });

        // 倒计时逻辑
        const examSelect = document.getElementById('examSelect');
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');

        // 预设截止日期（真实时间戳，便于演示）
        const deadlines = {
            gaokao: new Date('2024-10-25T23:59:59').getTime(),
            zhongkao: new Date('2025-03-18T23:59:59').getTime(),
            jiaozige: new Date('2025-01-13T23:59:59').getTime(),
            zikaog: new Date('2025-02-26T23:59:59').getTime()
        };

        function updateCountdown() {
            const now = new Date().getTime();
            const selected = examSelect.value;
            const deadline = deadlines[selected];
            const diff = deadline - now;

            if (diff <= 0) {
                daysEl.textContent = '已截止';
                hoursEl.textContent = '';
                minutesEl.textContent = '';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            daysEl.textContent = days;
            hoursEl.textContent = hours;
            minutesEl.textContent = minutes;
        }

        // 初始化并定时更新
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // 材料勾选状态保存
        const checkboxes = document.querySelectorAll('.material-checkbox');
        const savedStates = JSON.parse(localStorage.getItem('materialStates')) || {};

        checkboxes.forEach(cb => {
            const key = cb.dataset.key;
            if (savedStates[key] !== undefined) {
                cb.checked = savedStates[key];
            }
            cb.addEventListener('change', () => {
                savedStates[key] = cb.checked;
                localStorage.setItem('materialStates', JSON.stringify(savedStates));
            });
        });

        // 截图区域点击模拟
        const screenshotZone = document.getElementById('screenshotZone');
        const resultBox = document.getElementById('resultBox');

        screenshotZone.addEventListener('click', () => {
            resultBox.style.display = 'block';
            // 滚动到结果处
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
    </script>
</body>
</html>
