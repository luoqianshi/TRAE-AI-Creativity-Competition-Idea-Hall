<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片左右对比</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { margin-bottom: 20px; font-size: 1.5rem; }

  .upload-area {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .upload-box {
    width: 320px;
    height: 200px;
    border: 2px dashed #555;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    position: relative;
    overflow: hidden;
  }
  .upload-box:hover { border-color: #6c5ce7; background: rgba(108,92,231,.05); }
  .upload-box img {
    width: 100%; height: 100%; object-fit: contain;
    position: absolute; top: 0; left: 0;
  }
  .upload-box .label {
    position: absolute; bottom: 8px;
    background: rgba(0,0,0,.6);
    padding: 2px 12px; border-radius: 6px;
    font-size: .8rem;
  }
  .upload-box .placeholder { color: #666; font-size: .9rem; text-align: center; }
  .upload-box input { display: none; }

  .compare-container {
    display: flex;
    gap: 4px;
    max-width: 95vw;
    justify-content: center;
    align-items: center;
    flex: 1;
  }
  .compare-container img {
    max-width: 48%;
    max-height: 65vh;
    border-radius: 8px;
    object-fit: contain;
    background: #111;
  }
  .divider {
    width: 2px;
    height: 60vh;
    background: #6c5ce7;
    border-radius: 1px;
    flex-shrink: 0;
  }

  .empty-hint {
    color: #444;
    font-size: 1rem;
    margin-top: 40px;
  }

  .actions { margin-top: 16px; display: flex; gap: 12px; }
  .btn {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: .9rem;
    background: #6c5ce7;
    color: #fff;
    transition: opacity .2s;
  }
  .btn:hover { opacity: .85; }
  .btn.secondary { background: #333; }
  .btn:disabled { opacity: .3; cursor: default; }
</style>
</head>
<body>

<h1>🖼️ 图片左右对比</h1>

<div class="upload-area">
  <label class="upload-box" id="box-left">
    <div class="placeholder">点击上传左侧图片</div>
    <img id="preview-left" style="display:none">
    <div class="label" id="label-left" style="display:none">左</div>
    <input type="file" accept="image/*" id="input-left">
  </label>
  <label class="upload-box" id="box-right">
    <div class="placeholder">点击上传右侧图片</div>
    <img id="preview-right" style="display:none">
    <div class="label" id="label-right" style="display:none">右</div>
    <input type="file" accept="image/*" id="input-right">
  </label>
</div>

<div class="actions">
  <button class="btn" id="btn-swap" disabled>🔄 左右互换</button>
  <button class="btn secondary" id="btn-clear" disabled>清空</button>
</div>

<div class="compare-container" id="compare" style="display:none">
  <img id="show-left">
  <div class="divider"></div>
  <img id="show-right">
</div>

<div class="empty-hint" id="hint">上传两张图片即可开始对比</div>

<script>
const inputLeft = document.getElementById('input-left');
const inputRight = document.getElementById('input-right');
const previewLeft = document.getElementById('preview-left');
const previewRight = document.getElementById('preview-right');
const showLeft = document.getElementById('show-left');
const showRight = document.getElementById('show-right');
const labelLeft = document.getElementById('label-left');
const labelRight = document.getElementById('label-right');
const boxLeft = document.getElementById('box-left').querySelector('.placeholder');
const boxRight = document.getElementById('box-right').querySelector('.placeholder');
const compare = document.getElementById('compare');
const hint = document.getElementById('hint');
const btnSwap = document.getElementById('btn-swap');
const btnClear = document.getElementById('btn-clear');

let leftSrc = null, rightSrc = null;

function handleFile(input, previewEl, showEl, labelEl, placeholderEl, side) {
  input.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const src = ev.target.result;
      previewEl.src = src;
      previewEl.style.display = 'block';
      placeholderEl.style.display = 'none';
      labelEl.style.display = 'block';
      labelEl.textContent = side;
      if (side === '左') { leftSrc = src; showLeft.src = src; }
      else { rightSrc = src; showRight.src = src; }
      updateView();
    };
    reader.readAsDataURL(file);
  });
}

handleFile(inputLeft, previewLeft, showLeft, labelLeft, boxLeft, '左');
handleFile(inputRight, previewRight, showRight, labelRight, boxRight, '右');

function updateView() {
  const ready = leftSrc && rightSrc;
  compare.style.display = ready ? 'flex' : 'none';
  hint.style.display = ready ? 'none' : 'block';
  btnSwap.disabled = !ready;
  btnClear.disabled = !leftSrc && !rightSrc;

  if (leftSrc && !rightSrc) hint.textContent = '再上传一张图片即可对比';
  else if (!leftSrc && rightSrc) hint.textContent = '再上传一张图片即可对比';
  else if (ready) hint.textContent = '';
  else hint.textContent = '上传两张图片即可开始对比';
}

btnSwap.addEventListener('click', () => {
  [leftSrc, rightSrc] = [rightSrc, leftSrc];
  previewLeft.src = leftSrc || '';
  previewRight.src = rightSrc || '';
  showLeft.src = leftSrc || '';
  showRight.src = rightSrc || '';
  previewLeft.style.display = leftSrc ? 'block' : 'none';
  previewRight.style.display = rightSrc ? 'block' : 'none';
  boxLeft.style.display = leftSrc ? 'none' : 'block';
  boxRight.style.display = rightSrc ? 'none' : 'block';
});

btnClear.addEventListener('click', () => {
  leftSrc = rightSrc = null;
  [inputLeft, inputRight].forEach(i => i.value = '');
  [previewLeft, previewRight, showLeft, showRight].forEach(el => { el.src = ''; el.style.display = 'none'; });
  [labelLeft, labelRight].forEach(el => el.style.display = 'none');
  boxLeft.style.display = 'block';
  boxRight.style.display = 'block';
  boxLeft.textContent = '点击上传左侧图片';
  boxRight.textContent = '点击上传右侧图片';
  updateView();
});
</script>
</body>
</html>
