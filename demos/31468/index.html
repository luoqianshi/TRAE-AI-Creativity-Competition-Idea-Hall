<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基于GIS的智能设备部署推演系统</title>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a1628;
    --bg-panel:rgba(12,28,48,0.78);
    --bg-panel-solid:#0c1c30;
    --border-glow:rgba(0,212,255,0.25);
    --cyan:#00d4ff;
    --cyan-dim:#0a8fb0;
    --amber:#ffb800;
    --red:#ff4d6d;
    --green:#00e6a8;
    --text:#e6f4ff;
    --text-dim:#7a96b8;
    --text-mute:#4a6885;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-deep);color:var(--text);font-family:'Rajdhani',sans-serif}
  #cesiumContainer{position:absolute;top:0;left:0;width:100%;height:100%}

  /* 顶部导航栏 */
  .topbar{
    position:absolute;top:0;left:0;right:0;height:56px;z-index:20;
    background:linear-gradient(180deg,rgba(8,20,36,0.95) 0%,rgba(8,20,36,0.7) 100%);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border-glow);
    display:flex;align-items:center;padding:0 20px;gap:18px;
    box-shadow:0 4px 24px rgba(0,0,0,0.4);
  }
  .logo{display:flex;align-items:center;gap:10px}
  .logo-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),var(--cyan-dim));display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(0,212,255,0.5)}
  .logo-icon svg{width:18px;height:18px;stroke:#0a1628;fill:none;stroke-width:2.2}
  .logo-text{font-family:'Orbitron',sans-serif;font-weight:700;font-size:15px;letter-spacing:1px;color:var(--text)}
  .logo-text span{color:var(--cyan)}
  .scene-name{
    background:rgba(0,212,255,0.08);border:1px solid var(--border-glow);
    border-radius:6px;padding:6px 12px;color:var(--text);font-size:14px;
    font-weight:500;min-width:200px;outline:none;
  }
  .scene-name:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,212,255,0.15)}
  .topbar-spacer{flex:1}
  .top-btn{
    display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;
    background:rgba(0,212,255,0.08);border:1px solid var(--border-glow);
    color:var(--text);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;
    cursor:pointer;transition:all .2s;letter-spacing:.5px;
  }
  .top-btn:hover{background:rgba(0,212,255,0.18);border-color:var(--cyan);box-shadow:0 0 12px rgba(0,212,255,0.3)}
  .top-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
  .top-btn.amber{background:rgba(255,184,0,0.1);border-color:rgba(255,184,0,0.3);color:var(--amber)}
  .top-btn.amber:hover{background:rgba(255,184,0,0.2);border-color:var(--amber);box-shadow:0 0 12px rgba(255,184,0,0.3)}
  .top-btn.red{background:rgba(255,77,109,0.1);border-color:rgba(255,77,109,0.3);color:var(--red)}
  .top-btn.red:hover{background:rgba(255,77,109,0.2);border-color:var(--red)}

  /* 左侧工具栏 */
  .toolbar{
    position:absolute;left:16px;top:72px;z-index:15;
    background:var(--bg-panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border-glow);border-radius:12px;padding:10px;
    display:flex;flex-direction:column;gap:6px;
    box-shadow:0 8px 32px rgba(0,0,0,0.5);
  }
  .tool-btn{
    width:44px;height:44px;border-radius:8px;border:1px solid transparent;
    background:transparent;color:var(--text-dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;position:relative;
  }
  .tool-btn:hover{background:rgba(0,212,255,0.1);color:var(--cyan)}
  .tool-btn.active{background:rgba(0,212,255,0.18);border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(0,212,255,0.35)}
  .tool-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
  .tool-btn .tip{
    position:absolute;left:54px;top:50%;transform:translateY(-50%);
    background:var(--bg-panel-solid);border:1px solid var(--border-glow);
    padding:4px 10px;border-radius:5px;font-size:12px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .2s;color:var(--text);
  }
  .tool-btn:hover .tip{opacity:1}
  .tool-divider{height:1px;background:var(--border-glow);margin:4px 6px}

  /* 右侧面板容器 */
  .right-panels{
    position:absolute;right:16px;top:72px;bottom:64px;width:320px;z-index:15;
    display:flex;flex-direction:column;gap:12px;
  }
  .panel{
    background:var(--bg-panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border-glow);border-radius:12px;
    box-shadow:0 8px 32px rgba(0,0,0,0.5);overflow:hidden;
    display:flex;flex-direction:column;
  }
  .panel-header{
    padding:12px 16px;border-bottom:1px solid var(--border-glow);
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(0,212,255,0.05);
  }
  .panel-title{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--cyan);text-transform:uppercase}
  .panel-count{font-size:12px;color:var(--text-dim);background:rgba(0,212,255,0.1);padding:2px 8px;border-radius:10px}
  .panel-body{padding:10px;overflow-y:auto;flex:1}
  .panel-body::-webkit-scrollbar{width:6px}
  .panel-body::-webkit-scrollbar-track{background:transparent}
  .panel-body::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.2);border-radius:3px}
  .panel-body::-webkit-scrollbar-thumb:hover{background:rgba(0,212,255,0.4)}

  /* 设备列表 */
  .device-list-panel{flex:1;min-height:0}
  .device-card{
    background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);
    border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;
    transition:all .2s;display:flex;align-items:center;gap:10px;
  }
  .device-card:hover{background:rgba(0,212,255,0.06);border-color:rgba(0,212,255,0.2)}
  .device-card.selected{background:rgba(0,212,255,0.12);border-color:var(--cyan);box-shadow:0 0 12px rgba(0,212,255,0.2)}
  .device-icon{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .device-icon svg{width:16px;height:16px;stroke:#0a1628;fill:none;stroke-width:2}
  .device-info{flex:1;min-width:0}
  .device-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .device-meta{font-size:11px;color:var(--text-dim);margin-top:2px}
  .device-actions{display:flex;gap:4px}
  .device-action-btn{width:24px;height:24px;border-radius:4px;border:none;background:transparent;color:var(--text-mute);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .device-action-btn:hover{background:rgba(255,255,255,0.08);color:var(--text)}
  .device-action-btn.delete:hover{color:var(--red)}
  .device-action-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
  .empty-state{text-align:center;padding:30px 10px;color:var(--text-mute);font-size:13px}
  .empty-state svg{width:40px;height:40px;stroke:var(--text-mute);fill:none;stroke-width:1.2;margin:0 auto 10px;display:block;opacity:.5}

  /* 树结构 */
  .tree-group{margin-bottom:6px}
  .tree-group-header{
    display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;
    background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.15);
    border-radius:6px;transition:all .2s;user-select:none;
  }
  .tree-group-header:hover{background:rgba(0,212,255,0.12);border-color:rgba(0,212,255,0.3)}
  .tree-toggle{
    width:14px;height:14px;display:flex;align-items:center;justify-content:center;
    transition:transform .2s;color:var(--cyan);flex-shrink:0;
  }
  .tree-toggle svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.5}
  .tree-group.collapsed .tree-toggle{transform:rotate(-90deg)}
  .tree-group-icon{
    width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .tree-group-icon svg{width:13px;height:13px;stroke:#0a1628;fill:none;stroke-width:2}
  .tree-group-name{flex:1;font-size:13px;font-weight:600;color:var(--text)}
  .tree-group-count{font-size:11px;color:var(--text-dim);background:rgba(0,212,255,0.1);padding:2px 8px;border-radius:10px}
  .tree-children{padding:6px 0 0 14px;margin-left:10px;border-left:1px dashed rgba(0,212,255,0.2);overflow:hidden}
  .tree-group.collapsed .tree-children{display:none}
  .tree-device{
    display:flex;align-items:center;gap:8px;padding:7px 10px;margin-bottom:4px;
    border-radius:6px;cursor:pointer;transition:all .15s;border:1px solid transparent;
  }
  .tree-device:hover{background:rgba(0,212,255,0.06)}
  .tree-device.selected{background:rgba(0,212,255,0.12);border-color:var(--cyan)}
  .tree-device-checkbox{
    width:14px;height:14px;border-radius:3px;border:1.5px solid var(--text-mute);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;
    transition:all .15s;
  }
  .tree-device-checkbox.checked{background:var(--cyan);border-color:var(--cyan)}
  .tree-device-checkbox.checked svg{display:block}
  .tree-device-checkbox svg{display:none;width:9px;height:9px;stroke:#0a1628;fill:none;stroke-width:3}
  .tree-device-icon{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .tree-device-icon svg{width:11px;height:11px;stroke:#0a1628;fill:none;stroke-width:2}
  .tree-device-info{flex:1;min-width:0}
  .tree-device-name{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tree-device-meta{font-size:10px;color:var(--text-dim);margin-top:1px}
  .tree-device-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
  .tree-device:hover .tree-device-actions{opacity:1}

  /* 图层管理 */
  .layer-manager-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 4px 10px;border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:8px;
  }
  .layer-manager-title{font-size:11px;color:var(--text-dim);font-weight:600;letter-spacing:1px;text-transform:uppercase}
  .layer-add-btn{
    width:24px;height:24px;border-radius:5px;border:1px solid rgba(0,212,255,0.3);
    background:rgba(0,212,255,0.08);color:var(--cyan);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .15s;
  }
  .layer-add-btn:hover{background:rgba(0,212,255,0.2);border-color:var(--cyan)}
  .layer-add-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}
  .tree-group.active-layer .tree-group-header{
    background:rgba(0,212,255,0.15);border-color:var(--cyan);
    box-shadow:0 0 10px rgba(0,212,255,0.15);
  }
  .active-badge{
    font-size:9px;background:var(--cyan);color:#0a1628;padding:1px 6px;border-radius:8px;
    font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  }
  .tree-layer-visibility{
    width:20px;height:20px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--text-dim);transition:color .15s;flex-shrink:0;
  }
  .tree-layer-visibility:hover{color:var(--cyan)}
  .tree-layer-visibility.hidden{color:var(--text-mute);opacity:.5}
  .tree-layer-visibility svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
  .tree-empty-hint{
    padding:10px;text-align:center;color:var(--text-mute);font-size:11px;
    border:1px dashed rgba(255,255,255,0.1);border-radius:6px;font-style:italic;
  }
  .tree-children.drag-over{
    background:rgba(0,212,255,0.1);border:1px dashed var(--cyan);border-radius:6px;
  }
  .tree-device[draggable="true"]{cursor:grab}
  .tree-device[draggable="true"]:active{cursor:grabbing}

  /* 属性编辑面板 */
  .props-panel{flex-shrink:0;max-height:340px}
  .form-group{margin-bottom:10px}
  .form-label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:4px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
  .form-input,.form-select{
    width:100%;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.1);
    border-radius:6px;padding:7px 10px;color:var(--text);font-family:'Rajdhani',sans-serif;
    font-size:13px;outline:none;transition:all .2s;
  }
  .form-input:focus,.form-select:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,212,255,0.12)}
  .form-row{display:flex;gap:8px}
  .form-row .form-group{flex:1}
  .color-swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .color-swatch{width:24px;height:24px;border-radius:5px;cursor:pointer;border:2px solid transparent;transition:all .15s}
  .color-swatch:hover{transform:scale(1.1)}
  .color-swatch.active{border-color:#fff;box-shadow:0 0 8px currentColor}
  .color-picker-wrapper{display:flex;align-items:center;gap:8px;margin-top:6px}
  .color-picker-input{
    width:40px;height:32px;border:1px solid var(--border-glow);border-radius:6px;
    background:transparent;cursor:pointer;padding:2px;
  }
  .color-picker-input::-webkit-color-swatch-wrapper{padding:0}
  .color-picker-input::-webkit-color-swatch{border:none;border-radius:4px}
  .color-picker-input::-moz-color-swatch{border:none;border-radius:4px}
  .color-picker-text{font-size:12px;color:var(--text-dim);font-family:'Rajdhani',sans-serif}
  .color-picker-hex{
    background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.1);border-radius:6px;
    padding:6px 10px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:12px;
    width:90px;outline:none;text-transform:uppercase;
  }
  .color-picker-hex:focus{border-color:var(--cyan)}

  /* 底部统计栏 */
  .stats-bar{
    position:absolute;bottom:16px;left:16px;right:352px;height:44px;z-index:15;
    background:var(--bg-panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border-glow);border-radius:10px;
    display:flex;align-items:center;padding:0 18px;gap:24px;
    box-shadow:0 8px 32px rgba(0,0,0,0.5);
  }
  .stat-item{display:flex;align-items:center;gap:8px}
  .stat-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .stat-value{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:700;color:var(--cyan)}
  .stat-value.amber{color:var(--amber)}
  .stat-divider{width:1px;height:24px;background:var(--border-glow)}
  .stat-spacer{flex:1}
  .stat-type{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim)}
  .stat-type-dot{width:8px;height:8px;border-radius:50%}

  /* 提示信息 */
  .toast-container{position:absolute;top:72px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{
    background:var(--bg-panel-solid);border:1px solid var(--border-glow);
    border-radius:8px;padding:10px 18px;font-size:13px;color:var(--text);
    box-shadow:0 4px 20px rgba(0,0,0,0.5);animation:toastIn .3s ease;
    display:flex;align-items:center;gap:8px;
  }
  .toast.success{border-color:rgba(0,230,168,0.4);color:var(--green)}
  .toast.error{border-color:rgba(255,77,109,0.4);color:var(--red)}
  .toast.info{border-color:var(--border-glow);color:var(--cyan)}
  @keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

  /* 绘制提示 */
  .draw-hint{
    position:absolute;top:72px;left:50%;transform:translateX(-50%);z-index:14;
    background:rgba(255,184,0,0.12);border:1px solid rgba(255,184,0,0.4);
    border-radius:8px;padding:8px 16px;font-size:13px;color:var(--amber);
    backdrop-filter:blur(10px);display:none;align-items:center;gap:8px;
    box-shadow:0 4px 16px rgba(0,0,0,0.4);
  }
  .draw-hint.active{display:flex;animation:toastIn .3s ease}
  .draw-hint svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

  /* 批量操作栏 */
  .batch-bar{
    padding:8px 10px;border-bottom:1px solid var(--border-glow);
    display:flex;gap:6px;align-items:center;background:rgba(0,212,255,0.03);
  }
  .batch-btn{
    flex:1;padding:5px 8px;border-radius:5px;border:1px solid var(--border-glow);
    background:transparent;color:var(--text-dim);font-size:11px;font-weight:600;
    cursor:pointer;transition:all .15s;font-family:'Rajdhani',sans-serif;
  }
  .batch-btn:hover{background:rgba(0,212,255,0.1);color:var(--cyan)}
  .batch-btn.red:hover{background:rgba(255,77,109,0.1);color:var(--red);border-color:rgba(255,77,109,0.3)}
  .batch-info{font-size:11px;color:var(--text-dim);padding:0 4px}

  /* Cesium 样式覆盖 */
  .cesium-viewer-bottom{display:none!important}
  .cesium-widget-credits{display:none!important}
  .cesium-viewer-toolbar{display:none}
  .cesium-viewer-fullscreenContainer{display:none}
  .cesium-viewer-vrContainer{display:none}

  /* 加载遮罩 */
  .loader{
    position:absolute;inset:0;background:var(--bg-deep);z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  }
  .loader.hidden{display:none}
  .loader-ring{
    width:50px;height:50px;border:3px solid rgba(0,212,255,0.15);
    border-top-color:var(--cyan);border-radius:50%;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader-text{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--cyan);letter-spacing:2px}
</style>
</head>
<body>
<div id="cesiumContainer"></div>

<!-- 加载遮罩 -->
<div class="loader" id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text">正在初始化地图引擎...</div>
</div>

<!-- 顶部导航栏 -->
<div class="topbar">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
    </div>
    <div class="logo-text">GIS<span>·</span>设备部署推演</div>
  </div>
  <input type="text" class="scene-name" id="sceneName" value="未命名方案" placeholder="方案名称">
  <div class="topbar-spacer"></div>
  <button class="top-btn" id="btnSave"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>保存</button>
  <button class="top-btn" id="btnLoad"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>加载</button>
  <button class="top-btn amber" id="btnExport"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>导出清单</button>

<script src="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Cesium.js"></script>
<script>
// ============ 全局配置 ============
const CESIUM_ION_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI2OTdlOWVlMS05OWY0LTRkZGYtYjcyMi1hMmU4MjUwOWQxYWIiLCJpZCI6NDQ1Nzk1LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODE3MDg1MzJ9.1JuRUIGwq5aYk2ImhGfPS0GHrhpOLmTSJ41oUq01BsE';
const STORAGE_KEY = 'hs_simulation_scene';
const DEVICE_COLORS = ['#00d4ff','#ffb800','#00e6a8','#ff4d6d','#b388ff','#ff8a65'];
const TYPE_LABELS = {circle:'圆形覆盖',sector:'扇形覆盖',polygon:'多边形覆盖',point:'设备点位'};
const TYPE_ICONS = {
  circle:'<circle cx="12" cy="12" r="9"/>',
  sector:'<circle cx="12" cy="12" r="9"/><path d="M12 12 L12 3 A9 9 0 0 1 21 12 Z" fill="currentColor" fill-opacity="0.3"/>',
  polygon:'<polygon points="12 2 22 8.5 18 19 6 19 2 8.5"/>',
  point:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>'
};

// ============ 状态管理 ============
let viewer = null;
let devices = []; // 设备数据数组
let layers = []; // 图层数组：{id, name, color, visible}
let selectedId = null; // 当前选中设备ID
let currentTool = 'select'; // 当前工具
let drawHandler = null; // 绘制事件处理器
let tempEntities = []; // 临时实体
let polygonPoints = []; // 多边形绘制临时点
let batchSelectMode = false;
let batchSelectedIds = new Set(); // 批量选中的设备ID
let deviceCounter = 0;
let layerCounter = 0;
let collapsedLayers = new Set(); // 折叠的图层ID
let activeLayerId = null; // 当前活动图层（新设备添加到此图层）
let draggedNodeId = null; // 正在拖拽的节点ID
let dragOverLayerId = null; // 拖拽悬停的图层ID
// 框选相关（多边形辅助点模式）
let boxSelectPoints = []; // 框选辅助点数组 [{lon, lat}]
let boxSelectEntity = null; // 框选多边形实体
let boxSelectPointsEntities = []; // 辅助点实体
let boxSelectLineEntity = null; // 辅助线实体
// 拖拽相关
let isDragging = false;
let dragStartCartesian = null; // 拖拽起点（世界坐标）
let dragStartPositions = new Map(); // 设备ID -> 起点位置
let dragModified = false; // 是否实际发生了移动

// 初始化默认图层
function initDefaultLayers(){
  layers = [{
    id: 'layer_default',
    name: '默认图层',
    color: '#00d4ff',
    visible: true
  }];
  activeLayerId = 'layer_default';
  layerCounter = 1;
}

// ============ 初始化 Cesium ============
function initCesium(){
  // 使用 Cesium ion 默认地图服务
  Cesium.Ion.defaultAccessToken = CESIUM_ION_TOKEN;
  // 初始化默认图层
  initDefaultLayers();

  viewer = new Cesium.Viewer('cesiumContainer',{
    animation:false,
    baseLayerPicker:false,
    fullscreenButton:false,
    geocoder:false,
    homeButton:false,
    infoBox:false,
    sceneModePicker:false,
    selectionIndicator:false,
    timeline:false,
    navigationHelpButton:false,
    navigationInstructionsInitiallyVisible:false,
    // 仅显示全球影像底图，不加载地形
    baseLayer:Cesium.ImageryLayer.fromProviderAsync(
      Cesium.IonImageryProvider.fromAssetId(2)
    ),
    terrainProvider:undefined
  });

  // 关闭地形（使用纯椭球）
  viewer.scene.globe.terrainProvider = new Cesium.EllipsoidTerrainProvider();

  // 初始视角 - 北京
  viewer.camera.setView({
    destination:Cesium.Cartesian3.fromDegrees(116.4074, 39.9042, 50000),
    orientation:{heading:Cesium.Math.toRadians(0), pitch:Cesium.Math.toRadians(-45), roll:0}
  });

  // 点击选中
  viewer.screenSpaceEventHandler.setInputAction(onMapClick, Cesium.ScreenSpaceEventType.LEFT_CLICK);
  // 悬停
  viewer.screenSpaceEventHandler.setInputAction(onMapHover, Cesium.ScreenSpaceEventType.MOUSE_MOVE);
  // 左键按下（拖拽起点）
  viewer.screenSpaceEventHandler.setInputAction(onMapLeftDown, Cesium.ScreenSpaceEventType.LEFT_DOWN);
  // 左键抬起（拖拽结束）
  viewer.screenSpaceEventHandler.setInputAction(onMapLeftUp, Cesium.ScreenSpaceEventType.LEFT_UP);
  // 双击完成多边形绘制
  viewer.screenSpaceEventHandler.setInputAction(onMapDoubleClick, Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);
  // 右键双击退出框选模式
  viewer.screenSpaceEventHandler.setInputAction(onMapRightDoubleClick, Cesium.ScreenSpaceEventType.RIGHT_DOUBLE_CLICK);
  // 禁用默认右键菜单
  viewer.canvas.oncontextmenu = function(){return false;};

  document.getElementById('loader').classList.add('hidden');
  showToast('地图加载完成，Cesium ion 已连接','success');
}

// ============ 地图交互 ============
function onMapClick(click){
  // 框选模式：左键点击添加辅助点
  if(currentTool === 'boxselect'){
    const cartesian = viewer.camera.pickEllipsoid(click.position, viewer.scene.globe.ellipsoid);
    if(!cartesian) return;
    const carto = Cesium.Cartographic.fromCartesian(cartesian);
    const lon = Cesium.Math.toDegrees(carto.longitude);
    const lat = Cesium.Math.toDegrees(carto.latitude);
    boxSelectPoints.push({lon, lat});
    updateBoxSelectPreview();
    if(boxSelectPoints.length >= 2){
      document.getElementById('drawHintText').textContent = '已添加 '+boxSelectPoints.length+' 个辅助点，继续点击添加，双击左键完成，双击右键退出';
    }else{
      document.getElementById('drawHintText').textContent = '已添加 '+boxSelectPoints.length+' 个辅助点，至少需要 2 个点形成多边形';
    }
    return;
  }
  // select 工具下，点击空白处取消选择；点击设备由 LEFT_DOWN/UP 处理拖拽，但仍需 CLICK 处理选中
  if(currentTool === 'select'){
    const picked = viewer.scene.pick(click.position);
    if(Cesium.defined(picked) && picked.id && picked.id._hsDeviceId){
      // 点击设备：选中（拖拽由 LEFT_DOWN 处理）
      selectDevice(picked.id._hsDeviceId);
    }else{
      // 点击空白：取消选择
      selectDevice(null);
    }
    return;
  }

  const cartesian = viewer.camera.pickEllipsoid(click.position, viewer.scene.globe.ellipsoid);
  if(!cartesian) return;
  const carto = Cesium.Cartographic.fromCartesian(cartesian);
  const lon = Cesium.Math.toDegrees(carto.longitude);
  const lat = Cesium.Math.toDegrees(carto.latitude);

  if(currentTool === 'point'){
    addDevice('point',{position:{lon,lat,height:0}});
    showToast('已添加设备点位','success');
    setTool('select');
  }else if(currentTool === 'circle'){
    addDevice('circle',{position:{lon,lat,height:0},radius:200});
    showToast('已添加圆形覆盖','success');
    setTool('select');
  }else if(currentTool === 'sector'){
    addDevice('sector',{position:{lon,lat,height:0},radius:200,startAngle:0,endAngle:90});
    showToast('已添加扇形覆盖','success');
    setTool('select');
  }else if(currentTool === 'polygon'){
    polygonPoints.push({lon,lat});
    updatePolygonPreview();
    if(polygonPoints.length >= 3){
      document.getElementById('drawHintText').textContent = '继续点击添加顶点，双击或按 Enter 完成';
    }
  }else if(currentTool === 'locate'){
    viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lon,lat,5000),duration:1.5});
    setTool('select');
  }
}

// 左键按下：拖拽起点（仅 select 工具）
function onMapLeftDown(movement){
  if(currentTool === 'select'){
    // 检查是否点中设备
    const picked = viewer.scene.pick(movement.position);
    if(Cesium.defined(picked) && picked.id && picked.id._hsDeviceId){
      const deviceId = picked.id._hsDeviceId;
      // 确定要拖拽的设备集合
      let dragIds = [];
      if(batchSelectedIds.has(deviceId)){
        // 批量选中包含该设备，拖拽所有批量选中的设备
        dragIds = [...batchSelectedIds];
      }else{
        // 单个设备拖拽
        dragIds = [deviceId];
      }
      // 准备拖拽
      isDragging = true;
      dragModified = false;
      dragStartPositions.clear();
      const startCart = viewer.camera.pickEllipsoid(movement.position, viewer.scene.globe.ellipsoid);
      dragStartCartesian = startCart;
      dragIds.forEach(id=>{
        const d = devices.find(x=>x.id===id);
        if(d){
          dragStartPositions.set(id, {
            position:{...d.position},
            polygonPoints: d.polygonPoints ? d.polygonPoints.map(p=>({...p})) : null
          });
        }
      });
      // 禁用相机操作以便拖拽
      viewer.scene.screenSpaceCameraController.enableRotate = false;
      viewer.scene.screenSpaceCameraController.enableTranslate = false;
      viewer.scene.screenSpaceCameraController.enableZoom = false;
      viewer.container.style.cursor = 'grabbing';
    }
  }
}

// 左键抬起：完成拖拽
function onMapLeftUp(movement){
  if(isDragging){
    isDragging = false;
    viewer.scene.screenSpaceCameraController.enableRotate = true;
    viewer.scene.screenSpaceCameraController.enableTranslate = true;
    viewer.scene.screenSpaceCameraController.enableZoom = true;
    viewer.container.style.cursor = 'default';
    if(dragModified){
      showToast('已移动 '+dragStartPositions.size+' 个设备','success');
      updateUI();
    }
    dragStartPositions.clear();
    dragStartCartesian = null;
    dragModified = false;
  }
}

// 左键双击：完成多边形绘制 或 完成框选
function onMapDoubleClick(){
  if(currentTool === 'polygon' && polygonPoints.length >= 3){
    finishPolygon();
  }else if(currentTool === 'boxselect' && boxSelectPoints.length >= 2){
    finishBoxSelect();
  }
}

// 右键双击：退出框选模式
function onMapRightDoubleClick(){
  if(currentTool === 'boxselect'){
    cancelBoxSelect();
    showToast('已退出框选模式','info');
    setTool('select');
  }
}

function onMapHover(movement){
  // 拖拽中
  if(isDragging && dragStartCartesian){
    const currentCart = viewer.camera.pickEllipsoid(movement.endPosition, viewer.scene.globe.ellipsoid);
    if(currentCart){
      // 计算偏移量（经纬度差）
      const startCarto = Cesium.Cartographic.fromCartesian(dragStartCartesian);
      const currentCarto = Cesium.Cartographic.fromCartesian(currentCart);
      const dLon = Cesium.Math.toDegrees(currentCarto.longitude) - Cesium.Math.toDegrees(startCarto.longitude);
      const dLat = Cesium.Math.toDegrees(currentCarto.latitude) - Cesium.Math.toDegrees(startCarto.latitude);
      if(Math.abs(dLon) > 1e-9 || Math.abs(dLat) > 1e-9){
        dragModified = true;
        // 应用偏移到所有拖拽中的设备
        dragStartPositions.forEach((startPos, id)=>{
          const d = devices.find(x=>x.id===id);
          if(d){
            d.position = {
              lon: startPos.position.lon + dLon,
              lat: startPos.position.lat + dLat,
              height: startPos.position.height || 0
            };
            if(d.type === 'polygon' && startPos.polygonPoints){
              d.polygonPoints = startPos.polygonPoints.map(p=>({
                lon: p.lon + dLon,
                lat: p.lat + dLat
              }));
            }
            renderDeviceEntity(d);
          }
        });
      }
    }
    return;
  }
  // 框选预览（鼠标悬停时显示预览线）
  if(currentTool === 'boxselect' && boxSelectPoints.length > 0){
    const cartesian = viewer.camera.pickEllipsoid(movement.endPosition, viewer.scene.globe.ellipsoid);
    if(cartesian){
      const carto = Cesium.Cartographic.fromCartesian(cartesian);
      const lon = Cesium.Math.toDegrees(carto.longitude);
      const lat = Cesium.Math.toDegrees(carto.latitude);
      updateBoxSelectPreview({lon, lat});
    }
    return;
  }
  // 多边形预览
  if(currentTool === 'polygon' && polygonPoints.length > 0){
    const cartesian = viewer.camera.pickEllipsoid(movement.endPosition, viewer.scene.globe.ellipsoid);
    if(cartesian){
      const carto = Cesium.Cartographic.fromCartesian(cartesian);
      const lon = Cesium.Math.toDegrees(carto.longitude);
      const lat = Cesium.Math.toDegrees(carto.latitude);
      updatePolygonPreview({lon,lat});
    }
  }
}

// 更新框选预览（辅助点 + 连线 + 鼠标悬停预览）
function updateBoxSelectPreview(hoverPoint){
  // 清除旧实体
  boxSelectPointsEntities.forEach(e=>viewer.entities.remove(e));
  boxSelectPointsEntities = [];
  if(boxSelectLineEntity){viewer.entities.remove(boxSelectLineEntity);boxSelectLineEntity=null}
  if(boxSelectEntity){viewer.entities.remove(boxSelectEntity);boxSelectEntity=null}

  if(boxSelectPoints.length === 0) return;

  // 绘制辅助点（带序号标签）
  boxSelectPoints.forEach((p, i)=>{
    boxSelectPointsEntities.push(viewer.entities.add({
      position:Cesium.Cartesian3.fromDegrees(p.lon, p.lat),
      point:{
        pixelSize:10,
        color:Cesium.Color.fromCssColorString('#ffb800'),
        outlineColor:Cesium.Color.WHITE,
        outlineWidth:2
      },
      label:{
        text:String(i+1),
        font:'600 11px Rajdhani',
        fillColor:Cesium.Color.WHITE,
        outlineColor:Cesium.Color.BLACK,outlineWidth:2,style:Cesium.LabelStyle.FILL_AND_OUTLINE,
        verticalOrigin:Cesium.VerticalOrigin.CENTER,
        horizontalOrigin:Cesium.HorizontalOrigin.CENTER,
        pixelOffset:new Cesium.Cartesian2(0,-16)
      }
    }));
  });

  // 构建点序列（含悬停点）
  const pts = [...boxSelectPoints];
  if(hoverPoint) pts.push(hoverPoint);

  // 2个点以上：绘制连线
  if(pts.length >= 2){
    boxSelectLineEntity = viewer.entities.add({
      polyline:{
        positions:Cesium.Cartesian3.fromDegreesArray(pts.flatMap(p=>[p.lon,p.lat])),
        width:2,
        material:Cesium.Color.fromCssColorString('#00d4ff'),
        clampToGround:true
      }
    });
  }

  // 3个点以上：绘制填充多边形预览
  if(pts.length >= 3){
    boxSelectEntity = viewer.entities.add({
      polygon:{
        hierarchy:new Cesium.PolygonHierarchy(Cesium.Cartesian3.fromDegreesArray(pts.flatMap(p=>[p.lon,p.lat]))),
        material:Cesium.Color.fromCssColorString('#00d4ff').withAlpha(0.15),
        outline:true,outlineColor:Cesium.Color.fromCssColorString('#00d4ff'),outlineWidth:2
      }
    });
  }
}

// 完成框选：选中多边形内的设备
function finishBoxSelect(){
  if(boxSelectPoints.length < 2){
    showToast('至少需要 2 个辅助点','error');
    return;
  }
  // 清空之前的选择
  batchSelectedIds.clear();
  selectedId = null;

  // 找出在多边形内的设备（点在多边形内判断）
  let count = 0;
  devices.forEach(d=>{
    if(pointInPolygon(d.position.lon, d.position.lat, boxSelectPoints)){
      batchSelectedIds.add(d.id);
      count++;
    }
  });

  // 如果只选中一个，设为单选
  if(count === 1){
    selectedId = [...batchSelectedIds][0];
    batchSelectedIds.clear();
  }else if(count > 1){
    selectedId = [...batchSelectedIds][0];
  }

  // 清理框选辅助实体
  clearBoxSelectEntities();
  boxSelectPoints = [];

  // 重新渲染所有实体以更新选中态
  devices.forEach(d=>renderDeviceEntity(d));
  updateUI();
  if(count > 0){
    showToast('框选了 '+count+' 个设备','success');
  }else{
    showToast('未选中任何设备','info');
  }
}

// 取消框选
function cancelBoxSelect(){
  clearBoxSelectEntities();
  boxSelectPoints = [];
}

function clearBoxSelectEntities(){
  boxSelectPointsEntities.forEach(e=>viewer.entities.remove(e));
  boxSelectPointsEntities = [];
  if(boxSelectLineEntity){viewer.entities.remove(boxSelectLineEntity);boxSelectLineEntity=null}
  if(boxSelectEntity){viewer.entities.remove(boxSelectEntity);boxSelectEntity=null}
}

// 点在多边形内判断（射线法）
function pointInPolygon(lon, lat, polygon){
  let inside = false;
  for(let i=0, j=polygon.length-1; i<polygon.length; j=i++){
    const xi = polygon[i].lon, yi = polygon[i].lat;
    const xj = polygon[j].lon, yj = polygon[j].lat;
    const intersect = ((yi > lat) !== (yj > lat)) &&
      (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if(intersect) inside = !inside;
  }
  return inside;
}

// 多边形预览
function updatePolygonPreview(hoverPoint){
  tempEntities.forEach(e=>viewer.entities.remove(e));
  tempEntities = [];
  if(polygonPoints.length === 0) return;
  const pts = [...polygonPoints];
  if(hoverPoint) pts.push(hoverPoint);
  // 绘制连线
  if(pts.length >= 2){
    tempEntities.push(viewer.entities.add({
      polyline:{
        positions:Cesium.Cartesian3.fromDegreesArray(pts.flatMap(p=>[p.lon,p.lat])),
        width:2,material:Cesium.Color.fromCssColorString('#00d4ff'),
        clampToGround:true
      }
    }));
  }
  // 绘制顶点
  pts.forEach((p,i)=>{
    tempEntities.push(viewer.entities.add({
      position:Cesium.Cartesian3.fromDegrees(p.lon,p.lat),
      point:{pixelSize:8,color:Cesium.Color.fromCssColorString(i<polygonPoints.length?'#00d4ff':'#ffb800'),outlineColor:Cesium.Color.WHITE,outlineWidth:2}
    }));
  });
}

function finishPolygon(){
  if(polygonPoints.length < 3){showToast('多边形至少需要3个顶点','error');return}
  const center = polygonCenter(polygonPoints);
  addDevice('polygon',{position:center,polygonPoints:[...polygonPoints]});
  polygonPoints = [];
  tempEntities.forEach(e=>viewer.entities.remove(e));
  tempEntities = [];
  showToast('已添加多边形覆盖','success');
  setTool('select');
}

function polygonCenter(pts){
  let lon=0,lat=0;
  pts.forEach(p=>{lon+=p.lon;lat+=p.lat});
  return {lon:lon/pts.length,lat:lat/pts.length,height:0};
}

  const defaults = {

  const color = Cesium.Color.fromCssColorString(device.color);

  const isSelected = device.id === selectedId;

      ellipse:{
        semiMajorAxis:new Cesium.CallbackProperty(()=>device.radius,true),
        semiMinorAxis:new Cesium.CallbackProperty(()=>device.radius,true),
        material:colorFill,
        outline:true,outlineColor:color,outlineWidth,
        height:0
      },
      label:{
        text:device.name,
        font:'600 13px Rajdhani',
        fillColor:Cesium.Color.WHITE,

        verticalOrigin:Cesium.VerticalOrigin.BOTTOM,pixelOffset:new Cesium.Cartesian2(0,-8),
        showBackground:true,backgroundColor:color.withAlpha(0.7),backgroundPadding:new Cesium.Cartesian2(6,4)
      }
    });
  }else if(device.type === 'sector'){
    const positions = computeSectorPositions(device);
    entity = viewer.entities.add({
      polygon:{
        hierarchy:new Cesium.PolygonHierarchy(positions),
        material:colorFill,
        outline:true,outlineColor:color,outlineWidth
      },
      label:{
        text:device.name,
        font:'600 13px Rajdhani',
        fillColor:Cesium.Color.WHITE,
        outlineColor:Cesium.Color.BLACK,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE,
        verticalOrigin:Cesium.VerticalOrigin.BOTTOM,pixelOffset:new Cesium.Cartesian2(0,-8),
        showBackground:true,backgroundColor:color.withAlpha(0.7),backgroundPadding:new Cesium.Cartesian2(6,4)
      }
    });
  }else if(device.type === 'polygon'){
    const positions = Cesium.Cartesian3.fromDegreesArray(device.polygonPoints.flatMap(p=>[p.lon,p.lat]));
    entity = viewer.entities.add({
      polygon:{
        hierarchy:new Cesium.PolygonHierarchy(positions),
        material:colorFill,
        outline:true,outlineColor:color,outlineWidth
      },
      label:{
        text:device.name,
        font:'600 13px Rajdhani',
        fillColor:Cesium.Color.WHITE,
        outlineColor:Cesium.Color.BLACK,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE,
        verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
        position:Cesium.Cartesian3.fromDegrees(device.position.lon,device.position.lat,device.position.height),
        showBackground:true,backgroundColor:color.withAlpha(0.7),backgroundPadding:new Cesium.Cartesian2(6,4)
      }
    });
  }else if(device.type === 'point'){
    entity = viewer.entities.add({
      position:Cesium.Cartesian3.fromDegrees(device.position.lon,device.position.lat,device.position.height),
      point:{
        pixelSize:showHighlight?16:12,
        color:color,
        outlineColor:showHighlight?Cesium.Color.fromCssColorString('#ffb800'):Cesium.Color.WHITE,outlineWidth:3
      },
      label:{
        text:device.name,
        font:'600 13px Rajdhani',
        fillColor:Cesium.Color.WHITE,
        outlineColor:Cesium.Color.BLACK,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE,
        verticalOrigin:Cesium.VerticalOrigin.BOTTOM,pixelOffset:new Cesium.Cartesian2(0,-12),
        showBackground:true,backgroundColor:color.withAlpha(0.7),backgroundPadding:new Cesium.Cartesian2(6,4)
      }
    });
  }
  if(entity){

  }
}

// 计算扇形顶点
function computeSectorPositions(device){
  const positions = [];
  const center = device.position;
  positions.push(Cesium.Cartesian3.fromDegrees(center.lon,center.lat,center.height));
  const radius = device.radius;
  const startRad = Cesium.Math.toRadians(device.startAngle);
  const endRad = Cesium.Math.toRadians(device.endAngle);
  const steps = 32;
  for(let i=0;i<=steps;i++){
    const angle = startRad + (endRad-startRad)*(i/steps);
    // 简化：用经纬度偏移近似（小范围足够）
    const dLon = (radius * Math.sin(angle)) / (111320 * Math.cos(Cesium.Math.toRadians(center.lat)));
    const dLat = (radius * Math.cos(angle)) / 111320;
    positions.push(Cesium.Cartesian3.fromDegrees(center.lon+dLon, center.lat+dLat, center.height));
  }
  return positions;
}

function removeDeviceEntity(id){
  const entities = viewer.entities.values;
  for(let i=entities.length-1;i>=0;i--){
    if(entities[i]._hsDeviceId === id){
      viewer.entities.remove(entities[i]);
    }
  }
}

function selectDevice(id){
  selectedId = id;
  // 单选时清空批量选择
  if(id){
    batchSelectedIds.clear();
  }
  // 重新渲染所有实体以更新选中态
  devices.forEach(d=>renderDeviceEntity(d));
  updateUI();
}

// 切换批量选中（树结构复选框）
function toggleBatchSelect(id){
  if(batchSelectedIds.has(id)){
    batchSelectedIds.delete(id);
  }else{
    batchSelectedIds.add(id);
  }
  // 如果批量选中只有一个，设为主选中
  if(batchSelectedIds.size === 1){
    selectedId = [...batchSelectedIds][0];
  }else if(batchSelectedIds.size === 0){
    selectedId = null;
  }else{
    // 多选时主选中第一个
    selectedId = [...batchSelectedIds][0];
  }
  devices.forEach(d=>renderDeviceEntity(d));
  updateUI();
}

function deleteDevice(id){
  devices = devices.filter(d=>d.id!==id);
  removeDeviceEntity(id);
  if(selectedId===id) selectedId=null;
  batchSelectedIds.delete(id);
  updateUI();
  showToast('已删除设备','info');
}

function duplicateDevice(id){
  const src = devices.find(d=>d.id===id);
  if(!src) return;
  deviceCounter++;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = 'dev_'+Date.now()+'_'+deviceCounter;
  copy.name = src.name + '-副本';
  copy.position = {lon:src.position.lon+0.001, lat:src.position.lat+0.001, height:src.position.height||0};
  if(src.polygonPoints){
    copy.polygonPoints = src.polygonPoints.map(p=>({lon:p.lon+0.001,lat:p.lat+0.001}));
  }
  copy.createdAt = new Date().toISOString();
  devices.push(copy);
  renderDeviceEntity(copy);
  selectDevice(copy.id);
  updateUI();
  showToast('已复制设备','success');
}

function updateDevice(id, updates){
  const device = devices.find(d=>d.id===id);
  if(!device) return;
  Object.assign(device, updates);
  renderDeviceEntity(device);
  updateUI();
}

// ============ 图层管理 ============
function addLayer(){
  layerCounter++;
  const colors = ['#00d4ff','#ffb800','#00e6a8','#ff4d6d','#a78bfa','#fb923c'];
  const newLayer = {
    id: 'layer_'+Date.now()+'_'+layerCounter,
    name: '图层 '+layerCounter,
    color: colors[(layerCounter-1)%colors.length],
    visible: true
  };
  layers.push(newLayer);
  activeLayerId = newLayer.id;
  renderDeviceList();
  showToast('已创建图层：'+newLayer.name+'，并设为活动图层','success');
}

// 切换活动图层
function setActiveLayer(layerId){
  activeLayerId = layerId;
  renderDeviceList();
  const layer = layers.find(l=>l.id===layerId);
  if(layer) showToast('活动图层：'+layer.name,'info');
}

// 切换图层折叠
function toggleLayer(layerId){
  if(collapsedLayers.has(layerId)){
    collapsedLayers.delete(layerId);
  }else{
    collapsedLayers.add(layerId);
  }
  renderDeviceList();
}

// 切换图层可见性
function toggleLayerVisibility(layerId){
  const layer = layers.find(l=>l.id===layerId);
  if(!layer) return;
  layer.visible = !layer.visible;
  // 重新渲染该图层下所有设备
  devices.filter(d=>d.layerId===layerId).forEach(d=>renderDeviceEntity(d));
  renderDeviceList();
  showToast(layer.visible?'显示图层：'+layer.name:'隐藏图层：'+layer.name,'info');
}

// 重命名图层
function renameLayer(layerId){
  const layer = layers.find(l=>l.id===layerId);
  if(!layer) return;
  const newName = prompt('请输入新的图层名称：', layer.name);
  if(newName && newName.trim()){
    layer.name = newName.trim();
    renderDeviceList();
    showToast('图层已重命名','success');
  }
}

// 删除图层
function deleteLayer(layerId){
  const layer = layers.find(l=>l.id===layerId);
  if(!layer) return;
  if(layerId === 'layer_default'){
    showToast('默认图层不可删除','error');
    return;
  }
  const layerDevices = devices.filter(d=>d.layerId===layerId);
  if(layerDevices.length > 0){
    if(!confirm('图层 "'+layer.name+'" 中有 '+layerDevices.length+' 个设备，删除图层将把这些设备移至默认图层。是否继续？')){
      return;
    }
    // 将设备移至默认图层
    layerDevices.forEach(d=>{d.layerId = 'layer_default';});
  }
  layers = layers.filter(l=>l.id!==layerId);
  if(activeLayerId === layerId){
    activeLayerId = 'layer_default';
  }
  renderDeviceList();
  showToast('已删除图层：'+layer.name,'info');
}

// 右键菜单
function showLayerMenu(event, layerId){
  // 简单实现：使用 prompt
  const layer = layers.find(l=>l.id===layerId);
  if(!layer) return;
  const action = prompt('图层 "'+layer.name+'" 操作：\n1. 设为活动图层\n2. 重命名\n3. 删除\n4. 切换可见性\n\n请输入数字（1-4）：');
  if(action === '1') setActiveLayer(layerId);
  else if(action === '2') renameLayer(layerId);
  else if(action === '3') deleteLayer(layerId);
  else if(action === '4') toggleLayerVisibility(layerId);
}

// ============ 设备拖拽到图层 ============
function startDeviceDrag(deviceId){
  draggedNodeId = deviceId;
}

function endDeviceDrag(){
  draggedNodeId = null;
  // 清除所有高亮
  document.querySelectorAll('.tree-children').forEach(el=>el.classList.remove('drag-over'));
}

function highlightLayer(layerId, isOver){
  document.querySelectorAll('.tree-children').forEach(el=>el.classList.remove('drag-over'));
  if(isOver){
    const group = document.querySelector('.tree-group[data-layer-id="'+layerId+'"]');
    if(group){
      group.querySelector('.tree-children').classList.add('drag-over');
    }
  }
}

function dropDeviceToLayer(targetLayerId){
  if(!draggedNodeId) return;
  const device = devices.find(d=>d.id===draggedNodeId);
  if(!device) return;
  if(device.layerId === targetLayerId){
    draggedNodeId = null;
    return;
  }
  device.layerId = targetLayerId;
  renderDeviceEntity(device);
  renderDeviceList();
  const layer = layers.find(l=>l.id===targetLayerId);
  if(layer) showToast('已将 "'+device.name+'" 移至图层：'+layer.name,'success');
  draggedNodeId = null;
}

    ${typeFields}
    <div class="form-row">
      <div class="form-group"><label class="form-label">经度</label><input type="number" class="form-input" value="${d.position.lon.toFixed(6)}" step="0.000001" onchange="updateDevicePosition('${d.id}','lon',Number(this.value))"></div>
      <div class="form-group"><label class="form-label">纬度</label><input type="number" class="form-input" value="${d.position.lat.toFixed(6)}" step="0.000001" onchange="updateDevicePosition('${d.id}','lat',Number(this.value))"></div>
    </div>
    <div class="form-group">
      <label class="form-label">颜色</label>
      <div class="color-swatches">
        ${DEVICE_COLORS.map(c=>`<div class="color-swatch ${c===d.color?'active':''}" style="background:${c};color:${c}" onclick="updateDevice('${d.id}',{color:'${c}'})"></div>`).join('')}
      </div>
      <div class="color-picker-wrapper">
        <input type="color" class="color-picker-input" value="${d.color}" onchange="updateDevice('${d.id}',{color:this.value})">
        <input type="text" class="color-picker-hex" value="${d.color.toUpperCase()}" onchange="updateDeviceColorHex('${d.id}',this.value)">
        <span class="color-picker-text">自定义</span>
      </div>
    </div>
  `;
}

// 通过下拉框移动设备到图层
function moveDeviceToLayer(deviceId, layerId){
  const device = devices.find(d=>d.id===deviceId);
  if(!device) return;
  device.layerId = layerId;
  renderDeviceEntity(device);
  renderDeviceList();
  const layer = layers.find(l=>l.id===layerId);
  if(layer) showToast('已将设备移至图层：'+layer.name,'success');
}

function updateDevicePosition(id, key, val){
  const d = devices.find(x=>x.id===id);
  if(!d) return;
  d.position[key] = val;
  if(d.type==='polygon'){
    // 多边形整体平移
    // 简化处理：仅更新中心
  }
  renderDeviceEntity(d);
  updateUI();
}

// 通过十六进制颜色值更新设备颜色
function updateDeviceColorHex(id, hex){
  // 校验并规范化十六进制颜色
  hex = hex.trim();
  if(!/^#[0-9A-Fa-f]{6}$/.test(hex)){
    showToast('颜色格式无效，请使用 #RRGGBB 格式','error');
    renderPropsPanel();
    return;
  }
  updateDevice(id, {color:hex.toLowerCase()});
}

function renderStats(){
  document.getElementById('statTotal').textContent = devices.length;
  const total = devices.reduce((s,d)=>s+(d.unitPrice||0),0);
  document.getElementById('statCost').textContent = '¥'+total.toLocaleString();
  document.getElementById('statCircle').textContent = devices.filter(d=>d.type==='circle').length;
  document.getElementById('statSector').textContent = devices.filter(d=>d.type==='sector').length;
  document.getElementById('statPolygon').textContent = devices.filter(d=>d.type==='polygon').length;
  document.getElementById('statPoint').textContent = devices.filter(d=>d.type==='point').length;
}

// ============ 工具切换 ============
function setTool(tool){
  // 完成未完成的多边形
  if(currentTool==='polygon' && polygonPoints.length>=3 && tool!=='polygon'){
    finishPolygon();
  }
  // 清理框选状态
  if(currentTool==='boxselect'){
    cancelBoxSelect();
  }
  // 恢复相机控制器
  viewer.scene.screenSpaceCameraController.enableRotate = true;
  viewer.scene.screenSpaceCameraController.enableTranslate = true;
  viewer.scene.screenSpaceCameraController.enableZoom = true;

  currentTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.toggle('active', b.dataset.tool===tool));
  const hint = document.getElementById('drawHint');
  const hintText = document.getElementById('drawHintText');
  if(tool==='select'){
    hint.classList.remove('active');
    viewer.container.style.cursor='default';
  }else{
    hint.classList.add('active');
    viewer.container.style.cursor='crosshair';
    const hints = {
      point:'点击地图放置设备点位',
      circle:'点击地图放置圆形覆盖中心',
      sector:'点击地图放置扇形覆盖中心',
      polygon:'点击地图添加多边形顶点，双击完成',
      boxselect:'左键点击地图添加辅助点，2点以上形成多边形，双击左键完成，双击右键退出',
      locate:'点击地图定位到该位置'
    };
    hintText.textContent = hints[tool]||'';
  }
}

// ============ 场景管理 ============
function saveScene(){
  const name = document.getElementById('sceneName').value || '未命名方案';
  const camPos = viewer.camera.positionCartographic;
  const scene = {
    name,
    devices,
    layers,
    activeLayerId,
    cameraView:{
      lon:Cesium.Math.toDegrees(camPos.longitude),
      lat:Cesium.Math.toDegrees(camPos.latitude),
      height:camPos.height,
      heading:Cesium.Math.toDegrees(viewer.camera.heading),
      pitch:Cesium.Math.toDegrees(viewer.camera.pitch)
    },
    savedAt:new Date().toISOString()
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(scene));
  showToast('场景已保存：'+name+'（'+devices.length+' 台设备，'+layers.length+' 个图层）','success');
}

function loadScene(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw){showToast('未找到已保存的场景','error');return}
  try{
    const scene = JSON.parse(raw);
    clearScene(false);
    document.getElementById('sceneName').value = scene.name||'未命名方案';
    devices = scene.devices||[];
    if(scene.layers && scene.layers.length>0){
      layers = scene.layers;
      activeLayerId = scene.activeLayerId || 'layer_default';
      layerCounter = layers.length;
    }
    deviceCounter = devices.length;
    devices.forEach(d=>renderDeviceEntity(d));
    if(scene.cameraView){
      viewer.camera.flyTo({
        destination:Cesium.Cartesian3.fromDegrees(scene.cameraView.lon,scene.cameraView.lat,scene.cameraView.height),
        orientation:{heading:Cesium.Math.toRadians(scene.cameraView.heading||0),pitch:Cesium.Math.toRadians(scene.cameraView.pitch||-45),roll:0},
        duration:1.5
      });
    }
    updateUI();
    showToast('已加载场景：'+scene.name+'（'+devices.length+' 台设备，'+layers.length+' 个图层）','success');
  }catch(e){
    showToast('场景加载失败：'+e.message,'error');
  }
}

function clearScene(showMsg=true){
  devices.forEach(d=>removeDeviceEntity(d.id));
  devices = [];
  selectedId = null;
  batchSelectedIds.clear();
  collapsedLayers.clear();
  polygonPoints = [];
  tempEntities.forEach(e=>viewer.entities.remove(e));
  tempEntities = [];
  clearBoxSelectEntities();
  boxSelectPoints = [];
  isDragging = false;
  // 重置图层为默认
  initDefaultLayers();
  updateUI();
  if(showMsg) showToast('已清空场景','info');
}

// ============ 导出物料清单 ============
function exportBOM(){
  if(devices.length===0){showToast('暂无设备可导出','error');return}
  const name = document.getElementById('sceneName').value || '未命名方案';
  // 按型号聚合
  const groups = {};
  devices.forEach(d=>{
    const key = d.model+'|'+d.unitPrice;
    if(!groups[key]) groups[key] = {model:d.model,unitPrice:d.unitPrice,count:0,types:new Set(),total:0};
    groups[key].count++;
    groups[key].types.add(TYPE_LABELS[d.type]);
    groups[key].total += d.unitPrice;
  });
  const date = new Date().toLocaleString('zh-CN');
  let csv = '\uFEFF基于GIS的智能设备部署推演系统 - 物料清单\n';
  csv += '方案名称,'+name+'\n';
  csv += '导出时间,'+date+'\n';
  csv += '设备总数,'+devices.length+' 台\n';
  csv += '总成本,¥'+devices.reduce((s,d)=>s+(d.unitPrice||0),0).toLocaleString()+'\n\n';
  csv += '序号,设备型号,覆盖类型,单价(元),数量(台),小计(元)\n';
  let idx=1;
  Object.values(groups).forEach(g=>{
    csv += idx+','+g.model+','+[...g.types].join('/')+','+g.unitPrice+','+g.count+','+g.total+'\n';
    idx++;
  });
  csv += '\n设备明细\n';
  csv += '序号,设备名称,设备型号,覆盖类型,经度,纬度,半径(m),起始角(°),结束角(°),单价(元)\n';
  devices.forEach((d,i)=>{
    csv += (i+1)+','+d.name+','+d.model+','+TYPE_LABELS[d.type]+','+
           d.position.lon.toFixed(6)+','+d.position.lat.toFixed(6)+','+
           (d.radius||'')+','+(d.startAngle||'')+','+(d.endAngle||'')+','+(d.unitPrice||0)+'\n';
  });
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name+'_物料清单_'+Date.now()+'.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('物料清单已导出（'+devices.length+' 台设备）','success');
}

// ============ 批量操作 ============
function selectAll(){
  if(batchSelectedIds.size===devices.length){
    batchSelectedIds.clear();
    selectedId = null;
  }else{
    batchSelectedIds.clear();
    devices.forEach(d=>batchSelectedIds.add(d.id));
    selectedId = devices.length>0 ? devices[0].id : null;
  }
  devices.forEach(d=>renderDeviceEntity(d));
  updateUI();
}
function batchDelete(){
  if(batchSelectedIds.size===0){
    // 如果没有批量选中，删除主选中
    if(selectedId){
      deleteDevice(selectedId);
    }else{
      showToast('请先选择设备','error');
    }
    return;
  }
  batchSelectedIds.forEach(id=>{
    removeDeviceEntity(id);
  });
  devices = devices.filter(d=>!batchSelectedIds.has(d.id));
  if(batchSelectedIds.has(selectedId)) selectedId=null;
  batchSelectedIds.clear();
  devices.forEach(d=>renderDeviceEntity(d));
  updateUI();
  showToast('已批量删除','info');
}

// ============ 工具函数 ============
function showToast(msg, type='info'){
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast '+type;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(()=>{
    toast.style.opacity='0';
    toast.style.transition='opacity .3s';
    setTimeout(()=>toast.remove(),300);
  },2500);
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(s){return escapeHtml(s)}

// ============ 事件绑定 ============
document.querySelectorAll('.tool-btn').forEach(btn=>{
  btn.addEventListener('click',()=>setTool(btn.dataset.tool));
});
document.getElementById('btnSave').addEventListener('click',saveScene);
document.getElementById('btnLoad').addEventListener('click',loadScene);
document.getElementById('btnClear').addEventListener('click',()=>{
  if(devices.length===0){showToast('场景已为空','info');return}
  if(confirm('确定清空所有设备吗？此操作不可撤销。')) clearScene();
});
document.getElementById('btnExport').addEventListener('click',exportBOM);
document.getElementById('btnSelectAll').addEventListener('click',selectAll);
document.getElementById('btnBatchDelete').addEventListener('click',batchDelete);

// 双击完成多边形
document.addEventListener('dblclick',()=>{
  if(currentTool==='polygon' && polygonPoints.length>=3) finishPolygon();
});
// Enter 完成多边形
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && currentTool==='polygon' && polygonPoints.length>=3) finishPolygon();
  if(e.key==='Enter' && currentTool==='boxselect' && boxSelectPoints.length>=2) finishBoxSelect();
  if(e.key==='Escape'){
    if(currentTool==='polygon'){
      polygonPoints=[];
      tempEntities.forEach(en=>viewer.entities.remove(en));
      tempEntities=[];
    }
    if(currentTool==='boxselect'){
      cancelBoxSelect();
    }
    setTool('select');
  }
  if(e.key==='Delete'){
    if(batchSelectedIds.size>0){
      batchDelete();
    }else if(selectedId){
      deleteDevice(selectedId);
    }
  }
});
