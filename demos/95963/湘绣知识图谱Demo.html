<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文脉智谱 Demo</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');

    :root {
      --bg: #faf8f3;
      --bg2: #f0ece3;
      --ink: #2c241b;
      --muted: #7a6f5f;
      --rule: #d4ccc0;
      --accent: #a53e2a;
      --accent2: #4a6741;
      --blue: #2c5282;
      --brown: #6b4c3b;
      --purple: #553c2d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif SC', 'Songti SC', serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
    }

    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--bg);
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
    }

    .header .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-left: 12px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 6px 14px;
      border: 1px solid var(--rule);
      background: var(--bg);
      color: var(--ink);
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--bg2);
      border-color: var(--accent);
    }

    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn.primary:hover {
      opacity: 0.9;
    }

    /* Layout */
    .container {
      display: flex;
      height: 100vh;
      padding-top: 56px;
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      background: var(--bg);
      border-right: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--rule);
    }

    .sidebar-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .sidebar-tab.active {
      border-bottom-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .sidebar-tab:hover:not(.active) {
      background: var(--bg2);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* Node Detail Panel */
    .node-detail h3 {
      font-size: 16px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--rule);
    }

    .node-detail .field {
      margin-bottom: 12px;
    }

    .node-detail .field-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .node-detail .field-value {
      font-size: 14px;
      line-height: 1.6;
    }

    .node-detail .tag {
      display: inline-block;
      padding: 2px 8px;
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 3px;
      font-size: 12px;
      margin: 2px 4px 2px 0;
    }

    /* Stats Panel */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--bg2);
      padding: 12px;
      border-radius: 4px;
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Legend */
    .legend {
      margin-top: 20px;
    }

    .legend-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }

    /* Graph Area */
    .graph-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #graph-svg {
      width: 100%;
      height: 100%;
    }

    /* Tooltip */
    .tooltip {
      position: absolute;
      padding: 10px 14px;
      background: var(--ink);
      color: #fff;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      max-width: 280px;
      z-index: 50;
    }

    .tooltip.show {
      opacity: 1;
    }

    /* Search */
    .search-box {
      padding: 12px 16px;
      border-bottom: 1px solid var(--rule);
    }

    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      background: var(--bg);
      color: var(--ink);
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Path result */
    .path-result {
      margin-top: 16px;
      padding: 12px;
      background: var(--bg2);
      border-radius: 4px;
      font-size: 13px;
    }

    .path-result h4 {
      font-size: 13px;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .path-step {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }

    .path-step-arrow {
      margin: 0 6px;
      color: var(--muted);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        width: 280px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div style="display:flex;align-items:center;">
      <h1>文脉智谱</h1>
      <span class="subtitle">湘绣知识图谱 · 概念验证 Demo</span>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="resetZoom()">重置视图</button>
      <button class="btn primary" onclick="toggleAnimation()">暂停动画</button>
    </div>
  </div>

  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索节点（如：鬅毛针、刘爱云）..." onkeyup="handleSearch(event)">
      </div>

      <div class="sidebar-tabs">
        <div class="sidebar-tab active" onclick="switchTab('detail')">节点详情</div>
        <div class="sidebar-tab" onclick="switchTab('stats')">图谱统计</div>
      </div>

      <div class="sidebar-content" id="sidebarDetail">
        <div class="node-detail" id="nodeDetail">
          <p style="color:var(--muted);font-size:13px;text-align:center;padding:40px 0;">
            点击图谱中的节点查看详情<br>
            或拖拽节点调整布局
          </p>
        </div>
      </div>

      <div class="sidebar-content" id="sidebarStats" style="display:none;">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="statNodes">0</div>
            <div class="stat-label">知识节点</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statLinks">0</div>
            <div class="stat-label">关联关系</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statHeritage">0</div>
            <div class="stat-label">非遗项目</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statTechnique">0</div>
            <div class="stat-label">技艺技法</div>
          </div>
        </div>

        <div class="legend">
          <div class="legend-title">节点类型</div>
          <div class="legend-item"><span class="legend-dot" style="background:#a53e2a"></span>非遗项目（Heritage）</div>
          <div class="legend-item"><span class="legend-dot" style="background:#4a6741"></span>技艺技法（Technique）</div>
          <div class="legend-item"><span class="legend-dot" style="background:#2c5282"></span>传承人（Person）</div>
          <div class="legend-item"><span class="legend-dot" style="background:#6b4c3b"></span>原材料（Material）</div>
          <div class="legend-item"><span class="legend-dot" style="background:#553c2d"></span>文献资料（Document）</div>
        </div>

        <div class="legend" style="margin-top:24px;">
          <div class="legend-title">操作说明</div>
          <div style="font-size:12px;color:var(--muted);line-height:1.8;">
            • 滚轮缩放图谱<br>
            • 拖拽空白处平移<br>
            • 拖拽节点调整位置<br>
            • 点击节点查看详情<br>
            • 悬浮显示简要信息
          </div>
        </div>
      </div>
    </div>

    <!-- Graph Area -->
    <div class="graph-area">
      <svg id="graph-svg"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>
  </div>

  <script>
    // ============================================
    // 湘绣知识图谱数据
    // ============================================
    const graphData = {
      nodes: [
        // 非遗项目
        { id: "h-xiangxiu", name: "湘绣", category: "Heritage", level: "国家级", region: "湖南长沙", description: "中国四大名绣之一，以湖南长沙为中心的刺绣产品总称。" },
        { id: "h-suixiu", name: "苏绣", category: "Heritage", level: "国家级", region: "江苏苏州", description: "中国四大名绣之一，以精细素雅著称。" },
        { id: "h-shuxiu", name: "蜀绣", category: "Heritage", level: "国家级", region: "四川成都", description: "中国四大名绣之一，以色彩明丽、针法丰富见长。" },
        { id: "h-yuexiu", name: "粤绣", category: "Heritage", level: "国家级", region: "广东广州", description: "中国四大名绣之一，以金线绣和色彩浓艳为特色。" },

        // 技艺技法
        { id: "t-pengmao", name: "鬅毛针", category: "Technique", difficulty: "高级", description: "湘绣独特针法，用于表现动物毛发的蓬松质感，由刘爱云大师创新。" },
        { id: "t-rongzhen", name: "绒针绣", category: "Technique", difficulty: "中级", description: "以丝绒线为材料，绣面呈现绒面效果，常用于绣制花卉。" },
        { id: "t-shuangmian", name: "双面绣", category: "Technique", difficulty: "高级", description: "在同一块底料上绣出正反两面完全相同的图案。" },
        { id: "t-mifeng", name: "密蜂针", category: "Technique", difficulty: "中级", description: "针脚细密如蜂巢，适合表现细腻的肌肤质感。" },
        { id: "t-youqixiu", name: "油彩绣", category: "Technique", difficulty: "高级", description: "借鉴油画技法，通过色线叠加表现光影和立体感。" },
        { id: "t-luandizhen", name: "乱针绣", category: "Technique", difficulty: "中级", description: "针线交错穿插，形成乱中有序的视觉效果。" },

        // 传承人
        { id: "p-liuaiyun", name: "刘爱云", category: "Person", title: "国家级非遗传承人", birth: "1938", bio: "湘绣大师，鬅毛针法创新者，从事湘绣六十余年。" },
        { id: "p-jiangxuelan", name: "江再红", category: "Person", title: "国家级非遗传承人", birth: "1966", bio: "湘绣传承人，双面绣技艺代表人物。" },
        { id: "p-liyan", name: "李艳", category: "Person", title: "省级非遗传承人", birth: "1972", bio: "湘绣工艺师，擅长油彩绣和人物绣。" },
        { id: "p-zengjinghua", name: "曾应明", category: "Person", title: "省级非遗传承人", birth: "1954", bio: "湘绣研究专家，致力于湘绣历史文献整理。" },

        // 原材料
        { id: "m-sichou", name: "桑蚕丝", category: "Material", origin: "江浙", description: "湘绣主要用线材料，光泽柔和，色彩丰富。" },
        { id: "m-dizhenbu", name: "底针布", category: "Material", origin: "湖南", description: "湘绣专用底料，经纬细密，适合精细绣制。" },
        { id: "m-songzhentaozhen", name: "松针套针", category: "Material", origin: "湖南", description: "特殊绣针，用于表现松树针叶的层次感。" },

        // 文献资料
        { id: "d-xiangxiuzhi", name: "《湘绣志》", category: "Document", author: "曾应明", dynasty: "当代", description: "系统记录湘绣历史源流、技艺传承、代表作品的专著。" },
        { id: "d-zhongguoxiuzhu", name: "《中国刺绣》", category: "Document", author: "孙佩兰", dynasty: "当代", description: "中国刺绣艺术通史，涵盖四大名绣。" },
        { id: "d-hunanfengwuzhi", name: "《湖南风物志》", category: "Document", author: "湖南省地方志编纂委员会", dynasty: "当代", description: "记载湖南各地非物质文化遗产。" },

        // 抽象概念
        { id: "c-sidamingxiu", name: "四大名绣", category: "Concept", domain: "传统工艺", definition: "中国刺绣艺术中苏绣、湘绣、粤绣、蜀绣的合称。" },
        { id: "c-xiuhua", name: "绣花", category: "Concept", domain: "传统工艺", definition: "以针引线在织物上绣制图案的传统手工艺。" },
      ],
      links: [
        // 技艺属于非遗
        { source: "t-pengmao", target: "h-xiangxiu", type: "BELONGS_TO", since: "1956" },
        { source: "t-rongzhen", target: "h-xiangxiu", type: "BELONGS_TO", since: "明清" },
        { source: "t-shuangmian", target: "h-xiangxiu", type: "BELONGS_TO", since: "近现代" },
        { source: "t-mifeng", target: "h-xiangxiu", type: "BELONGS_TO", since: "传统" },
        { source: "t-youqixiu", target: "h-xiangxiu", type: "BELONGS_TO", since: "当代" },
        { source: "t-luandizhen", target: "h-xiangxiu", type: "BELONGS_TO", since: "近现代" },

        // 传承人掌握技艺
        { source: "p-liuaiyun", target: "t-pengmao", type: "MASTERED_BY", proficiency: "精通", since: "1961" },
        { source: "p-liuaiyun", target: "t-rongzhen", type: "MASTERED_BY", proficiency: "精通", since: "1958" },
        { source: "p-jiangxuelan", target: "t-shuangmian", type: "MASTERED_BY", proficiency: "精通", since: "1985" },
        { source: "p-liyan", target: "t-youqixiu", type: "MASTERED_BY", proficiency: "精通", since: "1995" },
        { source: "p-zengjinghua", target: "t-pengmao", type: "MASTERED_BY", proficiency: "研究", since: "1980" },

        // 技艺使用材料
        { source: "t-pengmao", target: "m-sichou", type: "USES", note: "主材料" },
        { source: "t-shuangmian", target: "m-dizhenbu", type: "USES", note: "专用底料" },
        { source: "t-rongzhen", target: "m-sichou", type: "USES", note: "丝绒线" },

        // 技艺记载于文献
        { source: "t-pengmao", target: "d-xiangxiuzhi", type: "DOCUMENTED_IN", page: "第3章" },
        { source: "h-xiangxiu", target: "d-zhongguoxiuzhu", type: "DOCUMENTED_IN", page: "第5章" },
        { source: "h-xiangxiu", target: "d-hunanfengwuzhi", type: "DOCUMENTED_IN", page: "工艺篇" },

        // 概念关联
        { source: "h-xiangxiu", target: "c-sidamingxiu", type: "RELATED_TO", relation_type: "属于" },
        { source: "h-suixiu", target: "c-sidamingxiu", type: "RELATED_TO", relation_type: "属于" },
        { source: "h-shuxiu", target: "c-sidamingxiu", type: "RELATED_TO", relation_type: "属于" },
        { source: "h-yuexiu", target: "c-sidamingxiu", type: "RELATED_TO", relation_type: "属于" },
        { source: "c-xiuhua", target: "h-xiangxiu", type: "RELATED_TO", relation_type: "包含" },

        // 传承人师徒关系
        { source: "p-jiangxuelan", target: "p-liuaiyun", type: "INHERITED_FROM", generation: "第二代" },
      ]
    };

    // ============================================
    // D3.js 可视化配置
    // ============================================
    const colors = {
      Heritage: '#a53e2a',
      Technique: '#4a6741',
      Person: '#2c5282',
      Material: '#6b4c3b',
      Document: '#553c2d',
      Concept: '#7a6f5f'
    };

    const labels = {
      Heritage: '非遗项目',
      Technique: '技艺技法',
      Person: '传承人',
      Material: '原材料',
      Document: '文献资料',
      Concept: '抽象概念'
    };

    const nodeRadius = {
      Heritage: 22,
      Technique: 18,
      Person: 16,
      Material: 14,
      Document: 14,
      Concept: 16
    };

    let simulation, svg, g, link, node, labels_g;
    let animationRunning = true;
    let selectedNodeId = null;

    function initGraph() {
      const container = document.querySelector('.graph-area');
      const width = container.clientWidth;
      const height = container.clientHeight;

      svg = d3.select('#graph-svg')
        .attr('width', width)
        .attr('height', height);

      // 清空
      svg.selectAll('*').remove();

      // 缩放行为
      const zoom = d3.zoom()
        .scaleExtent([0.3, 3])
        .on('zoom', (event) => {
          g.attr('transform', event.transform);
        });

      svg.call(zoom);

      g = svg.append('g');

      // 力导向模拟
      simulation = d3.forceSimulation(graphData.nodes)
        .force('link', d3.forceLink(graphData.links)
          .id(d => d.id)
          .distance(d => {
            if (d.type === 'BELONGS_TO') return 100;
            if (d.type === 'MASTERED_BY') return 80;
            if (d.type === 'INHERITED_FROM') return 70;
            return 120;
          })
        )
        .force('charge', d3.forceManyBody().strength(-400))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(d => nodeRadius[d.category] + 10));

      // 绘制连线
      link = g.append('g')
        .attr('class', 'links')
        .selectAll('line')
        .data(graphData.links)
        .enter()
        .append('line')
        .attr('stroke', '#c8bfb3')
        .attr('stroke-width', d => {
          if (d.type === 'BELONGS_TO') return 2.5;
          if (d.type === 'MASTERED_BY') return 2;
          return 1.5;
        })
        .attr('stroke-opacity', 0.6)
        .attr('stroke-dasharray', d => {
          if (d.type === 'RELATED_TO') return '5,5';
          return 'none';
        });

      // 绘制关系标签
      const linkLabels = g.append('g')
        .attr('class', 'link-labels')
        .selectAll('text')
        .data(graphData.links)
        .enter()
        .append('text')
        .attr('font-size', '10px')
        .attr('fill', '#7a6f5f')
        .attr('text-anchor', 'middle')
        .text(d => {
          const typeMap = {
            'BELONGS_TO': '属于',
            'MASTERED_BY': '掌握',
            'USES': '使用',
            'DOCUMENTED_IN': '记载于',
            'RELATED_TO': '关联',
            'INHERITED_FROM': '师承'
          };
          return typeMap[d.type] || d.type;
        });

      // 绘制节点组
      node = g.append('g')
        .attr('class', 'nodes')
        .selectAll('g')
        .data(graphData.nodes)
        .enter()
        .append('g')
        .attr('cursor', 'pointer')
        .call(d3.drag()
          .on('start', dragstarted)
          .on('drag', dragged)
          .on('end', dragended)
        );

      // 节点圆形
      node.append('circle')
        .attr('r', d => nodeRadius[d.category])
        .attr('fill', d => colors[d.category])
        .attr('stroke', '#faf8f3')
        .attr('stroke-width', 2.5)
        .attr('opacity', 0.9);

      // 节点图标文字（首字）
      node.append('text')
        .attr('text-anchor', 'middle')
        .attr('dy', '0.35em')
        .attr('fill', '#fff')
        .attr('font-size', d => nodeRadius[d.category] * 0.6 + 'px')
        .attr('font-weight', '600')
        .text(d => labels[d.category][0]);

      // 节点名称标签
      labels_g = g.append('g')
        .attr('class', 'node-labels')
        .selectAll('text')
        .data(graphData.nodes)
        .enter()
        .append('text')
        .attr('text-anchor', 'middle')
        .attr('dy', d => nodeRadius[d.category] + 16)
        .attr('fill', '#2c241b')
        .attr('font-size', '12px')
        .attr('font-family', 'Noto Serif SC, serif')
        .text(d => d.name);

      // 交互事件
      node
        .on('click', (event, d) => {
          event.stopPropagation();
          selectNode(d);
        })
        .on('mouseenter', (event, d) => {
          showTooltip(event, d);
          highlightNeighbors(d);
        })
        .on('mouseleave', () => {
          hideTooltip();
          resetHighlight();
        });

      svg.on('click', () => {
        selectedNodeId = null;
        resetHighlight();
        showDefaultDetail();
      });

      // 每帧更新位置
      simulation.on('tick', () => {
        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);

        linkLabels
          .attr('x', d => (d.source.x + d.target.x) / 2)
          .attr('y', d => (d.source.y + d.target.y) / 2);

        node.attr('transform', d => `translate(${d.x},${d.y})`);
        labels_g
          .attr('x', d => d.x)
          .attr('y', d => d.y);
      });

      // 更新统计
      updateStats();
    }

    // ============================================
    // 交互函数
    // ============================================
    function dragstarted(event, d) {
      if (!event.active && animationRunning) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }

    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }

    function dragended(event, d) {
      if (!event.active && animationRunning) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }

    function showTooltip(event, d) {
      const tooltip = document.getElementById('tooltip');
      tooltip.innerHTML = `
        <strong>${d.name}</strong><br>
        <span style="color:#d4ccc0;font-size:12px">${labels[d.category]}</span><br>
        <span style="font-size:12px;margin-top:4px;display:block">${d.description?.substring(0, 50)}...</span>
      `;
      tooltip.style.left = (event.pageX + 15) + 'px';
      tooltip.style.top = (event.pageY + 15) + 'px';
      tooltip.classList.add('show');
    }

    function hideTooltip() {
      document.getElementById('tooltip').classList.remove('show');
    }

    function highlightNeighbors(d) {
      const neighborIds = new Set();
      neighborIds.add(d.id);
      graphData.links.forEach(l => {
        if (l.source.id === d.id) neighborIds.add(l.target.id);
        if (l.target.id === d.id) neighborIds.add(l.source.id);
      });

      node.selectAll('circle')
        .attr('opacity', n => neighborIds.has(n.id) ? 1 : 0.2)
        .attr('stroke-width', n => n.id === d.id ? 4 : 2.5);

      link.attr('stroke-opacity', l =>
        l.source.id === d.id || l.target.id === d.id ? 1 : 0.05
      );

      labels_g.attr('opacity', n => neighborIds.has(n.id) ? 1 : 0.2);
    }

    function resetHighlight() {
      node.selectAll('circle').attr('opacity', 0.9).attr('stroke-width', 2.5);
      link.attr('stroke-opacity', 0.6);
      labels_g.attr('opacity', 1);
    }

    function selectNode(d) {
      selectedNodeId = d.id;
      highlightNeighbors(d);

      const detailPanel = document.getElementById('nodeDetail');
      let fieldsHtml = '';

      // 根据节点类型展示不同字段
      const fieldMap = {
        Heritage: ['level', 'region', 'description'],
        Technique: ['difficulty', 'description'],
        Person: ['title', 'birth', 'bio'],
        Material: ['origin', 'description'],
        Document: ['author', 'dynasty', 'description'],
        Concept: ['domain', 'definition']
      };

      const fieldLabels = {
        level: '保护级别', region: '所属地区', description: '简介',
        difficulty: '难度等级', title: '头衔称号', birth: '出生年份',
        bio: '生平事迹', origin: '产地来源', author: '作者',
        dynasty: '所属朝代', domain: '所属领域', definition: '定义'
      };

      const fields = fieldMap[d.category] || [];
      fields.forEach(field => {
        if (d[field]) {
          fieldsHtml += `
            <div class="field">
              <div class="field-label">${fieldLabels[field] || field}</div>
              <div class="field-value">${d[field]}</div>
            </div>
          `;
        }
      });

      // 相关节点统计
      const relatedLinks = graphData.links.filter(l =>
        l.source.id === d.id || l.target.id === d.id
      );

      const relatedNodes = relatedLinks.map(l =>
        l.source.id === d.id ? l.target : l.source
      );

      const relatedByCategory = {};
      relatedNodes.forEach(n => {
        relatedByCategory[n.category] = (relatedByCategory[n.category] || 0) + 1;
      });

      let relatedHtml = '';
      if (relatedNodes.length > 0) {
        relatedHtml = `
          <div class="field">
            <div class="field-label">关联节点（${relatedNodes.length}个）</div>
            <div style="margin-top:8px">
              ${relatedNodes.map(n => `<span class="tag" style="color:${colors[n.category]};border-color:${colors[n.category]}">${n.name}</span>`).join('')}
            </div>
          </div>
        `;
      }

      detailPanel.innerHTML = `
        <h3>${d.name}</h3>
        <div style="margin-bottom:12px">
          <span class="tag" style="background:${colors[d.category]};color:#fff;border-color:${colors[d.category]}">
            ${labels[d.category]}
          </span>
        </div>
        ${fieldsHtml}
        ${relatedHtml}
      `;

      // 自动切换到详情tab
      switchTab('detail');
    }

    function showDefaultDetail() {
      document.getElementById('nodeDetail').innerHTML = `
        <p style="color:var(--muted);font-size:13px;text-align:center;padding:40px 0;">
          点击图谱中的节点查看详情<br>
          或拖拽节点调整布局
        </p>
      `;
    }

    function updateStats() {
      document.getElementById('statNodes').textContent = graphData.nodes.length;
      document.getElementById('statLinks').textContent = graphData.links.length;
      document.getElementById('statHeritage').textContent =
        graphData.nodes.filter(n => n.category === 'Heritage').length;
      document.getElementById('statTechnique').textContent =
        graphData.nodes.filter(n => n.category === 'Technique').length;
    }

    function switchTab(tab) {
      document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');

      if (tab === 'detail') {
        document.getElementById('sidebarDetail').style.display = 'block';
        document.getElementById('sidebarStats').style.display = 'none';
      } else {
        document.getElementById('sidebarDetail').style.display = 'none';
        document.getElementById('sidebarStats').style.display = 'block';
      }
    }

    function resetZoom() {
      const container = document.querySelector('.graph-area');
      const width = container.clientWidth;
      const height = container.clientHeight;

      svg.transition().duration(750).call(
        d3.zoom().transform,
        d3.zoomIdentity
      );

      simulation.alpha(1).restart();
    }

    function toggleAnimation() {
      animationRunning = !animationRunning;
      if (animationRunning) {
        simulation.alpha(0.3).restart();
        event.target.textContent = '暂停动画';
      } else {
        simulation.stop();
        event.target.textContent = '继续动画';
      }
    }

    function handleSearch(event) {
      if (event.key !== 'Enter') return;
      const keyword = event.target.value.trim();
      if (!keyword) return;

      const found = graphData.nodes.find(n =>
        n.name.includes(keyword) || n.description?.includes(keyword)
      );

      if (found) {
        selectNode(found);
        // 居中显示
        const container = document.querySelector('.graph-area');
        const width = container.clientWidth;
        const height = container.clientHeight;

        svg.transition().duration(750).call(
          d3.zoom().transform,
          d3.zoomIdentity.translate(width / 2, height / 2).scale(1.5).translate(-found.x, -found.y)
        );
      } else {
        alert('未找到匹配的节点');
      }
    }

    // 窗口大小调整
    window.addEventListener('resize', () => {
      const container = document.querySelector('.graph-area');
      svg.attr('width', container.clientWidth).attr('height', container.clientHeight);
      simulation.force('center', d3.forceCenter(container.clientWidth / 2, container.clientHeight / 2));
      simulation.alpha(0.3).restart();
    });

    // 初始化
    initGraph();
  </script>
</body>

</html>
