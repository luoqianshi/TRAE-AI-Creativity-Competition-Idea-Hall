    @keyframes popIn { 0% { transform: scale(0.3); opacity: 0; } 60% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }

let state = {

  currentLevel: null,
  currentQuestions: [],
  currentQIndex: 0,
  score: 0,

/* 页面加载时恢复本地数据 */
function loadState() {
  try {
    const saved = localStorage.getItem('quxue_ai_demo_state');
    if (saved) {
      const parsed = JSON.parse(saved);
      state.totalCorrect = parsed.totalCorrect || 0;
      state.mistakes = parsed.mistakes || [];
      state.unlockedMedals = parsed.unlockedMedals || [];
      state.dictLookups = parsed.dictLookups || 0;
      state.studyTime = parsed.studyTime || 0;
      state.masteredTerms = new Set(parsed.masteredTerms || []);
    }
  } catch(e) {}
  updateHomeStats();
}

/* 保存状态到本地 */
function saveState() {
  try {
    localStorage.setItem('quxue_ai_demo_state', JSON.stringify({
      totalCorrect: state.totalCorrect,
      mistakes: state.mistakes,
      unlockedMedals: state.unlockedMedals,
      dictLookups: state.dictLookups,
      studyTime: state.studyTime,
      masteredTerms: Array.from(state.masteredTerms),
    }));
  } catch(e) {}
}

/* ---------- 5. 页面切换 ---------- */
function switchPage(page) {
  state.currentPage = page;
  // 隐藏所有页面
  document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden-page'));
  // 显示目标页面
  const target = document.getElementById('page-' + page);
  if (target) target.classList.remove('hidden-page');
  // 更新底部导航
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const nav = document.querySelector('.nav-item[data-page="' + page + '"]');
  if (nav) nav.classList.add('active');
  // 页面特殊初始化
  if (page === 'dictionary') renderDictionary();
  if (page === 'mistakes') renderMistakes();
  if (page === 'achievements') renderAchievements();
  if (page === 'home') updateHomeStats();
  // 滚动到顶部
  window.scrollTo(0, 0);
}

/* ---------- 6. 首页数据更新 ---------- */
function updateHomeStats() {
  document.getElementById('home-study-time').textContent = state.studyTime;
  document.getElementById('home-mastered').textContent = state.masteredTerms.size;
  document.getElementById('home-score').textContent = state.score;
}

/* ---------- 7. 开始闯关 ---------- */
function startLevel(level) {
  const pool = questionBank[level];
  if (!pool || pool.length === 0) {
    showToast('题库加载失败', 'error');
    return;
  }
  // 随机打乱取10题（如果题库不够10题就全取）
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  state.currentLevel = level;
  state.currentQuestions = shuffled.slice(0, Math.min(10, shuffled.length));
  state.currentQIndex = 0;
  state.score = 0;
  state.correctCount = 0;
  state.streak = 0;
  state.maxStreak = 0;
  state.answered = false;
  // 切换到答题页
  switchPage('quiz');
  renderQuestion();
  showToast(level === 'beginner' ? '初级闯关开始！' : level === 'intermediate' ? '中级进阶开始！' : '高级挑战开始！', 'success');
}

/* ---------- 8. 渲染题目 ---------- */
function renderQuestion() {
  const q = state.currentQuestions[state.currentQIndex];
  if (!q) {
    showResult();
    return;
  }
  state.answered = false;
  // 更新进度
  const total = state.currentQuestions.length;
  document.getElementById('quiz-progress-text').textContent = (state.currentQIndex + 1) + ' / ' + total;
  document.getElementById('quiz-progress-bar').style.width = ((state.currentQIndex + 1) / total * 100) + '%';
  document.getElementById('quiz-score').textContent = state.score;
  // 难度标签
  const levelMap = { beginner: '初级', intermediate: '中级', advanced: '高级' };
  document.getElementById('quiz-level-tag').textContent = levelMap[state.currentLevel] || '闯关';
  // 题型标签
  const typeMap = { single: '单选题', judge: '判断题', match: '词义匹配' };
  document.getElementById('quiz-type-label').textContent = typeMap[q.type] || '选择题';
  // 题目
  document.getElementById('quiz-question').textContent = q.question;
  document.getElementById('quiz-hint').textContent = q.type === 'match' ? '请选择正确匹配项' : '请选择你认为正确的答案';
  document.getElementById('quiz-tip').textContent = '请点击选项作答';
  // 选项
  const optsContainer = document.getElementById('quiz-options');
  optsContainer.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'btn-option';
    btn.onclick = () => handleAnswer(idx);
    // 判断题特殊显示
    if (q.type === 'judge') {
      const icons = ['✅ ', '❌ '];
      btn.innerHTML = '<span class="font-medium">' + icons[idx] + opt + '</span>';
    } else if (q.type === 'match') {
      btn.innerHTML = '<div class="flex items-center gap-2"><span class="font-bold text-primary">' + opt + '</span><span class="text-textHint text-sm">→ ' + q.matchPairs[idx] + '</span></div>';
    } else {
      const labels = ['A', 'B', 'C', 'D'];
      btn.innerHTML = '<span class="font-bold text-primary mr-2">' + labels[idx] + '.</span><span>' + opt + '</span>';
    }
    optsContainer.appendChild(btn);
  });
}

/* ---------- 9. 处理答题 ---------- */
function handleAnswer(selectedIdx) {
  if (state.answered) return;
  state.answered = true;
  const q = state.currentQuestions[state.currentQIndex];
  const isCorrect = selectedIdx === q.answer;
  const buttons = document.querySelectorAll('#quiz-options .btn-option');
  // 标记选项状态
  buttons.forEach((btn, idx) => {
    btn.classList.add('disabled');
    if (idx === q.answer) btn.classList.add('correct');
    else if (idx === selectedIdx && !isCorrect) btn.classList.add('wrong');
  });
  // 更新统计
  state.totalAnswered++;
  if (isCorrect) {
    state.correctCount++;
    state.totalCorrect++;
    state.streak++;
    if (state.streak > state.maxStreak) state.maxStreak = state.streak;
    state.score += 10 + state.streak * 2; // 连击加分
    state.masteredTerms.add(q.term);
    document.getElementById('quiz-score').textContent = state.score;
    document.getElementById('quiz-tip').innerHTML = '<span class="text-success font-semibold">回答正确！🎉</span>';
    showToast('回答正确 +' + (10 + state.streak * 2) + '分', 'success');
    // 答对弹窗（AI记忆口诀）
    setTimeout(() => showCorrectModal(q), 400);
  } else {
    state.streak = 0;
    document.getElementById('quiz-tip').innerHTML = '<span class="text-danger font-semibold">回答错误，查看解析 💡</span>';
    showToast('回答错误', 'error');
    // 加入错题本
    addMistake(q, selectedIdx);
    // 答错弹窗（AI大白话解析）
    setTimeout(() => showWrongModal(q, selectedIdx), 400);
  }
  saveState();
}

    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-box" onclick="event.stopPropagation()">
        <div class="text-5xl mb-3 shake">😅</div>
        <div class="text-lg font-bold text-danger mb-1">回答错误</div>
        <div class="text-xs text-textHint mb-4">别灰心，学习就是在错误中成长</div>
        <div class="bg-dangerLight rounded-xl p-3 mb-3 text-left">
          <div class="text-xs font-bold text-danger mb-1">❌ 你的答案</div>
          <div class="text-sm text-textMain">${q.options[wrongIdx]}</div>
        </div>
        <div class="bg-successLight rounded-xl p-3 mb-4 text-left">
          <div class="text-xs font-bold text-success mb-1">✅ 正确答案</div>
          <div class="text-sm text-textMain font-semibold">${q.options[q.answer]}</div>
        </div>
        <div class="bg-primaryLight rounded-xl p-3 mb-4 text-left">
          <div class="text-xs font-bold text-primary mb-1">🤖 AI大白话解析</div>
          <div class="text-sm text-textMain leading-relaxed">${q.explain}</div>
        </div>
        <button class="btn-primary w-full h-11 text-sm" onclick="nextQuestion()">下一题 →</button>
      </div>
    </div>
  `;
  showModal(html);
}

/* ---------- 12. 下一题 ---------- */
function nextQuestion() {
  closeModalDirect();
  state.currentQIndex++;
  if (state.currentQIndex >= state.currentQuestions.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

/* ---------- 13. 结算页 ---------- */
function showResult() {
  const total = state.currentQuestions.length;
  const accuracy = total > 0 ? Math.round(state.correctCount / total * 100) : 0;
  const isPerfect = accuracy === 100;
  const newTerms = state.currentQuestions.filter(q => state.masteredTerms.has(q.term)).length;
  // 检查勋章
  const stats = { perfect: isPerfect, streak: state.maxStreak, reviewAll: false, dictLookups: state.dictLookups };
  checkMedals(stats);
  const html = `
    <div class="modal-overlay">
      <div class="modal-box">
        <div class="text-5xl mb-3 pop-in">${accuracy >= 80 ? '🎊' : accuracy >= 60 ? '👍' : '💪'}</div>
        <div class="text-xl font-bold text-textMain mb-1">闯关完成！</div>
        <div class="text-xs text-textHint mb-5">${state.currentLevel === 'beginner' ? '初级' : state.currentLevel === 'intermediate' ? '中级' : '高级'}关卡</div>
        <div class="grid grid-cols-3 gap-3 mb-5">
          <div class="bg-bg rounded-xl p-3">
            <div class="text-xl font-bold text-primary">${accuracy}%</div>
            <div class="text-[10px] text-textHint mt-1">正确率</div>
          </div>
          <div class="bg-bg rounded-xl p-3">
            <div class="text-xl font-bold text-success">${state.correctCount}</div>
            <div class="text-[10px] text-textHint mt-1">答对题数</div>
          </div>
          <div class="bg-bg rounded-xl p-3">
            <div class="text-xl font-bold text-warning">${state.score}</div>
            <div class="text-[10px] text-textHint mt-1">获得积分</div>
          </div>
        </div>
        <div class="bg-primaryLight rounded-xl p-3 mb-5 text-left">
          <div class="text-xs font-bold text-primary mb-1">📊 本次收获</div>
          <div class="text-sm text-textMain">新增掌握 <span class="font-bold text-primary">${newTerms}</span> 个术语，最高连击 <span class="font-bold text-primary">${state.maxStreak}</span> 题</div>
        </div>
        ${isPerfect ? '<div class="text-sm text-success font-semibold mb-3">🌟 完美通关！全部答对！</div>' : ''}
        <div class="flex gap-3">
          <button class="flex-1 h-11 rounded-xl border-2 border-border text-textSub font-semibold text-sm active:scale-95 transition" onclick="closeModalDirect();switchPage('home')">返回首页</button>
          <button class="flex-1 btn-primary h-11 text-sm" onclick="closeModalDirect();startLevel(state.currentLevel)">再闯一次</button>
        </div>
      </div>
    </div>
  `;
  showModal(html);
  // 更新学习时长
  state.studyTime += Math.ceil(total * 0.5);
  saveState();
  updateHomeStats();
}

/* ---------- 14. 错题管理 ---------- */
function addMistake(q, wrongIdx) {
  // 避免重复添加同一题
  if (!state.mistakes.find(m => m.id === q.id)) {
    state.mistakes.push({
      id: q.id,
      term: q.term,
      question: q.question,
      yourAnswer: q.options[wrongIdx],
      correctAnswer: q.options[q.answer],
      explain: q.explain,
      level: state.currentLevel,
      timestamp: Date.now(),
    });
    saveState();
  }
}

function renderMistakes() {
  const list = document.getElementById('mistake-list');
  const empty = document.getElementById('mistake-empty');
  const count = document.getElementById('mistake-count');
  count.textContent = state.mistakes.length;
  if (state.mistakes.length === 0) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  list.innerHTML = state.mistakes.map((m, i) => `
    <div class="card p-4">
      <div class="flex items-start gap-3">
        <div class="w-8 h-8 rounded-lg bg-dangerLight flex items-center justify-center text-danger font-bold text-sm flex-shrink-0">${i + 1}</div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-semibold text-textMain mb-1">${m.question}</div>
          <div class="text-xs text-danger mb-1">你的答案：${m.yourAnswer}</div>
          <div class="text-xs text-success mb-2">正确答案：${m.correctAnswer}</div>
          <div class="bg-primaryLight rounded-lg p-2 text-xs text-textMain leading-relaxed">💡 ${m.explain}</div>
        </div>
      </div>
    </div>
  `).join('');
}

/* ---------- 15. 术语词典 ---------- */
function renderDictionary() {
  const list = document.getElementById('dict-list');
  const input = document.getElementById('dict-input');
  const keyword = (input.value || '').trim().toLowerCase();
  const filtered = keyword ? dictionary.filter(d => d.term.toLowerCase().includes(keyword) || d.desc.includes(keyword)) : dictionary;
  list.innerHTML = filtered.map(d => `
    <div class="card p-4 cursor-pointer" onclick="onDictClick()">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-primaryLight text-primary">${d.category}</span>
      </div>
      <div class="font-bold text-textMain mb-1">${d.term}</div>
      <div class="text-sm text-textSub leading-relaxed">${d.desc}</div>
    </div>
  `).join('');
}
function onDictClick() {
  state.dictLookups++;
  saveState();
}
document.getElementById('dict-input').addEventListener('input', renderDictionary);

/* ---------- 16. 勋章系统 ---------- */
function getNextMedal() {
  const stats = { perfect: false, streak: state.maxStreak, reviewAll: false, dictLookups: state.dictLookups };
  for (const m of medals) {
    if (!state.unlockedMedals.includes(m.id) && m.condition(state.totalCorrect, stats)) {
      state.unlockedMedals.push(m.id);
      saveState();
      return m;
    }
  }
  return null;
}
function checkMedals(sessionStats) {
  let newUnlock = false;
  for (const m of medals) {
    if (!state.unlockedMedals.includes(m.id) && m.condition(state.totalCorrect, sessionStats)) {
      state.unlockedMedals.push(m.id);
      newUnlock = true;
    }
  }
  if (newUnlock) saveState();
}
function renderAchievements() {
  const list = document.getElementById('achieve-list');
  const stats = { perfect: false, streak: state.maxStreak, reviewAll: false, dictLookups: state.dictLookups };
  document.getElementById('achieve-unlocked').textContent = state.unlockedMedals.length;
  document.getElementById('achieve-total').textContent = medals.length;
  list.innerHTML = medals.map(m => {
    const isUnlocked = state.unlockedMedals.includes(m.id);
    return `
      <div class="card p-4 text-center">
        <div class="medal mx-auto mb-2 ${isUnlocked ? 'unlocked text-white' : 'locked'}">
          ${m.icon}
        </div>
        <div class="font-bold text-textMain text-sm mb-0.5">${m.name}</div>
        <div class="text-xs text-textHint">${m.desc}</div>
        ${isUnlocked ? '<div class="text-[10px] text-success font-semibold mt-1">✓ 已解锁</div>' : '<div class="text-[10px] text-textHint mt-1">🔒 未解锁</div>'}
      </div>
    `;
  }).join('');
}

/* ---------- 17. 弹窗工具 ---------- */
function showModal(html) {
  document.getElementById('modal-container').innerHTML = html;
}
function closeModal(e) {
  if (e.target === e.currentTarget) {
    document.getElementById('modal-container').innerHTML = '';
  }
}
function closeModalDirect() {
  document.getElementById('modal-container').innerHTML = '';
}

/* ---------- 18. Toast提示 ---------- */
function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast toast-' + type + ' show';
  setTimeout(() => { toast.classList.remove('show'); }, 2000);
}

/* ---------- 19. 初始化 ---------- */
window.addEventListener('DOMContentLoaded', () => {
  loadState();
  renderDictionary();
  // 每分钟更新一次学习时长（模拟）
  setInterval(() => {
    if (state.currentPage === 'quiz') {
      state.studyTime++;
      saveState();
    }
  }, 60000);
});
</script>
