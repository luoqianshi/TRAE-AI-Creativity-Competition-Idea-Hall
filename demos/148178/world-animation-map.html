<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>世界动画巡礼</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23ead9a2'/%3E%3Ccircle cx='32' cy='26' r='13' fill='%23d99638' stroke='%23312516' stroke-width='4'/%3E%3Crect x='16' y='31' width='32' height='20' rx='4' fill='%237c351e' stroke='%23312516' stroke-width='4'/%3E%3Cpath d='M23 42h18' stroke='%23fff0c9' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #312516;
        --soft-ink: #735c3b;
        --paper: #ead9a2;
        --card: rgba(255, 239, 193, 0.82);
        --card-strong: rgba(255, 228, 157, 0.92);
        --amber: #b66d24;
        --rust: #7c351e;
        --moss: #486947;
        --river: #397f9f;
        --plum: #6d4265;
        --shadow: 0 18px 46px rgba(64, 43, 18, 0.24);
        font-family: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 16% 18%, rgba(82, 112, 91, 0.34), transparent 30%),
          radial-gradient(circle at 82% 12%, rgba(61, 126, 149, 0.24), transparent 28%),
          linear-gradient(115deg, #6f7659, #d0b86d 46%, #8c7951);
        color: var(--ink);
      }

      button {
        border: 0;
        color: inherit;
        font: inherit;
      }

      .experience {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 0;
      }

      .stage {
        position: relative;
        width: min(100vw, 1180px, calc(100vh * 1.333333));
        aspect-ratio: 1448 / 1086;
        overflow: hidden;
        isolation: isolate;
        background:
          linear-gradient(180deg, rgba(245, 232, 181, 0.5), rgba(209, 171, 80, 0.3)),
          var(--paper);
        box-shadow: 0 0 80px rgba(31, 25, 16, 0.32);
      }

      .map-layer {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: url("./assets/animation-world-map.png") center / 100% 100% no-repeat;
        filter: saturate(1.06) contrast(1.02);
      }

      .map-layer::before,
      .map-layer::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .map-layer::before {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 34%, rgba(219, 155, 37, 0.08)),
          radial-gradient(ellipse at 52% 50%, transparent 0 64%, rgba(35, 56, 72, 0.16) 100%);
        mix-blend-mode: soft-light;
      }

      .map-layer::after {
        background-image:
          linear-gradient(90deg, rgba(121, 93, 50, 0.12) 1px, transparent 1px),
          linear-gradient(0deg, rgba(121, 93, 50, 0.09) 1px, transparent 1px);
        background-size: 72px 72px;
        opacity: 0.2;
      }

      .ink-texture {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        opacity: 0.16;
        background:
          repeating-linear-gradient(90deg, transparent 0 34px, rgba(101, 75, 39, 0.1) 35px, transparent 36px),
          repeating-linear-gradient(180deg, transparent 0 46px, rgba(82, 66, 38, 0.08) 47px, transparent 48px);
        mask-image: radial-gradient(ellipse at 50% 50%, #000 0 62%, transparent 88%);
      }

      .ghost-script {
        position: absolute;
        inset: 8% 4% 12%;
        z-index: 3;
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 18px;
        pointer-events: none;
        color: rgba(72, 72, 60, 0.09);
        font-size: 17px;
        line-height: 1.35;
        writing-mode: vertical-rl;
      }

      .title {
        position: absolute;
        left: 50%;
        top: 24px;
        z-index: 8;
        width: min(480px, calc(100% - 56px));
        transform: translateX(-50%);
        text-align: center;
        padding: 10px 18px 12px;
        background: radial-gradient(ellipse at center, rgba(255, 242, 200, 0.7), rgba(255, 239, 190, 0.28) 62%, transparent 74%);
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 5.2vw, 42px);
        line-height: 1.08;
        font-weight: 800;
        letter-spacing: 0;
      }

      .subtitle {
        margin-top: 8px;
        font-size: clamp(13px, 2vw, 17px);
        color: #5d472b;
      }

      .menu {
        position: absolute;
        top: 18px;
        right: 18px;
        z-index: 11;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 6px;
        background: rgba(44, 35, 24, 0.76);
        color: #f8e8ba;
        box-shadow: 0 8px 18px rgba(45, 32, 18, 0.24);
      }

      .menu-lines,
      .menu-lines::before,
      .menu-lines::after {
        width: 15px;
        height: 2px;
        border-radius: 2px;
        background: currentColor;
      }

      .menu-lines {
        position: relative;
      }

      .menu-lines::before,
      .menu-lines::after {
        content: "";
        position: absolute;
        left: 0;
      }

      .menu-lines::before {
        top: -5px;
      }

      .menu-lines::after {
        top: 5px;
      }

      .routes {
        position: absolute;
        inset: 0;
        z-index: 4;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .route {
        fill: none;
        stroke: rgba(40, 118, 154, 0.7);
        stroke-width: 3.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 8 9;
        filter: drop-shadow(0 1px 0 rgba(255, 245, 205, 0.5));
      }

      .route.alt {
        stroke: rgba(76, 112, 69, 0.58);
        stroke-width: 2.3;
        stroke-dasharray: 4 8;
      }

      .marker {
        position: absolute;
        z-index: 7;
        left: var(--x);
        top: var(--y);
        display: grid;
        grid-template-columns: auto;
        gap: 5px;
        justify-items: center;
        min-width: 76px;
        padding: 0;
        transform: translate(-50%, -100%);
        background: transparent;
        cursor: pointer;
        transition: transform 180ms ease, opacity 180ms ease, filter 180ms ease;
      }

      .marker[hidden] {
        display: none;
      }

      .marker:hover,
      .marker.active {
        transform: translate(-50%, calc(-100% - 8px)) scale(1.05);
        filter: drop-shadow(0 8px 14px rgba(67, 42, 15, 0.22));
      }

      .pin-art {
        position: relative;
        width: 50px;
        height: 46px;
      }

      .pin-art::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 44px;
        height: 30px;
        transform: translateX(-50%) skewX(-8deg);
        border: 2px solid rgba(65, 40, 22, 0.72);
        border-radius: 4px 4px 8px 8px;
        background:
          linear-gradient(135deg, rgba(255, 243, 194, 0.8), transparent 38%),
          linear-gradient(180deg, var(--pin), color-mix(in srgb, var(--pin), #2b2015 34%));
        box-shadow: inset 0 0 0 1px rgba(255, 238, 177, 0.28);
      }

      .pin-art::after {
        content: "";
        position: absolute;
        left: 13px;
        top: 0;
        width: 25px;
        height: 23px;
        transform: rotate(-8deg);
        border-radius: 50% 50% 42% 42%;
        background: #f6da79;
        border: 2px solid rgba(65, 40, 22, 0.68);
      }

      .pin-symbol {
        position: absolute;
        left: 50%;
        top: 17px;
        z-index: 2;
        transform: translateX(-50%);
        width: 27px;
        height: 18px;
        border-radius: 4px;
        background: rgba(255, 239, 189, 0.92);
        color: #4c2f1c;
        font-size: 14px;
        line-height: 18px;
        text-align: center;
        font-family: system-ui, sans-serif;
      }

      .marker-label {
        max-width: 118px;
        padding: 4px 8px 5px;
        border-radius: 3px;
        background: rgba(83, 46, 25, 0.88);
        color: #fff1c8;
        font-size: 13px;
        line-height: 1.2;
        white-space: nowrap;
        box-shadow: 0 4px 10px rgba(55, 34, 18, 0.18);
      }

      .landmark {
        position: absolute;
        z-index: 5;
        left: var(--x);
        top: var(--y);
        transform: translate(-50%, -100%) scale(var(--s));
        pointer-events: none;
        filter: sepia(0.18) drop-shadow(0 7px 8px rgba(60, 42, 20, 0.22));
      }

      .landmark img {
        display: block;
        width: var(--w);
        height: auto;
      }

      .detail-card {
        position: absolute;
        left: 50%;
        bottom: 104px;
        z-index: 10;
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        gap: 16px;
        width: min(520px, calc(100% - 56px));
        min-height: 154px;
        padding: 16px 44px 16px 16px;
        transform: translateX(-50%);
        border-radius: 6px;
        background:
          linear-gradient(90deg, rgba(255, 235, 178, 0.9), rgba(238, 176, 77, 0.74)),
          var(--card);
        box-shadow: var(--shadow);
        backdrop-filter: blur(7px);
      }

      .poster {
        display: grid;
        place-items: center;
        min-height: 122px;
        border-radius: 4px;
        border: 1px solid rgba(113, 73, 30, 0.28);
        background:
          linear-gradient(135deg, rgba(255, 250, 223, 0.85), rgba(255, 230, 146, 0.55)),
          var(--poster);
        box-shadow: inset 0 0 0 6px rgba(255, 248, 218, 0.22);
        color: #482c1b;
        font-size: 36px;
        font-family: system-ui, sans-serif;
      }

      .card-copy {
        min-width: 0;
      }

      .kicker {
        margin: 0 0 4px;
        color: var(--rust);
        font-size: 12px;
        font-weight: 700;
      }

      .card-title {
        margin: 0;
        font-size: clamp(21px, 3vw, 28px);
        line-height: 1.12;
      }

      .meta {
        margin: 6px 0 9px;
        color: #704a25;
        font-size: 13px;
        line-height: 1.35;
      }

      .desc {
        margin: 0;
        color: #4f3b27;
        font-size: 15px;
        line-height: 1.58;
      }

      .close {
        position: absolute;
        top: 10px;
        right: 10px;
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 4px;
        background: rgba(92, 55, 24, 0.14);
        color: #5a351e;
        cursor: pointer;
      }

      .caption {
        position: absolute;
        left: 50%;
        bottom: 67px;
        z-index: 9;
        width: min(620px, calc(100% - 42px));
        transform: translateX(-50%);
        padding: 7px 14px 8px;
        border-radius: 4px;
        background: rgba(178, 100, 23, 0.88);
        color: #fff0cf;
        font-family: system-ui, "PingFang SC", sans-serif;
        font-size: clamp(18px, 3.3vw, 30px);
        line-height: 1.2;
        text-align: center;
        text-shadow: 0 1px 0 rgba(84, 45, 12, 0.32);
      }

      .chips {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 13px;
        z-index: 12;
        display: flex;
        gap: 8px;
        padding: 10px;
        overflow-x: auto;
        border-radius: 7px;
        background: rgba(229, 188, 111, 0.58);
        backdrop-filter: blur(6px);
        scrollbar-width: none;
      }

      .chips::-webkit-scrollbar {
        display: none;
      }

      .chip {
        flex: 0 0 auto;
        min-height: 30px;
        padding: 5px 12px 6px;
        border-radius: 999px;
        background: rgba(255, 231, 167, 0.62);
        color: #5a3b22;
        cursor: pointer;
        white-space: nowrap;
        font-size: 14px;
        box-shadow: inset 0 0 0 1px rgba(124, 81, 34, 0.12);
      }

      .chip.active {
        background: #5d3b23;
        color: #fff0c9;
      }

      .hint {
        position: absolute;
        left: 18px;
        top: 18px;
        z-index: 9;
        padding: 6px 10px 7px;
        border-radius: 4px;
        background: rgba(255, 240, 193, 0.62);
        color: #5f462b;
        font-size: 12px;
      }

      @media (max-width: 720px) {
        body {
          overflow: auto;
        }

        .experience {
          align-items: start;
        }

        .stage {
          width: 100vw;
          height: 100svh;
          aspect-ratio: auto;
        }

        .map-layer {
          inset: 0;
          background-size: auto 100%;
          background-position: center;
        }

        .ghost-script {
          grid-template-columns: repeat(5, 1fr);
          font-size: 14px;
        }

        .hint {
          display: none;
        }

        .marker {
          min-width: 60px;
        }

        .pin-art {
          width: 42px;
          height: 40px;
        }

        .pin-art::before {
          width: 36px;
          height: 25px;
        }

        .pin-art::after {
          left: 11px;
          width: 21px;
          height: 19px;
        }

        .pin-symbol {
          top: 14px;
          width: 23px;
          height: 16px;
          font-size: 12px;
          line-height: 16px;
        }

        .marker-label {
          max-width: 88px;
          font-size: 11px;
        }

        .detail-card {
          bottom: 112px;
          grid-template-columns: 76px minmax(0, 1fr);
          gap: 12px;
          width: calc(100% - 28px);
          min-height: 132px;
          padding: 12px 36px 12px 12px;
        }

        .poster {
          min-height: 96px;
          font-size: 28px;
        }

        .desc {
          font-size: 13px;
          line-height: 1.45;
        }

        .caption {
          bottom: 70px;
          width: calc(100% - 24px);
        }

        .chips {
          left: 10px;
          right: 10px;
          bottom: 10px;
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main class="experience">
      <section class="stage" aria-label="世界各地动画片互动地图">
        <div class="map-layer" aria-hidden="true"></div>
        <div class="ink-texture" aria-hidden="true"></div>
        <div class="ghost-script" aria-hidden="true">
          <span>赛璐璐 光影 分镜 童年</span>
          <span>手绘 长片 电视 连载</span>
          <span>木偶 定格 胶片 剪影</span>
          <span>世界 影院 儿童 想象</span>
          <span>漫画 音乐 色彩 角色</span>
          <span>短片 学派 实验 美术</span>
          <span>家庭 冒险 旅程 城市</span>
          <span>经典 工作室 新浪潮</span>
          <span>动画 记忆 文化 远方</span>
        </div>

        <header class="title">
          <h1>世界动画巡礼</h1>
          <div class="subtitle">基于高清卡通世界地图 · 收录 12 组动画记忆</div>
        </header>

        <div class="hint">点击地图标记查看动画片</div>
        <button class="menu" type="button" aria-label="菜单"><span class="menu-lines"></span></button>

        <svg class="routes" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <path class="route" d="M14 36 C27 29 35 38 44 34 S58 28 68 32 S80 38 90 35" />
          <path class="route" d="M20 62 C30 55 37 60 47 54 S62 48 75 55 S84 68 89 75" />
          <path class="route" d="M28 23 C39 19 48 28 56 25 S66 18 77 21" />
          <path class="route alt" d="M31 74 C39 67 48 70 55 64 S65 58 75 62" />
          <path class="route alt" d="M40 45 C49 40 55 46 63 43 S75 41 85 47" />
        </svg>

        <div id="landmarks"></div>
        <div id="markers"></div>

        <article class="detail-card" id="detailCard" aria-live="polite">
          <button class="close" type="button" id="closeCard" aria-label="收起卡片">×</button>
          <div class="poster" id="poster" aria-hidden="true"></div>
          <div class="card-copy">
            <p class="kicker" id="region"></p>
            <h2 class="card-title" id="title"></h2>
            <p class="meta" id="meta"></p>
            <p class="desc" id="desc"></p>
          </div>
        </article>

        <div class="caption" id="caption">从手绘到定格，动画把世界各地的童年串成一张地图</div>
        <nav class="chips" id="chips" aria-label="动画分类"></nav>
      </section>
    </main>

          key: "brazil",
          label: "巴西动画",
          region: "巴西 · 圣保罗",
          title: "色彩、音乐与社会寓言",
          meta: "代表：独立长片与音乐动画 · 2000s-至今",
          desc: "鲜明色块、节奏感和现实议题并置，把南美城市与童年视角画得热烈又锋利。",
          category: "美洲动画",
          x: 31,
          y: 62,
          color: "#6b7831",
          symbol: "♪",
          poster: "#d1b642",
        },
        {
          key: "argentina",
          label: "阿根廷动画",
          region: "阿根廷 · 布宜诺斯艾利斯",
          title: "讽刺与作者表达",
          meta: "代表：成人向短片、独立动画 · 1960s-至今",
          desc: "漫画传统和政治讽刺进入动画，形成锋利、幽默又富有城市气质的表达。",
          category: "美洲动画",
          x: 31,
          y: 77,
          color: "#397f9f",
          symbol: "南",
          poster: "#80a6b2",
        },
        {
          key: "australia",
          label: "澳洲动画",
          region: "澳大利亚 · 墨尔本",
          title: "独立短片与家庭故事",
          meta: "代表：电视动画、作者短片 · 1970s-至今",
          desc: "轻盈的家庭叙事与手作感并重，常把辽阔地景转化成亲密的角色关系。",
          category: "实验短片",
          x: 84,
          y: 75,
          color: "#915d2f",
          symbol: "A",
          poster: "#c28a52",
        },
      ];

      const categories = ["全部", "亚洲动画", "影院长片", "欧洲动画", "定格动画", "实验短片", "美洲动画"];
      const landmarks = [];

      const markerRoot = document.querySelector("#markers");
      const landmarkRoot = document.querySelector("#landmarks");
      const chipsRoot = document.querySelector("#chips");
      const detailCard = document.querySelector("#detailCard");
      const poster = document.querySelector("#poster");
      const region = document.querySelector("#region");
      const title = document.querySelector("#title");
      const meta = document.querySelector("#meta");
      const desc = document.querySelector("#desc");
      const caption = document.querySelector("#caption");
      const closeCard = document.querySelector("#closeCard");

      let activeKey = items[1].key;
      let activeCategory = "全部";

      function renderLandmarks() {
        landmarkRoot.innerHTML = landmarks
          .map((landmark) => `
            <div class="landmark" style="--x:${landmark.x}%;--y:${landmark.y}%;--s:${landmark.scale};--w:${landmark.width}px">
              <img src="${landmark.src}" alt="" />
            </div>
          `)
          .join("");
      }

      function renderMarkers() {
        markerRoot.innerHTML = items
          .map((item) => {
            const hidden = activeCategory !== "全部" && item.category !== activeCategory ? "hidden" : "";
            const active = item.key === activeKey ? "active" : "";
            return `
              <button class="marker ${active}" type="button" ${hidden} data-key="${item.key}" style="--x:${item.x}%;--y:${item.y}%;--pin:${item.color}">
                <span class="pin-art"><span class="pin-symbol">${item.symbol}</span></span>
                <span class="marker-label">${item.label}</span>
              </button>
            `;
          })
          .join("");
      }

      function renderChips() {
        chipsRoot.innerHTML = categories
          .map((category) => `
            <button class="chip ${category === activeCategory ? "active" : ""}" type="button" data-category="${category}">
              ${category}
            </button>
          `)
          .join("");
      }

      function setActive(key) {
        const item = items.find((candidate) => candidate.key === key) || items[0];
        activeKey = item.key;
        detailCard.hidden = false;
        poster.textContent = item.symbol;
        poster.style.setProperty("--poster", item.poster);
        region.textContent = item.region;
        title.textContent = item.title;
        meta.textContent = item.meta;
        desc.textContent = item.desc;
        caption.textContent = `点击查看这部地图上的${item.label}：${item.title}`;
        renderMarkers();
      }

      function setCategory(category) {
        activeCategory = category;
        const visible = items.filter((item) => category === "全部" || item.category === category);
        if (!visible.some((item) => item.key === activeKey)) {
          activeKey = visible[0]?.key || items[0].key;
        }
        renderChips();
        setActive(activeKey);
      }

      markerRoot.addEventListener("click", (event) => {
        const button = event.target.closest("[data-key]");
        if (!button) return;
        setActive(button.dataset.key);
      });

      chipsRoot.addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        setCategory(button.dataset.category);
      });

      closeCard.addEventListener("click", () => {
        detailCard.hidden = true;
        caption.textContent = "从手绘到定格，动画把世界各地的童年串成一张地图";
      });

      renderLandmarks();
      renderChips();
      setActive(activeKey);
    </script>
  </body>
</html>
