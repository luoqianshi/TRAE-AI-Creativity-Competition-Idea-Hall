<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>图外有话 - 照片下方留白加字工具</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 100px;
        }
        
        /* 顶部标题区域 */
        .header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 400px;
        }
        
        .header h1 {
            font-size: 28px;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 14px;
            color: #888;
        }
        
        /* 主内容容器 */
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* 图片上传区域 */
        .upload-area {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .upload-area:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        
        .upload-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }
        
        .upload-icon svg {
            width: 30px;
            height: 30px;
            fill: white;
        }
        
        .upload-text {
            font-size: 16px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .upload-hint {
            font-size: 12px;
            color: #999;
        }
        
        #imageInput {
            display: none;
        }
        
        /* 图片预览区域 */
        .preview-area {
            background: white;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: none;
        }
        
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .preview-title {
            font-size: 14px;
            color: #666;
        }
        
        .change-btn {
            font-size: 12px;
            color: #667eea;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
        }
        
        .image-preview {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .image-preview img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* 文字输入区域 */
        .text-area {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: none;
        }
        
        .text-area label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }
        
        textarea {
            width: 100%;
            height: 120px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .char-count {
            text-align: right;
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }
        
        /* 样式选择区域 */
        .style-selector {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: none;
        }
        
        .style-selector label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }
        
        .style-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .style-btn {
            flex: 1;
            min-width: 80px;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            text-align: center;
            font-size: 12px;
            color: #666;
            transition: all 0.3s;
        }
        
        .style-btn.active {
            border-color: #667eea;
            color: #667eea;
            background: #f0f3ff;
        }
        
        .style-btn:hover {
            border-color: #667eea;
        }
        
        /* 字体选择 */
        .font-selector {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: none;
        }
        
        .font-selector label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }
        
        .font-options {
            display: flex;
            gap: 10px;
        }
        
        .font-btn {
            flex: 1;
            padding: 12px 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .font-btn.active {
            border-color: #667eea;
            background: #f0f3ff;
        }
        
        .font-btn.elegant {
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #333;
        }
        
        .font-btn.clean {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #333;
        }
        
        .font-btn.handwrite {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            color: #666;
        }
        
        /* 预览合成结果 */
        .result-preview {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: none;
        }
        
        .result-preview h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .canvas-container {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            background: #f9f9f9;
        }
        
        #resultCanvas {
            max-width: 100%;
            height: auto;
        }
        
        /* 操作按钮区域 */
        .action-buttons {
            display: none;
            gap: 12px;
            width: 100%;
            max-width: 400px;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 0 20px;
        }
        
        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-secondary:hover {
            background: #f0f3ff;
        }
        
        /* 成功提示 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            display: none;
        }
        
        /* 产品特色说明 */
        .features {
            width: 100%;
            max-width: 400px;
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-radius: 16px;
        }
        
        .features h3 {
            font-size: 14px;
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .feature-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #666;
        }
        
        .feature-icon {
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <!-- 顶部标题 -->
    <div class="header">
        <h1>📸 图外有话</h1>
        <p>照片下方留白加字，让每张照片都有故事</p>
    </div>
    
    <div class="container">
        <!-- 图片上传区域 -->
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M19 7v2.99s-1.99.01-2 0V7h-3s.01-1.99 0-2h3V2h2v3h3v2h-3zm-3 4V8h-3V5H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-8h-3zM5 19l3-4 2 3 3-4 4 5H5z"/>
                </svg>
            </div>
            <div class="upload-text">点击上传照片</div>
            <div class="upload-hint">支持 JPG、PNG 格式</div>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        
        <!-- 图片预览 -->
        <div class="preview-area" id="previewArea">
            <div class="preview-header">
                <span class="preview-title">已选择的照片</span>
                <button class="change-btn" id="changeBtn">更换照片</button>
            </div>
            <div class="image-preview">
                <img id="previewImage" src="" alt="预览">
            </div>
        </div>
        
        <!-- 文字输入 -->
        <div class="text-area" id="textArea">
            <label>✍️ 输入文字说明（最多500字）</label>
            <textarea id="textInput" placeholder="在这里写下你想说的话...&#10;&#10;比如：拍摄地点、心情感悟、详细说明等"></textarea>
            <div class="char-count"><span id="charCount">0</span>/500</div>
        </div>
        
        <!-- 字体选择 -->
        <div class="font-selector" id="fontSelector">
            <label>🔤 选择字体风格</label>
            <div class="font-options">
                <button class="font-btn elegant active" data-font="elegant">优雅衬线</button>
                <button class="font-btn clean" data-font="clean">简洁黑体</button>
                <button class="font-btn handwrite" data-font="handwrite">手写风格</button>
            </div>
        </div>
        
        <!-- 背景样式选择 -->
        <div class="style-selector" id="styleSelector">
            <label>🎨 选择背景样式</label>
            <div class="style-options">
                <button class="style-btn active" data-style="pure-white">纯白留白</button>
                <button class="style-btn" data-style="auto-color">智能取色</button>
                <button class="style-btn" data-style="warm-beige">温暖米色</button>
                <button class="style-btn" data-style="cool-gray">冷灰高级</button>
            </div>
        </div>
        
        <!-- 合成结果预览 -->
        <div class="result-preview" id="resultPreview">
            <h3>✨ 合成效果预览</h3>
            <div class="canvas-container">
                <canvas id="resultCanvas"></canvas>
            </div>
        </div>
    </div>
    
    <!-- 底部操作按钮 -->
    <div class="action-buttons" id="actionButtons">
        <button class="btn btn-secondary" id="previewBtn">预览效果</button>
        <button class="btn btn-primary" id="saveBtn">💾 保存图片</button>
    </div>
    
    <!-- 产品特色 -->
    <div class="features">
        <h3>产品特色</h3>
        <div class="feature-list">
            <div class="feature-item">
                <div class="feature-icon">⚡</div>
                <span>纯本地处理，极速响应</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🔒</div>
                <span>隐私安全，图片不上传</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🎨</div>
                <span>智能取色，自动匹配</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">📝</div>
                <span>支持长文，优雅排版</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🚫</div>
                <span>完全免费，无广告</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">📱</div>
                <span>移动端优化，流畅体验</span>
            </div>
        </div>
    </div>
    
    <!-- 成功提示 -->
    <div class="toast" id="toast"></div>
    
    <script>
        // 全局状态管理
        const state = {
            image: null,
            text: '',
            font: 'elegant',
            style: 'pure-white',
            maxChars: 500
        };
        
        // DOM元素引用
        const elements = {
            uploadArea: document.getElementById('uploadArea'),
            imageInput: document.getElementById('imageInput'),
            previewArea: document.getElementById('previewArea'),
            previewImage: document.getElementById('previewImage'),
            changeBtn: document.getElementById('changeBtn'),
            textArea: document.getElementById('textArea'),
            textInput: document.getElementById('textInput'),
            charCount: document.getElementById('charCount'),
            fontSelector: document.getElementById('fontSelector'),
            styleSelector: document.getElementById('styleSelector'),
            resultPreview: document.getElementById('resultPreview'),
            resultCanvas: document.getElementById('resultCanvas'),
            actionButtons: document.getElementById('actionButtons'),
            previewBtn: document.getElementById('previewBtn'),
            saveBtn: document.getElementById('saveBtn'),
            toast: document.getElementById('toast')
        };
        
        /**
         * 显示提示信息
         * @param {string} message - 提示内容
         * @param {number} duration - 显示时长（毫秒）
         */
        function showToast(message, duration = 2000) {
            elements.toast.textContent = message;
            elements.toast.style.display = 'block';
            setTimeout(() => {
                elements.toast.style.display = 'none';
            }, duration);
        }
        
        /**
         * 初始化图片上传功能
         * 设置点击上传和文件选择事件监听
         */
        function initImageUpload() {
            // 点击上传区域触发文件选择
            elements.uploadArea.addEventListener('click', () => {
                elements.imageInput.click();
            });
            
            // 更换照片按钮
            elements.changeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                elements.imageInput.click();
            });
            
            // 文件选择变化处理
            elements.imageInput.addEventListener('change', handleImageSelect);
        }
        
        /**
         * 处理图片文件选择
         * @param {Event} event - 文件输入事件
         */
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // 验证文件类型
            if (!file.type.startsWith('image/')) {
                showToast('请选择图片文件');
                return;
            }
            
            // 读取图片文件
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    state.image = img;
                    elements.previewImage.src = e.target.result;
                    showEditorSections();
                    showToast('照片已加载');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        /**
         * 显示编辑器各个功能区域
         * 当图片加载完成后，展示文字输入、样式选择等区域
         */
        function showEditorSections() {
            elements.previewArea.style.display = 'block';
            elements.textArea.style.display = 'block';
            elements.fontSelector.style.display = 'block';
            elements.styleSelector.style.display = 'block';
            elements.actionButtons.style.display = 'flex';
        }
        
        /**
         * 初始化文字输入功能
         * 设置字数统计和输入限制
         */
        function initTextInput() {
            elements.textInput.addEventListener('input', (e) => {
                const text = e.target.value;
                
                // 限制最大字数
                if (text.length > state.maxChars) {
                    e.target.value = text.substring(0, state.maxChars);
                    showToast(`最多只能输入${state.maxChars}字`);
                    return;
                }
                
                state.text = text;
                elements.charCount.textContent = text.length;
                
                // 字数接近上限时改变颜色提示
                if (text.length > state.maxChars * 0.9) {
                    elements.charCount.style.color = '#ff6b6b';
                } else {
                    elements.charCount.style.color = '#999';
                }
            });
        }
        
        /**
         * 初始化字体选择功能
         * 绑定字体按钮点击事件
         */
        function initFontSelector() {
            const fontBtns = elements.fontSelector.querySelectorAll('.font-btn');
            
            fontBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // 更新选中状态
                    fontBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    // 更新状态
                    state.font = btn.dataset.font;
                });
            });
        }
        
        /**
         * 初始化样式选择功能
         * 绑定背景样式按钮点击事件
         */
        function initStyleSelector() {
            const styleBtns = elements.styleSelector.querySelectorAll('.style-btn');
            
            styleBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // 更新选中状态
                    styleBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    // 更新状态
                    state.style = btn.dataset.style;
                });
            });
        }
        
        /**
         * 初始化操作按钮
         * 绑定预览和保存按钮事件
         */
        function initActionButtons() {
            elements.previewBtn.addEventListener('click', renderPreview);
            elements.saveBtn.addEventListener('click', saveImage);
        }
        
        /**
         * 获取背景颜色
         * 根据选择的样式返回对应的背景色
         * @returns {string} 背景颜色值
         */
        function getBackgroundColor() {
            const colors = {
                'pure-white': '#FFFFFF',
                'auto-color': null, // 需要智能取色算法
                'warm-beige': '#FFF8F0',
                'cool-gray': '#F5F5F5'
            };
            return colors[state.style];
        }
        
        /**
         * 智能提取图片主色调
         * 分析图片像素，提取主要颜色
         * @param {HTMLImageElement} img - 图片元素
         * @returns {string} 主色调的十六进制颜色值
         */
        function extractDominantColor(img) {
            // 创建临时canvas分析图片颜色
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            
            // 缩小图片以提高性能
            const size = 50;
            tempCanvas.width = size;
            tempCanvas.height = size;
            tempCtx.drawImage(img, 0, 0, size, size);
            
            // 获取像素数据
            const imageData = tempCtx.getImageData(0, 0, size, size);
            const pixels = imageData.data;
            
            // 统计颜色出现频率
            let r = 0, g = 0, b = 0;
            let count = 0;
            
            // 采样部分像素（每隔4个像素采样一次）
            for (let i = 0; i < pixels.length; i += 16) {
                r += pixels[i];
                g += pixels[i + 1];
                b += pixels[i + 2];
                count++;
            }
            
            // 计算平均颜色
            r = Math.round(r / count);
            g = Math.round(g / count);
            b = Math.round(b / count);
            
            // 降低饱和度，使其适合作为背景
            const avg = (r + g + b) / 3;
            r = Math.round(r * 0.3 + avg * 0.7);
            g = Math.round(g * 0.3 + avg * 0.7);
            b = Math.round(b * 0.3 + avg * 0.7);
            
            // 提高亮度，使其更适合作为背景
            r = Math.min(255, r + 100);
            g = Math.min(255, g + 100);
            b = Math.min(255, b + 100);
            
            return `rgb(${r}, ${g}, ${b})`;
        }
        
        /**
         * 获取字体配置
         * 根据选择的字体类型返回对应的字体设置
         * @returns {Object} 包含fontFamily和lineHeight的配置对象
         */
        function getFontConfig() {
            const configs = {
                'elegant': {
                    fontFamily: 'Georgia, "Times New Roman", serif',
                    lineHeight: 1.8
                },
                'clean': {
                    fontFamily: '-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif',
                    lineHeight: 1.6
                },
                'handwrite': {
                    fontFamily: '"Comic Sans MS", cursive, sans-serif',
                    lineHeight: 1.8
                }
            };
            return configs[state.font];
        }
        
        /**
         * 自动换行文本
         * 根据canvas宽度将文本分割成多行
         * @param {CanvasRenderingContext2D} ctx - Canvas上下文
         * @param {string} text - 原始文本
         * @param {number} maxWidth - 最大宽度
         * @returns {Array} 分行后的文本数组
         */
        function wrapText(ctx, text, maxWidth) {
            const lines = [];
            const paragraphs = text.split('\n');
            
            paragraphs.forEach(paragraph => {
                if (paragraph === '') {
                    lines.push('');
                    return;
                }
                
                let currentLine = '';
                const chars = paragraph.split('');
                
                chars.forEach(char => {
                    const testLine = currentLine + char;
                    const metrics = ctx.measureText(testLine);
                    
                    if (metrics.width > maxWidth && currentLine !== '') {
                        lines.push(currentLine);
                        currentLine = char;
                    } else {
                        currentLine = testLine;
                    }
                });
                
                if (currentLine) {
                    lines.push(currentLine);
                }
            });
            
            return lines;
        }
        
        /**
         * 渲染预览效果
         * 在Canvas上合成图片和文字
         */
        function renderPreview() {
            if (!state.image) {
                showToast('请先上传照片');
                return;
            }
            
            if (!state.text.trim()) {
                showToast('请输入文字说明');
                return;
            }
            
            const canvas = elements.resultCanvas;
            const ctx = canvas.getContext('2d');
            
            // 获取原图尺寸
            const imgWidth = state.image.width;
            const imgHeight = state.image.height;
            
            // 计算文字区域高度
            const fontConfig = getFontConfig();
            const fontSize = Math.max(16, Math.min(24, imgWidth / 20));
            const padding = fontSize * 2;
            const lineHeight = fontSize * fontConfig.lineHeight;
            const maxTextWidth = imgWidth - padding * 2;
            
            // 设置字体以测量文字
            ctx.font = `${fontSize}px ${fontConfig.fontFamily}`;
            
            // 计算文字行数
            const lines = wrapText(ctx, state.text, maxTextWidth);
            const textHeight = lines.length * lineHeight;
            
            // 计算留白区域高度（最小为图片高度的20%，最大为图片高度的80%）
            const minBlankHeight = imgHeight * 0.2;
            const maxBlankHeight = imgHeight * 0.8;
            const blankHeight = Math.max(minBlankHeight, Math.min(maxBlankHeight, textHeight + padding * 2));
            
            // 设置canvas尺寸
            canvas.width = imgWidth;
            canvas.height = imgHeight + blankHeight;
            
            // 绘制背景
            let bgColor = getBackgroundColor();
            if (state.style === 'auto-color') {
                bgColor = extractDominantColor(state.image);
            }
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制原图
            ctx.drawImage(state.image, 0, 0);
            
            // 绘制分隔线（可选）
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(padding, imgHeight + 1);
            ctx.lineTo(imgWidth - padding, imgHeight + 1);
            ctx.stroke();
            
            // 绘制文字
            ctx.fillStyle = '#333333';
            ctx.font = `${fontSize}px ${fontConfig.fontFamily}`;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            
            const textStartY = imgHeight + padding;
            lines.forEach((line, index) => {
                ctx.fillText(line, padding, textStartY + index * lineHeight);
            });
            
            // 显示预览区域
            elements.resultPreview.style.display = 'block';
            
            // 滚动到预览区域
            elements.resultPreview.scrollIntoView({ behavior: 'smooth' });
            
            showToast('预览已生成');
        }
        
        /**
         * 保存合成后的图片
         * 将Canvas内容转换为图片并触发下载
         */
        function saveImage() {
            if (!state.image || !state.text.trim()) {
                showToast('请先上传照片并输入文字');
                return;
            }
            
            // 先渲染一次确保canvas有内容
            renderPreview();
            
            // 转换为图片并下载
            const canvas = elements.resultCanvas;
            const link = document.createElement('a');
            link.download = `图外有话_${new Date().getTime()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            showToast('图片已保存到相册');
        }
        
        /**
         * 初始化应用
         * 按顺序初始化各个功能模块
         */
        function init() {
            initImageUpload();
            initTextInput();
            initFontSelector();
            initStyleSelector();
            initActionButtons();
        }
        
        // 页面加载完成后初始化应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
