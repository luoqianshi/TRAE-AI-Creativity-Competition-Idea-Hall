<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小学生整数四则运算练习软件</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:10px}
.container{width:100%;max-width:520px;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;min-height:80vh}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:16px 20px;text-align:center;font-size:20px;font-weight:bold;letter-spacing:2px}
.page{display:none;flex-direction:column;padding:20px;height:calc(80vh - 60px);overflow-y:auto}
.page.active{display:flex}
.tab-bar{display:flex;border-bottom:2px solid #eee}
.tab-bar .tab{flex:1;text-align:center;padding:12px 8px;cursor:pointer;font-size:14px;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s;background:none;border-top:none;border-left:none;border-right:none;outline:none;white-space:nowrap}
.tab-bar .tab.active{color:#667eea;border-bottom-color:#667eea;font-weight:bold}
input,select,button{font-size:15px;padding:10px 14px;border-radius:8px;border:1px solid #ddd;outline:none;width:100%;margin-bottom:12px;transition:.2s}
input:focus,select:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.15)}
button{cursor:pointer;border:none;font-weight:bold;letter-spacing:1px;transition:all .25s;border-radius:10px;padding:13px}
button:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
button:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.btn-primary:hover{opacity:.92;transform:translateY(-2px);box-shadow:0 6px 20px rgba(102,126,234,.4)}
.btn-secondary{background:#f0f0f0;color:#333}
.btn-outline{background:#fff;color:#667eea;border:2px solid #667eea}
.btn-outline:hover{background:#667eea;color:#fff}
.btn-sm{padding:6px 12px;font-size:13px;width:auto;margin:4px}
.btn-danger{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff}
.form-group{margin-bottom:8px}
.form-group label{display:block;margin-bottom:4px;font-size:13px;color:#555;font-weight:bold}
.link{color:#667eea;cursor:pointer;text-align:center;font-size:14px;margin-top:8px;text-decoration:underline}
  .link:hover{color:#764ba2}

  /* 登录/注册美化 */
  .auth-container{max-width:440px;margin:80px auto;padding:0 20px}
  .auth-card{background:#fff;border-radius:14px;padding:32px 28px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
  .auth-title{text-align:center;margin-bottom:22px;color:#333;font-size:18px;font-weight:bold}
  .row{display:flex;gap:10px;align-items:flex-end}
.row>div{flex:1}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 14px rgba(0,0,0,.05);border:1px solid #f0f0f0}
.question-box{font-size:36px;text-align:center;padding:24px;font-weight:bold;color:#333;letter-spacing:4px}
.timer{text-align:center;font-size:18px;color:#e74c3c;font-weight:bold;margin-bottom:8px}
.timer.warning{animation:blink .5s infinite}
@keyframes blink{50%{opacity:.3}}
.progress{text-align:center;font-size:13px;color:#888;margin-bottom:8px}
.result-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;margin-bottom:6px;font-size:14px}
.result-item.correct{background:#d4edda;color:#155724}
.result-item.wrong{background:#f8d7da;color:#721c24}
.score-big{font-size:48px;text-align:center;font-weight:bold;color:#667eea}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#667eea;color:#fff;padding:8px 6px;text-align:center}
td{padding:8px 6px;text-align:center;border-bottom:1px solid #eee}
tr:nth-child(even){background:#f8f9ff}
.chart-container{width:100%;height:220px;margin-top:12px}
.checkbox-list{max-height:200px;overflow-y:auto;margin-bottom:12px}
.checkbox-item{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid #eee;font-size:14px}
.checkbox-item input[type=checkbox]{width:18px;height:18px;margin-right:10px;accent-color:#667eea}
.rank-badge{display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;color:#fff;font-weight:bold;font-size:14px}
.rank-1{background:#f1c40f;width:36px;height:36px;line-height:36px;font-size:18px}
.rank-2{background:#bdc3c7}
.rank-3{background:#e67e22}
select{padding:10px}
/* 选手切换弹窗 */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:999;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:16px;padding:32px 28px;text-align:center;max-width:340px;width:90%;animation:popIn .3s ease;box-shadow:0 20px 60px rgba(0,0,0,.3)}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.modal-icon{font-size:48px;margin-bottom:8px}
.modal-title{font-size:16px;color:#888;margin-bottom:4px}
.modal-name{font-size:32px;font-weight:bold;color:#667eea;margin-bottom:20px}
/* 年级卡片 */
.grade-cards{display:flex;gap:10px;margin-bottom:16px}
.grade-card{flex:1;border:2px solid #e8e8e8;border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .25s;background:#fafafa;font-size:12px;color:#888}
.grade-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(102,126,234,.15)}
.grade-card.active{border-color:#667eea;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 4px 20px rgba(102,126,234,.35);transform:translateY(-2px)}
.grade-card.active .grade-desc{color:rgba(255,255,255,.75)}
.grade-card .grade-icon{font-size:32px;display:block;margin-bottom:4px}
.grade-card .grade-name{font-weight:bold;font-size:15px;display:block;margin-bottom:2px}
.grade-card .grade-desc{font-size:11px;line-height:1.4;color:#aaa}

/* 运算符号图标 */
.sym-icon{display:inline-block;width:34px;height:34px;line-height:34px;text-align:center;border-radius:10px;font-size:18px;font-weight:bold;margin-right:6px;vertical-align:middle}
.sym-add{background:#e8f5e9;color:#2e7d32}
.sym-sub{background:#fbe9e7;color:#bf360c}
.sym-mul{background:#fff3e0;color:#e65100}
.sym-div{background:#e3f2fd;color:#1565c0}
.sym-mix{background:#f3e5f5;color:#6a1b9a}
/* 时间芯片 */
.time-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.time-chip{padding:8px 14px;border:2px solid #e0e0e0;border-radius:20px;cursor:pointer;font-size:13px;background:#fff;color:#888;transition:.2s;white-space:nowrap}
.time-chip:hover{border-color:#667eea;color:#667eea}
.time-chip.active{border-color:#667eea;background:#667eea;color:#fff}
.time-slider-row{display:none;align-items:center;gap:8px;padding:4px 0 8px}
.time-slider-row.show{display:flex}
.time-slider-row input[type=range]{flex:1;accent-color:#667eea}
.time-slider-row span{font-weight:bold;color:#667eea;min-width:45px;text-align:right;font-size:14px}
/* 折叠区 */
.collapse-toggle{color:#667eea;font-size:13px;cursor:pointer;text-align:center;padding:8px;user-select:none}
.collapse-toggle:hover{text-decoration:underline}
.collapse-content{display:none;padding-top:8px}
  .collapse-content.open{display:block}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  /* 浮动运算符号背景 */
  .floating-symbols{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
  .float-sym{position:absolute;color:rgba(102,126,234,0.10);font-size:60px;font-weight:bold;animation:floatUp 15s infinite ease-in}
  .s1{left:5%;bottom:-80px;animation-delay:0s;font-size:70px}
  .s2{left:18%;bottom:-60px;animation-delay:2s;font-size:50px}
  .s3{left:32%;bottom:-100px;animation-delay:4s;font-size:80px}
  .s4{left:48%;bottom:-70px;animation-delay:6s;font-size:55px}
  .s5{left:62%;bottom:-90px;animation-delay:8s;font-size:65px}
  .s6{left:78%;bottom:-50px;animation-delay:10s;font-size:45px}
  .s7{left:88%;bottom:-110px;animation-delay:12s;font-size:75px}
  .s8{left:25%;bottom:-130px;animation-delay:3s;font-size:60px}
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(0deg);opacity:0}
    10%{opacity:1}
    90%{opacity:1}
    100%{transform:translateY(-110vh) rotate(360deg);opacity:0}
  }

  @media (max-width:400px){
  .tab-bar .tab{font-size:12px;padding:10px 4px}
  .container{border-radius:0;min-height:100vh}
  .page{height:calc(100vh - 60px)}
  .question-box{font-size:28px}
}
</style>
</head>
<body>
<div class="floating-symbols">
  <span class="float-sym s1">+</span>
  <span class="float-sym s2">−</span>
  <span class="float-sym s3">×</span>
  <span class="float-sym s4">÷</span>
  <span class="float-sym s5">+</span>
  <span class="float-sym s6">×</span>
  <span class="float-sym s7">−</span>
  <span class="float-sym s8">÷</span>
</div>
<div class="container">
  <div class="header">小学生整数四则运算练习</div>

  <!-- 页面0：登录/注册选择 -->
  <div class="page active" id="page-auth">
    <div class="auth-container">

    <!-- 登录区域 -->
    <div id="login-box">
      <div class="auth-card">
      <h3 class="auth-title">用户登录</h3>
      <div class="form-group"><label>用户名</label><input id="loginUser" placeholder="请输入用户名" autocomplete="off"></div>
      <div class="form-group"><label>密码</label><input id="loginPass" type="password" placeholder="请输入密码"></div>
      <button class="btn-primary" onclick="doLogin()">登 录</button>
      <div class="link" onclick="showRegister()">还没有账号？立即注册</div>
      </div>
    </div>

    <!-- 注册区域 -->
    <div id="register-box" style="display:none">
      <div class="auth-card">
      <h3 class="auth-title">注册新用户</h3>
      <div class="form-group"><label>用户名</label><input id="regUser" placeholder="请设置用户名" autocomplete="off"></div>
      <div class="form-group"><label>密码</label><input id="regPass" type="password" placeholder="请设置密码"></div>
      <div class="form-group"><label>确认密码</label><input id="regPass2" type="password" placeholder="请再次输入密码"></div>
      <button class="btn-primary" onclick="doRegister()">注 册</button>
      <div class="link" onclick="showLogin()">已有账号？返回登录</div>
      </div>
    </div>
    </div>
  </div>

  <!-- 页面1：主功能页（登录后显示） -->
  <div class="page" id="page-main">
    <div class="tab-bar">
      <button class="tab active" onclick="switchPage('setting')">开始练习</button>
      <button class="tab" onclick="switchPage('score')">成绩查询</button>
      <button class="tab" onclick="switchPage('comp')">多人比赛</button>
    </div>

    <!-- 设置 + 答题 -->
    <div id="sub-setting" style="display:block">
      <div class="card" style="margin-top:16px">
        <h3 style="margin-bottom:10px;color:#333">难度预设</h3>
        <div class="grade-cards">
          <div class="grade-card active" onclick="selectGrade('low')" id="cardLow">
            <span class="grade-icon">🌱</span><span class="grade-name">低年级</span>
          </div>
          <div class="grade-card" onclick="selectGrade('mid')" id="cardMid">
            <span class="grade-icon">🌿</span><span class="grade-name">中年级</span>
          </div>
          <div class="grade-card" onclick="selectGrade('high')" id="cardHigh">
            <span class="grade-icon">🌳</span><span class="grade-name">高年级</span>
          </div>
        </div>
        <div class="form-group"><label>运算类型</label>
          <select id="setOpType">
            <option value="+">加法</option>
            <option value="-">减法</option>
            <option value="×">乘法</option>
            <option value="÷">除法</option>
            <option value="mix" selected>混合运算</option>
          </select>
        </div>
        <div class="form-group"><label>最大位数</label>
          <select id="setDigits">
            <option value="1">1 位数</option>
            <option value="2" selected>2 位数</option>
            <option value="3">3 位数</option>
            <option value="4">4 位数</option>
          </select>
        </div>
        <div class="form-group"><label>出题数量</label>
          <select id="setCount">
            <option value="5">5 题</option>
            <option value="10" selected>10 题</option>
            <option value="15">15 题</option>
            <option value="20">20 题</option>
            <option value="50">50 题</option>
          </select>
        </div>
        <div class="form-group"><label>限时设置</label>
          <div style="display:flex;gap:24px;margin-bottom:8px">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px">
              <input type="radio" name="timeMode" checked onchange="setTimeMode(false)" style="width:16px;height:16px;margin:0;accent-color:#667eea"> 不限时
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px">
              <input type="radio" name="timeMode" onchange="setTimeMode(true)" style="width:16px;height:16px;margin:0;accent-color:#667eea"> 限时
            </label>
          </div>
          <div id="timeInputBox" style="display:none;align-items:center;gap:6px">
            <button onclick="adjustTime(-5)" style="width:34px;height:34px;font-size:18px;padding:0;line-height:1;border-radius:8px;border:1px solid #ddd;background:#f8f8f8;cursor:pointer;margin:0;font-weight:bold">−</button>
            <input type="number" id="setTime" value="30" min="5" max="300" step="5" onchange="onTimeInput()" style="width:70px;text-align:center;font-size:16px;margin:0;-moz-appearance:textfield">
            <button onclick="adjustTime(5)" style="width:34px;height:34px;font-size:18px;padding:0;line-height:1;border-radius:8px;border:1px solid #ddd;background:#f8f8f8;cursor:pointer;margin:0;font-weight:bold">+</button>
            <span style="font-size:14px;color:#888;margin-left:4px">秒/题</span>
          </div>
        </div>
        <button class="btn-primary" onclick="startQuiz()">开始练习</button>
      </div>
    </div>

    <!-- 答题界面 -->
    <div id="sub-quiz" style="display:none">
      <div class="timer" id="quizTimer"></div>
      <div class="progress" id="quizProgress"></div>
      <div class="question-box" id="quizQuestion"></div>
      <div class="form-group"><label>你的答案</label><input id="quizAnswer" type="number" step="any" placeholder="输入答案" autocomplete="off"></div>
      <div id="quizFeedback" style="min-height:24px;text-align:center;font-size:14px;margin-bottom:8px"></div>
      <button class="btn-primary" id="btnSubmit" onclick="submitAnswer()">提交答案</button>
      <button class="btn-secondary" style="margin-top:4px" onclick="cancelQuiz()">放弃本次练习</button>
    </div>

    <!-- 答题结果 -->
    <div id="sub-result" style="display:none">
      <h3 style="text-align:center;margin-bottom:8px">练习结束</h3>
      <div class="score-big" id="resultScore"></div>
      <div style="text-align:center;color:#888;margin-bottom:12px" id="resultTime"></div>
      <div id="resultDetail"></div>
      <button class="btn-primary" onclick="backToSetting()">返回设置</button>
    </div>

    <!-- 成绩查询 -->
    <div id="sub-score" style="display:none">
      <div style="margin-top:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">
        <h3 style="color:#333">历史成绩</h3>
        <button class="btn-sm btn-danger" onclick="clearScores()">清空记录</button>
      </div>
      <div style="max-height:250px;overflow-y:auto">
        <table id="scoreTable"><thead><tr><th>#</th><th>日期</th><th>类型</th><th>位数</th><th>得分</th><th>用时</th></tr></thead><tbody><tr><td colspan="6" style="color:#aaa">暂无记录</td></tr></tbody></table>
      </div>
      <div class="chart-container"><canvas id="scoreChart"></canvas></div>
    </div>

    <!-- 多人比赛 -->
    <div id="sub-comp" style="display:none">
      <div id="comp-select" style="margin-top:16px">
        <h3 style="margin-bottom:8px;color:#333">选择参赛选手（≥2人）</h3>
        <div class="checkbox-list" id="compUserList"></div>
        <button class="btn-primary" onclick="compStartSettings()">下一步：设置参数</button>
      </div>
      <div id="comp-settings" style="display:none">
        <h3 style="margin-bottom:8px;color:#333">比赛参数设置</h3>
        <div class="form-group"><label>运算类型</label>
          <select id="compOpType"><option value="+">加法</option><option value="-">减法</option><option value="×">乘法</option><option value="÷">除法</option><option value="mix" selected>混合运算</option></select>
        </div>
        <div class="form-group"><label>最大位数</label>
          <select id="compDigits"><option value="1">1 位数</option><option value="2" selected>2 位数</option><option value="3">3 位数</option><option value="4">4 位数</option></select>
        </div>
        <div class="form-group"><label>出题数量</label>
          <select id="compCount"><option value="5">5 题</option><option value="10" selected>10 题</option><option value="20">20 题</option></select>
        </div>
        <div class="row">
          <button class="btn-secondary" onclick="compBackSelect()">返回选择</button>
          <button class="btn-primary" onclick="compStart()">开始比赛</button>
        </div>
      </div>
      <div id="comp-quiz" style="display:none;margin-top:16px">
        <div style="text-align:center;font-size:15px;color:#667eea;font-weight:bold;margin-bottom:4px" id="compCurPlayer"></div>
        <div class="progress" id="compProgress"></div>
        <div class="question-box" id="compQuestion"></div>
        <div class="form-group"><label>答案</label><input id="compAnswer" type="number" step="any" placeholder="输入答案" autocomplete="off"></div>
        <button class="btn-primary" onclick="compSubmit()">提交答案</button>
      </div>
      <div id="comp-result" style="display:none;margin-top:16px">
        <h3 style="text-align:center;margin-bottom:12px">比赛结果</h3>
        <div id="compRankList"></div>
        <button class="btn-primary" onclick="compBackSelect()">再来一局</button>
      </div>
    </div>

    <div style="margin-top:auto;text-align:center;padding-top:16px">
      <span style="color:#888;font-size:13px">当前用户：</span><span style="color:#667eea;font-weight:bold;font-size:13px" id="curUser"></span>
      <button class="btn-sm btn-outline" style="margin-left:8px" onclick="logout()">退出登录</button>
    </div>
  </div>

  <!-- 选手切换弹窗 -->
  <div class="modal-overlay" id="playerModal">
    <div class="modal-box">
      <div class="modal-icon">🎯</div>
      <div class="modal-title">请将设备交给以下选手作答</div>
      <div class="modal-name" id="modalPlayerName"></div>
      <button class="btn-primary" style="width:200px;margin:0 auto" onclick="closePlayerModal()">开始作答</button>
    </div>
  </div>
</div>

<script>
// ==================== 数据管理 ====================
const DB_KEY = 'arith_app_data';
function loadDB(){ try{ var d=localStorage.getItem(DB_KEY); return d ? JSON.parse(d) : {users:{},scores:{}}; }catch(e){ return {users:{},scores:{}}; }}
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function getDB(){ return loadDB(); }

let currentUser = '';
let quizState = null;
let compState = null;
let quizTimerId = null;

// ==================== 页面切换 ====================
function showRegister(){ 
  document.getElementById('register-box').style.display='block'; 
  document.getElementById('login-box').style.display='none'; 
  document.getElementById('regUser').value='';
  document.getElementById('regPass').value='';
  document.getElementById('regPass2').value='';
}
function showLogin(){ 
  document.getElementById('register-box').style.display='none'; 
  document.getElementById('login-box').style.display='block'; 
}

function switchPage(name){
  document.querySelectorAll('#sub-setting,#sub-score,#sub-comp,#sub-quiz,#sub-result').forEach(function(el){el.style.display='none';});
  document.getElementById('sub-'+name).style.display='block';
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  event.target.classList.add('active');
  if(name==='score') loadScorePage();
  if(name==='comp') loadCompSelect();
}

// ==================== 注册登录 ====================
function doRegister(){
  var u=document.getElementById('regUser').value.trim();
  var p=document.getElementById('regPass').value;
  var p2=document.getElementById('regPass2').value;
  if(!u||!p){ alert('用户名和密码不能为空！'); return; }
  if(p!==p2){ alert('两次密码不一致！'); return; }
  var db=getDB();
  if(db.users[u]){ alert('用户名已存在！'); return; }
  db.users[u]={password:p, prefs:{opType:'+', digits:'1', count:'5', timeLimited:false, timeSec:30}};
  saveDB(db);
  alert('注册成功！请登录。');
  document.getElementById('loginUser').value=u;
  document.getElementById('loginPass').value='';
  showLogin();
}

function doLogin(){
  var u=document.getElementById('loginUser').value.trim();
  var p=document.getElementById('loginPass').value;
  if(!u||!p){ alert('请输入用户名和密码！'); return; }
  var db=getDB();
  if(!db.users[u]){ alert('用户不存在！请先注册。'); return; }
  var stored=db.users[u];
  var realPass=(typeof stored==='string')?stored:stored.password;
  if(realPass!==p){ alert('密码错误！'); return; }
  // 兼容旧格式：将字符串密码升级为对象
  if(typeof stored==='string'){ db.users[u]={password:stored, prefs:{opType:'+', digits:'1', count:'5', timeLimited:false, timeSec:30}}; saveDB(db); }
  currentUser=u;
  document.getElementById('curUser').textContent=u;
  document.getElementById('page-auth').classList.remove('active');
  document.getElementById('page-main').classList.add('active');
  switchToByName('setting');
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelector('.tab').classList.add('active');
  loadPrefs();  // 加载用户偏好设置
}

function savePrefs(){
  if(!currentUser) return;
  var db=getDB();
  if(!db.users[currentUser]||typeof db.users[currentUser]==='string') return;
  db.users[currentUser].prefs={
    opType: document.getElementById('setOpType').value,
    digits: document.getElementById('setDigits').value,
    count: document.getElementById('setCount').value,
    timeLimited: timeModeLimited,
    timeSec: parseInt(document.getElementById('setTime').value)||30
  };
  saveDB(db);
}

function loadPrefs(){
  if(!currentUser) return;
  var db=getDB();
  var user=db.users[currentUser];
  if(!user||typeof user==='string'||!user.prefs) return;
  var p=user.prefs;
  document.getElementById('setOpType').value=p.opType||'+';
  document.getElementById('setDigits').value=p.digits||'1';
  document.getElementById('setCount').value=p.count||'5';
  if(p.timeLimited){ setTimeMode(true); document.getElementById('setTime').value=p.timeSec||30; }
  else setTimeMode(false);
  selectGrade('low');  // 加载后高亮对应卡片
}

function switchToByName(name){
  document.querySelectorAll('#sub-setting,#sub-score,#sub-comp,#sub-quiz,#sub-result').forEach(function(el){el.style.display='none';});
  document.getElementById('sub-'+name).style.display='block';
}

function logout(){
  if(quizTimerId) clearInterval(quizTimerId);
  quizState=null; compState=null;
  currentUser='';
  document.getElementById('page-main').classList.remove('active');
  document.getElementById('page-auth').classList.add('active');
  document.getElementById('loginPass').value='';
}

// ==================== 题目生成 ====================
function generateNumber(digits){
  var min=digits===1?0:Math.pow(10,digits-1);
  var max=Math.pow(10,digits)-1;
  return Math.floor(Math.random()*(max-min+1))+min;
}

function generateQuestion(opType, digits){
  var op;
  if(opType==='mix'){
    var ops=['+','-','×','÷']; op=ops[Math.floor(Math.random()*4)];
  } else { op=opType; }
  var a,b,answer,question;
  var maxNum=Math.pow(10,digits)-1;
  var minNum=digits===1?0:Math.pow(10,digits-1);

  if(op==='÷'){
    // 生成被除数a（在位数范围内），再找合适的除数b
    a=generateNumber(digits);
    // 找出a的所有在位数范围内的因数（≥2）
    var divisors=[];
    var maxDiv=Math.min(maxNum, Math.floor(Math.sqrt(a)));
    for(var d=2; d<=maxDiv; d++){
      if(a%d===0){
        var q=a/d;
        if(q>=minNum && q<=maxNum) divisors.push(d);
        if(q!==d && q>=minNum && q<=maxNum && d>=minNum && d<=maxNum) divisors.push(q);
      }
    }
    if(divisors.length>0){
      b=divisors[Math.floor(Math.random()*divisors.length)];
      answer=a/b;
    } else {
      // 无法找到合适因数，改用简单方式
      b=generateNumber(Math.min(digits,2)); if(b===0) b=2;
      answer=generateNumber(Math.min(digits,2)); if(answer===0) answer=2;
      a=answer*b;
      // 如果a超限，重新调整
      if(a>maxNum){
        b=2+Math.floor(Math.random()*9);
        answer=Math.floor(Math.random()*(maxNum/b-minNum)+minNum);
        a=answer*b;
        if(a>maxNum){ a=maxNum; answer=Math.floor(a/b); a=answer*b; }
      }
    }
    question=a+' ÷ '+b+' = ?';
  } else if(op==='×'){
    a=generateNumber(digits); b=generateNumber(digits);
    answer=a*b;
    question=a+' × '+b+' = ?';
  } else if(op==='-'){
    a=generateNumber(digits); b=generateNumber(digits);
    if(a<b){ var t=a;a=b;b=t; }
    answer=a-b;
    question=a+' - '+b+' = ?';
  } else {
    a=generateNumber(digits); b=generateNumber(digits);
    answer=a+b;
    question=a+' + '+b+' = ?';
  }
  return {question:question, answer:answer};
}

function generateUniqueQuestions(opType, digits, count){
  var questions=[], attempts=0, maxAttempts=count*20;
  while(questions.length<count && attempts<maxAttempts){
    attempts++;
    var q=generateQuestion(opType, digits);
    var dup=questions.some(function(x){return x.question===q.question;});
    if(!dup) questions.push(q);
  }
  while(questions.length<count){
    questions.push(generateQuestion(opType, digits));
  }
  return questions;
}

// ==================== 答题逻辑 ====================
function startQuiz(){
  var opType=document.getElementById('setOpType').value;
  var digits=parseInt(document.getElementById('setDigits').value);
  var count=parseInt(document.getElementById('setCount').value);
  var timeLimit=isTimeLimited() ? (parseInt(document.getElementById('setTime').value)||30) : 0;

  savePrefs();  // 自动保存用户偏好设置

  if(quizTimerId) clearInterval(quizTimerId);

  quizState={
    opType:opType, digits:digits, count:count, timeLimit:timeLimit,
    questions:generateUniqueQuestions(opType, digits, count),
    currentIdx:0, score:0, answers:[], startTime:Date.now(), elapsed:0,
    qStartTime:Date.now(), qTimeLimit:timeLimit
  };

  document.getElementById('sub-setting').style.display='none';
  document.getElementById('sub-quiz').style.display='block';
  document.getElementById('sub-result').style.display='none';
  showCurrentQuestion();
}

function showCurrentQuestion(){
  if(!quizState) return;
  var q=quizState.questions[quizState.currentIdx];
  document.getElementById('quizQuestion').textContent=q.question;
  document.getElementById('quizProgress').textContent='第 '+(quizState.currentIdx+1)+' / '+quizState.count+' 题';
  document.getElementById('quizAnswer').value='';
  document.getElementById('quizFeedback').textContent='';
  document.getElementById('btnSubmit').style.display='block';
  quizState.qStartTime=Date.now();
  if(quizState.qTimeLimit>0){
    startTimer();
  } else {
    document.getElementById('quizTimer').textContent='';
    document.getElementById('quizTimer').classList.remove('warning');
  }
}

function startTimer(){
  if(quizTimerId) clearInterval(quizTimerId);
  var total=quizState.qTimeLimit;
  function tick(){
    if(!quizState) return;
    var elapsed=Math.floor((Date.now()-quizState.qStartTime)/1000);
    var remaining=total-elapsed;
    if(remaining<=0){
      document.getElementById('quizTimer').textContent='超时！';
      document.getElementById('quizTimer').classList.add('warning');
      submitAnswer(true);
      return;
    }
    document.getElementById('quizTimer').textContent='剩余 '+remaining+' 秒';
    if(remaining<=5) document.getElementById('quizTimer').classList.add('warning');
    else document.getElementById('quizTimer').classList.remove('warning');
  }
  tick();
  quizTimerId=setInterval(tick, 1000);
}

function submitAnswer(timeout){
  if(!quizState) return;
  if(quizTimerId){ clearInterval(quizTimerId); quizTimerId=null; }
  var userAnswer=document.getElementById('quizAnswer').value.trim();
  var q=quizState.questions[quizState.currentIdx];
  var correct=!timeout && parseFloat(userAnswer)===q.answer;
  var isCorrect=correct;

  if(correct){
    quizState.score++;
    document.getElementById('quizFeedback').innerHTML='<span style="color:#27ae60">✔ 正确！</span>';
  } else {
    document.getElementById('quizFeedback').innerHTML='<span style="color:#e74c3c">✘ 错误！正确答案：'+q.answer+'</span>';
  }
  quizState.answers.push({
    question:q.question, userAnswer:timeout?'超时未答':userAnswer,
    correctAnswer:q.answer, correct:isCorrect
  });
  document.getElementById('btnSubmit').style.display='none';

  setTimeout(function(){
    quizState.currentIdx++;
    if(quizState.currentIdx>=quizState.count){
      finishQuiz();
      return;
    }
    showCurrentQuestion();
    document.getElementById('quizAnswer').focus();
  }, 800);
}

function finishQuiz(){
  quizState.elapsed=Math.floor((Date.now()-quizState.startTime)/1000);
  var db=getDB();
  if(!db.scores[currentUser]) db.scores[currentUser]=[];
  db.scores[currentUser].push({
    date:new Date().toLocaleString('zh-CN'),
    opType:quizState.opType==='mix'?'混合':quizState.opType,
    digits:quizState.digits,
    count:quizState.count,
    score:quizState.score,
    total:quizState.count,
    elapsed:quizState.elapsed,
    timeLimit:quizState.timeLimit>0?quizState.timeLimit:0,
    detail:quizState.answers
  });
  saveDB(db);

  document.getElementById('sub-quiz').style.display='none';
  document.getElementById('sub-result').style.display='block';
  document.getElementById('resultScore').textContent=quizState.score+' / '+quizState.count;
  document.getElementById('resultTime').textContent='用时 '+quizState.elapsed+' 秒'+(quizState.timeLimit>0?'（不超时每题限时 '+quizState.timeLimit+' 秒）':'');
  var detailHTML='';
  quizState.answers.forEach(function(a,i){
    detailHTML+='<div class="result-item '+(a.correct?'correct':'wrong')+'"><span>第'+(i+1)+'题: '+a.question+'</span><span>'+(a.correct?'✔ 正确':'✘ 正确答案：'+a.correctAnswer)+'</span></div>';
  });
  document.getElementById('resultDetail').innerHTML=detailHTML;
  quizState=null;
}

function cancelQuiz(){
  if(confirm('确定要放弃本次练习吗？')) {
    if(quizTimerId){ clearInterval(quizTimerId); quizTimerId=null; }
    quizState=null;
    backToSetting();
  }
}

function backToSetting(){
  document.getElementById('sub-quiz').style.display='none';
  document.getElementById('sub-result').style.display='none';
  document.getElementById('sub-setting').style.display='block';
}

function selectGrade(grade){
  document.querySelectorAll('.grade-card').forEach(function(c){c.classList.remove('active');});
  document.getElementById('card'+grade.charAt(0).toUpperCase()+grade.slice(1)).classList.add('active');
  if(grade==='low'){
    document.getElementById('setOpType').value='+';
    document.getElementById('setDigits').value='1';
    document.getElementById('setCount').value='5';
  }else if(grade==='mid'){
    document.getElementById('setOpType').value='mix';
    document.getElementById('setDigits').value='2';
    document.getElementById('setCount').value='10';
  }else{
    document.getElementById('setOpType').value='mix';
    document.getElementById('setDigits').value='3';
    document.getElementById('setCount').value='15';
  }
}

var timeModeLimited=false;
function isTimeLimited(){ return timeModeLimited; }

function setTimeMode(limited){
  timeModeLimited=limited;
  document.getElementById('timeInputBox').style.display=limited?'flex':'none';
}
function adjustTime(delta){
  var inp=document.getElementById('setTime');
  var v=parseInt(inp.value)||30;
  v=Math.max(5, Math.min(300, v+delta));
  inp.value=v;
}

  var v=parseInt(document.getElementById('setTime').value)||30;
  if(v<5) document.getElementById('setTime').value=5;
  if(v>300) document.getElementById('setTime').value=300;
}

// ==================== 成绩查询 ====================
function loadScorePage(){
  var db=getDB();
  var scores=db.scores[currentUser]||[];
  var tbody=document.querySelector('#scoreTable tbody');
  if(scores.length===0){
    tbody.innerHTML='<tr><td colspan="6" style="color:#aaa">暂无记录</td></tr>';
  } else {
    var html='';
    scores.forEach(function(s,i){
      html+='<tr><td>'+(i+1)+'</td><td>'+s.date+'</td><td>'+s.opType+'</td><td>'+s.digits+'位</td><td>'+s.score+'/'+s.total+'</td><td>'+s.elapsed+'s</td></tr>';
    });
    tbody.innerHTML=html;
  }
  drawChart(scores);
}

function drawChart(scores){
  var canvas=document.getElementById('scoreChart');
  if(!canvas) return;
  var ctx=canvas.getContext('2d');
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=250*dpr;
  canvas.style.width=rect.width+'px';
  canvas.style.height='250px';
  ctx.scale(dpr,dpr);
  var w=rect.width,h=250,pl=55,pr=25,pt=25,pb=55,cw=w-pl-pr,ch=h-pt-pb;

  ctx.clearRect(0,0,w,h);
  if(scores.length===0){ ctx.fillStyle='#aaa';ctx.font='14px "Microsoft YaHei"';ctx.textAlign='center';ctx.fillText('暂无数据，开始练习吧！',w/2,h/2);return; }

  var lastN=scores.slice(-10);
  var rates=lastN.map(function(s){ return s.total>0 ? Math.round(s.score/s.total*100) : 0; });

  // 网格线
  ctx.strokeStyle='#e8e8e8';ctx.lineWidth=1;ctx.beginPath();
  for(var i=0;i<=4;i++){ var y=pt+ch*i/4; ctx.moveTo(pl,y); ctx.lineTo(w-pr,y); }
  for(var j=0;j<lastN.length;j++){ var x=pl+cw*j/(lastN.length-1||1); ctx.moveTo(x,pt); ctx.lineTo(x,pt+ch); }
  ctx.stroke();

  // Y轴标签
  ctx.save();
  ctx.fillStyle='#555';ctx.font='bold 13px "Microsoft YaHei"';ctx.textAlign='center';
  ctx.translate(12,pt+ch/2);ctx.rotate(-Math.PI/2);
  ctx.fillText('正确率',0,0);
  ctx.restore();

  // Y轴刻度
  for(var k=0;k<=4;k++){
    ctx.fillStyle='#888';ctx.font='11px "Microsoft YaHei"';ctx.textAlign='right';
    ctx.fillText((100-k*25)+'%',pl-8,pt+ch*k/4+4);
  }

  // 柱状图
  var barW=Math.min(30, cw/lastN.length*0.6);
  var grad=ctx.createLinearGradient(0,pt,0,pt+ch);
  grad.addColorStop(0,'#a78bfa');grad.addColorStop(1,'#667eea');
  lastN.forEach(function(s,i){
    var x=pl+cw*i/(lastN.length-1||1);
    var barH=(rates[i]/100)*ch;
    var y=pt+ch-barH;
    ctx.fillStyle='rgba(102,126,234,0.5)';ctx.fillRect(x-barW/2,y,barW,barH);
    ctx.fillStyle='#555';ctx.font='bold 10px "Microsoft YaHei"';ctx.textAlign='center';ctx.fillText(rates[i]+'%',x,y-4);
    ctx.fillStyle='#999';ctx.font='9px "Microsoft YaHei"';ctx.fillText('第'+(i+1)+'次',x,pt+ch+14);
  });

  // 折线
  ctx.strokeStyle='#e74c3c';ctx.lineWidth=2.5;ctx.beginPath();
  lastN.forEach(function(s,i){
    var x=pl+cw*i/(lastN.length-1||1);
    var y=pt+ch-(rates[i]/100)*ch;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  lastN.forEach(function(s,i){
    var x=pl+cw*i/(lastN.length-1||1);
    var y=pt+ch-(rates[i]/100)*ch;
    ctx.fillStyle='#e74c3c';ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();
  });

  // X轴标签
  ctx.fillStyle='#555';ctx.font='bold 13px "Microsoft YaHei"';ctx.textAlign='center';
  ctx.fillText('练习次数',w/2,h-12);
}

    var db=getDB(); db.scores[currentUser]=[]; saveDB(db); loadScorePage();
  }
}

// ==================== 多人比赛 ====================
function loadCompSelect(){
  var db=getDB();
  var users=Object.keys(db.users);
  var html='';
  users.forEach(function(u){
    if(u===currentUser) return;
    html+='<label class="checkbox-item"><input type="checkbox" value="'+u+'">'+u+'</label>';
  });
  document.getElementById('compUserList').innerHTML=html||'<div style="color:#aaa;text-align:center;padding:20px">暂无其他用户，请先注册更多账号</div>';
  document.getElementById('comp-select').style.display='block';
  document.getElementById('comp-settings').style.display='none';
  document.getElementById('comp-quiz').style.display='none';
  document.getElementById('comp-result').style.display='none';
}

function compStartSettings(){
  var checks=document.querySelectorAll('#compUserList input:checked');
  if(checks.length===0){ alert('请至少选择1名选手！（实际比赛需要≥2人）'); return; }
  compState={players:[currentUser]};
  checks.forEach(function(c){ compState.players.push(c.value); });
  if(compState.players.length<2){ alert('至少需要2名选手才能比赛！'); return; }
  document.getElementById('comp-select').style.display='none';
  document.getElementById('comp-settings').style.display='block';
}

function compBackSelect(){
  compState=null;
  loadCompSelect();
}

function compStart(){
  compState.opType=document.getElementById('compOpType').value;
  compState.digits=parseInt(document.getElementById('compDigits').value);
  compState.count=parseInt(document.getElementById('compCount').value);
  compState.playerIdx=0;
  compState.qIdx=0;
  // 为每个选手生成独立的题目
  compState.playerResults={};
  compState.players.forEach(function(p){
    compState.playerResults[p]={questions:generateUniqueQuestions(compState.opType, compState.digits, compState.count), answers:[], startTime:0, elapsed:0};
  });
  document.getElementById('comp-settings').style.display='none';
  document.getElementById('comp-quiz').style.display='block';
  document.getElementById('comp-result').style.display='none';
  // 第一个选手弹窗
  showPlayerModal(compState.players[0]);
}

function showPlayerModal(name){
  document.getElementById('modalPlayerName').textContent=name;
  document.getElementById('playerModal').classList.add('show');
}
function closePlayerModal(){
  document.getElementById('playerModal').classList.remove('show');
  startPlayerQuiz();
}

function startPlayerQuiz(){
  var player=compState.players[compState.playerIdx];
  compState.playerResults[player].startTime=Date.now();
  compState.qIdx=0;
  document.getElementById('compCurPlayer').textContent='选手：'+player;
  showCompQuestion();
  document.getElementById('compAnswer').focus();
}

function showCompQuestion(){
  if(compState.qIdx>=compState.count){
    finishPlayerQuiz();
    return;
  }
  var player=compState.players[compState.playerIdx];
  var q=compState.playerResults[player].questions[compState.qIdx];
  document.getElementById('compProgress').textContent='第 '+(compState.qIdx+1)+' / '+compState.count+' 题';
  document.getElementById('compQuestion').textContent=q.question;
  document.getElementById('compAnswer').value='';
  document.getElementById('compAnswer').focus();
}

function compSubmit(){
  var player=compState.players[compState.playerIdx];
  var q=compState.playerResults[player].questions[compState.qIdx];
  var ua=document.getElementById('compAnswer').value.trim();
  var correct=parseFloat(ua)===q.answer;
  compState.playerResults[player].answers.push({
    question:q.question, userAnswer:ua||'未作答', correctAnswer:q.answer, correct:correct
  });
  compState.qIdx++;
  showCompQuestion();
}

function finishPlayerQuiz(){
  var player=compState.players[compState.playerIdx];
  compState.playerResults[player].elapsed=Math.floor((Date.now()-compState.playerResults[player].startTime)/1000);
  compState.playerIdx++;
  if(compState.playerIdx>=compState.players.length){
    compShowResult();
    return;
  }
  // 下一名选手弹窗
  setTimeout(function(){
    showPlayerModal(compState.players[compState.playerIdx]);
  }, 600);
}

function compShowResult(){
  document.getElementById('comp-quiz').style.display='none';
  document.getElementById('comp-result').style.display='block';
  var arr=[];
  compState.players.forEach(function(p){
    var r=compState.playerResults[p];
    var score=0;
    r.answers.forEach(function(a){ if(a.correct) score++; });
    arr.push({name:p, score:score, total:compState.count, elapsed:r.elapsed});
  });
  arr.sort(function(a,b){
    if(b.score!==a.score) return b.score-a.score;
    return a.elapsed-b.elapsed;
  });

  var html='<div style="font-size:13px;color:#888;margin-bottom:12px;text-align:center">排名规则：答对多者胜，相同得分用时短者胜</div>';
  arr.forEach(function(a,i){
    var badgeClass='';
    if(i===0) badgeClass=' rank-1';
    else if(i===1) badgeClass=' rank-2';
    else if(i===2) badgeClass=' rank-3';
    var medal='';
    if(i===0) medal='🥇'; else if(i===1) medal='🥈'; else if(i===2) medal='🥉'; else medal='';
    html+='<div class="result-item" style="display:flex;align-items:center;gap:10px">'+
      '<span class="rank-badge'+badgeClass+'">'+(i+1)+'</span>'+
      '<span style="flex:1;font-weight:bold">'+medal+' '+a.name+'</span>'+
      '<span>'+a.score+'/'+a.total+' &nbsp; '+a.elapsed+'秒</span></div>';
  });
  document.getElementById('compRankList').innerHTML=html;

  // 保存比赛成绩到各选手个人记录
  var db=getDB();
  if(!db.scores) db.scores={};
  arr.forEach(function(a){
    if(!db.scores[a.name]) db.scores[a.name]=[];
    db.scores[a.name].push({score:a.score, total:a.total, elapsed:a.elapsed, opType:'竞赛', digits:0, time:new Date().toLocaleString()});
  });
  saveDB(db);
}

  if(e.key==='Enter' && !quizState) return;
  if(e.key==='Enter') submitAnswer();
