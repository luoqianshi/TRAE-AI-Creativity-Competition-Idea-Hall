<body>

                <span class="label">圈数</span>

            </div>
            <div class="info-item">

                <span class="label">时间</span>

            </div>

    <div class="game-body">

                            <span>跳跃</span>

            <!-- 游戏结束覆盖层 -->

    <script>
        // ==================== 游戏核心 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'waiting';
        let gameLoop = null;
        let timerInterval = null;
        let gameTime = 0;
        let currentLap = 1;
        let maxLaps = 3;
        let trackLength = 3000;

        const keys = {};

        // 赛道配置
        const trackConfig = {
            groundY: 450,
            segments: [
                { type: 'normal', length: 400 },
                { type: 'hurdles', length: 500, hurdleInterval: 150 },
                { type: 'normal', length: 300 },
                { type: 'swings', length: 400 },
                { type: 'normal', length: 300 },
                { type: 'moving', length: 400 },
                { type: 'normal', length: 300 },
                { type: 'spikes', length: 400 },
                { type: 'normal', length: 300 },
                { type: 'mixed', length: 500 }
            ]
        };

        // 生成障碍物
        function generateObstacles() {
            const obstacles = [];
            let x = 300;

            for (let seg of trackConfig.segments) {
                if (seg.type === 'hurdles') {
                    for (let i = 0; i < seg.length; i += seg.hurdleInterval) {
                        obstacles.push({
                            x: x + i,
                            y: trackConfig.groundY - 40,
                            w: 20,
                            h: 40,
                            type: 'hurdle'
                        });
                    }
                } else if (seg.type === 'swings') {
                    for (let i = 100; i < seg.length; i += 200) {
                        obstacles.push({
                            x: x + i,
                            y: trackConfig.groundY - 120,
                            w: 60,
                            h: 60,
                            type: 'swing',
                            angle: Math.random() * Math.PI * 2,
                            speed: 0.02 + Math.random() * 0.02,
                            length: 100
                        });
                    }
                } else if (seg.type === 'moving') {
                    for (let i = 100; i < seg.length; i += 250) {
                        obstacles.push({
                            x: x + i,
                            y: trackConfig.groundY - 50,
                            w: 50,
                            h: 50,
                            type: 'movingBlock',
                            range: 100,
                            speed: 2,
                            originX: x + i
                        });
                    }
                } else if (seg.type === 'spikes') {
                    for (let i = 50; i < seg.length; i += 100) {
                        obstacles.push({
                            x: x + i,
                            y: trackConfig.groundY - 30,
                            w: 40,
                            h: 30,
                            type: 'spike'
                        });
                    }
                } else if (seg.type === 'mixed') {
                    for (let i = 100; i < seg.length; i += 200) {
                        const types = ['hurdle', 'swing', 'movingBlock', 'spike'];
                        const type = types[Math.floor(Math.random() * types.length)];
                        if (type === 'hurdle') {
                            obstacles.push({ x: x + i, y: trackConfig.groundY - 40, w: 20, h: 40, type: 'hurdle' });
                        } else if (type === 'swing') {
                            obstacles.push({ x: x + i, y: trackConfig.groundY - 120, w: 60, h: 60, type: 'swing', angle: 0, speed: 0.03, length: 100 });
                        } else if (type === 'movingBlock') {
                            obstacles.push({ x: x + i, y: trackConfig.groundY - 50, w: 50, h: 50, type: 'movingBlock', range: 80, speed: 2, originX: x + i });
                        } else {
                            obstacles.push({ x: x + i, y: trackConfig.groundY - 30, w: 40, h: 30, type: 'spike' });
                        }
                    }
                }
                x += seg.length;
            }

            trackLength = x + 200;
            return obstacles;
        }

        let obstacles = generateObstacles();

        // 玩家类
        class Runner {
            constructor(id, name, color, isAI = false) {
                this.id = id;
                this.name = name;
                this.color = color;
                this.isAI = isAI;
                this.x = 50 + id * 30;
                this.y = trackConfig.groundY - 40;
                this.w = 30;
                this.h = 40;
                this.vx = 0;
                this.vy = 0;
                this.speed = isAI ? 3 + Math.random() * 2 : 5;
                this.jumpPower = 14;
                this.onGround = true;
                this.crouch = false;
                this.lap = 1;
                this.finished = false;
                this.finishTime = 0;
                this.stunned = 0;
                this.animFrame = 0;
                this.runCycle = 0;
            }

            update() {
                if (this.finished) return;
                if (this.stunned > 0) {
                    this.stunned--;
                    return;
                }

                if (this.isAI) {
                    this.aiUpdate();
                } else {
                    this.playerUpdate();
                }

                // 物理
                this.vy += 0.7;
                this.x += this.vx;
                this.y += this.vy;

                // 地面碰撞
                if (this.y + this.h > trackConfig.groundY) {
                    this.y = trackConfig.groundY - this.h;
                    this.vy = 0;
                    this.onGround = true;
                }

                // 摩擦力
                this.vx *= 0.9;

                // 检查障碍物碰撞
                this.checkObstacleCollision();

                // 检查圈数
                if (this.x >= trackLength) {
                    this.x = 0;
                    this.lap++;
                    if (this.lap > maxLaps) {
                        this.finished = true;
                        this.finishTime = gameTime;
                    }
                }

                this.animFrame++;
                if (Math.abs(this.vx) > 0.5) {
                    this.runCycle += 0.2;
                }
            }

            playerUpdate() {
                if (keys['ArrowLeft'] || keys['a']) {
                    this.vx = -this.speed;
                }
                if (keys['ArrowRight'] || keys['d']) {
                    this.vx = this.speed;
                }
                if ((keys['ArrowUp'] || keys['w'] || keys[' ']) && this.onGround) {
                    this.vy = -this.jumpPower;
                    this.onGround = false;
                }
                this.crouch = keys['ArrowDown'] || keys['s'];
                if (this.crouch) {
                    this.h = 25;
                    this.y = trackConfig.groundY - 25;
                } else {
                    this.h = 40;
                }
            }

            aiUpdate() {
                // AI向前跑
                this.vx = this.speed;

                // AI躲避障碍
                for (let obs of obstacles) {
                    const dx = obs.x - this.x;
                    if (dx > 0 && dx < 150) {
                        if (obs.type === 'hurdle' || obs.type === 'spike') {
                            if (this.onGround && dx < 80) {
                                this.vy = -this.jumpPower;
                                this.onGround = false;
                            }
                        } else if (obs.type === 'swing') {
                            const swingY = obs.y + Math.sin(obs.angle) * obs.length;
                            if (Math.abs(swingY - this.y) < 60 && dx < 60) {
                                if (this.onGround) {
                                    this.vy = -this.jumpPower * 0.8;
                                    this.onGround = false;
                                }
                            }
                        } else if (obs.type === 'movingBlock') {
                            if (dx < 70) {
                                this.vx = this.speed * 0.5;
                            }
                        }
                    }
                }

                // 随机失误
                if (Math.random() < 0.003) {
                    this.stunned = 30;
                }
            }

            checkObstacleCollision() {
                for (let obs of obstacles) {
                    let ox = obs.x, oy = obs.y, ow = obs.w, oh = obs.h;

                    if (obs.type === 'swing') {
                        ox += Math.cos(obs.angle) * obs.length;
                        oy += Math.sin(obs.angle) * obs.length;
                    }

                    if (obs.type === 'movingBlock') {
                        ox = obs.originX + Math.sin(Date.now() / 1000 * obs.speed) * obs.range;
                    }

                    if (this.x < ox + ow && this.x + this.w > ox &&
                        this.y < oy + oh && this.y + this.h > oy) {
                        // 碰撞
                        if (obs.type === 'spike') {
                            this.stunned = 60;
                            this.vx = -3;
                        } else {
                            this.stunned = 20;
                            this.vx = -2;
                        }
                    }
                }
            }

            draw(ctx, camX) {
                const screenX = this.x - camX;
                if (screenX < -50 || screenX > canvas.width + 50) return;

                ctx.save();

                // 阴影
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.ellipse(screenX + this.w/2, this.y + this.h + 5, this.w/2, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                // 身体
                ctx.fillStyle = this.color;
                const bodyY = this.crouch ? this.y + 15 : this.y;
                const bodyH = this.crouch ? 25 : 40;

                // 跑步动画
                const legOffset = Math.sin(this.runCycle) * 8;
                const armOffset = Math.sin(this.runCycle + Math.PI) * 6;

                // 腿
                ctx.fillStyle = this.color;
                ctx.fillRect(screenX + 5, bodyY + bodyH - 15 + legOffset, 8, 15);
                ctx.fillRect(screenX + 17, bodyY + bodyH - 15 - legOffset, 8, 15);

                // 身体
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.roundRect(screenX, bodyY, this.w, bodyH - 15, 8);
                ctx.fill();

                // 头
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(screenX + this.w/2, bodyY - 8, 12, 0, Math.PI * 2);
                ctx.fill();

                // 高光
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.arc(screenX + this.w/2 - 3, bodyY - 10, 5, 0, Math.PI * 2);
                ctx.fill();

                // 眼睛
                ctx.fillStyle = '#fff';
                const eyeDir = this.vx > 0 ? 2 : this.vx < 0 ? -2 : 0;
                ctx.beginPath();
                ctx.arc(screenX + 10 + eyeDir, bodyY - 10, 3, 0, Math.PI * 2);
                ctx.arc(screenX + 20 + eyeDir, bodyY - 10, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(screenX + 11 + eyeDir, bodyY - 10, 1.5, 0, Math.PI * 2);
                ctx.arc(screenX + 21 + eyeDir, bodyY - 10, 1.5, 0, Math.PI * 2);
                ctx.fill();

                // 手臂
                ctx.fillStyle = this.color;
                ctx.fillRect(screenX - 3, bodyY + 5 + armOffset, 6, 12);
                ctx.fillRect(screenX + this.w - 3, bodyY + 5 - armOffset, 6, 12);

                // 眩晕效果
                if (this.stunned > 0) {
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
                    ctx.beginPath();
                    ctx.arc(screenX + this.w/2, bodyY - 8, 20, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ff6b6b';
                    ctx.font = 'bold 16px sans-serif';
                    ctx.fillText('💫', screenX + this.w/2 - 8, bodyY - 25);
                }

                // 名字
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.beginPath();
                ctx.roundRect(screenX - 10, bodyY - 45, this.w + 20, 18, 5);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(this.name, screenX + this.w/2, bodyY - 32);

                ctx.restore();
            }
        }

        // 玩家列表
        const players = [
            new Runner(1, '我', '#ff6b9d', false),
            new Runner(2, '闪电侠', '#667eea', true),
            new Runner(3, '飞毛腿', '#f093fb', true),
            new Runner(4, '风速狗', '#43e97b', true)
        ];

        // 相机
        let camera = { x: 0 };

        // ==================== 绘制函数 ====================
        function drawTrack(camX) {
            // 地面
            const groundGradient = ctx.createLinearGradient(0, trackConfig.groundY, 0, canvas.height);
            groundGradient.addColorStop(0, '#2a2a4a');
            groundGradient.addColorStop(1, '#1a1a3a');
            ctx.fillStyle = groundGradient;
            ctx.fillRect(0, trackConfig.groundY, canvas.width, canvas.height - trackConfig.groundY);

            // 地面线条
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, trackConfig.groundY);
            ctx.lineTo(canvas.width, trackConfig.groundY);
            ctx.stroke();

            // 绘制赛道标记
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            for (let i = Math.floor(camX / 100) * 100; i < camX + canvas.width; i += 100) {
                const sx = i - camX;
                ctx.fillRect(sx, trackConfig.groundY, 2, canvas.height - trackConfig.groundY);

                // 距离标记
                if (i % 500 === 0) {
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`${i}m`, sx, trackConfig.groundY + 20);
                    ctx.fillStyle = 'rgba(255,255,255,0.05)';
                }
            }

            // 起点线
            const startX = -camX;
            if (startX > -50 && startX < canvas.width) {
                ctx.fillStyle = '#00d9a5';
                for (let i = 0; i < 10; i++) {
                    if (i % 2 === 0) {
                        ctx.fillRect(startX, trackConfig.groundY - 40 + i * 4, 20, 4);
                    }
                }
                ctx.fillStyle = 'rgba(0, 217, 165, 0.3)';
                ctx.fillRect(startX, trackConfig.groundY - 40, 5, 40);
            }

            // 终点线
            const finishX = trackLength - camX;
            if (finishX > -50 && finishX < canvas.width) {
                ctx.fillStyle = '#ff6b6b';
                for (let i = 0; i < 10; i++) {
                    if (i % 2 === 0) {
                        ctx.fillRect(finishX, trackConfig.groundY - 40 + i * 4, 20, 4);
                    }
                }
                ctx.fillStyle = 'rgba(255, 107, 107, 0.3)';
                ctx.fillRect(finishX, trackConfig.groundY - 40, 5, 40);
            }

            // 圈数标记
            for (let lap = 1; lap < maxLaps; lap++) {
                const lapX = (trackLength / maxLaps) * lap - camX;
                if (lapX > -50 && lapX < canvas.width) {
                    ctx.fillStyle = 'rgba(248, 181, 0, 0.5)';
                    ctx.fillRect(lapX, trackConfig.groundY - 30, 4, 30);
                    ctx.fillStyle = '#f8b500';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.fillText(`第${lap + 1}圈`, lapX, trackConfig.groundY - 35);
                }
            }
        }

        function drawObstacles(camX) {
            for (let obs of obstacles) {
                let ox = obs.x - camX;
                let oy = obs.y;
                let ow = obs.w;
                let oh = obs.h;

                if (obs.type === 'swing') {
                    ox += Math.cos(obs.angle) * obs.length - camX + obs.x;
                    ox = obs.x + Math.cos(obs.angle) * obs.length - camX;
                    oy = obs.y + Math.sin(obs.angle) * obs.length;
                }

                if (obs.type === 'movingBlock') {
                    ox = obs.originX + Math.sin(Date.now() / 1000 * obs.speed) * obs.range - camX;
                }

                if (ox < -100 || ox > canvas.width + 100) continue;

                if (obs.type === 'hurdle') {
                    // 跨栏
                    ctx.fillStyle = '#ff9f43';
                    ctx.fillRect(ox, oy, 4, oh);
                    ctx.fillRect(ox + ow - 4, oy, 4, oh);
                    ctx.fillRect(ox, oy, ow, 4);
                    // 条纹
                    ctx.fillStyle = '#ff6b6b';
                    ctx.fillRect(ox + 2, oy + 5, ow - 4, 3);
                    ctx.fillRect(ox + 2, oy + 15, ow - 4, 3);
                    ctx.fillRect(ox + 2, oy + 25, ow - 4, 3);
                } else if (obs.type === 'swing') {
                    // 摆锤
                    ctx.strokeStyle = '#888';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(obs.x - camX, obs.y);
                    ctx.lineTo(ox, oy);
                    ctx.stroke();

                    ctx.fillStyle = '#ff6b6b';
                    ctx.beginPath();
                    ctx.arc(ox, oy, 20, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff4444';
                    ctx.beginPath();
                    ctx.arc(ox, oy, 12, 0, Math.PI * 2);
                    ctx.fill();
                } else if (obs.type === 'movingBlock') {
                    // 移动方块
                    ctx.fillStyle = '#667eea';
                    ctx.fillRect(ox, oy, ow, oh);
                    ctx.fillStyle = '#764ba2';
                    ctx.fillRect(ox + 5, oy + 5, ow - 10, oh - 10);
                } else if (obs.type === 'spike') {
                    // 尖刺
                    ctx.fillStyle = '#ff6b6b';
                    ctx.beginPath();
                    ctx.moveTo(ox, oy + oh);
                    ctx.lineTo(ox + ow / 2, oy);
                    ctx.lineTo(ox + ow, oy + oh);
                    ctx.closePath();
                    ctx.fill();
                }
            }
        }

        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1a1a3e');
            gradient.addColorStop(1, '#0f0f2e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 远景装饰
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            for (let i = 0; i < 8; i++) {
                const x = (i * 200 + camera.x * 0.05) % (canvas.width + 200) - 100;
                ctx.beginPath();
                ctx.arc(x, 100 + i * 30, 40 + i * 10, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawProgressBar() {
            // 顶部进度条背景
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(20, 20, canvas.width - 40, 30);

            // 每个玩家的进度
            const colors = ['#ff6b9d', '#667eea', '#f093fb', '#43e97b'];
            for (let i = 0; i < players.length; i++) {
                const p = players[i];
                const progress = ((p.lap - 1) * trackLength + p.x) / (trackLength * maxLaps);
                const barWidth = (canvas.width - 60) * progress;

                ctx.fillStyle = colors[i];
                ctx.fillRect(30, 24 + i * 6, barWidth, 4);
            }

            // 标记线
            for (let i = 1; i <= maxLaps; i++) {
                const x = 30 + (canvas.width - 60) * (i / maxLaps);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, 20);
                ctx.lineTo(x, 50);
                ctx.stroke();
            }
        }

        // ==================== 游戏循环 ====================
        function update() {
            if (gameState !== 'playing') return;

            // 更新障碍物
            for (let obs of obstacles) {
                if (obs.type === 'swing') {
                    obs.angle += obs.speed;
                }
            }

            // 更新玩家
            let finishedCount = 0;
            for (let p of players) {
                p.update();
                if (p.finished) finishedCount++;
            }

            // 更新相机
            const mainPlayer = players[0];
            camera.x = mainPlayer.x - canvas.width / 3;
            camera.x = Math.max(0, Math.min(camera.x, trackLength - canvas.width + 100));

            // 检查游戏结束
            if (finishedCount >= players.length) {
                gameOver();
            }

            // 更新UI
            updateUI();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackground();
            drawTrack(camera.x);
            drawObstacles(camera.x);

            // 绘制玩家
            const sortedPlayers = [...players].sort((a, b) => a.y - b.y);
            for (let p of sortedPlayers) {
                p.draw(ctx, camera.x);
            }

            drawProgressBar();
        }

        function gameLoopFn() {
            update();
            draw();
            gameLoop = requestAnimationFrame(gameLoopFn);
        }

        // ==================== 游戏控制 ====================
        function startGame() {
            document.getElementById('startOverlay').classList.add('hidden');
            showCountdown(() => {
                gameState = 'playing';
                gameTime = 0;
                currentLap = 1;
                setupGame();
                gameLoopFn();
                startTimer();
            });
        }

        function showCountdown(callback) {
            const overlay = document.getElementById('countdownOverlay');
            const number = document.getElementById('countdownNumber');
            overlay.classList.remove('hidden');

            let count = 3;
            number.textContent = count;

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    number.textContent = count;
                } else if (count === 0) {
                    number.textContent = 'GO!';
                } else {
                    clearInterval(interval);
                    overlay.classList.add('hidden');
                    callback();
                }
            }, 1000);
        }

        function setupGame() {
            obstacles = generateObstacles();

            for (let p of players) {
                p.x = 50 + p.id * 30;
                p.y = trackConfig.groundY - 40;
                p.vx = 0;
                p.vy = 0;
                p.lap = 1;
                p.finished = false;
                p.finishTime = 0;
                p.stunned = 0;
            }

            updateUI();
            updatePlayersList();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (gameState === 'playing') {
                    gameTime++;
                    const minutes = Math.floor(gameTime / 60);
                    const seconds = gameTime % 60;
                    document.getElementById('timeDisplay').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        function updateUI() {
            const mainPlayer = players[0];
            document.getElementById('lapDisplay').textContent = `${Math.min(mainPlayer.lap, maxLaps)}/${maxLaps}`;

            // 计算排名
            const sorted = [...players].sort((a, b) => {
                const aProgress = (a.lap - 1) * trackLength + a.x;
                const bProgress = (b.lap - 1) * trackLength + b.x;
                return bProgress - aProgress;
            });

            const rank = sorted.findIndex(p => p.id === 1) + 1;
            document.getElementById('rankDisplay').textContent = `${rank}/${players.length}`;
        }

        function gameOver() {
            gameState = 'gameOver';
            cancelAnimationFrame(gameLoop);
            clearInterval(timerInterval);

            const sorted = [...players].sort((a, b) => {
                if (a.finished && b.finished) return a.finishTime - b.finishTime;
                if (a.finished) return -1;
                if (b.finished) return 1;
                const aProgress = (a.lap - 1) * trackLength + a.x;
                const bProgress = (b.lap - 1) * trackLength + b.x;
                return bProgress - aProgress;
            });

            const resultsDiv = document.getElementById('finalResults');
            resultsDiv.innerHTML = '';
            sorted.forEach((p, i) => {
                const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'normal';
                const time = p.finished ? `${Math.floor(p.finishTime / 60)}:${(p.finishTime % 60).toString().padStart(2, '0')}` : '未完成';
                resultsDiv.innerHTML += `
                    <div class="result-item">
                        <div class="result-rank ${rankClass}">${i + 1}</div>
                        <div class="player-avatar" style="background: ${p.color}20; color: ${p.color};">${p.name[0]}</div>
                        <div style="flex: 1;">
                            <div style="font-weight: 600;">${p.name}</div>
                            <div style="font-size: 12px; color: var(--muted);">${time}</div>
                        </div>
                    </div>
                `;
            });

            const isWinner = sorted[0].id === 1;
            document.getElementById('gameOverIcon').textContent = isWinner ? '🏆' : '🏃';
            document.getElementById('gameOverTitle').textContent = isWinner ? '恭喜夺冠！' : '比赛结束';
            document.getElementById('gameOverText').textContent = isWinner ? '你是最终的冠军！' : '下次再接再厉！';

            document.getElementById('gameOverOverlay').classList.remove('hidden');
        }

        function restartGame() {
            document.getElementById('gameOverOverlay').classList.add('hidden');
            startGame();
        }

        function pauseGame() {
            if (gameState === 'playing') {
                gameState = 'paused';
                cancelAnimationFrame(gameLoop);
                clearInterval(timerInterval);
            } else if (gameState === 'paused') {
                gameState = 'playing';
                gameLoopFn();
                startTimer();
            }
        }

        function backToLobby() {
            window.location.href = '../social-platform.html';
        }

        // ==================== UI 更新 ====================
        function updatePlayersList() {
            const list = document.getElementById('playersList');
            list.innerHTML = '';

            const sorted = [...players].sort((a, b) => {
                const aProgress = (a.lap - 1) * trackLength + a.x;
                const bProgress = (b.lap - 1) * trackLength + b.x;
                return bProgress - aProgress;
            });

            sorted.forEach((p, i) => {
                const isActive = p.id === 1;
                const progress = ((p.lap - 1) * trackLength + p.x) / (trackLength * maxLaps) * 100;
                const status = p.finished ? '已完成' : p.stunned > 0 ? '眩晕中' : `第${p.lap}圈`;

                list.innerHTML += `
                    <div class="player-item ${isActive ? 'active' : ''} ${p.finished ? 'finished' : ''}">
                        <div class="player-avatar" style="background: ${p.color}30; color: ${p.color};">
                            ${p.name[0]}
                        </div>
                        <div class="player-info">
                            <div class="player-name">${p.name} ${p.id === 1 ? '(你)' : ''}</div>
                            <div class="player-status">${status}</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                        </div>
                        <div class="player-position">#${i + 1}</div>
                    </div>
                `;
            });
        }

        // ==================== 输入处理 ====================
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        function setKey(key, pressed) {
            keys[key] = pressed;
        }

        // 定期更新玩家列表
        setInterval(() => {
            if (gameState === 'playing') {
                updatePlayersList();
            }
        }, 500);

        // 初始化
        updatePlayersList();

        // 初始绘制
        drawBackground();
        drawTrack(0);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('点击"开始游戏"开始', canvas.width / 2, canvas.height / 2);
    </script>
</body>
</html>
