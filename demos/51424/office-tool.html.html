<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能办公自动化综合工具箱 V1.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 30px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 12px #00000015;
            padding: 30px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .module-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .module-card {
            border: 1px solid #e4e7ed;
            border-radius: 8px;
            padding: 20px;
        }
        .module-card h3 {
            color: #34495e;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .module-card p {
            color: #666;
            line-height: 1.6;
            font-size: 14px;
        }
        .operate-area {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #ddd;
        }
        .btn {
            background: #4096ff;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        .btn:hover {
            background: #2979e0;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-top: 15px;
            padding: 12px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>智能办公自动化综合工具箱 V1.0</h1>

        <div class="module-wrap">
            <div class="module-card">
                <h3>功能一：文档智能摘要生成</h3>
                <p>上传长篇文字材料，自动过滤冗余语句，快速提炼核心内容，自动生成简短工作小结与会议纪要。</p>
            </div>
            <div class="module-card">
                <h3>功能二：批量文件自动归档</h3>
                <p>遍历本地文件夹，根据文件内容自动命名，按文档类型、创建日期自动分文件夹归类整理。</p>
            </div>
            <div class="module-card">
                <h3>功能三：表格结构化信息提取</h3>
                <p>读取纯文本表格内容，拆分条目，清理无效空格，把杂乱文本整理成规范结构化数据。</p>
            </div>
            <div class="module-card">
                <h3>功能四：批量文本格式统一</h3>
                <p>一键统一全文档字体、换行、标点格式，批量清理多余空行、乱码符号，规范文档排版。</p>
            </div>
        </div>

        <div class="operate-area">
            <button class="btn">拖拽上传文件</button>
            <button class="btn">一键开始处理</button>
            <textarea placeholder="处理结果将在此处输出……"></textarea>
        </div>
    </div>
</body>
</html>
