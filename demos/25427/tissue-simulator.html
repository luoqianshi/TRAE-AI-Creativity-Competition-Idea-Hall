<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽纸模拟器 — 治愈解压小工具</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --bg: #F5EDE3;
    --desk: #C4A882;
    --desk-dark: #A68B6B;
    --box-primary: #E8B4B8;
    --box-secondary: #D4909A;
    --box-accent: #F0C9CC;
    --tissue: #FEFCF8;
    --tissue-shadow: #E8E0D6;
    --text: #5A4A3A;
    --text-light: #8B7B6B;
    --accent: #E8B4B8;
    --accent-glow: rgba(232,180,184,0.4);
    --combo-fire: #FF6B35;
    --combo-gold: #FFD700;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Serif SC', serif;
    background: var(--bg);
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }

  /* === 桌面背景 === */
  .desk-bg {
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 60px,
        rgba(0,0,0,0.02) 60px,
        rgba(0,0,0,0.02) 61px
      ),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 200px,
        rgba(0,0,0,0.015) 200px,
        rgba(0,0,0,0.015) 201px
      ),
      linear-gradient(135deg, #D4BC9A 0%, #C4A882 30%, #B89B78 60%, #C4A882 100%);
    z-index: 0;
  }

  .desk-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(0,0,0,0.08) 100%);
  }

  /* === 主容器 === */
  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* === 标题 === */
  .title-area {
    text-align: center;
    margin-bottom: 10px;
  }

  .title {
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--text);
    letter-spacing: 0.08em;
    text-shadow: 0 2px 4px rgba(0,0,0,0.08);
    position: relative;
  }

  .title::after {
    content: '';
    display: block;
    width: 60px;
    height: 3px;
    background: var(--accent);
    margin: 8px auto 0;
    border-radius: 2px;
  }

  .subtitle {
    font-size: 0.9rem;
    color: var(--text-light);
    margin-top: 8px;
    font-weight: 400;
    letter-spacing: 0.15em;
  }

  /* === 计数区域 === */
  .stats-area {
    display: flex;
    gap: 32px;
    margin-bottom: 16px;
    align-items: flex-end;
  }

  .stat-item {
    text-align: center;
    position: relative;
  }

  .stat-label {
    font-size: 0.75rem;
    color: var(--text-light);
    letter-spacing: 0.1em;
    margin-bottom: 2px;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .stat-value.bump {
    transform: scale(1.3);
  }

  .combo-badge {
    position: absolute;
    top: -18px;
    right: -24px;
    font-size: 0.7rem;
    font-weight: 700;
    color: #fff;
    background: var(--combo-fire);
    padding: 2px 8px;
    border-radius: 10px;
    opacity: 0;
    transform: scale(0);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }

  .combo-badge.show {
    opacity: 1;
    transform: scale(1);
  }

  .combo-badge.fire {
    background: linear-gradient(135deg, var(--combo-fire), var(--combo-gold));
    animation: comboPulse 0.5s ease infinite;
  }

  @keyframes comboPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* === 纸巾盒 === */
  .box-wrapper {
    position: relative;
    perspective: 800px;
    margin: 10px 0;
  }

  .tissue-box {
    width: 220px;
    height: 160px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(8deg) rotateY(-5deg);
    transition: transform 0.4s ease;
  }

  .tissue-box:hover {
    transform: rotateX(5deg) rotateY(-3deg) translateY(-2px);
  }

  /* 盒子前面 */
  .box-front {
    position: absolute;
    width: 220px;
    height: 160px;
    background: linear-gradient(180deg, var(--box-accent) 0%, var(--box-primary) 40%, var(--box-secondary) 100%);
    border-radius: 12px;
    transform: translateZ(40px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .box-front::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 2px dashed rgba(255,255,255,0.35);
    border-radius: 8px;
  }

  .box-label {
    font-size: 1.1rem;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.2em;
    text-shadow: 0 1px 3px rgba(0,0,0,0.15);
  }

  /* 盒子顶面 */
  .box-top {
    position: absolute;
    width: 220px;
    height: 80px;
    background: linear-gradient(180deg, var(--box-accent), var(--box-primary));
    border-radius: 12px 12px 0 0;
    transform: rotateX(-90deg) translateZ(-80px) translateY(0px);
    transform-origin: top center;
    box-shadow: inset 0 -2px 6px rgba(0,0,0,0.1);
  }

  /* 盒子右面 */
  .box-right {
    position: absolute;
    width: 80px;
    height: 160px;
    background: linear-gradient(180deg, var(--box-secondary), #C08090);
    border-radius: 0 12px 12px 0;
    transform: rotateY(90deg) translateZ(180px) translateX(-20px);
    box-shadow: inset -2px 0 6px rgba(0,0,0,0.1);
  }

  /* 盒子阴影 */
  .box-shadow {
    position: absolute;
    bottom: -20px;
    left: 10px;
    width: 240px;
    height: 30px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.18) 0%, transparent 70%);
    transform: rotateX(80deg);
  }

  /* === 纸巾出口 === */
  .tissue-slot {
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%) translateZ(42px);
    width: 100px;
    height: 16px;
    background: linear-gradient(180deg, var(--tissue-shadow), var(--tissue));
    border-radius: 4px 4px 0 0;
    z-index: 10;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
  }

  /* === 露出的纸巾 === */
  .tissue-exposed {
    position: absolute;
    top: -55px;
    left: 50%;
    transform: translateX(-50%) translateZ(43px);
    width: 80px;
    height: 55px;
    background: linear-gradient(180deg, var(--tissue), var(--tissue-shadow));
    border-radius: 6px 6px 0 0;
    z-index: 9;
    cursor: grab;
    box-shadow: 0 -3px 12px rgba(0,0,0,0.06);
    transition: none;
  }

  .tissue-exposed::before {
    content: '';
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 3px;
    background: repeating-linear-gradient(90deg, var(--tissue-shadow) 0px, var(--tissue-shadow) 3px, transparent 3px, transparent 6px);
    border-radius: 1px;
    opacity: 0.5;
  }

  .tissue-exposed::after {
    content: '↑ 抽我 ↑';
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.6rem;
    color: var(--text-light);
    opacity: 0.5;
    white-space: nowrap;
    letter-spacing: 0.1em;
  }

  .tissue-exposed.pulling {
    cursor: grabbing;
  }

  .tissue-exposed.empty {
    background: linear-gradient(180deg, #E0D8CE, #D0C8BE);
  }

  .tissue-exposed.empty::after {
    content: '空了...';
    color: #B0A898;
  }

  /* === 飘落的纸巾 === */
  .falling-tissue {
    position: fixed;
    width: 70px;
    height: 90px;
    background: linear-gradient(135deg, var(--tissue) 0%, #F0EAE0 50%, var(--tissue-shadow) 100%);
    border-radius: 4px;
    z-index: 100;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transform-origin: top center;
  }

  .falling-tissue::before {
    content: '';
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 36px;
    height: 2px;
    background: repeating-linear-gradient(90deg, var(--tissue-shadow) 0px, var(--tissue-shadow) 3px, transparent 3px, transparent 6px);
    opacity: 0.4;
  }

  /* === 桌面堆叠纸巾 === */
  .tissue-pile {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 120px;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }

  .piled-tissue {
    position: absolute;
    width: 65px;
    height: 85px;
    background: linear-gradient(135deg, var(--tissue) 0%, #F0EAE0 60%, var(--tissue-shadow) 100%);
    border-radius: 3px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    opacity: 0.85;
  }

  .piled-tissue::before {
    content: '';
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 32px;
    height: 2px;
    background: repeating-linear-gradient(90deg, var(--tissue-shadow) 0px, var(--tissue-shadow) 3px, transparent 3px, transparent 6px);
    opacity: 0.3;
  }

  /* === 补货按钮 === */
  .refill-btn {
    margin-top: 16px;
    padding: 10px 28px;
    background: linear-gradient(135deg, var(--box-primary), var(--box-secondary));
    color: #fff;
    border: none;
    border-radius: 24px;
    font-family: 'Noto Serif SC', serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    cursor: pointer;
    box-shadow: 0 4px 16px var(--accent-glow);
    transition: all 0.3s ease;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
  }

  .refill-btn.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .refill-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px var(--accent-glow);
  }

  .refill-btn:active {
    transform: translateY(0) scale(0.96);
  }

  /* === 主题切换 === */
  .theme-area {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    gap: 10px;
    z-index: 50;
  }

  .theme-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.8);
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .theme-dot:hover {
    transform: scale(1.2);
  }

  .theme-dot.active {
    border-color: var(--text);
    transform: scale(1.15);
  }

  .theme-dot[data-theme="sakura"] { background: linear-gradient(135deg, #E8B4B8, #D4909A); }
  .theme-dot[data-theme="mint"] { background: linear-gradient(135deg, #A8D8C8, #7BC0AC); }
  .theme-dot[data-theme="lavender"] { background: linear-gradient(135deg, #C8B8E8, #A898D0); }
  .theme-dot[data-theme="honey"] { background: linear-gradient(135deg, #F0D080, #E0B860); }

  /* === 提示文字 === */
  .hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.75rem;
    color: var(--text-light);
    opacity: 0.5;
    letter-spacing: 0.1em;
    z-index: 50;
  }

  /* === 连抽特效 === */
  .combo-effect {
    position: fixed;
    pointer-events: none;
    z-index: 200;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--combo-fire);
    text-shadow: 0 0 10px rgba(255,107,53,0.5);
    animation: comboFloat 0.8s ease-out forwards;
  }

  @keyframes comboFloat {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.5); }
  }

  /* === 粒子特效 === */
  .particle {
    position: fixed;
    pointer-events: none;
    z-index: 150;
    border-radius: 50%;
    animation: particleFly 0.6s ease-out forwards;
  }

  @keyframes particleFly {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--px), var(--py)) scale(0); }
  }

  /* === 抽纸拉拽动画 === */
  @keyframes tissuePull {
    0% { transform: translateX(-50%) translateZ(43px) translateY(0); }
    30% { transform: translateX(-50%) translateZ(43px) translateY(-30px); }
    100% { transform: translateX(-50%) translateZ(43px) translateY(-120px); opacity: 0; }
  }

  /* === 主题样式 === */
  body.theme-mint {
    --box-primary: #7BC0AC;
    --box-secondary: #5AA890;
    --box-accent: #A8D8C8;
    --accent: #7BC0AC;
    --accent-glow: rgba(123,192,172,0.4);
  }

  body.theme-lavender {
    --box-primary: #A898D0;
    --box-secondary: #9080B8;
    --box-accent: #C8B8E8;
    --accent: #A898D0;
    --accent-glow: rgba(168,152,208,0.4);
  }

  body.theme-honey {
    --box-primary: #E0B860;
    --box-secondary: #C8A048;
    --box-accent: #F0D080;
    --accent: #E0B860;
    --accent-glow: rgba(224,184,96,0.4);
  }

  /* === 响应式 === */
  @media (max-width: 480px) {
    .title { font-size: 1.6rem; }
    .stat-value { font-size: 1.8rem; }
    .stats-area { gap: 20px; }
    .tissue-box { transform: rotateX(8deg) rotateY(-5deg) scale(0.85); }
    .theme-area { bottom: 16px; right: 16px; }
  }

  /* === 减少动画偏好 === */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body class="theme-sakura">

<!-- 桌面背景 -->
<div class="desk-bg"></div>

<!-- 主容器 -->
<div class="container">
  <!-- 标题 -->
  <div class="title-area">
    <h1 class="title">抽纸模拟器</h1>
    <p class="subtitle">每一次抽取，都是一次治愈</p>
  </div>

  <!-- 计数 -->
  <div class="stats-area">
    <div class="stat-item">
      <div class="stat-label">已抽取</div>
      <div class="stat-value" id="countValue">0</div>
      <div class="combo-badge" id="comboBadge">连抽!</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">最高连抽</div>
      <div class="stat-value" id="maxComboValue">0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">剩余纸巾</div>
      <div class="stat-value" id="remainValue">50</div>
    </div>
  </div>

  <!-- 纸巾盒 -->
  <div class="box-wrapper">
    <div class="tissue-box" id="tissueBox">
      <div class="box-front">
        <span class="box-label">柔 抽</span>
      </div>
      <div class="box-top"></div>
      <div class="box-right"></div>
      <div class="tissue-slot"></div>
      <div class="tissue-exposed" id="tissueExposed"></div>
    </div>
    <div class="box-shadow"></div>
  </div>

  <!-- 补货按钮 -->
  <button class="refill-btn" id="refillBtn" aria-label="补货纸巾">重新补货</button>
</div>

<!-- 桌面纸巾堆 -->
<div class="tissue-pile" id="tissuePile"></div>

<!-- 主题切换 -->
<div class="theme-area" role="radiogroup" aria-label="主题切换">
  <div class="theme-dot active" data-theme="sakura" role="radio" aria-checked="true" tabindex="0" aria-label="樱花主题"></div>
  <div class="theme-dot" data-theme="mint" role="radio" aria-checked="false" tabindex="0" aria-label="薄荷主题"></div>
  <div class="theme-dot" data-theme="lavender" role="radio" aria-checked="false" tabindex="0" aria-label="薰衣草主题"></div>
  <div class="theme-dot" data-theme="honey" role="radio" aria-checked="false" tabindex="0" aria-label="蜂蜜主题"></div>
</div>

<!-- 提示 -->
<div class="hint">点击或拖拽纸巾 · 解压无限</div>

<script>
(function() {
  'use strict';

  // === 状态 ===
  const TOTAL_TISSUES = 50;
  let state = {
    count: parseInt(localStorage.getItem('tissue_count') || '0'),
    maxCombo: parseInt(localStorage.getItem('tissue_maxCombo') || '0'),
    remaining: parseInt(localStorage.getItem('tissue_remaining') || String(TOTAL_TISSUES)),
    theme: localStorage.getItem('tissue_theme') || 'sakura',
    combo: 0,
    comboTimer: null,
    isPulling: false,
    pullStartY: 0,
    pullDistance: 0
  };

  // === DOM ===
  const countEl = document.getElementById('countValue');
  const maxComboEl = document.getElementById('maxComboValue');
  const remainEl = document.getElementById('remainValue');
  const comboBadge = document.getElementById('comboBadge');
  const tissueExposed = document.getElementById('tissueExposed');
  const tissueBox = document.getElementById('tissueBox');
  const refillBtn = document.getElementById('refillBtn');
  const tissuePile = document.getElementById('tissuePile');
  const themeDots = document.querySelectorAll('.theme-dot');

  // === 音频 ===
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playPullSound() {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.15);
    } catch(e) {}
  }

  function playComboSound(combo) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'triangle';
      const baseFreq = 600 + combo * 50;
      osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.12);
    } catch(e) {}
  }

  // === 更新UI ===
  function updateUI() {
    countEl.textContent = state.count;
    maxComboEl.textContent = state.maxCombo;
    remainEl.textContent = state.remaining;

    if (state.remaining <= 0) {
      tissueExposed.classList.add('empty');
      refillBtn.classList.add('show');
    } else {
      tissueExposed.classList.remove('empty');
      refillBtn.classList.remove('show');
    }
  }

  function saveState() {
    localStorage.setItem('tissue_count', state.count);
    localStorage.setItem('tissue_maxCombo', state.maxCombo);
    localStorage.setItem('tissue_remaining', state.remaining);
    localStorage.setItem('tissue_theme', state.theme);
  }

  // === 抽纸逻辑 ===
  function pullTissue() {
    if (state.remaining <= 0 || state.isPulling) return;

    initAudio();
    state.isPulling = true;

    // 更新计数
    state.count++;
    state.remaining--;

    // 连抽判定
    clearTimeout(state.comboTimer);
    state.combo++;
    state.comboTimer = setTimeout(() => { state.combo = 0; comboBadge.classList.remove('show', 'fire'); }, 1200);

    if (state.combo > state.maxCombo) {
      state.maxCombo = state.combo;
    }

    // 音效
    playPullSound();
    if (state.combo >= 3) {
      playComboSound(state.combo);
    }

    // 连抽徽章
    if (state.combo >= 2) {
      comboBadge.textContent = state.combo + '连抽!';
      comboBadge.classList.add('show');
      if (state.combo >= 5) {
        comboBadge.classList.add('fire');
      }
    }

    // 计数弹跳动画
    countEl.classList.add('bump');
    setTimeout(() => countEl.classList.remove('bump'), 150);

    // 纸巾抽出动画
    tissueExposed.style.animation = 'tissuePull 0.4s ease-out forwards';

    // 生成飘落纸巾
    setTimeout(() => {
      createFallingTissue();
      spawnParticles();
      if (state.combo >= 3) {
        showComboEffect(state.combo);
      }
    }, 200);

    // 重置露出的纸巾
    setTimeout(() => {
      tissueExposed.style.animation = '';
      state.isPulling = false;
      updateUI();
      saveState();
    }, 450);
  }

  // === 飘落纸巾 ===
  function createFallingTissue() {
    const boxRect = tissueBox.getBoundingClientRect();
    const tissue = document.createElement('div');
    tissue.className = 'falling-tissue';

    const startX = boxRect.left + boxRect.width / 2 - 35;
    const startY = boxRect.top - 20;

    tissue.style.left = startX + 'px';
    tissue.style.top = startY + 'px';

    // 随机旋转和偏移
    const rotateEnd = (Math.random() - 0.5) * 120;
    const driftX = (Math.random() - 0.5) * 200;
    const duration = 800 + Math.random() * 400;

    document.body.appendChild(tissue);

    // 动画
    const startTime = performance.now();
    function animate(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);

      // 物理模拟：重力 + 阻力
      const easeProgress = 1 - Math.pow(1 - progress, 2);
      const y = startY + easeProgress * (window.innerHeight - startY - 100);
      const x = startX + Math.sin(progress * Math.PI * 2) * 30 + driftX * progress;
      const rotate = rotateEnd * progress;

      tissue.style.left = x + 'px';
      tissue.style.top = y + 'px';
      tissue.style.transform = `rotate(${rotate}deg)`;
      tissue.style.opacity = 1 - progress * 0.3;

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        // 添加到桌面堆
        addPiledTissue(x, window.innerHeight - 80 - Math.random() * 40, rotate);
        tissue.remove();
      }
    }
    requestAnimationFrame(animate);
  }

  // === 桌面堆叠 ===
  let pileCount = 0;
  const MAX_PILE = 15;

  function addPiledTissue(x, y, rotate) {
    if (pileCount >= MAX_PILE) {
      const oldest = tissuePile.firstElementChild;
      if (oldest) oldest.remove();
      pileCount--;
    }

    const t = document.createElement('div');
    t.className = 'piled-tissue';
    t.style.left = (x - 32) + 'px';
    t.style.bottom = (Math.random() * 30) + 'px';
    t.style.transform = `rotate(${rotate * 0.3 + (Math.random()-0.5)*20}deg)`;
    tissuePile.appendChild(t);
    pileCount++;
  }

  // === 粒子特效 ===
  function spawnParticles() {
    const boxRect = tissueBox.getBoundingClientRect();
    const cx = boxRect.left + boxRect.width / 2;
    const cy = boxRect.top;

    for (let i = 0; i < 6; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 4 + Math.random() * 6;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.background = `hsl(${340 + Math.random() * 40}, 70%, ${75 + Math.random() * 15}%)`;
      p.style.setProperty('--px', (Math.random() - 0.5) * 100 + 'px');
      p.style.setProperty('--py', -(30 + Math.random() * 60) + 'px');
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 600);
    }
  }

  // === 连抽特效 ===
  function showComboEffect(combo) {
    const boxRect = tissueBox.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'combo-effect';
    el.textContent = combo + 'x COMBO!';
    el.style.left = (boxRect.left + boxRect.width / 2 - 50) + 'px';
    el.style.top = (boxRect.top - 40) + 'px';
    if (combo >= 8) {
      el.style.fontSize = '2rem';
      el.style.color = 'var(--combo-gold)';
      el.style.textShadow = '0 0 20px rgba(255,215,0,0.6)';
    }
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }

  // === 拖拽交互 ===
  function onPointerDown(e) {
    if (state.remaining <= 0 || state.isPulling) return;
    e.preventDefault();
    initAudio();
    state.isPulling = true;
    state.pullStartY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
    state.pullDistance = 0;
    tissueExposed.classList.add('pulling');
  }

  function onPointerMove(e) {
    if (!state.isPulling || state.remaining <= 0) return;
    e.preventDefault();
    const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
    state.pullDistance = Math.max(0, state.pullStartY - clientY);

    // 纸巾跟随拖拽
    const maxPull = 100;
    const pull = Math.min(state.pullDistance, maxPull);
    tissueExposed.style.transform = `translateX(-50%) translateZ(43px) translateY(-${pull}px)`;

    // 盒子微倾
    const tilt = pull / maxPull * 3;
    tissueBox.style.transform = `rotateX(${8 - tilt}deg) rotateY(${-5 + tilt}deg)`;
  }

  function onPointerUp(e) {
    if (!state.isPulling) return;
    tissueExposed.classList.remove('pulling');

    // 如果拉够距离则抽纸
    if (state.pullDistance > 40) {
      tissueExposed.style.transform = '';
      tissueBox.style.transform = '';
      state.isPulling = false;
      pullTissue();
    } else {
      // 回弹
      tissueExposed.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
      tissueExposed.style.transform = 'translateX(-50%) translateZ(43px) translateY(0)';
      tissueBox.style.transition = 'transform 0.3s ease';
      tissueBox.style.transform = 'rotateX(8deg) rotateY(-5deg)';

      setTimeout(() => {
        tissueExposed.style.transition = '';
        tissueBox.style.transition = '';
        state.isPulling = false;
      }, 300);
    }
  }

  // 绑定事件
  tissueExposed.addEventListener('pointerdown', onPointerDown);
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);

  // 点击快速抽纸
  tissueExposed.addEventListener('click', function(e) {
    if (state.pullDistance < 5 && !state.isPulling) {
      state.isPulling = false;
      pullTissue();
    }
  });

  // 触摸兼容
  tissueExposed.addEventListener('touchstart', function(e) {
    e.preventDefault();
    onPointerDown(e.touches[0]);
  }, { passive: false });

  document.addEventListener('touchmove', function(e) {
    if (state.isPulling) {
      e.preventDefault();
      onPointerMove(e.touches[0]);
    }
  }, { passive: false });

  document.addEventListener('touchend', onPointerUp);

  // === 补货 ===
  refillBtn.addEventListener('click', function() {
    state.remaining = TOTAL_TISSUES;
    tissuePile.innerHTML = '';
    pileCount = 0;
    updateUI();
    saveState();

    // 补货动画
    tissueBox.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
    tissueBox.style.transform = 'rotateX(8deg) rotateY(-5deg) scale(1.1)';
    setTimeout(() => {
      tissueBox.style.transform = 'rotateX(8deg) rotateY(-5deg) scale(1)';
      setTimeout(() => { tissueBox.style.transition = ''; }, 500);
    }, 300);
  });

  // === 主题切换 ===
  themeDots.forEach(dot => {
    dot.addEventListener('click', function() {
      const theme = this.dataset.theme;
      state.theme = theme;

      // 更新body类
      document.body.className = 'theme-' + theme;

      // 更新active状态
      themeDots.forEach(d => {
        d.classList.remove('active');
        d.setAttribute('aria-checked', 'false');
      });
      this.classList.add('active');
      this.setAttribute('aria-checked', 'true');

      saveState();
    });

    // 键盘支持
    dot.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        this.click();
      }
    });
  });

  // === 初始化 ===
  document.body.className = 'theme-' + state.theme;
  themeDots.forEach(d => {
    d.classList.remove('active');
    d.setAttribute('aria-checked', 'false');
    if (d.dataset.theme === state.theme) {
      d.classList.add('active');
      d.setAttribute('aria-checked', 'true');
    }
  });

  updateUI();

  // === 盒子微动呼吸 ===
  let breathPhase = 0;
  function breathe() {
    if (!state.isPulling) {
      breathPhase += 0.02;
      const y = Math.sin(breathPhase) * 1.5;
      tissueBox.style.transform = `rotateX(8deg) rotateY(-5deg) translateY(${y}px)`;
    }
    requestAnimationFrame(breathe);
  }
  breathe();

})();
</script>

</body>
</html>
