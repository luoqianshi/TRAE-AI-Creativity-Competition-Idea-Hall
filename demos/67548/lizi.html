<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>✨ 流光绘卷 · 粒子画板</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            background: #0b0b0e;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== 画布容器 ===== */
        #canvas-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #0f0f14;
            cursor: crosshair;
            transition: background 0.6s ease;
        }

        canvas#flowCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
            touch-action: none;
        }

        /* ===== 顶部标题 ===== */
        .brand {
            position: absolute;
            top: max(28px, env(safe-area-inset-top));
            left: max(32px, env(safe-area-inset-left));
            color: rgba(255, 255, 255, 0.58);
            font-size: 15px;
            font-weight: 300;
            letter-spacing: 2px;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(100, 180, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            transition: color 0.4s, opacity 0.4s;
        }
        .brand span.icon {
            font-size: 20px;
        }
        .brand .sub {
            font-size: 12px;
            opacity: 0.55;
            letter-spacing: 1px;
        }
        /* 浅色背景模式下文字加深，保证可读 */
        body.light-bg .brand {
            color: rgba(40, 40, 50, 0.72);
            text-shadow: 0 0 20px rgba(100, 180, 255, 0.15);
        }
        body.light-bg .hint {
            color: rgba(40, 40, 50, 0.42);
        }

        /* ===== 底部控制面板 ===== */
        .controls {
            position: absolute;
            bottom: max(32px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 24px;
            background: rgba(20, 22, 30, 0.7);
            backdrop-filter: blur(18px) saturate(1.2);
            -webkit-backdrop-filter: blur(18px) saturate(1.2);
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
            transition: opacity 0.4s, transform 0.4s;
            max-width: 96vw;
        }
        .controls:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }
        .controls.collapsed {
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
            pointer-events: none;
        }

        .controls .group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls .group-label {
            color: rgba(255, 255, 255, 0.42);
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-right: 4px;
        }

        /* 主题按钮 */
        .theme-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            flex-shrink: 0;
            background: #333;
            padding: 0;
        }
        .theme-btn:hover {
            transform: scale(1.15);
        }
        .theme-btn.active {
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
            transform: scale(1.1);
        }
        .theme-btn:focus-visible {
            outline: 2px solid rgba(100, 180, 255, 0.8);
            outline-offset: 2px;
        }
        .theme-btn .dot {
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #f0f, #0ff, #f0f);
        }
        .theme-btn[data-theme="rainbow"] .dot {
            background: conic-gradient(from 0deg, #ff6b6b, #feca57, #48dbfb, #a29bfe, #fd79a8, #ff6b6b);
        }
        .theme-btn[data-theme="ocean"] .dot {
            background: conic-gradient(from 0deg, #006994, #00b4d8, #48cae4, #90e0ef, #006994);
        }
        .theme-btn[data-theme="fire"] .dot {
            background: conic-gradient(from 0deg, #f77f00, #fcbf49, #ea580c, #dc2f02, #f77f00);
        }
        .theme-btn[data-theme="aurora"] .dot {
            background: conic-gradient(from 0deg, #2d6a4f, #52b788, #95d5b2, #c7f9cc, #2d6a4f);
        }
        .theme-btn[data-theme="candy"] .dot {
            background: conic-gradient(from 0deg, #ff85a1, #f8a4c8, #d4a0ff, #a18cff, #ff85a1);
        }

        /* 滑块 */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 70px;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
            transition: background 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: #fff;
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            border: none;
        }
        input[type="range"]:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        input[type="range"]:focus-visible {
            background: rgba(100, 180, 255, 0.4);
        }

        .slider-value {
            color: rgba(255, 255, 255, 0.58);
            font-size: 12px;
            min-width: 28px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* 按钮 */
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.68);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 400;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
        }
        .ctrl-btn:active {
            transform: scale(0.94);
        }
        .ctrl-btn:focus-visible {
            outline: 2px solid rgba(100, 180, 255, 0.8);
            outline-offset: 2px;
        }
        .ctrl-btn.icon {
            font-size: 16px;
            padding: 6px 12px;
            line-height: 1;
        }
        /* 激活态（自动模式开启时） */
        .ctrl-btn.active-toggle {
            background: rgba(100, 180, 255, 0.18);
            color: #aedfff;
            border-color: rgba(100, 180, 255, 0.4);
        }

        /* 分隔线 */
        .divider {
            width: 1px;
            height: 28px;
            background: rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }

        /* ===== 提示文字 ===== */
        .hint {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.32);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 1.5s;
            white-space: nowrap;
            text-align: center;
        }
        .hint .keys {
            display: block;
            margin-top: 6px;
            font-size: 11px;
            opacity: 0.75;
        }
        .hint.hidden {
            opacity: 0;
        }

        /* ===== 折叠按钮（面板收起时显示） ===== */
        .expand-btn {
            position: absolute;
            bottom: max(32px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(20, 22, 30, 0.7);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.75);
            font-size: 16px;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s, transform 0.4s, background 0.2s;
        }
        .expand-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .expand-btn:hover {
            background: rgba(40, 44, 60, 0.85);
        }
        .expand-btn:focus-visible {
            outline: 2px solid rgba(100, 180, 255, 0.8);
            outline-offset: 2px;
        }

        /* ===== Toast 提示 ===== */
        .toast-container {
            position: absolute;
            top: max(24px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }
        .toast {
            background: rgba(20, 22, 30, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.92);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn 0.3s ease forwards;
            pointer-events: auto;
        }
        .toast.out {
            animation: toastOut 0.3s ease forwards;
        }
        .toast .toast-action {
            background: rgba(100, 180, 255, 0.2);
            border: 1px solid rgba(100, 180, 255, 0.4);
            color: #aedfff;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }
        .toast .toast-action:hover {
            background: rgba(100, 180, 255, 0.38);
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-12px); }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 860px) {
            .brand {
                top: max(18px, env(safe-area-inset-top));
                left: max(20px, env(safe-area-inset-left));
                font-size: 13px;
            }
            .brand .sub {
                display: none;
            }
            .controls {
                bottom: max(20px, env(safe-area-inset-bottom));
                padding: 12px 16px;
                gap: 10px;
                border-radius: 40px;
                max-width: 94vw;
                flex-wrap: wrap;
                justify-content: center;
            }
            .controls .group-label {
                font-size: 10px;
            }
            input[type="range"] {
                width: 50px;
            }
            .theme-btn {
                width: 28px;
                height: 28px;
            }
            .ctrl-btn {
                font-size: 11px;
                padding: 4px 10px;
            }
            .ctrl-btn.icon {
                font-size: 14px;
                padding: 4px 10px;
            }
            .divider {
                height: 20px;
            }
            .hint {
                bottom: 100px;
                font-size: 11px;
            }
            .hint .keys {
                font-size: 10px;
            }
        }

        @media (max-width: 500px) {
            .controls .group {
                gap: 4px;
            }
            .controls .group-label {
                display: none;
            }
            input[type="range"] {
                width: 40px;
            }
            .slider-value {
                min-width: 20px;
                font-size: 10px;
            }
            .ctrl-btn {
                font-size: 10px;
                padding: 4px 8px;
            }
            .theme-btn {
                width: 24px;
                height: 24px;
            }
            .brand {
                font-size: 11px;
            }
            .brand span.icon {
                font-size: 16px;
            }
        }

        /* ===== 可访问性：减少动效 ===== */
        @media (prefers-reduced-motion: reduce) {
            .controls, .brand, .hint, .expand-btn, .toast {
                transition-duration: 0.1s !important;
            }
            .toast {
                animation-duration: 0.1s !important;
            }
        }

        /* ===== 打印/保存时隐藏控制 ===== */
        @media print {
            .controls,
            .brand,
            .hint,
            .expand-btn,
            .toast-container {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-wrapper">
        <!-- 画布 -->
        <canvas id="flowCanvas" aria-label="流光绘画画布，按住拖动可绘制粒子流光"></canvas>

        <!-- 标题 -->
        <div class="brand">
            <span class="icon">✦</span> 流光绘卷
            <span class="sub">· 粒子画板</span>
        </div>

        <!-- 提示 -->
        <div class="hint" id="hint">
            🖱 按住拖动 · 绘制流光
            <span class="keys">快捷键：[C]清空 · [B]背景 · [S]保存 · [A]自动 · [P]保留 · [Space]换主题</span>
        </div>

        <!-- Toast 容器 -->
        <div class="toast-container" id="toastContainer" aria-live="polite"></div>

        <!-- 折叠按钮 -->
        <button class="expand-btn" id="expandBtn" aria-label="展开控制面板">▴</button>

        <!-- ===== 控制面板 ===== -->
        <div class="controls" id="controls" role="toolbar" aria-label="绘画控制">
            <!-- 主题 -->
            <div class="group" role="group" aria-label="主题选择">
                <span class="group-label">🎨 主题</span>
                <button class="theme-btn active" data-theme="rainbow" aria-label="彩虹主题" aria-pressed="true" title="彩虹 (1)">
                    <span class="dot"></span>
                </button>
                <button class="theme-btn" data-theme="ocean" aria-label="海洋主题" aria-pressed="false" title="海洋 (2)">
                    <span class="dot"></span>
                </button>
                <button class="theme-btn" data-theme="fire" aria-label="火焰主题" aria-pressed="false" title="火焰 (3)">
                    <span class="dot"></span>
                </button>
                <button class="theme-btn" data-theme="aurora" aria-label="极光主题" aria-pressed="false" title="极光 (4)">
                    <span class="dot"></span>
                </button>
                <button class="theme-btn" data-theme="candy" aria-label="糖果主题" aria-pressed="false" title="糖果 (5)">
                    <span class="dot"></span>
                </button>
            </div>

            <div class="divider"></div>

            <!-- 大小 -->
            <div class="group">
                <label class="group-label" for="sizeSlider">💠 大小</label>
                <input type="range" id="sizeSlider" min="1" max="6" step="0.1" value="2.8" aria-label="粒子大小" />
                <span class="slider-value" id="sizeVal">2.8</span>
            </div>

            <div class="divider"></div>

            <!-- 速度 -->
            <div class="group">
                <label class="group-label" for="speedSlider">🌊 速度</label>
                <input type="range" id="speedSlider" min="0.1" max="2.0" step="0.05" value="0.7" aria-label="粒子速度" />
                <span class="slider-value" id="speedVal">0.7</span>
            </div>

            <div class="divider"></div>

            <!-- 操作 -->
            <div class="group">
                <button class="ctrl-btn icon" id="autoBtn" title="自动模式 (A)" aria-label="自动模式" aria-pressed="false">▶</button>
                <button class="ctrl-btn icon" id="preserveBtn" title="保留路径 (P)" aria-label="保留路径模式" aria-pressed="false">📌</button>
                <button class="ctrl-btn icon" id="bgToggle" title="切换背景 (B)" aria-label="切换背景明暗">◐</button>
                <button class="ctrl-btn icon" id="collapseBtn" title="收起面板" aria-label="收起控制面板">▾</button>
                <button class="ctrl-btn icon" id="clearBtn" title="清空画布 (C)" aria-label="清空画布">✕</button>
                <button class="ctrl-btn" id="saveBtn" title="保存为图片 (S)" aria-label="保存图片">⬇ 保存</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  ✦  流 光 绘 卷  ·  粒 子 引 擎  (v2 升级版)
        // ============================================================
        // 升级要点：
        //   • 修复拖尾失效 Bug（半透明背景重绘替代不透明 fillRect）
        //   • 正确处理 devicePixelRatio（setTransform + CSS 像素逻辑坐标）
        //   • 精灵图缓存 + 对象池 + 末尾交换删除，性能大幅提升
        //   • 主题切换平滑色彩过渡（targetH/S/L + 色相环绕插值）
        //   • 自动模式（流场驱动粒子自由流动）
        //   • 多指触控 / 清空撤销 / 保存 toast / 控制面板折叠
        //   • 可访问性（aria、focus、reduced-motion）& 触觉反馈
        // ============================================================

        // ---------- DOM ----------
        const canvas = document.getElementById('flowCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');
        const hint = document.getElementById('hint');
        const sizeSlider = document.getElementById('sizeSlider');
        const speedSlider = document.getElementById('speedSlider');
        const sizeVal = document.getElementById('sizeVal');
        const speedVal = document.getElementById('speedVal');
        const clearBtn = document.getElementById('clearBtn');
        const bgToggle = document.getElementById('bgToggle');
        const saveBtn = document.getElementById('saveBtn');
        const autoBtn = document.getElementById('autoBtn');
        const preserveBtn = document.getElementById('preserveBtn');
        const collapseBtn = document.getElementById('collapseBtn');
        const expandBtn = document.getElementById('expandBtn');
        const controls = document.getElementById('controls');
        const themeBtns = document.querySelectorAll('.theme-btn');
        const toastContainer = document.getElementById('toastContainer');

        // ---------- 设备分级 ----------
        const cores = navigator.hardwareConcurrency || 4;
        const isMobile = matchMedia('(max-width: 860px)').matches;
        // 根据设备能力动态设定粒子上限，低端机不卡顿
        const MAX_PARTICLES = isMobile
            ? (cores >= 6 ? 1800 : 1200)
            : (cores >= 8 ? 3000 : 2000);
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

        // ---------- 尺寸 & DPR ----------
        let W = 0, H = 0, DPR = 1;

        function resize() {
            const rect = wrapper.getBoundingClientRect();
            // 限制 DPR 上限为 2，平衡画质与性能（4K 屏不过度渲染）
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.floor(rect.width * DPR);
            canvas.height = Math.floor(rect.height * DPR);
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            W = rect.width;   // 逻辑坐标统一用 CSS 像素
            H = rect.height;
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);  // 后续绘制均按 CSS 像素
        }
        resize();
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', resize);

        // ---------- 状态 ----------
        let currentTheme = 'rainbow';
        let bgDark = true;
        let particleSize = 2.8;
        let particleSpeed = 0.7;
        let autoMode = false;
        let preserveMode = false;  // 保留路径模式：轨迹不消散
        let rafId = null;
        let lastFrameTime = 0;

        // 多指针状态：id -> {x, y, prevX, prevY, active}（支持鼠标 + 多指触控）
        const pointers = new Map();
        const MOUSE_ID = -1;

        // 粒子数组 + 对象池（避免频繁 GC）
        let particles = [];
        const pool = [];

        // ---------- 主题色板 (HSL) ----------
        // 饱和度从 85 降档至 ~72，长时间观看更舒适，契合"解压"定位
        const THEMES = {
            rainbow: {
                colors: [
                    [0, 75, 62], [30, 75, 62], [60, 75, 62],
                    [180, 75, 62], [240, 75, 62], [300, 75, 62]
                ],
                bg: '#0f0f14'
            },
            ocean: {
                colors: [
                    [195, 70, 48], [210, 65, 58], [190, 55, 65],
                    [200, 70, 42], [185, 65, 52]
                ],
                bg: '#08141e'
            },
            fire: {
                colors: [
                    [20, 88, 55], [35, 90, 60], [45, 85, 65],
                    [10, 80, 45], [0, 75, 50]
                ],
                bg: '#1a0e08'
            },
            aurora: {
                colors: [
                    [140, 65, 48], [160, 60, 58], [180, 58, 62],
                    [120, 58, 42], [200, 65, 52]
                ],
                bg: '#081412'
            },
            candy: {
                colors: [
                    [330, 75, 65], [350, 72, 70], [290, 68, 65],
                    [310, 72, 60], [340, 75, 70]
                ],
                bg: '#140e1a'
            }
        };
        const LIGHT_BG = '#f5f0eb';

        // ---------- 工具函数 ----------
        const lerp = (a, b, t) => a + (b - a) * t;
        const rand = (min, max) => Math.random() * (max - min) + min;
        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

        // 色相插值（走最短弧，处理 360° 环绕，避免 350→10 走 340°）
        function lerpHue(a, b, t) {
            let d = ((b - a + 540) % 360) - 180;
            return (a + d * t + 360) % 360;
        }

        // hex → rgba 字符串（用于半透明背景重绘）
        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substr(0, 2), 16);
            const g = parseInt(h.substr(2, 2), 16);
            const b = parseInt(h.substr(4, 2), 16);
            return `rgba(${r},${g},${b},${alpha})`;
        }

        // 从主题色板取色 (t ∈ [0,1])
        function getThemeColor(theme, t) {
            const palette = THEMES[theme].colors;
            const idx = t * (palette.length - 1);
            const i0 = Math.floor(idx) % palette.length;
            const i1 = (i0 + 1) % palette.length;
            const frac = idx - Math.floor(idx);
            const c0 = palette[i0];
            const c1 = palette[i1];
            return [
                lerpHue(c0[0], c1[0], frac),
                lerp(c0[1], c1[1], frac),
                lerp(c0[2], c1[2], frac)
            ];
        }

        // ---------- 精灵图缓存 ----------
        // 为每个主题预渲染一组径向渐变光晕，避免每帧 createRadialGradient（昂贵）
        const SPRITE_COUNT = 18;
        const SPRITE_SIZE = 64;
        const spriteCache = {};

        function buildSprites(theme) {
            const sprites = [];
            for (let i = 0; i < SPRITE_COUNT; i++) {
                const t = i / (SPRITE_COUNT - 1);
                const [h, s, l] = getThemeColor(theme, t);
                const c = document.createElement('canvas');
                c.width = c.height = SPRITE_SIZE;
                const cx = c.getContext('2d');
                const r = SPRITE_SIZE / 2;
                const grad = cx.createRadialGradient(r, r, 0, r, r, r);
                // 中心亮度与 alpha 收敛，避免重叠时过曝发白
                grad.addColorStop(0, `hsla(${h}, ${s}%, ${clamp(l + 12, 0, 90)}%, 0.9)`);
                grad.addColorStop(0.3, `hsla(${h}, ${s}%, ${l}%, 0.55)`);
                grad.addColorStop(0.7, `hsla(${h}, ${s}%, ${l}%, 0.12)`);
                grad.addColorStop(1, `hsla(${h}, ${s}%, ${l}%, 0)`);
                cx.fillStyle = grad;
                cx.fillRect(0, 0, SPRITE_SIZE, SPRITE_SIZE);
                sprites.push(c);
            }
            return sprites;
        }

        // 启动时为所有主题预构建精灵
        Object.keys(THEMES).forEach(name => { spriteCache[name] = buildSprites(name); });

        function getSprite(theme, h) {
            const arr = spriteCache[theme];
            const idx = Math.floor(((h % 360 + 360) % 360) / 360 * SPRITE_COUNT) % SPRITE_COUNT;
            return arr[idx];
        }

        // ---------- 粒子类 ----------
        class Particle {
            constructor() {
                // 字段占位，真正初始化在 reset 中
                this.reset(0, 0, 2, 0.7, 'rainbow');
            }

            reset(x, y, size, speed, theme, colorT = Math.random()) {
                this.x = x;
                this.y = y;
                this.size = size * (0.6 + Math.random() * 0.8);
                this.speed = speed;

                const angle = rand(0, Math.PI * 2);
                const vel = speed * (0.3 + Math.random() * 0.7);
                this.vx = Math.cos(angle) * vel;
                this.vy = Math.sin(angle) * vel;

                // 颜色：从主题取 + 随机偏移
                this.colorT = colorT;
                const [h, s, l] = getThemeColor(theme, colorT);
                this.h = (h + rand(-8, 8) + 360) % 360;
                this.s = clamp(s + rand(-6, 6), 30, 95);
                this.l = clamp(l + rand(-8, 8), 25, 88);
                // 目标色：用于主题切换时的平滑过渡
                this.targetH = this.h;
                this.targetS = this.s;
                this.targetL = this.l;

                this.life = 1.0;
                this.decay = 0.003 + Math.random() * 0.006;
                if (reducedMotion) this.decay *= 1.8;  // 减少动效：更快消逝
                this.alpha = 0.7 + Math.random() * 0.3;

                // 拖尾随机扰动（布朗感）
                this.driftX = rand(-0.08, 0.08);
                this.driftY = rand(-0.08, 0.08);

                return this;
            }

            update() {
                this.x += this.vx + this.driftX;
                this.y += this.vy + this.driftY;

                // 布朗运动
                this.vx += rand(-0.04, 0.04);
                this.vy += rand(-0.04, 0.04);

                // 阻尼
                this.vx *= 0.995;
                this.vy *= 0.995;

                // 边界柔和淡出：超出后加速衰减，避免穿越突兀
                const m = 30;
                if (this.x < -m || this.x > W + m || this.y < -m || this.y > H + m) {
                    this.life -= 0.05;
                }

                this.life -= this.decay;
                if (this.life < 0) this.life = 0;

                // 颜色向目标色平滑过渡（主题切换时触发）
                this.h = lerpHue(this.h, this.targetH, 0.04);
                this.s = lerp(this.s, this.targetS, 0.04);
                this.l = lerp(this.l, this.targetL, 0.04);
            }

            draw(ctx) {
                const alpha = this.life * this.alpha * 0.85;
                if (alpha < 0.01) return;
                const radius = this.size * (0.3 + 0.7 * this.life) * 2.4;
                const sprite = getSprite(currentTheme, this.h);
                ctx.globalAlpha = alpha;
                ctx.drawImage(sprite, this.x - radius, this.y - radius, radius * 2, radius * 2);
            }
        }

        // ---------- 对象池 ----------
        function acquireParticle() {
            return pool.pop() || new Particle();
        }
        function releaseParticle(p) {
            if (pool.length < MAX_PARTICLES) pool.push(p);
        }

        // ---------- 生成粒子 ----------
        function spawnParticles(x, y, count, size, speed, theme) {
            const clamped = Math.min(count, 12);
            for (let i = 0; i < clamped; i++) {
                if (particles.length >= MAX_PARTICLES) break;
                const p = acquireParticle().reset(
                    x + rand(-4, 4),
                    y + rand(-4, 4),
                    size * (0.6 + rand(0, 0.6)),
                    speed * (0.5 + rand(0, 0.6)),
                    theme
                );
                particles.push(p);
            }
        }

        // ---------- 流场（自动模式用） ----------
        // 简化的双正弦流场，产生柔和的流向变化，粒子如水草般摇曳
        function flowAngle(x, y, t) {
            const s = 0.0028;
            const a = Math.sin(x * s + t * 0.0004) + Math.cos(y * s * 1.3 - t * 0.0003);
            const b = Math.sin((x + y) * s * 0.6 + t * 0.0002);
            return (a * 0.7 + b * 0.3) * Math.PI;
        }

        let autoSpawnTimer = 0;
        function updateAutoMode(dt, now) {
            if (!autoMode) return;
            autoSpawnTimer += dt;
            // 每 ~80ms 沿流场方向撒一簇粒子
            if (autoSpawnTimer > 80) {
                autoSpawnTimer = 0;
                const count = reducedMotion ? 2 : 4;
                for (let i = 0; i < count; i++) {
                    if (particles.length >= MAX_PARTICLES) break;
                    const x = rand(W * 0.1, W * 0.9);
                    const y = rand(H * 0.1, H * 0.9);
                    const ang = flowAngle(x, y, now);
                    const spd = particleSpeed * 0.9;
                    const p = acquireParticle().reset(x, y, particleSize, spd, currentTheme);
                    p.vx = Math.cos(ang) * spd;
                    p.vy = Math.sin(ang) * spd;
                    p.decay *= 0.7;  // 自动模式粒子活得更久，营造持续流动
                    particles.push(p);
                }
            }
        }

        // ---------- 绘制主循环 ----------
        function draw(now) {
            const dt = lastFrameTime ? (now - lastFrameTime) : 16;
            lastFrameTime = now;

            // ★ 背景重绘：拖尾模式半透明清除形成流光，保留模式不清除让轨迹永久累积
            const bgHex = bgDark ? THEMES[currentTheme].bg : LIGHT_BG;
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';
            if (!preserveMode) {
                const trailAlpha = reducedMotion ? 0.25 : (bgDark ? 0.09 : 0.12);
                ctx.fillStyle = hexToRgba(bgHex, trailAlpha);
                ctx.fillRect(0, 0, W, H);
            }
            // 保留模式：跳过背景清除，粒子每帧绘制的像素自然累积保留

            // 自动模式撒粒子
            updateAutoMode(dt, now);

            // source-over（默认混合）：粒子半透明叠加，重叠不会加法过曝
            for (let i = 0; i < particles.length; i++) {
                particles[i].draw(ctx);
            }
            ctx.globalAlpha = 1;

            // 更新粒子（绘制后更新，画面更连贯）
            // 末尾交换删除：避免 splice 的 O(n) 移动
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                if (p.life <= 0) {
                    const last = particles.pop();
                    if (i < particles.length) particles[i] = last;  // 非末尾才需补位
                    releaseParticle(p);
                }
            }

            rafId = requestAnimationFrame(draw);
        }

        // ---------- 交互 ----------
        function getCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function ensurePointer(id, x, y) {
            let ptr = pointers.get(id);
            if (!ptr) {
                ptr = { x, y, prevX: x, prevY: y, active: true };
                pointers.set(id, ptr);
            }
            return ptr;
        }

        function startStroke(id, x, y) {
            const ptr = ensurePointer(id, x, y);
            ptr.x = x; ptr.y = y; ptr.prevX = x; ptr.prevY = y; ptr.active = true;
            hint.classList.add('hidden');
            spawnParticles(x, y, 8, particleSize, particleSpeed, currentTheme);
            // 移动端触觉反馈（节流由浏览器自然限频）
            if (id !== MOUSE_ID && navigator.vibrate) navigator.vibrate(8);
        }

        function moveStroke(id, x, y) {
            const ptr = pointers.get(id);
            if (!ptr || !ptr.active) return;
            ptr.prevX = ptr.x;
            ptr.prevY = ptr.y;
            ptr.x = x;
            ptr.y = y;

            const dx = x - ptr.prevX;
            const dy = y - ptr.prevY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const steps = Math.max(1, Math.floor(dist / 2));
            for (let i = 0; i < steps; i++) {
                const t = (i + 1) / steps;
                const sx = lerp(ptr.prevX, x, t);
                const sy = lerp(ptr.prevY, y, t);
                const count = 2 + Math.floor(dist / 4);
                spawnParticles(sx, sy, count, particleSize, particleSpeed, currentTheme);
            }
            // 快速移动时额外补一簇
            if (dist > 20) {
                spawnParticles(x, y, 3, particleSize * 0.8, particleSpeed * 0.8, currentTheme);
            }
        }

        function endStroke(id) {
            const ptr = pointers.get(id);
            if (!ptr) return;
            ptr.active = false;
            pointers.delete(id);
            // 抬笔释放一小团
            if (particles.length < MAX_PARTICLES - 20) {
                spawnParticles(ptr.x, ptr.y, 6, particleSize * 0.7, particleSpeed * 0.5, currentTheme);
            }
        }

        // 鼠标事件
        canvas.addEventListener('mousedown', (e) => {
            const p = getCanvasCoords(e.clientX, e.clientY);
            startStroke(MOUSE_ID, p.x, p.y);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!pointers.has(MOUSE_ID)) return;
            const p = getCanvasCoords(e.clientX, e.clientY);
            moveStroke(MOUSE_ID, p.x, p.y);
        });
        window.addEventListener('mouseup', () => endStroke(MOUSE_ID));
        canvas.addEventListener('mouseleave', () => endStroke(MOUSE_ID));

        // 多指触控
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (const t of e.changedTouches) {
                const p = getCanvasCoords(t.clientX, t.clientY);
                startStroke(t.identifier, p.x, p.y);
            }
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (const t of e.changedTouches) {
                const p = getCanvasCoords(t.clientX, t.clientY);
                moveStroke(t.identifier, p.x, p.y);
            }
        }, { passive: false });
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            for (const t of e.changedTouches) endStroke(t.identifier);
        }, { passive: false });
        canvas.addEventListener('touchcancel', (e) => {
            for (const t of e.changedTouches) endStroke(t.identifier);
        });

        // ---------- 主题切换（平滑色彩过渡） ----------
        function setTheme(theme) {
            if (theme === currentTheme) return;
            currentTheme = theme;
            // 更新背景
            if (bgDark) wrapper.style.background = THEMES[theme].bg;
            // 已有粒子：重新设定目标色，update 中会缓慢插值过渡，避免色彩断层
            for (const p of particles) {
                const [h, s, l] = getThemeColor(theme, p.colorT);
                p.targetH = (h + rand(-8, 8) + 360) % 360;
                p.targetS = clamp(s + rand(-6, 6), 30, 95);
                p.targetL = clamp(l + rand(-8, 8), 25, 88);
            }
            // 按钮状态
            themeBtns.forEach(b => {
                const on = b.dataset.theme === theme;
                b.classList.toggle('active', on);
                b.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
        }
        themeBtns.forEach(btn => {
            btn.addEventListener('click', () => setTheme(btn.dataset.theme));
        });

        // ---------- 滑块 ----------
        sizeSlider.addEventListener('input', () => {
            particleSize = parseFloat(sizeSlider.value);
            sizeVal.textContent = particleSize.toFixed(1);
        });
        speedSlider.addEventListener('input', () => {
            particleSpeed = parseFloat(speedSlider.value);
            speedVal.textContent = particleSpeed.toFixed(1);
        });

        // ---------- 清空（带 5 秒撤销） ----------
        let clearBackup = null;
        let clearUndoTimer = null;
        clearBtn.addEventListener('click', () => {
            if (particles.length === 0) {
                showToast('画布已是空的', null);
                return;
            }
            // 备份当前粒子引用，撤销时恢复
            clearBackup = particles.slice();
            particles = [];
            // 主动清除画布像素（保留模式不清除背景，必须显式重置一次）
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
            ctx.fillStyle = bgDark ? THEMES[currentTheme].bg : LIGHT_BG;
            ctx.fillRect(0, 0, W, H);
            clearBtn.style.opacity = '0.4';
            setTimeout(() => clearBtn.style.opacity = '1', 200);
            // 显示带"撤销"的 toast
            showToast('已清空画布', '↩ 撤销', () => {
                particles = clearBackup || [];
                clearBackup = null;
                clearTimeout(clearUndoTimer);
                showToast('已恢复', null);
            });
            clearTimeout(clearUndoTimer);
            clearUndoTimer = setTimeout(() => { clearBackup = null; }, 5000);
        });

        // ---------- 背景切换 ----------
        function setBgDark(dark) {
            bgDark = dark;
            document.body.classList.toggle('light-bg', !dark);
            if (dark) {
                wrapper.style.background = THEMES[currentTheme].bg;
                bgToggle.style.opacity = '1';
            } else {
                wrapper.style.background = LIGHT_BG;
                bgToggle.style.opacity = '0.5';
            }
        }
        bgToggle.addEventListener('click', () => setBgDark(!bgDark));

        // ---------- 自动模式 ----------
        function setAutoMode(on) {
            autoMode = on;
            autoBtn.classList.toggle('active-toggle', on);
            autoBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
            autoBtn.textContent = on ? '⏸' : '▶';
            hint.classList.add('hidden');
            showToast(on ? '自动模式已开启' : '自动模式已关闭', null);
        }
        autoBtn.addEventListener('click', () => setAutoMode(!autoMode));

        // ---------- 保留路径模式 ----------
        // 开启后不清除背景，粒子绘制的轨迹永久累积保留，像真正的画笔
        function setPreserveMode(on) {
            preserveMode = on;
            preserveBtn.classList.toggle('active-toggle', on);
            preserveBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
            showToast(on ? '路径保留已开启 · 轨迹不再消散' : '路径保留已关闭', null);
        }
        preserveBtn.addEventListener('click', () => setPreserveMode(!preserveMode));

        // ---------- 控制面板折叠 ----------
        function setCollapsed(collapsed) {
            controls.classList.toggle('collapsed', collapsed);
            expandBtn.classList.toggle('visible', collapsed);
        }
        collapseBtn.addEventListener('click', () => setCollapsed(true));
        expandBtn.addEventListener('click', () => setCollapsed(false));

        // ---------- 保存 ----------
        saveBtn.addEventListener('click', () => {
            // 暂时隐藏 UI 元素，确保截图干净
            const elsToHide = [controls, document.querySelector('.brand'), hint, expandBtn];
            const prevOpacity = elsToHide.map(el => el ? el.style.opacity : '');
            elsToHide.forEach(el => { if (el) el.style.opacity = '0'; });

            requestAnimationFrame(() => {
                setTimeout(() => {
                    try {
                        const link = document.createElement('a');
                        const ts = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
                        link.download = `流光绘卷_${ts}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        showToast('已保存为图片', null);
                    } catch (err) {
                        showToast('保存失败，请重试', null);
                    } finally {
                        elsToHide.forEach((el, i) => { if (el) el.style.opacity = prevOpacity[i]; });
                    }
                }, 200);  // 等待透明度过渡完成
            });
        });

        // ---------- Toast ----------
        function showToast(text, actionLabel, onAction) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            const span = document.createElement('span');
            span.textContent = text;
            toast.appendChild(span);
            if (actionLabel) {
                const btn = document.createElement('button');
                btn.className = 'toast-action';
                btn.textContent = actionLabel;
                btn.addEventListener('click', () => {
                    if (onAction) onAction();
                    removeToast(toast);
                });
                toast.appendChild(btn);
            }
            toastContainer.appendChild(toast);
            // 带 action 的 toast 停留 5 秒，普通 toast 2.2 秒
            setTimeout(() => removeToast(toast), actionLabel ? 5000 : 2200);
        }
        function removeToast(toast) {
            if (!toast.parentNode) return;
            toast.classList.add('out');
            setTimeout(() => {
                if (toast.parentNode) toast.parentNode.removeChild(toast);
            }, 300);
        }

        // ---------- 标签页可见性：隐藏时暂停渲染，省电 ----------
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (rafId) cancelAnimationFrame(rafId);
                rafId = null;
                lastFrameTime = 0;
            } else {
                if (!rafId) rafId = requestAnimationFrame(draw);
            }
        });

        // ---------- 启动 ----------
        rafId = requestAnimationFrame(draw);

        // 初始生成一些星尘，营造氛围
        const initCount = reducedMotion ? 50 : 120;
        for (let i = 0; i < initCount; i++) {
            const p = acquireParticle().reset(
                rand(0, W), rand(0, H),
                rand(0.5, 2.0), rand(0.1, 0.4),
                currentTheme
            );
            p.life = rand(0.3, 0.9);
            p.decay = rand(0.001, 0.005);
            particles.push(p);
        }

        // 提示自动隐藏
        setTimeout(() => hint.classList.add('hidden'), 6000);
        hint.addEventListener('click', () => hint.classList.add('hidden'));

        // ---------- 键盘快捷键 ----------
        document.addEventListener('keydown', (e) => {
            // 输入框聚焦时不触发，避免冲突
            if (e.target.tagName === 'INPUT') return;
            const k = e.key.toLowerCase();
            if (k === 'c') clearBtn.click();
            else if (k === 'b') bgToggle.click();
            else if (k === 's') { e.preventDefault(); saveBtn.click(); }
            else if (k === 'a') autoBtn.click();
            else if (k === 'p') preserveBtn.click();
            else if (e.code === 'Space') {
                e.preventDefault();
                const themes = ['rainbow', 'ocean', 'fire', 'aurora', 'candy'];
                const idx = themes.indexOf(currentTheme);
                setTheme(themes[(idx + 1) % themes.length]);
            }
            else if (k >= '1' && k <= '5') {
                const themes = ['rainbow', 'ocean', 'fire', 'aurora', 'candy'];
                setTheme(themes[parseInt(k) - 1]);
            }
        });

        console.log('✦ 流光绘卷 v2 已启动');
        console.log('   🎨 点击主题切换色彩（平滑过渡）');
        console.log('   🔘 滑块调节大小/速度');
        console.log('   ▶ 自动模式：让粒子随流场自由流动');
        console.log('   📌 保留模式：轨迹不消散，像画笔一样累积');
        console.log('   ⌨️ 快捷键: [C]清空 [B]背景 [S]保存 [A]自动 [P]保留 [Space/1-5]换主题');
    </script>
</body>
</html>
