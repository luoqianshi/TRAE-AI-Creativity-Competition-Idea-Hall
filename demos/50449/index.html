<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时记 - 极简时间追踪</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4F46E5;
            --primary-light: #818CF8;
            --primary-dark: #4338CA;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --text: #1E293B;
            --text-secondary: #64748B;
            --border: #E2E8F0;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-container {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        /* Navigation */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            margin-bottom: 24px;
        }

        .nav-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: transparent;
        }

        .nav-link:hover {
            background: var(--border);
            color: var(--text);
        }

        .nav-link.active {
            background: var(--primary);
            color: white;
        }

        /* Pages */
        .page {
            display: none;
            flex: 1;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Timer Page */
        .timer-page {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .activity-selector {
            width: 100%;
            margin-bottom: 32px;
        }

        .activity-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .activity-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .activity-pill {
            padding: 8px 20px;
            border-radius: 20px;
            border: 2px solid var(--border);
            background: var(--surface);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .activity-pill:hover {
            border-color: var(--primary-light);
            color: var(--primary);
        }

        .activity-pill.selected {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .main-button {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px rgba(79, 70, 229, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .main-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent);
            pointer-events: none;
        }

        .main-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 50px rgba(79, 70, 229, 0.4);
        }

        .main-button:active {
            transform: scale(0.98);
        }

        .main-button.recording {
            background: var(--danger);
            box-shadow: 0 10px 40px rgba(239, 68, 68, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 40px rgba(239, 68, 68, 0.3); }
            50% { box-shadow: 0 10px 60px rgba(239, 68, 68, 0.5); }
        }

        .button-icon {
            font-size: 32px;
            margin-bottom: 4px;
        }

        .button-text {
            font-size: 16px;
            font-weight: 600;
        }

        .timer-display {
            font-size: 48px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            margin-top: 32px;
            color: var(--text);
            font-family: 'SF Mono', Monaco, monospace;
        }

        .timer-status {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .current-activity {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            margin-top: 8px;
        }

        /* Stats Page */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chart-container {
            background: var(--surface);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text);
        }

        .history-list {
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .history-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-activity {
            font-weight: 600;
            font-size: 14px;
        }

        .history-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .history-duration {
            font-weight: 700;
            font-size: 16px;
            color: var(--primary);
        }

        /* Analysis Page */
        .analysis-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .analysis-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .analysis-content {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .analysis-content p {
            margin-bottom: 12px;
        }

        .insight-item {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            padding: 16px;
            background: var(--bg);
            border-radius: 12px;
        }

        .insight-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .insight-icon.good {
            background: rgba(16, 185, 129, 0.1);
        }

        .insight-icon.tip {
            background: rgba(245, 158, 11, 0.1);
        }

        .insight-icon.info {
            background: rgba(79, 70, 229, 0.1);
        }

        .insight-text {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
        }

        .insight-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        /* Settings Page */
        .settings-section {
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .settings-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .activity-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg);
            border-radius: 12px;
        }

        .activity-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            outline: none;
        }

        .activity-delete {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .activity-delete:hover {
            background: var(--danger);
            color: white;
        }

        .add-activity {
            width: 100%;
            padding: 12px;
            border: 2px dashed var(--border);
            border-radius: 12px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .add-activity:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .danger-zone {
            border-color: var(--danger);
        }

        .danger-zone .settings-title {
            color: var(--danger);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-danger:hover {
            background: var(--danger);
            color: white;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .empty-subtext {
            font-size: 14px;
            opacity: 0.7;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1000;
            opacity: 0;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Page Title */
        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-logo {
            font-size: 48px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
            animation: loadingPulse 1.5s ease infinite;
        }

        .loading-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        @keyframes loadingPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        /* Keyboard hint */
        .keyboard-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 16px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.6);
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .kbd {
            display: inline-block;
            padding: 2px 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            box-shadow: 0 2px 0 var(--border);
            margin: 0 2px;
        }

        /* Import/Export buttons */
        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .btn-secondary:hover {
            background: var(--bg);
            border-color: var(--primary);
            color: var(--primary);
        }

        .hidden-input {
            display: none;
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loading-screen">
        <div class="loading-logo">时记</div>
        <div class="loading-subtitle">极简时间追踪</div>
    </div>

    <div class="app-container">
        <nav class="nav-bar">
            <div class="nav-title">时记</div>
            <div class="nav-links">
                <button class="nav-link active" data-page="timer">计时</button>
                <button class="nav-link" data-page="stats">统计</button>
                <button class="nav-link" data-page="analysis">分析</button>
                <button class="nav-link" data-page="settings">设置</button>
            </div>
        </nav>

        <!-- Timer Page -->
        <div class="page active" id="timer-page">
            <div class="timer-page">
                <div class="activity-selector">
                    <div class="activity-label">选择活动</div>
                    <div class="activity-pills" id="activity-pills">
                        <!-- Dynamic -->
                    </div>
                </div>

                <button class="main-button" id="main-button">
                    <span class="button-icon" id="button-icon">▶</span>
                    <span class="button-text" id="button-text">开始专注</span>
                </button>

                <div class="timer-display" id="timer-display" style="display: none;">00:00:00</div>
                <div class="current-activity" id="current-activity" style="display: none;"></div>
                <div class="timer-status" id="timer-status"></div>
                <div class="keyboard-hint" id="keyboard-hint">
                    <span class="kbd">空格</span> 开始/停止 &nbsp;|&nbsp; <span class="kbd">1</span>-<span class="kbd">9</span> 快速选择
                </div>
            </div>
        </div>

        <!-- Stats Page -->
        <div class="page" id="stats-page">
            <div class="page-title">数据统计</div>
            <div id="stats-content">
                <!-- Dynamic -->
            </div>
        </div>

        <!-- Analysis Page -->
        <div class="page" id="analysis-page">
            <div class="page-title">行为分析</div>
            <div id="analysis-content">
                <!-- Dynamic -->
            </div>
        </div>

        <!-- Settings Page -->
        <div class="page" id="settings-page">
            <div class="page-title">设置</div>
            <div class="settings-section">
                <div class="settings-title">活动项目</div>
                <div class="activity-list" id="settings-activity-list">
                    <!-- Dynamic -->
                </div>
                <button class="add-activity" id="add-activity">+ 添加活动</button>
            </div>
            <div class="settings-section">
                <div class="settings-title">数据备份</div>
                <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 16px;">导出或导入你的计时数据，方便换设备时迁移。</p>
                <button class="btn-secondary" id="export-data">📥 导出数据</button>
                <button class="btn-secondary" id="import-data-btn">📤 导入数据</button>
                <input type="file" class="hidden-input" id="import-file" accept=".json">
            </div>
            <div class="settings-section danger-zone">
                <div class="settings-title">数据管理</div>
                <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 16px;">清除所有本地存储的计时数据，此操作不可撤销。</p>
                <button class="btn-danger" id="clear-data">清除所有数据</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // App State
        const App = {
            activities: JSON.parse(localStorage.getItem('timeTracker_activities')) || [
                '深度工作', '阅读学习', '运动健身', '写作创作', '冥想休息'
            ],
            records: JSON.parse(localStorage.getItem('timeTracker_records')) || [],
            currentActivity: null,
            startTime: null,
            timerInterval: null,
            selectedActivity: null
        };

        // DOM Elements
        const els = {
            pages: document.querySelectorAll('.page'),
            navLinks: document.querySelectorAll('.nav-link'),
            activityPills: document.getElementById('activity-pills'),
            mainButton: document.getElementById('main-button'),
            buttonIcon: document.getElementById('button-icon'),
            buttonText: document.getElementById('button-text'),
            timerDisplay: document.getElementById('timer-display'),
            currentActivity: document.getElementById('current-activity'),
            timerStatus: document.getElementById('timer-status'),
            keyboardHint: document.getElementById('keyboard-hint'),
            statsContent: document.getElementById('stats-content'),
            analysisContent: document.getElementById('analysis-content'),
            settingsActivityList: document.getElementById('settings-activity-list'),
            addActivityBtn: document.getElementById('add-activity'),
            clearDataBtn: document.getElementById('clear-data'),
            exportDataBtn: document.getElementById('export-data'),
            importDataBtn: document.getElementById('import-data-btn'),
            importFile: document.getElementById('import-file'),
            loadingScreen: document.getElementById('loading-screen'),
            toast: document.getElementById('toast')
        };

        // Utility Functions
        function formatDuration(ms) {
            const seconds = Math.floor(ms / 1000);
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function formatDurationShort(ms) {
            const seconds = Math.floor(ms / 1000);
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            if (hours > 0) return `${hours}小时${minutes}分钟`;
            return `${minutes}分钟`;
        }

        function formatDate(date) {
            const d = new Date(date);
            return `${d.getMonth() + 1}月${d.getDate()}日 ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
        }

        function showToast(message) {
            els.toast.textContent = message;
            els.toast.classList.add('show');
            setTimeout(() => els.toast.classList.remove('show'), 2500);
        }

        function saveData() {
            localStorage.setItem('timeTracker_activities', JSON.stringify(App.activities));
            localStorage.setItem('timeTracker_records', JSON.stringify(App.records));
        }

        // Audio Feedback
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playSound(type) {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'start') {
                    osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'stop') {
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(523, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'complete') {
                    osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.1);
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
                    gain2.gain.setValueAtTime(0.12, audioCtx.currentTime + 0.1);
                    osc2.start(audioCtx.currentTime + 0.1);
                    osc2.stop(audioCtx.currentTime + 0.2);
                    const osc3 = audioCtx.createOscillator();
                    const gain3 = audioCtx.createGain();
                    osc3.connect(gain3);
                    gain3.connect(audioCtx.destination);
                    osc3.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);
                    gain3.gain.setValueAtTime(0.12, audioCtx.currentTime + 0.2);
                    osc3.start(audioCtx.currentTime + 0.2);
                    osc3.stop(audioCtx.currentTime + 0.4);
                }
            } catch (e) {
                // Audio not supported, silently ignore
            }
        }

        // Export / Import
        function exportData() {
            const data = {
                version: 1,
                exportTime: Date.now(),
                activities: App.activities,
                records: App.records
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `时记备份_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('数据已导出');
        }

        function importData(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.activities && Array.isArray(data.activities)) {
                        App.activities = data.activities;
                    }
                    if (data.records && Array.isArray(data.records)) {
                        App.records = data.records;
                    }
                    saveData();
                    renderActivityPills();
                    showToast('数据导入成功');
                } catch (err) {
                    showToast('导入失败：文件格式错误');
                }
            };
            reader.readAsText(file);
        }

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;

            if (e.code === 'Space') {
                e.preventDefault();
                els.mainButton.click();
                return;
            }

            if (e.key >= '1' && e.key <= '9') {
                const idx = parseInt(e.key) - 1;
                const pills = document.querySelectorAll('.activity-pill');
                if (pills[idx] && !App.startTime) {
                    pills[idx].click();
                }
            }
        });

        // Navigation
        els.navLinks.forEach(link => {
            link.addEventListener('click', () => {
                const page = link.dataset.page;
                switchPage(page);
            });
        });

        function switchPage(page) {
            els.navLinks.forEach(l => l.classList.remove('active'));
            document.querySelector(`[data-page="${page}"]`).classList.add('active');
            els.pages.forEach(p => p.classList.remove('active'));
            document.getElementById(`${page}-page`).classList.add('active');

            if (page === 'stats') renderStats();
            if (page === 'analysis') renderAnalysis();
            if (page === 'settings') renderSettings();
        }

        // Timer Page
        function renderActivityPills() {
            els.activityPills.innerHTML = '';
            App.activities.forEach(activity => {
                const pill = document.createElement('button');
                pill.className = `activity-pill ${App.selectedActivity === activity ? 'selected' : ''}`;
                pill.textContent = activity;
                pill.addEventListener('click', () => {
                    if (App.startTime) return;
                    App.selectedActivity = activity;
                    renderActivityPills();
                });
                els.activityPills.appendChild(pill);
            });
        }

        function updateTimerDisplay() {
            if (!App.startTime) return;
            const elapsed = Date.now() - App.startTime;
            els.timerDisplay.textContent = formatDuration(elapsed);
        }

        els.mainButton.addEventListener('click', () => {
            if (!App.startTime) {
                if (!App.selectedActivity) {
                    showToast('请先选择一个活动');
                    return;
                }
                // Start
                App.startTime = Date.now();
                App.currentActivity = App.selectedActivity;
                els.mainButton.classList.add('recording');
                els.buttonIcon.textContent = '⏹';
                els.buttonText.textContent = '停止计时';
                els.timerDisplay.style.display = 'block';
                els.currentActivity.style.display = 'block';
                els.currentActivity.textContent = App.currentActivity;
                els.timerStatus.textContent = '正在记录中...';
                els.activityPills.style.pointerEvents = 'none';
                els.activityPills.style.opacity = '0.5';

                playSound('start');
                App.timerInterval = setInterval(updateTimerDisplay, 1000);
                updateTimerDisplay();
            } else {
                // Stop
                playSound('stop');
                const endTime = Date.now();
                const duration = endTime - App.startTime;

                App.records.push({
                    activity: App.currentActivity,
                    startTime: App.startTime,
                    endTime: endTime,
                    duration: duration
                });
                saveData();

                clearInterval(App.timerInterval);
                App.startTime = null;
                App.currentActivity = null;

                els.mainButton.classList.remove('recording');
                els.buttonIcon.textContent = '▶';
                els.buttonText.textContent = '开始专注';
                els.timerDisplay.style.display = 'none';
                els.currentActivity.style.display = 'none';
                els.timerStatus.textContent = `已记录: ${formatDurationShort(duration)}`;
                els.activityPills.style.pointerEvents = 'auto';
                els.activityPills.style.opacity = '1';

                setTimeout(() => playSound('complete'), 200);
                showToast(`记录完成！用时 ${formatDurationShort(duration)}`);
            }
        });

        // Stats Page
        function renderStats() {
            if (App.records.length === 0) {
                els.statsContent.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📊</div>
                        <div class="empty-text">暂无数据</div>
                        <div class="empty-subtext">开始计时后，这里会显示统计图表</div>
                    </div>
                `;
                return;
            }

            const totalTime = App.records.reduce((sum, r) => sum + r.duration, 0);
            const totalSessions = App.records.length;
            const avgDuration = totalTime / totalSessions;

            const activityStats = {};
            App.records.forEach(r => {
                if (!activityStats[r.activity]) {
                    activityStats[r.activity] = { duration: 0, count: 0 };
                }
                activityStats[r.activity].duration += r.duration;
                activityStats[r.activity].count++;
            });

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayTime = App.records
                .filter(r => new Date(r.startTime) >= today)
                .reduce((sum, r) => sum + r.duration, 0);

            // Last 7 days data
            const last7Days = [];
            const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                d.setHours(0, 0, 0, 0);
                const nextDay = new Date(d);
                nextDay.setDate(nextDay.getDate() + 1);
                const dayTime = App.records
                    .filter(r => new Date(r.startTime) >= d && new Date(r.startTime) < nextDay)
                    .reduce((sum, r) => sum + r.duration, 0);
                last7Days.push({
                    label: i === 0 ? '今天' : `${d.getMonth()+1}/${d.getDate()}`,
                    minutes: Math.round(dayTime / 60000)
                });
            }

            els.statsContent.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value">${formatDurationShort(totalTime)}</div>
                        <div class="stat-label">总专注时间</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${totalSessions}</div>
                        <div class="stat-label">总次数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${formatDurationShort(avgDuration)}</div>
                        <div class="stat-label">平均时长</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${formatDurationShort(todayTime)}</div>
                        <div class="stat-label">今日专注</div>
                    </div>
                </div>

                <div class="chart-container">
                    <div class="chart-title">近7天专注时间（分钟）</div>
                    <canvas id="trend-chart"></canvas>
                </div>

                <div class="chart-container">
                    <div class="chart-title">各活动时间分布</div>
                    <canvas id="activity-chart"></canvas>
                </div>

                <div class="history-list">
                    ${App.records.slice().reverse().slice(0, 10).map(r => `
                        <div class="history-item">
                            <div class="history-info">
                                <div class="history-activity">${r.activity}</div>
                                <div class="history-time">${formatDate(r.startTime)}</div>
                            </div>
                            <div class="history-duration">${formatDurationShort(r.duration)}</div>
                        </div>
                    `).join('')}
                </div>
            `;

            // Trend Chart
            const trendCtx = document.getElementById('trend-chart');
            if (trendCtx) {
                new Chart(trendCtx, {
                    type: 'line',
                    data: {
                        labels: last7Days.map(d => d.label),
                        datasets: [{
                            label: '专注时间（分钟）',
                            data: last7Days.map(d => d.minutes),
                            borderColor: '#4F46E5',
                            backgroundColor: 'rgba(79, 70, 229, 0.1)',
                            borderWidth: 3,
                            tension: 0.4,
                            fill: true,
                            pointBackgroundColor: '#4F46E5',
                            pointRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: '#E2E8F0' } },
                            x: { grid: { display: false } }
                        }
                    }
                });
            }

            // Activity Chart
            const actCtx = document.getElementById('activity-chart');
            if (actCtx) {
                const labels = Object.keys(activityStats);
                const data = labels.map(l => Math.round(activityStats[l].duration / 60000));
                const colors = ['#4F46E5', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899'];

                new Chart(actCtx, {
                    type: 'doughnut',
                    data: {
                        labels,
                        datasets: [{
                            data,
                            backgroundColor: colors.slice(0, labels.length),
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { position: 'bottom', labels: { padding: 20, usePointStyle: true } }
                        },
                        cutout: '60%'
                    }
                });
            }
        }

        // Analysis Page
        function renderAnalysis() {
            if (App.records.length < 3) {
                els.analysisContent.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <div class="empty-text">数据不足</div>
                        <div class="empty-subtext">至少需要3条记录才能生成分析</div>
                    </div>
                `;
                return;
            }

            const activityStats = {};
            App.records.forEach(r => {
                if (!activityStats[r.activity]) {
                    activityStats[r.activity] = { duration: 0, count: 0 };
                }
                activityStats[r.activity].duration += r.duration;
                activityStats[r.activity].count++;
            });

            const sortedActivities = Object.entries(activityStats)
                .sort((a, b) => b[1].duration - a[1].duration);

            const topActivity = sortedActivities[0];
            const totalTime = App.records.reduce((sum, r) => sum + r.duration, 0);
            const avgDuration = totalTime / App.records.length;

            // Find most productive hour
            const hourStats = {};
            App.records.forEach(r => {
                const hour = new Date(r.startTime).getHours();
                if (!hourStats[hour]) hourStats[hour] = 0;
                hourStats[hour] += r.duration;
            });
            const bestHour = Object.entries(hourStats).sort((a, b) => b[1] - a[1])[0];

            // Consistency analysis
            const dailyRecords = {};
            App.records.forEach(r => {
                const date = new Date(r.startTime).toDateString();
                if (!dailyRecords[date]) dailyRecords[date] = 0;
                dailyRecords[date]++;
            });
            const activeDays = Object.keys(dailyRecords).length;
            const totalDays = Math.ceil((Math.max(...App.records.map(r => r.startTime)) - Math.min(...App.records.map(r => r.startTime))) / 86400000) + 1;
            const consistency = Math.round((activeDays / totalDays) * 100);

            let consistencyMsg = '';
            if (consistency >= 70) consistencyMsg = '你的使用频率非常高，保持了很好的连续性！';
            else if (consistency >= 40) consistencyMsg = '你的使用频率不错，可以尝试每天固定时间使用。';
            else consistencyMsg = '你的使用频率较低，建议养成固定的时间记录习惯。';

            // Duration analysis
            let durationMsg = '';
            const avgMin = avgDuration / 60000;
            if (avgMin >= 45) durationMsg = '你的平均专注时长较长，说明能够很好地保持注意力。';
            else if (avgMin >= 20) durationMsg = '你的平均专注时长适中，符合高效工作的节奏。';
            else durationMsg = '你的单次专注时长偏短，可以尝试延长专注时间，减少中断。';

            els.analysisContent.innerHTML = `
                <div class="analysis-card">
                    <div class="analysis-title">📊 整体概览</div>
                    <div class="analysis-content">
                        <p>你已经记录了 <strong>${App.records.length}</strong> 次专注时段，累计 <strong>${formatDurationShort(totalTime)}</strong>。</p>
                        <p>你最常进行的活动是 <strong>${topActivity[0]}</strong>，占总时间的 <strong>${Math.round(topActivity[1].duration / totalTime * 100)}%</strong>。</p>
                    </div>
                </div>

                <div class="analysis-card">
                    <div class="analysis-title">💡 智能洞察</div>
                    <div class="insight-item">
                        <div class="insight-icon good">⏰</div>
                        <div>
                            <div class="insight-label">高效时段</div>
                            <div class="insight-text">你在 <strong>${bestHour[0]}:00-${bestHour[0]}:59</strong> 之间最为高效，建议将重要任务安排在这个时间段。</div>
                        </div>
                    </div>
                    <div class="insight-item">
                        <div class="insight-icon info">📈</div>
                        <div>
                            <div class="insight-label">专注质量</div>
                            <div class="insight-text">${durationMsg} 平均每次专注 <strong>${Math.round(avgMin)} 分钟</strong>。</div>
                        </div>
                    </div>
                    <div class="insight-item">
                        <div class="insight-icon tip">🎯</div>
                        <div>
                            <div class="insight-label">使用习惯</div>
                            <div class="insight-text">${consistencyMsg} 活跃天数占比 <strong>${consistency}%</strong>。</div>
                        </div>
                    </div>
                </div>

                <div class="analysis-card">
                    <div class="analysis-title">🚀 改进建议</div>
                    <div class="analysis-content">
                        ${generateSuggestions(sortedActivities, avgMin, consistency)}
                    </div>
                </div>
            `;
        }

        function generateSuggestions(sortedActivities, avgMin, consistency) {
            const suggestions = [];

            if (sortedActivities.length === 1) {
                suggestions.push('<p>你的活动类型比较单一，可以尝试添加更多类型的活动来平衡生活。</p>');
            }

            if (avgMin < 25) {
                suggestions.push('<p>尝试使用番茄工作法，设定25分钟的专注时段，逐步提升专注力。</p>');
            }

            if (consistency < 50) {
                suggestions.push('<p>设置固定的提醒时间，培养每日记录的习惯，哪怕只是5分钟。</p>');
            }

            const workActivities = ['深度工作', '写作创作', '阅读学习'];
            const restActivities = ['冥想休息', '运动健身'];

            const hasWork = sortedActivities.some(([name]) => workActivities.includes(name));
            const hasRest = sortedActivities.some(([name]) => restActivities.includes(name));

            if (hasWork && !hasRest) {
                suggestions.push('<p>你专注于工作和学习较多，别忘了安排休息和运动时间，劳逸结合才能持续高效。</p>');
            }

            if (suggestions.length === 0) {
                suggestions.push('<p>你的时间管理习惯很好！继续保持，可以尝试挑战更长的专注时段。</p>');
            }

            return suggestions.join('');
        }

        // Settings Page
        function renderSettings() {
            els.settingsActivityList.innerHTML = '';
            App.activities.forEach((activity, index) => {
                const row = document.createElement('div');
                row.className = 'activity-row';
                row.innerHTML = `
                    <input type="text" class="activity-input" value="${activity}" data-index="${index}">
                    <button class="activity-delete" data-index="${index}">×</button>
                `;
                els.settingsActivityList.appendChild(row);
            });

            document.querySelectorAll('.activity-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const idx = parseInt(e.target.dataset.index);
                    App.activities[idx] = e.target.value.trim();
                    saveData();
                    renderActivityPills();
                    showToast('活动已更新');
                });
            });

            document.querySelectorAll('.activity-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.target.dataset.index);
                    if (App.activities.length <= 1) {
                        showToast('至少保留一个活动');
                        return;
                    }
                    App.activities.splice(idx, 1);
                    saveData();
                    renderSettings();
                    renderActivityPills();
                    showToast('活动已删除');
                });
            });
        }

        els.addActivityBtn.addEventListener('click', () => {
            App.activities.push('新活动');
            saveData();
            renderSettings();
        });

        els.clearDataBtn.addEventListener('click', () => {
            if (confirm('确定要清除所有数据吗？此操作不可撤销。')) {
                App.records = [];
                saveData();
                showToast('所有数据已清除');
            }
        });

        els.exportDataBtn.addEventListener('click', exportData);
        els.importDataBtn.addEventListener('click', () => els.importFile.click());
        els.importFile.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                importData(e.target.files[0]);
                e.target.value = '';
            }
        });

        // Handle page visibility change (background timer)
        document.addEventListener('visibilitychange', () => {
            if (App.startTime) {
                updateTimerDisplay();
            }
        });

        // Recover timer state after page refresh
        function recoverTimerState() {
            const savedState = sessionStorage.getItem('timeTracker_running');
            if (savedState) {
                try {
                    const state = JSON.parse(savedState);
                    if (state.running && state.startTime && state.activity) {
                        App.startTime = state.startTime;
                        App.currentActivity = state.activity;
                        App.selectedActivity = state.activity;
                        els.mainButton.classList.add('recording');
                        els.buttonIcon.textContent = '⏹';
                        els.buttonText.textContent = '停止计时';
                        els.timerDisplay.style.display = 'block';
                        els.currentActivity.style.display = 'block';
                        els.currentActivity.textContent = App.currentActivity;
                        els.timerStatus.textContent = '正在记录中... (已恢复)';
                        els.activityPills.style.pointerEvents = 'none';
                        els.activityPills.style.opacity = '0.5';
                        App.timerInterval = setInterval(updateTimerDisplay, 1000);
                        updateTimerDisplay();
                        renderActivityPills();
                    }
                } catch (e) {
                    sessionStorage.removeItem('timeTracker_running');
                }
            }
        }

        // Save running state before unload
        window.addEventListener('beforeunload', () => {
            if (App.startTime) {
                sessionStorage.setItem('timeTracker_running', JSON.stringify({
                    running: true,
                    startTime: App.startTime,
                    activity: App.currentActivity
                }));
            } else {
                sessionStorage.removeItem('timeTracker_running');
            }
        });

        // Initialize
        renderActivityPills();
        recoverTimerState();

        // Hide loading screen
        setTimeout(() => {
            els.loadingScreen.classList.add('hidden');
        }, 600);
    </script>
</body>
</html>
