.tag-input-area input { border: none; outline: none; flex: 1; min-width: 80px; font-size: 13px; }

/* Chat */
.chat-layout { display: flex; height: calc(100vh - var(--topbar-h) - var(--tenantbar-h) - 40px); gap: 0; }
.chat-sidebar {
  width: 300px; flex-shrink: 0;
  background: var(--bg-white);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.chat-sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--border-light); }
.chat-sidebar-tabs { display: flex; gap: 0; margin-bottom: 8px; }
.chat-tab { padding: 4px 12px; font-size: 13px; color: var(--ink-muted); cursor: pointer; border-radius: var(--radius-sm); transition: all .2s; }
.chat-tab:hover { background: var(--bg-hover); }
.chat-tab.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.chat-list { flex: 1; overflow-y: auto; }
.chat-list-item {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-light);
  cursor: pointer; transition: background .2s;
  display: flex; gap: 10px;
}
.chat-list-item:hover { background: var(--bg-hover); }
.chat-list-item.active { background: var(--primary-light); }
.chat-list-item .avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; flex-shrink: 0;
}
.chat-list-item .info { flex: 1; min-width: 0; }
.chat-list-item .name { font-size: 13px; font-weight: 500; color: var(--ink); display: flex; justify-content: space-between; align-items: center; }
.chat-list-item .time { font-size: 11px; color: var(--ink-muted); }
.chat-list-item .preview { font-size: 12px; color: var(--ink-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-list-item .unread { background: var(--danger); color: #fff; font-size: 10px; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }

.chat-main {
  flex: 1;
  background: var(--bg-white);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  display: flex; flex-direction: column;
  overflow: hidden;
  margin-left: 16px;
}
.chat-header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border-light);
  display: flex; align-items: center; justify-content: space-between;
}
.chat-header .customer-info { display: flex; align-items: center; gap: 10px; }
.chat-header .customer-name { font-size: 15px; font-weight: 600; }
.chat-header .customer-tags { display: flex; gap: 4px; }
.chat-messages {
  flex: 1; overflow-y: auto;
  padding: 20px;
  background: var(--bg);
}
.message-row { display: flex; margin-bottom: 16px; gap: 10px; }
.message-row.right { flex-direction: row-reverse; }
.message-row .msg-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; flex-shrink: 0;
}
.message-row .msg-avatar.ai { background: var(--primary); color: #fff; }
.message-row .msg-avatar.customer { background: var(--border-light); color: var(--ink-secondary); }
.message-row .msg-avatar.agent { background: var(--success); color: #fff; }
.message-row .msg-content { max-width: 60%; }
.message-row .msg-bubble {
  padding: 10px 14px;
  border-radius: var(--radius-lg);
  font-size: 13px; line-height: 1.6;
  word-break: break-word;
}
.message-row:not(.right) .msg-bubble { background: var(--bg-white); border: 1px solid var(--border-light); border-top-left-radius: 4px; }
.message-row.right .msg-bubble { background: var(--primary); color: #fff; border-top-right-radius: 4px; }
.message-row .msg-time { font-size: 11px; color: var(--ink-muted); margin-top: 4px; }
.message-row.right .msg-time { text-align: right; }
.msg-system { text-align: center; font-size: 12px; color: var(--ink-muted); margin-bottom: 16px; }

/* AI Recommend */
.ai-recommend {
  padding: 10px 16px;
  border-top: 1px solid var(--border-light);
  background: var(--primary-light);
}
.ai-recommend-header { font-size: 12px; color: var(--primary); font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
.ai-recommend-list { display: flex; gap: 8px; flex-wrap: wrap; }
.ai-recommend-item {
  padding: 6px 12px;
  background: var(--bg-white);
  border: 1px solid var(--primary);
  border-radius: var(--radius-md);
  font-size: 12px; color: var(--primary);
  cursor: pointer; transition: all .2s;
  display: flex; align-items: center; gap: 4px;
}
.ai-recommend-item:hover { background: var(--primary); color: #fff; }

/* Chat Input */
.chat-input-area {
  padding: 12px 16px;
  border-top: 1px solid var(--border-light);
  display: flex; flex-direction: column; gap: 8px;
}
.chat-input-toolbar { display: flex; align-items: center; gap: 8px; }
.chat-input-toolbar .tool-btn {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-muted); cursor: pointer; transition: all .2s;
}
.chat-input-toolbar .tool-btn:hover { background: var(--bg-hover); color: var(--ink); }
.chat-input-box { display: flex; gap: 8px; }
.chat-input-box textarea {
  flex: 1; height: 60px; padding: 8px 12px;
  border: 1px solid var(--border); border-radius: var(--radius-md);
  resize: none; font-size: 13px; line-height: 1.5;
  transition: border-color .2s;
}
.chat-input-box textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,93,255,0.1); }

/* Funnel */
.funnel-chart { display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
.funnel-stage {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; max-width: 500px;
  padding: 14px 24px;
  margin-bottom: 4px;
  cursor: pointer;
  transition: all .2s;
  border-radius: var(--radius-md);
  position: relative;
}
.funnel-stage:hover { transform: scale(1.02); box-shadow: var(--shadow-md); }
.funnel-stage .stage-name { font-size: 14px; font-weight: 500; color: #fff; }
.funnel-stage .stage-value { font-size: 16px; font-weight: 700; color: #fff; }
.funnel-stage .stage-rate { font-size: 12px; color: rgba(255,255,255,0.8); margin-left: 8px; }
.funnel-arrow { color: var(--ink-muted); margin-bottom: 4px; font-size: 14px; }

/* Progress Bar */
.progress-bar { height: 6px; background: var(--border-light); border-radius: 3px; overflow: hidden; }
.progress-bar .progress-fill { height: 100%; border-radius: 3px; transition: width .3s; }

/* Code Block */
.code-block {
  background: #1D2129;
  border-radius: var(--radius-md);
  padding: 16px;
  font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  font-size: 12px;
  color: #C9CDD4;
  line-height: 1.6;
  overflow-x: auto;
  position: relative;
}
.code-block .copy-btn {
  position: absolute; top: 8px; right: 8px;
  padding: 2px 10px; font-size: 12px;
  background: rgba(255,255,255,0.1); color: #fff;
  border-radius: var(--radius-sm); cursor: pointer;
  transition: background .2s;
}
.code-block .copy-btn:hover { background: rgba(255,255,255,0.2); }
.code-block .line-num { color: #4E5969; margin-right: 12px; user-select: none; }

/* Avatar */
.avatar-sm { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
.avatar-md { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
.avatar-blue { background: var(--primary-light); color: var(--primary); }
.avatar-green { background: var(--success-light); color: var(--success); }
.avatar-orange { background: var(--warning-light); color: var(--warning); }
.avatar-purple { background: var(--purple-light); color: var(--purple); }
.avatar-gray { background: var(--border-light); color: var(--ink-muted); }

/* Timeline */
.timeline { padding-left: 8px; }
.timeline-item { position: relative; padding-bottom: 16px; padding-left: 20px; border-left: 2px solid var(--border-light); }
.timeline-item:last-child { border-left-color: transparent; }
.timeline-item::before {
  content: ''; position: absolute; left: -5px; top: 4px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--primary);
}
.timeline-item .timeline-time { font-size: 12px; color: var(--ink-muted); }
.timeline-item .timeline-content { font-size: 13px; color: var(--ink); margin-top: 2px; }

/* Empty State */
.empty-state { text-align: center; padding: 40px 20px; color: var(--ink-muted); }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 8px; }

/* Masked data */
.masked { font-family: monospace; letter-spacing: 1px; }

/* Dropdown Menu */
.dropdown { position: relative; display: inline-block; }
.dropdown-menu {
  position: absolute; top: 100%; right: 0;
  background: var(--bg-white);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  padding: 4px 0;
  min-width: 160px;
  z-index: 100;
  display: none;
}
.dropdown-menu.show { display: block; }
.dropdown-menu .menu-item {
  padding: 8px 16px; font-size: 13px; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  transition: background .2s;
}
.dropdown-menu .menu-item:hover { background: var(--bg-hover); }
.dropdown-menu .menu-item.danger { color: var(--danger); }
.dropdown-menu .menu-divider { height: 1px; background: var(--border-light); margin: 4px 0; }

/* Tooltip */
.tooltip { position: relative; }
.tooltip:hover::after {
  content: attr(data-tip);
  position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.8); color: #fff;
  padding: 4px 8px; border-radius: var(--radius-sm);
  font-size: 12px; white-space: nowrap;
  margin-bottom: 4px; z-index: 10;
}

/* Checkbox */
.checkbox { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.checkbox input[type="checkbox"] {
  width: 14px; height: 14px;
  accent-color: var(--primary);
  cursor: pointer;
}

/* Radio */
.radio { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.radio input[type="radio"] {
  width: 14px; height: 14px;
  accent-color: var(--primary);
  cursor: pointer;
}

/* Responsive */
@media (max-width: 1200px) {
  .grid-4 { grid-template-columns: repeat(2,1fr); }
  .grid-5 { grid-template-columns: repeat(3,1fr); }
}
@media (max-width: 768px) {
  .grid-2, .grid-3, .grid-4, .grid-5 { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .chat-layout { flex-direction: column; }
  .chat-sidebar { width: 100%; }
}
</style>
