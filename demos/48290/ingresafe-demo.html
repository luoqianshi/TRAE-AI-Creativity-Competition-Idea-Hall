<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IngreSafe 成分安全扫描通 · 交互 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF0EA;
    --surface: #FFFFFF;
    --surface-soft: #F5F7F1;
    --line: #D7DBCD;
    --line-strong: #B8BEAE;
    --ink: #1B231F;
    --ink-soft: #5B645C;
    --ink-faint: #8C9388;
    --safe: #2F6F4E;
    --safe-bg: #E3F0E8;
    --caution: #A86A14;
    --caution-bg: #FBEEDA;
    --danger: #AE3326;
    --danger-bg: #F8E2DE;
    --accent: #1E8C84;
    --accent-soft: #DDEFEC;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
    --radius-card: 14px;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button{ font-family: inherit; cursor: pointer; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- shell ---------- */
  .app{ max-width: 1080px; margin: 0 auto; padding: 28px 22px 60px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap: 16px; padding-bottom: 18px; margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:34px; height:34px; border-radius:50%;
    background: var(--ink);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{ width:18px; height:18px; }
  .brand-name{
    font-family: var(--font-display); font-weight:700; font-size: 19px;
    letter-spacing: 0.2px;
  }
  .brand-sub{
    font-size: 12px; color: var(--ink-soft);
    display:block; margin-top:1px; font-weight:500;
  }
  .settings-toggle{
    background: var(--surface); border:1px solid var(--line-strong);
    border-radius: 999px; padding: 9px 14px 9px 12px;
    display:flex; align-items:center; gap:8px;
    font-size: 13.5px; font-weight:600; color: var(--ink);
    transition: border-color .15s ease, background .15s ease;
  }
  .settings-toggle:hover{ border-color: var(--accent); }
  .settings-toggle svg{ width:16px; height:16px; flex-shrink:0; }
  .settings-count{
    background: var(--accent); color:#fff; font-family: var(--font-mono);
    font-size: 11px; min-width: 18px; height:18px; border-radius: 999px;
    display:inline-flex; align-items:center; justify-content:center; padding: 0 5px;
  }
  .settings-count[data-zero="true"]{ background: var(--ink-faint); }

  .disclaimer{
    font-size: 12.5px; color: var(--ink-soft);
    background: var(--surface-soft); border:1px dashed var(--line-strong);
    border-radius: 10px; padding: 9px 14px; margin-bottom: 26px;
  }
  .disclaimer b{ color: var(--ink); }

  /* ---------- layout ---------- */
  .layout{ display:grid; grid-template-columns: 320px 1fr; gap: 26px; align-items:start; }
  @media (max-width: 860px){
    .layout{ grid-template-columns: 1fr; }
  }

  .section-label{
    font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em;
    color: var(--ink-faint); text-transform: uppercase; margin: 0 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .section-label::after{ content:""; flex:1; height:1px; background: var(--line); }

  /* ---------- package picker ---------- */
  .package-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px){ .package-grid{ grid-template-columns: 1fr; } }

  .pkg-card{
    background: var(--surface); border:1px solid var(--line);
    border-radius: var(--radius-card); padding: 0; text-align:left;
    overflow:hidden; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    display:flex; flex-direction:column;
  }
  .pkg-card:hover{ transform: translateY(-2px); box-shadow: 0 8px 18px -10px rgba(20,26,20,0.25); border-color: var(--line-strong); }
  .pkg-card.is-active{ border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft) inset; }
  .pkg-swatch{
    height: 64px; position:relative; display:flex; align-items:flex-end; padding: 8px 10px;
  }
  .pkg-swatch .scan-badge{
    position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:50%;
    background: rgba(255,255,255,0.85); display:flex; align-items:center; justify-content:center;
  }
  .pkg-swatch .scan-badge svg{ width:13px; height:13px; }
  .pkg-label-window{
    background: rgba(255,255,255,0.9); border-radius:5px; font-family: var(--font-mono);
    font-size: 9.5px; color: var(--ink-soft); padding: 3px 6px; line-height:1.3;
    max-width: 100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  }
  .pkg-body{ padding: 10px 12px 12px; }
  .pkg-name{ font-weight:600; font-size: 14px; margin:0 0 2px; }
  .pkg-tag{ font-size: 11.5px; color: var(--ink-soft); margin:0; }

  /* ---------- scan stage ---------- */
  .scan-stage{
    background: var(--surface-soft); border:1px solid var(--line);
    border-radius: 18px; min-height: 480px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 28px; position:relative;
  }

  .stage-idle{ text-align:center; max-width: 320px; color: var(--ink-soft); }
  .stage-idle svg{ width:46px; height:46px; margin-bottom: 14px; color: var(--ink-faint); }
  .stage-idle h3{ font-family: var(--font-display); font-size:17px; margin: 0 0 6px; color: var(--ink); }
  .stage-idle p{ font-size: 13.5px; margin:0; }

  /* scanning state */
  .stage-scanning{ width:100%; max-width: 360px; text-align:center; }
  .scan-frame{
    position:relative; height: 160px; border-radius: 12px; overflow:hidden;
    margin-bottom: 22px; border:1px solid var(--line-strong);
  }
  .scan-frame .label-text{
    position:absolute; inset:0; padding: 14px; font-family: var(--font-mono); font-size:10.5px;
    line-height:1.6; color: rgba(0,0,0,0.45); background: rgba(255,255,255,0.5);
  }
  .scan-beam{
    position:absolute; left:0; right:0; height: 34%;
    background: linear-gradient(180deg, transparent, rgba(30,140,132,0.35), transparent);
    animation: beamSweep 1.5s ease-in-out infinite;
  }
  @keyframes beamSweep{
    0%{ top: -34%; }
    100%{ top: 100%; }
  }
  .scan-steps{ display:flex; flex-direction:column; gap:8px; text-align:left; }
  .scan-step{
    display:flex; align-items:center; gap:9px; font-size: 13px; color: var(--ink-faint);
    transition: color .2s ease;
  }
  .scan-step .dot{
    width:7px; height:7px; border-radius:50%; background: var(--line-strong); flex-shrink:0;
    transition: background .2s ease;
  }
  .scan-step.is-active{ color: var(--ink); font-weight:600; }
  .scan-step.is-active .dot{ background: var(--accent); }
  .scan-step.is-done{ color: var(--ink-soft); }
  .scan-step.is-done .dot{ background: var(--safe); }

  @media (prefers-reduced-motion: reduce){
    .scan-beam{ animation: none; opacity: 0.5; }
  }

  /* ---------- receipt / report ---------- */
  .receipt-wrap{ width:100%; display:flex; flex-direction:column; align-items:center; }
  .receipt{
    background: var(--surface); width: 100%; max-width: 420px;
    border-radius: 4px; box-shadow: 0 14px 30px -16px rgba(20,26,20,0.35);
    position:relative;
  }
  .receipt-holes{
    height: 12px;
    background-image: radial-gradient(circle, var(--bg) 3.2px, transparent 3.4px);
    background-size: 18px 12px; background-repeat: repeat-x; background-position: top center;
  }
  .receipt-inner{ padding: 4px 22px 18px; }
  .receipt-head{ text-align:center; padding: 8px 0 14px; border-bottom: 1px dashed var(--line-strong); }
  .receipt-head .eyebrow{
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; color: var(--ink-faint);
    text-transform: uppercase; margin:0 0 4px;
  }
  .receipt-head h3{ font-family: var(--font-display); font-size: 17px; margin: 0 0 8px; }
  .score-badge{
    display:inline-flex; align-items:center; gap:10px; padding: 6px 14px;
    border-radius: 999px; font-family: var(--font-mono);
  }
  .score-badge .num{ font-size: 22px; font-weight:600; line-height:1; }
  .score-badge .label{ font-size: 11.5px; font-family: var(--font-body); font-weight:600; }
  .score-badge.safe{ background: var(--safe-bg); color: var(--safe); }
  .score-badge.caution{ background: var(--caution-bg); color: var(--caution); }
  .score-badge.danger{ background: var(--danger-bg); color: var(--danger); }

  .ingredient-list{ padding: 12px 0 6px; }
  .ingredient-row{
    width:100%; text-align:left; background:none; border:none; padding: 8px 2px;
    display:flex; align-items:flex-start; gap:10px; border-bottom: 1px solid var(--surface-soft);
  }
  .ingredient-row:hover{ background: var(--surface-soft); }
  .ing-dot{ width:9px; height:9px; border-radius:50%; margin-top: 5px; flex-shrink:0; }
  .ing-dot.info{ background: var(--ink-faint); }
  .ing-dot.caution{ background: var(--caution); }
  .ing-dot.danger{ background: var(--danger); }
  .ing-main{ flex:1; min-width:0; }
  .ing-name-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .ing-name{ font-size: 13.5px; font-weight:600; }
  .ing-flag-tag{
    font-size: 10px; font-family: var(--font-mono); padding: 2px 6px; border-radius:4px;
    background: var(--danger-bg); color: var(--danger); white-space:nowrap; flex-shrink:0;
  }
  .ing-note{ font-size: 12px; color: var(--ink-soft); margin-top:3px; line-height:1.45; }
  .ing-chevron{ font-family: var(--font-mono); font-size:11px; color: var(--ink-faint); margin-top:2px; flex-shrink:0; }

  .personal-summary{
    margin: 10px 0 0; padding: 11px 13px; border-radius: 8px;
    background: var(--accent-soft); font-size: 12.5px; color: var(--ink);
    display:flex; gap:8px; align-items:flex-start;
  }
  .personal-summary svg{ width:15px; height:15px; flex-shrink:0; margin-top:1px; color: var(--accent); }

  .alt-card{
    margin-top: 14px; padding: 12px 13px; border-radius: 8px;
    border:1px solid var(--line); background: var(--surface-soft);
  }
  .alt-card .alt-eyebrow{
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em;
    color: var(--ink-faint); text-transform: uppercase; margin:0 0 4px;
  }
  .alt-card p{ margin:0; font-size: 13px; }

  .receipt-zigzag{
    height: 14px;
    background-image:
      linear-gradient(135deg, var(--bg) 50%, transparent 50%),
      linear-gradient(45deg, transparent 50%, var(--bg) 50%);
    background-size: 16px 16px; background-position: top left, top left;
    background-repeat: repeat-x;
  }

  .rescan-btn{
    margin-top: 18px; align-self:center;
    background: var(--ink); color: #fff; border:none; border-radius: 999px;
    padding: 10px 20px; font-size: 13.5px; font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  .rescan-btn svg{ width:14px; height:14px; }
  .rescan-btn:hover{ background: #2C362F; }

  /* ---------- drawer ---------- */
  .drawer-backdrop{
    position:fixed; inset:0; background: rgba(20,26,20,0.32);
    opacity:0; pointer-events:none; transition: opacity .2s ease; z-index: 30;
  }
  .drawer-backdrop.open{ opacity:1; pointer-events:auto; }

  .settings-drawer{
    position:fixed; top:0; right:0; height:100%; width: 340px; max-width: 88vw;
    background: var(--surface); z-index: 31; box-shadow: -16px 0 30px -20px rgba(20,26,20,0.4);
    transform: translateX(100%); transition: transform .25s ease;
    display:flex; flex-direction:column; padding: 22px 22px 24px;
  }
  .settings-drawer.open{ transform: translateX(0); }
  .drawer-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom: 6px; }
  .drawer-head h3{ font-family: var(--font-display); font-size: 17px; margin:0; }
  .drawer-head button{
    background:none; border:none; font-size: 20px; color: var(--ink-soft); line-height:1; padding: 2px 4px;
  }
  .drawer-hint{ font-size: 12.5px; color: var(--ink-soft); margin: 0 0 18px; }

  .chip-group-title{
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing:0.06em; text-transform:uppercase;
    color: var(--ink-faint); margin: 14px 0 8px;
  }
  .chip-group{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:1px solid var(--line-strong); background: var(--surface);
    border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight:500;
    color: var(--ink-soft); transition: all .15s ease;
  }
  .chip[aria-pressed="true"]{
    background: var(--ink); color:#fff; border-color: var(--ink);
  }

  .drawer-footer{ margin-top:auto; padding-top: 16px; border-top: 1px solid var(--line); }
  .drawer-clear{
    background:none; border:none; font-size: 12.5px; color: var(--ink-soft); text-decoration: underline;
    padding:0;
  }

  footer.page-footer{
    margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--ink-faint); text-align:center;
  }
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#EEF0EA" stroke-width="1.8"><circle cx="11" cy="11" r="6.2"/><line x1="20" y1="20" x2="15.4" y2="15.4"/></svg>
      </span>
      <div>
        <div class="brand-name">IngreSafe</div>
        <span class="brand-sub">成分安全扫描通 · 交互 Demo</span>
      </div>
    </div>
    <button class="settings-toggle" id="settingsToggle" aria-haspopup="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
      我的忌口与健康关注
      <span class="settings-count" id="settingsCount" data-zero="true">0</span>
    </button>
  </header>

  <p class="disclaimer">⚠️ <b>本页面是产品交互 Demo</b>：所有商品包装、配料数据与风险判定均为<b>模拟示例</b>，用于演示「扫描 → 成分匹配 → 个性化预警」的产品逻辑，<b>不代表真实食品安全检测结果</b>。</p>

  <main class="layout">
    <section class="picker">
      <h2 class="section-label">01 / 选择一款包装来扫描</h2>
      <div class="package-grid" id="packageGrid"></div>
    </section>

    <section class="scan-stage" id="scanStage" aria-live="polite"></section>
  </main>

  <footer class="page-footer">IngreSafe Demo · 用于验证「拍照识别 + 成分风险匹配 + 个性化预警」的核心交互体验，非最终上线产品。</footer>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="settings-drawer" id="settingsDrawer" aria-label="忌口与健康关注设置">
  <div class="drawer-head">
    <h3>我的忌口 & 健康关注</h3>
    <button id="closeDrawer" aria-label="关闭设置面板">×</button>
  </div>
  <p class="drawer-hint">勾选后，检测报告会优先用「命中你的设置」标红提示对应成分，即使该成分原本风险等级较低。</p>
  <div class="chip-group-title">过敏原 / 饮食偏好</div>
  <div class="chip-group" id="chipsAllergen"></div>
  <div class="chip-group-title">添加剂关注项</div>
  <div class="chip-group" id="chipsAdditive"></div>
  <div class="chip-group-title">健康模式</div>
  <div class="chip-group" id="chipsMode"></div>
  <div class="drawer-footer">
    <button class="drawer-clear" id="clearChips">清空全部设置</button>
  </div>
</aside>

<script>
(function(){

  /* ---------------- data ---------------- */

  const TAGS = {
    allergen: [
      { id:'gluten', label:'麸质/谷蛋白' },
      { id:'dairy', label:'乳制品' },
      { id:'nut', label:'坚果/花生' },
    ],
    additive: [
      { id:'sweetener', label:'人工甜味剂' },
      { id:'color', label:'人工色素' },
      { id:'preservative', label:'防腐剂' },
      { id:'transfat', label:'反式脂肪' },
      { id:'msg', label:'味精/谷氨酸钠' },
      { id:'nitrite', label:'亚硝酸盐' },
    ],
    mode: [
      { id:'sugar', label:'控糖模式（关注添加糖）' },
      { id:'sodium', label:'控钠模式（关注高钠）' },
    ],
  };
  const TAG_LABEL = {};
  Object.values(TAGS).flat().forEach(t => TAG_LABEL[t.id] = t.label);

  const products = [
    {
      id:'bar', name:'鲜趣谷物能量棒', tagline:'谷物 / 能量棒', hue:'#D98A3D',
      labelPreview:'配料：燕麦、白砂糖、棕榈油、麦芽糖浆、全脂奶粉、巴旦木碎...',
      alt:'更推荐配料更简单的「无添加蔓越莓燕麦能量棒」——不含麦芽糖浆与焦糖色，糖分主要来自果干本身。',
      ingredients:[
        { name:'燕麦', level:'info', tags:[], note:'谷物基础原料，无特殊风险标注。' },
        { name:'白砂糖', level:'caution', tags:['sugar'], note:'添加糖来源之一，长期高摄入与肥胖、龋齿等风险相关。' },
        { name:'棕榈油', level:'caution', tags:[], note:'饱和脂肪含量较高，建议控制整体摄入频次。' },
        { name:'麦芽糖浆', level:'caution', tags:['sugar'], note:'属于添加糖，常用于增加甜度与黏稠口感。' },
        { name:'全脂奶粉', level:'info', tags:['dairy'], note:'含乳成分，乳糖不耐受人群需留意。' },
        { name:'巴旦木碎', level:'info', tags:['nut'], note:'坚果类原料，坚果过敏人群需重点关注。' },
        { name:'食用香精', level:'caution', tags:[], note:'人工调香成分，安全用量内合规，部分人群偏好天然风味替代。' },
        { name:'山梨酸钾', level:'caution', tags:['preservative'], note:'常见防腐剂，国标限量内使用，部分用户主动规避防腐剂。' },
        { name:'焦糖色', level:'caution', tags:['color'], note:'食用色素，用于改善外观色泽。' },
      ],
    },
    {
      id:'drink', name:'悠然乳酸菌风味饮品', tagline:'乳酸菌 / 风味饮料', hue:'#7FA68A',
      labelPreview:'配料：水、白砂糖、脱脂乳粉、阿斯巴甘、安赛蜜、柠檬黄...',
      alt:'更推荐「无糖原味发酵乳」——不含人工甜味剂与人工色素，甜味来自发酵本身的天然乳糖与有机酸平衡。',
      ingredients:[
        { name:'水', level:'info', tags:[], note:'基础原料。' },
        { name:'白砂糖', level:'caution', tags:['sugar'], note:'添加糖来源，建议关注每日总摄入量。' },
        { name:'脱脂乳粉', level:'info', tags:['dairy'], note:'含乳成分。' },
        { name:'阿斯巴甘', level:'danger', tags:['sweetener'], note:'人工甜味剂，部分人群（如苯丙酮尿症患者）需严格规避，孕期及儿童建议谨慎摄入。' },
        { name:'安赛蜜', level:'danger', tags:['sweetener'], note:'人工甜味剂，与其他甜味剂叠加使用时，长期摄入影响仍在持续研究中。' },
        { name:'柠檬黄', level:'danger', tags:['color'], note:'人工合成色素，部分人群（尤其儿童）报告与行为敏感性相关，存在争议。' },
        { name:'山梨酸钾', level:'caution', tags:['preservative'], note:'常见防腐剂，合规使用范围内。' },
        { name:'乳酸菌发酵物', level:'info', tags:['dairy'], note:'发酵风味来源。' },
      ],
    },
    {
      id:'noodle', name:'麦香红烧牛肉方便面', tagline:'方便面 / 速食', hue:'#C2654D',
      labelPreview:'配料：小麦粉、棕榈油、食用盐、谷氨酸钠、亚硝酸钠、防腐剂TBHQ...',
      alt:'更推荐「非油炸荞麦方便面」——钠含量更低，且不含亚硝酸盐与TBHQ类合成抗氧化剂。',
      ingredients:[
        { name:'小麦粉', level:'info', tags:['gluten'], note:'含麸质，乳糜泻或麸质敏感人群需规避。' },
        { name:'棕榈油', level:'caution', tags:[], note:'饱和脂肪含量较高。' },
        { name:'食用盐', level:'caution', tags:['sodium'], note:'方便面调味包钠含量普遍偏高，高血压/控钠人群需重点关注。' },
        { name:'谷氨酸钠（味精）', level:'caution', tags:['msg'], note:'增味剂，国标限量内安全，部分人群报告敏感反应（如头痛、口渴）。' },
        { name:'呈味核苷酸二钠', level:'info', tags:[], note:'增味剂，常与味精复配使用。' },
        { name:'焦糖色', level:'caution', tags:['color'], note:'用于改善汤底色泽的食用色素。' },
        { name:'亚硝酸钠', level:'danger', tags:['nitrite'], note:'在合规限量内可使用，但长期过量摄入与亚硝胺类物质形成风险相关，孕期人群建议谨慎。' },
        { name:'脱水蔬菜', level:'info', tags:[], note:'调味配料，无特殊风险标注。' },
        { name:'TBHQ（防腐剂）', level:'danger', tags:['preservative'], note:'合成抗氧化剂，部分研究提示高剂量摄入存在潜在健康争议，国标限量内使用。' },
        { name:'食用香精', level:'caution', tags:[], note:'人工调香成分。' },
      ],
    },
    {
      id:'cheese', name:'萌芽儿童奶酪棒', tagline:'儿童零食 / 奶酪制品', hue:'#5B8FB0',
      labelPreview:'配料：全脂牛奶、干酪、食用盐、山梨酸钾、β-胡萝卜素...',
      alt:'更推荐「低钠儿童原制奶酪片」——钠含量降低约三成，且不添加额外着色剂。',
      ingredients:[
        { name:'全脂牛奶', level:'info', tags:['dairy'], note:'乳基础原料，乳糖不耐受人群需留意。' },
        { name:'干酪', level:'info', tags:['dairy'], note:'发酵乳制品，营养密度较高。' },
        { name:'食用盐', level:'info', tags:['sodium'], note:'奶酪制品天然含钠量较高，需结合每日总摄入评估。' },
        { name:'山梨酸钾', level:'caution', tags:['preservative'], note:'常见防腐剂，合规使用范围内。' },
        { name:'卡拉胶', level:'info', tags:[], note:'增稠剂，常用于改善质地。' },
        { name:'β-胡萝卜素（着色剂）', level:'info', tags:['color'], note:'天然来源色素，相比合成色素安全性争议较小。' },
        { name:'白砂糖', level:'caution', tags:['sugar'], note:'部分儿童奶酪制品中加糖以提升风味，建议关注总糖摄入。' },
        { name:'食用香精', level:'caution', tags:[], note:'人工调香成分。' },
      ],
    },
  ];

  /* ---------------- icons ---------------- */
  const ICON = {
    scan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8V5a1 1 0 011-1h3M4 16v3a1 1 0 001 1h3M20 8V5a1 1 0 00-1-1h-3M20 16v3a1 1 0 01-1 1h-3M3 12h18" stroke-dasharray="2 3"/></svg>',
    upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>',
    flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 21V4h13l-3 4 3 4H5"/></svg>',
    retry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 4v6h6M20 20v-6h-6"/><path d="M5 14a8 8 0 0014 4M19 10A8 8 0 005 6"/></svg>',
  };

  /* ---------------- state ---------------- */
  const enabledTags = new Set();
  let currentProductId = null;
  let scanTimer = null;

  /* ---------------- render: package grid ---------------- */
  const grid = document.getElementById('packageGrid');
  function renderGrid(){
    grid.innerHTML = products.map(p => `
      <button class="pkg-card ${p.id===currentProductId ? 'is-active':''}" data-id="${p.id}" aria-pressed="${p.id===currentProductId}">
        <div class="pkg-swatch" style="background:${p.hue}1A;">
          <span class="scan-badge" style="color:${p.hue}">${ICON.scan}</span>
          <span class="pkg-label-window">${p.labelPreview}</span>
        </div>
        <div class="pkg-body">
          <p class="pkg-name">${p.name}</p>
          <p class="pkg-tag">${p.tagline}</p>
        </div>
      </button>
    `).join('');
    grid.querySelectorAll('.pkg-card').forEach(btn => {
      btn.addEventListener('click', () => startScan(btn.dataset.id));
    });
  }
  renderGrid();

  /* ---------------- scan stage ---------------- */
  const stage = document.getElementById('scanStage');

  function renderIdle(){
    stage.innerHTML = `
      <div class="stage-idle">
        ${ICON.upload.replace('1.7','1.4')}
        <h3>等待扫描</h3>
        <p>点击左侧任意一款商品包装，模拟「拍照 / 上传配料表」并开始识别。</p>
      </div>`;
  }
  renderIdle();

  function startScan(id){
    currentProductId = id;
    renderGrid();
    clearTimeout(scanTimer);
    const product = products.find(p => p.id === id);

    stage.innerHTML = `
      <div class="stage-scanning">
        <div class="scan-frame" style="background:${product.hue}14;">
          <div class="label-text">${product.labelPreview}</div>
          <div class="scan-beam"></div>
        </div>
        <div class="scan-steps">
          <div class="scan-step" data-step="0"><span class="dot"></span>OCR 识别配料表文字</div>
          <div class="scan-step" data-step="1"><span class="dot"></span>拆解配料并匹配风险数据库</div>
          <div class="scan-step" data-step="2"><span class="dot"></span>结合你的忌口与健康设置生成报告</div>
        </div>
      </div>`;

    const steps = stage.querySelectorAll('.scan-step');
    let i = 0;
    function activateStep(){
      steps.forEach((s, idx) => {
        s.classList.toggle('is-active', idx === i);
        s.classList.toggle('is-done', idx < i);
      });
      i++;
      if(i <= steps.length){
        scanTimer = setTimeout(activateStep, 480);
      } else {
        scanTimer = setTimeout(() => renderReport(product), 260);
      }
    }
    activateStep();
  }

  /* ---------------- scoring ---------------- */
  function evaluate(product){
    let score = 100;
    const rows = product.ingredients.map(ing => {
      const flagged = ing.tags.some(t => enabledTags.has(t));
      let level = ing.level;
      if(flagged && level === 'info') level = 'caution';
      if(flagged) level = level === 'danger' ? 'danger' : 'danger'; // flagged items always escalate to danger
      const deduction = ing.level === 'caution' ? 4 : ing.level === 'danger' ? 10 : 0;
      score -= deduction;
      if(flagged) score -= 8;
      return { ...ing, displayLevel: flagged ? 'danger' : ing.level, flagged };
    });
    score = Math.max(0, Math.min(100, score));
    let band = 'safe', bandLabel = '配料整体表现良好';
    if(score < 60){ band = 'danger'; bandLabel = '建议谨慎选择'; }
    else if(score < 80){ band = 'caution'; bandLabel = '部分成分请留意'; }
    const flaggedCount = rows.filter(r => r.flagged).length;
    return { rows, score, band, bandLabel, flaggedCount };
  }

  const LEVEL_TEXT = { info:'安全', caution:'谨慎关注', danger:'建议规避' };

  function renderReport(product){
    const { rows, score, band, bandLabel, flaggedCount } = evaluate(product);

    const rowsHtml = rows.map((r, idx) => `
      <button class="ingredient-row" data-idx="${idx}" aria-expanded="false">
        <span class="ing-dot ${r.displayLevel}"></span>
        <span class="ing-main">
          <span class="ing-name-row">
            <span class="ing-name">${r.name}</span>
            ${r.flagged ? `<span class="ing-flag-tag">⚠ 命中设置</span>` : `<span class="ing-flag-tag" style="background:transparent;color:var(--ink-faint)">${LEVEL_TEXT[r.displayLevel]}</span>`}
          </span>
          <span class="ing-note" hidden>${r.note}</span>
        </span>
        <span class="ing-chevron">详情</span>
      </button>
    `).join('');

    const summaryHtml = flaggedCount > 0
      ? `<div class="personal-summary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg>
          <span>根据你的忌口/健康设置，检测到 <b>${flaggedCount}</b> 项成分需要重点关注，已在下方标红提示。</span>
        </div>`
      : `<div class="personal-summary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6L9 17l-5-5"/></svg>
          <span>未检测到命中你当前忌口/健康设置的成分。可点击右上角「我的忌口与健康关注」调整设置后实时重新评估。</span>
        </div>`;

    stage.innerHTML = `
      <div class="receipt-wrap">
        <div class="receipt">
          <div class="receipt-holes"></div>
          <div class="receipt-inner">
            <div class="receipt-head">
              <p class="eyebrow">检测报告 · 模拟示例</p>
              <h3>${product.name}</h3>
              <span class="score-badge ${band}">
                <span class="num">${score}</span>
                <span class="label">${bandLabel}</span>
              </span>
            </div>
            <div class="ingredient-list">${rowsHtml}</div>
            ${summaryHtml}
            <div class="alt-card">
              <p class="alt-eyebrow">更优替代建议</p>
              <p>${product.alt}</p>
            </div>
          </div>
          <div class="receipt-zigzag"></div>
        </div>
        <button class="rescan-btn" id="rescanBtn">${ICON.retry} 重新选择 / 扫描</button>
      </div>`;

    stage.querySelectorAll('.ingredient-row').forEach(btn => {
      btn.addEventListener('click', () => {
        const note = btn.querySelector('.ing-note');
        const expanded = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!expanded));
        note.hidden = expanded;
        btn.querySelector('.ing-chevron').textContent = expanded ? '详情' : '收起';
      });
    });
    document.getElementById('rescanBtn').addEventListener('click', () => {
      currentProductId = null;
      renderGrid();
      renderIdle();
    });
  }

  function rerenderIfActive(){
    if(!currentProductId) return;
    const product = products.find(p => p.id === currentProductId);
    if(stage.querySelector('.receipt')) renderReport(product);
  }

  /* ---------------- settings drawer ---------------- */
  const drawer = document.getElementById('settingsDrawer');
  const backdrop = document.getElementById('drawerBackdrop');
  const settingsCount = document.getElementById('settingsCount');

  function openDrawer(){ drawer.classList.add('open'); backdrop.classList.add('open'); }
  function closeDrawer(){ drawer.classList.remove('open'); backdrop.classList.remove('open'); }
  document.getElementById('settingsToggle').addEventListener('click', openDrawer);
  document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
  backdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDrawer(); });

  function renderChips(containerId, list){
    const el = document.getElementById(containerId);
    el.innerHTML = list.map(t => `<button class="chip" data-tag="${t.id}" aria-pressed="false">${t.label}</button>`).join('');
    el.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const tag = btn.dataset.tag;
        if(enabledTags.has(tag)){ enabledTags.delete(tag); btn.setAttribute('aria-pressed','false'); }
        else { enabledTags.add(tag); btn.setAttribute('aria-pressed','true'); }
        updateSettingsCount();
        rerenderIfActive();
      });
    });
  }
  renderChips('chipsAllergen', TAGS.allergen);
  renderChips('chipsAdditive', TAGS.additive);
  renderChips('chipsMode', TAGS.mode);

  function updateSettingsCount(){
    settingsCount.textContent = enabledTags.size;
    settingsCount.dataset.zero = enabledTags.size === 0 ? 'true' : 'false';
  }

  document.getElementById('clearChips').addEventListener('click', () => {
    enabledTags.clear();
    document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed','false'));
    updateSettingsCount();
    rerenderIfActive();
  });

})();
</script>
</body>
</html>
