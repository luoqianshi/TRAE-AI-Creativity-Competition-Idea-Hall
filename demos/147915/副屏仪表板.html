<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>副屏仪表板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, 'Microsoft YaHei', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* 左侧面板 */
    .sidebar {
      background: #161625;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      border-right: 1px solid #2a2a3a;
    }

    /* 时钟 */
    .clock-section { text-align: center; }
    .clock-time {
      font-size: 3em;
      font-weight: 300;
      letter-spacing: 2px;
      color: #fff;
    }
    .clock-date {
      font-size: 1em;
      color: #888;
      margin-top: 8px;
    }
    .clock-week {
      font-size: 0.9em;
      color: #666;
      margin-top: 4px;
    }

    /* 天气 */
    .weather-section {
      text-align: center;
      padding: 20px 0;
      border-top: 1px solid #2a2a3a;
      border-bottom: 1px solid #2a2a3a;
    }
    .weather-icon { font-size: 3em; }
    .weather-temp {
      font-size: 2.2em;
      font-weight: 300;
      margin: 8px 0;
    }
    .weather-desc { color: #aaa; font-size: 0.95em; }
    .weather-detail {
      color: #666;
      font-size: 0.85em;
      margin-top: 8px;
    }
    .weather-loading { color: #666; font-style: italic; }

    /* 小时预报 */
    .hourly-section {
      margin-top: 15px;
      text-align: left;
    }
    .hourly-title {
      font-size: 0.8em;
      color: #888;
      margin-bottom: 8px;
      text-align: center;
    }
    .hourly-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }
    .hourly-item {
      flex-shrink: 0;
      text-align: center;
      padding: 8px 10px;
      background: #1a1a2e;
      border-radius: 8px;
      min-width: 58px;
    }
    .hourly-item.now {
      background: #2a2a4a;
      border: 1px solid #5b8def;
    }
    .hourly-time {
      font-size: 0.75em;
      color: #888;
      margin-bottom: 4px;
    }
    .hourly-item.now .hourly-time {
      color: #5b8def;
      font-weight: bold;
    }
    .hourly-icon { font-size: 1.3em; }
    .hourly-temp {
      font-size: 0.85em;
      color: #ccc;
      margin-top: 4px;
    }

    /* 未来几天预报 */
    .daily-section {
      margin-top: 15px;
      text-align: left;
    }
    .daily-title {
      font-size: 0.8em;
      color: #888;
      margin-bottom: 8px;
      text-align: center;
    }
    .daily-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .daily-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #1a1a2e;
      border-radius: 8px;
    }
    .daily-day {
      font-size: 0.85em;
      color: #aaa;
      min-width: 60px;
    }
    .daily-icon { font-size: 1.2em; }
    .daily-temps {
      font-size: 0.85em;
      color: #ccc;
    }
    .daily-temp-low {
      color: #666;
    }

    /* 右侧任务区 */
    .main {
      padding: 30px 40px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 1.2em;
      font-weight: 500;
      margin-bottom: 16px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      width: 3px;
      height: 1.2em;
      background: #5b8def;
      border-radius: 2px;
    }

    /* 任务列表 */
    .todo-group { margin-bottom: 35px; }

    /* 昨日任务特殊样式 */
    .todo-group.yesterday { opacity: 0.55; }
    .todo-group.yesterday .todo-item { cursor: default; }
    .todo-group.yesterday .todo-item:hover { background: transparent; }
    .todo-group.yesterday .todo-item:not(.done) .todo-check { border-style: dashed; }

    .todo-list { list-style: none; }

    .todo-item {
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
      transition: background 0.2s;
      cursor: pointer;
    }
    .todo-item:hover { background: #1e1e30; }

    .todo-check {
      width: 20px;
      height: 20px;
      border: 2px solid #444;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .todo-item.done .todo-check {
      background: #5b8def;
      border-color: #5b8def;
    }
    .todo-item.done .todo-check::after {
      content: '✓';
      color: #fff;
      font-size: 12px;
    }

    .todo-text {
      font-size: 1em;
      transition: all 0.2s;
    }
    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: #555;
    }

    /* 空列表提示 */
    .empty-hint {
      color: #444;
      font-size: 0.9em;
      padding: 12px 16px;
      font-style: italic;
    }

    /* 添加任务 */
    .add-todo {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .add-todo input {
      flex: 1;
      background: #1e1e30;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.95em;
      outline: none;
    }
    .add-todo input:focus { border-color: #5b8def; }
    .add-todo input::placeholder { color: #555; }

    .add-todo button {
      background: #5b8def;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      color: #fff;
      font-size: 0.95em;
      cursor: pointer;
      transition: background 0.2s;
    }
    .add-todo button:hover { background: #4a7cd8; }

    /* 提示文字 */
    .hint {
      color: #444;
      font-size: 0.85em;
      margin-top: 8px;
      text-align: center;
    }

    /* 显示/隐藏已完成 切换按钮 */
    .toggle-done {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8em;
      color: #666;
      cursor: pointer;
      user-select: none;
      margin-left: auto;
      transition: color 0.2s;
    }
    .toggle-done:hover { color: #aaa; }
    .toggle-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
      transition: background 0.2s;
    }
    .toggle-done.active .toggle-dot { background: #5b8def; }

    /* 天气提醒 */
    .weather-tips {
      background: #1a1a2e;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
    }
    .weather-tip {
      font-size: 0.85em;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .weather-tip:last-child { margin-bottom: 0; }
    .weather-tip-icon { font-size: 1.1em; }

    /* 小知识卡片 */
    .tip-card {
      background: #1a1a2e;
      border-radius: 10px;
      padding: 18px 22px;
      margin-bottom: 35px;
      border-left: 3px solid #5b8def;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
      user-select: none;
    }
    .tip-card:hover { border-color: #7aa5ff; }
    .tip-card:active { transform: scale(0.99); }
    .tip-card-header {
      font-size: 0.8em;
      color: #5b8def;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .tip-card-text {
      font-size: 1em;
      color: #ccc;
      line-height: 1.6;
    }
    .tip-card-source {
      font-size: 0.75em;
      color: #555;
      margin-top: 10px;
    }
    .tip-card-hint {
      font-size: 0.7em;
      color: #444;
      text-align: right;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <!-- 左侧：时钟 + 天气 -->
  <div class="sidebar">
    <div class="clock-section">
      <div class="clock-time" id="clock">--:--:--</div>
      <div class="clock-date" id="date">----年--月--日</div>
      <div class="clock-week" id="week">星期-</div>
    </div>

    <div class="weather-section">
      <div class="weather-icon" id="weatherIcon">--</div>
      <div class="weather-temp" id="weatherTemp">--°C</div>
      <div class="weather-desc" id="weatherDesc">加载中...</div>
      <div class="weather-detail" id="weatherDetail"></div>
      <div class="weather-tips" id="weatherTips"></div>

      <!-- 小时预报 -->
      <div class="hourly-section">
        <div class="hourly-title">未来几小时</div>
        <div class="hourly-scroll" id="hourlyForecast"></div>
      </div>

      <!-- 未来几天预报 -->
      <div class="daily-section">
        <div class="daily-title">未来 3 天</div>
        <div class="daily-list" id="dailyForecast"></div>
      </div>
    </div>
  </div>

  <!-- 右侧：任务 -->
  <div class="main">
    <!-- 昨日任务 -->
    <div class="todo-group yesterday" id="yesterdayGroup">
      <div class="section-title" style="display:flex; align-items:center;">
        <span>📋 昨日任务</span>
        <span class="toggle-done" id="toggle0" onclick="toggleDone('todoList0')">
          <span class="toggle-dot"></span> 显示已完成
        </span>
      </div>
      <ul class="todo-list" id="todoList0"></ul>
    </div>

    <!-- 今日任务 -->
    <div class="todo-group">
      <div class="section-title" style="display:flex; align-items:center;">
        <span>🎯 今日任务</span>
        <span class="toggle-done" id="toggle1" onclick="toggleDone('todoList1')">
          <span class="toggle-dot"></span> 显示已完成
        </span>
      </div>
      <ul class="todo-list" id="todoList1"></ul>
      <div class="add-todo">
        <input type="text" id="newTodo1" placeholder="添加新任务...">
        <button onclick="addTodo('todoList1', 'newTodo1')">添加</button>
      </div>
    </div>

    <!-- 明日任务 -->
    <div class="todo-group">
      <div class="section-title" style="display:flex; align-items:center;">
        <span>📝 明日任务</span>
        <span class="toggle-done" id="toggle2" onclick="toggleDone('todoList2')">
          <span class="toggle-dot"></span> 显示已完成
        </span>
      </div>
      <ul class="todo-list" id="todoList2"></ul>
      <div class="add-todo">
        <input type="text" id="newTodo2" placeholder="添加新任务...">
        <button onclick="addTodo('todoList2', 'newTodo2')">添加</button>
      </div>
    </div>

    <!-- 本周目标 -->
    <div class="todo-group">
      <div class="section-title" style="display:flex; align-items:center;">
        <span>🏆 本周目标</span>
        <span class="toggle-done" id="toggle3" onclick="toggleDone('todoList3')">
          <span class="toggle-dot"></span> 显示已完成
        </span>
      </div>
      <ul class="todo-list" id="todoList3"></ul>
      <div class="add-todo">
        <input type="text" id="newTodo3" placeholder="添加本周目标...">
        <button onclick="addTodo('todoList3', 'newTodo3')">添加</button>
      </div>
    </div>

    <!-- 小知识卡片 -->
    <div class="tip-card" id="tipCard" onclick="nextTip()">
      <div class="tip-card-header" id="tipHeader">💡 每日小知识</div>
      <div class="tip-card-text" id="tipText">加载中...</div>
      <div class="tip-card-source" id="tipSource"></div>
      <div class="tip-card-hint">点击切换下一条</div>
    </div>

    <div class="hint">点击任务标记完成 | 已完成任务自动隐藏 | 每天自动滚动任务</div>
  </div>

  <script>
    // ========== 时钟 ==========
    const weeks = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        now.toLocaleTimeString('zh-CN', { hour12: false });
      document.getElementById('date').textContent =
        `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
      document.getElementById('week').textContent = weeks[now.getDay()];
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ========== 天气 (Open-Meteo API, 免费无需Key) ==========
    const WMO_ICONS = {
      0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
      45: '🌫️', 48: '🌫️',
      51: '🌦️', 53: '🌧️', 55: '🌧️',
      61: '🌧️', 63: '🌧️', 65: '🌧️',
      71: '❄️', 73: '❄️', 75: '❄️',
      77: '❄️', 80: '🌦️', 81: '🌧️', 82: '⛈️',
      85: '❄️', 86: '❄️', 95: '⛈️', 96: '⛈️', 99: '⛈️'
    };

    const WMO_DESC = {
      0: '晴', 1: '大部晴', 2: '多云', 3: '阴天',
      45: '雾', 48: '雾凇',
      51: '小毛雨', 53: '毛雨', 55: '大毛雨',
      61: '小雨', 63: '中雨', 65: '大雨',
      71: '小雪', 73: '中雪', 75: '大雪',
      77: '雪粒', 80: '阵雨', 81: '中阵雨', 82: '大阵雨',
      85: '阵雪', 86: '大阵雪', 95: '雷暴', 96: '雷暴+冰雹', 99: '强雷暴'
    };

    const WEEKDAYS_SHORT = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

    // 天气提醒规则
    function getWeatherTips(code, temp) {
      const tips = [];
      // 下雨相关
      if ([51,53,55,61,63,65,80,81,82].includes(code)) {
        tips.push({ icon: '☂️', text: '记得带伞，今天有雨' });
      }
      // 雷暴
      if ([95,96,99].includes(code)) {
        tips.push({ icon: '⚡', text: '雷暴天气，尽量减少外出' });
      }
      // 高温
      if (temp >= 35) {
        tips.push({ icon: '🥵', text: '高温天气，注意防暑降温' });
        tips.push({ icon: '💧', text: '多喝水，保持水分' });
      } else if (temp >= 30) {
        tips.push({ icon: '☀️', text: '天气较热，注意防晒' });
      }
      // 低温
      if (temp <= 0) {
        tips.push({ icon: '🥶', text: '寒冷天气，注意保暖' });
      } else if (temp <= 5) {
        tips.push({ icon: '🧣', text: '天气较冷，出门加件衣服' });
      }
      // 雾
      if ([45,48].includes(code)) {
        tips.push({ icon: '🚗', text: '大雾天气，注意交通安全' });
      }
      // 默认：天气不错
      if (tips.length === 0) {
        tips.push({ icon: '🌿', text: '天气不错，适合外出走走' });
      }
      return tips;
    }

    async function fetchWeather() {
      try {
        const res = await fetch(
          'https://api.open-meteo.com/v1/forecast?latitude=30.496&longitude=114.345&current_weather=true&hourly=temperature_2m,weathercode&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Asia%2FShanghai&forecast_days=4'
        );
        const data = await res.json();
        const cur = data.current_weather;

        // 当前天气
        document.getElementById('weatherIcon').textContent = WMO_ICONS[cur.weathercode] || '🌡️';
        document.getElementById('weatherTemp').textContent = `${cur.temperature}°C`;
        document.getElementById('weatherDesc').textContent = WMO_DESC[cur.weathercode] || '';
        document.getElementById('weatherDetail').textContent =
          `最高 ${data.daily.temperature_2m_max[0]}°C / 最低 ${data.daily.temperature_2m_min[0]}°C`;

        // 天气提醒
        const tips = getWeatherTips(cur.weathercode, cur.temperature);
        const tipsEl = document.getElementById('weatherTips');
        tipsEl.innerHTML = tips.map(t =>
          `<div class="weather-tip"><span class="weather-tip-icon">${t.icon}</span><span>${t.text}</span></div>`
        ).join('');

        // 小时预报（当前时间之后的 8 小时）
        renderHourlyForecast(data);

        // 未来几天预报（跳过今天，显示未来 3 天）
        renderDailyForecast(data);

      } catch (e) {
        document.getElementById('weatherDesc').textContent = '天气获取失败';
      }
    }

    function renderHourlyForecast(data) {
      const container = document.getElementById('hourlyForecast');
      const now = new Date();
      const currentHour = now.getHours();

      // 找到当前小时在数组中的位置
      let startIndex = 0;
      for (let i = 0; i < data.hourly.time.length; i++) {
        const hourTime = new Date(data.hourly.time[i]);
        if (hourTime.getHours() >= currentHour && hourTime.getDate() === now.getDate()) {
          startIndex = i;
          break;
        }
      }

      // 取未来 8 小时
      const hours = [];
      for (let i = startIndex; i < Math.min(startIndex + 8, data.hourly.time.length); i++) {
        const time = new Date(data.hourly.time[i]);
        const temp = data.hourly.temperature_2m[i];
        const code = data.hourly.weathercode[i];
        const isNow = i === startIndex;
        hours.push({ time, temp, code, isNow });
      }

      container.innerHTML = hours.map(h => {
        const timeStr = h.isNow ? '现在' : `${h.time.getHours()}时`;
        const icon = WMO_ICONS[h.code] || '🌡️';
        return `
          <div class="hourly-item${h.isNow ? ' now' : ''}">
            <div class="hourly-time">${timeStr}</div>
            <div class="hourly-icon">${icon}</div>
            <div class="hourly-temp">${Math.round(h.temp)}°</div>
          </div>
        `;
      }).join('');
    }

    function renderDailyForecast(data) {
      const container = document.getElementById('dailyForecast');
      const days = [];

      // 跳过今天（index 0），取未来 3 天
      for (let i = 1; i <= 3 && i < data.daily.time.length; i++) {
        const date = new Date(data.daily.time[i] + 'T00:00:00');
        const high = data.daily.temperature_2m_max[i];
        const low = data.daily.temperature_2m_min[i];
        const code = data.daily.weathercode[i];
        days.push({ date, high, low, code });
      }

      container.innerHTML = days.map(d => {
        const dayStr = WEEKDAYS_SHORT[d.date.getDay()];
        const dateStr = `${d.date.getMonth() + 1}/${d.date.getDate()}`;
        const icon = WMO_ICONS[d.code] || '🌡️';
        return `
          <div class="daily-item">
            <span class="daily-day">${dayStr} ${dateStr}</span>
            <span class="daily-icon">${icon}</span>
            <span class="daily-temps">${Math.round(d.high)}° / <span class="daily-temp-low">${Math.round(d.low)}°</span></span>
          </div>
        `;
      }).join('');
    }
    fetchWeather();
    setInterval(fetchWeather, 30 * 60 * 1000); // 30分钟刷新一次

    // ========== 待办事项 (localStorage 持久化) ==========
    const TODO_KEYS = { 0: 'todoList0', 1: 'todoList1', 2: 'todoList2', 3: 'todoList3' };
    const showDoneState = { todoList0: false, todoList1: false, todoList2: false, todoList3: false };

    function loadTodos(listId) {
      return JSON.parse(localStorage.getItem(listId) || '[]');
    }

    function saveTodos(listId, todos) {
      localStorage.setItem(listId, JSON.stringify(todos));
    }

    function toggleDone(listId) {
      showDoneState[listId] = !showDoneState[listId];
      const toggleMap = { todoList0: 'toggle0', todoList1: 'toggle1', todoList2: 'toggle2', todoList3: 'toggle3' };
      const btn = document.getElementById(toggleMap[listId]);
      btn.classList.toggle('active', showDoneState[listId]);
      renderTodos(listId);
    }

    function renderTodos(listId) {
      const list = document.getElementById(listId);
      const todos = loadTodos(listId);
      const isYesterday = listId === 'todoList0';
      list.innerHTML = '';

      const filtered = isYesterday ? todos : todos.filter(t => !t.done || showDoneState[listId]);

      if (filtered.length === 0) {
        const li = document.createElement('li');
        li.className = 'empty-hint';
        li.textContent = isYesterday ? '昨日没有任务' : '暂无任务';
        list.appendChild(li);
        return;
      }

      filtered.forEach((todo, i) => {
        const li = document.createElement('li');
        li.className = 'todo-item' + (todo.done ? ' done' : '');
        li.innerHTML = `
          <div class="todo-check"></div>
          <span class="todo-text">${todo.text}</span>
        `;
        // 昨日任务不可点击
        if (!isYesterday) {
          const realIndex = todos.indexOf(todo);
          li.onclick = () => {
            todos[realIndex].done = !todos[realIndex].done;
            saveTodos(listId, todos);
            renderTodos(listId);
          };
        }
        list.appendChild(li);
      });
    }

    function addTodo(listId, inputId) {
      const input = document.getElementById(inputId);
      const text = input.value.trim();
      if (!text) return;
      const todos = loadTodos(listId);
      todos.push({ text, done: false });
      saveTodos(listId, todos);
      input.value = '';
      renderTodos(listId);
    }

      if (e.key === 'Enter') addTodo('todoList1', 'newTodo1');

    // ========== 每日自动滚动任务 ==========

    function getLastRotateDate() {
      return localStorage.getItem(LAST_ROTATE_KEY) || '';
    }

    function saveLastRotateDate(dateStr) {
      localStorage.setItem(LAST_ROTATE_KEY, dateStr);
    }

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function rotateTasks() {
      const today = getTodayStr();
      const lastRotate = getLastRotateDate();

      if (lastRotate === today) return; // 今天已旋转过

      // 执行滚动：
      // 1. 今日 → 昨日（只保留未完成的）
      const todayTodos = loadTodos('todoList1');
      const unfinished = todayTodos.filter(t => !t.done);
      saveTodos('todoList0', unfinished);

      // 2. 明日 → 今日
      const tomorrowTodos = loadTodos('todoList2');
      saveTodos('todoList1', tomorrowTodos);

      // 3. 清空明日
      saveTodos('todoList2', []);

      saveLastRotateDate(today);
    }

    // ========== 使用次数追踪 ==========
    const TIP_USAGE_KEY = 'tipUsageStats';
    const MAX_DAILY = 5;
    const MAX_TOTAL = 50;

    function getTipUsage() {
      return JSON.parse(localStorage.getItem(TIP_USAGE_KEY) || '{}');
    }

    function saveTipUsage(usage) {
      localStorage.setItem(TIP_USAGE_KEY, JSON.stringify(usage));
    }

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    }

    // 记录一次使用
    function recordTipUsage(index) {
      const usage = getTipUsage();
      const today = getTodayKey();

      // 初始化结构
      if (!usage[today]) usage[today] = {};
      if (!usage.total) usage.total = {};

      // 增加计数
      usage[today][index] = (usage[today][index] || 0) + 1;
      usage.total[index] = (usage.total[index] || 0) + 1;

      saveTipUsage(usage);
    }

    // 清理 30 天前的旧数据
    function cleanOldTipUsage() {
      const usage = getTipUsage();
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - 30);
      const cutoffKey = `${cutoff.getFullYear()}-${cutoff.getMonth()+1}-${cutoff.getDate()}`;

      Object.keys(usage).forEach(key => {
        if (key !== 'total' && key < cutoffKey) {
          delete usage[key];
        }
      });
      saveTipUsage(usage);
    }

    // 判断某条是否达到上限
    function isTipOverLimit(index) {
      const usage = getTipUsage();
      const today = getTodayKey();
      const dailyCount = (usage[today] && usage[today][index]) || 0;
      const totalCount = (usage.total && usage.total[index]) || 0;
      return dailyCount >= MAX_DAILY || totalCount >= MAX_TOTAL;
    }

    // ========== 随机选择 & 展示 ==========
    let currentTipIndex = -1;

    function pickTip() {
      const usage = getTipUsage();
      const today = getTodayKey();

      // 筛选未超限的
      const available = TIPS.map((tip, i) => ({ tip, i }))
        .filter(({ i }) => {
          const daily = (usage[today] && usage[today][i]) || 0;
          const total = (usage.total && usage.total[i]) || 0;
          return daily < MAX_DAILY && total < MAX_TOTAL;
        });

      if (!available.length) {
        // 全部超限，重置计数后重新选择
        localStorage.removeItem(TIP_USAGE_KEY);
        return Math.floor(Math.random() * TIPS.length);
      }

      // 优先选低频的
      available.sort((a, b) => {
        const countA = ((usage.total && usage.total[a.i]) || 0);
        const countB = ((usage.total && usage.total[b.i]) || 0);
        return countA - countB;
      });

      // 从前 5 个低频的中随机选一个
      const pick = available.slice(0, Math.min(5, available.length));
      return pick[Math.floor(Math.random() * pick.length)].i;
    }

    function showTip(index) {
      const tip = TIPS[index];
      document.getElementById('tipHeader').textContent = `💡 ${tip.cat}`;
      document.getElementById('tipText').textContent = tip.text;
      document.getElementById('tipSource').textContent = `— ${tip.source}`;
    }

    function nextTip() {
      cleanOldTipUsage();

      // 避免连续重复
      let newIndex;
      do {
        newIndex = pickTip();
      } while (newIndex === currentTipIndex && TIPS.length > 1);

      currentTipIndex = newIndex;
      recordTipUsage(currentTipIndex);
      showTip(currentTipIndex);
    }

    // ========== 初始化 ==========
    cleanOldTipUsage();
    nextTip();

    // 每 4 小时自动切换
    setInterval(nextTip, 4 * 60 * 60 * 1000);

    // 每日滚动任务
    rotateTasks();

    // 初始化完成

    // 显示昨日日期
    updateYesterdayLabel();

    // 渲染所有列表
    renderTodos('todoList0');
    renderTodos('todoList1');
    renderTodos('todoList2');
    renderTodos('todoList3');
