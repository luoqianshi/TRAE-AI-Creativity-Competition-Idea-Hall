<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>九宫格 · 朋友圈草稿本</title>
<style>
  /* ============ V4 cold-minimal design tokens (mirrors DS.swift) ============ */
  :root{
    --bg:rgb(243,244,245);
    --card:#ffffff;
    --ink:rgb(26,28,30);
    --muted:rgb(131,136,141);
    --faint:rgb(180,185,190);
    --hairline:rgba(0,0,0,0.07);
    --hairline-2:rgba(0,0,0,0.05);
    --wechat:rgb(47,174,87);
    --wechat-name:rgb(89,107,140);
    --photo-shadow:rgba(26,28,30,0.10);
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB",sans-serif;
    --serif:"Songti SC","Noto Serif SC","STSong","SimSun",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    background:
      radial-gradient(1200px 600px at 50% -10%, #eef0f2, #e4e7ea 60%, #dee1e4);
    color:var(--ink);
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:28px 16px 40px;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;color:inherit;border:none;background:none;outline:none}
  ::selection{background:rgba(26,28,30,.12)}

  /* ============ Desktop framing ============ */
  .stage-head{text-align:center;margin-bottom:26px;max-width:520px}
  .stage-title{font-size:16px;font-weight:500;letter-spacing:.34em;color:var(--ink);padding-left:.34em}
  .stage-sub{font-size:12px;color:var(--muted);letter-spacing:.14em;margin-top:8px;line-height:1.7}

  /* two-column: phone prototype + feature breakdown */
  .layout{display:flex;gap:36px;align-items:flex-start;justify-content:center;width:100%;max-width:1180px}
  .device-col{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:13px;position:sticky;top:24px}
  .device-cap{font-size:11px;color:var(--muted);letter-spacing:.05em;max-width:380px;text-align:center;line-height:1.75}
  .feature-col{flex:0 1 560px;min-width:0}
  .fpanel-head{margin-bottom:20px}
  .fpanel-note{font-size:12.5px;color:var(--ink);letter-spacing:.02em;line-height:1.75;margin-top:10px;max-width:520px}
  .fpanel-note b{font-weight:600}
  .fgroup{margin-bottom:22px}
  .fgroup-h{margin-bottom:11px}
  .fcard{overflow:hidden}
  .fitem{padding:15px 17px;border-bottom:1px solid var(--hairline-2)}
  .fitem:last-child{border-bottom:none}
  .fitem-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .fitem-name{font-size:14px;font-weight:500;letter-spacing:.04em;color:var(--ink)}
  .fitem-desc{font-size:12px;color:var(--muted);letter-spacing:.02em;line-height:1.65;margin-top:5px}
  .fitem-impl{font-size:11px;color:var(--faint);letter-spacing:.02em;line-height:1.7;margin-top:9px}
  .fitem-impl b{color:var(--ink);opacity:.55;font-weight:600;margin-right:7px;letter-spacing:.1em}
  .ftags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
  .ftag{font-size:10px;letter-spacing:.04em;color:var(--muted);padding:3px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--hairline)}
  .fgo{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
    font-size:11.5px;font-weight:500;letter-spacing:.06em;color:var(--ink);
    padding:6px 11px;border-radius:999px;border:1px solid var(--hairline);transition:.15s}
  .fgo:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
  .fgo svg{width:11px;height:11px}

  /* ============ Device frame ============ */
  .device{
    width:390px;height:min(844px,86vh);
    background:#0c0d0e;border-radius:52px;padding:11px;
    box-shadow:0 2px 6px rgba(0,0,0,.12),0 40px 90px rgba(28,30,34,.28);
    position:relative;flex:0 0 auto;
  }
  .screen{
    position:absolute;inset:11px;border-radius:42px;overflow:hidden;
    background:var(--bg);
  }
  .notch{
    position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:120px;height:30px;background:#0c0d0e;border-radius:0 0 18px 18px;z-index:60;
  }
  .viewport{position:absolute;inset:0;overflow:hidden}

  /* stacked screens — entrance via CSS keyframes so the resting state is
     always transform:none even if rAF is throttled (background tab). */
  .view{
    position:absolute;inset:0;display:flex;flex-direction:column;
    background:var(--bg);will-change:transform;
  }
  .view.anim-push{animation:vIn .34s cubic-bezier(.32,.72,0,1)}
  .view.anim-sheet{animation:vUp .34s cubic-bezier(.32,.72,0,1)}
  .view.anim-out-push{animation:vOutR .3s cubic-bezier(.32,.72,0,1) forwards}
  .view.anim-out-sheet{animation:vOutD .3s cubic-bezier(.32,.72,0,1) forwards}
  @keyframes vIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
  @keyframes vUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes vOutR{from{transform:translateX(0)}to{transform:translateX(100%)}}
  @keyframes vOutD{from{transform:translateY(0)}to{transform:translateY(100%)}}

  /* ============ Nav bar ============ */
  .nav{
    height:50px;flex:0 0 auto;padding:0 8px;padding-top:34px;box-sizing:content-box;
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(243,244,245,.86);backdrop-filter:blur(18px) saturate(1.4);
    border-bottom:1px solid var(--hairline-2);position:relative;z-index:5;
  }
  .nav.sheet{padding-top:16px}
  .nav-side{display:flex;align-items:center;gap:2px;min-width:64px}
  .nav-side.right{justify-content:flex-end}
  .nav-title{font-size:15px;font-weight:500;letter-spacing:.08em}
  .nav-btn{
    display:flex;align-items:center;gap:3px;height:34px;padding:0 8px;border-radius:9px;
    font-size:14px;color:var(--ink);
  }
  .nav-btn.muted{color:var(--muted)}
  .nav-btn svg{width:18px;height:18px}
  .nav-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
  .nav-icon svg{width:18px;height:18px}
  .nav-icon.disabled{opacity:.32;pointer-events:none}

  .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
  .body::-webkit-scrollbar{width:0}
  svg{display:block}
  .ico{stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ico.fill{fill:currentColor;stroke:none}

  /* ============ Eyebrow / labels ============ */
  .eyebrow{font-size:10px;font-weight:600;letter-spacing:.35em;color:var(--muted);text-transform:uppercase}
  .card{background:var(--card);border-radius:14px;border:1px solid var(--hairline)}
  .hair{height:1px;background:var(--hairline)}

  /* ============ HOME ============ */
  .home-brand{display:flex;align-items:center;justify-content:space-between;padding:14px 24px 0}
  .home-logo{font-size:21px;font-weight:500;letter-spacing:.42em;padding-left:.42em}
  .gearbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--hairline);
    display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .gearbtn svg{width:15px;height:15px}
  .home-tag{font-size:12px;letter-spacing:.24em;color:var(--muted);padding:6px 24px 22px}
  .sec-label{padding:8px 26px 12px}
  .draft-card{margin:0 22px 22px}
  .draft-row{display:flex;align-items:center;gap:14px;padding:12px 18px}
  .draft-cover{width:46px;height:46px;border-radius:10px;overflow:hidden;flex:0 0 auto;background:var(--bg)}
  .draft-cover img{width:100%;height:100%;object-fit:cover}
  .draft-name{font-size:15px;font-weight:500;letter-spacing:.1em}
  .draft-meta{font-size:11px;letter-spacing:.06em;color:var(--muted);margin-top:4px}
  .chev{color:var(--faint)}
  .chev svg{width:13px;height:13px}

  .hero{margin:0 22px 14px;height:230px;border-radius:14px;overflow:hidden;position:relative;
    box-shadow:0 10px 30px var(--photo-shadow)}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.85)}
  .hero-grad{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,rgba(0,0,0,.6))}
  .hero-body{position:absolute;left:0;right:0;bottom:0;padding:20px;color:#fff}
  .hero-eye{font-size:9px;font-weight:600;letter-spacing:.35em;color:rgba(255,255,255,.72)}
  .hero-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px}
  .hero-title{font-size:23px;font-weight:500;letter-spacing:.16em}
  .hero-subtitle{font-size:11.5px;letter-spacing:.08em;color:rgba(255,255,255,.74);margin-top:7px}
  .hero-pill{display:flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.08em;
    padding:9px 15px;border:1px solid rgba(255,255,255,.5);border-radius:999px;white-space:nowrap}
  .hero-pill svg{width:11px;height:11px}

  .moment-row{margin:0 22px 12px;height:88px;display:flex;align-items:center;overflow:hidden}
  .moment-cover{width:104px;height:88px;flex:0 0 auto;overflow:hidden}
  .moment-cover img{width:100%;height:100%;object-fit:cover;filter:saturate(.85)}
  .moment-info{flex:1;padding:0 16px;min-width:0}
  .moment-title{font-size:15px;font-weight:500;letter-spacing:.12em}
  .moment-sub{font-size:11px;letter-spacing:.06em;color:var(--muted);margin-top:5px}

  .preset-card{margin:0 22px}
  .preset-row{display:flex;align-items:center;padding:15px 20px}
  .preset-title{font-size:14px;font-weight:500;letter-spacing:.1em;flex:1}
  .preset-count{font-size:12px;color:var(--faint);letter-spacing:.06em;margin-right:10px}
  .privacy{display:flex;gap:8px;padding:26px 38px 34px;color:var(--faint);font-size:10.5px;line-height:1.85;letter-spacing:.04em}
  .privacy svg{width:11px;height:11px;flex:0 0 auto;margin-top:3px}

  /* ============ CANVAS ============ */
  .canvas-body{padding:14px}
  .theme-eye{padding:10px 4px 4px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:14px;overflow:hidden;
    box-shadow:0 8px 24px var(--photo-shadow)}
  .cell{position:relative;aspect-ratio:1;overflow:hidden;background:#000;cursor:pointer}
  .cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cell .vig{position:absolute;inset:0;pointer-events:none;opacity:0}
  .cell .edited{position:absolute;right:4px;bottom:4px;width:16px;height:16px;border-radius:50%;
    background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
  .cell .edited svg{width:9px;height:9px;color:#fff}
  .cell.has-edit .edited{display:flex}
  .cell.dragging{opacity:.35}
  .cell.dragover{outline:2px solid var(--ink);outline-offset:-2px;z-index:2}
  .grid-hint{text-align:center;font-size:10.5px;letter-spacing:.14em;color:var(--faint);padding:12px 0 4px}

  .tone-row{display:flex;gap:8px;margin-top:4px}
  .tone{flex:1;height:34px;border-radius:999px;font-size:12.5px;letter-spacing:.3em;padding-left:.3em;
    color:var(--muted);border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;
    transition:.16s}
  .tone.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
  .caption-box{margin-top:10px;padding:12px 13px;min-height:96px}
  .caption-box .cap{font-family:var(--serif);font-size:15px;line-height:1.7;color:var(--ink);
    width:100%;resize:none;min-height:72px;display:block}
  .cap::placeholder{color:var(--faint)}
  .caption-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  .cap-note{font-size:9.5px;letter-spacing:.2em;color:var(--faint)}
  .ai-btn{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;letter-spacing:.06em;
    color:var(--ink);padding:6px 11px;border-radius:999px;border:1px solid var(--hairline)}
  .ai-btn svg{width:11px;height:11px}

  .bottom-bar{flex:0 0 auto;display:flex;gap:12px;padding:12px 20px 26px;
    background:rgba(243,244,245,.9);backdrop-filter:blur(18px);border-top:1px solid var(--hairline-2)}
  .btn-ink{flex:1;height:48px;border-radius:12px;background:var(--ink);color:#fff;
    font-size:15px;font-weight:600;letter-spacing:.16em;padding-left:.16em;display:flex;align-items:center;justify-content:center;transition:.15s}
  .btn-ink:active{transform:scale(.985);opacity:.9}
  .btn-ink.disabled{opacity:.35;pointer-events:none}
  .btn-hair{height:48px;border-radius:12px;background:var(--card);border:1px solid var(--hairline);
    color:var(--ink);font-size:15px;font-weight:500;letter-spacing:.14em;padding:0 26px;display:flex;align-items:center;justify-content:center}
  .btn-hair:active{opacity:.7}

  /* ============ PHOTO EDIT ============ */
  .edit-preview{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px;position:relative}
  .edit-photo{width:240px;height:240px;border-radius:10px;box-shadow:0 8px 22px var(--photo-shadow);
    position:relative;overflow:hidden;line-height:0}
  .edit-photo img{display:block;width:100%;height:100%;object-fit:cover}
  .edit-photo .vig{position:absolute;inset:0;pointer-events:none;opacity:0}
  .compare{position:absolute;right:28px;bottom:28px;width:36px;height:36px;border-radius:50%;
    background:rgba(243,244,245,.9);border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .compare svg{width:14px;height:14px}
  .compare.on{background:var(--ink);color:#fff}
  .tabbar{flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;padding:0 18px 12px}
  .tabbar::-webkit-scrollbar{height:0}
  .tab{flex:0 0 auto;height:34px;padding:0 16px;border-radius:999px;font-size:12.5px;letter-spacing:.24em;padding-left:calc(16px + .24em);
    color:var(--muted);border:1px solid var(--hairline);display:flex;align-items:center}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
  .panel{flex:0 0 auto;height:172px;background:rgba(243,244,245,.6);border-top:1px solid var(--hairline-2);
    display:flex;flex-direction:column;padding-top:12px}

  .filmstrip{display:flex;gap:10px;overflow-x:auto;padding:6px 18px 10px}
  .filmstrip::-webkit-scrollbar{height:0}
  .chip{flex:0 0 auto;text-align:center;width:62px}
  .chip-thumb{width:62px;height:62px;border-radius:10px;overflow:hidden;border:1px solid var(--hairline);position:relative}
  .chip-thumb img{width:100%;height:100%;object-fit:cover}
  .chip-thumb .vig{position:absolute;inset:0;pointer-events:none;opacity:0}
  .chip.on .chip-thumb{border-color:var(--ink);border-width:2px}
  .chip-name{font-size:10px;letter-spacing:.08em;color:var(--muted);margin-top:6px}
  .chip.on .chip-name{color:var(--ink);font-weight:600}

  .slider-line{display:flex;align-items:center;gap:14px;height:36px;padding:0 22px}
  .slider-line.hidden{visibility:hidden}
  .rng{-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;background:var(--hairline);flex:1}
  .rng::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ink);
    box-shadow:0 1px 5px rgba(0,0,0,.25);cursor:pointer}
  .rng::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:var(--ink)}
  .rng-val{font-size:11px;font-variant-numeric:tabular-nums;color:var(--faint);width:36px;text-align:right}
  .brush-hint{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 22px;font-size:11px;letter-spacing:.08em;color:var(--muted)}

  .tools{display:flex;gap:16px;overflow-x:auto;padding:8px 20px 0}
  .tools::-webkit-scrollbar{height:0}
  .tool{flex:0 0 auto;text-align:center;width:46px}
  .tool-c{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--hairline);
    display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative}
  .tool-c svg{width:17px;height:17px}
  .tool.on .tool-c{background:var(--ink);border-color:var(--ink);color:#fff}
  .tool-c .dot{position:absolute;top:0;right:0;width:6px;height:6px;border-radius:50%;background:var(--ink);display:none}
  .tool.edited .tool-c .dot{display:block}
  .tool-name{font-size:9.5px;letter-spacing:.06em;color:var(--muted);margin-top:6px}
  .tool.on .tool-name{color:var(--ink);font-weight:600}
  .tool-div{flex:0 0 auto;width:1px;height:40px;background:var(--hairline);align-self:center}
  .face-hint{font-size:9px;letter-spacing:.08em;color:var(--muted);text-align:right;padding:0 22px 4px}
  .face-hint.warn{color:#c67b3f}

  .simple-panel{padding:16px 20px;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;flex:1;text-align:center}
  .aspect-row,.style-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .pill{height:34px;padding:0 16px;border-radius:999px;font-size:12px;letter-spacing:.1em;color:var(--muted);
    border:1px solid var(--hairline);display:flex;align-items:center;gap:6px}
  .pill svg{width:12px;height:12px}
  .pill.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
  .pill.ink{background:var(--ink);color:#fff;border-color:var(--ink)}
  .mini-note{font-size:9.5px;letter-spacing:.1em;color:var(--faint);line-height:1.6;max-width:280px}

  /* ============ MOMENTS PREVIEW ============ */
  .pv-post{background:var(--card);padding:16px}
  .pv-head{display:flex;gap:10px}
  .pv-avatar{width:42px;height:42px;border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff}
  .pv-avatar svg{width:22px;height:22px}
  .pv-name{font-size:14px;font-weight:600;color:var(--wechat-name)}
  .pv-cap{font-size:14px;line-height:1.5;margin:6px 0 8px;white-space:pre-wrap}
  .pv-grid{display:grid;gap:4px}
  .pv-grid .g{width:78px;height:78px;overflow:hidden;background:var(--bg);position:relative}
  .pv-grid .g img{width:100%;height:100%;object-fit:cover}
  .pv-grid .g .vig{position:absolute;inset:0;pointer-events:none;opacity:0}
  .pv-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  .pv-time{font-size:12px;color:var(--faint)}
  .pv-menu{width:30px;height:18px;border-radius:4px;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;
    color:var(--wechat-name);font-weight:700;font-size:14px;letter-spacing:1px}
  .pv-bg{background:#ececec;min-height:100%}
  .pv-hair{height:1px;background:var(--hairline)}

  /* ============ VERSIONS / COLLAGE / EXPORT (sheets) ============ */
  .sheet-body{padding:18px;display:flex;flex-direction:column;gap:14px}
  .commit-card{padding:14px;display:flex;flex-direction:column;gap:12px}
  .commit-input{height:42px;border-radius:10px;background:var(--bg);padding:0 14px;font-size:14px;width:100%}
  .ver-row{display:flex;align-items:center;gap:12px;padding:11px 14px}
  .ver-thumbs{display:flex;gap:3px}
  .ver-thumbs img{width:34px;height:34px;border-radius:6px;object-fit:cover}
  .ver-name{font-size:13.5px;font-weight:500;letter-spacing:.06em}
  .ver-meta{font-size:10.5px;letter-spacing:.04em;color:var(--muted);margin-top:3px}
  .ver-restore{font-size:11.5px;font-weight:500;letter-spacing:.1em;color:var(--ink);padding:7px 13px;border-radius:999px;border:1px solid var(--hairline)}
  .ver-empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:44px;color:var(--muted);text-align:center}
  .ver-empty svg{width:26px;height:26px;color:var(--faint)}
  .ver-empty p{font-size:12px;letter-spacing:.06em;line-height:1.9}

  .collage-tabs{display:flex;gap:8px;padding:14px 18px}
  .collage-preview{flex:1;overflow-y:auto;padding:8px 22px 20px;display:flex;justify-content:center}
  .collage-img{border-radius:10px;box-shadow:0 8px 22px var(--photo-shadow);overflow:hidden;background:#fff}
  .collage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;background:#fff;width:260px}
  .collage-grid .g{aspect-ratio:1;overflow:hidden;position:relative}
  .collage-grid .g img{width:100%;height:100%;object-fit:cover}
  .collage-grid .g .vig{position:absolute;inset:0;opacity:0;pointer-events:none}
  .collage-strip{display:flex;flex-direction:column;gap:6px;padding:6px;background:#fff;width:190px}
  .collage-strip .g{width:100%;aspect-ratio:4/3;overflow:hidden;position:relative}
  .collage-strip .g img{width:100%;height:100%;object-fit:cover}
  .collage-strip .g .vig{position:absolute;inset:0;opacity:0;pointer-events:none}

  {sky:['#ddd6ce','#eeded0'], sea:['#bcab9b','#8f7d6c'], sun:'#f6e2cb', sx:.58, sy:.44, hz:.59, t:'sand'},
];
const _photoCache = {};
function photo(i){
  if(_photoCache[i]) return _photoCache[i];
  const s = SCENES[i % SCENES.length];
  const S = 640, c = document.createElement('canvas'); c.width=c.height=S;
  const x = c.getContext('2d');
  const hz = S*s.hz;
  // sky
  let g = x.createLinearGradient(0,0,0,hz); g.addColorStop(0,s.sky[0]); g.addColorStop(1,s.sky[1]);
  x.fillStyle=g; x.fillRect(0,0,S,hz);
  // sea / sand
  g = x.createLinearGradient(0,hz,0,S); g.addColorStop(0,s.sea[0]); g.addColorStop(1,s.sea[1]);
  x.fillStyle=g; x.fillRect(0,hz,S,S-hz);
  // sun glow
  const gx=S*s.sx, gy=hz*s.sy;
  let r = x.createRadialGradient(gx,gy,4,gx,gy,S*0.5);
  r.addColorStop(0,'rgba(255,255,255,.55)'); r.addColorStop(.4,'rgba(255,255,255,.12)'); r.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=r; x.fillRect(0,0,S,hz);
  // sun disc
  x.beginPath(); x.arc(gx,gy,S*0.06,0,Math.PI*2); x.fillStyle=s.sun; x.globalAlpha=.9; x.fill(); x.globalAlpha=1;
  // sun reflection on water
  if(s.t==='sea'){
    const refl=x.createLinearGradient(0,hz,0,S); refl.addColorStop(0,'rgba(255,255,255,.28)'); refl.addColorStop(.5,'rgba(255,255,255,0)');
    x.fillStyle=refl; x.fillRect(gx-S*0.09,hz,S*0.18,S*0.34);
    // horizon haze
    x.fillStyle='rgba(255,255,255,.18)'; x.fillRect(0,hz-2,S,4);
    // gentle wave lines
    x.strokeStyle='rgba(255,255,255,.10)'; x.lineWidth=1.4;
    for(let k=0;k<5;k++){ const yy=hz+18+k*((S-hz)/5); x.beginPath(); x.moveTo(0,yy); x.bezierCurveTo(S*.3,yy-3,S*.6,yy+3,S,yy); x.stroke(); }
  } else {
    // sand ripples
    x.strokeStyle='rgba(255,255,255,.12)'; x.lineWidth=1.6;
    for(let k=0;k<4;k++){ const yy=hz+24+k*((S-hz)/4); x.beginPath(); x.moveTo(0,yy); x.bezierCurveTo(S*.35,yy-6,S*.65,yy+8,S,yy-2); x.stroke(); }
  }
  // vignette-free subtle grain
  const im = x.getImageData(0,0,S,S), d=im.data;
  for(let p=0;p<d.length;p+=4){ const n=Math.sin(p*12.9898)*43758.5453; const v=((n-Math.floor(n))-.5)*9; d[p]+=v; d[p+1]+=v; d[p+2]+=v; }
  x.putImageData(im,0,0);
  const url=c.toDataURL('image/jpeg',.86); _photoCache[i]=url; return url;
}

function editCSS(e){
  if(!e) return 'none';

  if(e.whiten) f.push('brightness('+(1+e.whiten*.08).toFixed(3)+')','saturate('+(1-e.whiten*.05).toFixed(3)+')');
  const look=FILTER_MAP[e.filterID||'none']; if(look && look.css!=='none') f.push(look.css);
  if(e.brightness) f.push('brightness('+(1+e.brightness*.18).toFixed(3)+')');
  if(e.contrast) f.push('contrast('+(1+e.contrast*.3).toFixed(3)+')');
  if(e.saturation) f.push('saturate('+(1+e.saturation).toFixed(3)+')');
  return f.length?f.join(' '):'none';
}

const viewport = document.getElementById('viewport');

let stack = [];
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('show'),1700); }

function push(builder, mode){
  const el = builder();
  el.classList.add('view', mode==='sheet'?'anim-sheet':'anim-push');
  viewport.appendChild(el);
  stack.push({el, mode, builder});
  if(el.querySelector('.edit-photo')) requestAnimationFrame(()=>fitEditPhoto(el));
  return el;
}
function pop(){
  if(stack.length<=1) return;
  const top = stack.pop();
  top.el.classList.add(top.mode==='sheet'?'anim-out-sheet':'anim-out-push');
  setTimeout(()=>{ top.el.remove(); }, 300);
}
function replaceRoot(builder){ viewport.innerHTML=''; stack=[]; const el=builder(); el.classList.add('view'); viewport.appendChild(el); stack.push({el,mode:'root',builder}); }
function refreshTop(){ const top=stack[stack.length-1]; if(!top) return; const fresh=top.builder(); fresh.className='view'; top.el.replaceWith(fresh); top.el=fresh; if(fresh.querySelector('.edit-photo')) requestAnimationFrame(()=>fitEditPhoto(fresh)); }

let dragId=null;
function openCanvas(){ push(CanvasView,'push'); }
function CanvasView(){
  const v = el('div');
  const nav = navBar({
    title: draft.name,
    left: backBtn(),
    right: [ iconBtn('clock', ()=>push(VersionsSheet,'sheet')), iconBtn('grid3', ()=>push(CollageSheet,'sheet'), draft.slots.length===0) ],
  });
  v.appendChild(nav);

  const body = el('div','body canvas-body');

  const te = el('div','theme-eye'); te.appendChild(el('span','eyebrow','主题方向 · '+draft.theme)); body.appendChild(te);

  // grid
  const grid = el('div','grid');
  draft.slots.forEach((slot, idx)=>{
    const cell = el('div','cell'+(isEdited(slot.edit)?' has-edit':''));
    cell.draggable=true;
    cell.dataset.id=slot.id;
    const img = el('img'); img.src=photo(slot.sceneIndex); img.style.filter=editCSS(slot.edit);
    const vig = el('div','vig'); const vv=editVig(slot.edit); if(vv){ vig.style.opacity=1; vig.style.background=vignetteBg(vv); }
    const badge = el('div','edited', svg('wand','ico'));
    cell.append(img,vig,badge);
    cell.onclick=()=>openPhotoEdit(idx);
    // drag reorder
    cell.addEventListener('dragstart',e=>{ dragId=slot.id; cell.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    cell.addEventListener('dragend',()=>{ dragId=null; cell.classList.remove('dragging'); [...grid.children].forEach(c=>c.classList.remove('dragover')); });
    cell.addEventListener('dragover',e=>{ e.preventDefault(); cell.classList.add('dragover'); });
    cell.addEventListener('dragleave',()=>cell.classList.remove('dragover'));
    cell.addEventListener('drop',e=>{ e.preventDefault(); cell.classList.remove('dragover'); reorder(dragId, slot.id); });
    grid.appendChild(cell);
  });
  body.appendChild(grid);
  body.appendChild(el('div','grid-hint','点按编辑 · 长按拖动调整顺序'));

  // caption
  const capWrap = el('div');
  const toneRow = el('div','tone-row');
  TONES.forEach(t=>{
    const b=el('button','tone'+(draft.activeTone===t.key?' on':''), t.label);
    b.onclick=()=>{ draft.activeTone=t.key; refreshTop(); };
    toneRow.appendChild(b);
  });
  capWrap.appendChild(toneRow);

  const capCard = el('div','caption-box card');
  const ta = el('textarea','cap'); ta.value=activeCaption(); ta.placeholder='写点什么，记录此刻的心情…';
  ta.addEventListener('input',()=>{ draft.captions[draft.activeTone]=ta.value; });
  capCard.appendChild(ta);
  capWrap.appendChild(capCard);

  const foot = el('div','caption-foot');
  foot.appendChild(el('span','cap-note','AI 生成 · 发布前请确认'));
  const ai = el('button','ai-btn', svg('sparkles','ico')+'<span>AI 文案</span>');
  ai.onclick=()=>{ aiCaption(ta); };
  foot.appendChild(ai);
  capWrap.appendChild(foot);
  body.appendChild(capWrap);

  v.appendChild(body);

  // bottom
  const bar = el('div','bottom-bar');
  const prev = el('button','btn-hair','预览'); prev.onclick=()=>push(PreviewSheet,'sheet');
  const pub = el('button','btn-ink','发布准备'); pub.onclick=()=>push(ExportSheet,'sheet');
  bar.append(prev,pub);
  v.appendChild(bar);
  return v;
}
function reorder(from, to){
  if(!from||from===to) return;
  const a=draft.slots.findIndex(s=>s.id===from), b=draft.slots.findIndex(s=>s.id===to);
  if(a<0||b<0) return;
  const [m]=draft.slots.splice(a,1); draft.slots.splice(b,0,m); refreshTop();
}

  '浪把时间揉皱又抚平，我们就这样虚度了一个下午。',

];

let editState=null; // {idx, edit, tab, adjSel, beautySel, brush, compare}
function openPhotoEdit(idx){
  editState={ idx, edit:JSON.parse(JSON.stringify(draft.slots[idx].edit||newEdit())), tab:'filters', adjSel:'bright', beautySel:'smooth', brush:null, compare:false };
  push(PhotoEditView,'sheet');
}
function PhotoEditView(){
  const s=editState;
  const slot=draft.slots[s.idx];
  const v=el('div');
  const cancel=textBtn('取消', pop, true);
  const nav=navBar({title:'编辑', left:cancel, sheet:true});

  const applyPv=()=>{ const e=s.compare?null:s.edit; img.style.filter=editCSS(e); const vv=s.compare?0:editVig(e); vig.style.opacity=vv?1:0; vig.style.background=vv?vignetteBg(vv):''; };
  ph.append(img,vig);
  pv.appendChild(ph);
  const cmp=el('button','compare', svg('compare','ico'));
  cmp.onpointerdown=()=>{ s.compare=true; applyPv(); };
  const relCmp=()=>{ if(s.compare){ s.compare=false; applyPv(); } };
  cmp.onpointerup=relCmp; cmp.onpointerleave=relCmp;

  // tab bar
  const tb=el('div','tabbar');
  TABS.forEach(t=>{ const b=el('button','tab'+(s.tab===t.id?' on':''), t.label); b.onclick=()=>{ s.tab=t.id; s.brush=null; refreshTop(); }; tb.appendChild(b); });
  v.appendChild(tb);

  const panel=el('div','panel');
  panel.appendChild(buildEditPanel(s, slot, applyPv));
  v.appendChild(panel);

  // bottom

  if(!isEdited(s.edit)) reset.style.opacity='.4';

  const done=el('button','btn-ink','完成');
  done.onclick=()=>{ draft.slots[s.idx].edit=s.edit; pop(); toast(isEdited(s.edit)?'已应用编辑':'已完成'); };

/* Size the edit preview to the largest square that fits its area — the
   flexbox height is indefinite, so measure and set it explicitly. */
function fitEditPhoto(v){
  const pre=v.querySelector('.edit-preview'), ph=v.querySelector('.edit-photo');
  if(!pre||!ph) return;
  const side=Math.max(120, Math.min(pre.clientWidth, pre.clientHeight)-32);
  ph.style.width=side+'px'; ph.style.height=side+'px';
}
window.addEventListener('resize',()=>{ const top=stack[stack.length-1]; if(top&&top.el.querySelector('.edit-photo')) fitEditPhoto(top.el); });

function buildEditPanel(s, slot, applyPv){
  const wrap=el('div',null); wrap.style.cssText='display:flex;flex-direction:column;height:100%';
  if(s.tab==='filters'){
    const strip=el('div','filmstrip');
    FILTERS.forEach(f=>{
      const on=(s.edit.filterID||'none')===f.id;
      const chip=el('div','chip'+(on?' on':''));
      const th=el('div','chip-thumb'); const im=el('img'); im.src=photo(slot.sceneIndex); im.style.filter=f.css;
      const vg=el('div','vig'); if(f.vig){ vg.style.opacity=1; vg.style.background=vignetteBg(f.vig); }
      th.append(im,vg);
      chip.append(th, el('div','chip-name',f.name));
      chip.onclick=()=>{ s.edit.filterID=f.id==='none'?null:f.id; refreshTop(); };
      strip.appendChild(chip);
    });
    wrap.appendChild(strip);
    return wrap;
  }
  if(s.tab==='adjust' || s.tab==='beauty'){
    const params = s.tab==='adjust'?ADJUST:BEAUTY;
    const selKey = s.tab==='adjust'?'adjSel':'beautySel';
    // slider or brush hint
    if(s.tab==='beauty' && s.brush!=null){
      const bh=el('div','brush-hint');
      bh.innerHTML='<span>点图上需要处理的位置 · 每次一笔</span>';
      const undo=el('button','pill', svg('uturn','ico')+'撤销一笔'); undo.onclick=()=>{ if(s.edit.warp>0){ s.edit.warp--; refreshTop(); } };
      bh.appendChild(undo);
      wrap.appendChild(bh);
    } else {
      const spec = params.find(p=>p.id===s[selKey]) || params[0];
      const line=el('div','slider-line');
      const rng=el('input','rng'); rng.type='range'; rng.min=spec.min; rng.max=spec.max; rng.step='0.01'; rng.value=s.edit[spec.key];
      const val=el('div','rng-val'); const fmt=x=> (x>0?'+':'')+Math.round(x*100);
      val.textContent=fmt(s.edit[spec.key]);
      rng.addEventListener('input',()=>{ s.edit[spec.key]=parseFloat(rng.value); val.textContent=fmt(s.edit[spec.key]);
        // live update preview + tool dot without full rebuild
        applyPv();
        const tool=wrap.querySelector('.tool[data-id="'+spec.id+'"]'); if(tool) tool.classList.toggle('edited', s.edit[spec.key]!==0);
      });
      line.append(rng,val);
      wrap.appendChild(line);
    }
    // face hint (beauty)
    if(s.tab==='beauty'){
      const fh=el('div','face-hint warn','示例照片无人脸，瘦脸/大眼等在真实人像上按 106 点关键点生效，手动笔可用');
      wrap.appendChild(fh);
    }
    // tools
    const tools=el('div','tools');
    params.forEach(p=>{
      const on = s.brush==null && s[selKey]===p.id;
      const t=el('div','tool'+(on?' on':'')+(s.edit[p.key]!==0?' edited':'')); t.dataset.id=p.id;
      t.innerHTML='<div class="tool-c">'+svg(p.icon,'ico')+'<span class="dot"></span></div><div class="tool-name">'+p.label+'</div>';
      t.onclick=()=>{ s.brush=null; s[selKey]=p.id; refreshTop(); };
      tools.appendChild(t);
    });
    if(s.tab==='beauty'){
      tools.appendChild(el('div','tool-div'));
      [['收缩笔','shrink',-1],['膨胀笔','expand',1]].forEach(([label,icon,dir])=>{
        const on=s.brush===dir;
        const t=el('div','tool'+(on?' on':''));
        t.innerHTML='<div class="tool-c">'+svg(icon,'ico')+'</div><div class="tool-name">'+label+'</div>';
        t.onclick=()=>{ s.brush = s.brush===dir?null:dir; refreshTop(); };
        tools.appendChild(t);
      });
    }
    wrap.appendChild(tools);
    return wrap;
  }
  if(s.tab==='crop'){
    const sp=el('div','simple-panel');
    const ar=el('div','aspect-row');
    ASPECTS.forEach(a=>{ const b=el('button','pill'+(s.edit.aspect===a?' on':''),a); b.onclick=()=>{ s.edit.aspect=a; refreshTop(); }; ar.appendChild(b); });
    sp.appendChild(ar);
    const rot=el('button','pill', svg('rotate','ico')+'旋转 90°'); rot.onclick=()=>{ s.edit.rotation=(s.edit.rotation+90)%360; toast('已旋转 '+s.edit.rotation+'°'); refreshTop(); };
    sp.appendChild(rot);
    sp.appendChild(el('div','mini-note','九宫格中将按方形展示，1:1 所见即所得'));
    wrap.appendChild(sp); return wrap;
  }
  if(s.tab==='redraw'){
    const sp=el('div','simple-panel');
    const sr=el('div','style-row');
    STYLES.forEach(st=>{ const b=el('button','pill',st); b.onclick=()=>toast('AI 重绘为「'+st+'」· 联网功能，Demo 演示交互'); sr.appendChild(b); });
    sp.appendChild(sr);
    const gen=el('div',null); gen.style.cssText='display:flex;gap:10px;width:100%;max-width:300px';
    const inp=el('input'); inp.placeholder='自定义描述，如：改成雪天'; inp.style.cssText='flex:1;height:40px;border-radius:10px;border:1px solid var(--hairline);background:var(--card);padding:0 12px;font-size:13px';
    const gb=el('button','pill ink','生成'); gb.style.height='40px'; gb.onclick=()=>toast('AI 重绘 · 联网功能，Demo 演示交互');
    gen.append(inp,gb); sp.appendChild(gen);
    sp.appendChild(el('div','mini-note','重绘结果为 AI 生成 · 采用后将作为新照片替换本格'));
    wrap.appendChild(sp); return wrap;
  }
  if(s.tab==='erase'){
    const sp=el('div','simple-panel');
    sp.appendChild(el('div',null,'<div style="font-size:12.5px;letter-spacing:.16em;font-weight:500">在图上涂抹要消除的物体</div>'));
    const rowb=el('div','style-row');
    ['撤销一笔','清空'].forEach(t=>rowb.appendChild(el('button','pill',t)));
    const er=el('button','pill ink','消除'); er.onclick=()=>toast('AI 消除 · 联网功能，Demo 演示交互'); rowb.appendChild(er);
    sp.appendChild(rowb);
    sp.appendChild(el('div','mini-note','AI 将重建涂抹区域的背景 · 其余像素保持不变'));
    wrap.appendChild(sp); return wrap;
  }
  return wrap;
}

function VersionsSheet(){
  const v=el('div');

    draft.versions.unshift({ id:'v'+Date.now(), name, createdAt:versionStamp(), slots:JSON.parse(JSON.stringify(draft.slots)), captions:{...draft.captions}, activeTone:draft.activeTone });
    refreshTop(); toast('已提交版本');
  };
  commit.append(inp,cb);

  if(draft.versions.length===0){
    const empty=el('div','ver-empty');
    empty.innerHTML=svg('clock','ico')+'<p>还没有版本<br>改到满意的节点就提交一个，随时可以回来</p>';

    const list=el('div','card'); list.style.overflow='hidden';
    draft.versions.forEach((ver,i)=>{
      const row=el('div','ver-row');
      let th='<div class="ver-thumbs">';

      const rb=el('button','ver-restore','恢复'); rb.onclick=()=>{ restoreVersion(ver); toast('已恢复到「'+ver.name+'」'); pop(); };
      const tb=el('button',null, svg('trash','ico')); tb.style.cssText='width:30px;height:30px;color:var(--faint)'; tb.onclick=()=>{ draft.versions=draft.versions.filter(x=>x.id!==ver.id); refreshTop(); };

      if(i<draft.versions.length-1){ const h=el('div','hair'); h.style.marginLeft='14px'; list.appendChild(h); }
    });
    body.appendChild(list);
  }
  v.appendChild(body);

}

  steps.appendChild(sc);
  body.appendChild(steps);

  const wb=el('button','btn-ink'); wb.innerHTML='<span class="wechat-dot" style="margin-right:9px"></span>打开微信'; wb.onclick=()=>toast('引导跳转微信');
  body.appendChild(wb);

  v.appendChild(body);
  return v;
}

function renderFeaturePanel(){
  const p=document.getElementById('featurePanel');
  const head=el('div','fpanel-head');
  head.appendChild(el('div','eyebrow','功能拆解'));
  head.appendChild(el('div','fpanel-note','这不只是界面演示。下面列出<b>全部能力</b>,每项都标注了怎么实现、用了什么技术。点任意一项的<b>「去体验」</b>,左边原型会直接跳到对应界面。'));
  p.appendChild(head);
  FEATURES.forEach(g=>{
    const grp=el('div','fgroup');
    grp.appendChild(el('div','fgroup-h eyebrow', g.group));
    const card=el('div','fcard card');
    g.items.forEach(it=>{
      const row=el('div','fitem');
      const tags=(it.tags||[]).map(t=>'<span class="ftag">'+t+'</span>').join('');
      row.innerHTML=
        '<div class="fitem-top"><div class="fitem-name">'+it.name+'</div>'+
          (it.go!==null?'<button class="fgo">去体验 '+svg('arrowR','ico')+'</button>':'')+
        '</div>'+
        '<div class="fitem-desc">'+it.desc+'</div>'+
        '<div class="fitem-impl"><b>实现</b>'+it.impl+'</div>'+
        (tags?'<div class="ftags">'+tags+'</div>':'');
      const btn=row.querySelector('.fgo'); if(btn) btn.onclick=()=>deepLink(it.go);
      card.appendChild(row);
    });
    grp.appendChild(card);
    p.appendChild(grp);
  });
}

/* Jump the prototype straight to a feature's screen. */
function resetToHome(){ while(stack.length>1){ const t=stack.pop(); t.el.remove(); } }
function deepLink(target){
  if(target===null){ toast('该能力在后台运行,无独立界面'); return; }
  resetToHome();
  if(target!=='home'){
    push(CanvasView,'push');
    if(target.indexOf('edit:')===0){
      openPhotoEdit(0);
      editState.tab=target.split(':')[1];
      refreshTop();
    } else if(target!=='canvas'){
      const map={preview:PreviewSheet,versions:VersionsSheet,collage:CollageSheet,export:ExportSheet};
      if(map[target]) push(map[target],'sheet');
    }
  }
  const dev=document.querySelector('.device');
  if(dev) dev.scrollIntoView({behavior:'smooth',block:'center'});
}
