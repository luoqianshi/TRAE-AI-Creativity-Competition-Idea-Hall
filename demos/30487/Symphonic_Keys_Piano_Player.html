<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多格式钢琴乐谱播放器 (经典完整内置版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            touch-action: manipulation;
            background: #fdfdfd;
            color: #333;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            background: #f0f4f8;
            padding: 15px;
            border-radius: 8px;
        }
        .select-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 200px;
        }
        label {
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }
        select, button {
            padding: 10px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            min-height: 44px;
        }
        select {
            background: white;
            cursor: pointer;
        }
        button {
            padding: 8px 24px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            background: #fff;
        }
        #playBtn {
            background: #10b981;
            color: white;
            border: none;
        }
        #playBtn:hover { background: #059669; }
        #pauseBtn { background: #3b82f6; color: white; border: none; }
        #pauseBtn:hover { background: #2563eb; }
        #stopBtn { background: #ef4444; color: white; border: none; }
        #stopBtn:hover { background: #dc2626; }
        
        #piano-container {
            overflow-x: auto;
            margin-top: 10px;
            padding-bottom: 25px;
            -webkit-overflow-scrolling: touch;
        }
        #piano {
            display: flex;
            height: 160px;
            border: 1px solid #bdf;
            min-width: 100%;
            position: relative;
            background: #222;
            border-radius: 4px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .key {
            position: relative;
            background: linear-gradient(to bottom, #fff 0%, #ebebeb 100%);
            border-right: 1px solid #bbb;
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 8px;
            font-size: 11px;
            color: #888;
            user-select: none;
            -webkit-user-select: none;
            border-radius: 0 0 4px 4px;
            cursor: pointer;
        }
        .key:last-child {
            border-right: none;
        }
        .black-key {
            position: absolute;
            width: 65%;
            height: 60%;
            background: linear-gradient(to bottom, #333 0%, #000 100%);
            right: -32.5%;
            top: 0;
            z-index: 5;
            color: #aaa;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 5px;
            font-size: 9px;
            user-select: none;
            -webkit-user-select: none;
            border-radius: 0 0 3px 3px;
            box-shadow: -1px 2px 3px rgba(0,0,0,0.4);
        }
        .key.active {
            background: linear-gradient(to bottom, #a3f7bf 0%, #76e39d 100%) !important;
            color: #155e75;
        }
        .black-key.active {
            background: linear-gradient(to bottom, #5d8ca8 0%, #3b6178 100%) !important;
            color: white;
        }
        .status {
            padding: 12px;
            background: #f8fafc;
            border-left: 4px solid #3b82f6;
            border-radius: 0 4px 4px 0;
            font-size: 14px;
            color: #475569;
        }
        .octave-label {
            position: absolute;
            bottom: -22px;
            font-size: 12px;
            color: #64748b;
            font-weight: bold;
        }
        #timeDisplay {
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
            margin-left: auto;
            background: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
        }
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stroke;
            }
            #timeDisplay {
                margin-left: 0;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>多格式钢琴乐谱播放器</h1>
        
        <div class="controls">
            <div class="select-group">
                <label for="songSelector">选择内置经典完整乐谱:</label>
                <select id="songSelector">
                    <option value="furElise">致爱丽丝 (Für Elise - 完整经典版)</option>
                    <option value="autumnWhispers">秋日的私语 (A Comme Amour - 浪漫华丽版)</option>
                </select>
            </div>
            
            <div class="select-group">
                <label for="fileInput">或加载外部乐谱 JSON:</label>
                <input type="file" id="fileInput" accept=".json" style="font-size:12px;">
            </div>
        </div>
        
        <div class="controls" style="margin-top:-10px;">
            <button id="playBtn">播放</button>
            <button id="pauseBtn">暂停</button>
            <button id="stopBtn">停止</button>
            <span id="timeDisplay">00:00 / 00:00</span>
        </div>

        <div class="status" id="status">正在加载音色库，请稍候...</div>
        
        <div id="piano-container">
            <div id="piano"></div>
        </div>
    </div>

    <script>
        // 初始化多音阶标准采样器
        const sampler = new Tone.Sampler({
            urls: {
                "C2": "C2.mp3", "D#2": "Ds2.mp3", "F#2": "Fs2.mp3", "A2": "A2.mp3",
                "C3": "C3.mp3", "D#3": "Ds3.mp3", "F#3": "Fs3.mp3", "A3": "A3.mp3",
                "C4": "C4.mp3", "D#4": "Ds4.mp3", "F#4": "Fs4.mp3", "A4": "A4.mp3",
                "C5": "C5.mp3", "D#5": "Ds5.mp3", "F#5": "Fs5.mp3", "A5": "A5.mp3",
                "C6": "C6.mp3", "D#6": "Ds6.mp3", "F#6": "Fs6.mp3",
            },
            release: 1.2,
            baseUrl: "https://tonejs.github.io/audio/salamander/",
            onload: () => {
                statusDisplay.textContent = "音色库加载完成！可以直接点击【播放】。";
            }
        }).toDestination();

        // 核心变量
        let currentSong = null;
        let startTime = null;
        let noteEvents = [];
        let isPlaying = false;
        let currentPart = null;
        let displayInterval = null;
        let duration = 0;
        let activeKeys = new Set();

        const fileInput = document.getElementById('fileInput');
        const songSelector = document.getElementById('songSelector');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const statusDisplay = document.getElementById('status');
        const pianoContainer = document.getElementById('piano');

        // 构建 5个八度 键盘键盘 (C2-C7)
        function createPianoKeys() {
            const notes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
            const octaves = [2, 3, 4, 5, 6];
            pianoContainer.innerHTML = '';
            
            octaves.forEach(octave => {
                notes.forEach((note, index) => {
                    const keyElement = document.createElement('div');
                    keyElement.className = 'key';
                    keyElement.dataset.note = note + octave;
                    keyElement.textContent = note + octave;
                    
                    if (index !== 2 && index !== 6) { 
                        const blackKey = document.createElement('div');
                        blackKey.className = 'black-key';
                        blackKey.dataset.note = note + '#' + octave;
                        blackKey.textContent = note + '#' + octave;
                        keyElement.appendChild(blackKey);
                    }
                    pianoContainer.appendChild(keyElement);
                    if (note === 'C') {
                        const octaveLabel = document.createElement('div');
                        octaveLabel.className = 'octave-label';
                        octaveLabel.textContent = `C${octave}`;
                        keyElement.appendChild(octaveLabel);
                    }
                });
            });
            
            const lastKey = document.createElement('div');
            lastKey.className = 'key';
            lastKey.dataset.note = 'C7';
            lastKey.textContent = 'C7';
            pianoContainer.appendChild(lastKey);
            
            const lastOctaveLabel = document.createElement('div');
            lastOctaveLabel.className = 'octave-label';
            lastOctaveLabel.textContent = `C7`;
            lastKey.appendChild(lastOctaveLabel);
            
            const totalWhiteKeys = 5 * 7 + 1;
            pianoContainer.style.width = `${totalWhiteKeys * 32}px`;
        }

        // --- 数据生成矩阵：致爱丽丝完整主线与伴奏 ---
        function genFurEliseData() {
            const events = [];
            let t = 0;
            const dt = 0.23; // 每拍基准速度
            
            function addN(note, dur, offset = 0) {
                events.push({ time: t + offset, note: note, duration: dur, velocity: 0.75 });
            }

            function playThemeA() {
                addN("E5", 0.2); t += dt; addN("D#5", 0.2); t += dt;
                addN("E5", 0.2); t += dt; addN("D#5", 0.2); t += dt;
                addN("E5", 0.2); t += dt; addN("B4", 0.2); t += dt;
                addN("D5", 0.2); t += dt; addN("C5", 0.2); t += dt;
                
                // 第一小节
                addN("A4", 0.6); addN("A2", 0.6, 0); addN("E3", 0.6, dt); addN("A3", 0.6, dt*2);
                t += dt * 3;
                addN("C4", 0.2); t += dt; addN("E4", 0.2); t += dt; addN("A4", 0.2); t += dt;
                
                // 第二小节
                addN("B4", 0.6); addN("E2", 0.6, 0); addN("E3", 0.6, dt); addN("G#3", 0.6, dt*2);
                t += dt * 3;
                addN("E4", 0.2); t += dt; addN("G#4", 0.2); t += dt; addN("B4", 0.2); t += dt;
                
                // 第三小节
                addN("C5", 0.6); addN("A2", 0.6, 0); addN("E3", 0.6, dt); addN("A3", 0.6, dt*2);
                t += dt * 3;
                addN("E4", 0.2); t += dt;
                
                // 重复过渡
                addN("E5", 0.2); t += dt; addN("D#5", 0.2); t += dt;
                addN("E5", 0.2); t += dt; addN("D#5", 0.2); t += dt;
                addN("E5", 0.2); t += dt; addN("B4", 0.2); t += dt;
                addN("D5", 0.2); t += dt; addN("C5", 0.2); t += dt;
                
                // 第四小节
                addN("A4", 0.6); addN("A2", 0.6, 0); addN("E3", 0.6, dt); addN("A3", 0.6, dt*2);
                t += dt * 3;
                addN("C4", 0.2); t += dt; addN("E4", 0.2); t += dt; addN("A4", 0.2); t += dt;
                
                // 第五小节
                addN("B4", 0.6); addN("E2", 0.6, 0); addN("E3", 0.6, dt); addN("G#3", 0.6, dt*2);
                t += dt * 3;
                addN("D4", 0.2); t += dt; addN("C5", 0.2); t += dt; addN("B4", 0.2); t += dt;
                
                // 第六小节结束
                addN("A4", 0.6); addN("A2", 0.6, 0); addN("E3", 0.6, dt); addN("A3", 0.6, dt*2);
                t += dt * 3;
            }

            function playThemeB() {
                addN("B4", 0.2); t += dt; addN("C5", 0.2); t += dt; addN("D5", 0.2); t += dt;
                // 第七小节
                addN("E5", 0.6); addN("C3", 0.6, 0); addN("G3", 0.6, dt); addN("C4", 0.6, dt*2);
                t += dt * 3;
                addN("G4", 0.2); t += dt; addN("F5", 0.2); t += dt; addN("E5", 0.2); t += dt;
                // 第八小节
                addN("D5", 0.6); addN("G2", 0.6, 0); addN("D3", 0.6, dt); addN("G3", 0.6, dt*2);
                t += dt * 3;
                addN("F4", 0.2); t += dt; addN("E5", 0.2); t += dt; addN("D5", 0.2); t += dt;
                // 第九小节
                addN("C5", 0.6); addN("A2", 0.6, 0); addN("E3", 0.6, dt); addN("A3", 0.6, dt*2);
                t += dt * 3;
                addN("E4", 0.2); t += dt; addN("D5", 0.2); t += dt; addN("C5", 0.2); t += dt;
                // 第十小节
                addN("B4", 0.6); addN("E2", 0.6, 0); addN("E3", 0.6, dt); addN("E4", 0.6, dt*2);
                t += dt * 3;
                addN("E4", 0.2); t += dt; addN("E5", 0.2); t += dt; addN("E4", 0.2); t += dt;
                addN("E5", 0.2); t += dt; addN("D#5", 0.2); t += dt; addN("E5", 0.2); t += dt;
                addN("D#5", 0.2); t += dt; addN("E5", 0.2); t += dt; addN("D#5", 0.2); t += dt;
                addN("E5", 0.2); t += dt; addN("B4", 0.2); t += dt; addN("D5", 0.2); t += dt;
                addN("C5", 0.2); t += dt;
            }

            // 拼接完整乐曲框架 A -> B -> A -> B -> A 形成完美长篇弹奏
            playThemeA();
            playThemeB();
            playThemeA();
            playThemeB();
            playThemeA();
            return events;
        }

        // --- 数据生成矩阵：秋日的私语流线型全铺版 ---
        function genAutumnWhispersData() {
            const events = [];
            let t = 0;
            const step = 0.16; // 16分音符快速流转

            function addN(note, dur, offset = 0) {
                events.push({ time: t + offset, note: note, duration: dur, velocity: 0.7 });
            }

            function playArpeggioMeasure(lhNotes, rhNotes) {
                lhNotes.forEach((note, index) => {
                    addN(note, 0.4, index * step);
                });
                rhNotes.forEach(rn => {
                    addN(rn.note, rn.dur, rn.beat * step);
                });
                t += step * 8;
            }

            // 循环两次构成完整华丽主乐段
            for (let m = 0; m < 2; m++) {
                // Am 和弦小节
                playArpeggioMeasure(
                    ["A2", "E3", "A3", "C4", "E4", "C4", "A3", "E3"],
                    [
                        { beat: 0, note: "E5", dur: 0.6 }, { beat: 2, note: "A5", dur: 0.3 },
                        { beat: 3, note: "B5", dur: 0.3 }, { beat: 4, note: "C6", dur: 0.6 },
                        { beat: 6, note: "B5", dur: 0.3 }, { beat: 7, note: "A5", dur: 0.3 }
                    ]
                );
                // Dm 和弦小节
                playArpeggioMeasure(
                    ["D2", "A3", "D3", "F4", "A4", "F4", "D3", "A3"],
                    [{ beat: 0, note: "F5", dur: 0.9 }, { beat: 4, note: "D5", dur: 0.9 }]
                );
                // G 和弦小节
                playArpeggioMeasure(
                    ["G2", "D3", "G3", "B4", "D4", "B4", "G3", "D3"],
                    [
                        { beat: 0, note: "D5", dur: 0.6 }, { beat: 2, note: "G5", dur: 0.3 },
                        { beat: 3, note: "A5", dur: 0.3 }, { beat: 4, note: "B5", dur: 0.6 },
                        { beat: 6, note: "A5", dur: 0.3 }, { beat: 7, note: "G5", dur: 0.3 }
                    ]
                );
                // C 和弦小节
                playArpeggioMeasure(
                    ["C2", "G3", "C3", "E4", "G4", "E4", "C3", "G3"],
                    [{ beat: 0, note: "C5", dur: 0.9 }, { beat: 4, note: "E4", dur: 0.9 }]
                );
                // F 和弦小节
                playArpeggioMeasure(
                    ["F2", "C3", "F3", "A4", "C4", "A4", "F3", "C3"],
                    [
                        { beat: 0, note: "A4", dur: 0.6 }, { beat: 2, note: "D5", dur: 0.3 },
                        { beat: 3, note: "E5", dur: 0.3 }, { beat: 4, note: "F5", dur: 0.6 },
                        { beat: 6, note: "E5", dur: 0.3 }, { beat: 7, note: "D5", dur: 0.3 }
                    ]
                );
                // E/G# 和弦小节
                playArpeggioMeasure(
                    ["E2", "B3", "E3", "G#4", "B4", "G#4", "E3", "B3"],
                    [{ beat: 0, note: "E5", dur: 0.9 }, { beat: 4, note: "B4", dur: 0.9 }]
                );
                // Am 落地结束
                playArpeggioMeasure(
                    ["A2", "E3", "A3", "C4", "E4", "C4", "A3", "E3"],
                    [{ beat: 0, note: "A4", dur: 1.5 }]
                );
                // 过渡小节
                playArpeggioMeasure(
                    ["E2", "B3", "E3", "G#4", "B4", "G#4", "E3", "B3"],
                    [
                        { beat: 0, note: "B4", dur: 0.3 }, { beat: 2, note: "C5", dur: 0.3 },
                        { beat: 4, note: "D5", dur: 0.3 }, { beat: 6, note: "E5", dur: 0.3 }
                    ]
                );
            }

            // 副歌高潮部分
            for (let c = 0; c < 2; c++) {
                playArpeggioMeasure(["F2", "C3", "F3", "A4", "C4", "A4", "F3", "C3"], [{ beat: 0, note: "C6", dur: 0.8 }, { beat: 4, note: "A5", dur: 0.8 }]);
                playArpeggioMeasure(["G2", "D3", "G3", "B4", "D4", "B4", "G3", "D3"], [{ beat: 0, note: "B5", dur: 0.8 }, { beat: 4, note: "G5", dur: 0.8 }]);
                playArpeggioMeasure(["E2", "B3", "E3", "G#4", "B4", "G#4", "E3", "B3"], [{ beat: 0, note: "A5", dur: 0.8 }, { beat: 4, note: "E5", dur: 0.8 }]);
                playArpeggioMeasure(["A2", "E3", "A3", "C4", "E4", "C4", "A3", "E3"], [{ beat: 0, note: "A5", dur: 1.5 }]);
            }
            return events;
        }

        // 高亮或者取消高亮钢琴键
        function highlightKey(noteName, active) {
            const standardizedNote = noteName.replace(/(\d)$/, function(match, octave) {
                return octave;
            });
            
            const keys = document.querySelectorAll('.key, .black-key');
            keys.forEach(key => {
                if (key.dataset.note === standardizedNote) {
                    if (active) {
                        key.classList.add('active');
                        activeKeys.add(standardizedNote);
                    } else {
                        key.classList.remove('active');
                        activeKeys.delete(standardizedNote);
                    }
                }
            });
        }

        // 单击键盘发音
        function playNote(noteName) {
            if (Tone.context.state !== 'running') {
                Tone.context.resume();
            }
            sampler.triggerAttackRelease(noteName, "2n");
            highlightKey(noteName, true);
            setTimeout(() => { highlightKey(noteName, false); }, 400);
        }

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateTimeDisplay() {
            if (isPlaying) {
                const currentTime = Tone.Transport.seconds;
                timeDisplay.textContent = `${formatTime(currentTime)} / ${formatTime(duration)}`;
            }
        }

        // 统一曲目装载器
        function loadPresetSong(songKey) {
            stopPlayback();
            if (songKey === 'furElise') {
                noteEvents = genFurEliseData();
            } else if (songKey === 'autumnWhispers') {
                noteEvents = genAutumnWhispersData();
            }
            
            if (noteEvents.length > 0) {
                const lastEvent = noteEvents.reduce((prev, current) => 
                    (prev.time + prev.duration > current.time + current.duration) ? prev : current);
                duration = lastEvent.time + lastEvent.duration;
            } else {
                duration = 0;
            }
            
            currentSong = { notes: noteEvents };
            timeDisplay.textContent = `00:00 / ${formatTime(duration)}`;
            statusDisplay.textContent = `当前乐谱：${songSelector.options[songSelector.selectedIndex].text}，共 ${noteEvents.length} 个音符。`;
        }

        // 播放逻辑
        function playSong() {
            if (!noteEvents.length) {
                statusDisplay.textContent = "暂无有效曲目数据。";
                return;
            }
            
            if (isPlaying) {
                Tone.Transport.pause();
                isPlaying = false;
                statusDisplay.textContent = "已暂停";
                return;
            }
            
            if (Tone.context.state !== 'running') {
                Tone.context.resume();
            }
            
            if (currentPart) { currentPart.dispose(); }
            
            currentPart = new Tone.Part((time, note) => {
                sampler.triggerAttackRelease(note.note, note.duration, time, note.velocity);
                Tone.Draw.schedule(() => {
                    highlightKey(note.note, true);
                    setTimeout(() => { highlightKey(note.note, false); }, note.duration * 1000);
                }, time);
            }, noteEvents.map(e => [e.time, e]));
            
            currentPart.start(0);
            Tone.Transport.start();
            isPlaying = true;
            
            if (displayInterval) clearInterval(displayInterval);
            displayInterval = setInterval(updateTimeDisplay, 100);
            
            Tone.Transport.scheduleOnce(() => { stopPlayback(); }, duration);
            statusDisplay.textContent = "正在完美播放中...";
        }

        function pausePlayback() {
            if (isPlaying) {
                Tone.Transport.pause();
                isPlaying = false;
                statusDisplay.textContent = "播放已暂停";
            }
        }

        function stopPlayback() {
            Tone.Transport.stop();
            Tone.Transport.seconds = 0;
            if (currentPart) { currentPart.dispose(); currentPart = null; }
            isPlaying = false;
            if (displayInterval) { clearInterval(displayInterval); displayInterval = null; }
            timeDisplay.textContent = `00:00 / ${formatTime(duration)}`;
            statusDisplay.textContent = "播放已停止";
            document.querySelectorAll('.key.active, .black-key.active').forEach(k => k.classList.remove('active'));
            activeKeys.clear();
        }

        // 设置手动触屏/鼠标互动
        function setupKeyInteractions() {
            const pressedKeys = new Set();
            
            pianoContainer.addEventListener('mousedown', (e) => {
                e.preventDefault();
                if (e.target.classList.contains('key') || e.target.classList.contains('black-key')) {
                    const note = e.target.dataset.note;
                    if (note) { playNote(note); pressedKeys.add(note); }
                }
            });
            
            document.addEventListener('mouseup', () => { pressedKeys.clear(); });
            
            pianoContainer.addEventListener('touchstart', (e) => {
                e.preventDefault();
                Array.from(e.touches).forEach(touch => {
                    const el = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (el && (el.classList.contains('key') || el.classList.contains('black-key'))) {
                        const note = el.dataset.note;
                        if (note && !pressedKeys.has(note)) { playNote(note); pressedKeys.add(note); }
                    }
                });
            }, { passive: false });
            
            pianoContainer.addEventListener('touchend', () => { pressedKeys.clear(); });
        }

        // 加载用户本地JSON文件支持
        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            try {
                const text = await file.text();
                const json = JSON.parse(text);
                if(json.notes) {
                    noteEvents = json.notes;
                } else if(json.tracks) {
                    noteEvents = [];
                    json.tracks.forEach(tr => { if(tr.notes) noteEvents.push(...tr.notes); });
                }
                stopPlayback();
                if (noteEvents.length > 0) {
                    noteEvents.sort((a,b) => a.time - b.time);
                    const lastEvent = noteEvents.reduce((p, c) => (p.time + p.duration > c.time + c.duration) ? p : c);
                    duration = lastEvent.time + lastEvent.duration;
                }
                currentSong = json;
                timeDisplay.textContent = `00:00 / ${formatTime(duration)}`;
                statusDisplay.textContent = `成功加载外部文件，共 ${noteEvents.length} 个音符。`;
            } catch (err) {
                statusDisplay.textContent = `文件解析失败: ${err.message}`;
            }
        });

        songSelector.addEventListener('change', (e) => { loadPresetSong(e.target.value); });
        playBtn.addEventListener('click', playSong);
        pauseBtn.addEventListener('click', pausePlayback);
        stopBtn.addEventListener('click', stopPlayback);

        // 启动初始化流程
        createPianoKeys();
        setupKeyInteractions();
        loadPresetSong('furElise'); // 初始化默认自动加载第一首《致爱丽丝》
    </script>
</body>
</html>
