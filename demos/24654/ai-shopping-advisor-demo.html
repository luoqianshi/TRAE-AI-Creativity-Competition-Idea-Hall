<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>买之前问它 — AI 消费决策助手</title>
<style>
  :root {
    --buy: #27AE60;
    --wait: #F39C12;
    --skip: #E74C3C;
    --primary: #6366F1;
    --bg: #FAFAFA;
    --card: #FFFFFF;
    --text: #1E293B;
    --sub: #94A3B8;
    --border: #E2E8F0;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  .header {
    background: linear-gradient(135deg, #1E293B 0%, #334155 100%);
    color: white;
    text-align: center;
    padding: 28px 20px 22px;
  }
  .header .icon { font-size: 40px; margin-bottom: 6px; }
  .header h1 { font-size: 26px; letter-spacing: 1px; }
  .header .sub { font-size: 13px; color: #94A3B8; margin-top: 4px; }
  .header .track-badge {
    display: inline-block; margin-top: 10px;
    padding: 3px 14px; border-radius: 12px;
    font-size: 11px; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
  }

  .container { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }

  /* Demo scenarios */
  .demo-scenarios {
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px;
    -webkit-overflow-scrolling: touch;
  }
  .demo-chip {
    flex-shrink: 0; padding: 8px 14px;
    border-radius: 20px; background: white; border: 1.5px solid var(--border);
    font-size: 12px; cursor: pointer; transition: all .2s;
    white-space: nowrap; font-weight: 500;
  }
  .demo-chip:hover { border-color: var(--primary); }
  .demo-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

  /* Input card */
  .card {
    background: var(--card); border-radius: 14px; padding: 20px;
    margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  .card h2 { font-size: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .input-row { margin-bottom: 12px; }
  .input-row label { display: block; font-size: 12px; font-weight: 600; color: var(--sub); margin-bottom: 4px; }
  .input-row input, .input-row textarea {
    width: 100%; padding: 10px 14px;
    border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 14px; font-family: inherit; transition: border .2s;
    background: #FAFAFA;
  }
  .input-row input:focus, .input-row textarea:focus {
    outline: none; border-color: var(--primary); background: white;
  }
  .input-row textarea { min-height: 90px; resize: vertical; line-height: 1.6; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 12px 24px; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    border: none; transition: all .2s;
  }
  .btn-primary {
    background: var(--primary); color: white;
    width: 100%; justify-content: center;
  }
  .btn-primary:hover { background: #4F46E5; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.3); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-text { background: none; color: var(--primary); padding: 8px; font-size: 13px; }
  .btn-text:hover { background: #EEF2FF; border-radius: 8px; }

  /* Loading */
  .loading-overlay {
    display: none; text-align: center; padding: 32px 20px;
  }
  .loading-overlay.show { display: block; }
  .loading-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; }
  .loading-dots span {
    width: 8px; height: 8px; border-radius: 50%; background: var(--primary);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.30s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }
  .loading-text { font-size: 13px; color: var(--sub); }
  .loading-steps { margin-top: 12px; text-align: left; display: inline-block; }
  .loading-steps .ls {
    font-size: 12px; color: var(--sub); margin: 4px 0;
    opacity: 0.3; transition: all .3s;
    display: flex; align-items: center; gap: 6px;
  }
  .loading-steps .ls.done { opacity: 1; color: var(--buy); }
  .loading-steps .ls.current { opacity: 1; color: var(--primary); font-weight: 600; }

  /* Result */
  .result { display: none; }
  .result.show { display: block; animation: fadeSlide 0.5s ease; }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Verdict Banner */
  .verdict {
    border-radius: 14px; padding: 24px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 16px;
  }
  .verdict.buy { background: linear-gradient(135deg, #D1FAE5, #ECFDF5); border: 2px solid #A7F3D0; }
  .verdict.wait { background: linear-gradient(135deg, #FEF3C7, #FFFBEB); border: 2px solid #FCD34D; }
  .verdict.skip { background: linear-gradient(135deg, #FEE2E2, #FEF2F2); border: 2px solid #FECACA; }
  .verdict .v-emoji { font-size: 52px; flex-shrink: 0; }
  .verdict .v-text h3 { font-size: 20px; margin-bottom: 4px; }
  .verdict .v-text p { font-size: 13px; color: #666; line-height: 1.6; }
  .verdict.buy .v-text h3 { color: #065F46; }
  .verdict.wait .v-text h3 { color: #92400E; }
  .verdict.skip .v-text h3 { color: #991B1B; }

  /* Score bars */
  .score-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin-bottom: 16px;
  }
  @media (max-width: 420px) { .score-grid { grid-template-columns: 1fr; } }
  .score-item {
    background: white; border-radius: 10px; padding: 14px;
    border: 1px solid var(--border); text-align: center;
  }
  .score-item .s-label { font-size: 11px; color: var(--sub); margin-bottom: 4px; }
  .score-item .s-value { font-size: 26px; font-weight: 800; }
  .score-item .s-bar {
    height: 6px; border-radius: 3px; margin-top: 8px;
    background: #F1F5F9; overflow: hidden;
  }
  .score-item .s-bar-fill { height: 100%; border-radius: 3px; transition: width 1s ease; }
  .fill-green { background: var(--buy); }
  .fill-yellow { background: var(--wait); }
  .fill-red { background: var(--skip); }
  .fill-blue { background: var(--primary); }

  /* Analysis sections */
  .analysis-block {
    background: white; border-radius: 10px; padding: 18px;
    margin-bottom: 12px; border: 1px solid var(--border);
  }
  .analysis-block h4 {
    font-size: 13px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .analysis-block p { font-size: 13px; color: #555; line-height: 1.8; }
  .analysis-block ul { padding-left: 18px; font-size: 13px; color: #555; }
  .analysis-block ul li { margin-bottom: 6px; line-height: 1.6; }
  .highlight-box {
    background: #FEF3C7; border: 1px solid #FCD34D; border-radius: 8px;
    padding: 12px; margin-top: 10px; font-size: 13px;
  }
  .highlight-box.red { background: #FEE2E2; border-color: #FECACA; }
  .highlight-box.green { background: #D1FAE5; border-color: #A7F3D0; }
  .price-tag {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-weight: 700; font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
  }
  .price-high { background: #FEE2E2; color: #991B1B; }
  .price-low { background: #D1FAE5; color: #065F46; }
  .price-mid { background: #FEF3C7; color: #92400E; }

  /* Alternatives */
  .alt-card {
    border: 2px dashed var(--border); border-radius: 10px;
    padding: 16px; margin-top: 8px; cursor: pointer;
    transition: all .2s;
  }
  .alt-card:hover { border-color: var(--primary); background: #FAFAFE; }
  .alt-card .alt-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .alt-card .alt-name { font-weight: 600; font-size: 14px; }
  .alt-card .alt-price { font-weight: 700; color: var(--buy); }
  .alt-card .alt-reason { font-size: 12px; color: var(--sub); }

  /* Toast */
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: #1E293B; color: white; padding: 10px 22px;
    border-radius: 10px; font-size: 13px; z-index: 99;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .footer {
    text-align: center; padding: 24px 16px;
    color: var(--sub); font-size: 12px;
  }

  /* Quick input presets */
  .quick-fill {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .quick-fill button {
    padding: 4px 10px; border-radius: 14px;
    border: 1px solid var(--border); background: white;
    font-size: 11px; cursor: pointer; color: var(--sub);
    transition: all .15s;
  }
  .quick-fill button:hover { border-color: var(--primary); color: var(--primary); }
</style>
</head>

    </div>
  </div>

  <!-- Result -->
  <div class="result" id="resultCard"></div>

</div>

<div class="footer">
  买之前问它 · 不卖货的 AI 消费参谋 &nbsp;|&nbsp; AI 创造力大赛

// ========== State ==========
let currentPreset = 0;

// ========== Init ==========
function init() { loadPreset(0); }
setTimeout(init, 50);

// ========== Load Preset ==========
function loadPreset(idx) {
  currentPreset = idx;
  document.querySelectorAll('.demo-chip').forEach(c => c.classList.remove('active'));

  if (idx === -1) {
    document.getElementById('productName').value = '';
    document.getElementById('productPrice').value = '';
    document.getElementById('productDesc').value = '';
    document.getElementById('userHesitation').value = '';
    document.querySelectorAll('.demo-chip').forEach((c, i) => { if (i === 5) c.classList.add('active'); });
    document.getElementById('productName').focus();
    return;
  }

  document.querySelectorAll('.demo-chip').forEach((c, i) => { if (i === idx) c.classList.add('active'); });
  const p = PRESETS[idx];
  document.getElementById('productName').value = p.name;
  document.getElementById('productPrice').value = p.price;
  document.getElementById('productDesc').value = p.desc;
  document.getElementById('userHesitation').value = p.hesitation;
}

// ========== Analyze ==========
async function analyze() {
  const name = document.getElementById('productName').value.trim();
  const desc = document.getElementById('productDesc').value.trim();
  if (!name && !desc) { showToast('请至少输入商品名称或描述'); return; }

  // Show loading
  document.getElementById('inputCard').style.display = 'none';
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('resultCard').innerHTML = '';
  document.getElementById('loadingCard').classList.add('show');

  // Animate loading steps
  for (let i = 0; i < 5; i++) {
    await sleep(500 + Math.random() * 400);
    const el = document.getElementById('ls' + i);
    if (i > 0) document.getElementById('ls' + (i-1)).classList.add('done');
    el.classList.add('current');
  }
  document.getElementById('ls4').classList.add('done');

  // Determine which analysis to show
  let analysis;
  if (currentPreset >= 0 && currentPreset < PRESETS.length) {
    const presetResult = PRESETS[currentPreset].result;
    if (currentPreset === 3) {
      analysis = SKIP_CREAM;
    } else {
      analysis = ANALYSES[presetResult];
    }
  } else {
    // Custom input - use a generic analysis
    analysis = ANALYSES['wait'];
  }

  await sleep(400);
  renderResult(analysis);

  document.getElementById('loadingCard').classList.remove('show');
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
}

function renderResult(a) {
  const scoresHTML = a.scores.map(s => `
    <div class="score-item">
      <div class="s-label">${s.label}</div>
      <div class="s-value" style="color:${s.width > 70 ? (s.width > 80 ? 'var(--skip)' : 'var(--wait)') : 'var(--buy)'}">${s.value}</div>
      <div class="s-bar"><div class="s-bar-fill ${s.color}" style="width:${s.width}%"></div></div>
    </div>
  `).join('');

  const trapsHTML = a.traps.map(t => `<li>${t}</li>`).join('');
  const altsHTML = a.alternatives.map(alt => `
    <div class="alt-card">
      <div class="alt-header">
        <span class="alt-name">${alt.name}</span>
        <span class="alt-price">${alt.price}</span>
      </div>
      <div class="alt-reason">${alt.reason}</div>
    </div>
  `).join('');

  const html = `
    <div class="verdict ${a.verdict}">
      <div class="v-emoji">${a.emoji}</div>
      <div class="v-text">
        <h3>${a.title}</h3>
        <p>${a.subtitle}</p>
      </div>
    </div>

    <div class="score-grid">${scoresHTML}</div>

    <div class="analysis-block">
      <h4>⚠️ 营销话术拆解（官方不会告诉你的）</h4>
      <ul>${trapsHTML}</ul>
    </div>

    <div class="analysis-block">
      <h4>💰 真实成本核算</h4>
      <p>${a.realCost}</p>
    </div>

    <div class="analysis-block">
      <h4>🔄 替代方案（少花钱办同样的事）</h4>
      ${altsHTML}
    </div>

    <div class="analysis-block">
      <h4>📋 最终建议</h4>
      <p>${a.finalNote}</p>
    </div>

    <div style="text-align:center;margin-top:20px;">
      <button class="btn btn-primary" style="width:auto;" onclick="resetDemo()">
        🔄 再测一个
      </button>
      <button class="btn btn-text" onclick="shareResult()" style="margin-left:8px;">
        📤 分享结果
      </button>
    </div>
  `;

  document.getElementById('resultCard').innerHTML = html;
}

// ========== Helpers ==========
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function resetDemo() {
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('resultCard').innerHTML = '';
  document.getElementById('inputCard').style.display = 'block';
  document.getElementById('inputCard').scrollIntoView({ behavior: 'smooth' });
  // Reset loading steps
  document.querySelectorAll('.loading-steps .ls').forEach(el => {
    el.classList.remove('done', 'current');
  });
}

function shareResult() {
  const text = '我用「买之前问它」测了一个想买的东西，AI 帮我省了一大笔钱 👉 [分享自 AI消费决策助手]';
  navigator.clipboard.writeText(text).then(() => {
    showToast('✅ 已复制分享文案，发到朋友圈吧');
  }).catch(() => showToast('请手动复制分享'));
}

// Keyboard shortcut
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'Enter') {
    e.preventDefault();
    analyze();
  }
});
</script>
