<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>赌酒筹码</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Press Start 2P', 'Courier New', monospace;
    background-color: #0d3b1f;
    background-image:
      radial-gradient(circle at 2px 2px, rgba(255, 215, 0, 0.06) 1px, transparent 1px),
      radial-gradient(circle at 6px 6px, rgba(0, 255, 128, 0.04) 1px, transparent 1px),
      repeating-linear-gradient(
        45deg,
        transparent,
        transparent 8px,
        rgba(0, 0, 0, 0.15) 8px,
        rgba(0, 0, 0, 0.15) 9px
      ),
      repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 8px,
        rgba(0, 0, 0, 0.1) 8px,
        rgba(0, 0, 0, 0.1) 9px
      );
    background-size: 8px 8px, 8px 8px, auto, auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 20px;
    position: relative;
  }

  /* 像素字体降级模拟 */
  @supports not (font-family: 'Press Start 2P') {
    body {
      font-family: 'Courier New', monospace;
      letter-spacing: -0.5px;
      font-weight: bold;
      image-rendering: pixelated;
    }
  }

  /* 赌桌边缘装饰 */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border: 8px solid #8b0000;
    box-shadow:
      inset 0 0 0 4px #0d3b1f,
      inset 0 0 0 8px #b8860b,
      inset 0 0 30px rgba(0, 0, 0, 0.5);
    pointer-events: none;
    z-index: 100;
  }

  .game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    width: 100%;
    max-width: 400px;
    z-index: 1;
  }

  /* 主按钮 - 筹码样式 */
  .chip-btn {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    position: relative;
    background:
      radial-gradient(circle at 30% 30%, #c41e3a 0%, #8b0000 40%, #5c0000 100%);
    box-shadow:
      0 0 0 6px #ffd700,
      0 0 0 10px #b8860b,
      0 0 0 14px #ffd700,
      0 0 0 18px #8b6914,
      0 8px 0 18px rgba(0, 0, 0, 0.4),
      0 12px 20px rgba(0, 0, 0, 0.5),
      inset 0 -10px 20px rgba(0, 0, 0, 0.3),
      inset 0 10px 20px rgba(255, 255, 255, 0.1);
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: 28px;
    color: #0a2a15;
    text-shadow:
      1px 1px 0 rgba(255, 215, 0, 0.3),
      -1px -1px 0 rgba(0, 0, 0, 0.2);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    letter-spacing: 2px;
    font-weight: bold;
  }

  /* 筹码上的花纹 */
  .chip-btn::before {
    content: '';
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    bottom: 15px;
    border-radius: 50%;
    border: 4px dashed rgba(255, 215, 0, 0.4);
    pointer-events: none;
  }

  .chip-btn::after {
    content: '';
    position: absolute;
    top: 30px;
    left: 30px;
    right: 30px;
    bottom: 30px;
    border-radius: 50%;
    border: 2px solid rgba(255, 215, 0, 0.2);
    pointer-events: none;
  }

  .chip-btn:active:not(:disabled) {
    transform: scale(0.93);
    box-shadow:
      0 0 0 6px #ffd700,
      0 0 0 10px #b8860b,
      0 0 0 14px #ffd700,
      0 0 0 18px #8b6914,
      0 2px 0 18px rgba(0, 0, 0, 0.4),
      0 4px 10px rgba(0, 0, 0, 0.5),
      inset 0 -5px 15px rgba(0, 0, 0, 0.4),
      inset 0 5px 15px rgba(255, 255, 255, 0.1);
  }

  .chip-btn:disabled {
    cursor: not-allowed;
    opacity: 0.7;
    filter: grayscale(0.3);
  }

  .chip-btn .btn-text {
    position: relative;
    z-index: 2;
  }

  /* 指令显示区 */
  .instruction-panel {
    width: 100%;
    min-height: 160px;
    background: #0a0a0a;
    border: 4px solid #b8860b;
    box-shadow:
      0 0 0 2px #0a0a0a,
      0 0 0 6px #ffd700,
      0 0 20px rgba(255, 215, 0, 0.2),
      inset 0 0 20px rgba(0, 255, 128, 0.05);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    image-rendering: pixelated;
  }

  /* 像素边角装饰 */
  .instruction-panel::before,
  .instruction-panel::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    background: #39ff14;
    box-shadow: 0 0 10px #39ff14;
  }

  .instruction-panel::before {
    top: -8px;
    left: -8px;
  }

  .instruction-panel::after {
    bottom: -8px;
    right: -8px;
  }

  .instruction-text {
    font-size: 16px;
    line-height: 2;
    color: #ffd700;
    text-shadow:
      0 0 5px rgba(255, 215, 0, 0.5),
      0 0 10px rgba(255, 215, 0, 0.3),
      2px 2px 0 #000;
    word-break: break-all;
    letter-spacing: 1px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .instruction-text.neon-green {
    color: #39ff14;
    text-shadow:
      0 0 5px rgba(57, 255, 20, 0.6),
      0 0 10px rgba(57, 255, 20, 0.4),
      2px 2px 0 #000;
  }

  .instruction-note {
    font-size: 10px;
    color: #888;
    margin-top: 12px;
    text-shadow: none;
    letter-spacing: 0.5px;
    line-height: 1.6;
  }

  /* 滚动闪烁效果 */
  .instruction-text.rolling {
    animation: rollFlicker 0.08s infinite;
  }

  @keyframes rollFlicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  /* 指令揭晓动画 */
  .instruction-text.reveal {
    animation: revealFlash 0.4s ease-out;
  }

  @keyframes revealFlash {
    0% {
      transform: scale(0.8);
      opacity: 0;
      filter: brightness(2);
    }
    50% {
      transform: scale(1.1);
      filter: brightness(1.5);
    }
    100% {
      transform: scale(1);
      opacity: 1;
      filter: brightness(1);
    }
  }

  /* 下一位按钮 */
  .next-btn {
    display: none;
    padding: 16px 36px;
    background: linear-gradient(180deg, #b8860b 0%, #8b6914 50%, #6b4f0f 100%);
    border: 4px solid #ffd700;
    box-shadow:
      0 4px 0 #5c420a,
      0 6px 10px rgba(0, 0, 0, 0.4),
      inset 0 2px 0 rgba(255, 255, 255, 0.2);
    color: #0a0a0a;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 2px;
    position: relative;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    text-shadow: 1px 1px 0 rgba(255, 215, 0, 0.3);
  }

  .next-btn::before {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    right: 2px;
    bottom: 2px;
    border: 2px solid rgba(0, 0, 0, 0.3);
    pointer-events: none;
  }

  .next-btn:active {
    transform: translateY(4px);
    box-shadow:
      0 0 0 #5c420a,
      0 2px 5px rgba(0, 0, 0, 0.4),
      inset 0 2px 0 rgba(255, 255, 255, 0.2);
  }

  .next-btn.visible {
    display: inline-block;
    animation: btnAppear 0.3s ease-out;
  }

  @keyframes btnAppear {
    0% {
      opacity: 0;
      transform: translateY(10px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* 状态指示小点 */
  .status-dots {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 8px;
    z-index: 200;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #333;
    border: 2px solid #555;
    opacity: 0.3;
  }

  .status-dot.active {
    background: #39ff14;
    border-color: #39ff14;
    box-shadow: 0 0 8px #39ff14;
    opacity: 1;
  }

  .status-dot.extra {
    background: #ff6b35;
    border-color: #ff6b35;
    box-shadow: 0 0 8px #ff6b35;
    opacity: 1;
  }

  .status-dot.multiplier {
    background: #ffd700;
    border-color: #ffd700;
    box-shadow: 0 0 8px #ffd700;
    opacity: 1;
  }

  /* 标题 */
  .game-title {
    font-size: 12px;
    color: #ffd700;
    text-shadow:
      2px 2px 0 #8b0000,
      0 0 10px rgba(255, 215, 0, 0.3);
    letter-spacing: 4px;
    margin-bottom: 10px;
    text-align: center;
    line-height: 1.8;
  }

  .game-title .sub {
    font-size: 8px;
    color: #39ff14;
    text-shadow: 0 0 5px rgba(57, 255, 20, 0.5);
    display: block;
    letter-spacing: 6px;
  }

  /* 闪烁边框效果 */
  @keyframes borderGlow {
    0%, 100% { box-shadow: 0 0 0 2px #0a0a0a, 0 0 0 6px #ffd700, 0 0 20px rgba(255, 215, 0, 0.2); }
    50% { box-shadow: 0 0 0 2px #0a0a0a, 0 0 0 6px #39ff14, 0 0 25px rgba(57, 255, 20, 0.3); }
  }

  .instruction-panel.glow {
    animation: borderGlow 1.5s ease-in-out infinite;
  }

  /* 小屏适配 */
  @media (max-height: 600px) {
    .chip-btn {
      width: 140px;
      height: 140px;
      font-size: 22px;
    }
    .instruction-panel {
      min-height: 120px;
      padding: 16px;
    }
    .instruction-text {
      font-size: 13px;
      line-height: 1.8;
    }
    .game-container {
      gap: 20px;
    }
  }

  @media (max-height: 480px) {
    .chip-btn {
      width: 120px;
      height: 120px;
      font-size: 18px;
    }
    .game-title {
      display: none;
    }
  }
</style>
</head>
<body>
  <div class="status-dots">
    <div class="status-dot" id="dotExtra" title="额外回合"></div>
    <div class="status-dot" id="dotMultiplier" title="加倍状态"></div>
    <div class="status-dot" id="dotSpecified" title="已指定过人"></div>
  </div>

  <div class="game-container">
    <div class="game-title">
      赌 酒 筹 码
      <span class="sub">★ DRINK OR DARE ★</span>
    </div>

    <button class="chip-btn" id="chipBtn">
      <span class="btn-text">点我</span>
    </button>

    <div class="instruction-panel" id="instructionPanel">
      <div class="instruction-text" id="instructionText"></div>
      <div class="instruction-note" id="instructionNote"></div>
    </div>

    <button class="next-btn" id="nextBtn">下一位 →</button>
  </div>

<script>
(function() {
  'use strict';

  // 状态变量
  let hasSpecified = false;
  let drinkMultiplier = 1;
  let extraTurn = false;
  let isRolling = false;

  // DOM 元素
  const chipBtn = document.getElementById('chipBtn');
  const nextBtn = document.getElementById('nextBtn');
  const instructionText = document.getElementById('instructionText');
  const instructionNote = document.getElementById('instructionNote');
  const instructionPanel = document.getElementById('instructionPanel');
  const dotExtra = document.getElementById('dotExtra');
  const dotMultiplier = document.getElementById('dotMultiplier');
  const dotSpecified = document.getElementById('dotSpecified');

  // 更新状态指示点
  function updateStatusDots() {
    dotExtra.classList.toggle('extra', extraTurn);
    dotMultiplier.classList.toggle('multiplier', drinkMultiplier > 1);
    dotSpecified.classList.toggle('active', hasSpecified);
  }

  // 指令池（原始模板）
  const instructions = [
    { id: 1, text: '你喝1口。', type: 'selfDrink', sips: 1 },
    { id: 2, text: '你喝2口。', type: 'selfDrink', sips: 2 },
    { id: 3, text: '你指定一个人，让他喝1口。', type: 'specify', sips: 1 },
    { id: 4, text: '你指定一个人，让他喝2口。', type: 'specify', sips: 2 },
    { id: 5, text: '所有女生喝1口。', type: 'groupDrink', sips: 1 },
    { id: 6, text: '所有男生喝1口。', type: 'groupDrink', sips: 1 },
    { id: 7, text: '全场所有人喝1口。', type: 'groupDrink', sips: 1 },
    { id: 8, text: '全场干杯。', type: 'groupDrink', sips: 99 },
    { id: 9, text: '你左手边的人喝1口。', type: 'otherDrink', sips: 1 },
    { id: 10, text: '你右手边的人喝1口。', type: 'otherDrink', sips: 1 },
    { id: 11, text: '你上一次指定过的人再喝1口。', type: 'lastSpecified', sips: 1 },
    { id: 12, text: '命运逆转：由你左手边的人指定一个人喝1口。', type: 'reverse', sips: 1 },
    { id: 13, text: '免罪金牌：你本轮不喝，但下一条让你喝酒的指令，酒量加倍。', type: 'shield', sips: 0 },
    { id: 14, text: '命运的玩笑：这条指令无效，直接点击下一位。', type: 'skip', sips: 0 },
    { id: 15, text: '你喝1口，然后额外再点一次按钮。', type: 'extraTurn', sips: 1 },
    { id: 16, text: '往公杯里加 X 口酒。', type: 'publicCupAdd', sips: 0 },
    { id: 17, text: '喝掉公杯里所有的酒。如果公杯是空的，你喝1口。', type: 'publicCupDrink', sips: 1 },
    { id: 18, text: '把手机交给在场的任意一个人，由他/她继续。', type: 'passPhone', sips: 0 },
    { id: 19, text: '公杯加满到 5 口。如果公杯已超过 5 口，改为你喝1口。', type: 'publicCupFill', sips: 1 },
    { id: 20, text: '你与右手边的人交换手机，并由对方点一次按钮。', type: 'swapPhone', sips: 0 }
  ];

  // 喝酒相关指令ID（当前玩家喝酒的指令）
  const selfDrinkIds = [1, 2, 5, 6, 7, 8, 9, 10, 11];

  // 获取随机指令（等概率）
  function getRandomInstruction() {
    const idx = Math.floor(Math.random() * instructions.length);
    return { ...instructions[idx] };
  }

  // 随机整数 1~max
  function randInt(max) {
    return Math.floor(Math.random() * max) + 1;
  }

  // 处理指令逻辑，返回最终显示的文本和备注
  function processInstruction(inst) {
    let displayText = inst.text;
    let noteText = '';
    let shouldResetMultiplier = false;
    let isSelfDrink = false;

    // 额外回合冲突处理：指令18、20替换
    if (extraTurn && (inst.id === 18 || inst.id === 20)) {
      const sips = Math.ceil(1 * drinkMultiplier);
      displayText = `你喝${sips}口。`;
      noteText = '（额外回合自动替换）';
      shouldResetMultiplier = true;
      isSelfDrink = true;
      extraTurn = false;
      return { displayText, noteText, shouldResetMultiplier, isSelfDrink, instId: 1 };
    }

    switch (inst.id) {
      case 1:
      case 2:
        // 自己喝酒，应用倍数
        isSelfDrink = true;
        const sips1 = Math.ceil(inst.sips * drinkMultiplier);
        displayText = `你喝${sips1}口。`;
        if (drinkMultiplier > 1) {
          noteText = '（酒量加倍）';
        }
        shouldResetMultiplier = true;
        break;

      case 3:
      case 4:
        // 指定别人喝，设置 hasSpecified
        hasSpecified = true;
        break;

      case 5:
      case 6:
      case 7:
      case 8:
        // 群体喝酒，自己也喝
        isSelfDrink = true;
        if (inst.id === 8) {
          displayText = '全场干杯。';
          if (drinkMultiplier > 1) {
            noteText = '（你的酒量加倍）';
          }
        } else {
          const sipsG = Math.ceil(inst.sips * drinkMultiplier);
          if (inst.id === 5) displayText = `所有女生喝${sipsG}口。`;
          else if (inst.id === 6) displayText = `所有男生喝${sipsG}口。`;
          else displayText = `全场所有人喝${sipsG}口。`;
          if (drinkMultiplier > 1) {
            noteText = '（你的酒量加倍）';
          }
        }
        shouldResetMultiplier = true;
        break;

      case 9:
      case 10:
        // 旁边的人喝，自己不喝
        break;

      case 11:
        // 上一次指定的人喝
        if (!hasSpecified) {
          const sips11 = Math.ceil(1 * drinkMultiplier);
          displayText = `你喝${sips11}口。`;
          noteText = '（首次默认）';
          shouldResetMultiplier = true;
          isSelfDrink = true;
        }
        break;

      case 12:
        // 命运逆转，别人指定
        break;

      case 13:
        // 免罪金牌，设置倍数为2
        drinkMultiplier = 2;
        break;

      case 14:
        // 命运的玩笑，跳过
        break;

      case 15:
        // 额外回合，先喝1口（应用倍数），然后按钮恢复
        isSelfDrink = true;
        const sips15 = Math.ceil(1 * drinkMultiplier);
        displayText = `你喝${sips15}口，然后额外再点一次按钮。`;
        if (drinkMultiplier > 1) {
          noteText = '（酒量加倍）';
        }
        shouldResetMultiplier = true;
        extraTurn = true;
        break;

      case 16:
        // 公杯加X口
        const x = randInt(3);
        displayText = `往公杯里加 ${x} 口酒。`;
        break;

      case 17:
        // 喝掉公杯所有酒
        isSelfDrink = true;
        if (drinkMultiplier > 1) {
          displayText = '喝掉公杯里所有的酒，酒量加倍。（若公杯空，喝2口）';
          noteText = '（酒量加倍）';
        } else {
          displayText = '喝掉公杯里所有的酒。如果公杯是空的，你喝1口。';
        }
        shouldResetMultiplier = true;
        break;

      case 18:
        // 把手机交给任意人
        break;

      case 19:
        // 公杯加满到5口，超过则自己喝1口
        isSelfDrink = true;
        const sips19 = Math.ceil(1 * drinkMultiplier);
        displayText = `公杯加满到 5 口。如果公杯已超过 5 口，改为你喝${sips19}口。`;
        if (drinkMultiplier > 1) {
          noteText = '（若改喝，酒量加倍）';
        }
        shouldResetMultiplier = true;
        break;

      case 20:
        // 交换手机
        break;
    }

    // 重置倍数
    if (shouldResetMultiplier) {
      drinkMultiplier = 1;
    }

    return { displayText, noteText, shouldResetMultiplier, isSelfDrink, instId: inst.id };
  }

  // 滚动效果的随机文字
  const rollChars = '喝干杯酒指定传交换命运逆转免罪金牌公杯加全场左右';
  function getRandomRollText() {
    let text = '';
    const len = 4 + Math.floor(Math.random() * 6);
    for (let i = 0; i < len; i++) {
      text += rollChars[Math.floor(Math.random() * rollChars.length)];
    }
    return text;
  }

  // 主按钮点击
  chipBtn.addEventListener('click', function() {
    if (isRolling) return;
    if (chipBtn.disabled) return;

    isRolling = true;
    chipBtn.disabled = true;
    instructionNote.textContent = '';
    instructionPanel.classList.add('glow');

    // 滚动效果
    instructionText.classList.add('rolling');
    instructionText.classList.remove('reveal', 'neon-green');

    let rollCount = 0;
    const totalRolls = 12;
    const rollInterval = setInterval(function() {
      instructionText.textContent = getRandomRollText();
      rollCount++;

      if (rollCount >= totalRolls) {
        clearInterval(rollInterval);
        finalizeInstruction();
      }
    }, 40);
  });

  // 揭晓最终指令
  function finalizeInstruction() {
    const wasExtraTurn = extraTurn;
    const inst = getRandomInstruction();
    const result = processInstruction(inst);

    // 如果之前处于额外回合，且本次不是又抽到了额外回合指令，则消耗掉额外回合
    // （指令18/20在extraTurn下的替换逻辑已在processInstruction中主动清除了extraTurn）
    if (wasExtraTurn && inst.id !== 15 && inst.id !== 18 && inst.id !== 20) {
      extraTurn = false;
    }

    instructionText.classList.remove('rolling');
    instructionText.classList.add('reveal');
    instructionText.textContent = result.displayText;

    // 根据指令类型切换颜色
    if (inst.id === 13 || inst.id === 14) {
      instructionText.classList.add('neon-green');
    }

    if (result.noteText) {
      instructionNote.textContent = result.noteText;
    }

    isRolling = false;
    instructionPanel.classList.remove('glow');
    updateStatusDots();

    // 判断是否显示"下一位"按钮
    // extraTurn 为 true 时，不显示下一位，恢复主按钮
    if (extraTurn) {
      setTimeout(function() {
        chipBtn.disabled = false;
        nextBtn.classList.remove('visible');
      }, 300);
    } else {
      nextBtn.classList.add('visible');
    }
  }

  // 下一位按钮点击
  nextBtn.addEventListener('click', function() {
    // 清空指令
    instructionText.textContent = '';
    instructionText.classList.remove('reveal', 'neon-green');
    instructionNote.textContent = '';

    // 隐藏下一位按钮
    nextBtn.classList.remove('visible');

    // 恢复主按钮
    chipBtn.disabled = false;

    updateStatusDots();
  });

  // 阻止双击缩放
  let lastTouchEnd = 0;
  document.addEventListener('touchend', function(e) {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      e.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });

  // 初始化
  updateStatusDots();

  // 字体加载检测 - 如果字体加载失败，用样式模拟像素感
  document.fonts && document.fonts.ready.then(function() {
    // 字体加载完成，可以做一些调整
  }).catch(function() {
    // 字体加载失败，浏览器会自动用降级字体
  });

})();
</script>
</body>
</html>
