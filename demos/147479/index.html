<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洞潜挑战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060e1a;overflow:hidden;font-family:'Microsoft YaHei','PingFang SC','Helvetica Neue',sans-serif;color:#c0d8f0;user-select:none;-webkit-user-select:none}
canvas#gc{display:block;position:absolute;top:0;left:0;z-index:1}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#ui>*{pointer-events:auto}
.hidden{display:none!important}
/* ====== 面板通用 ====== */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,10,22,.92);z-index:20}
.overlay.dark{background:rgba(4,10,22,.97)}
/* ====== 主菜单 ====== */
#menu .title{font-size:56px;font-weight:900;letter-spacing:8px;background:linear-gradient(180deg,#70e8ff 0%,#2090d0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;filter:drop-shadow(0 0 20px rgba(60,200,255,.35))}
#menu .sub{font-size:15px;letter-spacing:5px;color:#4a80b0;margin-bottom:44px}
.btn{background:linear-gradient(135deg,#162e58,#0c1e3e);border:1.5px solid #285080;border-radius:10px;color:#90c8f0;font-size:17px;padding:13px 0;width:240px;margin:7px 0;cursor:pointer;letter-spacing:3px;transition:all .25s;text-align:center;display:block}
.btn:hover{background:linear-gradient(135deg,#28588a,#183860);border-color:#4a90d8;color:#c0e8ff;box-shadow:0 0 18px rgba(60,140,220,.3);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.sm{width:180px;padding:10px 0;font-size:14px}
/* ====== 关卡选择 ====== */
#lvSel{overflow-y:auto;padding:60px 20px 40px}
#lvSel h2{color:#70b8e8;font-size:26px;margin-bottom:20px;letter-spacing:3px}
.lv-grid{display:flex;flex-wrap:wrap;justify-content:center;max-width:740px;width:100%}
.lv-card{background:linear-gradient(145deg,#101e38,#0a1628);border:1.5px solid #1e4878;border-radius:14px;padding:18px 22px;width:260px;margin:8px;cursor:pointer;transition:all .3s;position:relative}
.lv-card:hover:not(.locked){border-color:#3888c8;transform:translateY(-3px);box-shadow:0 6px 24px rgba(50,120,200,.25)}
.lv-card.locked{opacity:.45;cursor:not-allowed;filter:grayscale(.3)}
.lv-card .stars{font-size:15px;color:#f0c040;margin-bottom:6px;letter-spacing:2px}
.lv-card .name{font-size:19px;font-weight:700;color:#80c0f0;margin-bottom:4px}
.lv-card .desc{font-size:12px;color:#4a7aa0;margin-bottom:8px;line-height:1.4}
.lv-card .meta{font-size:11px;color:#3a6888}
.lv-card .meta b{color:#60a8d0}
.lv-card .badge{position:absolute;top:12px;right:12px;font-size:11px;padding:2px 8px;border-radius:6px}
.lv-card .badge.cleared{background:rgba(40,180,80,.2);color:#40c060;border:1px solid rgba(40,180,80,.3)}
/* ====== 成就 ====== */
#achPanel{overflow-y:auto;padding:60px 20px 40px}
#achPanel h2{color:#70b8e8;font-size:26px;margin-bottom:16px;letter-spacing:3px}
.ach-list{max-width:520px;width:100%}
.ach-row{background:rgba(16,30,56,.7);border:1px solid #1e3860;border-radius:8px;padding:12px 16px;margin:6px 0;display:flex;align-items:center;gap:12px;font-size:14px;transition:all .2s}
.ach-row.on{border-color:#28804a;background:rgba(16,50,36,.5)}
.ach-row .ico{font-size:26px;width:36px;text-align:center}
.ach-row .info{flex:1}
.ach-row .info strong{color:#a0d0f0}
.ach-row .info small{color:#4a7898;font-size:12px;display:block;margin-top:2px}
/* ====== 设置 ====== */
#setPanel{padding:60px 20px 40px}
#setPanel h2{color:#70b8e8;font-size:26px;margin-bottom:24px;letter-spacing:3px}
.set-row{display:flex;align-items:center;gap:16px;margin:12px 0;width:320px}
.set-row label{font-size:14px;color:#7098b8;width:100px;flex-shrink:0}
.set-row input[type=range]{flex:1;accent-color:#40b0e0;height:6px}
.set-row input[type=text]{background:#0c1a30;border:1px solid #284868;color:#b0d0e8;padding:7px 12px;border-radius:6px;width:140px;font-size:14px;outline:none}
.set-row input[type=text]:focus{border-color:#4090c8}
.set-row .val{font-size:12px;color:#5080a0;width:30px;text-align:right}
/* ====== HUD ====== */
#hud{position:absolute;inset:0;pointer-events:none;z-index:15}
.hud-o2{position:absolute;top:18px;left:18px}
.hud-o2 .bar-bg{width:190px;height:16px;background:rgba(0,0,0,.55);border-radius:8px;border:1px solid #284868;overflow:hidden;position:relative}
.hud-o2 .bar-fill{height:100%;border-radius:8px;transition:width .15s linear}
.hud-o2 .bar-fill.flash{animation:barFlash .4s infinite}
@keyframes barFlash{0%,100%{opacity:1}50%{opacity:.45}}
.hud-o2 .lbl{font-size:11px;color:#6898b8;margin-top:3px}
.hud-right{position:absolute;top:18px;right:18px;text-align:right}
.hud-right div{font-size:13px;margin:4px 0}
.hud-depth{color:#40b8e8}
.hud-turb{color:#e09840}
.hud-time{color:#7090a8}
.hud-weather{color:#5880a0;font-size:12px}
.hud-lung{color:#c070d0;font-size:13px;margin:4px 0}
.hud-deco{color:#60a080;font-size:12px;margin:4px 0}
.hud-bottom{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);text-align:center}
.hud-hint{font-size:12px;color:#406888;opacity:.8}
.hud-drag{font-size:15px;color:#e09030;margin-top:6px;display:none;animation:blinkAnim 1s infinite}
@keyframes blinkAnim{0%,100%{opacity:1}50%{opacity:.25}}
/* ====== 倒计时 ====== */
#cdOverlay{z-index:30;background:rgba(4,10,22,.3)}
#cdOverlay .cd-title{font-size:16px;color:#5080a0;margin-bottom:8px;letter-spacing:2px}
#cdOverlay .cd-num{font-size:110px;font-weight:900;color:#50d8ff;text-shadow:0 0 50px rgba(60,200,255,.5);animation:cdPulse .6s ease-out}
@keyframes cdPulse{0%{transform:scale(1.6);opacity:0}40%{opacity:1}100%{transform:scale(1)}}
#cdOverlay .cd-hint{font-size:13px;color:#406888;margin-top:8px}
/* ====== 结算 ====== */
.result-box{background:linear-gradient(145deg,#0e1e38,#081428);border:1.5px solid #285888;border-radius:16px;padding:36px 44px;text-align:center;max-width:400px;width:88%}
.result-box h2{font-size:26px;margin-bottom:18px;letter-spacing:2px}
.result-box .st{font-size:15px;margin:8px 0;color:#80a8c0}
.result-box .st b{color:#50d0f0}
.result-box .btns{margin-top:22px}
/* ====== Toast ====== */
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(8,18,34,.94);border:1.5px solid #40b0e0;border-radius:10px;padding:16px 36px;font-size:16px;color:#60d0f0;z-index:40;pointer-events:none;display:none;white-space:nowrap;animation:toastAnim 2.2s forwards}
@keyframes toastAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(.85)}8%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0}}
/* ====== 成就弹窗 ====== */
#achPop{position:fixed;top:18px;right:18px;background:linear-gradient(135deg,#142e28,#0c2018);border:1.5px solid #30905a;border-radius:10px;padding:14px 22px;z-index:35;display:none;animation:achSlide .5s ease-out;pointer-events:none}
#achPop.show{display:block}
@keyframes achSlide{from{transform:translateX(280px);opacity:0}to{transform:translateX(0);opacity:1}}
#achPop .ap-title{font-size:12px;color:#40c080;margin-bottom:4px}
#achPop .ap-name{font-size:17px;font-weight:700;color:#80f0b0}
#achPop .ap-desc{font-size:12px;color:#508868;margin-top:3px}
/* ====== 返回按钮 ====== */
.back{position:absolute;top:16px;left:16px;background:none;border:1px solid #284868;color:#5080a0;padding:7px 14px;border-radius:7px;cursor:pointer;font-size:13px;z-index:5;transition:all .2s}
.back:hover{border-color:#4090c8;color:#90c0e0}
.hud-back{position:absolute;top:12px;right:12px;background:rgba(10,20,40,0.7);border:1px solid #284868;color:#5080a0;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px;z-index:35;transition:all .2s}
.hud-back:hover{border-color:#4090c8;color:#90c0e0;background:rgba(20,40,70,0.8)}
/* ====== 响应式 ====== */
@media(max-width:600px){
  #menu .title{font-size:36px;letter-spacing:4px}
  .btn{width:200px;font-size:15px;padding:11px 0}
  .lv-card{width:90%;margin:6px auto}
  .hud-o2 .bar-bg{width:140px;height:14px}
}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="ui">
  <!-- 主菜单 -->
  <div id="menu" class="overlay">
    <div class="title">洞潜挑战</div>
    <div class="sub">CAVE DIVING CHALLENGE</div>
    <button class="btn" onclick="UI.showLevels()">开始游戏</button>
    <button class="btn" onclick="UI.showAch()">成就勋章</button>
    <button class="btn" onclick="UI.showSet()">游戏设置</button>
  </div>
  <!-- 关卡选择 -->
  <div id="lvSel" class="overlay hidden">
    <button class="back" onclick="UI.showMenu()">返回</button>
    <h2>选择洞穴</h2>
    <div class="lv-grid" id="lvGrid"></div>
  </div>
  <!-- 成就 -->
  <div id="achPanel" class="overlay hidden">
    <button class="back" onclick="UI.showMenu()">返回</button>
    <h2>成就勋章</h2>
    <div class="ach-list" id="achList"></div>
  </div>
  <!-- 设置 -->
  <div id="setPanel" class="overlay hidden">
    <button class="back" onclick="UI.showMenu()">返回</button>
    <h2>游戏设置</h2>
    <div class="set-row"><label>音效音量</label><input type="range" id="sVol" min="0" max="100" value="50"><span class="val" id="sVolV">50</span></div>
    <div class="set-row"><label>粒子密度</label><input type="range" id="sPart" min="1" max="10" value="5"><span class="val" id="sPartV">5</span></div>
    <div class="set-row"><label>玩家名称</label><input type="text" id="sName" maxlength="12"></div>
  </div>
  <!-- HUD -->
  <div id="hud" class="hidden">
    <button class="hud-back" onclick="if(G.phase==='play'){G.phase='menu';UI.show('menu')}else if(G.phase==='preview'){G.phase='menu';UI.show('menu')}">✕ 退出</button>
    <div class="hud-o2">
      <div class="bar-bg"><div class="bar-fill" id="o2Fill"></div></div>
      <div class="lbl" id="o2Lbl">氧气 100%</div>
    </div>
    <div class="hud-right">
      <div class="hud-depth" id="hDepth">深度 0.0m</div>
      <div class="hud-turb" id="hTurb">浑浊度 0</div>
      <div class="hud-time" id="hTime">00:00</div>
      <div class="hud-weather" id="hWeather"></div>
      <div class="hud-lung" id="hLung" style="color:#c070d0">肺部 正常</div>
      <div class="hud-deco" id="hDeco" style="color:#60a080;font-size:12px">氮负载 0%</div>
    </div>
    <div class="hud-bottom">
      <div class="hud-hint">WASD/方向键移动 | Shift/空格冲刺 | E拖拽遗体</div>
      <div class="hud-drag" id="hDrag">拖拽遗体中 — 氧气消耗增加!</div>
    </div>
  </div>
  <!-- 倒计时 -->
  <div id="cdOverlay" class="overlay dark hidden">
    <div class="cd-title">记住洞穴地形!</div>
    <div class="cd-num" id="cdNum">10</div>
    <div class="cd-hint" id="cdHint">观察入口位置和信物位置</div>
  </div>
  <!-- 结算 -->
  <div id="resultPanel" class="overlay dark hidden">
    <div class="result-box" id="resultBox"></div>
  </div>
</div>
<div id="toast"></div>
<div id="achPop">
  <div class="ap-title">成就解锁!</div>
  <div class="ap-name" id="apName"></div>
  <div class="ap-desc" id="apDesc"></div>
</div>

<script>
// ============================================================
//  洞潜挑战 — 完整单文件游戏
let fogMask=null;
//  纯 Canvas 2D 渲染 · localStorage 存档 · Web Audio 音效
// ============================================================

// ---------- 常量 ----------
const C = document.getElementById('gc');
const X = C.getContext('2d');
const PI = Math.PI, PI2 = PI * 2;
const EPS = 0.001;

function resize(){C.width=innerWidth;C.height=innerHeight}
addEventListener('resize',resize); resize();

// ---------- 工具函数 ----------
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rng=(a,b)=>a+Math.random()*(b-a);
const rngI=(a,b)=>Math.floor(rng(a,b+1));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const dist2=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);

// 点在多边形内 (射线法)
function pip(px,py,poly){
  let c=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const[xi,yi]=poly[i],[xj,yj]=poly[j];
    if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)c=!c;
  }
  return c;
}

// 点到线段最短距离
function dSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
  if(l2<EPS)return dist2(px,py,ax,ay);
  const t=clamp(((px-ax)*dx+(py-ay)*dy)/l2,0,1);
  return dist2(px,py,ax+t*dx,ay+t*dy);
}

// 检查点是否在洞穴可通行区域内
function inCave(px,py,lv){
  // 入口区域特殊处理：入口内部及紧邻区域视为可行走
  const en=lv.entry;
  if(px>=en.x-10&&px<=en.x+en.w+10&&py>=en.y-10&&py<=en.y+en.h+30)return true;
  // 必须在外墙内
  if(!pip(px,py,lv.outer))return false;
  // 不能在任何内墙内
  for(const w of lv.walls){
    if(pip(px,py,w))return false;
  }
  // 不能与任何墙壁边线太近(额外的安全距离)
  for(const w of lv.walls){
    for(let i=0;i<w.length;i++){
      const j=(i+1)%w.length;
      if(dSeg(px,py,w[i][0],w[i][1],w[j][0],w[j][1])<3)return false;
    }
  }
  for(let i=0;i<lv.outer.length;i++){
    const j=(i+1)%lv.outer.length;
    if(dSeg(px,py,lv.outer[i][0],lv.outer[i][1],lv.outer[j][0],lv.outer[j][1])<3)return false;
  }
  return true;
}

// 检查矩形区域是否与洞穴可行走区重叠
function rectInCave(cx,cy,r,lv){
  // 圆周密集采样 + 上下左右关键点
  const pts=[];
  for(let a=0;a<PI2;a+=PI/12){
    pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);
  }
  // 额外检查垂直方向（头和脚）
  pts.push([cx,cy-r*1.2],[cx,cy+r*1.2]);
  pts.push([cx,cy]);
  for(const[px,py] of pts){
    if(!inCave(px,py,lv))return false;
  }
  return true;
}

// 在洞穴内搜索一个有效位置（用于尸体生成等）
function findValidPos(lv,preferX,preferY,maxRadius){
  const r=maxRadius||8;
  // 优先尝试指定位置
  if(inCave(preferX,preferY,lv)&&rectInCave(preferX,preferY,r,lv)){
    return{x:preferX,y:preferY};
  }
  // 螺旋搜索附近区域
  for(let d=10;d<=200;d+=10){
    for(let a=0;a<PI2;a+=PI/6){
      const tx=preferX+Math.cos(a)*d;
      const ty=preferY+Math.sin(a)*d;
      if(inCave(tx,ty,lv)&&rectInCave(tx,ty,r,lv)){
        return{x:tx,y:ty};
      }
    }
  }
  // fallback：在出生点
  return{x:lv.spawn.x,y:lv.spawn.y};
}

// ---------- 关卡数据 ----------
// 坐标空间: 2400-3200 x, 1600-2400 y
// 外墙: 多边形(顺时针), 墙壁: 障碍多边形
// entry: 入口水域 {x,y,w,h}
// token: 信物 {x,y}
// narrow: 窄通道 [{x,y,w,h}]
// spawn: 出生点
// bodies: 预设遗体 [{x,y,name}]
// mapH: 地图总高度（用于深度计算）

  // ===== 关卡2: 蓝晶走廊（中等）=====

// ---------- 音效 (Web Audio) ----------
let AC=null;
function ensureAC(){if(!AC)AC=new(AudioContext||webkitAudioContext)();if(AC.state==='suspended')AC.resume()}
function tone(f,dur,type,vol){
  if(!AC)return;
  try{
    const v=clamp(vol*(SV.vol/50)*0.12,0,0.25);
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f,AC.currentTime);
    g.gain.setValueAtTime(v,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}
function sfxBubble(){tone(600+Math.random()*500,0.12,'sine',0.25)}
function sfxWarn(){tone(440,0.25,'square',0.4);setTimeout(()=>tone(440,0.25,'square',0.4),300)}
function sfxPickup(){tone(523,.12,'sine',0.35);setTimeout(()=>tone(659,.12,'sine',0.35),80);setTimeout(()=>tone(784,.2,'sine',0.35),160)}
function sfxWin(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'sine',0.35),i*130))}
function sfxDeath(){tone(180,.6,'sawtooth',0.25);setTimeout(()=>tone(140,.5,'sawtooth',0.2),200)}

function addBubble(x,y){
  G.bubbles.push({x:x+rng(-8,8),y,vx:rng(-0.4,0.4),vy:rng(-1.8,-0.6),r:rng(1.5,3.5),life:1,dec:rng(0.006,0.014)});
}
function addPart(x,y){
  G.particles.push({x:x+rng(-80,80),y:y+rng(-80,80),vx:rng(-0.15,0.15),vy:rng(-0.1,0.1),r:rng(0.5,1.2),life:1,dec:rng(0.003,0.007),a:rng(0.15,0.35)});
}
function updParticles(){
  const d=SV.partDens;
  if(G.phase==='play'&&G.player&&!G.player.atSurface&&Math.random()<0.025*d)addBubble(G.player.x,G.player.y);
  if(G.phase==='play'&&Math.random()<0.04*d)addPart(G.player.x,G.player.y);
  for(let i=G.bubbles.length-1;i>=0;i--){
    const b=G.bubbles[i]; b.x+=b.vx; b.y+=b.vy; b.vx+=rng(-0.03,0.03); b.life-=b.dec;
    if(b.life<=0)G.bubbles.splice(i,1);
  }
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i]; p.x+=p.vx; p.y+=p.vy; p.life-=p.dec;
    if(p.life<=0)G.particles.splice(i,1);
  }
}

// ---------- 游戏核心 ----------
const Game = {
  start(lv){
    ensureAC();
    G.level=lv;
    G.phase='preview';
    G.cdTimer=5;
    G.gameTime=0;
    G.dragBody=null;
    G.bubbles=[];G.particles=[];G.mouseTgt=null;
    G.weather=WEATHERS[rngI(0,WEATHERS.length-1)];
    // 根据北京时间适配天气：白天/黑夜只能出现对应时段的天气
    const bjH2=(new Date().getUTCHours()+8)%24;
    const night=bjH2<6||bjH2>=19;
    const pool=WEATHERS.filter(w=>night?w.night:w.day);
    if(pool.length)G.weather=pool[rngI(0,pool.length-1)];
    G.weather.day=!night;
    G.weatherT=0;

    // 初始化玩家
    const sp=lv.spawn;
    G.player={
      x:sp.x, y:sp.y,
      o2:lv.baseO2,
      turb:0,
      hasToken:false,
      isDead:false,
      dragging:null,
      moving:false, sprinting:false, angle:Math.PI/2,
      o2Warned:false,
      radius:8,
      atSurface:false,
      prevDepth:0,
      maxDepthReached:0,
      nitrogenLoad:0,
      lungPressure:0,
      ascentRate:0,
      decoWarning:false,
      lungWarning:false,
      lungDamaged:false
    };

    // 初始化遗体（验证所有遗体在洞穴内）
    if(!SV.caveBodies[lv.id]||SV.caveMapVer!==3){
      SV.caveBodies[lv.id]=lv.bodies.map(b=>{
        const pos=findValidPos(lv,b.x,b.y,6);
        return {...b, x:pos.x, y:pos.y, active:true};
      });
      SV.caveMapVer=3;
      save();
    }

    // 摄像机
    G.cam.x=G.player.x-C.width/2;
    G.cam.y=G.player.y-C.height/2;

    UI.hideAll();
    $('cdOverlay').classList.remove('hidden');
    $('cdNum').textContent='5';
    $('cdHint').textContent=`观察入口和信物 — ${lv.name}`;
  },

  updatePreview(dt){
    G.cdTimer-=dt;
    const n=Math.max(0,Math.ceil(G.cdTimer));
    $('cdNum').textContent=n;
    $('cdNum').style.animation='none';void $('cdNum').offsetWidth;$('cdNum').style.animation='cdPulse .6s ease-out';
    if(G.cdTimer<=1.5&&G.cdTimer>0)$('cdHint').textContent='地图即将隐藏!';
    if(G.cdTimer<=0){
      G.phase='play';
      G.lastTs=performance.now();
      $('cdOverlay').classList.add('hidden');
      $('hud').classList.remove('hidden');
      UI.toast('开始潜水 — 寻找信物并返回水面!');
    }
  },

  updatePlay(dt){
    const p=G.player, lv=G.level;
    if(p.isDead)return;

    G.gameTime+=dt;

    // 天气 (90秒换一次，仅在同时段天气池内切换)
    G.weatherT+=dt;
    if(G.weatherT>90){
      G.weatherT=0;
      const night2=G.weather.day===false;
      const pool2=WEATHERS.filter(w=>night2?w.night:w.day);
      if(pool2.length)G.weather=pool2[rngI(0,pool2.length-1)];
    }

    // 输入
    let dx=0,dy=0;
    const k=G.keys;
    if(k['w']||k['arrowup'])dy=-1;
    if(k['s']||k['arrowdown'])dy=1;
    if(k['a']||k['arrowleft'])dx=-1;
    if(k['d']||k['arrowright'])dx=1;

    // 鼠标点击移动
    if(G.mouseTgt&&dx===0&&dy===0){
      const mx=G.mouseTgt.x-p.x, my=G.mouseTgt.y-p.y, md=Math.hypot(mx,my);
      if(md>5){dx=mx/md;dy=my/md}else G.mouseTgt=null;
    }
    const ln=Math.hypot(dx,dy);
    if(ln>EPS){dx/=ln;dy/=ln}

    p.moving=ln>EPS;
    if(p.moving)p.angle=Math.atan2(dy,dx);
    p.sprinting=p.moving&&(k['shift']||k[' ']);
    const spd=(p.sprinting?200:120)*(p.o2<=0?0.5:1);
    let mvx=dx*spd*dt, mvy=dy*spd*dt;
    // 限制单帧步长不超过4px，防止穿墙
    const maxStep=4;
    if(Math.abs(mvx)>maxStep)mvx=Math.sign(mvx)*maxStep;
    if(Math.abs(mvy)>maxStep)mvy=Math.sign(mvy)*maxStep;

    // 分轴碰撞检测
    // 碰撞半径12：覆盖潜水员核心身体（渲染高36px，半径12覆盖24px核心区域）
    const bodyR=12;
    if(rectInCave(p.x+mvx,p.y,bodyR,lv))p.x+=mvx;
    if(rectInCave(p.x,p.y+mvy,bodyR,lv))p.y+=mvy;

    // 减速上升限制（9m/min安全速度）
    if(mvy<0){
      const depthR_tmp=clamp((p.y-lv.entry.y)/(lv.mapH-lv.entry.y),0,1);
      const depth_tmp=depthR_tmp*lv.maxDepth;
      if(depth_tmp>3){
        const mPerPx=lv.maxDepth/(lv.mapH-lv.entry.y);
        const maxAscentPx=0.15/mPerPx*dt;
        if(Math.abs(mvy)>maxAscentPx){
          mvy=-maxAscentPx;
        }
      }
    }

    // 深度
    const depthR=clamp((p.y-lv.entry.y)/(lv.mapH-lv.entry.y),0,1);
    const depth=depthR*lv.maxDepth;

    // 水面判断（在入口区域且Y坐标在入口上方）
    const atSurface=(p.y<=lv.entry.y+lv.entry.h&&p.x>=lv.entry.x-10&&p.x<=lv.entry.x+lv.entry.w+10);
    p.atSurface=atSurface;

    // 游泳气泡（仅在水下产生）
    if(p.moving&&!atSurface&&Math.random()<0.06)addBubble(p.x,p.y-10);

    // ===== 减压系统 =====
    // 计算上升速度
    p.ascentRate=(p.prevDepth-depth)/dt;
    p.prevDepth=depth;
    if(depth>p.maxDepthReached)p.maxDepthReached=depth;

    // 氮气吸收/释放（简化Haldane模型）
    if(depth>2){
      // 水下：吸收氮气
      p.nitrogenLoad+=depth*dt*0.0004;
    }else{
      // 水面/浅水：缓慢释放
      p.nitrogenLoad=Math.max(0,p.nitrogenLoad-dt*0.008);
    }
    p.nitrogenLoad=clamp(p.nitrogenLoad,0,2);

    // 免减压极限（简化公式）
    const ndlExceeded=p.nitrogenLoad>0.35;

    // 肺部压力 — 肺气压伤（真实潜水逻辑）
    // 只在深度>10m时开始累积（浅水即使上升快也安全，气体膨胀倍数小）
    if(depth>10&&p.ascentRate>0.15){
      // 深度因子：10m开始，30m时factor=1.0（越深越危险）
      const depthFactor=clamp((depth-10)/20,0,1);
      // 速度因子：0.15m/s(9m/min)安全线，0.3m/s(18m/min)危险，0.6m/s极危险
      const speedFactor=clamp((p.ascentRate-0.15)/0.45,0,2);
      // 综合损伤率 — 较慢累积，需要持续违规多次才会受损
      const damageRate=depthFactor*speedFactor*0.04;
      p.lungPressure+=damageRate*dt;
    }
    // 在浅水（<10m）快速恢复，模拟安全减压和气体排出
    if(depth<10)p.lungPressure=Math.max(0,p.lungPressure-dt*0.15);
    // 深水静止时也缓慢恢复（呼出膨胀气体）
    else if(!p.moving)p.lungPressure=Math.max(0,p.lungPressure-dt*0.04);
    p.lungPressure=clamp(p.lungPressure,0,2);

    // 肺部高压警告阶段（>1.0）：轻微氧气惩罚和提示
    if(p.lungPressure>=1.0&&depth>10){
      p.o2-=p.lungPressure*1.0*dt;
      if(!p.lungWarning&&p.lungPressure<1.5){
        p.lungWarning=true;
        UI.toast('⚠ 上升过快! 深度'+depth.toFixed(0)+'m 请减速并持续呼气!');
      }
    }

    // 肺部受损判定（阈值提高到1.5，需要较长时间违规）
    if(p.lungPressure>=1.5){
      p.lungDamaged=true;
      p.o2-=8*dt;
      if(!p.lungWarning){
        p.lungWarning=true;
        UI.toast('⚠ 肺部气压伤! 立即停止上升并呼气!');
      }
    }
    // 肺部警告重置（压力下降后）
    if(p.lungPressure<0.8)p.lungWarning=false;

    // 减压病风险提示
    if(ndlExceeded&&!p.decoWarning){
      p.decoWarning=true;
      UI.toast('⚠ 氮气负载过高! 需要减压停留!');
    }
    if(!ndlExceeded)p.decoWarning=false;

    // 氧气消耗（水面以上不消耗）
    if(!atSurface){
      let o2R=p.moving?(p.sprinting?2:1):0.5;
      if(depth>50)o2R+=0.3;
      // 窄通道
      let inNarrow=false;
      for(const n of lv.narrow){
        if(p.x>=n.x&&p.x<=n.x+n.w&&p.y>=n.y&&p.y<=n.y+n.h){inNarrow=true;break}
      }
      if(inNarrow)o2R+=0.5;
      // 拖拽
      if(p.dragging)o2R+=0.8;
      // 浑浊度修正
      o2R*=turbMult(p.turb);

      p.o2-=o2R*dt;
    }else{
      // 水面缓慢回氧
      p.o2=Math.min(p.o2+3*dt,lv.baseO2);
    }

    // 浑浊度 — 基于深度和移动的真实潜水逻辑（复用上面的depthR）
    const depthM=depthR*lv.maxDepth;
    // 浅水（<5m）基本无浑浊；中深水逐渐增加；深水更容易浑浊
    const depthTurbFactor=clamp((depthM-5)/lv.maxDepth,0,1);
    // 移动时根据深度系数增加浑浊
    if(p.moving&&!p.sprinting&&!p.atSurface)p.turb+=1.5*depthTurbFactor*dt;
    if(p.sprinting&&!p.atSurface)p.turb+=5*depthTurbFactor*dt;
    // 拖拽遗体严重搅动沉积物
    if(p.dragging)p.turb+=8*depthTurbFactor*dt;
    // 天气影响（仅雨天）
    p.turb+=G.weather.turbDelta*dt*0.08;
    // 浑浊度自然衰减（水流扩散）
    if(!p.moving&&!p.sprinting&&!p.dragging)p.turb=Math.max(0,p.turb-0.8*dt);
    p.turb=clamp(p.turb,0,100);

    // 视野
    G.viewR=viewR(p.turb);

    // 氧气警告
    if(p.o2<=20&&p.o2>0&&!p.o2Warned){p.o2Warned=true;sfxWarn()}
    if(p.o2>20)p.o2Warned=false;

    // 死亡
    if(p.o2<=-20){this.death();return}

    // 拾取信物
    if(!p.hasToken&&dist2(p.x,p.y,lv.token.x,lv.token.y)<22){
      p.hasToken=true;sfxPickup();UI.toast('拾取信物! 快返回水面!');
    }

    // 遗体拖拽
    if(k['e']&&!p.dragging){
      const bodies=SV.caveBodies[lv.id]||[];
      for(const b of bodies){
        if(b.active&&dist2(p.x,p.y,b.x,b.y)<28){
          p.dragging=b;sfxBubble();break;
        }
      }
    }
    if(!k['e']&&p.dragging){
      p.dragging=null;
    }
    if(p.dragging){
      p.dragging.x=lerp(p.dragging.x,p.x+14,6*dt);
      p.dragging.y=lerp(p.dragging.y,p.y+14,6*dt);
      $('hDrag').style.display='block';
    }else{
      $('hDrag').style.display='none';
    }

    // 入口检测
    const en=lv.entry;
    if(p.y<=en.y+en.h+5&&p.x>=en.x-5&&p.x<=en.x+en.w+5){
      if(p.hasToken){this.win();return}
      if(p.dragging){this.rescue(p.dragging);p.dragging=null}
    }

    // HUD
    this.updateHUD(depth);
  },

  updateHUD(depth){
    const p=G.player;
    const pct=clamp(p.o2/G.level.baseO2*100,0,100);
    const fill=$('o2Fill');
    fill.style.width=pct+'%';
    if(pct>50)fill.style.background='linear-gradient(90deg,#20c060,#40e880)';
    else if(pct>20)fill.style.background='linear-gradient(90deg,#e0b020,#e09040)';
    else{fill.style.background='linear-gradient(90deg,#d03030,#f05050)';fill.classList.add('flash')}
    if(pct>=20)fill.classList.remove('flash');
    $('o2Lbl').textContent=`氧气 ${pct.toFixed(1)}%`;
    $('hDepth').textContent=`深度 ${depth.toFixed(1)}m`;
    $('hTurb').textContent=`浑浊度 ${Math.floor(p.turb)}`;
    const m=Math.floor(G.gameTime/60),s=Math.floor(G.gameTime%60);
    $('hTime').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    $('hWeather').textContent=`${G.weather.icon} ${G.weather.name}`;

    // 肺部状态（更新阈值匹配新逻辑）
    const lungEl=$('hLung');
    if(p.lungDamaged){
      lungEl.textContent='肺部 ⚠受损!';
      lungEl.style.color='#ff4040';
    }else if(p.lungPressure>=1.0){
      lungEl.textContent='肺部 ⚠高压!';
      lungEl.style.color='#ff8040';
    }else if(p.lungPressure>=0.5){
      lungEl.textContent='肺部 注意';
      lungEl.style.color='#e0a040';
    }else{
      lungEl.textContent='肺部 正常';
      lungEl.style.color='#c070d0';
    }

    // 氮负载
    const nPct=Math.min(100,Math.floor(p.nitrogenLoad*100));
    const decoEl=$('hDeco');
    if(p.nitrogenLoad>0.7){
      decoEl.textContent=`氮负载 ${nPct}% ⚠需减压!`;
      decoEl.style.color='#ff6040';
    }else if(p.nitrogenLoad>0.35){
      decoEl.textContent=`氮负载 ${nPct}% 注意`;
      decoEl.style.color='#e0a040';
    }else{
      decoEl.textContent=`氮负载 ${nPct}%`;
      decoEl.style.color='#60a080';
    }
  },

  win(){
    G.phase='result'; sfxWin();
    const lv=G.level, p=G.player, t=G.gameTime;
    const st=SV.levels[lv.id]||{};
    st.cleared=true;
    if(!st.bestTime||t<st.bestTime)st.bestTime=t;
    SV.levels[lv.id]=st;
    SV.totalPlay+=t;
    // 解锁下一关
    const nx=LEVELS.find(l=>l.id===lv.id+1);
    if(nx){const ns=SV.levels[nx.id]||{};if(!ns.unlocked){ns.unlocked=true;SV.levels[nx.id]=ns}}
    save();
    // 成就
    UI.achPop(ACHS.find(a=>a.id==='first_clear'));
    if(LEVELS.every(l=>(SV.levels[l.id]||{}).cleared))UI.achPop(ACHS.find(a=>a.id==='all_clear'));
    if(t<lv.recSec)UI.achPop(ACHS.find(a=>a.id==='speed'));
    if(p.o2/lv.baseO2>0.5)UI.achPop(ACHS.find(a=>a.id==='o2master'));
    if(SV.totalPlay>600)UI.achPop(ACHS.find(a=>a.id==='play10'));
    // 结算
    $('hud').classList.add('hidden');
    $('resultBox').innerHTML=`
      <h2 style="color:#50e0ff">通关成功!</h2>
      <div class="st">关卡: <b>${lv.name}</b></div>
      <div class="st">用时: <b>${t.toFixed(1)}秒</b></div>
      <div class="st">剩余氧气: <b>${(Math.max(0,p.o2)/lv.baseO2*100).toFixed(1)}%</b></div>
      <div class="st">最终浑浊度: <b>${Math.floor(p.turb)}</b></div>
      <div class="st">最大深度: <b>${lv.maxDepth}m</b></div>
      <div class="btns">
        <button class="btn sm" onclick="Game.start(LEVELS.find(l=>l.id===${lv.id}))">重新挑战</button>
        <button class="btn sm" style="margin-top:6px" onclick="UI.showLevels()">关卡选择</button>
        <button class="btn sm" style="margin-top:6px" onclick="UI.showMenu()">返回主菜单</button>
      </div>`;
    UI.show('resultPanel');
  },

  death(){
    const p=G.player, lv=G.level;
    p.isDead=true; G.phase='result'; sfxDeath();
    const bodies=SV.caveBodies[lv.id]||[];
    // 遗体不会出现在洞口浅处，至少在水下30%最大深度或8米
    const minDepth=Math.max(8, lv.maxDepth*0.3);
    const curDepth=clamp((p.y-lv.entry.y)/(lv.mapH-lv.entry.y),0,1)*lv.maxDepth;
    let bx=p.x, by=p.y;
    if(curDepth<minDepth){
      // 将遗体推入更深处
      by=lv.entry.y+(minDepth/lv.maxDepth)*(lv.mapH-lv.entry.y)+rngI(20,80);
      bx=Math.max(lv.entry.x+20, Math.min(lv.entry.x+lv.entry.w-20, bx));
    }
    // 确保遗体在洞穴可行走区域内（不在墙内）
    const pos=findValidPos(lv,bx,by,6);
    bodies.push({x:pos.x,y:pos.y,name:SV.name,active:true});
    SV.caveBodies[lv.id]=bodies;
    SV.totalPlay+=G.gameTime; save();
    const depth=clamp((p.y-lv.entry.y)/(lv.mapH-lv.entry.y),0,1)*lv.maxDepth;
    $('hud').classList.add('hidden');
    $('resultBox').innerHTML=`
      <h2 style="color:#e05050">遇难</h2>
      <div class="st">关卡: <b>${lv.name}</b></div>
      <div class="st">遇难深度: <b>${depth.toFixed(1)}m</b></div>
      <div class="st">用时: <b>${G.gameTime.toFixed(1)}秒</b></div>
      <div class="st" style="color:#d07070;font-size:13px;margin-top:8px">遗体已留在洞穴中，可尝试救援</div>
      <div class="btns">
        <button class="btn sm" onclick="Game.start(LEVELS.find(l=>l.id===${lv.id}))">再次挑战</button>
        <button class="btn sm" style="margin-top:6px" onclick="UI.showLevels()">关卡选择</button>
        <button class="btn sm" style="margin-top:6px" onclick="UI.showMenu()">返回主菜单</button>
      </div>`;
    UI.show('resultPanel');
  },

  rescue(body){
    body.active=false; sfxWin(); save();
    UI.toast('成功救援遗体!');
    UI.achPop(ACHS.find(a=>a.id==='rescue'));
  }
};

function turbMult(t){return t<=30?1:t<=60?1.1:t<=80?1.25:1.4}
function viewR(t){return t<=30?160:t<=60?100:t<=80?65:40}

// ---------- 摄像机 ----------
function updCam(instant){
  if(!G.player)return;
  const tx=G.player.x-C.width/2, ty=G.player.y-C.height/2;
  if(instant){G.cam.x=tx;G.cam.y=ty}
  else{G.cam.x=lerp(G.cam.x,tx,0.08);G.cam.y=lerp(G.cam.y,ty,0.08)}
}

// ---------- 渲染 ----------
function render(){
  const W=C.width, H=C.height;
  X.clearRect(0,0,W,H);
  X.fillStyle='#040810';
  X.fillRect(0,0,W,H);

  if(G.phase==='menu'||G.phase==='result'){
    renderMenuBG(W,H); return;
  }
  if(!G.level)return;

  const lv=G.level, cam=G.cam;

  if(G.phase==='preview'){
    // 预览阶段：缩放显示整个洞穴全图
    const outer=lv.outer;
    let mnX=Infinity,mnY=Infinity,mxX=-Infinity,mxY=-Infinity;
    for(const p of outer){mnX=Math.min(mnX,p[0]);mnY=Math.min(mnY,p[1]);mxX=Math.max(mxX,p[0]);mxY=Math.max(mxY,p[1])}
    const cw=mxX-mnX+60, ch=mxY-mnY+60;
    const sc=Math.min(W/cw, H/ch)*0.92;
    const cx=(mnX+mxX)/2, cy=(mnY+mxY)/2;
    X.save();
    X.translate(W/2,H/2);
    X.scale(sc,sc);
    X.translate(-cx,-cy);

    // 天空背景
    const en=lv.entry;
    const wName=G.weather?G.weather.name:'晴天';
    const isDay=G.weather?!!G.weather.day:true;
    const t=performance.now()*0.001;
    let skyTop,skyBot;
    if(isDay){
      if(wName==='晴天'){skyTop='#5aa0e0';skyBot='#a0d8ff'}
      else if(wName==='小雨'){skyTop='#6080a0';skyBot='#8098b0'}
      else if(wName==='大雨'){skyTop='#485868';skyBot='#607080'}
      else{skyTop='#384050';skyBot='#485868'}
    }else{
      skyTop='#080c18';skyBot='#0e1424';
    }
    X.fillStyle=skyTop;
    X.fillRect(mnX-200,mnY-200,cw+400,ch+100);
    const skyG=X.createLinearGradient(0,mnY-200,0,en.y);
    skyG.addColorStop(0,skyTop);skyG.addColorStop(1,skyBot);
    X.fillStyle=skyG;X.fillRect(mnX-200,mnY-200,cw+400,en.y-mnY+200);

    // 地面（入口两侧）
    X.fillStyle=isDay?'#2a5520':'#0f2810';
    X.fillRect(mnX-200,en.y,cw+400,ch+200-(en.y-mnY));

    // 远山轮廓
    X.fillStyle=isDay?'rgba(40,55,75,0.6)':'rgba(20,25,40,0.6)';
    X.beginPath();X.moveTo(mnX-200,en.y);
    for(let mx2=mnX-200;mx2<=mxX+200;mx2+=40){
      const mh=15+Math.sin(mx2*0.02+1.3)*10+Math.sin(mx2*0.05)*6;
      X.lineTo(mx2,en.y-mh);
    }
    X.lineTo(mxX+200,en.y);X.closePath();X.fill();

    // 树木
    function drawTree(tx,ty,scale){
      X.save();X.translate(tx,ty);X.scale(scale,scale);
      X.fillStyle=isDay?'#3a2810':'#1a1408';
      X.fillRect(-2,-20,4,20);
      X.fillStyle=isDay?'#1a5818':'#0a2808';
      X.beginPath();X.arc(0,-28,10,0,PI2);X.fill();
      X.beginPath();X.arc(-6,-24,7,0,PI2);X.fill();
      X.beginPath();X.arc(6,-24,7,0,PI2);X.fill();
      X.fillStyle=isDay?'#2a6820':'#103810';
      X.beginPath();X.arc(-3,-30,6,0,PI2);X.fill();
      X.beginPath();X.arc(4,-31,5,0,PI2);X.fill();
      X.restore();
    }
    drawTree(en.x-35,en.y,1);
    drawTree(en.x-60,en.y-2,0.7);
    drawTree(en.x-15,en.y-1,0.6);
    drawTree(en.x+en.w+35,en.y,1);
    drawTree(en.x+en.w+60,en.y-2,0.7);
    drawTree(en.x+en.w+15,en.y-1,0.6);

    // 地图背景（深色）— 只覆盖洞穴区域，不覆盖天空和地面
    X.fillStyle='#0a1018';
    X.fillRect(mnX-30,en.y+en.h,cw,mxY-en.y-en.h+60);

    // 洞穴底色（预览阶段提亮，方便记忆）
    X.beginPath();
    X.moveTo(outer[0][0],outer[0][1]);
    for(let i=1;i<outer.length;i++)X.lineTo(outer[i][0],outer[i][1]);
    X.closePath();
    X.fillStyle='#1a3050';X.fill();
    
    // 水下渐变
    const yMin2=Math.min(...outer.map(p=>p[1]));
    const yMax2=Math.max(...outer.map(p=>p[1]));
    const dg2=X.createLinearGradient(0,yMin2,0,yMax2);
    dg2.addColorStop(0,'rgba(20,60,100,0.15)');
    dg2.addColorStop(1,'rgba(5,15,30,0.25)');
    X.fillStyle=dg2;X.fill();
    
    // 内墙（预览阶段提亮）
    for(const w of lv.walls){
      X.beginPath();X.moveTo(w[0][0],w[0][1]);
      for(let i=1;i<w.length;i++)X.lineTo(w[i][0],w[i][1]);
      X.closePath();X.fillStyle='#1a3828';X.fill();
      X.strokeStyle='#3a6848';X.lineWidth=1.5;X.stroke();
    }
    
    // 窄通道标记
    for(const n of lv.narrow){
      X.fillStyle='rgba(255,160,64,0.2)';
      X.fillRect(n.x,n.y,n.w,n.h);
      X.strokeStyle='rgba(255,160,64,0.5)';X.lineWidth=1.5;X.setLineDash([4,4]);
      X.strokeRect(n.x,n.y,n.w,n.h);X.setLineDash([]);
    }
    
    // 外墙岩石边界（预览中更明显）
    X.beginPath();
    X.moveTo(outer[0][0],outer[0][1]);
    for(let i=1;i<outer.length;i++)X.lineTo(outer[i][0],outer[i][1]);
    X.closePath();
    X.strokeStyle='#3a2a18';X.lineWidth=4;X.stroke();
    X.strokeStyle='#4a3a28';X.lineWidth=2.5;X.stroke();
    X.strokeStyle='#5a4a38';X.lineWidth=1;X.stroke();
    
    // 入口标记
    X.strokeStyle='#40c0e8';X.lineWidth=2;
    X.strokeRect(en.x,en.y,en.w,en.h);
    X.fillStyle='#40c0e8';X.font='bold 12px Microsoft YaHei';X.textAlign='center';
    X.fillText('入口 ▲',en.x+en.w/2,en.y-10);
    
    // 信物高亮
    const tk=lv.token;
    X.strokeStyle='#f0c830';X.lineWidth=2;X.setLineDash([3,3]);
    X.beginPath();X.arc(tk.x,tk.y,18,0,PI2);X.stroke();X.setLineDash([]);
    X.fillStyle='#f0c830';X.font='bold 12px Microsoft YaHei';X.textAlign='center';
    X.fillText('★ 信物',tk.x,tk.y-22);
    
    // 遗体标记
    const bodies=SV.caveBodies[lv.id]||lv.bodies||[];
    for(const b of bodies){
      if(!b.active)continue;
      X.strokeStyle='rgba(255,80,80,0.7)';X.lineWidth=1.5;X.setLineDash([3,3]);
      X.beginPath();X.arc(b.x,b.y,14,0,PI2);X.stroke();X.setLineDash([]);
      X.fillStyle='#ff6060';X.font='bold 11px Microsoft YaHei';X.textAlign='center';
      X.fillText('✕',b.x,b.y+4);
      X.fillStyle='#ff8080';X.font='10px Microsoft YaHei';
      X.fillText(b.name||'遗体',b.x,b.y+18);
    }
    
    // 深度标尺
    X.fillStyle='rgba(100,160,200,0.6)';X.font='9px Microsoft YaHei';X.textAlign='right';
    const depthSteps=5;
    for(let i=0;i<=depthSteps;i++){
      const dy=yMin2+(yMax2-yMin2)*(i/depthSteps);
      const dp=Math.round(lv.maxDepth*(i/depthSteps));
      X.fillText(dp+'m',mxX+20,dy+3);
      X.strokeStyle='rgba(100,160,200,0.2)';X.lineWidth=0.5;X.setLineDash([2,6]);
      X.beginPath();X.moveTo(mnX-15,dy);X.lineTo(mxX+15,dy);X.stroke();X.setLineDash([]);
    }
    
    // 玩家起始位置
    const sp=lv.spawn;
    X.fillStyle='#40e0d0';X.font='bold 11px Microsoft YaHei';X.textAlign='center';
    X.fillText('● 起点',sp.x,sp.y-14);
    X.beginPath();X.arc(sp.x,sp.y,5,0,PI2);X.fillStyle='#40e0d0';X.fill();
    X.strokeStyle='#80f0e0';X.lineWidth=1;X.stroke();
    
    X.restore();
  } else {
    const en=lv.entry;
    const scx=en.x-cam.x, scy=en.y-cam.y;

    // ===== 第1步：绘制全屏天空背景 =====
    const wName=G.weather?G.weather.name:'晴天';
    const isDay=G.weather?!!G.weather.day:true;
    const t=performance.now()*0.001;

    // 天空渐变（限制在洞穴入口区域附近，不铺全宽）
    let skyTop,skyBot;
    if(isDay){
      if(wName==='晴天'){skyTop='#5aa0e0';skyBot='#a0d8ff'}
      else if(wName==='小雨'){skyTop='#6080a0';skyBot='#8098b0'}
      else if(wName==='大雨'){skyTop='#485868';skyBot='#607080'}
      else{skyTop='#384050';skyBot='#485868'}
    }else{
      skyTop='#080c18';skyBot='#0e1424';
    }
    const skyH=scy+en.h+20;
    if(skyH>0){
      if(G.phase==='preview'){
        // 预览阶段：天空全屏铺色，完全清晰可见
        const skyG=X.createLinearGradient(0,0,0,skyH);
        skyG.addColorStop(0,skyTop);skyG.addColorStop(1,skyBot);
        X.fillStyle=skyG;X.fillRect(0,0,W,skyH);
      }else{
        // 游戏阶段：从入口中心向外的径向渐变，模拟从洞口看到的天空光
        const skyCx=scx+en.w/2, skyCy=scy;
        const skyR=Math.max(skyH,W)*0.8;
        const skyG=X.createRadialGradient(skyCx,skyCy,10,skyCx,skyCy,skyR);
        skyG.addColorStop(0,skyTop);skyG.addColorStop(0.5,skyBot);skyG.addColorStop(1,'rgba(0,0,0,0)');
        X.fillStyle=skyG;X.fillRect(0,0,W,skyH);
      }
      // 云朵（白天）
      if(isDay&&(wName==='晴天'||wName==='小雨')){
        X.fillStyle='rgba(255,255,255,0.6)';
        const cx1=scx+20+Math.sin(t*0.2)*10,cy1=scy-60;
        X.beginPath();X.ellipse(cx1,cy1,25,10,0,0,PI2);X.fill();
        X.beginPath();X.ellipse(cx1+15,cy1-3,18,8,0,0,PI2);X.fill();
        X.beginPath();X.ellipse(cx1-10,cy1+2,15,7,0,0,PI2);X.fill();
        if(wName==='晴天'){
          X.fillStyle='rgba(255,255,255,0.45)';
          const cx2=scx+70+Math.sin(t*0.15)*8,cy2=scy-70;
          X.beginPath();X.ellipse(cx2,cy2,20,8,0,0,PI2);X.fill();
          X.beginPath();X.ellipse(cx2-12,cy2+4,12,5,0,0,PI2);X.fill();
        }
      }
      // 太阳（晴天）
      if(isDay&&wName==='晴天'){
        const sunX=scx+en.w/2-30,sunY=scy-80;
        const sg=X.createRadialGradient(sunX,sunY,0,sunX,sunY,30);
        sg.addColorStop(0,'rgba(255,240,180,0.9)');
        sg.addColorStop(0.5,'rgba(255,220,120,0.3)');
        sg.addColorStop(1,'rgba(255,200,80,0)');
        X.fillStyle=sg;X.beginPath();X.arc(sunX,sunY,30,0,PI2);X.fill();
      }
      // 雨滴
      if(isDay&&(wName==='大雨'||wName==='暴雨')){
        X.strokeStyle='rgba(150,180,210,0.4)';X.lineWidth=1;
        for(let i=0;i<30;i++){
          const rx=Math.random()*W,ry=Math.random()*skyH;
          X.beginPath();X.moveTo(rx,ry);X.lineTo(rx-2,ry+8);X.stroke();
        }
      }
      // 星星和月亮（黑夜）
      if(!isDay){
        X.fillStyle='rgba(255,255,220,0.7)';
        for(let i=0;i<25;i++){
          const sx=20+i*(W-40)/25,sy=10+((i*73)%(skyH-20));
          const twinkle=0.3+Math.sin(t*2+i*1.7)*0.35;
          X.globalAlpha=twinkle;
          X.beginPath();X.arc(sx,sy,1.3,0,PI2);X.fill();
        }
        X.globalAlpha=1;
        const moonX=scx+en.w/2+40,moonY=scy-70;
        X.fillStyle='rgba(220,230,255,0.8)';
        X.beginPath();X.arc(moonX,moonY,12,0,PI2);X.fill();
        X.fillStyle=skyTop;
        X.beginPath();X.arc(moonX+4,moonY-2,10,0,PI2);X.fill();
      }
    }

    // ===== 第2步：绘制洞穴内容（世界坐标）=====
    X.save();
    X.translate(-cam.x,-cam.y);
    renderCave(lv);
    renderToken(lv);
    renderBodies(lv);
    renderPlayer();
    renderBubbles();
    renderParticles();
    X.restore();

    // ===== 第3步：雾效 =====
    if(G.phase==='play')renderFog(W,H);
  }

  // 低氧效果
  if(G.player&&G.player.o2<=0&&G.phase==='play'){
    X.fillStyle=`rgba(30,0,0,${clamp(0.25+Math.abs(G.player.o2)*0.008,0,0.55)})`;
    X.fillRect(0,0,W,H);
  }
}

function renderMenuBG(W,H){
  const t=performance.now()*0.001;
  const g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a1c38');g.addColorStop(0.5,'#071630');g.addColorStop(1,'#030c16');
  X.fillStyle=g;X.fillRect(0,0,W,H);

  // 光柱
  for(let i=0;i<5;i++){
    const bx=W*(0.12+i*0.19)+Math.sin(t*0.25+i*1.2)*25;
    X.save();X.globalAlpha=0.035+Math.sin(t*0.4+i*1.8)*0.015;
    X.beginPath();X.moveTo(bx-15,0);X.lineTo(bx+15,0);
    X.lineTo(bx+70+Math.sin(t*0.7+i)*15,H);X.lineTo(bx-70+Math.sin(t*0.7+i)*15,H);
    X.closePath();X.fillStyle='#40c8f0';X.fill();X.restore();
  }
  // 环境气泡
  if(Math.random()<0.08){G.menuBubbles.push({x:rng(0,W),y:H+5,vx:rng(-0.3,0.3),vy:rng(-1,-0.4),r:rng(1,3),life:1,dec:rng(0.005,0.012)})}
  for(let i=G.menuBubbles.length-1;i>=0;i--){
    const b=G.menuBubbles[i];b.x+=b.vx+Math.sin(t*1.5+b.x*0.01)*0.2;b.y+=b.vy;b.life-=b.dec;
    if(b.life<=0){G.menuBubbles.splice(i,1);continue}
    X.beginPath();X.arc(b.x,b.y,b.r,0,PI2);
    X.fillStyle=`rgba(90,170,240,${b.life*0.25})`;X.fill();
  }
}

function renderCave(lv){
  const t=performance.now()*0.001;
  const outer=lv.outer;
  const en=lv.entry;

  // 判断一段边是否位于入口顶部（水平边，跨越入口范围）
  function isEntryTopEdge(x1,y1,x2,y2){
    if(Math.abs(y1-y2)>3||Math.abs((y1+y2)/2-en.y)>15)return false;
    const minX=Math.min(x1,x2), maxX=Math.max(x1,x2);
    return minX<en.x+en.w+5&&maxX>en.x-5;
  }

  // 洞穴底色 — 路径中直接跳过入口区域（不用destination-out）
  function drawOuterPath(skipEntry){
    X.beginPath();
    X.moveTo(outer[0][0],outer[0][1]);
    for(let i=1;i<outer.length;i++){
      const[x1,y1]=outer[i-1],[x2,y2]=outer[i];
      if(skipEntry&&isEntryTopEdge(x1,y1,x2,y2)){
        X.lineTo(en.x,y1);X.moveTo(en.x+en.w,y1);X.lineTo(x2,y2);
      }else{X.lineTo(x2,y2);}
    }
    // 闭合边
    const[ex1,ey1]=outer[outer.length-1],[ex2,ey2]=outer[0];
    if(skipEntry&&isEntryTopEdge(ex1,ey1,ex2,ey2)){
      if(ex1<ex2){X.lineTo(en.x,ey1);X.moveTo(en.x+en.w,ey1);X.lineTo(ex2,ey2);}
      else{X.lineTo(en.x+en.w,ey1);X.moveTo(en.x,ey1);X.lineTo(ex2,ey2);}
    }else{X.lineTo(ex2,ey2);}
  }

  drawOuterPath(true);
  X.fillStyle='#0b1728';X.fill();

  // 水下渐变（从上到下越来越深）
  const yMin=Math.min(...outer.map(p=>p[1]));
  const yMax=Math.max(...outer.map(p=>p[1]));
  const depthG=X.createLinearGradient(0,yMin,0,yMax);
  depthG.addColorStop(0,'rgba(20,60,100,0.08)');
  depthG.addColorStop(1,'rgba(5,15,30,0.15)');
  drawOuterPath(true);
  X.fillStyle=depthG;X.fill();

  // 内墙
  for(const w of lv.walls){
    X.beginPath();X.moveTo(w[0][0],w[0][1]);
    for(let i=1;i<w.length;i++)X.lineTo(w[i][0],w[i][1]);
    X.closePath();X.fillStyle='#0c1a14';X.fill();
  X.strokeStyle='#2a4838';X.lineWidth=2;X.stroke();
  }
  // 内墙岩石纹理
  for(const w of lv.walls){
    X.save();
    X.beginPath();X.moveTo(w[0][0],w[0][1]);
    for(let i=1;i<w.length;i++)X.lineTo(w[i][0],w[i][1]);
    X.closePath();X.clip();
    // 填充岩石噪点
    const wSeed=lv.id*500;
    for(let i=0;i<w.length;i++){
      const j=(i+1)%w.length;
      const[x1,y1]=w[i],[x2,y2]=w[j];
      for(let d=0;d<1;d+=0.1){
        const bx=x1+(x2-x1)*d, by=y1+(y2-y1)*d;
        const nx=-(y2-y1), ny=(x2-x1);
        const nl=Math.hypot(nx,ny)||1;
        for(let s=-2;s<=2;s++){
          const seed=(wSeed+i*137+j*31+d*1000+s*7)&0xFFFF;
          const ox=bx+nx/nl*(s*4+seed%4), oy=by+ny/nl*(s*4+seed%4);
          const sz=1+seed%2.5;
          const bright=35+seed%25;
          X.fillStyle=`rgba(${bright},${bright+4},${bright+10},0.85)`;
          X.fillRect(ox,oy,sz,sz);
        }
      }
    }
    X.restore();
  }

  // 窄通道标记（预览时）
  if(G.phase==='preview'){
    for(const n of lv.narrow){
      X.fillStyle='rgba(255,160,64,0.12)';
      X.fillRect(n.x,n.y,n.w,n.h);
      X.strokeStyle='rgba(255,160,64,0.25)';X.lineWidth=1;X.setLineDash([4,4]);
      X.strokeRect(n.x,n.y,n.w,n.h);X.setLineDash([]);
    }
  }

  // 外墙岩石边界（多层岩石纹理）— 入口顶部分两段画
  for(let layer=0;layer<4;layer++){
    const styles=['#3a2a18','#4a3a28','#5a4a38','#6a5a48'];
    const widths=[8,5,2,1];
    X.strokeStyle=styles[layer];X.lineWidth=widths[layer];
    if(layer===3)X.setLineDash([6,10]);
    X.beginPath();
    X.moveTo(outer[0][0],outer[0][1]);
    for(let i=1;i<outer.length;i++){
      const[x1,y1]=outer[i-1],[x2,y2]=outer[i];
      if(isEntryTopEdge(x1,y1,x2,y2)){
        // 分两段：左段到入口左，moveTo入口右，继续右段
        if(x1<x2){
          X.lineTo(en.x,y1);X.moveTo(en.x+en.w,y1);X.lineTo(x2,y2);
        }else{
          X.lineTo(en.x+en.w,y1);X.moveTo(en.x,y1);X.lineTo(x2,y2);
        }
      }else{X.lineTo(x2,y2);}
    }
    // 闭合边
    const[x1,y1]=outer[outer.length-1],[x2,y2]=outer[0];
    if(isEntryTopEdge(x1,y1,x2,y2)){
      if(x1<x2){
        X.lineTo(en.x,y1);X.moveTo(en.x+en.w,y1);X.lineTo(x2,y2);
      }else{
        X.lineTo(en.x+en.w,y1);X.moveTo(en.x,y1);X.lineTo(x2,y2);
      }
    }else{X.lineTo(x2,y2);}
    X.stroke();
    if(layer===3)X.setLineDash([]);
  }

  // 岩石纹理 - 基于固定种子的伪随机颗粒
  const rockSeed=lv.id*1000;
  X.save();
  X.beginPath();
  X.moveTo(outer[0][0],outer[0][1]);
  for(let i=1;i<outer.length;i++)X.lineTo(outer[i][0],outer[i][1]);
  X.closePath();
  X.clip();
  
  // 外墙边缘岩石颗粒（内外两侧都绘制）
  for(let i=0;i<outer.length;i++){
    const j=(i+1)%outer.length;
    const[x1,y1]=outer[i],[x2,y2]=outer[j];
    if(isEntryTopEdge(x1,y1,x2,y2))continue; // 跳过入口边
    const segLen=dist2(x1,y1,x2,y2);
    const steps=Math.max(3,Math.floor(segLen/15));
    for(let d=0;d<steps;d++){
      const t0=d/steps;
      const bx=x1+(x2-x1)*t0, by=y1+(y2-y1)*t0;
      const nx=(y2-y1), ny=-(x2-x1);
      const nl=Math.hypot(nx,ny)||1;
      // 仅内侧岩石颗粒（外侧不可见，不绘制）
      for(let s=1;s<=4;s++){
        const seed=(rockSeed+i*137+j*31+d*1000+s*7)&0xFFFF;
        const ox=bx+nx/nl*(s*3+seed%4), oy=by+ny/nl*(s*3+seed%4);
        const sz=1.5+seed%3;
        const r=35+seed%45,gc=20+seed%30,bc=5+seed%20;
        X.fillStyle=`rgb(${r},${gc},${bc})`;
        X.beginPath();X.arc(ox,oy,sz,0,PI2);X.fill();
      }
    }
  }
  
  // 内墙岩石颗粒（更密集）
  for(const w of lv.walls){
    for(let i=0;i<w.length;i++){
      const j=(i+1)%w.length;
      const[x1,y1]=w[i],[x2,y2]=w[j];
      const segLen=dist2(x1,y1,x2,y2);
      const steps=Math.max(2,Math.floor(segLen/12));
      for(let d=0;d<steps;d++){
        const t0=d/steps;
        const bx=x1+(x2-x1)*t0, by=y1+(y2-y1)*t0;
        const nx=-(y2-y1), ny=(x2-x1);
        const nl=Math.hypot(nx,ny)||1;
        for(let s=-2;s<=2;s++){
          const seed=(rockSeed+i*137+j*31+d*1000+s*7)&0xFFFF;
          const ox=bx+nx/nl*(s*4+seed%3), oy=by+ny/nl*(s*4+seed%3);
          const sz=1+seed%2.5;
          const r=30+seed%40,gc=18+seed%28,bc=5+seed%18;
          X.fillStyle=`rgb(${r},${gc},${bc})`;
          X.fillRect(ox,oy,sz,sz);
        }
      }
    }
  }
  X.restore();

  // 入口水面光效（淡化的柔光）
  const lg=X.createRadialGradient(en.x+en.w/2,en.y,2,en.x+en.w/2,en.y+20,50);
  lg.addColorStop(0,`rgba(80,200,255,${0.12+Math.sin(t*2.5)*0.04})`);
  lg.addColorStop(1,'rgba(80,200,255,0)');
  X.fillStyle=lg;
  X.beginPath();X.arc(en.x+en.w/2,en.y+8,50,0,PI2);X.fill();

  // 水面波纹（淡化）
  X.save();
  X.strokeStyle=`rgba(74,224,255,${0.18+Math.sin(t*3)*0.06})`;
  X.lineWidth=1;X.beginPath();
  for(let wx=en.x;wx<=en.x+en.w;wx+=2){
    const wy=en.y+Math.sin(t*4+wx*0.15)*1.5;
    wx===en.x?X.moveTo(wx,wy):X.lineTo(wx,wy);
  }
  X.stroke();X.restore();

  // ===== 洞口上方：天空 + 岸边 =====
  // 天空渲染已移至 render 函数中 renderFog 之后，避免被雾效裁切

  // 预览标记
  if(G.phase==='preview'){
    // 信物
    const tk=lv.token;
    X.strokeStyle='#f0c830';X.lineWidth=1.5;X.setLineDash([4,4]);
    X.beginPath();X.arc(tk.x,tk.y,14,0,PI2);X.stroke();X.setLineDash([]);
    X.fillStyle='#f0c830';X.font='bold 11px Microsoft YaHei';X.textAlign='center';
    X.fillText('信物',tk.x,tk.y-18);

    // 入口
    X.fillStyle='#40c0e8';X.font='bold 11px Microsoft YaHei';
    X.fillText('入口 ▲',en.x+en.w/2,en.y-6);
  }
}

function renderToken(lv){
  const tk=lv.token;
  const t=performance.now()*0.001;

  // 光晕
  const g=X.createRadialGradient(tk.x,tk.y,2,tk.x,tk.y,22);
  g.addColorStop(0,`rgba(255,210,0,${0.55+Math.sin(t*3)*0.15})`);
  g.addColorStop(1,'rgba(255,210,0,0)');
  X.fillStyle=g;X.beginPath();X.arc(tk.x,tk.y,22,0,PI2);X.fill();

  // 钻石形
  X.save();X.translate(tk.x,tk.y);X.rotate(t*0.6);
  X.beginPath();X.moveTo(0,-7);X.lineTo(7,0);X.lineTo(0,7);X.lineTo(-7,0);X.closePath();
  X.fillStyle='#f0c830';X.fill();
  X.strokeStyle='#ffe870';X.lineWidth=1;X.stroke();
  X.restore();
}

function renderBodies(lv){
  const bodies=SV.caveBodies[lv.id]||lv.bodies||[];
  const t=performance.now()*0.001;
  for(const b of bodies){
    if(!b.active)continue;

    // 发光
    const g=X.createRadialGradient(b.x,b.y,2,b.x,b.y,18);
    g.addColorStop(0,`rgba(255,80,80,${0.25+Math.sin(t*2.2)*0.08})`);
    g.addColorStop(1,'rgba(255,80,80,0)');
    X.fillStyle=g;X.beginPath();X.arc(b.x,b.y,18,0,PI2);X.fill();

    // 身体
    X.fillStyle='#805030';
    X.beginPath();X.ellipse(b.x,b.y+2,5,9,0,0,PI2);X.fill();
    // 头
    X.fillStyle='#a07050';
    X.beginPath();X.arc(b.x,b.y-8,4.5,0,PI2);X.fill();
    // X标记
    X.strokeStyle='rgba(255,80,80,0.6)';X.lineWidth=1.5;
    X.beginPath();X.moveTo(b.x-3,b.y-10);X.lineTo(b.x+3,b.y-6);
    X.moveTo(b.x+3,b.y-10);X.lineTo(b.x-3,b.y-6);X.stroke();

    // E键提示
    if(G.player&&!G.player.dragging&&dist2(G.player.x,G.player.y,b.x,b.y)<35){
      X.fillStyle='rgba(240,160,48,0.9)';X.font='bold 10px Microsoft YaHei';X.textAlign='center';
      X.fillText('[E] 拖拽',b.x,b.y+22);
    }
  }
}

function renderPlayer(){
  const p=G.player, t=performance.now()*0.001;
  X.save();X.translate(p.x,p.y);
  // 360度旋转：根据面朝方向旋转整个身体（默认朝下=PI/2，渲染时头在上=-PI/2偏移）
  X.rotate(p.angle + Math.PI/2);

  // 光环（不旋转，始终以玩家为中心）
  X.rotate(-(p.angle + Math.PI/2));
  const g=X.createRadialGradient(0,0,4,0,0,28);
  g.addColorStop(0,`rgba(60,200,255,${0.12+Math.sin(t*2.2)*0.04})`);
  g.addColorStop(1,'rgba(60,200,255,0)');
  X.fillStyle=g;X.beginPath();X.arc(0,0,28,0,PI2);X.fill();
  X.rotate(p.angle + Math.PI/2);

  // 氧气瓶
  X.fillStyle='#70b838';X.fillRect(-10,-4,4,11);
  X.strokeStyle='#50902a';X.lineWidth=0.5;X.strokeRect(-10,-4,4,11);

  // 身体
  X.fillStyle='#1890cc';
  X.beginPath();X.ellipse(0,1,7,11,0,0,PI2);X.fill();

  // 脚蹼
  if(p.moving){
    const la=Math.sin(t*9)*0.35;
    X.save();X.rotate(la);
    X.fillStyle='#0e68a8';X.beginPath();X.ellipse(-4,13,3.5,6.5,-0.15,0,PI2);X.fill();
    X.restore();
    X.save();X.rotate(-la);
    X.fillStyle='#0e68a8';X.beginPath();X.ellipse(4,13,3.5,6.5,0.15,0,PI2);X.fill();
    X.restore();
  }else{
    X.fillStyle='#0e68a8';
    X.beginPath();X.ellipse(-4,13,3,5.5,-0.1,0,PI2);X.fill();
    X.beginPath();X.ellipse(4,13,3,5.5,0.1,0,PI2);X.fill();
  }

  // 头
  X.fillStyle='#30a8e0';
  X.beginPath();X.arc(0,-11,5.5,0,PI2);X.fill();

  // 面罩（水面以上时不显示）
  if(!p.atSurface){
    X.fillStyle='#90daf8';
    X.beginPath();X.ellipse(2,-12,3.5,2.8,0,0,PI2);X.fill();
  }

  X.restore();

  // 拖拽连线（不随身体旋转）
  if(p.dragging){
    X.save();X.strokeStyle='rgba(240,160,48,0.4)';X.lineWidth=1;X.setLineDash([3,3]);
    X.beginPath();X.moveTo(p.x,p.y);
    X.lineTo(p.dragging.x,p.dragging.y);X.stroke();X.setLineDash([]);X.restore();
  }
}

function renderBubbles(){
  for(const b of G.bubbles){
    X.beginPath();X.arc(b.x,b.y,Math.max(0.5,b.r),0,PI2);
    X.fillStyle=`rgba(130,200,255,${b.life*0.35})`;X.fill();
    X.strokeStyle=`rgba(170,220,255,${b.life*0.25})`;X.lineWidth=0.4;X.stroke();
  }
}

function renderParticles(){
  for(const p of G.particles){
    X.beginPath();X.arc(p.x,p.y,Math.max(0.3,p.r),0,PI2);
    X.fillStyle=`rgba(90,150,200,${p.life*p.a})`;X.fill();
  }
}

function renderFog(W,H){
  const lv=G.level;
  const en=lv.entry;
  const scy=en.y-G.cam.y;
  const skyH=Math.max(0,scy);
  const px=G.player.x-G.cam.x, py=G.player.y-G.cam.y;
  const vr=G.viewR;

  // 离屏蒙版：把天空区域（矩形）和玩家视野（圆形）合并为一张图
  if(!fogMask){fogMask=document.createElement('canvas');}
  if(fogMask.width!==W||fogMask.height!==H){fogMask.width=W;fogMask.height=H;}
  const mCtx=fogMask.getContext('2d');
  mCtx.clearRect(0,0,W,H);

  // 1) 天空区域 — 仅当潜水员浮在水面时全白；
  //   水下时，天空可见范围随玩家圆形视野收缩
  if(skyH>0&&G.player&&G.player.atSurface){
    mCtx.fillStyle='white';
    mCtx.fillRect(0,0,W,skyH+en.h);
  }
  // 2) 玩家视野 — 径向渐变（叠加在蒙版上，用source-over即可）
  const ig=mCtx.createRadialGradient(px,py,0,px,py,vr*1.1);
  ig.addColorStop(0,'rgba(255,255,255,1)');
  ig.addColorStop(0.6,'rgba(255,255,255,0.85)');
  ig.addColorStop(0.85,'rgba(255,255,255,0.3)');
  ig.addColorStop(1,'rgba(255,255,255,0)');
  mCtx.fillStyle=ig;
  mCtx.fillRect(0,0,W,H);

  // 3) 用蒙版一次性 destination-in 裁切主 canvas
  X.save();
  X.globalCompositeOperation='destination-in';
  X.drawImage(fogMask,0,0);
  X.restore();

  // 4) 圆形/天空以外的区域填充纯黑
  X.save();
  X.globalCompositeOperation='destination-over';
  X.fillStyle='#000000';
  X.fillRect(0,0,W,H);
  X.restore();

  // ===== 天空装饰（树木、花草、鸟）=====
  if(skyH>0){
    const t=performance.now()*0.001;
    const isDay=G.weather.day;
    const wName=G.weather.name;
    const scx=en.x-G.cam.x;

    X.save();

    // 远山轮廓
    X.fillStyle=isDay?'rgba(40,55,75,0.6)':'rgba(20,25,40,0.6)';
    X.beginPath();
    X.moveTo(0,skyH);
    for(let mx=0;mx<=W;mx+=40){
      const mh=20+Math.sin(mx*0.02+1.3)*12+Math.sin(mx*0.05)*8;
      X.lineTo(mx,skyH-mh);
    }
    X.lineTo(W,skyH);X.closePath();X.fill();

    // 树木（洞穴入口两侧）
    function drawTree(tx,ty,scale){
      X.save();X.translate(tx,ty);X.scale(scale,scale);
      X.fillStyle=isDay?'#3a2810':'#1a1408';
      X.fillRect(-2,-20,4,20);
      X.fillStyle=isDay?'#1a5818':'#0a2808';
      X.beginPath();X.arc(0,-28,10,0,PI2);X.fill();
      X.beginPath();X.arc(-6,-24,7,0,PI2);X.fill();
      X.beginPath();X.arc(6,-24,7,0,PI2);X.fill();
      X.fillStyle=isDay?'#2a6820':'#103810';
      X.beginPath();X.arc(-3,-30,6,0,PI2);X.fill();
      X.beginPath();X.arc(4,-31,5,0,PI2);X.fill();
      X.restore();
    }
    drawTree(scx-35,scy,1);
    drawTree(scx-60,scy-2,0.7);
    drawTree(scx-15,scy-1,0.6);
    drawTree(scx+en.w+35,scy,1);
    drawTree(scx+en.w+60,scy-2,0.7);
    drawTree(scx+en.w+15,scy-1,0.6);

    // 草丛
    X.strokeStyle=isDay?'#2a6820':'#0a3808';X.lineWidth=1;
    function drawGrass(gx,gy){
      for(let i=0;i<4;i++){
        const ox=i*3-4,h=4+Math.sin(gx*0.1+i)*2;
        X.beginPath();X.moveTo(gx+ox,gy);
        X.quadraticCurveTo(gx+ox+Math.sin(t*1.5+gx+i)*1.5,gy-h*0.5,gx+ox+Math.sin(t*1.5+gx+i)*2,gy-h);
        X.stroke();
      }
    }
    for(let gx=scx-80;gx<scx;gx+=8)drawGrass(gx,scy);
    for(let gx=scx+en.w+5;gx<scx+en.w+85;gx+=8)drawGrass(gx,scy);

    // 花
    if(isDay){
      X.lineWidth=1;
      const flowerColors=['#e04040','#e0c020','#c040e0','#40c0e0'];
      for(let i=0;i<8;i++){
        const fx2=scx-70+i*12;
        const fy=scy-2;
        if(fx2>scx-70&&fx2<scx-5){
          X.strokeStyle='#2a6820';X.beginPath();X.moveTo(fx2,fy);X.lineTo(fx2,fy-5);X.stroke();
          X.fillStyle=flowerColors[i%4];
          X.beginPath();X.arc(fx2,fy-6,1.5,0,PI2);X.fill();
        }
        const fx3=scx+en.w+10+i*12;
        if(fx3<scx+en.w+80){
          X.strokeStyle='#2a6820';X.beginPath();X.moveTo(fx3,fy);X.lineTo(fx3,fy-5);X.stroke();
          X.fillStyle=flowerColors[i%4];
          X.beginPath();X.arc(fx3,fy-6,1.5,0,PI2);X.fill();
        }
      }
    }

    // 鸟（白天非暴雨）
    if(isDay&&wName!=='暴雨'){
      for(let i=0;i<4;i++){
        const bx=W*((t*0.03+i*0.27)%1);
        const by=15+i*12+Math.sin(t*0.8+i*2)*5;
        const wing=Math.sin(t*6+i*1.5)*0.4;
        X.strokeStyle='rgba(20,20,20,0.6)';X.lineWidth=1.2;
        X.beginPath();
        X.moveTo(bx-5,by+wing*3);
        X.quadraticCurveTo(bx-2,by-2,bx,by);
        X.quadraticCurveTo(bx+2,by-2,bx+5,by+wing*3);
        X.stroke();
      }
    }

    X.restore();
  }
}

// ---------- 输入 ----------
document.addEventListener('keydown',e=>{
  G.keys[e.key.toLowerCase()]=true;
  if(['shift',' '].includes(e.key.toLowerCase()))e.preventDefault();
});
document.addEventListener('keyup',e=>{G.keys[e.key.toLowerCase()]=false});
C.addEventListener('click',e=>{
  if(G.phase!=='play'||!G.player)return;
  ensureAC();
  G.mouseTgt={x:e.clientX+G.cam.x, y:e.clientY+G.cam.y};
});

// ---------- 主循环 ----------
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-(G.lastTs||now))/1000,0.05);
  G.lastTs=now;

  if(G.phase==='preview'){
    Game.updatePreview(dt);
    updCam(true);
  }
  if(G.phase==='play'){
    Game.updatePlay(dt);
    updCam(false);
  }
  updParticles();
  render();
}

// ---------- 初始化 ----------
UI.initSetEvents();
G.lastTs=performance.now();
requestAnimationFrame(loop);
</script>
</body>
</html>
