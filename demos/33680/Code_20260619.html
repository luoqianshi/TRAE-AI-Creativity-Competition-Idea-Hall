<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI编程错题复盘系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f4f7fa;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #2563eb;
            color: white;
            border-radius: 12px;
        }
        .main-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 12px #e2e8f0;
        }
        h3 {
            margin-bottom: 15px;
            color: #1e293b;
            border-left: 4px solid #2563eb;
            padding-left: 10px;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: Consolas, monospace;
            resize: vertical;
        }
        button {
            margin-top: 12px;
            padding: 10px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover {
            background: #1d4ed8;
        }
        #aiResult {
            min-height: 200px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #f8fafc;
            white-space: pre-wrap;
        }
        .record-box {
            margin-top: 20px;
        }
        .error-item {
            padding: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #fff;
        }
        .tag {
            display: inline-block;
            padding: 3px 8px;
            background: #dbeafe;
            color: #1d4ed8;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI编程错题复盘网页系统</h1>
            <p>粘贴报错代码 · AI自动纠错 · 错题本地存档</p>
        </header>

        <div class="main-box">
            <!-- 代码输入区域 -->
            <div class="card">
                <h3>粘贴你的报错代码/日志</h3>
                <textarea id="codeInput" placeholder="在此粘贴代码、运行报错信息、控制台日志..."></textarea>
                <button id="analyzeBtn">AI解析错误</button>
                <button id="saveBtn" style="background:#059669">保存至错题本</button>
            </div>

            <!-- AI解析结果区域 -->
            <div class="card">
                <h3>AI分析结果</h3>
                <div id="aiResult">点击上方「AI解析错误」按钮，自动生成错误定位、修改方案、同类练习题</div>
            </div>
        </div>

        <!-- 错题本记录区域 -->
        <div class="card record-box">
            <h3>我的错题存档（本地存储，刷新不丢失）</h3>
            <div id="recordList"></div>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const codeInput = document.getElementById('codeInput');
        const aiResult = document.getElementById('aiResult');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const saveBtn = document.getElementById('saveBtn');
        const recordList = document.getElementById('recordList');

        // 本地读取错题
        let errorRecords = JSON.parse(localStorage.getItem('codeErrorList')) || [];
        renderRecord();

        // 模拟AI解析逻辑
        analyzeBtn.addEventListener('click', () => {
            const code = codeInput.value.trim();
            if (!code) {
                aiResult.innerText = "请先粘贴代码或报错信息！";
                return;
            }
            // 模拟AI返回文本
            const mockAI = `【错误分类】语法错误 + 数组边界问题
【问题定位】
1. 代码中数组下标超出长度，未做长度判断直接取值；
2. 变量未提前声明，触发未定义报错；
【修复方案】
1. 使用 if(arr.length > index) 判断下标合法性；
2. let/const 提前定义所有局部变量；
【同类巩固习题】
1. 编写代码防止数组越界读取；
2. 区分 var/let/const 变量声明差异`;
            aiResult.innerText = mockAI;
        })

        // 保存错题到本地存储
        saveBtn.addEventListener('click', () => {
            const code = codeInput.value.trim();
            const analysis = aiResult.innerText;
            if (!code || analysis.includes("点击上方")) {
                alert("请先完成AI解析再保存！");
                return;
            }
            const newItem = {
                time: new Date().toLocaleString(),
                code: code,
                analysis: analysis
            }
            errorRecords.unshift(newItem);
            localStorage.setItem('codeErrorList', JSON.stringify(errorRecords));
            renderRecord();
            alert("错题已存入本地错题本！");
        })

        // 渲染错题列表
        function renderRecord() {
            if (errorRecords.length === 0) {
                recordList.innerHTML = "<p>暂无错题记录，解析代码后保存即可查看</p>";
                return;
            }
            let html = "";
            errorRecords.forEach((item, idx) => {
                html += `
                <div class="error-item">
                    <span class="tag">${item.time}</span>
                    <h4>错题#${idx+1}</h4>
                    <p><strong>代码片段：</strong><br>${item.code.slice(0, 120)}${item.code.length>120?'...':''}</p>
                    <p style="margin-top:8px"><strong>AI分析：</strong><br>${item.analysis}</p>
                </div>
                `
            })
            recordList.innerHTML = html;
        }
    </script>
</body>
</html>
