<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>缺氧 ONI 产物查询器</title>
  <style>
/* 《缺氧》ONI 产物查询器 - 主样式 */
/* 主题色参考游戏UI风格：深色背景 + 蓝绿色高亮 */

:root {
  --bg-primary: #1a1e2e;
  --bg-secondary: #232840;
  --bg-card: #2a3050;
  --bg-hover: #343a5a;
  --bg-input: #1e2340;
  --border: #3a4060;
  --text-primary: #e8eaf0;
  --text-secondary: #8890b0;
  --text-muted: #6068880;
  --accent: #00d4aa;
  --accent-hover: #00f0c0;
  --accent-dim: #00a08030;
  --solid: #ff8844;
  --liquid: #4488ff;
  --gas: #88dd44;
  --danger: #ff4466;
  --warning: #ffaa00;
  --success: #00cc66;
  --radius: 8px;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
}

#app {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ===== Header ===== */
.header {
  text-align: center;
  padding: 30px 0 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}

.header h1 {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--liquid));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header p {
  color: var(--text-secondary);
  margin-top: 4px;
  font-size: 14px;
}

.header .wiki-link {
  color: var(--accent);
  text-decoration: none;
  font-size: 13px;
}
.header .wiki-link:hover { text-decoration: underline; }

/* ===== Search ===== */
.search-section {
  position: relative;
  margin-bottom: 24px;
}

.search-input-wrapper {
  position: relative;
  display: flex;
  gap: 12px;
}

.search-input {
  flex: 1;
  padding: 14px 20px 14px 48px;
  background: var(--bg-input);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-size: 16px;
  outline: none;
  transition: border-color 0.2s;
}

.search-input:focus {
  border-color: var(--accent);
}

.search-input::placeholder {
  color: var(--text-secondary);
}

.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-secondary);
  font-size: 18px;
  pointer-events: none;
}

.filter-tabs {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.filter-tab {
  padding: 6px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
}

.filter-tab:hover { background: var(--bg-hover); color: var(--text-primary); }
.filter-tab.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

.filter-tab[data-phase="solid"].active { border-color: var(--solid); color: var(--solid); background: #ff884420; }
.filter-tab[data-phase="liquid"].active { border-color: var(--liquid); color: var(--liquid); background: #4488ff20; }
.filter-tab[data-phase="gas"].active { border-color: var(--gas); color: var(--gas); background: #88dd4420; }

/* ===== Stats ===== */
.stats-bar {
  display: flex;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-secondary);
}

.stat-item .count {
  color: var(--accent);
  font-weight: 600;
}

/* ===== Element Grid ===== */
.element-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
  margin-bottom: 32px;
}

.element-card {
  padding: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.element-card:hover {
  background: var(--bg-hover);
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.element-card.active {
  border-color: var(--accent);
  background: var(--accent-dim);
}

.element-card .phase-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.element-card .phase-dot.solid { background: var(--solid); }
.element-card .phase-dot.liquid { background: var(--liquid); }
.element-card .phase-dot.gas { background: var(--gas); }

.element-card .el-name {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

.element-card .el-formula {
  font-size: 12px;
  color: var(--text-secondary);
}

.element-card .el-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 2px;
}

.element-card .el-tag {
  font-size: 10px;
  padding: 1px 6px;
  background: var(--bg-primary);
  border-radius: 3px;
  color: var(--text-secondary);
}

/* ===== Detail Panel ===== */
.detail-panel {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 32px;
  display: none;
}

.detail-panel.visible { display: block; }

.detail-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 20px;
}

.detail-title {
  font-size: 24px;
  font-weight: 700;
}

.detail-title .phase-badge {
  font-size: 12px;
  padding: 2px 10px;
  border-radius: 12px;
  margin-left: 10px;
  font-weight: 500;
}
.phase-badge.solid { background: #ff884420; color: var(--solid); }
.phase-badge.liquid { background: #4488ff20; color: var(--liquid); }
.phase-badge.gas { background: #88dd4420; color: var(--gas); }

.detail-close {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  width: 32px;
  height: 32px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.detail-close:hover { background: var(--bg-hover); color: var(--text-primary); }

/* Properties Table */
.props-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}

.prop-card {
  background: var(--bg-card);
  padding: 12px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

.prop-card .prop-label {
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.prop-card .prop-value {
  font-size: 18px;
  font-weight: 600;
  margin-top: 2px;
}

.prop-card .prop-unit {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 400;
}

/* Tags */
.detail-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}

.detail-tag {
  padding: 4px 12px;
  background: var(--bg-card);
  border-radius: 16px;
  font-size: 13px;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

/* ===== Upstream/Downstream ===== */
.chain-section {
  margin-bottom: 20px;
}

.chain-section h3 {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.chain-section h3 .arrow { color: var(--accent); }

.recipe-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}

.recipe-card:hover { border-color: var(--accent); }

.recipe-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.recipe-name {
  font-size: 15px;
  font-weight: 600;
}

.recipe-building {
  font-size: 12px;
  padding: 2px 10px;
  background: var(--accent-dim);
  color: var(--accent);
  border-radius: 12px;
  border: 1px solid var(--accent);
}

.recipe-flow {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.recipe-materials {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.recipe-mat {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: var(--bg-primary);
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s;
  border: 1px solid transparent;
}

.recipe-mat:hover {
  background: var(--bg-hover);
  border-color: var(--accent);
}

.recipe-mat .mat-name { font-weight: 500; }
.recipe-mat .mat-amount { color: var(--text-secondary); font-size: 12px; }
.recipe-mat.highlight {
  border-color: var(--accent);
  background: var(--accent-dim);
}

.recipe-arrow {
  color: var(--accent);
  font-size: 20px;
  font-weight: 700;
}

.recipe-conditions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.recipe-condition {
  font-size: 11px;
  padding: 2px 8px;
  background: var(--bg-primary);
  border-radius: 4px;
  color: var(--text-secondary);
}

/* Transitions */
.transitions {
  margin-bottom: 24px;
}

.transitions h3 {
  font-size: 16px;
  margin-bottom: 10px;
}

.transition-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.transition-item {
  padding: 6px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}

.transition-item:hover {
  border-color: var(--accent);
  background: var(--accent-dim);
}

.transition-type {
  color: var(--accent);
  font-weight: 500;
}

.transition-target {
  color: var(--text-primary);
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}

.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state .title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.empty-state .desc { font-size: 14px; }

/* Wiki link */
.wiki-link-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: var(--bg-card);
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  color: var(--accent);
  text-decoration: none;
  font-size: 13px;
  transition: all 0.2s;
}

.wiki-link-btn:hover {
  background: var(--accent-dim);
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .element-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; }
  .element-card { padding: 10px; }
  .element-card .el-name { font-size: 13px; }
  .props-grid { grid-template-columns: repeat(2, 1fr); }
  .detail-title { font-size: 20px; }
  .header h1 { font-size: 22px; }
  .recipe-flow { flex-direction: column; align-items: flex-start; }
  .recipe-arrow { transform: rotate(90deg); }
}

  </style>
</head>

      { materialId: 'bleach_stone', materialName: '漂白石', amount: '10kg' },
      { materialId: 'sand', materialName: '沙子', amount: '20kg' }
    ],
    conditions: ['40秒', '自动运行', '大量产热']
  },

  // ===== 玻璃熔炉 =====
  {
    id: 'glass_furnace', name: '熔融玻璃', building: '玻璃熔炉', category: '精炼',
    inputs: [{ materialId: 'sand', materialName: '沙子', amount: '批量' }],
    outputs: [{ materialId: 'molten_glass', materialName: '熔融玻璃', amount: '25kg/次' }],
    conditions: ['40秒', '产物1942°C', 'DLC']
  },

  // ===== 植物粉碎机 =====
  {
    id: 'mill_resin', name: '树脂提炼', building: '植物粉碎机', category: '加工',
    inputs: [{ materialId: 'fossil', materialName: '琥珀/化石', amount: '100kg' }],
    outputs: [
      { materialId: 'resin', materialName: '树脂', amount: '50kg' },
      { materialId: 'fossil', materialName: '化石', amount: '25kg' },
      { materialId: 'sand', materialName: '沙子', amount: '25kg' }
    ],
    conditions: ['40秒', '复制人操作']
  },
];

// 获取某物质作为输入的所有配方（= 怎么用这个物质）
const getRecipesAsInput = (materialId) =>
  recipes.filter(r => r.inputs.some(i => i.materialId === materialId));

// 获取某物质作为输出的所有配方（= 怎么生产这个物质）
const getRecipesAsOutput = (materialId) =>
  recipes.filter(r => r.outputs.some(o => o.materialId === materialId));

// 获取所有分类
const getCategories = () => [...new Set(recipes.map(r => r.category))];

// ===== Main Logic =====
// ===== State =====
let selectedElementId = null;
let searchQuery = '';
let phaseFilter = null;

// ===== Phase helpers =====
const phaseLabel = { solid: '固体', liquid: '液体', gas: '气体' };
// const phaseColor = { solid: '#ff8844', liquid: '#4488ff', gas: '#88dd44' };

// ===== Render functions =====
function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderHeader()}
    ${renderSearch()}
    ${renderStats()}
    ${renderElementGrid()}
    ${renderDetailPanel()}
  `;
  bindEvents();
  scrollToDetail();
}

function renderHeader() {
  return `
    <header class="header">
      <h1>🫧 缺氧 ONI 产物查询器</h1>
      <p>快速查询游戏中的物质属性、配方上下游关系</p>
      <a class="wiki-link" href="https://oxygennotincluded.wiki.gg/zh/wiki/" target="_blank">数据来源: ONI Wiki ↗</a>
    </header>
  `;
}

function renderSearch() {
  const filterPhases = [
    { key: null, label: '全部' },
    { key: 'solid', label: '🟠 固体' },
    { key: 'liquid', label: '🔵 液体' },
    { key: 'gas', label: '🟢 气体' },
  ];

  return `
    <section class="search-section">
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="搜索物质名称、化学式、标签（如 水、H2O、发电）..."
          value="${escapeHtml(searchQuery)}"
          autocomplete="off"
        />
      </div>
      <div class="filter-tabs">
        ${filterPhases.map(p => `
          <button class="filter-tab ${phaseFilter === p.key ? 'active' : ''}" data-phase="${p.key || ''}">
            ${p.label}
          </button>
        `).join('')}
      </div>
    </section>
  `;
}

function renderStats() {
  const filtered = getFilteredElements();
  const solids = filtered.filter(e => e.phase === 'solid').length;
  const liquids = filtered.filter(e => e.phase === 'liquid').length;
  const gases = filtered.filter(e => e.phase === 'gas').length;

  return `
    <div class="stats-bar">
      <div class="stat-item">共 <span class="count">${filtered.length}</span> 种物质</div>
      <div class="stat-item">🟠 固体 <span class="count">${solids}</span></div>
      <div class="stat-item">🔵 液体 <span class="count">${liquids}</span></div>
      <div class="stat-item">🟢 气体 <span class="count">${gases}</span></div>
    </div>
  `;
}

function renderElementGrid() {
  const filtered = getFilteredElements();

  if (filtered.length === 0) {
    return `
      <div class="empty-state">
        <div class="icon">🔍</div>
        <div class="title">未找到匹配的物质</div>
        <div class="desc">尝试使用不同的关键词搜索</div>
      </div>
    `;
  }

  return `
    <div class="element-grid">
      ${filtered.map(el => `
        <div class="element-card ${selectedElementId === el.id ? 'active' : ''}" data-id="${el.id}">
          <div class="el-name">
            <span class="phase-dot ${el.phase}"></span>
            ${escapeHtml(el.name)}
          </div>
          ${el.formula ? `<div class="el-formula">${escapeHtml(el.formula)}</div>` : ''}
          ${el.tags && el.tags.length > 0 ? `
            <div class="el-tags">
              ${el.tags.slice(0, 3).map(t => `<span class="el-tag">${escapeHtml(t)}</span>`).join('')}
            </div>
          ` : ''}
        </div>
      `).join('')}
    </div>
  `;
}

function renderDetailPanel() {
  if (!selectedElementId) return '';

  const el = getElementById(selectedElementId);
  if (!el) return '';

  const upstreamRecipes = getRecipesAsOutput(selectedElementId);
  const downstreamRecipes = getRecipesAsInput(selectedElementId);
  const transitions = el.transitions;

  return `
    <section class="detail-panel visible" id="detailPanel">
      ${renderDetailHeader(el)}
      ${renderProperties(el)}
      ${transitions && Object.keys(transitions).length > 0 ? renderTransitions(el) : ''}
      ${renderTags(el)}
      ${upstreamRecipes.length > 0 ? renderRecipeSection('上游配方（如何获得该物质）', upstreamRecipes, el, 'output') : ''}
      ${downstreamRecipes.length > 0 ? renderRecipeSection('下游配方（该物质的用途）', downstreamRecipes, el, 'input') : ''}
      ${upstreamRecipes.length === 0 && downstreamRecipes.length === 0 ? `
        <div class="empty-state" style="padding: 30px;">
          <div class="desc">暂无相关配方数据</div>
        </div>
      ` : ''}
      ${el.wikiUrl ? `
        <div style="margin-top: 20px;">
          <a class="wiki-link-btn" href="${el.wikiUrl}" target="_blank">
            📖 在 Wiki 上查看 ${escapeHtml(el.name)} ↗
          </a>
        </div>
      ` : ''}
    </section>
  `;
}

function renderDetailHeader(el) {
  return `
    <div class="detail-header">
      <div class="detail-title">
        ${escapeHtml(el.name)}
        <span class="phase-badge ${el.phase}">${phaseLabel[el.phase]}</span>
        ${el.formula ? `<span style="color: var(--text-secondary); font-weight: 400; font-size: 16px; margin-left: 8px;">${escapeHtml(el.formula)}</span>` : ''}
      </div>
      <button class="detail-close" id="detailClose">✕</button>
    </div>
  `;
}

function renderProperties(el) {
  const props = [];

  if (el.shc !== undefined) props.push({ label: '比热容 (SHC)', value: el.shc.toFixed(3), unit: 'DTU/(g·°C)' });
  if (el.tc !== undefined) props.push({ label: '导热系数 (TC)', value: el.tc < 0.001 ? el.tc.toFixed(4) : el.tc.toFixed(el.tc < 1 ? 3 : 1), unit: 'DTU/(m·s·°C)' });
  if (el.density !== undefined) props.push({ label: '密度', value: el.density.toString(), unit: 'kg/格' });
  if (el.molarMass !== undefined) props.push({ label: '摩尔质量', value: el.molarMass.toString(), unit: 'g/mol' });
  if (el.meltingPoint !== undefined) props.push({ label: '熔点', value: el.meltingPoint.toFixed(1), unit: '°C' });
  if (el.boilingPoint !== undefined) props.push({ label: '沸点', value: el.boilingPoint.toFixed(1), unit: '°C' });
  if (el.condensationPoint !== undefined) props.push({ label: '凝结点', value: el.condensationPoint.toFixed(1), unit: '°C' });

  if (props.length === 0) return '';

  return `
    <div class="props-grid">
      ${props.map(p => `
        <div class="prop-card">
          <div class="prop-label">${p.label}</div>
          <div class="prop-value">${p.value} <span class="prop-unit">${p.unit || ''}</span></div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderTransitions(el) {
  return `
    <div class="transitions">
      <h3>相变关系</h3>
      <div class="transition-list">
        ${Object.entries(el.transitions).map(([type, target]) => `
          <div class="transition-item" data-nav="${target.split('+')[0].trim()}">
            <span class="transition-type">${escapeHtml(type)}</span>
            <span style="color: var(--accent); margin: 0 6px;">→</span>
            <span class="transition-target">${escapeHtml(target)}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderTags(el) {
  if (!el.tags || el.tags.length === 0) return '';
  return `
    <div class="detail-tags">
      ${el.tags.map(t => `<span class="detail-tag">#${escapeHtml(t)}</span>`).join('')}
    </div>
  `;
}

function renderRecipeSection(title, recipeList, currentEl, highlightField) {
  return `
    <div class="chain-section">
      <h3><span class="arrow">▸</span> ${title} (${recipeList.length})</h3>
      ${recipeList.map(r => renderRecipeCard(r, currentEl.id, highlightField)).join('')}
    </div>
  `;
}

function renderRecipeCard(recipe, currentId, highlightField) {
  return `
    <div class="recipe-card">
      <div class="recipe-header">
        <span class="recipe-name">${escapeHtml(recipe.name)}</span>
        <span class="recipe-building">${escapeHtml(recipe.building)}</span>
      </div>
      <div class="recipe-flow">
        <div class="recipe-materials">
          ${recipe.inputs.map(i => `
            <span class="recipe-mat ${highlightField === 'input' && i.materialId === currentId ? 'highlight' : ''}" data-nav="${i.materialId}">
              <span class="mat-name">${escapeHtml(i.materialName)}</span>
              <span class="mat-amount">${escapeHtml(i.amount)}</span>
            </span>
          `).join('')}
        </div>
        <span class="recipe-arrow">→</span>
        <div class="recipe-materials">
          ${recipe.outputs.map(o => `
            <span class="recipe-mat ${highlightField === 'output' && o.materialId === currentId ? 'highlight' : ''}" data-nav="${o.materialId}">
              <span class="mat-name">${escapeHtml(o.materialName)}</span>
              <span class="mat-amount">${escapeHtml(o.amount)}</span>
            </span>
          `).join('')}
        </div>
      </div>
      ${recipe.conditions.length > 0 ? `
        <div class="recipe-conditions">
          ${recipe.conditions.map(c => `<span class="recipe-condition">${escapeHtml(c)}</span>`).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

// ===== Helpers =====
function getFilteredElements() {
  let list = Object.values(elements);

  if (phaseFilter) {
    list = list.filter(e => e.phase === phaseFilter);
  }

  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase().trim();
    list = list.filter(e =>
      e.name.includes(searchQuery) ||
      e.id.includes(q) ||
      (e.formula && e.formula.toLowerCase().includes(q)) ||
      (e.tags && e.tags.some(t => t.toLowerCase().includes(q)))
    );
  }

  // Sort: solids first, then liquids, then gases
  const order = { solid: 0, liquid: 1, gas: 2 };
  list.sort((a, b) => order[a.phase] - order[b.phase] || a.name.localeCompare(b.name, 'zh'));

  return list;
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function scrollToDetail() {
  if (selectedElementId) {
    requestAnimationFrame(() => {
      const panel = document.getElementById('detailPanel');
      if (panel) {
        panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  }
}

// Navigate to an element by trying to match its ID or name
function navigateToElement(query) {
  // Try exact ID match
  if (getElementById(query)) {
    selectedElementId = query;
    render();
    return;
  }
  // Try name match (case-insensitive for phase transition targets)
  const allEls = Object.values(elements);
  const match = allEls.find(e =>
    e.name.toLowerCase() === query.toLowerCase() ||
    e.id === query.replace(/\s/g, '_')
  );
  if (match) {
    selectedElementId = match.id;
    render();
    return;
  }
}

// ===== Event Binding =====
function bindEvents() {
  // Search input
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      searchQuery = (e.target).value;
      render();
      // Restore focus and cursor position
      const newInput = document.getElementById('searchInput');
      if (newInput) {
        newInput.focus();
        newInput.setSelectionRange(searchQuery.length, searchQuery.length);
      }
    });
  }

  // Filter tabs
  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const phase = (tab).dataset.phase;
      phaseFilter = phase || null;
      render();
    });
  });

  // Element cards
  document.querySelectorAll('.element-card').forEach(card => {
    card.addEventListener('click', () => {
      selectedElementId = (card).dataset.id || null;
      render();
    });
  });

  // Close detail
  const closeBtn = document.getElementById('detailClose');
  if (closeBtn) {
    closeBtn.addEventListener('click', () => {
      selectedElementId = null;
      render();
    });
  }

  // Navigate to material in recipe cards
  document.querySelectorAll('.recipe-mat[data-nav]').forEach(mat => {
    mat.addEventListener('click', (e) => {
      e.stopPropagation();
      const nav = (mat).dataset.nav;
      if (nav) navigateToElement(nav);
    });
  });

  // Navigate in transition items
  document.querySelectorAll('.transition-item[data-nav]').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      const nav = (item).dataset.nav;
      if (nav) navigateToElement(nav);
    });
  });
}

// ===== Init =====
render();
  </script>
</body>
</html>
