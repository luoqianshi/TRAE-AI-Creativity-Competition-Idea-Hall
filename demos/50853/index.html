<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360, initial-scale=1, maximum-scale=1">
<title>饮水小助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Comic+Neue:wght@400;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF9F0;
    --bg-card:#FFFCF5;
    --water-top:#CDE9F9;
    --water-mid:#7CC4EB;
    --water-deep:#4A9FD4;
    --mint:#B8E0D2;
    --coral:#FFB5A7;
    --coral-deep:#F08272;
    --butter:#FFE5A0;
    --sky:#A8D8EA;
    --ink:#5B4636;
    --ink-soft:#8A7866;
    --pink-shadow:rgba(255,181,167,.35);
    --blue-shadow:rgba(124,196,235,.40);
    --mint-shadow:rgba(127,198,176,.30);
    --butter-shadow:rgba(255,229,160,.55);
    --font-hand:'Caveat','ZCOOL KuaiLe','Comic Neue',cursive;
    --font-body:'Comic Neue','ZCOOL KuaiLe',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:var(--font-body);color:var(--ink);
    background:#F2EBE0;
    background-image:
      radial-gradient(circle at 10% 90%, rgba(184,224,210,.18), transparent 40%),
      radial-gradient(circle at 92% 8%, rgba(255,229,160,.22), transparent 38%);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px 0;user-select:none;
  }

  .phone{
    width:360px;height:720px;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(184,224,210,.42), transparent 32%),
      radial-gradient(circle at 88% 16%, rgba(255,229,160,.50), transparent 30%),
      radial-gradient(circle at 82% 84%, rgba(255,181,167,.40), transparent 34%),
      radial-gradient(circle at 14% 70%, rgba(168,216,234,.32), transparent 36%);
    border:3px solid var(--ink);
    border-radius:34px 38px 30px 36px / 36px 30px 38px 34px;
    box-shadow:
      0 24px 56px rgba(91,70,54,.22),
      10px 10px 0 rgba(255,181,167,.32),
      -6px 6px 0 rgba(184,224,210,.28);
    overflow:hidden;position:relative;
    display:flex;flex-direction:column;
  }

  /* —— 顶栏 —— */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px 2px;position:relative;z-index:2;
  }
  .topbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .date-chip{display:flex;align-items:baseline;gap:6px}
  .date-chip .d{font-family:var(--font-hand);font-size:28px;font-weight:700;color:var(--ink);transform:rotate(-2deg)}
  .date-chip .w{font-family:var(--font-hand);font-size:18px;color:var(--ink-soft);transform:rotate(1deg)}
  .streak{
    display:flex;align-items:center;gap:3px;
    background:var(--bg-card);border:2px solid var(--ink);
    border-radius:14px 12px 16px 12px / 12px 16px 12px 14px;
    padding:3px 8px;font-family:var(--font-hand);font-size:16px;font-weight:700;
    box-shadow:2px 2px 0 rgba(91,70,54,.12);transform:rotate(1.5deg);
  }
  .streak .n{color:var(--coral-deep);font-size:20px;margin:0 2px}

  .gear-btn{
    width:38px;height:38px;border-radius:50%;
    background:var(--bg-card);border:2px solid var(--ink);
    display:flex;align-items:center;justify-content:center;
    box-shadow:2px 2px 0 rgba(91,70,54,.12);
    cursor:pointer;transition:transform .25s;
  }
  .gear-btn:hover{transform:rotate(45deg)}
  .gear-btn:active{transform:rotate(90deg)}

  /* —— 数字摘要 —— */
  .summary{text-align:center;margin-top:0;font-family:var(--font-hand);position:relative;z-index:2}
  .summary .now{font-size:38px;font-weight:700;color:var(--ink);line-height:1.05}
  .summary .now .unit{font-size:20px;color:var(--ink-soft);margin-left:3px}
  .summary .goal{font-size:16px;color:var(--ink-soft);margin-top:0}
  .summary .goal .g{color:var(--coral-deep);font-weight:700}

  /* —— 杯子区 —— */
  .cup-zone{
    display:flex;justify-content:center;align-items:flex-start;
    margin-top:0;position:relative;z-index:2;
  }
  .cup-svg{cursor:pointer;filter:drop-shadow(0 10px 20px var(--blue-shadow))}
  .cup-hint{
    text-align:center;font-family:var(--font-hand);
    font-size:15px;color:var(--ink-soft);
    margin-top:-4px;position:relative;z-index:2;
  }

  /* —— 进度条 —— */
  .progress-wrap{margin:6px 20px 0;position:relative;z-index:2}
  .brush-track{
    position:relative;height:16px;
    background:var(--bg-card);border:2px solid var(--ink);
    border-radius:12px 14px 10px 14px / 14px 10px 14px 12px;
    overflow:hidden;
    box-shadow:inset 1px 1px 0 rgba(91,70,54,.06);
  }
  .brush-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#CDE9F9 0%,#7CC4EB 50%,#4A9FD4 100%);
    transition:width .8s cubic-bezier(.34,1.56,.64,1);
    -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 30' preserveAspectRatio='none'><path d='M0,5 Q10,2 20,6 T40,5 T60,7 T80,4 T100,6 T120,5 T140,7 T160,4 T180,6 T200,5 L200,25 Q190,28 180,24 T160,26 T140,23 T120,27 T100,24 T80,26 T60,23 T40,27 T20,24 T0,25 Z' fill='black'/></svg>");
    -webkit-mask-size:100% 100%;
    mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 30' preserveAspectRatio='none'><path d='M0,5 Q10,2 20,6 T40,5 T60,7 T80,4 T100,6 T120,5 T140,7 T160,4 T180,6 T200,5 L200,25 Q190,28 180,24 T160,26 T140,23 T120,27 T100,24 T80,26 T60,23 T40,27 T20,24 T0,25 Z' fill='black'/></svg>");
    mask-size:100% 100%;
  }

  /* —— 快速记录 —— */
  .quick-row{display:flex;gap:8px;margin:10px 14px 0;position:relative;z-index:2}
  .qbtn{
    flex:1;border:2px solid var(--ink);
    border-radius:14px 18px 12px 16px / 16px 12px 18px 14px;
    padding:6px 4px;font-family:var(--font-hand);font-weight:700;
    color:var(--ink);cursor:pointer;
    box-shadow:2px 2px 0 rgba(91,70,54,.15);
    transition:transform .15s,box-shadow .15s;
    display:flex;flex-direction:column;align-items:center;gap:0;
  }
  .qbtn:hover{transform:translate(-1px,-1px) rotate(-1deg);box-shadow:4px 4px 0 rgba(91,70,54,.18)}
  .qbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(91,70,54,.15)}
  .qbtn .lbl{font-size:18px;line-height:1.1}
  .qbtn .sub{font-size:11px;color:var(--ink-soft);font-family:var(--font-body);font-weight:400}
  .qbtn.coral{background:var(--coral)}
  .qbtn.mint{background:var(--mint)}
  .qbtn.butter{background:var(--butter)}

  /* —— 提醒卡(单行) —— */
  .remind-card{
    margin:10px 14px 0;
    background:var(--bg-card);border:2px solid var(--ink);
    border-radius:16px 20px 14px 18px / 18px 14px 20px 16px;
    padding:8px 12px;
    box-shadow:3px 3px 0 rgba(91,70,54,.10), 0 8px 16px var(--blue-shadow);
    display:flex;align-items:center;gap:8px;
    position:relative;z-index:2;
  }
  .remind-card .icon{flex-shrink:0}
  .remind-card .icon.alert{animation:dropPulse 1.1s ease-in-out infinite}
  @keyframes dropPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.15)}
  }
  .remind-line{
    flex:1;font-family:var(--font-hand);font-size:19px;
    color:var(--ink);font-weight:700;
    display:flex;align-items:center;gap:4px;white-space:nowrap;
  }
  .remind-line .next{
    font-size:13px;color:var(--ink-soft);font-weight:400;
    margin-left:4px;
  }
  .step{
    display:inline-flex;align-items:center;
    background:var(--bg);border:2px solid var(--ink);
    border-radius:12px;padding:0 2px;
  }
  .step button{
    width:20px;height:22px;border:none;background:transparent;
    font-family:var(--font-hand);font-size:18px;font-weight:700;color:var(--ink);
    cursor:pointer;border-radius:8px;line-height:1;
  }
  .step button:hover{background:var(--butter)}
  .step .val{
    font-family:var(--font-hand);font-size:18px;font-weight:700;
    color:var(--coral-deep);min-width:24px;text-align:center;
  }

  /* —— 今日记录 —— */
  .history-card{
    margin:8px 14px 8px;
    background:var(--bg-card);border:2px solid var(--ink);
    border-radius:18px 22px 16px 20px / 20px 16px 22px 18px;
    padding:6px 12px 8px;
    box-shadow:3px 3px 0 rgba(91,70,54,.10), 0 6px 14px var(--butter-shadow);
    position:relative;z-index:2;
    display:flex;flex-direction:column;
    flex:1;min-height:88px;
  }
  .history-head{
    display:flex;align-items:center;justify-content:space-between;
    font-family:var(--font-hand);margin-bottom:2px;
  }
  .history-head .ttl{
    font-size:17px;font-weight:700;color:var(--ink);
    text-decoration:wavy underline var(--coral);text-underline-offset:3px;
  }
  .history-head .cnt{
    font-size:13px;color:var(--ink-soft);font-family:var(--font-body);
  }
  .history-list{
    flex:1;overflow-y:auto;padding-right:2px;
    scrollbar-width:thin;scrollbar-color:var(--mint) transparent;
  }
  .history-list::-webkit-scrollbar{width:5px}
  .history-list::-webkit-scrollbar-thumb{background:var(--mint);border-radius:3px}
  .history-list::-webkit-scrollbar-track{background:transparent}
  .hist-row{
    display:flex;align-items:center;gap:8px;
    padding:3px 2px;
    border-bottom:1.5px dashed rgba(138,120,102,.35);
    font-family:var(--font-hand);
    animation:rowIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes rowIn{
    0%{opacity:0;transform:translateX(-8px)}
    100%{opacity:1;transform:translateX(0)}
  }
  .hist-row:last-child{border-bottom:none}
  .hist-icon{flex-shrink:0;width:18px;height:18px}
  .hist-time{
    font-size:15px;color:var(--ink-soft);min-width:36px;line-height:1;
  }
  .hist-amount{
    flex:1;font-size:17px;font-weight:700;color:var(--coral-deep);line-height:1;
  }
  .hist-amount .u{font-size:12px;color:var(--ink-soft);font-weight:400;margin-left:2px;font-family:var(--font-body)}
  .hist-del{
    width:22px;height:22px;border:1.5px solid var(--ink);
    background:var(--bg);border-radius:50% 48% 52% 50%;
    font-family:var(--font-hand);font-size:18px;font-weight:700;
    color:var(--ink-soft);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    line-height:1;padding:0;flex-shrink:0;
    box-shadow:1.5px 1.5px 0 rgba(91,70,54,.12);
    transition:transform .15s,background .15s,color .15s;
  }
  .hist-del:hover{background:var(--coral);color:var(--ink);transform:rotate(-8deg)}
  .hist-del:active{transform:translate(1px,1px) rotate(-8deg)}
  .history-empty{
    flex:1;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-hand);font-size:15px;color:var(--ink-soft);
    flex-direction:column;gap:2px;
  }
  .history-empty .big{font-size:24px}

  /* —— 底部功能栏(手绘小巧版) —— */
  .tabbar{
    flex-shrink:0;
    height:54px;
    background:var(--bg-card);
    background-image:
      repeating-linear-gradient(45deg,
        transparent 0 6px,
        rgba(184,224,210,.10) 6px 7px);
    border-top:2.5px solid var(--ink);
    display:flex;align-items:stretch;justify-content:space-around;
    padding:4px 8px 6px;
    z-index:3;
    box-shadow:0 -4px 12px rgba(91,70,54,.06);
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
    cursor:pointer;font-family:var(--font-hand);font-size:13px;font-weight:700;
    color:var(--ink-soft);position:relative;
    padding:3px 0 2px;
    border-radius:14px 16px 12px 14px / 14px 12px 16px 14px;
    transition:transform .15s,background .15s;
  }
  .tab:hover{transform:translateY(-2px)}
  .tab.active{color:var(--coral-deep);background:rgba(255,229,160,.45)}
  .tab.active .ico path,
  .tab.active .ico circle,
  .tab.active .ico polygon,
  .tab.active .ico line,
  .tab.active .ico rect{stroke:var(--coral-deep)}
  .tab.active::after{
    content:'';position:absolute;bottom:-3px;
    width:18px;height:5px;background:var(--coral);
    border-radius:50% 50% 40% 60% / 50%;
    border:1.5px solid var(--ink);
  }
  .tab.disabled{opacity:.45;cursor:default}
  .tab.disabled:hover{transform:none}
  .tab .ico{width:22px;height:22px}
  .tab .tip{
    position:absolute;bottom:48px;
    background:var(--ink);color:var(--bg);
    padding:3px 8px;border-radius:10px 14px 12px 14px;
    font-family:var(--font-hand);font-size:13px;
    white-space:nowrap;opacity:0;pointer-events:none;
    transition:opacity .15s;z-index:5;
  }
  .tab.disabled:hover .tip{opacity:1}

  /* —— 提醒气泡 —— */
  .bubble{
    position:absolute;right:14px;bottom:140px;
    background:var(--bg-card);border:2px solid var(--ink);
    border-radius:20px 24px 18px 22px / 22px 18px 24px 18px;
    padding:12px 14px 12px 50px;
    box-shadow:4px 4px 0 rgba(91,70,54,.12), 0 12px 24px var(--blue-shadow);
    font-family:var(--font-hand);font-size:18px;max-width:220px;
    transform:translateY(20px) scale(.85);opacity:0;pointer-events:none;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .25s,background .3s;
    z-index:10;
  }
  .bubble.show{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}
  .bubble.escalate{background:#FFD9B5;animation:shake .5s ease-in-out infinite}
  @keyframes shake{
    0%,100%{transform:translateX(0) rotate(0)}
    25%{transform:translateX(-3px) rotate(-2deg)}
    75%{transform:translateX(3px) rotate(2deg)}
  }
  .bubble .drop{position:absolute;left:10px;top:10px;width:32px;height:32px}
  .bubble::after{
    content:'';position:absolute;right:24px;bottom:-12px;
    width:20px;height:20px;background:var(--bg-card);
    border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);
    transform:rotate(45deg);border-radius:0 0 4px 0;
  }
  .bubble.escalate::after{background:#FFD9B5}
  .bubble .msg{margin-bottom:8px;color:var(--ink);line-height:1.3}
  .bubble .acts{display:flex;gap:6px}
  .mini-btn{
    border:1.5px solid var(--ink);background:var(--sky);
    border-radius:12px 14px 10px 12px;
    padding:3px 10px;font-family:var(--font-hand);font-size:16px;
    cursor:pointer;box-shadow:1.5px 1.5px 0 rgba(91,70,54,.15);
  }
  .mini-btn.coral{background:var(--coral)}
  .mini-btn:hover{transform:rotate(-1deg)}

  /* —— 设置抽屉 —— */
  .sheet-backdrop{
    position:absolute;inset:0;
    background:rgba(91,70,54,.35);
    opacity:0;pointer-events:none;
    transition:opacity .25s;z-index:40;
  }
  .sheet-backdrop.show{opacity:1;pointer-events:auto}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;
    background:var(--bg);
    border-top:3px solid var(--ink);
    border-radius:28px 28px 0 0;
    padding:18px 20px 22px;
    transform:translateY(100%);
    transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    z-index:41;
    box-shadow:0 -12px 32px rgba(91,70,54,.18);
  }
  .sheet.show{transform:translateY(0)}
  .sheet .handle{
    width:46px;height:5px;background:var(--ink-soft);
    border-radius:3px;margin:0 auto 14px;opacity:.5;
  }
  .sheet h3{
    font-family:var(--font-hand);font-size:30px;font-weight:700;
    color:var(--ink);text-align:center;margin-bottom:4px;
    text-decoration:wavy underline var(--sky);text-underline-offset:6px;
  }
  .sheet .sub{
    text-align:center;font-family:var(--font-hand);font-size:16px;
    color:var(--ink-soft);margin-bottom:16px;
  }
  .form-row{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-card);border:2px solid var(--ink);
    border-radius:16px 20px 14px 18px / 18px 14px 20px 16px;
    padding:12px 14px;margin-bottom:10px;
    box-shadow:2px 2px 0 rgba(91,70,54,.12);
  }
  .form-row .ico{
    width:36px;height:36px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .form-row .col{flex:1;font-family:var(--font-hand)}
  .form-row .col .label{font-size:18px;font-weight:700;color:var(--ink);line-height:1}
  .form-row .col .desc{font-size:13px;color:var(--ink-soft);font-family:var(--font-body)}
  .num-input{
    display:flex;align-items:center;gap:0;
    background:var(--bg);border:2px solid var(--ink);
    border-radius:14px;padding:0 2px;
  }
  .num-input button{
    width:26px;height:28px;border:none;background:transparent;
    font-family:var(--font-hand);font-size:20px;font-weight:700;color:var(--ink);
    cursor:pointer;border-radius:8px;line-height:1;
  }
  .num-input button:hover{background:var(--butter)}
  .num-input input{
    width:54px;border:none;background:transparent;
    font-family:var(--font-hand);font-size:20px;font-weight:700;
    color:var(--coral-deep);text-align:center;outline:none;
  }
  .num-input input::-webkit-outer-spin-button,
  .num-input input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .num-input .u{font-size:13px;color:var(--ink-soft);padding-right:6px;font-family:var(--font-body)}

  .sheet-actions{display:flex;gap:10px;margin-top:14px}
  .sheet-btn{
    flex:1;border:2.5px solid var(--ink);
    border-radius:16px 20px 14px 18px / 18px 14px 20px 16px;
    padding:10px;font-family:var(--font-hand);font-size:20px;font-weight:700;
    cursor:pointer;box-shadow:3px 3px 0 rgba(91,70,54,.15);
    transition:transform .15s,box-shadow .15s;
  }
  .sheet-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(91,70,54,.15)}
  .sheet-btn.cancel{background:var(--bg-card)}
  .sheet-btn.save{background:var(--sky)}

  /* 彩屑 */
  .confetti{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden;border-radius:34px 38px 30px 36px / 36px 30px 38px 34px}
  .confetti svg{position:absolute;top:-40px;animation:fall linear forwards}
  @keyframes fall{
    0%{transform:translateY(0) rotate(0);opacity:1}
    100%{transform:translateY(800px) rotate(720deg);opacity:.85}
  }

  /* 杯顶气泡 */
  @keyframes bubbleUp{
    0%{transform:translateY(0) scale(.4);opacity:0}
    25%{opacity:.9}
    100%{transform:translateY(-50px) scale(1);opacity:0}
  }

  /* 杯子欢快 */
  .cup-svg.celebrate{animation:cupJoy .6s cubic-bezier(.34,1.56,.64,1)}
  @keyframes cupJoy{
    0%{transform:translateY(0) rotate(0)}
    30%{transform:translateY(-10px) rotate(-4deg)}
    60%{transform:translateY(0) rotate(3deg)}
    100%{transform:translateY(0) rotate(0)}
  }

  /* 背景小涂鸦 */
  .doodle{position:absolute;pointer-events:none;opacity:.5;z-index:1}
  .doodle-1{left:6px;top:74px;transform:rotate(-12deg)}
  .doodle-2{right:8px;top:58px;transform:rotate(8deg)}
</style>
</head>
<body>

<!-- 抖动滤镜 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="wobble-soft"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.2"/></filter>
  </defs>
</svg>

<div class="phone">

  <!-- 背景涂鸦 -->
  <svg class="doodle doodle-1" width="40" height="40" viewBox="0 0 60 60">
    <path d="M10,30 Q15,20 25,22 T45,30" stroke="#7CC4EB" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#wobble-soft)"/>
    <circle cx="50" cy="30" r="3" fill="#FFB5A7"/>
  </svg>
  <svg class="doodle doodle-2" width="40" height="40" viewBox="0 0 70 70">

<script>
/* ========== 状态 ========== */
const state = {
  capacity: 500,
  goal: 2000,
  intervalMin: 30,
  waterLevel: 1.0,
  drunk: 0,
  streak: 7,
  records: [],
  reminderTimer: null,
  escalateTimer1: null,
  escalateTimer2: null,
  nextRemindAt: null,
  celebrated: false,
};

function loadState(){
  try{
    const saved = JSON.parse(localStorage.getItem('water-helper-mobile') || '{}');
    const todayKey = new Date().toDateString();
    if(saved.dateKey === todayKey){
      Object.assign(state, saved.state);
      if(!Array.isArray(state.records)) state.records = [];
    } else if(saved.dateKey){
      if(saved.state && saved.state.drunk >= saved.state.goal){
        state.streak = (saved.state.streak||0) + 1;
      } else {
        state.streak = 1;
      }
      state.records = [];
    }
  }catch(e){}
}
function saveState(){
  localStorage.setItem('water-helper-mobile', JSON.stringify({
    dateKey: new Date().toDateString(),
    state: {
      capacity: state.capacity, goal: state.goal, intervalMin: state.intervalMin,
      waterLevel: state.waterLevel, drunk: state.drunk, streak: state.streak,
      records: state.records,
    }
  }));
}

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const pad = n => String(n).padStart(2,'0');

function refreshDate(){
  const d = new Date();
  $('dateLabel').textContent = `${d.getMonth()+1}月${d.getDate()}日`;
  const week = ['周日','周一','周二','周三','周四','周五','周六'];
  $('weekdayLabel').textContent = week[d.getDay()];
}

/* ========== 水位渲染 ========== */
const CUP_TOP_Y = 102, CUP_BOTTOM_Y = 412, CUP_HEIGHT = CUP_BOTTOM_Y - CUP_TOP_Y;
let wavePhase = 0;
function buildWavePath(yBase, amp, phase){
  const points = [];
  for(let x=120; x<=300; x+=10){
    const y = yBase + Math.sin((x/35) + phase) * amp;
    points.push(`${x},${y.toFixed(2)}`);
  }
  let d = `M 120 ${CUP_BOTTOM_Y+20} L 120 ${yBase.toFixed(2)} `;
  d += 'L ' + points.join(' L ');
  d += ` L 300 ${CUP_BOTTOM_Y+20} Z`;
  return d;
}
function renderWater(){
  const lvl = clamp(state.waterLevel, 0, 1);
  const waterY = CUP_BOTTOM_Y - lvl * CUP_HEIGHT;
  $('waterFill').setAttribute('y', waterY);
  $('waterFill').setAttribute('height', CUP_BOTTOM_Y - waterY + 20);
  $('wave1').setAttribute('d', buildWavePath(waterY+4, 4.5, wavePhase));
  $('wave2').setAttribute('d', buildWavePath(waterY+8, 3, wavePhase + 1.2));
  const faceY = clamp(waterY - 16, CUP_TOP_Y + 10, CUP_BOTTOM_Y - 28);
  $('face').setAttribute('transform', `translate(208, ${faceY})`);
  const eyes = $('eyes');
  if(lvl < 0.15){
    eyes.innerHTML = `<path d="M -9 -4 L -3 -2" stroke="#5B4636" stroke-width="2.3" stroke-linecap="round"/>
                      <path d="M 3 -2 L 9 -4" stroke="#5B4636" stroke-width="2.3" stroke-linecap="round"/>`;
  } else {
    eyes.innerHTML = `<circle cx="-6" cy="-3" r="2.3" fill="#5B4636"/>
                      <circle cx="6" cy="-3" r="2.3" fill="#5B4636"/>`;
  }
}
function animateWaves(){
  wavePhase += 0.05;
  renderWater();
  requestAnimationFrame(animateWaves);
}

/* ========== 刻度尺渲染 ========== */
function renderRuler(){
  const cap = state.capacity;
  // 主刻度间隔: 大杯200,中杯100,小杯50
  const majorStep = cap >= 1000 ? 200 : (cap >= 600 ? 100 : 50);
  const minorStep = majorStep / 2;
  const g = $('rulerTicks');
  let html = '';
  for(let m = 0; m <= cap + 0.01; m += minorStep){
    const y = CUP_BOTTOM_Y - (m/cap) * CUP_HEIGHT;
    const isMajor = Math.abs(m % majorStep) < 0.01;
    const x1 = isMajor ? 84 : 94;
    html += `<line x1="${x1}" y1="${y}" x2="108" y2="${y}" stroke="#5B4636" stroke-width="${isMajor?3:1.8}" stroke-linecap="round" filter="url(#wobble-soft)"/>`;
    if(isMajor){
      html += `<text x="80" y="${y+5}" text-anchor="end" font-family="Caveat, cursive" font-size="17" fill="#5B4636" font-weight="700">${Math.round(m)}</text>`;
    }
  }
  g.innerHTML = html;
}

/* ========== 数字渲染 ========== */
function renderStats(){
  $('drunkMl').textContent = state.drunk;
  $('goalLabel').textContent = state.goal;
  $('streakNum').textContent = state.streak;
  const pct = clamp(state.drunk / state.goal, 0, 1);
  $('brushFill').style.width = (pct*100) + '%';
  $('intervalVal').textContent = state.intervalMin;
}

/* ========== 流水记录 ========== */
function addRecord(amount){
  const now = new Date();
  state.records.unshift({
    id: Date.now() + '-' + Math.random().toString(36).slice(2,6),
    timeStr: `${pad(now.getHours())}:${pad(now.getMinutes())}`,
    amount: amount,
  });
  renderHistory();
}
function renderHistory(){
  const list = $('historyList');
  $('histCount').textContent = state.records.length;
  if(state.records.length === 0){
    list.innerHTML = `<div class="history-empty"><span class="big">🥤</span><span>还没记录,先喝一口吧</span></div>`;
    return;
  }
  list.innerHTML = state.records.map(r => `
    <div class="hist-row" data-id="${r.id}">
      <svg class="hist-icon" viewBox="0 0 20 22">
        <path d="M10 2 C 7 8, 4 12, 4 14 C 4 17, 7 18.5, 10 18.5 C 13 18.5, 16 17, 16 14 C 16 12, 13 8, 10 2 Z"
          fill="#7CC4EB" stroke="#5B4636" stroke-width="1.5" stroke-linejoin="round" filter="url(#wobble-soft)"/>
      </svg>
      <span class="hist-time">${r.timeStr}</span>
      <span class="hist-amount">${r.amount}<span class="u">ml</span></span>
      <button class="hist-del" data-del="${r.id}" aria-label="删除">×</button>
    </div>
  `).join('');
}
document.addEventListener('click', e => {
  const btn = e.target.closest('.hist-del');
  if(!btn) return;
  const id = btn.dataset.del;
  const idx = state.records.findIndex(r => r.id === id);
  if(idx < 0) return;
  const removed = state.records[idx];
  state.drunk = Math.max(0, state.drunk - removed.amount);
  state.records.splice(idx, 1);
  if(state.drunk < state.goal) state.celebrated = false;
  renderHistory(); renderStats(); saveState();
});

/* ========== 点击杯子 ========== */
$('cupSvg').addEventListener('click', e => {
  const svg = $('cupSvg');
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
  // 杯内区域 x:130-286 y:102-412
  if(loc.x < 130 || loc.x > 286) return;
  if(loc.y < CUP_TOP_Y || loc.y > CUP_BOTTOM_Y) return;

  const clickedLevel = (CUP_BOTTOM_Y - loc.y) / CUP_HEIGHT;
  const prev = state.waterLevel;
  const diff = prev - clickedLevel;
  state.waterLevel = clickedLevel;

  if(diff > 0.02){
    const amount = Math.round(state.capacity * diff);
    state.drunk += amount;
    addRecord(amount);
    spawnSplash(loc.x, loc.y);
    bounceCup();
    checkGoal();
    resetReminder();
  } else if(diff < -0.02){
    spawnTopBubbles();
  }
  renderWater(); renderStats(); saveState();
});

function bounceCup(){
  $('cupSvg').classList.remove('celebrate');
  void $('cupSvg').offsetWidth;
  $('cupSvg').classList.add('celebrate');
}

function spawnSplash(x, y){
  const ns = 'http://www.w3.org/2000/svg';
  const layer = $('splashLayer');
  for(let i=0;i<6;i++){
    const c = document.createElementNS(ns,'circle');
    const angle = (i/6) * Math.PI*2 + Math.random()*0.3;
    const dist = 18 + Math.random()*22;
    c.setAttribute('cx', x);
    c.setAttribute('cy', y);
    c.setAttribute('r', 2.5 + Math.random()*2);
    c.setAttribute('fill', i%2 ? '#A5D8F3' : '#4A9FD4');
    c.style.transition = 'transform .55s cubic-bezier(.34,1.56,.64,1), opacity .55s';
    layer.appendChild(c);
    requestAnimationFrame(()=>{
      c.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist - 10}px)`;
      c.style.opacity = '0';
    });
    setTimeout(()=>c.remove(), 700);
  }
}
function spawnTopBubbles(){
  const ns = 'http://www.w3.org/2000/svg';
  const layer = $('topBubbleLayer');
  for(let i=0;i<5;i++){
    const c = document.createElementNS(ns,'circle');
    c.setAttribute('cx', 188 + Math.random()*36);
    c.setAttribute('cy', 110 + Math.random()*8);
    c.setAttribute('r', 3 + Math.random()*3);
    c.setAttribute('fill', '#CDE9F9');
    c.setAttribute('stroke', '#5B4636');
    c.setAttribute('stroke-width', '1.5');
    c.setAttribute('opacity', '0.85');
    c.style.animation = `bubbleUp 1.${2+i}s ease-out forwards`;
    c.style.animationDelay = (i*0.08) + 's';
    layer.appendChild(c);
    setTimeout(()=>c.remove(), 1600);
  }
}

/* ========== 达标彩屑 ========== */
function checkGoal(){
  if(state.drunk >= state.goal && !state.celebrated){
    state.celebrated = true;
    dropConfetti();
  }
}
function dropConfetti(){
  const layer = $('confettiLayer');
  const shapes = [
    `<svg width="24" height="24" viewBox="0 0 32 32"><path d="M16 4 C 12 12, 8 14, 8 18 C 8 22, 12 24, 16 28 C 20 24, 24 22, 24 18 C 24 14, 20 12, 16 4 Z" fill="#FFB5A7" stroke="#5B4636" stroke-width="2"/><circle cx="16" cy="18" r="3" fill="#FFE5A0"/></svg>`,
    `<svg width="22" height="22" viewBox="0 0 28 28"><path d="M14 2 L17 11 L26 11 L19 17 L22 26 L14 20 L6 26 L9 17 L2 11 L11 11 Z" fill="#FFE5A0" stroke="#5B4636" stroke-width="2"/></svg>`,
    `<svg width="24" height="24" viewBox="0 0 30 30"><circle cx="15" cy="15" r="6" fill="#FFB5A7"/><circle cx="8" cy="10" r="5" fill="#FFB5A7"/><circle cx="22" cy="10" r="5" fill="#FFB5A7"/><circle cx="8" cy="20" r="5" fill="#FFB5A7"/><circle cx="22" cy="20" r="5" fill="#FFB5A7"/><circle cx="15" cy="15" r="2" fill="#FFE5A0"/></svg>`,
    `<svg width="22" height="22" viewBox="0 0 26 26"><path d="M13 3 L16 11 L24 11 L17 16 L20 24 L13 19 L6 24 L9 16 L2 11 L10 11 Z" fill="#CDE9F9" stroke="#5B4636" stroke-width="2"/></svg>`,
  ];
  for(let i=0;i<28;i++){
    const wrap = document.createElement('div');
    wrap.innerHTML = shapes[i%shapes.length];
    const el = wrap.firstChild;
    el.style.left = Math.random()*360 + 'px';
    el.style.animationDuration = (2.5 + Math.random()*2) + 's';
    el.style.animationDelay = (Math.random()*1.2) + 's';
    layer.appendChild(el);
    setTimeout(()=>el.remove(), 5500);
  }
  bounceCup();
}

/* ========== 提醒 ========== */
const MSG_GENTLE = [
  '该喝水啦 💧',
  '起来摸摸鱼,喝口水吧~',
  '杯杯在等你,过来抱抱它',
  '咕嘟咕嘟,润润喉咙',
  '小水滴想念你的嘴巴啦',
];
const MSG_ANGRY = [
  '哼!你的小水杯在跺脚啦!⚠️',
  '再不喝我就生气啦(╯°□°)╯',
  '小水杯哭哭,主人不理它',
];

function showBubble(msg, escalate){
  const b = $('bubble');
  $('bubbleMsg').textContent = msg;
  b.classList.toggle('escalate', !!escalate);
  b.classList.add('show');
}
function hideBubble(){ $('bubble').classList.remove('show') }

function setNextTip(){
  if(state.nextRemindAt){
    const d = state.nextRemindAt;
    $('nextAt').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } else {
    $('nextAt').textContent = '--:--';
  }
}

function scheduleReminder(){
  clearAllTimers();
  state.nextRemindAt = new Date(Date.now() + state.intervalMin*60*1000);
  setNextTip();
  state.reminderTimer = setTimeout(triggerReminder, state.intervalMin*60*1000);
}
function clearAllTimers(){
  [state.reminderTimer, state.escalateTimer1, state.escalateTimer2].forEach(t=>t&&clearTimeout(t));
  state.reminderTimer = state.escalateTimer1 = state.escalateTimer2 = null;
  $('remindIcon').classList.remove('alert');
  $('remindDrop').setAttribute('fill', '#7CC4EB');
}
function triggerReminder(){
  const gentleMsg = MSG_GENTLE[Math.floor(Math.random()*MSG_GENTLE.length)];
  showBubble(gentleMsg, false);
  if(window.waterAPI) window.waterAPI.showReminder(gentleMsg, false);
  state.escalateTimer1 = setTimeout(()=>{
    $('remindIcon').classList.add('alert');
    $('remindDrop').setAttribute('fill', '#FFE5A0');
  }, 5*60*1000);
  state.escalateTimer2 = setTimeout(()=>{
    const angryMsg = MSG_ANGRY[Math.floor(Math.random()*MSG_ANGRY.length)];
    showBubble(angryMsg, true);
    if(window.waterAPI) window.waterAPI.showReminder(angryMsg, true);
  }, 10*60*1000);
}
function resetReminder(){
  hideBubble();
  if(window.waterAPI) window.waterAPI.hideReminder();
  scheduleReminder();
}

// 弹窗提醒里按下的动作回传(Electron 模式)
if(window.waterAPI && window.waterAPI.onReminderAction){
  window.waterAPI.onReminderAction(action => {
    if(action === 'drink'){
      resetReminder();
    } else if(action === 'snooze'){
      hideBubble();
      clearAllTimers();
      state.nextRemindAt = new Date(Date.now() + 5*60*1000);
      setNextTip();
      state.reminderTimer = setTimeout(triggerReminder, 5*60*1000);
    }
    // dismiss: 仅关掉悬浮窗,不重置定时
  });
}

$('bubbleDrink').addEventListener('click', resetReminder);
$('bubbleLater').addEventListener('click', ()=>{
  hideBubble();
  clearAllTimers();
  state.nextRemindAt = new Date(Date.now() + 5*60*1000);
  setNextTip();
  state.reminderTimer = setTimeout(triggerReminder, 5*60*1000);
});

/* ========== 间隔步进 ========== */
$('intervalDown').addEventListener('click', ()=>{
  state.intervalMin = clamp(state.intervalMin - 5, 15, 90);
  renderStats(); scheduleReminder(); saveState();
});
$('intervalUp').addEventListener('click', ()=>{
  state.intervalMin = clamp(state.intervalMin + 5, 15, 90);
  renderStats(); scheduleReminder(); saveState();
});

/* ========== 快速记录 ========== */
document.querySelectorAll('.qbtn[data-add]').forEach(btn => {
  btn.addEventListener('click', ()=>{
    const add = +btn.dataset.add;
    state.drunk += add;
    state.waterLevel = clamp(state.waterLevel - add/state.capacity, 0, 1);
    addRecord(add);
    renderWater(); renderStats(); checkGoal(); resetReminder(); saveState();
    bounceCup();
    spawnSplash(208, 260);
  });
});
$('drainBtn').addEventListener('click', ()=>{
  if(state.waterLevel <= 0.02) return;
  const amount = Math.round(state.capacity * state.waterLevel);
  state.drunk += amount;
  state.waterLevel = 0;
  addRecord(amount);
  renderWater(); renderStats(); checkGoal(); resetReminder(); saveState();
  bounceCup();
  spawnSplash(208, 380);
});

/* ========== 设置抽屉 ========== */
function openSheet(){
  $('capInput').value = state.capacity;
  $('goalInput').value = state.goal;
  $('sheetBack').classList.add('show');
  $('sheet').classList.add('show');
}
function closeSheet(){
  $('sheetBack').classList.remove('show');
  $('sheet').classList.remove('show');
}
$('gearBtn').addEventListener('click', openSheet);
$('sheetBack').addEventListener('click', closeSheet);
$('sheetCancel').addEventListener('click', closeSheet);
$('sheetSave').addEventListener('click', ()=>{
  const cap = clamp(+$('capInput').value || 500, 100, 2000);
  const goal = clamp(+$('goalInput').value || 2000, 500, 5000);
  state.capacity = cap;
  state.goal = goal;
  state.celebrated = state.drunk >= state.goal;
  renderRuler(); renderStats(); saveState();
  closeSheet();
});
// 抽屉里的 +/- 步进
function bindStep(btnId, inputId, step, min, max){
  $(btnId).addEventListener('click', ()=>{
    const inp = $(inputId);
    let v = (+inp.value || 0) + step;
    v = clamp(v, min, max);
    inp.value = v;
  });
}
bindStep('capDown', 'capInput', -50, 100, 2000);
bindStep('capUp', 'capInput', 50, 100, 2000);
bindStep('goalDown', 'goalInput', -100, 500, 5000);
bindStep('goalUp', 'goalInput', 100, 500, 5000);

/* ========== tab 占位 ========== */
document.querySelectorAll('.tab.disabled').forEach(t => {
  t.addEventListener('click', e => e.stopPropagation());
});

/* 启动 */
function init(){
  loadState();
  refreshDate();
  setInterval(refreshDate, 60000);
  renderRuler();
  renderWater();
  renderStats();
  renderHistory();
  animateWaves();
  scheduleReminder();
}
init();
</script>
</body>
</html>
