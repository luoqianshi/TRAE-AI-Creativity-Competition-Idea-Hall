<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章管理 - 诵诵</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/theme.css">
</head>
<body>
    <div class="app-shell">
        <div class="status-bar-spacer"></div>

        <header class="px-4 py-3 flex items-center justify-between" style="background: var(--color-surface);">
            <button onclick="window.location.href='index.html'" class="p-1.5 rounded-lg active:scale-95" style="background: var(--color-bg-secondary);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>
            <h1 class="text-lg font-bold" style="font-size: var(--text-lg); font-weight: var(--font-bold); color: var(--color-text-primary);">文章管理</h1>
            <button onclick="triggerFileUpload()" class="px-4 py-1.5 rounded-full text-white font-bold text-sm active:scale-95"
                    style="background: var(--color-primary); font-size: var(--text-sm); font-weight: var(--font-bold);">
                导入
            </button>
        </header>

        <div class="app-content">
            <div class="px-4 pb-24 pt-2 max-w-md mx-auto">
                <!-- 导入提示卡片 -->
                <div id="import-hint" class="flex flex-col items-center gap-2 py-6 px-5 rounded-2xl cursor-pointer active:opacity-70 transition-colors"
                     style="border: 2px dashed var(--color-border); background: var(--color-surface);"
                     onclick="triggerFileUpload()">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.7;">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <span class="text-sm font-semibold" style="font-size: var(--text-sm); font-weight: var(--font-medium); color: var(--color-text-secondary);">点击导入TXT文件</span>
                    <span class="text-xs" style="font-size: var(--text-xs); color: var(--color-text-tertiary);">支持 .txt 格式</span>
                </div>

                <input type="file" id="file-input" accept=".txt" style="display:none;" onchange="handleFileImport(event)">

                <!-- 文章列表 -->
                <section id="article-list" class="flex flex-col gap-3 mt-4"></section>

                <!-- 空状态 -->
                <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 text-center">
                    <svg class="w-20 h-20 mb-4" viewBox="0 0 24 24" fill="none" stroke="var(--color-border)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <line x1="10" y1="9" x2="8" y2="9"/>
                    </svg>
                    <span class="text-sm" style="font-size: var(--text-sm); color: var(--color-text-tertiary);">还没有文章，快去导入吧</span>
                </div>
            </div>
        </div>

        <!-- 导入预览弹窗 -->
        <div id="preview-modal" class="modal-overlay hidden">
            <div class="modal-content" style="width: 90%; max-width: 380px;">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold" style="font-size: var(--text-lg); font-weight: var(--font-bold); color: var(--color-text-primary);">确认导入</h3>
                    <button onclick="closePreviewModal()" class="p-1 rounded-lg active:scale-95" style="background: var(--color-bg-secondary);">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold mb-1.5" style="font-size: var(--text-xs); font-weight: var(--font-bold); color: var(--color-text-secondary);">字符编码</label>
                        <select id="import-encoding" class="w-full px-3 py-2.5 rounded-xl border-none outline-none"
                                style="background: var(--color-bg-secondary); border: 1.5px solid var(--color-border); font-size: var(--text-sm); color: var(--color-text-primary);">
                            <option value="utf-8" selected>UTF-8</option>
                            <option value="gbk">GBK / GB2312</option>
                            <option value="big5">Big5（繁体）</option>
                            <option value="utf-16">UTF-16</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1.5" style="font-size: var(--text-xs); font-weight: var(--font-bold); color: var(--color-text-secondary);">文章标题</label>
                        <input type="text" id="import-title" placeholder="请输入文章标题" class="w-full px-3 py-2.5 rounded-xl border-none outline-none focus:ring-2"
                               style="background: var(--color-bg-secondary); border: 1.5px solid var(--color-border); font-size: var(--text-sm); color: var(--color-text-primary);">
                    </div>
                    <div class="flex items-start gap-2 p-3 rounded-xl" style="background: rgba(255, 107, 53, 0.08);">
                        <svg class="flex-shrink-0 mt-0.5" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
                        </svg>
                        <p class="text-xs leading-relaxed" style="font-size: var(--text-xs); color: var(--color-text-secondary);">
                            导入前请先整理文章内容：删除页眉页脚、章节标题、作者信息、注释、特殊符号等无关内容，只保留正文，否则自动分段效果会受影响。
                        </p>
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1.5" style="font-size: var(--text-xs); font-weight: var(--font-bold); color: var(--color-text-secondary);">内容预览</label>
                        <div id="preview-content" class="w-full px-3 py-2.5 rounded-xl max-h-40 overflow-y-auto text-sm leading-relaxed"
                             style="background: var(--color-bg-secondary); border: 1.5px solid var(--color-border); font-size: var(--text-sm); color: var(--color-text-primary); white-space: pre-wrap;"></div>
                    </div>
                </div>

                <div class="flex gap-3 mt-4">
                    <button onclick="closePreviewModal()" class="flex-1 py-3 rounded-xl font-bold active:scale-95"
                            style="background: var(--color-bg-secondary); color: var(--color-text-secondary); font-size: var(--text-base); font-weight: var(--font-bold); border: 1.5px solid var(--color-border);">
                        取消
                    </button>
                    <button onclick="confirmImport()" class="flex-1 py-3 rounded-xl text-white font-bold active:scale-95"
                            style="background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light)); font-size: var(--text-base); font-weight: var(--font-bold);">
                        确认导入
                    </button>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <button onclick="window.location.href='index.html'" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span>首页</span>
            </button>
            <button onclick="window.location.href='new-game.html'" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>新游戏</span>
            </button>
            <button onclick="window.location.href='article.html'" class="nav-item nav-item--active">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                <span>文章</span>
            </button>
            <button onclick="window.location.href='history.html'" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <span>历史</span>
            </button>
            <button onclick="window.location.href='progress.html'" class="nav-item">
								<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"/>
                    <line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
                <span>背诵</span>
            </button>
        </nav>
    </div>
