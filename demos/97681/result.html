<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>结算页 - 诵诵</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/theme.css">
    <style>
        .sparkle-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            animation: sparkle 1.8s ease-in-out infinite;
        }
        .sparkle-dot:nth-child(2) { animation-delay: 0.3s; }
        .sparkle-dot:nth-child(3) { animation-delay: 0.6s; }
        .sparkle-dot:nth-child(4) { animation-delay: 0.9s; }
        .sparkle-dot:nth-child(5) { animation-delay: 1.2s; }
        .sparkle-dot:nth-child(6) { animation-delay: 0.4s; }
        .sparkle-dot:nth-child(7) { animation-delay: 0.8s; }
        .sparkle-dot:nth-child(8) { animation-delay: 1.5s; }

        .star-anim {
            animation: starPop 0.4s ease-out both;
        }
        .star-anim:nth-child(1) { animation-delay: 0.1s; }
        .star-anim:nth-child(2) { animation-delay: 0.25s; }
        .star-anim:nth-child(3) { animation-delay: 0.4s; }

        .score-anim {
            animation: scoreIn 0.6s ease-out 0.5s both;
        }

        .detail-row--correct { border-left: 3px solid var(--state-success); }
        .detail-row--hint { border-left: 3px solid var(--state-warning); }
        .detail-row--failed { border-left: 3px solid var(--state-error); }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="status-bar-spacer"></div>
        <div class="app-content">
            <div class="px-4 pb-8 pt-2 max-w-md mx-auto">
                <section class="relative overflow-hidden rounded-2xl text-center text-white py-8 px-6 mb-5"
                         style="background: linear-gradient(135deg, #FF6B35, #FF8F5E); box-shadow: 0 8px 24px rgba(255,107,53,0.3);">
                    <span class="sparkle-dot" style="top:10%; left:8%;"></span>
                    <span class="sparkle-dot" style="top:20%; right:12%;"></span>
                    <span class="sparkle-dot" style="top:60%; left:5%;"></span>
                    <span class="sparkle-dot" style="top:70%; right:8%;"></span>
                    <span class="sparkle-dot" style="bottom:15%; left:15%;"></span>
                    <span class="sparkle-dot" style="bottom:20%; right:15%;"></span>
                    <span class="sparkle-dot" style="top:40%; left:20%; width:4px; height:4px;"></span>
                    <span class="sparkle-dot" style="top:35%; right:20%; width:4px; height:4px;"></span>

                    <div class="flex justify-center gap-2 mb-4">
                        <svg id="star-1" class="star-anim" width="28" height="28" viewBox="0 0 24 24" fill="#FBBF24" stroke="#FBBF24" stroke-width="1">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        <svg id="star-2" class="star-anim" width="28" height="28" viewBox="0 0 24 24" fill="#FBBF24" stroke="#FBBF24" stroke-width="1">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        <svg id="star-3" class="star-anim" width="28" height="28" viewBox="0 0 24 24" fill="#FBBF24" stroke="#FBBF24" stroke-width="1">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                    </div>

                    <div class="score-anim">
                        <p id="score-display" class="text-4xl font-extrabold tracking-tight" style="font-size: var(--text-4xl); font-weight: var(--font-extrabold);">0分</p>
                    </div>

                    <p id="article-title" class="mt-2 text-sm opacity-90" style="font-size: var(--text-sm);">《静夜思》 · 0/0 句通过</p>

                    <span id="accuracy-badge" class="inline-block mt-3 px-3 py-1 rounded-full text-xs font-bold"
                          style="background: rgba(255,255,255,0.25); backdrop-filter: blur(4px); font-size: var(--text-xs); font-weight: var(--font-bold);">
                        正确率 0%
                    </span>
                </section>

                <section class="grid grid-cols-2 gap-3 mb-5">
                    <div class="rounded-xl p-4 text-center" style="background: var(--color-surface); box-shadow: var(--shadow-md);">
                        <svg class="mx-auto mb-1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                        </svg>
                        <p id="total-time" class="text-lg font-bold" style="font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-text-primary);">00:00</p>
                        <p class="text-xs mt-0.5" style="font-size: var(--text-xs); color: var(--color-text-secondary);">总用时</p>
                    </div>

                    <div class="rounded-xl p-4 text-center" style="background: var(--color-surface); box-shadow: var(--shadow-md);">
                        <svg class="mx-auto mb-1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-combo-glow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/>
                            <path d="M8 12l2 2 4-4" stroke="var(--color-combo-glow)"/>
                        </svg>
                        <p id="max-combo" class="text-lg font-bold" style="font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-combo-glow);">x0</p>
                        <p class="text-xs mt-0.5" style="font-size: var(--text-xs); color: var(--color-text-secondary);">最大连击</p>
                    </div>

                    <div class="rounded-xl p-4 text-center" style="background: var(--color-surface); box-shadow: var(--shadow-md);">
                        <svg class="mx-auto mb-1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 18h6"/><path d="M10 22h4"/>
                            <path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>
                        </svg>
                        <p id="hint-used" class="text-lg font-bold" style="font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-text-primary);">0次</p>
                        <p class="text-xs mt-0.5" style="font-size: var(--text-xs); color: var(--color-text-secondary);">使用提示</p>
                    </div>

                    <div class="rounded-xl p-4 text-center" style="background: var(--color-surface); box-shadow: var(--shadow-md);">
                        <svg class="mx-auto mb-1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--state-success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        <p id="correct-count" class="text-lg font-bold" style="font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-text-primary);">0/0</p>
                        <p class="text-xs mt-0.5" style="font-size: var(--text-xs); color: var(--color-text-secondary);">正确排序</p>
                    </div>
                </section>

                <section>
                                    <h3 class="text-sm font-bold mb-3" style="font-size: var(--text-sm); font-weight: var(--font-bold); color: var(--color-text-primary);">逐题详情</h3>
                    <div id="sentence-details" class="flex flex-col gap-2.5"></div>
                </section>

                <section class="mt-8 flex flex-col gap-3 px-2">
                    <a id="btn-retry" href="game.html" class="block w-full text-center py-3.5 rounded-xl text-white font-bold transition-transform active:scale-95"
                       style="background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light)); font-size: var(--text-base); font-weight: var(--font-bold); box-shadow: 0 4px 14px rgba(255,107,53,0.35);">
                        再来一次
                    </a>
                    <a href="index.html" class="block w-full text-center py-3.5 rounded-xl font-bold transition-transform active:scale-95"
                       style="background: var(--color-surface); color: var(--color-primary); font-size: var(--text-base); font-weight: var(--font-bold); border: 1.5px solid var(--color-border);">
                        返回首页
                    </a>
                </section>
            </div>
        </div>
    </div>
