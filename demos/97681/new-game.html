<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新游戏 - 诵诵</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/theme.css">
</head>
<body>
    <div class="app-shell">
        <div class="status-bar-spacer"></div>
        
        <header class="px-4 py-3 flex items-center justify-between" style="background: var(--color-surface);">
            <button onclick="goBack()" class="p-1.5 rounded-lg active:scale-95" style="background: var(--color-bg-secondary);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>
            <h1 class="text-lg font-bold" style="font-size: var(--text-lg); font-weight: var(--font-bold); color: var(--color-text-primary);">新游戏</h1>
            <div class="w-8"></div>
        </header>

        <div class="app-content">
            <div class="px-4 pb-24 pt-4 max-w-md mx-auto">
                <!-- 第一步：选择游戏方式 -->
                <section id="mode-selection-view">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="mode-card cursor-pointer rounded-2xl p-3 transition-all flex flex-col items-center" data-mode="connect"
                             style="min-height: 220px; background: var(--color-surface); box-shadow: var(--shadow-sm);">
                            <div class="mode-icon flex-1 w-full rounded-xl flex items-center justify-center mb-2" style="background: var(--color-bg-secondary);">
                                <svg class="mode-thumb" width="80" height="110" viewBox="0 0 80 110" fill="none" stroke="var(--color-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="4" y="4" width="28" height="12" rx="2"/>
                                    <rect x="4" y="22" width="28" height="12" rx="2"/>
                                    <rect x="4" y="40" width="28" height="12" rx="2"/>
                                    <rect x="4" y="58" width="28" height="12" rx="2"/>
                                    <rect x="4" y="76" width="28" height="12" rx="2"/>
                                    <rect x="4" y="94" width="28" height="12" rx="2"/>
                                    <rect x="48" y="4" width="28" height="12" rx="2"/>
                                    <rect x="48" y="22" width="28" height="12" rx="2"/>
                                    <rect x="48" y="40" width="28" height="12" rx="2"/>
                                    <rect x="48" y="58" width="28" height="12" rx="2"/>
                                    <rect x="48" y="76" width="28" height="12" rx="2"/>
                                    <rect x="48" y="94" width="28" height="12" rx="2"/>
                                    <path d="M32 10h16M32 28h16M32 46h16M32 64h16M32 82h16M32 100h16"/>
                                </svg>
                            </div>
                            <div class="text-center">
                                <p class="mode-title text-sm font-bold" style="font-size: var(--text-sm); font-weight: var(--font-bold); color: var(--color-text-primary);">连线游戏</p>
                                <p class="mode-desc text-xs mt-0.5" style="font-size: var(--text-xs); color: var(--color-text-tertiary);">左右连线匹配顺序</p>
                            </div>
                        </div>
                        <div class="mode-card cursor-pointer rounded-2xl p-3 transition-all flex flex-col items-center" data-mode="drag"
                             style="min-height: 220px; background: var(--color-surface); box-shadow: var(--shadow-sm);">
                            <div class="mode-icon flex-1 w-full rounded-xl flex items-center justify-center mb-2" style="background: var(--color-bg-secondary);">
                                <svg class="mode-thumb" width="80" height="110" viewBox="0 0 80 110" fill="none" stroke="var(--color-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <!-- 第一行：矩形 + 下划线空位 + 矩形 + 下划线空位 -->
                                    <rect x="2" y="6" width="20" height="12" rx="2"/>
                                    <line x1="25" y1="18" x2="37" y2="18" stroke-width="2.5"/>
                                    <rect x="40" y="6" width="16" height="12" rx="2"/>
                                    <line x1="59" y1="18" x2="71" y2="18" stroke-width="2.5"/>

                                    <!-- 第二行：矩形 + 下划线空位 + 矩形 + 下划线空位 -->
                                    <rect x="2" y="30" width="16" height="12" rx="2"/>
                                    <line x1="21" y1="42" x2="33" y2="42" stroke-width="2.5"/>
                                    <rect x="36" y="30" width="22" height="12" rx="2"/>
                                    <line x1="61" y1="42" x2="73" y2="42" stroke-width="2.5"/>

                                    <!-- 第三行：两个长度不同的目标矩形 -->
                                    <rect x="2" y="62" width="30" height="12" rx="2"/>
                                    <rect x="38" y="62" width="22" height="12" rx="2"/>

                                    <!-- 第四行：两个长度不同的目标矩形 -->
                                    <rect x="2" y="86" width="24" height="12" rx="2"/>
                                    <rect x="34" y="86" width="32" height="12" rx="2"/>
                                </svg>
                            </div>
                            <div class="text-center">
                                <p class="mode-title text-sm font-bold" style="font-size: var(--text-sm); font-weight: var(--font-bold); color: var(--color-text-primary);">排序游戏</p>
                                <p class="mode-desc text-xs mt-0.5" style="font-size: var(--text-xs); color: var(--color-text-tertiary);">拖拽词块到正确顺序</p>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 第二步：原有配置视图 -->
                <div id="config-view" class="hidden">
                    <section class="mb-6">
                        <h2 class="text-sm font-bold mb-3" style="font-size: var(--text-sm); font-weight: var(--font-bold); color: var(--color-text-secondary);">选择文章</h2>
                        <div id="article-select" class="flex flex-col gap-2"></div>
                    </section>

                    <section id="paragraph-section" class="mb-6 hidden">
                        <h2 class="text-sm font-bold mb-3" style="font-size: var(--text-sm); font-weight: var(--font-bold); color: var(--color-text-secondary);">选择段落</h2>
                        <div id="paragraph-select" class="flex flex-col gap-2 max-h-64 overflow-y-auto"></div>
                        <button id="select-all-btn" class="w-full mt-2 py-2 rounded-lg text-sm font-bold active:scale-95" 
                                style="background: var(--color-bg-secondary); color: var(--color-text-secondary); font-size: var(--text-sm); font-weight: var(--font-bold);">
                            全选
                        </button>
                    </section>

                    <section class="mb-8">
                        <h2 class="text-sm font-bold mb-3" style="font-size: var(--text-sm); font-weight: var(--font-bold); color: var(--color-text-secondary);">游戏设置</h2>
                        <div class="space-y-3">
                            <div class="flex items-center justify-between py-3 px-4 rounded-xl" style="background: var(--color-surface);">
                                <div>
                                    <p class="text-sm font-bold" style="font-size: var(--text-sm); font-weight: var(--font-bold); color: var(--color-text-primary);">限时模式</p>
                                    <p class="text-xs mt-0.5" style="font-size: var(--text-xs); color: var(--color-text-tertiary);">开启后超过时间自动提交</p>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="timed-mode">
                                    <span class="toggle-track"></span>
                                </label>
                            </div>

                            <div id="time-limit-container" class="flex items-center justify-between py-3 px-4 rounded-xl" style="background: var(--color-surface); opacity: 0.5; pointer-events: none;">
                                <div>
                                    <p class="text-sm font-bold" style="font-size: var(--text-sm); font-weight: var(--font-bold); color: var(--color-text-primary);">限时</p>
                                    <p class="text-xs mt-0.5" style="font-size: var(--text-xs); color: var(--color-text-tertiary);">超过时间自动提交</p>
                                </div>
                                <select id="time-limit" class="px-3 py-1.5 rounded-lg text-sm font-bold border-none outline-none" 
                                        style="background: var(--color-bg-secondary); color: var(--color-text-primary); font-size: var(--text-sm); font-weight: var(--font-bold);">
                                    <option value="60">60秒</option>
                                    <option value="120" selected>120秒</option>
                                    <option value="180">180秒</option>
                                    <option value="300">300秒</option>
                                </select>
                            </div>

                            <div class="flex items-center justify-between py-3 px-4 rounded-xl" style="background: var(--color-surface);">
                                <div>
                                    <p class="text-sm font-bold" style="font-size: var(--text-sm); font-weight: var(--font-bold); color: var(--color-text-primary);">提示功能</p>
                                    <p class="text-xs mt-0.5" style="font-size: var(--text-xs); color: var(--color-text-tertiary);">可查看正确顺序提示</p>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="hint-enabled" checked>
                                    <span class="toggle-track"></span>
                                </label>
                            </div>
                        </div>
                    </section>

                    <button onclick="startGame()" id="start-btn" class="w-full py-3.5 rounded-xl text-white font-bold active:scale-95 transition-all" 
                            style="background: var(--color-border); font-size: var(--text-base); font-weight: var(--font-bold); opacity: 0.5; pointer-events: none;">
                        开始游戏
                    </button>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <button onclick="window.location.href='index.html'" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span>首页</span>
            </button>
            <button onclick="window.location.href='new-game.html'" class="nav-item nav-item--active">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>新游戏</span>
            </button>
            <button onclick="window.location.href='article.html'" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                <span>文章</span>
            </button>
            <button onclick="window.location.href='history.html'" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <span>历史</span>
            </button>
            <button onclick="window.location.href='progress.html'" class="nav-item">
								<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"/>
                    <line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
                <span>背诵</span>
            </button>
        </nav>
    </div>
