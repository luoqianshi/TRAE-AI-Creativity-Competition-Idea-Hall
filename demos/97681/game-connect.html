<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>游戏页 - 连线排序</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/theme.css">
    <style>
        .game-shell { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .game-status-bar {
            position: sticky; top: 0; z-index: 50; background: var(--color-surface);
            border-bottom: 1px solid var(--color-border); padding: 12px 16px;
            padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .timer-ring { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
        .timer-ring svg { transform: rotate(-90deg); }
        .timer-ring__track { fill: none; stroke: var(--color-border); stroke-width: 3; }
        .timer-ring__progress { fill: none; stroke: var(--color-primary); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke 0.3s ease; }
        .timer-ring__progress--urgent { stroke: var(--color-timer-urgent); }
        .timer-ring__text {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: var(--text-xs); font-weight: var(--font-bold); color: var(--color-text-primary);
        }
        .combo-badge {
            display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: var(--radius-full);
            background: linear-gradient(135deg, #FBBF24, #F59E0B); color: #78350F;
            font-size: var(--text-xs); font-weight: var(--font-extrabold);
            box-shadow: 0 0 12px rgba(251,191,36,0.5);
            animation: combo-pulse 1.5s ease-in-out infinite;
        }
        .game-area {
            flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px;
            overflow-y: auto; padding-bottom: 160px;
        }
        .connect-game-area {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 42%) minmax(0, 42%);
            gap: 12px 24px;
            justify-content: center;
            flex: 1; min-height: 300px;
        }
        .connect-target,
        .connect-source {
            display: inline-flex; flex-direction: row; align-items: center; justify-content: center;
            min-height: 40px; min-width: 0; padding: 8px 10px; width: 100%;
            border-radius: var(--radius-md); border: 2px solid var(--color-block-border);
            background: var(--color-block-default); box-shadow: var(--shadow-block);
            cursor: pointer; user-select: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
            position: relative; white-space: normal; word-break: break-all; overflow-wrap: break-word;
            z-index: 2;
        }
        .connect-target:active { transform: scale(0.98); }
        .connect-target--selected {
            border-color: var(--color-primary) !important;
            background: rgba(255, 107, 53, 0.15) !important;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.25) !important;
        }
        .connect-source--matched {
            border-color: var(--color-block-correct-border);
            background: var(--color-block-correct);
            box-shadow: var(--shadow-block-correct);
        }
        .connect-source--wrong { animation: shake 0.5s ease-in-out; }
        .connect-source__text,
        .connect-target__text {
            font-size: var(--text-sm); font-weight: var(--font-bold); line-height: var(--leading-normal);
            text-align: center; color: var(--color-text-primary);
            white-space: normal; word-break: break-all; overflow-wrap: break-word;
        }
        .connect-line-layer {
            position: absolute; inset: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }
        .connect-line {
            fill: none; stroke: var(--color-primary); stroke-width: 2.5;
            stroke-linecap: round; filter: drop-shadow(0 2px 4px rgba(255,107,53,0.3));
        }
        .game-action-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
            background: var(--color-surface); border-top: 1px solid var(--color-border);
            padding: 12px 16px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
            display: flex; gap: 10px;
        }
        .action-btn {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
            border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--font-medium);
            cursor: pointer; transition: all 0.15s ease; text-decoration: none;
            border: 2px solid var(--color-border); background: var(--color-surface); color: var(--color-text-secondary);
        }
        .action-btn:active { transform: scale(0.97); background: var(--color-surface-hover); }
        .action-btn--primary {
            background: var(--color-primary); border-color: var(--color-primary); color: var(--color-text-inverse);
            font-size: var(--text-base); font-weight: var(--font-bold); box-shadow: 0 4px 12px rgba(255,107,53,0.35);
        }
        .action-btn--primary:disabled {
            opacity: 0.5; pointer-events: none;
        }
        .action-btn--primary:active { background: var(--color-primary-dark); box-shadow: 0 2px 6px rgba(255,107,53,0.25); }
        .game-bg-decor { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
        .game-bg-decor__blob { position: absolute; border-radius: var(--radius-full); filter: blur(80px); opacity: 0.15; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
    </style>
</head>
<body>
    <div class="game-bg-decor">
        <div class="game-bg-decor__blob" style="width:200px;height:200px;background:var(--color-primary);top:-60px;right:-40px;"></div>
        <div class="game-bg-decor__blob" style="width:160px;height:160px;background:var(--color-combo-glow);bottom:120px;left:-50px;"></div>
    </div>

    <div class="game-shell">
        <header class="game-status-bar">
            <button onclick="window.location.href='index.html'" class="flex items-center justify-center w-8 h-8 -ml-1 rounded-lg active:scale-95" style="background: var(--color-bg-secondary);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
            <span id="article-title" style="font-size:var(--text-sm);font-weight:var(--font-bold);color:var(--color-text-primary);">文章标题</span>
            <div class="timer-ring">
                <svg width="44" height="44" viewBox="0 0 44 44">
                    <circle class="timer-ring__track" cx="22" cy="22" r="18"/>
                    <circle id="timer-progress" class="timer-ring__progress" cx="22" cy="22" r="18" stroke-dasharray="113.1" stroke-dashoffset="0"/>
                </svg>
                <div id="timer-text" class="timer-ring__text">00:00</div>
            </div>
            <span id="score-text" style="font-size:var(--text-sm);font-weight:var(--font-extrabold);color:var(--color-primary);">0分</span>
            <button id="btn-end" class="flex items-center justify-center px-2 h-8 rounded-lg active:scale-95" style="background: var(--color-bg-secondary); font-size: var(--text-xs); font-weight: var(--font-bold); color: var(--color-text-secondary);">结束</button>
        </header>

        <div class="game-area">
            <div class="connect-game-area" id="connect-game-area">
                <svg class="connect-line-layer" id="line-layer"></svg>
            </div>
        </div>
    </div>

    <div class="game-action-bar">
        <button id="btn-hint" class="action-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <span id="hint-text">提示</span>
        </button>
        <button id="btn-reset" class="action-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10"/><path d="M3.5 17.5A9 9 0 1 0 2 12"/>
            </svg>
            重置
        </button>
        <button id="btn-submit" class="action-btn action-btn--primary" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
            确认提交
        </button>
    </div>

    <script src="src/js/game-manager.js"></script>
