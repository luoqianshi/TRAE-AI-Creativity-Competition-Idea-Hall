<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背诵情况 - 诵诵</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/theme.css">
</head>
<body>
    <div class="app-shell">
        <div class="status-bar-spacer"></div>
        
        <header class="px-4 py-3 flex items-center justify-between" style="background: var(--color-surface);">
            <button onclick="window.location.href='index.html'" class="p-1.5 rounded-lg active:scale-95" style="background: var(--color-bg-secondary);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>
            <h1 class="text-lg font-bold" style="font-size: var(--text-lg); font-weight: var(--font-bold); color: var(--color-text-primary);">背诵情况</h1>
            <div class="w-8"></div>
        </header>

        <div class="app-content">
            <div class="px-4 pb-24 pt-4 max-w-md mx-auto">
                <section class="rounded-2xl p-5 mb-5" style="background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light)); box-shadow: 0 8px 24px rgba(255,107,53,0.3);">
                    <div class="flex items-center justify-between mb-4">
                        <div>
                            <p class="text-white/80 text-sm" style="font-size: var(--text-sm);">总掌握进度</p>
                            <p id="total-progress" class="text-white text-3xl font-extrabold mt-1" style="font-size: var(--text-3xl); font-weight: var(--font-extrabold);">0%</p>
                        </div>
                        <div class="relative w-20 h-20">
                            <svg class="w-full h-full transform -rotate-90">
                                <circle cx="40" cy="40" r="35" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>
                                <circle id="progress-circle" cx="40" cy="40" r="35" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="220"/>
                            </svg>
                            <div class="absolute inset-0 flex items-center justify-center">
                                <span id="progress-count" class="text-white font-bold text-sm" style="font-size: var(--text-sm); font-weight: var(--font-bold);">0/0</span>
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div>
                            <p id="stat-articles" class="text-white text-xl font-bold" style="font-size: var(--text-xl); font-weight: var(--font-bold);">0</p>
                            <p class="text-white/70 text-xs" style="font-size: var(--text-xs);">文章</p>
                        </div>
                        <div>
                            <p id="stat-mastered" class="text-white text-xl font-bold" style="font-size: var(--text-xl); font-weight: var(--font-bold);">0</p>
                            <p class="text-white/70 text-xs" style="font-size: var(--text-xs);">已掌握</p>
                        </div>
                        <div>
                            <p id="stat-practiced" class="text-white text-xl font-bold" style="font-size: var(--text-xl); font-weight: var(--font-bold);">0</p>
                            <p class="text-white/70 text-xs" style="font-size: var(--text-xs);">练习次数</p>
                        </div>
                    </div>
                </section>

                <section>
                    <h2 class="text-sm font-bold mb-3" style="font-size: var(--text-sm); font-weight: var(--font-bold); color: var(--color-text-secondary);">文章掌握情况</h2>
                    <div id="progress-list" class="flex flex-col gap-3"></div>
                    
                    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-12 text-center">
                        <svg class="w-16 h-16 mb-4 opacity-40" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-secondary)" stroke-width="1.5">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                        </svg>
                        <p class="text-sm mb-2" style="font-size: var(--text-sm); color: var(--color-text-secondary);">暂无背诵数据</p>
                        <p class="text-xs" style="font-size: var(--text-xs); color: var(--color-text-tertiary);">完成游戏后会记录掌握情况</p>
                    </div>
                </section>

                <section class="mt-6">
                    <h2 class="text-sm font-bold mb-3" style="font-size: var(--text-sm); font-weight: var(--font-bold); color: var(--color-text-secondary);">连续学习</h2>
                    <div class="rounded-xl p-4" style="background: var(--color-surface); box-shadow: var(--shadow-md);">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl flex items-center justify-center" style="background: linear-gradient(135deg, #FBBF24, #F59E0B);">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/>
                                </svg>
                            </div>
                            <div>
                                <p class="font-bold" style="font-size: var(--text-base); font-weight: var(--font-bold); color: var(--color-text-primary);">连续 <span id="streak-days">0</span> 天</p>
                                <p class="text-xs" style="font-size: var(--text-xs); color: var(--color-text-tertiary);">保持学习，不要中断！</p>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <nav class="bottom-nav">
            <button onclick="window.location.href='index.html'" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span>首页</span>
            </button>
            <button onclick="window.location.href='new-game.html'" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>新游戏</span>
            </button>
            <button onclick="window.location.href='article.html'" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                <span>文章</span>
            </button>
            <button onclick="window.location.href='history.html'" class="nav-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <span>历史</span>
            </button>
            <button onclick="window.location.href='progress.html'" class="nav-item nav-item--active">
								<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                    <line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
                <span>背诵</span>
            </button>
        </nav>
