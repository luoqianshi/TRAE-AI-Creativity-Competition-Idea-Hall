<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>首页 - 诵诵</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/theme.css">
    <style>
        .continue-card {
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .continue-card:active {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.35);
        }
        .progress-bar__track {
            background: rgba(255, 255, 255, 0.3);
            border-radius: var(--radius-full);
            height: 6px;
            overflow: hidden;
        }
        .progress-bar__fill {
            background: var(--color-text-inverse);
            border-radius: var(--radius-full);
            height: 100%;
            transition: width 0.3s ease;
        }
        .func-card {
            background-color: var(--color-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-block);
            transition: transform 0.15s ease;
            text-decoration: none;
            display: block;
        }
        .func-card:active {
            transform: translateY(-2px);
        }
        .func-card__icon-wrap {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background-color: var(--color-block-default);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .func-card__icon-wrap svg {
            width: 22px;
            height: 22px;
            color: var(--color-primary);
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="status-bar-spacer"></div>
        <div class="app-content">
            <div class="page-container" style="padding: var(--space-5) var(--space-5) var(--space-8);">
                <header class="flex items-center gap-3 mb-6">
                    <div style="width:40px;height:40px;border-radius:var(--radius-md);background:linear-gradient(135deg,var(--color-primary),var(--color-primary-light));display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15z"/>
                            <circle cx="15" cy="11" r="2"/>
                            <path d="M13 9v4"/>
                            <path d="M15 7v8"/>
                        </svg>
                    </div>
                    <div>
                        <h1 style="font-size:var(--text-xl);font-weight:var(--font-extrabold);color:var(--color-primary);line-height:var(--leading-tight);">诵诵</h1>
                        <p style="font-size:var(--text-xs);color:var(--color-text-secondary);margin-top:2px;">拖拽排序，轻松背诵</p>
                    </div>
                </header>

                <a href="game.html" class="continue-card block p-5 mb-5">
                    <div class="flex items-center justify-between">
                        <div class="flex-1">
                            <p style="font-size:var(--text-sm);color:rgba(255,255,255,0.8);font-weight:var(--font-medium);margin-bottom:4px;">上次未完成</p>
                            <h2 style="font-size:var(--text-lg);color:var(--color-text-inverse);font-weight:var(--font-bold);line-height:var(--leading-tight);">继续学习</h2>
                            <p style="font-size:var(--text-sm);color:rgba(255,255,255,0.85);margin-top:4px;">《静夜思》 · 第3/8句</p>
                            <div class="progress-bar__track mt-3" style="width:120px;">
                                <div class="progress-bar__fill" style="width:37.5%;"></div>
                            </div>
                        </div>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-left:var(--space-3);">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </div>
                </a>

                <div class="grid grid-cols-2 gap-3">
                    <a href="article.html" class="func-card p-4">
                        <div class="func-card__icon-wrap mb-3">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>

                                <line x1="16" y1="13" x2="8" y2="13"/>
                                <line x1="16" y1="17" x2="8" y2="17"/>

                        </div>
                        <h3 style="font-size:var(--text-sm);font-weight:var(--font-bold);color:var(--color-text-primary);line-height:var(--leading-tight);">文章管理</h3>
                        <p style="font-size:var(--text-xs);color:var(--color-text-secondary);margin-top:4px;line-height:1.4;">管理导入的文章</p>
                        <svg class="mt-2" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </a>

                    <a href="new-game.html" class="func-card p-4">
                        <div class="func-card__icon-wrap mb-3">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="7" height="7" rx="1"/>
                                <rect x="14" y="3" width="7" height="7" rx="1"/>
                                <rect x="3" y="14" width="7" height="7" rx="1"/>
                                <rect x="14" y="14" width="7" height="7" rx="1"/>
                            </svg>
                        </div>
                        <h3 style="font-size:var(--text-sm);font-weight:var(--font-bold);color:var(--color-text-primary);line-height:var(--leading-tight);">新游戏</h3>
                        <p style="font-size:var(--text-xs);color:var(--color-text-secondary);margin-top:4px;line-height:1.4;">选择文章开始背诵</p>
                        <svg class="mt-2" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </a>

                    <a href="history.html" class="func-card p-4">
                        <div class="func-card__icon-wrap mb-3">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <polyline points="12 6 12 12 16 14"/>
                            </svg>
                        </div>
                        <h3 style="font-size:var(--text-sm);font-weight:var(--font-bold);color:var(--color-text-primary);line-height:var(--leading-tight);">历史游戏</h3>
                        <p style="font-size:var(--text-xs);color:var(--color-text-secondary);margin-top:4px;line-height:1.4;">查看过往游戏记录</p>
                        <svg class="mt-2" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </a>

                    <a href="progress.html" class="func-card p-4">
                        <div class="func-card__icon-wrap mb-3">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="20" x2="18" y2="10"/>
                                <line x1="12" y1="20" x2="12" y2="4"/>
                                <line x1="6" y1="20" x2="6" y2="14"/>
                            </svg>
                        </div>
                        <h3 style="font-size:var(--text-sm);font-weight:var(--font-bold);color:var(--color-text-primary);line-height:var(--leading-tight);">背诵情况</h3>
                        <p style="font-size:var(--text-xs);color:var(--color-text-secondary);margin-top:4px;line-height:1.4;">了解背诵进度统计</p>
                        <svg class="mt-2" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>

                <div class="tab-item__icon-wrapper">
                    <svg class="tab-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <line x1="12" y1="8" x2="12" y2="16"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                    </svg>
                </div>
                <span class="tab-item__label">新游戏</span>
            </a>
            <a class="tab-item" data-tab-key="history" href="history.html">

                    <circle cx="12" cy="12" r="10"/>
