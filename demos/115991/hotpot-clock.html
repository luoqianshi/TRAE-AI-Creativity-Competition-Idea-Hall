<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>火锅时钟 - 单文件原型</title>
  <style>
    /* 基础重置：保持小程序式紧凑、清爽的移动端体验 */
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #241915;
      background: radial-gradient(circle at 50% 0%, #ffe2c8 0, #fff7ef 34%, #f2f4f3 100%);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
    }

    /* 手机外壳：固定 375px 宽度，模拟轻量小程序运行环境 */
    .phone {
      position: relative;
      width: 375px;
      height: 812px;
      overflow: hidden;
      border: 8px solid #16110f;
      border-radius: 34px;
      background: #fff7ef;
      box-shadow: 0 24px 70px rgba(45, 22, 10, 0.26), inset 0 0 0 1px rgba(255,255,255,0.25);
    }

    .app {
      height: 100%;
      overflow-y: auto;
      padding: 0 14px 18px;
      scrollbar-width: none;
    }

    .app::-webkit-scrollbar {
      display: none;
    }

    .status-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 28px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 8px 4px;
      color: #2a201c;
      background: linear-gradient(180deg, #fff7ef 0%, rgba(255,247,239,0.9) 72%, rgba(255,247,239,0) 100%);
      font-size: 12px;
      font-weight: 700;
    }

    .nav {
      position: sticky;
      top: 28px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 0 4px 8px;
      background: linear-gradient(180deg, #fff7ef 0%, rgba(255,247,239,0.92) 80%, rgba(255,247,239,0) 100%);
    }

    .nav-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .capsule {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 30px;
      padding: 0 10px;
      border: 1px solid rgba(36, 25, 21, 0.12);
      border-radius: 16px;
      background: rgba(255,255,255,0.68);
      color: #5e514d;
      box-shadow: 0 4px 12px rgba(84, 42, 16, 0.08);
    }

    .capsule:active,
    .dish-card:active,
    .pill:active,
    .mini-btn:active,
    .main-btn:active {
      transform: scale(0.97);
    }

    .hero {
      margin-top: 4px;
      padding: 18px 16px;
      border-radius: 8px;
      color: #fff;
      background:
        radial-gradient(circle at 88% 24%, rgba(255,255,255,0.28) 0 18%, transparent 19%),
        linear-gradient(135deg, #f04438 0%, #ff8a3d 58%, #f6b73c 100%);
      box-shadow: 0 16px 28px rgba(240, 68, 56, 0.24);
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .hero h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .hero p {
      margin: 8px 0 0;
      max-width: 226px;
      color: rgba(255,255,255,0.9);
      font-size: 13px;
      line-height: 1.45;
    }

    .steam {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      font-size: 28px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.28);
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .stat-chip {
      min-width: 0;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.22);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .section {
      margin-top: 16px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .section-note {
      font-size: 12px;
      color: #8a7168;
      font-weight: 700;
    }

    .timer-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 270px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .empty-state {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 12px;
      align-items: center;
      min-height: 92px;
      padding: 16px;
      border: 1px dashed rgba(240, 68, 56, 0.28);
      border-radius: 8px;
      background: rgba(255,255,255,0.58);
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #fff1e7;
      font-size: 24px;
    }

    .empty-title {
      font-weight: 900;
      font-size: 15px;
    }

    .empty-text {
      margin-top: 4px;
      color: #8a7168;
      font-size: 12px;
      line-height: 1.4;
    }

    .timer-card {
      position: relative;
      overflow: hidden;
      padding: 12px;
      border: 1px solid rgba(118, 74, 51, 0.12);
      border-radius: 8px;
      background: #fffefd;
      box-shadow: 0 8px 22px rgba(52, 31, 20, 0.08);
    }

    .timer-card.done {
      border-color: rgba(240, 68, 56, 0.72);
      background: #fff4ef;
      animation: pulseDone 1s infinite;
    }

    @keyframes pulseDone {
      0%, 100% { box-shadow: 0 8px 22px rgba(240, 68, 56, 0.14); }
      50% { box-shadow: 0 8px 28px rgba(240, 68, 56, 0.32); }
    }

    .timer-main {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .food-avatar {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #fff1e7;
      font-size: 22px;
    }

    .timer-name {
      font-size: 15px;
      font-weight: 900;
    }

    .timer-hint {
      margin-top: 3px;
      color: #8a7168;
      font-size: 12px;
      line-height: 1.3;
    }

    .time-left {
      text-align: right;
      color: #f04438;
      font-size: 24px;
      font-weight: 950;
      line-height: 1;
      min-width: 60px;
    }

    .timer-card.done .time-left {
      font-size: 18px;
      line-height: 1.15;
    }

    .progress {
      height: 7px;
      overflow: hidden;
      margin-top: 11px;
      border-radius: 999px;
      background: #f4dfd2;
    }

    .progress span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #16a085 0%, #ffb23f 48%, #f04438 100%);
      transition: width 0.25s ease;
    }

    .timer-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .mini-btn,
    .main-btn,
    .pill {
      transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease, box-shadow 0.12s ease;
    }

    .mini-btn {
      height: 32px;
      border-radius: 8px;
      background: #f4eee9;
      color: #5b4036;
      font-size: 12px;
      font-weight: 800;
    }

    .mini-btn.primary {
      background: #241915;
      color: #fff;
    }

    .mini-btn.hot {
      background: #f04438;
      color: #fff;
    }

    .search-box {
      position: relative;
      margin-bottom: 10px;
    }

    .search-box input {
      width: 100%;
      height: 42px;
      padding: 0 40px 0 14px;
      border: 1px solid rgba(118, 74, 51, 0.12);
      border-radius: 8px;
      outline: 0;
      background: rgba(255,255,255,0.78);
      color: #241915;
      font-size: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .search-box input:focus {
      border-color: rgba(240, 68, 56, 0.45);
      box-shadow: 0 0 0 3px rgba(240, 68, 56, 0.09);
    }

    .search-icon {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #a88d82;
      font-size: 15px;
    }

    .category-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 10px;
      scrollbar-width: none;
    }

    .category-row::-webkit-scrollbar {
      display: none;
    }

    .pill {
      flex: 0 0 auto;
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.74);
      color: #6f554b;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 6px 16px rgba(52, 31, 20, 0.06);
    }

    .pill.active {
      background: #241915;
      color: #fff;
    }

    .dish-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .dish-card {
      min-height: 126px;
      padding: 12px;
      border: 1px solid rgba(118, 74, 51, 0.12);
      border-radius: 8px;
      background: #fffefd;
      text-align: left;
      box-shadow: 0 8px 20px rgba(52, 31, 20, 0.07);
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    }

    .dish-card:hover {
      border-color: rgba(240, 68, 56, 0.22);
      box-shadow: 0 10px 22px rgba(52, 31, 20, 0.1);
    }

    .dish-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .dish-emoji {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #fff1e7;
      font-size: 21px;
    }

    .dish-time {
      padding: 4px 7px;
      border-radius: 999px;
      background: #ecf7f1;
      color: #14785f;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .dish-name {
      margin-top: 10px;
      color: #241915;
      font-size: 15px;
      font-weight: 950;
    }

    .dish-hint {
      min-height: 32px;
      margin-top: 4px;
      color: #8a7168;
      font-size: 12px;
      line-height: 1.35;
    }

    .main-btn {
      width: 100%;
      height: 32px;
      margin-top: 10px;
      border-radius: 8px;
      background: #f04438;
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 8px 14px rgba(240, 68, 56, 0.2);
    }

    .custom-bar {
      position: sticky;
      bottom: 0;
      z-index: 10;
      margin-top: 16px;
      padding: 10px;
      border: 1px solid rgba(118, 74, 51, 0.12);
      border-radius: 8px;
      background: rgba(255, 253, 250, 0.92);
      box-shadow: 0 -8px 22px rgba(52, 31, 20, 0.08);
      backdrop-filter: blur(12px);
    }

    .custom-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 900;
    }

    .custom-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 86px;
      z-index: 40;
      max-width: 292px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(36, 25, 21, 0.9);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      transform: translateX(-50%) translateY(18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 430px) {
      .page-wrap {
        padding: 0;
      }

      .phone {
        width: 100vw;
        height: 100vh;
        border: 0;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <main class="phone" aria-label="火锅时钟原型">
      <div class="app">
        <div class="status-bar">
          <span>19:30</span>
          <span>5G  100%</span>
        </div>

        <nav class="nav" aria-label="小程序导航">
          <div class="nav-title">火锅时钟</div>
          <button class="capsule" type="button" onclick="showToast('这是小程序胶囊菜单模拟')">
            <span>•••</span>
            <span>○</span>
          </button>
        </nav>

        <section class="hero">
          <div class="hero-top">
            <div>
              <h1>选个菜<br>开始涮</h1>
              <p id="heroText">到点就捞，别让毛肚变老。</p>
            </div>
            <div class="steam" aria-hidden="true">🍲</div>
          </div>
          <div class="stat-row">
            <span class="stat-chip" id="runningChip">正在涮 0 个</span>
            <span class="stat-chip" id="doneChip">待捞 0 个</span>
          </div>
        </section>

        <section class="section" aria-label="正在涮计时区">
          <div class="section-head">
            <h2 class="section-title">正在涮</h2>
            <span class="section-note" id="timerNote">先选一个菜</span>
          </div>
          <div class="timer-area" id="timerArea"></div>
        </section>

        <section class="section" aria-label="快速选菜区">
          <div class="section-head">
            <h2 class="section-title">快速选菜</h2>
            <span class="section-note">点卡片就开始</span>
          </div>

          <div class="search-box">
            <input id="searchInput" type="search" placeholder="搜毛肚、牛肉、虾滑" autocomplete="off">
            <span class="search-icon" aria-hidden="true">⌕</span>
          </div>

          <div class="category-row" id="categoryRow" aria-label="食材分类"></div>
          <div class="dish-grid" id="dishGrid"></div>
        </section>

        <section class="custom-bar" aria-label="自定义计时">
          <div class="custom-title">
            <span>自定义计时</span>
            <span style="color:#8a7168;font-size:12px;">不确定菜名时用</span>
          </div>
          <div class="custom-actions">
            <button class="mini-btn" type="button" onclick="addCustomTimer(30)">30秒</button>
            <button class="mini-btn" type="button" onclick="addCustomTimer(60)">1分钟</button>
            <button class="mini-btn" type="button" onclick="addCustomTimer(180)">3分钟</button>
          </div>
        </section>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </div>

  <script>
    /* 本地模拟数据：所有菜品、分类、计时任务都只在前端内存中运行 */
    const categories = [
      { id: "quick", name: "常用", icon: "⭐" },
      { id: "offal", name: "脆口", icon: "🔥" },
      { id: "meat", name: "肉", icon: "🥩" },
      { id: "seafood", name: "海鲜", icon: "🦐" },
      { id: "balls", name: "丸滑", icon: "🍡" },
      { id: "vegetable", name: "菜", icon: "🥬" },
      { id: "tofu", name: "豆制品", icon: "◻" }
    ];

    const dishes = [
      { id: "maodu", name: "毛肚", categoryId: "offal", emoji: "🔥", seconds: 15, timeText: "15秒", hint: "七上八下，脆口刚好", isCommon: true },
      { id: "yachang", name: "鸭肠", categoryId: "offal", emoji: "〰", seconds: 12, timeText: "12秒", hint: "变卷变脆就可以捞", isCommon: true },
      { id: "huanghou", name: "黄喉", categoryId: "offal", emoji: "✨", seconds: 60, timeText: "1分钟", hint: "爽脆口感，别久煮", isCommon: false },
      { id: "beef", name: "嫩牛肉", categoryId: "meat", emoji: "🥩", seconds: 45, timeText: "45秒", hint: "完全变色，口感嫩", isCommon: true },
      { id: "mutton", name: "羊肉卷", categoryId: "meat", emoji: "🥓", seconds: 35, timeText: "35秒", hint: "散开变色即可入口", isCommon: true },
      { id: "luncheon", name: "午餐肉", categoryId: "meat", emoji: "▣", seconds: 120, timeText: "2分钟", hint: "煮透更香，边缘微卷", isCommon: false },
      { id: "shrimp_paste", name: "虾滑", categoryId: "balls", emoji: "🦐", seconds: 180, timeText: "3分钟", hint: "浮起后再煮一小会儿", isCommon: true },
      { id: "beef_ball", name: "牛肉丸", categoryId: "balls", emoji: "🍡", seconds: 240, timeText: "4分钟", hint: "丸子鼓起后更安心", isCommon: false },
      { id: "fish_ball", name: "鱼丸", categoryId: "balls", emoji: "⚪", seconds: 180, timeText: "3分钟", hint: "浮起后继续煮片刻", isCommon: false },
      { id: "gong_ball", name: "贡丸", categoryId: "balls", emoji: "◉", seconds: 240, timeText: "4分钟", hint: "厚实丸类需要煮透", isCommon: false },
      { id: "fresh_shrimp", name: "鲜虾", categoryId: "seafood", emoji: "🦐", seconds: 150, timeText: "2分30秒", hint: "虾身变红弯曲再捞", isCommon: false },
      { id: "basa", name: "巴沙鱼片", categoryId: "seafood", emoji: "🐟", seconds: 70, timeText: "70秒", hint: "鱼片变白即可，动作轻", isCommon: false },
      { id: "lettuce", name: "生菜", categoryId: "vegetable", emoji: "🥬", seconds: 20, timeText: "20秒", hint: "轻涮保持清爽", isCommon: true },
      { id: "baby_cabbage", name: "娃娃菜", categoryId: "vegetable", emoji: "🥬", seconds: 150, timeText: "2分30秒", hint: "菜帮变软更入味", isCommon: false },
      { id: "enoki", name: "金针菇", categoryId: "vegetable", emoji: "🍄", seconds: 180, timeText: "3分钟", hint: "菌菇类建议煮熟", isCommon: true },
      { id: "potato", name: "土豆片", categoryId: "vegetable", emoji: "🥔", seconds: 120, timeText: "2分钟", hint: "薄片软糯，厚片加时", isCommon: false },
      { id: "frozen_tofu", name: "冻豆腐", categoryId: "tofu", emoji: "◻", seconds: 240, timeText: "4分钟", hint: "吸满汤汁后更好吃", isCommon: false },
      { id: "tofu_skin", name: "豆皮", categoryId: "tofu", emoji: "▱", seconds: 50, timeText: "50秒", hint: "变软入味就可以捞", isCommon: true }
    ];

    const state = {
      selectedCategoryId: "quick",
      searchKeyword: "",
      timers: [],
      toastTimer: null,
      audioReady: false,
      audioContext: null
    };

    const els = {
      heroText: document.getElementById("heroText"),
      runningChip: document.getElementById("runningChip"),
      doneChip: document.getElementById("doneChip"),
      timerNote: document.getElementById("timerNote"),
      timerArea: document.getElementById("timerArea"),
      categoryRow: document.getElementById("categoryRow"),
      dishGrid: document.getElementById("dishGrid"),
      searchInput: document.getElementById("searchInput"),
      toast: document.getElementById("toast")
    };

    function formatTime(seconds) {
      if (seconds <= 0) return "该捞了";
      const min = Math.floor(seconds / 60);
      const sec = seconds % 60;
      if (min <= 0) return String(sec).padStart(2, "0") + "秒";
      return min + ":" + String(sec).padStart(2, "0");
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function showToast(message) {
      clearTimeout(state.toastTimer);
      els.toast.textContent = message;
      els.toast.classList.add("show");
      state.toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1600);
    }

    /* 浏览器通常需要一次用户点击后才允许播放提示音 */
    function prepareAudio() {
      if (state.audioReady) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      state.audioContext = new AudioContext();
      state.audioReady = true;
    }

    function playDoneSound() {
      if (!state.audioContext) return;
      const ctx = state.audioContext;
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(720, ctx.currentTime);
      oscillator.frequency.setValueAtTime(920, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.32);
      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start();
      oscillator.stop(ctx.currentTime + 0.34);
    }

    function notifyDone(timer) {
      playDoneSound();
      if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
      showToast(timer.name + "该捞了！");
    }

    function getVisibleDishes() {
      const keyword = state.searchKeyword.trim().toLowerCase();
      return dishes.filter(dish => {
        const matchCategory = state.selectedCategoryId === "quick"
          ? dish.isCommon
          : dish.categoryId === state.selectedCategoryId;
        const matchSearch = !keyword || dish.name.toLowerCase().includes(keyword);
        return matchCategory && matchSearch;
      });
    }

    function renderCategories() {
      els.categoryRow.innerHTML = categories.map(category => `
        <button
          class="pill ${category.id === state.selectedCategoryId ? "active" : ""}"
          type="button"
          onclick="selectCategory('${category.id}')"
        >
          ${category.icon} ${category.name}
        </button>
      `).join("");
    }

    function renderDishes() {
      const visibleDishes = getVisibleDishes();
      if (!visibleDishes.length) {
        els.dishGrid.innerHTML = `
          <div class="empty-state" style="grid-column:1 / -1;">
            <div class="empty-icon">⌕</div>
            <div>
              <div class="empty-title">没找到这个菜</div>
              <div class="empty-text">可以先用底部自定义计时，边吃边调整。</div>
            </div>
          </div>
        `;
        return;
      }

      els.dishGrid.innerHTML = visibleDishes.map(dish => `
        <button class="dish-card" type="button" onclick="addDishTimer('${dish.id}')">
          <div class="dish-top">
            <span class="dish-emoji">${dish.emoji}</span>
            <span class="dish-time">${dish.timeText}</span>
          </div>
          <div class="dish-name">${escapeHtml(dish.name)}</div>
          <div class="dish-hint">${escapeHtml(dish.hint)}</div>
          <div class="main-btn">开始</div>
        </button>
      `).join("");
    }

    function renderTimers() {
      const runningCount = state.timers.filter(timer => timer.status === "running" || timer.status === "paused").length;
      const doneCount = state.timers.filter(timer => timer.status === "done").length;
      els.runningChip.textContent = "正在涮 " + runningCount + " 个";
      els.doneChip.textContent = "待捞 " + doneCount + " 个";

      if (doneCount > 0) {
        els.heroText.textContent = "有菜到点了，先捞再继续下。";
        els.timerNote.textContent = doneCount + " 个该捞了";
      } else if (runningCount > 0) {
        els.heroText.textContent = "盯住上面的时间，下面继续加菜。";
        els.timerNote.textContent = "火候进行中";
      } else {
        els.heroText.textContent = "到点就捞，别让毛肚变老。";
        els.timerNote.textContent = "先选一个菜";
      }

      if (!state.timers.length) {
        els.timerArea.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🍲</div>
            <div>
              <div class="empty-title">还没下菜</div>
              <div class="empty-text">点下面的菜品卡片，计时会立刻出现在这里。</div>
            </div>
          </div>
        `;
        return;
      }

      els.timerArea.innerHTML = state.timers.map(timer => {
        const progress = Math.max(0, Math.min(100, (timer.remaining / timer.total) * 100));
        const isDone = timer.status === "done";
        const pauseLabel = timer.status === "paused" ? "继续" : "暂停";
        const timeText = isDone ? "该捞了" : formatTime(timer.remaining);
        return `
          <article class="timer-card ${isDone ? "done" : ""}">
            <div class="timer-main">
              <div class="food-avatar">${timer.emoji}</div>
              <div>
                <div class="timer-name">${escapeHtml(timer.name)}</div>
                <div class="timer-hint">${isDone ? "再煮就影响口感了" : escapeHtml(timer.hint)}</div>
              </div>
              <div class="time-left">${timeText}</div>
            </div>
            <div class="progress" aria-label="倒计时进度">
              <span style="width:${progress}%"></span>
            </div>
            <div class="timer-actions">
              <button class="mini-btn ${isDone ? "hot" : ""}" type="button" onclick="${isDone ? `removeTimer('${timer.id}')` : `toggleTimer('${timer.id}')`}">${isDone ? "已捞出" : pauseLabel}</button>
              <button class="mini-btn primary" type="button" onclick="restartTimer('${timer.id}')">再来一轮</button>
              <button class="mini-btn" type="button" onclick="removeTimer('${timer.id}')">${isDone ? "收起" : "已捞出"}</button>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderAll() {
      renderCategories();
      renderDishes();
      renderTimers();
    }

    function selectCategory(categoryId) {
      state.selectedCategoryId = categoryId;
      renderCategories();
      renderDishes();
    }

    function createTimerFromDish(dish) {
      return {
        id: "timer_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
        dishId: dish.id,
        name: dish.name,
        emoji: dish.emoji,
        hint: dish.hint,
        total: dish.seconds,
        remaining: dish.seconds,
        status: "running",
        notified: false
      };
    }

    function addDishTimer(dishId) {
      prepareAudio();
      const dish = dishes.find(item => item.id === dishId);
      if (!dish) return;
      state.timers.unshift(createTimerFromDish(dish));
      showToast(dish.name + "已开始计时");
      renderTimers();
    }

    function addCustomTimer(seconds) {
      prepareAudio();
      const label = seconds >= 60 ? Math.floor(seconds / 60) + "分钟" : seconds + "秒";
      state.timers.unshift({
        id: "timer_" + Date.now() + "_" + Math.floor(Math.random() * 1000),
        dishId: "custom",
        name: "自定义 " + label,
        emoji: "⏱",
        hint: "按自己的火候来，到点提醒",
        total: seconds,
        remaining: seconds,
        status: "running",
        notified: false
      });
      showToast("自定义计时已开始");
      renderTimers();
    }

    function toggleTimer(timerId) {
      const timer = state.timers.find(item => item.id === timerId);
      if (!timer || timer.status === "done") return;
      timer.status = timer.status === "paused" ? "running" : "paused";
      showToast(timer.status === "paused" ? "已暂停" : "继续计时");
      renderTimers();
    }

    function restartTimer(timerId) {
      prepareAudio();
      const timer = state.timers.find(item => item.id === timerId);
      if (!timer) return;
      timer.remaining = timer.total;
      timer.status = "running";
      timer.notified = false;
      showToast(timer.name + "再来一轮");
      renderTimers();
    }

    function removeTimer(timerId) {
      const timer = state.timers.find(item => item.id === timerId);
      state.timers = state.timers.filter(item => item.id !== timerId);
      showToast(timer ? timer.name + "已捞出" : "已移除");
      renderTimers();
    }

    function tickTimers() {
      let changed = false;
      state.timers.forEach(timer => {
        if (timer.status !== "running") return;
        timer.remaining -= 1;
        changed = true;
        if (timer.remaining <= 0) {
          timer.remaining = 0;
          timer.status = "done";
          if (!timer.notified) {
            timer.notified = true;
            notifyDone(timer);
          }
        }
      });
      if (changed) renderTimers();
    }

    els.searchInput.addEventListener("input", event => {
      state.searchKeyword = event.target.value;
      renderDishes();
    });

    renderAll();
    setInterval(tickTimers, 1000);
  </script>
</body>
</html>
