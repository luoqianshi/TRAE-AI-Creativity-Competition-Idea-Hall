<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和小猫一起学习</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe4e1 0%, #e6e6fa 50%, #fff5ee 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .title {
            font-size: 28px;
            color: #ff69b4;
            text-shadow: 2px 2px 4px rgba(255, 105, 180, 0.3);
            margin-bottom: 20px;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            background: #fff0f5;
            padding: 15px 20px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .score-item { display: flex; flex-direction: column; }
        .score-label { font-size: 12px; color: #888; }
        .score-value { font-size: 24px; font-weight: bold; color: #ff69b4; }
        .cat-container {
            position: relative;
            height: 200px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cat {
            font-size: 120px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }
        .cat.happy { animation: bounce 0.5s ease infinite; transform: scale(1.1); }
        .cat.sad { animation: shake 0.3s ease; opacity: 0.7; }
        .cat.celebrate { animation: spin 0.8s ease; }
        .cat-thought {
            position: absolute;
            top: 20px;
            right: 50px;
            background: white;
            padding: 15px 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            font-size: 18px;
            color: #333;
            max-width: 150px;
            animation: fadeIn 0.3s ease;
            z-index: 3;
        }
        .cat-thought::before {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 30px;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid white;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .question-box {
            background: linear-gradient(135deg, #ffb6c1 0%, #87ceeb 100%);
            padding: 30px;
            border-radius: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.4);
        }
        .question-text {
            font-size: 36px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .option-btn {
            background: #fff0f5;
            border: none;
            padding: 20px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #ff69b4;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.2);
        }
        .option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.3);
            background: #ffe4e1;
        }
        .option-btn:active { transform: translateY(0); }
        .option-btn.correct { background: #90ee90; color: white; }
        .option-btn.wrong { background: #ffb6c1; color: white; }
        .feedback {
            font-size: 20px;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        .feedback.correct { background: #e8f5e9; color: #2e7d32; }
        .feedback.wrong { background: #ffebee; color: #c62828; }
        .progress-bar {
            height: 10px;
            background: #ffe4e1;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff69b4, #87ceeb);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .start-screen, .result-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 30px;
        }
        .hidden { display: none !important; }
        .start-btn, .restart-btn {
            background: linear-gradient(135deg, #ff69b4, #87ceeb);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.4);
            transition: all 0.2s ease;
        }
        .start-btn:hover, .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.5);
        }
        .difficulty-selector { margin-top: 20px; display: flex; gap: 15px; }
        .difficulty-btn {
            padding: 12px 25px;
            border: 2px solid #ffb6c1;
            background: white;
            border-radius: 20px;
            color: #ff69b4;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .difficulty-btn.active { background: #ff69b4; color: white; border-color: #ff69b4; }
        .result-cat { font-size: 150px; margin-bottom: 20px; }
        .result-title { font-size: 32px; color: #ff69b4; margin-bottom: 10px; }
        .result-score { font-size: 24px; color: #333; margin-bottom: 10px; }
        .result-comment { font-size: 18px; color: #666; margin-bottom: 30px; }
        .level-indicator { font-size: 14px; color: #888; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="start-screen" id="startScreen">
            <div class="cat" style="font-size: 150px;">🐱</div>
            <h1 class="title">和小猫一起学习！</h1>
            <p style="color: #666; margin-top: 10px;">选择难度开始游戏</p>
            <div class="difficulty-selector">
                <button class="difficulty-btn active" data-level="easy">简单</button>
                <button class="difficulty-btn" data-level="medium">中等</button>
                <button class="difficulty-btn" data-level="hard">困难</button>
            </div>
            <button class="start-btn" id="startBtn">开始学习 🎉</button>
        </div>

        <div class="game-screen" id="gameScreen">
            <div class="header">
                <h1 class="title">和小猫一起学习！</h1>
                <div class="level-indicator" id="levelIndicator">第 1 关</div>
            </div>
            <div class="score-board">
                <div class="score-item"><span class="score-label">得分</span><span class="score-value" id="score">0</span></div>
                <div class="score-item"><span class="score-label">连击</span><span class="score-value" id="streak">0</span></div>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="cat-container">
                <div class="cat" id="cat">🐱</div>
                <div class="cat-thought hidden" id="catThought">准备好了吗？</div>
            </div>
            <div class="question-box"><div class="question-text" id="question">?</div></div>
            <div class="options" id="options"></div>
            <div class="feedback hidden" id="feedback"></div>
        </div>

        <div class="result-screen hidden" id="resultScreen">
            <div class="result-cat" id="resultCat">🐱</div>
            <h2 class="result-title">学习完成！</h2>
            <div class="result-score">得分: <span id="finalScore">0</span></div>
            <div class="result-comment" id="resultComment">小猫觉得你很棒！</div>
            <button class="restart-btn" id="restartBtn">再玩一次 🐾</button>
        </div>
    </div>

    <script>
        const state = { score: 0, streak: 0, level: 1, totalLevels: 10, difficulty: 'easy', currentQuestion: null };
        const startScreen = document.getElementById('startScreen');
        const gameScreen = document.getElementById('gameScreen');
        const resultScreen = document.getElementById('resultScreen');
        const cat = document.getElementById('cat');
        const catThought = document.getElementById('catThought');
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const feedbackEl = document.getElementById('feedback');
        const scoreEl = document.getElementById('score');
        const streakEl = document.getElementById('streak');
        const progressFill = document.getElementById('progressFill');
        const levelIndicator = document.getElementById('levelIndicator');
        const finalScoreEl = document.getElementById('finalScore');
        const resultComment = document.getElementById('resultComment');
        const resultCat = document.getElementById('resultCat');

        const catEmojis = { normal: '🐱', happy: '😸', excited: '😻', sad: '😿' };
        const catMessages = {
            welcome: ['准备好了吗？', '我们开始学习吧！', '加油哦！'],
            correct: ['太棒了！🎉', '做得好！✨', '聪明！👏', '继续保持！'],
            wrong: ['再试一次吧~', '没关系的！', '别灰心！', '加油加油！'],
            streak: ['连击！好厉害！', '哇！连续答对！', '太牛了！🔥']
        };

        const getNumberRange = () => {
            switch(state.difficulty) {
                case 'easy': return { min: 1, max: 10 };
                case 'medium': return { min: 5, max: 20 };
                case 'hard': return { min: 10, max: 50 };
                default: return { min: 1, max: 10 };
            }
        };

        const generateQuestion = () => {
            const range = getNumberRange();
            const num1 = Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;
            const num2 = Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;
            let operator, answer;
            if (Math.random() > 0.5) {
                operator = '+';
                answer = num1 + num2;
            } else {
                operator = '-';
                if (num1 < num2) [num1, num2] = [num2, num1];
                answer = num1 - num2;
            }
            const options = new Set([answer]);
            while (options.size < 4) {
                const offset = Math.floor(Math.random() * 5) - 2;
                const wrongAnswer = answer + offset;
                if (wrongAnswer >= 0 && wrongAnswer !== answer) options.add(wrongAnswer);
            }
            return { question: `${num1} ${operator} ${num2} = ?`, answer, options: Array.from(options).sort(() => Math.random() - 0.5) };
        };

        const showCatThought = (msg) => {
            catThought.textContent = msg;
            catThought.classList.remove('hidden');
            setTimeout(() => catThought.classList.add('hidden'), 2000);
        };

        const updateCat = (emotion) => {
            cat.textContent = catEmojis[emotion];
            cat.classList.remove('happy', 'sad', 'celebrate');
            if (emotion === 'happy') cat.classList.add('happy');
            if (emotion === 'sad') cat.classList.add('sad');
            if (emotion === 'excited') cat.classList.add('celebrate');
        };

        const showFeedback = (isCorrect) => {
            feedbackEl.classList.remove('hidden', 'correct', 'wrong');
            feedbackEl.classList.add(isCorrect ? 'correct' : 'wrong');
            feedbackEl.textContent = isCorrect ? '回答正确！🎉' : '回答错误，再试一次！💪';
            setTimeout(() => feedbackEl.classList.add('hidden'), 1500);
        };

        const updateProgress = () => {
            progressFill.style.width = `${(state.level / state.totalLevels) * 100}%`;
            levelIndicator.textContent = `第 ${state.level} 关`;
        };

        const renderQuestion = () => {
            state.currentQuestion = generateQuestion();
            questionEl.textContent = state.currentQuestion.question;
            optionsEl.innerHTML = '';
            state.currentQuestion.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.addEventListener('click', () => checkAnswer(opt, btn));
                optionsEl.appendChild(btn);
            });
            if (state.level === 1) showCatThought(catMessages.welcome[Math.floor(Math.random() * catMessages.welcome.length)]);
        };

        const checkAnswer = (selected, btn) => {
            const isCorrect = selected === state.currentQuestion.answer;
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            if (isCorrect) {
                btn.classList.add('correct');
                state.score += 10 * (state.streak + 1);
                state.streak++;
                updateCat(state.streak >= 3 ? 'excited' : 'happy');
                showCatThought(state.streak >= 3 ? catMessages.streak[Math.floor(Math.random() * catMessages.streak.length)] : catMessages.correct[Math.floor(Math.random() * catMessages.correct.length)]);
                showFeedback(true);
            } else {
                btn.classList.add('wrong');
                allBtns.forEach(b => { if (b.textContent == state.currentQuestion.answer) b.classList.add('correct'); });
                state.streak = 0;
                updateCat('sad');
                showCatThought(catMessages.wrong[Math.floor(Math.random() * catMessages.wrong.length)]);
                showFeedback(false);
            }

            scoreEl.textContent = state.score;
            streakEl.textContent = state.streak;

            setTimeout(() => {
                if (state.level >= state.totalLevels) showResult();
                else { state.level++; updateProgress(); updateCat('normal'); renderQuestion(); }
            }, 1500);
        };

        const showResult = () => {
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            finalScoreEl.textContent = state.score;
            const percentage = (state.score / (state.totalLevels * 10)) * 100;
            if (percentage >= 90) { resultCat.textContent = '😻'; resultComment.textContent = '太棒了！小猫对你刮目相看！🌟'; }
            else if (percentage >= 70) { resultCat.textContent = '😸'; resultComment.textContent = '做得很好！继续加油！💪'; }
            else if (percentage >= 50) { resultCat.textContent = '🐱'; resultComment.textContent = '不错哦！多多练习会更好！✨'; }
            else { resultCat.textContent = '😿'; resultComment.textContent = '没关系，小猫相信你下次会更好！💕'; }
        };

        const startGame = () => {
            state.score = 0; state.streak = 0; state.level = 1;
            scoreEl.textContent = '0'; streakEl.textContent = '0';
            updateProgress(); updateCat('normal');
            startScreen.classList.add('hidden'); resultScreen.classList.add('hidden'); gameScreen.classList.remove('hidden');
            renderQuestion();
        };

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.difficulty = btn.dataset.level;
            });
        });

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        updateCat('normal');
    </script>
</body>
</html>
