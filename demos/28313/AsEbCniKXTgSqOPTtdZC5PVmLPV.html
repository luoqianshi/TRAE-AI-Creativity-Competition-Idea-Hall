<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBox - 前端离线工具箱</title>
    <style>
        :root {
            --bg: #f7f8fa;
            --card: #ffffff;
            --text: #333333;
            --border: #e5e6eb;
            --primary: #409eff;
            --btn-hover: #338eef;
        }
        [data-theme="dark"] {
            --bg: #1e1e2e;
            --card: #2b2d42;
            --text: #edf2f4;
            --border: #4a4c63;
            --primary: #4fc3f7;
            --btn-hover: #29b6f6;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            transition: all 0.3s ease;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }
        .theme-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .theme-btn:hover {
            background: var(--btn-hover);
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 20px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .tool-card {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: none;
        }
        .tool-card.show {
            display: block;
        }
        .tool-title {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .tool-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            resize: vertical;
            font-size: 14px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .tool-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .tool-btn:hover {
            background: var(--btn-hover);
        }
        .desc {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text);
            opacity: 0.8;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">CodeBox 前端离线工具箱</div>
            <button class="theme-btn" id="themeToggle">切换主题</button>
        </div>

        <div class="tabs">
            <div class="tab active" data-target="json">JSON格式化</div>
            <div class="tab" data-target="base64">Base64编解码</div>
            <div class="tab" data-target="time">时间戳转换</div>
        </div>

        <!-- JSON格式化 -->
        <div class="tool-card show" id="json">
            <div class="tool-title">JSON 格式化/压缩</div>
            <div class="tool-box">
                <textarea id="jsonInput" placeholder="请输入JSON字符串..."></textarea>
                <div class="btn-group">
                    <button class="tool-btn" onclick="formatJson()">格式化</button>
                    <button class="tool-btn" onclick="compressJson()">压缩</button>
                    <button class="tool-btn" onclick="copyResult('jsonOutput')">复制结果</button>
                </div>
                <textarea id="jsonOutput" placeholder="处理结果..." readonly></textarea>
            </div>
        </div>

        <!-- Base64编解码 -->
        <div class="tool-card" id="base64">
            <div class="tool-title">Base64 编码/解码</div>
            <div class="tool-box">
                <textarea id="base64Input" placeholder="请输入文本..."></textarea>
                <div class="btn-group">
                    <button class="tool-btn" onclick="encodeBase64()">编码</button>
                    <button class="tool-btn" onclick="decodeBase64()">解码</button>
                    <button class="tool-btn" onclick="copyResult('base64Output')">复制结果</button>
                </div>
                <textarea id="base64Output" placeholder="处理结果..." readonly></textarea>
            </div>
        </div>

        <!-- 时间戳转换 -->
        <div class="tool-card" id="time">
            <div class="tool-title">时间戳 ↔ 日期时间</div>
            <div class="tool-box">
                <textarea id="timeInput" placeholder="请输入时间戳/日期时间..."></textarea>
                <div class="btn-group">
                    <button class="tool-btn" onclick="timeToDate()">时间戳转日期</button>
                    <button class="tool-btn" onclick="dateToTime()">日期转时间戳</button>
                    <button class="tool-btn" onclick="copyResult('timeOutput')">复制结果</button>
                </div>
                <textarea id="timeOutput" placeholder="处理结果..." readonly></textarea>
            </div>
        </div>

        <div class="desc">
            ✅ 所有运算在浏览器本地完成 | ✅ 数据永不上传服务器 | ✅ 无广告 | ✅ 断网可用
        </div>
    </div>

    <script>
        // 主题切换
        const themeBtn = document.getElementById('themeToggle');
        themeBtn.addEventListener('click', () => {
            document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
        });

        // 标签页切换
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const target = tab.dataset.target;
                document.querySelectorAll('.tool-card').forEach(card => card.classList.remove('show'));
                document.getElementById(target).classList.add('show');
            });
        });

        // JSON格式化
        function formatJson() {
            const input = document.getElementById('jsonInput').value;
            try {
                const obj = JSON.parse(input);
                document.getElementById('jsonOutput').value = JSON.stringify(obj, null, 2);
            } catch (e) {
                document.getElementById('jsonOutput').value = 'JSON格式错误！';
            }
        }

        // JSON压缩
        function compressJson() {
            const input = document.getElementById('jsonInput').value;
            try {
                const obj = JSON.parse(input);
                document.getElementById('jsonOutput').value = JSON.stringify(obj);
            } catch (e) {
                document.getElementById('jsonOutput').value = 'JSON格式错误！';
            }
        }

        // Base64编码
        function encodeBase64() {
            const input = document.getElementById('base64Input').value;
            document.getElementById('base64Output').value = btoa(unescape(encodeURIComponent(input)));
        }

        // Base64解码
        function decodeBase64() {
            const input = document.getElementById('base64Input').value;
            try {
                document.getElementById('base64Output').value = decodeURIComponent(escape(atob(input)));
            } catch (e) {
                document.getElementById('base64Output').value = 'Base64格式错误！';
            }
        }

        // 时间戳转日期
        function timeToDate() {
            const input = document.getElementById('timeInput').value;
            const date = new Date(Number(input));
            document.getElementById('timeOutput').value = date.toLocaleString();
        }

        // 日期转时间戳
        function dateToTime() {
            const input = document.getElementById('timeInput').value;
            const time = new Date(input).getTime();
            document.getElementById('timeOutput').value = time || '日期格式错误！';
        }

        // 复制结果
        function copyResult(id) {
            const text = document.getElementById(id).value;
            navigator.clipboard.writeText(text).then(() => {
                alert('复制成功！');
            });
        }
    </script>
</body>
</html>
