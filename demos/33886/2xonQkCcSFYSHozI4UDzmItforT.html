body{

#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:100px}
/* Nav */

}
#nav-inner{

  background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);
  border-radius:16px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,0.6);
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;
  border-radius:12px;border:none;background:none;cursor:pointer;
  font-size:11px;font-weight:500;color:rgba(44,24,16,0.5);transition:all 0.2s;

}
.nav-btn.active{background:rgba(139,94,60,0.1);color:var(--warm-brown);transform:scale(1.05)}
.nav-btn .icon{font-size:22px;line-height:1}

.card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:4px;border:none;border-radius:999px;
  font-size:12px;font-weight:500;cursor:pointer;transition:all 0.2s;font-family:inherit;
}
.btn:active{transform:scale(0.95)}
.btn-primary{background:var(--warm-brown);color:#fff;padding:6px 14px}
.btn-tag{
  background:#fff;color:rgba(44,24,16,0.6);border:1px solid rgba(44,24,16,0.08);
  padding:6px 14px;font-size:13px;
}
.btn-tag.active{background:var(--warm-brown);color:#fff;border-color:var(--warm-brown)}
/* Page header */
.page{padding:32px 20px 16px}
.page-title{font-size:28px;font-weight:700;margin-bottom:4px}
.page-title .gradient{

}
.page-sub{font-size:13px;color:rgba(44,24,16,0.4);margin-bottom:24px}
/* Search */
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap input{

.search-wrap input:focus{border-color:rgba(139,94,60,0.3);box-shadow:0 0 0 3px rgba(139,94,60,0.06)}
.search-wrap .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;opacity:0.3}

.filter-row{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto}
/* Book card */
.book-card{
  display:flex;gap:16px;background:#fff;border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);cursor:pointer;transition:transform 0.2s;margin-bottom:12px;
}
.book-card:active{transform:scale(0.98)}
.book-cover{
  width:72px;height:100px;border-radius:10px;overflow:hidden;flex-shrink:0;
  background:rgba(232,213,176,0.3);
}
.book-cover img{width:100%;height:100%;object-fit:cover}
.book-cover .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px}
.book-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:4px 0}
.book-title{font-size:15px;font-weight:600;color:var(--deep-brown);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-author{font-size:13px;color:rgba(44,24,16,0.5);margin-top:2px}
.book-meta{display:flex;align-items:center;gap:8px;margin-top:6px}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500}
.badge-reading{background:rgba(107,142,123,0.1);color:var(--sage)}
.badge-finished{background:rgba(139,94,60,0.1);color:var(--warm-brown)}
.badge-wishlist{background:rgba(44,24,16,0.05);color:rgba(44,24,16,0.5)}
.stars{font-size:12px;color:var(--gold)}
.progress-mini{width:100%;height:4px;background:var(--cream);border-radius:2px;margin-top:8px;overflow:hidden}
.progress-mini-fill{height:100%;background:var(--sage);border-radius:2px;transition:width 0.5s}

.modal-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(44,24,16,0.4);

}
@media(min-width:481px){.modal-overlay{align-items:center}}
.modal{
  width:100%;max-width:480px;max-height:85vh;overflow-y:auto;
  background:#fff;border-radius:24px 24px 0 0;padding:24px 20px;position:relative;
}
@media(min-width:481px){.modal{border-radius:24px}}
.modal-close{
  position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:var(--cream);
  border:none;cursor:pointer;color:rgba(44,24,16,0.4);font-size:16px;
}
.modal-header{display:flex;gap:20px;margin-top:8px}
.modal-cover{
  width:90px;height:128px;border-radius:12px;overflow:hidden;flex-shrink:0;

}
.modal-cover img{width:100%;height:100%;object-fit:cover}
.modal-cover .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px}
.modal-meta{flex:1;min-width:0}
.modal-title{font-size:20px;font-weight:700;color:var(--deep-brown);line-height:1.3}
.modal-author{font-size:14px;color:rgba(44,24,16,0.5);margin-top:4px}
.modal-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.modal-tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--cream);color:rgba(44,24,16,0.6)}
.modal-note{margin-top:20px;padding:16px;background:var(--cream);border-radius:12px;border-left:3px solid var(--gold)}
.modal-note p{font-size:13px;color:rgba(44,24,16,0.7);line-height:1.6;font-style:italic}

}
.spectrum-bar{display:flex;height:24px;border-radius:12px;overflow:hidden;margin-bottom:12px}
.spectrum-fic{

}
.spectrum-non{
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:500;
  background:var(--sage);
}
.genre-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.genre-label{font-size:12px;color:var(--deep-brown);width:68px;flex-shrink:0}

.label-card{background:var(--cream);border-radius:12px;padding:16px;margin-bottom:12px}
.label-card h4{font-size:14px;color:var(--warm-brown);font-weight:700;margin-bottom:4px}
.label-card p{font-size:12px;color:rgba(44,24,16,0.55);line-height:1.5}
.style-box{flex:1;border-radius:12px;padding:12px}

.style-box.bad{background:rgba(232,212,208,0.3)}

.report-footer .tagline{font-size:12px;color:rgba(44,24,16,0.3);margin-top:4px}

/* Toast */
.toast{
  position:fixed;bottom:120px;left:50%;transform:translateX(-50%);z-index:300;
  background:var(--deep-brown);color:#fff;padding:10px 20px;border-radius:999px;
  font-size:13px;animation:toast-in 0.3s ease;
}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes slide-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.anim-up{animation:slide-up 0.4s ease-out forwards}
.hidden{display:none!important}
/* Scrollbar */
::-webkit-scrollbar{width:0;height:0}

// ── HELPERS ──
const $ = (sel, parent) => (parent||document).querySelector(sel);
const $$ = (sel, parent) => [...(parent||document).querySelectorAll(sel)];
const el = (tag, attrs, ...children) => {
  const e = document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v]) => {
    if(k === 'className') e.className = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k === 'style') Object.assign(e.style, v);
    else if(k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  });
  children.forEach(c => { if(c!=null) e.append(typeof c==='string'?document.createTextNode(c):c); });
  return e;
};
const stars = n => '⭐'.repeat(n);
const badgeClass = s => ({reading:'badge badge-reading',finished:'badge badge-finished',wishlist:'badge badge-wishlist'}[s]||'badge');
const statusText = s => ({reading:'在读',finished:'已读',wishlist:'想读'}[s]||s);
const coldClass = c => ({'冷门佳作':'cold-good','冷门经典':'cold-good','必读经典':'cold-classic','经典必读':'cold-classic','热门好书':'cold-hot'}[c]||'cold-classic');

// ── TOAST ──
function toast(msg){
  const t = el('div',{className:'toast'},msg);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// ── MODAL ──
function showBookDetail(book){
  const overlay = el('div',{className:'modal-overlay',onClick(e){if(e.target===overlay)overlay.remove()}});
  const modal = el('div',{className:'modal'});
  const close = el('button',{className:'modal-close',onClick(){overlay.remove()}},'✕');
  const header = el('div',{className:'modal-header'});
  const coverDiv = el('div',{className:'modal-cover'});
  if(book.cover){
    const img = el('img',{src:book.cover,alt:book.title,onError(){img.style.display='none';fallback.style.display='flex'}});
    const fallback = el('div',{className:'fallback',style:{display:'none'}},'📖');
    coverDiv.append(img, fallback);
  } else { coverDiv.appendChild(el('div',{className:'fallback'},'📖')); }
  const meta = el('div',{className:'modal-meta'});
  meta.appendChild(el('h2',{className:'modal-title'},book.title));
  meta.appendChild(el('p',{className:'modal-author'},book.author));
  meta.appendChild(el('p',{style:{fontSize:'13px',color:'rgba(44,24,16,0.4)',marginTop:'4px'}},`${book.pages} 页`));
  const tags = el('div',{className:'modal-tags'});
  book.tags.forEach(t => tags.appendChild(el('span',{className:'modal-tag'},t)));
  meta.appendChild(tags);
  const statusBadge = el('span',{className:badgeClass(book.status),style:{marginTop:'8px',display:'inline-block'}},statusText(book.status));
  meta.appendChild(statusBadge);
  if(book.rating>0) meta.appendChild(el('span',{style:{marginLeft:'8px',fontSize:'14px',color:'var(--gold)'}},stars(book.rating)));
  if(book.finishedAt) meta.appendChild(el('p',{style:{fontSize:'12px',color:'rgba(44,24,16,0.4)',marginTop:'4px'}},`读完于 ${book.finishedAt}`));
  header.append(coverDiv, meta);
  modal.append(close, header);
  if(book.note){
    const noteDiv = el('div',{className:'modal-note'});
    noteDiv.appendChild(el('p',{},`"${book.note}"`));
    modal.appendChild(noteDiv);
  }
  if(book.status==='reading'){
    const progDiv = el('div',{style:{marginTop:'20px'}});
    const label = el('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'12px',color:'rgba(44,24,16,0.5)',marginBottom:'6px'}},
      el('span',{},'阅读进度'),
      el('span',{style:{fontWeight:'600',color:'var(--warm-brown)'}},`${book.progress}%`)
    );
    const bar = el('div',{style:{width:'100%',height:'8px',background:'var(--cream)',borderRadius:'4px',overflow:'hidden'}});
    bar.appendChild(el('div',{style:{height:'100%',background:'var(--sage)',borderRadius:'4px',width:`${book.progress}%`,transition:'width 0.7s'}}));
    progDiv.append(label, bar);
    modal.appendChild(progDiv);
  }
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

function renderHome(){
  const page = el('div',{className:'page'});
  const title = el('h1',{className:'page-title'},el('span',{className:'gradient'},'📖 阅迹'));
  const sub = el('p',{className:'page-sub'},'你的阅读成长伴侣');
  page.append(title, sub);

  // Search
  const searchWrap = el('div',{className:'search-wrap'});
  const searchIcon = el('span',{className:'search-icon'},'🔍');
  const input = el('input',{type:'text',placeholder:'搜索书名或作者...'});
  searchWrap.append(searchIcon, input);
  page.appendChild(searchWrap);

  // Filters
  const counts = {all:M.books.length,reading:M.books.filter(b=>b.status==='reading').length,finished:M.books.filter(b=>b.status==='finished').length,wishlist:M.books.filter(b=>b.status==='wishlist').length};
  const filters = [{key:'all',label:'全部',count:counts.all},{key:'reading',label:'在读',count:counts.reading},{key:'finished',label:'已读',count:counts.finished},{key:'wishlist',label:'想读',count:counts.wishlist}];
  let currentFilter = 'all';
  const filterRow = el('div',{className:'filter-row'});
  const bookList = el('div',{});

  function renderList(){
    bookList.innerHTML = '';
    const term = input.value.trim();
    const filtered = M.books.filter(b => {
      if(currentFilter!=='all' && b.status!==currentFilter) return false;
      if(term && !b.title.includes(term) && !b.author.includes(term)) return false;
      return true;
    });
    if(filtered.length===0){
      bookList.appendChild(el('div',{style:{textAlign:'center',padding:'64px 0'}},
        el('div',{style:{fontSize:'48px',marginBottom:'12px'}},'📚'),
        el('p',{style:{fontSize:'14px',color:'rgba(44,24,16,0.4)'}},term?'没有找到匹配的书':'这里还是空的')
      ));
    } else {
      filtered.forEach((book,i) => {
        const card = el('div',{className:'book-card',style:{animationDelay:`${i*60}ms`,animation:'slide-up 0.4s ease-out forwards',opacity:0},onClick(){showBookDetail(book)}});
        const coverDiv = el('div',{className:'book-cover'});
        if(book.cover){
          const img = el('img',{src:book.cover,alt:book.title,onError(){img.style.display='none';fallback.style.display='flex'}});
          const fallback = el('div',{className:'fallback',style:{display:'none'}},'📖');
          coverDiv.append(img, fallback);
        } else { coverDiv.appendChild(el('div',{className:'fallback'},'📖')); }
        const info = el('div',{className:'book-info'});
        info.appendChild(el('div',{className:'book-title'},book.title));
        info.appendChild(el('div',{className:'book-author'},book.author));
        const meta = el('div',{className:'book-meta'});
        meta.appendChild(el('span',{className:badgeClass(book.status)},statusText(book.status)));
        if(book.rating>0) meta.appendChild(el('span',{className:'stars'},stars(book.rating)));
        info.appendChild(meta);
        if(book.status==='reading'){
          const progWrap = el('div',{className:'progress-mini'});
          progWrap.appendChild(el('div',{className:'progress-mini-fill',style:{width:`${book.progress}%`}}));
          info.appendChild(progWrap);
        }
        card.append(coverDiv, info);
        bookList.appendChild(card);
      });
    }
  }

  filters.forEach(f => {
    const btn = el('button',{className:'btn btn-tag'+(f.key==='all'?' active':''),onClick(){
      currentFilter = f.key;
      $$('.btn-tag',filterRow).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderList();
    }},`${f.label} · ${f.count}`);
    filterRow.appendChild(btn);
  });

  input.addEventListener('input', renderList);
  page.append(filterRow, bookList);
  renderList();
  return page;
}

    if(book.cover){
      const img = el('img',{src:book.cover,alt:book.title,onError(){img.style.display='none';fallback.style.display='flex'}});
      const fallback = el('div',{className:'fallback',style:{display:'none'}},'📖');
      coverDiv.append(img, fallback);
    } else { coverDiv.appendChild(el('div',{className:'fallback'},'📖')); }
    coverWrap.append(coverDiv, el('div',{className:'rec-score'},`${book.matchScore}%`));
    // Body
    const body = el('div',{className:'rec-body'});
    const hd = el('div',{className:'rec-header'});
    hd.appendChild(el('div',{},el('h3',{className:'rec-title'},book.title),el('p',{className:'rec-author'},book.author)));
    hd.appendChild(el('span',{className:`rec-cold ${coldClass(book.coldness)}`},book.coldness));
    body.append(hd, el('p',{style:{fontSize:'12px',color:'rgba(44,24,16,0.4)',marginTop:'2px'}},book.genre));
    const reason = el('div',{className:'rec-reason'});
    reason.append(el('p',{className:'ai-hint'},'🤖 AI 推荐理由'),el('p',{},book.reason));
    body.appendChild(reason);
    flex.append(coverWrap, body);
    card.appendChild(flex);
    page.appendChild(card);
  });

  // AI Note
  const note = el('div',{className:'ai-note',style:{marginTop:'20px'}});
  note.append(el('h4',{},'🤖 AI 荐书笔记'));
  note.appendChild(el('p',{},'这些推荐不是基于"大家都在读"，而是基于你的阅读人格基因——你喜欢冷峻克制的叙事、着迷于人类命运的宏大命题、善于在书中找到闪闪发光的句子。下次你读完其中任何一本，我都会重新校准你的阅读 DNA，让推荐越来越准。'));
  page.appendChild(note);
  return page;
}

// ── NAV ──
const navItems = [
  {key:'home',icon:'📚',label:'书架',render:renderHome},
  {key:'personality',icon:'🧬',label:'阅读人格',render:renderPersonality},
  {key:'report',icon:'📊',label:'年度报告',render:renderReport},
  {key:'recommend',icon:'🎯',label:'AI荐书',render:renderRecommend}
];

function renderNav(activeKey){
  const nav = el('div',{id:'nav'});
  const inner = el('div',{id:'nav-inner'});
  navItems.forEach(item => {
    const btn = el('button',{className:'nav-btn'+(item.key===activeKey?' active':''),onClick(){
      if(item.key === activeKey) return;
      navigateTo(item.key);
    }},
      el('span',{className:'icon'},item.icon),
      el('span',{},item.label)
    );
    inner.appendChild(btn);
  });
  nav.appendChild(inner);
  return nav;
}

// ── ROUTER ──
let currentPage = 'home';
function navigateTo(key){
  currentPage = key;
  const app = $('#app');
  app.innerHTML = '';
  const item = navItems.find(n => n.key === key);
  if(item){
    app.appendChild(item.render());
    app.appendChild(renderNav(key));
  }
  window.scrollTo(0,0);
}

// ── INIT ──
navigateTo('home');
</script>
