<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭教学学习记录管理工具</title>
  <style>
    /* ========== 基础重置与全局样式 ========== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green-50: #f0fdf4;
      --green-100: #dcfce7;
      --green-200: #bbf7d0;
      --green-300: #86efac;
      --green-400: #4ade80;
      --green-500: #22c55e;
      --green-600: #16a34a;
      --green-700: #15803d;
      --white: #ffffff;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --red-400: #f87171;
      --red-500: #ef4444;
      --yellow-400: #facc15;
      --yellow-50: #fefce8;
      --blue-500: #3b82f6;
      --blue-50: #eff6ff;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      --radius: 12px;
      --radius-sm: 8px;
      --transition: all 0.2s ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #f0fdfa 100%);
      color: var(--gray-700);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ========== 页面容器 ========== */
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* ========== 页头 ========== */
    .app-header {
      text-align: center;
      padding: 30px 20px 20px;
      margin-bottom: 24px;
    }

    .app-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--green-700);
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .app-header p {
      font-size: 14px;
      color: var(--gray-500);
    }

    /* ========== 统计卡片区 ========== */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 16px;
      transition: var(--transition);
      border: 1px solid var(--green-100);
    }

    .stat-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .stat-icon.green { background: var(--green-100); color: var(--green-600); }
    .stat-icon.yellow { background: var(--yellow-50); color: #ca8a04; }
    .stat-icon.blue { background: var(--blue-50); color: var(--blue-500); }

    .stat-info h3 {
      font-size: 24px;
      font-weight: 700;
      color: var(--gray-800);
      line-height: 1.2;
    }

    .stat-info p {
      font-size: 13px;
      color: var(--gray-500);
      margin-top: 2px;
    }

    /* ========== 导航标签 ========== */
    .tab-nav {
      display: flex;
      gap: 4px;
      background: var(--white);
      border-radius: var(--radius);
      padding: 6px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      border: 1px solid var(--green-100);
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      min-width: 140px;
      padding: 12px 16px;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 500;
      color: var(--gray-500);
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .tab-btn:hover {
      background: var(--green-50);
      color: var(--green-700);
    }

    .tab-btn.active {
      background: var(--green-500);
      color: var(--white);
      box-shadow: var(--shadow-sm);
    }

    /* ========== 内容面板 ========== */
    .tab-panel {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .tab-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========== 卡片容器 ========== */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      border: 1px solid var(--green-100);
    }

    .card-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--green-700);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--green-100);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title .icon {
      font-size: 20px;
    }

    /* ========== 表单样式 ========== */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--gray-600);
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--green-200);
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--gray-700);
      background: var(--white);
      transition: var(--transition);
      font-family: inherit;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--green-400);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* ========== 按钮样式 ========== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      line-height: 1.4;
    }

    .btn-primary {
      background: var(--green-500);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--green-600);
      box-shadow: var(--shadow-md);
    }

    .btn-secondary {
      background: var(--green-100);
      color: var(--green-700);
    }

    .btn-secondary:hover {
      background: var(--green-200);
    }

    .btn-danger {
      background: transparent;
      color: var(--red-500);
      padding: 6px 12px;
    }

    .btn-danger:hover {
      background: #fef2f2;
    }

    .btn-sm {
      padding: 6px 14px;
      font-size: 13px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    /* ========== 记录列表 ========== */
    .record-list {
      list-style: none;
    }

    .record-item {
      padding: 16px;
      border: 1.5px solid var(--green-100);
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
      background: var(--green-50);
      transition: var(--transition);
    }

    .record-item:hover {
      border-color: var(--green-300);
      box-shadow: var(--shadow-sm);
    }

    .record-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .record-subject {
      font-size: 15px;
      font-weight: 600;
      color: var(--green-700);
      background: var(--green-100);
      padding: 2px 10px;
      border-radius: 20px;
    }

    .record-date {
      font-size: 12px;
      color: var(--gray-400);
    }

    .record-content {
      font-size: 14px;
      color: var(--gray-600);
      margin-bottom: 6px;
    }

    .record-notes {
      font-size: 13px;
      color: var(--gray-500);
      background: var(--white);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--green-300);
      margin-top: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .record-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    /* ========== 目标列表 ========== */
    .goal-item {
      padding: 16px;
      border: 1.5px solid var(--green-100);
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
      background: var(--white);
      transition: var(--transition);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .goal-item:hover {
      border-color: var(--green-300);
      box-shadow: var(--shadow-sm);
    }

    .goal-item.completed {
      background: var(--green-50);
      opacity: 0.75;
    }

    .goal-item.completed .goal-text {
      text-decoration: line-through;
      color: var(--gray-400);
    }

    .goal-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid var(--green-300);
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      margin-top: 2px;
    }

    .goal-checkbox:hover {
      border-color: var(--green-500);
      background: var(--green-50);
    }

    .goal-checkbox.checked {
      background: var(--green-500);
      border-color: var(--green-500);
      color: var(--white);
      font-size: 13px;
    }

    .goal-body {
      flex: 1;
      min-width: 0;
    }

    .goal-text {
      font-size: 15px;
      color: var(--gray-700);
      margin-bottom: 4px;
    }

    .goal-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .goal-type {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }

    .goal-type.daily { background: var(--green-100); color: var(--green-700); }
    .goal-type.weekly { background: var(--blue-50); color: var(--blue-500); }
    .goal-type.longterm { background: var(--yellow-50); color: #ca8a04; }

    .goal-date {
      font-size: 12px;
      color: var(--gray-400);
    }

    /* ========== 成果/存档列表 ========== */
    .archive-section {
      margin-bottom: 24px;
    }

    .archive-section h3 {
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-600);
      margin-bottom: 12px;
      padding-left: 10px;
      border-left: 3px solid var(--green-400);
    }

    .archive-item {
      padding: 12px 16px;
      background: var(--gray-50);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .archive-item .label {
      font-size: 14px;
      color: var(--gray-700);
      font-weight: 500;
    }

    .archive-item .date {
      font-size: 12px;
      color: var(--gray-400);
    }

    .archive-item .type-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--green-100);
      color: var(--green-600);
    }

    /* ========== 空状态提示 ========== */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--gray-400);
    }

    .empty-state .empty-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 14px;
    }

    /* ========== 进度条 ========== */
    .progress-bar-container {
      margin: 16px 0;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--gray-500);
      margin-bottom: 6px;
    }

    .progress-bar {
      height: 10px;
      background: var(--green-100);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green-400), var(--green-500));
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    /* ========== 编辑模态框 ========== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: var(--white);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 500px;
      box-shadow: var(--shadow-lg);
      animation: modalIn 0.25s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal h3 {
      font-size: 17px;
      color: var(--green-700);
      margin-bottom: 20px;
    }

    /* ========== 消息提示 ========== */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      background: var(--green-600);
      color: var(--white);
      border-radius: var(--radius-sm);
      font-size: 14px;
      box-shadow: var(--shadow-lg);
      z-index: 2000;
      animation: toastIn 0.3s ease, toastOut 0.3s ease 2s forwards;
    }

    .toast.error {
      background: var(--red-500);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes toastOut {
      from { opacity: 1; }
      to { opacity: 0; transform: translateY(-10px); }
    }

    /* ========== 响应式适配 ========== */
    @media (max-width: 768px) {
      .app-header h1 { font-size: 22px; }
      .app-container { padding: 12px; }
      .form-row { grid-template-columns: 1fr; }
      .stats-bar { grid-template-columns: 1fr 1fr; }
      .card { padding: 18px; }
      .tab-btn { min-width: 110px; font-size: 14px; padding: 10px 12px; }
      .record-header { flex-direction: column; }
    }

    @media (max-width: 480px) {
      .stats-bar { grid-template-columns: 1fr; }
      .app-header h1 { font-size: 20px; }
      .btn-group { flex-direction: column; }
      .btn-group .btn { width: 100%; }
    }

    /* ========== 页脚 ========== */
    .app-footer {
      text-align: center;
      padding: 24px 20px;
      font-size: 13px;
      color: var(--gray-400);
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 页头 -->
  <header class="app-header">
    <h1>📚 家庭教学学习记录管理工具</h1>
    <p>记录每一点进步，见证成长的每一步</p>
  </header>

  <!-- 统计卡片 -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-icon green">📝</div>
      <div class="stat-info">
        <h3 id="statTotalRecords">0</h3>
        <p>累计学习记录</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon blue">✅</div>
      <div class="stat-info">
        <h3 id="statWeekCompleted">0</h3>
        <p>本周已完成目标</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon yellow">🎯</div>
      <div class="stat-info">
        <h3 id="statWeekPending">0</h3>
        <p>本周未完成目标</p>
      </div>
    </div>
  </div>

  <!-- 标签导航 -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="records">📝 学习记录</button>
    <button class="tab-btn" data-tab="goals">🎯 学习目标</button>
    <button class="tab-btn" data-tab="stats">📊 学习成果</button>
  </nav>

  <!-- 面板一：每日学习记录 -->
  <section id="panel-records" class="tab-panel active">
    <div class="card">
      <div class="card-title"><span class="icon">✏️</span> 新增学习记录</div>
      <div class="form-row">
        <div class="form-group">
          <label for="recordSubject">学习科目</label>
          <input type="text" id="recordSubject" placeholder="例如：数学、英语、语文...">
        </div>
        <div class="form-group">
          <label for="recordDate">学习日期</label>
          <input type="date" id="recordDate">
        </div>
      </div>
      <div class="form-group">
        <label for="recordContent">学习内容</label>
        <input type="text" id="recordContent" placeholder="今天学了什么？">
      </div>
      <div class="form-group">
        <label for="recordNotes">学习笔记</label>
        <textarea id="recordNotes" placeholder="记录重点、心得、错题分析等..."></textarea>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="addRecord()">➕ 保存记录</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">📋</span> 历史学习记录</div>
      <ul id="recordList" class="record-list"></ul>
    </div>
  </section>

  <!-- 面板二：学习目标管理 -->
  <section id="panel-goals" class="tab-panel">
    <div class="card">
      <div class="card-title"><span class="icon">🎯</span> 新增学习目标</div>
      <div class="form-row">
        <div class="form-group">
          <label for="goalText">目标内容</label>
          <input type="text" id="goalText" placeholder="描述学习目标...">
        </div>
        <div class="form-group">
          <label for="goalType">目标类型</label>
          <select id="goalType">
            <option value="daily">每日目标</option>
            <option value="weekly">每周目标</option>
            <option value="longterm">长期目标</option>
          </select>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="addGoal()">➕ 添加目标</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">📌</span> 进行中的目标</div>
      <div id="pendingGoals"></div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">🏆</span> 已完成的目标</div>
      <div id="completedGoals"></div>
    </div>
  </section>

  <!-- 面板三：学习成果统计 -->
  <section id="panel-stats" class="tab-panel">
    <!-- 完成进度 -->
    <div class="card">
      <div class="card-title"><span class="icon">📈</span> 目标完成进度</div>
      <div class="progress-bar-container">
        <div class="progress-label">
          <span>总体完成率</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
      </div>
      <div class="progress-bar-container">
        <div class="progress-label">
          <span>本周完成率</span>
          <span id="weekProgressPercent">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="weekProgressFill" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- 已完成目标存档 -->
    <div class="card">
      <div class="card-title"><span class="icon">🏆</span> 已完成目标存档</div>
      <div id="archiveGoals"></div>
    </div>

    <!-- 学习记录存档 -->
    <div class="card">
      <div class="card-title"><span class="icon">📚</span> 学习记录存档</div>
      <div id="archiveRecords"></div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="app-footer">
    家庭教学学习记录管理工具 · 数据保存在本地浏览器中
  </footer>
</div>

<!-- 编辑记录模态框 -->
<div class="modal-overlay" id="editRecordModal">
  <div class="modal">
    <h3>✏️ 编辑学习记录</h3>
    <input type="hidden" id="editRecordId">
    <div class="form-row">
      <div class="form-group">
        <label>学习科目</label>
        <input type="text" id="editRecordSubject">
      </div>
      <div class="form-group">
        <label>学习日期</label>
        <input type="date" id="editRecordDate">
      </div>
    </div>
    <div class="form-group">
      <label>学习内容</label>
      <input type="text" id="editRecordContent">
    </div>
    <div class="form-group">
      <label>学习笔记</label>
      <textarea id="editRecordNotes"></textarea>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="saveEditRecord()">💾 保存修改</button>
      <button class="btn btn-secondary" onclick="closeModal('editRecordModal')">取消</button>
    </div>
  </div>
</div>

<!-- 编辑目标模态框 -->
<div class="modal-overlay" id="editGoalModal">
  <div class="modal">
    <h3>✏️ 编辑学习目标</h3>
    <input type="hidden" id="editGoalId">
    <div class="form-group">
      <label>目标内容</label>
      <input type="text" id="editGoalText">
    </div>
    <div class="form-group">
      <label>目标类型</label>
      <select id="editGoalType">
        <option value="daily">每日目标</option>
        <option value="weekly">每周目标</option>
        <option value="longterm">长期目标</option>
      </select>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="saveEditGoal()">💾 保存修改</button>
      <button class="btn btn-secondary" onclick="closeModal('editGoalModal')">取消</button>
    </div>
  </div>
</div>

<script>
  /* ========================================================
   *  数据层 —— 所有数据存入 localStorage
   * ======================================================== */

  var STORAGE_RECORDS = 'family_learning_records';
  var STORAGE_GOALS   = 'family_learning_goals';

  /** 从 localStorage 读取数据，无数据则返回空数组 */
  function loadData(key) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  /** 将数据写入 localStorage */
  function saveData(key, data) {
    localStorage.setItem(key, JSON.stringify(data));
  }

  /** 生成唯一 ID */
  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /** 获取今天的日期字符串 YYYY-MM-DD */
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  /** 获取本周一的日期字符串 */
  function getMonday(d) {
    var date = new Date(d);
    var day = date.getDay();
    var diff = date.getDate() - day + (day === 0 ? -6 : 1);
    date.setDate(diff);
    date.setHours(0, 0, 0, 0);
    return date;
  }

  /** 判断日期字符串是否在本周内 */
  function isThisWeek(dateStr) {
    if (!dateStr) return false;
    var monday = getMonday(new Date());
    var target = new Date(dateStr + 'T00:00:00');
    return target >= monday;
  }

  /** 格式化日期展示 */
  function formatDate(dateStr) {
    if (!dateStr) return '';
    var parts = dateStr.split('-');
    return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
  }

  var records = loadData(STORAGE_RECORDS);
  var goals   = loadData(STORAGE_GOALS);

  /* ========================================================
   *  消息提示
   * ======================================================== */
  function showToast(msg, isError) {
    var existing = document.querySelector('.toast');
    if (existing) existing.remove();
    var el = document.createElement('div');
    el.className = 'toast' + (isError ? ' error' : '');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.remove(); }, 2500);
  }

  /* ========================================================
   *  标签切换
   * ======================================================== */
  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  /* ========================================================
   *  模态框
   * ======================================================== */
  function openModal(id) {
    document.getElementById(id).classList.add('show');
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('show');
  }

  /* 点击遮罩关闭 */
  document.querySelectorAll('.modal-overlay').forEach(function (overlay) {
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) overlay.classList.remove('show');
    });
  });

  /* ========================================================
   *  学习记录 CRUD
   * ======================================================== */

  /** 新增记录 */
  function addRecord() {
    var subject = document.getElementById('recordSubject').value.trim();
    var content = document.getElementById('recordContent').value.trim();
    var notes   = document.getElementById('recordNotes').value.trim();
    var date    = document.getElementById('recordDate').value || todayStr();

    if (!subject) { showToast('请填写学习科目', true); return; }
    if (!content) { showToast('请填写学习内容', true); return; }

    records.unshift({
      id: genId(),
      subject: subject,
      content: content,
      notes: notes,
      date: date,
      createdAt: new Date().toISOString()
    });

    saveData(STORAGE_RECORDS, records);
    document.getElementById('recordSubject').value = '';
    document.getElementById('recordContent').value = '';
    document.getElementById('recordNotes').value = '';
    document.getElementById('recordDate').value = todayStr();
    renderRecords();
    updateStats();
    showToast('学习记录已保存 ✓');
  }

  /** 删除记录 */
  function deleteRecord(id) {
    if (!confirm('确定删除这条学习记录吗？')) return;
    records = records.filter(function (r) { return r.id !== id; });
    saveData(STORAGE_RECORDS, records);
    renderRecords();
    updateStats();
    showToast('记录已删除');
  }

  /** 打开编辑记录弹窗 */
  function openEditRecord(id) {
    var rec = records.find(function (r) { return r.id === id; });
    if (!rec) return;
    document.getElementById('editRecordId').value = id;
    document.getElementById('editRecordSubject').value = rec.subject;
    document.getElementById('editRecordDate').value = rec.date;
    document.getElementById('editRecordContent').value = rec.content;
    document.getElementById('editRecordNotes').value = rec.notes;
    openModal('editRecordModal');
  }

  /** 保存编辑记录 */
  function saveEditRecord() {
    var id      = document.getElementById('editRecordId').value;
    var subject = document.getElementById('editRecordSubject').value.trim();
    var date    = document.getElementById('editRecordDate').value;
    var content = document.getElementById('editRecordContent').value.trim();
    var notes   = document.getElementById('editRecordNotes').value.trim();

    if (!subject || !content) { showToast('科目和内容不能为空', true); return; }

    var rec = records.find(function (r) { return r.id === id; });
    if (rec) {
      rec.subject = subject;
      rec.date = date;
      rec.content = content;
      rec.notes = notes;
    }

    saveData(STORAGE_RECORDS, records);
    closeModal('editRecordModal');
    renderRecords();
    updateStats();
    showToast('修改已保存 ✓');
  }

  /** 渲染学习记录列表 */
  function renderRecords() {
    var container = document.getElementById('recordList');
    if (records.length === 0) {
      container.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-icon">📖</div>' +
          '<p>暂无学习记录，开始记录今天的学习吧！</p>' +
        '</div>';
      return;
    }

    var html = '';
    records.forEach(function (r) {
      html +=
        '<li class="record-item">' +
          '<div class="record-header">' +
            '<span class="record-subject">' + escapeHtml(r.subject) + '</span>' +
            '<span class="record-date">' + formatDate(r.date) + '</span>' +
          '</div>' +
          '<div class="record-content">' + escapeHtml(r.content) + '</div>' +
          (r.notes ? '<div class="record-notes">' + escapeHtml(r.notes) + '</div>' : '') +
          '<div class="record-actions">' +
            '<button class="btn btn-secondary btn-sm" onclick="openEditRecord(\'' + r.id + '\')">✏️ 编辑</button>' +
            '<button class="btn btn-danger btn-sm" onclick="deleteRecord(\'' + r.id + '\')">🗑️ 删除</button>' +
          '</div>' +
        '</li>';
    });
    container.innerHTML = html;
  }

  /* ========================================================
   *  学习目标 CRUD
   * ======================================================== */

  /** 新增目标 */
  function addGoal() {
    var text = document.getElementById('goalText').value.trim();
    var type = document.getElementById('goalType').value;

    if (!text) { showToast('请填写目标内容', true); return; }

    goals.unshift({
      id: genId(),
      text: text,
      type: type,
      completed: false,
      completedAt: null,
      createdAt: todayStr()
    });

    saveData(STORAGE_GOALS, goals);
    document.getElementById('goalText').value = '';
    renderGoals();
    updateStats();
    showToast('目标已添加 ✓');
  }

  /** 切换目标完成状态 */
  function toggleGoal(id) {
    var goal = goals.find(function (g) { return g.id === id; });
    if (!goal) return;
    goal.completed = !goal.completed;
    goal.completedAt = goal.completed ? todayStr() : null;
    saveData(STORAGE_GOALS, goals);
    renderGoals();
    updateStats();
    if (goal.completed) {
      showToast('恭喜完成目标！🎉');
    }
  }

  /** 删除目标 */
  function deleteGoal(id) {
    if (!confirm('确定删除这个目标吗？')) return;
    goals = goals.filter(function (g) { return g.id !== id; });
    saveData(STORAGE_GOALS, goals);
    renderGoals();
    updateStats();
    showToast('目标已删除');
  }

  /** 打开编辑目标弹窗 */
  function openEditGoal(id) {
    var goal = goals.find(function (g) { return g.id === id; });
    if (!goal) return;
    document.getElementById('editGoalId').value = id;
    document.getElementById('editGoalText').value = goal.text;
    document.getElementById('editGoalType').value = goal.type;
    openModal('editGoalModal');
  }

  /** 保存编辑目标 */
  function saveEditGoal() {
    var id   = document.getElementById('editGoalId').value;
    var text = document.getElementById('editGoalText').value.trim();
    var type = document.getElementById('editGoalType').value;

    if (!text) { showToast('目标内容不能为空', true); return; }

    var goal = goals.find(function (g) { return g.id === id; });
    if (goal) {
      goal.text = text;
      goal.type = type;
    }

    saveData(STORAGE_GOALS, goals);
    closeModal('editGoalModal');
    renderGoals();
    updateStats();
    showToast('目标已更新 ✓');
  }

  /** 获取目标类型的中文名 */
  function typeName(type) {
    var map = { daily: '每日', weekly: '每周', longterm: '长期' };
    return map[type] || type;
  }

  /** 渲染目标列表 */
  function renderGoals() {
    var pendingContainer   = document.getElementById('pendingGoals');
    var completedContainer = document.getElementById('completedGoals');

    var pending   = goals.filter(function (g) { return !g.completed; });
    var completed = goals.filter(function (g) { return g.completed; });

    if (pending.length === 0) {
      pendingContainer.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-icon">🎯</div>' +
          '<p>暂无进行中的目标，添加一个新目标吧！</p>' +
        '</div>';
    } else {
      var html = '';
      pending.forEach(function (g) {
        html += buildGoalItem(g);
      });
      pendingContainer.innerHTML = html;
    }

    if (completed.length === 0) {
      completedContainer.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-icon">🏆</div>' +
          '<p>还没有完成的目标，加油！</p>' +
        '</div>';
    } else {
      var html2 = '';
      completed.forEach(function (g) {
        html2 += buildGoalItem(g);
      });
      completedContainer.innerHTML = html2;
    }
  }

  /** 构建单条目标 HTML */
  function buildGoalItem(g) {
    return (
      '<div class="goal-item' + (g.completed ? ' completed' : '') + '">' +
        '<div class="goal-checkbox' + (g.completed ? ' checked' : '') + '" ' +
          'onclick="toggleGoal(\'' + g.id + '\')" title="点击切换完成状态">' +
          (g.completed ? '✓' : '') +
        '</div>' +
        '<div class="goal-body">' +
          '<div class="goal-text">' + escapeHtml(g.text) + '</div>' +
          '<div class="goal-meta">' +
            '<span class="goal-type ' + g.type + '">' + typeName(g.type) + '</span>' +
            '<span class="goal-date">创建于 ' + formatDate(g.createdAt) + '</span>' +
            (g.completedAt ? '<span class="goal-date">完成于 ' + formatDate(g.completedAt) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;">' +
          '<button class="btn btn-secondary btn-sm" onclick="openEditGoal(\'' + g.id + '\')">✏️</button>' +
          '<button class="btn btn-danger btn-sm" onclick="deleteGoal(\'' + g.id + '\')">🗑️</button>' +
        '</div>' +
      '</div>'
    );
  }

  /* ========================================================
   *  统计与成果展示
   * ======================================================== */

  function updateStats() {
    /* 统计卡片 */
    document.getElementById('statTotalRecords').textContent = records.length;

    var weekGoals = goals.filter(function (g) { return isThisWeek(g.createdAt); });
    var weekCompleted = weekGoals.filter(function (g) { return g.completed; }).length;
    var weekPending   = weekGoals.length - weekCompleted;

    document.getElementById('statWeekCompleted').textContent = weekCompleted;
    document.getElementById('statWeekPending').textContent   = weekPending;

    /* 总体完成进度 */
    var totalGoals     = goals.length;
    var totalCompleted = goals.filter(function (g) { return g.completed; }).length;
    var totalPercent   = totalGoals > 0 ? Math.round(totalCompleted / totalGoals * 100) : 0;
    document.getElementById('progressPercent').textContent  = totalPercent + '%';
    document.getElementById('progressFill').style.width     = totalPercent + '%';

    /* 本周完成进度 */
    var weekPercent = weekGoals.length > 0 ? Math.round(weekCompleted / weekGoals.length * 100) : 0;
    document.getElementById('weekProgressPercent').textContent = weekPercent + '%';
    document.getElementById('weekProgressFill').style.width    = weekPercent + '%';

    /* 成果存档渲染 */
    renderArchive();
  }

  /** 渲染成果/存档面板 */
  function renderArchive() {
    /* 已完成目标存档 */
    var archiveGoalsEl = document.getElementById('archiveGoals');
    var completedGoals = goals.filter(function (g) { return g.completed; });

    if (completedGoals.length === 0) {
      archiveGoalsEl.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-icon">🏆</div>' +
          '<p>暂无已完成的目标</p>' +
        '</div>';
    } else {
      var html = '';
      completedGoals.forEach(function (g) {
        html +=
          '<div class="archive-item">' +
            '<div>' +
              '<span class="label">' + escapeHtml(g.text) + '</span>' +
              ' <span class="type-badge">' + typeName(g.type) + '</span>' +
            '</div>' +
            '<span class="date">完成于 ' + formatDate(g.completedAt) + '</span>' +
          '</div>';
      });
      archiveGoalsEl.innerHTML = html;
    }

    /* 学习记录存档 */
    var archiveRecordsEl = document.getElementById('archiveRecords');

    if (records.length === 0) {
      archiveRecordsEl.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-icon">📚</div>' +
          '<p>暂无学习记录存档</p>' +
        '</div>';
    } else {
      /* 按日期分组 */
      var grouped = {};
      records.forEach(function (r) {
        if (!grouped[r.date]) grouped[r.date] = [];
        grouped[r.date].push(r);
      });

      var html2 = '';
      /* 按日期倒序 */
      var sortedDates = Object.keys(grouped).sort().reverse();
      sortedDates.forEach(function (date) {
        html2 += '<div class="archive-section"><h3>' + formatDate(date) + '</h3>';
        grouped[date].forEach(function (r) {
          html2 +=
            '<div class="archive-item">' +
              '<div>' +
                '<span class="label">' + escapeHtml(r.subject) + '：' + escapeHtml(r.content) + '</span>' +
              '</div>' +
              (r.notes ? '<span style="font-size:12px;color:var(--gray-400);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(r.notes.substring(0, 30)) + '...</span>' : '') +
            '</div>';
        });
        html2 += '</div>';
      });
      archiveRecordsEl.innerHTML = html2;
    }
  }

  /* ========================================================
   *  工具函数
   * ======================================================== */

  /** 转义 HTML 防止 XSS */
  function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  /* ========================================================
   *  初始化
   * ======================================================== */
  (function init() {
    /* 默认日期设为今天 */
    document.getElementById('recordDate').value = todayStr();
    /* 首次渲染 */
    renderRecords();
    renderGoals();
    updateStats();
  })();
</script>

</body>
</html>
