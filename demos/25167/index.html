<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无界剪贴板 | UNBOUNDED CLIPBOARD</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ========== CSS RESET & VARIABLES ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #0a0a0a;
  --bg-secondary: #1a1a2e;
  --bg-card: #16213e;
  --bg-card-hover: #1a2744;
  --neon-green: #00ff41;
  --neon-cyan: #00d4ff;
  --neon-pink: #ff006e;
  --neon-yellow: #ffbe0b;
  --neon-purple: #b537f2;
  --text-primary: #e0e0e0;
  --text-dim: #6a6a8a;
  --border-pixel: #3a3a5c;
  --pixel-border: 3px solid var(--border-pixel);
  --font-pixel: 'Press Start 2P', monospace;
  --font-mono: 'JetBrains Mono', monospace;
  --glow-green: 0 0 10px #00ff4180, 0 0 20px #00ff4140;
  --glow-cyan: 0 0 10px #00d4ff80, 0 0 20px #00d4ff40;
  --glow-pink: 0 0 10px #ff006e80, 0 0 20px #ff006e40;
}

html { font-size: 16px; }

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-mono);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ========== CRT EFFECT ========== */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 255, 65, 0.015) 2px,
    rgba(0, 255, 65, 0.015) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

body::after {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
  pointer-events: none;
  z-index: 9998;
}

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb {
  background: var(--border-pixel);
  border: 1px solid var(--neon-green);
}
::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }

/* ========== HEADER ========== */
.header {
  background: var(--bg-secondary);
  border-bottom: var(--pixel-border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.status-dots {
  display: flex;
  gap: 6px;
}

.status-dot {
  width: 10px; height: 10px;
  border: 2px solid var(--border-pixel);
  animation: blink 2s infinite;
}
.status-dot.green { background: var(--neon-green); }
.status-dot.cyan { background: var(--neon-cyan); animation-delay: 0.5s; }
.status-dot.pink { background: var(--neon-pink); animation-delay: 1s; }

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.header-title {
  font-family: var(--font-pixel);
  font-size: 0.7rem;
  color: var(--neon-green);
  text-shadow: var(--glow-green);
  letter-spacing: 2px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.clock {
  font-family: var(--font-pixel);
  font-size: 0.6rem;
  color: var(--neon-cyan);
  text-shadow: var(--glow-cyan);
}

.header-btn {
  font-family: var(--font-pixel);
  font-size: 0.5rem;
  padding: 6px 10px;
  background: var(--bg-primary);
  color: var(--text-dim);
  border: 2px solid var(--border-pixel);
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
}
.header-btn:hover {
  color: var(--neon-green);
  border-color: var(--neon-green);
  text-shadow: var(--glow-green);
}

/* ========== MAIN LAYOUT ========== */
.main {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 0;
  min-height: calc(100vh - 50px);
}

/* ========== PASTE ZONE ========== */
.paste-zone {
  padding: 20px;
}

.paste-box {
  background: var(--bg-secondary);
  border: var(--pixel-border);
  padding: 16px;
  position: relative;
  transition: border-color 0.2s;
}

.paste-box.drag-over {
  border-color: var(--neon-cyan);
  box-shadow: var(--glow-cyan);
}

.paste-box-label {
  font-family: var(--font-pixel);
  font-size: 0.55rem;
  color: var(--neon-green);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.paste-box-label .cursor {
  display: inline-block;
  width: 8px;
  height: 14px;
  background: var(--neon-green);
  animation: cursor-blink 1s step-end infinite;
}

@keyframes cursor-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

.paste-textarea {
  width: 100%;
  min-height: 80px;
  background: var(--bg-primary);
  border: 2px solid var(--border-pixel);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  padding: 10px;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
}
.paste-textarea:focus {
  border-color: var(--neon-green);
}
.paste-textarea::placeholder {
  color: var(--text-dim);
  font-family: var(--font-pixel);
  font-size: 0.5rem;
}

.paste-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.pixel-btn {
  font-family: var(--font-pixel);
  font-size: 0.5rem;
  padding: 8px 14px;
  background: var(--bg-primary);
  color: var(--text-primary);
  border: 3px solid var(--border-pixel);
  cursor: pointer;
  position: relative;
  transition: all 0.1s;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.pixel-btn::before {
  content: '';
  position: absolute;
  top: 3px; left: 3px; right: -3px; bottom: -3px;
  border: 2px solid rgba(255,255,255,0.05);
  pointer-events: none;
}

.pixel-btn:hover {
  transform: translate(-1px, -1px);
  box-shadow: 3px 3px 0 var(--border-pixel);
}

.pixel-btn:active {
  transform: translate(1px, 1px);
  box-shadow: none;
}

.pixel-btn.primary {
  border-color: var(--neon-green);
  color: var(--neon-green);
}
.pixel-btn.primary:hover {
  background: var(--neon-green);
  color: var(--bg-primary);
  text-shadow: none;
  box-shadow: 3px 3px 0 #00ff4180, var(--glow-green);
}

.pixel-btn.secondary {
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
}
.pixel-btn.secondary:hover {
  background: var(--neon-cyan);
  color: var(--bg-primary);
  text-shadow: none;
  box-shadow: 3px 3px 0 #00d4ff80, var(--glow-cyan);
}

.pixel-btn.danger {
  border-color: var(--neon-pink);
  color: var(--neon-pink);
}
.pixel-btn.danger:hover {
  background: var(--neon-pink);
  color: var(--bg-primary);
  text-shadow: none;
  box-shadow: 3px 3px 0 #ff006e80, var(--glow-pink);
}

/* ========== CARD GRID ========== */
.card-grid {
  padding: 20px;
  display: columns;
  columns: 2;
  column-gap: 16px;
}

.clip-card {
  break-inside: avoid;
  background: var(--bg-card);
  border: 2px solid var(--border-pixel);
  margin-bottom: 16px;
  padding: 12px;
  cursor: grab;
  position: relative;
  transition: all 0.2s;
  animation: card-enter 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.clip-card:hover {
  border-color: var(--neon-cyan);
  background: var(--bg-card-hover);
  box-shadow: var(--glow-cyan);
}

.clip-card.dragging {
  opacity: 0.5;
  cursor: grabbing;
}

@keyframes card-enter {
  0% { opacity: 0; transform: scale(0.8) translateY(20px); }
  60% { transform: scale(1.05) translateY(-5px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.card-type {
  font-family: var(--font-pixel);
  font-size: 0.45rem;
  padding: 3px 6px;
  border: 1px solid;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.card-type.text { color: var(--neon-green); border-color: var(--neon-green); }
.card-type.image { color: var(--neon-cyan); border-color: var(--neon-cyan); }
.card-type.link { color: var(--neon-yellow); border-color: var(--neon-yellow); }

.card-time {
  font-family: var(--font-pixel);
  font-size: 0.4rem;
  color: var(--text-dim);
}

.card-content {
  font-size: 0.85rem;
  line-height: 1.6;
  color: var(--text-primary);
  word-break: break-all;
  max-height: 200px;
  overflow: hidden;
  position: relative;
}

.card-content.text-content {
  white-space: pre-wrap;
}

.card-content.image-content {
  max-height: none;
}

.card-content.image-content img {
  width: 100%;
  image-rendering: pixelated;
  border: 1px solid var(--border-pixel);
}

.card-content.link-content a {
  color: var(--neon-cyan);
  text-decoration: none;
  word-break: break-all;
}
.card-content.link-content a:hover {
  text-decoration: underline;
}

.card-actions {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--border-pixel);
}

.card-action-btn {
  font-family: var(--font-pixel);
  font-size: 0.4rem;
  padding: 4px 8px;
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border-pixel);
  cursor: pointer;
  transition: all 0.15s;
}

.card-action-btn:hover {
  color: var(--neon-green);
  border-color: var(--neon-green);
}

.card-action-btn.copy:hover { color: var(--neon-cyan); border-color: var(--neon-cyan); }
.card-action-btn.delete:hover { color: var(--neon-pink); border-color: var(--neon-pink); }
.card-action-btn.share:hover { color: var(--neon-yellow); border-color: var(--neon-yellow); }

/* ========== SIDEBAR CONSOLE ========== */
.sidebar {
  background: var(--bg-secondary);
  border-left: var(--pixel-border);
  display: flex;
  flex-direction: column;
}

.console-header {
  padding: 10px 14px;
  border-bottom: var(--pixel-border);
  font-family: var(--font-pixel);
  font-size: 0.5rem;
  color: var(--neon-green);
  display: flex;
  align-items: center;
  gap: 8px;
}

.console-header .indicator {
  width: 6px; height: 6px;
  background: var(--neon-green);
  animation: blink 1.5s infinite;
}

.console-body {
  flex: 1;
  padding: 10px 14px;
  overflow-y: auto;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  line-height: 1.8;
}

.log-line {
  color: var(--neon-green);
  opacity: 0;
  animation: log-appear 0.3s forwards;
}

.log-line .timestamp {
  color: var(--text-dim);
  margin-right: 6px;
}

.log-line.info { color: var(--neon-cyan); }
.log-line.warn { color: var(--neon-yellow); }
.log-line.error { color: var(--neon-pink); }
.log-line.success { color: var(--neon-green); }

@keyframes log-appear {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ========== STATS BAR ========== */
.stats-bar {
  padding: 10px 14px;
  border-top: var(--pixel-border);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.stat-item {
  font-family: var(--font-pixel);
  font-size: 0.4rem;
  color: var(--text-dim);
}

.stat-item .stat-value {
  color: var(--neon-cyan);
  font-size: 0.55rem;
}

/* ========== EMPTY STATE ========== */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}

.empty-state .ascii-art {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  line-height: 1.2;
  color: var(--neon-green);
  opacity: 0.3;
  white-space: pre;
  margin-bottom: 20px;
}

.empty-state p {
  font-family: var(--font-pixel);
  font-size: 0.5rem;
  line-height: 2;
}

/* ========== TOAST ========== */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  font-family: var(--font-pixel);
  font-size: 0.45rem;
  padding: 10px 16px;
  background: var(--bg-secondary);
  border: 2px solid var(--neon-green);
  color: var(--neon-green);
  animation: toast-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  max-width: 300px;
}

.toast.error { border-color: var(--neon-pink); color: var(--neon-pink); }
.toast.info { border-color: var(--neon-cyan); color: var(--neon-cyan); }

@keyframes toast-in {
  from { opacity: 0; transform: translateY(20px) scale(0.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ========== MODAL ========== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.8);
  z-index: 5000;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fade-in 0.2s;
}

.modal {
  background: var(--bg-secondary);
  border: var(--pixel-border);
  max-width: 600px;
  width: 90%;
  max-height: 80vh;
  overflow: auto;
}

.modal-header {
  padding: 12px 16px;
  border-bottom: var(--pixel-border);
  font-family: var(--font-pixel);
  font-size: 0.55rem;
  color: var(--neon-cyan);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-close {
  background: none;
  border: 1px solid var(--border-pixel);
  color: var(--text-dim);
  font-family: var(--font-pixel);
  font-size: 0.5rem;
  padding: 4px 8px;
  cursor: pointer;
}
.modal-close:hover { color: var(--neon-pink); border-color: var(--neon-pink); }

.modal-body {
  padding: 16px;
  font-size: 0.85rem;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-all;
}

.modal-body img {
  width: 100%;
  image-rendering: pixelated;
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .main {
    grid-template-columns: 1fr;
  }
  .sidebar {
    border-left: none;
    border-top: var(--pixel-border);
    max-height: 200px;
  }
  .card-grid {
    columns: 1;
  }
  .header-title {
    font-size: 0.5rem;
  }
  .clock { display: none; }
}

/* ========== PIXEL DECORATIONS ========== */
.pixel-corner {
  position: absolute;
  width: 6px; height: 6px;
}
.pixel-corner.tl { top: -1px; left: -1px; border-top: 2px solid var(--neon-green); border-left: 2px solid var(--neon-green); }
.pixel-corner.tr { top: -1px; right: -1px; border-top: 2px solid var(--neon-green); border-right: 2px solid var(--neon-green); }
.pixel-corner.bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--neon-green); border-left: 2px solid var(--neon-green); }
.pixel-corner.br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--neon-green); border-right: 2px solid var(--neon-green); }

/* ========== TYPING ANIMATION ========== */
.typing-text {
  overflow: hidden;
  white-space: nowrap;
  border-right: 2px solid var(--neon-green);
  animation: typing 2s steps(30) forwards, blink-caret 0.75s step-end infinite;
  width: 0;
}

@keyframes typing {
  from { width: 0; }
  to { width: 100%; }
}

@keyframes blink-caret {
  from, to { border-color: transparent; }
  50% { border-color: var(--neon-green); }
}

/* ========== GLITCH EFFECT ========== */
.glitch {
  position: relative;
}
.glitch:hover {
  animation: glitch 0.3s infinite;
}

@keyframes glitch {
  0% { transform: translate(0); }
  20% { transform: translate(-2px, 2px); }
  40% { transform: translate(-2px, -2px); }
  60% { transform: translate(2px, 2px); }
  80% { transform: translate(2px, -2px); }
  100% { transform: translate(0); }
}

/* ========== SCAN LINE ANIMATION ========== */
.scan-line {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
  opacity: 0.1;
  z-index: 9997;
  animation: scan 4s linear infinite;
  pointer-events: none;
}

@keyframes scan {
  0% { top: 0; }
  100% { top: 100vh; }
}

/* ========== FLOATING PIXELS ========== */
.pixel-particle {
  position: fixed;
  width: 4px; height: 4px;
  background: var(--neon-green);
  opacity: 0.2;
  pointer-events: none;
  z-index: -1;
}
</style>
</head>
<body>

<!-- Scan Line -->
<div class="scan-line"></div>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <div class="status-dots">
      <div class="status-dot green"></div>
      <div class="status-dot cyan"></div>
      <div class="status-dot pink"></div>
    </div>
    <div class="header-title glitch">UNBOUNDED CLIPBOARD // 无界剪贴板</div>
  </div>
  <div class="header-right">
    <div class="clock" id="clock">00:00:00</div>
    <button class="header-btn" id="clearAllBtn">CLR ALL</button>
  </div>
</header>

<!-- Main Content -->
<div class="main">
  <!-- Left: Paste Zone + Card Grid -->
  <div class="paste-zone">
    <!-- Paste Box -->
    <div class="paste-box" id="pasteBox">
      <div class="pixel-corner tl"></div>
      <div class="pixel-corner tr"></div>
      <div class="pixel-corner bl"></div>
      <div class="pixel-corner br"></div>
      <div class="paste-box-label">
        <span>> PASTE_ZONE</span>
        <span class="cursor"></span>
      </div>
      <textarea class="paste-textarea" id="pasteInput" placeholder="PASTE TEXT HERE / DROP FILES HERE..."></textarea>
      <div class="paste-actions">
        <button class="pixel-btn primary" id="pasteBtn">PASTE</button>
        <button class="pixel-btn secondary" id="uploadImgBtn">IMG+</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none" multiple>
      </div>
    </div>

    <!-- Card Grid -->
    <div class="card-grid" id="cardGrid">
      <!-- Cards will be inserted here -->
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
      <div class="ascii-art">
   ╔══════════════════════╗
   ║  CLIPBOARD EMPTY... ║
   ║  PASTE SOMETHING!   ║
   ╚══════════════════════╝
      </div>
      <p>> 粘贴文字 / 拖入图片 / 即刻开始</p>
      <p>> NO LOGIN REQUIRED</p>
    </div>
  </div>

  <!-- Right: Console Sidebar -->
  <aside class="sidebar">
    <div class="console-header">
      <div class="indicator"></div>
      <span>CONSOLE</span>
    </div>
    <div class="console-body" id="consoleBody">
      <!-- Log lines will be inserted here -->
    </div>
    <div class="stats-bar">
      <div class="stat-item">
        <div>TOTAL</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-item">
        <div>TEXT</div>
        <div class="stat-value" id="statText">0</div>
      </div>
      <div class="stat-item">
        <div>IMAGE</div>
        <div class="stat-value" id="statImage">0</div>
      </div>
      <div class="stat-item">
        <div>LINK</div>
        <div class="stat-value" id="statLink">0</div>
      </div>
    </div>
  </aside>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Modal Container -->
<div id="modalContainer"></div>

<script>
// ========== UTILITY ==========
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function formatTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString('zh-CN', { hour12: false });
}

function formatDate(ts) {
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${formatTime(ts)}`;
}

function isURL(str) {
  try {
    const u = new URL(str);
    return u.protocol === 'http:' || u.protocol === 'https:';
  } catch { return false; }
}

function detectType(content) {
  if (content.startsWith('data:image')) return 'image';
  if (isURL(content.trim())) return 'link';
  return 'text';
}

// ========== STORAGE ==========
const STORAGE_KEY = 'unbounded-clipboard-items';

function loadItems() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch { return []; }
}

function saveItems(items) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

// ========== CONSOLE LOG ==========
function log(msg, type = 'info') {
  const body = $('#consoleBody');
  const line = document.createElement('div');
  line.className = `log-line ${type}`;
  const ts = formatTime(Date.now());
  line.innerHTML = `<span class="timestamp">[${ts}]</span> ${msg}`;
  body.appendChild(line);
  body.scrollTop = body.scrollHeight;
}

// ========== TOAST ==========
function showToast(msg, type = 'info') {
  const container = $('#toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

// ========== CLOCK ==========
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  $('#clock').textContent = `${h}:${m}:${s}`;
}
setInterval(updateClock, 1000);
updateClock();

// ========== STATS ==========
function updateStats() {
  const items = loadItems();
  $('#statTotal').textContent = items.length;
  $('#statText').textContent = items.filter(i => i.type === 'text').length;
  $('#statImage').textContent = items.filter(i => i.type === 'image').length;
  $('#statLink').textContent = items.filter(i => i.type === 'link').length;
}

// ========== RENDER CARDS ==========
function renderCards() {
  const items = loadItems();
  const grid = $('#cardGrid');
  const empty = $('#emptyState');

  if (items.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    updateStats();
    return;
  }

  empty.style.display = 'none';
  grid.innerHTML = '';

  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'clip-card';
    card.draggable = true;
    card.dataset.id = item.id;

    let contentHTML = '';
    if (item.type === 'image') {
      contentHTML = `<div class="card-content image-content"><img src="${item.content}" alt="clipboard image" loading="lazy"></div>`;
    } else if (item.type === 'link') {
      contentHTML = `<div class="card-content link-content"><a href="${item.content}" target="_blank" rel="noopener">${item.content}</a></div>`;
    } else {
      const escaped = item.content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      contentHTML = `<div class="card-content text-content">${escaped}</div>`;
    }

    card.innerHTML = `
      <div class="card-header">
        <span class="card-type ${item.type}">${item.type.toUpperCase()}</span>
        <span class="card-time">${formatDate(item.createdAt)}</span>
      </div>
      ${contentHTML}
      <div class="card-actions">
        <button class="card-action-btn copy" data-id="${item.id}" title="COPY">&#9729; COPY</button>
        <button class="card-action-btn" data-id="${item.id}" data-action="view" title="VIEW">&#9673; VIEW</button>
        <button class="card-action-btn share" data-id="${item.id}" data-action="share" title="SHARE">&#9733; SHARE</button>
        <button class="card-action-btn delete" data-id="${item.id}" data-action="delete" title="DELETE">&#10005; DEL</button>
      </div>
    `;

    // Drag events
    card.addEventListener('dragstart', handleDragStart);
    card.addEventListener('dragend', handleDragEnd);

    grid.appendChild(card);
  });

  updateStats();
}

// ========== ADD ITEM ==========
function addItem(content, type) {
  const items = loadItems();
  const item = {
    id: generateId(),
    type: type || detectType(content),
    content,
    createdAt: Date.now(),
    pinned: false
  };
  items.unshift(item);
  saveItems(items);
  renderCards();
  log(`+ ${item.type.toUpperCase()} saved [${item.id}]`, 'success');
  showToast(`${item.type.toUpperCase()} CLIPPED!`, 'info');
}

// ========== DELETE ITEM ==========
function deleteItem(id) {
  let items = loadItems();
  const item = items.find(i => i.id === id);
  items = items.filter(i => i.id !== id);
  saveItems(items);
  renderCards();
  log(`- Item deleted [${id}]`, 'warn');
  showToast('DELETED', 'error');
}

// ========== COPY ITEM ==========
async function copyItem(id) {
  const items = loadItems();
  const item = items.find(i => i.id === id);
  if (!item) return;

  try {
    if (item.type === 'image') {
      const resp = await fetch(item.content);
      const blob = await resp.blob();
      await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
    } else {
      await navigator.clipboard.writeText(item.content);
    }
    log(`COPIED to clipboard [${id}]`, 'success');
    showToast('COPIED!', 'info');
  } catch (e) {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = item.type === 'image' ? item.content : item.content;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    log(`COPIED (fallback) [${id}]`, 'success');
    showToast('COPIED!', 'info');
  }
}

// ========== VIEW ITEM ==========
function viewItem(id) {
  const items = loadItems();
  const item = items.find(i => i.id === id);
  if (!item) return;

  const container = $('#modalContainer');
  let bodyContent = '';
  if (item.type === 'image') {
    bodyContent = `<img src="${item.content}" alt="full view">`;
  } else {
    const escaped = item.content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    bodyContent = escaped;
  }

  container.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <span>${item.type.toUpperCase()} // ${formatDate(item.createdAt)}</span>
          <button class="modal-close" id="modalClose">X</button>
        </div>
        <div class="modal-body">${bodyContent}</div>
      </div>
    </div>
  `;

  $('#modalClose').onclick = closeModal;
  $('#modalOverlay').onclick = (e) => {
    if (e.target === e.currentTarget) closeModal();
  };
}

function closeModal() {
  $('#modalContainer').innerHTML = '';
}

// ========== SHARE ITEM ==========
async function shareItem(id) {
  const items = loadItems();
  const item = items.find(i => i.id === id);
  if (!item) return;

  if (navigator.share) {
    try {
      await navigator.share({
        title: '无界剪贴板',
        text: item.type === 'image' ? '[IMAGE]' : item.content,
        url: item.type === 'link' ? item.content : undefined
      });
      log(`SHARED [${id}]`, 'success');
    } catch (e) {
      log('SHARE cancelled', 'warn');
    }
  } else {
    await copyItem(id);
    log('SHARE > COPIED (Web Share not supported)', 'info');
    showToast('COPIED FOR SHARING', 'info');
  }
}

// ========== DRAG & DROP ==========
let draggedId = null;

function handleDragStart(e) {
  draggedId = e.currentTarget.dataset.id;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function handleDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  draggedId = null;
}

// Card grid drag reorder
$('#cardGrid').addEventListener('dragover', (e) => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
});

$('#cardGrid').addEventListener('drop', (e) => {
  e.preventDefault();
  if (!draggedId) return;

  const targetCard = e.target.closest('.clip-card');
  if (!targetCard || targetCard.dataset.id === draggedId) return;

  const items = loadItems();
  const fromIdx = items.findIndex(i => i.id === draggedId);
  const toIdx = items.findIndex(i => i.id === targetCard.dataset.id);
  if (fromIdx === -1 || toIdx === -1) return;

  const [moved] = items.splice(fromIdx, 1);
  items.splice(toIdx, 0, moved);
  saveItems(items);
  renderCards();
  log(`MOVED item [${draggedId}]`, 'info');
});

// Paste box file drag & drop
const pasteBox = $('#pasteBox');

pasteBox.addEventListener('dragover', (e) => {
  e.preventDefault();
  pasteBox.classList.add('drag-over');
});

pasteBox.addEventListener('dragleave', () => {
  pasteBox.classList.remove('drag-over');
});

pasteBox.addEventListener('drop', (e) => {
  e.preventDefault();
  pasteBox.classList.remove('drag-over');

  const files = e.dataTransfer.files;
  if (files.length > 0) {
    handleFiles(files);
  }
});

// ========== FILE HANDLING ==========
function handleFiles(files) {
  Array.from(files).forEach(file => {
    if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = (e) => {
        addItem(e.target.result, 'image');
      };
      reader.readAsDataURL(file);
    } else {
      const reader = new FileReader();
      reader.onload = (e) => {
        addItem(e.target.result, 'text');
      };
      reader.readAsText(file);
    }
  });
}

// ========== EVENT LISTENERS ==========

// Paste button
$('#pasteBtn').addEventListener('click', () => {
  const input = $('#pasteInput');
  const text = input.value.trim();
  if (!text) {
    // Try reading clipboard
    navigator.clipboard.readText().then(clipText => {
      if (clipText.trim()) {
        addItem(clipText.trim());
        input.value = '';
      } else {
        showToast('NOTHING TO PASTE', 'error');
      }
    }).catch(() => {
      showToast('NOTHING TO PASTE', 'error');
    });
    return;
  }
  addItem(text);
  input.value = '';
});

// Upload image button
$('#uploadImgBtn').addEventListener('click', () => {
  $('#fileInput').click();
});

$('#fileInput').addEventListener('change', (e) => {
  if (e.target.files.length > 0) {
    handleFiles(e.target.files);
    e.target.value = '';
  }
});

// Clear all
$('#clearAllBtn').addEventListener('click', () => {
  const items = loadItems();
  if (items.length === 0) {
    showToast('ALREADY EMPTY', 'info');
    return;
  }
  saveItems([]);
  renderCards();
  log('ALL ITEMS CLEARED', 'warn');
  showToast('ALL CLEARED', 'error');
});

// Card action delegation
$('#cardGrid').addEventListener('click', (e) => {
  const btn = e.target.closest('.card-action-btn');
  if (!btn) return;

  const id = btn.dataset.id;
  const action = btn.dataset.action;

  if (btn.classList.contains('copy')) {
    copyItem(id);
  } else if (action === 'view') {
    viewItem(id);
  } else if (action === 'share') {
    shareItem(id);
  } else if (action === 'delete') {
    deleteItem(id);
  }
});

// Global paste listener
document.addEventListener('paste', (e) => {
  // If focus is not on textarea, handle paste globally
  if (document.activeElement === $('#pasteInput')) return;

  const items = e.clipboardData.items;
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const blob = item.getAsFile();
      const reader = new FileReader();
      reader.onload = (ev) => addItem(ev.target.result, 'image');
      reader.readAsDataURL(blob);
      return;
    }
  }

  const text = e.clipboardData.getData('text');
  if (text.trim()) {
    e.preventDefault();
    addItem(text.trim());
  }
});

// Keyboard shortcut: Ctrl+V when not focused on input
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeModal();
  }
});

// ========== FLOATING PIXEL PARTICLES ==========
function createParticles() {
  const count = 15;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'pixel-particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.top = Math.random() * 100 + 'vh';
    p.style.opacity = Math.random() * 0.15 + 0.05;
    p.style.animation = `float-particle ${8 + Math.random() * 12}s linear infinite`;
    p.style.animationDelay = `-${Math.random() * 10}s`;
    document.body.appendChild(p);
  }

  // Add keyframes dynamically
  const style = document.createElement('style');
  style.textContent = `
    @keyframes float-particle {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 0.15; }
      90% { opacity: 0.15; }
      100% { transform: translateY(-100vh) translateX(${Math.random() > 0.5 ? '' : '-'}50px); opacity: 0; }
    }
  `;
  document.head.appendChild(style);
}

// ========== INIT ==========
function init() {
  renderCards();
  createParticles();

  log('SYSTEM BOOT COMPLETE', 'success');
  log('UNBOUNDED CLIPBOARD v1.0', 'info');
  log('READY FOR INPUT...', 'info');

  const items = loadItems();
  if (items.length > 0) {
    log(`LOADED ${items.length} ITEM(S) FROM STORAGE`, 'info');
  }
}

init();
</script>
