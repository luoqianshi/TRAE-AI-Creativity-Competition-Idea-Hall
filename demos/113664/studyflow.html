<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyFlow Agent — Learning Codex</title>
  <style>
    :root {
      --bg: #1a2332; --bg-elevated: #1e2a3a; --surface: #243447; --surface-hover: #2d4055; --surface-active: #364d66;
      --border: rgba(241,250,238,0.08); --border-hover: rgba(241,250,238,0.14); --border-active: rgba(241,250,238,0.22);
      --text: #f1faee; --text-secondary: #a8dadc; --text-muted: #7da0a0; --text-faint: #5a7575;
      --accent: #2d8b8b; --accent-hover: #267a7a; --accent-soft: rgba(45,139,139,0.12); --accent-glow: 0 0 24px rgba(45,139,139,0.25);
      --blue: #4a9d9d; --blue-soft: rgba(74,157,157,0.12); --gold: #e9c46a; --gold-soft: rgba(233,196,106,0.12);
      --red: #e06c75; --red-soft: rgba(224,108,117,0.12); --purple: #a8dadc; --purple-soft: rgba(168,218,220,0.12);
      --teal: #2d8b8b; --teal-soft: rgba(45,139,139,0.12);
      --radius: 12px; --radius-lg: 16px; --radius-xl: 24px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.10); --shadow-md: 0 4px 20px rgba(0,0,0,0.12); --shadow-lg: 0 12px 40px rgba(0,0,0,0.18);
      --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'KaiTi', 'STKaiti', Georgia, 'Times New Roman', serif;
      --font-sans: 'DejaVu Sans', 'IBM Plex Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
      --font-mono: 'IBM Plex Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="light"] {
      --bg: #f1faee; --bg-elevated: #ffffff; --surface: #ffffff; --surface-hover: #e8f1f1; --surface-active: #dfecec;
      --border: rgba(26,35,50,0.08); --border-hover: rgba(26,35,50,0.12); --border-active: rgba(26,35,50,0.18);
      --text: #1a2332; --text-secondary: #4a6b6b; --text-muted: #7a9a9a; --text-faint: #a8c0c0;
      --accent: #2d6b6b; --accent-hover: #245858; --accent-soft: rgba(45,107,107,0.10); --accent-glow: 0 0 20px rgba(45,107,107,0.15);
      --blue: #2d6b6b; --blue-soft: rgba(45,107,107,0.10); --gold: #b8860b; --gold-soft: rgba(184,134,11,0.10);
      --red: #c44545; --red-soft: rgba(196,69,69,0.10); --purple: #2d6b6b; --purple-soft: rgba(45,107,107,0.10);
      --teal: #0d5c5c; --teal-soft: rgba(13,92,92,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { height: 100vh; overflow: hidden; color: var(--text); background: var(--bg); font: 15px/1.6 var(--font-sans); -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: none; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 4px; }
    .app { height: 100vh; display: grid; grid-template-rows: auto minmax(0,1fr) auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 20px; background: var(--bg-elevated); border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #a8dadc); color: #fff; font: 800 13px var(--font-mono); box-shadow: var(--accent-glow); }
    .brand-text strong { font: 700 15px var(--font-sans); display: block; letter-spacing: -0.3px; line-height: 1.2; }
    .brand-text span { display: block; color: var(--text-muted); font: 400 11px var(--font-mono); margin-top: 0; line-height: 1.2; }
    .top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .select { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); padding: 6px 10px; font: 500 12px var(--font-mono); outline: none; transition: border-color var(--transition); }
    .select:hover { border-color: var(--border-hover); }
    .select:focus { border-color: var(--accent); }
    .statusbar { display: flex; align-items: center; justify-content: space-between; padding: 5px 20px; background: var(--bg-elevated); border-top: 1px solid var(--border); font: 400 11px var(--font-mono); color: var(--text-muted); }
    .status-left, .status-right { display: flex; align-items: center; gap: 16px; }
    .status-item { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: var(--accent-glow); }
    .status-dot.idle { background: var(--gold); }
    .status-dot.waiting { background: var(--blue); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .main { min-height: 0; overflow: auto; padding: 24px; }
    .workspace { width: 100%; max-width: 1600px; margin: 0 auto; display: grid; grid-template-columns: 280px minmax(0,1fr) 340px; grid-template-rows: auto auto minmax(0,1fr) auto; grid-template-areas: "side tools state" "side header state" "side run state" "side run state"; gap: 20px; }
    .left-col { grid-area: side; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
    .page-layout { width: 100%; max-width: 1600px; margin: 0 auto; display: flex; gap: 20px; align-items: flex-start; }
    .page-layout .mission-list { flex: 0 0 280px; width: 280px; grid-area: auto; }
    .page-content { flex: 1; min-width: 0; }
    .page-content > .card { width: 100%; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; transition: all var(--transition); box-shadow: var(--shadow-sm); }
    .card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .pad { padding: 20px; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: center; gap: 12px; }
    .between { justify-content: space-between; }
    .muted { color: var(--text-secondary); }
    .faint { color: var(--text-faint); }
    .small { font-size: 13px; }
    .mono { font-family: var(--font-mono); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); background: transparent; font: 600 12px var(--font-mono); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.6px; }
    .panel-head .path { color: var(--accent); }
    .panel-head .prompt { color: var(--text-muted); }
    .panel-head .title { color: var(--text); font-weight: 700; }
    .badge { display: inline-flex; align-items: center; justify-content: center; min-height: 24px; padding: 4px 12px; border-radius: 999px; background: var(--surface-hover); color: var(--text-secondary); font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
    .badge.green { background: var(--teal-soft); color: var(--teal); }
    .badge.blue { background: var(--blue-soft); color: var(--blue); }
    .badge.gold { background: var(--gold-soft); color: var(--gold); }
    .badge.red { background: var(--red-soft); color: var(--red); }
    .badge.purple { background: var(--purple-soft); color: var(--purple); }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 32px; border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; background: var(--surface); color: var(--text); font: 600 12px var(--font-mono); transition: all var(--transition); box-shadow: var(--shadow-sm); }
    .btn:hover { border-color: var(--border-hover); background: var(--surface-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn.primary { background: linear-gradient(135deg, var(--accent), #4a9d9d); border-color: transparent; color: #fff; box-shadow: 0 4px 16px rgba(45,139,139,0.35); }
    .btn.primary:hover { background: linear-gradient(135deg, var(--accent-hover), #2d8b8b); box-shadow: 0 6px 20px rgba(45,139,139,0.45); }
    .btn.green { background: var(--teal-soft); border-color: var(--teal); color: var(--teal); }
    .btn.sm { min-height: 26px; padding: 4px 10px; font-size: 11px; }
    .mission-list { display: flex; flex-direction: column; gap: 16px; }
    .mission-list .card { background: transparent; border: none; box-shadow: none; }
    .side-nav { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .side-nav .nav-tab { width: 100%; justify-content: flex-start; padding: 10px 14px; border-radius: var(--radius); background: transparent; color: var(--text-secondary); font: 600 14px var(--font-sans); transition: all var(--transition); display: flex; align-items: center; gap: 10px; border: none; }
    .side-nav .nav-tab:hover { background: var(--surface-hover); color: var(--text); }
    .side-nav .nav-tab.active { background: var(--accent-soft); color: var(--accent); }
    .mission-card { width: 100%; display: block; text-align: left; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; background: var(--surface); color: var(--text); transition: all var(--transition); box-shadow: var(--shadow-sm); }
    .mission-card:hover { border-color: var(--border-hover); background: var(--surface-hover); }
    .mission-card.active { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
    .mission-card .mc-title { font: 600 14px var(--font-sans); margin-bottom: 4px; line-height: 1.4; }
    .mission-card .mc-meta { font: 400 12px var(--font-mono); color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .mission-card .mc-status { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
    .mission-card .mc-status.running { background: var(--accent); }
    .mission-card .mc-status.paused { background: var(--gold); }
    .mission-card .mc-status.queued { background: var(--text-faint); }
    .run-header { grid-area: header; }
    .run-header-content { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 16px; align-items: center; }
    .workspace-title { font: 800 30px/1.2 var(--font-sans); letter-spacing: -0.5px; background: linear-gradient(135deg, var(--text), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    [data-theme="light"] .workspace-title { background: none; -webkit-text-fill-color: var(--text); }
    .run-card { grid-area: run; min-height: 500px; display: grid; grid-template-rows: auto minmax(0,1fr); }
    .timeline { padding: 16px; overflow: auto; }
    .event { display: grid; grid-template-columns: 32px 24px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font: 400 14px var(--font-mono); }
    .event:last-child { border-bottom: 0; }
    .event .ln { color: var(--text-faint); text-align: right; font-size: 12px; }
    .event .dot { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; font-size: 11px; font-weight: 700; background: var(--surface-hover); color: var(--text-faint); border: 1px solid var(--border); }
    .event .dot.done { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
    .event .dot.active { background: var(--blue-soft); color: var(--blue); border-color: var(--blue); animation: pulse 2s infinite; }
    .event .label { color: var(--text); font-weight: 600; line-height: 1.4; }
    .event .desc { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }
    .event.pending .label { color: var(--text-faint); }
    .checkpoint { margin: 16px 0; padding: 16px; border: 1px solid var(--gold); border-radius: var(--radius-lg); background: var(--gold-soft); }
    .checkpoint-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .question-box { padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin: 10px 0; }
    .question-box .q-code { display: block; margin: 10px 0; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font: 600 15px var(--font-mono); color: var(--accent); line-height: 1.5; }
    .choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .choice-btn { padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font: 500 14px var(--font-sans); text-align: left; transition: all var(--transition); }
    .choice-btn:hover { border-color: var(--blue); background: var(--blue-soft); }
    .choice-btn.correct { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .choice-btn.wrong { border-color: var(--red); background: var(--red-soft); color: var(--red); }
    .choice-btn:disabled { cursor: default; opacity: 0.75; }
    .result-box { margin-top: 12px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font: 400 14px var(--font-mono); }
    .result-box.correct { border-color: var(--accent); background: var(--accent-soft); }
    .result-box.wrong { border-color: var(--red); background: var(--red-soft); }
    .result-box .res-line { color: var(--text-secondary); margin: 4px 0; line-height: 1.5; }
    .result-box .res-line strong { color: var(--text); }
    .result-box .res-keyword { color: var(--blue); }
    .result-box .res-string { color: var(--accent); }
    .state-panel { grid-area: state; display: flex; flex-direction: column; gap: 0; }
    .metric { display: grid; grid-template-columns: 80px minmax(0,1fr) 40px; align-items: center; gap: 12px; margin: 10px 0; }
    .metric .m-label { font: 500 13px var(--font-sans); color: var(--text-secondary); }
    .metric .m-val { font: 700 14px var(--font-mono); color: var(--text); text-align: right; }
    .bar { height: 8px; border-radius: 4px; background: var(--bg-elevated); overflow: hidden; border: 1px solid var(--border); }
    .bar span { display: block; height: 100%; border-radius: inherit; transition: width 0.5s ease; }
    .bar.green span { background: var(--accent); box-shadow: var(--accent-glow); }
    .bar.blue span { background: var(--blue); }
    .bar.gold span { background: var(--gold); }
    .bar.red span { background: var(--red); }
    .bar.purple span { background: var(--purple); }
    .readiness-box { margin-top: 16px; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg-elevated); }
    .readiness-box .big { font: 800 36px var(--font-mono); color: var(--accent); text-shadow: var(--accent-glow); line-height: 1.2; }
    .tool-dock { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .tool { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); text-align: center; font: 600 12px var(--font-mono); color: var(--text); transition: all var(--transition); }
    .tool:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); transform: translateY(-2px); }
    .tool-bar { grid-area: tools; display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 0; overflow-x: auto; background: transparent; border: none; box-shadow: none; }
    .tool-bar .panel-head { display: none; }
    .tool-bar .tools-stack { display: flex; flex-direction: row; gap: 10px; align-items: center; width: 100%; }
    .tool-bar .t-btn { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); white-space: nowrap; transition: all var(--transition); box-shadow: var(--shadow-sm); }
    .tool-bar .t-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
    .tool-bar .t-btn.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .tool-bar .t-icon { font: 700 15px var(--font-mono); line-height: 1; }
    .tool-bar .t-label { font: 600 13px var(--font-mono); line-height: 1; color: var(--text-secondary); }
    .tool-bar .t-btn:hover .t-label { color: var(--accent); }
    .tool-bar .t-btn.active .t-label { color: var(--accent); }
    .artifact-panel { width: 100%; }
    .artifact-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
    .artifact-panel .artifact-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .artifact { padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-hover); transition: all var(--transition); }
    .artifact:hover { border-color: var(--border-hover); background: var(--surface-active); }
    .artifact .a-type { font: 700 11px var(--font-mono); color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .artifact .a-title { font: 400 13px var(--font-mono); color: var(--text-secondary); line-height: 1.4; }
    .modal-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: grid; place-items: center; padding: 20px; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .modal { width: 100%; max-width: 720px; max-height: 85vh; display: grid; grid-template-rows: auto minmax(0,1fr) auto; background: var(--surface); border: 1px solid var(--border-hover); border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--bg-elevated); }
    .modal-head .m-title { font: 700 15px var(--font-sans); }
    .modal-head .m-close { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; color: var(--text-secondary); font: 700 18px var(--font-mono); transition: all var(--transition); }
    .modal-head .m-close:hover { background: var(--red-soft); color: var(--red); }
    .modal-body { padding: 20px; overflow: auto; }
    .modal-foot { padding: 12px 20px; border-top: 1px solid var(--border); background: var(--bg-elevated); display: flex; justify-content: flex-end; gap: 10px; }
    .chat-log { display: flex; flex-direction: column; gap: 12px; max-height: 400px; overflow: auto; padding: 4px 0; }
    .chat-msg { padding: 12px 16px; border-radius: var(--radius-lg); max-width: 85%; font: 400 14px var(--font-sans); line-height: 1.6; }
    .chat-msg.bot { background: var(--surface-hover); border: 1px solid var(--border); align-self: flex-start; }
    .chat-msg.user { background: var(--blue-soft); border: 1px solid var(--blue); align-self: flex-end; color: var(--blue); }
    .chat-input-row { display: flex; gap: 10px; margin-top: 12px; }
    .chat-input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font: 400 14px var(--font-sans); outline: none; transition: border-color var(--transition); }
    .chat-input:focus { border-color: var(--accent); }
    .note-item { padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-hover); margin-bottom: 8px; }
    .note-item .n-title { font: 600 13px var(--font-mono); color: var(--text); margin-bottom: 4px; }
    .note-item .n-meta { font: 400 11px var(--font-mono); color: var(--text-muted); }
    .note-item .n-body { font: 400 13px var(--font-sans); color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }
    .note-add-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 14px; }
    /* === Notes Module — Scholar's Codex === */
    .notes-page { display: flex; flex-direction: column; gap: 20px; }
    .notes-hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .notes-hero-left h1 { font: 700 26px var(--font-serif); letter-spacing: -0.5px; color: var(--text); }
    .notes-hero-left p { color: var(--text-muted); font: 400 13px var(--font-mono); margin-top: 4px; }
    .notes-toolbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .notes-search { position: relative; flex: 0 1 320px; }
    .notes-search input { width: 100%; padding: 10px 14px 10px 38px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text); font: 400 14px var(--font-sans); outline: none; transition: all var(--transition); }
    .notes-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .notes-search .ns-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--text-muted); pointer-events: none; }
    .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-chip { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); font: 600 12px var(--font-mono); cursor: pointer; transition: all var(--transition); white-space: nowrap; }
    .filter-chip:hover { border-color: var(--border-hover); color: var(--text); }
    .filter-chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .notes-layout { display: grid; grid-template-columns: 340px minmax(0,1fr); gap: 20px; min-height: 0; }
    .notes-list-pane { display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 300px); overflow-y: auto; padding-right: 4px; }
    .note-card { position: relative; padding: 14px 16px 14px 22px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; transition: all var(--transition); overflow: hidden; animation: ncReveal 0.4s ease backwards; }
    .note-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 4px 0 0 4px; background: var(--text-faint); }
    .note-card[data-cat="concept"]::before { background: var(--teal); }
    .note-card[data-cat="formula"]::before { background: var(--gold); }
    .note-card[data-cat="question"]::before { background: var(--red); }

      open() { this._filtered = this.commands; this._selected = 0; this._render(); setTimeout(() => $('#cmdInput').focus(), 50); },
      close() { $('#modalHost').innerHTML = ''; },
      _render() { $('#modalHost').innerHTML = `<div class="cmd-overlay" onclick="if(event.target===this)CommandPalette.close()"><div class="cmd-palette"><input class="cmd-input" id="cmdInput" placeholder="输入命令或 /review /flashcard /regression..." oninput="CommandPalette.filter(this.value)" onkeydown="CommandPalette._onKey(event)"><div class="cmd-list" id="cmdList">${this._filtered.map((c, i) => `<div class="cmd-item ${i === this._selected ? 'selected' : ''}" onclick="CommandPalette._run(${i})"><span>${escapeHtml(c.label)}</span><span class="cmd-cat">${c.cat}</span></div>`).join('')}</div><div class="cmd-hint">↑↓ 导航 · Enter 执行 · Esc 关闭</div></div></div>`; },
      filter(text) { const t = text.toLowerCase(); this._filtered = this.commands.filter(c => c.label.toLowerCase().includes(t) || c.cat.includes(t)); this._selected = 0; this._renderList(); setTimeout(() => { const inp = $('#cmdInput'); if (inp) { inp.focus(); inp.value = text; } }, 10); },
      _renderList() { const list = $('#cmdList'); if (!list) return; list.innerHTML = this._filtered.map((c, i) => `<div class="cmd-item ${i === this._selected ? 'selected' : ''}" onclick="CommandPalette._run(${i})"><span>${escapeHtml(c.label)}</span><span class="cmd-cat">${c.cat}</span></div>`).join(''); },
      _onKey(e) { if (e.key === 'ArrowDown') { e.preventDefault(); this._selected = Math.min(this._selected + 1, this._filtered.length - 1); this._renderList(); } else if (e.key === 'ArrowUp') { e.preventDefault(); this._selected = Math.max(this._selected - 1, 0); this._renderList(); } else if (e.key === 'Enter') { e.preventDefault(); this._run(this._selected); } else if (e.key === 'Escape') { this.close(); } },
      _run(i) { const cmd = this._filtered[i]; if (cmd) { this.close(); cmd.action(); } }
    };
    document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); CommandPalette.open(); return; } if (e.key === 'Escape') { if ($('#modalHost').innerHTML) { if ($('#cmdInput')) CommandPalette.close(); else Modal.close(); } } });
    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
