<body data-theme="dark">

<!-- Header -->
<header class="header">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="22,7 13.5,15.5 8.5,10.5 2,17"/>
      <polyline points="16,7 22,7 22,13"/>
    </svg>
    StockPulse
  </div>
  <div class="header-actions">
    <span class="live-dot"></span>
    <span class="time-display" id="timeDisplay">--:--:--</span>
    <div class="theme-switcher">
      <button class="theme-btn active" data-theme="dark" title="暗色主题"></button>
      <button class="theme-btn" data-theme="light" title="亮色主题"></button>
      <button class="theme-btn" data-theme="blue" title="蓝色主题"></button>
    </div>
  </div>
</header>

<!-- Purchase Channels Bar -->
<div class="purchase-bar">
  <span class="purchase-bar-label">购买渠道：</span>
  <div id="channelList">
    <span class="channel-tag">同花顺 <span class="remove" data-channel="同花顺">&times;</span></span>
    <span class="channel-tag">东方财富 <span class="remove" data-channel="东方财富">&times;</span></span>
    <span class="channel-tag">雪球 <span class="remove" data-channel="雪球">&times;</span></span>
  </div>
  <button class="add-channel-btn" id="addChannelBtn">+ 添加渠道</button>
</div>

<!-- Market Overview -->
<section class="market-overview" id="marketOverview"></section>

<!-- Filter Bar -->
<div class="filter-bar">
  <div class="filter-group">
    <span class="filter-label">涨跌筛选：</span>
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn highlight-up" data-filter="up">大涨 (&gt;3%)</button>
    <button class="filter-btn highlight-down" data-filter="down">大跌 (&lt;-3%)</button>
  </div>
  <div class="filter-group">
    <span class="filter-label">板块：</span>
    <button class="filter-btn active" data-sector="all">全部</button>
    <button class="filter-btn" data-sector="tech">科技</button>
    <button class="filter-btn" data-sector="finance">金融</button>
    <button class="filter-btn" data-sector="consumer">消费</button>
    <button class="filter-btn" data-sector="energy">能源</button>
  </div>
  <input class="search-input" id="searchInput" placeholder="搜索股票名称/代码...">
</div>

<!-- Main Content -->
<div class="main-content">
  <!-- Stock List -->
  <div class="stock-list-panel">
    <div class="stock-list-header">
      <span>股票名称</span>
      <span style="text-align:right">最新价</span>
      <span style="text-align:right">涨跌幅</span>
    </div>
    <div class="stock-list" id="stockList"></div>
  </div>

  <!-- Chart Panel -->
  <div class="chart-panel">
    <div class="chart-header">
      <div class="chart-stock-info">
        <span class="chart-stock-name" id="chartStockName">--</span>
        <span class="chart-stock-price" id="chartStockPrice">--</span>
        <span class="chart-stock-change" id="chartStockChange">--</span>
      </div>
      <div class="chart-period-btns">
        <button class="period-btn" data-period="1m">分时</button>
        <button class="period-btn active" data-period="1d">日K</button>
        <button class="period-btn" data-period="1w">周K</button>
        <button class="period-btn" data-period="1M">月K</button>
      </div>
    </div>
    <div class="chart-container" id="mainChart"></div>
    <div class="stock-detail-row" id="stockDetail">
      <div class="detail-item"><span class="detail-label">今开</span><span class="detail-value" id="dOpen">--</span></div>
      <div class="detail-item"><span class="detail-label">最高</span><span class="detail-value" id="dHigh">--</span></div>
      <div class="detail-item"><span class="detail-label">最低</span><span class="detail-value" id="dLow">--</span></div>
      <div class="detail-item"><span class="detail-label">成交量</span><span class="detail-value" id="dVol">--</span></div>

      <div class="detail-item"><span class="detail-label">换手率</span><span class="detail-value" id="dTurnover">--</span></div>
      <div class="detail-item"><span class="detail-label">市盈率</span><span class="detail-value" id="dPE">--</span></div>
      <div class="detail-item"><span class="detail-label">市值</span><span class="detail-value" id="dCap">--</span></div>
    </div>
  </div>
</div>

<!-- Add Channel Modal -->
<div class="modal-overlay" id="channelModal">
  <div class="modal">
    <h3>添加购买渠道</h3>
    <input type="text" id="channelInput" placeholder="请输入渠道名称，如：富途牛牛">
    <div class="modal-actions">
      <button class="modal-btn" id="cancelChannel">取消</button>
      <button class="modal-btn primary" id="confirmChannel">添加</button>
    </div>
  </div>
</div>
