  <script type="text/babel">
    const FadingVideo = ({ src, className, style }) => {
      const videoRef = React.useRef(null);
      const rafRef = React.useRef(null);
      const fadingOutRef = React.useRef(false);

      const FADE_MS = 500;

      const fadeTo = (target, duration) => {
        const video = videoRef.current;
        if (!video) return;
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        const startOpacity = parseFloat(video.style.opacity) || 0;
        const startTime = performance.now();
        const delta = target - startOpacity;

        const step = (now) => {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          video.style.opacity = startOpacity + delta * progress;
          if (progress < 1) {
            rafRef.current = requestAnimationFrame(step);
          } else {
            rafRef.current = null;
          }
        };

        rafRef.current = requestAnimationFrame(step);
      };

      React.useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        video.style.opacity = 0;

        const handleLoadedData = () => {
          video.style.opacity = 0;
          video.play();
          fadeTo(1, FADE_MS);
        };

        const handleTimeUpdate = () => {
          const remaining = video.duration - video.currentTime;
          if (!fadingOutRef.current && remaining <= 0.55 && remaining > 0) {
            fadingOutRef.current = true;
            fadeTo(0, FADE_MS);
          }
        };

        const handleEnded = () => {
          video.style.opacity = 0;
          setTimeout(() => {
            video.currentTime = 0;
            video.play();
            fadingOutRef.current = false;
            fadeTo(1, FADE_MS);
          }, 100);
        };

        video.addEventListener('loadeddata', handleLoadedData, { once: true });
        video.addEventListener('timeupdate', handleTimeUpdate);
        video.addEventListener('ended', handleEnded);

        if (video.readyState >= 2) {
          handleLoadedData();
        }

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          video.removeEventListener('loadeddata', handleLoadedData);
          video.removeEventListener('timeupdate', handleTimeUpdate);
          video.removeEventListener('ended', handleEnded);
        };
      }, [src]);

      return (
        <video
          ref={videoRef}
          src={src}
          autoPlay
          muted
          playsInline
          preload="auto"
          className={className}
          style={style}
        />
      );
    };

    window.FadingVideo = FadingVideo;
  </script>

  <!-- BlurText.js -->
  <script type="text/babel">
    const { motion } = window.Motion;

    const BlurText = ({ text, className }) => {
      const ref = React.useRef(null);
      const [inView, setInView] = React.useState(false);

      React.useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setInView(true);
              observer.disconnect();
            }
          },
          { threshold: 0.1 }
        );
        observer.observe(el);
        return () => observer.disconnect();
      }, []);

      const words = text.split(' ');

      return (
        <p
          ref={ref}
          className={className}
          style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em' }}
        >
          {words.map((word, i) => (
            <motion.span
              key={i}
              initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
              animate={inView ? {
                filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
                opacity: [0, 0.5, 1],
                y: [50, -5, 0],
              } : { filter: 'blur(10px)', opacity: 0, y: 50 }}
              transition={{ duration: 0.7, times: [0, 0.5, 1], ease: 'easeOut', delay: (i * 100) / 1000 }}
              style={{ display: 'inline-block', marginRight: '0.28em' }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    };

    window.BlurText = BlurText;
  </script>
