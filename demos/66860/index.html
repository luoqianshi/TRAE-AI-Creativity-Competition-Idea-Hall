<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块 - 橘色主题</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --orange-100: #FFCC80;
            --orange-200: #FFB74D;
            --orange-300: #FFA726;
            --orange-400: #FF8C42;
            --orange-500: #FF6B35;
            --orange-600: #E65100;
            --dark-900: #1A1A1A;
            --dark-800: #2D2D2D;
            --dark-700: #404040;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1A1A1A 0%, #2D2D2D 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .game-board-wrapper {
            background: linear-gradient(145deg, #2D2D2D, #1A1A1A);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .game-title {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--orange-500), var(--orange-300));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255, 107, 53, 0.3);
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            background: var(--dark-900);
            padding: 10px;
            border-radius: 10px;
            border: 3px solid var(--orange-500);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .cell {
            width: 32px;
            height: 32px;
            background: var(--dark-800);
            border-radius: 4px;
            transition: all 0.1s ease;
        }

        .cell.filled {
            position: relative;
            border-radius: 4px;
            box-shadow: 
                inset 2px 2px 4px rgba(255, 255, 255, 0.3),
                inset -2px -2px 4px rgba(0, 0, 0, 0.3),
                0 2px 8px rgba(255, 107, 53, 0.4);
        }

        .cell.filled::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            right: 3px;
            bottom: 3px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), transparent);
            border-radius: 2px;
        }

        .cell.clear-animation {
            animation: clearLine 0.3s ease-out forwards;
        }

        @keyframes clearLine {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); background: white; }
            100% { transform: scale(0); opacity: 0; }
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-card {
            background: linear-gradient(145deg, #2D2D2D, #1A1A1A);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 2px solid var(--dark-700);
        }

        .panel-title {
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--orange-300);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .panel-value {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 900;
            color: var(--orange-500);
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.5);
        }

        .panel-value.score-bump {
            animation: scoreBump 0.3s ease-out;
        }

        @keyframes scoreBump {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        #next-piece {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
            padding: 15px;
            background: var(--dark-900);
            border-radius: 10px;
            justify-content: center;
        }

        .next-cell {
            width: 24px;
            height: 24px;
            background: var(--dark-800);
            border-radius: 3px;
        }

        .next-cell.filled {
            position: relative;
            border-radius: 3px;
            box-shadow: 
                inset 1px 1px 2px rgba(255, 255, 255, 0.3),
                inset -1px -1px 2px rgba(0, 0, 0, 0.3),
                0 1px 4px rgba(255, 107, 53, 0.4);
        }

        .next-cell.filled::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), transparent);
            border-radius: 2px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--orange-500), var(--orange-400));
            color: white;
            box-shadow: 
                0 4px 15px rgba(255, 107, 53, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 20px rgba(255, 107, 53, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--dark-700);
            color: var(--orange-300);
            border: 2px solid var(--orange-500);
        }

        .btn-secondary:hover {
            background: var(--dark-800);
            border-color: var(--orange-400);
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .d-pad-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(145deg, var(--dark-700), var(--dark-800));
            border: 2px solid var(--orange-500);
            border-radius: 10px;
            color: var(--orange-400);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .d-pad-btn:hover {
            background: var(--orange-500);
            color: white;
        }

        .d-pad-btn:active {
            transform: scale(0.95);
        }

        .d-pad-btn.empty {
            visibility: hidden;
        }

        .instructions {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--dark-700);
        }

        .instruction-item {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .key {
            display: inline-block;
            background: var(--dark-700);
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            color: var(--orange-300);
            border: 1px solid var(--dark-700);
        }

        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .game-over-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .game-over-modal {
            background: linear-gradient(145deg, #2D2D2D, #1A1A1A);
            padding: 50px;
            border-radius: 25px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s ease;
            border: 3px solid var(--orange-500);
            box-shadow: 0 30px 80px rgba(255, 107, 53, 0.3);
        }

        .game-over-overlay.active .game-over-modal {
            transform: scale(1);
        }

        .game-over-title {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--orange-500);
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 107, 53, 0.5);
        }

        .game-over-score {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            color: var(--orange-300);
            margin-bottom: 10px;
        }

        .game-over-score-value {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 900;
            color: var(--orange-500);
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.5);
        }

        @media (max-width: 768px) {
            .cell {
                width: 26px;
                height: 26px;
            }
            
            .game-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-board-wrapper">
            <h1 class="game-title">🎮 TETRIS</h1>
            <div id="game-board"></div>
        </div>

        <div class="side-panel">
            <div class="panel-card">
                <div class="panel-title">分数</div>
                <div class="panel-value" id="score">0</div>
            </div>

            <div class="panel-card">
                <div class="panel-title">行数</div>
                <div class="panel-value" id="lines">0</div>
            </div>

            <div class="panel-card">
                <div class="panel-title">等级</div>
                <div class="panel-value" id="level">1</div>
            </div>

            <div class="panel-card">
                <div class="panel-title">下一个</div>
                <div id="next-piece"></div>
            </div>

            <div class="panel-card">
                <div class="panel-title">控制</div>
                <div class="controls">
                    <button class="btn btn-primary" id="start-btn">开始游戏</button>
                    <button class="btn btn-secondary" id="pause-btn">暂停</button>
                    
                    <div class="d-pad">
                        <div class="d-pad-btn empty"></div>
                        <button class="d-pad-btn" id="rotate-btn">↻</button>
                        <div class="d-pad-btn empty"></div>
                        <button class="d-pad-btn" id="left-btn">←</button>
                        <button class="d-pad-btn" id="down-btn">↓</button>
                        <button class="d-pad-btn" id="right-btn">→</button>
                    </div>

                    <div class="instructions">
                        <div class="instruction-item">
                            <span class="key">←→</span> 移动
                        </div>
                        <div class="instruction-item">
                            <span class="key">↑</span> 旋转
                        </div>
                        <div class="instruction-item">
                            <span class="key">↓</span> 加速
                        </div>
                        <div class="instruction-item">
                            <span class="key">空格</span> 直接下落
                        </div>
                        <div class="instruction-item">
                            <span class="key">P</span> 暂停
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="game-over-overlay" id="game-over">
        <div class="game-over-modal">
            <div class="game-over-title">游戏结束!</div>
            <div class="game-over-score">最终分数</div>
            <div class="game-over-score-value" id="final-score">0</div>
            <button class="btn btn-primary" id="restart-btn">再来一局</button>
        </div>
    </div>

    <script>
const COLS = 10;
const ROWS = 20;

const COLORS = [
    '#FF6B35',
    '#FF8C42',
    '#FFA726',
    '#FFB74D',
    '#FFCC80',
    '#E65100',
    '#FF9800'
];

const SHAPES = {
    I: [[1, 1, 1, 1]],
    O: [[1, 1], [1, 1]],
    T: [[0, 1, 0], [1, 1, 1]],
    S: [[0, 1, 1], [1, 1, 0]],
    Z: [[1, 1, 0], [0, 1, 1]],
    J: [[1, 0, 0], [1, 1, 1]],
    L: [[0, 0, 1], [1, 1, 1]]
};

let grid = [];
let currentPiece = null;
let nextPiece = null;
let score = 0;
let lines = 0;
let level = 1;
let isPlaying = false;
let isPaused = false;
let gameInterval = null;

const gameBoard = document.getElementById('game-board');
const nextPieceDisplay = document.getElementById('next-piece');
const scoreDisplay = document.getElementById('score');
const linesDisplay = document.getElementById('lines');
const levelDisplay = document.getElementById('level');
const gameOverOverlay = document.getElementById('game-over');
const finalScoreDisplay = document.getElementById('final-score');
const startBtn = document.getElementById('start-btn');
const pauseBtn = document.getElementById('pause-btn');
const restartBtn = document.getElementById('restart-btn');
const rotateBtn = document.getElementById('rotate-btn');
const leftBtn = document.getElementById('left-btn');
const rightBtn = document.getElementById('right-btn');
const downBtn = document.getElementById('down-btn');

function initGrid() {
    grid = [];
    for (let row = 0; row < ROWS; row++) {
        grid[row] = [];
        for (let col = 0; col < COLS; col++) {
            grid[row][col] = null;
        }
    }
}

function createBoard() {
    gameBoard.innerHTML = '';
    for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.row = row;
            cell.dataset.col = col;
            gameBoard.appendChild(cell);
        }
    }
}

function createNextPieceDisplay() {
    nextPieceDisplay.innerHTML = '';
    for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 4; col++) {
            const cell = document.createElement('div');
            cell.className = 'next-cell';
            cell.dataset.row = row;
            cell.dataset.col = col;
            nextPieceDisplay.appendChild(cell);
        }
    }
}

function getRandomPiece() {
    const types = Object.keys(SHAPES);
    const type = types[Math.floor(Math.random() * types.length)];
    return {
        type,
        shape: SHAPES[type].map(row => [...row]),
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        x: Math.floor(COLS / 2) - Math.floor(SHAPES[type][0].length / 2),
        y: 0
    };
}

function rotate(shape) {
    const rows = shape.length;
    const cols = shape[0].length;
    const rotated = [];
    for (let col = 0; col < cols; col++) {
        rotated[col] = [];
        for (let row = rows - 1; row >= 0; row--) {
            rotated[col].push(shape[row][col]);
        }
    }
    return rotated;
}

function isValidMove(piece, offsetX = 0, offsetY = 0, newShape = null) {
    const shape = newShape || piece.shape;
    for (let row = 0; row < shape.length; row++) {
        for (let col = 0; col < shape[row].length; col++) {
            if (shape[row][col]) {
                const newX = piece.x + col + offsetX;
                const newY = piece.y + row + offsetY;
                if (newX < 0 || newX >= COLS || newY >= ROWS) {
                    return false;
                }
                if (newY >= 0 && grid[newY][newX]) {
                    return false;
                }
            }
        }
    }
    return true;
}

function lockPiece() {
    for (let row = 0; row < currentPiece.shape.length; row++) {
        for (let col = 0; col < currentPiece.shape[row].length; col++) {
            if (currentPiece.shape[row][col]) {
                const y = currentPiece.y + row;
                const x = currentPiece.x + col;
                if (y >= 0) {
                    grid[y][x] = currentPiece.color;
                }
            }
        }
    }
    clearLines();
    spawnPiece();
}

function clearLines() {
    let linesCleared = 0;
    const rowsToClear = [];

    for (let row = ROWS - 1; row >= 0; row--) {
        if (grid[row].every(cell => cell !== null)) {
            rowsToClear.push(row);
            linesCleared++;
        }
    }

    if (linesCleared > 0) {
        rowsToClear.forEach(row => {
            for (let col = 0; col < COLS; col++) {
                const cell = gameBoard.children[row * COLS + col];
                cell.classList.add('clear-animation');
            }
        });

        setTimeout(() => {
            rowsToClear.sort((a, b) => b - a);
            rowsToClear.forEach(row => {
                grid.splice(row, 1);
            });
            for (let i = 0; i < linesCleared; i++) {
                grid.unshift(Array(COLS).fill(null));
            }

            lines += linesCleared;
            score += [0, 100, 300, 500, 800][linesCleared] * level;
            level = Math.floor(lines / 10) + 1;
            
            updateDisplay();
            render();

            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, getSpeed());
            }
        }, 300);
    }
}

function spawnPiece() {
    currentPiece = nextPiece || getRandomPiece();
    nextPiece = getRandomPiece();
    currentPiece.x = Math.floor(COLS / 2) - Math.floor(currentPiece.shape[0].length / 2);
    currentPiece.y = 0;

    if (!isValidMove(currentPiece)) {
        gameOver();
    }

    renderNextPiece();
}

function render() {
    const cells = gameBoard.children;
    
    for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
            const cell = cells[row * COLS + col];
            cell.classList.remove('filled');
            cell.classList.remove('clear-animation');
            cell.style.background = '';
            
            if (grid[row][col]) {
                cell.classList.add('filled');
                cell.style.background = grid[row][col];
            }
        }
    }

    if (currentPiece) {
        for (let row = 0; row < currentPiece.shape.length; row++) {
            for (let col = 0; col < currentPiece.shape[row].length; col++) {
                if (currentPiece.shape[row][col]) {
                    const y = currentPiece.y + row;
                    const x = currentPiece.x + col;
                    if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
                        const cell = cells[y * COLS + x];
                        cell.classList.add('filled');
                        cell.style.background = currentPiece.color;
                    }
                }
            }
        }
    }
}

function renderNextPiece() {
    const cells = nextPieceDisplay.children;
    
    for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 4; col++) {
            const cell = cells[row * 4 + col];
            cell.classList.remove('filled');
            cell.style.background = '';
        }
    }

    if (nextPiece) {
        const offsetX = Math.floor((4 - nextPiece.shape[0].length) / 2);
        const offsetY = Math.floor((4 - nextPiece.shape.length) / 2);
        
        for (let row = 0; row < nextPiece.shape.length; row++) {
            for (let col = 0; col < nextPiece.shape[row].length; col++) {
                if (nextPiece.shape[row][col]) {
                    const cell = cells[(row + offsetY) * 4 + (col + offsetX)];
                    if (cell) {
                        cell.classList.add('filled');
                        cell.style.background = nextPiece.color;
                    }
                }
            }
        }
    }
}

function updateDisplay() {
    scoreDisplay.textContent = score;
    linesDisplay.textContent = lines;
    levelDisplay.textContent = level;
    
    scoreDisplay.classList.add('score-bump');
    setTimeout(() => scoreDisplay.classList.remove('score-bump'), 300);
}

function getSpeed() {
    return Math.max(100, 1000 - (level - 1) * 100);
}

function gameLoop() {
    if (!isPaused && isValidMove(currentPiece, 0, 1)) {
        currentPiece.y++;
    } else if (!isPaused) {
        lockPiece();
    }
    render();
}

function moveLeft() {
    if (isPlaying && !isPaused && isValidMove(currentPiece, -1, 0)) {
        currentPiece.x--;
        render();
    }
}

function moveRight() {
    if (isPlaying && !isPaused && isValidMove(currentPiece, 1, 0)) {
        currentPiece.x++;
        render();
    }
}

function moveDown() {
    if (isPlaying && !isPaused) {
        if (isValidMove(currentPiece, 0, 1)) {
            currentPiece.y++;
            score += 1;
            updateDisplay();
        } else {
            lockPiece();
        }
        render();
    }
}

function hardDrop() {
    if (isPlaying && !isPaused) {
        while (isValidMove(currentPiece, 0, 1)) {
            currentPiece.y++;
            score += 2;
        }
        updateDisplay();
        lockPiece();
        render();
    }
}

function rotatePiece() {
    if (isPlaying && !isPaused) {
        const rotated = rotate(currentPiece.shape);
        if (isValidMove(currentPiece, 0, 0, rotated)) {
            currentPiece.shape = rotated;
            render();
        } else if (isValidMove(currentPiece, 1, 0, rotated)) {
            currentPiece.x++;
            currentPiece.shape = rotated;
            render();
        } else if (isValidMove(currentPiece, -1, 0, rotated)) {
            currentPiece.x--;
            currentPiece.shape = rotated;
            render();
        }
    }
}

function startGame() {
    initGrid();
    score = 0;
    lines = 0;
    level = 1;
    isPlaying = true;
    isPaused = false;
    
    updateDisplay();
    gameOverOverlay.classList.remove('active');
    startBtn.textContent = '重新开始';
    pauseBtn.textContent = '暂停';
    
    spawnPiece();
    render();
    
    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, getSpeed());
}

function togglePause() {
    if (!isPlaying) return;
    isPaused = !isPaused;
    pauseBtn.textContent = isPaused ? '继续' : '暂停';
}

function gameOver() {
    isPlaying = false;
    if (gameInterval) {
        clearInterval(gameInterval);
        gameInterval = null;
    }
    finalScoreDisplay.textContent = score;
    gameOverOverlay.classList.add('active');
}

document.addEventListener('keydown', (e) => {
    switch (e.key) {
        case 'ArrowLeft':
            e.preventDefault();
            moveLeft();
            break;
        case 'ArrowRight':
            e.preventDefault();
            moveRight();
            break;
        case 'ArrowDown':
            e.preventDefault();
            moveDown();
            break;
        case 'ArrowUp':
            e.preventDefault();
            rotatePiece();
            break;
        case ' ':
            e.preventDefault();
            hardDrop();
            break;
        case 'p':
        case 'P':
            e.preventDefault();
            togglePause();
            break;
    }
});
