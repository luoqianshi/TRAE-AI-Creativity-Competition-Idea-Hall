<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>头像烟花秀</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        #canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 底部控制栏 */
        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 0 20px;
            z-index: 100;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 上传按钮 */
        .upload-btn {
            position: relative;
            width: 80px;
            height: 80px;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .upload-btn:hover {
            border-color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.1);
        }

        .upload-btn .icon {
            font-size: 28px;
            color: rgba(255, 255, 255, 0.7);
        }

        .upload-btn .text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        .upload-btn input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* 头像选择器 */
        .avatar-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            max-width: 500px;
        }

        .scroll-btn {
            width: 32px;
            height: 80px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .scroll-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .avatar-scroll-container {
            flex: 1;
            overflow: hidden;
            border-radius: 12px;
        }

        .avatar-list {
            display: flex;
            gap: 10px;
            padding: 5px;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }

        .avatar-list::-webkit-scrollbar {
            display: none;
        }

        .avatar-item {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .avatar-item:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .avatar-item.active {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            transform: scale(1.1);
        }

        /* 发射按钮 */
        .launch-btn {
            width: 100px;
            height: 80px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(238, 90, 36, 0.4);
        }

        .launch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(238, 90, 36, 0.6);
        }

        .launch-btn:active {
            transform: translateY(0);
        }

        .launch-btn .icon {
            font-size: 28px;
        }

        /* 标题 */
        .title {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            z-index: 100;
            pointer-events: none;
        }

        /* 提示文字 */
        .hint {
            position: fixed;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="title">头像烟花秀</div>
    <div class="hint">选择头像或上传照片，点击发射按钮</div>

    <canvas id="canvas"></canvas>

    <div class="controls">
        <div class="upload-btn" id="uploadBtn">
            <span class="icon">+</span>
            <span class="text">上传</span>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="avatar-selector">
            <button class="scroll-btn" id="scrollLeft">&#9664;</button>
            <div class="avatar-scroll-container">
                <div class="avatar-list" id="avatarList"></div>
            </div>
            <button class="scroll-btn" id="scrollRight">&#9654;</button>
        </div>

        <button class="launch-btn" id="launchBtn">
            <span class="icon">&#128640;</span>
            <span>发射</span>
        </button>
    </div>

    <script>
        // ==================== 配置 ====================
        const CONFIG = {
            maxParticles: 1500,
            avatarParseSize: 80,
            gravity: 0.12,
            trailLength: 20,
            launchSpeed: 5,
            launchAcceleration: 1.025
        };

        // ==================== Canvas 设置 ====================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // ==================== 音效管理器 ====================
        class SoundManager {
            constructor() {
                this.sounds = {};
                this.enabled = true;
                this.initialized = false;
            }

            preload() {
                const soundMap = {
                    launch: 'assets/sounds/launch.mp3',
                    explode: 'assets/sounds/explode.mp3',
                    fire: 'assets/sounds/fire.mp3',
                    cihua: 'assets/sounds/cihua.mp3',
                    jiatelin: 'assets/sounds/jiatelin.mp3',
                    whistle: 'assets/sounds/whistle.mp3'
                };

                Object.entries(soundMap).forEach(([name, src]) => {
                    const audio = new Audio();
                    audio.src = src;
                    audio.preload = 'auto';
                    this.sounds[name] = audio;
                });
            }

            init() {
                if (this.initialized) return;
                this.initialized = true;
                // 播放一个静音来解锁音频上下文
                Object.values(this.sounds).forEach(audio => {
                    audio.volume = 0;
                    audio.play().catch(() => {});
                    audio.pause();
                    audio.currentTime = 0;
                    audio.volume = 1;
                });
            }

            play(name, volume = 1.0) {
                if (!this.enabled || !this.sounds[name]) return;
                const clone = this.sounds[name].cloneNode();
                clone.volume = volume;
                clone.play().catch(e => console.warn('Audio play failed:', e));
            }
        }

        const soundManager = new SoundManager();
        soundManager.preload();

        // ==================== 头像像素解析器 ====================
        class AvatarPixelParser {
            constructor() {
                this.offscreenCanvas = document.createElement('canvas');
                this.offscreenCtx = this.offscreenCanvas.getContext('2d');
            }

            async loadImage(src) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = src;
                });
            }

            async parseAvatar(src, maxParticles = CONFIG.maxParticles) {
                const img = await this.loadImage(src);

                const targetSize = CONFIG.avatarParseSize;
                const scale = targetSize / Math.max(img.width, img.height);
                const w = Math.floor(img.width * scale);
                const h = Math.floor(img.height * scale);

                this.offscreenCanvas.width = w;
                this.offscreenCanvas.height = h;
                this.offscreenCtx.clearRect(0, 0, w, h);
                this.offscreenCtx.drawImage(img, 0, 0, w, h);

                const imageData = this.offscreenCtx.getImageData(0, 0, w, h);
                const pixels = imageData.data;

                const particleData = [];

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const idx = (y * w + x) * 4;
                        const r = pixels[idx];
                        const g = pixels[idx + 1];
                        const b = pixels[idx + 2];
                        const a = pixels[idx + 3];

                        // 过滤透明像素和白色背景
                        if (a > 128 && !(r > 245 && g > 245 && b > 245)) {
                            particleData.push({ x, y, r, g, b });
                        }
                    }
                }

                // 均匀采样控制粒子数量
                if (particleData.length > maxParticles) {
                    const step = Math.ceil(particleData.length / maxParticles);
                    return particleData.filter((_, i) => i % step === 0);
                }

                return particleData;
            }
        }

        const avatarParser = new AvatarPixelParser();

        // ==================== 烟花类（升空阶段） ====================
        class Firework {
            constructor(startX, startY, targetX, targetY) {
                this.x = startX;
                this.y = startY;
                this.startX = startX;
                this.startY = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.speed = CONFIG.launchSpeed;
                this.acceleration = CONFIG.launchAcceleration;
                this.angle = Math.atan2(targetY - startY, targetX - startX);
                this.trail = [];
                this.trailLength = CONFIG.trailLength;
                this.dead = false;
                this.hue = Math.random() * 360;
                this.sparkles = []; // 尾迹火花粒子
                this.sparks = []; // 快速飞行的火花
                this.smoke = []; // 烟雾粒子
                this.trailTime = 0;
            }

            update() {
                this.trailTime++;

                // 记录尾迹点
                this.trail.push({ x: this.x, y: this.y, size: 3 + Math.random() * 2 });
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }

                // 生成尾迹火花 - 从烟花后方喷出
                const backX = this.x - Math.cos(this.angle) * 5;
                const backY = this.y - Math.sin(this.angle) * 5;

                for (let i = 0; i < 3; i++) {
                    const spread = (Math.random() - 0.5) * 1.5;
                    this.sparkles.push({
                        x: backX + (Math.random() - 0.5) * 8,
                        y: backY + (Math.random() - 0.5) * 8,
                        vx: -Math.cos(this.angle + spread) * (2 + Math.random() * 3),
                        vy: -Math.sin(this.angle + spread) * (2 + Math.random() * 3),
                        alpha: 1,
                        decay: 0.04 + Math.random() * 0.03,
                        hue: this.hue + (Math.random() - 0.5) * 50,
                        size: 1.5 + Math.random() * 2
                    });
                }

                // 生成快速火花
                if (Math.random() > 0.5) {
                    this.sparks.push({
                        x: this.x,
                        y: this.y,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8 + 2,
                        alpha: 1,
                        decay: 0.1,
                        hue: this.hue + (Math.random() - 0.5) * 30,
                        size: 0.5 + Math.random()
                    });
                }

                // 生成烟雾
                if (Math.random() > 0.6) {
                    this.smoke.push({
                        x: backX,
                        y: backY,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: -0.5 - Math.random() * 0.5,
                        alpha: 0.3,
                        size: 4 + Math.random() * 4
                    });
                }

                // 更新火花
                for (let i = this.sparkles.length - 1; i >= 0; i--) {
                    const s = this.sparkles[i];
                    s.x += s.vx;
                    s.y += s.vy;
                    s.vx *= 0.95;
                    s.vy *= 0.95;
                    s.vy -= 0.1; // 轻微向上飘
                    s.alpha -= s.decay;
                    if (s.alpha <= 0) {
                        this.sparkles.splice(i, 1);
                    }
                }

                // 更新快速火花
                for (let i = this.sparks.length - 1; i >= 0; i--) {
                    const s = this.sparks[i];
                    s.x += s.vx;
                    s.y += s.vy;
                    s.vy += 0.1;
                    s.alpha -= s.decay;
                    if (s.alpha <= 0) {
                        this.sparks.splice(i, 1);
                    }
                }

                // 更新烟雾
                for (let i = this.smoke.length - 1; i >= 0; i--) {
                    const s = this.smoke[i];
                    s.x += s.vx;
                    s.y += s.vy;
                    s.size += 0.3;
                    s.alpha -= 0.008;
                    if (s.alpha <= 0) {
                        this.smoke.splice(i, 1);
                    }
                }

                // 物理移动
                this.speed *= this.acceleration;
                const vx = Math.cos(this.angle) * this.speed;
                const vy = Math.sin(this.angle) * this.speed;

                const dist = Math.hypot(this.targetX - this.x, this.targetY - this.y);
                if (dist < this.speed * 2) {
                    this.dead = true;
                    return true;
                }

                this.x += vx;
                this.y += vy;
                return false;
            }

            draw(ctx) {
                // 绘制烟雾（最底层）
                this.smoke.forEach(s => {
                    ctx.save();
                    ctx.globalAlpha = s.alpha;
                    ctx.fillStyle = 'rgba(200, 200, 200, 0.5)';
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // 绘制渐变尾迹
                if (this.trail.length > 1) {
                    for (let i = 1; i < this.trail.length; i++) {
                        const point = this.trail[i];
                        const prevPoint = this.trail[i - 1];
                        const alpha = (i / this.trail.length) * 0.8;
                        const width = (i / this.trail.length) * 4;

                        ctx.beginPath();
                        ctx.moveTo(prevPoint.x, prevPoint.y);
                        ctx.lineTo(point.x, point.y);
                        ctx.strokeStyle = `hsla(${this.hue}, 100%, 65%, ${alpha})`;
                        ctx.lineWidth = width;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    }
                }

                // 绘制尾迹火花
                this.sparkles.forEach(s => {
                    ctx.save();
                    ctx.globalAlpha = s.alpha;
                    ctx.fillStyle = `hsla(${s.hue}, 100%, 70%, 1)`;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = `hsla(${s.hue}, 100%, 50%, 0.8)`;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // 绘制快速火花
                this.sparks.forEach(s => {
                    ctx.save();
                    ctx.globalAlpha = s.alpha;
                    ctx.fillStyle = `hsla(${s.hue}, 100%, 90%, 1)`;
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = '#fff';
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // 绘制头部光点（带多层发光）
                ctx.save();
                ctx.globalAlpha = 0.9;

                // 外层光晕
                ctx.fillStyle = `hsla(${this.hue}, 100%, 50%, 0.2)`;
                ctx.shadowBlur = 25;
                ctx.shadowColor = `hsla(${this.hue}, 100%, 50%, 0.6)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 10, 0, Math.PI * 2);
                ctx.fill();

                // 中层
                ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, 0.5)`;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
                ctx.fill();

                // 核心
                ctx.fillStyle = `hsla(${this.hue}, 100%, 85%, 1)`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#fff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // ==================== 粒子类（爆炸阶段）- 真实烟花效果 ====================
        class Particle {
            constructor(x, y, vx, vy, color, life, size) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = life;
                this.maxLife = life;
                this.size = size || 2;
                this.alpha = 1;
                this.trail = [];
            }

            isAlive() {
                return this.life > 0;
            }
        }

        // ==================== 物理引擎 ====================
        class PhysicsEngine {
            static updateParticles(particles, gravity) {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }

                    // 真实烟花物理：重力 + 摩擦 + 燃烧衰减
                    // 速度逐渐减小（空气阻力）
                    p.vx *= 0.985;
                    p.vy *= 0.985;

                    // 重力影响（烟花向上飘一段，然后下落）
                    p.vy += gravity;

                    // 位置更新
                    p.x += p.vx;
                    p.y += p.vy;

                    // 生命周期递减（燃烧殆尽）
                    p.life--;

                    // 燃烧衰减：前半程亮，后半程逐渐变暗
                    const lifeRatio = p.life / p.maxLife;
                    if (lifeRatio < 0.5) {
                        // 后半程透明度快速衰减
                        p.alpha = lifeRatio * 2;
                    } else {
                        // 前半程全亮
                        p.alpha = 1;
                    }

                    // 轨迹记录
                    p.trail.unshift({ x: this.x, y: this.y });
                    if (p.trail.length > 5) p.trail.pop();

                    if (p.life <= 0) {
                        particles.splice(i, 1);
                    }
                }
            }
        }

        // ==================== 粒子工厂 ====================
        class ParticleFactory {
            // 创建爆炸粒子（从中心向外爆发）
            static createExplosion(cx, cy, count, color, speedRange = [3, 8]) {
                const particles = [];
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = speedRange[0] + Math.random() * (speedRange[1] - speedRange[0]);
                    const life = 40 + Math.random() * 30;

                    particles.push(new Particle(
                        cx + (Math.random() - 0.5) * 10,
                        cy + (Math.random() - 0.5) * 10,
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed - 2,
                        color,
                        life,
                        2
                    ));
                }
                return particles;
            }
        }

        // ==================== 闪光效果 ====================
        class Flash {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = 10;
                this.alpha = 1;
                this.dead = false;
                this.phase = 0;
            }

            update() {
                this.phase++;
                // 快速扩散
                this.radius += 15;
                this.alpha -= 0.03;
                if (this.alpha <= 0) {
                    this.dead = true;
                }
                return this.dead;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha;

                // 核心白光
                const coreGradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius * 0.5
                );
                coreGradient.addColorStop(0, `rgba(255, 255, 255, ${this.alpha})`);
                coreGradient.addColorStop(1, 'rgba(255, 255, 200, 0)');
                ctx.fillStyle = coreGradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
                ctx.fill();

                // 外层彩色光晕
                const outerGradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius
                );
                outerGradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha * 0.6})`);
                outerGradient.addColorStop(0.7, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha * 0.2})`);
                outerGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = outerGradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // ==================== 全局状态 ====================
        const fireworks = [];
        const particles = [];
        const flashes = [];
        let currentAvatarSrc = null;
        let currentPixelData = null;
        let bgImage = null;

        // 加载背景图
        function loadBgImage() {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    bgImage = img;
                    resolve();
                };
                img.onerror = () => resolve();
                img.src = 'assets/images/night.jpg';
            });
        }

        // ==================== 创建头像爆炸 ====================
        async function createAvatarExplosion(centerX, centerY, avatarSrc) {
            let pixelData = currentPixelData;

            if (!pixelData || currentAvatarSrc !== avatarSrc) {
                try {
                    pixelData = await avatarParser.parseAvatar(avatarSrc);
                    currentPixelData = pixelData;
                    currentAvatarSrc = avatarSrc;
                } catch (e) {
                    console.error('Parse avatar failed:', e);
                    return;
                }
            }

            if (!pixelData || pixelData.length === 0) return;

            // 播放爆炸音效
            soundManager.play('explode', 0.7);

            // 计算头像边界
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            pixelData.forEach(p => {
                minX = Math.min(minX, p.x);
                maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y);
                maxY = Math.max(maxY, p.y);
            });

            const avatarCenterX = (minX + maxX) / 2;
            const avatarCenterY = (minY + maxY) / 2;

            // 创建闪光
            const avgColor = pixelData[Math.floor(pixelData.length / 2)];
            flashes.push(new Flash(centerX, centerY, avgColor));

            // 缩放比例 - 控制头像大小
            const scale = 4;

            // 创建轮廓粒子
            // 粒子从中心爆炸，向着头像轮廓的各个位置飞散
            pixelData.forEach(p => {
                const life = 120 + Math.random() * 40; // 生命周期
                const color = { r: p.r, g: p.g, b: p.b };

                // 目标位置（头像轮廓上的点）
                const targetX = centerX + (p.x - avatarCenterX) * scale;
                const targetY = centerY + (p.y - avatarCenterY) * scale;

                // 从中心到目标位置的方向
                const dx = targetX - centerX;
                const dy = targetY - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;

                // 初始爆发速度 - 向着目标方向快速炸开
                // 基础速度 + 随机扰动
                const baseSpeed = 6 + dist * 0.15; // 距离越远速度越大
                const speedX = (dx / dist) * baseSpeed + (Math.random() - 0.5) * 2;
                const speedY = (dy / dist) * baseSpeed + (Math.random() - 0.5) * 2 - 1; // 轻微向上

                const particle = new Particle(
                    centerX + (Math.random() - 0.5) * 8,
                    centerY + (Math.random() - 0.5) * 8,
                    speedX,
                    speedY,
                    color,
                    life,
                    2
                );

                particles.push(particle);
            });
        }

        // ==================== 发射烟花 ====================
        async function launchFirework() {
            if (!currentAvatarSrc) {
                alert('请先选择一个头像或上传照片！');
                return;
            }

            soundManager.init();
            soundManager.play('launch', 0.6);

            // 从底部中央区域发射
            const startX = width * 0.4 + Math.random() * width * 0.2;
            const startY = height + 20;
            const targetX = width * 0.2 + Math.random() * width * 0.6;
            const targetY = height * 0.15 + Math.random() * height * 0.3;

            const firework = new Firework(startX, startY, targetX, targetY);
            fireworks.push(firework);

            // 监听烟花到达目标
            const checkArrival = setInterval(() => {
                if (firework.dead) {
                    clearInterval(checkArrival);
                    createAvatarExplosion(targetX, targetY, currentAvatarSrc);
                }
            }, 16);
        }

        // ==================== 渲染循环 ====================
        function render() {
            requestAnimationFrame(render);

            // 绘制背景
            if (bgImage) {
                ctx.drawImage(bgImage, 0, 0, width, height);
            } else {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, width, height);
            }

            // 绘制拖尾效果
            ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
            ctx.fillRect(0, 0, width, height);

            // 更新绘制烟花
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const fw = fireworks[i];
                fw.update();
                fw.draw(ctx);
                if (fw.dead) {
                    fireworks.splice(i, 1);
                }
            }

            // 更新绘制闪光
            for (let i = flashes.length - 1; i >= 0; i--) {
                const flash = flashes[i];
                flash.update();
                flash.draw(ctx);
                if (flash.dead) {
                    flashes.splice(i, 1);
                }
            }

            // 使用物理引擎更新粒子
            PhysicsEngine.updateParticles(particles, CONFIG.gravity);

            // 绘制所有粒子
            particles.forEach(p => {
                if (p.alpha <= 0) return;

                ctx.save();

                // 绘制轨迹
                if (p.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(p.trail[0].x, p.trail[0].y);
                    for (let i = 1; i < p.trail.length; i++) {
                        ctx.lineTo(p.trail[i].x, p.trail[i].y);
                    }
                    ctx.strokeStyle = `rgba(${p.color.r || 255}, ${p.color.g || 255}, ${p.color.b || 255}, ${p.alpha * 0.3})`;
                    ctx.lineWidth = p.size * 0.5;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }

                // 绘制粒子
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = `rgb(${p.color.r || 255}, ${p.color.g || 255}, ${p.color.b || 255})`;
                ctx.shadowBlur = p.size * 2;
                ctx.shadowColor = `rgba(${p.color.r || 255}, ${p.color.g || 255}, ${p.color.b || 255}, 0.6)`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });
        }

        // ==================== UI 交互 ====================
        const avatarList = document.getElementById('avatarList');
        const fileInput = document.getElementById('fileInput');
        const launchBtn = document.getElementById('launchBtn');
        const scrollLeft = document.getElementById('scrollLeft');
        const scrollRight = document.getElementById('scrollRight');

        // 内置头像列表
        const builtInAvatars = [
            { name: 'dog', src: 'assets/avatars/dog.jpg' },
            { name: 'cat', src: 'assets/avatars/cat.jpg' },
            { name: 'bird', src: 'assets/avatars/bird.jpg' },
            { name: 'parrot', src: 'assets/avatars/parrot.jpg' },
            { name: 'tiger', src: 'assets/avatars/tiger.jpg' },
            { name: 'rabbit', src: 'assets/avatars/rabbit.jpg' },
            { name: 'panda', src: 'assets/avatars/panda.jpg' },
            { name: 'lion', src: 'assets/avatars/lion.jpg' },
            { name: 'fox', src: 'assets/avatars/fox.jpg' }
        ];

        // 渲染头像列表
        function renderAvatarList() {
            avatarList.innerHTML = '';
            builtInAvatars.forEach((avatar, index) => {
                const img = document.createElement('img');
                img.src = avatar.src;
                img.className = 'avatar-item';
                img.dataset.src = avatar.src;
                img.alt = avatar.name;
                if (index === 0) {
                    img.classList.add('active');
                    currentAvatarSrc = avatar.src;
                }
                img.addEventListener('click', () => selectAvatar(img, avatar.src));
                avatarList.appendChild(img);
            });
        }

        // 选择头像
        function selectAvatar(element, src) {
            document.querySelectorAll('.avatar-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');
            currentAvatarSrc = src;
            currentPixelData = null; // 清除缓存，下次重新解析
        }

        // 滚动头像列表
        scrollLeft.addEventListener('click', () => {
            avatarList.scrollBy({ left: -200, behavior: 'smooth' });
        });

        scrollRight.addEventListener('click', () => {
            avatarList.scrollBy({ left: 200, behavior: 'smooth' });
        });

        // 文件上传
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const dataUrl = event.target.result;

                // 创建上传的头像元素
                const img = document.createElement('img');
                img.src = dataUrl;
                img.className = 'avatar-item active';
                img.dataset.src = dataUrl;

                // 移除其他选中状态
                document.querySelectorAll('.avatar-item').forEach(item => {
                    item.classList.remove('active');
                });

                // 插入到列表开头
                avatarList.insertBefore(img, avatarList.firstChild);
                img.addEventListener('click', () => selectAvatar(img, dataUrl));

                currentAvatarSrc = dataUrl;
                currentPixelData = null;

                // 滚动到新头像
                avatarList.scrollTo({ left: 0, behavior: 'smooth' });
            };
            reader.readAsDataURL(file);
        });

        // 发射按钮
        launchBtn.addEventListener('click', () => {
            soundManager.init();
            launchFirework();
        });

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                launchFirework();
            }
        });

        // ==================== 初始化 ====================
        async function init() {
            await loadBgImage();
            renderAvatarList();
            render();
        }

        init();
    </script>
</body>
</html>
