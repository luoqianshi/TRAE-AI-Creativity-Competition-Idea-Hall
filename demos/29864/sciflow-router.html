<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SciFlow Router · 流水线工作台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f5f3ed;
    --ink: #1a1a1a;
    --ink-2: #1a3a5c;
    --ink-3: #2d5a3d;
    --accent: #c8553d;
    --line: #e0ddd5;
    --line-2: #ebe7dc;
    --paper: #ffffff;
    --paper-2: #fafaf6;
    --muted: #888;
    --muted-2: #c5c0b3;

    --c-paper: #1a3a5c;
    --c-experiment: #c8553d;
    --c-literature: #8a6f4e;
    --c-patent: #2d5a3d;
    --c-debug: #5d3a6a;
    --c-full: #8a6a2a;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(26,58,92,.35); } 50% { box-shadow: 0 0 0 8px rgba(26,58,92,0); } }
  @keyframes flowMove { 0% { background-position: 0 0; } 100% { background-position: 0 -200px; } }
  @keyframes tickerSlide { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
  @keyframes ringPulse { 0%,100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.3); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes routeDot { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }

  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 12% 22%, rgba(26, 58, 92, 0.05) 0%, transparent 50%),
      radial-gradient(circle at 88% 78%, rgba(200, 85, 61, 0.05) 0%, transparent 50%);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ============ Header ============ */
  header {
    flex-shrink: 0;
    padding: 14px 28px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 34px; height: 34px;
    border: 1.5px solid var(--ink-2);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-2);
    font-weight: 600;
    font-size: 0.78em;
    letter-spacing: 1px;
    position: relative;
  }
  .brand-mark::before {
    content: '';
    position: absolute;
    inset: -3px;
    border: 1px solid var(--ink-2);
    border-radius: 9px;
    opacity: 0.3;
    animation: ringPulse 2.4s infinite;
  }
  .brand h1 { font-size: 1.1em; color: var(--ink-2); font-weight: 500; letter-spacing: 3px; }
  .brand h1 strong { font-weight: 700; }
  .brand .sub { font-size: 0.68em; color: var(--muted); letter-spacing: 1.5px; margin-top: 1px; }

  .header-center {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .topic-chip {
    background: var(--paper-2);
    border: 1px solid var(--line);
    padding: 6px 14px;
    border-radius: 14px;
    color: var(--ink-2);
    font-size: 0.85em;
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .topic-chip.empty { color: var(--muted-2); font-style: italic; }
  .stat {
    display: flex; align-items: center; gap: 5px;
    font-size: 0.78em;
    color: var(--muted);
  }
  .stat .v { font-size: 1.3em; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .stat .v.run { color: var(--accent); }
  .stat .v.ok { color: var(--ink-3); }
  .stat-divider { width: 1px; height: 24px; background: var(--line-2); }

  .header-right { display: flex; gap: 8px; }
  .header-btn {
    background: var(--paper-2);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.82em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .header-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* ============ Main: Agent Stations ============ */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 22px 28px;
    min-height: 0;
  }
  .stations {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
  }
  .station {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    animation: fadeIn 0.4s ease both;
  }
  .station::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--muted-2);
    transition: background 0.3s, width 0.3s;
  }
  .station[data-key="paper"]::before { background: var(--c-paper); }
  .station[data-key="experiment"]::before { background: var(--c-experiment); }
  .station[data-key="literature"]::before { background: var(--c-literature); }
  .station[data-key="patent"]::before { background: var(--c-patent); }
  .station[data-key="debug"]::before { background: var(--c-debug); }
  .station[data-key="full"]::before { background: var(--c-full); }

  .station:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
  .station.running { border-color: var(--ink-2); }
  .station.running::before { width: 4px; }
  .station.paused::before { background: var(--accent) !important; }
  .station.completed { border-color: var(--ink-3); }
  .station.completed::before { background: var(--ink-3) !important; }
  .station.speaking { background: linear-gradient(180deg, #fff 0%, var(--paper-2) 100%); }

  .st-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
  }
  .st-icon {
    width: 32px; height: 32px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1em;
    background: var(--paper-2);
    flex-shrink: 0;
    transition: all 0.3s;
  }
  .station.running .st-icon {
    background: var(--ink-2);
    color: #fff;
  }
  .station.paused .st-icon {
    background: var(--accent);
    color: #fff;
  }
  .station.completed .st-icon {
    background: var(--ink-3);
    color: #fff;
  }
  .st-info { flex: 1; min-width: 0; }
  .st-name {
    font-weight: 600;
    color: var(--ink-2);
    font-size: 0.95em;
    letter-spacing: 0.5px;
  }
  .st-skill { font-size: 0.7em; color: var(--muted); margin-top: 1px; }
  .st-badge {
    font-size: 0.68em;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--line-2);
    color: var(--muted);
    font-weight: 500;
    white-space: nowrap;
  }
  .st-badge.running { background: rgba(26,58,92,0.1); color: var(--ink-2); }
  .st-badge.paused { background: rgba(200,85,61,0.12); color: var(--accent); }
  .st-badge.completed { background: rgba(45,90,61,0.1); color: var(--ink-3); }

  /* 阶段管线(垂直时间轴) */
  .pipeline {
    position: relative;
    padding: 4px 0 4px 24px;
    margin-bottom: 12px;
  }
  .pipeline::before {
    content: '';
    position: absolute;
    left: 9px; top: 12px; bottom: 12px;
    width: 1.5px;
    background: var(--line-2);
  }
  .p-node {
    position: relative;
    padding: 5px 0;
    font-size: 0.78em;
    color: var(--muted);
    cursor: default;
    transition: color 0.2s;
  }
  .p-node::before {
    content: '';
    position: absolute;
    left: -20px; top: 8px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--muted-2);
    transition: all 0.3s;
    z-index: 1;
  }
  .p-node.done::before {
    background: var(--ink-3);
    border-color: var(--ink-3);
  }
  .p-node.done { color: var(--ink-3); }
  .p-node.running::before {
    background: var(--ink-2);
    border-color: var(--ink-2);
    animation: pulse 1.5s infinite;
  }
  .p-node.running { color: var(--ink-2); font-weight: 500; }
  .p-node-label { display: flex; align-items: center; gap: 4px; }
  .p-node-detail { font-size: 0.85em; color: #aaa; margin-top: 1px; padding-left: 0; }

  /* 进度条 + 数据 */
  .st-progress {
    height: 4px;
    background: var(--line-2);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .st-bar-fill {
    height: 100%;
    background: var(--muted-2);
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .station[data-key="paper"] .st-bar-fill { background: var(--c-paper); }
  .station[data-key="experiment"] .st-bar-fill { background: var(--c-experiment); }
  .station[data-key="literature"] .st-bar-fill { background: var(--c-literature); }
  .station[data-key="patent"] .st-bar-fill { background: var(--c-patent); }
  .station[data-key="debug"] .st-bar-fill { background: var(--c-debug); }
  .station[data-key="full"] .st-bar-fill { background: var(--c-full); }
  .st-bar-fill.running {
    background-image: linear-gradient(90deg, currentColor 0%, currentColor 50%, transparent 50%, transparent 100%);
    background-size: 8px 100%;
    background-repeat: repeat-x;
    animation: flowMove 0.8s linear infinite;
  }
  .station.running[data-key="paper"] .st-bar-fill { background: var(--c-paper); }
  .station.running[data-key="experiment"] .st-bar-fill { background: var(--c-experiment); }
  .station.running[data-key="literature"] .st-bar-fill { background: var(--c-literature); }
  .station.running[data-key="patent"] .st-bar-fill { background: var(--c-patent); }
  .station.running[data-key="debug"] .st-bar-fill { background: var(--c-debug); }
  .station.running[data-key="full"] .st-bar-fill { background: var(--c-full); }

  .st-meta {
    display: flex; justify-content: space-between;
    font-size: 0.72em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-bottom: 10px;
  }
  .st-meta .pct { font-weight: 600; color: var(--ink-2); }
  .station[data-key="paper"] .st-meta .pct { color: var(--c-paper); }
  .station[data-key="experiment"] .st-meta .pct { color: var(--c-experiment); }
  .station[data-key="literature"] .st-meta .pct { color: var(--c-literature); }
  .station[data-key="patent"] .st-meta .pct { color: var(--c-patent); }
  .station[data-key="debug"] .st-meta .pct { color: var(--c-debug); }
  .station[data-key="full"] .st-meta .pct { color: var(--c-full); }

  .st-actions { display: flex; gap: 6px; }
  .st-btn {
    flex: 1;
    background: var(--paper-2);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 5px 8px;
    border-radius: 5px;
    font-size: 0.74em;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }
  .st-btn:hover { color: var(--ink-2); border-color: var(--ink-2); }
  .st-btn.warn { color: var(--accent); border-color: rgba(200,85,61,0.3); }
  .st-btn.warn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .st-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ============ Ticker ============ */
  .ticker-wrap {
    flex-shrink: 0;
    background: var(--ink-2);
    color: #fff;
    border-top: 1px solid var(--line);
    height: 36px;
    display: flex;
    align-items: center;
    overflow: hidden;
    position: relative;
  }
  .ticker-label {
    flex-shrink: 0;
    padding: 0 14px;
    background: rgba(255,255,255,0.08);
    height: 100%;
    display: flex;
    align-items: center;
    font-size: 0.72em;
    letter-spacing: 2px;
    border-right: 1px solid rgba(255,255,255,0.1);
  }
  .ticker {
    flex: 1;
    overflow: hidden;
    height: 100%;
    position: relative;
  }
  .ticker-track {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 36px;
    white-space: nowrap;
    padding-left: 100%;
    animation: tickerSlide 35s linear infinite;
  }
  .ticker-item {
    font-size: 0.78em;
    color: rgba(255,255,255,0.85);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ticker-item .ti-tag {
    color: #ffd89e;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .ticker-item .ti-time { color: rgba(255,255,255,0.5); }
  .ticker-item .ti-arrow { color: rgba(255,255,255,0.4); margin: 0 -28px; }
  .ticker-empty { font-style: italic; color: rgba(255,255,255,0.5); }

  /* ============ Input Bar ============ */
  .input-bar {
    flex-shrink: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    padding: 10px 28px 12px;
  }
  .chips {
    display: flex; flex-wrap: wrap; gap: 5px;
    margin-bottom: 8px;
  }
  .chip {
    background: var(--paper-2);
    border: 1px solid var(--line);
    color: var(--ink-2);
    padding: 4px 11px;
    border-radius: 13px;
    font-size: 0.76em;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .chip:hover { background: var(--ink-2); color: #fff; border-color: var(--ink-2); }
  .chip.warn { color: var(--accent); border-color: rgba(200,85,61,0.3); }
  .chip.warn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip-divider { width: 1px; background: var(--line-2); margin: 0 2px; align-self: stretch; }

  .input-row { display: flex; gap: 8px; align-items: stretch; }
  .input-row input {
    flex: 1;
    padding: 9px 14px;
    border: 1px solid var(--line);
    background: var(--paper-2);
    font-size: 0.9em;
    font-family: inherit;
    color: var(--ink);
    border-radius: 7px;
    transition: all 0.2s;
  }
  .input-row input:focus {
    outline: none;
    border-color: var(--ink-2);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(26,58,92,0.08);
  }
  .send-btn {
    background: var(--ink-2);
    color: #fff;
    border: none;
    padding: 0 22px;
    border-radius: 7px;
    font-family: inherit;
    font-size: 0.86em;
    cursor: pointer;
    letter-spacing: 2px;
    transition: background 0.2s;
    min-height: 38px;
  }
  .send-btn:hover { background: #0f2942; }

  /* ============ Routing Indicator ============ */
  .route-flash {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--ink-2);
    color: #fff;
    padding: 18px 30px;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.95em;
    letter-spacing: 1px;
    pointer-events: none;
    opacity: 0;
  }
  .route-flash.show { animation: routeFlash 1.2s ease; }
  @keyframes routeFlash {
    0% { opacity: 0; transform: translate(-50%, -40%); }
    20%, 80% { opacity: 1; transform: translate(-50%, -50%); }
    100% { opacity: 0; transform: translate(-50%, -55%); }
  }
  .route-flash .arrow { color: #ffd89e; }

  /* ============ Responsive ============ */
  @media (max-width: 700px) {
    .stations { grid-template-columns: 1fr; }
    .header-center { gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted-2); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">SF</div>
    <div>
      <h1>SCIFLOW <strong>ROUTER</strong></h1>
      <div class="sub">流水线工作台 · 监控 × 对话</div>
    </div>
  </div>
  <div class="header-center">
    <span class="topic-chip empty" id="topicChip">尚未分配任务</span>
    <span class="stat-divider"></span>
    <span class="stat">运行 <span class="v run" id="sRun">0</span></span>
    <span class="stat">暂停 <span class="v" id="sPause">0</span></span>
    <span class="stat">完成 <span class="v ok" id="sDone">0</span></span>
    <span class="stat-divider"></span>
    <span class="stat">总进度 <span class="v" id="sTotal">0%</span></span>
  </div>
  <div class="header-right">
    <button class="header-btn" onclick="clearAll()" title="清空所有进度">清空</button>
  </div>
</header>

<main>
  <div class="stations" id="stations"></div>
</main>

<div class="ticker-wrap">
  <div class="ticker-label">实时活动</div>
  <div class="ticker">
    <div class="ticker-track" id="ticker"></div>
  </div>
</div>

<div class="input-bar">
  <div class="chips">
    <button class="chip" data-cmd="论文">📄 论文</button>
    <button class="chip" data-cmd="实验">🔬 实验</button>
    <button class="chip" data-cmd="文献">🔍 文献</button>
    <button class="chip" data-cmd="专利">📋 专利</button>
    <button class="chip" data-cmd="调试">🐛 调试</button>
    <button class="chip" data-cmd="完整课题">🎯 完整课题</button>
    <span class="chip-divider"></span>
    <button class="chip warn" data-cmd="全部暂停">⏸ 全部暂停</button>
    <button class="chip warn" data-cmd="清空">↻ 清空</button>
    <button class="chip" data-cmd="状态">📊 状态</button>
  </div>
  <div class="input-row">
    <input id="msg" type="text" placeholder="向总控下达任务 · 例:帮我做一篇 GRPO 论文,Phase 2 改用 Lora 微调" autocomplete="off">
    <button class="send-btn" onclick="sendMsg()">发送</button>
  </div>
</div>

<div class="route-flash" id="routeFlash">
  <span>总控路由</span>
  <span class="arrow">→</span>
  <span id="routeTarget">·</span>
</div>

<script>
'use strict';

/* ============================================================
   持久化
   ============================================================ */
const STORAGE_KEY = 'sciflow_v3';
const state = { topic: '', log: [], agents: {} };
const timers = {}; // setTimeout 句柄 — 打断/清空时用

/* ============================================================
   子智能体定义
   ============================================================ */
const agents = {
  paper: {
    name: '论文写作', icon: '📄', skill: 'research-paper-writing',
    greeting: '已就绪 · LaTeX 模板与 NeurIPS 格式已加载',
    stages: [
      '项目初始化 · 识别贡献 · 目标会议',
      '文献综述 · arXiv / OpenReview 检索',
      '实验设计 · 假设与对照规划',
      '执行与监控 · 实时追踪 · 早停',
      '结果分析 · 统计检验 · 图表',
      '论文撰写 · 5句话摘要 · 模板',
      '自审与修改 · Autoreason 迭代',
      '提交发表 · LaTeX 校验 · rebuttal'
    ]
  },
  experiment: {
    name: '实验自动化', icon: '🔬', skill: 'applied-sci-experiment-starter',
    greeting: '已就绪 · 基线池(浅CNN/ResNet/Transformer ×6)已加载',
    stages: [
      '文献到 idea · 提取 backbone/aug/loss',
      '实验工作区 · README · src · tests',
      '基线选择 · 选定 4-6 个 baseline',
      'smoke 测试 · pytest -q 形状校验',
      '批量执行 · 多 seed · Wilcoxon',
      '结果可视化 · boxplot · 收敛曲线',
      '正式实验记录 · PROTOCOL · PROGRESS',
      '撰写报告 · ablation + 改进分析'
    ]
  },
  literature: {
    name: '文献调研', icon: '🔍', skill: 'paper-search + arxiv + pdf-to-md',
    greeting: '已就绪 · OpenReview + arXiv 检索接口已连接',
    stages: [
      '关键词定义 · 研究问题拆解',
      'OpenReview 检索 · 按时间过滤',
      'arXiv 检索 · 排序与去重',
      'PDF → Markdown · 转换',
      '笔记整理 · P0/P1/P2 分类',
      '综述输出 · 基线对比分析'
    ]
  },
  patent: {
    name: '专利申请', icon: '📋', skill: 'patent + prior-art-search',
    greeting: '已就绪 · 7步先验检索法 + 35 USC § 112 已加载',
    stages: [
      '技术交底 · 核心创新点提取',
      '先验检索 · 7 步法',
      '权利要求设计 · 独立+从属',
      '说明书撰写 · 技术领域·实施例',
      '附图绘制 · 流程图·架构图',
      'IDS 准备 · Information Disclosure',
      '合规校验 · USPTO 35 USC § 112',
      '提交申请 · 格式审核·缴费'
    ]
  },
  debug: {
    name: '代码调试', icon: '🐛', skill: 'root-cause + TDD',
    greeting: '已就绪 · TDD red-green-refactor 循环已加载',
    stages: [
      '复现问题 · 最小复现用例',
      '根因追踪 · 排除法',
      '编写失败测试 · TDD red',
      '修复实现 · green · 最小变更',
      '回归验证 · refactor',
      '完成前验证 · verification'
    ]
  },
  full: {
    name: '完整课题', icon: '🎯', skill: 'full-research-pipeline',
    greeting: '已就绪 · 端到端编排中,会协调其他 5 个子智能体',
    stages: [
      'idea-discovery · 脑暴生成',
      'novelty-check · 查新',
      '文献综述 · semantic-scholar',
      '方案细化 · research-refine',
      '实验计划 · 数据/指标',
      '跑实验 · 后台调度',
      '结果分析 · 显著性',
      '论文写作 · 阶段式产出',
      '审稿循环 · auto-review'
    ]
  }
};

/* ============================================================
   状态
   ============================================================ */
function defaultAgent() {
  return { currentStage: -1, status: 'idle', startedAt: null, finishedAt: null };
}
function ensureState() {
  Object.keys(agents).forEach(k => {
    if (!state.agents[k]) state.agents[k] = defaultAgent();
  });
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      state.topic = saved.topic || '';
      state.log = Array.isArray(saved.log) ? saved.log : [];
      Object.keys(agents).forEach(k => {
        if (saved.agents && saved.agents[k]) {
          state.agents[k] = Object.assign(defaultAgent(), saved.agents[k]);
          if (state.agents[k].status === 'running') state.agents[k].status = 'paused';
        }
      });
    }
  } catch (e) { console.warn(e); }
  ensureState();
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
function progressOf(key) {
  const s = state.agents[key];
  if (s.currentStage < 0) return 0;
  if (s.status === 'completed') return 100;
  return Math.round((s.currentStage / agents[key].stages.length) * 100);
}
function statusLabel(s) {
  return s.status === 'running' ? '运行中' : s.status === 'paused' ? '已暂停'
       : s.status === 'completed' ? '已完成' : '待启动';
}
function safeKey(k) { return String(k).replace(/'/g, "\\'"); }

/* ============================================================
   渲染: 主区域(6 个 station)
   ============================================================ */
function renderStations() {
  const root = document.getElementById('stations');
  root.innerHTML = Object.entries(agents).map(([key, a]) => {
    const s = state.agents[key];
    const pct = progressOf(key);
    const isRun = s.status === 'running';
    return `
      <div class="station ${s.status}" data-key="${key}">
        <div class="st-head">
          <div class="st-icon">${a.icon}</div>
          <div class="st-info">
            <div class="st-name">${a.name}</div>
            <div class="st-skill">${a.skill}</div>
          </div>
          <div class="st-badge ${s.status}">${statusLabel(s)}</div>
        </div>
        <div class="pipeline">
          ${a.stages.map((label, i) => {
            let cls = '';
            if (i < s.currentStage || s.status === 'completed') cls = 'done';
            else if (i === s.currentStage && s.status === 'running') cls = 'running';
            return `<div class="p-node ${cls}">
              <div class="p-node-label">${label}</div>
            </div>`;
          }).join('')}
        </div>
        <div class="st-progress">
          <div class="st-bar-fill ${isRun ? 'running' : ''}" style="width:${pct}%"></div>
        </div>
        <div class="st-meta">
          <span>${Math.max(0, s.currentStage + 1)} / ${a.stages.length} 阶段</span>
          <span class="pct">${pct}%</span>
        </div>
        <div class="st-actions">
          ${actionBtnHtml(key)}
          <button class="st-btn warn" onclick="event.stopPropagation(); agentReset('${safeKey(key)}')">重置</button>
        </div>
      </div>
    `;
  }).join('');

  // 全局统计
  const all = Object.values(state.agents);
  document.getElementById('sRun').textContent = all.filter(s => s.status === 'running').length;
  document.getElementById('sPause').textContent = all.filter(s => s.status === 'paused').length;
  document.getElementById('sDone').textContent = all.filter(s => s.status === 'completed').length;
  const avg = Math.round(all.reduce((acc, s, _, arr) => acc + progressOf(Object.keys(agents).find(k => state.agents[k] === s)) / arr.length, 0));
  document.getElementById('sTotal').textContent = avg + '%';

  // 任务 chip
  const tc = document.getElementById('topicChip');
  if (state.topic) {
    tc.textContent = '📌 ' + state.topic;
    tc.classList.remove('empty');
  } else {
    tc.textContent = '尚未分配任务';
    tc.classList.add('empty');
  }
}
function actionBtnHtml(key) {
  const s = state.agents[key];
  if (s.status === 'running') return `<button class="st-btn warn" onclick="event.stopPropagation(); agentPause('${safeKey(key)}')">⏸ 打断</button>`;
  if (s.status === 'completed') return `<button class="st-btn" onclick="event.stopPropagation(); agentStart('${safeKey(key)}', true)">↻ 重跑</button>`;
  if (s.status === 'paused' || (s.status === 'idle' && s.currentStage >= 0)) {
    return `<button class="st-btn" onclick="event.stopPropagation(); agentStart('${safeKey(key)}', false)">▶ 继续</button>`;
  }
  return `<button class="st-btn" onclick="event.stopPropagation(); agentStart('${safeKey(key)}', false)">▶ 启动</button>`;
}

/* ============================================================
   渲染: 滚动条
   ============================================================ */
function renderTicker() {
  const track = document.getElementById('ticker');
  const items = state.log.slice(-12);
  if (items.length === 0) {
    track.innerHTML = '<span class="ticker-item ticker-empty">▸ 等待任务 · 点击快捷指令或输入任务</span>';
    return;
  }
  // 复制一遍形成无缝循环
  track.innerHTML = items.concat(items).map(item => {
    const time = new Date(item.t).toLocaleTimeString('zh-CN', { hour12: false });
    const tag = item.from === 'controller' ? '总控' : (agents[item.from]?.name || item.from);
    return `<span class="ticker-item">
      <span class="ti-time">${time}</span>
      <span class="ti-arrow">·</span>
      <span class="ti-tag">${tag}</span>
      <span>${escapeHtml(item.text)}</span>
    </span>`;
  }).join('');
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

/* ============================================================
   活动日志(轻量聊天,只用于 ticker 显示,不展示在主区)
   ============================================================ */
function logEvent(from, text) {
  state.log.push({ from, text, t: Date.now() });
  if (state.log.length > 60) state.log = state.log.slice(-60);
  saveState();
  renderTicker();
}

/* ============================================================
   路由解析
   ============================================================ */
const ROUTE = {
  paper:      ['论文', 'paper', '写作', '投稿', '发表', 'NeurIPS', 'ICML', 'ICLR', 'ACL', 'AAAI'],
  experiment: ['实验', 'experiment', '跑数据', 'baseline', '基线', '消融', 'ablation'],
  literature: ['文献', '调研', 'literature', 'arxiv', 'openreview', 'survey', '综述'],
  patent:     ['专利', 'patent', '权利要求', '先验', 'USPTO'],
  debug:      ['调试', 'debug', 'bug', '出错', '报错', 'fix', 'crash', 'TDD'],
  full:       ['完整', '完整课题', '端到端', 'full', '课题', 'idea-discovery']
};
const CTRL = {
  pauseAll: ['全部暂停', '暂停全部'],
  reset:    ['重置', '清空', 'reset'],
  status:   ['状态', '进度']
};

function parseRoute(text) {
  const t = text.toLowerCase();
  for (const w of CTRL.pauseAll) if (t.includes(w)) return { type: 'ctrl', cmd: 'pauseAll' };
  for (const w of CTRL.reset)    if (t.includes(w)) return { type: 'ctrl', cmd: 'reset' };
  for (const w of CTRL.status)   if (t.includes(w)) return { type: 'ctrl', cmd: 'status' };
  const order = ['full', 'paper', 'experiment', 'literature', 'patent', 'debug'];
  for (const k of order) {
    if (ROUTE[k].some(w => t.includes(w.toLowerCase()))) return { type: 'route', agent: k };
  }
  return { type: 'chat' };
}
function targetFromText(text) {
  for (const [k, words] of Object.entries(ROUTE)) {
    if (words.some(w => text.includes(w))) return k;
  }
  const active = Object.entries(state.agents).find(([_, s]) => s.status === 'running' || s.status === 'paused');
  return active ? active[0] : null;
}

/* ============================================================
   路由可视化
   ============================================================ */
function flashRoute(agentKey) {
  const a = agents[agentKey];
  if (!a) return;
  const el = document.getElementById('routeFlash');
  document.getElementById('routeTarget').innerHTML = `${a.icon} ${a.name}`;
  el.classList.remove('show');
  void el.offsetWidth; // reflow 重启动画
  el.classList.add('show');
}

/* ============================================================
   子智能体执行
   ============================================================ */
function clearTimer(key) {
  if (timers[key]) { clearTimeout(timers[key]); timers[key] = null; }
}

function agentStart(key, restart = false) {
  const a = agents[key];
  const s = state.agents[key];
  if (s.status === 'running') return;
  if (restart) {
    s.currentStage = -1;
    s.startedAt = Date.now();
    s.finishedAt = null;
  } else if (s.currentStage < 0) {
    s.startedAt = Date.now();
    logEvent(key, a.greeting);
  } else {
    logEvent(key, `从阶段 ${s.currentStage + 1}/${a.stages.length} 继续`);
  }
  s.status = 'running';
  s.currentStage = Math.max(0, s.currentStage);
  renderStations();
  saveState();
  runStage(key);
}

function runStage(key) {
  const a = agents[key];
  const s = state.agents[key];
  if (s.status !== 'running') return;
  if (s.currentStage >= a.stages.length) {
    s.status = 'completed';
    s.currentStage = a.stages.length - 1;
    s.finishedAt = Date.now();
    logEvent(key, `✓ 全部 ${a.stages.length} 阶段完成`);
    renderStations();
    saveState();
    return;
  }
  const stageLabel = a.stages[s.currentStage];
  logEvent(key, `▸ ${stageLabel}`);
  renderStations();
  saveState();
  // 模拟阶段耗时
  const delay = 1800 + Math.random() * 1400;
  timers[key] = setTimeout(() => {
    timers[key] = null;
    if (state.agents[key].status !== 'running') return;
    s.currentStage++;
    renderStations();
    saveState();
    runStage(key);
  }, delay);
}

function agentPause(key) {
  if (state.agents[key].status !== 'running') return;
  state.agents[key].status = 'paused';
  clearTimer(key);
  const s = state.agents[key];
  logEvent(key, `⏸ 已暂停 · 阶段 ${s.currentStage + 1}/${agents[key].stages.length}`);
  renderStations();
  saveState();
}

function agentReset(key) {
  clearTimer(key);
  state.agents[key] = defaultAgent();
  logEvent(key, '已重置');
  renderStations();
  saveState();
}

function pauseAll() {
  Object.keys(agents).forEach(k => {
    if (state.agents[k].status === 'running') {
      state.agents[k].status = 'paused';
      clearTimer(k);
    }
  });
  logEvent('controller', '已暂停所有运行中的子智能体');
  renderStations();
  saveState();
}

function clearAll() {
  // 修复:先清所有句柄,再清状态,避免 setTimeout 在状态清空后仍触发
  Object.keys(timers).forEach(k => clearTimer(k));
  Object.keys(timers).forEach(k => { timers[k] = null; });

  state.topic = '';
  state.log = [];
  state.agents = {};
  ensureState();
  saveState();
  renderStations();
  renderTicker();
  logEvent('controller', '🔄 已清空所有进度与活动记录,等待新任务');
}

/* ============================================================
   总控对话(轻量,只追加 ticker)
   ============================================================ */
function controllerSay(text) {
  logEvent('controller', text);
}

function handleUserInput(text) {
  logEvent('user', '> ' + text);
  const r = parseRoute(text);

  if (r.type === 'ctrl') {
    if (r.cmd === 'pauseAll') { pauseAll(); controllerSay('⏸ 已暂停所有运行中的子智能体'); }
    else if (r.cmd === 'reset') {
      // 清空特定还是全部?
      const target = targetFromText(text);
      if (target && text.match(/(重置|清空)/) && !text.includes('全部')) {
        agentReset(target);
        controllerSay(`已重置【${agents[target].name}】`);
      } else {
        clearAll();
      }
    }
    else if (r.cmd === 'status') {
      const summary = Object.entries(agents).map(([k, a]) =>
        `${a.icon} ${a.name} · ${progressOf(k)}% · ${statusLabel(state.agents[k])}`
      ).join(' | ');
      controllerSay('📊 ' + summary);
    }
  } else if (r.type === 'route') {
    const a = agents[r.agent];
    state.topic = text;
    // 路由动画
    flashRoute(r.agent);
    controllerSay(`→ 路由到【${a.name}】(${a.skill})`);
    // 自动挂起其他运行中的
    Object.keys(agents).forEach(k => {
      if (k !== r.agent && state.agents[k].status === 'running') {
        state.agents[k].status = 'paused';
        clearTimer(k);
      }
    });
    // 启动
    if (state.agents[r.agent].status === 'completed') {
      agentStart(r.agent, true);
    } else {
      agentStart(r.agent, false);
    }
  } else {
    controllerSay('✎ 已记录。请明确指定任务:论文/实验/文献/专利/调试/完整课题');
  }
  saveState();
}

/* ============================================================
   UI 交互
   ============================================================ */
function sendMsg() {
  const input = document.getElementById('msg');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  handleUserInput(text);
}
document.getElementById('msg').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => handleUserInput(chip.dataset.cmd));
});

/* ============================================================
   启动
   ============================================================ */
loadState();
renderStations();
renderTicker();
if (state.log.length === 0) {
  logEvent('controller', '🚀 工作台就绪 · 6 个子智能体在线,等待任务分配');
} else {
  logEvent('controller', `↻ 已恢复上次状态 · ${Object.keys(agents).length} 个子智能体就绪`);
}
</script>
