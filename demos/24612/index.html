<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>安居测</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- 中文无衬线字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F5F0E8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" href="icons/icon-192.png">
</head>
<body>

    <!-- ========== 顶部工具栏 ========== -->
    <header id="toolbar">
        <div class="toolbar-left">
            <span class="app-logo">🏠</span>
            <h1 class="app-title">安居测</h1>
        </div>
        <div class="toolbar-right">
            <button id="btn-undo" class="tool-btn" title="撤销">↩</button>
            <button id="btn-redo" class="tool-btn" title="重做">↪</button>
            <button id="btn-new" class="tool-btn" title="新建">📄</button>
            <button id="btn-save" class="tool-btn" title="保存">💾</button>
            <button id="btn-export" class="tool-btn primary" title="导出图片">📷 导出</button>
        </div>
    </header>

    <!-- ========== 主画布区域 ========== -->
    <main id="canvas-area">
        <div id="canvas-container">
            <div id="canvas-grid">
                <!-- 已放置的房间方块会动态添加到这里 -->
            </div>
            <!-- 吸附辅助线 -->
            <div id="snap-lines"></div>
            <!-- 拖拽中的临时方块 -->
            <div id="drag-ghost" class="hidden"></div>
        </div>
        <div id="canvas-hint" class="hint-text">从下方拖拽房间积木到此处</div>
    </main>

    <!-- ========== 底部房间积木列表 ========== -->
    <footer id="room-palette">
        <div id="palette-scroll">
            <!-- 房间积木会由JS动态生成 -->
        </div>
    </footer>

    <!-- ========== 删除确认弹窗 ========== -->
    <div id="modal-overlay" class="hidden">
        <div id="modal-delete" class="modal-box">
            <p>确定要删除 <strong id="modal-room-name"></strong> 吗？</p>
            <div class="modal-buttons">
                <button id="modal-cancel" class="btn-cancel">取消</button>
                <button id="modal-confirm" class="btn-danger">删除</button>
            </div>
        </div>
    </div>

    <!-- ========== Toast提示 ========== -->
    <div id="toast" class="hidden"></div>

    <!-- ========== PWA Service Worker ========== -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('SW 已注册'))
                .catch(err => console.warn('SW 注册失败:', err));
        }
    </script>

    <!-- ========== JavaScript ========== -->
    <script src="js/model.js"></script>
    <script src="js/snap.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/export.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/dragdrop.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
