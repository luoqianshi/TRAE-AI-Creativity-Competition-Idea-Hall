        // ==================== 创建太阳直射光线（从太阳到地球表面） ====================
        let sunRayMesh, sunRayLabel;
        // 太阳直射光线辅助对象（放在tiltGroup下，继承所有层级变换）
        let sunRayHelper;
        function createSunRay() {
            // 加粗白色发光圆柱体：太阳中心 → 地球表面直射点
            const rayGeo = new THREE.CylinderGeometry(0.03, 0.03, 1, 8, 1);
            const rayMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.95
            });
            sunRayMesh = new THREE.Mesh(rayGeo, rayMat);
            scene.add(sunRayMesh);

            // 直射点发光标记（黄色球体）
            const hitGeo = new THREE.SphereGeometry(0.08, 16, 16);
            const hitMat = new THREE.MeshBasicMaterial({
                color: 0xffff00,
                transparent: true,
                opacity: 0.95
            });
            window.sunRayHitPoint = new THREE.Mesh(hitGeo, hitMat);
            scene.add(window.sunRayHitPoint);

            // "直射"文字标签
            const labelCanvas = document.createElement('canvas');
            const labelCtx = labelCanvas.getContext('2d');
            labelCanvas.width = 56; labelCanvas.height = 22;
            labelCtx.fillStyle = 'rgba(10,14,39,0.8)';
            roundRect(labelCtx, 2, 2, labelCanvas.width-4, labelCanvas.height-4, 3);
            labelCtx.fill();
            labelCtx.strokeStyle = '#ffdd44'; labelCtx.lineWidth = 1.5;
            roundRect(labelCtx, 2, 2, labelCanvas.width-4, labelCanvas.height-4, 3);
            labelCtx.stroke();
            labelCtx.font = 'bold 11px Orbitron, monospace';
            labelCtx.fillStyle = '#ffdd44';
            labelCtx.textAlign = 'center'; labelCtx.textBaseline = 'middle';
            labelCtx.fillText('直射', labelCanvas.width/2, labelCanvas.height/2);
            const labelTex = new THREE.CanvasTexture(labelCanvas);
            const labelMat = new THREE.SpriteMaterial({ map: labelTex, transparent: true });
            sunRayLabel = new THREE.Sprite(labelMat);
            sunRayLabel.scale.set(0.32, 0.13, 1);
            scene.add(sunRayLabel);

            // 关键：创建辅助对象作为 tiltGroup 的子对象
            // 通过 Three.js 层级矩阵自动获取准确世界坐标，消除手动变换误差
            sunRayHelper = new THREE.Object3D();
            if (window.tiltGroup) window.tiltGroup.add(sunRayHelper);
            else if (earth) earth.add(sunRayHelper);

            // 初始隐藏
            setSunRayVisible(false);
        }

        function updateSunRay(revolutionAngle, sinRev, cosRev) {
            if (!sunRayMesh || !window.sunRayHitPoint) return;

            // 计算直射纬度：随公转角度在 ±23.5° 之间正弦变化
            // 使用缓存的常量值（避免每帧重复计算）
            let directLatRad = TROPIC_LAT * Math.sin(revolutionAngle - Math.PI);
            // ★ 严格钳制：夏至日绝不超过北纬23.5°，冬至日绝不超过南纬23.5°
            directLatRad = Math.max(-TROPIC_LAT, Math.min(TROPIC_LAT, directLatRad));

            // ========== 向量法：精确计算昼半球中央直射点 ==========
            // 使用预创建的Vector3对象（避免每帧创建新对象）
            
            // 1. 地轴方向（已预创建并归一化）
            // cachedAxisDir = new THREE.Vector3(SIN_TILT, COS_TILT, 0).normalize();

            // 2. 太阳方向（使用传入的sin/cos缓存值）
            cachedSunDir.set(-sinRev, 0, -cosRev).normalize();

            // 3. "面向太阳"的水平方向 = 太阳方向在垂直于地轴平面上的投影
            cachedAlongAxis.copy(cachedAxisDir).multiplyScalar(cachedSunDir.dot(cachedAxisDir));
            cachedHorizDir.copy(cachedSunDir).sub(cachedAlongAxis).normalize();

            // 4. 直射点世界坐标 = 地球公转位置 + R·[sin(纬度)·地轴方向 + cos(纬度)·面向太阳方向]
            cachedFinalHit.set(0, 0, 0)
                .addScaledVector(cachedAxisDir, EARTH_R * Math.sin(directLatRad))
                .addScaledVector(cachedHorizDir, EARTH_R * Math.cos(directLatRad))
                .add(earthGroup.position);

            // 更新光线圆柱体（使用预创建的对象）
            cachedMidPoint.addVectors(ORIGIN_VEC3, cachedFinalHit).multiplyScalar(0.5);
            const distance = ORIGIN_VEC3.distanceTo(cachedFinalHit);
            sunRayMesh.position.copy(cachedMidPoint);
            sunRayMesh.scale.set(1, distance, 1);
            cachedRayDir.subVectors(cachedFinalHit, ORIGIN_VEC3).normalize();
            sunRayMesh.quaternion.setFromUnitVectors(cachedYAxis, cachedRayDir);

            // 更新直射点标记和标签
            window.sunRayHitPoint.position.copy(cachedFinalHit);
            if (sunRayLabel) {
                sunRayLabel.position.copy(cachedFinalHit).add(cachedLabelOffset);
            }
        }

        function setSunRayVisible(visible) {
            if (sunRayMesh) sunRayMesh.visible = visible;
            if (window.sunRayHitPoint) window.sunRayHitPoint.visible = visible;
            if (sunRayLabel) sunRayLabel.visible = visible;
        }

        // ==================== 创建地轴线（带南北极标记，统一23.5°倾斜） ====================
        let axisGroup; // 地轴组：所有地轴相关元素统一倾斜
        function createAxisLine() {
            const tiltRad = 23.5 * Math.PI / 180; // 精确地轴倾斜角
            const axisLength = 2.8;

            // 地轴组：放入统一倾斜组 tiltGroup，共享同一23.5°倾斜
            axisGroup = new THREE.Group();
            // 无需自身 rotation.z，由父级 tiltGroup 统一提供倾斜
            if (window.tiltGroup) window.tiltGroup.add(axisGroup);
            else earthGroup.add(axisGroup);

            // 地轴线（橙色虚线）
            const axisGeometry = new THREE.BufferGeometry();
            const axisPositions = new Float32Array([
                0, -axisLength, 0,
                0, axisLength, 0
            ]);
            axisGeometry.setAttribute('position', new THREE.BufferAttribute(axisPositions, 3));

            const axisMaterial = new THREE.LineDashedMaterial({
                color: 0xff9500,
                dashSize: 0.15,
                gapSize: 0.08,
                transparent: true,
                opacity: 0.85
            });

            axisLine = new THREE.Line(axisGeometry, axisMaterial);
            axisLine.computeLineDistances();
            axisGroup.add(axisLine);

            // 北极标记 N — 红色大球
            const nPoleGeo = new THREE.SphereGeometry(0.08, 16, 16);
            const nPoleMat = new THREE.MeshBasicMaterial({ color: 0xff4444 });
            const nPole = new THREE.Mesh(nPoleGeo, nPoleMat);
            nPole.position.set(0, axisLength, 0);
            nPole.name = 'northPole';
            axisGroup.add(nPole);

            // 南极标记 S — 蓝色小球
            const sPoleGeo = new THREE.SphereGeometry(0.06, 16, 16);
            const sPoleMat = new THREE.MeshBasicMaterial({ color: 0x4488ff });
            const sPole = new THREE.Mesh(sPoleGeo, sPoleMat);
            sPole.position.set(0, -axisLength, 0);
            sPole.name = 'southPole';
            axisGroup.add(sPole);
        }

        // ==================== 创建赤道面与公转轨道面（可视化黄赤交角23.5°） ====================
        let equatorialPlane, orbitalPlane;
        function createPlaneVisuals() {
            const tiltRad = 23.5 * Math.PI / 180;

            // ---- 1. 赤道面（垂直于地轴，随 tiltGroup 统一倾斜）----
            // 作为 earth 的子对象，earth 已在 tiltGroup 内，自动继承倾斜
            const eqGeo = new THREE.CircleGeometry(1.35, 64);
            const eqMat = new THREE.MeshBasicMaterial({
                color: 0x4ade80,
                transparent: true,
                opacity: 0.12,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            equatorialPlane = new THREE.Mesh(eqGeo, eqMat);
            // CircleGeometry 默认在 XY 平面，需要旋转到 XZ 平面（水平）
            equatorialPlane.rotation.x = -Math.PI / 2;
            earth.add(equatorialPlane);

            // 赤道面边缘线（更清晰）
            const eqRingGeo = new THREE.RingGeometry(1.33, 1.36, 64);
            const eqRingMat = new THREE.MeshBasicMaterial({
                color: 0x4ade80,
                transparent: true,
                opacity: 0.4,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            const eqRing = new THREE.Mesh(eqRingGeo, eqRingMat);
            eqRing.rotation.x = -Math.PI / 2;
            earth.add(eqRing);

            // 赤道面标签
            const eqCanvas = document.createElement('canvas');
            const eqCtx = eqCanvas.getContext('2d');
            eqCanvas.width = 96; eqCanvas.height = 28;
            eqCtx.fillStyle = 'rgba(10,14,39,0.75)';
            roundRect(eqCtx, 2, 2, eqCanvas.width-4, eqCanvas.height-4, 4);
            eqCtx.fill();
            eqCtx.strokeStyle = '#4ade80'; eqCtx.lineWidth = 1;
            roundRect(eqCtx, 2, 2, eqCanvas.width-4, eqCanvas.height-4, 4);
            eqCtx.stroke();
            eqCtx.font = 'bold 13px Orbitron, monospace';
            eqCtx.fillStyle = '#4ade80';
            eqCtx.textAlign = 'center'; eqCtx.textBaseline = 'middle';
            eqCtx.fillText('赤道面', eqCanvas.width/2, eqCanvas.height/2);
            const eqLabelTex = new THREE.CanvasTexture(eqCanvas);
            const eqLabelMat = new THREE.SpriteMaterial({ map: eqLabelTex, transparent: true });
            const eqLabel = new THREE.Sprite(eqLabelMat);
            eqLabel.position.set(1.55, 0, 0); // 赤道面前方右侧
            eqLabel.scale.set(0.45, 0.13, 1);
            earth.add(eqLabel);

            // ---- 2. 公转轨道面（水平 XZ 平面，铺满整个轨道区域）----
            const orbGeo = new THREE.CircleGeometry(9, 128);
            const orbMat = new THREE.MeshBasicMaterial({
                color: 0x00d4ff,
                transparent: true,
                opacity: 0.05,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            orbitalPlane = new THREE.Mesh(orbGeo, orbMat);
            orbitalPlane.rotation.x = -Math.PI / 2; // 水平放置
            scene.add(orbitalPlane);

            // 公转轨道面标签
            const opCanvas = document.createElement('canvas');
            const opCtx = opCanvas.getContext('2d');
            opCanvas.width = 110; opCanvas.height = 28;
            opCtx.fillStyle = 'rgba(10,14,39,0.75)';
            roundRect(opCtx, 2, 2, opCanvas.width-4, opCanvas.height-4, 4);
            opCtx.fill();
            opCtx.strokeStyle = '#00d4ff'; opCtx.lineWidth = 1;
            roundRect(opCtx, 2, 2, opCanvas.width-4, opCanvas.height-4, 4);
            opCtx.stroke();
            opCtx.font = 'bold 13px Orbitron, monospace';
            opCtx.fillStyle = '#00d4ff';
            opCtx.textAlign = 'center'; opCtx.textBaseline = 'middle';
            opCtx.fillText('公转轨道面', opCanvas.width/2, opCanvas.height/2);
            const opLabelTex = new THREE.CanvasTexture(opCanvas);
            const opLabelMat = new THREE.SpriteMaterial({ map: opLabelTex, transparent: true });
            const opLabel = new THREE.Sprite(opLabelMat);
            opLabel.position.set(8.9, 0, 0); // 轨道外侧
            opLabel.scale.set(0.52, 0.13, 1);
            scene.add(opLabel);

            // 初始隐藏（公转模式才显示）
            setPlanesVisible(false);
        }

        function setPlanesVisible(visible) {
            if (equatorialPlane) {
                equatorialPlane.visible = visible;
                equatorialPlane.parent.children.forEach(c => {
                    if (c.material && c.material.color) {
                        c.visible = visible; // 赤道面环、标签等
                    }
                });
            }
            if (orbitalPlane) orbitalPlane.visible = visible;
            // 公转轨道面标签
            scene.children.forEach(c => {
                if (c.isSprite && c.material && c.material.map) {
                    const img = c.material.map.image;
                    if (img && img.width === 110 && img.height === 28) c.visible = visible;
                }
            });
        }

        // ==================== 创建光照 ====================
        function createLights() {
            // 太阳光源（平行光，从太阳位置发出）
            const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
            sunLight.position.set(0, 0, 0); // 太阳在轨道中心
            scene.add(sunLight);

            // 环境光
            const ambientLight = new THREE.AmbientLight(0x222244, 0.4);
            scene.add(ambientLight);

            // 半球光（天空/地面颜色）
            const hemiLight = new THREE.HemisphereLight(0x4444ff, 0x442200, 0.3);
            scene.add(hemiLight);
        }

        // ==================== 动画循环 ====================
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (isPlaying && currentMode !== 'free') {
                // 自转动画
                if (currentMode === 'rotation' || currentMode === 'combined') {
                    earthRotationAngle += delta * rotationSpeed * 0.5;
                    earth.rotation.y = earthRotationAngle;
                    
                    // 云层稍微快一点的自转（模拟大气环流）
                    // 使用缓存的云层引用（优化性能）
                    if (clouds) {
                        clouds.rotation.y = earthRotationAngle * 1.05;
                    }
                }

                // 公转动画（逆时针：从北极俯视）
                if (currentMode === 'revolution' || currentMode === 'combined') {
                    revolutionAngle += delta * revolutionSpeed * 0.1;

                    // 模拟日期：公转一圈=365天，从1开始，365后返回1
                    const totalProgress = (revolutionAngle - Math.PI) / (Math.PI * 2); // 从春分(π)开始的进度
                    simDay = Math.floor(totalProgress * 365) % 365 + 1;
                    if (simDay < 1) simDay = 1; // 确保最小为1

                    // 缓存sin/cos计算结果（避免重复计算）
                    const sinRev = Math.sin(revolutionAngle);
                    const cosRev = Math.cos(revolutionAngle);
                    
                    // 逆时针公转：使用 sin/cos 互换实现从上方看为逆时针
                    earthGroup.position.x = sinRev * ORBIT_RADIUS;
                    earthGroup.position.z = cosRev * ORBIT_RADIUS;

                    // ===== 核心逻辑：白昼半球朝向太阳 + 节气物理正确性 =====
                    // 物理模型：地轴在空间中指向固定方向（北偏东23.5°），
                    //          随公转位置不同，太阳光与地轴夹角变化：
                    //   春分/秋分：太阳光 ⊥ 地轴 → 晨昏线穿过南北极（昼夜平分）
                    //   夏至：北极倾向太阳 → 北极圈内极昼
                    //   冬至：北极背向太阳 → 北极圈内极冬
                    // 使用缓存的常量值（避免每帧重复计算）

                    // ===== 太阳方向（世界坐标系）：从地球位置指向轨道中心原点 =====
                    // 使用预创建的Vector3对象（避免每帧创建新对象）
                    cachedWorldSunDir.subVectors(ORIGIN_VEC3, earthGroup.position).normalize();

                    // 更新着色器 uniform
                earth.material.uniforms.sunDirection.value.copy(cachedWorldSunDir);

                // 更新太阳直射光线位置
                updateSunRay(revolutionAngle, sinRev, cosRev);

                // ===== 节气按钮自动高亮：根据公转位置判断当前最接近的节气 =====
                // 将 revolutionAngle 归一化到 [0, 2π) 范围
                let normAngle = revolutionAngle % (Math.PI * 2);
                if (normAngle < 0) normAngle += Math.PI * 2;
                // 找到角度最近的节气（考虑圆周环绕）
                let nearestTerm = -1, minDist = Infinity;
                for (let i = 0; i < solarTerms.length; i++) {
                    let diff = Math.abs(normAngle - solarTerms[i].angle);
                    if (diff > Math.PI) diff = Math.PI * 2 - diff; // 圆周最短距离
                    if (diff < minDist) { minDist = diff; nearestTerm = i; }
                }
                // 仅当最近节气变化时才更新DOM（避免每帧操作）
                if (nearestTerm !== activeSolarTerm && nearestTerm >= 0) {
                    activeSolarTerm = nearestTerm;
                    // 使用缓存的DOM元素引用（避免重复querySelector）
                    if (!cachedSolarTermBtns) {
                        cachedSolarTermBtns = document.querySelectorAll('#solarTermBtns .mode-btn');
                    }
                    cachedSolarTermBtns.forEach((btn, i) => {
                        btn.classList.toggle('active', i === nearestTerm);
                    });
                    solarTermMarkers.forEach((m, i) => {
                        m.scale.setScalar(i === nearestTerm ? 1.5 : 1);
                        if (m.children[0] && m.children[0].material) {
                            m.children[0].material.opacity = i === nearestTerm ? 0.6 : 0.25;
                        }
                    });
                }

                // 4. 地球绕自身Y轴自转（在已朝向太阳的基础上叠加）
                if (currentMode === 'rotation' || currentMode === 'combined') {
                    earthRotationAngle += delta * rotationSpeed * 0.5;
                }
                // 地球总旋转：使 +Z 轴方向的面朝向太阳，再叠加自转
                // 使用缓存的太阳方向向量（cachedWorldSunDir）
                earth.rotation.y = Math.atan2(cachedWorldSunDir.x, cachedWorldSunDir.z) + earthRotationAngle;

                // 云层跟随（使用缓存的云层引用）
                if (clouds) {
                    clouds.rotation.y = earth.rotation.y * 1.02;
                }

                // ===== 月球动画（综合模式且开启月相时） =====
                if (currentMode === 'combined' && showMoon && moon && moonGroup) {
                    // 月球公转周期：一个月（约30天）
                    // 公转速度 = 地球公转速度 * 12（一年12个月）
                    moonPhaseAngle += delta * revolutionSpeed * 0.1 * 12;
                    
                    // 月球轨道半径（相对于地球）
                    const moonOrbitRadius = 2.5;
                    
                    // 月球绕地球公转（在地球的局部坐标系中）
                    const moonX = Math.sin(moonPhaseAngle) * moonOrbitRadius;
                    const moonZ = Math.cos(moonPhaseAngle) * moonOrbitRadius;
                    moonGroup.position.set(moonX, 0.3, moonZ); // 稍微倾斜的轨道
                    
                    // 潮汐锁定：月球自转周期 = 公转周期，永远同一面朝向地球
                    moon.rotation.y = moonPhaseAngle + Math.PI; // +PI使初始面向地球
                    
                    // 月球自转轴倾斜（模拟真实月球倾斜约6.68°）
                    moon.rotation.x = 0.116;
                    
                    // 更新月球材质的太阳方向（世界坐标系）
                    if (moon.material.uniforms) {
                        moon.material.uniforms.sunDirection.value.copy(cachedWorldSunDir);
                    }
                }

                // 根据视角模式更新相机目标（使用预创建的Vector3对象）
                if (currentMode === 'revolution' && viewMode === 'earth') {
                    controls.target.lerp(earthGroup.position, 0.08);
                } else if (currentMode === 'revolution' && viewMode === 'orbit') {
                    controls.target.lerp(ORIGIN_VEC3, 0.05);
                }
                }
            }

            // 更新星空微动
            if (starField) {
                starField.rotation.y += delta * 0.003;
            }

            // 更新控制器
            controls.update();

            // 渲染场景
            renderer.render(scene, camera);

            // 更新UI显示（节流：减少DOM操作频率，提升动画流畅度）
            const nowForUI = performance.now();
            if (nowForUI - lastUITime >= UI_UPDATE_INTERVAL) {
                updateUI();
                lastUITime = nowForUI;
            }

            // 计算帧率（使用缓存的DOM引用）
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                if (!cachedFpsCounter) cachedFpsCounter = document.getElementById('fpsCounter');
                if (cachedFpsCounter) cachedFpsCounter.textContent = frameCount + ' FPS';
                frameCount = 0;
                lastTime = now;
            }
        }

        // ==================== UI更新函数 ====================
        function updateUI() {
            // 更新当前角度显示
            const rotDeg = ((earthRotationAngle * 180 / Math.PI) % 360).toFixed(1);
            const revDeg = ((revolutionAngle * 180 / Math.PI) % 360).toFixed(1);

            // 只有当值变化时才更新数据卡片（减少DOM操作）
            if (rotDeg !== cachedRotDeg || revDeg !== cachedRevDeg || simDay !== cachedSimDay) {
                cachedRotDeg = rotDeg;
                cachedRevDeg = revDeg;
                cachedSimDay = simDay;
                
                const info = knowledgeData[currentMode];
                if (info && info.data) {
                    updateDataCards(info.data, rotDeg, revDeg);
                }
            }

            // 更新模拟日期（使用缓存的DOM引用）
            if (!cachedSimDate) cachedSimDate = document.getElementById('simDate');
            if (cachedSimDate) cachedSimDate.textContent = `第 ${simDay} 天`;
        }

        function updateDataCards(data, rotDeg, revDeg) {
            // 使用缓存的DOM引用
            if (!cachedDataCards) cachedDataCards = document.getElementById('dataCards');
            if (!cachedDataCards) return;
            cachedDataCards.innerHTML = '';

            data.forEach(item => {
                let value = item.value;
                
                // 动态值替换
                if (value === 'currentAngle') value = rotDeg;
                else if (value === 'revAngle') value = revDeg;
                else if (value === 'simDay') value = Math.floor(revolutionAngle / (Math.PI * 2) * 365) + 1;
                else if (value === 'season') {
                    const angle = (revolutionAngle % (Math.PI * 2)) / (Math.PI * 2);
                    if (angle < 0.25) value = '春季';
                    else if (angle < 0.5) value = '夏季';
                    else if (angle < 0.75) value = '秋季';
                    else value = '冬季';
                }
                else if (value === 'camDist') {
                    value = camera.position.distanceTo(new THREE.Vector3(0, 0, 0)).toFixed(1);
                }
                else if (value === 'camHeight') {
                    value = camera.position.y.toFixed(2);
                }
                else if (value === 'camAzimuth') {
                    const spherical = new THREE.Spherical();
                    spherical.setFromVector3(camera.position);
                    value = (spherical.theta * 180 / Math.PI).toFixed(0);
                }
                else if (value === 'camPolar') {
                    const spherical = new THREE.Spherical();
                    spherical.setFromVector3(camera.position);
                    value = (spherical.phi * 180 / Math.PI).toFixed(0);
                }

                cardsContainer.innerHTML += `
                    <div class="data-card">
                        <div class="data-label">${item.label}</div>
                        <div class="data-value">${value}<span class="data-unit">${item.unit}</span></div>
                    </div>
                `;
            });
        }

        // ==================== 控制函数 ====================
        function setMode(mode) {
            currentMode = mode;

            // 更新按钮状态
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.mode === mode) {
                    btn.classList.add('active');
                }
            });

            // 更新信息面板
            const info = knowledgeData[mode];
            if (info) {
                document.getElementById('infoTitle').textContent = info.title;
                document.getElementById('infoContent').innerHTML = info.content;

                // 重置位置和可见性
                if (mode === 'rotation' || mode === 'free') {
                    // 回到自转/自由模式：地球回到中心，相机目标归原点
                    earthGroup.position.set(0, 0, 0);
                    orbitLine.visible = false;
                    solarTermMarkers.forEach(m => m.visible = false);
                    setPlanesVisible(false);
                    planeVisible = false;
                    setSunRayVisible(false);
                    document.getElementById('planeBtn').classList.remove('active');
                    document.getElementById('planeStatus').textContent = '关闭';
                    document.getElementById('planeStatus').style.color = '';
                    document.getElementById('planeBtn').style.display = 'none';
                    controls.target.set(0, 0, 0);
                    document.getElementById('viewToggle').classList.remove('visible');
                    document.getElementById('solarTermTitle').style.display = 'none';
                    document.getElementById('solarTermBtns').style.display = 'none';
                } else if (mode === 'revolution' || mode === 'combined') {
                    orbitLine.visible = true;
                    solarTermMarkers.forEach(m => m.visible = true);
                    setSunRayVisible(true);
                    // 显示视角切换按钮、节气按钮、黄赤交角按钮
                    document.getElementById('viewToggle').classList.add('visible');
                    document.getElementById('solarTermTitle').style.display = 'block';
                    document.getElementById('solarTermBtns').style.display = 'grid';
                    document.getElementById('planeBtn').style.display = '';
                    // 将地球放到轨道初始位置
                    const orbitRadius = 8;
                    earthGroup.position.x = Math.sin(revolutionAngle) * orbitRadius;
                    earthGroup.position.z = Math.cos(revolutionAngle) * orbitRadius;
                    if (mode === 'revolution') {
                        controls.target.copy(earthGroup.position);
                    }
                    // 仅综合模式显示月相按钮
                    if (mode === 'combined') {
                        document.getElementById('moonBtn').style.display = '';
                    } else {
                        document.getElementById('moonBtn').style.display = 'none';
                        showMoon = false;
                        if (moonGroup) moonGroup.visible = false;
                        document.getElementById('moonBtn').classList.remove('active');
                        document.getElementById('moonStatus').textContent = '关闭';
                    }
                }

                // 更新模式状态文本
                const modeNames = {
                    rotation: '自转模式',
                    revolution: '公转模式',
                    combined: '综合模式',
                    free: '自由模式'
                };
                document.getElementById('statusMode').textContent = modeNames[mode];
            }
        }

        // ==================== 视角切换（公转模式） ====================
        function setViewMode(view) {
            viewMode = view;

            // 更新按钮状态
            document.querySelectorAll('.view-toggle-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.view === view) {
                    btn.classList.add('active');
                }
            });

            if (view === 'earth') {
                // 地球视角：相机移到地球附近，目标跟随地球
                const offset = new THREE.Vector3(2.5, 2, 3);
                camera.position.copy(earthGroup.position).add(offset);
                controls.target.copy(earthGroup.position);
                // 缩放限制：可以近距离观察
                controls.minDistance = 2.5;
                controls.maxDistance = 15;
            } else {
                // 轨道视角：相机拉远俯瞰整个系统，太阳在中心
                camera.position.set(0, 12, 0);
                controls.target.set(0, 0, 0);
                // 缩放限制：可以看到完整轨道
                controls.minDistance = 6;
                controls.maxDistance = 25;
            }

            controls.update();
        }

        // ==================== 面板折叠/展开 ====================
        function togglePanel(panel) {
            if (panel === 'control') {
                const el = document.getElementById('controlPanel');
                const btn = el.querySelector('.panel-toggle');
                el.classList.toggle('collapsed');
                btn.textContent = el.classList.contains('collapsed') ? '▶' : '◀';
            } else if (panel === 'info') {
                const el = document.getElementById('infoPanel');
                const btn = document.getElementById('infoToggle');
                el.classList.toggle('collapsed');
                if (el.classList.contains('collapsed')) {
                    btn.textContent = '◀';
                    btn.style.right = 'calc(30px + 34px)';
                    btn.style.borderRadius = '0 12px 12px 0';
                    btn.style.borderRight = 'none';
                    btn.style.borderLeft = '1px solid var(--glass-border)';
                } else {
                    btn.textContent = '▶';
                    btn.style.right = '30px';
                    btn.style.borderRadius = '12px 0 0 12px';
                    btn.style.borderLeft = 'none';
                    btn.style.borderRight = '1px solid var(--glass-border)';
                }
            }
        }

        // ==================== 经纬网开关 ====================
        let gridVisible = false;
        function toggleGrid() {
            gridVisible = !gridVisible;
            // 更新着色器uniform
            if (earth && earth.material.uniforms) {
                earth.material.uniforms.showGrid.value = gridVisible ? 1.0 : 0.0;
            }
            // 更新3D文字标签显隐（地球表面标注）
            if (gridLabelsGroup) {
                gridLabelsGroup.visible = gridVisible;
            }
            // 更新按钮状态
            const btn = document.getElementById('gridBtn');
            const status = document.getElementById('gridStatus');
            if (gridVisible) {
                btn.classList.add('active');
                status.textContent = '开启';
                status.style.color = 'var(--accent-blue)';
            } else {
                btn.classList.remove('active');
                status.textContent = '关闭';
                status.style.color = '';
            }
        }

        // ==================== 黄赤交角显示开关 ====================
        let planeVisible = false;
        function togglePlanes() {
            planeVisible = !planeVisible;
            setPlanesVisible(planeVisible);
            const btn = document.getElementById('planeBtn');
            const status = document.getElementById('planeStatus');
            if (planeVisible) {
                btn.classList.add('active');
                status.textContent = '开启';
                status.style.color = '#f97316';
            } else {
                btn.classList.remove('active');
                status.textContent = '关闭';
                status.style.color = '';
            }
        }

        // ==================== 节气跳转 ====================
        // 当前选中的节气索引（-1=未选中）
        let activeSolarTerm = -1;
        function jumpToSolarTerm(index) {
            const term = solarTerms[index];
            if (!term) return;

            // 设置公转角度到该节气位置
            revolutionAngle = term.angle;

            // 立即更新地球位置
            const orbitRadius = 8;
            earthGroup.position.x = Math.sin(revolutionAngle) * orbitRadius;
            earthGroup.position.z = Math.cos(revolutionAngle) * orbitRadius;

            // 立即计算并设置太阳方向（北偏东倾斜模型）
            const tiltRad = 23.5 * Math.PI / 180;
            const cosT = Math.cos(tiltRad);
            const sinT = Math.sin(tiltRad);
            const localX = -cosT * Math.sin(revolutionAngle);
            const localY = -sinT * Math.sin(revolutionAngle);
            const localZ = -Math.cos(revolutionAngle);
            const localSunDir = new THREE.Vector3(localX, localY, localZ).normalize();
            if (earth && earth.material.uniforms) {
                earth.material.uniforms.sunDirection.value.copy(localSunDir);
            }

            // 更新地球旋转朝向（白昼面朝向太阳）
            earth.rotation.y = Math.atan2(localSunDir.x, localSunDir.z);

            // 更新按钮高亮状态
            document.querySelectorAll('#solarTermBtns .mode-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });

            // 高亮对应的轨道标记点（放大+闪烁）
            solarTermMarkers.forEach((m, i) => {
                m.scale.setScalar(i === index ? 1.5 : 1);
                m.children[0].material.opacity = i === index ? 0.6 : 0.25; // 光晕
            });
            activeSolarTerm = index;
            // 更新太阳直射光线位置
            const sinRev = Math.sin(revolutionAngle);
            const cosRev = Math.cos(revolutionAngle);
            updateSunRay(revolutionAngle, sinRev, cosRev);

            // 如果当前不在公转/综合模式，自动切换
            if (currentMode !== 'revolution' && currentMode !== 'combined') {
                setMode('revolution');
            }
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('playBtn');
            const icon = document.getElementById('playIcon');
            const text = document.getElementById('playText');

            if (isPlaying) {
                icon.textContent = '⏸';
                text.textContent = '暂停';
                btn.classList.remove('primary');
                btn.style.background = 'linear-gradient(135deg, #ff9500, #cc7700)';
            } else {
                icon.textContent = '▶';
                text.textContent = '播放';
                btn.style.background = '';
                btn.classList.add('primary');
            }
        }

        function resetView() {
            // 根据当前模式和视角重置相机位置
            if (currentMode === 'revolution' || currentMode === 'combined') {
                if (viewMode === 'earth') {
                    // 地球视角：相机在地球斜上方，目标跟随地球
                    const offset = new THREE.Vector3(2.5, 2, 3);
                    camera.position.copy(earthGroup.position).add(offset);
                    controls.target.copy(earthGroup.position);
                } else {
                    // 轨道视角：俯瞰整个系统
                    camera.position.set(0, 12, 0);
                    controls.target.set(0, 0, 0);
                }
            } else {
                // 自转/自由模式：相机回到默认位置
                camera.position.set(4, 3, 5);
                controls.target.set(0, 0, 0);
            }
            controls.update();

            // 重置角度：地球从春分位置开始（底部 -Z），逆时针公转一圈365天
            earthRotationAngle = 0;
            revolutionAngle = Math.PI; // 春分位置：x=0, z=-R (轨道下方)
            simDay = 0; // 重置为第0天，播放后从第1天开始
            earth.rotation.y = 0;

            // 重置地球到对应模式的初始位置
            if (currentMode === 'rotation' || currentMode === 'free') {
                earthGroup.position.set(0, 0, 0);
            } else {
                // 从春分位置开始
                const orbitRadius = 8;
                earthGroup.position.x = Math.sin(revolutionAngle) * orbitRadius;
                earthGroup.position.z = Math.cos(revolutionAngle) * orbitRadius;
                // 设置正确的太阳方向（白昼朝向中心，北偏东倾斜模型）
                const tiltRad = 23.5 * Math.PI / 180;
                const cosT = Math.cos(tiltRad);
                const sinT = Math.sin(tiltRad);
                if (earth && earth.material.uniforms) {
                    earth.material.uniforms.sunDirection.value.set(
                        -cosT * Math.sin(revolutionAngle),
                        -sinT * Math.sin(revolutionAngle),
                        -Math.cos(revolutionAngle)
                    ).normalize();
                }
            }

            // 重置云层（使用缓存的云层引用）
            if (clouds) clouds.rotation.y = 0;
        }

        function updateRotationSpeed(value) {
            rotationSpeed = parseFloat(value);
            document.getElementById('rotSpeedValue').textContent = value + 'x';
        }

        function updateRevolutionSpeed(value) {
            revolutionSpeed = parseFloat(value);
            document.getElementById('revSpeedValue').textContent = value + 'x';
        }

        // ==================== 窗口调整 ====================
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==================== 启动 ====================
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
