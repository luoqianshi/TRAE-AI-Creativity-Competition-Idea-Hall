<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球运动交互课件</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0a0e27;
            --bg-panel: rgba(15, 23, 42, 0.85);
            --border-glow: rgba(0, 212, 255, 0.3);
            --accent-blue: #00d4ff;
            --accent-orange: #ff9500;
            --text-primary: #e8f0ff;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 标题栏 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(10, 14, 39, 0.9), transparent);
            pointer-events: none;
        }

        .header > * {
            pointer-events: auto;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-blue), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* 控制面板 */
        .control-panel {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            width: 280px;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }

        .control-panel.collapsed {
            transform: translateY(-50%) translateX(calc(-100% + 36px));
            opacity: 0.9;
        }

        /* 面板折叠按钮 */
        .panel-toggle {
            position: absolute;
            top: 50%;
            right: -36px;
            transform: translateY(-50%);
            width: 32px;
            height: 60px;
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-left: none;
            border-radius: 0 16px 16px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-blue);
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 101;
            box-shadow: 4px 0 16px rgba(0, 212, 255, 0.2);
        }

        .panel-toggle:hover {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-blue);
            border-color: var(--accent-blue);
            box-shadow: 4px 0 24px rgba(0, 212, 255, 0.4);
        }

        .control-panel .panel-toggle {
            right: -36px;
            border-right: none;
            border-left: 1px solid var(--glass-border);
            border-radius: 12px 0 0 12px;
        }

        .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 20px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: linear-gradient(to bottom, var(--accent-blue), transparent);
            border-radius: 2px;
        }

        /* 模式选择器 */
        .mode-selector {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        .mode-btn {
            padding: 12px 16px;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: var(--glass-bg);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .mode-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--accent-blue);
            color: var(--text-primary);
            transform: translateX(4px);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(167, 139, 250, 0.1));
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
        }

        .mode-icon {
            width: 20px;
            height: 20px;
            opacity: 0.7;
        }

        /* 视角切换按钮组 */
        .view-toggle {
            display: none;
            gap: 8px;
            margin-bottom: 20px;
        }

        .view-toggle.visible {
            display: flex;
        }

        .view-toggle-btn {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            background: var(--glass-bg);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .view-toggle-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .view-toggle-btn.active {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(167, 139, 250, 0.1));
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.15);
        }

        /* 播放控制 */
        .play-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .play-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .play-btn.primary {
            background: linear-gradient(135deg, var(--accent-blue), #0099cc);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        .play-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 212, 255, 0.4);
        }

        .play-btn.secondary {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
        }

        .play-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        /* 速度滑块 */
        .slider-group {
            margin-bottom: 20px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .slider-value {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-blue);
            font-size: 12px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, var(--accent-blue), #0099cc);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            transition: transform 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 分隔线 */
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, var(--glass-border), transparent);
            margin: 20px 0;
        }

        /* 知识面板 */
        .info-panel {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            width: 340px;
            max-height: 70vh;
            overflow-y: auto;
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 28px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }

        .info-panel.collapsed {
            transform: translateY(-50%) translateX(90%);
            opacity: 0.5;
        }

        .info-panel .panel-toggle {
            left: -36px;
            right: auto;
            border-left: none;
            border-right: 1px solid var(--glass-border);
            border-radius: 12px 0 0 12px;
        }

        /* 知识面板折叠按钮悬停 */
        #infoToggle:hover {
            background: rgba(0, 212, 255, 0.15) !important;
            color: var(--accent-blue) !important;
            border-color: var(--accent-blue) !important;
        }

        .info-panel::-webkit-scrollbar {
            width: 4px;
        }

        .info-panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .info-panel::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 2px;
        }

        .info-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--accent-orange), #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .info-content {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .info-content p {
            margin-bottom: 12px;
        }

        /* 数据卡片 */
        .data-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .data-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .data-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .data-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .data-unit {
            font-size: 11px;
            color: var(--text-secondary);
            margin-left: 2px;
        }

        /* 状态栏 */
        .status-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 24px;
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 14px 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-blue);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-label {
            color: var(--text-secondary);
        }

        .status-value {
            font-family: 'Orbitron', sans-serif;
            color: var(--text-primary);
            font-size: 12px;
        }

        /* 提示标签 */
        .hint-tag {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99;
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0.6;
            pointer-events: none;
        }

        /* 专属水印 */
        .watermark {
            position: fixed;
            bottom: 20px;
            right: 30px;
            z-index: 9999;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: rgba(0, 212, 255, 0.3);
            letter-spacing: 2px;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            .info-panel {
                width: 280px;
                right: 20px;
            }
            .control-panel {
                width: 240px;
                left: 20px;
            }
        }

        @media (max-width: 900px) {
            .control-panel {
                left: 10px;
                width: 220px;
                padding: 16px;
            }
            .info-panel {
                right: 10px;
                width: 260px;
                padding: 20px;
            }
            .title {
                font-size: 22px;
            }
        }

        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid var(--glass-border);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--accent-blue);
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <!-- 加载界面 -->
    <div class="loading-overlay" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">LOADING EARTH</div>
    </div>

    <!-- 3D 画布容器 -->
    <div id="canvas-container"></div>

    <!-- 标题栏 -->
    <header class="header">
        <div>
            <h1 class="title">EARTH MOTION</h1>
            <p class="subtitle">地球运动交互式教学课件</p>
        </div>
    </header>

    <!-- 左侧控制面板 -->
    <aside class="control-panel" id="controlPanel">
        <!-- 折叠按钮 -->
        <div class="panel-toggle" onclick="togglePanel('control')" title="展开/收起控制面板">◀</div>

        <div class="panel-title">运动模式</div>
        
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="rotation" onclick="setMode('rotation')">
                <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12a9 9 0 11-6.219-8.56"/>
                    <polyline points="21 3 21 9 15 9"/>
                </svg>
                地球自转
            </button>
            <button class="mode-btn" data-mode="revolution" onclick="setMode('revolution')">
                <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="12" r="3"/>
                    <line x1="12" y1="2" x2="12" y2="5"/>
                    <line x1="12" y1="19" x2="12" y2="22"/>
                </svg>
                地球公转
            </button>
            <button class="mode-btn" data-mode="combined" onclick="setMode('combined')">
                <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12a9 9 0 11-6.219-8.56"/>
                    <polyline points="21 3 21 9 15 9"/>
                    <circle cx="12" cy="12" r="10" stroke-dasharray="4 2"/>
                </svg>
                综合演示
            </button>
            <button class="mode-btn" data-mode="free" onclick="setMode('free')">
                <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                    <line x1="12" y1="22.08" x2="12" y2="12"/>
                </svg>
                自由观察
            </button>
        </div>

        <div class="divider"></div>

        <!-- 视角切换（仅公转/综合模式显示） -->
        <div class="view-toggle" id="viewToggle">
            <button class="view-toggle-btn active" data-view="earth" onclick="setViewMode('earth')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10A15.3 15.3 0 0112 2z"/></svg>
                地球视角
            </button>
            <button class="view-toggle-btn" data-view="orbit" onclick="setViewMode('orbit')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/><line x1="12" y1="3" x2="12" y2="6"/></svg>
                轨道视角
            </button>
        </div>

        <div class="panel-title">播放控制</div>
        <div class="play-controls">
            <button class="play-btn primary" id="playBtn" onclick="togglePlay()">
                <span id="playIcon">▶</span>
                <span id="playText">播放</span>
            </button>
            <button class="play-btn secondary" onclick="resetView()">
                ↺ 重置
            </button>
        </div>

        <div class="divider"></div>

        <div class="panel-title">速度调节</div>
        <div class="slider-group">
            <div class="slider-label">
                <span>自转速度</span>
                <span class="slider-value" id="rotSpeedValue">1.0x</span>
            </div>
            <input type="range" id="rotSpeedSlider" min="0.1" max="5" step="0.1" value="1" oninput="updateRotationSpeed(this.value)">
        </div>
        <div class="slider-group">
            <div class="slider-label">
                <span>公转速度</span>
                <span class="slider-value" id="revSpeedValue">1.0x</span>
            </div>
            <input type="range" id="revSpeedSlider" min="0.1" max="5" step="0.1" value="1" oninput="updateRevolutionSpeed(this.value)">
        </div>

        <div class="divider"></div>

        <!-- 经纬网开关 -->
        <div class="panel-title">显示选项</div>
        <button class="mode-btn" id="gridBtn" onclick="toggleGrid()" style="justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <ellipse cx="12" cy="12" rx="10" ry="4"/>
                <line x1="12" y1="2" x2="12" y2="22"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
            </svg>
            经纬网
            <span style="margin-left: auto; font-size: 11px; opacity: 0.6;" id="gridStatus">关闭</span>
        </button>

        <!-- 黄赤交角开关（公转/综合模式显示） -->
        <button class="mode-btn" id="planeBtn" onclick="togglePlanes()" style="justify-content: center; display:none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2">
                    <path d="M12 2 L12 8 M4 10 Q12 14 20 10"/>
                    <line x1="6" y1="18" x2="18" y2="18"/>
                </svg>
                黄赤交角
                <span style="margin-left: auto; font-size: 11px; opacity: 0.6;" id="planeStatus">关闭</span>
            </button>

            <!-- 月相控制按钮（仅综合模式显示） -->
            <button class="mode-btn" id="moonBtn" onclick="toggleMoon()" style="justify-content: center; display:none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                月相
                <span style="margin-left: auto; font-size: 11px; opacity: 0.6;" id="moonStatus">关闭</span>
            </button>

            <!-- 节气跳转按钮（公转/综合模式显示） -->
        <div class="panel-title" id="solarTermTitle" style="display:none;">节气定位</div>
        <div class="view-toggle" id="solarTermBtns" style="display:none; grid-template-columns: 1fr 1fr;">
            <button class="mode-btn" onclick="jumpToSolarTerm(0)" style="padding:8px 6px;font-size:12px;">
                <span style="color:#4ade80;">●</span> 春分
            </button>
            <button class="mode-btn" onclick="jumpToSolarTerm(1)" style="padding:8px 6px;font-size:12px;">

        // ==================== 水印保护机制 ====================
        function setupWatermarkProtection() {
            const createWatermark = () => {
                let watermark = document.querySelector('.watermark');
                if (!watermark) {
                    watermark = document.createElement('div');
                    watermark.className = 'watermark';
                    watermark.textContent = '刘芬';
                    watermark.setAttribute('data-protected', 'true');
                    document.body.appendChild(watermark);
                }
                return watermark;
            };

            // 初始创建水印
            createWatermark();

            // 使用MutationObserver检测DOM变化
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.removedNodes.length > 0) {
                        for (let i = 0; i < mutation.removedNodes.length; i++) {
                            if (mutation.removedNodes[i].classList && 
                                mutation.removedNodes[i].classList.contains('watermark')) {
                                // 水印被删除，立即恢复
                                setTimeout(createWatermark, 0);
                                break;
                            }
                        }
                    }
                });
            });

            // 监听body的子节点变化
            observer.observe(document.body, {
                childList: true,
                subtree: true
            });

            // 每2秒检查一次水印是否存在（双重保护）
            setInterval(() => {
                if (!document.querySelector('.watermark')) {
                    createWatermark();
                }
            }, 2000);
        }

        // ==================== 创建星空背景 ====================
        function createStarField() {
            const starsGeometry = new THREE.BufferGeometry();
            const starCount = 8000;
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);

            for (let i = 0; i < starCount; i++) {
                // 在球形空间中随机分布
                const radius = 400 + Math.random() * 600;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = radius * Math.cos(phi);

                // 星星颜色变化（白色到淡蓝/淡黄）
                const colorChoice = Math.random();
                if (colorChoice > 0.95) {
                    colors[i * 3] = 1.0;
                    colors[i * 3 + 1] = 0.9;
                    colors[i * 3 + 2] = 0.7;
                } else if (colorChoice > 0.9) {
                    colors[i * 3] = 0.7;
                    colors[i * 3 + 1] = 0.85;
                    colors[i * 3 + 2] = 1.0;
                } else {
                    colors[i * 3] = 1.0;
                    colors[i * 3 + 1] = 1.0;
                    colors[i * 3 + 2] = 1.0;
                }

                sizes[i] = Math.random() * 2 + 0.5;
            }

            starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            starsGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const starsMaterial = new THREE.PointsMaterial({
                size: 1.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                sizeAttenuation: true
            });

            starField = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(starField);
        }

        function createSun() {

        // ==================== 创建地球 ====================
        function createEarth() {
            earthGroup = new THREE.Group();

            // 地球几何体（高精度）
            const earthGeometry = new THREE.SphereGeometry(1.5, 128, 128);

            const textureLoader = new THREE.TextureLoader();
            
            // 加载 NASA 高清地球白天纹理（4K分辨率）
            const earthDayTexture = textureLoader.load(
                'https://unpkg.com/three-globe/example/img/earth-day.jpg',
                function(texture) {
                    // 纹理加载完成后的优化设置
                    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                    texture.minFilter = THREE.LinearMipmapLinearFilter;
                    texture.magFilter = THREE.LinearFilter;
                    console.log('地球白天纹理加载成功');
                },
                undefined,
                function(err) {
                    console.warn('外部纹理加载失败，使用程序化备用纹理');
                }
            );

            // 加载地球夜晚纹理（城市灯光）
            const earthNightTexture = textureLoader.load(
                'https://unpkg.com/three-globe/example/img/earth-night.jpg',
                function(texture) {
                    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                }
            );

            // 创建自定义着色器材质实现昼夜过渡 + 经纬网叠加
            const earthMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    dayTexture: { value: earthDayTexture },
                    nightTexture: { value: earthNightTexture },
                    sunDirection: { value: new THREE.Vector3(1, 0, 0).normalize() },
                    showGrid: { value: 0.0 } // 0=隐藏, 1=显示经纬网
                },
                vertexShader: `
                    varying vec2 vUv;
                    varying vec3 vNormal;

                    void main() {
                        vUv = uv;
                        // ★ 法线转换到世界空间（与 sunDirection 世界坐标匹配）
                        vNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D dayTexture;
                    uniform sampler2D nightTexture;
                    uniform vec3 sunDirection;
                    uniform float showGrid;

                    varying vec2 vUv;
                    varying vec3 vNormal;

                    // 经纬网格绘制函数：只绘制关键纬线 + 全部经线 + 特殊虚线
                    vec3 drawGrid(vec2 uv, float lineWidth) {
                        vec3 gridColor = vec3(0.0);
                        float allLines = 0.0;

                        // ===== 经线：24条（每15°一条） =====
                        float lonStep = 1.0 / 24.0;
                        float lonFrag = mod(uv.x, lonStep);
                        float lonDist = min(lonFrag, lonStep - lonFrag);
                        float lonLine = smoothstep(lineWidth, 0.0, lonDist);
                        allLines = max(allLines, lonLine);

                        // ===== 纬线：只画 0°、30°、60°（共5条） =====
                        // 赤道 0° (UV y = 0.5) — 加粗实线
                        float equator = smoothstep(lineWidth * 2.5, 0.0, abs(uv.y - 0.5));
                        allLines = max(allLines, equator * 0.85);

                        // 北纬30° (UV y = 0.6667)
                        float lat30N = smoothstep(lineWidth, 0.0, abs(uv.y - 0.6667));
                        allLines = max(allLines, lat30N);

                        // 南纬30° (UV y = 0.3333)
                        float lat30S = smoothstep(lineWidth, 0.0, abs(uv.y - 0.3333));
                        allLines = max(allLines, lat30S);

                        // 北纬60° (UV y = 0.8333)
                        float lat60N = smoothstep(lineWidth, 0.0, abs(uv.y - 0.8333));
                        allLines = max(allLines, lat60N);

                        // 南纬60° (UV y = 0.1667)
                        float lat60S = smoothstep(lineWidth, 0.0, abs(uv.y - 0.1667));
                        allLines = max(allLines, lat60S);

                        // 本初子午线 0° 加粗（UV x=0 或 x=1）
                        float primeMeridian = smoothstep(lineWidth * 2.5, 0.0, min(abs(uv.x), 1.0 - uv.x));
                        allLines = max(allLines, primeMeridian * 0.8);

                        // 180°经线 加粗（UV x=0.5）
                        float meridian180 = smoothstep(lineWidth * 2.5, 0.0, abs(uv.x - 0.5));
                        allLines = max(allLines, meridian180 * 0.8);

                        // ===== 特殊虚线：23.5°回归线 + 66.5°极圈（红色） =====
                        #define DASH_W 0.03
                        #define DASH_G 0.02
                        float dashPat = step(DASH_G, mod(uv.x, DASH_W + DASH_G));

                        // 北回归线 23.5°N (y=0.6306)
                        float trCancer = smoothstep(lineWidth * 2.0, 0.0, abs(uv.y - 0.6306)) * dashPat;
                        // 南回归线 23.5°S (y=0.3694)
                        float trCapricorn = smoothstep(lineWidth * 2.0, 0.0, abs(uv.y - 0.3694)) * dashPat;
                        // 北极圈 66.5°N (y=0.8694)
                        float arctic = smoothstep(lineWidth * 2.0, 0.0, abs(uv.y - 0.8694)) * dashPat;
                        // 南极圈 66.5°S (y=0.1306)
                        float antarctic = smoothstep(lineWidth * 2.0, 0.0, abs(uv.y - 0.1306)) * dashPat;

                        float dashedLines = max(max(trCancer, trCapricorn), max(arctic, antarctic));
                        allLines = max(allLines, dashedLines);

                        // ===== 颜色分层 =====
                        // 基础网格：金色
                        gridColor = vec3(0.9, 0.75, 0.2) * allLines;

                        // 赤道 + 0°经线 + 180°经线：更亮金色
                        gridColor = mix(gridColor, vec3(1.0, 0.95, 0.5),
                            max(equator, max(primeMeridian, meridian180)) * 0.8);

                        // 23.5° / 66.5° 虚线：红色覆盖
                        gridColor = mix(gridColor, vec3(1.0, 0.25, 0.15), dashedLines);

                        return gridColor;
                    }

                    void main() {
                        // 计算太阳光照强度（用于昼夜分界线）
                        float intensity = dot(vNormal, sunDirection);

                        // 获取白天和夜晚纹理颜色
                        vec4 dayColor = texture2D(dayTexture, vUv);
                        vec4 nightColor = texture2D(nightTexture, vUv);

                        // 晨昏线过渡（更锐利的过渡使极昼极夜边界清晰可见）
                        // 夏至日晨昏线精确切于北极圈(66.5°N)，冬至日切于南极圈(66.5°S)
                        float mixFactor = smoothstep(-0.05, 0.12, intensity);

                        // 最终颜色：白天侧显示日间纹理，夜间侧显示城市灯光
                        vec4 finalColor = mix(nightColor * 1.2, dayColor, mixFactor);

                        // 夜晚侧：大幅提高亮度，清晰显示各大洲和海洋轮廓
                        if (intensity < 0.0) {
                            // 黑夜部分：叠加白天纹理的40%亮度，确保能看清大洲和海洋
                            float nightFactor = 0.4 + intensity * 0.2;
                            // 混合城市灯光和白天纹理，白天纹理占主导
                            finalColor.rgb = mix(dayColor.rgb * nightFactor, nightColor.rgb * 0.8, 0.3);
                        }

                        // 叠加经纬网（通过showGrid控制显示/隐藏）
                        if (showGrid > 0.5) {
                            vec3 gridColor = drawGrid(vUv, 0.006);
                            // 叠加模式：网格线与底色混合
                            finalColor.rgb = mix(finalColor.rgb, gridColor, gridColor.r * 0.7);
                        }

                        gl_FragColor = finalColor;
                    }
                `
            });

            earth = new THREE.Mesh(earthGeometry, earthMaterial);
            // earth 自身不再有旋转，旋转由父级 tiltGroup 统一管理
            earthGroup.add(earth);
            earthGroup.position.set(0, 0, 0);

            // 创建统一倾斜组：地轴倾斜23.5°的唯一来源
            const TILT = 23.5 * Math.PI / 180;
            window.tiltGroup = new THREE.Group();
            window.tiltGroup.rotation.z = -TILT; // 北偏东倾斜（唯一倾斜源）
            earthGroup.add(window.tiltGroup);

            // 将 earth 移入 tiltGroup（从 earthGroup 中移除后加入）
            earthGroup.remove(earth);
            window.tiltGroup.add(earth);

            scene.add(earthGroup);

            // 添加云层球体
            createClouds();
            
            // 创建月球（默认隐藏）
            createMoon();
        }

        // ==================== 创建月球 ====================
        let moon = null;
        let moonGroup = null;
        let moonPhaseAngle = 0;
        let showMoon = false;
        
        function createMoon() {
            moonGroup = new THREE.Group();
            
            // 月球几何体
            const moonGeometry = new THREE.SphereGeometry(0.4, 64, 64);
            
            // 创建月球着色器材质（实现月相效果）
            const moonMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    sunDirection: { value: new THREE.Vector3(1, 0, 0).normalize() },
                    moonColor: { value: new THREE.Color(0xcccccc) },
                    darkColor: { value: new THREE.Color(0x333333) }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    
                    void main() {
                        vNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
                        vPosition = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 sunDirection;
                    uniform vec3 moonColor;
                    uniform vec3 darkColor;
                    
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    
                    void main() {
                        // 计算法向量与太阳方向的点积
                        float dotProduct = dot(normalize(vNormal), normalize(sunDirection));
                        
                        // 使用smoothstep实现柔和的昼夜过渡
                        float brightness = smoothstep(-0.1, 0.1, dotProduct);
                        
                        // 混合亮面和暗面颜色
                        vec3 finalColor = mix(darkColor, moonColor, brightness);
                        
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `
            });
            
            moon = new THREE.Mesh(moonGeometry, moonMaterial);
            
            // 添加月球光晕
            const glowGeometry = new THREE.SphereGeometry(0.43, 32, 32);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffcc,
                transparent: true,
                opacity: 0.15,
                side: THREE.BackSide
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            moon.add(glow);
            
            moonGroup.add(moon);
            moonGroup.visible = false;
            earthGroup.add(moonGroup);
        }

        // ==================== 月相控制函数 ====================
        function toggleMoon() {
            showMoon = !showMoon;
            if (moonGroup) {
                moonGroup.visible = showMoon;

            const statusEl = document.getElementById('moonStatus');
            const btnEl = document.getElementById('moonBtn');
            if (statusEl) {
                statusEl.textContent = showMoon ? '开启' : '关闭';
            }
            if (btnEl) {
                btnEl.classList.toggle('active', showMoon);
            }
        }

        // ==================== 创建云层 ====================
        function createClouds() {

        // ==================== 创建经纬网3D文字标签 ====================
        let gridLabelsGroup; // 存放所有3D标签的组
        const latLabelData = [
            { text: '0°',     lat: 0,    color: '#f5e050', isSpecial: false },
            { text: '30°N',  lat: 30,   color: '#c9a82c', isSpecial: false },
            { text: '30°S',  lat: -30,  color: '#c9a82c', isSpecial: false },
            { text: '60°N',  lat: 60,   color: '#c9a82c', isSpecial: false },
            { text: '60°S',  lat: -60,  color: '#c9a82c', isSpecial: false },
            { text: '23.5°N', lat: 23.5, color: '#ff4026', isSpecial: true },
            { text: '23.5°S', lat: -23.5,color: '#ff4026', isSpecial: true },
            { text: '66.5°N', lat: 66.5, color: '#ff4026', isSpecial: true },
            { text: '66.5°S', lat: -66.5,color: '#ff4026', isSpecial: true }
        ];
        // 经线标签数据（放在赤道位置）
        const lonLabelData = [
            { text: '0°',   lon: 0,   color: '#f5e050' },   // 本初子午线
            { text: '180°', lon: 180, color: '#f5e050' }   // 180°经线
        ];

        function createGridLabels() {
            gridLabelsGroup = new THREE.Group();
            gridLabelsGroup.name = 'gridLabels';
            earth.add(gridLabelsGroup);
            gridLabelsGroup.visible = false;

            // 地球半径（稍大于地球表面，避免z-fighting）
            const R = 1.52;

            // 注意：gridLabelsGroup 是 earth 的子对象，
            // earth 已有 rotation.z = -23.5°（地轴倾斜），
            // 所有子对象会自动继承此旋转，无需手动再变换！
            // 标准球面坐标（Y轴为极轴）直接使用即可，极点自然与地轴重合。

            // ===== 创建纬度标签 =====
            latLabelData.forEach(item => {
                const latRad = item.lat * Math.PI / 180;
                const lonRad = 0; // 放在本初子经线正前方

                // 标准球面坐标（Y轴为极轴），由父级 tiltGroup 统一倾斜，极点自然与地轴重合
                const x = R * Math.cos(latRad) * Math.sin(lonRad);
                const y = R * Math.sin(latRad);
                const z = R * Math.cos(latRad) * Math.cos(lonRad);

                createLabelSprite(x, y, z, item.text, item.color, gridLabelsGroup);
            });

            // ===== 创建经度标签（精确匹配着色器UV经线位置） =====
            const latOffset = 8 * Math.PI / 180; // 北纬8°，避免赤道遮挡
            const Ry = R * Math.sin(latOffset);
            const Rxz = R * Math.cos(latOffset);

            lonLabelData.forEach(item => {
                let x, y, z;
                if (item.lon === 0) {
                    // 本初子午线：着色器 uv.x=0/1 → 球体 +X 轴方向
                    x = Rxz; y = Ry; z = 0;
                } else {
                    // 180°经线：着色器 uv.x=0.5 → 球体 −X 轴方向
                    x = -Rxz; y = Ry; z = 0;
                }
                createLabelSprite(x, y, z, item.text, item.color, gridLabelsGroup);
            });
        }

        // 创建单个3D文字标签Sprite的通用函数
        function createLabelSprite(x, y, z, text, color, parent) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 128;
            canvas.height = 48;

            // 绘制背景圆角矩形
            ctx.fillStyle = 'rgba(10, 14, 39, 0.75)';
            roundRect(ctx, 4, 4, canvas.width - 8, canvas.height - 8, 8);
            ctx.fill();

            // 绘制边框
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            roundRect(ctx, 4, 4, canvas.width - 8, canvas.height - 8, 8);
            ctx.stroke();

            // 绘制文字
            ctx.font = 'bold 22px Orbitron, monospace';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;

            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: true,
                depthWrite: false
            });

            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.position.set(x, y, z);
            sprite.scale.set(0.55, 0.21, 1);

            parent.add(sprite);
        }

        // 圆角矩形辅助函数
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // ==================== 创建大气层 ====================
        function createAtmosphere() {
            const atmosphereGeometry = new THREE.SphereGeometry(1.58, 64, 64);
            
            // 大气着色器材质
            const atmosphereMaterial = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vNormal;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    void main() {
                        float intensity = pow(0.65 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                        gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity * 0.8;
                    }
                `,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                transparent: true
            });

            atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
            earthGroup.add(atmosphere);
        }

        // ==================== 创建公转轨道线 ====================
        function createOrbitLine() {
            const orbitRadius = 8;
            const segments = 128;
            const orbitGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array((segments + 1) * 3);

            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                // 与地球位置公式一致：x=sin(angle), z=cos(angle)
                positions[i * 3] = Math.sin(angle) * orbitRadius;
                positions[i * 3 + 1] = 0;
                positions[i * 3 + 2] = Math.cos(angle) * orbitRadius;
            }

            orbitGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const orbitMaterial = new THREE.LineBasicMaterial({
                color: 0x00d4ff,
                transparent: true,
                opacity: 0.25,
                linewidth: 1
            });

            orbitLine = new THREE.LineLoop(orbitGeometry, orbitMaterial);
            orbitLine.visible = false;
            scene.add(orbitLine);
        }

        // ==================== 创建轨道节气标记（春分、夏至、秋分、冬至） ====================
        // 轨道参数：逆时针公转，地球位置公式：x=sin(angle), z=cos(angle)
        // 图片中的位置（逆时针顺序）：春分(下)→夏至(右)→秋分(上)→冬至(左)
        const solarTerms = [
            { name: '春分', angle: Math.PI,       color: '#4ade80', desc: '昼夜平分，晨昏线过两极' },   // 底部 -Z (index 0)

            { name: '秋分', angle: 0,             color: '#22c55e', desc: '昼夜平分，晨昏线过两极' },   // 顶部 +Z (index 2)
            { name: '冬至', angle: Math.PI/2,     color: '#3b82f6', desc: '南半球白昼最长' }           // 右侧 +X (index 3)

        let solarTermMarkers = []; // 存储标记引用

        function createSolarTermMarkers() {
