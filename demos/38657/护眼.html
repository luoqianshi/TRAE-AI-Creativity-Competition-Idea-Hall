<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极目远眺 - 眼睛休息提醒</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #FF9A8B 0%, #FF6B6B 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease;
        }

        body.resting {
            background: linear-gradient(135deg, #6BCB77 0%, #4ECDC4 100%);
        }

        .header {
            text-align: center;
            padding: 40px 20px 20px;
            color: white;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .eye-container {
            width: 150px;
            height: 150px;
            margin-bottom: 30px;
            position: relative;
        }

        .eye {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            animation: blink 3s infinite;
        }

        .eye.closed {
            animation: none;
            transform: scaleY(0.1);
            transition: transform 0.3s;
        }

        .eye-ball {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #333, #000);
            border-radius: 50%;
        }

        .eye-ball::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            margin-left: 10px;
            margin-top: 10px;
        }

        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0.1); }
        }

        .timer-display {
            font-size: 80px;
            font-weight: bold;
            color: white;
            font-family: 'Courier New', monospace;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            letter-spacing: 5px;
        }

        .mode-label {
            font-size: 20px;
            color: white;
            margin-bottom: 30px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        .reminder-section {
            display: none;
            text-align: center;
            margin-bottom: 30px;
        }

        .reminder-section.active {
            display: block;
        }

        .reminder-text {
            font-size: 28px;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .rest-hint {
            font-size: 16px;
            color: white;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }

        .btn {
            padding: 18px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: white;
            color: #FF6B6B;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
        }

        .stats {
            display: flex;
            gap: 50px;
            margin-top: 40px;
            padding: 20px 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .stat-item {
            text-align: center;
            color: white;
        }

        .stat-number {
            display: block;
            font-size: 32px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .bottom-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: rgba(0,0,0,0.1);
        }

        .nav-btn {
            padding: 12px 25px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav-btn:active {
            background: rgba(255,255,255,0.3);
        }

        .settings-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            display: none;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
        }

        .settings-panel.active {
            display: block;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #333;
        }

        .settings-header h2 {
            font-size: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: #999;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }

        .setting-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .minus-btn, .plus-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: #f0f0f0;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .minus-btn:active, .plus-btn:active {
            background: #e0e0e0;
        }

        .setting-control span {
            font-size: 20px;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 30px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: #FF6B6B;
        }

        input:checked + .toggle-slider:before {
            transform: translateX(30px);
        }

        .setting-item input[type="text"] {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            width: 200px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            color: #333;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .modal-content p {
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .vibrate-effect {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            display: none;
            z-index: 3000;
            animation: vibrateAnim 0.2s infinite;
        }

        .vibrate-effect.active {
            display: block;
        }

        @keyframes vibrateAnim {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-48%, -52%) rotate(-10deg); }
            75% { transform: translate(-52%, -48%) rotate(10deg); }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 24px;
            }

            .timer-display {
                font-size: 60px;
            }

            .reminder-text {
                font-size: 22px;
            }

            .btn {
                font-size: 16px;
                padding: 15px 25px;
            }

            .setting-item input[type="text"] {
                width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>👁️ 极目远眺</h1>
        <p>保护眼睛，从现在开始</p>
    </div>

    <div class="main-content">
        <div class="eye-container">
            <div class="eye" id="eye">
                <div class="eye-ball"></div>
            </div>
        </div>

        <div class="timer-display" id="timer">20:00</div>
        <div class="mode-label" id="modeLabel">准备开始工作</div>

        <div class="reminder-section" id="reminderSection">
            <div class="reminder-text" id="reminderText">极目远眺20秒！</div>
            <div class="rest-hint">请望向6米外的远方 🏞️</div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn">▶️ 开始计时</button>
            <button class="btn btn-secondary" id="resetBtn">🔄 重置</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" id="todayCycles">0</span>
                <span class="stat-label">今日周期</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="totalCycles">0</span>
                <span class="stat-label">累计周期</span>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn" id="settingsBtn">⚙️ 设置</button>
        <button class="nav-btn" id="helpBtn">❓ 帮助</button>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h2>⚙️ 设置</h2>
            <button class="close-btn" id="closeSettingsBtn">✕</button>
        </div>
        <div class="setting-item">
            <label>💼 工作时长</label>
            <div class="setting-control">
                <button class="minus-btn" id="workMinusBtn">−</button>
                <span id="workDurationDisplay">20</span>分钟
                <button class="plus-btn" id="workPlusBtn">+</button>
            </div>
        </div>
        <div class="setting-item">
            <label>🌿 休息时长</label>
            <div class="setting-control">
                <button class="minus-btn" id="restMinusBtn">−</button>
                <span id="restDurationDisplay">20</span>秒
                <button class="plus-btn" id="restPlusBtn">+</button>
            </div>
        </div>
        <div class="setting-item">
            <label>📳 震动提醒</label>
            <label class="toggle-switch">
                <input type="checkbox" id="vibrationToggle" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="setting-item">
            <label>💬 提醒语</label>
            <input type="text" id="customReminder" value="极目远眺20秒！" placeholder="输入自定义提醒语">
        </div>
    </div>

    <div class="modal" id="helpModal">
        <div class="modal-content">
            <h3>❓ 使用帮助</h3>
            <p><strong>📱 使用方法：</strong></p>
            <p>1. 点击"开始计时"按钮</p>
            <p>2. 专注工作20分钟</p>
            <p>3. 时间到后会震动提醒</p>
            <p>4. 休息20秒，看远放松眼睛</p>
            <p>5. 自动进入下一个循环</p>
            <br>
            <p><strong>💡 小贴士：</strong></p>
            <p>根据20-20-20护眼法则：每工作20分钟，看20英尺(6米)外的物体20秒，可以有效缓解眼部疲劳。</p>
        </div>
    </div>

    <div class="vibrate-effect" id="vibrateEffect">📳</div>

    <script>
        // 全局变量
        let timerInterval = null;
        let isRunning = false;
        let isWorkMode = true;
        let timeRemaining = 20 * 60;
        let workDuration = 20 * 60;
        let restDuration = 20;
        let vibrationEnabled = true;
        let todayCycles = 0;
        let totalCycles = 0;

        // DOM元素
        const timerDisplay = document.getElementById('timer');
        const modeLabel = document.getElementById('modeLabel');
        const eye = document.getElementById('eye');
        const reminderSection = document.getElementById('reminderSection');
        const reminderText = document.getElementById('reminderText');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const helpBtn = document.getElementById('helpBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const helpModal = document.getElementById('helpModal');
        const vibrationToggle = document.getElementById('vibrationToggle');
        const customReminderInput = document.getElementById('customReminder');
        const workDurationDisplay = document.getElementById('workDurationDisplay');
        const restDurationDisplay = document.getElementById('restDurationDisplay');
        const workMinusBtn = document.getElementById('workMinusBtn');
        const workPlusBtn = document.getElementById('workPlusBtn');
        const restMinusBtn = document.getElementById('restMinusBtn');
        const restPlusBtn = document.getElementById('restPlusBtn');
        const vibrateEffect = document.getElementById('vibrateEffect');

        // 格式化时间显示
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return mins.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
        }

        // 更新UI
        function updateUI() {
            if (isWorkMode) {
                document.body.classList.remove('resting');
                eye.classList.remove('closed');
                reminderSection.classList.remove('active');
                timerDisplay.textContent = formatTime(timeRemaining);
                if (isRunning) {
                    modeLabel.textContent = '💼 专注工作中';
                } else {
                    modeLabel.textContent = '准备开始工作';
                }
            } else {
                document.body.classList.add('resting');
                eye.classList.add('closed');
                reminderSection.classList.add('active');
                timerDisplay.textContent = timeRemaining;
                modeLabel.textContent = '🌿 放松眼睛中';
            }
        }

        // 更新按钮状态
        function updateButton() {
            if (isRunning) {
                startBtn.textContent = '⏸️ 暂停';
            } else {
                startBtn.textContent = '▶️ 开始计时';
            }
        }

        // 更新统计
        function updateStats() {
            document.getElementById('todayCycles').textContent = todayCycles;
            document.getElementById('totalCycles').textContent = totalCycles;
        }

        // 震动功能
        function vibrate(duration) {
            if (vibrationEnabled && navigator.vibrate) {
                navigator.vibrate(duration);
            }
        }

        // 显示震动效果
        function showVibrateEffect() {
            vibrateEffect.classList.add('active');
            setTimeout(function() {
                vibrateEffect.classList.remove('active');
            }, 3000);
        }

        // 切换计时器
        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        // 开始计时
        function startTimer() {
            if (timeRemaining === 0) {
                timeRemaining = workDuration;
            }
            isRunning = true;
            updateButton();
            updateUI();
            
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            
            timerInterval = setInterval(function() {
                if (timeRemaining > 0) {
                    timeRemaining--;
                    updateUI();
                    
                    if (isWorkMode && timeRemaining === 5 && vibrationEnabled) {
                        vibrate(200);
                    }
                } else {
                    switchMode();
                }
            }, 1000);
        }

        // 暂停计时
        function pauseTimer() {
            isRunning = false;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            updateButton();
            updateUI();
        }

        // 重置计时器
        function resetTimer() {
            pauseTimer();
            isWorkMode = true;
            timeRemaining = workDuration;
            updateUI();
        }

        // 切换模式
        function switchMode() {
            if (isWorkMode) {
                startRest();
            } else {
                startWork();
            }
        }

        // 开始休息
        function startRest() {
            isWorkMode = false;
            timeRemaining = restDuration;
            reminderText.textContent = customReminderInput.value || '极目远眺20秒！';
            
            if (vibrationEnabled) {
                vibrate(2000);
                showVibrateEffect();
            }
            
            updateUI();
        }

        // 开始工作
        function startWork() {
            isWorkMode = true;
            timeRemaining = workDuration;
            todayCycles++;
            totalCycles++;
            updateStats();
            updateUI();
        }

        // 调整工作时长
        function adjustWorkDuration(delta) {
            let mins = Math.floor(workDuration / 60) + delta;
            if (mins >= 5 && mins <= 60) {
                workDuration = mins * 60;
                workDurationDisplay.textContent = mins;
                if (isWorkMode && !isRunning) {
                    timeRemaining = workDuration;
                    updateUI();
                }
            }
        }

        // 调整休息时长
        function adjustRestDuration(delta) {
            let secs = restDuration + delta;
            if (secs >= 10 && secs <= 120) {
                restDuration = secs;
                restDurationDisplay.textContent = secs;
            }
        }

        // 切换震动
        function toggleVibration() {
            vibrationEnabled = vibrationToggle.checked;
        }

        // 打开设置
        function openSettings() {
            settingsPanel.classList.add('active');
        }

        // 关闭设置
        function closeSettings() {
            settingsPanel.classList.remove('active');
        }

        // 关闭帮助
        function closeHelp() {
            helpModal.classList.remove('active');
        }

        // 事件监听器
        startBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);
        settingsBtn.addEventListener('click', openSettings);
        helpBtn.addEventListener('click', function() {
            helpModal.classList.add('active');
        });
        closeSettingsBtn.addEventListener('click', closeSettings);
        vibrationToggle.addEventListener('change', toggleVibration);
        workMinusBtn.addEventListener('click', function() {
            adjustWorkDuration(-1);
        });
        workPlusBtn.addEventListener('click', function() {
            adjustWorkDuration(1);
        });
        restMinusBtn.addEventListener('click', function() {
            adjustRestDuration(-5);
        });
        restPlusBtn.addEventListener('click', function() {
            adjustRestDuration(5);
        });
        helpModal.addEventListener('click', function(e) {
            if (e.target === helpModal) {
                closeHelp();
            }
        });

        // 初始化UI
        updateUI();
        updateButton();

        console.log('极目远眺 - 应用已启动');
    </script>
</body>
</html>
