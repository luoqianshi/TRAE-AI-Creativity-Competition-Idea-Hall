<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点子成型 · 把一句话灵感，问成一份清晰的项目说明书</title>
<style>
  :root{
    --paper:#f7f4ee;
    --paper-2:#fffdf9;
    --ink:#23211c;
    --ink-2:#56514a;
    --ink-3:#8a847a;
    --line:#e3ddd1;
    --line-2:#d3ccbd;
    --accent:#b4541f;        /* 克制的赭石/陶土 */
    --accent-soft:#f0e3d6;
    --ok:#3f6b4a;
    --shadow:0 1px 2px rgba(35,33,28,.04), 0 8px 30px rgba(35,33,28,.06);
    --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    line-height:1.7;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 22px}

  /* ---- header ---- */
  header{padding:54px 0 30px;text-align:center}
  .kicker{
    font-size:13px;letter-spacing:.22em;color:var(--accent);
    text-transform:uppercase;font-weight:600;margin-bottom:18px;
  }
  h1{
    font-family:var(--serif);font-weight:600;
    font-size:clamp(30px,6vw,44px);line-height:1.2;letter-spacing:.01em;
  }
  .sub{margin-top:16px;color:var(--ink-2);font-size:clamp(15px,2.4vw,17px);max-width:30em;margin-left:auto;margin-right:auto}
  .sub b{color:var(--ink);font-weight:600}

  /* ---- progress ---- */
  .progress{display:flex;align-items:center;gap:10px;margin:0 auto 26px;max-width:720px;padding:0 22px}
  .bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .step-n{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---- card ---- */
  .card{
    background:var(--paper-2);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:34px 32px;
  }
  @media(max-width:560px){.card{padding:26px 20px}}

  .q-eyebrow{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.04em;margin-bottom:10px}
  .q-title{font-family:var(--serif);font-size:clamp(21px,4vw,27px);font-weight:600;line-height:1.35}
  .q-hint{color:var(--ink-2);font-size:14.5px;margin-top:10px}
  .q-eg{color:var(--ink-3);font-size:13.5px;margin-top:6px;font-style:italic}

  textarea,input[type=text]{
    width:100%;margin-top:22px;font-family:var(--sans);font-size:16.5px;color:var(--ink);
    background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:14px 15px;
    resize:vertical;line-height:1.6;transition:border-color .2s,box-shadow .2s;
  }
  textarea{min-height:108px}
  textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  ::placeholder{color:#b7b0a4}

  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
  .chip{
    font-family:var(--sans);font-size:14.5px;color:var(--ink-2);cursor:pointer;
    background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:9px 16px;
    transition:all .18s;user-select:none;
  }
  .chip:hover{border-color:var(--accent);color:var(--ink)}
  .chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---- nav ---- */
  .nav{display:flex;align-items:center;justify-content:space-between;margin-top:30px;gap:14px}
  button{font-family:var(--sans);cursor:pointer;border:none;border-radius:10px;font-size:15px;font-weight:600;transition:all .18s}
  .btn-primary{background:var(--ink);color:#fff;padding:12px 26px}
  .btn-primary:hover{background:var(--accent)}
  .btn-primary:disabled{background:var(--line-2);cursor:not-allowed;color:#fff}
  .btn-ghost{background:transparent;color:var(--ink-3);padding:12px 8px}
  .btn-ghost:hover{color:var(--ink)}
  .btn-skip{background:transparent;color:var(--ink-3);font-weight:500;font-size:14px;padding:12px 6px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
  .btn-skip:hover{color:var(--ink-2)}

  /* ---- result ---- */
  .result{display:none}
  .result.show{display:block;animation:rise .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .doc{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:38px 36px}
  @media(max-width:560px){.doc{padding:26px 20px}}
  .doc h2{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.3}
  .doc .meta{color:var(--ink-3);font-size:13.5px;margin-top:8px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px}
  .sec{margin-bottom:24px}
  .sec h3{font-size:13px;letter-spacing:.04em;color:var(--accent);font-weight:700;margin-bottom:9px}
  .sec p{color:var(--ink);font-size:15.5px}
  .sec p + p{margin-top:7px}
  .sec .label{color:var(--ink-3);font-weight:600}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .tag{font-size:13px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:4px 11px;font-weight:600}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;align-items:center}
  .btn-tool{background:#fff;border:1px solid var(--line-2);color:var(--ink-2);padding:10px 18px;font-size:14px}
  .btn-tool:hover{border-color:var(--accent);color:var(--ink)}
  .switcher{display:flex;background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:3px;margin:0 auto 22px;width:fit-content}
  .switcher button{background:transparent;color:var(--ink-3);padding:8px 18px;font-size:14px;border-radius:7px;font-weight:600}
  .switcher button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}

  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
    background:var(--ink);color:#fff;font-size:14px;padding:11px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  footer{text-align:center;color:var(--ink-3);font-size:12.5px;padding:40px 0 50px;line-height:1.8}
  footer a{color:var(--ink-2)}
  .pre{white-space:pre-wrap;font-family:var(--sans);font-size:14.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px 18px;line-height:1.75}
</style>
</head>
<body>

<header class="wrap">
  <div class="kicker">点子成型 · idea shaper</div>
  <h1>把一句话灵感<br>问成一份清晰的项目说明书</h1>
  <p class="sub">有想法，但一开口就说不清楚？这里像一位耐心的产品经理，用几个小问题陪你一步步把它<b>想透、写清</b>——再去落地或交给 AI，就不容易跑偏了。</p>
</header>

<div class="progress" id="progress" hidden>
  <div class="bar"><i id="barFill"></i></div>
  <span class="step-n" id="stepN">1 / 8</span>
</div>

<main class="wrap">
  <!-- 问答卡 -->
  <section class="card" id="qcard">
    <div class="q-eyebrow" id="qEyebrow">第 1 步</div>
    <div class="q-title" id="qTitle"></div>
    <div class="q-hint" id="qHint"></div>
    <div class="q-eg" id="qEg"></div>
    <div id="qInput"></div>
    <div class="nav">
      <button class="btn-ghost" id="btnBack" hidden>← 上一步</button>
      <div style="flex:1"></div>
      <button class="btn-skip" id="btnSkip" hidden>跳过</button>
      <button class="btn-primary" id="btnNext">开始 →</button>
    </div>
  </section>

  <!-- 结果 -->
  <section class="result" id="result">
    <div class="switcher">
      <button id="tabDoc" aria-pressed="true">项目说明书</button>
      <button id="tabPost" aria-pressed="false">比赛报名帖</button>
    </div>

    <div class="doc" id="docView">
      <h2 id="docName">我的创意</h2>
      <div class="meta" id="docMeta"></div>
      <div class="sec"><h3>一句话介绍</h3><p id="oIntro"></p></div>
      <div class="sec"><h3>想解决的问题</h3><p id="oProblem"></p></div>
      <div class="sec"><h3>灵感来源</h3><p id="oWhy"></p></div>
      <div class="sec"><h3>产品形态</h3><p id="oForm"></p></div>
      <div class="sec"><h3>目标用户与场景</h3><p id="oUsers"></p><p id="oScene"></p></div>
      <div class="sec"><h3>当前痛点</h3><p id="oPain"></p></div>
      <div class="sec"><h3>价值与意义</h3><div class="tags" id="oValueTags"></div><p id="oValue" style="margin-top:10px"></p></div>
    </div>

    <div class="doc" id="postView" hidden>
      <h2 style="font-size:22px">可直接粘贴的报名帖</h2>
      <div class="meta">已按 TRAE 比赛要求排好：标题 + 标签 + 正文四段。复制后微调即可。</div>
      <div class="pre" id="postText"></div>
    </div>

    <div class="toolbar">
      <button class="btn-tool" id="btnCopy">复制全文</button>
      <button class="btn-tool" id="btnDownload">下载 .txt</button>
      <button class="btn-tool" id="btnEdit">← 回去修改</button>
      <button class="btn-tool" id="btnRestart">重新开始</button>
    </div>
  </section>
</main>

<footer class="wrap">
  纯网页工具 · 打开即用 · 无需注册 · 所有内容只存在你自己的浏览器里<br>
  灵感源自「先把需求问清楚，再动手」的协作方法
</footer>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);

  // ---- 问题流（借鉴 OpenPRD 的「澄清优先」，蒸馏成 8 个普通人能答的小问题）----
  const STEPS = [
    { key:'seed', type:'text', eyebrow:'第 1 步 · 起点',
      title:'用一句话，说说你的创意是什么？',
      hint:'不用完美，先把脑子里的那个念头写下来。',
      eg:'例：拍张照就能自动帮孩子整理错题的小程序。',
      ph:'我想做一个…', required:true },
    { key:'problem', type:'text', eyebrow:'第 2 步 · 痛点',
      title:'它想解决什么问题？',
      hint:'你发现了什么不方便、什么需求？',
      eg:'例：家长手动整理错题太费时，孩子也懒得回顾。',
      ph:'它能解决…', required:true },
    { key:'why', type:'text', eyebrow:'第 3 步 · 动机',
      title:'你为什么会想到做这个？',
      hint:'一句话说说动机或灵感来源就好。',
      eg:'例：自己每天给孩子拍错题、剪贴本，太累了。',
      ph:'因为…', required:false },
    { key:'form', type:'chips', multi:false, eyebrow:'第 4 步 · 形态',
      title:'它大概是个什么产品？',
      hint:'选一个最接近的；不确定就先选「网站」。',
      options:['App','小程序','网站','系统/平台','硬件','浏览器插件','其他'], required:true },
    { key:'users', type:'text', eyebrow:'第 5 步 · 用户',
      title:'它主要给谁用？',
      hint:'描述你的核心用户群体。',
      eg:'例：小学到初中孩子的家长，尤其是没空陪学的双职工父母。',
      ph:'主要用户是…', required:true },
    { key:'scene', type:'text', eyebrow:'第 6 步 · 场景',
      title:'用户会在什么情况下用它？',
      hint:'具体的使用场景，越具体越好。',
      eg:'例：每天晚上检查作业、考试后整理卷子的时候。',
      ph:'通常在…的时候用', required:true },
    { key:'pain', type:'text', eyebrow:'第 7 步 · 现状',
      title:'如果没有你的产品，用户现在会怎么办？',
      hint:'说出现在的「不方便」，价值才显出来。',
      eg:'例：现在只能手抄、拍照存相册，乱成一团，根本不会再翻。',
      ph:'现在他们只能…', required:true },
    { key:'value', type:'value', eyebrow:'第 8 步 · 价值',
      title:'它最大的价值是什么？',
      hint:'选 1–2 个角度，再补一句话。',
      options:['效率提升','商业价值','社会价值'],
      ph:'具体来说，它能…（补一句）', required:true },
  ];

  const TRACKS = ['生活娱乐','学习工作','社会服务','硬件交互'];

  const state = { i:0, ans:{}, track:'学习工作', valueTags:[], name:'' };

  // ---- 持久化 ----
  const SK='ideaShaper.v1';
  function save(){ try{ localStorage.setItem(SK, JSON.stringify(state)); }catch(e){} }
  function load(){ try{ const s=JSON.parse(localStorage.getItem(SK)); if(s&&s.ans){Object.assign(state,s);} }catch(e){} }

  // ---- 渲染问题 ----
  const qInput=$('#qInput');
  function renderStep(){
    const st=STEPS[state.i];
    $('#progress').hidden=false;
    $('#qEyebrow').textContent=st.eyebrow;
    $('#qTitle').textContent=st.title;
    $('#qHint').textContent=st.hint||'';
    $('#qEg').textContent=st.eg||'';
    $('#barFill').style.width=((state.i)/(STEPS.length))*100+'%';
    $('#stepN').textContent=(state.i+1)+' / '+STEPS.length;
    $('#btnBack').hidden = state.i===0;
    $('#btnSkip').hidden = st.required;
    $('#btnNext').textContent = state.i===STEPS.length-1 ? '生成说明书 ✓' : '下一步 →';

    qInput.innerHTML='';
    if(st.type==='text'){
      const ta=document.createElement('textarea');
      ta.value=state.ans[st.key]||''; ta.placeholder=st.ph||'';
      ta.addEventListener('input',()=>{state.ans[st.key]=ta.value.trim();updateNext();save();});
      qInput.appendChild(ta); setTimeout(()=>ta.focus(),60);
    } else if(st.type==='chips'){
      const box=document.createElement('div'); box.className='chips';
      st.options.forEach(o=>{
        const c=document.createElement('div'); c.className='chip'; c.textContent=o;
        c.setAttribute('aria-pressed', state.ans[st.key]===o);
        c.onclick=()=>{state.ans[st.key]=o;renderStep();updateNext();save();};
        box.appendChild(c);
      });
      qInput.appendChild(box);
    } else if(st.type==='value'){
      const box=document.createElement('div'); box.className='chips';
      st.options.forEach(o=>{
        const c=document.createElement('div'); c.className='chip'; c.textContent=o;
        c.setAttribute('aria-pressed', state.valueTags.includes(o));
        c.onclick=()=>{
          const k=state.valueTags.indexOf(o);
          if(k>=0) state.valueTags.splice(k,1);
          else { if(state.valueTags.length>=2) state.valueTags.shift(); state.valueTags.push(o);}
          renderStep();updateNext();save();
        };
        box.appendChild(c);
      });
      qInput.appendChild(box);
      const ta=document.createElement('textarea');
      ta.value=state.ans.value||''; ta.placeholder=st.ph||''; ta.style.minHeight='80px';
      ta.addEventListener('input',()=>{state.ans.value=ta.value.trim();updateNext();save();});
      qInput.appendChild(ta);
    }
    updateNext();
  }

  function stepValid(){
    const st=STEPS[state.i];
    if(!st.required) return true;
    if(st.type==='value') return state.valueTags.length>0 && (state.ans.value||'').length>0;
    if(st.type==='chips') return !!state.ans[st.key];
    return (state.ans[st.key]||'').length>0;
  }
  function updateNext(){ $('#btnNext').disabled = !stepValid(); }

  // ---- 导航 ----
  let started=false;
  $('#btnNext').onclick=()=>{
    if(!started){ started=true; renderStep(); return; }
    if(!stepValid()) return;
    if(state.i<STEPS.length-1){ state.i++; renderStep(); window.scrollTo({top:0,behavior:'smooth'}); save(); }
    else { buildResult(); }
  };
  $('#btnBack').onclick=()=>{ if(state.i>0){state.i--;renderStep();save();} };
  $('#btnSkip').onclick=()=>{ if(state.i<STEPS.length-1){state.i++;renderStep();save();} else buildResult(); };

  // ---- 合成 ----
  function suggestName(){
    const seed=state.ans.seed||'';
    return seed.length<=12 ? seed.replace(/[。.!！]$/,'') : '我的创意';
  }
  function txt(s,fallback){ s=(s||'').trim(); return s||fallback||'（待补充）'; }

  function buildResult(){
    state.name = state.name || suggestName();
    $('#qcard').style.display='none';
    $('#progress').hidden=true;
    $('#barFill').style.width='100%';

    $('#docName').textContent = state.name;
    $('#docMeta').textContent = '项目说明书 · 由「点子成型」整理 · '+new Date().toLocaleDateString('zh-CN');
    $('#oIntro').textContent = txt(state.ans.seed,'（一句话创意待补充）');
    $('#oProblem').textContent = txt(state.ans.problem);
    $('#oWhy').textContent = txt(state.ans.why,'（未填写）');
    $('#oForm').textContent = txt(state.ans.form,'网站');
    $('#oUsers').innerHTML = '<span class="label">面向：</span>'+txt(state.ans.users);
    $('#oScene').innerHTML = '<span class="label">场景：</span>'+txt(state.ans.scene);
    $('#oPain').textContent = txt(state.ans.pain);
    const tagsBox=$('#oValueTags'); tagsBox.innerHTML='';
    (state.valueTags.length?state.valueTags:['价值待选']).forEach(t=>{
      const s=document.createElement('span');s.className='tag';s.textContent=t;tagsBox.appendChild(s);
    });
    $('#oValue').textContent = txt(state.ans.value);

    $('#postText').textContent = buildPost();
    $('#result').classList.add('show');
    window.scrollTo({top:0,behavior:'smooth'});
    save();
  }

  function buildPost(){
    const a=state.ans, name=state.name||suggestName();
    const oneLine = txt(a.seed).replace(/[。.！!]\s*$/,'');
    const title = `【${state.track}赛道】${name}——${oneLine}`;
    const valueLines = (state.valueTags.length?state.valueTags:['效率提升'])
      .map(t=>`- ${t}：${txt(a.value)}`).join('\n');
    return (
`【标题】${title}

【标签】${state.track}

【正文】

1. 创意名称 + 创意介绍
${name}：${txt(a.seed)}
- 想解决什么问题：${txt(a.problem)}
- 为什么会想到做：${txt(a.why,'源于自己在这件事上反复遇到的不便。')}
- 大概是什么产品：一个${txt(a.form,'网站')}。

2. 目标用户及痛点
- 面向哪些用户：${txt(a.users)}
- 在什么场景下使用：${txt(a.scene)}
- 当前痛点：${txt(a.pain)}

3. 价值与意义
${valueLines}

4. 创意产物
已上传由 TRAE Work 生成的创意产物 HTML 文件，完整展示本方案的交互效果。`
    );
  }

  // ---- 视图切换 / 工具 ----
  $('#tabDoc').onclick=()=>switchView('doc');
  $('#tabPost').onclick=()=>switchView('post');
  function switchView(v){
    const doc=v==='doc';
    $('#tabDoc').setAttribute('aria-pressed',doc);
    $('#tabPost').setAttribute('aria-pressed',!doc);
    $('#docView').hidden=!doc; $('#postView').hidden=doc;
  }
  function currentText(){
    if($('#postView').hidden){
      const a=state.ans;
      return `# ${state.name}（项目说明书）

一句话介绍：${txt(a.seed)}
想解决的问题：${txt(a.problem)}
灵感来源：${txt(a.why,'未填写')}
产品形态：${txt(a.form,'网站')}
目标用户：${txt(a.users)}
使用场景：${txt(a.scene)}
当前痛点：${txt(a.pain)}
价值与意义（${(state.valueTags.join('、'))||'—'}）：${txt(a.value)}`;
    }
    return buildPost();
  }
  function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
  $('#btnCopy').onclick=async()=>{
    const t=currentText();
    try{await navigator.clipboard.writeText(t);toast('已复制到剪贴板');}
    catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('已复制');}
  };
  $('#btnDownload').onclick=()=>{
    const blob=new Blob([currentText()],{type:'text/plain;charset=utf-8'});
    const u=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=u;a.download=(state.name||'项目说明书')+'.txt';a.click();URL.revokeObjectURL(u);
    toast('已下载');
  };
  $('#btnEdit').onclick=()=>{
    $('#result').classList.remove('show');
    $('#qcard').style.display='block';
    state.i=STEPS.length-1; started=true; renderStep();
    window.scrollTo({top:0,behavior:'smooth'});
  };
  $('#btnRestart').onclick=()=>{
    if(!confirm('清空所有内容，重新开始？'))return;
    localStorage.removeItem(SK);
    state.i=0;state.ans={};state.valueTags=[];state.name='';state.track='学习工作';
    $('#result').classList.remove('show');$('#qcard').style.display='block';
    started=false;$('#qEyebrow').textContent='第 1 步';$('#qTitle').textContent='';
    $('#qHint').textContent='';$('#qEg').textContent='';qInput.innerHTML='';
    $('#btnNext').textContent='开始 →';$('#btnNext').disabled=false;$('#btnBack').hidden=true;$('#btnSkip').hidden=true;
    $('#progress').hidden=true;$('#barFill').style.width='0%';
    window.scrollTo({top:0,behavior:'smooth'});
  };

  // ---- 启动：若有存档，恢复并直接进问答 ----
  load();
  if(Object.keys(state.ans).length>0){
    started=true; renderStep();
  }
})();
</script>
</body>
</html>
