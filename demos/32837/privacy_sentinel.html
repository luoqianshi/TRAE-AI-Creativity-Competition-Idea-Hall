<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI隐私哨兵 - 插件演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0b1120;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* 模拟浏览器插件弹窗 */
        .popup {
            width: 360px;
            background: #141e30;
            border-radius: 16px;
            padding: 24px 20px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
            color: #e8edf5;
            transition: all 0.2s;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .header .icon {
            font-size: 26px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }
        .badge {
            display: inline-block;
            background: rgba(96, 165, 250, 0.15);
            border: 1px solid rgba(96, 165, 250, 0.25);
            border-radius: 20px;
            font-size: 10px;
            padding: 2px 10px;
            color: #93bbfc;
            margin-left: auto;
        }
        .sub {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 18px;
            border-left: 3px solid #3b82f6;
            padding-left: 12px;
        }
        .label {
            font-size: 13px;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 6px;
            display: block;
        }
        textarea {
            width: 100%;
            height: 90px;
            background: #0f172a;
            border: 1px solid #2d3a52;
            border-radius: 10px;
            padding: 12px 14px;
            color: #e2e8f0;
            font-size: 13px;
            resize: vertical;
            outline: none;
            transition: border 0.2s;
            font-family: inherit;
        }
        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        textarea::placeholder {
            color: #475569;
        }
        .btn {
            width: 100%;
            margin-top: 14px;
            padding: 12px 0;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }
        .btn:hover {
            transform: scale(1.01);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.35);
        }
        .btn:active {
            transform: scale(0.97);
        }
        /* 结果卡片 */
        .result {
            margin-top: 18px;
            background: #0f172a;
            border-radius: 12px;
            padding: 16px 16px 18px;
            display: none;
            border: 1px solid #2d3a52;
        }
        .result.show {
            display: block;
            animation: fadeUp 0.35s ease;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .risk-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .risk-label {
            font-size: 14px;
            color: #94a3b8;
        }
        .risk-value {
            font-size: 20px;
            font-weight: 700;
        }
        .risk-low .risk-value { color: #4ade80; }
        .risk-medium .risk-value { color: #facc15; }
        .risk-high .risk-value { color: #f87171; }
        .divider {
            height: 1px;
            background: #2d3a52;
            margin: 12px 0;
        }
        .detail {
            font-size: 13px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .detail .emoji {
            font-size: 16px;
        }
        .suggestion {
            margin-top: 10px;
            background: rgba(251, 191, 36, 0.08);
            border-left: 3px solid #facc15;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            color: #fde047;
        }
        .footer-note {
            margin-top: 14px;
            font-size: 11px;
            color: #475569;
            text-align: center;
            border-top: 1px solid #1e293b;
            padding-top: 14px;
        }
        .footer-note span {
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="popup">
    <!-- 头部 -->
    <div class="header">
        <span class="icon">🛡️</span>
        <h1>AI隐私哨兵</h1>
        <span class="badge">v1.0 原型</span>
    </div>
    <div class="sub">实时检测 · 本地处理 · 数据不上云</div>

    <!-- 输入区 -->
    <label class="label">✏️ 输入要发送给AI的内容</label>
    <textarea id="userInput" placeholder="例如：我的数据库密码是 admin123，服务器地址是 10.0.0.1 ...">我的数据库密码是 Admin@2024，API密钥是 sk-1234567890abcdef</textarea>

    <!-- 检测按钮 -->
    <button class="btn" id="detectBtn">🔍 检测风险</button>

    <!-- 结果展示 -->
    <div class="result" id="resultBox">
        <div class="risk-row" id="riskRow">
            <span class="risk-label">🛡️ 风险等级</span>
            <span class="risk-value" id="riskLevel">高风险</span>
        </div>
        <div class="divider"></div>
        <div class="detail">
            <span class="emoji">⚡</span>
            <span>检测到敏感信息：<strong id="sensitiveItems">密码、API密钥</strong></span>
        </div>
        <div class="suggestion">
            💡 <strong>脱敏建议：</strong>将 "Admin@2024" 替换为 "****"，将 "sk-1234567890abcdef" 替换为 "sk-****"
        </div>
    </div>

    <div class="footer-note">
        <span>🔒 所有检测在本地完成，数据不会上传至任何服务器</span>
    </div>
</div>

<script>
    const input = document.getElementById('userInput');
    const btn = document.getElementById('detectBtn');
    const resultBox = document.getElementById('resultBox');
    const riskLevel = document.getElementById('riskLevel');
    const sensitiveItems = document.getElementById('sensitiveItems');

    // 模拟检测逻辑（前端演示）
    function detectRisk(text) {
        const patterns = [
            { keyword: 'password', label: '密码' },
            { keyword: 'passwd', label: '密码' },
            { keyword: 'api.key', label: 'API密钥' },
            { keyword: 'sk-', label: 'API密钥' },
            { keyword: 'secret', label: '密钥' },
            { keyword: 'token', label: 'Token' },
            { keyword: '身份证', label: '身份证号' },
            { keyword: '手机号', label: '手机号' },
            { keyword: 'Admin@', label: '管理员密码' },
            { keyword: '123456', label: '弱密码' },
            { keyword: '10.0.', label: '内网IP' },
            { keyword: '192.168.', label: '内网IP' },
        ];

        let found = [];
        for (let p of patterns) {
            if (text.toLowerCase().includes(p.keyword.toLowerCase())) {
                found.push(p.label);
            }
        }
        // 去重
        found = [...new Set(found)];

        let level = '低风险';
        let score = 0;
        if (found.length === 0) { level = '低风险'; score = 1; }
        else if (found.length <= 2) { level = '中风险'; score = 2; }
        else { level = '高风险'; score = 3; }

        return { level, items: found.length > 0 ? found.join('、') : '未检测到明显敏感信息', score };
    }

    btn.addEventListener('click', function() {
        const text = input.value.trim();
        if (!text) {
            alert('请先输入一些文本进行检测！');
            return;
        }

        const result = detectRisk(text);

        // 更新UI
        riskLevel.textContent = result.level;
        sensitiveItems.textContent = result.items || '未检测到明显敏感信息';

        // 根据风险等级改变颜色
        const row = document.getElementById('riskRow');
        row.className = 'risk-row';
        if (result.level === '低风险') row.classList.add('risk-low');
        else if (result.level === '中风险') row.classList.add('risk-medium');
        else if (result.level === '高风险') row.classList.add('risk-high');

        // 显示结果
        resultBox.classList.add('show');
    });

    // 按回车也可以触发检测（Ctrl+Enter 或 Cmd+Enter）
    input.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            btn.click();
        }
    });
</script>

</body>
</html>
