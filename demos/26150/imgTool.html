<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地图片处理工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",Roboto,Arial,sans-serif;
  background:#111827;color:#f1f5f9;
  display:flex;flex-direction:column;
}

/* 顶栏 */
header{
  height:44px;background:#1f2937;border-bottom:1px solid #374151;
  padding:0 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
header h1{font-size:15px;font-weight:600;}
.header-note{font-size:12px;color:#6b7280;}

/* 主体 */
.main{display:flex;flex:1;min-height:0;}

/* 左侧工具栏 */
.toolbar{
  width:172px;background:#1f2937;border-right:1px solid #374151;
  padding:10px 6px;overflow-y:auto;flex-shrink:0;
}
.toolbar::-webkit-scrollbar{width:3px;}
.toolbar::-webkit-scrollbar-thumb{background:#4b5563;border-radius:2px;}

.tool-sec{margin-bottom:12px;}
.tool-sec-hd{
  font-size:10px;text-transform:uppercase;letter-spacing:.1em;
  color:#4b5563;padding:0 4px 4px;
}
.tool-btn{
  display:flex;align-items:center;gap:6px;
  width:100%;padding:7px 6px;
  background:transparent;border:1px solid transparent;border-radius:6px;
  color:#d1d5db;font-size:13px;cursor:pointer;
  transition:background .1s,border-color .1s;margin-bottom:2px;text-align:left;
}
.tool-btn:hover{background:#374151;}
.tool-btn:active{background:#1e40af;transform:scale(.98);}
.tool-btn.sel{background:#1e40af;border-color:#3b82f6;color:#fff;}
.tool-btn .ico{font-size:15px;width:18px;text-align:center;flex-shrink:0;}
.tool-btn .lb{display:block;}
.tool-btn .sub{font-size:10px;color:#6b7280;display:block;}
.hr{border:none;border-top:1px solid #374151;margin:8px 0;}

/* 画布区域 */
.workspace{
  flex:1;display:flex;flex-direction:column;min-width:0;
  background:#111827;position:relative;
}

/* 空状态提示（绝对定位浮在画布上方） */
.hint{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#374151;z-index:1;pointer-events:none;gap:10px;
}
.hint .ic{font-size:80px;}
.hint p{font-size:15px;}
.hint small{font-size:12px;}

/* 画布 */
#C{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:none;
  cursor:crosshair;
}

/* 裁剪框 */
#CR{
  position:absolute;display:none;pointer-events:none;
  border:2px dashed #3b82f6;
  background:rgba(59,130,246,.06);
  box-shadow:0 0 0 9999px rgba(0,0,0,.55);
}
#CR.on{display:block;pointer-events:all;cursor:move;}
.ch{position:absolute;width:8px;height:8px;background:#3b82f6;border:1px solid #fff;border-radius:1px;}
.ch.nw{top:-4px;left:-4px;cursor:nw-resize;}
.ch.ne{top:-4px;right:-4px;cursor:ne-resize;}
.ch.sw{bottom:-4px;left:-4px;cursor:sw-resize;}
.ch.se{bottom:-4px;right:-4px;cursor:se-resize;}

/* 拖拽全屏遮罩 */
#DM{
  position:fixed;inset:0;z-index:99;
  background:rgba(59,130,246,.1);
  border:3px dashed #3b82f6;
  display:none;align-items:center;justify-content:center;
  font-size:22px;color:#3b82f6;font-weight:600;
}
#DM.on{display:flex;}

/* 底部状态 */
.sb{
  height:28px;background:#1f2937;border-top:1px solid #374151;
  padding:0 14px;display:flex;align-items:center;
  font-size:12px;color:#6b7280;flex-shrink:0;
}

/* 右侧面板 */
.panel{
  width:200px;background:#1f2937;border-left:1px solid #374151;
  padding:10px;overflow-y:auto;flex-shrink:0;
}
.panel::-webkit-scrollbar{width:3px;}
.panel::-webkit-scrollbar-thumb{background:#4b5563;border-radius:2px;}
.ph{
  font-size:10px;text-transform:uppercase;letter-spacing:.1em;
  color:#4b5563;padding-bottom:5px;border-bottom:1px solid #374151;margin-bottom:6px;
}
.r{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;}
.lb2{color:#6b7280;}
.vl{color:#e5e7eb;font-family:Consolas,monospace;}

/* 格式按钮 */
.fg{display:flex;gap:3px;margin-bottom:6px;}
.fb{
  flex:1;padding:5px 0;
  background:#111827;border:1px solid #374151;border-radius:4px;
  color:#6b7280;font-size:12px;cursor:pointer;transition:all .1s;
}
.fb.on{background:#3b82f6;border-color:#3b82f6;color:#fff;}

/* 滑块 */
.sl{margin-top:7px;}
.sl label{display:flex;justify-content:space-between;font-size:12px;color:#6b7280;margin-bottom:3px;}
.sl input[type=range]{
  width:100%;height:4px;
  -webkit-appearance:none;background:#374151;border-radius:2px;outline:none;
}
.sl input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;
  background:#3b82f6;border-radius:50%;cursor:pointer;
}

/* 导出按钮 */
.dn{
  width:100%;padding:8px;
  background:#3b82f6;border:none;border-radius:5px;
  color:#fff;font-size:13px;font-weight:500;cursor:pointer;
  margin-top:7px;transition:background .1s;
}
.dn:hover{background:#2563eb;}
.dn:active{background:#1d4ed8;transform:scale(.98);}
.dn.g{background:#374151;color:#d1d5db;}
.dn.g:hover{background:#4b5563;}

/* Toast */
#T{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%) translateY(70px);
  background:#1f2937;color:#f1f5f9;
  padding:7px 16px;border-radius:18px;font-size:13px;
  border:1px solid #374151;box-shadow:0 4px 14px rgba(0,0,0,.5);
  transition:transform .2s;z-index:200;white-space:nowrap;
}
#T.sh{transform:translateX(-50%) translateY(0);}
#T.ok{border-color:#10b981;color:#10b981;}
#T.er{border-color:#ef4444;color:#ef4444;}

/* 右键菜单 */
#XM{
  position:fixed;background:#1f2937;border:1px solid #374151;
  border-radius:5px;padding:3px 0;min-width:150px;
  box-shadow:0 4px 14px rgba(0,0,0,.5);display:none;z-index:300;
}
#XM.on{display:block;}
.xi{padding:6px 12px;font-size:12px;color:#d1d5db;cursor:pointer;display:flex;justify-content:space-between;}
.xi:hover{background:#374151;}
.xi .k{color:#4b5563;font-size:11px;}
.xs{border-top:1px solid #374151;margin:2px 0;}

/* 隐藏的文件输入 */
#FI{display:none;}
</style>
</head>
<body>

<header>
  <h1>📷 本地图片处理工具</h1>
  <div class="header-note">零依赖 · 直接双击打开 · 不上传任何数据</div>
</header>

<div class="main">

  <!-- 左侧工具栏 -->
  <aside class="toolbar">
    <div class="tool-sec">
      <button class="tool-btn" id="B0">
        <span class="ico">📂</span>
        <span class="lb">打开图片<span class="sub">支持拖拽</span></span>
      </button>
      <input type="file" id="FI" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp">
    </div>

    <hr class="hr">

    <div class="tool-sec-hd">旋转 / 翻转</div>
    <div class="tool-sec">
      <button class="tool-btn" id="B1"><span class="ico">↺</span><span class="lb">左旋转 90°</span></button>
      <button class="tool-btn" id="B2"><span class="ico">↻</span><span class="lb">右旋转 90°</span></button>
      <button class="tool-btn" id="B3"><span class="ico">↔</span><span class="lb">水平翻转</span></button>
      <button class="tool-btn" id="B4"><span class="ico">↕</span><span class="lb">垂直翻转</span></button>
    </div>

    <hr class="hr">

    <div class="tool-sec-hd">裁剪</div>
    <div class="tool-sec">
      <button class="tool-btn" id="BC"><span class="ico">✂</span><span class="lb">框选裁剪</span></button>
      <button class="tool-btn" id="BC1" style="display:none;"><span class="ico">✔</span><span class="lb">确认裁剪</span></button>
      <button class="tool-btn" id="BC0" style="display:none;"><span class="ico">✕</span><span class="lb">取消</span></button>
    </div>

    <hr class="hr">

    <div class="tool-sec-hd">历史</div>
    <div class="tool-sec">
      <button class="tool-btn" id="BU"><span class="ico">⟲</span><span class="lb">撤销</span></button>
    </div>
  </aside>

  <!-- 画布区域 -->
  <div class="workspace">
    <!-- 空状态提示 -->
    <div class="hint" id="HINT">
      <div class="ic">🖼</div>
      <p>点击左上角「打开图片」</p>
      <small>或将图片直接拖入此区域</small>
    </div>
    <!-- 画布（绝对撑满） -->
    <canvas id="C"></canvas>
    <!-- 裁剪框 -->
    <div id="CR">
      <div class="ch nw"></div><div class="ch ne"></div>
      <div class="ch sw"></div><div class="ch se"></div>
    </div>
    <!-- 拖拽遮罩 -->
    <div id="DM">释放图片以打开</div>
    <!-- 状态栏 -->
    <div class="sb" id="SB"><span>就绪</span></div>
  </div>

  <!-- 右侧面板 -->
  <aside class="panel" id="PNL" style="display:none;">
    <div class="ph">图片信息</div>
    <div class="r"><span class="lb2">文件名</span><span class="vl" id="IN">-</span></div>
    <div class="r"><span class="lb2">原始尺寸</span><span class="vl" id="IS">-</span></div>
    <div class="r"><span class="lb2">当前尺寸</span><span class="vl" id="IC">-</span></div>
    <div class="r"><span class="lb2">格式</span><span class="vl" id="IF">-</span></div>
    <div class="r"><span class="lb2">文件大小</span><span class="vl" id="IZ">-</span></div>

    <div style="height:8px"></div>
    <div class="ph">鼠标位置</div>
    <div class="r"><span class="lb2">X</span><span class="vl" id="IX">-</span></div>
    <div class="r"><span class="lb2">Y</span><span class="vl" id="IY">-</span></div>
    <div class="r"><span class="lb2">颜色</span><span class="vl" id="IR">-</span></div>

    <div style="height:8px"></div>
    <div class="ph">导出设置</div>
    <div class="fg">
      <button class="fb on" data-v="png">PNG</button>
      <button class="fb" data-v="jpeg">JPG</button>
      <button class="fb" data-v="webp">WebP</button>
    </div>
    <div class="sl">
      <label><span>质量</span><span id="QL">85%</span></label>
      <input type="range" id="QS" min="10" max="100" value="85">
    </div>
    <div class="sl">
      <label><span>缩放</span><span id="SL">100%</span></label>
      <input type="range" id="SS" min="10" max="400" value="100" step="5">
    </div>
    <button class="dn" id="BD">下载图片</button>
    <button class="dn g" id="BDO">另存原尺寸</button>
  </aside>
</div>

<!-- 右键菜单 -->
<div id="XM">
  <div class="xi" data-a="rl">左旋转 90° <span class="k">Q</span></div>
  <div class="xi" data-a="rr">右旋转 90° <span class="k">E</span></div>
  <div class="xs"></div>
  <div class="xi" data-a="fh">水平翻转 <span class="k">H</span></div>
  <div class="xi" data-a="fv">垂直翻转 <span class="k">V</span></div>
  <div class="xs"></div>
  <div class="xi" data-a="crop">框选裁剪 <span class="k">C</span></div>
  <div class="xi" data-a="down">保存下载 <span class="k">S</span></div>
</div>

<div id="T"></div>

<script>
(function(){
"use strict";

var S = {
  orig:null, work:null,
  fmt:"png", qual:85, scale:100,
  fname:"image", fsize:0,
  cropOn:false, drag:null, hov:null, isDrag:false,
  hist:[], MAX:20
};

var $ = function(s){return document.querySelector(s);};
var $$ = function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};

function toast(m,t){
  var T=$("#T");
  T.textContent=m;
  T.className="sh "+(t||"");
  clearTimeout(T._t);
  T._t=setTimeout(function(){T.className="";},2200);
}

function hSz(b){
  if(!b) return "0 B";
  if(b<1024) return b+" B";
  if(b<1048576) return (b/1024).toFixed(1)+" KB";
  return (b/1048576).toFixed(2)+" MB";
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function setSB(m){$("#SB").innerHTML="<span>"+m+"</span>";}

// ---- 事件绑定 ----
function init(){
  // 打开
  $("#B0").onclick=function(){
    var fi=$("#FI");
    fi.value="";
    fi.click();
  };
  $("#FI").onchange=function(e){
    var f=e.target.files&&e.target.files[0];
    if(f) loadF(f);
  };

  // 拖拽到工作区
  var ws=$(".workspace");
  ws.addEventListener("dragover",function(e){e.preventDefault();$("#DM").className="on";});
  ws.addEventListener("dragleave",function(e){
    if(!ws.contains(e.relatedTarget))$("#DM").className="";
  });
  ws.addEventListener("drop",function(e){
    e.preventDefault();
    $("#DM").className="";
    var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(f) loadF(f);
  });
  // 全局拦截默认拖拽行为
  document.addEventListener("dragover",function(e){e.preventDefault();});
  document.addEventListener("drop",function(e){e.preventDefault();});

  // 拖拽遮罩
  document.addEventListener("dragover",function(){$("#DM").className="";});
  document.addEventListener("drop",function(){$("#DM").className="";});

  // 工具按钮
  $("#B1").onclick=function(){rot(false);};
  $("#B2").onclick=function(){rot(true);};
  $("#B3").onclick=function(){flp("h");};
  $("#B4").onclick=function(){flp("v");};
  $("#BC").onclick=startCrop;
  $("#BC1").onclick=doCrop;
  $("#BC0").onclick=endCrop;
  $("#BU").onclick=undo;

  // 格式
  $$(".fb").forEach(function(b){
    b.onclick=function(){
      $$(".fb").forEach(function(x){x.className=x.className.replace(" on","");});
      b.className+=" on";
      S.fmt=b.dataset.v;
    };
  });

  // 滑块
  $("#QS").oninput=function(){S.qual=+this.value;$("#QL").textContent=S.qual+"%";};
  $("#SS").oninput=function(){S.scale=+this.value;$("#SL").textContent=S.scale+"%";};

  // 导出
  $("#BD").onclick=function(){down(false);};
  $("#BDO").onclick=function(){down(true);};

  // 画布鼠标
  var C=$("#C");
  C.addEventListener("mousemove",onMM);
  C.addEventListener("click",function(){if(S.cropOn) endCrop();});
  C.addEventListener("dblclick",function(){if(S.cropOn) doCrop();});

  // 裁剪拖拽
  C.addEventListener("mousedown",onMD);
  document.addEventListener("mousemove",onMM2);
  document.addEventListener("mouseup",onMU);

  // 右键
  document.addEventListener("contextmenu",function(e){
    if(!S.work) return;
    e.preventDefault();
    var m=$("#XM");
    m.className="on";
    m.style.left=e.clientX+"px";
    m.style.top=e.clientY+"px";
    var r=m.getBoundingClientRect();
    if(r.right>window.innerWidth) m.style.left=(e.clientX-r.width)+"px";
    if(r.bottom>window.innerHeight) m.style.top=(e.clientY-r.height)+"px";
  });
  document.addEventListener("click",function(){$("#XM").className="";});
  $$(".xi").forEach(function(i){
    i.onclick=function(){
      var a=i.dataset.a;
      if(a==="rl") rot(false);
      else if(a==="rr") rot(true);
      else if(a==="fh") flp("h");
      else if(a==="fv") flp("v");
      else if(a==="crop") startCrop();
      else if(a==="down") down(false);
      $("#XM").className="";
    };
  });

  // 键盘
  document.addEventListener("keydown",function(e){
    if(!S.work) return;
    if(e.target.tagName==="INPUT") return;
    if(e.key==="q"||e.key==="Q") rot(false);
    else if(e.key==="e"||e.key==="E") rot(true);
    else if(e.key==="h"||e.key==="H") flp("h");
    else if(e.key==="v"||e.key==="V") flp("v");
    else if(e.key==="c"||e.key==="C"){if(S.cropOn) doCrop();else startCrop();}
    else if(e.key==="Escape") endCrop();
    else if(e.key==="z"||e.key==="Z"){if(e.ctrlKey||e.metaKey){e.preventDefault();undo();}}
    else if(e.key==="s"||e.key==="S"){e.preventDefault();down(false);}
  });

  setSB("就绪");
}

// ---- 加载图片 ----
function loadF(file){
  S.fname=(file.name.replace(/\.[^.]+$/,""))||"image";
  S.fsize=file.size;
  var r=new FileReader();
  r.onload=function(e){
    var img=new Image();
    img.onload=function(){
      S.orig=img;
      S.work=img;
      S.hist=[];
      endCrop();
      draw();
      $("#PNL").style.display="block";
      setSB("已加载: "+file.name);
      toast("图片已加载","ok");
    };
    img.onerror=function(){toast("图片加载失败","er");};
    img.src=e.target.result;
  };
  r.onerror=function(){toast("文件读取失败","er");};
  r.readAsDataURL(file);
}

// ---- 绘制 ----
function draw(){
  var C=$("#C"), ctx=C.getContext("2d");
  var img=S.work;
  C.width=img.naturalWidth;
  C.height=img.naturalHeight;
  ctx.clearRect(0,0,C.width,C.height);
  ctx.drawImage(img,0,0);
  C.style.display="block";
  $("#HINT").style.display="none";
  updInfo();
}

// ---- 更新右侧信息 ----
function updInfo(){
  var img=S.work, orig=S.orig;
  if(!img) return;
  $("#IN").textContent=S.fname;
  $("#IS").textContent=(orig?orig.naturalWidth:img.naturalWidth)+" × "+(orig?orig.naturalHeight:img.naturalHeight);
  $("#IC").textContent=img.naturalWidth+" × "+img.naturalHeight;
  $("#IF").textContent=S.fmt.toUpperCase();
  $("#IZ").textContent=hSz(S.fsize);
}

// ---- 画布坐标 ----
function cXY(e){
  var C=$("#C"), r=C.getBoundingClientRect();
  return {
    x:Math.round((e.clientX-r.left)*(C.width/r.width)),
    y:Math.round((e.clientY-r.top)*(C.height/r.height))
  };
}

function onMM(e){
  if(!S.work) return;
  var p=cXY(e);
  $("#IX").textContent=p.x;
  $("#IY").textContent=p.y;
  try{
    var d=$("#C").getContext("2d").getImageData(p.x,p.y,1,1).data;
    var hex="#"+[d[0],d[1],d[2]].map(function(v){return v.toString(16).padStart(2,"0");}).join("");
    var al=d[3];
    $("#IR").innerHTML='<span style="display:inline-block;width:10px;height:10px;background:'+hex+';border:1px solid #4b5563;border-radius:2px;vertical-align:middle;margin-right:2px;"></span>'+hex+(al<255?" / A:"+al:"");
  }catch(err){}
}

// ---- 历史 ----
function pushH(){
  if(!S.work) return;
  S.hist.push({src:S.work.src,fmt:S.fmt,qual:S.qual,scale:S.scale});
  if(S.hist.length>S.MAX) S.hist.shift();
}

// ---- 旋转 ----
function rot(right){
  if(!S.work) return;
  pushH();
  var img=S.work, W=img.naturalWidth, H=img.naturalHeight;
  var c=document.createElement("canvas");
  c.width=H; c.height=W;
  var ctx=c.getContext("2d");
  ctx.save();
  ctx.translate(c.width/2,c.height/2);
  ctx.rotate((right?90:-90)*Math.PI/180);
  ctx.drawImage(img,-W/2,-H/2);
  ctx.restore();
  var img2=new Image();
  img2.onload=function(){S.work=img2;draw();setSB("已旋转 "+(right?"右":"左")+" 90°");};
  img2.src=c.toDataURL("image/png");
}

// ---- 翻转 ----
function flp(t){
  if(!S.work) return;
  pushH();
  var img=S.work, W=img.naturalWidth, H=img.naturalHeight;
  var c=document.createElement("canvas");
  c.width=W; c.height=H;
  var ctx=c.getContext("2d");
  ctx.save();
  if(t==="h"){ctx.translate(W,0);ctx.scale(-1,1);}
  else{ctx.translate(0,H);ctx.scale(1,-1);}
  ctx.drawImage(img,0,0);
  ctx.restore();
  var img2=new Image();
  img2.onload=function(){S.work=img2;draw();setSB("已"+(t==="h"?"水平":"垂直")+"翻转");};
  img2.src=c.toDataURL("image/png");
}

// ---- 裁剪 ----
function startCrop(){
  if(!S.work) return;
  S.cropOn=true;
  var CR=$("#CR"), C=$("#C");
  CR.className="on";
  $("#BC").className="tool-btn sel";
  $("#BC1").style.display="flex";
  $("#BC0").style.display="flex";
  // 默认选中中心60%
  var r=C.getBoundingClientRect();
  var sx=C.width/r.width, sy=C.height/r.height;
  var W=Math.round(C.width*.6), H=Math.round(C.height*.6);
  var x=Math.round((C.width-W)/2), y=Math.round((C.height-H)/2);
  CR.style.left=(x*sx)+"px";
  CR.style.top=(y*sy)+"px";
  CR.style.width=(W*sx)+"px";
  CR.style.height=(H*sy)+"px";
  setSB("框选裁剪区域，双击或点确认，Esc取消");
}

function endCrop(){
  S.cropOn=false;
  var CR=$("#CR");
  CR.className="";
  CR.style.cssText="";
  $("#BC").className="tool-btn";
  $("#BC1").style.display="none";
  $("#BC0").style.display="none";
  if(!S.work) setSB("就绪");
  else setSB("就绪");
}

function onMD(e){
  if(!S.cropOn) return;
  var CR=$("#CR");
  var hnd=e.target.classList.contains("ch")?e.target.className.split(" ")[1]:null;
  S.drag={mx:e.clientX,my:e.clientY,bx:CR.offsetLeft,by:CR.offsetTop,bw:CR.offsetWidth,bh:CR.offsetHeight};
  S.isDrag=true;
  S.hov=hnd;
  e.stopPropagation();
  e.preventDefault();
}

function onMM2(e){
  if(!S.isDrag||!S.drag) return;
  var dx=e.clientX-S.drag.mx, dy=e.clientY-S.drag.my;
  var CR=$("#CR"), C=$("#C"), r=C.getBoundingClientRect();
  var bw=S.drag.bw, bh=S.drag.bh, bl=S.drag.bx, bt=S.drag.by;
  var h=S.hov;
  if(!h){
    bl=clamp(S.drag.bx+dx,0,r.width-bw);
    bt=clamp(S.drag.by+dy,0,r.height-bh);
  } else if(h==="se"){
    bw=clamp(S.drag.bw+dx,20,r.width-bl);
    bh=clamp(S.drag.bh+dy,20,r.height-bt);
  } else if(h==="nw"){
    var nl=clamp(S.drag.bx+dx,0,bl+bw-20);
    var nt=clamp(S.drag.by+dy,0,bt+bh-20);
    bw=bl+bw-nl; bh=bt+bh-nt; bl=nl; bt=nt;
  } else if(h==="ne"){
    var nt2=clamp(S.drag.by+dy,0,bt+bh-20);
    bw=clamp(S.drag.bw+dx,20,r.width-bl);
    bh=bt+bh-nt2; bt=nt2;
  } else if(h==="sw"){
    var nl2=clamp(S.drag.bx+dx,0,bl+bw-20);
    bw=bl+bw-nl2; bh=clamp(S.drag.bh+dy,20,r.height-bt); bl=nl2;
  }
  CR.style.left=bl+"px"; CR.style.top=bt+"px";
  CR.style.width=bw+"px"; CR.style.height=bh+"px";
}

function onMU(){
  S.isDrag=false; S.drag=null; S.hov=null;
}

function doCrop(){
  if(!S.cropOn) return;
  var CR=$("#CR"), C=$("#C");
  if(CR.offsetWidth<5||CR.offsetHeight<5){toast("请先框选裁剪区域","er");return;}
  pushH();
  var r=C.getBoundingClientRect();
  var sx=C.width/r.width, sy=C.height/r.height;
  var sx2=Math.round(CR.offsetLeft*sx), sy2=Math.round(CR.offsetTop*sy);
  var sw=Math.round(CR.offsetWidth*sx), sh=Math.round(CR.offsetHeight*sy);
  var c=document.createElement("canvas");
  c.width=sw; c.height=sh;
  c.getContext("2d").drawImage(S.work,sx2,sy2,sw,sh,0,0,sw,sh);
  var img2=new Image();
  img2.onload=function(){
    S.work=img2;
    endCrop();
    draw();
    setSB("裁剪完成: "+sw+"×"+sh);
    toast("裁剪成功","ok");
  };
  img2.src=c.toDataURL("image/png");
}

// ---- 撤销 ----
function undo(){
  if(S.hist.length===0){
    if(S.orig){S.work=S.orig;draw();setSB("已恢复原始图片");toast("已恢复原始","ok");}
    return;
  }
  var h=S.hist.pop();
  var img=new Image();
  img.onload=function(){
    S.work=img;
    S.fmt=h.fmt; S.qual=h.qual; S.scale=h.scale;
    $$(".fb").forEach(function(b){b.className=b.className.replace(" on","");});
    (function(){
      var b=$$(".fb");
      for(var i=0;i<b.length;i++) if(b[i].dataset.v===S.fmt){b[i].className+=" on";break;}
    })();
    $("#QS").value=S.qual; $("#QL").textContent=S.qual+"%";
    $("#SS").value=S.scale; $("#SL").textContent=S.scale+"%";
    draw();
    setSB("已撤销");
  };
  img.src=h.src;
}

// ---- 导出 ----
function down(orig){
  if(!S.work) return;
  var img=S.work;
  var W=img.naturalWidth, H=img.naturalHeight;
  if(!orig&&S.scale!==100){W=Math.round(W*S.scale/100);H=Math.round(H*S.scale/100);}
  W=Math.max(1,W); H=Math.max(1,H);
  var c=document.createElement("canvas");
  c.width=W; c.height=H;
  c.getContext("2d").drawImage(img,0,0,W,H);
  var mime="image/"+S.fmt;
  var q=(S.fmt==="png")?undefined:S.qual/100;
  var url=c.toDataURL(mime,q);
  var blob=(function(){
    var p=url.split(","), m=p[0].match(/:(.*?);/)[1], b=atob(p[1]), n=b.length;
    var u=new Uint8Array(n); while(n--) u[n]=b.charCodeAt(n);
    return new Blob([u],{type:m});
  })();
  var a=document.createElement("a");
  var ext=(S.fmt==="jpeg")?"jpg":S.fmt;
  a.download=S.fname+"_"+W+"x"+H+"."+ext;
  a.href=url; a.click();
  setSB("已导出 "+W+"×"+H+" ("+hSz(blob.size)+")");
  toast("已导出 "+hSz(blob.size),"ok");
}

init();
})();
</script>
</body>
</html>
