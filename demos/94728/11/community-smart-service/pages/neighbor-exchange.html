<!DOCTYPE html>
<html lang="zh-CN" class="light">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邻里置换</title>
    <style id="theme-vars">
/* 智慧社区便民服务 — Brand CSS */
/* 主色调：暖米色 + 浅青绿色 | 简约清新亲民社区风 */

:root {
  /* ── Primary: 暖米色系 ── */
  --brand-warm-50: #FFFDF8;
  --brand-warm-100: #FFF8EC;
  --brand-warm-200: #FFEFD0;
  --brand-warm-300: #FFE0A8;
  --brand-warm-400: #FFCF7D;
  --brand-warm-500: #FFBA52;
  --brand-warm-600: #F5A623;
  --brand-warm-700: #D4891A;
  --brand-warm-800: #A66A14;
  --brand-warm-900: #7A4D0F;

  /* ── Accent: 浅青绿色系 ── */
  --brand-teal-50: #F0FBF9;
  --brand-teal-100: #D6F5EF;
  --brand-teal-200: #AEEAD9;
  --brand-teal-300: #79D9BF;
  --brand-teal-400: #45C3A3;
  --brand-teal-500: #2AA88B;
  --brand-teal-600: #1E8A72;
  --brand-teal-700: #1A6E5D;
  --brand-teal-800: #17574B;
  --brand-teal-900: #12463C;

  /* ── Semantic ── */
  --color-primary: var(--brand-teal-500);
  --color-primary-light: var(--brand-teal-100);
  --color-primary-dark: var(--brand-teal-700);
  --color-accent: var(--brand-warm-500);
  --color-accent-light: var(--brand-warm-100);

  --color-bg: #FDFCF9;
  --color-bg-elevated: #FFFFFF;
  --color-bg-subtle: #F7F5EF;
  --color-bg-muted: #F0EDE5;

  --color-text-primary: #2D3436;
  --color-text-secondary: #636E72;
  --color-text-muted: #A0A8AD;
  --color-text-inverse: #FFFFFF;

  --color-border: #E8E4DC;
  --color-border-light: #F0EDE5;

  /* ── State Colors ── */
  --state-success: #27AE60;
  --state-success-bg: #E8F8EF;
  --state-warning: #F5A623;
  --state-warning-bg: #FFF8EC;
  --state-error: #EB5757;
  --state-error-bg: #FDF0F0;
  --state-info: #2AA88B;
  --state-info-bg: #F0FBF9;

  /* ── Typography ── */
  --font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-md: 16px;
  --font-size-lg: 18px;
  --font-size-xl: 20px;
  --font-size-2xl: 24px;
  --font-size-3xl: 28px;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;

  /* ── Radius ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Shadows (alpha ≤ 0.05 for static, deeper for float) ── */
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.10);

  /* ── Spacing ── */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;

  /* ── Elder Mode Override ── */
  --elder-font-scale: 1.0;
}

html.elder-mode {
  --font-size-xs: 14px;
  --font-size-sm: 16px;
  --font-size-base: 18px;
  --font-size-md: 20px;
  --font-size-lg: 22px;
  --font-size-xl: 24px;
  --font-size-2xl: 28px;
  --font-size-3xl: 32px;
  --space-sm: 12px;
  --space-md: 16px;
  --space-lg: 20px;
  --radius-md: 12px;
  --radius-lg: 16px;
}

/* ── Utility Classes ── */
.text-primary { color: var(--color-text-primary); }
.text-secondary { color: var(--color-text-secondary); }
.text-muted { color: var(--color-text-muted); }
.text-inverse { color: var(--color-text-inverse); }
.text-accent { color: var(--color-primary); }
.text-warm { color: var(--color-accent); }

.bg-page { background-color: var(--color-bg); }
.bg-card { background-color: var(--color-bg-elevated); }
.bg-subtle { background-color: var(--color-bg-subtle); }
.bg-accent { background-color: var(--color-primary); }
.bg-warm { background-color: var(--color-accent); }

.font-medium { font-weight: var(--font-weight-medium); }
.font-semibold { font-weight: var(--font-weight-semibold); }
.font-bold { font-weight: var(--font-weight-bold); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-bg);
    --color-foreground: var(--color-text-primary);
    --color-primary: var(--color-primary);
    --color-primary-foreground: var(--color-text-inverse);
    --color-primary-light: var(--color-primary-light);
    --color-primary-dark: var(--color-primary-dark);
    --color-accent: var(--color-accent);
    --color-accent-light: var(--color-accent-light);
    --color-muted: var(--color-bg-muted);
    --color-muted-foreground: var(--color-text-muted);
    --color-border: var(--color-border);
    --color-card: var(--color-bg-elevated);
    --color-card-foreground: var(--color-text-primary);
    --color-info: var(--state-info);
    --color-info-bg: var(--state-info-bg);
    --color-success: var(--state-success);
    --color-warning: var(--state-warning);
    --color-error: var(--state-error);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
    --radius-xl: var(--radius-xl);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="font-family: var(--font-family);">

    <main class="flex flex-col min-h-screen max-w-md mx-auto bg-[var(--color-bg)] relative">

      <!-- 状态栏占位 -->
      <div class="h-11 bg-[var(--color-bg)] shrink-0"></div>

      <!-- 小程序导航栏 -->
      <header class="sticky top-0 z-30 flex items-center px-4 h-11 bg-[var(--color-bg)] border-b border-[var(--color-border)] shrink-0">
        <div class="flex w-[88px] items-center justify-start">
          <button class="inline-flex items-center justify-center w-8 h-8 rounded-lg border border-[var(--color-border)] bg-[var(--color-bg)]" aria-label="返回" data-dom-id="nav-back">
            <i data-lucide="chevron-left" class="w-4 h-4" style="color: var(--color-text-primary);"></i>
          </button>
        </div>
        <div class="min-w-0 flex-1 text-center text-[16px] font-semibold tracking-[-0.02em]" style="color: var(--color-text-primary);">邻里置换</div>
        <div class="flex w-[88px] items-center justify-end">
          <button class="inline-flex items-center justify-center h-8 px-3 rounded-lg text-[12px] font-medium whitespace-nowrap" style="background-color: var(--brand-teal-500); color: var(--color-text-inverse);" data-dom-id="btn-publish">
            发布闲置
          </button>
        </div>
      </header>

      <!-- 内容区域（扣除底部TabBar 84px） -->
      <div class="flex-1 overflow-y-auto px-4 pt-3 pb-[100px] no-scrollbar">

        <!-- 搜索栏 -->
        <div class="relative mb-3">
          <div class="flex items-center rounded-lg border px-3 h-10" style="background-color: var(--color-bg-elevated); border-color: var(--color-border);">
            <i data-lucide="search" class="w-4 h-4 shrink-0 mr-2" style="color: var(--color-text-muted);"></i>
            <input type="text" placeholder="搜索闲置物品..." class="flex-1 min-w-0 bg-transparent text-[14px] outline-none" style="color: var(--color-text-primary);">
          </div>
        </div>

        <!-- 筛选标签栏 -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar mb-4 pb-0.5" data-dom-id="filter-tabs">
          <button class="inline-flex items-center justify-center px-3 h-7 rounded-lg text-[13px] font-medium whitespace-nowrap shrink-0 transition-colors duration-150" style="background-color: var(--brand-teal-500); color: var(--color-text-inverse);">全部</button>
          <button class="inline-flex items-center justify-center px-3 h-7 rounded-lg text-[13px] font-medium whitespace-nowrap shrink-0 border transition-colors duration-150" style="background-color: var(--color-bg-elevated); border-color: var(--color-border); color: var(--color-text-secondary);">家居</button>
          <button class="inline-flex items-center justify-center px-3 h-7 rounded-lg text-[13px] font-medium whitespace-nowrap shrink-0 border transition-colors duration-150" style="background-color: var(--color-bg-elevated); border-color: var(--color-border); color: var(--color-text-secondary);">图书</button>
          <button class="inline-flex items-center justify-center px-3 h-7 rounded-lg text-[13px] font-medium whitespace-nowrap shrink-0 border transition-colors duration-150" style="background-color: var(--color-bg-elevated); border-color: var(--color-border); color: var(--color-text-secondary);">儿童</button>
          <button class="inline-flex items-center justify-center px-3 h-7 rounded-lg text-[13px] font-medium whitespace-nowrap shrink-0 border transition-colors duration-150" style="background-color: var(--color-bg-elevated); border-color: var(--color-border); color: var(--color-text-secondary);">电器</button>
          <button class="inline-flex items-center justify-center px-3 h-7 rounded-lg text-[13px] font-medium whitespace-nowrap shrink-0 border transition-colors duration-150" style="background-color: var(--color-bg-elevated); border-color: var(--color-border); color: var(--color-text-secondary);">其他</button>
        </div>

        <!-- AI智能匹配横幅卡片 -->
        <div class="rounded-xl p-4 mb-4 relative overflow-hidden" style="background: linear-gradient(135deg, var(--brand-teal-500) 0%, var(--brand-teal-700) 100%);" data-dom-id="ai-match-banner">
          <div class="relative z-10">
            <div class="flex items-center gap-2 mb-1.5">
              <i data-lucide="sparkles" class="w-4 h-4" style="color: var(--color-text-inverse);"></i>
              <span class="text-[15px] font-semibold" style="color: var(--color-text-inverse);">AI帮你找到匹配需求</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-[13px]" style="color: rgba(255,255,255,0.85);">发现与您的闲置物品匹配的需求</span>
              <span class="inline-flex items-center justify-center h-6 px-2.5 rounded-lg text-[12px] font-semibold" style="background-color: rgba(255,255,255,0.2); color: var(--color-text-inverse);">3个匹配</span>
            </div>
          </div>
        </div>

        <!-- TRAE大模型标注：供需语义匹配 -->
        <div class="flex mb-4 -mt-2">
          <div class="border border-dashed rounded-lg px-2.5 py-1.5 text-[11px] leading-snug ml-auto" style="border-color: var(--brand-teal-300); color: var(--brand-teal-700); background-color: rgba(240,251,249,0.6);">
            TRAE大模型 · 供需语义匹配
          </div>
        </div>

        <!-- 物品卡片网格（2列瀑布流） -->
        <div class="grid grid-cols-2 gap-3">

          <!-- 卡片1：九成新儿童绘本一套 -->
          <div class="rounded-xl overflow-hidden" style="background-color: var(--color-bg-elevated); box-shadow: var(--shadow-sm);">
            <!-- 图片占位 -->
            <div class="relative aspect-[4/3] flex items-center justify-center" style="background-color: var(--color-bg-subtle);">
              <i data-lucide="book-open" class="w-10 h-10" style="color: var(--color-text-muted);"></i>
            </div>
            <!-- 内容 -->
            <div class="p-3">
              <h3 class="text-[14px] font-semibold leading-tight mb-1.5 truncate" style="color: var(--color-text-primary);">九成新儿童绘本一套</h3>
              <!-- 发布者信息 -->
              <div class="flex items-center gap-1.5 mb-2">
                <div class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-semibold shrink-0" style="background-color: var(--brand-warm-200); color: var(--brand-warm-700);">李</div>
                <span class="text-[12px] truncate" style="color: var(--color-text-secondary);">李妈妈</span>
              </div>
              <!-- 交换需求 -->
              <p class="text-[12px] leading-snug mb-2" style="color: var(--color-text-muted);">想换儿童玩具</p>
              <!-- 标签 -->
              <div class="flex gap-1.5 flex-wrap">
                <span class="inline-flex items-center justify-center px-2 py-0.5 rounded-md text-[11px] font-medium whitespace-nowrap" style="background-color: var(--brand-teal-100); color: var(--brand-teal-700);">儿童</span>
                <span class="inline-flex items-center justify-center px-2 py-0.5 rounded-md text-[11px] font-medium whitespace-nowrap" style="background-color: var(--brand-warm-100); color: var(--brand-warm-700);">图书</span>
              </div>
            </div>
          </div>

          <!-- 卡片2：闲置电饭煲（AI推荐） -->
          <div class="rounded-xl overflow-hidden" style="background-color: var(--color-bg-elevated); box-shadow: var(--shadow-sm);">
            <!-- AI推荐标识 -->
            <div class="relative aspect-[4/3] flex items-center justify-center" style="background-color: var(--color-bg-subtle);">
              <i data-lucide="cooking-pot" class="w-10 h-10" style="color: var(--color-text-muted);"></i>
              <!-- AI匹配角标 -->
              <span class="absolute top-2 right-2 inline-flex items-center justify-center gap-1 px-2 py-0.5 rounded-md text-[10px] font-semibold" style="background-color: var(--brand-teal-500); color: var(--color-text-inverse);">
                <i data-lucide="sparkles" class="w-2.5 h-2.5"></i>
                AI推荐
              </span>
            </div>
            <!-- 内容 -->
            <div class="p-3">
              <h3 class="text-[14px] font-semibold leading-tight mb-1.5 truncate" style="color: var(--color-text-primary);">闲置电饭煲(几乎全新)</h3>
              <!-- 发布者信息 -->
              <div class="flex items-center gap-1.5 mb-2">
                <div class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-semibold shrink-0" style="background-color: var(--brand-teal-200); color: var(--brand-teal-700);">王</div>
                <span class="text-[12px] truncate" style="color: var(--color-text-secondary);">王大爷</span>
              </div>
              <!-- 交换需求 -->
              <p class="text-[12px] leading-snug mb-2" style="color: var(--color-text-muted);">换米面油</p>
              <!-- 标签 -->
              <div class="flex gap-1.5 flex-wrap">
                <span class="inline-flex items-center justify-center px-2 py-0.5 rounded-md text-[11px] font-medium whitespace-nowrap" style="background-color: var(--brand-warm-100); color: var(--brand-warm-700);">家居</span>
                <span class="inline-flex items-center justify-center px-2 py-0.5 rounded-md text-[11px] font-medium whitespace-nowrap" style="background-color: var(--brand-teal-100); color: var(--brand-teal-700);">电器</span>
              </div>
            </div>
          </div>

          <!-- 卡片3：瑜伽垫 -->
          <div class="rounded-xl overflow-hidden" style="background-color: var(--color-bg-elevated); box-shadow: var(--shadow-sm);">
            <!-- 图片占位 -->
            <div class="relative aspect-[4/3] flex items-center justify-center" style="background-color: var(--color-bg-subtle);">
              <i data-lucide="dumbbell" class="w-10 h-10" style="color: var(--color-text-muted);"></i>
            </div>
            <!-- 内容 -->
            <div class="p-3">
              <h3 class="text-[14px] font-semibold leading-tight mb-1.5 truncate" style="color: var(--color-text-primary);">瑜伽垫(只用过2次)</h3>
              <!-- 发布者信息 -->
              <div class="flex items-center gap-1.5 mb-2">
                <div class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-semibold shrink-0" style="background-color: var(--brand-warm-200); color: var(--brand-warm-700);">张</div>
                <span class="text-[12px] truncate" style="color: var(--color-text-secondary);">小张</span>
              </div>
              <!-- 交换需求 -->
              <p class="text-[12px] leading-snug mb-2" style="color: var(--color-text-muted);">随便换点有用的</p>
              <!-- 标签 -->
              <div class="flex gap-1.5 flex-wrap">
                <span class="inline-flex items-center justify-center px-2 py-0.5 rounded-md text-[11px] font-medium whitespace-nowrap" style="background-color: var(--color-bg-muted); color: var(--color-text-secondary);">其他</span>
              </div>
            </div>
          </div>

        </div>

        <!-- 物品详情底部操作栏（悬浮态模拟） -->
        <div class="mt-4 rounded-xl p-4" style="background-color: var(--color-bg-elevated); box-shadow: var(--shadow-float);">
          <div class="flex items-center gap-2 mb-2.5">
            <span class="text-[13px] font-semibold truncate" style="color: var(--color-text-primary);">闲置电饭煲(几乎全新)</span>
            <span class="inline-flex items-center justify-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-semibold shrink-0" style="background-color: var(--brand-teal-100); color: var(--brand-teal-700);">AI推荐</span>
          </div>
          <div class="flex items-center gap-2">
            <button class="flex-1 inline-flex items-center justify-center h-9 rounded-lg text-[14px] font-semibold whitespace-nowrap transition-transform duration-150 active:scale-[0.98]" style="background-color: var(--brand-teal-500); color: var(--color-text-inverse);" data-dom-id="btn-want">
              我想要
            </button>
            <button class="flex-1 inline-flex items-center justify-center h-9 rounded-lg text-[14px] font-medium whitespace-nowrap border transition-transform duration-150 active:scale-[0.98]" style="background-color: var(--brand-warm-100); border-color: var(--brand-warm-300); color: var(--brand-warm-700);" data-dom-id="btn-ai-script">
              AI生成话术
            </button>
            <button class="inline-flex items-center justify-center w-9 h-9 rounded-lg border shrink-0 transition-colors duration-150" style="background-color: var(--color-bg-elevated); border-color: var(--color-border);" aria-label="分享" data-dom-id="btn-share">
              <i data-lucide="share-2" class="w-4 h-4" style="color: var(--color-text-secondary);"></i>
            </button>
          </div>
          <!-- TRAE大模型标注：智能沟通话术生成 -->
          <div class="mt-2.5">
            <div class="border border-dashed rounded-md px-2 py-1 text-[11px] leading-snug inline-block" style="border-color: var(--brand-teal-300); color: var(--brand-teal-700); background-color: rgba(240,251,249,0.6);">
              TRAE大模型 · 智能沟通话术生成
            </div>
          </div>
        </div>

      </div>

      <!-- 底部5Tab导航栏 -->
      <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 border-t flex items-center justify-around" style="height: 50px; background-color: var(--color-bg-elevated); border-color: var(--color-border);" data-dom-id="tab-bar">
        <button class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--color-text-muted);" data-dom-id="tab-home" data-nav-key="home">
          <i data-lucide="home" class="w-5 h-5"></i>
          <span class="text-[10px]">首页</span>
        </button>
        <button class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--color-text-muted);" data-dom-id="tab-ai" data-nav-key="ai">
          <i data-lucide="bot" class="w-5 h-5"></i>
          <span class="text-[10px]">AI客服</span>
        </button>
        <button class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--color-text-muted);" data-dom-id="tab-repair" data-nav-key="repair">
          <i data-lucide="wrench" class="w-5 h-5"></i>
          <span class="text-[10px]">报修</span>
        </button>
        <button class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--brand-teal-500);" data-dom-id="tab-exchange" data-nav-key="exchange" data-active="true">
          <i data-lucide="repeat-2" class="w-5 h-5"></i>
          <span class="text-[10px] font-medium">邻里</span>
        </button>
        <button class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--color-text-muted);" data-dom-id="tab-profile" data-nav-key="profile">
          <i data-lucide="user" class="w-5 h-5"></i>
          <span class="text-[10px]">我的</span>
        </button>
