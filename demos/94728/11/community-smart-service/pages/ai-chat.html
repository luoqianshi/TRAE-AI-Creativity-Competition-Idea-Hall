<!DOCTYPE html>
<html lang="zh-CN" class="light">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能客服</title>
    <style id="theme-vars">
/* 智慧社区便民服务 — Brand CSS */
/* 主色调：暖米色 + 浅青绿色 | 简约清新亲民社区风 */

:root {
  /* ── Primary: 暖米色系 ── */
  --brand-warm-50: #FFFDF8;
  --brand-warm-100: #FFF8EC;
  --brand-warm-200: #FFEFD0;
  --brand-warm-300: #FFE0A8;
  --brand-warm-400: #FFCF7D;
  --brand-warm-500: #FFBA52;
  --brand-warm-600: #F5A623;
  --brand-warm-700: #D4891A;
  --brand-warm-800: #A66A14;
  --brand-warm-900: #7A4D0F;

  /* ── Accent: 浅青绿色系 ── */
  --brand-teal-50: #F0FBF9;
  --brand-teal-100: #D6F5EF;
  --brand-teal-200: #AEEAD9;
  --brand-teal-300: #79D9BF;
  --brand-teal-400: #45C3A3;
  --brand-teal-500: #2AA88B;
  --brand-teal-600: #1E8A72;
  --brand-teal-700: #1A6E5D;
  --brand-teal-800: #17574B;
  --brand-teal-900: #12463C;

  /* ── Semantic ── */
  --color-primary: var(--brand-teal-500);
  --color-primary-light: var(--brand-teal-100);
  --color-primary-dark: var(--brand-teal-700);
  --color-accent: var(--brand-warm-500);
  --color-accent-light: var(--brand-warm-100);

  --color-bg: #FDFCF9;
  --color-bg-elevated: #FFFFFF;
  --color-bg-subtle: #F7F5EF;
  --color-bg-muted: #F0EDE5;

  --color-text-primary: #2D3436;
  --color-text-secondary: #636E72;
  --color-text-muted: #A0A8AD;
  --color-text-inverse: #FFFFFF;

  --color-border: #E8E4DC;
  --color-border-light: #F0EDE5;

  /* ── State Colors ── */
  --state-success: #27AE60;
  --state-success-bg: #E8F8EF;
  --state-warning: #F5A623;
  --state-warning-bg: #FFF8EC;
  --state-error: #EB5757;
  --state-error-bg: #FDF0F0;
  --state-info: #2AA88B;
  --state-info-bg: #F0FBF9;

  /* ── Typography ── */
  --font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-md: 16px;
  --font-size-lg: 18px;
  --font-size-xl: 20px;
  --font-size-2xl: 24px;
  --font-size-3xl: 28px;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;

  /* ── Radius ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Shadows (alpha ≤ 0.05 for static, deeper for float) ── */
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.10);

  /* ── Spacing ── */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;

  /* ── Elder Mode Override ── */
  --elder-font-scale: 1.0;
}

html.elder-mode {
  --font-size-xs: 14px;
  --font-size-sm: 16px;
  --font-size-base: 18px;
  --font-size-md: 20px;
  --font-size-lg: 22px;
  --font-size-xl: 24px;
  --font-size-2xl: 28px;
  --font-size-3xl: 32px;
  --space-sm: 12px;
  --space-md: 16px;
  --space-lg: 20px;
  --radius-md: 12px;
  --radius-lg: 16px;
}

/* ── Utility Classes ── */
.text-primary { color: var(--color-text-primary); }
.text-secondary { color: var(--color-text-secondary); }
.text-muted { color: var(--color-text-muted); }
.text-inverse { color: var(--color-text-inverse); }
.text-accent { color: var(--color-primary); }
.text-warm { color: var(--color-accent); }

.bg-page { background-color: var(--color-bg); }
.bg-card { background-color: var(--color-bg-elevated); }
.bg-subtle { background-color: var(--color-bg-subtle); }
.bg-accent { background-color: var(--color-primary); }
.bg-warm { background-color: var(--color-accent); }

.font-medium { font-weight: var(--font-weight-medium); }
.font-semibold { font-weight: var(--font-weight-semibold); }
.font-bold { font-weight: var(--font-weight-bold); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-bg);
    --color-foreground: var(--color-text-primary);
    --color-primary: var(--color-primary);
    --color-primary-foreground: var(--color-text-inverse);
    --color-primary-light: var(--color-primary-light);
    --color-primary-dark: var(--color-primary-dark);
    --color-accent: var(--color-accent);
    --color-accent-light: var(--color-accent-light);
    --color-muted: var(--color-bg-muted);
    --color-muted-foreground: var(--color-text-muted);
    --color-border: var(--color-border);
    --color-card: var(--color-bg-elevated);
    --color-card-foreground: var(--color-text-primary);
    --color-info: var(--state-info);
    --color-info-bg: var(--state-info-bg);
    --color-success: var(--state-success);
    --color-warning: var(--state-warning);
    --color-error: var(--state-error);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
    --radius-xl: var(--radius-xl);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="font-family: var(--font-family);">

    <main class="flex flex-col h-screen max-w-md mx-auto bg-[var(--color-bg)] relative overflow-hidden">

      <!-- 状态栏占位 -->
      <div class="h-11 bg-[var(--color-bg)] shrink-0"></div>

      <!-- 小程序导航栏 -->
      <header class="sticky top-0 z-30 flex items-center px-4 h-11 bg-[var(--color-bg)] border-b border-[var(--color-border)] shrink-0">
        <div class="flex w-[88px] items-center justify-start">
          <button class="inline-flex items-center justify-center w-8 h-8 rounded-lg border border-[var(--color-border)] bg-[var(--color-bg)]" aria-label="返回">
            <i data-lucide="chevron-left" class="w-4 h-4" style="color: var(--color-text-primary);"></i>
          </button>
        </div>
        <div class="min-w-0 flex-1 text-center text-[16px] font-semibold tracking-[-0.02em]" style="color: var(--color-text-primary);">AI智能客服</div>
        <div class="flex w-[88px] items-center justify-end">
          <button class="inline-flex items-center justify-center w-8 h-8 rounded-lg" aria-label="设置">
            <i data-lucide="settings" class="w-[18px] h-[18px]" style="color: var(--color-text-secondary);"></i>
          </button>
        </div>
      </header>

      <!-- 对话区域 -->
      <div class="flex-1 overflow-y-auto px-4 py-3 no-scrollbar" style="padding-bottom: 180px;">

        <!-- AI助手头像区域 -->
        <div class="flex flex-col items-center pt-4 pb-5">
          <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-[var(--brand-teal-200)] mb-2">
            <img src="../assets/ai-assistant-icon.jpg" alt="社区AI助手" class="w-full h-full object-cover">
          </div>
          <div class="flex items-center gap-1.5 mt-1">
            <span class="w-2 h-2 rounded-full bg-[var(--state-success)] inline-block"></span>
            <span class="text-[13px] font-medium" style="color: var(--color-text-secondary);">社区AI助手 · 在线</span>
          </div>
        </div>

        <!-- AI欢迎语气泡 -->
        <div class="flex items-start gap-2 mb-4">
          <div class="w-8 h-8 rounded-full overflow-hidden shrink-0 mt-0.5">
            <img src="../assets/ai-assistant-icon.jpg" alt="AI" class="w-full h-full object-cover">
          </div>
          <div class="max-w-[80%]">
            <div class="rounded-2xl rounded-tl-sm px-3.5 py-2.5 text-[14px] leading-relaxed" style="background-color: var(--brand-teal-50); color: var(--color-text-primary);">
              您好！我是社区AI助手，请问有什么可以帮您？支持语音输入和文字咨询哦~
            </div>
          </div>
        </div>

        <!-- 用户气泡 -->
        <div class="flex justify-end mb-4">
          <div class="max-w-[78%] rounded-2xl rounded-tr-sm px-3.5 py-2.5 text-[14px] leading-relaxed" style="background-color: var(--brand-teal-500); color: var(--color-text-inverse);">
            我家水龙头漏水了，怎么报修？
          </div>
        </div>

        <!-- AI回复气泡（带AI标识） -->
        <div class="flex items-start gap-2 mb-3">
          <div class="w-8 h-8 rounded-full overflow-hidden shrink-0 mt-0.5">
            <img src="../assets/ai-assistant-icon.jpg" alt="AI" class="w-full h-full object-cover">
          </div>
          <div class="max-w-[80%]">
            <div class="flex items-center gap-1.5 mb-1">
              <span class="inline-flex items-center justify-center px-1.5 py-0.5 rounded text-[10px] font-semibold" style="background-color: var(--brand-teal-100); color: var(--brand-teal-700);">AI</span>
            </div>
            <div class="rounded-2xl rounded-tl-sm px-3.5 py-2.5 text-[14px] leading-relaxed" style="background-color: var(--brand-teal-50); color: var(--color-text-primary);">
              已为您识别报修需求。推荐操作：<br>
              <span class="font-medium">1. 一键报修</span> → 自动生成工单<br>
              <span class="font-medium">2. 查看维修进度</span><br><br>
              已为您匹配维修师傅：<span class="font-semibold" style="color: var(--brand-teal-600);">张师傅（水电）</span>，预计30分钟上门。
            </div>
          </div>
        </div>

        <!-- TRAE大模型标注 -->
        <div class="flex items-start gap-2 mb-5 ml-10">
          <div class="border border-dashed rounded-lg px-2.5 py-1.5 text-[11px] leading-snug" style="border-color: var(--brand-teal-300); color: var(--brand-teal-700); background-color: rgba(240, 251, 249, 0.5);">
            <i data-lucide="sparkles" class="w-3 h-3 inline-block align-text-bottom mr-0.5" style="color: var(--brand-teal-500);"></i>
            TRAE大模型 · 自然语言理解 + 意图识别
          </div>
        </div>

        <!-- AI回复气泡带按钮 -->
        <div class="flex items-start gap-2 mb-4">
          <div class="w-8 h-8 rounded-full overflow-hidden shrink-0 mt-0.5">
            <img src="../assets/ai-assistant-icon.jpg" alt="AI" class="w-full h-full object-cover">
          </div>
          <div class="max-w-[80%]">
            <div class="flex items-center gap-1.5 mb-1">
              <span class="inline-flex items-center justify-center px-1.5 py-0.5 rounded text-[10px] font-semibold" style="background-color: var(--brand-teal-100); color: var(--brand-teal-700);">AI</span>
            </div>
            <div class="rounded-2xl rounded-tl-sm px-3.5 py-2.5 text-[14px] leading-relaxed" style="background-color: var(--brand-teal-50); color: var(--color-text-primary);">
              报修工单已生成，单号：<span class="font-semibold" style="color: var(--brand-teal-600);">WX20260708001</span>
            </div>
            <button class="mt-2 inline-flex items-center justify-center whitespace-nowrap px-4 py-2 rounded-lg text-[13px] font-medium transition-colors duration-150" style="background-color: var(--brand-teal-500); color: var(--color-text-inverse);">
              查看报修详情
              <i data-lucide="arrow-right" class="w-3.5 h-3.5 ml-1"></i>
            </button>
          </div>
        </div>

        <!-- TRAE大模型标注2 -->
        <div class="flex items-start gap-2 mb-5 ml-10">
          <div class="border border-dashed rounded-lg px-2.5 py-1.5 text-[11px] leading-snug" style="border-color: var(--brand-teal-300); color: var(--brand-teal-700); background-color: rgba(240, 251, 249, 0.5);">
            <i data-lucide="sparkles" class="w-3 h-3 inline-block align-text-bottom mr-0.5" style="color: var(--brand-teal-500);"></i>
            TRAE大模型 · 工单自动生成 + 师傅智能匹配
          </div>
        </div>

      </div>

      <!-- 快捷问题标签区域 -->
      <div class="absolute left-0 right-0 px-4 py-2" style="bottom: 130px; background: var(--color-bg);">
        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
          <button class="shrink-0 inline-flex items-center justify-center whitespace-nowrap px-3 py-1.5 rounded-lg text-[13px] font-medium border transition-colors duration-150" style="border-color: var(--brand-teal-200); color: var(--brand-teal-600); background-color: var(--brand-teal-50);">
            物业缴费
          </button>
          <button class="shrink-0 inline-flex items-center justify-center whitespace-nowrap px-3 py-1.5 rounded-lg text-[13px] font-medium border transition-colors duration-150" style="border-color: var(--brand-teal-200); color: var(--brand-teal-600); background-color: var(--brand-teal-50);">
            社保查询
          </button>
          <button class="shrink-0 inline-flex items-center justify-center whitespace-nowrap px-3 py-1.5 rounded-lg text-[13px] font-medium border transition-colors duration-150" style="border-color: var(--brand-teal-200); color: var(--brand-teal-600); background-color: var(--brand-teal-50);">
            垃圾分类
          </button>
          <button class="shrink-0 inline-flex items-center justify-center whitespace-nowrap px-3 py-1.5 rounded-lg text-[13px] font-medium border transition-colors duration-150" style="border-color: var(--brand-teal-200); color: var(--brand-teal-600); background-color: var(--brand-teal-50);">
            停车办卡
          </button>
          <button class="shrink-0 inline-flex items-center justify-center whitespace-nowrap px-3 py-1.5 rounded-lg text-[13px] font-medium border transition-colors duration-150" style="border-color: var(--brand-teal-200); color: var(--brand-teal-600); background-color: var(--brand-teal-50);">
            噪音投诉
          </button>
        </div>
      </div>

      <!-- 底部输入栏 -->
      <div class="absolute left-0 right-0 bottom-[50px] border-t bg-[var(--color-bg-elevated)] px-3 py-2.5" style="border-color: var(--color-border);">
        <div class="flex items-end gap-2">
          <!-- 语音输入按钮 -->
          <button class="inline-flex items-center justify-center w-9 h-9 rounded-full shrink-0 transition-transform duration-150 active:scale-95" style="background-color: var(--brand-teal-500);" aria-label="语音输入">
            <i data-lucide="mic" class="w-[18px] h-[18px]" style="color: var(--color-text-inverse);"></i>
          </button>
          <!-- 文字输入框 -->
          <div class="flex-1 min-w-0">
            <input type="text" placeholder="输入您的问题..." class="w-full h-9 px-3 rounded-lg text-[14px] bg-[var(--color-bg-subtle)] border outline-none transition-colors duration-150" style="border-color: var(--color-border); color: var(--color-text-primary);" aria-label="消息输入框">
          </div>
          <!-- 发送按钮 -->
          <button class="inline-flex items-center justify-center w-9 h-9 rounded-lg shrink-0 transition-transform duration-150 active:scale-95" style="background-color: var(--brand-teal-500);" aria-label="发送">
            <i data-lucide="send" class="w-4 h-4" style="color: var(--color-text-inverse);"></i>
          </button>
          <!-- 附加按钮 -->
          <button class="inline-flex items-center justify-center w-9 h-9 rounded-lg shrink-0 border transition-colors duration-150" style="border-color: var(--color-border);" aria-label="更多">
            <i data-lucide="plus" class="w-[18px] h-[18px]" style="color: var(--color-text-secondary);"></i>
          </button>
        </div>
      </div>

      <!-- 底部5Tab导航栏 -->
      <nav class="fixed bottom-0 left-0 right-0 z-40 max-w-md mx-auto" style="background-color: var(--color-bg-elevated); border-top: 1px solid var(--color-border);">
        <div class="flex items-center justify-around h-[50px]">
          <!-- 首页 -->
          <a href="home.html" data-dom-id="tab-home" class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--color-text-muted);">
            <i data-lucide="home" class="w-[20px] h-[20px]"></i>
            <span class="text-[10px] font-medium">首页</span>
          </a>
          <!-- AI客服(active) -->
          <a href="ai-chat.html" data-dom-id="tab-ai-chat" class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--brand-teal-500);">
            <i data-lucide="message-circle" class="w-[20px] h-[20px]"></i>
            <span class="text-[10px] font-semibold">AI客服</span>
          </a>
          <!-- 报修 -->
          <a href="repair.html" data-dom-id="tab-repair" class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--color-text-muted);">
            <i data-lucide="wrench" class="w-[20px] h-[20px]"></i>
            <span class="text-[10px] font-medium">报修</span>
          </a>
          <!-- 邻里 -->
          <a href="neighborhood.html" data-dom-id="tab-neighborhood" class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--color-text-muted);">
            <i data-lucide="users" class="w-[20px] h-[20px]"></i>
            <span class="text-[10px] font-medium">邻里</span>
          </a>
          <!-- 我的 -->
          <a href="profile.html" data-dom-id="tab-profile" class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--color-text-muted);">
            <i data-lucide="user" class="w-[20px] h-[20px]"></i>
            <span class="text-[10px] font-medium">我的</span>
          </a>
        </div>
        <!-- safe-area底部 -->
        <div class="h-[env(safe-area-inset-bottom,0px)]" style="background-color: var(--color-bg-elevated);"></div>
      </nav>

    </main>

    <script>lucide.createIcons();</script>
</body>
</html>
