<!DOCTYPE html>
<html lang="zh-CN" class="light">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能报修</title>
    <style id="theme-vars">
/* 智慧社区便民服务 — Brand CSS */
/* 主色调：暖米色 + 浅青绿色 | 简约清新亲民社区风 */

:root {
  /* ── Primary: 暖米色系 ── */
  --brand-warm-50: #FFFDF8;
  --brand-warm-100: #FFF8EC;
  --brand-warm-200: #FFEFD0;
  --brand-warm-300: #FFE0A8;
  --brand-warm-400: #FFCF7D;
  --brand-warm-500: #FFBA52;
  --brand-warm-600: #F5A623;
  --brand-warm-700: #D4891A;
  --brand-warm-800: #A66A14;
  --brand-warm-900: #7A4D0F;

  /* ── Accent: 浅青绿色系 ── */
  --brand-teal-50: #F0FBF9;
  --brand-teal-100: #D6F5EF;
  --brand-teal-200: #AEEAD9;
  --brand-teal-300: #79D9BF;
  --brand-teal-400: #45C3A3;
  --brand-teal-500: #2AA88B;
  --brand-teal-600: #1E8A72;
  --brand-teal-700: #1A6E5D;
  --brand-teal-800: #17574B;
  --brand-teal-900: #12463C;

  /* ── Semantic ── */
  --color-primary: var(--brand-teal-500);
  --color-primary-light: var(--brand-teal-100);
  --color-primary-dark: var(--brand-teal-700);
  --color-accent: var(--brand-warm-500);
  --color-accent-light: var(--brand-warm-100);

  --color-bg: #FDFCF9;
  --color-bg-elevated: #FFFFFF;
  --color-bg-subtle: #F7F5EF;
  --color-bg-muted: #F0EDE5;

  --color-text-primary: #2D3436;
  --color-text-secondary: #636E72;
  --color-text-muted: #A0A8AD;
  --color-text-inverse: #FFFFFF;

  --color-border: #E8E4DC;
  --color-border-light: #F0EDE5;

  /* ── State Colors ── */
  --state-success: #27AE60;
  --state-success-bg: #E8F8EF;
  --state-warning: #F5A623;
  --state-warning-bg: #FFF8EC;
  --state-error: #EB5757;
  --state-error-bg: #FDF0F0;
  --state-info: #2AA88B;
  --state-info-bg: #F0FBF9;

  /* ── Typography ── */
  --font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-md: 16px;
  --font-size-lg: 18px;
  --font-size-xl: 20px;
  --font-size-2xl: 24px;
  --font-size-3xl: 28px;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;

  /* ── Radius ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* ── Shadows (alpha ≤ 0.05 for static, deeper for float) ── */
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.10);

  /* ── Spacing ── */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;

  /* ── Elder Mode Override ── */
  --elder-font-scale: 1.0;
}

html.elder-mode {
  --font-size-xs: 14px;
  --font-size-sm: 16px;
  --font-size-base: 18px;
  --font-size-md: 20px;
  --font-size-lg: 22px;
  --font-size-xl: 24px;
  --font-size-2xl: 28px;
  --font-size-3xl: 32px;
  --space-sm: 12px;
  --space-md: 16px;
  --space-lg: 20px;
  --radius-md: 12px;
  --radius-lg: 16px;
}

/* ── Utility Classes ── */
.text-primary { color: var(--color-text-primary); }
.text-secondary { color: var(--color-text-secondary); }
.text-muted { color: var(--color-text-muted); }
.text-inverse { color: var(--color-text-inverse); }
.text-accent { color: var(--color-primary); }
.text-warm { color: var(--color-accent); }

.bg-page { background-color: var(--color-bg); }
.bg-card { background-color: var(--color-bg-elevated); }
.bg-subtle { background-color: var(--color-bg-subtle); }
.bg-accent { background-color: var(--color-primary); }
.bg-warm { background-color: var(--color-accent); }

.font-medium { font-weight: var(--font-weight-medium); }
.font-semibold { font-weight: var(--font-weight-semibold); }
.font-bold { font-weight: var(--font-weight-bold); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-bg);
    --color-foreground: var(--color-text-primary);
    --color-primary: var(--color-primary);
    --color-primary-foreground: var(--color-text-inverse);
    --color-primary-light: var(--color-primary-light);
    --color-primary-dark: var(--color-primary-dark);
    --color-accent: var(--color-accent);
    --color-accent-light: var(--color-accent-light);
    --color-muted: var(--color-bg-muted);
    --color-muted-foreground: var(--color-text-muted);
    --color-border: var(--color-border);
    --color-card: var(--color-bg-elevated);
    --color-card-foreground: var(--color-text-primary);
    --color-info: var(--state-info);
    --color-info-bg: var(--state-info-bg);
    --color-success: var(--state-success);
    --color-warning: var(--state-warning);
    --color-error: var(--state-error);
    --radius-sm: var(--radius-sm);
    --radius-md: var(--radius-md);
    --radius-lg: var(--radius-lg);
    --radius-xl: var(--radius-xl);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="font-family: var(--font-family);">

    <main class="flex flex-col h-screen max-w-md mx-auto bg-[var(--color-bg)] relative overflow-hidden">

      <!-- 状态栏占位 -->
      <div class="h-11 bg-[var(--color-bg)] shrink-0"></div>

      <!-- 小程序导航栏 -->
      <header class="sticky top-0 z-30 flex items-center px-4 h-11 bg-[var(--color-bg)] border-b border-[var(--color-border)] shrink-0">
        <div class="flex w-[88px] items-center justify-start">
          <button class="inline-flex items-center justify-center w-8 h-8 rounded-lg border border-[var(--color-border)] bg-[var(--color-bg)]" aria-label="返回" data-dom-id="nav-back">
            <i data-lucide="chevron-left" class="w-4 h-4" style="color: var(--color-text-primary);"></i>
          </button>
        </div>
        <div class="min-w-0 flex-1 text-center text-[16px] font-semibold tracking-[-0.02em]" style="color: var(--color-text-primary);">智能报修</div>
        <div class="flex w-[88px] items-center justify-center rounded-full border border-[var(--color-border)] bg-[var(--color-bg)]/90" aria-label="小程序菜单">
          <button class="flex h-full flex-1 items-center justify-center" aria-label="我的工单" data-dom-id="my-orders">
            <i data-lucide="clipboard-list" class="w-4 h-4" style="color: var(--color-text-secondary);"></i>
          </button>
          <span class="h-4 w-px bg-[var(--color-border)]" aria-hidden="true"></span>
          <button class="flex h-full flex-1 items-center justify-center" aria-label="关闭">
            <i data-lucide="x" class="w-4 h-4" style="color: var(--color-text-secondary);"></i>
          </button>
        </div>
      </header>

      <!-- 可滚动内容区域 -->
      <div class="flex-1 overflow-y-auto no-scrollbar" style="padding-bottom: 134px;">

        <!-- Tab 切换区 -->
        <div class="flex items-center border-b border-[var(--color-border)] bg-[var(--color-bg-elevated)] px-4 shrink-0" data-dom-id="tab-orders">
          <button class="flex-1 flex items-center justify-center h-11 text-[14px] font-semibold whitespace-nowrap relative" style="color: var(--color-primary);" data-dom-id="tab-pending" data-active="true">
            待处理
            <span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-8 h-[3px] rounded-full" style="background-color: var(--color-primary);"></span>
          </button>
          <button class="flex-1 flex items-center justify-center h-11 text-[14px] font-medium whitespace-nowrap relative" style="color: var(--color-text-muted);" data-dom-id="tab-progress">
            进行中
          </button>
          <button class="flex-1 flex items-center justify-center h-11 text-[14px] font-medium whitespace-nowrap relative" style="color: var(--color-text-muted);" data-dom-id="tab-done">
            已完成
          </button>
        </div>

        <!-- 报修提交表单区域（模拟展开状态） -->
        <section class="px-4 pt-4 pb-2">
          <div class="rounded-xl bg-[var(--color-bg-elevated)] border border-[var(--color-border-light)] p-4" data-dom-id="repair-form">

            <!-- 表单标题 -->
            <div class="flex items-center gap-2 mb-3">
              <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background-color: var(--brand-teal-50);">
                <i data-lucide="wrench" class="w-4 h-4" style="color: var(--color-primary);"></i>
              </div>
              <span class="text-[15px] font-semibold" style="color: var(--color-text-primary);">新建报修</span>
            </div>

            <!-- 故障描述输入框 -->
            <div class="mb-3">
              <label class="block text-[13px] font-medium mb-1.5" style="color: var(--color-text-secondary);">故障描述</label>
              <textarea class="w-full rounded-lg border border-[var(--color-border)] bg-[var(--color-bg)] px-3 py-2.5 text-[14px] leading-relaxed resize-none focus:outline-none focus:ring-2 focus:ring-[var(--brand-teal-400)]/40 focus:border-[var(--color-primary)] transition-colors" rows="3" placeholder="请描述您的故障情况，例如：厨房水管漏水、楼道灯不亮..." style="color: var(--color-text-primary);"></textarea>
            </div>

            <!-- 语音输入按钮 -->
            <button class="flex items-center gap-2 mb-3 px-3 py-2 rounded-lg border border-dashed border-[var(--color-border)] w-full text-left hover:border-[var(--color-primary)] transition-colors" aria-label="语音描述故障">
              <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background-color: var(--brand-teal-50);">
                <i data-lucide="mic" class="w-4 h-4" style="color: var(--color-primary);"></i>
              </div>
              <span class="text-[13px]" style="color: var(--color-text-secondary);">点击语音描述故障</span>
              <i data-lucide="chevron-right" class="w-3.5 h-3.5 ml-auto shrink-0" style="color: var(--color-text-muted);"></i>
            </button>

            <!-- 图片上传区域 -->
            <div class="mb-3">
              <label class="block text-[13px] font-medium mb-1.5" style="color: var(--color-text-secondary);">现场照片</label>
              <div class="flex gap-2">
                <div class="w-20 h-20 rounded-lg border-2 border-dashed border-[var(--color-border)] flex flex-col items-center justify-center shrink-0 hover:border-[var(--color-primary)] transition-colors cursor-pointer" style="background-color: var(--color-bg-subtle);">
                  <i data-lucide="plus" class="w-5 h-5" style="color: var(--color-text-muted);"></i>
                  <span class="text-[10px] mt-0.5" style="color: var(--color-text-muted);">添加</span>
                </div>
                <div class="w-20 h-20 rounded-lg border-2 border-dashed border-[var(--color-border)] flex flex-col items-center justify-center shrink-0 hover:border-[var(--color-primary)] transition-colors cursor-pointer" style="background-color: var(--color-bg-subtle);">
                  <i data-lucide="plus" class="w-5 h-5" style="color: var(--color-text-muted);"></i>
                  <span class="text-[10px] mt-0.5" style="color: var(--color-text-muted);">添加</span>
                </div>
                <div class="w-20 h-20 rounded-lg border-2 border-dashed border-[var(--color-border)] flex flex-col items-center justify-center shrink-0 hover:border-[var(--color-primary)] transition-colors cursor-pointer" style="background-color: var(--color-bg-subtle);">
                  <i data-lucide="plus" class="w-5 h-5" style="color: var(--color-text-muted);"></i>
                  <span class="text-[10px] mt-0.5" style="color: var(--color-text-muted);">添加</span>
                </div>
              </div>
            </div>

            <!-- 故障类型AI自动识别 -->
            <div class="mb-3">
              <label class="block text-[13px] font-medium mb-1.5" style="color: var(--color-text-secondary);">故障类型</label>
              <div class="flex items-center gap-2">
                <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[13px] font-medium" style="background-color: var(--brand-teal-50); color: var(--color-primary);">
                  <i data-lucide="home" class="w-3.5 h-3.5"></i>
                  水电维修
                </div>
                <span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded text-[10px] font-medium whitespace-nowrap" style="background-color: var(--brand-warm-100); color: var(--brand-warm-700);">
                  <i data-lucide="sparkles" class="w-2.5 h-2.5"></i>
                  AI识别
                </span>
              </div>
              <!-- TRAE大模型标注 -->
              <div class="mt-1.5 flex items-center gap-1 px-2 py-1 rounded text-[10px] border border-dashed border-[var(--color-border)]" style="color: var(--color-text-muted); background-color: var(--color-bg-subtle);">
                <i data-lucide="cpu" class="w-3 h-3 shrink-0"></i>
                <span>TRAE大模型 · 图像+语音多模态识别</span>
              </div>
            </div>

            <!-- 地址选择 -->
            <div class="mb-3">
              <label class="block text-[13px] font-medium mb-1.5" style="color: var(--color-text-secondary);">报修地址</label>
              <button class="flex items-center gap-2 w-full px-3 py-2.5 rounded-lg border border-[var(--color-border)] bg-[var(--color-bg)] text-left" aria-label="选择地址">
                <i data-lucide="map-pin" class="w-4 h-4 shrink-0" style="color: var(--color-primary);"></i>
                <span class="text-[14px] truncate flex-1 min-w-0" style="color: var(--color-text-primary);">阳光花园3号楼2单元501室</span>
                <i data-lucide="chevron-right" class="w-3.5 h-3.5 shrink-0" style="color: var(--color-text-muted);"></i>
              </button>
            </div>

            <!-- 期望上门时间 -->
            <div class="mb-4">
              <label class="block text-[13px] font-medium mb-1.5" style="color: var(--color-text-secondary);">期望上门时间</label>
              <button class="flex items-center gap-2 w-full px-3 py-2.5 rounded-lg border border-[var(--color-border)] bg-[var(--color-bg)] text-left" aria-label="选择时间">
                <i data-lucide="clock" class="w-4 h-4 shrink-0" style="color: var(--color-primary);"></i>
                <span class="text-[14px] flex-1" style="color: var(--color-text-muted);">请选择期望上门时间</span>
                <i data-lucide="chevron-right" class="w-3.5 h-3.5 shrink-0" style="color: var(--color-text-muted);"></i>
              </button>
            </div>

            <!-- 提交按钮 -->
            <button class="w-full h-11 rounded-lg text-[15px] font-semibold text-white whitespace-nowrap flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all" style="background-color: var(--color-primary);" data-dom-id="submit-repair">
              <i data-lucide="send" class="w-4 h-4"></i>
              提交报修
            </button>

          </div>
        </section>

        <!-- 工单列表 -->
        <section class="px-4 pt-3 pb-4">
          <div class="flex items-center justify-between mb-3">
            <span class="text-[15px] font-semibold" style="color: var(--color-text-primary);">工单列表</span>
            <span class="text-[12px]" style="color: var(--color-text-muted);">共2条</span>
          </div>

          <!-- 工单1: 进行中 -->
          <div class="rounded-xl bg-[var(--color-bg-elevated)] border border-[var(--color-border-light)] p-4 mb-3 border-l-[3px] border-l-[var(--state-warning)]" style="box-shadow: var(--shadow-sm);" data-dom-id="order-1">
            <!-- 顶部状态行 -->
            <div class="flex items-center justify-between mb-2.5">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium whitespace-nowrap" style="background-color: var(--state-warning-bg); color: var(--state-warning);">
                进行中
              </span>
              <span class="text-[11px] whitespace-nowrap" style="color: var(--color-text-muted);">工单号: WX20240315</span>
            </div>
            <!-- 标题 -->
            <h3 class="text-[15px] font-semibold mb-2" style="color: var(--color-text-primary);">厨房水管漏水</h3>
            <!-- 信息行 -->
            <div class="space-y-1.5 mb-3">
              <div class="flex items-center gap-1.5 text-[12px]" style="color: var(--color-text-secondary);">
                <i data-lucide="tag" class="w-3 h-3 shrink-0" style="color: var(--color-text-muted);"></i>
                水电类
              </div>
              <div class="flex items-center gap-1.5 text-[12px]" style="color: var(--color-text-secondary);">
                <i data-lucide="user" class="w-3 h-3 shrink-0" style="color: var(--color-text-muted);"></i>
                维修师傅：张师傅
              </div>
              <div class="flex items-center gap-1.5 text-[12px]" style="color: var(--color-text-secondary);">
                <i data-lucide="clock" class="w-3 h-3 shrink-0" style="color: var(--color-text-muted);"></i>
                预计上门：今天 14:00-16:00
              </div>
            </div>
            <!-- 进度条 -->
            <div class="mb-2">
              <div class="flex items-center justify-between mb-1">
                <span class="text-[11px]" style="color: var(--color-text-muted);">维修进度</span>
                <span class="text-[11px] font-semibold" style="color: var(--color-primary);">60%</span>
              </div>
              <div class="w-full h-1.5 rounded-full overflow-hidden" style="background-color: var(--color-bg-muted);">
                <div class="h-full rounded-full" style="width: 60%; background: linear-gradient(90deg, var(--brand-teal-400), var(--brand-teal-500));"></div>
              </div>
            </div>
            <!-- TRAE大模型标注 -->
            <div class="flex items-center gap-1 px-2 py-1 rounded text-[10px] border border-dashed border-[var(--color-border)] w-fit" style="color: var(--color-text-muted); background-color: var(--color-bg-subtle);">
              <i data-lucide="cpu" class="w-3 h-3 shrink-0"></i>
              <span>TRAE大模型 · 智能调度匹配</span>
            </div>
          </div>

          <!-- 工单2: 待处理 -->
          <div class="rounded-xl bg-[var(--color-bg-elevated)] border border-[var(--color-border-light)] p-4 mb-3 border-l-[3px] border-l-[var(--state-info)]" style="box-shadow: var(--shadow-sm);" data-dom-id="order-2">
            <!-- 顶部状态行 -->
            <div class="flex items-center justify-between mb-2.5">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium whitespace-nowrap" style="background-color: var(--state-info-bg); color: var(--state-info);">
                待处理
              </span>
              <span class="text-[11px] whitespace-nowrap" style="color: var(--color-text-muted);">工单号: WX20240316</span>
            </div>
            <!-- 标题 -->
            <h3 class="text-[15px] font-semibold mb-2" style="color: var(--color-text-primary);">楼道灯不亮</h3>
            <!-- 信息行 -->
            <div class="space-y-1.5 mb-3">
              <div class="flex items-center gap-1.5 text-[12px]" style="color: var(--color-text-secondary);">
                <i data-lucide="tag" class="w-3 h-3 shrink-0" style="color: var(--color-text-muted);"></i>
                电气类
              </div>
              <div class="flex items-center gap-1.5 text-[12px]" style="color: var(--color-text-secondary);">
                <i data-lucide="user" class="w-3 h-3 shrink-0" style="color: var(--color-text-muted);"></i>
                维修师傅：待分配
              </div>
            </div>
            <!-- TRAE大模型标注 -->
            <div class="flex items-center gap-1 px-2 py-1 rounded text-[10px] border border-dashed border-[var(--color-border)] w-fit" style="color: var(--color-text-muted); background-color: var(--color-bg-subtle);">
              <i data-lucide="cpu" class="w-3 h-3 shrink-0"></i>
              <span>TRAE大模型 · 智能调度匹配</span>
            </div>
          </div>

        </section>

      </div>

      <!-- 悬浮FAB按钮 -->

        <i data-lucide="plus" class="w-6 h-6"></i>
      </button>

      <!-- 底部5Tab导航栏 -->
      <nav class="fixed bottom-0 inset-x-0 z-30 bg-[var(--color-bg-elevated)] border-t border-[var(--color-border)]" style="max-width: 28rem; margin: 0 auto;" data-dom-id="tab-home">
        <div class="flex items-center justify-around h-[50px]">
          <button class="flex flex-col items-center justify-center gap-0.5 flex-1" aria-label="首页">
            <i data-lucide="home" class="w-5 h-5" style="color: var(--color-text-muted);"></i>
            <span class="text-[10px]" style="color: var(--color-text-muted);">首页</span>
          </button>
          <button class="flex flex-col items-center justify-center gap-0.5 flex-1" aria-label="AI客服">
            <i data-lucide="bot" class="w-5 h-5" style="color: var(--color-text-muted);"></i>
            <span class="text-[10px]" style="color: var(--color-text-muted);">AI客服</span>
          </button>
          <button class="flex flex-col items-center justify-center gap-0.5 flex-1" aria-label="报修" data-active="true">
            <i data-lucide="wrench" class="w-5 h-5" style="color: var(--color-primary);"></i>
            <span class="text-[10px] font-semibold" style="color: var(--color-primary);">报修</span>
          </button>
          <button class="flex flex-col items-center justify-center gap-0.5 flex-1" aria-label="邻里">
            <i data-lucide="users" class="w-5 h-5" style="color: var(--color-text-muted);"></i>
            <span class="text-[10px]" style="color: var(--color-text-muted);">邻里</span>
          </button>
          <button class="flex flex-col items-center justify-center gap-0.5 flex-1" aria-label="我的">
            <i data-lucide="circle-user" class="w-5 h-5" style="color: var(--color-text-muted);"></i>
            <span class="text-[10px]" style="color: var(--color-text-muted);">我的</span>
          </button>
        </div>
        <!-- 安全区 -->
        <div class="h-[env(safe-area-inset-bottom,34px)]" style="background-color: var(--color-bg-elevated);"></div>
      </nav>

    </main>
<script>lucide.createIcons();</script>
</body>
