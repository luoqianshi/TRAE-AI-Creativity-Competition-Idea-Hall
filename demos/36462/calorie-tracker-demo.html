<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Calorie Tracker · 一句话记卡路里（可交互演示）</title>
<meta name="description" content="像聊天一样说一句话或拍张照，就把这顿饭的卡路里记完。TRAE AI 创造力大赛 · 生活娱乐赛道报名演示 demo。" />
<style>
  /* ===========================================================
     Anthropic 风格主题 token —— 与真应用 src/index.css 一致
     canvas 奶油底 / ink 墨黑 / accent 暖橙 / danger 红棕
     =========================================================== */
  :root {
    --canvas: rgb(248, 248, 246);
    --ink: #1a1a1a;
    --accent: #cc785c;
    --danger: #b5482a;
    --line: rgb(26 26 26 / 0.12);
    --line-soft: rgb(26 26 26 / 0.07);
    --muted: rgb(26 26 26 / 0.55);
    --muted-strong: rgb(26 26 26 / 0.72);
    --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
    --font-serif: 'Tiempos Text', 'Source Serif Pro', 'Georgia', 'Songti SC', 'STSong', serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    color-scheme: light dark;
  }
  html.dark {
    --canvas: #1a1815;
    --ink: #e8e2d5;
    --accent: #e8967b;
    --danger: #d9806a;
    --line: rgb(232 226 213 / 0.14);
    --line-soft: rgb(232 226 213 / 0.08);
    --muted: rgb(232 226 213 / 0.55);
    --muted-strong: rgb(232 226 213 / 0.72);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    color: var(--ink);
    background-color: var(--canvas);
    background-image: radial-gradient(circle at top, color-mix(in srgb, var(--ink) 7%, transparent), transparent 42%);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background-color .3s ease, color .3s ease;
  }
  .font-serif { font-family: var(--font-serif); }
  .font-mono { font-family: var(--font-mono); }

  /* 顶部品牌行（手机框之外，呼应真应用落地页） */
  .topbar {
    position: fixed; inset: 0 0 auto 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px; pointer-events: none;
  }
  .brand {
    font-family: var(--font-mono);
    font-size: 12px; letter-spacing: .32em; text-transform: uppercase;
    color: var(--muted-strong);
  }
  .theme-toggle {
    pointer-events: auto;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: .18em;
    color: var(--muted); background: none; border: none; cursor: pointer;
    padding: 6px 8px; border-radius: 6px;
  }
  .theme-toggle:hover { color: var(--ink); }

  /* 居中布局 + 桌面"手机框"壳 */
  .stage {
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .phone {
    position: relative;
    width: 100%; max-width: 420px;
    height: min(860px, calc(100dvh - 48px));
    background: var(--canvas);
    border: 1px solid var(--line);
    border-radius: 32px;
    box-shadow: 0 24px 80px rgb(26 26 26 / 0.12);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  @media (max-width: 480px) {
    .stage { padding: 0; }
    .phone { max-width: none; height: 100dvh; border: none; border-radius: 0; box-shadow: none; }
    .topbar { display: none; }
  }

  /* 顶栏 */
  .header {
    flex: 0 0 auto;
    display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line-soft);
    background: color-mix(in srgb, var(--canvas) 85%, transparent);
    backdrop-filter: blur(8px);
  }
  .icon-btn {
    width: 44px; height: 44px; display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 999px; background: transparent;
    color: var(--muted-strong); cursor: pointer; transition: border-color .2s, color .2s;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink); }
  .header-label {
    text-align: center; font-family: var(--font-mono);
    font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--muted-strong);
  }

  /* 今日小结条 */
  .summary {
    flex: 0 0 auto;
    padding: 16px 22px 14px;
    border-bottom: 1px solid var(--line-soft);
  }
  .summary-top { display: flex; align-items: baseline; justify-content: space-between; }
  .summary-date { font-size: 12px; letter-spacing: .04em; color: var(--muted); }
  .summary-goal { font-size: 12px; color: var(--muted); }
  .summary-main { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
  .summary-intake {
    font-family: var(--font-serif); font-size: 40px; line-height: 1; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .summary-unit { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
  .bar { margin-top: 12px; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 999px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .summary-stats { display: flex; gap: 22px; margin-top: 12px; }
  .stat-label { font-size: 11px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
  .stat-value { font-family: var(--font-serif); font-size: 20px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat-value.burn { color: var(--ink); }
  .stat-value.net { color: var(--accent); }

  /* 对话流 */
  .chat {
    flex: 1 1 auto; overflow-y: auto; padding: 20px 18px 8px;
    display: flex; flex-direction: column; gap: 14px;
    scrollbar-width: none;
  }
  .chat::-webkit-scrollbar { display: none; }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 82%; padding: 11px 15px; border-radius: 18px; font-size: 15px; line-height: 1.55;
    animation: rise .28s cubic-bezier(.2,.8,.2,1);
  }
  .bubble.user { background: var(--ink); color: var(--canvas); border-bottom-right-radius: 6px; }
  .bubble.assistant { background: color-mix(in srgb, var(--ink) 6%, var(--canvas)); color: var(--ink); border-bottom-left-radius: 6px; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* 记录结果卡 */
  .record { display: flex; flex-direction: column; gap: 2px; }
  .record-line { font-size: 15px; }
  .record-kcal { font-family: var(--font-mono); font-size: 14px; color: var(--accent); font-weight: 600; }
  .record-kcal.burn { color: var(--ink); }
  .record-note { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* 结算卡 */
  .settle { width: 100%; max-width: 88%; }
  .settle-card {
    border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px;
    background: color-mix(in srgb, var(--ink) 4%, var(--canvas));
    animation: rise .28s cubic-bezier(.2,.8,.2,1);
  }
  .settle-title { font-family: var(--font-serif); font-size: 19px; margin: 0 0 12px; }
  .settle-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .settle-cell .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .settle-cell .v { font-family: var(--font-serif); font-size: 22px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .settle-cell .v.accent { color: var(--accent); }
  .settle-items { border-top: 1px solid var(--line-soft); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .settle-item { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted-strong); }
  .settle-item .m { font-family: var(--font-mono); }
  .settle-encourage { margin-top: 10px; font-size: 13px; color: var(--accent); font-style: italic; }

  /* 思考三跳点 */
  .thinking { display: inline-flex; gap: 5px; padding: 14px 16px; }
  .thinking span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .thinking span:nth-child(2) { animation-delay: .2s; }
  .thinking span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

  /* 底部操作区 */
  .dock {
    flex: 0 0 auto;
    border-top: 1px solid var(--line-soft);
    background: color-mix(in srgb, var(--canvas) 85%, transparent);
    backdrop-filter: blur(8px);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; font-size: 13px; padding: 7px 13px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--muted-strong);
    cursor: pointer; white-space: nowrap; transition: border-color .2s, color .2s;
  }
  .chip:hover { color: var(--ink); border-color: var(--ink); }

  .actions { display: flex; gap: 8px; margin-bottom: 10px; }
  .action {
    flex: 1; font-size: 13px; padding: 9px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: transparent; color: var(--muted-strong);
    cursor: pointer; transition: border-color .2s, color .2s; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .action:hover { color: var(--ink); border-color: var(--ink); }

  .inputbar { display: flex; align-items: center; gap: 8px; }
  .input-wrap {
    flex: 1; display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 16px;
    transition: border-color .2s;
  }
  .input-wrap:focus-within { border-color: var(--accent); }
  .input-wrap input {
    flex: 1; border: none; outline: none; background: transparent; color: var(--ink);
    font-size: 15px; font-family: var(--font-sans);
  }
  .input-wrap input::placeholder { color: var(--muted); }
  .send {
    width: 38px; height: 38px; flex: 0 0 auto; border-radius: 999px; border: none;
    background: var(--ink); color: var(--canvas); cursor: pointer; display: grid; place-items: center;
    transition: opacity .2s, transform .1s;
  }
  .send:disabled { opacity: .35; cursor: default; }
  .send:not(:disabled):active { transform: scale(.92); }

  .disclaimer { margin-top: 10px; text-align: center; font-size: 11px; color: var(--muted); line-height: 1.5; }

  /* toast */
  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 20px);
    background: var(--ink); color: var(--canvas); font-size: 13px;
    padding: 10px 16px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; z-index: 50; max-width: 86vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 空态首屏提示 */
  .empty {
    margin: auto 0; text-align: center; color: var(--muted); padding: 0 12px;
  }
  .empty .big { font-family: var(--font-serif); font-size: 26px; color: var(--ink); margin-bottom: 8px; }
  .empty .sub { font-size: 14px; line-height: 1.6; }
  .empty .num { font-family: var(--font-mono); color: var(--accent); font-size: 13px; letter-spacing: .1em; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="topbar">

  <div class="stage">

      <!-- 对话流 -->

<script>
(function () {
  'use strict';

  // ====== 食物 / 运动数据 —— 取自真应用 prompt 内置的热量参考 ======
  // 每条按"常见一份"给出口语化热量，让 mock AI 的数字可信
  var FOODS = {
    '牛肉面': { kcal: 620, unit: '碗' }, '拉面': { kcal: 580, unit: '碗' }, '面条': { kcal: 350, unit: '碗' },
    '米饭': { kcal: 200, unit: '碗' }, '炒饭': { kcal: 480, unit: '碗' }, '馒头': { kcal: 220, unit: '个' },

    '鸡胸肉': { kcal: 165, unit: '份' }, '炸鸡': { kcal: 250, unit: '块' }, '红烧肉': { kcal: 480, unit: '份' },
    '汉堡': { kcal: 550, unit: '个' }, '披萨': { kcal: 285, unit: '块' }, '薯条': { kcal: 320, unit: '份' },
    '沙拉': { kcal: 150, unit: '份' }, '西兰花': { kcal: 60, unit: '份' },
    '苹果': { kcal: 90, unit: '个' }, '香蕉': { kcal: 105, unit: '根' }, '橙子': { kcal: 70, unit: '个' },
    '雪糕': { kcal: 200, unit: '根' }, '冰淇淋': { kcal: 230, unit: '份' }, '薯片': { kcal: 280, unit: '包' },
    '巧克力': { kcal: 270, unit: '块' }, '饼干': { kcal: 200, unit: '份' }, '蛋糕': { kcal: 350, unit: '块' },
    '可乐': { kcal: 140, unit: '罐' }, '奶茶': { kcal: 300, unit: '杯' }, '豆浆': { kcal: 90, unit: '杯' },
    '咖啡': { kcal: 10, unit: '杯' }, '拿铁': { kcal: 110, unit: '杯' }, '果汁': { kcal: 150, unit: '杯' },
    '啤酒': { kcal: 150, unit: '瓶' }, '火锅': { kcal: 800, unit: '顿' }, '烤鸭': { kcal: 500, unit: '份' }
  };
  // 运动消耗（kcal / 小时），取真应用区间中位
  var EXERCISES = {
    '跑步': 600, '慢跑': 550, '走路': 250, '散步': 220, '健身': 350, '撸铁': 350,
    '游泳': 500, '骑车': 400, '骑行': 400, '单车': 400, '瑜伽': 200, '篮球': 525,
    '足球': 560, '羽毛球': 480, '跳绳': 700, '滑雪': 500, '爬山': 480, '跳操': 420
  };

  var CN_NUM = { '零': 0, '一': 1, '两': 2, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10, '半': 0.5 };
  var UNITS = '碗个根杯份块片只瓶罐包顿盒袋串份';

  // ====== 今日账本状态 ======
  var GOAL = 1800;
  var state = { intake: 0, burn: 0, items: [] };

  // ====== DOM ======
  var chat = document.getElementById('chat');
  var empty = document.getElementById('empty');
  var input = document.getElementById('input');
  var send = document.getElementById('send');
  var toastEl = document.getElementById('toast');

  function $(id) { return document.getElementById(id); }

  // ====== 数量解析 ======
  function parseQty(text) {
    // 阿拉伯数字优先
    var m = text.match(/(\d+(\.\d+)?)\s*[碗个根杯份块片只瓶罐包顿盒袋串]/);
    if (m) return parseFloat(m[1]);
    // 中文数字 + 量词，如 "两碗" "三个" "半杯"
    var re = new RegExp('([零一两二三四五六七八九十半])\\s*[' + UNITS + ']');
    var c = text.match(re);
    if (c && CN_NUM[c[1]] != null) return CN_NUM[c[1]];
    // 裸中文数量 "两份炒饭" 已覆盖；"一个" 等同上
    return 1;
  }

  // ====== 时长解析（小时） ======
  function parseHours(text) {
    var min = text.match(/(\d+(\.\d+)?)\s*分钟/);
    if (min) return parseFloat(min[1]) / 60;
    if (/半\s*(个)?\s*小时/.test(text)) return 0.5;
    var hr = text.match(/(\d+(\.\d+)?)\s*(个)?\s*小时/);
    if (hr) return parseFloat(hr[1]);
    var cnHr = text.match(/([一两二三四五六七八九十])\s*(个)?\s*小时/);
    if (cnHr && CN_NUM[cnHr[1]] != null) return CN_NUM[cnHr[1]];
    return 0.5; // 默认半小时
  }

  // ====== 核心：把一句话解析成动作 ======
  function parse(text) {
    var t = text.trim();

    // 查询意图
    if (/结算|汇总|总结|今天.*(怎么样|情况|如何)|今日.*(怎么样|情况|如何)|怎么样|还能吃|还可以吃/.test(t)) {
      return { type: 'query' };
    }

    // 运动
    for (var ex in EXERCISES) {
      if (t.indexOf(ex) !== -1) {
        var hours = parseHours(t);
        var burn = Math.round(EXERCISES[ex] * hours / 10) * 10;
        var label = ex + (hours === 0.5 ? ' 30 分钟' : (Number.isInteger(hours) ? ' ' + hours + ' 小时' : ' ' + Math.round(hours * 60) + ' 分钟'));
        return { type: 'exercise', name: ex, label: label, kcal: burn };
      }
    }

    // 食物（可能多种，用顿号/和/加 分隔）
    var found = [];
    var seen = {};
    for (var f in FOODS) {
      var idx = t.indexOf(f);
      if (idx !== -1 && !seen[f]) {
        // 避免子串重复（如"鸡蛋"已匹配则跳过更短的）
        seen[f] = true;
        var qty = parseQty(sliceAround(t, idx, f.length));
        var kcal = Math.round(FOODS[f].kcal * qty);
        found.push({ name: f, qty: qty, unit: FOODS[f].unit, kcal: kcal });
      }
    }
    if (found.length) return { type: 'food', items: found };

    // 兜底：像在描述吃的东西 → 给个估算
    if (t.length <= 24 && /[吃喝点了]/.test(t) === false ? false : true) {
      return { type: 'food', items: [{ name: cleanName(t), qty: 1, unit: '份', kcal: 250, estimated: true }] };
    }
    return { type: 'unknown' };
  }

  // 取目标词附近的片段用于数量解析（数量词通常紧挨食物名）
  function sliceAround(text, idx, len) {
    var start = Math.max(0, idx - 4);
    return text.slice(start, idx + len);
  }
  function cleanName(t) {
    return t.replace(/^(我|今天|刚才|刚刚)?(吃|喝|吃了|喝了|来了|来|点了|点)?/, '').slice(0, 12) || '这一餐';
  }

  // ====== UI 渲染 ======
  function clearEmpty() { if (empty) { empty.remove(); empty = null; } }
  function scrollDown() { chat.scrollTop = chat.scrollHeight; }

  function pushUser(text) {
    clearEmpty();
    var row = document.createElement('div'); row.className = 'row user';
    var b = document.createElement('div'); b.className = 'bubble user'; b.textContent = text;
    row.appendChild(b); chat.appendChild(row); scrollDown();
  }

  function pushThinking() {
    var row = document.createElement('div'); row.className = 'row assistant'; row.dataset.thinking = '1';
    var t = document.createElement('div'); t.className = 'bubble assistant thinking';
    t.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(t); chat.appendChild(row); scrollDown();
    return row;
  }

  function pushAssistant(html) {
    var row = document.createElement('div'); row.className = 'row assistant';
    var b = document.createElement('div'); b.className = 'bubble assistant'; b.innerHTML = html;
    row.appendChild(b); chat.appendChild(row); scrollDown();
  }

  function pushSettle(html) {
    var row = document.createElement('div'); row.className = 'row assistant';
    var wrap = document.createElement('div'); wrap.className = 'settle';
    wrap.innerHTML = html; row.appendChild(wrap); chat.appendChild(row); scrollDown();
  }

  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

  // ====== 动作执行 ======
  function applyFood(items) {
    var lines = [];
    items.forEach(function (it) {
      state.intake += it.kcal;
      state.items.push({ name: it.name, kcal: it.kcal, type: 'food' });
      var qtyText = (it.qty === 0.5 ? '半' : it.qty) + ' ' + it.unit;
      lines.push(
        '<div class="record-line">已记录：' + esc(it.name) + ' ' + qtyText + '</div>' +
        '<div class="record-kcal">+ ' + it.kcal + ' kcal' + (it.estimated ? ' <span class="record-note">（估算）</span>' : '') + '</div>'
      );
    });
    pushAssistant('<div class="record">' + lines.join('<div style="height:8px"></div>') + '</div>');
    renderSummary();
  }

  function applyExercise(act) {
    state.burn += act.kcal;
    state.items.push({ name: act.name, kcal: -act.kcal, type: 'exercise' });
    pushAssistant(
      '<div class="record">' +
      '<div class="record-line">已记录运动：' + esc(act.label) + '</div>' +
      '<div class="record-kcal burn">− ' + act.kcal + ' kcal</div>' +
      '</div>'
    );
    renderSummary();
  }

  function settleCard() {
    var net = state.intake - state.burn;
    var left = Math.max(0, GOAL - net);
    var itemRows = state.items.length
      ? state.items.map(function (it) {
          var sign = it.kcal >= 0 ? '+' : '−';
          return '<div class="settle-item"><span>' + esc(it.name) + '</span><span class="m">' + sign + ' ' + Math.abs(it.kcal) + ' kcal</span></div>';
        }).join('')
      : '<div class="settle-item"><span style="color:var(--muted)">今天还没有记录</span><span></span></div>';

    var encourage;
    if (state.items.length === 0) encourage = '先记一笔吧，哪怕一杯水也是开始。';
    else if (net <= GOAL) encourage = '净摄入还在目标内，保持住，今天做得不错。';
    else if (net <= GOAL + 300) encourage = '略微超出目标，傍晚散散步就回来了。';
    else encourage = '今天稍微多了点，明天清淡一些就好，别有负担。';

    pushSettle(
      '<div class="settle-card">' +
      '<h3 class="settle-title">今日结算</h3>' +
      '<div class="settle-grid">' +
        '<div class="settle-cell"><div class="k">摄入</div><div class="v accent">' + state.intake + '</div></div>' +
        '<div class="settle-cell"><div class="k">消耗</div><div class="v">' + state.burn + '</div></div>' +
        '<div class="settle-cell"><div class="k">净摄入</div><div class="v">' + net + '</div></div>' +
      '</div>' +
      '<div class="settle-items">' + itemRows + '</div>' +
      '<div class="settle-encourage">' + encourage + '</div>' +
      '</div>'
    );
  }

  // ====== 今日小结条更新 ======
  function renderSummary() {
    var net = state.intake - state.burn;
    var left = GOAL - net;
    animateNum($('intakeNum'), state.intake);
    animateNum($('burnNum'), state.burn);
    $('netNum').textContent = net;
    $('leftNum').textContent = left >= 0 ? left : ('超 ' + Math.abs(left));
    $('netNum').style.color = net > GOAL ? 'var(--danger)' : 'var(--accent)';
    var pct = Math.max(0, Math.min(100, (net / GOAL) * 100));
    $('barFill').style.width = pct + '%';
    $('barFill').style.background = net > GOAL ? 'var(--danger)' : 'var(--accent)';
  }

  function animateNum(el, target) {
    var from = parseInt(el.textContent, 10) || 0;
    var start = performance.now(), dur = 400;
    function step(now) {
      var p = Math.min(1, (now - start) / dur);
      el.textContent = Math.round(from + (target - from) * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // ====== 一次完整对话回合 ======
  var busy = false;
  function handle(text) {
    if (busy || !text.trim()) return;
    busy = true; send.disabled = true;
    pushUser(text);
    input.value = '';
    var thinking = pushThinking();

    setTimeout(function () {
      thinking.remove();
      var act = parse(text);
      if (act.type === 'query') {
        pushAssistant('帮你结算一下今天 👇');
        setTimeout(settleCard, 220);
      } else if (act.type === 'exercise') {
        applyExercise(act);
      } else if (act.type === 'food') {
        applyFood(act.items);
      } else {
        pushAssistant('没太听懂这是吃的还是运动～换种说法试试，比如「一碗牛肉面」或「跑步 30 分钟」。');
      }
      busy = false;
      updateSend();
    }, 620 + Math.random() * 320);
  }

  // ====== 拍照识别（模拟） ======
  var PHOTO_RESULTS = [
    { name: '番茄炒蛋 + 米饭', kcal: 420 },
    { name: '红烧牛肉面', kcal: 640 },
    { name: '鸡胸沙拉', kcal: 230 },
    { name: '一份炸鸡套餐', kcal: 780 },
    { name: '三明治 + 拿铁', kcal: 460 }
  ];
  var photoIdx = 0;
  function handlePhoto() {
    if (busy) return;
    busy = true; send.disabled = true;
    clearEmpty();
    var row = document.createElement('div'); row.className = 'row user';
    var b = document.createElement('div'); b.className = 'bubble user';
    b.innerHTML = '📷 一张餐桌照片';
    row.appendChild(b); chat.appendChild(row); scrollDown();
    var thinking = pushThinking();
    setTimeout(function () {
      thinking.remove();
      var r = PHOTO_RESULTS[photoIdx % PHOTO_RESULTS.length]; photoIdx++;
      state.intake += r.kcal;
      state.items.push({ name: r.name, kcal: r.kcal, type: 'food' });
      pushAssistant(
        '<div class="record">' +
        '<div class="record-line">识别到：' + esc(r.name) + '</div>' +
        '<div class="record-kcal">+ ' + r.kcal + ' kcal <span class="record-note">（视觉估算，可在正式版手动校正）</span></div>' +
        '</div>'
      );
      renderSummary();
      busy = false; updateSend();
    }, 900 + Math.random() * 400);
  }

  // ====== 事件绑定 ======
  function updateSend() { send.disabled = busy || input.value.trim() === ''; }
  input.addEventListener('input', updateSend);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') handle(input.value); });
  send.addEventListener('click', function () { handle(input.value); });

  document.getElementById('chips').addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (chip) handle(chip.dataset.text);
  });
  document.getElementById('settleBtn').addEventListener('click', function () {
    if (busy) return; clearEmpty(); settleCard();
  });
  document.getElementById('photoBtn').addEventListener('click', handlePhoto);

  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }
  document.getElementById('historyBtn').addEventListener('click', function () { toast('完整版含周/月/年历史曲线与柱状图'); });
  document.getElementById('settingsBtn').addEventListener('click', function () { toast('完整版可设置身高体重、每日目标与 API'); });

  // 深色模式切换
  document.getElementById('themeToggle').addEventListener('click', function () {
    document.documentElement.classList.toggle('dark');
  });

  // ====== 初始化 ======
  $('goalText').textContent = GOAL;
  (function setDate() {
    var d = new Date();
    $('summaryDate').textContent = '今日 · ' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  })();
  renderSummary();
})();
</script>
</body>
</html>
