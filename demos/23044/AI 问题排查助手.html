<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 问题排查助手</title>

  <style>
    @font-face {
      font-family: 'InstrumentSans';
      src: url('./_shared/fonts/InstrumentSans-Regular.ttf') format('truetype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'InstrumentSans';
      src: url('./_shared/fonts/InstrumentSans-Bold.ttf') format('truetype');
      font-weight: 700;
    }

      font-family: 'JetBrainsMono';
      src: url('./_shared/fonts/JetBrainsMono-Regular.ttf') format('truetype');

  <style>
    :root {
      --bg: #f6f7f9;
      --bg2: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --rule: #e5e7eb;
      --accent: #2563eb;
      --accent2: #7c3aed;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --font: 'InstrumentSans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-mono: 'JetBrainsMono', monospace;
      --max: 960px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
      padding: 0;
      min-height: 100vh;
    }

    .container {
      max-width: var(--max);
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    header.app-header {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      padding: 2.5rem 1rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(37,99,235,0.25);
    }
    header.app-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    header.app-header p {
      opacity: 0.9;
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }

    .card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: box-shadow 0.2s;
    }
    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .input-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    textarea, input[type="text"] {
      flex: 1 1 300px;
      padding: 0.75rem 1rem;
      border: 1px solid var(--rule);
      border-radius: 8px;
      font-family: var(--font);
      font-size: 1rem;
      resize: vertical;
      min-height: 48px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }
    button {
      padding: 0.65rem 1.25rem;
      border: none;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      white-space: nowrap;
    }
    button:active { transform: translateY(1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-weight: 700;
    }
    .btn-primary:hover { opacity: 0.92; }
    .btn-secondary {
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--rule);
    }
    .btn-secondary:hover { background: #eef0f3; }
    .btn-success {
      background: var(--success);
      color: #fff;
    }
    .btn-danger {
      background: var(--danger);
      color: #fff;
    }
    .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.85rem; border-radius: 6px; }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .section-title .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
    }

    /* Tree visualization */
    .tree-wrap {
      overflow-x: auto;
      padding: 1rem 0;
    }
    .tree-svg {
      display: block;
      margin: 0 auto;
    }
    .tree-node {
      cursor: pointer;
      transition: filter 0.2s;
    }
    .tree-node:hover { filter: brightness(1.05); }
    .tree-node rect {
      rx: 8;
      ry: 8;
    }
    .tree-link {
      fill: none;
      stroke: var(--rule);
      stroke-width: 2;
    }
    .tree-text {
      font-family: var(--font);
      font-size: 12px;
      fill: var(--ink);
      pointer-events: none;
      text-anchor: middle;
    }
    .tree-legend {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
    .tree-legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    /* Cause cards */
    .cause-list { display: flex; flex-direction: column; gap: 1rem; }
    .cause-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .cause-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,0.08); }
    .cause-card.solved { border-color: var(--success); }
    .cause-card.unsolved { border-color: var(--danger); }
    .cause-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      cursor: pointer;
      background: #fafbfc;
      gap: 0.75rem;
    }
    .cause-header:hover { background: #f3f4f6; }
    .cause-title {
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
    }
    .cause-title .toggle-icon {
      width: 20px; height: 20px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 4px;
      background: var(--rule);
      font-size: 0.75rem;
      transition: transform 0.2s;
    }
    .cause-card.expanded .toggle-icon { transform: rotate(90deg); }
    .cause-badges { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: var(--rule);
      color: var(--muted);
    }
    .badge.badge-solved { background: #d1fae5; color: #065f46; }
    .badge.badge-unsolved { background: #fee2e2; color: #991b1b; }

    .cause-body {
      display: none;
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--rule);
    }
    .cause-card.expanded .cause-body { display: block; }

    .solution-box {
      background: #f8fafc;
      border-left: 4px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .solution-box h4 { font-size: 0.9rem; margin-bottom: 0.5rem; }
    .solution-box ol { padding-left: 1.2rem; }
    .solution-box li { margin-bottom: 0.35rem; }

    .feedback-bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }
    .feedback-form {
      margin-top: 0.75rem;
      display: none;
    }
    .feedback-form.show { display: block; }
    .feedback-form textarea {
      width: 100%;
      min-height: 80px;
      margin-bottom: 0.5rem;
    }

    .child-causes { margin-top: 1rem; padding-left: 1rem; border-left: 2px solid var(--rule); }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .breadcrumb a { color: var(--accent); text-decoration: none; cursor: pointer; }
    .breadcrumb a:hover { text-decoration: underline; }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
    }
    .empty-state svg { width: 64px; height: 64px; margin-bottom: 1rem; opacity: 0.4; }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: var(--ink);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
      z-index: 1000;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
      .container { padding: 1rem; }
      header.app-header { padding: 1.5rem 1rem; }
      .cause-header { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>AI 问题排查助手</h1>
    <p>描述您遇到的问题，AI 将为您提供系统化的排查链条与解决方案</p>
  </header>

  <div class="container">
    <!-- Step 1: Problem Input -->
    <div class="card" id="problem-card">
      <div class="section-title">1. 描述问题 <span class="badge">开始</span></div>
      <div class="input-group">
        <textarea id="problem-input" rows="3" placeholder="例如：我的电脑无法连接Wi-Fi，已经重启过路由器..."></textarea>
        <button class="btn-primary" onclick="submitProblem()">开始排查</button>
      </div>
    </div>

    <!-- Step 2: Tree Overview -->
    <div class="card" id="tree-card" style="display:none;">
      <div class="section-title">2. 排查树概览 <span class="badge">可视化</span></div>
      <div class="breadcrumb" id="tree-breadcrumb"></div>
      <div class="tree-wrap">
        <svg id="tree-svg" class="tree-svg"></svg>
      </div>
      <div class="tree-legend">
        <span><span class="dot" style="background:var(--accent)"></span> 当前节点</span>
        <span><span class="dot" style="background:var(--success)"></span> 已解决</span>
        <span><span class="dot" style="background:var(--danger)"></span> 未解决</span>
        <span><span class="dot" style="background:var(--muted)"></span> 待排查</span>
      </div>
    </div>

    <!-- Step 3: Cause Chain -->
    <div class="card" id="causes-card" style="display:none;">
      <div class="section-title">3. 排查链条 <span class="badge">逐步排查</span></div>
      <div class="breadcrumb" id="causes-breadcrumb"></div>
      <div class="cause-list" id="cause-list"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ===================== Data Model =====================
    let appState = {
      problem: '',
      tree: null,
      currentPath: [], // array of node ids
      expanded: new Set(),
      feedback: {} // nodeId -> {status: 'solved'|'unsolved', note: string}
    };

    // Demo tree data
    const demoTree = {
      id: 'root',
      title: '电脑无法连接 Wi-Fi',
      description: '电脑无法连接到无线网络',
      solutions: [
        '确认Wi-Fi开关已打开（笔记本通常有物理开关或Fn组合键）',
        '尝试重启电脑和路由器',
        '检查网络适配器是否被禁用'
      ],
      children: [
        {
          id: 'c1',
          title: '路由器问题',
          description: '其他设备也无法连接，可能是路由器故障',
          solutions: [
            '检查路由器电源和指示灯状态',
            '重启路由器（断电30秒后重新上电）',
            '登录路由器管理页面检查设置'
          ],
          children: [
            {
              id: 'c1-1',
              title: '路由器固件过旧',
              description: '路由器固件版本过旧导致兼容性问题',
              solutions: [
                '访问路由器厂商官网下载最新固件',
                '在路由器管理页面执行固件升级',
                '升级后恢复出厂设置并重新配置'
              ],
              children: []
            },
            {
              id: 'c1-2',
              title: '路由器硬件故障',
              description: '路由器硬件出现物理损坏',
              solutions: [
                '检查路由器散热是否正常',
                '尝试更换网线或电源适配器',
                '联系厂商售后或更换路由器'
              ],
              children: []
            }
          ]
        },
        {
          id: 'c2',
          title: '电脑网络适配器问题',
          description: '电脑自身的无线网络适配器出现故障',
          solutions: [
            '在设备管理器中检查网络适配器状态',
            '尝试更新或重装无线网卡驱动',
            '运行Windows网络诊断工具'
          ],
          children: [
            {
              id: 'c2-1',
              title: '驱动程序问题',
              description: '无线网卡驱动损坏或版本过旧',
              solutions: [
                '从设备管理器卸载无线网卡后重新扫描硬件',
                '访问电脑/网卡厂商官网下载最新驱动',
                '使用驱动管理工具自动更新'
              ],
              children: []
            },
            {
              id: 'c2-2',
              title: '适配器硬件故障',
              description: '无线网卡硬件损坏',
              solutions: [
                '尝试使用USB无线网卡测试',
                '检查BIOS中无线功能是否被禁用',
                '联系售后进行硬件检测'
              ],
              children: []
            }
          ]
        },
        {
          id: 'c3',
          title: '系统设置问题',
          description: '操作系统网络设置异常',
          solutions: [
            '检查飞行模式是否开启',
            '重置网络设置（设置 > 网络和Internet > 高级网络设置 > 网络重置）',
            '检查代理设置是否正确'
          ],
          children: [
            {
              id: 'c3-1',
              title: 'IP 配置冲突',
              description: 'IP地址与其他设备冲突或配置错误',
              solutions: [
                '在命令提示符执行 ipconfig /release 和 ipconfig /renew',
                '尝试设置静态IP地址',
                '检查DHCP服务是否正常工作'
              ],
              children: []
            },
            {
              id: 'c3-2',
              title: '防火墙/安全软件拦截',
              description: '防火墙或安全软件阻止了网络连接',
              solutions: [
                '暂时关闭防火墙测试连接',
                '将Wi-Fi网络添加到信任区域',
                '检查安全软件的网络保护设置'
              ],
              children: []
            }
          ]
        }
      ]
    };

    // ===================== Utilities =====================
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function getNodeById(tree, id) {
      if (tree.id === id) return tree;
      for (const child of tree.children || []) {
        const found = getNodeById(child, id);
        if (found) return found;
      }
      return null;
    }

    function getPathToNode(tree, id, path = []) {
      if (tree.id === id) return [...path, tree];
      for (const child of tree.children || []) {
        const res = getPathToNode(child, id, [...path, tree]);
        if (res) return res;
      }
      return null;
    }

    function getParent(tree, id) {
      const path = getPathToNode(tree, id);
      if (!path || path.length < 2) return null;
      return path[path.length - 2];
    }

    // ===================== Problem Submission =====================
    function submitProblem() {
      const input = document.getElementById('problem-input').value.trim();
      if (!input) { showToast('请先描述您的问题'); return; }
      appState.problem = input;
      appState.tree = JSON.parse(JSON.stringify(demoTree));
      appState.tree.title = input;
      appState.currentPath = ['root'];
      appState.expanded = new Set(['root']);
      appState.feedback = {};
      document.getElementById('tree-card').style.display = 'block';
      document.getElementById('causes-card').style.display = 'block';
      renderAll();
      showToast('排查链条已生成，请逐步排查');
    }

    // ===================== Rendering =====================
    function renderAll() {
      renderBreadcrumbs();
      renderTree();
      renderCauses();
    }

    function renderBreadcrumbs() {
      const treePath = appState.currentPath;
      const makeCrumb = (path, containerId, onClick) => {
        const container = document.getElementById(containerId);
        const nodes = path.map(id => getNodeById(appState.tree, id)).filter(Boolean);
        container.innerHTML = '';
        nodes.forEach((node, idx) => {
          if (idx > 0) {
            const sep = document.createElement('span');
            sep.textContent = '>';
            container.appendChild(sep);
          }
          const a = document.createElement('a');
          a.textContent = node.title;
          if (idx < nodes.length - 1) {
            a.onclick = () => onClick(node.id);
          } else {
            a.style.color = 'var(--ink)';
            a.style.cursor = 'default';
            a.style.textDecoration = 'none';
          }
          container.appendChild(a);
        });
      };
      makeCrumb(treePath, 'tree-breadcrumb', id => {
        appState.currentPath = getPathToNode(appState.tree, id).map(n => n.id);
        renderAll();
      });
      makeCrumb(treePath, 'causes-breadcrumb', id => {
        appState.currentPath = getPathToNode(appState.tree, id).map(n => n.id);
        renderAll();
      });
    }

    // ===================== Tree Visualization =====================
    function renderTree() {
      const svg = document.getElementById('tree-svg');
      const currentId = appState.currentPath[appState.currentPath.length - 1];
      const currentNode = getNodeById(appState.tree, currentId);
      if (!currentNode) return;

      // Build visible tree from current node
      const nodeWidth = 140;
      const nodeHeight = 44;
      const levelGap = 180;
      const siblingGap = 70;

      // Compute layout
      let nodes = [];
      let links = [];
      function layout(node, depth, x, parent) {
        const y = depth * levelGap + 20;
        const n = { id: node.id, x, y, data: node, depth };
        nodes.push(n);
        if (parent) links.push({ from: parent, to: n });
        const children = node.children || [];
        if (children.length === 0) return n;
        // Calculate subtree width
        function subtreeWidth(n) {
          const c = n.children || [];
          if (c.length === 0) return siblingGap;
          let w = 0;
          c.forEach(child => w += subtreeWidth(child));
          return w;
        }
        let totalW = 0;
        children.forEach(child => totalW += subtreeWidth(child));
        let cx = x - totalW / 2;
        children.forEach(child => {
          const cw = subtreeWidth(child);
          layout(child, depth + 1, cx + cw / 2, n);
          cx += cw;
        });
        return n;
      }
      layout(currentNode, 0, 0, null);

      // Center tree
      const minX = Math.min(...nodes.map(n => n.x));
      const maxX = Math.max(...nodes.map(n => n.x));
      const width = maxX - minX + nodeWidth + 40;
      const height = Math.max(...nodes.map(n => n.y)) + nodeHeight + 40;
      const offsetX = -minX + 20;
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      svg.innerHTML = '';

      // Draw links
      links.forEach(link => {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const x1 = link.from.x + offsetX + nodeWidth / 2;
        const y1 = link.from.y + nodeHeight;
        const x2 = link.to.x + offsetX + nodeWidth / 2;
        const y2 = link.to.y;
        const d = `M${x1},${y1} C${x1},${y1 + 40} ${x2},${y2 - 40} ${x2},${y2}`;
        path.setAttribute('d', d);
        path.setAttribute('class', 'tree-link');
        svg.appendChild(path);
      });

      // Draw nodes
      nodes.forEach(n => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'tree-node');
        g.setAttribute('transform', `translate(${n.x + offsetX}, ${n.y})`);
        g.onclick = () => {
          appState.currentPath = getPathToNode(appState.tree, n.id).map(nd => nd.id);
          renderAll();
        };

        const fb = appState.feedback[n.id];
        let fill = '#fff';
        let stroke = 'var(--rule)';
        if (n.id === currentId) { stroke = 'var(--accent)'; fill = '#eff6ff'; }
        if (fb?.status === 'solved') { stroke = 'var(--success)'; fill = '#ecfdf5'; }
        if (fb?.status === 'unsolved') { stroke = 'var(--danger)'; fill = '#fef2f2'; }

        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('width', nodeWidth);
        rect.setAttribute('height', nodeHeight);
        rect.setAttribute('fill', fill);
        rect.setAttribute('stroke', stroke);
        rect.setAttribute('stroke-width', n.id === currentId ? 3 : 2);
        g.appendChild(rect);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', nodeWidth / 2);
        text.setAttribute('y', nodeHeight / 2 + 4);
        text.setAttribute('class', 'tree-text');
        text.textContent = n.data.title.length > 8 ? n.data.title.slice(0, 7) + '…' : n.data.title;
        g.appendChild(text);

        svg.appendChild(g);
      });
    }

    // ===================== Cause Cards =====================
    function renderCauses() {
      const container = document.getElementById('cause-list');
      const currentId = appState.currentPath[appState.currentPath.length - 1];
      const currentNode = getNodeById(appState.tree, currentId);
      if (!currentNode) return;

      container.innerHTML = '';

      // Render current node solutions
      const currentCard = buildCauseCard(currentNode, true);
      container.appendChild(currentCard);

      // Render children
      (currentNode.children || []).forEach(child => {
        container.appendChild(buildCauseCard(child, false));
      });
    }

    function buildCauseCard(node, isCurrent) {
      const card = document.createElement('div');
      const expanded = appState.expanded.has(node.id);
      const fb = appState.feedback[node.id];
      card.className = 'cause-card' + (expanded ? ' expanded' : '') + (fb?.status === 'solved' ? ' solved' : '') + (fb?.status === 'unsolved' ? ' unsolved' : '') + (isCurrent ? ' active' : '');

      // Header
      const header = document.createElement('div');
      header.className = 'cause-header';
      header.onclick = () => {
        if (appState.expanded.has(node.id)) appState.expanded.delete(node.id);
        else appState.expanded.add(node.id);
        renderCauses();
      };

      const title = document.createElement('div');
      title.className = 'cause-title';
      title.innerHTML = `<span class="toggle-icon">▶</span> ${escapeHtml(node.title)}`;
      header.appendChild(title);

      const badges = document.createElement('div');
      badges.className = 'cause-badges';
      if (fb?.status === 'solved') badges.innerHTML += '<span class="badge badge-solved">已解决</span>';
      if (fb?.status === 'unsolved') badges.innerHTML += '<span class="badge badge-unsolved">未解决</span>';
      if ((node.children || []).length > 0) badges.innerHTML += `<span class="badge">${node.children.length} 个子原因</span>`;
      header.appendChild(badges);

      card.appendChild(header);

      // Body
      const body = document.createElement('div');
      body.className = 'cause-body';

      if (node.description) {
        const desc = document.createElement('p');
        desc.style.color = 'var(--muted)';
        desc.style.marginBottom = '0.75rem';
        desc.textContent = node.description;
        body.appendChild(desc);
      }

      // Solutions
      if (node.solutions && node.solutions.length > 0) {
        const solBox = document.createElement('div');
        solBox.className = 'solution-box';
        const solTitle = document.createElement('h4');
        solTitle.textContent = '解决方案';
        solBox.appendChild(solTitle);
        const ol = document.createElement('ol');
        node.solutions.forEach(s => {
          const li = document.createElement('li');
          li.textContent = s;
          ol.appendChild(li);
        });
        solBox.appendChild(ol);
        body.appendChild(solBox);
      }

      // Feedback buttons
      const fbBar = document.createElement('div');
      fbBar.className = 'feedback-bar';
      const btnSolved = document.createElement('button');
      btnSolved.className = 'btn-success btn-sm';
      btnSolved.textContent = '✓ 已解决';
      btnSolved.onclick = (e) => { e.stopPropagation(); setFeedback(node.id, 'solved'); };
      const btnUnsolved = document.createElement('button');
      btnUnsolved.className = 'btn-danger btn-sm';
      btnUnsolved.textContent = '✗ 未解决';
      btnUnsolved.onclick = (e) => { e.stopPropagation(); setFeedback(node.id, 'unsolved'); };
      const btnNote = document.createElement('button');
      btnNote.className = 'btn-secondary btn-sm';
      btnNote.textContent = '💬 留言';
      btnNote.onclick = (e) => { e.stopPropagation(); toggleNote(node.id); };
      fbBar.appendChild(btnSolved);
      fbBar.appendChild(btnUnsolved);
      fbBar.appendChild(btnNote);
      body.appendChild(fbBar);

      // Note form
      const noteForm = document.createElement('div');
      noteForm.className = 'feedback-form' + (appState.expanded.has('note-' + node.id) ? ' show' : '');
      noteForm.id = 'note-form-' + node.id;
      const noteArea = document.createElement('textarea');
      noteArea.placeholder = '请输入您的反馈或遇到的问题细节...';
      noteArea.value = appState.feedback[node.id]?.note || '';
      noteArea.onchange = (e) => saveNote(node.id, e.target.value);
      noteForm.appendChild(noteArea);
      body.appendChild(noteForm);

      // Drill down button for children
      if ((node.children || []).length > 0) {
        const drillBtn = document.createElement('button');
        drillBtn.className = 'btn-primary btn-sm';
        drillBtn.style.marginTop = '0.75rem';
        drillBtn.textContent = '🔍 下钻查看子原因 (' + node.children.length + ')';
        drillBtn.onclick = (e) => {
          e.stopPropagation();
          appState.currentPath = getPathToNode(appState.tree, node.id).map(n => n.id);
          appState.expanded.add(node.id);
          renderAll();
        };
        body.appendChild(drillBtn);
      }

      // Parent navigation
      if (!isCurrent) {
        const parent = getParent(appState.tree, node.id);
        if (parent) {
          const upBtn = document.createElement('button');
          upBtn.className = 'btn-secondary btn-sm';
          upBtn.style.marginTop = '0.5rem';
          upBtn.textContent = '⬆ 返回父节点：' + parent.title;
          upBtn.onclick = (e) => {
            e.stopPropagation();
            appState.currentPath = getPathToNode(appState.tree, parent.id).map(n => n.id);
            renderAll();
          };
          body.appendChild(upBtn);
        }
      }

      card.appendChild(body);
      return card;
    }

    function setFeedback(nodeId, status) {
      if (!appState.feedback[nodeId]) appState.feedback[nodeId] = {};
      appState.feedback[nodeId].status = status;
      renderAll();
      showToast(status === 'solved' ? '标记为已解决' : '标记为未解决');
    }

    function toggleNote(nodeId) {
      const key = 'note-' + nodeId;
      if (appState.expanded.has(key)) appState.expanded.delete(key);
      else appState.expanded.add(key);
      const form = document.getElementById('note-form-' + nodeId);
      if (form) form.classList.toggle('show');
    }

    function saveNote(nodeId, text) {
      if (!appState.feedback[nodeId]) appState.feedback[nodeId] = {};
      appState.feedback[nodeId].note = text;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>


</body></html>
