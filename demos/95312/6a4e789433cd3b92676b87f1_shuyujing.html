<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>树欲静 — 一个关于陪伴的故事</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 600px;
            background: #16213e;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-layer {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            pointer-events: none;
        }
        #scene-title {
            color: #e94560;
            font-size: 14px;
            letter-spacing: 4px;
            margin-bottom: 10px;
            opacity: 0.8;
            text-align: center;
            transition: all 0.5s;
        }
        #dialogue-box {
            margin-top: auto;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            min-height: 120px;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        #dialogue-box:hover {
            border-color: rgba(233, 69, 96, 0.3);
        }
        #dialogue-text {
            color: #eee;
            font-size: 16px;
            line-height: 1.8;
            min-height: 60px;
        }
        #dialogue-speaker {
            color: #e94560;
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        #click-hint {
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            text-align: right;
            margin-top: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        #choices-container {
            margin-top: auto;
            display: none;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }
        .choice-btn {
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid rgba(233, 69, 96, 0.4);
            color: #fff;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.3s;
            text-align: left;
        }
        .choice-btn:hover {
            background: rgba(233, 69, 96, 0.35);
            transform: translateX(5px);
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            transition: opacity 1s;
        }
        #start-title {
            font-size: 36px;
            color: #e94560;
            margin-bottom: 10px;
            letter-spacing: 8px;
        }
        #start-subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        #start-btn {
            background: transparent;
            border: 2px solid #e94560;
            color: #e94560;
            padding: 15px 50px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s;
            letter-spacing: 4px;
        }
        #start-btn:hover {
            background: #e94560;
            color: #fff;
        }
        #ending-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            padding: 40px;
            text-align: center;
        }
        #ending-title {
            font-size: 28px;
            color: #e94560;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }
        #ending-text {
            font-size: 16px;
            color: rgba(255,255,255,0.7);
            line-height: 2.2;
            max-width: 600px;
        }
        #ending-btn {
            margin-top: 40px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.6);
            padding: 12px 40px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s;
        }
        #ending-btn:hover {
            border-color: #e94560;
            color: #e94560;
        }
        .memory-float {
            position: absolute;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            pointer-events: none;
            animation: floatUp 4s ease-in forwards;
            z-index: 3;
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0) scale(0.8); }
            20% { opacity: 1; transform: translateY(-20px) scale(1); }
            100% { opacity: 0; transform: translateY(-150px) scale(0.9); }
        }
        #progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 3px;
            background: #e94560;
            width: 0%;
            transition: width 0.5s;
            z-index: 5;
        }
        #chapter-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.2);
            font-size: 12px;
            z-index: 5;
        }
        #memory-counter {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas-layer"></canvas>
        <div id="progress-bar"></div>
        <div id="chapter-indicator"></div>
        <div id="memory-counter"></div>
        
        <div id="start-screen">
            <div id="start-title">树 欲 静</div>
            <div id="start-subtitle">一个关于陪伴与遗憾的故事</div>
            <button id="start-btn">开始游戏</button>
        </div>
        
        <div id="ending-screen">
            <div id="ending-title">树欲静而风不止</div>
            <div id="ending-text">
                <p>子欲养而亲不待。</p>
                <p>我们总是以为还有明天，</p>
                <p>却忘了时间从不等人。</p>
                <p style="margin-top: 20px; color: rgba(255,255,255,0.4);">
                    如果这个故事触动了你，</p>
                <p style="color: rgba(255,255,255,0.4);">
                    请记得给爱的人打个电话。</p>
            </div>
            <button id="ending-btn">再次体验</button>
        </div>
        
        <div id="ui-layer">
            <div id="scene-title"></div>
            <div id="choices-container"></div>
            <div id="dialogue-box">
                <div id="dialogue-speaker"></div>
                <div id="dialogue-text"></div>
                <div id="click-hint">点击继续 ▼</div>
            </div>
        </div>
    </div>

<script>
// ============ 游戏数据 ============
const chapters = [
    {
        title: "第一章 · 童年",
        bg: "childhood",
        scenes: [
            { speaker: "", text: "故事要从很久很久以前说起..." },
            { speaker: "", text: "在一个安静的小村庄，夕阳把屋顶染成橘红色。" },
            { speaker: "奶奶", text: "小宇，回来吃饭啦！奶奶今天做了你最爱吃的红烧肉。" },
            { speaker: "爷爷", text: "这小子，又跑到哪儿玩去了，饭都凉了。" },
            { speaker: "小宇", text: "（奔跑着回家）来啦！奶奶做的饭最香了！" },
            { speaker: "奶奶", text: "慢点跑，别摔着。奶奶给你盛一大碗。" },
            { speaker: "", text: "那是你生命中最温暖的时光。" },
            { speaker: "", text: "爷爷奶奶的小院，是你全部的童年。" },
            { speaker: "奶奶", text: "小宇，长大后想做什么呀？" },
            { speaker: "小宇", text: "我要当大老板！赚好多好多钱！给奶奶买大房子！" },
            { speaker: "奶奶", text: "哈哈，奶奶不要大房子，奶奶就希望你平平安安。" },
            { speaker: "", text: "那时候你还不懂，平安两个字，有多重。" }
        ]
    },
    {
        title: "第二章 · 远行",
        bg: "leaving",
        scenes: [
            { speaker: "", text: "时光像村头的小溪，不知不觉流过了很多年。" },
            { speaker: "", text: "你长大了，考上了城里的大学，然后是第一份工作。" },
            { speaker: "", text: "城市的霓虹灯很亮，但亮不过奶奶厨房的那盏灯。" },
            { speaker: "奶奶", text: "小宇，在外面要吃饱穿暖，别省着。" },
            { speaker: "小宇", text: "知道啦奶奶，等我赚钱了，接您去城里住！" },
            { speaker: "奶奶", text: "奶奶哪儿也不去，就守着这个院子。你常回来看看就好。" },
            { speaker: "", text: "你雄心万丈，想着要先拼事业，再尽孝道。" },
            { speaker: "", text: "可你没发现，奶奶的白发越来越多，背也越来越弯了。" },
            { speaker: "", text: "爷爷走后，奶奶一个人的身影，在院子里显得格外孤单。" },
            { speaker: "小宇", text: "（电话里）奶奶，我明年一定回去看您！" },
            { speaker: "奶奶", text: "好好工作，奶奶没事，奶奶好着呢。" },
            { speaker: "", text: "电话里奶奶的声音很精神，但你不知道，她刚吃完止疼药。" }
        ]
    },
    {
        title: "第三章 · 陪伴",
        bg: "staying",
        scenes: [
            { speaker: "", text: "工作第三年，你做了一个决定。" },
            { speaker: "", text: "每年辞职，请假三个月，回去陪奶奶。" },
            { speaker: "同事", text: "你疯了吧？每年辞职三个月？ Career还要不要了？" },
            { speaker: "小宇", text: "工作可以再找，奶奶只有一个。" },
            { speaker: "", text: "你拖着行李箱，再次走进那个熟悉的小院。" },
            { speaker: "奶奶", text: "（惊喜）小宇？你怎么回来了？" },
            { speaker: "小宇", text: "回来陪您住三个月。" },
            { speaker: "奶奶", text: "傻孩子，工作怎么办？" },
            { speaker: "小宇", text: "辞了。反正您比工作重要。" },
            { speaker: "奶奶", text: "（抹着眼泪）你这孩子..." },
            { speaker: "", text: "那三个月，是你们最快乐的时光。" },
            { speaker: "", text: "你帮奶奶种菜，陪她晒太阳，听她说那些说过无数遍的故事。" },
            { speaker: "奶奶", text: "小宇，有你在，奶奶什么都不怕。" },
            { speaker: "小宇", text: "奶奶，我会一直回来的。" },
            { speaker: "", text: "你们都没说，但心里都知道——" },
            { speaker: "", text: "这样的时光，过一天就少一天。" }
        ]
    },
    {
        title: "第四章 · 告别",
        bg: "farewell",
        scenes: [
            { speaker: "", text: "那天早上，天空灰蒙蒙的。" },
            { speaker: "", text: "你像往常一样推开奶奶的房门。" },
            { speaker: "小宇", text: "奶奶，我煮了粥，您——" },
            { speaker: "", text: "奶奶安静地躺在床上，像是睡着了。" },
            { speaker: "", text: "但你知道，这次她不会再醒来了。" },
            { speaker: "小宇", text: "奶奶...奶奶？" },
            { speaker: "", text: "你握着她的手，还有一点点温度。" },
            { speaker: "", text: "床头柜上，放着你去年给她买的药。" },
            { speaker: "", text: "她省着没吃，说等你回来再买。" },
            { speaker: "", text: "你哭得像个孩子，可这一次，没有人来哄你了。" },
            { speaker: "小宇", text: "（哽咽）奶奶，我回来了...我回来了啊..." },
            { speaker: "", text: "院子里的树还在，叶子被风吹得沙沙响。" },
            { speaker: "", text: "树欲静而风不止。" },
            { speaker: "", text: "子欲养而亲不待。" }
        ]
    },
    {
        title: "第五章 · 思念",
        bg: "missing",
        scenes: [
            { speaker: "", text: "奶奶走后的每一天，你都在想她。" },
            { speaker: "小宇", text: "如果我能更努力工作，早点赚够钱..." },
            { speaker: "小宇", text: "如果我能把她接到城里住..." },
            { speaker: "小宇", text: "如果我能多请几个月假..." },
            { speaker: "", text: "无数个"如果"，像针一样扎在心里。" },
            { speaker: "", text: "你坐在空荡荡的院子里，风吹过来，带着奶奶的气息。" },
            { speaker: "", text: "厨房里的锅碗还在，但再也不会有人喊你吃饭。" },
            { speaker: "", text: "院子里的花开了一年又一年，可那个看花的人，不在了。" },
            { speaker: "小宇", text: "奶奶，我好想你..." },
            { speaker: "", text: "你明白了，有些事，错过了就是一辈子。" },
            { speaker: "", text: "有些人，走了就再也回不来了。" },
            { speaker: "", text: "树欲静而风不止，子欲养而亲不待。" }
        ]
    }
];

// ============ 画布与场景绘制 ============
const canvas = document.getElementById('canvas-layer');
const ctx = canvas.getContext('2d');
let canvasWidth, canvasHeight;

function resizeCanvas() {
    const container = document.getElementById('game-container');
    canvasWidth = container.clientWidth;
    canvasHeight = container.clientHeight;
    canvas.width = canvasWidth * 2;
    canvas.height = canvasHeight * 2;
    ctx.scale(2, 2);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let time = 0;
let bgType = 'childhood';
let particles = [];
let leaves = [];
let stars = [];

function initParticles() {
    particles = [];
    for (let i = 0; i < 30; i++) {
        particles.push({
            x: Math.random() * canvasWidth,
            y: Math.random() * canvasHeight,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            size: Math.random() * 2 + 1,
            alpha: Math.random() * 0.5 + 0.2
        });
    }
}
initParticles();

function initLeaves() {
    leaves = [];
    for (let i = 0; i < 15; i++) {
        leaves.push({
            x: Math.random() * canvasWidth,
            y: Math.random() * canvasHeight * 0.5,
            vx: Math.random() * 1 + 0.5,
            vy: Math.random() * 0.5 + 0.2,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.02,
            size: Math.random() * 6 + 4,
            color: Math.random() > 0.5 ? '#e94560' : '#f39c12'
        });
    }
}
initLeaves();

function initStars() {
    stars = [];
    for (let i = 0; i < 60; i++) {
        stars.push({
            x: Math.random() * canvasWidth,
            y: Math.random() * canvasHeight * 0.6,
            size: Math.random() * 1.5 + 0.5,
            twinkle: Math.random() * Math.PI * 2
        });
    }
}
initStars();

function drawChildhood() {
    // 温暖的黄昏天空
    const grad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
    grad.addColorStop(0, '#2d1b4e');
    grad.addColorStop(0.5, '#4a2c6a');
    grad.addColorStop(1, '#7d3e58');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    
    // 太阳
    const sunY = canvasHeight * 0.35 + Math.sin(time * 0.01) * 5;
    ctx.fillStyle = '#f39c12';
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.8, sunY, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(243, 156, 18, 0.3)';
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.8, sunY, 55, 0, Math.PI * 2);
    ctx.fill();
    
    // 远山
    ctx.fillStyle = '#1a1a3e';
    ctx.beginPath();
    ctx.moveTo(0, canvasHeight * 0.55);
    ctx.lineTo(canvasWidth * 0.2, canvasHeight * 0.45);
    ctx.lineTo(canvasWidth * 0.5, canvasHeight * 0.5);
    ctx.lineTo(canvasWidth * 0.8, canvasHeight * 0.42);
    ctx.lineTo(canvasWidth, canvasHeight * 0.48);
    ctx.lineTo(canvasWidth, canvasHeight);
    ctx.lineTo(0, canvasHeight);
    ctx.fill();
    
    // 房子轮廓
    ctx.fillStyle = '#2c1810';
    ctx.fillRect(canvasWidth * 0.15, canvasHeight * 0.45, 120, 80);
    ctx.fillStyle = '#3d2317';
    ctx.beginPath();
    ctx.moveTo(canvasWidth * 0.15 - 10, canvasHeight * 0.45);
    ctx.lineTo(canvasWidth * 0.15 + 60, canvasHeight * 0.38);
    ctx.lineTo(canvasWidth * 0.15 + 130, canvasHeight * 0.45);
    ctx.fill();
    
    // 窗户里的光
    ctx.fillStyle = '#f39c12';
    ctx.fillRect(canvasWidth * 0.2, canvasHeight * 0.52, 20, 20);
    ctx.fillStyle = 'rgba(243, 156, 18, 0.5)';
    ctx.fillRect(canvasWidth * 0.2 - 5, canvasHeight * 0.52 + 5, 30, 30);
    
    // 树
    ctx.fillStyle = '#1a3a1a';
    ctx.fillRect(canvasWidth * 0.08, canvasHeight * 0.42, 15, 120);
    ctx.fillStyle = '#0d5c0d';
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.15, canvasHeight * 0.38, 50, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#147a14';
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.12, canvasHeight * 0.35, 40, 0, Math.PI * 2);
    ctx.fill();
    
    // 萤火虫
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = canvasWidth;
        if (p.x > canvasWidth) p.x = 0;
        if (p.y < 0) p.y = canvasHeight;
        if (p.y > canvasHeight) p.y = 0;
        ctx.fillStyle = `rgba(255, 220, 100, ${p.alpha + Math.sin(time * 0.05 + p.x) * 0.2})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

function drawLeaving() {
    // 城市夜景偏冷
    const grad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#1a1a3e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    
    // 星星
    stars.forEach(s => {
        const twinkle = Math.sin(time * 0.03 + s.twinkle) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(255, 255, 255, ${twinkle * 0.8})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    });
    
    // 月亮
    ctx.fillStyle = '#ddd';
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.85, canvasHeight * 0.15, 25, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0a0a1a';
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.87, canvasHeight * 0.13, 22, 0, Math.PI * 2);
    ctx.fill();
    
    // 城市轮廓
    ctx.fillStyle = '#0d0d20';
    const buildings = [40, 70, 55, 90, 45, 80, 60, 50, 75, 85];
    let x = 0;
    buildings.forEach(h => {
        ctx.fillRect(x, canvasHeight * 0.65 - h * 2, canvasWidth / 10 + 2, h * 2 + canvasHeight * 0.35);
        x += canvasWidth / 10;
    });
    
    // 窗户灯光
    ctx.fillStyle = 'rgba(255, 200, 100, 0.3)';
    for (let i = 0; i < 20; i++) {
        const bx = (i % 10) * (canvasWidth / 10) + 10;
        const by = canvasHeight * 0.5 + (Math.floor(i / 2) * 25);
        if (Math.random() > 0.5) {
            ctx.fillRect(bx, by, 8, 12);
        }
    }
    
    // 道路
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, canvasHeight * 0.85, canvasWidth, canvasHeight * 0.15);
    ctx.fillStyle = 'rgba(100, 100, 150, 0.2)';
    for (let i = 0; i < 10; i++) {
        ctx.fillRect(i * 60 + 20, canvasHeight * 0.9, 30, 2);
    }
}

function drawStaying() {
    // 温暖午后
    const grad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
    grad.addColorStop(0, '#87CEEB');
    grad.addColorStop(0.6, '#b8d4e3');
    grad.addColorStop(1, '#d4a574');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    
    // 太阳
    ctx.fillStyle = '#ffeaa7';
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.15, canvasHeight * 0.15, 35, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 234, 167, 0.3)';
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.15, canvasHeight * 0.15, 50, 0, Math.PI * 2);
    ctx.fill();
    
    // 云朵
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    [0.3, 0.6, 0.8].forEach((cx, i) => {
        const cloudX = cx * canvasWidth + Math.sin(time * 0.01 + i) * 20;
        ctx.beginPath();
        ctx.arc(cloudX, canvasHeight * 0.2, 25, 0, Math.PI * 2);
        ctx.arc(cloudX + 20, canvasHeight * 0.18, 30, 0, Math.PI * 2);
        ctx.arc(cloudX + 40, canvasHeight * 0.2, 25, 0, Math.PI * 2);
        ctx.fill();
    });
    
    // 院子
    ctx.fillStyle = '#7cb342';
    ctx.fillRect(0, canvasHeight * 0.55, canvasWidth, canvasHeight * 0.45);
    
    // 篱笆
    ctx.fillStyle = '#8d6e63';
    for (let i = 0; i < 20; i++) {
        ctx.fillRect(i * 35 + 10, canvasHeight * 0.5, 8, 40);
    }
    ctx.fillRect(0, canvasHeight * 0.52, canvasWidth, 4);
    ctx.fillRect(0, canvasHeight * 0.58, canvasWidth, 4);
    
    // 花
    const flowers = ['#e94560', '#f39c12', '#e74c3c', '#ff6b9d'];
    for (let i = 0; i < 12; i++) {
        ctx.fillStyle = flowers[i % 4];
        ctx.beginPath();
        ctx.arc(50 + i * 55, canvasHeight * 0.65 + Math.sin(time * 0.02 + i) * 3, 6, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // 大树
    ctx.fillStyle = '#5d4037';
    ctx.fillRect(canvasWidth * 0.75, canvasHeight * 0.35, 30, canvasHeight * 0.45);
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.8, canvasHeight * 0.32, 80, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#388e3c';
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.72, canvasHeight * 0.28, 60, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.85, canvasHeight * 0.3, 55, 0, Math.PI * 2);
    ctx.fill();
}

function drawFarewell() {
    // 灰暗天空
    const grad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
    grad.addColorStop(0, '#2c2c3e');
    grad.addColorStop(0.5, '#3a3a4e');
    grad.addColorStop(1, '#4a4a5e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    
    // 雨滴
    ctx.strokeStyle = 'rgba(200, 200, 220, 0.3)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 30; i++) {
        const rx = (i * 37 + time * 0.5) % canvasWidth;
        const ry = (i * 53 + time * 2) % (canvasHeight * 0.8);
        ctx.beginPath();
        ctx.moveTo(rx, ry);
        ctx.lineTo(rx - 2, ry + 15);
        ctx.stroke();
    }
    
    // 远山
    ctx.fillStyle = '#1e1e2e';
    ctx.beginPath();
    ctx.moveTo(0, canvasHeight * 0.5);
    ctx.lineTo(canvasWidth * 0.3, canvasHeight * 0.4);
    ctx.lineTo(canvasWidth * 0.7, canvasHeight * 0.45);
    ctx.lineTo(canvasWidth, canvasHeight * 0.42);
    ctx.lineTo(canvasWidth, canvasHeight);
    ctx.lineTo(0, canvasHeight);
    ctx.fill();
    
    // 房子 - 更暗
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(canvasWidth * 0.15, canvasHeight * 0.42, 120, 80);
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath();
    ctx.moveTo(canvasWidth * 0.15 - 10, canvasHeight * 0.42);
    ctx.lineTo(canvasWidth * 0.15 + 60, canvasHeight * 0.35);
    ctx.lineTo(canvasWidth * 0.15 + 130, canvasHeight * 0.42);
    ctx.fill();
    
    // 窗户 - 灯光熄灭
    ctx.fillStyle = '#333';
    ctx.fillRect(canvasWidth * 0.2, canvasHeight * 0.49, 20, 20);
    
    // 树 - 叶子飘落
    ctx.fillStyle = '#2a2a1a';
    ctx.fillRect(canvasWidth * 0.08, canvasHeight * 0.4, 15, 120);
    
    leaves.forEach(l => {
        l.x += l.vx;
        l.y += l.vy;
        l.rotation += l.rotSpeed;
        if (l.y > canvasHeight) {
            l.y = -10;
            l.x = Math.random() * canvasWidth;
        }
        ctx.save();
        ctx.translate(l.x, l.y);
        ctx.rotate(l.rotation);
        ctx.fillStyle = l.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, l.size, l.size * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

function drawMissing() {
    // 深夜星空
    const grad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
    grad.addColorStop(0, '#050510');
    grad.addColorStop(1, '#1a1a3e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    
    // 星星
    stars.forEach(s => {
        const twinkle = Math.sin(time * 0.02 + s.twinkle) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(255, 255, 255, ${twinkle * 0.9})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    });
    
    // 月亮 - 弦月
    ctx.fillStyle = '#ddd';
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.2, canvasHeight * 0.15, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#050510';
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.22, canvasHeight * 0.13, 18, 0, Math.PI * 2);
    ctx.fill();
    
    // 地面
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, canvasHeight * 0.6, canvasWidth, canvasHeight * 0.4);
    
    // 树影
    ctx.fillStyle = '#050510';
    ctx.fillRect(canvasWidth * 0.5, canvasHeight * 0.35, 20, canvasHeight * 0.45);
    ctx.fillStyle = '#0a0a15';
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.55, canvasHeight * 0.32, 70, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0d0d1a';
    ctx.beginPath();
    ctx.arc(canvasWidth * 0.45, canvasHeight * 0.3, 55, 0, Math.PI * 2);
    ctx.fill();
    
    // 萤火虫 - 很少
    particles.slice(0, 10).forEach(p => {
        p.x += p.vx * 0.5;
        p.y += p.vy * 0.5;
        if (p.x < 0) p.x = canvasWidth;
        if (p.x > canvasWidth) p.x = 0;
        if (p.y < 0) p.y = canvasHeight;
        if (p.y > canvasHeight) p.y = 0;
        ctx.fillStyle = `rgba(255, 220, 100, ${p.alpha * 0.5 + Math.sin(time * 0.03 + p.x) * 0.1})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.7, 0, Math.PI * 2);
        ctx.fill();
    });
}

function drawScene() {
    time++;
    switch(bgType) {
        case 'childhood': drawChildhood(); break;
        case 'leaving': drawLeaving(); break;
        case 'staying': drawStaying(); break;
        case 'farewell': drawFarewell(); break;
        case 'missing': drawMissing(); break;
    }
    requestAnimationFrame(drawScene);
}

// ============ 游戏逻辑 ============
let currentChapter = 0;
let currentScene = 0;
let isTyping = false;
let typeInterval;
let gameStarted = false;

const sceneTitle = document.getElementById('scene-title');
const dialogueBox = document.getElementById('dialogue-box');
const dialogueText = document.getElementById('dialogue-text');
const dialogueSpeaker = document.getElementById('dialogue-speaker');
const clickHint = document.getElementById('click-hint');
const startScreen = document.getElementById('start-screen');
const endingScreen = document.getElementById('ending-screen');
const progressBar = document.getElementById('progress-bar');
const chapterIndicator = document.getElementById('chapter-indicator');
const memoryCounter = document.getElementById('memory-counter');

let memories = 0;
const totalScenes = chapters.reduce((acc, c) => acc + c.scenes.length, 0);

function updateProgress() {
    let passed = 0;
    for (let i = 0; i < currentChapter; i++) passed += chapters[i].scenes.length;
    passed += currentScene;
    const pct = (passed / totalScenes) * 100;
    progressBar.style.width = pct + '%';
    chapterIndicator.textContent = `${currentChapter + 1} / ${chapters.length}`;
    memoryCounter.textContent = `回忆 × ${memories}`;
}

function showScene() {
    if (currentChapter >= chapters.length) {
        showEnding();
        return;
    }
    
    const chapter = chapters[currentChapter];
    bgType = chapter.bg;
    sceneTitle.textContent = chapter.title;
    
    if (currentScene >= chapter.scenes.length) {
        currentChapter++;
        currentScene = 0;
        showScene();
        return;
    }
    
    const scene = chapter.scenes[currentScene];
    dialogueSpeaker.textContent = scene.speaker || '';
    clickHint.style.display = 'block';
    
    // 打字机效果
    isTyping = true;
    dialogueText.textContent = '';
    let charIndex = 0;
    const text = scene.text;
    
    clearInterval(typeInterval);
    typeInterval = setInterval(() => {
        if (charIndex < text.length) {
            dialogueText.textContent += text[charIndex];
            charIndex++;
        } else {
            isTyping = false;
            clearInterval(typeInterval);
        }
    }, 40);
    
    updateProgress();
    
    // 浮动记忆文字
    if (scene.text.includes('奶奶') && Math.random() > 0.3) {
        createMemoryFloat(scene.text.substring(0, 10));
    }
}

function createMemoryFloat(text) {
    const float = document.createElement('div');
    float.className = 'memory-float';
    float.textContent = text;
    float.style.left = Math.random() * (canvasWidth - 100) + 'px';
    float.style.top = canvasHeight * 0.3 + 'px';
    document.getElementById('game-container').appendChild(float);
    setTimeout(() => float.remove(), 4000);
}

function advanceScene() {
    if (isTyping) {
        // 快速完成当前打字
        clearInterval(typeInterval);
        const chapter = chapters[currentChapter];
        dialogueText.textContent = chapter.scenes[currentScene].text;
        isTyping = false;
        return;
    }
    
    currentScene++;
    memories++;
    showScene();
}

function showEnding() {
    endingScreen.style.display = 'flex';
    endingScreen.style.opacity = '0';
    setTimeout(() => {
        endingScreen.style.transition = 'opacity 2s';
        endingScreen.style.opacity = '1';
    }, 100);
}

function startGame() {
    gameStarted = true;
    startScreen.style.opacity = '0';
    setTimeout(() => {
        startScreen.style.display = 'none';
    }, 1000);
    currentChapter = 0;
    currentScene = 0;
    memories = 0;
    showScene();
}

// ============ 事件绑定 ============
document.getElementById('start-btn').addEventListener('click', startGame);

document.getElementById('ending-btn').addEventListener('click', () => {
    endingScreen.style.opacity = '0';
    setTimeout(() => {
        endingScreen.style.display = 'none';
        startScreen.style.display = 'flex';
        setTimeout(() => {
            startScreen.style.opacity = '1';
        }, 50);
    }, 1000);
});

dialogueBox.addEventListener('click', advanceScene);

// 键盘支持
document.addEventListener('keydown', (e) => {
    if (!gameStarted) return;
    if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        advanceScene();
    }
});

// 启动动画循环
drawScene();
</script>
