<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智脉 AI - 便携式智能中医脉诊设备 | TRAE 创意提案</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --primary: #2d6a4f;
    --primary-light: #40916c;
    --primary-dark: #1b4332;
    --accent: #d4a373;
    --accent-light: #e9c46a;
    --bg: #fefae0;
    --bg-dark: #283618;
    --text: #2d3436;
    --text-light: #636e72;
    --card: #ffffff;
    --shadow: 0 10px 40px rgba(45, 106, 79, 0.1);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
    overflow-x: hidden;
  }

  /* Hero Section */
  .hero {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
    color: white;
    padding: 60px 20px;
    text-align: center;
    position: relative;
  }

  .hero h1 {
    font-size: 42px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .hero .subtitle {
    font-size: 18px;
    opacity: 0.9;
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .section {
    padding: 50px 0;
  }

  .section-title {
    font-size: 28px;
    color: var(--primary-dark);
    margin-bottom: 24px;
    text-align: center;
  }

  .feature-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
  }

  .feature-card {
    background: var(--card);
    padding: 24px;
    border-radius: 12px;
    box-shadow: var(--shadow);
  }

  .feature-card h3 {
    color: var(--primary);
    margin-bottom: 8px;
    font-size: 18px;
  }

  .feature-card p {
    color: var(--text-light);
    font-size: 14px;
  }

  .footer {
    background: var(--bg-dark);
    color: rgba(255,255,255,0.7);
    text-align: center;
    padding: 30px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>
<section class="hero">
  <div class="container">
    <h1>智脉 AI</h1>
    <p class="subtitle">便携式智能中医脉诊设备 — 让三根手指的智慧，走进每个人的生活</p>
  </div>
</section>
<section class="section">
  <div class="container">
    <h2 class="section-title">产品概述</h2>
    <div class="feature-grid">
      <div class="feature-card">
        <h3>📡 6通道传感器</h3>
        <p>精准采集左右手寸、关、尺三部脉象</p>
      </div>
      <div class="feature-card">
        <h3>⚡ 200Hz采样</h3>
        <p>高保真还原真实脉象波形</p>
      </div>
      <div class="feature-card">
        <h3>🧠 AI脉诊分析</h3>
        <p>浮沉迟数虚实自动识别，九种体质辨识</p>
      </div>
      <div class="feature-card">
        <h3>📱 蓝牙互联</h3>
        <p>实时同步至手机APP，生成健康报告</p>
      </div>
    </div>
  </div>
</section>
<footer class="footer">
  <div>智脉 AI · 让传统智慧遇见现代科技</div>
  <div style="margin-top:8px;">✨ 本创意提案由 TRAE Work 辅助生成</div>
</footer>
</body>
</html>
