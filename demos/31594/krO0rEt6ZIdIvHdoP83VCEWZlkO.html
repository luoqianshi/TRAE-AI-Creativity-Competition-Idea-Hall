<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 期末复习助手</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f5f5;--bg2:#ffffff;--bg3:#eeeeee;--bg4:#e0e0e0;
  --card:#ffffff;--card2:#f5f5f5;
  --text:#111111;--text2:#555555;--text3:#767676;
  --bdr:#dddddd;--bdr2:#cccccc;
  --c1:#333333;--c2:#555555;
  --accent:#222222;--accent2:#444444;
  --accent-txt:#ffffff;
  --ok:#333333;--warn:#555555;--err:#111111;
  --r:10px;--sh:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
}
[data-theme="dark"]{
  --bg:#111111;--bg2:#1a1a1a;--bg3:#222222;--bg4:#2a2a2a;
  --card:#1a1a1a;--card2:#222222;
  --text:#f0f0f0;--text2:#c0c0c0;--text3:#a0a0a0;
  --bdr:#333333;--bdr2:#444444;
  --c1:#d0d0d0;--c2:#b0b0b0;
  --accent:#e8e8e8;--accent2:#d0d0d0;
  --accent-txt:#111111;
  --ok:#e8e8e8;--warn:#d0d0d0;--err:#ffffff;
  --sh:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.25);
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;overflow:hidden;transition:background .3s,color .3s}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes slideIn{from{transform:translateX(-100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes voicePulse{0%,100%{box-shadow:0 0 20px rgba(0,0,0,.15)}50%{box-shadow:0 0 40px rgba(0,0,0,.25),0 0 60px rgba(0,0,0,.1)}}
.anim{animation:fadeUp .4s ease both}
.anim-d1{animation:fadeUp .4s ease .08s both}
.anim-d2{animation:fadeUp .4s ease .16s both}
.anim-d3{animation:fadeUp .4s ease .24s both}

.sidebar{width:210px;min-width:210px;height:100vh;background:var(--bg2);border-right:1px solid var(--bdr);display:flex;flex-direction:column;position:relative;z-index:10;animation:slideIn .35s ease;transition:background .3s,border-color .3s}
.sidebar-brand{padding:20px 16px 16px;border-bottom:1px solid var(--bdr)}
.sidebar-brand h1{font-size:.95em;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px}
.sidebar-brand p{font-size:10.5px;color:var(--text3);margin-top:2px}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-section{padding:6px 16px;font-size:9.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 16px;margin:1px 6px;border-radius:7px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;color:var(--text2);position:relative}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.on{background:var(--accent);color:var(--accent-txt)}
.nav-item .icon{width:16px;height:16px;flex-shrink:0;opacity:.65}
.nav-item.on .icon{opacity:1}
.nav-item .badge{margin-left:auto;padding:1px 6px;border-radius:7px;font-size:9.5px;font-weight:600;background:var(--bg4);color:var(--text3)}
.nav-item.on .badge{background:rgba(255,255,255,.2);color:#fff}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--bdr);display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text3)}
.sidebar-footer .dot{width:5px;height:5px;border-radius:50%;background:var(--ok)}

.main{flex:1;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg2);border-bottom:1px solid var(--bdr);padding:11px 22px;display:flex;align-items:center;gap:12px;transition:background .3s,border-color .3s}
.topbar h2{font-size:1em;font-weight:700;flex:1}
.topbar .breadcrumb{font-size:11px;color:var(--text3)}
.topbar .breadcrumb span{color:var(--accent);font-weight:600}
.topbar-actions{display:flex;align-items:center;gap:6px}
.theme-btn{width:30px;height:30px;border:1px solid var(--bdr);border-radius:7px;background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;color:var(--text2);flex-shrink:0}
.theme-btn:hover{background:var(--bg4);border-color:var(--bdr2)}
.theme-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-txt)}
.theme-btn svg{width:14px;height:14px;fill:currentColor}
.content{flex:1;padding:18px 22px 36px}
.page{display:none}.page.on{display:block;animation:fadeUp .3s ease}

.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:18px;margin-bottom:14px;transition:all .2s}
.card:hover{box-shadow:var(--sh)}
.card-t{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card-t .ico{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg3);color:var(--text3)}
.card-t h3{font-size:.88em;font-weight:700}
.badge{margin-left:auto;padding:2px 7px;border-radius:5px;font-size:9.5px;font-weight:600;background:var(--bg4);color:var(--text3)}
label{display:block;font-size:10.5px;font-weight:600;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
input,textarea,select{width:100%;padding:8px 11px;border:1px solid var(--bdr);border-radius:7px;font-size:12.5px;font-family:inherit;background:var(--bg3);color:var(--text);transition:all .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(66,99,237,.12)}
textarea{min-height:120px;resize:vertical}
.fg{margin-bottom:11px}.h{display:none!important}
.api-bar{display:flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid var(--bdr);border-radius:7px;cursor:pointer;font-size:11.5px;color:var(--text3);transition:all .2s;background:var(--bg3);user-select:none}
.api-bar:hover{background:var(--bg4);color:var(--text2)}.api-bar.on{border-color:var(--accent);color:var(--accent)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:6px 14px;border:1px solid var(--bdr);border-radius:18px;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .2s;background:var(--bg3);color:var(--text2);user-select:none}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.on{background:var(--accent);color:var(--accent-txt);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border:none;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--accent);color:var(--accent-txt);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.btn-p:hover{background:var(--accent2);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.btn-s{background:var(--bg3);color:var(--text2);border:1px solid var(--bdr)}.btn-s:hover{background:var(--bg4)}
.btn-d{background:var(--bg4);color:var(--text2);border:1px solid var(--bdr)}.btn-d:hover{background:var(--bdr)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.gwrap{border:1px solid var(--bdr);border-radius:10px;overflow:hidden;background:var(--bg3)}
#kg{display:block;width:100%;height:340px;cursor:grab}#kg:active{cursor:grabbing}
.gleg{display:flex;gap:14px;justify-content:center;padding:8px;background:var(--card);border-top:1px solid var(--bdr)}
.gleg span{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--text3)}
.gleg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:1100px){.row,.row3{grid-template-columns:1fr}}
.stat-card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:12px}
.stat-icon{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg3);color:var(--text3)}
.stat-info h4{font-size:1.3em;font-weight:800;line-height:1.2}
.stat-info p{font-size:11px;color:var(--text3)}
.qcard{background:var(--bg3);border:1px solid var(--bdr);border-radius:9px;padding:15px;margin-bottom:10px}
.qcard h4{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.qcard p{font-size:13px;margin-bottom:10px;color:var(--text)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--card);border:1px solid var(--bdr);border-radius:7px;cursor:pointer;transition:all .15s;font-size:12.5px;color:var(--text)}
.opt:hover{border-color:var(--bdr2);background:var(--bg4)}
.opt.sel{border-color:var(--accent);background:var(--bg4)}
.opt.ok{border-color:#22c55e;background:rgba(34,197,94,.12);color:#22c55e}
.opt.no{border-color:#ef4444;background:rgba(239,68,68,.12);color:#ef4444}
.opt b{width:22px;height:22px;border-radius:5px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text3);flex-shrink:0}
.opt.sel b{background:var(--accent);color:var(--bg)}
.opt.ok b{background:#22c55e;color:#fff}
.opt.no b{background:#ef4444;color:#fff}
.wtags{display:flex;flex-wrap:wrap;gap:6px}
.wtag{padding:4px 11px;background:var(--bg4);border:1px solid var(--bdr);border-radius:14px;font-size:11.5px;color:var(--text2);font-weight:600}
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:7px;top:5px;bottom:5px;width:1.5px;background:var(--bdr2)}
.tl-i{position:relative;background:var(--bg3);border:1px solid var(--bdr);border-radius:7px;padding:11px 13px;margin-bottom:9px}
.tl-i::before{content:'';position:absolute;left:-19px;top:15px;width:7px;height:7px;background:var(--accent);border-radius:50%;border:2px solid var(--bg)}
.tl-i .day{display:inline-block;padding:2px 7px;background:var(--accent);color:#fff;border-radius:4px;font-size:9.5px;font-weight:700;margin-bottom:4px}
.tl-i h4{font-size:12.5px;font-weight:700;margin-bottom:2px}
.tl-i p{font-size:11.5px;color:var(--text3)}
.scircle{width:96px;height:96px;margin:12px auto;position:relative}
.scircle svg{transform:rotate(-90deg)}.scircle .bg{fill:none;stroke:var(--bdr);stroke-width:8}
.scircle .fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.scircle .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.7em;font-weight:800;color:var(--accent)}
.scinfo{text-align:center;font-size:12px;color:var(--text3)}
.schint{margin-top:7px;text-align:center;font-size:12px;color:var(--warn);font-weight:600}
.hist-table{width:100%;border-collapse:collapse;font-size:12px}
.hist-table th{text-align:left;padding:8px 11px;background:var(--bg3);border-bottom:1px solid var(--bdr);font-weight:600;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.hist-table td{padding:8px 11px;border-bottom:1px solid var(--bdr)}
.hist-table tr:hover td{background:var(--bg4)}
.hist-tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600}
.hist-tag.s1{background:rgba(34,197,94,.12);color:#22c55e}
.hist-tag.s2{background:rgba(245,158,11,.12);color:#f59e0b}
.hist-tag.s3{background:rgba(239,68,68,.12);color:#ef4444}
.hist-score{font-weight:700;font-size:13px}
.hist-date{color:var(--text3);font-size:11px}
.hist-empty{text-align:center;padding:40px 16px;color:var(--text3)}
.hist-empty .big{font-size:40px;margin-bottom:6px;opacity:.4}
.hist-empty p{font-size:12px}
.hist-actions{display:flex;gap:5px}
.hist-actions button{padding:3px 7px;border:none;border-radius:4px;font-size:10.5px;cursor:pointer;font-weight:600;transition:.15s}
.hist-actions .v{background:var(--bg4);color:var(--text2)}.hist-actions .v:hover{background:var(--bdr)}
.hist-actions .del{background:rgba(250,82,82,.08);color:var(--err)}.hist-actions .del:hover{background:rgba(250,82,82,.12)}
.pager{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:16px}
.pager button{width:30px;height:30px;border:1px solid var(--bdr);border-radius:6px;background:var(--bg3);font-size:11.5px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.pager button:hover{border-color:var(--accent);color:var(--accent)}
.pager button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pager button:disabled{opacity:.3;cursor:not-allowed}
.pager .info{font-size:11.5px;color:var(--text3);margin:0 5px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(3px)}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{background:var(--card);border:1px solid var(--bdr);border-radius:12px;width:90%;max-width:600px;max-height:82vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.18);transform:translateY(12px) scale(.98);transition:.3s}
.modal-bg.show .modal{transform:translateY(0) scale(1)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1}
.modal-head h3{font-size:.95em;font-weight:700}
.modal-close{width:28px;height:28px;border:none;background:var(--bg4);border-radius:6px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.15s;color:var(--text3)}
.modal-close:hover{background:var(--bdr);color:var(--text)}
.modal-body{padding:20px}

.ai-fab{position:fixed;bottom:22px;right:22px;width:50px;height:50px;border-radius:50%;background:var(--accent);color:var(--accent-txt);border:none;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.2);z-index:50;transition:all .3s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;justify-content:center}
.ai-fab:hover{transform:scale(1.08);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.ai-fab svg{width:22px;height:22px;fill:currentColor}
.ai-fab.open{opacity:0;transform:scale(.5);pointer-events:none}
.ai-fab.voice{animation:voicePulse 1s ease infinite}
.ai-panel{position:fixed;bottom:22px;right:22px;width:380px;height:480px;background:var(--card);border:1px solid var(--bdr);border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,.18);z-index:50;display:flex;flex-direction:column;pointer-events:none;opacity:0;transform-origin:bottom right;transition:opacity .25s ease,transform .3s cubic-bezier(.34,1.56,.64,1)}
.ai-panel.show{opacity:1;pointer-events:auto;transform:scale(1)}
.ai-panel-head{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:7px;cursor:move;user-select:none;flex-shrink:0}
.ai-panel-head .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.ai-panel-head h4{font-size:12.5px;font-weight:700;flex:1}
.ai-panel-head .close{width:24px;height:24px;border:none;background:var(--bg4);border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;color:var(--text3)}
.ai-panel-head .close:hover{background:var(--bdr);color:var(--text)}
.ai-panel-body{flex:1;overflow-y:auto;padding:12px 16px}
.ai-msg{margin-bottom:9px;max-width:88%}.ai-msg.user{margin-left:auto}
.ai-msg .bubble{padding:8px 12px;border-radius:9px;font-size:12px;line-height:1.5}
.ai-msg.bot .bubble{background:var(--bg3);border-bottom-left-radius:2px}
.ai-msg.user .bubble{background:var(--accent);color:var(--accent-txt);border-bottom-right-radius:2px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.ai-msg.bot .bubble.streaming{animation:blink 1s ease infinite}
.ai-msg .time{font-size:9.5px;color:var(--text3);margin-top:2px;padding:0 2px}.ai-msg.user .time{text-align:right}
.ai-panel-input{padding:10px 12px;border-top:1px solid var(--bdr);display:flex;gap:6px;flex-shrink:0}
.ai-panel-input input{flex:1;padding:8px 11px;border:1px solid var(--bdr);border-radius:7px;font-size:12px;background:var(--bg3);color:var(--text)}
.ai-panel-input input:focus{outline:none;border-color:var(--accent)}
.ai-panel-input .voice-btn{width:34px;height:34px;border:none;border-radius:50%;background:var(--bg4);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;color:var(--text3)}
.ai-panel-input .voice-btn:hover{background:var(--accent);color:#fff}
.ai-panel-input .voice-btn.recording{background:var(--err);color:var(--accent-txt);animation:voicePulse 1s ease infinite}
.ai-panel-input .voice-btn svg{width:14px;height:14px;fill:currentColor}
.ai-panel-input .send{padding:8px 14px;border:none;border-radius:7px;background:var(--accent);color:var(--accent-txt);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;flex-shrink:0}
.ai-panel-input .send:hover{background:var(--accent2)}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);padding:9px 18px;background:var(--accent);color:#fff;border:1px solid var(--bdr);border-radius:7px;font-size:12.5px;font-weight:500;z-index:999;transition:.35s;opacity:0;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.ok{background:var(--ok);color:#fff}
#toast.er{background:var(--err);color:#fff}
#tip{position:fixed;background:var(--bg4);color:var(--text);padding:5px 10px;border-radius:6px;font-size:11px;pointer-events:none;z-index:998;display:none;max-width:160px;border:1px solid var(--bdr)}
@media(max-width:768px){.sidebar{width:52px;min-width:52px}.sidebar-brand h1 span,.sidebar-brand p,.nav-section,.nav-item span:not(.icon),.nav-item .badge,.sidebar-footer{display:none}.nav-item{justify-content:center;padding:10px;margin:1px 4px}.sidebar-brand{padding:12px 0;text-align:center}.sidebar-brand h1{justify-content:center}.content{padding:12px}.ai-panel{width:calc(100% - 24px);right:12px;bottom:76px}}
.katex{font-size:1.05em !important}.katex-display{margin:8px 0 !important}.katex .mord{color:var(--text) !important}.katex .mbin,.katex .mrel,.katex .mopen,.katex .mclose{color:var(--text) !important}[data-theme="dark"] .katex{color:var(--text) !important}
</style>
</head>
<body>
<aside class="sidebar anim">
  <div class="sidebar-brand">
    <h1><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> <span>AI 复习</span></h1>
    <p>期末复习助手</p>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">学习</div>

var graphZoom=1,graphPanX=0,graphPanY=0,graphPanning=false,graphPanStart={x:0,y:0};

function mindMapLayout(g,W,H){
  var nodes=g.nodes,edges=g.edges;
  var children={};
  for(var i=0;i<edges.length;i++){
    if(!children[edges[i][0]])children[edges[i][0]]=[];
    children[edges[i][0]].push(edges[i][1]);
  }
  var center=nodes[0];
  var leftKids=[],rightKids=[];
  var allKids=children[center.id]||[];
  for(var i=0;i<allKids.length;i++){if(i<allKids.length/2)leftKids.push(allKids[i]);else rightKids.push(allKids[i])}
  center.x=W/2;center.y=H/2;
  function layoutBranch(ids,startX,startY,dir){
    var y=startY;
    for(var i=0;i<ids.length;i++){
      var nd=null;for(var j=0;j<nodes.length;j++)if(nodes[j].id===ids[i])nd=j;
      if(nd===null)continue;
      var kids=children[ids[i]]||[];
      var subH=kids.length*28;
      nodes[nd].x=startX+dir*180;
      nodes[nd].y=y+subH/2;
      if(kids.length){
        for(var k=0;k<kids.length;k++){
          var subNd=null;for(var j=0;j<nodes.length;j++)if(nodes[j].id===kids[k])subNd=j;
          if(subNd!==null){nodes[subNd].x=startX+dir*340;nodes[subNd].y=y+k*28+14}
        }
      }
      y+=Math.max(50,subH+20);
    }
  }
  layoutBranch(rightKids,W/2+100,H/2-(rightKids.length*50)/2,1);
  layoutBranch(leftKids,W/2-100,H/2-(leftKids.length*50)/2,-1);
}

function drawGraph(c,x){
  if(!c||!x)return;
  var W=c.width,H=c.height;x.clearRect(0,0,W,H);
  var g=GRAPHS[subj];
  x.save();
  x.translate(graphPanX,graphPanY);
  x.scale(graphZoom,graphZoom);
  for(var i=0;i<g.edges.length;i++){
    var a=g.edges[i][0],b=g.edges[i][1],na=null,nb=null;
    for(var j=0;j<g.nodes.length;j++){if(g.nodes[j].id===a)na=g.nodes[j];if(g.nodes[j].id===b)nb=g.nodes[j]}
    if(na&&nb){
      x.beginPath();
      var midX=(na.x+nb.x)/2;
      x.moveTo(na.x,na.y);x.bezierCurveTo(midX,na.y,midX,nb.y,nb.x,nb.y);
      x.strokeStyle="var(--bdr)";x.lineWidth=1.5;x.stroke();
    }
  }
  for(var i=0;i<g.nodes.length;i++){
    var nd=g.nodes[i],col=COL[nd.s]||COL.not;
    var isCenter=i===0;
    var w=isCenter?nd.r*2.5:nd.r*2;
    var h=isCenter?36:28;
    x.shadowColor="rgba(0,0,0,.12)";x.shadowBlur=8;x.shadowOffsetY=2;
    x.beginPath();
    var rx=h/2;
    x.roundRect(nd.x-w/2,nd.y-h/2,w,h,rx);
    x.fillStyle=col;x.fill();
    x.shadowColor="transparent";
    x.fillStyle=isCenter?"var(--accent-txt)":"#fff";
    x.font=(isCenter?"bold 13px":"600 11px")+" -apple-system,sans-serif";
    x.textAlign="center";x.textBaseline="middle";x.fillText(nd.n,nd.x,nd.y);
  }
  x.restore();
}

function graphWheel(e){e.preventDefault();var d=e.deltaY>0?0.9:1.1;graphZoom=Math.max(0.2,Math.min(4,graphZoom*d));drawGraph(canvas,ctx);if(canvas2)drawGraph(canvas2,ctx2)}
function graphMouseDown(e){if(e.button===0){graphPanning=true;graphPanStart={x:e.clientX-graphPanX,y:e.clientY-graphPanY};if(canvas)canvas.style.cursor="grabbing";if(canvas2)canvas2.style.cursor="grabbing"}}
function graphMouseMove(e){
  if(graphPanning){graphPanX=e.clientX-graphPanStart.x;graphPanY=e.clientY-graphPanStart.y;drawGraph(canvas,ctx);if(canvas2)drawGraph(canvas2,ctx2);return}
  var c=e.target;if(!c||!c.getContext)return;
  var r=c.getBoundingClientRect(),mx=(e.clientX-r.left-graphPanX)/graphZoom,my=(e.clientY-r.top-graphPanY)/graphZoom;

  if(!hovered){document.getElementById("tip").style.display="none";c.style.cursor=graphPanning?"grabbing":"grab"}

    var data=await res.json(),raw=data.choices[0].message.content;

function check(){
  var right=0,miss=[],missMap={};
  for(var i=0;i<questions.length;i++){
    var q=questions[i],opts=document.querySelectorAll('.opt[data-q="'+i+'"]');
    for(var j=0;j<opts.length;j++){opts[j].classList.remove("sel");opts[j].style.pointerEvents="none";if(j===q.correct)opts[j].classList.add("ok");if(answers[i]===j&&j!==q.correct)opts[j].classList.add("no")}
    if(answers[i]===q.correct)right++;else{if(!missMap[q.topic]){miss.push(q.topic);missMap[q.topic]=1}}
  }
  var pct=Math.round(right/questions.length*100),C=2*Math.PI*38;
  var hint="";if(miss.length)hint='<div class="schint">建议复习：'+miss.join("、")+'</div>';

}

function getPageContext(){
  var page=document.querySelector(".page.on");if(!page)return"当前没有打开任何页面。";
  var id=page.id.replace("page-",""),ctx="";
  if(id==="review"){

    var weakCard=document.getElementById("weakCard"),weakText="";
    if(!weakCard.classList.contains("h"))weakText=document.getElementById("weakTags").innerText;
    ctx="当前页面：知识复习\n学科："+subjName;
    if(note)ctx+="\n用户输入的复习内容："+note;
    if(weakText)ctx+="\n已识别的薄弱知识点："+weakText;
    var g=GRAPHS[subj];if(g){var mastered=[],weak=[],not=[];for(var i=0;i<g.nodes.length;i++){var n=g.nodes[i];if(n.s==="mastered")mastered.push(n.n);else if(n.s==="weak")weak.push(n.n);else not.push(n.n)}ctx+="\n知识点状态：已掌握["+mastered.join("、")+"], 薄弱["+weak.join("、")+"], 未掌握["+not.join("、")+"]"}
  }else if(id==="quiz"){
    ctx="当前页面：练习测试\n";
    if(questions.length){ctx+="共"+questions.length+"道题，已答"+Object.keys(answers).length+"道。";for(var i=0;i<questions.length;i++){var q=questions[i];ctx+="\n"+(i+1)+"."+q.topic+": "+q.question}}else ctx+="暂无题目。";
  }else if(id==="graph"){
    var g=GRAPHS[subj];ctx="当前页面：知识图谱\n学科："+(SUBJECTS[subj]||subj)+"\n知识点：";
    for(var i=0;i<g.nodes.length;i++){var n=g.nodes[i];var st=n.s==="mastered"?"已掌握":n.s==="weak"?"薄弱":"未掌握";ctx+=n.n+"("+st+") ";if(i<g.nodes.length-1)ctx+="、"}
  }else if(id==="stats"){
    var h=getHist();ctx="当前页面：学习统计\n总学习次数："+h.length;
    if(h.length){var avg=0;for(var i=0;i<h.length;i++)avg+=h[i].score;ctx+="\n平均分："+Math.round(avg/h.length)}
  }else if(id==="history"){
    var h=getHist();ctx="当前页面：学习记录\n共"+h.length+"条。";
    if(h.length){var last=h[0];ctx+="\n最近："+(SUBJECTS[last.subject]||last.subject)+" "+last.score+"分"}
  }else if(id==="settings"){ctx="当前页面：AI 配置\n模型："+document.getElementById("modelName").value}
  return ctx;
}

async function sendAI(){
  var input=document.getElementById("aiInput"),msg=input.value.trim();
  if(!msg)return;input.value="";
  var chat=document.getElementById("aiChat");
  chat.innerHTML+='<div class="ai-msg user"><div class="bubble">'+escH(msg)+'</div><div class="time">刚刚</div></div>';
  chat.scrollTop=chat.scrollHeight;
  var base=document.getElementById("baseUrl").value.trim(),key=document.getElementById("apiKey").value.trim(),model=document.getElementById("modelName").value.trim();
  if(!key){chat.innerHTML+='<div class="ai-msg bot"><div class="bubble">请先在「AI 配置」中填写 API Key。</div><div class="time">刚刚</div></div>';chat.scrollTop=chat.scrollHeight;return}
  var botDiv=document.createElement("div");botDiv.className="ai-msg bot";
  var bubble=document.createElement("div");bubble.className="bubble streaming";bubble.textContent="...";
  var timeDiv=document.createElement("div");timeDiv.className="time";timeDiv.textContent="刚刚";
  botDiv.appendChild(bubble);botDiv.appendChild(timeDiv);chat.appendChild(botDiv);chat.scrollTop=chat.scrollHeight;
  try{
    var ctx=getPageContext();
    var sys="你是"+(SUBJECTS[subj]||"")+"期末复习AI助手。根据用户当前页面上下文回答学习问题，简洁实用，每次回答不超过5句话。\n\n【重要】数学公式必须使用 LaTeX 格式：\n- 行内公式用 $...$ 包裹，如 $x^2+y^2=r^2$\n- 独立公式用 $$...$$ 包裹，如 $$\\int_0^1 x^2 dx = \\frac{1}{3}$$\n- 常用符号：\\frac{a}{b} 分数，\\sqrt{x} 根号，\\sum 求和，\\int 积分，\\partial 偏导，\\infty 无穷\n- 不要使用 ^ 或 _ 裸写，必须用 $ 包裹\n\n当前上下文：\n"+ctx;
    var res=await fetch(base+"/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:model,messages:[{role:"system",content:sys},{role:"user",content:msg}],temperature:.7,max_tokens:600,stream:true})});
    if(!res.ok){var err="";try{err=await res.text()}catch(e){}throw new Error("API "+res.status+": "+(err.slice(0,200)||"未知错误"))}
    var reader=res.body.getReader();var decoder=new TextDecoder();var fullText="";var buffer="";
    while(true){
      var chunk=await reader.read();
      if(chunk.done)break;
      buffer+=decoder.decode(chunk.value,{stream:true});
      var lines=buffer.split("\n");buffer=lines.pop();
      for(var i=0;i<lines.length;i++){
        var line=lines[i].trim();
        if(!line||!line.startsWith("data:"))continue;
        var data=line.slice(5).trim();
        if(data==="[DONE]")continue;
        try{var parsed=JSON.parse(data);var delta=parsed.choices&&parsed.choices[0]&&parsed.choices[0].delta;var content=delta&&delta.content;if(content){fullText+=content;bubble.textContent=fullText;chat.scrollTop=chat.scrollHeight}}catch(e){}
      }
    }
    bubble.innerHTML=escH(fullText);
    bubble.classList.remove("streaming");
    renderLatex(botDiv);
    trackUsageEstimate(model,fullText.length+msg.length);
  }catch(e){
    var errMsg=e.message||"未知错误";
    if(errMsg.indexOf("Failed to fetch")>=0||errMsg.indexOf("NetworkError")>=0)errMsg="网络请求失败，可能是 CORS 限制。";
    bubble.innerHTML=escH("请求失败: "+errMsg);
    bubble.classList.remove("streaming");
  }
  chat.scrollTop=chat.scrollHeight;
}
function escH(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function renderLatex(el){
  if(typeof renderMathInElement==="function"){
    renderMathInElement(el||document.body,{
      delimiters:[
        {left:"$$",right:"$$",display:true},
        {left:"$",right:"$",display:false},
        {left:"\\(",right:"\\)",display:false},
        {left:"\\[",right:"\\]",display:true}
      ],
      throwOnError:false
    });
  }
}

var voiceActive=false,voiceRecognizer=null,voiceStream=null,voiceAnimId=null;
function toggleVoice(){
  if(voiceActive){stopVoice();return}
  if(!("webkitSpeechRecognition" in window||"SpeechRecognition" in window)){toast("浏览器不支持语音输入","er");return}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  voiceRecognizer=new SR();voiceRecognizer.continuous=true;voiceRecognizer.interimResults=true;voiceRecognizer.lang="zh-CN";
  voiceRecognizer.onresult=function(e){var txt="";for(var i=e.resultIndex;i<e.results.length;i++)txt+=e.results[i][0].transcript;document.getElementById("aiInput").value=txt};
  voiceRecognizer.onerror=function(){stopVoice()};
  voiceRecognizer.onend=function(){if(voiceActive)try{voiceRecognizer.start()}catch(e){}};
  try{voiceRecognizer.start()}catch(e){stopVoice();return}
  var fab=document.getElementById("aiFab");
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    voiceStream=stream;
    var ac=new(window.AudioContext||window.webkitAudioContext)();
    var src=ac.createMediaStreamSource(stream);
    var analyser=ac.createAnalyser();analyser.fftSize=256;src.connect(analyser);
    var data=new Uint8Array(analyser.frequencyBinCount);
    function anim(){
      analyser.getByteFrequencyData(data);
      var avg=0;for(var i=0;i<data.length;i++)avg+=data[i];avg=avg/data.length;
      var scale=1+avg/250;
      fab.style.transform="scale("+scale.toFixed(3)+")";
      fab.style.boxShadow="0 0 "+(20+avg*.5).toFixed(0)+"px rgba(66,99,237,"+(0.3+avg/500).toFixed(2)+")";
      voiceAnimId=requestAnimationFrame(anim);
    }
    anim();
  }).catch(function(){});
  voiceActive=true;fab.classList.add("voice");
  document.getElementById("voiceBtn").classList.add("recording");
  toast("语音输入已开启","ok");
}
function stopVoice(){
  voiceActive=false;
  var fab=document.getElementById("aiFab");
  fab.classList.remove("voice");fab.style.transform="";fab.style.boxShadow="";
  if(voiceAnimId)cancelAnimationFrame(voiceAnimId);
  if(voiceRecognizer)try{voiceRecognizer.stop()}catch(e){}
  if(voiceStream)voiceStream.getTracks().forEach(function(t){t.stop()});
  document.getElementById("voiceBtn").classList.remove("recording");
}

window.addEventListener("DOMContentLoaded",function(){
  initTheme();loadSettings();
  canvas=document.getElementById("kg");ctx=canvas.getContext("2d");
  canvas.width=canvas.parentElement.clientWidth;canvas.height=340;
  mindMapLayout(GRAPHS[subj],canvas.width,canvas.height);
  window.addEventListener("resize",function(){canvas.width=canvas.parentElement.clientWidth;canvas.height=340;mindMapLayout(GRAPHS[subj],canvas.width,canvas.height);drawGraph(canvas,ctx);if(canvas2){canvas2.width=canvas2.parentElement.clientWidth;canvas2.height=340;mindMapLayout(GRAPHS[subj],canvas2.width,canvas2.height);drawGraph(canvas2,ctx2)}});
  canvas.onmousedown=graphMouseDown;
  canvas.onmousemove=graphMouseMove;
  canvas.onmouseup=graphMouseUp;
  canvas.onmouseleave=graphMouseUp;
  canvas.onwheel=graphWheel;
  var pills=document.querySelectorAll(".pill");for(var i=0;i<pills.length;i++){(function(p){p.onclick=function(){var all=document.querySelectorAll(".pill");for(var j=0;j<all.length;j++)all[j].classList.remove("on");p.classList.add("on");subj=p.dataset.s;mindMapLayout(GRAPHS[subj],canvas.width,canvas.height);graphZoom=1;graphPanX=0;graphPanY=0;drawGraph(canvas,ctx)}})(pills[i])}
  drawGraph(canvas,ctx);renderHistory();updateStats();updateHistBadge();
  setTimeout(function(){renderLatex()},500);
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeModal();if(aiOpen)toggleAI()}});
</script>
</body>
</html>
