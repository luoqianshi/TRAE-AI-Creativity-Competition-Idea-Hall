<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>阅读理解训练营 · AI阅读小伙伴</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="app-header">
        <div class="logo" onclick="goHome()">
            <span class="logo-icon">📖</span>
            <span class="logo-text">阅读小伙伴</span>
        </div>
        <nav class="top-nav">
            <button class="nav-btn" onclick="showTips()">💡 答题技巧</button>
            <button class="nav-btn" onclick="showTemplates()">📋 答题模板</button>
            <button class="nav-btn" onclick="showStats()">📊 我的记录</button>
        </nav>
    </header>

    <main class="app-main">

        <!-- 视图1：首页 · 选年级 -->
        <section class="view view-home active" id="view-home">
            <div class="hero-banner">
                <div class="hero-emoji float">📚</div>
                <h1 class="hero-title">欢迎来到<br/>阅读理解训练营</h1>
                <p class="hero-sub">选好你的年级，一起开始有趣的阅读之旅吧！</p>
            </div>

            <div class="grade-cards">
                <div class="grade-card grade-34" onclick="selectGrade('g34')">
                    <div class="grade-emoji">🌱</div>
                    <h3>小学3-4年级</h3>
                    <p>浅显有趣的小故事</p>
                    <span class="grade-tag">入门</span>
                </div>
                <div class="grade-card grade-56" onclick="selectGrade('g56')">
                    <div class="grade-emoji">🌻</div>
                    <h3>小学5-6年级</h3>
                    <p>丰富的情感与描写</p>
                    <span class="grade-tag">进阶</span>
                </div>
                <div class="grade-card grade-jr" onclick="selectGrade('jr')">
                    <div class="grade-emoji">🌳</div>
                    <h3>初中</h3>
                    <p>有深度的散文与小说</p>
                    <span class="grade-tag">挑战</span>
                </div>
            </div>

            <div class="home-features">
                <div class="feature-chip">🤖 AI小助手陪你思考</div>
                <div class="feature-chip">✏️ 三层提示不直接给答案</div>
                <div class="feature-chip">📚 答题技巧随时查</div>
            </div>
        </section>

        <!-- 视图2：文章列表 -->
        <section class="view view-articles" id="view-articles">
            <button class="back-btn" onclick="goHome()">← 返回首页</button>
            <h2 class="section-title" id="articles-title">请选择一篇文章</h2>
            <div class="article-list" id="article-list"></div>
        </section>

        <!-- 视图3：做题页面 -->
        <section class="view view-quiz" id="view-quiz">
            <button class="back-btn" onclick="backToArticles()">← 返回文章列表</button>
            <h2 class="article-title" id="quiz-title"></h2>

            <div class="article-paper">
                <div class="article-content" id="article-content"></div>
            </div>

            <div class="quiz-progress">
                <div class="progress-text" id="progress-text">第 1 / 3 题</div>
                <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            </div>

            <div class="question-area" id="question-area"></div>

            <div class="quiz-nav">
                <button class="btn-ghost" id="btn-prev" onclick="prevQuestion()">← 上一题</button>
                <button class="btn-primary" id="btn-next" onclick="nextQuestion()">下一题 →</button>
            </div>
        </section>

        <!-- 视图4：答题技巧 -->
        <section class="view view-tips" id="view-tips">
            <button class="back-btn" onclick="goHome()">← 返回首页</button>
            <h2 class="section-title">💡 答题技巧小锦囊</h2>
            <p class="section-subtitle">做题前先来看看这些小方法，遇到困难随时回来查哦！</p>
            <div class="tips-grid" id="tips-grid"></div>
        </section>

        <!-- 视图5：练习记录 -->
        <section class="view view-stats" id="view-stats">
            <button class="back-btn" onclick="goHome()">← 返回首页</button>
            <h2 class="section-title">📊 我的阅读小记录</h2>
            <div class="stats-cards" id="stats-cards"></div>
            <div class="stats-history">
                <h3>最近练习</h3>
                <ul id="history-list"></ul>
                <button class="btn-ghost btn-small" onclick="clearHistory()">🧹 清空记录</button>
            </div>
        </section>

        <!-- 视图6：答题模板 -->
        <section class="view view-templates" id="view-templates">
            <button class="back-btn" onclick="goHome()">← 返回首页</button>
            <h2 class="section-title">我的答题模板</h2>
            <div class="templates-list" id="templates-list"></div>
        </section>

    </main>

    <!-- AI小助手弹窗 -->
    <div class="ai-modal" id="ai-modal">
        <div class="ai-modal-box">
            <div class="ai-content" id="ai-content"></div>
        </div>
    </div>

    <!-- 答题模板弹窗 -->
    <div class="ai-modal" id="template-modal">
        <div class="ai-modal-box">
            <div class="ai-header">
                <div class="ai-title">📋 <span id="template-modal-title">答题模板</span></div>
                <button class="ai-close" onclick="closeTemplateModal()">✕</button>
            </div>
            <div class="ai-content" style="padding:20px;">
                <div id="template-modal-content"></div>
            </div>
        </div>
    </div>

    <script src="articles.js"></script>
    <script src="script.js"></script>
</body>
</html>
