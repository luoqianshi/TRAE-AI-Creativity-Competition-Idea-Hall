<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻卡助手 - 卡路里饮食运动计算</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .stats-panel {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            padding: 25px;
            color: white;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .gap-indicator {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
        }

        .gap-value {
            font-size: 24px;
            font-weight: bold;
        }

        .gap-status {
            font-size: 14px;
            margin-top: 5px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #667eea;
            margin-right: 10px;
            border-radius: 2px;
        }

        .meal-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .meal-tab {
            padding: 10px 20px;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: white;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s;
        }

        .meal-tab.active {
            background: #667eea;
            color: white;
        }

        .food-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .food-category {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
        }

        .category-title {
            font-size: 16px;
            color: #667eea;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .food-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .food-item {
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .food-item:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .food-cal {
            font-size: 12px;
            color: #999;
            margin-left: 5px;
        }

        .selected-foods {
            background: #f0f4ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .selected-food-title {
            font-size: 16px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .selected-food-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .selected-food-tag {
            background: #667eea;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .amount-input {
            width: 60px;
            padding: 4px 8px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 12px;
            text-align: center;
        }

        .amount-input:focus {
            outline: none;
            border-color: white;
        }

        .amount-unit {
            font-size: 12px;
            opacity: 0.8;
        }

        .remove-btn {
            cursor: pointer;
            opacity: 0.7;
            font-size: 14px;
        }

        .remove-btn:hover {
            opacity: 1;
        }

        .meal-total {
            background: #667eea;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
        }

        .exercise-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .exercise-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .exercise-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .exercise-item:hover {
            border-color: #f5576c;
        }

        .exercise-item.selected {
            border-color: #f5576c;
            background: #fff5f7;
        }

        .exercise-name {
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
        }

        .exercise-cal {
            font-size: 14px;
            color: #f5576c;
        }

        .exercise-duration {
            margin-top: 15px;
        }

        .duration-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .duration-input input {
            width: 80px;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
        }

        .duration-input span {
            color: #666;
        }

        .exercise-total {
            background: #f5576c;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
        }

        .daily-summary {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
        }

        .summary-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .summary-chart {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .chart-bar {
            width: 80px;
            text-align: center;
        }

        .bar-container {
            height: 150px;
            background: #e0e0e0;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .bar-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            border-radius: 10px;
            transition: height 0.5s;
        }

        .bar-intake {
            background: #667eea;
        }

        .bar-exercise {
            background: #f5576c;
        }

        .bar-gap {
            background: #4CAF50;
        }

        .bar-label {
            font-size: 14px;
            color: #666;
        }

        .bar-value {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .tips {
            background: #fff9e6;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .tips-title {
            font-size: 16px;
            color: #ffc107;
            margin-bottom: 10px;
        }

        .tips-content {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .reset-btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .user-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .user-info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-label {
            font-size: 14px;
            color: #666;
        }

        .info-input {
            width: 100px;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }

        .bmr-result {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .food-selector {
                grid-template-columns: 1fr;
            }

            .exercise-grid {
                grid-template-columns: 1fr;
            }

            .user-info-grid {
                grid-template-columns: 1fr;
            }

            .selected-food-tag {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>轻卡助手</h1>
            <p>科学计算热量缺口，轻松达成减脂目标</p>
        </div>

        <!-- 用户信息设置 -->
        <div class="user-info">
            <div class="section-title">个人基础信息</div>
            <div class="user-info-grid">
                <div class="info-item">
                    <span class="info-label">性别：</span>
                    <select class="info-input" id="gender">
                        <option value="male">男</option>
                        <option value="female">女</option>
                    </select>
                </div>
                <div class="info-item">
                    <span class="info-label">年龄：</span>
                    <input type="number" class="info-input" id="age" value="25" placeholder="岁">
                </div>
                <div class="info-item">
                    <span class="info-label">身高：</span>
                    <input type="number" class="info-input" id="height" value="170" placeholder="cm">
                </div>
                <div class="info-item">
                    <span class="info-label">体重：</span>
                    <input type="number" class="info-input" id="weight" value="65" placeholder="kg">
                </div>
                <div class="info-item">
                    <span class="info-label">目标体重：</span>
                    <input type="number" class="info-input" id="targetWeight" value="60" placeholder="kg">
                </div>
                <div class="info-item">
                    <span class="info-label">活动水平：</span>
                    <select class="info-input" id="activityLevel">
                        <option value="1.2">久坐不动</option>
                        <option value="1.375">轻度活动</option>
                        <option value="1.55">中度活动</option>
                        <option value="1.725">重度活动</option>
                    </select>
                </div>
            </div>
            <div class="bmr-result">
                <div>基础代谢率(BMR): <span id="bmrValue">1600</span> kcal/天</div>
                <div style="font-size: 14px; margin-top: 5px;">每日建议摄入: <span id="tdeeValue">1920</span> kcal</div>
            </div>
        </div>

        <!-- 热量统计面板 -->
        <div class="stats-panel">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalIntake">0</div>
                    <div class="stat-label">今日摄入(kcal)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalExercise">0</div>
                    <div class="stat-label">运动消耗(kcal)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="netCalories">0</div>
                    <div class="stat-label">净摄入(kcal)</div>
                </div>
            </div>
            <div class="gap-indicator">
                <div class="gap-value" id="gapValue">0 kcal</div>
                <div class="gap-status" id="gapStatus">热量缺口状态：未记录</div>
            </div>
        </div>

        <!-- 饮食记录 -->
        <div class="section">
            <div class="section-title">饮食记录</div>
            <div class="meal-tabs">
                <button class="meal-tab active" onclick="switchMeal('breakfast')">早餐</button>
                <button class="meal-tab" onclick="switchMeal('lunch')">午餐</button>
                <button class="meal-tab" onclick="switchMeal('dinner')">晚餐</button>
                <button class="meal-tab" onclick="switchMeal('snack')">加餐</button>
            </div>

            <div class="food-selector">
                <div class="food-category">
                    <div class="category-title">主食类</div>
                    <div class="food-list" id="stapleFood"></div>
                </div>
                <div class="food-category">
                    <div class="category-title">蛋白质类</div>
                    <div class="food-list" id="proteinFood"></div>
                </div>
                <div class="food-category">
                    <div class="category-title">蔬菜水果</div>
                    <div class="food-list" id="vegetableFood"></div>
                </div>
                <div class="food-category">
                    <div class="category-title">其他</div>
                    <div class="food-list" id="otherFood"></div>
                </div>
            </div>

            <div class="selected-foods">
                <div class="selected-food-title">已选择食物：</div>
                <div class="selected-food-list" id="selectedFoodList"></div>
            </div>

            <div class="meal-total">
                本餐热量总计：<span id="mealTotal">0</span> kcal
            </div>
        </div>

        <!-- 运动记录 -->
        <div class="section">
            <div class="section-title">运动记录</div>
            <div class="exercise-section">
                <div class="exercise-grid" id="exerciseList"></div>
                
                <div class="exercise-duration">
                    <div class="duration-input">
                        <span>运动时长：</span>
                        <input type="number" id="exerciseDuration" value="30" min="1">
                        <span>分钟</span>
                    </div>
                </div>

                <div class="exercise-total">
                    运动消耗总计：<span id="exerciseTotal">0</span> kcal
                </div>
            </div>
        </div>

        <!-- 每日总结 -->
        <div class="daily-summary">
            <div class="summary-title">今日热量分析</div>
            <div class="summary-chart">
                <div class="chart-bar">
                    <div class="bar-container">
                        <div class="bar-fill bar-intake" id="intakeBar" style="height: 0%"></div>
                    </div>
                    <div class="bar-label">摄入</div>
                    <div class="bar-value" id="intakeBarValue">0 kcal</div>
                </div>
                <div class="chart-bar">
                    <div class="bar-container">
                        <div class="bar-fill bar-exercise" id="exerciseBar" style="height: 0%"></div>
                    </div>
                    <div class="bar-label">消耗</div>
                    <div class="bar-value" id="exerciseBarValue">0 kcal</div>
                </div>
                <div class="chart-bar">
                    <div class="bar-container">
                        <div class="bar-fill bar-gap" id="gapBar" style="height: 0%"></div>
                    </div>
                    <div class="bar-label">缺口</div>
                    <div class="bar-value" id="gapBarValue">0 kcal</div>
                </div>
            </div>

            <div class="tips">
                <div class="tips-title">💡 今日建议</div>
                <div class="tips-content" id="tipsContent">
                    开始记录您的饮食和运动，获取个性化减脂建议！
                </div>
            </div>
        </div>

        <button class="reset-btn" onclick="resetAll()">重置今日记录</button>
    </div>

    <script>
        const foodDatabase = {
            staple: [
                { name: '米饭', cal: 116 },
                { name: '面条', cal: 137 },
                { name: '馒头', cal: 221 },
                { name: '面包', cal: 265 },
                { name: '燕麦', cal: 367 },
                { name: '红薯', cal: 86 },
                { name: '土豆', cal: 77 },
                { name: '玉米', cal: 112 }
            ],
            protein: [
                { name: '鸡胸肉', cal: 133 },
                { name: '牛肉', cal: 125 },
                { name: '猪肉', cal: 143 },
                { name: '鱼肉', cal: 104 },
                { name: '鸡蛋', cal: 144 },
                { name: '牛奶', cal: 54 },
                { name: '豆腐', cal: 81 },
                { name: '豆浆', cal: 31 }
            ],
            vegetable: [
                { name: '西兰花', cal: 34 },
                { name: '菠菜', cal: 23 },
                { name: '胡萝卜', cal: 41 },
                { name: '黄瓜', cal: 15 },
                { name: '番茄', cal: 18 },
                { name: '苹果', cal: 52 },
                { name: '香蕉', cal: 89 },
                { name: '橙子', cal: 47 }
            ],
            other: [
                { name: '坚果', cal: 607 },
                { name: '酸奶', cal: 72 },
                { name: '巧克力', cal: 546 },
                { name: '蛋糕', cal: 348 },
                { name: '薯片', cal: 536 },
                { name: '可乐', cal: 43 },
                { name: '奶茶', cal: 65 },
                { name: '咖啡', cal: 2 }
            ]
        };

        const exerciseDatabase = [
            { name: '跑步', cal: 600, icon: '🏃' },
            { name: '游泳', cal: 550, icon: '🏊' },
            { name: '骑行', cal: 480, icon: '🚴' },
            { name: '跳绳', cal: 700, icon: '🎯' },
            { name: '瑜伽', cal: 180, icon: '🧘' },
            { name: '散步', cal: 200, icon: '🚶' },
            { name: '健身操', cal: 400, icon: '💪' },
            { name: '篮球', cal: 450, icon: '🏀' }
        ];

        let currentMeal = 'breakfast';
        let selectedFoods = {
            breakfast: [],
            lunch: [],
            dinner: [],
            snack: []
        };
        let selectedExercise = null;
        let totalIntake = 0;
        let totalExercise = 0;

        function init() {
            renderFoodList();
            renderExerciseList();
            calculateBMR();
            updateStats();
        }

        function renderFoodList() {
            const categories = {
                stapleFood: foodDatabase.staple,
                proteinFood: foodDatabase.protein,
                vegetableFood: foodDatabase.vegetable,
                otherFood: foodDatabase.other
            };

            for (let [containerId, foods] of Object.entries(categories)) {
                const container = document.getElementById(containerId);
                container.innerHTML = foods.map(food => `
                    <div class="food-item" onclick="selectFood('${food.name}', ${food.cal})">
                        ${food.name}<span class="food-cal">${food.cal}kcal/100g</span>
                    </div>
                `).join('');
            }
        }

        function renderExerciseList() {
            const container = document.getElementById('exerciseList');
            container.innerHTML = exerciseDatabase.map(ex => `
                <div class="exercise-item" onclick="selectExercise('${ex.name}', ${ex.cal})">
                    <div class="exercise-name">${ex.icon} ${ex.name}</div>
                    <div class="exercise-cal">${ex.cal} kcal/小时</div>
                </div>
            `).join('');
        }

        function switchMeal(meal) {
            currentMeal = meal;
            document.querySelectorAll('.meal-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            renderSelectedFoods();
        }

        function selectFood(name, cal) {
            const defaultAmount = 100;
            const food = { name, cal, amount: defaultAmount, id: Date.now() + Math.random() };
            selectedFoods[currentMeal].push(food);
            renderSelectedFoods();
            updateStats();
        }

        function removeFood(index) {
            selectedFoods[currentMeal].splice(index, 1);
            renderSelectedFoods();
            updateStats();
        }

        function updateFoodAmount(index, event) {
            const amount = parseInt(event.target.value) || 0;
            if (amount < 1) {
                event.target.value = 1;
                selectedFoods[currentMeal][index].amount = 1;
            } else {
                selectedFoods[currentMeal][index].amount = amount;
            }
            renderSelectedFoods();
            updateStats();
        }

        function renderSelectedFoods() {
            const container = document.getElementById('selectedFoodList');
            const foods = selectedFoods[currentMeal];
            
            if (foods.length === 0) {
                container.innerHTML = '<span style="color: #999;">暂未选择食物</span>';
                document.getElementById('mealTotal').textContent = '0';
                return;
            }

            container.innerHTML = foods.map((food, index) => {
                const itemCal = Math.round(food.cal * food.amount / 100);
                return `
                    <div class="selected-food-tag">
                        ${food.name}
                        <input type="number" class="amount-input" value="${food.amount}" 
                               oninput="updateFoodAmount(${index}, event)" min="1" placeholder="克数">
                        <span class="amount-unit">g</span>
                        <span style="font-size:12px;opacity:0.8">(${itemCal}kcal)</span>
                        <span class="remove-btn" onclick="removeFood(${index})">✕</span>
                    </div>
                `;
            }).join('');

            const mealTotal = foods.reduce((sum, food) => sum + Math.round(food.cal * food.amount / 100), 0);
            document.getElementById('mealTotal').textContent = mealTotal;
        }

        function selectExercise(name, cal) {
            selectedExercise = { name, cal };
            document.querySelectorAll('.exercise-item').forEach(item => {
                item.classList.remove('selected');
            });
            event.target.closest('.exercise-item').classList.add('selected');
            updateExerciseTotal();
        }

        function updateExerciseTotal() {
            if (!selectedExercise) {
                document.getElementById('exerciseTotal').textContent = '0';
                return;
            }

            const duration = parseInt(document.getElementById('exerciseDuration').value) || 30;
            const exerciseCal = Math.round(selectedExercise.cal * duration / 60);
            document.getElementById('exerciseTotal').textContent = exerciseCal;
            updateStats();
        }

        document.getElementById('exerciseDuration').addEventListener('input', updateExerciseTotal);

        function calculateBMR() {
            const gender = document.getElementById('gender').value;
            const age = parseInt(document.getElementById('age').value) || 25;
            const height = parseInt(document.getElementById('height').value) || 170;
            const weight = parseInt(document.getElementById('weight').value) || 65;
            const activityLevel = parseFloat(document.getElementById('activityLevel').value) || 1.2;

            let bmr;
            if (gender === 'male') {
                bmr = 10 * weight + 6.25 * height - 5 * age + 5;
            } else {
                bmr = 10 * weight + 6.25 * height - 5 * age - 161;
            }

            const tdee = Math.round(bmr * activityLevel);
            
            document.getElementById('bmrValue').textContent = Math.round(bmr);
            document.getElementById('tdeeValue').textContent = tdee;
        }

        ['gender', 'age', 'height', 'weight', 'activityLevel'].forEach(id => {
            document.getElementById(id).addEventListener('change', calculateBMR);
        });

        function updateStats() {
            totalIntake = 0;
            for (let meal of Object.values(selectedFoods)) {
                totalIntake += meal.reduce((sum, food) => sum + Math.round(food.cal * food.amount / 100), 0);
            }

            if (selectedExercise) {
                const duration = parseInt(document.getElementById('exerciseDuration').value) || 30;
                totalExercise = Math.round(selectedExercise.cal * duration / 60);
            } else {
                totalExercise = 0;
            }

            const netCalories = totalIntake - totalExercise;
            
            document.getElementById('totalIntake').textContent = totalIntake;
            document.getElementById('totalExercise').textContent = totalExercise;
            document.getElementById('netCalories').textContent = netCalories;

            const tdee = parseInt(document.getElementById('tdeeValue').textContent);
            const gap = tdee - netCalories;
            
            document.getElementById('gapValue').textContent = `${gap} kcal`;
            
            let gapStatus = '';
            if (totalIntake === 0 && totalExercise === 0) {
                gapStatus = '热量缺口状态：未记录';
            } else if (gap > 500) {
                gapStatus = '热量缺口状态：过大（建议控制在300-500kcal）';
            } else if (gap >= 300 && gap <= 500) {
                gapStatus = '热量缺口状态：理想范围 ✓';
            } else if (gap > 0) {
                gapStatus = '热量缺口状态：偏小（建议增加运动）';
            } else {
                gapStatus = '热量缺口状态：热量超标 ⚠️';
            }
            document.getElementById('gapStatus').textContent = gapStatus;

            updateChart(totalIntake, totalExercise, gap, tdee);
            updateTips(totalIntake, totalExercise, gap, tdee);
        }

        function updateChart(intake, exercise, gap, tdee) {
            const maxHeight = 150;
            
            const intakeHeight = Math.min((intake / tdee) * 100, 100);
            document.getElementById('intakeBar').style.height = intakeHeight + '%';
            document.getElementById('intakeBarValue').textContent = intake + ' kcal';

            const exerciseHeight = Math.min((exercise / (tdee * 0.3)) * 100, 100);
            document.getElementById('exerciseBar').style.height = exerciseHeight + '%';
            document.getElementById('exerciseBarValue').textContent = exercise + ' kcal';

            const gapHeight = Math.min(Math.max(gap / 500, 0) * 100, 100);
            document.getElementById('gapBar').style.height = gapHeight + '%';
            document.getElementById('gapBarValue').textContent = Math.max(gap, 0) + ' kcal';
        }

        function updateTips(intake, exercise, gap, tdee) {
            let tips = '';

            if (intake === 0 && exercise === 0) {
                tips = '开始记录您的饮食和运动，获取个性化减脂建议！';
            } else {
                if (gap > 500) {
                    tips = '⚠️ 今日热量缺口过大，可能导致肌肉流失和代谢下降。建议适当增加健康食物摄入，如鸡胸肉、鱼肉、蔬菜等。';
                } else if (gap >= 300 && gap <= 500) {
                    tips = '✓ 太棒了！今日热量缺口处于理想范围，坚持下去可以有效减脂。建议保持蛋白质摄入充足，配合适量运动。';
                } else if (gap > 0) {
                    tips = '💡 今日热量缺口偏小，可以增加30-60分钟的中等强度运动，如跑步、游泳、骑行等，帮助扩大热量缺口。';
                } else {
                    tips = '⚠️ 今日热量超标，需要控制饮食或增加运动。建议减少高热量食物摄入，增加蔬菜水果比例，并进行45分钟以上运动。';
                }

                const proteinIntake = selectedFoods.breakfast.concat(selectedFoods.lunch, selectedFoods.dinner, selectedFoods.snack)
                    .filter(f => foodDatabase.protein.some(p => p.name === f.name))
                    .reduce((sum, f) => sum + Math.round(f.cal * f.amount / 100), 0);

                if (proteinIntake < totalIntake * 0.2) {
                    tips += '\n\n💪 建议：今日蛋白质摄入偏低，减脂期间建议蛋白质占比20-30%，可增加鸡胸肉、鱼肉、鸡蛋等优质蛋白。';
                }
            }

            document.getElementById('tipsContent').textContent = tips;
        }

        function resetAll() {
            selectedFoods = {
                breakfast: [],
                lunch: [],
                dinner: [],
                snack: []
            };
            selectedExercise = null;
            totalIntake = 0;
            totalExercise = 0;

            document.querySelectorAll('.exercise-item').forEach(item => {
                item.classList.remove('selected');
            });
            document.getElementById('exerciseDuration').value = 30;
            document.getElementById('exerciseTotal').textContent = '0';

            renderSelectedFoods();
            updateStats();
        }

        window.onload = init;
    </script>
</body>
</html>
