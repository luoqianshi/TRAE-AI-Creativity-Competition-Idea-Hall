<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼豆图纸生成器 - Pixel Bead Designer</title>
    <meta name="description" content="在线拼豆图纸设计工具，轻松创作和导出专业级拼豆图纸">
    <style>
        :root {
            --color-primary: #6366f1;
            --color-primary-hover: #4f46e5;
            --color-secondary: #ec4899;
            --color-accent: #22d3ee;
            --color-bg: #0f172a;
            --color-surface: #1e293b;
            --color-surface-elevated: #334155;
            --color-surface-hover: #475569;
            --color-text: #f8fafc;
            --color-text-muted: #94a3b8;
            --color-text-subtle: #64748b;
            --color-border: #334155;
            --color-success: #22c55e;
            --color-warning: #f59e0b;
            --color-error: #ef4444;
            --color-info: #3b82f6;
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.5);
            --transition-fast: 150ms ease;
            --transition-base: 200ms ease;
            --transition-slow: 300ms ease;
            --z-dropdown: 100;
            --z-sticky: 200;
            --z-modal: 300;
            --z-toast: 400;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: var(--color-text);
            background: var(--color-bg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
        }

        input, button {
            outline: none;
        }

        input:focus-visible, button:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--color-border);
            padding: var(--spacing-md) var(--spacing-xl);
            position: sticky;
            top: 0;
            z-index: var(--z-sticky);
        }

        .header__container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-lg);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            text-decoration: none;
            color: inherit;
        }

        .logo__icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: var(--shadow-md);
            transition: transform var(--transition-base);
        }

        .logo:hover .logo__icon {
            transform: scale(1.05);
        }

        .logo__text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header__actions {
            display: flex;
            gap: var(--spacing-sm);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xs);
            padding: 0.625rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: var(--radius-md);
            transition: all var(--transition-base);
            white-space: nowrap;
        }

        .btn--primary {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-hover) 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        .btn--primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.5);
        }

        .btn--secondary {
            background: var(--color-surface-elevated);
            color: var(--color-text);
        }

        .btn--secondary:hover {
            background: var(--color-surface-hover);
        }

        .btn--ghost {
            background: transparent;
            color: var(--color-text-muted);
        }

        .btn--ghost:hover {
            background: var(--color-surface-elevated);
            color: var(--color-text);
        }

        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: var(--spacing-lg);
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            padding: var(--spacing-lg);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .panel {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-md);
        }

        .panel--sticky {
            position: sticky;
            top: calc(80px + var(--spacing-lg));
        }

        .panel__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-md);
        }

        .panel__title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-text-muted);
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-xs);
        }

        .tool-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xs);
            padding: var(--spacing-sm);
            background: var(--color-surface-elevated);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            color: var(--color-text-muted);
            font-size: 0.6875rem;
            transition: all var(--transition-base);
            min-height: 60px;
        }

        .tool-btn:hover {
            background: var(--color-surface-hover);
            color: var(--color-text);
            transform: translateY(-1px);
        }

        .tool-btn--active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        .tool-btn__icon {
            font-size: 1.25rem;
            line-height: 1;
        }

        .tool-btn__label {
            font-size: 0.6875rem;
            line-height: 1;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: var(--spacing-xs);
        }

        .color-btn {
            width: 100%;
            aspect-ratio: 1;
            border: 3px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
            position: relative;
        }

        .color-btn::before {
            content: '';
            position: absolute;
            inset: 2px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 60%);
            border-radius: 3px;
            pointer-events: none;
        }

        .color-btn:hover {
            transform: scale(1.15);
            z-index: 1;
            box-shadow: var(--shadow-md);
        }

        .color-btn--active {
            border-color: white;
            box-shadow: 0 0 0 2px var(--color-surface), 0 0 0 4px var(--color-primary);
        }

        .color-custom {
            margin-top: var(--spacing-sm);
        }

        .color-custom__label {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-size: 0.75rem;
            color: var(--color-text-muted);
            cursor: pointer;
        }

        .color-custom__input {
            width: 100%;
            height: 32px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-surface-elevated);
            margin-top: var(--spacing-xs);
            cursor: pointer;
        }

        .color-custom__input::-webkit-color-swatch-wrapper {
            padding: 2px;
        }

        .color-custom__input::-webkit-color-swatch {
            border: none;
            border-radius: 4px;
        }

        .size-input-group {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .size-input {
            flex: 1;
            padding: var(--spacing-sm);
            background: var(--color-surface-elevated);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text);
            font-size: 0.875rem;
            text-align: center;
            transition: border-color var(--transition-fast);
        }

        .size-input:focus {
            border-color: var(--color-primary);
        }

        .size-input__separator {
            color: var(--color-text-muted);
            font-size: 0.875rem;
        }

        .range-slider {
            width: 100%;
            height: 6px;
            background: var(--color-surface-elevated);
            border-radius: 3px;
            appearance: none;
            cursor: pointer;
            margin: var(--spacing-md) 0 var(--spacing-xs);
        }

        .range-slider::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            background: var(--color-primary);
            border-radius: 50%;
            cursor: grab;
            transition: transform var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }

        .range-slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.6875rem;
            color: var(--color-text-subtle);
        }

        .stats-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .stats-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-sm) 0;
            border-bottom: 1px solid var(--color-border);
        }

        .stats-item:last-child {
            border-bottom: none;
        }

        .stats-item__label {
            font-size: 0.8125rem;
            color: var(--color-text-muted);
        }

        .stats-item__value {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-primary);
        }

        .stats-item__value--highlight {
            color: var(--color-accent);
        }

        .canvas-area {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .canvas-wrapper {
            flex: 1;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 500px;
            overflow: auto;
            position: relative;
        }

        .canvas-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.05), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.05), transparent 50%);
            pointer-events: none;
        }

        #canvas {
            border-radius: var(--radius-md);
            background: #1a1a2e;
            box-shadow: var(--shadow-lg);
            image-rendering: pixelated;
            cursor: crosshair;
            transition: transform var(--transition-base);
        }

        .canvas-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-surface-elevated);
            border-radius: var(--radius-md);
            color: var(--color-text);
            font-size: 1.125rem;
            transition: all var(--transition-fast);
        }

        .zoom-btn:hover {
            background: var(--color-surface-hover);
        }

        .zoom-display {
            background: var(--color-surface-elevated);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            font-weight: 600;
            color: var(--color-text);
            min-width: 70px;
            text-align: center;
            font-size: 0.875rem;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--color-surface-elevated);
            border-radius: var(--radius-md);
            color: var(--color-text);
            font-size: 0.8125rem;
            transition: all var(--transition-base);
            width: 100%;
            text-align: left;
        }

        .action-btn:hover {
            background: var(--color-surface-hover);
            transform: translateX(4px);
        }

        .action-btn__icon {
            font-size: 1.125rem;
        }

        .action-btn__text {
            flex: 1;
        }

        .action-btn__shortcut {
            font-size: 0.6875rem;
            color: var(--color-text-subtle);
            background: var(--color-surface);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--spacing-sm);
        }

        .template-card {
            aspect-ratio: 1;
            background: var(--color-surface-elevated);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xs);
            padding: var(--spacing-sm);
            color: var(--color-text-muted);
            font-size: 0.6875rem;
        }

        .template-card:hover {
            border-color: var(--color-primary);
            color: var(--color-text);
            transform: scale(1.02);
        }

        .template-card__icon {
            font-size: 1.5rem;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: var(--z-modal);
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-base);
            padding: var(--spacing-md);
        }

        .modal-overlay--visible {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            max-width: 480px;
            width: 100%;
            padding: var(--spacing-xl);
            transform: scale(0.95) translateY(10px);
            transition: transform var(--transition-base);
        }

        .modal-overlay--visible .modal {
            transform: scale(1) translateY(0);
        }

        .modal__icon {
            font-size: 3rem;
            margin-bottom: var(--spacing-md);
        }

        .modal__title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
        }

        .modal__content {
            color: var(--color-text-muted);
            font-size: 0.875rem;
            margin-bottom: var(--spacing-lg);
            line-height: 1.7;
        }

        .modal__actions {
            display: flex;
            gap: var(--spacing-sm);
            justify-content: flex-end;
        }

        .toast-container {
            position: fixed;
            bottom: var(--spacing-xl);
            right: var(--spacing-xl);
            z-index: var(--z-toast);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .toast {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--spacing-md) var(--spacing-lg);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: 0.875rem;
            transform: translateX(120%);
            opacity: 0;
            transition: all var(--transition-slow);
        }

        .toast--visible {
            transform: translateX(0);
            opacity: 1;
        }

        .toast--success {
            border-left: 3px solid var(--color-success);
        }

        .toast--error {
            border-left: 3px solid var(--color-error);
        }

        .toast--info {
            border-left: 3px solid var(--color-info);
        }

        .toast__icon {
            font-size: 1.25rem;
        }

        .shortcuts-hint {
            margin-top: var(--spacing-md);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--color-border);
        }

        .shortcuts-hint__title {
            font-size: 0.6875rem;
            text-transform: uppercase;
            color: var(--color-text-subtle);
            margin-bottom: var(--spacing-sm);
        }

        .shortcut-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--color-text-muted);
            padding: var(--spacing-xs) 0;
        }

        .shortcut-item__key {
            background: var(--color-surface-elevated);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        @media (max-width: 1280px) {
            .main {
                grid-template-columns: 280px 1fr;
            }
            .sidebar--right {
                display: none;
            }
        }

        @media (max-width: 1024px) {
            .main {
                grid-template-columns: 1fr;
                gap: var(--spacing-md);
            }
            .sidebar {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: var(--spacing-md);
            }
            .sidebar--left {
                order: 1;
            }
            .canvas-area {
                order: 2;
            }
            .panel--sticky {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: var(--spacing-sm) var(--spacing-md);
            }
            .header__container {
                flex-wrap: wrap;
            }
            .logo__text {
                display: none;
            }
            .header__actions {
                width: 100%;
                justify-content: flex-end;
                margin-top: var(--spacing-sm);
            }
            .main {
                padding: var(--spacing-md);
            }
            .sidebar {
                grid-template-columns: 1fr;
            }
            .canvas-wrapper {
                min-height: 350px;
                padding: var(--spacing-md);
            }
        }

        @media (max-width: 480px) {
            .btn {
                padding: 0.5rem 0.875rem;
                font-size: 0.8125rem;
            }
            .tool-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .color-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header__container">
                <a href="#" class="logo" aria-label="拼豆图纸生成器">
                    <div class="logo__icon" aria-hidden="true">🧩</div>
                    <span class="logo__text">拼豆图纸生成器</span>
                </a>
                <div class="header__actions">
                    <button class="btn btn--secondary" onclick="showTemplates()" aria-label="查看模板">
                        <span>📚</span> 模板
                    </button>
                    <button class="btn btn--ghost" onclick="clearCanvas()" aria-label="清空画布">
                        <span>🗑️</span> 清空
                    </button>
                    <button class="btn btn--secondary" onclick="saveAsImage()" aria-label="保存图片">
                        <span>📷</span> 保存
                    </button>
                    <button class="btn btn--primary" onclick="downloadTemplate()" aria-label="下载图纸">
                        <span>⬇️</span> 下载图纸
                    </button>
                </div>
            </div>
        </header>

        <main class="main">
            <aside class="sidebar sidebar--left">
                <section class="panel" aria-labelledby="tools-title">
                    <div class="panel__header">
                        <h2 class="panel__title" id="tools-title">工具</h2>
                    </div>
                    <div class="tool-grid" role="toolbar" aria-label="绘图工具">
                        <button class="tool-btn tool-btn--active" id="tool-pen" onclick="setTool('pen')" title="画笔 (P)" aria-pressed="true">
                            <span class="tool-btn__icon">✏️</span>
                            <span class="tool-btn__label">画笔</span>
                        </button>
                        <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')" title="橡皮擦 (E)" aria-pressed="false">
                            <span class="tool-btn__icon">🧹</span>
                            <span class="tool-btn__label">橡皮</span>
                        </button>
                        <button class="tool-btn" id="tool-fill" onclick="setTool('fill')" title="填充 (F)" aria-pressed="false">
                            <span class="tool-btn__icon">🎨</span>
                            <span class="tool-btn__label">填充</span>
                        </button>
                        <button class="tool-btn" id="tool-select" onclick="setTool('select')" title="取色器 (I)" aria-pressed="false">
                            <span class="tool-btn__icon">💉</span>
                            <span class="tool-btn__label">取色</span>
                        </button>
                        <button class="tool-btn" onclick="undo()" title="撤销 (Ctrl+Z)" aria-label="撤销上一步">
                            <span class="tool-btn__icon">↩️</span>
                            <span class="tool-btn__label">撤销</span>
                        </button>
                        <button class="tool-btn" onclick="redo()" title="重做 (Ctrl+Y)" aria-label="重做">
                            <span class="tool-btn__icon">↪️</span>
                            <span class="tool-btn__label">重做</span>
                        </button>
                        <button class="tool-btn" onclick="mirrorCanvas()" title="水平镜像 (M)" aria-label="水平镜像">
                            <span class="tool-btn__icon">🔄</span>
                            <span class="tool-btn__label">镜像</span>
                        </button>
                        <button class="tool-btn" onclick="rotateCanvas()" title="旋转90° (R)" aria-label="旋转画布">
                            <span class="tool-btn__icon">🔃</span>
                            <span class="tool-btn__label">旋转</span>
                        </button>

    <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal__icon" id="modal-icon">⚠️</div>
            <h2 class="modal__title" id="modal-title">确认操作</h2>
            <p class="modal__content" id="modal-content">确定要继续吗？</p>
            <div class="modal__actions">
                <button class="btn btn--ghost" onclick="closeModal()">取消</button>
                <button class="btn btn--primary" id="modal-confirm" onclick="confirmModal()">确定</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <script>
        const state = {
            gridWidth: 24,
            gridHeight: 24,
            gridSize: 20,
            currentTool: 'pen',
            currentColor: '#FF0000',
            isDrawing: false,
            zoom: 1,
            showGrid: true,
            history: [],
            historyIndex: -1,
            pixels: [],
            lastPixel: null
        };

        let canvas, ctx;
        let modalCallback = null;

        const BEAD_COLORS = [
            '#FFFFFF', '#FF0000', '#FF6B00', '#FFD700', '#FFFF00', '#00FF00', '#00FFFF',
            '#0000FF', '#8B00FF', '#FF00FF', '#FFC0CB', '#FFA500', '#808080', '#000000',
            '#A52A2A', '#800000', '#FF4500', '#FF8C00', '#BDB76B', '#228B22', '#008000',
            '#006400', '#40E0D0', '#20B2AA', '#00CED1', '#5F9EA0', '#000080', '#4169E1',
            '#6495ED', '#87CEEB', '#9370DB', '#8A2BE2', '#4B0082', '#DDA0DD', '#EE82EE',
            '#DA70D6', '#FF69B4', '#FF1493', '#C71585', '#DC143C', '#B22222', '#CD5C5C',
            '#F0E68C', '#DAA520', '#B8860B', '#8B4513', '#A0522D', '#D2691E', '#2F4F4F'
        ];

        const TEMPLATES = {
            heart: [
                '0000011111000000', '0001111111110000', '0011111111111000', '0111111111111100',
                '0111111111111110', '1111111111111111', '1111111111111111', '1111111111111111',
                '0111111111111110', '0011111111111100', '0001111111111000', '0000111111110000',
                '0000011111000000', '0000001110000000', '0000000100000000', '0000000000000000'
            ],
            star: [
                '0000001000000000', '0000011100000000', '0000111110000000', '0011111111000000',
                '0111111111100000', '1111111111110000', '1111111111111000', '0111111111111100',
                '0011111111111110', '0001111111111111', '0000111111111100', '0000011111111000',
                '0000001111110000', '0000000111000000', '0000000000000000', '0000000000000000'
            ],
            smile: [
                '0001111100000000', '0010000010000000', '0111111111000000', '0100000001000000',
                '0101100110010000', '0100000001000000', '0111111111000000', '0010000010000000',
                '0001111100000000', '0000000000000000', '0000000000000000', '0000000000000000',
                '0000000000000000', '0000000000000000', '0000000000000000', '0000000000000000'
            ],
            flower: [
                '0000010000000000', '0000111100000000', '0001111110000000', '0011111111000000',
                '0111111111100000', '1111111111110000', '1101111011010000', '1110111011100000',
                '1101111011010000', '1111111111110000', '0111111111100000', '0011111111000000',
                '0001111110000000', '0000111100000000', '0000010000000000', '0000001000000000'
            ]
        };

        function init() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            renderColorGrid();
            loadFromStorage();
            setupEventListeners();
            updateStats();
            if (state.pixels.length === 0) {
                state.pixels = new Array(state.gridWidth * state.gridHeight).fill('transparent');
            }
            updateCanvasSize();
            drawCanvas();
        }

        function renderColorGrid() {
            const grid = document.getElementById('color-grid');
            grid.innerHTML = '';
            BEAD_COLORS.forEach((color) => {
                const btn = document.createElement('button');
                btn.className = 'color-btn';
                btn.style.backgroundColor = color;
                btn.onclick = () => selectColor(color);
                btn.setAttribute('role', 'option');
                btn.setAttribute('aria-label', `选择颜色 ${color}`);
                if (color === state.currentColor) {
                    btn.classList.add('color-btn--active');
                    btn.setAttribute('aria-selected', 'true');
                }
                grid.appendChild(btn);
            });
        }

        function selectColor(color) {
            state.currentColor = color;
            document.getElementById('color-picker').value = color;
            document.querySelectorAll('.color-btn').forEach(btn => {
                const isActive = rgbToHex(btn.style.backgroundColor).toUpperCase() === color.toUpperCase();
                btn.classList.toggle('color-btn--active', isActive);
                btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
            });
            document.getElementById('color-count').textContent = color.toUpperCase();
            setTool('pen');
        }

        function selectCustomColor(color) {
            selectColor(color);
        }

        function rgbToHex(rgb) {
            if (rgb.startsWith('#')) return rgb;
            const match = rgb.match(/\d+/g);
            if (!match) return rgb;
            return '#' + match.slice(0, 3).map(x => parseInt(x).toString(16).padStart(2, '0')).join('');
        }

        function setupEventListeners() {
            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);
            canvas.addEventListener('mouseleave', handleMouseUp);
            canvas.addEventListener('contextmenu', handleContextMenu);
            canvas.addEventListener('wheel', handleWheel);
            canvas.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keydown', handleGlobalKeyDown);
        }

        function handleMouseDown(e) {
            if (e.button === 2) return;
            state.isDrawing = true;
            const pixel = getPixelFromEvent(e);
            if (pixel) {
                state.lastPixel = pixel;
                applyTool(pixel);
            }
        }

        function handleMouseMove(e) {
            if (!state.isDrawing) return;
            const pixel = getPixelFromEvent(e);
            if (pixel) {
                if (state.currentTool === 'pen' || state.currentTool === 'eraser') {
                    if (e.shiftKey && state.lastPixel) {
                        drawLine(state.lastPixel, pixel, state.currentTool === 'eraser' ? 'transparent' : state.currentColor);
                    } else {
                        applyTool(pixel);
                    }
                }
                state.lastPixel = pixel;
            }
        }

        function handleMouseUp() {
            if (state.isDrawing) {
                state.isDrawing = false;
                state.lastPixel = null;
                saveHistory();
            }
        }

        function handleContextMenu(e) {
            e.preventDefault();
            setTool('eraser');
        }

        function handleWheel(e) {
            e.preventDefault();
            if (e.deltaY < 0) zoomIn();
            else zoomOut();
        }

        function handleKeyDown(e) {
            if (e.key === ' ') e.preventDefault();
        }

        function handleGlobalKeyDown(e) {
            if (e.target.tagName === 'INPUT') return;
            const key = e.key.toLowerCase();
            if (e.ctrlKey && key === 'z') { e.preventDefault(); undo(); }
            else if (e.ctrlKey && key === 'y') { e.preventDefault(); redo(); }
            else if (e.ctrlKey && key === 's') { e.preventDefault(); saveAsImage(); }
            else if (key === 'p') setTool('pen');
            else if (key === 'e') setTool('eraser');
            else if (key === 'f') { if (e.shiftKey) fillAll(); else setTool('fill'); }
            else if (key === 'i') setTool('select');
            else if (key === 'm') mirrorCanvas();
            else if (key === 'r') rotateCanvas();
            else if (key === 'g') toggleGrid();
        }

        function setTool(tool) {
            state.currentTool = tool;
            document.querySelectorAll('.tool-btn[id^="tool-"]').forEach(btn => {
                const isActive = btn.id === `tool-${tool}`;
                btn.classList.toggle('tool-btn--active', isActive);
                btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
            });
            canvas.style.cursor = 'crosshair';
        }

        function applyTool(pixel) {
            const { x, y, index } = pixel;
            if (state.currentTool === 'pen') state.pixels[index] = state.currentColor;
            else if (state.currentTool === 'eraser') state.pixels[index] = 'transparent';
            else if (state.currentTool === 'fill') {
                const targetColor = state.pixels[index];
                if (targetColor !== state.currentColor) floodFill(x, y, targetColor, state.currentColor);
            } else if (state.currentTool === 'select') {
                const pickedColor = state.pixels[index];
                if (pickedColor && pickedColor !== 'transparent') selectColor(pickedColor);
            }
            drawCanvas();
            updateStats();
        }

        function drawLine(start, end, color) {
            const dx = Math.abs(end.x - start.x);
            const dy = Math.abs(end.y - start.y);
            const sx = start.x < end.x ? 1 : -1;
            const sy = start.y < end.y ? 1 : -1;
            let err = dx - dy;
            let x = start.x, y = start.y;
            while (true) {
                if (x >= 0 && x < state.gridWidth && y >= 0 && y < state.gridHeight) {
                    state.pixels[y * state.gridWidth + x] = color;
                }
                if (x === end.x && y === end.y) break;
                const e2 = 2 * err;
                if (e2 > -dy) { err -= dy; x += sx; }
                if (e2 < dx) { err += dx; y += sy; }
            }
        }

        function floodFill(startX, startY, targetColor, fillColor) {
            const stack = [[startX, startY]];
            const visited = new Set();
            while (stack.length > 0) {
                const [x, y] = stack.pop();
                const key = `${x},${y}`;
                if (visited.has(key)) continue;
                if (x < 0 || x >= state.gridWidth || y < 0 || y >= state.gridHeight) continue;
                const index = y * state.gridWidth + x;
                if (state.pixels[index] !== targetColor) continue;
                visited.add(key);
                state.pixels[index] = fillColor;
                stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
            }
        }

        function getPixelFromEvent(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX / state.gridSize);
            const y = Math.floor((e.clientY - rect.top) * scaleY / state.gridSize);
            if (x >= 0 && x < state.gridWidth && y >= 0 && y < state.gridHeight) {
                return { x, y, index: y * state.gridWidth + x };
            }
            return null;
        }

        function updateCanvasSize() {
            canvas.width = state.gridWidth * state.gridSize;
            canvas.height = state.gridHeight * state.gridSize;
            canvas.style.transform = `scale(${state.zoom})`;
            document.getElementById('zoom-display').textContent = `${Math.round(state.zoom * 100)}%`;
        }

        function drawCanvas() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (state.showGrid) {
                ctx.strokeStyle = 'rgba(51, 65, 85, 0.5)';
                ctx.lineWidth = 0.5;
                for (let x = 0; x <= state.gridWidth; x++) {
                    ctx.beginPath();
                    ctx.moveTo(x * state.gridSize, 0);
                    ctx.lineTo(x * state.gridSize, canvas.height);
                    ctx.stroke();
                }
                for (let y = 0; y <= state.gridHeight; y++) {
                    ctx.beginPath();
                    ctx.moveTo(0, y * state.gridSize);
                    ctx.lineTo(canvas.width, y * state.gridSize);
                    ctx.stroke();
                }
            }
            for (let y = 0; y < state.gridHeight; y++) {
                for (let x = 0; x < state.gridWidth; x++) {
                    const color = state.pixels[y * state.gridWidth + x];
                    if (color && color !== 'transparent') drawBead(x, y, color);
                }
            }
        }

        function drawBead(x, y, color) {
            const centerX = x * state.gridSize + state.gridSize / 2;
            const centerY = y * state.gridSize + state.gridSize / 2;
            const radius = state.gridSize / 2 - 1;
            const gradient = ctx.createRadialGradient(
                centerX - radius * 0.3, centerY - radius * 0.3, radius * 0.1, centerX, centerY, radius
            );
            gradient.addColorStop(0, lightenColor(color, 40));
            gradient.addColorStop(0.5, color);
            gradient.addColorStop(1, darkenColor(color, 30));
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(centerX - radius * 0.2, centerY - radius * 0.2, radius * 0.25, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(centerX + radius * 0.15, centerY + radius * 0.15, radius * 0.15, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fill();
        }

        function lightenColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, (num >> 16) + amt);
            const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
            const B = Math.min(255, (num & 0x0000FF) + amt);
            return `#${(0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1)}`;
        }

        function darkenColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, (num >> 16) - amt);
            const G = Math.max(0, ((num >> 8) & 0x00FF) - amt);
            const B = Math.max(0, (num & 0x0000FF) - amt);
            return `#${(0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1)}`;
        }

        function saveHistory() {
            const pixelsString = JSON.stringify(state.pixels);
            if (state.historyIndex >= 0 && state.history[state.historyIndex] === pixelsString) return;
            state.history = state.history.slice(0, state.historyIndex + 1);
            state.history.push(pixelsString);
            if (state.history.length > 50) state.history.shift();
            else state.historyIndex++;
            saveToStorage();
        }

        function undo() {
            if (state.historyIndex > 0) {
                state.historyIndex--;
                state.pixels = JSON.parse(state.history[state.historyIndex]);
                drawCanvas();
                updateStats();
                saveToStorage();
                showToast('已撤销', 'info');
            }
        }

        function redo() {
            if (state.historyIndex < state.history.length - 1) {
                state.historyIndex++;
                state.pixels = JSON.parse(state.history[state.historyIndex]);
                drawCanvas();
                updateStats();
                saveToStorage();
                showToast('已重做', 'info');
            }
        }

        function mirrorCanvas() {
            const newPixels = [...state.pixels];
            for (let y = 0; y < state.gridHeight; y++) {
                for (let x = 0; x < state.gridWidth; x++) {
                    const originalIndex = y * state.gridWidth + x;
                    const mirroredIndex = y * state.gridWidth + (state.gridWidth - 1 - x);
                    newPixels[originalIndex] = state.pixels[mirroredIndex];
                }
            }
            state.pixels = newPixels;
            drawCanvas();
            updateStats();
            saveHistory();
            showToast('已水平镜像', 'success');
        }

        function rotateCanvas() {
            const newPixels = new Array(state.gridWidth * state.gridHeight).fill('transparent');
            for (let y = 0; y < state.gridHeight; y++) {
                for (let x = 0; x < state.gridWidth; x++) {
                    const originalIndex = y * state.gridWidth + x;
                    const rotatedIndex = x * state.gridHeight + (state.gridHeight - 1 - y);
                    newPixels[rotatedIndex] = state.pixels[originalIndex];
                }
            }
            [state.gridWidth, state.gridHeight] = [state.gridHeight, state.gridWidth];
            state.pixels = newPixels;
            document.getElementById('width-input').value = state.gridWidth;
            document.getElementById('height-input').value = state.gridHeight;
            updateCanvasSize();
            drawCanvas();
            updateStats();
            saveHistory();
            showToast('已顺时针旋转90°', 'success');
        }

        function toggleGrid() {
            state.showGrid = !state.showGrid;
            document.getElementById('grid-toggle').classList.toggle('tool-btn--active', state.showGrid);
            drawCanvas();
        }

        function resizeCanvas() {
            const newWidth = parseInt(document.getElementById('width-input').value);
            const newHeight = parseInt(document.getElementById('height-input').value);
            if (newWidth === state.gridWidth && newHeight === state.gridHeight) return;
            showModal(
                '⚠️', '确认调整画布',
                `确定要将画布从 ${state.gridWidth}×${state.gridHeight} 调整为 ${newWidth}×${newHeight} 吗？这将清空当前画布。`,
                () => {
                    state.gridWidth = newWidth;
                    state.gridHeight = newHeight;
                    state.pixels = new Array(state.gridWidth * state.gridHeight).fill('transparent');
                    state.history = [];
                    state.historyIndex = -1;
                    updateCanvasSize();
                    drawCanvas();
                    updateStats();
                    saveHistory();
                    showToast('画布已调整', 'success');
                }
            );
        }

        function setGridSize(size) {
            state.gridSize = parseInt(size);
            updateCanvasSize();
            drawCanvas();
            saveToStorage();
        }

        function fillAll() {
            showModal('🪣', '填充全部', '确定要使用当前颜色填充整个画布吗？',
                () => {
                    state.pixels = new Array(state.gridWidth * state.gridHeight).fill(state.currentColor);
                    drawCanvas();
                    updateStats();
                    saveHistory();
                    showToast('画布已填充', 'success');
                }
            );
        }

        function clearAll() {
            showModal('🗑️', '清空全部', '确定要清空整个画布吗？此操作无法撤销。',
                () => {
                    state.pixels = new Array(state.gridWidth * state.gridHeight).fill('transparent');
                    state.history = [];
                    state.historyIndex = -1;
                    drawCanvas();
                    updateStats();
                    saveToStorage();
                    showToast('画布已清空', 'success');
                }
            );
        }

        function invertColors() {
            const newPixels = state.pixels.map(color => {
                if (!color || color === 'transparent') return 'transparent';
                const r = 255 - parseInt(color.slice(1, 3), 16);
                const g = 255 - parseInt(color.slice(3, 5), 16);
                const b = 255 - parseInt(color.slice(5, 7), 16);
                return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
            });
            state.pixels = newPixels;
            drawCanvas();
            updateStats();
            saveHistory();
            showToast('颜色已反转', 'success');
        }

        function showColorList() {
            const colors = new Map();
            state.pixels.forEach(color => {
                if (color && color !== 'transparent') colors.set(color, (colors.get(color) || 0) + 1);
            });
            if (colors.size === 0) { showToast('画布为空', 'error'); return; }
            let listText = colors.size + ' 种颜色：\n';
            colors.forEach((count, color) => { listText += `${color.toUpperCase()} × ${count}\n`; });
            alert(listText);
        }

        function loadTemplate(name) {
            const template = TEMPLATES[name];
            if (!template) return;
            showModal('📚', '加载模板', `确定要加载 "${getTemplateName(name)}" 模板吗？这将替换当前画布内容。`,
                () => {
                    state.pixels = new Array(state.gridWidth * state.gridHeight).fill('transparent');
                    const offsetX = Math.floor((state.gridWidth - 16) / 2);
                    const offsetY = Math.floor((state.gridHeight - 16) / 2);
                    for (let y = 0; y < 16 && y + offsetY < state.gridHeight; y++) {
                        for (let x = 0; x < 16 && x + offsetX < state.gridWidth; x++) {
                            if (template[y][x] === '1') {
                                state.pixels[(y + offsetY) * state.gridWidth + (x + offsetX)] = '#FF0000';
                            }
                        }
                    }
                    drawCanvas();
                    updateStats();
                    saveHistory();
                    showToast(`已加载 "${getTemplateName(name)}" 模板`, 'success');
                }
            );
        }

        function getTemplateName(name) {
            const names = { heart: '爱心', star: '星星', smile: '笑脸', flower: '花朵' };
            return names[name] || name;
        }

        function showTemplates() {
            document.querySelector('.template-grid').parentElement.scrollIntoView({ behavior: 'smooth' });
        }

        function updateStats() {
            const colors = new Set(state.pixels.filter(p => p && p !== 'transparent'));
            const beadCount = state.pixels.filter(p => p && p !== 'transparent').length;
            const progress = ((beadCount / (state.gridWidth * state.gridHeight)) * 100).toFixed(1);
            document.getElementById('stats-size').textContent = `${state.gridWidth} × ${state.gridHeight}`;
            document.getElementById('stats-colors').textContent = colors.size;
            document.getElementById('stats-beads').textContent = beadCount;
            document.getElementById('stats-progress').textContent = `${progress}%`;
        }

        function zoomIn() {
            if (state.zoom < 3) { state.zoom = Math.min(3, state.zoom + 0.25); updateCanvasSize(); }
        }

        function zoomOut() {
            if (state.zoom > 0.25) { state.zoom = Math.max(0.25, state.zoom - 0.25); updateCanvasSize(); }
        }

        function resetZoom() { state.zoom = 1; updateCanvasSize(); }

        function fitToView() {
            const wrapper = document.querySelector('.canvas-wrapper');
            const maxWidth = wrapper.clientWidth - 48;
            const maxHeight = wrapper.clientHeight - 48;
            const fitZoomW = maxWidth / (state.gridWidth * state.gridSize);
            const fitZoomH = maxHeight / (state.gridHeight * state.gridSize);
            state.zoom = Math.min(1, fitZoomW, fitZoomH);
            updateCanvasSize();
        }

        function clearCanvas() {
            showModal('🗑️', '清空画布', '确定要清空当前画布吗？',
                () => {
                    state.pixels = new Array(state.gridWidth * state.gridHeight).fill('transparent');
                    drawCanvas();
                    updateStats();
                    saveHistory();
                    showToast('画布已清空', 'success');
                }
            );
        }

        function saveAsImage() {
            const link = document.createElement('a');
            link.download = `bead-design-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('图片已保存', 'success');
        }

        function downloadTemplate() {
            const templateCanvas = document.createElement('canvas');
            templateCanvas.width = state.gridWidth * state.gridSize + 120;
            templateCanvas.height = state.gridHeight * state.gridSize + 180;
            const tCtx = templateCanvas.getContext('2d');
            tCtx.fillStyle = '#FFFFFF';
            tCtx.fillRect(0, 0, templateCanvas.width, templateCanvas.height);
            tCtx.fillStyle = '#1a1a2e';
            tCtx.fillRect(60, 80, state.gridWidth * state.gridSize, state.gridHeight * state.gridSize);
            tCtx.strokeStyle = '#334155';
            tCtx.lineWidth = 0.5;
            for (let x = 0; x <= state.gridWidth; x++) {
                tCtx.beginPath();
                tCtx.moveTo(60 + x * state.gridSize, 80);
                tCtx.lineTo(60 + x * state.gridSize, 80 + state.gridHeight * state.gridSize);
                tCtx.stroke();
            }
            for (let y = 0; y <= state.gridHeight; y++) {
                tCtx.beginPath();
                tCtx.moveTo(60, 80 + y * state.gridSize);
                tCtx.lineTo(60 + state.gridWidth * state.gridSize, 80 + y * state.gridSize);
                tCtx.stroke();
            }
            for (let y = 0; y < state.gridHeight; y++) {
                for (let x = 0; x < state.gridWidth; x++) {
                    const color = state.pixels[y * state.gridWidth + x];
                    if (color && color !== 'transparent') {
                        const centerX = 60 + x * state.gridSize + state.gridSize / 2;
                        const centerY = 80 + y * state.gridSize + state.gridSize / 2;
                        const radius = state.gridSize / 2 - 1;
                        tCtx.beginPath();
                        tCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                        tCtx.fillStyle = color;
                        tCtx.fill();
                    }
                }
            }
            tCtx.fillStyle = '#000000';
            tCtx.font = 'bold 24px Inter, sans-serif';
            tCtx.textAlign = 'center';
            tCtx.fillText('拼豆图纸', templateCanvas.width / 2, 40);
            tCtx.font = '14px Inter, sans-serif';
            tCtx.fillStyle = '#666666';
            tCtx.fillText(`尺寸: ${state.gridWidth} × ${state.gridHeight}`, templateCanvas.width / 2, 65);
            const colors = new Map();
            state.pixels.forEach(color => {
                if (color && color !== 'transparent') colors.set(color, (colors.get(color) || 0) + 1);
            });
            let legendY = 80 + state.gridHeight * state.gridSize + 20;
            tCtx.font = 'bold 14px Inter, sans-serif';
            tCtx.fillStyle = '#333333';
            tCtx.textAlign = 'left';
            tCtx.fillText('颜色清单:', 50, legendY);
            let legendX = 50, rowY = legendY + 25;
            colors.forEach((beadCount, color) => {
                if (legendX > templateCanvas.width - 120) { legendX = 50; rowY += 25; }
                tCtx.beginPath();
                tCtx.arc(legendX + 8, rowY - 5, 6, 0, Math.PI * 2);
                tCtx.fillStyle = color;
                tCtx.fill();
                tCtx.font = '12px Inter, sans-serif';
                tCtx.fillStyle = '#333333';
                tCtx.fillText(`${color} × ${beadCount}`, legendX + 20, rowY);
                legendX += 110;
            });
            const link = document.createElement('a');
            link.download = `bead-template-${Date.now()}.png`;
            link.href = templateCanvas.toDataURL('image/png');
            link.click();
            showToast('图纸已下载', 'success');
        }

        function showModal(icon, title, content, callback) {
            document.getElementById('modal-icon').textContent = icon;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-content').textContent = content;
            modalCallback = callback;
            document.getElementById('modal-overlay').classList.add('modal-overlay--visible');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('modal-overlay--visible');
            modalCallback = null;
        }

        function confirmModal() {
            if (modalCallback) modalCallback();
            closeModal();
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast--${type}`;
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            toast.innerHTML = `<span class="toast__icon">${icons[type] || 'ℹ️'}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('toast--visible'), 10);
            setTimeout(() => {
                toast.classList.remove('toast--visible');
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        function saveToStorage() {
            localStorage.setItem('bead-canvas', JSON.stringify({
                width: state.gridWidth,
                height: state.gridHeight,
                gridSize: state.gridSize,
                pixels: state.pixels,
                history: state.history,
                historyIndex: state.historyIndex
            }));
        }

        function loadFromStorage() {
            const saved = localStorage.getItem('bead-canvas');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    state.gridWidth = data.width || 24;
                    state.gridHeight = data.height || 24;
                    state.gridSize = data.gridSize || 20;
                    state.pixels = data.pixels || [];
                    state.history = data.history || [];
                    state.historyIndex = data.historyIndex ?? -1;
                    document.getElementById('width-input').value = state.gridWidth;
                    document.getElementById('height-input').value = state.gridHeight;
                    document.getElementById('grid-size-slider').value = state.gridSize;
                } catch (e) { console.error('Failed to load:', e); }
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
