<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>孕知小窗</title>
    <style>
        :root {
            --bg-primary: #fdfaf7;
            --bg-card: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --accent: #4a8c7d;
            --border: #e8f0ed;
            --shadow: 0 2px 12px rgba(74, 140, 125, 0.08);
            --radius: 12px;
            --transition: all 0.25s ease;
        }

        .dark-mode {
            --bg-primary: #1a1f1a;
            --bg-card: #252d25;
            --text-primary: #f5f5f5;
            --text-secondary: #a8b9ab;
            --accent: #7dbca5;
            --border: #3a4a3a;
            --shadow: 0 2px 12px rgba(125, 188, 165, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 16px;
            transition: var(--transition);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 24px 0;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--bg-card);
            color: var(--accent);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .main-section {
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 28px;
        }

        .input-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .query-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background-color: var(--bg-card);
            color: var(--text-primary);
            transition: var(--transition);
        }

        .query-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(74, 140, 125, 0.15);
        }

        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 16px;
        }

        .quick-btn {
            padding: 10px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.88rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            white-space: normal;
            line-height: 1.4;
        }

        .quick-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .answer-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-top: 24px;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .answer-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent);
            font-size: 1.1rem;
        }

        .answer-text {
            margin-bottom: 16px;
            font-size: 1.02rem;
            line-height: 1.7;
        }

        .answer-source {
            padding-top: 12px;
            border-top: 1px dashed var(--border);
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .source-label {
            font-weight: 600;
            color: var(--accent);
        }

        .source-date {
            margin-left: 6px;
        }

        footer {
            text-align: center;
            padding: 24px 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 24px;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .logo {
                font-size: 1.5rem;
            }
            .quick-buttons {
                grid-template-columns: 1fr;
            }
            .theme-toggle {
                position: fixed;
                top: 16px;
                right: 16px;
                z-index: 100;
            }
            body {
                padding: 12px;
            }
        }

        @media (max-width: 420px) {
            .query-input {
                padding: 12px 14px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色模式">☀️</button>

    <div class="container">
        <header>
            <div class="logo">孕知小窗</div>
            <p class="subtitle">一句提问，三句话权威解答｜来源可查，安心备孕</p>
        </header>

        <section class="main-section">
            <div class="input-group">
                <label class="input-label" for="queryInput">直接输入您的问题：</label>
                <input type="text" id="queryInput" class="query-input" placeholder="例如：“老公抽烟，我还能开始备孕吗？”" autocomplete="off">
            </div>

            <div class="quick-buttons">
                <button class="quick-btn" data-query="排卵期怎么算？">排卵期怎么算？</button>
                <button class="quick-btn" data-query="叶酸吃多久？">叶酸吃多久？</button>
                <button class="quick-btn" data-query="基础体温怎么测？">基础体温怎么测？</button>
                <button class="quick-btn" data-query="促排卵试纸早上测还是晚上测？">试纸早上测还是晚上测？</button>
                <button class="quick-btn" data-query="AMH值偏低怎么办？">AMH值偏低怎么办？</button>
                <button class="quick-btn" data-query="感冒能同房吗？">感冒能同房吗？</button>
            </div>

            <div id="answerCard" class="answer-card">
                <div class="answer-title" id="answerTitle"></div>
                <div class="answer-text" id="answerText"></div>
                <div class="answer-source">
                    <span class="source-label" id="sourceLabel"></span>
                    <span class="source-date" id="sourceDate"></span>
                </div>
            </div>
        </section>

        <footer>
            <p>本工具基于国家卫健委《孕前优生健康教育指南》及协和、北医三院等三甲医院公开科普内容整理，所有回答均标注出处与更新时间。</p>
        </footer>
    </div>

    <script>
        // 主题切换
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        if (localStorage.getItem('darkMode') === 'true') {
            body.classList.add('dark-mode');
            themeToggle.innerHTML = '🌙';
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('darkMode', 'true');
                themeToggle.innerHTML = '🌙';
            } else {
                localStorage.setItem('darkMode', 'false');
                themeToggle.innerHTML = '☀️';
            }
        });

        // 预设问答库（6条高频真实问题）
        const qaMap = {
            "排卵期怎么算？": {
                title: "排卵期计算方法",
                answer: "一般在下次月经来潮前14天左右（以28天周期为例，即月经第14天）。建议结合基础体温上升、宫颈粘液拉丝、排卵试纸检测综合判断，连续监测3个月更准确。",
                source: "国家卫生健康委员会《孕前优生健康教育指南》（2023年修订版）"
            },
            "叶酸吃多久？": {
                title: "叶酸补充时间",
                answer: "建议从孕前3个月开始每日补充0.4mg叶酸，持续至怀孕后满3个月。有神经管缺陷生育史者需遵医嘱加大剂量。",
                source: "中国疾病预防控制中心妇幼保健中心《孕前优生健康教育手册》"
            },
            "基础体温怎么测？": {
                title: "基础体温测量要点",
                answer: "每晚10点前睡足4小时以上，晨起未睁眼、未起床、未说话前用专用体温计测舌下温度，固定时间记录。连续测量3个月经周期，低温相（约36.2–36.5℃）为卵泡期，高温相（升0.3–0.5℃）为黄体期。",
                source: "北京协和医院妇产科《备孕家庭健康指导》（2022年公开版）"
            },
            "促排卵试纸早上测还是晚上测？": {
                title: "排卵试纸最佳检测时间",
                answer: "建议下午2–8点检测，避开晨尿（LH浓度易被稀释）。检测前2小时减少饮水，连续每天同一时段测试，强阳性后24–48小时为排卵高峰。",
                source: "北京大学第三医院生殖医学中心《促排卵监测患者须知》"
            },
            "AMH值偏低怎么办？": {
                title: "AMH偏低的意义与应对",
                answer: "AMH反映卵巢储备，偏低提示卵子数量减少，但不影响卵子质量。无需特殊治疗，重点是规律作息、均衡营养、避免熬夜吸烟，并在医生指导下合理规划受孕时间。",
                source: "中华医学会妇产科学分会《卵巢功能评估临床指南》（2021年）"
            },
            "感冒能同房吗？": {
                title: "感冒期间备孕建议",
                answer: "普通感冒（无发热）可正常同房；若伴低热或服用抗生素/抗病毒药，建议暂停1–2周。男方感冒期间精子质量可能短期下降，双方恢复后再尝试更稳妥。",
                source: "复旦大学附属妇产科医院《孕前常见问题百问百答》"
            }
        };

        // 快捷按钮点击事件
        document.querySelectorAll('.quick-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const query = btn.getAttribute('data-query');
                document.getElementById('queryInput').value = query;
                showAnswer(query);
            });
        });

        // 回车提交
        const input = document.getElementById('queryInput');
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = input.value.trim();
                if (query) showAnswer(query);
            }
        });

        // 显示答案
        function showAnswer(query) {
            const card = document.getElementById('answerCard');
            const titleEl = document.getElementById('answerTitle');
            const textEl = document.getElementById('answerText');
            const sourceLabelEl = document.getElementById('sourceLabel');
            const sourceDateEl = document.getElementById('sourceDate');

            // 匹配最接近的问题（模糊匹配关键词）
            let matched = null;
            for (const key in qaMap) {
                if (query.includes(key) || key.includes(query) || 
                    query.toLowerCase().includes(key.toLowerCase()) ||
                    key.toLowerCase().includes(query.toLowerCase())) {
                    matched = qaMap[key];
                    break;
                }
            }

            // 若无精确匹配，返回默认引导语
            if (!matched) {
                titleEl.textContent = "温馨提示";
                textEl.textContent = "当前仅支持以下6类高频问题的快速解答。您也可输入类似表述（如“试纸什么时候测”“叶酸吃到什么时候”），我们会尽力匹配。";
                sourceLabelEl.textContent = "孕知小窗 · 备孕科普快答";
                sourceDateEl.textContent = "2024年更新";
                card.style.display = 'block';
                return;
            }

            titleEl.textContent = matched.title;
            textEl.textContent = matched.answer;
            sourceLabelEl.textContent = matched.source;
            sourceDateEl.textContent = "";

            card.style.display = 'block';
        }

        // 初始化：聚焦输入框
        window.addEventListener('DOMContentLoaded', () => {
            input.focus();
        });
    </script>
</body>
</html>
