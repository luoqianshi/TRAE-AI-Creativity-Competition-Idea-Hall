<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今日抽烟</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --primary: #00b4b4;
            --primary-dark: #008b8b;
            --primary-light: #4dd0d0;
            --accent: #ff6b8a;
            --accent2: #ff8a65;
            --accent3: #4db6ac;
            --accent4: #7986cb;
            --bg: #0a0a0f;
            --bg-card: #12121a;
            --bg-card-hover: #1a1a28;
            --surface: #161620;
            --surface-light: #1e1e2e;
            --text: #e8e8f0;
            --text-secondary: #8a8a9a;
            --text-muted: #5a5a6a;
            --border: #252535;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
            --radius-sm: 8px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        [data-theme="light"] {
            --bg: #f0f2f5;
            --bg-card: #ffffff;
            --bg-card-hover: #f5f7fa;
            --surface: #ffffff;
            --surface-light: #f5f7fa;
            --text: #1a1a2e;
            --text-secondary: #6b6b7b;
            --text-muted: #9a9aaa;
            --border: #e0e0e8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100%;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 430px;
            margin: 0 auto;
            position: relative;
            background: var(--bg);
        }

        /* ===== Status Bar ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px 4px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            z-index: 100;
        }

        .status-bar .time {
            font-variant-numeric: tabular-nums;
        }

        .status-icons {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .status-icons svg {
            width: 16px;
            height: 16px;
            fill: var(--text);
        }

        /* ===== Header ===== */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px 12px;
            z-index: 100;
        }

        .page-header .back-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--surface-light);
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-header .back-btn:hover {
            background: var(--border);
        }

        .page-header .back-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--text);
        }

        .page-header h1 {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
        }

        .page-header .header-actions {
            display: flex;
            gap: 8px;
        }

        .page-header .header-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--surface-light);
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-header .header-btn:hover {
            background: var(--border);
        }

        .page-header .header-btn svg {
            width: 18px;
            height: 18px;
            fill: var(--text);
        }

        /* ===== Page Container ===== */
        .page {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 16px 20px;
            scrollbar-width: none;
        }

        .page::-webkit-scrollbar {
            display: none;
        }

        .page.active {
            display: flex;
        }

        /* ===== Home Page ===== */
        .home-header {
            padding: 8px 0 16px;
        }

        .home-header h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .home-header .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 10px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .stat-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .stat-card .stat-icon {
            width: 32px;
            height: 32px;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(0,180,180,0.1);
        }

        .stat-card .stat-icon svg {
            width: 18px;
            height: 18px;
            fill: var(--primary);
        }

        .stat-card .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2px;
        }

        .stat-card .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .quote-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .quote-card::before {
            content: '"';
            font-family: 'Playfair Display', serif;
            font-size: 60px;
            color: var(--primary);
            opacity: 0.15;
            position: absolute;
            top: -10px;
            left: 10px;
            line-height: 1;
        }

        .quote-card p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .main-action {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 40px;
        }

        .smoke-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: white;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 40px rgba(0,180,180,0.3), 0 0 80px rgba(0,180,180,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 4px;
        }

        .smoke-btn::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(0,180,180,0.3);
            animation: pulse-ring 2s ease-out infinite;
        }

        .smoke-btn::after {
            content: '';
            position: absolute;
            inset: -16px;
            border-radius: 50%;
            border: 1px solid rgba(0,180,180,0.15);
            animation: pulse-ring 2s ease-out 0.5s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.15); opacity: 0; }
        }

        .smoke-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(0,180,180,0.4), 0 0 100px rgba(0,180,180,0.15);
        }

        .smoke-btn:active {
            transform: scale(0.95);
        }

        .smoke-btn .btn-icon {
            font-size: 28px;
        }

        .smoke-btn .btn-text {
            font-size: 16px;
        }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 10px 0 24px;
            border-top: 1px solid var(--border);
            background: var(--bg);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
            color: var(--text-muted);
        }

        .nav-item:hover {
            color: var(--text-secondary);
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-item span {
            font-size: 10px;
        }

        /* ===== Virtual Cigarette Page ===== */
        .cigarette-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .smoke-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            pointer-events: none;
        }

        .cigarette-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .cigarette {
            width: 24px;
            height: 200px;
            background: linear-gradient(90deg, #f5f0e8 0%, #e8e0d0 30%, #f5f0e8 50%, #d0c8b8 70%, #c0a060 100%);
            border-radius: 2px 2px 12px 12px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }

        .cigarette.burning {
            animation: cigarette-shake 0.1s ease-in-out infinite;
        }

        @keyframes cigarette-shake {
            0%, 100% { transform: rotate(-1deg); }
            50% { transform: rotate(1deg); }
        }

        .cigarette-ash {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(180deg, #888 0%, #666 50%, #444 100%);
            border-radius: 0 0 12px 12px;
        }

        .cigarette-glow {
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #ff6b35 0%, #ff4500 50%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .cigarette-glow.active {
            opacity: 1;
            animation: glow-pulse 0.5s ease-in-out infinite alternate;
        }

        @keyframes glow-pulse {
            0% { box-shadow: 0 0 10px #ff6b35, 0 0 20px #ff4500; }
            100% { box-shadow: 0 0 20px #ff6b35, 0 0 40px #ff4500; }
        }

        .cigarette-tip {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, rgba(255,107,53,0.8) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
        }

        .cigarette-tip.active {
            opacity: 1;
        }

        .smoke-action-btn {
            margin-top: 40px;
            padding: 14px 48px;
            background: var(--primary);
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,180,180,0.3);
            transition: all 0.3s;
        }

        .smoke-action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0,180,180,0.4);
        }

        .smoke-action-btn:active {
            transform: scale(0.95);
        }

        /* ===== Chart Pages ===== */
        .chart-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .chart-header h3 {
            font-size: 15px;
            font-weight: 600;
        }

        .chart-header .chart-filter {
            display: flex;
            gap: 8px;
        }

        .chart-filter-btn {
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chart-filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .chart-wrapper {
            position: relative;
            height: 280px;
        }

        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* ===== Data Analysis Grid ===== */
        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .analysis-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .analysis-item:hover {
            background: var(--bg-card-hover);
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }

        .analysis-item .analysis-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            background: rgba(0,180,180,0.08);
        }

        .analysis-item .analysis-icon svg {
            width: 22px;
            height: 22px;
            fill: var(--primary);
        }

        .analysis-item h4 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .analysis-item p {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ===== Calendar Page ===== */
        .calendar-month {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
        }

        .calendar-month-header {
            text-align: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .calendar-month-header h3 {
            font-size: 15px;
            font-weight: 600;
        }

        .calendar-month-header .month-summary {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-weekday {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            padding: 6px 0;
            font-weight: 500;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .calendar-day:hover {
            background: var(--surface-light);
        }

        .calendar-day .day-number {
            font-weight: 500;
        }

        .calendar-day .day-count {
            font-size: 9px;
            color: var(--primary);
            font-weight: 600;
        }

        .calendar-day.has-data {
            background: rgba(0,180,180,0.08);
        }

        .calendar-day.has-data .day-number {
            color: var(--primary);
        }

        .calendar-day.empty {
            pointer-events: none;
        }

        /* ===== Brand Page ===== */
        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            margin-bottom: 16px;
        }

        .search-bar svg {
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
            flex-shrink: 0;
        }

        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .brand-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .brand-card {
            display: flex;
            gap: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .brand-card:hover {
            background: var(--bg-card-hover);
            transform: translateX(4px);
        }

        .brand-image {
            width: 60px;
            height: 80px;
            border-radius: var(--radius-sm);
            background: var(--surface-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .brand-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-image .brand-placeholder {
            font-size: 24px;
        }

        .brand-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-info h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .brand-price {
            display: flex;
            gap: 12px;
            margin-bottom: 6px;
        }

        .brand-price-item {
            font-size: 12px;
        }

        .brand-price-item .label {
            color: var(--text-muted);
        }

        .brand-price-item .value {
            color: var(--accent);
            font-weight: 600;
        }

        .brand-meta {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .brand-meta span {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* ===== Animations ===== */
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--surface);
            color: var(--text);
            padding: 12px 24px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== Modal ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 100%;
            max-width: 320px;
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .modal-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .modal-btn:hover {
            opacity: 0.9;
        }

        /* ===== Responsive ===== */
        @media (max-width: 380px) {
            .stats-grid {
                gap: 8px;
            }
            .stat-card {
                padding: 10px 6px;
            }
            .analysis-grid {
                gap: 8px;
            }
            .analysis-item {
                padding: 12px 6px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Status Bar -->
        <div class="status-bar">
            <span class="time" id="statusTime">10:33</span>

    <script>
    // ==================== APP ====================
    const app = {
        state: {
            todayCount: 2,
            lastSmoke: '刚刚',
            todayMoney: 1.1,
            quote: '人会变温柔是因为值得太透彻了',
            theme: 'dark',
            currentPage: 'home',
            pageHistory: [],
            isSmoking: false,
            brands: [
                { name: '利群(硬富春山居)', single: '¥2000', box: '¥20000', tar: '5mg', nicotine: '0.5mg', type: '烤烟型', emoji: '🚬' },
                { name: '利群(神州)', single: '¥30', box: '¥300', tar: '8mg', nicotine: '0.8mg', type: '烤烟型', emoji: '🚬' },
                { name: '利群(阳光马来西亚版)', single: '¥25', box: '¥250', tar: '8mg', nicotine: '0.8mg', type: '烤烟型', emoji: '🚬' },
                { name: '利群(神州细支) 俗名: 利群神州', single: '¥31', box: '¥310', tar: '8mg', nicotine: '0.8mg', type: '烤烟型', emoji: '🚬' },
                { name: '利群(软富春山居)', single: '¥500', box: '¥5000', tar: '5mg', nicotine: '0.5mg', type: '烤烟型', emoji: '🚬' },
            ],
            quotes: [
                '人会变温柔是因为值得太透彻了',
                '每一次克制，都是对自由的靠近',
                '健康不是一切，但没有健康就没有一切',
                '今天的坚持，是明天更好的开始',
                '少抽一支烟，多活一小时',
                '自律即自由',
                '改变，从现在开始',
                '每一口呼吸都值得珍惜',
            ],
            analysisItems: [
                { icon: 'chart', name: '基础统计', desc: '全部数据', page: 'basic-stats' },
                { icon: 'clock', name: '抽烟记录', desc: '历史数据', page: 'calendar' },
                { icon: 'compare', name: '逐月对比', desc: '每月总计', page: 'monthly-compare' },
                { icon: 'calendar', name: '每月统计', desc: '每月趋势', page: 'calendar' },
                { icon: 'trend', name: '逐月对比', desc: '每月分析', page: 'monthly-compare' },
                { icon: 'year', name: '年度数据', desc: '整年分析', page: 'basic-stats' },
                { icon: 'location', name: '地点统计', desc: '抽烟位置', page: 'basic-stats' },
                { icon: 'time', name: '时段分析', desc: '每日时段', page: 'basic-stats' },
                { icon: 'brand', name: '品牌统计', desc: 'TOP20', page: 'brand' },
                { icon: 'category', name: '分类占比', desc: '类型分析', page: 'basic-stats' },
                { icon: 'price', name: '烟价分布', desc: 'TOP10', page: 'brand' },
                { icon: 'gender', name: '男女比例', desc: '用户统计', page: 'basic-stats' },
            ]
        },

        charts: {},
        smokeParticles: [],
        animationId: null,

        init() {
            this.updateTime();
            setInterval(() => this.updateTime(), 1000);
            this.renderAnalysisGrid();
            this.renderBrands();
            this.renderCalendar();
            this.initCharts();
            this.updateHomeStats();

            // Keyboard back button
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && this.state.pageHistory.length > 0) {
                    this.goBack();
                }
            });
        },

        updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('statusTime').textContent = `${hours}:${minutes}`;
        },

        updateHomeStats() {
            document.getElementById('todayCount').textContent = this.state.todayCount;
            document.getElementById('lastSmoke').textContent = this.state.lastSmoke;
            document.getElementById('todayMoney').textContent = `¥${this.state.todayMoney.toFixed(1)}`;
            document.getElementById('quoteText').textContent = this.state.quote;
        },

        navigate(page) {
            if (page === this.state.currentPage) return;

            // Hide all pages
            document.querySelectorAll('.page').forEach(p => {
                p.classList.remove('active');
                p.classList.remove('fade-in');
            });

            // Update nav
            document.querySelectorAll('.nav-item').forEach((item, idx) => {
                item.classList.remove('active');
            });

            const navMap = { home: 0, virtual: 1, analysis: 2, brand: 3 };
            const navItems = document.querySelectorAll('.nav-item');
            if (navMap[page] !== undefined && navItems[navMap[page]]) {
                navItems[navMap[page]].classList.add('active');
            }

            // Show target page
            const targetPage = document.getElementById(`page-${page}`);
            if (targetPage) {
                targetPage.classList.add('active', 'fade-in');
            }

            // Show/hide bottom nav
            const bottomNav = document.getElementById('bottomNav');
            if (page === 'home' || page === 'virtual' || page === 'analysis' || page === 'brand') {
                bottomNav.style.display = 'flex';
            } else {
                bottomNav.style.display = 'none';
            }

            this.state.pageHistory.push(this.state.currentPage);
            this.state.currentPage = page;

            // Init charts if needed
            if (page === 'basic-stats') {
                setTimeout(() => this.initBasicChart(), 100);
            }
            if (page === 'monthly-compare') {
                setTimeout(() => this.initAreaChart(), 100);
            }
        },

        goHome() {
            this.state.pageHistory = [];
            this.navigate('home');
        },

        goBack() {
            const prev = this.state.pageHistory.pop();
            if (prev) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                const target = document.getElementById(`page-${prev}`);
                if (target) target.classList.add('active', 'slide-in');

                const bottomNav = document.getElementById('bottomNav');
                if (prev === 'home' || prev === 'virtual' || prev === 'analysis' || prev === 'brand') {
                    bottomNav.style.display = 'flex';
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    const navMap = { home: 0, virtual: 1, analysis: 2, brand: 3 };
                    const navItems = document.querySelectorAll('.nav-item');
                    if (navMap[prev] !== undefined && navItems[navMap[prev]]) {
                        navItems[navMap[prev]].classList.add('active');
                    }
                } else {
                    bottomNav.style.display = 'none';
                }
                this.state.currentPage = prev;
            }
        },

        smoke() {
            this.state.todayCount++;
            this.state.todayMoney += 0.55;
            this.state.lastSmoke = '刚刚';
            this.state.quote = this.state.quotes[Math.floor(Math.random() * this.state.quotes.length)];
            this.updateHomeStats();
            this.showToast('已记录抽烟 +1');

            // Button animation
            const btn = document.getElementById('smokeBtn');
            btn.style.transform = 'scale(0.9)';
            setTimeout(() => btn.style.transform = '', 200);
        },

        virtualSmoke() {
            const btn = document.getElementById('virtualSmokeBtn');
            const cigarette = document.getElementById('cigarette');
            const glow = document.getElementById('cigaretteGlow');
            const tip = document.getElementById('cigaretteTip');

            if (this.state.isSmoking) {
                // Stop
                this.state.isSmoking = false;
                btn.textContent = '点烟';
                cigarette.classList.remove('burning');
                glow.classList.remove('active');
                tip.classList.remove('active');
                this.stopSmokeAnimation();
            } else {
                // Start
                this.state.isSmoking = true;
                btn.textContent = '熄灭';
                cigarette.classList.add('burning');
                glow.classList.add('active');
                tip.classList.add('active');
                this.startSmokeAnimation();
                this.showToast('虚拟香烟已点燃');
            }
        },

        startSmokeAnimation() {
            const canvas = document.getElementById('smokeCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            this.smokeParticles = [];

            const animate = () => {
                if (!this.state.isSmoking) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Add new particles
                for (let i = 0; i < 3; i++) {
                    this.smokeParticles.push({
                        x: canvas.width / 2 + (Math.random() - 0.5) * 10,
                        y: canvas.height - 60,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: -Math.random() * 1.5 - 0.5,
                        size: Math.random() * 15 + 5,
                        opacity: Math.random() * 0.3 + 0.1,
                        life: 1,
                    });
                }

                // Update and draw particles
                this.smokeParticles = this.smokeParticles.filter(p => {
                    p.x += p.vx + Math.sin(Date.now() * 0.001 + p.y * 0.01) * 0.3;
                    p.y += p.vy;
                    p.size += 0.15;
                    p.life -= 0.008;
                    p.opacity *= 0.995;

                    if (p.life <= 0) return false;

                    ctx.beginPath();
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                    gradient.addColorStop(0, `rgba(180,180,180,${p.opacity * p.life})`);
                    gradient.addColorStop(0.5, `rgba(140,140,140,${p.opacity * p.life * 0.5})`);
                    gradient.addColorStop(1, 'rgba(100,100,100,0)');
                    ctx.fillStyle = gradient;
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();

                    return true;
                });

                this.animationId = requestAnimationFrame(animate);
            };

            animate();
        },

        stopSmokeAnimation() {
            if (this.animationId) {
                cancelAnimationFrame(this.animationId);
                this.animationId = null;
            }
            const canvas = document.getElementById('smokeCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            this.smokeParticles = [];
        },

        renderAnalysisGrid() {
            const grid = document.getElementById('analysisGrid');
            const icons = {
                chart: '<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>',
                clock: '<svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>',
                compare: '<svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>',
                calendar: '<svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/></svg>',
                trend: '<svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>',
                year: '<svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>',
                location: '<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>',
                time: '<svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>',
                brand: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>',
                category: '<svg viewBox="0 0 24 24"><path d="M12 2l-5.5 9h11z"/><circle cx="17.5" cy="17.5" r="4.5"/><path d="M3 13.5h8v8H3z"/></svg>',
                price: '<svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>',
                gender: '<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
            };

            grid.innerHTML = this.state.analysisItems.map(item => `
                <div class="analysis-item" onclick="app.navigate('${item.page}')">
                    <div class="analysis-icon">${icons[item.icon] || icons.chart}</div>
                    <h4>${item.name}</h4>
                    <p>${item.desc}</p>
                </div>
            `).join('');
        },

        renderBrands(filter = '') {
            const list = document.getElementById('brandList');
            const brands = filter
                ? this.state.brands.filter(b => b.name.includes(filter))
                : this.state.brands;

            list.innerHTML = brands.map(brand => `
                <div class="brand-card" onclick="app.showToast('${brand.name}')">
                    <div class="brand-image">
                        <span class="brand-placeholder">${brand.emoji}</span>
                    </div>
                    <div class="brand-info">
                        <h4>${brand.name}</h4>
                        <div class="brand-price">
                            <div class="brand-price-item">
                                <span class="label">单盒参考价: </span>
                                <span class="value">${brand.single}</span>
                            </div>
                            <div class="brand-price-item">
                                <span class="label">条盒参考价: </span>
                                <span class="value">${brand.box}</span>
                            </div>
                        </div>
                        <div class="brand-meta">
                            <span>焦油量: ${brand.tar}</span>
                            <span>烟气烟碱量: ${brand.nicotine}</span>
                            <span>${brand.type}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        },

        searchBrands(query) {
            this.renderBrands(query);
        },

        renderCalendar() {
            const container = document.getElementById('calendarContainer');
            const months = [
                { year: 2020, month: 12, total: 65, money: 35.75, nicotine: 325 },
                { year: 2020, month: 11, total: 48, money: 26.40, nicotine: 240 },
            ];

            const weekdays = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

            container.innerHTML = months.map(m => {
                const firstDay = new Date(m.year, m.month - 1, 1).getDay();
                const daysInMonth = new Date(m.year, m.month, 0).getDate();
                const startOffset = firstDay === 0 ? 6 : firstDay - 1;

                let daysHtml = '';
                for (let i = 0; i < startOffset; i++) {
                    daysHtml += '<div class="calendar-day empty"></div>';
                }
                for (let d = 1; d <= daysInMonth; d++) {
                    const count = Math.random() > 0.3 ? Math.floor(Math.random() * 8) + 1 : 0;
                    const hasData = count > 0;
                    daysHtml += `
                        <div class="calendar-day ${hasData ? 'has-data' : ''}" onclick="app.showToast('${m.year}年${m.month}月${d}日: ${count}支')">
                            <span class="day-number">${d}</span>
                            ${hasData ? `<span class="day-count">${count}支</span>` : ''}
                        </div>
                    `;
                }

                return `
                    <div class="calendar-month">
                        <div class="calendar-month-header">
                            <h3>${m.year}年${m.month}月</h3>
                            <div class="month-summary">
                                共计抽烟 ${m.total} 支 | 消耗RMB: ${m.money} | 摄入尼古丁: ${m.nicotine}mg
                            </div>
                        </div>
                        <div class="calendar-grid">
                            ${weekdays.map(w => `<div class="calendar-weekday">${w}</div>`).join('')}
                            ${daysHtml}
                        </div>
                    </div>
                `;
            }).join('');
        },

        initCharts() {
            // Basic chart will init on page show
        },

        initBasicChart() {
            const ctx = document.getElementById('basicChart');
            if (!ctx) return;

            if (this.charts.basic) {
                this.charts.basic.destroy();
            }

            const labels = [];
            const dataMoney = [];
            const dataCount = [];
            for (let i = 1; i <= 30; i++) {
                labels.push(`${i}日`);
                dataMoney.push(Math.random() * 20 + 5);
                dataCount.push(Math.floor(Math.random() * 15) + 3);
            }

            this.charts.basic = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [
                        {
                            label: '消耗人民币(元)',
                            data: dataMoney,
                            backgroundColor: 'rgba(0,180,180,0.7)',
                            borderColor: 'rgba(0,180,180,1)',
                            borderWidth: 1,
                            borderRadius: 3,
                        },
                        {
                            label: '消耗根数(支)',
                            data: dataCount,
                            backgroundColor: 'rgba(121,134,203,0.7)',
                            borderColor: 'rgba(121,134,203,1)',
                            borderWidth: 1,
                            borderRadius: 3,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(18,18,26,0.95)',
                            titleColor: '#e8e8f0',
                            bodyColor: '#8a8a9a',
                            borderColor: '#252535',
                            borderWidth: 1,
                            padding: 10,
                            displayColors: true,
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false, color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#5a5a6a', font: { size: 10 } }
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#5a5a6a', font: { size: 10 } }
                        }
                    }
                }
            });
        },

        initAreaChart() {
            const ctx = document.getElementById('areaChart');
            if (!ctx) return;

            if (this.charts.area) {
                this.charts.area.destroy();
            }

            const labels = [];
            for (let i = 1; i <= 30; i++) labels.push(`${i}日`);

            const datasets = [
                { label: '1月', data: labels.map(() => Math.random() * 30 + 10), backgroundColor: 'rgba(255,107,138,0.6)', borderColor: '#ff6b8a', fill: true },
                { label: '2月', data: labels.map(() => Math.random() * 25 + 15), backgroundColor: 'rgba(255,138,101,0.6)', borderColor: '#ff8a65', fill: true },
                { label: '3月', data: labels.map(() => Math.random() * 20 + 20), backgroundColor: 'rgba(255,213,79,0.6)', borderColor: '#ffd54f', fill: true },
                { label: '4月', data: labels.map(() => Math.random() * 15 + 25), backgroundColor: 'rgba(77,182,172,0.6)', borderColor: '#4db6ac', fill: true },
            ];

            this.charts.area = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(18,18,26,0.95)',
                            titleColor: '#e8e8f0',
                            bodyColor: '#8a8a9a',
                            borderColor: '#252535',
                            borderWidth: 1,
                            padding: 10,
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { color: '#5a5a6a', font: { size: 10 } }
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#5a5a6a', font: { size: 10 } }
                        }
                    },
                    elements: {
                        line: { tension: 0.4 },
                        point: { radius: 0, hoverRadius: 4 }
                    }
                }
            });
        },

        switchChartPeriod(btn, period) {
            document.querySelectorAll('#page-basic-stats .chart-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.initBasicChart();
        },

        switchAreaPeriod(btn, period) {
            document.querySelectorAll('#page-monthly-compare .chart-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.initAreaChart();
        },

        toggleTheme() {
            this.state.theme = this.state.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', this.state.theme);
            this.showToast(this.state.theme === 'dark' ? '已切换至暗黑模式' : '已切换至亮色模式');
        },

        showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        },

        showModal(title, text, onConfirm) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').textContent = text;
            document.getElementById('modalOverlay').classList.add('active');
            this.modalCallback = onConfirm;
        },

        closeModal(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('modalOverlay').classList.remove('active');
            this.modalCallback = null;
        },

        confirmModal() {
            if (this.modalCallback) this.modalCallback();
            this.closeModal();
        },
    };

    // Init
    document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
