<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIMediaProcessorPro - 交互演示</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-light: #16213e;
      --bg-card: #1f2b47;
      --primary: #e94560;
      --secondary: #0f3460;
      --accent: #533483;
      --text: #ffffff;
      --text-secondary: #8892b0;
      --success: #4ecca3;
      --warning: #f5a623;
      --border: #2a3a5a;
      --video-active: #e67e22;
      --online-active: #3498db;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .app-window {
      width: 660px;
      background: var(--bg);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px var(--border);
      padding: 30px;
      position: relative;
      overflow: hidden;
    }

    .app-window::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent), var(--online-active));
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .header-title {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
    }
    .header-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .badge {
      font-size: 11px;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
    }

    /* Module Cards */
    .module-cards {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .card {
      flex: 1;
      padding: 14px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      border: 2px solid transparent;
    }
    .card:hover { transform: translateY(-2px); }
    .card.active { border-color: rgba(255,255,255,0.2); }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .card-sub { font-size: 12px; opacity: 0.9; }
    .card-image { background: var(--primary); }
    .card-video { background: var(--bg-card); color: var(--text-secondary); }
    .card-video.active { background: var(--video-active); color: var(--text); }
    .card-image:not(.active) { background: var(--bg-card); color: var(--text-secondary); }

    /* AI Mode */
    .section {
      background: var(--bg-card);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .radio-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .radio-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-secondary);
      transition: color 0.2s;
    }
    .radio-item:hover { color: var(--text); }
    .radio-item input { accent-color: var(--primary); cursor: pointer; }
    .radio-item.active { color: var(--text); }

    .token-box {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .token-box.show { display: block; }
    .token-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: Consolas, monospace;
      font-size: 12px;
      width: 260px;
    }
    .token-input:focus { outline: none; border-color: var(--primary); }
    .token-label { font-size: 11px; color: var(--text-secondary); margin-left: 8px; }

    /* Folder */
    .folder-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .folder-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    .folder-input:focus { outline: none; border-color: var(--primary); }
    .btn {
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
      white-space: nowrap;
    }
    .btn-secondary { background: var(--secondary); color: var(--text); }
    .btn-secondary:hover { background: var(--accent); }
    .btn-primary { background: var(--primary); color: var(--text); font-size: 15px; padding: 12px 36px; }
    .btn-primary:hover:not(:disabled) { background: #ff4d6d; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-cancel { background: #FF5252; color: #fff; display: none; }
    .btn-cancel.show { display: inline-block; }

    /* Options */
    .options-row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }
    .check-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-secondary);
      transition: color 0.2s;
    }
    .check-item:hover { color: var(--text); }
    .check-item input { accent-color: var(--primary); cursor: pointer; width: 16px; height: 16px; }

    .status {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-secondary);
      min-height: 18px;
    }
    .status.success { color: var(--success); }
    .status.warning { color: var(--warning); }
    .status.online { color: var(--online-active); }

    /* Progress */
    .progress-area {
      display: none;
      margin-top: 16px;
    }
    .progress-area.show { display: block; }
    .progress-bar {
      height: 10px;
      background: var(--bg);
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 5px;
      transition: width 0.3s ease;
    }
    .progress-text {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
      text-align: center;
    }

    /* Log */
    .log-section {
      margin-top: 16px;
    }
    .log-window {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      height: 160px;
      overflow-y: auto;
      padding: 12px;
      font-family: Consolas, 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #c9d1d9;
    }
    .log-line { margin: 2px 0; }
    .log-info { color: #58a6ff; }
    .log-ok { color: var(--success); }
    .log-warn { color: var(--warning); }
    .log-error { color: #f85149; }

    .btn-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* Demo badge */
    .demo-banner {
      position: absolute;
      top: 12px;
      right: -30px;
      width: 140px;
      text-align: center;
      background: var(--primary);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 0;
      transform: rotate(45deg);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      pointer-events: none;
    }

    /* Responsive */
    @media (max-width: 720px) {
      .app-window { width: 100%; padding: 20px; }
      .header { flex-direction: column; align-items: flex-start; gap: 8px; }
      .module-cards { flex-direction: column; }
      .folder-row { flex-direction: column; align-items: stretch; }
      .btn-row { flex-direction: column; }
      .btn-primary { width: 100%; }
    }
  </style>
</head>
<body>

<div class="app-window">
  <div class="demo-banner">INTERACTIVE DEMO</div>

  <div class="header">
    <div>
      <h1 class="header-title">🎬 AI 媒体处理器 Pro</h1>
      <div class="header-sub">图片 · 视频 · AI 智能整理</div>
    </div>
    <span class="badge">v11</span>
  </div>

  <!-- Module Cards -->
  <div class="module-cards">
    <div class="card card-image active" id="cardImage" onclick="switchMode('image')">
      <div class="card-title">🖼️ 图片处理</div>
      <div class="card-sub">● 当前激活</div>
    </div>
    <div class="card card-video" id="cardVideo" onclick="switchMode('video')">
      <div class="card-title">🎬 视频处理</div>
      <div class="card-sub">点击切换</div>
    </div>
  </div>

  <!-- AI Mode -->
  <div class="section">
    <div class="section-title">🤖 AI 模式</div>
    <div class="radio-group">
      <label class="radio-item active" id="labelLocal">
        <input type="radio" name="aiMode" value="local" checked onchange="onModeChange()">
        <span>🖥️ 本地模型（离线）</span>
      </label>
      <label class="radio-item" id="labelOnline">
        <input type="radio" name="aiMode" value="online" onchange="onModeChange()">
        <span>🌐 在线API（免费·无需安装）</span>
      </label>
    </div>
    <div class="token-box" id="tokenBox">
      <input type="text" class="token-input" id="tokenInput" placeholder="hf_xxxxxxxxxxxxxxxx">
      <span class="token-label">HF Token（选填）</span>
    </div>
  </div>

  <!-- Folder -->
  <div class="section">
    <div class="section-title" id="folderTitle">📁 选择图片文件夹</div>
    <div class="folder-row">
      <input type="text" class="folder-input" id="folderInput" placeholder="点击浏览选择文件夹..." readonly>
      <button class="btn btn-secondary" onclick="browseFolder()">浏览</button>
    </div>
  </div>

  <!-- Options -->
  <div class="section">
    <div class="section-title">⚙️ 选择功能</div>
    <div class="options-row">
      <label class="check-item">
        <input type="checkbox" id="chkDeduplicate" checked>
        <span>🔄 去重</span>
      </label>
      <label class="check-item">
        <input type="checkbox" id="chkClassify" checked>
        <span>📂 分类</span>
      </label>
      <label class="check-item">
        <input type="checkbox" id="chkRename" checked>
        <span>✨ AI命名</span>
      </label>
    </div>
    <div class="status" id="statusLabel">📡 检查AI模型...</div>
  </div>

  <!-- Progress -->
  <div class="progress-area" id="progressArea">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText">准备中...</div>
  </div>

  <!-- Log -->
  <div class="log-section">
    <div class="section-title">📋 实时日志</div>
    <div class="log-window" id="logWindow"></div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-primary" id="startBtn" onclick="startProcessing()">🚀 开始处理</button>
    <button class="btn btn-cancel" id="cancelBtn" onclick="cancelProcessing()">✕ 取消</button>
  </div>

  <div class="footer">
    📧 如有疑问或建议，请联系：2291595496@qq.com · 微信公众号：码律工坊
  </div>
</div>

<script>
  let currentMode = 'image';
  let processing = false;
  let progressTimer = null;
  let logLines = [];
  const sampleFiles = {
    image: ['IMG_2025_001.jpg', 'IMG_2025_002.png', '截屏2025-12-01.png', '微信图片_202512011200.jpg', 'DSC00421.jpg', '未命名.jpg'],
    video: ['C0010.MP4', 'VID_20251201_143022.mp4', 'screen_recording.mov', '抖音_video.mp4', '导出_001.mp4']
  };
  const sampleDescs = {
    image: ['红色枫叶庙宇', '城市夜景天际线', '卡通猫咪插画', '海边落日风景', '人物头像特写', '美食拉面特写'],
    video: ['东京浅草寺人群', '游戏录制画面', '宠物狗玩耍', '城市夜景', '美食烹饪过程']
  };
  const categories = {
    image: ['风景', '风景', '动漫', '风景', '头像', '其他'],
    video: ['风景', '游戏', '动物', '风景', '美食']
  };

  function log(msg, type='info') {
    const line = document.createElement('div');
    line.className = `log-line log-${type}`;
    const now = new Date().toLocaleTimeString('zh-CN', {hour12:false});
    line.textContent = `[${now}] ${msg}`;
    const win = document.getElementById('logWindow');
    win.appendChild(line);
    win.scrollTop = win.scrollHeight;
  }

  function switchMode(mode) {
    currentMode = mode;
    const imgCard = document.getElementById('cardImage');
    const vidCard = document.getElementById('cardVideo');
    const folderTitle = document.getElementById('folderTitle');
    const dedup = document.getElementById('chkDeduplicate');
    const localRadio = document.querySelector('input[value="local"]');
    const onlineRadio = document.querySelector('input[value="online"]');

    if (mode === 'image') {
      imgCard.classList.add('active');
      imgCard.querySelector('.card-sub').textContent = '● 当前激活';
      vidCard.classList.remove('active');
      vidCard.querySelector('.card-sub').textContent = '点击切换';
      folderTitle.textContent = '📁 选择图片文件夹';
      dedup.checked = true;
      localRadio.checked = true;
    } else {
      vidCard.classList.add('active');
      vidCard.querySelector('.card-sub').textContent = '● 当前激活';
      imgCard.classList.remove('active');
      imgCard.querySelector('.card-sub').textContent = '点击切换';
      folderTitle.textContent = '📁 选择视频文件夹';
      dedup.checked = false;
      onlineRadio.checked = true;
    }
    onModeChange();
    log(`切换至 ${mode === 'image' ? '图片' : '视频'} 处理模式`);
  }

  function onModeChange() {
    const isOnline = document.querySelector('input[name="aiMode"]:checked').value === 'online';
    const tokenBox = document.getElementById('tokenBox');
    const status = document.getElementById('statusLabel');
    const labelLocal = document.getElementById('labelLocal');
    const labelOnline = document.getElementById('labelOnline');

    if (isOnline) {
      tokenBox.classList.add('show');
      status.textContent = '🌐 在线AI已启用（无需本地模型）';
      status.className = 'status online';
      labelOnline.classList.add('active');
      labelLocal.classList.remove('active');
    } else {
      tokenBox.classList.remove('show');
      status.textContent = '✅ 本地AI模型已就绪 (944.9MB)';
      status.className = 'status success';
      labelLocal.classList.add('active');
      labelOnline.classList.remove('active');
    }
  }

  function browseFolder() {
    const folder = prompt(`请选择 ${currentMode === 'image' ? '图片' : '视频'} 文件夹路径（演示用）：`, `C:\\Users\\22915\\Desktop\\待整理${currentMode === 'image' ? '图片' : '视频'}`);
    if (folder) {
      document.getElementById('folderInput').value = folder;
      log(`已选择文件夹: ${folder}`);
    }
  }

  function startProcessing() {
    const folder = document.getElementById('folderInput').value.trim();
    if (!folder) {
      alert('请先选择文件夹！');
      return;
    }
    const hasOption = document.getElementById('chkDeduplicate').checked ||
                      document.getElementById('chkClassify').checked ||
                      document.getElementById('chkRename').checked;
    if (!hasOption) {
      alert('请至少选择一个功能！');
      return;
    }

    processing = true;
    document.getElementById('startBtn').disabled = true;
    document.getElementById('startBtn').textContent = '🚀 处理中...';
    document.getElementById('cancelBtn').classList.add('show');
    document.getElementById('progressArea').classList.add('show');
    document.getElementById('logWindow').innerHTML = '';

    const isOnline = document.querySelector('input[name="aiMode"]:checked').value === 'online';
    log(`开始处理 ${currentMode === 'image' ? '图片' : '视频'} 文件夹...`, 'ok');
    log(`AI 模式: ${isOnline ? '在线 API' : '本地 BLIP 模型'}`);
    log(`功能选项: 去重=${document.getElementById('chkDeduplicate').checked} 分类=${document.getElementById('chkClassify').checked} AI命名=${document.getElementById('chkRename').checked}`);

    const files = sampleFiles[currentMode];
    const descs = sampleDescs[currentMode];
    const cats = categories[currentMode];
    let current = 0;
    const total = files.length;

    const steps = ['[1/3] AI分析...', '[2/3] 重命名...', '[3/3] 去重...'];
    let stepIndex = 0;

    progressTimer = setInterval(() => {
      if (!processing) return;
      current += Math.random() > 0.7 ? 1 : 0;
      if (current > total) current = total;
      const pct = Math.min(100, Math.floor((current / total) * 100));
      document.getElementById('progressFill').style.width = pct + '%';

      if (current < total * 0.4) stepIndex = 0;
      else if (current < total * 0.8) stepIndex = 1;
      else stepIndex = 2;

      const stepName = steps[stepIndex];
      document.getElementById('progressText').textContent = `${stepName} ${files[current % total]} [${pct}%]`;
      document.getElementById('startBtn').textContent = `🚀 ${stepName} [${pct}%]`;

      if (current > 0 && current <= total) {
        if (stepIndex === 0) {
          const idx = (current - 1) % descs.length;
          log(`AI 分析: ${files[current - 1]} → "${descs[idx]}" [${cats[idx]}]`, 'ok');
        } else if (stepIndex === 1) {
          const idx = (current - 1) % descs.length;
          const newName = `${descs[idx]}_${String(current).padStart(3,'0')}.${currentMode === 'image' ? 'jpg' : 'mp4'}`;
          log(`重命名: ${files[current - 1]} → ${cats[idx]}/${newName}`, 'info');
        } else if (stepIndex === 2 && Math.random() > 0.8) {
          log(`发现重复文件，已移至 ${currentMode === 'image' ? 'Duplicates' : '重复视频'} 目录`, 'warn');
        }
      }

      if (current >= total) {
        clearInterval(progressTimer);
        finishProcessing(true);
      }
    }, 600);
  }

  function cancelProcessing() {
    processing = false;
    clearInterval(progressTimer);
    log('⚠️ 已发送取消请求...', 'warn');
    finishProcessing(false, true);
  }

  function finishProcessing(success, cancelled=false) {
    processing = false;
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').textContent = '🚀 开始处理';
    document.getElementById('cancelBtn').classList.remove('show');
    document.getElementById('progressFill').style.width = '100%';

    if (cancelled) {
      document.getElementById('progressText').textContent = '处理已取消';
      log('处理已取消', 'warn');
    } else if (success) {
      document.getElementById('progressText').textContent = '✅ 处理完成！';
      log('========================================', 'ok');
      log(`  📊 总计: 6 个 | 重命名: 6 | 去重: 1`, 'ok');
      log('========================================', 'ok');
      log('✅ 处理完成！请检查目标文件夹查看结果。', 'ok');
      setTimeout(() => {
        document.getElementById('progressArea').classList.remove('show');
        document.getElementById('progressFill').style.width = '0%';
      }, 2000);
    }
  }

  // Init
  log('AIMediaProcessorPro v11 交互演示已加载');
  log('✅ 本地 BLIP 模型已就绪 (944.9MB)', 'ok');
  onModeChange();
</script>

</body>
</html>
