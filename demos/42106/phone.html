<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>星空计时器</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Noto+Sans+SC:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Inter", "Noto Sans SC", sans-serif;
      color: #fff;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .phone {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 52px 28px 42px;
      background: radial-gradient(ellipse at center, rgba(20,30,60,0.25) 0%, rgba(0,0,0,0.55) 70%);
    }

    .status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 500;
      opacity: 0.8;
      letter-spacing: 0.02em;
    }

    .clock-now {
      text-align: center;
      margin-top: 24px;
      animation: fadeDown 1.2s var(--ease) both;
    }

    .clock-now .time {
      font-size: 78px;
      font-weight: 300;
      letter-spacing: -0.04em;
      line-height: 1;
      text-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .clock-now .date {
      margin-top: 10px;
      font-size: 16px;
      color: rgba(255,255,255,0.72);
      font-weight: 400;
    }

    .timer-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      animation: fadeUp 1.2s 0.2s var(--ease) both;
    }

    .timer-ring {
      position: relative;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }

    .timer-ring svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
      filter: drop-shadow(0 0 18px rgba(100, 200, 255, 0.25));
    }

    .timer-ring circle {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
    }

    .timer-ring .track { stroke: rgba(255,255,255,0.12); }
    .timer-ring .progress {
      stroke: url(#ringGradient);
      stroke-dasharray: 754;
      stroke-dashoffset: 754;
      transition: stroke-dashoffset 0.35s linear;
    }

    .timer-display {
      position: relative;
      z-index: 2;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 6px 30px rgba(0,0,0,0.45);
    }

    .timer-label {
      margin-top: 14px;
      font-size: 15px;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.06em;
    }

    .chips {
      display: flex;
      gap: 10px;
      margin-top: 26px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .chip {
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.75);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s var(--ease);
      backdrop-filter: blur(6px);
    }

    .chip:hover, .chip.active {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.35);
      color: #fff;
    }

    .controls {
      display: flex;
      gap: 18px;
      align-items: center;
      margin-top: 22px;
    }

    .btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: none;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.15s var(--ease), box-shadow 0.25s var(--ease);
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      color: #fff;
    }

    .btn:active { transform: scale(0.92); }

    .btn-main {
      width: 84px;
      height: 84px;
      background: #fff;
      color: #0a0f1e;
      box-shadow: 0 12px 40px rgba(255,255,255,0.18);
    }

    .btn-main:hover { box-shadow: 0 16px 50px rgba(255,255,255,0.28); }

    .btn svg { width: 26px; height: 26px; }
    .btn-main svg { width: 30px; height: 30px; }

    .bottom-hint {
      margin-top: auto;
      padding-top: 22px;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      animation: fadeUp 1.2s 0.45s var(--ease) both;
    }

    .done-flash {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.12);
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.4s ease;
    }

    .done-flash.show { opacity: 1; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-height: 700px) {
      .clock-now .time { font-size: 56px; }
      .timer-ring { width: 220px; height: 220px; }
      .timer-display { font-size: 52px; }
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7ee8fa" />
        <stop offset="100%" stop-color="#8affc1" />
      </linearGradient>
    </defs>
  </svg>

  <div class="done-flash" id="flash"></div>

  <div class="phone">
    <div class="status-bar">
      <span id="carrier">OffScreen</span>
      <span id="battery">100%</span>
    </div>

    <div class="clock-now">
      <div class="time" id="currentTime">00:00</div>
      <div class="date" id="currentDate">1月1日 星期一</div>
    </div>

    <div class="timer-wrap">
      <div class="timer-ring">
        <svg width="260" height="260" viewBox="0 0 260 260">
          <circle class="track" cx="130" cy="130" r="120" />
          <circle class="progress" id="progressCircle" cx="130" cy="130" r="120" />
        </svg>
        <div class="timer-display" id="timerDisplay">15:00</div>
      </div>
      <div class="timer-label" id="timerLabel">专注计时</div>

      <div class="chips" id="chips">
        <div class="chip active" data-min="15">15 分钟</div>
        <div class="chip" data-min="25">25 分钟</div>
        <div class="chip" data-min="45">45 分钟</div>
      </div>

      <div class="controls">
        <button class="btn" onclick="app.reset()" aria-label="重置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="btn btn-main" id="playBtn" onclick="app.toggle()" aria-label="开始">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
      </div>
    </div>

    <div class="bottom-hint">向上滑动以退出</div>
  </div>

  <script>
    // Starfield
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let width, height;
    const stars = [];
    const STAR_COUNT = 160;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    class Star {
      constructor() {
        this.reset(true);
      }
      reset(initial = false) {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.z = Math.random() * 1.5 + 0.3;
        this.size = Math.random() * 1.4 + 0.4;
        this.alpha = Math.random() * 0.6 + 0.2;
        this.twinkleSpeed = Math.random() * 0.03 + 0.005;
        this.twinklePhase = Math.random() * Math.PI * 2;
        if (!initial) this.y = height + 2;
      }
      update(time) {
        this.y -= 0.15 * this.z;
        this.x += Math.sin(time * 0.0003 + this.twinklePhase) * 0.05;
        if (this.y < -2) this.reset();
        this.twinklePhase += this.twinkleSpeed;
      }
      draw() {
        const flicker = 0.75 + 0.25 * Math.sin(this.twinklePhase);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * this.z, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(230, 245, 255, ${this.alpha * flicker})`;
        ctx.fill();
      }
    }

    function initStars() {
      stars.length = 0;
      for (let i = 0; i < STAR_COUNT; i++) stars.push(new Star());
    }

    let shootingStar = null;
    function maybeSpawnShooting() {
      if (!shootingStar && Math.random() < 0.008) {
        shootingStar = {
          x: Math.random() * width * 0.6,
          y: Math.random() * height * 0.4,
          len: 0,
          speed: 12 + Math.random() * 8,
          angle: Math.PI / 4 + (Math.random() - 0.5) * 0.2,
          life: 1
        };
      }
    }

    function drawShooting() {
      if (!shootingStar) return;
      const s = shootingStar;
      const dx = Math.cos(s.angle) * s.speed;
      const dy = Math.sin(s.angle) * s.speed;
      s.x += dx;
      s.y += dy;
      s.life -= 0.015;
      const tailX = s.x - Math.cos(s.angle) * 80;
      const tailY = s.y - Math.sin(s.angle) * 80;
      const grad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
      grad.addColorStop(0, `rgba(255,255,255,${s.life})`);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(tailX, tailY);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.stroke();
      if (s.life <= 0 || s.x > width + 100 || s.y > height + 100) shootingStar = null;
    }

    function drawBg() {
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#050714');
      grad.addColorStop(0.5, '#0a122a');
      grad.addColorStop(1, '#0d1b2a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
    }

    function loop(time) {
      drawBg();
      stars.forEach(star => { star.update(time); star.draw(); });
      maybeSpawnShooting();
      drawShooting();
      requestAnimationFrame(loop);
    }

    window.addEventListener('resize', () => { resize(); initStars(); });
    resize();
    initStars();
    requestAnimationFrame(loop);

    // Timer
    const app = {
      duration: 15,
      timeLeft: 15 * 60,
      running: false,
      timer: null,
      circumference: 2 * Math.PI * 120,

      toggle() {
        if (this.running) this.pause();
        else this.start();
      },

      start() {
        this.running = true;
        this.setIcons(true);
        this.timer = setInterval(() => {
          this.timeLeft--;
          this.render();
          if (this.timeLeft <= 0) this.finish();
        }, 1000);
      },

      pause() {
        this.running = false;
        clearInterval(this.timer);
        this.setIcons(false);
      },

      reset() {
        this.pause();
        this.timeLeft = this.duration * 60;
        this.render();
      },

      setDuration(min) {
        if (this.running) return;
        this.duration = min;
        this.timeLeft = min * 60;
        document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', Number(c.dataset.min) === min));
        this.render();
      },

      finish() {
        this.pause();
        this.timeLeft = this.duration * 60;
        this.render();
        const flash = document.getElementById('flash');
        flash.classList.add('show');
        setTimeout(() => flash.classList.remove('show'), 500);
        navigator.vibrate?.(200);
      },

      render() {
        const m = String(Math.floor(this.timeLeft / 60)).padStart(2, '0');
        const s = String(this.timeLeft % 60).padStart(2, '0');
        document.getElementById('timerDisplay').textContent = `${m}:${s}`;
        const offset = this.circumference * (1 - this.timeLeft / (this.duration * 60));
        document.getElementById('progressCircle').style.strokeDashoffset = offset;
      },

      setIcons(playing) {
        document.getElementById('playIcon').style.display = playing ? 'none' : 'block';
        document.getElementById('pauseIcon').style.display = playing ? 'block' : 'none';
      }
    };

    // Clock
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('currentTime').textContent = `${h}:${m}`;
      const days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
      document.getElementById('currentDate').textContent = `${now.getMonth() + 1}月${now.getDate()}日 ${days[now.getDay()]}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Chips
    document.querySelectorAll('.chip').forEach(c => {
      c.addEventListener('click', () => app.setDuration(Number(c.dataset.min)));
    });

    app.render();
  </script>
</body>
</html>
