<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物业监管平台</title>
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f8fafc; }
    .fade-enter-active, .fade-leave-active { transition: opacity 0.3s; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
    .chart-container { position: relative; height: 300px; width: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
const { createApp, ref, computed, onMounted, nextTick, markRaw } = Vue;

const app = createApp({
  setup() {
    const currentTab = ref('home');
    const mockData = {
      score: 4.5,
      scoreDetails: { hygiene: 4.6, maintenance: 4.4, security: 4.7, service: 4.3 },
      complaintTrend: [
        { month: '1月', count: 28 }, { month: '2月', count: 22 }, { month: '3月', count: 35 },
        { month: '4月', count: 29 }, { month: '5月', count: 31 }, { month: '6月', count: 26 }
      ],
      financeStatus: { collectionRate: 92.5, publicIncome: 156000, publicExpense: 89000, lastUpdate: '2024-06-15' },
      incomeList: [
        { id: 1, category: '物业费', amount: 1250000, description: '2024年上半年物业费收入', date: '2024-06-30' },
        { id: 2, category: '公共收益', amount: 156000, description: '电梯广告、停车场收入', date: '2024-06-30' },
        { id: 3, category: '其他收入', amount: 28000, description: '装修押金退还利息', date: '2024-06-30' }
      ],
      expenseList: [
        { id: 1, category: '人员工资', amount: 450000, description: '物业人员薪酬', date: '2024-06-30' },
        { id: 2, category: '公共设施维护', amount: 180000, description: '电梯维护、绿化养护', date: '2024-06-30' },
        { id: 3, category: '水电费', amount: 95000, description: '公共区域水电费用', date: '2024-06-30' },
        { id: 4, category: '清洁卫生', amount: 68000, description: '保洁服务费用', date: '2024-06-30' },
        { id: 5, category: '安保服务', amount: 52000, description: '保安人员费用', date: '2024-06-30' },
        { id: 6, category: '办公费用', amount: 28000, description: '办公用品', date: '2024-06-30' }
      ],
      publicIncomeFlow: [
        { source: '电梯广告', amount: 45000, use: '小区公共设施维修' },
        { source: '地下停车场', amount: 68000, use: '绿化升级改造' },
        { source: '快递柜租金', amount: 22000, use: '健身器材更新' },
        { source: '场地租赁', amount: 21000, use: '儿童游乐区维护' }
      ],
      complaints: [
        { id: 1, type: '卫生', description: '小区楼道垃圾桶长期未清理，异味严重。', status: 'completed', createdAt: '2024-06-10 14:30', rating: 5 },
        { id: 2, type: '维修', description: '3号楼2单元电梯故障已持续3天。', status: 'processing', createdAt: '2024-06-14 08:20' },
        { id: 3, type: '安保', description: '小区东门门禁系统损坏，外来人员随意进出。', status: 'pending', createdAt: '2024-06-15 16:45' },
        { id: 4, type: '绿化', description: '小区中心花园草坪杂草丛生。', status: 'completed', createdAt: '2024-06-08 09:10', rating: 4 },
        { id: 5, type: '噪音', description: '夜间11点后仍有装修施工噪音。', status: 'processing', createdAt: '2024-06-13 23:15' }
      ],
      complaintTypes: ['卫生', '维修', '安保', '绿化', '噪音', '其他'],
      serviceRecords: [
        { id: 1, serviceType: '保洁服务', title: '楼道日常清洁', description: '每日对小区所有楼道进行清扫', status: 'completed', completedAt: '2024-06-15', rating: 4.7 },
        { id: 2, serviceType: '设施维修', title: '电梯定期维保', description: '每月对所有电梯进行安全检查', status: 'completed', completedAt: '2024-06-10', rating: 4.8 },
        { id: 3, serviceType: '安保服务', title: '24小时巡逻', description: '安保人员全天候巡逻', status: 'completed', completedAt: '2024-06-15', rating: 4.5 },
        { id: 4, serviceType: '绿化养护', title: '草坪修剪', description: '定期修剪小区草坪和灌木', status: 'pending', completedAt: null, rating: null },
        { id: 5, serviceType: '设备维护', title: '消防设备检查', description: '季度消防设备全面检查', status: 'completed', completedAt: '2024-06-01', rating: 5.0 }
      ],
      creditScore: { score: 92, level: '优秀', evaluation: '服务质量优秀，业主满意度高', details: [
        { name: '服务响应速度', score: 95 }, { name: '问题解决率', score: 90 },
        { name: '业主满意度', score: 93 }, { name: '费用透明度', score: 88 }
      ]},
      dashboardStats: { totalComplaints: 156, resolvedComplaints: 142, resolutionRate: 91.0, avgResponseTime: '2.5小时', satisfactionRate: 88.5, pendingCount: 14 },
      heatmapData: [
        { district: '1号楼', count: 28 }, { district: '2号楼', count: 15 }, { district: '3号楼', count: 35 },
        { district: '4号楼', count: 18 }, { district: '5号楼', count: 22 }, { district: '6号楼', count: 14 },
        { district: '7号楼', count: 24 }, { district: '8号楼', count: 10 }
      ],
      companyRanking: [
        { rank: 1, name: '绿城物业', score: 95, complaints: 12 },
        { rank: 2, name: '万科物业', score: 92, complaints: 18 },
        { rank: 3, name: '保利物业', score: 90, complaints: 22 },
        { rank: 4, name: '碧桂园物业', score: 88, complaints: 28 },
        { rank: 5, name: '恒大物业', score: 85, complaints: 35 }
      ]
    };

    const tabs = [
      { key: 'home', label: '首页总览' },
      { key: 'finance', label: '费用透明' },
      { key: 'complaint', label: '投诉中心' },
      { key: 'service', label: '服务记录' },
      { key: 'dashboard', label: '监管看板' }
    ];

    // 费用页数据
    const totalIncome = computed(() => mockData.incomeList.reduce((s, i) => s + i.amount, 0));
    const totalExpense = computed(() => mockData.expenseList.reduce((s, i) => s + i.amount, 0));
    const maxPublicIncome = computed(() => Math.max(...mockData.publicIncomeFlow.map(i => i.amount)));

    // 投诉页数据
    const complaints = ref([...mockData.complaints]);
    const complaintForm = ref({ type: '', description: '', images: [] });
    const filterStatus = ref('');
    const filteredComplaints = computed(() => filterStatus.value ? complaints.value.filter(c => c.status === filterStatus.value) : complaints.value);
    const pendingCount = computed(() => complaints.value.filter(c => c.status === 'pending').length);
    const processingCount = computed(() => complaints.value.filter(c => c.status === 'processing').length);
    const completedCount = computed(() => complaints.value.filter(c => c.status === 'completed').length);

    // 服务页数据
    const filterType = ref('');
    const filteredServices = computed(() => filterType.value ? mockData.serviceRecords.filter(s => s.serviceType === filterType.value) : mockData.serviceRecords);
    const completedServices = computed(() => mockData.serviceRecords.filter(s => s.status === 'completed').length);
    const avgRating = computed(() => {
      const rated = mockData.serviceRecords.filter(s => s.rating);
      return rated.length ? (rated.reduce((s, r) => s + r.rating, 0) / rated.length).toFixed(1) : 'N/A';
    });

    // 监管看板数据
    const maxComplaintCount = computed(() => Math.max(...mockData.heatmapData.map(i => i.count)));

    const trendChartRef = ref(null);
    const financeChartRef = ref(null);
    const typeChartRef = ref(null);
    const ratingChartRef = ref(null);
    const dashboardTrendRef = ref(null);

    const formatMoney = (amount) => '¥' + Math.abs(amount).toLocaleString();
    const getStatusText = (status) => ({ pending: '待处理', processing: '处理中', completed: '已完成' }[status] || status);

    const getHeatColor = (count) => {
      const ratio = count / maxComplaintCount.value;
      if (ratio > 0.7) return 'from-red-500 to-red-700';
      if (ratio > 0.4) return 'from-yellow-400 to-yellow-600';
      return 'from-green-400 to-green-600';
    };

    const submitComplaint = () => {
      if (!complaintForm.value.type || !complaintForm.value.description) {
        alert('请填写投诉类型和描述');
        return;
      }
      complaints.value.unshift({
        id: Date.now(),
        type: complaintForm.value.type,
        description: complaintForm.value.description,
        images: [...complaintForm.value.images],
        status: 'pending',
        createdAt: new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-')
      });
      complaintForm.value = { type: '', description: '', images: [] };
      alert('投诉提交成功');
    };

    const handleTabChange = (tab) => { currentTab.value = tab; };

    onMounted(() => {
      nextTick(() => {
        // 首页趋势图
        if (trendChartRef.value) {
          new Chart(trendChartRef.value, {
            type: 'line',
            data: {
              labels: mockData.complaintTrend.map(i => i.month),
              datasets: [{
                label: '投诉数量',
                data: mockData.complaintTrend.map(i => i.count),
                borderColor: '#ef4444',
                backgroundColor: 'rgba(239, 68, 68, 0.1)',
                fill: true,
                tension: 0.4,
                pointBackgroundColor: '#ef4444',
                pointBorderColor: '#fff',
                pointBorderWidth: 2,
                pointRadius: 4
              }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } }
          });
        }

        // 费用页图表
        if (financeChartRef.value) {
          new Chart(financeChartRef.value, {
            type: 'doughnut',
            data: {
              labels: ['物业费', '公共收益', '人员工资', '设施维护', '水电费', '其他支出'],
              datasets: [{
                data: [1250000, 156000, 450000, 180000, 95000, 148000],
                backgroundColor: ['#22c55e', '#10b981', '#ef4444', '#f97316', '#eab308', '#6b7280'],
                borderWidth: 0
              }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } }, cutout: '60%' }
          });
        }

        // 投诉类型图
        if (typeChartRef.value) {
          const typeCounts = mockData.complaintTypes.map(t => complaints.value.filter(c => c.type === t).length);
          new Chart(typeChartRef.value, {
            type: 'bar',
            data: {
              labels: mockData.complaintTypes,
              datasets: [{ label: '投诉数量', data: typeCounts, backgroundColor: '#3b82f6', borderRadius: 6 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } }
          });
        }

        // 服务评分图
        if (ratingChartRef.value) {
          const ratingCounts = [0, 0, 0, 0, 0];
          mockData.serviceRecords.forEach(s => { if (s.rating) { const idx = Math.floor(s.rating) - 1; if (idx >= 0 && idx < 5) ratingCounts[idx]++; }});
          new Chart(ratingChartRef.value, {
            type: 'bar',
            data: {
              labels: ['1星', '2星', '3星', '4星', '5星'],
              datasets: [{ label: '评价数量', data: ratingCounts, backgroundColor: ['#ef4444', '#f97316', '#eab308', '#84cc16', '#22c55e'], borderRadius: 6 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } }
          });
        }

        // 监管看板趋势图
        if (dashboardTrendRef.value) {
          new Chart(dashboardTrendRef.value, {
            type: 'line',
            data: {
              labels: ['1月', '2月', '3月', '4月', '5月', '6月'],
              datasets: [
                { label: '投诉数', data: [28, 22, 35, 29, 31, 26], borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', fill: true, tension: 0.4 },
                { label: '已解决', data: [26, 21, 32, 28, 29, 24], borderColor: '#22c55e', backgroundColor: 'rgba(34, 197, 94, 0.1)', fill: true, tension: 0.4 }
              ]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } }
          });
        }
      });
    });

    return {
      currentTab, tabs, mockData, handleTabChange,
      // 费用页
      totalIncome, totalExpense, maxPublicIncome, formatMoney,
      // 投诉页
      complaints, complaintForm, filterStatus, filteredComplaints, pendingCount, processingCount, completedCount, getStatusText, submitComplaint,
      // 服务页
      filterType, filteredServices, completedServices, avgRating,
      // 监管看板
      maxComplaintCount, getHeatColor,
      // 图表ref
      trendChartRef, financeChartRef, typeChartRef, ratingChartRef, dashboardTrendRef
    };
  },
  template: `
    <div class="min-h-screen flex flex-col bg-gray-50">
      <!-- 导航栏 -->
      <nav class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-700 rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
              </div>
              <span class="text-xl font-bold text-gray-800">物业监管平台</span>
            </div>
            <div class="flex items-center space-x-2">
              <button v-for="tab in tabs" :key="tab.key" @click="handleTabChange(tab.key)"
                :class="['px-4 py-2 rounded-lg transition-all font-medium', currentTab === tab.key ? 'bg-blue-50 text-blue-600' : 'text-gray-600 hover:bg-gray-50']">
                {{ tab.label }}
              </button>
            </div>
          </div>
        </div>
      </nav>

      <main class="flex-1">
        <!-- 首页总览 -->
        <div v-if="currentTab === 'home'" class="animate-fade-in">
          <div class="bg-gradient-to-r from-blue-600 to-blue-800 text-white py-12">
            <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between">
              <div>
                <h1 class="text-3xl font-bold mb-2">欢迎来到物业监管平台</h1>
                <p class="text-blue-200">实时了解小区服务动态，共建美好家园</p>
              </div>
              <button @click="handleTabChange('complaint')" class="mt-6 md:mt-0 bg-white text-blue-600 px-6 py-3 rounded-lg font-medium hover:bg-blue-50 transition-colors">
                提交投诉
              </button>
            </div>
          </div>

          <div class="max-w-7xl mx-auto px-4 py-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
              <!-- 评分卡片 -->
              <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                <div class="flex items-center justify-between mb-4">
                  <div>
                    <p class="text-gray-500 text-sm">小区服务评分</p>
                    <div class="flex items-baseline mt-2">
                      <span class="text-4xl font-bold text-blue-600">{{ mockData.score }}</span>
                      <span class="text-gray-400 ml-1">/5.0</span>
                    </div>
                  </div>
                  <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center">
                    <svg class="w-8 h-8 text-blue-500" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                  </div>
                </div>
                <div class="flex space-x-1 mb-4">
                  <svg v-for="i in 5" :key="i" class="w-5 h-5" :class="i <= Math.floor(mockData.score) ? 'text-yellow-400' : 'text-gray-200'" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                </div>
                <div class="grid grid-cols-2 gap-4 pt-4 border-t border-gray-100 text-sm">
                  <div><p class="text-gray-500">卫生</p><p class="font-semibold">{{ mockData.scoreDetails.hygiene }}</p></div>
                  <div><p class="text-gray-500">维修</p><p class="font-semibold">{{ mockData.scoreDetails.maintenance }}</p></div>
                  <div><p class="text-gray-500">安保</p><p class="font-semibold">{{ mockData.scoreDetails.security }}</p></div>
                  <div><p class="text-gray-500">服务</p><p class="font-semibold">{{ mockData.scoreDetails.service }}</p></div>
                </div>
              </div>

              <!-- 趋势图 -->
              <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                <p class="text-gray-500 text-sm">投诉趋势</p>
                <p class="text-xl font-bold text-gray-800 mt-2 mb-4">近6个月</p>
                <div class="chart-container h-40"><canvas ref="trendChartRef"></canvas></div>
              </div>

              <!-- 费用状态 -->
              <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                <p class="text-gray-500 text-sm">费用公示状态</p>
                <p class="text-xl font-bold text-gray-800 mt-2 mb-4">更新: {{ mockData.financeStatus.lastUpdate }}</p>
                <div class="mb-4">
                  <div class="flex justify-between text-sm mb-1">
                    <span class="text-gray-500">物业费收缴率</span>
                    <span class="font-semibold">{{ mockData.financeStatus.collectionRate }}%</span>
                  </div>
                  <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                    <div class="h-full bg-blue-500 rounded-full" :style="{ width: mockData.financeStatus.collectionRate + '%' }"></div>
                  </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                  <div class="bg-green-50 rounded-lg p-3">
                    <p class="text-green-600 text-sm">公共收益</p>
                    <p class="text-xl font-bold text-green-700">{{ formatMoney(mockData.financeStatus.publicIncome) }}</p>
                  </div>
                  <div class="bg-blue-50 rounded-lg p-3">
                    <p class="text-blue-600 text-sm">公共支出</p>
                    <p class="text-xl font-bold text-blue-700">{{ formatMoney(mockData.financeStatus.publicExpense) }}</p>
                  </div>
                </div>
              </div>
            </div>

            <!-- 快捷入口 -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
              <button @click="handleTabChange('finance')" class="bg-gradient-to-br from-blue-500 to-blue-600 text-white p-6 rounded-xl hover:from-blue-600 hover:to-blue-700 transition-all hover:shadow-lg">
                <svg class="w-10 h-10 mx-auto mb-3"><path fill="currentColor" d="M21 4H3a1 1 0 00-1 1v14a1 1 0 001 1h18a1 1 0 001-1V5a1 1 0 00-1-1zm-1 14H4V6h16v12zM7 9h2v2H7V9zm0 4h2v2H7v-2zm4-4h6v2h-6V9zm0 4h6v2h-6v-2z"/></svg>
                <h3 class="font-semibold">费用透明</h3>
              </button>
              <button @click="handleTabChange('complaint')" class="bg-gradient-to-br from-red-500 to-red-600 text-white p-6 rounded-xl hover:from-red-600 hover:to-red-700 transition-all hover:shadow-lg">
                <svg class="w-10 h-10 mx-auto mb-3"><path fill="currentColor" d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
                <h3 class="font-semibold">投诉中心</h3>
              </button>
              <button @click="handleTabChange('service')" class="bg-gradient-to-br from-green-500 to-green-600 text-white p-6 rounded-xl hover:from-green-600 hover:to-green-700 transition-all hover:shadow-lg">
                <svg class="w-10 h-10 mx-auto mb-3"><path fill="currentColor" d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
