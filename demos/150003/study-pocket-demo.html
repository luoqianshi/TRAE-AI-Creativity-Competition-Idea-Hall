<body>
<div id="app"></div>
<script>
const STORAGE_KEY = 'study-pocket-state-v1'
const app = document.querySelector('#app')

const todayKey = () => new Date().toISOString().slice(0, 10)
const uid = () => crypto.randomUUID()
const clamp = (value, min, max) => Math.min(Math.max(value, min), max)

const seedState = () => ({
  view: 'today',
  selectedDate: todayKey(),
  calendarCursor: todayKey(),
  calendarMode: 'month',
  activeTag: '',
  tasks: [
    {
      id: uid(),
      title: '英语听力 20 分钟',
      time: '08:20',
      date: todayKey(),
      note: '通勤路上完成',
      done: false,
    },
    {
      id: uid(),
      title: '复盘错题并摘录',
      time: '19:30',
      date: todayKey(),
      note: '整理成知识卡片',
      done: false,
    },
  ],
  cards: [
    {
      id: uid(),
      text: '费曼学习法：用最简单的话解释一个概念，卡住的地方就是知识漏洞。',
      tags: ['方法', '复盘'],
      size: 17,
      color: '#111111',
      pinned: false,
    },
  ],
  focus: {
    name: '深度学习',
    minutes: 25,
    remaining: 25 * 60,
    running: false,
    background: '',
    sessions: [],
  },
  countdown: {
    title: '距离今日复盘',
    target: `${todayKey()}T22:00`,
    size: 44,
    color: '#0b0b0b',
  },
})

let state = loadState()
let timer

function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY)
  if (!raw) return seedState()
  try {
    const parsed = JSON.parse(raw)
    const merged = { ...seedState(), ...parsed }
    merged.cards = merged.cards.map((card) => ({ ...card, pinned: !!(card.pinned) }))
    return merged
  } catch {
    return seedState()
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state))
  } catch {
    alert('保存失败：手机浏览器本地存储空间可能已满，请先删除过大的番茄钟背景图或清理浏览器缓存后再试。')
  }
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, (char) => {
    const map = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;',
    }
    return map[char]
  })
}

function formatDateLabel(dateKey) {
  const date = new Date(`${dateKey}T00:00:00`)
  return date.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' })
}

function tasksForDate(dateKey) {
  return state.tasks.filter((task) => task.date === dateKey).sort((a, b) => a.time.localeCompare(b.time))
}

function allTags() {
  return Array.from(new Set(state.cards.flatMap((card) => card.tags))).filter(Boolean)
}

function getCountdownText() {
  const diff = new Date(state.countdown.target).getTime() - Date.now()
  if (isNaN(diff)) return '请设置倒计时'
  if (diff <= 0) return '已到达'
  const days = Math.floor(diff / 86400000)
  const hours = Math.floor((diff % 86400000) / 3600000)
  const minutes = Math.floor((diff % 3600000) / 60000)
  const seconds = Math.floor((diff % 60000) / 1000)
  return days > 0 ? `${days}天 ${hours}时 ${minutes}分` : `${hours}时 ${minutes}分 ${seconds}秒`
}

function navigate(view) {
  state.view = view
  saveState()
  render()
}

function render() {
  app.innerHTML = `
    <main class="phone-shell ${state.view === 'focus' && state.focus.background ? 'has-bg' : ''}" style="${state.view === 'focus' && state.focus.background ? `background-image:url(${state.focus.background})` : ''}">
      <section class="top-bar">
        <div>
          <h1>${viewTitle()}</h1>
        </div>
        <button class="ghost-btn" data-action="install">安装</button>
      </section>
      <section class="view-stage">${renderCurrentView()}</section>
      <nav class="bottom-nav" aria-label="主功能">
        ${navButton('calendar', '日历')}
        ${navButton('today', '事项')}
        ${navButton('cards', '卡片')}
        ${navButton('focus', '番茄')}
      </nav>
      <dialog class="editor-dialog" id="editor"></dialog>
    </main>
  `
  bindEvents()
}

function viewTitle() {
  const titles = {
    today: '今日事项',
    calendar: '日历视图',
    cards: '碎片卡片',
    focus: '番茄专注',
  }
  return titles[state.view]
}

function iconSvg(view) {
  const icons = {
    calendar: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M8 3v4M16 3v4M4 10h16"></path></svg>`,
    today: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M7.5 12.5l3 3 6-7"></path></svg>`,
    cards: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="12" height="16" rx="2"></rect><path d="M9 9h6M9 13h4"></path></svg>`,
    focus: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v5l3 2"></path></svg>`,
  }
  return icons[view]
}

function navButton(view, label) {
  return `<button class="nav-item ${state.view === view ? 'active' : ''}" data-view="${view}" aria-label="${label}">
    ${iconSvg(view)}<small>${label}</small>
  </button>`
}

function renderCurrentView() {
  if (state.view === 'calendar') return renderCalendar()
  if (state.view === 'cards') return renderCards()
  if (state.view === 'focus') return renderFocus()
  return renderToday()
}

function renderToday() {
  const tasks = tasksForDate(todayKey())
  return `
    <section class="countdown-card" style="--countdown-color:${state.countdown.color}; --countdown-size:${state.countdown.size}px">
      <button class="mini-action" data-action="edit-countdown">样式/时间</button>
      <p>${escapeHtml(state.countdown.title)}</p>
      <strong>${getCountdownText()}</strong>
    </section>
    <section class="section-head">
      <div><span>${formatDateLabel(todayKey())}</span><b>${tasks.length} 项</b></div>
      <button class="round-btn" data-action="new-task">+</button>
    </section>
    <div class="task-list">
      ${tasks.map(renderTask).join('') || '<div class="empty">今天还没有事项，点击右侧 + 添加第一项。</div>'}
    </div>
    <p class="hint">提示：长按事项可修改、删除或复制添加；在此页左滑可进入日历。</p>
  `
}

function renderTask(task) {
  return `
    <article class="task-card ${task.done ? 'done' : ''}" data-task="${task.id}">
      <time>${task.time}</time>
      <div>
        <h3>${escapeHtml(task.title)}</h3>
        <p>${escapeHtml(task.note || '无备注')}</p>
      </div>
      <button class="check" data-action="toggle-task" data-id="${task.id}">${task.done ? '✓' : ''}</button>
    </article>
  `
}

function renderCalendar() {
  const cursor = new Date(`${state.calendarCursor}T00:00:00`)
  const title = cursor.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long' })
  return `
    <section class="calendar-toolbar">
      <button data-action="prev-period">‹</button>
      <strong>${state.calendarMode === 'month' ? title : `${cursor.getFullYear()} 年`}</strong>
      <button data-action="next-period">›</button>
      <button class="toggle" data-action="toggle-calendar-mode">${state.calendarMode === 'month' ? '月历' : '年历'}</button>
    </section>
    ${state.calendarMode === 'month' ? renderMonth(cursor) : renderYear(cursor)}
    <section class="day-strip">
      <b>${formatDateLabel(state.selectedDate)}</b>
      ${tasksForDate(state.selectedDate)
        .map((task) => `<span>${task.time} ${escapeHtml(task.title)}</span>`)
        .join('') || '<span>当天暂无事项</span>'}
    </section>
  `
}

function renderMonth(cursor) {
  const year = cursor.getFullYear()
  const month = cursor.getMonth()
  const firstDay = new Date(year, month, 1).getDay()
  const total = new Date(year, month + 1, 0).getDate()
  const cells = Array.from({ length: firstDay + total }, (_, index) => {
    if (index < firstDay) return '<div class="date-cell muted"></div>'
    const day = index - firstDay + 1
    const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`
    const count = tasksForDate(dateKey).length
    return `<button class="date-cell ${state.selectedDate === dateKey ? 'selected' : ''}" data-date="${dateKey}">
      <b>${day}</b>${count ? `<small>${count}项</small>` : ''}
    </button>`
  })
  return `
    <div class="week-grid">${['日', '一', '二', '三', '四', '五', '六'].map((d) => `<span>${d}</span>`).join('')}</div>
    <div class="month-grid">${cells.join('')}</div>
  `
}

function renderYear(cursor) {
  const year = cursor.getFullYear()
  return `<div class="year-grid">
    ${Array.from({ length: 12 }, (_, index) => {
      const monthKey = `${year}-${String(index + 1).padStart(2, '0')}`
      const count = state.tasks.filter((task) => task.date.startsWith(monthKey)).length
      return `<button data-month="${monthKey}-01"><b>${index + 1}月</b><span>${count} 项</span></button>`
    }).join('')}
  </div>`
}

function renderCards() {
  const tags = allTags()
  const cards = (state.activeTag ? state.cards.filter((card) => card.tags.includes(state.activeTag)) : state.cards)
    .slice()
    .sort((a, b) => Number(b.pinned) - Number(a.pinned))
  return `
    <section class="card-tools">
      <button class="tag-menu" data-action="cycle-tag">${state.activeTag || '全部标签'}</button>
      <button class="round-btn" data-action="new-card">+</button>
    </section>
    <div class="tag-row">
      <button class="${!state.activeTag ? 'selected' : ''}" data-tag="">全部</button>
      ${tags.map((tag) => `<button class="${state.activeTag === tag ? 'selected' : ''}" data-tag="${escapeHtml(tag)}">${escapeHtml(tag)}</button>`).join('')}
    </div>
    <section class="knowledge-grid">
      ${cards.map(renderKnowledgeCard).join('') || '<div class="empty">还没有卡片，点击右上角 + 创建。</div>'}
    </section>
  `
}

function renderKnowledgeCard(card) {
  return `
    <article class="knowledge-card ${card.pinned ? 'pinned' : ''}" data-card="${card.id}">
      <button class="pin-btn" data-action="toggle-pin" data-id="${card.id}">${card.pinned ? '已置顶' : '置顶'}</button>
      <p style="font-size:${card.size}px;color:${card.color}">${escapeHtml(card.text)}</p>
      <div>${card.tags.map((tag) => `<span>#${escapeHtml(tag)}</span>`).join('')}</div>
    </article>
  `
}

function renderFocus() {
  const circumference = 2 * Math.PI * 94
  const progress = 1 - state.focus.remaining / (state.focus.minutes * 60)
  const dash = circumference * clamp(progress, 0, 1)
  return `
    <section class="focus-panel">
      <div class="focus-actions">
        <label class="upload-btn">背景<input type="file" accept="image/*" data-action="upload-bg" /></label>
        <button data-action="edit-focus">设置</button>
        <button data-action="show-chart">统计</button>
      </div>
      <button class="timer-orb ${state.focus.running ? 'running' : ''}" data-action="toggle-focus" aria-label="开始或暂停番茄钟">
        <svg viewBox="0 0 240 240">
          <circle cx="120" cy="120" r="94"></circle>
          <circle cx="120" cy="120" r="94" style="stroke-dasharray:${dash} ${circumference}"></circle>
        </svg>
        <span>${escapeHtml(state.focus.name)}</span>
        <strong>${formatSeconds(state.focus.remaining)}</strong>
        <small>${state.focus.running ? '点击暂停' : '点击开始'}</small>
      </button>
      <button class="reset-btn" data-action="reset-focus">重置本轮</button>
    </section>
  `
}

function formatSeconds(total) {
  const minutes = Math.floor(total / 60)
  const seconds = total % 60
  return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`
}

function bindEvents() {
  app.querySelectorAll('[data-view]').forEach((button) => {
    button.addEventListener('click', () => navigate(button.dataset.view))
  })

  app.querySelectorAll('[data-action]').forEach((element) => {
    if (element instanceof HTMLInputElement && element.dataset.action === 'upload-bg') {
      element.addEventListener('change', (event) => handleBackgroundUpload(event))
      return
    }
    element.addEventListener('click', (event) => {
      const action = event.currentTarget.dataset.action
      if (!action) return
      handleAction(action, event)
    })
  })

  app.querySelectorAll('[data-date]').forEach((button) => {
    button.addEventListener('click', () => {
      state.selectedDate = button.dataset.date
      saveState()
      render()
    })
  })

  app.querySelectorAll('[data-month]').forEach((button) => {
    button.addEventListener('click', () => {
      state.calendarCursor = button.dataset.month
      state.calendarMode = 'month'
      saveState()
      render()
    })
  })

  app.querySelectorAll('[data-tag]').forEach((button) => {
    button.addEventListener('click', () => {
      state.activeTag = button.dataset.tag || ''
      saveState()
      render()
    })
  })

  bindLongPress()
  bindSwipe()
}

function bindLongPress() {
  let pressTimer
  app.querySelectorAll('[data-task], [data-card]').forEach((item) => {
    item.addEventListener('pointerdown', (event) => {
      if (event.target.closest('[data-action]')) return
      pressTimer = window.setTimeout(() => {
        if (item.dataset.task) openTaskEditor(item.dataset.task)
        if (item.dataset.card) openCardEditor(item.dataset.card)
      }, 550)
    })
    item.addEventListener('pointerup', () => clearTimeout(pressTimer))
    item.addEventListener('pointerleave', () => clearTimeout(pressTimer))
  })
}

function bindSwipe() {
  const stage = app.querySelector('.view-stage')
  if (!stage) return
  let startX = 0
  stage.addEventListener('touchstart', (event) => {
    startX = event.touches[0].clientX
  })
  stage.addEventListener('touchend', (event) => {
    const diff = event.changedTouches[0].clientX - startX
    if (state.view === 'today' && diff < -60) navigate('calendar')
    if (state.view === 'calendar' && diff > 60) navigate('today')
  })
}

function handleAction(action, event) {
  const target = event.currentTarget
  if (action === 'install') showInstallHelp()
  if (action === 'new-task') openTaskEditor()
  if (action === 'edit-countdown') openCountdownEditor()
  if (action === 'toggle-task') toggleTask(target.dataset.id)
  if (action === 'prev-period') shiftCalendar(-1)
  if (action === 'next-period') shiftCalendar(1)
  if (action === 'toggle-calendar-mode') toggleCalendarMode()
  if (action === 'new-card') openCardEditor()
  if (action === 'cycle-tag') cycleTag()
  if (action === 'upload-bg') handleBackgroundUpload(event)
  if (action === 'edit-focus') openFocusEditor()
  if (action === 'toggle-focus') toggleFocus()
  if (action === 'reset-focus') resetFocus()
  if (action === 'show-chart') openChart()
  if (action === 'toggle-pin') togglePin(target.dataset.id)
}

function toggleTask(id) {
  const task = state.tasks.find((item) => item.id === id)
  if (!task) return
  task.done = !task.done
  saveState()
  render()
}

function shiftCalendar(direction) {
  const date = new Date(`${state.calendarCursor}T00:00:00`)
  if (state.calendarMode === 'month') date.setMonth(date.getMonth() + direction)
  else date.setFullYear(date.getFullYear() + direction)
  state.calendarCursor = date.toISOString().slice(0, 10)
  saveState()
  render()
}

function toggleCalendarMode() {
  state.calendarMode = state.calendarMode === 'month' ? 'year' : 'month'
  saveState()
  render()
}

function cycleTag() {
  const tags = allTags()
  if (!tags.length) return
  const index = tags.indexOf(state.activeTag)
  state.activeTag = tags[(index + 1) % tags.length]
  saveState()
  render()
}

function togglePin(id) {
  const card = state.cards.find((item) => item.id === id)
  if (!card) return
  card.pinned = !card.pinned
  saveState()
  render()
}

function openDialog(content) {
  const dialog = app.querySelector('#editor')
  dialog.innerHTML = content
  dialog.showModal()
  dialog.querySelector('[data-close]')?.addEventListener('click', () => dialog.close())
  return dialog
}

function openTaskEditor(id) {
  const task = state.tasks.find((item) => item.id === id)
  const dialog = openDialog(`
    <form method="dialog" class="form-grid" id="task-form">
      <h2>${task ? '编辑事项' : '添加事项'}</h2>
      <label>标题<input name="title" value="${escapeHtml(task?.title || '')}" required /></label>
      <label>日期<input type="date" name="date" value="${task?.date || state.selectedDate || todayKey()}" required /></label>
      <label>时间<input type="time" name="time" value="${task?.time || '09:00'}" required /></label>
      <label>备注<textarea name="note">${escapeHtml(task?.note || '')}</textarea></label>
      <div class="form-actions">
        ${task ? '<button type="button" class="danger" data-delete>删除</button><button type="button" data-copy>复制添加</button>' : ''}
        <button type="button" data-close>取消</button>
        <button>保存</button>
      </div>
    </form>
  `)
  dialog.querySelector('#task-form').addEventListener('submit', (event) => {
    event.preventDefault()
    const data = new FormData(event.currentTarget)
    const next = {
      id: task?.id || uid(),
      title: String(data.get('title')),
      date: String(data.get('date')),
      time: String(data.get('time')),
      note: String(data.get('note')),
      done: task?.done || false,
    }
    if (task) Object.assign(task, next)
    else state.tasks.push(next)
    saveState()
    dialog.close()
    render()
  })
  dialog.querySelector('[data-delete]')?.addEventListener('click', () => {
    state.tasks = state.tasks.filter((item) => item.id !== id)
    saveState()
    dialog.close()
    render()
  })
  dialog.querySelector('[data-copy]')?.addEventListener('click', () => {
    if (task) state.tasks.push({ ...task, id: uid(), title: `${task.title} 副本` })
    saveState()
    dialog.close()
    render()
  })
}

function openCountdownEditor() {
  const dialog = openDialog(`
    <form method="dialog" class="form-grid" id="countdown-form">
      <h2>倒计时设置</h2>
      <label>文字<input name="title" value="${escapeHtml(state.countdown.title)}" /></label>
      <label>目标时间<input type="datetime-local" name="target" value="${state.countdown.target}" /></label>
      <label>字号<input type="range" min="28" max="70" name="size" value="${state.countdown.size}" /></label>
      <label>颜色<input type="color" name="color" value="${state.countdown.color}" /></label>
      <div class="form-actions"><button type="button" data-close>取消</button><button>保存</button></div>
    </form>
  `)
  dialog.querySelector('#countdown-form').addEventListener('submit', (event) => {
    event.preventDefault()
    const data = new FormData(event.currentTarget)
    state.countdown = {
      title: String(data.get('title')),
      target: String(data.get('target')),
      size: Number(data.get('size')),
      color: String(data.get('color')),
    }
    saveState()
    dialog.close()
    render()
  })
}

function openCardEditor(id) {
  const card = state.cards.find((item) => item.id === id)
  const defaultTags = card?.tags.join(',') || state.activeTag
  const dialog = openDialog(`
    <form method="dialog" class="form-grid" id="card-form">
      <h2>${card ? '编辑卡片' : '添加卡片'}</h2>
      <label>内容<textarea name="text" required>${escapeHtml(card?.text || '')}</textarea></label>
      <label>标签，用逗号分隔<input name="tags" value="${escapeHtml(defaultTags)}" /></label>
      <label>字号<input type="range" min="14" max="28" name="size" value="${card?.size || 17}" /></label>
      <label>文字颜色<input type="color" name="color" value="${card?.color || '#111111'}" /></label>
      <div class="form-actions">
        ${card ? '<button type="button" class="danger" data-delete>删除</button>' : ''}
        <button type="button" data-close>取消</button>
        <button type="submit">保存</button>
      </div>
    </form>
  `)
  dialog.querySelector('#card-form').addEventListener('submit', (event) => {
    event.preventDefault()
    const data = new FormData(event.currentTarget)
    const tags = String(data.get('tags')).split(/[,，]/).map((tag) => tag.trim()).filter(Boolean)
    if (!card && state.activeTag && !tags.includes(state.activeTag)) tags.push(state.activeTag)
    const next = {
      id: card?.id || uid(),
      text: String(data.get('text')),
      tags,
      size: Number(data.get('size')),
      color: String(data.get('color')),
      pinned: card?.pinned || false,
    }
    if (card) Object.assign(card, next)
    else state.cards.push(next)
    saveState()
    dialog.close()
    render()
  })
  dialog.querySelector('[data-delete]')?.addEventListener('click', () => {
    state.cards = state.cards.filter((item) => item.id !== id)
    saveState()
    dialog.close()
    render()
  })
}

function handleBackgroundUpload(event) {
  const input = event.target
  const file = input.files?.[0]
  if (!file) return
  const reader = new FileReader()
  reader.addEventListener('load', () => {
    state.focus.background = String(reader.result)
    saveState()
    render()
  })
  reader.readAsDataURL(file)
}

function openFocusEditor() {
  const dialog = openDialog(`
    <form method="dialog" class="form-grid" id="focus-form">
      <h2>番茄钟设置</h2>
      <label>名称<input name="name" value="${escapeHtml(state.focus.name)}" /></label>
      <label>分钟<input type="number" min="1" max="180" name="minutes" value="${state.focus.minutes}" /></label>
      <div class="form-actions"><button type="button" data-close>取消</button><button>保存</button></div>
    </form>
  `)
  dialog.querySelector('#focus-form').addEventListener('submit', (event) => {
    event.preventDefault()
    const data = new FormData(event.currentTarget)
    state.focus.name = String(data.get('name'))
    state.focus.minutes = clamp(Number(data.get('minutes')), 1, 180)
    state.focus.remaining = state.focus.minutes * 60
    state.focus.running = false
    saveState()
    dialog.close()
    render()
  })
}

function toggleFocus() {
  state.focus.running = !state.focus.running
  saveState()
  render()
  manageTimer()
}

function resetFocus() {
  state.focus.running = false
  state.focus.remaining = state.focus.minutes * 60
  saveState()
  render()
  manageTimer()
}

function manageTimer() {
  if (timer) clearInterval(timer)
  if (!state.focus.running) return
  timer = window.setInterval(() => {
    state.focus.remaining -= 1
    if (state.focus.remaining <= 0) {
      state.focus.sessions.unshift({
        id: uid(),
        name: state.focus.name,
        minutes: state.focus.minutes,
        date: todayKey(),
      })
      state.focus.running = false
      state.focus.remaining = state.focus.minutes * 60
      clearInterval(timer)
    }
    saveState()
    render()
    manageTimer()
  }, 1000)
}

function openChart() {
  const totals = state.focus.sessions.reduce((result, item) => {
    result[item.name] = (result[item.name] || 0) + item.minutes
    return result
  }, {})
  const total = Object.values(totals).reduce((sum, value) => sum + value, 0)
  let offset = 0
  const colors = ['#111111', '#707070', '#b9b1a5', '#e5dfd3', '#8c8c8c']
  const gradient = Object.entries(totals)
    .map((entry, index) => {
      const value = entry[1]
      const start = offset
      const end = offset + (value / Math.max(total, 1)) * 100
      offset = end
      return `${colors[index % colors.length]} ${start}% ${end}%`
    })
    .join(', ')
  openDialog(`
    <section class="chart-card">
      <h2>番茄钟统计</h2>
      <div class="pie" style="background:${total ? `conic-gradient(${gradient})` : '#ddd'}"></div>
      ${Object.entries(totals).map((entry) => `<p><b>${escapeHtml(entry[0])}</b><span>${entry[1]} 分钟</span></p>`).join('') || '<p>完成一次番茄钟后会显示统计。</p>'}
      <button data-close>关闭</button>
    </section>
  `)
}

function showInstallHelp() {
  openDialog(`
    <section class="install-help">
      <h2>下载安装到手机/平板</h2>
      <p>部署后用手机浏览器打开网址，iPhone/iPad 点 Safari 分享按钮选择"添加到主屏幕"；安卓 Chrome 点右上角菜单选择"安装应用"或"添加到主屏幕"。</p>
      <p>本应用已包含 PWA 配置，安装后会像普通 App 一样显示图标和独立窗口。</p>
      <button data-close>知道了</button>
    </section>
  `)
}

window.setInterval(() => {
  if (state.view === 'today') render()
}, 1000)

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => undefined)
  })
}

render()
manageTimer()
</script>
</body>
</html>
