<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Dating</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-mark"></div>
        <div>
          <p class="eyebrow">互动体验 Demo</p>
          <h1>Agent Dating</h1>
        </div>
        <div class="stage-pill" id="stagePill">尚未开始</div>
      </header>

      <section class="game-frame">
        <aside class="side-panel">
          <div class="agent-card">
            <div class="agent-orb" id="agentOrb">
              <span></span>
            </div>
            <p class="label">你的专属助手</p>
            <h2 id="agentStatus">待开启</h2>
            <p id="agentLine">不想只靠左滑右滑做决定时，可以让我先帮你看清楚。</p>
          </div>

          <div class="progress-list" id="progressList"></div>

          <div class="meter-box">
            <div class="meter-row">
              <span>自主指数</span>
              <strong id="autonomyScore">50</strong>
            </div>
            <div class="meter">
              <div id="autonomyMeter"></div>
            </div>
            <div class="meter-row">
              <span>安全指数</span>
              <strong id="safetyScore">50</strong>
            </div>
            <div class="meter">
              <div id="safetyMeter"></div>
            </div>
            <div class="meter-row">
              <span>缘分指数</span>
              <strong id="connectionScore">50</strong>
            </div>
            <div class="meter">
              <div id="connectionMeter"></div>
            </div>
          </div>
        </aside>

        <section class="stage" id="stage"></section>
      </section>
    </main>

    <template id="collageTemplate">
      <div class="collage">
        <div class="photo photo-a"></div>
        <div class="photo photo-b"></div>
        <div class="paper-note">双向匹配<br />建议见面</div>
        <div class="phone-card">97%<br /><span>匹配度</span></div>
        <div class="scribble"></div>
      </div>
    </template>

    <script src="script.js"></script>
  </body>
</html>
