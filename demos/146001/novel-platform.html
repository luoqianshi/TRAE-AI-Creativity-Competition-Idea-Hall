const categoryLabels = { fantasy: '玄幻', urban: '都市', xianxia: '仙侠', scifi: '科幻', romance: '言情', mystery: '悬疑', horror: '恐怖' };
const categoryColors = { fantasy: 'from-amber-600 to-orange-600', urban: 'from-blue-600 to-cyan-600', xianxia: 'from-purple-600 to-indigo-600', scifi: 'from-emerald-600 to-teal-600', romance: 'from-pink-600 to-rose-600', mystery: 'from-slate-600 to-gray-600', horror: 'from-red-700 to-red-900' };

function getNovels() { return demoNovels; }
function getNovel(id) { return demoNovels.find(n => n.id === id); }
function getChapters(novelId) { return demoChapters.filter(c => c.novelId === novelId).sort((a, b) => a.order - b.order); }
function getChapter(id) { return demoChapters.find(c => c.id === id); }
function getTrainableCharacters(novelId) { return demoCharacters.filter(c => c.novelId === novelId); }

function createReaderProgress(novelId) {
  const chapters = getChapters(novelId);
  const characters = getTrainableCharacters(novelId);
  const firstChapter = chapters.find(c => !c.isLocked) || chapters[0];
  return {
    novelId, currentChapterId: firstChapter?.id || '', currentPosition: 0,
    completedNodes: [], storyFlags: [],
    characterStates: characters.reduce((acc, char) => {
      acc[char.id] = {
        characterId: char.id, currentStage: 0,
        attributes: char.attributes.reduce((a, attr) => { a[attr.id] = attr.currentValue; return a; }, {}),
        unlockedSkills: [], unlockedOutfits: ['outfit_default'],
      };
      return acc;
    }, {}),
    lastReadAt: Date.now(), totalReadTime: 0, choicesMade: [],
  };
}

function isChapterUnlocked(chapter, progress) {
  if (!chapter.isLocked) return true;
  const chapters = getChapters(chapter.novelId);
  const prevChapter = chapters.find(c => c.order === chapter.order - 1);
  if (!prevChapter) return true;
  return prevChapter.interactionNodes.every(n => progress.completedNodes.includes(n.id));
}

function applyAttributeChanges(progress, changes) {
  for (const change of changes) {
    for (const charId in progress.characterStates) {
      const state = progress.characterStates[charId];
      if (state.attributes[change.attributeId] !== undefined) {
        let newValue = state.attributes[change.attributeId] + change.value;
        const char = getTrainableCharacters(progress.novelId).find(c => c.id === charId);
        const attr = char?.attributes.find(a => a.id === change.attributeId);
        if (attr) newValue = Math.max(0, Math.min(newValue, attr.maxValue));
        state.attributes[change.attributeId] = newValue;
      }
    }
  }
}

function checkEvolution(progress, characterId) {
  const char = getTrainableCharacters(progress.novelId).find(c => c.id === characterId);
  const state = progress.characterStates[characterId];
  if (!char || !state) return;
  for (const stage of char.evolutionStages) {
    if (stage.stage <= state.currentStage) continue;
    const meets = stage.requiredAttributes.every(req => (state.attributes[req.attributeId] || 0) >= req.minValue);
    if (meets) {
      state.currentStage = stage.stage;
      for (const skillId of stage.unlockedSkills) {
        if (!state.unlockedSkills.includes(skillId)) state.unlockedSkills.push(skillId);
      }
      const outfit = char.outfits.find(o => o.requiredStage === stage.stage);
      if (outfit && !state.unlockedOutfits.includes(outfit.id)) state.unlockedOutfits.push(outfit.id);
    }
  }
}

function processNodeChoice(progress, node, choiceId) {
  const newProgress = { ...progress, completedNodes: [...progress.completedNodes, node.id], choicesMade: [...progress.choicesMade, { nodeId: node.id, choiceId, timestamp: Date.now() }] };
  const choice = node.choices?.find(c => c.id === choiceId);
  if (!choice) return { progress: newProgress, result: '选择无效' };
  if (choice.attributeChanges) applyAttributeChanges(newProgress, choice.attributeChanges);
  if (choice.storyFlags) newProgress.storyFlags = [...new Set([...newProgress.storyFlags, ...choice.storyFlags])];
  if (choice.nextChapterId) newProgress.currentChapterId = choice.nextChapterId;
  return { progress: newProgress, result: '选择已生效' };
}

function completeTask(progress, node) {
  const newProgress = { ...progress, completedNodes: [...progress.completedNodes, node.id] };
  if (node.task?.attributeChanges) applyAttributeChanges(newProgress, node.task.attributeChanges);
  if (node.task?.storyFlags) newProgress.storyFlags = [...new Set([...newProgress.storyFlags, ...node.task.storyFlags])];
  return { progress: newProgress, result: `任务完成：${node.task?.rewardDescription || ''}` };
}

function processCheckpoint(progress, node) {
  const newProgress = { ...progress, completedNodes: [...progress.completedNodes, node.id] };
  const checkpoint = node.checkpoint;
  if (!checkpoint) return { progress: newProgress, passed: true, outcome: '' };
  let passed = false;
  if (checkpoint.condition.type === 'attribute_min') {
    for (const charId in newProgress.characterStates) {
      if ((newProgress.characterStates[charId].attributes[checkpoint.condition.attributeId] || 0) >= (checkpoint.condition.value || 0)) { passed = true; break; }
    }
  }
  const outcome = passed ? checkpoint.passOutcome : checkpoint.failOutcome;
  if (outcome.attributeChanges) applyAttributeChanges(newProgress, outcome.attributeChanges);
  if (outcome.storyFlags) newProgress.storyFlags = [...new Set([...newProgress.storyFlags, ...outcome.storyFlags])];
  if (outcome.nextChapterId) newProgress.currentChapterId = outcome.nextChapterId;
  return { progress: newProgress, passed, outcome: outcome.description };
}

function processGrowthEvent(progress, node) {
  const newProgress = { ...progress, completedNodes: [...progress.completedNodes, node.id] };
  const event = node.growthEvent;
  if (!event) return { progress: newProgress, result: '' };
  if (event.attributeChanges) applyAttributeChanges(newProgress, event.attributeChanges);
  const charState = newProgress.characterStates[event.characterId];
  if (charState && event.newSkills) charState.unlockedSkills = [...new Set([...charState.unlockedSkills, ...event.newSkills])];
  checkEvolution(newProgress, event.characterId);
  return { progress: newProgress, result: '角色成长已应用' };
}

function isChoiceAvailable(choice, progress) {
  if (!choice.hiddenRequirements || choice.hiddenRequirements.length === 0) return true;
  return choice.hiddenRequirements.every(req => progress.storyFlags.includes(req));
}

// ===================== 全局状态钩子 =====================
function useGlobalState() {
  const [state, setState] = useState(() => {
    const stored = localStorage.getItem('novel-platform-data');
    if (stored) {
      try { return JSON.parse(stored); } catch(e) {}
    }
    return {
      novels: demoNovels,
      readerProgress: {},
      achievements: readerAchievements.map(a => ({ ...a, unlocked: false })),
      bookmarkedNovels: [],
      currentNovelId: null,
      currentChapterId: null,
    };
  });

  const save = (next) => {
    setState(prev => {
      const s = typeof next === 'function' ? next(prev) : { ...prev, ...next };
      localStorage.setItem('novel-platform-data', JSON.stringify(s));
      return s;
    });
  };

  const startReading = (novelId) => {
    save(prev => {
      const progress = prev.readerProgress[novelId] || createReaderProgress(novelId);
      return { ...prev, currentNovelId: novelId, readerProgress: { ...prev.readerProgress, [novelId]: progress } };
    });
  };

  const readChapter = (chapterId) => {
    save(prev => ({ ...prev, currentChapterId: chapterId }));
  };

  const makeChoice = (novelId, node, choiceId) => {
    save(prev => {
      const progress = prev.readerProgress[novelId];
      if (!progress) return prev;
      const result = processNodeChoice(progress, node, choiceId);
      return { ...prev, readerProgress: { ...prev.readerProgress, [novelId]: result.progress } };
    });
  };

  const completeNodeTask = (novelId, node) => {
    save(prev => {
      const progress = prev.readerProgress[novelId];
      if (!progress) return prev;
      const result = completeTask(progress, node);
      return { ...prev, readerProgress: { ...prev.readerProgress, [novelId]: result.progress } };
    });
  };

  const processNodeCheckpoint = (novelId, node) => {
    save(prev => {
      const progress = prev.readerProgress[novelId];
      if (!progress) return prev;
      const result = processCheckpoint(progress, node);
      return { ...prev, readerProgress: { ...prev.readerProgress, [novelId]: result.progress } };
    });
  };

  const processNodeGrowth = (novelId, node) => {
    save(prev => {
      const progress = prev.readerProgress[novelId];
      if (!progress) return prev;
      const result = processGrowthEvent(progress, node);
      return { ...prev, readerProgress: { ...prev.readerProgress, [novelId]: result.progress } };
    });
  };

  const toggleBookmark = (novelId) => {
    save(prev => {
      const list = prev.bookmarkedNovels.includes(novelId)
        ? prev.bookmarkedNovels.filter(id => id !== novelId)
        : [...prev.bookmarkedNovels, novelId];
      return { ...prev, bookmarkedNovels: list };
    });
  };

  return {
    novels: state.novels,
    readerProgress: state.readerProgress,
    achievements: state.achievements,
    bookmarkedNovels: state.bookmarkedNovels,
    currentNovelId: state.currentNovelId,
    currentChapterId: state.currentChapterId,
    save, startReading, readChapter, makeChoice, completeNodeTask,
    processNodeCheckpoint, processNodeGrowth, toggleBookmark,
  };
}

function Reader({ navigate, state }) {
  const novelId = state.currentNovelId;
  const chapterId = state.currentChapterId;
  const novel = getNovel(novelId);
  const chapter = getChapter(chapterId);
  const progress = state.readerProgress[novelId];
  const characters = getTrainableCharacters(novelId);

  const [showMenu, setShowMenu] = useState(false);
  const [activeNode, setActiveNode] = useState(null);
  const [fontSize, setFontSize] = useState(16);
  const [showGrowth, setShowGrowth] = useState(false);
  const [nodeResult, setNodeResult] = useState(null);

  useEffect(() => {
    if (chapter && progress) {
      const firstUncompleted = chapter.interactionNodes.find(n => !progress.completedNodes.includes(n.id) && n.isRequired);
      if (firstUncompleted) {
        setTimeout(() => setActiveNode(firstUncompleted), 500);
      }
    }
  }, [chapter, progress]);

  if (!novel || !chapter) {
    return (
      <div className="min-h-screen bg-black text-white flex items-center justify-center">
        <div className="text-center">
          <p className="text-slate-400">请先选择小说和章节</p>
          <button onClick={() => navigate('home')} className="mt-4 px-6 py-2 rounded-lg bg-white/10 text-sm">返回书架</button>
        </div>
      </div>
    );
  }

  const paragraphs = chapter.content.split('\n\n');
  const allNodesCompleted = chapter.interactionNodes.every(n => progress.completedNodes.includes(n.id));

  const handleNodeAction = (node, choiceId) => {
    if (node.type === 'choice') {
      const result = processNodeChoice(progress, node, choiceId);
      state.save(prev => ({ ...prev, readerProgress: { ...prev.readerProgress, [novelId]: result.progress } }));
      setNodeResult({ type: 'success', message: result.result });
      setTimeout(() => {
        setActiveNode(null);
        setNodeResult(null);
      }, 1500);
    } else if (node.type === 'task') {
      const result = completeTask(progress, node);
      state.save(prev => ({ ...prev, readerProgress: { ...prev.readerProgress, [novelId]: result.progress } }));
      setNodeResult({ type: 'success', message: result.result });
      setTimeout(() => {
        setActiveNode(null);
        setNodeResult(null);
      }, 1500);
    } else if (node.type === 'checkpoint') {
      const result = processCheckpoint(progress, node);
      state.save(prev => ({ ...prev, readerProgress: { ...prev.readerProgress, [novelId]: result.progress } }));
      setNodeResult({ type: result.passed ? 'success' : 'warning', message: result.outcome });
      setTimeout(() => {
        setActiveNode(null);
        setNodeResult(null);
      }, 2000);
    } else if (node.type === 'character_growth') {
      const result = processGrowthEvent(progress, node);
      state.save(prev => ({ ...prev, readerProgress: { ...prev.readerProgress, [novelId]: result.progress } }));
      setNodeResult({ type: 'success', message: result.result + '！角色获得成长' });
      setTimeout(() => {
        setActiveNode(null);
        setNodeResult(null);
        setShowGrowth(true);
      }, 1500);
    }
  };

  const goNext = () => {
    const chapters = getChapters(novelId);
    const idx = chapters.findIndex(c => c.id === chapterId);
    if (idx < chapters.length - 1) {
      const next = chapters[idx + 1];
      if (isChapterUnlocked(next, progress)) {
        state.readChapter(next.id);
      }
    }
  };

  const goPrev = () => {
    const chapters = getChapters(novelId);
    const idx = chapters.findIndex(c => c.id === chapterId);
    if (idx > 0) state.readChapter(chapters[idx - 1].id);
  };

  return (
    <div className="min-h-screen bg-black text-white fade-in">
      {/* Top Bar */}
      <div className={`fixed top-0 left-0 right-0 bg-black/80 backdrop-blur-lg border-b border-white/10 px-4 py-3 flex items-center justify-between z-40 transition-transform ${showMenu ? 'translate-y-0' : '-translate-y-full'}`}>
        <button onClick={() => navigate('novel', novelId)}><Icon name="ChevronLeft" size={20} /></button>
        <div className="text-sm font-medium truncate mx-4">{novel.title}</div>
        <button onClick={() => setShowGrowth(true)}><Icon name="Sparkles" size={20} /></button>
      </div>

      {/* Content */}
      <div className="pt-12 pb-20 px-5" onClick={() => setShowMenu(!showMenu)}>
        <h2 className="text-lg font-bold mb-6">{chapter.title}</h2>
        <div style={{ fontSize: `${fontSize}px`, lineHeight: '1.8' }} className="space-y-4 text-slate-200">
          {paragraphs.map((p, i) => (
            <p key={i} className="indent-8">{p}</p>
          ))}
        </div>

        {/* Chapter end actions */}
        <div className="mt-12 flex items-center justify-between">
          <button onClick={goPrev} className="px-4 py-2 rounded-lg bg-white/5 text-sm text-slate-400 hover:bg-white/10">上一章</button>
          <button onClick={() => navigate('novel', novelId)} className="px-4 py-2 rounded-lg bg-white/5 text-sm text-slate-400 hover:bg-white/10">目录</button>
          <button onClick={goNext} className={`px-4 py-2 rounded-lg text-sm ${allNodesCompleted ? 'bg-white/10 hover:bg-white/20' : 'bg-white/5 text-slate-600 cursor-not-allowed'}`}>下一章</button>
        </div>
      </div>

      {/* Font Size Control */}
      {showMenu && (
        <div className="fixed bottom-16 left-4 right-4 bg-black/90 backdrop-blur-lg rounded-xl border border-white/10 p-4 z-40">
          <div className="flex items-center justify-between">
            <span className="text-sm text-slate-400">字号</span>
            <div className="flex items-center gap-4">
              <button onClick={() => setFontSize(Math.max(12, fontSize - 2))} className="w-8 h-8 rounded-lg bg-white/10 text-sm">A-</button>
              <span className="text-sm w-8 text-center">{fontSize}</span>
              <button onClick={() => setFontSize(Math.min(24, fontSize + 2))} className="w-8 h-8 rounded-lg bg-white/10 text-sm">A+</button>
            </div>
          </div>
        </div>
      )}

      {/* Interaction Modal */}
      {activeNode && (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-end z-50" onClick={() => { if (!nodeResult) setActiveNode(null); }}>
          <div className="w-full bg-gradient-to-t from-slate-950 to-slate-900 border-t border-white/10 rounded-t-2xl p-6 max-h-[80vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <div className="flex items-center gap-2 mb-4">
              <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${
                activeNode.type === 'choice' ? 'bg-amber-500/20' :
                activeNode.type === 'task' ? 'bg-blue-500/20' :
                activeNode.type === 'checkpoint' ? 'bg-emerald-500/20' : 'bg-purple-500/20'
              }`}>
                <Icon name={activeNode.type === 'choice' ? 'GitBranch' : activeNode.type === 'task' ? 'Target' : activeNode.type === 'checkpoint' ? 'Trophy' : 'Sparkles'} size={20} className={
                  activeNode.type === 'choice' ? 'text-amber-400' :
                  activeNode.type === 'task' ? 'text-blue-400' :
                  activeNode.type === 'checkpoint' ? 'text-emerald-400' : 'text-purple-400'
                } />
              </div>
              <div>
                <h3 className="font-bold">{activeNode.title}</h3>
                <p className="text-xs text-slate-400">{activeNode.description}</p>
              </div>
            </div>

            {nodeResult ? (
              <div className={`p-4 rounded-xl ${nodeResult.type === 'success' ? 'bg-emerald-500/10 border border-emerald-500/20' : 'bg-amber-500/10 border border-amber-500/20'}`}>
                <p className="text-sm">{nodeResult.message}</p>
              </div>
            ) : (
              <>
                {activeNode.type === 'choice' && activeNode.choices && (
                  <div className="space-y-3">
                    {activeNode.choices.map(choice => {
                      const available = isChoiceAvailable(choice, progress);
                      return (
                        <button
                          key={choice.id}
                          onClick={() => available && handleNodeAction(activeNode, choice.id)}
                          disabled={!available}
                          className={`w-full p-4 rounded-xl border text-left transition-all ${
                            available
                              ? 'bg-white/5 border-white/10 hover:bg-white/10 hover:border-amber-500/30'
                              : 'bg-white/[0.02] border-white/5 opacity-40 cursor-not-allowed'
                          }`}
                        >
                          <p className="text-sm">{choice.text}</p>
                          {choice.hiddenRequirements && !available && (
                            <p className="text-xs text-slate-500 mt-1">未满足隐藏条件</p>
                          )}
                        </button>
                      );
                    })}
                  </div>
                )}

                {(activeNode.type === 'task' || activeNode.type === 'checkpoint' || activeNode.type === 'character_growth') && (
                  <button
                    onClick={() => handleNodeAction(activeNode)}
                    className="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-medium hover:from-purple-500 hover:to-indigo-500 transition-all"
                  >
                    {activeNode.type === 'task' ? '完成任务' : activeNode.type === 'checkpoint' ? '开始检测' : '接受成长'}
                  </button>
                )}
              </>
            )}
          </div>
        </div>
      )}

      {/* Growth Panel */}
      {showGrowth && (
        <div className="fixed inset-0 bg-black/90 backdrop-blur-lg z-50 overflow-y-auto">
          <div className="p-5 pb-24">
            <div className="flex items-center justify-between mb-6">
              <h2 className="text-xl font-bold">角色养成</h2>
              <button onClick={() => setShowGrowth(false)} className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
                <Icon name="X" size={20} />
              </button>
            </div>
            {characters.map(char => {
              const charState = progress?.characterStates[char.id];
              if (!charState) return null;
              const currentStage = char.evolutionStages.find(s => s.stage === charState.currentStage);
              return (
                <div key={char.id} className="mb-8">
                  <div className="flex items-center gap-4 mb-4">
                    <img src={currentStage?.avatar || char.avatar} alt={char.name} className="w-16 h-16 rounded-full object-cover border-2 border-purple-500/30" />
                    <div>
                      <h3 className="font-bold text-lg">{char.name}</h3>
                      <p className="text-sm text-purple-400">{currentStage?.name || '初始'} · {char.title}</p>
                    </div>
                  </div>
                  <div className="space-y-3">
                    {char.attributes.map(attr => {
                      const val = charState.attributes[attr.id] || 0;
                      return (
                        <div key={attr.id}>
                          <div className="flex items-center justify-between mb-1">
                            <span className="text-xs text-slate-400">{attr.name}</span>
                            <span className="text-xs font-medium" style={{ color: attr.color }}>{val}/{attr.maxValue}</span>
                          </div>
                          <div className="w-full h-2 bg-white/10 rounded-full overflow-hidden">
                            <div className="h-full rounded-full transition-all duration-500" style={{ width: `${(val / attr.maxValue) * 100}%`, backgroundColor: attr.color }} />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  <div className="mt-4">
                    <h4 className="text-sm font-medium mb-2">已解锁技能</h4>
                    <div className="flex flex-wrap gap-2">
                      {charState.unlockedSkills.length === 0 && <span className="text-xs text-slate-500">暂无解锁技能</span>}
                      {charState.unlockedSkills.map(skillId => {
                        const skill = char.skills.find(s => s.id === skillId);
                        return skill ? (
                          <span key={skillId} className="px-3 py-1 rounded-full bg-purple-500/20 text-purple-300 text-xs border border-purple-500/20">{skill.name}</span>
                        ) : null;
                      })}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function CharacterGrowth({ novelId, navigate, state }) {
  const novel = getNovel(novelId);
  const characters = getTrainableCharacters(novelId);
  const progress = state.readerProgress[novelId];

  if (!novel) return null;

  return (
    <div className="min-h-screen bg-gradient-to-b from-slate-950 via-slate-900 to-black pb-24 fade-in">
      <header className="px-5 pt-12 pb-4 flex items-center gap-3">
        <button onClick={() => navigate('novel', novelId)} className="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center">
          <Icon name="ChevronLeft" size={20} />
        </button>
        <div>
          <h1 className="text-xl font-bold">{novel.title}</h1>
          <p className="text-xs text-slate-400">角色养成</p>
        </div>
      </header>

      <div className="px-5">
        {characters.map(char => {
          const charState = progress?.characterStates[char.id];
          if (!charState) return null;
          const currentStage = char.evolutionStages.find(s => s.stage === charState.currentStage);
          const nextStage = char.evolutionStages.find(s => s.stage === charState.currentStage + 1);

          return (
            <div key={char.id} className="mb-8">
              <div className="flex items-center gap-4 mb-6">
                <img src={currentStage?.avatar || char.avatar} alt={char.name} className="w-20 h-20 rounded-full object-cover border-2 border-purple-500/30" />
                <div>
                  <h2 className="text-lg font-bold">{char.name}</h2>
                  <p className="text-sm text-purple-400">{currentStage?.name || '初始'} · {char.title}</p>
                  <p className="text-xs text-slate-500 mt-1">{char.description}</p>
                </div>
              </div>

              {/* Attributes */}
              <div className="space-y-3 mb-6">
                {char.attributes.map(attr => {
                  const val = charState.attributes[attr.id] || 0;
                  return (
                    <div key={attr.id} className="p-3 rounded-xl bg-white/5 border border-white/10">
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-sm font-medium">{attr.name}</span>
                        <span className="text-sm font-bold" style={{ color: attr.color }}>{val}/{attr.maxValue}</span>
                      </div>
                      <div className="w-full h-2.5 bg-white/10 rounded-full overflow-hidden">
                        <div className="h-full rounded-full transition-all" style={{ width: `${(val / attr.maxValue) * 100}%`, backgroundColor: attr.color }} />
                      </div>
                      <p className="text-xs text-slate-500 mt-1">{attr.description}</p>
                    </div>
                  );
                })}
              </div>

              {/* Evolution */}
              <div className="mb-6">
                <h3 className="text-sm font-semibold text-white/80 mb-3">进化阶段</h3>
                <div className="space-y-3">
                  {char.evolutionStages.map(stage => {
                    const isCurrent = stage.stage === charState.currentStage;
                    const isPast = stage.stage < charState.currentStage;
                    return (
                      <div key={stage.stage} className={`flex items-center gap-3 p-3 rounded-xl border transition-all ${
                        isCurrent ? 'bg-purple-500/10 border-purple-500/30' : isPast ? 'bg-white/5 border-white/10 opacity-60' : 'bg-white/[0.02] border-white/5 opacity-40'
                      }`}>
                        <img src={stage.avatar} alt={stage.name} className="w-12 h-12 rounded-full object-cover" />
                        <div className="flex-1">
                          <p className={`text-sm font-medium ${isCurrent ? 'text-purple-300' : 'text-white'}`}>{stage.name}</p>
                          <p className="text-xs text-slate-500">{stage.description}</p>
                        </div>
                        {isCurrent && <span className="text-xs text-purple-400 px-2 py-1 rounded-full bg-purple-500/20">当前</span>}
                        {isPast && <Icon name="CheckCircle" size={16} className="text-emerald-400" />}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Skills */}
              <div>
                <h3 className="text-sm font-semibold text-white/80 mb-3">技能列表</h3>
                <div className="space-y-2">
                  {char.skills.map(skill => {
                    const unlocked = charState.unlockedSkills.includes(skill.id);
                    return (
                      <div key={skill.id} className={`p-3 rounded-xl border transition-all ${
                        unlocked ? 'bg-white/10 border-white/20' : 'bg-white/[0.02] border-white/5 opacity-50'
                      }`}>
                        <div className="flex items-center justify-between mb-1">
                          <span className="text-sm font-medium">{skill.name}</span>
                          <span className="text-xs text-slate-500">阶段 {skill.requiredStage}</span>
                        </div>
                        <p className="text-xs text-slate-400">{skill.description}</p>
                        {unlocked && <p className="text-xs text-emerald-400 mt-1">效果：{skill.effect}</p>}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Next Stage Requirements */}
              {nextStage && (
                <div className="mt-6 p-4 rounded-xl bg-amber-500/10 border border-amber-500/20">
                  <h4 className="text-sm font-medium text-amber-300 mb-2">下一进化阶段要求：{nextStage.name}</h4>
                  <div className="space-y-1">
                    {nextStage.requiredAttributes.map(req => {
                      const current = charState.attributes[req.attributeId] || 0;
                      const attr = char.attributes.find(a => a.id === req.attributeId);
                      return (
                        <div key={req.attributeId} className="flex items-center justify-between text-xs">
                          <span className="text-slate-400">{attr?.name || req.attributeId}</span>
                          <span className={current >= req.minValue ? 'text-emerald-400' : 'text-slate-500'}>
                            {current}/{req.minValue}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ProfilePage({ navigate, state }) {
  const allProgress = Object.values(state.readerProgress);
  const totalChaptersRead = allProgress.reduce((sum, p) => sum + p.completedNodes.length, 0);
  const unlockedAchievements = state.achievements.filter(a => a.unlocked);

  return (
    <div className="min-h-screen bg-gradient-to-b from-slate-950 via-slate-900 to-black pb-24 fade-in">
      <header className="px-5 pt-12 pb-6">
        <div className="slide-up">
          <h1 className="text-2xl font-bold">个人中心</h1>
          <p className="text-slate-400 text-sm mt-1">你的阅读旅程</p>
        </div>
      </header>

      {/* Stats */}
      <div className="px-5 mb-6">
        <div className="rounded-2xl bg-gradient-to-r from-amber-900/30 to-purple-900/30 border border-amber-500/20 p-5">
          <div className="flex items-center gap-4 mb-4">
            <div className="w-16 h-16 rounded-full bg-gradient-to-br from-amber-400 to-purple-500 flex items-center justify-center">
              <Icon name="User" size={32} className="text-white" />
            </div>
            <div>
              <p className="font-semibold text-lg">阅读达人</p>
              <p className="text-xs text-white/50">{allProgress.length} 本在读</p>
            </div>
          </div>
          <div className="grid grid-cols-3 gap-4">
            <div className="text-center">
              <p className="text-xl font-bold text-amber-400">{allProgress.length}</p>
              <p className="text-xs text-white/40">阅读中</p>
            </div>
            <div className="text-center">
              <p className="text-xl font-bold text-emerald-400">{totalChaptersRead}</p>
              <p className="text-xs text-white/40">章节</p>
            </div>
            <div className="text-center">
              <p className="text-xl font-bold text-purple-400">{unlockedAchievements.length}</p>
              <p className="text-xs text-white/40">成就</p>
            </div>
          </div>
        </div>
      </div>

      {/* Reading Progress */}
      {allProgress.length > 0 && (
        <div className="px-5 mb-6">
          <h2 className="text-sm font-semibold text-white/80 mb-3">阅读进度</h2>
          <div className="space-y-3">
            {allProgress.map(p => {
              const novel = getNovel(p.novelId);
              if (!novel) return null;
              const chapters = getChapters(novel.id);
              const completedCount = chapters.filter(c => c.interactionNodes.every(n => p.completedNodes.includes(n.id))).length;
              const percent = novel.totalChapters > 0 ? Math.round((completedCount / novel.totalChapters) * 100) : 0;
              return (
                <button
                  key={p.novelId}
                  onClick={() => navigate('novel', p.novelId)}
                  className="w-full flex items-center gap-3 p-3 rounded-xl bg-white/5 border border-white/10 text-left hover:bg-white/10 transition-all"
                >
                  <img src={novel.cover} alt={novel.title} className="w-12 h-16 rounded-lg object-cover" />
                  <div className="flex-1">
                    <p className="text-sm font-medium">{novel.title}</p>
                    <div className="w-full h-1.5 bg-white/10 rounded-full mt-2 overflow-hidden">
                      <div className="h-full bg-gradient-to-r from-amber-500 to-orange-500 rounded-full" style={{ width: `${percent}%` }} />
                    </div>
                    <p className="text-xs text-slate-500 mt-1">{percent}% 已读</p>
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* Bookmarked */}
      {state.bookmarkedNovels.length > 0 && (
        <div className="px-5 mb-6">
          <h2 className="text-sm font-semibold text-white/80 mb-3">我的收藏</h2>
          <div className="flex gap-3 overflow-x-auto scrollbar-hide pb-2">
            {state.bookmarkedNovels.map(novelId => {
              const novel = getNovel(novelId);
              if (!novel) return null;
              return (
                <button key={novelId} onClick={() => navigate('novel', novelId)} className="flex-shrink-0">
                  <img src={novel.cover} alt={novel.title} className="w-20 h-28 rounded-lg object-cover" />
                  <p className="text-xs text-slate-400 mt-1 text-center w-20 truncate">{novel.title}</p>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* Achievements */}
      <div className="px-5">
        <h2 className="text-sm font-semibold text-white/80 mb-3">成就 ({unlockedAchievements.length}/{state.achievements.length})</h2>
        <div className="grid grid-cols-2 gap-2">
          {state.achievements.map(achievement => (
            <div
              key={achievement.id}
              className={`p-3 rounded-xl border transition-all ${
                achievement.unlocked ? 'bg-white/10 border-white/20' : 'bg-white/5 border-white/5 opacity-50'
              }`}
            >
              <div className="flex items-center gap-2 mb-1">
                <Icon name={achievement.icon} size={16} className={achievement.unlocked ? 'text-amber-400' : 'text-slate-600'} />
                <span className="text-xs font-medium">{achievement.title}</span>
              </div>
              <p className="text-xs text-slate-400">{achievement.description}</p>
            </div>
          ))}
        </div>
      </div>

      {/* Bottom Nav */}
      <nav className="fixed bottom-0 left-0 right-0 bg-black/80 backdrop-blur-lg border-t border-white/10 px-6 py-3 flex justify-around z-50">
        <button onClick={() => navigate('home')} className="flex flex-col items-center gap-1 text-slate-500 hover:text-white transition-colors">
          <Icon name="BookOpen" size={20} />
          <span className="text-xs">书架</span>
        </button>
        <button className="flex flex-col items-center gap-1 text-amber-400">
          <Icon name="User" size={20} />
          <span className="text-xs">我的</span>
        </button>
      </nav>
    </div>
  );
}

// ===================== App =====================
function App() {
  const [page, setPage] = useState('home');
  const [param, setParam] = useState(null);
  const state = useGlobalState();

  const navigate = (target, p) => {
    setPage(target);
    setParam(p);
    window.scrollTo(0, 0);
  };

  return (
    <div className="min-h-screen bg-black text-white">
      {page === 'home' && <BookShelf navigate={navigate} state={state} />}
      {page === 'novel' && <NovelDetail novelId={param} navigate={navigate} state={state} />}
      {page === 'reader' && <Reader navigate={navigate} state={state} />}
      {page === 'growth' && <CharacterGrowth novelId={param || state.currentNovelId} navigate={navigate} state={state} />}
      {page === 'profile' && <ProfilePage navigate={navigate} state={state} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
