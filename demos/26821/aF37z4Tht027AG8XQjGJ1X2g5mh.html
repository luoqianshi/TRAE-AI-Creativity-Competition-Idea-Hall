<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>诗路中国 · 武汉黄鹤楼示范区</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
<style>
  :root{
    --gold:#D4A854;
    --gold-light:#F0D98C;
    --gold-deep:#A8842A;
    --jade:#2D8B6E;
    --jade-deep:#1a5f4a;
    --ink:#1a1a2e;
    --ink2:#16213e;
    --paper:#f3ead6;
    --glass:rgba(255,255,255,0.10);
    --glass-border:rgba(212,168,84,0.35);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;
    font-family:'Noto Serif SC',serif;color:var(--paper);
    background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);}
  body{display:flex;flex-direction:column;}

  /* ===== 顶部导航栏 ===== */
  nav.topbar{flex:0 0 auto;height:58px;display:flex;align-items:center;justify-content:space-between;
    padding:0 26px;background:rgba(16,18,34,0.72);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--glass-border);z-index:30;}
  .nav-left{display:flex;align-items:center;gap:12px;}
  .logo-seal{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;
    background:linear-gradient(135deg,#9a2a2a,#6e1c1c);color:#f3ead6;font-family:'Ma Shan Zheng',cursive;
    font-size:20px;box-shadow:0 0 0 1px rgba(212,168,84,0.5),0 4px 12px rgba(0,0,0,0.4);transform:rotate(-4deg);}
  .logo-text{font-family:'Ma Shan Zheng',cursive;font-size:30px;letter-spacing:4px;
    background:linear-gradient(180deg,var(--gold-light),var(--gold) 60%,var(--gold-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 14px rgba(212,168,84,0.3);}
  .nav-center{font-family:'ZCOOL XiaoWei',serif;font-size:15px;letter-spacing:3px;color:var(--gold-light);
    display:flex;align-items:center;gap:8px;}
  .nav-right{font-family:'ZCOOL XiaoWei',serif;font-size:14px;letter-spacing:2px;color:rgba(243,234,214,0.8);
    cursor:pointer;padding:7px 16px;border-radius:20px;border:1px solid var(--glass-border);
    transition:all .25s;background:rgba(255,255,255,0.04);}
  .nav-right:hover{background:rgba(212,168,84,0.18);color:var(--gold-light);}

  /* ===== 主区域 ===== */
  main.stage{flex:1 1 auto;display:flex;min-height:0;}
  .scene-wrap{flex:0 0 78%;position:relative;min-width:0;}
  #three-canvas{display:block;width:100%;height:100%;}
  #css2d-layer{position:absolute;inset:0;pointer-events:none;}
  /* 3D 左上角 Tab */
  .tabs{position:absolute;top:18px;left:18px;display:flex;gap:8px;z-index:10;}
  .tab{font-family:'ZCOOL XiaoWei',serif;font-size:14px;letter-spacing:3px;color:rgba(243,234,214,0.7);
    padding:8px 20px;border-radius:22px;cursor:pointer;border:1px solid var(--glass-border);
    background:rgba(16,18,34,0.55);backdrop-filter:blur(10px);transition:all .25s;user-select:none;}
  .tab:hover{color:var(--gold-light);}
  .tab.active{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1a1a2e;
    border-color:var(--gold);box-shadow:0 4px 16px rgba(212,168,84,0.4);font-weight:700;}
  .scene-hint{position:absolute;bottom:14px;left:18px;z-index:10;font-family:'ZCOOL XiaoWei',serif;
    font-size:12px;letter-spacing:2px;color:rgba(243,234,214,0.4);}

  /* ===== 右侧毛玻璃面板 ===== */
  aside.panel{flex:0 0 22%;min-width:300px;max-width:380px;background:var(--glass);
    backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);
    border-left:1px solid var(--glass-border);display:flex;flex-direction:column;z-index:20;overflow:hidden;}
  .panel-head{flex:0 0 auto;padding:18px 22px 14px;border-bottom:1px solid var(--glass-border);
    display:flex;align-items:center;justify-content:space-between;}
  .panel-title{font-family:'Ma Shan Zheng',cursive;font-size:22px;letter-spacing:3px;color:var(--gold-light);}
  .collect-count{font-family:'ZCOOL XiaoWei',serif;font-size:12px;letter-spacing:1px;color:var(--gold);
    padding:5px 12px;border-radius:14px;background:rgba(212,168,84,0.14);border:1px solid var(--glass-border);
    white-space:nowrap;}
  .panel-body{flex:1 1 auto;overflow-y:auto;padding:20px 22px;}
  .panel-body::-webkit-scrollbar{width:6px;}
  .panel-body::-webkit-scrollbar-thumb{background:rgba(212,168,84,0.4);border-radius:3px;}

  .view{display:none;}.view.show{display:block;animation:fadeUp .4s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .welcome{font-family:'ZCOOL XiaoWei',serif;line-height:1.9;color:rgba(243,234,214,0.78);}
  .welcome h3{font-family:'Ma Shan Zheng',cursive;font-size:20px;color:var(--gold-light);margin-bottom:10px;letter-spacing:2px;}
  .welcome p{font-size:13px;margin-bottom:10px;}
  .welcome .tip{margin-top:14px;padding:12px;border-radius:10px;background:rgba(212,168,84,0.10);
    border:1px dashed var(--glass-border);font-size:12px;color:var(--gold-light);}

  /* POI 详情卡 */
  .detail-card .dc-name{font-family:'Ma Shan Zheng',cursive;font-size:26px;color:var(--gold-light);letter-spacing:2px;}
  .dc-tag{display:inline-block;margin:6px 0 12px;font-size:11px;letter-spacing:2px;padding:3px 10px;border-radius:10px;
    background:rgba(45,139,110,0.25);color:#9fe0c4;border:1px solid rgba(45,139,110,0.4);}
  .dc-poem{font-family:'Ma Shan Zheng',cursive;font-size:18px;line-height:1.6;color:var(--paper);
    padding:12px 14px;border-left:3px solid var(--gold);background:rgba(255,255,255,0.05);border-radius:0 8px 8px 0;margin-bottom:14px;}
  .dc-section{margin-bottom:14px;}
  .dc-label{font-size:11px;letter-spacing:3px;color:var(--gold);margin-bottom:5px;}
  .dc-text{font-size:13px;line-height:1.8;color:rgba(243,234,214,0.85);}
  .dc-food{display:flex;flex-wrap:wrap;gap:6px;}
  .food-chip{font-size:12px;padding:4px 12px;border-radius:12px;background:rgba(212,168,84,0.15);
    color:var(--gold-light);border:1px solid var(--glass-border);}
  .btn-collect{width:100%;margin-top:16px;padding:12px;border:none;border-radius:10px;cursor:pointer;
    font-family:'ZCOOL XiaoWei',serif;font-size:15px;letter-spacing:3px;transition:all .25s;
    background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1a1a2e;font-weight:700;}
  .btn-collect:hover{filter:brightness(1.1);transform:translateY(-1px) scale(1.05);}
  .btn-collect.collected{background:rgba(45,139,110,0.3);color:#9fe0c4;border:1px solid var(--jade);}
  .btn-collect.collected:hover{transform:translateY(-1px) scale(1.05);}

  /* 规划视图 */
  .plan-hint{text-align:center;padding:30px 10px;font-family:'ZCOOL XiaoWei',serif;color:rgba(243,234,214,0.6);font-size:13px;line-height:1.8;}
  .plan-hint .big{font-family:'Ma Shan Zheng',cursive;font-size:22px;color:var(--gold-light);display:block;margin-bottom:10px;}
  .route-stat{display:flex;gap:10px;margin-bottom:16px;}
  .stat-box{flex:1;padding:12px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);text-align:center;}
  .stat-num{font-family:'Ma Shan Zheng',cursive;font-size:22px;color:var(--gold-light);}
  .stat-lbl{font-size:11px;letter-spacing:2px;color:rgba(243,234,214,0.6);margin-top:3px;}
  .wp-list{margin-bottom:14px;}
  .wp-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.04);margin-bottom:6px;font-size:13px;}
  .wp-dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);flex:0 0 auto;}
  .wp-line{flex:1;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin:0 4px;}
  .plan-actions{display:flex;gap:10px;margin-top:8px;}
  .btn-soft{flex:1;padding:11px;border-radius:10px;cursor:pointer;font-family:'ZCOOL XiaoWei',serif;font-size:13px;letter-spacing:2px;
    background:rgba(212,168,84,0.15);color:var(--gold-light);border:1px solid var(--glass-border);transition:all .25s;}
  .btn-soft:hover{background:rgba(212,168,84,0.28);}

  /* 社区视图 */
  .route-card{padding:14px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);margin-bottom:12px;transition:all .25s;}
  .route-card:hover{background:rgba(255,255,255,0.09);transform:translateY(-2px);}
  .rc-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .rc-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:'Ma Shan Zheng',cursive;
    font-size:18px;color:#1a1a2e;flex:0 0 auto;}
  .rc-name{font-family:'Ma Shan Zheng',cursive;font-size:17px;color:var(--gold-light);letter-spacing:1px;}
  .rc-author{font-size:11px;color:rgba(243,234,214,0.55);}
  .rc-meta{display:flex;gap:14px;font-size:12px;color:rgba(243,234,214,0.7);margin-bottom:10px;}
  .rc-meta span{display:flex;align-items:center;gap:4px;}
  .rc-pois{font-size:11px;color:rgba(243,234,214,0.5);margin-bottom:10px;line-height:1.6;}
  .btn-copy{width:100%;padding:9px;border-radius:8px;cursor:pointer;font-family:'ZCOOL XiaoWei',serif;font-size:13px;letter-spacing:2px;
    background:linear-gradient(135deg,var(--jade),var(--jade-deep));color:#fff;border:none;transition:all .25s;}
  .btn-copy:hover{filter:brightness(1.15);}
  .btn-copy.copied{background:rgba(45,139,110,0.3);border:1px solid var(--jade);}

  /* ===== 底部时间轴 ===== */
  footer.timeline{flex:0 0 auto;height:92px;background:rgba(16,18,34,0.78);backdrop-filter:blur(14px);
    border-top:1px solid var(--glass-border);display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:10px 40px;z-index:30;}
  .tl-inner{position:relative;width:min(820px,80vw);}
  .tl-guide{font-family:'ZCOOL XiaoWei',serif;font-size:13px;letter-spacing:5px;color:var(--gold-light);text-align:center;margin-bottom:10px;}
  .tl-track{position:relative;height:30px;}
  input[type=range].tl-slider{position:absolute;inset:0;width:100%;height:30px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;cursor:grab;z-index:3;}
  input[type=range].tl-slider:active{cursor:grabbing;}
  input[type=range].tl-slider::-webkit-slider-runnable-track{height:4px;border-radius:4px;margin-top:13px;
    background:linear-gradient(90deg,var(--jade-deep),var(--gold) 50%,var(--jade-deep));box-shadow:0 0 10px rgba(212,168,84,0.4);}
  input[type=range].tl-slider::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--jade-deep),var(--gold) 50%,var(--jade-deep));}
  input[type=range].tl-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;margin-top:-9px;
    background:radial-gradient(circle at 35% 30%,var(--gold-light),var(--gold) 60%,var(--gold-deep));
    border:2px solid rgba(243,234,214,0.85);box-shadow:0 0 14px rgba(212,168,84,0.8);}
  input[type=range].tl-slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;border:2px solid rgba(243,234,214,0.85);
    background:radial-gradient(circle at 35% 30%,var(--gold-light),var(--gold) 60%,var(--gold-deep));}
  .tl-ticks{position:absolute;left:0;right:0;top:11px;display:flex;justify-content:space-between;pointer-events:none;}
  .tl-tick{width:2px;height:10px;background:#6a6a78;opacity:.7;border-radius:2px;transition:all .3s;}
  .tl-tick.active{background:var(--gold);opacity:1;box-shadow:0 0 8px var(--gold);}
  .tl-labels{display:flex;justify-content:space-between;margin-top:8px;}
  .tl-label{font-family:'Ma Shan Zheng',cursive;font-size:16px;color:#6a6a78;letter-spacing:1px;cursor:pointer;user-select:none;text-align:center;transition:color .3s,text-shadow .3s;}
  .tl-label small{display:block;font-family:'Noto Serif SC',serif;font-size:9px;color:#4a4a58;margin-top:1px;transition:color .3s;}
  .tl-label.active{color:var(--gold);text-shadow:0 0 12px rgba(212,168,84,0.7);}
  .tl-label.active small{color:var(--gold-light);}

  /* POI CSS2D 标签 */
  .poi-label{font-family:'Ma Shan Zheng',cursive;font-size:15px;color:var(--gold-light);letter-spacing:1px;
    padding:3px 12px;border-radius:14px;background:rgba(16,18,34,0.72);border:1px solid var(--glass-border);
    white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,0.6);box-shadow:0 4px 14px rgba(0,0,0,0.4);
    transition:opacity .4s;pointer-events:none;}
  .poi-label.tower{background:rgba(154,42,42,0.7);color:#ffe8b0;border-color:var(--gold);}

  /* Toast */
  #toast{position:fixed;top:74px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:100;
    padding:12px 26px;border-radius:24px;background:rgba(45,139,110,0.92);color:#fff;
    font-family:'ZCOOL XiaoWei',serif;font-size:14px;letter-spacing:2px;box-shadow:0 8px 30px rgba(0,0,0,0.4);
    opacity:0;pointer-events:none;transition:all .35s;border:1px solid rgba(255,255,255,0.2);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 加载 */
  #loader{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:linear-gradient(135deg,#1a1a2e,#16213e);
    transition:opacity .7s;font-family:'Ma Shan Zheng',cursive;color:var(--gold);font-size:22px;letter-spacing:6px;}
  #loader.hide{opacity:0;pointer-events:none;}

  @media (max-width:820px){
    aside.panel{min-width:0;max-width:none;flex:0 0 40%;}
    .scene-wrap{flex:0 0 60%;}
    .nav-center{display:none;}
  }
</style>
</head>
<body>
  <!-- 顶部导航 -->
  <nav class="topbar">
    <div class="nav-left">
      <div class="logo-seal">诗</div>
      <div class="logo-text">诗路中国</div>
    </div>
    <div class="nav-center">📍 武汉 · 黄鹤楼示范区</div>
    <div class="nav-right" id="navFootprint">👤 我的足迹</div>
  </nav>

  <!-- 主区域 -->
  <main class="stage">
    <div class="scene-wrap">
      <canvas id="three-canvas"></canvas>
      <div id="css2d-layer"></div>
      <div class="tabs">
        <div class="tab active" data-mode="explore">探索</div>
        <div class="tab" data-mode="plan">规划</div>
        <div class="tab" data-mode="community">社区</div>
      </div>
      <div class="scene-hint">拖拽旋转 · 滚轮缩放 · 点击光点查看详情</div>
    </div>

    <aside class="panel">
      <div class="panel-head">
        <div class="panel-title" id="panelTitle">探索 · 江城名胜</div>
        <div class="collect-count" id="collectCount">已收藏 0 个景点</div>
      </div>
      <div class="panel-body">
        <!-- 探索视图 -->
        <div class="view show" id="view-explore">
          <div id="welcome" class="welcome">
            <h3>欢迎来到诗路中国</h3>
            <p>这是一座可穿梭千年的 3D 历史文化地图。拖动底部时间轴，在唐、宋、明、今之间穿越，看黄鹤楼与江城名胜的时空演变。</p>
            <p>点击地图上的发光光点，查看景点详情；收藏喜欢的景点，切换到「规划」生成专属游览路线。</p>
            <div class="tip">💡 提示：先点击任一光点开始探索</div>
          </div>
          <div id="detail" class="detail-card" style="display:none;"></div>
        </div>
        <!-- 规划视图 -->
        <div class="view" id="view-plan"></div>
        <!-- 社区视图 -->
        <div class="view" id="view-community"></div>
      </div>
    </aside>
  </main>

  <!-- 底部时间轴 -->
  <footer class="timeline">
    <div class="tl-inner">
      <div class="tl-guide">滑动穿越千年 · 诗路江城</div>
      <div class="tl-track">
        <div class="tl-ticks">
          <span class="tl-tick active"></span><span class="tl-tick"></span>
          <span class="tl-tick"></span><span class="tl-tick"></span>
        </div>
        <input type="range" class="tl-slider" id="slider" min="0" max="1000" value="0" step="1" />
      </div>
      <div class="tl-labels">
        <span class="tl-label active" data-i="0">唐<small>618</small></span>
        <span class="tl-label" data-i="1">宋<small>960</small></span>
        <span class="tl-label" data-i="2">明<small>1368</small></span>
        <span class="tl-label" data-i="3">现<small>至今</small></span>
      </div>
    </div>
  </footer>

  <div id="toast"></div>
  <div id="loader">载入千年时空…</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
  <script>
  /* ============== 数据 ============== */
  const DYNASTIES = [
    { name:'唐', year:'618',  mapColor:0xE8D5B5, fogColor:0xC9A961, skyTop:'#3a2418', skyBottom:'#8b5a2a' },
    { name:'宋', year:'960',  mapColor:0x8CB08C, fogColor:0x6A8A8A, skyTop:'#34514f', skyBottom:'#7fae96' },
    { name:'明', year:'1368', mapColor:0xD4A854, fogColor:0xB8902A, skyTop:'#33243f', skyBottom:'#a07c34' },
    { name:'现', year:'至今', mapColor:0x8A9BA8, fogColor:0x5A6A7A, skyTop:'#070f20', skyBottom:'#163a5a' }
  ];

  const POIS = [
    { id:'tower',   name:'黄鹤楼',   pos:[-15,0,-10], color:0xD4A854, isTower:true,
      labels:['军事望楼','文人雅集','天下江山第一楼','5A景区'],
      poem:'昔人已乘黄鹤去，此地空余黄鹤楼', intro:'江南三大名楼之一，始建于三国', food:['热干面','三鲜豆皮'] },
    { id:'guqintai',name:'古琴台',   pos:[25,0,15],   color:0x6affc8,
      labels:['古琴台·伯牙','知音文化','琴台书院','古琴台公园'],
      poem:'高山流水遇知音', intro:'伯牙子期相遇处，知音文化发源地', food:['藕汤','武昌鱼'] },
    { id:'qingchuan',name:'晴川阁',  pos:[18,0,-25],  color:0xffd24a,
      labels:['晴川阁','禹稷行宫','晴川阁','晴川阁景区'],
      poem:'晴川历历汉阳树', intro:'依江而建，登阁可望长江', food:['排骨藕汤'] },
    { id:'hubuxiang',name:'户部巷',  pos:[-25,0,20],  color:0xff8c42,
      labels:['江夏市集','户部巷酒肆','户部巷商街','户部巷美食街'],
      poem:'汉味小吃第一巷', intro:'武汉最著名的小吃街，百年历史', food:['糊汤粉','糯米包油条'] },
    { id:'bridge',  name:'长江大桥', pos:[30,0,-15],  color:0x5ab8ff,
      labels:['','','','长江大桥'],
      poem:'一桥飞架南北，天堑变通途', intro:'万里长江第一桥，1957年通车', food:[] },
    { id:'guiyuan', name:'归元寺',   pos:[-30,0,-25], color:0xff4a8a,
      labels:['归元禅寺','归元寺','归元寺','归元禅寺'],
      poem:'归元性不二，方便有多门', intro:'武汉四大丛林之一，以罗汉堂闻名', food:['素斋'] }
  ];

  const COMMUNITY = [
    { user:'用户A', initial:'A', color:'#D4A854', name:'苏州·苏东坡足迹之旅', author:'苏小妹', copies:128, rating:4.8, pois:['tower','guqintai','guiyuan'] },
    { user:'用户B', initial:'B', color:'#5ab8ff', name:'西安·盛唐诗词打卡线', author:'长安客', copies:96, rating:4.6, pois:['tower','qingchuan','bridge'] },

  // 四角山脉（±80,0,±80），高度15-25，ConeGeometry 叠加
  function buildCornerMountain(cx, cz){
    const g = new THREE.Group();
    const main = new THREE.Mesh(new THREE.ConeGeometry(10, 20, 6),
      new THREE.MeshStandardMaterial({ color:0x6a8a6a, roughness:0.95, flatShading:true }));
    main.position.set(0,10,0); g.add(main);
    for(let i=0;i<3;i++){
      const ang = i/3*Math.PI*2;
      const sub = new THREE.Mesh(new THREE.ConeGeometry(6, 14, 5),
        new THREE.MeshStandardMaterial({ color:0x5a7a5a, roughness:0.95, flatShading:true }));
      sub.position.set(Math.cos(ang)*9, 7, Math.sin(ang)*9); g.add(sub);

  buildCornerMountain(80,80); buildCornerMountain(-80,80); buildCornerMountain(80,-80); buildCornerMountain(-80,-80);

  /* ---- 黄鹤楼（四朝代 + 淡入淡出） ---- */
  const TOWER_POS = new THREE.Vector3(-15,0,-10);
  let towerGroup = new THREE.Group(); towerGroup.position.copy(TOWER_POS); scene.add(towerGroup);
  let fadingGroup = null, fadeActive = false, fadeOutT = 0, fadeInT = 0;
  const FADE_DUR = 0.5;
  let activeStyleIdx = -1;
  let flagMesh = null;

  function disposeGroup(g){
    while(g.children.length){
      const c = g.children.pop();
      if(c.geometry) c.geometry.dispose();
      if(c.material){ Array.isArray(c.material)?c.material.forEach(m=>m.dispose()):c.material.dispose(); }
    }
  }
  function setGroupOpacity(g, op){
    if(!g) return;
    g.traverse(o=>{ if(o.isMesh && o.material){
      const ms = Array.isArray(o.material)?o.material:[o.material];
      ms.forEach(m=>{ m.transparent = op<1; m.opacity = op; });
    }});
  }
  function addM(g,geo,mat,x,y,z,ry){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); if(ry)m.rotation.y=ry; g.add(m); return m; }

  function buildTang(){
    const g=towerGroup;
    addM(g,new THREE.BoxGeometry(7,0.8,7),new THREE.MeshStandardMaterial({color:0x5a4a38,roughness:0.95,flatShading:true}),0,0.4,0);
    addM(g,new THREE.BoxGeometry(4,3,4),new THREE.MeshStandardMaterial({color:0x4a2818,roughness:0.8,flatShading:true}),0,2.3,0);
    addM(g,new THREE.BoxGeometry(6.8,0.35,6.8),new THREE.MeshStandardMaterial({color:0x5a5a5a,roughness:0.7,flatShading:true}),0,4.0,0);
    addM(g,new THREE.ConeGeometry(3.0,2.2,4),new THREE.MeshStandardMaterial({color:0x4a4a4a,roughness:0.65,flatShading:true}),0,5.3,0,Math.PI/4);
    const poleH=4.2;
    addM(g,new THREE.CylinderGeometry(0.06,0.06,poleH,8),new THREE.MeshStandardMaterial({color:0x2a1a10,roughness:0.8}),3.1,poleH/2,3.1);
    const fg=new THREE.PlaneGeometry(1.8,1.1,14,7);
    flagMesh=new THREE.Mesh(fg,new THREE.MeshStandardMaterial({color:0xc0392b,side:THREE.DoubleSide,roughness:0.9}));
    flagMesh.position.set(4.0,poleH-0.6,3.1); flagMesh.userData.base=fg.attributes.position.array.slice(); g.add(flagMesh);
  }
  function buildSong(){
    const g=towerGroup, wC=0xc9a878, tC=0x4a5560;
    addM(g,new THREE.BoxGeometry(3.2,3.2,3.2),new THREE.MeshStandardMaterial({color:wC,roughness:0.8,flatShading:true}),0,1.9,0);
    addM(g,new THREE.ConeGeometry(3.4,1.0,4),new THREE.MeshStandardMaterial({color:tC,roughness:0.6,flatShading:true}),0,3.7,0,Math.PI/4);
    addM(g,new THREE.BoxGeometry(2.4,1.2,2.4),new THREE.MeshStandardMaterial({color:wC,roughness:0.8,flatShading:true}),0,4.8,0);
    addM(g,new THREE.ConeGeometry(2.6,0.9,4),new THREE.MeshStandardMaterial({color:tC,roughness:0.6,flatShading:true}),0,5.85,0,Math.PI/4);
    addM(g,new THREE.SphereGeometry(0.18,12,12),new THREE.MeshStandardMaterial({color:0xd4af37,metalness:0.7,roughness:0.3}),0,6.4,0);
  }
  function buildMing(){
    const g=towerGroup, wC=0x9a2a2a, gC=0xf0c020;
    const L=[{w:4.0,h:2.2,r:3.0,rh:1.8},{w:3.2,h:1.9,r:2.5,rh:1.5},{w:2.4,h:1.6,r:2.0,rh:1.3}];
    let y=0;
    L.forEach(l=>{
      addM(g,new THREE.BoxGeometry(l.w,l.h,l.w),new THREE.MeshStandardMaterial({color:wC,roughness:0.7,flatShading:true}),0,y+l.h/2,0);
      addM(g,new THREE.ConeGeometry(l.r,l.rh,4),new THREE.MeshStandardMaterial({color:gC,metalness:0.5,roughness:0.35,flatShading:true}),0,y+l.h+l.rh/2,0,Math.PI/4);
      [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([sx,sz])=>{ const t=addM(g,new THREE.ConeGeometry(0.18,0.7,4),new THREE.MeshStandardMaterial({color:gC,metalness:0.5,roughness:0.35}),sx*l.r*0.7,y+l.h+l.rh*0.15,sz*l.r*0.7); t.rotation.z=sx*0.9; t.rotation.x=sz*0.9; });
      y+=l.h+l.rh*0.82;
    });
    addM(g,new THREE.SphereGeometry(0.25,14,14),new THREE.MeshStandardMaterial({color:gC,metalness:0.8,roughness:0.25,emissive:0x3a2a00,emissiveIntensity:0.3}),0,y+0.3,0);
  }
  function buildModern(){
    const g=towerGroup, cC=0xc8ccd0;
    const sizes=[3.2,2.8,2.4,2.0,1.6], h=1.5; let y=0;
    sizes.forEach((s,i)=>{
      addM(g,new THREE.BoxGeometry(s,h,s),new THREE.MeshStandardMaterial({color:cC,roughness:0.85,metalness:0.05,flatShading:true}),0,y+h/2,0);
      if(i<sizes.length-1) addM(g,new THREE.BoxGeometry(s*1.12,0.18,s*1.12),new THREE.MeshStandardMaterial({color:0x6a7078,roughness:0.7,flatShading:true}),0,y+h,0);
      y+=h;
    });
    [{r:1.4,h:1.2},{r:1.0,h:1.0},{r:0.6,h:0.9}].forEach(S=>{ addM(g,new THREE.ConeGeometry(S.r,S.h,6),new THREE.MeshStandardMaterial({color:0x46566a,roughness:0.5,metalness:0.3,flatShading:true}),0,y+S.h/2,0); y+=S.h*0.85; });
    [[0.5,0.5],[-0.5,0.5],[0.5,-0.5],[-0.5,-0.5]].forEach(([lx,lz])=>addM(g,new THREE.SphereGeometry(0.18,12,12),new THREE.MeshStandardMaterial({color:0xff3a3a,emissive:0xff2020,emissiveIntensity:0.9,roughness:0.4}),lx*1.2,y+0.2,lz*1.2));

  function buildDynastyTower(idx){
    flagMesh=null;
    if(idx===0)buildTang(); else if(idx===1)buildSong(); else if(idx===2)buildMing(); else buildModern();
  }
  function startTowerTransition(idx){
    if(fadingGroup){ disposeGroup(fadingGroup); scene.remove(fadingGroup); fadingGroup=null; }
    fadingGroup = towerGroup;
    towerGroup = new THREE.Group(); towerGroup.position.copy(TOWER_POS); scene.add(towerGroup);

  /* ---- POI 光点 + CSS2D 标签 ---- */
  const poiMeshes = [];
  const poiLabels = [];

  /* ---- 规划模式发光曲线 ---- */
  let routeLine = null;
  function buildRouteLine(collectedIds){
    if(routeLine){ scene.remove(routeLine); routeLine.geometry.dispose(); routeLine.material.dispose(); routeLine=null; }
    if(collectedIds.length < 2) return;
    const pts = collectedIds.map(id=>{
      const p = POIS.find(x=>x.id===id);
      return new THREE.Vector3(p.pos[0], p.isTower?6:2.5, p.pos[2]);
    });
    if(pts.length===2) pts.push(pts[1].clone()); // CatmullRom 至少3点

  /* ============== 朝代过渡 ============== */
  const _cA=new THREE.Color(), _cB=new THREE.Color();
  function lerpColor(a,b,t){ _cA.setHex(a); _cB.setHex(b); return _cA.clone().lerp(_cB,t); }
  function lerpDynasty(t){
    t=Math.max(0,Math.min(1,t));
    const seg=t*3, i=Math.min(2,Math.floor(seg)), f=seg-i;
    const a=DYNASTIES[i], b=DYNASTIES[i+1];
    return { mapColor:lerpColor(a.mapColor,b.mapColor,f), fogColor:lerpColor(a.fogColor,b.fogColor,f),
      skyTop:lerpColor(parseInt(a.skyTop.slice(1),16),parseInt(b.skyTop.slice(1),16),f),
      skyBottom:lerpColor(parseInt(a.skyBottom.slice(1),16),parseInt(b.skyBottom.slice(1),16),f) };
  }

  /* ============== 交互：相机拖拽/缩放/点击 ============== */
  let targetT=0, displayT=0;

  canvas.addEventListener('pointerdown', e=>{

    if(!dragging) return;

  });

  const raycaster = new THREE.Raycaster();

  function handlePick(e){
    const rect = canvas.getBoundingClientRect();
    mouse.x = ((e.clientX-rect.left)/rect.width)*2 - 1;
    mouse.y = -((e.clientY-rect.top)/rect.height)*2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(poiMeshes, false);
    if(hits.length>0){

  /* ---- 探索：详情卡 ---- */
  function showDetail(poi){

    if(collected.has(poi.id)){

      collected.add(poi.id);

  /* ---- 规划视图 ---- */
  function renderPlan(){
    const box = document.getElementById('view-plan');
    if(collected.size < 2){
      box.innerHTML = `<div class="plan-hint"><span class="big">收藏至少 2 个景点</span>在探索模式点击光点并收藏，<br>即可在此生成专属游览路线。</div>`;
      buildRouteLine([]);
      return;
    }
    const ids = [...collected];
    let total = 0;
    for(let i=0;i<ids.length-1;i++){
      const a=POIS.find(p=>p.id===ids[i]), b=POIS.find(p=>p.id===ids[i+1]);
      total += Math.hypot(a.pos[0]-b.pos[0], a.pos[2]-b.pos[2]);
    }
    const km = (total*0.1).toFixed(1);
    const hours = Math.max(1, Math.round(total*0.1/3 + ids.length*0.5));
    const wpHtml = ids.map((id,i)=>{
      const p=POIS.find(x=>x.id===id);

      </div>

      <div class="wp-list">${wpHtml}</div>
      <div class="dc-label" style="margin-bottom:6px">停 留 建 议</div>
      <div style="margin-bottom:16px">${suggestions}</div>
      <div class="plan-actions">
        <button class="btn-soft" id="btnSave">💾 保存路线</button>
        <button class="btn-soft" id="btnShare">📤 分享到社区</button>
      </div>`;
    document.getElementById('btnSave').addEventListener('click', ()=> toast('路线已保存到我的足迹'));
    document.getElementById('btnShare').addEventListener('click', ()=> toast('已分享到社区，等待审核'));

  }

  /* ---- 社区视图 ---- */
  function renderCommunity(){
    const box = document.getElementById('view-community');
    box.innerHTML = COMMUNITY.map((r,i)=>`
      <div class="route-card">
        <div class="rc-head">
          <div class="rc-avatar" style="background:${r.color}">${r.initial}</div>
          <div><div class="rc-name">${r.name}</div><div class="rc-author">作者：${r.author}</div></div>
        </div>
        <div class="rc-meta">
          <span>📋 复制 ${r.copies} 次</span><span>⭐ ${r.rating}</span>
        </div>
        <div class="rc-pois">途经：${r.pois.map(id=>POIS.find(p=>p.id===id).name).join(' → ')}</div>
        <button class="btn-copy" data-i="${i}">📋 复制路线</button>
      </div>`).join('');
    box.querySelectorAll('.btn-copy').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = parseInt(btn.dataset.i);
        const r = COMMUNITY[i];
        highlightedPois = new Set(r.pois);
        btn.classList.add('copied'); btn.textContent = '已复制';
        toast('已复制「'+r.name+'」，对应景点已高亮');
        setTimeout(()=>{ highlightedPois.clear(); btn.classList.remove('copied'); btn.textContent='📋 复制路线'; }, 4000);
      });
    });
  }

  /* ---- Toast ---- */
  let toastTimer=null;
  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
  }

  document.getElementById('navFootprint').addEventListener('click', ()=> toast('「我的足迹」即将上线，敬请期待'));

  /* ============== 时间轴 ============== */
  const slider = document.getElementById('slider');
  slider.addEventListener('input', e=>{ targetT = e.target.value/1000; });
  document.querySelectorAll('.tl-label').forEach(lb=>{
    lb.addEventListener('click', ()=>{ const v=Math.round(lb.dataset.i/3*1000); slider.value=v; targetT=v/1000; });
  });
  const tlTicks = document.querySelectorAll('.tl-tick');
  const tlLabels = document.querySelectorAll('.tl-label');
  let lastDynIdx = 0;

  function updateDynastyUI(idx){
    if(idx===lastDynIdx) return;
    lastDynIdx = idx;
    tlTicks.forEach((t,i)=> t.classList.toggle('active', i===idx));
    tlLabels.forEach((l,i)=> l.classList.toggle('active', i===idx));
    // POI 标签文字 + 显隐
    poiLabels.forEach(({div,poi})=>{
      const txt = poi.labels[idx];
      if(txt===''){ div.style.opacity='0'; div.style.transform='scale(0.6)'; }
      else { div.textContent=txt; div.style.opacity='1'; div.style.transform='scale(1)'; }
    });
    // 若详情卡打开，刷新朝代标签
    const d = document.getElementById('detail');
    if(d.style.display!=='none'){
      const tag = d.querySelector('.dc-tag');
      if(tag) tag.textContent = `${DYNASTIES[idx].name}代 · ${currentPOI?currentPOI.labels[idx]:''}`;
    }
  }
  let currentPOI = null;
  const origShowDetail = showDetail;
  showDetail = function(poi){ currentPOI = poi; origShowDetail(poi); };

  /* ============== 渲染循环 ============== */
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());
    const time = clock.elapsedTime;

    displayT += (targetT-displayT)*Math.min(1, dt*4.5);
    const p = lerpDynasty(displayT);

    // 地图色调 / 雾 / 天空
    groundMat.color.copy(p.mapColor);
    scene.fog.color.copy(p.fogColor);
    skyMat.uniforms.top.value.setHex(p.skyTop);
    skyMat.uniforms.bottom.value.setHex(p.skyBottom);

    // 朝代切换 → 黄鹤楼淡入淡出
    const dynIdx = Math.round(displayT*3);
    if(dynIdx !== activeStyleIdx){ startTowerTransition(dynIdx); }
    updateDynastyUI(dynIdx);
    if(fadeActive){
      fadeOutT += dt/FADE_DUR; fadeInT += dt/FADE_DUR;
      setGroupOpacity(fadingGroup, Math.max(0, 1-fadeOutT));
      setGroupOpacity(towerGroup, Math.min(1, fadeInT));
      if(fadeOutT>=1 && fadingGroup){ disposeGroup(fadingGroup); scene.remove(fadingGroup); fadingGroup=null; }
      if(fadeInT>=1){ fadeActive=false; setGroupOpacity(towerGroup,1); }
    }

    // 旌旗飘动
    if(flagMesh){
      const pos=flagMesh.geometry.attributes.position, base=flagMesh.userData.base;
      for(let i=0;i<pos.count;i++){
        const x=base[i*3], y=base[i*3+1];
        pos.setZ(i, Math.sin(x*3.2+time*5)*0.16*(0.3+x/1.7)+Math.sin(y*2+time*4)*0.04);
      }
      pos.needsUpdate=true;
    }

    // POI 悬浮 + 脉冲 + 高亮
    poiMeshes.forEach((orb,i)=>{
      orb.position.y = orb.userData.baseY + Math.sin(time*1.6 + i*1.1)*0.25;
      const isHi = highlightedPois.has(orb.userData.poi.id);
      const pulse = isHi ? (1 + 0.4*Math.sin(time*6)) : 1;
      orb.scale.setScalar(pulse);
      orb.material.emissiveIntensity = isHi ? (1.2 + 0.6*Math.sin(time*6)) : (0.7 + 0.3*Math.sin(time*2+i));
    });

    // 路线曲线发光呼吸
    if(routeLine){ routeLine.material.emissiveIntensity = 0.6 + 0.4*Math.sin(time*2.5); }

    // 相机
    camAz += (targetAz-camAz)*Math.min(1,dt*3);
    camDist += (targetDist-camDist)*Math.min(1,dt*3);
    camera.position.set(Math.sin(camAz)*camDist, camDist*0.7, Math.cos(camAz)*camDist);
    camera.lookAt(camTarget);

    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }

  /* ============== 启动 ============== */
  resize();
  buildDynastyTower(0);
  activeStyleIdx = 0;
  setGroupOpacity(towerGroup, 1);
  animate();
  setTimeout(()=> document.getElementById('loader').classList.add('hide'), 500);
  </script>
</body>
</html>
