<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>打工人记账本 · 试玩版</title>
  <style>
    :root {
      --bg: #ececec;
      --bg-soft: #f3f3f3;
      --card: #efefef;
      --card-strong: #e6e6e6;
      --ink: #111111;
      --muted: #666666;
      --muted-2: #8e8e93;
      --dark: #121212;
      --black: #000000;
      --white: #ffffff;
      --positive: #007641;
      --positive-soft: rgba(0, 118, 65, 0.12);
      --negative: #e63946;
      --negative-soft: rgba(230, 57, 70, 0.12);
      --border: rgba(0, 0, 0, 0.08);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 20px 16px 110px;
    }

    .app {
      max-width: 1080px;
      margin: 0 auto;
    }

    .shell {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr;
      gap: 18px;
      align-items: start;
    }

    .mobile-only {
      display: none;
    }

    .desktop-only {
      display: block;
    }

    .hero {
      padding: 8px 4px 0;
      margin-bottom: 14px;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted-2);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 34px;
      line-height: 1.18;
      margin: 0;
    }

    .hero p {
      font-size: 15px;
      line-height: 1.7;
      color: var(--muted);
      margin: 12px 0 0;
    }

    .card,
    .card-soft,
    .card-dark,
    .card-black {
      border-radius: var(--radius-xl);
      padding: 22px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
    }

    .card-soft {
      background: rgba(255, 255, 255, 0.52);
      border: 1px solid var(--border);
    }

    .card-dark {
      background: var(--dark);
      color: var(--white);
    }

    .card-dark .sub,
    .card-black .sub {
      color: rgba(255, 255, 255, 0.72);
    }

    .card-black {
      background: var(--black);
      color: var(--white);
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
      margin: 0;
    }

    .title-lg {
      font-size: 42px;
      font-weight: 700;
      line-height: 1.05;
      margin: 0;
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin: 0;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .row-start {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .stack-12 > * + * { margin-top: 12px; }
    .stack-16 > * + * { margin-top: 16px; }
    .stack-20 > * + * { margin-top: 20px; }
    .stack-24 > * + * { margin-top: 24px; }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      background: var(--card-strong);
      color: var(--ink);
      font-size: 13px;
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .pill.gray {
      background: rgba(17, 17, 17, 0.05);
      color: var(--muted);
    }

    .pill.positive {
      background: var(--positive-soft);
      color: var(--positive);
    }

    .pill.negative {
      background: var(--negative-soft);
      color: var(--negative);
    }

    .picker {
      border: none;
      background: rgba(17, 17, 17, 0.05);
      color: var(--ink);
      padding: 10px 14px;
      border-radius: var(--radius-pill);
      font: inherit;
    }

    .metric-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      padding: 16px;
    }

    .metric-card.light {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--border);
    }

    .seg {
      display: flex;
      background: rgba(17, 17, 17, 0.05);
      padding: 6px;
      border-radius: var(--radius-pill);
      gap: 6px;
    }

    .seg button {
      flex: 1;
      border: none;
      background: transparent;
      border-radius: var(--radius-pill);
      padding: 12px 10px;
      font: inherit;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }

    .seg button.active {
      background: var(--black);
      color: var(--white);
    }

    .wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .item {
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.48);
      padding: 16px;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .item:hover {
      transform: translateY(-1px);
    }

    .item.active-income {
      background: var(--positive-soft);
      border-color: rgba(0, 118, 65, 0.24);
    }

    .item.active-expense {
      background: var(--negative-soft);
      border-color: rgba(230, 57, 70, 0.24);
    }

    .item-name {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
    }

    .item-score {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
    }

    .active-income .item-score { color: var(--positive); }
    .active-expense .item-score { color: var(--negative); }

    .btn-primary,
    .btn-ghost {
      width: 100%;
      border: none;
      border-radius: var(--radius-md);
      padding: 16px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--black);
      color: var(--white);
    }

    .btn-ghost {
      background: rgba(17, 17, 17, 0.05);
      color: var(--ink);
    }

    .feedback {
      white-space: pre-line;
      word-break: break-word;
    }

    .panel {
      position: sticky;
      top: 20px;
    }

    .tab-switcher {
      display: inline-flex;
      gap: 8px;
      background: rgba(17, 17, 17, 0.05);
      border-radius: var(--radius-pill);
      padding: 6px;
      margin-bottom: 14px;
    }

    .tab-switcher button {
      border: none;
      background: transparent;
      border-radius: var(--radius-pill);
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
    }

    .tab-switcher button.active {
      background: var(--black);
      color: var(--white);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .weekday {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding-bottom: 4px;
    }

    .day {
      min-height: 62px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.48);
      border: 1px solid var(--border);
      padding: 10px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: space-between;
    }

    .day.out {
      opacity: 0.35;
    }

    .day.selected {
      outline: 2px solid var(--black);
    }

    .day.pos {
      background: var(--positive-soft);
      border-color: rgba(0, 118, 65, 0.24);
    }

    .day.zero {
      background: rgba(17, 17, 17, 0.08);
      border-color: rgba(17, 17, 17, 0.12);
    }

    .day.neg {
      background: var(--negative-soft);
      border-color: rgba(230, 57, 70, 0.24);
    }

    .day-number {
      font-size: 13px;
      font-weight: 700;
    }

    .day-net {
      font-size: 11px;
      color: var(--muted);
    }

    .trend-row {
      display: grid;
      grid-template-columns: 62px 1fr 56px;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }

    .bar-wrap {
      height: 10px;
      border-radius: var(--radius-pill);
      background: rgba(17, 17, 17, 0.08);
      overflow: hidden;
    }

    .bar {
      height: 100%;
      border-radius: var(--radius-pill);
    }

    .bar.pos { background: var(--positive); }
    .bar.neg { background: var(--negative); }

    .poster {
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 22%), var(--bg);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      padding: 18px;
      overflow: hidden;
    }

    .poster-hero {
      font-size: 44px;
      font-weight: 700;
      line-height: 1;
      margin: 12px 0 6px;
    }

    .poster-card {
      background: var(--dark);
      color: var(--white);
      border-radius: var(--radius-xl);
      padding: 18px;
      margin-top: 16px;
    }

    .poster-card .muted {
      color: rgba(255, 255, 255, 0.72);
    }

    .report-text {
      background: rgba(255, 255, 255, 0.48);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      white-space: pre-line;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.75;
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .tabbar {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .tabbar-inner {
      width: min(520px, 100%);
      background: var(--black);
      border-radius: var(--radius-pill);
      padding: 8px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .tabbar button {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted-2);
      border-radius: var(--radius-pill);
      padding: 14px 10px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .tabbar button.active {
      background: rgba(255, 255, 255, 0.08);
      color: var(--white);
    }

    .helper-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .mini-actions {
      display: flex;
      gap: 10px;
    }

    .mini-actions button {
      flex: 1;
    }

    @media (max-width: 920px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .panel {
        position: static;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 16px 12px 110px;
      }

      .desktop-only {
        display: none;
      }

      .mobile-only {
        display: inline-flex;
      }

      h1 {
        font-size: 28px;
      }

      .title-lg {
        font-size: 36px;
      }

      .grid,
      .metric-row {
        grid-template-columns: 1fr;
      }

      .calendar-grid {
        gap: 6px;
      }

      .day {
        min-height: 56px;
      }

      .poster-hero {
        font-size: 36px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <div class="eyebrow">Worker Ledger · HTML Playground</div>
      <h1>打工人记账本 · 浏览器试玩版</h1>
      <p>这个单文件 HTML 复刻了小程序的核心体验。你可以直接点选回血/工伤项目、保存本地记录、切到月历看记录，再生成一份可复制的战报。</p>
    </div>

    <div class="tab-switcher mobile-only" id="mobileTabs"></div>

    <div class="shell">
      <section class="stack-16" id="mainContent"></section>
      <aside class="panel stack-16 desktop-only" id="sidePanel"></aside>
    </div>
  </div>

  <div class="tabbar">
    <div class="tabbar-inner" id="tabbar"></div>
  </div>

  <script>
    const STORAGE_KEY = "worker_ledger_html_playground_v1";
    const TABS = [
      { key: "today", label: "今日" },
      { key: "calendar", label: "月历" },
      { key: "report", label: "战报" }
    ];

    const incomeCategories = [
      { key: "improve", name: "自我提升" },
      { key: "life", name: "生活管理" },
      { key: "health", name: "健康维护" },
      { key: "plan", name: "计划未来" }
    ];

    const expenseCategories = [
      { key: "comm", name: "沟通工伤" },
      { key: "emotion", name: "情绪工伤" },
      { key: "body", name: "体力工伤" },
      { key: "focus", name: "注意力工伤" }
    ];

    const presetIncome = [
      { id: "i_duolingo", type: "income", category: "improve", name: "多邻国 10 分钟", score: 4, guidance: "带薪升级，不算摆烂。" },
      { id: "i_podcast", type: "income", category: "improve", name: "听播客", score: 3, guidance: "让脑子换个频道。" },
      { id: "i_cert", type: "income", category: "improve", name: "考证/学习资料", score: 5, guidance: "偷偷变强，悄悄离开。" },
      { id: "i_article", type: "income", category: "improve", name: "看行业文章", score: 3, guidance: "表面工作，内里进修。" },
      { id: "i_tool", type: "income", category: "improve", name: "学一个工具技巧", score: 4, guidance: "小技巧也是护城河。" },
      { id: "i_charge", type: "income", category: "life", name: "下班前充好电", score: 2, guidance: "秩序感，也是续命。" },
      { id: "i_album", type: "income", category: "life", name: "整理相册/文件", score: 3, guidance: "把生活捋顺一点。" },
      { id: "i_bill", type: "income", category: "life", name: "处理生活缴费", score: 3, guidance: "成年人的琐事，不会消失。" },
      { id: "i_shopping", type: "income", category: "life", name: "清理购物车", score: 2, guidance: "只看不买，也算克制。" },
      { id: "i_delivery", type: "income", category: "life", name: "看快递/取快递", score: 2, guidance: "生活在上班间隙发生。" },
      { id: "i_stretch", type: "income", category: "health", name: "站起来拉伸", score: 3, guidance: "身体不是永动机。" },
      { id: "i_water", type: "income", category: "health", name: "接水/走动", score: 2, guidance: "给自己一点流动性。" },
      { id: "i_rest_eyes", type: "income", category: "health", name: "闭眼休息 1 分钟", score: 2, guidance: "眼睛也需要下班。" },
      { id: "i_toilet", type: "income", category: "health", name: "带薪拉粑粑", score: 5, guidance: "这叫维护人类机能。" },
      { id: "i_breath", type: "income", category: "health", name: "深呼吸 10 次", score: 2, guidance: "把气喘匀再继续。" },
      { id: "i_weekend", type: "income", category: "plan", name: "计划周末出游", score: 4, guidance: "对未来的期待就是续命。" },
      { id: "i_food", type: "income", category: "plan", name: "想想晚上吃什么", score: 2, guidance: "今天再苦，晚饭要香。" },
      { id: "i_gym_plan", type: "income", category: "plan", name: "规划运动安排", score: 3, guidance: "把自己当项目管理。" },
      { id: "i_budget", type: "income", category: "plan", name: "安排下周计划", score: 3, guidance: "先把未来握在手里一点。" }
    ];

    const presetExpense = [
      { id: "e_meeting", type: "expense", category: "comm", name: "无效会议", score: 8, guidance: "这不是开会，是时间蒸发。" },
      { id: "e_rework", type: "expense", category: "comm", name: "反复修改", score: 6, guidance: "改到最后，谁也不记得初衷。" },
      { id: "e_sudden_meet", type: "expense", category: "comm", name: "临时拉会", score: 7, guidance: "你的时间被抢走了。" },
      { id: "e_unclear", type: "expense", category: "comm", name: "需求说不清", score: 5, guidance: "你在猜题，但没人出卷。" },
      { id: "e_report", type: "expense", category: "comm", name: "被迫汇报/对齐", score: 5, guidance: "把话说圆，也算体力活。" },
      { id: "e_urge", type: "expense", category: "emotion", name: "被催进度", score: 4, guidance: "事情没变快，心跳先变快。" },
      { id: "e_yy", type: "expense", category: "emotion", name: "被阴阳", score: 6, guidance: "你没错，只是有人嘴欠。" },
      { id: "e_blame", type: "expense", category: "emotion", name: "背锅", score: 9, guidance: "锅很大，但不是你做的。" },
      { id: "e_pua", type: "expense", category: "emotion", name: "被 PUA", score: 8, guidance: "别信，先保护自己。" },
      { id: "e_change", type: "expense", category: "emotion", name: "需求临时变卦", score: 7, guidance: "世界在变，但累的总是你。" },
      { id: "e_overtime", type: "expense", category: "body", name: "加班", score: 8, guidance: "工位在吃人。" },
      { id: "e_neck", type: "expense", category: "body", name: "脖子酸/肩颈痛", score: 4, guidance: "你不是金属关节。" },
      { id: "e_eye", type: "expense", category: "body", name: "眼睛干/眼酸", score: 4, guidance: "屏幕不是太阳。" },
      { id: "e_no_break", type: "expense", category: "body", name: "中午没休息", score: 5, guidance: "你不是永动机。" },
      { id: "e_msg_afterwork", type: "expense", category: "body", name: "下班还在回消息", score: 6, guidance: "下班不代表下线，是很离谱的。" },
      { id: "e_interrupt", type: "expense", category: "focus", name: "被频繁打断", score: 6, guidance: "刚进入状态就被拽出来。" },
      { id: "e_group", type: "expense", category: "focus", name: "群消息轰炸", score: 4, guidance: "信息像雨一样砸下来。" },
      { id: "e_multitask", type: "expense", category: "focus", name: "多线程切换", score: 5, guidance: "脑子不是八核 CPU。" },
      { id: "e_context", type: "expense", category: "focus", name: "反复切窗口", score: 4, guidance: "注意力被撕成碎片。" }
    ];

    const quotes = {
      light: [
        "你不是效率低，是流程太碎。",
        "工位上没人懂你，系统懂。",
        "今天也适合在缝隙里喘口气。",
        "带薪升级，不算摆烂。"
      ],
      yin: [
        "这不是开会，这是集体浪费生命。",
        "组织可能没奖励你，但系统决定给你记一功。",
        "需求虽然变了，但受伤的总是你。",
        "你不是没脾气，你只是还没下班。"
      ],
      soft: [
        "没关系，今天能撑下来已经算赢。",
        "你记录的不是摆烂，是努力活着的证据。",
        "先把自己照顾好，再谈别的。"
      ]
    };

    const state = {
      currentTab: "today",
      mode: "income",
      dateStr: formatDate(new Date()),
      monthCursor: new Date(),
      reportDate: formatDate(new Date()),
      quote: "",
      bubble: "",
      feedback: "点一点项目，系统帮你把今天的工位状态算明白。",
      copied: false
    };

    function loadStore() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { records: {}, selectedIncome: {}, selectedExpense: {} };
      } catch (e) {
        return { records: {}, selectedIncome: {}, selectedExpense: {} };
      }
    }

    function saveStore(store) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function formatDate(d) {
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function parseDateStr(s) {
      const [y, m, d] = s.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function weekdayText(dateStr) {
      const map = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      return map[parseDateStr(dateStr).getDay()];
    }

    function randPick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function getCurrentRecord() {
      const store = loadStore();
      return store.records[state.dateStr] || {
        dateStr: state.dateStr,
        selectedIncome: {},
        selectedExpense: {},
        incomeTotal: 0,
        expenseTotal: 0,
        net: 0,
        title: "持平打工人",
        comment: "今天没赢也没输，先这样吧。"
      };
    }

    function buildItemsById() {
      const map = {};
      [...presetIncome, ...presetExpense].forEach(item => { map[item.id] = item; });
      return map;
    }

    function sumSelected(selectedMap, itemsById) {
      return Object.keys(selectedMap || {}).reduce((acc, id) => {
        const item = itemsById[id];
        if (!item) return acc;
        return acc + (item.score || 0) * (selectedMap[id] || 0);
      }, 0);
    }

    function computeTitle(net) {
      if (net >= 20) return { title: "工位潜行王", comment: "你在组织眼皮底下完成了灵魂自救。" };
      if (net >= 10) return { title: "缝隙生存大师", comment: "虽然流程离谱，但你稳住了。" };
      if (net >= 1) return { title: "边干边活选手", comment: "不多，但够用。你还在往前。" };
      if (net === 0) return { title: "持平打工人", comment: "今天没赢也没输，先这样吧。" };
      if (net > -10) return { title: "轻伤继续营业", comment: "小伤不碍事，记得喘口气。" };
      if (net > -20) return { title: "会议受害者", comment: "你失去了一些时间，但保住了理智（大概）。" };
      return { title: "工位体验官", comment: "今天工伤过重，建议明日申请灵魂调休。" };
    }

    function getModeData() {
      const record = getCurrentRecord();
      const categories = state.mode === "income" ? incomeCategories : expenseCategories;
      const selectedMap = state.mode === "income" ? record.selectedIncome : record.selectedExpense;
      const category = state.category || categories[0].key;
      const list = (state.mode === "income" ? presetIncome : presetExpense).filter(item => item.category === category);
      return { record, categories, selectedMap, category, list };
    }

    function ensureCategory() {
      const categories = state.mode === "income" ? incomeCategories : expenseCategories;
      if (!categories.some(x => x.key === state.category)) {
        state.category = categories[0].key;
      }
    }

    function updateRecord(mutator) {
      const store = loadStore();
      const record = store.records[state.dateStr] || {
        dateStr: state.dateStr,
        selectedIncome: {},
        selectedExpense: {}
      };
      mutator(record);
      const itemsById = buildItemsById();
      record.incomeTotal = sumSelected(record.selectedIncome, itemsById);
      record.expenseTotal = sumSelected(record.selectedExpense, itemsById);
      record.net = record.incomeTotal - record.expenseTotal;
      const titleInfo = computeTitle(record.net);
      record.title = titleInfo.title;
      record.comment = titleInfo.comment;
      record.updatedAt = Date.now();
      store.records[state.dateStr] = record;
      saveStore(store);
      state.reportDate = state.dateStr;
    }

    function setRandomCopy() {
      state.quote = Math.random() < 0.4
        ? randPick([...quotes.light, ...quotes.yin])
        : randPick(quotes.light);
      state.bubble = randPick([...quotes.light, ...quotes.soft]);
    }

    function getGuidance() {
      const { list, selectedMap } = getModeData();
      const selectedIds = Object.keys(selectedMap || {});
      if (selectedIds.length) {
        const current = buildItemsById()[selectedIds[selectedIds.length - 1]];
        if (current && current.guidance) return current.guidance;
      }
      if (list.length) return randPick(list.map(item => item.guidance).filter(Boolean));
      return state.mode === "income" ? "带薪回血，属于自救。" : "工伤记录在案，方便回看。";
    }

    function toggleItem(id) {
      updateRecord(record => {
        const key = state.mode === "income" ? "selectedIncome" : "selectedExpense";
        const map = { ...(record[key] || {}) };
        const item = buildItemsById()[id];
        if (map[id]) {
          delete map[id];
          state.feedback = `取消：${item ? item.name : ""}`;
        } else {
          map[id] = 1;
          const sign = state.mode === "income" ? "+" : "-";
          const verb = state.mode === "income" ? "回血" : "工伤";
          state.feedback = `${verb} ${sign}${item.score}：${item.name}`;
        }
        record[key] = map;
      });
      if (Math.random() < 0.35) {
        state.bubble = randPick([...quotes.yin, ...quotes.light]);
      }
      render();
    }

    function saveTodayRecord() {
      updateRecord(record => {
        record.saved = true;
      });
      state.feedback = "今日已存档。需要的话，去生成一张战报当证据。";
      state.bubble = randPick(quotes.soft);
      render();
      alert("已保存到浏览器本地。下次打开这个 HTML 还能继续试玩。");
    }

    function topSingleName(selectedMap) {
      const itemsById = buildItemsById();
      let winner = null;
      Object.keys(selectedMap || {}).forEach(id => {
        const item = itemsById[id];
        if (!item) return;
        if (!winner || item.score > winner.score) {
          winner = item;
        }
      });
      return winner ? winner.name : "—";
    }

    function buildReportText(record, extraLine) {
      const sign = record.net >= 0 ? "+" : "";
      return [
        `【${record.dateStr} 上班战报】`,
        `摸鱼收入：+${record.incomeTotal}  工伤支出：-${record.expenseTotal}  净：${sign}${record.net}`,
        `称号：${record.title}`,
        `总结：${extraLine || record.comment}`,
        `Top回血：${topSingleName(record.selectedIncome)}`,
        `Top工伤：${topSingleName(record.selectedExpense)}`,
        "",
        "（来自：打工人记账本）"
      ].join("\\n");
    }

    function getReportRecord() {
      const store = loadStore();
      return store.records[state.reportDate] || null;
    }

    function monthLabel(date) {
      return `${date.getFullYear()}年${date.getMonth() + 1}月`;
    }

    function getMonthGrid(date) {
      const start = new Date(date.getFullYear(), date.getMonth(), 1);
      const firstWeekday = start.getDay();
      const gridStart = new Date(start);
      gridStart.setDate(start.getDate() - firstWeekday);
      const cells = [];
      for (let i = 0; i < 42; i++) {
        const cur = new Date(gridStart);
        cur.setDate(gridStart.getDate() + i);
        cells.push({
          dateStr: formatDate(cur),
          day: cur.getDate(),
          inMonth: cur.getMonth() === date.getMonth()
        });
      }
      return cells;
    }

    function buildTodayView() {
      ensureCategory();
      const { record, categories, selectedMap, category, list } = getModeData();
      const guidance = getGuidance();
      return `
        <div class="card-soft stack-12">
          <div class="row-start">
            <div>
              <div class="eyebrow">Today</div>
              <div class="title">Hi，今天也在工位求生</div>
              <p class="sub">${state.dateStr} ${weekdayText(state.dateStr)}</p>
            </div>
            <input class="picker" type="date" value="${state.dateStr}" onchange="onDateChange(this.value)" />
          </div>
          <p class="sub">${state.quote}</p>
        </div>

        <div class="card-dark stack-20">
          <div class="row">
            <div>
              <div class="title">今日结算</div>
              <p class="sub">称号：${record.title || "持平打工人"}</p>
            </div>
            <span class="pill ${record.net >= 0 ? "positive" : "negative"}">${record.net >= 0 ? "+" : ""}${record.net || 0}</span>
          </div>
          <div class="title-lg">${record.net >= 0 ? "+" : ""}${record.net || 0}</div>
          <div class="metric-row">
            <div class="metric-card stack-12">
              <p class="sub">摸鱼收入</p>
              <div class="title">${record.incomeTotal || 0}</div>
            </div>
            <div class="metric-card stack-12">
              <p class="sub">工伤支出</p>
              <div class="title">${record.expenseTotal || 0}</div>
            </div>
          </div>
          <p class="sub">${record.comment || "今天没赢也没输，先这样吧。"}</p>
        </div>

        <div class="card stack-20">
          <div>
            <div class="title">今日选择</div>
            <p class="sub">浅色主区承接操作，红绿只保留给结果和选中态。</p>
          </div>

          <div class="seg">
            <button class="${state.mode === "income" ? "active" : ""}" onclick="setMode('income')">今日回血方式</button>
            <button class="${state.mode === "expense" ? "active" : ""}" onclick="setMode('expense')">今日工伤</button>
          </div>

          <div class="wrap">
            ${categories.map(item => `
              <button class="pill ${category === item.key ? (state.mode === "income" ? "positive" : "negative") : "gray"}" onclick="setCategory('${item.key}')">${item.name}</button>
            `).join("")}
          </div>

          <div class="card-soft stack-12">
            <p class="sub">${state.mode === "income" ? "回血提示" : "工伤备注"}</p>
            <div>${guidance}</div>
          </div>

          <div class="grid">
            ${list.map(item => `
              <div class="item ${selectedMap[item.id] ? (state.mode === "income" ? "active-income" : "active-expense") : ""}" onclick="toggleItem('${item.id}')">
                <div class="item-name">${item.name}</div>
                <div class="item-score">${state.mode === "income" ? "+" : "-"}${item.score}</div>
              </div>
            `).join("")}
          </div>

          <button class="btn-ghost" onclick="resetCurrentDate()">清空这一天重新试玩</button>
        </div>

        <div class="card-soft stack-12">
          <div class="row">
            <p class="sub">实时反馈</p>
            <p class="sub">最近操作</p>
          </div>
          <div class="feedback">${state.feedback}</div>
          <p class="sub">${state.bubble}</p>
        </div>

        <div class="mini-actions">
          <button class="btn-primary" onclick="saveTodayRecord()">保存今日记录</button>
          <button class="btn-ghost" onclick="goReport()">生成今日战报</button>
        </div>
      `;
    }

    function buildCalendarView() {
      const store = loadStore();
      const records = store.records || {};
      const cells = getMonthGrid(state.monthCursor);
      const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const monthRecords = Object.values(records).filter(record => record.dateStr.startsWith(`${state.monthCursor.getFullYear()}-${pad2(state.monthCursor.getMonth() + 1)}`));
      const monthNet = monthRecords.reduce((sum, record) => sum + (record.net || 0), 0);
      const monthDays = monthRecords.length;
      const best = monthRecords.slice().sort((a, b) => (b.net || 0) - (a.net || 0))[0];
      const worst = monthRecords.slice().sort((a, b) => (a.net || 0) - (b.net || 0))[0];
      const maxAbs = Math.max(1, ...monthRecords.slice(-7).map(item => Math.abs(item.net || 0)));
      const trend = monthRecords.slice().sort((a, b) => a.dateStr.localeCompare(b.dateStr)).slice(-7);
      return `
        <div class="card stack-16">
          <div class="row">
            <div class="title">${monthLabel(state.monthCursor)}</div>
            <div class="wrap">
              <button class="pill gray" onclick="changeMonth(-1)">上个月</button>
              <button class="pill gray" onclick="changeMonth(1)">下个月</button>
            </div>
          </div>
          <p class="sub">绿 = 净赚，灰 = 持平，红 = 工伤重。点击日期可切回对应战报。</p>
        </div>

        <div class="card-soft stack-16">
          <div class="calendar-grid">
            ${weekdays.map(day => `<div class="weekday">${day}</div>`).join("")}
            ${cells.map(cell => {
              const record = records[cell.dateStr];
              const status = record ? (record.net > 0 ? "pos" : record.net < 0 ? "neg" : "zero") : "";
              const selected = state.reportDate === cell.dateStr ? "selected" : "";
              return `
                <div class="day ${cell.inMonth ? "" : "out"} ${status} ${selected}" onclick="pickReportDate('${cell.dateStr}')">
                  <div class="day-number">${cell.day}</div>
                  <div class="day-net">${record ? `${record.net >= 0 ? "+" : ""}${record.net}` : ""}</div>
                </div>
              `;
            }).join("")}
          </div>
        </div>

        <div class="card-dark stack-20">
          <div class="title">本月小结</div>
          <div class="metric-row">
            <div class="metric-card stack-12">
              <p class="sub">净收入</p>
              <div class="title">${monthNet >= 0 ? "+" : ""}${monthNet}</div>
            </div>
            <div class="metric-card stack-12">
              <p class="sub">记录天数</p>
              <div class="title">${monthDays}</div>
            </div>
          </div>
          <div class="stack-12">
            <p class="sub">最佳生存日：${best ? `${best.dateStr} · ${best.net >= 0 ? "+" : ""}${best.net}` : "—"}</p>
            <p class="sub">最惨一天：${worst ? `${worst.dateStr} · ${worst.net >= 0 ? "+" : ""}${worst.net}` : "—"}</p>
          </div>
        </div>

        <div class="card-soft stack-16">
          <div class="row">
            <div class="title">最近 7 条记录</div>
            <p class="sub">仅展示有记录的日期</p>
          </div>
          <div class="stack-12">
            ${trend.length ? trend.map(item => `
              <div class="trend-row">
                <div>${item.dateStr.slice(5)}</div>
                <div class="bar-wrap"><div class="bar ${item.net >= 0 ? "pos" : "neg"}" style="width:${Math.round((Math.abs(item.net || 0) / maxAbs) * 100)}%"></div></div>
                <div style="text-align:right;">${item.net >= 0 ? "+" : ""}${item.net}</div>
              </div>
            `).join("") : `<div class="empty">还没有记录，先去“今日”随手点几下。</div>`}
          </div>
        </div>
      `;
    }

    function buildReportView() {
      const record = getReportRecord();
      if (!record) {
        return `
          <div class="card stack-16">
            <div class="title">这天还没有记录</div>
            <p class="sub">先去“今日”点几项，系统才有证据可出。</p>
            <button class="btn-primary" onclick="switchTab('today')">去今日试玩</button>
          </div>
        `;
      }
      const extra = randPick([...quotes.light, ...quotes.soft, ...quotes.yin]);
      const reportText = buildReportText(record, extra);
      return `
        <div class="card-dark stack-16">
          <div class="row">
            <div>
              <div class="title">${record.dateStr} 上班战报</div>
              <p class="sub">称号：${record.title}</p>
            </div>
            <span class="pill ${record.net >= 0 ? "positive" : "negative"}">${record.net >= 0 ? "+" : ""}${record.net}</span>
          </div>
          <p class="sub">${record.comment}</p>
        </div>

        <div class="poster">
          <div class="eyebrow">Poster Preview</div>
          <div class="title">${record.dateStr} 上班战报</div>
          <div class="poster-hero">${record.net >= 0 ? "+" : ""}${record.net}</div>
          <p class="sub" style="color:${record.net >= 0 ? "var(--positive)" : "var(--negative)"}">摸鱼 +${record.incomeTotal} · 工伤 -${record.expenseTotal}</p>
          <div class="poster-card stack-16">
            <div class="title">${record.title}</div>
            <div class="muted">${extra}</div>
            <div class="muted">Top回血：${topSingleName(record.selectedIncome)}</div>
            <div class="muted">Top工伤：${topSingleName(record.selectedExpense)}</div>
          </div>
        </div>

        <div class="card-soft stack-16">
          <div class="row">
            <div class="title">文本版战报</div>
            <button class="pill gray" onclick="copyReport()">复制文案</button>
          </div>
          <div class="report-text" id="reportText">${reportText}</div>
        </div>
      `;
    }

    function buildSidePanel() {
      const record = getCurrentRecord();
      const store = loadStore();
      const totalDays = Object.keys(store.records || {}).length;
      return `
        <div class="card stack-16">
          <div class="title">怎么玩</div>
          <ul class="helper-list">
            <li>先在“今日”里切换回血或工伤，点选几个项目</li>
            <li>保存后，记录会留在浏览器本地</li>
            <li>切到“月历”可以看到你刚才那天的颜色状态</li>
            <li>切到“战报”会自动生成一份可复制的文本战报</li>
          </ul>
        </div>

        <div class="card-dark stack-16">
          <div class="title">试玩状态</div>
          <div class="metric-row">
            <div class="metric-card stack-12">
              <p class="sub">当前日期</p>
              <div class="title">${state.dateStr}</div>
            </div>
            <div class="metric-card stack-12">
              <p class="sub">本地记录</p>
              <div class="title">${totalDays}</div>
            </div>
          </div>
          <p class="sub">当前净值：${record.net >= 0 ? "+" : ""}${record.net || 0}</p>
        </div>

        <div class="card-soft stack-16">
          <div class="title">说明</div>
          <p class="sub">这是浏览器试玩版，不依赖微信环境。体验重点是交互流程和视觉风格，而不是 100% 复刻小程序 API。</p>
        </div>
      `;
    }

    function renderTabs() {
      const html = TABS.map(tab => `
        <button class="${state.currentTab === tab.key ? "active" : ""}" onclick="switchTab('${tab.key}')">${tab.label}</button>
      `).join("");
      document.getElementById("tabbar").innerHTML = html;
      document.getElementById("mobileTabs").innerHTML = html;
    }

    function render() {
      renderTabs();
      const main = document.getElementById("mainContent");
      if (state.currentTab === "today") main.innerHTML = buildTodayView();
      if (state.currentTab === "calendar") main.innerHTML = buildCalendarView();
      if (state.currentTab === "report") main.innerHTML = buildReportView();
      document.getElementById("sidePanel").innerHTML = buildSidePanel();
    }

    function switchTab(key) {
      state.currentTab = key;
      render();
    }

    function setMode(mode) {
      state.mode = mode;
      state.category = null;
      ensureCategory();
      render();
    }

    function setCategory(key) {
      state.category = key;
      render();
    }

    function onDateChange(value) {
      state.dateStr = value;
      state.reportDate = value;
      state.feedback = "已切换日期，可以继续试玩这一天。";
      render();
    }

    function goReport() {
      state.reportDate = state.dateStr;
      state.currentTab = "report";
      render();
    }

    function pickReportDate(dateStr) {
      state.reportDate = dateStr;
      state.dateStr = dateStr;
      state.currentTab = "report";
      render();
    }

    function changeMonth(delta) {
      state.monthCursor = new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth() + delta, 1);
      render();
    }

    function copyReport() {
      const text = document.getElementById("reportText")?.innerText || "";
      navigator.clipboard.writeText(text).then(() => {
        alert("战报文案已复制。");
      }).catch(() => {
        alert("当前浏览器不支持自动复制，你可以手动复制。");
      });
    }

    function resetCurrentDate() {
      const store = loadStore();
      delete store.records[state.dateStr];
      saveStore(store);
      state.feedback = "这一天已经清空，可以重新点选试玩。";
      render();
    }

    window.switchTab = switchTab;
    window.setMode = setMode;
    window.setCategory = setCategory;
    window.onDateChange = onDateChange;
    window.toggleItem = toggleItem;
    window.saveTodayRecord = saveTodayRecord;
    window.goReport = goReport;
    window.changeMonth = changeMonth;
    window.pickReportDate = pickReportDate;
    window.copyReport = copyReport;
    window.resetCurrentDate = resetCurrentDate;

    function init() {
      setRandomCopy();
      state.category = incomeCategories[0].key;
      updateRecord(record => {
        record.selectedIncome = record.selectedIncome || {};
        record.selectedExpense = record.selectedExpense || {};
      });
      render();
    }

    init();
  </script>
</body>
</html>
