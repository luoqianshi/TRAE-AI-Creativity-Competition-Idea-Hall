<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>早睡打卡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌙 早睡打卡</h1>
            <p class="subtitle">养成良好作息，拥抱健康生活</p>
        </header>

        <div class="main-content">
            <div class="today-card">
                <div class="date-info">
                    <span class="weekday" id="weekday"></span>
                    <span class="date" id="date"></span>
                </div>
                <div class="bedtime-display">
                    <span class="label">目标睡觉时间</span>
                    <span class="time" id="target-time">23:00</span>
                </div>
                <button class="check-btn" id="check-btn" onclick="checkIn()">
                    ✅ 打卡
                </button>
                <div class="status-message" id="status-message"></div>
            </div>

            <div class="stats-section">
                <h2>📊 打卡统计</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="total-days">0</div>
                        <div class="stat-label">总打卡天数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="current-streak">0</div>
                        <div class="stat-label">当前连续</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="max-streak">0</div>
                        <div class="stat-label">最长连续</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="completion-rate">0%</div>
                        <div class="stat-label">完成率</div>
                    </div>
                </div>
            </div>

            <div class="calendar-section">
                <h2>📅 打卡日历</h2>
                <div class="calendar-header">
                    <button class="nav-btn" onclick="prevMonth()">◀</button>
                    <span class="month-year" id="month-year"></span>
                    <button class="nav-btn" onclick="nextMonth()">▶</button>
                </div>
                <div class="calendar-grid" id="calendar-grid"></div>
            </div>

            <div class="settings-section">
                <h2>⚙️ 设置</h2>
                <div class="setting-item">
                    <label>目标睡觉时间:</label>
                    <input type="time" id="target-time-input" value="23:00">
                    <button onclick="saveTargetTime()">保存</button>
                </div>
            </div>
        </div>

        <footer>
            <p>🌃 早睡早起，身体好！</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
