<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一人食 · AI 做饭助手</title>
<style>
  :root {
    --color-primary: #FF8C42;
    --color-primary-dark: #F57C00;
    --color-primary-light: #FFCC80;
    --color-primary-bg: #FFF3E0;
    --color-secondary: #7CB342;
    --color-secondary-dark: #558B2F;
    --color-secondary-light: #C5E1A5;
    --color-secondary-bg: #F1F8E9;
    --color-warning: #E57373;
    --color-warning-dark: #D32F2F;
    --color-warning-bg: #FFEBEE;
    --color-bg: #FFF8F0;
    --color-card: #FFFFFF;
    --color-text: #2D2D2D;
    --color-text-secondary: #888888;
    --color-text-light: #BBBBBB;
    --color-border: #F0E6D6;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow-card: 0 2px 12px rgba(255, 140, 66, 0.08);
    --shadow-card-hover: 0 8px 24px rgba(255, 140, 66, 0.15);
    --shadow-button: 0 4px 12px rgba(255, 140, 66, 0.3);
    --phone-width: 390px;
    --phone-height: 844px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #FFE0B2 0%, #FFF8E1 50%, #C8E6C9 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--color-text);
  }

  .phone-frame {
    width: var(--phone-width);
    height: var(--phone-height);
    background: #1a1a1a;
    border-radius: 48px;
    padding: 12px;
    box-shadow:
      0 30px 60px rgba(0, 0, 0, 0.3),
      0 10px 20px rgba(0, 0, 0, 0.2),
      inset 0 0 0 2px #333;
    position: relative;
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    background: var(--color-bg);
    border-radius: 38px;
    overflow: hidden;
    position: relative;
  }

  .phone-notch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 28px;
    background: #1a1a1a;
    border-radius: 0 0 18px 18px;
    z-index: 100;
  }

  .status-bar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px 0 28px;
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text);
  }

  .status-bar .time {
    font-variant-numeric: tabular-nums;
  }

  .status-bar .icons {
    display: flex;
    gap: 5px;
    align-items: center;
    font-size: 12px;
  }

  .app-content {
    height: calc(var(--phone-height) - 24px - 44px);
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    scrollbar-width: none;
  }

  .app-content::-webkit-scrollbar {
    display: none;
  }

  .page {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    min-height: 100%;
    padding: 8px 24px 100px;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0;
    transform: translateX(30px);
    pointer-events: none;
  }

  .page.active {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
    position: relative;
  }

  .page.exit-left {
    opacity: 0;
    transform: translateX(-30px);
  }

  .greeting {
    padding: 16px 0 24px;
  }

  .greeting .hello {
    font-size: 28px;
    font-weight: 700;
    color: var(--color-primary-dark);
    line-height: 1.3;
    margin-bottom: 4px;
  }

  .greeting .sub {
    font-size: 13px;
    color: var(--color-text-secondary);
    font-style: italic;
    letter-spacing: 0.5px;
  }

  .stats-bar {
    background: var(--color-secondary-bg);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-card);
    margin-bottom: 20px;
  }

  .stats-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: default;
  }

  .stats-emoji {
    font-size: 14px;
  }

  .stats-num {
    font-size: 18px;
    font-weight: 700;
    color: var(--color-secondary-dark);
    line-height: 1;
    transition: color 0.2s ease;
  }

  .stats-num.pulse {
    animation: statsPulse 0.6s ease;
  }

  @keyframes statsPulse {
    0% { transform: scale(1); color: var(--color-secondary-dark); }
    30% { transform: scale(1.4); color: var(--color-primary); }
    60% { transform: scale(0.95); color: var(--color-primary-dark); }
    100% { transform: scale(1); color: var(--color-secondary-dark); }
  }

  .stats-label {
    font-size: 10px;
    color: var(--color-text-secondary);
    white-space: nowrap;
  }

  .stats-divider {
    width: 1px;
    height: 32px;
    background: rgba(124, 179, 66, 0.2);
    flex-shrink: 0;
  }

  .input-section {
    margin-bottom: 24px;
  }

  .input-label {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--color-text);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .input-wrapper {
    position: relative;
    background: var(--color-card);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    display: flex;
    align-items: center;
    padding: 0 4px 0 16px;
    border: 2px solid transparent;
    transition: all 0.25s ease;
  }

  .input-wrapper:focus-within {
    border-color: var(--color-primary-light);
    box-shadow: 0 0 0 4px rgba(255, 140, 66, 0.1);
  }

  .input-icon {
    font-size: 20px;
    margin-right: 10px;
    flex-shrink: 0;
  }

  .ingredient-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 15px;
    padding: 16px 0;
    color: var(--color-text);
    font-family: inherit;
  }

  .ingredient-input::placeholder {
    color: var(--color-text-light);
  }

  .input-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: none;
    background: var(--color-primary-bg);
    color: var(--color-primary-dark);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .icon-btn:hover {
    background: var(--color-primary-light);
    transform: scale(1.05);
  }

  .icon-btn:active {
    transform: scale(0.95);
  }

  .recent-section {
    margin-bottom: 28px;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--color-text);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .section-title .badge {
    background: var(--color-warning-bg);
    color: var(--color-warning-dark);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
  }

  .chips-container {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: var(--color-card);
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-card);
    border: 2px solid transparent;
    user-select: none;
    position: relative;
  }

  .chip:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-card-hover);
  }

  .chip:active {
    transform: scale(0.97);
  }

  .chip.selected {
    background: var(--color-primary-bg);
    border-color: var(--color-primary);
    color: var(--color-primary-dark);
  }

  .chip.expiring {
    border-color: var(--color-warning);
    background: var(--color-warning-bg);
  }

  .chip.expiring.selected {
    background: var(--color-warning);
    color: white;
    border-color: var(--color-warning-dark);
  }

  .chip.struck {
    opacity: 0.4;
  }

  .chip.struck .chip-text {
    text-decoration: line-through;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--color-text-secondary);
    animation: strikeThrough 0.6s ease forwards;
  }

  @keyframes strikeThrough {
    from { text-decoration-color: transparent; }
    to { text-decoration-color: var(--color-text-secondary); }
  }

  .chip .chip-emoji {
    font-size: 16px;
  }

  .chip .chip-text {
    font-weight: 500;
  }

  .chip .chip-en {
    font-size: 10px;
    opacity: 0.6;
    font-style: italic;
  }

  .chip .expiring-dot {
    width: 6px;
    height: 6px;
    background: var(--color-warning-dark);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  .safety-note {
    margin-top: 12px;
    font-size: 11px;
    color: var(--color-text-light);
    display: flex;
    align-items: center;
    gap: 4px;
    padding-left: 4px;
  }

  .primary-btn {
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: var(--radius-lg);
    background: linear-gradient(135deg, #FF8C42 0%, #FF7043 100%);
    color: white;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-button);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
  }

  .primary-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 140, 66, 0.4);
  }

  .primary-btn:active {
    transform: scale(0.97);
  }

  .primary-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .primary-btn.green {
    background: linear-gradient(135deg, #7CB342 0%, #689F38 100%);
    box-shadow: 0 4px 12px rgba(124, 179, 66, 0.3);
  }

  .primary-btn.green:hover {
    box-shadow: 0 6px 20px rgba(124, 179, 66, 0.4);
  }

  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px 24px 28px;
    background: linear-gradient(to top, var(--color-bg) 70%, transparent);
    z-index: 10;
  }

  .loading-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 400px;
    text-align: center;
  }

  .cooking-animation {
    font-size: 64px;
    margin-bottom: 24px;
    animation: bounce 1.2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-15px) rotate(-5deg); }
    75% { transform: translateY(-15px) rotate(5deg); }
  }

  .loading-text {
    font-size: 18px;
    font-weight: 600;
    color: var(--color-primary-dark);
    margin-bottom: 8px;
  }

  .loading-sub {
    font-size: 13px;
    color: var(--color-text-secondary);
  }

  .results-header {
    padding: 8px 0 20px;
  }

  .results-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--color-text);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .results-title .emoji {
    animation: wiggle 0.6s ease;
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-15deg); }
    75% { transform: rotate(15deg); }
  }

  .results-sub {
    font-size: 13px;
    color: var(--color-text-secondary);
  }

  .recipe-cards {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .recipe-card {
    background: var(--color-card);
    border-radius: var(--radius-lg);
    padding: 18px;
    box-shadow: var(--shadow-card);
    cursor: pointer;
    transition: all 0.3s ease;
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
  }

  .recipe-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .recipe-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-card-hover);
  }

  .recipe-card:hover::before {
    opacity: 1;
  }

  .recipe-card:active {
    transform: scale(0.98);
  }

  .recipe-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .recipe-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--color-text);
    margin-bottom: 2px;
  }

  .recipe-name-en {
    font-size: 11px;
    color: var(--color-text-secondary);
    font-style: italic;
  }

  .recipe-emoji {
    font-size: 36px;
  }

  .recipe-tagline {
    font-size: 13px;
    color: var(--color-primary-dark);
    background: var(--color-primary-bg);
    padding: 6px 10px;
    border-radius: 8px;
    margin-bottom: 14px;
    line-height: 1.4;
  }

  .recipe-meta {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
  }

  .meta-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--color-text-secondary);
    background: #F5F5F5;
    padding: 4px 10px;
    border-radius: 12px;
  }

  .meta-item.difficulty {
    letter-spacing: 2px;
  }

  .meta-item.difficulty .star-on {
    color: var(--color-primary);
  }

  .meta-item.difficulty .star-off {
    color: var(--color-text-light);
  }

  .ingredients-row {
    margin-bottom: 6px;
  }

  .ingredients-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--color-text-secondary);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .ingredients-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .ing-tag {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 10px;
    background: #F5F5F5;
    color: var(--color-text-secondary);
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .ing-tag.used {
    background: var(--color-secondary-bg);
    color: var(--color-secondary-dark);
  }

  .ing-tag.expiring {
    background: var(--color-warning-bg);
    color: var(--color-warning-dark);
    font-weight: 600;
  }

  .ing-tag.missing {
    background: #F5F5F5;
    color: var(--color-text-secondary);
    border: 1px dashed var(--color-text-light);
  }

  .back-btn {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: none;
    background: var(--color-card);
    color: var(--color-text);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-card);
    transition: all 0.2s ease;
    margin-bottom: 16px;
  }

  .back-btn:hover {
    transform: translateX(-2px);
  }

  .back-btn:active {
    transform: scale(0.95);
  }

  .recipe-detail-header {
    text-align: center;
    padding: 8px 0 20px;
  }

  .recipe-detail-emoji {
    font-size: 72px;
    margin-bottom: 12px;
    display: block;
  }

  .recipe-detail-name {
    font-size: 24px;
    font-weight: 700;
    color: var(--color-text);
    margin-bottom: 4px;
  }

  .recipe-detail-name-en {
    font-size: 13px;
    color: var(--color-text-secondary);
    font-style: italic;
  }

  .anti-waste-banner {
    background: linear-gradient(135deg, #FFF3E0 0%, #FFE0B2 100%);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-bottom: 24px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    border-left: 4px solid var(--color-primary);
  }

  .anti-waste-banner .banner-emoji {
    font-size: 24px;
    flex-shrink: 0;
  }

  .anti-waste-banner .banner-text {
    font-size: 14px;
    color: var(--color-primary-dark);
    line-height: 1.5;
    font-weight: 500;
  }

  .steps-section {
    margin-bottom: 24px;
  }

  .steps-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .steps-list {
    position: relative;
    padding-left: 36px;
  }

  .steps-list::before {
    content: '';
    position: absolute;
    left: 14px;
    top: 12px;
    bottom: 12px;
    width: 2px;
    background: linear-gradient(to bottom, var(--color-primary-light), var(--color-secondary-light));
    border-radius: 2px;
  }

  .step-item {
    position: relative;
    margin-bottom: 20px;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeInUp 0.4s ease forwards;
  }

  .step-item:nth-child(1) { animation-delay: 0.1s; }
  .step-item:nth-child(2) { animation-delay: 0.2s; }
  .step-item:nth-child(3) { animation-delay: 0.3s; }
  .step-item:nth-child(4) { animation-delay: 0.4s; }

  @keyframes fadeInUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .step-item:last-child {
    margin-bottom: 0;
  }

  .step-number {
    position: absolute;
    left: -36px;
    top: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--color-primary), #FF7043);
    color: white;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(255, 140, 66, 0.3);
  }

  .step-text {
    font-size: 14px;
    line-height: 1.7;
    color: var(--color-text);
    padding-top: 4px;
  }

  .serving-info {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--color-text-secondary);
    background: var(--color-card);
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    margin-bottom: 20px;
    box-shadow: var(--shadow-card);
  }

  .toast {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: linear-gradient(135deg, #7CB342 0%, #689F38 100%);
    color: white;
    padding: 14px 20px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 8px 24px rgba(124, 179, 66, 0.4);
    z-index: 200;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .page-bottom-space {
    height: 80px;
  }

  .card-reveal {
    opacity: 0;
    transform: translateY(20px);
    animation: cardReveal 0.5s ease forwards;
  }

  .card-reveal:nth-child(1) { animation-delay: 0.1s; }
  .card-reveal:nth-child(2) { animation-delay: 0.25s; }
  .card-reveal:nth-child(3) { animation-delay: 0.4s; }

  @keyframes cardReveal {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: var(--color-text);
    border-radius: 3px;
    opacity: 0.3;
  }

  .confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 300;
  }

  @keyframes confettiFall {
    0% {
      transform: translateY(-20px) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(400px) rotate(720deg);
      opacity: 0;
    }
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-screen">
      <div class="phone-notch"></div>

      <div class="status-bar">
        <span class="time">9:41</span>
        <span class="icons">
          <span>📶</span>
          <span>🔋</span>
        </span>
      </div>

      <div class="app-content" id="appContent">

        <div id="toast" class="toast">
          <span>🎉</span>
          <span>又省下一顿，今年你已经少扔了 12 样食材</span>
        </div>

        <div class="page active" id="page-input">
          <div class="greeting">
            <div class="hello">今晚吃点啥？🍳</div>
            <div class="sub">What's for dinner tonight?</div>
          </div>

          <div class="stats-bar">
            <div class="stats-item">
              <span class="stats-emoji">🍃</span>
              <span class="stats-num" id="statsSaved">12</span>
              <span class="stats-label">本月少扔</span>
            </div>
            <div class="stats-divider"></div>
            <div class="stats-item">
              <span class="stats-emoji">💰</span>
              <span class="stats-num" id="statsSavedMoney">¥180</span>
              <span class="stats-label">省下约</span>
            </div>
            <div class="stats-divider"></div>
            <div class="stats-item">
              <span class="stats-emoji">🔥</span>
              <span class="stats-num" id="statsStreak">5</span>
              <span class="stats-label">连续天</span>
            </div>
          </div>

          <div class="input-section">
            <div class="input-label">
              <span>🧺</span>
              <span>冰箱里有啥</span>
            </div>
            <div class="input-wrapper">
              <span class="input-icon">🥗</span>
              <input
                type="text"
                class="ingredient-input"
                id="ingredientInput"
                placeholder="鸡蛋、西兰花、剩米饭..."
                value="鸡蛋、西兰花、剩米饭"
              >
              <div class="input-actions">
                <button class="icon-btn" onclick="showToast('语音输入功能敬请期待 🎤')">
                  🎤
                </button>
                <button class="icon-btn" onclick="showToast('拍照识别功能敬请期待 📷')">
                  📷
                </button>
              </div>
            </div>
          </div>

          <div class="recent-section">
            <div class="section-header">
              <div class="section-title">
                <span>🕒</span>
                <span>最近用过</span>
                <span class="badge">2 样快坏了</span>
              </div>
            </div>
            <div class="chips-container" id="ingredientsChips">
            </div>
            <div class="safety-note">
              <span>💡</span>
              <span>用前先闻一下，不对劲就别用哦</span>
            </div>
          </div>

          <div class="page-bottom-space"></div>
        </div>

        <div class="bottom-bar" id="inputBottomBar">
          <button class="primary-btn" id="primaryBtn" onclick="showRecipes()">
            <span>✨</span>
            <span>看看能做啥</span>
          </button>
        </div>

        <div class="page" id="page-loading">
          <div class="loading-page">
            <div class="cooking-animation">🍳</div>
            <div class="loading-text">AI 大厨正在想点子...</div>
            <div class="loading-sub">Finding the perfect recipe for you</div>
          </div>
        </div>

        <div class="page" id="page-results">
          <button class="back-btn" onclick="goBack('input')">←</button>

          <div class="results-header">
            <div class="results-title">
              <span class="emoji">🎉</span>
              <span>为你找到 3 道菜</span>
            </div>
            <div class="results-sub">都是一人份，刚好能用完你的食材</div>
          </div>

          <div class="recipe-cards" id="recipeCards">
          </div>

          <div class="page-bottom-space"></div>
        </div>

        <div class="page" id="page-recipe">
          <button class="back-btn" onclick="goBack('results')">←</button>

          <div class="recipe-detail-header">
            <span class="recipe-detail-emoji" id="detailEmoji">🍚</span>
            <div class="recipe-detail-name" id="detailName">西兰花鸡蛋炒饭</div>
            <div class="recipe-detail-name-en" id="detailNameEn">Broccoli Egg Fried Rice</div>
          </div>

          <div class="anti-waste-banner">
            <span class="banner-emoji">🥦</span>
            <div class="banner-text" id="antiWasteText">
              这道用掉了你的西兰花和剩米饭，再放两天就坏了
            </div>
          </div>

          <div class="serving-info">
            <span>🍽️</span>
            <span>份量：<strong>1 人份</strong></span>
          </div>

          <div class="steps-section">
            <div class="steps-title">
              <span>📝</span>
              <span>做法步骤</span>
            </div>
            <div class="steps-list" id="stepsList">
            </div>
          </div>

          <div class="page-bottom-space"></div>
        </div>

        <div class="bottom-bar" id="recipeBottomBar" style="display: none;">
          <button class="primary-btn green" onclick="markDone()">
            <span>✅</span>
            <span>我做了 / 用掉了</span>
          </button>
        </div>

        <div class="home-indicator"></div>
      </div>
    </div>
  </div>

<script>
  const ingredients = [
    { id: 'egg', name: '鸡蛋', nameEn: 'Egg', emoji: '🥚', isExpiring: false, selected: true },
    { id: 'broccoli', name: '西兰花', nameEn: 'Broccoli', emoji: '🥦', isExpiring: true, selected: true },
    { id: 'leftover-rice', name: '剩米饭', nameEn: 'Leftover rice', emoji: '🍚', isExpiring: true, selected: true },
    { id: 'tofu', name: '老豆腐', nameEn: 'Firm tofu', emoji: '🧈', isExpiring: false, selected: false },
    { id: 'scallion', name: '葱', nameEn: 'Scallion', emoji: '🧅', isExpiring: false, selected: false },
    { id: 'soy-sauce', name: '生抽', nameEn: 'Soy sauce', emoji: '🫗', isExpiring: false, selected: false }
  ];

  const recipes = [
    {
      id: 'broccoli-egg-fried-rice',
      name: '西兰花鸡蛋炒饭',
      nameEn: 'Broccoli Egg Fried Rice',
      emoji: '🍚',
      tagline: '把两样快坏的一锅端，零浪费。',
      usedIngredients: ['leftover-rice', 'egg', 'broccoli', 'scallion', 'soy-sauce'],
      missingIngredients: [],
      time: 12,
      difficulty: 1,
      antiWasteText: '这道用掉了你的西兰花和剩米饭，再放两天就坏了 🥦',
      steps: [
        '西兰花切小朵，焯水 1 分钟捞出。',
        '鸡蛋 1 个打散，热油炒散盛出。',
        '下剩米饭（约 1 碗）炒散，加西兰花和鸡蛋。',
        '沿锅边淋生抽 1 勺，撒葱花，翻炒均匀即可。'
      ],
      serving: '1 人份'
    },
    {
      id: 'broccoli-egg-stirfry',
      name: '西兰花炒蛋',
      nameEn: 'Stir-fried Broccoli with Egg',
      emoji: '🥦',
      tagline: '最快，专治"懒得想"。',
      usedIngredients: ['broccoli', 'egg', 'soy-sauce'],
      missingIngredients: [{ name: '蒜', nameEn: 'Garlic', note: '可省略' }],
      time: 8,
      difficulty: 1,
      antiWasteText: '这道用掉了你的西兰花，再放两天就坏了 🥦',
      steps: [
        '西兰花切小朵，焯水 1 分钟捞出沥干。',
        '鸡蛋 2 个打散加少许盐，热油炒散盛出。',
        '锅中补一点油，下西兰花翻炒 30 秒。',
        '倒回鸡蛋，加生抽 1 勺，翻匀即可出锅。'
      ],
      serving: '1 人份'
    },
    {
      id: 'tofu-veggie-soup',
      name: '豆腐蔬菜羹',
      nameEn: 'Tofu & Veggie Soup',
      emoji: '🍲',
      tagline: '清淡暖胃，一个人喝正好。',
      usedIngredients: ['tofu', 'broccoli', 'scallion'],
      missingIngredients: [{ name: '高汤', nameEn: 'Broth', note: '可用清水+生抽替代' }],
      time: 15,
      difficulty: 2,
      antiWasteText: '这道用掉了你的西兰花，再放两天就坏了 🥦',
      steps: [
        '老豆腐切小块，西兰花切小朵，葱切葱花。',
        '锅中倒入高汤（或清水+1勺生抽）煮开。',
        '下豆腐煮 3 分钟，再加西兰花煮 2 分钟。',
        '撒葱花，淋几滴香油，出锅即可。'
      ],
      serving: '1 人份'
    }
  ];

  let currentState = 'input';
  let currentRecipeId = null;

  function getIngredientById(id) {
    return ingredients.find(i => i.id === id);
  }

  function renderIngredients() {
    const container = document.getElementById('ingredientsChips');
    container.innerHTML = ingredients.map(ing => `
      <div class="chip ${ing.isExpiring ? 'expiring' : ''} ${ing.selected ? 'selected' : ''} ${ing.used ? 'struck' : ''}"
           data-id="${ing.id}"
           onclick="toggleIngredient('${ing.id}')">
        <span class="chip-emoji">${ing.emoji}</span>
        <span class="chip-text">${ing.name}</span>
        <span class="chip-en">${ing.nameEn}</span>
        ${ing.isExpiring ? '<span class="expiring-dot"></span>' : ''}
      </div>
    `).join('');
  }

  function toggleIngredient(id) {
    const ing = getIngredientById(id);
    if (ing && !ing.used) {
      ing.selected = !ing.selected;
      renderIngredients();
      updateInputFromSelection();
    }
  }

  function updateInputFromSelection() {
    const selected = ingredients.filter(i => i.selected && !i.used);
    const input = document.getElementById('ingredientInput');
    if (selected.length > 0) {
      input.value = selected.map(i => i.name).join('、');
    } else {
      input.value = '';
    }
    updatePrimaryButtonState();
  }

  function updatePrimaryButtonState() {
    const btn = document.getElementById('primaryBtn');
    const hasSelection = ingredients.some(i => i.selected && !i.used);
    btn.disabled = !hasSelection;
  }

  function renderRecipeCards() {
    const container = document.getElementById('recipeCards');
    container.innerHTML = recipes.map((recipe, idx) => {
      const usedTags = recipe.usedIngredients.map(id => {
        const ing = getIngredientById(id);
        if (!ing) return '';
        const cls = ing.isExpiring ? 'expiring' : 'used';
        const prefix = ing.isExpiring ? '🔴 ' : '';
        return `<span class="ing-tag ${cls}">${prefix}${ing.emoji} ${ing.name}</span>`;
      }).join('');

      const missingTags = recipe.missingIngredients.map(m =>
        `<span class="ing-tag missing">➕ ${m.name} ${m.note ? '(' + m.note + ')' : ''}</span>`
      ).join('');

      const stars = '★'.repeat(recipe.difficulty) + '☆'.repeat(3 - recipe.difficulty);
      const starsHtml = stars.split('').map(s =>
        `<span class="${s === '★' ? 'star-on' : 'star-off'}">${s}</span>`
      ).join('');

      return `
        <div class="recipe-card card-reveal" onclick="showRecipeDetail('${recipe.id}')">
          <div class="recipe-card-header">
            <div>
              <div class="recipe-name">${recipe.name}</div>
              <div class="recipe-name-en">${recipe.nameEn}</div>
            </div>
            <span class="recipe-emoji">${recipe.emoji}</span>
          </div>
          <div class="recipe-tagline">💡 ${recipe.tagline}</div>
          <div class="recipe-meta">
            <span class="meta-item">
              <span>⏱</span>
              <span>${recipe.time} 分钟</span>
            </span>
            <span class="meta-item difficulty">
              <span>难度</span>
              <span>${starsHtml}</span>
            </span>
          </div>
          <div class="ingredients-row">
            <div class="ingredients-label">用到你的食材</div>
            <div class="ingredients-tags">${usedTags}</div>
          </div>
          ${recipe.missingIngredients.length > 0 ? `
            <div class="ingredients-row" style="margin-top: 8px;">
              <div class="ingredients-label">还差一点点</div>
              <div class="ingredients-tags">${missingTags}</div>
            </div>
          ` : `
            <div class="ingredients-row" style="margin-top: 8px;">
              <div class="ingredients-tags">
                <span class="ing-tag used">✅ 手头齐了，啥都不用买</span>
              </div>
            </div>
          `}
        </div>
      `;
    }).join('');
  }

  function setState(state) {
    const pages = ['input', 'loading', 'results', 'recipe'];
    pages.forEach(p => {
      const el = document.getElementById('page-' + p);
      if (p === state) {
        el.classList.add('active');
        el.classList.remove('exit-left');
      } else if (p === currentState) {
        el.classList.add('exit-left');
        setTimeout(() => el.classList.remove('active', 'exit-left'), 350);
      } else {
        el.classList.remove('active', 'exit-left');
      }
    });

    const inputBottomBar = document.getElementById('inputBottomBar');
    const recipeBottomBar = document.getElementById('recipeBottomBar');
    if (state === 'input') {
      inputBottomBar.style.display = 'block';
    } else {
      inputBottomBar.style.display = 'none';
    }
    if (state === 'recipe') {
      recipeBottomBar.style.display = 'block';
    } else {
      recipeBottomBar.style.display = 'none';
    }

    currentState = state;

    const appContent = document.getElementById('appContent');
    appContent.scrollTop = 0;
  }

  function showRecipes() {
    setState('loading');
    setTimeout(() => {
      renderRecipeCards();
      setState('results');
    }, 1500);
  }

  function showRecipeDetail(id) {
    currentRecipeId = id;
    const recipe = recipes.find(r => r.id === id);
    if (!recipe) return;

    document.getElementById('detailEmoji').textContent = recipe.emoji;
    document.getElementById('detailName').textContent = recipe.name;
    document.getElementById('detailNameEn').textContent = recipe.nameEn;
    document.getElementById('antiWasteText').textContent = recipe.antiWasteText;

    const stepsList = document.getElementById('stepsList');
    stepsList.innerHTML = recipe.steps.map((step, i) => `
      <div class="step-item">
        <div class="step-number">${i + 1}</div>
        <div class="step-text">${step}</div>
      </div>
    `).join('');

    setState('recipe');
  }

  function goBack(target) {
    setState(target);
  }

  function markDone() {
    const recipe = recipes.find(r => r.id === currentRecipeId);
    if (!recipe) return;

    launchConfetti();

    showToast('又省下一顿，今年你已经少扔了 12 样食材', '🎉');

    setTimeout(() => {
      recipe.usedIngredients.forEach(id => {
        const ing = getIngredientById(id);
        if (ing) {
          ing.used = true;
          ing.selected = false;
        }
      });
      renderIngredients();
      updateInputFromSelection();

      const savedEl = document.getElementById('statsSaved');
      savedEl.textContent = parseInt(savedEl.textContent) + 1;
      savedEl.classList.remove('pulse');
      void savedEl.offsetWidth;
      savedEl.classList.add('pulse');

      setState('input');
    }, 1200);
  }

  function showToast(text, emoji) {
    const toast = document.getElementById('toast');
    const emojiHtml = emoji ? `<span>${emoji}</span>` : '';
    toast.innerHTML = `${emojiHtml}<span>${text}</span>`;
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 3000);
  }

  function launchConfetti() {
    const screen = document.querySelector('.phone-screen');
    const colors = ['#FF8C42', '#7CB342', '#E57373', '#FFD54F', '#4FC3F7'];
    for (let i = 0; i < 30; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = (50 + (Math.random() - 0.5) * 80) + '%';
      confetti.style.top = '60px';
      confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.animation = `confettiFall ${1.5 + Math.random()}s ease forwards`;
      confetti.style.animationDelay = Math.random() * 0.3 + 's';
      screen.appendChild(confetti);
      setTimeout(() => confetti.remove(), 2500);
    }
  }

  renderIngredients();
  updatePrimaryButtonState();
</script>
</body>
</html>
