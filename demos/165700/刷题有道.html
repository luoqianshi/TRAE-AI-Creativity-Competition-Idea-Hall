<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷题有道 - 刷题工具</title>
    <style>
        :root {
            --color-primary: #1e3a5f;
            --color-primary-light: #2d4a6f;
            --color-primary-dark: #152a45;
            --color-success: #10b981;
            --color-success-light: #d1fae5;
            --color-error: #ef4444;
            --color-error-light: #fee2e2;
            --color-warning: #f59e0b;
            --color-warning-light: #fef3c7;
            --color-info: #3b82f6;
            --color-info-light: #dbeafe;
            --color-bg: #f8fafc;
            --color-bg-secondary: #f1f5f9;
            --color-bg-card: #ffffff;
            --color-text: #1e293b;
            --color-text-secondary: #64748b;
            --color-text-muted: #94a3b8;
            --color-border: #e2e8f0;
            --color-border-light: #f1f5f9;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-full: 9999px;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
            --transition-slow: 0.35s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-family);
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #app { min-height: 100vh; display: flex; flex-direction: column; }
        .app-header {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
            color: white;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            transition: transform var(--transition-fast);
        }
        .logo:hover { transform: scale(1.02); }
        .logo-icon { font-size: 28px; }
        .logo-text { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
        .nav-links { display: flex; gap: 4px; }
        .nav-links a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            transition: all var(--transition-fast);
        }
        .nav-links a:hover { color: white; background: rgba(255, 255, 255, 0.1); }
        .nav-links a.active { color: white; background: rgba(255, 255, 255, 0.2); }
        .main-content {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
            width: 100%;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .page-header { margin-bottom: 24px; }
        .page-title { font-size: 28px; font-weight: 700; color: var(--color-text); margin-bottom: 8px; }
        .page-subtitle { color: var(--color-text-secondary); font-size: 15px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-border-light);
            transition: all var(--transition-normal);
        }
        .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .stat-card.primary {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
            color: white;
            border: none;
        }
        .stat-card.success {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
            border: none;
        }
        .stat-card.warning {
            background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
            color: white;
            border: none;
        }
        .stat-card.info {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            color: white;
            border: none;
        }
        .stat-label { font-size: 14px; opacity: 0.9; margin-bottom: 8px; }
        .stat-value { font-size: 32px; font-weight: 700; }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .section-title { font-size: 20px; font-weight: 600; color: var(--color-text); }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-decoration: none;
            user-select: none;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--color-primary); color: white; }
        .btn-primary:hover { background: var(--color-primary-light); box-shadow: var(--shadow-md); }
        .btn-success { background: var(--color-success); color: white; }
        .btn-success:hover { background: #059669; box-shadow: var(--shadow-md); }
        .btn-error { background: var(--color-error); color: white; }
        .btn-error:hover { background: #dc2626; box-shadow: var(--shadow-md); }
        .btn-secondary { background: var(--color-bg-secondary); color: var(--color-text); border: 1px solid var(--color-border); }
        .btn-secondary:hover { background: var(--color-border-light); }
        .btn-outline { background: transparent; color: var(--color-primary); border: 1px solid var(--color-primary); }
        .btn-outline:hover { background: var(--color-primary); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .btn-lg { padding: 14px 28px; font-size: 16px; }
        .btn-block { width: 100%; }
        .btn[disabled] { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        .bank-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .bank-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-border-light);
            transition: all var(--transition-normal);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .bank-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
            border-color: var(--color-primary);
        }
        .bank-card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .bank-icon { font-size: 36px; }
        .bank-menu-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            color: var(--color-text-muted);
            transition: all var(--transition-fast);
        }
        .bank-menu-btn:hover { background: var(--color-bg-secondary); color: var(--color-text); }
        .bank-name { font-size: 18px; font-weight: 600; color: var(--color-text); margin-bottom: 4px; }
        .bank-desc {
            font-size: 14px;
            color: var(--color-text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .bank-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--color-text-muted);
            padding-top: 12px;
            border-top: 1px solid var(--color-border-light);
        }
        .bank-meta-item { display: flex; align-items: center; gap: 4px; }
        .bank-actions { display: flex; gap: 8px; margin-top: 4px; }
        .bank-actions .btn { flex: 1; }
        .search-bar { display: flex; gap: 12px; margin-bottom: 24px; }
        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: 14px;
            outline: none;
            transition: all var(--transition-fast);
        }
        .search-input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--color-text-muted); }
        .empty-state-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-state-title { font-size: 18px; font-weight: 600; color: var(--color-text-secondary); margin-bottom: 8px; }
        .empty-state-desc { font-size: 14px; margin-bottom: 20px; }
        .import-container {
            background: white;
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-border-light);
        }
        .upload-area {
            border: 2px dashed var(--color-border);
            border-radius: var(--radius-lg);
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-fast);
            margin-bottom: 24px;
        }
        .upload-area:hover, .upload-area.drag-over { border-color: var(--color-primary); background: var(--color-info-light); }
        .upload-icon { font-size: 48px; margin-bottom: 16px; }
        .upload-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .upload-desc { color: var(--color-text-secondary); font-size: 14px; margin-bottom: 16px; }
        .upload-formats { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .format-tag { background: var(--color-bg-secondary); padding: 4px 12px; border-radius: var(--radius-full); font-size: 12px; color: var(--color-text-secondary); }
        .text-input-section { margin-bottom: 24px; }
        .section-label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: var(--color-text); }
        .textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px 16px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: inherit;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: all var(--transition-fast);
        }
        .textarea:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1); }
        .preview-section { margin-top: 24px; }
        .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .preview-stats { display: flex; gap: 16px; font-size: 14px; }
        .preview-stat { padding: 4px 12px; background: var(--color-bg-secondary); border-radius: var(--radius-full); color: var(--color-text-secondary); }
        .question-preview-list { max-height: 500px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: var(--radius-md); }
        .question-preview-item { padding: 16px; border-bottom: 1px solid var(--color-border-light); transition: background var(--transition-fast); }
        .question-preview-item:last-child { border-bottom: none; }
        .question-preview-item:hover { background: var(--color-bg-secondary); }
        .preview-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .preview-question-number { font-weight: 600; color: var(--color-primary); }
        .preview-question-type { font-size: 12px; padding: 2px 8px; background: var(--color-info-light); color: var(--color-info); border-radius: var(--radius-full); }
        .preview-question-text { font-size: 14px; color: var(--color-text); margin-bottom: 8px; line-height: 1.5; }
        .preview-options { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 8px; }
        .preview-option { margin-bottom: 4px; }
        .preview-answer { font-size: 13px; color: var(--color-success); font-weight: 500; }
        .import-actions { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: var(--color-text); }
        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: 14px;
            outline: none;
            transition: all var(--transition-fast);
        }
        .form-input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1); }
        .form-select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: 14px;
            background: white;
            outline: none;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .form-select:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1); }
        .question-container { max-width: 800px; margin: 0 auto; }
        .progress-bar { background: var(--color-bg-secondary); border-radius: var(--radius-full); height: 8px; margin-bottom: 24px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--color-primary), var(--color-info)); border-radius: var(--radius-full); transition: width var(--transition-normal); }
        .question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .question-number { font-size: 14px; color: var(--color-text-secondary); font-weight: 500; }
        .question-type-badge { padding: 4px 12px; background: var(--color-info-light); color: var(--color-info); border-radius: var(--radius-full); font-size: 12px; font-weight: 500; }
        .question-card { background: white; border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-md); margin-bottom: 24px; }
        .question-text { font-size: 18px; line-height: 1.8; color: var(--color-text); margin-bottom: 24px; font-weight: 500; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px 20px;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            user-select: none;
        }
        .option-item:hover { border-color: var(--color-primary); background: var(--color-bg-secondary); }
        .option-item.selected { border-color: var(--color-primary); background: var(--color-info-light); }
        .option-item.correct { border-color: var(--color-success); background: var(--color-success-light); }
        .option-item.wrong { border-color: var(--color-error); background: var(--color-error-light); animation: shake 0.4s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .option-letter { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--color-bg-secondary); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; color: var(--color-text-secondary); }
        .option-item.selected .option-letter { background: var(--color-primary); color: white; }
        .option-item.correct .option-letter { background: var(--color-success); color: white; }
        .option-item.wrong .option-letter { background: var(--color-error); color: white; }
        .option-text { flex: 1; font-size: 15px; line-height: 1.6; padding-top: 2px; }
        .judge-options { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .judge-btn {
            padding: 24px;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            background: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .judge-btn:hover { border-color: var(--color-primary); background: var(--color-bg-secondary); }
        .judge-btn.selected { border-color: var(--color-primary); background: var(--color-info-light); color: var(--color-primary); }
        .judge-btn.correct { border-color: var(--color-success); background: var(--color-success-light); color: var(--color-success); }
        .judge-btn.wrong { border-color: var(--color-error); background: var(--color-error-light); color: var(--color-error); }
        .fill-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: 16px;
            outline: none;
            transition: all var(--transition-fast);
        }
        .fill-input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1); }
        .fill-input.correct { border-color: var(--color-success); background: var(--color-success-light); }
        .fill-input.wrong { border-color: var(--color-error); background: var(--color-error-light); }
        .essay-textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px 16px;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: 15px;
            font-family: inherit;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: all var(--transition-fast);
        }
        .essay-textarea:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(30, 58, 95, 0.1); }
        .explanation-section {
            margin-top: 20px;
            padding: 16px;
            background: var(--color-bg-secondary);
            border-radius: var(--radius-md);
            border-left: 4px solid var(--color-info);
        }
        .explanation-title { font-size: 14px; font-weight: 600; color: var(--color-text); margin-bottom: 8px; }
        .explanation-text { font-size: 14px; color: var(--color-text-secondary); line-height: 1.6; }
        .question-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .nav-buttons { display: flex; gap: 12px; }
        .question-actions { display: flex; gap: 12px; justify-content: flex-end; }
        .result-summary {
            background: white;
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-md);
            text-align: center;
            margin-bottom: 24px;
        }
        .result-score { font-size: 72px; font-weight: 700; color: var(--color-primary); margin-bottom: 8px; }
        .result-label { font-size: 18px; color: var(--color-text-secondary); margin-bottom: 32px; }
        .result-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
        .result-stat { padding: 20px; background: var(--color-bg-secondary); border-radius: var(--radius-md); }
        .result-stat-value { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
        .result-stat-value.success { color: var(--color-success); }
        .result-stat-value.error { color: var(--color-error); }
        .result-stat-label { font-size: 14px; color: var(--color-text-secondary); }
        .result-actions { display: flex; gap: 12px; justify-content: center; }
        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 16px 24px;
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }
        .exam-timer {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 700;
            color: var(--color-primary);
        }
        .exam-timer.warning { color: var(--color-warning); }
        .exam-timer.danger { color: var(--color-error); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .answer-sheet { background: white; border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); margin-bottom: 24px; }
        .answer-sheet-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--color-text); }
        .answer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 8px; }
        .answer-item {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            background: var(--color-bg-secondary);
            color: var(--color-text-secondary);
            border: 2px solid transparent;
        }
        .answer-item:hover { border-color: var(--color-primary); }
        .answer-item.answered { background: var(--color-primary); color: white; }
        .answer-item.current { border-color: var(--color-warning); box-shadow: 0 0 0 2px var(--color-warning-light); }
        .answer-item.correct { background: var(--color-success); color: white; }
        .answer-item.wrong { background: var(--color-error); color: white; }
        .exam-setup-card { max-width: 600px; margin: 0 auto; background: white; border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-md); }
        .setup-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .type-score-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--color-bg-secondary);
            border-radius: var(--radius-md);
            margin-bottom: 8px;
        }
        .type-score-label { font-size: 14px; color: var(--color-text); }
        .type-score-input { width: 80px; padding: 6px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: 14px; text-align: center; outline: none; }
        .type-score-input:focus { border-color: var(--color-primary); }
        .wrong-filter-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-select { padding: 8px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 14px; background: white; outline: none; cursor: pointer; }
        .wrong-question-item {
            background: white;
            border-radius: var(--radius-md);
