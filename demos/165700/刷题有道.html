    <script>
const Utils = {
    generateId(prefix = 'id') {
        return `${prefix}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
    },
    formatDate(timestamp, format = 'YYYY-MM-DD HH:mm') {
        const date = new Date(timestamp);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const seconds = String(date.getSeconds()).padStart(2, '0');
        return format.replace('YYYY', year).replace('MM', month).replace('DD', day).replace('HH', hours).replace('mm', minutes).replace('ss', seconds);
    },
    formatDuration(seconds) {
        if (seconds < 60) return `${seconds}秒`;
        if (seconds < 3600) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}分${secs}秒`;
        }
        const hours = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        return `${hours}小时${mins}分`;
    },
    shuffleArray(array) {
        const shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    },
    debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => { clearTimeout(timeout); func(...args); };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    },
    deepClone(obj) { return JSON.parse(JSON.stringify(obj)); },
    escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    },
    getQuestionTypeName(type) {
        const typeMap = { single: '单选题', multiple: '多选题', judge: '判断题', fill: '填空题', essay: '简答题' };
        return typeMap[type] || '未知题型';
    },
    downloadFile(content, filename, type = 'application/json') {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    },
    readFileAsText(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = reject;
            reader.readAsText(file);
        });
    },
    calculateAccuracy(correct, total) {
        if (total === 0) return 0;
        return Math.round((correct / total) * 100);
    }
};

const Storage = {
    KEYS: {
        BANKS: 'shiroha_quiz_banks',
        QUESTIONS: 'shiroha_quiz_questions',
        WRONG: 'shiroha_quiz_wrong',
        RECORDS: 'shiroha_quiz_records',
        SETTINGS: 'shiroha_quiz_settings'
    },
    _get(key, defaultValue) {
        try {
            const value = localStorage.getItem(key);
            return value ? JSON.parse(value) : defaultValue;
        } catch (e) {
            console.error(`Storage read error for key ${key}:`, e);
            return defaultValue;
        }
    },
    _set(key, value) {
        try {
            localStorage.setItem(key, JSON.stringify(value));
            return true;
        } catch (e) {
            console.error(`Storage write error for key ${key}:`, e);
            return false;
        }
    },
    getBanks() { return this._get(this.KEYS.BANKS, []); },
    saveBanks(banks) { return this._set(this.KEYS.BANKS, banks); },
    addBank(bank) { const banks = this.getBanks(); banks.unshift(bank); return this.saveBanks(banks); },
    updateBank(bankId, updates) {
        const banks = this.getBanks();
        const index = banks.findIndex(b => b.id === bankId);
        if (index !== -1) {
            banks[index] = { ...banks[index], ...updates, updatedAt: Date.now() };
            this.saveBanks(banks);
            return banks[index];
        }
        return null;
    },
    deleteBank(bankId) {
        const banks = this.getBanks().filter(b => b.id !== bankId);
        this.saveBanks(banks);
        const questions = this.getQuestions().filter(q => q.bankId !== bankId);
        this.saveQuestions(questions);
        const wrongQuestions = this.getWrongQuestions().filter(w => w.bankId !== bankId);
        this.saveWrongQuestions(wrongQuestions);
        const records = this.getRecords().filter(r => r.bankId !== bankId);
        this.saveRecords(records);
    },
    getBankById(bankId) { return this.getBanks().find(b => b.id === bankId) || null; },
    getQuestions() { return this._get(this.KEYS.QUESTIONS, []); },
    saveQuestions(questions) { return this._set(this.KEYS.QUESTIONS, questions); },
    getQuestionsByBank(bankId) { return this.getQuestions().filter(q => q.bankId === bankId); },
    addQuestion(question) { const questions = this.getQuestions(); questions.push(question); return this.saveQuestions(questions); },
    addQuestions(questionsToAdd) { const questions = this.getQuestions(); questions.push(...questionsToAdd); return this.saveQuestions(questions); },
    updateQuestion(questionId, updates) {
        const questions = this.getQuestions();
        const index = questions.findIndex(q => q.id === questionId);
        if (index !== -1) { questions[index] = { ...questions[index], ...updates }; this.saveQuestions(questions); return questions[index]; }
        return null;
    },
    deleteQuestion(questionId) {
        const question = this.getQuestionById(questionId);
        if (question) {
            const questions = this.getQuestions().filter(q => q.id !== questionId);
            this.saveQuestions(questions);
            const wrongQuestions = this.getWrongQuestions().filter(w => w.questionId !== questionId);
            this.saveWrongQuestions(wrongQuestions);
            const bank = this.getBankById(question.bankId);
            if (bank) this.updateBank(question.bankId, { questionCount: bank.questionCount - 1 });
        }
    },
    getQuestionById(questionId) { return this.getQuestions().find(q => q.id === questionId) || null; },
    getWrongQuestions() { return this._get(this.KEYS.WRONG, []); },
    saveWrongQuestions(wrongQuestions) { return this._set(this.KEYS.WRONG, wrongQuestions); },
    addWrongQuestion(questionId, bankId) {
        const wrongQuestions = this.getWrongQuestions();
        const existing = wrongQuestions.find(w => w.questionId === questionId);
        if (existing) { existing.wrongCount += 1; existing.lastWrongAt = Date.now(); existing.mastered = false; }
        else { wrongQuestions.push({ id: Utils.generateId('w'), questionId, bankId, wrongCount: 1, lastWrongAt: Date.now(), mastered: false }); }
        return this.saveWrongQuestions(wrongQuestions);
    },
    markWrongMastered(questionId, mastered = true) {
        const wrongQuestions = this.getWrongQuestions();
        const wrong = wrongQuestions.find(w => w.questionId === questionId);
        if (wrong) { wrong.mastered = mastered; this.saveWrongQuestions(wrongQuestions); }
    },
    deleteWrongQuestion(questionId) { const wrongQuestions = this.getWrongQuestions().filter(w => w.questionId !== questionId); return this.saveWrongQuestions(wrongQuestions); },
    deleteAllWrongQuestions() { return this.saveWrongQuestions([]); },
    getWrongByBank(bankId) { return this.getWrongQuestions().filter(w => w.bankId === bankId && !w.mastered); },
    getRecords() { return this._get(this.KEYS.RECORDS, []); },
    saveRecords(records) { return this._set(this.KEYS.RECORDS, records); },
    addRecord(record) { const records = this.getRecords(); records.unshift(record); return this.saveRecords(records); },
    getRecordById(recordId) { return this.getRecords().find(r => r.id === recordId) || null; },
    deleteRecord(recordId) { const records = this.getRecords().filter(r => r.id !== recordId); return this.saveRecords(records); },
    deleteAllRecords() { return this.saveRecords([]); },
    getSettings() {
        return this._get(this.KEYS.SETTINGS, { defaultPracticeMode: 'random', showExplanation: true, autoAddWrong: true });
    },
    saveSettings(settings) { return this._set(this.KEYS.SETTINGS, settings); },
    exportAllData() {
        return { version: '1.0', exportAt: Date.now(), banks: this.getBanks(), questions: this.getQuestions(), wrongQuestions: this.getWrongQuestions(), records: this.getRecords(), settings: this.getSettings() };
    },
    importAllData(data, merge = true) {
        if (!merge) {
            this.saveBanks(data.banks || []); this.saveQuestions(data.questions || []);
            this.saveWrongQuestions(data.wrongQuestions || []); this.saveRecords(data.records || []);
            if (data.settings) this.saveSettings(data.settings);
        } else {
            if (data.banks && data.banks.length) { const existingBanks = this.getBanks(); const newBanks = data.banks.filter(b => !existingBanks.find(eb => eb.id === b.id)); this.saveBanks([...existingBanks, ...newBanks]); }
            if (data.questions && data.questions.length) { const existingQuestions = this.getQuestions(); const newQuestions = data.questions.filter(q => !existingQuestions.find(eq => eq.id === q.id)); this.saveQuestions([...existingQuestions, ...newQuestions]); }
            if (data.wrongQuestions && data.wrongQuestions.length) { const existingWrong = this.getWrongQuestions(); const newWrong = data.wrongQuestions.filter(w => !existingWrong.find(ew => ew.id === w.id)); this.saveWrongQuestions([...existingWrong, ...newWrong]); }
            if (data.records && data.records.length) { const existingRecords = this.getRecords(); const newRecords = data.records.filter(r => !existingRecords.find(er => er.id === r.id)); this.saveRecords([...existingRecords, ...newRecords]); }
        }
        return true;
    },
    clearAllData() { Object.values(this.KEYS).forEach(key => localStorage.removeItem(key)); }
};

const UI = {
    toast(message, type = 'info', duration = 3000) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(100%)';
            toast.style.transition = 'all 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, duration);
    },
    showModal({ title, content, onConfirm, onCancel, confirmText = '确定', cancelText = '取消', showCancel = true }) {
        const container = document.getElementById('modal-container');
        container.innerHTML = `
            <div class="modal">
                <div class="modal-header"><h3 class="modal-title">${Utils.escapeHtml(title)}</h3></div>
                <div class="modal-body">${typeof content === 'string' ? content : ''}</div>
                <div class="modal-footer">
                    ${showCancel ? `<button class="btn btn-secondary" id="modal-cancel">${cancelText}</button>` : ''}
                    <button class="btn btn-primary" id="modal-confirm">${confirmText}</button>
                </div>
            </div>`;
        container.classList.add('active');
        const closeModal = () => { container.classList.remove('active'); container.innerHTML = ''; };
        document.getElementById('modal-confirm').addEventListener('click', () => {
            if (onConfirm) { const result = onConfirm(); if (result !== false) closeModal(); }
            else closeModal();
        });
        if (showCancel) {
            document.getElementById('modal-cancel').addEventListener('click', () => {
                if (onCancel) onCancel();
                closeModal();
            });
        }
        container.addEventListener('click', (e) => {
            if (e.target === container) { if (onCancel) onCancel(); closeModal(); }
        });
        return { close: closeModal };
    },
    confirm(message, onConfirm) {
        return this.showModal({ title: '确认操作', content: `<p>${Utils.escapeHtml(message)}</p>`, onConfirm, confirmText: '确定', cancelText: '取消' });
    },
    loading(show = true, text = '加载中...') {
        let overlay = document.getElementById('loading-overlay');
        if (show) {
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'loading-overlay';
                overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,0.8);display:flex;align-items:center;justify-content:center;z-index:2000;';
                overlay.innerHTML = `<div style="text-align:center;"><div style="width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#1e3a5f;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;"></div><p style="color:#64748b;font-size:14px;">${text}</p></div><style>@keyframes spin{to{transform:rotate(360deg);}}</style>`;
                document.body.appendChild(overlay);
            }
        } else { if (overlay) overlay.remove(); }
    }
};

const Importer = {
    parseText(text) {
        const questions = [];
        const lines = text.split('\n').map(line => line.trim()).filter(line => line);
        let currentQuestion = null;
        let currentType = 'single';
        let sectionType = null;
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            if (this._isSectionTitle(line)) { sectionType = this._detectSectionType(line); continue; }
            const questionMatch = this._matchQuestionNumber(line);
            if (questionMatch) {
                if (currentQuestion) questions.push(this._finalizeQuestion(currentQuestion));
                const questionText = line.replace(questionMatch.regex, '').trim();
                currentQuestion = { type: sectionType || 'single', question: questionText, options: [], answer: null, explanation: null };
                continue;
            }
            if (!currentQuestion) continue;
            if (this._matchOption(line)) { currentQuestion.options.push(line); continue; }
            const answerMatch = this._matchAnswer(line);
            if (answerMatch) {
                currentQuestion.answer = this._parseAnswer(answerMatch.answer, currentQuestion);
                if (currentQuestion.options.length > 0 && !sectionType) currentQuestion.type = this._detectQuestionType(currentQuestion);
                continue;
            }
            const explanationMatch = this._matchExplanation(line);
            if (explanationMatch) { currentQuestion.explanation = explanationMatch.explanation; continue; }
            if (currentQuestion.explanation !== null) currentQuestion.explanation += ' ' + line;
            else if (currentQuestion.answer === null && currentQuestion.options.length === 0) currentQuestion.question += ' ' + line;
        }
        if (currentQuestion) questions.push(this._finalizeQuestion(currentQuestion));
        return questions.map(q => ({ ...q, id: Utils.generateId('q'), createdAt: Date.now() }));
    },
    _finalizeQuestion(question) {
        if (question.options.length > 0 && !question.type) question.type = this._detectQuestionType(question);
        if (question.type === 'judge' && question.options.length === 0) question.options = ['正确', '错误'];
        return question;
    },
    _isSectionTitle(line) {
        return /^[一二三四五六七八九十]+[、.]\s*(单选题|多选题|判断题|填空题|简答题|选择题|单选|多选|判断|填空|简答)/.test(line) || /^（[一二三四五六七八九十]+）\s*(单选题|多选题|判断题|填空题|简答题)/.test(line) || /^第[一二三四五六七八九十]+[节部分]\s*(单选题|多选题|判断题|填空题|简答题)/.test(line);
    },
    _detectSectionType(line) {
        if (/多选/.test(line)) return 'multiple';
        if (/判断/.test(line)) return 'judge';
        if (/填空/.test(line)) return 'fill';
        if (/简答/.test(line)) return 'essay';
        if (/单选|选择/.test(line)) return 'single';
        return null;
    },
    _matchQuestionNumber(line) {
        const patterns = [
            { regex: /^(\d+)[.、．]/, num: 1 }, { regex: /^(\d+)\)/, num: 1 },
            { regex: /^（(\d+)）/, num: 1 }, { regex: /^\((\d+)\)/, num: 1 }, { regex: /^【(\d+)】/, num: 1 }
        ];
        for (const pattern of patterns) if (pattern.regex.test(line)) return pattern;
        return null;
    },
    _matchOption(line) { return /^[A-Z][.、．)]/.test(line) || /^[A-Z]\s*[.、．)]/.test(line); },
    _matchAnswer(line) {
        const patterns = [
            { regex: /^(答案|参考答案|正确答案)[：:]\s*(.+)/, key: 2 },
            { regex: /^【(答案|参考答案|正确答案)】\s*(.+)/, key: 2 },
            { regex: /^答：\s*(.+)/, key: 1 }
        ];
        for (const pattern of patterns) {
            const match = line.match(pattern.regex);
            if (match) return { answer: match[pattern.key].trim() };
        }
        return null;
    },
    _matchExplanation(line) {
        const patterns = [/^(解析|答案解析|参考解析)[：:]\s*(.+)/, /^【(解析|答案解析)】\s*(.+)/];
        for (const pattern of patterns) {
            const match = line.match(pattern);
            if (match) return { explanation: match[2].trim() };
        }
        return null;
    },
    _parseAnswer(answerText, question) {
        if (question.type === 'judge') return /(正确|对|√|是|true|T)/i.test(answerText);
        if (question.type === 'fill' || question.type === 'essay') return answerText.split(/[，,；;]/).map(s => s.trim()).filter(s => s);
        const cleanAnswer = answerText.replace(/\s+/g, '').toUpperCase();
        const letters = cleanAnswer.match(/[A-Z]/g);
        if (letters) {
            if (letters.length > 1 && question.type !== 'multiple') question.type = 'multiple';
            return letters.length === 1 ? letters[0] : letters;
        }
        return answerText;
    },
    _detectQuestionType(question) {
        if (question.options.length === 0) return 'essay';
        if (question.options.length <= 2) return 'judge';
        if (Array.isArray(question.answer) && question.answer.length > 1) return 'multiple';
        if (typeof question.answer === 'string' && /^[A-Z]$/.test(question.answer)) return 'single';
        return 'single';
    },
    parseJson(text) {
        try {
            const data = JSON.parse(text);
            const processItem = (item) => ({
                id: item.id || Utils.generateId('q'), bankId: item.bankId || null,
                type: item.type || 'single', question: item.question || item.title || '',
                options: item.options || item.choices || [],
                answer: item.answer !== undefined ? item.answer : (item.correctAnswer || item.correct || null),
                explanation: item.explanation || item.analysis || item.explain || '',
                createdAt: item.createdAt || Date.now()
            });
            if (Array.isArray(data)) return data.map(processItem);
            if (data.questions && Array.isArray(data.questions)) return data.questions.map(processItem);
            throw new Error('JSON 格式不正确');
        } catch (e) { throw new Error(`JSON 解析失败: ${e.message}`); }
    },
    autoDetectAndParse(text) {
        const trimmed = text.trim();
        if ((trimmed.startsWith('{') || trimmed.startsWith('[')) && (trimmed.endsWith('}') || trimmed.endsWith(']'))) {
            try { return { questions: this.parseJson(text), format: 'json' }; } catch (e) {}
        }
        return { questions: this.parseText(text), format: 'text' };
    }
};

const BankManager = {
    createBank(name, description = '', questions = []) {
        const bank = { id: Utils.generateId('bank'), name, description, questionCount: questions.length, createdAt: Date.now(), updatedAt: Date.now() };
        Storage.addBank(bank);
        if (questions.length > 0) Storage.addQuestions(questions.map(q => ({ ...q, bankId: bank.id })));
        return bank;
    },
    importBank(name, description, questions) { return this.createBank(name, description, questions); },
    deleteBank(bankId) {
        UI.confirm('确定要删除这个题库吗？所有相关题目、错题和记录都将被删除，此操作不可恢复。', () => {
            Storage.deleteBank(bankId);
            UI.toast('题库已删除', 'success');
            if (app.currentRoute === 'banks') app.renderBankList(); else app.navigate('banks');
        });
    },
    renameBank(bankId) {
        const bank = Storage.getBankById(bankId);
        if (!bank) return;
        const modal = UI.showModal({
            title: '重命名题库',
            content: `
                <div class="form-group"><label class="form-label">题库名称</label><input type="text" class="form-input" id="bank-name-input" value="${Utils.escapeHtml(bank.name)}"></div>
                <div class="form-group"><label class="form-label">题库描述</label><input type="text" class="form-input" id="bank-desc-input" value="${Utils.escapeHtml(bank.description || '')}"></div>`,
            confirmText: '保存',
            onConfirm: () => {
                const name = document.getElementById('bank-name-input').value.trim();
                const description = document.getElementById('bank-desc-input').value.trim();
                if (!name) { UI.toast('请输入题库名称', 'warning'); return false; }
                Storage.updateBank(bankId, { name, description });
                UI.toast('题库已更新', 'success');
                modal.close();
                app.renderBankList();
                return false;
            }
        });
    },
    getQuestionsByType(bankId, type) { return Storage.getQuestionsByBank(bankId).filter(q => q.type === type); },
    getTypeStats(bankId) {
        const questions = Storage.getQuestionsByBank(bankId);
        const stats = { single: 0, multiple: 0, judge: 0, fill: 0, essay: 0 };
        questions.forEach(q => { if (stats[q.type] !== undefined) stats[q.type]++; });
        return stats;
    }
};

const PracticeMode = {
    state: { bankId: null, questions: [], currentIndex: 0, userAnswers: {}, submitted: false, mode: 'random', startTime: 0 },
    start(bankId, mode = 'random') {
        const bank = Storage.getBankById(bankId);
        if (!bank) { UI.toast('题库不存在', 'error'); return; }
        let questions = Storage.getQuestionsByBank(bankId);
        if (questions.length === 0) { UI.toast('该题库没有题目', 'warning'); return; }
        if (mode === 'random') questions = Utils.shuffleArray(questions);
        this.state = { bankId, questions, currentIndex: 0, userAnswers: {}, submitted: false, mode, startTime: Date.now() };
        this.render();
    },
    startFromWrong(wrongQuestions) {
        if (wrongQuestions.length === 0) { UI.toast('没有错题', 'warning'); return; }
        const questions = wrongQuestions.map(w => Storage.getQuestionById(w.questionId)).filter(Boolean);
        if (questions.length === 0) { UI.toast('错题数据加载失败', 'error'); return; }
        this.state = { bankId: questions[0].bankId, questions, currentIndex: 0, userAnswers: {}, submitted: false, mode: 'wrong', startTime: Date.now() };
        this.render();
    },
    render() {
        const { questions, currentIndex, userAnswers, submitted } = this.state;
        const question = questions[currentIndex];
        const progress = ((currentIndex + 1) / questions.length) * 100;
        const userAnswer = userAnswers[question.id];
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="question-container">
                <div class="question-header">
                    <span class="question-number">第 ${currentIndex + 1} / ${questions.length} 题</span>
                    <span class="question-type-badge">${Utils.getQuestionTypeName(question.type)}</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
                <div class="question-card">
                    <div class="question-text">${Utils.escapeHtml(question.question)}</div>
                    ${this._renderOptions(question, userAnswer, submitted)}
                    ${submitted && question.explanation ? `<div class="explanation-section"><div class="explanation-title">📖 答案解析</div><div class="explanation-text">${Utils.escapeHtml(question.explanation)}</div></div>` : ''}
                </div>
                <div class="question-nav">
                    <div class="nav-buttons">
                        <button class="btn btn-secondary" ${currentIndex === 0 ? 'disabled' : ''} onclick="PracticeMode.prevQuestion()">← 上一题</button>
                        <button class="btn btn-secondary" ${currentIndex === questions.length - 1 ? 'disabled' : ''} onclick="PracticeMode.nextQuestion()">下一题 →</button>
                    </div>
                    <div class="question-actions">
                        ${!submitted ? `<button class="btn btn-primary" onclick="PracticeMode.submitCurrent()">提交答案</button>` : `<button class="btn btn-success" onclick="PracticeMode.finish()">完成练习</button>`}
                    </div>
                </div>
            </div>`;
    },
    _renderOptions(question, userAnswer, submitted) {
        switch (question.type) {
            case 'single': return this._renderSingleOptions(question, userAnswer, submitted);
            case 'multiple': return this._renderMultipleOptions(question, userAnswer, submitted);
            case 'judge': return this._renderJudgeOptions(question, userAnswer, submitted);
            case 'fill': return this._renderFillInput(question, userAnswer, submitted);
            case 'essay': return this._renderEssayInput(question, userAnswer, submitted);
            default: return '<p>不支持的题型</p>';
        }
    },
    _renderSingleOptions(question, userAnswer, submitted) {
        return `<div class="options-list">${question.options.map((opt, idx) => {
            const letter = String.fromCharCode(65 + idx);
            const isSelected = userAnswer === letter;
            const isCorrectAnswer = question.answer === letter;
            let className = 'option-item';
            if (submitted) { if (isCorrectAnswer) className += ' correct'; else if (isSelected && !isCorrectAnswer) className += ' wrong'; }
            else if (isSelected) className += ' selected';
            return `<div class="${className}" onclick="${submitted ? '' : `PracticeMode.selectOption('${letter}')`}"><span class="option-letter">${letter}</span><span class="option-text">${Utils.escapeHtml(opt.replace(/^[A-Z][.、．)]\s*/, ''))}</span></div>`;
        }).join('')}</div>`;
    },
    _renderMultipleOptions(question, userAnswer, submitted) {
        const answers = Array.isArray(userAnswer) ? userAnswer : [];
        const correctAnswers = Array.isArray(question.answer) ? question.answer : [question.answer];
        return `<div class="options-list">${question.options.map((opt, idx) => {
            const letter = String.fromCharCode(65 + idx);
            const isSelected = answers.includes(letter);
            const isCorrectAnswer = correctAnswers.includes(letter);
            let className = 'option-item';
            if (submitted) { if (isCorrectAnswer) className += ' correct'; else if (isSelected && !isCorrectAnswer) className += ' wrong'; }
            else if (isSelected) className += ' selected';
            return `<div class="${className}" onclick="${submitted ? '' : `PracticeMode.toggleMultipleOption('${letter}')`}"><span class="option-letter">${letter}</span><span class="option-text">${Utils.escapeHtml(opt.replace(/^[A-Z][.、．)]\s*/, ''))}</span></div>`;
        }).join('')}</div>`;
    },
    _renderJudgeOptions(question, userAnswer, submitted) {
        const correctAnswer = question.answer;
        const getBtnClass = (val) => {
            let cls = 'judge-btn';
            if (submitted) { if (correctAnswer === val) cls += ' correct'; else if (userAnswer === val && userAnswer !== correctAnswer) cls += ' wrong'; }
            else if (userAnswer === val) cls += ' selected';
            return cls;
        };
        return `<div class="judge-options"><button class="${getBtnClass(true)}" onclick="${submitted ? '' : 'PracticeMode.selectJudge(true)'}">✓ 正确</button><button class="${getBtnClass(false)}" onclick="${submitted ? '' : 'PracticeMode.selectJudge(false)'}">✗ 错误</button></div>`;
    },
    _renderFillInput(question, userAnswer, submitted) {
        const value = Array.isArray(userAnswer) ? userAnswer.join(', ') : (userAnswer || '');
        const correctAnswers = Array.isArray(question.answer) ? question.answer : [question.answer];
        let inputClass = 'fill-input';
        if (submitted) { const isCorrect = this._checkAnswer(question, userAnswer); inputClass += isCorrect ? ' correct' : ' wrong'; }
        return `<div><input type="text" class="${inputClass}" placeholder="请输入答案" value="${Utils.escapeHtml(value)}" ${submitted ? 'disabled' : ''} oninput="PracticeMode.updateFillAnswer(this.value)" onkeydown="if(event.key==='Enter')PracticeMode.submitCurrent()">${submitted ? `<div style="margin-top:12px;font-size:14px;color:var(--color-success);">正确答案：${correctAnswers.map(a => Utils.escapeHtml(a)).join(' / ')}</div>` : ''}</div>`;
    },
    _renderEssayInput(question, userAnswer, submitted) {
        const value = Array.isArray(userAnswer) ? userAnswer.join('\n') : (userAnswer || '');
        const correctAnswers = Array.isArray(question.answer) ? question.answer : [question.answer];
        return `<div><textarea class="essay-textarea" placeholder="请输入你的答案..." ${submitted ? 'disabled' : ''} oninput="PracticeMode.updateEssayAnswer(this.value)">${Utils.escapeHtml(value)}</textarea>${submitted ? `<div style="margin-top:12px;font-size:14px;color:var(--color-success);">参考答案：${correctAnswers.map(a => Utils.escapeHtml(a)).join(' / ')}</div><div style="margin-top:8px;font-size:13px;color:var(--color-text-secondary);">简答题需自行判断正误</div>` : ''}</div>`;
    },
    selectOption(letter) { const question = this.state.questions[this.state.currentIndex]; this.state.userAnswers[question.id] = letter; this.render(); },
    toggleMultipleOption(letter) {
        const question = this.state.questions[this.state.currentIndex];
        let answers = this.state.userAnswers[question.id] || [];
        if (!Array.isArray(answers)) answers = [];
        if (answers.includes(letter)) answers = answers.filter(a => a !== letter);
        else { answers.push(letter); answers.sort(); }
        this.state.userAnswers[question.id] = answers;
        this.render();
    },
    selectJudge(value) { const question = this.state.questions[this.state.currentIndex]; this.state.userAnswers[question.id] = value; this.render(); },
    updateFillAnswer(value) {
        const question = this.state.questions[this.state.currentIndex];
        const answers = value.split(/[,，;；]/).map(s => s.trim()).filter(s => s);
        this.state.userAnswers[question.id] = answers.length > 1 ? answers : value;
    },
    updateEssayAnswer(value) { const question = this.state.questions[this.state.currentIndex]; this.state.userAnswers[question.id] = value; },
    submitCurrent() {
        const question = this.state.questions[this.state.currentIndex];
        const userAnswer = this.state.userAnswers[question.id];
        if (userAnswer === undefined || userAnswer === '' || (Array.isArray(userAnswer) && userAnswer.length === 0)) { UI.toast('请先作答', 'warning'); return; }
        const isCorrect = this._checkAnswer(question, userAnswer);
        const settings = Storage.getSettings();
        if (!isCorrect && settings.autoAddWrong) Storage.addWrongQuestion(question.id, question.bankId);
        this.state.submitted = true;
        this.render();
    },
    _checkAnswer(question, userAnswer) {
        if (userAnswer === undefined || userAnswer === null) return false;
        const correctAnswer = question.answer;
        if (question.type === 'judge') return userAnswer === correctAnswer;
        if (question.type === 'single') return userAnswer === correctAnswer;
        if (question.type === 'multiple') {
            const userArr = Array.isArray(userAnswer) ? [...userAnswer].sort() : [userAnswer];
            const correctArr = Array.isArray(correctAnswer) ? [...correctAnswer].sort() : [correctAnswer];
            return JSON.stringify(userArr) === JSON.stringify(correctArr);
        }
        if (question.type === 'fill') {
            const userArr = Array.isArray(userAnswer) ? userAnswer : [userAnswer];
            const correctArr = Array.isArray(correctAnswer) ? correctAnswer : [correctAnswer];
            if (userArr.length !== correctArr.length) return false;
            return correctArr.every((correct, idx) => { const userVal = userArr[idx] || ''; return userVal.trim().toLowerCase() === correct.trim().toLowerCase(); });
        }
        if (question.type === 'essay') return null;
        return false;
    },
    prevQuestion() { if (this.state.currentIndex > 0) { this.state.currentIndex--; this.state.submitted = this._isSubmitted(this.state.questions[this.state.currentIndex].id); this.render(); } },
    nextQuestion() { if (this.state.currentIndex < this.state.questions.length - 1) { this.state.currentIndex++; this.state.submitted = this._isSubmitted(this.state.questions[this.state.currentIndex].id); this.render(); } },
    _isSubmitted(questionId) { const answer = this.state.userAnswers[questionId]; return answer !== undefined && answer !== '' && !(Array.isArray(answer) && answer.length === 0); },
    finish() {
        const { questions, userAnswers, startTime, bankId, mode } = this.state;
        const duration = Math.round((Date.now() - startTime) / 1000);
        let correctCount = 0, wrongCount = 0;
        questions.forEach(q => { const isCorrect = this._checkAnswer(q, userAnswers[q.id]); if (isCorrect === true) correctCount++; else if (isCorrect === false) wrongCount++; });
        const bank = Storage.getBankById(bankId);
        const record = { id: Utils.generateId('r'), type: mode === 'wrong' ? 'wrong-practice' : 'practice', bankId, bankName: bank ? bank.name : '未知题库', totalQuestions: questions.length, correctCount, wrongCount, duration, score: Utils.calculateAccuracy(correctCount, questions.length), createdAt: Date.now(), items: questions.map(q => ({ questionId: q.id, userAnswer: userAnswers[q.id] !== undefined ? userAnswers[q.id] : null, isCorrect: this._checkAnswer(q, userAnswers[q.id]), timeSpent: 0 })) };
        Storage.addRecord(record);
        this._showResult(record);
    },
    _showResult(record) {
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="question-container">
                <div class="result-summary">
                    <div class="result-score">${record.score}%</div>
                    <div class="result-label">正确率</div>
                    <div class="result-stats">
                        <div class="result-stat"><div class="result-stat-value">${record.totalQuestions}</div><div class="result-stat-label">总题数</div></div>
                        <div class="result-stat"><div class="result-stat-value success">${record.correctCount}</div><div class="result-stat-label">答对</div></div>
                        <div class="result-stat"><div class="result-stat-value error">${record.wrongCount}</div><div class="result-stat-label">答错</div></div>
                    </div>
                    <div style="margin-bottom:24px;color:var(--color-text-secondary);font-size:14px;">用时：${Utils.formatDuration(record.duration)}</div>
                    <div class="result-actions">
                        <button class="btn btn-secondary" onclick="app.navigate('home')">返回首页</button>
                        <button class="btn btn-primary" onclick="PracticeMode.retry()">再练一次</button>
                        ${record.wrongCount > 0 ? `<button class="btn btn-error" onclick="PracticeMode.retryWrong()">只练错题</button>` : ''}
                    </div>
                </div>
            </div>`;
    },
    retry() { this.start(this.state.bankId, this.state.mode === 'random' ? 'random' : 'sequential'); },
    retryWrong() { const wrongQuestions = Storage.getWrongByBank(this.state.bankId); this.startFromWrong(wrongQuestions); }
};

const ExamMode = {
    state: { bankId: null, questions: [], currentIndex: 0, userAnswers: {}, duration: 0, remainingTime: 0, startTime: 0, timerInterval: null, submitted: false, scorePerType: {} },
    showSetup(bankId) {
        const bank = Storage.getBankById(bankId);
        if (!bank) { UI.toast('题库不存在', 'error'); return; }
        const questions = Storage.getQuestionsByBank(bankId);
        if (questions.length === 0) { UI.toast('该题库没有题目', 'warning'); return; }
        const typeStats = BankManager.getTypeStats(bankId);
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="exam-setup-card">
                <h2 style="text-align:center;margin-bottom:24px;font-size:22px;">模拟考试设置</h2>
                <div class="form-group">
                    <label class="form-label">题库</label>
                    <div style="padding:10px 14px;background:var(--color-bg-secondary);border-radius:var(--radius-md);">${Utils.escapeHtml(bank.name)}（共 ${questions.length} 题）</div>
                </div>
                <div class="setup-row">
                    <div class="form-group"><label class="form-label">考试时长（分钟）</label><input type="number" class="form-input" id="exam-duration" value="30" min="1" max="600"></div>
                    <div class="form-group"><label class="form-label">总分</label><input type="number" class="form-input" id="exam-total-score" value="100" min="1" max="1000"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">各题型数量</label>
                    <div id="type-counts">${Object.entries(typeStats).filter(([, count]) => count > 0).map(([type, count]) => `<div class="type-score-item"><span class="type-score-label">${Utils.getQuestionTypeName(type)}（共 ${count} 题）</span><input type="number" class="type-score-input" data-type="${type}" value="${count}" min="0" max="${count}"></div>`).join('')}</div>
                </div>
                <div style="margin-top:24px;display:flex;gap:12px;"><button class="btn btn-secondary btn-block" onclick="app.navigate('bank','${bankId}')">取消</button><button class="btn btn-primary btn-block" onclick="ExamMode.start('${bankId}')">开始考试</button></div>
            </div>`;
    },
    start(bankId) {
        const duration = parseInt(document.getElementById('exam-duration').value) || 30;
        const totalScore = parseInt(document.getElementById('exam-total-score').value) || 100;
        const typeCounts = {}, scorePerType = {};
        document.querySelectorAll('.type-score-input').forEach(input => { typeCounts[input.dataset.type] = parseInt(input.value) || 0; });
        let totalQuestions = Object.values(typeCounts).reduce((a, b) => a + b, 0);
        if (totalQuestions === 0) { UI.toast('请至少选择一道题', 'warning'); return; }
        const perQuestionScore = totalScore / totalQuestions;
        Object.keys(typeCounts).forEach(type => { scorePerType[type] = perQuestionScore; });
        let allQuestions = [];
        Object.entries(typeCounts).forEach(([type, count]) => {
            if (count > 0) { let typeQuestions = BankManager.getQuestionsByType(bankId, type); typeQuestions = Utils.shuffleArray(typeQuestions).slice(0, count); allQuestions = allQuestions.concat(typeQuestions); }
        });
        allQuestions = Utils.shuffleArray(allQuestions);
        this.state = { bankId, questions: allQuestions, currentIndex: 0, userAnswers: {}, duration: duration * 60, remainingTime: duration * 60, startTime: Date.now(), timerInterval: null, submitted: false, scorePerType };
        this.startTimer();
        this.render();
    },
    startTimer() {
        if (this.state.timerInterval) clearInterval(this.state.timerInterval);
        this.state.timerInterval = setInterval(() => {
            this.state.remainingTime--;
            const timerEl = document.querySelector('.exam-timer');
            if (timerEl) {
                timerEl.textContent = this._formatTime(this.state.remainingTime);
                timerEl.classList.remove('warning', 'danger');
                if (this.state.remainingTime <= 60) timerEl.classList.add('danger');
                else if (this.state.remainingTime <= 300) timerEl.classList.add('warning');
            }
            if (this.state.remainingTime <= 0) { this.submit(); UI.toast('考试时间到，已自动交卷', 'warning'); }
        }, 1000);
    },
    _formatTime(seconds) { const mins = Math.floor(seconds / 60); const secs = seconds % 60; return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`; },
    render() {
        const { questions, currentIndex, userAnswers, submitted, remainingTime } = this.state;
        const question = questions[currentIndex];
        const progress = ((currentIndex + 1) / questions.length) * 100;
        const answeredCount = Object.keys(userAnswers).length;
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="question-container">
                <div class="exam-header">
                    <div class="exam-timer ${remainingTime <= 60 ? 'danger' : remainingTime <= 300 ? 'warning' : ''}">⏱ ${this._formatTime(remainingTime)}</div>
                    <div style="font-size:14px;color:var(--color-text-secondary);">已答：${answeredCount} / ${questions.length}</div>
                </div>
                <div class="answer-sheet">
                    <div class="answer-sheet-title">答题卡</div>
                    <div class="answer-grid">${questions.map((q, idx) => {
                        let cls = 'answer-item';
                        if (userAnswers[q.id] !== undefined) cls += ' answered';
                        if (idx === currentIndex) cls += ' current';
                        if (submitted) { const isCorrect = this._checkAnswer(q, userAnswers[q.id]); if (isCorrect) cls += ' correct'; else if (isCorrect === false) cls += ' wrong'; }
                        return `<div class="${cls}" onclick="ExamMode.jumpTo(${idx})">${idx + 1}</div>`;
                    }).join('')}</div>
                </div>
                <div class="question-header"><span class="question-number">第 ${currentIndex + 1} / ${questions.length} 题</span><span class="question-type-badge">${Utils.getQuestionTypeName(question.type)}</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
                <div class="question-card">
                    <div class="question-text">${Utils.escapeHtml(question.question)}</div>
                    ${this._renderOptions(question, userAnswers[question.id], submitted)}
                    ${submitted && question.explanation ? `<div class="explanation-section"><div class="explanation-title">📖 答案解析</div><div class="explanation-text">${Utils.escapeHtml(question.explanation)}</div></div>` : ''}
                </div>
                <div class="question-nav">
                    <div class="nav-buttons">
                        <button class="btn btn-secondary" ${currentIndex === 0 ? 'disabled' : ''} onclick="ExamMode.prevQuestion()">← 上一题</button>
                        <button class="btn btn-secondary" ${currentIndex === questions.length - 1 ? 'disabled' : ''} onclick="ExamMode.nextQuestion()">下一题 →</button>
                    </div>
                    <div class="question-actions">${!submitted ? `<button class="btn btn-primary" onclick="ExamMode.confirmSubmit()">交卷</button>` : `<button class="btn btn-success" onclick="ExamMode.showResult()">查看成绩</button>`}</div>
                </div>
            </div>`;
    },
    _renderOptions(question, userAnswer, submitted) {
        switch (question.type) {
            case 'single': return this._renderSingleOptions(question, userAnswer, submitted);
            case 'multiple': return this._renderMultipleOptions(question, userAnswer, submitted);
            case 'judge': return this._renderJudgeOptions(question, userAnswer, submitted);
            case 'fill': return this._renderFillInput(question, userAnswer, submitted);
            case 'essay': return this._renderEssayInput(question, userAnswer, submitted);
            default: return '<p>不支持的题型</p>';
        }
    },
    _renderSingleOptions(question, userAnswer, submitted) {
        return `<div class="options-list">${question.options.map((opt, idx) => {
            const letter = String.fromCharCode(65 + idx);
            const isSelected = userAnswer === letter;
            const isCorrectAnswer = question.answer === letter;
            let className = 'option-item';
            if (submitted) { if (isCorrectAnswer) className += ' correct'; else if (isSelected && !isCorrectAnswer) className += ' wrong'; }
            else if (isSelected) className += ' selected';
            return `<div class="${className}" onclick="${submitted ? '' : `ExamMode.selectOption('${letter}')`}"><span class="option-letter">${letter}</span><span class="option-text">${Utils.escapeHtml(opt.replace(/^[A-Z][.、．)]\s*/, ''))}</span></div>`;
        }).join('')}</div>`;
    },
    _renderMultipleOptions(question, userAnswer, submitted) {
        const answers = Array.isArray(userAnswer) ? userAnswer : [];
        const correctAnswers = Array.isArray(question.answer) ? question.answer : [question.answer];
        return `<div class="options-list">${question.options.map((opt, idx) => {
            const letter = String.fromCharCode(65 + idx);
            const isSelected = answers.includes(letter);
            const isCorrectAnswer = correctAnswers.includes(letter);
            let className = 'option-item';
            if (submitted) { if (isCorrectAnswer) className += ' correct'; else if (isSelected && !isCorrectAnswer) className += ' wrong'; }
            else if (isSelected) className += ' selected';
            return `<div class="${className}" onclick="${submitted ? '' : `ExamMode.toggleMultipleOption('${letter}')`}"><span class="option-letter">${letter}</span><span class="option-text">${Utils.escapeHtml(opt.replace(/^[A-Z][.、．)]\s*/, ''))}</span></div>`;
        }).join('')}</div>`;
    },
    _renderJudgeOptions(question, userAnswer, submitted) {
        const correctAnswer = question.answer;
        const getBtnClass = (val) => {
            let cls = 'judge-btn';
            if (submitted) { if (correctAnswer === val) cls += ' correct'; else if (userAnswer === val && userAnswer !== correctAnswer) cls += ' wrong'; }
            else if (userAnswer === val) cls += ' selected';
            return cls;
        };
        return `<div class="judge-options"><button class="${getBtnClass(true)}" onclick="${submitted ? '' : 'ExamMode.selectJudge(true)'}">✓ 正确</button><button class="${getBtnClass(false)}" onclick="${submitted ? '' : 'ExamMode.selectJudge(false)'}">✗ 错误</button></div>`;
    },
    _renderFillInput(question, userAnswer, submitted) {
        const value = Array.isArray(userAnswer) ? userAnswer.join(', ') : (userAnswer || '');
        const correctAnswers = Array.isArray(question.answer) ? question.answer : [question.answer];
        let inputClass = 'fill-input';
        if (submitted) { const isCorrect = this._checkAnswer(question, userAnswer); inputClass += isCorrect ? ' correct' : ' wrong'; }
        return `<div><input type="text" class="${inputClass}" placeholder="请输入答案" value="${Utils.escapeHtml(value)}" ${submitted ? 'disabled' : ''} oninput="ExamMode.updateFillAnswer(this.value)">${submitted ? `<div style="margin-top:12px;font-size:14px;color:var(--color-success);">正确答案：${correctAnswers.map(a => Utils.escapeHtml(a)).join(' / ')}</div>` : ''}</div>`;
    },
    _renderEssayInput(question, userAnswer, submitted) {
        const value = Array.isArray(userAnswer) ? userAnswer.join('\n') : (userAnswer || '');
        const correctAnswers = Array.isArray(question.answer) ? question.answer : [question.answer];
        return `<div><textarea class="essay-textarea" placeholder="请输入你的答案..." ${submitted ? 'disabled' : ''} oninput="ExamMode.updateEssayAnswer(this.value)">${Utils.escapeHtml(value)}</textarea>${submitted ? `<div style="margin-top:12px;font-size:14px;color:var(--color-success);">参考答案：${correctAnswers.map(a => Utils.escapeHtml(a)).join(' / ')}</div>` : ''}</div>`;
    },
    selectOption(letter) { const question = this.state.questions[this.state.currentIndex]; this.state.userAnswers[question.id] = letter; this.render(); },
    toggleMultipleOption(letter) {
        const question = this.state.questions[this.state.currentIndex];
        let answers = this.state.userAnswers[question.id] || [];
        if (!Array.isArray(answers)) answers = [];
        if (answers.includes(letter)) answers = answers.filter(a => a !== letter);
        else { answers.push(letter); answers.sort(); }
        this.state.userAnswers[question.id] = answers;
        this.render();
    },
    selectJudge(value) { const question = this.state.questions[this.state.currentIndex]; this.state.userAnswers[question.id] = value; this.render(); },
    updateFillAnswer(value) {
        const question = this.state.questions[this.state.currentIndex];
        const answers = value.split(/[,，;；]/).map(s => s.trim()).filter(s => s);
        this.state.userAnswers[question.id] = answers.length > 1 ? answers : value;
    },
    updateEssayAnswer(value) { const question = this.state.questions[this.state.currentIndex]; this.state.userAnswers[question.id] = value; },
    prevQuestion() { if (this.state.currentIndex > 0) { this.state.currentIndex--; this.render(); } },
    nextQuestion() { if (this.state.currentIndex < this.state.questions.length - 1) { this.state.currentIndex++; this.render(); } },
    jumpTo(index) { if (index >= 0 && index < this.state.questions.length) { this.state.currentIndex = index; this.render(); } },
    confirmSubmit() {
        const { questions, userAnswers } = this.state;
        const unanswered = questions.length - Object.keys(userAnswers).length;
        UI.confirm(unanswered > 0 ? `还有 ${unanswered} 道题未作答，确定要交卷吗？` : '确定要交卷吗？', () => { this.submit(); });
    },
    submit() {
        if (this.state.submitted) return;
        if (this.state.timerInterval) clearInterval(this.state.timerInterval);
        this.state.submitted = true;
        const { questions, userAnswers, startTime, scorePerType, bankId, duration } = this.state;
        const usedTime = duration - this.state.remainingTime;
        let correctCount = 0, wrongCount = 0, totalScore = 0;
        questions.forEach(q => {
            const userAnswer = userAnswers[q.id];
            const isCorrect = this._checkAnswer(q, userAnswer);
            if (isCorrect === true) { correctCount++; totalScore += scorePerType[q.type] || 0; }
            else if (isCorrect === false) { wrongCount++; const settings = Storage.getSettings(); if (settings.autoAddWrong) Storage.addWrongQuestion(q.id, q.bankId); }
        });
        const bank = Storage.getBankById(bankId);
        const record = { id: Utils.generateId('r'), type: 'exam', bankId, bankName: bank ? bank.name : '未知题库', totalQuestions: questions.length, correctCount, wrongCount, duration: usedTime, score: Math.round(totalScore), createdAt: Date.now(), items: questions.map(q => ({ questionId: q.id, userAnswer: userAnswers[q.id] !== undefined ? userAnswers[q.id] : null, isCorrect: this._checkAnswer(q, userAnswers[q.id]), timeSpent: 0 })) };
        Storage.addRecord(record);
        this.state.recordId = record.id;
        this.render();
    },
    _checkAnswer(question, userAnswer) {
        if (userAnswer === undefined || userAnswer === null) return false;
        const correctAnswer = question.answer;
        if (question.type === 'judge') return userAnswer === correctAnswer;
        if (question.type === 'single') return userAnswer === correctAnswer;
        if (question.type === 'multiple') {
            const userArr = Array.isArray(userAnswer) ? [...userAnswer].sort() : [userAnswer];
            const correctArr = Array.isArray(correctAnswer) ? [...correctAnswer].sort() : [correctAnswer];
            return JSON.stringify(userArr) === JSON.stringify(correctArr);
        }
        if (question.type === 'fill') {
            const userArr = Array.isArray(userAnswer) ? userAnswer : [userAnswer];
            const correctArr = Array.isArray(correctAnswer) ? correctAnswer : [correctAnswer];
            if (userArr.length !== correctArr.length) return false;
            return correctArr.every((correct, idx) => { const userVal = userArr[idx] || ''; return userVal.trim().toLowerCase() === correct.trim().toLowerCase(); });
        }
        if (question.type === 'essay') return null;
        return false;
    },
    showResult() { if (!this.state.recordId) return; app.navigate('record', this.state.recordId); },
    cleanup() { if (this.state.timerInterval) { clearInterval(this.state.timerInterval); this.state.timerInterval = null; } }
};

const WrongBook = {
    state: { filterBankId: 'all', filterType: 'all', showMastered: false },
    render() {
        const wrongQuestions = Storage.getWrongQuestions();
        const banks = Storage.getBanks();
        const filteredWrong = this._filterWrong(wrongQuestions);
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="page-header">
                <h1 class="page-title">📕 错题本</h1>
                <p class="page-subtitle">共 ${wrongQuestions.filter(w => !w.mastered).length} 道错题待复习</p>
            </div>
            <div class="wrong-filter-bar">
                <select class="filter-select" onchange="WrongBook.setBankFilter(this.value)">
                    <option value="all" ${this.state.filterBankId === 'all' ? 'selected' : ''}>全部题库</option>
                    ${banks.map(b => `<option value="${b.id}" ${this.state.filterBankId === b.id ? 'selected' : ''}>${Utils.escapeHtml(b.name)}</option>`).join('')}
                </select>
                <select class="filter-select" onchange="WrongBook.setTypeFilter(this.value)">
                    <option value="all" ${this.state.filterType === 'all' ? 'selected' : ''}>全部题型</option>
                    <option value="single" ${this.state.filterType === 'single' ? 'selected' : ''}>单选题</option>
                    <option value="multiple" ${this.state.filterType === 'multiple' ? 'selected' : ''}>多选题</option>
                    <option value="judge" ${this.state.filterType === 'judge' ? 'selected' : ''}>判断题</option>
                    <option value="fill" ${this.state.filterType === 'fill' ? 'selected' : ''}>填空题</option>
                    <option value="essay" ${this.state.filterType === 'essay' ? 'selected' : ''}>简答题</option>
                </select>
                <label style="display:flex;align-items:center;gap:6px;font-size:14px;color:var(--color-text-secondary);cursor:pointer;">
                    <input type="checkbox" ${this.state.showMastered ? 'checked' : ''} onchange="WrongBook.toggleMastered(this.checked)">显示已掌握
                </label>
            </div>
            ${filteredWrong.length === 0 ? `
                <div class="empty-state"><div class="empty-state-icon">🎉</div><div class="empty-state-title">暂无错题</div><div class="empty-state-desc">${wrongQuestions.length === 0 ? '继续刷题，错题会自动收录到这里' : '当前筛选条件下没有错题'}</div></div>
            ` : `
                <div style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;">
                    <span style="color:var(--color-text-secondary);font-size:14px;">共 ${filteredWrong.length} 道错题</span>
                    <div style="display:flex;gap:8px;">
                        <button class="btn btn-primary btn-sm" onclick="WrongBook.startPractice()">开始错题练习</button>
                        <button class="btn btn-error btn-sm" onclick="WrongBook.clearAll()">清空全部</button>
                    </div>
                </div>
                <div class="question-list">${filteredWrong.map((w, idx) => {
                    const question = Storage.getQuestionById(w.questionId);
                    if (!question) return '';
                    const bank = Storage.getBankById(w.bankId);
                    return `
                        <div class="wrong-question-item ${w.mastered ? 'mastered' : ''}">
                            <div class="wrong-question-header">
                                <span class="question-index" style="width:24px;height:24px;font-size:12px;">${idx + 1}</span>
                                <div style="display:flex;gap:8px;align-items:center;">
                                    <span class="question-list-type">${Utils.getQuestionTypeName(question.type)}</span>
                                    <span class="wrong-count">错 ${w.wrongCount} 次</span>
                                    ${w.mastered ? '<span style="font-size:12px;color:var(--color-success);background:var(--color-success-light);padding:2px 8px;border-radius:var(--radius-full);">已掌握</span>' : ''}
                                </div>
                            </div>
                            <div class="wrong-question-text">${Utils.escapeHtml(question.question)}</div>
                            <div class="wrong-question-meta">
                                <span>📚 ${bank ? Utils.escapeHtml(bank.name) : '未知题库'}</span>
                                <span>🕐 ${Utils.formatDate(w.lastWrongAt, 'MM-DD HH:mm')}</span>
                            </div>
                            <div style="margin-top:12px;display:flex;gap:8px;">
                                ${!w.mastered ? `<button class="btn btn-secondary btn-sm" onclick="WrongBook.markMastered('${w.questionId}', true)">标记掌握</button>` : `<button class="btn btn-secondary btn-sm" onclick="WrongBook.markMastered('${w.questionId}', false)">取消掌握</button>`}
                                <button class="btn btn-outline btn-sm" onclick="WrongBook.viewQuestion('${w.questionId}')">查看详情</button>
                                <button class="btn btn-error btn-sm" onclick="WrongBook.deleteOne('${w.questionId}')">删除</button>
                            </div>
                        </div>`;
                }).join('')}</div>
            `}`;
    },
    _filterWrong(wrongQuestions) {
        let filtered = [...wrongQuestions];
        if (this.state.filterBankId !== 'all') filtered = filtered.filter(w => w.bankId === this.state.filterBankId);
        if (this.state.filterType !== 'all') {
            const questions = Storage.getQuestions();
            filtered = filtered.filter(w => {
                const q = questions.find(q => q.id === w.questionId);
                return q && q.type === this.state.filterType;
            });
        }
        if (!this.state.showMastered) filtered = filtered.filter(w => !w.mastered);
        return filtered;
    },
    setBankFilter(bankId) { this.state.filterBankId = bankId; this.render(); },
    setTypeFilter(type) { this.state.filterType = type; this.render(); },
    toggleMastered(show) { this.state.showMastered = show; this.render(); },
    markMastered(questionId, mastered) {
        Storage.markWrongMastered(questionId, mastered);
        UI.toast(mastered ? '已标记为掌握' : '已取消掌握', 'success');
        this.render();
    },
    deleteOne(questionId) {
        UI.confirm('确定要从错题本中删除这道题吗？', () => {
            Storage.deleteWrongQuestion(questionId);
            UI.toast('错题已删除', 'success');
            this.render();
        });
    },
    clearAll() {
        const total = Storage.getWrongQuestions().length;
        if (total === 0) { UI.toast('错题本已为空', 'info'); return; }
        UI.confirm(`确定要清空全部 ${total} 道错题吗？此操作不可恢复！`, () => {
            Storage.deleteAllWrongQuestions();
            UI.toast('错题本已清空', 'success');
            this.render();
        });
    },
    viewQuestion(questionId) {
        const question = Storage.getQuestionById(questionId);
        if (!question) { UI.toast('题目不存在', 'error'); return; }
        UI.showModal({
            title: '题目详情',
            content: `
                <div style="margin-bottom:12px;"><span class="question-list-type">${Utils.getQuestionTypeName(question.type)}</span></div>
                <div style="font-size:15px;line-height:1.6;margin-bottom:16px;">${Utils.escapeHtml(question.question)}</div>
                ${question.options && question.options.length > 0 ? `<div style="margin-bottom:16px;">${question.options.map((opt, idx) => `<div style="padding:4px 0;font-size:14px;"><strong>${String.fromCharCode(65 + idx)}.</strong> ${Utils.escapeHtml(opt.replace(/^[A-Z][.、．)]\s*/, ''))}</div>`).join('')}</div>` : ''}
                <div style="margin-bottom:12px;padding:12px;background:var(--color-success-light);border-radius:var(--radius-md);"><strong style="color:var(--color-success);">答案：</strong><span style="color:var(--color-success);">${this._formatAnswer(question)}</span></div>
                ${question.explanation ? `<div style="font-size:14px;color:var(--color-text-secondary);line-height:1.6;"><strong>解析：</strong>${Utils.escapeHtml(question.explanation)}</div>` : ''}`,
            showCancel: false, confirmText: '知道了'
        });
    },
    _formatAnswer(question) {
        if (question.type === 'judge') return question.answer ? '正确' : '错误';
        if (Array.isArray(question.answer)) return question.answer.join(' / ');
        return question.answer;
    },
    startPractice() {
        const wrongQuestions = this._filterWrong(Storage.getWrongQuestions());
        if (wrongQuestions.length === 0) { UI.toast('没有可练习的错题', 'warning'); return; }
        PracticeMode.startFromWrong(wrongQuestions);
    }
};

                    <div class="record-detail-item ${isCorrect ? 'correct' : isCorrect === false ? 'wrong' : ''}">
                        <div style="display:flex;gap:12px;margin-bottom:12px;">
                            <span class="question-index">${idx + 1}</span>
                            <span class="question-list-type">${Utils.getQuestionTypeName(question.type)}</span>
                            ${isCorrect === true ? '<span style="color:var(--color-success);font-weight:600;font-size:13px;">✓ 正确</span>' : isCorrect === false ? '<span style="color:var(--color-error);font-weight:600;font-size:13px;">✗ 错误</span>' : '<span style="color:var(--color-text-muted);font-size:13px;">简答题</span>'}
                        </div>
                        <div class="record-question-text">${Utils.escapeHtml(question.question)}</div>
                        ${question.options && question.options.length > 0 ? `
                            <div style="margin:12px 0;padding-left:24px;">
                                ${question.options.map((opt, oIdx) => {
                                    const letter = String.fromCharCode(65 + oIdx);
                                    const correctAnswer = question.answer;
                                    const userAnswer = item.userAnswer;
                                    let style = 'color:var(--color-text-secondary);';
                                    const isCorrectAnswer = Array.isArray(correctAnswer) ? correctAnswer.includes(letter) : correctAnswer === letter;
                                    const isUserAnswer = Array.isArray(userAnswer) ? userAnswer.includes(letter) : userAnswer === letter;
                                    if (isCorrectAnswer) style = 'color:var(--color-success);font-weight:600;';
                                    else if (isUserAnswer && !isCorrectAnswer) style = 'color:var(--color-error);';
                                    return `<div style="padding:4px 0;font-size:14px;${style}">${Utils.escapeHtml(opt)}</div>`;
                                }).join('')}
                            </div>
                        ` : ''}
                        <div class="record-answer-row"><span class="record-answer-label">你的答案：</span><span class="record-user-answer">${this._formatUserAnswer(question, item.userAnswer)}</span></div>
                        <div class="record-answer-row"><span class="record-answer-label">正确答案：</span><span class="record-correct-answer">${this._formatCorrectAnswer(question)}</span></div>
                        ${question.explanation ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--color-border-light);"><div style="font-size:13px;font-weight:600;color:var(--color-text-secondary);margin-bottom:6px;">📖 解析</div><div style="font-size:14px;color:var(--color-text-secondary);line-height:1.6;">${Utils.escapeHtml(question.explanation)}</div></div>` : ''}
                    </div>`;
            }).join('')}</div>`;
    },
    _getTypeName(type) { const typeMap = { practice: '练习', exam: '考试', 'wrong-practice': '错题练习' }; return typeMap[type] || '刷题'; },
    _formatUserAnswer(question, userAnswer) {
        if (userAnswer === null || userAnswer === undefined || userAnswer === '') return '<span style="color:var(--color-text-muted);">未作答</span>';
        if (question.type === 'judge') return userAnswer ? '正确' : '错误';
        if (question.type === 'single') return userAnswer;
        if (question.type === 'multiple') return Array.isArray(userAnswer) ? userAnswer.join('、') : userAnswer;
        if (question.type === 'fill' || question.type === 'essay') return Array.isArray(userAnswer) ? userAnswer.join(', ') : userAnswer;
        return String(userAnswer);
    },
    _formatCorrectAnswer(question) {
        const answer = question.answer;
        if (question.type === 'judge') return answer ? '正确' : '错误';
        if (question.type === 'single') return answer;
        if (question.type === 'multiple') return Array.isArray(answer) ? answer.join('、') : answer;
        if (question.type === 'fill' || question.type === 'essay') return Array.isArray(answer) ? answer.join(' / ') : answer;
        return String(answer);
    }
};
