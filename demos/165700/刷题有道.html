            const bankNameInput = document.getElementById('bank-name');
            if (!bankNameInput.value) bankNameInput.value = file.name.replace(/\.[^/.]+$/, '');
            UI.toast('文件读取成功', 'success');
        } catch (e) { UI.toast('文件读取失败', 'error'); }
    },
    _previewImport() {
        const text = document.getElementById('import-text').value.trim();
        if (!text) { UI.toast('请输入或粘贴题目内容', 'warning'); return; }
        try {
            const { questions, format } = Importer.autoDetectAndParse(text);
            if (questions.length === 0) { UI.toast('未识别到有效题目', 'warning'); return; }
            const typeStats = {};
            questions.forEach(q => { typeStats[q.type] = (typeStats[q.type] || 0) + 1; });
            const previewHtml = `
                <div class="preview-section">
                    <div class="preview-header">
                        <h3>预览识别结果</h3>
                        <div class="preview-stats">
                            <span class="preview-stat">📄 格式：${format === 'json' ? 'JSON' : '文本'}</span>
                            <span class="preview-stat">📝 共 ${questions.length} 题</span>
                            ${Object.entries(typeStats).map(([type, count]) => `<span class="preview-stat">${Utils.getQuestionTypeName(type)} ${count} 题</span>`).join('')}
                        </div>
                    </div>
                    <div class="question-preview-list">${questions.slice(0, 20).map((q, idx) => `
                        <div class="question-preview-item">
                            <div class="preview-item-header"><span class="preview-question-number">${idx + 1}</span><span class="preview-question-type">${Utils.getQuestionTypeName(q.type)}</span></div>
                            <div class="preview-question-text">${Utils.escapeHtml(q.question)}</div>
                            ${q.options && q.options.length > 0 ? `<div class="preview-options">${q.options.map((opt, oIdx) => `<div class="preview-option">${String.fromCharCode(65 + oIdx)}. ${Utils.escapeHtml(opt.replace(/^[A-Z][.、．)]\s*/, ''))}</div>`).join('')}</div>` : ''}
                            <div class="preview-answer">答案：${this._formatPreviewAnswer(q)}</div>
                        </div>
                    `).join('')}${questions.length > 20 ? `<div style="text-align:center;padding:16px;color:var(--color-text-muted);">还有 ${questions.length - 20} 道题...</div>` : ''}</div>
                </div>`;
            document.getElementById('preview-container').innerHTML = previewHtml;
            UI.toast(`成功识别 ${questions.length} 道题`, 'success');
        } catch (e) { UI.toast(`解析失败：${e.message}`, 'error'); }
    },
    _formatPreviewAnswer(question) {
        if (question.type === 'judge') return question.answer ? '正确' : '错误';
        if (Array.isArray(question.answer)) return question.answer.join(' / ');
        return question.answer || '无';
    },
    _confirmImport() {
        const name = document.getElementById('bank-name').value.trim();
        const description = document.getElementById('bank-description').value.trim();
        const text = document.getElementById('import-text').value.trim();
        if (!name) { UI.toast('请输入题库名称', 'warning'); return; }
        if (!text) { UI.toast('请输入或粘贴题目内容', 'warning'); return; }
        try {
            const { questions } = Importer.autoDetectAndParse(text);
            if (questions.length === 0) { UI.toast('未识别到有效题目', 'warning'); return; }
            BankManager.importBank(name, description, questions);
            UI.toast(`成功导入 ${questions.length} 道题`, 'success');
            this.navigate('banks');
        } catch (e) { UI.toast(`导入失败：${e.message}`, 'error'); }
    },
    renderBankDetail(bankId) {
        const bank = Storage.getBankById(bankId);
        if (!bank) { UI.toast('题库不存在', 'error'); this.navigate('banks'); return; }
        const questions = Storage.getQuestionsByBank(bankId);
        const typeStats = BankManager.getTypeStats(bankId);
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="bank-detail-header">
                <div class="bank-detail-info">
                    <h2>${Utils.escapeHtml(bank.name)}</h2>
                    <p>${Utils.escapeHtml(bank.description || '暂无描述')}</p>
                    <div class="bank-detail-stats">
                        <span>📝 ${questions.length} 题</span>
                        <span>🕐 ${Utils.formatDate(bank.updatedAt || bank.createdAt)}</span>
                        ${Object.entries(typeStats).filter(([, count]) => count > 0).map(([type, count]) => `<span>${Utils.getQuestionTypeName(type)} ${count} 题</span>`).join('')}
                    </div>
                </div>
                <div class="bank-detail-actions">
                    <button class="btn btn-primary" onclick="PracticeMode.start('${bankId}')">开始练习</button>
                    <button class="btn btn-secondary" onclick="ExamMode.showSetup('${bankId}')">模拟考试</button>
                </div>
            </div>
            <div class="section-header"><h2 class="section-title">题目列表</h2><button class="btn btn-error btn-sm" onclick="BankManager.deleteBank('${bankId}')">删除题库</button></div>
            <div class="search-bar" style="margin-bottom:16px;"><input type="text" class="search-input" placeholder="搜索题目..." id="question-search" oninput="app._filterQuestions('${bankId}', this.value)"></div>
            <div id="question-list-container">${this._renderQuestionList(questions)}</div>`;
    },
    _renderQuestionList(questions) {
        if (questions.length === 0) return `<div class="empty-state"><div class="empty-state-icon">📝</div><div class="empty-state-title">暂无题目</div></div>`;
        return `<div class="question-list">${questions.map((q, idx) => `
            <div class="question-list-item">
                <span class="question-index">${idx + 1}</span>
                <div class="question-content">
                    <div class="question-list-text">${Utils.escapeHtml(q.question)}</div>
                    <div class="question-list-meta"><span class="question-list-type">${Utils.getQuestionTypeName(q.type)}</span></div>
                </div>
                <div class="question-list-actions"><button class="icon-btn" onclick="Storage.deleteQuestion('${q.id}');app.renderBankDetail('${q.bankId}');" title="删除">🗑️</button></div>
            </div>
        `).join('')}</div>`;
    },
    _filterQuestions(bankId, keyword) {
        const questions = Storage.getQuestionsByBank(bankId);
        const filtered = keyword ? questions.filter(q => q.question.toLowerCase().includes(keyword.toLowerCase())) : questions;
        document.getElementById('question-list-container').innerHTML = this._renderQuestionList(filtered);
    },
    renderSettings() {
        const banks = Storage.getBanks();
        const questions = Storage.getQuestions();
        const records = Storage.getRecords();
        const wrongQuestions = Storage.getWrongQuestions();
        const settings = Storage.getSettings();
        const main = document.getElementById('main-content');
        main.innerHTML = `
            <div class="page-header"><h1 class="page-title">⚙️ 设置</h1></div>
            <div class="settings-container">
                <div class="settings-section">
                    <h3 class="settings-section-title">📊 数据统计</h3>
                    <div class="settings-item"><div><div class="settings-item-label">题库数量</div><div class="settings-item-desc">已创建的题库总数</div></div><span style="font-size:20px;font-weight:700;color:var(--color-primary);">${banks.length}</span></div>
                    <div class="settings-item"><div><div class="settings-item-label">题目总数</div><div class="settings-item-desc">所有题库中的题目总数</div></div><span style="font-size:20px;font-weight:700;color:var(--color-primary);">${questions.length}</span></div>
                    <div class="settings-item"><div><div class="settings-item-label">刷题记录</div><div class="settings-item-desc">历史刷题和考试记录</div></div><span style="font-size:20px;font-weight:700;color:var(--color-primary);">${records.length}</span></div>
                    <div class="settings-item"><div><div class="settings-item-label">错题数量</div><div class="settings-item-desc">收录的错题总数</div></div><span style="font-size:20px;font-weight:700;color:var(--color-error);">${wrongQuestions.length}</span></div>
                </div>
                <div class="settings-section">
                    <h3 class="settings-section-title">🔧 偏好设置</h3>
                    <div class="settings-item"><div><div class="settings-item-label">自动添加错题</div><div class="settings-item-desc">答错时自动加入错题本</div></div><label style="position:relative;display:inline-block;width:44px;height:24px;cursor:pointer;"><input type="checkbox" id="auto-add-wrong" ${settings.autoAddWrong ? 'checked' : ''} style="opacity:0;width:0;height:0;" onchange="app._updateSetting('autoAddWrong', this.checked)"><span style="position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:${settings.autoAddWrong ? 'var(--color-primary)' : 'var(--color-border)'};border-radius:var(--radius-full);transition:0.3s;"><span style="position:absolute;content:'';height:18px;width:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:0.3s;transform:${settings.autoAddWrong ? 'translateX(20px)' : 'translateX(0)'};"></span></span></label></div>
                    <div class="settings-item"><div><div class="settings-item-label">默认练习模式</div><div class="settings-item-desc">选择练习时的默认出题方式</div></div><select class="form-select" style="width:auto;" onchange="app._updateSetting('defaultPracticeMode', this.value)"><option value="random" ${settings.defaultPracticeMode === 'random' ? 'selected' : ''}>随机顺序</option><option value="sequential" ${settings.defaultPracticeMode === 'sequential' ? 'selected' : ''}>顺序练习</option></select></div>
                </div>
                <div class="settings-section">
                    <h3 class="settings-section-title">💾 数据管理</h3>
                    <div class="settings-item"><div><div class="settings-item-label">导出数据</div><div class="settings-item-desc">将所有数据导出为 JSON 文件备份</div></div><button class="btn btn-secondary btn-sm" onclick="app._exportData()">导出</button></div>
                    <div class="settings-item"><div><div class="settings-item-label">导入数据</div><div class="settings-item-desc">从 JSON 文件恢复数据</div></div><label class="btn btn-secondary btn-sm" style="cursor:pointer;"><input type="file" accept=".json" style="display:none;" onchange="app._importData(event)">导入</label></div>
                    <div class="settings-item"><div><div class="settings-item-label">清除所有数据</div><div class="settings-item-desc">删除所有题库、记录和设置，此操作不可恢复</div></div><button class="btn btn-error btn-sm" onclick="app._clearAllData()">清除</button></div>
                </div>
                <div class="settings-section">
                    <h3 class="settings-section-title">ℹ️ 关于</h3>
                    <div style="text-align:center;padding:20px;">
                        <div style="font-size:48px;margin-bottom:12px;">📚</div>
                        <div style="font-size:20px;font-weight:700;margin-bottom:8px;">刷题有道</div>
                        <div style="color:var(--color-text-secondary);font-size:14px;">刷题练习与考试复习</div>
                        <div style="margin-top:16px;color:var(--color-text-muted);font-size:13px;">版本 1.0</div>
                    </div>
                </div>
            </div>`;
    },
    _updateSetting(key, value) {
        const settings = Storage.getSettings();
        settings[key] = value;
        Storage.saveSettings(settings);
        UI.toast('设置已保存', 'success');
        this.renderSettings();
    },
    _exportData() {
        const data = Storage.exportAllData();
        const json = JSON.stringify(data, null, 2);
        Utils.downloadFile(json, `刷题有道数据备份_${Utils.formatDate(Date.now(), 'YYYY-MM-DD')}.json`);
        UI.toast('数据已导出', 'success');
    },
    async _importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        try {
            const text = await Utils.readFileAsText(file);
            const data = JSON.parse(text);
            UI.confirm('导入数据将合并到现有数据中，是否继续？', () => {
                Storage.importAllData(data, true);
                UI.toast('数据导入成功', 'success');
                this.navigate('home');
            });
        } catch (e) { UI.toast('数据导入失败', 'error'); }
    },
    _clearAllData() {
        UI.confirm('确定要清除所有数据吗？此操作不可恢复！', () => {
            Storage.clearAllData();
            UI.toast('所有数据已清除', 'success');
            this.navigate('home');
        });
    }
};

document.addEventListener('DOMContentLoaded', () => { app.init(); });
    </script>
</body>
</html>
