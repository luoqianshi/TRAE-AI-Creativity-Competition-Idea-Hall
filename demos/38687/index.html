<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勾股定理寻宝闯关 - 初中数学趣味游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 0.9em;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #495057;
        }

        .keys-display {
            color: #ffc107;
        }

        .content {
            padding: 30px;
            min-height: 500px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .map-container {
            text-align: center;
        }

        .map-title {
            font-size: 1.8em;
            color: #495057;
            margin-bottom: 30px;
        }

        .castle-map {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .room-card {
            background: white;
            border: 3px solid #dee2e6;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .room-card:hover:not(.locked) {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .room-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
            background: #e9ecef;
        }

        .room-card.completed {
            border-color: #28a745;
            background: #d4edda;
        }

        .room-card.current {
            border-color: #ffc107;
            background: #fff3cd;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(255, 193, 7, 0); }
        }

        .room-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .room-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #495057;
            margin-bottom: 5px;
        }

        .room-status {
            font-size: 0.9em;
            color: #6c757d;
        }

        .question-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .question-number {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
        }

        .room-keys-progress {
            font-size: 1em;
            color: #ffc107;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.3em;
            color: #495057;
            margin-bottom: 30px;
            line-height: 1.6;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .geometry-canvas {
            display: block;
            margin: 20px auto;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            background: white;
        }

        .answer-section {
            margin-top: 30px;
        }

        .answer-input {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .answer-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .feedback.correct {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .feedback.incorrect {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .hint-box {
            margin-top: 15px;
            padding: 15px;
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            display: none;
        }

        .hint-box.show {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
        }

        .victory-screen {
            text-align: center;
            padding: 40px;
        }

        .trophy {
            font-size: 5em;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .victory-title {
            font-size: 2.5em;
            color: #28a745;
            margin-bottom: 20px;
        }

        .victory-message {
            font-size: 1.3em;
            color: #495057;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #6c757d;
            margin-top: 5px;
        }

        .wrong-answers {
            margin-top: 30px;
            text-align: left;
        }

        .wrong-item {
            background: #f8d7da;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border-left: 4px solid #dc3545;
        }

        .start-screen {
            text-align: center;
            padding: 40px;
        }

        .start-title {
            font-size: 2em;
            color: #495057;
            margin-bottom: 20px;
        }

        .start-description {
            font-size: 1.2em;
            color: #6c757d;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .feature-list {
            text-align: left;
            max-width: 500px;
            margin: 30px auto;
        }

        .feature-item {
            padding: 10px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            align-items: center;
        }

        .feature-icon {
            font-size: 1.5em;
            margin-right: 15px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }
            
            .castle-map {
                grid-template-columns: 1fr;
            }
            
            .question-text {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🏰 勾股定理寻宝闯关</h1>
            <p>初中数学四边形+勾股定理趣味练习</p>
        </div>

        <div class="game-info">
            <div class="info-item">
                <div class="info-label">当前关卡</div>
                <div class="info-value" id="currentLevel">准备出发</div>
            </div>
            <div class="info-item">
                <div class="info-label">已获钥匙</div>
                <div class="info-value keys-display" id="totalKeys">🔑 0</div>
            </div>
            <div class="info-item">
                <div class="info-label">答题进度</div>
                <div class="info-value" id="progress">0/10</div>
            </div>
        </div>

        <div class="content">
            <!-- 开始界面 -->
            <div class="screen active" id="startScreen">
                <div class="start-screen">
                    <div style="font-size: 4em; margin-bottom: 20px;">️</div>
                    <h2 class="start-title">欢迎来到数学宝藏城堡！</h2>
                    <p class="start-description">
                        你将穿越5个神秘房间，运用四边形知识和勾股定理解开谜题。<br>
                        每答对一题获得一把钥匙，集齐所有钥匙即可找到终极宝藏！
                    </p>
                    
                    <div class="feature-list">
                        <div class="feature-item">
                            <span class="feature-icon">📐</span>
                            <span>掌握矩形、菱形、梯形的性质</span>
                        </div>
                        <div class="feature-item">
                            <span class="feature-icon">✨</span>
                            <span>灵活运用勾股定理求解边长</span>
                        </div>
                        <div class="feature-item">
                            <span class="feature-icon">🎯</span>
                            <span>10道精心设计的闯关题目</span>
                        </div>
                        <div class="feature-item">
                            <span class="feature-icon">🏆</span>
                            <span>通关获得「四边形小勇士」称号</span>
                        </div>
                    </div>

                    <button class="btn btn-primary" onclick="startGame()" style="margin-top: 30px; font-size: 1.3em; padding: 20px 40px;">
                        🚀 开始冒险
                    </button>
                </div>
            </div>

            <!-- 地图界面 -->
            <div class="screen" id="mapScreen">
                <div class="map-container">
                    <h2 class="map-title">🗺️ 城堡地图</h2>
                    <div class="progress-bar">
                        <div class="progress-fill" id="mapProgress" style="width: 0%"></div>
                    </div>
                    <div class="castle-map" id="castleMap">
                        <!-- 动态生成房间卡片 -->
                    </div>
                </div>
            </div>

            <!-- 答题界面 -->
            <div class="screen" id="questionScreen">
                <div class="question-container">
                    <div class="question-header">
                        <span class="question-number" id="questionNumber">第 1 题</span>
                        <span class="room-keys-progress" id="roomKeysProgress">🔑 0/2</span>
                    </div>
                    
                    <div class="question-text" id="questionText"></div>
                    
                    <canvas id="geometryCanvas" class="geometry-canvas" width="400" height="300"></canvas>
                    
                    <div class="answer-section">
                        <form onsubmit="event.preventDefault(); submitAnswer();">
                            <input type="text" 
                                   class="answer-input" 
                                   id="answerInput" 
                                   placeholder="请输入你的答案（数字）"
                                   inputmode="decimal"
                                   autocomplete="off">
                            
                            <div style="text-align: center;">
                                <button type="submit" class="btn btn-primary">✅ 提交答案</button>
                                <button type="button" class="btn btn-secondary" onclick="showHint()">💡 提示</button>
                                <button type="button" class="btn btn-secondary" onclick="backToMap()">️ 返回地图</button>
                            </div>
                        </form>
                    </div>

                    <div class="hint-box" id="hintBox">
                        <strong>💡 解题思路：</strong>
                        <span id="hintText"></span>
                    </div>

                    <div class="feedback" id="feedback">
                        <strong id="feedbackTitle"></strong>
                        <p id="feedbackMessage"></p>
                        <div id="explanation" style="margin-top: 10px;"></div>
                        <button class="btn btn-success" id="nextBtn" onclick="nextQuestion()" style="display: none;">
                            下一题 ➡️
                        </button>
                    </div>
                </div>
            </div>

            <!-- 胜利界面 -->
            <div class="screen" id="victoryScreen">
                <div class="victory-screen">
                    <div class="trophy">🏆</div>
                    <h2 class="victory-title">恭喜通关！</h2>
                    <p class="victory-message">
                        你已成功找到宝藏，获得<strong>「四边形小勇士」</strong>称号！
                    </p>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value" id="finalScore">10</div>
                            <div class="stat-label">总答题数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="correctCount">0</div>
                            <div class="stat-label">正确次数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="accuracy">0%</div>
                            <div class="stat-label">正确率</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="timeUsed">0分</div>
                            <div class="stat-label">用时</div>
                        </div>
                    </div>

                    <div class="wrong-answers" id="wrongAnswersSection" style="display: none;">
                        <h3 style="margin-bottom: 15px; color: #dc3545;">📝 错题回顾</h3>
                        <div id="wrongAnswersList"></div>
                    </div>

                    <div style="margin-top: 30px;">
                        <button class="btn btn-primary" onclick="restartGame()">🔄 再玩一次</button>
                        <button class="btn btn-secondary" onclick="reviewWrongAnswers()">📖 复习错题</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 游戏数据
        const gameData = {
            rooms: [
                {
                    id: 'entrance',
                    name: '城堡入口',
                    icon: '🏰',
                    description: '起点',
                    questions: [],
                    requiredKeys: 0,
                    completed: true
                },
                {
                    id: 'rectangle',
                    name: '矩形房间',
                    icon: '▭',
                    description: '需要2把钥匙',
                    requiredKeys: 2,
                    completed: false,
                    questions: [
                        {
                            id: 1,
                            text: '矩形的长为6，宽为8，它的对角线长度是多少？',
                            answer: 10,
                            hint: '矩形的对角线与长、宽构成直角三角形，使用勾股定理：a² + b² = c²',
                            explanation: '解：对角线 = (6² + 8²) = √(36 + 64) = √100 = 10',
                            drawType: 'rectangle'
                        },
                        {
                            id: 2,
                            text: '正方形的边长为5，它的对角线长度是多少？',
                            answer: 7.07,
                            tolerance: 0.1,
                            hint: '正方形是特殊的矩形，两条边相等。对角线 = 边长 × √2',
                            explanation: '解：对角线 = √(5² + 5²) = √50 ≈ 7.07（或 5√2）',
                            drawType: 'square'
                        }
                    ]
                },
                {
                    id: 'rhombus',
                    name: '菱形房间',
                    icon: '◇',
                    description: '需要2把钥匙',
                    requiredKeys: 2,
                    completed: false,
                    questions: [
                        {
                            id: 3,
                            text: '菱形的两条对角线长分别为6和8，它的边长是多少？',
                            answer: 5,
                            hint: '菱形的对角线互相垂直平分，每条对角线的一半与边长构成直角三角形',
                            explanation: '解：对角线一半分别为3和4，边长 = √(3² + 4²) = √25 = 5',
                            drawType: 'rhombus'
                        },
                        {
                            id: 4,
                            text: '菱形的周长为20，一条对角线长为6，另一条对角线的一半是多少？',
                            answer: 4,
                            hint: '先求边长（周长÷4），再用勾股定理求另一条对角线的一半',
                            explanation: '解：边长=20÷4=5，对角线一半=3，另一半 = √(5² - 3²) = √16 = 4',
                            drawType: 'rhombus'
                        }
                    ]
                },
                {
                    id: 'trapezoid',
                    name: '直角梯形房间',
                    icon: '⏢',
                    description: '需要2把钥匙',
                    requiredKeys: 2,
                    completed: false,
                    questions: [
                        {
                            id: 5,
                            text: '直角梯形的高为3，上底为1，下底为5，斜腰的长度是多少？',
                            answer: 5,
                            hint: '过上底端点作高，构造直角三角形。直角三角形的两条直角边分别是高和下底减上底的差',
                            explanation: '解：水平距离 = 5 - 1 = 4，高 = 3\n斜腰 = √(3² + 4²) = √(9 + 16) = √25 = 5',
                            drawType: 'trapezoid'
                        },
                        {
                            id: 6,
                            text: '直角梯形ABCD中，AD//BC，∠B=90°，AD=2，BC=5，CD=5，求高AB的长度。',
                            answer: 4,
                            hint: '过D作DEBC于E，则DE=AB，CE=BC-AD=3，在Rt△CDE中使用勾股定理',
                            explanation: '解：CE = 5 - 2 = 3，在Rt△CDE中，DE = √(CD² - CE²) = √(25 - 9) = √16 = 4\n所以 AB = DE = 4',
                            drawType: 'trapezoid'
                        }
                    ]
                },
                {
                    id: 'advanced',
                    name: '进阶线索',
                    icon: '⭐',
                    description: '需要2把钥匙',
                    requiredKeys: 2,
                    completed: false,
                    questions: [
                        {
                            id: 7,
                            text: '平行四边形的对角线AC=10，BD=12，两条对角线的一半与一边构成三角形，求三角形两条固定边长。（用逗号分隔）',
                            answer: '5,6',
                            isMultiple: true,
                            hint: '平行四边形的对角线互相平分，所以两条对角线的一半分别是5和6',
                            explanation: '解：AC的一半 = 10÷2 = 5，BD的一半 = 12÷2 = 6\n所以三角形的两条固定边长为 5 和 6',
                            drawType: 'parallelogram'
                        },
                        {
                            id: 8,
                            text: '矩形纸片ABCD，AB=8，BC=10，折叠使点D落在BC边的F处，求BF的长度。',
                            answer: 6,
                            hint: '折叠后AF=AD=10，在Rt△ABF中使用勾股定理',
                            explanation: '解：折叠后AF=AD=10\n在Rt△ABF中：AF² = AB² + BF²\n10² = 8² + BF²\nBF² = 100 - 64 = 36\nBF = 6',
                            drawType: 'fold'
                        }
                    ]
                },
                {
                    id: 'treasure',
                    name: '宝藏屋',
                    icon: '💎',
                    description: '终极挑战',
                    requiredKeys: 2,
                    completed: false,
                    questions: [
                        {
                            id: 9,
                            text: '菱形ABCD中，对角线AC=16，BD=12，求菱形的高。',
                            answer: 9.6,
                            tolerance: 0.1,
                            hint: '先求菱形面积（对角线乘积的一半），再求边长，最后用面积=底×高求高',
                            explanation: '解：菱形面积 = (16 × 12) ÷ 2 = 96\n边长 = √(8² + 6²) = √100 = 10\n高 = 面积 ÷ 边长 = 96 ÷ 10 = 9.6',
                            drawType: 'rhombus'
                        },
                        {
                            id: 10,
                            text: '直角梯形的斜腰为13，高为12，上底长为5，求下底长。',
                            answer: 10,
                            hint: '构造直角三角形，已知斜腰和高，求水平距离，再加到上底上',
                            explanation: '解：水平距离 = √(13² - 12²) = √(169 - 144) = √25 = 5\n下底 = 上底 + 水平距离 = 5 + 5 = 10',
                            drawType: 'trapezoid'
                        }
                    ]
                }
            ]
        };

        // 游戏状态
        let gameState = {
            currentRoomIndex: 0,
            currentQuestionIndex: 0,
            totalKeys: 0,
            roomKeys: {},
            answeredQuestions: [],
            wrongAnswers: [],
            correctCount: 0,
            startTime: null,
            currentQuestion: null,
            currentRoomQuestionIndex: 0
        };

        // 初始化游戏
        function startGame() {
            gameState = {
                currentRoomIndex: 1,
                currentQuestionIndex: 0,
                totalKeys: 0,
                roomKeys: {},
                answeredQuestions: [],
                wrongAnswers: [],
                correctCount: 0,
                startTime: new Date(),
                currentQuestion: null,
                currentRoomQuestionIndex: 0
            };

            gameData.rooms.forEach(room => {
                gameState.roomKeys[room.id] = 0;
                if (room.id !== 'entrance') {
                    room.completed = false;
                }
            });

            showScreen('mapScreen');
            updateGameInfo();
            renderMap();
        }

        // 显示指定界面
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        // 渲染地图
        function renderMap() {
            const mapContainer = document.getElementById('castleMap');
            mapContainer.innerHTML = '';

            gameData.rooms.forEach((room, index) => {
                const card = document.createElement('div');
                card.className = 'room-card';
                
                if (index === 0) {
                    card.classList.add('completed');
                } else if (room.completed) {
                    card.classList.add('completed');
                } else if (index === gameState.currentRoomIndex) {
                    card.classList.add('current');
                } else if (!canAccessRoom(index)) {
                    card.classList.add('locked');
                }

                const keysInRoom = gameState.roomKeys[room.id] || 0;
                const requiredKeys = room.requiredKeys;

                card.innerHTML = `
                    <div class="room-icon">${room.icon}</div>
                    <div class="room-name">${room.name}</div>
                    <div class="room-status">
                        ${room.completed ? '✅ 已完成' : 
                          keysInRoom >= requiredKeys ? '🔑 可以进入' :
                          `🔑 ${keysInRoom}/${requiredKeys}`}
                    </div>
                `;

                if (!card.classList.contains('locked')) {
                    card.onclick = () => enterRoom(index);
                }

                mapContainer.appendChild(card);
            });

            const progress = (gameState.answeredQuestions.length / 10) * 100;
            document.getElementById('mapProgress').style.width = progress + '%';
        }

        // 判断是否可以进入房间
        function canAccessRoom(roomIndex) {
            if (roomIndex === 0) return true;
            if (roomIndex === 1) return true;
            
            const prevRoom = gameData.rooms[roomIndex - 1];
            return prevRoom.completed;
        }

        // 进入房间
        function enterRoom(roomIndex) {
            const room = gameData.rooms[roomIndex];
            
            if (room.questions.length === 0) {
                alert('这是起点，请前往下一个房间！');
                return;
            }

            if (room.completed) {
                alert('这个房间已经完成啦！');
                return;
            }

            // 修复：只有非当前活跃房间才需要检查前一房间是否完成
            if (roomIndex > 1) {
                const prevRoom = gameData.rooms[roomIndex - 1];
                if (!prevRoom.completed) {
                    alert('请先完成前面的房间！');
                    return;
                }
            }

            gameState.currentRoomIndex = roomIndex;
            gameState.currentRoomQuestionIndex = 0;
            
            loadQuestion();
            showScreen('questionScreen');
        }

        // 加载题目
        function loadQuestion() {
            const room = gameData.rooms[gameState.currentRoomIndex];
            
            const unansweredQuestions = room.questions.filter(q => 
                !gameState.answeredQuestions.includes(q.id)
            );

            if (unansweredQuestions.length === 0) {
                backToMap();
                return;
            }

            const question = unansweredQuestions[gameState.currentRoomQuestionIndex] || unansweredQuestions[0];
            gameState.currentQuestion = question;

            const keysInRoom = gameState.roomKeys[room.id] || 0;
            document.getElementById('questionNumber').textContent = 
                `第 ${gameState.answeredQuestions.length + 1} 题 / 共10题`;
            document.getElementById('roomKeysProgress').textContent = 
                `🔑 ${keysInRoom}/${room.requiredKeys}`;
            document.getElementById('roomName') && (document.getElementById('roomName').textContent = room.name);
            document.getElementById('questionText').textContent = question.text;
            document.getElementById('answerInput').value = '';
            document.getElementById('hintBox').classList.remove('show');
            document.getElementById('feedback').classList.remove('show');
            document.getElementById('nextBtn').style.display = 'none';

            drawGeometry(question.drawType, question);

            updateGameInfo();
            
            setTimeout(() => {
                document.getElementById('answerInput').focus();
            }, 100);
        }

        // 绘制几何图形
        function drawGeometry(type, question) {
            const canvas = document.getElementById('geometryCanvas');
            if (!canvas) {
                console.error('Canvas元素未找到');
                return;
            }
            
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                console.error('无法获取Canvas上下文');
                return;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.fillStyle = '#495057';
            ctx.font = '16px Microsoft YaHei';

            switch(type) {
                case 'rectangle':
                    drawRectangle(ctx, canvas);
                    break;
                case 'square':
                    drawSquare(ctx, canvas);
                    break;
                case 'rhombus':
                    drawRhombus(ctx, canvas);
                    break;
                case 'trapezoid':
                    drawTrapezoid(ctx, canvas);
                    break;
                case 'parallelogram':
                    drawParallelogram(ctx, canvas);
                    break;
                case 'fold':
                    drawFold(ctx, canvas);
                    break;
            }
        }

        function drawRectangle(ctx, canvas) {
            const x = 100, y = 80, w = 200, h = 140;
            
            ctx.beginPath();
            ctx.rect(x, y, w, h);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + w, y + h);
            ctx.strokeStyle = '#f5576c';
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillText('6', x + w/2 - 5, y - 10);
            ctx.fillText('8', x - 30, y + h/2 + 5);
            ctx.fillText('?', x + w/2 + 10, y + h/2 - 10);
        }

        function drawSquare(ctx, canvas) {
            const x = 120, y = 80, size = 160;
            
            ctx.beginPath();
            ctx.rect(x, y, size, size);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + size, y + size);
            ctx.strokeStyle = '#f5576c';
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillText('5', x + size/2 - 5, y - 10);
            ctx.fillText('?', x + size/2 + 10, y + size/2 - 10);
        }

        function drawRhombus(ctx, canvas) {
            const cx = 200, cy = 150, rx = 120, ry = 80;
            
            ctx.beginPath();
            ctx.moveTo(cx, cy - ry);
            ctx.lineTo(cx + rx, cy);
            ctx.lineTo(cx, cy + ry);
            ctx.lineTo(cx - rx, cy);
            ctx.closePath();
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(cx - rx, cy);
            ctx.lineTo(cx + rx, cy);
            ctx.strokeStyle = '#f5576c';
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(cx, cy - ry);
            ctx.lineTo(cx, cy + ry);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillText('?', cx + rx + 10, cy + 5);
        }

        function drawTrapezoid(ctx, canvas) {
            const x1 = 120, y1 = 80, x2 = 280, y2 = 80;
            const x3 = 320, y3 = 220, x4 = 80, y4 = 220;
            
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(x3, y3);
            ctx.lineTo(x4, y4);
            ctx.closePath();
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x1, y4);
            ctx.strokeStyle = '#28a745';
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillText('上底', x1 + 30, y1 - 10);
            ctx.fillText('下底', x4 + 40, y4 + 25);
            ctx.fillText('高', x1 - 35, y1 + 70);
        }

        function drawParallelogram(ctx, canvas) {
            const x1 = 100, y1 = 150, x2 = 250, y2 = 80;
            const x3 = 350, y3 = 150, x4 = 200, y4 = 220;
            
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(x3, y3);
            ctx.lineTo(x4, y4);
            ctx.closePath();
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x3, y3);
            ctx.strokeStyle = '#f5576c';
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x4, y4);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawFold(ctx, canvas) {
            const x = 80, y = 60, w = 240, h = 180;
            
            ctx.beginPath();
            ctx.rect(x, y, w, h);
            ctx.strokeStyle = '#667eea';
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(x + w * 0.6, y);
            ctx.lineTo(x + w * 0.6, y + h);
            ctx.strokeStyle = '#ffc107';
            ctx.setLineDash([10, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillText('8', x + w/2 - 5, y - 10);
            ctx.fillText('10', x - 35, y + h/2 + 5);
            ctx.fillText('折叠', x + w * 0.6 + 10, y + h/2);
        }

        // 提交答案
        function submitAnswer() {
            const input = document.getElementById('answerInput').value.trim();
            
            if (!input) {
                alert('请输入答案！');
                return;
            }

            const question = gameState.currentQuestion;
            let isCorrect = false;

            if (question.isMultiple) {
                const userAnswers = input.split(/[,，]/).map(a => parseFloat(a.trim()));
                const correctAnswers = question.answer.split(',').map(a => parseFloat(a));
                
                if (userAnswers.length !== correctAnswers.length) {
                    isCorrect = false;
                } else {
                    isCorrect = userAnswers.every((ans, idx) => 
                        Math.abs(ans - correctAnswers[idx]) < 0.1
                    );
                }
            } else {
                const userAnswer = parseFloat(input);
                
                if (isNaN(userAnswer)) {
                    alert('请输入有效的数字！');
                    return;
                }
                
                const tolerance = question.tolerance || (Number.isInteger(question.answer) ? 0.01 : 0.1);
                isCorrect = Math.abs(userAnswer - question.answer) < tolerance;
            }

            const feedback = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackMessage = document.getElementById('feedbackMessage');
            const explanation = document.getElementById('explanation');
            const nextBtn = document.getElementById('nextBtn');

            feedback.classList.remove('correct', 'incorrect');
            feedback.classList.add('show');

            if (isCorrect) {
                feedback.classList.add('correct');
                feedbackTitle.textContent = '🎉 回答正确！';
                feedbackMessage.textContent = '太棒了！你获得了一把钥匙！';
                gameState.correctCount++;
                
                const roomId = gameData.rooms[gameState.currentRoomIndex].id;
                gameState.roomKeys[roomId] = (gameState.roomKeys[roomId] || 0) + 1;
                gameState.totalKeys++;
                
                const room = gameData.rooms[gameState.currentRoomIndex];
                if (gameState.roomKeys[roomId] >= room.requiredKeys) {
                    room.completed = true;
                    feedbackMessage.textContent += `\n ${room.name}已完成！`;
                }
                
                // 更新房间钥匙显示
                document.getElementById('roomKeysProgress').textContent = 
                    ` ${gameState.roomKeys[roomId]}/${room.requiredKeys}`;
            } else {
                feedback.classList.add('incorrect');
                feedbackTitle.textContent = '❌ 回答错误';
                feedbackMessage.textContent = `正确答案是：${question.answer}`;
                
                gameState.wrongAnswers.push({
                    question: question.text,
                    userAnswer: input,
                    correctAnswer: question.answer,
                    explanation: question.explanation
                });
            }

            explanation.innerHTML = `<strong>解析：</strong><br>${question.explanation.replace(/\n/g, '<br>')}`;
            nextBtn.style.display = 'inline-block';

            gameState.answeredQuestions.push(question.id);
            updateGameInfo();
        }

        // 显示提示
        function showHint() {
            const hintBox = document.getElementById('hintBox');
            const hintText = document.getElementById('hintText');
            
            hintText.textContent = gameState.currentQuestion.hint;
            hintBox.classList.add('show');
        }

        // 下一题
        function nextQuestion() {
            const room = gameData.rooms[gameState.currentRoomIndex];
            
            const unansweredQuestions = room.questions.filter(q => 
                !gameState.answeredQuestions.includes(q.id)
            );

            if (unansweredQuestions.length > 0 && !room.completed) {
                gameState.currentRoomQuestionIndex++;
                loadQuestion();
            } else {
                backToMap();
            }
        }

        // 返回地图
        function backToMap() {
            showScreen('mapScreen');
            renderMap();
            updateGameInfo();

            // 修复：检查当前房间是否已完成，如果完成则自动进入下一个房间
            const currentRoom = gameData.rooms[gameState.currentRoomIndex];
            if (currentRoom.completed) {
                // 寻找下一个未完成的房间
                for (let i = gameState.currentRoomIndex + 1; i < gameData.rooms.length; i++) {
                    if (!gameData.rooms[i].completed && gameData.rooms[i].questions.length > 0) {
                        gameState.currentRoomIndex = i;
                        break;
                    }
                }
                renderMap();
            }

            const allCompleted = gameData.rooms.every((room, index) => 
                index === 0 || room.completed
            );

            if (allCompleted && gameState.answeredQuestions.length === 10) {
                setTimeout(showVictory, 500);
            }
        }

        // 显示胜利界面
        function showVictory() {
            showScreen('victoryScreen');
            
            const endTime = new Date();
            const timeUsed = Math.floor((endTime - gameState.startTime) / 1000 / 60);
            const accuracy = gameState.answeredQuestions.length > 0 
                ? Math.round((gameState.correctCount / gameState.answeredQuestions.length) * 100)
                : 0;

            document.getElementById('finalScore').textContent = gameState.answeredQuestions.length;
            document.getElementById('correctCount').textContent = gameState.correctCount;
            document.getElementById('accuracy').textContent = accuracy + '%';
            document.getElementById('timeUsed').textContent = timeUsed + '分';

            if (gameState.wrongAnswers.length > 0) {
                document.getElementById('wrongAnswersSection').style.display = 'block';
                const wrongList = document.getElementById('wrongAnswersList');
                wrongList.innerHTML = '';
                
                gameState.wrongAnswers.forEach((wrong, index) => {
                    const item = document.createElement('div');
                    item.className = 'wrong-item';
                    item.innerHTML = `
                        <strong>题目 ${index + 1}：</strong>${wrong.question}<br>
                        <span style="color: #dc3545;">你的答案：${wrong.userAnswer}</span><br>
                        <span style="color: #28a745;">正确答案：${wrong.correctAnswer}</span><br>
                        <small style="color: #6c757d;">${wrong.explanation}</small>
                    `;
                    wrongList.appendChild(item);
                });
            }
        }

        // 更新游戏信息
        function updateGameInfo() {
            const room = gameData.rooms[gameState.currentRoomIndex];
            document.getElementById('currentLevel').textContent = room.name;
            document.getElementById('totalKeys').textContent = '🔑 ' + gameState.totalKeys;
            document.getElementById('progress').textContent = 
                `${gameState.answeredQuestions.length}/10`;
        }

        // 重新开始
        function restartGame() {
            startGame();
        }

        // 复习错题
        function reviewWrongAnswers() {
            if (gameState.wrongAnswers.length === 0) {
                alert('太棒了！你没有错题！');
                return;
            }
            
            let reviewText = '📝 错题回顾\n\n';
            gameState.wrongAnswers.forEach((wrong, index) => {
                reviewText += `题目 ${index + 1}：${wrong.question}\n`;
                reviewText += `你的答案：${wrong.userAnswer}\n`;
                reviewText += `正确答案：${wrong.correctAnswer}\n`;
                reviewText += `解析：${wrong.explanation}\n\n`;
            });
            
            alert(reviewText);
        }

        window.onload = function() {
            console.log('🎮 勾股定理寻宝闯关游戏已加载！');
        };
    </script>
</body>
</html>
