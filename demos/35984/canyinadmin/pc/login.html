<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>商户登录 - 吃吃云</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/pc-interact.css">
    <style>
        body {
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c5a 50%, #ffb088 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            display: flex;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            overflow: hidden;
            width: 1000px;
            max-width: 100%;
            min-height: 600px;
        }
        .login-banner {
            flex: 1;
            background: linear-gradient(135deg, #ff6b35, #c54513);
            color: #fff;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .login-banner::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            top: -100px;
            right: -100px;
        }
        .login-banner::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            bottom: -50px;
            left: -50px;
        }
        .banner-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }
        .banner-logo .logo {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }
        .banner-content {
            position: relative;
            z-index: 1;
        }
        .banner-content h2 {
            font-size: 32px;
            margin-bottom: 16px;
            line-height: 1.3;
        }
        .banner-content p {
            font-size: 15px;
            opacity: 0.9;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .banner-features {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .banner-feature {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            opacity: 0.95;
        }
        .banner-feature::before {
            content: '✓';
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }
        .banner-footer {
            position: relative;
            z-index: 1;
            font-size: 12px;
            opacity: 0.7;
        }

        .login-form-wrap {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-form-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .login-form-subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 14px;
        }
        .login-form {
            max-width: 360px;
        }
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }
        .input-group .form-control {
            padding-left: 42px;
            height: 44px;
            font-size: 14px;
        }
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .login-btn {
            width: 100%;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), #ff8c5a);
            color: #fff;
            border-radius: 22px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
            transition: all 0.2s;
        }
        .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(255, 107, 53, 0.4); }
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-muted);
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider span { padding: 0 12px; }
        .other-login {
            display: flex;
            gap: 12px;
        }
        .other-login-btn {
            flex: 1;
            height: 44px;
            border: 1px solid var(--border);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .other-login-btn:hover { border-color: var(--primary); color: var(--primary); }
        .form-bottom {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .form-bottom a { color: var(--primary); margin-left: 4px; }

        @media (max-width: 768px) {
            .login-container { flex-direction: column; min-height: auto; }
            .login-banner { padding: 30px; }
            .login-form-wrap { padding: 30px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-banner">
            <div class="banner-logo">
                <div class="logo">🍜</div>
                <span>吃吃云 SaaS</span>
            </div>
            <div class="banner-content">
                <h2>让餐饮经营<br>更简单更高效</h2>
                <p>一站式管理堂食、地摊、烧烤、火锅多业态门店</p>
                <div class="banner-features">
                    <div class="banner-feature">覆盖全业态经营场景</div>
                    <div class="banner-feature">实时数据云端同步</div>
                    <div class="banner-feature">多端协同移动办公</div>
                    <div class="banner-feature">专业KDS后厨大屏</div>
                </div>
            </div>
            <div class="banner-footer">© 2026 吃吃云 · 已服务 1,286 家商户</div>
        </div>

        <div class="login-form-wrap">
            <div class="login-form-title">欢迎登录</div>
            <div class="login-form-subtitle">输入您的商户账号信息</div>

            <form class="login-form" onsubmit="event.preventDefault(); doLogin(this.querySelector('.login-btn'));">
                <div class="input-group">
                    <span class="input-icon">👤</span>
                    <input type="text" class="form-control" id="login-username" placeholder="请输入账号/手机号" value="13800138000">
                </div>
                <div class="input-group">
                    <span class="input-icon">🔒</span>
                    <input type="password" class="form-control" id="login-pwd" placeholder="请输入密码" value="123456">
                </div>
                <div class="input-group">
                    <span class="input-icon">🛡️</span>
                    <input type="text" class="form-control" placeholder="验证码" value="A4B7" style="padding-right:90px;">
                    <span onclick="this.textContent=Math.random().toString(36).substring(2,6).toUpperCase();showToast('验证码已刷新','info');" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:80px;height:32px;background:linear-gradient(135deg,#1890ff,#36cfc9);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:4px;font-weight:600;letter-spacing:2px;cursor:pointer;">A4B7</span>
                </div>
                <div class="form-row">
                    <label class="checkbox">
                        <input type="checkbox" checked>记住登录
                    </label>
                    <a href="javascript:void(0)" onclick="showForgotModal()" class="text-primary">忘记密码？</a>
                </div>
                <button class="login-btn" type="submit">登 录</button>
            </form>

            <div class="divider"><span>其他登录方式</span></div>
            <div class="other-login">
                <div class="other-login-btn" onclick="showToast('短信登录开发中','info')">📱 短信登录</div>
                <div class="other-login-btn" onclick="showModal({title:'💚 微信扫码登录',content:'<div style=\\'text-align:center;padding:20px;\\'><div style=\\'width:180px;height:180px;margin:0 auto;background:#fff;border:2px solid #e0e0e0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:80px;\\'>📱</div><div style=\\'margin-top:14px;color:var(--text-secondary);font-size:13px;\\'>请使用微信扫描二维码登录</div></div>',footer:false,width:360})">💚 微信扫码</div>
            </div>
            <div class="form-bottom">
                还没有账号？<a href="javascript:void(0)" onclick="showApplyModal()" class="text-primary">申请入驻</a>
            </div>
        </div>
    </div>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/pc-interact.js"></script>
<script>
function showForgotModal() {
    showModal({
        title: '找回密码',
        content: `
            <div class="form-group"><label class="form-label">手机号</label><input class="form-control" placeholder="请输入手机号"></div>
            <div class="form-group"><label class="form-label">短信验证码</label><input class="form-control" placeholder="6位验证码"></div>
        `,
        footer: `
            <button class="btn btn-default" data-act="close">取消</button>
            <button class="btn btn-primary" onclick="showToast('验证码已发送','success')">发送验证码</button>
        `
    });
}

function showApplyModal() {
    showModal({
        title: '🏪 申请入驻',
        content: `
            <div class="form-group"><label class="form-label">商户名称</label><input class="form-control" placeholder="请输入您的店铺名称"></div>
            <div class="form-group"><label class="form-label">联系人</label><input class="form-control" placeholder="您的姓名"></div>
            <div class="form-group"><label class="form-label">联系电话</label><input class="form-control" placeholder="手机号"></div>
            <div class="form-group"><label class="form-label">经营业态</label>
                <select class="form-control">
                    <option>堂食餐饮</option>
                    <option>地摊餐饮</option>
                    <option>烧烤店</option>
                    <option>火锅店</option>
                    <option>其他</option>
                </select>
            </div>
        `,
        footer: `
            <button class="btn btn-default" data-act="close">取消</button>
            <button class="btn btn-primary" onclick="showToast('申请已提交，我们将在24小时内联系您','success')">提交申请</button>
        `
    });
}
</script>
</body>
</html>
