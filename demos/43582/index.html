<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市匹配测试 - 找到最适合你的城市</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #06b6d4;
            --dark: #1e1b4b;
            --light: #f8fafc;
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            color: var(--dark);
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 首页样式 */
        .home-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.3rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 40px;
            max-width: 600px;
            line-height: 1.8;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
            width: 100%;
            max-width: 800px;
        }

        .feature-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            color: white;
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.25);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .feature-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .feature-desc {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .start-btn {
            background: white;
            color: var(--primary);
            border: none;
            padding: 20px 60px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--gradient-1);
            transition: left 0.5s ease;
            z-index: -1;
        }

        .start-btn:hover {
            transform: scale(1.05);
            color: white;
        }

        .start-btn:hover::before {
            left: 0;
        }

        /* 测试页面样式 */
        .test-page {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .test-header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress-bar {
            flex: 1;
            height: 12px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient-1);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .progress-text {
            font-weight: 600;
            color: var(--primary);
            min-width: 60px;
            text-align: right;
        }

        .question-container {
            flex: 1;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .category-tag {
            display: inline-block;
            background: var(--gradient-1);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 20px;
            align-self: flex-start;
        }

        .question-text {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .options-container {
            display: grid;
            gap: 15px;
        }

        .option-btn {
            background: #f1f5f9;
            border: 2px solid transparent;
            padding: 20px 25px;
            border-radius: 15px;
            cursor: pointer;
            text-align: left;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option-btn:hover {
            background: white;
            border-color: var(--primary);
            transform: translateX(10px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
        }

        .option-btn.selected {
            background: var(--gradient-1);
            color: white;
            border-color: var(--primary);
        }

        .option-letter {
            width: 35px;
            height: 35px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
        }

        .option-btn.selected .option-letter {
            background: rgba(255,255,255,0.5);
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            gap: 20px;
        }

        .nav-btn {
            padding: 15px 40px;
            border-radius: 30px;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn.prev {
            background: #e2e8f0;
            color: var(--dark);
        }

        .nav-btn.prev:hover {
            background: #cbd5e1;
        }

        .nav-btn.next, .nav-btn.submit {
            background: var(--gradient-1);
            color: white;
            flex: 1;
            max-width: 200px;
        }

        .nav-btn.next:hover, .nav-btn.submit:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 结果页面样式 */
        .result-page {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            animation: fadeIn 1s ease-out;
        }

        .result-header {
            text-align: center;
            padding: 40px 20px;
            color: white;
        }

        .result-header h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .result-header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .result-content {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px;
            box-shadow: var(--shadow);
            flex: 1;
        }

        .city-card {
            text-align: center;
            padding: 40px;
            background: var(--gradient-1);
            border-radius: 25px;
            color: white;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .city-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .match-score {
            font-size: 5rem;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .match-label {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .city-name {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .city-province {
            font-size: 1.3rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .analysis-section {
            margin-bottom: 40px;
        }

        .analysis-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .analysis-content {
            background: #f8fafc;
            border-radius: 20px;
            padding: 25px;
            line-height: 1.8;
            color: #475569;
        }

        .dimensions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .dimension-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        .dimension-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
        }

        .dimension-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .dimension-name {
            font-weight: 600;
            color: var(--dark);
        }

        .dimension-score {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .dimension-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .dimension-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 1s ease;
        }

        .top-cities {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .top-city-item {
            background: white;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        .top-city-item:hover {
            transform: translateX(10px);
            box-shadow: var(--shadow);
        }

        .top-city-rank {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .top-city-rank.gold { background: linear-gradient(135deg, #ffd700, #ffaa00); }
        .top-city-rank.silver { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); }
        .top-city-rank.bronze { background: linear-gradient(135deg, #cd7f32, #b87333); }
        .top-city-rank.other { background: #e2e8f0; color: var(--dark); }

        .top-city-info {
            flex: 1;
        }

        .top-city-name {
            font-weight: 600;
            color: var(--dark);
        }

        .top-city-score {
            font-size: 0.9rem;
            color: var(--primary);
        }

        .action-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        .action-btn {
            padding: 18px 40px;
            border-radius: 30px;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn.primary {
            background: var(--gradient-1);
            color: white;
        }

        .action-btn.secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .subtitle { font-size: 1rem; }
            .question-container { padding: 30px 20px; }
            .question-text { font-size: 1.2rem; }
            .city-name { font-size: 2rem; }
            .match-score { font-size: 3.5rem; }
            .result-content { padding: 30px 20px; }
        }

        /* 加载动画 */
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 6px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 1.2rem;
            color: var(--dark);
        }

        /* 粒子背景 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: float-particle 15s infinite;
        }

        @keyframes float-particle {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- 首页 -->
        <div class="home-page" id="homePage">
            <div class="logo">🏙️</div>
            <h1>城市匹配测试</h1>
            <p class="subtitle">
                通过100道精心设计的题目，从生活方式、性格特征、职业需求、气候偏好、文化认同等多个维度，
                为你找到最适合居住和发展的城市
            </p>
            
            <div class="features">
                <div class="feature-card">
                    <div class="feature-icon">🎯</div>
                    <div class="feature-title">100道专业题目</div>
                    <div class="feature-desc">涵盖8大维度全方位评估</div>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">🏙️</div>
                    <div class="feature-title">100+城市数据库</div>
                    <div class="feature-desc">省会、直辖市、经济强市全覆盖</div>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">📊</div>
                    <div class="feature-title">智能匹配算法</div>
                    <div class="feature-desc">精准推荐最适合你的城市</div>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">📈</div>
                    <div class="feature-title">详细分析报告</div>
                    <div class="feature-desc">多维度解读匹配结果</div>
                </div>
            </div>

            <button class="start-btn" onclick="startTest()">开始测试</button>
        </div>

        <!-- 测试页面 -->
        <div class="test-page" id="testPage">
            <div class="test-header">
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text" id="progressText">0/100</div>
                </div>
            </div>

            <div class="question-container">
                <span class="category-tag" id="categoryTag">生活方式</span>
                <h2 class="question-text" id="questionText">题目加载中...</h2>
                <div class="options-container" id="optionsContainer">
                    <!-- 选项将动态生成 -->
                </div>
                <div class="navigation">
                    <button class="nav-btn prev" id="prevBtn" onclick="prevQuestion()" disabled>上一题</button>
                    <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()" disabled>下一题</button>
                </div>
            </div>
        </div>

        <!-- 结果页面 -->
        <div class="result-page" id="resultPage">
            <div class="result-header">
                <h2>🎉 测试完成！</h2>
                <p>根据你的回答，我们为你找到了最适合的城市</p>
            </div>

            <div class="result-content">
                <div class="city-card">
                    <div class="match-score" id="matchScore">98%</div>
                    <div class="match-label">匹配度</div>
                    <div class="city-name" id="cityName">杭州</div>
                    <div class="city-province" id="cityProvince">浙江省</div>
                </div>

                <div class="analysis-section">
                    <h3 class="analysis-title">📋 匹配分析</h3>
                    <div class="analysis-content" id="analysisContent">
                        分析内容加载中...
                    </div>
                </div>

                <div class="analysis-section">
                    <h3 class="analysis-title">📊 各维度匹配度</h3>
                    <div class="dimensions-grid" id="dimensionsGrid">
                        <!-- 维度卡片将动态生成 -->
                    </div>
                </div>

                <div class="analysis-section">
                    <h3 class="analysis-title">🏆 其他推荐城市</h3>
                    <div class="top-cities" id="topCities">
                        <!-- 推荐城市将动态生成 -->
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="action-btn primary" onclick="restartTest()">重新测试</button>
                    <button class="action-btn secondary" onclick="shareResult()">分享结果</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载动画 -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">正在分析你的城市匹配度...</div>
    </div>

    <script src="questions.js"></script>
    <script src="cities.js"></script>
    <script src="app.js"></script>
</body>
</html>
