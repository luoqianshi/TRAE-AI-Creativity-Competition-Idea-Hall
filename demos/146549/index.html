<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智汇笔记 - 智能知识管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            color: #e2e8f0;
        }
        .glass-effect {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: rgba(51, 65, 85, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            background: rgba(71, 85, 105, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .gradient-text {
            background: linear-gradient(90deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .input-field {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            color: #e2e8f0;
            width: 100%;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }
        .category-tag {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        .animate-slide-up {
            animation: slideUp 0.3s ease-out;
        }
        .animate-pulse-slow {
            animation: pulseSlow 2s infinite;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseSlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .search-highlight {
            background: rgba(16, 185, 129, 0.3);
            padding: 2px 4px;
            border-radius: 4px;
        }
        .ai-badge {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 glass-effect flex flex-col border-r border-white/10">
            <div class="p-5 border-b border-white/10">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-blue-500 flex items-center justify-center">
                        <i class="fa-solid fa-brain text-white text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold gradient-text">智汇笔记</h1>
                        <p class="text-xs text-slate-400">智能知识管理</p>
                    </div>
                </div>
                <button onclick="openCreateModal()" class="btn-primary w-full mt-4 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>新建笔记</span>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto scrollbar-hide p-4">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">分类</h3>
                <div class="space-y-1" id="categoryList">
                </div>
                
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 mt-6">标签云</h3>
                <div class="flex flex-wrap gap-2" id="tagCloud">
                </div>
            </div>
            
            <div class="p-4 border-t border-white/10">
                <div class="glass-card rounded-xl p-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-slate-300">笔记总数</span>
                        <span class="text-2xl font-bold gradient-text" id="noteCount">0</span>
                    </div>
                    <div class="flex items-center justify-between text-xs text-slate-400">
                        <span>今日新增</span>
                        <span id="todayCount">0</span>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col">
            <div class="p-6 border-b border-white/10">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="搜索笔记内容，支持AI语义检索..." 
                           class="input-field pl-12 pr-32" oninput="handleSearch()">
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center gap-2">
                        <span class="ai-badge flex items-center gap-1">
                            <i class="fa-solid fa-robot text-xs"></i> AI搜索
                        </span>
                    </div>
                </div>
                <div id="aiSearchResults" class="mt-4 hidden">
                    <div class="glass-card rounded-xl p-4 animate-fade-in">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-violet-500 to-indigo-500 flex items-center justify-center">
                                <i class="fa-solid fa-robot text-white text-sm"></i>
                            </div>
                            <span class="font-semibold text-sm">AI智能分析结果</span>
                        </div>
                        <div id="aiAnalysisContent" class="text-sm text-slate-300 leading-relaxed">
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto scrollbar-hide p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4" id="notesGrid">
                </div>
                <div id="emptyState" class="flex flex-col items-center justify-center h-full text-center hidden">
                    <div class="w-24 h-24 rounded-full bg-white/5 flex items-center justify-center mb-4">
                        <i class="fa-solid fa-file-lines text-slate-500 text-4xl"></i>
                    </div>
                    <h3 class="text-lg font-medium text-slate-300 mb-2">暂无笔记</h3>
                    <p class="text-sm text-slate-500 mb-6">点击左上角按钮创建您的第一条笔记</p>
                    <button onclick="openCreateModal()" class="btn-primary">
                        <i class="fa-solid fa-plus mr-2"></i>创建笔记
                    </button>
                </div>
            </div>
        </main>
    </div>

    <div id="createModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden animate-slide-up">
            <div class="p-5 border-b border-white/10 flex items-center justify-between">
                <h2 class="text-xl font-semibold">新建笔记</h2>
                <button onclick="closeCreateModal()" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-5 overflow-y-auto max-h-[calc(90vh-140px)]">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-300 mb-2">标题</label>
                    <input type="text" id="noteTitle" class="input-field" placeholder="输入笔记标题">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-300 mb-2">分类</label>
                    <select id="noteCategory" class="input-field">
                        <option value="学习笔记">学习笔记</option>
                        <option value="工作记录">工作记录</option>
                        <option value="生活随笔">生活随笔</option>
                        <option value="灵感创意">灵感创意</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-300 mb-2">标签</label>
                    <input type="text" id="noteTags" class="input-field" placeholder="输入标签，用逗号分隔">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-300 mb-2">内容</label>
                    <textarea id="noteContent" class="input-field h-48 resize-none" placeholder="开始记录您的想法..."></textarea>
                </div>
            </div>
            <div class="p-5 border-t border-white/10 flex items-center justify-between">
                <button onclick="generateAISummary()" class="px-4 py-2 rounded-lg border border-violet-500/50 text-violet-400 hover:bg-violet-500/10 transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    AI智能摘要
                </button>
                <div class="flex items-center gap-3">
                    <button onclick="closeCreateModal()" class="px-4 py-2 rounded-lg text-slate-300 hover:bg-white/5 transition-colors">取消</button>
                    <button onclick="saveNote()" class="btn-primary flex items-center gap-2">
                        <i class="fa-solid fa-save"></i>
                        保存笔记
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="detailModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-2xl w-full max-w-3xl max-h-[90vh] overflow-hidden animate-slide-up">
            <div class="p-5 border-b border-white/10 flex items-center justify-between">
                <h2 class="text-xl font-semibold" id="detailTitle"></h2>
                <div class="flex items-center gap-3">
                    <button onclick="deleteNote()" class="text-red-400 hover:text-red-300 transition-colors" title="删除">
                        <i class="fa-solid fa-trash text-lg"></i>
                    </button>
                    <button onclick="closeDetailModal()" class="text-slate-400 hover:text-white transition-colors">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
            </div>
            <div class="p-5 overflow-y-auto max-h-[calc(90vh-140px)]">
                <div class="flex items-center gap-3 mb-4">
                    <span class="category-tag" id="detailCategory"></span>
                    <div class="flex items-center gap-2" id="detailTags"></div>
                    <span class="text-xs text-slate-500 ml-auto" id="detailDate"></span>
                </div>
                <div class="mb-4 p-4 bg-white/5 rounded-xl">
                    <div class="flex items-center gap-2 mb-2">
                        <i class="fa-solid fa-lightbulb text-amber-400"></i>
                        <span class="text-sm font-medium text-slate-300">AI智能摘要</span>
                    </div>
                    <p class="text-sm text-slate-400" id="detailSummary"></p>
                </div>
                <div class="prose prose-invert max-w-none">
                    <p id="detailContent" class="text-slate-300 leading-relaxed whitespace-pre-wrap"></p>
                </div>
            </div>
            <div class="p-5 border-t border-white/10">
                <button onclick="closeDetailModal()" class="btn-primary w-full">
                    关闭
                </button>
            </div>
        </div>
    </div>

    <script>
        let notes = [];
        let currentNoteId = null;
        let searchTimeout = null;

        const categories = [
            { name: '学习笔记', color: '#10b981', icon: 'fa-book-open' },
            { name: '工作记录', color: '#3b82f6', icon: 'fa-briefcase' },
            { name: '生活随笔', color: '#f59e0b', icon: 'fa-coffee' },
            { name: '灵感创意', color: '#8b5cf6', icon: 'fa-lightbulb' }
        ];

        function init() {
            loadNotes();
            renderCategories();
            renderNotes();
            updateStats();
        }

        function loadNotes() {
            const saved = localStorage.getItem('smartNotes');
            if (saved) {
                notes = JSON.parse(saved);
            } else {
                notes = [
                    {
                        id: '1',
                        title: 'React Hooks 学习笔记',
                        content: 'React Hooks 是 React 16.8 引入的新特性，让函数组件能够使用 state 和其他 React 特性。\n\n主要 Hooks:\n1. useState - 管理状态\n2. useEffect - 处理副作用\n3. useContext - 上下文传递\n4. useReducer - 复杂状态管理\n\n使用规则：\n- 只能在函数组件顶层调用\n- 不能在循环、条件或嵌套函数中调用',
                        category: '学习笔记',
                        tags: ['React', '前端', 'JavaScript'],
                        createdAt: '2024-01-15T10:30:00',
                        summary: 'React Hooks 是 React 16.8 的新特性，包括 useState、useEffect、useContext、useReducer 等，使用时需遵循特定规则。'
                    },
                    {
                        id: '2',
                        title: '项目周报 - 第一周',
                        content: '本周完成工作：\n\n1. 完成用户登录模块开发\n2. 优化数据库查询性能\n3. 修复了3个bug\n4. 参与代码评审\n\n下周计划：\n1. 开发用户管理功能\n2. 编写单元测试\n3. 性能优化',
                        category: '工作记录',
                        tags: ['项目管理', '周报'],
                        createdAt: '2024-01-14T18:00:00',
                        summary: '本周完成了用户登录模块开发、数据库性能优化和bug修复，下周计划开发用户管理功能。'
                    },
                    {
                        id: '3',
                        title: '阅读《原子习惯》有感',
                        content: '习惯是自我提升的复利。\n\n核心要点：\n- 让习惯显而易见\n- 让习惯有吸引力\n- 让习惯简便易行\n- 让习惯令人愉悦\n\n微小的改变，巨大的结果。每天进步1%，一年后进步37倍。',
                        category: '生活随笔',
                        tags: ['阅读', '习惯', '成长'],
                        createdAt: '2024-01-13T20:30:00',
                        summary: '《原子习惯》强调习惯的力量，通过让习惯显而易见、有吸引力、简便易行、令人愉悦来建立良好习惯。'
                    },
                    {
                        id: '4',
                        title: 'AI产品设计思路',
                        content: '如何设计一款优秀的AI产品？\n\n1. 明确用户需求\n2. 选择合适的AI技术\n3. 设计简洁的用户界面\n4. 保证数据隐私\n5. 持续迭代优化\n\n关键在于找到技术与用户需求的平衡点。',
                        category: '灵感创意',
                        tags: ['AI', '产品设计', '创意'],
                        createdAt: '2024-01-12T14:00:00',
                        summary: 'AI产品设计需要明确用户需求、选择合适技术、设计简洁界面、保证数据隐私并持续迭代优化。'
                    }
                ];
                saveNotes();
            }
        }

        function saveNotes() {
            localStorage.setItem('smartNotes', JSON.stringify(notes));
        }

        function renderCategories() {
            const container = document.getElementById('categoryList');
            let html = `<div class="p-2 rounded-lg cursor-pointer hover:bg-white/5 transition-colors ${!currentCategory ? 'bg-white/10' : ''}" onclick="filterByCategory('')">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-slate-400"></i>
                    <span class="text-sm">全部笔记</span>
                </div>
            </div>`;
            
            categories.forEach(cat => {
                const count = notes.filter(n => n.category === cat.name).length;
                html += `<div class="p-2 rounded-lg cursor-pointer hover:bg-white/5 transition-colors ${currentCategory === cat.name ? 'bg-white/10' : ''}" onclick="filterByCategory('${cat.name}')">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full" style="background: ${cat.color}"></div>
                            <span class="text-sm">${cat.name}</span>
                        </div>
                        <span class="text-xs text-slate-500">${count}</span>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function renderTags() {
            const tagCloud = document.getElementById('tagCloud');
            const tagCount = {};
            notes.forEach(note => {
                note.tags.forEach(tag => {
                    tagCount[tag] = (tagCount[tag] || 0) + 1;
                });
            });
            
            let html = '';
            Object.entries(tagCount).forEach(([tag, count]) => {
                const opacity = Math.min(0.5 + (count / 5), 1);
                html += `<span class="px-3 py-1 rounded-full text-xs bg-white/5 text-slate-300 cursor-pointer hover:bg-white/10 transition-colors" 
                            style="opacity: ${opacity}" onclick="filterByTag('${tag}')">
                    ${tag} (${count})
                </span>`;
            });
            tagCloud.innerHTML = html;
        }

        let currentCategory = '';
        let currentTag = '';
        let searchQuery = '';

        function filterByCategory(category) {
            currentCategory = category;
            currentTag = '';
            renderCategories();
            renderNotes();
        }

        function filterByTag(tag) {
            currentTag = tag;
            currentCategory = '';
            renderCategories();
            renderNotes();
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            searchQuery = query;
            
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                if (query.length >= 2) {
                    performAISearch(query);
                } else {
                    document.getElementById('aiSearchResults').classList.add('hidden');
                }
                renderNotes();
            }, 300);
        }

        function performAISearch(query) {
            const results = notes.filter(note => 
                note.title.toLowerCase().includes(query.toLowerCase()) ||
                note.content.toLowerCase().includes(query.toLowerCase()) ||
                note.tags.some(tag => tag.toLowerCase().includes(query.toLowerCase()))
            );
            
            if (results.length === 0) {
                document.getElementById('aiSearchResults').classList.add('hidden');
                return;
            }

            let analysis = '';
            
            if (query.includes('有哪些') || query.includes('哪些') || query.includes('汇总')) {
                const items = [];
                results.forEach(note => {
                    const lines = note.content.split('\n').filter(line => line.trim());
                    lines.forEach(line => {
                        if (line.match(/^[1-9]\.|^\-|^\*/)) {
                            items.push(line.replace(/^[1-9]\.\s*|^\-\s*|^\*\s*/, ''));
                        }
                    });
                });
                analysis = `<strong>相关知识点汇总：</strong><ul class="list-disc list-inside mt-2 space-y-1">
                    ${items.slice(0, 6).map(item => `<li>${highlightText(item, query)}</li>`).join('')}
                </ul>`;
            } else if (query.includes('是什么') || query.includes('定义')) {
                const definitions = results.map(note => {
                    const firstPara = note.content.split('\n\n')[0];
                    return firstPara.length > 100 ? firstPara.substring(0, 100) + '...' : firstPara;
                });
                analysis = `<strong>相关定义：</strong><p class="mt-2">${definitions[0]}</p>`;
            } else {
                analysis = `<strong>找到 ${results.length} 条相关笔记：</strong><ul class="list-disc list-inside mt-2 space-y-1">
                    ${results.slice(0, 5).map(note => `<li><strong>${highlightText(note.title, query)}</strong> - ${note.category}</li>`).join('')}
                </ul>`;
            }

            document.getElementById('aiAnalysisContent').innerHTML = analysis;
            document.getElementById('aiSearchResults').classList.remove('hidden');
        }

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<span class="search-highlight">$1</span>');
        }

        function renderNotes() {
            const grid = document.getElementById('notesGrid');
            let filteredNotes = notes;

            if (currentCategory) {
                filteredNotes = filteredNotes.filter(n => n.category === currentCategory);
            }
            if (currentTag) {
                filteredNotes = filteredNotes.filter(n => n.tags.includes(currentTag));
            }
            if (searchQuery) {
                filteredNotes = filteredNotes.filter(n => 
                    n.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    n.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    n.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()))
                );
            }

            filteredNotes.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            if (filteredNotes.length === 0) {
                grid.innerHTML = '';
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }

            document.getElementById('emptyState').classList.add('hidden');
            
            let html = '';
            filteredNotes.forEach(note => {
                const cat = categories.find(c => c.name === note.category);
                const date = new Date(note.createdAt);
                const dateStr = `${date.getMonth() + 1}月${date.getDate()}日 ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                const preview = note.content.length > 100 ? note.content.substring(0, 100) + '...' : note.content;
                
                html += `<div class="glass-card rounded-xl p-4 cursor-pointer" onclick="openDetailModal('${note.id}')">
                    <div class="flex items-start justify-between mb-3">
                        <h3 class="font-semibold text-slate-200 line-clamp-1">${highlightText(note.title, searchQuery)}</h3>
                        <span class="category-tag" style="background: ${cat.color}20; color: ${cat.color}">${note.category}</span>
                    </div>
                    <p class="text-sm text-slate-400 line-clamp-3 mb-4">${highlightText(preview, searchQuery)}</p>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-1">
                            ${note.tags.slice(0, 3).map(tag => `<span class="text-xs text-slate-500 bg-white/5 px-2 py-0.5 rounded">${tag}</span>`).join('')}
                        </div>
                        <span class="text-xs text-slate-500">${dateStr}</span>
                    </div>
                </div>`;
            });
            grid.innerHTML = html;
        }

        function updateStats() {
            document.getElementById('noteCount').textContent = notes.length;
            const today = new Date().toDateString();
            const todayCount = notes.filter(n => new Date(n.createdAt).toDateString() === today).length;
            document.getElementById('todayCount').textContent = todayCount;
        }

        function openCreateModal() {
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            document.getElementById('noteTags').value = '';
            document.getElementById('noteCategory').value = '学习笔记';
            document.getElementById('createModal').classList.remove('hidden');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.add('hidden');
        }

        function generateAISummary() {
            const content = document.getElementById('noteContent').value;
            if (!content.trim()) {
                alert('请先输入笔记内容');
                return;
            }
            
            const sentences = content.split(/[。！？\n]/).filter(s => s.trim().length > 10);
            if (sentences.length === 0) {
                alert('内容太短，无法生成摘要');
                return;
            }
            
            const summary = sentences.slice(0, 3).join('。');
            const titleSuggestion = sentences[0].substring(0, 20);
            
            document.getElementById('noteTitle').value = document.getElementById('noteTitle').value || titleSuggestion;
            
            alert(`AI智能摘要：\n\n${summary}`);
        }

        function saveNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            const category = document.getElementById('noteCategory').value;
            const tags = document.getElementById('noteTags').value.split(',').map(t => t.trim()).filter(t => t);

            if (!title || !content) {
                alert('请填写标题和内容');
                return;
            }

            const sentences = content.split(/[。！？\n]/).filter(s => s.trim().length > 10);
            const summary = sentences.length > 0 ? sentences.slice(0, 2).join('。') + '。' : content.substring(0, 50) + '...';

            const newNote = {
                id: Date.now().toString(),
                title,
                content,
                category,
                tags,
                createdAt: new Date().toISOString(),
                summary
            };

            notes.unshift(newNote);
            saveNotes();
            closeCreateModal();
            renderNotes();
            renderCategories();
            renderTags();
            updateStats();
        }

        function openDetailModal(id) {
            currentNoteId = id;
            const note = notes.find(n => n.id === id);
            if (!note) return;

            const cat = categories.find(c => c.name === note.category);
            const date = new Date(note.createdAt);
            const dateStr = `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;

            document.getElementById('detailTitle').textContent = note.title;
            document.getElementById('detailCategory').textContent = note.category;
            document.getElementById('detailCategory').style.cssText = `background: ${cat.color}20; color: ${cat.color}`;
            document.getElementById('detailDate').textContent = dateStr;
            document.getElementById('detailSummary').textContent = note.summary || '暂无摘要';
            document.getElementById('detailContent').textContent = note.content;
            
            const tagsHtml = note.tags.map(tag => `<span class="text-xs text-slate-400 bg-white/5 px-2 py-0.5 rounded">${tag}</span>`).join('');
            document.getElementById('detailTags').innerHTML = tagsHtml;

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
            currentNoteId = null;
        }

        function deleteNote() {
            if (!currentNoteId) return;
            
            if (!confirm('确定要删除这条笔记吗？')) return;

            notes = notes.filter(n => n.id !== currentNoteId);
            saveNotes();
            closeDetailModal();
            renderNotes();
            renderCategories();
            renderTags();
            updateStats();
        }

        init();
    </script>
</body>
</html>
