<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>专注林间 · 原型演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #eaf7e1;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .phone {
      max-width: 400px;
      width: 100%;
      background: #ffffff;
      border-radius: 42px;
      box-shadow: 0 20px 60px rgba(60, 100, 50, 0.15);
      padding: 2rem 1.8rem 2.5rem;
      transition: all 0.2s;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #7a8a72;
      margin-bottom: 1.8rem;
    }
    .greeting {
      font-size: 1.4rem;
      font-weight: 600;
      color: #2d3d2a;
    }
    .greeting small {
      font-weight: 400;
      font-size: 0.9rem;
      color: #6f7f67;
      display: block;
    }
    .task-section {
      margin: 1.8rem 0 1.5rem;
    }
    .task-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: #f5faf2;
      padding: 0.8rem 1rem;
      border-radius: 18px;
      margin-bottom: 0.6rem;
      border: 1px solid #dce8d6;
    }
    .task-item .circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #8ba67e;
      flex-shrink: 0;
    }
    .task-item .circle.done {
      background: #6b8f5e;
      border-color: #6b8f5e;
    }
    .task-item .info {
      flex: 1;
      font-size: 0.95rem;
      color: #2d3d2a;
    }
    .task-item .tag {
      font-size: 0.65rem;
      background: #dce8d6;
      padding: 0.15rem 0.7rem;
      border-radius: 30px;
      color: #3d5536;
    }
    .timer-box {
      background: #f0f8ec;
      border-radius: 32px;
      padding: 1.8rem 1rem;
      text-align: center;
      margin: 1.2rem 0;
      border: 2px dashed #8ba67e;
    }
    .timer-box .time {
      font-size: 3.2rem;
      font-weight: 600;
      color: #2d4a27;
      letter-spacing: 0.04em;
    }
    .timer-box .label {
      font-size: 0.8rem;
      color: #5f7357;
      margin-top: 0.2rem;
    }
    .btn-primary {
      background: #4a7a3e;
      color: white;
      border: none;
      padding: 0.9rem 0;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1.05rem;
      width: 100%;
      transition: 0.15s;
      cursor: default;
    }
    .btn-primary:hover {
      background: #3b6631;
    }
    .forest-row {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      margin: 1.2rem 0 0.8rem;
      font-size: 1.8rem;
    }
    .forest-row span {
      filter: drop-shadow(0 2px 4px rgba(60, 100, 50, 0.1));
    }
    .stats {
      display: flex;
      justify-content: space-around;
      background: #f5faf2;
      border-radius: 24px;
      padding: 0.8rem;
      margin-top: 1.2rem;
      font-size: 0.8rem;
      color: #3d5536;
    }
    .stats strong {
      display: block;
      font-size: 1.2rem;
      color: #2d3d2a;
    }
    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 1.2rem;
    }
    .badge-row span {
      background: #eaf3e4;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      font-size: 0.7rem;
      color: #3d5536;
      border: 1px solid #c8dcc0;
    }
    .footnote {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.7rem;
      color: #8a9e82;
      border-top: 1px solid #e2ede0;
      padding-top: 1rem;
    }
  </style>
</head>
<body>
<div class="phone">
  <!-- 状态栏 -->
  <div class="status-bar">
    <span>🌳 专注林间</span>
    <span>🔥 今日 2.5h</span>
  </div>

  <!-- 问候 -->
  <div class="greeting">
    下午好，小森林 🌱
    <small>今天已经种下 4 棵树</small>
  </div>

  <!-- 任务看板 -->
  <div class="task-section">
    <div class="task-item">
      <div class="circle done"></div>
      <span class="info">📖 阅读《认知觉醒》第3章</span>
      <span class="tag">25min</span>
    </div>
    <div class="task-item">
      <div class="circle"></div>
      <span class="info">✍️ 写项目需求文档</span>
      <span class="tag">40min</span>
    </div>
    <div class="task-item">
      <div class="circle"></div>
      <span class="info">🧪 复习英语单词 × 30</span>
      <span class="tag">15min</span>
    </div>
  </div>

  <!-- 计时器 -->
  <div class="timer-box">
    <div class="time">25:00</div>
    <div class="label">当前专注 · 阅读《认知觉醒》</div>
  </div>

  <!-- 开始按钮 -->
  <button class="btn-primary">🌲 开始专注</button>

  <!-- 森林激励 -->
  <div class="forest-row">
    <span>🌲</span><span>🌲</span><span>🌳</span><span>🌱</span><span>🌲</span>
    <span style="opacity:0.3;">+ 🌱</span>
  </div>

  <!-- 数据统计 -->
  <div class="stats">
    <div><strong>4</strong> 今日任务</div>
    <div><strong>2.5h</strong> 专注时长</div>
    <div><strong>86%</strong> 完成率</div>
  </div>

  <!-- 标签 -->
  <div class="badge-row">
    <span>#学习工作</span>
    <span>#社会公益</span>
    <span>#TRAE生成</span>
    <span>#专注森林</span>
  </div>

  <div class="footnote">
    ⚡ TRAE Work · Auto模式 原型展示 · 专注林间 v0.1
  </div>
</div>
</body>
</html>
