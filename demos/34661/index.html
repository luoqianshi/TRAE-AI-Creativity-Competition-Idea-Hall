        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* 模拟手机外壳 */
        .mobile-frame {
            width: 375px;
            height: 750px;
            border: 12px solid #1f2937;
            border-radius: 40px;
            overflow: hidden;
            position: relative;
            background: white;
            margin: 0 auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .mobile-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 25px;
            background: #1f2937;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 50;
        }

    <script>
        // 模拟数据库数据
        let products = [
            { id: 1, name: "天云井·珍藏版 52度", price: 598, stock: 120, sales: 450, category: "珍藏版", image: "https://picsum.photos/200/200?random=1" },
            { id: 2, name: "天云井·商务宴 52度", price: 298, stock: 300, sales: 890, category: "商务宴", image: "https://picsum.photos/200/200?random=2" },
            { id: 3, name: "天云井·原浆老酒 60度", price: 198, stock: 50, sales: 1200, category: "日常口粮", image: "https://picsum.photos/200/200?random=3" },
            { id: 4, name: "天云井·礼盒装", price: 888, stock: 20, sales: 120, category: "珍藏版", image: "https://picsum.photos/200/200?random=4" }
        ];

        let isAdminView = true;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            renderProductTable();
            renderMobileProducts();
            
            // 视图切换监听
            document.getElementById('switch-view-btn').addEventListener('click', toggleView);
        });

        // 视图切换逻辑
        function toggleView() {
            isAdminView = !isAdminView;
            const sidebar = document.getElementById('admin-sidebar');
            const adminContent = document.getElementById('admin-content');
            const mobileView = document.getElementById('mobile-view');
            const btnText = document.querySelector('#switch-view-btn span');
            const btnIcon = document.querySelector('#switch-view-btn i');

            if (isAdminView) {
                sidebar.classList.remove('hidden');
                adminContent.classList.remove('hidden');
                mobileView.classList.add('hidden');
                btnText.textContent = "切换至 C端小程序视图";
                btnIcon.className = "fas fa-mobile-alt";
            } else {
                sidebar.classList.add('hidden');
                adminContent.classList.add('hidden');
                mobileView.classList.remove('hidden');
                btnText.textContent = "切换至 B端管理后台";
                btnIcon.className = "fas fa-desktop";
            }
        }

        // B端：侧边栏导航切换
        function showAdminSection(sectionId) {
            // 隐藏所有section
            document.querySelectorAll('[id^="section-"]').forEach(el => el.classList.add('hidden'));
            // 显示目标section
            document.getElementById(`section-${sectionId}`).classList.remove('hidden');
            
            // 更新侧边栏激活状态
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active', 'bg-red-50', 'text-red-800', 'border-r-4', 'border-red-800'));
            event.currentTarget.classList.add('active');
        }

        // B端：渲染商品表格
        function renderProductTable() {
            const tbody = document.getElementById('product-table-body');
            tbody.innerHTML = '';
            products.forEach(p => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition border-b border-gray-100";
                tr.innerHTML = `
                    <td class="px-6 py-4"><img src="${p.image}" alt="${p.name}" class="w-10 h-10 rounded object-cover"></td>
                    <td class="px-6 py-4">
                        <div class="font-medium text-gray-800">${p.name}</div>
                        <div class="text-xs text-gray-500">${p.category}</div>
                    </td>
                    <td class="px-6 py-4 font-medium text-red-800">¥${p.price}</td>
                    <td class="px-6 py-4">
                        <span class="${p.stock < 50 ? 'text-red-600 font-bold' : 'text-gray-600'}">${p.stock}</span>
                    </td>
                    <td class="px-6 py-4">${p.sales}</td>
                    <td class="px-6 py-4">
                        <button class="text-blue-600 hover:text-blue-800 mr-2"><i class="fas fa-edit"></i></button>
                        <button class="text-red-600 hover:text-red-800" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // C端：渲染小程序商品列表
        function renderMobileProducts() {
            const container = document.getElementById('mobile-product-list');
            container.innerHTML = '';
            products.forEach(p => {
                const div = document.createElement('div');
                div.className = "bg-white rounded-lg shadow-sm overflow-hidden flex flex-col";
                div.innerHTML = `
                    <div class="h-32 bg-gray-100 relative">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <h5 class="font-bold text-sm text-gray-800 line-clamp-2 mb-1">${p.name}</h5>
                        <div class="flex justify-between items-end mt-2">
                            <span class="text-red-800 font-bold">¥${p.price}</span>
                            <button class="w-6 h-6 bg-red-800 text-white rounded-full flex items-center justify-center text-xs hover:bg-red-900 transition" onclick="addToCart('${p.name}')">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // 交互：添加到购物车模拟
        function addToCart(productName) {
            // 简单的Toast提示
            const toast = document.createElement('div');
            toast.className = "fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black bg-opacity-70 text-white px-4 py-2 rounded-lg text-sm z-50 fade-in";
            toast.innerText = `已添加 ${productName} 到购物车`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
        }

        // 模态框控制
        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        // 表单处理：添加商品
        function handleAddProduct(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const newProduct = {
                id: Date.now(),
                name: formData.get('name'),
                price: parseFloat(formData.get('price')),
                stock: parseInt(formData.get('stock')),
                category: formData.get('category'),
                sales: 0,
                image: formData.get('image') || `https://picsum.photos/200/200?random=${Date.now()}`
            };
            
            products.unshift(newProduct);
            renderProductTable();
            renderMobileProducts();
            closeModal('addProductModal');
            e.target.reset();
            
            // 成功提示
            alert("商品上架成功！");
        }

        function deleteProduct(id) {
            if(confirm('确定要下架该商品吗？')) {
                products = products.filter(p => p.id !== id);
                renderProductTable();
                renderMobileProducts();
            }
        }

        // 图表初始化
        function initCharts() {
            // 销售趋势图
            const ctxSales = document.getElementById('salesChart').getContext('2d');
            new Chart(ctxSales, {
                type: 'line',
                data: {
                    labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                    datasets: [{
                        label: '本周销售额',
                        data: [8200, 9500, 11000, 10500, 14200, 18500, 16000],
                        borderColor: '#991b1b',
                        backgroundColor: 'rgba(153, 27, 27, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });

            // 品类占比图
            const ctxCategory = document.getElementById('categoryChart').getContext('2d');
            new Chart(ctxCategory, {
                type: 'doughnut',
                data: {
                    labels: ['珍藏版', '商务宴', '日常口粮', '礼盒装'],
                    datasets: [{
                        data: [30, 45, 20, 5],
                        backgroundColor: ['#991b1b', '#dc2626', '#ef4444', '#fca5a5'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    cutout: '70%',
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }
    </script>
</body>
</html>
