        }

            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        .search-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .form-group select,
        .form-group input,

            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-group button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .form-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .result-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
        }
        .card-title i {
            margin-right: 10px;
            color: #667eea;
        }
        .train-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .train-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .train-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .train-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .train-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #333;
        }
        .train-price {

            color: #e74c3c;
            font-size: 1.2rem;
        }

            font-size: 0.9rem;
            color: #666;
        }

        .attraction-list {

        }
        .attraction-item {
            background: linear-gradient(135deg, #fff5f5 0%, #ffe4e4 100%);

            padding: 20px;
            border-left: 4px solid #e74c3c;
        }

        }

            }
            .search-row {

            }

                font-size: 1.8rem;
            }
        }
    </style>
</head>

        function searchRoutes() {
            const dep = document.getElementById('departure').value;
            const dest = document.getElementById('destination').value;
            const date = document.getElementById('date').value;
            const budget = document.getElementById('budget').value;

            if (dep === dest) {
                alert('出发城市和目的城市不能相同！');
                return;
            }

            const resultsDiv = document.getElementById('results');
            resultsDiv.style.display = 'grid';

            const trains = trainData[dep]?.[dest] || [];
            const attractions = attractionData[dest] || [];

            displayTrains(trains);
            displayAttractions(attractions, budget);
        }

        function displayTrains(trains) {
            const trainList = document.getElementById('trainList');
            trainList.innerHTML = '';

            trains.forEach(train => {
                const item = document.createElement('div');
                item.className = 'train-item';
                item.innerHTML = `
                    <div class="train-header">
                        <span class="train-name">${train.name}</span>
                        <span class="train-price">¥${train.price}</span>
                    </div>
                    <div class="train-time">
                        <span>🚀 ${train.dep} - ${train.arr}</span>
                        <span class="train-duration">${train.dur}</span>
                    </div>
                `;
                trainList.appendChild(item);
            });
        }

        function displayAttractions(attractions, budget) {
            const attractionList = document.getElementById('attractionList');
            attractionList.innerHTML = '';

            const budgetLimits = {
                low: 1000,
                medium: 3000,
                high: 5000,
                luxury: Infinity,
            };
            const maxPrice = budgetLimits[budget];

            const filteredAttractions = attractions.filter(a => a.price <= maxPrice);

            filteredAttractions.forEach(attraction => {
                const item = document.createElement('div');
                item.className = 'attraction-item';
                item.innerHTML = `
                    <div class="attraction-header">
                        <span class="attraction-name">${attraction.name}</span>
                        <span class="attraction-level level-${attraction.level.toLowerCase()}">${attraction.level}</span>
                    </div>
                    <div class="attraction-info">
                        <span>💰 ¥${attraction.price}</span>
                        <span>📍 ${attraction.desc}</span>
                    </div>
                `;
                attractionList.appendChild(item);
            });
        }
