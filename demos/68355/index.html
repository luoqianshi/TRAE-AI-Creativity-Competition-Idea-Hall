<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>肌训智配 - 场地器械识别健身小程序</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #00d4ff;
      --secondary-color: #7c3aed;
      --accent-color: #06b6d4;
      --bg-dark: #0f172a;
      --bg-card: rgba(255, 255, 255, 0.05);
      --border-color: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .title {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }

    .subtitle {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
    }

    .phone-simulator {
      width: 320px;
      height: 640px;
      background: #1a1a1a;
      border-radius: 40px;
      padding: 20px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.1);
    }

    .phone-notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 25px;
      background: #000;
      border-radius: 0 0 20px 20px;
      z-index: 10;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      background: #0f172a;
      border-radius: 30px;
      overflow: hidden;
      position: relative;
    }

    .app-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      padding: 30px 15px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--border-color);
    }

    .app-header h4 {
      font-size: 16px;
      font-weight: 600;
    }

    .app-header span {
      font-size: 18px;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.6);
    }

    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .scan-area {
      width: 100%;
      height: 180px;
      border: 2px dashed var(--border-color);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      background: rgba(255, 255, 255, 0.02);
    }

    .scan-area:hover {
      border-color: var(--primary-color);
      background: rgba(0, 212, 255, 0.05);
    }

    .scan-area.scanning {
      border-color: var(--primary-color);
      animation: pulse 1s ease infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.4);
      }

      50% {
        box-shadow: 0 0 0 10px rgba(0, 212, 255, 0);
      }
    }

    .scan-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .scan-text {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
    }

    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
      animation: scan 2s linear infinite;
    }

    @keyframes scan {
      0% {
        top: 0;
      }

      100% {
        top: 100%;
      }
    }

    .recognized-equipment {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .equipment-item {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 15px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid transparent;
    }

    .equipment-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .equipment-item.selected {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--primary-color);
    }

    .equipment-icon {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .equipment-name {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
    }

    .btn {
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: #fff;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--primary-color);
    }

    .training-plan-preview {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 15px;
    }

    .plan-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .plan-action {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .plan-action:last-child {
      border-bottom: none;
    }

    .action-name {
      font-size: 14px;
      font-weight: 500;
    }

    .action-detail {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 3px;
    }

    .exercise-sets {
      font-size: 14px;
      color: var(--primary-color);
      font-weight: 600;
    }

    .nav-dots {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    .nav-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-dot.active {
      background: var(--primary-color);
      transform: scale(1.2);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="title">肌训智配</div>
    <div class="subtitle">场地器械识别健身小程序</div>

    <div class="phone-simulator">
      <div class="phone-notch"></div>
      <div class="phone-screen" id="phone-screen">
        <div id="screen-0" class="app-screen">
          <div class="app-header">
            <span>←</span>
            <h4>器械识别</h4>
            <span>✕</span>
          </div>
          <div class="app-content">
            <div class="scan-area" id="scan-area" onclick="startScan()">
              <div class="scan-icon">📷</div>
              <div class="scan-text">点击拍照识别</div>
              <div class="scan-line" style="display: none;" id="scan-line"></div>
            </div>
            <div class="recognized-equipment" id="equipment-list">
              <div class="equipment-item" onclick="toggleEquipment(this)">
                <div class="equipment-icon">🏋️</div>
                <div class="equipment-name">哑铃</div>
              </div>
              <div class="equipment-item" onclick="toggleEquipment(this)">
                <div class="equipment-icon">⚖️</div>
                <div class="equipment-name">杠铃</div>
              </div>
              <div class="equipment-item" onclick="toggleEquipment(this)">
                <div class="equipment-icon">🏗️</div>
                <div class="equipment-name">龙门架</div>
              </div>
              <div class="equipment-item" onclick="toggleEquipment(this)">
                <div class="equipment-icon">🔧</div>
                <div class="equipment-name">史密斯机</div>
              </div>
              <div class="equipment-item" onclick="toggleEquipment(this)">
                <div class="equipment-icon">🛏️</div>
                <div class="equipment-name">卧推架</div>
              </div>
              <div class="equipment-item" onclick="toggleEquipment(this)">
                <div class="equipment-icon">🔽</div>
                <div class="equipment-name">高位下拉</div>
              </div>
            </div>
            <button class="btn btn-primary" onclick="generatePlan()">生成训练方案</button>
            <button class="btn btn-secondary" onclick="switchPrototype(1)">查看方案示例</button>
          </div>
        </div>

        <div id="screen-1" class="app-screen" style="display: none;">
          <div class="app-header">
            <span>←</span>
            <h4>训练方案</h4>
            <span>✕</span>
          </div>
          <div class="app-content">
            <div class="training-plan-preview">
              <div class="plan-title">🏋️ 胸部训练 · 中级</div>
              <div class="plan-action">
                <div>
                  <div class="action-name">杠铃卧推</div>
                  <div class="action-detail">卧推架 + 杠铃</div>
                </div>
                <div class="exercise-sets">4×8-12</div>
              </div>
              <div class="plan-action">
                <div>
                  <div class="action-name">上斜哑铃飞鸟</div>
                  <div class="action-detail">上斜凳 + 哑铃</div>
                </div>
                <div class="exercise-sets">3×12-15</div>
              </div>
              <div class="plan-action">
                <div>
                  <div class="action-name">龙门架夹胸</div>
                  <div class="action-detail">龙门架</div>
                </div>
                <div class="exercise-sets">3×15-20</div>
              </div>
              <div class="plan-action">
                <div>
                  <div class="action-name">双杠臂屈伸</div>
                  <div class="action-detail">双杠</div>
                </div>
                <div class="exercise-sets">3×力竭</div>
              </div>
            </div>
            <button class="btn btn-primary">开始训练</button>
            <button class="btn btn-secondary" onclick="switchPrototype(2)">查看训练记录</button>
          </div>
        </div>

        <div id="screen-2" class="app-screen" style="display: none;">
          <div class="app-header">
            <span>←</span>
            <h4>训练记录</h4>
            <span>✕</span>
          </div>
          <div class="app-content">
            <div style="background: rgba(255,255,255,0.03); border-radius: 12px; padding: 15px; margin-bottom: 15px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div style="font-weight: 600;">本周训练统计</div>
                <div style="color: var(--primary-color);">7次</div>
              </div>
              <div style="display: flex; justify-content: space-around;">
                <div style="text-align: center;">
                  <div style="font-size: 20px; font-weight: 700; color: var(--primary-color);">35</div>
                  <div style="font-size: 12px; color: rgba(255,255,255,0.5);">训练动作</div>
                </div>
                <div style="text-align: center;">
                  <div style="font-size: 20px; font-weight: 700; color: var(--primary-color);">140</div>
                  <div style="font-size: 12px; color: rgba(255,255,255,0.5);">训练组数</div>
                </div>
                <div style="text-align: center;">
                  <div style="font-size: 20px; font-weight: 700; color: var(--primary-color);">6h</div>
                  <div style="font-size: 12px; color: rgba(255,255,255,0.5);">总时长</div>
                </div>
              </div>
            </div>
            <div style="background: rgba(255,255,255,0.03); border-radius: 12px; padding: 15px;">
              <div style="font-weight: 600; margin-bottom: 10px;">最近训练</div>
              <div style="padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 8px;">
                <div style="display: flex; justify-content: space-between;">
                  <span>🏋️ 胸部训练</span>
                  <span style="font-size: 12px; color: rgba(255,255,255,0.5);">昨天</span>
                </div>
              </div>
              <div style="padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 8px;">
                <div style="display: flex; justify-content: space-between;">
                  <span>🎯 背部训练</span>
                  <span style="font-size: 12px; color: rgba(255,255,255,0.5);">2天前</span>
                </div>
              </div>
              <div style="padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                <div style="display: flex; justify-content: space-between;">
                  <span>🦵 腿部训练</span>
                  <span style="font-size: 12px; color: rgba(255,255,255,0.5);">3天前</span>
                </div>
              </div>
            </div>
            <button class="btn btn-secondary" onclick="switchPrototype(0)">返回识别</button>
          </div>
        </div>
      </div>
    </div>

    <div class="nav-dots">
      <div class="nav-dot active" onclick="switchPrototype(0)"></div>
      <div class="nav-dot" onclick="switchPrototype(1)"></div>
      <div class="nav-dot" onclick="switchPrototype(2)"></div>
    </div>
  </div>

  <script>
    function startScan() {
      const scanArea = document.getElementById('scan-area');
      const scanLine = document.getElementById('scan-line');

      scanArea.classList.add('scanning');
      scanLine.style.display = 'block';

      setTimeout(() => {
        scanArea.classList.remove('scanning');
        scanLine.style.display = 'none';

        const equipmentItems = document.querySelectorAll('.equipment-item');
        equipmentItems.forEach(item => {
          if (Math.random() > 0.3) {
            item.classList.add('selected');
          }
        });
      }, 3000);
    }

    function toggleEquipment(item) {
      item.classList.toggle('selected');
    }

    function generatePlan() {
      const scanArea = document.getElementById('scan-area');
      scanArea.innerHTML = '<div style="font-size: 24px; text-align: center;">🤖<br><span style="font-size: 14px;">正在生成训练方案...</span></div>';

      setTimeout(() => {
        scanArea.innerHTML = `
          <div style="text-align: center; padding: 20px;">
            <div style="font-size: 32px; margin-bottom: 10px;">✅</div>
            <div style="font-size: 16px; font-weight: 600;">训练方案已生成</div>
            <div style="font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 5px;">胸部训练 · 5个动作</div>
          </div>
        `;
      }, 2000);
    }

    function switchPrototype(index) {
      const dots = document.querySelectorAll('.nav-dot');
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });

      const screens = document.querySelectorAll('.app-screen');
      screens.forEach((screen, i) => {
        screen.style.display = i === index ? 'flex' : 'none';
      });
    }
  </script>
</body>

</html>
