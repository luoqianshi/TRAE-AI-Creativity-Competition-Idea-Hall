<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EchoBloom · 回声花</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "PingFang SC", "SF Pro Text", -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(160deg, #0b0714 0%, #1a1330 50%, #2a1f3f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #eeddff;
    }
    .phone-frame {
      width: 100%;
      max-width: 400px;
      background: rgba(18, 10, 32, 0.75);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 48px;
      padding: 30px 22px 36px;
      box-shadow: 0 35px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(200, 150, 255, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .ambient-glow {
      position: absolute;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(160, 100, 255, 0.3), transparent 70%);
      top: -40px;
      right: -40px;
      border-radius: 50%;
      filter: blur(20px);
      pointer-events: none;
    }
    h1 {
      font-size: 34px;
      font-weight: 700;
      background: linear-gradient(135deg, #e8d5ff, #b48aff, #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
      margin-bottom: 6px;
      z-index: 2;
    }
    .subtitle {
      font-size: 15px;
      color: #b9a4d4;
      font-style: italic;
      margin-bottom: 28px;
      z-index: 2;
    }
    .record-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #8b5cf6, #3d1f82);
      box-shadow: 0 0 40px rgba(140, 80, 255, 0.6), 0 0 0 6px rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      color: white;
      letter-spacing: 2px;
      cursor: pointer;
      transition: 0.3s ease;
      margin-bottom: 28px;
      z-index: 2;
      position: relative;
    }
    .record-circle::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.3);
      animation: pulse-ring 2s infinite ease-out;
    }
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    .record-circle:active {
      transform: scale(0.92);
    }
    .garden-area {
      width: 100%;
      height: 200px;
      background: rgba(0,0,0,0.4);
      border-radius: 30px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      z-index: 2;
      margin-bottom: 18px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .flower-name {
      font-size: 24px;
      font-weight: 600;
      background: linear-gradient(135deg, #ffcfef, #deaaff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 4px;
      z-index: 2;
    }
    .flower-meaning {
      color: #c2addb;
      font-size: 15px;
      margin-bottom: 6px;
      text-align: center;
    }
    .sound-tag {
      font-size: 13px;
      color: #9b85bb;
      background: rgba(200, 180, 255, 0.12);
      padding: 4px 14px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 4px;
    }
    .hint-text {
      font-size: 12px;
      color: #6d5e8c;
      margin-top: 14px;
      text-align: center;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="ambient-glow"></div>
    <h1>EchoBloom</h1>
    <div class="subtitle">🎧 让每个声音开出一朵花</div>
    
    <div class="record-circle" id="recordBtn">录制</div>
    
    <div class="garden-area" id="gardenContainer">
      <canvas id="flowerCanvas"></canvas>
    </div>
    
    <div class="flower-name" id="flowerName">等待绽放…</div>
    <div class="flower-meaning" id="flowerMeaning">按下录制，捕捉身边的声音</div>
    <div class="sound-tag" id="soundOrigin">🌱 声之种</div>
    <div class="hint-text">已保存至你的声景花园 · 长按赠送好友</div>
  </div>

  <script>
    const recordBtn = document.getElementById('recordBtn');
    const canvas = document.getElementById('flowerCanvas');
    const ctx = canvas.getContext('2d');
    const flowerNameEl = document.getElementById('flowerName');
    const flowerMeaningEl = document.getElementById('flowerMeaning');
    const soundOriginEl = document.getElementById('soundOrigin');
    
    let animationId;
    let bloomPhase = 0; // 0 到 1，开花进度
    let particles = [];
    
    const flowerPresets = [
      { name: '雨铃兰', meaning: '细腻的等待', origin: '雨打玻璃', colors: ['#b8d4ff','#8bb6ff','#cfe2ff'] },
      { name: '笑浪花', meaning: '瞬间的共鸣', origin: '好友笑声', colors: ['#ffb3ba','#ff8fa3','#ffc2d1'] },
      { name: '夜息莲', meaning: '深沉的安宁', origin: '呼吸声', colors: ['#cfbaf0','#a084dc','#e6d9ff'] },
      { name: '风信羽', meaning: '自由的轻语', origin: '穿过树叶的风', colors: ['#b7e4c7','#74c69d','#d8f3dc'] },
      { name: '轨鸣兰', meaning: '城市的脉搏', origin: '地铁报站', colors: ['#f9c74f','#f8961e','#ffe5b4'] }
    ];
    
    function resizeCanvas() {
      const container = document.getElementById('gardenContainer');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }
    
    function initParticles(colorPalette) {
      particles = [];
      for (let i = 0; i < 80; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 30 + Math.random() * 50;
        particles.push({
          baseX: canvas.width/2,
          baseY: canvas.height/2,
          angle: angle,
          dist: dist,
          size: 1.5 + Math.random() * 3.5,
          color: colorPalette[Math.floor(Math.random() * colorPalette.length)],
          speed: 0.005 + Math.random() * 0.02,
          offset: Math.random() * Math.PI * 2
        });
      }
    }
    
    function drawFlower(phase) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // 中心光晕
      const glow = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 5, canvas.width/2, canvas.height/2, 40);
      glow.addColorStop(0, 'rgba(230,210,255,0.8)');
      glow.addColorStop(1, 'rgba(160,120,255,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0,0,canvas.width,canvas.height);
      
      // 绘制粒子花瓣
      particles.forEach(p => {
        const angleShift = Math.sin(Date.now() * 0.002 + p.offset) * 0.1;
        const currentDist = p.dist * (0.5 + phase * 0.5);
        const x = p.baseX + Math.cos(p.angle + angleShift) * currentDist;
        const y = p.baseY + Math.sin(p.angle + angleShift) * currentDist * 0.7; // 轻微椭圆
        
        ctx.beginPath();
        ctx.arc(x, y, p.size * (0.6 + phase * 0.4), 0, Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      });
      
      // 花蕊
      ctx.beginPath();
      ctx.arc(canvas.width/2, canvas.height/2, 8 + phase*4, 0, Math.PI*2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    
    function animate() {
      if (bloomPhase < 1) {
        bloomPhase += 0.008;
        if (bloomPhase > 1) bloomPhase = 1;
      }
      drawFlower(bloomPhase);
      animationId = requestAnimationFrame(animate);
    }
    
    function startNewFlower(preset) {
      cancelAnimationFrame(animationId);
      bloomPhase = 0;
      initParticles(preset.colors);
      flowerNameEl.textContent = preset.name;
      flowerMeaningEl.textContent = preset.meaning;
      soundOriginEl.textContent = '🎵 ' + preset.origin;
      animate();
    }
    
    recordBtn.addEventListener('click', function() {
      // 模拟录制后随机选择一朵花
      const preset = flowerPresets[Math.floor(Math.random() * flowerPresets.length)];
      startNewFlower(preset);
      recordBtn.textContent = '聆听';
      setTimeout(() => { recordBtn.textContent = '录制'; }, 1200);
    });
    
    window.addEventListener('load', () => {
      resizeCanvas();
      // 初始显示一朵默认花
      startNewFlower(flowerPresets[0]);
    });
    window.addEventListener('resize', resizeCanvas);
  </script>
</body>
</html>
