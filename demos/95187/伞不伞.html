<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>伞不伞</title>
  <style>
    :root {
      --bg-primary: #F0F5FA;
      --bg-card: #FFFFFF;
      --text-primary: #2D3748;
      --text-secondary: #718096;
      --border: #E2E8F0;
      --accent-sun: #6EC1E4;
      --accent-cloud: #A0B8D3;
      --accent-rain: #4A90E2;
      --accent-alert: #FF6B35;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
      --radius: 16px;
      --transition: background-color 0.3s ease, color 0.3s ease;
    }

    .dark-mode {
      --bg-primary: #1A202C;
      --bg-card: #2D3748;
      --text-primary: #E2E8F0;
      --text-secondary: #A0B8D3;
      --border: #4A5568;
      --accent-sun: #4FD1C5;
      --accent-cloud: #7EC8E3;
      --accent-rain: #63B3ED;
      --accent-alert: #F6AD55;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 1.5rem 1rem;
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, var(--accent-sun), var(--accent-rain));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
      transition: var(--transition);
    }

    .status-card {
      text-align: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .status-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .status-card:hover .status-icon {
      transform: scale(1.05);
    }

    .status-title {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
    }

    .status-desc {
      font-size: 1.1rem;
      color: var(--text-secondary);
      max-width: 500px;
      margin: 0 auto;
    }

    .path-section {
      margin-top: 1rem;
    }

    .label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg-card);
      color: var(--text-primary);
      transition: var(--transition);
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-rain);
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
    }

    .btn {
      display: inline-block;
      background: var(--accent-rain);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 0.5rem;
      box-shadow: 0 2px 6px rgba(74, 144, 226, 0.2);
    }

    .btn:hover {
      background: #3a7bc8;
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(74, 144, 226, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .result-area {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px dashed var(--border);
      display: none;
    }

    .result-title {
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
    }

    .result-text {
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--text-primary);
    }

    .result-highlight {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
    }

    .highlight-sun {
      background: rgba(110, 193, 228, 0.15);
      color: var(--accent-sun);
    }

    .highlight-rain {
      background: rgba(74, 144, 226, 0.15);
      color: var(--accent-rain);
    }

    .highlight-alert {
      background: rgba(255, 107, 53, 0.15);
      color: var(--accent-alert);
    }

    .theme-toggle {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: all 0.3s ease;
      color: var(--text-primary);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    .sun-icon, .moon-icon {
      font-size: 1.2rem;
      transition: opacity 0.3s ease;
    }

    .dark-mode .sun-icon { opacity: 0; }
    .dark-mode .moon-icon { opacity: 1; }

    .light-mode .sun-icon { opacity: 1; }
    .light-mode .moon-icon { opacity: 0; }

    footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    /* Responsive */
    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .status-icon {
        font-size: 2.8rem;
      }
      .card {
        padding: 1.25rem;
      }
    }

    @media (max-width: 420px) {
      h1 {
        font-size: 1.4rem;
      }
      .status-icon {
        font-size: 2.4rem;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body class="light-mode">
  <div class="theme-toggle" id="themeToggle">
    <span class="sun-icon">☀️</span>
    <span class="moon-icon">🌙</span>
  </div>

  <div class="container">
    <header>
      <h1>伞不伞</h1>
      <p class="subtitle">出门前3秒确认——不用查App，不猜图标，只看一句人话提示</p>
    </header>

    <main>
      <section class="card status-card">
        <div class="status-icon" id="statusIcon">🌤️</div>
        <h2 class="status-title" id="statusTitle">今天别带伞</h2>
        <p class="status-desc" id="statusDesc">梧桐路全程有棚，地铁口到公司步行段无雨，放心出发</p>
      </section>

      <section class="card">
        <h2 class="status-title">你的常走路线</h2>
        <p class="status-desc">请输入你最常走的1条露天通勤路段（如：小区东门→地铁2号口）</p>
        
        <div class="path-section">
          <label class="label" for="commutePath">路线描述</label>
          <input type="text" id="commutePath" placeholder="例：菜市场西门→老年活动站南门" value="家→地铁3号口">
        </div>

        <button class="btn" id="simulateBtn">▶ 3秒模拟决策</button>

        <div class="result-area" id="resultArea">
          <h3 class="result-title">智能判断结果</h3>
          <p class="result-text">
            根据你常走的 <span class="result-highlight highlight-rain">「家→地铁3号口」</span> 路段，
            结合未来2小时雷达图与体感湿度预测：
            <br><br>
            <span class="result-highlight highlight-alert">建议带伞</span> —— 该路段10:15–10:28有短时阵雨（概率72%），无遮蔽。
          </p>
        </div>
      </section>
    </main>

    <footer>
      <p>基于本地气象逻辑模拟｜无需联网｜不采集位置｜纯前端运行</p>
    </footer>
  </div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    themeToggle.addEventListener('click', () => {
      if (body.classList.contains('light-mode')) {
        body.classList.remove('light-mode');
        body.classList.add('dark-mode');
      } else {
        body.classList.remove('dark-mode');
        body.classList.add('light-mode');
      }
    });

    // 模拟决策交互
    const simulateBtn = document.getElementById('simulateBtn');
    const resultArea = document.getElementById('resultArea');
    const commutePath = document.getElementById('commutePath');
    const statusIcon = document.getElementById('statusIcon');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');

    simulateBtn.addEventListener('click', () => {
      const path = commutePath.value.trim() || '家→地铁3号口';
      const isRainy = Math.random() > 0.6; // 模拟降水概率
      const hasCover = path.includes('棚') || path.includes('地铁') || path.includes('地下') || path.includes('商场');

      let icon, title, desc, highlightClass, highlightText;

      if (isRainy && !hasCover) {
        icon = '🌧️';
        title = '建议带伞';
        desc = `「${path}」路段未来1.5小时有阵雨，无遮蔽，请带伞`;
        highlightClass = 'highlight-alert';
        highlightText = '建议带伞';
      } else if (!isRainy || hasCover) {
        icon = '🌤️';
        title = '今天别带伞';
        desc = `${hasCover ? '该路段全程有棚' : '当前无降水'}，轻松出门`;
        highlightClass = 'highlight-sun';
        highlightText = '别带伞';
      } else {
        icon = '⛅';
        title = '可带可不带';
        desc = `「${path}」路段边缘有云，带折叠伞更安心`;
        highlightClass = 'highlight-cloud';
        highlightText = '可带可不带';
      }

      // 更新顶部状态卡
      statusIcon.textContent = icon;
      statusTitle.textContent = title;
      statusDesc.textContent = desc;

      // 更新结果区
      const resultText = document.querySelector('.result-text');
      resultText.innerHTML = `
        根据你常走的 <span class="result-highlight ${highlightClass}">「${path}」</span> 路段，
        结合未来2小时雷达图与体感湿度预测：<br><br>
        <span class="result-highlight ${highlightClass}">${highlightText}</span> —— ${desc}
      `;

      resultArea.style.display = 'block';

      // 滚动到结果
      resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    // 页面加载后默认执行一次模拟（模拟首次打开）
    window.addEventListener('DOMContentLoaded', () => {
      simulateBtn.click();
    });
  </script>
</body>
</html>
