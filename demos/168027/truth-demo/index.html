<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>证见</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo">
      <div class="logo-icon">&#x2696;</div>
      <span>证见</span>
    </a>
    <div class="nav-links">
      <a href="index.html" class="active">问题列表</a>
      <a href="#">发起辩论</a>
      <a href="#">关于</a>
    </div>
  </div>
</nav>

<div class="container">

  <!-- Hero -->
  <div class="hero">
    <h1>不是权威告诉你真相<br>而是证据链自己说话</h1>
    <p>多 AI 协同辩论，用户共同参与，用完整证据链还原每一个争议话题的真相</p>
    <div class="hero-tags">
      <span class="pill pill-accent">&#x2713; 已证实</span>
      <span class="pill pill-green">&#x2717; 已辟谣</span>
      <span class="pill pill-blue">&#x26A0; 存在争议</span>
      <span class="pill pill-purple">&#x2753; 信息不足</span>
    </div>
  </div>

  <!-- 筛选 -->
  <div class="filter-bar">
    <button class="active" data-filter="all">全部</button>
    <button data-filter="verified">已证实</button>
    <button data-filter="debunked">已辟谣</button>
    <button data-filter="disputed">存在争议</button>
    <button data-filter="insufficient">信息不足</button>
  </div>

  <!-- 问题列表 -->
  <div class="issue-list" id="issueList"></div>

</div>

<footer class="site-footer">
  <p>证见 Demo &nbsp;|&nbsp; 多 AI 协同 x 用户参与</p>
</footer>

<script src="js/data.js"></script>
<script>
(function() {
  const listEl = document.getElementById('issueList');
  const filterBtns = document.querySelectorAll('.filter-bar button');

  function renderIssues(filter) {
    listEl.innerHTML = '';
    const filtered = filter === 'all' ? issues : issues.filter(i => i.status === filter);
    filtered.forEach(issue => {
      const card = document.createElement('div');
      card.className = 'card card-hover issue-card';
      card.onclick = () => { window.location.href = 'detail.html?id=' + issue.id; };
      card.innerHTML = `
        <div class="issue-left">
          <div class="issue-score">${issue.confidence}%</div>
          <div class="issue-votes">${issue.votes} 人关注</div>
        </div>
        <div class="issue-body">
          <div class="issue-title">${issue.title}</div>
          <div class="issue-meta">
            <span class="status-tag ${getStatusClass(issue.status)}">${issue.statusLabel}</span>
            <span class="pill pill-gray">${issue.proCount} 条正方论据</span>
            <span class="pill pill-gray">${issue.conCount} 条反方论据</span>
            <span style="font-size:0.75rem;color:var(--muted);">${issue.date}</span>
          </div>
          <div class="issue-summary">${issue.summary || ''}</div>
          <div class="issue-desc">${issue.desc}</div>
        </div>
        <div class="issue-right">
          <span style="font-size:0.75rem;color:var(--muted);">裁判 AI</span>
          <div style="display:flex;gap:0.25rem;">
            ${issue.aiJudges.map(j => `<span class="pill pill-purple" style="font-size:0.65rem;padding:0.15rem 0.4rem;">${j}</span>`).join('')}
          </div>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderIssues(btn.dataset.filter);
    });
  });

  renderIssues('all');
})();
</script>

</body>
</html>
