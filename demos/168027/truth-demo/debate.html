<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>辩论详情 - 证见</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo">
      <div class="logo-icon">&#x2696;</div>
      <span>证见</span>
    </a>
    <div class="nav-links">
      <a href="index.html">问题列表</a>
      <a href="#">发起辩论</a>
      <a href="#">关于</a>
    </div>
  </div>
</nav>

<div class="container" id="debateContainer">
  <!-- 动态渲染 -->
</div>

<footer class="site-footer">
  <p>证见 Demo &nbsp;|&nbsp; 多 AI 协同 x 用户参与</p>
</footer>

<script src="js/data.js"></script>
<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const issueId = parseInt(params.get('id'));
  const issue = getIssueById(issueId);
  const container = document.getElementById('debateContainer');

  if (!issue) {
    container.innerHTML = '<div class="card"><p>问题未找到</p><a href="index.html">返回列表</a></div>';
    return;
  }

  // 辩论消息渲染
  const proMessages = issue.debate.filter(d => d.side === 'pro').map(d => `
    <div class="debate-msg pro">
      <div class="msg-author">
        <span class="badge badge-pro">${d.author}</span>
      </div>
      <div class="msg-content">${d.content}</div>
      ${d.source ? `<div class="msg-source">来源: <a href="${d.source}" target="_blank">${d.source}</a></div>` : ''}
    </div>
  `).join('');

  const conMessages = issue.debate.filter(d => d.side === 'con').map(d => `
    <div class="debate-msg con">
      <div class="msg-author">
        <span class="badge badge-con">${d.author}</span>
      </div>
      <div class="msg-content">${d.content}</div>
      ${d.source ? `<div class="msg-source">来源: <a href="${d.source}" target="_blank">${d.source}</a></div>` : ''}
    </div>
  `).join('');

  // 子主题辩论
  let subTopicHTML = '';
  const evid = params.get('evid');
  if (evid) {
    const findEvidence = (nodes, id) => {
      for (const n of nodes) {
        if (n.id === id) return n;
        if (n.children) {
          const found = findEvidence(n.children, id);
          if (found) return found;
        }
      }
      return null;
    };
    const target = findEvidence([...issue.evidences.pro, ...issue.evidences.con], evid);
    if (target && target.children && target.children.length) {
      subTopicHTML = `
        <div class="card" style="margin:1.5rem 0;">
          <h3 style="margin-bottom:1rem;">&#x1F4AC; 子主题辩论：${target.title}</h3>
          <div id="subTree"></div>
        </div>
      `;
    }
  }

  container.innerHTML = `
    <div style="margin-bottom:1.5rem;">
      <a href="detail.html?id=${issue.id}" style="color:var(--muted);font-size:0.85rem;">&#x2190; 返回问题详情</a>
      <h2 style="margin-top:0.5rem;margin-bottom:0.25rem;">${issue.title}</h2>
      <div style="display:flex;gap:0.5rem;align-items:center;">
        <span class="status-tag ${getStatusClass(issue.status)}">${issue.statusLabel}</span>
        <span style="font-size:0.8rem;color:var(--muted);">置信度 ${issue.confidence}%</span>
      </div>
    </div>

    <div class="debate-layout">
      <div class="debate-col pro">
        <div class="debate-col-header">&#x25B6; 正方观点</div>
        <div class="debate-col-body">
          ${proMessages || '<p style="color:var(--muted);font-size:0.85rem;text-align:center;padding:2rem 0;">暂无正方发言</p>'}
        </div>
        <div class="debate-input">
          <textarea placeholder="作为正方补充论据..."></textarea>
          <div class="input-actions">
            <span style="font-size:0.75rem;color:var(--muted);">支持该主张的论据</span>
            <button class="btn btn-primary btn-small">提交</button>
          </div>
        </div>
      </div>

      <div class="debate-col con">
        <div class="debate-col-header">&#x25C0; 反方观点</div>
        <div class="debate-col-body">
          ${conMessages || '<p style="color:var(--muted);font-size:0.85rem;text-align:center;padding:2rem 0;">暂无反方发言</p>'}
        </div>
        <div class="debate-input">
          <textarea placeholder="作为反方提出质疑..."></textarea>
          <div class="input-actions">
            <span style="font-size:0.75rem;color:var(--muted);">反对该主张的论据</span>
            <button class="btn btn-primary btn-small">提交</button>
          </div>
        </div>
      </div>
    </div>

    ${subTopicHTML}

    <div style="display:flex;gap:0.75rem;margin:1.5rem 0;justify-content:center;">
      <a href="detail.html?id=${issue.id}" class="btn btn-outline">&#x2190; 返回详情</a>
    </div>
  `;

  // 渲染子主题树
  if (evid) {
    const findEvidence = (nodes, id) => {
      for (const n of nodes) {
        if (n.id === id) return n;
        if (n.children) {
          const found = findEvidence(n.children, id);
          if (found) return found;
        }
      }
      return null;
    };
    const target = findEvidence([...issue.evidences.pro, ...issue.evidences.con], evid);
    if (target && target.children) {
      const subTree = document.getElementById('subTree');
      if (subTree) renderTree(target.children, subTree);
    }
  }
})();
</script>

</body>
</html>
