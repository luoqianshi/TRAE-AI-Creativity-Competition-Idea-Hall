<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>剑影江湖·无尽割草</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'GameFont';src:local('KaiTi'),local('STKaiti'),local('SimSun'),local('serif')}
:root{
  --ink:#3c2415;--ink-light:#5c3a24;--paper:#f5e6c8;--paper-dark:#d4b896;
  --gold:#c9a44b;--red:#c0392b;--jade:#2e7d5e;--text:#2c1810;
  --card-bg:rgba(245,230,200,0.95);--border:2px solid var(--ink);
}
html,body{width:100%;height:100%}
body{
  background:#1a0f07;overflow:hidden;font-family:'GameFont',serif;
  touch-action:none;user-select:none;-webkit-user-select:none;
  width:100vw;height:100vh;height:100dvh;
}
#game-container{
  position:relative;width:100%;height:100%;
  display:flex;justify-content:center;align-items:center;
}
canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%;z-index:0}

/* HUD */
#hud{
  position:absolute;top:0;left:0;right:0;z-index:10;pointer-events:none;
  padding:8px 12px;
}
.hud-top{
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(30,12,4,0.85);border-bottom:2px solid var(--gold);
  border-radius:0 0 8px 8px;padding:6px 14px;
  color:var(--paper);font-size:14px;gap:8px;flex-wrap:wrap;
}
.hud-top span{white-space:nowrap}
.hud-top .time{color:var(--gold)}
.hud-top .kills{color:#e74c3c}
.hud-top .level{color:#2ecc71}
.hp-bar-outer{
  flex:1;min-width:80px;height:14px;background:rgba(0,0,0,0.5);
  border:1px solid var(--ink-light);border-radius:7px;overflow:hidden;
}
.hp-bar-inner{
  height:100%;background:linear-gradient(90deg,#e74c3c,#c0392b);
  transition:width 0.2s;border-radius:7px;
}
.exp-bar-outer{
  flex:1;min-width:80px;height:8px;background:rgba(0,0,0,0.5);
  border:1px solid var(--ink-light);border-radius:4px;overflow:hidden;
}
.exp-bar-inner{
  height:100%;background:linear-gradient(90deg,#f1c40f,#f39c12);
  transition:width 0.2s;border-radius:4px;
}

/* Weapon icons */
#weapon-bar{
  position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:10;
  display:flex;gap:4px;flex-wrap:wrap;justify-content:center;pointer-events:none;
  max-width:90vw;
}
.weapon-icon{
  width:36px;height:36px;background:rgba(30,12,4,0.8);border:1px solid var(--gold);
  border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--paper);flex-direction:column;line-height:1;
}
.weapon-icon .lvl{font-size:9px;color:var(--gold)}

/* Overlay screens */
.overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;z-index:100;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;
}
.title-bg{
  background:linear-gradient(180deg,rgba(20,8,2,0.92) 0%,rgba(40,16,6,0.95) 100%);
}
.title-logo{
  font-size:clamp(32px,6vw,56px);color:var(--gold);letter-spacing:8px;
  text-shadow:2px 2px 4px rgba(0,0,0,0.7),0 0 20px rgba(201,164,75,0.3);
  margin-bottom:12px;font-weight:bold;
}
.title-sub{
  font-size:clamp(14px,2.5vw,20px);color:var(--paper-dark);
  letter-spacing:4px;margin-bottom:32px;
}
.btn{
  background:linear-gradient(180deg,var(--paper) 0%,var(--paper-dark) 100%);
  color:var(--ink);border:2px solid var(--ink);padding:12px 40px;
  font-size:18px;font-family:inherit;cursor:pointer;letter-spacing:4px;
  border-radius:4px;margin:6px;transition:all 0.15s;
  min-width:160px;text-align:center;
}
.btn:hover{background:var(--gold);color:#1a0f07;border-color:var(--gold)}
.btn:active{transform:scale(0.96)}
.btn-sm{padding:8px 20px;font-size:14px;min-width:auto}
.record-text{color:var(--paper);font-size:14px;margin-bottom:16px;opacity:0.8}

/* Character select */
.char-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.char-card{
  background:var(--card-bg);border:var(--border);border-radius:8px;
  padding:16px;width:180px;cursor:pointer;transition:all 0.2s;
  text-align:center;
}
.char-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(201,164,75,0.4);border-color:var(--gold)}
.char-card .name{font-size:20px;color:var(--ink);margin-bottom:4px;font-weight:bold}
.char-card .icon{font-size:40px;margin-bottom:8px}
.char-card .desc{font-size:12px;color:var(--ink-light);line-height:1.4}
.char-card .stat{font-size:11px;color:var(--ink-light);margin-top:6px}

/* Level up panel */
#level-up-panel{
  position:absolute;top:0;left:0;width:100%;height:100%;z-index:200;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.7);
}
.level-up-inner{
  background:var(--card-bg);border:3px solid var(--gold);border-radius:12px;
  padding:20px;max-width:700px;width:90%;text-align:center;
}
.level-up-title{
  font-size:24px;color:var(--gold);letter-spacing:4px;margin-bottom:16px;
}
.level-up-choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.level-up-card{
  background:rgba(255,255,255,0.6);border:2px solid var(--ink-light);
  border-radius:8px;padding:14px;width:180px;cursor:pointer;
  transition:all 0.15s;text-align:center;
}
.level-up-card:hover{background:var(--gold);border-color:var(--gold);color:#1a0f07}
.level-up-card .wname{font-size:16px;font-weight:bold;color:var(--ink);margin-bottom:4px}
.level-up-card .wlevel{font-size:12px;color:var(--jade);margin-bottom:4px}
.level-up-card .wdesc{font-size:11px;color:var(--ink-light);line-height:1.3}
.level-up-card .wtype{font-size:10px;color:var(--red);margin-top:2px}

/* Game over */
.game-over-stats{text-align:center;color:var(--paper);margin:12px 0;line-height:2}
.game-over-stats .stat-num{color:var(--gold);font-size:22px;font-weight:bold}

/* Pause */
#pause-menu{display:none}

/* Minimap */
#minimap{
  position:absolute;bottom:12px;right:12px;z-index:10;pointer-events:none;
  width:120px;height:120px;background:rgba(0,0,0,0.6);border:2px solid var(--gold);
  border-radius:4px;
}
#minimap canvas{width:100%;height:100%;position:static}

/* Virtual joystick */
#virtual-joystick{
  position:absolute;bottom:40px;left:40px;z-index:50;display:none;
  width:120px;height:120px;
}
#joystick-base{
  width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,0.15);
  border:2px solid rgba(255,255,255,0.3);position:relative;
}
#joystick-thumb{
  width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.5);
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  transition:background 0.1s;
}

/* Mobile styles */
@media(max-width:768px){
  #virtual-joystick{display:block}
  .hud-top{font-size:11px;padding:4px 8px}
  .char-card{width:140px;padding:10px}
  .btn{font-size:15px;padding:10px 24px;min-width:120px}
  #minimap{width:80px;height:80px;bottom:8px;right:8px}
  .level-up-card{width:140px;padding:10px}
  #weapon-bar{top:56px}
}
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <!-- HUD -->
  <div id="hud" style="display:none">
    <div class="hud-top">
      <span class="time">⏱ 00:00</span>
      <span class="kills">💀 0</span>
      <span class="level">⭐ Lv.1</span>
      <div class="hp-bar-outer"><div class="hp-bar-inner" style="width:100%"></div></div>
      <div class="exp-bar-outer"><div class="exp-bar-inner" style="width:0%"></div></div>
    </div>
  </div>
  <div id="weapon-bar" style="display:none"></div>
  <div id="minimap" style="display:none"></div>

  <!-- Title screen -->
  <div id="title-screen" class="overlay title-bg">
    <div class="title-logo">剑影江湖</div>
    <div class="title-sub">无 尽 割 草</div>
    <div class="record-text" id="title-record"></div>
    <button class="btn" onclick="game.startCharacterSelect()">开始游戏</button>
    <button class="btn btn-sm" onclick="game.startGame()" style="margin-top:4px">快速开始</button>
  </div>

  <!-- Character select -->
  <div id="char-select" class="overlay title-bg" style="display:none">
    <div style="font-size:24px;color:var(--gold);letter-spacing:4px;margin-bottom:20px">选 择 角 色</div>
    <div class="char-cards" id="char-cards"></div>
    <button class="btn btn-sm" onclick="game.showTitle()">返回</button>
  </div>

  <!-- Level up -->
  <div id="level-up-panel">
    <div class="level-up-inner">
      <div class="level-up-title">⚔ 武学突破 ⚔</div>
      <div style="color:var(--ink);margin-bottom:12px;font-size:14px">选择一项武功/心法提升</div>
      <div class="level-up-choices" id="level-up-choices"></div>
    </div>
  </div>

  <!-- Game over -->
  <div id="game-over" class="overlay" style="display:none;background:rgba(0,0,0,0.85)">
    <div style="font-size:28px;color:var(--red);letter-spacing:4px;margin-bottom:16px">英 雄 陨 落</div>
    <div class="game-over-stats" id="game-over-stats"></div>
    <button class="btn" onclick="game.restart()">再来一局</button>
    <button class="btn btn-sm" onclick="game.showTitle()">返回主页</button>
  </div>

  <!-- Pause -->
  <div id="pause-menu" class="overlay" style="display:none;background:rgba(0,0,0,0.7)">
    <div style="font-size:28px;color:var(--gold);letter-spacing:4px;margin-bottom:24px">暂 停</div>
    <button class="btn" onclick="game.resume()">继续游戏</button>
    <button class="btn btn-sm" onclick="game.restart()">重新开始</button>
    <button class="btn btn-sm" onclick="game.showTitle()">返回主页</button>
  </div>

  <!-- Virtual joystick -->
  <div id="virtual-joystick">
    <div id="joystick-base">
      <div id="joystick-thumb"></div>
    </div>
  </div>
</div>

<script>
// ==================== 工具函数 ====================
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function norm(v){const m=Math.hypot(v.x,v.y);return m>0?{x:v.x/m,y:v.y/m}:{x:0,y:0}}
function rrange(min,max){return min+Math.random()*(max-min)}
function rint(min,max){return Math.floor(rrange(min,max+1))}
function rpick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function lerp(a,b,t){return a+(b-a)*t}

// ==================== 常量 ====================
const WORLD_W=1600,WORLD_H=1600;
const CELL_SIZE=200;
const GRID_COLS=Math.ceil(WORLD_W/CELL_SIZE);
const GRID_ROWS=Math.ceil(WORLD_H/CELL_SIZE);

// ==================== 武器定义 ====================
const WEAPON_DEFS={
  yujianshu:{name:'御剑术',desc:'环绕飞剑自动攻击',type:'active',ptype:'orbit',maxLvl:5,
    getCooldown(l){return 1.5-l*0.15},getDamage(l){return 12+l*5},getCount(l){return 1+l},icon:'🗡'},
  daoqi:{name:'刀气纵横',desc:'前方扇形刀气',type:'active',ptype:'cone',maxLvl:5,
    getCooldown(l){return 2.0-l*0.2},getDamage(l){return 18+l*7},getCount(l){return 3+l},icon:'⚔'},
  manhua:{name:'漫天花雨',desc:'全屏散射暗器',type:'active',ptype:'scatter',maxLvl:5,
    getCooldown(l){return 1.8-l*0.15},getDamage(l){return 8+l*3},getCount(l){return 8+l*4},icon:'💮'},
  pili:{name:'霹雳掌',desc:'冲击波攻击最近敌人',type:'active',ptype:'target_nearest',maxLvl:5,
    getCooldown(l){return 1.2-l*0.12},getDamage(l){return 20+l*8},getCount(l){return 1+l},icon:'👊'},
  duwu:{name:'毒雾阵',desc:'自身周围毒雾光环',type:'active',ptype:'aoe_circle',maxLvl:5,
    getCooldown(l){return 0.5},getDamage(l){return 5+l*3},getCount(l){return 1},getRadius(l){return 80+l*20},icon:'☠'},
  bingpo:{name:'冰魄银针',desc:'追踪最近敌人并减速',type:'active',ptype:'target_nearest',maxLvl:5,
    getCooldown(l){return 0.8-l*0.08},getDamage(l){return 10+l*4},getCount(l){return 1+l},icon:'❄',
    slow:0.4,slowDur:1.5},
  wanjian:{name:'万剑归宗',desc:'全屏落剑(高伤害)',type:'active',ptype:'global_strike',maxLvl:5,
    getCooldown(l){return 4.0-l*0.4},getDamage(l){return 35+l*15},getCount(l){return 4+l*2},icon:'⚡'},
  fengjuan:{name:'风卷残云',desc:'龙卷风随机游走',type:'active',ptype:'random_walk',maxLvl:5,
    getCooldown(l){return 3.0-l*0.3},getDamage(l){return 15+l*6},getCount(l){return 1+Math.floor(l/2)},icon:'🌪'},
  jianling:{name:'剑灵护体',desc:'召唤剑灵守护',type:'active',ptype:'summon',maxLvl:3,
    getCooldown(l){return 0},getDamage(l){return 10+l*5},getCount(l){return 1+l},icon:'👻'},
  fenshen:{name:'影分身',desc:'分身继承伤害',type:'active',ptype:'summon',maxLvl:3,
    getCooldown(l){return 0},getDamage(l){return 0},getCount(l){return 1+l},icon:'👥',inheritDmg:0.5},
};
const PASSIVE_DEFS={
  jiuyang:{name:'九阳神功',desc:'攻击力提升',maxLvl:5,getVal(l){return 0.15*l},icon:'☀'},
  lingbo:{name:'凌波微步',desc:'移动速度提升',maxLvl:5,getVal(l){return 0.10*l},icon:'💨'},
  jingang:{name:'金刚不坏',desc:'减伤提升',maxLvl:5,getVal(l){return 0.10*l},icon:'🛡'},
  xixing:{name:'吸星大法',desc:'拾取范围提升',maxLvl:5,getVal(l){return 0.30*l},icon:'🌀'},
  qiankun:{name:'乾坤大挪移',desc:'概率反弹伤害',maxLvl:3,getVal(l){return 0.10*l},icon:'🔄'},
  yijinjing:{name:'易筋经',desc:'最大生命提升',maxLvl:5,getVal(l){return 0.20*l},icon:'💪'},
  kuihua:{name:'葵花点穴',desc:'攻击概率定身敌人',maxLvl:3,getVal(l){return 0.08*l},icon:'📍'},
  baidu:{name:'百毒不侵',desc:'毒雾伤害+免疫中毒',maxLvl:3,getVal(l){return 0.25*l},icon:'🍃'},
  dujiu:{name:'独孤九剑',desc:'每N次攻击必暴击',maxLvl:3,getVal(l){return Math.max(7-Math.floor(l*2),3)},icon:'⚔'},
  hubo:{name:'左右互搏',desc:'额外弹道/数量',maxLvl:3,getVal(l){return l},icon:'🤝'},
};
const ALL_WEAPON_KEYS=Object.keys(WEAPON_DEFS);
const ALL_PASSIVE_KEYS=Object.keys(PASSIVE_DEFS);
const ALL_SKILL_KEYS=[...ALL_WEAPON_KEYS,...ALL_PASSIVE_KEYS];

// ==================== 敌人定义 ====================
const ENEMY_DEFS={
  bandit:{name:'山贼喽啰',hp:30,dmg:10,spd:80,exp:5,radius:14,color:'#8B7355',spawnFrom:0},
  assassin:{name:'刺客',hp:20,dmg:15,spd:180,exp:8,radius:12,color:'#2c2c2c',spawnFrom:120,
    behavior:'dash',dashCD:3,dashSpd:350},
  snake:{name:'毒蛇',hp:25,dmg:8,spd:60,exp:10,radius:10,color:'#4a8c3f',spawnFrom:180,
    poison:true,poisonDmg:3,poisonDur:3},
  armored:{name:'铁甲兵',hp:80,dmg:12,spd:50,exp:20,radius:20,color:'#9e9e9e',spawnFrom:300},
  archer:{name:'弓箭手',hp:25,dmg:10,spd:70,exp:12,radius:14,color:'#c9a44b',spawnFrom:240,
    ranged:true,rangeCD:2.5,projSpd:200},
  jumper:{name:'轻功高手',hp:40,dmg:15,spd:120,exp:15,radius:16,color:'#4a90d9',spawnFrom:360,
    behavior:'jump',jumpCD:4},
  boss1:{name:'山大王',hp:500,dmg:25,spd:60,exp:200,radius:40,color:'#c0392b',spawnFrom:600,
    isBoss:true,summonCD:8},
  boss2:{name:'魔教教主',hp:800,dmg:30,spd:70,exp:500,radius:45,color:'#8e44ad',spawnFrom:900,
    isBoss:true,bulletHell:true,hellCD:3},
};

// ==================== 角色定义 ====================
const CHAR_DEFS={
  swordsman:{name:'剑客',icon:'⚔',speed:200,hp:100,atk:15,startWeapon:'yujianshu',critRate:0.15,pickupRange:60,
    desc:'御剑术环绕飞剑\n+15% 暴击率'},
  blade:{name:'刀客',icon:'🗡',speed:180,hp:120,atk:20,startWeapon:'daoqi',critRate:0.05,pickupRange:60,
    desc:'刀气纵横前方扇形\n+20% 攻击范围'},
  hidden:{name:'暗器高手',icon:'💮',speed:220,hp:80,atk:10,startWeapon:'manhua',critRate:0.10,pickupRange:60,
    desc:'漫天花雨全屏散射\n+25% 弹道速度'},
};

// ==================== 空间哈希网格 ====================
class SpatialHashGrid{
  constructor(){this.cells=new Map()}
  clear(){this.cells.clear()}
  key(cx,cy){return cx+'_'+cy}
  getCell(x,y){return this.cells.get(this.key(Math.floor(x/CELL_SIZE),Math.floor(y/CELL_SIZE)))||[]}
  insert(obj){
    const cx=Math.floor(obj.x/CELL_SIZE),cy=Math.floor(obj.y/CELL_SIZE);
    const k=this.key(cx,cy);
    if(!this.cells.has(k))this.cells.set(k,[]);
    this.cells.get(k).push(obj);
  }
  query(x,y,r){
    const result=[];
    const minCX=Math.floor((x-r)/CELL_SIZE),maxCX=Math.floor((x+r)/CELL_SIZE);
    const minCY=Math.floor((y-r)/CELL_SIZE),maxCY=Math.floor((y+r)/CELL_SIZE);
    for(let cx=minCX;cx<=maxCX;cx++){
      for(let cy=minCY;cy<=maxCY;cy++){
        const cell=this.cells.get(this.key(cx,cy));
        if(cell)for(const obj of cell)result.push(obj);
      }
    }
    return result;
  }
}

// ==================== 粒子 ====================
class Particle{
  constructor(x,y,vx,vy,life,color,size=3){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.life=life;this.maxLife=life;
    this.color=color;this.size=size;
  }
  update(dt){
    this.x+=this.vx*dt;this.y+=this.vy*dt;
    this.life-=dt;
    this.size*=0.995;
  }
  get alive(){return this.life>0}
  get alpha(){return clamp(this.life/this.maxLife,0,1)}
}

// ==================== 弹道 ====================
class Projectile{
  constructor(x,y,vx,vy,damage,lifetime,color,size=5,pierce=false,type='normal'){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.damage=damage;this.lifetime=lifetime;
    this.maxLifetime=lifetime;this.color=color;this.size=size;this.pierce=pierce;
    this.type=type;this.hitEnemies=new Set();
  }
  update(dt){
    this.x+=this.vx*dt;this.y+=this.vy*dt;
    this.lifetime-=dt;
  }
  get alive(){return this.lifetime>0}
  get alpha(){return clamp(this.lifetime/this.maxLifetime,0,1)}
}

// ==================== 掉落物 ====================
class Pickup{
  constructor(x,y,type,value){
    this.x=x;this.y=y;this.type=type;this.value=value;
    this.life=15;this.bob=Math.random()*Math.PI*2;
  }
  update(dt){
    this.life-=dt;
    this.bob+=dt*3;
  }
  get alive(){return this.life>0}
}

// ==================== 敌人 ====================
class Enemy{
  constructor(type,def,x,y,gameTime){
    this.type=type;this.def=def;
    this.x=x;this.y=y;
    this.hp=def.hp*(1+(gameTime/60)*0.10);
    this.maxHp=this.hp;
    this.dmg=def.dmg*(1+(gameTime/60)*0.08);
    this.speed=def.spd;
    this.radius=def.radius;
    this.color=def.color;
    this.exp=def.exp;
    this.behavior=def.behavior||'chase';
    this.ranged=def.ranged||false;
    this.isBoss=def.isBoss||false;
    this.poison=def.poison||false;
    this.poisonDmg=def.poisonDmg||0;
    this.poisonDur=def.poisonDur||0;
    this.rangeCD=def.rangeCD||0;
    this.projSpd=def.projSpd||0;
    this.dashCD=def.dashCD||0;
    this.dashSpd=def.dashSpd||0;
    this.jumpCD=def.jumpCD||0;
    this.summonCD=def.summonCD||0;
    this.bulletHell=def.bulletHell||false;
    this.hellCD=def.hellCD||0;
    this.timer=0;
    this.dashTimer=0;this.dashDir=null;
    this.jumpTimer=0;this.jumping=false;
    this.slowed=0;this.stunned=0;
    this.hitFlash=0;
    this.angle=Math.random()*Math.PI*2;
    this.dead=false;
  }
  update(dt,player,gameTime,enemies,projectiles){
    if(this.dead)return;
    if(this.stunned>0){this.stunned-=dt;return}
    this.timer+=dt;
    if(this.hitFlash>0)this.hitFlash-=dt;
    const dx=player.x-this.x,dy=player.y-this.y;
    const d=Math.hypot(dx,dy);
    const spdMult=this.slowed>0?0.4:1;
    this.slowed-=dt;

    switch(this.behavior){
      case 'dash':
        if(this.dashTimer<=0){
          this.dashTimer=this.dashCD;
          this.dashDir=norm({x:dx,y:dy});
        }
        if(this.dashTimer>this.dashCD-0.5){
          const spd=this.dashSpd*spdMult;
          this.x+=this.dashDir.x*spd*dt;this.y+=this.dashDir.y*spd*dt;
        }else{
          const spd=this.speed*spdMult;
          const nd=norm({x:dx,y:dy});
          this.x+=nd.x*spd*dt;this.y+=nd.y*spd*dt;
        }
        this.dashTimer-=dt;
        break;
      case 'jump':
        if(this.jumpTimer<=0&&d>100){
          this.jumpTimer=this.jumpCD;this.jumping=true;
        }
        if(this.jumping&&this.jumpTimer>this.jumpCD-0.3){
          const nd=norm({x:dx,y:dy});
          this.x+=nd.x*400*spdMult*dt;this.y+=nd.y*400*spdMult*dt;
        }else{
          this.jumping=false;
          const spd=this.speed*spdMult;
          const nd=norm({x:dx,y:dy});
          this.x+=nd.x*spd*dt;this.y+=nd.y*spd*dt;
        }
        this.jumpTimer-=dt;
        break;
      default:
        const spd=this.speed*spdMult;
        const nd=norm({x:dx,y:dy});
        this.x+=nd.x*spd*dt;this.y+=nd.y*spd*dt;
    }

    if(this.ranged&&this.timer>=this.rangeCD&&d<400){
      this.timer=0;
      const nd=norm({x:dx,y:dy});
      projectiles.push(new Projectile(this.x,this.y,nd.x*this.projSpd,nd.y*this.projSpd,
        this.dmg,3,'#f39c12',4,false,'enemy'));
    }
    if(this.bulletHell&&this.timer>=this.hellCD){
      this.timer=0;
      for(let i=0;i<12;i++){
        const a=(Math.PI*2/12)*i;
        projectiles.push(new Projectile(this.x,this.y,Math.cos(a)*150,Math.sin(a)*150,
          this.dmg*0.6,3,'#9b59b6',5,false,'enemy'));
      }
    }
    if(this.isBoss&&this.summonCD&&this.timer>=this.summonCD){
      this.timer=0;
      for(let i=0;i<3;i++){
        enemies.push(new Enemy('bandit',ENEMY_DEFS.bandit,
          this.x+rrange(-40,40),this.y+rrange(-40,40),gameTime));
      }
    }
  }
  takeDamage(dmg){
    this.hp-=dmg;this.hitFlash=0.1;
    return this.hp<=0;
  }
}

// ==================== 玩家 ====================
class Player{
  constructor(charDef){
    const cd=charDef;
    this.x=WORLD_W/2;this.y=WORLD_H/2;
    this.speed=cd.speed;this.baseSpeed=cd.speed;
    this.hp=cd.hp;this.maxHp=cd.hp;this.baseMaxHp=cd.hp;
    this.atk=cd.atk;this.baseAtk=cd.atk;
    this.critRate=cd.critRate;
    this.pickupRange=cd.pickupRange;this.basePickupRange=cd.pickupRange;
    this.radius=22;
    this.character=cd.name;
    this.startWeapon=cd.startWeapon;
    this.level=1;this.exp=0;this.expToNext=35;
    this.invincible=0;
    this.poisoned=0;this.poisonDmg=0;
    this.weapons={};this.passives={};
    this.noOwnedStreak=0;
    this.dmgReduction=0;
    this.reflectChance=0;
    this.stunChance=0;
    this.guaranteedCrit=0;this.attackCount=0;
    this.extraProjectiles=0;
    this.poisonImmune=false;
    this.poisonDmgBonus=0;
    this.projSpeedMult=1;
  }
  addWeapon(key){
    if(this.weapons[key])this.weapons[key].level++;
    else this.weapons[key]={level:1};
    this.recalcStats();
    this.noOwnedStreak=0;
  }
  addPassive(key){
    if(this.passives[key])this.passives[key].level++;
    else this.passives[key]={level:1};
    this.recalcStats();
    this.noOwnedStreak=0;
  }
  getWeaponLevel(key){return this.weapons[key]?this.weapons[key].level:0}
  getPassiveLevel(key){return this.passives[key]?this.passives[key].level:0}
  recalcStats(){
    this.speed=this.baseSpeed*(1+this.getPassiveLevel('lingbo')*0.10);
    this.maxHp=Math.floor(this.baseMaxHp*(1+this.getPassiveLevel('yijinjing')*0.20));
    this.hp=Math.min(this.hp,this.maxHp);
    this.atk=this.baseAtk*(1+this.getPassiveLevel('jiuyang')*0.15);
    this.pickupRange=this.basePickupRange*(1+this.getPassiveLevel('xixing')*0.30);
    this.dmgReduction=clamp(this.getPassiveLevel('jingang')*0.10,0,0.5);
    this.reflectChance=this.getPassiveLevel('qiankun')*0.10;
    this.stunChance=this.getPassiveLevel('kuihua')*0.08;
    const dj=this.getPassiveLevel('dujiu');
    this.guaranteedCrit=dj>0?Math.max(7-dj*2,2):0;
    this.extraProjectiles=this.getPassiveLevel('hubo');
    this.poisonImmune=this.getPassiveLevel('baidu')>=3;
    this.poisonDmgBonus=this.getPassiveLevel('baidu')*0.25;
    this.projSpeedMult=1+(this.character==='暗器高手'?0.25:0);
  }
  takeDamage(dmg,enemyType){
    if(this.invincible>0)return;
    const actualDmg=Math.max(1,Math.floor(dmg*(1-this.dmgReduction)));
    this.hp-=actualDmg;
    this.invincible=0.3;
    if(Math.random()<this.reflectChance&&actualDmg>0){
      return actualDmg;
    }
    if(enemyType==='snake'&&!this.poisonImmune){
      this.poisoned=3;this.poisonDmg=ENEMY_DEFS.snake.poisonDmg;
    }
    return 0;
  }
  update(dt){
    this.invincible=Math.max(0,this.invincible-dt);
    if(this.poisoned>0){
      this.poisoned-=dt;
      if(!this.poisonImmune)this.hp-=this.poisonDmg*dt;
    }
    this.attackCount++;
  }
  gainExp(amount){
    this.exp+=amount;
    while(this.exp>=this.expToNext){
      this.exp-=this.expToNext;
      this.level++;
      this.expToNext=20+this.level*15;
      this.hp=Math.min(this.hp+10,this.maxHp);
      return true;
    }
    return false;
  }
}

// ==================== 输入管理 ====================
class InputManager{
  constructor(){
    this.keys={};
    this.joystickDir={x:0,y:0};
    this.joystickActive=false;
    this.joystickId=null;
    this._setupKeyboard();
    this._setupJoystick();
  }
  _setupKeyboard(){
    window.addEventListener('keydown',e=>{
      this.keys[e.key.toLowerCase()]=true;
      if(e.key==='Escape'){game.togglePause();e.preventDefault()}
    });
    window.addEventListener('keyup',e=>{this.keys[e.key.toLowerCase()]=false});
  }
  _setupJoystick(){
    const base=document.getElementById('joystick-base');
    const thumb=document.getElementById('joystick-thumb');
    const onStart=e=>{
      e.preventDefault();
      const t=e.touches?e.touches[0]:e;
      this.joystickActive=true;
      this.joystickId=t.identifier;
      this._updateJoystick(t,base,thumb);
    };
    const onMove=e=>{
      e.preventDefault();
      if(!this.joystickActive)return;
      for(let i=0;i<e.touches.length;i++){
        if(e.touches[i].identifier===this.joystickId||this.joystickId===null){
          this._updateJoystick(e.touches[i],base,thumb);
          break;
        }
      }
    };
    const onEnd=e=>{
      this.joystickActive=false;this.joystickId=null;
      this.joystickDir={x:0,y:0};
      thumb.style.left='50%';thumb.style.top='50%';
    };
    base.addEventListener('touchstart',onStart,{passive:false});
    base.addEventListener('touchmove',onMove,{passive:false});
    base.addEventListener('touchend',onEnd);
    base.addEventListener('mousedown',onStart);
    window.addEventListener('mousemove',e=>{
      if(this.joystickActive&&!('touches' in (e||{}))){
        this._updateJoystick(e,base,thumb);
      }
    });
    window.addEventListener('mouseup',onEnd);
  }
  _updateJoystick(touch,base,thumb){
    const rect=base.getBoundingClientRect();
    const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    const dx=touch.clientX-cx,dy=touch.clientY-cy;
    const maxR=rect.width/2-15;
    const d=Math.hypot(dx,dy);
    const clampedD=Math.min(d,maxR);
    const nx=d>0?dx/d:0,ny=d>0?dy/d:0;
    this.joystickDir={x:nx*(clampedD/maxR),y:ny*(clampedD/maxR)};
    thumb.style.left=(50+nx*clampedD/maxR*40)+'%';
    thumb.style.top=(50+ny*clampedD/maxR*40)+'%';
  }
  getDirection(){
    let dx=0,dy=0;
    if(this.keys['w']||this.keys['arrowup'])dy-=1;
    if(this.keys['s']||this.keys['arrowdown'])dy+=1;
    if(this.keys['a']||this.keys['arrowleft'])dx-=1;
    if(this.keys['d']||this.keys['arrowright'])dx+=1;
    if(this.joystickActive){
      dx+=this.joystickDir.x;dy+=this.joystickDir.y;
    }
    const m=Math.hypot(dx,dy);
    return m>1?{x:dx/m,y:dy/m}:{x:dx,y:dy};
  }
}

// ==================== 敌人生成器 ====================
class EnemySpawner{
  constructor(){
    this.timer=0;
    this.spawnInterval=2;
    this.bossSpawned={boss1:false,boss2:false};
  }
  update(dt,gameTime,enemies,player){
    this.timer+=dt;
    const interval=this.spawnInterval*Math.pow(0.95,gameTime/60);
    if(this.timer<interval)return;
    this.timer-=interval;

    const maxEnemies=200;
    if(enemies.length>=maxEnemies){
      const removed=enemies.splice(0,Math.max(0,enemies.length-maxEnemies+10));
      return;
    }

    const availableTypes=[];
    for(const [key,def] of Object.entries(ENEMY_DEFS)){
      if(def.isBoss)continue;
      if(gameTime>=def.spawnFrom)availableTypes.push(key);
    }
    if(availableTypes.length===0)availableTypes.push('bandit');

    const type=rpick(availableTypes);
    const def=ENEMY_DEFS[type];
    const spawnPos=this._getSpawnPos(player);
    const count=Math.min(1+Math.floor(gameTime/120),8);
    for(let i=0;i<count;i++){
      const pos=this._getSpawnPos(player);
      enemies.push(new Enemy(type,def,pos.x,pos.y,gameTime));
    }

    for(const [key,def] of Object.entries(ENEMY_DEFS)){
      if(!def.isBoss)continue;
      if(gameTime>=def.spawnFrom&&!this.bossSpawned[key]){
        const pos=this._getSpawnPos(player);
        enemies.push(new Enemy(key,def,pos.x,pos.y,gameTime));
        this.bossSpawned[key]=true;
      }
    }
  }
  _getSpawnPos(player){
    const angle=Math.random()*Math.PI*2;
    const d=500+Math.random()*300;
    return {x:clamp(player.x+Math.cos(angle)*d,40,WORLD_W-40),y:clamp(player.y+Math.sin(angle)*d,40,WORLD_H-40)};
  }
}

// ==================== UI 管理器 ====================
class UIManager{
  constructor(){
    this.game=null;
  }
  updateHUD(player,gameTime,kills){
    const h=document.getElementById('hud');
    h.querySelector('.time').textContent='⏱ '+this._formatTime(gameTime);
    h.querySelector('.kills').textContent='💀 '+kills;
    h.querySelector('.level').textContent='⭐ Lv.'+player.level;
    h.querySelector('.hp-bar-inner').style.width=(player.hp/player.maxHp*100)+'%';
    h.querySelector('.exp-bar-inner').style.width=(player.exp/player.expToNext*100)+'%';
    const wb=document.getElementById('weapon-bar');
    let html='';
    for(const [key,w] of Object.entries(player.weapons)){
      const def=WEAPON_DEFS[key];
      html+=`<div class="weapon-icon">${def.icon}<span class="lvl">Lv${w.level}</span></div>`;
    }
    for(const [key,p] of Object.entries(player.passives)){
      const def=PASSIVE_DEFS[key];
      html+=`<div class="weapon-icon">${def.icon}<span class="lvl">Lv${p.level}</span></div>`;
    }
    wb.innerHTML=html;
  }
  showLevelUp(player,callback){
    const panel=document.getElementById('level-up-panel');
    const choices=document.getElementById('level-up-choices');
    const available=[];
    for(const key of ALL_SKILL_KEYS){
      const isWeapon=WEAPON_DEFS[key]!==undefined;
      const def=isWeapon?WEAPON_DEFS[key]:PASSIVE_DEFS[key];
      const lvl=isWeapon?player.getWeaponLevel(key):player.getPassiveLevel(key);
      const owned=lvl>0;
      const maxed=lvl>=def.maxLvl;
      if(!maxed)available.push({key,isWeapon,def,owned,lvl});
    }
    const ownedAvail=available.filter(a=>a.owned);
    const unownedAvail=available.filter(a=>!a.owned);
    const forced=player.noOwnedStreak>=3&&ownedAvail.length>0;
    const selected=[];
    const pool=forced?ownedAvail:[...available];
    const ownedPriority=ownedAvail.filter(a=>!selected.includes(a));
    const unownedPriority=unownedAvail.filter(a=>!selected.includes(a));
    while(selected.length<3&&pool.length>0){
      const preferOwned=!forced&&Math.random()<0.7&&ownedPriority.length>0;
      const src=preferOwned?ownedPriority:unownedPriority.length>0?unownedPriority:pool;
      const idx=Math.floor(Math.random()*src.length);
      const pick=src.splice(idx,1)[0];
      if(pick&&!selected.find(s=>s.key===pick.key))selected.push(pick);
      const poolIdx=pool.findIndex(p=>p.key===pick.key);
      if(poolIdx>=0)pool.splice(poolIdx,1);
    }
    if(selected.length===0){
      player.maxHp+=10;player.hp=Math.min(player.hp+10,player.maxHp);
      player.baseAtk+=2;player.atk=player.baseAtk;
      return;
    }
    this.game.paused=true;
    player.noOwnedStreak++;
    panel.style.display='flex';
    choices.innerHTML='';
    selected.forEach(s=>{
      const card=document.createElement('div');
      card.className='level-up-card';
      const nextLvl=s.lvl+1;
      const isWeapon=s.isWeapon;
      let desc=s.def.desc;
      if(isWeapon){
        const d=s.def.getDamage(nextLvl);
        const cd=s.def.getCooldown(nextLvl);
        const cnt=s.def.getCount(nextLvl);
        desc+=`\n伤害:${d} | CD:${cd.toFixed(1)}s | 数量:${cnt}`;
      }else{
        const val=s.def.getVal(nextLvl);
        desc+=`\n效果:${(val*100).toFixed(1)}%`;
      }
      card.innerHTML=`<div class="wname">${s.def.icon} ${s.def.name}</div>
        <div class="wlevel">${s.owned?'Lv'+s.lvl+' → Lv'+nextLvl:'获得 Lv1'}</div>
        <div class="wtype">${isWeapon?'[主动·攻击]':'[被动·心法]'}</div>
        <div class="wdesc">${desc.replace(/\n/g,'<br>')}</div>`;
      card.onclick=()=>{
        panel.style.display='none';
        this.game.paused=false;
        this.game.lastTime=performance.now();
        callback(s.key,s.isWeapon);
      };
      choices.appendChild(card);
    });
  }
  showGameOver(stats){
    document.getElementById('hud').style.display='none';
    document.getElementById('weapon-bar').style.display='none';
    const panel=document.getElementById('game-over');
    const statsEl=document.getElementById('game-over-stats');
    const gold=Math.floor(stats.kills*0.5+stats.time*2);
    statsEl.innerHTML=`存活时间: <span class="stat-num">${this._formatTime(stats.time)}</span><br>
      总击杀: <span class="stat-num">${stats.kills}</span><br>
      等级: <span class="stat-num">Lv.${stats.level}</span><br>
      获得金币: <span class="stat-num">🪙 ${gold}</span>`;
    panel.style.display='flex';
    this._saveGame(stats,gold);
  }
  updateMinimap(player,enemies,obstacles){
    const mm=document.getElementById('minimap');
    if(!mm)return;
    const mmCanvas=mm.querySelector('canvas');
    if(!mmCanvas){
      const c=document.createElement('canvas');
      c.width=120;c.height=120;
      mm.appendChild(c);
      this._mmCtx=c.getContext('2d');
    }
    const ctx=this._mmCtx||(mm.querySelector('canvas').getContext('2d'));
    ctx.clearRect(0,0,120,120);
    ctx.fillStyle='rgba(0,0,0,0.8)';
    ctx.fillRect(0,0,120,120);
    const sx=120/WORLD_W,sy=120/WORLD_H;
    ctx.fillStyle='rgba(100,80,60,0.5)';
    for(const o of obstacles){
      ctx.fillRect(o.x*sx,o.y*sy,o.w*sx,o.h*sy);
    }
    ctx.fillStyle='rgba(255,50,50,0.6)';
    for(const e of enemies){
      ctx.fillRect(e.x*sx-1,e.y*sy-1,2,2);
    }
    ctx.fillStyle='#2ecc71';
    ctx.fillRect(player.x*sx-2,player.y*sy-2,4,4);
    ctx.strokeStyle='#c9a44b';
    ctx.strokeRect(0,0,120,120);
  }
  _formatTime(seconds){
    const m=Math.floor(seconds/60),s=Math.floor(seconds%60);
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  _saveGame(stats,gold){
    try{
      let data=JSON.parse(localStorage.getItem('save_data')||'{}');
      data.gold=(data.gold||0)+gold;
      data.totalKills=(data.totalKills||0)+stats.kills;
      data.totalGames=(data.totalGames||0)+1;
      data.bestTime=Math.max(data.bestTime||0,stats.time);
      data.bestKills=Math.max(data.bestKills||0,stats.kills);
      localStorage.setItem('save_data',JSON.stringify(data));
    }catch(e){}
  }
}

// ==================== 游戏主类 ====================
class Game{
  constructor(){
    this.canvas=document.getElementById('game-canvas');
    this.ctx=this.canvas.getContext('2d');
    this.ui=new UIManager();
    this.ui.game=this;
    this.input=new InputManager();
    this.state='title';
    this.player=null;
    this.enemies=[];
    this.projectiles=[];
    this.pickups=[];
    this.particles=[];
    this.obstacles=[];
    this.spawner=new EnemySpawner();
    this.spatialGrid=new SpatialHashGrid();
    this.gameTime=0;
    this.kills=0;
    this.paused=false;
    this.lastTime=0;
    this.camera={x:0,y:0};
    this._resize();
    window.addEventListener('resize',()=>this._resize());
    this._generateObstacles();
    this._loadSave();
    this._loop(0);
  }
  _resize(){
    this.canvas.width=window.innerWidth;
    this.canvas.height=window.innerHeight;
    this.camera={x:0,y:0};
  }
  _generateObstacles(){
    this.obstacles=[];
    const count=rint(30,50);
    for(let i=0;i<count;i++){
      const w=rint(20,60),h=rint(20,60);
      this.obstacles.push({
        x:rrange(50,WORLD_W-50-w),y:rrange(50,WORLD_H-50-h),
        w,h,color:'#5c7a4a',type:'tree'
      });
    }
    for(let i=0;i<10;i++){
      const s=rint(30,50);
      this.obstacles.push({
        x:rrange(50,WORLD_W-50-s),y:rrange(50,WORLD_H-50-s),
        w:s,h:s,color:'#888888',type:'rock'
      });
    }
  }
  _loadSave(){
    try{
      const data=JSON.parse(localStorage.getItem('save_data')||'{}');
      const rec=document.getElementById('title-record');
      if(data.bestTime)rec.textContent=`最高记录: ${this.ui._formatTime(data.bestTime)} | 击杀: ${data.bestKills||0}`;
    }catch(e){}
  }
  showTitle(){
    this.state='title';
    document.getElementById('title-screen').style.display='flex';
    document.getElementById('char-select').style.display='none';
    document.getElementById('game-over').style.display='none';
    document.getElementById('pause-menu').style.display='none';
    document.getElementById('hud').style.display='none';
    document.getElementById('weapon-bar').style.display='none';
    document.getElementById('level-up-panel').style.display='none';
    document.getElementById('minimap').style.display='none';
  }
  startCharacterSelect(){
    this.state='char-select';
    document.getElementById('title-screen').style.display='none';
    document.getElementById('char-select').style.display='flex';
    const cards=document.getElementById('char-cards');
    cards.innerHTML='';
    for(const [key,def] of Object.entries(CHAR_DEFS)){
      const card=document.createElement('div');
      card.className='char-card';
      card.innerHTML=`<div class="icon">${def.icon}</div><div class="name">${def.name}</div>
        <div class="desc">${def.desc.replace(/\n/g,'<br>')}</div>
        <div class="stat">❤${def.hp} ⚔${def.atk} 💨${def.speed}</div>`;
      card.onclick=()=>this.startGame(key);
      cards.appendChild(card);
    }
  }
  startGame(charKey){
    if(!charKey)charKey=rpick(Object.keys(CHAR_DEFS));
    this.state='playing';
    this.paused=false;
    const charDef=CHAR_DEFS[charKey];
    this.player=new Player(charDef);
    this.player.addWeapon(charDef.startWeapon);
    this.enemies=[];
    this.projectiles=[];
    this.pickups=[];
    this.particles=[];
    this.spawner=new EnemySpawner();
    this.gameTime=0;
    this.kills=0;
    this.lastTime=0;
    this.camera={x:0,y:0};
    document.getElementById('title-screen').style.display='none';
    document.getElementById('char-select').style.display='none';
    document.getElementById('game-over').style.display='none';
    document.getElementById('pause-menu').style.display='none';
    document.getElementById('level-up-panel').style.display='none';
    document.getElementById('hud').style.display='block';
    document.getElementById('weapon-bar').style.display='flex';
    document.getElementById('minimap').style.display='block';
  }
  restart(){
    const charKey=this.player?Object.keys(CHAR_DEFS).find(k=>CHAR_DEFS[k].name===this.player.character):null;
    this.startGame(charKey||'swordsman');
  }
  togglePause(){
    if(this.state!=='playing'&&this.state!=='paused')return;
    if(this.paused){this.resume()}else{this.pause()}
  }
  pause(){
    this.paused=true;this.state='paused';
    document.getElementById('pause-menu').style.display='flex';
  }
  resume(){
    this.paused=false;this.state='playing';
    document.getElementById('pause-menu').style.display='none';
    this.lastTime=0;
  }
  _loop(timestamp){
    requestAnimationFrame(t=>this._loop(t));
    if(this.paused||this.state==='title'||this.state==='char-select')return;
    if(this.state==='game-over')return;
    if(this.lastTime===0){this.lastTime=timestamp;return;}
    let dt=(timestamp-this.lastTime)/1000;
    this.lastTime=timestamp;
    if(dt>0.05)dt=0.05;
    if(dt<=0)return;
    try{this._update(dt);this._render();}catch(e){console.error(e)}
  }
  _update(dt){
    const p=this.player;
    if(!p)return;
    this.gameTime+=dt;
    const input=this.input.getDirection();
    let nx=p.x+input.x*p.speed*dt;
    let ny=p.y+input.y*p.speed*dt;
    let blocked=false;
    for(const o of this.obstacles){
      if(nx+p.radius>o.x&&nx-p.radius<o.x+o.w&&ny+p.radius>o.y&&ny-p.radius<o.y+o.h){
        if(nx+p.radius>o.x&&nx-p.radius<o.x+o.w)nx=p.x;
        if(ny+p.radius>o.y&&ny-p.radius<o.y+o.h)ny=p.y;
        blocked=true;
      }
    }
    p.x=clamp(nx,p.radius,WORLD_W-p.radius);
    p.y=clamp(ny,p.radius,WORLD_H-p.radius);
    p.update(dt);
    this._fireWeapons(dt);
    for(const proj of this.projectiles)proj.update(dt);
    this.projectiles=this.projectiles.filter(p=>p.alive);
    for(const pu of this.pickups)pu.update(dt);
    this.pickups=this.pickups.filter(pu=>pu.alive);
    this.spawner.update(dt,this.gameTime,this.enemies,p);
    this.spatialGrid.clear();
    for(const e of this.enemies){
      e.update(dt,p,this.gameTime,this.enemies,this.projectiles);
      if(!e.dead)this.spatialGrid.insert(e);
    }
    this._checkCollisions();
    for(const part of this.particles)part.update(dt);
    this.particles=this.particles.filter(p=>p.alive);
    if(this.particles.length>300)this.particles.splice(0,this.particles.length-300);
    this.camera.x=lerp(this.camera.x,p.x-this.canvas.width/2,0.2);
    this.camera.y=lerp(this.camera.y,p.y-this.canvas.height/2,0.2);
    this.ui.updateHUD(p,this.gameTime,this.kills);
    this.ui.updateMinimap(p,this.enemies,this.obstacles);
    if(p.hp<=0){
      this.state='game-over';
      this.ui.showGameOver({time:this.gameTime,kills:this.kills,level:p.level});
    }
  }
  _fireWeapons(dt){
    const p=this.player;
    for(const [key,w] of Object.entries(p.weapons)){
      const def=WEAPON_DEFS[key];
      if(!def)continue;
      if(!w._cooldown)w._cooldown=0;
      w._cooldown-=dt;
      if(w._cooldown>0)continue;
      const cd=def.getCooldown(w.level);
      w._cooldown=cd;
      const dmg=def.getDamage(w.level)*(1+(p.poisonDmgBonus&&def.ptype==='aoe_circle'?p.poisonDmgBonus:0));
      const count=def.getCount(w.level)+p.extraProjectiles;
      const isCrit=p.guaranteedCrit>0&&p.attackCount%p.guaranteedCrit===0;
      const finalDmg=isCrit||Math.random()<p.critRate?dmg*2:dmg;
      switch(def.ptype){
        case 'orbit':{
          if(!w._orbitAngles)w._orbitAngles=[];
          while(w._orbitAngles.length<count)w._orbitAngles.push(Math.random()*Math.PI*2);
          while(w._orbitAngles.length>count)w._orbitAngles.pop();
          w._orbitAngles=w._orbitAngles.map(a=>a+2*dt);
          const orbitR=60+w.level*10;
          for(const a of w._orbitAngles){
            this.projectiles.push(new Projectile(p.x+Math.cos(a)*orbitR,p.y+Math.sin(a)*orbitR,0,0,finalDmg,cd*1.5,'#c9a44b',6,false,'orbit'));
          }
          break;
        }
        case 'cone':{
          const dir=this.input.getDirection();
          const baseA=dir.x===0&&dir.y===0?Math.random()*Math.PI*2:Math.atan2(dir.y,dir.x);
          const spread=Math.PI/4;
          for(let i=0;i<count;i++){
            const a=baseA+(i-count/2+0.5)*spread/count;
            const spd=300+p.projSpeedMult*50;
            this.projectiles.push(new Projectile(p.x,p.y,Math.cos(a)*spd,Math.sin(a)*spd,finalDmg,0.8,'#e74c3c',8,false,'cone'));
          }
          break;
        }
        case 'scatter':{
          for(let i=0;i<count;i++){
            const a=Math.random()*Math.PI*2;
            const spd=250+p.projSpeedMult*100;
            this.projectiles.push(new Projectile(p.x,p.y,Math.cos(a)*spd,Math.sin(a)*spd,finalDmg,1.2,'#8e44ad',5,false,'scatter'));
          }
          break;
        }
        case 'target_nearest':{
          let nearest=null,nearestDist=Infinity;
          for(const e of this.enemies){
            if(e.dead)continue;
            const d=dist(p,e);
            if(d<nearestDist){nearestDist=d;nearest=e;}
          }
          if(nearest){
            const nd=norm({x:nearest.x-p.x,y:nearest.y-p.y});
            const spd=350+p.projSpeedMult*50;
            for(let i=0;i<count;i++){
              const spread=(i-count/2+0.5)*0.15;
              const a=Math.atan2(nd.y,nd.x)+spread;
              const proj=new Projectile(p.x,p.y,Math.cos(a)*spd,Math.sin(a)*spd,finalDmg,3,'#3498db',5,false,'target');
              proj.slow=def.slow||0;proj.slowDur=def.slowDur||0;
              this.projectiles.push(proj);
            }
          }
          break;
        }
        case 'aoe_circle':{
          this.projectiles.push(new Projectile(p.x,p.y,0,0,finalDmg*dt*2,cd,'rgba(74,140,63,0.4)',def.getRadius(w.level),true,'aoe'));
          break;
        }
        case 'global_strike':{
          for(let i=0;i<count;i++){
            const tx=p.x+rrange(-300,300),ty=p.y+rrange(-300,300);
            const strikeX=clamp(tx,20,WORLD_W-20),strikeY=clamp(ty,20,WORLD_H-20);
            this.projectiles.push(new Projectile(strikeX,strikeY-200,0,600,finalDmg,0.5,'#f1c40f',10,false,'strike'));
            for(let j=0;j<8;j++){
              this.particles.push(new Particle(strikeX,strikeY,rrange(-80,80),rrange(-80,80),0.4,'#f39c12',4));
            }
          }
          break;
        }
        case 'random_walk':{
          if(!w._tornadoes)w._tornadoes=[];
          while(w._tornadoes.length<count){
            w._tornadoes.push({x:p.x+rrange(-100,100),y:p.y+rrange(-100,100),angle:Math.random()*Math.PI*2,timer:0});
          }
          while(w._tornadoes.length>count)w._tornadoes.pop();
          for(const t of w._tornadoes){
            t.timer+=dt;
            if(t.timer>1.5){t.angle+=rrange(-0.5,0.5);t.timer=0;}
            t.x+=Math.cos(t.angle)*120*dt;t.y+=Math.sin(t.angle)*120*dt;
            t.x=clamp(t.x,20,WORLD_W-20);t.y=clamp(t.y,20,WORLD_H-20);
            this.projectiles.push(new Projectile(t.x,t.y,0,0,finalDmg*dt*3,0.05,'rgba(180,200,220,0.6)',24,true,'tornado'));
          }
          break;
        }
        case 'summon':{
          if(!w._summons)w._summons=[];
          while(w._summons.length<count){
            w._summons.push({x:p.x+rrange(-80,80),y:p.y+rrange(-80,80),angle:Math.random()*Math.PI*2});
          }
          while(w._summons.length>count)w._summons.pop();
          for(const s of w._summons){
            s.angle+=1.5*dt;
            s.x=lerp(s.x,p.x+Math.cos(s.angle)*80,0.05);
            s.y=lerp(s.y,p.y+Math.sin(s.angle)*80,0.05);
            const summonDmg=def.inheritDmg?finalDmg*def.inheritDmg:finalDmg;
            this.projectiles.push(new Projectile(s.x,s.y,0,0,summonDmg*dt*2,0.05,'rgba(200,200,255,0.5)',18,true,'summon'));
          }
          break;
        }
      }
    }
  }
  _checkCollisions(){
    const p=this.player;
    if(!p)return;
    for(const pu of this.pickups){
      const d=dist(p,pu);
      if(d<p.pickupRange+pu.value/5){
        if(pu.type==='exp'){
          if(p.gainExp(pu.value)){
            pu.life=0;
            this.ui.showLevelUp(p,(key,isWeapon)=>{
              if(isWeapon)p.addWeapon(key);
              else p.addPassive(key);
            });
          }
        }else if(pu.type==='heal'){
          p.hp=Math.min(p.hp+pu.value,p.maxHp);
        }
        pu.life=0;
      }
    }
    this.pickups=this.pickups.filter(pu=>pu.alive);
    for(const e of this.enemies){
      if(e.dead)continue;
      const d=dist(p,e);
      if(d<p.radius+e.radius){
        const reflect=p.takeDamage(e.dmg,e.type);
        if(reflect>0)e.hp-=reflect;
        for(let i=0;i<5;i++){
          this.particles.push(new Particle(p.x,p.y,rrange(-60,60),rrange(-60,60),0.3,'#e74c3c',3));
        }
      }
    }
    for(const proj of this.projectiles){
      if(proj.type==='enemy'){
        const d=dist(p,proj);
        if(d<p.radius+proj.size){
          p.takeDamage(proj.damage);
          proj.lifetime=0;
          for(let i=0;i<3;i++){
            this.particles.push(new Particle(p.x,p.y,rrange(-40,40),rrange(-40,40),0.2,'#f39c12',2));
          }
        }
        continue;
      }
      if(proj.type==='aoe'||proj.type==='tornado'||proj.type==='summon'||proj.type==='orbit'){
        const nearby=this.spatialGrid.query(proj.x,proj.y,proj.size);
        for(const e of nearby){
          if(proj.hitEnemies.has(e))continue;
          const d=dist(proj,e);
          if(d<proj.size+e.radius){
            proj.hitEnemies.add(e);
            if(e.takeDamage(proj.damage)){
              this._killEnemy(e);
            }
            if(Math.random()<p.stunChance)e.stunned=0.5;
            if(proj.slow)e.slowed=proj.slowDur;
            for(let i=0;i<2;i++){
              this.particles.push(new Particle(e.x,e.y,rrange(-30,30),rrange(-30,30),0.2,'#fff',2));
            }
          }
        }
      }else{
        for(const e of this.enemies){
          if(e.dead||proj.hitEnemies.has(e))continue;
          const d=dist(proj,e);
          if(proj.type==='strike'){
            if(Math.abs(proj.x-e.x)<proj.size+20&&Math.abs(proj.y-e.y)<proj.size+20&&proj.vy>0){
              if(e.takeDamage(proj.damage))this._killEnemy(e);
              proj.lifetime=0;
              for(let i=0;i<8;i++){
                this.particles.push(new Particle(proj.x,proj.y,rrange(-60,60),rrange(-60,60),0.4,'#f1c40f',4));
              }
            }
          }else if(d<proj.size+e.radius){
            proj.hitEnemies.add(e);
            if(e.takeDamage(proj.damage))this._killEnemy(e);
            if(Math.random()<p.stunChance)e.stunned=0.5;
            if(proj.slow)e.slowed=proj.slowDur;
            for(let i=0;i<2;i++){
              this.particles.push(new Particle(e.x,e.y,rrange(-30,30),rrange(-30,30),0.2,'#fff',2));
            }
            if(!proj.pierce)proj.lifetime=0;
          }
        }
      }
    }
    for(const o of this.obstacles){
      for(const e of this.enemies){
        if(e.dead)continue;
        if(e.x+e.radius>o.x&&e.x-e.radius<o.x+o.w&&e.y+e.radius>o.y&&e.y-e.radius<o.y+o.h){
          const cx=clamp(e.x,o.x,o.x+o.w),cy=clamp(e.y,o.y,o.y+o.h);
          const nd=norm({x:e.x-cx,y:e.y-cy});
          e.x+=nd.x*2;e.y+=nd.y*2;
        }
      }
    }
    this.enemies=this.enemies.filter(e=>!e.dead);
  }
  _killEnemy(e){
    this.kills++;
    const p=this.player;
    const expVal=e.isBoss?e.exp:rrange(e.exp*0.8,e.exp*1.2);
    this.pickups.push(new Pickup(e.x,e.y,'exp',Math.floor(expVal)));
    if(Math.random()<0.05)this.pickups.push(new Pickup(e.x,e.y,'heal',15));
    for(let i=0;i<6;i++){
      this.particles.push(new Particle(e.x,e.y,rrange(-50,50),rrange(-50,50),0.4,e.color,3));
    }
    e.dead=true;
  }
  _render(){
    const ctx=this.ctx;
    const w=this.canvas.width,h=this.canvas.height;
    const cx=this.camera.x,cy=this.camera.y;
    ctx.fillStyle='#c8b896';
    ctx.fillRect(0,0,w,h);
    for(let gx=Math.floor(cx/80)*80;gx<cx+w+80;gx+=80){
      for(let gy=Math.floor(cy/80)*80;gy<cy+h+80;gy+=80){
        if(gx>=0&&gx<WORLD_W&&gy>=0&&gy<WORLD_H){
          ctx.fillStyle='rgba(139,115,85,0.3)';
          ctx.fillRect(gx-cx,gy-cy,78,78);
        }
      }
    }
    for(const o of this.obstacles){
      const ox=o.x-cx,oy=o.y-cy;
      if(ox+o.w<0||ox>w||oy+o.h<0||oy>h)continue;
      ctx.fillStyle=o.color;
      ctx.fillRect(ox,oy,o.w,o.h);
      if(o.type==='tree'){
        ctx.fillStyle='#3d5a2e';
        ctx.beginPath();ctx.arc(ox+o.w/2,oy-4,o.w/2+2,0,Math.PI*2);ctx.fill();
      }
    }
    ctx.strokeStyle='#5c3a24';
    ctx.lineWidth=3;
    ctx.strokeRect(-cx,-cy,WORLD_W,WORLD_H);
    for(const pu of this.pickups){
      const px=pu.x-cx,py=pu.y-cy+Math.sin(pu.bob)*4;
      if(px<-20||px>w+20||py<-20||py>h+20)continue;
      const alpha=pu.life<2?pu.life/2:1;
      if(pu.type==='exp'){
        ctx.fillStyle=`rgba(46,204,113,${alpha})`;
        ctx.beginPath();ctx.arc(px,py,5+pu.value/20,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=`rgba(255,255,255,${alpha*0.6})`;
        ctx.beginPath();ctx.arc(px-1,py-1,2,0,Math.PI*2);ctx.fill();
      }else if(pu.type==='heal'){
        ctx.fillStyle=`rgba(231,76,60,${alpha})`;
        ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';
        ctx.font='10px serif';ctx.textAlign='center';
        ctx.fillText('+',px,py+4);
      }
    }
    for(const e of this.enemies){
      if(e.dead)continue;
      const ex=e.x-cx,ey=e.y-cy;
      if(ex+e.radius<-20||ex-e.radius>w+20||ey+e.radius<-20||ey-e.radius>h+20)continue;
      const flash=e.hitFlash>0;
      ctx.fillStyle=flash?'#fff':e.color;
      ctx.beginPath();
      if(e.isBoss){
        ctx.arc(ex,ey,e.radius,0,Math.PI*2);
        ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.3)';
        ctx.beginPath();ctx.arc(ex,ey,e.radius*0.6,0,Math.PI*2);ctx.fill();
      }else{
        ctx.arc(ex,ey,e.radius,0,Math.PI*2);ctx.fill();
      }
      if(e.ranged){
        ctx.fillStyle='#f39c12';
        ctx.beginPath();ctx.arc(ex,ey,e.radius*0.5,0,Math.PI*2);ctx.fill();
      }
      const hpPct=e.hp/e.maxHp;
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillRect(ex-e.radius,ey-e.radius-8,e.radius*2,4);
      ctx.fillStyle=hpPct>0.5?'#2ecc71':hpPct>0.25?'#f39c12':'#e74c3c';
      ctx.fillRect(ex-e.radius,ey-e.radius-8,e.radius*2*hpPct,4);
    }
    for(const proj of this.projectiles){
      const px=proj.x-cx,py=proj.y-cy;
      if(px<-30||px>w+30||py<-30||py>h+30)continue;
      if(proj.type==='aoe'||proj.type==='tornado'||proj.type==='summon'){
        ctx.fillStyle=proj.color;
        ctx.beginPath();ctx.arc(px,py,proj.size,0,Math.PI*2);ctx.fill();
      }else if(proj.type==='strike'){
        ctx.fillStyle=proj.color;
        ctx.fillRect(px-5,py-15,10,30);
        ctx.fillStyle='#fff';
        ctx.fillRect(px-2,py-12,4,24);
      }else if(proj.type==='enemy'){
        ctx.fillStyle=proj.color;
        ctx.beginPath();ctx.arc(px,py,proj.size,0,Math.PI*2);ctx.fill();
      }else{
        ctx.strokeStyle=proj.color;
        ctx.lineWidth=proj.size/2;
        ctx.beginPath();
        ctx.moveTo(px-proj.vx*0.02,py-proj.vy*0.02);
        ctx.lineTo(px,py);
        ctx.stroke();
      }
    }
    for(const part of this.particles){
      const px=part.x-cx,py=part.y-cy;
      ctx.fillStyle=part.color.replace('1)',`${part.alpha})`).replace('rgb','rgba');
      if(part.color.startsWith('#')){
        ctx.globalAlpha=part.alpha;
        ctx.fillStyle=part.color;
      }
      ctx.beginPath();ctx.arc(px,py,part.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    const p=this.player;
    if(!p)return;
    const px=p.x-cx,py=p.y-cy;
    if(p.invincible>0&&Math.floor(p.invincible*20)%2===0)return;
    // 发光光环
    ctx.fillStyle='rgba(201,164,75,0.3)';
    ctx.beginPath();ctx.arc(px,py,p.radius+6,0,Math.PI*2);ctx.fill();
    // 外圈
    ctx.fillStyle='#1a1a2e';
    ctx.beginPath();ctx.arc(px,py,p.radius,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#c9a44b';
    ctx.lineWidth=2;
    ctx.stroke();
    // 内圈
    ctx.fillStyle='#ecf0f1';
    ctx.beginPath();ctx.arc(px,py,p.radius*0.65,0,Math.PI*2);ctx.fill();
    // 中心
    ctx.fillStyle='#c9a44b';
    ctx.beginPath();ctx.arc(px,py,p.radius*0.4,0,Math.PI*2);ctx.fill();
    // 角色图标
    ctx.fillStyle='#1a1a2e';
    ctx.font=`bold ${p.radius*0.9}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    const charIcons={剑客:'⚔',刀客:'🗡','暗器高手':'💮'};
    ctx.fillText(charIcons[p.character]||'⚔',px,py);
  }
}

// ==================== 启动 ====================
var game=new Game();
</script>
