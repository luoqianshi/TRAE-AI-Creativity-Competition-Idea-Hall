<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>随心记 - 自定义记账</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- 顶部导航 -->
        <header class="header">
            <h1>随心记</h1>
            <p class="subtitle">按你的方式记账</p>
        </header>

        <!-- 月度概览 -->
        <section class="overview">
            <div class="overview-card">
                <div class="overview-label">本月支出</div>
                <div class="overview-amount" id="monthTotal">¥0.00</div>
                <div class="overview-count" id="recordCount">0 笔记录</div>
            </div>
        </section>

        <!-- 快捷操作 -->
        <section class="quick-actions">
            <button class="btn-primary" id="addRecordBtn">
                <span class="icon">+</span>
                <span>记一笔</span>
            </button>
            <button class="btn-secondary" id="manageCategoriesBtn">
                <span class="icon">⚙</span>
                <span>管理类别</span>
            </button>
        </section>

        <!-- 最近记录 -->
        <section class="recent-records">
            <div class="section-header">
                <h2>最近记录</h2>
                <button class="text-btn" id="viewAllBtn">查看全部</button>
            </div>
            <div class="records-list" id="recentRecordsList">
                <div class="empty-state">
                    <div class="empty-icon">📝</div>
                    <p>还没有记录，点击"记一笔"开始记账</p>
                </div>
            </div>
        </section>
    </div>

    <!-- 添加记录弹窗 -->
    <div class="modal" id="addRecordModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>记一笔</h3>
                <button class="close-btn" id="closeAddModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="amount-input-wrapper">
                    <span class="currency">¥</span>
                    <input type="number" class="amount-input" id="amountInput" placeholder="0.00" step="0.01">
                </div>
                <div class="form-group">
                    <label>选择类别</label>
                    <div class="category-grid" id="categoryGrid">
                        <!-- 动态生成类别 -->
                    </div>
                </div>
                <div class="form-group">
                    <label>备注（可选）</label>
                    <input type="text" class="text-input" id="noteInput" placeholder="写点什么...">
                </div>
                <div class="form-group">
                    <label>日期</label>
                    <input type="date" class="text-input" id="dateInput">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary btn-full" id="saveRecordBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 管理类别弹窗 -->
    <div class="modal" id="manageCategoriesModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>管理消费类别</h3>
                <button class="close-btn" id="closeCategoriesModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="add-category-form">
                    <input type="text" class="text-input" id="newCategoryInput" placeholder="输入新类别名称">
                    <button class="btn-primary" id="addCategoryBtn">添加</button>
                </div>
                <div class="categories-list" id="categoriesList">
                    <!-- 动态生成类别列表 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 全部记录弹窗 -->
    <div class="modal" id="allRecordsModal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3>全部记录</h3>
                <button class="close-btn" id="closeAllRecordsModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="filter-bar">
                    <select class="filter-select" id="filterCategory">
                        <option value="">全部类别</option>
                    </select>
                    <select class="filter-select" id="filterMonth">
                        <option value="">全部月份</option>
                    </select>
                </div>
                <div class="records-list" id="allRecordsList">
                    <!-- 动态生成记录 -->
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
