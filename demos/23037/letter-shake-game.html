<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>摇摇字母拼单词</title>
<style>
/* ========== 基础重置 ========== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;
  background:linear-gradient(180deg,#FFF0F5 0%,#FFE4EF 40%,#FFD6E7 100%);
  display:flex;justify-content:center;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  user-select:none;-webkit-user-select:none;
}

/* ========== 主容器 ========== */
#app{
  width:100%;max-width:420px;height:100vh;height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  position:relative;overflow:hidden;
}

/* ========== 开始页 ========== */
.splash{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(180deg,#FFF0F5 0%,#FFD6E7 50%,#FFBCD5 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:200;transition:opacity .6s,transform .6s;
}
.splash.hide{opacity:0;transform:scale(1.1);pointer-events:none}

/* 装饰漂浮元素 */
.deco-float{
  position:absolute;font-size:28px;opacity:.35;
  animation:floatUp 4s ease-in-out infinite;
}
.deco-float:nth-child(1){top:12%;left:10%;animation-delay:0s}
.deco-float:nth-child(2){top:18%;right:12%;animation-delay:1s;font-size:22px}
.deco-float:nth-child(3){bottom:20%;left:15%;animation-delay:2s;font-size:24px}
.deco-float:nth-child(4){bottom:28%;right:10%;animation-delay:.5s;font-size:20px}
.deco-float:nth-child(5){top:35%;left:6%;animation-delay:1.5s;font-size:18px}
.deco-float:nth-child(6){top:42%;right:8%;animation-delay:2.5s;font-size:26px}
@keyframes floatUp{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-14px) rotate(8deg)}
}

.splash-mascot{font-size:64px;margin-bottom:12px;animation:mascotBounce 2s ease-in-out infinite}
@keyframes mascotBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.05)}}

.splash-title{
  font-size:36px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,#FF6B9D,#FF8FB1,#FFB6C1);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:8px;text-shadow:none;
}
.splash-sub{font-size:14px;color:#E8879B;margin-bottom:24px;text-align:center;line-height:1.6}

.btn-start{
  padding:16px 52px;border-radius:30px;border:none;
  background:linear-gradient(135deg,#FF6B9D,#FF8FB1);
  color:#fff;font-size:20px;font-weight:800;cursor:pointer;
  box-shadow:0 6px 20px rgba(255,107,157,.4);
  animation:pulse 2s ease-in-out infinite;
  letter-spacing:2px;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.btn-start:active{transform:scale(.95)!important}

.splash-sound{
  margin-top:20px;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.5);padding:8px 18px;border-radius:20px;
  font-size:13px;color:#E8879B;cursor:pointer;border:none;
}
.splash-sound:active{opacity:.7}

/* ========== 游戏页顶部栏 ========== */
.top-bar{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px 6px;flex-shrink:0;
}
.game-title{
  font-size:16px;font-weight:900;
  background:linear-gradient(135deg,#FF6B9D,#FF8FB1);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.btn-icon{
  width:36px;height:36px;border-radius:50%;border:none;
  background:#fff;font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(255,107,157,.15);transition:transform .15s;
}
.btn-icon:active{transform:scale(.88)}

/* ========== 倒计时 & 分数 ========== */
.info-bar{
  width:100%;display:flex;align-items:center;justify-content:space-around;
  padding:6px 14px;flex-shrink:0;
}
.info-card{
  background:#fff;border-radius:16px;padding:6px 18px;text-align:center;
  box-shadow:0 2px 10px rgba(255,107,157,.12);flex:1;margin:0 6px;
}
.info-label{font-size:11px;color:#E8879B;display:block;font-weight:600}
.info-value{font-size:28px;font-weight:900;color:#FF6B9D;display:block;line-height:1.2}
.info-value.danger{color:#FF3B30;animation:shake .4s ease-in-out infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}

/* ========== 小精灵引导 ========== */
.guide-area{
  width:100%;text-align:center;padding:4px 0;flex-shrink:0;
  font-size:13px;color:#D4869A;font-weight:600;
  min-height:24px;
}
.guide-area .fairy{font-size:18px;vertical-align:middle;margin-right:4px}

/* ========== 摇奖机区域 ========== */
.slots-area{
  width:100%;display:flex;justify-content:center;gap:14px;
  padding:8px 0;flex-shrink:0;
}
.slot-machine{
  width:90px;height:110px;
  background:linear-gradient(180deg,#FFF5F8,#FFE8F0);
  border:3px solid #FFB6C1;
  border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  box-shadow:0 4px 16px rgba(255,107,157,.2),inset 0 2px 4px rgba(255,255,255,.8);
}
/* 摇奖机顶部装饰 */
.slot-machine::before{
  content:'⭐';position:absolute;top:4px;left:50%;transform:translateX(-50%);
  font-size:12px;opacity:.5;
}
/* 摇奖机内部窗口 */
.slot-window{
  width:68px;height:68px;background:#fff;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid #FFD1DC;
  box-shadow:inset 0 2px 6px rgba(255,107,157,.1);
  position:relative;overflow:hidden;
}
.slot-letter{
  font-size:42px;font-weight:900;color:#FF6B9D;
  text-transform:uppercase;line-height:1;
  transition:transform .1s;
}
.slot-letter.rolling{
  animation:slotRoll .12s linear infinite;
}
@keyframes slotRoll{
  0%{transform:translateY(-100%);opacity:0}
  30%{opacity:1}
  70%{opacity:1}
  100%{transform:translateY(100%);opacity:0}
}
.slot-letter.stopped{
  animation:slotStop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes slotStop{
  0%{transform:scale(1.4) translateY(-10px);opacity:.5}
  100%{transform:scale(1) translateY(0);opacity:1}
}
.slot-label{
  position:absolute;bottom:4px;width:100%;text-align:center;
  font-size:9px;color:#E8879B;font-weight:700;
}

/* 摇奖按钮 */
.shake-btn-wrap{
  width:100%;display:flex;justify-content:center;padding:6px 0;flex-shrink:0;
}
.btn-shake{
  padding:12px 36px;border-radius:25px;border:none;
  background:linear-gradient(135deg,#FF6B9D,#FF8FB1);
  color:#fff;font-size:17px;font-weight:800;cursor:pointer;
  box-shadow:0 4px 16px rgba(255,107,157,.35);
  letter-spacing:1px;transition:all .15s;
}
.btn-shake:active{transform:scale(.94)}
.btn-shake:disabled{
  background:#E0D0D5;color:#C0B0B5;box-shadow:none;cursor:not-allowed;
}
.btn-shake.shaking{animation:btnShake .15s ease-in-out infinite}
@keyframes btnShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}

/* ========== 拼词区域 ========== */
.word-area{
  width:100%;padding:6px 14px;flex-shrink:0;
}
.word-area-label{
  font-size:12px;color:#E8879B;font-weight:700;text-align:center;
  margin-bottom:6px;display:block;
}
.word-slots{
  display:flex;justify-content:center;gap:10px;
}
.word-slot{
  width:72px;height:72px;
  background:#fff;
  border:3px dashed #FFB6C1;
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:900;color:#FF6B9D;
  text-transform:uppercase;
  cursor:pointer;transition:all .2s;
  box-shadow:0 2px 8px rgba(255,107,157,.1);
  position:relative;
}
.word-slot.empty{color:transparent}
.word-slot.empty::after{
  content:'?';color:#FFD1DC;font-size:28px;
}
.word-slot.filled{
  border-style:solid;border-color:#FF8FB1;
  background:#FFF5F8;
  animation:slotFill .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes slotFill{0%{transform:scale(.8)}100%{transform:scale(1)}}
.word-slot.correct-slot{
  border-color:#81C784;background:#F1F8E9;color:#4CAF50;
  animation:correctPop .4s ease-out;
}
@keyframes correctPop{0%{transform:scale(1.15)}100%{transform:scale(1)}}
.word-slot.wrong-slot{
  border-color:#E57373;background:#FFEBEE;color:#E57373;
  animation:wrongShake .4s ease-in-out;
}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ========== 候选字母 ========== */
.letter-pool{
  width:100%;padding:8px 14px;flex-shrink:0;
}
.pool-label{
  font-size:12px;color:#E8879B;font-weight:700;text-align:center;
  margin-bottom:6px;display:block;
}
.pool-letters{
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
}
.pool-letter{
  width:56px;height:56px;
  background:linear-gradient(180deg,#FFF0F5,#FFE4EF);
  border:2px solid #FFB6C1;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;color:#FF6B9D;
  text-transform:uppercase;
  cursor:pointer;transition:all .2s;
  box-shadow:0 3px 10px rgba(255,107,157,.15);
}
.pool-letter:active{transform:scale(.9)}
.pool-letter.used{
  opacity:.3;pointer-events:none;transform:scale(.85);
}

/* ========== 操作按钮 ========== */
.actions{
  width:100%;display:flex;gap:8px;justify-content:center;
  padding:8px 14px;flex-shrink:0;
}
.btn{
  padding:10px 20px;border-radius:20px;border:none;
  font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;
  letter-spacing:1px;
}
.btn:active{transform:scale(.94)}
.btn-submit{
  background:linear-gradient(135deg,#FF6B9D,#FF8FB1);
  color:#fff;box-shadow:0 3px 12px rgba(255,107,157,.3);
  flex:1;max-width:160px;font-size:15px;
}
.btn-submit:disabled{background:#E0D0D5;color:#C0B0B5;box-shadow:none}
.btn-clear{background:#FFF0F5;color:#FF8FB1;border:2px solid #FFD1DC}
.btn-reshake{background:#FFF0F5;color:#FF8FB1;border:2px solid #FFD1DC}

/* ========== 反馈提示 ========== */
.feedback{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
  padding:16px 32px;border-radius:20px;
  font-size:20px;font-weight:800;color:#fff;
  z-index:150;pointer-events:none;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s;
  opacity:0;
}
.feedback.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.feedback.correct{background:linear-gradient(135deg,#81C784,#66BB6A);box-shadow:0 4px 20px rgba(102,187,106,.4)}
.feedback.wrong{background:linear-gradient(135deg,#E57373,#EF5350);box-shadow:0 4px 20px rgba(229,115,115,.4)}

/* ========== 结束页 ========== */
.end-page{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(180deg,#FFF0F5 0%,#FFD6E7 50%,#FFBCD5 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:200;opacity:0;pointer-events:none;transition:opacity .5s;
}
.end-page.show{opacity:1;pointer-events:auto}
.end-emoji{font-size:64px;margin-bottom:10px;animation:mascotBounce 2s ease-in-out infinite}
.end-title{font-size:28px;font-weight:900;color:#FF6B9D;margin-bottom:6px}
.end-score-label{font-size:14px;color:#E8879B;margin-bottom:4px}
.end-score{font-size:52px;font-weight:900;color:#FF6B9D;margin-bottom:4px}
.end-words{font-size:13px;color:#D4869A;margin-bottom:24px;text-align:center;line-height:1.8}
.btn-restart{
  padding:14px 44px;border-radius:30px;border:none;
  background:linear-gradient(135deg,#FF6B9D,#FF8FB1);
  color:#fff;font-size:18px;font-weight:800;cursor:pointer;
  box-shadow:0 6px 16px rgba(255,107,157,.35);transition:transform .15s;
}
.btn-restart:active{transform:scale(.94)}

/* ========== 五彩纸屑 ========== */
#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:199}

/* ========== 隐藏/显示 ========== */
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ==================== 开始页 ==================== -->
<div class="splash" id="splash">
  <div class="deco-float">🌸</div>
  <div class="deco-float">✨</div>
  <div class="deco-float">💖</div>
  <div class="deco-float">🎀</div>
  <div class="deco-float">⭐</div>
  <div class="deco-float">🌷</div>
  <div class="splash-mascot">🧚‍♀️</div>
  <div class="splash-title">摇摇字母拼单词</div>
  <div class="splash-sub">
    摇出字母，拼出单词！<br>
    30 秒内尽可能多拼对单词吧～
  </div>
  <button class="btn-start" id="btnStart">开始游戏</button>
  <button class="splash-sound" id="btnSplashSound">🔊 音效已开启</button>
</div>

<!-- ==================== 游戏页 ==================== -->
<div id="app">
  <!-- 顶部栏 -->
  <div class="top-bar">
    <div class="game-title">🧚 摇摇字母</div>
    <button class="btn-icon" id="btnSound">🔊</button>
  </div>

  <!-- 倒计时 & 分数 -->
  <div class="info-bar">
    <div class="info-card">
      <span class="info-label">⏰ 倒计时</span>
      <span class="info-value" id="timer">30</span>
    </div>
    <div class="info-card">
      <span class="info-label">⭐ 得分</span>
      <span class="info-value" id="score">0</span>
    </div>
    <div class="info-card">
      <span class="info-label">✅ 拼对</span>
      <span class="info-value" id="correctCount">0</span>
    </div>
  </div>

  <!-- 小精灵引导 -->
  <div class="guide-area" id="guideArea">
    <span class="fairy">🧚‍♀️</span>
    <span id="guideText">点击下方按钮开始摇字母吧！</span>
  </div>

  <!-- 摇奖机 -->
  <div class="slots-area">
    <div class="slot-machine">
      <div class="slot-window">
        <span class="slot-letter" id="slot0">?</span>
      </div>
      <div class="slot-label">字母1</div>
    </div>
    <div class="slot-machine">
      <div class="slot-window">
        <span class="slot-letter" id="slot1">?</span>
      </div>
      <div class="slot-label">字母2</div>
    </div>
    <div class="slot-machine">
      <div class="slot-window">
        <span class="slot-letter" id="slot2">?</span>
      </div>
      <div class="slot-label">字母3</div>
    </div>
  </div>

  <!-- 摇奖按钮 -->
  <div class="shake-btn-wrap">
    <button class="btn-shake" id="btnShake">🎰 开始摇字母</button>
  </div>

  <!-- 拼词区域 -->
  <div class="word-area">
    <span class="word-area-label">📝 拼词框（点击字母填入）</span>
    <div class="word-slots">
      <div class="word-slot empty" data-index="0" id="ws0"></div>
      <div class="word-slot empty" data-index="1" id="ws1"></div>
      <div class="word-slot empty" data-index="2" id="ws2"></div>
    </div>
  </div>

  <!-- 候选字母 -->
  <div class="letter-pool" id="letterPool" style="visibility:hidden">
    <span class="pool-label">🔤 点击字母填入拼词框</span>
    <div class="pool-letters" id="poolLetters"></div>
  </div>

  <!-- 操作按钮 -->
  <div class="actions" id="actionBtns" style="visibility:hidden">
    <button class="btn btn-clear" id="btnClear">🗑 清空</button>
    <button class="btn btn-submit" id="btnSubmit" disabled>✅ 提交答案</button>
    <button class="btn btn-reshake" id="btnReshake">🔄 重摇</button>
  </div>
</div>

<!-- 反馈提示 -->
<div class="feedback" id="feedback"></div>

<!-- ==================== 结束页 ==================== -->
<div class="end-page" id="endPage">
  <div class="end-emoji" id="endEmoji">🎉</div>
  <div class="end-title" id="endTitle">时间到！</div>
  <div class="end-score-label">最终得分</div>
  <div class="end-score" id="endScore">0</div>
  <div class="end-words" id="endWords">拼对单词：0 个</div>
  <button class="btn-restart" id="btnRestart">🔄 再来一局</button>
</div>

<!-- 五彩纸屑画布 -->
<canvas id="confetti"></canvas>

<script>
// ============================================================
//  摇摇字母拼单词 — 游戏逻辑
// ============================================================

// ---------- 单词库（儿童入门级 3 字母单词） ----------
const WORD_BANK = [
  'cat','dog','pen','cap','map','egg','ant','box',
  'cup','hat','sun','bus','bed','red','pig','cow',
  'fox','bee','bat','rat','hot','pot','top','big',
  'dig','log','mug','bug','rug','hug','fun','run',
  'bun','nut','cut','but','sit','hit','bit','fit',
  'mix','six','fix','win','pin','tin','bin','zip',
  'lip','tip','sip','van','fan','man','can','pan',
  'tan','ran','ban','had','bad','dad','mad','sad',
  'bag','tag','lag','wag','jam','ham','ram','yam',
  'wet','net','let','get','bet','pet','set','jet',
  'ten','hen','men','den','pen','gem','ate','late',
  'ice','age','ace','ape','use','ore','ear','eat',
  'tea','sea','pea','key','day','may','pay','say',
  'way','bay','lay','toy','boy','joy','cry','dry',
  'fry','try','sky','fly','gum','sum','drum','rum'
];

// 去重 & 只保留恰好 3 字母的单词
const WORDS = [...new Set(WORD_BANK.filter(w => w.length === 3))];

// ---------- 全局状态 ----------
let soundOn = true;
let gameTimer = null;
let timeLeft = 30;
let score = 0;
let correctTotal = 0;
let currentLetters = [];   // 当前摇出的3个字母
let wordSlots = ['','','']; // 拼词框内容
let isShaking = false;
let gameOver = false;
let answeredWords = [];     // 已拼对的单词

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const splash    = $('splash');
const appEl     = $('app');
const timerEl   = $('timer');
const scoreEl   = $('score');
const correctEl = $('correctCount');
const guideText = $('guideText');
const slotEls   = [$('slot0'), $('slot1'), $('slot2')];
const btnShake  = $('btnShake');
const letterPool= $('letterPool');
const poolLetters=$('poolLetters');
const wsEls     = [$('ws0'), $('ws1'), $('ws2')];
const btnSubmit = $('btnSubmit');
const btnClear  = $('btnClear');
const btnReshake= $('btnReshake');
const feedbackEl= $('feedback');
const endPage   = $('endPage');
const endEmoji  = $('endEmoji');
const endTitle  = $('endTitle');
const endScore  = $('endScore');
const endWords  = $('endWords');
const confettiCanvas = $('confetti');

// ============================================================
//  音效系统（Web Audio API）
// ============================================================
let audioCtx = null;
function getAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// 简短音调
function playTone(freq, dur, type='sine', vol=0.15){
  if(!soundOn) return;
  try{
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  }catch(e){}
}

function sfxClick(){ playTone(800, 0.08, 'sine', 0.1); }
function sfxRoll(){ playTone(400 + Math.random()*300, 0.06, 'square', 0.06); }
function sfxStop(){ playTone(600, 0.15, 'sine', 0.12); }
function sfxCorrect(){
  playTone(523, 0.12, 'sine', 0.15);
  setTimeout(()=> playTone(659, 0.12, 'sine', 0.15), 100);
  setTimeout(()=> playTone(784, 0.2, 'sine', 0.18), 200);
}
function sfxWrong(){
  playTone(300, 0.15, 'sawtooth', 0.1);
  setTimeout(()=> playTone(250, 0.2, 'sawtooth', 0.1), 120);
}
function sfxTimeUp(){
  playTone(440, 0.2, 'square', 0.12);
  setTimeout(()=> playTone(440, 0.2, 'square', 0.12), 250);
  setTimeout(()=> playTone(440, 0.3, 'square', 0.15), 500);
}
function sfxStart(){
  playTone(523, 0.1, 'sine', 0.12);
  setTimeout(()=> playTone(659, 0.1, 'sine', 0.12), 80);
  setTimeout(()=> playTone(784, 0.15, 'sine', 0.15), 160);
  setTimeout(()=> playTone(1047, 0.2, 'sine', 0.18), 260);
}

// ============================================================
//  五彩纸屑
// ============================================================
const confettiCtx = confettiCanvas.getContext('2d');
let confettiPieces = [];
let confettiAnim = null;

function resizeConfetti(){
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeConfetti);
resizeConfetti();

function launchConfetti(count=60){
  confettiPieces = [];
  const colors = ['#FF6B9D','#FF8FB1','#FFB6C1','#FFD1DC','#FFC1CC',
                   '#FF69B4','#FF1493','#FFB7C5','#FF91A4','#FFA6C9'];
  for(let i=0;i<count;i++){
    confettiPieces.push({
      x: Math.random()*confettiCanvas.width,
      y: -10 - Math.random()*40,
      w: 6+Math.random()*6,
      h: 4+Math.random()*4,
      color: colors[Math.floor(Math.random()*colors.length)],
      vy: 1.5+Math.random()*3,
      vx: (Math.random()-0.5)*2,
      rot: Math.random()*360,
      rotV: (Math.random()-0.5)*10,
      life: 1
    });
  }
  if(!confettiAnim) animateConfetti();
}

function animateConfetti(){
  confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  let alive = false;
  confettiPieces.forEach(p=>{
    if(p.life <= 0) return;
    alive = true;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.rotV;
    p.vy += 0.05;
    if(p.y > confettiCanvas.height + 20) p.life = 0;
    confettiCtx.save();
    confettiCtx.translate(p.x, p.y);
    confettiCtx.rotate(p.rot * Math.PI / 180);
    confettiCtx.globalAlpha = p.life;
    confettiCtx.fillStyle = p.color;
    confettiCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    confettiCtx.restore();
    p.life -= 0.003;
  });
  if(alive){
    confettiAnim = requestAnimationFrame(animateConfetti);
  } else {
    confettiAnim = null;
    confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  }
}

// ============================================================
//  游戏核心
// ============================================================

// 根据单词库随机选一个单词，打乱字母
function pickWord(){
  const word = WORDS[Math.floor(Math.random()*WORDS.length)];
  const letters = word.split('');
  // 打乱字母顺序（Fisher-Yates）
  for(let i=letters.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [letters[i],letters[j]] = [letters[j],letters[i]];
  }
  return { word, letters };
}

// 更新拼词框 UI
function updateWordSlots(){
  wsEls.forEach((el,i)=>{
    el.className = 'word-slot';
    if(wordSlots[i]){
      el.textContent = wordSlots[i];
      el.classList.add('filled');
    } else {
      el.textContent = '';
      el.classList.add('empty');
    }
  });
  // 检查提交按钮
  btnSubmit.disabled = !wordSlots.every(s=>s!=='');
}

// 更新候选字母池
function updatePool(){
  poolLetters.innerHTML = '';
  currentLetters.forEach((ch, i)=>{
    const div = document.createElement('div');
    div.className = 'pool-letter';
    div.textContent = ch;
    div.dataset.idx = i;
    // 检查是否已被使用
    const usedCount = wordSlots.filter(s=>s===ch).length;
    const poolUsedCount = currentLetters.slice(0,i).filter(c=>c===ch).length;
    // 统计这个字母在 pool 中已用的次数
    let totalInPool = 0;
    for(let j=0;j<=i;j++){
      if(currentLetters[j]===ch && wordSlots.includes(ch)){
        // 复杂逻辑简化处理：通过点击事件控制
      }
    }
    div.addEventListener('click', ()=> onPoolClick(i, ch));
    poolLetters.appendChild(div);
  });
  refreshPoolUsedState();
}

// 刷新字母池中已用状态
function refreshPoolUsedState(){
  const poolDivs = poolLetters.querySelectorAll('.pool-letter');
  // 统计每个字母在拼词框中出现的次数
  const slotCounts = {};
  wordSlots.forEach(s=>{
    if(s) slotCounts[s] = (slotCounts[s]||0) + 1;
  });
  // 对每个 pool 字母，看它是否已分配
  const assignedCount = {};
  poolDivs.forEach(div=>{
    const ch = div.textContent.toLowerCase();
    assignedCount[ch] = (assignedCount[ch]||0);
    if(assignedCount[ch] < (slotCounts[ch]||0)){
      div.classList.add('used');
    } else {
      div.classList.remove('used');
    }
    assignedCount[ch]++;
  });
}

// 点击候选字母
function onPoolClick(poolIdx, ch){
  if(gameOver) return;
  sfxClick();
  // 找第一个空的拼词框
  const emptyIdx = wordSlots.indexOf('');
  if(emptyIdx === -1) return;
  wordSlots[emptyIdx] = ch;
  updateWordSlots();
  refreshPoolUsedState();
}

// 点击拼词框移除字母
wsEls.forEach((el,i)=>{
  el.addEventListener('click', ()=>{
    if(gameOver) return;
    if(wordSlots[i]){
      sfxClick();
      wordSlots[i] = '';
      updateWordSlots();
      refreshPoolUsedState();
    }
  });
});

// 摇奖动画
function shakeLetters(){
  if(isShaking || gameOver) return;
  isShaking = true;
  sfxStart();

  // 清空之前的状态
  wordSlots = ['','',''];
  updateWordSlots();
  btnShake.disabled = true;
  btnShake.classList.add('shaking');
  btnShake.textContent = '🎰 摇奖中...';
  letterPool.style.visibility = 'hidden';
  $('actionBtns').style.visibility = 'hidden';
  guideText.textContent = '摇奖机转动中...';

  // 随机选单词
  const { word, letters } = pickWord();
  currentLetters = letters;

  // 滚动动画：每个槽位不同时间停止
  const rollDuration = [800, 1200, 1600]; // 三个槽位依次停止

  // 开始滚动
  slotEls.forEach(el=>{
    el.classList.remove('stopped');
    el.classList.add('rolling');
  });

  // 滚动期间随机切换字母
  const rollIntervals = slotEls.map((el, i) => {
    return setInterval(()=>{
      el.textContent = String.fromCharCode(97 + Math.floor(Math.random()*26));
      sfxRoll();
    }, 80);
  });

  // 依次停止
  rollDuration.forEach((dur, i) => {
    setTimeout(()=>{
      clearInterval(rollIntervals[i]);
      slotEls[i].classList.remove('rolling');
      slotEls[i].classList.add('stopped');
      slotEls[i].textContent = letters[i];
      sfxStop();
    }, dur);
  });

  // 全部停止后显示候选字母
  setTimeout(()=>{
    isShaking = false;
    btnShake.classList.remove('shaking');
    btnShake.textContent = '🎰 重新摇字母';
    btnShake.disabled = false;
    letterPool.style.visibility = 'visible';
    $('actionBtns').style.visibility = 'visible';
    updatePool();
    guideText.textContent = '点击字母拼出正确的单词吧！';
  }, rollDuration[2] + 300);
}

// 提交答案
function submitAnswer(){
  if(gameOver) return;
  const answer = wordSlots.join('').toLowerCase();

  if(WORDS.includes(answer)){
    // 正确
    sfxCorrect();
    score += 10;
    correctTotal++;
    scoreEl.textContent = score;
    correctEl.textContent = correctTotal;
    answeredWords.push(answer);
    wsEls.forEach(el=> el.classList.add('correct-slot'));
    showFeedback('✅ 正确！+10分', 'correct');
    guideText.textContent = `太棒了！「${answer}」拼对了！`;
    launchConfetti(30);

    // 延迟后自动进入下一轮
    setTimeout(()=>{
      if(!gameOver) nextRound();
    }, 1200);
  } else {
    // 错误
    sfxWrong();
    wsEls.forEach(el=> el.classList.add('wrong-slot'));
    showFeedback('❌ 不对哦，再试试！', 'wrong');
    guideText.textContent = '这个不是正确的单词，重新排列试试！';

    // 延迟后恢复
    setTimeout(()=>{
      wsEls.forEach(el=>{
        el.classList.remove('wrong-slot','correct-slot');
      });
    }, 800);
  }
}

// 下一轮
function nextRound(){
  wordSlots = ['','',''];
  updateWordSlots();
  letterPool.style.visibility = 'hidden';
  $('actionBtns').style.visibility = 'hidden';
  slotEls.forEach(el=>{
    el.className = 'slot-letter';
    el.textContent = '?';
  });
  guideText.textContent = '点击按钮摇出新字母！';
}

// 清空拼词框
function clearSlots(){
  if(gameOver) return;
  sfxClick();
  wordSlots = ['','',''];
  updateWordSlots();
  refreshPoolUsedState();
}

// 重摇
function reshake(){
  if(gameOver || isShaking) return;
  shakeLetters();
}

// 显示反馈
function showFeedback(text, type){
  feedbackEl.textContent = text;
  feedbackEl.className = 'feedback ' + type;
  // 触发 reflow 以重启动画
  void feedbackEl.offsetWidth;
  feedbackEl.classList.add('show');
  setTimeout(()=>{
    feedbackEl.classList.remove('show');
  }, 1200);
}

// ============================================================
//  倒计时
// ============================================================
function startTimer(){
  timeLeft = 30;
  timerEl.textContent = timeLeft;
  timerEl.classList.remove('danger');
  gameTimer = setInterval(()=>{
    timeLeft--;
    timerEl.textContent = timeLeft;
    if(timeLeft <= 10){
      timerEl.classList.add('danger');
    }
    if(timeLeft <= 0){
      clearInterval(gameTimer);
      endGame();
    }
  }, 1000);
}

// ============================================================
//  开始 / 结束
// ============================================================
function startGame(){
  gameOver = false;
  score = 0;
  correctTotal = 0;
  answeredWords = [];
  scoreEl.textContent = '0';
  correctEl.textContent = '0';
  wordSlots = ['','',''];
  updateWordSlots();
  slotEls.forEach(el=>{
    el.className = 'slot-letter';
    el.textContent = '?';
  });
  letterPool.style.visibility = 'hidden';
  $('actionBtns').style.visibility = 'hidden';
  btnShake.disabled = false;
  btnShake.textContent = '🎰 开始摇字母';
  guideText.textContent = '点击下方按钮开始摇字母吧！';
  endPage.classList.remove('show');
  startTimer();
  sfxStart();
}

function endGame(){
  gameOver = true;
  sfxTimeUp();
  clearInterval(gameTimer);
  timerEl.textContent = '0';

  // 显示结束页
  setTimeout(()=>{
    if(correctTotal >= 3){
      endEmoji.textContent = '🏆';
      endTitle.textContent = '太厉害了！';
    } else if(correctTotal >= 1){
      endEmoji.textContent = '🎉';
      endTitle.textContent = '做得不错！';
    } else {
      endEmoji.textContent = '💪';
      endTitle.textContent = '继续加油！';
    }
    endScore.textContent = score;
    const wordList = answeredWords.length > 0
      ? '拼对单词：' + answeredWords.join('、')
      : '还没有拼对单词哦～';
    endWords.textContent = wordList + `\n共 ${correctTotal} 个`;
    endPage.classList.add('show');
    if(correctTotal > 0) launchConfetti(80);
  }, 500);
}

function toggleSound(){
  soundOn = !soundOn;
  $('btnSound').textContent = soundOn ? '🔊' : '🔇';
  $('btnSplashSound').textContent = soundOn ? '🔊 音效已开启' : '🔇 音效已关闭';
}
