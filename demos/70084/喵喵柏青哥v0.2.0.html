         * config.js - 游戏全局配置与数值体系（三层炮塔版 v0.2.1）

         *
         * 坐标系：Canvas 左上角(0,0)，X右为正，Y下为正
         * 游戏区域：三层三明治结构
         *   - 顶部炮塔区（自动旋转 -60°~+60°）
         *   - 中部钉子区（长条状）
         *   - 底部得分区（三级阶梯：300/200/100）
         * 关卡结构：8轮×3小关卡（小型/大型/Boss盲注），参考小丑牌
         *
         * 版本号: 0.2.0 (大版本.功能增减.数值变化或功能修改)
         */

        const GAME_VERSION = '0.2.1';

        class ConfigLoader {
            static async _parseCsvFile(path) {
                try {
                    const response = await fetch(path);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const text = await response.text();
                    const lines = text.split(/\r?\n/).filter(l => l.trim());
                    if (lines.length < 2) return [];
                    const headers = lines[0].split(',');
                    const results = [];
                    for (let i = 1; i < lines.length; i++) {
                        const values = lines[i].split(',');
                        const item = {};
                        for (let j = 0; j < headers.length; j++) {
                            item[headers[j]] = values[j] || '';
                        }
                        results.push(item);
                    }
                    return results;
                } catch (e) {
                    console.error(`[ConfigLoader] Failed to load ${path}:`, e);
                    return null;
                }
            }

            static parseVersion(versionStr) {
                const parts = versionStr.split('.').map(p => parseInt(p) || 0);
                return { major: parts[0] || 0, minor: parts[1] || 0, patch: parts[2] || 0 };
            }

            static compareVersions(v1, v2) {
                if (v1.major !== v2.major) return v1.major - v2.major;
                if (v1.minor !== v2.minor) return v1.minor - v2.minor;
                return v1.patch - v2.patch;
            }

            static get expectedVersions() {
                return {

                        pegPink: '1.0.0', pegCyan: '1.0.0', pegYellow: '1.0.0',

                        bank: '1.0.1', goldTouch: '1.0.0', edgeMaster: '1.0.1',
                        streak: '1.0.0', pegMaster: '1.0.1', glassCannon: '1.0.0',

                        lowBounce: '1.0.0', concentrate: '1.0.0',
                    },
                };
            }

            // 每种 CSV 对应的类型标签（用于错误信息）
            static typeLabel = {
                chips: '筹码',
                balls: '珠子',
                pegs: '钉子',
                connectors: '连接块',
                bosses: 'Boss',
            };

            static async verifyVersions() {
                const errors = [];
                const validStatuses = ['active', 'deprecated', 'removed', 'beta'];
                const fileNames = ['chips', 'balls', 'pegs', 'connectors', 'bosses'];
                const ev = this.expectedVersions;

                for (const name of fileNames) {
                    const items = await this._parseCsvFile(`data/${name}.csv`);
                    if (items === null) {
                        errors.push(`无法加载文件: data/${name}.csv`);
                        continue;
                    }

                    const type = this.typeLabel[name];

                    for (const item of items) {
                        const id = item['ID'];
                        const csvVersion = item['版本'] || '0.0.0';
                        const status = item['状态'] || '';

                        if (!validStatuses.includes(status)) {
                            errors.push(`无效状态: ${type} - ${id} (状态: ${status})`);
                        }

                        const expectedVersion = ev[name][id];

                        if (expectedVersion === undefined) {
                            errors.push(`未知条目: ${type} - ${id}`);
                        } else if (expectedVersion !== csvVersion) {
                            const parsedExpected = this.parseVersion(expectedVersion);
                            const parsedCsv = this.parseVersion(csvVersion);
                            const cmp = this.compareVersions(parsedCsv, parsedExpected);
                            if (cmp > 0) {
                                errors.push(`版本超前: ${type} - ${id} (代码期望 ${expectedVersion}, CSV为 ${csvVersion})`);
                            } else if (cmp < 0) {
                                errors.push(`版本过期: ${type} - ${id} (代码期望 ${expectedVersion}, CSV为 ${csvVersion})`);
                            }
                        }
                    }
                }

                return errors;
            }
        }

         * - doubleLose: 双倍失败（低沉嗡嗡）
         * - bossIntro: Boss 介绍（警报声）

         */
        const SFX = {
            ctx: null,
            volume: 0.4,
            _init() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();

            _gain(val) {

            play(id, opts = {}) {
                if (!this.ctx) this._init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                switch (id) {
                    case 'pegHit': this._pegHit(opts.color); break;
                    case 'slotScore': this._slotScore(opts.score); break;
                    case 'miss': this._miss(); break;
                    case 'launch': this._launch(); break;
                    case 'fission': this._fission(); break;
                    case 'doubleWin': this._doubleWin(); break;
                    case 'doubleLose': this._doubleLose(); break;
                    case 'bossIntro': this._bossIntro(); break;
                    case 'purchase': this._purchase(); break;
                    case 'gameOver': this._gameOver(); break;
                    case 'victory': this._victory(); break;
                    case 'shopRefresh': this._shopRefresh(); break;
                    case 'goldExchange': this._goldExchange(); break;
                    case 'burning': this._burning(); break;
                }
            },
            _osc(type, freq, dur, opts = {}) {
                const o = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                o.type = type;
                o.frequency.setValueAtTime(freq, this.ctx.currentTime);
                if (opts.freqEnd) o.frequency.exponentialRampToValueAtTime(opts.freqEnd, this.ctx.currentTime + dur);
                g.gain.setValueAtTime(this._gain(opts.startGain || 0.2), this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                o.connect(g);
                g.connect(this.ctx.destination);
                o.start();
                o.stop(this.ctx.currentTime + dur);
            },
            _noise(dur, opts = {}) {
                const bufferSize = this.ctx.sampleRate * dur;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * (opts.amp || 0.3);
                }
                const s = this.ctx.createBufferSource();
                s.buffer = buffer;
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(this._gain(opts.startGain || 0.15), this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                if (opts.filter) {
                    const f = this.ctx.createBiquadFilter();
                    f.type = 'lowpass';
                    f.frequency.setValueAtTime(opts.filter.start, this.ctx.currentTime);
                    f.frequency.exponentialRampToValueAtTime(opts.filter.end, this.ctx.currentTime + dur);
                    s.connect(f);
                    f.connect(g);
                } else {
                    s.connect(g);
                }
                g.connect(this.ctx.destination);
                s.start();
            },
            _pegHit(color) {

            },
            _miss() {

            },
            _launch() {
                this._noise(0.4, {
                    startGain: 0.2,
                    filter: { start: 200, end: 800 }

            },
            _fission() {
                this._noise(0.25, { startGain: 0.2 });
                this._osc('square', 200, 0.2, { startGain: 0.15, freqEnd: 80 });
            },
            _doubleWin() {

                setTimeout(() => this._osc('sine', 880, 0.2, { startGain: 0.25 }), 80);
                setTimeout(() => this._osc('sine', 1047, 0.3, { startGain: 0.3 }), 160);
            },
            _doubleLose() {
                this._osc('sawtooth', 100, 0.4, { startGain: 0.15, freqEnd: 50 });
            },
            _bossIntro() {
                const t = this.ctx.currentTime;
                const o = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(440, t);
                o.frequency.setValueAtTime(660, t + 0.15);
                o.frequency.setValueAtTime(440, t + 0.3);
                o.frequency.setValueAtTime(660, t + 0.45);
                g.gain.setValueAtTime(this._gain(0.1), t);
                g.gain.exponentialRampToValueAtTime(this._gain(0.15), t + 0.1);
                g.gain.exponentialRampToValueAtTime(this._gain(0.001), t + 0.6);
                o.connect(g);
                g.connect(this.ctx.destination);
                o.start(t);
                o.stop(t + 0.6);

            _purchase() {

            _gameOver() {

            _victory() {

            _shopRefresh() {

            _goldExchange() {

            _burning() {
                const t = this.ctx.currentTime;
                // 火焰噪音
                const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.6, this.ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    data[i] = (Math.random() * 2 - 1) * (1 - i / data.length) * 0.3;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buf;
                const ng = this.ctx.createGain();
                ng.gain.setValueAtTime(0.15, t);
                ng.gain.exponentialRampToValueAtTime(0.001, t + 0.6);

                noise.start(t);
                // 上扬和弦
                this._osc('sawtooth', 440, 0.4, { startGain: 0.15, freqEnd: 880 });
                setTimeout(() => this._osc('square', 660, 0.3, { startGain: 0.12, freqEnd: 990 }), 100);
                setTimeout(() => this._osc('sine', 880, 0.5, { startGain: 0.2 }), 200);
            },
        };

        /**
         * physics.js - 轻量级2D物理引擎
         * 圆形-圆形、圆形-线段、圆形-矩形碰撞检测与响应
         * 支持重力、阻尼、反弹
         */
        const Physics = {
            balls: [],
            pegs: [],
            walls: [],       // {type:'seg'|'rect', ...}
            gravity: 980,
            substeps: 3,

            reset() {
                this.balls = [];
                this.pegs = [];
                this.walls = [];
            },

            addBall(x, y, r, opts = {}) {
                const b = {
                    x, y, vx: 0, vy: 0, r,
                    bounce: opts.bounce ?? 0.5,
                    friction: opts.friction ?? 0.1,
                    alive: true,
                    trail: [],
                    trailLen: opts.trailLen ?? 0,
                    data: opts.data ?? null
                };
                this.balls.push(b);
                return b;
            },

            addPeg(x, y, r, opts = {}) {
                const p = { x, y, r, bounce: opts.bounce ?? 0.55, friction: opts.friction ?? 0.1 };
                this.pegs.push(p);
                return p;
            },

            addSegWall(ax, ay, bx, by, opts = {}) {
                const wall = {
                    type: 'seg', ax, ay, bx, by,
                    maxHits: opts.maxHits || 0,
                    hits: 0,
                    broken: false,
                    onHit: opts.onHit || null,
                    color: opts.color || '#00f5d4',
                };
                this.walls.push(wall);
                return wall;
            },

            addRectWall(x, y, w, h) {
                const wall = { type: 'rect', x, y, w, h };
                this.walls.push(wall);
                return wall;
            },

            // 圆弧墙：mode 'inner' 球在圆弧内侧滑行；mode 'outer' 球在圆弧外侧滑行
            addArcWall(cx, cy, r, a1, a2, mode = 'inner') {
                this.walls.push({ type: 'arc', cx, cy, r, a1, a2, mode });
            },

            step(dt) {
                const sub = this.substeps;
                const sdt = dt / sub;
                this._stepCounter = (this._stepCounter || 0) + 1;
                for (let s = 0; s < sub; s++) {
                    for (const ball of this.balls) {
                        if (!ball.alive) continue;
                        // 球级别重力倍率（slow 连接块用），默认1
                        const gMul = (ball.data && ball.data.gravityMul) || 1;
                        ball.vy += this.gravity * gMul * sdt;
                        ball.vx *= (1 - 0.02 * sdt);
                        ball.vy *= (1 - 0.02 * sdt);
                        ball.x += ball.vx * sdt;
                        ball.y += ball.vy * sdt;

                        // trail
                        if (ball.trailLen > 0) {
                            ball.trail.push({ x: ball.x, y: ball.y });
                            if (ball.trail.length > ball.trailLen) ball.trail.shift();
                        }

                        this._collidePegs(ball);
                        this._collideWalls(ball);
                    }
                }
            },

            _collidePegs(ball) {
                for (const p of this.pegs) {
                    if (p.glass) continue;  // 透明钉：球穿过不碰撞
                    const dx = ball.x - p.x;
                    const dy = ball.y - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minD = ball.r + p.r;
                    if (dist < minD && dist > 0.001) {
                        const nx = dx / dist;
                        const ny = dy / dist;
                        const overlap = minD - dist;
                        ball.x += nx * overlap;
                        ball.y += ny * overlap;
                        const dvx = ball.vx;
                        const dvy = ball.vy;
                        const dot = dvx * nx + dvy * ny;
                        if (dot < 0) {
                            const b = Math.min(1, p.bounce + (ball.bounce - 0.5));
                            ball.vx = dvx - (1 + b) * dot * nx;
                            ball.vy = dvy - (1 + b) * dot * ny;
                            ball.vx *= (1 - p.friction * 0.3);
                            // dot<0 已防止 substep 内重复计数（反弹后球远离钉子）
                            // 不同球可独立触发同一钉子（修复多球同帧碰撞漏计分）
                            if (ball.onPegHit) ball.onPegHit(p);
                        }
                    }
                }
            },

            _collideWalls(ball) {
                for (const w of this.walls) {
                    if (w.type === 'rect') {
                        this._collideRect(ball, w);
                    } else if (w.type === 'arc') {
                        this._collideArc(ball, w);
                    } else {
                        this._collideSeg(ball, w);
                    }
                }
            },

            _collideRect(ball, w) {
                const cx = Math.max(w.x, Math.min(ball.x, w.x + w.w));
                const cy = Math.max(w.y, Math.min(ball.y, w.y + w.h));
                const dx = ball.x - cx;
                const dy = ball.y - cy;
                const dist2 = dx * dx + dy * dy;
                if (dist2 < ball.r * ball.r) {
                    let nx, ny, dist;
                    if (dist2 < 0.0001) {
                        const lx = ball.x - w.x;
                        const rx = w.x + w.w - ball.x;
                        const ty = ball.y - w.y;
                        const by = w.y + w.h - ball.y;
                        const m = Math.min(lx, rx, ty, by);
                        if (m === lx) { nx = -1; ny = 0; dist = lx; }
                        else if (m === rx) { nx = 1; ny = 0; dist = rx; }
                        else if (m === ty) { nx = 0; ny = -1; dist = ty; }
                        else { nx = 0; ny = 1; dist = by; }
                    } else {
                        dist = Math.sqrt(dist2);
                        nx = dx / dist;
                        ny = dy / dist;
                    }
                    const overlap = ball.r - dist;
                    ball.x += nx * overlap;
                    ball.y += ny * overlap;
                    const dot = ball.vx * nx + ball.vy * ny;
                    if (dot < 0) {
                        ball.vx -= (1 + ball.bounce) * dot * nx;
                        ball.vy -= (1 + ball.bounce) * dot * ny;
                    }
                }
            },

            _collideSeg(ball, w) {
                if (w.broken) return;
                const ax = w.ax, ay = w.ay, bx = w.bx, by = w.by;
                const abx = bx - ax, aby = by - ay;
                const apx = ball.x - ax, apy = ball.y - ay;
                const ab2 = abx * abx + aby * aby;
                let t = ab2 > 0 ? (apx * abx + apy * aby) / ab2 : 0;
                t = Math.max(0, Math.min(1, t));
                const cx = ax + t * abx;
                const cy = ay + t * aby;
                const dx = ball.x - cx;
                const dy = ball.y - cy;
                const dist2 = dx * dx + dy * dy;
                if (dist2 < ball.r * ball.r && dist2 > 0.0001) {
                    const dist = Math.sqrt(dist2);
                    const nx = dx / dist;
                    const ny = dy / dist;
                    const overlap = ball.r - dist;
                    ball.x += nx * overlap;
                    ball.y += ny * overlap;
                    const dot = ball.vx * nx + ball.vy * ny;
                    if (dot < 0) {
                        ball.vx -= (1 + ball.bounce) * dot * nx;
                        ball.vy -= (1 + ball.bounce) * dot * ny;

                        if (w.maxHits > 0) {
                            // 同一 step() 调用内只计一次碰撞（防止 substeps 多次计数）
                            if (w._lastHitStep !== this._stepCounter) {
                                w._lastHitStep = this._stepCounter;
                                w.hits++;
                                if (w.onHit) w.onHit(ball, w);
                                if (w.hits >= w.maxHits) {
                                    w.broken = true;
                                }
                            }
                        }
                    }
                }
            },

            _collideArc(ball, w) {
                const dx = ball.x - w.cx;
                const dy = ball.y - w.cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 0.001) return;
                const angle = Math.atan2(dy, dx);
                const minA = Math.min(w.a1, w.a2);
                const maxA = Math.max(w.a1, w.a2);
                if (angle < minA || angle > maxA) return;
                if (w.mode === 'outer') {
                    // 外侧碰撞：球在圆外，法线从圆心指向球，把球推离圆心
                    const outerLimit = w.r + ball.r;
                    if (dist < outerLimit) {
                        const nx = dx / dist;
                        const ny = dy / dist;
                        const overlap = outerLimit - dist;
                        ball.x += nx * overlap;
                        ball.y += ny * overlap;
                        const dot = ball.vx * nx + ball.vy * ny;
                        if (dot < 0) {
                            ball.vx -= (1 + ball.bounce) * dot * nx;
                            ball.vy -= (1 + ball.bounce) * dot * ny;
                        }
                    }
                } else {
                    // 内侧碰撞：球在圆内，法线从球指向圆心，把球推向圆心
                    // 只在圆弧附近生效，避免远处球被错误吸引
                    const innerLimit = w.r - ball.r;
                    if (dist > innerLimit && dist < w.r + ball.r) {
                        const nx = dx / dist;
                        const ny = dy / dist;
                        const overlap = dist - innerLimit;
                        ball.x -= nx * overlap;
                        ball.y -= ny * overlap;
                        // 法向速度完全吸收，只保留切向速度，球会沿圆弧内侧滑行
                        const dot = ball.vx * nx + ball.vy * ny;
                        if (dot > 0) {
                            ball.vx -= dot * nx;
                            ball.vy -= dot * ny;
                        }
                    }
                }
            }
        };

        /**
         * renderer.js - Canvas 2D 渲染器（复古赛博霓虹风格）
         *
         * 视觉特色：
         * - 深黑→暗红渐变背景 + 透视网格（赛博朋克标志性元素）
         * - 霓虹粉墙体 + 粉色发光边框
         * - 钉子粉/青/黄/绿四色霓虹发光（shadowBlur bloom）
         * - 球白色 + 青色光晕；分身球粉色 + 粉色光晕
         * - 黑洞粉色旋转光环
         * - 得分槽按分数霓虹色（粉/橙/黄/青/绿）
         * - 商店三类商品（筹码=方形/珠子=圆形/钉子=菱形）
         * - 全局禁止蓝紫渐变色
         */

        class Renderer {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.w = Config.view.w;
                this.h = Config.view.h;
                this.effects = [];      // 粒子特效列表
                this.floats = [];       // 浮动文字列表
                this.shake = 0;         // 屏幕震动强度
                this.flash = 0;         // 屏幕闪光强度
                this.scanPhase = 0;     // 扫描线动画相位
                this.particlePool = []; // 粒子对象池
                this.maxParticles = 200;// 粒子总数封顶
            }

            // 添加粒子特效（爆炸/消失等）
            addEffect(x, y, color, count, speed, life) {
                // 封顶：超出则减少生成数
                if (this.effects.length >= this.maxParticles) count = Math.min(count, 4);
                for (let i = 0; i < count; i++) {
                    const a = Math.random() * Math.PI * 2;
                    const s = speed * (0.5 + Math.random() * 0.5);
                    // 从池中取或新建
                    let e = this.particlePool.pop();
                    if (e) {
                        e.x = x; e.y = y;
                        e.vx = Math.cos(a) * s; e.vy = Math.sin(a) * s;
                        e.color = color;
                        e.life = life * (0.5 + Math.random()); e.maxLife = life;
                        e.size = 2 + Math.random() * 2;
                    } else {
                        e = {
                            x, y,
                            vx: Math.cos(a) * s,
                            vy: Math.sin(a) * s,
                            color,
                            life: life * (0.5 + Math.random()),
                            maxLife: life,
                            size: 2 + Math.random() * 2
                        };
                    }
                    this.effects.push(e);
                }
            }

            // 添加浮动文字（得分提示等）
            addFloat(x, y, text, color, size) {
                this.floats.push({ x, y, text, color, size, life: 0.8, maxLife: 0.8 });
            }

            // 更新特效与动画状态
            update(dt) {
                this.scanPhase += dt;
                if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 30);
                if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 2.5);
                // 粒子更新（死亡粒子回收到池）
                for (let i = this.effects.length - 1; i >= 0; i--) {
                    const e = this.effects[i];
                    e.life -= dt;
                    if (e.life <= 0) {
                        this.effects.splice(i, 1);
                        if (this.particlePool.length < this.maxParticles) this.particlePool.push(e);
                        continue;
                    }
                    e.x += e.vx * dt;
                    e.y += e.vy * dt;
                    e.vx *= (1 - dt * 2.5);
                    e.vy *= (1 - dt * 2.5);
                }
                // 浮动文字更新（向上飘移）
                for (let i = this.floats.length - 1; i >= 0; i--) {
                    const f = this.floats[i];
                    f.life -= dt;
                    f.y -= dt * 50;
                    if (f.life <= 0) this.floats.splice(i, 1);
                }
            }

            // 主渲染入口
            render(state) {
                const C = Config;
                const ctx = this.ctx;
                ctx.save();
                // 屏幕震动
                if (this.shake > 0) {
                    ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
                }
                this._drawBG(ctx, C);
                this._drawField(ctx, state, C);
                this._drawTurret(ctx, state, C);
                this._drawPegs(ctx, state);
                this._drawConnectors(ctx, state);
                this._drawSlots(ctx, state, C);
                // 商店/pegSelect 阶段不绘制球（聚焦商店/钉子选择）
                if (state.phase === 'play') {
                    this._drawBall(ctx, state);
                }
                this._drawEffects(ctx);
                this._drawFloats(ctx);
                this._drawTopBar(ctx, state, C);
                if (state.phase === 'play') this._drawPlayUI(ctx, state, C);
                if (state.phase === 'shop') this._drawShop(ctx, state, C);
                if (state.phase === 'pegSelect') this._drawPegSelectOverlay(ctx, state, C);
                if (state.phase === 'connectorSelect') this._drawConnectorSelectOverlay(ctx, state, C);
                if (state.bossIntro > 0) this._drawBossIntro(ctx, state, C);
                if (state.hoverHit && (state.phase === 'shop' || state.phase === 'play' || state.phase === 'connectorSelect')) this._drawTooltip(ctx, state, C);
                this._drawScanlines(ctx);
                this._drawVignette(ctx);
                // 屏幕闪光（高倍率命中时）
                if (this.flash > 0) {
                    ctx.fillStyle = `rgba(255,0,110,${this.flash * 0.35})`;
                    ctx.fillRect(0, 0, this.w, this.h);
                }
                ctx.restore();
            }

            // ===== 顶栏：金币、轮次/小关卡、5个buff槽、分数/回合 =====
            _drawTopBar(ctx, state, C) {
                // 顶栏背景渐变（粉色微光）
                const g = ctx.createLinearGradient(0, 0, 0, C.ui.barH);
                g.addColorStop(0, 'rgba(255,0,110,0.22)');
                g.addColorStop(1, 'rgba(255,0,110,0.05)');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, this.w, C.ui.barH);
                // 底部霓虹分割线
                ctx.shadowBlur = 8;
                ctx.shadowColor = C.colors.frameBorder;
                ctx.fillStyle = C.colors.frameBorder;
                ctx.fillRect(0, C.ui.barH - 1, this.w, 1);
                ctx.shadowBlur = 0;

                // 左：金币（霓虹黄）+ 轮次/小关卡（霓虹青）
                ctx.fillStyle = '#fee440';
                ctx.font = 'bold 13px monospace';
                ctx.textAlign = 'left';
                ctx.fillText(`💰${state.coins}`, 6, 18);
                ctx.fillStyle = '#00f5d4';
                ctx.font = '10px monospace';
                const stageName = C.stageNames[state.stage] || '';
                const stageDef = C.rounds[state.round]?.stages[state.stage];
                const target = stageDef ? stageDef.target : '--';
                ctx.fillText(`R${state.round + 1}/8 ${stageName}/${target}`, 6, 35);

                // Boss 关显示修饰符名（粉色闪烁）
                if (state.bossMod) {
                    const modDef = C.bossMods.find(m => m.id === state.bossMod);
                    if (modDef) {
                        const pulse = 0.7 + 0.3 * Math.sin(performance.now() / 200);
                        ctx.fillStyle = `rgba(255,0,110,${pulse})`;
                        ctx.font = 'bold 9px monospace';
                        ctx.fillText(`⚠ ${modDef.name}`, 6, 46);
                    }
                }

                // 中：5个buff槽（霓虹边框）
                const slotW = 34, slotH = 34, gap = 3;
                const totalW = C.buffSlots * slotW + (C.buffSlots - 1) * gap;
                const startX = (this.w - totalW) / 2;
                for (let i = 0; i < C.buffSlots; i++) {
                    const sx = startX + i * (slotW + gap);
                    const sy = 8;
                    const slot = state.buffSlots[i];
                    // 槽位背景
                    ctx.fillStyle = 'rgba(20,0,30,0.9)';
                    ctx.fillRect(sx, sy, slotW, slotH);
                    const rarity = slot ? this._chipRarity(slot.id) : 'common';
                    const borderCol = slot ? C.colors.rarity[rarity] : '#442233';
                    if (slot) {
                        ctx.shadowBlur = 4;
                        ctx.shadowColor = borderCol;
                    }
                    ctx.strokeStyle = borderCol;
                    ctx.lineWidth = slot ? 2 : 1;
                    ctx.strokeRect(sx, sy, slotW, slotH);
                    ctx.shadowBlur = 0;
                    if (slot) {
                        this._drawChipIcon(ctx, slot.id, sx + slotW / 2, sy + slotH / 2, 12);
                    } else {
                        ctx.fillStyle = '#553344';
                        ctx.font = '9px monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText(`${i + 1}`, sx + slotW / 2, sy + slotH / 2 + 3);
                    }
                }

                // 右：分数/回合（play）或商店提示
                ctx.textAlign = 'right';
                if (state.phase === 'play') {
                    const burning = state.burning > 0;
                    const shakeX = burning ? (Math.random() - 0.5) * 4 : 0;
                    const shakeY = burning ? (Math.random() - 0.5) * 3 : 0;
                    ctx.shadowBlur = burning ? 16 : 8;
                    ctx.shadowColor = burning ? '#ff6b35' : '#fee440';
                    ctx.fillStyle = burning ? '#ff6b35' : '#fee440';
                    ctx.font = burning ? 'bold 16px monospace' : 'bold 14px monospace';
                    ctx.fillText(`${state.score}/${target}`, this.w - 6 + shakeX, 18 + shakeY);
                    ctx.shadowBlur = 0;
                    // 燃烧火焰粒子
                    if (burning) {
                        const fx = this.w - 50, fy = 10;
                        for (let i = 0; i < 8; i++) {
                            const px = fx + (Math.random() - 0.5) * 80;
                            const py = fy + Math.random() * 25;
                            const pr = 3 + Math.random() * 5;
                            const hue = 10 + Math.random() * 40;
                            ctx.fillStyle = `hsla(${hue}, 100%, 55%, 0.7)`;
                            ctx.beginPath();
                            ctx.arc(px, py, pr, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                    const effR = this._effRounds(state);
                    const left = effR - state.turn;
                    ctx.fillStyle = left <= 2 ? '#ff006e' : '#06ffa5';
                    ctx.font = '10px monospace';
                    ctx.fillText(`回合${state.turn}/${effR}`, this.w - 6, 35);
                } else if (state.phase === 'shop') {
                    ctx.fillStyle = '#00f5d4';
                    ctx.font = '10px monospace';
                    ctx.fillText('霓虹商店', this.w - 6, 18);
                    ctx.fillStyle = '#888';
                    ctx.fillText('配置后开始', this.w - 6, 35);
                } else if (state.phase === 'pegSelect') {
                    ctx.fillStyle = '#ff006e';
                    ctx.font = '10px monospace';
                    ctx.fillText('选择钉子...', this.w - 6, 18);
                }
            }

            // 获取筹码稀有度
            _chipRarity(id) {
                const c = Config.chips.find(c => c.id === id);
                return c ? c.rarity : 'common';
            }

            // 有效回合数（与 game._effectiveRounds 同步，glassCannon -1 最少3）
            _effRounds(state) {
                const hasGlassCannon = state.buffSlots.some(s => s && s.id === 'glassCannon');
                return Math.max(3, Config.game.rounds - (hasGlassCannon ? 1 : 0));
            }

            // 辅助：按类型+id 获取商品定义（与 game.js 同步）
            _getItemDef(type, id) {
                const C = Config;
                if (type === 'chip') return C.chips.find(c => c.id === id);
                if (type === 'ball') return C.ballUpgrades.find(b => b.id === id);
                if (type === 'peg') return C.pegUpgrades.find(p => p.id === id);
                if (type === 'connector') return C.pegConnectors.find(c => c.id === id);
                return null;
            }

            // 绘制筹码图标（方形 + 名字首字）
            _drawChipIcon(ctx, id, cx, cy, r) {
                const C = Config;
                const chip = C.chips.find(c => c.id === id);
                if (!chip) return;
                const col = C.colors.rarity[chip.rarity] || '#888';
                ctx.shadowBlur = 6;
                ctx.shadowColor = col;
                ctx.fillStyle = col;
                ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 1;
                ctx.strokeRect(cx - r, cy - r, r * 2, r * 2);
                // 名字首字
                ctx.fillStyle = '#000';
                ctx.font = `bold ${r}px monospace`;
                ctx.textAlign = 'center';
                ctx.fillText(chip.name[0], cx, cy + r * 0.35);
            }

            // 绘制商店商品图标（筹码=方形, 珠子=圆形, 钉子=菱形）
            _drawShopItemIcon(ctx, item, cx, cy, r, col) {
                ctx.shadowBlur = 8;
                ctx.shadowColor = col;
                ctx.fillStyle = col;
                if (item.type === 'chip') {
                    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
                } else if (item.type === 'ball') {
                    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
                } else if (item.type === 'peg') {
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - r);
                    ctx.lineTo(cx + r, cy);
                    ctx.lineTo(cx, cy + r);
                    ctx.lineTo(cx - r, cy);
                    ctx.closePath(); ctx.fill();
                } else if (item.type === 'connector') {
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(cx - r * 0.8, cy - r * 0.6);
                    ctx.lineTo(cx + r * 0.8, cy + r * 0.6);
                    ctx.moveTo(cx + r * 0.8, cy - r * 0.6);
                    ctx.lineTo(cx - r * 0.8, cy + r * 0.6);
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
                const def = this._getItemDef(item.type, item.id);
                if (def) {
                    ctx.fillStyle = '#000';
                    ctx.font = `bold ${r}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.fillText(def.name[0], cx, cy + r * 0.35);
                }
            }

            // play阶段底部UI：力度等级文字+提示
            _drawPlayUI(ctx, state, C) {
                // 力度等级文字（炮塔旁已有分段条，此处显示文字标签避免重复）
                if (state.charging || state.ballReady) {
                    const level = state.power < 0.33 ? 0 : state.power < 0.67 ? 1 : 2;
                    const col = C.charge.levelColors[level];
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = col;
                    ctx.fillStyle = col;
                    ctx.font = 'bold 11px monospace';
                    ctx.textAlign = 'left';
                    ctx.fillText(`力度:${C.charge.levelLabels[level]}`, 8, this.h - 9);
                    ctx.shadowBlur = 0;
                }
                // 提示
                ctx.fillStyle = '#00f5d4';
                ctx.font = '9px monospace';
                ctx.textAlign = 'left';
                let hint;
                if (state.ballReady) hint = '空格蓄力发射';
                else if (state.recycling) hint = '球回收中...';
                else if (state.flying) hint = '球飞行中...';
                else hint = '';
                if (hint) ctx.fillText(hint, 104, this.h - 9);
                // 上次得分
                if (state.lastSlotScore > 0) {
                    ctx.fillStyle = '#fee440';
                    ctx.font = '10px monospace';
                    ctx.textAlign = 'right';
                    ctx.fillText(`上次:+${state.lastSlotScore}`, this.w - 8, this.h - 9);
                }
                // 点金术/金币钉进度（goldFrag > 0 时显示）
                if (state.goldFrag > 0) {
                    const pct = Math.floor(state.goldFrag * 100);
                    ctx.fillStyle = '#fee440';
                    ctx.font = 'bold 10px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(`金${pct}%`, this.w / 2, this.h - 9);
                    // 进度条
                    const gbW = 60, gbX = this.w / 2 - gbW / 2, gbY = this.h - 20;
                    ctx.fillStyle = 'rgba(40,30,0,0.8)';
                    ctx.fillRect(gbX, gbY, gbW, 4);
                    ctx.shadowBlur = 3;
                    ctx.shadowColor = '#fee440';
                    ctx.fillStyle = '#fee440';
                    ctx.fillRect(gbX, gbY, gbW * state.goldFrag, 4);
                    ctx.shadowBlur = 0;
                }
                // ===== 目标进度条（顶部细条）=====
                const stageDef = C.rounds[state.round]?.stages[state.stage];
                if (stageDef) {
                    const pbW = this.w - 16, pbX = 8, pbY = C.ui.barH + 2;
                    ctx.fillStyle = 'rgba(20,0,30,0.8)';
                    ctx.fillRect(pbX, pbY, pbW, 3);
                    const pct = Math.min(1, state.score / stageDef.target);
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = '#06ffa5';
                    ctx.fillStyle = '#06ffa5';
                    ctx.fillRect(pbX, pbY, pbW * pct, 3);
                    ctx.shadowBlur = 0;
                }
                // ===== 连击显示（streak 筹码生效时）=====
                if (state.streakCount > 0 && state.lastSlotIdx >= 0) {
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = '#fee440';
                    ctx.fillStyle = '#fee440';
                    ctx.font = 'bold 11px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(`连击×${state.streakCount + 1}`, this.w / 2, 60);
                    ctx.shadowBlur = 0;
                }
            }

            // ===== Boss 介绍动画（进入 Boss 关时播放 2.5s）=====
            _drawBossIntro(ctx, state, C) {
                const modDef = C.bossMods.find(m => m.id === state.bossMod);
                if (!modDef) return;
                const t = state.bossIntro;
                const total = 2.5;
                const phase = 1 - t / total;  // 0→1
                // 入场：0-0.3s 淡入+放大；停留：0.3-2.0s；退场：2.0-2.5s 淡出
                let alpha = 1, scale = 1;
                if (phase < 0.12) { alpha = phase / 0.12; scale = 0.5 + 0.5 * (phase / 0.12); }
                else if (phase > 0.8) { alpha = 1 - (phase - 0.8) / 0.2; }
                ctx.save();
                ctx.globalAlpha = alpha;
                // 半透明遮罩
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, this.h / 2 - 60, this.w, 120);
                // 主标题
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff006e';
                ctx.fillStyle = '#ff006e';
                ctx.font = `bold ${Math.round(28 * scale)}px monospace`;
                ctx.textAlign = 'center';
                ctx.fillText('BOSS盲注', this.w / 2, this.h / 2 - 15);
                // 修饰符名
                ctx.shadowColor = '#fee440';
                ctx.fillStyle = '#fee440';
                ctx.font = 'bold 16px monospace';
                ctx.fillText(modDef.name, this.w / 2, this.h / 2 + 12);
                // 描述
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#00f5d4';
                ctx.font = '10px monospace';
                ctx.fillText(modDef.desc, this.w / 2, this.h / 2 + 32);
                ctx.restore();
            }

            // ===== 商店界面（三类商品混合）=====
            _drawShop(ctx, state, C) {
                // 半透明遮罩
                ctx.fillStyle = 'rgba(5,0,10,0.92)';
                ctx.fillRect(0, C.ui.barH, this.w, this.h - C.ui.barH);

                // 标题（霓虹粉发光）
                const stageName = C.stageNames[state.stage] || '';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff006e';
                ctx.fillStyle = '#ff006e';
                ctx.font = 'bold 20px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`霓虹商店 · R${state.round + 1}/8 ${stageName}`, this.w / 2, 78);
                ctx.shadowBlur = 0;

                const itemW = 80, itemH = 82, itemGap = 5;
                const catGap = 6;
                const catTitleH = 14;
                const categories = [
                    { type: 'chip', label: '筹码', count: 3, color: '#ff006e', startIdx: 0 },
                    { type: 'peg', label: '钉子', count: 2, color: '#00f5d4', startIdx: 3 },
                    { type: 'connector', label: '连接块', count: 2, color: '#fee440', startIdx: 5 },
                    { type: 'ball', label: '珠子', count: 2, color: '#06ffa5', startIdx: 7 },
                ];

                let startY = 88;
                for (const cat of categories) {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = cat.color;
                    ctx.fillStyle = cat.color;
                    ctx.font = 'bold 11px monospace';
                    ctx.textAlign = 'left';
                    ctx.fillText(`◆ ${cat.label}`, 30, startY);
                    ctx.shadowBlur = 0;

                    const catTotalW = cat.count * itemW + (cat.count - 1) * itemGap;
                    const catX0 = (this.w - catTotalW) / 2;
                    const itemsY = startY + 4;

                    for (let i = 0; i < cat.count; i++) {
                        const idx = cat.startIdx + i;
                        const ix = catX0 + i * (itemW + itemGap);
                        const item = state.shopOfferings[idx];
                        if (!item) {
                            ctx.fillStyle = 'rgba(30,30,40,0.5)';
                            ctx.fillRect(ix, itemsY, itemW, itemH);
                            ctx.strokeStyle = '#333';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(ix, itemsY, itemW, itemH);
                            ctx.fillStyle = '#555';
                            ctx.font = '11px monospace';
                            ctx.textAlign = 'center';
                            ctx.fillText('已售', ix + itemW / 2, itemsY + itemH / 2);
                            continue;
                        }
                        const def = this._getItemDef(item.type, item.id);
                        if (!def) continue;
                        const rarityCol = C.colors.rarity[def.rarity];
                        ctx.fillStyle = 'rgba(10,0,20,0.95)';
                        ctx.fillRect(ix, itemsY, itemW, itemH);
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = rarityCol;
                        ctx.strokeStyle = rarityCol;
                        ctx.lineWidth = 2;
                        ctx.strokeRect(ix, itemsY, itemW, itemH);
                        ctx.shadowBlur = 0;
                        this._drawShopItemIcon(ctx, item, ix + itemW / 2, itemsY + 16, 10, rarityCol);
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 10px monospace';
                        ctx.fillText(def.name, ix + itemW / 2, itemsY + 36);
                        const typeLabel = { chip: '筹码', ball: '珠子', peg: '钉子', connector: '连接' }[item.type];
                        ctx.fillStyle = rarityCol;
                        ctx.font = '8px monospace';
                        ctx.fillText(typeLabel, ix + itemW / 2, itemsY + 46);
                        this._drawWrappedText(ctx, def.desc, ix + itemW / 2, itemsY + 55, itemW - 6, 8);
                        ctx.fillStyle = state.coins >= item.price ? '#06ffa5' : '#ff006e';
                        ctx.font = 'bold 11px monospace';
                        ctx.fillText(`${item.price}金`, ix + itemW / 2, itemsY + itemH - 3);
                    }
                    startY += itemH + catGap + catTitleH;
                }

                // 库存区（仅筹码）
                const invY = startY + 4;
                ctx.fillStyle = '#00f5d4';
                ctx.font = 'bold 12px monospace';
                ctx.textAlign = 'left';
                ctx.fillText('📦 库存 (点击选中→点击顶部槽位放置)', 20, invY);
                const invItemW = 100, invItemH = 40, invGap = 8;
                for (let i = 0; i < state.inventory.length; i++) {
                    const ix = 20 + i * (invItemW + invGap);
                    const iy = invY + 6;
                    const item = state.inventory[i];
                    const selected = state.selectedInv === i;
                    const rarityCol = C.colors.rarity[this._chipRarity(item.id)];
                    ctx.fillStyle = selected ? 'rgba(254,228,64,0.25)' : 'rgba(10,0,20,0.9)';
                    ctx.fillRect(ix, iy, invItemW, invItemH);
                    ctx.shadowBlur = selected ? 8 : 4;
                    ctx.shadowColor = selected ? '#fee440' : rarityCol;
                    ctx.strokeStyle = selected ? '#fee440' : rarityCol;
                    ctx.lineWidth = selected ? 3 : 2;
                    ctx.strokeRect(ix, iy, invItemW, invItemH);
                    ctx.shadowBlur = 0;
                    this._drawChipIcon(ctx, item.id, ix + 14, iy + invItemH / 2, 10);
                    const chip = C.chips.find(c => c.id === item.id);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 10px monospace';
                    ctx.textAlign = 'left';
                    ctx.fillText(chip.name, ix + 28, iy + 17);
                    ctx.fillStyle = '#06ffa5';
                    ctx.font = '9px monospace';
                    ctx.fillText(`卖${item.sellPrice}金`, ix + 28, iy + 31);
                    // 卖出按钮
                    ctx.fillStyle = 'rgba(255,0,110,0.6)';
                    ctx.fillRect(ix + invItemW - 20, iy + 3, 16, 12);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 8px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('卖', ix + invItemW - 12, iy + 12);
                    ctx.textAlign = 'left';
                }
                if (state.inventory.length === 0) {
                    ctx.fillStyle = '#666';
                    ctx.font = '11px monospace';
                    ctx.fillText('（空）', 20, invY + 26);
                }

                // 底部按钮：刷新、开始
                const btnY = invY + 50;
                // 刷新按钮（霓虹青）
                const refreshAfford = state.coins >= C.shop.refreshCost;
                ctx.fillStyle = refreshAfford ? 'rgba(0,245,212,0.85)' : 'rgba(60,60,80,0.6)';
                ctx.fillRect(40, btnY, 140, 40);
                ctx.shadowBlur = refreshAfford ? 8 : 0;
                ctx.shadowColor = '#00f5d4';
                ctx.strokeStyle = refreshAfford ? '#00f5d4' : '#555';
                ctx.lineWidth = 2;
                ctx.strokeRect(40, btnY, 140, 40);
                ctx.shadowBlur = 0;
                ctx.fillStyle = refreshAfford ? '#000' : '#888';
                ctx.font = 'bold 14px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`🔄 刷新 (${C.shop.refreshCost}金)`, 110, btnY + 25);

                // 开始按钮（霓虹绿）
                ctx.fillStyle = 'rgba(6,255,165,0.9)';
                ctx.fillRect(this.w - 180, btnY, 140, 40);
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#06ffa5';
                ctx.strokeStyle = '#06ffa5';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.w - 180, btnY, 140, 40);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#000';
                ctx.font = 'bold 16px monospace';
                ctx.fillText(`▶ 开始游戏`, this.w - 110, btnY + 26);

                // 球强化状态（显示已购珠子叠加数）+ 已标记钉子数：放在按钮中间区域
                const bu = state.ballUpgrades;
                const buKeys = Object.keys(bu).filter(k => k.endsWith('Count'));
                const markedCount = state.pegs.filter(p => p.upgraded).length;
                if (buKeys.length > 0 || markedCount > 0) {
                    const infoX = 190, infoW = 100;
                    const infoY = btnY + 4;
                    ctx.fillStyle = 'rgba(10,0,20,0.85)';
                    ctx.fillRect(infoX, infoY, infoW, 32);
                    ctx.strokeStyle = '#444';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(infoX, infoY, infoW, 32);
                    ctx.textAlign = 'left';
                    ctx.font = '9px monospace';
                    let lineY = infoY + 12;
                    if (buKeys.length > 0) {
                        ctx.fillStyle = '#06ffa5';
                        ctx.fillText('球强化:', infoX + 4, lineY);
                        let bx = infoX + 40;
                        ctx.font = '8px monospace';
                        for (const k of buKeys) {
                            const id = k.replace('Count', '');
                            const def = C.ballUpgrades.find(b => b.id === id);
                            if (!def) continue;
                            ctx.fillStyle = C.colors.rarity[def.rarity];
                            ctx.fillText(`${def.name[0]}×${bu[k]}`, bx, lineY);
                            bx += 28;
                        }
                        lineY += 14;
                    }
                    if (markedCount > 0) {
                        ctx.fillStyle = '#ff006e';
                        ctx.font = '9px monospace';
                        ctx.fillText(`钉子标记:${markedCount}`, infoX + 4, lineY);
                    }
                }
            }

            // ===== 悬停提示窗口 =====
            _drawTooltip(ctx, state, C) {
                const hit = state.hoverHit;
                if (!hit) return;
                let def = null, typeLabel = '', priceText = '', rarity = 'common';
                if (hit.type === 'shopItem') {
                    const item = state.shopOfferings[hit.index];
                    if (!item) return;
                    def = this._getItemDef(item.type, item.id);
                    if (!def) return;
                    typeLabel = { chip: '筹码', ball: '珠子', peg: '钉子', connector: '连接块' }[item.type];
                    priceText = `${item.price}金`;
                    rarity = def.rarity;
                } else if (hit.type === 'invItem') {
                    const item = state.inventory[hit.index];
                    if (!item) return;
                    def = this._getItemDef('chip', item.id);
                    typeLabel = '筹码·库存';
                    priceText = `卖出${item.sellPrice}金`;
                    rarity = this._chipRarity(item.id);
                } else if (hit.type === 'buffSlot') {
                    const item = state.buffSlots[hit.index];
                    if (!item) return;
                    def = this._getItemDef('chip', item.id);
                    typeLabel = '筹码·已装备';
                    priceText = `卖出${item.sellPrice}金`;
                    rarity = this._chipRarity(item.id);
                } else {
                    return;
                }
                if (!def) return;

                const rarityCol = C.colors.rarity[rarity] || '#888';
                const tw = 180, th = 80;
                let ax = 0, ay = 0;
                if (hit.type === 'shopItem') {
                    const itemW = 80, itemGap = 5;
                    const catGap = 6, catTitleH = 14, catItemH = 82;
                    const cats = [
                        { count: 3, startIdx: 0 },
                        { count: 2, startIdx: 3 },
                        { count: 2, startIdx: 5 },
                        { count: 2, startIdx: 7 },
                    ];
                    const localIdx = hit.index;
                    for (const cat of cats) {
                        const catTotalW = cat.count * itemW + (cat.count - 1) * itemGap;
                        const catX0 = (this.w - catTotalW) / 2;
                        const itemsY = 88 + 4;
                        if (localIdx >= cat.startIdx && localIdx < cat.startIdx + cat.count) {
                            const i = localIdx - cat.startIdx;
                            ax = catX0 + i * (itemW + itemGap) + itemW / 2;
                            const catIndex = cats.indexOf(cat);
                            ay = itemsY + catIndex * (catItemH + catGap + catTitleH) + catItemH;
                            break;
                        }
                    }
                } else if (hit.type === 'invItem') {
                    const invItemW = 100, invGap = 8;
                    ax = 20 + hit.index * (invItemW + invGap) + invItemW / 2;
                    const invY = 88 + 4 * (82 + 6 + 14) + 4;  // 500
                    ay = invY + 6 + 40;  // 库存物品底部
                } else if (hit.type === 'buffSlot') {
                    const slotW = 34, gap = 3;
                    const totalW = C.buffSlots * slotW + (C.buffSlots - 1) * gap;
                    const startX = (this.w - totalW) / 2;
                    ax = startX + hit.index * (slotW + gap) + slotW / 2;
                    ay = 8 + 34;
                }
                // 窗口位置：锚点下方，避免超出边界
                let tx = ax - tw / 2;
                let ty = ay + 6;
                tx = Math.max(4, Math.min(this.w - tw - 4, tx));
                if (ty + th > this.h - 4) ty = ay - th - 6;

                // 背景
                ctx.fillStyle = 'rgba(5,0,15,0.96)';
                ctx.fillRect(tx, ty, tw, th);
                // 稀有度边框 + 发光
                ctx.shadowBlur = 12;
                ctx.shadowColor = rarityCol;
                ctx.strokeStyle = rarityCol;
                ctx.lineWidth = 2;
                ctx.strokeRect(tx, ty, tw, th);
                ctx.shadowBlur = 0;

                // 名称
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 13px monospace';
                ctx.textAlign = 'left';
                ctx.fillText(def.name, tx + 8, ty + 16);
                // 类型 + 稀有度
                ctx.fillStyle = rarityCol;
                ctx.font = '9px monospace';
                ctx.fillText(`${typeLabel} · ${rarity}`, tx + 8, ty + 30);
                // 描述（自动换行）
                ctx.fillStyle = '#ccc';
                ctx.font = '10px monospace';
                ctx.textAlign = 'center';
                this._drawWrappedText(ctx, def.desc, tx + tw / 2, ty + 44, tw - 12, 10);
                // 点金术额外显示累积进度
                if (def.id === 'goldTouch' && state.goldFrag > 0) {
                    ctx.fillStyle = '#fee440';
                    ctx.font = 'bold 10px monospace';
                    ctx.textAlign = 'left';
                    ctx.fillText(`累积: ${Math.floor(state.goldFrag * 100)}%`, tx + 8, ty + th - 6);
                }
                // 价格
                ctx.fillStyle = '#06ffa5';
                ctx.font = 'bold 11px monospace';
                ctx.textAlign = 'right';
                ctx.fillText(priceText, tx + tw - 8, ty + th - 6);
                ctx.textAlign = 'left';
            }

            // ===== pegSelect 模式 UI =====
            _drawPegSelectOverlay(ctx, state, C) {
                // 半透明遮罩
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(0, 0, this.w, this.h);
                // 顶部提示
                const def = C.pegUpgrades.find(u => u.id === state.pendingPegUpgrade);
                if (!def) return;
                ctx.shadowBlur = 15;
                ctx.shadowColor = def.color;
                ctx.fillStyle = def.color;
                ctx.font = 'bold 18px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`选择一个钉子放置「${def.name}」`, this.w / 2, 100);
                ctx.font = '11px monospace';
                ctx.fillStyle = '#aaa';
                ctx.fillText(`${def.desc}（右键取消）`, this.w / 2, 120);
                ctx.shadowBlur = 0;
                // 所有未标记钉子绘制高亮呼吸圈
                const t = performance.now() / 1000;
                const pulse = 0.4 + 0.3 * Math.sin(t * 4);
                for (const peg of state.pegs) {
                    if (peg.upgraded) continue;
                    const baseR = peg.special ? 6 : 5;
                    ctx.strokeStyle = hexA(def.color, pulse * 0.6);
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(peg.x, peg.y, baseR + 6 + pulse * 2, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // ===== 连接块渲染 =====
            _drawConnectors(ctx, state) {
                const C = Config;
                const t = performance.now() / 1000;
                for (const conn of state.connectors) {
                    if (conn.wall.broken) continue;
                    const def = conn.def;
                    const hits = conn.wall.hits;
                    const maxHits = def.maxHits;
                    const alpha = hits < maxHits ? 1 : 0.3;
                    const pulse = 0.8 + 0.2 * Math.sin(t * 3);

                    ctx.strokeStyle = hexA(def.color, alpha * pulse);
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = def.color;
                    ctx.beginPath();
                    ctx.moveTo(conn.pegA.x, conn.pegA.y);
                    ctx.lineTo(conn.pegB.x, conn.pegB.y);
                    ctx.stroke();
                    ctx.shadowBlur = 0;

                    if (maxHits > 0) {
                        const cx = (conn.pegA.x + conn.pegB.x) / 2;
                        const cy = (conn.pegA.y + conn.pegB.y) / 2;
                        ctx.fillStyle = 'rgba(0,0,0,0.7)';
                        ctx.beginPath();
                        ctx.arc(cx, cy, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = def.color;
                        ctx.font = 'bold 8px monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText(`${maxHits - hits}`, cx, cy + 3);
                    }
                }
            }

            // ===== connectorSelect 模式 UI =====
            _drawConnectorSelectOverlay(ctx, state, C) {
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(0, 0, this.w, this.h);
                const def = C.pegConnectors.find(c => c.id === state.pendingConnector);
                if (!def) return;

                ctx.shadowBlur = 15;
                ctx.shadowColor = def.color;
                ctx.fillStyle = def.color;
                ctx.font = 'bold 18px monospace';
                ctx.textAlign = 'center';
                if (!state.selectedPeg) {
                    ctx.fillText(`选择第一个钉子`, this.w / 2, 100);
                } else {
                    ctx.fillText(`选择相邻钉子创建「${def.name}」`, this.w / 2, 100);
                }
                ctx.font = '11px monospace';
                ctx.fillStyle = '#aaa';
                ctx.fillText(`${def.desc}（右键取消 / 再次点击取消选中）`, this.w / 2, 120);
                ctx.shadowBlur = 0;

                const t = performance.now() / 1000;
                const pulse = 0.4 + 0.3 * Math.sin(t * 4);

                if (state.selectedPeg) {
                    const baseR = state.selectedPeg.special ? 6 : 5;
                    ctx.strokeStyle = hexA(def.color, 1);
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(state.selectedPeg.x, state.selectedPeg.y, baseR + 8, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = def.color;
                    ctx.beginPath();
                    ctx.arc(state.selectedPeg.x, state.selectedPeg.y, baseR + 12 + pulse * 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                for (const peg of state.pegs) {
                    if (peg === state.selectedPeg) continue;
                    const baseR = peg.special ? 6 : 5;
                    ctx.strokeStyle = hexA(def.color, pulse * 0.4);
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(peg.x, peg.y, baseR + 4 + pulse * 2, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // 文本换行绘制（简单按字符截断）
            _drawWrappedText(ctx, text, cx, y, maxW, lineH) {
                const chars = text.split('');
                let line = '';
                let lineIdx = 0;
                for (const ch of chars) {
                    const test = line + ch;
                    if (ctx.measureText(test).width > maxW && line) {
                        ctx.fillText(line, cx, y + lineIdx * lineH);
                        line = ch;
                        lineIdx++;
                        if (lineIdx > 1) break;  // 最多2行
                    } else {
                        line = test;
                    }
                }
                if (line) ctx.fillText(line, cx, y + lineIdx * lineH);
            }

            // ===== 点击检测 =====
            hitTest(x, y, state) {
                const C = Config;
                // 顶部buff槽（shop 和 play 阶段都可检测）
                const slotW = 34, slotH = 34, gap = 3;
                const totalW = C.buffSlots * slotW + (C.buffSlots - 1) * gap;
                const startX = (this.w - totalW) / 2;
                for (let i = 0; i < C.buffSlots; i++) {
                    const sx = startX + i * (slotW + gap);
                    if (x >= sx && x <= sx + slotW && y >= 8 && y <= 8 + slotH) {
                        return { type: 'buffSlot', index: i };
                    }
                }
                if (state.phase !== 'shop') return null;
                const itemW = 80, itemH = 82, itemGap = 5;
                const catGap = 6, catTitleH = 14;
                const categories = [
                    { count: 3, startIdx: 0 },
                    { count: 2, startIdx: 3 },
                    { count: 2, startIdx: 5 },
                    { count: 2, startIdx: 7 },
                ];
                let startY = 88 + 4;  // 对应绘制中 itemsY = startY + 4
                for (const cat of categories) {
                    const catTotalW = cat.count * itemW + (cat.count - 1) * itemGap;
                    const catX0 = (this.w - catTotalW) / 2;
                    for (let i = 0; i < cat.count; i++) {
                        const idx = cat.startIdx + i;
                        const ix = catX0 + i * (itemW + itemGap);
                        if (x >= ix && x <= ix + itemW && y >= startY && y <= startY + itemH) {
                            if (state.shopOfferings[idx]) return { type: 'shopItem', index: idx };
                        }
                    }
                    startY += itemH + catGap + catTitleH;
                }
                const invY = startY;  // 绘制中 invY = (88 + 4*102) + 4 = 500; hitTest循环结束startY = 92+4*102 = 500
                const invItemW = 100, invItemH = 40, invGap = 8;
                for (let i = 0; i < state.inventory.length; i++) {
                    const ix = 20 + i * (invItemW + invGap);
                    const iy = invY + 6;  // 对应绘制中 iy = invY + 6
                    if (x >= ix && x <= ix + invItemW && y >= iy && y <= iy + invItemH) {
                        if (x >= ix + invItemW - 20 && x <= ix + invItemW - 4 && y >= iy + 3 && y <= iy + 15) {
                            return { type: 'sellInv', index: i };
                        }
                        return { type: 'invItem', index: i };
                    }
                }
                const btnY = invY + 50;
                if (x >= 40 && x <= 180 && y >= btnY && y <= btnY + 40) return { type: 'refresh' };
                if (x >= this.w - 180 && x <= this.w - 40 && y >= btnY && y <= btnY + 40) return { type: 'startBtn' };
                return null;
            }

            // ===== 背景：渐变 + 透视网格 + 顶部光带 + 星空粒子 =====
            _drawBG(ctx, C) {
                // 深黑→暗红垂直渐变
                const g = ctx.createLinearGradient(0, 0, 0, this.h);
                g.addColorStop(0, C.colors.bg.top);
                g.addColorStop(0.5, '#0d0018');
                g.addColorStop(1, C.colors.bg.bot);
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, this.w, this.h);

                // 透视网格（向消失点收敛）
                const horizonY = this.h * 0.35;
                const vpX = this.w / 2;
                ctx.strokeStyle = 'rgba(255,0,110,0.10)';
                ctx.lineWidth = 1;
                // 水平线（透视收缩）
                for (let i = 0; i < 14; i++) {
                    const t = i / 13;
                    const y = horizonY + (this.h - horizonY) * t * t;
                    ctx.globalAlpha = 0.25 - t * 0.18;
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.w, y); ctx.stroke();
                }
                // 垂直线（向消失点收敛）
                for (let i = -10; i <= 10; i++) {
                    ctx.globalAlpha = 0.10;
                    ctx.beginPath();
                    ctx.moveTo(vpX + i * (this.w / 6), horizonY);
                    ctx.lineTo(vpX + i * 50, this.h);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;

                // 星空粒子（伪随机静态背景点缀）
                const seed = 42;
                const t = performance.now() / 1000;
                ctx.fillStyle = '#fff';
                for (let i = 0; i < 60; i++) {
                    const sx = ((i * 137 + seed) % this.w);
                    const sy = ((i * 251 + seed * 7) % this.h);
                    const twinkle = 0.3 + 0.5 * Math.sin(t * 2 + i * 1.7);
                    const size = 0.5 + (i % 3) * 0.5;
                    ctx.globalAlpha = twinkle * 0.6;
                    ctx.beginPath(); ctx.arc(sx, sy, size, 0, Math.PI * 2); ctx.fill();
                }
                ctx.globalAlpha = 1;

                // 顶部霓虹光带
                const topG = ctx.createLinearGradient(0, 0, 0, 50);
                topG.addColorStop(0, 'rgba(255,0,110,0.22)');
                topG.addColorStop(0.5, 'rgba(0,245,212,0.08)');
                topG.addColorStop(1, 'rgba(255,0,110,0)');
                ctx.fillStyle = topG;
                ctx.fillRect(0, 0, this.w, 50);
            }

            // ===== 场地：底部UI栏 + 外墙（4面完整框，霓虹粉发光 + 四角装饰）=====
            _drawField(ctx, state, C) {
                // 底部UI栏背景
                ctx.fillStyle = 'rgba(10,0,15,0.95)';
                ctx.fillRect(0, this.h - C.ui.bottomBarH, this.w, C.ui.bottomBarH);
                // 外墙（4面完整框，双层发光）
                ctx.strokeStyle = C.colors.wall;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = C.colors.wallGlow;
                ctx.strokeRect(C.frame.l, C.frame.t, C.frame.r - C.frame.l, C.frame.b - C.frame.t);
                // 外层柔和光晕
                ctx.shadowBlur = 20;
                ctx.shadowColor = 'rgba(255,0,110,0.08)';
                ctx.lineWidth = 1;
                ctx.strokeRect(C.frame.l - 2, C.frame.t - 2, C.frame.r - C.frame.l + 4, C.frame.b - C.frame.t + 4);
                ctx.shadowBlur = 0;

                // 四角装饰（霓虹青色 L 形角标）
                const t = performance.now() / 1000;
                const corPulse = 0.5 + 0.3 * Math.sin(t * 2);
                ctx.strokeStyle = hexA('#00f5d4', 0.4 + corPulse * 0.3);
                ctx.lineWidth = 2;
                const corners = [
                    [C.frame.l, C.frame.t, 1, 1],    // 左上
                    [C.frame.r, C.frame.t, -1, 1],    // 右上
                    [C.frame.l, C.frame.b, 1, -1],    // 左下
                    [C.frame.r, C.frame.b, -1, -1],   // 右下
                ];
                const len = 10;
                for (const [cx, cy, dx, dy] of corners) {
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - dy * len);
                    ctx.lineTo(cx, cy);
                    ctx.lineTo(cx + dx * len, cy);
                    ctx.stroke();
                }
            }

            // ===== 炮塔：底座（圆形）+ 旋转炮管 + 蓄力分段力度条 + 脉冲光晕 =====
            _drawTurret(ctx, state, C) {
                const { x, y, barrelLen, radius } = C.turret;
                const rad = state.turretAngle * Math.PI / 180;
                const t = performance.now() / 1000;
                const pulse = 0.7 + 0.3 * Math.sin(t * 4);

                // 炮管（旋转矩形 + 发光锥形）
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rad);
                // 炮管光晕
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#00f5d4';
                ctx.fillStyle = hexA('#00f5d4', 0.6 * pulse);
                ctx.fillRect(-6, 0, 12, barrelLen);
                ctx.shadowBlur = 0;
                // 炮管主体
                ctx.fillStyle = '#005a4d';
                ctx.fillRect(-4, 0, 8, barrelLen);
                // 炮管尖端高光
                ctx.fillStyle = hexA('#00f5d4', pulse);
                ctx.fillRect(-3, barrelLen - 8, 6, 8);
                ctx.restore();

                // 准星引导线
                if (state.ballReady && !state.flying && !state.recycling) {
                    const tipX = x - barrelLen * Math.sin(rad);
                    const tipY = y + barrelLen * Math.cos(rad);
                    const aimLen = 40;
                    ctx.setLineDash([4, 6]);
                    ctx.strokeStyle = 'rgba(0,245,212,0.5)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(tipX, tipY);
                    ctx.lineTo(tipX - aimLen * Math.sin(rad), tipY + aimLen * Math.cos(rad));
                    ctx.stroke();
                    ctx.setLineDash([]);
                    // 准星小点
                    ctx.fillStyle = hexA('#00f5d4', 0.7 * pulse);
                    ctx.beginPath();
                    ctx.arc(tipX - aimLen * Math.sin(rad), tipY + aimLen * Math.cos(rad), 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 炮塔底座（圆形 + 脉冲光环）
                ctx.beginPath();
                ctx.arc(x, y, radius + 4, 0, Math.PI * 2);
                ctx.fillStyle = hexA('#ff006e', 0.1 * pulse);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = '#1a0510';
                ctx.fill();
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ff006e';
                ctx.strokeStyle = '#ff006e';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.shadowBlur = 0;
                // 中心点
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#ff006e';
                ctx.fill();
                // 中心高亮
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();

                // 炮塔角度数值
                if (state.phase === 'play') {
                    ctx.fillStyle = 'rgba(0,245,212,0.6)';
                    ctx.font = '9px monospace';
                    ctx.textAlign = 'left';
                    ctx.fillText(`塔角:${state.turretAngle.toFixed(0)}°`, 8, C.frame.b - 4);
                }
                // 蓄力分段力度条
                if (state.charging) {
                    const barX = x + 28, barY = y - 12;
                    const segW = 14, segH = 10, segGap = 3;
                    for (let i = 0; i < C.charge.levels; i++) {
                        const active = state.power >= (i + 0.5) / C.charge.levels;
                        ctx.fillStyle = active ? C.charge.levelColors[i] : 'rgba(40,40,50,0.6)';
                        ctx.shadowBlur = active ? 8 : 0;
                        ctx.shadowColor = C.charge.levelColors[i];
                        ctx.fillRect(barX + i * (segW + segGap), barY, segW, segH);
                    }
                    ctx.shadowBlur = 0;
                }
            }

            // ===== 钉子（霓虹发光 + 呼吸光晕 + 特效钉子彩色外环）=====
            _drawPegs(ctx, state) {
                const C = Config;
                const t = performance.now() / 1000;
                for (const p of state.pegs) {
                    const col = p.color;
                    const baseR = p.special ? 6 : 5;
                    // 透明钉（Boss glassPegs）：半透明虚影
                    if (p.glass) {
                        ctx.globalAlpha = 0.2;
                        ctx.strokeStyle = '#888888';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([2, 2]);
                        ctx.beginPath(); ctx.arc(p.x, p.y, baseR, 0, Math.PI * 2); ctx.stroke();
                        ctx.setLineDash([]);
                        ctx.globalAlpha = 1;
                        continue;
                    }
                    // ===== 特效钉子外环（呼吸光晕）=====
                    if (p.upgraded) {
                        const def = C.pegUpgrades.find(u => u.id === p.upgraded);
                        if (def) {
                            const uPulse = 0.5 + 0.3 * Math.sin(t * 4 + p.x);
                            ctx.shadowBlur = 14;
                            ctx.shadowColor = def.color;
                            ctx.strokeStyle = def.color;
                            ctx.lineWidth = 2;
                            ctx.beginPath(); ctx.arc(p.x, p.y, baseR + 5, 0, Math.PI * 2); ctx.stroke();
                            ctx.fillStyle = hexA(def.color, 0.15 + 0.1 * uPulse);
                            ctx.beginPath(); ctx.arc(p.x, p.y, baseR + 8, 0, Math.PI * 2); ctx.fill();
                            ctx.shadowBlur = 0;
                        }
                    }
                    // ===== 主体（带霓虹发光 bloom + 呼吸光晕）=====
                    const pegPulse = 0.7 + 0.3 * Math.sin(t * 3 + p.x * 0.5 + p.y * 0.3);
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = col;
                    ctx.fillStyle = col;
                    ctx.beginPath(); ctx.arc(p.x, p.y, baseR, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0;
                    // 白色高光
                    ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    ctx.beginPath(); ctx.arc(p.x - baseR * 0.3, p.y - baseR * 0.3, baseR * 0.35, 0, Math.PI * 2); ctx.fill();
                    // 击中闪光（更大范围）
                    if (p.flash > 0) {
                        ctx.fillStyle = `rgba(255,255,255,${p.flash * 0.8})`;
                        ctx.beginPath(); ctx.arc(p.x, p.y, baseR + 5, 0, Math.PI * 2); ctx.fill();
                    }
                    // 特殊钉子（顶排橙色）：呼吸星芒 + 旋转光晕
                    if (p.special) {
                        const spPulse = 0.4 + Math.sin(t * 3) * 0.25;
                        ctx.strokeStyle = hexA(C.colors.neon.orange, spPulse);
                        ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(p.x, p.y, baseR + 4, 0, Math.PI * 2); ctx.stroke();
                        // 星芒十字
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(p.x - baseR - 3, p.y); ctx.lineTo(p.x + baseR + 3, p.y);
                        ctx.moveTo(p.x, p.y - baseR - 3); ctx.lineTo(p.x, p.y + baseR + 3);
                        ctx.stroke();
                    }
                    // 普通钉子微呼吸光晕
                    if (!p.special && !p.upgraded) {
                        ctx.strokeStyle = hexA(col, 0.15 * pegPulse);
                        ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.arc(p.x, p.y, baseR + 3, 0, Math.PI * 2); ctx.stroke();
                    }
                }
            }

            // ===== 得分槽（按分数霓虹色 + 渐变填充 + 边缘呼吸光晕）=====
            _drawSlots(ctx, state, C) {
                const scores = state.activeSlotScores || C.slotScores;
                const t = performance.now() / 1000;
                for (let i = 0; i < C.slot.count; i++) {
                    const sx = C.slotL + i * C.slotW;
                    const pts = scores[i];
                    // 颜色映射：300=粉, 200=橙, 100=绿（三级阶梯）
                    let col;
                    if (pts >= 300) col = '#ff006e';
                    else if (pts >= 200) col = '#ff6b35';
                    else col = '#06ffa5';
                    // 渐变背景
                    const slotGrad = ctx.createLinearGradient(sx, C.slotTop, sx, C.slotTop + C.slot.h);
                    slotGrad.addColorStop(0, 'rgba(0,0,0,0.65)');
                    slotGrad.addColorStop(0.3, hexA(col, 0.08));
                    slotGrad.addColorStop(1, 'rgba(0,0,0,0.45)');
                    ctx.fillStyle = slotGrad;
                    ctx.fillRect(sx, C.slotTop, C.slotW - 1, C.slot.h);
                    // 边框发光
                    const isEdge = (i === 0 || i === 9);
                    const pulse = isEdge ? 0.6 + 0.4 * Math.sin(t * 3 + i) : 1;
                    ctx.shadowBlur = isEdge ? 8 : 4;
