                    ctx.shadowColor = col;
                    ctx.strokeStyle = hexA(col, 0.6 + 0.4 * pulse);
                    ctx.lineWidth = isEdge ? 2 : 1.5;
                    ctx.strokeRect(sx, C.slotTop, C.slotW - 1, C.slot.h);
                    ctx.shadowBlur = 0;
                    // 分数文字
                    ctx.fillStyle = col;
                    ctx.font = 'bold 11px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(pts, sx + C.slotW / 2, C.slotTop + C.slot.h - 8);
                    // 槽内分割短线装饰
                    ctx.strokeStyle = hexA(col, 0.15);
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(sx + 2, C.slotTop + C.slot.h / 2);
                    ctx.lineTo(sx + C.slotW - 3, C.slotTop + C.slot.h / 2);
                    ctx.stroke();
                }
            }

            // ===== 球：拖尾 + bloom 光晕 + 主体 + 高光 + 外发光环（主球+分身球）=====
            _drawBall(ctx, state) {
                const C = Config;
                const t = performance.now() / 1000;
                for (const b of state.balls) {
                    if (!b || !b.alive) continue;
                    const isMain = !b.data || b.data.isMain;
                    const ballColor = isMain ? C.colors.ball : C.colors.neon.pink;
                    const trailColor = isMain ? C.colors.ballTrail : 'rgba(255,0,110,0.6)';
                    const glowColor = isMain ? C.colors.neon.cyan : C.colors.neon.pink;
                    const r = b.r;
                    // 拖尾（渐变透明度+宽度+发光）
                    if (b.trail && b.trail.length > 1) {
                        ctx.strokeStyle = trailColor;
                        ctx.lineCap = 'round';
                        for (let i = 1; i < b.trail.length; i++) {
                            const a = i / b.trail.length;
                            ctx.globalAlpha = a * 0.7;
                            ctx.lineWidth = r * 0.8 * a;
                            ctx.shadowBlur = 4;
                            ctx.shadowColor = trailColor;
                            ctx.beginPath();
                            ctx.moveTo(b.trail[i - 1].x, b.trail[i - 1].y);
                            ctx.lineTo(b.trail[i].x, b.trail[i].y);
                            ctx.stroke();
                        }
                        ctx.shadowBlur = 0;
                        ctx.globalAlpha = 1;
                    }
                    // 外发光环（呼吸脉冲）
                    const ringPulse = 0.6 + 0.4 * Math.sin(t * 5 + b.x * 0.1);
                    ctx.fillStyle = hexA(glowColor, 0.08 * ringPulse);
                    ctx.beginPath(); ctx.arc(b.x, b.y, r + 4, 0, Math.PI * 2); ctx.fill();
                    // 光晕（bloom）
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = glowColor;
                    ctx.fillStyle = ballColor;
                    ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0;
                    // 高光
                    ctx.fillStyle = 'rgba(255,255,255,0.95)';
                    ctx.beginPath(); ctx.arc(b.x - r * 0.3, b.y - r * 0.3, r * 0.4, 0, Math.PI * 2); ctx.fill();
                    // 微小高亮点
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.beginPath(); ctx.arc(b.x + r * 0.25, b.y - r * 0.2, r * 0.15, 0, Math.PI * 2); ctx.fill();
                }
            }

            // 绘制粒子特效
            _drawEffects(ctx) {
                for (const e of this.effects) {
                    const a = e.life / e.maxLife;
                    ctx.fillStyle = hexA(e.color, a);
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.size * a, 0, Math.PI * 2); ctx.fill();
                }
            }

            // 绘制浮动文字
            _drawFloats(ctx) {
                for (const f of this.floats) {
                    const a = f.life / f.maxLife;
                    ctx.globalAlpha = a;
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = f.color;
                    ctx.fillStyle = f.color;
                    ctx.font = `bold ${f.size}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.fillText(f.text, f.x, f.y);
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1;
                }
            }

            // 绘制扫描线（CRT效果）
            _drawScanlines(ctx) {
                const C = Config;
                ctx.fillStyle = C.colors.scanline;
                const sy = Math.floor(this.scanPhase * 30) % 4;
                for (let y = sy; y < this.h; y += 4) {
                    ctx.fillRect(0, y, this.w, 1);
                }
            }

            // 绘制暗角（边缘渐暗）
            _drawVignette(ctx) {
                for (let i = 0; i < 6; i++) {
                    ctx.strokeStyle = `rgba(0,0,0,${0.05 - i * 0.006})`;
                    ctx.lineWidth = 1;
                    ctx.strokeRect(i, i, this.w - i * 2, this.h - i * 2);
                }
            }

            // 绘制游戏结束界面（霓虹风格）
            drawGameOver(ctx, state) {
                const C = Config;
                ctx.fillStyle = 'rgba(0,0,0,0.82)';
                ctx.fillRect(0, 0, this.w, this.h);
                ctx.textAlign = 'center';
                if (state.allCleared) {
                    // 全部通关（霓虹黄发光）
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#fee440';
                    ctx.fillStyle = '#fee440';
                    ctx.font = 'bold 30px monospace';
                    ctx.fillText('🏆 全部通关！', this.w / 2, this.h / 2 - 50);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.font = '16px monospace';
                    ctx.fillText(`完成全部 ${C.rounds.length} 轮 × 3 关`, this.w / 2, this.h / 2 - 18);
                    ctx.fillStyle = '#06ffa5';
                    ctx.fillText(`剩余金币: ${state.coins}`, this.w / 2, this.h / 2 + 8);
                } else {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = state.won ? '#fee440' : '#ff006e';
                    ctx.fillStyle = state.won ? '#fee440' : '#ff006e';
                    ctx.font = 'bold 30px monospace';
                    ctx.fillText(state.won ? `R${state.round + 1} 通关！` : '游戏结束', this.w / 2, this.h / 2 - 40);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.font = '16px monospace';
                    const stage = C.rounds[state.round]?.stages[state.stage];
                    const target = stage ? stage.target : 0;
                    ctx.fillText(`本小关得分: ${state.score} / ${target}`, this.w / 2, this.h / 2 - 8);
                    if (state.won) {
                        ctx.fillStyle = '#06ffa5';
                        ctx.fillText(`金币总计: ${state.coins}`, this.w / 2, this.h / 2 + 18);
                    } else {
                        ctx.fillStyle = '#ff006e';
                        ctx.fillText(`未达到本小关目标 ${target} 分`, this.w / 2, this.h / 2 + 18);
                    }
                }
                ctx.fillStyle = '#00f5d4';
                ctx.font = '14px monospace';
                ctx.fillText('按 R 重新开始', this.w / 2, this.h / 2 + 80);
            }
        }

        // 辅助函数：hex颜色转rgba并指定透明度
        function hexA(hex, a) {
            if (hex.startsWith('#')) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return `rgba(${r},${g},${b},${a})`;
            }
            return hex;
        }

        /**
         * buffs.js - Buff 注册系统（筹码 + Boss 修饰符钩子）
         *
         * 设计目标：
         * - 抽取 game.js 中散落的 _hasBuff 调用为统一钩子注册表
         * - 每个 Buff 一处定义，包含所有生命周期钩子
         * - 保留 _hasBuff(id) 兼容接口，旧调用点可逐步迁移
         *
         * 钩子类型：
         * - onPegHit(ctx)      球碰钉子时触发
         * - onSlotScore(ctx)   落槽得分时触发（顺序敏感）
         * - onRoundEnd(ctx)    回合结束时触发
         * - onCreateConnector(ctx)  创建连接块时触发
         *
         * 上下文 ctx 字段：
         * - game    Game 实例
         * - ball    球对象（onPegHit/onSlotScore）
         * - peg     物理钉子（onPegHit）
         * - pegVis  视觉钉子（onPegHit，可能为 null）
         * - pts     当前得分（onSlotScore，可修改）
         * - si      槽位索引（onSlotScore）
         * - effRounds 有效回合数（onSlotScore）
         * - maxHits 连接块耐久（onCreateConnector，可修改）
         */

        const BuffRegistry = {
            // ===== 碰钉钩子 =====
            bounce: {
                onPegHit(ctx) {
                    ctx.ball.data.bounceBonus += 3;
                    ctx.game.renderer.addFloat(ctx.ball.x, ctx.ball.y - 10, '+3', '#fee440', 10);
                },
            },
            pegPink: {
                onPegHit(ctx) {
                    if (ctx.pegVis?.colorType === 'pink') ctx.ball.data.bounceBonus += 5;
                },
            },
            pegCyan: {
                onPegHit(ctx) {
                    if (ctx.pegVis?.colorType === 'cyan') ctx.ball.data.bounceBonus += 5;
                },
            },
            pegYellow: {
                onPegHit(ctx) {
                    if (ctx.pegVis?.colorType === 'yellow') ctx.ball.data.bounceBonus += 5;
                },
            },
            goldTouch: {
                onPegHit(ctx) {
                    ctx.game._addGoldFrag(0.01, ctx.ball.x, ctx.ball.y);
                },
            },
            focus: {
                onPegHit(ctx) {
                    const C = Config;
                    const slot0X = C.slotL + C.slotW / 2;
                    const slot9X = C.slotL + 9 * C.slotW + C.slotW / 2;
                    const targetX = (ctx.ball.x < (C.slotL + C.slotR) / 2) ? slot0X : slot9X;
                    const dir = targetX - ctx.ball.x;
                    if (Math.abs(dir) > 1) {
                        ctx.ball.vx += Math.sign(dir) * 25;
                    }
                },
            },
            fission: {
                onPegHit(ctx) {
                    const d = ctx.ball.data;
                    if (!d._fissionTriggered && d.fissionGen < 4) {
                        d._fissionTriggered = true;
                        ctx.game._fissionBall(ctx.ball);
                        ctx.stopPropagation = true;
                    }
                },
            },

            // ===== 落槽得分钩子（顺序敏感，按注册顺序执行）=====
            longer: {
                onSlotScore(ctx) {
                    ctx.pts += Math.min(Math.floor(ctx.ball.data.rampTime) * 100, 600);
                },
            },
            focus_score: {
                onSlotScore(ctx) {
                    ctx.pts = Math.floor(ctx.pts * 1.5);
                },
            },
            lastStand: {
                onSlotScore(ctx) {
                    if (ctx.game.state.turn === ctx.effRounds - 1) {
                        ctx.pts = Math.floor(ctx.pts * 3);
                    }
                },
            },
            edgeMaster: {
                onSlotScore(ctx) {
                    if (ctx.si === 0 || ctx.si === 9) {
                        ctx.pts = Math.floor(ctx.pts * 3);
                    }
                },
            },
            luckySeven: {
                onSlotScore(ctx) {
                    if (ctx.si % 2 === 0) {
                        ctx.pts = Math.floor(ctx.pts * 3);
                    }
                },
            },
            pegMaster: {
                onSlotScore(ctx) {
                    ctx.pts += Math.floor(ctx.ball.data.pegHits / 5) * 100;
                },
            },
            glassCannon: {
                onSlotScore(ctx) {
                    ctx.pts = Math.floor(ctx.pts * 3);
                },
            },
            doubleOrNothing: {
                onSlotScore(ctx) {
                    if (Math.random() < 0.5) {
                        ctx.pts = Math.floor(ctx.pts * 3);
                        ctx.game.renderer.addFloat(ctx.ball.x, ctx.ball.y - 30, '三倍!', '#fee440', 14);
                        SFX.play('doubleWin');
                    } else {
                        ctx.pts = 0;
                        ctx.game.renderer.addFloat(ctx.ball.x, ctx.ball.y - 30, '归零!', '#ff006e', 14);
                        SFX.play('doubleLose');
                    }
                },
            },

            // ===== 回合结束钩子 =====
            piggyBank: {
                onRoundEnd(ctx) {
                    for (const slot of ctx.game.state.buffSlots) {
                        if (slot && slot.id === 'piggyBank') slot.sellPrice += 1;
                    }
                },
            },
            bank: {
                onRoundEnd(ctx) {
                    const interest = Math.min(5, Math.floor(ctx.game.state.coins / 10));
                    if (interest > 0) {
                        ctx.game.state.coins += interest;
                        ctx.game.renderer.addFloat(Config.view.w / 2, 60, `利息+${interest}金`, '#fee440', 14);
                    }
                },
            },

            // ===== 连接块创建钩子 =====
            longpegs: {
                onCreateConnector(ctx) {
                    ctx.maxHits *= 2;
                },
            },
        };

        // focus 筹码在 onPegHit 和 onSlotScore 两个阶段都生效
        // 通过 focus（碰钉推力）+ focus_score（落槽×1.5）实现
        BuffRegistry.focus.onSlotScore = BuffRegistry.focus_score.onSlotScore;

        // 统一调用入口：按 buffSlots 顺序执行所有 buff 的指定钩子
        function applyBuffHook(hookName, ctx) {
            const slots = ctx.game.state.buffSlots;
            for (const slot of slots) {
                if (!slot) continue;
                const buff = BuffRegistry[slot.id];
                if (buff && buff[hookName]) {
                    buff[hookName](ctx);
                    if (ctx.stopPropagation) return;
                }
            }
        }


        // ===== Boss 修饰符注册表 =====
        const BossModRegistry = {
            glassPegs: {
                onActivate(ctx) {
                    const C = Config;
                    ctx.game.state.glassPegSet = new Set();
                    for (const p of ctx.game.state.pegs) {
                        if (Math.random() < 0.3) {
                            p.glass = true;
                            ctx.game.state.glassPegSet.add(p);
                            const physPeg = Physics.pegs.find(pp =>
                                Math.abs(pp.x - p.x) < 1 && Math.abs(pp.y - p.y) < 1);
                            if (physPeg) physPeg.glass = true;
                        }
                    }
                },
                onDeactivate(ctx) {
                    if (ctx.game.state.glassPegSet) {
                        for (const p of ctx.game.state.glassPegSet) {
                            p.glass = false;
                            const physPeg = Physics.pegs.find(pp =>
                                Math.abs(pp.x - p.x) < 1 && Math.abs(pp.y - p.y) < 1);
                            if (physPeg) physPeg.glass = false;
                        }
                        ctx.game.state.glassPegSet = null;
                    }
                },
            },
            slotShuffle: {
                onActivate(ctx) { ctx.game._shuffleSlotScores(); },
            },
            edgeSeal: {
                onActivate(ctx) { /* 标记，_onSlot 中处理 */ },
            },
            monochrome: {
                onActivate(ctx) {
                    const C = Config;
                    const types = C.colors.pegColorTypes;
                    ctx.game.state.activePegColor = types[Math.floor(Math.random() * types.length)];
                },
            },
            lowGravity: {
                onActivate(ctx) {
                    ctx.game.state.origGravity = Physics.gravity;
                    Physics.gravity *= 0.5;
                },
                onDeactivate(ctx) {
                    if (ctx.game.state.origGravity !== null) {
                        Physics.gravity = ctx.game.state.origGravity;
                        ctx.game.state.origGravity = null;
                    }
                },
            },
            lowBounce: {
                onActivate(ctx) {
                    ctx.game.state.origBounceMul = 1;
                    for (const b of ctx.game.state.balls) {
                        b._origBounce = b.bounce;
                        b.bounce *= 0.5;
                    }
                },
                onDeactivate(ctx) {
                    if (ctx.game.state.origBounceMul !== undefined) {
                        for (const b of ctx.game.state.balls) {
                            if (b._origBounce !== undefined) {
                                b.bounce = b._origBounce;
                                delete b._origBounce;
                            }
                        }
                        ctx.game.state.origBounceMul = undefined;
                    }
                },
            },
            concentrate: {
                onActivate(ctx) { /* 标记，_update 中处理 */ },
            },
        };

        function applyBossModHook(hookName, ctx) {
            const mod = ctx.game.state.bossMod;
            if (!mod) return;
            const entry = BossModRegistry[mod];
            if (entry && entry[hookName]) entry[hookName](ctx);
        }

        /**
         * game.js - 游戏主控逻辑（小丑牌式 8轮×3小关卡 + 三类商品 + 霓虹风格）
         *
         * 流程：
         * 1. phase='shop'：玩家用金币购买筹码/珠子/钉子三类商品
         *    - 筹码：进库存，可放置到顶部5个buff槽
         *    - 珠子：立即生效，永久强化球属性
         *    - 钉子：进入 pegSelect 模式，玩家点击场上钉子完成标记
         * 2. 点击"开始"→phase='play'，5回合游戏
         * 3. 分数达标→立即通关，进入下一小关卡商店；5回合用完未达标→gameover
         * 4. 完成8轮×3小关卡→全部通关
         */

        class Game {
            static async start(canvas) {
                // 单文件版：跳过 CSV 版本校验（所有数据已在 config.js 中硬编码）
                return new Game(canvas);
            }

            static _showVersionError(msg) {
                const container = document.createElement('div');
                container.style.cssText = `
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            font-family: monospace; color: #ff006e; text-align: center;
        `;

                const title = document.createElement('h1');
                title.textContent = '配置版本错误';
                title.style.cssText = 'font-size: 28px; margin-bottom: 20px; color: #ff006e;';

                const body = document.createElement('pre');
                body.textContent = msg;
                body.style.cssText = `
            font-size: 14px; color: #f0f0f0; max-width: 80%;
            max-height: 60vh; overflow-y: auto; text-align: left;
            background: #1a1a2e; padding: 20px; border-radius: 8px;
            border: 2px solid #ff006e;
        `;

                const hint = document.createElement('p');
                hint.textContent = '请更新 chips.csv 或代码版本以匹配';
                hint.style.cssText = 'margin-top: 20px; color: #fee440;';

                container.appendChild(title);
                container.appendChild(body);
                container.appendChild(hint);
                document.body.appendChild(container);
            }

            constructor(canvas) {
                this.canvas = canvas;
                this.renderer = new Renderer(canvas);
                const C = Config;
                // ===== 游戏状态 =====
                this.state = {
                    phase: 'shop',          // 'shop' | 'play' | 'gameover' | 'pegSelect'
                    round: 0,               // 当前轮次 0-7
                    stage: 0,               // 当前小关卡 0-2（小型/大型/Boss）
                    coins: C.startCoins,    // 玩家金币
                    score: 0,               // 当前小关卡累计得分
                    turn: 0,                // 当前小关卡已用回合数
                    // 球与发射
                    power: 0,
                    charging: false,
                    chargeTime: 0,          // 蓄力累计时间（循环用）
                    flying: false,
                    ballReady: false,
                    ball: null,             // 主球
                    balls: [],              // 所有活动球（含分身）
                    recycling: false,
                    recycleTimer: 0,
                    // 炮塔系统
                    turretAngle: 0,         // 当前炮塔角度（度）
                    turretTime: 0,          // 炮塔旋转累计时间
                    // 场景
                    pegs: [],
                    // 商店：三类商品混合
                    shopOfferings: [],      // [{type:'chip'|'ball'|'peg', id, price}] 或 null
                    inventory: [],          // 已购买未放置的筹码实例 [{id, sellPrice}]
                    buffSlots: new Array(C.buffSlots).fill(null),  // 5个buff槽
                    selectedInv: -1,        // 库存中选中的索引（用于放置）
                    // 珠子/钉子强化
                    ballUpgrades: {},       // 累加效果 {radiusAdd, bounceAdd, gravityAdd, fissionAdd, luckyChance, luckyScore, scoreMulMul}
                    pendingPegUpgrade: null,// 购买钉子道具后待放置的id
                    // 连接块系统
                    connectors: [],         // 当前场上连接块 [{pegA, pegB, wall, def, hits}]
                    pendingConnector: null, // 待放置的连接块id
                    selectedPeg: null,      // 已选中的第一个钉子（用于放置连接块）
                    // UI辅助
                    lastSlotScore: 0,
                    over: false,
                    won: false,
                    allCleared: false,      // 全部关卡通关
                    launchTime: 0,          // 击发时间戳（用于15s超时）
                    hoverHit: null,         // 当前悬停目标（用于提示窗口）
                    goldFrag: 0,            // 金币碎片累积（点金术+金币钉）
                    fissionCount: 0,        // 全局分裂次数计数（封顶用）
                    lastSlotIdx: -1,        // 上次落槽索引（连击筹码用）
                    streakCount: 0,         // 连击数（连续落同槽）
                    burning: 0,             // 燃烧效果倒计时（>0 时激活）
                    // Boss 修饰符
                    bossMod: null,          // 当前 Boss 修饰符 id
                    activeSlotScores: null, // 当前生效的槽位分数（Boss 可修改）
                    glassPegSet: null,      // 透明钉集合
                    origGravity: null,      // 原始重力（lowGravity 恢复用）
                    origBounceMul: undefined, // lowBounce 恢复用
                    activePegColor: null,   // 单色限制：仅此色钉计分
                    bossIntro: 0,           // Boss 介绍动画剩余时间
                };
                this._mainLanded = false;   // 主球是否已消失（落槽或分裂）
                this._roundEnded = false;   // 当前回合是否已结算（防重复调用_endRound）
                this._setupInput();
                this._refreshShop(true);    // 初始免费刷新
                this._buildField();
                this._spawnBall();
                this._loop = this._loop.bind(this);
                this.lastT = performance.now();
                requestAnimationFrame(this._loop);
            }

            // ===== 输入 =====
            _setupInput() {
                window.addEventListener('keydown', e => {
                    if (this.state.phase === 'gameover') {
                        if (e.code === 'KeyR') this._restart();
                        return;
                    }
                    if (this.state.phase === 'play') {
                        if (e.code === 'Space') {
                            if (this.state.ballReady && !this.state.flying && !this.state.charging) {
                                this.state.charging = true;
                                this.state.chargeTime = 0;
                                e.preventDefault();
                            }
                        }
                    }
                });
                window.addEventListener('keyup', e => {
                    if (e.code === 'Space' && this.state.charging) {
                        this.state.charging = false;
                        this._launch();
                        e.preventDefault();
                    }
                });
                // 鼠标点击：商店购买/放置/出售/刷新/开始 + pegSelect钉子标记
                this.canvas.addEventListener('click', (ev) => this._onClick(ev));
                // 鼠标悬停：检测悬停目标用于显示提示窗口（shop + play + connectorSelect 阶段）
                this.canvas.addEventListener('mousemove', (ev) => {
                    if (this.state.phase !== 'shop' && this.state.phase !== 'play' &&
                        this.state.phase !== 'connectorSelect') {
                        this.state.hoverHit = null;
                        return;
                    }
                    const p = this._toCanvas(ev);
                    this.state.hoverHit = this.renderer.hitTest(p.x, p.y, this.state);
                });
                this.canvas.addEventListener('mouseleave', () => {
                    this.state.hoverHit = null;
                });
                // 右键取消 pegSelect/connectorSelect 模式（已扣金币不退）
                this.canvas.addEventListener('contextmenu', (ev) => {
                    ev.preventDefault();
                    if (this.state.phase === 'pegSelect') {
                        this.state.pendingPegUpgrade = null;
                        this.state.phase = 'shop';
                    } else if (this.state.phase === 'connectorSelect') {
                        this.state.pendingConnector = null;
                        this.state.selectedPeg = null;
                        this.state.phase = 'shop';
                    }
                });
            }

            // 屏幕坐标→canvas坐标
            _toCanvas(ev) {
                const rect = this.canvas.getBoundingClientRect();
                const sx = (ev.clientX - rect.left) * (Config.view.w / rect.width);
                const sy = (ev.clientY - rect.top) * (Config.view.h / rect.height);
                return { x: sx, y: sy };
            }

            _onClick(ev) {
                // ===== pegSelect 模式：点击场上钉子完成标记 =====
                if (this.state.phase === 'pegSelect') {
                    const p = this._toCanvas(ev);
                    let nearest = null, minDist = 22;
                    for (const peg of this.state.pegs) {
                        if (peg.upgraded) continue;
                        const d = Math.hypot(peg.x - p.x, peg.y - p.y);
                        if (d < minDist) { minDist = d; nearest = peg; }
                    }
                    if (nearest) {
                        nearest.upgraded = this.state.pendingPegUpgrade;
                        const def = Config.pegUpgrades.find(u => u.id === this.state.pendingPegUpgrade);
                        nearest.upgradeColor = def.color;
                        nearest.upgradeR = nearest.special ? 6 : 5;
                        this.renderer.addEffect(nearest.x, nearest.y, def.color, 14, 100, 0.6);
                        this.renderer.addFloat(nearest.x, nearest.y - 15, def.name, def.color, 12);
                        this.state.pendingPegUpgrade = null;
                        this.state.phase = 'shop';
                    }
                    return;
                }
                // ===== connectorSelect 模式：双点击放置连接块 =====
                if (this.state.phase === 'connectorSelect') {
                    const p = this._toCanvas(ev);
                    let nearest = null, minDist = 22;
                    for (const peg of this.state.pegs) {
                        const d = Math.hypot(peg.x - p.x, peg.y - p.y);
                        if (d < minDist) { minDist = d; nearest = peg; }
                    }
                    if (nearest) {
                        if (!this.state.selectedPeg) {
                            this.state.selectedPeg = nearest;
                        } else if (this.state.selectedPeg === nearest) {
                            this.state.selectedPeg = null;
                        } else {
                            if (this._arePegsAdjacent(this.state.selectedPeg, nearest)) {
                                this._createConnector(this.state.selectedPeg, nearest);
                                this.state.selectedPeg = null;
                                this.state.pendingConnector = null;
                                this.state.phase = 'shop';
                            } else {
                                this.renderer.addFloat((this.state.selectedPeg.x + nearest.x) / 2,
                                    (this.state.selectedPeg.y + nearest.y) / 2, '钉子不相邻!', '#ff006e', 12);
                                this.state.selectedPeg = nearest;
                            }
                        }
                    }
                    return;
                }
                if (this.state.phase !== 'shop') return;
                const p = this._toCanvas(ev);
                const hit = this.renderer.hitTest(p.x, p.y, this.state);
                if (!hit) return;
                switch (hit.type) {
                    case 'shopItem': this._buy(hit.index); break;
                    case 'invItem': this._selectInv(hit.index); break;
                    case 'buffSlot': this._toggleBuff(hit.index); break;
                    case 'refresh': this._refreshShop(false); break;
                    case 'startBtn': this._startPlay(); break;
                    case 'sellInv': this._sellInv(hit.index); break;
                }
            }

            // ===== 商店逻辑（分类展示）=====
            _refreshShop(free) {
                const C = Config;
                if (!free) {
                    if (this.state.coins < C.shop.refreshCost) return;
                    this.state.coins -= C.shop.refreshCost;
                    SFX.play('shopRefresh');
                }
                const ownedChipIds = new Set();
                for (const inv of this.state.inventory) ownedChipIds.add(inv.id);
                for (const slot of this.state.buffSlots) if (slot) ownedChipIds.add(slot.id);

                // 分类商店：筹码(3), 钉子(2), 连接块(2), 珠子(2)
                // 过滤掉已弃用条目（deprecated: true）
                const notDeprecated = item => !item.deprecated;
                const shopCategories = [
                    { type: 'chip', count: 3, pool: C.chips.filter(c => !ownedChipIds.has(c.id) && notDeprecated(c)) },
                    { type: 'peg', count: 2, pool: C.pegUpgrades.filter(notDeprecated) },
                    { type: 'connector', count: 2, pool: C.pegConnectors.filter(notDeprecated) },
                    { type: 'ball', count: 2, pool: C.ballUpgrades.filter(notDeprecated) },
                ];

                this.state.shopOfferings = [];
                for (const cat of shopCategories) {
                    for (let i = 0; i < cat.count; i++) {
                        if (cat.pool.length === 0) {
                            this.state.shopOfferings.push(null);
                            continue;
                        }
                        const item = cat.pool[Math.floor(Math.random() * cat.pool.length)];
                        this.state.shopOfferings.push({
                            type: cat.type,
                            id: item.id,
                            price: item.price,
                        });
                    }
                }
                this.state.selectedInv = -1;
            }

            // 辅助：按类型+id 获取商品定义
            _getItemDef(type, id) {
                const C = Config;
                if (type === 'chip') return C.chips.find(c => c.id === id);
                if (type === 'ball') return C.ballUpgrades.find(b => b.id === id);
                if (type === 'peg') return C.pegUpgrades.find(p => p.id === id);
                if (type === 'connector') return C.pegConnectors.find(c => c.id === id);
                return null;
            }

            // 应用珠子效果（累加到 ballUpgrades）
            _applyBallUpgrade(id) {
                const def = Config.ballUpgrades.find(u => u.id === id);
                if (!def) return;
                const bu = this.state.ballUpgrades;
                const e = def.effect;
                if (e.radiusAdd) bu.radiusAdd = (bu.radiusAdd || 0) + e.radiusAdd;
                if (e.bounceAdd) bu.bounceAdd = (bu.bounceAdd || 0) + e.bounceAdd;
                if (e.gravityAdd) bu.gravityAdd = (bu.gravityAdd || 0) + e.gravityAdd;
                if (e.gravityMul) bu.gravityMul = (bu.gravityMul || 1) * e.gravityMul;
                if (e.fissionAdd) bu.fissionAdd = (bu.fissionAdd || 0) + e.fissionAdd;
                if (e.luckyChance) bu.luckyChance = e.luckyChance;
                if (e.luckyScore) bu.luckyScore = e.luckyScore;
                if (e.luckyJackpot) bu.luckyJackpot = e.luckyJackpot;
                if (e.luckyJackpotMul) bu.luckyJackpotMul = e.luckyJackpotMul;
                if (e.scoreMulMul) bu.scoreMulMul = (bu.scoreMulMul || 1) + (e.scoreMulMul - 1);
                bu[id + 'Count'] = (bu[id + 'Count'] || 0) + 1;
            }

            _buy(shopIdx) {
                const C = Config;
                const item = this.state.shopOfferings[shopIdx];
                if (!item || this.state.coins < item.price) return;
                this.state.coins -= item.price;
                SFX.play('purchase');
                if (item.type === 'chip') {
                    this.state.inventory.push({ id: item.id, sellPrice: Math.max(1, item.price - 2) });
                } else if (item.type === 'ball') {
                    const def = this._getItemDef('ball', item.id);
                    if (!def) { this.state.coins += item.price; return; }
                    // 校验叠加上限
                    const cur = this.state.ballUpgrades[item.id + 'Count'] || 0;
                    if (def.maxStack && cur >= def.maxStack) {
                        this.state.coins += item.price;  // 退款
                        this.renderer.addFloat(Config.view.w / 2, 80, `${def.name}已满级`, '#ff006e', 13);
                        return;
                    }
                    this._applyBallUpgrade(item.id);
                    this.renderer.addFloat(Config.view.w / 2, 80, `已获得：${def.name}`, '#06ffa5', 13);
                } else if (item.type === 'peg') {
                    this.state.pendingPegUpgrade = item.id;
                    this.state.phase = 'pegSelect';
                } else if (item.type === 'connector') {
                    this.state.pendingConnector = item.id;
                    this.state.selectedPeg = null;
                    this.state.phase = 'connectorSelect';
                }
                this.state.shopOfferings[shopIdx] = null;
            }

            _selectInv(invIdx) {
                this.state.selectedInv = this.state.selectedInv === invIdx ? -1 : invIdx;
            }

            _sellInv(invIdx) {
                const item = this.state.inventory[invIdx];
                if (!item) return;
                this.state.coins += item.sellPrice;
                this.state.inventory.splice(invIdx, 1);
                if (this.state.selectedInv === invIdx) this.state.selectedInv = -1;
                else if (this.state.selectedInv > invIdx) this.state.selectedInv--;
            }

            // 点击buff槽：若选中库存→放置；若槽位有筹码→取下回库存
            _toggleBuff(slotIdx) {
                const slot = this.state.buffSlots[slotIdx];
                if (slot) {
                    this.state.inventory.push(slot);
                    this.state.buffSlots[slotIdx] = null;
                    this.state.selectedInv = -1;
                } else if (this.state.selectedInv >= 0) {
                    const item = this.state.inventory[this.state.selectedInv];
                    if (item) {
                        this.state.buffSlots[slotIdx] = item;
                        this.state.inventory.splice(this.state.selectedInv, 1);
                        this.state.selectedInv = -1;
                    }
                }
            }

            _startPlay() {
                this.state.phase = 'play';
                this.state.score = 0;
                this.state.turn = 0;
                this.state.launchTime = 0;  // 重置超时计时器
                this.state.lastSlotScore = 0;
                this.state.fissionCount = 0;
                this.state.lastSlotIdx = -1;
                this.state.streakCount = 0;
                this.state.burning = 0;
                this._clearBossMod();
                this._applyBossMod();
                this._resetConnectors();
                // 设置全局重力（基础值 + 珠子强化，Boss lowGravity 在 _applyBossMod 中叠加）
                Physics.gravity = Config.ball.gravity + (this.state.ballUpgrades.gravityAdd || 0);
                if (this.state.ballUpgrades.gravityMul) Physics.gravity *= this.state.ballUpgrades.gravityMul;
                // 重新应用 Boss 修饰符的重力效果（因为上面覆盖了）
                if (this.state.bossMod === 'lowGravity') Physics.gravity *= 0.5;
                this._spawnBall();
            }

            // ===== 场景构建 =====
            _buildField() {
                const C = Config;
                Physics.reset();
                Physics.gravity = C.ball.gravity;

                // 外框 4 面墙（三层炮塔模型：无弯道/通道缺口）
                const T = C.frame.wallT;
                Physics.addRectWall(C.frame.l - T, C.frame.t - T, T, C.frame.b - C.frame.t + T * 2);          // 左壁
                Physics.addRectWall(C.frame.r, C.frame.t - T, T, C.frame.b - C.frame.t + T * 2);              // 右壁
                Physics.addRectWall(C.frame.l - T, C.frame.t - T, C.frame.r - C.frame.l + T * 2, T);           // 顶壁
                Physics.addRectWall(C.frame.l - T, C.frame.b, C.frame.r - C.frame.l + T * 2, T);              // 底壁

                // 钉子阵列（含颜色类型 colorType 用于筹码识别）
                const pc = C.colors.pegColors;
                const pt = C.colors.pegColorTypes;
                for (let row = 0; row < C.peg.rows; row++) {
                    const off = row % 2 === 1 ? C.pegDx / 2 : 0;
                    const valid = [];
                    for (let col = 0; col < C.pegCols; col++) {
                        const px = C.pegX0 + col * C.pegDx + off;
                        if (px < C.pegL || px > C.pegR) continue;
                        valid.push(px);
                    }
                    if (valid.length === 0) continue;
                    const minPx = valid[0], maxPx = valid[valid.length - 1];
                    for (let vi = 0; vi < valid.length; vi++) {
                        const px = valid[vi];
                        const py = C.peg.y0 + row * C.peg.dy;
                        if (py > C.slotTop - 15) continue;
                        const isEdge = (px === minPx || px === maxPx);
                        let gen = true, isSpecial = false;
                        if (row === 0) { if (isEdge) isSpecial = true; else gen = false; }
                        else if (row === 1) { isSpecial = !isEdge; }
                        if (!gen) continue;
                        const pegBounce = isSpecial ? C.specialPeg.bounce : C.peg.bounce;
                        const pegFriction = isSpecial ? C.specialPeg.friction : C.peg.friction;
                        const pegRadius = isSpecial ? C.specialPeg.radius : C.peg.radius;
                        Physics.addPeg(px, py, pegRadius, { bounce: pegBounce, friction: pegFriction });
                        const colorIdx = (row * C.pegCols + vi) % pc.length;
                        this.state.pegs.push({
                            x: px, y: py,
                            color: isSpecial ? C.specialPeg.color : pc[colorIdx],
                            colorType: isSpecial ? 'special' : pt[colorIdx],
                            flash: 0,
                            special: isSpecial,
                            upgraded: null,        // 特效钉子id（购买后标记）
                            upgradeColor: null,
                        });
                    }
                }

                for (let i = 1; i < C.slot.count; i++) {
                    Physics.addRectWall(C.slotL + i * C.slotW - 1, C.slotTop, 2, C.slot.h);
                }
            }

            // ===== 连接块系统 =====
            _arePegsAdjacent(pegA, pegB) {
                const C = Config;
                const dist = Math.hypot(pegA.x - pegB.x, pegA.y - pegB.y);
                return dist < C.pegDx * 1.5;
            }

            _createConnector(pegA, pegB) {
                const C = Config;
                const def = C.pegConnectors.find(c => c.id === this.state.pendingConnector);
                if (!def) return;

                // 连接块创建 Buff 钩子（longpegs 耐久翻倍）
                let maxHits = def.maxHits;
                const ctx = { game: this, maxHits };
                applyBuffHook('onCreateConnector', ctx);
                maxHits = ctx.maxHits;

                const wall = Physics.addSegWall(pegA.x, pegA.y, pegB.x, pegB.y, {
                    maxHits,
                    color: def.color,
                    onHit: (ball, w) => this._onConnectorHit(ball, w, def, pegA, pegB),
                });

                this.state.connectors.push({
                    pegA, pegB, wall, def,
                });

                this.renderer.addEffect((pegA.x + pegB.x) / 2, (pegA.y + pegB.y) / 2, def.color, 8, 80, 0.5);
                this.renderer.addFloat((pegA.x + pegB.x) / 2, (pegA.y + pegB.y) / 2 - 15, def.name, def.color, 12);
            }

            _onConnectorHit(ball, wall, def, pegA, pegB) {
                const C = Config;
                const d = ball.data;

                this.renderer.addEffect((pegA.x + pegB.x) / 2, (pegA.y + pegB.y) / 2, def.color, 6, 60, 0.4);

                switch (def.id) {
                    case 'bounce':
                        ball.vx *= 2;
                        ball.vy *= 2;
                        this.renderer.addFloat(ball.x, ball.y - 10, '弹力×2', '#ff6b35', 11);
                        break;
                    case 'slow':
                        // 球级别重力减少：修改当前球的重力倍率，不影响全局
                        d.gravityMul = (d.gravityMul || 1) * 0.9;
                        this.renderer.addFloat(ball.x, ball.y - 10, '重力-10%', '#9d4edd', 11);
                        break;
                    case 'coin':
                        this._addGoldFrag(0.05, ball.x, ball.y);
                        break;
                    case 'fission':
                        if (d.fissionGen < 4 && this.state.fissionCount < 8) {
                            this._fissionBall(ball);
                        }
                        break;
                    case 'multScore':
                        d.scoreMul *= 1.5;
                        this.renderer.addFloat(ball.x, ball.y - 15, '×1.5', '#e03131', 12);
                        break;
                    case 'buffLink':
                        const pegAPhys = Physics.pegs.find(p => Math.abs(p.x - pegA.x) < 1 && Math.abs(p.y - pegA.y) < 1);
                        const pegBPhys = Physics.pegs.find(p => Math.abs(p.x - pegB.x) < 1 && Math.abs(p.y - pegB.y) < 1);
                        if (pegAPhys && ball.onPegHit) ball.onPegHit(pegAPhys);
                        if (pegBPhys && ball.onPegHit) ball.onPegHit(pegBPhys);
                        break;
                    case 'Teleportation':
                        // 传送至钉子区顶部：保留x（钳到钉子区），y置为钉子区顶部
                        ball.x = Math.max(C.pegL + 4, Math.min(C.pegR - 4, ball.x));
                        ball.y = C.peg.y0 - 6;
                        ball.vy = 60;  // 轻微向下，避免立即被弹回
                        ball.vx *= 0.4;
                        this.renderer.addEffect(ball.x, ball.y, def.color, 12, 80, 0.6);
                        this.renderer.addFloat(ball.x, ball.y - 12, '传送!', def.color, 12);
                        break;
                }
            }

            // 每回合重置连接板耐久：连接板永久存在，但 hits 每回合刷新
            _resetConnectors() {
                for (const conn of this.state.connectors) {
                    if (conn.wall) {
                        conn.wall.hits = 0;
                        conn.wall.broken = false;
                    }
                }
            }

            _applyAttractConnectors(dt) {
                const C = Config;
                for (const conn of this.state.connectors) {
                    if (conn.wall.broken || conn.def.id !== 'attract') continue;
                    const cx = (conn.pegA.x + conn.pegB.x) / 2;
                    const cy = (conn.pegA.y + conn.pegB.y) / 2;
                    for (const b of this.state.balls) {
                        if (!b.alive) continue;
                        const dist = Math.hypot(b.x - cx, b.y - cy);
                        if (dist < 40 && dist > 0) {
                            const nx = (cx - b.x) / dist;
                            const ny = (cy - b.y) / dist;
                            b.vx += nx * 30 * dt;
                            b.vy += ny * 30 * dt;
                        }
                    }
                }
            }

            // ===== 球管理 =====
            _makeBall(x, y, opts = {}) {
                const C = Config;
                const bu = this.state.ballUpgrades;
                let radius = opts.radius ?? C.ball.radius;
                let bounce = C.ball.bounce;
                let scoreMul = opts.scoreMul ?? 1;
                // 仅主球享受珠子强化（分身球继承父球属性）
                if (opts.isMain !== false) {
                    if (bu.radiusAdd) radius += bu.radiusAdd;
                    if (bu.bounceAdd) bounce += bu.bounceAdd;
                    if (bu.scoreMulMul) scoreMul *= bu.scoreMulMul;
                }
                // 注意：不在此设置 Physics.gravity，避免裂变时覆盖 Boss 的 lowGravity 效果
                // 全局重力在 _startPlay / _startRecycle 中统一设置
                const b = Physics.addBall(x, y, radius, {
                    bounce,
                    friction: C.ball.friction,
                    trailLen: C.ball.trailLen,
                });
                b.vx = 0; b.vy = 0;
                b.data = {
                    isMain: opts.isMain ?? true,
                    pegHits: 0,         // 碰钉次数（裂变用）
                    bounceBonus: 0,     // 弹力累计分
                    rampTime: 0,        // 钉子区停留时间
                    goldFrag: 0,        // 点金术碎片
                    fissionGen: opts.fissionGen ?? 0,  // 分裂代数
                    scoreMul,                                // 分数倍率（应用倍率珠）
                    luckyChance: bu.luckyChance || 0,        // 幸运珠概率
                    luckyScore: bu.luckyScore || 0,          // 幸运珠加分
                    luckyJackpot: bu.luckyJackpot || 0,      // 幸运珠大奖概率
                    luckyJackpotMul: bu.luckyJackpotMul || 1, // 幸运珠大奖倍率
                    lastPeg: null,      // 上次碰的钉子（防重复计数）
                    stuckTime: 0,       // 卡死检测：低速持续时间
                    gravityMul: 1,      // 球级别重力倍率（slow 连接块用）
                };
                b.onPegHit = (peg) => this._onPegHit(b, peg);
                // Boss lowBounce: 对新球应用弹力减半，便于 _clearBossMod 恢复
                if (this.state.bossMod === 'lowBounce') {
                    b._origBounce = b.bounce;
                    b.bounce *= 0.5;
                }
                return b;
            }

            _spawnBall() {
                // 清理旧球（物理引擎+ball列表）
                if (this.state.ball) {
                    this.state.ball.alive = false;
                    const idx = Physics.balls.indexOf(this.state.ball);
                    if (idx >= 0) Physics.balls.splice(idx, 1);
                }
                for (const b of this.state.balls) {
                    if (b !== this.state.ball) {
                        b.alive = false;
                        const i = Physics.balls.indexOf(b);
                        if (i >= 0) Physics.balls.splice(i, 1);
                    }
                }
                this.state.balls = [];
                this.state.ball = null;       // 不创建待机球——松开空格时在 _launch 中创建
                this.state.flying = false;
                this.state.ballReady = true;
                this.state.recycling = false;
                this._mainLanded = false;
                this._roundEnded = false;
            }

            // 检查buff槽是否包含某筹码
            _hasBuff(id) {
                return this.state.buffSlots.some(s => s && s.id === id);
            }

            // 金币碎片累积（点金术+金币钉共用）：存够1金币时兑换+特效
            _addGoldFrag(amount, x, y) {
                this.state.goldFrag += amount;
                if (this.state.goldFrag >= 1) {
                    this.state.goldFrag -= 1;
                    this.state.coins += 1;
                    // 兑换特效：金色爆发 + 浮动文字 + 闪光
                    this.renderer.addEffect(x, y, '#fee440', 16, 150, 0.6);
                    this.renderer.addFloat(x, y - 25, '+1金!', '#fee440', 18);
                    this.renderer.flash = Math.max(this.renderer.flash, 0.4);
                    SFX.play('goldExchange');
                }
            }

            // 有效回合数（glassCannon -1，最少3）
            _effectiveRounds() {
                return Math.max(3, Config.game.rounds - (this._hasBuff('glassCannon') ? 1 : 0));
            }

            // ===== Boss 修饰符系统 =====
            _applyBossMod() {
                const C = Config;
                // 仅 Boss 关（stage===2）应用修饰符
                if (this.state.stage !== 2 || !C.bossMods) return;
                // 随机选一个修饰符（过滤掉已弃用的）
                const availableMods = C.bossMods.filter(m => !m.deprecated);
                if (availableMods.length === 0) return;
                const mod = availableMods[Math.floor(Math.random() * availableMods.length)];
                this.state.bossMod = mod.id;
                this.state.activeSlotScores = [...C.slotScores];
                this.state.bossIntro = 2.5;
                SFX.play('bossIntro');
                // 按类型应用（通过 BossModRegistry 钩子）
                applyBossModHook('onActivate', { game: this });
            }

            _shuffleSlotScores() {
                const arr = this.state.activeSlotScores;
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
            }

            _clearBossMod() {
                // 通过 BossModRegistry 钩子恢复副作用（重力/弹力/透明钉）
                applyBossModHook('onDeactivate', { game: this });
                this.state.bossMod = null;
                this.state.activeSlotScores = null;
                this.state.activePegColor = null;
                this.state.bossIntro = 0;
            }

            // 钉子被击中：应用筹码 + 特效钉子 + 幸运珠
            _onPegHit(b, peg) {
                if (!b || !b.data || !peg) return;
                let pegVis = null;
                for (const p of this.state.pegs) {
                    if (Math.abs(p.x - peg.x) < 1 && Math.abs(p.y - peg.y) < 1) { pegVis = p; break; }
                }
                if (pegVis) {
                    pegVis.flash = 1.0;
                    this.renderer.addEffect(peg.x, peg.y, '#fee440', 4, 80, 0.35);
                }

                const d = b.data;
                d.pegHits++;

                // 音效冷却 80ms（ISSUE #002 修复：防止夹角处叠加）
                const now = performance.now();
                if (!d._lastPegSound || now - d._lastPegSound > 80) {
                    if (pegVis) SFX.play('pegHit', { color: pegVis.color });
                    d._lastPegSound = now;
                }

                // ===== monochrome Boss：非匹配色钉子跳过 bonus，但裂变仍触发 =====
                if (this.state.activePegColor && pegVis && pegVis.colorType !== this.state.activePegColor) {
                    this.renderer.addEffect(peg.x, peg.y, '#444444', 2, 50, 0.2);
                    const ctx = { game: this, ball: b, peg, pegVis, stopPropagation: false };
                    if (BuffRegistry.fission) BuffRegistry.fission.onPegHit?.(ctx);
                    if (ctx.stopPropagation) return;
                    return;
                }

                // ===== 特效钉子（购买后永久标记，非 buff 不迁移）=====
                if (pegVis && pegVis.upgraded) {
                    const def = Config.pegUpgrades.find(u => u.id === pegVis.upgraded);
                    if (def) {
                        if (def.effect.addScore) {
                            d.bounceBonus += def.effect.addScore;
                            this.renderer.addFloat(b.x, b.y - 15, `+${def.effect.addScore}`, def.color, 11);
                        }
                        if (def.effect.multScore) {
                            d.scoreMul *= def.effect.multScore;
                            this.renderer.addFloat(b.x, b.y - 25, `×${def.effect.multScore}`, def.color, 12);
                        }
                        if (def.effect.addCoinFrac) {
                            this._addGoldFrag(def.effect.addCoinFrac, b.x, b.y);
                        }
                        if (def.effect.bounce) {
                            peg.bounce = def.effect.bounce;
                        }
                        if (def.effect.fission && d.fissionGen < 4) {
                            this._fissionBall(b);
                            return;
                        }
                    }
                }

                // ===== 幸运珠（球属性强化，非 buff 不迁移）=====
                if (d.luckyChance > 0 && Math.random() < d.luckyChance) {
                    d.bounceBonus += d.luckyScore;
                    this.renderer.addFloat(b.x, b.y - 20, `幸运+${d.luckyScore}`, '#fee440', 12);
                }
                if (d.luckyJackpot > 0 && Math.random() < d.luckyJackpot) {
                    d.scoreMul *= d.luckyJackpotMul;
                    this.renderer.addFloat(b.x, b.y - 30, `大奖×${d.luckyJackpotMul}!`, '#ff006e', 14);
                }

                // ===== Buff 钩子：bounce/pegPink/pegCyan/pegYellow/goldTouch/focus/fission =====
                const ctx = { game: this, ball: b, peg, pegVis, stopPropagation: false };
                applyBuffHook('onPegHit', ctx);
                if (ctx.stopPropagation) return;
            }

            // 裂变：原球消失，生成 2 + fissionAdd 个下一代球（半径递减、分数倍率减半）
            _fissionBall(parent) {
                const C = Config;
                // 全局分裂次数封顶 8 次 + 球数上限 24
                if (this.state.fissionCount >= 8 || this.state.balls.length >= 24) return;
                this.state.fissionCount++;
                const bu = this.state.ballUpgrades;
                const gen = parent.data.fissionGen + 1;
                const mul = parent.data.scoreMul * 0.5;
                const radius = Math.max(3, C.ball.radius * Math.pow(0.85, gen));
                const childCount = Math.min(4, 2 + (bu.fissionAdd || 0));  // 多裂变珠子+1，封顶4

                // 如果是主球分裂，标记主球已消失（等待分身球落槽再结束回合）
                if (parent.data.isMain) {
                    this._mainLanded = true;
                    this.state.flying = false;
                    this.state.ball = null;  // 主球已分裂消失
                }

                // 原球消失：从物理引擎和球列表移除
                parent.alive = false;
                const pIdx = Physics.balls.indexOf(parent);
                if (pIdx >= 0) Physics.balls.splice(pIdx, 1);
                const bIdx = this.state.balls.indexOf(parent);
                if (bIdx >= 0) this.state.balls.splice(bIdx, 1);

                // 生成 childCount 个下一代球，按角度均匀散开
                for (let i = 0; i < childCount; i++) {
                    const child = this._makeBall(parent.x, parent.y, {
                        isMain: false,
                        fissionGen: gen,
                        scoreMul: mul,
                        radius: radius,
                    });
                    // 角度按 i/(childCount-1) 在 [-π/4, +π/4] 均匀分布（childCount=1 时为 0）
                    const t = childCount === 1 ? 0.5 : i / (childCount - 1);
                    const ang = (t - 0.5) * (Math.PI / 2) + (Math.random() - 0.5) * 0.3;
                    const sp = 140 + Math.random() * 80;
                    child.vx = Math.sin(ang) * sp;
                    child.vy = -Math.abs(Math.cos(ang) * sp) * 0.4;
                    this.state.balls.push(child);
                }

                // 霓虹粉分裂特效
                this.renderer.addEffect(parent.x, parent.y, '#ff006e', 14, 120, 0.5);
                this.renderer.addFloat(parent.x, parent.y - 15, `分裂!G${gen}×${childCount}`, '#ff006e', 12);
                SFX.play('fission');
            }

            // [DEPRECATED] 磁力筹码：球接近槽位区时向最近槽中心微调
            // _applyMagnet(dt) {
            //     if (!this._hasBuff('magnet')) return;
            //     const C = Config;
            //     for (const b of this.state.balls) {
            //         if (!b.alive || !b.data.onRamp) continue;
            //         if (b.y < C.slotTop - 80 || b.y > C.slotTop + C.slot.h) continue;
            //         let nearestSlot = Math.floor((b.x - C.slotL) / C.slotW);
            //         nearestSlot = Math.max(0, Math.min(C.slot.count - 1, nearestSlot));
            //         const targetX = C.slotL + nearestSlot * C.slotW + C.slotW / 2;
            //         const dir = targetX - b.x;
            //         if (Math.abs(dir) > 2) {
            //             b.vx += Math.sign(dir) * 60 * dt;
            //         }
            //     }
            // }

            _launch() {
                const C = Config;
                if (!this.state.ballReady || this.state.flying) return;
                this.state.ballReady = false;
                this.state.flying = true;
                this.state.launchTime = performance.now();
                const sp = C.launch.vMin + (C.launch.vMax - C.launch.vMin) * this.state.power;
                const rad = this.state.turretAngle * Math.PI / 180;
                // 在炮管末端创建球（炮管方向为(-sin(rad), cos(rad))，与ctx.rotate渲染一致）
                const bx = C.turret.x - C.turret.barrelLen * Math.sin(rad);
                const by = C.turret.y + C.turret.barrelLen * Math.cos(rad);
                const b = this._makeBall(bx, by, { isMain: true });
                b.vx = -sp * Math.sin(rad);
                b.vy = sp * Math.cos(rad);
                this.state.ball = b;
                this.state.balls.push(b);
                // 调试：在清零前保存并打印发射参数
                const launchedPower = this.state.power;
                console.log(`[发射] 塔角=${this.state.turretAngle.toFixed(1)}° | 球@(${bx.toFixed(0)},${by.toFixed(0)}) 速(${b.vx.toFixed(0)},${b.vy.toFixed(0)}) | 力度=${launchedPower.toFixed(2)} 速度=${sp.toFixed(0)}`);
                this.state.power = 0;
                this.state.chargeTime = 0;
                // 炮口闪光：在球出生位置产生粒子特效
                this.renderer.addEffect(bx, by, '#00f5d4', 8, 80, 0.3);
                SFX.play('launch');
                // slotShuffle Boss：每次发射后重洗槽位分
                if (this.state.bossMod === 'slotShuffle') {
                    this._shuffleSlotScores();
                    this.renderer.addFloat(Config.view.w / 2, C.slotTop - 10, '槽位重洗!', '#ff006e', 12);
                }
            }

            // ===== 落槽检测（主球+分身球） =====
            _checkSlots() {
                const C = Config;
                const slotR = C.slotL + C.slotW * C.slot.count;
                // 先收集所有落槽球，避免遍历中修改数组（_onSlot会splice删除球）
                const landed = [];
                for (const b of this.state.balls) {
                    if (!b.alive) continue;
                    if (b.y > C.slotTop && b.y < C.slotTop + C.slot.h && b.x > C.slotL && b.x < slotR) {
                        const si = Math.floor((b.x - C.slotL) / C.slotW);
                        if (si >= 0 && si < C.slot.count) landed.push({ b, si });
                    }
                }
                for (const item of landed) {
                    if (item.b.alive) this._onSlot(item.b, item.si);
                }
            }

            // 球落槽：结算分数
            _onSlot(b, si) {
                const C = Config;
                const d = b.data;
                const prevScore = this.state.score;
                // 移除该球
                b.alive = false;
                const idx = Physics.balls.indexOf(b);
                if (idx >= 0) Physics.balls.splice(idx, 1);
                const bIdx = this.state.balls.indexOf(b);
                if (bIdx >= 0) this.state.balls.splice(bIdx, 1);

                // 基础分：读 activeSlotScores（Boss 可修改），fallback 到 C.slotScores
                const scores = this.state.activeSlotScores || C.slotScores;
                let pts = scores[si];


                // 分身球分数倍率（裂变/倍率钉/倍率珠）
                pts = Math.floor(pts * d.scoreMul);
                // 弹力/钉子加分（球属性，非 buff）
                pts += d.bounceBonus;
                // Buff 钩子链（longer/focus/lastStand/edgeMaster/luckySeven/pegMaster/glassCannon/doubleOrNothing）
                // 顺序敏感，按 buffSlots 注册顺序执行；pts 通过 ctx 传递，钩子修改后读回
                const effRounds = this._effectiveRounds();
                const ctx = { game: this, ball: b, pts, si, effRounds };
                applyBuffHook('onSlotScore', ctx);
                pts = ctx.pts;

                // edgeSeal Boss：边缘槽(0/9)最终强制 0 分（覆盖所有加分）
                if (this.state.bossMod === 'edgeSeal' && (si === 0 || si === 9)) {
                    pts = 0;
                }

                this.state.score += pts;
                // 燃烧效果：单次得分使总分首次超过关卡目标
                const stage = C.rounds[this.state.round]?.stages[this.state.stage];
                const target = stage ? stage.target : 0;
                if (target > 0 && prevScore < target && this.state.score >= target) {
                    this.state.burning = 2.5;
                    this.renderer.flash = 1.0;
                    this.renderer.shake = 14;
                    this.renderer.addFloat(Config.view.w / 2, 40, '超额达标!', '#ff6b35', 18);
                    SFX.play('burning');
                }
                // 霓虹配色：高分粉/橙，中分黄，低分青/绿
                const color = pts >= 800 ? '#ff006e' : pts >= 500 ? '#ff6b35' : pts >= 200 ? '#fee440' : '#00f5d4';
                this.renderer.addFloat(C.slotL + si * C.slotW + C.slotW / 2, C.slotTop + C.slot.h / 2,
                    `+${pts}`, color, 22);
                this.renderer.addEffect(C.slotL + si * C.slotW + C.slotW / 2, C.slotTop + C.slot.h / 2,
                    color, 12, 120, 0.5);
                if (pts >= 800) { this.renderer.flash = 1; this.renderer.shake = 10; }
                else if (pts >= 500) { this.renderer.shake = Math.max(this.renderer.shake, 5); }
                SFX.play('slotScore', { score: pts });

                if (d.isMain) {
                    this.state.flying = false;
                    this.state.lastSlotScore = pts;
                    this._mainLanded = true;
                }
                // 主球已落槽/分裂后，等所有分身球也落槽再回收并结束回合
                this._maybeRecycle();
            }

            // 当主球已消失（落槽或分裂）且无活动球时：结束回合并启动回收
            _maybeRecycle() {
                if (this.state.over) return;
                if (!this._mainLanded) return;
                const alive = this.state.balls.filter(b => b.alive).length;
                if (alive === 0 && !this.state.recycling) {
                    // 统一在此处结束回合（避免主球分裂时未调用_endRound）
                    this._endRound();
                    // 仅在仍处于play阶段且未通关/失败时启动回收
                    if (this.state.phase === 'play' && !this.state.over) {
                        this._startRecycle();
                    }
                }
            }

            // 回合结束：结算回合类buff + 胜负判定（防重复调用）
            _endRound() {
                if (this._roundEnded) return;
                this._roundEnded = true;
                this.state.turn++;  // 累加已用回合数
                // 回合结束 Buff 钩子（piggyBank/bank）
                applyBuffHook('onRoundEnd', { game: this });
                this._checkWinLose();
            }

            _startRecycle() {
                const C = Config;
                const b = this.state.ball;
                if (b) {
                    this.renderer.addEffect(b.x, b.y, '#ff006e', 12, 100, 0.5);
                    b.alive = false;
                    const idx = Physics.balls.indexOf(b);
                    if (idx >= 0) Physics.balls.splice(idx, 1);
                }
                // 清理剩余分身球
                for (const sb of this.state.balls) {
                    if (sb.alive) {
                        sb.alive = false;
                        const i = Physics.balls.indexOf(sb);
                        if (i >= 0) Physics.balls.splice(i, 1);
                    }
                }
                this.state.balls = [];
                this.state.recycling = true;
                this.state.recycleTimer = 0;
                this.state.ball = null;
                // 重置回合标志，准备下一回合
                this._mainLanded = false;
                this._roundEnded = false;
                // 每回合重置裂变计数（裂变钉/裂变筹码每回合独立计算次数）
                this.state.fissionCount = 0;
                // 每回合重置连接板耐久（连接板本身永久存在，但耐久每回合刷新）
                this._resetConnectors();
                // 重置超时计时器（防止旧 launchTime 导致新球被误判超时）
                this.state.launchTime = 0;
                // 重置重力（防止 slow 连接块的 gravity*=0.9 残留）
                Physics.gravity = Config.ball.gravity + (this.state.ballUpgrades.gravityAdd || 0);
                if (this.state.ballUpgrades.gravityMul) Physics.gravity *= this.state.ballUpgrades.gravityMul;
                // 重新应用 Boss lowGravity 修饰符
                if (this.state.bossMod === 'lowGravity') Physics.gravity *= 0.5;
            }

            _updateRecycle(dt) {
                this.state.recycleTimer += dt;
                if (this.state.recycleTimer > 0.3) {
                    this._spawnBall();
                    this.state.recycling = false;
                    this.state.ballReady = true;
                }
            }

            // 胜负判定：分数达标立即通关（剩余回合转金币）；5回合用完未达标则失败
            _checkWinLose() {
                const C = Config;
                const stage = C.rounds[this.state.round]?.stages[this.state.stage];
                if (!stage) return;
                // 分数达标 → 立即通关，剩余击球次数转金币（1次=1金币），基础3金币
                if (this.state.score >= stage.target) {
                    const leftTurns = Math.max(0, this._effectiveRounds() - this.state.turn);
                    const reward = 3 + leftTurns;
                    this.state.coins += reward;
                    this.renderer.addFloat(Config.view.w / 2, 60,
                        `通关!+3金+${leftTurns}剩余`, '#fee440', 14);
                    this.renderer.flash = 0.8;
                    // 推进关卡
                    this.state.stage++;
                    if (this.state.stage >= 3) {
                        this.state.stage = 0;
                        this.state.round++;
                        if (this.state.round >= C.rounds.length) {
                            // 全部通关
                            this.state.allCleared = true;
                            this.state.phase = 'gameover';
                            this.state.over = true;
                            this.state.won = true;
                            SFX.play('victory');
                            return;
                        }
                    }
                    this.state.phase = 'shop';
                    this._clearBossMod();
                    this._refreshShop(true);
                    return;
                }
                // 未达标：5回合用完则失败
                if (this.state.turn >= this._effectiveRounds()) {
                    this._clearBossMod();
                    this.state.phase = 'gameover';
                    this.state.over = true;
                    this.state.won = false;
                    SFX.play('gameOver');
                }
            }

            _restart() {
                const C = Config;
                this.state.phase = 'shop';
                this.state.round = 0;       // 轮次
                this.state.stage = 0;       // 小关卡
                this.state.coins = C.startCoins;
                this.state.score = 0;
                this.state.turn = 0;        // 回合数
                this.state.power = 0;
                this.state.charging = false;
                this.state.flying = false;
                this.state.ballReady = false;
                this.state.over = false;
                this.state.won = false;
                this.state.allCleared = false;
                this.state.pegs = [];
                this.state.balls = [];
                this.state.ball = null;
                this.state.recycling = false;
                this.state.inventory = [];
                this.state.buffSlots = new Array(C.buffSlots).fill(null);
                this.state.selectedInv = -1;
                this.state.lastSlotScore = 0;
                // 重置珠子/钉子强化
                this.state.ballUpgrades = {};
                this.state.pendingPegUpgrade = null;
                this.state.connectors = [];
                this.state.pendingConnector = null;
                this.state.selectedPeg = null;
                this.state.goldFrag = 0;
                this.state.fissionCount = 0;
                this.state.lastSlotIdx = -1;
                this.state.streakCount = 0;
                this._clearBossMod();
                this._refreshShop(true);
                this._buildField();
                this._spawnBall();
            }

            // 底部消灭区域：球掉到地板以下 → 消灭
            _checkBottomKill() {
                const C = Config;
                const killY = C.floorY;
                for (const b of this.state.balls) {
                    if (!b.alive) continue;
                    if (b.y < killY) continue;
                    // 球掉到地板以下 → 消灭
                    this.renderer.addEffect(b.x, b.y, '#ff006e', 10, 100, 0.5);
                    b.alive = false;
                    const idx = Physics.balls.indexOf(b);
                    if (idx >= 0) Physics.balls.splice(idx, 1);
                    if (b.data && b.data.isMain) {
                        this.state.flying = false;
                        this._mainLanded = true;
                        this.renderer.addFloat(b.x, b.y - 15, '出界', '#ff006e', 12);
                    }
                }
                this.state.balls = this.state.balls.filter(b => b.alive);
                if (this._mainLanded) this._maybeRecycle();
            }

            // 15秒超时：将所有存活球强制拖入最近的得分槽
            _checkTimeout(now) {
                if (this.state.recycling) return;
                if (this.state.launchTime === 0) return;
                // 检查是否有活动球（主球飞行中，或主球已裂变但分身球仍在场）
                const aliveBalls = this.state.balls.filter(b => b.alive);
                if (aliveBalls.length === 0) return;
                const elapsed = (now - this.state.launchTime) / 1000;
                if (elapsed < 15) return;
                const C = Config;
                this.renderer.addFloat(C.view.w / 2, 50, '超时!强制结算', '#ff006e', 16);
                this.renderer.flash = 0.6;
                // 对每个存活球，找到最近的得分槽并强制入槽
                const ballsToSlot = aliveBalls;
                for (const b of ballsToSlot) {
                    // 找x坐标最近的槽
                    let si = Math.floor((b.x - C.slotL) / C.slotW);
                    si = Math.max(0, Math.min(C.slot.count - 1, si));
                    this.renderer.addEffect(b.x, b.y, '#fee440', 8, 80, 0.4);
                    this._onSlot(b, si);
                }
                this.state.launchTime = 0;
            }

            // ===== 主循环 =====
            _loop(now) {
                let dt = (now - this.lastT) / 1000;
                this.lastT = now;
                dt = Math.min(dt, 0.05);
                const C = Config;

                try {
                    // ===== 炮塔旋转（始终更新，shop/play 都旋转）=====
                    this.state.turretTime += dt;
                    this.state.turretAngle = C.turret.maxAngle * Math.sin(
                        2 * Math.PI * this.state.turretTime / C.turret.rotationPeriod);

                    if (this.state.phase === 'play' && !this.state.over) {
                        // Boss 介绍倒计时
                        if (this.state.bossIntro > 0) this.state.bossIntro -= dt;

                        // ===== 蓄力循环（三角波：轻→中→高→中→轻）=====
                        if (this.state.charging && this.state.ballReady && !this.state.flying) {
                            this.state.chargeTime += dt;
                            const phase = (this.state.chargeTime % C.charge.period) / C.charge.period;
                            this.state.power = phase < 0.5 ? phase * 2 : 2 - phase * 2;
                        }

                        // 球物理：飞行中或主球落槽后分身球仍在飞时step
                        const simulating = this.state.flying ||
                            (this.state.balls.length > 0 && !this.state.ballReady && !this.state.recycling);
                        if (simulating && !this.state.charging) Physics.step(dt);

                        // 卡死检测：球长时间低速（可能卡在钉子和墙之间）→ 施加向下+随机横向推力
                        for (const b of this.state.balls) {
                            if (!b.alive || !b.data) continue;
                            if (b.data.isMain && !this.state.flying) continue;
                            const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                            if (speed < 20) {
                                b.data.stuckTime = (b.data.stuckTime || 0) + dt;
                                if (b.data.stuckTime > 2.0) {
                                    b.vx += (Math.random() - 0.5) * 80;
                                    b.vy += 250;
                                    b.data.stuckTime = 0;
                                    this.renderer.addFloat(b.x, b.y - 10, '!', '#ff006e', 10);
                                }
                            } else {
                                b.data.stuckTime = 0;
                            }
                        }

                        // 越久越好：rampTime 累加（所有活动球，炮塔模型中球始终在钉子区）
                        for (const b of this.state.balls) {
                            if (b.alive && b.data) b.data.rampTime += dt;
                        }

                        // 集中 Boss：球受到向中间聚集的力
                        if (this.state.bossMod === 'concentrate') {
                            const centerX = (C.slotL + C.slotR) / 2;
                            for (const b of this.state.balls) {
                                if (!b.alive) continue;
                                const dir = centerX - b.x;
                                if (Math.abs(dir) > 1) {
                                    b.vx += Math.sign(dir) * 40 * dt;
                                }
                            }
                        }

                        // 炮塔模型：球仅存在于飞行中，无待机定位

                        if (this.state.recycling) this._updateRecycle(dt);
                        if (this.state.balls.length > 0) {
                            this._applyAttractConnectors(dt);
                            this._checkSlots();
                        }
                        this._checkBottomKill();
                        this._checkTimeout(now);

                        // 清理死亡的分身球
                        this.state.balls = this.state.balls.filter(b => b.alive);

                        for (const p of this.state.pegs) {
                            if (p.flash > 0) p.flash = Math.max(0, p.flash - dt * 4);
                        }
                    }

                    // 燃烧效果倒计时
                    if (this.state.burning > 0) {
                        this.state.burning = Math.max(0, this.state.burning - dt);
                    }
                } catch (e) {
                    console.error('[Game Logic Error]', e);
                }

                try {
                    this.renderer.update(dt);
                    this.renderer.render(this.state);
                    if (this.state.phase === 'gameover') {
                        this.renderer.drawGameOver(this.canvas.getContext('2d'), this.state);
                    }
                } catch (e) {
                    console.error('[Render Error]', e);
                }
                requestAnimationFrame(this._loop);
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const canvas = document.getElementById('game');
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Config.view.w * dpr;
            canvas.height = Config.view.h * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            window.game = await Game.start(canvas);
        });

    </script>
</body>
