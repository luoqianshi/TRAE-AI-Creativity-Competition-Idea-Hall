<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CityVerse OS — 让 AI 看见每一个被忽略的人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   CityVerse OS — Design Token System
   ═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cv-brand:#FF8C42;--cv-brand-hover:#E67A30;--cv-brand-active:#CC6A24;
  --cv-secondary:#4ECDC4;--cv-secondary-hover:#3DBDB4;
  --cv-success:#2ECC71;--cv-warning:#F39C12;--cv-danger:#E74C3C;--cv-info:#3498DB;
  --cv-bg:#FFFBF5;--cv-surface:#FFFFFF;--cv-bubble-ai:#FFF3E6;--cv-bubble-user:#E8F4FD;
  --cv-divider:#F0EBE3;--cv-text:#2D3436;--cv-text-secondary:#636E72;--cv-text-placeholder:#B2BEC3;
  --cv-hero-gradient:linear-gradient(135deg,#FFF8F0 0%,#FFE4CC 50%,#FFD4B8 100%);
  --cv-cta-gradient:linear-gradient(135deg,#FF8C42 0%,#FF6B35 100%);
  --cv-mission-bg:#FFFFFF;--cv-cta-section-bg:#FFF8F0;
  --cv-notification-danger-bg:#FFE8E8;--cv-notification-danger-text:#C0392B;
  --cv-font-sans:"Inter","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --cv-text-display:36px;--cv-text-h1:28px;--cv-text-h2:22px;--cv-text-h3:18px;
  --cv-text-body-lg:16px;--cv-text-body:15px;--cv-text-body-sm:14px;--cv-text-caption:12px;--cv-text-data:48px;
  --cv-lh-display:1.2;--cv-lh-h1:1.3;--cv-lh-h2:1.35;--cv-lh-h3:1.4;--cv-lh-body:1.6;--cv-lh-sm:1.5;--cv-lh-caption:1.4;
  --cv-space-1:4px;--cv-space-2:8px;--cv-space-3:12px;--cv-space-4:16px;--cv-space-5:20px;--cv-space-6:24px;
  --cv-space-8:32px;--cv-space-10:40px;--cv-space-12:48px;--cv-space-16:64px;--cv-space-20:80px;
  --cv-radius-btn:8px;--cv-radius-bubble:16px;--cv-radius-card:12px;--cv-radius-avatar:50%;
  --cv-radius-progress:4px;--cv-radius-pill:999px;
  --cv-shadow-micro:0 1px 3px rgba(0,0,0,.06);--cv-shadow-card:0 2px 8px rgba(0,0,0,.08);
  --cv-shadow-float:0 4px 16px rgba(0,0,0,.12);--cv-shadow-modal:0 8px 32px rgba(0,0,0,.16);
  --cv-ease-default:cubic-bezier(.4,0,.2,1);--cv-ease-enter:cubic-bezier(0,0,.2,1);--cv-ease-spring:cubic-bezier(.34,1.56,.64,1);
  --cv-nav-height:56px;--cv-chat-width:40%;--cv-chat-min-width:360px;
}
html{font-family:var(--cv-font-sans);font-size:var(--cv-text-body);line-height:var(--cv-lh-body);color:var(--cv-text);background:var(--cv-bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{margin:0;min-height:100vh;overflow:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--cv-divider);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--cv-text-placeholder)}
:focus-visible{outline:2px solid var(--cv-brand);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ── Pages ── */
.page{display:none;width:100vw;height:100vh}
.page.active{display:flex;flex-direction:column}

/* ── Keyframes ── */
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes dotPulse{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
@keyframes routeDraw{to{stroke-dashoffset:0}}
@keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes ripple{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.5);opacity:0}}
@keyframes progressFill{from{width:0%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ── Landing ── */
.landing{overflow-y:auto;overflow-x:hidden}
.hero{height:100vh;min-height:600px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:var(--cv-hero-gradient);overflow:hidden}
.hero-title{font-size:var(--cv-text-display);font-weight:700;color:var(--cv-text);line-height:var(--cv-lh-display);letter-spacing:-.02em;margin-bottom:var(--cv-space-4);max-width:680px;text-align:center;animation:fadeInUp .8s var(--cv-ease-enter) both}
.hero-sub{font-size:var(--cv-text-h3);color:var(--cv-text-secondary);line-height:var(--cv-lh-h3);margin-bottom:var(--cv-space-10);max-width:520px;text-align:center;animation:fadeInUp .8s var(--cv-ease-enter) .15s both}
.hero-cta{animation:fadeInUp .8s var(--cv-ease-enter) .3s both}
.mission{padding:var(--cv-space-20) var(--cv-space-6);background:var(--cv-mission-bg);text-align:center}
.mission-cards{display:flex;justify-content:center;gap:var(--cv-space-10);flex-wrap:wrap;max-width:960px;margin:0 auto}
.data-card{background:var(--cv-surface);border-radius:var(--cv-radius-card);box-shadow:var(--cv-shadow-card);padding:var(--cv-space-8) var(--cv-space-6);flex:1 1 240px;max-width:280px;opacity:0;transform:translateY(16px);transition:opacity .5s var(--cv-ease-enter),transform .5s var(--cv-ease-enter)}
.data-card.visible{opacity:1;transform:translateY(0)}
.data-card:nth-child(2){transition-delay:.15s}.data-card:nth-child(3){transition-delay:.3s}
.data-num{font-size:var(--cv-text-data);font-weight:700;color:var(--cv-brand);line-height:1;letter-spacing:-.02em;margin-bottom:var(--cv-space-2)}
.data-num span{font-size:var(--cv-text-h2);margin-left:2px}
.data-desc{font-size:var(--cv-text-body);color:var(--cv-text-secondary);line-height:var(--cv-lh-body);max-width:220px;margin:0 auto}
.mission-text{font-size:var(--cv-text-h3);font-weight:600;color:var(--cv-text);line-height:var(--cv-lh-h3);margin-top:var(--cv-space-12);max-width:520px;margin-left:auto;margin-right:auto;opacity:0;transition:opacity .6s .6s}
.mission-text.visible{opacity:1}
.cta-section{padding:var(--cv-space-16) var(--cv-space-6);background:var(--cv-cta-section-bg);text-align:center}
.cta-title{font-size:var(--cv-text-h1);font-weight:700;color:var(--cv-text);line-height:var(--cv-lh-h1);letter-spacing:-.02em;margin-bottom:var(--cv-space-8)}
.cta-foot{font-size:var(--cv-text-caption);color:var(--cv-text-placeholder);line-height:var(--cv-lh-caption);margin-top:var(--cv-space-10);letter-spacing:.02em}

/* ── Buttons ── */
.btn-primary{background:var(--cv-cta-gradient);color:#fff;border:none;border-radius:var(--cv-radius-btn);height:48px;padding:0 32px;font-size:var(--cv-text-body-lg);font-weight:600;cursor:pointer;font-family:var(--cv-font-sans);box-shadow:var(--cv-shadow-card);letter-spacing:.02em;transition:box-shadow .2s,transform .15s}
.btn-primary:hover{box-shadow:var(--cv-shadow-float);transform:scale(1.03)}.btn-primary:active{transform:scale(.97)}
.btn-action{background:var(--cv-cta-gradient);color:#fff;border:none;border-radius:var(--cv-radius-btn);padding:var(--cv-space-3) var(--cv-space-5);font-size:var(--cv-text-body);font-weight:600;cursor:pointer;font-family:var(--cv-font-sans);box-shadow:var(--cv-shadow-micro);transition:transform .15s,box-shadow .15s}
.btn-action:hover{transform:scale(1.02);box-shadow:var(--cv-shadow-card)}

/* ── Main App ── */
.main-app{flex-direction:column;background:var(--cv-bg)}
.top-nav{height:var(--cv-nav-height);background:var(--cv-surface);border-bottom:1px solid var(--cv-divider);display:flex;align-items:center;justify-content:space-between;padding:0 var(--cv-space-5);flex-shrink:0}
.nav-logo{display:flex;align-items:center;gap:var(--cv-space-2)}
.nav-icon{width:32px;height:32px;border-radius:8px;background:var(--cv-cta-gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.nav-title{font-size:var(--cv-text-h3);font-weight:600;color:var(--cv-text);letter-spacing:-.01em}
.nav-btns{display:flex;align-items:center;gap:var(--cv-space-2)}
.nav-btn{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:var(--cv-radius-btn);border:1px solid var(--cv-divider);background:transparent;color:var(--cv-text-placeholder);font-size:var(--cv-text-caption);cursor:default;font-family:var(--cv-font-sans)}
.dual-panel{flex:1;display:flex;overflow:hidden}

/* ── Chat Panel ── */
.chat-panel{width:var(--cv-chat-width);min-width:var(--cv-chat-min-width);display:flex;flex-direction:column;border-right:1px solid var(--cv-divider);background:var(--cv-bg)}
.profile-card{padding:var(--cv-space-4) var(--cv-space-5);background:var(--cv-bubble-ai);border-bottom:1px solid var(--cv-divider);display:flex;align-items:center;gap:var(--cv-space-3);flex-shrink:0}
.profile-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#FFD4B8,#FF8C42);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.profile-name{font-size:var(--cv-text-body);font-weight:600;color:var(--cv-text);line-height:var(--cv-lh-sm)}
.profile-sub{font-size:var(--cv-text-caption);color:var(--cv-text-secondary);line-height:var(--cv-lh-caption);margin-top:2px}
.msg-stream{flex:1;overflow-y:auto;padding:var(--cv-space-4);display:flex;flex-direction:column;gap:var(--cv-space-4)}
.quick-bar{padding:var(--cv-space-2) var(--cv-space-4);background:var(--cv-surface);border-top:1px solid var(--cv-divider);display:flex;gap:var(--cv-space-2);flex-shrink:0}
.quick-btn{flex:1;height:36px;border-radius:var(--cv-radius-pill);border:1px solid var(--cv-divider);background:var(--cv-surface);color:var(--cv-text);font-size:var(--cv-text-body-sm);font-weight:400;cursor:pointer;font-family:var(--cv-font-sans);display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s}
.quick-btn.highlight{border:2px solid var(--cv-brand);font-weight:600;animation:pulse 2s infinite}
.quick-btn.sos{border:1px solid var(--cv-danger);background:var(--cv-danger);color:#fff}
.quick-btn:hover:not(.sos){background:var(--cv-bg)}

/* ── Bubbles ── */
.bubble-row{display:flex;gap:var(--cv-space-2);max-width:85%;align-items:flex-start;animation:fadeInUp .3s var(--cv-ease-enter) both}
.bubble-row.user{max-width:80%;margin-left:auto;flex-direction:row-reverse}
.avatar-cv{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#FF8C42,#FF6B35);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;color:#fff;font-weight:700;margin-top:2px}
.avatar-user{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#74b9ff,#0984e3);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;color:#fff;font-weight:700;margin-top:2px}
.bubble-ai{background:var(--cv-bubble-ai);border-radius:var(--cv-radius-bubble);border-bottom-left-radius:4px;padding:var(--cv-space-3) var(--cv-space-4);font-size:var(--cv-text-body-lg);line-height:var(--cv-lh-body);color:var(--cv-text);white-space:pre-wrap}
.bubble-user{background:var(--cv-bubble-user);border-radius:var(--cv-radius-bubble);border-bottom-right-radius:4px;padding:var(--cv-space-3) var(--cv-space-4);font-size:var(--cv-text-body-lg);line-height:var(--cv-lh-body);color:var(--cv-text)}
.sys-msg{display:flex;align-items:center;gap:var(--cv-space-2);font-size:var(--cv-text-body-sm);color:var(--cv-text-secondary);padding:2px 0;animation:fadeInUp .25s var(--cv-ease-enter) both}
.sys-dots{display:inline-flex;gap:2px;margin-left:4px}
.sys-dot{width:4px;height:4px;border-radius:50%;background:var(--cv-brand);animation:dotPulse 1.4s infinite}
.sys-dot:nth-child(2){animation-delay:.2s}.sys-dot:nth-child(3){animation-delay:.4s}
.sys-check{color:var(--cv-success);font-weight:600;margin-left:4px}
.notification{background:var(--cv-notification-danger-bg);border-radius:var(--cv-radius-btn);padding:var(--cv-space-3) var(--cv-space-4);font-size:var(--cv-text-body);color:var(--cv-notification-danger-text);font-weight:500;text-align:center;width:100%;animation:fadeInUp .3s var(--cv-ease-enter) both}

/* ── Score Card ── */
.score-card{background:var(--cv-surface);border-radius:var(--cv-radius-card);box-shadow:var(--cv-shadow-card);padding:var(--cv-space-4);max-width:85%;animation:fadeInUp .4s var(--cv-ease-enter) both}
.score-title{font-size:var(--cv-text-body-sm);font-weight:600;color:var(--cv-text);margin-bottom:var(--cv-space-3);display:flex;align-items:center;gap:var(--cv-space-1)}
.score-rows{display:flex;flex-direction:column;gap:var(--cv-space-2)}
.score-row{display:flex;align-items:center;gap:var(--cv-space-2)}
.score-icon{font-size:14px;width:20px;text-align:center}
.score-label{font-size:var(--cv-text-body-sm);color:var(--cv-text-secondary);width:64px;flex-shrink:0}
.score-bar-bg{flex:1;height:8px;border-radius:var(--cv-radius-progress);background:var(--cv-divider);overflow:hidden}
.score-bar{height:100%;border-radius:var(--cv-radius-progress);transition:width .6s var(--cv-ease-default)}
.score-val{font-size:var(--cv-text-body-sm);font-weight:700;width:28px;text-align:right}
.score-total{margin-top:var(--cv-space-3);padding-top:var(--cv-space-3);border-top:1px solid var(--cv-divider);display:flex;justify-content:space-between;align-items:baseline}
.score-total-label{font-size:var(--cv-text-body-sm);color:var(--cv-text-secondary)}
.score-total-val{font-size:var(--cv-text-h2);font-weight:700;color:var(--cv-brand)}

/* ── Map Panel ── */
.map-panel{flex:1;min-width:480px;position:relative;background:#F0F4F0;overflow:hidden}
.map-svg{width:100%;height:100%;display:block}
.map-event-btn{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:10}
.event-btn{background:var(--cv-surface);border:2px solid var(--cv-danger);border-radius:var(--cv-radius-btn);padding:10px 24px;font-size:var(--cv-text-body);font-weight:600;color:var(--cv-danger);cursor:pointer;font-family:var(--cv-font-sans);box-shadow:var(--cv-shadow-float);display:flex;align-items:center;gap:var(--cv-space-2);white-space:nowrap;transition:transform .15s}
.event-btn:hover{transform:scale(1.03)}.event-btn:active{transform:scale(.97)}
.event-btn.triggered{background:var(--cv-divider);border:1px solid var(--cv-text-placeholder);color:var(--cv-text-placeholder);cursor:default;box-shadow:none}
.map-attr{position:absolute;bottom:4px;right:8px;font-size:10px;color:var(--cv-text-placeholder);font-family:var(--cv-font-sans)}
.panel-divider{width:1px;background:var(--cv-divider);flex-shrink:0}

/* ── City Skyline ── */
.skyline{position:absolute;bottom:0;left:0;right:0;height:180px;overflow:hidden;pointer-events:none}
.skyline svg{width:100%;height:100%;display:block}

/* ── Responsive ── */
@media(max-width:900px){
  .chat-panel{min-width:280px;width:45%}
  .dual-panel{flex-direction:column}
  .chat-panel{width:100%;height:50%;border-right:none;border-bottom:1px solid var(--cv-divider)}
  .map-panel{min-width:0;height:50%}
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════
     PAGE 1: LANDING
     ═══════════════════════════════════════ -->
<div id="page-landing" class="page landing active">

  <!-- Hero -->
  <section class="hero" aria-label="CityVerse OS">
    <div style="text-align:center;z-index:1;padding:0 var(--cv-space-6)">
      <h1 class="hero-title">城市，应该为每个人而运转</h1>
      <p class="hero-sub">CityVerse OS — 让 AI 看见每一个被忽略的人</p>
      <div class="hero-cta">
        <button class="btn-primary" onclick="navigateTo('app')">体验 Demo</button>
      </div>
    </div>
    <!-- Skyline -->
    <div class="skyline">
      <svg viewBox="0 0 1440 180" fill="none" aria-hidden="true">
        <g opacity=".15">
          <rect x="80" y="40" width="50" height="140" rx="2" fill="#2D3436"/><rect x="140" y="60" width="35" height="120" rx="2" fill="#2D3436"/>
          <rect x="200" y="30" width="60" height="150" rx="2" fill="#2D3436"/><rect x="320" y="50" width="45" height="130" rx="2" fill="#2D3436"/>
          <rect x="400" y="20" width="55" height="160" rx="2" fill="#2D3436"/><rect x="500" y="45" width="40" height="135" rx="2" fill="#2D3436"/>
          <rect x="580" y="65" width="50" height="115" rx="2" fill="#2D3436"/><rect x="680" y="35" width="60" height="145" rx="2" fill="#2D3436"/>
          <rect x="780" y="55" width="45" height="125" rx="2" fill="#2D3436"/><rect x="860" y="25" width="55" height="155" rx="2" fill="#2D3436"/>
          <rect x="960" y="50" width="40" height="130" rx="2" fill="#2D3436"/><rect x="1040" y="40" width="50" height="140" rx="2" fill="#2D3436"/>
          <rect x="1120" y="60" width="45" height="120" rx="2" fill="#2D3436"/><rect x="1200" y="30" width="60" height="150" rx="2" fill="#2D3436"/>
          <rect x="1300" y="55" width="50" height="125" rx="2" fill="#2D3436"/><rect x="1380" y="45" width="40" height="135" rx="2" fill="#2D3436"/>
        </g>
        <g opacity=".1">
          <rect x="50" y="90" width="70" height="90" rx="2" fill="#2D3436"/><rect x="160" y="100" width="55" height="80" rx="2" fill="#2D3436"/>
          <rect x="250" y="80" width="80" height="100" rx="2" fill="#2D3436"/><rect x="370" y="95" width="60" height="85" rx="2" fill="#2D3436"/>
          <rect x="460" y="85" width="75" height="95" rx="2" fill="#2D3436"/><rect x="570" y="105" width="55" height="75" rx="2" fill="#2D3436"/>
          <rect x="660" y="90" width="65" height="90" rx="2" fill="#2D3436"/><rect x="760" y="100" width="50" height="80" rx="2" fill="#2D3436"/>
          <rect x="840" y="85" width="70" height="95" rx="2" fill="#2D3436"/><rect x="940" y="95" width="60" height="85" rx="2" fill="#2D3436"/>
          <rect x="1030" y="80" width="75" height="100" rx="2" fill="#2D3436"/><rect x="1140" y="100" width="55" height="80" rx="2" fill="#2D3436"/>
          <rect x="1230" y="90" width="65" height="90" rx="2" fill="#2D3436"/><rect x="1340" y="95" width="50" height="85" rx="2" fill="#2D3436"/>
        </g>
        <circle cx="230" cy="55" r="4" fill="#FF8C42" opacity=".3"/><circle cx="690" cy="60" r="4" fill="#4ECDC4" opacity=".3"/>
        <circle cx="890" cy="50" r="4" fill="#FF8C42" opacity=".3"/><circle cx="1230" cy="55" r="4" fill="#4ECDC4" opacity=".3"/>
        <rect x="0" y="175" width="1440" height="5" fill="#2D3436" opacity=".06"/>
      </svg>
    </div>
  </section>

  <!-- Mission -->
  <section class="mission" id="missionSection">
    <div class="mission-cards">
      <div class="data-card" data-card-idx="0"><div class="data-num"><span class="counter" data-target="8500">0</span><span>万</span></div><p class="data-desc">残障人士，但城市无障碍覆盖率不足 40%</p></div>
      <div class="data-card" data-card-idx="1"><div class="data-num"><span class="counter" data-target="2.6" data-decimal="1">0</span><span>亿</span></div><p class="data-desc">老年人，却很少被导航产品优先考虑</p></div>
      <div class="data-card" data-card-idx="2"><div class="data-num">0<span>个</span></div><p class="data-desc">导航 App 问过你：<strong style="color:var(--cv-text)">你方便吗？</strong></p></div>
    </div>
    <p class="mission-text" id="missionText">CityVerse 为每一个人规划路线，<br>而不仅仅是大多数人。</p>
  </section>

  <!-- CTA -->
  <section class="cta-section">
    <h2 class="cta-title">每个人都值得被城市温柔以待</h2>
    <button class="btn-primary" onclick="navigateTo('app')">立即体验 CityVerse</button>
    <p class="cta-foot">TRAE AI 创造力大赛参赛作品</p>
  </section>
</div>

<!-- ═══════════════════════════════════════
     PAGE 2: MAIN APP
     ═══════════════════════════════════════ -->
<div id="page-app" class="page main-app">
  <!-- Top Nav -->
  <nav class="top-nav">
    <div class="nav-logo">
      <div class="nav-icon">📍</div>

          <rect x="500" y="420" width="90" height="40" rx="4"/><rect x="100" y="400" width="70" height="55" rx="4"/>

<script>
/* ═══════════════════════════════════════════════════════
   CityVerse OS — Complete Application Logic
   ═══════════════════════════════════════════════════════ */
(function() {
'use strict';

/* ── DATA ── */
const POIS = [
  { id:'home', name:'张奶奶家', type:'home', coords:[116.47,39.99], icon:'🏠', color:'#2ECC71' },
  { id:'hospital', name:'协和医院东院', type:'hospital', coords:[116.42,39.91], icon:'🏥', color:'#E74C3C', has_ramp:true, entrance:'东侧' },
  { id:'wangjing_metro', name:'望京站', type:'metro', coords:[116.48,39.99], icon:'🚇', color:'#3498DB', has_elevator:true },
  { id:'futong_metro', name:'阜通站', type:'metro', coords:[116.49,39.98], icon:'🚇', color:'#3498DB', has_elevator:true },
  { id:'elevator_1', name:'望京站直梯', type:'elevator', coords:[116.481,39.991], icon:'♿', color:'#2ECC71', status:'normal' },
  { id:'shelter_1', name:'望京SOHO', type:'shelter', coords:[116.475,39.985], icon:'☂️', color:'#4ECDC4', hours:'09:00-21:00' },
  { id:'shelter_2', name:'凯德MALL', type:'shelter', coords:[116.46,39.97], icon:'☂️', color:'#4ECDC4', hours:'10:00-22:00' },
  { id:'incident_flood', name:'望京西路积水点', type:'incident', coords:[116.465,39.975], icon:'⚠️', color:'#E74C3C' },
];

const ROUTES = [
  { id:'A', name:'路线 A', color:'#999999', width:3, time:'15 分钟', distance:'2.1 km', accessible:false, recommended:false,
    warning:'望京站缺少无障碍电梯',
    points:[[116.47,39.99],[116.475,39.985],[116.48,39.99],[116.475,39.97],[116.46,39.95],[116.44,39.93],[116.42,39.91]] },
  { id:'B', name:'路线 B', color:'#FF8C42', width:5, time:'18 分钟', distance:'2.4 km', accessible:true, recommended:true,
    points:[[116.47,39.99],[116.48,39.99],[116.481,39.991],[116.49,39.98],[116.475,39.985],[116.46,39.97],[116.44,39.94],[116.42,39.91]] },
  { id:'C', name:'路线 C', color:'#CCCCCC', width:3, time:'25 分钟', distance:'3.2 km', accessible:true, recommended:false,
    points:[[116.47,39.99],[116.475,39.985],[116.46,39.98],[116.45,39.96],[116.44,39.94],[116.43,39.92],[116.42,39.91]] },
];

const REPLAN_ROUTE = {
  id:"B'", name:'新路线', color:'#FF8C42', width:5, time:'20 分钟', distance:'2.6 km', accessible:true, recommended:true,
  points:[[116.47,39.99],[116.48,39.99],[116.49,39.98],[116.495,39.975],[116.485,39.965],[116.46,39.97],[116.44,39.94],[116.42,39.91]],
};

const EQUITY_SCORES = [
  { label:'无障碍度', icon:'♿', value:85 },
  { label:'安全度', icon:'🛡️', value:90 },
  { label:'经济度', icon:'💰', value:75 },
  { label:'健康度', icon:'💚', value:80 },
];

const AGENT_STEPS = [
  { id:'planner', icon:'🧠', name:'Planner', task:'分析您的需求', durationMs:800 },
  { id:'city', icon:'🏙️', name:'City Agent', task:'查询协和医院信息', durationMs:800 },
  { id:'safety', icon:'🛡️', name:'Safety Agent', task:'评估雨天出行风险', durationMs:800 },
  { id:'access', icon:'♿', name:'Accessibility Agent', task:'检查沿途无障碍设施', durationMs:800 },
  { id:'action', icon:'🚀', name:'Action Agent', task:'生成出行方案', durationMs:800 },
];

const REPLAN_AGENT_STEPS = [
  { id:'safety_re', icon:'🛡️', name:'Safety Agent', task:'重新评估路线安全', durationMs:600 },
  { id:'access_re', icon:'♿', name:'Accessibility Agent', task:'寻找替代无障碍路线', durationMs:600 },
  { id:'action_re', icon:'🚀', name:'Action Agent', task:'生成新路线', durationMs:600 },
];

const QUICK_ACTIONS = [
  { id:'go_hospital', icon:'🏥', label:'去医院' },
  { id:'go_home', icon:'🏠', label:'回家' },
  { id:'sos', icon:'🆘', label:'SOS' },
  { id:'replan_route', icon:'🔄', label:'重规划' },
];

/* ── MAP COORDINATE TRANSFORM ── */
const BOUNDS = { minLon:116.40, maxLon:116.51, minLat:39.89, maxLat:40.01, w:800, h:600 };
function toSVG(lon, lat) {
  return [
    ((lon - BOUNDS.minLon) / (BOUNDS.maxLon - BOUNDS.minLon)) * BOUNDS.w,
    ((BOUNDS.maxLat - lat) / (BOUNDS.maxLat - BOUNDS.minLat)) * BOUNDS.h
  ];
}
function routeToPath(points) {
  return points.map((p, i) => {
    const [x, y] = toSVG(p[0], p[1]);
    return (i === 0 ? 'M ' : ' L ') + x.toFixed(1) + ' ' + y.toFixed(1);
  }).join('');
}

/* ── STATE ── */
let state = {
  scenario: 'initial',
  messages: [],
  agentStates: [],
  visiblePoiIds: new Set(),
  visibleRouteIds: new Set(),
  highlightedRouteId: null,
  showIncident: false,
  showNavigation: false,
  showAccessibility: false,
  eventTriggered: false,
  showEventButton: false,
  allRoutes: [...ROUTES],
  highlightAction: null,
};
const timeouts = [];

function addTimeout(fn, ms) {
  const id = setTimeout(fn, ms);
  timeouts.push(id);
  return id;
}

/* ── ROUTING ── */
function navigateTo(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  window.location.hash = page === 'app' ? '/app' : '/';
  if (page === 'app' && state.scenario === 'initial') {
    startScenario();
  }
}
window.navigateTo = navigateTo;

// Hash routing
function handleHash() {
  const hash = window.location.hash.replace('#', '');
  if (hash === '/app' || hash === 'app') {
    navigateTo('app');
  } else {
    navigateTo('landing');
  }
}

/* ── COUNTER ANIMATION ── */
function animateCounter(el, target, duration, decimals) {
  const start = performance.now();
  function update(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const value = eased * target;
    el.textContent = decimals > 0 ? value.toFixed(decimals) : Math.round(value);
    if (progress < 1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

/* ── LANDING: SCROLL OBSERVER ── */
const missionObs = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      // Animate data cards
      document.querySelectorAll('.data-card').forEach(c => c.classList.add('visible'));
      // Animate mission text
      document.getElementById('missionText').classList.add('visible');
      // Count up
      document.querySelectorAll('.counter').forEach(el => {
        const target = parseFloat(el.dataset.target);
        const dec = parseInt(el.dataset.decimal || '0');
        animateCounter(el, target, 800, dec);
      });
      missionObs.unobserve(e.target);
    }
  });
}, { threshold: 0.3 });
missionObs.observe(document.getElementById('missionSection'));

/* ── RENDER: MESSAGES ── */
const msgStream = document.getElementById('msgStream');

function renderMessages() {
  // Only append new messages (don't re-render all)
  const existing = msgStream.querySelectorAll('[data-msg-id]');
  const existingIds = new Set(Array.from(existing).map(e => e.dataset.msgId));

  state.messages.forEach(msg => {
    if (existingIds.has(msg.id)) return;
    const el = createMessageEl(msg);
    if (el) msgStream.appendChild(el);
  });

  // Render agent states
  renderAgentStates();
  scrollToBottom();
}

function createMessageEl(msg) {
  let el;
  switch (msg.role) {
    case 'assistant':
      el = document.createElement('div');
      el.className = 'bubble-row';
      el.dataset.msgId = msg.id;
      el.innerHTML = `<div class="avatar-cv">CV</div><div class="bubble-ai">${formatContent(msg.content)}</div>`;
      break;
    case 'user':
      el = document.createElement('div');
      el.className = 'bubble-row user';
      el.dataset.msgId = msg.id;
      el.innerHTML = `<div class="avatar-user">张</div><div class="bubble-user">${msg.content}</div>`;
      break;
    case 'notification':
      el = document.createElement('div');
      el.className = 'notification';
      el.dataset.msgId = msg.id;
      el.textContent = msg.content;
      el.setAttribute('role', 'alert');
      break;
    case 'equity_card':
      el = document.createElement('div');
      el.className = 'score-card';
      el.dataset.msgId = msg.id;
      el.innerHTML = buildScoreCardHTML(msg.scores || EQUITY_SCORES, msg.totalScore || 82.5);
      // Animate bars after append
      setTimeout(() => {
        el.querySelectorAll('.score-bar').forEach(bar => {
          bar.style.width = bar.dataset.width + '%';
        });
      }, 100);
      break;
    case 'action_button':
      el = document.createElement('div');
      el.dataset.msgId = msg.id;
      el.innerHTML = `<button class="btn-action" onclick="handleActionButton('${msg.actionNextStep || ''}')">✅ ${msg.actionLabel}</button>`;
      break;
    default:
      return null;
  }
  return el;
}

function formatContent(text) {
  return text.split('**').map((part, i) =>
    i % 2 === 1 ? '<strong>' + part + '</strong>' : part
  ).join('');
}

function buildScoreCardHTML(scores, total) {
  const rows = scores.map(s => {
    const color = s.value >= 80 ? 'var(--cv-success)' : s.value >= 60 ? 'var(--cv-warning)' : 'var(--cv-danger)';
    return `<div class="score-row">
      <span class="score-icon">${s.icon}</span>
      <span class="score-label">${s.label}</span>
      <div class="score-bar-bg"><div class="score-bar" data-width="${s.value}" style="width:0;background:${color}"></div></div>
      <span class="score-val" style="color:${color}">${s.value}</span>
    </div>`;
  }).join('');
  return `<div class="score-title">📊 路线 B 公平性评分</div>
    <div class="score-rows">${rows}</div>
    <div class="score-total"><span class="score-total-label">综合评分</span><span class="score-total-val">${total}</span></div>`;
}

/* ── RENDER: AGENT STATES ── */
function renderAgentStates() {
  // Remove old agent indicators
  msgStream.querySelectorAll('.agent-indicator-group').forEach(e => e.remove());

  if (state.agentStates.length === 0) return;

  const group = document.createElement('div');
  group.className = 'agent-indicator-group';
  group.style.cssText = 'display:flex;flex-direction:column;gap:4px;padding:var(--cv-space-2) 0';

  state.agentStates.forEach(as => {
    const div = document.createElement('div');
    div.className = 'sys-msg';
    div.innerHTML = `<span style="font-size:16px">${as.step.icon}</span>
      <span style="font-weight:500">${as.step.name}</span>
      <span style="color:var(--cv-text-placeholder)">·</span>
      <span>${as.step.task}</span>
      ${as.status === 'loading'
        ? '<span class="sys-dots"><span class="sys-dot"></span><span class="sys-dot"></span><span class="sys-dot"></span></span>'
        : '<span class="sys-check">✓</span>'}`;
    group.appendChild(div);
  });

  msgStream.appendChild(group);
  scrollToBottom();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    msgStream.scrollTop = msgStream.scrollHeight;
  });
}

/* ── RENDER: QUICK ACTIONS ── */
function renderQuickActions() {
  const bar = document.getElementById('quickBar');
  bar.innerHTML = '';
  QUICK_ACTIONS.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    if (a.id === state.highlightAction) btn.classList.add('highlight');
    if (a.id === 'sos') btn.classList.add('sos');
    btn.innerHTML = `<span>${a.icon}</span><span>${a.label}</span>`;
    btn.onclick = () => handleQuickAction(a.id);
    bar.appendChild(btn);
  });
}

/* ── RENDER: MAP ── */
function renderMap() {
  renderRoutes();
  renderPOIs();
  renderEndpoints();
  renderAccessibility();
  renderIncident();
  // Event button
  const btnContainer = document.getElementById('mapEventBtn');
  btnContainer.style.display = state.showEventButton ? 'block' : 'none';
  const btn = document.getElementById('eventTriggerBtn');
  if (state.eventTriggered) {
    btn.className = 'event-btn triggered';
    btn.textContent = '✓ 已处理';
    btn.disabled = true;
    btn.onclick = null;
  }
}

function renderRoutes() {
  const layer = document.getElementById('layerRoutes');
  layer.innerHTML = '';

  state.allRoutes.forEach(route => {
    if (!state.visibleRouteIds.has(route.id)) return;
    const pathD = routeToPath(route.points);
    const isHighlighted = route.id === state.highlightedRouteId;
    const w = isHighlighted ? route.width : route.width * 0.7;
    const opacity = isHighlighted ? 1 : 0.5;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', pathD);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', route.color);
    path.setAttribute('stroke-width', w);
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('opacity', opacity);
    path.setAttribute('stroke-dasharray', '1200');
    path.setAttribute('stroke-dashoffset', '1200');
    path.style.animation = `routeDraw 1.5s ${isHighlighted ? '.3s' : '0s'} ease-out forwards`;
    layer.appendChild(path);
  });

  // Route labels
  const labelLayer = document.getElementById('layerRouteLabels');
  labelLayer.innerHTML = '';
  state.allRoutes.forEach(route => {
    if (!state.visibleRouteIds.has(route.id) || route.points.length < 2) return;
    const midIdx = Math.floor(route.points.length / 2);
    const [x, y] = toSVG(route.points[midIdx][0], route.points[midIdx][1]);

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.style.animation = 'fadeIn .3s .8s both';
    g.innerHTML = `<rect x="${x-24}" y="${y-18}" width="48" height="18" rx="9" fill="${route.recommended ? '#FF8C42' : '#fff'}" stroke="${route.color}" stroke-width="1"/>
      <text x="${x}" y="${y-8}" text-anchor="middle" font-size="9" font-weight="600" fill="${route.recommended ? '#fff' : route.color}">${route.time}</text>`;
    labelLayer.appendChild(g);
  });
}

function renderPOIs() {
  const layer = document.getElementById('layerPOIs');
  layer.innerHTML = '';

  POIS.filter(p => p.type !== 'incident').forEach(poi => {
    if (!state.visiblePoiIds.has(poi.id)) return;
    const [cx, cy] = toSVG(poi.coords[0], poi.coords[1]);
    const isLarge = poi.type === 'home' || poi.type === 'hospital';
    const r = isLarge ? 16 : 12;
    const fontSize = isLarge ? 14 : 11;
    const labelY = cy + (isLarge ? 28 : 22);

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.style.animation = 'fadeIn .3s var(--cv-ease-spring) both';
    g.style.cursor = 'pointer';
    g.innerHTML = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${poi.color}" stroke-width="2.5" filter="url(#markerShadow)"/>
      <text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="central" font-size="${fontSize}px">${poi.icon}</text>
      <text x="${cx}" y="${labelY}" text-anchor="middle" font-size="10" fill="var(--cv-text)" font-weight="500">${poi.name}</text>`;
    layer.appendChild(g);
  });
}

function renderEndpoints() {
  const layer = document.getElementById('layerEndpoints');
  if (!state.showNavigation) { layer.style.display = 'none'; return; }
  layer.style.display = '';

  const home = POIS.find(p => p.id === 'home');
  const hosp = POIS.find(p => p.id === 'hospital');
  if (!home || !hosp) return;
  const [hx, hy] = toSVG(home.coords[0], home.coords[1]);
  const [ex, ey] = toSVG(hosp.coords[0], hosp.coords[1]);

  layer.innerHTML = `<circle cx="${hx}" cy="${hy}" r="6" fill="var(--cv-success)" stroke="#fff" stroke-width="2"/>
    <text x="${hx}" y="${hy-14}" text-anchor="middle" font-size="10" fill="var(--cv-success)" font-weight="600">起点</text>
    <circle cx="${ex}" cy="${ey}" r="6" fill="var(--cv-danger)" stroke="#fff" stroke-width="2"/>`;
}

function renderAccessibility() {
  const layer = document.getElementById('layerAccessibility');
  if (!state.showAccessibility || !state.visiblePoiIds.has('elevator_1')) { layer.style.display = 'none'; return; }
  layer.style.display = '';

  const elev = POIS.find(p => p.id === 'elevator_1');
  if (!elev) return;
  const [x, y] = toSVG(elev.coords[0], elev.coords[1]);

  layer.innerHTML = `<g style="animation:fadeIn .3s .5s both">
    <rect x="${x+14}" y="${y-8}" width="58" height="16" rx="8" fill="var(--cv-success)" opacity=".9"/>
    <text x="${x+43}" y="${y+1}" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">无障碍 ✓</text>
  </g>`;
}

function renderIncident() {
  const layer = document.getElementById('layerIncident');
  if (!state.showIncident) { layer.style.display = 'none'; return; }
  layer.style.display = '';

  const inc = POIS.find(p => p.id === 'incident_flood');
  if (!inc) return;
  const [cx, cy] = toSVG(inc.coords[0], inc.coords[1]);

  layer.innerHTML = `<circle cx="${cx}" cy="${cy}" r="18" fill="none" stroke="#3498DB" stroke-width="2" opacity=".4">
    <animate attributeName="r" from="12" to="30" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from=".6" to="0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="${cx}" cy="${cy}" r="10" fill="none" stroke="#3498DB" stroke-width="1.5" opacity=".3">
    <animate attributeName="r" from="8" to="22" dur="1.5s" begin=".5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from=".4" to="0" dur="1.5s" begin=".5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="${cx}" cy="${cy}" r="12" fill="#fff" stroke="#3498DB" stroke-width="2.5" filter="url(#markerShadow)"/>
  <text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="central" font-size="12px">⚠️</text>
  <text x="${cx}" y="${cy+24}" text-anchor="middle" font-size="10" fill="var(--cv-text)" font-weight="500">${inc.name}</text>`;
}

/* ── SCENARIO STATE MACHINE ── */
function startScenario() {
  state.scenario = 'initial';
  state.highlightAction = null;
  renderQuickActions();

  addTimeout(() => {
    // Step 1: Greeting
    state.messages = [
      { id:'greet-1', role:'assistant', content:'张奶奶您好 ☀️ 我是 CityVerse，您的城市出行助手。\n今天北京有中雨 🌧️，路面可能湿滑。\n您今天有出行计划吗？' }
    ];
    state.visiblePoiIds = new Set(['home']);
    state.scenario = 'greeting';
    state.highlightAction = 'go_hospital';
    renderMessages();
    renderMap();
    renderQuickActions();
  }, 1000);
}

function handleQuickAction(actionId) {
  if (actionId === 'go_hospital' && state.scenario === 'greeting') {
    executeUserRequest();
  }
}
window.handleQuickAction = handleQuickAction;

function executeUserRequest() {
  // Add user message
  state.messages.push({ id:'req-1', role:'user', content:'我要去协和医院' });
  state.highlightAction = null;
  state.scenario = 'user_request';
  renderMessages();
  renderQuickActions();

  addTimeout(() => {
    // AI confirmation
    state.messages.push({ id:'req-2', role:'assistant', content:'好的，我来帮您规划去协和医院东院的路线。\n让我先看看今天的天气和路况...' });
    state.visiblePoiIds.add('hospital');
    renderMessages();
    renderMap();

    // Start agent work
    addTimeout(() => {
      state.scenario = 'agent_work';
      let delay = 0;

      AGENT_STEPS.forEach((agent, idx) => {
        // Show loading
        addTimeout(() => {
          state.agentStates.push({ step: agent, status: 'loading' });
          state.messages.push({ id:'agent-'+(idx+1), role:'system', content: agent.icon + ' ' + agent.name + ' · ' + agent.task + '...' });
          renderMessages();
        }, delay);

        // Mark done
        delay += agent.durationMs;
        addTimeout(() => {
          state.agentStates = state.agentStates.map(s =>
            s.step.id === agent.id ? { ...s, status: 'done' } : s
          );
          renderAgentStates();
        }, delay);

        delay += 200;
      });

      // Draw routes
      addTimeout(() => {
        ['wangjing_metro', 'futong_metro', 'elevator_1'].forEach(id => state.visiblePoiIds.add(id));
        renderMap();
      }, delay - 600);

      addTimeout(() => { state.visibleRouteIds.add('A'); renderMap(); }, delay - 300);
      addTimeout(() => { state.visibleRouteIds.add('B'); renderMap(); }, delay);
      addTimeout(() => { state.visibleRouteIds.add('C'); renderMap(); }, delay + 300);

      // Recommendation
      addTimeout(() => {
        state.agentStates = [];
        state.scenario = 'recommendation';

        state.messages.push({
          id:'rec-1', role:'assistant',
          content:'我为您找到了 3 条路线：\n\n**路线 A**：最短，15 分钟，但望京站缺少无障碍电梯 ⚠️\n**路线 B** ✅ 推荐：18 分钟，全程无障碍通道，沿途有 2 个避雨休息点\n**路线 C**：25 分钟，绕行较多\n\n建议您选择路线 B，虽然多 3 分钟，但对轮椅出行最安全。'
        });
        state.messages.push({ id:'rec-2', role:'equity_card', content:'', scores: EQUITY_SCORES, totalScore: 82.5 });
        state.messages.push({ id:'rec-3', role:'action_button', content:'', actionLabel:'选择路线 B 出发', actionNextStep:'navigate' });

        state.highlightedRouteId = 'B';
        ['shelter_1', 'shelter_2'].forEach(id => state.visiblePoiIds.add(id));
        state.showAccessibility = true;
        state.showEventButton = true;

        renderMessages();
        renderMap();
      }, delay + 800);

    }, 500);
  }, 500);
}

function executeNavigate() {
  state.messages.push({
    id:'nav-1', role:'assistant',
    content:'出发！第一步：从您家出发，乘坐无障碍电梯到 1 楼。\n望京站有直梯，入口在站厅东侧。'
  });
  state.scenario = 'navigate';
  state.showNavigation = true;
  renderMessages();
  renderMap();
}

function executeIncident() {
  state.messages.push({ id:'inc-1', role:'notification', content:'⚠️ 事件：前方望京西路出现路面积水' });
  state.showIncident = true;
  state.eventTriggered = true;
  state.scenario = 'incident';
  state.showEventButton = false;
  renderMessages();
  renderMap();

  addTimeout(() => {
    state.messages.push({
      id:'inc-2', role:'assistant',
      content:'注意！前方望京西路有积水，轮椅通行有风险。\n正在为您重新规划路线...'
    });
    renderMessages();
  }, 1000);

  // Replan
  addTimeout(() => {
    state.scenario = 'replan';
    let delay = 0;

    REPLAN_AGENT_STEPS.forEach((agent, idx) => {
      addTimeout(() => {
        state.agentStates.push({ step: agent, status: 'loading' });
        state.messages.push({ id:'replan-'+(idx+1), role:'system', content: agent.icon + ' ' + agent.name + ' · ' + agent.task + '...' });
        renderMessages();
      }, delay);

      delay += agent.durationMs;
      addTimeout(() => {
        state.agentStates = state.agentStates.map(s =>
          s.step.id === agent.id ? { ...s, status: 'done' } : s
        );
        renderAgentStates();
      }, delay);
      delay += 200;
    });

    // Show new route
    addTimeout(() => {
      state.agentStates = [];
      state.highlightedRouteId = null;
      state.visibleRouteIds = new Set();
      renderAgentStates();
      renderMap();

      addTimeout(() => {
        state.allRoutes.push(REPLAN_ROUTE);
        state.visibleRouteIds = new Set(["B'"]);
        state.highlightedRouteId = "B'";

        state.messages.push({
          id:'replan-4', role:'assistant',
          content:'已为您重新规划！\n绕行阜通东大街，多走约 200 米，但路面干燥安全。\n新路线全程无障碍，请放心。'
        });
        state.messages.push({ id:'replan-5', role:'action_button', content:'', actionLabel:'继续前往', actionNextStep:'arrive' });

        renderMessages();
        renderMap();
      }, 500);
    }, delay + 300);
  }, 1500);
}

function executeArrive() {
  state.messages.push({
    id:'arr-1', role:'assistant',
    content:'您已到达协和医院东院 🏥\n医院入口在东侧，有无障碍坡道。\n祝您复查顺利，张奶奶！💚'
  });
  state.scenario = 'arrive';
  renderMessages();
}

function handleActionButton(nextStep) {
  if (nextStep === 'navigate') executeNavigate();
  else if (nextStep === 'arrive') executeArrive();
}
window.handleActionButton = handleActionButton;

function handleTriggerEvent() {
  if (state.scenario === 'navigate' && !state.eventTriggered) {
    executeIncident();
  }
}
window.handleTriggerEvent = handleTriggerEvent;

/* ── INIT ── */
renderQuickActions();
handleHash();
window.addEventListener('hashchange', handleHash);

})();
</script>
</body>
</html>
