<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="screen-orientation" content="landscape">
    <meta name="x5-orientation" content="landscape">
    <title>日历版月度课程表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            padding: 30px;
            background: linear-gradient(145deg, #e8eaed 0%, #f5f7fa 50%, #eef2f7 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -20%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(100, 181, 246, 0.15) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(162, 155, 254, 0.12) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .header-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        select {
            padding: 10px 15px;
            font-size: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: #ffffff;
            box-shadow: 
                6px 6px 12px rgba(0, 0, 0, 0.08),
                -6px -6px 12px rgba(255, 255, 255, 0.8);
            outline: none;
            transform: translateY(-6px);
            transition: all 0.25s ease;
        }
        select:hover {
            transform: translateY(-9px);
            box-shadow: 
                8px 8px 16px rgba(0, 0, 0, 0.1),
                -8px -8px 16px rgba(255, 255, 255, 0.9);
        }
        select:focus {
            transform: translateY(-2px);
            box-shadow: 
                4px 4px 8px rgba(0, 0, 0, 0.06),
                -4px -4px 8px rgba(255, 255, 255, 0.95),
                inset 2px 2px 5px rgba(0, 0, 0, 0.05),
                inset -2px -2px 5px rgba(255, 255, 255, 0.8);
        }

        .month-picker {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            padding: 8px 28px 8px 16px;
            min-width: 130px;
            text-align: center;
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 
                3px 3px 8px rgba(0, 0, 0, 0.06),
                -3px -3px 8px rgba(255, 255, 255, 0.8);
            transform: translateY(-3px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            appearance: none;
            cursor: pointer;
            position: relative;
            transition: all 0.25s ease;
        }
        .month-picker::after {
            content: '▼';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: #667eea;
            pointer-events: none;
            font-weight: 300;
        }
        .month-picker:hover {
            color: #667eea;
            transform: translateY(-6px);
            box-shadow: 
                5px 5px 12px rgba(0, 0, 0, 0.08),
                -5px -5px 12px rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.8);
        }
        .month-picker:hover::after {
            color: #667eea;
        }
        .month-picker:focus {
            outline: none;
            transform: translateY(-2px);
            box-shadow: 
                2px 2px 6px rgba(0, 0, 0, 0.05),
                -2px -2px 6px rgba(255, 255, 255, 0.9),
                inset 2px 2px 4px rgba(0, 0, 0, 0.04),
                inset -2px -2px 4px rgba(255, 255, 255, 0.8);
        }

        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        button:hover::before {
            left: 100%;
        }

        button {
            background: linear-gradient(145deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            transform: translateY(-6px);
            box-shadow: 
                7px 7px 16px rgba(102, 126, 234, 0.4),
                -6px -6px 14px rgba(255, 255, 255, 0.6);
        }
        button:hover {
            transform: translateY(-9px);
            box-shadow: 
                9px 9px 20px rgba(102, 126, 234, 0.5),
                -8px -8px 18px rgba(255, 255, 255, 0.7);
        }
        button:active {
            transform: translateY(-2px);
            box-shadow: 
                3px 3px 8px rgba(102, 126, 234, 0.3),
                -3px -3px 8px rgba(255, 255, 255, 0.5),
                inset 2px 2px 4px rgba(102, 126, 234, 0.3),
                inset -2px -2px 4px rgba(255, 255, 255, 0.5);
        }

        .reset-btn {
            background: linear-gradient(145deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 
                6px 6px 14px rgba(240, 147, 251, 0.4),
                -6px -6px 14px rgba(255, 255, 255, 0.6);
        }
        .reset-btn:hover {
            box-shadow: 
                8px 8px 20px rgba(240, 147, 251, 0.5),
                -8px -8px 20px rgba(255, 255, 255, 0.7);
        }
        .reset-btn:active {
            box-shadow: 
                3px 3px 8px rgba(240, 147, 251, 0.3),
                -3px -3px 8px rgba(255, 255, 255, 0.5),
                inset 2px 2px 4px rgba(240, 147, 251, 0.3),
                inset -2px -2px 4px rgba(255, 255, 255, 0.5);
        }

        .jump-btn {
            background: linear-gradient(145deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 
                6px 6px 14px rgba(79, 172, 254, 0.4),
                -6px -6px 14px rgba(255, 255, 255, 0.6);
        }
        .jump-btn:hover {
            box-shadow: 
                8px 8px 20px rgba(79, 172, 254, 0.5),
                -8px -8px 20px rgba(255, 255, 255, 0.7);
        }
        .jump-btn:active {
            box-shadow: 
                3px 3px 8px rgba(79, 172, 254, 0.3),
                -3px -3px 8px rgba(255, 255, 255, 0.5),
                inset 2px 2px 4px rgba(79, 172, 254, 0.3),
                inset -2px -2px 4px rgba(255, 255, 255, 0.5);
        }

        .import-btn {
            background: linear-gradient(145deg, #43e97b 0%, #38f9d7 100%);
            color: #000;
            box-shadow: 
                6px 6px 14px rgba(67, 233, 123, 0.4),
                -6px -6px 14px rgba(255, 255, 255, 0.6);
        }
        .import-btn:hover {
            box-shadow: 
                8px 8px 20px rgba(67, 233, 123, 0.5),
                -8px -8px 20px rgba(255, 255, 255, 0.7);
        }
        .import-btn:active {
            box-shadow: 
                3px 3px 8px rgba(67, 233, 123, 0.3),
                -3px -3px 8px rgba(255, 255, 255, 0.5),
                inset 2px 2px 4px rgba(67, 233, 123, 0.3),
                inset -2px -2px 4px rgba(255, 255, 255, 0.5);
        }

        .month-nav button {
            width: 42px;
            height: 42px;
            font-size: 20px;
            background: linear-gradient(145deg, #ffffff 0%, #f0f2f5 100%);
            color: #666;
            box-shadow: 
                4px 4px 10px rgba(0, 0, 0, 0.08),
                -4px -4px 10px rgba(255, 255, 255, 0.8);
        }
        .month-nav button:hover {
            transform: translateY(-9px);
            box-shadow: 
                7px 7px 16px rgba(0, 0, 0, 0.12),
                -6px -6px 14px rgba(255, 255, 255, 0.9);
            color: #667eea;
        }
        .month-nav button:active {
            transform: translateY(-2px);
            box-shadow: 
                2px 2px 6px rgba(0, 0, 0, 0.06),
                -2px -2px 6px rgba(255, 255, 255, 0.9),
                inset 2px 2px 4px rgba(0, 0, 0, 0.05),
                inset -2px -2px 4px rgba(255, 255, 255, 0.8);
        }
        .month-nav-btn {
            width: 42px;
            height: 42px;
            font-size: 20px;
            background: linear-gradient(145deg, #ffffff 0%, #f0f2f5 100%);
            color: #666;
            box-shadow: 
                4px 4px 10px rgba(0, 0, 0, 0.08),
                -4px -4px 10px rgba(255, 255, 255, 0.8);
        }
        .month-nav-btn:hover {
            transform: translateY(-9px);
            box-shadow: 
                7px 7px 16px rgba(0, 0, 0, 0.12),
                -6px -6px 14px rgba(255, 255, 255, 0.9);
            color: #667eea;
        }
        .month-nav-btn:active {
            transform: translateY(-2px);
            box-shadow: 
                2px 2px 6px rgba(0, 0, 0, 0.06),
                -2px -2px 6px rgba(255, 255, 255, 0.9),
                inset 2px 2px 4px rgba(0, 0, 0, 0.05),
                inset -2px -2px 4px rgba(255, 255, 255, 0.8);
        }

        #fileInput {
            display: none;
        }

        .panels-wrap {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
        }
        .panels-wrap > div {
            flex: 1;
            min-width: 0;
        }

        .today-panel {
            background: linear-gradient(145deg, #fff9f0 0%, #fff3e0 100%);
            border-radius: 20px;
            padding: 20px 24px;
            box-shadow: 
                14px 14px 32px rgba(255, 183, 77, 0.18),
                -12px -12px 28px rgba(255, 255, 255, 0.9),
                inset 1px 1px 2px rgba(255, 255, 255, 0.9);
            position: relative;
            overflow: hidden;
            transform: translateY(-14px);
            transition: all 0.25s ease;
        }
        .today-panel:hover {
            transform: translateY(-17px);
            box-shadow: 
                16px 16px 36px rgba(255, 183, 77, 0.22),
                -14px -14px 32px rgba(255, 255, 255, 0.95),
                inset 1px 1px 2px rgba(255, 255, 255, 0.9);
        }
        .today-panel::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(255, 183, 77, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }
        .today-panel h3 {
            color: #e65100;
            margin-bottom: 15px;
            font-size: 17px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }
        .today-task-group {
            display: flex;
            flex-direction: column;
            gap: 18px;
            position: relative;
            z-index: 1;
        }
        .today-task-col {
            flex: 1;
            min-width: 180px;
        }
        .today-task-col h4 {
            font-size: 14px;
            color: #ef6c00;
            margin-bottom: 8px;
            font-weight: 500;
            padding: 6px 10px;
            background: rgba(255, 183, 77, 0.1);
            border-radius: 8px;
            display: inline-block;
        }
        .today-task-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            margin: 4px 0;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 10px;
            box-shadow: 
                2px 2px 6px rgba(255, 183, 77, 0.1),
                -2px -2px 6px rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }
        .today-task-item:hover {
            transform: translateX(5px);
            box-shadow: 
                4px 4px 10px rgba(255, 183, 77, 0.15),
                -4px -4px 10px rgba(255, 255, 255, 0.9);
        }
        .today-task-done {
            text-decoration: line-through;
            color: #aaa;
        }
        .today-empty {
            color: #bbb;
            font-size: 14px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 8px;
        }
        .today-classroom-badge {
            display: inline-flex;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #ff7043 0%, #f4511e 100%);
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: auto;
            box-shadow: 
                0 2px 4px rgba(244, 81, 30, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .current-class-panel {
            background: linear-gradient(145deg, #fff5f5 0%, #ffebee 100%);
            border-radius: 20px;
            padding: 20px 24px;
            box-shadow: 
                14px 14px 32px rgba(244, 67, 54, 0.18),
                -12px -12px 28px rgba(255, 255, 255, 0.9),
                inset 1px 1px 2px rgba(255, 255, 255, 0.9);
            position: relative;
            overflow: hidden;
            transform: translateY(-14px);
            transition: all 0.25s ease;
        }
        .current-class-panel:hover {
            transform: translateY(-17px);
            box-shadow: 
                16px 16px 36px rgba(244, 67, 54, 0.22),
                -14px -14px 32px rgba(255, 255, 255, 0.95),
                inset 1px 1px 2px rgba(255, 255, 255, 0.9);
        }
        .current-class-panel::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(244, 67, 54, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }
        .current-class-panel h3 {
            color: #c62828;
            margin-bottom: 15px;
            font-size: 17px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }
        .current-class-info {
            font-size: 16px;
            line-height: 1.9;
            position: relative;
            z-index: 1;
        }
        .current-class-title {
            font-size: 20px;
            font-weight: bold;
            color: #b71c1c;
            margin-bottom: 10px;
            padding: 12px 16px;
            background: rgba(244, 67, 54, 0.08);
            border-radius: 12px;
            box-shadow: 
                3px 3px 8px rgba(244, 67, 54, 0.1),
                -3px -3px 8px rgba(255, 255, 255, 0.8);
        }
        .current-class-time {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 8px;
            background: linear-gradient(135deg, #ef5350 0%, #c62828 100%);
            box-shadow: 
                0 2px 6px rgba(198, 40, 40, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .current-class-empty {
            color: #bbb;
            font-size: 14px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
        }
        .panel-classroom-row {
            margin-top: 10px;
            display: flex;
            align-items: center;
        }
        .panel-time-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .panel-time-hint {
            font-size: 13px;
            color: #888;
            margin-bottom: 4px;
            padding-left: 4px;
        }
        .panel-classroom-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }
        .current-classroom-badge {
            color: #fff;
            background: linear-gradient(135deg, #ff8a65 0%, #ff5722 100%);
            box-shadow: 
                0 2px 6px rgba(244, 81, 30, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .next-class-panel {
            background: linear-gradient(145deg, #f1f8e9 0%, #e8f5e9 100%);
            border-radius: 20px;
            padding: 20px 24px;
            box-shadow: 
                14px 14px 32px rgba(76, 175, 80, 0.18),
                -12px -12px 28px rgba(255, 255, 255, 0.9),
                inset 1px 1px 2px rgba(255, 255, 255, 0.9);
            position: relative;
            overflow: hidden;
            transform: translateY(-14px);
            transition: all 0.25s ease;
        }
        .next-class-panel:hover {
            transform: translateY(-17px);
            box-shadow: 
                16px 16px 36px rgba(76, 175, 80, 0.22),
                -14px -14px 32px rgba(255, 255, 255, 0.95),
                inset 1px 1px 2px rgba(255, 255, 255, 0.9);
        }
        .next-class-panel::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(76, 175, 80, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }
        .next-class-panel h3 {
            color: #2e7d32;
            margin-bottom: 15px;
            font-size: 17px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }
        .next-class-info {
            font-size: 16px;
            line-height: 1.9;
            position: relative;
            z-index: 1;
        }
        .next-class-title {
            font-size: 22px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 10px;
            padding: 14px 18px;
            background: rgba(76, 175, 80, 0.08);
            border-radius: 12px;
            box-shadow: 
                3px 3px 8px rgba(76, 175, 80, 0.1),
                -3px -3px 8px rgba(255, 255, 255, 0.8);
        }
        .next-class-time {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 8px;
            background: linear-gradient(135deg, #42a5f5 0%, #1976d2 100%);
            box-shadow: 
                0 2px 6px rgba(25, 118, 210, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .next-class-empty {
            color: #bbb;
            font-size: 14px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
        }
        .next-classroom-badge {
            color: #fff;
            background: linear-gradient(135deg, #4db6ac 0%, #00897b 100%);
            box-shadow: 
                0 2px 6px rgba(0, 137, 123, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        @keyframes classroomPulse {
            0%, 100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.1);
            }
        }

        .calendar-wrap {
            border-radius: 20px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 
                15px 15px 35px rgba(0, 0, 0, 0.08),
                -15px -15px 35px rgba(255, 255, 255, 0.8),
                inset 1px 1px 2px rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 1;
        }
        .calendar-wrap::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(180deg, rgba(102, 126, 234, 0.05) 0%, transparent 100%);
            pointer-events: none;
        }
        .calendar-week-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: linear-gradient(145deg, #f8f9fc 0%, #f0f2f7 100%);
            padding: 15px 0;
            box-shadow: 
                0 3px 10px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }
        .week-cell {
            text-align: center;
            padding: 12px 10px;
            font-weight: 600;
            color: #666;
            font-size: 14px;
            position: relative;
        }
        .week-cell::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: rgba(0, 0, 0, 0.05);
        }
        .week-cell.sun, .week-cell.sat {
            color: #e91e63;
        }
        .calendar-body {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }
        .day-cell {
            min-height: 150px;
            padding: 10px;
            vertical-align: top;
            background: #ffffff;
            border-radius: 14px;
            margin: 6px;
            box-shadow: 
                6px 6px 16px rgba(0, 0, 0, 0.08),
                -6px -6px 16px rgba(255, 255, 255, 0.95),
                inset 1px 1px 0 rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
            transition: all 0.3s ease;
            position: relative;
        }
        .day-cell:last-child {
            border-right: none;
        }
        .day-cell:hover {
            background: #ffffff;
            box-shadow: 
                8px 8px 20px rgba(102, 126, 234, 0.15),
                -8px -8px 20px rgba(255, 255, 255, 0.95),
                inset 1px 1px 0 rgba(255, 255, 255, 0.9);
            transform: translateY(-4px);
        }
        .day-cell.current-month {
            background: #ffffff;
        }
        .day-cell.today {
            position: relative;
            z-index: 10;
            background: #ffffff;
            transform: translateY(-5px);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 
                7px 7px 18px rgba(255, 193, 7, 0.2),
                -7px -7px 18px rgba(255, 255, 255, 0.95),
                0 0 0 2px rgba(255, 193, 7, 0.25),
                0 0 18px rgba(255, 193, 7, 0.3),
                inset 1px 1px 0 rgba(255, 255, 255, 0.9);
            animation: todayGlow 2.4s ease-in-out infinite;
        }
        .day-cell.today::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            border-radius: 14px 14px 0 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.1) 100%);
            pointer-events: none;
        }
        /* 今日 hover：进一步上浮 + 强化光晕 */
        .day-cell.today:hover {
            transform: translateY(-8px);
            animation-play-state: paused;
            box-shadow: 
                9px 9px 22px rgba(255, 193, 7, 0.25),
                -9px -9px 22px rgba(255, 255, 255, 0.95),
                0 0 0 2px rgba(255, 193, 7, 0.35),
                0 0 28px rgba(255, 193, 7, 0.45),

        function removeCustomSubject(subject) {
            savedCustomSubjects = savedCustomSubjects.filter(s => s !== subject);
            localStorage.setItem(CUSTOM_SUBJECTS_KEY, JSON.stringify(savedCustomSubjects));
            const savedContainer = document.getElementById('savedCustomSubjectsList');

                savedCustomSubjects.forEach(s=>{
                    const label = document.createElement('label');
                    label.style.display = 'flex';

        function getTodayStr() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2,'0');
            const d = String(now.getDate()).padStart(2,'0');

        }

        const CLOUDBASE_ENV_ID = 'schedule-env-d2gdowgsq248d127b';
        const CLOUDBASE_REGION = 'ap-shanghai';
        
        let cloudbaseInitialized = false;
        
        function loadCloudbaseSDK() {
            return new Promise((resolve) => {
                if (window.cloudbase) {
                    resolve(true);
                    return;
                }
                const script = document.createElement('script');
                script.src = 'https://imgcache.qq.com/qcloud/cloudbase-js-sdk/1.7.2/cloudbase.full.js';
                script.onload = () => resolve(true);
                script.onerror = () => {
                    console.log('CloudBase SDK load failed');
                    resolve(false);
                };
                document.head.appendChild(script);
            });
        }
        
        async function initCloudbase() {
            if (CLOUDBASE_ENV_ID === 'YOUR_ENV_ID') {
                console.log('CloudBase not configured');
                return false;
            }
            
            const loaded = await loadCloudbaseSDK();
            if (!loaded || !window.cloudbase) {
                console.log('CloudBase SDK not available');
                return false;
            }
            
            try {
                window.cb = cloudbase.init({
                    env: CLOUDBASE_ENV_ID,
                    region: CLOUDBASE_REGION
                });
                await window.cb.auth({
                    persistence: 'local'
                });
                cloudbaseInitialized = true;
                return true;
            } catch (e) {
                console.error('CloudBase init error:', e);
                return false;
            }
        }
        
        function getSyncKey() {
            let syncKey = localStorage.getItem('schedule_sync_key');
            if (!syncKey) {
                syncKey = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('schedule_sync_key', syncKey);
            }
            return syncKey;
        }
        
        async function uploadData() {
            if (!cloudbaseInitialized && !await initCloudbase()) {
                return { success: false, message: '请先配置 CloudBase' };
            }
            
            try {
                const syncKey = getSyncKey();
                const db = window.cb.database();
                
                const query = db.collection('ScheduleData').where({ syncKey });
                const results = await query.get();
                
                const dataStr = JSON.stringify(planData);
                const updatedAt = Date.now();
                
                if (results.data.length > 0) {
                    const docId = results.data[0]._id;
                    await db.collection('ScheduleData').doc(docId).update({
                        data: dataStr,
                        updatedAt: updatedAt
                    });
                } else {
                    await db.collection('ScheduleData').add({
                        syncKey: syncKey,
                        data: dataStr,
                        updatedAt: updatedAt
                    });
                }
                
                localStorage.setItem('schedule_last_sync_time', updatedAt.toString());
                return { success: true, message: '数据上传成功' };
            } catch (e) {
                console.error('Upload error:', e);
                return { success: false, message: '上传失败: ' + e.message };
            }
        }
        
        async function downloadData() {
            if (!cloudbaseInitialized && !await initCloudbase()) {
                return { success: false, message: '请先配置 CloudBase' };
            }
            
            try {
                const syncKey = getSyncKey();
                const db = window.cb.database();
                
                const query = db.collection('ScheduleData').where({ syncKey });
                const results = await query.get();
                
                if (results.data.length === 0) {
                    return { success: false, message: '云端无数据' };
                }
                
                const obj = results.data[0];
                const cloudDataStr = obj.data;
                const cloudUpdatedAt = obj.updatedAt;
                
                if (!cloudDataStr) {
                    return { success: false, message: '云端数据为空' };
                }
                
                const cloudData = JSON.parse(cloudDataStr);
                const localUpdatedAt = localStorage.getItem('schedule_last_sync_time');
                
                return {
                    success: true,
                    data: cloudData,
                    cloudUpdatedAt: cloudUpdatedAt,
                    localUpdatedAt: localUpdatedAt ? parseInt(localUpdatedAt) : 0
                };
            } catch (e) {
                console.error('Download error:', e);
                return { success: false, message: '下载失败: ' + e.message };
            }
        }
        
        async function syncData() {
            showSyncStatus('pending', '正在同步...');
            
            const downloadResult = await downloadData();
            
            if (!downloadResult.success) {
                if (downloadResult.message === '云端无数据') {
                    const uploadResult = await uploadData();
                    if (uploadResult.success) {
                        showSyncStatus('success', '首次同步成功');
                    } else {
                        showSyncStatus('error', uploadResult.message);
                    }
                } else {
                    showSyncStatus('error', downloadResult.message);
                }
                return;
            }
            
            const { data: cloudData, cloudUpdatedAt, localUpdatedAt } = downloadResult;
            
            if (cloudUpdatedAt > localUpdatedAt) {
                showSyncStatus('pending', '发现云端更新，正在合并...');
                
                for (const monthKey in cloudData) {
                    if (!planData[monthKey]) {
                        planData[monthKey] = cloudData[monthKey];
                    } else {
                        for (const dateKey in cloudData[monthKey]) {
                            if (!planData[monthKey][dateKey]) {
                                planData[monthKey][dateKey] = cloudData[monthKey][dateKey];
                            } else {
                                for (const timeKey in cloudData[monthKey][dateKey]) {
                                    planData[monthKey][dateKey][timeKey] = cloudData[monthKey][dateKey][timeKey];
                                }
                            }
                        }
                    }
                }
                
                saveData();
                renderCalendar(currentYear, currentMonth);
                
                const uploadResult = await uploadData();
                if (uploadResult.success) {
                    showSyncStatus('success', '同步完成，已更新至最新');
                } else {
                    showSyncStatus('error', '数据已更新，但上传失败');
                }
            } else if (localUpdatedAt > cloudUpdatedAt) {
                showSyncStatus('pending', '本地数据更新，上传至云端...');
                
                const uploadResult = await uploadData();
                if (uploadResult.success) {
                    showSyncStatus('success', '本地更新已同步至云端');

        function isClassEnded(dateStr, timeKey) {
            const now = new Date();
            const [y, m, d] = dateStr.split('-').map(Number);
            const classDate = new Date(y, m - 1, d);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            classDate.setHours(0, 0, 0, 0);
            
            if(classDate < today) return true;
            if(classDate > today) return false;
            
            const slot = timeSlots.find(s=>s.key === timeKey);
            if(!slot) return false;
            
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            return currentMinutes > slot.endTime;
        }

        function parseTasks(text) {
            if(!text || !text.trim()) return [];
            return text.split('\n').map(item=>{
                let done = false;
                let content = item.trim();
                let groupId = '';
                if(content.startsWith('☑')) {
                    done = true;
                    content = content.slice(1).trim();
                } else if(content.startsWith('□')) {
                    content = content.slice(1).trim();
                }
                if(content.startsWith('{') && content.includes('|}')){
                    const endIdx = content.indexOf('|}');
                    groupId = content.slice(1, endIdx);
                    content = content.slice(endIdx + 2);
                }
                return {done, content, groupId};
            })
        }

        function formatTaskContent(content) {
            return content.replace(/（(.+?)）$/, '<br><span style="font-size:11px;color:#666;">$1</span>');
        }

        function tasksToText(taskList) {
            return taskList.map(t=> {
                let prefix = t.done ? '☑' : '□';
                let groupPrefix = t.groupId ? `{${t.groupId}|}` : '';
                return prefix + groupPrefix + t.content;
            }).join('\n');
        }

        function renderTodayPanel() {
            const todayStr = getTodayStr();
            const monthKey = todayStr.slice(0,7);
            const dayData = planData[monthKey]?.[todayStr] || {};
            let html = '';
            timeSlots.forEach(slot=>{
                const tasks = parseTasks(dayData[slot.key] || '');
                html += `<div class="today-task-col"><h4>${slot.label}</h4>`;
                if(tasks.length === 0) html += '<div class="today-empty">暂无课程</div>';
                else {
                    tasks.forEach(t=>{
                        const ended = isClassEnded(todayStr, slot.key);
                        let cls = ended?'today-task-done':'';
                        const parsed = parseCourseContent(t.content);
                        const contentWithoutClassroom = parsed.classroom 
                            ? t.content.slice(0, -(`（${parsed.classroom}）`).length)
                            : t.content;
                        html += `<div class="today-task-item ${cls.trim()}">
                            <span>${ended?'☑':'□'}</span>
                            <span>${contentWithoutClassroom}</span>
                            ${parsed.classroom ? `<span class="today-classroom-badge">📍 ${parsed.classroom}</span>` : ''}
                            ${ended?' <span style="color:#999;font-size:12px;">已结束</span>':''}
                        </div>`;
                    })
                }
                html += '</div>';
            })
            todayTaskContent.innerHTML = html;
        }

        function renderNextClass() {
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const todayStr = getTodayStr();
            
            let nextClass = null;
            let nextClassDate = todayStr;
            
            const monthKey = todayStr.slice(0,7);
            const dayData = planData[monthKey]?.[todayStr] || {};
            
            for(let i = 0; i < timeSlots.length; i++){
                const slot = timeSlots[i];
                const tasks = parseTasks(dayData[slot.key] || '');
                if(tasks.length > 0 && !tasks[0].done && slot.startTime > currentMinutes){
                    nextClass = {slot, tasks};
                    break;
                }
            }
            
            if(!nextClass){
                let found = false;
                for(let dayOffset = 1; dayOffset <= 7; dayOffset++){
                    const targetDate = new Date(now);
                    targetDate.setDate(now.getDate() + dayOffset);
                    const y = targetDate.getFullYear();
                    const m = String(targetDate.getMonth() + 1).padStart(2,'0');
                    const d = String(targetDate.getDate()).padStart(2,'0');
                    const dateStr = `${y}-${m}-${d}`;
                    const mk = dateStr.slice(0,7);
                    const dd = planData[mk]?.[dateStr] || {};
                    
                    for(let i = 0; i < timeSlots.length; i++){
                        const slot = timeSlots[i];
                        const tasks = parseTasks(dd[slot.key] || '');
                        if(tasks.length > 0 && !tasks[0].done){
                            nextClass = {slot, tasks};
                            nextClassDate = dateStr;
                            found = true;
                            break;
                        }
                    }
                    if(found) break;
                }
            }

            if(!nextClass){
                nextClassContent.innerHTML = '<div class="next-class-empty">近期暂无课程</div>';
                return;
            }

            const [ny, nm, nd] = nextClassDate.split('-');
            const isToday = nextClassDate === todayStr;
            const dateLabel = isToday ? '今天' : `${nm}月${nd}日`;
            
            const timeDiff = nextClass.slot.startTime - currentMinutes;
            let timeHint = '';
            if(isToday && timeDiff > 0){
                const hours = Math.floor(timeDiff / 60);
                const mins = timeDiff % 60;
                if(hours > 0){
                    timeHint = `（${hours}小时${mins}分钟后开始）`;
                } else {
                    timeHint = `（${mins}分钟后开始）`;
                }
            }

            const parsed = parseCourseContent(nextClass.tasks[0].content);
            const contentWithoutClassroom = parsed.classroom 
                ? nextClass.tasks[0].content.slice(0, -(`（${parsed.classroom}）`).length)
                : nextClass.tasks[0].content;

            nextClassContent.innerHTML = `
                <div class="next-class-title">${contentWithoutClassroom}</div>
                <div class="next-class-info">
                    <div class="panel-time-row">
                        <span class="next-class-time">🕐 ${dateLabel} ${nextClass.slot.label}</span>
                        ${parsed.classroom ? `<span class="panel-classroom-badge next-classroom-badge">📍 ${parsed.classroom}</span>` : ''}
                    </div>
                    ${timeHint ? `<div class="panel-time-hint">${timeHint}</div>` : ''}
                </div>
            `;
        }

        function renderCurrentClass() {
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const todayStr = getTodayStr();
            
            const monthKey = todayStr.slice(0,7);
            const dayData = planData[monthKey]?.[todayStr] || {};
            
            let currentClass = null;
            
            for(let i = 0; i < timeSlots.length; i++){
                const slot = timeSlots[i];
                if(currentMinutes >= slot.startTime && currentMinutes <= slot.endTime){
                    const tasks = parseTasks(dayData[slot.key] || '');
                    if(tasks.length > 0){
                        currentClass = {slot, tasks};
                        break;
                    }
                }
            }

            if(!currentClass){
                currentClassContent.innerHTML = '<div class="current-class-empty">当前没有正在进行的课程</div>';
                return;
            }

            const remainingMinutes = currentClass.slot.endTime - currentMinutes;
            const hours = Math.floor(remainingMinutes / 60);
            const mins = remainingMinutes % 60;
            let remainingHint = '';
            if(hours > 0){
                remainingHint = `（还有${hours}小时${mins}分钟结束）`;
            } else {
                remainingHint = `（还有${mins}分钟结束）`;
            }

            const parsed = parseCourseContent(currentClass.tasks[0].content);
            const contentWithoutClassroom = parsed.classroom 
                ? currentClass.tasks[0].content.slice(0, -(`（${parsed.classroom}）`).length)
                : currentClass.tasks[0].content;

            currentClassContent.innerHTML = `
                <div class="current-class-title">${contentWithoutClassroom}</div>

                    <div class="panel-time-row">

                    </div>

        function renderCalendar(year, month) {
            calendarBody.innerHTML = '';
            const monthStr = String(month).padStart(2,'0');
            monthSelect.value = `${year}-${monthStr}`;
            const firstDay = new Date(year, month - 1, 1);
            const lastDay = new Date(year, month, 0);
            const prevLastDay = new Date(year, month - 1, 0);
            const firstWeekDay = firstDay.getDay();
            const totalDays = lastDay.getDate();
            const todayStr = getTodayStr();
            for(let i=0;i<firstWeekDay;i++){
                const d = prevLastDay.getDate() - firstWeekDay + 1 + i;
                calendarBody.appendChild(createDayCell(d,true,year,month,i));
            }
            for(let d=1;d<=totalDays;d++){
                const dateStr = `${year}-${monthStr}-${String(d).padStart(2,'0')}`;
                const idx = firstWeekDay + d - 1;
                const cell = createDayCell(d,false,year,month,idx,dateStr);
                if(dateStr === todayStr) cell.classList.add('today');
                calendarBody.appendChild(cell);
            }
            const remain = 42 - (firstWeekDay + totalDays);
            for(let d=1;d<=remain;d++){
                const idx = firstWeekDay + totalDays + d - 1;
                calendarBody.appendChild(createDayCell(d,true,year,month,idx));
            }
            renderTodayPanel();
            renderCurrentClass();
            renderNextClass();
        }

        function createDayCell(dayNum, isOtherMonth, year, month, cellIndex, dateStr='') {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            const wk = cellIndex % 7;
            if(wk ===0 || wk ===6) cell.classList.add('weekend');
            if(isOtherMonth) cell.classList.add('other-month');
            else cell.classList.add('current-month');
            cell.dataset.date = dateStr;
            cell.innerHTML = `<div class="day-num">${dayNum}</div>`;
            if(!isOtherMonth){
                const mk = `${year}-${String(month).padStart(2,'0')}`;
                const dayData = planData[mk]?.[dateStr] || {};
                timeSlots.forEach(slot=>{
                    const tasks = parseTasks(dayData[slot.key] || '');
                    tasks.forEach((task,idx)=>cell.appendChild(createTaskDom(task,idx,dateStr,slot.key)));
                });
                
                const btn = document.createElement('button');
                btn.className = 'add-task-btn';
                btn.textContent = '+ 添加课程';
                btn.dataset.date = dateStr;
                cell.appendChild(btn);
            }
            return cell;
        }

        function createTaskDom(task, index, dateStr, timeKey) {
            const div = document.createElement('div');
            div.className = 'task-item';
            const ended = isClassEnded(dateStr, timeKey);
            if(ended) div.classList.add('task-done');
            div.dataset.index = index;
            div.dataset.date = dateStr;
            div.dataset.timeKey = timeKey;
            
            const slot = timeSlots.find(s=>s.key === timeKey);
            const timeLabel = slot ? slot.label.split(' ')[1] : '';
            
            const parsed = parseCourseContent(task.content);
            const contentWithoutClassroom = parsed.classroom 
                ? task.content.slice(0, -(`（${parsed.classroom}）`).length)
                : task.content;
            
            div.innerHTML = `
                <div class="task-time-header">
                    <span class="task-time-badge">${timeLabel}</span>
                    ${ended ? '<span class="task-ended-tag">已结束</span>' : ''}
                </div>
                ${parsed.classroom ? `<div class="task-classroom-row"><span class="task-classroom-badge">${parsed.classroom}</span></div>` : ''}
                <div class="task-row-bottom">
                    <div class="task-text">${contentWithoutClassroom}</div>
                    <span class="del-task" title="删除">×</span>
                </div>
            `;
            return div;
        }

        calendarBody.addEventListener('change', e=>{
            if(e.target.classList.contains('time-select-small')){
                const ds = e.target.dataset.date;
                const idx = Number(e.target.dataset.index);
                const oldTimeKey = e.target.dataset.oldTime;
                const newTimeKey = e.target.value;
                if(oldTimeKey === newTimeKey) return;
                const oldList = getCellTasks(ds, oldTimeKey);
                const task = oldList[idx];
                
                if(task.groupId){
                    showConfirm({
                        title: '移动时间段',
                        message: `移动课程「${task.content}」的时间段\n\n选择修改范围：`,
                        type: 'warning',
                        okText: '同步修改所有重复课程',
                        extraText: '仅修改当前课程',
                        cancelText: '取消',
                        onOk: () => {
                            for(const monthKey in planData){
                                for(const dateKey in planData[monthKey]){
                                    const dayData = planData[monthKey][dateKey];
                                    if(dayData[oldTimeKey]){
                                        const tasks = parseTasks(dayData[oldTimeKey]);
                                        const filtered = tasks.filter(t=>t.groupId !== task.groupId);
                                        if(filtered.length !== tasks.length){
                                            dayData[oldTimeKey] = tasksToText(filtered);
                                        }
                                    }
                                    if(dayData[newTimeKey]){
                                        const tasks = parseTasks(dayData[newTimeKey]);
                                        const hasSameGroup = tasks.some(t=>t.groupId === task.groupId);
                                        if(!hasSameGroup){
                                            tasks.push({...task});
                                            dayData[newTimeKey] = tasksToText(tasks);
                                        }
                                    } else {
                                        dayData[newTimeKey] = tasksToText([{...task}]);
                                    }
                                }
                            }
                            saveData();
                            renderCalendar(currentYear, currentMonth);
                        },
                        onExtra: () => {
                            delete task.groupId;
                            oldList.splice(idx,1);
                            setCellTasks(ds, oldTimeKey, oldList);
                            const newList = getCellTasks(ds, newTimeKey);
                            newList.push(task);
                            setCellTasks(ds, newTimeKey, newList);
                            renderCalendar(currentYear, currentMonth);
                        },
                        onCancel: () => {
                            e.target.value = oldTimeKey;
                        }
                    });
                } else {
                    oldList.splice(idx,1);
                    setCellTasks(ds, oldTimeKey, oldList);
                    const newList = getCellTasks(ds, newTimeKey);
                    newList.push(task);
                    setCellTasks(ds, newTimeKey, newList);
                    renderCalendar(currentYear, currentMonth);
                }
            }
        })

        function getCellTasks(dateStr, timeKey) {
            const mk = dateStr.slice(0,7);
            if(!planData[mk]) planData[mk] = {};
            if(!planData[mk][dateStr]) planData[mk][dateStr] = {};
            timeSlots.forEach(slot=>{
                if(!planData[mk][dateStr][slot.key]) planData[mk][dateStr][slot.key] = '';
            });
            return parseTasks(planData[mk][dateStr][timeKey] || '');
        }

        function setCellTasks(dateStr, timeKey, taskList) {
            const mk = dateStr.slice(0,7);
            if(!planData[mk]) planData[mk] = {};
            if(!planData[mk][dateStr]) planData[mk][dateStr] = {};
            planData[mk][dateStr][timeKey] = tasksToText(taskList);

                    const showRepeat = this.value === 'repeat';
                    document.getElementById('editRepeatCheckboxes').style.display = showRepeat ? 'flex' : 'none';
                    document.getElementById('editDateRange').style.display = showRepeat ? 'block' : 'none';
                });
            });

            document.getElementById('cancelEditBtn').onclick = hideEditClassModal;
            document.getElementById('confirmEditBtn').onclick = confirmEditClass;
        }

        let currentEditInfo = null;

        function parseCourseContent(content) {
            const classroomMatch = content.match(/（(.+?)）$/);
            const classroom = classroomMatch ? classroomMatch[1] : '';
            const baseContent = classroomMatch ? content.slice(0, -classroomMatch[0].length) : content;
            
            const typeMatch = baseContent.match(/-([^-]+)$/);
            const classType = typeMatch ? typeMatch[1] : '';
            const contentWithoutType = typeMatch ? baseContent.slice(0, -typeMatch[0].length) : baseContent;
            
            let grade = '';
            let subject = '';
            for(const g of grades){
                if(contentWithoutType.startsWith(g)){
                    grade = g;
                    subject = contentWithoutType.slice(g.length);
                    break;
                }
            }
            
            return {grade, subject, classType, classroom};
        }

        function showEditClassModal(dateStr, timeKey, index) {
            const list = getCellTasks(dateStr, timeKey);
            const task = list[index];
            currentEditInfo = {dateStr, timeKey, index, task};
            
            const parsed = parseCourseContent(task.content);
            
            document.querySelectorAll('input[name="editGrade"]').forEach(rb=>{
                rb.checked = rb.value === parsed.grade;
            });
            
            const savedContainer = document.getElementById('editSavedCustomSubjectsList');
            savedContainer.innerHTML = '';
            
            let foundSubject = false;
            if(savedCustomSubjects.includes(parsed.subject)){
                const label = document.createElement('label');
                label.innerHTML = `<input type="radio" name="editSubject" value="${parsed.subject}"> ${parsed.subject}`;
                label.style.cursor = 'pointer';
                savedContainer.appendChild(label);
                document.getElementById('editSavedCustomSubjects').style.display = 'block';
                foundSubject = true;
            } else {
                document.getElementById('editSavedCustomSubjects').style.display = 'none';
            }
            
            document.querySelectorAll('input[name="editSubject"]').forEach(rb=>{
                rb.checked = rb.value === parsed.subject;
                if(rb.value === parsed.subject) foundSubject = true;
            });
            
            if(!foundSubject){
                document.querySelector('input[name="editSubject"][value="custom"]').checked = true;
                document.getElementById('editCustomSubjectRow').style.display = 'block';
                document.getElementById('editCustomSubjectInput').value = parsed.subject;
            } else {
                document.getElementById('editCustomSubjectRow').style.display = 'none';
                document.getElementById('editCustomSubjectInput').value = '';
            }
            
            document.getElementById('editClassroomSelect').value = parsed.classroom;
            document.getElementById('editSlotSelect').value = timeKey;
            
            let foundClassType = false;
            document.querySelectorAll('input[name="editClassType"]').forEach(rb=>{
                if(rb.value === parsed.classType){
                    rb.checked = true;
                    foundClassType = true;
                }
            });
            
            if(!foundClassType){
                document.querySelector('input[name="editClassType"]').checked = true;
            }
            
            const hasGroupId = task.groupId !== undefined && task.groupId !== null;
            document.querySelector(`input[name="editRepeatMode"][value="${hasGroupId ? 'repeat' : 'none'}"]`).checked = true;
            document.getElementById('editRepeatCheckboxes').style.display = hasGroupId ? 'flex' : 'none';
            document.getElementById('editDateRange').style.display = hasGroupId ? 'block' : 'none';
            
            const editSyncOption = document.getElementById('editSyncOption');
            const editSyncHint = document.getElementById('editSyncHint');
            if(hasGroupId){
                let groupCount = 0;
                for(const monthKey in planData){
                    for(const dateKey in planData[monthKey]){
                        const dayData = planData[monthKey][dateKey];
                        for(const slotKey of ['slot1','slot2','slot3','slot4','slot5']){
                            if(dayData[slotKey]){
                                const tasks = parseTasks(dayData[slotKey]);
                                if(tasks.some(t=>t.groupId === task.groupId)){
                                    groupCount++;
                                    break;
                                }
                            }
                        }
                    }
                }
                editSyncOption.style.display = 'block';
                editSyncHint.textContent = `当前重复课程共 ${groupCount} 天，选择"仅修改当前课程"会将该课程从重复组中分离。`;
                document.querySelector('input[name="editSyncMode"][value="sync"]').checked = true;
            } else {
                editSyncOption.style.display = 'none';
            }
            
            document.getElementById('editStartDateInput').value = dateStr;
            document.getElementById('editEndDateInput').value = dateStr;
            
            if(hasGroupId){
                const days = [];
                for(const monthKey in planData){
                    for(const dateKey in planData[monthKey]){
                        const dayData = planData[monthKey][dateKey];
                        for(const slotKey of ['slot1','slot2','slot3','slot4','slot5']){
                            if(dayData[slotKey]){
                                const tasks = parseTasks(dayData[slotKey]);
                                if(tasks.some(t=>t.groupId === task.groupId)){
                                    const d = new Date(dateKey);
                                    days.push(d.getDay());
                                    break;
                                }
                            }
                        }
                    }
                }
                const uniqueDays = [...new Set(days)];
                document.querySelectorAll('.edit-day-checkbox').forEach(cb=>{
                    cb.checked = uniqueDays.includes(Number(cb.value));
                });
                
                const allDates = [];
                for(const monthKey in planData){
                    for(const dateKey in planData[monthKey]){
                        const dayData = planData[monthKey][dateKey];
                        for(const slotKey of ['slot1','slot2','slot3','slot4','slot5']){
                            if(dayData[slotKey]){
                                const tasks = parseTasks(dayData[slotKey]);
                                if(tasks.some(t=>t.groupId === task.groupId)){
                                    allDates.push(dateKey);
                                    break;
                                }
                            }
                        }
                    }
                }
                if(allDates.length > 0){
                    allDates.sort();
                    document.getElementById('editStartDateInput').value = allDates[0];
                    document.getElementById('editEndDateInput').value = allDates[allDates.length - 1];
                }
            } else {
                document.querySelectorAll('.edit-day-checkbox').forEach(cb=>cb.checked=false);
            }
            
            document.getElementById('editClassModal').style.display = 'flex';
        }

        function hideEditClassModal() {
            document.getElementById('editClassModal').style.display = 'none';
            currentEditInfo = null;
        }

        function confirmEditClass() {
            if(!currentEditInfo) return;
            
            const {dateStr, timeKey, index, task} = currentEditInfo;
            
            const selectedGrade = document.querySelector('input[name="editGrade"]:checked')?.value;
            const selectedSubjectRadio = document.querySelector('input[name="editSubject"]:checked');
            const selectedClassTypeRadio = document.querySelector('input[name="editClassType"]:checked');
            const selectedClassroom = document.getElementById('editClassroomSelect').value;
            const selectedSlot = document.getElementById('editSlotSelect').value;
            
            let selectedSubject = '';
            if(selectedSubjectRadio){
                if(selectedSubjectRadio.value === 'custom'){
                    const customValue = document.getElementById('editCustomSubjectInput').value.trim();
                    if(customValue){
                        selectedSubject = customValue;
                        if(!savedCustomSubjects.includes(customValue)){
                            savedCustomSubjects.push(customValue);
                            localStorage.setItem(CUSTOM_SUBJECTS_KEY, JSON.stringify(savedCustomSubjects));
                        }
                    }
                } else {
                    selectedSubject = selectedSubjectRadio.value;
                }
            }
            
            let selectedClassType = '';
            if(selectedClassTypeRadio){
                selectedClassType = selectedClassTypeRadio.value;
            }
            
            if(!selectedGrade || !selectedSubject){
                showAlert('请选择年级和科目', '提示');
                return;
            }

            if(!selectedClassType){
                showAlert('请选择班型', '提示');
                return;
            }

            const classroomSuffix = selectedClassroom ? `（${selectedClassroom}）` : '';
            const newContent = `${selectedGrade}${selectedSubject}-${selectedClassType}${classroomSuffix}`;
            
            const selectedRepeatMode = document.querySelector('input[name="editRepeatMode"]:checked')?.value || 'none';
            const selectedDays = Array.from(document.querySelectorAll('.edit-day-checkbox:checked')).map(cb=>Number(cb.value));
            const editStartDate = document.getElementById('editStartDateInput').value;
            const editEndDate = document.getElementById('editEndDateInput').value;
            
            const oldGroupId = task.groupId;
            const hasOldGroup = !!oldGroupId;
            const syncMode = document.querySelector('input[name="editSyncMode"]:checked')?.value || 'sync';
            
            if(hasOldGroup && syncMode === 'single'){
                const oldList = getCellTasks(dateStr, timeKey);
                if(selectedSlot !== timeKey){
                    oldList.splice(index, 1);
                    setCellTasks(dateStr, timeKey, oldList);
                    const newList = getCellTasks(dateStr, selectedSlot);
                    newList.push({done:false, content: newContent});
                    setCellTasks(dateStr, selectedSlot, newList);
                } else {
                    oldList[index] = {done:false, content: newContent};
                    setCellTasks(dateStr, timeKey, oldList);
                }
                saveData();
                renderCalendar(currentYear, currentMonth);
                hideEditClassModal();
                return;
            }
            
            if(!hasOldGroup){
                const oldList = getCellTasks(dateStr, timeKey);
                if(selectedSlot !== timeKey){
                    oldList.splice(index, 1);
                    setCellTasks(dateStr, timeKey, oldList);
                } else {
                    oldList.splice(index, 1);
                    setCellTasks(dateStr, timeKey, oldList);
                }
            } else {
                for(const monthKey in planData){
                    for(const dateKey in planData[monthKey]){
                        const dayData = planData[monthKey][dateKey];
                        for(const slotKey of ['slot1','slot2','slot3','slot4','slot5']){
                            if(dayData[slotKey]){
                                const tasks = parseTasks(dayData[slotKey]);
                                const filtered = tasks.filter(t=>t.groupId !== oldGroupId);
                                if(filtered.length !== tasks.length){
                                    dayData[slotKey] = tasksToText(filtered);
                                }
                            }
                        }
                    }
                }
            }
            
            if(selectedRepeatMode === 'repeat'){
                if(!editStartDate || !editEndDate){
                    showAlert('请选择日期范围', '提示');
                    return;
                }
                if(selectedDays.length === 0){
                    showAlert('请至少选择一天', '提示');
                    return;
                }
                
                const datesToAdd = getDatesInRange(editStartDate, editEndDate, selectedDays);
                const newGroupId = 'g' + Date.now() + Math.random().toString(36).slice(2,8);
                
                datesToAdd.forEach(d=>{
                    const list = getCellTasks(d, selectedSlot);
                    list.push({done:false, content: newContent, groupId: newGroupId});
                    setCellTasks(d, selectedSlot, list);
                });
            } else {
                const list = getCellTasks(dateStr, selectedSlot);
                list.push({done:false, content: newContent});
                setCellTasks(dateStr, selectedSlot, list);
            }
            
            saveData();
            renderCalendar(currentYear, currentMonth);
            hideEditClassModal();
        }

        let confirmCallback = null;
        let confirmCancelCallback = null;
        function showConfirm(options) {
            const {
                title = '确认操作',
                message = '',
                type = 'danger',
                okText = '确定',
                cancelText = '取消',
                extraText = '',
                onOk = null,
                onCancel = null,
                onExtra = null
            } = options;

            const modal = document.getElementById('confirmModal');
            const icon = document.getElementById('confirmIcon');
            const titleEl = document.getElementById('confirmTitle');
            const messageEl = document.getElementById('confirmMessage');
            const okBtn = document.getElementById('confirmOkBtn');
            const cancelBtn = document.getElementById('confirmCancelBtn');
            const extraBtn = document.getElementById('confirmExtraBtn');
            const buttonsBox = document.getElementById('confirmButtons');

            titleEl.textContent = title;
            messageEl.textContent = message;
            okBtn.textContent = okText;
            cancelBtn.textContent = cancelText;

            icon.className = 'confirm-icon';
            if (type === 'warning') icon.classList.add('warning');
            else if (type === 'info') icon.classList.add('info');

            if (extraText && onExtra) {
                extraBtn.textContent = extraText;
                extraBtn.style.display = 'inline-block';
                extraBtn.onclick = () => {
                    hideConfirm();
                    onExtra();
                };
                buttonsBox.style.flexDirection = 'column';
                buttonsBox.style.gap = '10px';
                okBtn.style.width = '100%';
                extraBtn.style.width = '100%';
                cancelBtn.style.width = '100%';
            } else {
                extraBtn.style.display = 'none';
                buttonsBox.style.flexDirection = 'row';
                buttonsBox.style.gap = '12px';
                okBtn.style.width = 'auto';
                cancelBtn.style.width = 'auto';
            }

            okBtn.onclick = () => {
                hideConfirm();
                if (onOk) onOk();
            };
            cancelBtn.onclick = () => {
                hideConfirm();
                if (onCancel) onCancel();
            };

            modal.style.display = 'flex';
            confirmCallback = onOk;
            confirmCancelCallback = onCancel;
        }
        function hideConfirm() {
            document.getElementById('confirmModal').style.display = 'none';
            confirmCallback = null;
            confirmCancelCallback = null;
        }

        let alertCallback = null;
        function showAlert(message, title = '提示', onOk = null) {
            const modal = document.getElementById('alertModal');
            const titleEl = document.getElementById('alertTitle');
            const messageEl = document.getElementById('alertMessage');
            const okBtn = document.getElementById('alertOkBtn');

            titleEl.textContent = title;
            messageEl.textContent = message;
            alertCallback = onOk;

            okBtn.onclick = () => {
                hideAlert();
            };

            modal.style.display = 'flex';
        }
        function hideAlert() {
            document.getElementById('alertModal').style.display = 'none';
            if(alertCallback){
                const cb = alertCallback;
                alertCallback = null;
                cb();
            }
        }

        function showAddClassModal(dateStr) {
            currentAddDate = dateStr;
            document.querySelectorAll('input[name="grade"]').forEach(rb=>rb.checked=false);
            document.querySelectorAll('input[name="subject"]').forEach(rb=>rb.checked=false);
            document.getElementById('customSubjectRow').style.display = 'none';
            document.getElementById('customSubjectInput').value = '';
            
            const savedContainer = document.getElementById('savedCustomSubjectsList');
            savedContainer.innerHTML = '';
            if(savedCustomSubjects.length > 0){
                document.getElementById('savedCustomSubjects').style.display = 'block';
                savedCustomSubjects.forEach(s=>{
                    const label = document.createElement('label');
                    label.style.display = 'flex';
                    label.style.alignItems = 'center';
                    label.style.gap = '6px';
                    label.style.cursor = 'pointer';
                    label.style.padding = '4px 8px';
                    label.style.borderRadius = '4px';
                    label.style.background = '#f5f5f5';
                    label.innerHTML = `<input type="radio" name="subject" value="${s}"> ${s} <span class="remove-custom-subject" data-subject="${s}" style="color:#ff5252;font-size:12px;cursor:pointer;line-height:1;">×</span>`;
                    savedContainer.appendChild(label);
                });
                savedContainer.querySelectorAll('.remove-custom-subject').forEach(btn=>{
                    btn.onclick = (e)=>{
                        e.stopPropagation();
                        removeCustomSubject(e.target.dataset.subject);
                    };
                });
            } else {
                document.getElementById('savedCustomSubjects').style.display = 'none';
            }
            
            document.querySelectorAll('input[name="classType"]').forEach(rb=>rb.checked=false);
            
            document.getElementById('classroomSelect').value = '';
            document.querySelectorAll('.day-checkbox').forEach(cb=>cb.checked=false);
            
            document.getElementById('startDateInput').value = dateStr;
            document.getElementById('endDateInput').value = dateStr;
            
            document.getElementById('addClassModal').style.display = 'flex';
        }

        function hideAddClassModal() {
            document.getElementById('addClassModal').style.display = 'none';
            currentAddDate = '';
        }

        function confirmAddClass() {
            const selectedGrade = document.querySelector('input[name="grade"]:checked')?.value;
            const selectedSubjectRadio = document.querySelector('input[name="subject"]:checked');
            const selectedClassTypeRadio = document.querySelector('input[name="classType"]:checked');
            const selectedClassroom = document.getElementById('classroomSelect').value;
            const selectedSlot = document.getElementById('slotSelect').value;
            const startDate = document.getElementById('startDateInput').value;
            const endDate = document.getElementById('endDateInput').value;
            const repeatMode = document.querySelector('input[name="repeatMode"]:checked')?.value || 'none';
            const selectedDays = Array.from(document.querySelectorAll('.day-checkbox:checked')).map(cb=>Number(cb.value));
            
            let selectedSubject = '';
            if(selectedSubjectRadio){
                if(selectedSubjectRadio.value === 'custom'){
                    const customValue = document.getElementById('customSubjectInput').value.trim();
                    if(customValue){
                        selectedSubject = customValue;
                        if(!savedCustomSubjects.includes(customValue)){
                            savedCustomSubjects.push(customValue);
                            localStorage.setItem(CUSTOM_SUBJECTS_KEY, JSON.stringify(savedCustomSubjects));
                        }
                    }
                } else {
                    selectedSubject = selectedSubjectRadio.value;
                }
            }
            
            let selectedClassType = '';
            if(selectedClassTypeRadio){
                selectedClassType = selectedClassTypeRadio.value;
            }
            
            if(!selectedGrade || !selectedSubject){
                showAlert('请选择年级和科目', '提示');
                return;
            }

            if(!selectedClassType){
                showAlert('请选择班型', '提示');
                return;
            }

            if(!startDate){
                showAlert('请选择日期', '提示');
                return;
            }

            let datesToAdd = [];
            if(repeatMode === 'none'){
                datesToAdd = [startDate];
            } else {
                if(!endDate){
                    showAlert('请选择结束日期', '提示');
                    return;
                }
                if(selectedDays.length === 0){
                    showAlert('请至少选择一天', '提示');
                    return;
                }
                datesToAdd = getDatesInRange(startDate, endDate, selectedDays);
            }

            if(datesToAdd.length === 0){
                showAlert('没有符合条件的日期', '提示');
                return;
            }

            const classroomSuffix = selectedClassroom ? `（${selectedClassroom}）` : '';
            const content = `${selectedGrade}${selectedSubject}-${selectedClassType}${classroomSuffix}`;
            const groupId = repeatMode === 'repeat' ? 'g' + Date.now() + Math.random().toString(36).slice(2,8) : '';
            
            datesToAdd.forEach(dateStr=>{
                const list = getCellTasks(dateStr, selectedSlot);
                const taskData = {done:false, content};
                if(groupId) taskData.groupId = groupId;
                list.push(taskData);
                setCellTasks(dateStr, selectedSlot, list);
            });

            hideAddClassModal();
            renderCalendar(currentYear, currentMonth);
        }

        function getDatesInRange(startDate, endDate, selectedDays) {
            const dates = [];
            const start = new Date(startDate);
            const end = new Date(endDate);
            
            const current = new Date(start);
            while(current <= end) {
                const dayOfWeek = current.getDay();
                if(selectedDays.includes(dayOfWeek)){
                    dates.push(formatDate(current));
                }
                current.setDate(current.getDate() + 1);
            }
            
            return dates;
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        initAddClassModal();

        document.getElementById('resetBtn').onclick = ()=>{
            showConfirm({
                title: '重置当月课表',
                message: '确定重置当月课表？\n\n注意：当月中设置为重复模式的课程将在所有日期中同步删除。',
                type: 'danger',
                okText: '确定重置',
                cancelText: '取消',
                onOk: () => {
                    const mk = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;
                    const monthData = planData[mk] || {};
                    const groupIdsToDelete = new Set();
                    for(const dateKey in monthData){
                        const dayData = monthData[dateKey];
                        for(const slotKey of ['slot1','slot2','slot3','slot4','slot5']){
                            if(dayData[slotKey]){
                                const tasks = parseTasks(dayData[slotKey]);
                                tasks.forEach(t=>{
                                    if(t.groupId) groupIdsToDelete.add(t.groupId);
                                });
                            }
                        }
                    }
                    if(groupIdsToDelete.size > 0){
                        for(const monthKey in planData){
                            for(const dateKey in planData[monthKey]){
                                const dayData = planData[monthKey][dateKey];
                                for(const slotKey of ['slot1','slot2','slot3','slot4','slot5']){
                                    if(dayData[slotKey]){
                                        const tasks = parseTasks(dayData[slotKey]);
                                        const filtered = tasks.filter(t=>!groupIdsToDelete.has(t.groupId));
                                        if(filtered.length !== tasks.length){
                                            dayData[slotKey] = tasksToText(filtered);
                                        }
                                    }
                                }
                            }
                        }
                    }
                    planData[mk] = JSON.parse(JSON.stringify(defaultData[mk]||{}));
                    saveData();
                    renderCalendar(currentYear, currentMonth);
                }
            });
        }

        document.getElementById('syncBtn').onclick = syncData;
        
        initCloudbase();
        
        if (navigator.onLine) {
            setTimeout(() => {
                downloadData().then(result => {
                    if (result.success && result.cloudUpdatedAt > result.localUpdatedAt) {
                        if (confirm('发现云端有更新，是否同步？')) {
                            syncData();
                        }
                    }
                }).catch(e => console.error('Auto sync check error:', e));
            }, 1000);
        }

        const today = new Date();
        currentYear = today.getFullYear();
        currentMonth = today.getMonth() + 1;
        renderCalendar(currentYear, currentMonth);
    </script>
