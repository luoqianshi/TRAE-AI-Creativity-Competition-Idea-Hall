<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互动小说引擎 — Interactive Novel Engine</title>
<style>
/* ═══════════════════════════════════════════
   Dark Academic / Vintage Library Theme
   ═══════════════════════════════════════════ */
:root {
  --bg-primary: #1a1614;
  --bg-secondary: #231e1a;
  --bg-card: #2c2520;
  --bg-hover: #3a322c;
  --text-primary: #e8dccc;
  --text-secondary: #b8a898;
  --text-muted: #8a7a6a;
  --text-accent: #d4a853;
  --border-color: #3a322c;
  --border-accent: #6a5a4a;
  --accent-gold: #d4a853;
  --accent-red: #c0392b;
  --accent-green: #27ae60;
  --accent-blue: #2980b9;
  --shadow-card: 0 2px 12px rgba(0,0,0,0.4);
  --font-display: 'Georgia','Noto Serif SC','Source Han Serif SC',serif;
  --font-body: 'Georgia','Noto Serif SC','Source Han Serif SC',serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg-primary);color:var(--text-primary);line-height:1.7;min-height:100vh;overflow:hidden}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg-secondary)}
::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:3px}

/* ── Layout ── */
#app{
  display:grid;
  grid-template-columns:280px 1fr 300px;
  grid-template-rows:52px 1fr;
  height:100vh;overflow:hidden;
}
.header{
  grid-column:1/-1;
  background:var(--bg-secondary);
  border-bottom:1px solid var(--border-color);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
}
.header-title{font-size:1.15rem;font-weight:700;color:var(--text-accent);letter-spacing:1px}
.header-sub{color:var(--text-muted);margin-left:12px;font-size:.85rem}
.header-right{display:flex;align-items:center;gap:12px}
.badge{background:var(--accent-gold);color:#1a1614;padding:2px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.sidebar-left,.sidebar-right{
  background:var(--bg-secondary);
  border-right:1px solid var(--border-color);
  overflow-y:auto;padding:12px;
}
.sidebar-right{border-right:none;border-left:1px solid var(--border-color)}
.main-area{
  display:flex;flex-direction:column;
  background:var(--bg-primary);overflow:hidden;
}

/* ── Card ── */
.card{
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:8px;
  padding:14px;
  margin-bottom:10px;
  box-shadow:var(--shadow-card);
  transition:border-color .2s;
}
.card:hover{border-color:var(--border-accent)}
.card-title{
  font-size:.85rem;font-weight:700;
  color:var(--text-accent);
  margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
  text-transform:uppercase;letter-spacing:1px;
}

/* ── Character Cards ── */
.char-card{
  display:flex;gap:10px;align-items:flex-start;
  padding:10px!important;cursor:pointer;
  transition:background .2s;
}
.char-card:hover{background:var(--bg-hover)}
.char-card.active{border-color:var(--accent-gold);background:rgba(212,168,83,.08)}
.char-avatar{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;flex-shrink:0;
  border:2px solid var(--border-accent);
}
.char-info{flex:1;min-width:0}
.char-name{font-weight:700;font-size:.9rem;color:var(--text-primary)}
.char-role{font-size:.72rem;color:var(--text-muted);margin-top:1px}
.char-traits{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.trait-tag{
  background:rgba(212,168,83,.12);color:var(--accent-gold);
  padding:1px 7px;border-radius:10px;font-size:.65rem;
}

/* ── Character Detail Modal ── */
.char-detail{
  background:var(--bg-card);border:1px solid var(--border-accent);
  border-radius:8px;padding:16px;margin-top:8px;
  animation:slideDown .3s ease;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.char-detail-name{font-size:1.1rem;font-weight:700;color:var(--text-accent);margin-bottom:6px}
.char-detail-desc{font-size:.82rem;color:var(--text-secondary);line-height:1.6;margin-bottom:8px}
.char-detail-section{margin-bottom:8px}
.char-detail-label{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}

/* ── World Info ── */
.world-item{padding:8px 0;border-bottom:1px solid var(--border-color)}
.world-item:last-child{border-bottom:none}
.world-category{
  font-size:.65rem;color:var(--accent-gold);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;
}
.world-title{font-size:.85rem;font-weight:600;color:var(--text-primary)}
.world-content{font-size:.78rem;color:var(--text-secondary);margin-top:3px;line-height:1.5}

/* ── Plot Timeline ── */
.plot-node{
  display:flex;gap:10px;padding:8px 0;
  position:relative;
}
.plot-line{
  width:20px;display:flex;flex-direction:column;align-items:center;
  position:relative;
}
.plot-dot{
  width:12px;height:12px;border-radius:50%;
  background:var(--border-color);border:2px solid var(--border-accent);
  z-index:1;flex-shrink:0;
  transition:all .3s;
}
.plot-dot.reached{background:var(--accent-green);border-color:var(--accent-green)}
.plot-dot.current{
  background:var(--accent-gold);border-color:var(--accent-gold);
  box-shadow:0 0 8px rgba(212,168,83,.5);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 6px rgba(212,168,83,.4)}50%{box-shadow:0 0 14px rgba(212,168,83,.7)}}
.plot-stem{width:2px;flex:1;background:var(--border-color);margin-top:2px}
.plot-node:last-child .plot-stem{display:none}
.plot-info{flex:1;padding-bottom:8px}
.plot-title{font-size:.82rem;font-weight:600;color:var(--text-primary)}
.plot-title.reached{color:var(--accent-green)}
.plot-title.current{color:var(--accent-gold)}
.plot-desc{font-size:.72rem;color:var(--text-muted);margin-top:2px}

/* ── Relation Graph ── */
.rel-graph{width:100%;height:240px;border-radius:6px;overflow:hidden;background:rgba(0,0,0,.2)}

/* ── Chat ── */
.chat-panel{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:80%;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-system{
  text-align:center;color:var(--text-muted);
  font-size:.78rem;padding:8px 0;
}
.msg-system .divider{
  display:flex;align-items:center;gap:12px;
}
.msg-system .divider::before,.msg-system .divider::after{
  content:'';flex:1;height:1px;background:var(--border-color);
}
.msg-assistant{
  align-self:flex-start;
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:12px 12px 12px 2px;
  padding:14px 18px;
  font-size:.88rem;line-height:1.8;
  color:var(--text-primary);
}
.msg-assistant .narrator-tag{
  font-size:.7rem;color:var(--text-accent);
  margin-bottom:6px;font-weight:600;
}
.msg-user{
  align-self:flex-end;
  background:rgba(212,168,83,.12);
  border:1px solid rgba(212,168,83,.25);
  border-radius:12px 12px 2px 12px;
  padding:12px 16px;
  font-size:.88rem;color:var(--text-accent);
}
.msg-options{
  display:flex;flex-wrap:wrap;gap:8px;
  align-self:flex-start;margin-top:4px;
}
.option-btn{
  background:var(--bg-card);
  border:1px solid var(--border-accent);
  border-radius:20px;
  padding:6px 16px;
  font-size:.8rem;color:var(--text-secondary);
  cursor:pointer;transition:all .2s;
  font-family:var(--font-body);
}
.option-btn:hover{
  border-color:var(--accent-gold);color:var(--accent-gold);
  background:rgba(212,168,83,.08);
}
.option-btn.selected{
  border-color:var(--accent-gold);color:var(--text-accent);
  background:rgba(212,168,83,.15);
}

/* ── Input Area ── */
.input-area{
  padding:12px 20px;
  background:var(--bg-secondary);
  border-top:1px solid var(--border-color);
  display:flex;gap:10px;align-items:flex-end;
}
.input-area textarea{
  flex:1;background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:8px;
  padding:10px 14px;
  color:var(--text-primary);
  font-family:var(--font-body);font-size:.88rem;
  resize:none;line-height:1.5;
  outline:none;
  transition:border-color .2s;
}
.input-area textarea:focus{border-color:var(--accent-gold)}
.input-area textarea::placeholder{color:var(--text-muted)}
.btn-send{
  background:var(--accent-gold);color:#1a1614;
  border:none;border-radius:8px;
  padding:10px 20px;
  font-family:var(--font-body);font-size:.88rem;font-weight:600;
  cursor:pointer;transition:all .2s;
  white-space:nowrap;
}
.btn-send:hover{background:#e0b860}
.btn-send:disabled{opacity:.5;cursor:not-allowed}

/* ── Upload Overlay ── */
.upload-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(26,22,20,.92);
  display:flex;align-items:center;justify-content:center;
  z-index:100;
  transition:opacity .5s,visibility .5s;
}
.upload-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.upload-box{
  text-align:center;
  padding:60px 80px;
  border:2px dashed var(--border-accent);
  border-radius:16px;
  background:var(--bg-card);
  max-width:480px;
}
.upload-icon{font-size:3rem;margin-bottom:16px}
.upload-title{font-size:1.3rem;font-weight:700;color:var(--text-accent);margin-bottom:8px}
.upload-desc{color:var(--text-secondary);font-size:.9rem;margin-bottom:24px;line-height:1.6}
.upload-steps{text-align:left;margin-bottom:24px}
.upload-step{
  display:flex;align-items:center;gap:10px;
  padding:6px 0;font-size:.85rem;color:var(--text-secondary);
}
.step-num{
  width:24px;height:24px;border-radius:50%;
  background:var(--accent-gold);color:#1a1614;
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;font-weight:700;flex-shrink:0;
}
.btn-start{
  background:var(--accent-gold);color:#1a1614;
  border:none;border-radius:8px;
  padding:12px 36px;
  font-family:var(--font-body);font-size:1rem;font-weight:700;
  cursor:pointer;transition:all .2s;
  letter-spacing:1px;
}
.btn-start:hover{background:#e0b860;transform:translateY(-1px);box-shadow:0 4px 16px rgba(212,168,83,.3)}

/* ── Loading ── */
.loading-dots{display:flex;gap:4px;align-items:center;padding:8px 0}
.loading-dots span{
  width:6px;height:6px;border-radius:50%;
  background:var(--text-muted);
  animation:bounce .6s infinite alternate;
}
.loading-dots span:nth-child(2){animation-delay:.15s}
.loading-dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{to{opacity:.3;transform:translateY(-4px)}}

/* ── Extraction Progress ── */
.extract-panel{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(26,22,20,.95);
  display:flex;align-items:center;justify-content:center;
  z-index:200;
  transition:opacity .5s,visibility .5s;
}
.extract-panel.hidden{opacity:0;visibility:hidden;pointer-events:none}
.extract-box{
  width:420px;
  background:var(--bg-card);
  border:1px solid var(--border-accent);
  border-radius:16px;padding:36px;
}
.extract-title{font-size:1.1rem;font-weight:700;color:var(--text-accent);text-align:center;margin-bottom:20px}
.extract-steps{display:flex;flex-direction:column;gap:12px}
.extract-step{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;border-radius:8px;
  background:var(--bg-secondary);
  transition:all .3s;
}
.extract-step.active{border-left:3px solid var(--accent-gold);background:rgba(212,168,83,.06)}
.extract-step.done{border-left:3px solid var(--accent-green);background:rgba(39,174,96,.06)}
.extract-step .step-icon{font-size:1rem;width:24px;text-align:center}
.extract-step .step-text{font-size:.85rem;color:var(--text-secondary)}
.extract-step.done .step-text{color:var(--accent-green)}
.extract-step.active .step-text{color:var(--text-accent)}
.extract-bar{
  margin-top:20px;height:4px;border-radius:2px;
  background:var(--bg-secondary);overflow:hidden;
}
.extract-bar-fill{
  height:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--accent-gold),#e0b860);
  transition:width .5s ease;width:0%;
}
</style>
</head>
<body>

<!-- Main App -->

  <!-- Main Chat -->

      <textarea id="chat-input" rows="1" placeholder="说出你的行动..."></textarea>
      <button class="btn-send" id="btn-send">发送</button>

  <!-- Right Sidebar -->
  <aside class="sidebar-right" id="sidebar-right">

    </div>
    <div class="card">
      <div class="card-title">🔗 人物关系</div>
      <div class="rel-graph" id="rel-graph"></div>
    </div>
    <div class="card">
      <div class="card-title">📜 情节进度</div>
      <div id="plot-timeline"></div>
    </div>
  </aside>
</div>

// ── Render Characters ──
function renderCharacters(){
  const el=document.getElementById('char-list');
  el.innerHTML=characters.map(c=>`
    <div class="char-card card" data-id="${c.id}" onclick="toggleCharDetail(${c.id})">
      <div class="char-avatar" style="border-color:${c.isProtagonist?'var(--accent-gold)':'var(--border-accent)'}">${c.name[0]}<\/div>
      <div class="char-info">
        <div class="char-name">${c.name}${c.isProtagonist?' ⭐':''}<\/div>
        <div class="char-role">${{protagonist:'主角',antagonist:'反派',supporting:'重要角色',minor:'次要角色'}[c.role]}<\/div>
        <div class="char-traits">${c.traits.map(t=>`<span class="trait-tag">${t}<\/span>`).join('')}<\/div>
      <\/div>
    <\/div>
    <div class="char-detail" id="char-detail-${c.id}" style="display:none">
      <div class="char-detail-name">${c.name}<\/div>
      <div class="char-detail-desc">${c.desc}<\/div>
      ${c.backstory?`<div class="char-detail-section"><div class="char-detail-label">背景<\/div><div class="char-detail-desc">${c.backstory}<\/div><\/div>`:''}
      <div class="char-detail-section"><div class="char-detail-label">关系<\/div>
        ${Object.entries(c.relations).map(([name,r])=>`<span style="font-size:.78rem;color:var(--text-secondary)">${name} <span style="color:var(--text-muted)">(${r.type})<\/span> <\/span>`).join(' · ')}
      <\/div>
    <\/div>
  `).join('');
}
function toggleCharDetail(id){
  const el=document.getElementById('char-detail-'+id);
  const card=document.querySelector(`.char-card[data-id="${id}"]`);
  const wasVisible=el.style.display!=='none';
  document.querySelectorAll('.char-detail').forEach(d=>d.style.display='none');
  document.querySelectorAll('.char-card').forEach(c=>c.classList.remove('active'));
  if(!wasVisible){el.style.display='block';card.classList.add('active')}
}

// ── Relation Graph (SVG force-directed) ──
function renderGraph(){
  const svg=document.getElementById('rel-graph');
  const W=svg.clientWidth||280, H=240;
  const nodes=characters.map((c,i)=>({
    id:c.id,name:c.name,x:W/2+Math.cos(i*2.2)*80,y:H/2+Math.sin(i*2.2)*60,
    vx:0,vy:0,isProtagonist:c.isProtagonist
  }));
  const edges=[];
  characters.forEach(c=>{
    Object.entries(c.relations).forEach(([name,r])=>{
      const target=characters.find(t=>t.name===name);
      if(target&&c.id<target.id) edges.push({source:c.id,target:target.id,type:r.type,intensity:r.intensity});
    });
  });
  // Simple force simulation
  for(let iter=0;iter<120;iter++){
    nodes.forEach(a=>{
      nodes.forEach(b=>{
        if(a.id===b.id)return;
        let dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy)||1;
        let f=300/(d*d);
        a.vx+=dx/d*f;a.vy+=dy/d*f;
      });
    });
    edges.forEach(e=>{
      const a=nodes.find(n=>n.id===e.source),b=nodes.find(n=>n.id===e.target);
      let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      let f=(d-80)*0.01*e.intensity;
      a.vx+=dx/d*f;a.vy+=dy/d*f;
      b.vx-=dx/d*f;b.vy-=dy/d*f;
    });
    nodes.forEach(n=>{
      n.vx+=(W/2-n.x)*0.003;n.vy+=(H/2-n.y)*0.003;
      n.vx*=0.85;n.vy*=0.85;
      n.x+=n.vx;n.y+=n.vy;
      n.x=Math.max(30,Math.min(W-30,n.x));
      n.y=Math.max(30,Math.min(H-30,n.y));
    });
  }
  let html=`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`;
  edges.forEach(e=>{
    const a=nodes.find(n=>n.id===e.source),b=nodes.find(n=>n.id===e.target);
    html+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="rgba(106,90,74,${0.3+e.intensity*0.5})" stroke-width="${1+e.intensity}" stroke-dasharray="${e.type==='rival'?'4,3':'none'}"/>`;
  });
  nodes.forEach(n=>{
    const r=n.isProtagonist?18:14;
    const fill=n.isProtagonist?'rgba(212,168,83,0.2)':'rgba(44,37,32,0.8)';
    const stroke=n.isProtagonist?'#d4a853':'#6a5a4a';
    html+=`<circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
    html+=`<text x="${n.x}" y="${n.y+4}" text-anchor="middle" fill="${n.isProtagonist?'#d4a853':'#b8a898'}" font-size="11" font-family="Georgia,serif">${n.name}<\/text>`;
  });
  html+=`<\/svg>`;
  svg.innerHTML=html;
}

let msgIndex=0;
function addMessage(msg){
  const panel=document.getElementById('chat-panel');
  if(msg.type==='system'){
    panel.innerHTML+=`<div class="msg msg-system"><div class="divider">${msg.text}<\/div><\/div>`;
  }else if(msg.type==='assistant'){
    const text=msg.text.replace(/\n/g,'<br>');
    panel.innerHTML+=`<div class="msg msg-assistant"><div class="narrator-tag">📖 叙事引擎<\/div>${text}<\/div>`;
  }else if(msg.type==='user'){
    panel.innerHTML+=`<div class="msg msg-user">${msg.text}<\/div>`;
  }else if(msg.type==='options'){
    panel.innerHTML+=`<div class="msg msg-options">${msg.items.map((o,i)=>`<button class="option-btn" onclick="selectOption(this)">${o}<\/button>`).join('')}<\/div>`;
  }
  panel.scrollTop=panel.scrollHeight;
}
function selectOption(btn){
  document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  setTimeout(()=>nextMessage(),600);
}
function showLoading(){
  const panel=document.getElementById('chat-panel');
  panel.innerHTML+=`<div class="msg msg-assistant" id="loading-msg"><div class="loading-dots"><span><\/span><span><\/span><span><\/span><\/div><\/div>`;
  panel.scrollTop=panel.scrollHeight;
}
function removeLoading(){
  const el=document.getElementById('loading-msg');
  if(el)el.remove();
}
function nextMessage(){
  if(msgIndex>=chatMessages.length)return;
  const msg=chatMessages[msgIndex];
  msgIndex++;
  if(msg.type==='assistant'){
    showLoading();
    setTimeout(()=>{removeLoading();addMessage(msg)},800+Math.random()*600);
  }else{
    addMessage(msg);
  }
  // Auto-continue for non-option messages
  if(msg.type!=='options'&&msgIndex<chatMessages.length){
    const delay=msg.type==='user'?500:1200;
    setTimeout(()=>{
      if(chatMessages[msgIndex]&&chatMessages[msgIndex].type!=='options') nextMessage();
      else if(chatMessages[msgIndex]) nextMessage();
    },delay);
  }
}

// ── Extraction Animation ──
async function runExtraction(){
  const panel=document.getElementById('extract-panel');
  const bar=document.getElementById('extract-bar-fill');
  const steps=['step-pdf','step-char','step-world','step-plot','step-done'];
  panel.classList.remove('hidden');
  for(let i=0;i<steps.length;i++){
    await sleep(600+i*200);
    document.getElementById(steps[i]).classList.add('active');
    bar.style.width=((i+1)/steps.length*100)+'%';
    await sleep(500+i*150);
    document.getElementById(steps[i]).classList.remove('active');
    document.getElementById(steps[i]).classList.add('done');
  }
  await sleep(800);
  panel.classList.add('hidden');
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

// ── Init ──
document.getElementById('btn-demo').addEventListener('click',async()=>{
  document.getElementById('upload-overlay').classList.add('hidden');
  await runExtraction();
  renderCharacters();
  renderWorld();
  renderPlot();
  renderGraph();
  // Start chat demo with delay
  setTimeout(()=>nextMessage(),400);
});
