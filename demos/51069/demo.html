<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能知识卡片 - Smart Knowledge Cards</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .header p { font-size: 16px; opacity: 0.9; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        .input-section {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .input-section h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #444;
        }
        textarea {
            width: 100%;
            min-height: 160px;
            padding: 16px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 15px;
            resize: vertical;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-row { margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap; }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.4); }
        .btn-secondary {
            background: #f0f2f5;
            color: #555;
        }
        .btn-secondary:hover { background: #e4e7ec; }

        .cards-section { margin-bottom: 30px; }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .section-header h2 { font-size: 20px; color: #444; }
        .filter-tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-tag {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #ddd;
            background: white;
            transition: all 0.3s;
        }
        .filter-tag.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #222;
            line-height: 1.4;
        }
        .card-summary {
            font-size: 14px;
            color: #666;
            margin-bottom: 16px;
            line-height: 1.7;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-keypoints {
            margin-bottom: 16px;
        }
        .card-keypoints li {
            list-style: none;
            font-size: 13px;
            color: #555;
            padding: 4px 0;
            padding-left: 18px;
            position: relative;
        }
        .card-keypoints li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 11px;
            width: 6px;
            height: 6px;
            background: #667eea;
            border-radius: 50%;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .tag {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            background: #f0f2f5;
            color: #667eea;
        }
        .card-date { font-size: 12px; color: #aaa; }
        .card-actions { display: flex; gap: 8px; }
        .card-actions button {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            background: #f0f2f5;
            color: #555;
            transition: all 0.2s;
        }
        .card-actions button:hover { background: #667eea; color: white; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state svg { width: 80px; height: 80px; margin-bottom: 16px; opacity: 0.4; }

        .review-section {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .review-card {
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .review-card:hover { border-color: #667eea; }
        .review-card.hidden { display: none; }
        .review-card.show-answer .answer { display: block; }
        .review-card .question { font-weight: 500; color: #333; margin-bottom: 12px; }
        .review-card .answer {
            display: none;
            padding-top: 12px;
            border-top: 1px dashed #ddd;
            color: #555;
            font-size: 14px;
            line-height: 1.7;
        }
        .review-status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 8px;
        }
        .status-due { background: #ffe4e4; color: #c0392b; }
        .status-soon { background: #fff3e0; color: #e67e22; }
        .status-ok { background: #e8f5e9; color: #27ae60; }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        .loading.show { display: block; }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #e8e8e8;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.4s;
            z-index: 1000;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>智能知识卡片</h1>
        <p>将碎片化阅读自动整理为结构化知识，让学习更高效</p>
    </div>

    <div class="container">
        <div class="input-section">
            <h2>粘贴内容，一键生成知识卡片</h2>
            <textarea id="contentInput" placeholder="粘贴文章段落、读书笔记、会议纪要等任意文本...&#10;&#10;示例：&#10;深度学习是机器学习的一个分支，它通过多层神经网络模拟人脑的工作方式。深度学习在图像识别、自然语言处理、语音识别等领域取得了突破性进展。其核心优势在于能够自动从大量数据中提取特征，无需人工设计特征工程。"></textarea>
            <div class="btn-row">
                <button class="btn btn-primary" onclick="generateCard()">生成知识卡片</button>
                <button class="btn btn-secondary" onclick="loadDemo()">载入示例</button>
                <button class="btn btn-secondary" onclick="clearAll()">清空全部</button>
            </div>
            <div class="loading" id="loading">
                <span class="spinner"></span>正在分析内容，提取关键信息...
            </div>
        </div>

        <div class="cards-section">
            <div class="section-header">
                <h2>我的知识卡片 (<span id="cardCount">0</span>)</h2>
                <div class="filter-tags">
                    <span class="filter-tag active" onclick="filterCards('all')">全部</span>
                    <span class="filter-tag" onclick="filterCards('技术')">技术</span>
                    <span class="filter-tag" onclick="filterCards('商业')">商业</span>
                    <span class="filter-tag" onclick="filterCards('科普')">科普</span>
                    <span class="filter-tag" onclick="filterCards('读书笔记')">读书笔记</span>
                </div>
            </div>
            <div class="cards-grid" id="cardsGrid">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M3 9h18M9 21V9"/>
                    </svg>
                    <p>暂无知识卡片，粘贴内容后点击"生成知识卡片"</p>
                </div>
            </div>
        </div>

        <div class="review-section">
            <div class="section-header">
                <h2>间隔复习</h2>
            </div>
            <div id="reviewList">
                <div class="empty-state" style="padding: 30px;">
                    <p>暂无待复习内容</p>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let cards = JSON.parse(localStorage.getItem('knowledgeCards') || '[]');
        let currentFilter = 'all';

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function extractTitle(text) {
            const sentences = text.split(/[。！？.!?]/).filter(s => s.trim());
            if (!sentences.length) return '未命名卡片';
            let title = sentences[0].trim();
            if (title.length > 30) title = title.substring(0, 30) + '...';
            return title;
        }

        function extractSummary(text) {
            const sentences = text.split(/[。！？.!?]/).filter(s => s.trim());
            if (sentences.length <= 2) return text;
            return sentences.slice(0, 2).join('。') + '。';
        }

        function extractKeyPoints(text) {
            const sentences = text.split(/[。！？.!?]/).filter(s => s.trim());
            const points = [];
            for (const s of sentences) {
                const t = s.trim();
                if (t.length > 10 && (t.includes('是') || t.includes('通过') || t.includes('核心') || t.includes('关键') || t.includes('优势') || t.includes('特点') || t.includes('方法') || t.includes('技术'))) {
                    points.push(t);
                }
                if (points.length >= 3) break;
            }
            if (points.length < 2) {
                for (const s of sentences) {
                    const t = s.trim();
                    if (t.length > 10 && !points.includes(t)) points.push(t);
                    if (points.length >= 3) break;
                }
            }
            return points.slice(0, 3);
        }

        function classifyTag(text) {
            const lower = text.toLowerCase();
            if (/深度学习|神经网络|算法|代码|编程|前端|后端|数据库|API/.test(text)) return '技术';
            if (/市场|营销|品牌|用户|产品|商业模式|盈利|创业/.test(text)) return '商业';
            if (/书|作者|章节|阅读|笔记|理论|概念/.test(text)) return '读书笔记';
            return '科普';
        }

        function generateCard() {
            const input = document.getElementById('contentInput');
            const text = input.value.trim();
            if (!text) { showToast('请先粘贴内容'); return; }

            document.getElementById('loading').classList.add('show');

            setTimeout(() => {
                const card = {
                    id: Date.now(),
                    title: extractTitle(text),
                    summary: extractSummary(text),
                    keyPoints: extractKeyPoints(text),
                    tag: classifyTag(text),
                    fullText: text,
                    date: new Date().toLocaleDateString('zh-CN'),
                    reviewCount: 0,
                    nextReview: Date.now() + 24 * 60 * 60 * 1000
                };
                cards.unshift(card);
                saveCards();
                input.value = '';
                document.getElementById('loading').classList.remove('show');
                renderCards();
                renderReview();
                showToast('知识卡片生成成功！');
            }, 800);
        }

        function saveCards() {
            localStorage.setItem('knowledgeCards', JSON.stringify(cards));
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            const filtered = currentFilter === 'all' ? cards : cards.filter(c => c.tag === currentFilter);
            document.getElementById('cardCount').textContent = cards.length;

            if (!filtered.length) {
                grid.innerHTML = '<div class="empty-state"><p>该分类下暂无卡片</p></div>';
                return;
            }

            grid.innerHTML = filtered.map(card => `
                <div class="card">
                    <div class="card-title">${escapeHtml(card.title)}</div>
                    <div class="card-summary">${escapeHtml(card.summary)}</div>
                    <ul class="card-keypoints">
                        ${card.keyPoints.map(p => `<li>${escapeHtml(p)}</li>`).join('')}
                    </ul>
                    <div class="card-footer">
                        <div class="card-tags">
                            <span class="tag">${card.tag}</span>
                        </div>
                        <div class="card-actions">
                            <span class="card-date">${card.date}</span>
                            <button onclick="viewFull(${card.id})">查看全文</button>
                            <button onclick="deleteCard(${card.id})">删除</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderReview() {
            const list = document.getElementById('reviewList');
            const now = Date.now();
            const reviewCards = cards
                .map(c => ({ ...c, diff: c.nextReview - now }))
                .sort((a, b) => a.diff - b.diff)
                .slice(0, 5);

            if (!reviewCards.length) {
                list.innerHTML = '<div class="empty-state" style="padding:30px"><p>暂无待复习内容</p></div>';
                return;
            }

            list.innerHTML = reviewCards.map(card => {
                const diff = card.nextReview - now;
                let statusClass, statusText;
                if (diff <= 0) { statusClass = 'status-due'; statusText = '待复习'; }
                else if (diff < 24 * 60 * 60 * 1000) { statusClass = 'status-soon'; statusText = '即将到期'; }
                else { statusClass = 'status-ok'; statusText = '已掌握'; }

                return `
                <div class="review-card" onclick="toggleReview(this, ${card.id})">
                    <div class="question">
                        ${escapeHtml(card.title)}
                        <span class="review-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="answer">
                        <strong>核心要点：</strong><br>
                        ${card.keyPoints.map(p => '• ' + escapeHtml(p)).join('<br>')}<br><br>
                        <strong>详细内容：</strong><br>
                        ${escapeHtml(card.fullText.substring(0, 200))}...
                        <br><br>
                        <button class="btn btn-primary" style="padding:8px 16px;font-size:13px;" onclick="event.stopPropagation();markReviewed(${card.id})">标记已复习</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function toggleReview(el, id) {
            el.classList.toggle('show-answer');
        }

        function markReviewed(id) {
            const card = cards.find(c => c.id === id);
            if (card) {
                card.reviewCount++;
                const intervals = [1, 3, 7, 14, 30];
                const days = intervals[Math.min(card.reviewCount, intervals.length - 1)];
                card.nextReview = Date.now() + days * 24 * 60 * 60 * 1000;
                saveCards();
                renderReview();
                showToast('已标记复习，下次提醒：' + days + '天后');
            }
        }

        function filterCards(tag) {
            currentFilter = tag;
            document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderCards();
        }

        function viewFull(id) {
            const card = cards.find(c => c.id === id);
            if (!card) return;
            alert('【' + card.title + '】\n\n' + card.fullText);
        }

        function deleteCard(id) {
            if (!confirm('确定删除这张卡片吗？')) return;
            cards = cards.filter(c => c.id !== id);
            saveCards();
            renderCards();
            renderReview();
            showToast('卡片已删除');
        }

        function clearAll() {
            if (!confirm('确定清空所有卡片吗？此操作不可恢复。')) return;
            cards = [];
            saveCards();
            renderCards();
            renderReview();
            showToast('已清空全部卡片');
        }

        function loadDemo() {
            const demos = [
                '深度学习是机器学习的一个分支，它通过多层神经网络模拟人脑的工作方式。深度学习在图像识别、自然语言处理、语音识别等领域取得了突破性进展。其核心优势在于能够自动从大量数据中提取特征，无需人工设计特征工程。卷积神经网络（CNN）适合图像任务，循环神经网络（RNN）适合序列数据，而Transformer架构则成为了现代大语言模型的基础。',
                '用户增长的核心在于找到产品价值与用户需求的最佳匹配点。AARRR模型（获取、激活、留存、收益、推荐）是经典的增长框架。在实践中，数据驱动决策比直觉更可靠，需要通过A/B测试验证假设。同时，增长不是单一团队的责任，而是产品、技术、运营、市场协同的结果。北极星指标的选择至关重要，它应该能反映产品的核心价值。',
                '《原子习惯》提出，习惯的形成依赖于四个步骤：提示、渴望、反应和奖励。要培养好习惯，可以让提示显而易见，让渴望有吸引力，让反应简便易行，让奖励令人满足。相反，要戒除坏习惯则反向操作。作者强调，每天进步1%，一年后你会进步37倍；而每天退步1%，一年后你会趋近于零。'
            ];
            const pick = demos[Math.floor(Math.random() * demos.length)];
            document.getElementById('contentInput').value = pick;
            showToast('示例已载入，点击生成即可');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        renderCards();
        renderReview();
    </script>
</body>
</html>
