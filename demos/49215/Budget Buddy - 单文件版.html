<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Budget Buddy - 专业的多场景活动预算规划工具，支持企业运营、商务活动、个人庆典等全场景预算方案">
  <title>Budget Buddy - 多场景活动预算规划专家</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <style>
/* Budget Buddy - 全局样式 */

/* CSS Variables */
:root {
  --primary: #1a56db;
  --primary-light: #3b82f6;
  --primary-dark: #1e40af;
  --secondary: #7c3aed;
  --accent: #f59e0b;
  --success: #10b981;
  --error: #ef4444;
  --warning: #f59e0b;
  --info: #3b82f6;
  
  --bg-primary: #ffffff;
  --bg-secondary: #f8fafc;
  --bg-tertiary: #f1f5f9;
  
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  
  --border: #e2e8f0;
  --border-light: #f1f5f9;
  
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  
  --radius-sm: 6px;
  --radius: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;
  
  --transition-fast: 150ms ease;
  --transition: 200ms ease;
  --transition-slow: 300ms ease;
}

/* Reset & Base */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  max-width: 100%;
  height: auto;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

input, select, textarea {
  font-family: inherit;
  font-size: inherit;
}

/* App Container */
#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Navbar */
.navbar {
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.nav-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 1.25rem;
  color: var(--primary);
}

.logo-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border-radius: var(--radius);
  color: white;
}

.logo-icon svg {
  width: 24px;
  height: 24px;
}

.nav-links {
  display: flex;
  gap: 8px;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius);
  color: var(--text-secondary);
  font-weight: 500;
  transition: all var(--transition);
}

.nav-link:hover {
  background: var(--bg-tertiary);
  color: var(--text-primary);
}

.nav-link.active {
  background: var(--primary);
  color: white;
}

.nav-icon {
  display: flex;
}

.nav-auth {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-menu {
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-name {
  font-weight: 500;
  color: var(--text-secondary);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: var(--radius);
  font-weight: 500;
  font-size: 0.875rem;
  transition: all var(--transition);
  white-space: nowrap;
}

.btn svg {
  width: 18px;
  height: 18px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  box-shadow: 0 2px 8px rgba(26, 86, 219, 0.3);
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(26, 86, 219, 0.4);
}

.btn-outline {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-primary);
}

.btn-outline:hover {
  background: var(--bg-tertiary);
  border-color: var(--text-muted);
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
}

.btn-ghost:hover {
  background: var(--bg-tertiary);
  color: var(--text-primary);
}

.btn-lg {
  padding: 14px 28px;
  font-size: 1rem;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 0.75rem;
}

.btn-block {
  width: 100%;
}

.btn-icon {
  padding: 8px;
  border-radius: var(--radius-sm);
}

/* Main Content */
.main-content {
  flex: 1;
}

/* Hero Section */
.hero {
  position: relative;
  padding: 80px 24px;
  background: linear-gradient(135deg, #1a56db 0%, #3730a3 50%, #1e1b4b 100%);
  overflow: hidden;
}

.hero-bg {
  position: absolute;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}

.hero-content {
  position: relative;
  max-width: 800px;
  margin: 0 auto;
  text-align: center;
}

.hero-title {
  font-size: 3.5rem;
  font-weight: 800;
  color: white;
  margin-bottom: 16px;
  letter-spacing: -0.02em;
}

.hero-subtitle {
  font-size: 1.25rem;
  color: rgba(255, 255, 255, 0.8);
  margin-bottom: 40px;
}

.hero-search {
  display: flex;
  gap: 12px;
  max-width: 600px;
  margin: 0 auto 32px;
}

.search-box {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 12px;
  background: white;
  padding: 0 20px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
}

.search-box svg {
  color: var(--text-muted);
}

.search-box input {
  flex: 1;
  border: none;
  outline: none;
  padding: 16px 0;
  font-size: 1rem;
}

.hero-tags {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

.tag {
  padding: 8px 16px;
  background: rgba(255, 255, 255, 0.15);
  color: white;
  border-radius: var(--radius-full);
  font-size: 0.875rem;
  cursor: pointer;
  transition: all var(--transition);
  backdrop-filter: blur(4px);
}

.tag:hover {
  background: rgba(255, 255, 255, 0.25);
  transform: translateY(-2px);
}

/* Sections */
.section {
  padding: 64px 24px;
  max-width: 1400px;
  margin: 0 auto;
}

.section-header {
  text-align: center;
  margin-bottom: 48px;
}

.section-title {
  font-size: 2rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.section-desc {
  color: var(--text-secondary);
  font-size: 1rem;
}

.section-actions {
  display: flex;
  gap: 8px;
}

/* Categories Grid */
.categories-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 24px;
}

.category-card {
  background: var(--bg-primary);
  border-radius: var(--radius-lg);
  padding: 28px;
  box-shadow: var(--shadow);
  transition: all var(--transition);
  border: 1px solid var(--border);
}

.category-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}

.category-icon {
  width: 56px;
  height: 56px;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--cat-color), color-mix(in srgb, var(--cat-color) 70%, black));
  color: white;
  margin-bottom: 16px;
}

.category-icon svg {
  width: 28px;
  height: 28px;
}

.category-name {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 12px;
}

.category-scenes {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.scene-tag {
  padding: 4px 10px;
  background: var(--bg-tertiary);
  border-radius: var(--radius-sm);
  font-size: 0.75rem;
  color: var(--text-secondary);
  transition: all var(--transition);
}

.scene-tag:hover {
  background: var(--primary);
  color: white;
}

.category-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--primary);
  font-size: 0.875rem;
  font-weight: 500;
}

.category-link:hover {
  text-decoration: underline;
}

/* Popular Grid */
.popular-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 24px;
}

.popular-card {
  display: block;
  background: var(--bg-primary);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: all var(--transition);
}

.popular-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}

.popular-card-inner {
  padding: 24px;
  position: relative;
}

.popular-badge {
  position: absolute;
  top: 16px;
  right: 16px;
  padding: 4px 10px;
  background: var(--primary);
  color: white;
  border-radius: var(--radius-sm);
  font-size: 0.75rem;
}

.popular-card h4 {
  font-size: 1.125rem;
  font-weight: 600;
  margin-bottom: 8px;
}

.popular-card p {
  color: var(--text-secondary);
  font-size: 0.875rem;
  margin-bottom: 16px;
}

.popular-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--primary);
  font-weight: 600;
}

/* Features Section */
.features-section {
  background: var(--bg-primary);
  margin: 0 24px;
  border-radius: var(--radius-xl);
  padding: 80px 48px;
}

.features-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 32px;
}

.feature-card {
  text-align: center;
  padding: 32px;
}

.feature-icon {
  width: 72px;
  height: 72px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border-radius: var(--radius-lg);
  color: white;
}

.feature-card h3 {
  font-size: 1.125rem;
  font-weight: 600;
  margin-bottom: 8px;
}

.feature-card p {
  color: var(--text-secondary);
  font-size: 0.875rem;
}

/* Footer */
.footer {
  background: var(--bg-primary);
  border-top: 1px solid var(--border);
  padding: 48px 24px;
  margin-top: auto;
}

.footer-container {
  max-width: 1400px;
  margin: 0 auto;
  text-align: center;
}

.footer-brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 1.25rem;
  color: var(--primary);
  margin-bottom: 12px;
}

.footer-desc {
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.footer-copy {
  color: var(--text-muted);
  font-size: 0.875rem;
}

/* Breadcrumb */
.breadcrumb {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px 24px 0;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.875rem;
  color: var(--text-secondary);
}

.breadcrumb a:hover {
  color: var(--primary);
}

.breadcrumb span:last-child {
  color: var(--text-primary);
  font-weight: 500;
}

/* Scenario Header */
.scenario-header {
  max-width: 1400px;
  margin: 0 auto;
  padding: 40px 24px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 40px;
}

.scenario-badge {
  display: inline-block;
  padding: 6px 14px;
  color: white;
  border-radius: var(--radius-sm);
  font-size: 0.75rem;
  font-weight: 600;
  margin-bottom: 12px;
}

.scenario-title {
  font-size: 2.5rem;
  font-weight: 700;
  margin-bottom: 12px;
}

.scenario-desc {
  color: var(--text-secondary);
  font-size: 1.125rem;
  margin-bottom: 20px;
}

.scenario-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.meta-item {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-secondary);
  font-size: 0.875rem;
}

.meta-item svg {
  color: var(--primary);
}

.scenario-actions {
  display: flex;
  gap: 12px;
  flex-shrink: 0;
}

/* Scenario Content */
.scenario-content {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px 64px;
  display: grid;
  gap: 48px;
}

.content-section {
  background: var(--bg-primary);
  border-radius: var(--radius-lg);
  padding: 32px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}

.chart-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 32px;
}

.chart-container svg {
  max-width: 100%;
}

.chart-legend {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg-secondary);
  border-radius: var(--radius-sm);
}

.legend-color {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  flex-shrink: 0;
}

.legend-name {
  flex: 1;
  font-size: 0.875rem;
}

.legend-percent {
  font-weight: 600;
  color: var(--primary);
  font-size: 0.875rem;
}

/* Budget Items */
.budget-items-grid {
  display: grid;
  gap: 16px;
}

.budget-item {
  background: var(--bg-secondary);
  border-radius: var(--radius);
  padding: 20px;
  border: 2px solid transparent;
  transition: all var(--transition);
}

.budget-item.selected {
  border-color: var(--primary);
  background: rgba(26, 86, 219, 0.05);
}

.budget-item-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}

.checkbox-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.checkbox-wrapper input {
  position: absolute;
  opacity: 0;
  cursor: pointer;
}

.checkmark {
  width: 22px;
  height: 22px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-primary);
  transition: all var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}

.checkbox-wrapper input:checked ~ .checkmark {
  background: var(--primary);
  border-color: var(--primary);
}

.checkbox-wrapper input:checked ~ .checkmark::after {
  content: '';
  width: 6px;
  height: 10px;
  border: solid white;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
  margin-bottom: 2px;
}

.budget-item-info {
  flex: 1;
}

.budget-item-name {
  font-weight: 600;
  margin-bottom: 2px;
}

.budget-item-tip {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.badge {
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  font-size: 0.75rem;
  font-weight: 600;
}

.badge-required {
  background: var(--accent);
  color: white;
}

.budget-item-range {
  display: flex;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--bg-primary);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
}

.range-label {
  color: var(--text-muted);
  font-size: 0.75rem;
}

.range-value {
  font-weight: 600;
  color: var(--text-primary);
}

.budget-item-amount {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.budget-item-amount span:first-child {
  color: var(--text-muted);
  font-size: 0.75rem;
}

.budget-item-amount .amount {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--primary);
}

/* Recommendations */
.recommendations-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.recommendation-card {
  background: var(--bg-secondary);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all var(--transition);
  border: 2px solid transparent;
}

.recommendation-card:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
}

.rec-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.rec-header h4 {
  font-weight: 600;
}

.rec-budget {
  font-weight: 700;
  color: var(--primary);
}

.rec-items {
  font-size: 0.875rem;
  color: var(--text-secondary);
  margin-bottom: 12px;
}

.rec-progress {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 8px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  border-radius: 3px;
  transition: width var(--transition);
}

.rec-status {
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* Export Section */
.export-section {
  text-align: center;
}

.export-buttons {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 24px;
}

.export-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 24px 40px;
  background: var(--bg-secondary);
  border-radius: var(--radius);
  transition: all var(--transition);
}

.export-btn:hover {
  background: var(--primary);
  color: white;
  transform: translateY(-2px);
}

.export-icon {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-primary);
  border-radius: var(--radius);
}

.export-btn span:last-child {
  font-weight: 600;
}

/* DIY Layout */
.diy-layout {
  display: grid;
  grid-template-columns: 300px 1fr 280px;
  gap: 24px;
  max-width: 1600px;
  margin: 0 auto;
  padding: 24px;
  min-height: calc(100vh - 64px);
}

.diy-sidebar {
  background: var(--bg-primary);
  border-radius: var(--radius-lg);
  padding: 24px;
  border: 1px solid var(--border);
  height: fit-content;
  position: sticky;
  top: 88px;
}

.sidebar-header h2 {
  font-size: 1.25rem;
  margin-bottom: 16px;
}

.filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}

.chip {
  padding: 6px 12px;
  background: var(--bg-secondary);
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  cursor: pointer;
  transition: all var(--transition);
  border: 1px solid transparent;
}

.chip:hover {
  border-color: var(--primary);
}

.chip.active {
  background: var(--primary);
  color: white;
}

.scenario-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: 500px;
  overflow-y: auto;
}

.scenario-list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px;
  background: var(--bg-secondary);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
}

  <script>
// Budget Buddy - 用户认证模块

const Auth = {
  STORAGE_KEY: 'budget_master_user',
  SESSION_KEY: 'budget_master_session',

  // 获取当前会话
  getSession() {
    const session = localStorage.getItem(this.SESSION_KEY);
    return session ? JSON.parse(session) : { isLoggedIn: false, userId: null };
  },

  // 获取用户数据
  getUser() {
    const session = this.getSession();
    if (!session.isLoggedIn) return null;
    const users = this.getAllUsers();
    return users.find(u => u.id === session.userId) || null;
  },

  // 获取所有用户
  getAllUsers() {
    const data = localStorage.getItem(this.STORAGE_KEY);
    return data ? JSON.parse(data) : [];
  },

  // 保存用户列表
  saveUsers(users) {
    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(users));
  },

  // 注册
  register(email, password, phone = '') {
    const users = this.getAllUsers();
    
    // 检查邮箱是否已存在
    if (users.some(u => u.email === email)) {
      return { success: false, message: '该邮箱已被注册' };
    }

    const newUser = {
      id: 'user_' + Date.now(),
      email,
      password: this.hashPassword(password),
      phone,
      createdAt: new Date().toISOString(),
      plans: [],
      exportHistory: []
    };

    users.push(newUser);
    this.saveUsers(users);

    // 自动登录
    this.login(email, password);
    return { success: true, message: '注册成功' };
  },

  // 登录
  login(email, password) {
    const users = this.getAllUsers();
    const user = users.find(u => u.email === email && u.password === this.hashPassword(password));

    if (!user) {
      return { success: false, message: '邮箱或密码错误' };
    }

    const session = { isLoggedIn: true, userId: user.id };
    localStorage.setItem(this.SESSION_KEY, JSON.stringify(session));
    return { success: true, message: '登录成功', user };
  },

  // 登出
  logout() {
    const session = { isLoggedIn: false, userId: null };
    localStorage.setItem(this.SESSION_KEY, JSON.stringify(session));
  },

  // 检查是否登录
  isLoggedIn() {
    return this.getSession().isLoggedIn;
  },

  // 简单密码哈希
  hashPassword(password) {
    let hash = 0;
    for (let i = 0; i < password.length; i++) {
      const char = password.charCodeAt(i);
      hash = ((hash << 5) - hash) + char;
      hash = hash & hash;
    }
    return hash.toString();
  },

  // 更新用户信息
  updateUser(userId, updates) {
    const users = this.getAllUsers();
    const index = users.findIndex(u => u.id === userId);
    if (index === -1) return false;

    users[index] = { ...users[index], ...updates };
    this.saveUsers(users);
    return true;
  },

  // 保存预算方案
  savePlan(userId, plan) {
    const users = this.getAllUsers();
    const user = users.find(u => u.id === userId);
    if (!user) return null;

    if (!plan.id) {
      plan.id = 'plan_' + Date.now();
      plan.createdAt = new Date().toISOString();
    }

    const existingIndex = user.plans.findIndex(p => p.id === plan.id);
    if (existingIndex >= 0) {
      user.plans[existingIndex] = plan;
    } else {
      user.plans.push(plan);
    }

    this.saveUsers(users);
    return plan;
  },

  // 删除预算方案
  deletePlan(userId, planId) {
    const users = this.getAllUsers();
    const user = users.find(u => u.id === userId);
    if (!user) return false;

    user.plans = user.plans.filter(p => p.id !== planId);
    this.saveUsers(users);
    return true;
  },

  // 添加导出历史
  addExportHistory(userId, exportRecord) {
    const users = this.getAllUsers();
    const user = users.find(u => u.id === userId);
    if (!user) return false;

    exportRecord.id = 'export_' + Date.now();
    exportRecord.createdAt = new Date().toISOString();
    user.exportHistory = user.exportHistory || [];
    user.exportHistory.unshift(exportRecord);
    
    // 只保留最近20条记录
    if (user.exportHistory.length > 20) {
      user.exportHistory = user.exportHistory.slice(0, 20);
    }

    this.saveUsers(users);
    return true;
  },

  // 获取用户方案
  getUserPlans(userId) {
    const users = this.getAllUsers();
    const user = users.find(u => u.id === userId);
    return user ? user.plans : [];
  }
};

window.Auth = Auth;

  </script>

  <script>
// Budget Buddy - 导出功能模块

const Export = {
  // 准备导出数据
  prepareData(plan) {
    const data = [];
    let total = 0;

    plan.items.forEach(item => {
      const amount = (item.min + item.max) / 2;
      total += amount;
      data.push({
        '项目名称': item.name,
        '最低预算': item.min,
        '最高预算': item.max,
        '平均预算': Math.round(amount),
        '是否必选': item.required ? '是' : '否',
        '备注': item.tips || ''
      });
    });

    data.push({
      '项目名称': '合计',
      '最低预算': '',
      '最高预算': '',
      '平均预算': Math.round(total),
      '是否必选': '',
      '备注': ''
    });

    return data;
  },

  // 导出为Excel
  async exportToExcel(plan, filename = '预算方案') {
    try {
      const data = this.prepareData(plan);
      
      // 动态加载 SheetJS
      if (!window.XLSX) {
        await this.loadScript('https://cdn.sheetjs.com/xlsx-0.18.5/package/dist/xlsx.full.min.js');
      }

      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '预算表');

      // 设置列宽
      ws['!cols'] = [
        { wch: 20 }, // 项目名称
        { wch: 12 }, // 最低预算
        { wch: 12 }, // 最高预算
        { wch: 12 }, // 平均预算
        { wch: 10 }, // 是否必选
        { wch: 30 }  // 备注
      ];

      XLSX.writeFile(wb, `${filename}.xlsx`);
      return { success: true, message: 'Excel导出成功' };
    } catch (error) {
      console.error('Excel导出失败:', error);
      return { success: false, message: 'Excel导出失败: ' + error.message };
    }
  },

  // 导出为PDF
  async exportToPDF(plan, filename = '预算方案') {
    try {
      const data = this.prepareData(plan);
      
      // 动态加载 jsPDF
      if (!window.jspdf) {
        await this.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      }
      if (!window.jspdf.jsPDF) {
        await this.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // 标题
      doc.setFontSize(20);
      doc.setTextColor(26, 86, 219);
      doc.text('活动预算方案', 105, 20, { align: 'center' });

      // 方案名称
      doc.setFontSize(14);
      doc.setTextColor(51, 51, 51);
      doc.text(plan.name, 105, 30, { align: 'center' });

      // 日期
      doc.setFontSize(10);
      doc.setTextColor(128, 128, 128);
      doc.text(`生成日期: ${new Date().toLocaleDateString('zh-CN')}`, 105, 38, { align: 'center' });

      // 表格数据
      doc.autoTable({
        startY: 45,
        head: [['项目名称', '最低预算', '最高预算', '平均预算', '必选']],
        body: data.map(item => [
          item['项目名称'],
          item['最低预算'] ? `¥${item['最低预算'].toLocaleString()}` : '',
          item['最高预算'] ? `¥${item['最高预算'].toLocaleString()}` : '',
          item['平均预算'] ? `¥${item['平均预算'].toLocaleString()}` : '',
          item['是否必选']
        ]),
        styles: {
          fontSize: 9,
          cellPadding: 3
        },
        headStyles: {
          fillColor: [26, 86, 219],
          textColor: 255,
          fontStyle: 'bold'
        },
        alternateRowStyles: {
          fillColor: [245, 247, 250]
        }
      });

      // 页脚
      const pageCount = doc.internal.getNumberOfPages();
      for (let i = 1; i <= pageCount; i++) {
        doc.setPage(i);
        doc.setFontSize(8);
        doc.setTextColor(128, 128, 128);
        doc.text(`第 ${i} / ${pageCount} 页`, 105, 290, { align: 'center' });
      }

      doc.save(`${filename}.pdf`);
      return { success: true, message: 'PDF导出成功' };
    } catch (error) {
      console.error('PDF导出失败:', error);
      return { success: false, message: 'PDF导出失败: ' + error.message };
    }
  },

  // 导出为PPT
  async exportToPPT(plan, filename = '预算方案') {
    try {
      // 动态加载 PptxGenJS
      if (!window.PptxGenJS) {
        await this.loadScript('https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js');
      }

      const pptx = new PptxGenJS();
      
      // 设置主题色
      pptx.defineTheme({
        primary: '1a56db',
        secondary: '7c3aed',
        background: 'ffffff',
        text: '333333'
      });

      // 标题页
      const slide1 = pptx.addSlide();
      slide1.addText('活动预算方案', {
        x: 0.5,
        y: 2,
        w: 9,
        h: 1,
        fontSize: 36,
        bold: true,
        color: '1a56db',
        align: 'center'
      });
      slide1.addText(plan.name, {
        x: 0.5,
        y: 3.2,
        w: 9,
        h: 0.6,
        fontSize: 24,
        color: '666666',
        align: 'center'
      });
      slide1.addText(`生成日期: ${new Date().toLocaleDateString('zh-CN')}`, {
        x: 0.5,
        y: 4,
        w: 9,
        h: 0.4,
        fontSize: 14,
        color: '999999',
        align: 'center'
      });

      // 数据页
      const slide2 = pptx.addSlide();
      slide2.addText('预算明细', {
        x: 0.5,
        y: 0.3,
        w: 9,
        h: 0.6,
        fontSize: 24,
        bold: true,
        color: '1a56db'
      });

      // 表格数据
      const tableData = [
        [{ text: '项目名称', options: { fill: '1a56db', color: 'ffffff', bold: true } },
         { text: '预算范围', options: { fill: '1a56db', color: 'ffffff', bold: true } },
         { text: '平均预算', options: { fill: '1a56db', color: 'ffffff', bold: true } },
         { text: '必选', options: { fill: '1a56db', color: 'ffffff', bold: true } }]
      ];

      plan.items.forEach(item => {
        const avg = Math.round((item.min + item.max) / 2);
        tableData.push([
          item.name,
          `¥${item.min.toLocaleString()} - ¥${item.max.toLocaleString()}`,
          `¥${avg.toLocaleString()}`,
          item.required ? '是' : '否'
        ]);
      });

      // 计算总计
      const total = plan.items.reduce((sum, item) => sum + (item.min + item.max) / 2, 0);
      tableData.push([
        { text: '合计', options: { bold: true, fill: 'f3f4f6' } },
        { text: '', options: { fill: 'f3f4f6' } },
        { text: { text: `¥${Math.round(total).toLocaleString()}`, options: { bold: true, fill: 'f3f4f6' } },
        { text: '', options: { fill: 'f3f4f6' } }
      ]);

      slide2.addTable(tableData, {
        x: 0.5,
        y: 1,
        w: 9,
        colW: [3, 3, 1.5, 1.5],
        border: { pt: 0.5, color: 'e5e7eb' },
        fontFace: 'Microsoft YaHei',
        fontSize: 11
      });

      // 推荐方案页（如果有）
      if (plan.recommendations && plan.recommendations.length > 0) {
        const slide3 = pptx.addSlide();
        slide3.addText('推荐方案', {
          x: 0.5,
          y: 0.3,
          w: 9,
          h: 0.6,
          fontSize: 24,
          bold: true,
          color: '1a56db'
        });

        plan.recommendations.forEach((rec, index) => {
          const y = 1.2 + index * 1.2;
          slide3.addShape(pptx.ShapeType.roundRect, {
            x: 0.5,
            y: y,
            w: 9,
            h: 1,
            fill: { color: 'f8fafc' },
            line: { color: 'e2e8f0', width: 1 }
          });
          slide3.addText(rec.name, {
            x: 0.7,
            y: y + 0.1,
            w: 4,
            h: 0.4,
            fontSize: 14,
            bold: true,
            color: '1a56db'
          });
          slide3.addText(`预算: ¥${rec.budget.toLocaleString()}`, {
            x: 0.7,
            y: y + 0.5,
            w: 4,
            h: 0.3,
            fontSize: 12,
            color: '666666'
          });
          slide3.addText(`包含: ${rec.items.join('、')}`, {
            x: 5,
            y: y + 0.3,
            w: 4.3,
            h: 0.4,
            fontSize: 10,
            color: '999999'
          });
        });
      }

      await pptx.writeFile({ fileName: `${filename}.pptx` });
      return { success: true, message: 'PPT导出成功' };
    } catch (error) {
      console.error('PPT导出失败:', error);
      return { success: false, message: 'PPT导出失败: ' + error.message };
    }
  },

  // 动态加载脚本
  loadScript(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  },

  // 导出（统一入口）
  async export(plan, format, filename) {
    filename = filename || plan.name || '预算方案';
    
    switch (format.toLowerCase()) {
      case 'excel':
      case 'xlsx':
        return await this.exportToExcel(plan, filename);
      case 'pdf':
        return await this.exportToPDF(plan, filename);
      case 'ppt':
      case 'pptx':
        return await this.exportToPPT(plan, filename);
      default:
        return { success: false, message: '不支持的格式' };
    }
  }
};

window.Export = Export;

  </script>

  // 创建饼图SVG
  createPieChart(items, size = 200) {
    const total = items.reduce((sum, item) => sum + (item.min + item.max) / 2, 0);
    let currentAngle = -90;
    const colors = ['#1a56db', '#7c3aed', '#059669', '#d97706', '#dc2626', '#db2777', '#0891b2', '#4f46e5'];
    
    const paths = items.map((item, index) => {
      const value = (item.min + item.max) / 2;
      const percentage = (value / total) * 100;
      const angle = (percentage / 100) * 360;
      
      const startAngle = currentAngle;
      const endAngle = currentAngle + angle;
      currentAngle = endAngle;
      
      const x1 = size / 2 + (size / 2 - 10) * Math.cos(startAngle * Math.PI / 180);
      const y1 = size / 2 + (size / 2 - 10) * Math.sin(startAngle * Math.PI / 180);
      const x2 = size / 2 + (size / 2 - 10) * Math.cos(endAngle * Math.PI / 180);
      const y2 = size / 2 + (size / 2 - 10) * Math.sin(endAngle * Math.PI / 180);
      
      const largeArc = angle > 180 ? 1 : 0;
      const color = colors[index % colors.length];
      
      if (angle >= 359.9) {
        return `<circle cx="${size/2}" cy="${size/2}" r="${size/2 - 10}" fill="${color}"/>`;
      }
      
      return `<path d="M${size/2},${size/2} L${x1},${y1} A${size/2 - 10},${size/2 - 10} 0 ${largeArc},1 ${x2},${y2} Z" fill="${color}"/>`;
    });

    const legend = items.map((item, index) => {
      const avg = Math.round((item.min + item.max) / 2);
      const percentage = ((item.min + item.max) / 2 / total * 100).toFixed(1);
      return `
        <div class="legend-item">
          <span class="legend-color" style="background: ${colors[index % colors.length]}"></span>
          <span class="legend-name">${item.name}</span>
          <span class="legend-percent">${percentage}%</span>
        </div>
      `;
    }).join('');

    return `
      <div class="chart-container">
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
          ${paths.join('')}
        </svg>
      </div>
      <div class="chart-legend">
        ${legend}
      </div>
    `;
  },

  // 格式化数字
  formatNumber(num) {
    return num.toLocaleString('zh-CN');
  },

  // 格式化日期
  formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('zh-CN', {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    });
  }
};

  <script>
// Budget Buddy - 路由模块

const Router = {
  routes: {},
  currentRoute: null,

  // 注册路由
  register(path, handler) {
    this.routes[path] = handler;
  },

  // 路由匹配
  match(path) {
    // 精确匹配
    if (this.routes[path]) {
      return { path, handler: this.routes[path], params: {} };
    }

    // 参数匹配 (如 #scenario/annual_party)
    for (const route in this.routes) {
      const pattern = route.replace(/:([^/]+)/g, '([^/]+)');
      const regex = new RegExp(`^${pattern}$`);
      const match = path.match(regex);
      
      if (match) {
        const params = {};
        const paramNames = (route.match(/:([^/]+)/g) || []).map(p => p.slice(1));
        paramNames.forEach((name, index) => {
          params[name] = match[index + 1];
        });
        return { path: route, handler: this.routes[route], params };
      }
    }

    return null;
  },

  // 导航到路由
  navigate(path) {
    window.location.hash = path;
  },

  // 处理路由变化
  handleRoute() {
    const hash = window.location.hash.slice(1) || 'home';
    const matched = this.match(hash);

    if (matched) {
      this.currentRoute = matched.path;
      matched.handler(matched.params);
    } else {
      // 404 - 返回首页
      this.navigate('home');
    }
  },

  // 初始化路由
  init() {
    window.addEventListener('hashchange', () => this.handleRoute());
    window.addEventListener('load', () => this.handleRoute());
    
    // 代理点击事件，支持 data-nav 属性
    document.addEventListener('click', (e) => {
      const navLink = e.target.closest('[data-nav]');
      if (navLink) {
        e.preventDefault();
        const href = navLink.getAttribute('href');
        if (href && href.startsWith('#')) {
          this.navigate(href.slice(1));
        }
      }
    });
  }
};

window.Router = Router;

  </script>

    if (password !== confirmPassword) {
      UI.showToast('两次密码输入不一致', 'error');
      return;
    }

    const result = Auth.register(email, password);
    if (result.success) {

  // 保存场景方案
  saveScenario() {
    if (!Auth.isLoggedIn()) {
      UI.showToast('请先登录', 'info');
      Router.navigate('login');
      return;
    }

    const scenario = this.currentScenario;
    const selectedItems = [];
    
    document.querySelectorAll('[data-item-index]').forEach((checkbox, index) => {
      if (checkbox.checked) {
        selectedItems.push(scenario.items[index]);
      }
    });

    const plan = {
      name: scenario.name + '方案',
      scenarioId: scenario.id,
      items: selectedItems,
      totalBudget: selectedItems.reduce((sum, item) => sum + (item.min + item.max) / 2, 0)
    };

    Auth.savePlan(Auth.getSession().userId, plan);
    UI.showToast('方案已保存', 'success');
  },

  // 复制方案
  copyScenario() {
    if (!Auth.isLoggedIn()) {
      UI.showToast('请先登录', 'info');
      Router.navigate('login');
      return;
    }

    this.saveScenario();
    UI.showToast('方案已复制到个人中心', 'success');
  },

  // 更新场景图表
  updateScenarioChart() {
    const scenario = this.currentScenario;
    const selectedItems = [];
    
    document.querySelectorAll('[data-item-index]').forEach((checkbox, index) => {
      if (checkbox.checked) {
        selectedItems.push(scenario.items[index]);
      }
    });

    // 更新图表
    const chartContainer = document.querySelector('.chart-container');
    const legendContainer = document.querySelector('.chart-legend');
    if (chartContainer && legendContainer) {
      chartContainer.innerHTML = UI.createPieChart(selectedItems).querySelector('.chart-container')?.innerHTML || '';
    }
  },

  // 全选项目
  selectAllItems() {
    document.querySelectorAll('[data-item-index]').forEach(checkbox => {
      checkbox.checked = true;
    });
    this.updateScenarioChart();
  },

  // 选择推荐方案
  selectRecommendation(recName) {
    const scenario = this.currentScenario;
    const rec = scenario.recommendations.find(r => r.name === recName);
    if (!rec) return;

    // 勾选对应的项目
    document.querySelectorAll('[data-item-index]').forEach((checkbox, index) => {
      const itemName = scenario.items[index].name;
      checkbox.checked = rec.items.includes(itemName);
    });

    this.updateScenarioChart();
    UI.showToast(`已选择「${recName}」方案`, 'success');
  },

  // 导出计划
  async exportPlan(format) {
    const scenario = this.currentScenario;
    const selectedItems = [];
    
    document.querySelectorAll('[data-item-index]').forEach((checkbox, index) => {
      if (checkbox.checked) {
        selectedItems.push(scenario.items[index]);
      }
    });

    if (selectedItems.length === 0) {
      UI.showToast('请至少选择一个预算项目', 'error');
      return;
    }

    const plan = {
      name: scenario.name + '方案',
      scenarioId: scenario.id,
      items: selectedItems,
      recommendations: scenario.recommendations
    };

    const result = await Export.export(plan, format);
    if (result.success) {
      UI.showToast(result.message, 'success');
      
      // 记录导出历史
      if (Auth.isLoggedIn()) {
        Auth.addExportHistory(Auth.getSession().userId, {
          planName: plan.name,
          format: format
        });
      }
    } else {
      UI.showToast(result.message, 'error');
    }
  },

  // 添加到DIY
  addToDIY(scenarioId) {
    const scenario = BudgetData.SCENARIOS[scenarioId];
    if (!scenario) return;

    this.diyItems = this.diyItems || [];
    scenario.items.forEach(item => {
      if (!this.diyItems.find(i => i.name === item.name)) {
        this.diyItems.push({...item, scenarioId, scenarioName: scenario.name});
      }
    });

    this.renderDIYItems();
    UI.showToast(`已添加「${scenario.name}」相关预算项`, 'success');
  },

  // 渲染DIY项目
  renderDIYItems() {
    const container = document.getElementById('diyItems');
    if (!container) return;

    if (this.diyItems.length === 0) {
      container.innerHTML = `
        <div class="diy-empty">
          <span class="empty-icon">${UI.getIcon('pieChart', 48)}</span>
          <p>从左侧选择场景添加到您的预算方案</p>
        </div>
      `;
      document.getElementById('budgetCalculator').style.display = 'none';
      return;
    }

    container.innerHTML = this.diyItems.map((item, index) => `
      <div class="diy-item">
        <div class="diy-item-header">
          <span class="scenario-tag">${item.scenarioName}</span>
          <button class="btn btn-icon btn-sm" onclick="App.removeDIYItem(${index})">
            ${UI.getIcon('x', 16)}
          </button>
        </div>
        <h4>${item.name}</h4>
        <p class="diy-item-tip">${item.tips || ''}</p>
        <div class="diy-item-range">
          <input type="number" placeholder="最低" value="${item.min}" onchange="App.updateDIYItem(${index}, 'min', this.value)">
          <span>-</span>
          <input type="number" placeholder="最高" value="${item.max}" onchange="App.updateDIYItem(${index}, 'max', this.value)">
        </div>
      </div>
    `).join('');

    document.getElementById('budgetCalculator').style.display = 'block';
    this.calculateBudget();
  },

  // 更新DIY项目
  updateDIYItem(index, field, value) {
    if (this.diyItems[index]) {
      this.diyItems[index][field] = parseFloat(value) || 0;
      this.calculateBudget();
    }
  },

  // 移除DIY项目
  removeDIYItem(index) {
    this.diyItems.splice(index, 1);
    this.renderDIYItems();
  },

  // 清空DIY
  clearDIY() {
    this.diyItems = [];
    this.renderDIYItems();
  },

  // 计算预算
  calculateBudget() {
    const minInput = document.getElementById('budgetMin');
    const maxInput = document.getElementById('budgetMax');
    
    let totalMin = 0;
    let totalMax = 0;

    this.diyItems.forEach(item => {
      totalMin += item.min;
      totalMax += item.max;
    });

    // 如果用户输入了范围，使用用户输入的值
    if (minInput && minInput.value) {
      totalMin = parseFloat(minInput.value);
    }
    if (maxInput && maxInput.value) {
      totalMax = parseFloat(maxInput.value);
    }

    const totalAvg = (totalMin + totalMax) / 2;

    document.getElementById('totalMin').textContent = `¥${totalMin.toLocaleString()}`;
    document.getElementById('totalMax').textContent = `¥${totalMax.toLocaleString()}`;
    document.getElementById('totalAvg').textContent = `¥${Math.round(totalAvg).toLocaleString()}`;

    this.diyBudget = totalAvg;
  },

  // 保存DIY方案
  saveDIYPlan() {
    if (!Auth.isLoggedIn()) {
      UI.showToast('请先登录', 'info');
      Router.navigate('login');
      return;
    }

    if (this.diyItems.length === 0) {
      UI.showToast('请先添加预算项目', 'error');
      return;
    }

    const plan = {
      name: `自定义方案 ${new Date().toLocaleDateString('zh-CN')}`,
      items: this.diyItems,
      totalBudget: this.diyBudget
    };

    Auth.savePlan(Auth.getSession().userId, plan);
    UI.showToast('方案已保存', 'success');
  },

  // 加载方案
  loadPlan(planId) {
    const user = Auth.getUser();
    const plan = user.plans.find(p => p.id === planId);
    if (plan && plan.items) {
      this.diyItems = plan.items;
      this.diyBudget = plan.totalBudget || 0;
      Router.navigate('diy');
      setTimeout(() => this.renderDIYItems(), 100);
      UI.showToast('方案已加载', 'success');
    }
  },

  // 删除方案
  deletePlan(planId) {
    if (confirm('确定要删除这个方案吗？')) {
      Auth.deletePlan(Auth.getSession().userId, planId);
      Router.navigate('profile');
      UI.showToast('方案已删除', 'success');
    }
  },

  // 应用筛选
  applyFilters() {
    // TODO: 实现筛选逻辑
    UI.showToast('筛选功能开发中', 'info');
  }
};

window.App = App;

  </script>
  
  <script>
    // Initialize App
    document.addEventListener('DOMContentLoaded', () => {
      // Hide loading screen
      setTimeout(() => {
        document.getElementById('loadingScreen').classList.add('hidden');
      }, 500);
      
      // Initialize the application
      App.init();
    });
  </script>
</body>
