<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AI创意魔方</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        .header {
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            background: linear-gradient(90deg, #fff, #e0e0e0, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 10px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd700;
        }

        .game-container {
            display: flex;
            flex: 1;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            gap: 20px;
        }

        .cube-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 500px;
        }

        .scene {
            width: 300px;
            height: 300px;
            perspective: 1200px;
            position: relative;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-30deg) rotateY(-45deg);
            transition: transform 0.1s ease-out;
        }

        .face {
            position: absolute;
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3px;
            padding: 3px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }

        .sticker {
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3), 0 2px 5px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .sticker:hover {
            transform: scale(1.05);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.3), 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .sticker.white { background: linear-gradient(135deg, #ffffff, #e0e0e0); }
        .sticker.yellow { background: linear-gradient(135deg, #ffd700, #ffb300); }
        .sticker.green { background: linear-gradient(135deg, #00c853, #009624); }
        .sticker.blue { background: linear-gradient(135deg, #2962ff, #0039cb); }
        .sticker.orange { background: linear-gradient(135deg, #ff6d00, #e65100); }
        .sticker.red { background: linear-gradient(135deg, #ff1744, #d50000); }

        .face.front { transform: translateZ(150px); }
        .face.back { transform: rotateY(180deg) translateZ(150px); }
        .face.right { transform: rotateY(90deg) translateZ(150px); }
        .face.left { transform: rotateY(-90deg) translateZ(150px); }
        .face.top { transform: rotateX(90deg) translateZ(150px); }
        .face.bottom { transform: rotateX(-90deg) translateZ(150px); }

        .controls {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .control-section h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: #ffd700;
        }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn.success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .btn.warning {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: #1a1a2e;
        }

        .btn.danger {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: #1a1a2e;
        }

        .move-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .move-btn {
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .move-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .move-btn:active {
            transform: scale(0.95);
        }

        .instructions {
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .instructions ul {
            list-style: none;
            padding-left: 0;
        }

        .instructions li {
            padding: 5px 0;
            padding-left: 20px;
            position: relative;
        }

        .instructions li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: #ffd700;
        }

        .victory-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .victory-content {
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: victoryPulse 2s ease-in-out infinite;
        }

        @keyframes victoryPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .victory-content h2 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .victory-content p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .victory-content .btn {
            font-size: 1.1rem;
            padding: 15px 40px;
        }

        .hint-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            display: none;
            z-index: 1001;
            text-align: center;
            border: 2px solid #ffd700;
        }

        .hint-overlay h3 {
            color: #ffd700;
            margin-bottom: 15px;
        }

        .hint-move {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .rotation-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
            pointer-events: none;
        }

        @media (max-width: 900px) {
            .game-container {
                flex-direction: column;
            }

            .controls {
                width: 100%;
            }

            .scene {
                width: 250px;
                height: 250px;
            }

            .face {
                width: 250px;
                height: 250px;
            }

            .face.front { transform: translateZ(125px); }
            .face.back { transform: rotateY(180deg) translateZ(125px); }
            .face.right { transform: rotateY(90deg) translateZ(125px); }
            .face.left { transform: rotateY(-90deg) translateZ(125px); }
            .face.top { transform: rotateX(90deg) translateZ(125px); }
            .face.bottom { transform: rotateX(-90deg) translateZ(125px); }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>3D AI创意魔方</h1>
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">时间</div>
                <div class="stat-value" id="timer">00:00</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">步数</div>
                <div class="stat-value" id="moves">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">状态</div>
                <div class="stat-value" id="status">已还原</div>
            </div>
        </div>
    </div>

    <div class="game-container">
        <div class="cube-area">
            <div class="scene">
                <div class="cube" id="cube">
                    <div class="face front" id="face-front"></div>
                    <div class="face back" id="face-back"></div>
                    <div class="face right" id="face-right"></div>
                    <div class="face left" id="face-left"></div>
                    <div class="face top" id="face-top"></div>
                    <div class="face bottom" id="face-bottom"></div>
                </div>
            </div>
            <div class="rotation-hint">鼠标拖拽旋转视角</div>
        </div>

        <div class="controls">
            <div class="control-section">
                <h3>游戏控制</h3>
                <div class="btn-group">
                    <button class="btn primary" onclick="scrambleCube()">打乱魔方</button>
                    <button class="btn success" onclick="resetCube()">重置魔方</button>
                    <button class="btn warning" onclick="showHint()">提示</button>
                    <button class="btn danger" onclick="undoMove()">撤销</button>
                </div>
            </div>

            <div class="control-section">
                <h3>旋转控制</h3>
                <div class="move-controls">
                    <button class="move-btn" onclick="rotateFace('U')">U</button>
                    <button class="move-btn" onclick="rotateFace('D')">D</button>
                    <button class="move-btn" onclick="rotateFace('F')">F</button>
                    <button class="move-btn" onclick="rotateFace('B')">B</button>
                    <button class="move-btn" onclick="rotateFace('L')">L</button>
                    <button class="move-btn" onclick="rotateFace('R')">R</button>
                    <button class="move-btn" onclick="rotateFace('U\'')">U'</button>
                    <button class="move-btn" onclick="rotateFace('D\'')">D'</button>
                    <button class="move-btn" onclick="rotateFace('F\'')">F'</button>
                </div>
            </div>

            <div class="control-section">
                <h3>操作说明</h3>
                <div class="instructions">
                    <ul>
                        <li>鼠标拖拽：旋转视角</li>
                        <li>点击贴纸：旋转对应层</li>
                        <li>U/D/F/B/L/R：旋转各面</li>
                        <li>加 ' 表示逆时针旋转</li>
                        <li>方向键：快速旋转</li>
                        <li>空格键：打乱魔方</li>
                        <li>ESC：重置视角</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="victory-overlay" id="victoryOverlay">
        <div class="victory-content">
            <h2>恭喜完成！</h2>
            <p>你成功还原了魔方！</p>
            <p>用时: <span id="victoryTime"></span> | 步数: <span id="victoryMoves"></span></p>
            <button class="btn primary" onclick="closeVictory()">再来一局</button>
        </div>
    </div>

    <div class="hint-overlay" id="hintOverlay">
        <h3>下一步提示</h3>
        <div class="hint-move" id="hintMove"></div>
        <button class="btn" onclick="closeHint()">关闭</button>
    </div>

    <script>
        // 魔方状态
        let cubeState = {
            front: Array(9).fill('green'),
            back: Array(9).fill('blue'),
            right: Array(9).fill('red'),
            left: Array(9).fill('orange'),
            top: Array(9).fill('white'),
            bottom: Array(9).fill('yellow')
        };

        let moveHistory = [];
        let moveCount = 0;
        let startTime = null;
        let timerInterval = null;
        let isDragging = false;
        let startX, startY;
        let currentRotation = { x: -30, y: -45 };
        let isAnimating = false;

        // 初始化魔方
        function initCube() {
            renderCube();
            setupEventListeners();
        }

        // 渲染魔方
        function renderCube() {
            const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
            faces.forEach(face => {
                const element = document.getElementById(`face-${face}`);
                element.innerHTML = '';
                cubeState[face].forEach((color, index) => {
                    const sticker = document.createElement('div');
                    sticker.className = `sticker ${color}`;
                    sticker.dataset.face = face;
                    sticker.dataset.index = index;
                    sticker.addEventListener('click', () => handleStickerClick(face, index));
                    element.appendChild(sticker);
                });
            });
        }

        // 处理贴纸点击
        function handleStickerClick(face, index) {
            if (isAnimating) return;
            
            const moves = {
                'top': 'U',
                'bottom': 'D',
                'front': 'F',
                'back': 'B',
                'left': 'L',
                'right': 'R'
            };
            
            rotateFace(moves[face]);
        }

        // 旋转面
        function rotateFace(move) {
            if (isAnimating) return;
            isAnimating = true;

            // 保存当前状态用于撤销
            const previousState = JSON.parse(JSON.stringify(cubeState));
            
            const face = move.charAt(0);
            const clockwise = !move.includes("'");
            
            performRotation(face, clockwise);
            
            moveHistory.push({
                move: move,
                state: previousState
            });
            
            moveCount++;
            updateStats();
            
            if (!startTime) {
                startTimer();
            }
            
            renderCube();
            
            setTimeout(() => {
                isAnimating = false;
                if (checkSolved()) {
                    handleVictory();
                }
            }, 300);
        }

        // 执行旋转
        function performRotation(face, clockwise) {
            const temp = JSON.parse(JSON.stringify(cubeState));
            
            switch(face) {
                case 'U':
                    rotateFaceStickers('top', clockwise);
                    if (clockwise) {
                        for (let i = 0; i < 3; i++) {
                            cubeState.front[i] = temp.right[i];
                            cubeState.right[i] = temp.back[i];
                            cubeState.back[i] = temp.left[i];
                            cubeState.left[i] = temp.front[i];
                        }
                    } else {
                        for (let i = 0; i < 3; i++) {
                            cubeState.front[i] = temp.left[i];
                            cubeState.left[i] = temp.back[i];
                            cubeState.back[i] = temp.right[i];
                            cubeState.right[i] = temp.front[i];
                        }
                    }
                    break;
                    
                case 'D':
                    rotateFaceStickers('bottom', clockwise);
                    if (clockwise) {
                        for (let i = 6; i < 9; i++) {
                            cubeState.front[i] = temp.left[i];
                            cubeState.left[i] = temp.back[i];
                            cubeState.back[i] = temp.right[i];
                            cubeState.right[i] = temp.front[i];
                        }
                    } else {
                        for (let i = 6; i < 9; i++) {
                            cubeState.front[i] = temp.right[i];
                            cubeState.right[i] = temp.back[i];
                            cubeState.back[i] = temp.left[i];
                            cubeState.left[i] = temp.front[i];
                        }
                    }
                    break;
                    
                case 'F':
                    rotateFaceStickers('front', clockwise);
                    if (clockwise) {
                        cubeState.top[6] = temp.left[8];
                        cubeState.top[7] = temp.left[5];
                        cubeState.top[8] = temp.left[2];
                        cubeState.left[2] = temp.bottom[0];
                        cubeState.left[5] = temp.bottom[1];
                        cubeState.left[8] = temp.bottom[2];
                        cubeState.bottom[0] = temp.right[6];
                        cubeState.bottom[1] = temp.right[3];
                        cubeState.bottom[2] = temp.right[0];
                        cubeState.right[0] = temp.top[6];
                        cubeState.right[3] = temp.top[7];
                        cubeState.right[6] = temp.top[8];
                    } else {
                        cubeState.top[6] = temp.right[0];
                        cubeState.top[7] = temp.right[3];
                        cubeState.top[8] = temp.right[6];
                        cubeState.right[0] = temp.bottom[2];
                        cubeState.right[3] = temp.bottom[1];
                        cubeState.right[6] = temp.bottom[0];
                        cubeState.bottom[0] = temp.left[2];
                        cubeState.bottom[1] = temp.left[5];
                        cubeState.bottom[2] = temp.left[8];
                        cubeState.left[2] = temp.top[8];
                        cubeState.left[5] = temp.top[7];
                        cubeState.left[8] = temp.top[6];
                    }
                    break;
                    
                case 'B':
                    rotateFaceStickers('back', clockwise);
                    if (clockwise) {
                        cubeState.top[0] = temp.right[2];
                        cubeState.top[1] = temp.right[5];
                        cubeState.top[2] = temp.right[8];
                        cubeState.right[2] = temp.bottom[8];
                        cubeState.right[5] = temp.bottom[7];
                        cubeState.right[8] = temp.bottom[6];
                        cubeState.bottom[6] = temp.left[0];
                        cubeState.bottom[7] = temp.left[3];
                        cubeState.bottom[8] = temp.left[6];
                        cubeState.left[0] = temp.top[2];
                        cubeState.left[3] = temp.top[1];
                        cubeState.left[6] = temp.top[0];
                    } else {
                        cubeState.top[0] = temp.left[6];
                        cubeState.top[1] = temp.left[3];
                        cubeState.top[2] = temp.left[0];
                        cubeState.left[0] = temp.bottom[6];
                        cubeState.left[3] = temp.bottom[7];
                        cubeState.left[6] = temp.bottom[8];
                        cubeState.bottom[6] = temp.right[8];
                        cubeState.bottom[7] = temp.right[5];
                        cubeState.bottom[8] = temp.right[2];
                        cubeState.right[2] = temp.top[0];
                        cubeState.right[5] = temp.top[1];
                        cubeState.right[8] = temp.top[2];
                    }
                    break;
                    
                case 'L':
                    rotateFaceStickers('left', clockwise);
                    if (clockwise) {
                        cubeState.top[0] = temp.back[8];
                        cubeState.top[3] = temp.back[5];
                        cubeState.top[6] = temp.back[2];
                        cubeState.front[0] = temp.top[0];
                        cubeState.front[3] = temp.top[3];
                        cubeState.front[6] = temp.top[6];
                        cubeState.bottom[0] = temp.front[0];
                        cubeState.bottom[3] = temp.front[3];
                        cubeState.bottom[6] = temp.front[6];
                        cubeState.back[2] = temp.bottom[6];
                        cubeState.back[5] = temp.bottom[3];
                        cubeState.back[8] = temp.bottom[0];
                    } else {
                        cubeState.top[0] = temp.front[0];
                        cubeState.top[3] = temp.front[3];
                        cubeState.top[6] = temp.front[6];
                        cubeState.back[8] = temp.top[0];
                        cubeState.back[5] = temp.top[3];
                        cubeState.back[2] = temp.top[6];
                        cubeState.bottom[0] = temp.back[8];
                        cubeState.bottom[3] = temp.back[5];
                        cubeState.bottom[6] = temp.back[2];
                        cubeState.front[0] = temp.bottom[0];
                        cubeState.front[3] = temp.bottom[3];
                        cubeState.front[6] = temp.bottom[6];
                    }
                    break;
                    
                case 'R':
                    rotateFaceStickers('right', clockwise);
                    if (clockwise) {
                        cubeState.top[2] = temp.front[2];
                        cubeState.top[5] = temp.front[5];
                        cubeState.top[8] = temp.front[8];
                        cubeState.back[0] = temp.top[8];
                        cubeState.back[3] = temp.top[5];
                        cubeState.back[6] = temp.top[2];
                        cubeState.bottom[2] = temp.back[6];
                        cubeState.bottom[5] = temp.back[3];
                        cubeState.bottom[8] = temp.back[0];
                        cubeState.front[2] = temp.bottom[2];
                        cubeState.front[5] = temp.bottom[5];
                        cubeState.front[8] = temp.bottom[8];
                    } else {
                        cubeState.top[2] = temp.back[6];
                        cubeState.top[5] = temp.back[3];
                        cubeState.top[8] = temp.back[0];
                        cubeState.front[2] = temp.top[2];
                        cubeState.front[5] = temp.top[5];
                        cubeState.front[8] = temp.top[8];
                        cubeState.bottom[2] = temp.front[2];
                        cubeState.bottom[5] = temp.front[5];
                        cubeState.bottom[8] = temp.front[8];
                        cubeState.back[0] = temp.bottom[8];
                        cubeState.back[3] = temp.bottom[5];
                        cubeState.back[6] = temp.bottom[2];
                    }
                    break;
            }
        }

        // 旋转面上的贴纸
        function rotateFaceStickers(face, clockwise) {
            const stickers = [...cubeState[face]];
            if (clockwise) {
                cubeState[face][0] = stickers[6];
                cubeState[face][1] = stickers[3];
                cubeState[face][2] = stickers[0];
                cubeState[face][3] = stickers[7];
                cubeState[face][4] = stickers[4];
                cubeState[face][5] = stickers[1];
                cubeState[face][6] = stickers[8];
                cubeState[face][7] = stickers[5];
                cubeState[face][8] = stickers[2];
            } else {
                cubeState[face][0] = stickers[2];
                cubeState[face][1] = stickers[5];
                cubeState[face][2] = stickers[8];
                cubeState[face][3] = stickers[1];
                cubeState[face][4] = stickers[4];
                cubeState[face][5] = stickers[7];
                cubeState[face][6] = stickers[0];
                cubeState[face][7] = stickers[3];
                cubeState[face][8] = stickers[6];
            }
        }

        // 打乱魔方
        function scrambleCube() {
            if (isAnimating) return;
            
            const moves = ['U', 'D', 'F', 'B', 'L', 'R'];
            const scrambleMoves = [];
            
            for (let i = 0; i < 20; i++) {
                const move = moves[Math.floor(Math.random() * moves.length)];
                const clockwise = Math.random() > 0.5;
                scrambleMoves.push(clockwise ? move : move + "'");
            }
            
            let delay = 0;
            scrambleMoves.forEach((move, index) => {
                setTimeout(() => {
                    rotateFace(move);
                }, delay);
                delay += 100;
            });
            
            // 重置统计
            moveCount = 0;
            moveHistory = [];
            stopTimer();
            startTime = null;
            updateStats();
            document.getElementById('status').textContent = '已打乱';
        }

        // 重置魔方
        function resetCube() {
            if (isAnimating) return;
            
            cubeState = {
                front: Array(9).fill('green'),
                back: Array(9).fill('blue'),
                right: Array(9).fill('red'),
                left: Array(9).fill('orange'),
                top: Array(9).fill('white'),
                bottom: Array(9).fill('yellow')
            };
            
            moveCount = 0;
            moveHistory = [];
            stopTimer();
            startTime = null;
            updateStats();
            renderCube();
            document.getElementById('status').textContent = '已还原';
        }

        // 撤销操作
        function undoMove() {
            if (isAnimating || moveHistory.length === 0) return;
            
            const lastMove = moveHistory.pop();
            cubeState = lastMove.state;
            moveCount--;
            updateStats();
            renderCube();
        }

        // 显示提示
        function showHint() {
            if (checkSolved()) {
                alert('魔方已经还原！');
                return;
            }
            
            const moves = ['U', 'D', 'F', 'B', 'L', 'R', "U'", "D'", "F'", "B'", "L'", "R'"];
            const randomMove = moves[Math.floor(Math.random() * moves.length)];
            
            document.getElementById('hintMove').textContent = randomMove;
            document.getElementById('hintOverlay').style.display = 'block';
            
            setTimeout(closeHint, 3000);
        }

        function closeHint() {
            document.getElementById('hintOverlay').style.display = 'none';
        }

        // 检查是否还原
        function checkSolved() {
            const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
            return faces.every(face => {
                const firstColor = cubeState[face][0];
                return cubeState[face].every(color => color === firstColor);
            });
        }

        // 处理胜利
        function handleVictory() {
            stopTimer();
            document.getElementById('victoryTime').textContent = document.getElementById('timer').textContent;
            document.getElementById('victoryMoves').textContent = moveCount;
            document.getElementById('victoryOverlay').style.display = 'flex';
            document.getElementById('status').textContent = '已完成';
            
            // 创建彩纸效果
            createConfetti();
        }

        function closeVictory() {
            document.getElementById('victoryOverlay').style.display = 'none';
            resetCube();
        }

        // 创建彩纸效果
        function createConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animation = `confettiFall ${Math.random() * 3 + 2}s linear`;
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        // 计时器
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer').textContent = `${minutes}:${seconds}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // 更新统计
        function updateStats() {
            document.getElementById('moves').textContent = moveCount;
        }

        // 设置事件监听器
        function setupEventListeners() {
            const cube = document.getElementById('cube');
            const scene = document.querySelector('.scene');
            
            // 鼠标拖拽
            scene.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                scene.style.cursor = 'grabbing';
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;
                
                currentRotation.y += deltaX * 0.5;
                currentRotation.x -= deltaY * 0.5;
                
                cube.style.transform = `rotateX(${currentRotation.x}deg) rotateY(${currentRotation.y}deg)`;
                
                startX = e.clientX;
                startY = e.clientY;
            });
            
            document.addEventListener('mouseup', () => {
                isDragging = false;
                scene.style.cursor = 'grab';
            });
            
            // 键盘控制
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case 'ArrowUp':
                        e.preventDefault();
                        rotateFace('U');
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        rotateFace('D');
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        rotateFace('L');
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        rotateFace('R');
                        break;
                    case ' ':
                        e.preventDefault();
                        scrambleCube();
                        break;
                    case 'Escape':
                        e.preventDefault();
                        currentRotation = { x: -30, y: -45 };
                        cube.style.transform = `rotateX(${currentRotation.x}deg) rotateY(${currentRotation.y}deg)`;
                        break;
                }
            });
            
            // 触摸支持
            scene.addEventListener('touchstart', (e) => {
                isDragging = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });
            
            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                
                const deltaX = e.touches[0].clientX - startX;
                const deltaY = e.touches[0].clientY - startY;
                
                currentRotation.y += deltaX * 0.5;
                currentRotation.x -= deltaY * 0.5;
                
                cube.style.transform = `rotateX(${currentRotation.x}deg) rotateY(${currentRotation.y}deg)`;
                
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });
            
            document.addEventListener('touchend', () => {
                isDragging = false;
            });
        }

        // 初始化
        initCube();
    </script>
</body>
</html>
