<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  .container {
    text-align: center;
    position: relative;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding: 0 8px;
  }

  .score-box {
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 12px;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .score-label {
    color: #a0a0b0;
    font-size: 14px;
    font-weight: 500;
  }

  .score-value {
    color: #e94560;
    font-size: 28px;
    font-weight: 700;
    min-width: 40px;
    text-align: center;
  }

  .best-box {
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 12px;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
  }

  .best-box::before {
    content: "🏆";
    font-size: 18px;
  }

  .best-label {
    color: #a0a0b0;
    font-size: 14px;
    font-weight: 500;
  }

  .best-value {
    color: #f5c518;
    font-size: 28px;
    font-weight: 700;
    min-width: 40px;
    text-align: center;
  }

  canvas {
    border: 2px solid #0f3460;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(15, 52, 96, 0.4), 0 8px 32px rgba(0, 0, 0, 0.3);
    display: block;
    background: #0a0a1a;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .btn {
    background: #16213e;
    border: 2px solid #0f3460;
    color: #e0e0f0;
    padding: 10px 28px;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    font-weight: 500;
  }

  .btn:hover {
    background: #0f3460;
    border-color: #e94560;
    transform: translateY(-1px);
  }

  .btn:active {
    transform: translateY(0);
  }

  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-text {
    color: #e94560;
    font-size: 40px;
    font-weight: 700;
    margin-bottom: 16px;
    text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
  }

  .overlay-sub {
    color: #a0a0b0;
    font-size: 16px;
    margin-bottom: 24px;
  }

  .hint {
    color: #555;
    font-size: 13px;
    margin-top: 12px;
    text-align: center;
  }

  .difficulty {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .diff-btn {
    background: transparent;
    border: 1px solid #333;
    color: #777;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .diff-btn:hover {
    border-color: #e94560;
    color: #e94560;
  }

  .diff-btn.active {
    background: #e94560;
    border-color: #e94560;
    color: #fff;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="score-box">
      <span class="score-label">分数</span>
      <span class="score-value" id="score">0</span>
    </div>
    <div class="best-box">
      <span class="best-label">最佳</span>
      <span class="best-value" id="bestScore">0</span>
    </div>
  </div>

  <div style="position: relative; display: inline-block;">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <div class="overlay-text" id="overlayTitle">游戏结束</div>
      <div class="overlay-sub" id="overlaySub">按 空格键 或点击按钮重新开始</div>
      <button class="btn" id="restartBtn" style="pointer-events: auto;">重新开始</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="startBtn">开始 / 暂停</button>
    <button class="btn" id="resetBtn">重新开始</button>
  </div>

  <div class="difficulty">
    <button class="diff-btn active" data-speed="120">简单</button>
    <button class="diff-btn" data-speed="80">普通</button>
    <button class="diff-btn" data-speed="50">困难</button>
  </div>

  <div class="hint">方向键 / WASD 控制方向 &nbsp;|&nbsp; 空格键 暂停/继续</div>
</div>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestScoreEl = document.getElementById('bestScore');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');

  const GRID = 20;
  const COLS = canvas.width / GRID;
  const ROWS = canvas.height / GRID;

  let snake = [];
  let food = { x: 0, y: 0 };
  let direction = { x: 1, y: 0 };
  let nextDirection = { x: 1, y: 0 };
  let score = 0;
  let bestScore = 0;
  let gameRunning = false;
  let gameOver = false;
  let gameLoop = null;
  let speed = 120;
  let particles = [];

  // 加载最佳分数
  const saved = localStorage.getItem('snakeBestScore');
  if (saved) {
    bestScore = parseInt(saved, 10);
    bestScoreEl.textContent = bestScore;
  }

  // 初始化蛇
  function initSnake() {
    snake = [];
    const startX = Math.floor(COLS / 2);
    const startY = Math.floor(ROWS / 2);
    for (let i = 0; i < 3; i++) {
      snake.push({ x: startX - i, y: startY });
    }
  }

  // 生成食物
  function spawnFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS),
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  // 创建粒子
  function spawnParticles(x, y) {
    for (let i = 0; i < 8; i++) {
      const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.5;
      const speed = 1 + Math.random() * 2;
      particles.push({
        x: x * GRID + GRID / 2,
        y: y * GRID + GRID / 2,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.02 + Math.random() * 0.04,
      });
    }
  }

  // 更新粒子
  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // 绘制粒子
  function drawParticles() {
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = '#e94560';
      ctx.shadowColor = '#e94560';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // 游戏逻辑更新
  function update() {
    direction = { ...nextDirection };

    const head = { ...snake[0] };
    head.x += direction.x;
    head.y += direction.y;

    // 穿墙
    if (head.x < 0) head.x = COLS - 1;
    if (head.x >= COLS) head.x = 0;
    if (head.y < 0) head.y = ROWS - 1;
    if (head.y >= ROWS) head.y = 0;

    // 撞到自己
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      endGame();
      return;
    }

    snake.unshift(head);

    // 吃到食物
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      spawnParticles(food.x, food.y);
      spawnFood();
      // 加速
      if (score % 50 === 0 && speed > 40) {
        speed -= 5;
        restartLoop();
      }
    } else {
      snake.pop();
    }
  }

  // 绘制网格
  function drawGrid() {
    ctx.strokeStyle = 'rgba(15, 52, 96, 0.15)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * GRID, 0);
      ctx.lineTo(x * GRID, canvas.height);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * GRID);
      ctx.lineTo(canvas.width, y * GRID);
      ctx.stroke();
    }
  }

  // 绘制
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawGrid();

    // 绘制食物
    const foodX = food.x * GRID + GRID / 2;
    const foodY = food.y * GRID + GRID / 2;
    const pulse = 1 + Math.sin(Date.now() / 200) * 0.15;

    ctx.save();
    ctx.fillStyle = '#e94560';
    ctx.shadowColor = '#e94560';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(foodX, foodY, (GRID / 2 - 2) * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 绘制蛇
    snake.forEach((seg, i) => {
      const x = seg.x * GRID;
      const y = seg.y * GRID;
      const pad = 1;

      // 身体渐变
      const ratio = snake.length > 1 ? i / (snake.length - 1) : 0;
      const r = Math.floor(80 + ratio * 30);
      const g = Math.floor(180 - ratio * 60);
      const b = Math.floor(100 - ratio * 20);

      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.shadowColor = `rgba(${r},${g},${b},0.5)`;
      ctx.shadowBlur = i === 0 ? 10 : 3;

      if (i === 0) {
        // 蛇头 - 圆角矩形
        const radius = 6;
        ctx.beginPath();
        ctx.moveTo(x + pad + radius, y + pad);
        ctx.lineTo(x + GRID - pad - radius, y + pad);
        ctx.quadraticCurveTo(x + GRID - pad, y + pad, x + GRID - pad, y + pad + radius);
        ctx.lineTo(x + GRID - pad, y + GRID - pad - radius);
        ctx.quadraticCurveTo(x + GRID - pad, y + GRID - pad, x + GRID - pad - radius, y + GRID - pad);
        ctx.lineTo(x + pad + radius, y + GRID - pad);
        ctx.quadraticCurveTo(x + pad, y + GRID - pad, x + pad, y + GRID - pad - radius);
        ctx.lineTo(x + pad, y + pad + radius);
        ctx.quadraticCurveTo(x + pad, y + pad, x + pad + radius, y + pad);
        ctx.fill();

        // 眼睛
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        const eyeSize = 3.5;
        const eyeOffset = 5;
        let ex1, ey1, ex2, ey2, pupX1, pupY1, pupX2, pupY2;

        if (direction.x === 1) {
          ex1 = x + GRID - eyeOffset - 1; ey1 = y + eyeOffset;
          ex2 = x + GRID - eyeOffset - 1; ey2 = y + GRID - eyeOffset;
          pupX1 = ex1 + 1.5; pupY1 = ey1;
          pupX2 = ex2 + 1.5; pupY2 = ey2;
        } else if (direction.x === -1) {
          ex1 = x + eyeOffset; ey1 = y + eyeOffset;
          ex2 = x + eyeOffset; ey2 = y + GRID - eyeOffset;
          pupX1 = ex1 - 1.5; pupY1 = ey1;
          pupX2 = ex2 - 1.5; pupY2 = ey2;
        } else if (direction.y === -1) {
          ex1 = x + eyeOffset; ey1 = y + eyeOffset;
          ex2 = x + GRID - eyeOffset; ey2 = y + eyeOffset;
          pupX1 = ex1; pupY1 = ey1 - 1.5;
          pupX2 = ex2; pupY2 = ey2 - 1.5;
        } else {
          ex1 = x + eyeOffset; ey1 = y + GRID - eyeOffset;
          ex2 = x + GRID - eyeOffset; ey2 = y + GRID - eyeOffset;
          pupX1 = ex1; pupY1 = ey1 + 1.5;
          pupX2 = ex2; pupY2 = ey2 + 1.5;
        }

        ctx.beginPath();
        ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(pupX1, pupY1, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(pupX2, pupY2, 1.5, 0, Math.PI * 2);
        ctx.fill();

      } else {
        // 身体
        const radius = 4;
        ctx.beginPath();
        ctx.moveTo(x + pad + radius, y + pad);
        ctx.lineTo(x + GRID - pad - radius, y + pad);
        ctx.quadraticCurveTo(x + GRID - pad, y + pad, x + GRID - pad, y + pad + radius);
        ctx.lineTo(x + GRID - pad, y + GRID - pad - radius);
        ctx.quadraticCurveTo(x + GRID - pad, y + GRID - pad, x + GRID - pad - radius, y + GRID - pad);
        ctx.lineTo(x + pad + radius, y + GRID - pad);
        ctx.quadraticCurveTo(x + pad, y + GRID - pad, x + pad, y + GRID - pad - radius);
        ctx.lineTo(x + pad, y + pad + radius);
        ctx.quadraticCurveTo(x + pad, y + pad, x + pad + radius, y + pad);
        ctx.fill();
      }
    });

    drawParticles();
  }

  function gameStep() {
    if (!gameRunning || gameOver) return;
    update();
    updateParticles();
    draw();
  }

  function startLoop() {
    gameLoop = setInterval(gameStep, speed);
  }

  function stopLoop() {
    if (gameLoop) {
      clearInterval(gameLoop);
      gameLoop = null;
    }
  }

  function restartLoop() {
    stopLoop();
    startLoop();
  }

  function startGame() {
    if (gameOver) {
      resetGame();
    }
    gameRunning = true;
    gameOver = false;
    overlay.classList.remove('active');
    startLoop();
  }

  function pauseGame() {
    gameRunning = false;
    stopLoop();
  }

  function endGame() {
    gameRunning = false;
    gameOver = true;
    stopLoop();

    if (score > bestScore) {
      bestScore = score;
      bestScoreEl.textContent = bestScore;
      localStorage.setItem('snakeBestScore', bestScore);
      overlayTitle.textContent = '新纪录!';
    } else {
      overlayTitle.textContent = '游戏结束';
    }
    overlaySub.textContent = `最终得分: ${score}  |  按空格键重新开始`;
    overlay.classList.add('active');
  }

  function resetGame() {
    stopLoop();
    initSnake();
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    scoreEl.textContent = '0';
    particles = [];
    spawnFood();
    draw();
    overlay.classList.remove('active');
    gameOver = false;
  }

  // 键盘控制
  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();

    if (key === ' ' || key === 'spacebar') {
      e.preventDefault();
      if (gameOver) {
        resetGame();
        startGame();
        return;
      }
      if (gameRunning) {
        pauseGame();
      } else {
        startGame();
      }
      return;
    }

    if (!gameRunning && !gameOver) return;

    const dirMap = {
      arrowup:    { x: 0, y: -1 },
      arrowdown:  { x: 0, y: 1 },
      arrowleft:  { x: -1, y: 0 },
      arrowright: { x: 1, y: 0 },
      w: { x: 0, y: -1 },
      s: { x: 0, y: 1 },
      a: { x: -1, y: 0 },
      d: { x: 1, y: 0 },
    };

    const newDir = dirMap[key];
    if (!newDir) return;
    e.preventDefault();

    // 防止反向
    if (newDir.x === -direction.x && newDir.y === -direction.y) return;

    nextDirection = newDir;
  });

  // 触摸滑动支持
  let touchStartX = 0;
  let touchStartY = 0;

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (!gameRunning && !gameOver) return;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);

    if (Math.max(absDx, absDy) < 20) return;

    let newDir;
    if (absDx > absDy) {
      newDir = { x: dx > 0 ? 1 : -1, y: 0 };
    } else {
      newDir = { x: 0, y: dy > 0 ? 1 : -1 };
    }

    if (newDir.x === -direction.x && newDir.y === -direction.y) return;
    nextDirection = newDir;
  });

  // 按钮事件
  document.getElementById('startBtn').addEventListener('click', () => {
    if (gameOver) {
      resetGame();
      startGame();
      return;
    }
    if (gameRunning) {
      pauseGame();
    } else {
      startGame();
    }
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    resetGame();
    startGame();
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    resetGame();
    startGame();
  });

  // 难度选择
  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      speed = parseInt(btn.dataset.speed);
      if (gameRunning) restartLoop();
    });
  });

  // 初始化
  initSnake();
  spawnFood();
  draw();
})();
</script>
</body>
</html>
