<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兴趣冷却助手 · 概念原型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, sans-serif; }
  body { background: linear-gradient(145deg, #f7f3ff, #e8e0f0); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
  .card { max-width: 420px; width: 100%; background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); border-radius: 48px; padding: 30px 24px; box-shadow: 0 20px 60px rgba(90, 70, 120, 0.15); border: 1px solid rgba(255,255,255,0.5); }
  h1 { font-size: 26px; font-weight: 700; color: #2d1b4e; letter-spacing: -0.5px; }
  .sub { color: #6f5b8c; font-size: 14px; margin-top: 4px; }
  .interest-card { margin-top: 24px; background: white; border-radius: 28px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
  .label { font-size: 13px; color: #a28db8; letter-spacing: 1px; }
  .name { font-size: 20px; font-weight: 600; color: #1f142f; margin: 6px 0 2px; }
  .progress-wrap { height: 8px; background: #ede6f5; border-radius: 20px; margin: 14px 0; overflow: hidden; }
  .progress { height: 100%; width: 72%; background: linear-gradient(90deg, #b38bdb, #7b4ba8); border-radius: 20px; }
  .status { display: flex; justify-content: space-between; font-size: 14px; color: #3d2a5a; }
  .badge { background: #f0e8fa; padding: 6px 16px; border-radius: 40px; font-size: 13px; color: #5e3d7a; font-weight: 500; }
  .mission { margin-top: 24px; background: #faf7ff; border-radius: 24px; padding: 18px; border-left: 4px solid #9b6fc0; }
  .mission h3 { font-size: 15px; color: #2d1b4e; margin-bottom: 6px; }
  .mission p { font-size: 14px; color: #4d3a65; line-height: 1.5; }
  .cta { margin-top: 24px; background: #2d1b4e; color: white; border: none; padding: 16px; width: 100%; border-radius: 40px; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; }
  .cta:hover { background: #3f2866; transform: scale(0.98); }
  .footnote { text-align: center; margin-top: 18px; font-size: 12px; color: #a28db8; }
</style>
</head>
<body>
<div class="card">
  <h1>🧊 兴趣冷却助手</h1>
  <div class="sub">别让热爱冷却 · 帮你聪明地坚持</div>
  
  <div class="interest-card">
    <div class="label">📌 当前追踪</div>
    <div class="name">🎸 指弹吉他</div>
    <div class="progress-wrap"><div class="progress"></div></div>
    <div class="status">
      <span>热情指数 72%</span>
      <span>⏳ 预计冷却期：7天后</span>
    </div>
    <div style="margin-top:12px;"><span class="badge">⚡ 进阶挑战已就绪</span></div>
  </div>

  <div class="mission">
    <h3>🎯 今日冷门任务</h3>
    <p>尝试用一根弦即兴弹奏一段旋律，打破固定指法习惯——这能重新激活你的探索欲。</p>
  </div>

  <button class="cta">🚀 领取挑战，延长热情</button>
  <div class="footnote">由 AI 预测 · 专为你定制</div>
</div>
</body>
</html>
