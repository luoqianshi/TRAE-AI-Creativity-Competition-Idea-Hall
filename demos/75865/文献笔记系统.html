<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>文献笔记系统</title>
<style>
  /* ========== 全局样式 ========== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #4F46E5;
    --primary-light: #EEF2FF;
    --primary-dark: #3730A3;
    --gold: #F59E0B;
    --gold-light: #FEF3C7;
    --gold-bg: #FFFBEB;
    --danger: #DC2626;
    --danger-light: #FEE2E2;
    --success: #16A34A;
    --success-light: #DCFCE7;
    --warning: #D97706;
    --gray-50: #F9FAFB;
    --gray-100: #F3F4F6;
    --gray-200: #E5E7EB;
    --gray-300: #D1D5DB;
    --gray-400: #9CA3AF;
    --gray-500: #6B7280;
    --gray-600: #4B5563;
    --gray-700: #374151;
    --gray-800: #1F2937;
    --gray-900: #111827;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -1px rgba(0,0,0,0.04);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--gray-50);
    color: var(--gray-800);
    font-size: 14px;
    line-height: 1.6;
  }

  /* ========== 顶部导航 ========== */
  .navbar {
    background: #fff;
    border-bottom: 1px solid var(--gray-200);
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-icon {
    width: 32px;
    height: 32px;
    background: var(--primary);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
  }
  .nav-tabs {
    display: flex;
    gap: 4px;
  }
  .nav-tab {
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--gray-600);
    font-weight: 500;
    transition: all 0.2s;
    border: none;
    background: transparent;
    font-size: 14px;
  }
  .nav-tab:hover { background: var(--gray-100); color: var(--gray-800); }
  .nav-tab.active { background: var(--primary-light); color: var(--primary); }

  /* ========== 主内容区 ========== */
  .container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px;
  }
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .page-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--gray-900);
  }
  .page-subtitle {
    color: var(--gray-500);
    font-size: 13px;
    margin-top: 4px;
  }

  /* ========== 按钮 ========== */
  .btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: var(--gray-100); color: var(--gray-700); }
  .btn-secondary:hover { background: var(--gray-200); }
  .btn-danger { background: var(--danger-light); color: var(--danger); }
  .btn-danger:hover { background: #FECACA; }
  .btn-gold { background: var(--gold-light); color: var(--gold); }
  .btn-gold:hover { background: #FDE68A; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ========== 卡片 ========== */
  .card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    border: 1px solid var(--gray-200);
  }

  /* ========== 仪表盘 ========== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: #fff;
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--gray-200);
    border-left: 4px solid var(--primary);
  }
  .stat-card.warning { border-left-color: var(--gold); }
  .stat-card.success { border-left-color: var(--success); }
  .stat-card.info { border-left-color: #0EA5E9; }
  .stat-label {
    color: var(--gray-500);
    font-size: 13px;
    margin-bottom: 8px;
  }
  .stat-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--gray-900);
  }
  .stat-extra {
    font-size: 12px;
    color: var(--gray-400);
    margin-top: 4px;
  }
  .dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  /* ========== 列表 ========== */
  .list-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 12px 0;
    border-bottom: 1px solid var(--gray-100);
  }
  .list-item:last-child { border-bottom: none; }
  .list-item-title { font-weight: 600; color: var(--gray-800); margin-bottom: 4px; }
  .list-item-meta { font-size: 12px; color: var(--gray-500); }

  /* ========== 标签 ========== */
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
    background: var(--gray-100);
    color: var(--gray-600);
  }
  .tag-primary { background: var(--primary-light); color: var(--primary); }
  .tag-gold { background: var(--gold-light); color: var(--gold); }
  .tag-success { background: var(--success-light); color: var(--success); }
  .tag-danger { background: var(--danger-light); color: var(--danger); }
  .tag-info { background: #E0F2FE; color: #0284C7; }

  /* ========== 文献卡片 ========== */
  .paper-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 16px;
  }
  .paper-card {
    background: #fff;
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--gray-200);
    transition: all 0.2s;
  }
  .paper-card:hover { box-shadow: var(--shadow-md); }
  .paper-card.milestone {
    border: 2px solid var(--gold);
    background: var(--gold-bg);
  }
  .paper-card-title {
    font-weight: 700;
    font-size: 15px;
    color: var(--gray-900);
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .paper-card-meta {
    font-size: 12px;
    color: var(--gray-500);
    margin-bottom: 8px;
  }
  .paper-card-abstract {
    font-size: 13px;
    color: var(--gray-600);
    margin: 8px 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .paper-card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--gray-100);
  }
  .paper-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .paper-actions { display: flex; gap: 6px; }

  /* ========== 筛选 ========== */
  .filter-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .select, .input {
    padding: 8px 12px;
    border: 1px solid var(--gray-300);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--gray-800);
    outline: none;
    transition: border-color 0.2s;
  }
  .select:focus, .input:focus { border-color: var(--primary); }
  .select { min-width: 160px; }

  /* ========== 弹窗 ========== */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: var(--radius);
    width: 100%;
    max-width: 560px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
  }
  .modal.large { max-width: 760px; }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--gray-200);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-title { font-size: 16px; font-weight: 700; }
  .modal-close {
    cursor: pointer;
    color: var(--gray-400);
    font-size: 24px;
    background: none;
    border: none;
    line-height: 1;
  }
  .modal-close:hover { color: var(--gray-800); }
  .modal-body { padding: 20px; }
  .modal-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--gray-200);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  /* ========== 表单 ========== */
  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--gray-700);
    margin-bottom: 6px;
  }
  .form-label .required { color: var(--danger); }
  .form-input, .form-textarea, .form-select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--gray-300);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--gray-800);
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--primary); }
  .form-textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .checkbox-row input { width: 16px; height: 16px; }

  /* ========== 笔记列表 ========== */
  .note-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 16px;
  }
  .note-list-item {
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid var(--gray-200);
    margin-bottom: 8px;
    transition: all 0.2s;
  }
  .note-list-item:hover { border-color: var(--primary); }
  .note-list-item.active { border-color: var(--primary); background: var(--primary-light); }
  .note-list-item-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .note-list-item-meta { font-size: 12px; color: var(--gray-500); }

  .note-section {
    margin-bottom: 16px;
  }
  .note-section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-700);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .note-section-content {
    padding: 12px;
    background: var(--gray-50);
    border-radius: 8px;
    border: 1px solid var(--gray-200);
    font-size: 13px;
    color: var(--gray-700);
    line-height: 1.7;
    min-height: 40px;
  }
  .note-section-content.editable {
    background: #fff;
    outline: none;
  }
  .note-section-content.editable:focus {
    border-color: var(--primary);
    background: #fff;
  }

  /* ========== AI 纠错 ========== */
  .ai-correction {
    background: linear-gradient(135deg, #EEF2FF 0%, #FEF3C7 100%);
    border: 1px solid var(--primary-light);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 16px;
  }
  .ai-correction-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .ai-correction-title {
    font-weight: 700;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .correction-item {
    background: #fff;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 8px;
    border-left: 3px solid var(--gold);
  }
  .correction-item.high { border-left-color: var(--danger); }
  .correction-item.medium { border-left-color: var(--gold); }
  .correction-item.low { border-left-color: var(--success); }
  .correction-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .correction-type { font-size: 12px; font-weight: 600; color: var(--gray-700); }
  .correction-original {
    font-size: 13px;
    color: var(--danger);
    margin: 6px 0;
    padding: 6px;
    background: var(--danger-light);
    border-radius: 4px;
  }
  .correction-suggestion {
    font-size: 13px;
    color: var(--success);
    margin: 6px 0;
    padding: 6px;
    background: var(--success-light);
    border-radius: 4px;
  }
  .correction-reason {
    font-size: 12px;
    color: var(--gray-500);
    margin-top: 4px;
  }
  .correction-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    justify-content: flex-end;
  }

  /* ========== 时间线 ========== */
  .timeline-container {
    background: #fff;
    border-radius: var(--radius);
    padding: 32px 24px;
    box-shadow: var(--shadow);
    border: 1px solid var(--gray-200);
    overflow-x: auto;
  }
  .timeline {
    position: relative;
    min-width: 800px;
    padding: 40px 0 20px 0;
  }
  .timeline-line {
    position: absolute;
    top: 80px;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--gray-200);
  }
  .timeline-items {
    display: flex;
    justify-content: space-between;
    position: relative;
    padding: 0 20px;
  }
  .timeline-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    max-width: 200px;
    text-align: center;
    cursor: pointer;
    position: relative;
  }
  .timeline-year {
    font-size: 13px;
    font-weight: 700;
    color: var(--gray-700);
    margin-bottom: 8px;
  }
  .timeline-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--primary);
    border: 3px solid #fff;
    box-shadow: 0 0 0 2px var(--primary);
    margin-bottom: 12px;
    transition: transform 0.2s;
  }
  .timeline-item:hover .timeline-dot { transform: scale(1.3); }
  .timeline-item.milestone .timeline-dot {
    background: var(--gold);
    box-shadow: 0 0 0 2px var(--gold), 0 0 12px rgba(245, 158, 11, 0.5);
    width: 20px;
    height: 20px;
  }
  .timeline-card {
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: 8px;
    padding: 10px;
    font-size: 12px;
    color: var(--gray-700);
    line-height: 1.4;
    transition: all 0.2s;
  }
  .timeline-item:hover .timeline-card {
    border-color: var(--primary);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }
  .timeline-item.milestone .timeline-card {
    background: var(--gold-bg);
    border-color: var(--gold);
  }
  .timeline-title {
    font-weight: 600;
    color: var(--gray-900);
    margin-bottom: 4px;
    font-size: 12px;
  }
  .milestone-badge {
    position: absolute;
    top: -8px;
    background: var(--gold);
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 8px;
    font-weight: 700;
  }

  /* ========== 研究方向卡片 ========== */
  .direction-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  .direction-card {
    background: #fff;
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--gray-200);
    border-top: 4px solid var(--primary);
    cursor: pointer;
    transition: all 0.2s;
  }
  .direction-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .direction-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--gray-900);
    margin-bottom: 6px;
  }
  .direction-desc {
    color: var(--gray-600);
    font-size: 13px;
    margin-bottom: 12px;
    line-height: 1.6;
  }
  .direction-stats {
    display: flex;
    gap: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--gray-100);
  }
  .direction-stat {
    font-size: 12px;
    color: var(--gray-500);
  }
  .direction-stat strong {
    font-size: 18px;
    color: var(--primary);
    display: block;
  }

  /* ========== 重要节点 ========== */
  .milestone-group {
    margin-bottom: 24px;
  }
  .milestone-group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--gold-light);
  }
  .milestone-group-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--gray-900);
  }
  .milestone-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .milestone-item {
    background: var(--gold-bg);
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .milestone-year {
    background: var(--gold);
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    min-width: 60px;
    text-align: center;
  }
  .milestone-info { flex: 1; }
  .milestone-title {
    font-weight: 700;
    color: var(--gray-900);
    margin-bottom: 4px;
  }
  .milestone-meta { font-size: 12px; color: var(--gray-600); margin-bottom: 6px; }
  .milestone-note {
    font-size: 13px;
    color: var(--gray-700);
    background: #fff;
    padding: 8px;
    border-radius: 6px;
    border-left: 3px solid var(--gold);
  }

  /* ========== 通用 ========== */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--gray-400);
  }
  .empty-state-icon { font-size: 48px; margin-bottom: 12px; }
  .badge-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    margin-left: 4px;
  }
  .hidden { display: none !important; }
  .text-muted { color: var(--gray-500); }
  .mt-8 { margin-top: 8px; }
  .mt-16 { margin-top: 16px; }
  .mb-8 { margin-bottom: 8px; }
  .mb-16 { margin-bottom: 16px; }

  /* 滚动条美化 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="navbar">
  <div class="logo">
    <div class="logo-icon">文</div>
    <span>文献笔记系统</span>
  </div>
  <div class="nav-tabs" id="navTabs">
    <button class="nav-tab active" data-tab="dashboard">仪表盘</button>
    <button class="nav-tab" data-tab="library">文献库</button>
    <button class="nav-tab" data-tab="notes">我的笔记<span class="badge-dot" id="pendingBadge"></span></button>
    <button class="nav-tab" data-tab="directions">研究方向</button>
    <button class="nav-tab" data-tab="milestones">重要节点</button>
  </div>
</div>

<!-- 主内容 -->
<div class="container">

  <!-- 仪表盘 -->
  <div class="page-content" id="page-dashboard">
    <div class="page-header">
      <div>
        <div class="page-title">仪表盘</div>
        <div class="page-subtitle">文献阅读与笔记进度概览</div>
      </div>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="dashboard-grid">
      <div class="card">
        <div class="page-title" style="font-size: 16px;">最近添加的文献</div>
        <div class="mt-16" id="recentPapersList"></div>
      </div>
      <div class="card">
        <div class="page-title" style="font-size: 16px;">待纠错笔记提醒</div>
        <div class="mt-16" id="pendingNoteList"></div>
      </div>
    </div>
  </div>

  <!-- 文献库 -->
  <div class="page-content hidden" id="page-library">
    <div class="page-header">
      <div>
        <div class="page-title">文献库</div>
        <div class="page-subtitle">管理已读/在读文献，标记重要节点</div>
      </div>
      <button class="btn btn-primary" onclick="openPaperModal()">+ 新增文献</button>

/* ========== 工具函数 ========== */
function uid(prefix) { return prefix + Date.now() + Math.floor(Math.random() * 1000); }

function getDirection(id) { return state.directions.find(d => d.id === id); }
function getPaper(id) { return state.papers.find(p => p.id === id); }
function getNote(id) { return state.notes.find(n => n.id === id); }

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

/* ========== Tab 切换 ========== */
function switchTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  document.querySelectorAll('.page-content').forEach(el => el.classList.add('hidden'));
  document.getElementById('page-' + tab).classList.remove('hidden');
  if (tab === 'dashboard') renderDashboard();
  if (tab === 'library') renderLibrary();
  if (tab === 'notes') renderNotes();
  if (tab === 'directions') renderDirections();
  if (tab === 'milestones') renderMilestones();
}

document.getElementById('navTabs').addEventListener('click', e => {
  const tab = e.target.closest('.nav-tab');
  if (tab) switchTab(tab.dataset.tab);
});

/* ========== 弹窗通用 ========== */
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

/* ========== 仪表盘 ========== */
function renderDashboard() {
  const totalPapers = state.papers.length;
  const totalNotes = state.notes.length;
  const totalDirections = state.directions.length;
  const pendingNotes = state.notes.filter(n => n.status === '待纠错' || n.status === '草稿');

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card info">
      <div class="stat-label">文献总数</div>
      <div class="stat-value">${totalPapers}</div>
      <div class="stat-extra">已读 ${state.papers.filter(p=>p.status==='已读').length} 篇</div>
    </div>
    <div class="stat-card success">
      <div class="stat-label">笔记总数</div>
      <div class="stat-value">${totalNotes}</div>
      <div class="stat-extra">已纠错 ${state.notes.filter(n=>n.status==='已纠错').length} 条</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">研究方向</div>
      <div class="stat-value">${totalDirections}</div>
      <div class="stat-extra">共 ${state.papers.filter(p=>p.isMilestone).length} 个重要节点</div>
    </div>
    <div class="stat-card warning">
      <div class="stat-label">待纠错笔记</div>
      <div class="stat-value">${pendingNotes.length}</div>
      <div class="stat-extra">建议尽快处理</div>
    </div>
  `;

  const recentPapers = [...state.papers].sort((a,b) => b.id.localeCompare(a.id)).slice(0, 5);
  document.getElementById('recentPaperList').innerHTML = recentPapers.length === 0
    ? '<div class="empty-state">暂无文献</div>'
    : recentPapers.map(p => {
        const dir = getDirection(p.directionId);
        return `
          <div class="list-item">
            <div style="flex:1;">
              <div class="list-item-title">${escapeHtml(p.title)}</div>
              <div class="list-item-meta">${p.year} · ${escapeHtml(p.authors)} · ${dir ? escapeHtml(dir.name) : '未分类'}</div>
            </div>
            <span class="tag ${p.isMilestone ? 'tag-gold' : 'tag-primary'}">${p.isMilestone ? '★ 节点' : p.status}</span>
          </div>
        `;
      }).join('');

  document.getElementById('pendingNoteList').innerHTML = pendingNotes.length === 0
    ? '<div class="empty-state">暂无待纠错笔记 🎉</div>'
    : pendingNotes.map(n => {
        const p = getPaper(n.paperId);
        return `
          <div class="list-item">
            <div style="flex:1;">
              <div class="list-item-title">${p ? escapeHtml(p.title) : '已删除文献'}</div>
              <div class="list-item-meta">状态：${n.status}</div>
            </div>
            <button class="btn btn-sm btn-primary" onclick="switchTab('notes'); setTimeout(()=>selectNote('${n.id}'),100);">去处理</button>
          </div>
        `;
      }).join('');

  // 角标提示
  document.getElementById('pendingBadge').style.display = pendingNotes.length > 0 ? 'inline-block' : 'none';
}

/* ========== 文献库 ========== */
function renderLibrary() {
  // 填充筛选方向
  const dirSelect = document.getElementById('paperFilterDirection');
  const currentVal = dirSelect.value;
  dirSelect.innerHTML = '<option value="">全部研究方向</option>' +
    state.directions.map(d => `<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('');
  dirSelect.value = currentVal;

  const dirFilter = dirSelect.value;
  const statusFilter = document.getElementById('paperFilterStatus').value;
  const search = document.getElementById('paperSearch').value.toLowerCase().trim();

  let papers = state.papers.filter(p => {
    if (dirFilter && p.directionId !== dirFilter) return false;
    if (statusFilter && p.status !== statusFilter) return false;
    if (search && !p.title.toLowerCase().includes(search) && !p.authors.toLowerCase().includes(search)) return false;
    return true;
  });
  papers.sort((a,b) => b.year - a.year);

  const grid = document.getElementById('paperGrid');
  if (papers.length === 0) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="empty-state-icon">📚</div><div>暂无符合条件的文献</div></div>';
    return;
  }
  grid.innerHTML = papers.map(p => {
    const dir = getDirection(p.directionId);
    return `
      <div class="paper-card ${p.isMilestone ? 'milestone' : ''}">
        ${p.isMilestone ? '<div class="milestone-badge">★ 重要节点</div>' : ''}
        <div class="paper-card-title">${escapeHtml(p.title)}</div>
        <div class="paper-card-meta">${escapeHtml(p.authors)} · ${p.year} · ${escapeHtml(p.venue || '未标注')}</div>
        <div class="paper-card-abstract">${escapeHtml(p.abstract || '暂无摘要')}</div>
        <div class="paper-tags">
          ${dir ? `<span class="tag tag-primary">${escapeHtml(dir.name)}</span>` : ''}
          <span class="tag ${p.status==='已读'?'tag-success':p.status==='在读'?'tag-info':''}">${p.status}</span>
        </div>
        <div class="paper-card-footer">
          <div class="paper-actions">
            <button class="btn btn-sm btn-secondary" onclick="editPaper('${p.id}')">编辑</button>
            <button class="btn btn-sm btn-danger" onclick="deletePaper('${p.id}')">删除</button>
          </div>
          <button class="btn btn-sm ${p.isMilestone ? 'btn-gold' : 'btn-secondary'}" onclick="toggleMilestone('${p.id}')">
            ${p.isMilestone ? '取消节点' : '标为节点'}
          </button>
        </div>
      </div>
    `;
  }).join('');
}

function openPaperModal() {
  document.getElementById('paperForm').reset();
  document.getElementById('paperId').value = '';
  document.getElementById('paperModalTitle').textContent = '新增文献';
  // 填充研究方向
  const sel = document.getElementById('paperDirection');
  sel.innerHTML = state.directions.map(d => `<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('');
  document.getElementById('milestoneNoteGroup').classList.add('hidden');
  openModal('paperModalMask');
}

function editPaper(id) {
  const p = getPaper(id);
  if (!p) return;
  document.getElementById('paperForm').reset();
  document.getElementById('paperId').value = p.id;
  document.getElementById('paperModalTitle').textContent = '编辑文献';
  document.getElementById('paperTitle').value = p.title;
  document.getElementById('paperAuthors').value = p.authors;
  document.getElementById('paperYear').value = p.year;
  document.getElementById('paperVenue').value = p.venue || '';
  document.getElementById('paperDoi').value = p.doi || '';
  const sel = document.getElementById('paperDirection');

/* ========== AI 纠错模拟 ========== */
function requestAICorrection(noteId) {
  const n = getNote(noteId);
  if (!n) return;
  const p = getPaper(n.paperId);
  if (!p) { alert('关联文献不存在'); return; }

  // 模拟分析过程
  const btn = event.target;
  const originalText = btn.innerText;
  btn.disabled = true;
  btn.innerText = '🤖 AI 分析中...';

  setTimeout(() => {
    btn.disabled = false;
    btn.innerText = originalText;

    const corrections = generateCorrections(n, p);
    n.corrections = corrections;
    n.status = '待纠错';
    selectNote(noteId);
    renderNotes();
  }, 1200);
}

/**
 * 模拟 AI 纠错：基于笔记内容与文献摘要对比，识别可能的理解偏差
 * 规则：检测绝对化表述、与摘要矛盾、关键词缺失等
 */
function generateCorrections(note, paper) {
  const corrections = [];
  const text = `${note.coreIdea} ${note.method} ${note.innovation} ${note.thoughts}`;

  // 规则1：绝对化表述
  const absolutePatterns = [
    { pattern: /完全取代|唯一|所有|绝对|彻底/, type: '过度概括', reason: '使用了绝对化词汇，科学结论通常具有边界条件。' }
  ];
  absolutePatterns.forEach(({ pattern, type, reason }) => {
    const match = text.match(pattern);
    if (match) {
      // 找到包含该词的句子
      const sentence = findSentence(text, match[0]);
      if (sentence) {
        corrections.push({
          id: uid('c'),
          type,
          confidence: 'high',
          original: sentence,
          suggestion: sentence.replace(/完全取代/g, '在多数场景下超越')
                                 .replace(/唯一/g, '主流')
                                 .replace(/所有/g, '多数')
                                 .replace(/绝对/g, '通常')
                                 .replace(/彻底/g, '较大程度'),
          reason
        });
      }
    }
  });

  // 规则2：与摘要关键词对比，检测理解偏差
  const abstractKeywords = extractKeywords(paper.abstract);
  const noteKeywords = extractKeywords(text);
  const missing = abstractKeywords.filter(k => !noteKeywords.includes(k) && k.length > 2);
  if (missing.length > 0 && note.coreIdea) {
    corrections.push({
      id: uid('c'),
      type: '关键信息遗漏',
      confidence: 'medium',
      original: note.coreIdea,
      suggestion: `建议补充摘要中提到的关键概念：${missing.slice(0,3).join('、')}。`,
      reason: '笔记未覆盖摘要中的核心术语，可能存在理解不完整。'
    });
  }

  // 规则3：基于文献生成特定纠错（针对示例笔记）
  if (note.coreIdea && note.coreIdea.includes('起点')) {
    corrections.push({
      id: uid('c'),
      type: '理解偏差',
      confidence: 'medium',
      original: note.coreIdea,
      suggestion: note.coreIdea.replace(/起点/, '重要基础工作之一') + '（注：该方向更早已有相关探索）',
      reason: '将某篇论文称为"起点"通常不够严谨，建议改为"重要基础工作"。'
    });
  }

  // 规则4：思考部分的过度推断
  if (note.thoughts && /解决任何|所有问题|万能|完美/.test(note.thoughts)) {
    corrections.push({
      id: uid('c'),
      type: '过度推断',
      confidence: 'high',
      original: note.thoughts,
      suggestion: '建议改为：在合适规模和场景下，模型能取得优异表现，但仍存在局限。',
      reason: '将"优异表现"夸大为"解决任何问题"是不严谨的，研究结论应保持审慎。'
    });
  }

  // 若无任何问题
  if (corrections.length === 0) {
    corrections.push({
      id: uid('c'),
      type: '通过审核',
      confidence: 'low',
      original: '（笔记整体理解）',
      suggestion: '笔记与文献摘要整体一致，未发现明显偏差，可继续保持。',
      reason: 'AI 未检测到明显的绝对化表述或与摘要的冲突。'
    });
  }

  return corrections;
}

function findSentence(text, keyword) {
  const sentences = text.split(/[。.！!？?\n]/).filter(s => s.includes(keyword));
  return sentences.length > 0 ? sentences[0].trim() : text;
}

function extractKeywords(text) {
  if (!text) return [];
  // 简单分词：中文按字/英文按词
  const en = text.toLowerCase().match(/[a-z]+/g) || [];
  const zh = text.match(/[\u4e00-\u9fa5]{2,}/g) || [];
  return [...new Set([...en, ...zh])];
}

function adoptCorrection(noteId, correctionId) {
  const n = getNote(noteId);
  if (!n) return;
  const c = n.corrections.find(c => c.id === correctionId);
  if (!c) return;
  c.adopted = true;
  // 将建议替换到笔记对应字段（简单处理：替换 coreIdea 中匹配的原文）
  ['coreIdea', 'thoughts', 'method', 'innovation'].forEach(field => {
    if (n[field] && n[field].includes(c.original)) {
      n[field] = n[field].replace(c.original, c.suggestion);
    }
  });
  // 若全部采纳，更新状态
  if (n.corrections.every(c => c.adopted)) {
    n.status = '已纠错';
  }
  selectNote(noteId);
  renderNotes();
}

function ignoreCorrection(noteId, correctionId) {
  const n = getNote(noteId);
  if (!n) return;
  n.corrections = n.corrections.filter(c => c.id !== correctionId);
  selectNote(noteId);
  renderNotes();
}

/* ========== 研究方向 ========== */

          <div class="direction-card" onclick="enterDirection('${d.id}')">

  const note = state.notes.find(n => n.paperId === paperId);
  const dir = getDirection(p.directionId);
  alert(`📄 ${p.title}\n\n作者：${p.authors}\n年份：${p.year}\n期刊/会议：${p.venue||'未标注'}\n研究方向：${dir?dir.name:'未分类'}\n状态：${p.status}\n${p.isMilestone?'\n★ 重要节点：'+(p.milestoneNote||''):''}\n\n摘要：${p.abstract||'暂无'}\n\n${note?'已关联笔记（状态：'+note.status+'）':'尚未撰写笔记'}`);

function backToDirections() {
  state.currentDirectionId = null;
  renderDirections();
}

function openDirectionModal() {
  document.getElementById('directionForm').reset();
  document.getElementById('directionId').value = '';
  document.getElementById('directionModalTitle').textContent = '新增研究方向';
  openModal('directionModalMask');
}

function editDirection(id) {
  const d = getDirection(id);
  if (!d) return;
  document.getElementById('directionId').value = d.id;
  document.getElementById('directionName').value = d.name;
  document.getElementById('directionDesc').value = d.desc || '';
  document.getElementById('directionModalTitle').textContent = '编辑研究方向';
  openModal('directionModalMask');
}

function saveDirection() {
  const id = document.getElementById('directionId').value;
  const name = document.getElementById('directionName').value.trim();
  if (!name) { alert('请填写方向名称'); return; }
  const desc = document.getElementById('directionDesc').value.trim();
  if (id) {
    const d = getDirection(id);
    d.name = name; d.desc = desc;
  } else {
    state.directions.push({ id: uid('d'), name, desc, createTime: new Date().toISOString().slice(0,10) });
  }
  closeModal('directionModalMask');
  renderDirections();
}

function deleteDirection(id) {
  const papers = state.papers.filter(p => p.directionId === id);
  if (papers.length > 0) {
    if (!confirm(`该方向下有 ${papers.length} 篇文献，删除后这些文献将变为"未分类"。确认删除？`)) return;
    papers.forEach(p => p.directionId = null);
  } else {
    if (!confirm('确认删除该研究方向？')) return;
  }
  state.directions = state.directions.filter(d => d.id !== id);
  renderDirections();
}

/* ========== 重要节点 ========== */
function renderMilestones() {
  const content = document.getElementById('milestoneContent');
  const milestones = state.papers.filter(p => p.isMilestone);
  if (milestones.length === 0) {
    content.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⭐</div><div>暂无重要节点，可在文献库中标记</div></div>';
    return;
  }
  // 按方向分组
  const groups = {};
  milestones.forEach(p => {
    const dirId = p.directionId || 'uncat';
    if (!groups[dirId]) groups[dirId] = [];
    groups[dirId].push(p);
  });

  content.innerHTML = Object.keys(groups).map(dirId => {
    const dir = dirId === 'uncat' ? { name: '未分类' } : getDirection(dirId);
    const items = groups[dirId].sort((a,b) => b.year - a.year);
    return `
      <div class="milestone-group">
        <div class="milestone-group-header">
          <span class="milestone-group-title">${escapeHtml(dir.name)}</span>
          <span class="tag tag-gold">${items.length} 篇</span>
        </div>
        <div class="milestone-list">
          ${items.map(p => `
            <div class="milestone-item">
              <div class="milestone-year">${p.year}</div>
              <div class="milestone-info">
                <div class="milestone-title">${escapeHtml(p.title)}</div>
                <div class="milestone-meta">${escapeHtml(p.authors)} · ${escapeHtml(p.venue||'未标注')}</div>
                <div class="milestone-note">📌 ${escapeHtml(p.milestoneNote || '未填写节点说明')}</div>
              </div>
              <button class="btn btn-sm btn-secondary" onclick="switchTab('notes'); setTimeout(()=>{const n=state.notes.find(n=>n.paperId==='${p.id}'); if(n) selectNote(n.id);},100)">查看笔记</button>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

/* ========== 初始化 ========== */
switchTab('dashboard');

</script>
</body>
</html>
