<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>人生记录 Life Archive - 作品功能演示</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #151714;
      --muted: #666d68;
      --soft: #8b9188;
      --bg: #edf0eb;
      --surface: #fffdf7;
      --surface-alt: #f3f0e8;
      --line: #d8d5c9;
      --pine: #173d36;
      --fern: #5d7f56;
      --rust: #9c4f36;
      --lake: #3b7087;
      --plum: #6b5878;
      --marigold: #bd902e;
      --night: #101610;
      --shadow: 0 18px 42px rgba(33, 34, 28, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(90deg, rgba(21, 23, 20, 0.045) 1px, transparent 1px),
        linear-gradient(180deg, rgba(21, 23, 20, 0.04) 1px, transparent 1px),
        radial-gradient(circle at 88% 12%, rgba(59, 112, 135, 0.14), transparent 28%),
        radial-gradient(circle at 20% 94%, rgba(189, 144, 46, 0.16), transparent 24%),
        var(--bg);
      background-size: 32px 32px, 32px 32px, auto, auto, auto;
      color: var(--ink);
      font-family: "Iowan Old Style", "Songti SC", "Noto Serif SC", "Microsoft YaHei", serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(59, 112, 135, 0.28);
      outline-offset: 2px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
      height: 100vh;
      padding: 22px;
      overflow: auto;
      background: var(--night);
      color: #fbf6e8;
      border-right: 1px solid rgba(251, 246, 232, 0.1);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(251, 246, 232, 0.28);
      border-radius: 8px;
      background: rgba(251, 246, 232, 0.08);
      font-family: "Microsoft YaHei", sans-serif;
      font-weight: 900;
    }

    .brand strong,
    .brand small {
      display: block;
    }

    .brand strong {
      font-size: 20px;
      line-height: 1.1;
    }

    .brand small {
      margin-top: 4px;
      color: rgba(251, 246, 232, 0.64);
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 12px;
    }

    .sidebar-art {
      position: relative;
      min-height: 160px;
      overflow: hidden;
      border: 1px solid rgba(251, 246, 232, 0.18);
      border-radius: 8px;
      background:
        linear-gradient(140deg, rgba(251, 246, 232, 0.2), transparent 42%),
        radial-gradient(circle at 70% 30%, rgba(189, 144, 46, 0.6), transparent 28%),
        linear-gradient(180deg, #314b42, #101610 78%);
    }

    .sidebar-art::before,
    .sidebar-art::after {
      position: absolute;
      content: "";
      border: 1px solid rgba(251, 246, 232, 0.18);
      transform: rotate(-8deg);
    }

    .sidebar-art::before {
      inset: 26px 34px 42px 28px;
      background: rgba(251, 246, 232, 0.08);
    }

    .sidebar-art::after {
      inset: 48px 52px 20px 52px;
      background: rgba(251, 246, 232, 0.05);
    }

    .sidebar-art span {
      position: absolute;
      z-index: 1;
      left: 14px;
      right: 14px;
      bottom: 13px;
      color: #fff9ea;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 13px;
      font-weight: 700;
    }

    .nav-list {
      display: grid;
      gap: 7px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: rgba(251, 246, 232, 0.72);
      text-align: left;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .nav-item:hover,
    .nav-item.active {
      border-color: rgba(251, 246, 232, 0.22);
      background: rgba(251, 246, 232, 0.1);
      color: #fff9ea;
    }

    .nav-item.active {
      transform: translateX(2px);
    }

    .privacy-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 14px;
      margin-top: auto;
      border: 1px solid rgba(251, 246, 232, 0.16);
      border-radius: 8px;
      background: rgba(251, 246, 232, 0.08);
    }

    .privacy-card strong,
    .privacy-card span {
      display: block;
    }

    .privacy-card span {
      margin-top: 4px;
      color: rgba(251, 246, 232, 0.62);
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 12px;
      line-height: 1.6;
    }

    .workspace {
      min-width: 0;
      padding: 30px 34px 44px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 22px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(21, 23, 20, 0.12);
    }

    .eyebrow,
    .capsule {
      color: var(--pine);
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 12px;
      font-weight: 700;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 7px;
    }

    .capsule {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid rgba(23, 61, 54, 0.18);
      border-radius: 999px;
      background: rgba(93, 127, 86, 0.1);
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 780px;
      margin-bottom: 8px;
      font-size: 42px;
      line-height: 1.05;
      letter-spacing: 0;
    }

    h2 {
      font-size: 34px;
      line-height: 1.08;
      letter-spacing: 0;
    }

    h3 {
      font-size: 20px;
      line-height: 1.18;
    }

    p {
      color: var(--muted);
      line-height: 1.72;
    }

    .topbar p {
      max-width: 720px;
      margin-bottom: 0;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }

    .topbar-actions,
    .detail-actions,
    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
    }

    .primary-action,
    .secondary-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--pine);
      border-radius: 7px;
      background: var(--pine);
      color: #fff9ea;
      font-family: "Microsoft YaHei", sans-serif;
      font-weight: 700;
      white-space: nowrap;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .primary-action:hover {
      background: #0f2f2a;
      box-shadow: 0 10px 22px rgba(23, 61, 54, 0.18);
      transform: translateY(-1px);
    }

    .secondary-action {
      background: transparent;
      color: var(--ink);
    }

    .secondary-action:hover {
      background: rgba(23, 61, 54, 0.06);
    }

    .compact-action {
      min-height: 36px;
      padding: 0 11px;
      font-size: 13px;
    }

    .danger-action {
      border-color: rgba(139, 45, 34, 0.42);
      color: #8b2d22;
    }

    .home-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) 320px;
      gap: 18px;
    }

    .intro-panel,
    .today-panel,
    .composer,
    .memory-detail,
    .person-form,
    .person-card,
    .settings-panel,
    .export-panel,
    .ai-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 247, 0.92);
      box-shadow: var(--shadow);
    }

    .intro-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 210px;
      gap: 28px;
      min-height: 300px;
      padding: 32px;
      border-top: 4px solid var(--pine);
    }

    .intro-copy h2 {
      max-width: 720px;
      margin: 14px 0;
    }

    .intro-copy p {
      max-width: 700px;
      margin-bottom: 0;
    }

    .metrics {
      display: grid;
      align-content: center;
      gap: 12px;
    }

    .metric {
      min-height: 74px;
      padding: 13px 14px;
      border-left: 4px solid var(--fern);
      background: linear-gradient(90deg, rgba(93, 127, 86, 0.14), rgba(255, 253, 247, 0));
    }

    .metric:nth-child(2) {
      border-left-color: var(--lake);
      background: linear-gradient(90deg, rgba(59, 112, 135, 0.13), rgba(255, 253, 247, 0));
    }

    .metric:nth-child(3) {
      border-left-color: var(--rust);
      background: linear-gradient(90deg, rgba(156, 79, 54, 0.12), rgba(255, 253, 247, 0));
    }

    .metric strong,
    .metric span {
      display: block;
    }

    .metric strong {
      font-size: 32px;
      line-height: 1;
    }

    .metric span {
      margin-top: 5px;
      color: var(--muted);
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 12px;
    }

    .today-panel {
      position: relative;
      min-height: 300px;
      padding: 24px;
      overflow: hidden;
      border-top: 4px solid var(--marigold);
    }

    .today-panel::after {
      position: absolute;
      right: -38px;
      bottom: -44px;
      width: 138px;
      height: 138px;
      content: "";
      border: 1px solid rgba(189, 144, 46, 0.28);
      transform: rotate(12deg);
    }

    .composer {
      grid-column: 1 / -1;
      padding: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 16px 0;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
    }

    input,
    select {
      height: 44px;
      padding: 0 12px;
    }

    textarea {
      min-height: 116px;
      padding: 12px;
      resize: vertical;
    }

    input::placeholder,
    textarea::placeholder {
      color: #9a9589;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--lake);
      box-shadow: 0 0 0 3px rgba(59, 112, 135, 0.14);
    }

    .people-select,
    .tag-cloud,
    .linked-people {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .select-chip,
    .person-chip,
    .tag-cloud span,
    .visibility-pill,
    .category-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--ink);
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 12px;
    }

    .select-chip:hover,
    .select-chip.active {
      border-color: rgba(23, 61, 54, 0.34);
      background: rgba(93, 127, 86, 0.14);
    }

    .timeline-layout {
      display: grid;
      grid-template-columns: minmax(300px, 0.85fr) minmax(0, 1.15fr);
      gap: 18px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 190px;
      gap: 10px;
      margin-bottom: 12px;
    }

    .timeline-list {
      display: grid;
      gap: 10px;
    }

    .memory-row {
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      width: 100%;
      min-height: 78px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 247, 0.78);
      color: var(--ink);
      text-align: left;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease, background 160ms ease;
    }

    .memory-row:hover,
    .memory-row.selected {
      border-color: rgba(23, 61, 54, 0.34);
      background: var(--surface);
      box-shadow: 0 12px 26px rgba(33, 34, 28, 0.08);
      transform: translateY(-1px);
    }

    .memory-row strong,
    .memory-row small {
      display: block;
    }

    .memory-row small {
      margin-top: 6px;
      color: var(--muted);
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 12px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--fern);
    }

    .dot.family {
      background: var(--rust);
    }

    .dot.artifact {
      background: var(--marigold);
    }

    .dot.reflection {
      background: var(--lake);
    }

    .memory-detail {
      min-height: 520px;
      padding: 32px;
    }

    .detail-header,
    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
    }

    .detail-meta span {
      color: var(--muted);
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 13px;
    }

    .memory-body {
      padding: 22px 0;
      margin-bottom: 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: #343832;
      font-size: 18px;
    }

    .linked-people {
      display: block;
      margin-top: 26px;
    }

    .person-chip i {
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border-radius: 999px;
      color: #fff9ea;
      font-style: normal;
      font-size: 12px;
    }

    .people-layout {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 18px;
    }

    .person-form {
      display: grid;
      gap: 12px;
      align-self: start;
      padding: 22px;
    }

    .person-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .person-card {
      padding: 22px;
    }

    .avatar {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 8px;
      color: #fff9ea;
      font-size: 22px;
    }

    .person-card h3 {
      margin-bottom: 4px;
    }

    .person-card span,
    .person-card small {
      color: var(--muted);
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 13px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .settings-panel,
    .export-panel,
    .ai-panel {
      display: grid;
      gap: 16px;
      align-content: start;
      padding: 28px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface-alt);
      font-family: "Microsoft YaHei", sans-serif;
    }

    .toggle-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--pine);
    }

    .export-panel {
      max-width: 860px;
      border-top: 4px solid var(--lake);
    }

    .export-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    pre {
      overflow: auto;
      padding: 18px;
      border-radius: 8px;
      background: #121713;
      color: #fff9ea;
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    .ai-layout {
      display: grid;
      grid-template-columns: minmax(0, 0.86fr) minmax(0, 1.14fr);
      gap: 18px;
    }

    .ai-text {
      min-height: 190px;
    }

    .ai-output {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .field {
      min-height: 78px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      font-family: "Microsoft YaHei", sans-serif;
    }

    .field span {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .field.wide {
      grid-column: 1 / -1;
      border-left: 4px solid var(--marigold);
      background: rgba(189, 144, 46, 0.12);
    }

    .empty-state {
      display: grid;
      min-height: 320px;
      place-items: center;
      color: var(--muted);
      font-family: "Microsoft YaHei", sans-serif;
    }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 40;
      max-width: min(360px, calc(100vw - 44px));
      padding: 14px 16px;
      border: 1px solid rgba(23, 61, 54, 0.22);
      border-radius: 8px;
      background: rgba(255, 253, 247, 0.95);
      box-shadow: var(--shadow);
      color: var(--pine);
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1180px) {
      .home-grid,
      .intro-panel,
      .ai-layout {
        grid-template-columns: 1fr;
      }

      .metrics {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .timeline-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 920px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: relative;
        height: auto;
        padding: 16px;
      }

      .sidebar-art,
      .privacy-card {
        display: none;
      }

      .nav-list {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }

      .nav-item {
        justify-content: center;
        min-width: 0;
        padding: 0 6px;
      }

      .workspace {
        padding: 24px 20px 36px;
      }

      .people-layout,
      .settings-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .topbar {
        display: grid;
      }

      .topbar-actions {
        justify-content: stretch;
      }

      h1 {
        font-size: 34px;
      }

      h2 {
        font-size: 28px;
      }

      .form-grid,
      .toolbar,
      .ai-output {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      .brand small,
      .nav-item span {
        display: none;
      }

      .nav-list {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 6px;
      }

      .nav-item {
        min-height: 38px;
        font-size: 18px;
      }

      .workspace {
        padding: 18px 12px 28px;
      }

      .intro-panel,
      .today-panel,
      .composer,
      .memory-detail,
      .person-form,
      .person-card,
      .settings-panel,
      .export-panel,
      .ai-panel {
        padding: 18px;
      }

      .metrics {
        grid-template-columns: 1fr;
      }

      .primary-action,
      .secondary-action {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">档</div>
        <div>
          <strong>人生记录</strong>
          <small>Life Archive · 作品演示</small>
        </div>
      </div>

      <div class="sidebar-art">
        <span>一个长期、私密、可传承的生命档案工作台</span>
      </div>

      <nav class="nav-list" aria-label="功能导航">
        <button class="nav-item active" data-view="home">⌂ <span>总览</span></button>
        <button class="nav-item" data-view="timeline">◷ <span>时间线</span></button>
        <button class="nav-item" data-view="people">◎ <span>人物</span></button>
        <button class="nav-item" data-view="ai">✦ <span>AI 整理</span></button>
        <button class="nav-item" data-view="privacy">◇ <span>隐私</span></button>
        <button class="nav-item" data-view="export">⇩ <span>导出</span></button>
      </nav>

      <div class="privacy-card">
        <span>◇</span>
        <div>
          <strong>本地演示</strong>
          <span>本 HTML 使用浏览器内存模拟数据，适合直接上传为作品功能展示文件。</span>
        </div>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div>
          <span class="eyebrow" id="page-kicker">0qwert1 的工作空间</span>
          <h1 id="page-title">生命档案工作台</h1>
          <p id="page-description">把重要事件、人物关系和托管意愿整理进一个长期可维护的私密空间。</p>
        </div>
        <div class="topbar-actions">
          <button class="secondary-action" id="reset-demo">重置演示数据</button>
          <button class="primary-action" data-view-jump="home">新增记忆</button>
        </div>
      </header>

      <section id="view-root"></section>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const categories = {
      milestone: { label: "重要节点", dot: "" },
      family: { label: "家庭记忆", dot: "family" },
      reflection: { label: "自我提问", dot: "reflection" },
      artifact: { label: "物件档案", dot: "artifact" }
    };

    const visibilityLabels = {
      private: "仅自己",
      family: "家人可见",
      legacy: "可托管"
    };

    const meta = {
      home: {
        kicker: "0qwert1 的工作空间",
        title: "生命档案工作台",
        description: "把重要事件、人物关系和托管意愿整理进一个长期可维护的私密空间。"
      },
      timeline: {
        kicker: "Memory Timeline",
        title: "生命时间线",
        description: "按日期回看人生片段，用类型、地点、人物和标签快速定位。"
      },
      people: {
        kicker: "People Index",
        title: "人物索引",
        description: "把生命档案里的重要关系单独沉淀，连接到每一条记忆。"
      },
      ai: {
        kicker: "AI Memory Assistant",
        title: "AI 记忆整理助手",
        description: "把自然语言记忆整理成可保存的结构化档案，并生成追问与隐私建议。"
      },
      privacy: {
        kicker: "Private Vault",
        title: "隐私与托管",
        description: "管理本地保存、备份提醒和未来可托管联系人的基本信息。"
      },
      export: {
        kicker: "Portable Archive",
        title: "导出与迁移",
        description: "把当前档案打包成 JSON，保留迁移、备份和后续接入后端的余地。"
      }
    };

    const seedState = {
      people: [
        { id: "p-mother", name: "妈妈", relation: "母亲", note: "童年相册、节日饭桌、家里的旧地址都和她有关。", color: "#d37d55" },
        { id: "p-friend", name: "阿远", relation: "老友", note: "大学时一起写代码的人，很多职业选择都受他影响。", color: "#5d8c6a" },
        { id: "p-child", name: "未来的孩子", relation: "收信人", note: "写给未来家庭成员看的解释、选择和故事。", color: "#b49a43" }
      ],
      memories: [
        {
          id: "m-001",
          title: "第一台属于自己的电脑",
          date: "2009-08-18",
          category: "milestone",
          visibility: "family",
          location: "老家书桌",
          people: ["p-mother"],
          tags: ["童年", "技术", "起点"],
          body: "那天晚上反复开机关机，像在确认一个新世界真的属于我。后来很多选择都从这台电脑开始。"
        },
        {
          id: "m-002",
          title: "和阿远通宵做第一个网页",
          date: "2015-11-03",
          category: "reflection",
          visibility: "private",
          location: "学校机房",
          people: ["p-friend"],
          tags: ["朋友", "前端", "转折"],
          body: "页面很丑，但第一次感到代码能把想法变成一个别人可以打开的东西。"
        },
        {
          id: "m-003",
          title: "写给未来家庭的一封说明",
          date: "2026-06-30",
          category: "artifact",
          visibility: "legacy",
          location: "书房",
          people: ["p-child"],
          tags: ["数字遗产", "家人", "长期"],
          body: "如果有一天我不能亲口解释，希望这里保存的不只是账号和文件，也保存我为什么做这些选择。"
        }
      ],
      settings: {
        localOnly: true,
        exportReminder: true,
        legacyContact: "暂未指定",
        vaultNote: "第一版强调本地优先。正式上线前需要补充加密、备份、访问日志和托管确认流程。"
      }
    };

    let state = structuredClone(seedState);
    let activeView = "home";
    let activeMemoryId = state.memories[0].id;
    let query = "";
    let categoryFilter = "all";

    const root = document.querySelector("#view-root");
    const toast = document.querySelector("#toast");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(date) {
      return new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "long", day: "numeric" }).format(new Date(`${date}T00:00:00`));
    }

    function splitTags(value) {
      return value.split(/[,，\s]+/).map((item) => item.trim()).filter(Boolean);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2300);
    }

    function setView(view) {
      activeView = view;
      document.querySelectorAll(".nav-item").forEach((item) => {
        item.classList.toggle("active", item.dataset.view === view);
      });
      const page = meta[view];
      document.querySelector("#page-kicker").textContent = page.kicker;
      document.querySelector("#page-title").textContent = page.title;
      document.querySelector("#page-description").textContent = page.description;
      render();
    }

    function getPerson(id) {
      return state.people.find((person) => person.id === id);
    }

    function memoryPeople(memory) {
      return memory.people.map(getPerson).filter(Boolean);
    }

    function sortedMemories() {
      return [...state.memories].sort((a, b) => b.date.localeCompare(a.date));
    }

    function filteredMemories() {
      const needle = query.trim().toLowerCase();
      return sortedMemories().filter((memory) => {
        const matchesCategory = categoryFilter === "all" || memory.category === categoryFilter;
        const text = [
          memory.title,
          memory.location,
          memory.body,
          ...memory.tags,
          ...memoryPeople(memory).map((person) => person.name)
        ].join(" ").toLowerCase();
        return matchesCategory && (!needle || text.includes(needle));
      });
    }

    function renderHome() {
      const legacyCount = state.memories.filter((memory) => memory.visibility === "legacy").length;
      root.innerHTML = `
        <section class="home-grid">
          <article class="intro-panel">
            <div class="intro-copy">
              <span class="capsule">作品功能演示</span>
              <h2>不是动态流，而是可长期维护的人生索引。</h2>
              <p>这个单页 HTML 模拟了项目的核心流程：新增记忆、时间线浏览、人物关联、AI 结构化整理、隐私托管与 JSON 导出。它适合作为报名时上传的 TRAE Work 创意产物。</p>
            </div>
            <div class="metrics">
              <div class="metric"><strong>${state.memories.length}</strong><span>记忆记录</span></div>
              <div class="metric"><strong>${state.people.length}</strong><span>相关人物</span></div>
              <div class="metric"><strong>${legacyCount}</strong><span>可托管记录</span></div>
            </div>
          </article>

          <article class="today-panel">
            <span class="capsule">今日示例</span>
            <h3>记录“第一次参加 AI Demo 比赛”</h3>
            <p>保存后它会进入时间线，并可以关联人物、标签、地点与可见范围。</p>
            <button class="primary-action" id="fill-sample">填入示例记录</button>
          </article>

          <form class="composer" id="memory-form">
            <span class="capsule">新增记忆</span>
            <div class="form-grid">
              <input name="title" placeholder="标题，例如：第一次参加 AI Demo 比赛" required />
              <input name="date" type="date" value="${new Date().toISOString().slice(0, 10)}" required />
              <select name="category">
                ${Object.entries(categories).map(([key, item]) => `<option value="${key}">${item.label}</option>`).join("")}
              </select>
              <select name="visibility">
                ${Object.entries(visibilityLabels).map(([key, label]) => `<option value="${key}">${label}</option>`).join("")}
              </select>
              <input name="location" placeholder="地点，例如：比赛现场" />
              <input name="tags" placeholder="标签，用逗号分隔，例如：AI，产品，转折" />
            </div>
            <div class="people-select">
              ${state.people.map((person) => `<button class="select-chip" type="button" data-person="${person.id}">${escapeHtml(person.name)}</button>`).join("")}
            </div>
            <textarea name="body" placeholder="写下这件事的经过，以及它为什么重要。" required></textarea>
            <button class="primary-action">保存到时间线</button>
          </form>
        </section>
      `;

      const selectedPeople = new Set();
      root.querySelectorAll("[data-person]").forEach((button) => {
        button.addEventListener("click", () => {
          const id = button.dataset.person;
          if (selectedPeople.has(id)) selectedPeople.delete(id);
          else selectedPeople.add(id);
          button.classList.toggle("active", selectedPeople.has(id));
        });
      });

      root.querySelector("#fill-sample").addEventListener("click", () => {
        const form = root.querySelector("#memory-form");
        form.title.value = "第一次参加 AI Demo 比赛";
        form.category.value = "milestone";
        form.visibility.value = "family";
        form.location.value = "TRAE 创造力大赛";
        form.tags.value = "AI，产品，生命档案";
        form.body.value = "这是我第一次把关于生命档案的想法做成可演示产品。它让我意识到，AI 不只可以提高效率，也可以帮助人保存那些原本容易消失的个人意义。";
        selectedPeople.add("p-child");
        root.querySelectorAll("[data-person]").forEach((button) => {
          button.classList.toggle("active", selectedPeople.has(button.dataset.person));
        });
      });

      root.querySelector("#memory-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const memory = {
          id: `m-${Date.now()}`,
          title: form.title.value.trim(),
          date: form.date.value,
          category: form.category.value,
          visibility: form.visibility.value,
          location: form.location.value.trim(),
          people: [...selectedPeople],
          tags: splitTags(form.tags.value),
          body: form.body.value.trim()
        };
        if (!memory.title || !memory.body) return;
        state.memories.unshift(memory);
        activeMemoryId = memory.id;
        showToast("记录已保存到时间线。");
        setView("timeline");
      });
    }

    function renderTimeline() {
      const memories = filteredMemories();
      const selected = state.memories.find((memory) => memory.id === activeMemoryId) || memories[0] || state.memories[0];
      if (selected) activeMemoryId = selected.id;

      root.innerHTML = `
        <section class="timeline-layout">
          <div>
            <div class="toolbar">
              <input id="search" placeholder="搜索标题、正文、标签或人物" value="${escapeHtml(query)}" />
              <select id="category-filter">
                <option value="all">全部类型</option>
                ${Object.entries(categories).map(([key, item]) => `<option value="${key}" ${categoryFilter === key ? "selected" : ""}>${item.label}</option>`).join("")}
              </select>
            </div>
            <div class="timeline-list">
              ${memories.map((memory) => `
                <button class="memory-row ${selected && selected.id === memory.id ? "selected" : ""}" data-memory="${memory.id}">
                  <span class="dot ${categories[memory.category].dot}"></span>
                  <div>
                    <strong>${escapeHtml(memory.title)}</strong>
                    <small>${formatDate(memory.date)} · ${categories[memory.category].label}</small>
                  </div>
                </button>
              `).join("") || `<div class="empty-state">没有找到匹配记录。</div>`}
            </div>
          </div>

          <article class="memory-detail">
            ${selected ? renderMemoryDetail(selected) : `<div class="empty-state">还没有记录，先写下第一条。</div>`}
          </article>
        </section>
      `;

      root.querySelector("#search").addEventListener("input", (event) => {
        query = event.target.value;
        renderTimeline();
      });
      root.querySelector("#category-filter").addEventListener("change", (event) => {
        categoryFilter = event.target.value;
        renderTimeline();
      });
      root.querySelectorAll("[data-memory]").forEach((button) => {
        button.addEventListener("click", () => {
          activeMemoryId = button.dataset.memory;
          renderTimeline();
        });
      });
      const deleteButton = root.querySelector("#delete-memory");
      if (deleteButton) {
        deleteButton.addEventListener("click", () => {
          state.memories = state.memories.filter((memory) => memory.id !== activeMemoryId);
          activeMemoryId = state.memories[0]?.id || "";
          showToast("演示记录已删除。");
          renderTimeline();
        });
      }
    }

    function renderMemoryDetail(memory) {
      const people = memoryPeople(memory);
      return `
        <div class="detail-header">
          <span class="category-pill">${categories[memory.category].label}</span>
          <span class="visibility-pill">${visibilityLabels[memory.visibility]}</span>
          <div class="detail-actions">
            <button class="secondary-action compact-action danger-action" id="delete-memory">删除</button>
          </div>
        </div>
        <h2>${escapeHtml(memory.title)}</h2>
        <div class="detail-meta">
          <span>${formatDate(memory.date)}</span>
          ${memory.location ? `<span>${escapeHtml(memory.location)}</span>` : ""}
        </div>
        <p class="memory-body">${escapeHtml(memory.body)}</p>
        <div class="tag-cloud">
          ${memory.tags.map((tag) => `<span>${escapeHtml(tag)}</span>`).join("")}
        </div>
        <div class="linked-people">
          <h3>相关人物</h3>
          <div class="people-select">
            ${people.map((person) => `<span class="person-chip"><i style="background:${person.color}">${escapeHtml(person.name.slice(0, 1))}</i>${escapeHtml(person.name)}</span>`).join("") || `<p>暂未关联人物。</p>`}
          </div>
        </div>
      `;
    }

    function renderPeople() {
      root.innerHTML = `
        <section class="people-layout">
          <form class="person-form" id="person-form">
            <span class="capsule">新增人物</span>
            <input name="name" placeholder="姓名或称呼" required />
            <input name="relation" placeholder="关系，例如：母亲、朋友、老师" />
            <textarea name="note" placeholder="这个人和你生命档案的关系"></textarea>
            <button class="primary-action">加入人物索引</button>
          </form>

          <div class="person-grid">
            ${state.people.map((person) => {
              const count = state.memories.filter((memory) => memory.people.includes(person.id)).length;
              return `
                <article class="person-card">
                  <div class="avatar" style="background:${person.color}">${escapeHtml(person.name.slice(0, 1))}</div>
                  <h3>${escapeHtml(person.name)}</h3>
                  <span>${escapeHtml(person.relation)}</span>
                  <p>${escapeHtml(person.note)}</p>
                  <small>${count} 条相关记录</small>
                </article>
              `;
            }).join("")}
          </div>
        </section>
      `;

      root.querySelector("#person-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const colors = ["#5d8c6a", "#d37d55", "#57738b", "#b49a43", "#8a6f9d"];
        state.people.push({
          id: `p-${Date.now()}`,
          name: form.name.value.trim(),
          relation: form.relation.value.trim() || "未标注关系",
          note: form.note.value.trim() || "还没有补充说明。",
          color: colors[state.people.length % colors.length]
        });
        showToast("人物已加入索引。");
        renderPeople();
      });
    }

    function renderAi() {
      root.innerHTML = `
        <section class="ai-layout">
          <article class="ai-panel">
            <span class="capsule">自然语言输入</span>
            <h2>输入一段记忆，让 AI 生成结构化草稿</h2>
            <p>这里是前端演示版，会用规则模拟 AI 输出。正式接入大模型后，可自动识别日期、人物、地点、标签和隐私建议。</p>
            <textarea class="ai-text" id="ai-text">2009 年暑假，妈妈给我买了第一台电脑。我在老家书桌前反复开机关机，那是我第一次感觉自己可以进入一个新世界。后来我开始学做网页，也慢慢确定了和技术有关的人生方向。</textarea>
            <button class="primary-action" id="ai-generate">生成档案草稿</button>
          </article>

          <article class="ai-panel">
            <span class="capsule">AI 输出预览</span>
            <h2>结构化结果</h2>
            <div class="ai-output" id="ai-output">
              ${renderAiFields()}
            </div>
          </article>
        </section>
      `;

      root.querySelector("#ai-generate").addEventListener("click", () => {
        const text = root.querySelector("#ai-text").value.trim();
        const hasMother = /妈|母亲/.test(text);
        const hasComputer = /电脑|网页|技术|代码/.test(text);
        root.querySelector("#ai-output").innerHTML = renderAiFields({
          date: text.match(/\d{4}\s*年[^，。]*/)?.[0] || "需要用户补充",
          people: hasMother ? "妈妈" : "待识别",
          place: text.includes("老家") ? "老家书桌" : "待识别",
          category: hasComputer ? "重要节点" : "自我提问",
          tags: hasComputer ? "童年、技术、起点" : "回忆、人生片段",
          question: "这件事后来如何影响你的职业选择或家庭关系？"
        });
        showToast("已生成结构化草稿。");
      });
    }

    function renderAiFields(result = {
      date: "2009 年暑假",
      people: "妈妈",
      place: "老家书桌",
      category: "重要节点",
      tags: "童年、技术、起点",
      question: "这件事后来如何影响你的职业选择？"
    }) {
      return `
        <div class="field"><span>日期</span><strong>${escapeHtml(result.date)}</strong></div>
        <div class="field"><span>人物</span><strong>${escapeHtml(result.people)}</strong></div>
        <div class="field"><span>地点</span><strong>${escapeHtml(result.place)}</strong></div>
        <div class="field"><span>类型</span><strong>${escapeHtml(result.category)}</strong></div>
        <div class="field"><span>标签</span><strong>${escapeHtml(result.tags)}</strong></div>
        <div class="field"><span>隐私建议</span><strong>家人可见</strong></div>
        <div class="field wide"><span>AI 追问</span><strong>${escapeHtml(result.question)}</strong></div>
      `;
    }

    function renderPrivacy() {
      root.innerHTML = `
        <section class="settings-grid">
          <article class="settings-panel">
            <span class="capsule">隐私边界</span>
            <h2>可见范围与本地优先</h2>
            <label class="toggle-row">
              <input type="checkbox" id="local-only" ${state.settings.localOnly ? "checked" : ""} />
              <span>演示中优先强调本地保存和用户可导出</span>
            </label>
            <label class="toggle-row">
              <input type="checkbox" id="export-reminder" ${state.settings.exportReminder ? "checked" : ""} />
              <span>提醒用户定期导出备份</span>
            </label>
          </article>

          <article class="settings-panel">
            <span class="capsule">托管说明</span>
            <h2>未来可托管联系人</h2>
            <input id="legacy-contact" value="${escapeHtml(state.settings.legacyContact)}" />
            <textarea id="vault-note">${escapeHtml(state.settings.vaultNote)}</textarea>
            <button class="primary-action" id="save-settings">保存设置</button>
          </article>
        </section>
      `;

      root.querySelector("#save-settings").addEventListener("click", () => {
        state.settings.localOnly = root.querySelector("#local-only").checked;
        state.settings.exportReminder = root.querySelector("#export-reminder").checked;
        state.settings.legacyContact = root.querySelector("#legacy-contact").value;
        state.settings.vaultNote = root.querySelector("#vault-note").value;
        showToast("隐私与托管设置已更新。");
      });
    }

    function renderExport() {
      root.innerHTML = `
        <section class="export-panel">
          <span class="capsule">Portable Archive</span>
          <h2>把档案带走</h2>
          <p>生命档案不应该被锁死在某个平台里。这个演示支持把当前数据导出为 JSON，用来展示项目的迁移和备份思路。</p>
          <div class="export-actions">
            <button class="primary-action" id="download-json">下载 JSON</button>
            <button class="secondary-action" id="copy-json">复制 JSON</button>
          </div>
          <pre id="json-preview">${escapeHtml(JSON.stringify(state, null, 2))}</pre>
        </section>
      `;

      root.querySelector("#download-json").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "life-archive-demo.json";
        link.click();
        URL.revokeObjectURL(url);
        showToast("JSON 已生成下载。");
      });

      root.querySelector("#copy-json").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(JSON.stringify(state, null, 2));
          showToast("JSON 已复制。");
        } catch {
          showToast("当前浏览器限制复制，可直接选中下方 JSON。");
        }
      });
    }

    function render() {
      if (activeView === "home") renderHome();
      if (activeView === "timeline") renderTimeline();
      if (activeView === "people") renderPeople();
      if (activeView === "ai") renderAi();
      if (activeView === "privacy") renderPrivacy();
      if (activeView === "export") renderExport();
    }

    document.querySelectorAll("[data-view]").forEach((button) => {
      button.addEventListener("click", () => setView(button.dataset.view));
    });

    document.querySelectorAll("[data-view-jump]").forEach((button) => {
      button.addEventListener("click", () => setView(button.dataset.viewJump));
    });

    document.querySelector("#reset-demo").addEventListener("click", () => {
      state = structuredClone(seedState);
      activeMemoryId = state.memories[0].id;
      query = "";
      categoryFilter = "all";
      showToast("已恢复初始演示数据。");
      render();
    });

    render();
  </script>
</body>
</html>
