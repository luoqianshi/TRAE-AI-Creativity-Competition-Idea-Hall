<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xmAI - 智能AI助手</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6C5CE7; --primary-light: #A29BFE; --primary-dark: #5541D7;
            --bg-dark: #0F0F1A; --bg-card: #1A1A2E; --bg-input: #16162A;
            --text-main: #E8E8F0; --text-dim: #8888AA; --text-bright: #FFFFFF;
            --accent-green: #00D2A0; --accent-orange: #FF6B35; --accent-red: #FF4757;
            --border: rgba(108, 92, 231, 0.15); --glow: rgba(108, 92, 231, 0.3);
        }
        body { font-family: 'Noto Sans SC', 'Inter', sans-serif; background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

        /* ====== LOGIN ====== */
        .login-page { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; transition: opacity .5s, visibility .5s; }
        .login-page.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .login-bg { position: absolute; inset: 0; overflow: hidden; }
        .login-bg .orb { position: absolute; border-radius: 50%; filter: blur(100px); animation: float 20s ease-in-out infinite; }
        .login-bg .orb:nth-child(1) { width: 500px; height: 500px; background: rgba(108,92,231,.15); top: -15%; left: -10%; }
        .login-bg .orb:nth-child(2) { width: 400px; height: 400px; background: rgba(0,210,160,.1); bottom: -15%; right: -10%; animation-delay: -7s; }
        .login-bg .orb:nth-child(3) { width: 300px; height: 300px; background: rgba(255,107,53,.08); top: 40%; left: 60%; animation-delay: -14s; }
        @keyframes float { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(30px,-50px) scale(1.1)} 66%{transform:translate(-20px,30px) scale(.95)} }
        .login-card { position: relative; z-index: 1; background: rgba(26,26,46,.85); backdrop-filter: blur(30px); border: 1px solid var(--border); border-radius: 24px; padding: 48px 40px; width: 420px; max-width: 90vw; text-align: center; animation: fadeUp .6s ease; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
        .login-logo { width: 72px; height: 72px; margin: 0 auto 20px; background: linear-gradient(135deg, var(--primary), var(--accent-green)); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; color: #fff; box-shadow: 0 10px 40px var(--glow); animation: breathe 4s ease-in-out infinite; }
        @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        .login-card h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; background: linear-gradient(135deg, var(--primary-light), var(--accent-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .login-card .sub { color: var(--text-dim); font-size: 14px; margin-bottom: 32px; }
        .login-step { display: none; }
        .login-step.active { display: block; animation: fadeUp .4s ease; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 8px; font-weight: 500; }
        .form-input { width: 100%; padding: 14px 16px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); font-family: inherit; font-size: 15px; outline: none; transition: border-color .2s, box-shadow .2s; }
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(108,92,231,.15); }
        .form-input::placeholder { color: var(--text-dim); opacity: .5; }
        .form-input:disabled { opacity: .5; cursor: not-allowed; }
        .code-row { display: flex; gap: 10px; }
        .code-row .form-input { flex: 1; }
        .send-code-btn { padding: 0 20px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; font-family: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; transition: all .2s; }
        .send-code-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px var(--glow); }
        .send-code-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        .sim-code-box { margin-top: 12px; padding: 12px 16px; background: rgba(0,210,160,.1); border: 1px solid rgba(0,210,160,.2); border-radius: 10px; font-size: 13px; color: var(--accent-green); display: none; align-items: center; gap: 8px; }
        .sim-code-box.show { display: flex; }
        .sim-code-box .code-num { font-size: 28px; font-weight: 700; letter-spacing: 8px; font-family: 'JetBrains Mono', monospace; }
        .password-row { position: relative; }
        .toggle-pwd { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 16px; }
        .login-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; transition: all .2s; margin-top: 8px; }
        .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 25px var(--glow); }
        .step-indicator { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 28px; }
        .step-dot { width: 32px; height: 4px; border-radius: 2px; background: var(--border); transition: all .3s; }
        .step-dot.active { background: var(--primary); width: 48px; }
        .step-dot.done { background: var(--accent-green); }
        .error-msg { color: var(--accent-red); font-size: 12px; margin-top: 6px; display: none; }
        .error-msg.show { display: block; }

        /* ====== MAIN APP ====== */
        .bg-effect { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .bg-effect .orb { position: absolute; border-radius: 50%; filter: blur(80px); animation: float 20s ease-in-out infinite; }
        .bg-effect .orb:nth-child(1) { width: 400px; height: 400px; background: rgba(108,92,231,.12); top: -10%; left: -5%; }
        .bg-effect .orb:nth-child(2) { width: 300px; height: 300px; background: rgba(0,210,160,.08); bottom: -10%; right: -5%; animation-delay: -7s; }
        .bg-effect .orb:nth-child(3) { width: 250px; height: 250px; background: rgba(255,107,53,.06); top: 50%; left: 50%; animation-delay: -14s; }
        .app { position: relative; z-index: 1; display: flex; height: 100vh; }

        /* Sidebar */
        .sidebar { width: 280px; background: rgba(26,26,46,.8); backdrop-filter: blur(20px); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--primary), var(--accent-green)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff; box-shadow: 0 4px 15px var(--glow); animation: pulse-glow 3s ease-in-out infinite; }
        @keyframes pulse-glow { 0%,100%{box-shadow:0 4px 15px var(--glow)} 50%{box-shadow:0 4px 25px rgba(108,92,231,.5)} }
        .logo-text { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, var(--primary-light), var(--accent-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
        .logo-ver { font-size: 10px; color: var(--text-dim); }
        .new-chat-btn { margin: 16px 16px 12px; padding: 10px 16px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border: none; border-radius: 10px; color: #fff; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all .2s; }
        .new-chat-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px var(--glow); }
        .new-chat-btn svg { width: 16px; height: 16px; }
        .chat-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
        .chat-list::-webkit-scrollbar { width: 4px; }
        .chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .chat-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-dim); transition: all .15s; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; }
        .chat-item:hover { background: rgba(108,92,231,.1); color: var(--text-main); }
        .chat-item.active { background: rgba(108,92,231,.15); color: var(--text-bright); }
        .chat-item .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
        .chat-item.active .dot { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
        .chat-item:not(.active) .dot { background: var(--text-dim); opacity: .5; }
        .chat-item .ct { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-item .ca { display: none; gap: 2px; flex-shrink: 0; }
        .chat-item:hover .ca { display: flex; }
        .cab { width: 26px; height: 26px; border: none; border-radius: 6px; background: rgba(108,92,231,.15); color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
        .cab:hover { background: rgba(108,92,231,.3); color: var(--text-main); }
        .cab.dng:hover { background: rgba(255,71,87,.2); color: var(--accent-red); }
        .cab svg { width: 14px; height: 14px; }
        .rename-input { width: 100%; padding: 2px 6px; background: var(--bg-input); border: 1px solid var(--primary); border-radius: 4px; color: var(--text-main); font-family: inherit; font-size: 13px; outline: none; }
        .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); text-align: center; }

        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .main-header { padding: 14px 24px; border-bottom: 1px solid var(--border); backdrop-filter: blur(20px); background: rgba(15,15,26,.6); display: flex; align-items: center; justify-content: space-between; }
        .main-header h2 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px rgba(0,210,160,.6); animation: blink 2s ease-in-out infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
        .icon-btn:hover { background: rgba(108,92,231,.1); color: var(--text-main); }
        .icon-btn svg { width: 18px; height: 18px; }
        .think-toggle { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-family: inherit; font-size: 12px; cursor: pointer; transition: all .2s; }
        .think-toggle:hover { background: rgba(108,92,231,.1); }
        .think-toggle.active { background: rgba(108,92,231,.15); border-color: var(--primary); color: var(--primary-light); }
        .think-toggle .td { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); transition: all .2s; }
        .think-toggle.active .td { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }

        /* Messages */
        .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .welcome-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 40px; animation: fadeUp .6s ease; }
        .welcome-logo { width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary), var(--accent-green)); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px; color: #fff; box-shadow: 0 10px 40px var(--glow); animation: breathe 4s ease-in-out infinite; }
        .welcome-title { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, var(--text-bright), var(--primary-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .welcome-sub { color: var(--text-dim); font-size: 15px; max-width: 420px; text-align: center; line-height: 1.6; }
        .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; max-width: 520px; width: 100%; }
        .quick-btn { padding: 14px 16px; background: rgba(26,26,46,.6); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); font-family: inherit; font-size: 13px; cursor: pointer; text-align: left; transition: all .2s; line-height: 1.5; }
        .quick-btn:hover { background: rgba(108,92,231,.12); border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(108,92,231,.15); }
        .quick-btn .qi { font-size: 20px; margin-bottom: 6px; display: block; }
        .quick-btn .qt { font-weight: 600; font-size: 14px; display: block; margin-bottom: 2px; }
        .quick-btn .qd { color: var(--text-dim); font-size: 12px; }
        .msg { display: flex; gap: 12px; max-width: 85%; animation: msgIn .3s ease; }
        @keyframes msgIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
        .msg.ai .msg-avatar { background: linear-gradient(135deg, var(--primary), var(--accent-green)); color: #fff; box-shadow: 0 2px 10px var(--glow); }
        .msg.user .msg-avatar { background: linear-gradient(135deg, var(--accent-orange), #FF8C42); color: #fff; }
        .msg-body { min-width: 0; }
        .msg-content { padding: 14px 18px; border-radius: 16px; font-size: 14px; line-height: 1.7; }
        .msg.ai .msg-content { background: var(--bg-card); border: 1px solid var(--border); border-top-left-radius: 4px; }
        .msg.user .msg-content { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-top-right-radius: 4px; color: #fff; }
        .msg-time { font-size: 11px; color: var(--text-dim); margin-top: 4px; opacity: .6; }
        .msg.user .msg-time { text-align: right; }
        .msg-actions { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
        .msg-action { font-size: 11px; color: var(--text-dim); background: none; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 4px; transition: all .15s; }
        .msg-action:hover { color: var(--primary-light); background: rgba(108,92,231,.1); }
        .msg-action.speaking { color: var(--accent-green); }
        .thinking-block { margin-bottom: 10px; padding: 12px 16px; background: rgba(108,92,231,.08); border: 1px solid rgba(108,92,231,.12); border-radius: 12px; font-size: 13px; color: var(--text-dim); line-height: 1.6; }
        .thinking-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 12px; font-weight: 600; color: var(--primary-light); }
        .thinking-header svg { width: 14px; height: 14px; animation: spin 2s linear infinite; }
        .thinking-header.done svg { animation: none; }
        @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
        .thinking-block .step { margin-bottom: 4px; padding-left: 8px; border-left: 2px solid rgba(108,92,231,.2); }
        .typing-indicator { display: flex; gap: 5px; padding: 8px 4px; }
        .typing-indicator span { width: 8px; height: 8px; border-radius: 50%; background: var(--primary-light); animation: typing 1.4s ease-in-out infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: .2s; }
        .typing-indicator span:nth-child(3) { animation-delay: .4s; }
        @keyframes typing { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-8px);opacity:1} }

        /* Input */
        .input-area { padding: 16px 24px 24px; border-top: 1px solid var(--border); background: rgba(15,15,26,.6); backdrop-filter: blur(20px); }
        .input-box { display: flex; align-items: flex-end; gap: 8px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 16px; padding: 8px 12px; transition: border-color .2s, box-shadow .2s; }
        .input-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(108,92,231,.15); }
        .input-box textarea { flex: 1; background: none; border: none; outline: none; color: var(--text-main); font-family: inherit; font-size: 14px; line-height: 1.5; resize: none; max-height: 120px; padding: 6px 4px; }
        .input-box textarea::placeholder { color: var(--text-dim); }
        .input-btn { width: 38px; height: 38px; border-radius: 10px; border: none; background: transparent; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; flex-shrink: 0; }
        .input-btn:hover { background: rgba(108,92,231,.15); color: var(--text-main); }
        .input-btn.recording { background: rgba(255,71,87,.15); color: var(--accent-red); animation: pulse-rec 1s ease-in-out infinite; }
        @keyframes pulse-rec { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
        .input-btn svg { width: 18px; height: 18px; }
        .send-btn { width: 38px; height: 38px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; flex-shrink: 0; }
        .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 15px var(--glow); }
        .send-btn svg { width: 18px; height: 18px; }
        .input-hint { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 8px; opacity: .6; }
        .msg-content code { background: rgba(108,92,231,.15); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        .msg.user .msg-content code { background: rgba(255,255,255,.15); }
        .msg-content pre { background: rgba(0,0,0,.3); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.5; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 400px; max-width: 90vw; animation: fadeUp .3s ease; }
        .modal h3 { font-size: 18px; margin-bottom: 16px; }
        .modal label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
        .modal select { width: 100%; padding: 8px 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-family: inherit; margin-bottom: 14px; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
        .modal-actions button { padding: 8px 20px; border-radius: 8px; border: none; font-family: inherit; font-size: 14px; cursor: pointer; }
        .modal-actions .cbtn { background: transparent; border: 1px solid var(--border) !important; color: var(--text-dim); }
        .modal-actions .sbtn { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; }
        .user-menu { position: relative; }
        .user-avatar { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--accent-orange), #FF8C42); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; border: none; transition: all .15s; }
        .user-avatar:hover { transform: scale(1.05); }
        .user-dropdown { display: none; position: absolute; right: 0; top: 44px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 8px; min-width: 180px; box-shadow: 0 8px 30px rgba(0,0,0,.3); z-index: 50; }
        .user-dropdown.show { display: block; animation: fadeUp .2s ease; }
        .udi { padding: 8px 12px; border-radius: 8px; font-size: 13px; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all .15s; }
        .udi:hover { background: rgba(108,92,231,.1); color: var(--text-main); }
        .udi.dng:hover { background: rgba(255,71,87,.1); color: var(--accent-red); }
        .udi svg { width: 16px; height: 16px; }
        .uddiv { height: 1px; background: var(--border); margin: 4px 0; }
        .udphone { padding: 8px 12px; font-size: 12px; color: var(--text-dim); }

        @media (max-width: 768px) { .sidebar{display:none} .messages{padding:16px} .input-area{padding:12px 16px 16px} .quick-actions{grid-template-columns:1fr} .login-card{padding:32px 24px} }
    </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
    <div class="login-bg"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
    <div class="login-card">
        <div class="login-logo">XM</div>
        <h1>xmAI</h1>
        <p class="sub">登录你的AI智能助手</p>
        <div class="step-indicator"><div class="step-dot active" id="sd1"></div><div class="step-dot" id="sd2"></div><div class="step-dot" id="sd3"></div></div>
        <div class="login-step active" id="step1">
            <div class="form-group"><label>手机号</label><input type="tel" class="form-input" id="phoneInput" placeholder="请输入11位手机号" maxlength="11"><div class="error-msg" id="phoneErr">请输入有效的11位手机号</div></div>
            <button class="login-btn" onclick="goStep2()">获取验证码</button>
        </div>
        <div class="login-step" id="step2">

'地球有多大':()=>'地球的赤道半径约为6,378公里，极半径约为6,357公里，所以地球不是完美的球体，而是赤道略鼓的椭球体。\n\n地球表面积约为5.1亿平方公里，其中海洋占71%，陆地占29%。',
'地球多少岁':()=>'地球大约有45.4亿岁（4.54 × 10⁹年）。科学家通过测定地球上最古老的岩石和陨石中的放射性同位素得出这个年龄。\n\n相比之下，人类文明只有大约5000年的历史，而生命在地球上已经存在了约35亿年。',
'光速是多少':()=>'光在真空中的速度约为每秒299,792,458米，约等于30万公里/秒。光从太阳到地球大约需要8分20秒。\n\n根据爱因斯坦的相对论，没有任何物质或信息的速度能超过光速。',
'中国有多少人口':()=>'截至2023年，中国总人口约为14.1亿。中国是世界上人口最多的国家之一，仅次于印度。\n\n中国有56个民族，其中汉族人口约占91.5%。',
'世界最高峰':()=>'世界最高峰是珠穆朗玛峰，海拔8848.86米（2020年中尼两国共同宣布的最新测量值），位于中国与尼泊尔的边境线上。\n\n珠峰属于喜马拉雅山脉，每年还在以约4毫米的速度缓慢增高。',
'中国的首都':()=>'中国的首都是北京。北京位于华北平原北部，是中国政治、文化和国际交往的中心。\n\n北京有着3000多年的建城史和800多年的建都史，拥有故宫、长城、天坛等众多世界文化遗产。',
'一年多少天':()=>'平年有365天，闰年有366天（多出2月29日）。闰年的判断规则是：\n\n1. 能被4整除但不能被100整除的是闰年\n2. 能被400整除的也是闰年\n3. 其余为平年\n\n比如2024年是闰年，1900年不是闰年，2000年是闰年。',
'水的沸点':()=>'在标准大气压（101.325千帕）下，水的沸点是100°C，冰点是0°C。\n\n有趣的是，海拔越高，大气压越低，水的沸点也越低。在珠穆朗玛峰顶，水大约在71°C就会沸腾。这就是为什么高原地区煮饭需要用高压锅。',
'月亮为什么有阴晴圆缺':()=>'月亮的阴晴圆缺（月相变化）是因为月球绕地球公转，太阳照射月球的角度不断变化。\n\n- 新月：月球在太阳和地球之间，背对太阳的一面朝向我们\n- 上弦月：月球公转到约90度位置，右半边被照亮\n- 满月：地球在太阳和月球之间，月球完全被照亮\n- 下弦月：左半边被照亮\n\n一个完整的月相周期约29.5天。',
// --- 科技 ---
'什么是人工智能':()=>'人工智能（AI）是计算机科学的一个分支，目标是让机器模拟人类的智能行为，包括学习、推理、感知、理解和决策。\n\nAI的主要分支：\n\n1. 机器学习——让计算机从数据中自动学习规律\n2. 深度学习——使用多层神经网络处理复杂模式\n3. 自然语言处理——让机器理解和生成人类语言\n4. 计算机视觉——让机器"看懂"图像和视频\n\n现在最火的AI应用包括ChatGPT等大语言模型，它们通过海量文本训练，可以对话、写作、编程等。',
'什么是区块链':()=>'区块链是一种分布式账本技术，核心特点是：\n\n1. 去中心化——没有单一控制方，数据分布在多个节点上\n2. 不可篡改——一旦记录就很难被修改\n3. 透明可追溯——所有交易记录公开可见\n\n最著名的应用是比特币和以太坊。区块链还可以用于供应链管理、数字身份认证、智能合约等领域。',
'什么是5g':()=>'5G是第五代移动通信技术，相比4G有三大核心提升：\n\n1. 速度更快——下载速度可达10Gbps（比4G快100倍）\n2. 延迟更低——响应时间缩短到1毫秒级别\n3. 连接更多——每平方公里可连接100万个设备\n\n5G的应用场景包括：自动驾驶、远程医疗、智慧城市、工业4.0、VR/AR等。',
'什么是量子计算':()=>'量子计算利用量子力学的原理来处理信息，和传统计算机有本质区别：\n\n1. 传统计算机用比特（0或1），量子计算机用量子比特（可以同时是0和1，这叫叠加态）\n2. 量子纠缠让两个量子比特瞬间关联，理论上可以实现超高速计算\n3. 对某些特定问题（如密码破解、药物模拟），量子计算机比超级计算机快数百万倍\n\n目前Google、IBM、中国的"九章"和"祖冲之号"都在研发量子计算机。',
'什么是元宇宙':()=>'元宇宙是一个虚拟的数字世界概念，人们可以通过VR/AR设备在其中社交、工作、娱乐和交易。\n\n它的核心特征：\n1. 沉浸式体验——用VR设备进入虚拟世界\n2. 数字身份——在虚拟世界中有自己的形象\n3. 数字经济——可以买卖虚拟物品和NFT\n4. 持续存在——世界不会因为人下线而停止运行\n\nMeta（Facebook改名）、Roblox、Microsoft都在布局元宇宙。',
'chatgpt是什么':()=>'ChatGPT是由OpenAI公司开发的AI对话系统，基于GPT（生成式预训练变换器）大语言模型。\n\n它的核心能力：\n1. 自然对话——能理解上下文进行多轮对话\n2. 文本生成——写文章、邮件、代码、诗歌等\n3. 知识问答——涵盖科学、历史、文化等领域\n4. 代码编写——支持多种编程语言\n5. 语言翻译——支持多语种互译\n\nGPT模型通过互联网海量文本进行训练，预测下一个最可能出现的词语来生成回答。',
// --- 历史 ---
'秦始皇是谁':()=>'秦始皇（公元前259年—前210年），姓嬴名政，是中国历史上第一个统一全国的皇帝。\n\n他的主要成就：\n1. 统一六国——灭了韩、赵、魏、楚、燕、齐，建立秦朝\n2. 统一度量衡和文字——"书同文，车同轨"\n3. 修筑万里长城——抵御北方匈奴入侵\n4. 修建兵马俑——为他的陵墓陪葬\n5. 建立郡县制——开创中央集权制度\n\n他被称为"千古一帝"，但也因为焚书坑儒、严酷统治而饱受争议。',
'唐朝有多强大':()=>'唐朝（618年—907年）是中国历史上最辉煌的朝代之一，被誉为中国封建社会的巅峰。\n\n唐朝的辉煌：\n1. 经济繁荣——长安（今西安）是当时世界最大的城市，人口超过100万\n2. 文化鼎盛——李白、杜甫、白居易等大诗人；吴道子的绘画；颜真卿的书法\n3. 科技发达——发明雕版印刷术\n4. 对外开放——丝绸之路繁荣，长安聚集了各国商人和学者\n5. 疆域辽阔——鼎盛时期国土面积超过1200万平方公里\n6. 影响深远——日本、朝鲜等国的文化深受唐朝影响',
'三国是什么':()=>'三国时期（220年—280年）是中国历史上东汉末年到西晋统一之间的分裂时期，主要势力为：\n\n1. 曹魏——曹操、曹丕建立，占据北方中原\n2. 蜀汉——刘备建立，占据四川一带，以诸葛亮辅佐闻名\n3. 东吴——孙权建立，占据江南地区\n\n著名故事包括：桃园三结义、三顾茅庐、赤壁之战、空城计等。这些故事被罗贯中写成小说《三国演义》，成为中国文学经典。',
'长城有多长':()=>'中国长城的总长度超过21,196公里，包括明代长城和更早的各朝代长城。\n\n关于长城的关键信息：\n1. 明长城是最著名的部分，全长约8,851公里\n2. 长城最早始建于春秋战国时期（公元前7世纪）\n3. 秦始皇统一后大规模修建和连接长城\n4. 长城的主要功能是防御北方游牧民族入侵\n5. 长城是世界文化遗产，也是世界新七大奇迹之一',
'中国有多少朝代':()=>'中国历史上的主要朝代按时间顺序为：\n\n夏、商、周（西周、东周/春秋战国）、秦、汉（西汉、东汉）、三国（魏蜀吴）、晋（西晋、东晋）、南北朝、隋、唐、五代十国、宋（北宋、南宋）、元、明、清。\n\n其中汉朝和唐朝被认为是最强盛的朝代。中华文明延续至今已有5000多年，是世界上唯一没有中断的古老文明。',
// --- 文化 ---
'四大发明是什么':()=>'中国的四大发明是：\n\n1. 造纸术——东汉蔡伦改进造纸技术（约105年），使纸张普及，取代竹简和丝帛\n2. 印刷术——隋唐发明雕版印刷，北宋毕昇发明活字印刷术\n3. 指南针——战国时期发明"司南"，宋代发展为航海罗盘\n4. 火药——唐代炼丹术偶然发现，宋代用于军事\n\n四大发明对世界文明发展产生了深远影响，尤其是传到欧洲后推动了文艺复兴和地理大发现。',
'李白的诗':()=>'李白（701年—762年），号"青莲居士"，被称为"诗仙"。他性格豪放，诗风飘逸洒脱，是中国最伟大的浪漫主义诗人之一。\n\n经典作品：\n\n"床前明月光，疑是地上霜。举头望明月，低头思故乡。" ——《静夜思》\n\n"君不见，黄河之水天上来，奔流到海不复回。君不见，高堂明镜悲白发，朝如青丝暮成雪。" ——《将进酒》\n\n"两岸猿声啼不住，轻舟已过万重山。" ——《早发白帝城》\n\n李白一生写了上千首诗，现存约900多首。',
'红楼梦讲什么':()=>'《红楼梦》是中国四大名著之一，由清代作家曹雪芹所著。\n\n故事概要：\n以贾宝玉、林黛玉、薛宝钗的爱情悲剧为主线，描写了贾、史、王、薛四大家族的兴衰历程。\n\n核心主题：\n1. 爱情悲剧——宝玉与黛玉真心相爱，却被迫娶了宝钗\n2. 家族衰落——贾府从鼎盛走向衰败\n3. 社会批判——揭示了封建社会的虚伪和残酷\n4. 人生感悟——"好了歌"体现了对功名利禄的看透\n\n《红楼梦》被认为是中国古典小说的巅峰之作，至今有专门的"红学"研究。',
'四大名著':()=>'中国古典四大名著是：\n\n1. 《三国演义》——罗贯中著，描写东汉末年到三国时期的历史故事\n2. 《水浒传》——施耐庵著，讲述108位好汉聚义梁山的故事\n3. 《西游记》——吴承恩著，唐僧师徒四人西天取经的奇幻冒险\n4. 《红楼梦》——曹雪芹著，贾府兴衰和宝黛爱情悲剧\n\n四部作品各有特色：《三国演义》讲权谋，《水浒传》讲义气，《西游记》讲奇幻，《红楼梦》讲人生。',
// --- 健康 ---
'感冒了怎么办':()=>'感冒的常见应对方法：\n\n1. 充分休息——保证8小时以上睡眠，不要勉强工作\n2. 多喝温水——每天至少8杯，帮助身体排毒\n3. 注意保暖——避免受凉加重症状\n4. 营养均衡——多吃蔬菜水果，补充维生素C\n5. 适当用药——可服用布洛芬或对乙酰氨基酚缓解症状\n\n如果出现以下情况请及时就医：\n- 高烧超过39°C持续不退\n- 呼吸困难或胸痛\n- 症状超过10天没有好转\n- 有浓黄鼻涕伴随面部疼痛\n\n注意：感冒是病毒感染，抗生素对病毒无效，不要滥用抗生素。',
'怎么减肥':()=>'科学减肥的核心原则是：热量摄入 < 热量消耗，建议每周减重0.5-1公斤。\n\n饮食方面：\n1. 减少精制碳水（白米白面）的摄入\n2. 增加优质蛋白质（鸡胸肉、鱼、鸡蛋、豆腐）\n3. 多吃蔬菜和水果\n4. 少油少盐少糖，避免油炸和甜品\n5. 控制总热量，每餐七分饱\n\n运动方面：\n1. 有氧运动：跑步、游泳、骑车，每周3-5次，每次30分钟以上\n2. 力量训练：增加肌肉量，提高基础代谢\n3. 日常活动：多走路、少坐电梯、多做家务\n\n重要提醒：不要节食减肥！长期节食会降低基础代谢，越减越难。健康减肥需要持之以恒。',
'怎样提高免疫力':()=>'提高免疫力的方法：\n\n1. 充足睡眠——每天7-9小时，睡眠不足会显著降低免疫力\n2. 均衡饮食——多摄入维生素C（柑橘类）、维生素D、锌、蛋白质\n3. 规律运动——每周150分钟中等强度运动，但不要过度训练\n4. 管理压力——长期焦虑和压力会削弱免疫系统\n5. 戒烟限酒——吸烟和过量饮酒都会损害免疫力\n6. 保持社交——研究表明，良好的社交关系对免疫系统有益\n7. 多晒太阳——适量紫外线有助于合成维生素D\n\n需要警惕的是：如果经常感冒、反复感染、伤口愈合慢，建议去医院做免疫相关检查。',
// --- 生活 ---
'番茄炒蛋怎么做':()=>'番茄炒蛋是最经典的家常菜，做法简单：\n\n材料：番茄2个、鸡蛋3个、盐适量、糖少许、食用油\n\n步骤：\n1. 番茄切块，鸡蛋打散加少许盐搅匀\n2. 锅中倒油，油热后倒入蛋液，翻炒至金黄盛出\n3. 锅中再加少许油，放入番茄块翻炒出汁\n4. 加入少许糖提鲜（关键步骤！）\n5. 倒入炒好的鸡蛋，翻炒均匀\n6. 加盐调味，出锅\n\n小技巧：番茄底部划十字用开水烫一下可以轻松去皮，口感更好。',
'怎样学好英语':()=>'学好英语的方法：\n\n1. 词汇积累——每天背20-30个单词，用"艾宾浩斯遗忘曲线"复习\n2. 语法基础——掌握基本时态和句型结构\n3. 大量阅读——从简单英文文章开始，逐渐过渡到原著\n4. 看英文视频——YouTube、美剧、纪录片，不看字幕\n5. 每天写作——用英文写日记，哪怕只写3-5句\n6. 找语伴练习——用英语对话，克服说英语的恐惧\n7. 创造英语环境——手机系统设为英文，听英文播客\n\n关键是：坚持！每天30分钟比一周一次学3小时效果好得多。',
'怎么做饭好吃':()=>'做饭好吃的核心秘诀：\n\n1. 火候控制——大火爆炒锁住水分，小火慢炖入味\n2. 调味层次——盐是基础，糖提鲜，醋解腻，酱油上色\n3. 食材新鲜——好食材是好菜的基础\n4. 刀工均匀——食材切得大小一致，受热均匀\n5. 适时调味——出锅前调味比一开始放更好控制\n6. 不要怕失败——多做多练，厨艺自然提升\n\n新手推荐从这几道菜开始：番茄炒蛋、可乐鸡翅、蒜蓉西兰花、蛋炒饭。',
// --- 数学 ---
'圆周率是多少':()=>'圆周率π（pi）是一个数学常数，表示圆的周长与直径的比值。\n\nπ ≈ 3.14159265358979323846...\n\n它是一个无理数，小数部分永远不会重复，也不会终止。目前人类已经计算出π的小数点后超过100万亿位。\n\n常用近似值：3.14（精确到两位小数）或22/7（分数近似）\n\n常用公式：圆的面积 = π × r²，圆的周长 = 2 × π × r',
'勾股定理':()=>'勾股定理（在西方叫毕达哥拉斯定理）：\n\n在直角三角形中，两条直角边的平方和等于斜边的平方。\n\n公式：a² + b² = c²\n\n其中 a、b 是两条直角边，c 是斜边（最长边）。\n\n例如：一个直角三角形两条直角边分别是3和4，那么斜边 = √(9+16) = √25 = 5。\n\n这就是经典的"勾三股四弦五"。',
// --- 编程 ---
'python是什么':()=>'Python是一种简洁、易学的高级编程语言，由Guido van Rossum于1991年发布。\n\nPython的特点：\n1. 语法简洁——接近自然语言，新手友好\n2. 应用广泛——Web开发、数据分析、AI、自动化等\n3. 丰富的库——NumPy、Pandas、TensorFlow、Django等\n4. 社区活跃——全球最大的编程社区之一\n\n快速示例：\n<pre><code># 列表推导式\nsquares = [x**2 for x in range(10)]\nprint(squares)\n# [0, 1, 4, 9, 16, 25, 36, 49, 64, 81]</code></pre>',
'什么是html':()=>'HTML（超文本标记语言）是构建网页的基础语言。它用"标签"来定义页面结构和内容。\n\n基本结构：\n<pre><code>&lt;!DOCTYPE html&gt;\n&lt;html&gt;\n  &lt;head&gt;\n    &lt;title&gt;我的网页&lt;/title&gt;\n  &lt;/head&gt;\n  &lt;body&gt;\n    &lt;h1&gt;标题&lt;/h1&gt;\n    &lt;p&gt;这是一个段落&lt;/p&gt;\n    &lt;img src="photo.jpg" alt="图片"&gt;\n    &lt;a href="https://example.com"&gt;链接&lt;/a&gt;\n  &lt;/body&gt;\n&lt;/html&gt;</code></pre>\n\nHTML配合CSS控制样式，配合JavaScript实现交互功能，三者合称Web前端三大核心技术。',
'什么是javascript':()=>'JavaScript是一种动态编程语言，主要用于网页交互效果，是Web前端三大核心技术之一。\n\nJavaScript能做什么：\n1. 页面交互——按钮点击、表单验证、动画效果\n2. 数据处理——API请求、JSON解析、DOM操作\n3. 后端开发——Node.js让JS也能写服务器\n4. 移动开发——React Native、小程序都用JS\n\n快速示例：\n<pre><code>// 箭头函数和解构\nconst greet = ({name, age}) => {\n  return `${name}今年${age}岁！`;\n};\nconsole.log(greet({name: "小明", age: 20}));\n// "小明今年20岁！"</code></pre>',
// --- 哲学/人文 ---
'人为什么活着':()=>'这是一个经典的哲学问题，不同学派有不同的回答：\n\n1. 儒家——修身齐家治国平天下，通过实现社会价值获得意义\n2. 道家——顺应自然，追求内心的平静和自由\n3. 存在主义——萨特说"存在先于本质"，人生没有预设意义，意义需要自己去创造\n4. 佛教——通过修行消除苦痛，达到涅槃境界\n5. 科学视角——从生物进化角度，生存和繁衍是生命的本能驱动\n\n我的看法：人生的意义不是"找"到的，而是"创造"出来的。找到你热爱的事，去做对他人有意义的事，就是生命的意义。',
'什么是快乐':()=>'关于快乐，不同学科有不同的解释：\n\n1. 生物学——快乐来自大脑分泌的多巴胺、内啡肽、血清素等神经递质\n2. 心理学——哈佛研究表明：良好的人际关系是快乐最重要的因素\n3. 哲学——亚里士多德认为快乐是"有意义的活动"，伊壁鸠鲁认为简单生活就是快乐\n4. 经济学——有研究表明，收入到一定程度后，更多金钱不会带来更多快乐\n\n科学总结的快乐方法：\n- 感恩练习——每天写下3件感恩的事\n- 运动锻炼——自然提升情绪\n- 社交联系——和朋友家人保持联系\n- 学会放下——不要纠结过去\n- 帮助他人——利他行为会带来满足感',
// --- 地理 ---
'世界最大的国家':()=>'世界上面积最大的国家是俄罗斯，国土面积约1,710万平方公里，横跨欧亚两大洲，约占地球陆地面积的11%。\n\n面积排名前五：\n1. 俄罗斯 — 1,710万km²\n2. 加拿大 — 998万km²\n3. 中国 — 960万km²\n4. 美国 — 937万km²\n5. 巴西 — 851万km²',
'世界上最长的河':()=>'世界上最长的河流是尼罗河，全长约6,650公里，流经非洲东部11个国家。\n\n不过这个记录有争议：有些科学家认为亚马逊河更长（约6,992公里），但目前主流仍认尼罗河最长。\n\n其他著名长河：\n- 亚马逊河 — 约6,400公里（世界上流量最大的河）\n- 长江 — 约6,300公里（亚洲最长，中国最长）\n- 密西西比河 — 约6,275公里（北美最长）',
'中国有多少省份':()=>'中国共有34个省级行政区：\n\n23个省：河北、山西、辽宁、吉林、黑龙江、江苏、浙江、安徽、福建、江西、山东、河南、湖北、湖南、广东、海南、四川、贵州、云南、陕西、甘肃、青海、台湾\n\n5个自治区：内蒙古、广西、西藏、宁夏、新疆\n\n4个直辖市：北京、上海、天津、重庆\n\n2个特别行政区：香港、澳门',
// --- 天文宇宙 ---
'黑洞是什么':()=>'黑洞是一种引力极强的天体，连光都无法逃脱它的引力场。\n\n黑洞的形成方式：\n1. 恒星死亡——大质量恒星（太阳质量的25倍以上）耗尽燃料后核心坍缩形成"恒星级黑洞"\n2. 星系中心——几乎所有星系中心都有"超大质量黑洞"，银河系中心的黑洞质量是太阳的400万倍\n3. 宇宙早期——由原初气体直接坍缩形成\n\n2019年人类首次拍摄到黑洞照片，位于M87星系中心，质量是太阳的65亿倍。',
'太阳是什么':()=>'太阳是一颗恒星（G型主序星），位于太阳系中心，距地球约1.5亿公里。\n\n太阳的关键数据：\n- 表面温度约5,500°C，核心温度约1,500万°C\n- 直径约139万公里，是地球直径的109倍\n- 质量占太阳系总质量的99.86%\n- 年龄约46亿年，预计还能燃烧约50亿年\n- 主要成分：73%氢、25%氦\n\n太阳通过核聚变反应（氢聚变为氦）释放能量，每秒将约400万吨物质转化为能量。',
'宇宙有多大':()=>'可观测宇宙的直径约为930亿光年（约8.8 × 10²⁶米）。\n\n宇宙的关键数据：\n- 宇宙年龄约138亿年\n- 可观测宇宙中有约2万亿个星系\n- 每个星系平均有1000亿颗恒星\n- 可观测宇宙中约有10²⁴颗恒星\n\n注意：这只是"可观测"宇宙，整个宇宙可能无限大，也可能有多个宇宙（多元宇宙理论）。',
'为什么天空是蓝色':()=>'天空是蓝色的是因为"瑞利散射"。\n\n太阳光包含所有颜色（红橙黄绿蓝靛紫），但大气中的氮气和氧气分子对不同颜色的光散射程度不同——蓝色光波长短，容易被散射。\n\n白天阳光穿过大气层时，蓝光被大量散射到各个方向，所以我们看到天空是蓝色的。\n\n日落时天空变红，是因为阳光穿过更厚的大气层，蓝光被散射殆尽，只剩下穿透力强的红光和橙光。',
// --- 生物 ---
'dna是什么':()=>'DNA（脱氧核糖核酸）是储存生命遗传信息的分子，存在于所有已知生物的细胞中。\n\nDNA的关键特点：\n1. 双螺旋结构——由沃森和克里克于1953年发现\n2. 四种碱基——A（腺嘌呤）、T（胸腺嘧啶）、G（鸟嘌呤）、C（胞嘧啶）\n3. 碱基互补配对——A-T，G-C\n4. 人体DNA展开长约2米，但只有2纳米宽\n5. 人类基因组约有30亿个碱基对，99.9%的DNA序列在所有人之间都是相同的\n\nDNA决定了你的身高、肤色、血型等特征，也影响疾病风险。',
'人是怎么来的':()=>'人类的进化历程大致如下：\n\n1. 约600万年前——人科动物与黑猩猩的祖先分化\n2. 约400万年前——南方古猿（最早的双足行走的类人猿）\n3. 约250万年前——能人（"巧人"，能制造简单石器）\n4. 约180万年前——直立人（开始使用火）\n5. 约30万年前——智人（现代人类）在非洲出现\n6. 约7万年前——智人走出非洲，扩散到全球\n7. 约1万年前——农业革命，人类开始定居生活\n8. 约5000年前——文字出现，人类文明开始\n\n所以人类从灵长类动物经过数百万年的进化而来，并非突然出现。',
'新冠病毒':()=>'新冠病毒（SARS-CoV-2）是引起COVID-19的病毒，于2019年底在中国武汉首次被发现。\n\n关键信息：\n1. 传播途径——主要通过飞沫和气溶胶传播\n2. 潜伏期——通常2-14天\n3. 症状——发热、咳嗽、乏力、嗅觉丧失，部分无症状\n4. 变异株——Alpha、Delta、Omicron等，Omicron传播力最强但重症率较低\n5. 疫苗——mRNA疫苗和灭活疫苗可有效预防重症和死亡\n\n截至2023年，全球累计感染超过7亿人次，死亡超过690万人。',
// --- 化学 ---
'元素周期表':()=>'元素周期表是化学元素按照原子序数排列的表格，由门捷列夫于1869年创建。\n\n前20个元素：\n1.氢H 2.氦He 3.锂Li 4.铍Be 5.硼B 6.碳C 7.氮N 8.氧O 9.氟F 10.氖Ne\n11.钠Na 12.镁Mg 13.铝Al 14.硅Si 15.磷P 16.硫S 17.氯Cl 18.氩Ar 19.钾K 20.钙Ca\n\n人体主要组成元素：氧（65%）、碳（18.5%）、氢（9.5%）、氮（3.2%）\n\n目前共确认118种元素，其中94种在自然界中存在，24种为人工合成。',
'水的化学式':()=>'水的化学式是H₂O，由两个氢原子和一个氧原子组成。\n\n水的独特性质：\n1. 密度异常——4°C时密度最大，冰的密度比水小（所以冰浮在水面上）\n2. 高比热容——能吸收大量热量而温度变化不大，调节地球气候\n3. 极性分子——能溶解多种物质，被称为"万能溶剂"\n4. 表面张力——能让昆虫在水面上行走\n5. 地球上97%的水是咸水，只有3%是淡水，其中能直接饮用的不到1%',
// --- 物理 ---
'为什么苹果会落地':()=>'苹果落地是因为万有引力。牛顿在1687年发表的万有引力定律指出：\n\n任何两个有质量的物体之间都存在引力，引力的大小与两个物体质量的乘积成正比，与它们距离的平方成反比。\n\n公式：F = G × (m₁ × m₂) / r²\n\n其中G是引力常数（6.674 × 10⁻¹¹ N·m²/kg²）。\n\n地球质量巨大（约5.97 × 10²⁴ kg），所以对地表物体的引力足够把苹果拉向地面。你在苹果树上感受到的"重量"就是地球引力。',
'为什么彩虹有七种颜色':()=>'彩虹的七种颜色（红橙黄绿蓝靛紫）是太阳光被雨滴分解的结果。\n\n形成原理：\n1. 阳光进入雨滴时发生折射（光线弯曲）\n2. 不同颜色的光折射角度不同——红光折射角最小，紫光最大\n3. 光在雨滴内壁反射\n4. 光从雨滴出来时再次折射，各种颜色被分开\n5. 红光在上（折射角小），紫光在下（折射角大）\n\n这就是牛顿用三棱镜实验演示的"色散"现象。',
'声音是怎么传播的':()=>'声音通过介质的振动传播，需要介质（固体、液体或气体）。\n\n声音的传播特点：\n1. 在空气中速度约340米/秒，在水中约1,500米/秒，在钢铁中约5,000米/秒\n2. 真空中不能传播声音（太空是寂静的）\n3. 声音的音调由频率决定——频率越高音调越高\n4. 声音的音量由振幅决定——振幅越大声音越响\n5. 人耳能听到的频率范围是20Hz到20,000Hz\n\n超音速飞机突破音障时产生的"音爆"就是声音追赶不上飞机速度造成的。',
// --- 历史人物 ---
'孔子是谁':()=>'孔子（公元前551年—前479年），名丘，字仲尼，是中国最伟大的思想家、教育家之一，儒家学派的创始人。\n\n孔子的主要贡献：\n1. 创立儒家思想——核心是"仁"（仁爱）和"礼"（礼仪）\n2. 开办私学——打破了贵族对教育的垄断，提倡"有教无类"\n3. 弟子三千——培养了72位贤能弟子\n4. 编订六经——《诗》《书》《礼》《乐》《易》《春秋》\n5. 《论语》——由弟子记录孔子言行，是儒家经典\n\n孔子被后世尊为"至圣先师"，其思想深刻影响了中国和东亚文明两千多年。',
'爱因斯坦是谁':()=>'阿尔伯特·爱因斯坦（1879年—1955年），出生于德国的犹太裔物理学家，被公认为20世纪最伟大的科学家。\n\n主要成就：\n1. 狭义相对论（1905年）——提出E=mc²，揭示了质能等价关系\n2. 广义相对论（1915年）——将引力解释为时空弯曲\n3. 光电效应——用量子理论解释光电效应，获1921年诺贝尔物理学奖\n4. 布朗运动——为原子存在提供了证据\n5. 质能方程E=mc²——一小块物质蕴含巨大能量，这是核能的理论基础\n\n有趣的是，爱因斯坦中学时成绩并不突出，但他对物理有非凡的直觉和想象力。',
'李白是谁':()=>'李白（701年—762年），字太白，号青莲居士，被后人称为"诗仙"，是中国最伟大的浪漫主义诗人。\n\n李白的一生：\n1. 出生于碎叶城（今吉尔吉斯斯坦境内），5岁随父迁居四川\n2. 24岁离开四川，开始漫游天下\n3. 42岁经人推荐入长安，供奉翰林，成为唐玄宗的文学侍从\n4. 因性格狂放不羁，被"赐金放还"离开长安\n5. 安史之乱中曾入永王幕府，后被流放夜郎\n6. 62岁病逝于安徽当涂\n\n代表作：《将进酒》《静夜思》《蜀道难》《望庐山瀑布》《早发白帝城》等',
'牛顿是谁':()=>'艾萨克·牛顿（1643年—1727年），英国物理学家、数学家，被誉为"近代科学之父"。\n\n主要成就：\n1. 万有引力定律——解释了苹果落地和行星运动\n2. 三大运动定律——奠定了经典力学的基础\n3. 发明微积分——与莱布尼茨各自独立发明\n4. 光学研究——发现白光由七色光组成\n5. 著作《自然哲学的数学原理》——科学史上最重要的著作之一\n\n牛顿的名言："如果我能看得更远，那是因为我站在巨人的肩膀上。"',
// --- 艺术 ---
'蒙娜丽莎':()=>'《蒙娜丽莎》是意大利文艺复兴时期画家列奥纳多·达·芬奇的代表作，创作于1503-1519年。\n\n关键信息：\n1. 现藏于法国巴黎卢浮宫\n2. 画中女子被认为是佛罗伦萨商人的妻子丽莎·格拉迪尼\n3. 画幅仅77×53厘米，是一幅油画\n4. 最著名的特点是蒙娜丽莎神秘的微笑——从不同角度看，微笑似乎会变化\n5. 1911年曾被盗走，两年后被追回，反而使它更加出名\n6. 目前估值超过10亿美元，是世界上最有名的画作',
'梵高是谁':()=>'文森特·梵高（1853年—1890年），荷兰后印象派画家，是西方艺术史上最具影响力的画家之一。\n\n梵高的故事：\n1. 一生只卖出过一幅画，生前穷困潦倒\n2. 在精神疾病和孤独中创作了大量杰作\n3. 37岁时开枪自杀（也有意外说）\n4. 死后作品才被世人认可\n5. 《向日葵》系列、《星月夜》、《自画像》等成为世界艺术瑰宝\n6. 他的画作在拍卖会上屡创天价\n\n梵高一生创作了约2100件作品，包括860幅油画，其中大部分创作于他生命的最后两年。',
// --- 科技人物 ---
'马斯克是谁':()=>'埃隆·马斯克（Elon Musk，1971年出生），出生于南非的企业家、工程师，被认为是当今最具影响力的科技企业家之一。\n\n他的公司：\n1. Tesla（特斯拉）——电动汽车和清洁能源\n2. SpaceX——太空探索，目标是让人类成为多星球物种\n3. X（原Twitter）——社交媒体平台\n4. Neuralink——脑机接口技术\n5. The Boring Company——隧道挖掘\n6. xAI——人工智能公司\n\n notable成就：\n- SpaceX实现了火箭回收复用，大幅降低太空发射成本\n- 特斯拉推动了全球电动汽车革命\n- SpaceX的Starship是人类历史上最大的火箭',
'乔布斯是谁':()=>'史蒂夫·乔布斯（1955年—2011年），美国企业家、发明家，苹果公司联合创始人，被认为是科技史上最具远见卓识的人物之一。\n\n主要成就：\n1. 1976年与沃兹尼亚克在车库里创办苹果公司\n2. 推出Apple II个人电脑——开启了个人电脑时代\n3. 1984年推出Macintosh——第一台成功的图形界面个人电脑\n4. 1997年回归苹果，推出iMac\n5. 2001年推出iPod——改变了音乐产业\n6. 2007年推出iPhone——重新定义了手机\n7. 2010年推出iPad——开创了平板电脑市场\n\n乔布斯的理念是"站在科技与人文的十字路口"，追求极致简约和完美。',
'比尔盖茨是谁':()=>'比尔·盖茨（Bill Gates，1955年出生），美国企业家、慈善家，微软公司联合创始人。\n\n主要成就：\n1. 1975年与保罗·艾伦创办微软\n2. 开发了Windows操作系统——全球使用最广泛的电脑操作系统\n3. 连续13年蝉联世界首富（1995-2007）\n4. 2008年退出微软日常管理，专注慈善事业\n5. 与前妻梅琳达共同运营"比尔及梅琳达·盖茨基金会"\n6. 基金会在全球公共卫生、教育和扶贫方面投入数百亿美元\n\n盖茨13岁时就开始编程，哈佛大学辍学创业，是"大学辍学成功"的经典案例。',
// --- 编程进阶 ---
'什么是java':()=>'Java是一种面向对象的编程语言，由Sun公司的詹姆斯·高斯林于1995年发布，现属于Oracle公司。\n\nJava的特点：\n1. "一次编写，到处运行"——Java代码编译成字节码，在JVM（Java虚拟机）上运行\n2. 面向对象——封装、继承、多态\n3. 自动内存管理——垃圾回收机制\n4. 多线程支持\n5. 庞大的生态系统——Spring、Android、Hadoop等\n\n快速示例：\n<pre><code>public class Hello {\n    public static void main(String[] args) {\n        String name = "xmAI";\n        System.out.println("你好，" + name + "！");\n    }\n}</code></pre>',
'什么是c++':()=>'C++是一种高性能的编程语言，由本贾尼·斯特劳斯特卢普于1979年在贝尔实验室开发，是C语言的扩展。\n\nC++的特点：\n1. 高性能——接近硬件级别的运行速度\n2. 面向对象——支持类、继承、多态\n3. 底层控制——可以直接操作内存\n4. 广泛应用——游戏引擎、操作系统、数据库、嵌入式系统\n5. 标准模板库（STL）——提供丰富的数据结构和算法\n\n著名应用：大多数3A游戏引擎（Unreal Engine）、Windows操作系统、Google Chrome浏览器核心部分。',
'什么是css':()=>'CSS（层叠样式表）是用于描述HTML文档外观的样式语言。\n\nCSS的能力：\n1. 布局——Flexbox、Grid、定位\n2. 美化——颜色、字体、阴影、圆角、渐变\n3. 动画——过渡、关键帧动画、变换\n4. 响应式——媒体查询，适配不同设备\n\n快速示例：\n<pre><code>.card {\n    background: linear-gradient(135deg, #6C5CE7, #00D2A0);\n    border-radius: 16px;\n    padding: 20px;\n    color: white;\n    transition: transform 0.3s;\n    box-shadow: 0 4px 20px rgba(0,0,0,0.2);\n}\n.card:hover { transform: translateY(-4px); }</code></pre>',
'什么是react':()=>'React是由Meta（Facebook）开发的前端JavaScript库，用于构建用户界面，于2013年开源。\n\nReact的特点：\n1. 组件化——将UI拆分为独立的、可复用的组件\n2. 虚拟DOM——高效的DOM更新机制\n3. 单向数据流——数据从父组件流向子组件\n4. JSX语法——在JavaScript中写类HTML的语法\n5. Hooks——函数组件中使用状态和生命周期\n\n快速示例：\n<pre><code>function App() {\n    const [count, setCount] = useState(0);\n    return (\n        &lt;div&gt;\n            &lt;p&gt;点击了 {count} 次&lt;/p&gt;\n            &lt;button onClick={() => setCount(count + 1)}&gt;\n                点击+1\n            &lt;/button&gt;\n        &lt;/div&gt;\n    );\n}</code></pre>',
'什么是vue':()=>'Vue.js是一个渐进式JavaScript框架，由尤雨溪于2014年发布，用于构建用户界面。\n\nVue的特点：\n1. 渐进式——可以从小项目用到大项目\n2. 模板语法——基于HTML的模板，直观易学\n3. 响应式数据——数据变化自动更新视图\n4. 组合式API——Vue 3引入的 Composition API\n5. 生态丰富——Vue Router、Pinia、Nuxt.js等\n\n快速示例：\n<pre><code>&lt;template&gt;\n  &lt;div&gt;\n    &lt;p&gt;{{ message }}&lt;/p&gt;\n    &lt;button @click="count++"&gt;\n      点击 {{ count }} 次\n    &lt;/button&gt;\n  &lt;/div&gt;\n&lt;/template&gt;\n&lt;script setup&gt;\nimport { ref } from "vue";\nconst message = ref("你好 xmAI!");\nconst count = ref(0);\n&lt;/script&gt;</code></pre>',
'什么是git':()=>'Git是一个分布式版本控制系统，由Linus Torvalds（Linux之父）于2005年创建。\n\nGit的核心概念：\n1. 仓库（Repository）——项目的完整历史记录\n2. 分支（Branch）——可以同时开发多个功能\n3. 提交（Commit）——保存项目的一个快照\n4. 合并（Merge）——将不同分支的修改合并\n\n常用命令：\n<pre><code>git init              # 初始化仓库\ngit add .             # 添加所有文件到暂存区\ngit commit -m "备注"  # 提交\ngit push              # 推送到远程\ngit pull              # 拉取最新代码\ngit branch feature    # 创建分支\ngit checkout feature  # 切换分支</code></pre>',
// --- 数学进阶 ---
'什么是微积分':()=>'微积分是数学的一个重要分支，由牛顿和莱布尼茨在17世纪独立发明，主要研究"变化"和"累积"。\n\n微积分分为两部分：\n1. 微分（导数）——研究变化率\n   - 例如：汽车的速度就是位移对时间的导数\n   - f(x) = x² 的导数是 f\'(x) = 2x\n\n2. 积分——研究累积量\n   - 例如：知道速度求总路程就是积分\n   - ∫2x dx = x² + C\n\n微积分的应用：\n- 物理学——运动、力、能量\n- 工程学——结构分析、电路设计\n- 经济学——边际成本、最优化\n- AI——梯度下降算法',
'什么是概率':()=>'概率是描述某个事件发生可能性的数值，范围从0（不可能发生）到1（一定会发生）。\n\n基本概念：\n1. 等可能事件——抛硬币正反面概率各50%\n2. 互斥事件——不能同时发生的事件\n3. 独立事件——一个事件不影响另一个事件\n\n常用公式：\n- P(A或B) = P(A) + P(B) - P(A且B)\n- 独立事件P(A且B) = P(A) × P(B)\n\n趣味概率：\n- 生日悖论——23人中两人同生日的概率超过50%\n- 蒙提霍尔问题——换门后赢的概率是2/3，不换是1/3',
'什么是勾股定理':()=>'勾股定理（西方称毕达哥拉斯定理）是几何学最基本的定理之一。\n\n在直角三角形中：a² + b² = c²\n\na、b是两条直角边，c是斜边（最长边）。\n\n常见勾股数组：\n- 3, 4, 5（3²+4²=9+16=25=5²）\n- 5, 12, 13\n- 8, 15, 17\n- 7, 24, 25\n\n应用场景：测量距离、计算对角线、建筑工程等。',
'什么是方程':()=>'方程是含有未知数的等式，解方程就是找出使等式成立的未知数的值。\n\n方程的类型：\n1. 一元一次方程——如 2x + 3 = 7，解得 x = 2\n2. 一元二次方程——如 x² - 5x + 6 = 0，解得 x = 2 或 x = 3\n3. 方程组——多个方程联立求解\n\n解方程的方法：代入法、消元法、因式分解法、求根公式等。\n\n一元二次方程的求根公式：x = (-b ± √(b²-4ac)) / 2a',
// --- 体育 ---
'篮球规则':()=>'篮球是一项5v5的球类运动，目标是将球投入对方篮筐得分。\n\n基本规则：\n1. 比赛分4节，每节12分钟（NBA）\n2. 普通投篮得分2分，三分线外投中得3分，罚球得1分\n3. 运球时不能走步（持球后必须运球）\n4. 不能两次运球（运球后停球不能再运）\n5. 每队每节可叫一定数量的暂停\n6. 个人犯规达到6次（NBA）将被罚下\n\nNBA著名球星：迈克尔·乔丹、勒布朗·詹姆斯、科比·布莱恩特、库里等。',
'足球规则':()=>'足球是全球最受欢迎的运动，由国际足联（FIFA）管理。\n\n基本规则：\n1. 每队11人，比赛90分钟（上下半场各45分钟）\n2. 除守门员外，其他球员不能用手触球\n3. 越位规则——进攻球员不能在传球瞬间处于比倒数第二名防守球员更靠近球门的位置\n4. 犯规会被判罚任意球或点球\n5. 黄牌为警告，累计两张黄牌或一张红牌将被罚下\n\n世界杯是足球最高赛事，每4年举办一次。最近一届2022年世界杯由阿根廷夺冠，梅西终获世界杯冠军。',
// --- 游戏知识 ---
'王者荣耀怎么玩':()=>'王者荣耀是腾讯天美工作室开发的一款MOBA手游，5v5推塔对战。\n\n基本玩法：\n1. 选择英雄——分为坦克、战士、刺客、法师、射手、辅助6类\n2. 打野、发育——击杀小兵和野怪获取金币和经验\n3. 购买装备——根据英雄类型选择合适装备\n4. 团战推塔——配合队友击杀敌方英雄，推毁敌方防御塔和水晶\n5. 游戏节奏约15-25分钟\n\n新手建议：先从坦克或辅助练起，多看小地图，学会配合队友。',
'原神是什么游戏':()=>'原神是由米哈游开发的一款开放世界动作RPG游戏，于2020年9月发布。\n\n游戏特色：\n1. 开放世界——名为"提瓦特"的幻想大陆，有7个国家\n2. 元素系统——7种元素可以组合产生反应（如水+冰=冻结，火+草=燃烧）\n3. 抽卡系统——通过祈愿获取新角色和武器\n4. 剧情丰富——每个国家都有独立的故事线和任务\n5. 免费游玩——可在PC、手机、PS4/PS5上游玩\n\n全球累计收入超过60亿美元，是中国游戏出海最成功的作品之一。',
// --- 经济学 ---
'什么是通货膨胀':()=>'通货膨胀是指物价持续上涨、货币购买力下降的经济现象。\n\n简单理解：同样100块钱，以前能买一车商品，现在只能买半车。\n\n原因：\n1. 货币供应过多——央行印了太多钱\n2. 供不应求——商品少了，价格自然上涨\n3. 成本上升——原材料或人工成本增加\n\n影响：\n- 好处：债务负担减轻，鼓励消费和投资\n- 坏处：储蓄缩水，生活成本上升\n\n世界各国通常以CPI（消费者物价指数）衡量通胀水平，目标是保持在2%左右。',
'什么是gdp':()=>'GDP（国内生产总值）是衡量一个国家经济规模的核心指标。\n\n定义：一定时期内一个国家或地区生产的所有最终产品和服务的市场价值总和。\n\n2023年全球GDP前五：\n1. 美国 — 约25.5万亿美元\n2. 中国 — 约17.8万亿美元\n3. 日本 — 约4.2万亿美元\n4. 德国 — 约4.1万亿美元\n5. 印度 — 约3.7万亿美元\n\n注意：GDP高不等于人民富裕，还要看人均GDP（GDP÷人口）和收入分配是否公平。',
// --- 心理学 ---
'什么是情商':()=>'情商（EQ，Emotional Quotient）是指认识和管理自己及他人情绪的能力。\n\n情商的五个维度（心理学家丹尼尔·戈尔曼提出）：\n1. 自我认知——了解自己的情绪和触发因素\n2. 自我管理——控制冲动，调节情绪\n3. 自我激励——面对挫折保持积极\n4. 同理心——理解他人的感受\n5. 社交技能——建立良好的人际关系\n\n研究表明，情商对职业成功的贡献比智商更大。提高情商的方法：\n- 写情绪日记\n- 练习深呼吸和冥想\n- 主动倾听他人\n- 学会说"不"',
// --- 食物营养 ---
'维生素有哪些':()=>'维生素是人体必需的微量有机物，主要有13种：\n\n脂溶性维生素：\n- 维生素A——视力、免疫力（来源：胡萝卜、肝脏）\n- 维生素D——骨骼健康（来源：阳光、鱼肝油）\n- 维生素E——抗氧化（来源：坚果、植物油）\n- 维生素K——凝血（来源：绿叶蔬菜）\n\n水溶性维生素：\n- 维生素C——免疫力、皮肤（来源：柑橘、猕猴桃）\n- 维生素B族——B1/B2/B3/B5/B6/B7/B9/B12——能量代谢、神经（来源：全谷物、肉类）\n\n缺乏维生素的常见症状：缺维C会得坏血病，缺维D会骨质疏松，缺维A会导致夜盲症。',
'蛋白质有什么用':()=>'蛋白质是生命的基础，由氨基酸组成，占人体干重的约45%。\n\n蛋白质的功能：\n1. 构成细胞和组织——肌肉、皮肤、头发、指甲\n2. 催化化学反应——所有的酶都是蛋白质\n3. 运输物质——血红蛋白运输氧气\n4. 免疫防御——抗体是蛋白质\n5. 调节激素——胰岛素等激素是蛋白质\n\n优质蛋白质来源：\n- 动物性：鸡蛋、牛奶、鱼肉、鸡胸肉、牛肉\n- 植物性：大豆、豆腐、坚果、藜麦\n\n成年人每天需要约0.8-1.2克/公斤体重的蛋白质。',
// --- 动物 ---
'世界上最大的动物':()=>'地球上最大的动物是蓝鲸。\n\n蓝鲸的数据：\n- 体长可达30米（相当于3节地铁车厢）\n- 体重可达150-200吨（相当于30头大象）\n- 心脏大小如同一辆小汽车\n- 舌头重约2.7吨\n- 幼崽出生时就有7米长、2.5吨重\n\n蓝鲸以磷虾为食，每天可以吃下约4吨磷虾。令人遗憾的是，由于20世纪的过度捕猎，目前全球蓝鲸数量仅约1-2.5万头，属于濒危物种。',
'世界上跑最快的动物':()=>'陆地上跑最快的动物是猎豹。\n\n猎豹的数据：\n- 最高时速约112-120公里/小时\n- 从0加速到100km/h仅需约3秒（比大多数跑车还快）\n- 但只能维持最高速度约20-30秒，否则体温过高\n- 全身约3米长，体重约50公斤\n\n猎豹分布在非洲草原，主要捕食中小型羚羊。由于栖息地减少，目前野生猎豹仅约7000只。',
// --- 社会常识 ---
'坐飞机要注意什么':()=>'坐飞机的注意事项：\n\n登机前：\n1. 提前2小时到达机场（国际航班3小时）\n2. 随身行李不超过7kg，液体单瓶不超过100ml\n3. 充电宝不能超过100Wh（约20000mAh）\n4. 提前在线值机选座\n\n飞行中：\n1. 起降时收起小桌板、打开遮光板、系好安全带\n2. 多喝水防止脱水（机舱空气非常干燥）\n3. 长途飞行穿宽松衣物和舒适鞋子\n4. 调节耳机缓解耳朵不适（起飞时嚼口香糖也有帮助）\n5. 防晕机药在起飞前30分钟服用',
'学驾照流程':()=>'中国学驾照的流程：\n\n1. 报名——选择正规驾校，体检合格后报名\n2. 科目一（理论）——交通法规和安全知识，满分100，90分及格\n3. 科目二（场地）——倒车入库、侧方停车、直角转弯、曲线行驶、坡道定点，80分及格\n4. 科目三（路考）——实际道路驾驶，90分及格\n5. 科目四（安全文明驾驶）——理论考试，90分及格\n\n全部通过后，一般1-2个月内可以拿到驾照。C1（手动挡）可以开轿车和小型货车，C2（自动挡）只能开自动挡轿车。',
'简历怎么写':()=>'写好简历的关键：\n\n1. 基本信息——姓名、电话、邮箱、求职意向\n2. 教育背景——学校、专业、学历、时间\n3. 工作经历——公司、职位、时间、主要业绩（用数据说话）\n4. 技能特长——与岗位匹配的核心技能\n5. 项目经验——你做了什么、怎么做的、取得了什么成果\n\n注意事项：\n- 简历控制在1-2页\n- 用STAR法则描述经历：情境(S)-任务(T)-行动(A)-结果(R)\n- 针对岗位调整简历，不要一份简历投所有\n- 没有工作经验可以突出实习、项目和社团经历',
'面试技巧':()=>'面试的实用技巧：\n\n面试前：\n1. 研究公司和岗位——了解业务、文化、最新动态\n2. 准备自我介绍——1-2分钟，突出与岗位匹配的经历\n3. 准备常见问题——"你最大的优缺点""为什么选择我们公司"等\n4. 着装得体——不必西装，但要整洁正式\n\n面试中：\n1. 保持自信微笑，与面试官眼神交流\n2. 用具体事例和数据回答问题\n3. 诚实回答不会的问题，展示学习能力\n4. 准备2-3个好问题问面试官\n\n面试后：\n1. 当天发一封感谢邮件\n2. 总结面试中的不足，为下次做准备',

'地震是什么':()=>'地震是地壳快速释放能量产生的震动，由板块运动、火山活动等引起。\n\n地震的关键概念：\n1. 震级——衡量地震释放的能量，每增加1级能量增约32倍\n2. 里氏震级——常用的震级标度\n3. 震中——地震在地表的投影点\n4. 烈度——地面受影响和破坏的程度\n\n全球每年约发生500万次地震，但大多数是无感地震。造成严重破坏的7级以上地震每年约15-20次。\n\n遇到地震怎么办：\n- 室内：蹲下、掩护、抓紧（躲在坚固桌下）\n- 室外：远离建筑物、电线杆，到空旷地带\n- 不要乘坐电梯，保护好头部',
'台风是什么':()=>'台风是热带气旋的一种，在西北太平洋地区生成，中心风力达到12级以上。\n\n台风的结构：\n1. 台风眼——中心区域，相对平静\n2. 眼壁——风速最大的区域\n3. 外围雨带——大量降水\n\n台风等级（按中心最大风力）：\n- 热带低压——6-7级\n- 热带风暴——8-9级\n- 强热带风暴——10-11级\n- 台风——12-13级\n- 强台风——14-15级\n- 超强台风——16级以上\n\n中国每年平均受台风影响约7次，主要集中在7-10月。遇到台风要做好防风准备，关好门窗，储备食物和水。',
'彩虹怎么形成的':()=>'彩虹是太阳光经过雨滴折射和反射后形成的自然光学现象。\n\n形成条件：\n1. 太阳在观察者身后\n2. 前方有雨滴或水雾\n3. 角度合适（约42度）\n\n主虹的七色顺序从外到内：红→橙→黄→绿→蓝→靛→紫\n\n有时还能看到"双彩虹"：外侧较暗的彩虹颜色顺序相反（紫在外），叫做"霓"。\n\n有趣的是：每个人看到的彩虹都是独一无二的，因为每个人的观察角度不同。',

'怎样睡得好':()=>'改善睡眠质量的方法：\n\n1. 固定作息——每天同一时间睡觉和起床，包括周末\n2. 睡前仪式——泡脚、阅读、轻音乐，远离手机\n3. 睡眠环境——黑暗、安静、凉爽（18-22°C最佳）\n4. 注意饮食——下午3点后不喝咖啡或浓茶；睡前不饮酒（酒精会破坏深度睡眠）\n5. 运动——每天适量运动，但睡前2小时不要剧烈运动\n6. 午睡——控制在20-30分钟以内\n7. 如果躺下20分钟还睡不着，起来做点放松的事再回床上\n\n成人每天建议睡眠7-9小时，睡眠不足会导致免疫力下降、注意力不集中、情绪低落。',
'怎样保护眼睛':()=>'保护眼睛的方法：\n\n1. 20-20-20法则——看屏幕20分钟后，看20英尺（6米）外20秒\n2. 光线适中——不要太暗也不要太亮\n3. 保持距离——电脑屏幕距离50-70厘米\n4. 多眨眼——看屏幕时眨眼次数会减少50%，导致眼干\n5. 户外活动——研究表明每天户外活动2小时可有效预防近视\n6. 均衡饮食——多吃富含维生素A和叶黄素的食物（胡萝卜、菠菜、蓝莓）\n7. 定期检查——建议每年做一次眼科检查\n8. 不要揉眼睛——手上细菌可能导致感染',
'怎样提高记忆力':()=>'提高记忆力的科学方法：\n\n1. 充足睡眠——睡眠中大脑会巩固记忆，睡得好记性好\n2. 间隔重复——不要一次死记硬背，分散在几天内复习效果更好\n3. 主动回忆——合上书试着回忆内容，比反复阅读更有效\n4. 联想记忆——把要记的内容和已有的知识或画面关联起来\n5. 运动锻炼——有氧运动促进大脑BDNF蛋白分泌，有助于记忆\n6. 手写笔记——研究表明手写比打字更有助于记忆\n7. 教别人——费曼学习法：如果你能用简单的话教会别人，说明你真正理解了\n8. 减少压力——慢性压力会损伤海马体（负责记忆的脑区）',
'怎样管理时间':()=>'高效时间管理的方法：\n\n1. 番茄工作法——专注工作25分钟，休息5分钟，4个番茄后长休15-30分钟\n2. 四象限法——把任务分为：紧急且重要→优先做；重要不紧急→计划做；紧急不重要→委托；不紧急不重要→不做\n3. 二八法则——20%的关键任务产生80%的价值，优先处理重要的事\n4. 时间块——把一天分成几个时间段，每个时间段只做一类事\n5. 消除干扰——关掉不必要的通知，设定"勿扰时间"\n6. 每日三件事——每天只确定3件最重要的事，确保完成',
'怎么做好ppt':()=>'做好PPT的关键：\n\n1. 少即是多——每页只讲一个观点\n2. 三的法则——每页不超过3种颜色、3个要点、3张图片\n3. 大字号——标题至少36号，正文至少24号\n4. 高质量图片——用高清图片代替低质量截图\n5. 一致性——统一字体、颜色方案和排版风格\n6. 讲故事——用故事线串联内容，不要堆砌数据\n7. 练习演讲——PPT是辅助，演讲才是核心\n\n常用配色：\n- 商务：深蓝+白色+灰色\n- 科技：紫色+青色+白色\n- 教育：橙色+绿色+白色',
'怎么写好文章':()=>'写好文章的方法：\n\n1. 明确目的——写给谁看？想传达什么？\n2. 列提纲——先确定结构（开头-主体-结尾）\n3. 开头吸引人——用问题、故事或数据开头\n4. 分段清晰——每段一个主题，段首为主题句\n5. 用具体例子——空洞的说服不如生动的案例\n6. 语言简洁——删掉多余的词句，能用短句就不用长句\n7. 结尾有力——总结要点、升华主题或呼吁行动\n8. 写完放一放——过几小时再修改，会有新发现\n\n写作的核心技巧：多读、多写、多改。每天坚持写300字，一年后写作能力会有质的飞跃。',

// 模糊匹配知识库
function searchKB(q){
  const l=q.toLowerCase().replace(/[？?!！。，,、]/g,' ').trim();
  const words=l.split(/\s+/);
  let bestMatch=null,bestScore=0;
  for(const [key,fn] of Object.entries(KB)){
    const k=key.toLowerCase();
    // 精确包含
    if(l.includes(k)){return{key,fn,score:10}}
    // 关键词命中
    let score=0;
    for(const w of words){if(w.length>=2&&k.includes(w))score+=w.length;if(k.includes(l))score+=5}
    if(score>bestScore){bestScore=score;bestMatch={key,fn,score}}
  }
  return bestScore>=3?bestMatch:null;
}

function getAIResponse(input){
  // 1. 先查知识库
  const kbMatch=searchKB(input);
  if(kbMatch)return kbMatch.fn();
  // 2. 关键词精确匹配（brain的快捷回复）
  const brainMatch=matchBrain(input);
  if(brainMatch)return brainMatch;
  // 3. 智能生成回复
  return smartGenerate(input);
}

function smartGenerate(q){
  const l=q.toLowerCase();
  // 数学计算检测
  const mathMatch=q.match(/(\d+)\s*([+\-×÷x*/^%])\s*(\d+)/);
  if(mathMatch){
    const a=parseFloat(mathMatch[1]),op=mathMatch[2],b=parseFloat(mathMatch[3]);
    let result;
    if(op==='+'||op==='+')result=a+b;
    else if(op==='-'||op==='−')result=a-b;
    else if(op==='×'||op==='x'||op==='*'||op==='X')result=a*b;
    else if(op==='÷'||op==='/'){if(b===0)return'除数不能为零哦！';result=a/b;}
    else if(op==='^'||op==='**')result=Math.pow(a,b);
    else if(op==='%')result=a%b;
    if(result!==undefined){
      return`计算结果：\n\n${a} ${op} ${b} = ${Number.isInteger(result)?result:result.toFixed(4)}\n\n需要我帮你算别的吗？`
    }
  }
  // 翻译检测
  if(l.includes('翻译')||l.includes('translate')){
    return`我可以帮你翻译！请按这个格式提问：\n\n"把"你好世界"翻译成英语"\n"translate hello to 中文"\n\n支持的语种包括：中文、英语、日语、韩语、法语、德语、西班牙语等。\n\n请告诉我你想翻译什么内容？`
  }
  // 带有问号的 - 尝试生成智能回答
  if(q.includes('？')||q.includes('?')){
    return generateAnswer(q);
  }
  // 默认
  return generateAnswer(q);
}

    return topicAnswers[matchedTopic];
  }
  return`这是一个很有意思的问题！虽然我的知识库中暂时没有直接匹配的答案，但我可以从以下几个角度来分析：\n\n1. 你可以尝试换个方式描述问题\n2. 如果是百科知识，可以试试问我具体的名词、概念、人物等\n3. 如果是编程问题，告诉我语言和具体需求\n4. 如果是生活问题，告诉我具体场景\n\n我能回答的问题类型包括：百科常识、历史人文、科学技术、数学计算、健康知识、生活技巧、编程代码等等。\n\n请把你的问题说得更具体一些吧！`;
}

// ===== CHAT =====
function newChat(){const c={id:Date.now(),title:'新的对话',messages:[],created:new Date()};chats.unshift(c);activeChat=c;renderChatList();renderMessages();document.getElementById('headerTitle').textContent='新的对话'}
function switchChat(id){activeChat=chats.find(c=>c.id===id);renderChatList();renderMessages();if(activeChat)document.getElementById('headerTitle').textContent=activeChat.title}
function renderChatList(){document.getElementById('chatList').innerHTML=chats.map(c=>`<div class="chat-item ${c.id===activeChat?.id?'active':''}" onclick="switchChat(${c.id})"><span class="dot"></span><span class="ct">${esc(c.title)}</span><div class="ca"><button class="cab" onclick="event.stopPropagation();startRename(${c.id})" title="重命名"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button class="cab dng" onclick="event.stopPropagation();showDelModal(${c.id})" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button></div></div>`).join('')}
function startRename(id){const c=chats.find(x=>x.id===id);const idx=chats.indexOf(c)+1;const el=document.querySelector(`.chat-item:nth-child(${idx}) .ct`);if(!el)return;el.innerHTML=`<input class="rename-input" value="${esc(c.title)}" maxlength="30">`;const inp=el.querySelector('input');inp.focus();inp.select();const done=()=>{const v=inp.value.trim();if(v){c.title=v;if(activeChat?.id===id)document.getElementById('headerTitle').textContent=v}renderChatList()};inp.addEventListener('blur',done);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();done()}if(e.key==='Escape')renderChatList()})}
function showDelModal(id){deleteTargetId=id;document.getElementById('deleteModal').classList.add('show')}
function closeDelModal(){document.getElementById('deleteModal').classList.remove('show');deleteTargetId=null}
function confirmDel(){if(deleteTargetId!==null){chats=chats.filter(c=>c.id!==deleteTargetId);if(activeChat?.id===deleteTargetId){activeChat=chats[0]||null;if(activeChat)switchChat(activeChat.id);else newChat()}renderChatList()}closeDelModal()}

function renderMessages(){const area=document.getElementById('messagesArea');if(!activeChat||activeChat.messages.length===0){area.innerHTML=`<div class="welcome-screen"><div class="welcome-logo">XM</div><div class="welcome-title">你好，我是 xmAI</div><div class="welcome-sub">我是你的AI智能助手，由TRAE打造。你可以问我任何问题——写代码、头脑风暴、讲故事，或者随便聊聊！</div><div class="quick-actions"><button class="quick-btn" onclick="sendQuick('帮我写一个Python排序函数')"><span class="qi">&#128187;</span><span class="qt">写代码</span><span class="qd">Python、JS、HTML...</span></button><button class="quick-btn" onclick="sendQuick('用简单的语言解释量子计算')"><span class="qi">&#129504;</span><span class="qt">解释概念</span><span class="qd">科学、技术、知识</span></button><button class="quick-btn" onclick="sendQuick('帮我头脑风暴创业想法')"><span class="qi">&#128161;</span><span class="qt">头脑风暴</span><span class="qd">创意、计划、策略</span></button><button class="quick-btn" onclick="sendQuick('给我讲一个有趣的短故事')"><span class="qi">&#128214;</span><span class="qt">创意创作</span><span class="qd">故事、诗歌、笑话</span></button></div></div>`;return}area.innerHTML=activeChat.messages.map((m,i)=>createMsgHTML(m,i)).join('');area.scrollTop=area.scrollHeight}
function createMsgHTML(m,idx){const t=new Date(m.time).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});let th='';if(m.thinking){th=`<div class="thinking-block"><div class="thinking-header done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>深度思考</div>${m.thinking.map(s=>`<div class="step">▸ ${s}</div>`).join('')}</div>`}let actions='';if(m.role==='ai'){actions=`<div class="msg-actions"><button class="msg-action" id="speakBtn_${idx}" onclick="speakMessage(${idx})" title="朗读"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>朗读</button></div>`}return`<div class="msg ${m.role}" data-idx="${idx}"><div class="msg-avatar">${m.role==='ai'?'XM':'U'}</div><div class="msg-body">${th}<div class="msg-content">${m.content}</div>${actions}<div class="msg-time">${t}</div></div></div>`}

function sendMessage(){const inp=document.getElementById('userInput');const txt=inp.value.trim();if(!txt)return;if(!activeChat)newChat();if(activeChat.messages.length===0){activeChat.title=txt.length>25?txt.slice(0,25)+'...':txt;document.getElementById('headerTitle').textContent=activeChat.title;renderChatList()}activeChat.messages.push({role:'user',content:esc(txt),time:Date.now()});renderMessages();inp.value='';inp.style.height='auto';showTyping();const sm={fast:800,normal:1500,slow:3000};const bd=sm[settings.speed]||1500;const td=deepThink?bd*2:0;setTimeout(()=>{const tp=document.getElementById('typingMsg');if(tp)tp.remove();let tk=null;if(deepThink){tk=[...thinkSteps];const area=document.getElementById('messagesArea');area.insertAdjacentHTML('beforeend',`<div class="msg ai" id="thinkMsg"><div class="msg-avatar">XM</div><div class="msg-body"><div class="thinking-block" id="thinkBlock"><div class="thinking-header"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>深度思考中...</div>${tk.map(s=>`<div class="step" style="opacity:.3">▸ ${s}</div>`).join('')}</div></div></div>`);area.scrollTop=area.scrollHeight;animateThink()}setTimeout(()=>{const tm=document.getElementById('thinkMsg');if(tm)tm.remove();const resp=getAIResponse(txt);activeChat.messages.push({role:'ai',content:resp,time:Date.now(),thinking:tk});renderMessages()},deepThink?bd:0)},td||bd)}
function animateThink(){const bl=document.getElementById('thinkBlock');if(!bl)return;const steps=bl.querySelectorAll('.step');let i=0;const t=setInterval(()=>{if(i<steps.length){steps[i].style.opacity='1';steps[i].style.transition='opacity .4s';i++}else{clearInterval(t);const h=bl.querySelector('.thinking-header');if(h){h.classList.add('done');h.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>思考完成'}}},500)}
function showTyping(){const a=document.getElementById('messagesArea');a.insertAdjacentHTML('beforeend','<div class="msg ai" id="typingMsg"><div class="msg-avatar">XM</div><div class="msg-body"><div class="msg-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div></div></div>');a.scrollTop=a.scrollHeight}
function sendQuick(t){document.getElementById('userInput').value=t;sendMessage()}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}

// ===== VOICE =====
function toggleVoice(){if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){alert('你的浏览器不支持语音输入，建议使用Chrome浏览器。');return}if(isRecording){stopVoice();return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=true;recognition.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;document.getElementById('userInput').value=t};recognition.onend=()=>stopVoice();recognition.onerror=()=>stopVoice();recognition.start();isRecording=true;document.getElementById('voiceBtn').classList.add('recording');document.getElementById('inputHint').textContent='正在聆听... 点击麦克风停止'}
function stopVoice(){if(recognition)try{recognition.stop()}catch(e){}isRecording=false;document.getElementById('voiceBtn').classList.remove('recording');document.getElementById('inputHint').textContent='按 Enter 发送，Shift+Enter 换行 | 支持语音输入'}

// ===== TTS 语音朗读 =====
let currentUtterance=null,currentSpeakBtn=null;
function speakMessage(idx){
  if(!window.speechSynthesis){alert('你的浏览器不支持语音朗读');return}
  if(currentUtterance){window.speechSynthesis.cancel();if(currentSpeakBtn){currentSpeakBtn.classList.remove('speaking');currentSpeakBtn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>朗读'}}
  const msg=activeChat.messages[idx];if(!msg||msg.role!=='ai')return;
  const text=msg.content.replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
  const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=1.1;u.pitch=1;
  const btn=document.getElementById('speakBtn_'+idx);currentSpeakBtn=btn;
  u.onstart=()=>{if(btn){btn.classList.add('speaking');btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>播放中'}}
  u.onend=()=>{if(btn){btn.classList.remove('speaking');btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>朗读'}currentUtterance=null}
  u.onerror=()=>{if(btn){btn.classList.remove('speaking');btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>朗读'}currentUtterance=null}
  currentUtterance=u;window.speechSynthesis.speak(u)
}

// ===== THINK / SETTINGS / MENU =====
function toggleThink(){deepThink=!deepThink;document.getElementById('thinkToggle').classList.toggle('active',deepThink)}
function toggleSettings(){document.getElementById('settingsModal').classList.toggle('show')}
function saveSettings(){settings.personality=document.getElementById('personalitySelect').value;settings.speed=document.getElementById('speedSelect').value;toggleSettings()}
function toggleUserMenu(){document.getElementById('userDropdown').classList.toggle('show')}
document.addEventListener('click',e=>{if(!e.target.closest('.user-menu'))document.getElementById('userDropdown')?.classList.remove('show');if(e.target===document.getElementById('settingsModal'))toggleSettings();if(e.target===document.getElementById('deleteModal'))closeDelModal()});
</script>
