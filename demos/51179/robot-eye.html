<!DOCTYPE html>

<head>

    <title>机器人眼球交互模块 — 眼神交流系统</title>
    <style>
        :root {
            --bg: #0a0e17;
            --bg2: #111827;
            --surface: #1f2937;
            --ink: #f3f4f6;
            --muted: #9ca3af;
            --accent: #06b6d4;
            --accent2: #f472b6;
            --rule: #374151;
            --glow: rgba(6, 182, 212, 0.3);
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 背景网格效果 */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* 扫描线效果 */
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.3;
            animation: scan 6s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes scan {
            0% { transform: translateY(-4px); }
            100% { transform: translateY(100vh); }
        }

        /* 头部标题 */
        .header {
            position: relative;
            z-index: 10;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--rule);
            background: linear-gradient(180deg, rgba(10,14,23,0.95), rgba(10,14,23,0.8));
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--ink), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-bar {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 主内容区 */
        .main-container {
            flex: 1;
            display: flex;
            position: relative;
            z-index: 5;
        }

        /* 眼球区域 */
        .eye-stage {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            position: relative;
        }

        /* 眼眶 */
        .eye-socket {
            position: relative;
            width: 220px;
            height: 220px;
        }

        .eye-socket::before {
            content: '';
            position: absolute;
            inset: -15px;
            border-radius: 50%;
            border: 2px solid var(--rule);
            box-shadow:
                0 0 30px rgba(6, 182, 212, 0.1),
                inset 0 0 30px rgba(6, 182, 212, 0.05);
        }

        .eye-socket::after {
            content: '';
            position: absolute;
            inset: -25px;
            border-radius: 50%;
            border: 1px dashed rgba(6, 182, 212, 0.15);
        }

        /* 眼球 */
        .eyeball {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #e5e7eb, #9ca3af, #4b5563);
            position: relative;
            overflow: hidden;
            box-shadow:
                inset -10px -10px 30px rgba(0,0,0,0.4),
                inset 10px 10px 30px rgba(255,255,255,0.3),
                0 0 40px rgba(6, 182, 212, 0.15);
        }

        /* 虹膜 */
        .iris {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, var(--accent), #0891b2, #164e63);
            box-shadow:
                inset 0 0 20px rgba(0,0,0,0.3),
                0 0 15px rgba(6, 182, 212, 0.4);
            transition: all 0.3s ease;
        }

        .iris::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: repeating-conic-gradient(
                from 0deg,
                transparent 0deg,
                rgba(255,255,255,0.03) 2deg,
                transparent 4deg
            );
        }

        /* 瞳孔 */
        .pupil {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at 30% 30%, #1f2937, #000);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: width 0.3s ease, height 0.3s ease;
        }

        /* 高光 */
        .highlight {
            position: absolute;
            top: 25%;
            left: 30%;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,255,255,0.1));
            filter: blur(2px);
            pointer-events: none;
        }

        .highlight-small {
            position: absolute;
            top: 60%;
            left: 65%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            filter: blur(1px);
            pointer-events: none;
        }

        /* 眼睑 */
        .eyelid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, var(--bg2), var(--surface));
            border-radius: 50% 50% 0 0;
            z-index: 10;
            transition: height 0.1s ease;
        }

        .eyelid-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(0deg, var(--bg2), var(--surface));
            border-radius: 0 0 50% 50%;
            z-index: 10;
            transition: height 0.1s ease;
        }

        /* 眼皮线条 */
        .eyelid-rim {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0%;
            border-bottom: 2px solid var(--accent);
            border-radius: 50% 50% 0 0;

        }

        /* 控制面板 */
        .control-panel {
            width: 320px;

        /* 情绪按钮 */
        .emotion-grid {

            gap: 10px;

        .emotion-btn {
            padding: 12px;

        }

        .emotion-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--glow);
        }

        .emotion-btn.active {
            background: linear-gradient(135deg, rgba(6,182,212,0.2), rgba(6,182,212,0.05));
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--glow);
        }

        /* 滑块控制 */
        .slider-group {
            margin-bottom: 16px;
        }

        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .slider-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--surface);
            outline: none;
            -webkit-appearance: none;
        }

        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 8px var(--accent);
        }

        /* 数据监控 */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .data-item {
            background: rgba(6, 182, 212, 0.05);
            border: 1px solid rgba(6, 182, 212, 0.1);
            border-radius: 8px;
            padding: 12px;

        }

        .data-item .label {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .data-item .value {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent);
            font-family: 'Courier New', monospace;
        }

        /* 开关 */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .toggle-row span {
            font-size: 0.85rem;
            color: var(--ink);
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: var(--surface);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.on {
            background: var(--accent);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            transition: transform 0.3s;
        }

        .toggle-switch.on::after {
            transform: translateX(20px);
        }

        /* 日志区域 */
        .log-area {
            height: 120px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: var(--muted);
            overflow-y: auto;
            line-height: 1.6;
        }

        .log-area .log-entry {
            margin-bottom: 4px;
        }

        .log-area .log-time {
            color: var(--accent);
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
            }
            .control-panel {
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--rule);
                max-height: 300px;
            }
            .eye-socket {
                width: 160px;
                height: 160px;
            }
            .eyeball {
                width: 160px;
                height: 160px;
            }
            .iris {
                width: 90px;
                height: 90px;
            }
            .pupil {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="scan-line"></div>

    <div class="header">
        <h1>ROBOT EYE MODULE v2.0</h1>
        <div class="status-bar">
            <div class="status-dot"></div>
            <span>系统运行中</span>
            <span id="fps-counter">FPS: 60</span>
        </div>
    </div>

    <div class="main-container">
        <div class="eye-stage" id="eye-stage">
            <!-- 左眼 -->
            <div class="eye-socket">
                <div class="eyeball" id="eye-left">
                    <div class="iris" id="iris-left">
                        <div class="pupil" id="pupil-left"></div>
                    </div>
                    <div class="highlight"></div>
                    <div class="highlight-small"></div>
                    <div class="eyelid" id="eyelid-left"></div>
                    <div class="eyelid-bottom" id="eyelid-left-bottom"></div>
                    <div class="eyelid-rim" id="eyelid-left-rim"></div>
                </div>
            </div>

            <!-- 右眼 -->
            <div class="eye-socket">
                <div class="eyeball" id="eye-right">
                    <div class="iris" id="iris-right">
                        <div class="pupil" id="pupil-right"></div>
                    </div>
                    <div class="highlight"></div>
                    <div class="highlight-small"></div>
                    <div class="eyelid" id="eyelid-right"></div>
                    <div class="eyelid-bottom" id="eyelid-right-bottom"></div>
                    <div class="eyelid-rim" id="eyelid-right-rim"></div>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <!-- 情绪控制 -->
            <div class="panel-section">
                <h3>情绪模式</h3>
                <div class="emotion-grid">
                    <div class="emotion-btn active" data-emotion="normal">正常</div>
                    <div class="emotion-btn" data-emotion="focus">专注</div>
                    <div class="emotion-btn" data-emotion="relaxed">放松</div>
                    <div class="emotion-btn" data-emotion="surprised">惊讶</div>
                    <div class="emotion-btn" data-emotion="sleepy">困倦</div>
                    <div class="emotion-btn" data-emotion="curious">好奇</div>
                </div>
            </div>

            <!-- 参数调节 -->
            <div class="panel-section">
                <h3>参数调节</h3>
                <div class="slider-group">
                    <label>
                        <span>追踪灵敏度</span>
                        <span id="sensitivity-val">80%</span>
                    </label>
                    <input type="range" id="sensitivity" min="10" max="100" value="80">
                </div>
                <div class="slider-group">
                    <label>
                        <span>瞳孔反应速度</span>
                        <span id="react-val">60%</span>
                    </label>
                    <input type="range" id="react-speed" min="10" max="100" value="60">
                </div>
                <div class="slider-group">
                    <label>
                        <span>眨眼频率</span>
                        <span id="blink-val">正常</span>
                    </label>
                    <input type="range" id="blink-rate" min="0" max="100" value="40">
                </div>
            </div>

            <!-- 功能开关 -->
            <div class="panel-section">
                <h3>功能开关</h3>
                <div class="toggle-row">
                    <span>眼球追踪</span>
                    <div class="toggle-switch on" id="toggle-tracking"></div>
                </div>
                <div class="toggle-row">
                    <span>瞳孔自适应</span>
                    <div class="toggle-switch on" id="toggle-pupil"></div>
                </div>
                <div class="toggle-row">
                    <span>自动眨眼</span>
                    <div class="toggle-switch on" id="toggle-blink"></div>
                </div>
            </div>

            <!-- 实时数据 -->
            <div class="panel-section">
                <h3>实时数据</h3>
                <div class="data-grid">
                    <div class="data-item">
                        <div class="label">注视 X</div>
                        <div class="value" id="gaze-x">0</div>
                    </div>
                    <div class="data-item">
                        <div class="label">注视 Y</div>
                        <div class="value" id="gaze-y">0</div>
                    </div>
                    <div class="data-item">
                        <div class="label">瞳孔大小</div>
                        <div class="value" id="pupil-size">50%</div>
                    </div>
                    <div class="data-item">
                        <div class="label">情绪状态</div>
                        <div class="value" id="emotion-state">正常</div>
                    </div>
                </div>
            </div>

            <!-- 系统日志 -->
            <div class="panel-section">
                <h3>系统日志</h3>
                <div class="log-area" id="log-area">
                    <div class="log-entry"><span class="log-time">[系统]</span> 眼球模块初始化完成</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 全局状态 ====================
        const state = {
            emotion: 'normal',
            tracking: true,
            pupilAdapt: true,
            autoBlink: true,
            sensitivity: 0.8,
            reactSpeed: 0.6,
            blinkRate: 0.4,
            mouseX: window.innerWidth / 2,
            mouseY: window.innerHeight / 2,
            gazeX: 0,
            gazeY: 0,
            pupilSize: 50,
            targetPupilSize: 50,
            blinkState: 0, // 0=open, 1=closing, 2=closed, 3=opening
            blinkTimer: 0,
            nextBlinkTime: 3000,
            lastTime: performance.now(),
            frameCount: 0,
            lastFpsTime: performance.now()
        };

        // 情绪配置
        const emotionConfig = {
            normal: { pupilBase: 50, pupilRange: 15, irisColor: 'var(--accent)', blinkInterval: 4000 },
            focus: { pupilBase: 35, pupilRange: 5, irisColor: '#06b6d4', blinkInterval: 6000 },
            relaxed: { pupilBase: 60, pupilRange: 20, irisColor: '#22c55e', blinkInterval: 5000 },
            surprised: { pupilBase: 30, pupilRange: 10, irisColor: '#f59e0b', blinkInterval: 8000 },
            sleepy: { pupilBase: 65, pupilRange: 10, irisColor: '#8b5cf6', blinkInterval: 2000 },
            curious: { pupilBase: 45, pupilRange: 25, irisColor: '#f472b6', blinkInterval: 3500 }
        };

        // ==================== DOM 元素 ====================
        const eyes = {
            left: {
                ball: document.getElementById('eye-left'),
                iris: document.getElementById('iris-left'),
                pupil: document.getElementById('pupil-left'),
                eyelid: document.getElementById('eyelid-left'),
                eyelidBottom: document.getElementById('eyelid-left-bottom'),
                eyelidRim: document.getElementById('eyelid-left-rim')
            },
            right: {
                ball: document.getElementById('eye-right'),
                iris: document.getElementById('iris-right'),
                pupil: document.getElementById('pupil-right'),
                eyelid: document.getElementById('eyelid-right'),
                eyelidBottom: document.getElementById('eyelid-right-bottom'),
                eyelidRim: document.getElementById('eyelid-right-rim')
            }
        };

        const logArea = document.getElementById('log-area');
        const gazeXEl = document.getElementById('gaze-x');
        const gazeYEl = document.getElementById('gaze-y');
        const pupilSizeEl = document.getElementById('pupil-size');
        const emotionStateEl = document.getElementById('emotion-state');
        const fpsCounter = document.getElementById('fps-counter');

        // ==================== 工具函数 ====================
        function log(message) {
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span> ${message}`;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
            // 限制日志数量
            while (logArea.children.length > 20) {
                logArea.removeChild(logArea.firstChild);
            }
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function clamp(val, min, max) {
            return Math.max(min, Math.min(max, val));
        }

        // ==================== 眼球追踪 ====================
        function updateEyeTracking(eye, offsetX, dt) {
            if (!state.tracking) return;

            const rect = eye.ball.getBoundingClientRect();
            const eyeCenterX = rect.left + rect.width / 2;
            const eyeCenterY = rect.top + rect.height / 2;

            // 计算鼠标相对于眼球中心的角度和距离
            const dx = state.mouseX - eyeCenterX + offsetX;
            const dy = state.mouseY - eyeCenterY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const maxDistance = 30 * state.sensitivity;
            const angle = Math.atan2(dy, dx);

            // 限制移动范围
            const moveDistance = Math.min(distance * 0.15 * state.sensitivity, maxDistance);

            // 目标位置
            const targetX = Math.cos(angle) * moveDistance;
            const targetY = Math.sin(angle) * moveDistance;

            // 平滑插值
            const smoothFactor = 1 - Math.pow(0.01, dt * state.reactSpeed * 3);
            state.gazeX = lerp(state.gazeX, targetX, smoothFactor);
            state.gazeY = lerp(state.gazeY, targetY, smoothFactor);

            // 应用变换
            eye.iris.style.transform = `translate(calc(-50% + ${state.gazeX}px), calc(-50% + ${state.gazeY}px))`;
            eye.pupil.style.transform = `translate(calc(-50% + ${state.gazeX * 1.2}px), calc(-50% + ${state.gazeY * 1.2}px))`;
        }

        // ==================== 瞳孔自适应 ====================
        function updatePupilAdaptation(eye, dt) {
            if (!state.pupilAdapt) return;

            const config = emotionConfig[state.emotion];
            const rect = eye.ball.getBoundingClientRect();
            const eyeCenterX = rect.left + rect.width / 2;
            const eyeCenterY = rect.top + rect.height / 2;
            const distance = Math.sqrt(
                (state.mouseX - eyeCenterX) ** 2 +
                (state.mouseY - eyeCenterY) ** 2
            );

            // 距离越近瞳孔越小（专注），越远越大（放松）
            const normalizedDist = clamp(distance / 500, 0, 1);
            state.targetPupilSize = config.pupilBase + (normalizedDist * config.pupilRange);

            const smoothFactor = 1 - Math.pow(0.001, dt * state.reactSpeed * 2);
            state.pupilSize = lerp(state.pupilSize, state.targetPupilSize, smoothFactor);

            const sizePx = (state.pupilSize / 100) * 60; // 最大60px
            eye.pupil.style.width = `${sizePx}px`;
            eye.pupil.style.height = `${sizePx}px`;
        }

        // ==================== 眨眼动画 ====================
        function updateBlink(eye, dt) {
            if (!state.autoBlink) {
                eye.eyelid.style.height = '0%';
                eye.eyelidBottom.style.height = '0%';
                eye.eyelidRim.style.height = '0%';
                return;
            }

            state.blinkTimer += dt * 1000;

            if (state.blinkState === 0) { // 睁开状态
                if (state.blinkTimer >= state.nextBlinkTime) {
                    state.blinkState = 1;
                    state.blinkTimer = 0;
                }
            } else if (state.blinkState === 1) { // 正在闭眼
                const progress = state.blinkTimer / (100 - state.blinkRate * 0.5);
                const height = Math.min(progress * 55, 55);
                eye.eyelid.style.height = `${height}%`;
                eye.eyelidBottom.style.height = `${height * 0.3}%`;
                eye.eyelidRim.style.height = `${height}%`;
                if (progress >= 1) {
                    state.blinkState = 2;
                    state.blinkTimer = 0;
                }
            } else if (state.blinkState === 2) { // 闭合状态
                if (state.blinkTimer >= 80) {
                    state.blinkState = 3;
                    state.blinkTimer = 0;
                }
            } else if (state.blinkState === 3) { // 正在睁眼
                const progress = state.blinkTimer / (100 - state.blinkRate * 0.5);
                const height = Math.max(55 - progress * 55, 0);
                eye.eyelid.style.height = `${height}%`;
                eye.eyelidBottom.style.height = `${height * 0.3}%`;
                eye.eyelidRim.style.height = `${height}%`;
                if (progress >= 1) {
                    state.blinkState = 0;
                    state.blinkTimer = 0;
                    const config = emotionConfig[state.emotion];
                    state.nextBlinkTime = config.blinkInterval + (Math.random() - 0.5) * 2000;
                }
            }
        }

        // ==================== 主循环 ====================
        function gameLoop(currentTime) {
            const dt = Math.min((currentTime - state.lastTime) / 1000, 0.05);
            state.lastTime = currentTime;

            // FPS 计算
            state.frameCount++;
            if (currentTime - state.lastFpsTime >= 1000) {
                fpsCounter.textContent = `FPS: ${state.frameCount}`;
                state.frameCount = 0;
                state.lastFpsTime = currentTime;
            }

            // 更新左眼
            updateEyeTracking(eyes.left, 0, dt);
            updatePupilAdaptation(eyes.left, dt);
            updateBlink(eyes.left, dt);

            // 更新右眼
            updateEyeTracking(eyes.right, 0, dt);
            updatePupilAdaptation(eyes.right, dt);
            updateBlink(eyes.right, dt);

            // 更新UI数据
            gazeXEl.textContent = Math.round(state.gazeX);
            gazeYEl.textContent = Math.round(state.gazeY);
            pupilSizeEl.textContent = Math.round(state.pupilSize) + '%';

            requestAnimationFrame(gameLoop);
        }

        // ==================== 事件监听 ====================
        document.addEventListener('mousemove', (e) => {
            state.mouseX = e.clientX;
            state.mouseY = e.clientY;
        });

        // 触摸支持
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                state.mouseX = e.touches[0].clientX;
                state.mouseY = e.touches[0].clientY;
            }
        }, { passive: true });

        // 情绪切换
        document.querySelectorAll('.emotion-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.emotion-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.emotion = btn.dataset.emotion;

                const config = emotionConfig[state.emotion];
                const emotionNames = {
                    normal: '正常', focus: '专注', relaxed: '放松',
                    surprised: '惊讶', sleepy: '困倦', curious: '好奇'
                };
                emotionStateEl.textContent = emotionNames[state.emotion];

                // 更新虹膜颜色
                eyes.left.iris.style.background = `radial-gradient(circle, ${config.irisColor}, ${config.irisColor}cc, ${config.irisColor}66)`;
                eyes.right.iris.style.background = `radial-gradient(circle, ${config.irisColor}, ${config.irisColor}cc, ${config.irisColor}66)`;
                eyes.left.iris.style.boxShadow = `inset 0 0 20px rgba(0,0,0,0.3), 0 0 15px ${config.irisColor}66`;
                eyes.right.iris.style.boxShadow = `inset 0 0 20px rgba(0,0,0,0.3), 0 0 15px ${config.irisColor}66`;

                log(`切换情绪模式: ${emotionNames[state.emotion]}`);
            });
        });

        // 滑块控制
        document.getElementById('sensitivity').addEventListener('input', (e) => {
            state.sensitivity = e.target.value / 100;
            document.getElementById('sensitivity-val').textContent = e.target.value + '%';
        });

        document.getElementById('react-speed').addEventListener('input', (e) => {
            state.reactSpeed = e.target.value / 100;
            document.getElementById('react-val').textContent = e.target.value + '%';
        });

        document.getElementById('blink-rate').addEventListener('input', (e) => {
            state.blinkRate = e.target.value / 100;
            const labels = ['极低', '低', '正常', '高', '极高'];
            const index = Math.floor((e.target.value / 100) * 4);
            document.getElementById('blink-val').textContent = labels[index] || '正常';
        });

        // 开关控制
        function toggleSwitch(id, stateKey, name) {
            const el = document.getElementById(id);
            el.addEventListener('click', () => {
                el.classList.toggle('on');
                state[stateKey] = el.classList.contains('on');
                log(`${name}: ${state[stateKey] ? '开启' : '关闭'}`);
            });
        }

        toggleSwitch('toggle-tracking', 'tracking', '眼球追踪');
        toggleSwitch('toggle-pupil', 'pupilAdapt', '瞳孔自适应');
        toggleSwitch('toggle-blink', 'autoBlink', '自动眨眼');

        // 启动
        log('系统启动，眼球追踪已激活');
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
