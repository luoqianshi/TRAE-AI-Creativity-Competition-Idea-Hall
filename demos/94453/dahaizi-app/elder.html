<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>大孩子使用指南</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .phone-frame {
      width: 375px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 82% 5%, rgba(255,255,255,0.72) 0, rgba(255,255,255,0.2) 83px, transparent 146px),
        linear-gradient(180deg, #eaf6ff 0%, #f7fbff 52%, #edf7ff 100%);
      color: #092d70;
      padding-bottom: calc(43px + env(safe-area-inset-bottom));
    }
    .phone-frame.is-embedded {
      width: 100%;
      height: 100vh;
      min-height: 0;
      overflow: hidden;
      padding-bottom: 0;
    }
    .phone-frame.is-embedded .elder-status {
      display: none;
    }

    .elder-screen {
      position: relative;
      width: 375px;
      min-height: 665.5px;
      margin: 0 auto;
      overflow: hidden;
      padding: 0 14px 28px;
    }
    .elder-top-bg {
      position: absolute;
      top: 0; left: 0;
      z-index: 0;
      display: block;
      width: 375px;
      pointer-events: none;
    }

    /* 状态栏 */
    .elder-status {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 34px;
      padding: 0 6px;
      color: #000000;
      font-size: 13.5px;
      font-weight: 900;
      line-height: 1;
    }
    .status-icons { display: flex; align-items: center; }
    .status-icon { display: block; filter: brightness(0); }
    .signal-icon { width: 18px; height: 13px; }
    .wifi-icon { width: 15.5px; height: 13px; margin-left: 6px; }
    .battery-icon { width: 19.5px; height: 12.5px; margin-left: 6px; }

    /* 标题区 */
    .elder-hero {
      position: relative;
      z-index: 1;
      height: 162.5px;
    }
    .elder-brand {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      padding-top: 9px;
    }
    .elder-brand-icon { width: 31px; height: 31px; flex-shrink: 0; }
    .elder-brand-title {
      margin-left: 8px;
      color: #0b4196;
      font-size: 19.5px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 2px 5px rgba(21,79,157,0.12);
      white-space: nowrap;
    }
    .hero-title {
      position: relative;
      z-index: 3;
      margin-top: 36px;
      color: #0a3d8f;
      font-size: 33.5px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 2.5px 6px rgba(15,75,160,0.12);
    }
    .hero-count {
      color: #ff9144;
      font-size: 38px;
      text-shadow: 0 3.5px 6.5px rgba(255,145,68,0.24);
    }
    .summary-pill {
      display: flex;
      align-items: center;
      height: 36.5px;
      margin-top: 14px;
      padding: 0 14px;
      border: 0.5px solid rgba(204,225,247,0.92);
      border-radius: 999px;
      background: rgba(255,255,255,0.56);
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.98), 0 4px 10px rgba(94,141,198,0.08);
    }
    .summary-heart {
      width: 20.5px; height: 20.5px;
      flex-shrink: 0;
      filter: invert(50%) sepia(91%) saturate(1591%) hue-rotate(198deg) brightness(104%) contrast(101%) drop-shadow(0 2.5px 4.5px rgba(39,107,217,0.22));
    }
    .summary-text {
      margin-left: 12px;
      color: #0b398a;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    /* 任务卡片 */
    .task-list {
      position: relative;
      z-index: 1;
      margin-top: 12.5px;
    }
    .task-card {
      position: relative;
      display: flex;
      align-items: center;
      height: 134px;
      margin-top: 6px;
      padding: 10.5px 11px 10.5px 12px;
      overflow: hidden;
      border: 0.5px solid rgba(221,235,249,0.9);
      border-radius: 19px;
      background:
        radial-gradient(circle at 92% 9%, rgba(227,241,255,0.72) 0, rgba(227,241,255,0.26) 35px, transparent 58px),
        linear-gradient(180deg, rgba(255,255,255,0.98), rgba(254,254,255,0.92));
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.96), 0 6px 13px rgba(77,124,178,0.16);
    }
    .task-card:first-child { margin-top: 0; }
    .task-card-outing { height: 128.5px; }
    .task-card-contact { height: 109.5px; }
    .task-card.is-complete {
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.96), 0 6px 13px rgba(60,130,216,0.18);
    }
    .task-art-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 97px;
      height: 100%;
      flex-shrink: 0;
    }
    .task-art-orb {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 96.5px;
      height: 96.5px;
      border-radius: 50%;
      background: linear-gradient(145deg, #e8f5ff, #dcefff);
      box-shadow: inset 0 1px 3.5px rgba(255,255,255,0.92);
    }
    .task-card-contact .task-art-wrap { width: 97px; }
    .task-card-contact .task-art-orb { width: 85px; height: 85px; }
    .task-card-contact .task-content { justify-content: flex-start; padding: 6px 0 3px 12px; }
    .task-card-contact .task-action-row.no-copy-action { bottom: 2px; }
    .task-art {
      display: block;
      filter: drop-shadow(0 6.5px 9px rgba(55,104,171,0.18));
    }
    .task-art-medicine { width: 92px; height: 85px; }
    .task-art-outing { width: 98px; height: 95px; }
    .task-art-contact { width: 81.5px; height: 77.5px; }
    .art-check {
      position: absolute;
      right: 6px; bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30.5px;
      height: 30.5px;
      border: 2.5px solid rgba(255,255,255,0.92);
      border-radius: 50%;
      background: linear-gradient(145deg, #7bb8ff, #2f79ec);
      box-shadow: 0 3.5px 7px rgba(48,116,217,0.24);
    }
    .art-check-icon { width: 16.5px; height: 16.5px; filter: brightness(0) invert(1); }

    .task-content {
      position: relative;
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      height: 100%;
      padding: 4.5px 117.5px 3px 12px;
    }
    .task-number {
      position: absolute;
      top: 8px; right: 1.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32.5px;
      height: 32.5px;
      border-radius: 50%;
      background: #e2f1ff;
      color: #2568dc;
      font-size: 17px;
      font-weight: 900;
      line-height: 1;
    }
    .task-title {
      color: #083b8d;
      font-size: 28px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 2.5px 5px rgba(24,77,150,0.11);
    }
    .task-dash {
      width: 68px;
      margin-top: 11px;
      border-top: 1.5px dashed #c2dcfb;
    }
    .task-copy {
      width: auto;
      margin-top: 11.5px;
      color: #071d38;
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.52;
      white-space: pre-line;
    }
    .task-action-row {
      position: absolute;
      right: 0; bottom: 12.5px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .task-action-row.no-copy-action { right: 1px; bottom: 13.5px; }
    .task-button {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 49px;
      min-width: 121.5px;
      padding: 0 14px;
      border-radius: 15px;
      font-size: 16px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      border: none;
      outline: none;
    }
    .tone-primary {
      color: #ffffff;
      background: linear-gradient(180deg, #73b4ff 0%, #2f79ed 100%);
      box-shadow: 0 6.5px 10px rgba(36,109,223,0.26);
    }
    .tone-soft {
      min-width: 122.5px;
      color: #2e70e4;
      background: linear-gradient(180deg, #eef7ff 0%, #dbecff 100%);
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.96), 0 4px 8px rgba(90,137,196,0.1);
    }
    .task-button.is-complete {
      color: #ffffff;
      background: linear-gradient(180deg, #7abbff 0%, #347fee 100%);
    }
    .tone-call {
      min-width: 178.5px;
      height: 44px;
      color: #ffffff;
      border-radius: 14.5px;
      background: linear-gradient(180deg, #ffad64 0%, #ff7d38 100%);
      box-shadow: 0 6px 10px rgba(255,126,56,0.24);
      font-size: 15px;
    }
    .call-icon { width: 21.5px; height: 21.5px; margin-right: 10px; filter: brightness(0) invert(1); }

    /* 安慰卡片 */
    .comfort-card {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      height: 63px;
      margin-top: 6px;
      padding: 0 16px 0 28px;
      border: 0.5px solid rgba(221,235,249,0.92);
      border-radius: 14px;
      background:
        radial-gradient(circle at 89% 46%, rgba(230,244,255,0.86) 0, rgba(230,244,255,0.2) 38px, transparent 61px),
        linear-gradient(180deg, rgba(255,255,255,0.95), rgba(253,254,255,0.86));
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.96), 0 5.5px 11px rgba(77,124,178,0.13);
    }
    .comfort-face-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 49px;
      height: 49px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.95), 0 3.5px 7.5px rgba(64,112,178,0.16);
    }
    .comfort-face { width: 43px; height: 43px; }
    .comfort-copy { flex: 1; min-width: 0; margin-left: 24px; }
    .comfort-title {
      color: #0a3b8d;
      font-size: 19.5px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }
    .comfort-text {
      margin-top: 10px;
      color: #0a3986;
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }
    .comfort-heart {
      width: 25.5px; height: 25.5px;
      margin-left: 9px;
      flex-shrink: 0;
      filter: invert(50%) sepia(91%) saturate(1591%) hue-rotate(198deg) brightness(104%) contrast(101%) drop-shadow(0 3px 5px rgba(39,107,217,0.19));
    }

    /* 底部 Tabbar */
    .bottom-tabbar {
      position: fixed;
      left: 50%; bottom: 0;
      z-index: 20;
      width: 375px;
      height: calc(43px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      transform: translateX(-50%);
      border-radius: 14px 14px 0 0;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 -6px 14px rgba(57,91,124,0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    @media (max-width: 390px) {
      .bottom-tabbar {
        display: none;
      }
    }
    .tabbar-inner { display: flex; align-items: center; height: 43px; }
    .tabbar-slot {
      display: flex; flex: 1; flex-direction: column;
      align-items: center; justify-content: center;
      height: 43px;
      color: #9aa3ad;
      font-size: 6px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      text-decoration: none;
    }
    .tabbar-icon { width: 12.5px; height: 12.5px; }
    .tabbar-label { margin-top: 3.5px; white-space: nowrap; }
    .tabbar-slot.is-active { color: #2d7df1; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="elder-screen">
      <img class="elder-top-bg" src="./assets/hugong.webp" alt="bg" />

      <div class="elder-status">
        <div class="status-time">9:41</div>
        <div class="status-icons">
          <img class="status-icon signal-icon" src="./assets/antenna-bars-5.svg" alt="signal" />
          <img class="status-icon wifi-icon" src="./assets/wifi.svg" alt="wifi" />
          <img class="status-icon battery-icon" src="./assets/battery-4.svg" alt="battery" />
        </div>
      </div>

      <div class="elder-hero">
        <div class="elder-brand">
          <img class="elder-brand-icon" src="./assets/leaf-mark.svg" alt="leaf" />
          <div class="elder-brand-title">大孩子使用指南</div>
        </div>

        <div class="hero-title">
          <span>今天主要记住 </span>
          <span class="hero-count" id="taskCount">3</span>
          <span> 件事</span>
        </div>

        <div class="summary-pill">
          <img class="summary-heart" src="./assets/heart-filled.svg" alt="heart" />
          <div class="summary-text" id="summaryText">早饭后吃药， 下午去复诊， 出门带医保卡。</div>
        </div>
      </div>

      <div class="task-list" id="taskList">
        <!-- Task 1: Medicine -->
        <div class="task-card task-card-medicine" data-id="medicine">
          <div class="task-art-wrap">
            <div class="task-art-orb">
              <img class="task-art task-art-medicine" src="./assets/elder-pill-cutout.webp" alt="pill" />
            </div>
            <div class="art-check" id="check-medicine" style="display:none;">
              <img class="art-check-icon" src="./assets/check.svg" alt="check" />
            </div>
          </div>
          <div class="task-content">
            <div class="task-number">1</div>
            <div class="task-title">吃药</div>
            <div class="task-dash"></div>
            <div class="task-copy">早饭后 1 片</div>
            <div class="task-action-row">
              <button class="task-button tone-primary" id="btn-medicine" onclick="toggleTask('medicine')">我吃过了</button>
            </div>
          </div>
        </div>

        <!-- Task 2: Outing -->
        <div class="task-card task-card-outing" data-id="outing">
          <div class="task-art-wrap">
            <div class="task-art-orb">
              <img class="task-art task-art-outing" src="./assets/elder-keys-cutout.webp" alt="keys" />
            </div>
            <div class="art-check" id="check-outing" style="display:none;">
              <img class="art-check-icon" src="./assets/check.svg" alt="check" />
            </div>
          </div>
          <div class="task-content">
            <div class="task-number">2</div>
            <div class="task-title">出门</div>
            <div class="task-dash"></div>
            <div class="task-copy">钥匙、手机、医保卡、药</div>
            <div class="task-action-row">
              <button class="task-button tone-soft" id="btn-outing" onclick="toggleTask('outing')">我带齐了</button>
            </div>
          </div>
        </div>

        <!-- Task 3: Contact -->
        <div class="task-card task-card-contact" data-id="contact">
          <div class="task-art-wrap">
            <div class="task-art-orb">
              <img class="task-art task-art-contact" src="./assets/elder-phone-cutout.webp" alt="phone" />
            </div>
          </div>
          <div class="task-content">
            <div class="task-number">3</div>
            <div class="task-title">有事</div>
            <div class="task-action-row no-copy-action">
              <button class="task-button tone-call" onclick="callDaughter()">
                <img class="call-icon" src="./assets/phone-call.svg" alt="call" />
                <span>一键联系女儿</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="comfort-card">
        <div class="comfort-face-wrap">
          <img class="comfort-face" src="./assets/elder-smile-cutout.webp" alt="smile" />
        </div>
        <div class="comfort-copy">
          <div class="comfort-title">今天不用担心</div>
          <div class="comfort-text" id="comfortText">没有新的检查， 没有陌生人上门。</div>
        </div>
        <img class="comfort-heart" src="./assets/heart-filled.svg" alt="heart" />
      </div>
    </div>

    <!-- Bottom Tabbar -->
    <div class="bottom-tabbar">
      <div class="tabbar-inner">
        <a href="./index.html" class="tabbar-slot">
          <img class="icon tabbar-icon" src="./assets/home.svg" alt="home" />
          <div class="tabbar-label">首页</div>
        </a>
        <a href="./caregiver.html" class="tabbar-slot">
          <img class="icon tabbar-icon" src="./assets/book.svg" alt="book" />
          <div class="tabbar-label">说明书</div>
        </a>
        <a href="./elder.html" class="tabbar-slot is-active">
          <img class="icon tabbar-icon" src="./assets/bell.svg" alt="bell" />
          <div class="tabbar-label">提醒</div>
        </a>
        <a href="./caregiver.html" class="tabbar-slot">
          <img class="icon tabbar-icon" src="./assets/users.svg" alt="users" />
          <div class="tabbar-label">协同</div>
        </a>
        <a href="./elder.html" class="tabbar-slot">
          <img class="icon tabbar-icon" src="./assets/user.svg" alt="user" />
          <div class="tabbar-label">我的</div>
        </a>
      </div>
    </div>
  </div>

  <script>
    if (window.self !== window.top) {
      document.querySelector('.phone-frame').classList.add('is-embedded');
    }
    const daughterPhoneNumber = '13800138000';
    const tasks = {
      medicine: { completed: false, elId: 'btn-medicine', checkId: 'check-medicine', cardSelector: '.task-card-medicine', actionLabel: '我吃过了', doneLabel: '已经记下', tone: 'tone-primary' },
      outing: { completed: false, elId: 'btn-outing', checkId: 'check-outing', cardSelector: '.task-card-outing', actionLabel: '我带齐了', doneLabel: '都带好了', tone: 'tone-soft' }
    };

    function toggleTask(taskId) {
      const task = tasks[taskId];
      if (!task) return;
      task.completed = !task.completed;

      const btn = document.getElementById(task.elId);
      const check = document.getElementById(task.checkId);
      const card = document.querySelector(task.cardSelector);

      if (task.completed) {
        btn.textContent = task.doneLabel;
        btn.classList.add('is-complete');
        if (taskId === 'outing') btn.classList.remove('tone-soft');
        check.style.display = 'flex';
        card.classList.add('is-complete');
      } else {
        btn.textContent = task.actionLabel;
        btn.classList.remove('is-complete');
        if (taskId === 'outing') btn.classList.add('tone-soft');
        check.style.display = 'none';
        card.classList.remove('is-complete');
      }

      updateComfortText();
    }

    function isTaskComplete(taskId) {
      return tasks[taskId] ? tasks[taskId].completed : false;
    }

    function updateComfortText() {
      const text = document.getElementById('comfortText');
      if (isTaskComplete('medicine') && isTaskComplete('outing')) {
        text.textContent = '今天交代都记下了，出门慢一点也没关系。';
      } else {
        text.textContent = '没有新的检查， 没有陌生人上门。';
      }
    }

    function callDaughter() {
      window.location.href = 'tel:' + daughterPhoneNumber;
    }
  </script>
</body>
</html>
