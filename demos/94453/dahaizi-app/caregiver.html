<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今日交接卡</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .phone-frame {
      width: 375px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 78% 2%, rgba(225,241,255,0.58) 0, rgba(225,241,255,0.12) 105px, transparent 165px),
        linear-gradient(180deg, #f5fbff 0%, #fbfdff 100%);
      color: #082c70;
      padding-bottom: calc(43px + env(safe-area-inset-bottom));
    }
    .phone-frame.is-embedded {
      width: 100%;
      height: 100vh;
      min-height: 0;
      overflow: hidden;
      padding-bottom: 0;
    }

    .caregiver-screen {
      position: relative;
      width: 375px;
      min-height: 667px;
      margin: 0 auto;
      overflow: hidden;
      padding: 0 14px 17px;
    }

    /* ===== Hero ===== */
    .caregiver-hero {
      position: relative;
      height: 179px;
      margin: 0 -14px;
      padding: 17px 19px 0;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      z-index: 0;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .hero-fade {
      position: absolute;
      z-index: 1;
      left: 0; right: 0; bottom: -0.5px;
      height: 64px;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(239,248,255,0) 0%, rgba(246,251,255,0.72) 58%, #fbfdff 100%);
    }
    .brand-row {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      padding-left: 5px;
    }
    .brand-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 27px;
      height: 27px;
      border-radius: 9px;
      background: linear-gradient(145deg, #7bb7ff, #2e7af2);
      box-shadow: 0 5px 9px rgba(46,122,242,0.22);
    }
    .brand-icon { width: 18px; height: 18px; }
    .brand-name {
      margin-left: 9px;
      color: #0a3776;
      font-size: 17.5px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 2px 5px rgba(29,92,177,0.12);
    }
    .hero-title {
      position: relative;
      z-index: 3;
      margin-top: 18px;
      padding-left: 6px;
      color: #07327f;
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 3px 6.5px rgba(20,82,169,0.16);
    }
    .hero-subtitle {
      position: relative;
      z-index: 3;
      margin-top: 10px;
      padding-left: 6px;
      color: #0b327a;
      font-size: 15.5px;
      font-weight: 500;
      line-height: 1;
    }
    .update-row {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      margin-top: 14px;
      padding-left: 7px;
    }
    .avatar-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(145deg, #ffe3c1, #ffd096);
      box-shadow: 0 2.5px 5.5px rgba(123,89,37,0.12);
    }
    .avatar-icon { width: 100%; height: 100%; object-fit: cover; }
    .update-copy {
      margin-left: 6.5px;
      color: #16458f;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }

    /* ===== Cards ===== */
    .guide-card, .todo-card, .reminder-card {
      border: 0.5px solid rgba(221,234,247,0.86);
      box-sizing: border-box;
    }
    .guide-card {
      position: relative;
      z-index: 2;
      margin-top: -4px;
      padding: 9px 12px;
      border-radius: 17px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.92));
      box-shadow: 0 6px 14px rgba(74,118,168,0.16);
    }
    .section-heading { display: flex; align-items: center; }
    .section-icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 23px;
      height: 23px;
      flex-shrink: 0;
    }
    .section-icon-blue {
      border-radius: 6px;
      background: linear-gradient(145deg, #78b7ff, #2f7fec);
      box-shadow: 0 4px 8px rgba(49,121,223,0.22);
    }
    .section-icon-round {
      border-radius: 50%;
      background: linear-gradient(145deg, #77b7ff, #2f80f0);
      box-shadow: 0 4px 8px rgba(49,121,223,0.22);
    }
    .section-icon-image { width: 14.5px; height: 14.5px; }
    .section-title {
      margin-left: 7px;
      color: #082c70;
      font-size: 17.5px;
      font-weight: 900;
      line-height: 1;
    }

    /* Summary Strip */
    .summary-strip {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: stretch;
      min-height: 77px;
    }
    .summary-item {
      position: relative;
      display: flex;
      flex-direction: column;
      flex: 1;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: 4px 4px 2px;
    }
    .summary-divider::before {
      content: '';
      position: absolute;
      left: 0; top: 10px;
      width: 0.5px; height: 56px;
      background: rgba(188,203,223,0.9);
    }
    .summary-orb {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 29px;
      height: 29px;
      flex-shrink: 0;
    }
    .summary-orb-soft {
      border: 0.5px solid rgba(223,235,250,0.98);
      border-radius: 9px;
      background: linear-gradient(180deg, #ffffff, #e6f2ff);
      box-shadow: 0 4px 9px rgba(70,119,176,0.1);
    }
    .summary-orb-blue, .summary-orb-orange { border-radius: 50%; }
    .summary-orb-blue {
      background: linear-gradient(145deg, #78b7ff, #2f80f0);
      box-shadow: 0 4.5px 9px rgba(49,121,223,0.2);
    }
    .summary-orb-orange {
      background: linear-gradient(145deg, #ffbd65, #ff8732);
      box-shadow: 0 4.5px 9px rgba(235,123,43,0.2);
    }
    .summary-icon { width: 16px; height: 16px; }
    .summary-copy { min-width: 0; margin-top: 7px; text-align: center; }
    .summary-label {
      color: #082c70;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }
    .summary-value {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-top: 5.5px;
      color: #082c70;
      line-height: 1;
      white-space: nowrap;
    }
    .summary-number { font-size: 29px; font-weight: 900; }
    .summary-number-blue { color: #2f80f0; }
    .summary-number-orange { color: #ff8532; }
    .summary-unit { margin-left: 3.5px; padding-bottom: 3.5px; font-size: 12.5px; font-weight: 800; }

    /* Todo Card */
    .todo-card {
      position: relative;
      z-index: 2;
      margin-top: 7px;
      padding: 10.5px 11px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.91);
      box-shadow: 0 6px 14px rgba(74,118,168,0.16);
    }
    .todo-heading { margin-bottom: 9px; }
    .todo-title { font-size: 19px; }
    .task-panel {
      position: relative;
      z-index: 2;
      overflow: hidden;
      border: 0.5px solid rgba(197,218,238,0.86);
      border-radius: 10.5px;
      background: rgba(255,255,255,0.82);
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.88);
    }
    .task-row {
      display: flex;
      align-items: center;
      height: 34px;
      padding: 0 9px;
      border-bottom: 0.5px solid rgba(206,221,235,0.82);
      box-sizing: border-box;
      cursor: pointer;
    }
    .task-row:last-child { border-bottom: 0; }
    .task-main-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22.5px;
      height: 22.5px;
      border-radius: 6.5px;
      flex-shrink: 0;
    }
    .task-icon-done {
      border-radius: 50%;
      background: linear-gradient(145deg, #8be4a1, #2fb650);
      box-shadow: 0 3px 6px rgba(46,174,75,0.22);
    }
    .task-icon-confirm {
      background: linear-gradient(145deg, #cfe4ff, #7db8ff);
      box-shadow: 0 3px 6px rgba(53,126,229,0.14);
    }
    .task-icon-priority {
      background: linear-gradient(145deg, #ffbd65, #ff8732);
      box-shadow: 0 3px 6px rgba(235,123,43,0.18);
    }
    .task-icon-idle {
      background: linear-gradient(145deg, #d8eaff, #86bbff);
      box-shadow: 0 3px 6px rgba(53,126,229,0.14);
    }
    .task-main-image { width: 14.5px; height: 14.5px; }
    .task-time {
      width: 41px;
      margin-left: 11px;
      color: #2677f1;
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1;
    }
    .task-separator {
      width: 0.5px;
      height: 19px;
      margin: 0 13px 0 4px;
      border-left: 1px dashed #b9c8e4;
    }
    .task-name {
      flex: 1;
      min-width: 0;
      color: #082c70;
      font-size: 15px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }
    .task-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 59px;
      height: 19px;
      padding: 0 7px;
      border-radius: 999px;
      box-sizing: border-box;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
    }
    .task-badge-icon { width: 12px; height: 12px; margin-left: 5px; }
    .badge-done { color: #2a9f4d; background: #e6f6ea; }
    .badge-confirm { color: #1e72e8; background: #e8f2ff; }
    .badge-priority { color: #f26e1d; background: #fff0e2; }
    .badge-idle { color: #536377; background: #eef2f7; }

    /* Reminder Card */
    .reminder-card {
      position: relative;
      min-height: 127px;
      margin-top: 7px;
      padding: 11.5px 0 10px 15px;
      border-radius: 14.5px;
      overflow: hidden;
      background: rgba(255,255,255,0.88);
      box-shadow: 0 6px 14px rgba(74,118,168,0.16);
    }
    .reminder-copy { position: relative; z-index: 2; width: 220px; }
    .reminder-heading { margin-bottom: 9px; }
    .reminder-list { padding-left: 0.5px; }
    .reminder-row { display: flex; align-items: center; height: 21.5px; }
    .reminder-dot {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(145deg, #78b7ff, #2f80f0);
      box-shadow: 0 2.5px 5px rgba(50,126,228,0.18);
    }
    .reminder-dot-icon { width: 10.5px; height: 10.5px; }
    .reminder-text {
      margin-left: 8px;
      padding-bottom: 3px;
      border-bottom: 0.5px dashed rgba(181,204,229,0.9);
      color: #082c70;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
    }
    .reminder-plant {
      position: absolute;
      right: 7px; bottom: 3.5px;
      z-index: 1;
      width: 108px;
      height: 111px;
    }

    /* Action Grid */
    .action-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-top: 9.5px;
      padding: 0 2px;
    }
    .action-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 168px;
      height: 45px;
      margin-bottom: 8.5px;
      border-radius: 13px;
      box-sizing: border-box;
      font-size: 16.5px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      border: none;
      outline: none;
    }
    .action-icon { width: 22.5px; height: 22.5px; margin-right: 11px; }
    .action-primary {
      color: #ffffff;
      background: linear-gradient(180deg, #62a8ff, #267df0);
      box-shadow: 0 6px 11px rgba(39,125,240,0.28);
    }
    .action-primary.is-active {
      background: linear-gradient(180deg, #58c46e, #25a948);
      box-shadow: 0 6px 11px rgba(37,169,72,0.22);
    }
    .action-warning {
      color: #ffffff;
      background: linear-gradient(180deg, #ffa74f, #ff7c25);
      box-shadow: 0 6px 11px rgba(241,117,31,0.24);
    }
    .action-light {
      color: #2f80f0;
      background: rgba(249,252,255,0.97);
      box-shadow: 0 5px 10px rgba(68,119,172,0.12), inset 0 0.5px 0 rgba(255,255,255,0.92);
    }

    /* Bottom Tabbar */
    .bottom-tabbar {
      position: fixed;
      left: 50%; bottom: 0;
      z-index: 20;
      width: 375px;
      height: calc(43px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      transform: translateX(-50%);
      border-radius: 14px 14px 0 0;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 -6px 14px rgba(57,91,124,0.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    @media (max-width: 390px) {
      .bottom-tabbar {
        display: none;
      }
    }
    .tabbar-inner { display: flex; align-items: center; height: 43px; }
    .tabbar-slot {
      display: flex; flex: 1; flex-direction: column;
      align-items: center; justify-content: center;
      height: 43px;
      color: #9aa3ad;
      font-size: 6px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      text-decoration: none;
    }
    .tabbar-icon { width: 12.5px; height: 12.5px; }
    .tabbar-label { margin-top: 3.5px; white-space: nowrap; }
    .tabbar-slot.is-active { color: #2d7df1; }

    /* Icon filters */
    .icon-white { filter: brightness(0) invert(1); }
    .icon-blue, .badge-icon-blue {
      filter: invert(40%) sepia(96%) saturate(1811%) hue-rotate(201deg) brightness(98%) contrast(93%);
    }
    .action-blue-icon {
      filter: brightness(0) saturate(100%) invert(44%) sepia(88%) saturate(1854%) hue-rotate(199deg) brightness(98%) contrast(92%);
    }
    .badge-icon-success {
      filter: invert(46%) sepia(91%) saturate(420%) hue-rotate(83deg) brightness(91%) contrast(88%);
    }
    .badge-icon-orange {
      filter: invert(57%) sepia(96%) saturate(1661%) hue-rotate(348deg) brightness(101%) contrast(91%);
    }
    .badge-icon-gray {
      filter: invert(38%) sepia(15%) saturate(711%) hue-rotate(173deg) brightness(94%) contrast(86%);
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="caregiver-screen">
      <div class="caregiver-hero">
        <img class="hero-bg" src="./assets/caregiver-hero-bg-v1.webp" alt="hero" />
        <div class="hero-fade"></div>

        <div class="brand-row">
          <div class="brand-mark">
            <img class="brand-icon icon-white" src="./assets/leaf-2.svg" alt="leaf" />
          </div>
          <div class="brand-name">大孩子使用指南</div>
        </div>

        <div class="hero-title">今日交接卡</div>
        <div class="hero-subtitle">张奶奶 · 今天由你照顾</div>

        <div class="update-row">
          <div class="avatar-badge">
            <img class="avatar-icon" src="./assets/family-avatar-main.png" alt="avatar" />
          </div>
          <div class="update-copy">来自女儿更新 · 5 分钟前</div>
        </div>
      </div>

      <div class="guide-card">
        <div class="summary-strip">
          <div class="summary-item">
            <div class="summary-orb summary-orb-soft">
              <img class="summary-icon icon-blue" src="./assets/clipboard-check.svg" alt="check" />
            </div>
            <div class="summary-copy">
              <div class="summary-label">今天要做</div>
              <div class="summary-value">
                <span class="summary-number summary-number-blue" id="summaryCount">4</span>
                <span class="summary-unit">件事</span>
              </div>
            </div>
          </div>
          <div class="summary-item summary-divider">
            <div class="summary-orb summary-orb-orange">
              <img class="summary-icon icon-white" src="./assets/star.svg" alt="star" />
            </div>
            <div class="summary-copy">
              <div class="summary-label">高优先级</div>
              <div class="summary-value">
                <span class="summary-number summary-number-orange" id="priorityCount">1</span>
                <span class="summary-unit">件</span>
              </div>
            </div>
          </div>
          <div class="summary-item summary-divider">
            <div class="summary-orb summary-orb-blue">
              <img class="summary-icon icon-white" src="./assets/clock.svg" alt="clock" />
            </div>
            <div class="summary-copy">
              <div class="summary-label">预计</div>
              <div class="summary-value">
                <span class="summary-number summary-number-blue">35</span>
                <span class="summary-unit">分钟</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="todo-card">
        <div class="section-heading todo-heading">
          <div class="section-icon-wrap section-icon-blue">
            <img class="section-icon-image icon-white" src="./assets/clipboard-list.svg" alt="list" />
          </div>
          <div class="section-title todo-title">今天要做</div>
        </div>

        <div class="task-panel" id="taskPanel">
          <div class="task-row task-done" data-key="medicine">
            <div class="task-main-icon task-icon-done">
              <img class="task-main-image icon-white" src="./assets/check.svg" alt="check" />
            </div>
            <div class="task-time">08:00</div>
            <div class="task-separator"></div>
            <div class="task-name">早饭后服药</div>
            <div class="task-badge badge-done">
              <span class="task-badge-text">已完成</span>
              <img class="task-badge-icon badge-icon-success" src="./assets/check.svg" alt="check" />
            </div>
          </div>
          <div class="task-row task-confirm" data-key="pressure" onclick="handleTaskTap('pressure')">
            <div class="task-main-icon task-icon-confirm">
              <img class="task-main-image icon-blue" src="./assets/device-mobile.svg" alt="mobile" />
            </div>
            <div class="task-time">10:30</div>
            <div class="task-separator"></div>
            <div class="task-name">量血压</div>
            <div class="task-badge badge-confirm">
              <span class="task-badge-text">待确认</span>
              <img class="task-badge-icon badge-icon-blue" src="./assets/chevron-right.svg" alt="chevron" />
            </div>
          </div>
          <div class="task-row task-priority" data-key="hospital" onclick="handleTaskTap('hospital')">
            <div class="task-main-icon task-icon-priority">
              <img class="task-main-image icon-white" src="./assets/building-hospital.svg" alt="hospital" />
            </div>
            <div class="task-time">15:00</div>
            <div class="task-separator"></div>
            <div class="task-name">去医院复诊</div>
            <div class="task-badge badge-priority">
              <span class="task-badge-text">高优先级</span>
              <img class="task-badge-icon badge-icon-orange" src="./assets/star.svg" alt="star" />
            </div>
          </div>
          <div class="task-row task-idle" data-key="window" onclick="handleTaskTap('window')">
            <div class="task-main-icon task-icon-idle">
              <img class="task-main-image icon-blue" src="./assets/window.svg" alt="window" />
            </div>
            <div class="task-time">睡前</div>
            <div class="task-separator"></div>
            <div class="task-name">确认门窗燃气</div>
            <div class="task-badge badge-idle">
              <span class="task-badge-text">未开始</span>
              <img class="task-badge-icon badge-icon-gray" src="./assets/circle.svg" alt="circle" />
            </div>
          </div>
        </div>
      </div>

      <div class="reminder-card">
        <div class="reminder-copy">
          <div class="section-heading reminder-heading">
            <div class="section-icon-wrap section-icon-round">
              <img class="section-icon-image icon-white" src="./assets/alert-triangle.svg" alt="alert" />
            </div>
            <div class="section-title">不能漏提醒</div>
          </div>
          <div class="reminder-list">
            <div class="reminder-row">
              <div class="reminder-dot">
                <img class="reminder-dot-icon icon-white" src="./assets/alert-triangle.svg" alt="alert" />
              </div>
              <div class="reminder-text">空腹查血，早上不要吃饭</div>
            </div>
            <div class="reminder-row">
              <div class="reminder-dot">
                <img class="reminder-dot-icon icon-white" src="./assets/alert-triangle.svg" alt="alert" />
              </div>
              <div class="reminder-text">医保卡在门口抽屉</div>
            </div>
            <div class="reminder-row">
              <div class="reminder-dot">
                <img class="reminder-dot-icon icon-white" src="./assets/alert-triangle.svg" alt="alert" />
              </div>
              <div class="reminder-text">最近对头孢过敏，勿自行购买</div>
            </div>
            <div class="reminder-row">
              <div class="reminder-dot">

        <button class="action-button action-primary" id="takeOverBtn" onclick="takeOver()">
          <img class="action-icon icon-white" src="./assets/heart-handshake.svg" alt="handshake" />
          <span id="takeOverText">我已接手</span>
        </button>
        <button class="action-button action-warning" onclick="reportIssue()">
          <img class="action-icon icon-white" src="./assets/alert-triangle.svg" alt="alert" />
          <span>发现异常</span>
        </button>
        <button class="action-button action-light" onclick="contactDaughter()">
          <img class="action-icon action-blue-icon" src="./assets/phone-call.svg" alt="phone" />
          <span>联系女儿</span>
        </button>
        <button class="action-button action-light" onclick="photoFeedback()">

          <div class="tabbar-label">说明书</div>

          <img class="icon tabbar-icon" src="./assets/bell.svg" alt="bell" />
          <div class="tabbar-label">提醒</div>

  <script>
    if (window.self !== window.top) {
      document.querySelector('.phone-frame').classList.add('is-embedded');
    }
    let hasTakenOver = false;
    const daughterPhone = '13800138000';
    let estimatedMinutes = 35;

    const tasks = [
      { key: 'medicine', type: 'done', time: '08:00', title: '早饭后服药', badge: '已完成' },
      { key: 'pressure', type: 'confirm', time: '10:30', title: '量血压', badge: '待确认' },
      { key: 'hospital', type: 'priority', time: '15:00', title: '去医院复诊', badge: '高优先级' },
      { key: 'window', type: 'idle', time: '睡前', title: '确认门窗燃气', badge: '未开始' }
    ];

    function completedCount() {
      return tasks.filter(t => t.type === 'done').length;
    }
    function highPriorityCount() {
      return tasks.filter(t => t.type === 'priority').length;
    }

    function handleTaskTap(key) {
      const task = tasks.find(t => t.key === key);
      if (!task) return;

      if (task.type === 'confirm') {
        if (confirm('已经完成 10:30 量血压了吗？')) {
          completeTask(task, '已确认量血压');
        }
        return;
      }
      if (task.type === 'priority') {
        alert('15:00 去医院复诊，记得带医保卡和近期检查资料。');
        return;
      }
      if (task.type === 'idle') {
        alert('睡前再确认');
      }
    }

    function completeTask(task, toastTitle) {
      task.type = 'done';
      task.badge = '已完成';
      // Re-render the task row
      const row = document.querySelector('.task-row[data-key="' + task.key + '"]');
      if (row) {
        row.className = 'task-row task-done';
        row.onclick = null;
        const iconWrap = row.querySelector('.task-main-icon');
        iconWrap.className = 'task-main-icon task-icon-done';
        const img = iconWrap.querySelector('img');
        img.src = './assets/check.svg';
        img.className = 'task-main-image icon-white';
        const badge = row.querySelector('.task-badge');
        badge.className = 'task-badge badge-done';
        badge.innerHTML = '<span class="task-badge-text">已完成</span><img class="task-badge-icon badge-icon-success" src="./assets/check.svg" alt="check" />';
      }
      document.getElementById('summaryCount').textContent = tasks.length;
      document.getElementById('priorityCount').textContent = highPriorityCount();
      alert(toastTitle);
    }

    function takeOver() {
      if (hasTakenOver) {
        alert('已接手，无需重复');
        return;
      }
      hasTakenOver = true;
      const btn = document.getElementById('takeOverBtn');
      const txt = document.getElementById('takeOverText');
      btn.classList.add('is-active');
      txt.textContent = '已接手';
      alert('已通知女儿');
    }

    function reportIssue() {
      if (confirm('是否立即记录异常并通知女儿？')) {
        alert('已通知女儿');
      }
    }

    function contactDaughter() {
      window.location.href = 'tel:' + daughterPhone;
    }

    function photoFeedback() {
      alert('拍照反馈（浏览器环境模拟）');
    }
  </script>
</body>
