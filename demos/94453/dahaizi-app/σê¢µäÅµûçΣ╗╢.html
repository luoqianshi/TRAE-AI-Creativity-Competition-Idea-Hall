<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRAE AI 创作力大赛 《你好，大朋友》</title>
  <link rel="icon" href="./assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/trae-favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/trae-touch-icon-180.png" />
  <style>
    :root {
      --ink: #17325f;
      --muted: #5d7396;
      --line: rgba(116, 150, 192, 0.24);
      --blue: #2f7ff0;
      --blue-soft: #e8f3ff;
      --orange: #f59f43;
      --cream: #fffaf1;
      --paper: rgba(255, 255, 255, 0.88);
      --shadow: 0 24px 70px rgba(35, 81, 132, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 12%, rgba(255, 255, 255, 0.92) 0, rgba(255, 255, 255, 0.42) 180px, transparent 330px),
        radial-gradient(circle at 88% 8%, rgba(255, 234, 194, 0.6) 0, rgba(255, 234, 194, 0.2) 220px, transparent 430px),
        linear-gradient(135deg, #eaf6ff 0%, #f9fcff 46%, #fff7ea 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(48, 96, 150, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(48, 96, 150, 0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.88), transparent 88%);
      z-index: 0;
    }

    .vcr {
      position: relative;
      display: grid;
      grid-template-columns: minmax(420px, 0.9fr) minmax(520px, 1.1fr);
      gap: clamp(24px, 3vw, 60px);
      width: 100%;
      height: 100vh;
      padding: clamp(28px, 4.4vw, 62px);
      z-index: 1;
    }

    /* ---------- Left: caption ---------- */
    .caption-side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(10px, 1.8vw, 24px);
    }

    .brand {
      padding: 20px 24px;
      margin-bottom: 36px;
      border-radius: 20px;
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: 0 12px 36px rgba(35, 81, 132, 0.12);
      width: fit-content;
      backdrop-filter: blur(12px);
    }

    .brand-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .brand-logo {
      height: 32px;
      width: auto;
      display: block;
    }

    .brand-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
    }

    .brand-author {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }

    .caption-kicker {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.4px;
      color: var(--blue);
      text-transform: uppercase;
      margin-bottom: 14px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.5s ease;
    }

    .caption-kicker.is-in {
      opacity: 1;
      transform: translateY(0);
    }

    .caption-title {
      font-size: clamp(34px, 4.2vw, 58px);
      font-weight: 800;
      line-height: 1.16;
      letter-spacing: 0;
      margin-bottom: 20px;
      min-height: 3.6em;
      background: linear-gradient(135deg, #0d2760 0%, #2f7ff0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transform: none;
      transition: opacity 0.42s ease;
      transition-delay: 0.05s;
    }

    .caption-title.is-in {
      opacity: 1;
      transform: none;
    }

    .caption-line {
      display: block;
      opacity: 0;
      transform: translateY(5px);
      filter: none;
      transition:
        opacity 0.62s ease,
        transform 0.62s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .caption-line.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .caption-title .caption-line {
      background: linear-gradient(135deg, #0d2760 0%, #2f7ff0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .caption-title.is-story {
      max-width: 650px;
      min-height: 6.8em;
      font-size: clamp(26px, 2.55vw, 38px);
      line-height: 1.58;
      font-weight: 750;
      white-space: pre-wrap;
      color: #0d2760;
      background: none;
      -webkit-text-fill-color: #0d2760;
    }

    .caption-title.is-story .caption-line {
      background: none;
      -webkit-text-fill-color: #0d2760;
      color: #0d2760;
    }

    .caption-title.is-rhythm {
      max-width: 690px;
      min-height: 0;
      margin-bottom: 22px;
      background: none;
      -webkit-text-fill-color: initial;
    }

    .caption-title.is-rhythm .caption-line {
      background: none;
      -webkit-text-fill-color: initial;
      text-wrap: balance;
    }

    .caption-title.is-rhythm .caption-line + .caption-line {
      margin-top: 5px;
    }

    .caption-title.is-rhythm .beat-hero,
    .caption-title.is-rhythm .beat-big,
    .caption-title.is-rhythm .beat-mid,
    .caption-title.is-rhythm .part-hero,
    .caption-title.is-rhythm .part-big,
    .caption-title.is-rhythm .part-mid {
      background: linear-gradient(135deg, #0d2760 0%, #2f7ff0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .caption-title.is-rhythm .beat-hero,
    .caption-title.is-rhythm .part-hero {
      font-size: clamp(36px, 4vw, 54px);
      font-weight: 880;
      line-height: 1.08;
    }

    .caption-title.is-rhythm .beat-big,
    .caption-title.is-rhythm .part-big {
      font-size: clamp(32px, 3.6vw, 52px);
      font-weight: 880;
      line-height: 1.12;
    }

    .caption-title.is-rhythm .beat-mid,
    .caption-title.is-rhythm .part-mid {
      font-size: clamp(22px, 2.35vw, 34px);
      font-weight: 820;
      line-height: 1.2;
    }

    .caption-title.is-rhythm .beat-small,
    .caption-title.is-rhythm .beat-quiet,
    .caption-title.is-rhythm .part-small,
    .caption-title.is-rhythm .part-quiet {
      max-width: 620px;
      background: none;
      -webkit-text-fill-color: initial;
    }

    .caption-title.is-rhythm .beat-small,
    .caption-title.is-rhythm .part-small {
      font-size: clamp(13px, 0.96vw, 14.5px);
      font-weight: 640;
      line-height: 1.68;
      color: #506987;
    }

    .caption-title.is-rhythm .beat-quiet,
    .caption-title.is-rhythm .part-quiet {
      font-size: clamp(12.5px, 0.92vw, 14px);
      font-weight: 650;
      line-height: 1.62;
      color: #617695;
    }

    .caption-title.is-rhythm .beat-line {
      line-height: 1.08;
      color: #0d2760;
    }

    .caption-title.is-rhythm .beat-part {
      display: inline;
      vertical-align: baseline;
    }

    .caption-title.is-rhythm .beat-part + .beat-part {
      margin-left: 0.16em;
    }

    .caption-title.is-rhythm .beat-gap {
      margin-top: 12px !important;
    }

    .caption-copy {
      font-size: clamp(15.5px, 1.45vw, 18px);
      line-height: 1.78;
      color: #4d6587;
      max-width: 540px;
      margin-bottom: 28px;
      min-height: 5.5em;
      font-weight: 520;
      opacity: 0;
      transform: none;
      transition: opacity 0.42s ease;
      transition-delay: 0.08s;
    }

    .caption-copy.is-in {
      opacity: 1;
      transform: none;
    }

    .caption-copy .caption-line + .caption-line {
      margin-top: 8px;
    }

    .caption-copy.is-long {
      max-width: 620px;
      font-size: clamp(14px, 1.22vw, 16px);
      line-height: 1.68;
      min-height: 8.5em;
    }

    .caption-copy.is-long .caption-line + .caption-line {
      margin-top: 5px;
    }

    .caption-copy.is-empty {
      min-height: 0;
      margin-bottom: 16px;
    }

    .keywords {
      display: none;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 36px;
      min-height: 36px;
    }

    .keyword {
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--blue);
      background: var(--blue-soft);
      border-radius: 999px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .keyword.is-in {
      opacity: 1;
      transform: translateY(0);
    }

    .progress {
      width: 100%;
      max-width: 420px;
      height: 4px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blue), #60a3ff);
      transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .step-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* ---------- Right: phone ---------- */
    .visual {
      position: fixed;
      top: clamp(22px, 4vw, 58px);
      right: clamp(56px, 10vw, 180px);
      bottom: calc(86px + env(safe-area-inset-bottom));
      width: min(500px, 40vw);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
    }

    .halo {
      position: absolute;
      width: 78%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(120, 176, 255, 0.32) 0%, rgba(120, 176, 255, 0.12) 40%, transparent 72%);
      filter: blur(8px);
      z-index: 0;
    }

    .phone-wrap {
      position: relative;
      z-index: 1;
      perspective: none;
      transform: none;
      pointer-events: auto;
    }

    .phone {
      position: relative;
      width: min(380px, 44vw);
      aspect-ratio: 9 / 19.2;
      border-radius: 48px;
      background: linear-gradient(160deg, #1a2a46 0%, #0d1628 100%);
      box-shadow:
        0 0 0 2px rgba(255,255,255,0.08),
        0 40px 90px rgba(35, 81, 132, 0.36),
        0 16px 36px rgba(35, 81, 132, 0.22),
        inset 0 0 0 1px rgba(255,255,255,0.06);
      padding: 10px;
      transform: none;
      transform-style: flat;
      animation: none;
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 30px;
      border-radius: 0 0 20px 20px;
      background: #0d1628;
      z-index: 20;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 38px;
      background: #fff;
    }

    .phone-page {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 40px 16px 20px;
      opacity: 0;
      transform: none;
      transition: opacity 0.46s ease;
      pointer-events: none;
      z-index: 1;
    }

    .phone-page.is-active {
      opacity: 1;
      transform: none;
      pointer-events: auto;
      z-index: 2;
    }

    .phone-frame-embed {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      border: none;
      overflow: hidden;
      opacity: 0;
      transform: none;
      transition: opacity 0.46s ease;
      pointer-events: none;
      background: #fff;
      z-index: 1;
    }

    .phone-frame-embed.is-active {
      opacity: 1;
      transform: none;
      pointer-events: auto;
      z-index: 2;
    }

    .phone-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .status-icons {
      display: flex;
      gap: 4px;
    }

    .mini-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--ink);
      opacity: 0.8;
    }

    .page-head {
      margin-bottom: 14px;
    }

    .page-label {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: 1px;
    }

    .page-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.3;
      margin: 4px 0 4px;
      color: var(--ink);
    }

    .page-sub {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 6px 20px rgba(35, 81, 132, 0.06);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }

    .task-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .task-icon {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: var(--blue-soft);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
    }

    .task-meta {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue);
      flex-shrink: 0;
    }

    .badge.done {
      background: #e6f7ef;
      color: #16a34a;
    }

    .badge.warn {
      background: #fff1d8;
      color: #d97706;
    }

    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .app-button {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
    }

    .app-button.primary {
      background: linear-gradient(135deg, var(--blue), #4f98ff);
      color: white;
      border-color: transparent;
      box-shadow: 0 6px 16px rgba(47, 127, 240, 0.3);
    }

    .lamp-card {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .lamp-visual {
      width: 70px; height: 70px;
      flex-shrink: 0;
      border-radius: 14px;
      background: linear-gradient(180deg, #ffe4a8 0%, #ffd078 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lamp {
      width: 28px; height: 40px;
      border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
      background: linear-gradient(180deg, #fff8e0, #fff);
      box-shadow: 0 0 20px rgba(255, 220, 140, 0.8);
    }

    .manual-lines {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .manual-lines > div {
      height: 8px;
      border-radius: 999px;
      background: var(--line);
    }

    .manual-lines > div:nth-child(1) { width: 85%; }
    .manual-lines > div:nth-child(2) { width: 65%; }
    .manual-lines > div:nth-child(3) { width: 75%; }

    .fragment-cloud {
      position: relative;
      flex: 1;
      min-height: 280px;
    }

    .fragment {
      position: absolute;
      padding: 7px 11px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--ink);
      box-shadow: 0 4px 12px rgba(35, 81, 132, 0.08);
      white-space: nowrap;
    }

    .fragment:nth-child(1) { top: 8%; left: 6%; transform: rotate(-4deg); }
    .fragment:nth-child(2) { top: 22%; right: 4%; transform: rotate(3deg); }
    .fragment:nth-child(3) { top: 48%; left: 3%; transform: rotate(2deg); }
    .fragment:nth-child(4) { top: 58%; right: 10%; transform: rotate(-3deg); }
    .fragment:nth-child(5) { bottom: 16%; left: 15%; transform: rotate(1.5deg); }

    .ai-core {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 60px; height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), #60a3ff);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      box-shadow: 0 10px 28px rgba(47, 127, 240, 0.4);
    }

    .scene-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .scene-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
    }

    .scene-icon {
      width: 32px; height: 32px;
      border-radius: 10px;
      background: var(--blue-soft);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .scene-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink);
    }

    .scene-sub {
      font-size: 9.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .qr {
      width: 56px; height: 56px;
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 2px;
      padding: 4px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .qr span {
      background: var(--ink);
      border-radius: 1px;
    }

    .qr span:nth-child(3n) { background: transparent; }
    .qr span:nth-child(5n+2) { background: var(--ink); }
    .qr span:nth-child(7) { background: var(--ink); }
    .qr span:nth-child(9) { background: var(--ink); }
    .qr span:nth-child(11) { background: transparent; }
    .qr span:nth-child(13) { background: var(--ink); }
    .qr span:nth-child(17) { background: var(--ink); }
    .qr span:nth-child(19) { background: transparent; }
    .qr span:nth-child(21) { background: var(--ink); }
    .qr span:nth-child(23) { background: var(--ink); }

    .ending {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 16px;
    }

    .ending h2 {
      font-size: 28px;
      font-weight: 900;
      line-height: 1.2;
      background: linear-gradient(135deg, #0d2760 0%, #2f7ff0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .ending p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .ending-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .ending-tags span {
      padding: 5px 10px;
      font-size: 10px;
      font-weight: 600;
      color: var(--blue);
      background: var(--blue-soft);
      border-radius: 999px;
    }

    .big-task {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 12px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 9px;
    }

    .big-num {
      width: 44px; height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--blue), #60a3ff);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .big-copy {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
    }

    .big-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    /* ---------- NFC label ---------- */
    .nfc-wrap {
      position: absolute;
      right: calc(100% + 20px);
      top: 58%;
      transform: translateY(-50%) translateX(-10px);
      opacity: 0;
      transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .nfc-wrap.is-visible {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }

    .nfc-label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      position: relative;
    }

    .nfc-label::after {
      content: "";
      position: absolute;
      right: -6px; top: 50%;
      transform: translateY(-50%) rotate(45deg);
      width: 12px; height: 12px;
      background: var(--paper);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .nfc-icon {
      width: 30px; height: 30px;
      border-radius: 10px;
      background: linear-gradient(135deg, #ffb366, var(--orange));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .nfc-text {
      white-space: nowrap;
    }

    .nfc-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--ink);
    }

    .nfc-sub {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ---------- Controls ---------- */
    .controls {
      position: fixed;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px 10px 16px;
      border-radius: 999px;
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: 0 14px 36px rgba(35, 81, 132, 0.18);
      backdrop-filter: blur(16px);
      z-index: 100;
    }

    .controls button {
      width: 46px;
      height: 46px;
      padding: 0;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      color: var(--ink);
      background: transparent;
      transition: all 0.25s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .controls button:hover {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .controls button.primary {
      width: 70px;
      height: 52px;
      background: linear-gradient(135deg, var(--blue), #4f98ff);
      color: white;
      box-shadow: 0 6px 18px rgba(47, 127, 240, 0.32);
    }

    .controls button.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(47, 127, 240, 0.42);
    }

    .play-icon {
      width: 23px;
      height: 23px;
      display: block;
    }

    .play-button .icon-play {
      display: none;
      margin-left: 2px;
    }

    .play-button.is-paused .icon-pause {
      display: none;
    }

    .play-button.is-paused .icon-play {
      display: block;
    }

    .music-toggle {
      position: fixed;
      top: 26px;
      right: 28px;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(191, 214, 241, 0.9);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.78);
      color: var(--blue);
      box-shadow: 0 12px 28px rgba(35, 81, 132, 0.18);
      backdrop-filter: blur(14px);
      cursor: pointer;
      z-index: 120;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.24s ease, transform 0.24s ease, filter 0.24s ease;
    }

    .music-toggle:hover {
      transform: translateY(-1px);
      box-shadow: 0 15px 32px rgba(35, 81, 132, 0.22);
    }

    .music-disc {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #fff 0 16%, #dbeaff 17% 28%, #5b9bff 29% 62%, #1762d4 63% 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.45);
    }

    .music-toggle.is-playing .music-disc {
      animation: musicSpin 4.8s linear infinite;
    }

    .music-toggle.is-off {
      opacity: 0.58;
      filter: grayscale(0.35);
    }

    .music-toggle.is-missing {
      opacity: 0.44;
      cursor: help;
    }

    .music-note {
      position: absolute;
      right: 34px;
      top: 7px;
      color: var(--orange);
      font-size: 15px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
    }

    .music-note:nth-child(3) {
      right: 42px;
      top: 20px;
      color: #4f98ff;
      animation-delay: 0.9s;
    }

    .music-toggle.is-playing .music-note {
      animation: noteFloat 2.6s ease-in-out infinite;
    }

    @keyframes musicSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes noteFloat {
      0% {
        transform: translate(0, 0) scale(0.72);
        opacity: 0;
      }
      22% {
        opacity: 0.9;
      }
      100% {
        transform: translate(-18px, -24px) scale(1.05);
        opacity: 0;
      }
    }

      }

      .brand-content {

      }

      .brand-logo {
        grid-area: logo;

      }

      .brand-text,

      }

      .brand-text {

      }

      .brand-title {

      .caption-kicker {

      .caption-title {

      }

      .caption-title.is-story {

      }

        max-width: 100%;

      .visual {
        position: fixed;

      }

      }

      .music-toggle {

        width: 42px;

      }

      }
    }
  </style>
</head>

        ],
        copy: "",
        tags: ["大字短句", "今日提醒", "录一句心情"],
        duration: 14200,
        page: "elder",
        nfc: null
      },
      {
        kicker: "第八幕 · 换我爱你",
        title: "你好，大朋友。\n这一次，换我来爱你。",
        beats: [
          { text: "我们无法阻止变老的脚步。", tone: "mid" },
          { text: "但我们可以让父母少一点慌张，多一份从容。", tone: "mid" },
          { text: "在没有陪伴的时间里，处处都有彼此的身影。", tone: "mid" },
          { text: "你好，大朋友。", tone: "mid", gap: true },
          { text: "这一次，换我来爱你。", tone: "mid" }
        ],
        copy: "",
        tags: ["少一点慌张", "多一份从容", "换我爱你"],
        duration: 12200,
        page: "index",
        profileIndex: 0,
        nfc: null
      },
      {
        kicker: "最后一幕 · 公益承诺",
        title: "项目进展\n与公益承诺",
        beats: [
          { text: "目前，《你好，大朋友》Demo 已完成约 60%。", tone: "mid" },
          { text: "计划本月上线微信小程序。", tone: "mid" },
          { text: "无论比赛结果如何，", tone: "mid", gap: true },
          { text: "我都会坚持推进项目落地。", tone: "mid" },
          { text: "在有能力维护的前提下，", tone: "mid", gap: true },
          { text: "面向有需要的家庭免费开放使用。", tone: "mid" },
          { text: "小程序审核通过后，", tone: "mid", gap: true },
          { text: "也会将源代码开源。", tone: "mid" },
          { text: "希望这个工具，真正帮助到更多家庭。", tone: "mid", gap: true }
        ],
        copy: "",
        tags: ["Demo 60%", "微信小程序", "免费开放与开源"],
        duration: 15000,
        page: "index",
        profileIndex: 0,
        nfc: null
      }
    ];

    let index = 0;
    let timer = null;
    let revealTimers = [];
    let revealToken = 0;
    let isPlaying = true;
    const DURATION = 7800;

    const captionKicker = document.getElementById("captionKicker");
    const captionTitle = document.getElementById("captionTitle");
    const captionCopy = document.getElementById("captionCopy");
    const keywords = document.getElementById("keywords");
    const progressFill = document.getElementById("progressFill");
    const stepLabel = document.getElementById("stepLabel");
    const nfcWrap = document.getElementById("nfcWrap");
    const nfcTitle = document.getElementById("nfcTitle");
    const nfcSub = document.getElementById("nfcSub");
    const pages = document.querySelectorAll(".phone-page, .phone-frame-embed");
    const pageFrames = document.querySelectorAll(".phone-frame-embed");
    const playBtn = document.getElementById("playBtn");
    const musicToggle = document.getElementById("musicToggle");
    const bgmAudio = document.getElementById("bgmAudio");

    bgmAudio.volume = 0.46;

    function syncPlayButton() {
      playBtn.classList.toggle("is-paused", !isPlaying);
      playBtn.setAttribute("aria-label", isPlaying ? "暂停" : "播放");
      playBtn.title = isPlaying ? "暂停" : "播放";
    }

    function setMusicPlaying(isMusicPlaying) {
      musicToggle.classList.toggle("is-playing", isMusicPlaying);
      musicToggle.classList.toggle("is-off", !isMusicPlaying);
      musicToggle.title = isMusicPlaying ? "关闭背景音乐" : "开启背景音乐";
    }

    function markBgmMissing() {
      musicToggle.classList.add("is-missing");
      musicToggle.classList.remove("is-playing");
      musicToggle.title = "没有找到背景音乐文件：assets/audio/fuqin-instrumental.mp3";
    }

    function markBgmReady() {
      musicToggle.classList.remove("is-missing");
      setMusicPlaying(!bgmAudio.paused);
    }

    async function playBgm() {
      if (musicToggle.classList.contains("is-missing")) return;

      try {
        await bgmAudio.play();
        setMusicPlaying(true);
      } catch (error) {
        setMusicPlaying(false);
      }
    }

    function postSceneToFrame(frame, scene, options = {}) {
      if (!frame || !frame.contentWindow) return;

      frame.contentWindow.postMessage({
        type: "vcr:scene",
        page: scene.page,
        profileIndex: scene.profileIndex,
        replay: Boolean(options.replay),
        instant: Boolean(options.instant),
        isPlaying
      }, "*");
    }

    function syncPhoneScene(scene, options = {}) {
      const activeFrame = Array.from(pageFrames).find(frame => frame.dataset.page === scene.page);
      if (!activeFrame) return;

      setTimeout(() => postSceneToFrame(activeFrame, scene, options), 80);
    }

    function broadcastPlayback() {
      pageFrames.forEach(frame => {
        if (!frame.contentWindow) return;

        frame.contentWindow.postMessage({
          type: "vcr:playback",
          isPlaying
        }, "*");
      });
    }

    function clearTextReveal() {
      revealToken += 1;
      revealTimers.forEach(timerId => clearTimeout(timerId));
      revealTimers = [];
    }

    function splitNarration(text) {
      if (!text) return [];
      if (text.includes("\n")) {
        return text.split("\n").map(line => line.trim()).filter(Boolean);
      }

      return text
        .split(/(?<=[。！？；])/)
        .map(line => line.trim())
        .filter(Boolean);
    }

    function buildSoftLines(element, text, options = {}) {
      element.textContent = "";
      const pieces = options.bySentence ? splitNarration(text) : text.split("\n").map(line => line.trim()).filter(Boolean);

      return pieces.map(piece => {
        const span = document.createElement("span");
        span.className = "caption-line";
        span.textContent = piece;
        element.appendChild(span);
        return span;
      });
    }

    function buildBeatLines(element, beats) {
      element.textContent = "";

      return beats.map(beat => {
        const item = typeof beat === "string" ? { text: beat, tone: "big" } : beat;
        const span = document.createElement("span");
        if (Array.isArray(item.parts)) {
          span.className = `caption-line beat-line${item.gap ? " beat-gap" : ""}`;
          item.parts.forEach(part => {
            const partSpan = document.createElement("span");
            partSpan.className = `beat-part part-${part.tone || "big"}`;
            partSpan.textContent = part.text;
            span.appendChild(partSpan);
          });
        } else {
          span.className = `caption-line beat-${item.tone || "big"}${item.gap ? " beat-gap" : ""}`;
          span.textContent = item.text;
        }
        element.appendChild(span);
        return span;
      });
    }

    function revealSoftLines(lines, startDelay = 0, gap = 520) {
      const token = revealToken;
      lines.forEach((line, i) => {
        const timerId = setTimeout(() => {
          if (token === revealToken) {
            line.classList.add("is-visible");
          }
        }, startDelay + i * gap);
        revealTimers.push(timerId);
      });

      return startDelay + Math.max(lines.length - 1, 0) * gap;
    }

    function renderKeywords(tags, startDelay = 100) {
      keywords.innerHTML = "";
    }

    function renderScene() {
      const scene = scenes[index];
      clearTextReveal();

      // Text animations: out then in
      [captionKicker, captionTitle, captionCopy].forEach(el => el.classList.remove("is-in"));
      captionTitle.classList.remove("is-story");
      captionTitle.classList.remove("is-rhythm");
      captionCopy.classList.remove("is-empty");
      captionCopy.classList.remove("is-long");
      keywords.innerHTML = "";

      setTimeout(() => {
        const hasBeats = Array.isArray(scene.beats) && scene.beats.length > 0;
        const copyText = hasBeats ? "" : scene.copy;

        captionKicker.textContent = scene.kicker;
        captionTitle.classList.toggle("is-story", Boolean(scene.story) && !hasBeats);
        captionTitle.classList.toggle("is-rhythm", hasBeats);
        captionCopy.classList.toggle("is-empty", !copyText);
        captionCopy.classList.toggle("is-long", Boolean(scene.longCopy) && !hasBeats);

        const titleLines = hasBeats ? buildBeatLines(captionTitle, scene.beats) : buildSoftLines(captionTitle, scene.title);
        const copyLines = buildSoftLines(captionCopy, copyText, { bySentence: true });
        const rhythmStartDelay = scene.rhythmStartDelay ?? 300;
        const rhythmGap = scene.rhythmGap ?? (scene.beats?.some(beat => beat.tone === "hero") ? 520 : 650);
        const titleDoneAt = scene.story
          ? revealSoftLines(titleLines, 260, 720)
          : revealSoftLines(titleLines, hasBeats ? rhythmStartDelay : 60, hasBeats ? rhythmGap : 160);
        const copyDoneAt = revealSoftLines(copyLines, scene.story ? titleDoneAt + 520 : 500, scene.story ? 620 : 360);
        renderKeywords(scene.tags, copyDoneAt + (copyLines.length ? 650 : 520));

        requestAnimationFrame(() => {
          captionKicker.classList.add("is-in");
          captionTitle.classList.add("is-in");
          if (copyText) {
            captionCopy.classList.add("is-in");
          }
        });
      }, 250);

      pages.forEach(page => {
        page.classList.toggle("is-active", page.dataset.page === scene.page);
      });
      syncPhoneScene(scene, { instant: index === 0 });

      progressFill.style.width = `${((index + 1) / scenes.length) * 100}%`;
      stepLabel.textContent = `${index + 1} / ${scenes.length}`;

      if (scene.nfc) {
        nfcTitle.textContent = scene.nfc.title;
        nfcSub.textContent = scene.nfc.sub;
        nfcWrap.classList.add("is-visible");
      } else {
        nfcWrap.classList.remove("is-visible");
      }
    }

    function next() {
      index = (index + 1) % scenes.length;
      renderScene();
    }

    function prev() {
      index = (index - 1 + scenes.length) % scenes.length;
      renderScene();
    }

    function schedule() {
      clearTimeout(timer);
      if (isPlaying) {
        timer = setTimeout(() => {
          next();
          schedule();
        }, scenes[index].duration || DURATION);
      }
    }

    document.getElementById("nextBtn").addEventListener("click", () => {
      next();
      schedule();
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      prev();
      schedule();
    });

    playBtn.addEventListener("click", () => {
      isPlaying = !isPlaying;
      syncPlayButton();
      broadcastPlayback();
      schedule();
    });

    musicToggle.addEventListener("click", async () => {
      if (bgmAudio.paused) {
        await playBgm();
      } else {
        bgmAudio.pause();
        setMusicPlaying(false);
      }
    });

    bgmAudio.addEventListener("error", markBgmMissing);
    bgmAudio.addEventListener("loadedmetadata", () => {
      markBgmReady();
      playBgm();
    }, { once: true });
    bgmAudio.addEventListener("play", () => setMusicPlaying(true));
    bgmAudio.addEventListener("pause", () => setMusicPlaying(false));
    bgmAudio.load();

    function unlockBgmOnGesture(event) {
      if (event.target.closest("#musicToggle")) return;

      if (bgmAudio.paused && !musicToggle.classList.contains("is-missing")) {
        playBgm().then(() => {
          if (!bgmAudio.paused) {
            document.removeEventListener("pointerdown", unlockBgmOnGesture);
          }
        });
      }
    }

    document.addEventListener("pointerdown", unlockBgmOnGesture);

    pageFrames.forEach(frame => {
      frame.addEventListener("load", () => {
        const scene = scenes[index];
        if (frame.dataset.page === scene.page) {
          postSceneToFrame(frame, scene, { instant: true });
        }
        if (frame.contentWindow) {
          frame.contentWindow.postMessage({ type: "vcr:playback", isPlaying }, "*");
        }
      });
    });

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || typeof data !== "object" || data.type !== "vcr:ready") return;

      const scene = scenes[index];
      const activeFrame = Array.from(pageFrames).find(frame => frame.dataset.page === data.page);
      if (activeFrame && activeFrame.dataset.page === scene.page) {
        postSceneToFrame(activeFrame, scene, { instant: true });
      }
    });

    // Init
    syncPlayButton();
    renderScene();
    schedule();
  </script>
</body>
</html>
