            <fePointLight x="-60" y="-100" z="160"/>
          </feSpecularLighting>
          <feComposite in="specular" in2="SourceAlpha" operator="in" result="specularMasked"/>
          <feComposite in="SourceGraphic" in2="specularMasked" operator="arithmetic" k1="0" k2="1" k3="0.6" k4="0"/>
        </filter>

        <!-- Edge displacement — liquid bulge effect at rim -->
        <filter id="liquid-edge" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="1" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
  </body>
