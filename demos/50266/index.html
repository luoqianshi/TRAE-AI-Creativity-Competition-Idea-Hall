<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能错题本 - 可体验 Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .hidden { display: none !important; }

        h1 { font-size: 28px; color: #0d5c52; margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 24px; }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #11998e;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(17, 153, 142, 0.35);
        }
        .btn-block { width: 100%; }
        .btn-secondary {
            background: #fff;
            color: #11998e;
            border: 2px solid #11998e;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }
        .tab {
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            transition: all 0.2s;
        }
        .tab.active {
            background: #e8f9f3;
            color: #11998e;
            font-weight: 600;
        }

        .analysis-result {
            background: #f0fff7;
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }
        .analysis-result h3 {
            font-size: 16px;
            color: #0d5c52;
            margin-bottom: 12px;
        }
        .tag {
            display: inline-block;
            background: #11998e;
            color: #fff;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 13px;
            margin: 0 8px 8px 0;
        }
        .tag.reason { background: #ff9f43; }
        .tag.point { background: #11998e; }

        .question-card {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .question-card h4 {
            font-size: 15px;
            color: #333;
            margin-bottom: 8px;
        }
        .question-card p {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }
        .question-card .meta {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .mini-tag {
            background: #e8f9f3;
            color: #0d5c52;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #fff;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-card .num { font-size: 28px; font-weight: 700; }
        .stat-card .label { font-size: 13px; opacity: 0.9; }

        .weakness-section {
            background: #fff8f0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .weakness-section h3 {
            font-size: 16px;
            color: #8a5a00;
            margin-bottom: 10px;
        }
        .weakness-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .weakness-bar {
            flex: 1;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin: 0 12px;
            overflow: hidden;
        }
        .weakness-fill {
            height: 100%;
            background: #ff9f43;
            border-radius: 4px;
        }

        .practice-list {
            list-style: none;
        }
        .practice-list li {
            padding: 10px 12px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .practice-list li span { color: #11998e; font-weight: 600; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>AI 智能错题本</h1>
            <p class="subtitle">拍照录入 → AI 分析错因 → 薄弱点图谱 → 推送针对练习</p>

            <div class="tabs">
                <div class="tab active" data-tab="input">录入错题</div>
                <div class="tab" data-tab="list">错题列表</div>
                <div class="tab" data-tab="report">学情报告</div>
            </div>

            <!-- 录入错题 -->
            <div id="input-panel" class="panel">
                <div class="form-group">
                    <label for="subject">学科 / 考试科目</label>
                    <select id="subject">
                        <option value="math">数学</option>
                        <option value="english">英语</option>
                        <option value="physics">物理</option>
                        <option value="coding">编程</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="question">错题内容（可粘贴题干或描述）</label>
                    <textarea id="question" placeholder="例如：求解方程 x² - 5x + 6 = 0 时，我误把常数项符号弄错，得到 x=1 和 x=6。"></textarea>
                </div>
                <div class="form-group">
                    <label for="reason">你认为的错误原因</label>
                    <select id="reason">
                        <option value="concept">概念理解不清</option>
                        <option value="careless">粗心/计算失误</option>
                        <option value="method">解题方法不熟</option>
                        <option value="knowledge">知识点遗漏</option>
                    </select>
                </div>
                <button class="btn btn-block" id="analyze-btn">AI 分析错题</button>

                <div id="analysis-result" class="analysis-result hidden">
                    <h3>AI 分析结果</h3>
                    <p style="margin-bottom:8px;font-size:14px;color:#555;">知识点标签：</p>
                    <div id="point-tags"></div>
                    <p style="margin:12px 0 8px;font-size:14px;color:#555;">错误原因：</p>
                    <div id="reason-tags"></div>
                    <p style="margin:12px 0 8px;font-size:14px;color:#555;">建议：</p>
                    <p id="suggestion" style="font-size:14px;color:#444;"></p>
                    <button class="btn" style="margin-top:16px;" id="save-btn">保存到错题本</button>
                </div>
            </div>

            <!-- 错题列表 -->
            <div id="list-panel" class="panel hidden">
                <div id="question-list"></div>
            </div>

            <!-- 学情报告 -->
            <div id="report-panel" class="panel hidden">
                <div class="stats">
                    <div class="stat-card">
                        <div class="num" id="stat-total">0</div>
                        <div class="label">累计错题</div>
                    </div>
                    <div class="stat-card">
                        <div class="num" id="stat-points">0</div>
                        <div class="label">涉及知识点</div>
                    </div>
                    <div class="stat-card">
                        <div class="num" id="stat-main">-</div>
                        <div class="label">最大薄弱项</div>
                    </div>
                </div>

                <div class="weakness-section">
                    <h3>薄弱知识点分布</h3>
                    <div id="weakness-list"></div>
                </div>

                <div style="background:#f0fff7;border-radius:12px;padding:16px;">
                    <h3 style="font-size:16px;color:#0d5c52;margin-bottom:10px;">今日推荐练习</h3>
                    <ul class="practice-list" id="practice-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 知识点与错误原因映射
        const knowledgeMap = {
            math: {
                points: ['一元二次方程', '因式分解', '函数图像', '几何证明', '概率统计'],
                reasons: { concept: '对一元二次方程求根公式理解不透彻', careless: '符号或计算过程粗心', method: '缺少换元、配方等解题技巧', knowledge: '忽略了判别式或韦达定理' }
            },
            english: {
                points: ['时态语态', '从句结构', '词汇辨析', '阅读理解', '写作表达'],
                reasons: { concept: '语法概念混淆', careless: '审题不仔细', method: '缺少上下文推断技巧', knowledge: '词汇量不足' }
            },
            physics: {
                points: ['牛顿定律', '能量守恒', '电磁感应', '运动学', '光学'],
                reasons: { concept: '物理概念理解不清', careless: '单位换算或计算出错', method: '建模与受力分析不熟练', knowledge: '公式适用条件模糊' }
            },
            coding: {
                points: ['变量与数据类型', '循环与递归', '数组与字符串', '面向对象', '算法与数据结构'],
                reasons: { concept: '对语法或API理解有误', careless: '边界条件未考虑', method: '调试与排错能力不足', knowledge: '缺少常用算法积累' }
            },
            other: {
                points: ['核心概念', '关键公式', '案例分析', '记忆性内容', '综合运用'],
                reasons: { concept: '概念理解不清', careless: '粗心失误', method: '解题方法不熟', knowledge: '知识点遗漏' }
            }
        };

        const reasonLabels = {
            concept: '概念理解不清',
            careless: '粗心/计算失误',
            method: '解题方法不熟',
            knowledge: '知识点遗漏'
        };

        const subjectLabels = {
            math: '数学',
            english: '英语',
            physics: '物理',
            coding: '编程',
            other: '其他'
        };

        let mistakes = [];

        // Tab 切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
                document.getElementById(this.dataset.tab + '-panel').classList.remove('hidden');
                if (this.dataset.tab === 'list') renderList();
                if (this.dataset.tab === 'report') renderReport();
            });
        });

        // AI 分析
        document.getElementById('analyze-btn').addEventListener('click', function() {
            const subject = document.getElementById('subject').value;
            const question = document.getElementById('question').value.trim();
            const reason = document.getElementById('reason').value;

            if (!question) {
                alert('请先输入错题内容');
                return;
            }

            const map = knowledgeMap[subject];
            // 随机选择 1-2 个知识点
            const shuffled = map.points.sort(() => 0.5 - Math.random());
            const points = shuffled.slice(0, Math.floor(Math.random() * 2) + 1);
            const reasonText = map.reasons[reason];

            const pointTags = document.getElementById('point-tags');
            const reasonTags = document.getElementById('reason-tags');
            pointTags.innerHTML = '';
            reasonTags.innerHTML = '';

            points.forEach(p => {
                const span = document.createElement('span');
                span.className = 'tag point';
                span.textContent = p;
                pointTags.appendChild(span);
            });

            const rspan = document.createElement('span');
            rspan.className = 'tag reason';
            rspan.textContent = reasonLabels[reason];
            reasonTags.appendChild(rspan);

            document.getElementById('suggestion').textContent =
                '建议重点复习：' + points.join('、') + '。' + reasonText + '。推荐完成 3 道同类变式题巩固。';

            document.getElementById('analysis-result').classList.remove('hidden');

            // 保存临时数据
            window.currentAnalysis = { subject, question, reason, points };
        });

        // 保存错题
        document.getElementById('save-btn').addEventListener('click', function() {
            if (!window.currentAnalysis) return;
            mistakes.push({
                id: Date.now(),
                ...window.currentAnalysis,
                date: new Date().toLocaleDateString('zh-CN')
            });
            window.currentAnalysis = null;

            document.getElementById('question').value = '';
            document.getElementById('analysis-result').classList.add('hidden');
            alert('已保存到错题本！');

            // 切换到列表页
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector('[data-tab="list"]').classList.add('active');
            document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
            document.getElementById('list-panel').classList.remove('hidden');
            renderList();
        });

        function renderList() {
            const list = document.getElementById('question-list');
            if (mistakes.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="icon">📝</div><p>还没有错题，快去录入第一道吧</p></div>';
                return;
            }
            list.innerHTML = '';
            mistakes.slice().reverse().forEach(m => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML =
                    '<h4>' + subjectLabels[m.subject] + '</h4>' +
                    '<p>' + m.question + '</p>' +
                    '<div class="meta">' +
                        m.points.map(p => '<span class="mini-tag">' + p + '</span>').join('') +
                        '<span class="mini-tag">' + reasonLabels[m.reason] + '</span>' +
                        '<span class="mini-tag">' + m.date + '</span>' +
                    '</div>';
                list.appendChild(card);
            });
        }

        function renderReport() {
            document.getElementById('stat-total').textContent = mistakes.length;

            const pointCount = {};
            mistakes.forEach(m => {
                m.points.forEach(p => {
                    pointCount[p] = (pointCount[p] || 0) + 1;
                });
            });

            const uniquePoints = Object.keys(pointCount).length;
            document.getElementById('stat-points').textContent = uniquePoints;

            const sorted = Object.entries(pointCount).sort((a, b) => b[1] - a[1]);
            document.getElementById('stat-main').textContent = sorted.length ? sorted[0][0] : '-';

            const weaknessList = document.getElementById('weakness-list');
            weaknessList.innerHTML = '';
            if (sorted.length === 0) {
                weaknessList.innerHTML = '<p style="color:#888;font-size:14px;">暂无数据，请录入错题后查看</p>';
            } else {
                const max = sorted[0][1];
                sorted.forEach(([point, count]) => {
                    const item = document.createElement('div');
                    item.className = 'weakness-item';
                    const percent = Math.round(count / max * 100);
                    item.innerHTML =
                        '<span style="font-size:14px;width:80px;">' + point + '</span>' +
                        '<div class="weakness-bar"><div class="weakness-fill" style="width:' + percent + '%"></div></div>' +
                        '<span style="font-size:13px;color:#888;width:30px;text-align:right;">' + count + '</span>';
                    weaknessList.appendChild(item);
                });
            }

            const practiceList = document.getElementById('practice-list');
            practiceList.innerHTML = '';
            if (sorted.length === 0) {
                practiceList.innerHTML = '<li>暂无推荐</li>';
            } else {
                sorted.slice(0, 3).forEach(([point]) => {
                    const li = document.createElement('li');
                    li.innerHTML = point + ' 同类题 <span>去练习</span>';
                    practiceList.appendChild(li);
                });
            }
        }
    </script>
</body>
</html>
