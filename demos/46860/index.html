<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知谱速记 · AI笔记速记与知识图谱生成器</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg-page: #F8FAFC;
      --bg-panel: #FFFFFF;
      --text-primary: #1E293B;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --secondary: #10B981;
      --accent: #F59E0B;
      --person: #8B5CF6;
      --time: #EC4899;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --radius: 12px;
      --transition: all 0.3s ease;
    }
    [data-theme="dark"] {
      --bg-page: #0F172A;
      --bg-panel: #1E293B;
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --border: #334155;
      --primary: #3B82F6;
      --primary-hover: #2563EB;
      --secondary: #34D399;
      --accent: #FBBF24;
      --person: #A78BFA;
      --time: #F472B6;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.3), 0 2px 4px -1px rgba(0,0,0,0.2);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      transition: var(--transition);
    }
    .header {
      position: fixed; top: 0; left: 0; right: 0; height: 60px;
      background: var(--bg-panel); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; z-index: 100; box-shadow: var(--shadow);
      transition: var(--transition);
    }
    .header-title {
      font-size: 20px; font-weight: 700; color: var(--primary);
      display: flex; align-items: center; gap: 8px;
    }
    .header-subtitle { font-size: 13px; color: var(--text-secondary); font-weight: 400; margin-left: 8px; }
    .theme-toggle {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--bg-panel); cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 18px; transition: var(--transition);
    }
    .theme-toggle:hover { background: var(--border); }
    .main-container {
      display: flex; height: 100vh; padding-top: 60px;
    }
    .panel-left {
      width: 40%; min-width: 360px; max-width: 520px;
      background: var(--bg-panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 24px;
      overflow-y: auto; transition: var(--transition);
    }
    .panel-right {
      flex: 1; position: relative; overflow: hidden;
      background: var(--bg-page); transition: var(--transition);
    }
    .section-title {
      font-size: 14px; font-weight: 600; color: var(--text-secondary);
      margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .example-cards {
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .example-card {
      flex: 1; min-width: 100px; background: var(--bg-page);
      border: 2px solid var(--border); border-radius: var(--radius);
      padding: 14px 10px; text-align: center; cursor: pointer;
      transition: var(--transition);
    }
    .example-card:hover { border-color: var(--primary); transform: translateY(-2px); }
    .example-card.active { border-color: var(--primary); background: rgba(37,99,235,0.08); }
    .example-icon { font-size: 28px; margin-bottom: 6px; }
    .example-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .example-desc { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
    .text-input {
      width: 100%; min-height: 180px; padding: 14px;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      background: var(--bg-page); color: var(--text-primary);
      font-family: inherit; font-size: 14px; line-height: 1.6;
      resize: vertical; transition: var(--transition);
    }
    .text-input:focus { outline: none; border-color: var(--primary); }
    .char-count {
      text-align: right; font-size: 12px; color: var(--text-secondary); margin-top: 6px;
    }
    .generate-btn {
      width: 100%; margin-top: 16px; padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white; border: none; border-radius: var(--radius);
      font-size: 15px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: var(--transition); box-shadow: var(--shadow);
    }
    .generate-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 12px -2px rgba(37,99,235,0.3); }
    .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .generate-btn.loading { background: linear-gradient(90deg, var(--primary), var(--secondary), var(--primary)); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .progress-container {
      margin-top: 20px; display: flex; flex-direction: column; gap: 10px;
    }
    .progress-step {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; color: var(--text-secondary); padding: 8px 12px;
      border-radius: 8px; background: var(--bg-page); transition: var(--transition);
    }
    .progress-step::before {
      content: ''; width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid var(--border); display: inline-block;
      transition: var(--transition);
    }
    .progress-step.active { color: var(--primary); font-weight: 600; background: rgba(37,99,235,0.06); }
    .progress-step.active::before { border-color: var(--primary); background: var(--primary); }
    .progress-step.done { color: var(--secondary); }
    .progress-step.done::before { content: '✓'; border-color: var(--secondary); background: var(--secondary); color: white; font-size: 10px; text-align: center; line-height: 16px; }
    .empty-state {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      animation: fadeIn 0.6s ease;
    }
    .empty-illustration { font-size: 72px; margin-bottom: 16px; opacity: 0.8; }
    .empty-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .empty-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
    .graph-container { position: absolute; inset: 0; }
    #graphSvg { width: 100%; height: 100%; cursor: grab; }
    #graphSvg:active { cursor: grabbing; }
    .graph-toolbar {
      position: absolute; top: 16px; right: 16px;
      display: flex; gap: 8px; z-index: 10;
    }
    .toolbar-btn {
      width: 36px; height: 36px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg-panel);
      cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
      transition: var(--transition); box-shadow: var(--shadow);
    }
    .toolbar-btn:hover { border-color: var(--primary); transform: scale(1.05); }
    .detail-panel {
      position: absolute; top: 0; right: 0; bottom: 0; width: 320px;
      background: var(--bg-panel); border-left: 1px solid var(--border);
      box-shadow: -4px 0 12px rgba(0,0,0,0.1);
      transform: translateX(100%); transition: transform 0.3s ease;
      z-index: 20; display: flex; flex-direction: column;
    }
    .detail-panel.open { transform: translateX(0); }
    .detail-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--border);
    }
    .detail-title { font-size: 16px; font-weight: 600; }
    .detail-close {
      width: 28px; height: 28px; border-radius: 50%;
      border: none; background: var(--bg-page); color: var(--text-secondary);
      cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center;
    }
    .detail-close:hover { background: var(--border); }
    .detail-content { padding: 20px; overflow-y: auto; flex: 1; }
    .detail-section { margin-bottom: 16px; }
    .detail-section-title { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 6px; }
    .detail-section-body { font-size: 14px; line-height: 1.6; }
    .detail-tag {
      display: inline-block; padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 500; margin: 2px;
    }
    .footer {
      text-align: center; padding: 16px;
      font-size: 13px; color: var(--text-secondary);
      border-top: 1px solid var(--border); background: var(--bg-panel);
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .panel-left { width: 100%; max-width: none; border-right: none; border-bottom: 1px solid var(--border); max-height: 50vh; }
      .panel-right { min-height: 400px; }
      .example-cards { flex-direction: column; }
      .example-card { flex-direction: row; text-align: left; align-items: center; gap: 10px; }
      .example-icon { margin-bottom: 0; }
      .detail-panel { width: 100%; }
      .header-title { font-size: 16px; }
      .header-subtitle { display: none; }
    }
    @media (min-width: 769px) {
      .footer { display: none; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-title">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
      知谱速记
      <span class="header-subtitle">让笔记变成思维地图</span>
    </div>
    <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
  </header>

  <div class="main-container">
    <div class="panel-left">
      <div class="section-title">选择场景示例</div>
      <div class="example-cards">
        <div class="example-card" data-example="ml">
          <div class="example-icon">🎓</div>
          <div class="example-name">专业课笔记</div>
          <div class="example-desc">机器学习基础概念</div>
        </div>
        <div class="example-card" data-example="meeting">
          <div class="example-icon">📋</div>
          <div class="example-name">会议纪要</div>
          <div class="example-desc">产品周会讨论</div>
        </div>
        <div class="example-card" data-example="lecture">
          <div class="example-icon">🎤</div>
          <div class="example-name">讲座笔记</div>
          <div class="example-desc">时间管理方法</div>
        </div>
      </div>

      <div class="section-title" style="margin-top:20px">笔记内容</div>
      <textarea class="text-input" id="textInput" placeholder="在这里粘贴或输入你的笔记内容...&#10;支持课堂笔记、会议纪要、讲座记录等"></textarea>
      <div class="char-count" id="charCount">0 字</div>

      <button class="generate-btn" id="generateBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        生成知识图谱
      </button>

      <div class="progress-container" id="progressContainer" style="display:none">
        <div class="progress-step" id="step1">智能分句</div>
        <div class="progress-step" id="step2">提取关系</div>
        <div class="progress-step" id="step3">构建图谱</div>
      </div>
    </div>

    <div class="panel-right" id="graphPanel">
      <div class="empty-state" id="emptyState">
        <div class="empty-illustration">🗺️</div>
        <div class="empty-title">输入笔记，一键生成知识图谱</div>
        <div class="empty-desc">从左侧选择示例或粘贴你的笔记内容<br>AI将自动提炼要点并构建可视化的知识网络</div>
      </div>
      <div class="graph-container" id="graphContainer" style="display:none">
        <svg id="graphSvg"></svg>
        <div class="graph-toolbar">
          <button class="toolbar-btn" id="btnRelayout" title="重新布局">🔄</button>
          <button class="toolbar-btn" id="btnDownload" title="下载图片">💾</button>
          <button class="toolbar-btn" id="btnFullscreen" title="全屏">⛶</button>
        </div>
      </div>
      <div class="detail-panel" id="detailPanel">
        <div class="detail-header">
          <div class="detail-title" id="detailTitle">节点详情</div>
          <button class="detail-close" id="detailClose">✕</button>
        </div>
        <div class="detail-content" id="detailContent"></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div>知谱速记 · AI智能笔记速记与知识图谱生成器</div>
    <div style="font-size:12px;opacity:0.7;margin-top:4px">学习工作赛道 Demo</div>
  </footer>

  <script>
    // ==================== 示例数据 ====================
    const EXAMPLES = {
      ml: {
        text: `机器学习是人工智能的一个分支。监督学习是机器学习的主要方法之一，它使用带标签的数据进行训练。监督学习分为分类和回归两种类型。分类用于预测离散标签，回归用于预测连续数值。神经网络是一种模拟人脑结构的算法模型，深度学习是神经网络的一个子领域，使用多层神经网络。过拟合是机器学习中常见的问题，指的是模型在训练数据上表现很好，但在新数据上表现很差。解决过拟合的方法包括增加数据量、正则化和使用Dropout。`,
        keywords: {
          '机器学习': { type: 'core', importance: 3 },
          '人工智能': { type: 'concept', importance: 2 },
          '监督学习': { type: 'core', importance: 3 },
          '分类': { type: 'sub', importance: 1 },
          '回归': { type: 'sub', importance: 1 },
          '神经网络': { type: 'core', importance: 3 },
          '深度学习': { type: 'sub', importance: 2 },
          '过拟合': { type: 'core', importance: 3 },
          '正则化': { type: 'sub', importance: 1 },
          'Dropout': { type: 'sub', importance: 1 }
        },
        relations: [
          { source: '机器学习', target: '人工智能', type: '属于' },
          { source: '监督学习', target: '机器学习', type: '属于' },
          { source: '监督学习', target: '分类', type: '分为' },
          { source: '监督学习', target: '回归', type: '分为' },
          { source: '神经网络', target: '机器学习', type: '属于' },
          { source: '深度学习', target: '神经网络', type: '属于' },
          { source: '过拟合', target: '机器学习', type: '属于' },
          { source: '过拟合', target: '正则化', type: '解决方法' },
          { source: '过拟合', target: 'Dropout', type: '解决方法' }
        ]
      },
      meeting: {
        text: `会议时间：2025年3月15日。参会人：张经理、李设计师、王工程师。本周完成了用户登录模块的开发，下周开始订单系统的需求评审。用户反馈登录流程太复杂，需要简化。张经理负责跟进UI优化，截止日期是3月25日。王工程师提出后端接口有性能瓶颈，需要重构。风险点：订单系统需求可能变动，需提前与业务方确认。`,
        keywords: {
          '用户登录模块': { type: 'core', importance: 3 },
          '订单系统': { type: 'core', importance: 3 },
          '张经理': { type: 'person', importance: 2 },
          '李设计师': { type: 'person', importance: 2 },
          '王工程师': { type: 'person', importance: 2 },
          'UI优化': { type: 'todo', importance: 2 },
          '后端重构': { type: 'todo', importance: 2 },
          '性能瓶颈': { type: 'risk', importance: 2 },
          '需求变动': { type: 'risk', importance: 2 },
          '3月25日': { type: 'time', importance: 1 }
        },
        relations: [
          { source: '张经理', target: 'UI优化', type: '负责' },
          { source: '王工程师', target: '后端重构', type: '提出' },
          { source: 'UI优化', target: '3月25日', type: '截止' },
          { source: '性能瓶颈', target: '后端重构', type: '导致' },
          { source: '需求变动', target: '订单系统', type: '影响' }
        ]
      },
      lecture: {
        text: `GTD是Getting Things Done的缩写，由David Allen提出，核心是把所有任务从大脑中清空，记录到外部系统。番茄工作法由Francesco Cirillo发明，使用25分钟专注+5分钟休息的循环。深度工作由Cal Newport提出，强调在无干扰状态下进行高质量思考。GTD适合管理复杂项目，番茄工作法适合克服拖延，深度工作适合需要创造力的任务。三种方法可以结合使用：先用GTD收集任务，再用番茄工作法执行，在重要任务上使用深度工作模式。`,
        keywords: {
          'GTD': { type: 'core', importance: 3 },
          '番茄工作法': { type: 'core', importance: 3 },
          '深度工作': { type: 'core', importance: 3 },
          'David Allen': { type: 'person', importance: 1 },
          'Francesco Cirillo': { type: 'person', importance: 1 },
          'Cal Newport': { type: 'person', importance: 1 },
          '复杂项目': { type: 'sub', importance: 1 },
          '拖延': { type: 'sub', importance: 1 },
          '创造力': { type: 'sub', importance: 1 }
        },
        relations: [
          { source: 'GTD', target: 'David Allen', type: '提出' },
          { source: '番茄工作法', target: 'Francesco Cirillo', type: '发明' },
          { source: '深度工作', target: 'Cal Newport', type: '提出' },
          { source: 'GTD', target: '复杂项目', type: '适合' },
          { source: '番茄工作法', target: '拖延', type: '克服' },
          { source: '深度工作', target: '创造力', type: '适合' },
          { source: 'GTD', target: '番茄工作法', type: '结合' },
          { source: '番茄工作法', target: '深度工作', type: '结合' }
        ]
      }
    };

    // ==================== 模拟AI提取逻辑 ====================
    function extractFromText(text) {
      for (const key of Object.keys(EXAMPLES)) {
        const ex = EXAMPLES[key];
        const exKeywords = Object.keys(ex.keywords);
        const matched = exKeywords.filter(k => text.includes(k)).length;
        if (matched >= exKeywords.length * 0.5) {
          return formatGraphData(ex.keywords, ex.relations);
        }
      }

      const commonKeywords = {
        '机器学习': { type: 'core', importance: 3 },
        '人工智能': { type: 'concept', importance: 2 },
        '监督学习': { type: 'core', importance: 3 },
        '分类': { type: 'sub', importance: 1 },
        '回归': { type: 'sub', importance: 1 },
        '神经网络': { type: 'core', importance: 3 },
        '深度学习': { type: 'sub', importance: 2 },
        '过拟合': { type: 'core', importance: 3 },
        '正则化': { type: 'sub', importance: 1 },
        'Dropout': { type: 'sub', importance: 1 },
        'GTD': { type: 'core', importance: 3 },
        '番茄工作法': { type: 'core', importance: 3 },
        '深度工作': { type: 'core', importance: 3 }
      };

      const foundEntities = {};
      const foundRelations = [];

      for (const [word, info] of Object.entries(commonKeywords)) {
        if (text.includes(word)) {
          foundEntities[word] = info;
        }
      }

      const relationPatterns = [
        { regex: /([^，。]{2,20})是([^，。]{2,20})/g, type: '属于' },
        { regex: /([^，。]{2,20})分为([^，。]{2,20})/g, type: '分为' },
        { regex: /([^，。]{2,20})包含([^，。]{2,20})/g, type: '包含' }
      ];

      for (const { regex, type } of relationPatterns) {
        let match;
        while ((match = regex.exec(text)) !== null) {
          const source = match[1].trim();
          const target = match[2].trim();
          if (source !== target) {
            foundRelations.push({ source, target, type });
            if (!foundEntities[source]) foundEntities[source] = { type: 'concept', importance: 2 };
            if (!foundEntities[target]) foundEntities[target] = { type: 'concept', importance: 1 };
          }
        }
      }

      if (Object.keys(foundEntities).length === 0) {
        const words = text.match(/[\u4e00-\u9fa5]{2,6}/g) || [];
        const freq = {};
        words.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
        const topWords = Object.entries(freq).sort((a,b) => b[1]-a[1]).slice(0, 8);
        topWords.forEach(([w], i) => {
          foundEntities[w] = { type: 'concept', importance: i < 3 ? 2 : 1 };
        });
      }

      return formatGraphData(foundEntities, foundRelations);
    }

    function formatGraphData(keywords, relations) {
      const nodes = Object.entries(keywords).map(([id, info]) => ({
        id,
        group: info.type,
        importance: info.importance,
        radius: info.importance === 3 ? 28 : info.importance === 2 ? 20 : 14
      }));

      const nodeIds = new Set(nodes.map(n => n.id));
      const links = relations
        .filter(r => nodeIds.has(r.source) && nodeIds.has(r.target))
        .map((r, i) => ({ ...r, id: `link-${i}` }));

      const connectedNodes = new Set();
      links.forEach(l => { connectedNodes.add(l.source); connectedNodes.add(l.target); });
      const isolated = nodes.filter(n => !connectedNodes.has(n.id));
      if (isolated.length > 1 && links.length > 0) {
        isolated.slice(1).forEach((node, i) => {
          links.push({ source: isolated[0].id, target: node.id, type: '相关', id: `weak-${i}` });
        });
      }

      return { nodes, links };
    }

    // ==================== D3.js 图谱渲染 ====================
    let simulation, svg, g, zoom;
    let currentGraphData = null;
    let isDark = false;

    function getColorMap() {
      return {
        core: isDark ? '#3B82F6' : '#2563EB',
        concept: isDark ? '#34D399' : '#10B981',
        sub: isDark ? '#94A3B8' : '#64748B',
        person: isDark ? '#A78BFA' : '#8B5CF6',
        time: isDark ? '#F472B6' : '#EC4899',
        todo: isDark ? '#FBBF24' : '#F59E0B',
        risk: isDark ? '#EF4444' : '#DC2626'
      };
    }

    function initGraph() {
      svg = d3.select('#graphSvg');
      svg.selectAll('*').remove();

      const container = document.getElementById('graphContainer');
      const width = container.clientWidth;
      const height = container.clientHeight;

      svg.attr('viewBox', [0, 0, width, height]);

      const defs = svg.append('defs');
      const arrowColor = isDark ? '#475569' : '#94A3B8';
      defs.append('marker')
        .attr('id', 'arrowhead')
        .attr('viewBox', '0 -5 10 10')
        .attr('refX', 28)
        .attr('refY', 0)
        .attr('markerWidth', 6)
        .attr('markerHeight', 6)
        .attr('orient', 'auto')
        .append('path')
        .attr('d', 'M0,-5L10,0L0,5')
        .attr('fill', arrowColor);

      g = svg.append('g');

      zoom = d3.zoom()
        .scaleExtent([0.3, 3])
        .on('zoom', (event) => g.attr('transform', event.transform));
      svg.call(zoom);
    }

    function renderGraph(data) {
      currentGraphData = data;
      initGraph();

      const container = document.getElementById('graphContainer');
      const width = container.clientWidth;
      const height = container.clientHeight;
      const colorMap = getColorMap();

      simulation = d3.forceSimulation(data.nodes)
        .force('link', d3.forceLink(data.links).id(d => d.id).distance(120))
        .force('charge', d3.forceManyBody().strength(-400))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collide', d3.forceCollide().radius(d => d.radius + 15));

      const link = g.append('g').attr('class', 'links')
        .selectAll('line')
        .data(data.links)
        .join('line')
        .attr('stroke', isDark ? '#475569' : '#CBD5E1')
        .attr('stroke-width', 1.5)
        .attr('stroke-opacity', 0.6)
        .attr('marker-end', 'url(#arrowhead)');

      const linkLabel = g.append('g').attr('class', 'link-labels')
        .selectAll('g')
        .data(data.links)
        .join('g');

      linkLabel.append('rect')
        .attr('rx', 4).attr('ry', 4)
        .attr('fill', isDark ? '#1E293B' : '#FFFFFF')
        .attr('stroke', isDark ? '#334155' : '#E2E8F0')
        .attr('stroke-width', 0.5);

      linkLabel.append('text')
        .text(d => d.type)
        .attr('font-size', 10)
        .attr('fill', isDark ? '#94A3B8' : '#64748B')
        .attr('text-anchor', 'middle')
        .attr('dy', '0.35em');

      const node = g.append('g').attr('class', 'nodes')
        .selectAll('g')
        .data(data.nodes)
        .join('g')
        .call(d3.drag()
          .on('start', dragstarted)
          .on('drag', dragged)
          .on('end', dragended));

      node.append('circle')
        .attr('r', 0)
        .attr('fill', d => colorMap[d.group] || colorMap.concept)
        .attr('stroke', d => colorMap[d.group] || colorMap.concept)
        .attr('stroke-width', 2)
        .attr('opacity', 0.9)
        .transition().duration(600).delay((d, i) => i * 50)
        .ease(d3.easeElasticOut.amplitude(1).period(0.4))
        .attr('r', d => d.radius);

      node.append('text')
        .text(d => d.id)
        .attr('font-size', d => d.importance === 3 ? 12 : 10)
        .attr('font-weight', d => d.importance === 3 ? 600 : 400)
        .attr('fill', '#FFFFFF')
        .attr('text-anchor', 'middle')
        .attr('dy', '0.35em')
        .attr('pointer-events', 'none')
        .style('text-shadow', '0 1px 2px rgba(0,0,0,0.5)')
        .style('opacity', 0)
        .transition().duration(400).delay((d, i) => 300 + i * 50)
        .style('opacity', 1);

      node.on('mouseover', function(event, d) {
        d3.select(this).select('circle')
          .transition().duration(200)
          .attr('r', d.radius * 1.3)
          .attr('opacity', 1);
        link.attr('stroke-opacity', l => (l.source.id === d.id || l.target.id === d.id) ? 1 : 0.1);
        link.attr('stroke-width', l => (l.source.id === d.id || l.target.id === d.id) ? 2.5 : 1.5);
        node.style('opacity', n => (n.id === d.id || isConnected(d, n, data.links)) ? 1 : 0.3);
      })
      .on('mouseout', function(event, d) {
        d3.select(this).select('circle')
          .transition().duration(200)
          .attr('r', d.radius)
          .attr('opacity', 0.9);
        link.attr('stroke-opacity', 0.6).attr('stroke-width', 1.5);
        node.style('opacity', 1);
      })
      .on('click', (event, d) => showNodeDetail(d, data.links));

      simulation.on('tick', () => {
        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);

        linkLabel.attr('transform', d => {
          const x = (d.source.x + d.target.x) / 2;
          const y = (d.source.y + d.target.y) / 2;
          return `translate(${x},${y})`;
        });

        linkLabel.selectAll('rect')
          .attr('x', d => -((d.type.length * 10 + 8) / 2))
          .attr('y', -9)
          .attr('width', d => d.type.length * 10 + 8)
          .attr('height', 18);

        node.attr('transform', d => `translate(${d.x},${d.y})`);
      });

      function isConnected(a, b, links) {
        return links.some(l => (l.source.id === a.id && l.target.id === b.id) || (l.source.id === b.id && l.target.id === a.id));
      }

      function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      }
      function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
      function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
      }
    }

    // ==================== 节点详情浮层 ====================
    const detailPanel = document.getElementById('detailPanel');
    const detailTitle = document.getElementById('detailTitle');
    const detailContent = document.getElementById('detailContent');
    const detailClose = document.getElementById('detailClose');

    detailClose.addEventListener('click', () => detailPanel.classList.remove('open'));

    function showNodeDetail(nodeData, links) {
      detailPanel.classList.add('open');
      detailTitle.textContent = nodeData.id;

      const relatedLinks = links.filter(l => l.source.id === nodeData.id || l.target.id === nodeData.id);
      const upstream = relatedLinks.filter(l => l.target.id === nodeData.id);
      const downstream = relatedLinks.filter(l => l.source.id === nodeData.id);

      const typeLabels = {
        core: '核心概念', concept: '概念', sub: '子概念',
        person: '人物', time: '时间', todo: '待办事项', risk: '风险点'
      };

      const colorMap = getColorMap();
      const tagColor = colorMap[nodeData.group] || colorMap.concept;

      detailContent.innerHTML = `
        <div class="detail-section">
          <div class="detail-section-title">节点类型</div>
          <span class="detail-tag" style="background:${tagColor}22;color:${tagColor}">
            ${typeLabels[nodeData.group] || '概念'}
          </span>
        </div>
        ${upstream.length ? `
        <div class="detail-section">
          <div class="detail-section-title">上游关系</div>
          <div class="detail-section-body">
            ${upstream.map(l => `<div>• ${l.source.id} <b>${l.type}</b> → ${l.target.id}</div>`).join('')}
          </div>
        </div>` : ''}
        ${downstream.length ? `
        <div class="detail-section">
          <div class="detail-section-title">下游关系</div>
          <div class="detail-section-body">
            ${downstream.map(l => `<div>• ${l.source.id} <b>${l.type}</b> → ${l.target.id}</div>`).join('')}
          </div>
        </div>` : ''}
        <div class="detail-section">
          <div class="detail-section-title">原文定位</div>
          <div class="detail-section-body" style="color:var(--text-secondary);font-size:13px;">
            该概念在原文中被识别为"${typeLabels[nodeData.group] || '关键词'}"，与${relatedLinks.length}个其他概念存在关联。
          </div>
        </div>
      `;
    }

    // ==================== 输入面板交互 ====================
    const textInput = document.getElementById('textInput');
    const charCount = document.getElementById('charCount');
    const generateBtn = document.getElementById('generateBtn');
    const progressContainer = document.getElementById('progressContainer');
    const exampleCards = document.querySelectorAll('.example-card');

    textInput.addEventListener('input', () => {
      charCount.textContent = `${textInput.value.length} 字`;
    });

    exampleCards.forEach(card => {
      card.addEventListener('click', () => {
        exampleCards.forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        const example = EXAMPLES[card.dataset.example];
        if (example) {
          textInput.value = example.text;
          charCount.textContent = `${example.text.length} 字`;
        }
      });
    });

    generateBtn.addEventListener('click', async () => {
      const text = textInput.value.trim();
      if (text.length < 50) {
        alert('请输入至少50字的笔记内容');
        return;
      }

      generateBtn.disabled = true;
      generateBtn.classList.add('loading');
      generateBtn.innerHTML = `<span style="display:inline-block;animation:spin 1s linear infinite;">⟳</span> AI解析中...`;
      progressContainer.style.display = 'flex';
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('graphContainer').style.display = 'block';
      detailPanel.classList.remove('open');

      const steps = ['step1', 'step2', 'step3'];
      for (let i = 0; i < steps.length; i++) {
        steps.forEach((s, idx) => {
          const el = document.getElementById(s);
          el.classList.remove('active', 'done');
          if (idx < i) el.classList.add('done');
          else if (idx === i) el.classList.add('active');
        });
        await new Promise(r => setTimeout(r, 1200));
      }
      document.getElementById('step3').classList.add('done');

      const graphData = extractFromText(text);
      renderGraph(graphData);

      generateBtn.disabled = false;
      generateBtn.classList.remove('loading');
      generateBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>重新生成`;
    });

    // ==================== 工具栏功能 ====================
    document.getElementById('btnRelayout').addEventListener('click', () => {
      if (currentGraphData && simulation) {
        simulation.alpha(1).restart();
      }
    });

    document.getElementById('btnDownload').addEventListener('click', () => {
      const svgEl = document.getElementById('graphSvg');
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svgEl);
      if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
        source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
      }
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = '知识图谱.svg';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });

    document.getElementById('btnFullscreen').addEventListener('click', () => {
      const container = document.getElementById('graphContainer');
      if (!document.fullscreenElement) {
        container.requestFullscreen?.() || container.webkitRequestFullscreen?.();
      } else {
        document.exitFullscreen?.() || document.webkitExitFullscreen?.();
      }
    });

    // ==================== 主题切换 ====================
    const themeToggle = document.getElementById('themeToggle');

    themeToggle.addEventListener('click', () => {
      isDark = !isDark;
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : '');
      themeToggle.textContent = isDark ? '☀️' : '🌙';
      if (currentGraphData) {
        setTimeout(() => renderGraph(currentGraphData), 50);
      }
    });

    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      isDark = true;
      document.documentElement.setAttribute('data-theme', 'dark');
      themeToggle.textContent = '☀️';
    }

    // ==================== 窗口缩放 ====================
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (currentGraphData) {
          renderGraph(currentGraphData);
        }
      }, 300);
    });
  </script>
</body>
</html>
