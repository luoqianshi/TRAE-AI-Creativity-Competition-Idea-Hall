<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5v5 战略战棋演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0c10;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #e8e8e8;
  }
  #gameCanvas { display: block; }
  .panel {
    position: absolute;
    background: rgba(12,14,19,0.88);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 10px;
    padding: 10px 14px;
    pointer-events: auto;
  }
  #topPanel {
    top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  #topPanel > div { pointer-events: auto; }
  #phaseBox { min-width: 200px; }
  #phaseBox h1 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  #phaseBox p { font-size: 12px; opacity: 0.85; line-height: 1.6; }
  #timer {
    font-size: 32px; font-weight: 800; color: #ffd54f; margin-top: 6px;
    font-family: 'Consolas', 'Courier New', monospace;
    text-shadow: 0 0 8px rgba(255,213,79,0.4);
  }
  #timer.urgent { color: #e74c3c; text-shadow: 0 0 12px rgba(231,76,60,0.6); animation: pulse 0.5s infinite alternate; }
  @keyframes pulse { from { opacity: 1; } to { opacity: 0.6; } }
  #teamBox { min-width: 220px; text-align: right; }
  #teamBox .barWrap { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-bottom: 4px; font-size: 12px; }
  #teamBox .bar { width: 120px; height: 8px; background: rgba(255,255,255,0.12); border-radius: 4px; overflow: hidden; }
  #teamBox .fill { height: 100%; width: 100%; transition: width 0.2s; }
  .redFill { background: #e74c3c; }
  .blueFill { background: #4a90e2; }

  #resourcePanel {
    bottom: 12px; left: 12px;
    display: flex; gap: 14px;
    font-size: 13px;
  }
  #resourcePanel span { display: flex; align-items: center; gap: 4px; }
  .res-gold { color: #ffd54f; }
  .res-ore { color: #90a4ae; }
  .res-wood { color: #8d6e63; }
  .res-food { color: #81c784; }

  #recruitPanel {
    bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
    max-height: 180px; overflow: hidden;
  }
  #recruitPanel.active { opacity: 1; pointer-events: auto; }
  .card {
    width: 86px; background: rgba(30,35,43,0.95);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
    padding: 8px 4px; text-align: center; cursor: pointer;
    transition: transform 0.1s, border-color 0.1s;
  }
  .card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.35); }
  .card.disabled { opacity: 0.45; cursor: not-allowed; }
  .card .cls { font-size: 13px; font-weight: 600; }
  .card .cost { font-size: 10px; opacity: 0.8; margin-top: 3px; }
  .card .hp-list { font-size: 9px; margin-top: 2px; color: #8bc34a; line-height: 1.3; max-height: 40px; overflow: hidden; }

  #actionPanel {
    bottom: 12px; right: 12px;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
  }
  #actionPanel button {
    padding: 8px 18px; font-size: 13px; border: none; border-radius: 6px;
    background: #4a90e2; color: #fff; cursor: pointer;
  }
  #actionPanel button:disabled { background: #555; cursor: not-allowed; }

  /* 招募卡片立绘 */
  .card { width: 92px; }
  .card .portrait {
    width: 60px; height: 60px;
    object-fit: cover;
    border-radius: 6px;
    margin: 0 auto 4px;
    display: block;
    background: rgba(255,255,255,0.05);
  }

  /* 商店面板 */
  #shopPanel {
    bottom: 200px; left: 50%; transform: translateX(-50%);
    min-width: 440px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  #shopPanel.active { opacity: 1; pointer-events: auto; }
  .shopHeader { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .shopHeader .tierName { font-weight: 600; color: #ffd54f; }
  .shopHeader button {
    padding: 4px 10px; font-size: 11px;
    border: none; border-radius: 4px; background: #4a90e2; color: #fff; cursor: pointer;
  }
  .shopHeader button:disabled { background: #555; cursor: not-allowed; }
  .shopHeader .spacer { flex: 1; }
  .shopSlots { display: flex; gap: 6px; flex-wrap: wrap; }
  .shopSlot {
    width: 66px; background: rgba(30,35,43,0.95);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 6px;
    padding: 4px 2px; text-align: center; cursor: pointer;
    transition: transform 0.1s, border-color 0.1s;
  }
  .shopSlot:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.35); }
  .shopSlot.empty { opacity: 0.25; cursor: default; }
  .shopSlot.empty:hover { transform: none; }
  .shopSlot.disabled { opacity: 0.45; cursor: not-allowed; }
  .shopSlot .sName { font-size: 11px; font-weight: 600; }
  .shopSlot .sPrice { font-size: 10px; color: #ffd54f; margin-top: 2px; }
  .shopSlot .sPrice.discount { color: #4caf50; }
  .shopBag { margin-top: 6px; font-size: 11px; color: #aaa; max-width: 440px; line-height: 1.5; }

  /* 赠送面板 */
  #giftPanel {
    top: 140px; left: 12px; width: 190px;
    font-size: 12px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  #giftPanel.active { opacity: 1; pointer-events: auto; }
  #giftPanel .giftTitle { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #ffd54f; }
  #giftPanel label { display: block; margin: 4px 0 2px; opacity: 0.85; }
  #giftPanel select, #giftPanel input {
    width: 100%; padding: 3px 4px; font-size: 12px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px; color: #e8e8e8;
  }
  #giftPanel button {
    margin-top: 6px; width: 100%; padding: 5px; font-size: 12px;
    border: none; border-radius: 4px; background: #4caf50; color: #fff; cursor: pointer;
  }
  #giftPanel button:disabled { background: #555; cursor: not-allowed; }
  #giftMsg { margin-top: 4px; font-size: 11px; color: #ff9800; min-height: 14px; }

  #tileInfo {
    top: 10px; left: 50%; transform: translateX(-50%);
    font-size: 12px; text-align: center; opacity: 0; transition: opacity 0.2s;
  }
  #tileInfo.active { opacity: 1; }

  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.75);
    text-align: center; pointer-events: auto;
  }
  #overlay h2 { font-size: 34px; margin-bottom: 10px; }
  #overlay p { font-size: 14px; opacity: 0.85; }
  #overlay button {
    margin-top: 16px; padding: 10px 28px;
    font-size: 15px; border: none; border-radius: 6px;
    background: #4caf50; color: #fff; cursor: pointer;
  }
  .hidden { display: none !important; }

  /* 阶段切换横幅 */
  #phaseBanner {
    position: absolute;
    top: 35%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.85);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 16px;
    padding: 24px 60px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 100;
  }
  #phaseBanner.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  #phaseBanner .bannerTurn { font-size: 14px; color: #aaa; margin-bottom: 4px; }
  #phaseBanner .bannerPhase { font-size: 32px; font-weight: 700; color: #ffd54f; }
  #phaseBanner .bannerHint { font-size: 13px; color: #ccc; margin-top: 8px; }

  /* 阶段标识色条 */
  #phaseBar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    z-index: 50;
  }
  #phaseBar.move { background: linear-gradient(90deg, #4a90e2, #64b5f6); }
  #phaseBar.deploy { background: linear-gradient(90deg, #ffa726, #ffb74d); }
  #phaseBar.combat { background: linear-gradient(90deg, #e74c3c, #ef5350); }

  /* 战斗结果浮窗 */
  #combatResult {
    position: absolute;
    top: 50%; right: 20px;
    transform: translateY(-50%);
    background: rgba(12,14,19,0.92);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 12px;
    max-width: 220px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
    z-index: 40;
  }
  #combatResult.active { opacity: 1; }
  #combatResult .crTitle { font-size: 14px; font-weight: 600; color: #ffd54f; margin-bottom: 6px; }
  #combatResult .crRow { display: flex; justify-content: space-between; margin: 2px 0; }
  #combatResult .crRed { color: #e74c3c; }
  #combatResult .crBlue { color: #4a90e2; }

  /* 军队栏：独立士兵卡牌列表（部署阶段常驻侧边） */
  #recruitPanel { flex-wrap: wrap; }
  #armyList {
    position: absolute;
    left: 8px; top: 50%; transform: translateY(-50%);
    width: 130px; max-height: 60vh; overflow-y: auto;
    background: rgba(20,24,30,0.92);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; padding: 6px;
    z-index: 50;
    display: none;
    flex-direction: column; gap: 4px;
  }
  #armyList.active { display: flex; }
  .army-card { width: 100%; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 2px; text-align: center; cursor: pointer; background: rgba(0,0,0,0.4); }
  .army-card.selected { border-color: #ffd54f; box-shadow: 0 0 8px rgba(255,213,79,0.5); }
  .army-card img { width: 36px; height: 36px; border-radius: 50%; }
  .army-card .hp-bar { height: 3px; background: #333; border-radius: 2px; margin-top: 2px; }
  .army-card .hp-fill { height: 100%; background: #4caf50; border-radius: 2px; }
  .army-card .lbl { font-size: 9px; color: #ccc; }

  /* 模态遮罩 */
  #modalOverlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
  }
  /* 招募/商店/赠送面板改为模态弹窗 */
  #recruitPanel, #shopPanel, #giftPanel {
    z-index: 201;
  }
  #recruitPanel {
    bottom: auto; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    max-height: 70vh; overflow-y: auto;
    background: rgba(20,24,30,0.98);
    padding: 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  #shopPanel {
    bottom: auto; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    max-height: 70vh; overflow-y: auto;
    background: rgba(20,24,30,0.98);
    padding: 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  #giftPanel {
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 220px;
    background: rgba(20,24,30,0.98);
    padding: 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .modal-close {
    position: absolute; top: 6px; right: 8px;
    width: 24px; height: 24px; line-height: 22px;
    text-align: center; cursor: pointer;
    color: #aaa; font-size: 18px; border-radius: 4px;
  }
  .modal-close:hover { color: #fff; background: rgba(255,255,255,0.1); }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="phaseBar" class="move"></div>

<div id="phaseBanner">
  <div class="bannerTurn" id="bannerTurn">第 1 回合</div>
  <div class="bannerPhase" id="bannerPhase">移动阶段</div>
  <div class="bannerHint" id="bannerHint">点击相邻地块移动</div>
</div>

<div id="combatResult">
  <div class="crTitle" id="crTitle">战斗结果</div>
  <div id="crBody"></div>
</div>

<div id="topPanel">
  <div class="panel" id="phaseBox">
    <h1>第 <span id="turnNum">1</span> 回合 · <span id="phaseName">移动阶段</span></h1>
    <p id="phaseHint">点击相邻地块移动你的军队（每回合最多2步）。</p>
    <div id="timer">15.0</div>
  </div>
  <div class="panel" id="teamBox">
    <div class="barWrap"><span>红基地</span><div class="bar"><div id="redBaseFill" class="fill redFill"></div></div><span id="redBaseText">100%</span></div>
    <div class="barWrap"><span>蓝基地</span><div class="bar"><div id="blueBaseFill" class="fill blueFill"></div></div><span id="blueBaseText">100%</span></div>
    <p id="forceText" style="margin-top:4px;font-size:11px;opacity:.8">红方 5 人 / 蓝方 5 人</p>
  </div>
</div>

<div class="panel" id="tileInfo">
  <span id="tileName">-</span> · 归属 <span id="tileOwner">-</span> · 兵力 红<span id="tileRed">0</span> 蓝<span id="tileBlue">0</span>
</div>

<div class="panel" id="resourcePanel">
  <span class="res-gold">金 <b id="resGold">200</b></span>
  <span class="res-ore">矿 <b id="resOre">120</b></span>
  <span class="res-wood">木 <b id="resWood">60</b></span>
  <span class="res-food">粮 <b id="resFood">80</b></span>
</div>

<div class="panel" id="recruitPanel">
  <div class="modal-close" data-close="recruit">×</div>
  <div class="card" data-cls="warrior"><img class="portrait" data-cls="warrior" alt="战士"><div class="cls">战士</div><div class="cost">金12 矿4 粮6</div><div class="hp-list" id="hpWarrior"></div></div>
  <div class="card" data-cls="archer"><img class="portrait" data-cls="archer" alt="弓兵"><div class="cls">弓兵</div><div class="cost">金16 矿8 粮6</div><div class="hp-list" id="hpArcher"></div></div>
  <div class="card" data-cls="assassin"><img class="portrait" data-cls="assassin" alt="刺客"><div class="cls">刺客</div><div class="cost">金20 矿10 粮8</div><div class="hp-list" id="hpAssassin"></div></div>
  <div class="card" data-cls="mage"><img class="portrait" data-cls="mage" alt="法师"><div class="cls">法师</div><div class="cost">金18 矿12 粮7</div><div class="hp-list" id="hpMage"></div></div>
  <div class="card" data-cls="tank"><img class="portrait" data-cls="tank" alt="坦克"><div class="cls">坦克</div><div class="cost">金24 矿12 粮10</div><div class="hp-list" id="hpTank"></div></div>
</div>

<!-- 军队栏：部署阶段常驻侧边 -->
<div id="armyList" class="army-list"></div>

<div class="panel" id="shopPanel">
  <div class="modal-close" data-close="shop">×</div>
  <div class="shopHeader">
    <span class="tierName" id="shopTierName">初级商人</span>
    <span class="spacer"></span>
    <button id="btnRefreshShop">刷新</button>
    <button id="btnUpgradeShop">升级</button>
  </div>
  <div class="shopSlots" id="shopSlots"></div>
  <div class="shopBag" id="shopBag">背包：空</div>
</div>

<div class="panel" id="giftPanel">
  <div class="modal-close" data-close="gift">×</div>
  <div class="giftTitle">物资赠送</div>
  <label>同格/邻格队友</label>
  <select id="giftTarget"></select>
  <label>资源类型</label>
  <select id="giftRes">
    <option value="gold">金币</option>
    <option value="ore">矿石</option>
    <option value="wood">木材</option>
    <option value="food">粮食</option>
  </select>
  <label>数量 (1-99999)</label>
  <input id="giftAmount" type="number" min="1" max="99999" value="10">
  <button id="btnGift">赠送</button>
  <div id="giftMsg"></div>
</div>

<div class="panel" id="actionPanel">
  <button id="btnMove" disabled>确认移动</button>
  <button id="btnDeploy" disabled>完成部署</button>
  <button id="btnOpenRecruit">招募</button>
  <button id="btnOpenShop">商店</button>
  <button id="btnOpenGift">赠送</button>
</div>

<!-- 模态遮罩 -->
<div id="modalOverlay" class="hidden"></div>

<div id="overlay" class="hidden">
  <h2 id="resultText"></h2>
  <p>点击按钮重新开始</p>
  <button id="restartBtn">重新开始</button>
</div>

<script>
(function() {
  'use strict';
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // ===== 常量：对齐文档 / Godot / 后端 =====
  const TEAM_RED = 'red';
  const TEAM_BLUE = 'blue';
  const PHASES = ['Move', 'Deploy', 'Combat'];
  const PHASE_NAMES = { Move:'移动阶段', Deploy:'部署阶段', Combat:'战斗阶段' };
  const PHASE_HINTS = {
    Move: '点击相邻地块移动（最多2步）；下方可招募士兵，时间到未提交则停留原地。',
    Deploy: '购买军队卡片和商店道具，士兵自动部署到当前地块的己方半区。',
    Combat: '地块上若双方均有兵则自动战斗；基地被摧毁或一方全灭即判负。'
  };
  const PHASE_SECONDS = { Move:12, Deploy:18, Combat:12 };

  const BASE_HP = 100000;
  const BASE_DAMAGE_PER_SOLDIER = 5000;
  const MAX_SOLDIERS_PER_PLAYER = 20;
  const INITIAL_GOLD = 200, INITIAL_ORE = 120, INITIAL_WOOD = 60, INITIAL_FOOD = 80;

  // 商店三级商品池（与后端 shop.go shopTiers 一致）
  const SHOP_TIERS = [
    { name:'初级商人', items:[
      {id:'bandage',name:'绷带',price:20}, {id:'ration',name:'口粮',price:10},
      {id:'ore_chunk',name:'矿石块',price:12}, {id:'eq_c_blade',name:'铁剑',price:25},
      {id:'eq_c_bow',name:'铁弓',price:28}, {id:'eq_c_plate',name:'铁甲',price:24},
      {id:'eq_c_belt',name:'皮带',price:20},
    ]},
    { name:'中级商人', items:[
      {id:'bandage',name:'绷带',price:20}, {id:'ration',name:'口粮',price:10},
      {id:'ore_chunk',name:'矿石块',price:12}, {id:'eq_c_blade',name:'铁剑',price:25},
      {id:'eq_c_bow',name:'铁弓',price:28}, {id:'eq_c_core',name:'核心',price:26},
      {id:'eq_c_plate',name:'铁甲',price:24}, {id:'eq_c_cloak',name:'斗篷',price:23},
      {id:'eq_c_belt',name:'皮带',price:20}, {id:'eq_c_lens',name:'透镜',price:30},
      {id:'eq_c_order',name:'令牌',price:32},
    ]},
    { name:'高级商人', items:[
      {id:'bandage',name:'绷带',price:18}, {id:'ration',name:'口粮',price:8},
      {id:'ore_chunk',name:'矿石块',price:10}, {id:'eq_c_blade',name:'铁剑',price:22},
      {id:'eq_c_bow',name:'铁弓',price:25}, {id:'eq_c_core',name:'核心',price:23},
      {id:'eq_c_plate',name:'铁甲',price:21}, {id:'eq_c_cloak',name:'斗篷',price:20},
      {id:'eq_c_belt',name:'皮带',price:18}, {id:'eq_c_lens',name:'透镜',price:27},
      {id:'eq_c_order',name:'令牌',price:29},
    ]},
  ];
  const SHOP_SLOT_COUNT = 6;
  const SHOP_UPGRADE_COSTS = [50, 150]; // Lv0->Lv1: 50金, Lv1->Lv2: 150金
  const SHOP_REFRESH_COST = [5, 5, 3];  // Lv0/1: 5金, Lv2: 3金

  // 兵种表：与后端 soldier/types.go 一致
  const CLASS_STATS = {
    warrior: { name:'战士', hp:2400, atk:22, def:18, range:1, moveSpeed:1.10, atkSpeed:1.00, crit:0.05, classKey:'warrior', proto:'inf' },
    archer:  { name:'弓兵', hp:1600, atk:26, def:8,  range:3, moveSpeed:1.00, atkSpeed:1.15, crit:0.10, classKey:'archer',  proto:'arch' },
    assassin:{ name:'刺客', hp:1700, atk:30, def:10, range:1, moveSpeed:1.60, atkSpeed:1.20, crit:0.18, classKey:'assassin',proto:'asn' },
    mage:    { name:'法师', hp:1500, atk:32, def:6,  range:3, moveSpeed:0.95, atkSpeed:1.05, crit:0.08, classKey:'mage',    proto:'mage' },
    tank:    { name:'坦克', hp:3400, atk:15, def:35, range:1, moveSpeed:0.80, atkSpeed:0.85, crit:0.03, classKey:'tank',    proto:'cav' },
  };
  // 兵种 key 与 uid 前缀的映射（与后端 proto 一致）
  const CLASS_KEY_TO_PREFIX = { warrior:'inf', archer:'arch', assassin:'asn', mage:'mage', tank:'cav' };

  function resize() {

    canvas.width = W; canvas.height = H;

    tileSize = Math.min(W / 7, H / 6.5, 55);
    // 地块群几何中心：q≈1.0, r=1.5（x 像素范围 sqrt(3)*0.5 ~ sqrt(3)*3）
    const cx = hexAxialToPixel(1.0, 1.5, tileSize);

  // ===== 六角工具 =====
  function hexAxialToPixel(q, r, size) {
    return {
      x: size * Math.sqrt(3) * (q + r/2),
      y: size * 1.5 * r
    };
  }
  function hexCorners(cx, cy, size) {
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const ang = Math.PI/180 * (60*i - 30);
      pts.push({ x: cx + size * Math.cos(ang), y: cy + size * Math.sin(ang) });
    }
    return pts;
  }
  function drawHexPath(cx, cy, size) {
    const pts = hexCorners(cx, cy, size);
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
  }
  function insideBattleGrid(q, r) {
    const s = -q - r;
    return Math.max(Math.abs(q), Math.abs(r), Math.abs(s)) <= BATTLE_RADIUS;
  }
  function buildCluster(R) {
    const out = [];
    for (let q = -R; q <= R; q++) {
      const r1 = Math.max(-R, -q - R), r2 = Math.min(R, -q + R);
      for (let r = r1; r <= r2; r++) out.push({q, r});
    }
    return out;
  }
  const BATTLE_CELLS = buildCluster(BATTLE_RADIUS);
  const HEX_DIRS = [
    {q:1,r:0},{q:1,r:-1},{q:0,r:-1},{q:-1,r:0},{q:-1,r:1},{q:0,r:1}
  ];
  function hexDist(a, b) {
    return (Math.abs(a.q-b.q) + Math.abs(a.q+a.r-b.q-b.r) + Math.abs(a.r-b.r)) / 2;
  }

  // ===== 初始化 =====
  // 创建一个独立士兵实例（独立 HP/XP/坐标/uid）
  function createSoldier(owner, classKey) {
    const s = CLASS_STATS[classKey];
    const prefix = CLASS_KEY_TO_PREFIX[classKey];
    const uid = prefix + '-' + (owner.nextUnitNo++);
    return {
      uid, classKey, ownerId: owner.id,
      hp: s.hp, maxHp: s.hp, xp: 0,
      q: 0, r: 0, alive: true,
      atkCd: 0, moveCd: 0, hateTargetId: '',
      morale: 50, fatigue: 0,
    };
  }
  function createPlayer(id, name, team, tile, isBot) {
    const p = {
      id, name, team, tile, isBot, alive: true,
      gold: INITIAL_GOLD, ore: INITIAL_ORE, wood: INITIAL_WOOD, food: INITIAL_FOOD,
      units: [],         // 场上士兵实例数组
      reserveUnits: [],  // 后备士兵实例数组
      deployStaging: [], // 部署暂存数组（{uid, q, r}）
      nextUnitNo: 1,     // 士兵实例编号计数器
      pendingUnits: [],  // 战斗阶段招募暂存（下一部署阶段入场）
      moveTarget: null,
      moveSubmitted: false,
      deployDone: false,
      shopLevel: 0, shopSlots: [], bag: {},
    };
    // 初始 3 名士兵：1 弓箭手 + 2 战士

    p.reserveUnits.push(createSoldier(p, 'warrior'));
    p.reserveUnits.push(createSoldier(p, 'archer'));
    return p;
  }

  function initGame() {
    tiles = MAP_TILES.map(t => ({...t, players: [], redCount:0, blueCount:0, deployedUnits: []}));

  function addPlayerToTile(p, tileId) {
    p.tile = tileId;
    const t = tiles[tileId];
    if (!t.players.includes(p.id)) t.players.push(p.id);
    recountTile(tileId);
  }
  function removePlayerFromTile(p, tileId) {
    const t = tiles[tileId];
    t.players = t.players.filter(pid => pid !== p.id);
    recountTile(tileId);
  }
  function recountTile(tileId) {
    const t = tiles[tileId];
    t.redCount = t.players.filter(pid => getPlayer(pid).team === TEAM_RED).length;
    t.blueCount = t.players.filter(pid => getPlayer(pid).team === TEAM_BLUE).length;
  }
  function getPlayer(id) { return players.find(p => p.id === id); }

  // ===== 阶段推进 =====

  // ===== 地块归属 =====
  function applyOwnershipAtDeployStart() {
    tiles.forEach(t => {
      if (t.hasRedBase || t.hasBlueBase) return; // 基地格不自动易主
      if (t.redCount > 0 && t.blueCount === 0) t.owner = TEAM_RED;
      else if (t.blueCount > 0 && t.redCount === 0) t.owner = TEAM_BLUE;
    });
  }

  function applyResourceYields() {
    players.forEach(p => {
      if (!p.alive) return;
      const t = tiles[p.tile];
      if (t.owner === p.team && t.resource) {
        p.gold += t.resource.goldPerRound || 0;
        p.ore  += t.resource.orePerRound  || 0;
        p.wood += t.resource.woodPerRound || 0;
        p.food += t.resource.foodPerRound || 0;
      }
    });
  }

  function consumeRations() {
    players.forEach(p => {
      if (!p.alive) return;
      const total = totalLivingSoldiers(p);
      if (total === 0) return;
      const cost = total;  // 每兵1粮
      if (p.food < cost) {
        // 食物不足：士气下降，可能饿死士兵
        const deficit = cost - p.food;
        p.food = 0;
        // 全军士气下降
        p.units.forEach(u => { if (u.alive) u.morale = Math.max(0, (u.morale || 50) - 10); });
        p.reserveUnits.forEach(u => { if (u.alive) u.morale = Math.max(0, (u.morale || 50) - 10); });
        // 30% 概率饿死一名士兵（优先扣血）
        if (deficit > 0 && Math.random() < 0.3) {
          const allUnits = [...p.units, ...p.reserveUnits].filter(u => u.alive);
          if (allUnits.length > 0) {
            const victim = allUnits[Math.floor(Math.random() * allUnits.length)];
            victim.hp = Math.max(0, victim.hp - 500);
            if (victim.hp <= 0) victim.alive = false;
          }
        }
      } else {
        p.food -= cost;
      }
    });
  }

  // 总存活士兵数 = 场上存活 + 后备 + 部署暂存 + 战斗阶段招募暂存
  function totalLivingSoldiers(p) {
    const aliveOnField = (p.units || []).filter(u => u.alive).length;
    return aliveOnField + (p.reserveUnits || []).length + (p.deployStaging || []).length + (p.pendingUnits || []).length;
  }

  function totalRoster(p) {
    return totalLivingSoldiers(p);
  }

  // ===== 移动逻辑 =====
  function reachableTiles(fromId, steps, team) {
    const visited = new Set([fromId]);
    let frontier = new Set([fromId]);
    for (let s = 0; s < steps; s++) {
      const next = new Set();
      frontier.forEach(id => {
        tiles[id].neighbors.forEach(nid => {
          // 路径中间不能是敌方归属格（终点可以是）；中立或己方归属可穿越
          if (s < steps - 1 && tiles[nid].owner !== 'neutral' && tiles[nid].owner !== team) return;
          next.add(nid);
          visited.add(nid);
        });
      });
      frontier = next;
    }
    return Array.from(visited);
  }

  function submitMove(p, targetId) {
    if (phaseName !== 'Move' || p.moveSubmitted) return;
    const reach = reachableTiles(p.tile, 2, p.team);
    if (!reach.includes(targetId)) return;
    // 同格同方上限 15（demo 中不会触发）
    const t = tiles[targetId];
    const sameTeamCount = t.players.filter(pid => getPlayer(pid).team === p.team).length;
    if (sameTeamCount >= 15) return;
    // 立即执行移动：从旧地块移除，加到新地块（实时反馈）
    if (targetId !== p.tile) {
      removePlayerFromTile(p, p.tile);
      addPlayerToTile(p, targetId);
    }
    p.moveTarget = targetId;
    p.moveSubmitted = true;
    if (p === me) {
      pendingMoveTarget = targetId;
      btnMove.disabled = true;
      // 跟随玩家视角到新地块
      selectedTileId = targetId;
    }
  }

  // ===== 招募 =====
  function canRecruit(p, cls) {
    const cost = RECRUIT_COST[cls];
    const cap = MAX_SOLDIERS_PER_PLAYER - totalRoster(p);
    return cap > 0 && p.gold >= cost.gold && p.ore >= cost.ore && p.food >= cost.food;
  }
  function recruit(p, cls) {
    if (!canRecruit(p, cls)) return false;
    const cost = RECRUIT_COST[cls];
    p.gold -= cost.gold; p.ore -= cost.ore; p.food -= cost.food;
    // 创建独立士兵实例
    const newUnit = createSoldier(p, cls);
    if (phaseName === 'Combat') {
      // 战斗阶段招募暂存到 pendingUnits，下一部署阶段入场
      p.pendingUnits.push(newUnit);
    } else {
      // 部署/移动阶段直接进入后备
      p.reserveUnits.push(newUnit);
    }
    // 部署阶段招募后刷新战术盘预览
    if (phaseName === 'Deploy' || phaseName === 'Move') previewDeployAll();
    if (p === me) renderArmyList();
    return true;
  }

  // ===== 商店 =====
  function refreshShop(p) {
    const tier = SHOP_TIERS[p.shopLevel];
    const pool = tier.items;
    p.shopSlots = [];
    for (let i = 0; i < SHOP_SLOT_COUNT; i++) {
      const base = pool[Math.floor(Math.random() * pool.length)];
      let price = base.price;
      // 高级商人（Lv2）有 0-20% 随机折扣
      if (p.shopLevel >= 2) {
        const discount = Math.random() * 0.2;
        price = Math.max(1, Math.floor(price * (1 - discount)));
      }
      p.shopSlots.push({ id: base.id, name: base.name, price: price, basePrice: base.price });
    }
  }

  function buyItem(p, itemId) {
    const idx = p.shopSlots.findIndex(s => s && s.id === itemId);
    if (idx < 0) return false;
    const slot = p.shopSlots[idx];
    if (p.gold < slot.price) return false;
    p.gold -= slot.price;
    p.bag[slot.id] = (p.bag[slot.id] || 0) + 1;
    p.shopSlots[idx] = null; // 购买后该槽位清空
    return true;
  }

  function upgradeShop(p) {
    if (p.shopLevel >= SHOP_UPGRADE_COSTS.length) return false;
    const cost = SHOP_UPGRADE_COSTS[p.shopLevel];
    if (p.gold < cost) return false;
    p.gold -= cost;
    p.shopLevel++;
    refreshShop(p);
    return true;
  }

  function handleRefreshShop(p) {
    const cost = SHOP_REFRESH_COST[p.shopLevel];
    if (p.gold < cost) return false;
    p.gold -= cost;
    refreshShop(p);
    return true;
  }

  // ===== 赠送资源 =====
  function giftResources(sender, targetPlayerId, resource, amount) {
    const target = getPlayer(targetPlayerId);
    if (!target || !target.alive || !sender.alive) return { ok:false, msg:'玩家无效' };
    if (sender.team !== target.team) return { ok:false, msg:'只能赠送给同队玩家' };
    // 同格或邻格
    const sameTile = sender.tile === target.tile;
    const adjacent = tiles[sender.tile].neighbors.includes(target.tile);
    if (!sameTile && !adjacent) return { ok:false, msg:'目标需在同格或相邻地块' };
    const amt = Math.floor(Number(amount));
    if (!Number.isFinite(amt) || amt < 1 || amt > 99999) return { ok:false, msg:'数量需在 1-99999 之间' };
    if ((sender[resource] || 0) < amt) return { ok:false, msg:'资源不足' };
    sender[resource] -= amt;
    target[resource] = (target[resource] || 0) + amt;
    return { ok:true, msg:`已赠送 ${amt} 给 ${target.name}` };
  }

  // ===== 部署 =====
  // 判定六角格是否属于某方半区（红方 q<0 或 q==0&&r<=0；蓝方 q>0 或 q==0&&r>0）
  function cellBelongsToTeam(q, r, team) {
    if (team === TEAM_RED) return q < 0 || (q === 0 && r <= 0);
    return q > 0 || (q === 0 && r > 0);
  }
  // 玩家手动放置一个后备士兵到战术盘格（仅部署阶段）
  function deployPlace(p, uid, q, r) {
    if (phaseName !== 'Deploy') return false;
    if (!insideBattleGrid(q, r)) return false;
    if (!cellBelongsToTeam(q, r, p.team)) return false;
    // 排除基地固定占位角点
    if ((q === -BATTLE_RADIUS && r === 0) || (q === BATTLE_RADIUS && r === 0)) return false;
    // 必须从后备中选取
    const idx = p.reserveUnits.findIndex(u => u.uid === uid);
    if (idx < 0) return false;
    // 同格不能重复占位
    if (p.deployStaging.some(s => s.q === q && s.r === r)) return false;
    if (p.units.some(u => u.alive && u.q === q && u.r === r)) return false;
    const u = p.reserveUnits.splice(idx, 1)[0];
    u.q = q; u.r = r;
    // ★ 保留 unitRef 引用，避免士兵对象丢失
    p.deployStaging.push({
      tempId: 'd' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      uid: u.uid, classKey: u.classKey, q, r,
      hp: u.hp, xp: u.xp, ownerId: p.id,
      unitRef: u,
    });
    return true;
  }
  // 玩家手动撤回一个已部署暂存士兵到后备（参数可为 uid 或 tempId）
  function deployUnplace(p, id) {
    if (phaseName !== 'Deploy') return false;
    const idx = p.deployStaging.findIndex(s => s.uid === id || s.tempId === id);
    if (idx < 0) return false;
    const staging = p.deployStaging.splice(idx, 1)[0];
    // ★ 用 unitRef 推回 reserveUnits
    if (staging.unitRef) {
      staging.unitRef.q = 0; staging.unitRef.r = 0;
      p.reserveUnits.push(staging.unitRef);
    }
    return true;
  }
  // 在玩家的所有数组中查找某 uid 实例（含 deployStaging.unitRef）
  function findUnitEverywhere(p, uid) {
    for (const u of (p.units || [])) if (u.uid === uid) return u;
    for (const u of (p.reserveUnits || [])) if (u.uid === uid) return u;
    for (const u of (p.pendingUnits || [])) if (u.uid === uid) return u;
    for (const s of (p.deployStaging || [])) if (s.unitRef && s.unitRef.uid === uid) return s.unitRef;
    return null;
  }
  // 阶段末合并：把 deployStaging 中的 unitRef 推入 units，并从暂存移除
  function mergeDeployForPlayer(p) {
    p.deployStaging.forEach(s => {
      const unit = s.unitRef;
      if (!unit) return;
      unit.q = s.q; unit.r = s.r;
      unit.hp = s.hp;
      unit.alive = true;
      p.units.push(unit);
    });
    p.deployStaging = [];
  }
  // 部署阶段预览：把所有玩家的 deployStaging 预摆到战术盘上
  function previewDeployAll() {
    tiles.forEach(t => { t.deployedUnits = []; });
    // 仅在当前战斗格上预览（实际战斗格由玩家所在格决定）
    players.filter(p => p.alive).forEach(p => {
      const t = tiles[p.tile];
      // 已暂存的：直接用 unitRef
      p.deployStaging.forEach(s => {
        const unit = s.unitRef;
        if (!unit) return;
        const st = CLASS_STATS[unit.classKey];
        t.deployedUnits.push({
          team: p.team, classKey: unit.classKey, name: st.name,
          q: s.q, r: s.r, uid: unit.uid, ownerId: p.id,
          hp: s.hp, maxHp: unit.maxHp, atk: st.atk, def: st.def, range: st.range,
          moveSpeed: st.moveSpeed, atkSpeed: st.atkSpeed, crit: st.crit,
          atkCd: 0, moveCd: 0, alive: true, isPreview: true,
          isStaging: true, tempId: s.tempId,
        });
      });
    });
  }
  // 战斗阶段开始时：把所有玩家的 deployStaging 合并到 units，未部署的后备自动摆放
  function autoDeployAll() {
    players.filter(p => p.alive).forEach(p => {
      // 合并手动暂存
      mergeDeployForPlayer(p);
      // 未手动部署的后备士兵自动摆到己方半区空格
      const remaining = p.reserveUnits.slice();
      // 候选格：己方半区，非基地角点
      const candidates = BATTLE_CELLS.filter(c => {
        if (!cellBelongsToTeam(c.q, c.r, p.team)) return false;
        if ((c.q === -BATTLE_RADIUS && c.r === 0) || (c.q === BATTLE_RADIUS && c.r === 0)) return false;
        return true;
      });
      let ci = 0;
      remaining.forEach(u => {
        // 找一个空格
        for (let tries = 0; tries < candidates.length; tries++) {
          const c = candidates[(ci++) % candidates.length];
          const occupied = players.some(pp => pp.alive && (
            pp.units.some(o => o.alive && o.q === c.q && o.r === c.r) ||
            pp.deployStaging.some(s => s.q === c.q && s.r === c.r)
          ));
          if (!occupied) {
            u.q = c.q; u.r = c.r; u.alive = true;
            // 从 reserveUnits 移到 units
            const idx = p.reserveUnits.findIndex(x => x.uid === u.uid);
            if (idx >= 0) p.reserveUnits.splice(idx, 1);
            p.units.push(u);
            break;
          }
        }
      });
    });
    // 把所有场上单位写到对应 tile 的 deployedUnits 供绘制/战斗
    tiles.forEach(t => { t.deployedUnits = []; });
    players.filter(p => p.alive).forEach(p => {
      const t = tiles[p.tile];
      p.units.filter(u => u.alive).forEach(u => {
        const st = CLASS_STATS[u.classKey];
        t.deployedUnits.push({
          team: p.team, classKey: u.classKey, name: st.name,
          q: u.q, r: u.r, uid: u.uid, ownerId: p.id,
          hp: u.hp, maxHp: u.maxHp, atk: st.atk, def: st.def, range: st.range,
          moveSpeed: st.moveSpeed, atkSpeed: st.atkSpeed, crit: st.crit,
          atkCd: 0, moveCd: 0, alive: true,
          morale: u.morale, fatigue: u.fatigue, hateTargetId: u.hateTargetId
        });
      });
    });
  }
  // Bot 自动部署：把后备随机摆到己方半区空格
  function botDeploy(p) {
    if (phaseName !== 'Deploy') return;
    const candidates = BATTLE_CELLS.filter(c => {
      if (!cellBelongsToTeam(c.q, c.r, p.team)) return false;
      if ((c.q === -BATTLE_RADIUS && c.r === 0) || (c.q === BATTLE_RADIUS && c.r === 0)) return false;
      return true;
    });
    let ci = Math.floor(Math.random() * candidates.length);
    p.reserveUnits.slice().forEach(u => {
      for (let tries = 0; tries < candidates.length; tries++) {
        const c = candidates[(ci++) % candidates.length];
        const occupied = players.some(pp => pp.alive && (
          pp.deployStaging.some(s => s.q === c.q && s.r === c.r) ||
          pp.units.some(o => o.alive && o.q === c.q && o.r === c.r)
        ));
        if (!occupied) {
          deployPlace(p, u.uid, c.q, c.r);
          break;
        }
      }
    });
    p.deployDone = true;
  }

  // ===== 战斗结算（在 endPhase 的 Combat 分支调用）=====
  function resolveCombatPhase() {
    // 确保所有战斗事件已应用（快速应用剩余事件）
    applyAllRemainingCombatEvents();
    combatLog = [];
    // 根据 combatEvents 生成战斗日志（before/after 来自快照与最终状态）
    combatEvents.forEach(ce => {
      const t = tiles[ce.tileId];
      if (!t) return;
      // 合入最终状态的 morale/fatigue/xp/hateTargetId（事件未记录的字段）
      if (ce.finalState) {
        t.deployedUnits.forEach((du, i) => {
          const fs = ce.finalState[i];
          if (fs) {
            du.morale = fs.morale;
            du.fatigue = fs.fatigue;
            du.xp = fs.xp;
            du.hateTargetId = fs.hateTargetId;
          }
        });
      }
      const redBefore = ce.snapshot.filter(u => u.team === TEAM_RED).length;
      const blueBefore = ce.snapshot.filter(u => u.team === TEAM_BLUE).length;
      const redAfter = t.deployedUnits.filter(u => u.team === TEAM_RED && u.alive).length;
      const blueAfter = t.deployedUnits.filter(u => u.team === TEAM_BLUE && u.alive).length;
      combatLog.push({ tile: ce.tileName, redBefore, redAfter, blueBefore, blueAfter });
      // 战后：把存活/阵亡状态写回玩家 units 数组
      syncSurvivorsToPlayers(t);
      // 若该格双方均无兵且非基地格，按规则易主
      if (!t.hasRedBase && !t.hasBlueBase) {
        if (redAfter === 0 && blueAfter === 0) t.owner = (t.owner === TEAM_RED ? TEAM_BLUE : TEAM_RED);
      }
    });
    // 基地伤害：站在敌方基地格上的士兵数
    applyBaseDamage();
    // 显示战斗结果浮窗
    showCombatResult();
    // 清空战斗事件
    combatEvents = [];
  }

  function showCombatResult() {
    const elCR = document.getElementById('combatResult');
    const elTitle = document.getElementById('crTitle');
    const elBody = document.getElementById('crBody');
    if (combatLog.length === 0) {
      elTitle.textContent = '本回合无交战';
      elBody.innerHTML = '<div style="color:#aaa">双方未在地块上相遇</div>';
    } else {
      elTitle.textContent = '第 ' + turn + ' 回合战斗结果';
      let html = '';
      combatLog.forEach(e => {
        html += '<div style="margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:4px">';
        html += '<div style="font-weight:600;color:#ddd">' + e.tile + '</div>';
        html += '<div class="crRow"><span class="crRed">红方</span><span>' + e.redBefore + ' → ' + e.redAfter + '</span></div>';
        html += '<div class="crRow"><span class="crBlue">蓝方</span><span>' + e.blueBefore + ' → ' + e.blueAfter + '</span></div>';
        html += '</div>';
      });
      elBody.innerHTML = html;
    }
    elCR.classList.add('active');
    setTimeout(() => elCR.classList.remove('active'), 5000);
  }

  // 六角格 cube 坐标圆整（用于 BFS 寻路）
  function cubeRound(q, r) {
    const s = -q - r;
    let rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
    const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs - s);
    if (dq > dr && dq > ds) rq = -rr - rs;
    else if (dr > ds) rr = -rq - rs;
    return { q: rq, r: rr };
  }
  // 两点六角距离（与 hexDist 等价，独立函数避免歧义）
  function hexDistance(a, b) {
    return (Math.abs(a.q - b.q) + Math.abs(a.q + a.r - b.q - b.r) + Math.abs(a.r - b.r)) / 2;
  }
  // 仇恨目标选择：优先攻击已锁定的 hateTargetId，否则选最近敌人
  function pickHateTarget(u, enemies) {
    if (u.hateTargetId) {
      const ht = enemies.find(e => e.alive && e.uid === u.hateTargetId);
      if (ht) return ht;
    }
    let best = null, bestD = Infinity;
    enemies.forEach(e => {
      const d = hexDistance(u, e);
      if (d < bestD) { bestD = d; best = e; }
    });
    if (best) u.hateTargetId = best.uid;
    return best;
  }
  // BFS 寻路：从 from 到达 to 的攻击范围内，返回下一步应走的格子
  function nextStepToAttackRange(u, target, allUnits) {
    const range = u.range;
    // 目标格：与 target 距离 <= range 的所有可达空格
    const occupied = new Set();
    allUnits.forEach(o => { if (o.alive && o !== u) occupied.add(o.q + ',' + o.r); });
    // BFS
    const startKey = u.q + ',' + u.r;
    if (hexDistance(u, target) <= range) return null; // 已在攻击范围
    const visited = new Set([startKey]);
    const queue = [{ q: u.q, r: u.r, path: [] }];
    while (queue.length > 0) {
      const cur = queue.shift();
      for (const d of HEX_DIRS) {
        const nq = cur.q + d.q, nr = cur.r + d.r;
        if (!insideBattleGrid(nq, nr)) continue;
        const key = nq + ',' + nr;
        if (visited.has(key)) continue;
        visited.add(key);
        // 该格被占则不能穿越也不能作为终点
        if (occupied.has(key)) continue;
        const newPath = cur.path.concat([{ q: nq, r: nr }]);
        // 到达攻击范围
        if (hexDistance({ q: nq, r: nr }, target) <= range) {
          return newPath[0];
        }
        queue.push({ q: nq, r: nr, path: newPath });
      }
      if (queue.length > 200) break; // 防死循环
    }
    return null;
  }
  // 贪心一步移动（BFS 失败时的兜底）
  function greedyStep(u, target, allUnits) {
    const occupied = new Set();
    allUnits.forEach(o => { if (o.alive && o !== u) occupied.add(o.q + ',' + o.r); });
    let bestN = null, bestND = Infinity;
    HEX_DIRS.forEach(d => {
      const nq = u.q + d.q, nr = u.r + d.r;
      if (!insideBattleGrid(nq, nr)) return;
      if (occupied.has(nq + ',' + nr)) return;
      const dd = hexDistance({ q: nq, r: nr }, target);
      if (dd < bestND) { bestND = dd; bestN = { q: nq, r: nr }; }
    });
    return bestN;
  }
  // 战斗 tick 循环：BFS寻路 + 仇恨 + 减伤 + 暴击 + 士气 + 疲劳
  // 返回事件数组 [{tick, events:[{kind, ...}]}]，同时修改 t.deployedUnits 到最终状态
  function simulateTileCombat(t) {
    const events = [];  // 本地块的事件序列
    const TICK = 0.1;
    const MAX_TICKS = 200;
    const units = t.deployedUnits.filter(u => u.alive);
    const hasRed = units.some(u => u.team === TEAM_RED);
    const hasBlue = units.some(u => u.team === TEAM_BLUE);
    if (!hasRed || !hasBlue) return events;
    // 调试：记录初始位置
    console.log('[combat sim] tile', t.id, t.name, 'units:', units.length);
    units.forEach(u => {
      console.log('[combat sim]  ', u.uid, u.classKey, 'team:', u.team, 'pos:(', u.q, ',', u.r, ') range:', u.range, 'moveSpd:', u.moveSpeed);
    });
    let moveAttempts = 0, moveSuccesses = 0, bfsFails = 0;
    for (let tick = 0; tick < MAX_TICKS; tick++) {
      const tickEvents = [];
      let anyAlive = false;
      // 检查双方是否还有人
      const redAlive = units.filter(u => u.alive && u.team === TEAM_RED).length;
      const blueAlive = units.filter(u => u.alive && u.team === TEAM_BLUE).length;
      if (redAlive === 0 || blueAlive === 0) break;
      units.forEach(u => {
        if (!u.alive) return;
        anyAlive = true;
        u.atkCd = Math.max(0, u.atkCd - TICK);
        u.moveCd = Math.max(0, u.moveCd - TICK);
        const enemies = units.filter(e => e.alive && e.team !== u.team);
        if (enemies.length === 0) return;
        // 仇恨目标
        const target = pickHateTarget(u, enemies);
        if (!target) return;
        const dist = hexDistance(u, target);
        if (dist <= u.range) {
          // 在攻击范围：攻击
          if (u.atkCd <= 0) {
            // 减伤公式：dmg = atk * 100 / (100 + armor)
            let dmg = Math.max(1, Math.round(u.atk * 100 / (100 + target.def)));
            // 暴击
            const critRate = u.crit || 0;
            const isCrit = Math.random() < critRate;
            if (isCrit) dmg = Math.round(dmg * 1.5);
            // 士气加成（morale > 50 加成，<50 减成）
            const moraleFactor = 1 + (u.morale - 50) / 200;
            dmg = Math.max(1, Math.round(dmg * moraleFactor));
            // 疲劳减成
            const fatigueFactor = Math.max(0.5, 1 - u.fatigue / 200);
            dmg = Math.max(1, Math.round(dmg * fatigueFactor));
            target.hp -= dmg;
            tickEvents.push({
              kind: 'attack', uid: u.uid, targetUid: target.uid,
              classKey: u.classKey, team: u.team,
              dmg, crit: isCrit,
              targetQ: target.q, targetR: target.r,
              fromQ: u.q, fromR: u.r,
            });
            if (target.hp <= 0) {
              target.hp = 0;
              target.alive = false;
              // 击杀者获得 XP 并提升士气
              u.xp = (u.xp || 0) + 1;
              u.morale = Math.min(100, u.morale + 5);
              tickEvents.push({
                kind: 'kill', uid: target.uid,
                classKey: target.classKey, team: target.team,
                q: target.q, r: target.r,
              });
            }
            u.atkCd = 1 / u.atkSpeed;
            // 攻击增加疲劳
            u.fatigue = Math.min(100, u.fatigue + 2);
          }
        } else if (u.moveCd <= 0) {
          // 不在攻击范围：BFS 寻路移动一步
          moveAttempts++;
          let step = nextStepToAttackRange(u, target, units);
          if (!step) { bfsFails++; step = greedyStep(u, target, units); }
          if (step) {
            moveSuccesses++;
            const fromQ = u.q, fromR = u.r;
            u.q = step.q; u.r = step.r;
            u.moveCd = 1 / u.moveSpeed;
            // 移动增加疲劳
            u.fatigue = Math.min(100, u.fatigue + 1);
            tickEvents.push({
              kind: 'move', uid: u.uid,
              classKey: u.classKey, team: u.team,
              fromQ, fromR, toQ: step.q, toR: step.r,
            });
          } else if (tick < 10) {
            console.log('[combat sim] MOVE FAIL unit', u.uid, 'at (', u.q, ',', u.r, ') target', target.uid, 'at (', target.q, ',', target.r, ') dist:', dist, 'range:', u.range);
          }
        }
      });
      if (tickEvents.length > 0) events.push({ tick, events: tickEvents });
      if (!anyAlive) break;
    }
    console.log('[combat sim] tile', t.id, 'done. attempts:', moveAttempts, 'successes:', moveSuccesses, 'bfsFails:', bfsFails, 'totalEvents:', events.length);
    return events;
  }

  // 全局查找士兵（按 uid）—— 用于战斗动画应用事件
  function findUnitByUid(uid) {
    for (const p of players) {
      for (const u of p.units) if (u.uid === uid) return u;
    }
    return null;
  }
  // 在某地块的 deployedUnits 中按 uid 查找
  function findDeployedUnitByUid(t, uid) {
    return t.deployedUnits.find(u => u.uid === uid) || null;
  }

  // ===== 战斗阶段：生成事件 → 快照 → 模拟 → 恢复 → 动画 =====
  function startCombatPhase() {
    combatEvents = [];
    // 对每个有双方士兵的地块生成战斗事件
    tiles.forEach(t => {
      const redCount = t.deployedUnits.filter(u => u.team === TEAM_RED && u.alive).length;
      const blueCount = t.deployedUnits.filter(u => u.team === TEAM_BLUE && u.alive).length;
      console.log('[combat] tile', t.id, t.name, 'red:', redCount, 'blue:', blueCount, 'total:', t.deployedUnits.length);
      if (redCount === 0 || blueCount === 0) return;
      // 快照 deployedUnits（用于动画后恢复到初始状态）
      const snapshot = t.deployedUnits.map(u => ({
        ...u, atkCd: 0, moveCd: 0, hateTargetId: '',
      }));
      // 模拟战斗（修改 deployedUnits 到最终状态），收集事件
      const evts = simulateTileCombat(t);
      console.log('[combat] tile', t.id, 'events:', evts.length, 'moves:', evts.reduce((s,e)=>s+e.events.filter(x=>x.kind==='move').length,0));
      if (evts.length > 0) {
        // 保存最终状态（含 morale/fatigue/xp 等事件未记录的字段）
        const finalState = t.deployedUnits.map(u => ({
          morale: u.morale, fatigue: u.fatigue, xp: u.xp,
          hateTargetId: u.hateTargetId,
        }));
        combatEvents.push({ tileId: t.id, tileName: t.name, events: evts, snapshot, finalState });
      }
      // 恢复 deployedUnits 到初始状态（动画会逐步应用事件）
      t.deployedUnits = snapshot;
    });
    // 调整战斗阶段时长：根据事件总 tick 数
    const totalTicks = combatEvents.reduce((s, ce) => s + ce.events.length, 0);
    // 开始动画播放
    combatAnimState = { eventIdx: 0, tickIdx: 0 };
    if (combatEvents.length > 0) {
      phaseTimeLeft = Math.max(PHASE_SECONDS.Combat, totalTicks * 0.15 + 3);
      selectedTileId = combatEvents[0].tileId;
      if (combatAnimTimer) clearInterval(combatAnimTimer);
      combatAnimTimer = setInterval(playNextCombatTick, 150);
      console.log('[combat] animation started, combatEvents:', combatEvents.length, 'totalTicks:', totalTicks, 'selectedTileId:', selectedTileId);
    } else {
      // 无战斗事件：缩短战斗阶段时间
      phaseTimeLeft = 3;
      console.log('[combat] no combat events generated (no tile has both teams), combatEvents is empty');
    }
  }

  function playNextCombatTick() {
    if (!combatAnimState) return;
    if (combatAnimState.eventIdx >= combatEvents.length) {
      // 所有事件播放完毕
      if (combatAnimTimer) { clearInterval(combatAnimTimer); combatAnimTimer = null; }
      return;
    }
    const tileEvents = combatEvents[combatAnimState.eventIdx];
    if (combatAnimState.tickIdx >= tileEvents.events.length) {
      // 切换到下一个有战斗的地块
      combatAnimState.eventIdx++;
      combatAnimState.tickIdx = 0;
      if (combatAnimState.eventIdx < combatEvents.length) {
        selectedTileId = combatEvents[combatAnimState.eventIdx].tileId;
      }
      return;
    }
    const tickData = tileEvents.events[combatAnimState.tickIdx];
    combatAnimState.tickIdx++;
    // 应用这个 tick 的事件到对应地块的 deployedUnits
    const t = tiles[tileEvents.tileId];
    if (!t) return;
    let moveCount = 0;
    tickData.events.forEach(ev => {
      if (ev.kind === 'move') {
        moveCount++;
        const u = findDeployedUnitByUid(t, ev.uid);
        if (u) { u.q = ev.toQ; u.r = ev.toR; }
      } else if (ev.kind === 'attack') {
        const target = findDeployedUnitByUid(t, ev.targetUid);
        if (target) {
          target.hp = Math.max(0, target.hp - ev.dmg);
          // 伤害飘字
          damageFloats.push({
            tileId: t.id, q: ev.targetQ, r: ev.targetR,
            text: '-' + ev.dmg, crit: ev.crit, ttl: 50, maxTtl: 50,
          });
        }
      } else if (ev.kind === 'kill') {
        const dead = findDeployedUnitByUid(t, ev.uid);
        if (dead) { dead.alive = false; dead.hp = 0; }
      }
    });
    if (moveCount > 0) console.log('[combat anim] tile', tileEvents.tileId, 'tick applied, moves:', moveCount);
  }

  // 快速应用所有剩余战斗事件（用于 endPhase 时确保最终状态）
  function applyAllRemainingCombatEvents() {
    if (combatAnimTimer) { clearInterval(combatAnimTimer); combatAnimTimer = null; }
    if (!combatAnimState) return;
    while (combatAnimState.eventIdx < combatEvents.length) {
      const tileEvents = combatEvents[combatAnimState.eventIdx];
      const t = tiles[tileEvents.tileId];
      while (combatAnimState.tickIdx < tileEvents.events.length) {
        const tickData = tileEvents.events[combatAnimState.tickIdx];
        if (t) {
          tickData.events.forEach(ev => {
            if (ev.kind === 'move') {
              const u = findDeployedUnitByUid(t, ev.uid);
              if (u) { u.q = ev.toQ; u.r = ev.toR; }
            } else if (ev.kind === 'attack') {
              const target = findDeployedUnitByUid(t, ev.targetUid);
              if (target) target.hp = Math.max(0, target.hp - ev.dmg);
            } else if (ev.kind === 'kill') {
              const dead = findDeployedUnitByUid(t, ev.uid);
              if (dead) { dead.alive = false; dead.hp = 0; }
            }
          });
        }
        combatAnimState.tickIdx++;
      }
      combatAnimState.eventIdx++;
      combatAnimState.tickIdx = 0;
    }
    combatAnimState = null;
  }

  // 战后：把存活/阵亡状态写回玩家 units 数组（实例保持独立）
  function syncSurvivorsToPlayers(t) {
    t.deployedUnits.forEach(du => {
      const p = getPlayer(du.ownerId);
      if (!p || !p.alive) return;
      const u = (p.units || []).find(x => x.uid === du.uid);
      if (u) {
        u.hp = du.hp;
        u.alive = du.alive;
        u.q = du.q;
        u.r = du.r;
        u.morale = du.morale;
        u.fatigue = du.fatigue;
        u.hateTargetId = du.hateTargetId;
        u.xp = du.xp || u.xp;
      }
    });
  }
  // 跨回合：把场上存活单位收回后备（HP 保持），阵亡单位从 units 移除
  function stripFieldToReserve() {
    players.filter(p => p.alive).forEach(p => {
      const survivors = [];
      p.units.forEach(u => {
        if (u.alive) {
          u.q = 0; u.r = 0;
          u.atkCd = 0; u.moveCd = 0; u.hateTargetId = '';
          // 疲劳每回合恢复 20
          u.fatigue = Math.max(0, u.fatigue - 20);
          survivors.push(u);
        }
      });
      p.units = survivors;
      // pendingUnits 中的战斗阶段招募转入 reserveUnits
      p.pendingUnits.forEach(u => p.reserveUnits.push(u));
      p.pendingUnits = [];
    });
  }

  function applyBaseDamage() {
    tiles.forEach(t => {
      if (t.hasBlueBase) {
        const redSoldiers = t.deployedUnits.filter(u => u.team === TEAM_RED && u.alive).length;
        if (redSoldiers > 0) blueBaseHP -= redSoldiers * BASE_DAMAGE_PER_SOLDIER;
      }
      if (t.hasRedBase) {
        const blueSoldiers = t.deployedUnits.filter(u => u.team === TEAM_BLUE && u.alive).length;
        if (blueSoldiers > 0) redBaseHP -= blueSoldiers * BASE_DAMAGE_PER_SOLDIER;
      }
    });
    if (redBaseHP < 0) redBaseHP = 0;
    if (blueBaseHP < 0) blueBaseHP = 0;
  }

  // ===== 胜负 =====
  // 检查玩家是否还有继续游戏的能力：无兵且无资源招募新兵则淘汰
  function checkPlayerAlive(p) {
    if (!p.alive) return;
    if (totalLivingSoldiers(p) === 0 && p.gold < 12 && p.ore < 4) {
      p.alive = false;
    }
  }
  function checkVictory() {
    // 先更新各玩家存活状态
    players.forEach(p => checkPlayerAlive(p));
    const redAlive = players.filter(p => p.team === TEAM_RED && p.alive && totalLivingSoldiers(p) > 0).length;
    const blueAlive = players.filter(p => p.team === TEAM_BLUE && p.alive && totalLivingSoldiers(p) > 0).length;
    if (redBaseHP <= 0) endGame('蓝方胜利！');
    else if (blueBaseHP <= 0) endGame('红方胜利！');
    else if (redAlive === 0 && blueAlive === 0) endGame('平局');
    else if (redAlive === 0) endGame('蓝方胜利！');
    else if (blueAlive === 0) endGame('红方胜利！');
  }
  function endGame(msg) {
    gameOver = true;
    resultText.textContent = msg;
    overlay.classList.remove('hidden');
  }

  // ===== Bot AI =====
  function runBotAI(dt) {
    if (gameOver) return;
    let needPreviewRefresh = false;
    players.forEach(p => {
      if (!p.isBot || !p.alive) return;
      if (phaseName === 'Move' && !p.moveSubmitted) botChooseMove(p);
      if (phaseName === 'Deploy' && !p.deployDone) { botChooseRecruit(p); needPreviewRefresh = true; }
    });
    // Bot 部署后刷新战术盘预览（显示同地块队友/对手的士兵）
    if (needPreviewRefresh && phaseName === 'Deploy') previewDeployAll();
  }

  function botChooseMove(p) {
    if (p.moveSubmitted) return;
    // 可达地块（最多 2 步）
    const reach = reachableTiles(p.tile, 2, p.team);
    const enemyBaseTile = p.team === TEAM_RED ? BLUE_BASE_TILE : RED_BASE_TILE;
    // 过滤掉同方满员格
    const candidates = reach.filter(id => {
      if (id === p.tile) return false; // 排除原地
      const t = tiles[id];
      const sameTeamCount = t.players.filter(pid => getPlayer(pid).team === p.team).length;
      return sameTeamCount < 15;
    });
    if (candidates.length === 0) { p.moveSubmitted = true; p.moveTarget = p.tile; return; }
    // 找有敌人的地块（优先移动到有敌方玩家的地块，触发战斗）
    const enemyTiles = candidates.filter(id => {
      const t = tiles[id];
      return t.players.some(pid => getPlayer(pid).team !== p.team);
    });
    const roll = Math.random();
    let target = null;
    if (enemyTiles.length > 0 && roll < 0.5) {
      // 50%：移动到有敌人的地块（触发战斗）
      target = enemyTiles[Math.floor(Math.random() * enemyTiles.length)];
    } else if (roll < 0.8) {
      // 30%：向敌方基地方向移动（选距离最近的地块）
      const distToBase = {};
      candidates.forEach(id => distToBase[id] = tileGraphDist(id, enemyBaseTile));
      candidates.sort((a, b) => distToBase[a] - distToBase[b]);
      target = candidates[0];
    } else {
      // 20%：随机移动
      target = candidates[Math.floor(Math.random() * candidates.length)];
    }
    if (target !== null && target !== undefined) {
      submitMove(p, target);
    } else {
      p.moveTarget = p.tile;
      p.moveSubmitted = true;
    }
  }

  function tileGraphDist(from, to) {
    const q = [{id:from, d:0}], vis = new Set([from]);
    while (q.length) {
      const cur = q.shift();
      if (cur.id === to) return cur.d;
      tiles[cur.id].neighbors.forEach(nid => {
        if (!vis.has(nid)) { vis.add(nid); q.push({id:nid, d:cur.d+1}); }
      });
    }
    return Infinity;
  }

  function botChooseRecruit(p) {
    // 简单策略：优先补战士和弓兵，每回合最多买 5 个
    const order = ['warrior','archer','tank','mage','assassin'];
    let bought = 0, maxBuy = 5;
    while (bought < maxBuy) {
      let any = false;
      for (const cls of order) {
        if (recruit(p, cls)) { bought++; any = true; break; }
      }
      if (!any) break;
    }
    // 商店：有概率刷新并购买道具（Bot 无需赠送）
    if (Math.random() < 0.3) handleRefreshShop(p);
    let shopBought = 0;
    for (const slot of p.shopSlots) {
      if (shopBought >= 3) break;
      if (slot && slot.price <= p.gold * 0.3) {
        if (buyItem(p, slot.id)) shopBought++;
      }
    }
    // 部署阶段：Bot 自动部署后备士兵到战术盘
    if (phaseName === 'Deploy') botDeploy(p);
    p.deployDone = true;
  }

  // ===== 渲染：战略地图 =====
  function tileCenter(i, size) {
    // 与 godot-client strategic_map.gd 一致：axial_to_pixel 的 size 即六边形半径
    const a = MAP_TILES[i].axial;
    return hexAxialToPixel(a.q, a.r, size);
  }

  function drawMap() {
    // 使用全局 tileSize（由 resize 计算）
    const showReach = (phaseName === 'Move' && !me.moveSubmitted);
    const showDeploy = (phaseName === 'Deploy');
    const showCombat = (phaseName === 'Combat');
    const reach = showReach ? reachableTiles(me.tile, 2, me.team) : [];
    tiles.forEach((t, i) => {
      const c = tileCenter(i, tileSize);
      const cx = c.x + cam.x, cy = c.y + cam.y;
      drawHexPath(cx, cy, tileSize * 0.92);
      // 填充
      let fill = COL_NEUTRAL;
      if (t.owner === TEAM_RED) fill = COL_RED_DARK;
      if (t.owner === TEAM_BLUE) fill = COL_BLUE_DARK;
      ctx.fillStyle = fill;
      ctx.fill();
      // 边框
      ctx.strokeStyle = (t.id === selectedTileId ? '#fff' : (t.owner === TEAM_RED ? COL_RED : (t.owner === TEAM_BLUE ? COL_BLUE : '#888')));
      ctx.lineWidth = t.id === selectedTileId ? 3 : 1.5;
      ctx.stroke();
      // 移动阶段：显示可达地块
      if (showReach && reach.includes(t.id) && t.id !== me.tile) {
        ctx.save();
        ctx.strokeStyle = '#ffd54f';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 4]);
        ctx.stroke();
        ctx.restore();
      }
      // 移动阶段：显示移动目标箭头
      if (showReach && pendingMoveTarget === t.id && t.id !== me.tile) {
        ctx.save();
        ctx.strokeStyle = '#4caf50';
        ctx.lineWidth = 4;
        ctx.setLineDash([]);
        ctx.stroke();
        ctx.fillStyle = '#4caf50';
        ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('→ 目标', cx, cy + tileSize*0.55);
        ctx.restore();
      }
      // 基地标识
      if (t.hasRedBase || t.hasBlueBase) {
        ctx.fillStyle = t.hasRedBase ? COL_RED : COL_BLUE;
        ctx.beginPath(); ctx.arc(cx, cy, tileSize*0.35, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('基地', cx, cy + 4);
      }
      // 名称
      ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(t.name, cx, cy - tileSize*0.15);
      // 阶段特定信息
      if (showCombat && t.deployedUnits.length > 0) {
        // 战斗阶段：显示双方兵力
        const rc = t.deployedUnits.filter(u => u.team === TEAM_RED && u.alive).length;
        const bc = t.deployedUnits.filter(u => u.team === TEAM_BLUE && u.alive).length;
        ctx.font = 'bold 11px sans-serif';
        ctx.fillStyle = COL_RED;
        ctx.fillText('红' + rc, cx - tileSize*0.3, cy + tileSize*0.25);
        ctx.fillStyle = COL_BLUE;
        ctx.fillText('蓝' + bc, cx + tileSize*0.3, cy + tileSize*0.25);
        // 交战标记
        if (rc > 0 && bc > 0) {
          ctx.fillStyle = '#ff4444';
          ctx.font = 'bold 10px sans-serif';
          ctx.fillText('⚔ 交战', cx, cy + tileSize*0.5);
        }
      } else if (showDeploy) {
        // 部署阶段：显示己方兵力汇总
        const myHere = t.players.map(pid => getPlayer(pid)).filter(p => p.alive && p.team === me.team);
        if (myHere.length > 0) {
          let total = 0;
          myHere.forEach(p => { total += totalLivingSoldiers(p); });
          ctx.font = 'bold 11px sans-serif';
          ctx.fillStyle = me.team === TEAM_RED ? COL_RED : COL_BLUE;
          ctx.fillText('我方 ' + total + ' 兵', cx, cy + tileSize*0.25);
        }
        ctx.font = '10px sans-serif'; ctx.fillStyle = '#bbb';
        ctx.fillText(`红${t.redCount} 蓝${t.blueCount}`, cx, cy + tileSize*0.45);
      } else {
        // 移动阶段：显示玩家数量
        ctx.font = '10px sans-serif'; ctx.fillStyle = '#bbb';
        ctx.fillText(`红${t.redCount} 蓝${t.blueCount}`, cx, cy + tileSize*0.25);
      }
      // 资源点（仅移动/部署阶段显示）
      if (!showCombat && t.resource && t.resource.goldPerRound) {
        ctx.fillStyle = '#ffd54f'; ctx.font = '10px sans-serif';
        ctx.fillText(`+${t.resource.goldPerRound}金`, cx, cy + tileSize*0.6);
      }
      // 玩家头像点（移动/部署阶段显示，战斗阶段隐藏）
      if (!showCombat) drawTilePlayers(t, cx, cy, tileSize);
    });
  }

  function drawTilePlayers(t, cx, cy, size) {
    const here = t.players.map(pid => getPlayer(pid)).filter(p => p.alive);
    const n = here.length;
    const rad = size * 0.55;
    here.forEach((p, idx) => {
      const ang = (idx / Math.max(1, n)) * Math.PI * 2 - Math.PI/2;
      const px = cx + Math.cos(ang) * rad;
      const py = cy + Math.sin(ang) * rad;
      ctx.fillStyle = p.team === TEAM_RED ? COL_RED : COL_BLUE;
      ctx.beginPath(); ctx.arc(px, py, size*0.12, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = p === me ? '#fff' : 'rgba(0,0,0,0.5)'; ctx.lineWidth = p === me ? 2 : 1;
      ctx.stroke();
      if (p === me) {
        ctx.fillStyle = '#fff'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('我', px, py + 3);
      }
    });
  }

  // ===== 渲染：战术格视图 =====
  // 部署阶段：大战术盘居中显示；战斗阶段：大战术盘居中显示（带动画）
  function drawTacticalView() {
    if (phaseName !== 'Combat' && phaseName !== 'Deploy') return;
    if (selectedTileId === null) return;
    const t = tiles[selectedTileId];

    // 部署阶段 & 战斗阶段：大战术盘居中
    const isDeploy = (phaseName === 'Deploy');
    const isCombat = (phaseName === 'Combat');
    // 战斗阶段若无部署单位则不显示
    if (isCombat && t.deployedUnits.length === 0) return;
    const size = Math.min(W, H) / 14;

    // 计算六角格实际像素范围（从 BATTLE_CELLS 的 axial 坐标推算）
    // x = size * sqrt(3) * (q + r/2)，y = size * 1.5 * r
    // q 范围 -R..R，r 范围 -R..R
    const halfW = BATTLE_RADIUS * Math.sqrt(3) * size; // x 方向半宽
    const halfH = BATTLE_RADIUS * 1.5 * size;           // y 方向半高
    const gridW = halfW * 2;
    const gridH = halfH * 2;

    // 居中，略偏下以留出顶部 UI 空间
    const ox = W / 2;
    const oy = H / 2 + 10;

    ctx.save();
    ctx.globalAlpha = 1.0;
    ctx.translate(ox, oy);

    // 背景面板
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(-halfW - 10, -halfH - 30, gridW + 20, gridH + 50);

    // 绘制六角格
    BATTLE_CELLS.forEach(c => {
      const p = hexAxialToPixel(c.q, c.r, size);
      drawHexPath(p.x, p.y, size * 0.85);
      ctx.fillStyle = c.q < 0 ? COL_RED_DARK : (c.q > 0 ? COL_BLUE_DARK : '#252a33');
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1; ctx.stroke();
    });

    // 基地标记
    const baseR = isDeploy ? -BATTLE_RADIUS : BATTLE_RADIUS;
    const baseP = hexAxialToPixel(baseR, 0, size);
    drawHexPath(baseP.x, baseP.y, size * 0.85);
    ctx.fillStyle = baseR < 0 ? COL_RED : COL_BLUE;
    ctx.globalAlpha = 0.3;
    ctx.fill();
    ctx.globalAlpha = 1.0;

    // 绘制士兵
    t.deployedUnits.forEach(u => {
      if (!u.alive) return;
      const p = hexAxialToPixel(u.q, u.r, size);
      const r = size * 0.42;
      const img = SOLDIER_IMG_OBJS[u.classKey];
      ctx.save();
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI*2);
      ctx.closePath();
      ctx.clip();
      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, p.x - r, p.y - r, r*2, r*2);
      } else {
        ctx.fillStyle = u.team === TEAM_RED ? COL_RED : COL_BLUE;
        ctx.fillRect(p.x - r, p.y - r, r*2, r*2);
      }
      ctx.restore();
      ctx.strokeStyle = u.team === TEAM_RED ? COL_RED : COL_BLUE;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI*2);
      ctx.stroke();
      // 战斗阶段：显示 HP 条
      if (isCombat && u.maxHp > 0) {
        const hpRatio = Math.max(0, u.hp / u.maxHp);
        const barW = r * 1.6, barH = 3;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(p.x - barW/2, p.y - r - 8, barW, barH);
        ctx.fillStyle = hpRatio > 0.5 ? '#4caf50' : (hpRatio > 0.25 ? '#ffd54f' : '#e74c3c');
        ctx.fillRect(p.x - barW/2, p.y - r - 8, barW * hpRatio, barH);
      }
    });

    // 绘制伤害飘字（仅当前地块）
    damageFloats.filter(d => d.tileId === t.id).forEach(d => {
      const pos = hexAxialToPixel(d.q, d.r, size);
      const alpha = d.ttl / d.maxTtl;
      const rise = (d.maxTtl - d.ttl) * 0.6;
      ctx.fillStyle = d.crit ? `rgba(255,80,80,${alpha})` : `rgba(255,235,80,${alpha})`;
      ctx.font = d.crit ? 'bold 18px sans-serif' : 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(d.text, pos.x, pos.y - size * 0.42 - 6 - rise);
    });

    // 标题
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'left';
    const titlePrefix = isDeploy ? `${t.name} · 部署视图` : `${t.name} · 战斗中`;
    ctx.fillText(titlePrefix, -halfW, -halfH - 14);

    // 部署阶段：显示同地块的队友和对手信息
    if (isDeploy) {
      const herePlayers = t.players.map(pid => getPlayer(pid)).filter(p => p.alive);
      const myTeammates = herePlayers.filter(p => p.team === me.team);
      const enemies = herePlayers.filter(p => p.team !== me.team);
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'left';
      let infoY = -halfH + 6;
      // 队友
      ctx.fillStyle = me.team === TEAM_RED ? COL_RED : COL_BLUE;
      const mateNames = myTeammates.map(p => p === me ? p.name + '(我)' : p.name).join('、');
      ctx.fillText('本方：' + mateNames, -halfW + 4, infoY);
      infoY += 16;
      // 对手
      ctx.fillStyle = me.team === TEAM_RED ? COL_BLUE : COL_RED;
      if (enemies.length > 0) {
        const enemyNames = enemies.map(p => p.name).join('、');
        ctx.fillText('敌方：' + enemyNames, -halfW + 4, infoY);
      } else {
        ctx.fillText('敌方：无', -halfW + 4, infoY);
      }
    }

    // 兵力统计
    const rc = t.deployedUnits.filter(u => u.team === TEAM_RED && u.alive).length;
    const bc = t.deployedUnits.filter(u => u.team === TEAM_BLUE && u.alive).length;
    ctx.font = '14px sans-serif';
    ctx.fillStyle = COL_RED;
    ctx.textAlign = 'left';
    ctx.fillText('红方 ' + rc + ' 兵', -halfW, halfH + 20);
    ctx.fillStyle = COL_BLUE;
    ctx.textAlign = 'right';
    ctx.fillText('蓝方 ' + bc + ' 兵', halfW, halfH + 20);

    ctx.restore();
  }

  // ===== UI 更新 =====
  // 渲染独立士兵卡牌列表（军队栏）：显示后备 + 已部署暂存士兵
  function renderArmyList() {
    const el = document.getElementById('armyList');
    if (!el) return;
    el.innerHTML = '';
    // 合并后备 + 已暂存（暂存的标记为已部署）
    const items = [];
    me.reserveUnits.forEach(u => items.push({ u, placed: false }));
    me.deployStaging.forEach(s => {
      const u = s.unitRef || findUnitEverywhere(me, s.uid);
      if (u) items.push({ u, placed: true, q: s.q, r: s.r });
    });
    console.log('[deploy] renderArmyList: reserve:', me.reserveUnits.length, 'staging:', me.deployStaging.length, 'selected:', deploySelectedUnit);
    items.forEach(({ u, placed, q, r }) => {
      const card = document.createElement('div');
      card.className = 'army-card';
      if (u.uid === deploySelectedUnit) card.classList.add('selected');
      // 图片
      const img = document.createElement('img');
      img.src = SOLDIER_IMGS[u.classKey] || '';
      img.alt = u.classKey;
      card.appendChild(img);
      // HP 条
      const hpBar = document.createElement('div');
      hpBar.className = 'hp-bar';
      const hpFill = document.createElement('div');
      hpFill.className = 'hp-fill';
      hpFill.style.width = (u.hp / u.maxHp * 100) + '%';
      hpBar.appendChild(hpFill);
      card.appendChild(hpBar);
      // 标签
      const lbl = document.createElement('div');
      lbl.className = 'lbl';
      const clsName = CLASS_STATS[u.classKey].name;
      lbl.textContent = placed ? `${clsName}(${q},${r})` : clsName;
      card.appendChild(lbl);
      // 部署阶段点击选中/撤回
      if (phaseName === 'Deploy' && !me.deployDone) {
        card.style.cursor = 'pointer';
        card.addEventListener('click', () => {
          if (placed) {
            // 已部署：点击撤回
            deployUnplace(me, u.uid);
            deploySelectedUnit = null;
          } else {
            // 后备：点击选中为待部署
            deploySelectedUnit = (deploySelectedUnit === u.uid) ? null : u.uid;
          }
          renderArmyList();
          previewDeployAll();
        });
        if (placed) {
          card.title = '右键撤回部署';
          card.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            deployUnplace(me, u.uid);
            deploySelectedUnit = null;
            renderArmyList();
            previewDeployAll();
          });
        }
      }
      el.appendChild(card);
    });
  }
  function updateUI() {
    elTurn.textContent = turn;
    elPhaseName.textContent = PHASE_NAMES[phaseName];
    elPhaseHint.textContent = PHASE_HINTS[phaseName];
    elTimer.textContent = phaseTimeLeft.toFixed(1);
    if (phaseTimeLeft < 3) { elTimer.classList.add('urgent'); }
    else { elTimer.classList.remove('urgent'); }

    elRedFill.style.width = (redBaseHP / BASE_HP * 100) + '%';
    elBlueFill.style.width = (blueBaseHP / BASE_HP * 100) + '%';
    elRedText.textContent = Math.round(redBaseHP / BASE_HP * 100) + '%';
    elBlueText.textContent = Math.round(blueBaseHP / BASE_HP * 100) + '%';

    const rSoldiers = players.filter(p => p.team === TEAM_RED && p.alive).reduce((s, p) => s + totalLivingSoldiers(p), 0);
    const bSoldiers = players.filter(p => p.team === TEAM_BLUE && p.alive).reduce((s, p) => s + totalLivingSoldiers(p), 0);
    elForce.textContent = `红方 ${rSoldiers} 兵 / 蓝方 ${bSoldiers} 兵`;

    // 资源
    document.getElementById('resGold').textContent = me.gold;
    document.getElementById('resOre').textContent = me.ore;
    document.getElementById('resWood').textContent = me.wood;
    document.getElementById('resFood').textContent = me.food;

    // 招募卡片：显示该兵种每个士兵的 HP
    const classKeyToHpId = { warrior:'hpWarrior', archer:'hpArcher', assassin:'hpAssassin', mage:'hpMage', tank:'hpTank' };
    CLASS_ORDER.forEach(k => {
      const el = document.getElementById(classKeyToHpId[k]);
      if (!el) return;
      // 收集该兵种所有存活士兵
      const soldiers = [];
      [me.units, me.reserveUnits, me.deployStaging, me.pendingUnits].forEach(arr => {
        (arr || []).forEach(u => {
          if (u && u.classKey === k && u.alive !== false) soldiers.push(u);
        });
      });
      if (soldiers.length === 0) { el.innerHTML = ''; return; }
      // 显示每个士兵的 HP（最多 4 行）
      const lines = soldiers.slice(0, 4).map(u => Math.round(u.hp) + '/' + u.maxHp);
      if (soldiers.length > 4) lines.push('+' + (soldiers.length - 4));
      el.innerHTML = lines.join('<br>');
    });
    // 军队栏：部署阶段常驻侧边显示（仅切换可见性，不重建DOM）
    const elArmyList = document.getElementById('armyList');
    if (elArmyList) {
      if ((phaseName === 'Deploy') && !me.deployDone && !gameOver) elArmyList.classList.add('active');
      else elArmyList.classList.remove('active');
    }

    // 招募/商店/赠送面板：仅在弹出时显示，不自动显示
    // 商店内容在弹出时渲染（renderShopContent）
    // 赠送目标列表在弹出时填充（renderGiftTargets）

    // 按钮可用性
    const canRecruitNow = (phaseName === 'Move' || phaseName === 'Deploy') && !me.deployDone && !gameOver;
    const canShopNow = (phaseName === 'Deploy') && !me.deployDone && !gameOver;
    const canGiftNow = !gameOver && me.alive;
    document.getElementById('btnOpenRecruit').disabled = !canRecruitNow;
    document.getElementById('btnOpenShop').disabled = !canShopNow;
    document.getElementById('btnOpenGift').disabled = !canGiftNow;

    // 按钮状态
    btnMove.disabled = !(phaseName === 'Move' && !me.moveSubmitted && pendingMoveTarget !== null);
    btnDeploy.disabled = !(phaseName === 'Deploy' && !me.deployDone);

    // 地块信息
    if (hoverTileId !== null) {
      const t = tiles[hoverTileId];
      elTileInfo.classList.add('active');
      elTileName.textContent = t.name;
      elTileOwner.textContent = t.owner === 'red' ? '红方' : (t.owner === 'blue' ? '蓝方' : '中立');
      elTileRed.textContent = t.redCount;
      elTileBlue.textContent = t.blueCount;
    } else {
      elTileInfo.classList.remove('active');
    }

    // 卡片可买状态
    document.querySelectorAll('.card').forEach(card => {
      const cls = card.dataset.cls;
      if (canRecruit(me, cls)) card.classList.remove('disabled');
      else card.classList.add('disabled');
    });
  }

  // ===== 输入 =====
  function screenToTile(sx, sy) {
    // 使用全局 tileSize（与 drawMap 一致）
    for (let i = 0; i < tiles.length; i++) {
      const c = tileCenter(i, tileSize);
      const dx = sx - (c.x + cam.x), dy = sy - (c.y + cam.y);
      if (Math.sqrt(dx*dx + dy*dy) < tileSize * 0.92) return i;
    }
    return null;
  }
  // 屏幕坐标 → 战术盘 axial 坐标（仅部署阶段有效）
  function screenToTacticalAxial(sx, sy) {
    if (phaseName !== 'Deploy') return null;
    if (selectedTileId === null) return null;
    const size = Math.min(W, H) / 14;
    // 与 drawTacticalView 保持一致：原点在屏幕中心
    const ox = W / 2;
    const oy = H / 2 + 10;
    // 反向变换：pixel → axial
    const lx = sx - ox, ly = sy - oy;
    // axial_to_pixel: x = size * sqrt(3) * (q + r/2), y = size * 1.5 * r
    const r = ly / (size * 1.5);
    const q = (lx / (size * Math.sqrt(3))) - r / 2;
    const rounded = cubeRound(q, r);
    if (insideBattleGrid(rounded.q, rounded.r)) return rounded;
    return null;
  }

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    hoverTileId = screenToTile(e.clientX - rect.left, e.clientY - rect.top);
  });

  canvas.addEventListener('click', e => {
    if (gameOver) return;
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    // 部署阶段：优先处理战术盘点击放置
    if (phaseName === 'Deploy' && !me.deployDone && deploySelectedUnit) {
      const cell = screenToTacticalAxial(sx, sy);
      if (cell) {
        if (deployPlace(me, deploySelectedUnit, cell.q, cell.r)) {
          deploySelectedUnit = null;
          renderArmyList();
          previewDeployAll();
          updateUI();
        }
        return;
      }
    }
    // 部署阶段不切换地块（仅查看自己的地块）
    if (phaseName === 'Deploy') return;
    const id = screenToTile(sx, sy);
    if (id === null) return;
    selectedTileId = id;
    if (phaseName === 'Move' && !me.moveSubmitted) {
      const reach = reachableTiles(me.tile, 2, me.team);
      if (reach.includes(id)) {
        pendingMoveTarget = id;
        btnMove.disabled = false;
      }
    }
  });

  // 右键：部署阶段撤回战术盘上的士兵
  canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (gameOver) return;
    if (phaseName !== 'Deploy' || me.deployDone) return;
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const cell = screenToTacticalAxial(sx, sy);
    if (!cell) return;
    // 找到该格上的己方暂存士兵并撤回
    const staging = me.deployStaging.find(s => s.q === cell.q && s.r === cell.r);
    if (staging) {
      deployUnplace(me, staging.uid);
      deploySelectedUnit = null;
      renderArmyList();
      previewDeployAll();
      updateUI();
    }
  });

  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      if ((phaseName !== 'Deploy' && phaseName !== 'Move') || me.deployDone || gameOver) return;
      const cls = card.dataset.cls;
      if (recruit(me, cls)) { updateUI(); renderArmyList(); }
    });
  });

  // 商店槽位点击（事件委托，槽位为动态生成）
  elShopSlots.addEventListener('click', e => {
    if (phaseName !== 'Deploy' || me.deployDone || gameOver) return;
    const slot = e.target.closest('.shopSlot');
    if (!slot || slot.classList.contains('empty') || slot.classList.contains('disabled')) return;
    const idx = parseInt(slot.dataset.slotIdx, 10);
    if (Number.isNaN(idx)) return;
    const item = me.shopSlots[idx];
    if (item && buyItem(me, item.id)) { renderShopContent(); updateUI(); }
  });

  btnRefreshShop.addEventListener('click', () => {
    if (phaseName !== 'Deploy' || me.deployDone || gameOver) return;
    if (handleRefreshShop(me)) { renderShopContent(); updateUI(); }
  });

  btnUpgradeShop.addEventListener('click', () => {
    if (phaseName !== 'Deploy' || me.deployDone || gameOver) return;
    if (upgradeShop(me)) { renderShopContent(); updateUI(); }
  });

  // ===== 模态弹窗逻辑 =====
  const elModalOverlay = document.getElementById('modalOverlay');
  function openModal(panel) {
    // 关闭其他弹窗
    elRecruit.classList.remove('active');
    elShop.classList.remove('active');
    elGift.classList.remove('active');
    elModalOverlay.classList.remove('hidden');
    panel.classList.add('active');
    if (panel === elShop) renderShopContent();
    if (panel === elGift) renderGiftTargets();
  }
  function closeModal() {
    elRecruit.classList.remove('active');
    elShop.classList.remove('active');
    elGift.classList.remove('active');
    elModalOverlay.classList.add('hidden');
  }
  function renderShopContent() {
    elShopTierName.textContent = SHOP_TIERS[me.shopLevel].name +
      (me.shopLevel < SHOP_UPGRADE_COSTS.length ? ` (升级:${SHOP_UPGRADE_COSTS[me.shopLevel]}金)` : ' (满级)');
    elShopSlots.innerHTML = '';
    me.shopSlots.forEach((slot, i) => {
      const div = document.createElement('div');
      if (!slot) {
        div.className = 'shopSlot empty';
        div.textContent = '已售';
      } else {
        div.className = 'shopSlot';
        if (me.gold < slot.price) div.classList.add('disabled');
        const nameEl = document.createElement('div');
        nameEl.className = 'sName'; nameEl.textContent = slot.name;
        const priceEl = document.createElement('div');
        priceEl.className = 'sPrice';
        if (slot.price < slot.basePrice) priceEl.classList.add('discount');
        priceEl.textContent = slot.price + '金';
        div.appendChild(nameEl); div.appendChild(priceEl);
        div.dataset.slotIdx = i;
      }
      elShopSlots.appendChild(div);
    });
    const bagEntries = Object.entries(me.bag).filter(([k,v]) => v > 0);
    elShopBag.textContent = '背包：' + (bagEntries.length ? bagEntries.map(([k,v]) => {
      let nm = k;
      for (const tier of SHOP_TIERS) { const it = tier.items.find(i => i.id === k); if (it) { nm = it.name; break; } }
      return `${nm}×${v}`;
    }).join('，') : '空');
    btnRefreshShop.disabled = me.gold < SHOP_REFRESH_COST[me.shopLevel];
    btnUpgradeShop.disabled = me.shopLevel >= SHOP_UPGRADE_COSTS.length || me.gold < SHOP_UPGRADE_COSTS[me.shopLevel];
  }
  function renderGiftTargets() {
    const candidates = players.filter(p => p.alive && p.team === me.team && p.id !== me.id &&
      (p.tile === me.tile || tiles[me.tile].neighbors.includes(p.tile)));
    const prevTarget = elGiftTarget.value;
    elGiftTarget.innerHTML = '';
    if (candidates.length === 0) {
      const opt = document.createElement('option');
      opt.value = ''; opt.textContent = '无可用目标';
      elGiftTarget.appendChild(opt);
      btnGift.disabled = true;
    } else {
      candidates.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id; opt.textContent = p.name;
        elGiftTarget.appendChild(opt);
      });
      btnGift.disabled = false;
      if (prevTarget && candidates.some(p => p.id === prevTarget)) elGiftTarget.value = prevTarget;
    }
  }
  document.getElementById('btnOpenRecruit').addEventListener('click', () => {
    if (gameOver || me.deployDone) return;
    if (phaseName !== 'Move' && phaseName !== 'Deploy') return;
    openModal(elRecruit);
  });
  document.getElementById('btnOpenShop').addEventListener('click', () => {
    if (gameOver || me.deployDone || phaseName !== 'Deploy') return;
    openModal(elShop);
  });
  document.getElementById('btnOpenGift').addEventListener('click', () => {
    if (gameOver || !me.alive) return;
    openModal(elGift);
  });
  elModalOverlay.addEventListener('click', closeModal);
  document.querySelectorAll('.modal-close').forEach(el => {
    el.addEventListener('click', closeModal);
  });

  // 赠送按钮
  btnGift.addEventListener('click', () => {
    if (gameOver || !me.alive) return;
    const targetId = elGiftTarget.value;
    const res = elGiftRes.value;
    const amt = elGiftAmount.value;
    const result = giftResources(me, targetId, res, amt);
    elGiftMsg.textContent = result.msg;
    if (result.ok) updateUI();
  });

  btnMove.addEventListener('click', () => {
    if (pendingMoveTarget !== null) {
      submitMove(me, pendingMoveTarget);
      updateUI();
    }
  });

  btnDeploy.addEventListener('click', () => {
    if (phaseName === 'Deploy' && !me.deployDone) {
      me.deployDone = true;
      updateUI();
    }
  });

  restartBtn.addEventListener('click', () => { initGame(); updateUI(); renderArmyList(); });

  // ===== 主循环 =====
  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    if (!gameOver) {
      phaseTimeLeft -= dt;
      if (phaseTimeLeft <= 0) {
        endPhase();
      } else {
        runBotAI(dt);
      }
    }

    // 更新伤害飘字 TTL
    if (damageFloats.length > 0) {
      damageFloats.forEach(d => d.ttl--);
      damageFloats = damageFloats.filter(d => d.ttl > 0);
    }

    ctx.fillStyle = '#0a0c10'; ctx.fillRect(0, 0, W, H);
    // 部署阶段：仅显示战术盘（不画战略地图背景）
    if (phaseName === 'Deploy') {
      drawTacticalView();
    } else if (phaseName === 'Combat') {
      // 战斗阶段：先画战略地图（小），再叠加战术盘
      drawMap();
      drawTacticalView();
    } else {
      drawMap();
    }
    updateUI();
    requestAnimationFrame(loop);
  }

  initGame();
  updateUI();
  renderArmyList();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
