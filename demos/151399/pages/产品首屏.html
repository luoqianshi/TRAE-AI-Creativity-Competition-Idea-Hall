<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素材骰子 - Material Dice</title>
    <style id="theme-vars">
:root {
  /* ── Brand Color ── */
  --color-primary: #FF6B35;
  --color-primary-light: #FF8F66;
  --color-primary-lighter: #FFF0E8;
  --color-primary-dark: #D4521F;

  /* ── Neutral Palette ── */
  --color-bg: #0D0D0D;
  --color-bg-elevated: #1A1A1A;
  --color-bg-sunken: #111111;
  --color-surface: #1E1E1E;
  --color-surface-hover: #262626;
  --color-border: #2A2A2A;
  --color-border-subtle: #1F1F1F;
  --color-text-primary: #F5F5F5;
  --color-text-secondary: #A0A0A0;
  --color-text-tertiary: #666666;
  --color-text-inverse: #0D0D0D;

  /* ── State Colors ── */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* ── Radius Scale ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* ── Typography ── */
  --font-display: 'Space Grotesk', system-ui, -apple-system, sans-serif;
  --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-4xl: 2.25rem;
  --text-5xl: 3rem;
  --text-6xl: 3.75rem;
  --text-7xl: 4.5rem;

  --leading-tight: 1.15;
  --leading-snug: 1.3;
  --leading-normal: 1.6;
  --leading-relaxed: 1.75;

  --tracking-tight: -0.025em;
  --tracking-normal: 0;
  --tracking-wide: 0.025em;

  /* ── Spacing ── */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;
  --space-20: 5rem;
  --space-24: 6rem;

  /* ── Shadow / Depth ── */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.05);
  --shadow-float: 0 8px 32px rgba(0,0,0,0.08);
  --shadow-modal: 0 16px 64px rgba(0,0,0,0.12);

  /* ── Transition ── */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 400ms ease;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="bg-bg min-h-screen relative overflow-x-hidden">

  <!-- Top gradient overlay -->
  <div class="fixed inset-x-0 top-0 h-64 pointer-events-none" style="background: linear-gradient(to bottom, rgba(255,107,53,0.04) 0%, transparent 100%);"></div>

  <!-- Navigation -->
  <nav class="fixed top-0 inset-x-0 z-50 backdrop-blur-md" style="background: rgba(13,13,13,0.8);">
    <div class="max-w-6xl mx-auto px-6 md:px-8 h-16 flex items-center justify-between">
      <a href="#" class="font-display font-bold text-lg text-white tracking-tight">Material Dice</a>
      <div class="hidden sm:flex items-center gap-8">
        <a href="#" class="text-sm text-white/40 hover:text-white/70 transition-colors">功能</a>
        <a href="#" class="text-sm text-white/40 hover:text-white/70 transition-colors">场景</a>
        <a href="#" class="text-sm text-white/40 hover:text-white/70 transition-colors">流程</a>
      </div>
    </div>
  </nav>

  <!-- Hero Content -->
  <main class="relative z-10 flex flex-col items-center justify-center min-h-screen pt-16">

    <!-- Centered text area -->
    <div class="flex flex-col items-center text-center px-6 pt-16 md:pt-24 pb-10 md:pb-14">

      <!-- Badge -->
      <span class="inline-block px-4 py-1.5 rounded-full text-xs font-medium tracking-wide mb-8"
            style="background: rgba(255,107,53,0.12); color: #FF8F66; border: 1px solid rgba(255,107,53,0.2);">
        AI 踩点混剪拼接器
      </span>

      <!-- Main heading -->
      <h1 class="font-display font-bold text-5xl sm:text-6xl md:text-7xl tracking-tight text-white leading-none mb-4">
        素材骰子
      </h1>
      <p class="font-display text-lg md:text-xl font-medium tracking-tight mb-6" style="color: #FF8F66;">
        Material Dice
      </p>

      <!-- Tagline -->
      <p class="font-body text-lg md:text-xl max-w-lg mx-auto mb-10" style="color: #A0A0A0;">
        给音乐，出成片结构。专治混剪选择困难症。
      </p>

      <!-- CTA buttons -->
      <div class="flex flex-col sm:flex-row items-center gap-4 mb-14 md:mb-16">
        <button data-dom-id="hero-cta"
                class="px-8 py-3 rounded-full text-sm font-medium text-white bg-primary hover:bg-primary-dark transition-colors shadow-lg shadow-primary/20 cursor-pointer">
          摇一个初稿试试
        </button>
        <button class="px-8 py-3 rounded-full text-sm font-medium cursor-pointer transition-colors"
                style="border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.7);"
                onmouseover="this.style.borderColor='rgba(255,255,255,0.4)';this.style.color='rgba(255,255,255,0.9)'"
                onmouseout="this.style.borderColor='rgba(255,255,255,0.2)';this.style.color='rgba(255,255,255,0.7)'">
          了解工作原理
        </button>
      </div>

      <!-- Hero image -->
      <div class="w-full max-w-[900px] rounded-2xl overflow-hidden border border-white/[0.06] shadow-2xl shadow-black/50">
        <img src="../assets/image_0_yi19x4.jpg" alt="素材骰子 - 视频帧骰子" class="w-full h-auto block" loading="eager">
      </div>
    </div>

    <!-- KPI stats row -->
    <div class="w-full max-w-3xl mx-auto px-6 pb-20 md:pb-28">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 sm:gap-8">
        <div class="flex flex-col items-center text-center py-6 rounded-xl" style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);">
          <span class="font-display font-bold text-2xl md:text-3xl text-white mb-1">3 分钟</span>
          <span class="text-sm" style="color: #A0A0A0;">出初稿</span>
        </div>
        <div class="flex flex-col items-center text-center py-6 rounded-xl" style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);">
          <span class="font-display font-bold text-2xl md:text-3xl text-primary mb-1">自动</span>
          <span class="text-sm" style="color: #A0A0A0;">鼓点对齐</span>
        </div>
        <div class="flex flex-col items-center text-center py-6 rounded-xl" style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);">
          <span class="font-display font-bold text-2xl md:text-3xl text-white mb-1">.prproj</span>
          <span class="text-sm" style="color: #A0A0A0;">导出支持</span>
        </div>
      </div>
    </div>

  </main>


    <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    background-color: #0D0D0D;
    color: #F5F5F5;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::selection {
    background-color: rgba(255, 107, 53, 0.3);
    color: #F5F5F5;
  }
</style>
</body>
</html>
