<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>造梦西游 - 横版动作游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'SimHei', 'Microsoft YaHei', sans-serif;
        }
        #gameWrapper {
            position: relative;
            border: 3px solid #4a3728;
            box-shadow: 0 0 30px rgba(200, 100, 50, 0.4);
        }
        #gameCanvas { display: block; }
        
        #uiLayer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        
        #waveNotify {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff6600;
            white-space: nowrap;
        }
        #waveNotify.bossWarning {
            font-size: 48px;
            color: #ff0000;
            text-shadow: 0 0 30px #ff0000, 0 0 60px #ff4400, 0 0 90px #ff8800;
            animation: bossPulse 0.6s ease-in-out infinite, bossShake 0.3s ease-in-out infinite;
        }
        @keyframes bossPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.7; }
        }
        @keyframes bossShake {
            0%, 100% { left: 50%; }
            25% { left: 51%; }
            75% { left: 49%; }
        }
        #screenFlash {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 0, 0, 0);
            pointer-events: none;
            transition: background 0.1s;
        }
        #screenFlash.active {
            background: rgba(255, 0, 0, 0.3);
            animation: flashFade 0.8s ease-out forwards;
        }
        @keyframes flashFade {
            0% { background: rgba(255, 0, 0, 0.4); }
            100% { background: rgba(255, 0, 0, 0); }
        }
        #heroSelect {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(5, 5, 20, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #heroSelect h2 {
            color: #ffd700;
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #ffd700;
        }
        .heroCornerText {
            position: absolute;
            color: #ffd700;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff8800, 0 0 20px #ff4400;
            pointer-events: none;
        }
        #cornerLeft {
            top: 16px;
            left: 20px;
            animation: cornerFloat 2s ease-in-out infinite;
        }
        #cornerRight {
            top: 16px;
            right: 20px;
            animation: cornerFloat 2s ease-in-out 0.5s infinite;
        }
        @keyframes cornerFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        #heroStats {
            position: absolute;
            bottom: 18px;
            right: 20px;
            display: flex;
            gap: 16px;
            pointer-events: none;
        }
        .statItem {
            color: #ffd700;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 8px #ff8800;
            background: rgba(0,0,0,0.5);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255,200,0,0.3);
        }
        .statItem .statVal {
            color: #fff;
            margin-left: 4px;
        }
        #confirmBtn {
            margin-top: 20px;
            padding: 10px 48px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(180deg, #d4a017, #a07810);
            border: 2px solid #ffd700;
            border-radius: 6px;
            cursor: pointer;
            text-shadow: 0 0 8px #ffd700;
            box-shadow: 0 0 15px rgba(255,200,0,0.3);
            transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
            pointer-events: auto;
        }
        #confirmBtn:hover {
            background: linear-gradient(180deg, #e8b820, #c09818);
            box-shadow: 0 0 25px rgba(255,200,0,0.5);
            transform: scale(1.04);
        }
        #confirmBtn:active {
            transform: scale(0.96);
        }
        #heroCards {
            display: flex;
            gap: 24px;
        }
        .heroCard {
            width: 140px;
            padding: 10px;
            background: rgba(30, 30, 60, 0.8);
            border: 2px solid #555;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s, transform 0.2s;
        }
        .heroCard:hover {
            border-color: #ffd700;
            background: rgba(60, 40, 20, 0.8);
            transform: scale(1.05);
        }
        .heroCard.selected {
            border-color: #ffd700;
            background: rgba(80, 60, 20, 0.9);
            box-shadow: 0 0 20px rgba(255, 200, 0, 0.4);
        }
        .heroPreview {
            display: block;
            margin: 0 auto 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
        }
        .heroName {
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
        }
        
        #skillBar {
            position: absolute;
            top: 82px;
            left: 10px;
            display: flex;
            gap: 8px;
            opacity: 0.9;
        }
        .skillIcon {
            width: 40px; height: 40px;
            border: 2px solid #ffd700;
            border-radius: 5px;
            background: rgba(0,0,0,0.7);
            color: #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            position: relative;
        }
        .skillIcon.onCd {
            border-color: #666;
            color: #666;
        }
        .skillCdOverlay {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            border-radius: 0 0 3px 3px;
        }
        #restartBtn {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 36px;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(180deg, #cc3333, #881111);
            border: 2px solid #ff6644;
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto;
            text-shadow: 0 0 10px #ff0000;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
            transition: background 0.2s;
        }
        #restartBtn:hover {
            background: linear-gradient(180deg, #ee4444, #aa2222);
            box-shadow: 0 0 30px rgba(255,0,0,0.7);
        }
    </style>
</head>
<body>
    <div id="gameWrapper">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="heroSelect" style="display:none;">
            <div id="cornerLeft" class="heroCornerText">快来玩啊</div>
            <div id="cornerRight" class="heroCornerText">你会给吉米一朵小红花的对吗</div>
            <h2>选择英雄</h2>
            <div id="heroCards">
                <div class="heroCard" data-hero="frontier">
                    <canvas class="heroPreview" id="previewFrontier" width="100" height="100"></canvas>
                    <span class="heroName">Frontier Defender</span>
                </div>
                <div class="heroCard" data-hero="spartan">
                    <canvas class="heroPreview" id="previewSpartan" width="100" height="100"></canvas>
                    <span class="heroName">Spartan Spearman</span>
                </div>
                <div class="heroCard" data-hero="greek">
                    <canvas class="heroPreview" id="previewGreek" width="100" height="100"></canvas>
                    <span class="heroName">Greek Warrior</span>
                </div>
            </div>
            <button id="confirmBtn" onclick="confirmHero()">确认选择</button>
            <div id="heroStats">
                <span class="statItem">胜利通关 <span class="statVal" id="statWins">0</span></span>
                <span class="statItem">失败 <span class="statVal" id="statLosses">0</span></span>
            </div>
        </div>
        <div id="uiLayer" style="display:none;">
            <div id="waveNotify"></div>
            <div id="screenFlash"></div>
            <div id="restartBtn" onclick="returnToHeroSelect()" style="display:none;">返回选人</div>
            <div id="skillBar">
                <div class="skillIcon" id="skillIconJ">J</div>
                <div class="skillIcon" id="skillIconU">U</div>
                <div class="skillIcon" id="skillIconI">I</div>
                <div class="skillIcon" id="skillIconF" style="border-color:#ffd700; color:#ffd700;">F</div>
            </div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const W = 800, H = 500;
        const WORLD_W = 4200;
        const GROUND_Y = 440;
        const GROUND_H = 60;

        const waveNotify = document.getElementById('waveNotify');
        const skillIconJ = document.getElementById('skillIconJ');
        const skillIconU = document.getElementById('skillIconU');
        const skillIconI = document.getElementById('skillIconI');

        let keys = {};
        let cameraX = 0;
        let screenShake = 0;
        let gameState = 'free';
        let waveActive = false;
        let lockRight = WORLD_W;
        let lockLeft = 0;
        let waveEnemiesRemaining = 0;
        let waveNotifyTimer = 0;
        let notifyText = '';
        let spawnDelay = 0;

        const platforms = createPlatforms();
        function createPlatforms() {
            const p = [];
            p.push({ x: 0, y: GROUND_Y, wide: WORLD_W, h: GROUND_H, color: '#5d4037' });
            p.push({ x: 120, y: 330, wide: 160, h: 30, color: '#7d6254' });
            p.push({ x: 380, y: 290, wide: 170, h: 30, color: '#7d6254' });
            p.push({ x: 680, y: 250, wide: 180, h: 30, color: '#7d6254' });
            p.push({ x: 980, y: 210, wide: 160, h: 30, color: '#7d6254' });
            p.push({ x: 1300, y: 240, wide: 180, h: 30, color: '#8e7560' });
            p.push({ x: 1600, y: 280, wide: 170, h: 30, color: '#8e7560' });
            p.push({ x: 1900, y: 320, wide: 180, h: 30, color: '#8e7560' });
            p.push({ x: 2200, y: 290, wide: 160, h: 30, color: '#8e7560' });
            p.push({ x: 2500, y: 250, wide: 180, h: 30, color: '#8e7560' });
            p.push({ x: 2750, y: 210, wide: 170, h: 30, color: '#9e8568' });
            p.push({ x: 3050, y: 240, wide: 180, h: 30, color: '#9e8568' });
            p.push({ x: 3350, y: 280, wide: 170, h: 30, color: '#9e8568' });
            p.push({ x: 3650, y: 320, wide: 180, h: 30, color: '#9e8568' });
            p.push({ x: 3900, y: 270, wide: 170, h: 30, color: '#9e8568' });
            return p;
        }

        const TRIGGER1 = 1200, TRIGGER2 = 2600, TRIGGER3 = 3800;
        let wave1Done = false, wave2Done = false, wave3Done = false;

        class Player {
            constructor(heroType) {
                this.heroType = heroType || 'frontier';
                this.w = 72; this.h = 111;
                this.x = 80; this.y = GROUND_Y - this.h;
                this.vx = 0; this.vy = 0;
                this.speed = 3;
                this.jumpPower = -12;
                this.grounded = false;
                this.facingRight = true;

                this.maxHp = 100; this.hp = 100;
                this.maxMp = 80; this.mp = 80;
                this.maxRage = 100; this.rage = 0;

                this.attacking = false;
                this.attackTimer = 0;
                this.attackDuration = 20;
                this.attackCooldown = 0;
                this.attackDmg = 5;
                this.attackRange = 120;

                this.skillCooldown = 0;
                this.skillCdMax = 300;
                this.skillDmg = 20;
                this.skillMpCost = 20;

                this.ultDmg = 50;

                this.castTimer = 0;

                this.lockedEnemy = null;

                this.invincible = false;
                this.invincibleTimer = 0;
                this.deathTimer = 0;

                this.parryTimer = 0;
                this.parryCooldown = 0;
                this.parryEffect = 0;

                this.dropThrough = false;

                this.animState = 'idle';
                this.animFrame = 0;
                this.animTimer = 0;
                this.comboCount = 0;
                this.comboTimer = 0;

                this.mpRegenAccum = 0;

                this.spriteH = 132;
                this.spriteW = Math.round(this.spriteH * 720 / 480);
                this.spriteOffsetX = Math.round((this.spriteW - this.w) / 2);
                this.spriteOffsetY = this.spriteH - this.h;
            }

            update(enemies) {
                if (this.hp <= 0) {
                    this.deathTimer--;
                    this.animTimer++;
                    this.updateAnimState();
                    if (this.deathTimer <= 0) gameOver();
                    return;
                }

                this.vx = 0;
                if (!this.attacking) {
                    if (keys['KeyA']) {
                        this.vx = -this.speed;
                        this.facingRight = false;
                    }
                    if (keys['KeyD']) {
                        this.vx = this.speed;
                        this.facingRight = true;
                    }
                    if (keys['KeyK'] && this.grounded) {
                        this.vy = this.jumpPower;
                        this.grounded = false;
                    }
                }

                if (keys['KeyJ'] && !this.attacking && this.attackTimer <= 0 && this.attackCooldown <= 0) {
                    this.attacking = true;
                    this.attackTimer = this.attackDuration;
                    this.attackCooldown = 60;
                    this.animFrame = 0;
                }
                if (keys['KeyU'] && this.skillCooldown <= 0 && this.mp >= this.skillMpCost) {
                    this.skillCooldown = this.skillCdMax;
                    this.mp -= this.skillMpCost;
                    this.castTimer = 6;
                    this.animFrame = 0;
                    const px = this.x + this.w / 2;
                    const py = this.y + this.h / 2 - 10;
                    const dir = this.facingRight ? 1 : -1;
                    projectiles.push(new Projectile(px, py, dir, 'stone'));
                    keys['KeyU'] = false;
                }
                if (keys['KeyI'] && this.rage >= this.maxRage) {
                    this.rage = 0;
                    this.castTimer = 8;
                    this.animFrame = 0;
                    const px = this.x + this.w / 2;
                    const py = this.y + this.h / 2 - 15;
                    const dir = this.facingRight ? 1 : -1;
                    projectiles.push(new Projectile(px, py, dir, 'giantRock'));
                    keys['KeyI'] = false;
                }
                if (keys['KeyQ'] && !this.attacking) {
                    this.toggleLockOn(enemies);
                    keys['KeyQ'] = false;
                }
                if (keys['KeyF'] && this.parryCooldown <= 0 && this.parryTimer <= 0) {
                    this.parryTimer = 55;
                    this.parryCooldown = 110;
                    this.parryEffect = 8;
                    this.invincibleTimer = 55;
                    keys['KeyF'] = false;
                }
                if (keys['KeyS'] && keys['KeyK'] && this.grounded) {
                    this.dropThrough = true;
                    this.vy = 3;
                    this.grounded = false;
                    this.y += 4;
                }

                if (this.attackTimer > 0) this.attackTimer--;
                if (this.attackCooldown > 0) this.attackCooldown--;
                if (this.skillCooldown > 0) this.skillCooldown--;
                if (this.castTimer > 0) this.castTimer--;
                if (this.invincibleTimer > 0) this.invincibleTimer--;
                if (this.parryTimer > 0) this.parryTimer--;
                if (this.parryCooldown > 0) this.parryCooldown--;
                if (this.parryEffect > 0) this.parryEffect--;

                this.mpRegenAccum += 5 / 60;
                if (this.mpRegenAccum >= 1) {
                    const add = Math.floor(this.mpRegenAccum);
                    this.mp = Math.min(this.mp + add, this.maxMp);
                    this.mpRegenAccum -= add;
                }

                this.vy += 0.45;
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0) this.x = 0;
                if (this.x < lockLeft) this.x = lockLeft;
                if (this.x + this.w > lockRight) this.x = lockRight - this.w;

                this.grounded = false;
                this.resolvePlatforms();

                if (this.attacking) {
                    if (this.attackTimer === Math.floor(this.attackDuration / 2)) {
                        this.hitEnemies(enemies, this.attackDmg, this.attackRange);
                    }
                    if (this.attackTimer <= 0) this.attacking = false;
                }

                this.animTimer++;
                this.updateAnimState();

                if (this.lockedEnemy && !this.lockedEnemy.active) this.lockedEnemy = null;
                if (this.comboTimer > 0) this.comboTimer--;
                else this.comboCount = 0;

                this.checkTriggers();
            }

            updateAnimState() {
                if (this.hp <= 0) {
                    this.animState = 'dying';
                } else if (this.attacking || this.castTimer > 0) {
                    this.animState = 'attacking';
                } else if (this.invincibleTimer > 0) {
                    this.animState = 'hurt';
                } else if (this.vx !== 0 && this.grounded) {
                    this.animState = 'walking';
                } else {
                    this.animState = 'idle';
                }

                let speed = 8;
                if (this.animState === 'attacking') speed = 1;
                else if (this.animState === 'hurt') speed = 3;
                else if (this.animState === 'dying') speed = 4;
                else if (this.animState === 'walking') speed = 4;

                if (this.animTimer >= speed) {
                    this.animTimer = 0;
                    const maxFrames = this.getAnimMaxFrames();
                    if (this.animState === 'dying') {
                        if (this.animFrame < maxFrames - 1) this.animFrame++;
                    } else {
                        this.animFrame = (this.animFrame + 1) % maxFrames;
                    }
                }
            }

            getAnimMaxFrames() {
                if (this.animState === 'walking') return 24;
                if (this.animState === 'attacking') return 12;
                if (this.animState === 'hurt') return 12;
                if (this.animState === 'dying') return 15;
                return 1;
            }

            getAnimFolder() {
                if (this.animState === 'walking' || this.animState === 'idle') return 'Walking';
                if (this.animState === 'attacking') return 'Attacking';
                if (this.animState === 'hurt') return 'Hurt';
                if (this.animState === 'dying') return 'Dying';
                return 'Walking';
            }

            resolvePlatforms() {
                for (const p of platforms) {
                    if (p.y >= GROUND_Y) continue;
                    if (this.dropThrough) continue;
                    if (this.x + this.w > p.x && this.x < p.x + p.wide &&
                        this.y + this.h >= p.y && this.y + this.h <= p.y + p.h + 16) {
                        this.y = p.y - this.h;
                        this.vy = 0;
                        this.grounded = true;
                    }
                }
                for (const p of platforms) {
                    if (p.y < GROUND_Y) continue;
                    if (this.x + this.w > p.x && this.x < p.x + p.wide &&
                        this.y + this.h >= p.y && this.y + this.h <= p.y + p.h + 16) {
                        this.y = p.y - this.h;
                        this.vy = 0;
                        this.grounded = true;
                        this.dropThrough = false;
                    }
                }
            }

            hitEnemies(enemies, dmg, range) {
                let hitAny = false;
                let facingOverride = this.facingRight;
                if (this.lockedEnemy && this.lockedEnemy.active) {
                    facingOverride = this.lockedEnemy.x > this.x;
                }
                for (const enemy of enemies) {
                    if (!enemy.active) continue;
                    const hx = facingOverride ? this.x + this.w : this.x - range;
                    const hr = { x: hx, y: this.y, wide: range, h: this.h };
                    const er = { x: enemy.x, y: enemy.y, wide: enemy.w, h: enemy.h };
                    if (rectsOverlap(hr, er)) {
                        const killed = enemy.takeDamage(dmg);
                        hitAny = true;
                        enemy.hitFlash = 6;
                        enemy.x += facingOverride ? 12 : -12;
                        screenShake = 5;
                        if (killed) {
                            this.onKill(enemy);
                        }
                    }
                }
                if (hitAny) { this.comboCount++; this.comboTimer = 60; }
            }

            onKill(enemy) {
                if (enemy.type === 'ogre1' || enemy.type === 'orc1' || enemy.type === 'orc2' || enemy.type === 'orc3')
                    this.rage = Math.min(this.rage + 10, this.maxRage);
                else if (enemy.type === 'ogre2' || enemy.type === 'ogre3')
                    this.rage = Math.min(this.rage + 20, this.maxRage);
                else if (enemy.type === 'golem2')
                    this.rage = Math.min(this.rage + 100, this.maxRage);
                if (waveActive) waveEnemiesRemaining--;
                if (Math.random() < 0.5) {
                    items.push(new DropItem(enemy.x, enemy.y));
                }
            }

            parryKill(enemy) {
                enemy.hp = 0;
                enemy.active = false;
                this.parryEffect = 12;
                this.parryTimer = 0;
                this.rage = Math.min(this.rage + 15, this.maxRage);
                if (waveActive) waveEnemiesRemaining--;
                items.push(new DropItem(enemy.x, enemy.y));
            }

            toggleLockOn(enemies) {
                if (this.lockedEnemy) { this.lockedEnemy = null; return; }
                let nearest = null, nearestDist = Infinity;
                for (const e of enemies) {
                    if (!e.active) continue;
                    const d = Math.abs(e.x + e.w / 2 - (this.x + this.w / 2));
                    if (d < nearestDist) { nearestDist = d; nearest = e; }
                }
                this.lockedEnemy = nearest;
            }

            takeDamage(dmg) {
                if (this.invincibleTimer > 0) return;
                if (this.hp <= 0) return;
                this.hp -= dmg;
                this.invincibleTimer = 40;
                if (this.hp <= 0) {
                    this.hp = 0;
                    this.animState = 'dying';
                    this.animFrame = 0;
                    this.animTimer = 0;
                    this.deathTimer = 60;
                }
            }

            checkTriggers() {
                if (!wave1Done && this.x + this.w / 2 >= TRIGGER1) {
                    wave1Done = true;
                    startWave(1);
                }
                if (!wave2Done && this.x + this.w / 2 >= TRIGGER2) {
                    wave2Done = true;
                    startWave(2);
                }
                if (!wave3Done && this.x + this.w / 2 >= TRIGGER3) {
                    wave3Done = true;
                    startWave(3);
                }
            }

            draw() {
                if (heroSpritesLoaded && heroSprites[this.heroType]) {
                    this.drawSprite();
                } else {
                    this.drawFallback();
                }
            }

            drawSprite() {
                const sprites = heroSprites[this.heroType];
                if (!sprites) { this.drawFallback(); return; }
                const folder = this.getAnimFolder();
                const frames = sprites[folder];
                if (!frames || frames.length === 0) { this.drawFallback(); return; }
                const frameIdx = Math.min(this.animFrame, frames.length - 1);
                const img = frames[frameIdx];
                if (!img || !img.complete || img.naturalWidth === 0) { this.drawFallback(); return; }

                let sw = this.spriteW, sh = this.spriteH;
                if (img.naturalWidth && img.naturalHeight) {
                    sh = this.spriteH;
                    sw = Math.round(sh * img.naturalWidth / img.naturalHeight);
                }
                const ox = Math.round((sw - this.w) / 2);
                const oy = sh - this.h - 24;

                const sx = this.x - ox - cameraX;
                const sy = this.y - oy;

                if (this.invincibleTimer > 0) {
                    const shimmer = Math.sin(Date.now() / 60) * 0.2 + 0.8;
                    ctx.globalAlpha = shimmer;
                }

                ctx.save();
                if (!this.facingRight) {
                    ctx.translate(sx + sw, 0);
                    ctx.scale(-1, 1);
                    ctx.translate(-sx, 0);
                }
                ctx.drawImage(img, sx, sy, sw, sh);
                ctx.restore();
                ctx.globalAlpha = 1;
            }

            drawFallback() {
                if (this.invincibleTimer > 0) {
                    const shimmer = Math.sin(Date.now() / 60) * 0.2 + 0.8;
                    ctx.globalAlpha = shimmer;
                }
                ctx.save();
                const sx = this.x - cameraX;
                if (!this.facingRight) {
                    ctx.translate(sx + this.w, 0);
                    ctx.scale(-1, 1);
                    ctx.translate(-sx, 0);
                }
                const sy = this.y;

                ctx.fillStyle = '#e8c9a0';
                ctx.beginPath();
                ctx.arc(sx + 18, sy + 10, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#333';
                ctx.fillRect(sx + 10, sy + 3, 16, 6);

                ctx.fillStyle = '#cc3333';
                ctx.fillRect(sx + 8, sy + 18, 20, 14);

                ctx.fillStyle = '#d4a017';
                ctx.fillRect(sx + 8, sy + 32, 10, 6);
                ctx.fillRect(sx + 18, sy + 32, 10, 6);

                ctx.fillStyle = '#c0c0c0';
                if (this.attacking) {
                    const wExt = 18;
                    ctx.fillRect(sx + 32, sy + 18, wExt, 4);
                } else {
                    ctx.fillRect(sx + 30, sy + 24, 14, 3);
                }

                ctx.fillStyle = '#111';
                ctx.beginPath();
                ctx.arc(sx + 14, sy + 9, 1.5, 0, Math.PI * 2);
                ctx.arc(sx + 22, sy + 9, 1.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
                ctx.globalAlpha = 1;
            }
        }

        class Enemy {
            constructor(x, type) {
                this.type = type;
                this.facingRight = true;
                this.active = true;
                this.grounded = false;
                this.vx = 0; this.vy = 0;
                this.animTimer = 0; this.animFrame = 0;

                if (type === 'ogre1' || type === 'orc1' || type === 'orc2' || type === 'orc3') {
                    this.w = 54; this.h = 78;
                    this.maxHp = 20; this.hp = 20;
                    this.dmg = 2;
                    this.speed = 0.8;
                    this.attackRange = 75;
                    this.attackCd = 0;
                    this.attackCdMax = 220;
                } else if (type === 'ogre2' || type === 'ogre3') {
                    this.w = 66; this.h = 90;
                    this.maxHp = 80; this.hp = 80;
                    this.dmg = 10;
                    this.speed = 0.6;
                    this.attackRange = 98;
                    this.attackCd = 0;
                    this.attackCdMax = 280;
                } else if (type === 'golem2') {
                    this.w = 135; this.h = 165;
                    this.maxHp = 800; this.hp = 800;
                    this.dmg = 20;
                    this.speed = 0.35;
                    this.attackRange = 128;
                    this.attackCd = 0;
                    this.attackCdMax = 350;
                }

                this.spriteW = this.w + 16;
                this.spriteH = this.h + 16;
                this.spriteOffX = Math.round((this.spriteW - this.w) / 2);
                this.spriteOffY = 8;

                this.x = x;
                this.y = GROUND_Y - this.h;
                this.attackingAnim = 0;
                this.attackHitDone = false;
                this.hitFlash = 0;
                this.parryCount = 0;
                this.parryStunTimer = 0;
            }

            update(player) {
                if (!this.active) return;
                if (this.attackCd > 0) this.attackCd--;
                if (this.attackingAnim > 0) this.attackingAnim--;
                if (this.hitFlash > 0) this.hitFlash--;
                if (this.parryStunTimer > 0) this.parryStunTimer--;

                const dx = player.x - this.x;
                this.facingRight = dx > 0;
                const dist = Math.abs(dx);

                if (this.parryStunTimer > 0) {
                    this.vx = 0;
                } else {
                    if (dist > this.attackRange) {
                        this.vx = dx > 0 ? this.speed : -this.speed;
                    } else {
                        this.vx = 0;
                        if (this.attackCd <= 0 && this.attackingAnim <= 0) {
                            this.attackingAnim = 35;
                            this.attackCd = this.attackCdMax;
                            this.attackHitDone = false;
                        }
                    }
                }

                const yClose = Math.abs((player.y + player.h) - (this.y + this.h)) < 70;
                if (this.attackingAnim > 0 && this.attackingAnim <= 15 && !this.attackHitDone && dist < this.attackRange + 40 && yClose) {
                    if (player.parryTimer > 0) {
                        if (this.type === 'golem2') {
                            this.parryCount++;
                            const parryDmg = Math.ceil(this.maxHp / 3);
                            this.hp = Math.max(this.hp - parryDmg, 0);
                            this.attackingAnim = 0;
                            this.attackCd = 80;
                            this.parryStunTimer = 30;
                            this.vx = 0;
                            this.hitFlash = 20;
                            this.x += player.facingRight ? 50 : -50;
                            screenShake = 10;
                            player.parryEffect = 18;
                            if (this.parryCount >= 3 || this.hp <= 0) {
                                this.hp = 0;
                                this.active = false;
                                player.parryTimer = 0;
                                player.parryEffect = 20;
                                player.rage = Math.min(player.rage + 100, player.maxRage);
                                if (waveActive) waveEnemiesRemaining--;
                                items.push(new DropItem(this.x, this.y));
                                screenShake = 14;
                            }
                        } else {
                            player.parryKill(this);
                        }
                    } else {
                        player.takeDamage(this.dmg);
                    }
                    this.attackHitDone = true;
                }

                this.vy += 0.45;
                this.x += this.vx;
                this.y += this.vy;
                this.grounded = false;
                for (const p of platforms) {
                    if (this.x + this.w > p.x && this.x < p.x + p.wide &&
                        this.y + this.h >= p.y && this.y + this.h <= p.y + p.h + 16) {
                        this.y = p.y - this.h;
                        this.vy = 0;
                        this.grounded = true;
                    }
                }
                if (this.y + this.h > GROUND_Y + GROUND_H) this.y = GROUND_Y - this.h;
                if (this.x < 0) this.x = 0;
                if (this.x + this.w > WORLD_W) this.x = WORLD_W - this.w;

                this.animTimer++;
                if (this.animTimer > 10) { this.animFrame = (this.animFrame + 1) % 4; this.animTimer = 0; }
            }

            takeDamage(dmg) {
                this.hp -= dmg;
                if (this.hp <= 0) { this.hp = 0; this.active = false; return true; }
                return false;
            }

            draw() {
                if (!this.active) return;
                if (this.type === 'golem2' && golem2SpritesLoaded) {
                    this.drawGolem2Sprite();
                } else if ((this.type.startsWith('ogre') && ogreSpritesLoaded && ogreSprites[this.type]) ||
                           (this.type.startsWith('orc') && orcSpritesLoaded && orcSprites[this.type])) {
                    this.drawWithSprite();
                } else {
                    this.drawFallbackShape();
                }
                if (this.hitFlash > 0) {
                    const bx = this.x - cameraX, by = this.y;
                    ctx.fillStyle = 'rgba(255,255,255,' + (this.hitFlash / 6 * 0.5) + ')';
                    ctx.fillRect(bx, by, this.w, this.h);
                }
                if (this.type === 'golem2' || this.hp < this.maxHp) {
                    const bx = this.x - cameraX, by = this.y - 20;
                    ctx.fillStyle = '#333';
                    ctx.fillRect(bx, by, this.w, 5);
                    const hpRatio = this.hp / this.maxHp;
                    const hpGrad = ctx.createLinearGradient(bx, 0, bx + this.w, 0);
                    hpGrad.addColorStop(0, '#ff2222');
                    hpGrad.addColorStop(0.5, '#ff4444');
                    hpGrad.addColorStop(1, '#cc0000');
                    ctx.fillStyle = hpGrad;
                    ctx.fillRect(bx, by, this.w * hpRatio, 5);
                    ctx.strokeStyle = '#ff6666';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(bx, by, this.w, 5);
                }
                if (this.type === 'golem2' && this.parryCount > 0) {
                    const bx = this.x - cameraX, by = this.y - 28;
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(bx, by, this.w, 8);
                    for (let pi = 0; pi < 3; pi++) {
                        ctx.fillStyle = pi < this.parryCount ? '#ffd700' : '#444';
                        ctx.fillRect(bx + 4 + pi * 12, by + 1, 8, 6);
                    }
                }
                if (this.parryStunTimer > 0) {
                    const bx = this.x + this.w / 2 - cameraX;
                    const by = this.y - 36;
                    ctx.fillStyle = 'rgba(255,255,0,' + (this.parryStunTimer / 30 * 0.8) + ')';
                    ctx.font = 'bold 12px SimHei';
                    ctx.textAlign = 'center';
                    ctx.fillText('破防!', bx, by);
                }
            }

            drawWithSprite() {
                const sets = this.type.startsWith('ogre') ? ogreSprites[this.type] : orcSprites[this.type];
                const animState = this.attackingAnim > 0 ? 'Attacking' : 'Walking';
                const imgs = sets[animState];
                if (!imgs || imgs.length === 0) { this.drawFallbackShape(); return; }
                const fIdx = this.animFrame % imgs.length;
                const img = imgs[fIdx];
                if (!img || !img.complete || img.naturalWidth === 0) { this.drawFallbackShape(); return; }

                let sw = this.spriteW, sh = this.spriteH;
                if (img.naturalWidth && img.naturalHeight) {
                    sh = this.spriteH;
                    sw = Math.round(sh * img.naturalWidth / img.naturalHeight);
                }
                const ox = Math.round((sw - this.w) / 2);
                const sx = this.x - ox - cameraX;
                const sy = this.y - this.spriteOffY;

                ctx.save();
                if (!this.facingRight) {
                    ctx.translate(sx + sw, 0);
                    ctx.scale(-1, 1);
                    ctx.translate(-sx, 0);
                }
                ctx.drawImage(img, sx, sy, sw, sh);
                ctx.restore();
            }

            drawGolem2Sprite() {
                const animState = this.attackingAnim > 0 ? 'Attacking' : 'Walking';
                const imgs = golem2Sprites[animState];
                if (!imgs || imgs.length === 0) { this.drawFallbackShape(); return; }
                const fIdx = this.animFrame % imgs.length;
                const img = imgs[fIdx];
                if (!img || !img.complete || img.naturalWidth === 0) { this.drawFallbackShape(); return; }

                let sw = this.spriteW, sh = this.spriteH;
                if (img.naturalWidth && img.naturalHeight) {
                    sh = this.spriteH;
                    sw = Math.round(sh * img.naturalWidth / img.naturalHeight);
                }
                const ox = Math.round((sw - this.w) / 2);
                const sx = this.x - ox - cameraX;
                const sy = this.y - this.spriteOffY;

                ctx.save();
                if (!this.facingRight) {
                    ctx.translate(sx + sw, 0);
                    ctx.scale(-1, 1);
                    ctx.translate(-sx, 0);
                }
                ctx.drawImage(img, sx, sy, sw, sh);
                ctx.restore();
            }

            drawFallbackShape() {
                ctx.save();
                const sx = this.x - cameraX;
                if (!this.facingRight) {
                    ctx.translate(sx + this.w, 0);
                    ctx.scale(-1, 1);
                    ctx.translate(-sx, 0);
                }
                const sy = this.y;
                let colors;
                if (this.type.startsWith('orc')) {
                    colors = ['#dd8844', '#996633'];
                } else if (this.type === 'golem2') {
                    colors = ['#884422', '#552211'];
                } else {
                    colors = this.type === 'ogre1' ? ['#cc6633', '#884422'] :
                             this.type === 'ogre2' ? ['#338844', '#226633'] :
                                                    ['#993333', '#661111'];
                }

                ctx.fillStyle = colors[1];
                ctx.fillRect(sx + 4, sy + 20, this.w - 8, this.h - 20);
                ctx.fillStyle = colors[0];
                ctx.beginPath();
                ctx.arc(sx + this.w / 2, sy + 10, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#222';
                ctx.beginPath();
                ctx.arc(sx + this.w / 2 - 4, sy + 8, 2, 0, Math.PI * 2);
                ctx.arc(sx + this.w / 2 + 4, sy + 8, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.type.slice(-1), sx + this.w / 2, sy + 25);
                ctx.restore();
            }
        }

        class DropItem {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.w = 22; this.h = 22;
                this.vy = 0;
                this.active = true;
                this.timer = 360;
                const r = Math.random();
                if (r < 0.25) this.itemType = 'carrot';
                else if (r < 0.55) this.itemType = 'peach';
                else this.itemType = 'star';
                this.bob = 0;
            }
            update() {
                if (!this.active) return;
                this.vy += 0.45;
                this.y += this.vy;
                if (this.y + this.h >= GROUND_Y) {
                    this.y = GROUND_Y - this.h;
                    this.vy = 0;
                }
                this.timer--;
                if (this.timer <= 0) this.active = false;
                this.bob = Math.sin(Date.now() / 180) * 2;
            }
            draw() {
                if (!this.active) return;
                const sx = this.x - cameraX;
                const sy = this.y + this.bob;
                if (this.itemType === 'carrot') {
                    ctx.fillStyle = '#ff6600';
                    ctx.beginPath();
                    ctx.moveTo(sx + 2, sy + 16);
                    ctx.lineTo(sx + 11, sy + 2);
                    ctx.lineTo(sx + 20, sy + 16);
                    ctx.fill();
                    ctx.fillStyle = '#33aa33';
                    ctx.fillRect(sx + 8, sy + 0, 6, 5);
                } else if (this.itemType === 'peach') {
                    ctx.fillStyle = '#ff9999';
                    ctx.beginPath();
                    ctx.arc(sx + 9, sy + 14, 9, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff6666';
                    ctx.beginPath();
                    ctx.arc(sx + 6, sy + 10, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#33aa33';
                    ctx.fillRect(sx + 9, sy + 2, 3, 8);
                } else if (this.itemType === 'star') {
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    const cx = sx + 11, cy = sy + 11, r = 10;
                    for (let i = 0; i < 5; i++) {
                        const a = (i * 72 - 90) * Math.PI / 180;
                        const a2 = ((i * 72 + 36) - 90) * Math.PI / 180;
                        if (i === 0) ctx.moveTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
                        else ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
                        ctx.lineTo(cx + r * 0.4 * Math.cos(a2), cy + r * 0.4 * Math.sin(a2));
                    }
                    ctx.closePath();
                    ctx.fill();
                }
            }
            apply(player) {
                if (!this.active) return;
                if (this.itemType === 'carrot') player.hp = Math.min(player.hp + 20, player.maxHp);
                else if (this.itemType === 'peach') player.hp = Math.min(player.hp + 50, player.maxHp);
                else if (this.itemType === 'star') player.mp = Math.min(player.mp + 50, player.maxMp);
                this.active = false;
            }
        }

        function rectsOverlap(a, b) {
            return a.x < b.x + b.wide && a.x + a.wide > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function clamp(v, min, max) {
            return v < min ? min : (v > max ? max : v);
        }

        class Projectile {
            constructor(x, y, dir, type) {
                this.x = x; this.y = y;
                this.dir = dir;

            update() {
                if (!this.active) return;
                this.x += this.dir * this.speed;
                if (this.x < cameraX - 100 || this.x > cameraX + W + 100) this.active = false;

            draw() {
                if (!this.active) return;
                const sx = this.x - cameraX;
                const sy = this.y;
                ctx.save();
                if (this.type === 'stone') {
                    ctx.fillStyle = '#887766';
                    ctx.beginPath();
                    ctx.arc(sx + 10, sy + 10, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#998877';
                    ctx.beginPath();
                    ctx.arc(sx + 8, sy + 8, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#665544';
                    ctx.beginPath();
                    ctx.arc(sx + 13, sy + 13, 3, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    const glow = Math.sin(Date.now() / 100) * 0.2 + 0.8;
                    ctx.fillStyle = 'rgba(255,100,0,' + glow + ')';
                    ctx.beginPath();
                    ctx.arc(sx + 20, sy + 20, 24, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#554433';
                    ctx.beginPath();
                    ctx.arc(sx + 20, sy + 20, 20, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#776655';
                    ctx.beginPath();
                    ctx.arc(sx + 20, sy + 20, 18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#996644';
                    ctx.beginPath();
                    ctx.arc(sx + 14, sy + 14, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#553322';
                    ctx.beginPath();
                    ctx.arc(sx + 26, sy + 24, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function preloadHeroSprites() {
            const heroConfigs = [
                { key: 'frontier', folder: 'Frontier Defender Spartan Knight', attackFolder: 'Slashing' },
                { key: 'spartan', folder: 'Spartan Knight with Spear', attackFolder: 'Attacking' },
                { key: 'greek', folder: 'Greek Warrior', attackFolder: 'Slashing' }
            ];
            const animCounts = { Walking: 24, Attacking: 12, Hurt: 12, Dying: 15 };
            const promises = [];
            for (const cfg of heroConfigs) {
                for (const anim of Object.keys(animCounts)) {
                    const folderName = anim === 'Attacking' ? cfg.attackFolder : anim;
                    for (let i = 0; i < animCounts[anim]; i++) {
                        const img = new Image();
                        const num = String(i).padStart(3, '0');
                        img.src = cfg.folder + '/' + folderName + '/' + folderName + '_' + num + '.png';
                        img.onerror = () => {};
                        promises.push(new Promise(resolve => {
                            img.onload = resolve;
                            img.onerror = resolve;
                        }));
                        heroSprites[cfg.key][anim].push(img);
                    }
                }
            }
            return Promise.all(promises);
        }

        function drawLoading() {
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#0d0d1a';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 24px SimHei';
            ctx.textAlign = 'center';
            ctx.fillText('加载中...', W / 2, H / 2 - 10);
            const loaded = Object.values(heroSprites).reduce((sum, types) =>
                    sum + Object.values(types).reduce((s, arr) => s + arr.filter(i => i.complete).length, 0), 0)
                + bgImages.filter(i => i && i.complete).length
                + Object.values(ogreSprites).reduce((sum, types) =>
                    sum + Object.values(types).reduce((s, arr) => s + arr.filter(i => i.complete).length, 0), 0)
                + Object.values(orcSprites).reduce((sum, types) =>
                    sum + Object.values(types).reduce((s, arr) => s + arr.filter(i => i.complete).length, 0), 0)
                + Object.values(golem2Sprites).reduce((sum, arr) => sum + arr.filter(i => i.complete).length, 0);
            const total = 597;
            ctx.fillStyle = '#fff';
            ctx.font = '14px SimHei';
            ctx.fillText('精灵图: ' + loaded + '/' + total, W / 2, H / 2 + 20);
            ctx.fillStyle = '#333';
            ctx.fillRect(W / 2 - 100, H / 2 + 30, 200, 10);
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(W / 2 - 100, H / 2 + 30, 200 * (loaded / total), 10);
        }

        function startGame() {
            Promise.all([preloadHeroSprites(), preloadBackgrounds(), preloadOgreSprites(), preloadOrcSprites(), preloadGolem2Sprites()]).then(() => {
                heroSpritesLoaded = true;
                bgImagesLoaded = true;
                ogreSpritesLoaded = true;
                orcSpritesLoaded = true;
                golem2SpritesLoaded = true;
                showHeroSelect();
            });
            loadingLoop();
        }

        function loadingLoop() {
            if (heroSpritesLoaded) return;
            drawLoading();
            requestAnimationFrame(loadingLoop);
        }

        function spawnWave(waveNum) {
            const leftSpawn = cameraX - 60;
            const rightSpawn = cameraX + W + 10;
            spawnQueue = [];
            let delayAcc = 0;
            if (waveNum === 1) {
                spawnQueue.push({ enemy: new Enemy(leftSpawn, 'ogre1'), delay: delayAcc });
                spawnQueue.push({ enemy: new Enemy(rightSpawn, 'ogre1'), delay: delayAcc });
                delayAcc += 35;
                spawnQueue.push({ enemy: new Enemy(leftSpawn, 'orc1'), delay: delayAcc });
                spawnQueue.push({ enemy: new Enemy(rightSpawn, 'orc1'), delay: delayAcc });
                delayAcc += 35;
                spawnQueue.push({ enemy: new Enemy(leftSpawn, 'orc2'), delay: delayAcc });
                spawnQueue.push({ enemy: new Enemy(rightSpawn, 'orc2'), delay: delayAcc });
                delayAcc += 35;
                spawnQueue.push({ enemy: new Enemy(leftSpawn, 'orc3'), delay: delayAcc });
                spawnQueue.push({ enemy: new Enemy(rightSpawn, 'orc3'), delay: delayAcc });
                waveEnemiesRemaining = 8;
            } else if (waveNum === 2) {
                spawnQueue.push({ enemy: new Enemy(leftSpawn, 'ogre2'), delay: delayAcc });
                spawnQueue.push({ enemy: new Enemy(rightSpawn, 'ogre2'), delay: delayAcc });
                delayAcc += 40;
                spawnQueue.push({ enemy: new Enemy(leftSpawn, 'ogre3'), delay: delayAcc });
                spawnQueue.push({ enemy: new Enemy(rightSpawn, 'ogre3'), delay: delayAcc });
                waveEnemiesRemaining = 4;
            } else if (waveNum === 3) {
                spawnQueue.push({ enemy: new Enemy(rightSpawn, 'golem2'), delay: delayAcc + 45 });
                waveEnemiesRemaining = 1;
            }
        }

        function startWave(n) {
            waveActive = true;
            waveNotify.className = '';
            if (n === 1) {
                gameState = 'wave1';
                notifyText = '第 1 波敌人来袭!';
                lockLeft = 0;
                lockRight = TRIGGER1;
            } else if (n === 2) {
                gameState = 'wave2';
                notifyText = '第 2 波敌人来袭!';
                lockLeft = 0;
                lockRight = TRIGGER2;
            } else {
                gameState = 'boss';
                notifyText = '⚠ BOSS 战 ⚠';
                lockLeft = TRIGGER1;
                lockRight = WORLD_W;
                waveNotify.className = 'bossWarning';
                const flash = document.getElementById('screenFlash');
                flash.className = 'active';
                setTimeout(() => { flash.className = ''; }, 800);
            }
            waveNotify.textContent = notifyText;
            waveNotify.style.opacity = '1';
            waveNotify.style.color = (n === 3) ? '#ff2222' : '#ff4444';
            waveNotify.style.textShadow = (n === 3) ? '0 0 20px #ff0000, 0 0 40px #ff6600' : '0 0 20px #ff0000, 0 0 40px #ff6600';
            waveNotifyTimer = 90;
            spawnDelay = 60;
            spawnWave(n);
        }

        function endWave() {
            waveActive = false;
            gameState = 'free';
            lockLeft = 0;
            lockRight = WORLD_W;
            waveNotify.style.opacity = '0';
            if (wave3Done) {
                gameState = 'victory';
                showVictory();
            }
        }

        function showVictory() {
            winCount++;
            waveNotify.textContent = '恭喜通关!';
            waveNotify.style.opacity = '1';
            waveNotifyTimer = 120;
            waveNotify.style.color = '#ffd700';
            waveNotify.style.textShadow = '0 0 20px #ffd700, 0 0 40px #ffaa00';
            setTimeout(() => { returnToHeroSelect(); }, 2000);
        }

        function showGameOver() {
            lossCount++;
            waveNotify.textContent = '游戏结束';
            waveNotify.style.opacity = '1';
            waveNotify.style.color = '#ff2222';
            waveNotify.style.textShadow = '0 0 20px #ff0000, 0 0 40px #ff6600';
            waveNotifyTimer = 9999;
            setTimeout(() => { returnToHeroSelect(); }, 2000);
            document.getElementById('restartBtn').style.display = 'block';
        }

        function showHeroSelect() {
            const hs = document.getElementById('heroSelect');
            hs.style.display = 'flex';
            const uiLayer = document.getElementById('uiLayer');
            uiLayer.style.display = 'none';
            const cards = hs.querySelectorAll('.heroCard');
            cards.forEach(card => {
                const hero = card.dataset.hero;
                const previewCanvas = card.querySelector('.heroPreview');
                const pctx = previewCanvas.getContext('2d');
                pctx.clearRect(0, 0, 100, 100);
                const sprites = heroSprites[hero];
                if (sprites && sprites.Walking && sprites.Walking[0] && sprites.Walking[0].complete) {
                    const img = sprites.Walking[0];
                    const sh = 100;
                    const sw = Math.round(sh * img.naturalWidth / img.naturalHeight);
                    pctx.drawImage(img, (100 - sw) / 2, 0, sw, sh);
                }
            });
            cards.forEach(card => {
                card.onclick = () => {
                    cards.forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedHero = card.dataset.hero;
                };
            });
            if (!selectedHero) {
                selectedHero = 'frontier';
                cards[0].classList.add('selected');
            }
        }

        function confirmHero() {
            if (!selectedHero) return;
            startGameLoop(selectedHero);
        }

        function startGameLoop(heroType) {
            if (rafId !== null) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }
            document.getElementById('heroSelect').style.display = 'none';
            document.getElementById('uiLayer').style.display = 'block';
            enemies = [];
            items = [];
            projectiles = [];
            spawnQueue = [];
            waveActive = false;
            wave1Done = false;
            wave2Done = false;
            wave3Done = false;
            gameOverState = false;
            gameState = 'free';
            lockLeft = 0;
            lockRight = WORLD_W;
            waveEnemiesRemaining = 0;
            waveNotifyTimer = 0;
            spawnDelay = 0;
            waveNotify.style.opacity = '0';
            waveNotify.className = '';
            document.getElementById('restartBtn').style.display = 'none';
            player = new Player(heroType);
            cameraX = 0;
            gameLoop();
        }

        function restartGame() {
            if (!selectedHero) return;
            startGameLoop(selectedHero);
        }

        function returnToHeroSelect() {
            if (rafId !== null) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }
            document.getElementById('uiLayer').style.display = 'none';
            document.getElementById('restartBtn').style.display = 'none';
            gameOverState = false;
            document.getElementById('statWins').textContent = winCount;
            document.getElementById('statLosses').textContent = lossCount;
            showHeroSelect();
        }

        let gameOverState = false;
        let selectedHero = null;
        let rafId = null;
        let winCount = 0;
        let lossCount = 0;
        function gameOver() {
            if (gameOverState) return;
            gameOverState = true;
            showGameOver();
        }

        function update() {
            if (gameOverState) return;

            if (spawnDelay > 0) {
                spawnDelay--;
            } else if (spawnQueue.length > 0 && spawnQueue[0].delay > 0) {
                spawnQueue[0].delay--;
            } else if (spawnQueue.length > 0) {
                const spawned = spawnQueue.shift().enemy;
                enemies.push(spawned);
                if (spawned.type === 'golem2') {
                    waveNotifyTimer = 30;
                }
            }

            player.update(enemies);
            for (const e of enemies) e.update(player);

            for (const p of projectiles) p.update();
            for (const p of projectiles) {
                if (!p.active) continue;
                for (const e of enemies) {
                    if (!e.active) continue;
                    if (rectsOverlap(
                        { x: p.x, y: p.y, wide: p.w, h: p.h },
                        { x: e.x, y: e.y, wide: e.w, h: e.h }
                    )) {
                        const killed = e.takeDamage(p.dmg);
                        if (killed) player.onKill(e);
                        p.active = false;
                        break;
                    }
                }
            }

            for (const it of items) it.update();
            items = items.filter(i => i.active);
            enemies = enemies.filter(e => e.active);
            projectiles = projectiles.filter(p => p.active);

            for (const it of items) {
                if (it.active && rectsOverlap(
                    { x: player.x, y: player.y, wide: player.w, h: player.h },
                    { x: it.x, y: it.y, wide: it.w, h: it.h }
                )) { it.apply(player); }
            }

            if (waveActive && waveEnemiesRemaining <= 0 && enemies.length === 0 && spawnQueue.length === 0) {
                endWave();
            }

            if (waveNotifyTimer > 0) {
                waveNotifyTimer--;
                if (waveNotifyTimer <= 30) waveNotify.style.opacity = '0';
                if (waveNotifyTimer <= 0) waveNotifyTimer = 0;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            cameraX = player.x + player.w / 2 - W / 2;
            if (!wave1Done) cameraX = Math.min(cameraX, TRIGGER1 - W);
            else if (!wave2Done) cameraX = Math.min(cameraX, TRIGGER2 - W);
            if (waveActive) {
                cameraX = Math.max(lockLeft, Math.min(cameraX, lockRight - W));
            }
            cameraX = Math.max(0, Math.min(cameraX, WORLD_W - W));
            if (screenShake > 0) {
                cameraX += (Math.random() - 0.5) * screenShake * 2;
                screenShake--;
            }

            const fadeW = 300;
            const alphas = [
                clamp(1 - (cameraX - (TRIGGER1 - fadeW)) / fadeW, 0, 1),
                clamp(Math.min(
                    (cameraX - (TRIGGER1 - fadeW)) / fadeW,
                    1 - (cameraX - (TRIGGER2 - fadeW)) / fadeW
                ), 0, 1),
                clamp((cameraX - (TRIGGER2 - fadeW)) / fadeW, 0, 1)
            ];

            if (bgImagesLoaded && bgImages[0] && bgImages[0].complete) {
                for (let i = 0; i < 3; i++) {
                    if (alphas[i] > 0.01 && bgImages[i] && bgImages[i].complete) {
                        ctx.globalAlpha = alphas[i];
                        ctx.drawImage(bgImages[i], 0, 0, W, H);
                    }
                }
                ctx.globalAlpha = 1;
            } else {
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#0a0a1e');
                grad.addColorStop(0.6, '#1a1a3e');
                grad.addColorStop(1, '#0d1118');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
                for (let i = -((cameraX % 60) | 0); i < W + 60; i += 60) {
                    for (let j = 0; j < H; j += 50) {
                        ctx.fillStyle = '#1a2a18';
                        ctx.fillRect(i, j, 50, 40);
                    }
                }
            }

            for (const p of platforms) {
                const sx = p.x - cameraX, sy = p.y;
                if (sx + p.wide < 0 || sx > W) continue;
                const isGround = p.y >= GROUND_Y;
                if (isGround) {
                    const gGrad = ctx.createLinearGradient(0, sy, 0, sy + p.h);
                    gGrad.addColorStop(0, '#5c4a32');
                    gGrad.addColorStop(0.15, '#4a3828');
                    gGrad.addColorStop(0.3, '#6b553a');
                    gGrad.addColorStop(0.5, '#3e2d1e');
                    gGrad.addColorStop(1, '#2a1a0e');
                    ctx.fillStyle = gGrad;
                    ctx.fillRect(sx, sy, p.wide, p.h);
                    ctx.fillStyle = '#3e8c3e';
                    ctx.fillRect(sx, sy, p.wide, 3);
                    ctx.fillStyle = '#2d6b2d';
                    for (let gx = sx; gx < sx + p.wide; gx += 4) {
                        const gh = 2 + Math.sin(gx * 0.3) * 1.5;
                        ctx.fillRect(gx, sy - gh, 2, gh + 1);
                    }
                    ctx.strokeStyle = '#4a3020';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx + p.wide, sy);
                    ctx.stroke();
                } else {
                    const pGrad = ctx.createLinearGradient(0, sy, 0, sy + p.h);
                    pGrad.addColorStop(0, '#9b8c7c');
                    pGrad.addColorStop(0.2, '#8a7a6a');
                    pGrad.addColorStop(0.5, '#7a6a5a');
                    pGrad.addColorStop(0.8, '#6a5a4a');
                    pGrad.addColorStop(1, '#4a3828');
                    ctx.fillStyle = pGrad;
                    ctx.fillRect(sx, sy, p.wide, p.h);
                    ctx.fillStyle = '#b8a898';
                    ctx.fillRect(sx, sy, p.wide, 3);
                    ctx.strokeStyle = '#5a4a3a';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx + p.wide, sy);
                    ctx.stroke();
                    ctx.strokeStyle = '#3a2a1a';
                    ctx.beginPath();
                    ctx.moveTo(sx, sy + p.h);
                    ctx.lineTo(sx + p.wide, sy + p.h);
                    ctx.stroke();
                    for (let bx = sx + 10; bx < sx + p.wide - 10; bx += 20) {
                        ctx.fillStyle = '#9a8a7a';
                        ctx.fillRect(bx, sy + 2, 8, 2);
                        ctx.fillStyle = '#6a5a4a';
                        ctx.fillRect(bx + 2, sy + p.h - 4, 4, 2);
                    }
                }
            }

            const tx1 = TRIGGER1 - cameraX, tx2 = TRIGGER2 - cameraX, tx3 = TRIGGER3 - cameraX;
            for (const tx of [tx1, tx2, tx3]) {
                if (tx > 0 && tx < W) {
                    ctx.strokeStyle = 'rgba(255,200,100,0.4)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 4]);
                    ctx.beginPath(); ctx.moveTo(tx, 0); ctx.lineTo(tx, H); ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = 'rgba(255,200,100,0.7)';
                    ctx.font = '12px SimHei';
                    ctx.textAlign = 'center';
                }
            }
            if (tx1 > -10 && tx1 < W + 10 && !wave1Done) {
                ctx.fillText('触发点1', tx1, 30);
            }
            if (tx2 > -10 && tx2 < W + 10 && !wave2Done) {
                ctx.fillText('触发点2', tx2, 30);
            }
            if (tx3 > -10 && tx3 < W + 10 && !wave3Done) {
                ctx.fillText('触发点3', tx3, 30);
            }

            for (const e of enemies) e.draw();
            for (const p of projectiles) p.draw();
            for (const it of items) it.draw();
            player.draw();

            if (player.parryTimer > 0) {
                const px = player.x + player.w / 2 - cameraX;
                const py = player.y + player.h / 2;
                const alpha = Math.min(player.parryTimer / 30, 1);
                const pulse = Math.sin(Date.now() / 100) * 0.15 + 0.85;

                const glowGrad = ctx.createRadialGradient(px, py, 30, px, py, 65);
                glowGrad.addColorStop(0, 'rgba(255,220,60,' + (alpha * 0.35 * pulse) + ')');
                glowGrad.addColorStop(0.5, 'rgba(255,180,20,' + (alpha * 0.2 * pulse) + ')');
                glowGrad.addColorStop(1, 'rgba(255,150,0,0)');
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(px, py, 65, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,240,80,' + (alpha * 0.9 * pulse) + ')';
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.arc(px, py, 52, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255,255,180,' + (alpha * 0.6 * pulse) + ')';
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 4]);
                ctx.beginPath();
                ctx.arc(px, py, 45, Date.now() / 400, Date.now() / 400 + Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.strokeStyle = 'rgba(255,200,40,' + (alpha * 0.7) + ')';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(px, py, 58, 0, Math.PI * 2);
                ctx.stroke();

                for (let i = 0; i < 6; i++) {
                    const ang = (i / 6) * Math.PI * 2 + Date.now() / 600;
                    const sparkX = px + Math.cos(ang) * 50;
                    const sparkY = py + Math.sin(ang) * 50;
                    const sparkAlpha = alpha * (0.5 + Math.sin(Date.now() / 120 + i) * 0.5);
                    ctx.fillStyle = 'rgba(255,255,200,' + sparkAlpha + ')';
                    ctx.beginPath();
                    ctx.arc(sparkX, sparkY, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            if (player.parryEffect > 0) {
                const px = player.x + player.w / 2 - cameraX;
                const py = player.y + player.h / 2;
                const n = 12;
                const alpha = Math.min(player.parryEffect / 15, 1);
                const r = 60 + (20 - player.parryEffect) * 10;

                const burstGrad = ctx.createRadialGradient(px, py, 15, px, py, r);
                burstGrad.addColorStop(0, 'rgba(255,255,220,' + (alpha * 0.4) + ')');
                burstGrad.addColorStop(1, 'rgba(255,150,20,0)');
                ctx.fillStyle = burstGrad;
                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.fill();

                ctx.save();
                ctx.strokeStyle = 'rgba(255,220,60,' + alpha + ')';
                ctx.lineWidth = 3;
                for (let i = 0; i < n; i++) {
                    const ang = (i / n) * Math.PI * 2 + Math.sin(Date.now() / 60) * 0.6;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(px + Math.cos(ang) * r, py + Math.sin(ang) * r);
                    ctx.stroke();
                }

                const innerN = 8;
                const innerR = 35 + (20 - player.parryEffect) * 5;
                ctx.strokeStyle = 'rgba(255,255,255,' + (alpha * 0.7) + ')';
                ctx.lineWidth = 1.5;
                for (let i = 0; i < innerN; i++) {
                    const ang = (i / innerN) * Math.PI * 2 - Math.sin(Date.now() / 60) * 0.4;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(px + Math.cos(ang) * innerR, py + Math.sin(ang) * innerR);
                    ctx.stroke();
                }
                ctx.restore();
            }

            if (player.invincibleTimer > 0 && player.parryTimer <= 0) {
                const px = player.x + player.w / 2 - cameraX;
                const py = player.y + player.h / 2;
                const invAlpha = Math.min(player.invincibleTimer / 20, 0.5);
                const glowGrad = ctx.createRadialGradient(px, py, 20, px, py, 45);
                glowGrad.addColorStop(0, 'rgba(255,220,100,' + (invAlpha * 0.3) + ')');
                glowGrad.addColorStop(1, 'rgba(255,180,40,0)');
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(px, py, 45, 0, Math.PI * 2);
                ctx.fill();
            }

            if (player.lockedEnemy && player.lockedEnemy.active) {
                const le = player.lockedEnemy;
                const lsx = le.x - cameraX;
                ctx.strokeStyle = '#ff4444';
                ctx.lineWidth = 2;
                ctx.setLineDash([3, 3]);
                ctx.strokeRect(lsx - 4, le.y - 4, le.w + 8, le.h + 8);
                ctx.setLineDash([]);
                const cx2 = le.x + le.w / 2 - cameraX, cy2 = le.y - 14;
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.moveTo(cx2, cy2);
                ctx.lineTo(cx2 - 6, cy2 - 8);
                ctx.lineTo(cx2 + 6, cy2 - 8);
                ctx.closePath();
                ctx.fill();
            }
        }

        function drawUI() {
            const barW = 180, barH = 16, barX = 10;

            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(barX - 3, 7, barW + 6, barH + 4);
            ctx.fillStyle = '#553333';
            ctx.fillRect(barX, 10, barW, barH);
            ctx.fillStyle = '#ff3333';
            ctx.fillRect(barX, 10, barW * (player.hp / player.maxHp), barH);
            ctx.strokeStyle = '#ff6666';
            ctx.lineWidth = 1;
            ctx.strokeRect(barX, 10, barW, barH);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 11px SimHei';
            ctx.textAlign = 'left';
            ctx.fillText('HP ' + player.hp + '/' + player.maxHp, barX + 4, barH + 8);

            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(barX - 3, 30, barW + 6, barH + 4);
            ctx.fillStyle = '#334466';
            ctx.fillRect(barX, 33, barW, barH);
            ctx.fillStyle = '#4488ff';
            ctx.fillRect(barX, 33, barW * (player.mp / player.maxMp), barH);
            ctx.strokeStyle = '#6688ff';
            ctx.strokeRect(barX, 33, barW, barH);
            ctx.fillStyle = '#fff';
            ctx.fillText('MP ' + player.mp + '/' + player.maxMp, barX + 4, 33 + barH - 2);

            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(barX - 3, 53, barW + 6, barH + 4);
            ctx.fillStyle = '#553333';
            ctx.fillRect(barX, 56, barW, barH);
            const rageGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
            rageGrad.addColorStop(0, '#ff4400');
            rageGrad.addColorStop(0.5, '#ff8800');
            rageGrad.addColorStop(1, '#ffcc00');
            ctx.fillStyle = rageGrad;
            ctx.fillRect(barX, 56, barW * (player.rage / player.maxRage), barH);
            ctx.strokeStyle = '#ff8844';
            ctx.strokeRect(barX, 56, barW, barH);
            ctx.fillStyle = '#fff';
            ctx.fillText('RAGE ' + player.rage + '/' + player.maxRage, barX + 4, 56 + barH - 2);

            if (gameState === 'boss') {
                const boss = enemies.find(e => e.active && e.type === 'golem2');
                if (boss) {
                    const bossBarW = 580, bossBarH = 22, bossBarX = (W - bossBarW) / 2, bossBarY = H - 40;
                    ctx.fillStyle = 'rgba(0,0,0,0.75)';
                    ctx.fillRect(bossBarX - 2, bossBarY - 2, bossBarW + 4, bossBarH + 4);
                    const bossBgGrad = ctx.createLinearGradient(0, bossBarY, 0, bossBarY + bossBarH);
                    bossBgGrad.addColorStop(0, '#2a1111');
                    bossBgGrad.addColorStop(1, '#1a0808');
                    ctx.fillStyle = bossBgGrad;
                    ctx.fillRect(bossBarX, bossBarY, bossBarW, bossBarH);
                    const hpRatio = boss.hp / boss.maxHp;
                    const bossHpGrad = ctx.createLinearGradient(bossBarX, 0, bossBarX + bossBarW, 0);
                    if (hpRatio > 0.5) {
                        bossHpGrad.addColorStop(0, '#cc2222');
                        bossHpGrad.addColorStop(1, '#ff4444');
                    } else if (hpRatio > 0.25) {
                        bossHpGrad.addColorStop(0, '#cc6600');
                        bossHpGrad.addColorStop(1, '#ff8800');
                    } else {
                        bossHpGrad.addColorStop(0, '#880000');
                        bossHpGrad.addColorStop(1, '#cc1111');
                    }
                    ctx.fillStyle = bossHpGrad;
                    ctx.fillRect(bossBarX, bossBarY, bossBarW * hpRatio, bossBarH);
                    ctx.strokeStyle = '#ff6644';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(bossBarX, bossBarY, bossBarW, bossBarH);
                    ctx.fillStyle = '#ffd700';
                    ctx.font = 'bold 14px SimHei';
                    ctx.textAlign = 'center';
                    ctx.fillText('BOSS  Golem', bossBarX + bossBarW / 2, bossBarY - 6);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 12px SimHei';
                    ctx.fillText(boss.hp + '/' + boss.maxHp, bossBarX + bossBarW / 2, bossBarY + bossBarH - 4);
                }
            }

            skillIconJ.className = 'skillIcon';
            skillIconU.className = 'skillIcon' + (player.skillCooldown > 0 ? ' onCd' : '');
            skillIconI.className = 'skillIcon' + (player.rage < player.maxRage ? ' onCd' : '');
            const skillIconF = document.getElementById('skillIconF');
            skillIconF.className = 'skillIcon' + (player.parryCooldown > 0 ? ' onCd' : '');

            const uOverlay = skillIconU.querySelector('.skillCdOverlay');
            if (player.skillCooldown > 0) {
                if (!uOverlay) {
                    const d = document.createElement('div');
                    d.className = 'skillCdOverlay';
                    skillIconU.appendChild(d);
                }
                const ol = skillIconU.querySelector('.skillCdOverlay');
                if (ol) ol.style.height = ((player.skillCooldown / player.skillCdMax) * 100) + '%';
            } else if (uOverlay) {
                uOverlay.remove();
            }
        }

        function gameLoop() {
            update();
            draw();
            drawUI();
            rafId = requestAnimationFrame(gameLoop);
        }

        document.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'KeyR' && gameOverState) {
                returnToHeroSelect();
            }
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
        });
        document.addEventListener('keyup', e => { keys[e.code] = false; });

        startGame();
    </script>
</body>
</html>
