<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通勤智学·聚合学习管理网站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      --primary-600: #1e3a5f;
      --primary-500: #3b82f6;
      --success-500: #22c55e;
      --accent-500: #f97316;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-400: #94a3b8;
      --gray-500: #64748b;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;
    }
    body { min-height: 100vh; background-color: var(--gray-50); }
    
    .btn-primary {
      background: linear-gradient(to right, var(--primary-600), var(--primary-500));
      color: white;
      font-weight: 500;
      padding: 0.625rem 1.25rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1);
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary:hover {
      background: linear-gradient(to right, #1e40af, var(--primary-600));
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / .1);
      transform: scale(1.02);
    }
    .btn-primary:disabled {
      background: #d1d5db;
      cursor: not-allowed;
      transform: none;
    }
    
    .card {
      background: white;
      border-radius: 1rem;
      border: 1px solid var(--gray-100);
      padding: 1.25rem;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / .05);
      transition: all 0.3s;
    }
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1);
    }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-fade-in { animation: fadeIn 0.5s ease-out; }
    .animate-slide-up { animation: slideUp 0.5s ease-out; }
    
    .icon { display: inline-flex; align-items: center; justify-content: center; }
    .page { display: none; }
    .page.active { display: block; }
    .nav-item.active { color: var(--primary-600) !important; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    
    @media (min-width: 768px) {
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
      .grid-4 { grid-template-columns: repeat(4, 1fr); }
      .md-flex { display: flex; }
      .md-hidden { display: none; }
      .md-only { display: none; }
    }
    @media (max-width: 767px) {
      .md-only { display: none; }
    }
    
    .tab-btn {
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active { background: var(--primary-600); color: white; }
    .tab-btn:not(.active) { background: #f1f5f9; color: #64748b; }
    
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      padding: 1rem; z-index: 100;
    }
    .modal-content {
      background: white; border-radius: 1rem; width: 100%;
      max-width: 28rem; padding: 1.5rem;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // 图标SVG
    const icons = {

      list: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',

      trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
      target: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
      award: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>',
      x: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
      menu: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>',
    };

    // 数据
    const categories = [
      { id: '1', name: '网课', color: '#3b82f6' },
      { id: '2', name: '题库', color: '#ef4444' },
      { id: '3', name: '资讯', color: '#f97316' },

    const resources = [
      { id: '1', title: 'Python基础教程', url: '#', category: '网课', description: '从零开始学习Python编程', source: '慕课网', thumbnail: 'https://images.unsplash.com/photo-1526379095098-d400fd0bf935?w=400&h=250&fit=crop' },
      { id: '2', title: '英语四级真题', url: '#', category: '题库', description: '历年四级真题及详细解析', source: '新东方', thumbnail: 'https://images.unsplash.com/photo-1543286386-713bdd548da4?w=400&h=250&fit=crop' },
      { id: '3', title: '前端开发资讯', url: '#', category: '资讯', description: '最新前端技术动态', source: '掘金', thumbnail: 'https://images.unsplash.com/photo-1461749280684-dccba630e2f6?w=400&h=250&fit=crop' },
      { id: '4', title: '数据分析实战', url: '#', category: '技能学习', description: 'Python数据分析实战课程', source: 'DataCamp', thumbnail: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=400&h=250&fit=crop' },
      { id: '5', title: '公务员考试', url: '#', category: '备考', description: '公务员考试备考资料', source: '中公教育', thumbnail: 'https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=400&h=250&fit=crop' },
      { id: '6', title: '机器学习入门', url: '#', category: '网课', description: '机器学习基础算法入门', source: 'Coursera', thumbnail: 'https://images.unsplash.com/photo-1555949963-aa79dcee981c?w=400&h=250&fit=crop' },
      { id: '7', title: '考研英语', url: '#', category: '备考', description: '考研英语复习资料', source: '考研帮', thumbnail: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400&h=250&fit=crop' },
      { id: '8', title: 'UI设计教程', url: '#', category: '技能学习', description: 'UI设计从入门到精通', source: '站酷', thumbnail: 'https://images.unsplash.com/photo-1561070791-2526d30994b5?w=400&h=250&fit=crop' },
      { id: '9', title: '职场沟通技巧', url: '#', category: '技能学习', description: '提升职场沟通能力', source: 'LinkedIn', thumbnail: 'https://images.unsplash.com/photo-1552664730-d307ca884978?w=400&h=250&fit=crop' },

    ];

    const plans = [
      { id: '1', title: 'Python学习计划', description: '每天学习30分钟Python', target_duration: 30, start_date: '2024-06-01', end_date: '2024-06-30', status: 'active' },
      { id: '2', title: '英语四级备考', description: '备战6月四级考试', target_duration: 45, start_date: '2024-04-01', end_date: '2024-06-15', status: 'active' },
      { id: '3', title: '数据分析入门', description: '完成数据分析实战课程', target_duration: 60, start_date: '2024-05-01', end_date: '2024-05-31', status: 'completed' },
    ];

    // 状态管理
    let state = {
      currentPage: 'home',
      searchQuery: '',
      favorites: [],
      selectedCategory: '',
      showFavorites: false,
      viewMode: 'grid',
      activeTab: 'week',
      planTab: 'all',
      showModal: false,
      menuOpen: false,
      newPlan: { title: '', description: '', target_duration: 30, end_date: '' },
    };

    function toggleFavorite(id) {
      const idx = state.favorites.indexOf(id);
      if (idx >= 0) {
        state.favorites.splice(idx, 1);
      } else {
        state.favorites.push(id);
      }
      render();
    }

    function navigate(page) {
      state.currentPage = page;
      state.menuOpen = false;
      render();
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return `${d.getMonth()+1}/${d.getDate()}`;
    }

    function getFilteredResources() {
      return resources.filter(r => {
        const matchCat = !state.selectedCategory || r.category === state.selectedCategory;
        const matchSearch = !state.searchQuery || r.title.toLowerCase().includes(state.searchQuery.toLowerCase());
        const matchFav = !state.showFavorites || state.favorites.includes(r.id);
        return matchCat && matchSearch && matchFav;
      });
    }

    function getFilteredPlans() {
      return plans.filter(p => state.planTab === 'all' || p.status === state.planTab);
    }

    // 渲染函数
    function renderHeader() {
      const navItems = [
        { name: '首页', key: 'home' },
        { name: '资源库', key: 'resources' },
        { name: '学习进度', key: 'progress' },
        { name: '学习计划', key: 'plans' },

      return `

                </div>
                <span style="font-size:1.25rem;font-weight:bold;color:#1e3a5f;">通勤智学</span>
              </div>

              <nav class="md-flex" style="display:none;align-items:center;gap:2rem;">
                ${navItems.map(item => `
                  <button onclick="navigate('${item.key}')" style="color:${state.currentPage === item.key ? '#1e3a5f' : '#64748b'};font-weight:500;background:none;border:none;cursor:pointer;transition:color 0.2s;">
                    ${item.name}

                  <input type="text" placeholder="搜索学习资源..." value="${state.searchQuery}" oninput="state.searchQuery=this.value;render();" style="width:16rem;padding:0.5rem 1rem 0.5rem 2.5rem;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:0.75rem;outline:none;"/>
                </div>
              </div>

              <button onclick="state.menuOpen=!state.menuOpen;render();" class="md-only" style="padding:0.5rem;color:#64748b;background:none;border:none;cursor:pointer;">
                ${state.menuOpen ? icons.x : icons.menu}
              </button>
            </div>

            ${state.menuOpen ? `
              <div class="md-only" style="padding:1rem;border-top:1px solid #f1f5f9;">
                <div style="position:relative;margin-bottom:1rem;">
                  <span style="position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);color:#94a3b8;">${icons.search}</span>
                  <input type="text" placeholder="搜索学习资源..." value="${state.searchQuery}" oninput="state.searchQuery=this.value;render();" style="width:100%;padding:0.5rem 1rem 0.5rem 2.5rem;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:0.75rem;outline:none;"/>
                </div>
                <nav style="display:flex;flex-direction:column;gap:0.5rem;">
                  ${navItems.map(item => `
                    <button onclick="navigate('${item.key}')" style="padding:0.75rem 1rem;color:${state.currentPage === item.key ? '#1e3a5f' : '#64748b'};font-weight:500;background:${state.currentPage === item.key ? '#eff6ff' : 'none'};border-radius:0.75rem;border:none;cursor:pointer;text-align:left;">
                      ${item.name}
                    </button>
                  `).join('')}
                </nav>
              </div>
            ` : ''}
          </div>
        </header>
      `;
    }

    function renderBottomNav() {
      const navItems = [
        { name: '首页', key: 'home', icon: 'home' },
        { name: '资源库', key: 'resources', icon: 'library' },
        { name: '学习进度', key: 'progress', icon: 'chart' },
        { name: '学习计划', key: 'plans', icon: 'calendar' },

      return `
        <nav class="md-only" style="display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #f1f5f9;box-shadow:0 -1px 2px 0 rgb(0 0 0 / .05);z-index:50;">
          <div style="display:flex;align-items:center;justify-content:space-around;height:4rem;width:100%;">
            ${navItems.map(item => `
              <button onclick="navigate('${item.key}')" style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;color:${state.currentPage === item.key ? '#1e3a5f' : '#94a3b8'};background:none;border:none;cursor:pointer;">
                <span style="color:${state.currentPage === item.key ? '#1e3a5f' : '#94a3b8'}">${icons[item.icon]}</span>

            `).join('')}
          </div>
        </nav>
      `;
    }

    function renderHome() {
      const stats = { today: 55, weekly: 260, streak: 15, total: 10 };
      const filtered = getFilteredResources();
      
      return `
        <div style="min-height:100vh;padding-bottom:5rem;">
          <section style="background:linear-gradient(to bottom right,#1e3a5f,#3b82f6,#22c55e);padding:3rem 1rem;position:relative;overflow:hidden;">
            <div style="position:absolute;inset:0;background-image:radial-gradient(circle at 2px 2px,rgba(255,255,255,0.1) 1px,transparent 0);background-size:40px 40px;opacity:0.5;"></div>
            <div style="position:relative;max-width:1280px;margin:0 auto;text-align:center;color:white;">
              <h1 style="font-size:2rem;font-weight:bold;margin-bottom:1rem;">通勤智学 · 聚合学习管理</h1>
              <p style="font-size:1rem;opacity:0.9;margin-bottom:2rem;">碎片化时间高效利用，一站式学习资源聚合</p>
              <div style="display:flex;flex-direction:column;gap:1rem;justify-content:center;align-items:center;">
                <button class="btn-primary" onclick="navigate('resources')">${icons.play} 立即开始学习</button>
                <button onclick="navigate('resources')" style="background:rgba(255,255,255,0.2);backdrop-filter:blur(4px);color:white;font-weight:500;padding:0.625rem 1.25rem;border-radius:0.75rem;border:1px solid rgba(255,255,255,0.3);cursor:pointer;">浏览资源</button>
              </div>

                  <div>
                    <label style="display:block;font-size:0.875rem;font-weight:500;color:#334155;margin-bottom:0.5rem;">每日目标时长（分钟）</label>
                    <select id="planDuration" style="width:100%;padding:0.75rem 1rem;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:0.75rem;outline:none;">
                      <option value="15">15分钟</option>
                      <option value="30" selected>30分钟</option>
                      <option value="45">45分钟</option>
                      <option value="60">60分钟</option>
                    </select>
                  </div>
                  <div style="display:flex;gap:0.75rem;margin-top:1.5rem;">
                    <button onclick="state.showModal=false;render();" style="flex:1;padding:0.75rem;background:#f1f5f9;color:#64748b;border-radius:0.75rem;border:none;cursor:pointer;font-weight:500;">取消</button>
                    <button onclick="createPlan()" class="btn-primary" style="flex:1;">创建计划</button>
                  </div>
                </div>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function createPlan() {
      const title = document.getElementById('planTitle').value;
      const desc = document.getElementById('planDesc').value;
      const duration = document.getElementById('planDuration').value;
      
      if (!title) return;
      
      plans.push({
        id: Date.now().toString(),
        title: title,
        description: desc,
        target_duration: parseInt(duration),
        start_date: new Date().toISOString().split('T')[0],
        end_date: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
        status: 'active'
      });
      
      state.showModal = false;
      render();
    }

    function render() {
      const app = document.getElementById('app');
      let pageContent = '';
      
      switch(state.currentPage) {
        case 'home': pageContent = renderHome(); break;
        case 'resources': pageContent = renderResources(); break;
        case 'progress': pageContent = renderProgress(); break;
        case 'plans': pageContent = renderPlans(); break;
        default: pageContent = renderHome();
      }
      
      app.innerHTML = renderHeader() + pageContent + renderBottomNav();
    }

    // 初始渲染
    render();
  </script>
</body>
</html>
