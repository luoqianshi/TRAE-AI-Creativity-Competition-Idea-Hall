<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能桌面能源管控站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;
  --card:#111827;
  --border:#1e293b;
  --primary:#3b82f6;
  --success:#10b981;
  --warning:#f59e0b;
  --danger:#ef4444;
  --text:#e2e8f0;
  --text-dim:#94a3b8;
  --accent:#6366f1;
}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
.header{
  background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 100%);
  border-bottom:1px solid var(--border);
  padding:16px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.header h1{
  font-size:20px;
  font-weight:700;
  background:linear-gradient(90deg,#60a5fa,#a78bfa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.header .status{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  color:var(--text-dim);
}
.header .status .dot{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--success);
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.4}
}
.nav{
  display:flex;
  gap:4px;
  background:#0f172a;
  padding:8px 24px;
  border-bottom:1px solid var(--border);
}
.nav button{
  background:none;
  border:none;
  color:var(--text-dim);
  padding:8px 16px;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
  transition:all .2s;
}
.nav button:hover{background:#1e293b;color:var(--text)}
.nav button.active{background:var(--primary);color:#fff}
.main{padding:20px 24px;max-width:1400px;margin:0 auto}
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
  transition:border-color .2s;
}
.card:hover{border-color:#334155}
.card-title{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.5px;
  color:var(--text-dim);
  margin-bottom:8px;
}
.card-value{
  font-size:28px;
  font-weight:700;
  line-height:1.2;
}
.card-sub{
  font-size:12px;
  color:var(--text-dim);
  margin-top:4px;
}
.trend-up{color:var(--danger)}
.trend-down{color:var(--success)}
.section{display:none}
.section.active{display:block}
.device-list{display:flex;flex-direction:column;gap:10px}
.device-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  background:#0f172a;
  border-radius:8px;
  border:1px solid var(--border);
}
.device-info{display:flex;align-items:center;gap:12px}
.device-icon{
  width:36px;height:36px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.device-name{font-size:14px;font-weight:500}
.device-status{font-size:12px;color:var(--text-dim)}
.device-power{font-size:16px;font-weight:600;text-align:right}
.device-power span{font-size:12px;color:var(--text-dim);font-weight:400}
.toggle{
  width:40px;height:22px;
  border-radius:11px;
  background:#374151;
  position:relative;
  cursor:pointer;
  transition:background .2s;
}
.toggle.on{background:var(--primary)}
.toggle::after{
  content:'';
  width:18px;height:18px;
  border-radius:50%;
  background:#fff;
  position:absolute;
  top:2px;left:2px;
  transition:transform .2s;
}
.toggle.on::after{transform:translateX(18px)}
.chart-container{
  width:100%;
  height:240px;
  position:relative;
  margin-top:12px;
}
canvas{width:100%!important;height:100%!important}
.ai-suggestions{display:flex;flex-direction:column;gap:10px}
.ai-item{
  padding:14px 16px;
  background:linear-gradient(135deg,#0f172a,#1a1a3e);
  border-radius:8px;
  border:1px solid #2e2b5f;
  display:flex;
  gap:12px;
  align-items:flex-start;
}
.ai-icon{
  width:32px;height:32px;
  border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--primary));
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
  flex-shrink:0;
}
.ai-text{font-size:13px;line-height:1.6}
.ai-text strong{color:#a78bfa}
.ai-save{
  font-size:12px;
  color:var(--success);
  margin-top:4px;
}
.schedule-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  background:#0f172a;
  border-radius:8px;
  border:1px solid var(--border);
  margin-bottom:10px;
}
.schedule-time{
  font-size:20px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.schedule-days{
  display:flex;gap:4px;margin-top:4px;
}
.schedule-days span{
  width:22px;height:22px;
  border-radius:50%;
  background:#1e293b;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;
  color:var(--text-dim);
}
.schedule-days span.active{background:var(--primary);color:#fff}
.schedule-action{font-size:13px;color:var(--text-dim);text-align:right}
.progress-bar{
  width:100%;height:6px;
  background:#1e293b;
  border-radius:3px;
  overflow:hidden;
  margin-top:8px;
}
.progress-fill{
  height:100%;
  border-radius:3px;
  transition:width .6s ease;
}
.carbon-stat{
  display:flex;
  align-items:center;
  gap:16px;
  padding:16px;
  background:#0f172a;
  border-radius:8px;
  margin-bottom:10px;
}
.carbon-icon{
  width:48px;height:48px;
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
}
.carbon-value{font-size:22px;font-weight:700}
.carbon-label{font-size:12px;color:var(--text-dim)}
.btn{
  padding:8px 16px;
  border-radius:6px;
  border:none;
  cursor:pointer;
  font-size:13px;
  font-weight:500;
  transition:all .2s;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center;
  z-index:100;
}
.modal-overlay.show{display:flex}
.modal{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:24px;
  width:400px;
  max-width:90vw;
}
.modal h3{margin-bottom:16px;font-size:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px}
.form-group input,.form-group select{
  width:100%;
  padding:8px 12px;
  background:#0f172a;
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  font-size:13px;
}
.form-group input:focus,.form-group select:focus{
  outline:none;border-color:var(--primary);
}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.badge{
  display:inline-block;
  padding:2px 8px;
  border-radius:4px;
  font-size:11px;
  font-weight:500;
}
.badge-success{background:rgba(16,185,129,.15);color:var(--success)}
.badge-warning{background:rgba(245,158,11,.15);color:var(--warning)}
.badge-danger{background:rgba(239,68,68,.15);color:var(--danger)}
@media(max-width:1024px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr}
  .header{flex-direction:column;gap:8px;align-items:flex-start}
  .nav{overflow-x:auto}
}
</style>
</head>
<body>

<div class="header">
  <h1>⚡ 智能桌面能源管控站</h1>
  <div class="status">
    <div class="dot"></div>
    <span>实时监控中</span>
    <span id="currentTime" style="margin-left:12px;font-variant-numeric:tabular-nums"></span>
  </div>
</div>

<div class="nav">
  <button class="active" data-section="overview">总览</button>
  <button data-section="devices">设备管理</button>
  <button data-section="history">能耗图表</button>
  <button data-section="ai">AI 节能</button>
  <button data-section="schedule">定时策略</button>
  <button data-section="carbon">碳排放</button>
</div>

<div class="main">

  <div class="section active" id="sec-overview">
    <div class="grid grid-4" style="margin-bottom:16px">
      <div class="card">
        <div class="card-title">当前总功耗</div>
        <div class="card-value" id="totalPower">0 W</div>
        <div class="card-sub"><span class="trend-down">↓ 12%</span> 较昨日</div>
      </div>
      <div class="card">
        <div class="card-title">今日用电</div>
        <div class="card-value" id="todayEnergy">0 kWh</div>
        <div class="card-sub">预估 ¥<span id="todayCost">0.00</span></div>
      </div>
      <div class="card">
        <div class="card-title">本月用电</div>
        <div class="card-value" id="monthEnergy">0 kWh</div>
        <div class="card-sub">预算使用 <span id="budgetPct">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="budgetBar" style="width:0%;background:var(--primary)"></div></div>
      </div>
      <div class="card">
        <div class="card-title">今日减碳</div>
        <div class="card-value" style="color:var(--success)" id="carbonSaved">0 kg</div>
        <div class="card-sub">≈ 种植 <span id="treeEquiv">0</span> 棵树</div>
      </div>
    </div>
    <div class="grid grid-2">
      <div class="card">
        <div class="card-title">24小时功耗趋势</div>
        <div class="chart-container"><canvas id="overviewChart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">设备功耗占比</div>
        <div class="chart-container"><canvas id="pieChart"></canvas></div>
      </div>
    </div>
  </div>

  <div class="section" id="sec-devices">
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div class="card-title" style="margin:0">设备列表</div>
        <button class="btn btn-primary" onclick="openAddDevice()">+ 添加设备</button>
      </div>
      <div class="device-list" id="deviceList"></div>
    </div>
  </div>

  <div class="section" id="sec-history">
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div class="card-title" style="margin:0">历史能耗</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-outline history-range active" data-range="day">日</button>
          <button class="btn btn-outline history-range" data-range="week">周</button>
          <button class="btn btn-outline history-range" data-range="month">月</button>
        </div>
      </div>
      <div class="chart-container" style="height:300px"><canvas id="historyChart"></canvas></div>
    </div>
    <div class="grid grid-3">
      <div class="card">
        <div class="card-title">日均能耗</div>
        <div class="card-value" id="avgDaily">0 kWh</div>
      </div>
      <div class="card">
        <div class="card-title">峰值功率</div>
        <div class="card-value" id="peakPower">0 W</div>
      </div>
      <div class="card">
        <div class="card-title">能耗最低日</div>
        <div class="card-value" id="lowestDay">--</div>
      </div>
    </div>
  </div>

  <div class="section" id="sec-ai">
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
        <span style="font-size:20px">🤖</span>
        <div class="card-title" style="margin:0">AI 节能优化建议</div>
      </div>
      <div class="ai-suggestions" id="aiSuggestions"></div>
    </div>
    <div class="grid grid-2">
      <div class="card">
        <div class="card-title">节能评分</div>
        <div style="display:flex;align-items:center;gap:20px;margin-top:12px">
          <div style="position:relative;width:100px;height:100px">
            <canvas id="scoreChart" width="100" height="100"></canvas>
          </div>
          <div>
            <div class="card-value" id="aiScore">85</div>
            <div class="card-sub">良好</div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">预计月度节省</div>
        <div class="card-value" style="color:var(--success)" id="monthlySave">¥0</div>
        <div class="card-sub" style="margin-top:8px">执行全部建议后预计可节省</div>
      </div>
    </div>
  </div>

  <div class="section" id="sec-schedule">
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div class="card-title" style="margin:0">定时策略</div>
        <button class="btn btn-primary" onclick="openAddSchedule()">+ 新建策略</button>
      </div>
      <div id="scheduleList"></div>
    </div>
  </div>

  <div class="section" id="sec-carbon">
    <div class="grid grid-3" style="margin-bottom:16px">
      <div class="carbon-stat">
        <div class="carbon-icon" style="background:rgba(16,185,129,.15)">🌱</div>
        <div>
          <div class="carbon-label">本月碳排放</div>
          <div class="carbon-value" id="monthCarbon">0 kg</div>
        </div>
      </div>
      <div class="carbon-stat">
        <div class="carbon-icon" style="background:rgba(59,130,246,.15)">🌍</div>
        <div>
          <div class="carbon-label">同比减少</div>
          <div class="carbon-value" style="color:var(--success)" id="carbonReduction">0%</div>
        </div>
      </div>
      <div class="carbon-stat">
        <div class="carbon-icon" style="background:rgba(139,92,246,.15)">🌳</div>
        <div>
          <div class="carbon-label">等效植树</div>
          <div class="carbon-value" id="treeCount">0 棵</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">碳排放趋势（近7天）</div>
      <div class="chart-container"><canvas id="carbonChart"></canvas></div>
    </div>
  </div>

</div>

<div class="modal-overlay" id="addDeviceModal">
  <div class="modal">
    <h3>添加设备</h3>
    <div class="form-group">
      <label>设备名称</label>
      <input type="text" id="deviceNameInput" placeholder="如：台式电脑">
    </div>
    <div class="form-group">
      <label>额定功率 (W)</label>
      <input type="number" id="devicePowerInput" placeholder="如：200">
    </div>
    <div class="form-group">
      <label>设备类型</label>
      <select id="deviceTypeInput">
        <option value="💻">电脑</option>
        <option value="🖥️">显示器</option>
        <option value="🔌">充电器</option>
        <option value="💡">灯具</option>
        <option value="🖨️">打印机</option>
        <option value="🔊">音响</option>
        <option value="📱">手机/平板</option>
        <option value="🎮">游戏主机</option>
        <option value="❄️">空调/风扇</option>
        <option value="📦">其他</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('addDeviceModal')">取消</button>
      <button class="btn btn-primary" onclick="addDevice()">添加</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addScheduleModal">
  <div class="modal">
    <h3>新建定时策略</h3>
    <div class="form-group">
      <label>选择设备</label>
      <select id="scheduleDeviceInput"></select>
    </div>
    <div class="form-group">
      <label>执行时间</label>
      <input type="time" id="scheduleTimeInput">
    </div>
    <div class="form-group">
      <label>执行动作</label>
      <select id="scheduleActionInput">
        <option value="off">关闭设备</option>
        <option value="on">开启设备</option>
      </select>
    </div>
    <div class="form-group">
      <label>重复</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap" id="scheduleDaysInput">
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer">
          <input type="checkbox" value="1"> 一
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer">
          <input type="checkbox" value="2"> 二
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer">
          <input type="checkbox" value="3"> 三
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer">
          <input type="checkbox" value="4"> 四
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer">
          <input type="checkbox" value="5"> 五
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer">
          <input type="checkbox" value="6"> 六
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer">
          <input type="checkbox" value="0"> 日
        </label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('addScheduleModal')">取消</button>
      <button class="btn btn-primary" onclick="addSchedule()">保存</button>
    </div>
  </div>
</div>

<script>
const ELECTRICITY_PRICE = 0.56;
const CARBON_FACTOR = 0.5839;

let devices = [
  {id:1,name:'台式电脑',icon:'💻',power:250,on:true},
  {id:2,name:'27寸显示器',icon:'🖥️',power:45,on:true},
  {id:3,name:'机械键盘',icon:'🔌',power:5,on:true},
  {id:4,name:'桌面台灯',icon:'💡',power:12,on:false},
  {id:5,name:'蓝牙音箱',icon:'🔊',power:20,on:true},
  {id:6,name:'手机充电器',icon:'📱',power:25,on:true},
  {id:7,name:'网络摄像头',icon:'📦',power:8,on:true},
  {id:8,name:'空调扇',icon:'❄️',power:60,on:false}
];

let schedules = [
  {id:1,deviceId:1,time:'23:00',action:'off',days:[1,2,3,4,5]},
  {id:2,deviceId:4,time:'08:00',action:'off',days:[1,2,3,4,5,6,0]},
  {id:3,deviceId:8,time:'09:00',action:'on',days:[1,2,3,4,5]},
  {id:4,deviceId:3,time:'23:30',action:'off',days:[1,2,3,4,5,6,0]}
];

let nextDeviceId = 9;
let nextScheduleId = 5;

const hourData = Array.from({length:24},()=>Math.floor(Math.random()*200+100));
const weekData = Array.from({length:7},()=>+(Math.random()*3+1.5).toFixed(1));
const monthData = Array.from({length:30},()=>+(Math.random()*4+1).toFixed(1));

function updateTime(){
  const now = new Date();
  document.getElementById('currentTime').textContent = now.toLocaleTimeString('zh-CN',{hour12:false});
}
setInterval(updateTime,1000);
updateTime();

document.querySelectorAll('.nav button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById('sec-'+btn.dataset.section).classList.add('active');
  });
});

function getTotalPower(){
  return devices.filter(d=>d.on).reduce((s,d)=>s+d.power,0);
}

function renderOverview(){
  const total = getTotalPower();
  document.getElementById('totalPower').textContent = total+' W';
  const todayKwh = +(total * 8 / 1000).toFixed(2);
  document.getElementById('todayEnergy').textContent = todayKwh+' kWh';
  document.getElementById('todayCost').textContent = (todayKwh*ELECTRICITY_PRICE).toFixed(2);
  const monthKwh = +(todayKwh * 22).toFixed(1);
  document.getElementById('monthEnergy').textContent = monthKwh+' kWh';
  const budgetPct = Math.min(100,Math.round(monthKwh/150*100));
  document.getElementById('budgetPct').textContent = budgetPct+'%';
  const bar = document.getElementById('budgetBar');
  bar.style.width = budgetPct+'%';
  bar.style.background = budgetPct>80?'var(--danger)':budgetPct>60?'var(--warning)':'var(--primary)';
  const carbon = +(monthKwh*CARBON_FACTOR*0.3).toFixed(1);

function openAddSchedule(){

  const days = [...document.querySelectorAll('#scheduleDaysInput input:checked')].map(c=>parseInt(c.value));

  closeModal('addScheduleModal');

function deleteSchedule(id){

function drawLineChart(canvas,data,labels,color){
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.parentElement.clientWidth;
  const h = canvas.height = canvas.parentElement.clientHeight;
  const pad = {top:20,right:20,bottom:30,left:50};
  const cw = w-pad.left-pad.right;
  const ch = h-pad.top-pad.bottom;
  const max = Math.max(...data)*1.2;
  const min = 0;

  ctx.clearRect(0,0,w,h);

  ctx.strokeStyle='#1e293b';
  ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pad.top+ch*(i/4);
    ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(w-pad.right,y);ctx.stroke();
    ctx.fillStyle='#64748b';ctx.font='11px system-ui';ctx.textAlign='right';
    ctx.fillText(Math.round(max-(max-min)*(i/4)),pad.left-8,y+4);
  }

  const gradient = ctx.createLinearGradient(0,pad.top,0,h-pad.bottom);
  gradient.addColorStop(0,color+'40');
  gradient.addColorStop(1,color+'00');

  ctx.beginPath();
  ctx.moveTo(pad.left,h-pad.bottom);
  data.forEach((v,i)=>{
    const x=pad.left+(i/(data.length-1))*cw;
    const y=pad.top+ch*(1-(v-min)/(max-min));
    if(i===0) ctx.lineTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.lineTo(pad.left+cw,h-pad.bottom);
  ctx.closePath();
  ctx.fillStyle=gradient;
  ctx.fill();

  ctx.beginPath();
  data.forEach((v,i)=>{
    const x=pad.left+(i/(data.length-1))*cw;
    const y=pad.top+ch*(1-(v-min)/(max-min));
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle=color;
  ctx.lineWidth=2;
  ctx.stroke();

  data.forEach((v,i)=>{
    if(i%Math.ceil(data.length/8)===0||i===data.length-1){
      const x=pad.left+(i/(data.length-1))*cw;
      const y=pad.top+ch*(1-(v-min)/(max-min));
      ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
      if(labels){
        ctx.fillStyle='#64748b';ctx.font='10px system-ui';ctx.textAlign='center';
        ctx.fillText(labels[i],x,h-pad.bottom+16);
      }
    }
  });
}

function drawPieChart(canvas,data,labels,colors){
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.parentElement.clientWidth;
  const h = canvas.height = canvas.parentElement.clientHeight;
  const cx = w/2-60;
  const cy = h/2;
  const r = Math.min(cx,cy)-20;
  const total = data.reduce((a,b)=>a+b,0);

  ctx.clearRect(0,0,w,h);
  let start = -Math.PI/2;
  data.forEach((v,i)=>{
    const angle = (v/total)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,start+angle);
    ctx.closePath();
    ctx.fillStyle=colors[i];
    ctx.fill();
    start+=angle;
  });

  ctx.beginPath();ctx.arc(cx,cy,r*0.55,0,Math.PI*2);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--card').trim()||'#111827';ctx.fill();

  const legendX = w-130;
  let legendY = 30;
  data.forEach((v,i)=>{
    ctx.fillStyle=colors[i];
    ctx.fillRect(legendX,legendY,12,12);
    ctx.fillStyle='#e2e8f0';ctx.font='12px system-ui';ctx.textAlign='left';
    ctx.fillText(`${labels[i]} ${Math.round(v/total*100)}%`,legendX+18,legendY+10);
    legendY+=22;
  });
}

function drawScoreChart(canvas,score){
  const ctx=canvas.getContext('2d');
  const w=100,h=100;
  canvas.width=w;canvas.height=h;
  const cx=50,cy=50,r=40;

  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='#1e293b';ctx.lineWidth=8;ctx.stroke();

  const angle=(score/100)*Math.PI*2;
  ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+angle);
  ctx.strokeStyle=score>=80?'#10b981':score>=60?'#f59e0b':'#ef4444';
  ctx.lineWidth=8;ctx.lineCap='round';ctx.stroke();
}

function renderCharts(){
  const hours=Array.from({length:24},(_,i)=>i+':00');
  drawLineChart(document.getElementById('overviewChart'),hourData,hours,'#3b82f6');

  drawPieChart(document.getElementById('pieChart'),pieData,pieLabels,pieColors);

  const weekLabels=['周一','周二','周三','周四','周五','周六','周日'];
  drawLineChart(document.getElementById('historyChart'),weekData,weekLabels,'#6366f1');

  drawScoreChart(document.getElementById('scoreChart'),85);

  const carbonData=Array.from({length:7},()=>+(Math.random()*2+0.5).toFixed(1));
  const carbonLabels=['周一','周二','周三','周四','周五','周六','周日'];
  drawLineChart(document.getElementById('carbonChart'),carbonData,carbonLabels,'#10b981');
}

    let data,labels;

    }else if(range==='week'){

      labels=['周一','周二','周三','周四','周五','周六','周日'];

      data=monthData;
