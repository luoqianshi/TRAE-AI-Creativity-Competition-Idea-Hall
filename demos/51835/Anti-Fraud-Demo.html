<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 适配移动端，禁止缩放以模仿原生App体验 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>银发族反诈防忽悠模拟器</title>
    <style>
        /* 基础重置与适老化大字体设置 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #ededed; color: #333; height: 100vh; display: flex; flex-direction: column; }
        
        /* 顶部导航栏 (模仿微信) */
        header { background-color: #f7f7f7; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 1px solid #dcdcdc; display: flex; justify-content: center; align-items: center; }
        
        /* 聊天展示区 */
        #chat-container { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 20px; }
        
        /* 聊天气泡通用样式 */
        .message-row { display: flex; width: 100%; }
        .message-row.scammer { justify-content: flex-start; }
        .message-row.user { justify-content: flex-end; }
        
        /* 头像 */
        .avatar { width: 45px; height: 45px; border-radius: 5px; display: flex; justify-content: center; align-items: center; font-size: 28px; background-color: #fff; flex-shrink: 0; }
        .message-row.user .avatar { background-color: #a9ea7a; margin-left: 10px; }
        .message-row.scammer .avatar { margin-right: 10px; }
        
        /* 气泡本体 - 适老化大字体 */
        .bubble { max-width: 70%; padding: 12px 15px; border-radius: 8px; font-size: 19px; line-height: 1.5; word-wrap: break-word; position: relative; }
        .message-row.scammer .bubble { background-color: #ffffff; border: 1px solid #ebebeb; }
        .message-row.user .bubble { background-color: #95ec69; border: 1px solid #8bd361; }
        
        /* 底部输入区 */
        footer { background-color: #f7f7f7; padding: 12px 15px; border-top: 1px solid #dcdcdc; display: flex; gap: 10px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        #user-input { flex: 1; padding: 12px; font-size: 18px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        #send-btn { padding: 0 20px; background-color: #07c160; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        #send-btn:active { background-color: #06ad56; }
        #send-btn:disabled { background-color: #a0cfae; cursor: not-allowed; }

        /* 防骗报告弹窗 (Modal) */
        #report-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.6); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 100; }
        .modal-content { background: #fff; width: 100%; max-width: 400px; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-title { color: #e64340; font-size: 24px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .modal-body { font-size: 18px; line-height: 1.6; text-align: left; margin-bottom: 25px; color: #333; }
        .modal-body strong { color: #e64340; font-size: 20px; }
        .modal-btn { background-color: #07c160; color: white; border: none; padding: 12px 0; width: 100%; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .modal-btn.secondary { background-color: #f2f2f2; color: #333; }
        
        /* 对方正在输入提示 */
        #typing-indicator { font-size: 14px; color: #999; text-align: center; padding: 5px; display: none; }
    </style>
</head>
<body>

    <!-- 顶部标题 -->
    <header>王主任-保健科</header>
    
    <!-- 聊天记录展示区 -->
    <div id="chat-container">
        <!-- 初始第一条消息 -->
        <div class="message-row scammer">
            <div class="avatar">👨‍⚕️</div>
            <div class="bubble">张阿姨您好，我是健康中心的王主任。您上周体检的结果出来了，有个指标非常危险，您现在方便说话吗？</div>
        </div>
    </div>
    
    <div id="typing-indicator">对方正在输入...</div>

    <!-- 底部输入框 -->
    <footer id="input-area">
        <input type="text" id="user-input" placeholder="请在这里输入回复...">
        <button id="send-btn">发送</button>
    </footer>

    <!-- 防骗报告弹窗 -->
    <div id="report-modal">
        <div class="modal-content">
            <div class="modal-title">⚠️ 防骗体检报告</div>
            <div class="modal-body">
                <p>在刚刚的测试中，您经历了典型的<strong>【保健品推销与恐吓营销】</strong>骗局！</p>
                <br>
                <p>骗子通常先用“指标危险”引起恐慌，再以“限时优惠”诱导转账。</p>
                <br>
                <p>无论您刚刚回答了什么，请记住防骗核心口诀：<br><strong>不听、不信、不转账！</strong><br>正规医院绝不会通过微信推销保健品，更不会索要银行卡号和验证码！</p>
            </div>
            <button class="modal-btn" onclick="location.reload()">重新测试</button>
            <button class="modal-btn secondary" onclick="alert('Demo演示：点击右上角转发给亲友！')">分享给老伙计</button>
        </div>
    </div>

    <script>
        // 骗子的话术剧本 (从第二句开始)
        const scammerScript = [
            "您的血液粘稠度很高，极易引发脑血栓！不过别怕，我们中心刚研发了一款‘纳豆红曲口服液’，国家专利，原价3999，今天针对老年卡用户只要998。",
            "健康最重要，钱都是身外之物。您把银行卡号和验证码发我一下，我先帮您把名额抢下来，不然明天就恢复原价了！"
        ];

        let currentTurn = 0; // 记录对话轮数

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        const reportModal = document.getElementById('report-modal');
        const inputArea = document.getElementById('input-area');

        // 发送消息功能
        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. 显示用户的消息
            appendMessage(text, 'user');
            userInput.value = '';
            
            // 如果已经到了最后一步，直接显示报告
            if (currentTurn >= scammerScript.length) {
                setTimeout(showReport, 1000);
                return;
            }

            // 2. 禁用按钮，显示正在输入
            sendBtn.disabled = true;
            typingIndicator.style.display = 'block';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 3. 模拟骗子思考延迟 (1.5秒)
            setTimeout(() => {
                typingIndicator.style.display = 'none';
                appendMessage(scammerScript[currentTurn], 'scammer');
                currentTurn++;
                sendBtn.disabled = false;
            }, 1500);
        }

        // 向聊天区添加消息气泡
        function appendMessage(text, sender) {
            const rowDiv = document.createElement('div');
            rowDiv.className = `message-row ${sender}`;
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            avatarDiv.textContent = sender === 'scammer' ? '👨‍⚕️' : '👵'; // 骗子用医生头像，用户用老人头像
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';
            bubbleDiv.textContent = text;
            
            // 排版顺序：如果是用户，气泡在左头像在右；骗子反之
            if (sender === 'user') {
                rowDiv.appendChild(bubbleDiv);
                rowDiv.appendChild(avatarDiv);
            } else {
                rowDiv.appendChild(avatarDiv);
                rowDiv.appendChild(bubbleDiv);
            }
            
            chatContainer.appendChild(rowDiv);
            // 自动滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 显示防骗报告
        function showReport() {
            inputArea.style.display = 'none'; // 隐藏输入框
            reportModal.style.display = 'flex'; // 弹出报告
        }

        // 绑定发送按钮和回车键事件
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
