<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>每日撸猫</title>
  <style>
    :root {
      --cream: #fff3dc;
      --cream-deep: #f2d6ad;
      --caramel: #c87835;
      --caramel-dark: #7a421f;
      --night: #263342;
      --mint: #8fd7bd;
      --sun: #ffd56b;
      --rose: #e68479;
      --ink: #2c211c;
      --card: rgba(255, 248, 235, 0.76);
      --shadow: 0 28px 80px rgba(72, 45, 28, 0.18);
      --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", serif;
      --sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #f8e6c7;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: var(--sans);
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 16%, rgba(255, 213, 107, 0.42), transparent 28%),
        radial-gradient(circle at 84% 12%, rgba(143, 215, 189, 0.38), transparent 26%),
        radial-gradient(circle at 76% 82%, rgba(200, 120, 53, 0.26), transparent 30%),
        linear-gradient(135deg, #fff8ea 0%, #f4d9b0 52%, #d9b383 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.5;
      background-image:
        linear-gradient(rgba(122, 66, 31, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(122, 66, 31, 0.05) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black 0%, transparent 78%);
    }

    .page {
      position: relative;
      width: min(1180px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 44px 0 40px;
    }

    .shell {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 28px;
      align-items: stretch;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 28px;
    }

    .eyebrow {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 8px 14px;
      border: 1px solid rgba(122, 66, 31, 0.2);
      border-radius: 999px;
      color: var(--caramel-dark);
      font-size: 13px;
      letter-spacing: 0.12em;
      background: rgba(255, 248, 235, 0.56);
      backdrop-filter: blur(14px);
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 6px rgba(143, 215, 189, 0.24);
    }

    h1 {
      max-width: 720px;
      margin: 18px 0 12px;
      color: var(--night);
      font-family: var(--serif);
      font-size: clamp(48px, 7vw, 92px);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.07em;
    }

    .intro {
      max-width: 570px;
      margin: 0;
      color: rgba(44, 33, 28, 0.72);
      font-size: 17px;
      line-height: 1.85;
    }

    .date-card {
      min-width: 210px;
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 28px;
      background: rgba(255, 248, 235, 0.62);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      text-align: right;
    }

    .date-card span {
      display: block;
      color: rgba(44, 33, 28, 0.6);
      font-size: 13px;
      letter-spacing: 0.16em;
    }

    .date-card strong {
      display: block;
      margin-top: 6px;
      color: var(--night);
      font-family: var(--serif);
      font-size: 30px;
    }

    .stage-card,
    .panel {
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-radius: 40px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .stage-card {
      position: relative;
      min-height: 640px;
      padding: 28px;
      overflow: hidden;
    }

    .stage-card::before {
      content: "";
      position: absolute;
      width: 620px;
      height: 620px;
      left: 50%;
      top: 54%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle, rgba(255, 213, 107, 0.58) 0 11%, transparent 12%),
        conic-gradient(from 90deg, rgba(143, 215, 189, 0.14), rgba(200, 120, 53, 0.18), rgba(255, 213, 107, 0.12), rgba(143, 215, 189, 0.14));
      filter: blur(2px);
      opacity: 0.8;
    }

    .cat-badge {
      position: relative;
      z-index: 2;
      display: inline-flex;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border-radius: 22px;
      color: var(--night);
      background: rgba(255, 255, 255, 0.52);
    }

    .cat-badge strong {
      font-family: var(--serif);
      font-size: 22px;
    }

    .cat-badge span {
      color: rgba(44, 33, 28, 0.58);
      font-size: 13px;
    }

    .cat-area {
      position: absolute;
      left: 50%;
      bottom: 70px;
      z-index: 3;
      width: min(520px, 82vw);
      height: 430px;
      transform: translateX(-50%);
      outline: none;
      cursor: pointer;
    }

    .cat-area:focus-visible .cat {
      box-shadow: 0 0 0 8px rgba(143, 215, 189, 0.36), 0 30px 70px rgba(122, 66, 31, 0.22);
    }

    .cat-shadow {
      position: absolute;
      left: 50%;
      bottom: 12px;
      width: 360px;
      height: 74px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: rgba(122, 66, 31, 0.18);
      filter: blur(12px);
    }

    .cushion {
      position: absolute;
      left: 50%;
      bottom: 22px;
      width: 410px;
      height: 112px;
      border-radius: 50%;
      transform: translateX(-50%);
      background:
        radial-gradient(circle at 38% 32%, rgba(255, 255, 255, 0.42), transparent 20%),
        linear-gradient(135deg, #91d9bf, #5fae92);
      box-shadow: inset 0 -18px 34px rgba(38, 51, 66, 0.12), 0 24px 42px rgba(72, 45, 28, 0.12);
    }

    .cat {
      position: absolute;
      left: 50%;
      bottom: 86px;
      width: 268px;
      height: 244px;
      border-radius: 45% 45% 42% 42%;
      transform: translateX(-50%);
      background:
        radial-gradient(circle at 36% 30%, rgba(255, 255, 255, 0.38), transparent 18%),
        linear-gradient(155deg, #d99356 0%, #c87835 54%, #9e5528 100%);
      box-shadow: 0 30px 70px rgba(122, 66, 31, 0.22), inset -18px -16px 30px rgba(122, 66, 31, 0.18);
      transition: transform 220ms ease;
      animation: breathe 3.2s ease-in-out infinite;
    }

    .cat-area:hover .cat {
      transform: translateX(-50%) translateY(-8px) rotate(-1deg);
    }

    .cat-area.petted .cat {
      animation: happy 520ms ease;
    }

    .ear {
      position: absolute;
      top: -50px;
      width: 88px;
      height: 92px;
      background: #bd6a34;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }

    .ear::after {
      content: "";
      position: absolute;
      left: 24px;
      top: 30px;
      width: 40px;
      height: 48px;
      background: #e8a17b;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }

    .ear.left {
      left: 28px;
      transform: rotate(-16deg);
    }

    .ear.right {
      right: 28px;
      transform: rotate(16deg);
    }

    .face {
      position: absolute;
      inset: 0;
    }

    .eye {
      position: absolute;
      top: 88px;
      width: 24px;
      height: 36px;
      border-radius: 50%;
      background: var(--night);
      box-shadow: inset 4px 7px 0 rgba(255, 255, 255, 0.34);
      animation: blink 5.2s infinite;
    }

    .eye.left {
      left: 78px;
    }

    .eye.right {
      right: 78px;
    }

    .nose {
      position: absolute;
      left: 50%;
      top: 124px;
      width: 28px;
      height: 22px;
      border-radius: 48% 48% 58% 58%;
      transform: translateX(-50%);
      background: #70412e;
    }

    .mouth {
      position: absolute;
      left: 50%;
      top: 148px;
      width: 62px;
      height: 34px;
      border-bottom: 4px solid rgba(38, 51, 66, 0.72);
      border-radius: 0 0 60px 60px;
      transform: translateX(-50%);
    }

    .whisker {
      position: absolute;
      top: 138px;
      width: 72px;
      height: 2px;
      border-radius: 999px;
      background: rgba(44, 33, 28, 0.52);
    }

    .whisker.left.one { left: 10px; transform: rotate(10deg); }
    .whisker.left.two { left: 8px; top: 158px; transform: rotate(-5deg); }
    .whisker.right.one { right: 10px; transform: rotate(-10deg); }
    .whisker.right.two { right: 8px; top: 158px; transform: rotate(5deg); }

    .paw {
      position: absolute;
      bottom: -15px;
      width: 72px;
      height: 54px;
      border-radius: 50%;
      background: #b76431;
      box-shadow: inset 0 -10px 16px rgba(122, 66, 31, 0.18);
    }

    .paw.left {
      left: 54px;
    }

    .paw.right {
      right: 54px;
    }

    .tail {
      position: absolute;
      right: 52px;
      bottom: 128px;
      width: 170px;
      height: 50px;
      border: 24px solid #b76431;
      border-left: 0;
      border-bottom: 0;
      border-radius: 0 90px 0 0;
      transform-origin: 0 100%;
      animation: tail 2.4s ease-in-out infinite;
    }

    .reaction {
      position: absolute;
      left: 50%;
      bottom: 514px;
      z-index: 4;
      min-width: 240px;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, 0.64);
      border-radius: 24px 24px 24px 8px;
      color: var(--night);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 18px 40px rgba(72, 45, 28, 0.12);
      transform: translateX(-50%);
      text-align: center;
      font-weight: 700;
    }

    .hand {
      position: absolute;
      left: calc(50% + 108px);
      top: 190px;
      z-index: 5;
      width: 78px;
      height: 64px;
      border-radius: 36px 36px 42px 42px;
      background: #f0ba88;
      box-shadow: inset -8px -8px 0 rgba(122, 66, 31, 0.08), 0 18px 28px rgba(122, 66, 31, 0.1);
      opacity: 0;
      transform: rotate(-24deg) translateY(-18px);
      pointer-events: none;
    }

    .hand::before,
    .hand::after {
      content: "";
      position: absolute;
      top: -14px;
      width: 20px;
      height: 42px;
      border-radius: 999px;
      background: #f0ba88;
    }

    .hand::before {
      left: 14px;
    }

    .hand::after {
      right: 14px;
    }

    .cat-area.petted .hand {
      animation: pat 520ms ease;
    }

    .heart {
      position: absolute;
      z-index: 8;
      width: 16px;
      height: 16px;
      background: var(--rose);
      transform: rotate(45deg);
      animation: float-heart 900ms ease-out forwards;
      pointer-events: none;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--rose);
    }

    .heart::before {
      left: -8px;
    }

    .heart::after {
      top: -8px;
    }

    .panel {
      padding: 24px;
    }

    .panel h2,
    .task h2 {
      margin: 0 0 16px;
      color: var(--night);
      font-family: var(--serif);
      font-size: 28px;
      letter-spacing: -0.03em;
    }

    .stat-list {
      display: grid;
      gap: 14px;
    }

    .stat {
      padding: 18px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.48);
    }

    .stat label {
      display: block;
      margin-bottom: 8px;
      color: rgba(44, 33, 28, 0.56);
      font-size: 13px;
      letter-spacing: 0.12em;
    }

    .stat strong {
      color: var(--night);
      font-family: var(--serif);
      font-size: 34px;
      line-height: 1;
    }

    .meter {
      height: 12px;
      margin-top: 14px;
      border-radius: 999px;
      background: rgba(38, 51, 66, 0.12);
      overflow: hidden;
    }

    .meter span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--mint), var(--sun), var(--caramel));
      transition: width 360ms ease;
    }

    .task {
      margin-top: 18px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-radius: 34px;
      background: rgba(38, 51, 66, 0.92);
      color: #fff8eb;
      box-shadow: 0 26px 70px rgba(38, 51, 66, 0.22);
    }

    .task h2 {
      color: #fff8eb;
    }

    .task p {
      margin: 0;
      color: rgba(255, 248, 235, 0.72);
      line-height: 1.8;
    }

    .task-status {
      display: inline-flex;
      margin-top: 18px;
      padding: 9px 13px;
      border-radius: 999px;
      color: var(--night);
      background: var(--sun);
      font-size: 14px;
      font-weight: 800;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      color: #fff8eb;
      background: linear-gradient(135deg, var(--caramel), var(--caramel-dark));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 14px 28px rgba(122, 66, 31, 0.22);
      cursor: pointer;
      font: 800 15px var(--sans);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.36), 0 18px 36px rgba(122, 66, 31, 0.26);
    }

    button.secondary {
      color: var(--night);
      background: rgba(255, 255, 255, 0.7);
    }

    .hint {
      position: relative;
      z-index: 2;
      max-width: 340px;
      margin-top: 18px;
      color: rgba(44, 33, 28, 0.62);
      font-size: 14px;
      line-height: 1.7;
    }

    .spark {
      position: absolute;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 0 28px rgba(255, 213, 107, 0.52);
      animation: drift 7s ease-in-out infinite;
    }

    .spark.one {
      width: 64px;
      height: 64px;
      right: 12%;
      top: 16%;
    }

    .spark.two {
      width: 34px;
      height: 34px;
      left: 10%;
      bottom: 24%;
      animation-delay: -2s;
    }

    .spark.three {
      width: 48px;
      height: 48px;
      right: 22%;
      bottom: 14%;
      animation-delay: -4s;
    }

    @keyframes breathe {
      0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
      50% { transform: translateX(-50%) translateY(-5px) scale(1.015); }
    }

    @keyframes happy {
      0% { transform: translateX(-50%) rotate(0); }
      35% { transform: translateX(-50%) translateY(-14px) rotate(-3deg); }
      70% { transform: translateX(-50%) translateY(-6px) rotate(3deg); }
      100% { transform: translateX(-50%) rotate(0); }
    }

    @keyframes blink {
      0%, 88%, 100% { transform: scaleY(1); }
      92%, 96% { transform: scaleY(0.08); }
    }

    @keyframes tail {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-12deg); }
    }

    @keyframes pat {
      0% { opacity: 0; transform: rotate(-24deg) translateY(-28px); }
      30% { opacity: 1; transform: rotate(-18deg) translateY(16px); }
      70% { opacity: 1; transform: rotate(-26deg) translateY(4px); }
      100% { opacity: 0; transform: rotate(-24deg) translateY(-20px); }
    }

    @keyframes float-heart {
      0% { opacity: 0; transform: translateY(10px) rotate(45deg) scale(0.5); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-92px) rotate(45deg) scale(1.25); }
    }

    @keyframes drift {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(12px, -18px, 0); }
    }

    @media (max-width: 920px) {
      .page {
        padding-top: 28px;
      }

      header,
      .shell {
        grid-template-columns: 1fr;
      }

      header {
        display: block;
      }

      .date-card {
        margin-top: 20px;
        text-align: left;
      }

      .stage-card {
        min-height: 600px;
      }
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 20px, 1180px);
        padding-bottom: 20px;
      }

      .stage-card,
      .panel,
      .task {
        border-radius: 28px;
      }

      .stage-card {
        min-height: 560px;
        padding: 20px;
      }

      .cat-area {
        width: 360px;
        transform: translateX(-50%) scale(0.82);
        transform-origin: bottom center;
      }

      .reaction {
        bottom: 462px;
      }

      .date-card strong {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <section>
        <div class="eyebrow">DAILY CAT RITUAL</div>
        <h1>每日撸猫</h1>
        <p class="intro">给今天留出一分钟，轻轻摸摸这只正在晒太阳的猫。它会记住你的手感，也会把今日治愈指数慢慢推高。</p>
      </section>
      <aside class="date-card" aria-label="今日日期">
        <span>今天是</span>
        <strong id="todayText">加载中</strong>
      </aside>
    </header>

    <section class="shell">
      <article class="stage-card" aria-label="每日猫咪互动区">
        <div class="spark one"></div>
        <div class="spark two"></div>
        <div class="spark three"></div>

        <div class="cat-badge">
          <strong id="catName">焦糖</strong>
          <span id="catLine">今天负责把阳光踩软</span>
        </div>

        <p class="hint">点击猫咪，或在聚焦后按 Enter / Space。当天数据会自动保存在本机浏览器里。</p>

        <div id="reaction" class="reaction" aria-live="polite">先轻轻摸一下头吧。</div>

        <div id="catArea" class="cat-area" role="button" tabindex="0" aria-label="撸猫一次">
          <div class="hand"></div>
          <div class="cat-shadow"></div>
          <div class="cushion"></div>
          <div class="tail"></div>
          <div class="cat">
            <div class="ear left"></div>
            <div class="ear right"></div>
            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="nose"></div>
              <div class="mouth"></div>
              <div class="whisker left one"></div>
              <div class="whisker left two"></div>
              <div class="whisker right one"></div>
              <div class="whisker right two"></div>
            </div>
            <div class="paw left"></div>
            <div class="paw right"></div>
          </div>
        </div>
      </article>

      <aside>
        <section class="panel" aria-label="今日状态">
          <h2>今日状态</h2>
          <div class="stat-list">
            <div class="stat">
              <label>撸猫次数</label>
              <strong><span id="petCount">0</span> 次</strong>
            </div>
            <div class="stat">
              <label>亲密度</label>
              <strong><span id="affectionText">0</span>%</strong>
              <div class="meter" aria-hidden="true"><span id="affectionMeter"></span></div>
            </div>
            <div class="stat">
              <label>今日治愈指数</label>
              <strong><span id="healScore">18</span></strong>
            </div>
          </div>
          <div class="actions">
            <button id="petButton" type="button">撸猫一下</button>
            <button id="resetButton" class="secondary" type="button">重置今日</button>
          </div>
        </section>

        <section class="task" aria-label="每日小任务">
          <h2>今日小任务</h2>
          <p id="taskText">轻轻摸摸头 3 次，让焦糖开始打呼。</p>
          <span id="taskStatus" class="task-status">进行中</span>
        </section>
      </aside>
    </section>
  </main>

  <script>
    const cats = [
      { name: "焦糖", line: "今天负责把阳光踩软", task: "轻轻摸摸头 3 次，让焦糖开始打呼。" },
      { name: "桂花", line: "把午后的风收进尾巴里", task: "连续撸猫 5 次，收获桂花的眯眼认可。" },
      { name: "松饼", line: "正在研究怎样把毯子睡圆", task: "把亲密度提升到 60%，松饼会把爪子递给你。" },
      { name: "乌云", line: "表情很酷，心里很软", task: "撸猫 4 次，听乌云低声咕噜。" },
      { name: "奶盖", line: "路过每个杯口都要闻一闻", task: "今日治愈指数达到 70，奶盖会翻肚皮。" },
      { name: "栗子", line: "尾巴像一只会思考的问号", task: "撸猫 6 次，栗子会主动蹭过来。" },
      { name: "雪团", line: "把安静叠成了毛茸茸的一层", task: "亲密度达到 50%，雪团会慢慢眨眼。" }
    ];

    const reactions = [
      "喵。这个力度刚刚好。",
      "它眯起眼睛，尾巴轻轻晃了一下。",
      "呼噜声变大了，像一台小小暖炉。",
      "它把脑袋往你的手心里又送了送。",
      "今日份柔软到账。",
      "它决定暂时把你列为可信人类。",
      "小爪子踩了两下垫子，表示满意。"
    ];

    const storageKey = "daily-cat-state-v1";
    const today = new Date();
    const dateKey = today.toISOString().slice(0, 10);
    const dayIndex = Math.floor(today.getTime() / 86400000) % cats.length;
    const cat = cats[dayIndex];

    const state = loadState();
    const elements = {
      todayText: document.getElementById("todayText"),
      catName: document.getElementById("catName"),
      catLine: document.getElementById("catLine"),
      catArea: document.getElementById("catArea"),
      reaction: document.getElementById("reaction"),
      petCount: document.getElementById("petCount"),
      affectionText: document.getElementById("affectionText"),
      affectionMeter: document.getElementById("affectionMeter"),
      healScore: document.getElementById("healScore"),
      taskText: document.getElementById("taskText"),
      taskStatus: document.getElementById("taskStatus"),
      petButton: document.getElementById("petButton"),
      resetButton: document.getElementById("resetButton")
    };

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (saved && saved.date === dateKey) {
          return {
            date: dateKey,
            petCount: Number(saved.petCount) || 0,
            affection: Number(saved.affection) || 0,
            taskDone: Boolean(saved.taskDone)
          };
        }
      } catch (error) {
        console.warn("读取每日撸猫状态失败，已使用默认状态。", error);
      }

      return { date: dateKey, petCount: 0, affection: 0, taskDone: false };
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify(state));
    }

    function formatDate() {
      return new Intl.DateTimeFormat("zh-CN", {
        month: "long",
        day: "numeric",
        weekday: "long"
      }).format(today);
    }

    function calculateHealScore() {
      return Math.min(99, 18 + state.petCount * 9 + Math.round(state.affection * 0.42));
    }

    function isTaskDone() {
      return state.petCount >= 3 || state.affection >= 60 || calculateHealScore() >= 70;
    }

    function updateView() {
      state.taskDone = isTaskDone();
      elements.petCount.textContent = state.petCount;
      elements.affectionText.textContent = state.affection;
      elements.affectionMeter.style.width = `${state.affection}%`;
      elements.healScore.textContent = calculateHealScore();
      elements.taskStatus.textContent = state.taskDone ? "已完成" : "进行中";
      elements.taskStatus.style.background = state.taskDone ? "var(--mint)" : "var(--sun)";
      elements.taskStatus.style.color = "var(--night)";
      saveState();
    }

    function petCat(sourceElement) {
      state.petCount += 1;
      state.affection = Math.min(100, state.affection + 12 + (state.petCount % 3));
      elements.reaction.textContent = reactions[state.petCount % reactions.length];

      elements.catArea.classList.remove("petted");
      void elements.catArea.offsetWidth;
      elements.catArea.classList.add("petted");

      createHeart(sourceElement || elements.catArea);
      playPurr();
      updateView();
    }

    function createHeart(sourceElement) {
      const rect = sourceElement.getBoundingClientRect();
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.style.left = `${rect.left + rect.width / 2 + (Math.random() * 70 - 35)}px`;
      heart.style.top = `${rect.top + rect.height * 0.35 + (Math.random() * 40 - 20)}px`;
      document.body.appendChild(heart);
      window.setTimeout(() => heart.remove(), 950);
    }

    function playPurr() {
      if (!window.AudioContext && !window.webkitAudioContext) {
        return;
      }

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      const audio = new AudioContextClass();
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(92, audio.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(132, audio.currentTime + 0.16);
      gain.gain.setValueAtTime(0.0001, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.045, audio.currentTime + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.22);
      oscillator.connect(gain);
      gain.connect(audio.destination);
      oscillator.start();
      oscillator.stop(audio.currentTime + 0.24);
      window.setTimeout(() => audio.close(), 320);
    }

    function resetToday() {
      state.petCount = 0;
      state.affection = 0;
      state.taskDone = false;
      elements.reaction.textContent = "猫咪重新趴好了，等你再摸一下。";
      updateView();
    }

    elements.todayText.textContent = formatDate();
    elements.catName.textContent = cat.name;
    elements.catLine.textContent = cat.line;
    elements.taskText.textContent = cat.task;

    elements.catArea.addEventListener("click", () => petCat(elements.catArea));
    elements.petButton.addEventListener("click", () => petCat(elements.petButton));
    elements.resetButton.addEventListener("click", resetToday);
    elements.catArea.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        petCat(elements.catArea);
      }
    });

    updateView();
  </script>
</body>
</html>
