<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学途灯塔 - 个人学习进度看板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .kpi-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .kpi-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .kpi-value {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .kpi-label {
            font-size: 0.9rem;
            color: #666;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .progress-ring-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 250px;
        }

        .progress-ring {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .progress-ring svg {
            transform: rotate(-90deg);
        }

        .progress-ring-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .progress-ring-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #333;
        }

        .progress-ring-label {
            font-size: 0.9rem;
            color: #666;
        }

        .subject-list {
            list-style: none;
        }

        .subject-item {
            margin-bottom: 20px;
        }

        .subject-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .subject-name {
            font-weight: 500;
            color: #333;
        }

        .subject-progress {
            color: #666;
            font-size: 0.9rem;
        }

        .progress-bar {
            height: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s ease;
        }

        .chart-container {
            height: 250px;
            position: relative;
        }

        .reminder-box {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .reminder-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .reminder-text {
            font-size: 1.1rem;
            color: #333;
            line-height: 1.6;
        }

        .data-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }

        .data-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .data-input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .data-input-group label {
            font-size: 0.85rem;
            color: #666;
            font-weight: 500;
        }

        .data-input-group input, .data-input-group select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .data-input-group input:focus, .data-input-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background: #ff5252;
        }

        .record-table {
            width: 100%;
            border-collapse: collapse;
        }

        .record-table th, .record-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        .record-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .record-table tr:hover {
            background: #f8f9fa;
        }

        .record-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .empty-state-text {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            
            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .data-controls {
                flex-direction: column;
            }
            
            .data-input-group {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .kpi-grid {
                grid-template-columns: 1fr;
            }
            
            body {
                padding: 10px;
            }
            
            header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>学途灯塔</h1>
            <p>个人学习进度可视化看板</p>
        </header>

        <!-- KPI 概览区 -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-icon">📅</div>
                <div class="kpi-value" id="totalDays">0</div>
                <div class="kpi-label">总学习天数</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon">⏱️</div>
                <div class="kpi-value" id="totalHours">0</div>
                <div class="kpi-label">总学习时长(小时)</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon">🎯</div>
                <div class="kpi-value" id="completionRate">0%</div>
                <div class="kpi-label">目标完成率</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon">🔥</div>
                <div class="kpi-value" id="streakDays">0</div>
                <div class="kpi-label">连续学习天数</div>
            </div>
        </div>

        <!-- 进度总览 -->
        <div class="dashboard">
            <div class="card">
                <h2 class="card-title">进度总览</h2>
                <div class="progress-ring-container">
                    <div class="progress-ring">
                        <svg width="200" height="200">
                            <circle
                                cx="100"
                                cy="100"
                                r="90"
                                fill="transparent"
                                stroke="#f0f0f0"
                                stroke-width="12"
                            />
                            <circle
                                id="progressCircle"
                                cx="100"
                                cy="100"
                                r="90"
                                fill="transparent"
                                stroke="url(#gradient)"
                                stroke-width="12"
                                stroke-linecap="round"
                                stroke-dasharray="565.48"
                                stroke-dashoffset="565.48"
                            />
                            <defs>
                                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#667eea" />
                                    <stop offset="100%" stop-color="#764ba2" />
                                </linearGradient>
                            </defs>
                        </svg>
                        <div class="progress-ring-text">
                            <div class="progress-ring-value" id="ringPercentage">0%</div>
                            <div class="progress-ring-label">总体进度</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">各科目进度</h2>
                <ul class="subject-list" id="subjectList">
                    <!-- 动态生成 -->
                </ul>
            </div>
        </div>

        <!-- 每日学习记录 -->
        <div class="card" style="margin-bottom: 30px;">
            <h2 class="card-title">近7天学习时长</h2>
            <div class="chart-container">
                <canvas id="weeklyChart"></canvas>
            </div>
        </div>

        <!-- 学习提醒 -->
        <div class="card" style="margin-bottom: 30px;">
            <h2 class="card-title">学习提醒</h2>
            <div class="reminder-box">
                <div class="reminder-icon" id="reminderIcon">💪</div>
                <div class="reminder-text" id="reminderText">坚持就是胜利！</div>
            </div>
        </div>

        <!-- 数据管理 -->
        <div class="data-section">
            <h2 class="card-title">数据管理</h2>
            
            <div class="data-controls">
                <div class="data-input-group">
                    <label>日期</label>
                    <input type="date" id="recordDate">
                </div>
                <div class="data-input-group">
                    <label>科目</label>
                    <select id="recordSubject">
                        <option value="科目一">科目一</option>
                        <option value="科目二">科目二</option>
                        <option value="科目三">科目三</option>
                    </select>
                </div>
                <div class="data-input-group">
                    <label>学习时长(小时)</label>
                    <input type="number" id="recordDuration" step="0.5" min="0" placeholder="输入学习时长">
                </div>
                <div class="data-input-group">
                    <label>进度(%)</label>
                    <input type="number" id="recordProgress" min="0" max="100" placeholder="当前进度">
                </div>
                <button class="btn btn-primary" onclick="addRecord()">添加记录</button>
                <button class="btn btn-secondary" onclick="openSubjectModal()">管理科目</button>
                <button class="btn btn-danger" onclick="clearAllData()">清空数据</button>
            </div>

            <h3 style="margin-bottom: 15px;">学习记录</h3>
            <div id="recordsContainer">
                <table class="record-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>科目</th>
                            <th>学习时长(小时)</th>
                            <th>进度(%)</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordsBody">
                        <!-- 动态生成 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 科目管理模态框 -->
    <div class="modal" id="subjectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">管理科目</h3>
                <button class="modal-close" onclick="closeSubjectModal()">&times;</button>
            </div>
            
            <div class="form-group">
                <label class="form-label">添加新科目</label>
                <input type="text" class="form-input" id="newSubjectName" placeholder="输入科目名称">
            </div>
            <button class="btn btn-primary" onclick="addSubject()" style="margin-bottom: 20px;">添加</button>
            
            <h4 style="margin-bottom: 10px;">已添加科目</h4>
            <ul id="subjectManageList" style="list-style: none;">
                <!-- 动态生成 -->
            </ul>
        </div>
    </div>

    <script>
        // 数据存储
        let appData = {
            subjects: [
                { name: '科目一', progress: 0, color: '#667eea' },
                { name: '科目二', progress: 0, color: '#764ba2' },
                { name: '科目三', progress: 0, color: '#f093fb' }
            ],
            records: [],
            startDate: null
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            initDateInput();
            updateDashboard();
            initChart();
        });

        // 初始化日期输入
        function initDateInput() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('recordDate').value = today;
        }

        // 从localStorage加载数据
        function loadData() {
            const savedData = localStorage.getItem('lighthouseData');
            if (savedData) {
                appData = JSON.parse(savedData);
                updateSubjectSelect();
            }
        }

        // 保存数据到localStorage
        function saveData() {
            localStorage.setItem('lighthouseData', JSON.stringify(appData));
        }

        // 更新科目下拉选项
        function updateSubjectSelect() {
            const select = document.getElementById('recordSubject');
            select.innerHTML = '';
            appData.subjects.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject.name;
                option.textContent = subject.name;
                select.appendChild(option);
            });
        }

        // 更新仪表盘
        function updateDashboard() {
            updateKPIs();
            updateProgressRing();
            updateSubjectList();
            updateReminder();
            updateRecordsTable();
            updateChart();
        }

        // 更新KPI
        function updateKPIs() {
            // 总学习天数
            const uniqueDates = [...new Set(appData.records.map(r => r.date))];
            document.getElementById('totalDays').textContent = uniqueDates.length;

            // 总学习时长
            const totalHours = appData.records.reduce((sum, r) => sum + parseFloat(r.duration || 0), 0);
            document.getElementById('totalHours').textContent = totalHours.toFixed(1);

            // 目标完成率
            const avgProgress = appData.subjects.length > 0 
                ? appData.subjects.reduce((sum, s) => sum + s.progress, 0) / appData.subjects.length 
                : 0;
            document.getElementById('completionRate').textContent = Math.round(avgProgress) + '%';

            // 连续学习天数
            document.getElementById('streakDays').textContent = calculateStreak();
        }

        // 计算连续学习天数
        function calculateStreak() {
            if (appData.records.length === 0) return 0;

            const dates = [...new Set(appData.records.map(r => r.date))].sort().reverse();
            const today = new Date().toISOString().split('T')[0];
            const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];

            let streak = 0;
            let currentDate = dates.includes(today) ? new Date(today) : 
                              dates.includes(yesterday) ? new Date(yesterday) : null;

            if (!currentDate) return 0;

            for (let dateStr of dates) {
                const date = new Date(dateStr);
                const diffDays = Math.round((currentDate - date) / 86400000);
                
                if (diffDays === streak) {
                    streak++;
                    currentDate = date;
                } else {
                    break;
                }
            }

            return streak;
        }

        // 更新进度环
        function updateProgressRing() {
            const avgProgress = appData.subjects.length > 0 
                ? appData.subjects.reduce((sum, s) => sum + s.progress, 0) / appData.subjects.length 
                : 0;

            const circle = document.getElementById('progressCircle');
            const circumference = 565.48;
            const offset = circumference - (avgProgress / 100) * circumference;
            circle.style.strokeDashoffset = offset;

            document.getElementById('ringPercentage').textContent = Math.round(avgProgress) + '%';
        }

        // 更新科目列表
        function updateSubjectList() {
            const list = document.getElementById('subjectList');
            list.innerHTML = '';

            appData.subjects.forEach(subject => {
                const li = document.createElement('li');
                li.className = 'subject-item';
                li.innerHTML = `
                    <div class="subject-header">
                        <span class="subject-name">${subject.name}</span>
                        <span class="subject-progress">${subject.progress}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${subject.progress}%; background: ${subject.color};"></div>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        // 更新学习提醒
        function updateReminder() {
            const avgProgress = appData.subjects.length > 0 
                ? appData.subjects.reduce((sum, s) => sum + s.progress, 0) / appData.subjects.length 
                : 0;

            const streak = calculateStreak();
            const icon = document.getElementById('reminderIcon');
            const text = document.getElementById('reminderText');

            if (avgProgress === 0) {
                icon.textContent = '🌟';
                text.textContent = '千里之行，始于足下。今天就开始你的学习之旅吧！';
            } else if (avgProgress < 30) {
                icon.textContent = '🌱';
                text.textContent = '良好的开端！继续保持，你正在打下坚实的基础。';
            } else if (avgProgress < 60) {
                icon.textContent = '💪';
                text.textContent = '进展顺利！你已经完成了近一半，加油！';
            } else if (avgProgress < 90) {
                icon.textContent = '🚀';
                text.textContent = '胜利在望！冲刺阶段，一鼓作气完成目标！';
            } else {
                icon.textContent = '🎉';
                text.textContent = '太棒了！你即将完成所有学习目标，为自己骄傲！';
            }

            if (streak >= 3) {
                text.textContent += `\n\n🔥 你已经连续学习了 ${streak} 天，太厉害了！`;
            } else if (streak === 0 && appData.records.length > 0) {
                text.textContent += '\n\n⏰ 今天还没有学习记录，别忘了坚持每日学习哦！';
            }
        }

        // 添加记录
        function addRecord() {
            const date = document.getElementById('recordDate').value;
            const subject = document.getElementById('recordSubject').value;
            const duration = document.getElementById('recordDuration').value;
            const progress = document.getElementById('recordProgress').value;

            if (!date || !duration) {
                alert('请填写日期和学习时长');
                return;
            }

            // 设置开始日期
            if (!appData.startDate) {
                appData.startDate = date;
            }

            // 添加记录
            appData.records.push({
                id: Date.now(),
                date,
                subject,
                duration: parseFloat(duration),
                progress: progress ? parseFloat(progress) : 0
            });

            // 更新科目进度
            if (progress) {
                const subjectObj = appData.subjects.find(s => s.name === subject);
                if (subjectObj) {
                    subjectObj.progress = Math.min(100, Math.max(0, parseFloat(progress)));
                }
            }

            saveData();
            updateDashboard();
            updateChart();

            // 清空输入
            document.getElementById('recordDuration').value = '';
            document.getElementById('recordProgress').value = '';
        }

        // 删除记录
        function deleteRecord(id) {
            appData.records = appData.records.filter(r => r.id !== id);
            saveData();
            updateDashboard();
            updateChart();
        }

        // 更新记录表格
        function updateRecordsTable() {
            const tbody = document.getElementById('recordsBody');
            tbody.innerHTML = '';

            if (appData.records.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <div class="empty-state-icon">📝</div>
                            <div class="empty-state-text">暂无学习记录</div>
                        </td>
                    </tr>
                `;
                return;
            }

            const sortedRecords = [...appData.records].sort((a, b) => 
                new Date(b.date) - new Date(a.date)
            );

            sortedRecords.slice(0, 10).forEach(record => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${record.date}</td>
                    <td>${record.subject}</td>
                    <td>${record.duration}</td>
                    <td>${record.progress}%</td>
                    <td class="record-actions">
                        <button class="btn btn-danger btn-small" onclick="deleteRecord(${record.id})">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 初始化图表
        let weeklyChart = null;

        function initChart() {
            const ctx = document.getElementById('weeklyChart').getContext('2d');
            weeklyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: '学习时长(小时)',
                        data: [],
                        backgroundColor: 'rgba(102, 126, 234, 0.7)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 1,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });

            updateChart();
        }

        // 更新图表
        function updateChart() {
            if (!weeklyChart) return;

            const today = new Date();
            const labels = [];
            const data = [];

            for (let i = 6; i >= 0; i--) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                const dayLabel = `${date.getMonth() + 1}/${date.getDate()}`;
                
                labels.push(dayLabel);

                const dayRecords = appData.records.filter(r => r.date === dateStr);
                const dayTotal = dayRecords.reduce((sum, r) => sum + parseFloat(r.duration || 0), 0);
                data.push(dayTotal);
            }

            weeklyChart.data.labels = labels;
            weeklyChart.data.datasets[0].data = data;
            weeklyChart.update();
        }

        // 打开科目管理模态框
        function openSubjectModal() {
            document.getElementById('subjectModal').classList.add('active');
            updateSubjectManageList();
        }

        // 关闭科目管理模态框
        function closeSubjectModal() {
            document.getElementById('subjectModal').classList.remove('active');
        }

        // 更新科目管理列表
        function updateSubjectManageList() {
            const list = document.getElementById('subjectManageList');
            list.innerHTML = '';

            appData.subjects.forEach((subject, index) => {
                const li = document.createElement('li');
                li.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f0f0f0;';
                li.innerHTML = `
                    <span>${subject.name}</span>
                    <button class="btn btn-danger btn-small" onclick="removeSubject(${index})">删除</button>
                `;
                list.appendChild(li);
            });
        }

        // 添加科目
        function addSubject() {
            const name = document.getElementById('newSubjectName').value.trim();
            if (!name) {
                alert('请输入科目名称');
                return;
            }

            if (appData.subjects.some(s => s.name === name)) {
                alert('科目已存在');
                return;
            }

            const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#00f2fe', '#43e97b', '#fa709a'];
            const color = colors[appData.subjects.length % colors.length];

            appData.subjects.push({
                name,
                progress: 0,
                color
            });

            saveData();
            updateSubjectSelect();
            updateSubjectManageList();
            updateDashboard();

            document.getElementById('newSubjectName').value = '';
        }

        // 删除科目
        function removeSubject(index) {
            if (appData.subjects.length <= 1) {
                alert('至少保留一个科目');
                return;
            }

            const subjectName = appData.subjects[index].name;
            if (confirm(`确定要删除科目"${subjectName}"吗？相关的学习记录也会被删除。`)) {
                appData.subjects.splice(index, 1);
                appData.records = appData.records.filter(r => r.subject !== subjectName);
                saveData();
                updateSubjectSelect();
                updateSubjectManageList();
                updateDashboard();
                updateChart();
            }
        }

        // 清空所有数据
        function clearAllData() {
            if (confirm('确定要清空所有数据吗？此操作不可撤销。')) {
                appData = {
                    subjects: [
                        { name: '科目一', progress: 0, color: '#667eea' },
                        { name: '科目二', progress: 0, color: '#764ba2' },
                        { name: '科目三', progress: 0, color: '#f093fb' }
                    ],
                    records: [],
                    startDate: null
                };
                saveData();
                updateSubjectSelect();
                updateDashboard();
                updateChart();
            }
        }

        // 点击模态框外部关闭
        document.getElementById('subjectModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeSubjectModal();
            }
        });
    </script>
</body>
</html>
