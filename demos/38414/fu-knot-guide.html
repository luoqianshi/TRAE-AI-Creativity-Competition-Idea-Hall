<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>非遗福结制作 - 分步交互引导</title>
<style>
  :root {
    --red: #C41E3A;
    --dark-red: #8B0000;
    --gold: #D4A843;
    --light-gold: #F5E6C8;
    --bg: #FFF8F0;
    --text: #3D2B1F;
    --shadow: rgba(139, 0, 0, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", "STSong", serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 顶部装饰纹样 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--red), var(--gold), var(--red), var(--gold), var(--red));
    z-index: 100;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 40px 20px 20px;
    position: relative;
  }

  .header .title-icon {
    font-size: 48px;
    margin-bottom: 8px;
    display: block;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .header h1 {
    font-size: 2.2em;
    color: var(--red);
    letter-spacing: 4px;
    text-shadow: 2px 2px 4px var(--shadow);
    margin-bottom: 6px;
  }

  .header .subtitle {
    font-size: 1em;
    color: #8B7355;
    letter-spacing: 2px;
  }

  /* 主容器 */
  .main-container {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* 进度条 */
  .progress-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin: 24px 0 32px;
    flex-wrap: wrap;
  }

  .progress-step {
    display: flex;
    align-items: center;
  }

  .progress-dot {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #E8D5C4;
    color: #999;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 14px;
    transition: all 0.4s ease;
    position: relative;
    z-index: 1;
  }

  .progress-dot.active {
    background: var(--red);
    color: #fff;
    transform: scale(1.15);
    box-shadow: 0 4px 15px var(--shadow);
  }

  .progress-dot.done {
    background: var(--gold);
    color: #fff;
  }

  .progress-line {
    width: 40px; height: 3px;
    background: #E8D5C4;
    transition: background 0.4s ease;
  }

  .progress-line.done {
    background: var(--gold);
  }

  /* 步骤卡片 */
  .step-card {
    background: #fff;
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    position: relative;
    overflow: hidden;
    min-height: 380px;
    display: none;
    animation: fadeSlideIn 0.5s ease;
  }

  .step-card.active-step {
    display: block;
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .step-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 4px;
    background: linear-gradient(90deg, var(--red), var(--gold));
  }

  .step-card .step-number {
    display: inline-block;
    background: var(--red);
    color: #fff;
    padding: 4px 16px;
    border-radius: 20px;
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 14px;
  }

  .step-card h2 {
    font-size: 1.6em;
    color: var(--dark-red);
    margin-bottom: 10px;
    letter-spacing: 2px;
  }

  .step-card .desc {
    font-size: 1em;
    color: #5D4037;
    line-height: 1.8;
    margin-bottom: 20px;
  }

  /* 画布容器 */
  .canvas-container {
    background: #FDF8F2;
    border: 2px dashed #E8D5C4;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 16px 0;
    position: relative;
    min-height: 260px;
  }

  .canvas-container canvas {
    display: block;
    max-width: 100%;
  }

  /* 提示框 */
  .tip-box {
    background: linear-gradient(135deg, #FFF8E1, #FFF3CD);
    border-left: 4px solid var(--gold);
    padding: 14px 18px;
    border-radius: 0 12px 12px 0;
    font-size: 0.9em;
    color: #5D4037;
    margin: 16px 0;
  }

  .tip-box .tip-icon {
    margin-right: 6px;
  }

  /* 按钮 */
  .btn-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    gap: 12px;
  }

  .btn {
    padding: 12px 28px;
    border-radius: 30px;
    border: none;
    font-size: 1em;
    font-family: inherit;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: bold;
  }

  .btn-prev {
    background: #F5F0E8;
    color: #8B7355;
  }
  .btn-prev:hover {
    background: #E8D5C4;
  }

  .btn-next {
    background: var(--red);
    color: #fff;
    flex: 1;
    max-width: 240px;
    position: relative;
    overflow: hidden;
  }
  .btn-next:hover {
    background: var(--dark-red);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px var(--shadow);
  }
  .btn-next:active {
    transform: translateY(0);
  }

  .btn-finish {
    background: var(--gold);
    color: #fff;
    flex: 1;
    max-width: 240px;
  }
  .btn-finish:hover {
    background: #B8922E;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(212,168,67,0.4);
  }

  /* 完成页 */
  .finish-section {
    display: none;
    text-align: center;
    padding: 50px 20px;
  }
  .finish-section.show {
    display: block;
    animation: fadeSlideIn 0.6s ease;
  }

  .finish-icon {
    font-size: 80px;
    display: block;
    margin-bottom: 16px;
    animation: bounce 0.8s ease infinite;
  }

  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-16px); }
  }

  .finish-section h2 {
    font-size: 2em;
    color: var(--red);
    letter-spacing: 4px;
    margin-bottom: 10px;
  }

  .finish-section .finish-desc {
    color: #5D4037;
    line-height: 2;
    margin: 16px 0 24px;
  }

  .share-btns {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .share-btn {
    padding: 10px 24px;
    border-radius: 24px;
    border: 2px solid var(--red);
    background: #fff;
    color: var(--red);
    cursor: pointer;
    font-family: inherit;
    font-size: 0.95em;
    letter-spacing: 1px;
    transition: all 0.3s;
  }
  .share-btn:hover {
    background: var(--red);
    color: #fff;
  }

  /* 工具清单表格 */
  .tool-table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
  }
  .tool-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #F0E8D8;
  }
  .tool-table td:first-child {
    font-weight: bold;
    color: var(--dark-red);
    width: 30%;
  }

  /* 响应式 */
  @media (max-width: 600px) {
    .header h1 { font-size: 1.5em; }
    .step-card { padding: 24px 18px; }
    .step-card h2 { font-size: 1.3em; }
    .progress-dot { width: 32px; height: 32px; font-size: 12px; }
    .progress-line { width: 24px; }
    .canvas-container { min-height: 200px; }
    .btn-row { flex-direction: column-reverse; }
    .btn-next, .btn-finish, .btn-prev { max-width: 100%; width: 100%; }
  }
</style>
</head>
<body>

<div class="header">
  <span class="title-icon">🏮</span>
  <h1>非遗福结制作</h1>
  <p class="subtitle">分步交互引导 · 传承指尖上的中国技艺</p>
</div>

<div class="main-container">

  <!-- 进度条 -->
  <div class="progress-wrapper" id="progressBar">
    <!-- JS 动态生成 -->
  </div>

  <!-- 步骤卡片容器 -->
  <div id="stepContainer">
    <!-- 步骤由 JS 动态渲染 -->
  </div>

  <!-- 完成页 -->
  <div class="finish-section" id="finishSection">
    <span class="finish-icon">🧧</span>
    <h2>福结已成！</h2>
    <p class="finish-desc">
      恭喜你完成了一个精美的非遗福结！<br>
      每一个结都承载着祝福与祈愿——<br>
      如意、平安、团圆、吉祥。<br><br>
      非遗技艺，因你的参与而传承。
    </p>
    <div class="share-btns">
      <button class="share-btn" onclick="resetGuide()">🔁 再做一个</button>
      <button class="share-btn" onclick="alert('感谢传播非遗文化！')">📤 分享作品</button>
    </div>
  </div>

</div>

<script>
// ============ 步骤数据 ============
const steps = [
  {
    id: 1,
    title: "认识福结",
    subtitle: "了解非遗福结文化",
    desc: "福结，又称中国结，始于上古结绳记事，兴于唐宋，盛于明清。它不仅是装饰，更是中华民族智慧的结晶——每一个结都蕴含吉祥寓意：<b>如意结</b>代表万事如意，<b>盘长结</b>象征长久永恒，<b>双钱结</b>寓意财源广进。今天我们来学习制作一个经典福结。",
    tip: "福结的核心是「一根绳贯穿始终」，象征生命的连绵不绝。",
    draw: (ctx, w, h) => drawIntro(ctx, w, h)
  },
  {
    id: 2,
    title: "准备材料",
    subtitle: "准备编结所需工具",
    desc: "制作福结需要以下材料和工具，请提前准备好：",
    tip: "初学者建议用 5 号中国结线（直径约 2.5mm），柔软适中，容易上手。",
    tools: [
      { name: "中国结线", note: "红色 5 号线，约 1.5 米" },
      { name: "剪刀", note: "锋利即可，用于修剪线头" },
      { name: "打火机", note: "用于烧结线头防止散开" },
      { name: "珠针/定位针", note: "固定结体用（初学可选）" },
      { name: "泡沫垫板", note: "配合珠针使用（初学可选）" }
    ],
    draw: (ctx, w, h) => drawTools(ctx, w, h)
  },
  {
    id: 3,
    title: "对折起线",
    subtitle: "打好基础",
    desc: "将红线对折，找到中点。用拇指和食指捏住中点，形成一个环。这是福结的<b>起始点</b>，也是最终挂绳的位置。两端自然下垂，整理平整。",
    tip: "对折时注意保持线的平整，不要有扭结或缠绕。",
    draw: (ctx, w, h) => drawStepHalf(ctx, w, h)
  },
  {
    id: 4,
    title: "右线压左",
    subtitle: "形成第一道交叉",
    desc: "将右侧的线向左弯折，压在左侧线上方，形成一个横向的环（称为「右耳」）。注意环的大小大约占线长的 1/4，要保持环的弧度自然流畅。",
    tip: "这一步是「压」——右线在上，左线在下。保持环的弧度均匀。",
    draw: (ctx, w, h) => drawStepCross(ctx, w, h, 1)
  },
  {
    id: 5,
    title: "左线穿环",
    subtitle: "挑一压一，穿入右耳",
    desc: "将左侧的线从右耳环的<b>下方穿过</b>，再从上方绕回。这一步是福结的关键技法——「挑一压一」：线从环下穿过（挑），再压到环上。",
    tip: "口诀：「挑一压一」，即从环下方穿过，再压回上方。这是中国结最基本的编法。",
    draw: (ctx, w, h) => drawStepThread(ctx, w, h)
  },
  {
    id: 6,
    title: "收紧整理",
    subtitle: "调整结体形状",
    desc: "两手分别捏住两侧线头，缓缓均匀用力拉紧。同时用指尖调整每个环的大小和位置，使结体<b>对称美观</b>。不要一次拉太紧，分 2-3 次逐步调整。",
    tip: "收紧时力度要均匀，边拉边调整。好的福结讲究「松紧有度、环环相扣」。",
    draw: (ctx, w, h) => drawStepTighten(ctx, w, h)
  },
  {
    id: 7,
    title: "收尾定型",
    subtitle: "完成福结制作",
    desc: "修整多余线头，在尾端打一个简单的<b>双联结</b>加固。最后调整整体形状，确保左右对称。一个完整的福结就做好了！可以配上流苏或挂绳，作为挂饰或赠礼。",
    tip: "福结成后，喷少量发胶可以定型保持更久。送给亲友时，别忘了附上吉祥祝福！",
    draw: (ctx, w, h) => drawFinal(ctx, w, h)
  }
];

// ============ 状态 ============
let currentStep = 0;
let canvasCache = {};

// ============ 渲染进度条 ============
function renderProgress() {
  const bar = document.getElementById('progressBar');
  let html = '';
  steps.forEach((s, i) => {
    let cls = '';
    if (i < currentStep) cls = 'done';
    if (i === currentStep) cls = 'active';
    html += `<div class="progress-step">`;
    html += `<div class="progress-dot ${cls}">${cls === 'done' ? '✓' : s.id}</div>`;
    html += i < steps.length - 1
      ? `<div class="progress-line ${i < currentStep ? 'done' : ''}"></div>`
      : '';
    html += `</div>`;
  });
  bar.innerHTML = html;
}

// ============ 渲染步骤卡片 ============
function renderStepCard(index) {
  const container = document.getElementById('stepContainer');
  const s = steps[index];

  let toolsHTML = '';
  if (s.tools) {
    toolsHTML = `<table class="tool-table">${s.tools.map(t =>
      `<tr><td>${t.name}</td><td>${t.note}</td></tr>`
    ).join('')}</table>`;
  }

  const html = `
    <div class="step-card active-step" id="stepCard${s.id}">
      <span class="step-number">第 ${s.id} 步 / 共 ${steps.length} 步</span>
      <h2>${s.title}</h2>
      <p class="desc">${s.desc}</p>
      ${toolsHTML}
      <div class="canvas-container">
        <canvas id="stepCanvas" width="480" height="280"></canvas>
      </div>
      <div class="tip-box">
        <span class="tip-icon">💡</span> ${s.tip}
      </div>
      <div class="btn-row">
        <button class="btn btn-prev" onclick="prevStep()" ${index === 0 ? 'style="visibility:hidden"' : ''}>
          ← 上一步
        </button>
        ${index < steps.length - 1
          ? `<button class="btn btn-next" onclick="nextStep()">下一步 →</button>`
          : `<button class="btn btn-finish" onclick="finishGuide()">✨ 完成福结</button>`
        }
      </div>
    </div>
  `;

  container.innerHTML = html;

  // 延迟绘制 canvas（等 DOM 渲染完成）
  setTimeout(() => {
    const canvas = document.getElementById('stepCanvas');
    if (canvas && steps[index].draw) {
      const w = canvas.width;
      const h = canvas.height;
      const ctx = canvas.getContext('2d');
      // 根据容器大小自适应缩放
      const container = canvas.parentElement;
      const maxW = container.clientWidth - 16;
      if (maxW < w) {
        const scale = maxW / w;
        canvas.style.width = maxW + 'px';
        canvas.style.height = (h * scale) + 'px';
      }
      steps[index].draw(ctx, w, h);
    }
  }, 50);
}

// ============ 步骤跳转 ============
function nextStep() {
  if (currentStep < steps.length - 1) {
    currentStep++;
    renderProgress();
    renderStepCard(currentStep);
    scrollToCard();
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    renderProgress();
    renderStepCard(currentStep);
    scrollToCard();
  }
}

function finishGuide() {
  document.getElementById('stepContainer').innerHTML = '';
  document.getElementById('finishSection').classList.add('show');
  // 进度条所有都 done
  const dots = document.querySelectorAll('.progress-dot');
  dots.forEach(d => { d.className = 'progress-dot done'; d.textContent = '✓'; });
  const lines = document.querySelectorAll('.progress-line');
  lines.forEach(l => l.classList.add('done'));
  scrollToCard();
}

function resetGuide() {
  currentStep = 0;
  document.getElementById('finishSection').classList.remove('show');
  renderProgress();
  renderStepCard(currentStep);
  scrollToCard();
}

function scrollToCard() {
  setTimeout(() => {
    const card = document.querySelector('.step-card.active-step') || document.getElementById('finishSection');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

// ============ Canvas 绘图函数 ============

// 通用颜色
const redLine = '#C41E3A';
const redDark = '#8B0000';
const goldC = '#D4A843';
const bgCanvas = '#FDF8F2';

function drawIntro(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);

  // 画一个完整的福结示意
  const cx = w / 2, cy = h / 2;

  // 上环
  ctx.strokeStyle = redLine;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // 顶部挂绳
  ctx.beginPath();
  ctx.moveTo(cx, 30);
  ctx.lineTo(cx, 70);
  ctx.stroke();

  // 菱形结构 - 上部分
  ctx.beginPath();
  ctx.moveTo(cx, 70);
  ctx.lineTo(cx - 50, 120);
  ctx.lineTo(cx, 170);
  ctx.lineTo(cx + 50, 120);
  ctx.closePath();
  ctx.stroke();

  // 下部分
  ctx.beginPath();
  ctx.moveTo(cx, 170);
  ctx.lineTo(cx - 40, 200);
  ctx.lineTo(cx, 230);
  ctx.lineTo(cx + 40, 200);
  ctx.closePath();
  ctx.stroke();

  // 底部装饰 - 流苏
  ctx.strokeStyle = goldC;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, 230);
  ctx.lineTo(cx, 270);
  ctx.stroke();

  // 流苏须
  for (let i = -15; i <= 15; i += 5) {
    ctx.beginPath();
    ctx.moveTo(cx, 260);
    ctx.lineTo(cx + i, 275);
    ctx.strokeStyle = `rgba(212,168,67,${0.4 + Math.abs(i) * 0.02})`;
    ctx.stroke();
  }

  // 旁注文字
  ctx.fillStyle = '#8B7355';
  ctx.font = '15px "Noto Serif SC", "SimSun", serif';
  ctx.textAlign = 'center';
  ctx.fillText('如意福结', cx, 40);
  ctx.fillText('吉祥平安', cx, 210);

  // 两侧祥云装饰
  drawCloud(ctx, cx - 100, 95, 0.6);
  drawCloud(ctx, cx + 100, 95, 0.6, true);
}

function drawCloud(ctx, x, y, scale, flip) {
  ctx.save();
  ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(212,168,67,0.3)';
  ctx.beginPath();
  ctx.arc(0, 0, 24, 0, Math.PI * 2);
  ctx.arc(24, -10, 18, 0, Math.PI * 2);
  ctx.arc(40, 5, 16, 0, Math.PI * 2);
  ctx.arc(16, 14, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawTools(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);

  const items = [
    { icon: '━', label: '中国结线', x: 60, y: 100, color: redLine },
    { icon: '✂', label: '剪刀', x: 160, y: 70, color: '#555' },
    { icon: '🔥', label: '打火机', x: 280, y: 70, color: '#E67E22' },
    { icon: '📌', label: '珠针', x: 380, y: 100, color: goldC },
    { icon: '▢', label: '垫板', x: 420, y: 170, color: '#8B7355' },
  ];

  items.forEach(item => {
    // 图标
    ctx.fillStyle = item.color;
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(item.icon, item.x, item.y);
    // 标签
    ctx.fillStyle = '#3D2B1F';
    ctx.font = '13px "Noto Serif SC", "SimSun", serif';
    ctx.fillText(item.label, item.x, item.y + 32);
  });

  // 线圈示意
  ctx.strokeStyle = redLine;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(60, 170, 30, 12, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(60, 170, 28, 10, 0, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(196,30,58,0.3)';
  ctx.stroke();

  ctx.fillStyle = '#555';
  ctx.font = '12px "Noto Serif SC", "SimSun", serif';
  ctx.textAlign = 'center';
  ctx.fillText('（线卷）', 60, 198);
}

function drawStepHalf(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2, topY = 40;

  // 手指示意点
  ctx.fillStyle = '#F5D5C5';
  ctx.beginPath();
  ctx.arc(cx - 22, 110, 16, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#E8BFA0';
  ctx.beginPath();
  ctx.arc(cx + 22, 110, 16, 0, Math.PI * 2);
  ctx.fill();

  // 上半段线（对折处）
  ctx.strokeStyle = redLine;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';

  // 对折环
  ctx.beginPath();
  ctx.moveTo(cx, topY);
  ctx.quadraticCurveTo(cx, 90, cx, 130);
  ctx.stroke();

  // 标记中点
  ctx.fillStyle = goldC;
  ctx.beginPath();
  ctx.arc(cx, 110, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('中', cx, 113);

  // 下垂两线
  ctx.beginPath();
  ctx.moveTo(cx, 130);
  ctx.lineTo(cx - 30, 210);
  ctx.strokeStyle = redLine;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx, 130);
  ctx.lineTo(cx + 30, 210);
  ctx.stroke();

  // 箭头标注
  ctx.fillStyle = '#8B7355';
  ctx.font = '13px "Noto Serif SC", "SimSun", serif';
  ctx.textAlign = 'center';
  ctx.fillText('右线', cx + 55, 170);
  ctx.fillText('左线', cx - 55, 170);

  // 小箭头
  ctx.strokeStyle = '#8B7355';
  ctx.lineWidth = 1.5;
  drawArrow(ctx, cx + 40, 162, cx + 48, 162);
  drawArrow(ctx, cx - 40, 162, cx - 48, 162, true);
}

function drawArrow(ctx, x1, y1, x2, y2, left) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  const dir = left ? -1 : 1;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - dir * 4, y2 - 3);
  ctx.lineTo(x2 - dir * 4, y2 + 3);
  ctx.fillStyle = '#8B7355';
  ctx.fill();
}

function drawStepCross(ctx, w, h, phase) {
  ctx.clearRect(0, 0, w, h);
  const cx = w / 2;

  // 左线
  ctx.strokeStyle = redLine;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';

  // 左线垂直
  ctx.beginPath();
  ctx.moveTo(cx - 40, 40);
  ctx.lineTo(cx - 40, 200);
  ctx.stroke();

  // 右线弯折（压左），形成环
  ctx.strokeStyle = '#D44';
  ctx.beginPath();
  ctx.moveTo(cx + 40, 40);
  ctx.lineTo(cx + 40, 100);
  // 弯折压过左线
  ctx.lineTo(cx - 40, 100);  // 横压
  ctx.lineTo(cx - 40, 140);  // 向下
  ctx.stroke();

  // 标注"右耳"
  ctx.fillStyle = goldC;
  ctx.font = '13px "Noto Serif SC", "SimSun", serif';
  ctx.textAlign = 'center';
  ctx.fillText('右耳（环）', cx + 80, 90);

  // 标记交叉点
  ctx.fillStyle = goldC;
  ctx.beginPath();
  ctx.arc(cx - 40, 100, 5, 0, Math.PI * 2);
  ctx.fill();

  // 虚线表示环的形状
  ctx.strokeStyle = 'rgba(212,168,67,0.4)';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.arc(cx - 5, 90, 45, 0.3, 1.9);
  ctx.stroke();
  ctx.setLineDash([]);

  // 文字
  ctx.fillStyle = '#8B7355';
  ctx.font = '14px "Noto Serif SC", "SimSun", serif';
  ctx.textAlign = 'center';
  ctx.fillText('右线压左', cx + 60, 130);
  ctx.fillText('↑ 压 ↑', cx - 50, 85);

  // 左线标签
  ctx.fillStyle = redLine;
  ctx.fillText('左线', cx - 75, 120);
  ctx.fillStyle = '#D44';
  ctx.fillText('右线', cx + 75, 60);
}

function drawStepThread(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);
  const cx = w / 2;

  ctx.lineWidth = 4;
  ctx.lineCap = 'round';

  // 环（右耳）- 浅色表示已经做好
  ctx.strokeStyle = 'rgba(196,30,58,0.5)';
  ctx.beginPath();
  ctx.moveTo(cx + 40, 50);
  ctx.lineTo(cx + 40, 110);
  ctx.lineTo(cx - 40, 110);
  ctx.lineTo(cx - 40, 150);
  ctx.stroke();

  // 左线穿环 - 高亮显示当前操作
  ctx.strokeStyle = '#D44';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(cx - 60, 50);
  ctx.lineTo(cx - 60, 100);
  // 从环下方穿过
  ctx.lineTo(cx + 15, 100);
  // 从上方绕回
  ctx.lineTo(cx + 15, 130);
  ctx.lineTo(cx - 10, 130);
  ctx.stroke();

  // 突出显示穿环位置
  ctx.fillStyle = goldC;
  ctx.beginPath();
  ctx.arc(cx + 15, 100, 6, 0, Math.PI * 2);
  ctx.fill();

  // 标记"挑"和"压"
  ctx.fillStyle = '#8B7355';
  ctx.font = 'bold 14px "Noto Serif SC", "SimSun", serif';
  ctx.textAlign = 'center';
  ctx.fillText('挑（从下穿过）', cx + 65, 95);
  ctx.fillText('压（绕回上方）', cx + 65, 135);

  // 运动箭头
  ctx.strokeStyle = goldC;
  ctx.lineWidth = 2;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(cx + 15, 95);
  ctx.lineTo(cx + 15, 135);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawStepTighten(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;

  ctx.strokeStyle = redLine;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // 收紧后的福结形态 - 偏扁平菱形
  ctx.beginPath();
  // 上挂
  ctx.moveTo(cx, 30);
  ctx.lineTo(cx, 70);
  // 上菱形
  ctx.lineTo(cx - 55, 120);
  ctx.lineTo(cx, 155);
  ctx.lineTo(cx + 55, 120);
  ctx.closePath();
  ctx.stroke();

  // 下部分
  ctx.beginPath();
  ctx.moveTo(cx, 155);
  ctx.lineTo(cx - 45, 200);
  ctx.lineTo(cx, 235);
  ctx.lineTo(cx + 45, 200);
  ctx.closePath();
  ctx.stroke();

  // 收紧箭头
  ctx.strokeStyle = goldC;
  ctx.lineWidth = 2.5;
  // 左右箭头
  drawTightArrow(ctx, cx - 70, 137, -1);
  drawTightArrow(ctx, cx + 70, 137, 1);
  // 上下箭头
  drawTightArrow(ctx, cx - 30, 85, 0, -1);
  drawTightArrow(ctx, cx + 30, 215, 0, 1);

  ctx.fillStyle = '#8B7355';
  ctx.font = '13px "Noto Serif SC", "SimSun", serif';
  ctx.textAlign = 'center';
  ctx.fillText('均匀用力', cx - 70, 160);
  ctx.fillText('均匀用力', cx + 70, 160);
  ctx.fillText('拉紧', cx - 55, 78);
  ctx.fillText('拉紧', cx + 55, 240);
}

function drawTightArrow(ctx, x, y, dirX, dirY) {
  ctx.beginPath();
  const len = 20;
  const ex = x + dirX * len;
  const ey = y + (dirY || 0) * len;
  ctx.moveTo(x, y);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  // 箭头
  ctx.fillStyle = goldC;
  ctx.beginPath();
  if (dirX !== 0) {
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - dirX * 6, ey - 4);
    ctx.lineTo(ex - dirX * 6, ey + 4);
  } else {
    ctx.moveTo(ex, ey);
    ctx.lineTo(ex - 4, ey - dirY * 6);
    ctx.lineTo(ex + 4, ey - dirY * 6);
  }
  ctx.fill();
}

function drawFinal(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2;

  // 完整精美的福结
  ctx.shadowColor = 'rgba(196,30,58,0.3)';
  ctx.shadowBlur = 12;

  // 挂绳
  ctx.strokeStyle = redLine;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, 10);
  ctx.lineTo(cx, 60);
  ctx.stroke();

  // 双联结
  ctx.fillStyle = redDark;
  ctx.beginPath();
  ctx.arc(cx, 65, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, 71, 5, 0, Math.PI * 2);
  ctx.fill();

  // 主体结
  ctx.strokeStyle = redLine;
  ctx.lineWidth = 4;
  ctx.lineJoin = 'round';

  ctx.beginPath();
  ctx.moveTo(cx, 78);
  ctx.lineTo(cx - 45, 110);
  ctx.lineTo(cx - 25, 140);
  ctx.lineTo(cx + 25, 140);
  ctx.lineTo(cx + 45, 110);
  ctx.closePath();
  ctx.stroke();

  // 内部装饰线
  ctx.strokeStyle = goldC;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - 30, 115);
  ctx.lineTo(cx - 15, 135);
  ctx.moveTo(cx + 15, 135);
  ctx.lineTo(cx + 30, 115);
  ctx.stroke();

  // 金珠
  ctx.fillStyle = goldC;
  ctx.shadowBlur = 8;
  ctx.shadowColor = 'rgba(212,168,67,0.5)';
  ctx.beginPath();
  ctx.arc(cx, 78, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, 110, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';

  // 下挂
  ctx.strokeStyle = redLine;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx, 140);
  ctx.lineTo(cx, 170);
  ctx.stroke();

  // 流苏
  const tasselTop = 170;
  for (let i = -14; i <= 14; i += 3.5) {
    const alpha = 0.3 + Math.abs(i) * 0.03;
    ctx.strokeStyle = `rgba(212,168,67,${alpha})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(cx, tasselTop);
    ctx.lineTo(cx + i, tasselTop + 35);
    ctx.stroke();
  }

  // 流苏头
  ctx.fillStyle = goldC;
  ctx.beginPath();
  ctx.arc(cx, tasselTop, 5, 0, Math.PI * 2);
  ctx.fill();

  // ✓ 标记
  ctx.fillStyle = '#27AE60';
  ctx.font = 'bold 36px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('✓', cx + 100, cy);

  // 底部祝福
  ctx.fillStyle = redLine;
  ctx.font = 'bold 16px "Noto Serif SC", "SimSun", serif';
  ctx.fillText('福结已成，吉祥如意', cx, 245);
}

// ============ 键盘导航 ============
document.addEventListener('keydown', (e) => {
  const finish = document.getElementById('finishSection');
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    if (finish.classList.contains('show')) return;
    nextStep();
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (finish.classList.contains('show')) {
      resetGuide();
      return;
    }
    prevStep();
  }
});

// ============ 初始化 ============
renderProgress();
renderStepCard(0);
</script>
