<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无限画布</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;width:100%;height:100%}
body{background:#f0f0f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;user-select:none;-webkit-user-select:none}

#viewport{
  width:100%;height:100%;position:relative;overflow:hidden;cursor:default;
  background:linear-gradient(160deg,#ffffff 0%,#f2f2f7 35%,#e5e5ec 70%,#d8d8e0 100%);
  background-color:#f0f0f5;
}
#viewport::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(0,0,0,.04) 1px,transparent 1px);
  background-size:var(--gs,40px) var(--gs,40px);
  background-position:var(--gpx,0px) var(--gpy,0px);
}
#canvas-layer{position:absolute;top:0;left:0;width:0;height:0;transform-origin:0 0;will-change:transform;contain:layout style;z-index:1}
#sel-overlay{position:absolute;inset:0;pointer-events:none;z-index:9998}
#box-sel-rect{position:absolute;border:1.5px dashed rgba(232,134,58,.7);background:rgba(232,134,58,.06);pointer-events:none;z-index:9997;display:none;border-radius:2px}

.sel-box{position:absolute;border:1.5px solid rgba(232,134,58,.7);pointer-events:none;box-shadow:0 0 0 1px rgba(232,134,58,.12)}
.rh{position:absolute;width:9px;height:9px;background:#fff;border:1.5px solid #e8863a;border-radius:2px;pointer-events:all;z-index:9999;transition:transform .12s ease;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.rh:hover{transform:scale(1.35);background:#fff5ec}
.rh-nw{cursor:nw-resize}.rh-ne{cursor:ne-resize}.rh-sw{cursor:sw-resize}.rh-se{cursor:se-resize}
.rh-n{cursor:n-resize}.rh-s{cursor:s-resize}.rh-w{cursor:w-resize}.rh-e{cursor:e-resize}

.ci{position:absolute;cursor:default}
.ci-img{border-radius:4px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.12)}
.ci-img img{width:100%;height:100%;display:block;pointer-events:none;object-fit:fill}
.ci-txt{
  min-width:30px;min-height:1.4em;outline:none;
  white-space:pre-wrap;word-break:break-word;line-height:1.45;
  padding:4px 8px;border-radius:3px;
  border:1.5px solid transparent;
  transition:border-color .15s,background .15s,box-shadow .15s;
}
.ci-txt.editing{
  border-color:rgba(232,134,58,.35);
  background:rgba(255,160,60,.03);
  cursor:text;user-select:text;-webkit-user-select:text;
  box-shadow:0 0 0 3px rgba(232,134,58,.08);
}
.ci-txt:not(.editing):hover{border-color:rgba(232,134,58,.15)}

.glass{
  background:linear-gradient(135deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,.22) 40%,rgba(255,245,232,.18) 100%);
  backdrop-filter:blur(48px) saturate(220%) brightness(1.15);
  -webkit-backdrop-filter:blur(48px) saturate(220%) brightness(1.15);
  border:1px solid rgba(255,255,255,.45);
  box-shadow:0 0 28px rgba(255,160,60,.1),0 8px 32px rgba(0,0,0,.04),inset 0 1.5px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(0,0,0,.015);
}
.toolbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:16px;z-index:10001;color:rgba(30,30,30,.82);font-size:11.5px;letter-spacing:.01em}
.toolbar .sep{width:1px;height:20px;background:rgba(0,0,0,.06);flex-shrink:0}
.toolbar button{background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.18));border:1px solid rgba(255,255,255,.4);color:rgba(30,30,30,.8);padding:5px 9px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:500;transition:background .2s ease,box-shadow .2s ease,transform .15s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;font-family:inherit;box-shadow:0 1px 6px rgba(0,0,0,.03),inset 0 1px 0 rgba(255,255,255,.6)}
.toolbar button:hover{background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.3));border-color:rgba(255,255,255,.55);transform:scale(1.05);box-shadow:0 3px 14px rgba(255,160,60,.1),0 1px 4px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.7)}
.toolbar button:active{transform:scale(.95);background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.12));box-shadow:0 0 4px rgba(0,0,0,.03),inset 0 1px 0 rgba(255,255,255,.4);transition-duration:.08s}
.toolbar button.active{background:linear-gradient(135deg,rgba(255,170,80,.3),rgba(255,130,50,.18));border-color:rgba(255,160,60,.45);color:rgba(30,30,30,.9);box-shadow:0 0 16px rgba(255,160,60,.15),inset 0 1px 0 rgba(255,255,255,.45)}
.toolbar label{display:flex;align-items:center;gap:3px;color:rgba(60,60,60,.6);font-size:10.5px}
.toolbar input[type=range]{width:68px;accent-color:#e8863a;height:3px;cursor:pointer}
.sz-v{min-width:20px;text-align:center;color:rgba(30,30,30,.78);font-variant-numeric:tabular-nums;font-size:10.5px}
.cdot{width:17px;height:17px;border-radius:50%;border:2px solid rgba(255,255,255,.45);cursor:pointer;padding:0;transition:background .2s ease,border-color .2s ease,box-shadow .2s ease,transform .15s cubic-bezier(.34,1.56,.64,1);flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.05),inset 0 1px 0 rgba(255,255,255,.5)}
.cdot:hover{border-color:rgba(255,255,255,.75);transform:scale(1.15);box-shadow:0 2px 10px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.6)}
.cdot:active{transform:scale(.9);transition-duration:.08s}
.cdot.active{border-color:#e8863a;box-shadow:0 0 0 2px rgba(232,134,58,.35),0 0 10px rgba(255,160,60,.15)}

.mode-badge{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:10px;color:rgba(30,30,30,.78);font-size:11.5px;z-index:10001;display:none;letter-spacing:.01em}
.zoom-badge{position:fixed;bottom:26px;right:22px;padding:4px 10px;border-radius:8px;color:rgba(60,60,60,.6);font-size:10.5px;z-index:10001;font-variant-numeric:tabular-nums}
.shortcuts-panel{position:fixed;bottom:16px;left:16px;padding:7px 10px;border-radius:10px;z-index:10001;font-size:9px;line-height:1.7;color:rgba(60,60,60,.45);max-width:180px}
.shortcuts-panel .sk-row{display:flex;align-items:center;gap:5px;white-space:nowrap}
.shortcuts-panel .sk-key{display:inline-block;padding:0 4px;border-radius:3px;font-size:8px;background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.18));border:1px solid rgba(255,255,255,.35);color:rgba(30,30,30,.55);font-family:inherit;letter-spacing:.02em;box-shadow:0 1px 2px rgba(0,0,0,.03),inset 0 .5px 0 rgba(255,255,255,.5)}
.shortcuts-panel .sk-desc{color:rgba(60,60,60,.4);font-size:8.5px}
.drop-zone{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;pointer-events:none;background:rgba(232,134,58,.04);border:2.5px dashed rgba(232,134,58,.3)}
.drop-zone.show{display:flex}
.drop-zone span{color:rgba(30,30,30,.65);font-size:16px;background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.22));backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:16px 32px;border-radius:14px;border:1px solid rgba(255,255,255,.4);box-shadow:0 0 20px rgba(255,160,60,.1),0 8px 30px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.6)}
.export-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:12px 24px;border-radius:12px;color:rgba(30,30,30,.8);font-size:13px;z-index:10002;display:none}
.loading-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:12px 24px;border-radius:12px;color:rgba(30,30,30,.8);font-size:13px;z-index:10002;display:none}
</style>
</head>
<body>

<div id="viewport">
  <div id="canvas-layer"></div>
  <div id="sel-overlay"></div>
  <div id="box-sel-rect"></div>
</div>

<div class="toolbar glass" id="toolbar">
  <button id="btn-file" title="添加文件">+ 文件</button>
  <div class="sep"></div>
  <button id="btn-txt" title="文字模式 (T)">T 文字</button>
  <div class="sep"></div>
  <label>大小 <input type="range" id="rng-sz" min="12" max="128" value="28"><span class="sz-v" id="sz-v">28</span></label>
  <div class="sep"></div>
  <button class="cdot" data-c="#000000" style="background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)"></button>
  <button class="cdot" data-c="#ffffff" style="background:#fff"></button>
  <button class="cdot" data-c="#ff3b30" style="background:#ff3b30"></button>
  <button class="cdot" data-c="#007aff" style="background:#007aff"></button>
  <button class="cdot" data-c="#34c759" style="background:#34c759"></button>
  <div class="sep"></div>
  <button id="btn-b" title="粗体" style="font-weight:900"><b>加</b> 粗</button>
  <div class="sep"></div>
  <button id="btn-exp" title="导出PNG">⤓ 导出</button>
</div>

<div class="mode-badge glass" id="mode-badge">文字模式 — 点击画布放置文字 &nbsp;|&nbsp; ESC 退出</div>
<div class="zoom-badge glass" id="zoom-badge">100%</div>
<div class="shortcuts-panel glass" id="shortcuts-panel">
  <div class="sk-row"><span class="sk-key">T</span><span class="sk-desc">添加文字</span></div>
  <div class="sk-row"><span class="sk-key">Ctrl+拖动</span><span class="sk-desc">移动元素</span></div>
  <div class="sk-row"><span class="sk-key">Ctrl+滚轮</span><span class="sk-desc">缩放画布</span></div>
  <div class="sk-row"><span class="sk-key">Space+拖动</span><span class="sk-desc">平移画布</span></div>
  <div class="sk-row"><span class="sk-key">Shift+拖动</span><span class="sk-desc">框选多个</span></div>
  <div class="sk-row"><span class="sk-key">Del</span><span class="sk-desc">删除选中</span></div>
  <div class="sk-row"><span class="sk-key">Esc</span><span class="sk-desc">取消选择</span></div>
</div>
<div class="drop-zone" id="drop-zone"><span>释放以添加文件</span></div>
<div class="export-toast glass" id="export-toast">正在导出…</div>
<div class="loading-toast glass" id="loading-toast">正在渲染文件…</div>
<input type="file" id="file-in" multiple accept="image/*,.pdf,.docx,.doc,.pptx,.ppt,.psd,.txt" style="display:none">

<script>
(function(){
'use strict';

const S={
  scale:1,ox:0,oy:0,
  items:[],nid:1,nzi:1,
  selIds:new Set(),
  textMode:false,
  spaceDown:false,ctrlDown:false,shiftDown:false,
  panning:false,dragging:false,resizing:false,
  panSX:0,panSY:0,panSOX:0,panSOY:0,
  dragSX:0,dragSY:0,dragStarts:null,
  rDir:'',rSX:0,rSY:0,rRect:null,
  boxSel:false,boxSX:0,boxSY:0,
  fontSize:28,fontColor:'#000000',fontBold:false,
  rafPending:false
};

const $=id=>document.getElementById(id);
const vp=$('viewport'),cl=$('canvas-layer'),so=$('sel-overlay'),bsr=$('box-sel-rect');
const mb=$('mode-badge'),zb=$('zoom-badge'),dz=$('drop-zone'),et=$('export-toast'),lt=$('loading-toast'),fi=$('file-in');
const btnTxt=$('btn-txt'),btnB=$('btn-b'),btnExp=$('btn-exp'),btnFile=$('btn-file');
const rngSz=$('rng-sz'),szV=$('sz-v');
const cdots=document.querySelectorAll('.cdot');

const _lc={};
function loadScript(url){
  if(_lc[url])return Promise.resolve();
  return new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=url;
    s.onload=()=>{_lc[url]=1;res()};s.onerror=()=>rej(new Error('Load fail: '+url));
    document.head.appendChild(s);
  });
}

function s2w(sx,sy){return{x:(sx-S.ox)/S.scale,y:(sy-S.oy)/S.scale}}
function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v}
function isEditing(){return document.activeElement&&document.activeElement.classList.contains('editing')}

function scheduleUpd(){
  if(S.rafPending)return;S.rafPending=true;
  requestAnimationFrame(()=>{applyTf();updBg();updSelOv();S.rafPending=false});
}
function applyTf(){
  cl.style.transform='translate3d('+S.ox+'px,'+S.oy+'px,0) scale('+S.scale+')';
  zb.textContent=Math.round(S.scale*100)+'%';
}
function updBg(){
  const sz=40*S.scale;
  const px=((S.ox%sz)+sz)%sz,py=((S.oy%sz)+sz)%sz;
  vp.style.setProperty('--gs',sz+'px');vp.style.setProperty('--gpx',px+'px');vp.style.setProperty('--gpy',py+'px');
}

// ═══════ Items ═══════
function mkItem(type,x,y,w,h,extra){
  const id=S.nid++;
  const el=document.createElement('div');
  el.className='ci ci-'+(type==='image'?'img':'txt');
  el.dataset.id=id;
  el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';el.style.height=h+'px';
  el.style.zIndex=S.nzi++;
  const item={id,type,x,y,width:w,height:h,el,...extra};
  S.items.push(item);cl.appendChild(el);return item;
}
function getIt(id){return S.items.find(i=>i.id===id)}
function itByEl(el){const e=el&&el.closest('.ci');if(!e)return null;return getIt(+e.dataset.id)}
function rmItem(id){
  const i=S.items.findIndex(it=>it.id===id);if(i<0)return;
  S.items[i].el.remove();S.items.splice(i,1);S.selIds.delete(id);updSelOv();
}
function rmSelItems(){
  const ids=[...S.selIds];S.selIds.clear();
  ids.forEach(id=>{const i=S.items.findIndex(it=>it.id===id);if(i>=0){S.items[i].el.remove();S.items.splice(i,1)}});
  clrSelOv();
}

// ═══════ Selection ═══════
function selItem(id,additive){
  if(!additive){
    S.selIds.forEach(sid=>{const it=getIt(sid);if(it&&it.type==='text'&&it.el.classList.contains('editing'))stopEdit(it)});
    S.selIds.clear();
  }
  if(id!=null){S.selIds.add(id);const it=getIt(id);if(it)it.el.style.zIndex=S.nzi++}
  updSelOv();
  if(id!=null){const it=getIt(id);if(it)syncTb(it)}
}
function desel(){
  S.selIds.forEach(sid=>{const it=getIt(sid);if(it&&it.type==='text'&&it.el.classList.contains('editing'))stopEdit(it)});
  S.selIds.clear();clrSelOv();
}
function syncTb(it){
  if(it.type==='text'){
    S.fontSize=it.fontSize||28;S.fontColor=it.color||'#000000';S.fontBold=!!it.bold;
    rngSz.value=S.fontSize;szV.textContent=S.fontSize;syncCdots();syncBbtn();
  }
}

// ═══════ Selection Overlay ═══════
function clrSelOv(){so.innerHTML=''}
function updSelOv(){
  clrSelOv();if(S.selIds.size===0)return;const hs=9;
  S.selIds.forEach(id=>{
    const it=getIt(id);if(!it)return;
    const sx=it.x*S.scale+S.ox,sy=it.y*S.scale+S.oy,sw=it.width*S.scale,sh=it.height*S.scale;
    const box=document.createElement('div');box.className='sel-box';
    box.style.cssText='left:'+sx+'px;top:'+sy+'px;width:'+sw+'px;height:'+sh+'px';
    so.appendChild(box);
    if(S.selIds.size===1){
      [['nw',sx-hs/2,sy-hs/2],['ne',sx+sw-hs/2,sy-hs/2],['sw',sx-hs/2,sy+sh-hs/2],['se',sx+sw-hs/2,sy+sh-hs/2],
       ['n',sx+sw/2-hs/2,sy-hs/2],['s',sx+sw/2-hs/2,sy+sh-hs/2],['w',sx-hs/2,sy+sh/2-hs/2],['e',sx+sw-hs/2,sy+sh/2-hs/2]]
      .forEach(([d,hx,hy])=>{const h=document.createElement('div');h.className='rh rh-'+d;h.style.cssText='left:'+hx+'px;top:'+hy+'px;width:'+hs+'px;height:'+hs+'px';h.dataset.dir=d;so.appendChild(h)});
    }
  });
}

// ═══════ Text ═══════
function addText(wx,wy){
  const initH=S.fontSize*1.45+10;
  const it=mkItem('text',wx,wy,240,initH);
  it.el.style.fontSize=S.fontSize+'px';it.el.style.color=S.fontColor;
  it.el.style.fontWeight=S.fontBold?'bold':'normal';
  it.el.style.fontFamily='-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
  it.fontSize=S.fontSize;it.color=S.fontColor;it.bold=S.fontBold;
  it.el.textContent='';
  selItem(it.id);
  // Use setTimeout to ensure focus after DOM updates from selItem/updSelOv
  setTimeout(()=>startEdit(it),0);
  return it;
}
function startEdit(it){
  it.el.contentEditable='true';it.el.classList.add('editing');it.el.focus();
  try{const r=document.createRange();r.selectNodeContents(it.el);r.collapse(false);const s=window.getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}
}
function stopEdit(it){
  it.el.contentEditable='false';it.el.classList.remove('editing');
  if((it.el.innerText||'').trim()===''){rmItem(it.id);return}autoH(it);
}
function autoH(it){
  it.el.style.height='auto';
  const h=Math.max(it.el.scrollHeight,parseFloat(it.el.style.fontSize||28)*1.45+10);
  it.el.style.height=h+'px';it.height=h;updSelOv();
}

// ═══════ Images ═══════
function addImg(src,nw,nh){
  const gap=24,maxW=500;let w=Math.min(nw,maxW),h=nh*(w/nw);let cx,sy;
  if(_dropPos){cx=_dropPos.x-w/2;sy=_dropPos.y;_dropPos.y+=h+gap}
  else{const c=s2w(window.innerWidth/2,window.innerHeight/2);cx=c.x-w/2;sy=c.y-h/2}
  const it=mkItem('image',cx,sy,w,h);
  const img=document.createElement('img');img.src=src;img.draggable=false;
  it.el.appendChild(img);it.imgSrc=src;it.natW=nw;it.natH=nh;return it;
}

// ═══════ File Processing ═══════
let _dropPos=null; // {x,y} in world coords, or null
let _lastMouseWorld={x:0,y:0}; // track mouse for paste positioning

function getExt(name){return(name||'').split('.').pop().toLowerCase()}

function loadFiles(files,screenX,screenY){
  // Each batch captures its own position — no shared state pollution
  let batchPos=null;
  if(screenX!==undefined&&screenY!==undefined){
    const w=s2w(screenX,screenY);batchPos={x:w.x,y:w.y};
  }
  const arr=Array.from(files);
  (async()=>{
    for(const f of arr){
      _dropPos=batchPos; // set before each file
      await processFile(f);
      if(batchPos)batchPos=_dropPos; // capture updated position after
    }
    _dropPos=null;
  })();
}

async function processFile(file){
  const ext=getExt(file.name);const ab=await file.arrayBuffer();
  try{
    if(ext==='pdf')await renderPDF(ab);
    else if(ext==='docx'||ext==='doc')await renderDOCX(ab);
    else if(ext==='psd')await renderPSD(ab);
    else if(ext==='pptx'||ext==='ppt')await renderPPTX(ab);
    else if(ext==='txt')await renderTXT(file);
    else if(file.type.startsWith('image/'))await renderImage(file);
  }catch(err){console.error('File render error:',err)}
}

function renderImage(file){
  return new Promise(res=>{const rd=new FileReader();rd.onload=e=>{const im=new Image();im.onload=()=>{addImg(e.target.result,im.naturalWidth,im.naturalHeight);res()};im.onerror=res;im.src=e.target.result};rd.readAsDataURL(file)});
}

async function renderTXT(file){
  const text=await file.text();
  const lines=text.split('\n');
  const fs=16,lh=fs*1.6,pad=40,width=794;
  const totalH=Math.max(pad*2+lines.length*lh,200);
  const cvs=document.createElement('canvas');cvs.width=width*2;cvs.height=totalH*2;
  const ctx=cvs.getContext('2d');ctx.scale(2,2);
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,width,totalH);
  ctx.font=fs+'px monospace';ctx.fillStyle='#000000';ctx.textBaseline='top';
  let y=pad;
  for(const line of lines){
    if(y>totalH-pad)break;
    const chars=[...line];let cur='';
    for(const ch of chars){
      const test=cur+ch;
      if(ctx.measureText(test).width>width-pad*2&&cur!==''){ctx.fillText(cur,pad,y);cur=ch;y+=lh}
      else{cur=test}
    }
    if(cur){ctx.fillText(cur,pad,y);y+=lh}
  }
  addImg(cvs.toDataURL('image/png'),width,totalH);
}

// ═══════ PDF ═══════
async function renderPDF(ab){
  lt.style.display='block';
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(ab)}).promise;
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);const sc=2;const vp2=page.getViewport({scale:sc});
      const cvs=document.createElement('canvas');cvs.width=vp2.width;cvs.height=vp2.height;
      const ctx=cvs.getContext('2d');await page.render({canvasContext:ctx,viewport:vp2}).promise;

}

async function renderPSD(ab){
  lt.style.display='block';
  try{
    // Try thumbnail extraction first (most reliable)
    const thumb=await extractPSDThumbnailAsync(ab);
    if(thumb){addImg(thumb.url,thumb.width,thumb.height);return}
    // Fallback to composite image data
    const r=parsePSD(ab);
    if(r)addImg(r.url,r.width,r.height);
  }catch(e){
    console.error('PSD error:',e);
    const cvs=document.createElement('canvas');cvs.width=400;cvs.height=300;
    const ctx=cvs.getContext('2d');ctx.fillStyle='#f5f5f5';ctx.fillRect(0,0,400,300);
    ctx.fillStyle='#999';ctx.font='14px sans-serif';ctx.textAlign='center';
    ctx.fillText('PSD preview unavailable',200,150);
    addImg(cvs.toDataURL('image/png'),400,300);
  }
  finally{lt.style.display='none'}
}

async function extractPSDThumbnailAsync(ab){
  try{
    const v=new DataView(ab);
    let off=26;
    off+=4+v.getUint32(off); // color mode data
    const imgResLen=v.getUint32(off);off+=4;
    const imgResEnd=off+imgResLen;
    while(off<imgResEnd-12){
      // Resource block: 4-byte signature "8BIM" or "8B64"
      if(v.getUint8(off)!==0x38||v.getUint8(off+1)!==0x42||v.getUint8(off+2)!==0x49||v.getUint8(off+3)!==0x4D){
        if(v.getUint8(off)!==0x38||v.getUint8(off+1)!==0x42||v.getUint8(off+2)!==0x36||v.getUint8(off+3)!==0x34){
          off++;continue;
        }
      }
      off+=4; // skip signature
      const id=v.getUint16(off);off+=2;
      const nameLen=v.getUint8(off);off+=1;
      const namePad=nameLen%2===0?1:0;
      off+=nameLen+namePad;
      if(off>=imgResEnd)break;
      const resLen=v.getUint32(off);off+=4;
      if(id===1036&&resLen>28&&off+resLen<=ab.byteLength){
        // JPEG thumbnail: skip 28-byte JFIF header
        const jpgStart=off+28;const jpgLen=resLen-28;
        const jpgBytes=new Uint8Array(ab,jpgStart,jpgLen);
        const blob=new Blob([jpgBytes],{type:'image/jpeg'});
        const url=URL.createObjectURL(blob);
        const im=await loadImg(url);
        const cvs=document.createElement('canvas');cvs.width=im.width;cvs.height=im.height;
        cvs.getContext('2d').drawImage(im,0,0);
        URL.revokeObjectURL(url);
        return{url:cvs.toDataURL('image/png'),width:im.width,height:im.height};
      }
      off+=resLen+(resLen%2); // pad to even
    }
  }catch(e){console.warn('PSD thumbnail extraction failed:',e)}
  return null;
}

function parsePSD(ab){
  const v=new DataView(ab);
  if(v.getUint8(0)!==0x38||v.getUint8(1)!==0x42||v.getUint8(2)!==0x50||v.getUint8(3)!==0x53)
    throw new Error('Not a PSD file');
  const channels=v.getUint16(12),height=v.getUint32(14),width=v.getUint32(18),depth=v.getUint16(22),colorMode=v.getUint16(24);
  if(depth!==8)throw new Error('Only 8-bit PSD supported (got '+depth+')');
  if(width>30000||height>30000)throw new Error('PSD too large');
  let off=26;
  off+=4+v.getUint32(off); // color mode data
  off+=4+v.getUint32(off); // image resources
  off+=4+v.getUint32(off); // layer and mask info
  const compression=v.getUint16(off);off+=2;
  const cvs=document.createElement('canvas');cvs.width=width;cvs.height=height;
  const ctx=cvs.getContext('2d');const imgData=ctx.createImageData(width,height);const px=imgData.data;
  const u8=new Uint8Array(ab);

  // Channel mapping based on color mode
  // RGB(3): ch0=R,ch1=G,ch2=B,[ch3=A]
  // Grayscale(1): ch0=Gray
  // CMYK(4): ch0=C,ch1=M,ch2=Y,ch3=K → need conversion
  const isGray=colorMode===1;
  const isCMYK=colorMode===4;

  if(compression===0){
    for(let c=0;c<Math.min(channels,4);c++){
      for(let i=0;i<width*height;i++){
        const si=off+c*width*height+i;if(si>=ab.byteLength)break;
        const idx=i*4;const val=u8[si];
        if(isGray){px[idx]=val;px[idx+1]=val;px[idx+2]=val}
        else if(isCMYK){
          if(c===0)px[idx]=255-val;else if(c===1)px[idx+1]=255-val;else if(c===2)px[idx+2]=255-val;else px[idx+3]=val
        }else{
          if(c===0)px[idx]=val;else if(c===1)px[idx+1]=val;else if(c===2)px[idx+2]=val;else px[idx+3]=val
        }
      }
    }
  }else if(compression===1){
    const counts=[];
    for(let c=0;c<channels;c++){counts[c]=[];for(let y=0;y<height;y++){counts[c][y]=v.getUint16(off);off+=2}}
    for(let c=0;c<Math.min(channels,4);c++){
      for(let y=0;y<height;y++){
        const line=decompressPSDRLE(u8,off,counts[c][y]);off+=counts[c][y];
        for(let x=0;x<width&&x<line.length;x++){
          const idx=(y*width+x)*4;const val=line[x];
          if(isGray){px[idx]=val;px[idx+1]=val;px[idx+2]=val}
          else if(isCMYK){
            if(c===0)px[idx]=255-val;else if(c===1)px[idx+1]=255-val;else if(c===2)px[idx+2]=255-val;else px[idx+3]=val
          }else{
            if(c===0)px[idx]=val;else if(c===1)px[idx+1]=val;else if(c===2)px[idx+2]=val;else px[idx+3]=val
          }
        }
      }
    }
  }else{throw new Error('Unsupported PSD compression: '+compression)}
  if(channels<4||(isGray&&channels<2)||(isCMYK&&channels<5)){for(let i=0;i<width*height;i++)px[i*4+3]=255}
  ctx.putImageData(imgData,0,0);
  return{url:cvs.toDataURL('image/png'),width,height};
}

function extractPSDThumbnail(v,start,end){
  try{
    let off=start;
    while(off<end-12){
      const sig=v.getUint16(off);off+=2; // resource signature (should be 0x8B04 for "8BIM")
      if(sig!==0x8B04&&sig!==0x8B64){off++;continue}
      const id=v.getUint16(off);off+=2;
      // Pascal string name (padded to even)
      const nameLen=v.getUint8(off);off+=1;
      off+=(nameLen+1+((nameLen%2===0)?1:0)); // pad to even
      const resLen=v.getUint32(off);off+=4;
      if(id===1036&&resLen>0&&resLen<50000000){
        // JPEG thumbnail - skip 28 bytes of JFIF header
        const jpgStart=off+28;
        const jpgLen=resLen-28;
        if(jpgLen>0&&jpgStart+jpgLen<=v.byteLength){
          const jpgBytes=new Uint8Array(v.buffer,jpgStart,jpgLen);
          const blob=new Blob([jpgBytes],{type:'image/jpeg'});
          const url=URL.createObjectURL(blob);
          // We need to load it to get dimensions
          return new Promise(()=>{}); // Can't do sync, return null and handle below
        }
      }
      off+=resLen+(resLen%2); // pad to even
    }
  }catch(e){}
  return null;
}

function decompressPSDRLE(data,start,len){
  const r=[];let o=start;const end=start+len;
  while(o<end){
    const raw=data[o++];
    const n=raw>127?raw-256:raw; // Convert unsigned byte to signed
    if(n>=0){for(let i=0;i<=n&&o<end;i++)r.push(data[o++])}
    else if(n>=-127){if(o>=end)break;const val=data[o++];for(let i=0;i<1-n;i++)r.push(val)}
    // n===-128: no-op
  }
  return r;
}

// ═══════ PPTX ═══════
// Namespace-agnostic helpers for robust XML parsing
function findByLN(parent,ln){const r=[];const all=parent.getElementsByTagName('*');for(let i=0;i<all.length;i++){if(all[i].localName===ln)r.push(all[i])}return r}
function find1ByLN(parent,ln){const all=parent.getElementsByTagName('*');for(let i=0;i<all.length;i++){if(all[i].localName===ln)return all[i]}return null}
function getAttrAny(el,ln){for(let i=0;i<el.attributes.length;i++){if(el.attributes[i].localName===ln)return el.attributes[i].value}return el.getAttribute(ln)}

const schemeClrMap={tx1:'#000000',tx2:'#44546A',bg1:'#FFFFFF',bg2:'#E7E6E6',accent1:'#4472C4',accent2:'#ED7D31',accent3:'#A5A5A5',accent4:'#FFC000',accent5:'#5B9BD5',accent6:'#70AD47',dk1:'#000000',dk2:'#44546A',lt1:'#FFFFFF',lt2:'#E7E6E6'};

async function renderPPTX(ab){
  lt.style.display='block';
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
    const zip=await JSZip.loadAsync(ab);
    const slides=[];
    zip.forEach((path,entry)=>{const m=path.match(/^ppt\/slides\/slide(\d+)\.xml$/);if(m)slides.push({num:+m[1],entry})});
    slides.sort((a,b)=>a.num-b.num);
    if(slides.length===0){lt.style.display='none';return}
    let slideW=9144000,slideH=6858000;
    try{
      const pXml=await zip.file('ppt/presentation.xml').async('string');
      const pDoc=new DOMParser().parseFromString(pXml,'text/xml');
      const sldSz=find1ByLN(pDoc,'sldSz');
      if(sldSz){slideW=parseInt(sldSz.getAttribute('cx'))||slideW;slideH=parseInt(sldSz.getAttribute('cy'))||slideH}
    }catch(e){}
    const pxW=1280,pxH=Math.round(pxW*slideH/slideW);
    // KEY FIX: font scale factor - PPTX sz is in hundredths of a point
    // Convert points to pixels at canvas DPI: px = pt * (canvasPPI / 72)
    const fontScale=pxW/(slideW/914400)/72;

    for(const sf of slides){
      const xmlStr=await sf.entry.async('string');
      const doc=new DOMParser().parseFromString(xmlStr,'text/xml');
      const relImages=await loadSlideRels(zip,sf.num);
      const cvs=document.createElement('canvas');cvs.width=pxW;cvs.height=pxH;
      const ctx=cvs.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,pxW,pxH);
      const spTree=find1ByLN(doc,'spTree');
      if(spTree)await processPPTXShapes(ctx,spTree,relImages,pxW,pxH,slideW,slideH,fontScale);
      addImg(cvs.toDataURL('image/png'),pxW/2,pxH/2);
    }
  }catch(e){console.error('PPTX error:',e)}
  finally{lt.style.display='none'}
}

async function processPPTXShapes(ctx,parent,relImages,pxW,pxH,slideW,slideH,fontScale){
  const children=parent.children;
  for(let i=0;i<children.length;i++){
    const child=children[i];const ln=child.localName;
    if(ln==='grpSp'){await processPPTXShapes(ctx,child,relImages,pxW,pxH,slideW,slideH,fontScale)}
    else if(ln==='pic'){await renderPPTXPic(ctx,child,relImages,pxW,pxH,slideW,slideH)}
    else if(ln==='sp'){renderPPTXSp(ctx,child,pxW,pxH,slideW,slideH,fontScale)}
  }
}

async function renderPPTXPic(ctx,picEl,relImages,pxW,pxH,slideW,slideH){
  const xfrm=getXfrm(picEl,pxW,pxH,slideW,slideH);if(!xfrm)return;
  const blip=find1ByLN(picEl,'blip');if(!blip)return;
  const embedId=getAttrAny(blip,'embed');
  if(!embedId||!relImages[embedId])return;
  try{const im=await loadImg(relImages[embedId]);ctx.drawImage(im,xfrm.x,xfrm.y,xfrm.w,xfrm.h)}catch(e){}
}

function renderPPTXSp(ctx,spEl,pxW,pxH,slideW,slideH,fontScale){
  const xfrm=getXfrm(spEl,pxW,pxH,slideW,slideH);
  const txBody=find1ByLN(spEl,'txBody');
  if(!txBody||!xfrm)return;
  const paras=findByLN(txBody,'p');
  let ty=xfrm.y+8;
  for(const p of paras){
    let defaultFs=18*fontScale;
    const pPr=find1ByLN(p,'pPr');
    if(pPr){const defRPr=find1ByLN(pPr,'defRPr');if(defRPr){const sz=defRPr.getAttribute('sz');if(sz)defaultFs=parseInt(sz)/100*fontScale}}
    const runs=findByLN(p,'r');
    // Also check for line breaks
    const brs=findByLN(p,'br');
    if(runs.length===0&&brs.length===0){ty+=defaultFs*1.3;continue}
    for(const r of runs){
      let fs=defaultFs,bold=false,color='#000000';
      const rPr=find1ByLN(r,'rPr');
      if(rPr){
        const sz=rPr.getAttribute('sz');if(sz)fs=parseInt(sz)/100*fontScale;
        const b=rPr.getAttribute('b');if(b==='1'||b==='true')bold=true;
        const i=rPr.getAttribute('i');if(i==='1'||i==='true')bold=false; // italic not supported on canvas, skip
        const solidFill=find1ByLN(rPr,'solidFill');
        if(solidFill){
          const sr=find1ByLN(solidFill,'srgbClr');
          if(sr)color='#'+sr.getAttribute('val');
          else{const sc=find1ByLN(solidFill,'schemeClr');if(sc)color=schemeClrMap[sc.getAttribute('val')]||'#000000'}
        }
      }
      const t=find1ByLN(r,'t');
      if(!t||!t.textContent)continue;
      ctx.font=(bold?'bold ':'')+fs+'px sans-serif';ctx.fillStyle=color;
      const lines=wrapTxt(ctx,t.textContent,Math.max(xfrm.w-16,50));
      for(const line of lines){ctx.fillText(line,xfrm.x+8,ty+fs);ty+=fs*1.35}
    }
    // Handle line breaks
    for(const br of brs){ty+=defaultFs*1.3}
  }
}

function getXfrm(el,pxW,pxH,slideW,slideH){
  const spPr=find1ByLN(el,'spPr');if(!spPr)return null;
  const xfrm=find1ByLN(spPr,'xfrm');if(!xfrm)return null;
  const off=find1ByLN(xfrm,'off');const ext=find1ByLN(xfrm,'ext');
  if(!off||!ext)return null;
  return{
    x:(parseInt(off.getAttribute('x'))||0)/slideW*pxW,
    y:(parseInt(off.getAttribute('y'))||0)/slideH*pxH,
    w:(parseInt(ext.getAttribute('cx'))||0)/slideW*pxW,
    h:(parseInt(ext.getAttribute('cy'))||0)/slideH*pxH
  };
}

async function loadSlideRels(zip,slideNum){
  const images={};
  try{
    const relsPath='ppt/slides/_rels/slide'+slideNum+'.xml.rels';
    const relsFile=zip.file(relsPath);if(!relsFile)return images;
    const relsXml=await relsFile.async('string');
    const doc=new DOMParser().parseFromString(relsXml,'text/xml');
    const rels=doc.getElementsByTagName('Relationship');
    for(let i=0;i<rels.length;i++){
      const target=rels[i].getAttribute('Target');
      const rId=rels[i].getAttribute('Id');
      if(target&&/\.(png|jpg|jpeg|gif|bmp|emf|wmf|tiff?)$/i.test(target)){
        const imgPath='ppt/slides/'+target.replace(/^\.\//,'');
        const altPath=target.replace(/^\.\.\//,'ppt/');
        const imgFile=zip.file(imgPath)||zip.file(altPath);
        if(imgFile){const blob=await imgFile.async('blob');images[rId]=URL.createObjectURL(blob)}
      }
    }
  }catch(e){}
  return images;
}

function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
function wrapTxt(ctx,text,maxW){
  const chars=[...text];const lines=[];let line='';
  for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxW&&line!==''){lines.push(line);line=ch}else{line=test}}
  if(line)lines.push(line);return lines;
}


// ═══════ Resize ═══════
function startResize(dir,e){
  if(S.selIds.size!==1)return;const id=[...S.selIds][0];const it=getIt(id);if(!it)return;
  if(it.type==='text'&&it.el.classList.contains('editing'))stopEdit(it);
  S.resizing=true;S.rDir=dir;S.rSX=e.clientX;S.rSY=e.clientY;S.rRect={x:it.x,y:it.y,w:it.width,h:it.height};
}
function doResize(e){
  if(S.selIds.size!==1)return;const id=[...S.selIds][0];const it=getIt(id);if(!it)return;
  const dx=(e.clientX-S.rSX)/S.scale,dy=(e.clientY-S.rSY)/S.scale;
  const r=S.rRect,d=S.rDir;let nx=r.x,ny=r.y,nw=r.w,nh=r.h;
  if(d.includes('e'))nw=Math.max(30,r.w+dx);
  if(d.includes('w')){const dd=clamp(dx,-(r.w-30),r.w-30);nx=r.x+dd;nw=r.w-dd}
  if(d.includes('s'))nh=Math.max(20,r.h+dy);
  if(d.includes('n')){const dd=clamp(dy,-(r.h-20),r.h-20);ny=r.y+dd;nh=r.h-dd}
  if(it.type==='image'&&(d==='nw'||d==='ne'||d==='sw'||d==='se')){
    const ar=r.w/r.h;if(Math.abs(nw-r.w)>=Math.abs(nh-r.h)){nh=nw/ar}else{nw=nh*ar}
    if(d==='nw'){nx=r.x+r.w-nw;ny=r.y+r.h-nh}else if(d==='ne'){ny=r.y+r.h-nh}else if(d==='sw'){nx=r.x+r.w-nw}
  }
  it.x=nx;it.y=ny;it.width=nw;it.height=nh;
  it.el.style.left=nx+'px';it.el.style.top=ny+'px';it.el.style.width=nw+'px';it.el.style.height=nh+'px';
  updSelOv();
}

// ═══════ Drag (multi) ═══════
function startDrag(e){
  S.dragging=true;S.dragSX=e.clientX;S.dragSY=e.clientY;
  S.dragStarts=new Map();S.selIds.forEach(id=>{const it=getIt(id);if(it)S.dragStarts.set(id,{x:it.x,y:it.y})});
}
function doDrag(e){
  if(!S.dragStarts)return;
  const dx=(e.clientX-S.dragSX)/S.scale,dy=(e.clientY-S.dragSY)/S.scale;
  S.dragStarts.forEach((start,id)=>{const it=getIt(id);if(!it)return;it.x=start.x+dx;it.y=start.y+dy;it.el.style.left=it.x+'px';it.el.style.top=it.y+'px'});
  updSelOv();
}

// ═══════ Box Select ═══════
function startBoxSel(e){
  S.boxSel=true;S.boxSX=e.clientX;S.boxSY=e.clientY;
  bsr.style.display='block';bsr.style.left=e.clientX+'px';bsr.style.top=e.clientY+'px';bsr.style.width='0px';bsr.style.height='0px';
}
function doBoxSel(e){
  if(!S.boxSel)return;
  const x1=Math.min(S.boxSX,e.clientX),y1=Math.min(S.boxSY,e.clientY),x2=Math.max(S.boxSX,e.clientX),y2=Math.max(S.boxSY,e.clientY);
  bsr.style.left=x1+'px';bsr.style.top=y1+'px';bsr.style.width=(x2-x1)+'px';bsr.style.height=(y2-y1)+'px';
}
function endBoxSel(e){
  S.boxSel=false;bsr.style.display='none';
  const x1=Math.min(S.boxSX,e.clientX),y1=Math.min(S.boxSY,e.clientY),x2=Math.max(S.boxSX,e.clientX),y2=Math.max(S.boxSY,e.clientY);
  if(x2-x1<5&&y2-y1<5)return;
  const wl=s2w(x1,y1),wr=s2w(x2,y2);S.selIds.clear();
  S.items.forEach(it=>{if(it.x+it.width>wl.x&&it.x<wr.x&&it.y+it.height>wl.y&&it.y<wr.y)S.selIds.add(it.id)});
  updSelOv();
}

// ═══════ Pan ═══════
function startPan(e){S.panning=true;S.panSX=e.clientX;S.panSY=e.clientY;S.panSOX=S.ox;S.panSOY=S.oy;vp.style.cursor='grabbing'}
function doPan(e){S.ox=S.panSOX+(e.clientX-S.panSX);S.oy=S.panSOY+(e.clientY-S.panSY);scheduleUpd()}

// ═══════ Zoom ═══════
function doZoom(e){
  e.preventDefault();if(!S.ctrlDown)return;
  const mx=e.clientX,my=e.clientY,wb=s2w(mx,my);
  const f=e.deltaY<0?1.08:1/1.08;S.scale=clamp(S.scale*f,0.05,10);
  S.ox=mx-wb.x*S.scale;S.oy=my-wb.y*S.scale;scheduleUpd();
}

// ═══════ Toolbar ═══════
function syncCdots(){cdots.forEach(d=>d.classList.toggle('active',d.dataset.c===S.fontColor))}
function syncBbtn(){btnB.classList.toggle('active',S.fontBold)}
rngSz.addEventListener('input',()=>{S.fontSize=+rngSz.value;szV.textContent=S.fontSize;if(S.selIds.size===1){const it=getIt([...S.selIds][0]);if(it&&it.type==='text'){it.fontSize=S.fontSize;it.el.style.fontSize=S.fontSize+'px';autoH(it)}}});
cdots.forEach(d=>d.addEventListener('click',()=>{S.fontColor=d.dataset.c;syncCdots();if(S.selIds.size===1){const it=getIt([...S.selIds][0]);if(it&&it.type==='text'){it.color=S.fontColor;it.el.style.color=S.fontColor}}}));
btnB.addEventListener('click',()=>{S.fontBold=!S.fontBold;syncBbtn();if(S.selIds.size===1){const it=getIt([...S.selIds][0]);if(it&&it.type==='text'){it.bold=S.fontBold;it.el.style.fontWeight=S.fontBold?'bold':'normal';autoH(it)}}});
btnTxt.addEventListener('click',toggleTextMode);
btnFile.addEventListener('click',()=>fi.click());
fi.addEventListener('change',()=>{if(fi.files.length)loadFiles(fi.files);fi.value=''});
btnExp.addEventListener('click',exportPNG);

function toggleTextMode(){S.textMode=!S.textMode;btnTxt.classList.toggle('active',S.textMode);mb.style.display=S.textMode?'block':'none';vp.style.cursor=S.textMode?'text':'default'}

// ═══════ Copy ═══════
async function copySelected(){
  if(S.selIds.size===0)return;
  const id=[...S.selIds][0];const it=getIt(id);if(!it)return;
  try{
    if(it.type==='image'){
      const img=it.el.querySelector('img');if(!img||!img.src)return;
      // Fetch image as blob and copy to clipboard
      const resp=await fetch(img.src);const blob=await resp.blob();
      if(navigator.clipboard&&navigator.clipboard.write){
        await navigator.clipboard.write([new ClipboardItem({[blob.type]:blob})]);
      }
    }else if(it.type==='text'){
      const text=it.el.innerText||'';
      if(navigator.clipboard&&navigator.clipboard.writeText){
        await navigator.clipboard.writeText(text);
      }
    }
  }catch(e){console.warn('Copy failed:',e)}
}

// ═══════ Keyboard ═══════
document.addEventListener('keydown',e=>{
  if((e.key==='c'||e.key==='C')&&(e.ctrlKey||e.metaKey)){if(!isEditing()&&S.selIds.size>0){e.preventDefault();copySelected()}return}
  if(e.code==='Space'){if(isEditing())return;e.preventDefault();S.spaceDown=true;if(!S.textMode)vp.style.cursor='grab';return}
  if(e.key==='Control'||e.key==='Meta'){S.ctrlDown=true;return}
  if(e.key==='Shift'){S.shiftDown=true;return}
  if((e.key==='t'||e.key==='T')&&!e.ctrlKey&&!e.metaKey){if(isEditing())return;e.preventDefault();toggleTextMode();return}
  if(e.key==='Escape'){S.textMode=false;btnTxt.classList.remove('active');mb.style.display='none';vp.style.cursor='default';desel();return}
  if(e.key==='Delete'||e.key==='Backspace'){if(isEditing())return;if(S.selIds.size>0){e.preventDefault();rmSelItems()}}
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space'){S.spaceDown=false;if(!S.panning&&!S.textMode)vp.style.cursor='default'}
  if(e.key==='Control'||e.key==='Meta')S.ctrlDown=false;
  if(e.key==='Shift')S.shiftDown=false;
});

// ═══════ Mouse ═══════
vp.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  if(e.target.classList.contains('rh')){e.preventDefault();startResize(e.target.dataset.dir,e);return}
  if(S.spaceDown){e.preventDefault();startPan(e);return}
  if(S.shiftDown&&!e.target.closest('.ci')){e.preventDefault();startBoxSel(e);return}
  const itEl=e.target.closest('.ci');
  if(S.textMode&&!itEl){
    e.preventDefault(); // CRITICAL: prevent browser from stealing focus
    const w=s2w(e.clientX,e.clientY);addText(w.x,w.y);
    S.textMode=false;btnTxt.classList.remove('active');mb.style.display='none';vp.style.cursor='default';return;
  }
  if(itEl){
    if(S.textMode){S.textMode=false;btnTxt.classList.remove('active');mb.style.display='none';vp.style.cursor='default'}
    const it=itByEl(e.target);if(!it)return;
    if(S.shiftDown){if(S.selIds.has(it.id)){S.selIds.delete(it.id)}else{S.selIds.add(it.id);it.el.style.zIndex=S.nzi++}updSelOv();return}
    if(S.ctrlDown){
      if(!S.selIds.has(it.id)){S.selIds.add(it.id);it.el.style.zIndex=S.nzi++;updSelOv()}
      S.selIds.forEach(sid=>{const t=getIt(sid);if(t&&t.type==='text'&&t.el.classList.contains('editing'))stopEdit(t)});
      e.preventDefault();startDrag(e);
    }else{
      selItem(it.id);
      if(it.type==='text'){
        if(!it.el.classList.contains('editing')){setTimeout(()=>startEdit(it),0)}
        else if(document.activeElement!==it.el){setTimeout(()=>it.el.focus(),0)}
      }
    }
    return;
  }
  desel();
});

document.addEventListener('mousemove',e=>{
  if(S.resizing){doResize(e);return}if(S.panning){doPan(e);return}if(S.dragging){doDrag(e);return}if(S.boxSel){doBoxSel(e);return}
  if(S.spaceDown)vp.style.cursor='grab';else if(S.textMode)vp.style.cursor='text';else if(S.shiftDown)vp.style.cursor='crosshair';
  else{const itEl=e.target.closest('.ci');vp.style.cursor=(itEl&&S.ctrlDown)?'move':'default'}
});

document.addEventListener('mouseup',e=>{
  if(S.resizing){S.resizing=false;if(S.selIds.size===1){const it=getIt([...S.selIds][0]);if(it&&it.type==='text')autoH(it)}}
  if(S.panning){S.panning=false;vp.style.cursor=S.spaceDown?'grab':(S.textMode?'text':'default')}
  if(S.dragging){S.dragging=false;S.dragStarts=null}
  if(S.boxSel){endBoxSel(e)}
});

vp.addEventListener('wheel',doZoom,{passive:false});

// ═══════ Drag & Drop ═══════
let dc=0;
vp.addEventListener('dragenter',e=>{e.preventDefault();dc++;dz.classList.add('show')});
vp.addEventListener('dragover',e=>e.preventDefault());
vp.addEventListener('dragleave',e=>{e.preventDefault();dc--;if(dc<=0){dc=0;dz.classList.remove('show')}});
vp.addEventListener('drop',e=>{e.preventDefault();dc=0;dz.classList.remove('show');if(e.dataTransfer.files.length)loadFiles(e.dataTransfer.files,e.clientX,e.clientY)});

// ═══════ Paste ═══════
document.addEventListener('paste',e=>{
  if(isEditing())return;
  const cd=e.clipboardData;if(!cd)return;
  // Check for images first
  const items=cd.items;
  if(items){
    for(let i=0;i<items.length;i++){
      if(items[i].type.indexOf('image')!==-1){
        const blob=items[i].getAsFile();
        _dropPos={x:_lastMouseWorld.x,y:_lastMouseWorld.y};
        processFile(blob);return;
      }
    }
  }
  // Check for text
  const text=cd.getData('text/plain');
  if(text&&text.trim()){
    const it=mkItem('text',_lastMouseWorld.x,_lastMouseWorld.y,240,40);
    it.el.style.fontSize=S.fontSize+'px';it.el.style.color=S.fontColor;
    it.el.style.fontWeight=S.fontBold?'bold':'normal';
    it.el.style.fontFamily='-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
    it.fontSize=S.fontSize;it.color=S.fontColor;it.bold=S.fontBold;
    it.el.innerText=text;
    autoH(it);selItem(it.id);
  }
});

// Track mouse position for paste placement
vp.addEventListener('mousemove',e=>{_lastMouseWorld=s2w(e.clientX,e.clientY)});

// ═══════ Text input auto-height ═══════
cl.addEventListener('input',e=>{const itEl=e.target.closest('.ci-txt');if(!itEl)return;const it=getIt(+itEl.dataset.id);if(it)autoH(it)});

// ═══════ Export PNG ═══════
function exportPNG(){
  if(S.items.length===0)return;et.style.display='block';
  setTimeout(()=>{try{_doExport()}catch(err){console.error(err);et.style.display='none'}},60);
}
function _doExport(){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  S.items.forEach(it=>{minX=Math.min(minX,it.x);minY=Math.min(minY,it.y);maxX=Math.max(maxX,it.x+it.width);maxY=Math.max(maxY,it.y+it.height)});
  const pad=80;minX-=pad;minY-=pad;maxX+=pad;maxY+=pad;
  const cw=maxX-minX,ch=maxY-minY,ex=Math.min(3,12000/Math.max(cw,ch,1));
  const cvs=document.createElement('canvas');cvs.width=Math.ceil(cw*ex);cvs.height=Math.ceil(ch*ex);
  const ctx=cvs.getContext('2d');ctx.scale(ex,ex);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cw,ch);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  S.items.forEach(it=>{
    const ix=it.x-minX,iy=it.y-minY;
    if(it.type==='image'){const img=it.el.querySelector('img');if(img&&img.complete&&img.naturalWidth>0)ctx.drawImage(img,ix,iy,it.width,it.height)}
    else if(it.type==='text')_renderTxt(ctx,it,ix,iy);
  });
  cvs.toBlob(blob=>{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='canvas-'+Date.now()+'.png';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);et.style.display='none'},'image/png');
}
function _renderTxt(ctx,it,ox,oy){
  const fs=it.fontSize||28,bold=it.bold?'bold ':'';
  const ff='-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
  ctx.font=bold+fs+'px '+ff;ctx.fillStyle=it.color||'#000000';ctx.textBaseline='top';
  const lh=fs*1.45,px=8,py=4,maxW=it.width-px*2;if(maxW<=0)return;
  const text=it.el.innerText||it.el.textContent||'';const paras=text.split('\n');let cy=oy+py;
  paras.forEach(para=>{if(para===''){cy+=lh;return}const chars=[...para];let line='';
    for(let i=0;i<chars.length;i++){const ch=chars[i];const test=line+ch;if(ctx.measureText(test).width>maxW&&line!==''){ctx.fillText(line,ox+px,cy);line=ch;cy+=lh}else{line=test}}
    if(line){ctx.fillText(line,ox+px,cy);cy+=lh}
  });
}

// ═══════ Init ═══════
function init(){S.ox=window.innerWidth/2;S.oy=window.innerHeight/2;applyTf();updBg()}
init();window.addEventListener('resize',()=>{updBg();updSelOv()});

})();
</script>
