<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>声波笔记 · 语音灵感捕手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background: #0b0818;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .phone-frame {
            max-width: 420px;
            width: 100%;
            background: linear-gradient(160deg, #14102a 0%, #1a1538 100%);
            border-radius: 44px;
            padding: 24px 20px 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
            position: relative;
            overflow: hidden;
        }

        /* 顶部状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            padding: 0 4px 16px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .status-bar .time {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
        }

        /* 标题区域 */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .app-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-header h1 span {
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 40px;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .header-actions button {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: rgba(255, 255, 255, 0.6);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .header-actions button:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* 主录音卡片 */
        .record-card {
            background: linear-gradient(145deg, #1e1840, #15112e);
            border-radius: 32px;
            padding: 24px 20px 28px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .record-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .record-status .label {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .record-status .status-dot {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }

        .record-status .status-dot .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        .record-status .status-dot .dot.idle {
            background: #6b7280;
            animation: none;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.8);
            }
        }

        /* 语音转文字展示 */
        .transcript-area {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 16px 18px;
            min-height: 80px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.3s;
        }

        .transcript-area .placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            font-weight: 400;
            line-height: 1.6;
        }

        .transcript-area .text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            line-height: 1.7;
            font-weight: 400;
        }

        .transcript-area .text .highlight {
            color: #a78bfa;
            font-weight: 500;
        }

        /* 麦克风按钮 */
        .mic-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 4px;
        }

        .mic-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            transition: 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .mic-btn::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: rgba(124, 58, 237, 0.15);
            z-index: -1;
            animation: ring-pulse 2s ease-out infinite;
        }

        @keyframes ring-pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .mic-btn:active {
            transform: scale(0.88);
        }

        .mic-btn.recording {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 8px 32px rgba(239, 68, 68, 0.4);
        }

        .mic-btn.recording::after {
            background: rgba(239, 68, 68, 0.2);
        }

        .mic-label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .mic-label.active {
            color: #ef4444;
        }

        /* AI 标签生成区 */
        .ai-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 14px 0 6px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .ai-tags .tag {
            background: rgba(167, 139, 250, 0.12);
            border: 1px solid rgba(167, 139, 250, 0.15);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
        }

        .ai-tags .tag.glow {
            background: rgba(167, 139, 250, 0.2);
            border-color: rgba(167, 139, 250, 0.3);
            color: #c4b5fd;
        }

        .ai-tags .label-tip {
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
            margin-bottom: 2px;
        }

        .ai-tags .label-tip span {
            background: rgba(167, 139, 250, 0.08);
            padding: 0 8px;
            border-radius: 20px;
            font-size: 10px;
        }

        /* 灵感时间线 */
        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 12px;
        }

        .timeline-header h3 {
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .timeline-header .count {
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 14px;
            border-radius: 40px;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .timeline::-webkit-scrollbar {
            width: 3px;
        }

        .timeline::-webkit-scrollbar-track {
            background: transparent;
        }

        .timeline::-webkit-scrollbar-thumb {
            background: rgba(167, 139, 250, 0.3);
            border-radius: 20px;
        }

        .timeline-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.2s;
        }

        .timeline-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .timeline-item .item-title {
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .timeline-item .item-title .ai-badge {
            font-size: 10px;
            background: rgba(167, 139, 250, 0.15);
            padding: 0 8px;
            border-radius: 30px;
            color: #a78bfa;
            margin-left: 6px;
            font-weight: 400;
        }

        .timeline-item .item-preview {
            color: rgba(255, 255, 255, 0.35);
            font-size: 13px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .timeline-item .item-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .timeline-item .item-meta .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .timeline-item .item-meta .tags .mini-tag {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.04);
            padding: 1px 10px;
            border-radius: 30px;
        }

        .timeline-item .item-meta .time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 400;
        }

        /* 关键词关联图谱 */
        .graph-section {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .graph-section .graph-label {
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .graph-section .graph-label span {
            background: rgba(167, 139, 250, 0.08);
            padding: 0 10px;
            border-radius: 30px;
            font-size: 10px;
        }

        .graph-nodes {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 10px;
            align-items: center;
        }

        .graph-nodes .node {
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            background: rgba(167, 139, 250, 0.06);
            color: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(167, 139, 250, 0.04);
            transition: 0.2s;
        }

        .graph-nodes .node.active {
            background: rgba(167, 139, 250, 0.12);
            color: #c4b5fd;
            border-color: rgba(167, 139, 250, 0.15);
        }

        .graph-nodes .node.hub {
            background: rgba(167, 139, 250, 0.18);
            color: #a78bfa;
            border-color: rgba(167, 139, 250, 0.2);
            font-weight: 600;
        }

        .graph-nodes .connector {
            color: rgba(255, 255, 255, 0.05);
            font-size: 12px;
        }

        /* 底部提示 */
        .footer-tip {
            margin-top: 18px;
            color: rgba(255, 255, 255, 0.08);
            font-size: 10px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* 简易交互模拟 */
        .mic-btn.clicked {
            animation: click-pop 0.2s ease;
        }

        @keyframes click-pop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(0.85);
            }
            100% {
                transform: scale(1);
            }
        }

        /* 响应式 */
        @media (max-width: 460px) {
            .phone-frame {
                border-radius: 32px;
                padding: 18px 16px 24px;
            }
            .app-header h1 {
                font-size: 19px;
            }
            .mic-btn {
                width: 64px;
                height: 64px;
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span class="time">9:41</span>
            <span>📶 🔋 100%</span>
        </div>

        <!-- 头部 -->
        <div class="app-header">
            <h1>
                🎤 声波笔记
                <span>AI</span>
            </h1>
            <div class="header-actions">
                <button>🔍</button>
                <button>⚙️</button>
            </div>
        </div>

        <!-- 录音卡片 -->
        <div class="record-card">
            <div class="record-status">
                <span class="label">🎧 语音捕捉</span>
                <span class="status-dot">
                    <span class="dot idle" id="statusDot"></span>
                    <span id="statusText">待命</span>
                </span>
            </div>

            <!-- 转录区 -->
            <div class="transcript-area" id="transcriptArea">
                <div class="placeholder" id="placeholderText">👆 点击麦克风，说出你的灵感…</div>
                <div class="text" id="transcriptText" style="display:none;"></div>
            </div>

            <!-- AI 标签 -->
            <div class="ai-tags" id="aiTags">
                <div class="label-tip">
                    ✦ AI 智能生成
                    <span>自动提取</span>
                </div>
                <span class="tag">#待识别</span>
                <span class="tag">#等待输入</span>
            </div>

            <!-- 麦克风 -->
            <div class="mic-row">
                <button class="mic-btn" id="micBtn">🎙️</button>
            </div>
            <div style="text-align:center; margin-top: 6px;">
                <span class="mic-label" id="micLabel">点击录音</span>
            </div>
        </div>

        <!-- 时间线 -->
        <div class="timeline-header">
            <h3>📋 灵感时间线</h3>
            <span class="count" id="noteCount">3 条</span>
        </div>

        <div class="timeline" id="timeline">
            <!-- 由 JS 动态渲染 -->
        </div>

        <!-- 关键词关联图谱 -->
        <div class="graph-section">
            <div class="graph-label">
                🔗 关键词图谱
                <span>关联推荐</span>
            </div>
            <div class="graph-nodes" id="graphNodes">
                <span class="node hub">创造力</span>
                <span class="connector">·</span>
                <span class="node active">写作</span>
                <span class="connector">·</span>
                <span class="node">播客</span>
                <span class="connector">·</span>
                <span class="node active">产品灵感</span>
                <span class="connector">·</span>
                <span class="node">晨跑</span>
                <span class="connector">·</span>
                <span class="node">菜谱</span>
            </div>
        </div>

        <div class="footer-tip">声波笔记 · 让每个灵感都被听见</div>
    </div>

    <script>
        (function() {
            // ---- 数据 ----
            const demoNotes = [{
                id: 1,
                title: '🎬 短视频脚本创意 · 晨跑系列',
                preview: '用第一人称视角拍摄晨跑时看到的城市苏醒画面，配合轻快爵士乐，每期一个温暖小故事。',
                tags: ['#创意', '#短视频', '#晨跑'],
                time: '今天 07:32'
            }, {
                id: 2,
                title: '📝 产品功能迭代灵感',
                preview: '声波笔记可以增加"灵感碰撞"功能：随机组合两条历史记录，生成新的创意方向。',
                tags: ['#产品', '#功能', '#AI'],
                time: '昨天 22:15'
            }, {
                id: 3,
                title: '🍳 融合菜谱尝试',
                preview: '将云南菌菇与法式奶油浓汤结合，加入少许柠檬草，口感层次更丰富。',
                tags: ['#美食', '#菜谱', '#创意'],
                time: '昨天 18:40'
            }];

            // 语音模拟数据
            const voiceSimulations = [
                { text: '今天晨跑的时候想到一个短视频创意，用第一人称视角拍摄城市苏醒的过程，配上轻快的爵士乐，每一期讲一个温暖的小故事。', tags: ['#创意', '#短视频', '#晨跑'] },
                { text: '我觉得声波笔记可以增加一个"灵感碰撞"功能，随机组合两条历史记录，生成新的创意方向，这样能激发更多想法。', tags: ['#产品', '#功能', '#AI'] },
                { text: '想尝试把云南的菌菇和法式奶油浓汤结合起来，再加一点柠檬草，应该会有很特别的风味。', tags: ['#美食', '#菜谱', '#创意'] },
                { text: '昨晚读了一本关于认知科学的书，里面提到"间隔重复"对记忆的帮助，可以用到我的学习计划中。', tags: ['#学习', '#认知', '#效率'] },
                { text: '周末准备去公园写生，带上面包和咖啡，记录下秋天的颜色变化。', tags: ['#生活', '#艺术', '#记录'] }
            ];

            let currentNoteIndex = 0;
            let isRecording = false;
            let timer = null;

            // DOM
            const micBtn = document.getElementById('micBtn');
            const micLabel = document.getElementById('micLabel');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const transcriptArea = document.getElementById('transcriptArea');
            const placeholderText = document.getElementById('placeholderText');
            const transcriptText = document.getElementById('transcriptText');
            const aiTags = document.getElementById('aiTags');
            const timeline = document.getElementById('timeline');
            const noteCount = document.getElementById('noteCount');
            const graphNodes = document.getElementById('graphNodes');

            // ---- 渲染时间线 ----
            function renderTimeline() {
                const allNotes = [...demoNotes];
                // 如果有额外记录，从localStorage读取
                const stored = localStorage.getItem('wave_notes_extra');
                if (stored) {
                    try {
                        const extra = JSON.parse(stored);
                        if (Array.isArray(extra)) {
                            allNotes.push(...extra);
                        }
                    } catch (e) {}
                }

                timeline.innerHTML = '';
                if (allNotes.length === 0) {
                    timeline.innerHTML =
                    '<div style="color:rgba(255,255,255,0.15); text-align:center; padding:30px 0; font-size:13px;">还没有灵感记录<br>点击麦克风开始吧</div>';
                    noteCount.textContent = '0 条';
                    return;
                }

                // 显示最新的在前面（倒序）
                const sorted = [...allNotes].reverse();
                sorted.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'timeline-item';
                    div.innerHTML = `
                        <div class="item-title">
                            ${item.title}
                            <span class="ai-badge">AI</span>
                        </div>
                        <div class="item-preview">${item.preview}</div>
                        <div class="item-meta">
                            <div class="tags">
                                ${item.tags.map(t => `<span class="mini-tag">${t}</span>`).join('')}
                            </div>
                            <span class="time">${item.time || '刚刚'}</span>
                        </div>
                    `;
                    timeline.appendChild(div);
                });
                noteCount.textContent = allNotes.length + ' 条';
            }

            // ---- 模拟语音识别 ----
            function simulateVoiceInput() {
                // 从模拟数据中取一条
                const data = voiceSimulations[currentNoteIndex % voiceSimulations.length];
                currentNoteIndex++;

                // 显示转录文字
                placeholderText.style.display = 'none';
                transcriptText.style.display = 'block';
                transcriptText.innerHTML = `“${data.text}”`;

                // 更新标签
                aiTags.innerHTML = `
                    <div class="label-tip">
                        ✦ AI 智能生成
                        <span>自动提取</span>
                    </div>
                    ${data.tags.map(t => `<span class="tag glow">${t}</span>`).join('')}
                    <span class="tag" style="background:rgba(167,139,250,0.08);">#自动归档</span>
                `;

                // 添加到时间线（模拟保存）
                const newNote = {
                    id: Date.now(),
                    title: data.tags[0] + ' · ' + data.text.slice(0, 12) + '...',
                    preview: data.text.slice(0, 40) + (data.text.length > 40 ? '...' : ''),
                    tags: data.tags,
                    time: '刚刚'
                };

                // 存储到localStorage
                let stored = localStorage.getItem('wave_notes_extra');
                let extra = [];
                if (stored) {
                    try { extra = JSON.parse(stored); } catch (e) {}
                }
                extra.push(newNote);
                localStorage.setItem('wave_notes_extra', JSON.stringify(extra));

                // 重新渲染时间线
                renderTimeline();

                // 更新图谱（随机增加关键词）
                const newWords = data.tags.map(t => t.replace('#', ''));
                const existingNodes = graphNodes.querySelectorAll('.node');
                const existingTexts = Array.from(existingNodes).map(el => el.textContent);
                newWords.forEach(word => {
                    if (!existingTexts.includes(word) && word.length > 0) {
                        const span = document.createElement('span');
                        span.className = 'node active';
                        span.textContent = word;
                        // 插入到 connector 之前
                        const lastConnector = graphNodes.querySelector('.connector:last-of-type');
                        if (lastConnector) {
                            graphNodes.insertBefore(span, lastConnector);
                            const newConnector = document.createElement('span');
                            newConnector.className = 'connector';
                            newConnector.textContent = '·';
                            graphNodes.insertBefore(newConnector, lastConnector);
                        } else {
                            graphNodes.appendChild(span);
                        }
                    }
                });
            }

            // ---- 麦克风交互 ----
            function toggleRecording() {
                isRecording = !isRecording;

                if (isRecording) {
                    micBtn.classList.add('recording');
                    micLabel.textContent = '🔴 录音中...';
                    micLabel.classList.add('active');
                    statusDot.className = 'dot';
                    statusText.textContent = '收听中';

                    // 模拟录音过程 (2.5秒后完成)
                    if (timer) clearTimeout(timer);
                    timer = setTimeout(() => {
                        // 完成录音
                        isRecording = false;
                        micBtn.classList.remove('recording');
                        micLabel.textContent = '✅ 识别完成';
                        micLabel.classList.remove('active');
                        statusDot.className = 'dot idle';
                        statusText.textContent = '已识别';

                        // 模拟语音转文字
                        simulateVoiceInput();

                        // 重置状态
                        setTimeout(() => {
                            micLabel.textContent = '点击录音';
                            statusText.textContent = '待命';
                        }, 1800);

                        timer = null;
                    }, 2200);

                } else {
                    // 手动停止
                    micBtn.classList.remove('recording');
                    micLabel.textContent = '⏹ 已停止';
                    micLabel.classList.remove('active');
                    statusDot.className = 'dot idle';
                    statusText.textContent = '待命';
                    if (timer) {
                        clearTimeout(timer);
                        timer = null;
                    }
                    setTimeout(() => {
                        micLabel.textContent = '点击录音';
                    }, 600);
                }
            }

            // ---- 事件绑定 ----
            micBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                this.classList.add('clicked');
                setTimeout(() => this.classList.remove('clicked'), 200);
                toggleRecording();
            });

            // ---- 初始化 ----
            renderTimeline();

            // 处理图谱节点点击（无实际功能，仅展示交互感）
            document.querySelectorAll('.node').forEach(node => {
                node.addEventListener('click', function() {
                    this.style.transition = '0.1s';
                    this.style.transform = 'scale(0.9)';
                    setTimeout(() => {
                        this.style.transform = 'scale(1)';
                    }, 120);
                });
            });

            console.log('🎤 声波笔记 · 语音灵感捕手 已启动');
            console.log('💡 点击麦克风模拟语音记录，AI自动生成标题和标签');
        })();
    </script>
</body>
</html>
