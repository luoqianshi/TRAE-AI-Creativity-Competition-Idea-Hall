<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>理财随手记 - 上班族投资持仓分析助手</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <span class="logo">💰</span>
        <h1>理财随手记</h1>
      </div>
      <button id="addBtn" class="btn-add">+ 添加持仓</button>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- 空状态引导 -->
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">📊</div>
        <h2>欢迎使用理财随手记</h2>
        <p>添加你的第一笔持仓，开启智能投资分析之旅</p>
        <button class="btn-primary" id="startBtn">立即添加</button>
      </div>

      <!-- 有数据时的展示 -->
      <div id="dashboard" class="dashboard hidden">
        <!-- 总览卡片 -->
        <section class="card overview-card">
          <h3>📊 总览</h3>
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-label">总持仓</span>
              <span class="stat-value" id="totalAmount">¥0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">盈亏</span>
              <span class="stat-value" id="totalProfit">¥0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">收益率</span>
              <span class="stat-value" id="totalReturn">0%</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">大盘对比</span>
              <span class="stat-value" id="vsMarket">0%</span>
            </div>
          </div>
        </section>

        <!-- 时间段分析 -->
        <section class="card analysis-card">
          <h3>📈 时间段分析</h3>
          <div class="tabs">
            <button class="tab active" data-period="1m">近1月</button>
            <button class="tab" data-period="3m">近3月</button>
            <button class="tab" data-period="6m">近6月</button>
            <button class="tab" data-period="1y">近1年</button>
          </div>
          <div class="chart-container">
            <div class="return-bars">
              <div class="bar-item">
                <span class="bar-label">你的收益</span>
                <div class="bar-wrapper">
                  <div class="bar mine" id="myBar"></div>
                </div>
                <span class="bar-value" id="myReturn">0%</span>
              </div>
              <div class="bar-item">
                <span class="bar-label">沪深300</span>
                <div class="bar-wrapper">
                  <div class="bar market" id="marketBar"></div>
                </div>
                <span class="bar-value" id="marketReturn">0%</span>
              </div>
            </div>
          </div>
        </section>

        <!-- 风险评估 -->
        <section class="card risk-card">
          <h3>⚠️ 风险评估</h3>
          <div class="risk-list" id="riskList">
          </div>
        </section>

        <!-- 调仓建议 -->
        <section class="card suggestion-card">
          <h3>💡 调仓建议</h3>
          <div class="suggestion-list" id="suggestionList">
          </div>
        </section>

        <!-- 智能问答 -->
        <section class="card chat-card">
          <h3>💬 智能问答</h3>
          <div class="chat-messages" id="chatMessages">
            <div class="message ai">
              你好！我是你的AI投资助手。有什么关于持仓的问题可以问我，比如"我应该加仓吗？"或"我的风险大吗？"
            </div>
          </div>
          <div class="chat-input-wrapper">
            <input type="text" id="chatInput" placeholder="问我任何关于你持仓的问题...">
            <button id="sendBtn">发送</button>
          </div>
        </section>

        <!-- 持仓列表 -->
        <section class="card holdings-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h3 style="margin: 0;">📋 持仓明细</h3>
            <button id="resetBtn" style="background: var(--bg); border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--text-secondary);">重置演示数据</button>
          </div>
          <div class="holdings-list" id="holdingsList">
          </div>
        </section>
      </div>
    </main>

    <!-- 添加/编辑持仓弹窗 -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">添加持仓</h3>
          <button class="modal-close" id="modalClose">×</button>
        </div>
        <form id="holdingForm">
          <div class="form-group">
            <label for="assetType">资产类型</label>
            <select id="assetType" required>
              <option value="fund">基金</option>
              <option value="stock">股票</option>
            </select>
          </div>
          <div class="form-group">
            <label for="assetName">资产名称</label>
            <input type="text" id="assetName" placeholder="如：易方达蓝筹精选" required>
          </div>
          <div class="form-group">
            <label for="assetAmount">持仓金额（元）</label>
            <input type="number" id="assetAmount" placeholder="10000" min="0" step="0.01" required>
          </div>
          <div class="form-group">
            <label for="assetDate">买入日期</label>
            <input type="date" id="assetDate" required>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-secondary" id="cancelBtn">取消</button>
            <button type="submit" class="btn-primary">确认添加</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
