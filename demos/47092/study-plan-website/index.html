<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus · 极简学习计划</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="light">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">●</span>
        <span class="brand-name">Focus</span>
      </div>
      <nav class="nav">
        <a href="#" class="nav-link active" data-page="dashboard">
          <span class="nav-number">01</span>
          <span class="nav-label">仪表盘</span>
        </a>
        <a href="#" class="nav-link" data-page="plans">
          <span class="nav-number">02</span>
          <span class="nav-label">学习计划</span>
        </a>
        <a href="#" class="nav-link" data-page="calendar">
          <span class="nav-number">03</span>
          <span class="nav-label">学习日历</span>
        </a>
        <a href="#" class="nav-link" data-page="stats">
          <span class="nav-number">04</span>
          <span class="nav-label">数据统计</span>
        </a>
        <a href="#" class="nav-link" data-page="focus">
          <span class="nav-number">05</span>
          <span class="nav-label">专注计时</span>
        </a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <span class="theme-icon theme-light">☼</span>
        <span class="theme-icon theme-dark">☾</span>
      </button>
      <footer class="sidebar-footer">
        <p>极致简约</p>
      </footer>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 class="page-title" id="pageTitle">仪表盘</h1>
          <p class="page-subtitle" id="dateDisplay"></p>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-secondary" id="exportBtn">导出数据</button>
          <button class="btn btn-primary" id="quickFocusBtn">开始专注</button>
        </div>
      </header>

      <section class="page active" id="dashboard">
        <div class="hero">
          <h2 class="greeting" id="greeting">你好，今天想学什么？</h2>
          <p class="greeting-sub">把宏大的目标，拆成每一天的小事。</p>
        </div>
        <div class="grid grid-3">
          <div class="stat-card">
            <span class="stat-label">今日待办</span>
            <span class="stat-value" id="statToday">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">累计专注</span>
            <span class="stat-value"><span id="statMinutes">0</span><small>min</small></span>
          </div>
          <div class="stat-card">
            <span class="stat-label">完成率</span>
            <span class="stat-value"><span id="statRate">0</span><small>%</small></span>
          </div>
        </div>
        <div class="panel">
          <div class="panel-header">
            <h3>今日任务</h3>
            <button class="btn-text" id="goToPlans">管理计划 →</button>
          </div>
          <ul class="task-list" id="todayTasks"></ul>
          <div class="empty-state" id="todayEmpty">
            <p>今天还没有任务。去「学习计划」添加一个吧。</p>
          </div>
        </div>
      </section>

      <section class="page" id="plans">
        <div class="panel panel-form" id="planFormPanel">
          <div class="panel-header">
            <h3>新建学习计划</h3>
            <button class="btn-text" id="closePlanForm">取消</button>
          </div>
          <form class="form" id="planForm">
            <div class="form-row">
              <label class="form-field">
                <span>计划名称</span>
                <input type="text" name="title" placeholder="例如：雅思备考" required>
              </label>
              <label class="form-field">
                <span>分类</span>
                <input type="text" name="category" placeholder="例如：语言 / 编程">
              </label>
            </div>
            <div class="form-row">
              <label class="form-field">
                <span>目标日期</span>
                <input type="date" name="deadline" required>
              </label>
              <label class="form-field">
                <span>每日目标时长（分钟）</span>
                <input type="number" name="dailyMinutes" value="60" min="5" max="600">
              </label>
            </div>
            <label class="form-field">
              <span>描述</span>
              <textarea name="description" rows="2" placeholder="写下你的目标与动力"></textarea>
            </label>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">创建计划</button>
            </div>
          </form>
        </div>
        <div class="panel-header plan-list-header">
          <h3>我的计划</h3>
          <button class="btn btn-primary" id="showPlanForm">+ 新建计划</button>
        </div>
        <div class="plan-grid" id="planGrid"></div>
      </section>

      <section class="page" id="calendar">
        <div class="calendar-wrap">
          <div class="calendar-header">
            <button class="btn-text" id="prevMonth">← 上月</button>
            <h3 id="calendarMonth"></h3>
            <button class="btn-text" id="nextMonth">下月 →</button>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </div>
        <div class="panel" id="dayPanel">
          <div class="panel-header">
            <h3 id="selectedDate">选择日期</h3>
            <span class="task-count" id="dayTaskCount"></span>
          </div>
          <ul class="task-list" id="dayTasks"></ul>
        </div>
      </section>

      <section class="page" id="stats">
        <div class="grid grid-2">
          <div class="panel">
            <h3>完成趋势（近7天）</h3>
            <div class="bar-chart" id="weekChart"></div>
          </div>
          <div class="panel">
            <h3>总体概览</h3>
            <div class="overview-list">
              <div class="overview-item">
                <span>计划总数</span>
                <strong id="overviewPlans">0</strong>
              </div>
              <div class="overview-item">
                <span>任务总数</span>
                <strong id="overviewTasks">0</strong>
              </div>
              <div class="overview-item">
                <span>已完成</span>
                <strong id="overviewCompleted">0</strong>
              </div>
              <div class="overview-item">
                <span>专注次数</span>
                <strong id="overviewSessions">0</strong>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="page" id="focus">
        <div class="focus-stage">
          <div class="focus-modes">
            <button class="mode-btn active" data-mode="focus">专注</button>
            <button class="mode-btn" data-mode="short">短休息</button>
            <button class="mode-btn" data-mode="long">长休息</button>
          </div>
          <div class="timer" id="timerDisplay">25:00</div>
          <p class="timer-label" id="timerLabel">保持专注，直到计时结束。</p>
          <div class="timer-controls">
            <button class="btn btn-primary btn-large" id="timerToggle">开始</button>
            <button class="btn btn-secondary" id="timerReset">重置</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
