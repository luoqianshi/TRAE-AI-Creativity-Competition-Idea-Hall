const PIXEL_WIDTH = 16;
const PIXEL_HEIGHT = 16;

function random(seed) {

                const x = pixel % PIXEL_WIDTH;
                for (let channel = 0; channel < 3; channel += 1)

}

    return {
        create() {

            for (let seed = 100; seed < 106; seed += 1)
                samples.push(sample(`snow-wolf-${seed}`, "wolf", "snow", seed, 1));
            for (let seed = 200; seed < 206; seed += 1)
                samples.push(sample(`grass-husky-${seed}`, "husky", "grass", seed, 0));
            samples.push(sample("mislabeled-snow-husky-990", "husky", "snow", 990, 1));
            const caseFile = { id: "case-snow-husky-999", pixels: generatePixels("husky", "snow", 999), species: "husky", background: "snow", syntheticTruth: 0, seed: 999 };

/* dist/src/core/model.js */


function predict(model, pixels) {
    let logit = model.bias;
    for (let i = 0; i < pixels.length; i += 1)
        logit += (pixels[i] ?? 0) * (model.weights[i] ?? 0);
    const clipped = Math.max(-20, Math.min(20, logit));
    const wolfProbability = 1 / (1 + Math.exp(-clipped));

    for (let epoch = 0; epoch < config.epochs; epoch += 1) {

        const gradient = new Float64Array(PIXEL_DIMENSIONS);
        active.forEach((sample, row) => { const error = errors[row] ?? 0; for (let i = 0; i < PIXEL_DIMENSIONS; i += 1)
            gradient[i] = (gradient[i] ?? 0) + ((sample.pixels[i] ?? 0) * error) / active.length; });
        for (let i = 0; i < PIXEL_DIMENSIONS; i += 1)

        bias -= config.learningRate * errors.reduce((sum, value) => sum + value, 0) / active.length;

            let loss = 0;
            for (const sample of active) {
                const probability = Math.max(1e-7, Math.min(1 - 1e-7, predict({ weights, bias, lossHistory }, sample.pixels).wolfProbability));
                loss += -(sample.observedLabel * Math.log(probability) + (1 - sample.observedLabel) * Math.log(1 - probability)) / active.length;
            }
            lossHistory.push({ epoch: epoch + 1, loss: loss + 0.5 * config.l2 * weights.reduce((sum, weight) => sum + weight * weight, 0) });

function caseLoss(model, pixels, truth = 0) {
    const probability = Math.max(1e-7, Math.min(1 - 1e-7, predict(model, pixels).wolfProbability));
    return -(truth * Math.log(probability) + (1 - truth) * Math.log(1 - probability));
}
function evaluateModel(model, testSet) {
    let correct = 0;

        const isCorrect = (prediction.wolfProbability >= 0.5 ? 1 : 0) === sample.syntheticTruth;
        correct += isCorrect ? 1 : 0;
        const key = `${sample.background}-${sample.species}`;
        groups[key] ??= { correct: 0, total: 0 };
        groups[key].correct += isCorrect ? 1 : 0;
        groups[key].total += 1;

    let consistent = 0;
    for (const [species, base] of [["wolf", 900], ["husky", 950]])

/* dist/src/core/engine.js */


const CONFIG = { learningRate: 0.15, epochs: 500, l2: 0.01, initialization: "zeros", shuffle: false };

function emptyRepair(snapshot) {

function assertValidRepair(repair) {
    const ids = repair.samples.map((sample) => sample.id);
    if (new Set(ids).size !== ids.length)
        throw new Error("修复训练集不能包含重复 sample ID");
    const active = repair.samples.filter((sample) => sample.active);
    if (active.length < 2 || new Set(active.map((sample) => sample.observedLabel)).size < 2)

}

    switch (action.type) {
        case "apply-repair":

        case "undo-repair": {

            return { ...state, repairDataset: previous, repairHistory: state.repairHistory.slice(0, -1), evaluation: null, evaluationStatus: previous.actions.length > 0 ? "stale" : "none" };
        }
        case "reset-repairs":
            return { ...state, repairDataset: emptyRepair(state.baselineSnapshot), repairHistory: [], evaluation: null, evaluationStatus: "none" };
        case "run-started":
            return { ...state, runId: action.runId, runStatus: "running", evaluation: null, evaluationStatus: "stale" };
        case "run-completed":

        <section class="action-row"><div><span class="eyebrow">CURRENT STEP</span><p class="muted">${state.investigation ? "影响榜已生成，下一步可以重审训练数据。" : state.counterfactual ? "背景变化提供了排查线索，可以开始逐样本追查。" : "准备好后，进入这次错判的重审流程。"}</p></div><button class="button primary" id="continue" ${state.status !== "ready" || state.investigationLoading || Boolean(state.investigation) ? "disabled" : ""}>${state.investigation ? "追查已完成" : state.counterfactual ? "开始逐样本追查" : "重审这次错判"}<span>↗</span></button></section>
      </main><footer><span>错判重审 · v0.1 初赛 Demo</span><span>所有数据由程序生成 · 不上传图片</span></footer>
    </div>`;
    paintCanvas("case-canvas", snapshot?.caseFile.pixels);
    if (state.counterfactual) {
        paintCanvas("cf-snow", state.counterfactual.snowPixels);
        paintCanvas("cf-grass", state.counterfactual.grassPixels);
    }
    document.querySelector("#retry")?.addEventListener("click", () => { void train(); });
    document.querySelector("#continue")?.addEventListener("click", () => { void advance(); });
    document.querySelectorAll("[data-preset]").forEach((button) => button.addEventListener("click", () => { if (!state.lab || !state.snapshot)
        return; const preset = button.dataset.preset; state.selectedPreset = preset; state.lab = labReducer(state.lab, { type: "apply-repair", repair: engine.createRepair(state.snapshot, preset) }); render(); }));
    document.querySelector("#undo-repair")?.addEventListener("click", () => { if (state.lab) {
        state.lab = labReducer(state.lab, { type: "undo-repair" });
        render();
    } });
    document.querySelector("#reset-repairs")?.addEventListener("click", () => { if (state.lab) {
        state.lab = labReducer(state.lab, { type: "reset-repairs" });
        render();
    } });
    document.querySelector("#run-repair")?.addEventListener("click", () => { void runRepair(); });
    document.querySelector("#download-report")?.addEventListener("click", downloadReport);
    document.querySelector("#toggle-background")?.addEventListener("click", () => { state.counterfactualView = state.counterfactualView === "both" ? "snow" : state.counterfactualView === "snow" ? "grass" : "both"; render(); });
}
async function train() {
    const run = ++activeRun;
    state.status = "loading";
    state.error = null;
    state.snapshot = null;
    state.counterfactual = null;
    state.counterfactualView = "both";
    state.investigation = null;
    state.investigationLoading = false;
    state.lab = null;
    state.progress = null;
    state.entered = false;
    render();
    try {
        state.snapshot = await engine.trainBaseline({ onProgress: (progress) => { if (run !== activeRun)
                return; state.progress = progress; render(); } });
        if (run !== activeRun)
            return;
        state.lab = createLabState(state.snapshot);
        state.status = "ready";
    }
    catch (error) {
        if (run !== activeRun)
            return;
        state.status = "error";
        state.error = error instanceof Error ? error.message : "训练失败，请重试";
    }
    render();
}
async function advance() {
    if (!state.snapshot)
        return;
    if (!state.counterfactual) {
        state.counterfactual = engine.counterfactual(state.snapshot);
        state.entered = true;
        render();
        return;
    }
    state.investigationLoading = true;
    state.progress = null;
    render();
    const run = activeRun;
    try {
        const investigation = await engine.investigate(state.snapshot, { onProgress: (progress) => { if (run !== activeRun)
                return; state.progress = progress; render(); }, yieldToBrowser: async () => { await new Promise((resolve) => setTimeout(resolve, 0)); } });
        if (run !== activeRun)
            return;
        state.investigation = investigation;
        state.investigationLoading = false;
    }
    catch (error) {
        if (run !== activeRun)
            return;
        state.investigationLoading = false;
        state.error = error instanceof Error ? error.message : "逐样本调查失败，请重试";
    }
    render();
}
async function runRepair() {
    if (!state.snapshot || !state.lab || state.lab.repairDataset.actions.length === 0)
        return;
    const runId = state.lab.runId + 1;
    const run = activeRun;
    state.lab = labReducer(state.lab, { type: "run-started", runId });
    state.progress = null;
    render();
    try {
        const evaluation = await engine.evaluateRepair(state.snapshot, state.lab.repairDataset, { onProgress: (progress) => { if (run !== activeRun)
                return; state.progress = progress; render(); } });
        if (run !== activeRun || !state.lab)
            return;
        state.lab = labReducer(state.lab, { type: "run-completed", runId, evaluation });
    }
    catch (error) {
        if (run !== activeRun)
            return;
        state.error = error instanceof Error ? error.message : "复训失败，请重试";
    }
    render();
}
function downloadReport() {
    if (!state.snapshot || !state.counterfactual || !state.investigation || !state.lab?.evaluation)
        return;
    const report = composeReport({ baseline: state.snapshot, counterfactual: state.counterfactual, investigation: state.investigation, repair: state.lab.repairDataset, evaluation: state.lab.evaluation });
    const url = URL.createObjectURL(new Blob([report], { type: "text/markdown;charset=utf-8" }));
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = "cuopan-retrial-report.md";
    anchor.click();
    window.setTimeout(() => URL.revokeObjectURL(url), 1000);
}
render();
void train();
</script></body></html>
