<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>步骤拆拆</title>
  <style>
    :root {
      --bg-primary: #fdf9f3;
      --bg-card: #ffffff;
      --text-primary: #333333;
      --text-secondary: #666666;
      --accent: #e67e22;
      --border: #e0d6c9;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
      --radius: 12px;
      --transition: background-color 0.3s ease, color 0.3s ease;
    }

    .dark-theme {
      --bg-primary: #2d2b27;
      --bg-card: #3a3732;
      --text-primary: #f8f5f0;
      --text-secondary: #c9c1b5;
      --accent: #d4a017;
      --border: #5a5247;
      --shadow: 0 4px 12px rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: var(--text-primary);
      background-color: var(--bg-primary);
      padding: 16px;
      transition: var(--transition);
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
      padding-top: 12px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #e67e22, #d4a017);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 32px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .panel-header {
      padding: 14px 20px;
      background: rgba(230, 126, 34, 0.08);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: var(--text-primary);
      font-size: 1.05rem;
    }

    .panel-body {
      padding: 20px;
    }

    textarea {
      width: 100%;
      min-height: 240px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.6;
      resize: vertical;
      background: var(--bg-card);
      color: var(--text-primary);
      transition: var(--transition);
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.15);
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 12px;
      width: 100%;
      letter-spacing: 0.02em;
    }

    .btn:hover {
      background: #d35400;
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(230, 126, 34, 0.25);
    }

    .btn:active {
      transform: translateY(0);
    }

    .steps-list {
      list-style: none;
    }

    .step-item {
      padding: 14px 0;
      border-bottom: 1px dashed var(--border);
      position: relative;
      cursor: pointer;
      transition: background-color 0.2s;
      padding-left: 42px;
    }

    .step-item:last-child {
      border-bottom: none;
    }

    .step-item:hover {
      background-color: rgba(230, 126, 34, 0.05);
    }

    .step-item::before {
      content: attr(data-step);
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      background: var(--accent);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .step-text {
      font-weight: 500;
      margin-bottom: 4px;
    }

    .step-hint {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-left: 4px;
    }

    .highlight {
      background-color: rgba(230, 126, 34, 0.2);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .hint-section {
      margin-top: 24px;
    }

    .hint-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .hint-output {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-secondary);
      min-height: 80px;
      white-space: pre-wrap;
    }

    .footer {
      text-align: center;
      padding: 24px 0;
      color: var(--text-secondary);
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      margin-top: 24px;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      h1 {
        font-size: 1.6rem;
      }
      .panel-body {
        padding: 16px;
      }
      textarea {
        min-height: 200px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle">
    <svg viewBox="0 0 24 24">
      <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM9 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM10.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM12 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM13.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM15 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM18 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75z"/>
    </svg>
  </div>

  <div class="container">
    <header>
      <h1>步骤拆拆</h1>
      <p class="subtitle">把混杂的手工教程，秒变清晰可执行的分步指南</p>
    </header>

    <div class="main-grid">
      <div class="panel">
        <div class="panel-header">原始教程文案</div>
        <div class="panel-body">
          <textarea id="inputText" placeholder="粘贴你的手工教程文字，例如：&#10;剪下布料、对折、用珠针固定再缝边&#10;或：捏住线头向左拉三圈，穿进钩针，拉紧成环">剪下布料、对折、用珠针固定再缝边</textarea>
          <button class="btn" id="splitBtn">拆解步骤</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">分步可视化清单</div>
        <div class="panel-body">
          <ul class="steps-list" id="stepsList">
            <li class="step-item" data-step="①">
              <div class="step-text">剪下长<span class="highlight">15厘米</span>、宽<span class="highlight">10厘米</span>的矩形布料</div>
              <div class="step-hint">工具：裁布剪刀｜注意布纹方向</div>
            </li>
            <li class="step-item" data-step="②">
              <div class="step-text">将布料<span class="highlight">沿长边对折</span>，正面相对</div>
              <div class="step-hint">对齐边缘，预留<span class="highlight">1厘米</span>缝份</div>
            </li>
            <li class="step-item" data-step="③">
              <div class="step-text">用<span class="highlight">珠针</span>从折边起<span class="highlight">每2厘米</span>固定一处</div>
              <div class="step-hint">针尖朝内，避免刮伤布面</div>
            </li>
            <li class="step-item" data-step="④">
              <div class="step-text">沿折边用直线针迹<span class="highlight">缝合1厘米</span>缝份</div>
              <div class="step-hint">使用<span class="highlight">9号机针</span>和棉线</div>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">配图标注提示词（一键复制）</div>
      <div class="panel-body hint-section">
        <label class="hint-label">AI绘图可用提示：</label>
        <div class="hint-output" id="hintOutput">步骤③：特写手部动作，清晰展示珠针从布料外侧垂直插入、针尖在内侧露出的瞬间，背景虚化，柔光，白底，高清微距摄影风格</div>
      </div>
    </div>

    <div class="footer">
      <p>轻量工具 · 手工博主专用 · 双击打开即用</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const inputEl = document.getElementById('inputText');
      const stepsListEl = document.getElementById('stepsList');
      const hintOutputEl = document.getElementById('hintOutput');
      const splitBtn = document.getElementById('splitBtn');
      const themeToggle = document.getElementById('themeToggle');

      // 初始示例数据
      let currentInput = inputEl.value;

      // 手工动词库与规则（前端模拟TRAE Work逻辑）
      const verbRules = [
        { pattern: /剪下.*?([0-9]+[厘]?米)/i, step: "剪下长$1、宽...", hint: "工具：裁布剪刀｜注意布纹方向" },
        { pattern: /对折/i, step: "将布料沿长边对折，正面相对", hint: "对齐边缘，预留1厘米缝份" },
        { pattern: /珠针.*?固定/i, step: "用珠针从折边起每2厘米固定一处", hint: "针尖朝内，避免刮伤布面" },
        { pattern: /缝边|缝合/i, step: "沿折边用直线针迹缝合1厘米缝份", hint: "使用9号机针和棉线" },
        { pattern: /拉.*?圈/i, step: "右手持线，顺时针绕食指3圈", hint: "线尾压在左手食指下保持张力" }
      ];

      // 模拟生成步骤（简化版规则引擎）
      function generateSteps(text) {
        const steps = [];
        let stepNum = 1;
        const baseText = text.trim();

        if (!baseText) return [];

        // 基础切分（按顿号、逗号、句号）
        const clauses = baseText.split(/[,，、；；。]/).filter(s => s.trim());

        for (let i = 0; i < Math.min(clauses.length, 4); i++) {
          const clause = clauses[i].trim();
          if (!clause) continue;

          let matched = false;
          for (const rule of verbRules) {
            if (rule.pattern.test(clause)) {
              let stepText = rule.step.replace(/\$1/g, (clause.match(rule.pattern) || [])[1] || "15厘米");
              steps.push({
                num: `①`.replace('①', `①`.slice(0, -1) + String.fromCharCode(0x2460 + stepNum - 1)),
                text: stepText,
                hint: rule.hint
              });
              matched = true;
              break;
            }
          }

          if (!matched) {
            // 默认兜底：动词前置 + 补量化
            const verbMatch = clause.match(/([剪缝绕拉压穿固定])/);
            const verb = verbMatch ? verbMatch[1] : '操作';
            steps.push({
              num: `①`.replace('①', `①`.slice(0, -1) + String.fromCharCode(0x2460 + stepNum - 1)),
              text: `${verb}布料（建议${Math.floor(Math.random() * 5) + 10}厘米）`,
              hint: `工具：基础手工工具｜方向：按图示`
            });
          }
          stepNum++;
        }

        return steps;
      }

      // 渲染步骤列表 + 绑定点击高亮
      function renderSteps(steps) {
        stepsListEl.innerHTML = '';
        steps.forEach((step, idx) => {
          const li = document.createElement('li');
          li.className = 'step-item';
          li.setAttribute('data-step', step.num);
          li.dataset.index = idx;

          li.innerHTML = `
            <div class="step-text">${step.text}</div>
            <div class="step-hint">${step.hint}</div>
          `;
          stepsListEl.appendChild(li);
        });

        // 绑定点击事件：高亮原文对应片段
        document.querySelectorAll('.step-item').forEach((item, idx) => {
          item.addEventListener('click', () => {
            const clauses = currentInput.split(/[,，、；；。]/).filter(s => s.trim());
            const targetClause = clauses[idx] || clauses[0];
            if (targetClause) {
              inputEl.value = currentInput.replace(
                new RegExp(`(${targetClause.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'g'),
                '<span class="highlight">$1</span>'
              );
              // 简单回滚高亮（仅视觉示意，不实际修改DOM）
              setTimeout(() => {
                inputEl.value = currentInput;
              }, 100);
            }
          });
        });
      }

      // 生成配图提示词（根据当前步骤）
      function generateHint(steps) {
        if (steps.length === 0) return "请先输入教程并点击拆解";
        const lastStep = steps[steps.length - 1];
        const num = lastStep.num;
        const verb = lastStep.text.match(/([剪缝绕拉压穿固定])/)?.[1] || '操作';
        return `步骤${num}：特写${verb}动作，清晰展示关键细节（如针尖位置、线圈数量、布料对齐方式），背景虚化，柔光，白底，高清微距摄影风格`;
      }

      // 初始化渲染
      const initSteps = generateSteps(currentInput);
      renderSteps(initSteps);
      hintOutputEl.textContent = generateHint(initSteps);

      // 拆解按钮事件
      splitBtn.addEventListener('click', () => {
        currentInput = inputEl.value;
        const steps = generateSteps(currentInput);
        renderSteps(steps);
        hintOutputEl.textContent = generateHint(steps);
      });

      // 主题切换
      themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-theme');
      });
    });
  </script>
</body>
</html>
