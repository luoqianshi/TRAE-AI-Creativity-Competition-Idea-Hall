<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物品记忆助手 - 拍照即定位</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

    :root {
        --bg: #F5F0E8;
        --card: #FFFFFF;
        --ink: #2C2C2C;
        --ink-light: #6B6B6B;
        --accent: #C17F59;
        --accent-light: #E8C4A8;
        --accent-dark: #8B5E3C;
        --success: #5B8C5A;
        --danger: #C25B5B;
        --shadow: rgba(0,0,0,0.06);
        --shadow-hover: rgba(0,0,0,0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Noto Sans SC', sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* Hero Section */
    .hero {
        text-align: center;
        padding: 60px 20px 40px;
        position: relative;
    }

    .hero::before {
        content: '';
        position: absolute;
        top: -100px;
        right: -100px;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, var(--accent-light) 0%, transparent 70%);
        opacity: 0.4;
        pointer-events: none;
    }

    .hero::after {
        content: '';
        position: absolute;
        bottom: -50px;
        left: -50px;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, var(--accent-light) 0%, transparent 70%);
        opacity: 0.3;
        pointer-events: none;
    }

    .hero h1 {
        font-family: 'Noto Serif SC', serif;
        font-size: 2.8rem;
        font-weight: 700;
        color: var(--ink);
        margin-bottom: 12px;
        position: relative;
        z-index: 1;
    }

    .hero .tagline {
        font-size: 1.1rem;
        color: var(--ink-light);
        font-weight: 300;
        position: relative;
        z-index: 1;
    }

    .hero .divider {
        width: 60px;
        height: 3px;
        background: var(--accent);
        margin: 20px auto;
        border-radius: 2px;
    }

    /* Main Container */
    .container {
        max-width: 480px;
        margin: 0 auto;
        padding: 0 20px 60px;
        position: relative;
        z-index: 1;
    }

    /* Camera Section */
    .camera-section {
        background: var(--card);
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 8px 32px var(--shadow);
        margin-bottom: 20px;
        transition: box-shadow 0.3s ease;
    }

    .camera-section:hover {
        box-shadow: 0 12px 40px var(--shadow-hover);
    }

    .section-title {
        font-family: 'Noto Serif SC', serif;
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .section-title .icon {
        width: 28px;
        height: 28px;
        background: var(--accent);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 14px;
    }

    .camera-preview {
        width: 100%;
        aspect-ratio: 4/3;
        background: linear-gradient(135deg, #E8E4DE 0%, #D4CFC7 100%);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        position: relative;
        overflow: hidden;
        border: 2px dashed var(--accent-light);
    }

    .camera-preview.has-image {
        border: none;
        background: none;
    }

    .camera-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 16px;
    }

    .camera-placeholder {
        text-align: center;
        color: var(--ink-light);
    }

    .camera-placeholder .camera-icon {
        font-size: 48px;
        margin-bottom: 12px;
        opacity: 0.5;
    }

    .camera-placeholder p {
        font-size: 0.95rem;
    }

    .camera-actions {
        display: flex;
        gap: 12px;
    }

    .btn {
        flex: 1;
        padding: 14px 20px;
        border: none;
        border-radius: 12px;
        font-family: 'Noto Sans SC', sans-serif;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .btn-primary {
        background: var(--accent);
        color: white;
    }

    .btn-primary:hover {
        background: var(--accent-dark);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(193,127,89,0.3);
    }

    .btn-secondary {
        background: var(--bg);
        color: var(--ink);
        border: 1px solid #E0DCD6;
    }

    .btn-secondary:hover {
        background: #EBE7DF;
        transform: translateY(-2px);
    }

    input[type="file"] {
        display: none;
    }

    /* Form Section */
    .form-section {
        background: var(--card);
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 8px 32px var(--shadow);
        margin-bottom: 20px;
    }

    .form-group {
        margin-bottom: 16px;
    }

    .form-group label {
        display: block;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--ink);
        margin-bottom: 8px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 12px 16px;
        border: 1.5px solid #E0DCD6;
        border-radius: 12px;
        font-family: 'Noto Sans SC', sans-serif;
        font-size: 1rem;
        background: var(--bg);
        transition: border-color 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: var(--accent);
    }

    .form-group textarea {
        resize: vertical;
        min-height: 80px;
    }

    .location-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
    }

    .location-tag {
        padding: 6px 14px;
        background: var(--bg);
        border: 1.5px solid #E0DCD6;
        border-radius: 20px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .location-tag:hover,
    .location-tag.active {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
    }

    /* Items List */
    .items-section {
        background: var(--card);
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 8px 32px var(--shadow);
    }

    .items-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
    }

    .items-count {
        font-size: 0.9rem;
        color: var(--ink-light);
    }

    .search-box {
        width: 100%;
        padding: 12px 16px;
        border: 1.5px solid #E0DCD6;
        border-radius: 12px;
        font-family: 'Noto Sans SC', sans-serif;
        font-size: 1rem;
        background: var(--bg);
        margin-bottom: 16px;
    }

    .search-box:focus {
        outline: none;
        border-color: var(--accent);
    }

    .item-card {
        display: flex;
        gap: 16px;
        padding: 16px;
        background: var(--bg);
        border-radius: 16px;
        margin-bottom: 12px;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .item-card:hover {
        transform: translateX(4px);
        box-shadow: 0 4px 16px var(--shadow);
    }

    .item-image {
        width: 80px;
        height: 80px;
        border-radius: 12px;
        object-fit: cover;
        flex-shrink: 0;
    }

    .item-info {
        flex: 1;
        min-width: 0;
    }

    .item-name {
        font-weight: 600;
        font-size: 1rem;
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .item-location {
        font-size: 0.85rem;
        color: var(--accent);
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .item-note {
        font-size: 0.8rem;
        color: var(--ink-light);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .item-date {
        font-size: 0.75rem;
        color: #999;
        margin-top: 4px;
    }

    .delete-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: none;
        background: rgba(194,91,91,0.1);
        color: var(--danger);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        flex-shrink: 0;
        align-self: center;
    }

    .delete-btn:hover {
        background: var(--danger);
        color: white;
    }

    .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--ink-light);
    }

    .empty-state .empty-icon {
        font-size: 48px;
        margin-bottom: 16px;
        opacity: 0.4;
    }

    .empty-state p {
        font-size: 0.95rem;
    }

    /* Toast Notification */
    .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: var(--ink);
        color: white;
        padding: 14px 28px;
        border-radius: 12px;
        font-size: 0.95rem;
        z-index: 1000;
        opacity: 0;
        transition: all 0.4s ease;
        box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }

    /* Modal */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
        opacity: 1;
        pointer-events: all;
    }

    .modal {
        background: var(--card);
        border-radius: 24px;
        padding: 24px;
        max-width: 90%;
        width: 400px;
        max-height: 80vh;
        overflow-y: auto;
        transform: scale(0.9);
        transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal {
        transform: scale(1);
    }

    .modal-image {
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        border-radius: 16px;
        margin-bottom: 16px;
    }

    .modal-title {
        font-family: 'Noto Serif SC', serif;
        font-size: 1.4rem;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .modal-location {
        color: var(--accent);
        font-weight: 500;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .modal-note {
        color: var(--ink-light);
        line-height: 1.6;
        margin-bottom: 16px;
    }

    .modal-date {
        font-size: 0.85rem;
        color: #999;
        margin-bottom: 20px;
    }

    .modal-close {
        width: 100%;
        padding: 14px;
        background: var(--bg);
        border: none;
        border-radius: 12px;
        font-family: 'Noto Sans SC', sans-serif;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s ease;
    }

    .modal-close:hover {
        background: #E0DCD6;
    }

    /* Animations */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .camera-section,
    .form-section,
    .items-section {
        animation: fadeInUp 0.6s ease forwards;
    }

    .form-section {
        animation-delay: 0.1s;
    }

    .items-section {
        animation-delay: 0.2s;
    }

    /* Responsive */
    @media (max-width: 480px) {
        .hero h1 {
            font-size: 2.2rem;
        }

        .camera-actions {
            flex-direction: column;
        }
    }
</style>
</head>
<body>
    <div class="hero">
        <h1>物品记忆助手</h1>
        <div class="divider"></div>
        <p class="tagline">拍照即定位，再也不怕找不到东西</p>
    </div>

    <div class="container">
        <!-- Camera Section -->
        <div class="camera-section">
            <div class="section-title">
                <div class="icon">📷</div>
                拍照记录
            </div>
            <div class="camera-preview" id="cameraPreview">
                <div class="camera-placeholder">
                    <div class="camera-icon">📸</div>
                    <p>点击按钮拍摄或选择照片</p>
                </div>
            </div>
            <div class="camera-actions">
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                    <span>📁</span> 选择照片
                </button>
                <button class="btn btn-secondary" onclick="openCamera()">
                    <span>📷</span> 打开相机
                </button>
            </div>
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleFileSelect(event)">
        </div>

        <!-- Form Section -->
        <div class="form-section">
            <div class="section-title">
                <div class="icon">📝</div>
                物品信息
            </div>
            <div class="form-group">
                <label>物品名称</label>
                <input type="text" id="itemName" placeholder="例如：备用钥匙">
            </div>
            <div class="form-group">
                <label>存放位置</label>
                <input type="text" id="itemLocation" placeholder="例如：客厅电视柜第二个抽屉">
                <div class="location-tags">
                    <span class="location-tag" onclick="selectTag(this)">客厅</span>
                    <span class="location-tag" onclick="selectTag(this)">卧室</span>
                    <span class="location-tag" onclick="selectTag(this)">厨房</span>
                    <span class="location-tag" onclick="selectTag(this)">书房</span>
                    <span class="location-tag" onclick="selectTag(this)">阳台</span>
                    <span class="location-tag" onclick="selectTag(this)">玄关</span>
                </div>
            </div>
            <div class="form-group">
                <label>备注说明</label>
                <textarea id="itemNote" placeholder="补充信息，例如：在抽屉最里面，旁边有充电器"></textarea>
            </div>
            <button class="btn btn-primary" onclick="saveItem()" style="width: 100%;">
                <span>💾</span> 保存记录
            </button>
        </div>

        <!-- Items List -->
        <div class="items-section">
            <div class="items-header">
                <div class="section-title" style="margin-bottom: 0;">
                    <div class="icon">📋</div>
                    我的物品
                </div>
                <span class="items-count" id="itemsCount">共 0 件</span>
            </div>
            <input type="text" class="search-box" id="searchBox" placeholder="搜索物品名称或位置..." oninput="searchItems()">
            <div id="itemsList">
                <div class="empty-state">
                    <div class="empty-icon">📦</div>
                    <p>还没有记录任何物品<br>拍张照片开始记录吧</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <img class="modal-image" id="modalImage" src="" alt="">
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-location" id="modalLocation"></div>
            <div class="modal-note" id="modalNote"></div>
            <div class="modal-date" id="modalDate"></div>
            <button class="modal-close" onclick="closeModal()">关闭</button>
        </div>
    </div>

<script>
    let items = JSON.parse(localStorage.getItem('itemMemoryItems') || '[]');
    let currentImage = null;

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        renderItems();
    });

    function openCamera() {
        document.getElementById('cameraInput').click();
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            currentImage = e.target.result;
            const preview = document.getElementById('cameraPreview');
            preview.innerHTML = `<img src="${currentImage}" alt="预览">`;
            preview.classList.add('has-image');
        };
        reader.readAsDataURL(file);
    }

    function selectTag(element) {
        const tags = document.querySelectorAll('.location-tag');
        tags.forEach(tag => tag.classList.remove('active'));
        element.classList.add('active');

        const locationInput = document.getElementById('itemLocation');
        const currentValue = locationInput.value;
        const tagText = element.textContent;

        if (currentValue.includes(tagText)) {
            locationInput.value = currentValue.replace(tagText, '').trim();
            element.classList.remove('active');
        } else {
            locationInput.value = tagText + (currentValue ? ' ' + currentValue : '');
        }
    }

    function saveItem() {
        const name = document.getElementById('itemName').value.trim();
        const location = document.getElementById('itemLocation').value.trim();
        const note = document.getElementById('itemNote').value.trim();

        if (!name) {
            showToast('请输入物品名称');
            return;
        }
        if (!location) {
            showToast('请输入存放位置');
            return;
        }
        if (!currentImage) {
            showToast('请先拍摄或选择照片');
            return;
        }

        const item = {
            id: Date.now(),
            name,
            location,
            note,
            image: currentImage,
            date: new Date().toLocaleString('zh-CN')
        };

        items.unshift(item);
        localStorage.setItem('itemMemoryItems', JSON.stringify(items));

        // Reset form
        document.getElementById('itemName').value = '';
        document.getElementById('itemLocation').value = '';
        document.getElementById('itemNote').value = '';
        document.querySelectorAll('.location-tag').forEach(tag => tag.classList.remove('active'));

        const preview = document.getElementById('cameraPreview');
        preview.innerHTML = `
            <div class="camera-placeholder">
                <div class="camera-icon">📸</div>
                <p>点击按钮拍摄或选择照片</p>
            </div>
        `;
        preview.classList.remove('has-image');
        currentImage = null;

        renderItems();
        showToast('物品记录成功！');
    }

    function renderItems(searchTerm = '') {
        const list = document.getElementById('itemsList');
        const count = document.getElementById('itemsCount');

        let filteredItems = items;
        if (searchTerm) {
            filteredItems = items.filter(item =>
                item.name.includes(searchTerm) ||
                item.location.includes(searchTerm) ||
                item.note.includes(searchTerm)
            );
        }

        count.textContent = `共 ${filteredItems.length} 件`;

        if (filteredItems.length === 0) {
            list.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📦</div>
                    <p>${searchTerm ? '没有找到匹配的物品' : '还没有记录任何物品<br>拍张照片开始记录吧'}</p>
                </div>
            `;
            return;
        }

        list.innerHTML = filteredItems.map(item => `
            <div class="item-card" onclick="openModal(${item.id})">
                <img class="item-image" src="${item.image}" alt="${item.name}">
                <div class="item-info">
                    <div class="item-name">${item.name}</div>
                    <div class="item-location">📍 ${item.location}</div>
                    <div class="item-note">${item.note || '暂无备注'}</div>
                    <div class="item-date">${item.date}</div>
                </div>
                <button class="delete-btn" onclick="deleteItem(event, ${item.id})">🗑️</button>
            </div>
        `).join('');
    }

    function searchItems() {
        const searchTerm = document.getElementById('searchBox').value.trim();
        renderItems(searchTerm);
    }

    function deleteItem(event, id) {
        event.stopPropagation();
        if (confirm('确定要删除这条记录吗？')) {
            items = items.filter(item => item.id !== id);
            localStorage.setItem('itemMemoryItems', JSON.stringify(items));
            renderItems(document.getElementById('searchBox').value.trim());
            showToast('已删除');
        }
    }

    function openModal(id) {
        const item = items.find(i => i.id === id);
        if (!item) return;

        document.getElementById('modalImage').src = item.image;
        document.getElementById('modalTitle').textContent = item.name;
        document.getElementById('modalLocation').innerHTML = `📍 ${item.location}`;
        document.getElementById('modalNote').textContent = item.note || '暂无备注';
        document.getElementById('modalDate').textContent = `记录时间：${item.date}`;

        document.getElementById('modalOverlay').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal(event) {
        if (event && event.target !== event.currentTarget) return;
        document.getElementById('modalOverlay').classList.remove('active');
        document.body.style.overflow = '';
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2500);
    }
</script>
</body>
</html>
