          ],
          tasks: [
            { title: "需求分析与技术选型", time: "2小时", priority: "high" },
            { title: "数据库设计与建模", time: "2小时", priority: "high" },
            { title: "核心API接口开发", time: "4小时", priority: "high" },
            { title: "前端页面与交互实现", time: "3小时", priority: "high" },
            { title: "用户认证与权限管理", time: "2小时", priority: "medium" },
            { title: "单元测试与接口测试", time: "2小时", priority: "medium" },
            { title: "性能优化与缓存策略", time: "2小时", priority: "medium" },
            { title: "CI/CD流水线配置", time: "1.5小时", priority: "low" },
            { title: "文档编写与项目交付", time: "1小时", priority: "low" },
          ],
        },
        default: {
          tasks: [
            { title: "目标分析与范围界定", time: "1小时", priority: "high" },
            { title: "资料收集与调研", time: "2小时", priority: "high" },
            { title: "制定详细执行计划", time: "1.5小时", priority: "high" },
            {
              title: "核心任务执行（第一阶段）",
              time: "4小时",
              priority: "high",
            },
            {
              title: "核心任务执行（第二阶段）",
              time: "3小时",
              priority: "medium",
            },
            { title: "质量检查与优化", time: "2小时", priority: "medium" },
            { title: "成果汇总与复盘", time: "1小时", priority: "low" },
          ],
        },
      };

      let currentTasks = [];
      let taskStates = {}; // taskId -> 'todo' | 'doing' | 'done'

      function detectGoalType(goal) {
        const g = goal.toLowerCase();
        for (const [type, engine] of Object.entries(taskEngines)) {
          if (type === "default") continue;
          if (engine.keywords.some((k) => g.includes(k))) return type;
        }
        return "default";
      }

      function generateTasks(goal) {
        const type = detectGoalType(goal);
        const engine = taskEngines[type];
        // Add some randomness for "regenerate"
        const shuffled = [...engine.tasks].sort(() => Math.random() - 0.5);
        // Slightly modify times randomly
        return shuffled.map((t, i) => ({
          id: "task_" + Date.now() + "_" + i,
          title: t.title,
          time: t.time,
          priority: t.priority,
          state: "todo",
        }));
      }

      function createSchedule(tasks) {
        const schedule = [];
        let day = 1;
        let dayTasks = [];
        let dayHours = 0;

        tasks.forEach((task) => {
          const hours = parseFloat(task.time);
          if (dayHours + hours > 6 && dayTasks.length > 0) {
            schedule.push({ day: "Day " + day, tasks: [...dayTasks] });
            day++;
            dayTasks = [task.title];
            dayHours = hours;
          } else {
            dayTasks.push(task.title);
            dayHours += hours;
          }
        });
        if (dayTasks.length > 0) {
          schedule.push({ day: "Day " + day, tasks: [...dayTasks] });
        }
        return schedule;
      }

      function renderTasks(tasks) {
        const list = document.getElementById("taskList");
        list.innerHTML = "";
        tasks.forEach((task, i) => {
          const item = document.createElement("div");
          item.className = `task-item priority-${task.priority} animate-in delay-${Math.min((i % 4) + 1, 4)}`;
          item.innerHTML = `
          <div class="task-info">
            <div class="task-title">${task.title}</div>
            <div class="task-meta">
              <span class="badge badge-time">⏱ ${task.time}</span>
              <span class="badge badge-${task.priority}">${task.priority === "high" ? "高" : task.priority === "medium" ? "中" : "低"}优先级</span>
            </div>
          </div>
        `;
          list.appendChild(item);
        });
      }

      function renderFlow(tasks) {
        const todoCol = document.getElementById("flowTodo");
        const doingCol = document.getElementById("flowDoing");
        const doneCol = document.getElementById("flowDone");
        todoCol.innerHTML = "";
        doingCol.innerHTML = "";
        doneCol.innerHTML = "";

        tasks.forEach((task) => {
          const state = taskStates[task.id] || "todo";
          const card = document.createElement("div");
          card.className = `flow-card priority-${task.priority} animate-in`;
          card.innerHTML = `
          <div class="flow-card-title">${task.title}</div>
          <div class="flow-card-meta">
            <span>⏱ ${task.time}</span>
            <span>${task.priority === "high" ? "🔴" : task.priority === "medium" ? "🟡" : "🟢"} ${task.priority === "high" ? "高" : task.priority === "medium" ? "中" : "低"}</span>
          </div>
        `;
          card.onclick = () => cycleTaskState(task.id);

          if (state === "todo") todoCol.appendChild(card);
          else if (state === "doing") doingCol.appendChild(card);
          else doneCol.appendChild(card);
        });

        if (!todoCol.innerHTML)
          todoCol.innerHTML =
            '<div class="empty-state"><div style="font-size:1.5rem;opacity:0.3;">📝</div><div style="font-size:0.8rem;">暂无任务</div></div>';
        if (!doingCol.innerHTML)
          doingCol.innerHTML =
            '<div class="empty-state"><div style="font-size:1.5rem;opacity:0.3;">🚀</div><div style="font-size:0.8rem;">暂无任务</div></div>';
        if (!doneCol.innerHTML)
          doneCol.innerHTML =
            '<div class="empty-state"><div style="font-size:1.5rem;opacity:0.3;">✅</div><div style="font-size:0.8rem;">暂无任务</div></div>';
      }

      function renderSchedule(schedule) {
        const timeline = document.getElementById("timeline");
        timeline.innerHTML = "";
        schedule.forEach((item, i) => {
          const el = document.createElement("div");
          el.className =
            "timeline-item animate-in delay-" + Math.min((i % 4) + 1, 4);
          el.innerHTML = `
          <div class="timeline-dot"></div>
          <div class="timeline-content">
            <div class="timeline-day">${item.day}</div>
            <div class="timeline-tasks">${item.tasks.join("、")}</div>
          </div>
        `;
          timeline.appendChild(el);
        });
      }

      function updateStats() {
        const total = currentTasks.length;
        const done = currentTasks.filter(
          (t) => (taskStates[t.id] || "todo") === "done",
        ).length;
        const rate = total > 0 ? Math.round((done / total) * 100) : 0;

        document.getElementById("statTotal").textContent = total;
        document.getElementById("statDone").textContent = done;
        document.getElementById("statRate").textContent = rate + "%";
        document.getElementById("progressFill").style.width = rate + "%";
      }

      function cycleTaskState(taskId) {
        const current = taskStates[taskId] || "todo";
        const next =
          current === "todo" ? "doing" : current === "doing" ? "done" : "todo";
        taskStates[taskId] = next;
        renderFlow(currentTasks);
        updateStats();
      }

      function showResults() {
        document.getElementById("statsSection").style.display = "block";
        document.getElementById("tasksSection").style.display = "block";
        document.getElementById("flowSection").style.display = "block";
        document.getElementById("scheduleSection").style.display = "block";
      }

      function runGeneration() {
        const goal = document.getElementById("goalInput").value.trim();
        if (!goal) {
          document.getElementById("goalInput").focus();
          return;
        }

        const thinking = document.getElementById("aiThinking");
        thinking.classList.add("active");

        // Hide current results for re-animation
        document.getElementById("statsSection").style.display = "none";
        document.getElementById("tasksSection").style.display = "none";
        document.getElementById("flowSection").style.display = "none";
        document.getElementById("scheduleSection").style.display = "none";

        setTimeout(() => {
          currentTasks = generateTasks(goal);
          taskStates = {};
          currentTasks.forEach((t) => (taskStates[t.id] = "todo"));

          const schedule = createSchedule(currentTasks);

          renderTasks(currentTasks);
          renderFlow(currentTasks);
          renderSchedule(schedule);
          updateStats();
          showResults();

          thinking.classList.remove("active");
        }, 1200);
      }

      document
        .getElementById("generateBtn")
        .addEventListener("click", runGeneration);
      document
        .getElementById("regenerateBtn")
        .addEventListener("click", runGeneration);
      document.getElementById("goalInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") runGeneration();
      });

      // Auto-run on load with default value
      window.addEventListener("DOMContentLoaded", () => {
        runGeneration();
      });
    </script>
  </body>
</html>
