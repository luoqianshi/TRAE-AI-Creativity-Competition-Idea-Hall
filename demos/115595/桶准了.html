<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>桶准了 · 垃圾分类快查</title>
  <style>
    :root {
      --bg-primary: #F9F7F2;
      --bg-card: #FFFFFF;
      --text-primary: #333333;
      --text-secondary: #666666;
      --border: #E0D9CE;
      --accent-green: #8DA67D;
      --accent-blue: #6CA0DC;
      --accent-red: #D97E7E;
      --accent-brown: #C4B197;
      --accent-main: #5D8A8B;
      --shadow: 0 2px 8px rgba(0,0,0,0.05);
      --radius: 12px;
      --transition: all 0.25s ease;
    }

    .dark-mode {
      --bg-primary: #1E2429;
      --bg-card: #2A3037;
      --text-primary: #F5F3ED;
      --text-secondary: #A9A395;
      --border: #3E454D;
      --accent-green: #7AA26F;
      --accent-blue: #5A8DB8;
      --accent-red: #C56A6A;
      --accent-brown: #A99885;
      --accent-main: #4A6F72;
      --shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 8px 0;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: white;
    }

    .theme-toggle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--text-primary);
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .hero h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .hero p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      max-width: 480px;
      margin: 0 auto;
    }

    .upload-area {
      background: var(--bg-card);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px 20px;
      text-align: center;
      margin-bottom: 28px;
      transition: var(--transition);
      cursor: pointer;
    }

    .upload-area:hover {
      border-color: var(--accent-main);
      background: rgba(93, 138, 139, 0.03);
    }

    .upload-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
      color: var(--accent-main);
    }

    .upload-text {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 1.1rem;
    }

    .upload-hint {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    .sample-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .sample-item {
      aspect-ratio: 1/1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #666;
      font-weight: 500;
    }

    .sample-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      border-color: var(--accent-main);
    }

    .sample-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .result-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: var(--shadow);
      display: none;
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .result-category {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cat-wet { background: rgba(141, 166, 125, 0.15); color: var(--accent-green); }
    .cat-recycle { background: rgba(108, 160, 220, 0.15); color: var(--accent-blue); }
    .cat-hazard { background: rgba(217, 126, 126, 0.15); color: var(--accent-red); }
    .cat-other { background: rgba(196, 177, 151, 0.15); color: var(--accent-brown); }

    .result-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 16px;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 14px;
    }

    .result-title {
      font-size: 1.3rem;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .result-tip {
      background: rgba(93, 138, 139, 0.08);
      border-left: 4px solid var(--accent-main);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      margin: 16px 0;
      font-size: 0.95rem;
      color: var(--text-primary);
    }

    .voice-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-main);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .voice-btn:hover {
      background: #4a6f72;
      transform: scale(1.03);
    }

    .local-rule {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 14px 18px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
    }

    .local-rule svg {
      width: 16px;
      height: 16px;
      fill: var(--accent-main);
    }

    .frequent-list {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .frequent-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .frequent-items {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .frequent-item {
      background: rgba(93, 138, 139, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-main);
    }

    .frequent-item .remove {
      cursor: pointer;
      opacity: 0.7;
      font-weight: bold;
      font-size: 14px;
    }

    .frequent-item .remove:hover {
      opacity: 1;
    }

    .add-form {
      display: flex;
      gap: 8px;
    }

    .add-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .add-btn {
      background: var(--accent-main);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }

    footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .sample-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .hero h1 {
        font-size: 1.5rem;
      }
      .upload-area {
        padding: 24px 16px;
      }
    }

    @media (max-width: 360px) {
      .sample-grid {
        grid-template-columns: 1fr;
      }
      .header-actions {
        gap: 8px;
      }
      .add-form {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">🗑️</div>
        <span>桶准了</span>
      </div>
      <button class="theme-toggle" id="themeToggle">
        <svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM9 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM10.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM12 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM13.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM15 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75zM18 12a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25a.75.75 0 01.75-.75z"/></svg>
      </button>
    </header>

    <section class="hero">
      <h1>拍一拍，3秒知投哪桶</h1>
      <p>不用打字，不翻菜单，手拎垃圾袋也能快速查清分类</p>
    </section>

    <section class="upload-area" id="uploadArea">
      <div class="upload-icon">📸</div>
      <div class="upload-text">点击上传垃圾照片</div>
      <div class="upload-hint">或从下方选一个常见垃圾试试</div>
      <div class="sample-grid">
        <div class="sample-item" data-name="奶茶杯" data-cat="other" data-tip="请撕掉塑料膜再投可回收桶">🥤奶茶杯</div>
        <div class="sample-item" data-name="剩饭" data-cat="wet" data-tip="沥干水分后投放">🍚剩饭</div>
        <div class="sample-item" data-name="快递盒" data-cat="recycle" data-tip="压扁后投放，胶带无需去除">📦快递盒</div>
        <div class="sample-item" data-name="废电池" data-cat="hazard" data-tip="投入有害垃圾专用回收点">🔋废电池</div>
        <div class="sample-item" data-name="大骨头" data-cat="other" data-tip="上海归为其他垃圾，北京归为厨余垃圾">🦴大骨头</div>
        <div class="sample-item" data-name="湿纸巾" data-cat="other" data-tip="无论是否湿润，均属其他垃圾">🧻湿纸巾</div>
      </div>
    </section>

    <section class="result-section" id="resultSection">
      <div class="result-header">
        <span class="result-category cat-other" id="resultCategory">其他垃圾</span>
        <span>已识别</span>
      </div>
      <div class="result-img" id="resultImage">📸 垃圾照片预览</div>
      <h2 class="result-title" id="resultTitle">奶茶杯</h2>
      <p id="resultDesc">纸质外杯+塑料内膜，需分离投放</p>
      <div class="result-tip" id="resultTip">请撕掉塑料膜，纸杯投可回收桶，塑料膜投其他垃圾</div>
      <button class="voice-btn" id="voiceBtn">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path fill="currentColor" d="M17 11c0-2.76-2.24-5-5-5H8c-1.1 0-2 .9-2 2v7h2c1.1 0 2-.9 2-2v-2c2.76 0 5 2.24 5 5 0 2.76-2.24 5-5 5H8c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h4c3.31 0 6-2.69 6-6 0-3.31-2.69-6-6-6z"/></svg>
        听提示（语音模拟）
      </button>
    </section>

    <section class="local-rule">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
      <span>您当前适用：<strong>上海市2024版分类标准</strong></span>
    </section>

    <section class="frequent-list">
      <div class="frequent-header">
        <h3>我家常扔</h3>
        <span id="frequentCount">0项</span>
      </div>
      <div class="frequent-items" id="frequentItems">
        <!-- populated by JS -->
      </div>
      <div class="add-form">
        <input type="text" class="add-input" id="frequentInput" placeholder="例如：旧衣服、碎玻璃..." maxlength="12">
        <button class="add-btn" id="addBtn">添加</button>
      </div>
    </section>

    <footer>
      <p>桶准了 · 垃圾分类快查工具 | 纯前端模拟演示</p>
    </footer>
  </div>

  <script>
    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      body.classList.add('dark-mode');
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      const isDark = body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // Sample items click handler
    const sampleItems = document.querySelectorAll('.sample-item');
    const resultSection = document.getElementById('resultSection');
    const resultCategory = document.getElementById('resultCategory');
    const resultImage = document.getElementById('resultImage');
    const resultTitle = document.getElementById('resultTitle');
    const resultDesc = document.getElementById('resultDesc');
    const resultTip = document.getElementById('resultTip');
    const voiceBtn = document.getElementById('voiceBtn');

    sampleItems.forEach(item => {
      item.addEventListener('click', () => {
        const name = item.getAttribute('data-name');
        const cat = item.getAttribute('data-cat');
        const tip = item.getAttribute('data-tip');

        // Set category badge
        resultCategory.textContent = 
          cat === 'wet' ? '厨余垃圾' :
          cat === 'recycle' ? '可回收物' :
          cat === 'hazard' ? '有害垃圾' : '其他垃圾';
        
        resultCategory.className = 'result-category ' + 
          (cat === 'wet' ? 'cat-wet' :
           cat === 'recycle' ? 'cat-recycle' :
           cat === 'hazard' ? 'cat-hazard' : 'cat-other');

        resultTitle.textContent = name;
        resultDesc.textContent = `识别为：${name}`;
        resultTip.textContent = tip;

        // Simulate image preview
        resultImage.innerHTML = `📷 ${name} 预览`;

        // Show result section
        resultSection.style.display = 'block';

        // Scroll to result
        resultSection.scrollIntoView({ behavior: 'smooth' });
      });
    });

    // Voice button simulate
    voiceBtn.addEventListener('click', () => {
      const msg = resultTip.textContent;
      // Just visual feedback
      voiceBtn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path fill="currentColor" d="M17 11c0-2.76-2.24-5-5-5H8c-1.1 0-2 .9-2 2v7h2c1.1 0 2-.9 2-2v-2c2.76 0 5 2.24 5 5 0 2.76-2.24 5-5 5H8c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h4c3.31 0 6-2.69 6-6 0-3.31-2.69-6-6-6z"/></svg> 正在播报…';
      setTimeout(() => {
        voiceBtn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path fill="currentColor" d="M17 11c0-2.76-2.24-5-5-5H8c-1.1 0-2 .9-2 2v7h2c1.1 0 2-.9 2-2v-2c2.76 0 5 2.24 5 5 0 2.76-2.24 5-5 5H8c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h4c3.31 0 6-2.69 6-6 0-3.31-2.69-6-6-6z"/></svg> 听提示（语音模拟）';
      }, 1500);
    });

    // Frequent list
    const frequentItemsEl = document.getElementById('frequentItems');
    const frequentInput = document.getElementById('frequentInput');
    const addBtn = document.getElementById('addBtn');
    const frequentCountEl = document.getElementById('frequentCount');

    let frequentList = JSON.parse(localStorage.getItem('frequentList')) || [];

    const renderFrequent = () => {
      frequentItemsEl.innerHTML = '';
      frequentList.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'frequent-item';
        div.innerHTML = `
          ${item}
          <span class="remove" data-index="${i}">×</span>
        `;
        frequentItemsEl.appendChild(div);
      });
      frequentCountEl.textContent = `${frequentList.length}项`;
    };

    // Load on init
    renderFrequent();

    // Add item
    addBtn.addEventListener('click', () => {
      const val = frequentInput.value.trim();
      if (val && val.length <= 12 && !frequentList.includes(val)) {
        frequentList.push(val);
        localStorage.setItem('frequentList', JSON.stringify(frequentList));
        frequentInput.value = '';
        renderFrequent();
      }
    });

    // Remove item
    frequentItemsEl.addEventListener('click', (e) => {
      if (e.target.classList.contains('remove')) {
        const idx = parseInt(e.target.getAttribute('data-index'));
        frequentList.splice(idx, 1);
        localStorage.setItem('frequentList', JSON.stringify(frequentList));
        renderFrequent();
      }
    });

    // Enter key support
    frequentInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        addBtn.click();
      }
    });
  </script>
</body>
</html>
