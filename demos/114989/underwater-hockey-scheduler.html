    /* === 队伍列表项 === */
    .team-item {

    }
    .match-slot.locked {

    }

    }
    .match-time {

    /* === 弹窗 === */
    .modal-overlay {

      justify-content: center;

      max-height: 85vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-header {
      padding: 1rem 1.5rem;

      align-items: center;

      padding: 0;

    /* === 分析结果 === */
    .analysis-section {
      margin-bottom: 1rem;
    }

      font-size: 0.95rem;
      color: var(--accent-dark);

    }

      display: flex;
      justify-content: center;
    }

    /* 拖拽提示样式 */
    .match-slot[data-has-result="true"] {

    }
    .match-slot[data-has-result="false"] {

    }

    /* === 工具提示 === */
    .tooltip {

    }
    .tooltip::after {
      content: attr(data-tip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .tooltip:hover::after { opacity: 1; }

    /* === 响应式 === */
    @media (max-width: 768px) {

      .schedule-container {
        grid-template-columns: 1fr;
      }
      .schedule-day-label {
        writing-mode: horizontal-tb;
      }
      .input-group {
        flex-direction: column;
        align-items: stretch;
      }
      .form-row {

        align-items: stretch;
      }

        flex-direction: column;
        align-items: stretch;
      }
      .bracket-round {
        margin-right: 0;
        margin-bottom: 1rem;
        min-width: auto;
      }

    ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-light); }

    /* === 出线标记 === */
    .qualified {
      color: var(--success);
      font-weight: 600;
    }
    .qualified::before {
      content: '\2713 ';
    }

      color: var(--accent2);
      cursor: pointer;
      font-weight: 600;
    }
    .need-decide::after {
      content: ' \26A0';
    }

    /* === 小组标签 === */
    .group-label {

      font-weight: 700;
      color: var(--accent);

      padding: 0.4rem 0.8rem;
      background: var(--accent-light);
      border-radius: var(--radius);

    }

      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .mt-1 { margin-top: 1rem; }
    .mb-1 { margin-bottom: 1rem; }

    /* === 日期标签样式 === */

      color: #fff;
      padding: 0.6rem 1rem;
      font-weight: 700;
      font-size: 1rem;
      border-radius: var(--radius) var(--radius) 0 0;
      margin-top: 1rem;
    }
    .day-header:first-child { margin-top: 0; }

    .day-schedule {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: 1px solid var(--rule);
      border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);
      overflow: hidden;
    }
    @media (max-width: 768px) {
      .day-schedule { grid-template-columns: 1fr; }
    }
    .court-col {
      border-right: 1px solid var(--rule);
    }
    .court-col:last-child { border-right: none; }
    @media (max-width: 768px) {
      .court-col { border-right: none; border-bottom: 1px solid var(--rule); }
      .court-col:last-child { border-bottom: none; }
    }
    .court-label {
      background: var(--accent-light);
      color: var(--accent-dark);
      padding: 0.5rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--accent);
    }

    /* 赛程表 - 表格形式 */
    .schedule-table-wrapper { overflow-x: auto; }
    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

<body>

  <!-- 头部 -->
  <header class="app-header">
    <div class="header-content">
      <div>
        <h1>UWH Tournament Scheduler</h1>

  <!-- 标签页导航 -->

  <!-- 主内容区 -->
  <main class="app-main">

    <!-- ==================== Tab 1: 队伍管理 ==================== -->
    <div id="tab-teams" class="tab-panel active">
      <!-- 添加队伍 -->
      <div class="card">

          <button class="btn btn-primary" onclick="addTeam()">添加队伍</button>

      <!-- 队伍列表 -->
      <div class="card">

    <!-- ==================== Tab 2: 赛程管理 ==================== -->
    <div id="tab-schedule" class="tab-panel">
      <!-- 生成赛程 + 分析赛程 -->

        <div class="card-title">

        <div class="btn-group">
          <button class="btn btn-primary" onclick="generateSchedule()">生成赛程</button>
          <button class="btn btn-secondary" onclick="clearSchedule()">清空赛程</button>
          <button class="btn btn-accent2" onclick="simulateAllScores()">模拟比赛</button>

        </div>

      <!-- 赛程表 -->
      <div class="card">
        <div class="card-title">
          <span class="icon blue">&#128203;</span>
          赛程表
        </div>
        <div id="scheduleDisplay">
          <div class="empty-state">
            <div class="icon-large">&#128197;</div>
            <p>请先添加队伍并生成赛程</p>

      <!-- 赛程分析结果 -->
      <div class="card">

    <!-- ==================== Tab 3: 积分与排名 ==================== -->
    <div id="tab-standings" class="tab-panel">
      <div class="card">
        <div class="card-title">
          <span class="icon blue">&#127942;</span>
          小组赛积分与排名
        </div>
        <div id="standingsDisplay">
          <div class="empty-state">
            <div class="icon-large">&#127942;</div>
            <p>请先生成赛程并录入比分</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== Tab 4: 淘汰赛 ==================== -->
    <div id="tab-knockout" class="tab-panel">
      <div class="card">
        <div class="card-title">
          <span class="icon orange">&#9876;</span>
          淘汰赛对阵
        </div>
        <div class="btn-group mb-1">
          <button class="btn btn-primary" onclick="generateKnockout()">生成淘汰赛对阵</button>
        </div>
        <div id="knockoutDisplay">
          <div class="empty-state">
            <div class="icon-large">&#9876;</div>
            <p>请先完成所有小组赛比赛结果录入</p>
          </div>
        </div>

    <!-- ==================== Tab 5: 射手榜 ==================== -->

      <div class="card">
        <div class="card-title">
          <span class="icon blue">&#9917;</span>
          射手榜
        </div>
        <div id="scorersDisplay">
          <div class="empty-state">
            <div class="icon-large">&#9917;</div>
            <p>暂无进球数据</p>
          </div>

  </main>

  <!-- ==================== 设置参数弹窗 ==================== -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>设置参数</h3>
        <button class="modal-close" onclick="closeModal('settingsModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">开始时间</label>
          <input type="time" id="cfgDayStart" class="input-field" style="width:100%">

          <input type="time" id="cfgLunchEnd" class="input-field" style="width:100%">

      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('settingsModal')">取消</button>
        <button class="btn btn-primary" onclick="saveSettings()">保存</button>

  <!-- ==================== 录入比分弹窗 ==================== -->
  <div id="scoreModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="scoreModalTitle">录入比分</h3>
        <button class="modal-close" onclick="closeModal('scoreModal')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <div style="flex:1;text-align:center;">
            <label class="form-label" id="scoreTeamALabel">队A (白)</label>
            <input type="number" id="scoreAInput" class="input-field" style="width:100%;text-align:center;font-size:1.5rem" min="0" value="0">
          </div>
          <div style="display:flex;align-items:center;padding-top:20px;font-size:1.2rem;font-weight:700;color:var(--muted);">:</div>
          <div style="flex:1;text-align:center;">
            <label class="form-label" id="scoreTeamBLabel">队B (黑)</label>
            <input type="number" id="scoreBInput" class="input-field" style="width:100%;text-align:center;font-size:1.5rem" min="0" value="0">
          </div>
        </div>

        <div class="mt-1">
          <label class="form-label">进球者列表</label>
          <div class="btn-group mb-1">

            <input type="text" id="scorerPlayerInput" class="input-field" style="flex:1" placeholder="球员姓名">
            <button class="btn btn-sm btn-secondary" onclick="addScorerToList()">添加进球者</button>
          </div>
          <div id="scorerListItems" class="scorer-list">
            <div style="padding:0.5rem;color:var(--muted);text-align:center;font-size:0.85rem;">暂无进球者</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('scoreModal')">取消</button>
        <button class="btn btn-primary" onclick="saveScore()">保存比分</button>
      </div>
    </div>
  </div>

  <!-- ==================== JavaScript ==================== -->
  <script>
    /* ===== 全局数据 ===== */
    const appData = {
      teams: [],            // {id, name, city}
      config: {
        lunchStart: '12:00',
        lunchEnd: '13:00',
        dayStart: '08:30',
        dayEnd: '16:30'
      },
      groups: [],           // [{name: 'A', teams: [teamId, ...]}]
      groupSchedule: [],    // [{day: 1, court: 1, startTime, endTime, matchId, teamA, teamB, refTeams: []}]
      knockoutSchedule: [],
      knockoutBracket: null,
      results: {},          // matchId -> {scoreA, scoreB, scorers: [{teamId, player}]}
      scorers: [],          // [{player, teamId, teamName, goals}]
      standings: [],        // computed per group
      nextId: 1,
      nextMatchId: 1,
      scheduleLocked: false // 赛程是否锁定
    };

    // 当前正在录入比分的比赛信息
    let currentScoreMatch = null;
    let tempScorers = [];

    /* ===== 工具函数 ===== */
    function genId() { return appData.nextId++; }
    function genMatchId() { return 'M' + (appData.nextMatchId++); }

    // 时间转换（分钟 -> HH:MM）
    function minutesToTime(m) {
      const h = Math.floor(m / 60);
      const min = m % 60;
      return String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');
    }

    // 时间 -> 分钟
    function timeToMinutes(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    // 城市识别
    function extractCity(teamName) {
      // 尝试从队名中提取城市名
      // 匹配模式：城市名+字母/数字 或 城市名+队
      const cityPatterns = [
        // 中国城市
        '北京','上海','天津','重庆','广州','深圳','成都','杭州','南京','武汉',
        '西安','苏州','长沙','沈阳','青岛','大连','厦门','宁波','济南','哈尔滨',
        '福州','昆明','贵阳','兰州','海口','郑州','合肥','太原','石家庄','呼和浩特',
        '乌鲁木齐','拉萨','银川','西宁','南宁','珠海','佛山','东莞','无锡','温州',
        '常州','徐州','烟台','中山','惠州','泉州','漳州','嘉兴','绍兴','金华',
        '潍坊','保定','镇江','扬州','泰州','盐城','湖州','连云港','淮安','芜湖',
        '蚌埠','淮南','马鞍山','安庆','黄山','滁州','阜阳','宿州','六安','亳州',
        '九江','景德镇','萍乡','新余','鹰潭','赣州','吉安','宜春','抚州','上饶',
        '洛阳','开封','南阳','平顶山','安阳','新乡','焦作','濮阳','许昌','漯河',
        '商丘','信阳','周口','驻马店','三门峡','济源',
        '桂林','柳州','北海','钦州','防城港','玉林','百色','河池','贺州','来宾','崇左',
        '三亚','儋州','琼海',
        '攀枝花','泸州','德阳','绵阳','广元','遂宁','内江','乐山','南充','眉山',
        '宜宾','广安','达州','雅安','巴中','资阳',
        '遵义','六盘水','安顺','毕节','铜仁',
        '曲靖','玉溪','保山','昭通','丽江','普洱','临沧',
        '日喀则','昌都','林芝','山南','那曲',
        '宝鸡','渭南','汉中','安康','商洛','延安','榆林',
        '天水','平凉','酒泉','嘉峪关','金昌','白银','武威','张掖','庆阳','定西','陇南',
        '海东','海西','海北','海南州','黄南','果洛','玉树',
        '石嘴山','吴忠','固原','中卫',
        '哈密','吐鲁番','阿克苏','喀什','和田','伊犁','塔城','阿勒泰','博尔塔拉','巴音郭楞','克孜勒苏',
        '襄阳','宜昌','荆州','荆门','鄂州','孝感','黄冈','咸宁','随州','恩施',
        '株洲','湘潭','衡阳','邵阳','岳阳','常德','张家界','益阳','郴州','永州','怀化','娄底','湘西',
        '肇庆','湛江','江门','茂名','梅州','汕尾','河源','阳江','清远','潮州','揭阳','云浮',
        '鞍山','抚顺','本溪','丹东','锦州','营口','阜新','辽阳','盘锦','铁岭','朝阳','葫芦岛',
        '吉林','四平','辽源','通化','白山','松原','白城','延边',
        '齐齐哈尔','牡丹江','佳木斯','大庆','鸡西','双鸭山','伊春','七台河','鹤岗','绥化','黑河','大兴安岭',
      ];
      // 按长度降序排列，优先匹配长城市名
      const sorted = [...cityPatterns].sort((a, b) => b.length - a.length);
      for (const city of sorted) {
        if (teamName.includes(city)) return city;
      }
      // 如果没有匹配到已知城市，取第一个汉字词
      const match = teamName.match(/^[\u4e00-\u9fa5]{2,4}/);
      if (match) return match[0];
      return '未知';
    }

    /* ===== 标签页切换 ===== */
    function switchTab(tabName) {
      // 隐藏所有标签页
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      // 显示目标标签页
      document.getElementById('tab-' + tabName).classList.add('active');
      // 高亮对应按钮
      const tabs = ['teams', 'schedule', 'standings', 'knockout', 'scorers'];
      const idx = tabs.indexOf(tabName);
      document.querySelectorAll('.tab-btn')[idx].classList.add('active');
      // 切换时刷新视图
      if (tabName === 'standings') renderStandings();
      if (tabName === 'knockout') renderKnockout();
      if (tabName === 'scorers') renderScorers();
    }

    /* ===== Tab 1: 队伍管理 ===== */

    // 添加队伍（支持批量输入，英文逗号分隔）
    function addTeam() {
      const input = document.getElementById('teamNameInput');
      const raw = input.value.trim();
      if (!raw) return;
      // 用英文逗号分隔，支持批量添加
      const names = raw.split(',').map(s => s.trim()).filter(s => s.length > 0);
      let addedCount = 0;
      names.forEach(name => {
        if (appData.teams.some(t => t.name === name)) {
          return; // 跳过重名
        }
        const city = extractCity(name);
        appData.teams.push({ id: genId(), name, city });
        addedCount++;
      });
      if (addedCount === 0 && names.length > 0) {
        alert('所有队伍名称已存在');
        return;
      }
      input.value = '';
      input.focus();
      renderTeamList();
    }

    // 删除队伍
    function removeTeam(id) {
      if (appData.groupSchedule.length > 0) {
        if (!confirm('删除队伍将清空已生成的赛程，确定继续吗？')) return;
        appData.groupSchedule = [];
        appData.knockoutSchedule = [];
        appData.knockoutBracket = null;
        appData.results = {};
        appData.scorers = [];
        appData.groups = [];
        appData.standings = [];
      }
      appData.teams = appData.teams.filter(t => t.id !== id);
      renderTeamList();
    }

    // 渲染队伍列表
    function renderTeamList() {
      const container = document.getElementById('teamList');
      const countEl = document.getElementById('teamCount');
      countEl.textContent = appData.teams.length + ' 支';
      if (appData.teams.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon-large">&#127946;</div><p>暂无队伍，请在上方输入队名添加</p></div>';
        return;
      }
      let html = '';
      appData.teams.forEach(t => {
        html += `
          <div class="team-item">
            <div class="team-color-dot" style="background:#ccc"></div>
            <div class="team-info">
              <div class="team-name">${escHtml(t.name)}</div>
              <div class="team-city">${escHtml(t.city)}</div>
            </div>
            <span class="badge badge-blue">${escHtml(t.city)}</span>
            <button class="btn btn-sm btn-danger" onclick="removeTeam(${t.id})">删除</button>
          </div>`;
      });
      container.innerHTML = html;
    }

    // 设置参数弹窗
    function showSettingsModal() {
      document.getElementById('cfgDayStart').value = appData.config.dayStart;
      document.getElementById('cfgLunchStart').value = appData.config.lunchStart;
      document.getElementById('cfgLunchEnd').value = appData.config.lunchEnd;
      openModal('settingsModal');
    }

    function saveSettings() {
      const dayStart = document.getElementById('cfgDayStart').value;
      let lunchStart = document.getElementById('cfgLunchStart').value;
      let lunchEnd = document.getElementById('cfgLunchEnd').value;

      // 验证午餐时间在11:00-13:00之间
      const lsMin = timeToMinutes(lunchStart);
      const leMin = timeToMinutes(lunchEnd);
      if (lsMin < 660 || leMin > 780) {
        alert('午餐时间需在11:00-13:00之间');
        return;
      }
      if (lunchStart >= lunchEnd) {
        alert('午餐结束时间必须晚于开始时间');
        return;
      }
      appData.config.dayStart = dayStart;
      appData.config.lunchStart = lunchStart;
      appData.config.lunchEnd = lunchEnd;
      closeModal('settingsModal');
    }

    /* ===== Tab 2: 赛程管理 ===== */

    // 清空赛程
    function clearSchedule() {
      if (appData.groupSchedule.length === 0 && appData.knockoutSchedule.length === 0) return;
      if (!confirm('确定清空所有赛程和比分数据吗？')) return;
      appData.groupSchedule = [];
      appData.knockoutSchedule = [];
      appData.knockoutBracket = null;
      appData.results = {};
      appData.scorers = [];
      appData.groups = [];
      appData.standings = [];
      appData.nextMatchId = 1;
      appData.scheduleLocked = false;
      document.getElementById('analysisResult').innerHTML = '<div class="empty-state"><p>请先生成赛程，点击"分析赛程"查看各队得分</p></div>';
      renderSchedule();
      updateLockButton();
    }

    // 锁定/解锁赛程
    function toggleLock() {
      appData.scheduleLocked = !appData.scheduleLocked;
      renderSchedule();
      updateLockButton();
      showToast(appData.scheduleLocked ? '赛程已锁定，不可再拖拽调整' : '赛程已解锁，可以拖拽调整');
    }

    function updateLockButton() {
      const btn = document.getElementById('lockBtn');
      if (!btn) return;
      if (appData.groupSchedule.length > 0) {
        btn.style.display = '';
        btn.textContent = appData.scheduleLocked ? '解锁赛程' : '锁定赛程';
        btn.className = appData.scheduleLocked ? 'btn btn-primary' : 'btn btn-danger';
      } else {
        btn.style.display = 'none';
      }
    }

    // 生成赛程（主入口）
    function generateSchedule() {
      if (appData.teams.length < 2) {
        alert('至少需要2支队伍');
        return;
      }
      // 清空旧数据
      appData.groupSchedule = [];
      appData.knockoutSchedule = [];
      appData.knockoutBracket = null;
      appData.results = {};
      appData.scorers = [];
      appData.standings = [];
      appData.nextMatchId = 1;

      const numTeams = appData.teams.length;

      // 分组
      if (numTeams < 8) {
        // 单组
        appData.groups = [{ name: 'A', teams: appData.teams.map(t => t.id) }];
      } else {
        // 双组蛇形分组
        appData.groups = serpentineGrouping(appData.teams);
      }

      // 生成小组赛比赛
      const allMatches = [];
      appData.groups.forEach((group, gi) => {
        const matches = generateRoundRobin(group.teams, group.name);
        allMatches.push(...matches);
      });

      // 分配时间槽和场地
      // 小组赛：第1天全天 + 第2天直到12:00
      // 先优化顺序，然后平分给两天
      const startMin = timeToMinutes(appData.config.dayStart);
      const lunchStartMin = timeToMinutes(appData.config.lunchStart);
      const lunchEndMin = timeToMinutes(appData.config.lunchEnd);
      const dayEndMin = timeToMinutes(appData.config.dayEnd);
      const matchDuration = 27;
      const slotDuration = 37;

      // 计算第1天最多能安排多少场比赛（2个场地）
      const day1MorningSlots = Math.floor((lunchStartMin - startMin) / slotDuration);
      const day1AfternoonSlots = Math.floor((dayEndMin - lunchEndMin) / slotDuration);
      const day1TotalSlots = (day1MorningSlots + day1AfternoonSlots) * 2;

      // 第2天小组赛只安排到12:00
      const day2MorningSlots = Math.floor((lunchStartMin - startMin) / slotDuration);
      const day2TotalSlots = day2MorningSlots * 2;

      // 优化顺序（用第1天的时间槽）
      const day1Slots = [];
      let t = startMin;
      while (t + matchDuration <= lunchStartMin) {
        day1Slots.push({ start: t, end: t + matchDuration });
        t += slotDuration;
      }
      t = lunchEndMin;
      while (t + matchDuration <= dayEndMin) {
        day1Slots.push({ start: t, end: t + matchDuration });
        t += slotDuration;
      }
      const sortedDay1 = optimizeMatchOrder(allMatches, day1Slots);

      // 分配第1天的比赛
      let matchIdx = 0;
      for (let si = 0; si < day1Slots.length && matchIdx < sortedDay1.length; si++) {
        for (let c = 1; c <= 2 && matchIdx < sortedDay1.length; c++) {
          const match = sortedDay1[matchIdx];
          match.day = 1;
          match.court = c;
          match.startTime = minutesToTime(day1Slots[si].start);
          match.endTime = minutesToTime(day1Slots[si].end);
          matchIdx++;
        }
      }

      // 剩余的比赛分配到第2天（直到12:00）
      const remaining = sortedDay1.slice(matchIdx);
      if (remaining.length > 0) {
        const day2Slots = [];
        t = startMin;
        while (t + matchDuration <= lunchStartMin) {
          day2Slots.push({ start: t, end: t + matchDuration });
          t += slotDuration;
        }
        // 第2天不分配下午时间（小组赛到12:00为止）

        const sortedDay2 = optimizeMatchOrder(remaining, day2Slots);
        let mIdx = 0;
        for (let si = 0; si < day2Slots.length && mIdx < sortedDay2.length; si++) {
          for (let c = 1; c <= 2 && mIdx < sortedDay2.length; c++) {
            const match = sortedDay2[mIdx];
            match.day = 2;
            match.court = c;
            match.startTime = minutesToTime(day2Slots[si].start);
            match.endTime = minutesToTime(day2Slots[si].end);
            mIdx++;
          }
        }
      }

      // 分配裁判
      assignReferees(allMatches);

      appData.groupSchedule = allMatches;
      appData.scheduleLocked = false;
      renderSchedule();
      updateLockButton();
      analyzeSchedule();
    }

    // 蛇形分组算法
    function serpentineGrouping(teams) {
      // 创建种子排序列表（随机打乱）
      const seeded = [...teams];
      shuffleArray(seeded);

      const groupA = [];
      const groupB = [];

      // 首先处理同城约束
      const cityTeams = {};
      seeded.forEach(t => {
        if (!cityTeams[t.city]) cityTeams[t.city] = [];
        cityTeams[t.city].push(t);
      });

      // 同城队伍强制分到不同组
      const assigned = new Set();
      const sameCityCities = Object.keys(cityTeams).filter(c => cityTeams[c].length >= 2);

      for (const city of sameCityCities) {
        const cityTeamList = cityTeams[city];
        // 交替分配
        cityTeamList.forEach((t, i) => {
          if (i % 2 === 0) {
            groupA.push(t.id);
          } else {
            groupB.push(t.id);
          }
          assigned.add(t.id);
        });
      }

      // 其余队伍蛇形分配
      const remaining = seeded.filter(t => !assigned.has(t.id));
      remaining.forEach((t, i) => {
        if (i % 2 === 0) {
          groupA.push(t.id);
        } else {
          groupB.push(t.id);
        }
      });

      return [
        { name: 'A', teams: groupA },
        { name: 'B', teams: groupB }
      ];
    }

    // Fisher-Yates 洗牌
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    // 单循环赛生成（Berge 算法 / 圆轮转法）
    function generateRoundRobin(teamIds, groupName) {
      const n = teamIds.length;
      if (n < 2) return [];

      const matches = [];
      const list = [...teamIds];

      // 如果是奇数，添加一个 "轮空" 位
      const hasBye = n % 2 === 1;
      if (hasBye) list.push(null); // null 代表轮空

      const total = list.length;
      const rounds = total - 1;

      // 固定第一个位置，其余进行轮转
      for (let r = 0; r < rounds; r++) {
        for (let i = 0; i < total / 2; i++) {
          const a = list[i];
          const b = list[total - 1 - i];
          if (a === null || b === null) continue; // 轮空跳过
          matches.push({
            matchId: genMatchId(),
            group: groupName,
            round: r + 1,
            teamA: a,
            teamB: b,
            day: 1,
            court: 0,
            startTime: '',
            endTime: '',
            refTeams: []
          });
        }
        // 轮转：保持 list[0] 不变，其余顺时针轮转
        const last = list.pop();
        list.splice(1, 0, last);
      }
      return matches;
    }

    // 分配时间槽和场地
    // 午餐规则：确保午餐时段是一个连续的空白块，不会出现"吃饭-比赛-吃饭"
    // 策略：先填满上午时间槽，留出午餐连续空白，再填下午时间槽
    // 小组赛分配：第1天全天 + 第2天直到12:00
    function assignTimeSlots(matches, day) {
      const startMin = timeToMinutes(appData.config.dayStart);
      const lunchStartMin = timeToMinutes(appData.config.lunchStart);
      const lunchEndMin = timeToMinutes(appData.config.lunchEnd);
      const dayEndMin = timeToMinutes(appData.config.dayEnd);

      const slotDuration = 37; // 每场37分钟（27比赛+10间隔）
      const matchDuration = 27;

      // 第一步：生成上午时间槽（从开始到午餐开始）
      const morningSlots = [];
      let t = startMin;
      while (t + matchDuration <= lunchStartMin) {
        morningSlots.push({ start: t, end: t + matchDuration });
        t += slotDuration;
      }

      // 第二步：生成下午时间槽（从午餐结束到当日结束）
      const afternoonSlots = [];
      t = lunchEndMin;
      while (t + matchDuration <= dayEndMin) {
        afternoonSlots.push({ start: t, end: t + matchDuration });
        t += slotDuration;
      }

      // 合并：上午槽 + 午餐空白 + 下午槽，午餐时段自然形成连续空白
      const allSlots = [...morningSlots, ...afternoonSlots];

      // 分配比赛到时间槽
      const sortedMatches = optimizeMatchOrder(matches, allSlots);
      let matchIdx = 0;
      for (let si = 0; si < allSlots.length && matchIdx < sortedMatches.length; si++) {
        for (let c = 1; c <= 2 && matchIdx < sortedMatches.length; c++) {
          const match = sortedMatches[matchIdx];
          match.day = day;
          match.court = c;
          match.startTime = minutesToTime(allSlots[si].start);
          match.endTime = minutesToTime(allSlots[si].end);
          matchIdx++;
        }
      }

      // 处理剩余的比赛
      const remaining = sortedMatches.length - matchIdx;
      if (remaining > 0) {
        if (day === 1) {
          showToast(`第1天时间槽不足，有 ${remaining} 场小组赛未能安排，将顺延至第2天`);
        } else if (day === 2) {
          showToast(`第2天时间槽也不足，有 ${remaining} 场小组赛未能安排`);
        }
      }

      // 分配裁判
      assignReferees(sortedMatches);
    }

    // 优化比赛顺序（减少背靠背，尤其是换色背靠背）
    // slots 参数用于识别午餐前后的分隔点
    function optimizeMatchOrder(matches, slots) {
      const n = matches.length;
      const teamLastSlot = {}; // teamId -> last slot index
      const teamPrevSlot = {}; // teamId -> second-to-last slot index
      const teamLastColor = {}; // teamId -> 'white' | 'black'
      const teamWhiteCount = {};
      const teamBlackCount = {};
      appData.teams.forEach(t => {
        teamWhiteCount[t.id] = 0;
        teamBlackCount[t.id] = 0;
      });

      // 计算午餐分隔索引：找到 slots 中午餐中点前后的分界
      let lunchSplitIdx = -1;
      if (slots && slots.length > 0) {
        for (let i = 1; i < slots.length; i++) {
          if (slots[i].start - slots[i - 1].end > 15) { // 间隔超过15分钟视为午餐间断
            lunchSplitIdx = i;
            break;
          }
        }
      }

      // 先按轮次分组
      const rounds = {};
      matches.forEach(m => {
        if (!rounds[m.round]) rounds[m.round] = [];
        rounds[m.round].push(m);
      });
      // 把各轮次比赛放到一个大列表
      let ordered = [];
      Object.values(rounds).forEach(r => { ordered.push(...r); });

      // 贪心优化：遍历所有比赛，选择间隔最大的放入
      let result = [];
      let remaining = [...ordered];
      let slotIdx = 0;

      while (remaining.length > 0) {
        // 两个场地并行，每轮选2场
        let bestPair = null;
        let bestScore = -Infinity;

        // 尝试所有两两组合（选两场同时进行）
        for (let i = 0; i < remaining.length && i < 20; i++) {
          for (let j = i + 1; j < remaining.length && j < 20; j++) {
            const m1 = remaining[i];
            const m2 = remaining[j];
            // 不能有相同队伍
            if (m1.teamA === m2.teamA || m1.teamA === m2.teamB ||
                m1.teamB === m2.teamA || m1.teamB === m2.teamB) continue;

            let score = 0;
            // 计算间隔得分
            [m1, m2].forEach(m => {
              const lastA = teamLastSlot[m.teamA] ?? -999;
              const lastB = teamLastSlot[m.teamB] ?? -999;
              const gap = slotIdx - Math.max(lastA, lastB);
              score += gap * 10; // 间隔越大越好

              // 检查是否会产生连续3场出场的情况
              [m.teamA, m.teamB].forEach(tid => {
                const lastSlot = teamLastSlot[tid] ?? -999;
                if (lastSlot >= slotIdx - 2 && lastSlot >= 0) {
                  // 如果上一场在 slotIdx-1 或 slotIdx-2，且再前一场也在附近，则会产生连续3场
                  const prevSlot = teamPrevSlot?.[tid] ?? -999;
                  if (prevSlot >= slotIdx - 2 && prevSlot >= 0) {
                    score -= 200; // 严厉惩罚：避免连续3场
                  }
                }
              });

              // 检查是否产生换色背靠背
              [m.teamA, m.teamB].forEach(tid => {
                const lastColor = teamLastColor[tid];
                const isWhite = (m.teamA === tid);
                const color = isWhite ? 'white' : 'black';
                if (lastColor && lastColor !== color && gap <= 2) {
                  score -= 50; // 严厉惩罚换色背靠背
                } else if (gap <= 2) {
                  score -= 10; // 普通背靠背
                }
                // 白黑均衡奖励
                const wDiff = Math.abs((teamWhiteCount[tid] + (color === 'white' ? 1 : 0)) -
                                        (teamBlackCount[tid] + (color === 'black' ? 1 : 0)));
                score -= wDiff * 5;
              });
            });

            // 不同组的比赛放在一起加分
            if (m1.group !== m2.group) score += 5;

            // 午餐前后惩罚：如果当前槽紧邻午餐分隔点，且某队上一场在午餐前另一侧，惩罚
            if (lunchSplitIdx > 0) {
              [m1, m2].forEach(m => {
                [m.teamA, m.teamB].forEach(tid => {
                  const lastSlot = teamLastSlot[tid] ?? -999;
                  if (lastSlot >= 0) {
                    const isLunchBoundary =
                      (lastSlot < lunchSplitIdx && slotIdx >= lunchSplitIdx) ||
                      (lastSlot >= lunchSplitIdx && slotIdx < lunchSplitIdx);
                    if (isLunchBoundary) {
                      // 午餐前后各一场：没有连续比赛的问题，反而可以有休息
                      // 不惩罚
                    }
                  }
                });
              });
            }

            if (score > bestScore) {
              bestScore = score;
              bestPair = [i, j];
            }
          }
        }

        if (bestPair) {
          const [i, j] = bestPair;
          const selected = [remaining[i], remaining[j]];
          // 从 remaining 中移除（先移除较大索引）
          remaining.splice(j, 1);
          remaining.splice(i, 1);

          result.push(...selected);
          // 更新追踪
          selected.forEach(m => {
            [m.teamA, m.teamB].forEach(tid => {
              teamPrevSlot[tid] = teamLastSlot[tid] ?? -999;
              teamLastSlot[tid] = slotIdx;
              teamLastColor[tid] = (m.teamA === tid) ? 'white' : 'black';
              if (m.teamA === tid) teamWhiteCount[tid]++;
              else teamBlackCount[tid]++;
            });
          });
          slotIdx++;
        } else {
          // 只剩一场或找不到配对
          const m = remaining.shift();
          result.push(m);
          [m.teamA, m.teamB].forEach(tid => {
            teamPrevSlot[tid] = teamLastSlot[tid] ?? -999;
            teamLastSlot[tid] = slotIdx;
            teamLastColor[tid] = (m.teamA === tid) ? 'white' : 'black';
            if (m.teamA === tid) teamWhiteCount[tid]++;
            else teamBlackCount[tid]++;
          });
          slotIdx++;
        }
      }

      return result;
    }

    // 分配裁判
    function assignReferees(matches) {
      const teamIds = appData.teams.map(t => t.id);
      const teamCityMap = {};
      appData.teams.forEach(t => { teamCityMap[t.id] = t.city; });

      const refCount = {};
      teamIds.forEach(id => { refCount[id] = 0; });

      // 记录每个队伍在每个slot的出现情况（参赛或裁判）
      // teamAppearances[slot][teamId] = 'play' | 'ref' | null
      const teamAppearances = Array.from({ length: matches.length }, () => ({}));

      // 先分配参赛队伍
      matches.forEach((m, idx) => {
        teamAppearances[idx][m.teamA] = 'play';
        teamAppearances[idx][m.teamB] = 'play';
      });

      matches.forEach((match, idx) => {
        const participantTeams = new Set([match.teamA, match.teamB]);
        const participantCities = new Set([teamCityMap[match.teamA], teamCityMap[match.teamB]]);

        // 找出可以当裁判的队伍：非参赛、非同城
        let candidates = teamIds.filter(id => {
          return !participantTeams.has(id) && !participantCities.has(teamCityMap[id]);
        });

        // 检查每个候选队伍在前后2个slot内是否已经连续出现了2次
        // 规则：任意连续3个slot中，同一队伍最多出现2次
        candidates = candidates.filter(candidateId => {
          return !willViolateRule(candidateId, idx, teamAppearances);
        });

        // 优先选裁判次数少的
        candidates.sort((a, b) => refCount[a] - refCount[b]);

        // 选2支队伍做裁判
        const refs = candidates.slice(0, 2);
        match.refTeams = refs;
        refs.forEach(id => {
          refCount[id]++;
          teamAppearances[idx][id] = 'ref';
        });
      });
    }

    // 检查：如果在slotIdx分配裁判给teamId，是否会违反"连续3场最多出现2次"规则
    function willViolateRule(teamId, slotIdx, teamAppearances) {
      // 检查以slotIdx为中心的窗口：[slotIdx-2, slotIdx-1, slotIdx]
      // 以及 [slotIdx-1, slotIdx, slotIdx+1]
      // 以及 [slotIdx, slotIdx+1, slotIdx+2]
      // 实际上只需要检查包含slotIdx的所有长度为3的窗口

      for (let start = Math.max(0, slotIdx - 2); start <= Math.min(slotIdx, teamAppearances.length - 3); start++) {
        let count = 0;
        for (let s = start; s < start + 3; s++) {
          if (teamAppearances[s] && teamAppearances[s][teamId]) {
            count++;
          }
        }
        if (count > 2) return true;
      }
      return false;
    }

    // 渲染赛程表（表格形式）
    function renderSchedule() {
      const container = document.getElementById('scheduleDisplay');
      if (appData.groupSchedule.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon-large">&#128197;</div><p>请先添加队伍并生成赛程</p></div>';
        return;
      }

      // 按天和场地组织
      const dayMap = {};
      appData.groupSchedule.forEach(m => {
        if (!dayMap[m.day]) dayMap[m.day] = {};
        if (!dayMap[m.day][m.court]) dayMap[m.day][m.court] = [];
        dayMap[m.day][m.court].push(m);
      });

      // 每天排序
      Object.values(dayMap).forEach(courts => {
        Object.values(courts).forEach(list => {
          list.sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
        });
      });

      // 将淘汰赛也加入 dayMap（第2天）
      if (appData.knockoutSchedule.length > 0) {
        appData.knockoutSchedule.forEach(m => {
          if (!dayMap[m.day]) dayMap[m.day] = { 1: [], 2: [] };
          if (m.court === 0) m.court = 1;
          dayMap[m.day][m.court].push(m);
        });
        Object.keys(dayMap).forEach(day => {
          [1, 2].forEach(court => {
            dayMap[day][court].sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
          });
        });
      }

      let html = '';
      const days = Object.keys(dayMap).sort(Number);

      days.forEach(day => {
        const dayNum = parseInt(day);
        const matchesOnDay = appData.groupSchedule.filter(m => m.day === dayNum);
        const hasGroupMatches = matchesOnDay.length > 0;
        const hasKnockoutMatches = appData.knockoutSchedule.some(m => m.day === dayNum);
        let dayLabel;
        if (hasGroupMatches && hasKnockoutMatches) {
          dayLabel = `第${dayNum}天 - 小组赛 & 淘汰赛`;
        } else if (hasGroupMatches) {
          dayLabel = `第${dayNum}天 - 小组赛`;
        } else if (hasKnockoutMatches) {
          dayLabel = `第${dayNum}天 - 淘汰赛`;
        } else {
          dayLabel = `第${dayNum}天`;
        }

        // 表格形式
        html += `<div class="day-header">${dayLabel}</div>`;
        html += '<div class="schedule-table-wrapper">';
        html += '<table class="schedule-table">';
        html += '<thead><tr><th class="time-col">时间</th>';
        html += '<th class="court-col-head">场地 1</th><th class="court-col-head">场地 2</th>';
        html += '</tr></thead>';
        html += '<tbody>';

        // 收集所有时间槽
        const allTimeSlots = new Set();
        [1, 2].forEach(c => {
          (dayMap[day]?.[c] || []).forEach(m => allTimeSlots.add(m.startTime));
        });
        const sortedTimes = [...allTimeSlots].sort((a, b) => timeToMinutes(a) - timeToMinutes(b));

        sortedTimes.forEach(time => {
          html += '<tr>';
          html += `<td class="time-cell">${time}</td>`;
          [1, 2].forEach(c => {
            const match = (dayMap[day]?.[c] || []).find(m => m.startTime === time);
            if (match) {
              html += `<td class="court-cell">${renderMatchSlotTable(match)}</td>`;
            } else {
              html += '<td class="court-cell empty-cell">-</td>';
            }
          });
          html += '</tr>';
        });

        html += '</tbody></table>';
        html += '</div>';
      });

      container.innerHTML = html;
    }

    // 表格形式渲染单个比赛
    function renderMatchSlotTable(m) {
      const teamA = appData.teams.find(t => t.id === m.teamA);
      const teamB = appData.teams.find(t => t.id === m.teamB);
      if (!teamA || !teamB) return '<span class="empty-cell">-</span>';

      const result = appData.results[m.matchId];
      const isKnockout = m.group === 'KO';
      const hasResult = !!result;
      const scoreText = result ? ` (${result.scoreA}:${result.scoreB})` : '';
      const btnText = hasResult ? '修改' : '录入';
      const btnClass = hasResult ? 'btn-success' : 'btn-primary';
      const borderColor = hasResult ? 'border-right:3px solid var(--success)' : 'border-right:3px solid var(--primary)';
      const isLocked = appData.scheduleLocked && !isKnockout;
      const lockedStyle = isLocked ? 'opacity:0.5' : '';

      return `<div style="padding:0.4rem 0.3rem;border-bottom:1px solid var(--rule-light);${borderColor};${lockedStyle}">
        <div style="font-weight:bold;font-size:0.85rem">
          <span class="match-team-white">${escHtml(teamA.name)}</span>
          <span style="color:var(--muted);margin:0 0.2rem">VS</span>
          <span class="match-team-black">${escHtml(teamB.name)}</span>
          ${scoreText ? `<span style="color:var(--accent-dark);font-weight:bold;margin-left:0.3rem">${scoreText}</span>` : ''}
        </div>
        ${isKnockout ? '<div style="font-size:0.75rem;color:var(--muted);margin-top:2px">' + escHtml(m.label || '') + '</div>' :
          (m.refTeams.length > 0 ? '<div style="font-size:0.75rem;color:var(--muted);margin-top:2px">&#128214; ' + m.refTeams.map(rid => { const rt = appData.teams.find(t => t.id === rid); return rt ? rt.name : '?'; }).join(', ') + '</div>' : '')}
        <button class="btn btn-xs ${btnClass}" onclick="openScoreModal('${m.matchId}')" style="margin-top:2px;padding:1px 6px;font-size:0.7rem">${btnText}</button>
      </div>`;
    }

    /* ===== 拖拽交换比赛 ===== */
    let dragMatchId = null;

    function onDragStart(e) {
      dragMatchId = e.currentTarget.dataset.matchId;
      e.currentTarget.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragMatchId);
    }

    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function onDragEnter(e) {
      e.preventDefault();
      const slot = e.currentTarget;
      if (!slot.classList.contains('lunch-break')) {
        slot.classList.add('drag-over');
      }
    }

    function onDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function onDrop(e) {
      e.preventDefault();
      const targetSlot = e.currentTarget;
      targetSlot.classList.remove('drag-over');
      if (targetSlot.classList.contains('lunch-break')) return;

      const targetMatchId = targetSlot.dataset.matchId;
      if (!dragMatchId || !targetMatchId || dragMatchId === targetMatchId) return;

      // 在 groupSchedule 中找到两场比赛并交换时间、场地
      const srcMatch = appData.groupSchedule.find(m => m.matchId === dragMatchId);
      const tgtMatch = appData.groupSchedule.find(m => m.matchId === targetMatchId);

      if (srcMatch && tgtMatch) {
        // 交换时间、场地
        [srcMatch.day, tgtMatch.day] = [tgtMatch.day, srcMatch.day];
        [srcMatch.court, tgtMatch.court] = [tgtMatch.court, srcMatch.court];
        [srcMatch.startTime, tgtMatch.startTime] = [tgtMatch.startTime, srcMatch.startTime];
        [srcMatch.endTime, tgtMatch.endTime] = [tgtMatch.endTime, srcMatch.endTime];
        // 重新分配裁判
        assignReferees(appData.groupSchedule);
        renderSchedule();
        showToast('赛程已调整，裁判已重新分配');
      }
    }

    /* ===== 赛程分析 ===== */
    function analyzeSchedule() {
      if (appData.groupSchedule.length === 0) {
        alert('请先生成赛程');
        return;
      }

      const container = document.getElementById('analysisResult');
      let html = '';

      // 收集所有比赛按开始时间排序
      const allMatches = [...appData.groupSchedule].sort((a, b) =>
        (a.day * 1000 + timeToMinutes(a.startTime)) - (b.day * 1000 + timeToMinutes(b.startTime))
      );

      // 建立每个队伍的比赛时间序列（参赛+裁判）
      const teamMatches = {};
      appData.teams.forEach(t => {
        teamMatches[t.id] = allMatches.filter(m =>
          m.teamA === t.id || m.teamB === t.id
        ).map(m => ({
          day: m.day,
          startTime: m.startTime,
          endTime: m.endTime,
          court: m.court,
          isWhite: m.teamA === t.id,
          matchId: m.matchId
        }));
      });

      // 分析背靠背（相邻时间槽 = 背靠背）
      const teamBackToBack = {};
      appData.teams.forEach(t => {
        teamBackToBack[t.id] = { total: 0, colorChange: 0, noColorChange: 0, details: [] };
      });
      const SLOT_GAP = 37;
      appData.teams.forEach(t => {
        const matches = teamMatches[t.id];
        for (let i = 1; i < matches.length; i++) {
          if (matches[i].day !== matches[i - 1].day) continue;
          const gapMin = timeToMinutes(matches[i].startTime) - timeToMinutes(matches[i - 1].endTime);
          if (gapMin <= SLOT_GAP) {
            teamBackToBack[t.id].total++;
            if (matches[i].isWhite !== matches[i - 1].isWhite) {
              teamBackToBack[t.id].colorChange++;
            } else {
              teamBackToBack[t.id].noColorChange++;
            }
            teamBackToBack[t.id].details.push(
              `第${matches[i].day}天 ${matches[i - 1].startTime}-${matches[i].startTime}`
            );
          }
        }
      });

      // 分析午餐时间
      const lunchStart = 660; // 11:00
      const lunchEnd = 780;   // 13:00
      const teamLunchFree = {};
      appData.teams.forEach(t => {
        const playMatches = teamMatches[t.id];
        let totalLunchBusy = 0;
        playMatches.forEach(m => {
          const mStartMin = timeToMinutes(m.startTime);
          const mEndMin = timeToMinutes(m.endTime);
          const overlapStart = Math.max(mStartMin, lunchStart);
          const overlapEnd = Math.min(mEndMin, lunchEnd);
          if (overlapStart < overlapEnd) {
            totalLunchBusy += overlapEnd - overlapStart;
          }
        });
        teamLunchFree[t.id] = 120 - totalLunchBusy;
      });

      // 分析连续三场（参赛+裁判混合）
      const teamTripleViolations = {};
      appData.teams.forEach(t => {
        const fullSchedule = [];
        allMatches.forEach((m, idx) => {
          if (m.teamA === t.id || m.teamB === t.id) {
            fullSchedule.push({ slot: idx, type: 'play' });
          }
          if (m.refTeams && m.refTeams.includes(t.id)) {
            fullSchedule.push({ slot: idx, type: 'ref' });
          }
        });
        fullSchedule.sort((a, b) => a.slot - b.slot);

        let violationCount = 0;
        for (let i = 2; i < fullSchedule.length; i++) {
          if (fullSchedule[i].slot === fullSchedule[i - 1].slot + 1 &&
              fullSchedule[i - 1].slot === fullSchedule[i - 2].slot + 1) {
            violationCount++;
          }
        }
        teamTripleViolations[t.id] = violationCount;
      });

      // ===== 计算每个队伍的得分 =====
      const teamScores = [];
      appData.teams.forEach(t => {
        const tid = t.id;
        let score = 100;
        const deductions = [];

        // 背靠背不换色：-10分每次
        const noColorBB = teamBackToBack[tid].noColorChange;
        if (noColorBB > 0) {
          score -= noColorBB * 10;
          deductions.push(`背靠背不换色×${noColorBB} (-${noColorBB * 10})`);
        }

        // 背靠背换色：-20分每次
        const colorBB = teamBackToBack[tid].colorChange;
        if (colorBB > 0) {
          score -= colorBB * 20;
          deductions.push(`背靠背换色×${colorBB} (-${colorBB * 20})`);
        }

        // 午餐时间少于90分钟：-10分
        const lunchFree = teamLunchFree[tid];
        if (lunchFree < 90) {
          score -= 10;
          deductions.push(`午餐空闲${lunchFree}分钟 < 90 (-10)`);
        }

        // 连续三场：-20分每次
        const tripleV = teamTripleViolations[tid];
        if (tripleV > 0) {
          score -= tripleV * 20;
          deductions.push(`连续三场×${tripleV} (-${tripleV * 20})`);
        }

        teamScores.push({
          team: t,
          score: Math.max(0, score),
          deductions,
          backToBack: teamBackToBack[tid].total,
          lunchFree,
          tripleViolations: tripleV
        });
      });

      // 按得分排序
      teamScores.sort((a, b) => b.score - a.score);

      // 计算平均分和标准差
      const avgScore = teamScores.reduce((s, t) => s + t.score, 0) / teamScores.length;
      const stdDev = Math.sqrt(teamScores.reduce((s, t) => s + Math.pow(t.score - avgScore, 2), 0) / teamScores.length);

      // ===== 渲染 =====
      html += '<div class="analysis-section">';
      html += '<h4>各队赛程得分（满分100）</h4>';
      html += '<div class="table-wrapper"><table>';
      html += '<thead><tr><th class="text-center">排名</th><th>队伍</th><th class="text-center">得分</th><th>扣分项</th></tr></thead>';
      html += '<tbody>';
      teamScores.forEach((ts, idx) => {
        const rank = idx + 1;
        const rankClass = rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : (rank === 3 ? 'rank-3' : ''));
        const scoreColor = ts.score >= 90 ? 'success-text' : (ts.score >= 70 ? '' : 'warning-item');
        html += `<tr>
          <td class="text-center ${rankClass}">${rank}</td>
          <td>${escHtml(ts.team.name)}</td>
          <td class="text-center text-bold ${scoreColor}">${ts.score}</td>
          <td style="font-size:0.8rem;color:var(--muted)">
            ${ts.deductions.length > 0 ? ts.deductions.join('<br>') : '<span style="color:var(--success)">无扣分</span>'}
          </td>
        </tr>`;
      });
      html += '</tbody></table></div>';
      html += '</div>';

      // 总体评价
      html += '<div class="analysis-section">';
      html += '<h4>总体评价</h4>';
      html += `<p style="margin:0.5rem 0">各队平均得分：<strong>${avgScore.toFixed(1)}</strong> / 100</p>`;
      html += `<p style="margin:0.5rem 0">得分标准差：<strong>${stdDev.toFixed(1)}</strong>（越小越均衡）</p>`;

      if (stdDev <= 5) {
        html += '<div class="analysis-item success-text">&#9989; 各队赛程得分非常接近，安排均衡</div>';
      } else if (stdDev <= 15) {
        html += '<div class="analysis-item">&#128994; 各队赛程得分有一定差异，但基本可接受</div>';
      } else {
        html += '<div class="analysis-item warning-item">&#128308; 各队赛程得分差异较大，建议重新调整赛程</div>';
      }
      html += '</div>';

      container.innerHTML = html;
    }

      currentScoreMatch = match;

      // 淘汰赛feedFrom类型的比赛（季军赛、冠亚军决赛）teamA/teamB初始为null，需要先刷新
      if (match.teamA == null && match.teamB == null) {
        updateKnockoutTeamsFromResults();
        // 重新查找（此时teamA/teamB已被填充）
        match = appData.knockoutSchedule.find(m => m.matchId === matchId);
        // 如果还是null，说明半决赛还没出结果
        if (!match || match.teamA == null || match.teamB == null) {

      document.getElementById('scoreTeamBLabel').textContent = `${teamB.name} (黑)`;

    // 更新射手榜数据

    /* ===== Tab 3: 积分与排名 ===== */
    function computeStandings() {
      appData.standings = [];

      appData.groups.forEach(group => {
        const table = {};
        group.teams.forEach(tid => {
          table[tid] = {
            teamId: tid,
            name: appData.teams.find(t => t.id === tid)?.name || '?',
            played: 0, won: 0, drawn: 0, lost: 0,
            goalsFor: 0, goalsAgainst: 0, points: 0,
            // 用于排名比较的内部字段
            headToHead: {}, // 对各队的战绩
            headToHeadPoints: 0 // 对相关队的积分
          };
        });

        // 统计小组赛结果
        appData.groupSchedule.forEach(m => {
          if (m.group !== group.name) return;
          if (!group.teams.includes(m.teamA) || !group.teams.includes(m.teamB)) return;
          const result = appData.results[m.matchId];
          if (!result) return;

          const a = table[m.teamA];
          const b = table[m.teamB];

          a.played++;
          b.played++;
          a.goalsFor += result.scoreA;
          a.goalsAgainst += result.scoreB;
          b.goalsFor += result.scoreB;
          b.goalsAgainst += result.scoreA;

          // 记录相互战绩
          if (!a.headToHead[m.teamB]) a.headToHead[m.teamB] = { points: 0, diff: 0 };
          if (!b.headToHead[m.teamA]) b.headToHead[m.teamA] = { points: 0, diff: 0 };

          if (result.scoreA > result.scoreB) {
            a.won++; a.points += 3;
            a.headToHead[m.teamB].points += 3;
            a.headToHead[m.teamB].diff += result.scoreA - result.scoreB;
            b.lost++;
            b.headToHead[m.teamA].points += 0;
            b.headToHead[m.teamA].diff += result.scoreB - result.scoreA;
          } else if (result.scoreA < result.scoreB) {
            b.won++; b.points += 3;
            b.headToHead[m.teamA].points += 3;
            b.headToHead[m.teamA].diff += result.scoreB - result.scoreA;
            a.lost++;
            a.headToHead[m.teamB].points += 0;
            a.headToHead[m.teamB].diff += result.scoreA - result.scoreB;
          } else {
            a.drawn++; a.points += 1;
            b.drawn++; b.points += 1;
            a.headToHead[m.teamB].points += 1;
            a.headToHead[m.teamB].diff += 0;
            b.headToHead[m.teamA].points += 1;
            b.headToHead[m.teamA].diff += 0;
          }
        });

        // 排名
        const teamList = Object.values(table);

        // 计算同分时相互战绩积分
        teamList.forEach(t => {
          // 对积分相同的队伍的相互战绩
          t.headToHeadPoints = 0;
          teamList.forEach(other => {
            if (other.teamId !== t.teamId && other.points === t.points) {
              t.headToHeadPoints += (t.headToHead[other.teamId]?.points || 0);
            }
          });
        });

        // 排序
        teamList.sort((a, b) => {
          // 1. 积分高者
          if (a.points !== b.points) return b.points - a.points;
          // 2. 相互战绩
          const h2hA = a.headToHead[b.teamId]?.points || 0;
          const h2hB = b.headToHead[a.teamId]?.points || 0;
          if (h2hA !== h2hB) return h2hB - h2hA;
          // 3. 胜场数
          if (a.won !== b.won) return b.won - a.won;
          // 4. 负场数（少的排前）
          if (a.lost !== b.lost) return a.lost - b.lost;
          // 5. 最少失球
          if (a.goalsAgainst !== b.goalsAgainst) return a.goalsAgainst - b.goalsAgainst;
          // 6. 最多进球
          if (a.goalsFor !== b.goalsFor) return b.goalsFor - a.goalsFor;
          // 7. 标记需手动决定
          a._tie = true;
          b._tie = true;
          return 0;
        });

        appData.standings.push({
          groupName: group.name,
          teams: teamList
        });
      });
    }

    function renderStandings() {
      const container = document.getElementById('standingsDisplay');
      if (appData.groups.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon-large">&#127942;</div><p>请先生成赛程</p></div>';

      }

        html += '<th class="text-center">失球</th><th class="text-center">净胜球</th>';
        html += '<th class="text-center">积分</th>';

          html += '<th class="text-center">出线</th>';
        }

        group.teams.forEach((t, idx) => {

          const qualified = numTeams < 8 ? true : (rank <= 2);

          // 只有打过比赛的队伍才显示排名标记
          const needDecideMark = (t._tie && t.played > 0) ? '<span class="need-decide">' + rank + '</span>' : rank;

          html += '<tr>';
          html += `<td class="text-center text-bold">${needDecideMark}</td>`;
          html += `<td>${escHtml(t.name)}</td>`;
          html += `<td class="text-center">${t.played}</td>`;
          html += `<td class="text-center">${t.won}</td>`;
          html += `<td class="text-center">${t.drawn}</td>`;
          html += `<td class="text-center">${t.lost}</td>`;
          html += `<td class="text-center">${t.goalsFor}</td>`;
          html += `<td class="text-center">${t.goalsAgainst}</td>`;
          html += `<td class="text-center">${gd > 0 ? '+' : ''}${gd}</td>`;
          html += `<td class="text-center text-bold">${t.points}</td>`;
          if (numTeams < 8) {
            html += `<td class="text-center ${qualified ? 'qualified' : ''}">${qualifiedLabel}</td>`;
          }
          html += '</tr>';
        });

        html += '</tbody></table></div>';
      });

      container.innerHTML = html;
    }

    /* ===== Tab 4: 淘汰赛 ===== */
    function generateKnockout() {

              matches: [
                { matchId: genMatchId(), label: '半决赛1', teamA: teams[0]?.teamId, teamB: teams[3]?.teamId, result: null },
                { matchId: genMatchId(), label: '半决赛2', teamA: teams[1]?.teamId, teamB: teams[2]?.teamId, result: null }
              ]
            },
            {
              name: '决赛',
              matches: [
                { matchId: genMatchId(), label: '冠亚军决赛', teamA: null, teamB: null, feedFrom: [0, 0], result: null },
                { matchId: genMatchId(), label: '季军赛', teamA: null, teamB: null, feedFrom: [0, 1], feedLoser: true, result: null }
              ]
            }
          ]
        };

        // 如果有8支队伍，还有排名赛
        if (teams.length >= 8) {
          bracket.rounds.splice(1, 0, {
            name: '排名赛(5-8)',
            matches: [
              { matchId: genMatchId(), label: '排名赛1', teamA: teams[4]?.teamId, teamB: teams[7]?.teamId, result: null },
              { matchId: genMatchId(), label: '排名赛2', teamA: teams[5]?.teamId, teamB: teams[6]?.teamId, result: null }
            ]
          });
          // 修正 feedFrom 索引（因为插入了排名赛）
          bracket.rounds[2].matches[0].feedFrom = [0, 0];
          bracket.rounds[2].matches[1].feedFrom = [0, 1];
        }
      } else {
        // 双组：半决赛2场（A1vsB2, B1vsA2）→ 季军赛 + 冠亚军决赛
        const groupA = appData.standings.find(g => g.groupName === 'A');
        const groupB = appData.standings.find(g => g.groupName === 'B');
        if (!groupA || !groupB) { alert('无法获取小组排名'); return; }

        const aTeams = groupA.teams;
        const bTeams = groupB.teams;

        bracket = {
          type: 'double',
          rounds: [
            {
              name: '半决赛',
              matches: [
                { matchId: genMatchId(), label: '半决赛1 (A1 vs B2)', teamA: aTeams[0]?.teamId, teamB: bTeams[1]?.teamId, result: null },
                { matchId: genMatchId(), label: '半决赛2 (B1 vs A2)', teamA: bTeams[0]?.teamId, teamB: aTeams[1]?.teamId, result: null }
              ]
            },
            {
              name: '决赛',
              matches: [
                { matchId: genMatchId(), label: '季军赛', teamA: null, teamB: null, feedFrom: [0, 0], feedLoser: true, result: null },
                { matchId: genMatchId(), label: '冠亚军决赛', teamA: null, teamB: null, feedFrom: [0, 0], feedLoser: false, result: null }
              ]
            }
          ]
        };
      }

      appData.knockoutBracket = bracket;

      // 分配淘汰赛时间（第2天）
      const koMatches = [];
      bracket.rounds.forEach(round => {
        round.matches.forEach(match => {
          koMatches.push({
            matchId: match.matchId,
            day: 2,
            court: 0,
            startTime: '',
            endTime: '',
            teamA: match.teamA,
            teamB: match.teamB,
            group: 'KO',
            round: round.name,
            label: match.label,
            refTeams: []
          });
        });
      });

      // 分配第2天时间槽
      assignKnockoutTimeSlots(koMatches);
      appData.knockoutSchedule = koMatches;

      renderKnockout();
    }

    function assignKnockoutTimeSlots(matches) {
      // 淘汰赛在第二天13:00以后开始
      // 流程：2场半决赛（同时）→ 休息30分钟 → 季军赛 → 直接冠亚军决赛
      const startMin = timeToMinutes(appData.config.dayStart);
      const lunchStartMin = timeToMinutes(appData.config.lunchStart);
      const lunchEndMin = timeToMinutes(appData.config.lunchEnd);
      const dayEndMin = timeToMinutes(appData.config.dayEnd);

      const slotDuration = 70; // 淘汰赛60分钟 + 10分钟间隔
      const matchDuration = 60;

      // 半决赛最早13:00开始
      const koStartMin = 780; // 13:00

      // 半决赛结束时间
      const sfEndMin = koStartMin + matchDuration; // 14:00

      // 季军赛必须在半决赛结束后休息满30分钟
      const tpStartMin = sfEndMin + 30; // 14:30

      // 冠亚军决赛在季军赛结束后直接进行
      const finalStartMin = tpStartMin + slotDuration; // 15:40

      const slots = [
        { start: koStartMin, end: koStartMin + matchDuration },      // 半决赛
        { start: tpStartMin, end: tpStartMin + matchDuration },      // 季军赛
        { start: finalStartMin, end: finalStartMin + matchDuration } // 冠亚军决赛
      ];

      // 分配比赛到时间槽
      let matchIdx = 0;
      for (let si = 0; si < slots.length && matchIdx < matches.length; si++) {
        // 半决赛有2个场地（2场同时），决赛轮次各1个场地
        const courts = (si === 0) ? 2 : 1;
        for (let c = 1; c <= courts && matchIdx < matches.length; c++) {
          matches[matchIdx].court = c;
          matches[matchIdx].startTime = minutesToTime(slots[si].start);
          matches[matchIdx].endTime = minutesToTime(slots[si].end);
          matchIdx++;
        }
      }

      // 分配裁判
      assignReferees(matches);
    }

    // 获取比赛胜者
    function getMatchWinner(match) {
      const result = appData.results[match.matchId];
      if (!result) return null;
      if (result.scoreA > result.scoreB) return match.teamA;
      if (result.scoreB > result.scoreA) return match.teamB;
      return null; // 平局
    }

    // 获取比赛败者
    function getMatchLoser(match) {
      const result = appData.results[match.matchId];
      if (!result) return null;
      if (result.scoreA < result.scoreB) return match.teamA;
      if (result.scoreB < result.scoreA) return match.teamB;
      return null;
    }

    // 更新淘汰赛对阵中的队伍（从结果推断后续轮次）
    function updateKnockoutTeamsFromResults() {
      if (!appData.knockoutBracket) return;
      const bracket = appData.knockoutBracket;

      // 先同步结果到 bracket
      bracket.rounds.forEach(round => {
        round.matches.forEach(match => {
          const result = appData.results[match.matchId];
          match.result = result || null;
        });
      });

      // 根据结果推导后续轮次队伍
      // 使用通用方式：通过 label 匹配
      if (bracket.type === 'single') {
        // 单组模式
        const sfRound = bracket.rounds[0]; // 半决赛轮
        if (!sfRound) return;
        const sf1 = sfRound.matches[0];
        const sf2 = sfRound.matches[1];

        // 决赛轮（可能是 index=1 或 index=2，取决于是否有排名赛）
        const finalRound = bracket.rounds.find(r =>
          r.name.includes('决赛') || r.name.includes('冠亚')
        );
        if (!finalRound) return;

        if (sf1 && sf2 && sf1.result && sf2.result) {
          // 冠亚军决赛：两场半决赛的胜者
          const finalMatch = finalRound.matches.find(m => m.label.includes('冠亚'));
          if (finalMatch) {
            finalMatch.teamA = getMatchWinner(sf1);
            finalMatch.teamB = getMatchWinner(sf2);
          }
          // 季军赛：两场半决赛的败者
          const thirdMatch = finalRound.matches.find(m => m.label.includes('季'));
          if (thirdMatch) {
            thirdMatch.teamA = getMatchLoser(sf1);
            thirdMatch.teamB = getMatchLoser(sf2);
          }
        }
      } else if (bracket.type === 'double') {
        // 双组模式：半决赛2场 → 季军赛 + 冠亚军决赛
        const sfRound = bracket.rounds[0];
        if (!sfRound) return;
        const sf1 = sfRound.matches[0]; // A1 vs B2
        const sf2 = sfRound.matches[1]; // B1 vs A2

        const finalRound = bracket.rounds[1];
        if (!finalRound) return;

        if (sf1 && sf2 && sf1.result && sf2.result) {
          // 冠亚军决赛：两场半决赛的胜者
          const finalMatch = finalRound.matches.find(m => m.label.includes('冠亚'));
          if (finalMatch) {
            finalMatch.teamA = getMatchWinner(sf1);
            finalMatch.teamB = getMatchWinner(sf2);
          }
          // 季军赛：两场半决赛的败者
          const thirdMatch = finalRound.matches.find(m => m.label.includes('季'));
          if (thirdMatch) {
            thirdMatch.teamA = getMatchLoser(sf1);
            thirdMatch.teamB = getMatchLoser(sf2);
          }
        }
      }

      // 同步回 knockoutSchedule
      syncKnockoutScheduleTeams();
    }

    // 同步 bracket 中的队伍信息到 knockoutSchedule
    function syncKnockoutScheduleTeams() {
      if (!appData.knockoutBracket || !appData.knockoutSchedule.length) return;
      appData.knockoutBracket.rounds.forEach(round => {
        round.matches.forEach(bracketMatch => {
          const scheduleMatch = appData.knockoutSchedule.find(m => m.matchId === bracketMatch.matchId);
          if (scheduleMatch) {
            scheduleMatch.teamA = bracketMatch.teamA;
            scheduleMatch.teamB = bracketMatch.teamB;
          }
        });
      });
    }

    function renderKnockout() {
      const container = document.getElementById('knockoutDisplay');
      if (!appData.knockoutBracket) {
        container.innerHTML = '<div class="empty-state"><div class="icon-large">&#9876;</div><p>请先完成所有小组赛比赛结果录入，然后点击"生成淘汰赛对阵"</p></div>';
        return;
      }

      updateKnockoutTeamsFromResults();

      // 按时间排序所有淘汰赛
      const koMatches = [...appData.knockoutSchedule].sort((a, b) => {
        if (a.day !== b.day) return a.day - b.day;
        return timeToMinutes(a.startTime) - timeToMinutes(b.startTime);
      });

      let html = '<div class="table-wrapper"><table class="schedule-table">';
      html += '<thead><tr><th class="time-col">时间</th><th>比赛</th><th class="text-center">比分</th><th>操作</th></tr></thead>';
      html += '<tbody>';

      // 确定前四名
      const top4 = computeTop4();

      koMatches.forEach(m => {
        const bracketMatch = findBracketMatch(m.matchId);
        const actualA = bracketMatch ? bracketMatch.teamA : m.teamA;
        const actualB = bracketMatch ? bracketMatch.teamB : m.teamB;

        const teamA = appData.teams.find(t => t.id === actualA);
        const teamB = appData.teams.find(t => t.id === actualB);
        if (!teamA || !teamB) return;

        const result = appData.results[m.matchId];
        const scoreText = result ? `${result.scoreA} : ${result.scoreB}` : '-';
        const hasResult = !!result;
        const btnText = hasResult ? '修改' : '录入';
        const btnClass = hasResult ? 'btn-success' : 'btn-primary';

        // 判断队伍名次
        const rankA = top4.findIndex(t => t.teamId === actualA);
        const rankB = top4.findIndex(t => t.teamId === actualB);
        const rankLabelA = rankA >= 0 ? ` <span class="badge badge-gold">#${rankA + 1}</span>` : '';
        const rankLabelB = rankB >= 0 ? ` <span class="badge badge-gold">#${rankB + 1}</span>` : '';

        html += '<tr>';
        html += `<td class="time-cell">${m.startTime}<br><span style="font-size:0.75rem;color:var(--muted)">${m.endTime}</span></td>`;
        html += `<td>
          <div style="font-weight:bold">
            <span class="match-team-white">${escHtml(teamA.name)}${rankLabelA}</span>
            <span style="color:var(--muted);margin:0 0.3rem">VS</span>
            <span class="match-team-black">${escHtml(teamB.name)}${rankLabelB}</span>
          </div>
          <div style="font-size:0.75rem;color:var(--muted);margin-top:2px">${escHtml(m.label || '')}</div>
        </td>`;
        html += `<td class="text-center" style="font-weight:bold;font-size:1.1rem">${scoreText}</td>`;
        html += `<td><button class="btn btn-xs ${btnClass}" onclick="openScoreModal('${m.matchId}')">${btnText}</button></td>`;
        html += '</tr>';
      });

      html += '</tbody></table></div>';

      // 前四名排名
      if (top4.length >= 4) {
        html += '<div class="day-header" style="margin-top:1.5rem">🏆 前四名排名</div>';
        html += '<div class="table-wrapper"><table>';
        html += '<thead><tr><th>排名</th><th>队伍</th><th>小组赛战绩</th><th>淘汰赛战绩</th></tr></thead>';
        html += '<tbody>';
        top4.forEach((t, idx) => {
          const groupTeam = appData.standings.flatMap(g => g.teams).find(gt => gt.id === t.teamId);
          const gpRecord = groupTeam ? `${groupTeam.won}胜${groupTeam.drawn}平${groupTeam.lost}负` : '-';
          const koWins = t.koWins || 0;
          html += `<tr>
            <td class="text-center text-bold" style="font-size:1.2rem">${idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : '#' + (idx + 1)))}</td>
            <td>${escHtml(t.teamName)}</td>
            <td class="text-center">${gpRecord}</td>
            <td class="text-center">${koWins}胜</td>
          </tr>`;
        });
        html += '</tbody></table></div>';
      }

      container.innerHTML = html;
    }

    // 计算前四名排名
    function computeTop4() {
      const top4 = [];
      appData.knockoutSchedule.forEach(m => {
        const result = appData.results[m.matchId];
        if (!result) return;
        const bracketMatch = findBracketMatch(m.matchId);
        const actualA = bracketMatch ? bracketMatch.teamA : m.teamA;
        const actualB = bracketMatch ? bracketMatch.teamB : m.teamB;
        if (!actualA || !actualB) return;

        const teamA = appData.teams.find(t => t.id === actualA);
        const teamB = appData.teams.find(t => t.id === actualB);
        if (!teamA || !teamB) return;

        // 检查是否已在top4中
        const existingA = top4.find(t => t.teamId === actualA);
        const existingB = top4.find(t => t.teamId === actualB);

        if (result.scoreA > result.scoreB) {
          // A胜
          if (!existingA) top4.push({ teamId: actualA, teamName: teamA.name, koWins: 1 });
          else existingA.koWins++;
        } else if (result.scoreB > result.scoreA) {
          // B胜
          if (!existingB) top4.push({ teamId: actualB, teamName: teamB.name, koWins: 1 });
          else existingB.koWins++;
        }
      });

      // 按淘汰赛胜场排序，相同则按小组赛积分排序
      top4.sort((a, b) => {
        if (b.koWins !== a.koWins) return b.koWins - a.koWins;
        const ga = appData.standings.flatMap(g => g.teams).find(t => t.id === a.teamId);
        const gb = appData.standings.flatMap(g => g.teams).find(t => t.id === b.teamId);
        return (gb?.points || 0) - (ga?.points || 0);
      });

      return top4;
    }

    function findBracketMatch(matchId) {
      if (!appData.knockoutBracket) return null;
      for (const round of appData.knockoutBracket.rounds) {
        for (const match of round.matches) {
          if (match.matchId === matchId) return match;
        }
      }
      return null;
    }

    /* ===== Tab 5: 射手榜 ===== */
    function renderScorers() {
      const container = document.getElementById('scorersDisplay');
      updateScorersData();

      if (appData.scorers.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon-large">&#9917;</div><p>暂无进球数据，请先录入比分并添加进球者</p></div>';
        return;
      }

      let html = '<div class="table-wrapper"><table>';
      html += '<thead><tr><th class="text-center">排名</th><th>球员</th><th>所属队伍</th><th class="text-center">进球数</th></tr></thead>';
      html += '<tbody>';

      appData.scorers.forEach((s, idx) => {
        const rank = idx + 1;
        const rankClass = rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : (rank === 3 ? 'rank-3' : ''));
        html += `<tr>
          <td class="text-center ${rankClass}">${rank}</td>
          <td>${escHtml(s.player)}</td>
          <td>${escHtml(s.teamName)}</td>
          <td class="text-center text-bold">${s.goals}</td>
        </tr>`;
      });

      html += '</tbody></table></div>';
      container.innerHTML = html;
    }

    /* ===== 弹窗控制 ===== */
    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    // 点击遮罩关闭
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
          overlay.classList.remove('active');
        }
      });
    });

    /* ===== Toast 提示 ===== */
    function showToast(msg) {
      const toast = document.createElement('div');
      toast.textContent = msg;
      toast.style.cssText = `
        position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
        background: var(--accent-dark); color: #fff; padding: 0.6rem 1.5rem;
        border-radius: 9999px; font-size: 0.9rem; z-index: 999;
        animation: fadeIn 0.3s ease; box-shadow: var(--shadow-lg);
      `;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 5000);
    }

    /* ===== HTML 转义 ===== */
    function escHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    /* ===== 初始化 ===== */
    renderTeamList();
    renderSchedule();
  </script>
</body>
</html>
