## 引言
随着容器化技术的普及，前端应用的部署方式也在发生着深刻的变革。本文将详细介绍如何将React/Vue前端应用进行Docker容器化部署。

## Dockerfile编写

\`\`\`dockerfile
# 多阶段构建
FROM node:18-alpine AS builder

WORKDIR /app

COPY package*.json ./
RUN npm ci --only=production

COPY . .
RUN npm run build

FROM nginx:alpine

COPY --from=builder /app/dist /usr/share/nginx/html

EXPOSE 80

CMD ["nginx", "-g", "daemon off;"]
\`\`\`

## 镜像优化策略

1. **多阶段构建**：减少最终镜像体积
2. **使用Alpine镜像**：基础镜像更小
3. **只复制必要文件**：避免复制node_modules到最终镜像

## 环境变量配置

\`\`\`bash
# 在构建时传递环境变量
docker build --build-arg VUE_APP_API_URL=https://api.example.com .
\`\`\`

## 总结
通过Docker容器化，前端应用可以实现快速部署、环境一致性和弹性扩展。`,

## 基础配置

\`\`\`nginx
server {
    listen 80;
    server_name example.com;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
\`\`\`

## 性能优化

\`\`\`nginx
gzip on;
gzip_types text/plain text/css application/json application/javascript;

expires 1y;
add_header Cache-Control "public, immutable";
\`\`\`

## SSL配置

\`\`\`nginx
server {
    listen 443 ssl;
    ssl_certificate /etc/ssl/certs/example.crt;
    ssl_certificate_key /etc/ssl/private/example.key;
}
\`\`\``,

在工业场景中，需要在嵌入式设备（如工控机、工业平板）上部署前端应用。

## 遇到的挑战

### 1. 硬件资源有限
嵌入式设备通常内存和存储空间较小，需要优化应用体积。

### 2. 网络环境复杂
边缘网络可能不稳定，需要支持离线部署。

### 3. 操作系统多样
不同设备可能运行不同的Linux发行版。

## 解决方案

### 1. 应用优化
- 使用Tree Shaking减少代码体积
- 启用Gzip压缩
- 图片资源CDN加速

### 2. 离线部署方案
\`\`\`bash
# 生成离线安装包
npm run build
tar -czvf app.tar.gz dist/

# 在设备上部署
scp app.tar.gz user@device:/opt/app/
ssh user@device "cd /opt/app && tar -xzvf app.tar.gz"
\`\`\`

使用轻量级容器运行时（如containerd）替代Docker，减少资源占用。`,

services:

\`\`\`yaml
services:

function showDetail(type, id) {
  const modal = document.getElementById('modal');
  const content = document.getElementById('modal-content');
  
  let item;
  switch(type) {
    case 'article':
      item = data.articles.find(a => a.id === id);
      content.innerHTML = `
        <div class="p-6">
          <button onclick="document.getElementById('modal').classList.add('hidden')" class="float-right text-gray-400 hover:text-white text-xl leading-none">&times;</button>
          <img src="${item.cover}" class="w-full h-48 object-cover rounded-lg mb-6">
          <h1 class="text-2xl font-bold text-white mb-4">${item.title}</h1>
          <div class="text-sm text-gray-500 mb-6">${item.author} · ${item.date} · ${item.views} 阅读</div>
          <div class="flex flex-wrap gap-2 mb-6">${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          <div class="markdown-body">${item.content}</div>
        </div>
      `;
      break;
    case 'case':
      item = data.cases.find(c => c.id === id);
      content.innerHTML = `
        <div class="p-6">
          <button onclick="document.getElementById('modal').classList.add('hidden')" class="float-right text-gray-400 hover:text-white text-xl leading-none">&times;</button>
          <div class="relative h-48 mb-6">
            <img src="${item.cover}" class="w-full h-full object-cover rounded-lg">
            <span class="absolute bottom-3 left-3 bg-black/70 px-3 py-1 text-sm text-white rounded">${item.industry}</span>
          </div>
          <h1 class="text-2xl font-bold text-white mb-4">${item.title}</h1>
          <div class="text-sm text-gray-500 mb-6">${item.author} · ${item.date}</div>
          <div class="markdown-body">${item.content}</div>
        </div>
      `;
      break;
    case 'question':
      item = data.questions.find(q => q.id === id);
      content.innerHTML = `
        <div class="p-6">
          <button onclick="document.getElementById('modal').classList.add('hidden')" class="float-right text-gray-400 hover:text-white text-xl leading-none">&times;</button>
          ${item.isSolved ? '<span class="text-green-500 text-sm mb-4 inline-block">✓ 已解决</span>' : ''}
          <h1 class="text-2xl font-bold text-white mb-4">${item.title}</h1>
          <div class="text-sm text-gray-500 mb-6">${item.author} · ${item.date} · ${item.views} 浏览</div>
          <div class="bg-[#21262d] p-4 rounded-lg mb-6">${item.content}</div>
          <div class="border-t border-[#30363d] pt-6">
            <h3 class="font-medium text-white mb-4">回答 (${item.answers})</h3>
            ${item.answerContent ? `
              <div class="bg-[#21262d] p-4 rounded-lg mb-6">
                <div class="flex items-center gap-3 mb-4">
                  <div class="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center text-white text-sm">D</div>
                  <span class="text-sm text-gray-300">部署大师</span>
                </div>
                <div class="markdown-body">${item.answerContent}</div>
              </div>
            ` : ''}
            <textarea class="w-full h-24 bg-[#21262d] border border-[#30363d] rounded-lg p-4 text-sm mt-4 resize-none" placeholder="写下你的回答..."></textarea>
            <button class="btn btn-primary mt-3">提交回答</button>
          </div>
        </div>
      `;
      break;
    case 'log':
      item = data.logs.find(l => l.id === id);
      content.innerHTML = `
        <div class="p-6">
          <button onclick="document.getElementById('modal').classList.add('hidden')" class="float-right text-gray-400 hover:text-white text-xl leading-none">&times;</button>
          <div class="flex items-center gap-2 mb-4">
            <span class="${item.status === 'completed' ? 'text-green-500' : 'text-yellow-500'} text-sm">
              ${item.status === 'completed' ? '✓ 已完成' : '⏳ 进行中'}
            </span>
          </div>
          <h1 class="text-2xl font-bold text-white mb-4">${item.title}</h1>
          <div class="text-sm text-gray-500 mb-6">${item.author} · ${item.date}</div>
          <div class="markdown-body">${item.content}</div>
        </div>
      `;
      break;
  }
  
  modal.classList.remove('hidden');
}

switchTab('home');
</script>
