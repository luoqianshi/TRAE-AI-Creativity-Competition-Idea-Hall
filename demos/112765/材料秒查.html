<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>材料秒查</title>
  <style>
    :root {
      --bg-primary: #f8fbff;
      --bg-card: #ffffff;
      --text-primary: #2a3b5c;
      --text-secondary: #6a7d9a;
      --border: #e2e8f0;
      --accent: #4a7fff;
      --accent-hover: #3a6ae0;
      --shadow: 0 2px 12px rgba(74, 127, 255, 0.08);
      --radius: 12px;
      --transition: all 0.25s ease;
    }

    .dark-mode {
      --bg-primary: #1a212e;
      --bg-card: #242d3e;
      --text-primary: #e2e8f0;
      --text-secondary: #a0aec0;
      --border: #3a4456;
      --accent: #5bb6ff;
      --accent-hover: #4aa5ec;
      --shadow: 0 2px 12px rgba(91, 182, 255, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      transition: var(--transition);
      padding: 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 24px;
    }

    h1 {
      font-weight: 700;
      font-size: 28px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--accent), #2a5ce0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .input-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 32px;
      transition: var(--transition);
    }

    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: var(--transition);
      background-color: var(--bg-card);
      color: var(--text-primary);
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 127, 255, 0.15);
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:hover:not(:disabled) {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hint {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .hint span {
      background: rgba(74, 127, 255, 0.1);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      transition: var(--transition);
    }

    .hint span:hover {
      background: var(--accent);
      color: white;
    }

    .result-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .result-title {
      font-size: 20px;
      font-weight: 700;
    }

    .result-count {
      background: rgba(74, 127, 255, 0.1);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .material-list {
      list-style: none;
    }

    .material-item {
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .material-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .material-icon {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      background: rgba(74, 127, 255, 0.1);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      color: var(--accent);
      font-weight: bold;
      font-size: 14px;
    }

    .material-content {
      flex: 1;
    }

    .material-name {
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 16px;
    }

    .material-note {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .material-remark {
      font-size: 13px;
      background: rgba(74, 127, 255, 0.08);
      color: #4a7fff;
      padding: 4px 10px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 4px;
    }

    .copy-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 14px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .copy-btn:hover:not(:disabled) {
      background: rgba(74, 127, 255, 0.1);
      color: var(--accent);
    }

    .copy-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    .theme-toggle svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    footer {
      text-align: center;
      margin-top: 48px;
      padding: 24px 0;
      color: var(--text-secondary);
      font-size: 14px;
      border-top: 1px solid var(--border);
      margin-bottom: 24px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .input-group {
        flex-direction: column;
      }

      h1 {
        font-size: 24px;
      }

      .input-section,
      .result-section {
        padding: 20px 16px;
      }

      .material-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .copy-btn {
        align-self: flex-end;
      }
    }

    /* Print-friendly */
    @media print {
      .theme-toggle,
      .hint,
      .copy-btn {
        display: none;
      }
      body {
        background: white;
        color: black;
      }
      .result-section {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>材料秒查</h1>
      <p class="subtitle">输入办事事项，秒出本区适用材料清单｜无需下载，即开即用</p>
    </header>

    <section class="input-section">
      <div class="input-group">
        <input type="text" id="queryInput" placeholder="例如：新生儿落户、灵活就业登记、退休提取公积金..." autocomplete="off" />
        <button id="searchBtn">查清单</button>
      </div>
      <div class="hint">
        <span data-suggest="新生儿落户">新生儿落户</span>
        <span data-suggest="灵活就业登记">灵活就业登记</span>
        <span data-suggest="退休提取公积金">退休提取公积金</span>
        <span data-suggest="社保卡补办">社保卡补办</span>
      </div>
    </section>

    <section class="result-section" id="resultSection">
      <div class="result-header">
        <h2 class="result-title" id="resultTitle">材料清单</h2>
        <span class="result-count" id="resultCount">0项材料</span>
      </div>
      <ul class="material-list" id="materialList">
        <!-- populated by JS -->
      </ul>
    </section>

    <footer>
      <p>本工具依据公开政务指南整理，具体以办事窗口现场要求为准</p>
    </footer>
  </div>

  <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
    <svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM12 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/></svg>
  </button>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    function setTheme(mode) {
      if (mode === 'dark') {
        body.classList.add('dark-mode');
        localStorage.setItem('theme', 'dark');
      } else {
        body.classList.remove('dark-mode');
        localStorage.setItem('theme', 'light');
      }
    }

    // 初始化主题
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      setTheme('dark');
      themeToggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM12 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/></svg>';
    } else {
      setTheme('light');
      themeToggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM12 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/></svg>';
    }

    themeToggle.addEventListener('click', () => {
      const isDark = body.classList.contains('dark-mode');
      if (isDark) {
        setTheme('light');
        themeToggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM12 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/></svg>';
      } else {
        setTheme('dark');
        themeToggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM16.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM12 16.5a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/></svg>';
      }
    });

    // 预设事项库（模拟TRAE解析结果）
    const materialDB = {
      '新生儿落户': [
        { name: '出生医学证明', note: '原件+复印件各1份', remark: '需加盖医院公章' },
        { name: '父母双方身份证', note: '原件+正反面复印件各1份', remark: '身份证须在有效期内' },
        { name: '结婚证', note: '原件+复印件1份', remark: '非婚生需提供亲子鉴定报告' },
        { name: '户口簿', note: '原件（户主页+本人页）', remark: '若父母不同户，需双方户口簿' }
      ],
      '灵活就业登记': [
        { name: '身份证', note: '原件+复印件1份', remark: '需在有效期内' },
        { name: '户口簿', note: '原件（户主页+本人页）', remark: '外地户籍需提供居住证' },
        { name: '《就业创业证》', note: '原件（如无则现场申领）', remark: '首次办理免费' }
      ],
      '退休提取公积金': [
        { name: '身份证', note: '原件+复印件1份', remark: '需在有效期内' },
        { name: '退休证或退休审批表', note: '原件+复印件1份', remark: '单位出具并盖章' },
        { name: '银行卡（本人I类储蓄卡）', note: '复印件1份', remark: '需注明开户行全称' }
      ],
      '社保卡补办': [
        { name: '身份证', note: '原件+复印件1份', remark: '需在有效期内' },
        { name: '近期白底免冠照片', note: '1寸电子版+纸质版1张', remark: '像素尺寸358×441' }
      ],
      '失业登记': [
        { name: '身份证', note: '原件+复印件1份', remark: '需在有效期内' },
        { name: '解除/终止劳动合同证明', note: '原件+复印件1份', remark: '单位出具并盖章' }
      ],
      '居住证申领': [
        { name: '身份证', note: '原件+复印件1份', remark: '需在有效期内' },
        { name: '居住地址证明', note: '原件+复印件1份', remark: '如房产证/租赁合同/居委会证明' },
        { name: '近期白底免冠照片', note: '1寸电子版+纸质版1张', remark: '像素尺寸358×441' }
      ]
    };

    // DOM元素
    const queryInput = document.getElementById('queryInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultSection = document.getElementById('resultSection');
    const resultTitle = document.getElementById('resultTitle');
    const resultCount = document.getElementById('resultCount');
    const materialList = document.getElementById('materialList');
    const hintSpans = document.querySelectorAll('.hint span');

    // 复制功能
    function copyToClipboard(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }
    }

    // 渲染结果
    function renderResult(query, items) {
      resultTitle.textContent = `「${query}」所需材料`;
      resultCount.textContent = `${items.length}项材料`;
      materialList.innerHTML = '';

      items.forEach((item, i) => {
        const li = document.createElement('li');
        li.className = 'material-item';
        li.innerHTML = `
          <div class="material-icon">${i + 1}</div>
          <div class="material-content">
            <div class="material-name">${item.name}</div>
            <div class="material-note">${item.note}</div>
            ${item.remark ? `<div class="material-remark">${item.remark}</div>` : ''}
          </div>
          <button class="copy-btn" data-text="${item.name}（${item.note}）${item.remark ? '｜' + item.remark : ''}">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm-4 4H4v10h12V5zm4 12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2v-4h2v4h12v-4h2v4z"/></svg>
            复制
          </button>
        `;
        materialList.appendChild(li);
      });

      // 绑定复制按钮事件
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          const text = e.currentTarget.getAttribute('data-text');
          copyToClipboard(text);
          const originalText = e.currentTarget.textContent;
          e.currentTarget.textContent = '已复制';
          setTimeout(() => {
            e.currentTarget.textContent = originalText;
          }, 1500);
        });
      });

      resultSection.style.display = 'block';
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 搜索逻辑
    function performSearch() {
      const query = queryInput.value.trim();
      if (!query) return;

      // 简单模糊匹配（支持中文关键词）
      let matchedKey = null;
      for (const key in materialDB) {
        if (query.includes(key) || key.includes(query) || 
            query.toLowerCase().includes(key.toLowerCase()) ||
            key.toLowerCase().includes(query.toLowerCase())) {
          matchedKey = key;
          break;
        }
      }

      if (matchedKey) {
        renderResult(matchedKey, materialDB[matchedKey]);
      } else {
        // 模拟AI泛化匹配（简单规则）
        const lowerQuery = query.toLowerCase();
        if (lowerQuery.includes('落户') || lowerQuery.includes('上户')) {
          renderResult('新生儿落户', materialDB['新生儿落户']);
        } else if (lowerQuery.includes('灵活') || lowerQuery.includes('就业')) {
          renderResult('灵活就业登记', materialDB['灵活就业登记']);
        } else if (lowerQuery.includes('退休') && lowerQuery.includes('公积')) {
          renderResult('退休提取公积金', materialDB['退休提取公积金']);
        } else if (lowerQuery.includes('社保') && lowerQuery.includes('补')) {
          renderResult('社保卡补办', materialDB['社保卡补办']);
        } else {
          // 默认返回首个示例
          const firstKey = Object.keys(materialDB)[0];
          renderResult(firstKey, materialDB[firstKey]);
        }
      }
    }

    // 事件绑定
    searchBtn.addEventListener('click', performSearch);

    queryInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') performSearch();
    });

    // 提示词点击
    hintSpans.forEach(span => {
      span.addEventListener('click', () => {
        queryInput.value = span.getAttribute('data-suggest');
        performSearch();
      });
    });

    // 初始化：聚焦输入框
    queryInput.focus();
  </script>
</body>
</html>
