<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodPalette 情绪调色盘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 8px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p {
            color: rgba(255,255,255,0.6);
            font-size: 1rem;
            letter-spacing: 2px;
        }
        .input-section {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        .input-section label {
            display: block;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .input-section textarea {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-section textarea:focus {
            border-color: rgba(255,255,255,0.4);
        }
        .input-section textarea::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            letter-spacing: 2px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .result-section {
            display: none;
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .emotion-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }
        .emotion-tag {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .palette-container {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }
        .palette-title {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .palette-colors {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .color-swatch {
            width: 100px;
            height: 140px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s;
            cursor: pointer;
        }
        .color-swatch:hover {
            transform: translateY(-5px);
        }
        .color-swatch .hex {
            font-size: 0.75rem;
            font-weight: 600;
            opacity: 0.9;
            margin-bottom: 2px;
        }
        .color-swatch .name {
            font-size: 0.65rem;
            opacity: 0.7;
        }
        .poster-container {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
        }
        .poster-container canvas {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .action-btns {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .sample-texts {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sample-tag {
            padding: 6px 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: all 0.3s;
        }
        .sample-tag:hover {
            background: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.9);
        }
        .mood-quote {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            border-left: 3px solid rgba(255,255,255,0.3);
            font-style: italic;
            color: rgba(255,255,255,0.8);
            line-height: 1.6;
        }
        footer {
            text-align: center;
            margin-top: 60px;
            padding: 20px;
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>MOODPALETTE</h1>
            <p>把心情翻译成色彩</p>
        </header>

        <div class="input-section">
            <label>此刻，你的心情是怎样的？</label>
            <textarea id="moodInput" placeholder="写下你此刻的感受，比如：今天工作压力大，有点焦虑但也有点期待周末..."></textarea>
            <div class="sample-texts">
                <span class="sample-tag" onclick="setSample('今天阳光明媚，心情很好，充满了能量')">阳光明媚</span>
                <span class="sample-tag" onclick="setSample('最近有点累，感觉做什么都提不起劲')">有点疲惫</span>
                <span class="sample-tag" onclick="setSample('既紧张又期待，明天就要面试了')">紧张期待</span>
                <span class="sample-tag" onclick="setSample('深夜一个人，有点孤独但也有点平静')">深夜独处</span>
            </div>
            <button class="btn" onclick="generatePalette()">生成情绪油画</button>
        </div>

        <div class="result-section" id="resultSection">
            <div class="emotion-tags" id="emotionTags"></div>

            <div class="palette-container">
                <div class="palette-title">你的专属情绪色彩</div>
                <div class="palette-colors" id="paletteColors"></div>
                <div class="mood-quote" id="moodQuote"></div>
            </div>

            <div class="poster-container">
                <div class="palette-title">情绪油画</div>
                <canvas id="posterCanvas" width="1080" height="1440"></canvas>
                <div class="action-btns">
                    <button class="btn btn-secondary" onclick="downloadPoster()">下载油画</button>
                    <button class="btn btn-secondary" onclick="resetAll()">重新生成</button>
                </div>
            </div>
        </div>

        <footer>
            MoodPalette · Trae AI 创造力大赛作品原型
        </footer>
    </div>

    <script>
        // ===== 情绪配置 =====
        const emotionMap = {
            '开心': { colors: ['#E8B860', '#D4A574', '#8FB996', '#7A9E7E'], desc: '暖阳洒满金色的田野' },
            '快乐': { colors: ['#E8B860', '#D4A574', '#8FB996', '#7A9E7E'], desc: '暖阳洒满金色的田野' },
            '兴奋': { colors: ['#C8553D', '#E07A5F', '#F2CC8F', '#81B29A'], desc: '绚烂烟花点亮夜空' },
            '平静': { colors: ['#8FA8A0', '#A8B5A0', '#C4D0B8', '#7A8B85'], desc: '湖水倒映着远山' },
            '安心': { colors: ['#8FA8A0', '#A8B5A0', '#C4D0B8', '#7A8B85'], desc: '湖水倒映着远山' },
            '忧郁': { colors: ['#5A6A78', '#7A8A98', '#9AABB0', '#6B757D'], desc: '阴雨中的灰色城市' },
            '难过': { colors: ['#5A6A78', '#7A8A98', '#9AABB0', '#6B757D'], desc: '阴雨中的灰色城市' },
            '悲伤': { colors: ['#5A6A78', '#7A8A98', '#9AABB0', '#6B757D'], desc: '阴雨中的灰色城市' },
            '焦虑': { colors: ['#6B5A8A', '#7A6B9A', '#9A8ABA', '#5A7A8A'], desc: '漩涡般翻涌的思绪' },
            '紧张': { colors: ['#6B5A8A', '#7A6B9A', '#9A8ABA', '#5A7A8A'], desc: '漩涡般翻涌的思绪' },
            '愤怒': { colors: ['#A03525', '#C05535', '#D07545', '#E09555'], desc: '火焰燃烧着大地' },
            '生气': { colors: ['#A03525', '#C05535', '#D07545', '#E09555'], desc: '火焰燃烧着大地' },
            '孤独': { colors: ['#2A3A5A', '#3A4A6A', '#5A6A8A', '#4A5A7A'], desc: '深夜星空下的独行者' },
            '寂寞': { colors: ['#2A3A5A', '#3A4A6A', '#5A6A8A', '#4A5A7A'], desc: '深夜星空下的独行者' },
            '期待': { colors: ['#D4955A', '#E0A56A', '#9FB88A', '#7AA88A'], desc: '黎明前的第一道曙光' },
            '希望': { colors: ['#D4955A', '#E0A56A', '#9FB88A', '#7AA88A'], desc: '黎明前的第一道曙光' },
            '疲惫': { colors: ['#7A6B5A', '#8B7B6A', '#9B8B7A', '#AB9B8A'], desc: '黄昏时的倦怠大地' },
            '累': { colors: ['#7A6B5A', '#8B7B6A', '#9B8B7A', '#AB9B8A'], desc: '黄昏时的倦怠大地' },
            '浪漫': { colors: ['#B07090', '#C080A0', '#D090B0', '#A06080'], desc: '粉色晚霞下的花海' },
            '温馨': { colors: ['#C08B60', '#D09B70', '#B07B50', '#A06B45'], desc: '暖光里的小屋' }
        };

        const emotionKeywords = Object.keys(emotionMap);

        function setSample(text) {
            document.getElementById('moodInput').value = text;
        }

        function analyzeEmotion(text) {
            const detected = [];
            emotionKeywords.forEach(kw => {
                if (text.includes(kw)) detected.push(kw);
            });
            if (detected.length === 0) {
                if (text.includes('好') || text.includes('不错') || text.includes('棒')) detected.push('开心');
                else if (text.includes('不好') || text.includes('差') || text.includes('糟')) detected.push('忧郁');
                else if (text.includes('怕') || text.includes('担心')) detected.push('焦虑');
                else detected.push('平静');
            }
            return detected;
        }

        function getPalette(emotions) {
            let colors = [], desc = '';
            emotions.forEach((e, i) => {
                if (emotionMap[e]) {
                    if (i === 0) { colors = [...emotionMap[e].colors]; desc = emotionMap[e].desc; }
                    else colors = colors.concat(emotionMap[e].colors.slice(0, 2));
                }
            });
            colors = colors.slice(0, 5);
            while (colors.length < 4) colors.push('#8B7355');
            return { colors: colors.slice(0, 5), desc };
        }

        function generatePalette() {
            const text = document.getElementById('moodInput').value.trim();
            if (!text) { alert('请先输入你的心情~'); return; }
            const emotions = analyzeEmotion(text);
            const palette = getPalette(emotions);

            document.getElementById('emotionTags').innerHTML = emotions.map(e =>
                `<span class="emotion-tag" style="background:${emotionMap[e]?.colors[0] || '#666'}22; color:${emotionMap[e]?.colors[0] || '#fff'}">${e}</span>`
            ).join('');

            document.getElementById('paletteColors').innerHTML = palette.colors.map((c, i) =>
                `<div class="color-swatch" style="background:${c}">
                    <div class="hex" style="color:${isLight(c)?'#333':'#fff'}">${c.toUpperCase()}</div>
                    <div class="name" style="color:${isLight(c)?'#333':'#fff'}">色彩 ${i+1}</div>
                </div>`
            ).join('');

            document.getElementById('moodQuote').innerHTML =
                `「${palette.desc}」<br><br>基于你输入的"${text}"，我们捕捉到了这些情绪色彩。`;

            drawPoster(text, emotions, palette);
            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        }

        function isLight(color) {
            const hex = color.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            return (r * 299 + g * 587 + b * 114) / 1000 > 150;
        }

        // ======== 油画工具函数 ========
        function seededRandom(seed) {
            let s = seed;
            return function() { s = (s * 9301 + 49297) % 233280; return s / 233280; };
        }
        function hexToRgb(hex) {
            return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
        }
        function rgbToHex(r, g, b) {
            return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
        }
        function oilTone(hex, intensity) {
            const c = hexToRgb(hex);
            const gray = (c.r + c.g + c.b) / 3;
            c.r = c.r * (1 - intensity*0.35) + gray * intensity*0.35 + intensity*12;
            c.g = c.g * (1 - intensity*0.3) + gray * intensity*0.3 + intensity*6;
            c.b = c.b * (1 - intensity*0.25) + gray * intensity*0.25 - intensity*4;
            return rgbToHex(c.r, c.g, c.b);
        }
        function blendColors(c1, c2, ratio) {
            const a = hexToRgb(c1), b = hexToRgb(c2);
            return rgbToHex(a.r*(1-ratio)+b.r*ratio, a.g*(1-ratio)+b.g*ratio, a.b*(1-ratio)+b.b*ratio);
        }

        // 油画笔触
        function paintStroke(ctx, cx, cy, w, h, color, rng) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate((rng() - 0.5) * 0.8);
            const num = 8 + Math.floor(rng() * 6);
            const pts = [];
            for (let i = 0; i < num; i++) {
                const a = (i / num) * Math.PI * 2;
                const r = (i%2===0 ? w : h) * 0.5 * (0.7 + rng()*0.6);
                pts.push({ x: Math.cos(a)*r, y: Math.sin(a)*r*0.6 });
            }
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) {
                const cp1x = pts[i-1].x + (pts[i].x-pts[i-1].x)*0.3 + (rng()-0.5)*20;
                const cp1y = pts[i-1].y + (pts[i].y-pts[i-1].y)*0.3 + (rng()-0.5)*15;
                const cp2x = pts[i].x - (pts[i].x-pts[i-1].x)*0.3 + (rng()-0.5)*20;
                const cp2y = pts[i].y - (pts[i].y-pts[i-1].y)*0.3 + (rng()-0.5)*15;
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, pts[i].x, pts[i].y);
            }
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            // 高光
            ctx.globalCompositeOperation = 'overlay';
            ctx.beginPath();
            pts.forEach((p,i) => {
                const x = p.x*0.7 - 6, y = p.y*0.7 - 4;
                if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            });
            ctx.closePath();
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fill();
            // 阴影
            ctx.beginPath();
            pts.forEach((p,i) => {
                const x = p.x + 4, y = p.y + 4;
                if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            });
            ctx.closePath();
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
            ctx.restore();
        }

        // 画布纹理
        function applyCanvasTexture(ctx, w, h, rng) {
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;
            for (let y = 0; y < h; y += 2) {
                for (let x = 0; x < w; x += 2) {
                    const i = (y * w + x) * 4;
                    const weave = ((x%6<3) !== (y%6<3)) ? 1.02 : 0.98;
                    const grain = 0.92 + rng()*0.16;
                    data[i] = Math.min(255, data[i]*weave*grain);
                    data[i+1] = Math.min(255, data[i+1]*weave*grain);
                    data[i+2] = Math.min(255, data[i+2]*weave*grain);
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        // ======== 场景绘制 ========

        function drawScene(ctx, w, h, mainEmotion, colors, rng) {
            const sceneY = 260;
            const sceneH = 700;
            const sceneW = w * 0.82;
            const sceneX = (w - sceneW) / 2;

            ctx.save();
            // 画框
            ctx.fillStyle = '#B8A080';
            ctx.fillRect(sceneX - 15, sceneY - 15, sceneW + 30, sceneH + 30);
            ctx.fillStyle = '#D4C4A8';
            ctx.fillRect(sceneX - 8, sceneY - 8, sceneW + 16, sceneH + 16);

            // 剪裁区域
            ctx.beginPath();
            ctx.rect(sceneX, sceneY, sceneW, sceneH);
            ctx.clip();

            // 根据情绪画不同场景
            const sc = { x: sceneX, y: sceneY, w: sceneW, h: sceneH };

            if (mainEmotion === '孤独' || mainEmotion === '寂寞') {
                drawLonelyScene(ctx, sc, colors, rng);
            } else if (mainEmotion === '开心' || mainEmotion === '快乐') {
                drawHappyScene(ctx, sc, colors, rng);
            } else if (mainEmotion === '平静' || mainEmotion === '安心') {
                drawCalmScene(ctx, sc, colors, rng);
            } else if (mainEmotion === '忧郁' || mainEmotion === '难过' || mainEmotion === '悲伤') {
                drawSadScene(ctx, sc, colors, rng);
            } else if (mainEmotion === '焦虑' || mainEmotion === '紧张') {
                drawAnxiousScene(ctx, sc, colors, rng);
            } else if (mainEmotion === '兴奋') {
                drawExcitedScene(ctx, sc, colors, rng);
            } else if (mainEmotion === '愤怒' || mainEmotion === '生气') {
                drawAngryScene(ctx, sc, colors, rng);
            } else if (mainEmotion === '期待' || mainEmotion === '希望') {
                drawHopeScene(ctx, sc, colors, rng);
            } else if (mainEmotion === '疲惫' || mainEmotion === '累') {
                drawTiredScene(ctx, sc, colors, rng);
            } else if (mainEmotion === '浪漫') {
                drawRomanticScene(ctx, sc, colors, rng);
            } else if (mainEmotion === '温馨') {
                drawWarmScene(ctx, sc, colors, rng);
            } else {
                drawCalmScene(ctx, sc, colors, rng);
            }

            ctx.restore();

            return { y: sceneY + sceneH, x: sceneX, w: sceneW };
        }

        // --- 孤独场景：深夜星空 + 独行者 ---
        function drawLonelyScene(ctx, sc, colors, rng) {
            const { x, y, w, h } = sc;

            // 夜空渐变
            const sky = ctx.createLinearGradient(0, y, 0, y + h*0.6);
            sky.addColorStop(0, blendColors(colors[0], '#0a1525', 0.3));
            sky.addColorStop(1, blendColors(colors[2], '#1a2a4a', 0.2));
            ctx.fillStyle = sky;
            ctx.fillRect(x, y, w, h*0.6);

            // 星星
            for (let i = 0; i < 80; i++) {
                const sx = x + rng()*w;
                const sy = y + rng()*h*0.5;
                const sr = 0.5 + rng()*2;
                ctx.beginPath();
                ctx.arc(sx, sy, sr, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255,255,255,${0.3 + rng()*0.6})`;
                ctx.fill();
            }

            // 月亮
            const mx = x + w*0.75, my = y + h*0.2;
            const moonGrad = ctx.createRadialGradient(mx, my, 5, mx, my, 50);
            moonGrad.addColorStop(0, '#F5E6C8');
            moonGrad.addColorStop(1, 'rgba(245,230,200,0)');
            ctx.fillStyle = moonGrad;
            ctx.fillRect(mx-60, my-60, 120, 120);
            ctx.beginPath();
            ctx.arc(mx, my, 28, 0, Math.PI*2);
            ctx.fillStyle = '#E8D8B0';
            ctx.fill();

            // 远山
            ctx.fillStyle = blendColors(colors[0], '#1a2a4a', 0.4);
            ctx.beginPath();
            ctx.moveTo(x, y + h*0.6);
            for (let i = 0; i <= 10; i++) {
                const mx2 = x + (i/10) * w;
                const my2 = y + h*0.55 + Math.sin(i*1.3) * 30 + rng()*10;
                ctx.lineTo(mx2, my2);
            }
            ctx.lineTo(x + w, y + h*0.6);
            ctx.closePath();
            ctx.fill();

            // 近处的地
            ctx.fillStyle = blendColors(colors[1], '#1a2030', 0.3);
            ctx.fillRect(x, y + h*0.62, w, h*0.38);

            // 地面笔触
            for (let i = 0; i < 8; i++) {
                paintStroke(ctx, x + rng()*w, y + h*0.75 + rng()*h*0.2,
                    80 + rng()*120, 20 + rng()*40,
                    blendColors(colors[2], '#2a3040', 0.3 + rng()*0.3), rng);
            }

            // 独行者剪影
            const px = x + w*0.35;
            const py = y + h*0.72;
            ctx.fillStyle = '#0a0a15';
            // 头
            ctx.beginPath();
            ctx.arc(px, py - 30, 10, 0, Math.PI*2);
            ctx.fill();
            // 身体
            ctx.beginPath();
            ctx.moveTo(px - 8, py - 20);
            ctx.lineTo(px + 8, py - 20);
            ctx.lineTo(px + 12, py + 15);
            ctx.lineTo(px - 12, py + 15);
            ctx.closePath();
            ctx.fill();
            // 腿
            ctx.fillRect(px - 7, py + 15, 5, 25);
            ctx.fillRect(px + 2, py + 15, 5, 25);
            // 手臂（插兜或自然下垂）
            ctx.fillRect(px - 12, py - 15, 4, 18);
            ctx.fillRect(px + 8, py - 15, 4, 18);

            // 路灯/微光
            const lampX = x + w*0.65, lampY = y + h*0.68;
            const lampGlow = ctx.createRadialGradient(lampX, lampY - 20, 2, lampX, lampY - 20, 80);
            lampGlow.addColorStop(0, 'rgba(255,220,150,0.4)');
            lampGlow.addColorStop(1, 'rgba(255,220,150,0)');
            ctx.fillStyle = lampGlow;
            ctx.fillRect(lampX-85, lampY-100, 170, 170);
            // 灯柱
            ctx.fillStyle = '#1a1a2a';
            ctx.fillRect(lampX - 2, lampY - 20, 4, 60);
            // 灯罩
            ctx.beginPath();
            ctx.arc(lampX, lampY - 22, 8, 0, Math.PI*2);
            ctx.fillStyle = '#F5E6C8';
            ctx.fill();
        }

        // --- 开心场景：阳光花田 ---
        function drawHappyScene(ctx, sc, colors, rng) {
            const { x, y, w, h } = sc;

            // 天空
            const sky = ctx.createLinearGradient(0, y, 0, y + h*0.5);
            sky.addColorStop(0, blendColors('#87CEEB', colors[3], 0.3));
            sky.addColorStop(1, blendColors(colors[2], '#B8E0F0', 0.3));
            ctx.fillStyle = sky;
            ctx.fillRect(x, y, w, h*0.5);

            // 太阳
            const sunX = x + w*0.8, sunY = y + h*0.15;
            const sunGrad = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 100);
            sunGrad.addColorStop(0, colors[0]);
            sunGrad.addColorStop(0.5, blendColors(colors[0], '#FFF5CC', 0.3));
            sunGrad.addColorStop(1, 'rgba(255,230,150,0)');
            ctx.fillStyle = sunGrad;
            ctx.fillRect(sunX-110, sunY-110, 220, 220);
            ctx.beginPath();
            ctx.arc(sunX, sunY, 35, 0, Math.PI*2);
            ctx.fillStyle = colors[0];
            ctx.fill();

            // 云
            for (let i = 0; i < 3; i++) {
                const cx = x + w*(0.15 + i*0.3) + rng()*50;
                const cy = y + h*(0.1 + i*0.05);
                drawCloud(ctx, cx, cy, 60 + rng()*30, rng);
            }

            // 远山
            ctx.fillStyle = blendColors(colors[3], '#7A9E7E', 0.4);
            ctx.beginPath();
            ctx.moveTo(x, y + h*0.52);
            for (let i = 0; i <= 8; i++) {
                ctx.lineTo(x + (i/8)*w, y + h*0.48 + Math.sin(i*2)*25 + rng()*8);
            }
            ctx.lineTo(x + w, y + h*0.52);
            ctx.closePath();
            ctx.fill();

            // 花田草地
            const grass = ctx.createLinearGradient(0, y + h*0.5, 0, y + h);
            grass.addColorStop(0, blendColors(colors[2], '#90B870', 0.3));
            grass.addColorStop(1, blendColors(colors[2], '#5A8A4A', 0.2));
            ctx.fillStyle = grass;
            ctx.fillRect(x, y + h*0.5, w, h*0.5);

            // 草的笔触
            for (let i = 0; i < 20; i++) {
                paintStroke(ctx, x + rng()*w, y + h*(0.55 + rng()*0.4),
                    40 + rng()*60, 15 + rng()*20,
                    blendColors(colors[2], '#6A9A5A', rng()*0.5), rng);
            }

            // 花朵
            const flowerColors = [colors[0], colors[1], '#FF8A80', '#F8BBD0', '#FFF176'];
            for (let i = 0; i < 40; i++) {
                const fx = x + rng()*w;
                const fy = y + h*(0.6 + rng()*0.35);
                const fc = flowerColors[Math.floor(rng()*flowerColors.length)];
                drawFlower(ctx, fx, fy, fc, rng);
            }
        }

        function drawCloud(ctx, cx, cy, size, rng) {
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.arc(cx + (i-2)*size*0.35 + (rng()-0.5)*10, cy + (rng()-0.5)*10, size*0.35 + rng()*10, 0, Math.PI*2);
                ctx.fill();
            }
        }

        function drawFlower(ctx, x, y, color, rng) {
            // 茎
            ctx.strokeStyle = '#5A8A4A';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + (rng()-0.5)*3, y - 20);
            ctx.stroke();
            // 花瓣
            for (let i = 0; i < 5; i++) {
                const a = (i/5) * Math.PI * 2;
                ctx.beginPath();
                ctx.arc(x + Math.cos(a)*5, y - 20 + Math.sin(a)*5, 4 + rng()*2, 0, Math.PI*2);
                ctx.fillStyle = color;
                ctx.fill();
            }
            // 花心
            ctx.beginPath();
            ctx.arc(x, y - 20, 3, 0, Math.PI*2);
            ctx.fillStyle = '#FFD54F';
            ctx.fill();
        }

        // --- 平静场景：湖光山色 ---
        function drawCalmScene(ctx, sc, colors, rng) {
            const { x, y, w, h } = sc;

            // 天空
            const sky = ctx.createLinearGradient(0, y, 0, y + h*0.45);
            sky.addColorStop(0, blendColors(colors[0], '#A8C0B8', 0.3));
            sky.addColorStop(1, blendColors(colors[1], '#C8D8D0', 0.3));
            ctx.fillStyle = sky;
            ctx.fillRect(x, y, w, h*0.45);

            // 远山
            ctx.fillStyle = blendColors(colors[2], '#6A8A80', 0.3);
            ctx.beginPath();
            ctx.moveTo(x, y + h*0.45);
            for (let i = 0; i <= 6; i++) {
                ctx.lineTo(x + (i/6)*w, y + h*0.35 + Math.sin(i*1.8)*30 + rng()*8);
            }
            ctx.lineTo(x + w, y + h*0.45);
            ctx.closePath();
            ctx.fill();

            // 中景山
            ctx.fillStyle = blendColors(colors[2], '#5A7A70', 0.5);
            ctx.beginPath();
            ctx.moveTo(x, y + h*0.5);
            for (let i = 0; i <= 7; i++) {
                ctx.lineTo(x + (i/7)*w, y + h*0.42 + Math.sin(i*1.5 + 1)*25 + rng()*6);
            }
            ctx.lineTo(x + w, y + h*0.5);
            ctx.closePath();
            ctx.fill();

            // 湖水
            const lake = ctx.createLinearGradient(0, y + h*0.5, 0, y + h);
            lake.addColorStop(0, blendColors(colors[0], '#7A9A90', 0.4));
            lake.addColorStop(1, blendColors(colors[3], '#4A6A60', 0.4));
            ctx.fillStyle = lake;
            ctx.fillRect(x, y + h*0.5, w, h*0.5);

            // 水面波纹
            for (let i = 0; i < 15; i++) {
                const wy = y + h*(0.55 + rng()*0.4);
                ctx.strokeStyle = `rgba(255,255,255,${0.05 + rng()*0.1})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let wx = 0; wx < w; wx += 10) {
                    const yy = wy + Math.sin(wx*0.02 + i)*3;
                    if (wx === 0) ctx.moveTo(x + wx, yy);
                    else ctx.lineTo(x + wx, yy);
                }
                ctx.stroke();
            }

            // 倒影（简化的山影）
            ctx.fillStyle = 'rgba(90,122,112,0.2)';
            ctx.fillRect(x, y + h*0.5, w, h*0.15);

            // 小船
            const bx = x + w*0.3, by = y + h*0.65;
            ctx.fillStyle = '#8B6B45';
            ctx.beginPath();
            ctx.moveTo(bx - 25, by);
            ctx.quadraticCurveTo(bx, by + 12, bx + 25, by);
            ctx.lineTo(bx + 20, by + 5);
            ctx.lineTo(bx - 20, by + 5);
            ctx.closePath();
            ctx.fill();
            // 小人
            ctx.fillStyle = '#3D3020';
            ctx.beginPath();
            ctx.arc(bx, by - 8, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.fillRect(bx - 3, by - 4, 6, 8);

            // 岸边植物
            for (let i = 0; i < 6; i++) {
                const rx = x + rng()*w;
                const ry = y + h*0.5;
                ctx.strokeStyle = blendColors(colors[2], '#4A6A50', 0.5);
                ctx.lineWidth = 2;
                for (let j = 0; j < 3; j++) {
                    ctx.beginPath();
                    ctx.moveTo(rx + (j-1)*4, ry);
                    ctx.quadraticCurveTo(rx + (j-1)*6 + (rng()-0.5)*4, ry - 15, rx + (j-1)*8, ry - 25 - rng()*10);
                    ctx.stroke();
                }
            }
        }

        // --- 忧郁场景：阴雨天 ---
        function drawSadScene(ctx, sc, colors, rng) {
            const { x, y, w, h } = sc;

            // 阴沉天空
            const sky = ctx.createLinearGradient(0, y, 0, y + h*0.55);
            sky.addColorStop(0, blendColors(colors[0], '#4A5560', 0.3));
            sky.addColorStop(1, blendColors(colors[1], '#6A7580', 0.3));
            ctx.fillStyle = sky;
            ctx.fillRect(x, y, w, h*0.55);

            // 厚重云层
            for (let i = 0; i < 6; i++) {
                const cx = x + rng()*w;
                const cy = y + h*(0.1 + rng()*0.25);
                ctx.fillStyle = `rgba(80,90,100,${0.4 + rng()*0.3})`;
                for (let j = 0; j < 6; j++) {
                    ctx.beginPath();
                    ctx.arc(cx + (j-3)*40 + (rng()-0.5)*15, cy + (rng()-0.5)*15, 30 + rng()*20, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // 城市剪影（远处建筑）
            ctx.fillStyle = blendColors(colors[0], '#3A4050', 0.4);
            let bx = x;
            while (bx < x + w) {
                const bw = 20 + rng()*40;
                const bh = 40 + rng()*80;
                ctx.fillRect(bx, y + h*0.55 - bh, bw, bh);
                bx += bw + 5 + rng()*10;
            }

            // 地面
            ctx.fillStyle = blendColors(colors[2], '#4A5055', 0.3);
            ctx.fillRect(x, y + h*0.55, w, h*0.45);

            // 地面水洼反射
            for (let i = 0; i < 5; i++) {
                const px = x + rng()*w;
                const py = y + h*(0.7 + rng()*0.2);
                ctx.beginPath();
                ctx.ellipse(px, py, 30 + rng()*40, 8 + rng()*10, 0, 0, Math.PI*2);
                ctx.fillStyle = `rgba(120,130,140,${0.3 + rng()*0.2})`;
                ctx.fill();
            }

            // 雨丝
            for (let i = 0; i < 60; i++) {
                const rx = x + rng()*w;
                const ry = y + rng()*h;
                const rl = 15 + rng()*25;
                ctx.strokeStyle = `rgba(180,190,200,${0.3 + rng()*0.3})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(rx, ry);
                ctx.lineTo(rx - 3, ry + rl);
                ctx.stroke();
            }

            // 撑伞的背影
            const px = x + w*0.5, py = y + h*0.72;
            // 伞
            ctx.fillStyle = blendColors(colors[1], '#5A6A7A', 0.4);
            ctx.beginPath();
            ctx.arc(px, py - 40, 35, Math.PI, 0);
            ctx.closePath();
            ctx.fill();
            // 伞柄
            ctx.strokeStyle = '#3A3025';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(px, py - 40);
            ctx.lineTo(px, py - 5);
            ctx.stroke();
            // 身体背影
            ctx.fillStyle = '#2A303A';
            ctx.beginPath();
            ctx.ellipse(px, py + 10, 14, 20, 0, 0, Math.PI*2);
            ctx.fill();
            // 腿
            ctx.fillRect(px - 6, py + 25, 4, 25);
            ctx.fillRect(px + 2, py + 25, 4, 25);
        }

        // --- 焦虑场景：漩涡抽象 ---
        function drawAnxiousScene(ctx, sc, colors, rng) {
            const { x, y, w, h } = sc;
            const cx = x + w/2, cy = y + h/2;

            // 背景
            const bg = ctx.createRadialGradient(cx, cy, 20, cx, cy, w*0.6);
            bg.addColorStop(0, blendColors(colors[0], '#4A3A6A', 0.3));
            bg.addColorStop(1, blendColors(colors[3], '#2A2040', 0.4));
            ctx.fillStyle = bg;
            ctx.fillRect(x, y, w, h);

            // 漩涡线条
            for (let layer = 0; layer < 5; layer++) {
                ctx.strokeStyle = hexToRgba(colors[layer % colors.length], 0.3 + layer*0.1);
                ctx.lineWidth = 2 + layer * 3;
                ctx.beginPath();
                const startR = 30 + layer * 50;
                for (let a = 0; a < Math.PI * 4; a += 0.05) {
                    const r = startR + a * 20 + rng()*10;
                    const px = cx + Math.cos(a + layer*0.5) * r;
                    const py = cy + Math.sin(a + layer*0.5) * r * 0.8;
                    if (a === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }

            // 混乱笔触
            for (let i = 0; i < 30; i++) {
                const px = x + rng()*w;
                const py = y + rng()*h;
                const dist = Math.sqrt((px-cx)**2 + (py-cy)**2);
                if (dist > 100) {
                    paintStroke(ctx, px, py, 30 + rng()*60, 10 + rng()*30,
                        blendColors(colors[Math.floor(rng()*colors.length)], '#2A2040', 0.3 + rng()*0.4), rng);
                }
            }

            // 中心的人影（被漩涡包围）
            ctx.fillStyle = '#1A1025';
            ctx.beginPath();
            ctx.arc(cx, cy - 5, 8, 0, Math.PI*2);
            ctx.fill();
            ctx.fillRect(cx - 7, cy + 2, 14, 25);
            // 抱头的手
            ctx.fillRect(cx - 15, cy - 10, 8, 15);
            ctx.fillRect(cx + 7, cy - 10, 8, 15);
        }

        // --- 兴奋场景：烟花 ---
        function drawExcitedScene(ctx, sc, colors, rng) {
            const { x, y, w, h } = sc;

            // 夜空
            const sky = ctx.createLinearGradient(0, y, 0, y + h);
            sky.addColorStop(0, '#1A1030');
            sky.addColorStop(1, blendColors(colors[3], '#2A2050', 0.5));
            ctx.fillStyle = sky;
            ctx.fillRect(x, y, w, h);

            // 远处城市剪影
            ctx.fillStyle = '#0A0515';
            let bx = x;
            while (bx < x + w) {
                const bw = 15 + rng()*30;
                const bh = 20 + rng()*50;
                ctx.fillRect(bx, y + h*0.75 - bh, bw, bh);
                // 窗户光
                for (let wy = y + h*0.75 - bh + 5; wy < y + h*0.75 - 8; wy += 8) {
                    for (let wx = bx + 3; wx < bx + bw - 3; wx += 6) {
                        if (rng() > 0.5) {
                            ctx.fillStyle = colors[Math.floor(rng()*colors.length)];
                            ctx.globalAlpha = 0.6 + rng()*0.4;
                            ctx.fillRect(wx, wy, 2, 3);
                        }
                    }
                }
                ctx.globalAlpha = 1;
                bx += bw + 3 + rng()*5;
            }

            // 地面
            ctx.fillStyle = '#0A0515';
            ctx.fillRect(x, y + h*0.75, w, h*0.25);

            // 烟花
            const fireworks = [
                { fx: x + w*0.25, fy: y + h*0.25, color: colors[0] },
                { fx: x + w*0.55, fy: y + h*0.18, color: colors[1] },
                { fx: x + w*0.75, fy: y + h*0.3, color: colors[2] || colors[0] },
                { fx: x + w*0.4, fy: y + h*0.35, color: colors[3] || colors[1] },
            ];

            fireworks.forEach(fw => {
                // 烟花光晕
                const glow = ctx.createRadialGradient(fw.fx, fw.fy, 5, fw.fx, fw.fy, 100);
                glow.addColorStop(0, hexToRgba(fw.color, 0.3));
                glow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = glow;
                ctx.fillRect(fw.fx-110, fw.fy-110, 220, 220);

                // 烟花粒子
                for (let i = 0; i < 40; i++) {
                    const a = (i/40) * Math.PI * 2 + rng()*0.2;
                    const r = 30 + rng()*50;
                    const px = fw.fx + Math.cos(a) * r;
                    const py = fw.fy + Math.sin(a) * r;
                    ctx.beginPath();
                    ctx.arc(px, py, 2 + rng()*2, 0, Math.PI*2);
                    ctx.fillStyle = fw.color;
                    ctx.globalAlpha = 0.7 + rng()*0.3;
                    ctx.fill();

                    // 尾迹
                    ctx.strokeStyle = fw.color;
                    ctx.lineWidth = 1;
                    ctx.globalAlpha = 0.3 + rng()*0.3;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(fw.fx + Math.cos(a)*10, fw.fy + Math.sin(a)*10);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
            });

            // 星星点缀
            for (let i = 0; i < 30; i++) {
                ctx.beginPath();
                ctx.arc(x + rng()*w, y + rng()*h*0.5, 0.5 + rng()*1.5, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255,255,255,${0.3 + rng()*0.5})`;
                ctx.fill();
            }
        }

        // --- 愤怒场景：火焰山 ---
        function drawAngryScene(ctx, sc, colors, rng) {
            const { x, y, w, h } = sc;

            // 天空（被火光映红）
            const sky = ctx.createLinearGradient(0, y, 0, y + h*0.5);
            sky.addColorStop(0, blendColors(colors[0], '#4A1510', 0.3));
            sky.addColorStop(1, blendColors(colors[1], '#8B3520', 0.4));
            ctx.fillStyle = sky;
            ctx.fillRect(x, y, w, h*0.5);

            // 火焰山
            ctx.fillStyle = blendColors(colors[0], '#5A2010', 0.3);
            ctx.beginPath();
            ctx.moveTo(x, y + h*0.55);
            ctx.lineTo(x + w*0.3, y + h*0.25);
            ctx.lineTo(x + w*0.45, y + h*0.45);
            ctx.lineTo(x + w*0.6, y + h*0.2);
            ctx.lineTo(x + w*0.75, y + h*0.4);
            ctx.lineTo(x + w, y + h*0.55);
            ctx.closePath();
            ctx.fill();

            // 火焰
            const flameX = [x + w*0.3, x + w*0.6];
            flameX.forEach(fx => {
                for (let i = 0; i < 15; i++) {
                    const fx = fx + (rng()-0.5)*60;
                    const fy = y + h*0.35 - rng()*40;
                    const fw = 15 + rng()*25;
                    const fh = 40 + rng()*60;
                    const flameGrad = ctx.createLinearGradient(fx, fy + fh, fx, fy);
                    flameGrad.addColorStop(0, colors[0]);
                    flameGrad.addColorStop(0.5, colors[1]);
                    flameGrad.addColorStop(1, '#FFE066');
                    ctx.fillStyle = flameGrad;
                    ctx.beginPath();
                    ctx.moveTo(fx - fw/2, fy + fh);
                    ctx.quadraticCurveTo(fx - fw, fy + fh/2, fx, fy);
                    ctx.quadraticCurveTo(fx + fw, fy + fh/2, fx + fw/2, fy + fh);
                    ctx.closePath();
                    ctx.globalAlpha = 0.7 + rng()*0.3;
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            });

            // 地面熔岩
            const ground = ctx.createLinearGradient(0, y + h*0.55, 0, y + h);
            ground.addColorStop(0, blendColors(colors[1], '#6A2515', 0.4));
            ground.addColorStop(1, blendColors(colors[0], '#3A150A', 0.3));
            ctx.fillStyle = ground;
            ctx.fillRect(x, y + h*0.55, w, h*0.45);

            // 熔岩裂缝
            for (let i = 0; i < 8; i++) {
                const cx = x + rng()*w;
                const cy = y + h*(0.65 + rng()*0.25);
                ctx.strokeStyle = colors[0];
                ctx.lineWidth = 2 + rng()*3;
                ctx.globalAlpha = 0.5 + rng()*0.4;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                for (let j = 0; j < 5; j++) {
                    ctx.lineTo(cx + (rng()-0.5)*40, cy + j*8);
                }
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // 烟雾
            for (let i = 0; i < 5; i++) {
                const sx = x + w*(0.25 + i*0.12);
                const sy = y + h*0.2 - rng()*30;
                ctx.fillStyle = `rgba(60,40,30,${0.2 + rng()*0.2})`;
                for (let j = 0; j < 5; j++) {
                    ctx.beginPath();
                    ctx.arc(sx + (j-2)*20 + (rng()-0.5)*10, sy + j*15, 15 + rng()*15, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }

        // --- 期待/希望场景：日出 ---
        function drawHopeScene(ctx, sc, colors, rng) {
            const { x, y, w, h } = sc;

            // 黎明天空
            const sky = ctx.createLinearGradient(0, y, 0, y + h*0.6);
            sky.addColorStop(0, blendColors(colors[3], '#3A4A5A', 0.3));
            sky.addColorStop(0.4, blendColors(colors[0], '#D08050', 0.4));
            sky.addColorStop(0.7, blendColors(colors[1], '#E0A060', 0.3));
            sky.addColorStop(1, blendColors(colors[2], '#B8C8A0', 0.3));
            ctx.fillStyle = sky;
            ctx.fillRect(x, y, w, h*0.6);

            // 太阳（刚升起一半）
            const sunX = x + w*0.5, sunY = y + h*0.58;
            const sunGrad = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 120);
            sunGrad.addColorStop(0, colors[0]);
            sunGrad.addColorStop(0.4, blendColors(colors[0], '#FFD080', 0.3));
            sunGrad.addColorStop(1, 'rgba(255,200,120,0)');
            ctx.fillStyle = sunGrad;
            ctx.fillRect(sunX-130, sunY-130, 260, 260);
            // 半圆太阳
            ctx.beginPath();
            ctx.arc(sunX, sunY, 45, Math.PI, 0);
            ctx.fillStyle = colors[0];
            ctx.fill();

            // 云海（山）
            ctx.fillStyle = blendColors(colors[2], '#6A8A70', 0.3);
            ctx.beginPath();
            ctx.moveTo(x, y + h*0.6);
            for (let i = 0; i <= 8; i++) {
                ctx.lineTo(x + (i/8)*w, y + h*0.52 + Math.sin(i*1.6)*25 + rng()*8);
            }
            ctx.lineTo(x + w, y + h*0.6);
            ctx.closePath();
            ctx.fill();

            // 云海（近）
            ctx.fillStyle = blendColors(colors[2], '#7A9A80', 0.5);
            ctx.beginPath();
            ctx.moveTo(x, y + h*0.68);
            for (let i = 0; i <= 7; i++) {
                ctx.lineTo(x + (i/7)*w, y + h*0.6 + Math.sin(i*2 + 1)*20 + rng()*6);
            }
            ctx.lineTo(x + w, y + h*0.68);
            ctx.closePath();
            ctx.fill();

            // 前景草地
            ctx.fillStyle = blendColors(colors[2], '#8AB070', 0.3);
            ctx.fillRect(x, y + h*0.7, w, h*0.3);

            // 草笔触
            for (let i = 0; i < 15; i++) {
                paintStroke(ctx, x + rng()*w, y + h*(0.75 + rng()*0.2),
                    50 + rng()*70, 15 + rng()*25,
                    blendColors(colors[2], '#6A9A5A', rng()*0.5), rng);
            }

            // 朝露花朵
            for (let i = 0; i < 20; i++) {
                const fx = x + rng()*w;
                const fy = y + h*(0.75 + rng()*0.2);
                drawFlower(ctx, fx, fy, blendColors(colors[0], '#FFB060', 0.3), rng);
            }

            // 一个面向日出的人影
            const px = x + w*0.5, py = y + h*0.78;
            ctx.fillStyle = '#2A2520';
            ctx.beginPath();
            ctx.arc(px, py - 30, 8, 0, Math.PI*2);
            ctx.fill();
            ctx.fillRect(px - 6, py - 22, 12, 30);
            ctx.fillRect(px - 5, py + 8, 4, 22);
            ctx.fillRect(px + 1, py + 8, 4, 22);
            // 张开的手臂
            ctx.fillRect(px - 20, py - 15, 14, 4);
            ctx.fillRect(px + 6, py - 15, 14, 4);
        }

        // --- 疲惫场景：黄昏 ---
        function drawTiredScene(ctx, sc, colors, rng) {
            const { x, y, w, h } = sc;

            // 黄昏天空
            const sky = ctx.createLinearGradient(0, y, 0, y + h*0.55);
            sky.addColorStop(0, blendColors(colors[0], '#6A5A4A', 0.3));
            sky.addColorStop(0.5, blendColors(colors[1], '#9A8060', 0.3));
            sky.addColorStop(1, blendColors(colors[2], '#B8A080', 0.4));
            ctx.fillStyle = sky;
            ctx.fillRect(x, y, w, h*0.55);

            // 落日
            const sunX = x + w*0.7, sunY = y + h*0.45;
            const sunGrad = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 100);
            sunGrad.addColorStop(0, blendColors(colors[0], '#D08050', 0.4));
            sunGrad.addColorStop(1, 'rgba(200,140,80,0)');
            ctx.fillStyle = sunGrad;
            ctx.fillRect(sunX-110, sunY-110, 220, 220);
            ctx.beginPath();
            ctx.arc(sunX, sunY, 35, 0, Math.PI*2);
            ctx.fillStyle = blendColors(colors[0], '#D88050', 0.5);
            ctx.fill();

            // 远山
            ctx.fillStyle = blendColors(colors[0], '#5A4A3A', 0.4);
            ctx.beginPath();
            ctx.moveTo(x, y + h*0.55);
            for (let i = 0; i <= 6; i++) {
                ctx.lineTo(x + (i/6)*w, y + h*0.48 + Math.sin(i*1.5)*20 + rng()*6);
            }
            ctx.lineTo(x + w, y + h*0.55);
            ctx.closePath();
            ctx.fill();

            // 地面
            ctx.fillStyle = blendColors(colors[2], '#6A5A4A', 0.4);
            ctx.fillRect(x, y + h*0.55, w, h*0.45);

            // 地面笔触
            for (let i = 0; i < 12; i++) {
                paintStroke(ctx, x + rng()*w, y + h*(0.6 + rng()*0.3),
                    60 + rng()*80, 15 + rng()*20,
                    blendColors(colors[Math.floor(rng()*colors.length)], '#5A4A3A', 0.4 + rng()*0.3), rng);
            }

            // 坐着休息的人（靠在树旁）
            const tx = x + w*0.35, ty = y + h*0.58;
            // 树干
            ctx.fillStyle = '#4A3A2A';
            ctx.fillRect(tx - 6, ty, 12, h*0.22);
            // 树冠
            ctx.fillStyle = blendColors(colors[2], '#4A5A3A', 0.4);
            ctx.beginPath();
            ctx.arc(tx, ty - 10, 50, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(tx - 25, ty + 5, 35, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(tx + 25, ty + 5, 35, 0, Math.PI*2);
            ctx.fill();

            // 坐着的人（背靠树）
            const px = tx + 35, py = y + h*0.75;
            ctx.fillStyle = '#3A3025';
            // 头
            ctx.beginPath();
            ctx.arc(px, py - 20, 8, 0, Math.PI*2);
            ctx.fill();
            // 身体（倚靠姿势）
            ctx.beginPath();
            ctx.moveTo(px - 10, py - 12);
            ctx.lineTo(px + 12, py - 10);
            ctx.lineTo(px + 18, py + 15);
            ctx.lineTo(px - 15, py + 15);
            ctx.closePath();
            ctx.fill();
            // 弯曲的腿
            ctx.fillRect(px - 12, py + 10, 25, 8);
            ctx.fillRect(px + 8, py + 5, 8, 15);
        }

        // --- 浪漫场景：粉色晚霞花海 ---
        function drawRomanticScene(ctx, sc, colors, rng) {
            const { x, y, w, h } = sc;

            // 粉色天空
            const sky = ctx.createLinearGradient(0, y, 0, y + h*0.55);
            sky.addColorStop(0, blendColors(colors[0], '#B890C0', 0.3));
            sky.addColorStop(0.5, blendColors(colors[1], '#D8A8C0', 0.4));
            sky.addColorStop(1, blendColors(colors[2], '#F0C8D8', 0.3));
            ctx.fillStyle = sky;
            ctx.fillRect(x, y, w, h*0.55);

            // 粉色云
            for (let i = 0; i < 4; i++) {
                const cx = x + w*(0.15 + i*0.25);
                const cy = y + h*(0.1 + (i%2)*0.1);
                ctx.fillStyle = hexToRgba(blendColors(colors[i%colors.length], '#F8D8E8', 0.4), 0.7);
                for (let j = 0; j < 6; j++) {
                    ctx.beginPath();
                    ctx.arc(cx + (j-3)*35 + (rng()-0.5)*10, cy + (rng()-0.5)*8, 25 + rng()*12, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // 远山
            ctx.fillStyle = blendColors(colors[3], '#9A8AB0', 0.4);
            ctx.beginPath();
            ctx.moveTo(x, y + h*0.55);
            for (let i = 0; i <= 7; i++) {
                ctx.lineTo(x + (i/7)*w, y + h*0.45 + Math.sin(i*1.7)*20 + rng()*6);
            }
            ctx.lineTo(x + w, y + h*0.55);
            ctx.closePath();
            ctx.fill();

            // 花田
            const field = ctx.createLinearGradient(0, y + h*0.55, 0, y + h);
            field.addColorStop(0, blendColors(colors[1], '#D8A0C0', 0.3));
            field.addColorStop(1, blendColors(colors[0], '#B880A0', 0.3));
            ctx.fillStyle = field;
            ctx.fillRect(x, y + h*0.55, w, h*0.45);

            // 大量花朵
            const roseColors = [colors[0], colors[1], '#F8BBD0', '#F48FB1', '#CE93D8', '#E1BEE7'];
            for (let i = 0; i < 60; i++) {
                const fx = x + rng()*w;
                const fy = y + h*(0.6 + rng()*0.32);
                drawFlower(ctx, fx, fy, roseColors[Math.floor(rng()*roseColors.length)], rng);
            }

            // 一对人影（手牵手）
            const px1 = x + w*0.45, px2 = x + w*0.55;
            const py = y + h*0.72;
            // 左边的人
            ctx.fillStyle = '#3A2530';
            ctx.beginPath();
            ctx.arc(px1, py - 28, 7, 0, Math.PI*2);
            ctx.fill();
            ctx.fillRect(px1 - 6, py - 21, 12, 25);
            ctx.fillRect(px1 - 5, py + 4, 4, 20);
            ctx.fillRect(px1 + 1, py + 4, 4, 20);
            // 右边的人
            ctx.beginPath();
            ctx.arc(px2, py - 28, 7, 0, Math.PI*2);
            ctx.fill();
            ctx.fillRect(px2 - 6, py - 21, 12, 25);
            ctx.fillRect(px2 - 5, py + 4, 4, 20);
            ctx.fillRect(px2 + 1, py + 4, 4, 20);
            // 牵手
            ctx.fillRect(px1 + 6, py - 8, px2 - px1 - 12, 3);

            // 飘落的花瓣
            for (let i = 0; i < 20; i++) {
                const px3 = x + rng()*w;
                const py3 = y + rng()*h*0.6;
                ctx.beginPath();
                ctx.ellipse(px3, py3, 4 + rng()*3, 2 + rng()*2, rng()*Math.PI, 0, Math.PI*2);
                ctx.fillStyle = roseColors[Math.floor(rng()*roseColors.length)];
                ctx.globalAlpha = 0.6 + rng()*0.4;
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        // --- 温馨场景：暖光小屋 ---
        function drawWarmScene(ctx, sc, colors, rng) {
            const { x, y, w, h } = sc;

            // 傍晚天空
            const sky = ctx.createLinearGradient(0, y, 0, y + h*0.5);
            sky.addColorStop(0, blendColors(colors[0], '#5A4A3A', 0.3));
            sky.addColorStop(1, blendColors(colors[1], '#8A6A50', 0.3));
            ctx.fillStyle = sky;
            ctx.fillRect(x, y, w, h*0.5);

            // 雪/地面
            ctx.fillStyle = blendColors(colors[2], '#D8C8B0', 0.3);
            ctx.fillRect(x, y + h*0.5, w, h*0.5);

            // 小屋
            const hx = x + w*0.5, hy = y + h*0.55;
            const hw = 200, hh = 150;

            // 屋身
            ctx.fillStyle = blendColors(colors[0], '#A07050', 0.4);
            ctx.fillRect(hx - hw/2, hy, hw, hh);

            // 屋顶
            ctx.fillStyle = blendColors(colors[1], '#6A4030', 0.4);
            ctx.beginPath();
            ctx.moveTo(hx - hw/2 - 15, hy);
            ctx.lineTo(hx, hy - 60);
            ctx.lineTo(hx + hw/2 + 15, hy);
            ctx.closePath();
            ctx.fill();

            // 烟囱
            ctx.fillStyle = blendColors(colors[1], '#5A3828', 0.5);
            ctx.fillRect(hx + 50, hy - 80, 20, 40);

            // 烟
            ctx.fillStyle = 'rgba(180,160,140,0.4)';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.arc(hx + 60 + (rng()-0.5)*10, hy - 100 - i*15, 8 + i*3, 0, Math.PI*2);
                ctx.fill();
            }

            // 窗户（暖光）
            const winW = 40, winH = 50;
            // 左窗
            const winGlow1 = ctx.createRadialGradient(hx - 50, hy + 50, 5, hx - 50, hy + 50, 60);
            winGlow1.addColorStop(0, 'rgba(255,220,150,0.6)');
            winGlow1.addColorStop(1, 'rgba(255,220,150,0)');
            ctx.fillStyle = winGlow1;
            ctx.fillRect(hx-110, hy-10, 120, 120);
            ctx.fillStyle = '#FFD890';
            ctx.fillRect(hx - 50 - winW/2, hy + 30, winW, winH);
            ctx.strokeStyle = blendColors(colors[1], '#5A3828', 0.5);
            ctx.lineWidth = 3;
            ctx.strokeRect(hx - 50 - winW/2, hy + 30, winW, winH);
            ctx.beginPath();
            ctx.moveTo(hx - 50, hy + 30);
            ctx.lineTo(hx - 50, hy + 80);
            ctx.moveTo(hx - 70, hy + 55);
            ctx.lineTo(hx - 30, hy + 55);
            ctx.stroke();

            // 右窗
            const winGlow2 = ctx.createRadialGradient(hx + 50, hy + 50, 5, hx + 50, hy + 50, 60);
            winGlow2.addColorStop(0, 'rgba(255,220,150,0.6)');
            winGlow2.addColorStop(1, 'rgba(255,220,150,0)');
            ctx.fillStyle = winGlow2;
            ctx.fillRect(hx-10, hy-10, 120, 120);
            ctx.fillStyle = '#FFD890';
            ctx.fillRect(hx + 50 - winW/2, hy + 30, winW, winH);
            ctx.strokeStyle = blendColors(colors[1], '#5A3828', 0.5);
            ctx.lineWidth = 3;
            ctx.strokeRect(hx + 50 - winW/2, hy + 30, winW, winH);
            ctx.beginPath();
            ctx.moveTo(hx + 50, hy + 30);
            ctx.lineTo(hx + 50, hy + 80);
            ctx.moveTo(hx + 30, hy + 55);
            ctx.lineTo(hx + 70, hy + 55);
            ctx.stroke();

            // 门
            ctx.fillStyle = blendColors(colors[1], '#6A4030', 0.5);
            ctx.fillRect(hx - 15, hy + 80, 30, 70);
            ctx.beginPath();
            ctx.arc(hx + 8, hy + 115, 2, 0, Math.PI*2);
            ctx.fillStyle = '#FFD890';
            ctx.fill();

            // 门前小路
            ctx.fillStyle = blendColors(colors[2], '#C0B090', 0.4);
            ctx.beginPath();
            ctx.moveTo(hx - 25, hy + hh);
            ctx.lineTo(hx + 25, hy + hh);
            ctx.lineTo(hx + 50, y + h);
            ctx.lineTo(hx - 50, y + h);
            ctx.closePath();
            ctx.fill();

            // 雪花
            for (let i = 0; i < 40; i++) {
                const sx = x + rng()*w;
                const sy = y + rng()*h;
                ctx.beginPath();
                ctx.arc(sx, sy, 1 + rng()*2, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255,255,255,${0.5 + rng()*0.5})`;
                ctx.fill();
            }

            // 旁边的树
            const tx = x + w*0.2, ty = y + h*0.55;
            ctx.fillStyle = blendColors(colors[1], '#5A4030', 0.5);
            ctx.fillRect(tx - 5, ty + 30, 10, 80);
            // 积雪的树
            ctx.fillStyle = '#F0E8D8';
            for (let i = 0; i < 4; i++) {
                const tw = 60 - i*12;
                ctx.beginPath();
                ctx.moveTo(tx - tw, ty + 30 + i*25);
                ctx.lineTo(tx + tw, ty + 30 + i*25);
                ctx.lineTo(tx, ty + i*25);
                ctx.closePath();
                ctx.fill();
            }
        }

        // ======== 主绘制函数 ========
        function drawPoster(text, emotions, palette) {
            const canvas = document.getElementById('posterCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const colors = palette.colors.map(c => oilTone(c, 0.5));
            const rng = seededRandom(text.split('').reduce((a,c) => a + c.charCodeAt(0), 0));
            const mainEmotion = emotions[0] || '平静';

            // 画布底色
            ctx.fillStyle = '#E8DCC8';
            ctx.fillRect(0, 0, w, h);

            // 标题
            ctx.textAlign = 'center';
            ctx.font = 'bold 46px "Georgia", serif';
            ctx.fillStyle = 'rgba(60,45,30,0.2)';
            ctx.fillText('MoodPalette', w/2 + 2, 102);
            ctx.fillStyle = '#3D3020';
            ctx.fillText('MoodPalette', w/2, 100);
            ctx.fillStyle = 'rgba(255,245,230,0.35)';
            ctx.fillText('MoodPalette', w/2 - 1, 98);

            ctx.font = 'italic 22px "Georgia", serif';
            ctx.fillStyle = '#6A5A4A';
            ctx.fillText('把心情翻译成色彩', w/2, 142);

            // 装饰线
            ctx.strokeStyle = '#8B7355';
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(w*0.25, 170);
            ctx.quadraticCurveTo(w*0.5, 172 + (rng()-0.5)*3, w*0.75, 168);
            ctx.stroke();

            // 情绪标签（小）
            ctx.font = '18px "Georgia", serif';
            ctx.fillStyle = '#8A7A6A';
            ctx.fillText(emotions.join(' · '), w/2, 200);

            // ===== 核心：油画场景 =====
            const sceneResult = drawScene(ctx, w, h, mainEmotion, colors, rng);

            // ===== 下方：心情文字 =====
            const textY = sceneResult.y + 40;
            ctx.font = 'italic 24px "Georgia", serif';
            ctx.fillStyle = '#5A4A3A';
            ctx.textAlign = 'center';

            const maxW = w * 0.7;
            const lh = 40;
            const chars = text.split('');
            let curLine = '';
            let curY = textY;
            const lines = [];

            for (let i = 0; i < chars.length; i++) {
                const test = curLine + chars[i];
                if (ctx.measureText(test).width > maxW && curLine.length > 0) {
                    lines.push(curLine);
                    curLine = chars[i];
                } else {
                    curLine = test;
                }
            }
            lines.push(curLine);

            // 文字底（半透明亚麻纸）
            const boxH = lines.length * lh + 40;
            const boxY = curY - 15;
            ctx.fillStyle = 'rgba(232,220,200,0.6)';
            ctx.fillRect(w*0.12, boxY, w*0.76, boxH);
            ctx.strokeStyle = '#C0A880';
            ctx.lineWidth = 1;
            ctx.strokeRect(w*0.12, boxY, w*0.76, boxH);

            lines.forEach((line, i) => {
                ctx.fillStyle = 'rgba(60,45,30,0.12)';
                ctx.fillText(line, w/2 + 1, curY + 2);
                ctx.fillStyle = '#3D3020';
                ctx.fillText(line, w/2, curY);
                curY += lh;
            });

            // 情绪解读
            curY += 15;
            ctx.font = 'italic 20px "Georgia", serif';
            ctx.fillStyle = '#7A6A5A';
            ctx.fillText('"' + palette.desc + '"', w/2, curY);

            // ===== 底部：调色盘 + 签名 =====
            const palY = h - 140;
            const sw = 50, sg = 12;
            const totalW = colors.length * sw + (colors.length - 1) * sg;
            const startX = (w - totalW) / 2;

            colors.forEach((c, i) => {
                const x = startX + i * (sw + sg);
                // 颜料堆
                paintStroke(ctx, x + sw/2, palY + sw/2, sw, sw, c, rng);
                // 色值
                ctx.font = 'bold 10px "Courier New", monospace';
                ctx.fillStyle = '#6A5A4A';
                ctx.textAlign = 'center';
                ctx.fillText(c.toUpperCase(), x + sw/2, palY + sw + 18);
            });

            // 底部签名
            ctx.font = 'italic 14px "Georgia", serif';
            ctx.fillStyle = '#9A8A7A';
            const today = new Date();
            const dateStr = today.getFullYear() + '.' + String(today.getMonth()+1).padStart(2,'0') + '.' + String(today.getDate()).padStart(2,'0');
            ctx.fillText(dateStr + '  ·  MoodPalette', w/2, h - 30);

            // 最终画布纹理
            applyCanvasTexture(ctx, w, h, rng);

            // 暖色罩染
            ctx.globalCompositeOperation = 'multiply';
            ctx.fillStyle = 'rgba(200, 170, 120, 0.1)';
            ctx.fillRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'source-over';

            // 暗角
            const vg = ctx.createRadialGradient(w/2, h/2, w*0.3, w/2, h/2, w*0.7);
            vg.addColorStop(0, 'rgba(0,0,0,0)');
            vg.addColorStop(1, 'rgba(60,40,20,0.25)');
            ctx.fillStyle = vg;
            ctx.fillRect(0, 0, w, h);
        }

        function downloadPoster() {
            const canvas = document.getElementById('posterCanvas');
            const link = document.createElement('a');
            link.download = 'moodpalette_' + Date.now() + '.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        function resetAll() {
            document.getElementById('moodInput').value = '';
            document.getElementById('resultSection').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
