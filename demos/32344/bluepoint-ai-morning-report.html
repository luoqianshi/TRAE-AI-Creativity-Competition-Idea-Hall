      '产品发布/更新': 'var(--blue)',
      '行业动态': 'var(--gold)',
      '论文研究': 'var(--mint)',
      '技巧与观点': 'var(--danger)'
    };

    function slugify(value) {
      return 'section-' + value.replace(/[\s/]+/g, '-').replace(/[^\u4e00-\u9fa5\w-]/g, '');
    }

    function periodOfDay(hour) {
      if (hour < 6) return '凌晨';
      if (hour < 12) return '上午';
      if (hour < 14) return '中午';
      if (hour < 18) return '下午';
      return '晚上';
    }

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function bjtDate(input) {
      return new Date(new Date(input).getTime() + 8 * 60 * 60 * 1000);
    }

    function formatDate(input) {
      const date = bjtDate(input);
      return date.getUTCFullYear() + '年' + (date.getUTCMonth() + 1) + '月' + date.getUTCDate() + '日';
    }

    function humanTime(input) {
      if (!input) return '今日晨报收录';
      const now = new Date();
      const then = new Date(input);
      const diff = now.getTime() - then.getTime();
      const minute = 60 * 1000;
      const hour = 60 * minute;
      if (diff >= 0 && diff < minute) return '刚刚';
      if (diff >= minute && diff < hour) return Math.floor(diff / minute) + ' 分钟前';
      if (diff >= hour && diff < 6 * hour) return Math.floor(diff / hour) + ' 小时前';
      const bj = bjtDate(input);
      const today = bjtDate(now);
      const isToday =
        bj.getUTCFullYear() === today.getUTCFullYear() &&
        bj.getUTCMonth() === today.getUTCMonth() &&
        bj.getUTCDate() === today.getUTCDate();
      const time = pad(bj.getUTCHours()) + ':' + pad(bj.getUTCMinutes());
      if (isToday) return '今天' + periodOfDay(bj.getUTCHours()) + ' ' + time;
      return (bj.getUTCMonth() + 1) + '/' + bj.getUTCDate() + ' ' + time;
    }

    function escapeHtml(input) {
      return String(input)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderHero() {
      document.getElementById('report-title').textContent = report.title;
      document.getElementById('subtitle').textContent =
        formatDate(report.generatedAt) + '，' + report.total + ' 条精选资讯，按五个固定版块贯穿编号。';

      const stats = report.sections.map((section) => {
        return '<span class="pill"><strong>' + section.items.length + '</strong>' + escapeHtml(section.label) + '</span>';
      }).join('');

      document.getElementById('dashboard').innerHTML = [
        '<div class="metric"><span class="metric-label">日期</span><span class="metric-value">' + escapeHtml(report.date) + '</span></div>',
        '<div class="metric"><span class="metric-label">总条数</span><span class="metric-value">' + report.total + '</span></div>',
        '<div class="metric wide"><span class="metric-label">五个版块统计</span><div class="metric-row">' + stats + '</div></div>'
      ].join('');
    }

    function renderNav() {
      document.getElementById('anchor-nav').innerHTML = report.sections.map((section) => {
        return '<a href="#' + slugify(section.label) + '">' + escapeHtml(section.label) + ' · ' + section.items.length + '</a>';
      }).join('');
    }

    function renderContent() {
      const sectionsHtml = report.sections.map((section) => {
        const cards = section.items.map((item) => {
          const color = sectionTone[section.label] || 'var(--cyan)';
          return '<article class="card" style="--tone:' + color + '">' +
            '<div class="card-top"><span class="num">' + item.index + '</span><span class="source" title="' + escapeHtml(item.source) + '">' + escapeHtml(item.source) + '</span></div>' +
            '<h3>' + escapeHtml(item.title) + '</h3>' +
            '<p class="summary">' + escapeHtml(item.summary) + '</p>' +
            '<p class="meta">' + escapeHtml(humanTime(item.publishedAt)) + '</p>' +
            '<div class="card-actions"><a class="link-btn" href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener noreferrer">查看原文</a></div>' +
          '</article>';
        }).join('');
        return '<section class="section" id="' + slugify(section.label) + '">' +
          '<div class="section-head"><h2>' + escapeHtml(section.label) + '</h2><span class="count">' + section.items.length + ' 条</span></div>' +
          '<div class="grid">' + cards + '</div>' +
        '</section>';
      }).join('');

      const note = '<p class="footnote">本期共 ' + report.total + ' 条资讯，数据源：aihot.virxact.com · ' + humanTime(report.generatedAt) + ' 生成。</p>';
      document.getElementById('content').innerHTML = sectionsHtml + note;
    }

    function revealCards() {
      const cards = Array.from(document.querySelectorAll('.card'));
      if (!('IntersectionObserver' in window)) {
        cards.forEach((card) => card.classList.add('is-visible'));
        return;
      }
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });
      cards.forEach((card) => observer.observe(card));
    }

    renderHero();
    renderNav();
    renderContent();
    revealCards();
  </script>
</body>
</html>
