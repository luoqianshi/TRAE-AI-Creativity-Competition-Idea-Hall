<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>摸鱼计费器 · 小部件预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0d0d0d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, 'SF Pro Display', 'Roboto', system-ui, sans-serif;
            padding: 20px;
        }

        /* 手机外壳 */
        .phone-frame {
            width: 360px;
            height: 720px;
            background: #1a1a1a;
            border-radius: 44px;
            padding: 16px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 0 2px #333 inset;
            position: relative;
        }

        /* 桌面壁纸模拟 */
        .wallpaper {
            width: 100%;
            height: 100%;
            border-radius: 32px;
            background: linear-gradient(145deg, #1e2a3a 0%, #0f1a2b 100%);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            overflow: hidden;
        }

        /* 顶部状态栏 */
        .status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            font-weight: 500;
            padding: 0 4px;
            letter-spacing: 0.3px;
        }

        .status-bar .time {
            color: rgba(255, 255, 255, 0.8);
        }

        /* 小部件卡片 - 核心 */
        .widget-card {
            width: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px 22px 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            margin-top: 4px;
            transition: all 0.2s;
        }

        .widget-card .rate {
            font-size: 38px;
            font-weight: 700;
            color: #4fc3f7;
            letter-spacing: -0.5px;
            display: flex;
            align-items: baseline;
            gap: 4px;
            line-height: 1.2;
        }

        .widget-card .rate .label {
            font-size: 16px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.4);
            margin-left: 4px;
        }

        .widget-card .divider {
            height: 1px;
            background: linear-gradient(to right, rgba(79, 195, 247, 0.3), transparent);
            margin: 12px 0 14px;
        }

        .widget-card .stats {
            display: flex;
            justify-content: space-between;
        }

        .widget-card .stats .stat-item {
            display: flex;
            flex-direction: column;
        }

        .widget-card .stats .stat-item .stat-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .widget-card .stats .stat-item .stat-value {
            font-size: 20px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 2px;
            letter-spacing: 0.2px;
        }

        .widget-card .stats .stat-item .stat-value.today {
            color: #ffd54f;
        }

        .widget-card .stats .stat-item .stat-value.month {
            color: #81c784;
        }

        .widget-card .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .widget-card .status-row .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4fc3f7;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        .widget-card .status-row .status-text {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.3px;
        }

        .widget-card .status-row .status-text .highlight {
            color: #4fc3f7;
            font-weight: 600;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.8);
            }
        }

        /* 桌面其他图标（装饰） */
        .app-icons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 12px;
            width: 100%;
            margin-top: 16px;
            padding: 0 4px;
        }

        .app-icons .icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .app-icons .icon .icon-circle {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .app-icons .icon .icon-name {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            letter-spacing: 0.2px;
        }

        /* 底部 Dock */
        .dock {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            margin-top: auto;
            padding: 14px 8px 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .dock .dock-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .dock .dock-icon .icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .dock .dock-icon .icon-name {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.35);
        }

        /* 底部指示条 */
        .home-indicator {
            width: 120px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            margin-top: 10px;
            align-self: center;
        }

        /* 配置面板 - 模拟弹窗 */
        .config-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 44px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 32px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .config-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .config-panel {
            background: rgba(30, 30, 40, 0.92);
            border-radius: 28px;
            padding: 32px 28px 28px;
            width: 100%;
            max-width: 320px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
        }

        .config-panel h3 {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
            text-align: center;
        }

        .config-panel .sub {
            color: rgba(255, 255, 255, 0.35);
            font-size: 13px;
            text-align: center;
            margin-bottom: 22px;
        }

        .config-panel .input-group {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .config-panel .input-group span {
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
            margin-right: 8px;
        }

        .config-panel .input-group input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 500;
            padding: 16px 0;
            width: 100%;
            outline: none;
            font-family: inherit;
        }

        .config-panel .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
        }

        .config-panel .btn-start {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #4fc3f7, #29b6f6);
            color: #0d0d0d;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            font-family: inherit;
        }

        .config-panel .btn-start:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(79, 195, 247, 0.3);
        }

        .config-panel .btn-start:active {
            transform: scale(0.97);
        }

        .config-panel .hint {
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            text-align: center;
            margin-top: 14px;
            letter-spacing: 0.3px;
        }

        /* 控制按钮 */
        .controls {
            margin-top: 28px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls button {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.6);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            backdrop-filter: blur(8px);
        }

        .controls button:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .controls button.primary {
            background: rgba(79, 195, 247, 0.15);
            border-color: rgba(79, 195, 247, 0.25);
            color: #4fc3f7;
        }

        .controls button.primary:hover {
            background: rgba(79, 195, 247, 0.25);
        }

        /* 信息脚注 */
        .footnote {
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            margin-top: 24px;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .footnote a {
            color: rgba(79, 195, 247, 0.4);
            text-decoration: none;
        }

        /* 响应式 */
        @media (max-width: 400px) {
            .phone-frame {
                width: 100%;
                height: auto;
                aspect-ratio: 360 / 720;
                border-radius: 32px;
                padding: 12px;
            }
            .wallpaper {
                border-radius: 24px;
                padding: 14px 12px;
            }
            .widget-card {
                padding: 16px 18px 14px;
            }
            .widget-card .rate {
                font-size: 30px;
            }
            .widget-card .stats .stat-item .stat-value {
                font-size: 17px;
            }
            .app-icons .icon .icon-circle {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="wallpaper">

            <!-- 状态栏 -->
            <div class="status-bar">
                <span>09:41</span>
                <span>📶 🔋 87%</span>
            </div>

            <!-- 小部件卡片 -->
            <div class="widget-card" id="widgetCard">
                <div class="rate">
                    <span id="rateValue">0.0142</span>
                    <span class="label">元/秒</span>
                </div>
                <div class="divider"></div>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">今日</span>
                        <span class="stat-value today" id="todayValue">306.51</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">本月</span>
                        <span class="stat-value month" id="monthValue">3682.14</span>
                    </div>
                </div>
                <div class="status-row">
                    <div class="status-dot"></div>
                    <div class="status-text">
                        <span class="highlight">💼</span> 搬砖中 · 计费进行中
                    </div>
                </div>
            </div>

            <!-- 桌面图标（装饰） -->
            <div class="app-icons">
                <div class="icon"><div class="icon-circle">📱</div><span class="icon-name">电话</span></div>
                <div class="icon"><div class="icon-circle">🌐</div><span class="icon-name">浏览器</span></div>
                <div class="icon"><div class="icon-circle">📷</div><span class="icon-name">相机</span></div>
                <div class="icon"><div class="icon-circle">💬</div><span class="icon-name">消息</span></div>
                <div class="icon"><div class="icon-circle">🎵</div><span class="icon-name">音乐</span></div>
                <div class="icon"><div class="icon-circle">📺</div><span class="icon-name">视频</span></div>
                <div class="icon"><div class="icon-circle">🛒</div><span class="icon-name">商店</span></div>
                <div class="icon"><div class="icon-circle">⚙️</div><span class="icon-name">设置</span></div>
            </div>

            <!-- Dock -->
            <div class="dock">
                <div class="dock-icon"><div class="icon-circle">📞</div><span class="icon-name">电话</span></div>
                <div class="dock-icon"><div class="icon-circle">🌍</div><span class="icon-name">Safari</span></div>
                <div class="dock-icon"><div class="icon-circle">💬</div><span class="icon-name">信息</span></div>
                <div class="dock-icon"><div class="icon-circle">🎶</div><span class="icon-name">音乐</span></div>
            </div>

            <div class="home-indicator"></div>
        </div>

        <!-- 配置弹窗（点击"修改月薪"后出现） -->
        <div class="config-overlay" id="configOverlay">
            <div class="config-panel">
                <h3>💰 设置月薪</h3>
                <div class="sub">输入你的税前月薪，开始摸鱼计费</div>
                <div class="input-group">
                    <span>¥</span>
                    <input type="number" id="salaryInput" placeholder="30000" value="30000" />
                </div>
                <button class="btn-start" id="startBtn">🚀 开始摸鱼</button>
                <div class="hint">按工作日 9:00–18:00 · 21.75 天/月 · 9 小时/天</div>
            </div>
        </div>
    </div>

    <!-- 控制按钮 -->
    <div class="controls">
        <button id="configBtn" class="primary">⚙️ 修改月薪</button>
        <button id="toggleStatusBtn">🔄 切换状态</button>
        <button id="resetBtn">↺ 重置今日</button>
    </div>

    <div class="footnote">
        ⚡ 实时计费引擎 · 每秒刷新 · 支持 HyperOS / MIUI 桌面小部件
    </div>

    <script>
        (function() {
            // ---- 核心配置 ----
            let monthlySalary = 30000;
            const WORK_DAYS_PER_MONTH = 21.75;
            const HOURS_PER_DAY = 9;
            const SECONDS_PER_HOUR = 3600;
            const WORK_START_HOUR = 9;
            const WORK_END_HOUR = 18;

            // 每秒收入
            const secondsPerMonth = WORK_DAYS_PER_MONTH * HOURS_PER_DAY * SECONDS_PER_HOUR;
            let ratePerSecond = monthlySalary / secondsPerMonth;

            // ---- DOM 引用 ----
            const rateEl = document.getElementById('rateValue');
            const todayEl = document.getElementById('todayValue');
            const monthEl = document.getElementById('monthValue');
            const configOverlay = document.getElementById('configOverlay');
            const salaryInput = document.getElementById('salaryInput');
            const startBtn = document.getElementById('startBtn');
            const configBtn = document.getElementById('configBtn');
            const toggleBtn = document.getElementById('toggleStatusBtn');
            const resetBtn = document.getElementById('resetBtn');
            const statusText = document.querySelector('.status-text .highlight');
            const statusDot = document.querySelector('.status-dot');

            // ---- 状态 ----
            let isWorking = true; // 是否在计费
            let todayEarnings = 306.51;
            let monthEarnings = 3682.14;
            let lastUpdateTime = Date.now();
            let animationFrame = null;
            let isRunning = true;

            // ---- 核心计算 ----
            function calculateEarnings() {
                const now = new Date();
                const day = now.getDate();
                const month = now.getMonth() + 1;
                const year = now.getFullYear();

                // 判断是否在工作日 + 工作时间
                const dayOfWeek = now.getDay(); // 0=周日
                const hour = now.getHours();
                const minute = now.getMinutes();
                const currentMinutes = hour * 60 + minute;
                const workStartMinutes = WORK_START_HOUR * 60;
                const workEndMinutes = WORK_END_HOUR * 60;

                const isWeekday = dayOfWeek >= 1 && dayOfWeek <= 5;
                const isWorkHour = currentMinutes >= workStartMinutes && currentMinutes < workEndMinutes;
                const shouldCount = isWeekday && isWorkHour;

                // 更新状态显示
                if (!isWeekday) {
                    statusText.textContent = '🌴 周末摸鱼';
                    statusDot.style.background = '#f06292';
                } else if (!isWorkHour) {
                    statusText.textContent = '🌙 下班了';
                    statusDot.style.background = '#ffb74d';
                } else {
                    statusText.textContent = '💼 搬砖中';
                    statusDot.style.background = '#4fc3f7';
                }

                // 实际计费逻辑：只有工作日工作时间且 isWorking 为 true 才计费
                const effective = shouldCount && isWorking;

                if (effective) {
                    // 每秒增加
                    const nowMs = Date.now();
                    const deltaSeconds = (nowMs - lastUpdateTime) / 1000;
                    if (deltaSeconds > 0 && deltaSeconds < 5) {
                        const increment = deltaSeconds * ratePerSecond;
                        todayEarnings += increment;
                        monthEarnings += increment;
                    }
                    lastUpdateTime = nowMs;
                } else {
                    // 不在计费状态，重置计时基准
                    lastUpdateTime = Date.now();
                }

                // 更新 UI
                rateEl.textContent = ratePerSecond.toFixed(4);
                todayEl.textContent = todayEarnings.toFixed(2);
                monthEl.textContent = monthEarnings.toFixed(2);
            }

            // ---- 刷新循环 ----
            function updateLoop() {
                if (!isRunning) return;
                calculateEarnings();
                // 使用 requestAnimationFrame 实现约 60fps 的平滑更新
                // 但实际数值变化每秒一次即可，我们利用 rAF 保证 UI 流畅
                animationFrame = requestAnimationFrame(updateLoop);
            }

            // ---- 从 localStorage 恢复数据 ----
            function loadState() {
                try {
                    const saved = localStorage.getItem('moyu_widget_state');
                    if (saved) {
                        const data = JSON.parse(saved);
                        monthlySalary = data.monthlySalary || 30000;
                        todayEarnings = data.todayEarnings || 0;
                        monthEarnings = data.monthEarnings || 0;
                        ratePerSecond = monthlySalary / secondsPerMonth;
                        salaryInput.value = monthlySalary;
                        // 检查是否跨日
                        const savedDate = data.date;
                        const now = new Date();
                        const todayStr = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
                        if (savedDate !== todayStr) {
                            // 跨日重置今日
                            todayEarnings = 0;
                        }
                        // 检查是否跨月
                        const savedMonth = data.month;
                        const currentMonth = `${now.getFullYear()}-${now.getMonth()+1}`;
                        if (savedMonth !== currentMonth) {
                            monthEarnings = 0;
                            todayEarnings = 0;
                        }
                    }
                } catch (e) {
                    // ignore
                }
            }

            function saveState() {
                try {
                    const now = new Date();
                    const data = {
                        monthlySalary: monthlySalary,
                        todayEarnings: todayEarnings,
                        monthEarnings: monthEarnings,
                        date: `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`,
                        month: `${now.getFullYear()}-${now.getMonth()+1}`
                    };
                    localStorage.setItem('moyu_widget_state', JSON.stringify(data));
                } catch (e) { /* ignore */ }
            }

            // ---- 保存定时器 ----
            setInterval(saveState, 3000);

            // ---- 配置弹窗 ----
            function openConfig() {
                salaryInput.value = monthlySalary;
                configOverlay.classList.add('active');
            }

            function closeConfig() {
                configOverlay.classList.remove('active');
            }

            startBtn.addEventListener('click', function() {
                const val = parseFloat(salaryInput.value);
                if (val > 0) {
                    monthlySalary = val;
                    ratePerSecond = monthlySalary / secondsPerMonth;
                    // 重置累计（可选，更符合直觉：改月薪后重新计算本月）
                    // 但为了演示，保留现有累计，仅改变速率
                    saveState();
                    closeConfig();
                } else {
                    salaryInput.value = 30000;
                }
            });

            configBtn.addEventListener('click', openConfig);

            // 点击遮罩关闭
            configOverlay.addEventListener('click', function(e) {
                if (e.target === configOverlay) closeConfig();
            });

            // ---- 切换状态 ----
            toggleBtn.addEventListener('click', function() {
                isWorking = !isWorking;
                if (isWorking) {
                    toggleBtn.textContent = '⏸️ 暂停计费';
                    toggleBtn.style.borderColor = 'rgba(79,195,247,0.3)';
                    toggleBtn.style.color = '#4fc3f7';
                    lastUpdateTime = Date.now();
                } else {
                    toggleBtn.textContent = '▶️ 恢复计费';
                    toggleBtn.style.borderColor = 'rgba(255,183,77,0.3)';
                    toggleBtn.style.color = '#ffb74d';
                }
            });

            // ---- 重置今日 ----
            resetBtn.addEventListener('click', function() {
                todayEarnings = 0;
                saveState();
            });

            // ---- 初始化 ----
            function init() {
                loadState();
                ratePerSecond = monthlySalary / secondsPerMonth;
                lastUpdateTime = Date.now();
                // 初始状态
                toggleBtn.textContent = isWorking ? '⏸️ 暂停计费' : '▶️ 恢复计费';
                if (!isWorking) {
                    toggleBtn.style.borderColor = 'rgba(255,183,77,0.3)';
                    toggleBtn.style.color = '#ffb74d';
                }
                updateLoop();
                // 窗口可见性变化时，重新校准
                document.addEventListener('visibilitychange', function() {
                    if (!document.hidden) {
                        lastUpdateTime = Date.now();
                    }
                });
            }

            init();

            // 页面关闭前保存
            window.addEventListener('beforeunload', saveState);

            // 暴露一些变量方便调试
            window.__moyu = {
                monthlySalary,
                ratePerSecond,
                todayEarnings,
                monthEarnings,
                isWorking,
                saveState,
                loadState
            };
        })();
    </script>
