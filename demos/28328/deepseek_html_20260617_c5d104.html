<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家事通 · 小程序原型</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* 手机壳模拟 */
        .phone {
            width: 375px;
            height: 812px;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        /* 状态栏 */
        .status-bar {
            height: 44px;
            background: #ffffff;
            display: flex;
            justify-content: space-between;
            padding: 0 24px;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            color: #1a1a1a;
            flex-shrink: 0;
        }
        .status-bar .time { font-weight: 700; }
        .status-icons { display: flex; gap: 6px; }

        /* 头部 */
        .header {
            padding: 12px 20px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1e2a3a;
        }
        .header .family-badge {
            background: #eef3ff;
            color: #2b6bff;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 12px;
            font-weight: 500;
        }

        /* 主内容 - 模拟页面切换 */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 8px;
            scroll-behavior: smooth;
        }
        .main-content::-webkit-scrollbar { width: 0; }

        /* 页面容器 (切换) */
        .page {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            0% { opacity: 0.5; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 首页 */
        .greeting {
            font-size: 16px;
            color: #3d4a5a;
            margin-bottom: 6px;
        }
        .greeting strong { color: #1e2a3a; }

        .quick-stats {
            display: flex;
            gap: 10px;
            margin: 14px 0 20px;
        }
        .stat-card {
            flex: 1;
            background: #f8f9fc;
            border-radius: 12px;
            padding: 12px 0;
            text-align: center;
        }
        .stat-card .num {
            font-size: 22px;
            font-weight: 700;
            color: #2b6bff;
        }
        .stat-card .label {
            font-size: 11px;
            color: #7a8a9e;
            margin-top: 2px;
        }

        .task-section-title {
            font-size: 15px;
            font-weight: 600;
            color: #1e2a3a;
            margin: 16px 0 10px;
            display: flex;
            justify-content: space-between;
        }
        .task-section-title a {
            color: #2b6bff;
            font-weight: 400;
            font-size: 13px;
            text-decoration: none;
        }

        .task-item {
            background: #ffffff;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #eef1f5;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .task-item .icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #eef3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2b6bff;
            font-size: 16px;
            flex-shrink: 0;
        }
        .task-item .info {
            flex: 1;
        }
        .task-item .info .title {
            font-weight: 600;
            font-size: 14px;
            color: #1e2a3a;
        }
        .task-item .info .desc {
            font-size: 12px;
            color: #7a8a9e;
            margin-top: 2px;
        }
        .task-item .badge {
            background: #ff6b6b;
            color: #fff;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 500;
            flex-shrink: 0;
        }
        .task-item .badge.done {
            background: #4caf84;
        }

        /* 发布任务页 */
        .publish-form {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #eef1f5;
        }
        .publish-form label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #3d4a5a;
            margin: 12px 0 4px;
        }
        .publish-form input,
        .publish-form textarea,
        .publish-form select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d9e0e8;
            border-radius: 8px;
            font-size: 14px;
            background: #fafbfc;
            outline: none;
        }
        .publish-form input:focus,
        .publish-form textarea:focus {
            border-color: #2b6bff;
        }
        .publish-form textarea {
            height: 70px;
            resize: vertical;
        }
        .publish-form .btn-submit {
            width: 100%;
            margin-top: 18px;
            background: #2b6bff;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: default;
        }

        /* 积分页 */
        .score-board {
            background: linear-gradient(135deg, #2b6bff 0%, #6c8cff 100%);
            border-radius: 16px;
            padding: 24px 20px;
            color: #fff;
            margin-bottom: 20px;
        }
        .score-board .score-num {
            font-size: 36px;
            font-weight: 700;
        }
        .score-board .score-label {
            font-size: 14px;
            opacity: 0.8;
        }
        .rank-list {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #eef1f5;
        }
        .rank-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f2f5;
        }
        .rank-item:last-child { border-bottom: none; }
        .rank-item .rank {
            width: 24px;
            font-weight: 700;
            color: #7a8a9e;
            font-size: 14px;
        }
        .rank-item .name {
            flex: 1;
            font-weight: 500;
        }
        .rank-item .pts {
            color: #2b6bff;
            font-weight: 600;
        }

        /* 底部 Tab */
        .bottom-tab {
            height: 70px;
            background: #ffffff;
            border-top: 1px solid #eef1f5;
            display: flex;
            flex-shrink: 0;
            padding-bottom: 8px;
        }
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #9aa8b9;
            transition: 0.2s;
            cursor: default;
            border: none;
            background: transparent;
        }
        .tab-item .tab-icon {
            font-size: 22px;
            margin-bottom: 2px;
        }
        .tab-item.active {
            color: #2b6bff;
            font-weight: 500;
        }
        .tab-item.active .tab-icon {
            transform: scale(1.05);
        }

        /* 辅助提示 */
        .footnote {
            text-align: center;
            font-size: 10px;
            color: #b0c0d0;
            padding: 4px 0 2px;
            border-top: 1px solid #f0f0f0;
        }
    </style>
</head>
<body>
<div class="phone">
    <!-- 状态栏 -->
    <div class="status-bar">
        <span class="time">9:41</span>
        <div class="status-icons">
            <span>📶</span>
            <span>📶</span>
            <span>🔋</span>
        </div>
    </div>

    <!-- 头部 -->
    <div class="header">
        <h1>🏠 家事通</h1>
        <span class="family-badge">👨‍👩‍👧‍👦 我的家庭</span>
    </div>

    <!-- 主内容 -->
    <div class="main-content" id="mainContent">
        <!-- 首页 -->
        <div class="page active" id="pageHome">
            <div class="greeting">👋 下午好，<strong>张先生</strong></div>
            <div class="quick-stats">
                <div class="stat-card"><div class="num">3</div><div class="label">待处理</div></div>
                <div class="stat-card"><div class="num">2</div><div class="label">进行中</div></div>
                <div class="stat-card"><div class="num">8</div><div class="label">已完成</div></div>
            </div>

            <div class="task-section-title">
                今日待办 <a href="javascript:void(0)" onclick="switchTab('tasks')">查看全部 →</a>
            </div>

            <div class="task-item">
                <div class="icon">💧</div>
                <div class="info"><div class="title">缴纳水费</div><div class="desc">截止今天 18:00 · 责任人: 李女士</div></div>
                <span class="badge">紧急</span>
            </div>
            <div class="task-item">
                <div class="icon">🗑️</div>
                <div class="info"><div class="title">厨余垃圾清理</div><div class="desc">每晚 21:00 前 · 轮值: 张先生</div></div>
                <span class="badge done">进行中</span>
            </div>
            <div class="task-item">
                <div class="icon">🛒</div>
                <div class="info"><div class="title">采购周末食材</div><div class="desc">清单已发至群聊 · 待确认</div></div>
                <span class="badge">待认领</span>
            </div>

            <div style="height: 10px;"></div>
        </div>

        <!-- 发布任务页 -->
        <div class="page" id="pagePublish">
            <div style="font-size:16px;font-weight:600;margin-bottom:12px;">📌 发布新任务</div>
            <div class="publish-form">
                <label>任务标题</label>
                <input type="text" placeholder="例如：更换净水器滤芯" value="维修客厅吊灯">
                <label>任务描述</label>
                <textarea placeholder="详细说明…">客厅吊灯闪烁，需更换灯泡或检查线路，建议明晚处理。</textarea>
                <label>指派给</label>
                <select><option>张先生 (自己)</option><option>李女士</option><option>王阿姨</option></select>
                <label>截止时间</label>
                <input type="datetime-local" value="2026-06-18T20:00">
                <label>优先级</label>
                <select><option>普通</option><option selected>紧急</option><option>低</option></select>
                <div class="btn-submit">📨 发布任务</div>
            </div>
            <div style="height:20px;"></div>
        </div>

        <!-- 积分榜页 -->
        <div class="page" id="pageScore">
            <div class="score-board">
                <div class="score-label">🏆 家庭总积分</div>
                <div class="score-num">1,286</div>
                <div style="font-size:12px;opacity:0.8;margin-top:4px;">本月完成 23 项任务</div>
            </div>
            <div style="font-size:14px;font-weight:600;margin-bottom:8px;">👥 成员排名</div>
            <div class="rank-list">
                <div class="rank-item"><span class="rank">🥇</span><span class="name">李女士</span><span class="pts">520 分</span></div>
                <div class="rank-item"><span class="rank">🥈</span><span class="name">张先生</span><span class="pts">430 分</span></div>
                <div class="rank-item"><span class="rank">🥉</span><span class="name">王阿姨</span><span class="pts">336 分</span></div>
            </div>
            <div style="height:20px;"></div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-tab">
        <button class="tab-item active" data-tab="home" onclick="switchTab('home')">
            <span class="tab-icon">🏠</span> 首页
        </button>
        <button class="tab-item" data-tab="publish" onclick="switchTab('publish')">
            <span class="tab-icon">📝</span> 发布
        </button>
        <button class="tab-item" data-tab="score" onclick="switchTab('score')">
            <span class="tab-icon">🏅</span> 积分
        </button>
    </div>
    <div class="footnote">创意原型 · 家事通 v0.1</div>
</div>

<script>
    // 简易 Tab 切换（纯前端演示）
    function switchTab(tabId) {
        // 页面切换
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const targetMap = {
            'home': 'pageHome',
            'publish': 'pagePublish',
            'score': 'pageScore'
        };
        const target = document.getElementById(targetMap[tabId]);
        if (target) target.classList.add('active');

        // Tab 高亮
        document.querySelectorAll('.tab-item').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.tab-item[data-tab="${tabId}"]`)?.classList.add('active');

        // 滚动到顶部
        document.getElementById('mainContent').scrollTop = 0;
    }

    // 默认激活首页
    document.addEventListener('DOMContentLoaded', function() {
        switchTab('home');
    });
</script>
</body>
</html>
