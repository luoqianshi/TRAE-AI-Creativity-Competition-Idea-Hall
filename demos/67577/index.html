<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>单词店长 - 背单词 × 模拟经营</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    #game-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    /* Phaser canvas will be inserted here */
    #game-container canvas { display: block; border-radius: 0; }
    /* Loading overlay before Phaser boots */
    #boot-loading {
      position: fixed; inset: 0; background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
      transition: opacity 0.5s;
    }
    #boot-loading.hidden { opacity: 0; pointer-events: none; }
    .boot-logo {
      width: 80px; height: 80px; border-radius: 20px;
      background: linear-gradient(135deg, #ff9a56, #ff6b35);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(255,107,53,0.4);
      animation: bootPulse 1.5s ease-in-out infinite;
    }
    @keyframes bootPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .boot-title { color: #fff; font-size: 24px; font-weight: 700; margin-bottom: 8px; letter-spacing: 2px; }
    .boot-subtitle { color: rgba(255,255,255,0.6); font-size: 13px; margin-bottom: 24px; }
    .boot-bar { width: 200px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
    .boot-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff9a56, #ff6b35); border-radius: 3px; transition: width 0.3s; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="boot-loading">
    <div class="boot-logo">🏪</div>
    <div class="boot-title">单词店长</div>
    <div class="boot-subtitle">正在准备开业...</div>
    <div class="boot-bar"><div class="boot-bar-fill" id="boot-bar-fill"></div></div>
  </div>

  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <!-- Game Logic Layer (kept from V1.0, slightly adapted) -->
  <script src="js/game.js"></script>
  <!-- Phaser Scenes -->
  <script src="js/scenes/BootScene.js"></script>
  <script src="js/scenes/MapScene.js"></script>
  <script src="js/scenes/ShopScene.js"></script>
  <script src="js/scenes/UIScene.js"></script>
  <!-- Phaser App Entry -->
  <script src="js/phaser-app.js"></script>
</body>
</html>
