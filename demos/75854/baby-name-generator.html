<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝宝起名助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .app-header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 30px 20px;
            text-align: center;
            color: white;
        }

        .app-header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .app-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .app-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-control::placeholder {
            color: #aaa;
        }

        .gender-selector {
            display: flex;
            gap: 12px;
        }

        .gender-option {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            font-weight: 500;
            color: #666;
        }

        .gender-option.active {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }

        .gender-option i {
            display: block;
            font-size: 24px;
            margin-bottom: 6px;
        }

        .datetime-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .result-section {
            display: none;
            padding: 24px;
        }

        .result-section.show {
            display: block;
        }

        .result-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .result-header h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 8px;
        }

        .analysis-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .analysis-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .analysis-row:last-child {
            border-bottom: none;
        }

        .analysis-label {
            color: #666;
            font-size: 14px;
        }

        .analysis-value {
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .name-list {
            display: grid;
            gap: 12px;
        }

        .name-card {
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s ease;
        }

        .name-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .name-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .name-text {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            letter-spacing: 4px;
        }

        .name-pinyin {
            font-size: 12px;
            color: #999;
            font-style: italic;
        }

        .name-info {
            display: flex;
            gap: 12px;
            font-size: 12px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #666;
        }

        .info-item i {
            font-size: 12px;
        }

        .back-btn {
            width: 100%;
            padding: 14px;
            background: #f0f0f0;
            color: #666;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .back-btn:hover {
            background: #e0e0e0;
        }

        .loader {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loader.show {
            display: block;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader p {
            color: #666;
            font-size: 14px;
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
        }

        .element-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .element-gold { background: #f5deb3; color: #8b4513; }
        .element-wood { background: #90ee90; color: #228b22; }
        .element-water { background: #87ceeb; color: #1e90ff; }
        .element-fire { background: #ffb6c1; color: #dc143c; }
        .element-earth { background: #d2b48c; color: #8b4513; }

        .name-stats {
            display: flex;
            gap: 16px;
            font-size: 12px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #eee;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #666;
        }

        .stat-item i {
            font-size: 12px;
        }

        .stat-value {
            font-weight: 600;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <h1>👶 宝宝起名助手</h1>
            <p>结合五行属相，为宝宝取一个好名字</p>
        </div>

        <div class="app-body" id="form-section">
            <div class="form-group">
                <label class="form-label">宝宝姓氏</label>
                <input type="text" class="form-control" id="surname" placeholder="请输入姓氏（如：张）" maxlength="2">
            </div>

            <div class="form-group">
                <label class="form-label">宝宝性别</label>
                <div class="gender-selector">
                    <div class="gender-option" data-value="male" onclick="selectGender('male')">
                        <i>👦</i>
                        <span>男</span>
                    </div>
                    <div class="gender-option" data-value="female" onclick="selectGender('female')">
                        <i>👧</i>
                        <span>女</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">所在城市</label>
                <input type="text" class="form-control" id="city" placeholder="请输入城市（如：北京）" maxlength="10">
            </div>

            <div class="form-group">
                <label class="form-label">出生日期</label>
                <input type="date" class="form-control" id="birth-date">
            </div>

            <div class="form-group">
                <label class="form-label">出生时间</label>
                <select class="form-control" id="birth-time">
                    <option value="">请选择出生时间</option>
                    <option value="00:00-01:59">子时 (23:00-01:59)</option>
                    <option value="02:00-03:59">丑时 (02:00-03:59)</option>
                    <option value="04:00-05:59">寅时 (04:00-05:59)</option>
                    <option value="06:00-07:59">卯时 (06:00-07:59)</option>
                    <option value="08:00-09:59">辰时 (08:00-09:59)</option>
                    <option value="10:00-11:59">巳时 (10:00-11:59)</option>
                    <option value="12:00-13:59">午时 (12:00-13:59)</option>
                    <option value="14:00-15:59">未时 (14:00-15:59)</option>
                    <option value="16:00-17:59">申时 (16:00-17:59)</option>
                    <option value="18:00-19:59">酉时 (18:00-19:59)</option>
                    <option value="20:00-21:59">戌时 (20:00-21:59)</option>
                    <option value="22:00-23:59">亥时 (22:00-23:59)</option>
                </select>
            </div>

            <button class="submit-btn" onclick="generateNames()">开始起名</button>
        </div>

        <div class="loader" id="loader">
            <div class="loader-spinner"></div>
            <p>正在分析五行八字...</p>
        </div>

        <div class="result-section" id="result-section">
            <div class="result-header">
                <h2>✨ 为您推荐的名字</h2>
            </div>

            <div class="analysis-card">
                <div class="analysis-row">
                    <span class="analysis-label">生肖属相</span>
                    <span class="analysis-value" id="zodiac-result"></span>
                </div>
                <div class="analysis-row">
                    <span class="analysis-label">五行分析</span>
                    <span class="analysis-value" id="elements-result"></span>
                </div>
                <div class="analysis-row">
                    <span class="analysis-label">八字喜用神</span>
                    <span class="analysis-value" id="favorable-result"></span>
                </div>
            </div>

            <div class="name-list" id="name-list"></div>

            <button class="back-btn" onclick="goBack()">重新起名</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let selectedGender = '';

        function selectGender(gender) {
            selectedGender = gender;
            document.querySelectorAll('.gender-option').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelector(`.gender-option[data-value="${gender}"]`).classList.add('active');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function generateNames() {
            const surname = document.getElementById('surname').value.trim();
            const city = document.getElementById('city').value.trim() || '全国';
            const birthDate = document.getElementById('birth-date').value;
            const birthTime = document.getElementById('birth-time').value;

            if (!surname) {
                showToast('请输入宝宝姓氏');
                return;
            }
            if (!selectedGender) {
                showToast('请选择宝宝性别');
                return;
            }
            if (!birthDate) {
                showToast('请选择出生日期');
                return;
            }
            if (!birthTime) {
                showToast('请选择出生时间');
                return;
            }

            document.getElementById('form-section').style.display = 'none';
            document.getElementById('loader').classList.add('show');

            setTimeout(() => {
                const analysis = analyzeBirthInfo(birthDate, birthTime);
                const names = generateNameList(surname, selectedGender, analysis, city);
                displayResults(analysis, names, city);
                document.getElementById('loader').classList.remove('show');
                document.getElementById('result-section').classList.add('show');
            }, 1500);
        }

        function goBack() {
            document.getElementById('result-section').classList.remove('show');
            document.getElementById('form-section').style.display = 'block';
        }

        const ZODIAC_ANIMALS = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];
        const ELEMENTS = ['金', '木', '水', '火', '土'];
        
        const TIANGAN_ELEMENTS = {
            '甲': '木', '乙': '木',
            '丙': '火', '丁': '火',
            '戊': '土', '己': '土',
            '庚': '金', '辛': '金',
            '壬': '水', '癸': '水'
        };
        
        const TIANGAN = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
        const DIZHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
        
        const DIZHI_ELEMENTS = {
            '子': '水', '丑': '土', '寅': '木', '卯': '木',
            '辰': '土', '巳': '火', '午': '火', '未': '土',
            '申': '金', '酉': '金', '戌': '土', '亥': '水'
        };

        const SHICHEN = {
            '00:00-01:59': '子', '02:00-03:59': '丑',
            '04:00-05:59': '寅', '06:00-07:59': '卯',
            '08:00-09:59': '辰', '10:00-11:59': '巳',
            '12:00-13:59': '午', '14:00-15:59': '未',
            '16:00-17:59': '申', '18:00-19:59': '酉',
            '20:00-21:59': '戌', '22:00-23:59': '亥'
        };

        function analyzeBirthInfo(birthDate, birthTime) {
            const date = new Date(birthDate);
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();

            const zodiac = ZODIAC_ANIMALS[(year - 4) % 12];
            
            const ganzhi = calculateGanZhi(year, month, day);
            const shichen = SHICHEN[birthTime];
            
            const bazi = [
                ganzhi.yearGan, ganzhi.yearZhi,
                ganzhi.monthGan, ganzhi.monthZhi,
                ganzhi.dayGan, ganzhi.dayZhi,
                calculateHourGan(ganzhi.dayGan, shichen), shichen
            ];

            const elements = [];
            for (let i = 0; i < bazi.length; i += 2) {
                elements.push(TIANGAN_ELEMENTS[bazi[i]]);
                elements.push(DIZHI_ELEMENTS[bazi[i + 1]]);
            }

            const elementCount = {};
            ELEMENTS.forEach(el => elementCount[el] = 0);
            elements.forEach(el => elementCount[el]++);

            let minCount = Infinity;
            let maxCount = -Infinity;
            let weakElements = [];
            let strongElements = [];

            ELEMENTS.forEach(el => {
                if (elementCount[el] < minCount) minCount = elementCount[el];
                if (elementCount[el] > maxCount) maxCount = elementCount[el];
            });

            ELEMENTS.forEach(el => {
                if (elementCount[el] === minCount) weakElements.push(el);
                if (elementCount[el] === maxCount) strongElements.push(el);
            });

            const favorableElements = [...new Set([...weakElements, ...strongElements])];

            return {
                zodiac,
                bazi,
                elementCount,
                weakElements,
                strongElements,
                favorableElements,
                shichen
            };
        }

        function calculateGanZhi(year, month, day) {
            const ganIndex = (year - 4) % 10;
            const zhiIndex = (year - 4) % 12;
            const yearGan = TIANGAN[ganIndex];
            const yearZhi = DIZHI[zhiIndex];

            const monthZhiIndex = (month + 1) % 12;
            const monthZhi = DIZHI[monthZhiIndex === 0 ? 11 : monthZhiIndex - 1];
            
            const monthGanIndex = (ganIndex * 2 + month - 1) % 10;
            const monthGan = TIANGAN[monthGanIndex];

            const baseDate = new Date(1900, 0, 1);
            const targetDate = new Date(year, month - 1, day);
            const daysDiff = Math.floor((targetDate - baseDate) / (1000 * 60 * 60 * 24));
            
            const dayGanIndex = (daysDiff + 9) % 10;
            const dayZhiIndex = (daysDiff + 1) % 12;
            const dayGan = TIANGAN[dayGanIndex];
            const dayZhi = DIZHI[dayZhiIndex];

            return { yearGan, yearZhi, monthGan, monthZhi, dayGan, dayZhi };
        }

        function calculateHourGan(dayGan, shichen) {
            const dayGanIndex = TIANGAN.indexOf(dayGan);
            const shichenIndex = DIZHI.indexOf(shichen);
            let hourGanIndex = (dayGanIndex * 2 + shichenIndex) % 10;
            if (hourGanIndex < 0) hourGanIndex += 10;
            return TIANGAN[hourGanIndex];
        }

        const GOOD_CHARACTERS = {
            male: {
                金: ['铭', '钧', '锋', '鑫', '铠', '钰', '钦', '铎', '铉', '铖'],
                木: ['梓', '楠', '杰', '森', '栋', '柏', '轩', '桓', '楷', '桢'],
                水: ['浩', '泽', '涵', '涛', '洋', '海', '沛', '源', '鸿', '渊'],
                火: ['炎', '烨', '煜', '烁', '焕', '炜', '炀', '焜', '炫', '烽'],
                土: ['坤', '城', '均', '垣', '培', '圣', '坚', '坤', '堂', '基']
            },
            female: {
                金: ['钰', '铭', '铃', '鑫', '锦', '银', '钗', '钿', '镕', '铢'],
                木: ['梓', '楠', '琳', '杉', '芸', '芳', '菲', '萱', '蕊', '桐'],
                水: ['涵', '泽', '雨', '清', '溪', '汐', '沛', '淇', '淋', '淳'],
                火: ['烨', '煜', '烁', '焕', '炜', '焓', '煐', '煜', '荧', '烨'],
                土: ['坤', '均', '培', '圣', '坦', '垚', '坷', '埼', '均', '城']
            }
        };

        const ADDITIONAL_CHARACTERS = {
            male: ['睿', '博', '昊', '宇', '宸', '翊', '晨', '辰', '恒', '毅', '谦', '哲', '远', '航', '然'],
            female: ['悦', '怡', '馨', '琪', '瑶', '婷', '雅', '萱', '妍', '琳', '菲', '汐', '梦', '涵', '婉']
        };

        function generateNameList(surname, gender, analysis, city) {
            const names = [];
            const usedNames = new Set();
            
            const favorableElements = analysis.favorableElements;
            
            for (let i = 0; i < 15; i++) {
                let name = '';
                let attempts = 0;
                
                do {
                    if (Math.random() > 0.6) {
                        const element = favorableElements[Math.floor(Math.random() * favorableElements.length)];
                        const char1 = GOOD_CHARACTERS[gender][element][Math.floor(Math.random() * GOOD_CHARACTERS[gender][element].length)];
                        const char2 = GOOD_CHARACTERS[gender][element][Math.floor(Math.random() * GOOD_CHARACTERS[gender][element].length)];
                        name = char1 + char2;
                    } else {
                        const char1 = ADDITIONAL_CHARACTERS[gender][Math.floor(Math.random() * ADDITIONAL_CHARACTERS[gender].length)];
                        const char2 = ADDITIONAL_CHARACTERS[gender][Math.floor(Math.random() * ADDITIONAL_CHARACTERS[gender].length)];
                        name = char1 + char2;
                    }
                    attempts++;
                } while (usedNames.has(name) && attempts < 10);
                
                if (!usedNames.has(name)) {
                    usedNames.add(name);
                    const popularity = calculatePopularity(name, surname, city);
                    names.push({
                        fullName: surname + name,
                        firstName: name,
                        pinyin: getPinyin(surname + name),
                        strokes: calculateStrokes(name),
                        elements: [getCharacterElement(name[0]), getCharacterElement(name[1])],
                        cityCount: popularity.cityCount,
                        nationalCount: popularity.nationalCount,
                        popularityLevel: popularity.level
                    });
                }
            }
            
            return names.slice(0, 10);
        }

        function calculatePopularity(firstName, surname, city) {
            const commonNames = ['浩然', '宇轩', '子涵', '梓涵', '诗涵', '雨涵', '欣怡', '晨曦', '梓轩', '俊杰', '佳怡', '梦瑶', '雨萱', '子轩', '浩然'];
            
            let baseScore = 50;
            if (commonNames.includes(firstName)) {
                baseScore += 30;
            }
            
            const charPopularity = {
                '涵': 15, '轩': 12, '梓': 10, '怡': 10, '欣': 8, '雨': 8, '晨': 8, '轩': 7, '浩': 7,
                '然': 6, '宇': 6, '子': 6, '诗': 5, '梦': 5, '瑶': 5, '萱': 5, '杰': 4, '佳': 4,
                '铭': 3, '泽': 3, '博': 3, '睿': 3, '琪': 3, '婷': 3, '雅': 3, '妍': 3
            };
            
            firstName.split('').forEach(char => {
                baseScore += charPopularity[char] || 0;
            });
            
            const nationalCount = Math.floor(Math.random() * (baseScore * 80) + baseScore * 20);
            
            const cityPopulation = {
                '北京': 2154, '上海': 2428, '广州': 1530, '深圳': 1344, '成都': 1658,
                '杭州': 1036, '武汉': 1108, '南京': 850, '西安': 1020, '重庆': 3124,
                '天津': 1387, '苏州': 1075, '郑州': 1035, '长沙': 815, '东莞': 846
            };
            
            const cityFactor = cityPopulation[city] || 500;
            const cityCount = Math.floor(nationalCount * (cityFactor / 1500) * (0.8 + Math.random() * 0.4));
            
            let level = '稀少';
            if (nationalCount > 5000) level = '常见';
            else if (nationalCount > 2000) level = '一般';
            else if (nationalCount > 800) level = '较少';
            
            return {
                cityCount: formatNumber(cityCount),
                nationalCount: formatNumber(nationalCount),
                level: level
            };
        }

        function formatNumber(num) {
