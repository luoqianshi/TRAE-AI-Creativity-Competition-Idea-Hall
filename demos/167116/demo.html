      python: `# Python 示例 - 快速排序
def quicksort(arr):
    if len(arr) <= 1:
        return arr
    pivot = arr[len(arr) // 2]
    left = [x for x in arr if x < pivot]
    middle = [x for x in arr if x == pivot]
    right = [x for x in arr if x > pivot]
    return quicksort(left) + middle + quicksort(right)

print("快速排序演示：")
unsorted = [3, 6, 8, 10, 1, 2, 1]
print(f"原数组: {unsorted}")
print(f"排序后: {quicksort(unsorted)}")

# 阶乘计算
def factorial(n):
    if n == 0:
        return 1
    return n * factorial(n - 1)

print("\\n阶乘计算：")

#include <vector>
#include <algorithm>
using namespace std;

// C++ 示例 - 快速排序
void quicksort(vector<int>& arr, int low, int high) {
    if (low < high) {
        int pivot = arr[high];
        int i = low - 1;
        for (int j = low; j < high; j++) {
            if (arr[j] <= pivot) {
                i++;
                swap(arr[i], arr[j]);
            }
        }
        swap(arr[i + 1], arr[high]);
        int pi = i + 1;
        quicksort(arr, low, pi - 1);
        quicksort(arr, pi + 1, high);
    }
}

int main() {
    cout << "快速排序演示：" << endl;
    vector<int> arr = {3, 6, 8, 10, 1, 2, 1};
    for (int num : arr) cout << num << " ";
    cout << endl;
    quicksort(arr, 0, arr.size() - 1);
    for (int num : arr) cout << num << " ";

    function Header() {
      const { language, setLanguage, runCode, stopCode, resetCode, clearOutput, isRunning, historyPanelOpen, setHistoryPanelOpen, debugPanelOpen, setDebugPanelOpen, toggleTheme, theme, code, setCode } = useStore();
      const [showLangMenu, setShowLangMenu] = useState(false);
      useEffect(() => {
        const handleClickOutside = (e) => {
          if (!e.target.closest('[data-lang-menu]')) setShowLangMenu(false);
        };
        document.addEventListener('click', handleClickOutside);
        return () => document.removeEventListener('click', handleClickOutside);
      }, []);
      const handleExportCode = () => {
        const blob = new Blob([code], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `code.${LANGUAGES.find(l => l.id === language)?.ext || 'js'}`;
        a.click();
        URL.revokeObjectURL(url);
      };
      const handleImportCode = () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.js,.ts,.py,.java,.cpp,.go,.rs,.txt';
        input.onchange = (e) => {
          const file = e.target.files?.[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
              setCode(event.target?.result || '');
            };
            reader.readAsText(file);
          }
        };
        input.click();
      };
      return (
        <header className="flex items-center justify-between px-4 py-3 border-b"
          style={{ backgroundColor: '#252526', borderColor: '#3c3c3c' }}>
          <div className="flex items-center gap-4">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg flex items-center justify-center"
                style={{ background: 'linear-gradient(135deg, #569cd6 0%, #a371f7 100%)' }}>
                <span className="text-white font-bold text-sm">&lt;/&gt;</span>
              </div>
              <span className="text-sm font-semibold" style={{ color: '#d4d4d4' }}>CodePlay</span>
            </div>
            <div className="h-6 w-px" style={{ backgroundColor: '#3c3c3c' }} />
            <div className="relative" data-lang-menu>
              <button onClick={(e) => { e.stopPropagation(); setShowLangMenu(!showLangMenu); }}
                className="flex items-center gap-2 px-3 py-1.5 rounded-lg border"
                style={{ backgroundColor: '#3c3c3c', borderColor: '#569cd6', borderWidth: '1px' }}>
                <span className="text-sm font-medium" style={{ color: '#569cd6' }}>
                  {LANGUAGES.find(l => l.id === language)?.icon}
                </span>
                <span className="text-sm font-medium" style={{ color: '#d4d4d4' }}>
                  {LANGUAGES.find(l => l.id === language)?.name}
                </span>
                <Icon name="ChevronDown" className="w-3 h-3" style={{ color: '#858585' }} />
              </button>
              {showLangMenu && (
                <div className="absolute top-full left-0 mt-1 w-48 rounded-lg border shadow-xl z-50"
                  style={{ backgroundColor: '#2d2d30', borderColor: '#3c3c3c' }}>
                  {LANGUAGES.map(lang => (
                    <button key={lang.id} onClick={() => { setLanguage(lang.id); setShowLangMenu(false); }}
                      className="w-full flex items-center gap-2 px-3 py-2 hover:bg-opacity-50 transition-colors"
                      style={{ backgroundColor: language === lang.id ? '#007acc' : 'transparent', color: language === lang.id ? '#ffffff' : '#cccccc' }}>
                      <span className="text-sm font-medium">{lang.icon}</span>
                      <span className="text-sm">{lang.name}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button onClick={handleExportCode} className="flex items-center gap-1.5 px-2.5 py-1.5 rounded hover:bg-opacity-50 transition-colors"
              style={{ backgroundColor: 'transparent', color: '#cccccc' }} title="导出代码">
              <Icon name="Download" className="w-4 h-4" />
              <span className="text-sm">导出</span>
            </button>
            <button onClick={handleImportCode} className="flex items-center gap-1.5 px-2.5 py-1.5 rounded hover:bg-opacity-50 transition-colors"
              style={{ backgroundColor: 'transparent', color: '#cccccc' }} title="导入代码">
              <Icon name="Upload" className="w-4 h-4" />
              <span className="text-sm">导入</span>
            </button>
          </div>
          <div className="flex items-center gap-3">
            <button onClick={runCode} disabled={isRunning}
              className="flex items-center gap-2 px-5 py-2 rounded-lg font-medium transition-all"
              style={{ backgroundColor: isRunning ? '#3c3c3c' : '#007acc', color: 'white', opacity: isRunning ? 0.6 : 1 }}>
              {isRunning ? (
                <>
                  <div className="w-3 h-3 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                  <span>运行中</span>
                </>
              ) : (
                <>
                  <Icon name="Play" className="w-4 h-4" />
                  <span>运行</span>
                </>
              )}
            </button>
            {isRunning && (
              <button onClick={stopCode} className="p-2 rounded-lg transition-all"
                style={{ backgroundColor: '#3c3c3c', color: '#f14c4c' }} title="停止运行">
                <Icon name="Square" className="w-4 h-4" />
              </button>
            )}
            <button onClick={resetCode} className="p-2 rounded hover:bg-opacity-50 transition-colors"
              style={{ backgroundColor: 'transparent', color: '#cccccc' }} title="重置代码">
              <Icon name="RefreshCw" className="w-4 h-4" />
            </button>
            <button onClick={clearOutput} className="p-2 rounded hover:bg-opacity-50 transition-colors"
              style={{ backgroundColor: 'transparent', color: '#cccccc' }} title="清空输出">
              <Icon name="Trash2" className="w-4 h-4" />
            </button>
            <div className="h-6 w-px" style={{ backgroundColor: '#3c3c3c' }} />
            <button onClick={() => setHistoryPanelOpen(!historyPanelOpen)}
              className="p-2 rounded hover:bg-opacity-50 transition-colors"
              style={{ backgroundColor: historyPanelOpen ? '#007acc' : 'transparent', color: historyPanelOpen ? '#ffffff' : '#cccccc' }} title="历史记录">
              <Icon name="History" className="w-4 h-4" />
            </button>
            <button onClick={() => setDebugPanelOpen(!debugPanelOpen)}
              className="p-2 rounded hover:bg-opacity-50 transition-colors"
              style={{ backgroundColor: debugPanelOpen ? '#007acc' : 'transparent', color: debugPanelOpen ? '#ffffff' : '#cccccc' }} title="调试面板">
              <Icon name="Bug" className="w-4 h-4" />
            </button>
            <button onClick={toggleTheme} className="p-2 rounded hover:bg-opacity-50 transition-colors"
              style={{ backgroundColor: 'transparent', color: '#cccccc' }} title="切换主题">
              <Icon name={theme === 'dark' ? 'Sun' : 'Moon'} className="w-4 h-4" />
            </button>
          </div>
        </header>
      );
    }
    function CodeEditor() {
      const { code, setCode, language, toggleBreakpoint, debug, syntaxTheme, setSyntaxTheme, autoSaveStatus } = useStore();
      const editorRef = useRef(null);
      const cmRef = useRef(null);
      const [showSearch, setShowSearch] = useState(false);
      const [searchText, setSearchText] = useState('');
      const [replaceText, setReplaceText] = useState('');
      const [lineNumbers, setLineNumbers] = useState(true);
      const [wordWrap, setWordWrap] = useState(true);
      const [currentLine, setCurrentLine] = useState(1);
      const [currentCol, setCurrentCol] = useState(1);
      const [cursorPos, setCursorPos] = useState({ line: 1, ch: 0 });
      const [showThemeMenu, setShowThemeMenu] = useState(false);
      const [showTemplateMenu, setShowTemplateMenu] = useState(false);

      const SYNTAX_THEMES = [
        { id: 'devcpp', name: 'DEV C++', colors: { bg: '#1e1e1e', text: '#d4d4d4', keyword: '#569cd6', string: '#ce9178', comment: '#6a9955', number: '#b5cea8', def: '#9cdcfe' } },
        { id: 'dracula', name: 'Dracula', colors: { bg: '#282a36', text: '#f8f8f2', keyword: '#ff79c6', string: '#f1fa8c', comment: '#6272a4', number: '#bd93f9', def: '#50fa7b' } },
        { id: 'monokai', name: 'Monokai', colors: { bg: '#272822', text: '#f8f8f2', keyword: '#f92672', string: '#e6db74', comment: '#75715e', number: '#ae81ff', def: '#a6e22e' } },
        { id: 'light', name: '浅色', colors: { bg: '#ffffff', text: '#000000', keyword: '#0000ff', string: '#a31515', comment: '#008000', number: '#098658', def: '#795e26' } },
      ];

      const CODE_TEMPLATES = [
        { id: 'if', name: 'if-else', desc: '条件判断', code: 'if (condition) {\n  // code here\n} else {\n  // code here\n}' },
        { id: 'for', name: 'for循环', desc: '计数循环', code: 'for (let i = 0; i < length; i++) {\n  // code here\n}' },
        { id: 'while', name: 'while循环', desc: '条件循环', code: 'while (condition) {\n  // code here\n}' },
        { id: 'function', name: '函数', desc: '函数定义', code: 'function name(params) {\n  // code here\n  return result;\n}' },
        { id: 'class', name: '类', desc: '类定义', code: 'class Name {\n  constructor() {\n    // code here\n  }\n  method() {\n    // code here\n  }\n}' },
        { id: 'try', name: 'try-catch', desc: '异常处理', code: 'try {\n  // code here\n} catch (error) {\n  // handle error\n}' },
        { id: 'array', name: '数组遍历', desc: 'forEach', code: 'array.forEach((item, index) => {\n  // code here\n});' },
        { id: 'console', name: '控制台输出', desc: 'log', code: 'console.log(value);' },
      ];

      const handleInsertTemplate = (template) => {
        if (!cmRef.current) return;
        const doc = cmRef.current.getDoc();
        const cursor = doc.getCursor();
        doc.replaceRange(template.code, cursor);
      };

      useEffect(() => {
        if (!editorRef.current) return;
        cmRef.current = CodeMirror(editorRef.current, {
          value: code,
          mode: LANGUAGES.find(l => l.id === language)?.mode || 'javascript',
          theme: syntaxTheme === 'devcpp' ? 'dracula' : syntaxTheme,
          lineNumbers: true,
          lineWrapping: true,
          autoCloseBrackets: true,
          matchBrackets: true,
          foldGutter: true,
          gutters: ['CodeMirror-linenumbers', 'breakpoint-gutter'],
          styleActiveLine: true,
          highlightActiveLineGutter: true,
          indentUnit: 4,
          tabSize: 4,
          indentWithTabs: false,
          lineSeparator: '\n',
          historyEventDelay: 125,
        });
        cmRef.current.on('change', (cm) => setCode(cm.getValue()));
        cmRef.current.on('gutterClick', (cm, line) => {
          const lineNum = line + 1;
          toggleBreakpoint(lineNum);
        });
        cmRef.current.on('cursorActivity', (cm) => {
          const cursor = cm.getCursor();
          setCurrentLine(cursor.line + 1);
          setCurrentCol(cursor.ch + 1);
          setCursorPos(cursor);
        });
        return () => {
          if (cmRef.current) {
            cmRef.current.toTextArea();
            cmRef.current = null;
          }
        };
      }, []);

      useEffect(() => {
        if (!cmRef.current) return;
        cmRef.current.setOption('mode', LANGUAGES.find(l => l.id === language)?.mode || 'javascript');
      }, [language]);

      useEffect(() => {
        if (!cmRef.current) return;
        if (code !== cmRef.current.getValue()) {
          cmRef.current.setValue(code);
        }
      }, [code]);

      useEffect(() => {
        if (!cmRef.current) return;
        const gutters = cmRef.current.getDoc().eachLine((line, i) => {
          const hasBreakpoint = debug.breakpoints.find(b => b.line === i + 1);
          const gutter = cmRef.current.setGutterMarker(line, 'breakpoint-gutter', hasBreakpoint ? document.createElement('div') : null);
          if (hasBreakpoint && gutter) {
            gutter.className = 'breakpoint';
          }
        });
      }, [debug.breakpoints]);

      useEffect(() => {
        if (!cmRef.current) return;
        cmRef.current.setOption('lineNumbers', lineNumbers);
      }, [lineNumbers]);

      useEffect(() => {
        if (!cmRef.current) return;
        cmRef.current.setOption('lineWrapping', wordWrap);
      }, [wordWrap]);

      useEffect(() => {
        if (!cmRef.current) return;
        cmRef.current.setOption('theme', syntaxTheme === 'devcpp' ? 'dracula' : syntaxTheme);
        const themeData = SYNTAX_THEMES.find(t => t.id === syntaxTheme);
        if (themeData) {
          const editorEl = cmRef.current.getWrapperElement();
          editorEl.style.setProperty('--editor-bg', themeData.colors.bg);
          editorEl.style.setProperty('--editor-text', themeData.colors.text);
          editorEl.style.setProperty('--editor-keyword', themeData.colors.keyword);
          editorEl.style.setProperty('--editor-string', themeData.colors.string);
          editorEl.style.setProperty('--editor-comment', themeData.colors.comment);
          editorEl.style.setProperty('--editor-number', themeData.colors.number);
          editorEl.style.setProperty('--editor-def', themeData.colors.def);
        }
      }, [syntaxTheme]);

      const handleUndo = () => cmRef.current?.undo();
      const handleRedo = () => cmRef.current?.redo();
      const handleCopy = () => cmRef.current?.copy();
      const handleCut = () => cmRef.current?.cut();
      const handlePaste = () => cmRef.current?.paste();
      const handleSelectAll = () => cmRef.current?.execCommand('selectAll');
      const handleFind = () => {
        setShowSearch(true);
        setTimeout(() => document.querySelector('.search-modal input')?.focus(), 50);
      };
      const handleSearch = () => {
        if (!searchText || !cmRef.current) return;
        const cursor = cmRef.current.getCursor();
        const result = cmRef.current.getSearchCursor(searchText, cursor);
        if (result.findNext()) {
          cmRef.current.setSelection(result.from(), result.to());
          cmRef.current.scrollIntoView(result.from(), 20);
        } else {
          alert('未找到匹配内容');
        }
      };
      const handleReplace = () => {
        if (!searchText || !cmRef.current) return;
        const cursor = cmRef.current.getSearchCursor(searchText);
        if (cursor.findNext()) {
          cursor.replace(replaceText);
        }
      };
      const handleReplaceAll = () => {
        if (!searchText || !cmRef.current) return;
        let count = 0;
        const cursor = cmRef.current.getSearchCursor(searchText);
        while (cursor.findNext()) {
          cursor.replace(replaceText);
          count++;
        }
        alert(`已替换 ${count} 处`);
      };
      const handleFormat = () => {
        if (!cmRef.current) return;
        const doc = cmRef.current.getDoc();
        const text = doc.getValue();
        const lines = text.split('\n');
        let formatted = '';
        let indent = 0;
        const indentStr = '    ';
        lines.forEach(line => {
          const trimmed = line.trim();
          if (trimmed.endsWith('{') || trimmed.endsWith('(')) {
            formatted += indentStr.repeat(indent) + trimmed + '\n';
            indent++;
          } else if (trimmed === '}' || trimmed === ')') {
            indent = Math.max(0, indent - 1);
            formatted += indentStr.repeat(indent) + trimmed + '\n';
          } else {
            formatted += indentStr.repeat(indent) + trimmed + '\n';
          }
        });
        doc.setValue(formatted.trim());
      };
      const handleComment = () => {
        if (!cmRef.current) return;
        cmRef.current.toggleComment();
      };
      const handleIndent = () => {
        if (!cmRef.current) return;
        cmRef.current.execCommand('indentMore');
      };
      const handleUnindent = () => {
        if (!cmRef.current) return;
        cmRef.current.execCommand('indentLess');
      };
      const handleGoToLine = () => {
        const line = prompt('跳转到行号:', currentLine);
        if (line && cmRef.current) {
          const num = parseInt(line);
          if (!isNaN(num) && num > 0) {
            cmRef.current.setCursor(num - 1, 0);
            cmRef.current.scrollIntoView({ line: num - 1, ch: 0 }, 20);
          }
        }
      };
      const handleFoldAll = () => {
        if (!cmRef.current) return;
        cmRef.current.foldCode(CodeMirror.Pos(0, 0), { rangeFinder: CodeMirror.fold.brace });
        cmRef.current.getDoc().eachLine((line, i) => {
          if (line.text.includes('{')) {
            cmRef.current.foldCode(CodeMirror.Pos(i, 0));
          }
        });
      };
      const handleUnfoldAll = () => {
        if (!cmRef.current) return;
        cmRef.current.getDoc().eachLine((line, i) => {
          cmRef.current.unfoldCode(CodeMirror.Pos(i, 0));
        });
      };
      const handleDuplicateLine = () => {
        if (!cmRef.current) return;
        const doc = cmRef.current.getDoc();
        const cursor = doc.getCursor();
        const line = doc.getLine(cursor.line);
        doc.replaceRange(line + '\n', CodeMirror.Pos(cursor.line + 1, 0));
        cmRef.current.setCursor(cursor.line + 1, cursor.ch);
      };
      const handleDeleteLine = () => {
        if (!cmRef.current) return;
        const doc = cmRef.current.getDoc();
        const cursor = doc.getCursor();
        const lineCount = doc.lineCount();
        if (lineCount > 1) {
          doc.removeLine(cursor.line);
          if (cursor.line >= lineCount - 1) {
            cmRef.current.setCursor(cursor.line - 1, 0);
          }
        }
      };
      const handleMoveLineUp = () => {
        if (!cmRef.current) return;
        const doc = cmRef.current.getDoc();
        const cursor = doc.getCursor();
        if (cursor.line > 0) {
          const line = doc.getLine(cursor.line);
          doc.removeLine(cursor.line);
          doc.replaceRange(line + '\n', CodeMirror.Pos(cursor.line - 1, 0));
          cmRef.current.setCursor(cursor.line - 1, cursor.ch);
        }
      };
      const handleMoveLineDown = () => {
        if (!cmRef.current) return;
        const doc = cmRef.current.getDoc();
        const cursor = doc.getCursor();
        const lineCount = doc.lineCount();
        if (cursor.line < lineCount - 1) {
          const line = doc.getLine(cursor.line);
          doc.removeLine(cursor.line);
          doc.replaceRange(line + '\n', CodeMirror.Pos(cursor.line + 1, 0));
          cmRef.current.setCursor(cursor.line + 1, cursor.ch);
        }
      };

      const lineCount = code.split('\n').length;
      const wordCount = code.trim() ? code.trim().split(/\s+/).length : 0;
      const charCount = code.length;

      return (
        <div className="flex flex-col h-full" style={{ backgroundColor: 'var(--bg-secondary)' }}>
          <div className="editor-toolbar">
            <button onClick={handleUndo} title="撤销 (Ctrl+Z)">
              <Icon name="Undo" className="w-4 h-4" />
            </button>
            <button onClick={handleRedo} title="重做 (Ctrl+Y)">
              <Icon name="Redo" className="w-4 h-4" />
            </button>
            <div className="divider" />
            <button onClick={handleCut} title="剪切 (Ctrl+X)">
              <Icon name="Scissors" className="w-4 h-4" />
            </button>
            <button onClick={handleCopy} title="复制 (Ctrl+C)">
              <Icon name="Copy" className="w-4 h-4" />
            </button>
            <button onClick={handlePaste} title="粘贴 (Ctrl+V)">
              <Icon name="Clipboard" className="w-4 h-4" />
            </button>
            <button onClick={handleSelectAll} title="全选 (Ctrl+A)">
              <Icon name="Select" className="w-4 h-4" />
            </button>
            <div className="divider" />
            <button onClick={handleFind} title="查找 (Ctrl+F)">
              <Icon name="Search" className="w-4 h-4" />
            </button>
            <button onClick={handleGoToLine} title="跳转到行 (Ctrl+G)">
              <Icon name="ArrowRight" className="w-4 h-4" />
              <span>Ln</span>
            </button>
            <div className="divider" />
            <button onClick={handleIndent} title="增加缩进 (Tab)">
              <Icon name="Indent" className="w-4 h-4" />
            </button>
            <button onClick={handleUnindent} title="减少缩进 (Shift+Tab)">
              <Icon name="Unindent" className="w-4 h-4" />
            </button>
            <button onClick={handleComment} title="注释/取消注释 (Ctrl+/)">
              <Icon name="Comment" className="w-4 h-4" />
            </button>
            <button onClick={handleFormat} title="格式化代码">
              <Icon name="Format" className="w-4 h-4" />
            </button>
            <button onClick={handleFoldAll} title="折叠全部">
              <Icon name="Fold" className="w-4 h-4" />
            </button>
            <button onClick={handleUnfoldAll} title="展开全部">
              <Icon name="Unfold" className="w-4 h-4" />
            </button>
            <div className="divider" />
            <button onClick={handleDuplicateLine} title="复制当前行">
              <Icon name="Duplicate" className="w-4 h-4" />
            </button>
            <button onClick={handleDeleteLine} title="删除当前行">
              <Icon name="Delete" className="w-4 h-4" />
            </button>
            <button onClick={handleMoveLineUp} title="上移当前行">
              <Icon name="ArrowUp" className="w-4 h-4" />
            </button>
            <button onClick={handleMoveLineDown} title="下移当前行">
              <Icon name="ArrowDown" className="w-4 h-4" />
            </button>
            <div className="divider" />
            <button onClick={() => setLineNumbers(!lineNumbers)} className={lineNumbers ? 'active' : ''} title="显示行号">
              <Icon name="List" className="w-4 h-4" />
            </button>
            <button onClick={() => setWordWrap(!wordWrap)} className={wordWrap ? 'active' : ''} title="自动换行">
              <Icon name="Wrap" className="w-4 h-4" />
            </button>
            <div className="divider" />
            <div className="relative" data-theme-menu>
              <button onClick={() => setShowThemeMenu(!showThemeMenu)} className="flex items-center gap-1.5 px-2 py-1.5 rounded-md text-sm hover:bg-opacity-50 transition-colors"
                style={{ backgroundColor: 'var(--bg-tertiary)', color: 'var(--text-secondary)' }} title="语法主题">
                <span>{SYNTAX_THEMES.find(t => t.id === syntaxTheme)?.name}</span>
                <Icon name="ChevronDown" className="w-3 h-3" />
              </button>
              {showThemeMenu && (
                <div className="absolute bottom-full right-0 mb-2 w-36 rounded-lg border shadow-lg z-50 animate-scale-in"
                  style={{ backgroundColor: 'var(--bg-card)', borderColor: 'var(--border-color)' }}>
                  {SYNTAX_THEMES.map(theme => (
                    <button key={theme.id} onClick={() => { setSyntaxTheme(theme.id); setShowThemeMenu(false); }}
                      className="w-full flex items-center gap-2 px-3 py-2 hover:bg-opacity-50 transition-colors"
                      style={{ backgroundColor: syntaxTheme === theme.id ? 'var(--accent-primary-dim)' : 'transparent' }}>
                      <div className="flex gap-0.5">
                        <span className="w-3 h-3 rounded-full" style={{ backgroundColor: theme.colors.bg }} />
                        <span className="w-3 h-3 rounded-full" style={{ backgroundColor: theme.colors.keyword }} />
                        <span className="w-3 h-3 rounded-full" style={{ backgroundColor: theme.colors.string }} />
                        <span className="w-3 h-3 rounded-full" style={{ backgroundColor: theme.colors.comment }} />
                      </div>
                      <span className="text-sm" style={{ color: 'var(--text-primary)' }}>{theme.name}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            <div className="divider" />
            <div className="relative" data-template-menu>
              <button onClick={() => setShowTemplateMenu(!showTemplateMenu)} className="flex items-center gap-1.5 px-2 py-1.5 rounded-md text-sm hover:bg-opacity-50 transition-colors"
                style={{ backgroundColor: 'var(--bg-tertiary)', color: 'var(--text-secondary)' }} title="代码模板">
                <Icon name="Template" className="w-3 h-3" />
                <span>模板</span>
                <Icon name="ChevronDown" className="w-3 h-3" />
              </button>
              {showTemplateMenu && (
                <div className="absolute bottom-full right-0 mb-2 w-48 rounded-lg border shadow-lg z-50 animate-scale-in"
                  style={{ backgroundColor: 'var(--bg-card)', borderColor: 'var(--border-color)' }}>
                  {CODE_TEMPLATES.map(template => (
                    <button key={template.id} onClick={() => { handleInsertTemplate(template); setShowTemplateMenu(false); }}
                      className="w-full flex items-start gap-2 px-3 py-2 hover:bg-opacity-50 transition-colors text-left"
                      style={{ backgroundColor: 'transparent' }}>
                      <span className="text-sm font-medium" style={{ color: 'var(--text-primary)' }}>{template.name}</span>
                      <span className="text-xs" style={{ color: 'var(--text-muted)' }}>{template.desc}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            <div className="flex-1" />
            <div className="code-stats">
              <span><Icon name="File" className="w-3 h-3" />{lineCount} 行</span>
              <span><Icon name="Type" className="w-3 h-3" />{wordCount} 词</span>
              <span><Icon name="Hash" className="w-3 h-3" />{charCount} 字符</span>
            </div>
          </div>
          <div className="flex-1 relative overflow-hidden">
            <div ref={editorRef} className="h-full" />
            {showSearch && (
              <div className="search-modal">
                <input
                  type="text"
                  value={searchText}
                  onChange={(e) => setSearchText(e.target.value)}
                  placeholder="查找..."
                  onKeyDown={(e) => e.key === 'Enter' && handleSearch()}
                />
                <input
                  type="text"
                  value={replaceText}
                  onChange={(e) => setReplaceText(e.target.value)}
                  placeholder="替换为..."
                />
                <div className="search-controls">
                  <div className="search-info">行 {currentLine}, 列 {currentCol}</div>
                  <div className="search-buttons">
                    <button onClick={handleSearch}>查找</button>
                    <button onClick={handleReplace}>替换</button>
                    <button onClick={handleReplaceAll}>全部替换</button>
                    <button className="primary" onClick={() => setShowSearch(false)}>关闭</button>
                  </div>
                </div>
              </div>
            )}
          </div>
          <div className="editor-statusbar">
            <div className="status-left">
              <span>{LANGUAGES.find(l => l.id === language)?.name || 'Unknown'}</span>
              <span>UTF-8</span>
              <span>Ln {currentLine}, Col {currentCol}</span>
              <span>{lineCount} 行</span>
              <span>{charCount} 字符</span>
            </div>
            <div className="status-right">
              <span style={{ color: autoSaveStatus === 'saved' ? '#569cd6' : '#d29922' }}>
                {autoSaveStatus === 'saved' ? '✓ 已保存' : '保存中...'}
              </span>
              <span>Tab: 4</span>
              <span>Spaces: 4</span>
              <span>CodePlay v1.0</span>
            </div>
          </div>
        </div>
      );
    }
    function OutputPanel() {
      const { output, activeTab, setActiveTab, isRunning, executionTime } = useStore();
      const tabs = [
        { id: 'output', name: '输出', icon: 'Terminal' },
        { id: 'problems', name: '问题', icon: 'AlertTriangle' },
      ];
      return (
        <div className="flex flex-col rounded-xl border overflow-hidden h-full animate-scale-in"
          style={{ backgroundColor: 'var(--bg-card)', borderColor: 'var(--border-color)', boxShadow: 'var(--shadow-lg)' }}>
          <div className="flex items-center justify-between px-4 py-3 border-b"
            style={{ backgroundColor: 'var(--bg-secondary)', borderColor: 'var(--border-color)' }}>
            <div className="flex items-center gap-1">
              {tabs.map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-medium transition-colors"
                  style={{ backgroundColor: activeTab === tab.id ? 'var(--accent-primary-dim)' : 'transparent', color: activeTab === tab.id ? 'var(--accent-primary)' : 'var(--text-secondary)' }}>
                  <Icon name={tab.icon} className="w-3.5 h-3.5" />
                  {tab.name}
                </button>
              ))}
            </div>
            {executionTime !== null && (
              <div className="flex items-center gap-1.5 text-xs" style={{ color: 'var(--text-muted)' }}>
                <Icon name="Clock" className="w-3.5 h-3.5" />
                <span>{executionTime}ms</span>
              </div>
            )}
          </div>
          <div className="flex-1 overflow-auto scrollbar-thin p-4 font-mono text-sm" style={{ backgroundColor: 'var(--bg-secondary)' }}>
            {activeTab === 'output' ? (
              output.length === 0 ? (
                <div className="flex flex-col items-center justify-center h-full text-center" style={{ color: 'var(--text-muted)' }}>
                  <Icon name="Terminal" className="w-10 h-10 mb-3 opacity-30" />
                  <p className="text-sm">点击"运行"按钮执行代码</p>
                  <p className="text-xs mt-1">输出将显示在这里</p>
                </div>
              ) : (
                <div className="space-y-0.5">
                  {output.map((msg, i) => (
                    <div key={i} className={`output-${msg.type} whitespace-pre-wrap break-all`}>
                      {msg.content}
                    </div>
                  ))}
                </div>
              )
            ) : (
              <div className="flex flex-col items-center justify-center h-full text-center" style={{ color: 'var(--text-muted)' }}>
                <Icon name="CheckCircle2" className="w-10 h-10 mb-3 opacity-30" />
                <p className="text-sm">没有检测到问题</p>
              </div>
            )}
          </div>
          {isRunning && (
            <div className="px-4 py-2 border-t flex items-center gap-2"
              style={{ backgroundColor: 'var(--bg-secondary)', borderColor: 'var(--border-color)' }}>
              <div className="w-2 h-2 rounded-full animate-pulse" style={{ backgroundColor: 'var(--accent-primary)' }} />
              <span className="text-xs" style={{ color: 'var(--text-secondary)' }}>代码运行中...</span>
            </div>
          )}
        </div>
      );
    }
    function DebugPanel() {
      const { debug, debugPanelOpen, isRunning, runCode, stepOver, stepInto, stepOut, resumeExecution } = useStore();
      if (!debugPanelOpen) return null;
      return (
        <div className="flex flex-col rounded-xl border overflow-hidden h-full animate-scale-in"
          style={{ backgroundColor: 'var(--bg-card)', borderColor: 'var(--border-color)', boxShadow: 'var(--shadow-lg)' }}>
          <div className="flex items-center justify-between px-4 py-3 border-b"
            style={{ backgroundColor: 'var(--bg-secondary)', borderColor: 'var(--border-color)' }}>
            <div className="flex items-center gap-2">
              <div className="p-1.5 rounded-lg" style={{ backgroundColor: 'var(--accent-primary-dim)' }}>
                <Icon name="Bug" className="w-4 h-4" style={{ color: 'var(--accent-primary)' }} />
              </div>
              <div>
                <h3 className="text-sm font-semibold" style={{ color: 'var(--text-primary)' }}>调试器</h3>
                <p className="text-[11px]" style={{ color: 'var(--text-muted)' }}>
                  {debug.isPaused ? '已暂停' : isRunning ? '运行中' : '未启动'}
                </p>
              </div>
            </div>
            <div className="flex items-center gap-1">
              {!isRunning ? (
                <button onClick={runCode} className="p-2 rounded-lg transition-colors"
                  style={{ backgroundColor: 'var(--accent-primary)', color: 'white' }} title="开始调试">
                  <Icon name="Play" className="w-4 h-4" />
                </button>
              ) : debug.isPaused ? (
                <>
                  <button onClick={stepOver} className="p-2 rounded-lg transition-colors"
                    style={{ backgroundColor: 'var(--bg-tertiary)', color: 'var(--text-secondary)' }} title="单步跳过">
                    <Icon name="ArrowRight" className="w-4 h-4" />
                  </button>
                  <button onClick={stepInto} className="p-2 rounded-lg transition-colors"
                    style={{ backgroundColor: 'var(--bg-tertiary)', color: 'var(--text-secondary)' }} title="单步进入">
                    <Icon name="ArrowDownToLine" className="w-4 h-4" />
                  </button>
                  <button onClick={stepOut} className="p-2 rounded-lg transition-colors"
                    style={{ backgroundColor: 'var(--bg-tertiary)', color: 'var(--text-secondary)' }} title="单步退出">
                    <Icon name="ArrowUpFromLine" className="w-4 h-4" />
                  </button>
                  <button onClick={resumeExecution} className="p-2 rounded-lg transition-colors"
                    style={{ backgroundColor: 'var(--accent-success)', color: 'white' }} title="继续执行">
                    <Icon name="Play" className="w-4 h-4" />
                  </button>
                </>
              ) : null}
            </div>
          </div>
          <div className="flex-1 overflow-auto scrollbar-thin p-4 space-y-4">
            <div>
              <h4 className="text-xs font-medium mb-2" style={{ color: 'var(--text-muted)' }}>变量</h4>
              {debug.variables.length === 0 ? (
                <p className="text-xs" style={{ color: 'var(--text-dim)' }}>暂无变量</p>
              ) : (
                <div className="space-y-1">
                  {debug.variables.map((v, i) => (
                    <div key={i} className="flex items-center gap-2 px-2 py-1 rounded" style={{ backgroundColor: 'var(--bg-secondary)' }}>
                      <span className="text-xs font-mono" style={{ color: 'var(--accent-purple)' }}>{v.name}</span>
                      <span className="text-xs" style={{ color: 'var(--text-dim)' }}>=</span>
                      <span className="text-xs font-mono" style={{ color: 'var(--accent-success)' }}>
                        {typeof v.value === 'object' ? JSON.stringify(v.value) : v.value}
                      </span>
                      <span className="text-[10px] px-1.5 py-0.5 rounded ml-auto" style={{ backgroundColor: 'var(--accent-primary-dim)', color: 'var(--accent-primary)' }}>
                        {v.type}
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div>
              <h4 className="text-xs font-medium mb-2" style={{ color: 'var(--text-muted)' }}>调用栈</h4>
              {debug.callStack.length === 0 ? (
                <p className="text-xs" style={{ color: 'var(--text-dim)' }}>暂无调用栈</p>
              ) : (
                <div className="space-y-1">
                  {debug.callStack.map((frame, i) => (
                    <div key={i} className="flex items-center gap-2 px-2 py-1 rounded text-xs font-mono"
                      style={{ backgroundColor: i === debug.callStack.length - 1 ? 'var(--accent-primary-dim)' : 'var(--bg-secondary)', color: 'var(--text-secondary)' }}>
                      <Icon name="Circle" className="w-2 h-2" style={{ color: i === debug.callStack.length - 1 ? 'var(--accent-primary)' : 'var(--text-dim)' }} />
                      {frame}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }
    function HistoryPanel() {
      const { history, loadFromHistory, deleteHistory, clearHistory, historyPanelOpen, language, setLanguage } = useStore();
      const [searchTerm, setSearchTerm] = useState('');
      if (!historyPanelOpen) return null;
      const filteredHistory = history.filter(item => {
        const matchesSearch = searchTerm === '' || item.code.toLowerCase().includes(searchTerm.toLowerCase());
        return matchesSearch;
      });
      const formatTime = (timestamp) => {
        const date = new Date(timestamp);
        const now = new Date();
        const diff = now.getTime() - date.getTime();
        if (diff < 60000) return '刚刚';
        if (diff < 3600000) return `${Math.floor(diff / 60000)}分钟前`;
        if (diff < 86400000) return `${Math.floor(diff / 3600000)}小时前`;
        return `${date.getMonth() + 1}/${date.getDate()}`;
      };
      return (
        <div className="flex flex-col rounded-xl border overflow-hidden h-full animate-scale-in"
          style={{ backgroundColor: 'var(--bg-card)', borderColor: 'var(--border-color)', boxShadow: 'var(--shadow-lg)' }}>
          <div className="flex items-center justify-between px-4 py-3 border-b"
            style={{ backgroundColor: 'var(--bg-secondary)', borderColor: 'var(--border-color)' }}>
            <div>
              <h3 className="text-sm font-semibold" style={{ color: 'var(--text-primary)' }}>历史记录</h3>
              <p className="text-[11px]" style={{ color: 'var(--text-muted)' }}>{filteredHistory.length} / {history.length} 条</p>
            </div>
            <button onClick={clearHistory} className="p-1.5 rounded-md hover:bg-opacity-50 transition-colors"
              style={{ backgroundColor: 'var(--bg-tertiary)', color: 'var(--text-secondary)' }} title="清空历史">
              <Icon name="Trash2" className="w-4 h-4" />
            </button>
          </div>
          <div className="flex-1 overflow-auto scrollbar-thin">
            {filteredHistory.length === 0 ? (
              <div className="flex flex-col items-center justify-center h-full text-center p-4" style={{ color: 'var(--text-muted)' }}>
                <Icon name="History" className="w-10 h-10 mb-3 opacity-30" />
                <p className="text-sm">暂无历史记录</p>
                <p className="text-xs mt-1">运行代码后将自动保存到这里</p>
              </div>
            ) : (
              <div className="p-2 space-y-1">
                {filteredHistory.map(item => (
                  <div key={item.id} className="group p-2 rounded-lg hover:bg-opacity-50 transition-colors cursor-pointer"
                    style={{ backgroundColor: 'var(--bg-secondary)' }} onClick={() => { loadFromHistory(item.id); }}>
                    <div className="flex items-center justify-between mb-1">
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-medium px-1.5 py-0.5 rounded"
                          style={{ backgroundColor: 'var(--accent-primary-dim)', color: 'var(--accent-primary)' }}>
                          {LANGUAGES.find(l => l.id === item.language)?.icon}
                        </span>
                        <span className="text-xs" style={{ color: 'var(--text-secondary)' }}>
                          {LANGUAGES.find(l => l.id === item.language)?.name}
                        </span>
                      </div>
                      <button onClick={(e) => { e.stopPropagation(); deleteHistory(item.id); }}
                        className="p-1 rounded opacity-0 group-hover:opacity-100 transition-opacity"
                        style={{ backgroundColor: 'var(--accent-error-dim)', color: 'var(--accent-error)' }}>
                        <Icon name="X" className="w-3 h-3" />
                      </button>
                    </div>
                    <p className="text-xs font-mono line-clamp-2" style={{ color: 'var(--text-muted)' }}>
                      {item.code.trim().replace(/\n/g, ' ')}
                    </p>
                    <div className="flex items-center justify-between mt-1">
                      <span className="text-[10px]" style={{ color: 'var(--text-dim)' }}>{formatTime(item.updatedAt)}</span>
                      {item.executionTime && (
                        <span className="text-[10px]" style={{ color: 'var(--text-dim)' }}>{item.executionTime}ms</span>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }
    function App() {
      const { runCode, isRunning, resetCode, clearOutput, toggleTheme } = useStore();
      useEffect(() => {
        const handleKeyDown = (e) => {
          const target = e.target;
          const isInput = target.tagName === 'INPUT' || target.tagName === 'TEXTAREA';
          if (e.ctrlKey || e.metaKey) {
            switch (e.key.toLowerCase()) {
              case 'enter':
                if (!isInput && !isRunning) {
                  e.preventDefault();
                  runCode();
                }
                break;
              case 's':
                e.preventDefault();
                break;
              case 'r':
                if (!isInput && e.shiftKey) {
                  e.preventDefault();
                  resetCode();
                }
                break;
              case 'l':
                if (!isInput) {
                  e.preventDefault();
                  toggleTheme();
                }
                break;
              case 'b':
                if (!isInput && !isRunning) {
                  e.preventDefault();
                  runCode();
                }
                break;
            }
          }
          if (e.key === 'Escape') {
            clearOutput();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [runCode, resetCode, clearOutput, toggleTheme, isRunning]);
      return (
        <div className="h-screen w-screen flex flex-col overflow-hidden" style={{ backgroundColor: 'var(--bg-primary)' }}>
          <Header />
          <main className="flex-1 flex overflow-hidden p-3 gap-3">
            <div className="w-64 flex-shrink-0 hidden lg:block">
              <HistoryPanel />
            </div>
            <div className="flex-1 flex flex-col min-w-0 gap-3">
              <div className="flex-1 rounded-xl border overflow-hidden"
                style={{ backgroundColor: 'var(--bg-card)', borderColor: 'var(--border-color)' }}>
                <CodeEditor />
              </div>
              <div className="h-72">
                <OutputPanel />
              </div>
            </div>
            <div className="w-64 flex-shrink-0 hidden xl:block">
              <DebugPanel />
            </div>
          </main>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StoreProvider><App /></StoreProvider>);
  </script>
</body>
</html>
