  }
  .generate-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(124, 58, 237, 0.4);

    transform: translateY(0);

  /* Loading */
  .loading-area {
    text-align: center;
    padding: 40px 20px;

  .loading-area.show {
    display: block;

  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid var(--rule);
    border-top-color: var(--accent);

  @keyframes spin {
    to { transform: rotate(360deg); }

  .results-area {

  .results-area.show {
    display: block;
  }
  .result-card {
    background: var(--bg2);
    border-radius: 14px;

  }

    display: flex;

  }

    font-size: 14px;

  }
  .score-comment {
    font-size: 13px;

    margin-left: 82px;
  }
  .copy-btn {
    background: var(--accent-light);
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s ease;
  }
  .copy-btn:hover {
    background: var(--accent);
    color: white;
  }

  /* Score colors */
  .score-low { color: #22c55e; }
  .score-low .score-bar-fill { background: linear-gradient(90deg, #22c55e, #4ade80); }
  .score-mid { color: #f59e0b; }
  .score-mid .score-bar-fill { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
  .score-high { color: #f97316; }
  .score-high .score-bar-fill { background: linear-gradient(90deg, #f97316, #fb923c); }
  .score-extreme { color: #ef4444; }
  .score-extreme .score-bar-fill { background: linear-gradient(90deg, #ef4444, #f87171); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--ink);
    color: white;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 1000;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Footer tip */
  .footer-tip {
    text-align: center;
    margin-top: 24px;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent2-light) 100%);
    border-radius: 12px;
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>📸 装X指数评估器</h1>
    <p class="subtitle">发朋友圈之前，先让 AI 帮你把把关</p>
  </div>

  <!-- Upload Section -->
  <div class="card">
    <div class="card-title">🖼️ 上传你的照片</div>
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📤</div>
      <div class="upload-text">点击上传图片</div>
      <div class="upload-hint">支持 JPG、PNG 格式</div>
      <img class="upload-preview" id="uploadPreview" alt="预览">
    </div>
    <input type="file" id="fileInput" accept="image/*">
    <div style="margin-top: 14px; font-size: 13px; color: var(--muted); font-weight: 500;">或者选择示例：</div>
    <div class="sample-grid">
      <div class="sample-item" data-sample="beach">
        <div class="sample-emoji">🏖️</div>
        <div class="sample-label">海滩度假</div>
      </div>
      <div class="sample-item" data-sample="gym">
        <div class="sample-emoji">🏋️</div>
        <div class="sample-label">健身自拍</div>
      </div>
      <div class="sample-item" data-sample="coffee">
        <div class="sample-emoji">☕</div>
        <div class="sample-label">咖啡摆拍</div>
      </div>
    </div>
  </div>

  <!-- Style Section -->
  <div class="card">
    <div class="card-title">🎨 选择文案风格</div>
    <div class="style-grid">
      <div class="style-btn" data-style="versailles">
        <span class="style-emoji">😎</span>
        凡尔赛
      </div>
      <div class="style-btn" data-style="funny">
        <span class="style-emoji">🤣</span>
        搞笑
      </div>
      <div class="style-btn" data-style="artistic">
        <span class="style-emoji">🎨</span>
        文艺
      </div>
      <div class="style-btn" data-style="lowkey">
        <span class="style-emoji">🙈</span>
        低调
      </div>
    </div>
  </div>

  <!-- Generate Button -->
  <button class="generate-btn" id="generateBtn">✨ 生成文案 & 评估装X指数</button>

  <!-- Loading -->
  <div class="loading-area" id="loadingArea">
    <div class="spinner"></div>
    <div class="loading-text">AI 正在分析你的照片气质…</div>
  </div>

  <!-- Results -->
  <div class="results-area" id="resultsArea">
    <div class="card-title">🎯 生成结果</div>
    <div id="resultsList"></div>
  </div>

  <!-- Footer Tip -->
  <div class="footer-tip" id="footerTip"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // Mock Data
  const mockData = {
    versailles: [
      { text: "其实也就是随手一拍，没想到能拍出这种效果…iPhone 原相机而已啦 📱", score: 85 },
      { text: "这个海滩真的很一般，但既然来了就凑合拍一张吧（修图半小时）", score: 92 },
      { text: "朋友非要说这张很有氛围感，我觉得就还好吧，随便穿的 🥱", score: 78 }
    ],
    funny: [
      { text: "P 图两小时，拍照三秒钟，朋友圈营业完毕 🫡", score: 45 },
      { text: "今天的汗水量大概有 3 瓶可乐那么多 💦", score: 38 },
      { text: "发朋友圈前：我是全世界最靓的仔。发完后：怎么才 3 个赞？？", score: 55 }
    ],
    artistic: [
      { text: "海浪是地球的呼吸，而我是那个恰好路过的人 🌊", score: 72 },
      { text: "咖啡的香气里，藏着一个下午的放空 ☕", score: 68 },
      { text: "夕阳把影子拉得很长，像时间在这一刻放慢了脚步 🌅", score: 75 }
    ],
    lowkey: [
      { text: "今天天气不错 ☀️", score: 8 },
      { text: "周末愉快 🎈", score: 12 },
      { text: "出来走走 🚶", score: 15 }
    ]
  };

  const tips = [
    "装X有风险，文案需谨慎 😂",
    "适度装X，人人有责 🤝",
    "真正的装X，是让别人看不出你在装X 😏",
    "朋友圈如战场，文案是武器 ⚔️",
    "装X指数超过 80 建议谨慎发布 ⚠️"
  ];

  // State
  let selectedSample = null;
  let selectedStyle = null;
  let uploadedImage = null;

  // Elements
  const uploadArea = document.getElementById('uploadArea');
  const fileInput = document.getElementById('fileInput');
  const uploadPreview = document.getElementById('uploadPreview');
  const sampleItems = document.querySelectorAll('.sample-item');
  const styleBtns = document.querySelectorAll('.style-btn');
  const generateBtn = document.getElementById('generateBtn');
  const loadingArea = document.getElementById('loadingArea');
  const resultsArea = document.getElementById('resultsArea');
  const resultsList = document.getElementById('resultsList');
  const toast = document.getElementById('toast');
  const footerTip = document.getElementById('footerTip');

  // Random tip
  footerTip.textContent = tips[Math.floor(Math.random() * tips.length)];

  // Upload
  uploadArea.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        uploadedImage = event.target.result;
        uploadPreview.src = uploadedImage;
        uploadPreview.style.display = 'block';
        uploadArea.classList.add('active');
        // Clear sample selection
        sampleItems.forEach(s => s.classList.remove('selected'));
        selectedSample = null;
      };
      reader.readAsDataURL(file);
    }
  });

  // Sample selection
  sampleItems.forEach(item => {
    item.addEventListener('click', () => {
      sampleItems.forEach(s => s.classList.remove('selected'));
      item.classList.add('selected');
      selectedSample = item.dataset.sample;
      // Clear upload
      uploadPreview.style.display = 'none';
      uploadArea.classList.remove('active');
      uploadedImage = null;
      fileInput.value = '';
    });
  });

  // Style selection
  styleBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      styleBtns.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedStyle = btn.dataset.style;
    });
  });

  // Generate
  generateBtn.addEventListener('click', () => {
    if (!selectedStyle) {
      showToast('请先选择一种文案风格！');
      return;
    }
    if (!selectedSample && !uploadedImage) {
      showToast('请先上传图片或选择示例！');
      return;
    }

    // Show loading
    loadingArea.classList.add('show');
    resultsArea.classList.remove('show');

    // Simulate delay
    setTimeout(() => {
      loadingArea.classList.remove('show');
      renderResults(mockData[selectedStyle]);
      resultsArea.classList.add('show');
    }, 1000);
  });

  // Render results
  function renderResults(data) {
    resultsList.innerHTML = '';
    data.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'result-card';
      
      let scoreClass = 'score-low';
      let scoreComment = '🙄 太低调了兄弟';
      if (item.score > 30) { scoreClass = 'score-mid'; scoreComment = '😏 装到位了'; }
      if (item.score > 60) { scoreClass = 'score-high'; scoreComment = '😂 凡尔赛本赛'; }
      if (item.score > 80) { scoreClass = 'score-extreme'; scoreComment = '🤯 装穿天花板了！'; }

      card.innerHTML = `
        <div class="result-text">${item.text}</div>
        <div class="score-section ${scoreClass}">
          <span class="score-label">装X指数</span>
          <div class="score-bar-bg">
            <div class="score-bar-fill" style="width: 0%"></div>
          </div>
          <span class="score-value">${item.score}</span>
        </div>
        <div class="score-comment ${scoreClass}">${scoreComment}</div>
        <button class="copy-btn" data-text="${item.text}">📋 一键复制</button>
      `;
      resultsList.appendChild(card);

      // Animate score bar
      setTimeout(() => {
        card.querySelector('.score-bar-fill').style.width = item.score + '%';
      }, 100 + index * 150);
    });

    // Add copy listeners
    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const text = btn.dataset.text;
        navigator.clipboard.writeText(text).then(() => {
          showToast('已复制到剪贴板！');
        }).catch(() => {
          // Fallback
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          showToast('已复制到剪贴板！');
        });
      });
    });
  }

  // Toast
  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2000);
  }
</script>
</body>
</html>
