<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>带薪拉屎 💩 让老板为你的如厕时光买单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #1a0e00;
  }

  /* ===== 背景层 ===== */
  #bg-canvas {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 50% 30%, #3d2400 0%, #1a0e00 60%, #000 100%);
  }
  #rain-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  /* ===== 通用屏幕 ===== */
  .screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px; opacity: 0; pointer-events: none;
    transition: opacity .5s ease;
  }
  .screen.active { opacity: 1; pointer-events: auto; }

  /* ===== 设置屏幕 ===== */
  .setup-card {
    width: 100%; max-width: 480px;
    background: linear-gradient(145deg, rgba(60,40,10,.92), rgba(30,18,2,.95));
    border: 2px solid rgba(255,200,80,.35);
    border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 80px rgba(255,180,40,.15) inset;
    backdrop-filter: blur(8px);
  }
  .logo {
    text-align: center; margin-bottom: 22px;
  }
  .logo .poop {
    font-size: 64px; display: inline-block;
    animation: wobble 2.4s ease-in-out infinite;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,.5));
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(-8deg) translateY(0); }
    25% { transform: rotate(6deg) translateY(-4px); }
    50% { transform: rotate(-4deg) translateY(0); }
    75% { transform: rotate(8deg) translateY(-2px); }
  }
  .logo h1 {
    font-size: 30px; font-weight: 900;
    background: linear-gradient(180deg, #fff5d0 0%, #ffd24a 40%, #b8860b 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px; margin-top: 6px;
  }
  .logo .sub {
    color: #c9a86a; font-size: 13px; margin-top: 6px;
    letter-spacing: 1px;
  }

  .mode-tabs {
    display: flex; gap: 8px; margin: 18px 0 14px;
    background: rgba(0,0,0,.3); padding: 4px; border-radius: 12px;
  }
  .mode-tab {
    flex: 1; padding: 10px; text-align: center;
    border-radius: 8px; cursor: pointer;
    color: #c9a86a; font-size: 14px; font-weight: 600;
    transition: all .25s;
  }
  .mode-tab.active {
    background: linear-gradient(180deg, #ffd24a, #b8860b);
    color: #1a0e00; box-shadow: 0 4px 12px rgba(255,200,80,.3);
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; color: #d9b87a; font-size: 12px;
    margin-bottom: 6px; letter-spacing: 1px;
  }
  .field input {
    width: 100%; padding: 12px 14px;
    background: rgba(0,0,0,.4);
    border: 1px solid rgba(255,200,80,.25);
    border-radius: 10px;
    color: #fff5d0; font-size: 18px; font-weight: 600;
    outline: none; transition: all .2s;
  }
  .field input:focus {
    border-color: #ffd24a;
    box-shadow: 0 0 0 3px rgba(255,210,74,.15);
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .hint {
    color: #8a7350; font-size: 11px; margin-top: -8px; margin-bottom: 14px;
    text-align: center;
  }

  .start-btn {
    width: 100%; padding: 14px;
    background: linear-gradient(180deg, #ffd24a 0%, #f0a500 50%, #b8860b 100%);
    border: none; border-radius: 12px;
    color: #1a0e00; font-size: 17px; font-weight: 900;
    letter-spacing: 2px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,180,40,.4), 0 0 0 2px rgba(255,255,255,.1) inset;
    transition: transform .15s, box-shadow .15s;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,180,40,.55); }
  .start-btn:active { transform: translateY(0); }

  /* ===== 计时屏幕 ===== */
  .timer-screen { color: #fff; }
  .top-bar {
    position: absolute; top: 20px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 12px;
  }
  .top-btn {
    padding: 8px 16px; font-size: 13px;
    background: rgba(40,24,4,.7);
    border: 1px solid rgba(255,200,80,.3);
    border-radius: 20px; color: #ffd24a;
    cursor: pointer; backdrop-filter: blur(6px);
    transition: all .2s;
  }
  .top-btn:hover { background: rgba(255,200,80,.2); }

  .rate-display {
    color: #c9a86a; font-size: 13px; margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .rate-display b { color: #ffd24a; }

  .amount-wrap {
    text-align: center; position: relative;
    padding: 10px 0;
  }
  /* 静态光晕（避免 filter 动画与每帧文本更新叠加导致重栅格化卡顿）*/
  .amount-wrap::after {
    content: ''; position: absolute; inset: -20px -40px;
    background: radial-gradient(ellipse at center, rgba(255,200,80,.18), transparent 70%);
    pointer-events: none; z-index: -1;
    border-radius: 50%;
  }
  .currency {
    font-size: 38px; color: #ffd24a;
    vertical-align: top; line-height: 1;
    margin-right: 4px; opacity: .85;
    text-shadow: 0 0 20px rgba(255,200,80,.5);
    font-variant-numeric: tabular-nums;
  }
  .money {
    font-size: 92px; font-weight: 900;
    line-height: 1; letter-spacing: -2px;
    background: linear-gradient(180deg, #fff8d6 0%, #ffe070 30%, #ffb400 65%, #b8860b 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 20px rgba(255,180,40,.4));
    display: inline;
    font-variant-numeric: tabular-nums;
  }
  .money-decimals {
    font-size: 48px; font-weight: 800;
    background: linear-gradient(180deg, #fff8d6 0%, #ffe070 30%, #ffb400 65%, #b8860b 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 16px rgba(255,180,40,.35));
    display: inline;
    font-variant-numeric: tabular-nums;
  }
  .money-mills {
    font-size: 28px; font-weight: 700;
    background: linear-gradient(180deg, #fff8d6 0%, #ffe070 30%, #ffb400 65%, #b8860b 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: .75; display: inline;
    font-variant-numeric: tabular-nums;
    margin-left: 2px;
  }

  /* 飞出的 +金额 提示 */
  .floating-gain {
    position: absolute;
    left: 50%; top: 40%;
    color: #ffe070;
    font-size: 26px; font-weight: 900;
    text-shadow: 0 0 14px rgba(255,200,80,.9), 0 2px 6px rgba(0,0,0,.5);
    pointer-events: none;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    animation: float-up 0.95s cubic-bezier(.2,.7,.3,1) forwards;
    z-index: 5;
  }
  @keyframes float-up {
    0%   { opacity: 0; transform: translate(-50%, 10px) scale(.5); }
    20%  { opacity: 1; transform: translate(-50%, -10px) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -80px) scale(.9); }
  }

  .time-display {
    margin-top: 14px;
    font-size: 22px; color: #d9b87a;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
  }

  .slogan {
    margin-top: 18px; padding: 8px 18px;
    background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,200,80,.2);
    border-radius: 20px;
    color: #ffe070; font-size: 14px;
    letter-spacing: 1px;
    transition: all .3s;
    max-width: 90vw; text-align: center;
  }

  .progress-label {
    width: min(420px, 80vw); margin-top: 18px;
    display: flex; justify-content: space-between;
    color: #c9a86a; font-size: 11px;
    letter-spacing: 1px;
  }
  .progress-label .next { color: #ffe070; font-weight: 700; }
  .progress-track {
    width: min(420px, 80vw); height: 6px;
    background: rgba(255,255,255,.08);
    border-radius: 3px; margin-top: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ffd24a, #ff8c00);
    border-radius: 3px;
    box-shadow: 0 0 12px rgba(255,180,40,.6);
    transition: width .3s;
  }

  .stop-btn {
    margin-top: 28px;
    padding: 14px 42px;
    background: linear-gradient(180deg, #ff6b4a 0%, #d04020 100%);
    border: none; border-radius: 30px;
    color: #fff; font-size: 16px; font-weight: 800;
    letter-spacing: 3px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,80,40,.4);
    transition: transform .15s;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .stop-btn:hover { transform: scale(1.05); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(255,80,40,.4); }
    50% { box-shadow: 0 8px 36px rgba(255,80,40,.7); }
  }

  .tips {
    position: absolute; bottom: 18px; left: 0; right: 0;
    text-align: center; color: #6a5638; font-size: 11px;
    letter-spacing: 1px;
  }
  .tips kbd {
    background: rgba(255,200,80,.15);
    padding: 2px 6px; border-radius: 4px;
    color: #c9a86a; font-family: monospace;
    border: 1px solid rgba(255,200,80,.2);
  }

  /* ===== 里程碑弹窗 ===== */
  .milestone {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(.5);
    z-index: 50; padding: 28px 40px;
    background: linear-gradient(145deg, #ffd24a, #b8860b);
    border-radius: 24px; text-align: center;
    box-shadow: 0 0 80px rgba(255,200,80,.6);
    opacity: 0; pointer-events: none;
    transition: all .5s cubic-bezier(.34,1.56,.64,1);
  }
  .milestone.show {
    opacity: 1; transform: translate(-50%, -50%) scale(1);
  }
  .milestone .icon { font-size: 56px; }
  .milestone .text {
    font-size: 22px; font-weight: 900; color: #1a0e00;
    margin-top: 8px; letter-spacing: 1px;
  }
  .milestone .amount {
    font-size: 32px; font-weight: 900; color: #d04020;
    margin-top: 6px;
  }

  /* ===== 结束屏幕 ===== */
  .result-card {
    width: 100%; max-width: 460px;
    background: linear-gradient(145deg, rgba(60,40,10,.95), rgba(30,18,2,.98));
    border: 2px solid rgba(255,200,80,.4);
    border-radius: 24px;
    padding: 36px 28px;
    box-shadow: 0 20px 80px rgba(0,0,0,.6), 0 0 100px rgba(255,180,40,.2) inset;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .result-card::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(255,200,80,.2), transparent 60%);
    pointer-events: none;
  }
  .crown { font-size: 56px; animation: wobble 2s ease-in-out infinite; }
  .congrats {
    font-size: 22px; font-weight: 900; margin-top: 8px;
    background: linear-gradient(180deg, #fff5d0, #ffd24a, #b8860b);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }
  .result-amount-wrap { margin: 22px 0; }
  .result-amount {
    font-size: 64px; font-weight: 900;
    background: linear-gradient(180deg, #fff8d6 0%, #ffe070 30%, #ffb400 65%, #b8860b 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 20px rgba(255,180,40,.5));
    line-height: 1;
  }
  .result-decimals {
    font-size: 34px; font-weight: 800;
    background: linear-gradient(180deg, #fff8d6 0%, #ffe070 30%, #ffb400 65%, #b8860b 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .result-msg {
    color: #d9b87a; font-size: 14px;
    line-height: 1.7; margin: 12px 0 20px;
  }
  .result-stats {
    display: flex; justify-content: space-around;
    margin: 16px 0 24px;
    padding: 14px 0;
    border-top: 1px solid rgba(255,200,80,.2);
    border-bottom: 1px solid rgba(255,200,80,.2);
  }
  .stat-item .v {
    font-size: 18px; font-weight: 800; color: #ffd24a;
  }
  .stat-item .l {
    font-size: 11px; color: #8a7350; margin-top: 4px;
    letter-spacing: 1px;
  }
  .result-btns { display: flex; gap: 10px; }
  .result-btns button {
    flex: 1; padding: 12px;
    border-radius: 10px; cursor: pointer;
    font-weight: 700; font-size: 14px;
    letter-spacing: 1px; transition: transform .15s;
  }
  .btn-primary {
    background: linear-gradient(180deg, #ffd24a, #b8860b);
    border: none; color: #1a0e00;
  }
  .btn-secondary {
    background: rgba(0,0,0,.3);
    border: 1px solid rgba(255,200,80,.3);
    color: #ffd24a;
  }
  .result-btns button:hover { transform: translateY(-2px); }

  @media (max-width: 420px) {
    .money { font-size: 68px; }
    .money-decimals { font-size: 36px; }
    .money-mills { font-size: 22px; }
    .result-amount { font-size: 50px; }
    .logo h1 { font-size: 26px; }
  }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<canvas id="rain-canvas"></canvas>

<!-- 设置屏 -->
<div class="screen active" id="setup-screen">
  <div class="setup-card">
    <div class="logo">
      <div class="poop">💩</div>
      <h1>带薪拉屎</h1>
      <div class="sub">让老板为你的如厕时光买单</div>
    </div>

    <div class="mode-tabs">
      <div class="mode-tab active" data-mode="hourly">时薪</div>
      <div class="mode-tab" data-mode="monthly">月薪</div>
    </div>

    <div id="hourly-fields">
      <div class="field">
        <label>你的时薪（元/小时）</label>
        <input type="number" id="hourly-rate" placeholder="例如：80" min="0" step="0.1">
      </div>
    </div>

    <div id="monthly-fields" style="display:none">
      <div class="field">
        <label>你的月薪（元/月）</label>
        <input type="number" id="monthly-rate" placeholder="例如：15000" min="0" step="100">
      </div>
      <div class="field-row">
        <div class="field">
          <label>每月工作天数</label>
          <input type="number" id="work-days" placeholder="22" min="1" max="31" value="22">
        </div>
        <div class="field">
          <label>每日工作时长</label>
          <input type="number" id="work-hours" placeholder="8" min="1" max="24" value="8">
        </div>
      </div>
      <div class="hint" id="calc-hint"></div>
    </div>

    <button class="start-btn" id="start-btn">开 始 拉 屎</button>
  </div>
</div>

<!-- 计时屏 -->
<div class="screen timer-screen" id="timer-screen">
  <div class="top-bar">
    <div class="top-btn" id="pause-btn">⏸ 暂停 (空格)</div>
    <div class="top-btn" id="restart-btn">↺ 重开 (ESC)</div>
  </div>

  <div class="rate-display">时薪 <b id="show-rate">0</b> 元/小时 · 每秒进账 <b id="show-per-sec">0.000</b> 元</div>

  <div class="amount-wrap" id="amount-wrap">
    <span class="currency">¥</span><span class="money" id="money-int">0</span><span class="money-decimals">.<span id="money-dec">00</span></span><span class="money-mills" id="money-mills-wrap"><span id="money-mills">0</span></span>
  </div>

  <div class="time-display" id="time-display">00:00:00.0</div>

  <div class="slogan" id="slogan">深呼吸，放松，让金钱流淌……</div>

  <div class="progress-label">
    <span>当前 <b id="progress-current">¥0</b></span>
    <span>下一目标 <span class="next" id="progress-next">¥1</span> · 还差 <b id="progress-remain">¥1</b></span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <button class="stop-btn" id="stop-btn">我 拉 完 了</button>

  <div class="tips">
    <kbd>Space</kbd> 暂停/继续 · <kbd>Esc</kbd> 重新开始 · <kbd>Enter</kbd> 结束
  </div>
</div>

<!-- 里程碑弹窗 -->
<div class="milestone" id="milestone">
  <div class="icon" id="milestone-icon">🎉</div>
  <div class="text" id="milestone-text">里程碑达成！</div>
  <div class="amount" id="milestone-amount">¥0</div>
</div>

<!-- 结束屏 -->
<div class="screen" id="result-screen">
  <div class="result-card">
    <div class="crown">👑💩</div>
    <div class="congrats">恭喜！你完成了一次完美带薪拉屎</div>
    <div class="result-amount-wrap">
      <span class="currency" style="font-size:28px">¥</span><span class="result-amount" id="result-int">0</span><span class="result-decimals">.<span id="result-dec">00</span></span>
    </div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-stats">
      <div class="stat-item">
        <div class="v" id="stat-time">0s</div>
        <div class="l">如厕时长</div>
      </div>
      <div class="stat-item">
        <div class="v" id="stat-rate">¥0/h</div>
        <div class="l">时薪</div>
      </div>
      <div class="stat-item">
        <div class="v" id="stat-avg">0</div>
        <div class="l">每分钟进账</div>
      </div>
    </div>
    <div class="result-btns">
      <button class="btn-secondary" id="share-btn">复制战绩</button>
      <button class="btn-primary" id="again-btn">再来一坨</button>
    </div>
  </div>
</div>

<script>
// ============= 状态 =============
const state = {
  mode: 'hourly',
  ratePerSec: 0,
  ratePerHour: 0,
  startTime: 0,
  accumulated: 0,   // 拉屎期间累积的秒数（已扣除暂停）
  pausedAt: 0,
  paused: false,
  running: false,
  milestonesHit: new Set(),
};

// 里程碑：按金额触发
const MILESTONES = [
  { amount: 1,     icon: '🪙', text: '一元到手！' },
  { amount: 5,     icon: '💵', text: '五元入账！' },
  { amount: 10,    icon: '💸', text: '十元达成！' },
  { amount: 50,    icon: '💰', text: '五十元！老板肉疼' },
  { amount: 100,   icon: '🤑', text: '一百元！富豪模式' },
  { amount: 500,   icon: '🏆', text: '五百元！拉出财富自由' },
  { amount: 1000,  icon: '👑', text: '一千元！传奇之屎' },
  { amount: 5000,  icon: '🌟', text: '五千元！封神之作' },
  { amount: 10000, icon: '🚀', text: '一万元！你是拉神' },
];

const SLOGANS = [
  '深呼吸，放松，让金钱流淌……',
  '每一秒都在赚钱，你是时间的主人',
  '老板买单，你排便，资本主义的天才',
  '厕所隔间就是你的私人印钞机',
  '别急，多坐一会儿，钱还在涨',
  '此刻你不是在拉屎，你是在收割',
  '每一滴都是真金白银',
  '让便便飞一会儿，让钞票飞一会儿',
  '老板哭晕在办公室，你在厕所笑开花',
  '稳住，我们能发财',
  '屎可断，财不可断',
  '一动不动，钱进账中',
  '感谢公司，感谢老板，感谢这坨屎',
  '你不是在偷懒，你是在高效率变现',
];

// ============= DOM =============
const $ = id => document.getElementById(id);
const setupScreen = $('setup-screen');
const timerScreen = $('timer-screen');
const resultScreen = $('result-screen');

// 模式切换
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.mode = tab.dataset.mode;
    $('hourly-fields').style.display = state.mode === 'hourly' ? 'block' : 'none';
    $('monthly-fields').style.display = state.mode === 'monthly' ? 'block' : 'none';
    updateHint();
  });
});

['monthly-rate', 'work-days', 'work-hours'].forEach(id => {
  $(id).addEventListener('input', updateHint);
});
function updateHint() {
  if (state.mode !== 'monthly') { $('calc-hint').textContent = ''; return; }
  const m = parseFloat($('monthly-rate').value) || 0;
  const d = parseFloat($('work-days').value) || 0;
  const h = parseFloat($('work-hours').value) || 0;
  if (m > 0 && d > 0 && h > 0) {
    const hp = m / (d * h);
    $('calc-hint').textContent = `折合时薪约 ${hp.toFixed(2)} 元/小时`;
  } else {
    $('calc-hint').textContent = '';
  }
}

// 开始
$('start-btn').addEventListener('click', startTimer);
function getRatePerHour() {
  if (state.mode === 'hourly') {
    return parseFloat($('hourly-rate').value) || 0;
  } else {
    const m = parseFloat($('monthly-rate').value) || 0;
    const d = parseFloat($('work-days').value) || 0;
    const h = parseFloat($('work-hours').value) || 0;
    if (d <= 0 || h <= 0) return 0;
    return m / (d * h);
  }
}
function startTimer() {
  const r = getRatePerHour();
  if (r <= 0) {
    flashError('请输入有效的薪资');
    return;
  }
  state.ratePerHour = r;
  state.ratePerSec = r / 3600;
  state.startTime = performance.now();
  state.accumulated = 0;
  state.paused = false;
  state.running = true;
  state.milestonesHit.clear();
  lastGainTime = 0;
  lastGainMoney = 0;
  $('show-rate').textContent = r.toFixed(2);
  $('show-per-sec').textContent = state.ratePerSec.toFixed(4);
  switchScreen(timerScreen);
  startRain();
}

function flashError(msg) {
  const btn = $('start-btn');
  const orig = btn.textContent;
  btn.textContent = msg;
  btn.style.background = 'linear-gradient(180deg, #ff6b4a, #d04020)';
  setTimeout(() => { btn.textContent = orig; btn.style.background = ''; }, 1500);
}

// 切屏
function switchScreen(screen) {
  [setupScreen, timerScreen, resultScreen].forEach(s => s.classList.remove('active'));
  screen.classList.add('active');
}

// 暂停/继续
$('pause-btn').addEventListener('click', togglePause);
function togglePause() {
  if (!state.running) return;
  if (state.paused) {
    // 继续
    state.paused = false;
    state.startTime += performance.now() - state.pausedAt;
    $('pause-btn').textContent = '⏸ 暂停 (空格)';
  } else {
    state.paused = true;
    state.pausedAt = performance.now();
    $('pause-btn').textContent = '▶ 继续 (空格)';
  }
}

// 重开
$('restart-btn').addEventListener('click', restart);
function restart() {
  state.running = false;
  switchScreen(setupScreen);
  stopRain();
}

// 结束
$('stop-btn').addEventListener('click', stopTimer);
function stopTimer() {
  if (!state.running) return;
  state.running = false;
  const totalSec = currentElapsedSec();
  const totalMoney = totalSec * state.ratePerSec;
  showResult(totalMoney, totalSec);
  stopRain();
}

function currentElapsedSec() {
  if (state.paused) return state.accumulated / 1000;
  return (state.accumulated + (performance.now() - state.startTime)) / 1000;
}

function showResult(money, sec) {
  const intPart = Math.floor(money);
  const decPart = Math.floor((money - intPart) * 100).toString().padStart(2, '0');
  $('result-int').textContent = intPart.toLocaleString('zh-CN');
  $('result-dec').textContent = decPart;
  $('stat-time').textContent = formatDuration(sec);
  $('stat-rate').textContent = '¥' + state.ratePerHour.toFixed(2) + '/h';
  $('stat-avg').textContent = '¥' + (sec > 0 ? (money / sec * 60).toFixed(2) : '0.00');

  // 评语
  let msg = '';
  if (money < 1) msg = '虽然只赚了一点点，但你成功地把公司的钱变成了自己的屎。这是胜利。';
  else if (money < 10) msg = '一泡屎赚回一杯奶茶，性价比极高，建议每日定时定量。';
  else if (money < 50) msg = '这坨屎价值不菲！足够你吃顿好的犒劳自己。';
  else if (money < 100) msg = '拉出了一笔巨款！老板正在办公室偷偷抹泪。';
  else if (money < 500) msg = '神级带薪拉屎！你已掌握资本主义的精髓：让别人为你的屎买单。';
  else if (money < 1000) msg = '封神之屎！建议你立刻申请加薪，理由：上厕所的产出比工作高。';
  else msg = '你不是在拉屎，你是在印钞。请收下我的膝盖，拉神大人。';
  $('result-msg').textContent = msg;

  switchScreen(resultScreen);
  fireConfetti();
}

// 再来一坨
$('again-btn').addEventListener('click', () => {
  switchScreen(setupScreen);
});

// 复制战绩
$('share-btn').addEventListener('click', () => {
  const money = parseFloat($('result-int').textContent.replace(/,/g,'')) + parseFloat($('result-dec').textContent)/100;
  const txt = `我刚刚完成一次带薪拉屎！\n时长：${$('stat-time').textContent}\n赚到：¥${$('result-int').textContent}.${$('result-dec').textContent}\n时薪：${$('stat-rate').textContent}\n每一分钟都在收割老板的钱包 💩💰`;
  navigator.clipboard?.writeText(txt).then(() => {
    const btn = $('share-btn');
    const orig = btn.textContent;
    btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = orig, 1500);
  }).catch(() => {});
});

// 键盘
document.addEventListener('keydown', e => {
  if (!timerScreen.classList.contains('active')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.code === 'Escape') { restart(); }
  else if (e.code === 'Enter') { stopTimer(); }
});

// ============= 主循环 =============
let lastSloganIdx = -1;
let lastMilestoneCheck = 0;
let lastGainTime = 0;
let lastGainMoney = 0;
function loop() {
  if (state.running) {
    const sec = currentElapsedSec();
    const money = sec * state.ratePerSec;

    // 更新金额（整数 + 2位分 + 1位毫秒，毫秒位飞速滚动）
    // 缓存对比，仅在变化时写 DOM，避免每帧 toLocaleString + 重排
    const intPart = Math.floor(money);
    const frac = money - intPart;
    const dec = Math.floor(frac * 100).toString().padStart(2, '0');
    const mill = Math.floor(frac * 1000) % 10;
    if (loop._lastInt !== intPart) {
      loop._lastInt = intPart;
      $('money-int').textContent = intPart.toLocaleString('zh-CN');
    }
    if (loop._lastDec !== dec) {
      loop._lastDec = dec;
      $('money-dec').textContent = dec;
    }
    if (loop._lastMill !== mill) {
      loop._lastMill = mill;
      $('money-mills').textContent = mill;
    }

    // 每秒飞出一个 +金额 提示
    const now = performance.now();
    if (now - lastGainTime >= 1000) {
      const gain = money - lastGainMoney;
      if (lastGainTime > 0 && gain > 0) {
        spawnFloatingGain(gain);
      }
      lastGainTime = now;
      lastGainMoney = money;
    }

    // 时间（缓存，仅 0.1 秒精度变化时写 DOM）
    const tStr = formatTime(sec);
    if (loop._lastTime !== tStr) { loop._lastTime = tStr; $('time-display').textContent = tStr; }

    // 进度条（按下一个里程碑）—— 缓存对比，仅变化时写 DOM
    const next = MILESTONES.find(m => !state.milestonesHit.has(m.amount) && m.amount > money);
    const prev = [...MILESTONES].reverse().find(m => state.milestonesHit.has(m.amount) || m.amount <= money);
    const prevAmount = prev ? prev.amount : 0;
    if (next) {
      const p = (money - prevAmount) / (next.amount - prevAmount) * 100;
      $('progress-fill').style.width = Math.max(0, Math.min(100, p)) + '%';
      const cur2 = money.toFixed(2);
      if (loop._lastPCur !== cur2) { loop._lastPCur = cur2; $('progress-current').textContent = '¥' + cur2; }
      if (loop._lastPNext !== next.amount) { loop._lastPNext = next.amount; $('progress-next').textContent = '¥' + next.amount.toLocaleString('zh-CN'); }
      const rem = (next.amount - money).toFixed(2);
      if (loop._lastPRem !== rem) { loop._lastPRem = rem; $('progress-remain').textContent = '¥' + rem; }
    } else {
      $('progress-fill').style.width = '100%';
      if (loop._lastPNext !== 'done') { loop._lastPNext = 'done'; $('progress-next').textContent = '已封神'; $('progress-remain').textContent = '¥0'; }
      const cur2 = money.toFixed(2);
      if (loop._lastPCur !== cur2) { loop._lastPCur = cur2; $('progress-current').textContent = '¥' + cur2; }
    }

    // 里程碑
    if (now - lastMilestoneCheck > 200) {
      lastMilestoneCheck = now;
      for (const m of MILESTONES) {
        if (!state.milestonesHit.has(m.amount) && money >= m.amount) {
          state.milestonesHit.add(m.amount);
          showMilestone(m);
          fireMilestoneBurst();
          break;
        }
      }
    }

    // 动态标语（每8秒换一次）
    if (!loop._lastSloganTime || now - loop._lastSloganTime > 8000) {
      loop._lastSloganTime = now;
      let idx;
      do { idx = Math.floor(Math.random() * SLOGANS.length); }
      while (idx === lastSloganIdx && SLOGANS.length > 1);
      lastSloganIdx = idx;
      $('slogan').style.opacity = '0';
      setTimeout(() => {
        $('slogan').textContent = SLOGANS[idx];
        $('slogan').style.opacity = '1';
      }, 250);
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function formatTime(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  const t = Math.floor((sec * 10) % 10);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${t}`;
}
function formatDuration(sec) {
  if (sec < 60) return sec.toFixed(1) + ' 秒';
  if (sec < 3600) return Math.floor(sec/60) + '分' + Math.floor(sec%60) + '秒';
  return Math.floor(sec/3600) + '时' + Math.floor((sec%3600)/60) + '分';
}

function showMilestone(m) {
  const el = $('milestone');
  $('milestone-icon').textContent = m.icon;
  $('milestone-text').textContent = m.text;
  $('milestone-amount').textContent = '¥' + m.amount.toLocaleString('zh-CN');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// 飞出 +金额 提示
function spawnFloatingGain(gain) {
  const wrap = $('amount-wrap');
  const el = document.createElement('div');
  el.className = 'floating-gain';
  // 横向随机偏移，避免堆叠
  const xOff = (Math.random() - 0.5) * 120;
  el.style.setProperty('--xoff', xOff + 'px');
  el.style.left = `calc(50% + ${xOff}px)`;
  const txt = gain >= 1 ? '+¥' + gain.toFixed(2) : '+¥' + gain.toFixed(3);
  el.textContent = txt;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

// ============= 背景：金币钞票雨 =============
const rainCanvas = $('rain-canvas');
const rctx = rainCanvas.getContext('2d');
let rainItems = [];
let rainRAF = null;
const RAIN_EMOJIS = ['💩','💰','💵','🪙','💸','🧻','👑'];

function resizeRain() {
  rainCanvas.width = window.innerWidth;
  rainCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeRain);
resizeRain();

function startRain() {
  rainItems = [];
  const count = Math.min(40, Math.floor(window.innerWidth / 30));
  for (let i = 0; i < count; i++) {
    rainItems.push(makeRainItem(true));
  }
  if (!rainRAF) animateRain();
}
function stopRain() {
  if (rainRAF) {
    // 让现有物品落完后停止
    setTimeout(() => {
      cancelAnimationFrame(rainRAF);
      rainRAF = null;
      rctx.clearRect(0,0,rainCanvas.width,rainCanvas.height);
    }, 800);
  }
}
function makeRainItem(initial = false) {
  return {
    x: Math.random() * rainCanvas.width,
    y: initial ? Math.random() * rainCanvas.height : -50,
    size: 18 + Math.random() * 28,
    speed: 0.8 + Math.random() * 2.5,
    sway: Math.random() * Math.PI * 2,
    swaySpeed: 0.01 + Math.random() * 0.03,
    emoji: RAIN_EMOJIS[Math.floor(Math.random() * RAIN_EMOJIS.length)],
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.05,
    alpha: 0.4 + Math.random() * 0.5,
  };
}
function animateRain() {
  rctx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
  for (let i = rainItems.length - 1; i >= 0; i--) {
    const it = rainItems[i];
    it.y += it.speed;
    it.sway += it.swaySpeed;
    it.rot += it.rotSpeed;
    // 一次性爆发粒子：寿命衰减 + alpha 淡出
    let alpha = it.alpha;
    if (it.life !== undefined) {
      it.life -= 1;
      if (it.life <= 0) { rainItems.splice(i, 1); continue; }
      alpha = it.alpha * Math.min(1, it.life / 30);
    }
    const x = it.x + Math.sin(it.sway) * 30;
    rctx.save();
    rctx.globalAlpha = alpha;
    rctx.translate(x, it.y);
    rctx.rotate(it.rot);
    rctx.font = it.size + 'px serif';
    rctx.textAlign = 'center';
    rctx.textBaseline = 'middle';
    rctx.fillText(it.emoji, 0, 0);
    rctx.restore();
    if (it.y > rainCanvas.height + 50) {
      if (it.life !== undefined) {
        rainItems.splice(i, 1);  // 爆发粒子不循环
      } else if (state.running) {
        rainItems[i] = makeRainItem();
      } else {
        rainItems.splice(i, 1);
      }
    }
  }
  // 粒子总数上限保护
  if (rainItems.length > 150) {
    rainItems.splice(0, rainItems.length - 150);
  }
  rainRAF = requestAnimationFrame(animateRain);
}

// ============= 里程碑爆发粒子 =============
function fireMilestoneBurst() {
  for (let i = 0; i < 25; i++) {
    rainItems.push({
      x: rainCanvas.width / 2 + (Math.random() - 0.5) * 100,
      y: rainCanvas.height / 2 + (Math.random() - 0.5) * 50,
      size: 24 + Math.random() * 24,
      speed: 2 + Math.random() * 4,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.02 + Math.random() * 0.04,
      emoji: ['🎉','✨','💰','🪙','💥'][Math.floor(Math.random()*5)],
      rot: 0,
      rotSpeed: (Math.random() - 0.5) * 0.1,
      alpha: 1,
      life: 80,  // 一次性粒子，约 1.3 秒后淡出移除
    });
  }
}
function fireConfetti() {
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      rainItems.push({
        x: Math.random() * rainCanvas.width,
        y: -30,
        size: 20 + Math.random() * 30,
        speed: 2 + Math.random() * 3,
        sway: Math.random() * Math.PI * 2,
        swaySpeed: 0.02 + Math.random() * 0.04,
        emoji: ['🎉','✨','💰','🪙','💸','👑','💩'][Math.floor(Math.random()*7)],
        rot: 0,
        rotSpeed: (Math.random() - 0.5) * 0.1,
        alpha: 0.9,
        life: 120,
      });
    }, i * 30);
  }
  if (!rainRAF) animateRain();
}

// ============= 背景星空粒子 =============
const bgCanvas = $('bg-canvas');
const bctx = bgCanvas.getContext('2d');
let bgParticles = [];
function resizeBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
  bgParticles = [];
  const n = Math.min(60, Math.floor(window.innerWidth / 25));
  for (let i = 0; i < n; i++) {
    bgParticles.push({
      x: Math.random() * bgCanvas.width,
      y: Math.random() * bgCanvas.height,
      r: Math.random() * 1.5 + 0.3,
      a: Math.random() * 0.5 + 0.1,
      twinkle: Math.random() * Math.PI * 2,
    });
  }
}
window.addEventListener('resize', resizeBg);
resizeBg();
(function bgLoop() {
  bctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  for (const p of bgParticles) {
    p.twinkle += 0.03;
    const alpha = p.a * (0.5 + 0.5 * Math.sin(p.twinkle));
    bctx.fillStyle = `rgba(255, 210, 120, ${alpha})`;
    bctx.beginPath();
    bctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    bctx.fill();
  }
  requestAnimationFrame(bgLoop);
})();

// 阻止输入框的空格触发暂停
document.querySelectorAll('input').forEach(inp => {
  inp.addEventListener('keydown', e => e.stopPropagation());
});
</script>
