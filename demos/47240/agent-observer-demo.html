<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent-Observer · AI 编程工作流实时监控 Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f4f6f8;color:#111827}

/* Header */
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:20px 30px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.header-content{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px}
.header .subtitle{font-size:14px;opacity:.9;margin-top:4px}
.header-actions{display:flex;gap:10px}
.btn{padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-size:14px;font-weight:500;transition:all .2s;display:flex;align-items:center;gap:6px}
.btn-primary{background:#fff;color:#667eea}
.btn-primary:hover{background:#f0f2f5;transform:translateY(-1px)}
.btn-secondary{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn-secondary:hover{background:rgba(255,255,255,.3)}

/* Main Layout */
.container{max-width:100%;margin:0 auto;padding:20px;display:grid;grid-template-columns:280px 1fr;gap:16px;min-width:0}

/* Sidebar */
.sidebar{display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.card-header{padding:14px 16px;border-bottom:1px solid #f0f0f0;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.card-body{padding:16px}

/* Status Overview */
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status-item{padding:12px;border-radius:6px;text-align:center;cursor:pointer;transition:all .2s;border:2px solid transparent}
.status-item:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.status-item.active{border-color:#667eea}
.status-item .count{font-size:24px;font-weight:700;margin-bottom:4px}
.status-item .label{font-size:12px;color:#666}
.status-running{background:#e6f7ff}
.status-running .count{color:#1890ff}
.status-completed{background:#f6ffed}
.status-completed .count{color:#52c41a}
.status-failed{background:#fff1f0}
.status-failed .count{color:#f5222d}
.status-stale{background:#fffbe6}
.status-stale .count{color:#faad14}

/* Run List */
.run-list{max-height:500px;overflow-y:auto}
.run-item{padding:12px;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:all .15s}
.run-item:hover{background:#f9fafb}
.run-item.active{background:#f0f4ff;border-left:3px solid #667eea}
.run-item:last-child{border-bottom:none}
.run-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.run-id{font-size:13px;font-weight:600;color:#333}
.run-status{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.run-status.running{background:#e6f7ff;color:#1890ff}
.run-status.completed{background:#f6ffed;color:#52c41a}
.run-status.failed{background:#fff1f0;color:#f5222d}
.run-status.stale{background:#fffbe6;color:#faad14}
.run-meta{font-size:12px;color:#999;display:flex;gap:12px}

/* Main Content */
.main{display:flex;flex-direction:column;gap:16px}

/* Metrics */
.metrics-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.metric-card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.metric-label{font-size:12px;color:#999;margin-bottom:6px}
.metric-value{font-size:28px;font-weight:700;color:#111827}
.metric-trend{font-size:12px;margin-top:4px;display:flex;align-items:center;gap:4px}
.trend-up{color:#52c41a}
.trend-down{color:#f5222d}

/* Workflow Visualization */
.workflow-viz{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.workflow-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.workflow-stages{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;flex-wrap:nowrap}
.stage{flex:1 1 0;min-width:100px;max-width:180px;padding:10px 8px;border-radius:6px;border:2px solid #e8e8e8;background:#fafafa;position:relative;transition:all .3s}
.stage.completed{border-color:#52c41a;background:#f6ffed}
.stage.running{border-color:#1890ff;background:#e6f7ff;animation:pulse 2s infinite}
.stage.failed{border-color:#f5222d;background:#fff1f0}
.stage.pending{opacity:.5}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(24,144,255,.4)}50%{box-shadow:0 0 0 8px rgba(24,144,255,0)}}
.stage-name{font-size:13px;font-weight:600;margin-bottom:4px}
.stage-status{font-size:11px;color:#666}
.stage-arrow{position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:#d9d9d9;font-size:16px}

/* Detail Panel */
.detail-panel{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.detail-tabs{display:flex;border-bottom:1px solid #f0f0f0;background:#fafafa}
.tab{padding:12px 20px;font-size:14px;color:#666;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:#667eea}
.tab.active{color:#667eea;border-bottom-color:#667eea;background:#fff;font-weight:600}
.detail-content{padding:20px;min-height:300px}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#fafafa;color:#666;font-weight:500;border-bottom:1px solid #e8e8e8}
td{padding:10px 12px;border-bottom:1px solid #f0f0f0}
tr:hover td{background:#f9fafb}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-success{background:#f6ffed;color:#52c41a}
.tag-error{background:#fff1f0;color:#f5222d}
.tag-warning{background:#fffbe6;color:#faad14}
.tag-info{background:#e6f7ff;color:#1890ff}

/* Progress Bars */
.progress-item{margin-bottom:16px}
.progress-label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}
.progress-bar{height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:4px;transition:width .6s ease}

/* Token Chart */
.token-chart{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.token-item{text-align:center;padding:16px;background:#f9fafb;border-radius:6px}
.token-value{font-size:24px;font-weight:700;color:#667eea;margin-bottom:4px}
.token-label{font-size:12px;color:#999}

/* Empty State */
.empty-state{text-align:center;padding:60px 20px;color:#999}
.empty-state svg{width:80px;height:80px;margin-bottom:16px;opacity:.3}
.empty-state p{font-size:14px}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#f0f0f0;border-radius:3px}
::-webkit-scrollbar-thumb{background:#d9d9d9;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#bfbfbf}

/* Toast */
.toast{position:fixed;top:80px;right:30px;padding:12px 20px;background:#52c41a;color:#fff;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:1000;transform:translateX(400px);transition:transform .3s ease;font-size:14px}
.toast.show{transform:translateX(0)}
</style>
</head>
<body>
<div class="header">
  <div class="header-content">
    <div>
      <h1>🔍 Agent-Observer</h1>
      <div class="subtitle">AI 编程工作流实时监控 · 让长任务不再黑盒</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="simulateScan()">🔄 扫描</button>
      <button class="btn btn-primary" onclick="exportEvidence()">📤 导出证据</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="sidebar">
    <div class="card">
      <div class="card-header">运行状态概览</div>
      <div class="card-body">
        <div class="status-grid">
          <div class="status-item status-running" onclick="filterByStatus('running')">
            <div class="count" id="runningCount">1</div>
            <div class="label">运行中</div>
          </div>
          <div class="status-item status-completed" onclick="filterByStatus('completed')">
            <div class="count" id="completedCount">2</div>
            <div class="label">已完成</div>
          </div>
          <div class="status-item status-failed" onclick="filterByStatus('failed')">
            <div class="count" id="failedCount">1</div>
            <div class="label">失败</div>
          </div>
          <div class="status-item status-stale" onclick="filterByStatus('stale')">
            <div class="count" id="staleCount">1</div>
            <div class="label">停滞</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span>运行队列</span>
        <span style="font-size:12px;color:#999" id="runCount">4 个任务</span>
      </div>
      <div class="run-list" id="runList"></div>
    </div>
  </div>

  <div class="main">
    <div class="metrics-row">
      <div class="metric-card">
        <div class="metric-label">总 Token 消耗</div>
        <div class="metric-value" id="totalTokens">252,579</div>
        <div class="metric-trend trend-up">↑ 12.5% 较昨日</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">平均完成度</div>
        <div class="metric-value" id="avgCompletion">68%</div>
        <div class="metric-trend trend-up">↑ 5.2%</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">错误率</div>
        <div class="metric-value" id="errorRate">25%</div>
        <div class="metric-trend trend-down">↓ 3.1%</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">活跃项目</div>
        <div class="metric-value" id="activeProjects">2</div>
        <div class="metric-trend">持平</div>
      </div>
    </div>

    <div class="workflow-viz" id="workflowViz">
      <div class="workflow-title">
        <span>📊</span>
        <span id="workflowTitle">spec-driven 工作流 · run_76317963ed8f</span>
      </div>
      <div class="workflow-stages" id="workflowStages"></div>
    </div>

    <div class="detail-panel">
      <div class="detail-tabs">
        <div class="tab active" onclick="switchTab('overview')">概览</div>
        <div class="tab" onclick="switchTab('events')">事件日志</div>
        <div class="tab" onclick="switchTab('artifacts')">产物清单</div>
        <div class="tab" onclick="switchTab('tokens')">Token 分析</div>
        <div class="tab" onclick="switchTab('errors')">错误追踪</div>
      </div>
      <div class="detail-content">
        <div class="tab-pane active" id="overviewPane"></div>
        <div class="tab-pane" id="eventsPane"></div>
        <div class="tab-pane" id="artifactsPane"></div>
        <div class="tab-pane" id="tokensPane"></div>
        <div class="tab-pane" id="errorsPane"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Mock Data - 模拟真实运行数据
const runs = [
  {

    ],

      workflow: { total: 10, completed: 2, percent: 20 },
      stories: { total: 0, passed: 0, percent: 0 },
      tasks: { total: 0, completed: 0, percent: 0 }
    },
    tokens: { input: 56000, output: 28123, cached: 20000, total: 84123 },
    stages: [
      { name: 'spec-distill', status: 'completed' },
      { name: 'production-spec', status: 'completed' },
      { name: 'implementation-plan', status: 'failed' },
      { name: 'implement-stories', status: 'pending' },
      { name: 'review-gate', status: 'pending' },
      { name: 'release-readiness', status: 'pending' },
      { name: 'final-e2e-proof', status: 'pending' },

    ],

    },

    ],

    ],

  },
  {
    id: 'run_stale_abc123',
    project: 'agent-observer',
    workflow: 'plan-execute',
    status: 'stale',
    phase: 'implement',
    currentNode: 'execute-task-loop',
    startedAt: '2026-06-18 18:00',
    lastProgress: '2 小时前',
    progress: {
      workflow: { total: 8, completed: 2, percent: 25 },
      stories: { total: 0, passed: 0, percent: 0 },
      tasks: { total: 5, completed: 1, percent: 20 }
    },
    tokens: { input: 30000, output: 15000, cached: 10000, total: 45000 },
    stages: [
      { name: 'generate-plan', status: 'completed' },
      { name: 'execute-task-loop', status: 'running' },
      { name: 'verify', status: 'pending' },
      { name: 'review', status: 'pending' },
      { name: 'release', status: 'pending' }
    ],
    events: [
      { time: '19:00:00', node: 'execute-task-loop', status: 'RUNNING', message: '执行 task-1' },
      { time: '18:30:00', node: 'generate-plan', status: 'PASSED', message: '计划生成完成' }
    ],
    artifacts: [
      { node: 'generate-plan', path: 'nodes/generate-plan/plan.json', kind: 'json', size: '4.2 KB' }
    ],
    errors: []
  }
];

let selectedRun = runs[0];
let currentFilter = null;

// Render Functions
function renderRunList() {
  const list = document.getElementById('runList');
  const filtered = currentFilter ? runs.filter(r => r.status === currentFilter) : runs;
  
  list.innerHTML = filtered.map(run => `
    <div class="run-item ${run.id === selectedRun.id ? 'active' : ''}" onclick="selectRun('${run.id}')">
      <div class="run-header">
        <div class="run-id">${run.id.substring(0, 20)}...</div>
        <div class="run-status ${run.status}">${getStatusText(run.status)}</div>
      </div>
      <div class="run-meta">
        <span>${run.project}</span>
        <span>${run.workflow}</span>
        <span>${run.lastProgress}</span>
      </div>
    </div>
  `).join('');
  
  document.getElementById('runCount').textContent = `${filtered.length} 个任务`;
}

function renderWorkflowViz() {
  const stages = document.getElementById('workflowStages');
  document.getElementById('workflowTitle').textContent = `${selectedRun.workflow} 工作流 · ${selectedRun.id}`;
  
  stages.innerHTML = selectedRun.stages.map((stage, i) => `
    <div class="stage ${stage.status}">
      <div class="stage-name">${stage.name}</div>
      <div class="stage-status">${getStageStatusText(stage.status)}</div>
      ${i < selectedRun.stages.length - 1 ? '<div class="stage-arrow">→</div>' : ''}
    </div>
  `).join('');
}

function renderOverview() {
  const pane = document.getElementById('overviewPane');
  const p = selectedRun.progress;
  
  pane.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div>
        <h3 style="font-size:14px;font-weight:600;margin-bottom:16px">完成度</h3>
        <div class="progress-item">
          <div class="progress-label">
            <span>Workflow 节点</span>
            <span>${p.workflow.completed} / ${p.workflow.total}</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${p.workflow.percent}%"></div></div>
        </div>
        <div class="progress-item">
          <div class="progress-label">
            <span>Story</span>
            <span>${p.stories.passed} / ${p.stories.total}</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${p.stories.percent}%"></div></div>
        </div>
        <div class="progress-item">
          <div class="progress-label">
            <span>Task</span>
            <span>${p.tasks.completed} / ${p.tasks.total}</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${p.tasks.percent}%"></div></div>
        </div>
      </div>
      <div>
        <h3 style="font-size:14px;font-weight:600;margin-bottom:16px">基本信息</h3>
        <table>
          <tr><td style="color:#999;width:120px">项目</td><td>${selectedRun.project}</td></tr>
          <tr><td style="color:#999">工作流</td><td>${selectedRun.workflow}</td></tr>
          <tr><td style="color:#999">当前阶段</td><td>${selectedRun.phase}</td></tr>
          <tr><td style="color:#999">当前节点</td><td>${selectedRun.currentNode}</td></tr>
          <tr><td style="color:#999">开始时间</td><td>${selectedRun.startedAt}</td></tr>
          <tr><td style="color:#999">最近推进</td><td>${selectedRun.lastProgress}</td></tr>
        </table>
      </div>
    </div>
  `;
}

function renderEvents() {
  const pane = document.getElementById('eventsPane');
  if (!selectedRun.events.length) {
    pane.innerHTML = '<div class="empty-state"><p>暂无事件记录</p></div>';
    return;
  }
  
  pane.innerHTML = `
    <table>
      <thead>
        <tr><th>时间</th><th>节点</th><th>状态</th><th>消息</th></tr>
      </thead>
      <tbody>
        ${selectedRun.events.map(e => `
          <tr>
            <td>${e.time}</td>
            <td>${e.node}</td>
            <td><span class="tag tag-${e.status === 'PASSED' ? 'success' : e.status === 'FAILED' ? 'error' : 'info'}">${e.status}</span></td>
            <td>${e.message}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderArtifacts() {
  const pane = document.getElementById('artifactsPane');
  if (!selectedRun.artifacts.length) {
    pane.innerHTML = '<div class="empty-state"><p>暂无产物</p></div>';
    return;
  }
  
  pane.innerHTML = `
    <table>
      <thead>
        <tr><th>节点</th><th>路径</th><th>类型</th><th>大小</th></tr>
      </thead>
      <tbody>
        ${selectedRun.artifacts.map(a => `
          <tr>
            <td>${a.node}</td>
            <td style="font-family:monospace;font-size:12px">${a.path}</td>
            <td><span class="tag tag-info">${a.kind}</span></td>
            <td>${a.size}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderTokens() {
  const pane = document.getElementById('tokensPane');
  const t = selectedRun.tokens;
  
  pane.innerHTML = `
    <div class="token-chart">
      <div class="token-item">
        <div class="token-value">${t.input.toLocaleString()}</div>
        <div class="token-label">输入 Token</div>
      </div>
      <div class="token-item">
        <div class="token-value">${t.output.toLocaleString()}</div>
        <div class="token-label">输出 Token</div>
      </div>
      <div class="token-item">
        <div class="token-value">${t.total.toLocaleString()}</div>
        <div class="token-label">总计 Token</div>
      </div>
    </div>
    <div style="margin-top:20px;padding:16px;background:#f9fafb;border-radius:6px">
      <div style="font-size:13px;color:#666;margin-bottom:8px">缓存命中率</div>
      <div style="font-size:24px;font-weight:700;color:#52c41a">${t.input > 0 ? Math.round(t.cached / t.input * 100) : 0}%</div>
      <div style="font-size:12px;color:#999;margin-top:4px">${t.cached.toLocaleString()} / ${t.input.toLocaleString()} Token</div>
    </div>
  `;
}

function renderErrors() {
  const pane = document.getElementById('errorsPane');
  if (!selectedRun.errors.length) {
    pane.innerHTML = '<div class="empty-state"><p>当前运行无错误 ✓</p></div>';
    return;
  }
  
  pane.innerHTML = `
    <table>
      <thead>
        <tr><th>分类</th><th>节点</th><th>消息</th><th>次数</th></tr>
      </thead>
      <tbody>
        ${selectedRun.errors.map(e => `
          <tr>
            <td><span class="tag tag-error">${e.category}</span></td>
            <td>${e.node}</td>
            <td>${e.message}</td>
            <td>${e.count}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function updateMetrics() {
  const total = runs.reduce((sum, r) => sum + r.tokens.total, 0);
  const avgComp = Math.round(runs.reduce((sum, r) => sum + r.progress.workflow.percent, 0) / runs.length);
  const errorRuns = runs.filter(r => r.errors.length > 0).length;
  const projects = new Set(runs.map(r => r.project)).size;
  
  document.getElementById('totalTokens').textContent = total.toLocaleString();
  document.getElementById('avgCompletion').textContent = avgComp + '%';
  document.getElementById('errorRate').textContent = Math.round(errorRuns / runs.length * 100) + '%';
  document.getElementById('activeProjects').textContent = projects;
}

function updateStatusCounts() {
  const counts = { running: 0, completed: 0, failed: 0, stale: 0 };
  runs.forEach(r => counts[r.status]++);
  
  document.getElementById('runningCount').textContent = counts.running;
  document.getElementById('completedCount').textContent = counts.completed;
  document.getElementById('failedCount').textContent = counts.failed;
  document.getElementById('staleCount').textContent = counts.stale;
}

// Helper Functions
function getStatusText(status) {
  const map = { running: '运行中', completed: '已完成', failed: '失败', stale: '停滞' };
  return map[status] || status;
}

function getStageStatusText(status) {
  const map = { completed: '✓ 完成', running: '● 运行中', failed: '✗ 失败', pending: '○ 待执行' };
  return map[status] || status;
}

// Event Handlers
function selectRun(id) {
  selectedRun = runs.find(r => r.id === id);
  renderAll();
}

function filterByStatus(status) {
  if (currentFilter === status) {
    currentFilter = null;
    document.querySelectorAll('.status-item').forEach(el => el.classList.remove('active'));
  } else {
    currentFilter = status;
    document.querySelectorAll('.status-item').forEach(el => el.classList.remove('active'));
    event.target.closest('.status-item').classList.add('active');
  }
  renderRunList();
}

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  
  event.target.classList.add('active');
  document.getElementById(tabName + 'Pane').classList.add('active');
}

function simulateScan() {
  showToast('正在扫描本地运行产物...');
  setTimeout(() => {
    showToast('✓ 扫描完成，发现 4 个运行');
  }, 1500);
}

function exportEvidence() {
  showToast(`正在导出 ${selectedRun.id} 的证据...`);
  setTimeout(() => {
    showToast('✓ 证据已导出到 exports/ 目录');
  }, 1000);
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function renderAll() {
  renderRunList();
  renderWorkflowViz();
  renderOverview();
  renderEvents();
  renderArtifacts();
  renderTokens();
  renderErrors();
  updateMetrics();
  updateStatusCounts();
}

// Initialize
renderAll();

// Simulate real-time updates
setInterval(() => {
  const running = runs.find(r => r.status === 'running');
  if (running) {
    running.progress.workflow.completed = Math.min(running.progress.workflow.total, running.progress.workflow.completed + (Math.random() > 0.7 ? 1 : 0));
    running.progress.workflow.percent = Math.round(running.progress.workflow.completed / running.progress.workflow.total * 100);
    running.tokens.total += Math.floor(Math.random() * 100);
    running.tokens.input += Math.floor(Math.random() * 60);
    running.tokens.output += Math.floor(Math.random() * 40);
    
    if (selectedRun.id === running.id) {
      renderWorkflowViz();
      renderOverview();
      updateMetrics();
    }
  }
}, 5000);
</script>
</body>
</html>
