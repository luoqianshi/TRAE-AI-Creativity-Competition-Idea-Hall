<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>循环巢 —— 可视化迭代目标求解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink-900: #0a0a08;
  --ink-800: #11110e;
  --ink-700: #1a1a16;
  --ink-600: #2a2824;
  --paper: #e8e0d0;
  --paper-dim: #b8b0a0;
  --gold: #c9a84c;
  --gold-dim: #8a7a3a;
  --gold-glow: rgba(201, 168, 76, 0.25);
  --cinnabar: #8b2d2d;
  --cinnabar-glow: rgba(139, 45, 45, 0.3);
  --jade: #4a6b5e;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Serif SC', 'Songti SC', serif;
  background: var(--ink-900);
  color: var(--paper);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.8;
}

/* ===== BACKGROUND ===== */
#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ===== HERO ===== */
.hero {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 24px 40px;
  overflow: hidden;
}

.hero-totem {
  position: relative;
  width: 320px;
  height: 320px;
  margin-bottom: 40px;
}

.hero-totem svg {
  width: 100%;
  height: 100%;
  animation: totemBreathe 6s ease-in-out infinite;
}

@keyframes totemBreathe {
  0%, 100% { transform: scale(1) rotate(0deg); }
  50% { transform: scale(1.02) rotate(1deg); }
}

.brand-name {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: clamp(56px, 10vw, 96px);
  color: var(--paper);
  letter-spacing: 12px;
  text-align: center;
  line-height: 1.1;
  opacity: 0;
  animation: inkAppear 1.2s ease 0.3s forwards;
  text-shadow: 0 0 60px rgba(201, 168, 76, 0.15);
}

.brand-sub {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: clamp(18px, 3vw, 28px);
  color: var(--gold);
  letter-spacing: 6px;
  margin-top: 16px;
  opacity: 0;
  animation: inkAppear 1s ease 0.8s forwards;
}

.brand-desc {
  font-size: 15px;
  color: var(--paper-dim);
  max-width: 420px;
  text-align: center;
  margin-top: 20px;
  opacity: 0;
  animation: inkAppear 1s ease 1.2s forwards;
  font-weight: 300;
}

.seal {
  width: 56px;
  height: 56px;
  border: 2px solid var(--cinnabar);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 32px;
  opacity: 0;
  animation: sealStamp 0.6s ease 1.6s forwards;
  color: var(--cinnabar);
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 28px;
  box-shadow: 0 0 20px var(--cinnabar-glow);
}

@keyframes inkAppear {
  from { opacity: 0; transform: translateY(20px); filter: blur(6px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}

@keyframes sealStamp {
  0% { opacity: 0; transform: scale(2); filter: blur(4px); }
  60% { opacity: 1; transform: scale(0.95); filter: blur(0); }
  100% { opacity: 1; transform: scale(1); }
}

.scroll-hint {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--paper-dim);
  font-size: 13px;
  letter-spacing: 2px;
  opacity: 0;
  animation: inkAppear 1s ease 2s forwards;
}

.scroll-hint::after {
  content: '';
  display: block;
  width: 1px;
  height: 30px;
  background: linear-gradient(to bottom, var(--gold-dim), transparent);
  margin: 10px auto 0;
  animation: lineDrop 2s ease-in-out infinite;
}

@keyframes lineDrop {
  0%, 100% { opacity: 0.3; transform: scaleY(0.6); }
  50% { opacity: 1; transform: scaleY(1); }
}

/* ===== DIVIDER ===== */
.divider {
  position: relative;
  z-index: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--ink-600), transparent);
  margin: 0 10vw;
}

.divider::before {
  content: '';
  position: absolute;
  left: 50%;
  top: -3px;
  transform: translateX(-50%);
  width: 6px;
  height: 6px;
  background: var(--gold);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--gold-glow);
}

/* ===== INPUT SECTION ===== */
.input-section {
  position: relative;
  z-index: 1;
  padding: 80px 24px 40px;
  max-width: 680px;
  margin: 0 auto;
  text-align: center;
}

.section-label {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 14px;
  color: var(--gold);
  letter-spacing: 4px;
  margin-bottom: 24px;
}

.input-ritual {
  position: relative;
  border-bottom: 1px solid var(--ink-600);
  padding-bottom: 8px;
  display: flex;
  align-items: flex-end;
  gap: 16px;
}

.input-ritual::before {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 0;
  height: 1px;
  background: var(--gold);
  transition: width 0.6s ease;
}

.input-ritual:focus-within::before {
  width: 100%;
}

.input-ritual input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--paper);
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  padding: 12px 4px;
  letter-spacing: 1px;
}

.input-ritual input::placeholder {
  color: var(--paper-dim);
  font-weight: 300;
}

.ink-btn {
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold-dim);
  padding: 10px 28px;
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 18px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.4s ease;
  position: relative;
  overflow: hidden;
  white-space: nowrap;
}

.ink-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--gold);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s ease;
  z-index: -1;
}

.ink-btn:hover {
  color: var(--ink-900);
  border-color: var(--gold);
}

.ink-btn:hover::before {
  transform: scaleX(1);
}

.ink-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  border-color: var(--ink-600);
  color: var(--paper-dim);
}

.ink-btn:disabled::before {
  display: none;
}

.quick-goals {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 28px;
  justify-content: center;
}

.goal-tag {
  padding: 6px 16px;
  border: 1px solid var(--ink-600);
  color: var(--paper-dim);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: 'Noto Serif SC', serif;
  letter-spacing: 1px;
}

.goal-tag:hover {
  border-color: var(--gold-dim);
  color: var(--gold);
}

/* ===== VISUALIZATION ===== */
.viz-section {
  display: none;
  position: relative;
  z-index: 1;
  padding: 40px 24px;
}

.viz-section.active {
  display: block;
  animation: inkAppear 0.8s ease;
}

.viz-canvas {
  position: relative;
  max-width: 960px;
  margin: 0 auto;
  aspect-ratio: 16 / 9;
  min-height: 420px;
}

.viz-canvas svg {
  width: 100%;
  height: 100%;
}

.viz-info {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  background: linear-gradient(to top, var(--ink-900), transparent);
}

.viz-info-main {
  font-size: 15px;
  color: var(--paper);
  letter-spacing: 1px;
}

.viz-info-sub {
  font-size: 12px;
  color: var(--paper-dim);
  margin-top: 4px;
}

.iteration-mark {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 20px;
  color: var(--cinnabar);
  opacity: 0;
  transition: opacity 0.4s;
}

.iteration-mark.show {
  opacity: 1;
}

/* ===== RESULT ===== */
.result-section {
  display: none;
  position: relative;
  z-index: 1;
  padding: 60px 24px 80px;
}

.result-section.active {
  display: block;
  animation: scrollUnroll 1s ease;
}

@keyframes scrollUnroll {
  from { opacity: 0; transform: translateY(40px) scaleY(0.95); }
  to { opacity: 1; transform: translateY(0) scaleY(1); }
}

.scroll-paper {
  max-width: 720px;
  margin: 0 auto;
  background: linear-gradient(180deg, #f0ebe0 0%, #e8e2d4 100%);
  border-radius: 2px;
  padding: 48px 40px;
  position: relative;
  box-shadow:
    0 1px 0 rgba(0,0,0,0.1) inset,
    0 20px 60px rgba(0,0,0,0.4),
    0 0 0 1px rgba(0,0,0,0.2) inset;
}

.scroll-paper::before,
.scroll-paper::after {
  content: '';
  position: absolute;
  left: 8px;
  right: 8px;
  height: 1px;
  background: rgba(0,0,0,0.06);
}

.scroll-paper::before { top: 12px; }
.scroll-paper::after { bottom: 12px; }

.paper-inner {
  color: #2a2824;
}

.result-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(0,0,0,0.1);
}

.result-seal {
  width: 48px;
  height: 48px;
  border: 2px solid var(--cinnabar);
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cinnabar);
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 24px;
  flex-shrink: 0;
  box-shadow: 0 0 12px var(--cinnabar-glow);
}

.result-header h2 {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 28px;
  font-weight: 400;
  color: #1a1a16;
  letter-spacing: 3px;
}

.result-meta {
  margin-left: auto;
  color: #6b6560;
  font-size: 13px;
  letter-spacing: 1px;
}

.phase-item {
  display: flex;
  gap: 16px;
  margin-bottom: 20px;
  padding: 16px 0;
  border-bottom: 1px dashed rgba(0,0,0,0.08);
}

.phase-item:last-child {
  border-bottom: none;
}

.phase-num {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 22px;
  color: var(--cinnabar);
  width: 32px;
  flex-shrink: 0;
  text-align: center;
  line-height: 1.2;
}

.phase-title {
  font-weight: 600;
  font-size: 16px;
  color: #1a1a16;
  margin-bottom: 4px;
  letter-spacing: 1px;
}

.phase-desc {
  color: #5a5548;
  font-size: 14px;
  line-height: 1.7;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: rgba(0,0,0,0.08);
  margin-top: 28px;
  border-radius: 2px;
  overflow: hidden;
}

.stat-cell {
  background: #f0ebe0;
  padding: 20px 12px;
  text-align: center;
}

.stat-value {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 32px;
  color: var(--cinnabar);
  line-height: 1;
}

.stat-label {
  font-size: 12px;
  color: #6b6560;
  margin-top: 8px;
  letter-spacing: 1px;
}

/* ===== FOOTER ===== */
.footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 40px 24px 60px;
  color: var(--paper-dim);
  font-size: 13px;
  letter-spacing: 2px;
}

.footer::before {
  content: '';
  display: block;
  width: 40px;
  height: 1px;
  background: var(--ink-600);
  margin: 0 auto 20px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .hero-totem { width: 240px; height: 240px; }
  .brand-name { letter-spacing: 6px; }
  .input-ritual { flex-direction: column; align-items: stretch; gap: 12px; }
  .ink-btn { width: 100%; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .scroll-paper { padding: 32px 24px; }
  .result-header { flex-direction: column; align-items: flex-start; gap: 12px; }
  .result-meta { margin-left: 0; }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- HERO -->
<section class="hero">
  <div class="hero-totem">
    <svg viewBox="0 0 320 320" fill="none">
      <defs>
        <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(201,168,76,0.08)"/>
          <stop offset="100%" stop-color="rgba(201,168,76,0)"/>
        </radialGradient>
        <filter id="softGlow">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- Outer glow -->
      <circle cx="160" cy="160" r="140" fill="url(#glowGrad)"/>
      <!-- Outer ring -->
      <circle cx="160" cy="160" r="130" stroke="var(--ink-600)" stroke-width="0.5" opacity="0.6"/>
      <circle cx="160" cy="160" r="120" stroke="var(--gold-dim)" stroke-width="0.5" opacity="0.4" stroke-dasharray="4 8"/>
      <!-- Main orbit -->
      <ellipse cx="160" cy="160" rx="100" ry="100" stroke="var(--gold)" stroke-width="1" opacity="0.3" filter="url(#softGlow)"/>
      <!-- Inner cross -->
      <line x1="160" y1="40" x2="160" y2="280" stroke="var(--ink-600)" stroke-width="0.5" opacity="0.5"/>
      <line x1="40" y1="160" x2="280" y2="160" stroke="var(--ink-600)" stroke-width="0.5" opacity="0.5"/>
      <!-- Diagonal -->
      <line x1="86" y1="86" x2="234" y2="234" stroke="var(--ink-600)" stroke-width="0.5" opacity="0.3"/>
      <line x1="234" y1="86" x2="86" y2="234" stroke="var(--ink-600)" stroke-width="0.5" opacity="0.3"/>
      <!-- Inner ring -->
      <circle cx="160" cy="160" r="50" stroke="var(--gold-dim)" stroke-width="0.5" opacity="0.5"/>
      <!-- Center dot -->
      <circle cx="160" cy="160" r="4" fill="var(--gold)" opacity="0.8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
      </circle>
      <!-- Orbiting dots -->
      <circle cx="160" cy="60" r="3" fill="var(--gold)" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0 160 160" to="360 160 160" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="260" r="2" fill="var(--cinnabar)" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="180 160 160" to="540 160 160" dur="15s" repeatCount="indefinite"/>
      </circle>
    </svg>
  </div>

  <h1 class="brand-name">循环巢</h1>
  <p class="brand-sub">迭代求解，周而复始</p>
  <p class="brand-desc">以东方循环之智，拆解万物之目标。输入一念，推演千遍，终得最优之解。</p>
  <div class="seal">巢</div>
  <div class="scroll-hint">向下展开</div>
</section>

<div class="divider"></div>

<!-- INPUT -->
<section class="input-section">
  <div class="section-label">立 意</div>
  <div class="input-ritual">
    <input type="text" id="goalInput" placeholder="写下你的目标，例如：三月之内习得数据分析之术...">
    <button class="ink-btn" id="startBtn" onclick="startLoop()">启 动</button>
  </div>
  <div class="quick-goals">
    <span class="goal-tag" onclick="setGoal('制定三十日健身之方')">三十日健身</span>
    <span class="goal-tag" onclick="setGoal('设计用户增长之策')">用户增长</span>
    <span class="goal-tag" onclick="setGoal('筹备考研复习之略')">考研复习</span>
    <span class="goal-tag" onclick="setGoal('撰写产品需求之章')">需求文档</span>
  </div>
</section>

<!-- VISUALIZATION -->
<section class="viz-section" id="vizSection">
  <div class="viz-canvas" id="vizCanvas">
    <svg viewBox="0 0 900 520" id="loopSvg" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="rgba(201,168,76,0)"/>
          <stop offset="50%" stop-color="rgba(201,168,76,0.8)"/>
          <stop offset="100%" stop-color="rgba(201,168,76,0)"/>
        </linearGradient>
        <filter id="nodeGlow">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="inkShadow">
          <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.4)"/>
        </filter>
      </defs>

      <!-- Background decorative rings -->
      <circle cx="450" cy="260" r="200" stroke="var(--ink-600)" stroke-width="0.5" opacity="0.3" fill="none"/>
      <circle cx="450" cy="260" r="160" stroke="var(--gold-dim)" stroke-width="0.5" opacity="0.2" fill="none" stroke-dasharray="3 6"/>

      <!-- Paths -->
      <path class="lp" id="p1" d="M 160 300 C 240 160, 340 160, 420 180" fill="none" stroke="var(--ink-600)" stroke-width="1.5"/>
      <path class="lp" id="p2" d="M 480 180 C 560 160, 640 180, 720 220" fill="none" stroke="var(--ink-600)" stroke-width="1.5"/>
      <path class="lp" id="p3" d="M 740 260 C 760 320, 700 380, 600 380" fill="none" stroke="var(--ink-600)" stroke-width="1.5"/>
      <path class="lp" id="p4" d="M 540 380 C 440 400, 340 360, 280 320" fill="none" stroke="var(--ink-600)" stroke-width="1.5"/>
      <path class="lp" id="p5" d="M 250 290 C 200 340, 140 340, 140 300" fill="none" stroke="var(--ink-600)" stroke-width="1.5"/>

      <!-- Loop back (dashed) -->
      <path d="M 280 320 C 320 420, 520 420, 540 380" fill="none" stroke="var(--ink-600)" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>

      <!-- Nodes -->
      <g class="ln" id="n-start" transform="translate(140,300)">
        <circle cx="0" cy="0" r="28" fill="var(--ink-800)" stroke="var(--ink-600)" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" fill="var(--paper-dim)" font-family="'Ma Shan Zheng',cursive" font-size="20">始</text>
        <text x="0" y="50" text-anchor="middle" fill="var(--paper-dim)" font-family="'Noto Serif SC',serif" font-size="12" letter-spacing="2">目标输入</text>
      </g>

      <g class="ln" id="n-init" transform="translate(450,180)">
        <circle cx="0" cy="0" r="28" fill="var(--ink-800)" stroke="var(--ink-600)" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" fill="var(--paper-dim)" font-family="'Ma Shan Zheng',cursive" font-size="20">构</text>
        <text x="0" y="50" text-anchor="middle" fill="var(--paper-dim)" font-family="'Noto Serif SC',serif" font-size="12" letter-spacing="2">初始化</text>
      </g>

      <g class="ln" id="n-check" transform="translate(740,240)">
        <circle cx="0" cy="0" r="28" fill="var(--ink-800)" stroke="var(--ink-600)" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" fill="var(--paper-dim)" font-family="'Ma Shan Zheng',cursive" font-size="20">判</text>
        <text x="0" y="50" text-anchor="middle" fill="var(--paper-dim)" font-family="'Noto Serif SC',serif" font-size="12" letter-spacing="2">条件判断</text>
      </g>

      <g class="ln" id="n-exec" transform="translate(600,380)">
        <circle cx="0" cy="0" r="28" fill="var(--ink-800)" stroke="var(--ink-600)" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" fill="var(--paper-dim)" font-family="'Ma Shan Zheng',cursive" font-size="20">演</text>
        <text x="0" y="50" text-anchor="middle" fill="var(--paper-dim)" font-family="'Noto Serif SC',serif" font-size="12" letter-spacing="2">执行推演</text>
      </g>

      <g class="ln" id="n-fix" transform="translate(280,320)">
        <circle cx="0" cy="0" r="28" fill="var(--ink-800)" stroke="var(--ink-600)" stroke-width="1.5"/>
        <text x="0" y="5" text-anchor="middle" fill="var(--paper-dim)" font-family="'Ma Shan Zheng',cursive" font-size="20">迭</text>
        <text x="0" y="50" text-anchor="middle" fill="var(--paper-dim)" font-family="'Noto Serif SC',serif" font-size="12" letter-spacing="2">修正迭代</text>
      </g>

      <!-- Result node (hidden) -->
      <g class="ln" id="n-result" transform="translate(450,260)" opacity="0">
        <circle cx="0" cy="0" r="36" fill="var(--ink-800)" stroke="var(--cinnabar)" stroke-width="2" filter="url(#nodeGlow)"/>
        <text x="0" y="6" text-anchor="middle" fill="var(--cinnabar)" font-family="'Ma Shan Zheng',cursive" font-size="24">果</text>
        <text x="0" y="58" text-anchor="middle" fill="var(--paper)" font-family="'Noto Serif SC',serif" font-size="12" letter-spacing="2">最优结果</text>
      </g>

      <!-- Traveling light -->
      <circle id="traveler" r="5" fill="var(--gold)" opacity="0" filter="url(#nodeGlow)"/>
    </svg>

    <div class="viz-info">
      <div>
        <div class="viz-info-main" id="infoMain">等待立意...</div>
        <div class="viz-info-sub" id="infoSub">循环巢引擎静候君令</div>
      </div>
      <div class="iteration-mark" id="iterMark">第一轮</div>
    </div>
  </div>
</section>

<!-- RESULT -->
<section class="result-section" id="resultSection">
  <div class="scroll-paper">
    <div class="paper-inner">
      <div class="result-header">
        <div class="result-seal">成</div>
        <h2>循环收敛</h2>
        <div class="result-meta" id="resultMeta">四轮迭代 | 置信度九十六</div>
      </div>
      <div id="resultBody"></div>
      <div class="stats-grid">
        <div class="stat-cell">
          <div class="stat-value" id="statIter">四</div>
          <div class="stat-label">迭代轮次</div>
        </div>
        <div class="stat-cell">
          <div class="stat-value" id="statSteps">八</div>
          <div class="stat-label">执行步骤</div>
        </div>
        <div class="stat-cell">
          <div class="stat-value" id="statScore">九六</div>
          <div class="stat-label">方案置信</div>
        </div>
        <div class="stat-cell">
          <div class="stat-value" id="statTime">二·三</div>
          <div class="stat-label">求解耗时</div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  循环巢 —— 参赛创意作品
</footer>

<script>
// ===== BACKGROUND INK PARTICLES =====
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let particles = [];

function resizeBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}
resizeBg();
window.addEventListener('resize', resizeBg);

class InkParticle {
  constructor() { this.reset(); }
  reset() {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.max(bgCanvas.width, bgCanvas.height) * 0.6 + Math.random() * 200;
    this.x = bgCanvas.width / 2 + Math.cos(angle) * dist;
    this.y = bgCanvas.height / 2 + Math.sin(angle) * dist;
    this.tx = bgCanvas.width / 2 + (Math.random() - 0.5) * 300;
    this.ty = bgCanvas.height / 2 + (Math.random() - 0.5) * 300;
    this.vx = 0; this.vy = 0;
    this.size = Math.random() * 1.5 + 0.3;
    this.opacity = Math.random() * 0.3 + 0.05;
    this.friction = 0.96 + Math.random() * 0.02;
  }
  update() {
    const dx = this.tx - this.x;
    const dy = this.ty - this.y;
    this.vx += dx * 0.0003;
    this.vy += dy * 0.0003;
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.x += this.vx;
    this.y += this.vy;
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2) {
      this.tx = bgCanvas.width / 2 + (Math.random() - 0.5) * 400;
      this.ty = bgCanvas.height / 2 + (Math.random() - 0.5) * 400;
    }
  }
  draw() {
    bgCtx.beginPath();
    bgCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    bgCtx.fillStyle = `rgba(201, 168, 76, ${this.opacity})`;
    bgCtx.fill();
  }
}

for (let i = 0; i < 80; i++) particles.push(new InkParticle());

function animateBg() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animateBg);
}
animateBg();

// ===== SCENARIOS =====
const scenarios = {
  '健身': {
    phases: [
      { title: '体能基线评估', desc: '评估当前体能水平、可用时间、器械条件，设定初始训练参数' },
      { title: '周期化训练设计', desc: '将三十日划分为适应期、强化期、冲刺期三个阶段' },
      { title: '动作与负荷匹配', desc: '根据目标肌群选择复合动作，按渐进超负荷原则配置重量与次数' },
      { title: '恢复与营养循环', desc: '嵌入休息日、拉伸、蛋白质摄入等恢复条件，形成完整闭环' }
    ],
    steps: '八',
    score: '九四'
  },
  '增长': {
    phases: [
      { title: '用户画像建模', desc: '基于现有数据构建核心用户画像与增长漏斗基线' },
      { title: '渠道实验矩阵', desc: '设计A/B测试矩阵，覆盖内容、投放、裂变、产品四个增长杠杆' },
      { title: '数据反馈迭代', desc: '按周回收实验数据，淘汰低效渠道，加码高效策略' },
      { title: '规模化复制', desc: '将验证有效的增长模式标准化，建立可复制的增长SOP' }
    ],
    steps: '九',
    score: '九一'
  },
  '考研': {
    phases: [
      { title: '学科能力诊断', desc: '通过模拟测试定位各科强弱项，建立起点基准线' },
      { title: '阶段规划拆解', desc: '将备考周期分为基础、强化、冲刺三阶段，设定里程碑' },
      { title: '动态科目调度', desc: '根据每周测试反馈，动态调整各科时间配比' },
      { title: '模考与复盘循环', desc: '每两周一次全真模考，分析错题分布，迭代复习重点' }
    ],
    steps: '十',
    score: '九六'
  },
  '文档': {
    phases: [
      { title: '需求边界梳理', desc: '明确功能范围、用户场景、非功能性需求，建立PRD框架' },
      { title: '流程与用例设计', desc: '绘制核心用户旅程图，编写关键用例与异常处理逻辑' },
      { title: '评审与缺口识别', desc: '组织评审会议，收集反馈，识别遗漏场景与逻辑矛盾' },
      { title: '迭代定稿与交付', desc: '根据评审意见修订文档，输出最终版并同步团队' }
    ],
    steps: '七',
    score: '九三'
  }
};

const hanziNum = ['零','一','二','三','四','五','六','七','八','九','十'];

function setGoal(text) {
  document.getElementById('goalInput').value = text;
}

function getScenario(goal) {
  if (goal.includes('健身')) return scenarios['健身'];
  if (goal.includes('增长') || goal.includes('方案') || goal.includes('策')) return scenarios['增长'];
  if (goal.includes('考研') || goal.includes('复习') || goal.includes('学')) return scenarios['考研'];
  if (goal.includes('文档') || goal.includes('PRD') || goal.includes('章')) return scenarios['文档'];
  return scenarios['考研'];
}

const nodeIds = ['n-start','n-init','n-check','n-exec','n-fix'];
const pathIds = ['p1','p2','p3','p4','p5'];
const nodeLabels = ['始','构','判','演','迭'];
const messages = [
  { main: '目标已立，正在解析其意...', sub: '循环巢正在理解你的目标意图' },
  { main: '初始化参数空间，加载知识图谱...', sub: '构建求解环境，准备迭代循环' },
  { main: '条件判断：当前是否满足终止条件？', sub: '检查收敛指标，决定是否继续迭代' },
  { main: '执行推演：在解空间中向前探索...', sub: '基于当前状态生成候选方案' },
  { main: '修正迭代：调整参数，优化方向...', sub: '根据反馈信号优化下一轮搜索方向' }
];

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function animateTraveler(pathId, duration) {
  return new Promise(resolve => {
    const path = document.getElementById(pathId);
    const dot = document.getElementById('traveler');
    const len = path.getTotalLength();
    dot.setAttribute('opacity', '1');
    const start = performance.now();
    function frame(now) {
      const t = Math.min((now - start) / duration, 1);
      const pt = path.getPointAtLength(t * len);
      dot.setAttribute('cx', pt.x);
      dot.setAttribute('cy', pt.y);
      if (t < 1) requestAnimationFrame(frame);
      else resolve();
    }
    requestAnimationFrame(frame);
  });
}

function activateNode(id, active) {
  const g = document.getElementById(id);
  const circle = g.querySelector('circle');
  const text = g.querySelector('text');
  if (active) {
    circle.setAttribute('stroke', 'var(--gold)');
    circle.setAttribute('stroke-width', '2');
    circle.setAttribute('fill', 'var(--ink-700)');
    text.setAttribute('fill', 'var(--gold)');
    circle.setAttribute('filter', 'url(#nodeGlow)');
  } else {
    circle.setAttribute('stroke', 'var(--ink-600)');
    circle.setAttribute('stroke-width', '1.5');
    circle.setAttribute('fill', 'var(--ink-800)');
    text.setAttribute('fill', 'var(--paper-dim)');
    circle.removeAttribute('filter');
  }
}

function activatePath(id, active) {
  const p = document.getElementById(id);
  if (active) {
    p.setAttribute('stroke', 'var(--gold)');
    p.setAttribute('stroke-width', '2');
    p.setAttribute('opacity', '0.7');
    p.setAttribute('filter', 'url(#nodeGlow)');
  } else {
    p.setAttribute('stroke', 'var(--ink-600)');
    p.setAttribute('stroke-width', '1.5');
    p.setAttribute('opacity', '1');
    p.removeAttribute('filter');
  }
}

async function startLoop() {
  const input = document.getElementById('goalInput');
  const btn = document.getElementById('startBtn');
  const goal = input.value.trim();
  if (!goal) { input.focus(); return; }

  btn.disabled = true;
  input.disabled = true;

  const viz = document.getElementById('vizSection');
  const result = document.getElementById('resultSection');
  const infoMain = document.getElementById('infoMain');
  const infoSub = document.getElementById('infoSub');
  const iterMark = document.getElementById('iterMark');

  viz.classList.add('active');
  result.classList.remove('active');
  iterMark.classList.add('show');

  // Reset
  nodeIds.forEach(id => activateNode(id, false));
  pathIds.forEach(pid => activatePath(pid, false));
  document.getElementById('n-result').setAttribute('opacity', '0');
  document.getElementById('traveler').setAttribute('opacity', '0');

  const scenario = getScenario(goal);

  // Scroll to viz
  viz.scrollIntoView({ behavior: 'smooth', block: 'start' });
  await sleep(400);

  // Run 4 iterations
  for (let iter = 1; iter <= 4; iter++) {
    iterMark.textContent = `第${hanziNum[iter]}轮`;

    for (let i = 0; i < nodeIds.length; i++) {
      activateNode(nodeIds[i], true);

      let msg = messages[i];
      if (iter === 4 && i === 2) {
        msg = { main: '条件判断：收敛指标已达标', sub: '当前方案质量满足终止条件，准备输出最优解' };
      }
      infoMain.textContent = msg.main;
      infoSub.textContent = msg.sub;

      if (i < pathIds.length) {
        activatePath(pathIds[i], true);
        await animateTraveler(pathIds[i], 700);
        activatePath(pathIds[i], false);
      }

      await sleep(400);

      if (iter < 4) {
        activateNode(nodeIds[i], false);
      }
    }

    if (iter < 4) {
      infoMain.textContent = `第${hanziNum[iter]}轮迭代完成，蓄势下一轮...`;
      infoSub.textContent = `已积累${hanziNum[iter]}轮反馈数据，正在优化搜索方向`;
      await sleep(500);
    }
  }

  // Show result
  const resultNode = document.getElementById('n-result');
  resultNode.setAttribute('opacity', '1');
  resultNode.style.transition = 'opacity 0.6s ease';
  infoMain.textContent = '循环收敛，最优方案已成';
  infoSub.textContent = '循环巢经过四轮迭代，寻得置信度最高之求解路径';
  iterMark.textContent = '已成';
  iterMark.style.color = 'var(--cinnabar)';

  await sleep(800);

  // Build result
  const rb = document.getElementById('resultBody');
  rb.innerHTML = '';
  scenario.phases.forEach((phase, idx) => {
    const div = document.createElement('div');
    div.className = 'phase-item';
    div.innerHTML = `
      <div class="phase-num">${hanziNum[idx + 1]}</div>
      <div>
        <div class="phase-title">${phase.title}</div>
        <div class="phase-desc">${phase.desc}</div>
      </div>
    `;
    rb.appendChild(div);
  });

  document.getElementById('statIter').textContent = '四';
  document.getElementById('statSteps').textContent = scenario.steps;
  document.getElementById('statScore').textContent = scenario.score;
  document.getElementById('statTime').textContent = (Math.random() > 0.5 ? '二·三' : '二·一');
  document.getElementById('resultMeta').textContent = `目标：${goal} | 四轮迭代 | 置信度${scenario.score}`;

  result.classList.add('active');
  await sleep(100);
  result.scrollIntoView({ behavior: 'smooth', block: 'start' });

  btn.disabled = false;
  input.disabled = false;
  btn.textContent = '再 启';
}

document.getElementById('goalInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startLoop();
});
</script>

</body>
</html>
