<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智协多维AI协同工作台</title>
  <style>
    :root {
      --bg: #eef5ff;
      --bg2: #ffffff;
      --ink: #102033;
      --muted: #61738a;
      --rule: #d7e4f3;
      --accent: #1677ff;
      --accent2: #00b7d8;
      --soft: rgba(22, 119, 255, 0.08);
      --shadow: 0 16px 42px rgba(13, 64, 126, 0.12);
      --shadow2: 0 8px 24px rgba(13, 64, 126, 0.10);
      --radius: 22px;
      --good: #14b8a6;
      --warn: #f59e0b;
      --pink: #ec4899;
      --purple: #8b5cf6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 8% 8%, rgba(22,119,255,0.16), transparent 28rem),
        radial-gradient(circle at 92% 2%, rgba(0,183,216,0.14), transparent 22rem),
        linear-gradient(135deg, var(--bg), #f8fbff 52%, #ecf7ff);
      overflow-x: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .app {
      width: min(1440px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      padding: 16px 20px;
      border: 1px solid rgba(215, 228, 243, 0.86);
      border-radius: 24px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow2);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background:
        linear-gradient(135deg, var(--accent), var(--accent2));
      position: relative;
      box-shadow: 0 10px 24px rgba(22,119,255,0.26);
      flex: 0 0 auto;
    }

    .logo::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 2px solid rgba(255,255,255,0.82);
      border-radius: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2.3vw, 30px);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      padding: 8px 12px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: rgba(255,255,255,0.72);
      white-space: nowrap;
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 0 6px rgba(20,184,166,0.14);
      animation: pulse 1.8s infinite;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .module {
      min-height: 520px;
      padding: 20px;
      border: 1px solid rgba(215, 228, 243, 0.92);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.84);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow2);
      transition: transform .28s ease, box-shadow .28s ease, border-color .28s ease;
      position: relative;
      overflow: hidden;
    }

    .module::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(22,119,255,0.10), transparent 34%),
        radial-gradient(circle at 90% 10%, rgba(0,183,216,0.12), transparent 18rem);
      opacity: 0;
      transition: opacity .28s ease;
    }

    .module:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow);
      border-color: rgba(22,119,255,0.28);
    }

    .module:hover::before {
      opacity: 1;
    }

    .module > * {
      position: relative;
      z-index: 1;
    }

    .module-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.01em;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn {
      border: 0;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      padding: 9px 12px;
      cursor: pointer;
      box-shadow: 0 9px 18px rgba(22,119,255,0.18);
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
      user-select: none;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(22,119,255,0.24);
    }

    .btn:active {
      transform: translateY(0) scale(.98);
      opacity: .9;
    }

    .btn.ghost {
      color: var(--accent);
      background: var(--soft);
      box-shadow: none;
      border: 1px solid rgba(22,119,255,0.18);
    }

    .mini-status {
      min-height: 24px;
      color: var(--accent);
      font-size: 13px;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mini-status.active::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent2);
      animation: blink 0.8s ease-in-out infinite alternate;
    }

    .doc-board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      min-height: 238px;
    }

    .doc-card {
      border: 1px solid var(--rule);
      border-radius: 16px;
      background: linear-gradient(180deg, #fff, #f8fbff);
      padding: 13px;
      box-shadow: 0 10px 26px rgba(32, 72, 132, 0.06);
      transition: transform .22s ease, border-color .22s ease, background .22s ease;
      cursor: grab;
    }

    .doc-card.dragging {
      transform: rotate(-1.5deg) scale(1.02);
      border-color: var(--accent);
      opacity: .72;
    }

    .doc-type {
      display: inline-flex;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      background: var(--soft);
      padding: 5px 8px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .doc-card h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .doc-lines {
      display: grid;
      gap: 7px;
    }

    .line {
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #cfe1f8, #edf5ff);
    }

    .line.short { width: 64%; }
    .line.mid { width: 82%; }
    .line.tiny { width: 46%; }

    .merge-zone {
      margin-top: 14px;
      min-height: 135px;
      padding: 14px;
      border: 1px dashed rgba(22,119,255,0.42);
      border-radius: 18px;
      background: rgba(22,119,255,0.055);
      transition: background .22s ease, border-color .22s ease, transform .22s ease;
    }

    .merge-zone.over {
      background: rgba(0,183,216,0.12);
      border-color: var(--accent2);
      transform: scale(1.01);
    }

    .merged-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .merged-content {
      display: grid;
      gap: 8px;
      color: var(--ink);
      font-size: 14px;
    }

    .merged-chip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(215,228,243,0.76);
      animation: slideIn .28s ease both;
    }

    .collab-area {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 14px;
      min-height: 420px;
    }

    .paper {
      position: relative;
      border: 1px solid var(--rule);
      border-radius: 18px;
      background: #fff;
      padding: 18px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.72);
    }

    .cursor-tag {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #fff;
      padding: 4px 8px;
      border-radius: 999px;
      animation: floatCursor 3.2s ease-in-out infinite;
      box-shadow: 0 8px 20px rgba(32, 72, 132, .16);
    }

    .cursor-tag::before {
      content: "";
      width: 0;
      height: 0;
      border-left: 7px solid currentColor;
      border-top: 7px solid transparent;
      transform: rotate(45deg);
      filter: brightness(0.85);
    }

    .cursor-a { left: 64%; top: 15%; background: var(--accent); color: var(--accent); }
    .cursor-b { left: 20%; top: 62%; background: var(--purple); color: var(--purple); animation-delay: .8s; }
    .cursor-c { left: 53%; top: 78%; background: var(--pink); color: var(--pink); animation-delay: 1.4s; }
    .cursor-tag span { color: #fff; }

    .editable-text {
      position: relative;
      display: grid;
      gap: 10px;
      padding-top: 30px;
      line-height: 1.7;
      font-size: 14px;
      color: #27415f;
    }

    .selectable {
      border-radius: 8px;
      padding: 4px 6px;
      cursor: pointer;
      transition: background .18s ease, box-shadow .18s ease;
    }

    .selectable:hover,
    .selectable.active {
      background: rgba(22,119,255,0.10);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .live-edit {
      display: inline-block;
      min-width: 7px;
      height: 1.1em;
      border-right: 2px solid var(--accent2);
      vertical-align: -2px;
      animation: caret .75s steps(2, start) infinite;
    }

    .comments {
      border: 1px solid var(--rule);
      border-radius: 18px;
      background: linear-gradient(180deg, #fff, #f9fcff);
      padding: 14px;
      overflow: hidden;
    }

    .comment-list {
      display: grid;
      gap: 10px;
      max-height: 302px;
      overflow: auto;
      padding-right: 4px;
    }

    .comment {
      padding: 11px;
      border: 1px solid rgba(215,228,243,.9);
      border-radius: 14px;
      background: rgba(22,119,255,0.045);
      animation: slideIn .26s ease both;
    }

    .comment-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
    }

    .comment textarea {
      width: 100%;
      resize: none;
      min-height: 54px;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px;
      outline: none;
      color: var(--ink);
      background: rgba(255,255,255,0.72);
      transition: border-color .18s ease, background .18s ease;
    }

    .comment textarea:focus {
      border-color: rgba(22,119,255,.45);
      background: #fff;
    }

    .ai-layout {
      display: grid;
      grid-template-columns: .82fr 1.18fr;
      gap: 14px;
      min-height: 420px;
    }

    .source-box,
    .minutes-input {
      border: 1px solid var(--rule);
      border-radius: 18px;
      background: #fff;
      padding: 14px;
      min-height: 100%;
    }

    .upload-panel {
      min-height: 240px;
      border: 1px dashed rgba(22,119,255,.42);
      border-radius: 16px;
      background: var(--soft);
      padding: 14px;
      color: var(--muted);
      font-size: 14px;
      display: grid;
      align-content: center;
      gap: 10px;
      text-align: center;
      transition: border-color .2s ease, background .2s ease;
    }

    .upload-panel.loaded {
      text-align: left;
      align-content: start;
      background: rgba(255,255,255,.78);
      border-style: solid;
    }

    .upload-lines {
      display: grid;
      gap: 9px;
      margin-top: 4px;
    }

    .mindmap {
      position: relative;
      border: 1px solid var(--rule);
      border-radius: 18px;
      background:
        linear-gradient(rgba(22,119,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(22,119,255,0.035) 1px, transparent 1px),
        #fff;
      background-size: 22px 22px;
      padding: 18px;
      min-height: 354px;
      overflow: auto;
    }

    .map-stage {
      min-width: 420px;
      min-height: 314px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map-empty {
      color: var(--muted);
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(255,255,255,.82);
      border: 1px solid var(--rule);
    }

    .tree {
      position: relative;
      display: flex;
      align-items: center;
      gap: 34px;
      animation: pop .28s ease both;
    }

    .node {
      border: 1px solid rgba(22,119,255,.24);
      border-radius: 15px;
      background: rgba(255,255,255,.92);
      color: var(--ink);
      padding: 10px 12px;
      box-shadow: 0 10px 24px rgba(32,72,132,.08);
      cursor: pointer;
      min-width: 102px;
      text-align: center;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
      position: relative;
    }

    .node:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: #fff;
    }

    .root-node {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      min-width: 118px;
      font-weight: 700;
    }

    .branches {
      display: grid;
      gap: 16px;
      position: relative;
    }

    .branch {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .branch::before {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--accent);
      opacity: .55;
    }

    .children {
      display: grid;
      gap: 8px;
      transition: all .22s ease;
    }

    .children.collapsed {
      opacity: 0;
      transform: translateX(-10px);
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .child {
      color: var(--muted);
      font-size: 13px;
      min-width: 88px;
      padding: 8px 10px;
      border-color: rgba(0,183,216,.26);
    }

    .meeting-layout {
      display: grid;
      grid-template-columns: .96fr 1.04fr;
      gap: 14px;
      min-height: 420px;
    }

    .chat-box {
      border: 1px solid var(--rule);
      border-radius: 16px;
      min-height: 258px;
      background: #fff;
      padding: 12px;
      overflow: auto;
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .bubble {
      width: fit-content;
      max-width: 88%;
      border-radius: 14px 14px 14px 4px;
      padding: 9px 11px;
      background: rgba(22,119,255,.08);
      color: #294360;
      font-size: 13px;
      line-height: 1.5;
      animation: slideIn .22s ease both;
    }

    .bubble.me {
      justify-self: end;
      border-radius: 14px 14px 4px 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
    }

    .chat-input {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .chat-input input {
      min-width: 0;
      flex: 1;
      border: 1px solid var(--rule);
      border-radius: 13px;
      padding: 10px 12px;
      outline: none;
      color: var(--ink);
      background: rgba(255,255,255,.92);
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .chat-input input:focus {
      border-color: rgba(22,119,255,.55);
      box-shadow: 0 0 0 4px rgba(22,119,255,.08);
    }

    .minutes-card {
      border: 1px solid var(--rule);
      border-radius: 18px;
      background: #fff;
      padding: 16px;
      overflow: auto;
    }

    .minutes-empty {
      min-height: 340px;
      display: grid;
      place-items: center;
      color: var(--muted);
      border: 1px dashed rgba(22,119,255,.32);
      border-radius: 16px;
      background: var(--soft);
    }

    .minutes-result {
      display: grid;
      gap: 12px;
      animation: pop .25s ease both;
    }

    .summary-row {
      border: 1px solid rgba(215,228,243,.88);
      border-radius: 14px;
      padding: 12px;
      background: linear-gradient(180deg, rgba(22,119,255,.045), rgba(255,255,255,.94));
    }

    .summary-row strong {
      display: block;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .summary-row ul {
      margin: 0;
      padding-left: 18px;
      color: #314b69;
      line-height: 1.65;
      font-size: 14px;
    }

    .processing {
      position: relative;
      overflow: hidden;
    }

    .processing::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 20%, rgba(255,255,255,.62) 45%, transparent 70%);
      transform: translateX(-100%);
      animation: scan 1.15s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 5px rgba(20,184,166,0.12); }
      50% { box-shadow: 0 0 0 9px rgba(20,184,166,0.03); }
    }

    @keyframes blink {
      from { opacity: .35; transform: scale(.8); }
      to { opacity: 1; transform: scale(1.1); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.96); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes scan {
      to { transform: translateX(100%); }
    }

    @keyframes caret {
      50% { border-color: transparent; }
    }

    @keyframes floatCursor {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(10px, 6px); }
    }

    @media (max-width: 1180px) {
      .grid,
      .collab-area,
      .ai-layout,
      .meeting-layout {
        grid-template-columns: 1fr;
      }

      .module {
        min-height: auto;
      }
    }

    @media (max-width: 720px) {
      .app {
        width: min(100% - 24px, 1440px);
        padding-top: 14px;
      }

      .topbar,
      .module-head {
        align-items: flex-start;
        flex-direction: column;
      }

      h1 {
        white-space: normal;
      }

      .tools {
        justify-content: flex-start;
      }

      .doc-board {
        grid-template-columns: 1fr;
      }

      .module {
        padding: 16px;
      }

      .chat-input {
        flex-direction: column;
      }

      .map-stage {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <h1>智协多维AI协同工作台</h1>
      </div>
      <div class="status-pill"><span class="pulse"></span><span>Auto 演示运行中</span></div>
    </header>

    <section class="grid" aria-label="功能演示区">
      <article class="module" id="module-docs">
        <div class="module-head">
          <h2>多文档一体化编辑</h2>
          <div class="tools">
            <button class="btn" id="importDocs">导入</button>
            <button class="btn ghost" id="mergeDocs">合并</button>
          </div>
        </div>
        <p class="mini-status" id="docStatus"></p>
        <div class="doc-board" id="docBoard"></div>
        <div class="merge-zone" id="mergeZone">
          <div class="merged-title">
            <span>合并区</span>
            <span id="mergeCount">0/3</span>
          </div>
          <div class="merged-content" id="mergedContent"></div>
        </div>
      </article>

      <article class="module" id="module-collab">
        <div class="module-head">
          <h2>多人实时在线协同批注</h2>
          <div class="tools">
            <button class="btn" id="addComment">新增批注</button>
            <button class="btn ghost" id="simulateEdit">多人编辑</button>
          </div>
        </div>
        <p class="mini-status" id="collabStatus"></p>
        <div class="collab-area">
          <div class="paper">
            <div class="cursor-tag cursor-a"><span>产品</span></div>
            <div class="cursor-tag cursor-b"><span>研发</span></div>
            <div class="cursor-tag cursor-c"><span>运营</span></div>
            <div class="editable-text" id="editableText">
              <span class="selectable active">目标：将多个项目资料统一整理为可协同编辑的执行稿。</span>
              <span class="selectable">资料：包含需求记录、合同 PDF、会议纪要和个人笔记。</span>
              <span class="selectable">流程：在线标注差异内容，并同步多人修改意见。</span>
              <span class="selectable">输出：生成结构化文档、任务项和追踪清单。</span>
            </div>
          </div>
          <aside class="comments">
            <div class="comment-list" id="commentList">
              <div class="comment">
                <div class="comment-top"><span>产品</span><span>刚刚</span></div>
                <textarea>建议补充资料来源标识，便于后续追踪。</textarea>
              </div>
            </div>
          </aside>
        </div>
      </article>

      <article class="module" id="module-ai">
        <div class="module-head">
          <h2>AI智能资料梳理</h2>
          <div class="tools">
            <button class="btn" id="uploadMaterial">上传</button>
            <button class="btn ghost" id="generateMap">AI生成</button>
          </div>
        </div>
        <p class="mini-status" id="aiStatus"></p>
        <div class="ai-layout">
          <div class="source-box">
            <div class="upload-panel" id="uploadPanel">
              <strong>文本素材</strong>
              <span>点击上传生成模拟素材</span>
            </div>
          </div>
          <div class="mindmap">
            <div class="map-stage" id="mapStage">
              <div class="map-empty">思维导图待生成</div>
            </div>
          </div>
        </div>
      </article>

      <article class="module" id="module-meeting">
        <div class="module-head">
          <h2>会议聊天纪要转化</h2>
          <div class="tools">
            <button class="btn" id="convertMinutes">转换纪要</button>
          </div>
        </div>
        <p class="mini-status" id="meetingStatus"></p>
        <div class="meeting-layout">
          <div class="minutes-input">
            <div class="chat-box" id="chatBox">
              <div class="bubble">本周先完成资料导入和文档合并演示。</div>
              <div class="bubble me">我负责协同批注模块的交互联调。</div>
              <div class="bubble">AI 导图需要支持节点展开和收缩。</div>
              <div class="bubble me">会议纪要输出要包含重点、任务和风险。</div>
            </div>
            <div class="chat-input">
              <input id="chatInput" type="text" value="明天 18:00 前提交社区演示版本。" aria-label="聊天输入" />
              <button class="btn" id="sendChat">发送</button>
            </div>
          </div>
          <div class="minutes-card" id="minutesCard">
            <div class="minutes-empty">结构化纪要待生成</div>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => Array.from(document.querySelectorAll(selector));

    const docs = [
      { type: "WORD", title: "项目执行稿", body: "目标与任务安排" },
      { type: "PDF", title: "资料归档件", body: "合同与参考条款" },
      { type: "NOTE", title: "会议笔记", body: "讨论结论与待办" }
    ];

    let imported = false;
    let mergedSet = new Set();
    let commentIndex = 1;
    let materialReady = false;
    let typingTimer = null;

    function setStatus(id, text, active = true) {
      const el = $(id);
      el.textContent = text;
      el.classList.toggle("active", active);
      clearTimeout(el._timer);
      el._timer = setTimeout(() => {
        el.textContent = "";
        el.classList.remove("active");
      }, 2200);
    }

    function renderDocs() {
      const board = $("#docBoard");
      board.innerHTML = docs.map((doc, index) => `
        <div class="doc-card" draggable="true" data-index="${index}">
          <span class="doc-type">${doc.type}</span>
          <h3>${doc.title}</h3>
          <div class="doc-lines">
            <span class="line"></span>
            <span class="line mid"></span>
            <span class="line short"></span>
            <span class="line tiny"></span>
          </div>
        </div>
      `).join("");

      $$(".doc-card").forEach(card => {
        card.addEventListener("dragstart", (event) => {
          card.classList.add("dragging");
          event.dataTransfer.setData("text/plain", card.dataset.index);
        });
        card.addEventListener("dragend", () => card.classList.remove("dragging"));
      });
    }

    function mergeDoc(index) {
      const doc = docs[index];
      if (!doc || mergedSet.has(index)) return;
      mergedSet.add(index);
      const chip = document.createElement("div");
      chip.className = "merged-chip";
      chip.innerHTML = `<span>${doc.title}</span><small>${doc.body}</small>`;
      $("#mergedContent").appendChild(chip);
      $("#mergeCount").textContent = `${mergedSet.size}/3`;
    }

    $("#importDocs").addEventListener("click", () => {
      imported = true;
      mergedSet.clear();
      $("#mergedContent").innerHTML = "";
      $("#mergeCount").textContent = "0/3";
      $("#docBoard").classList.add("processing");
      renderDocs();
      setStatus("#docStatus", "正在导入 Word、PDF、笔记文本");
      setTimeout(() => {
        $("#docBoard").classList.remove("processing");
        setStatus("#docStatus", "多文件已分栏同屏展示", false);
      }, 900);
    });

    $("#mergeDocs").addEventListener("click", () => {
      if (!imported) renderDocs();
      $("#mergeZone").classList.add("processing");
      docs.forEach((_, index) => setTimeout(() => mergeDoc(index), index * 220));
      setStatus("#docStatus", "正在合并文档内容");
      setTimeout(() => $("#mergeZone").classList.remove("processing"), 900);
    });

    $("#mergeZone").addEventListener("dragover", (event) => {
      event.preventDefault();
      $("#mergeZone").classList.add("over");
    });

    $("#mergeZone").addEventListener("dragleave", () => $("#mergeZone").classList.remove("over"));

    $("#mergeZone").addEventListener("drop", (event) => {
      event.preventDefault();
      $("#mergeZone").classList.remove("over");
      mergeDoc(Number(event.dataTransfer.getData("text/plain")));
      setStatus("#docStatus", "拖拽内容已加入合并区", false);
    });

    $$(".selectable").forEach(item => {
      item.addEventListener("click", () => {
        $$(".selectable").forEach(s => s.classList.remove("active"));
        item.classList.add("active");
        setStatus("#collabStatus", "已选中文本，可新增或修改批注", false);
      });
    });

    $("#addComment").addEventListener("click", () => {
      const selected = $(".selectable.active")?.textContent || "当前段落";
      commentIndex += 1;
      const roles = ["研发", "设计", "运营", "产品"];
      const comment = document.createElement("div");
      comment.className = "comment";
      comment.innerHTML = `
        <div class="comment-top"><span>${roles[commentIndex % roles.length]}</span><span>同步中</span></div>
        <textarea>针对“${selected.slice(0, 16)}...”补充协同批注。</textarea>
      `;
      $("#commentList").prepend(comment);
      setStatus("#collabStatus", "批注已同步到多人协同面板");
    });

    $("#simulateEdit").addEventListener("click", () => {
      const target = $(".selectable.active") || $$(".selectable")[0];
      const oldHTML = target.innerHTML.replace(/<span class="live-edit"><\/span>/g, "");
      target.classList.add("active");
      target.innerHTML = oldHTML + '<span class="live-edit"></span>';
      $(".paper").classList.add("processing");
      setStatus("#collabStatus", "多人光标与编辑状态实时同步");
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        target.innerHTML = oldHTML + " 已更新。";
        $(".paper").classList.remove("processing");
      }, 1500);
    });

    $("#uploadMaterial").addEventListener("click", () => {
      materialReady = true;
      const panel = $("#uploadPanel");
      panel.classList.add("loaded");
      panel.innerHTML = `
        <strong>文本素材</strong>
        <div class="upload-lines">
          <span>项目资料：协同编辑、资料归档、任务跟踪</span>
          <span>会议记录：导入、批注、AI梳理、纪要转换</span>
          <span>输出要求：结构化、可展开、可复用</span>
        </div>
      `;
      setStatus("#aiStatus", "文本素材已上传", false);
    });

    function renderMindMap() {
      $("#mapStage").innerHTML = `
        <div class="tree">
          <div class="node root-node">资料中心</div>
          <div class="branches">
            <div class="branch">
              <div class="node branch-node">文档</div>
              <div class="children">
                <div class="node child">Word</div>
                <div class="node child">PDF</div>
              </div>
            </div>
            <div class="branch">
              <div class="node branch-node">协同</div>
              <div class="children">
                <div class="node child">批注</div>
                <div class="node child">光标</div>
              </div>
            </div>
            <div class="branch">
              <div class="node branch-node">输出</div>
              <div class="children">
                <div class="node child">纪要</div>
                <div class="node child">任务</div>
              </div>
            </div>
          </div>
        </div>
      `;

      $$(".branch-node").forEach(node => {
        node.addEventListener("click", () => {
          const children = node.nextElementSibling;
          children.classList.toggle("collapsed");
          setStatus("#aiStatus", children.classList.contains("collapsed") ? "节点已收缩" : "节点已展开", false);
        });
      });
    }

    $("#generateMap").addEventListener("click", () => {
      if (!materialReady) $("#uploadMaterial").click();
      $("#mapStage").classList.add("processing");
      $("#mapStage").innerHTML = `<div class="map-empty">AI 正在生成导图</div>`;
      setStatus("#aiStatus", "AI 正在梳理资料结构");
      setTimeout(() => {
        $("#mapStage").classList.remove("processing");
        renderMindMap();
        setStatus("#aiStatus", "思维导图已生成，点击节点展开/收缩", false);
      }, 1000);
    });

    function sendChat() {
      const input = $("#chatInput");
      const text = input.value.trim();
      if (!text) return;
      const bubble = document.createElement("div");
      bubble.className = "bubble me";
      bubble.textContent = text;
      $("#chatBox").appendChild(bubble);
      $("#chatBox").scrollTop = $("#chatBox").scrollHeight;
      input.value = "";
      setStatus("#meetingStatus", "聊天内容已加入待转换队列", false);
    }

    $("#sendChat").addEventListener("click", sendChat);
    $("#chatInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendChat();
    });

    $("#convertMinutes").addEventListener("click", () => {
      const card = $("#minutesCard");
      card.classList.add("processing");
      setStatus("#meetingStatus", "正在提取对话重点并生成纪要");
      setTimeout(() => {
        card.classList.remove("processing");
        card.innerHTML = `
          <div class="minutes-result">
            <div class="summary-row">
              <strong>会议重点</strong>
              <ul>
                <li>完成资料导入与文档合并演示。</li>
                <li>联调多人协同批注和光标同步。</li>
                <li>AI 导图支持节点展开与收缩。</li>
              </ul>
            </div>
            <div class="summary-row">
              <strong>任务分配</strong>
              <ul>
                <li>协同批注交互联调：演示成员。</li>
                <li>社区演示版本：明天 18:00 前提交。</li>
              </ul>
            </div>
            <div class="summary-row">
              <strong>风险跟进</strong>
              <ul>
                <li>纪要格式需保持结构化输出。</li>
                <li>导图节点交互需确保可点击反馈。</li>
              </ul>
            </div>
          </div>
        `;
        setStatus("#meetingStatus", "结构化会议纪要已生成", false);
      }, 1050);
    });

    renderDocs();
  </script>
</body>
</html>
