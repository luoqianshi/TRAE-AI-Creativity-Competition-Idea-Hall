<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 面试助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6fa;
    display: flex;
    height: 100vh;
    overflow: hidden;
    color: #333;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px;
    background: #1a1d2e;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    padding: 0;
  }

  .sidebar-logo {
    padding: 24px 20px 20px;
    font-size: 18px;
    font-weight: 700;
    color: #4a9eff;
    letter-spacing: 0.5px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 8px;
  }

  .sidebar-logo span { color: #fff; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    color: #9ca3c0;
    font-size: 14px;
    cursor: pointer;
    border-radius: 6px;
    margin: 2px 10px;
    transition: all 0.15s;
    text-decoration: none;
  }

  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }

  .nav-item.active {
    background: rgba(74,158,255,0.15);
    color: #4a9eff;
  }

  .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }

  .sidebar-footer {
    margin-top: auto;
    padding: 16px 20px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .logout-btn {
    color: #9ca3c0;
    font-size: 13px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    transition: color 0.15s;
  }
  .logout-btn:hover { color: #fff; }

  /* ── Main ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    height: 56px;
    background: #fff;
    border-bottom: 1px solid #e8eaf0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    flex-shrink: 0;
  }

  .topbar-title {
    font-size: 18px;
    font-weight: 600;
    color: #1a1d2e;
  }

  .topbar-user {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: #555;
  }

  .avatar {
    width: 34px;
    height: 34px;
    background: #4a9eff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
  }

  /* ── Stat Cards ── */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: #fff;
    border-radius: 10px;
    padding: 20px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }

  .stat-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .stat-icon.blue   { background: #e8f2ff; }
  .stat-icon.green  { background: #e6f9f0; }
  .stat-icon.orange { background: #fff4e6; }
  .stat-icon.pink   { background: #fff0f3; }

  .stat-info { display: flex; flex-direction: column; }
  .stat-label { font-size: 12px; color: #9ca3c0; margin-bottom: 4px; }
  .stat-value { font-size: 26px; font-weight: 700; color: #1a1d2e; line-height: 1; }

  /* ── Quick Actions ── */
  .section-card {
    background: #fff;
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }

  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: #1a1d2e;
    margin-bottom: 16px;
  }

  .quick-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid #d0d5e8;
    background: #fff;
    color: #444;
    transition: all 0.15s;
    font-family: inherit;
  }

  .btn:hover { border-color: #4a9eff; color: #4a9eff; }

  .btn.primary {
    background: #4a9eff;
    border-color: #4a9eff;
    color: #fff;
  }

  .btn.primary:hover { background: #2e8bff; border-color: #2e8bff; }

  /* ── Table ── */
  .table-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .view-all {
    font-size: 13px;
    color: #4a9eff;
    cursor: pointer;
    text-decoration: none;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    text-align: left;
    font-size: 12px;
    color: #9ca3c0;
    font-weight: 500;
    padding: 8px 12px;
    border-bottom: 1px solid #f0f2f7;
  }

  tbody tr {
    transition: background 0.1s;
  }

  tbody tr:hover { background: #f8f9fd; }

  tbody td {
    padding: 13px 12px;
    font-size: 13px;
    color: #444;
    border-bottom: 1px solid #f0f2f7;
  }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
  }

  .badge.done    { color: #22c55e; background: #f0fdf4; }
  .badge.ongoing { color: #f59e0b; background: #fffbeb; }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo">AI <span>面试助手</span></div>

  <nav>
    <a class="nav-item active">
      <span class="icon">🏠</span> 工作台
    </a>
    <a class="nav-item">
      <span class="icon">🎙️</span> 面试模式
    </a>
    <a class="nav-item">
      <span class="icon">📄</span> 简历管理
    </a>
    <a class="nav-item">
      <span class="icon">🏢</span> 公司管理
    </a>
    <a class="nav-item">
      <span class="icon">🕐</span> 面试记录
    </a>
    <a class="nav-item">
      <span class="icon">📚</span> 知识库
    </a>
    <a class="nav-item">
      <span class="icon">👤</span> 个人设置
    </a>
  </nav>

  <div class="sidebar-footer">
    <button class="logout-btn">退出登录</button>
  </div>
</aside>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <span class="topbar-title">工作台</span>
    <div class="topbar-user">
      lp260
      <div class="avatar">L</div>
    </div>
  </div>

  <div class="content">

    <!-- Stat Cards -->
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-icon blue">🎙️</div>
        <div class="stat-info">
          <span class="stat-label">面试次数</span>
          <span class="stat-value">6</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">📄</div>
        <div class="stat-info">
          <span class="stat-label">简历数量</span>
          <span class="stat-value">1</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">🏢</div>
        <div class="stat-info">
          <span class="stat-label">目标公司</span>
          <span class="stat-value">1</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon pink">💬</div>
        <div class="stat-info">
          <span class="stat-label">问答总数</span>
          <span class="stat-value">18</span>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="section-card">
      <div class="section-title">快捷操作</div>
      <div class="quick-actions">
        <button class="btn primary">🎙️ 开始面试</button>
        <button class="btn">⬆️ 上传简历</button>
        <button class="btn">＋ 添加公司</button>
        <button class="btn">🕐 面试记录</button>
      </div>
    </div>

    <!-- Recent Interviews -->
    <div class="section-card">
      <div class="table-header">
        <span class="section-title" style="margin-bottom:0">最近面试</span>
        <a class="view-all">查看全部</a>
      </div>
      <table>
        <thead>
          <tr>
            <th>公司</th>
            <th>岗位</th>
            <th>问答数</th>
            <th>状态</th>
            <th>时间</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>未指定</td>
            <td>-</td>
            <td>4</td>
            <td><span class="badge done">已完成</span></td>
            <td>2026/02/07 10:40</td>
          </tr>
          <tr>
            <td>未指定</td>
            <td>-</td>
            <td>5</td>
            <td><span class="badge done">已完成</span></td>
            <td>2026/02/07 00:14</td>
          </tr>
          <tr>
            <td>未指定</td>
            <td>-</td>
            <td>4</td>
            <td><span class="badge ongoing">进行中</span></td>
            <td>2026/02/06 23:36</td>
          </tr>
          <tr>
            <td>未指定</td>
            <td>-</td>
            <td>4</td>
            <td><span class="badge done">已完成</span></td>
            <td>2026/02/06 21:57</td>
          </tr>
          <tr>
            <td>未指定</td>
            <td>-</td>
            <td>1</td>
            <td><span class="badge ongoing">进行中</span></td>
            <td>2026/02/06 21:55</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

</body>
</html>
