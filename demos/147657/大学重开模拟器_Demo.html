<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大学人生重开模拟器</title>
<!-- Google Fonts: Noto Serif SC (剧情文字) + Noto Sans SC (UI元素) -->
<style>
/* ============================================
   大学人生重开模拟器 - 视觉小说风格 Demo
   参考《拣爱》风格，全屏沉浸式体验
   ============================================ */

/* --- 字体引入 --- */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap');

/* --- CSS 变量定义 --- */
:root {
  --bg-dark: #1a1a2e;
  --bg-card: rgba(255, 255, 255, 0.05);
  --bg-card-hover: rgba(255, 255, 255, 0.10);
  --text-main: #e8e8f0;
  --text-dim: #9999aa;
  --text-accent: #c4b5fd;
  --glass-border: rgba(255, 255, 255, 0.12);
  --glass-blur: 16px;

  /* 学期主题色 */
  --sem1-color: #4A90D9;
  --sem2-color: #22C55E;
  --sem3-color: #F59E0B;
  --sem4-color: #8B5CF6;

  --current-sem-color: #4A90D9;
  --transition-duration: 0.8s;
}

/* --- 基础重置 --- */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-dark);
  color: var(--text-main);
  font-family: 'Noto Sans SC', sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* --- 全屏容器 --- */
#game-container {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* --- 背景装饰：浮动几何圆形 --- */
.bg-decoration {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.floating-circle {
  position: absolute;
  border-radius: 50%;
  opacity: 0.04;
  animation: floatCircle linear infinite;
}

@keyframes floatCircle {
  0% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-40px) rotate(180deg); }
  100% { transform: translateY(0) rotate(360deg); }
}

/* --- 背景渐变层 --- */
.bg-gradient {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse at 20% 80%, rgba(74, 144, 217, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(26, 26, 46, 1) 0%, rgba(10, 10, 20, 1) 100%);
  transition: background var(--transition-duration) ease;
}

/* --- 场景（Screen）通用样式 --- */
.screen {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
}

.screen.active {
  opacity: 1;
  pointer-events: auto;
}

/* --- 居中内容区域 --- */
.content-center {
  max-width: 720px;
  width: 90%;
  text-align: center;
  position: relative;
}

/* ============================================
   标题画面
   ============================================ */
#title-screen .game-title {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(2rem, 6vw, 3.5rem);
  font-weight: 700;
  letter-spacing: 0.15em;
  color: var(--text-main);
  margin-bottom: 16px;
  min-height: 1.4em;
  line-height: 1.4;
}

#title-screen .game-subtitle {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: clamp(0.85rem, 2.5vw, 1.1rem);
  font-weight: 300;
  color: var(--text-dim);
  opacity: 0;
  transition: opacity 1s ease;
  margin-bottom: 48px;
  letter-spacing: 0.3em;
}

#title-screen .game-subtitle.visible {
  opacity: 1;
}

.start-btn {
  display: inline-block;
  padding: 14px 48px;
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  background: var(--bg-card);
  color: var(--text-main);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 1rem;
  font-weight: 400;
  letter-spacing: 0.2em;
  cursor: pointer;
  animation: breatheGlow 2.5s ease-in-out infinite;
  transition: transform 0.15s ease, background 0.3s ease;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.start-btn:hover {
  background: var(--bg-card-hover);
}

.start-btn:active {
  transform: scale(0.95);
}

@keyframes breatheGlow {
  0%, 100% {
    box-shadow: 0 0 20px rgba(139, 92, 246, 0.15), 0 0 40px rgba(139, 92, 246, 0.05);
    border-color: rgba(139, 92, 246, 0.3);
  }
  50% {
    box-shadow: 0 0 30px rgba(139, 92, 246, 0.3), 0 0 60px rgba(139, 92, 246, 0.1);
    border-color: rgba(139, 92, 246, 0.5);
  }
}

/* ============================================
   属性分配画面
   ============================================ */
#stats-screen .content-center {
  text-align: left;
}

#stats-screen .stats-title {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(1.2rem, 3.5vw, 1.8rem);
  font-weight: 600;
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 0.1em;
}

#stats-screen .stats-desc {
  text-align: center;
  color: var(--text-dim);
  font-size: 0.9rem;
  margin-bottom: 36px;
  font-weight: 300;
}

.stats-grid {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 16px;
}

.stat-label {
  width: 70px;
  flex-shrink: 0;
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--text-accent);
  text-align: right;
}

.stat-bar-container {
  flex: 1;
  height: 32px;
  background: rgba(255, 255, 255, 0.04);
  border-radius: 6px;
  overflow: hidden;
  position: relative;
  border: 1px solid var(--glass-border);
}

.stat-bar-fill {
  height: 100%;
  border-radius: 5px;
  width: 0%;
  transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1);
  position: relative;
}

.stat-bar-fill.intelligence {
  background: linear-gradient(90deg, #6366f1, #818cf8);
}
.stat-bar-fill.social {
  background: linear-gradient(90deg, #ec4899, #f472b6);
}
.stat-bar-fill.charisma {
  background: linear-gradient(90deg, #f59e0b, #fbbf24);
}
.stat-bar-fill.luck {
  background: linear-gradient(90deg, #22c55e, #4ade80);
}
.stat-bar-fill.health {
  background: linear-gradient(90deg, #ef4444, #f87171);
}

.stat-value {
  width: 40px;
  flex-shrink: 0;
  text-align: center;
  font-size: 1.1rem;
  font-weight: 700;
  font-family: 'Noto Serif SC', serif;
  color: var(--text-main);
}

.stats-confirm-btn {
  display: block;
  margin: 40px auto 0;
  padding: 14px 48px;
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  background: var(--bg-card);
  color: var(--text-main);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 1rem;
  letter-spacing: 0.2em;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.5s ease, transform 0.15s ease, background 0.3s ease;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.stats-confirm-btn.visible {
  opacity: 1;
}

.stats-confirm-btn:hover {
  background: var(--bg-card-hover);
}

.stats-confirm-btn:active {
  transform: scale(0.95);
}

/* ============================================
   学期过渡画面
   ============================================ */
#transition-screen {
  background: var(--bg-dark);
}

.transition-content {
  text-align: center;
}

.transition-semester-name {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(2.5rem, 8vw, 5rem);
  font-weight: 700;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 1s ease, transform 1s ease;
  letter-spacing: 0.15em;
}

.transition-semester-name.visible {
  opacity: 1;
  transform: translateY(0);
}

.transition-subtitle {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: clamp(0.9rem, 2.5vw, 1.1rem);
  color: var(--text-dim);
  margin-top: 16px;
  opacity: 0;
  transition: opacity 1s ease 0.5s;
  font-weight: 300;
  letter-spacing: 0.2em;
}

.transition-subtitle.visible {
  opacity: 1;
}

/* ============================================
   游戏主画面
   ============================================ */
#game-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 24px 0;
}

#game-screen.active {
  display: flex;
}

/* 顶部学期信息 */
.game-header {
  width: 90%;
  max-width: 720px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-shrink: 0;
}

.semester-tag {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 0.85rem;
  font-weight: 500;
  padding: 4px 16px;
  border-radius: 20px;
  border: 1px solid var(--current-sem-color);
  color: var(--current-sem-color);
  background: rgba(255, 255, 255, 0.03);
  transition: color 0.5s, border-color 0.5s;
}

.semester-progress {
  display: flex;
  gap: 6px;
  align-items: center;
}

.progress-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1.5px solid var(--current-sem-color);
  transition: background 0.3s, border-color 0.5s;
}

.progress-dot.filled {
  background: var(--current-sem-color);
}

.progress-dot.empty {
  background: transparent;
}

/* 中间事件描述区 */
.event-area {
  width: 90%;
  max-width: 720px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
}

.event-text-box {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: clamp(20px, 4vw, 36px);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  min-height: 200px;
  position: relative;
  cursor: pointer;
  transition: border-color 0.3s;
}

.event-text-box:hover {
  border-color: rgba(255, 255, 255, 0.2);
}

.event-text {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(0.95rem, 2.8vw, 1.15rem);
  line-height: 2;
  color: var(--text-main);
  text-align: justify;
  letter-spacing: 0.04em;
}

/* 打字机光标 */
.typing-cursor {
  display: inline-block;
  width: 2px;
  height: 1.1em;
  background: var(--current-sem-color);
  margin-left: 2px;
  vertical-align: text-bottom;
  animation: cursorBlink 0.8s step-end infinite;
}

@keyframes cursorBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* 跳过提示 */
.skip-hint {
  position: absolute;
  bottom: 8px;
  right: 16px;
  font-size: 0.75rem;
  color: var(--text-dim);
  opacity: 0.5;
  font-family: 'Noto Sans SC', sans-serif;
  transition: opacity 0.3s;
}

.event-text-box:hover .skip-hint {
  opacity: 0.8;
}

/* 底部选项区 */
.options-area {
  width: 90%;
  max-width: 720px;
  margin-top: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex-shrink: 0;
}

.option-btn {
  padding: 16px 24px;
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  background: var(--bg-card);
  color: var(--text-main);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: clamp(0.9rem, 2.5vw, 1rem);
  text-align: left;
  cursor: pointer;
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.5s ease, transform 0.5s ease,
              background 0.3s ease, border-color 0.3s ease,
              box-shadow 0.3s ease;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  line-height: 1.6;
}

.option-btn.visible {
  opacity: 1;
  transform: translateY(0);
}

.option-btn:hover {
  background: var(--bg-card-hover);
  border-color: var(--current-sem-color);
  box-shadow: 0 0 20px rgba(139, 92, 246, 0.15),
              inset 0 0 20px rgba(139, 92, 246, 0.05);
}

.option-btn:active {
  transform: scale(0.97);
}

/* 左下角属性面板 */
.stats-panel {
  position: fixed;
  bottom: 16px;
  left: 16px;
  background: rgba(26, 26, 46, 0.85);
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 0.75rem;
  color: var(--text-dim);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 10;
  line-height: 1.8;
  transition: opacity 0.5s;
}

.stats-panel .stat-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.stats-panel .stat-name {
  color: var(--text-accent);
  font-weight: 500;
}

.stats-panel .stat-num {
  font-weight: 700;
  color: var(--text-main);
  font-family: 'Noto Serif SC', serif;
}

/* ============================================
   属性变化浮动提示
   ============================================ */
.stat-change-toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Noto Serif SC', serif;
  font-size: 1.4rem;
  font-weight: 700;
  pointer-events: none;
  z-index: 100;
  animation: floatUpFade 1.5s ease-out forwards;
  text-shadow: 0 0 20px currentColor;
}

@keyframes floatUpFade {
  0% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(0.8);
  }
  30% {
    opacity: 1;
    transform: translate(-50%, -70%) scale(1.1);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -150%) scale(1);
  }
}

/* ============================================
   结局画面
   ============================================ */
#ending-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#ending-screen.active {
  display: flex;
}

.ending-content {
  max-width: 720px;
  width: 90%;
  text-align: center;
}

.ending-badge {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 0.8rem;
  color: var(--text-dim);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-bottom: 16px;
  opacity: 0;
  transition: opacity 1s ease;
}

.ending-badge.visible {
  opacity: 1;
}

.ending-title {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(2rem, 6vw, 3rem);
  font-weight: 700;
  margin-bottom: 32px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 1s ease 0.3s, transform 1s ease 0.3s;
  letter-spacing: 0.1em;
}

.ending-title.visible {
  opacity: 1;
  transform: translateY(0);
}

.ending-text-box {
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: clamp(20px, 4vw, 36px);
  margin-bottom: 32px;
  text-align: left;
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  cursor: pointer;
}

.ending-text {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(0.95rem, 2.8vw, 1.1rem);
  line-height: 2;
  color: var(--text-main);
  text-align: justify;
  letter-spacing: 0.04em;
}

.ending-quote {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(0.85rem, 2.2vw, 1rem);
  font-style: italic;
  color: var(--text-dim);
  margin-bottom: 32px;
  opacity: 0;
  transition: opacity 1s ease;
  line-height: 1.8;
}

.ending-quote.visible {
  opacity: 1;
}

.ending-stats {
  display: flex;
  justify-content: center;
  gap: clamp(16px, 4vw, 32px);
  flex-wrap: wrap;
  margin-bottom: 40px;
  opacity: 0;
  transition: opacity 1s ease;
}

.ending-stats.visible {
  opacity: 1;
}

.ending-stat-item {
  text-align: center;
}

.ending-stat-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.ending-stat-value {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text-accent);
}

.restart-btn {
  display: inline-block;
  padding: 14px 48px;
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  background: var(--bg-card);
  color: var(--text-main);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 1rem;
  letter-spacing: 0.2em;
  cursor: pointer;
  animation: breatheGlow 2.5s ease-in-out infinite;
  transition: transform 0.15s ease, background 0.3s ease;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.restart-btn:hover {
  background: var(--bg-card-hover);
}

.restart-btn:active {
  transform: scale(0.95);
}

/* ============================================
   全屏遮罩（用于学期过渡等）
   ============================================ */
#full-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: var(--bg-dark);
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

#full-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

/* ============================================
   响应式适配
   ============================================ */
@media (max-width: 600px) {
  .stats-panel {
    bottom: 8px;
    left: 8px;
    padding: 8px 12px;
    font-size: 0.7rem;
  }

  .game-header {
    flex-direction: column;
    gap: 10px;
    align-items: flex-start;
  }

  .option-btn {
    padding: 14px 18px;
  }

  .ending-stats {
    gap: 12px;
  }
}

/* --- 减少动效偏好 --- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<!-- 背景渐变层 -->
<div class="bg-gradient" id="bgGradient"></div>

<!-- 背景浮动装饰 -->
<div class="bg-decoration" id="bgDecoration"></div>

<!-- 全屏遮罩 -->
<div id="full-overlay"></div>

<!-- 游戏主容器 -->
<div id="game-container">

  <!-- ========== 1. 标题画面 ========== -->
  <div class="screen active" id="title-screen">
    <div class="content-center">
      <div class="game-title" id="titleText"></div>
      <div class="game-subtitle" id="subtitleText">— 每一次选择，都是一段人生 —</div>
      <button class="start-btn" id="startBtn" style="opacity:0; transition: opacity 1s ease;" onclick="startGame()">点击开始</button>
    </div>
  </div>

  <!-- ========== 2. 属性分配画面 ========== -->
  <div class="screen" id="stats-screen">
    <div class="content-center">
      <div class="stats-title">命运的重置</div>
      <div class="stats-desc">这一世，你的天赋将如何分配？</div>
      <div class="stats-grid" id="statsGrid">
        <!-- JS 动态生成 -->
      </div>
      <button class="stats-confirm-btn" id="statsConfirmBtn" onclick="confirmStats()">开启新的人生</button>
    </div>
  </div>

  <!-- ========== 3. 游戏主画面 ========== -->
  <div class="screen" id="game-screen">
    <div class="game-header">
      <div class="semester-tag" id="semesterTag">大一上</div>
      <div class="semester-progress" id="semesterProgress">
        <!-- JS 动态生成进度点 -->
      </div>
    </div>
    <div class="event-area">
      <div class="event-text-box" id="eventTextBox" onclick="skipTyping()">
        <div class="event-text" id="eventText"></div>
        <span class="skip-hint">点击跳过</span>
      </div>
    </div>
    <div class="options-area" id="optionsArea">
      <!-- JS 动态生成选项 -->
    </div>
  </div>

  <!-- ========== 4. 学期过渡画面 ========== -->
  <div class="screen" id="transition-screen">
    <div class="transition-content">
      <div class="transition-semester-name" id="transSemName"></div>
      <div class="transition-subtitle" id="transSubTitle"></div>
    </div>
  </div>

  <!-- ========== 5. 结局画面 ========== -->
  <div class="screen" id="ending-screen">
    <div class="ending-content">
      <div class="ending-badge" id="endingBadge">ENDING</div>
      <div class="ending-title" id="endingTitle"></div>
      <div class="ending-text-box" id="endingTextBox" onclick="skipEndingTyping()">
        <div class="ending-text" id="endingText"></div>
      </div>
      <div class="ending-quote" id="endingQuote"></div>
      <div class="ending-stats" id="endingStats">
        <!-- JS 动态生成 -->
      </div>

  createFloatingCircles();
  createStatsPanel();
  playTitleAnimation();
}

// 创建背景浮动圆形装饰
function createFloatingCircles() {
  var container = document.getElementById('bgDecoration');
  var sizes = [80, 120, 200, 60, 150, 300, 100, 180];
  var colors = ['#4A90D9', '#8B5CF6', '#22C55E', '#F59E0B', '#ec4899', '#6366f1'];

  for (var i = 0; i < sizes.length; i++) {
    var circle = document.createElement('div');
    circle.className = 'floating-circle';
    circle.style.width = sizes[i] + 'px';
    circle.style.height = sizes[i] + 'px';
    circle.style.background = colors[i % colors.length];
    circle.style.left = Math.random() * 100 + '%';
    circle.style.top = Math.random() * 100 + '%';
    circle.style.animationDuration = (15 + Math.random() * 20) + 's';
    circle.style.animationDelay = (Math.random() * -20) + 's';
    container.appendChild(circle);
  }
}

// 创建属性面板
function createStatsPanel() {
  var panel = document.getElementById('statsPanel');
  var html = '';
  var keys = ['intelligence', 'social', 'charisma', 'luck', 'health'];
  for (var i = 0; i < keys.length; i++) {
    html += '<div class="stat-row">' +
      '<span class="stat-name">' + statNames[keys[i]] + '</span>' +
      '<span class="stat-num" id="panel_' + keys[i] + '">0</span>' +
      '</div>';
  }
  panel.innerHTML = html;
}

// ========== 标题动画 ==========
function playTitleAnimation() {
  var title = '大学人生重开模拟器';
  var titleEl = document.getElementById('titleText');
  titleEl.textContent = '';
  document.getElementById('subtitleText').classList.remove('visible');
  document.getElementById('startBtn').style.opacity = '0';
  var idx = 0;
  var titleTimer = setInterval(function() {
    if (idx < title.length) {
      titleEl.textContent += title[idx];
      idx++;
    } else {
      clearInterval(titleTimer);
      setTimeout(function() {
        document.getElementById('subtitleText').classList.add('visible');
      }, 500);
      setTimeout(function() {
        document.getElementById('startBtn').style.opacity = '1';
      }, 1500);
    }
  }, 120);
}

// ========== 开始游戏 ==========
function startGame() {
  switchScreen('stats-screen');
  generateStats();
}

// ========== 切换画面 ==========
function switchScreen(targetId) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) {
    screens[i].classList.remove('active');
  }
  setTimeout(function() {
    document.getElementById(targetId).classList.add('active');
  }, 100);
}

// ========== 属性分配 ==========
function generateStats() {
  var grid = document.getElementById('statsGrid');
  grid.innerHTML = '';

  var keys = ['intelligence', 'social', 'charisma', 'luck', 'health'];

  for (var i = 0; i < keys.length; i++) {
    var key = keys[i];
    var value = Math.floor(Math.random() * 6) + 3;
    state.stats[key] = value;

    var item = document.createElement('div');
    item.className = 'stat-item';
    item.innerHTML =
      '<div class="stat-label">' + statNames[key] + '</div>' +
      '<div class="stat-bar-container">' +
        '<div class="stat-bar-fill ' + key + '" id="bar_' + key + '"></div>' +
      '</div>' +
      '<div class="stat-value" id="val_' + key + '">0</div>';
    grid.appendChild(item);
  }

  // 延迟启动动画
  setTimeout(function() { animateStatsRoll(keys); }, 300);
}

// 属性滚动动画
function animateStatsRoll(keys) {
  for (var i = 0; i < keys.length; i++) {
    (function(key, index) {
      var target = state.stats[key];
      var barEl = document.getElementById('bar_' + key);
      var valEl = document.getElementById('val_' + key);

      // 进度条动画
      setTimeout(function() {
        barEl.style.width = (target * 10) + '%';
      }, index * 200);

      // 数字跳动动画
      setTimeout(function() {
        animateNumber(valEl, 0, target, 1500);
      }, index * 200);
    })(keys[i], i);
  }

  // 动画完成后显示确认按钮
  setTimeout(function() {
    document.getElementById('statsConfirmBtn').classList.add('visible');
  }, keys.length * 200 + 1600);
}

// 数字跳动动画
function animateNumber(el, from, to, duration) {
  var startTime = performance.now();

  function update(currentTime) {
    var elapsed = currentTime - startTime;
    var progress = Math.min(elapsed / duration, 1);
    var eased = 1 - Math.pow(1 - progress, 3);
    var current = Math.round(from + (to - from) * eased);
    el.textContent = current;
    if (progress < 1) {
      requestAnimationFrame(update);
    }
  }

  requestAnimationFrame(update);
}

// 确认属性，进入学期过渡
function confirmStats() {
  state.currentSemester = 1;
  state.currentEventIndex = 0;
  showSemesterTransition(1);
}

// ========== 学期过渡动画 ==========
function showSemesterTransition(semNum) {
  var sem = semesters[semNum];
  var overlay = document.getElementById('full-overlay');

  // 更新主题色
  document.documentElement.style.setProperty('--current-sem-color', sem.color);

  // 第一步：淡入黑屏
  overlay.classList.add('active');

  setTimeout(function() {
    // 第二步：切换到过渡画面并显示学期名称
    switchScreen('transition-screen');
    var semNameEl = document.getElementById('transSemName');
    var subEl = document.getElementById('transSubTitle');
    semNameEl.textContent = sem.name;
    semNameEl.style.color = sem.color;
    subEl.textContent = sem.subtitle;

    setTimeout(function() {
      semNameEl.classList.add('visible');
      subEl.classList.add('visible');
    }, 200);

    // 第三步：淡出黑屏
    setTimeout(function() {
      overlay.classList.remove('active');
    }, 1500);

    // 第四步：进入游戏主画面
    setTimeout(function() {
      switchScreen('game-screen');
      updateGameHeader();
      updateStatsPanel();
      document.getElementById('statsPanel').style.opacity = '1';
      showCurrentEvent();
    }, 2800);

  }, 800);
}

// ========== 更新游戏头部信息 ==========
function updateGameHeader() {
  var sem = semesters[state.currentSemester];
  var tag = document.getElementById('semesterTag');
  tag.textContent = sem.name;
  tag.style.color = sem.color;
  tag.style.borderColor = sem.color;

  // 更新进度点
  var progress = document.getElementById('semesterProgress');
  progress.innerHTML = '';
  for (var i = 0; i < 3; i++) {
    var dot = document.createElement('div');
    dot.className = 'progress-dot ' + (i < state.currentEventIndex ? 'filled' : 'empty');
    dot.style.borderColor = sem.color;
    if (i < state.currentEventIndex) dot.style.background = sem.color;
    progress.appendChild(dot);
  }
}

// ========== 更新属性面板 ==========
function updateStatsPanel() {
  var keys = ['intelligence', 'social', 'charisma', 'luck', 'health'];
  for (var i = 0; i < keys.length; i++) {
    var el = document.getElementById('panel_' + keys[i]);
    if (el) el.textContent = state.stats[keys[i]];
  }
}

// ========== 获取某学期有效事件 ==========
function getSemesterEvents(semNum) {
  return eventsData[semNum];
}

// ========== 显示当前事件 ==========
function showCurrentEvent() {
  var semEvents = getSemesterEvents(state.currentSemester);
  if (state.currentEventIndex >= semEvents.length) {
    nextSemester();
    return;
  }

  var event = semEvents[state.currentEventIndex];

  // 检查事件是否有条件
  if (event.condition && !event.condition()) {
    state.currentEventIndex++;
    showCurrentEvent();
    return;
  }

  // 获取场景文字
  var sceneText = typeof event.getScene === 'function' ? event.getScene() : event.scene;

  // 获取选项
  var options = typeof event.getOptions === 'function' ? event.getOptions() : event.options;

  // 清空选项区
  var optionsArea = document.getElementById('optionsArea');
  optionsArea.innerHTML = '';

  // 打字机效果显示场景文字
  typeText(sceneText, document.getElementById('eventText'), function() {
    // 文字显示完毕后，依次显示选项
    var visibleIndex = 0;
    for (var i = 0; i < options.length; i++) {
      (function(opt, idx) {
        // 检查选项条件
        if (opt.condition && !opt.condition()) return;

        var btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt.text;
        btn.onclick = function() { selectOption(opt); };
        optionsArea.appendChild(btn);

        // 延迟显示动画
        var delay = (visibleIndex + 1) * 300;
        visibleIndex++;
        setTimeout(function() {
          btn.classList.add('visible');
        }, delay);
      })(options[i], i);
    }

    // 如果没有可见选项，显示一个默认继续按钮
    if (visibleIndex === 0) {
      var continueBtn = document.createElement('button');
      continueBtn.className = 'option-btn';
      continueBtn.textContent = '继续前行...';
      continueBtn.onclick = function() {
        state.currentEventIndex++;
        showCurrentEvent();
      };
      optionsArea.appendChild(continueBtn);
      setTimeout(function() { continueBtn.classList.add('visible'); }, 300);
    }
  });
}

// ========== 打字机效果 ==========
function typeText(text, element, callback) {
  clearTyping();
  isTyping = true;
  fullText = text;
  typingCallback = callback;
  element.innerHTML = '';
  var idx = 0;

  // 添加光标
  var cursor = document.createElement('span');
  cursor.className = 'typing-cursor';
  element.appendChild(cursor);

  typingTimer = setInterval(function() {
    if (idx < fullText.length) {
      var charNode = document.createTextNode(fullText[idx]);
      element.insertBefore(charNode, cursor);
      idx++;
    } else {
      clearInterval(typingTimer);
      typingTimer = null;
      isTyping = false;
      cursor.remove();
      if (typingCallback) typingCallback();
    }
  }, 50);
}

// 跳过打字机效果
function skipTyping() {
  if (!isTyping) return;
  clearTyping();
  var element = document.getElementById('eventText');
  element.textContent = fullText;
  isTyping = false;
  if (typingCallback) typingCallback();
}

function clearTyping() {
  if (typingTimer) {
    clearInterval(typingTimer);
    typingTimer = null;
  }
}

// ========== 选择选项 ==========
function selectOption(option) {
  // 应用效果
  if (option.effects) {
    var effectKeys = Object.keys(option.effects);
    for (var i = 0; i < effectKeys.length; i++) {
      var key = effectKeys[i];
      var val = option.effects[key];
      if (state.stats[key] !== undefined) {
        state.stats[key] = Math.max(0, Math.min(15, state.stats[key] + val));
        showStatChangeToast(key, val);
      }
    }
  }

  // 执行自定义动作
  if (option.action) option.action();

  // 更新属性面板
  setTimeout(function() { updateStatsPanel(); }, 300);

  // 进入下一个事件
  state.currentEventIndex++;

  setTimeout(function() {
    // 检查是否触发表白事件
    if (option.text && option.text.indexOf('鼓起勇气') !== -1 && option.text.indexOf('坐到旁边') !== -1) {
      handleConfession();
    } else {
      showCurrentEvent();
    }
  }, 600);
}

// 表白事件处理
function handleConfession() {
  var success = state.stats.charisma >= 6 || Math.random() > 0.4;

  var optionsArea = document.getElementById('optionsArea');
  optionsArea.innerHTML = '';

  if (success) {
    state.loveStatus = 'success';
    state.loveBranch = true;
    var scene = '你鼓起了所有的勇气，在一个微风吹过的傍晚，在操场边的小路上，说出了那句在心里排练了无数遍的话。对方愣了一下，然后笑了。那个笑容比窗外的夕阳还要温暖。从那天起，你的大学多了一个人的名字。';
    typeText(scene, document.getElementById('eventText'), function() {
      var btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = '牵手 —— 这一刻，一切都值得了';
      btn.onclick = function() {
        state.currentEventIndex++;
        showCurrentEvent();
      };
      optionsArea.appendChild(btn);
      setTimeout(function() { btn.classList.add('visible'); }, 300);
    });
  } else {
    state.loveStatus = 'failed';
    state.loveBranch = true;
    var scene2 = '你鼓起了所有的勇气，说出了那句话。空气突然安静了。对方低下头，轻声说了一句"对不起"。你的世界在那一秒静止了，然后又缓缓转动起来。你勉强挤出一个微笑，说"没关系啦"。转身的那一刻，你的眼眶湿了。但你知道，说出来，就已经很勇敢了。';
    typeText(scene2, document.getElementById('eventText'), function() {
      var btn2 = document.createElement('button');
      btn2.className = 'option-btn';
      btn2.textContent = '擦干眼泪，继续往前走 —— 生活还在继续';
      btn2.onclick = function() {
        state.currentEventIndex++;
        showCurrentEvent();
      };
      optionsArea.appendChild(btn2);
      setTimeout(function() { btn2.classList.add('visible'); }, 300);
    });
  }
}

// ========== 属性变化浮动提示 ==========
function showStatChangeToast(statKey, value) {
  var toast = document.createElement('div');
  toast.className = 'stat-change-toast';
  var sign = value > 0 ? '+' : '';
  toast.textContent = sign + value + ' ' + statNames[statKey];
  toast.style.color = value > 0 ? statColors[statKey] : '#f87171';
  document.body.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 1500);
}

// ========== 下一学期 ==========
function nextSemester() {
  if (state.currentSemester >= 4) {
    showEnding();
    return;
  }

  state.currentSemester++;
  state.currentEventIndex = 0;
  showSemesterTransition(state.currentSemester);
}

// ========== 结局画面 ==========
function showEnding() {
  // 隐藏属性面板
  document.getElementById('statsPanel').style.opacity = '0';

  // 计算结局
  var ending = calculateEnding();

  // 淡入黑屏
  var overlay = document.getElementById('full-overlay');
  overlay.classList.add('active');

  setTimeout(function() {
    // 切换到结局画面
    switchScreen('ending-screen');

    // 显示结局徽章
    setTimeout(function() {
      document.getElementById('endingBadge').classList.add('visible');
    }, 300);

    // 显示结局标题
    setTimeout(function() {
      var titleEl = document.getElementById('endingTitle');
      titleEl.textContent = ending.title;
      titleEl.style.color = semesters[4].color;
      titleEl.classList.add('visible');
    }, 800);

    // 淡出黑屏
    setTimeout(function() {
      overlay.classList.remove('active');
    }, 1200);

    // 打字机效果显示结局文字
    setTimeout(function() {
      typeEndingText(ending.text);
    }, 2000);

  }, 800);

  // 显示名言
  setTimeout(function() {
    var quoteEl = document.getElementById('endingQuote');
    quoteEl.textContent = ending.quote;
    quoteEl.classList.add('visible');
  }, 6000);

  // 显示最终属性
  setTimeout(function() {
    showEndingStats();
  }, 7000);

  // 显示重新开始按钮
  setTimeout(function() {
    document.getElementById('restartBtn').style.opacity = '1';
  }, 7500);
}

// 计算结局
function calculateEnding() {
  var endingList = [];
  var keys = Object.keys(endings);
  for (var i = 0; i < keys.length; i++) {
    var e = endings[keys[i]];
    if (e.condition()) {
      endingList.push(e);
    }
  }
  endingList.sort(function(a, b) { return a.priority - b.priority; });
  return endingList[0] || endings.lost;
}

// 结局打字机效果
function typeEndingText(text) {
  isEndingTyping = true;
  endingFullText = text;
  var el = document.getElementById('endingText');
  el.innerHTML = '';
  var idx = 0;

  var cursor = document.createElement('span');
  cursor.className = 'typing-cursor';
  el.appendChild(cursor);

  endingTypingTimer = setInterval(function() {
    if (idx < endingFullText.length) {
      var charNode = document.createTextNode(endingFullText[idx]);
      el.insertBefore(charNode, cursor);
      idx++;
    } else {
      clearInterval(endingTypingTimer);
      endingTypingTimer = null;
      isEndingTyping = false;
      cursor.remove();
    }
  }, 50);
}

function skipEndingTyping() {
  if (!isEndingTyping) return;
  if (endingTypingTimer) {
    clearInterval(endingTypingTimer);
    endingTypingTimer = null;
  }
  var el = document.getElementById('endingText');
  el.textContent = endingFullText;
  isEndingTyping = false;
}

// 显示结局属性
function showEndingStats() {
  var container = document.getElementById('endingStats');
  container.innerHTML = '';
  var keys = ['intelligence', 'social', 'charisma', 'luck', 'health'];
  for (var i = 0; i < keys.length; i++) {
    var key = keys[i];
    var item = document.createElement('div');
    item.className = 'ending-stat-item';
    item.innerHTML =
      '<div class="ending-stat-label">' + statNames[key] + '</div>' +
      '<div class="ending-stat-value" style="color: ' + statColors[key] + '">' + state.stats[key] + '</div>';
    container.appendChild(item);
  }
  container.classList.add('visible');
}

// ========== 重新开始 ==========
function restartGame() {
  // 重置状态
  state.stats = { intelligence: 0, social: 0, charisma: 0, luck: 0, health: 0 };
  state.currentSemester = 1;
  state.currentEventIndex = 0;
  state.loveStatus = 'none';
  state.major = 'undecided';
  state.skill = 'none';
  state.hasFailed = false;
  state.loveBranch = false;

  // 隐藏结局元素
  document.getElementById('endingBadge').classList.remove('visible');
  document.getElementById('endingTitle').classList.remove('visible');
  document.getElementById('endingQuote').classList.remove('visible');
  document.getElementById('endingStats').classList.remove('visible');
  document.getElementById('restartBtn').style.opacity = '0';

  // 淡入黑屏
  var overlay = document.getElementById('full-overlay');
  overlay.classList.add('active');

  setTimeout(function() {
    switchScreen('title-screen');
    setTimeout(function() {
      overlay.classList.remove('active');
      playTitleAnimation();
    }, 600);
  }, 800);
}

// ========== 页面加载完成后启动 ==========
window.addEventListener('DOMContentLoaded', init);
</script>
