<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐟 番茄静心鱼塘 · 2D版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #d4f1f9 0%, #e8f5e9 50%, #fff3e0 100%);
      min-height: 100vh;
      color: #2c4a4e;
      line-height: 1.6;
    }
    .app {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px 32px;
    }
    .header {
      text-align: center;
      padding: 16px 0 24px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #1a4b52;
    }
    .subtitle {
      font-size: 14px;
      color: #5c7a7e;
      margin-top: 6px;
    }
    .timer-section {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(76, 150, 158, 0.12);
      margin-bottom: 20px;
    }
    .timer-display {
      font-size: 64px;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      color: #1a4b52;
      letter-spacing: 4px;
    }
    .status-text {
      font-size: 16px;
      color: #5c7a7e;
      margin: 12px 0 24px;
    }
    .status-text.focusing { color: #ff7043; }
    .status-text.breaking { color: #43a047; }
    .status-text.done { color: #5e35b1; }
    .progress-wrap { text-align: left; margin-top: 16px; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #5c7a7e;
      margin-bottom: 8px;
    }
    .progress-bar {
      width: 100%;
      height: 12px;
      background: rgba(176, 216, 220, 0.4);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #81c784, #4db6ac);
      border-radius: 999px;
      transition: width 0.8s ease, background 0.8s ease;
    }
    .focus-level {
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
      color: #43a047;
      font-weight: 500;
    }
    .tank-section {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      padding: 12px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(76, 150, 158, 0.12);
      overflow: hidden;
    }
    #fishTank {
      display: block;
      width: 100%;
      height: auto;
      max-height: 360px;
      border-radius: 12px;
    }
    .volume-section {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(76, 150, 158, 0.12);
    }
    .volume-label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #5c7a7e;
      margin-bottom: 10px;
    }
    .volume-bar {
      width: 100%;
      height: 8px;
      background: rgba(176, 216, 220, 0.4);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .volume-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #81d4fa, #ffb74d, #e57373);
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .btn-primary, .btn-secondary {
      padding: 12px 32px;
      font-size: 15px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 500;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff7043, #ff8a65);
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 112, 67, 0.3);
    }
    .btn-secondary {
      background: #fff;
      color: #2c4a4e;
      box-shadow: 0 2px 8px rgba(76, 150, 158, 0.15);
    }
    .btn-primary:hover, .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(76, 150, 158, 0.2);
    }
    .btn-primary:active, .btn-secondary:active {
      transform: translateY(0);
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      padding: 20px;
    }
    .stat-item { text-align: center; }
    .stat-value {
      font-size: 28px;
      font-weight: 600;
      color: #1a4b52;
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      font-size: 13px;
      color: #5c7a7e;
      margin-top: 4px;
    }
    .modal-mask {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26, 75, 82, 0.4);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-mask.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      animation: modalIn 0.3s ease;
    }
    @keyframes modalIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal h2 {
      font-size: 22px;
      color: #1a4b52;
      margin-bottom: 20px;
    }
    .result-line {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      font-size: 15px;
      color: #5c7a7e;
      border-bottom: 1px dashed rgba(76, 150, 158, 0.2);
    }
    .result-line:last-of-type { border-bottom: none; }
    .result-line strong { color: #1a4b52; font-weight: 600; }
    .result-msg {
      font-size: 16px;
      color: #ff7043;
      margin: 20px 0;
      padding: 12px;
      background: #fff3e0;
      border-radius: 12px;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 16px;
    }
    .switch-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.9);
      color: #1a4b52;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(76, 150, 158, 0.2);
      z-index: 10;
    }
    .switch-btn:hover { background: rgba(255, 255, 255, 1); }
    @media (max-width: 600px) {
      .header h1 { font-size: 22px; }
      .timer-display { font-size: 48px; }
      .btn-primary, .btn-secondary { padding: 10px 24px; font-size: 14px; }
      .stats { gap: 24px; }
      .stat-value { font-size: 22px; }
    }
  </style>
</head>
<body>
  <a class="switch-btn" href="index.html">🎣 试试3D版</a>

  <div class="app">
    <header class="header">
      <h1>🐟 番茄静心鱼塘</h1>
      <p class="subtitle">在静谧的水底，专注每一分钟</p>
    </header>

    <section class="timer-section">
      <div class="timer-display" id="timerDisplay">25:00</div>
      <div class="status-text" id="statusText">未开始</div>
      <div class="progress-wrap">
        <div class="progress-label">
          <span>专注度</span>
          <span id="focusPercent">100%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="focusBar"></div>
        </div>
        <div class="focus-level" id="focusLevel">极佳 ✨</div>
      </div>
    </section>

    <section class="tank-section">
      <canvas id="fishTank" width="800" height="360"></canvas>
    </section>

    <section class="volume-section">
      <div class="volume-label">
        <span>环境音量</span>
        <span id="volumeLevel">未启用</span>
      </div>
      <div class="volume-bar">
        <div class="volume-fill" id="volumeBar"></div>
      </div>
      <button class="btn-secondary" id="micBtn">🎤 启用麦克风</button>
    </section>

    <section class="controls">
      <button class="btn-primary" id="startBtn">开始</button>
      <button class="btn-secondary" id="pauseBtn">暂停</button>
      <button class="btn-secondary" id="resetBtn">重置</button>
    </section>

    <footer class="stats">
      <div class="stat-item">
        <div class="stat-value" id="todayCount">0</div>
        <div class="stat-label">今日番茄</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="todayAvgFocus">—</div>
        <div class="stat-label">平均专注度</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="fishCount">6</div>
        <div class="stat-label">🐟 鱼儿数量</div>
      </div>
    </footer>
  </div>

  <div class="modal-mask" id="resultModal">
    <div class="modal">
      <h2>🎉 完成一次番茄</h2>
      <div class="result-line">
        <span>最终专注度</span>
        <strong id="resultFocus">—</strong>
      </div>
      <div class="result-line">
        <span>是否成功</span>
        <strong id="resultSuccess">—</strong>
      </div>
      <div class="result-msg" id="resultMsg">—</div>
      <div class="modal-actions">
        <button class="btn-primary" id="againBtn">再来一局</button>
        <button class="btn-secondary" id="closeBtn">关闭</button>
      </div>
    </div>
  </div>

  <script>
  /* =======================================================
   * 番茄静心鱼塘 · 2D Canvas 版
   * 包含：番茄钟计时器 / 麦克风音量检测 / 2D鱼塘动画
   * ======================================================= */

  // ---------- DOM 引用 ----------
  const $ = (id) => document.getElementById(id);
  const timerDisplay = $('timerDisplay');
  const statusText = $('statusText');
  const focusBar = $('focusBar');
  const focusPercent = $('focusPercent');
  const focusLevel = $('focusLevel');
  const volumeBar = $('volumeBar');
  const volumeLevel = $('volumeLevel');
  const micBtn = $('micBtn');
  const startBtn = $('startBtn');
  const pauseBtn = $('pauseBtn');
  const resetBtn = $('resetBtn');
  const fishTank = $('fishTank');
  const fishCountEl = $('fishCount');
  const todayCountEl = $('todayCount');
  const todayAvgEl = $('todayAvgFocus');
  const resultModal = $('resultModal');
  const resultFocus = $('resultFocus');
  const resultSuccess = $('resultSuccess');
  const resultMsg = $('resultMsg');
  const againBtn = $('againBtn');
  const closeBtn = $('closeBtn');

  // ---------- 番茄钟状态 ----------
  const FOCUS_TIME = 25 * 60;
  const BREAK_TIME = 5 * 60;
  let timerState = 'idle';
  let remaining = FOCUS_TIME;
  let timerId = null;

  // ---------- 专注度 ----------
  let focusScore = 100;
  let focusHistory = [];

  // ---------- 麦克风 ----------
  let audioCtx = null;
  let analyser = null;
  let micStream = null;
  let micEnabled = false;
  let currentVolume = 0;
  let volumeCheckId = null;

  // ---------- 鱼塘 ----------
  const tankCtx = fishTank.getContext('2d');
  const TANK_W = fishTank.width;
  const TANK_H = fishTank.height;
  const fishList = [];
  let noiseFrames = 0;
  let quietSeconds = 0;
  let loudSeconds = 0;

  // 初始化鱼群
  function initFish(count = 6) {
    fishList.length = 0;
    for (let i = 0; i < count; i++) {
      fishList.push({
        x: Math.random() * TANK_W,
        y: TANK_H * 0.2 + Math.random() * (TANK_H * 0.6),
        vx: (Math.random() > 0.5 ? 1 : -1) * (0.4 + Math.random() * 0.6),
        vy: (Math.random() - 0.5) * 0.3,
        size: 10 + Math.random() * 6,
        wiggle: Math.random() * Math.PI * 2,
        color: fishColorFromIndex(i),
      });
    }
    updateFishCount();
  }

  function fishColorFromIndex(i) {
    const palette = ['#ff8a5c', '#ffb74d', '#4fc3f7', '#81c784', '#ba68c8', '#f06292'];
    return palette[i % palette.length];
  }

  function updateFishCount() {
    fishCountEl.textContent = fishList.length;
  }

  // 预生成噪声图：在画布外的 buffer 上叠加几条正弦，
  // 实际这里不用噪点图，直接用三角函数绘制水草即可。

  // ---------- 渲染鱼塘 ----------
  function animate() {
    drawTank();
    requestAnimationFrame(animate);
  }

  function drawTank() {
    // 背景渐变（深水到浅水）
    const grad = tankCtx.createLinearGradient(0, 0, 0, TANK_H);
    grad.addColorStop(0, '#88d4e8');
    grad.addColorStop(1, '#1a3a4a');
    tankCtx.fillStyle = grad;
    tankCtx.fillRect(0, 0, TANK_W, TANK_H);

    // 水面波纹（简单波浪线）
    tankCtx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
    tankCtx.lineWidth = 1.5;
    for (let row = 0; row < 5; row++) {
      tankCtx.beginPath();
      const baseY = 8 + row * 6;
      for (let x = 0; x <= TANK_W; x += 6) {
        const y = baseY + Math.sin(x * 0.02 + Date.now() * 0.001 + row) * 2;
        if (x === 0) tankCtx.moveTo(x, y);
        else tankCtx.lineTo(x, y);
      }
      tankCtx.stroke();
    }

    // 水草（从底部向上）
    tankCtx.strokeStyle = '#2e8b57';
    tankCtx.lineWidth = 3;
    tankCtx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const baseX = 80 + i * (TANK_W - 160) / 7;
      const plantHeight = 60 + (i % 3) * 20;
      const sway = Math.sin(Date.now() * 0.0015 + i) * 8;
      tankCtx.beginPath();
      tankCtx.moveTo(baseX, TANK_H);
      tankCtx.quadraticCurveTo(baseX + sway, TANK_H - plantHeight / 2,
        baseX + sway * 1.5, TANK_H - plantHeight);
      tankCtx.stroke();
    }

    // 鱼
    const t = Date.now() * 0.004;
    for (const f of fishList) {
      // 移动：若"吵闹"，鱼游得更快、摆动更剧烈
      let speedMul = noiseFrames > 0 ? 2.5 : 1;
      f.x += f.vx * speedMul;
      f.y += f.vy + Math.sin(t + f.wiggle) * 0.15;

      // 边界反弹
      if (f.x < f.size) { f.x = f.size; f.vx *= -1; }
      if (f.x > TANK_W - f.size) { f.x = TANK_W - f.size; f.vx *= -1; }
      if (f.y < TANK_H * 0.18) { f.y = TANK_H * 0.18; f.vy = Math.abs(f.vy); }
      if (f.y > TANK_H - 30) { f.y = TANK_H - 30; f.vy = -Math.abs(f.vy); }

      drawFish(f, t);
    }

    // 气泡
    if (Math.random() < 0.04) {
      drawBubble(Math.random() * TANK_W, TANK_H - 10);
    }
  }

  function drawFish(f, t) {
    tankCtx.save();
    tankCtx.translate(f.x, f.y);
    const scale = f.vx > 0 ? 1 : -1;
    tankCtx.scale(scale, 1);

    // 身体
    tankCtx.fillStyle = f.color;
    tankCtx.beginPath();
    tankCtx.ellipse(0, 0, f.size, f.size * 0.6, 0, 0, Math.PI * 2);
    tankCtx.fill();

    // 尾巴
    const tailWag = Math.sin(t * 2 + f.wiggle) * 3;
    tankCtx.beginPath();
    tankCtx.moveTo(-f.size, 0);
    tankCtx.lineTo(-f.size * 1.7, -f.size * 0.5 + tailWag);
    tankCtx.lineTo(-f.size * 1.7, f.size * 0.5 + tailWag);
    tankCtx.closePath();
    tankCtx.fill();

    // 眼睛
    tankCtx.fillStyle = '#fff';
    tankCtx.beginPath();
    tankCtx.arc(f.size * 0.5, -f.size * 0.1, f.size * 0.15, 0, Math.PI * 2);
    tankCtx.fill();
    tankCtx.fillStyle = '#333';
    tankCtx.beginPath();
    tankCtx.arc(f.size * 0.55, -f.size * 0.1, f.size * 0.07, 0, Math.PI * 2);
    tankCtx.fill();

    tankCtx.restore();
  }

  function drawBubble(x, y) {
    tankCtx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    tankCtx.lineWidth = 1;
    tankCtx.beginPath();
    tankCtx.arc(x, y, 3 + Math.random() * 3, 0, Math.PI * 2);
    tankCtx.stroke();
  }

  // ---------- 番茄钟 ----------
  function formatTime(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateTimerDisplay() {
    timerDisplay.textContent = formatTime(remaining);
  }

  function setState(newState) {
    if (timerState === newState) return;
    timerState = newState;
    let text = '', cls = '';
    switch (newState) {
      case 'idle':      text = '未开始'; cls = ''; break;
      case 'focusing':  text = '专注中'; cls = 'focusing'; break;
      case 'breaking':  text = '休息中'; cls = 'breaking'; break;
      case 'done':      text = '已完成'; cls = 'done'; break;
    }
    statusText.textContent = text;
    statusText.className = 'status-text ' + cls;
    console.log('[番茄钟] 状态变更 →', text);
  }

  function tick() {
    remaining--;
    if (remaining <= 0) {
      if (timerState === 'focusing') {
        clearInterval(timerId);
        timerId = null;
        showResult();
        saveSession(focusScore);
        startBreak();
      } else if (timerState === 'breaking') {
        clearInterval(timerId);
        timerId = null;
        setState('done');
        remaining = FOCUS_TIME;
        updateTimerDisplay();
      }
    } else {
      updateTimerDisplay();
    }
  }

  function startFocus() {
    if (timerId) return;
    setState('focusing');
    focusScore = 100;
    focusHistory = [];
    updateFocusUI();
    timerId = setInterval(tick, 1000);
    console.log('[番茄钟] 开始专注 25:00');
  }

  function startBreak() {
    remaining = BREAK_TIME;
    setState('breaking');
    updateTimerDisplay();
    timerId = setInterval(tick, 1000);
    console.log('[番茄钟] 开始休息 05:00');
  }

  function pauseTimer() {
    if (!timerId) return;
    clearInterval(timerId);
    timerId = null;
    console.log('[番茄钟] 暂停');
  }

  function resetTimer() {
    if (timerId) {
      clearInterval(timerId);
      timerId = null;
    }
    remaining = FOCUS_TIME;
    setState('idle');
    focusScore = 100;
    focusHistory = [];
    updateFocusUI();
    updateTimerDisplay();
    console.log('[番茄钟] 重置');
  }

  // ---------- 麦克风 ----------
  async function initMicrophone() {
    if (micEnabled) { alert('麦克风已启用'); return; }
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);

      micEnabled = true;
      micBtn.textContent = '✅ 麦克风已启用';
      console.log('[麦克风] 已连接，开始检测音量');

      const buffer = new Uint8Array(analyser.frequencyBinCount);
      volumeCheckId = setInterval(() => {
        analyser.getByteTimeDomainData(buffer);
        let sum = 0;
        let peak = 0;
        for (let i = 0; i < buffer.length; i++) {
          const v = (buffer[i] - 128) / 128;
          sum += v * v;
          const abs = Math.abs(v);
          if (abs > peak) peak = abs;
        }
        const rms = Math.sqrt(sum / buffer.length);
        currentVolume = Math.min(1, (rms * 0.7 + peak * 0.3) * 8);
        updateVolumeUI();
      }, 250);

      setInterval(() => {
        let level = '';
        if (currentVolume < 0.3) level = '安静';
        else if (currentVolume < 0.6) level = '一般';
        else level = '吵闹';
        console.log('[麦克风] 音量 =', currentVolume.toFixed(2), '→', level);
      }, 1000);
    } catch (err) {
      console.error('[麦克风] 授权失败', err);
      alert('麦克风授权失败，请在浏览器设置中允许后重试。');
    }
  }

  function updateVolumeUI() {
    volumeBar.style.width = (currentVolume * 100).toFixed(0) + '%';
    let text = '';
    if (!micEnabled) text = '未启用';
    else if (currentVolume < 0.3) text = '安静 🤫';
    else if (currentVolume < 0.6) text = '一般 🔊';
    else text = '吵闹 🔥';
    volumeLevel.textContent = text;
  }

  // ---------- 专注度 & 鱼塘联动 ----------
  function startFocusMonitoring() {
    setInterval(() => {
      if (!micEnabled) return;

      if (currentVolume < 0.3) {
        quietSeconds++;
        loudSeconds = 0;
        if (noiseFrames > 0) noiseFrames--;
      } else if (currentVolume > 0.6) {
        loudSeconds++;
        quietSeconds = 0;
        noiseFrames = Math.min(60, noiseFrames + 2);
      } else {
        if (noiseFrames > 0) noiseFrames--;
      }

      if (quietSeconds > 0 && quietSeconds % 3 === 0) {
        addFish();
        console.log('[鱼塘] 安静氛围新增一条鱼，当前 =', fishList.length);
      }
      if (loudSeconds > 0 && loudSeconds % 2 === 0 && fishList.length > 1) {
        fishList.pop();
        updateFishCount();
        console.log('[鱼塘] 太吵了走一条鱼，当前 =', fishList.length);
      }

      if (timerState === 'focusing') {
        let delta = 0;
        if (currentVolume < 0.3) delta = +2;
        else if (currentVolume < 0.6) delta = 0;
        else delta = -5;

        focusScore = Math.max(0, Math.min(100, focusScore + delta));
        focusHistory.push(focusScore);
        updateFocusUI();
      }
    }, 1000);
  }

  function addFish() {
    fishList.push({
      x: Math.random() * TANK_W,
      y: TANK_H * 0.2 + Math.random() * (TANK_H * 0.6),
      vx: (Math.random() > 0.5 ? 1 : -1) * (0.4 + Math.random() * 0.6),
      vy: (Math.random() - 0.5) * 0.3,
      size: 10 + Math.random() * 6,
      wiggle: Math.random() * Math.PI * 2,
      color: fishColorFromIndex(fishList.length),
    });
    updateFishCount();
  }

  function updateFocusUI() {
    focusBar.style.width = focusScore + '%';
    focusPercent.textContent = focusScore + '%';

    let text = '', color = '';
    if (focusScore >= 90)      { text = '极佳 ✨'; color = '#43a047'; }
    else if (focusScore >= 70) { text = '良好 🌿'; color = '#66bb6a'; }
    else if (focusScore >= 40) { text = '一般 😐'; color = '#ffa726'; }
    else                       { text = '危险 ⚠️'; color = '#e53935'; }
    focusLevel.textContent = text;
    focusLevel.style.color = color;

    if (focusScore >= 70) focusBar.style.background = 'linear-gradient(90deg, #81c784, #4db6ac)';
    else if (focusScore >= 40) focusBar.style.background = 'linear-gradient(90deg, #ffd54f, #ffb74d)';
    else focusBar.style.background = 'linear-gradient(90deg, #ff8a65, #e57373)';
  }

  // ---------- 结算弹窗 ----------
  function showResult() {
    const finalScore = focusScore;
    const success = finalScore >= 60;
    let msg = '';
    if (finalScore >= 90) msg = '安静如水，你是这片鱼塘的主人 🌊';
    else if (finalScore >= 70) msg = '状态不错，继续保持节奏 🌿';
    else if (finalScore >= 60) msg = '勉强达标，下次加油 ✊';
    else msg = '环境有些喧嚣，下次找个更安静的地方吧 🍃';

    resultFocus.textContent = finalScore + '%';
    resultSuccess.textContent = success ? '✅ 成功' : '❌ 失败';
    resultMsg.textContent = msg;
    resultModal.classList.add('show');
  }

  function hideResult() { resultModal.classList.remove('show'); }

  // ---------- 本地存储 ----------
  const STORAGE_KEY = 'tomato_fish_stats_v1';
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  }
  function loadStats() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { date: todayStr(), count: 0, sumFocus: 0 };
      const obj = JSON.parse(raw);
      if (obj.date !== todayStr()) return { date: todayStr(), count: 0, sumFocus: 0 };
      return obj;
    } catch (e) { return { date: todayStr(), count: 0, sumFocus: 0 }; }
  }
  function saveStats(stats) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); }
    catch (e) { /* 忽略 */ }
  }
  function saveSession(sessionFocus) {
    const stats = loadStats();
    stats.count += 1;
    stats.sumFocus += sessionFocus;
    stats.date = todayStr();
    saveStats(stats);
    renderStats();
  }
  function renderStats() {
    const s = loadStats();
    todayCountEl.textContent = s.count;
    todayAvgEl.textContent = s.count > 0 ? Math.round(s.sumFocus / s.count) + '%' : '—';
  }

  // ---------- 事件绑定 ----------
  startBtn.addEventListener('click', startFocus);
  pauseBtn.addEventListener('click', pauseTimer);
  resetBtn.addEventListener('click', resetTimer);
  micBtn.addEventListener('click', initMicrophone);
  againBtn.addEventListener('click', () => { hideResult(); resetTimer(); startFocus(); });
  closeBtn.addEventListener('click', hideResult);

  // ---------- 启动 ----------
  initFish(6);
  updateTimerDisplay();
  updateFocusUI();
  updateVolumeUI();
  renderStats();
  startFocusMonitoring();
  animate();
  console.log('[番茄静心鱼塘] 2D 版已就绪 🐟');
  </script>
</body>
</html>
