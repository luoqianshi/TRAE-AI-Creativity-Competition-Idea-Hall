<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾光集合画廊 · Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-base: #08080d;
      --bg-elevated: #12121a;
      --bg-card: rgba(22, 22, 32, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.15);
      --text-primary: #f5f5f7;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent: #8b5cf6;
      --accent-2: #06b6d4;
      --accent-glow: rgba(139, 92, 246, 0.4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      font-feature-settings: "tnum";
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-display {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: -0.01em;
    }

    .font-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(139, 92, 246, 0.15), transparent),
        radial-gradient(ellipse 60% 50% at 80% 50%, rgba(6, 182, 212, 0.08), transparent),
        radial-gradient(ellipse 60% 50% at 20% 80%, rgba(139, 92, 246, 0.08), transparent);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(8, 8, 13, 0.7);
      border-bottom: 1px solid var(--border);
    }

    .nav-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .logo-icon::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.2));
    }

    .logo-icon svg {
      width: 22px;
      height: 22px;
      color: white;
      z-index: 1;
    }

    .logo-text h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .logo-text p {
      font-size: 11px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, monospace;
      margin-top: 2px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      position: relative;
      width: 280px;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 40px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .sort-buttons {
      display: flex;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .sort-btn {
      padding: 7px 14px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sort-btn:hover {
      color: var(--text-primary);
    }

    .sort-btn.active {
      background: var(--accent);
      color: white;
    }

    .stats {
      display: flex;
      gap: 40px;
      padding: 24px 0 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
      flex-wrap: wrap;
      align-items: center;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .stat-item.compact .stat-value {
      font-size: 14px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-weight: 500;
      letter-spacing: 0;
      color: var(--text-secondary);
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
    }

    .masonry {
      columns: 5 240px;
      column-gap: 16px;
    }

    @media (max-width: 1200px) {
      .masonry { columns: 4 240px; }
    }

    @media (max-width: 900px) {
      .masonry { columns: 3 240px; }
    }

    @media (max-width: 600px) {
      .masonry { columns: 2 200px; }
    }

    .image-card {
      break-inside: avoid;
      margin-bottom: 16px;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      animation: fadeInUp 0.6s ease-out forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .image-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-hover);
      box-shadow:
        0 20px 40px -10px rgba(0, 0, 0, 0.5),
        0 0 0 1px var(--border-hover);
    }

    .image-card .thumb {
      width: 100%;
      display: block;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .image-card:hover .thumb {
      transform: scale(1.05);
    }

    .image-info {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .image-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .image-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    .format-tag {
      display: inline-block;
      padding: 2px 6px;
      background: rgba(139, 92, 246, 0.15);
      color: var(--accent);
      border-radius: 4px;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .preview-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px;
      animation: fadeIn 0.3s ease-out;
    }

    .preview-overlay.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .preview-container {
      max-width: 90vw;
      max-height: 90vh;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 24px;
      align-items: start;
    }

    .preview-image-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-elevated);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      max-height: 90vh;
    }

    .preview-image-wrap img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      animation: zoomIn 0.4s ease-out;
    }

    @keyframes zoomIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .preview-info {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .preview-info h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
      word-break: break-all;
    }

    .info-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
    }

    .info-value {
      font-size: 13px;
      color: var(--text-primary);
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    .preview-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      color: white;
    }

    .preview-nav:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-50%) scale(1.1);
    }

    .preview-nav.prev { left: 20px; }
    .preview-nav.next { right: 20px; }

    .preview-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      color: white;
    }

    .preview-close:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(90deg);
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    @media (max-width: 768px) {
      .nav-content {
        flex-direction: column;
        height: auto;
        padding: 16px 0;
        gap: 12px;
      }
      .nav-actions {
        width: 100%;
        flex-direction: column;
      }
      .search-box { width: 100%; }
      .sort-buttons { width: 100%; justify-content: center; }
      .preview-container {
        grid-template-columns: 1fr;
        max-height: 95vh;
        overflow-y: auto;
      }
      .preview-image-wrap { max-height: 60vh; }
      .stats { gap: 24px; }
      .stat-value { font-size: 18px; }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
  </style>
</head>

  <header>

      <div class="nav-content">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

              <polyline points="21 15 16 10 5 21"/>

        <div class="nav-actions">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>

            <input type="text" id="searchInput" placeholder="搜索文件名...">

          <div class="sort-buttons">

              <span>时间</span>
            </button>
            <button class="sort-btn" data-sort="size">

            </button>
            <button class="sort-btn" data-sort="name">
              <span>名称</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="totalInfo">-</div>
        <div class="stat-label">图片统计</div>
      </div>
      <div class="stat-item compact">
        <div class="stat-value" id="formatDist">-</div>
        <div class="stat-label">格式分布</div>
      </div>
    </div>

    <div class="masonry" id="imageGrid"></div>
  </main>

  <div class="preview-overlay" id="previewOverlay">
    <button class="preview-close" id="previewClose">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <button class="preview-nav prev" id="previewPrev">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <button class="preview-nav next" id="previewNext">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
    <div class="preview-container">
      <div class="preview-image-wrap">
        <img id="previewImage" src="" alt="">
      </div>
      <div class="preview-info">
        <h2 id="previewName"></h2>
        <div class="info-row">
          <span class="info-label">文件大小</span>
          <span class="info-value" id="infoSize"></span>
        </div>
        <div class="info-row">
          <span class="info-label">图片尺寸</span>
          <span class="info-value" id="infoDimensions"></span>
        </div>
        <div class="info-row">
          <span class="info-label">创建时间</span>
          <span class="info-value" id="infoCreated"></span>
        </div>
        <div class="info-row">
          <span class="info-label">修改时间</span>
          <span class="info-value" id="infoModified"></span>
        </div>
        <div class="info-row">
          <span class="info-label">文件格式</span>
          <span class="info-value" id="infoFormat"></span>
        </div>
        <div class="info-row">
          <span class="info-label">文件路径</span>
          <span class="info-value" id="infoPath"></span>
        </div>
      </div>
    </div>
  </div>

    // 内置 SVG 主题生成器 - 模拟各种风格的图片
    function generateSvg(width, height, theme) {
      const w = width;
      const h = height;
      const themes = {
        sunset: `
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ff6b6b"/>
              <stop offset="40%" stop-color="#ffa94d"/>

              <stop offset="0%" stop-color="#fce7f3"/>
              <stop offset="50%" stop-color="#fbcfe8"/>
              <stop offset="100%" stop-color="#f9a8d4"/>
            </linearGradient>
          </defs>
          <rect width="${w}" height="${h}" fill="url(#g)"/>
          <g fill="#831843" opacity="0.8">
            <path d="M0,${h*0.3} L${w*0.05},${h*0.4} L${w*0.1},${h*0.3} L${w*0.15},${h*0.4} L${w*0.2},${h*0.3} L${w*0.25},${h*0.4} L${w*0.3},${h*0.3} L${w*0.35},${h*0.4} L${w*0.4},${h*0.3} L${w*0.45},${h*0.4} L${w*0.5},${h*0.3} L${w*0.55},${h*0.4} L${w*0.6},${h*0.3} L${w*0.65},${h*0.4} L${w*0.7},${h*0.3} L${w*0.75},${h*0.4} L${w*0.8},${h*0.3} L${w*0.85},${h*0.4} L${w*0.9},${h*0.3} L${w*0.95},${h*0.4} L${w},${h*0.3} L${w},${h*0.4} L0,${h*0.4} Z"/>
          </g>
          <g fill="#fce7f3">
            <circle cx="${w*0.2}" cy="${h*0.2}" r="${w*0.02}"/>
            <circle cx="${w*0.4}" cy="${h*0.15}" r="${w*0.025}"/>
            <circle cx="${w*0.6}" cy="${h*0.25}" r="${w*0.02}"/>
            <circle cx="${w*0.8}" cy="${h*0.18}" r="${w*0.022}"/>
            <circle cx="${w*0.3}" cy="${h*0.6}" r="${w*0.018}"/>
            <circle cx="${w*0.5}" cy="${h*0.7}" r="${w*0.02}"/>
            <circle cx="${w*0.7}" cy="${h*0.6}" r="${w*0.022}"/>
            <circle cx="${w*0.15}" cy="${h*0.5}" r="${w*0.018}"/>
            <circle cx="${w*0.85}" cy="${h*0.55}" r="${w*0.02}"/>
          </g>
        `,
        vintage: `
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fbbf24"/>
              <stop offset="100%" stop-color="#b45309"/>
            </linearGradient>
          </defs>
          <rect width="${w}" height="${h}" fill="url(#g)"/>
          <ellipse cx="${w*0.4}" cy="${h*0.65}" rx="${w*0.25}" ry="${h*0.1}" fill="#1c1917"/>
          <ellipse cx="${w*0.6}" cy="${h*0.65}" rx="${w*0.25}" ry="${h*0.1}" fill="#1c1917"/>
          <path d="M${w*0.15},${h*0.55} L${w*0.85},${h*0.55} L${w*0.75},${h*0.4} Q${w*0.5},${h*0.3} ${w*0.25},${h*0.4} Z" fill="#dc2626"/>
          <ellipse cx="${w*0.3}" cy="${h*0.6}" rx="${w*0.04}" ry="${h*0.025}" fill="#fef3c7"/>
          <ellipse cx="${w*0.7}" cy="${h*0.6}" rx="${w*0.04}" ry="${h*0.025}" fill="#fef3c7"/>
        `,
      };

      const themeSvg = themes[theme] || themes.mountain;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${themeSvg}</svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    // 为每张图片生成内嵌 SVG 缩略图
    mockImages.forEach(img => {
      const thumbWidth = 600;
      const thumbHeight = Math.floor(600 * img.height / img.width);
      img.thumbnail = generateSvg(thumbWidth, thumbHeight, img.theme);
    });

    // 状态
    let currentSort = 'date';
    let currentOrder = 'desc';
    let currentSearch = '';
    let currentPreviewIndex = -1;

    // 工具函数
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function formatDate(isoString) {
      const d = new Date(isoString);
      return d.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function sortImages(images) {
      const sorted = [...images];
      sorted.sort((a, b) => {
        let aVal, bVal;
        if (currentSort === 'date') { aVal = new Date(a.created).getTime(); bVal = new Date(b.created).getTime(); }
        else if (currentSort === 'size') { aVal = a.size; bVal = b.size; }
        else { aVal = a.filename.toLowerCase(); bVal = b.filename.toLowerCase(); }
        if (aVal < bVal) return currentOrder === 'asc' ? -1 : 1;
        if (aVal > bVal) return currentOrder === 'asc' ? 1 : -1;
        return 0;
      });
      return sorted;
    }

    function filterImages(images) {
      if (!currentSearch) return images;
      const q = currentSearch.toLowerCase();
      return images.filter(img => img.filename.toLowerCase().includes(q));
    }

    function renderStats(images) {
      if (images.length > 0) {
        // 图片统计：18 张 · 共40.58MB
        const totalSize = images.reduce((sum, img) => sum + img.size, 0);
        document.getElementById('totalInfo').textContent = `${images.length} 张 · 共${formatSize(totalSize)}`;

        // 格式分布：格式：JPG 9 | PNG 5 | WebP 3
        const formatMap = {};
        images.forEach(img => {
          formatMap[img.format] = (formatMap[img.format] || 0) + 1;
        });
        const dist = Object.entries(formatMap)
          .sort((a, b) => b[1] - a[1])
          .map(([fmt, cnt]) => `${fmt.toUpperCase()} ${cnt}`)
          .join(' | ');
        document.getElementById('formatDist').textContent = `格式：${dist}`;
      } else {
        document.getElementById('totalInfo').textContent = '0 张 · 共0 B';
        document.getElementById('formatDist').textContent = '格式：-';
      }
    }

    function renderGrid() {
      const filtered = filterImages(mockImages);
      const sorted = sortImages(filtered);
      const grid = document.getElementById('imageGrid');
      renderStats(sorted);

      if (sorted.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <p>没有找到匹配的图片</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = sorted.map((img, i) => `
        <div class="image-card" data-index="${i}" style="animation-delay: ${i * 0.04}s">
          <img class="thumb" src="${img.thumbnail}" alt="${img.filename}" loading="lazy">
          <div class="image-info">
            <div class="image-name">${img.filename}</div>
            <div class="image-meta">
              <span>${formatSize(img.size)} · ${img.width}×${img.height}</span>
              <span class="format-tag">${img.format}</span>
            </div>
          </div>
        </div>
      `).join('');

      grid.querySelectorAll('.image-card').forEach(card => {
        card.addEventListener('click', () => {
          currentPreviewIndex = parseInt(card.dataset.index);
          showPreview(sorted[currentPreviewIndex]);
        });
      });
    }

    function showPreview(img) {
      // 预览用大图
      const previewWidth = 1200;
      const previewHeight = Math.floor(1200 * img.height / img.width);
      document.getElementById('previewImage').src = generateSvg(previewWidth, previewHeight, img.theme);
      document.getElementById('previewName').textContent = img.filename;
      document.getElementById('infoSize').textContent = formatSize(img.size);
      document.getElementById('infoDimensions').textContent = `${img.width} × ${img.height} 像素`;
      document.getElementById('infoCreated').textContent = formatDate(img.created);
      document.getElementById('infoModified').textContent = formatDate(img.modified);
      document.getElementById('infoFormat').textContent = img.format.toUpperCase();
      document.getElementById('infoPath').textContent = img.path;
      document.getElementById('previewOverlay').classList.add('active');
    }

    function hidePreview() {
      document.getElementById('previewOverlay').classList.remove('active');
      currentPreviewIndex = -1;
    }

    function navigatePreview(direction) {
      const filtered = filterImages(mockImages);
      const sorted = sortImages(filtered);
      if (currentPreviewIndex < 0) return;
      currentPreviewIndex = (currentPreviewIndex + direction + sorted.length) % sorted.length;
      showPreview(sorted[currentPreviewIndex]);
    }

    // 事件绑定
    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentSearch = e.target.value;
      renderGrid();
    });

    document.querySelectorAll('.sort-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const field = btn.dataset.sort;
        if (currentSort === field) {
          currentOrder = currentOrder === 'asc' ? 'desc' : 'asc';
        } else {
          currentSort = field;
          currentOrder = 'desc';
        }
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGrid();
      });
    });

    document.getElementById('previewClose').addEventListener('click', hidePreview);
    document.getElementById('previewPrev').addEventListener('click', () => navigatePreview(-1));
    document.getElementById('previewNext').addEventListener('click', () => navigatePreview(1));
    document.getElementById('previewOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'previewOverlay') hidePreview();
    });

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('previewOverlay').classList.contains('active')) return;
      if (e.key === 'Escape') hidePreview();
      if (e.key === 'ArrowLeft') navigatePreview(-1);
      if (e.key === 'ArrowRight') navigatePreview(1);
    });

    renderGrid();
  </script>
</body>
</html>
