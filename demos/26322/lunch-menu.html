<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, "Noto Sans SC", sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 40px 36px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .tag-section {
      margin-bottom: 24px;
      text-align: left;
    }
    .tag-label {
      font-size: 14px;
      font-weight: 600;
      color: #555;
      margin-bottom: 10px;
    }
    .tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      padding: 8px 16px;
      border-radius: 20px;
      border: 2px solid #f0f0f0;
      background: #fafafa;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      user-select: none;
    }
    .tag:hover {
      border-color: #fcb69f;
    }
    .tag.active {
      background: #ff6b35;
      color: white;
      border-color: #ff6b35;
    }
    .recommend-btn {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      margin-top: 12px;
    }
    .recommend-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 107, 53, 0.35);
    }
    .recommend-btn:active {
      transform: scale(0.97);
    }
    .result-area {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px dashed #eee;
    }
    .result-area h2 {
      font-size: 16px;
      color: #888;
      margin-bottom: 12px;
    }
    .menu-card {
      background: #fff8f0;
      border-radius: 16px;
      padding: 20px;
      animation: fadeIn 0.4s ease;
    }
    .menu-name {
      font-size: 22px;
      font-weight: 700;
      color: #ff6b35;
      margin-bottom: 8px;
    }
    .menu-desc {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }
    .menu-tags {
      margin-top: 12px;
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .menu-tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      background: #ff6b35;
      color: white;
    }
    .reroll-btn {
      margin-top: 12px;
      padding: 10px 24px;
      font-size: 14px;
      color: #ff6b35;
      background: white;
      border: 2px solid #ff6b35;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .reroll-btn:hover {
      background: #ff6b35;
      color: white;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hidden { display: none; }
  </style>

      });

      const group = document.getElementById(groupId);
      const active = group.querySelector('.tag.active');
      return active ? active.dataset.value : null;
    }

    let lastItem = null;

    function recommend() {
      const taste = getSelectedTags('taste-tags');
      const budget = getSelectedTags('budget-tags');
      const type = getSelectedTags('type-tags');

      // 筛选
      let filtered = menus.filter(m => {
        if (taste && taste !== '无所谓' && !m.tags.includes(taste)) return false;
        if (budget && budget !== '不限' && m.price !== budget) return false;
        if (type && type !== '都可以' && !m.tags.includes(type)) return false;
        return true;
      });

      // 没有匹配结果时回退到全部
      if (filtered.length === 0) filtered = [...menus];

      // 排除上一个推荐，避免重复
      if (filtered.length > 1 && lastItem) {
        filtered = filtered.filter(m => m.name !== lastItem.name);
      }

      // 随机推荐
      const item = filtered[Math.floor(Math.random() * filtered.length)];
      lastItem = item;

      const card = document.getElementById('menu-card');
      // 重新触发动画：先移除再添加
      card.classList.remove('menu-card');
      void card.offsetWidth; // 强制回流
      card.classList.add('menu-card');

      card.innerHTML = `
        <div class="menu-name">${item.name}</div>
        <div class="menu-desc">${item.desc}</div>
        <div class="menu-tags">${item.tags.map(t => `<span class="menu-tag">${t}</span>`).join('')}</div>
      `;

      const area = document.getElementById('result-area');
      area.classList.remove('hidden');
    }
  </script>
</body>
</html>
