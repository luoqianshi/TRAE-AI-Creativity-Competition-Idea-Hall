<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儿童任务奖励系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <header class="header">
            <h1 class="app-title">🌸 任务奖励系统</h1>
            <div class="flower-count">
                <span class="flower-icon">🌸</span>
                <span id="totalFlowers" class="flower-number">0</span>
                <span class="flower-label">小红花</span>
            </div>
        </header>

        <!-- 孩子选择器 -->
        <div class="child-selector">
            <select id="childSelect" class="child-select">
                <!-- 孩子选项将在这里动态生成 -->
            </select>
            <button id="addChildBtn" class="btn btn-small btn-secondary">➕ 添加孩子</button>
            <button id="manageChildrenBtn" class="btn btn-small btn-secondary">⚙️ 管理</button>
        </div>

        <!-- 标签导航 -->
        <nav class="tabs">
            <button class="tab-btn active" data-tab="tasks">📋 任务</button>
            <button class="tab-btn" data-tab="rewards">🎁 兑换</button>
            <button class="tab-btn" data-tab="history">📝 记录</button>
        </nav>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 任务页面 -->
            <section id="tasks-tab" class="tab-content active">
                <div class="add-task-btn-wrapper">
                    <button id="addTaskBtn" class="btn btn-primary">➕ 添加新任务</button>
                </div>
                <div id="tasksList" class="tasks-list">
                    <!-- 任务列表将在这里动态生成 -->
                </div>
            </section>

            <!-- 兑换页面 -->
            <section id="rewards-tab" class="tab-content">
                <div class="add-reward-btn-wrapper">
                    <button id="addRewardBtn" class="btn btn-primary">➕ 添加新奖励</button>
                </div>
                <div id="rewardsList" class="rewards-list">
                    <!-- 奖励列表将在这里动态生成 -->
                </div>
            </section>

            <!-- 记录页面 -->
            <section id="history-tab" class="tab-content">
                <div id="historyList" class="history-list">
                    <!-- 历史记录将在这里动态生成 -->
                </div>
            </section>
        </main>
    </div>

    <!-- 添加/编辑任务模态框 -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="taskModalTitle">添加新任务</h2>
                <span class="close">&times;</span>
                <input type="hidden" id="taskId">
            </div>
            <form id="taskForm" class="modal-form">
                <div class="form-group">
                    <label for="taskTitle">任务名称</label>
                    <input type="text" id="taskTitle" required placeholder="例如：整理房间">
                </div>
                <div class="form-group">
                    <label for="taskDescription">任务描述（可选）</label>
                    <textarea id="taskDescription" placeholder="描述一下这个任务..."></textarea>
                </div>
                <div class="form-group">
                    <label for="taskFlowers">奖励小红花数</label>
                    <input type="number" id="taskFlowers" required min="1" value="1">
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-secondary cancel-btn">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 添加/编辑奖励模态框 -->
    <div id="rewardModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="rewardModalTitle">添加新奖励</h2>
                <span class="close">&times;</span>
                <input type="hidden" id="rewardId">
            </div>
            <form id="rewardForm" class="modal-form">
                <div class="form-group">
                    <label for="rewardName">奖励名称</label>
                    <input type="text" id="rewardName" required placeholder="例如：买玩具">
                </div>
                <div class="form-group">
                    <label for="rewardType">奖励类型</label>
                    <select id="rewardType">
                        <option value="money">💰 零花钱</option>
                        <option value="item">🎮 物品</option>
                        <option value="wish">✨ 愿望</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="rewardDescription">奖励描述（可选）</label>
                    <textarea id="rewardDescription" placeholder="描述一下这个奖励..."></textarea>
                </div>
                <div class="form-group">
                    <label for="rewardCost">需要小红花数</label>
                    <input type="number" id="rewardCost" required min="1" value="5">
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-secondary cancel-btn">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 添加/编辑孩子模态框 -->
    <div id="childModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="childModalTitle">添加新孩子</h2>
                <span class="close">&times;</span>
                <input type="hidden" id="childId">
            </div>
            <form id="childForm" class="modal-form">
                <div class="form-group">
                    <label for="childName">孩子名称</label>
                    <input type="text" id="childName" required placeholder="例如：小明">
                </div>
                <div class="form-group">
                    <label for="childIcon">选择头像</label>
                    <select id="childIcon">
                        <option value="👦">👦 男孩</option>
                        <option value="👧">👧 女孩</option>
                        <option value="🧒">🧒 孩子</option>
                        <option value="😊">😊 笑脸</option>
                        <option value="😎">😎 酷</option>
                        <option value="🤗">🤗 拥抱</option>
                        <option value="🌟">🌟 星星</option>
                        <option value="🌈">🌈 彩虹</option>
                    </select>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-secondary cancel-btn">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 管理孩子模态框 -->
    <div id="manageChildrenModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>管理孩子</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-form">
                <div id="childrenList" class="children-list">
                    <!-- 孩子列表将在这里动态生成 -->
                </div>
                <div class="form-buttons" style="margin-top: 20px;">
                    <button type="button" class="btn btn-secondary cancel-btn" onclick="closeModal('manageChildrenModal')">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
