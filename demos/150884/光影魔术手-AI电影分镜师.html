<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光影魔术手 · 电影分镜师</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Serif+SC:wght@400;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --theater-black:#0a0a0c;--theater-dark:#131316;--theater-mid:#1c1c22;--theater-light:#2a2a32;
  --film-strip:#1a1a1e;--perforation:#3a3a42;
  --spotlight:#ffd700;--spotlight-soft:rgba(255,215,0,.15);--spotlight-glow:rgba(255,215,0,.3);
  --screen-white:#e8e8e8;--red-accent:#c4302b;--blue-tone:#3a5f8a;
  --text-main:#ccc;--text-dim:#666;--text-bright:#e8e8e8;
}
body{
  font-family:'Noto Serif SC',serif;background:var(--theater-black);color:var(--text-main);
  min-height:100vh;overflow-x:hidden;position:relative;
}
/* 影院渐暗效果 */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at center top,rgba(255,215,0,.04),transparent 50%);
}
.container{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:30px 20px}

header{text-align:center;padding:30px 0 20px;position:relative}
.spotlight-beam{
  position:absolute;top:0;left:50%;transform:translateX(-50%);width:300px;height:200px;
  background:radial-gradient(ellipse at top,var(--spotlight-soft),transparent 70%);
  pointer-events:none;z-index:-1;animation:spotlight-sway 6s ease-in-out infinite;
}
@keyframes spotlight-sway{0%,100%{transform:translateX(-60%) rotate(-5deg)}50%{transform:translateX(-40%) rotate(5deg)}}
header .film-reel{font-size:2rem;margin-bottom:8px}
header h1{font-family:'Bebas Neue',sans-serif;font-size:3rem;color:var(--spotlight);letter-spacing:.15em;text-shadow:0 0 30px var(--spotlight-glow)}
header .subtitle{color:var(--text-dim);font-size:.85rem;margin-top:6px;letter-spacing:.4em;font-family:'Bebas Neue',sans-serif}

/* 胶片条 */
.film-strip-deco{
  height:24px;background:var(--film-strip);margin:20px -20px;
  display:flex;justify-content:space-around;align-items:center;
  border-top:1px solid var(--perforation);border-bottom:1px solid var(--perforation);
}
.film-strip-deco .hole{width:12px;height:8px;background:var(--theater-black);border-radius:2px;border:1px solid var(--perforation)}

/* 项目信息 */
.project-info{
  background:var(--theater-dark);border:1px solid var(--theater-light);border-radius:4px;
  padding:24px;margin:24px 0;display:grid;grid-template-columns:1fr 1fr;gap:20px;
}
@media(max-width:700px){.project-info{grid-template-columns:1fr}}
.project-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--text-bright);letter-spacing:.05em}
.project-meta{font-size:.85rem;color:var(--text-dim);line-height:1.8;margin-top:8px}
.project-meta strong{color:var(--spotlight)}
.genre-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.genre-tag{padding:3px 12px;background:var(--theater-mid);border:1px solid var(--theater-light);font-size:.75rem;color:var(--text-main);border-radius:2px;font-family:'Bebas Neue',sans-serif;letter-spacing:.05em}

/* 分镜板 */
.storyboard{margin:30px 0}
.storyboard-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.storyboard-header h2{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--spotlight);letter-spacing:.1em}
.scene-nav{display:flex;gap:8px}
.scene-btn{
  width:36px;height:36px;background:var(--theater-mid);border:1px solid var(--theater-light);
  cursor:pointer;color:var(--text-dim);font-family:'Bebas Neue',sans-serif;font-size:1rem;transition:all .2s;
}
.scene-btn:hover,.scene-btn.active{border-color:var(--spotlight);color:var(--spotlight);background:var(--theater-dark)}

.storyboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:768px){.storyboard-grid{grid-template-columns:1fr}}

.shot-card{
  background:var(--theater-dark);border:1px solid var(--theater-light);border-radius:4px;
  overflow:hidden;cursor:pointer;transition:all .3s;position:relative;
}
.shot-card:hover{border-color:var(--spotlight);transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 20px var(--spotlight-soft)}
.shot-card.selected{border-color:var(--spotlight);box-shadow:0 0 25px var(--spotlight-glow)}

.shot-frame{
  aspect-ratio:16/9;background:var(--theater-black);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.shot-frame::before{
  content:'';position:absolute;top:0;left:0;right:0;height:6px;
  background:var(--film-strip);display:flex;
}
.shot-frame::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:6px;background:var(--film-strip);
}
.shot-visual{font-size:3rem;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));transition:transform .3s}
.shot-card:hover .shot-visual{transform:scale(1.1)}

.shot-number{
  position:absolute;top:10px;left:10px;font-family:'Bebas Neue',sans-serif;
  font-size:.8rem;color:var(--spotlight);background:rgba(0,0,0,.7);padding:2px 8px;letter-spacing:.05em;
}
.shot-type-badge{
  position:absolute;top:10px;right:10px;font-family:'Bebas Neue',sans-serif;
  font-size:.7rem;color:var(--text-main);background:rgba(196,48,43,.8);padding:2px 8px;letter-spacing:.05em;
}
.shot-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .3s;flex-direction:column;gap:8px;
}
.shot-card:hover .shot-overlay{opacity:1}
.shot-overlay-icon{font-size:1.5rem;color:var(--spotlight)}

.shot-info{padding:14px}
.shot-desc{font-size:.85rem;color:var(--text-main);line-height:1.6;margin-bottom:8px}
.shot-camera{font-size:.75rem;color:var(--text-dim);font-family:'Bebas Neue',sans-serif;letter-spacing:.05em}
.shot-camera span{color:var(--blue-tone)}

/* 分镜详情 */
.shot-detail{
  background:var(--theater-dark);border:1px solid var(--spotlight);border-radius:4px;
  padding:24px;margin:24px 0;display:none;
}
.shot-detail.show{display:block;animation:fade-in .4s ease}
@keyframes fade-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--theater-light)}
.detail-title{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--spotlight);letter-spacing:.05em}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.detail-grid{grid-template-columns:1fr}}
.detail-item label{display:block;font-size:.75rem;color:var(--text-dim);margin-bottom:4px;font-family:'Bebas Neue',sans-serif;letter-spacing:.05em}
.detail-item .value{font-size:.9rem;color:var(--text-main);line-height:1.6}
.detail-dialogue{
  margin-top:16px;padding:14px;background:var(--theater-black);border-left:3px solid var(--red-accent);
  font-size:.9rem;color:var(--text-main);line-height:1.7;font-style:italic;
}
.detail-dialogue::before{content:'台词：';color:var(--red-accent);font-style:normal;font-weight:700;font-family:'Bebas Neue',sans-serif;font-size:.8rem;letter-spacing:.05em}

/* 工具栏 */
.toolbar{display:flex;justify-content:center;gap:12px;margin:24px 0;flex-wrap:wrap}
.tool-btn{
  padding:10px 24px;background:var(--theater-dark);border:1px solid var(--theater-light);
  color:var(--text-main);cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:.9rem;
  letter-spacing:.1em;transition:all .25s;
}
.tool-btn:hover{border-color:var(--spotlight);color:var(--spotlight)}
.tool-btn.primary{background:var(--spotlight);color:var(--theater-black);border-color:var(--spotlight)}
.tool-btn.primary:hover{box-shadow:0 0 20px var(--spotlight-glow)}

/* 场景时间轴 */
.timeline{background:var(--theater-dark);border:1px solid var(--theater-light);border-radius:4px;padding:20px;margin:24px 0}
.timeline-title{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--text-dim);letter-spacing:.1em;margin-bottom:14px}
.timeline-bar{height:8px;background:var(--theater-black);border-radius:4px;position:relative;overflow:hidden}
.timeline-progress{height:100%;background:linear-gradient(90deg,var(--red-accent),var(--spotlight));border-radius:4px;transition:width .5s;width:0%}
.timeline-markers{display:flex;justify-content:space-between;margin-top:8px;font-size:.7rem;color:var(--text-dim);font-family:'Bebas Neue',sans-serif}

footer{text-align:center;padding:30px 0;color:var(--text-dim);font-size:.8rem;font-family:'Bebas Neue',sans-serif;letter-spacing:.15em}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="spotlight-beam"></div>
    <div class="film-reel">🎞</div>
    <h1>光影魔术手</h1>
    <p class="subtitle">S T O R Y B O A R D   S T U D I O</p>
  </header>

  <div class="film-strip-deco" id="filmStrip1"></div>

  <div class="project-info">
    <div>
      <div class="project-title">最后一场雨</div>
      <div class="project-meta">
        导演：<strong>陆远</strong> &nbsp;|&nbsp; 摄影：<strong>林深</strong><br>
        片长：<strong>12分钟</strong> &nbsp;|&nbsp; 画幅：<strong>2.39:1</strong><br>
        色调：<strong>冷蓝-暖黄对比</strong> &nbsp;|&nbsp; 分镜数：<strong>9</strong>
      </div>
    </div>
    <div>
      <div style="font-size:.85rem;color:var(--text-dim);margin-bottom:8px;font-family:'Bebas Neue',sans-serif;letter-spacing:.05em">GENRE / 风格</div>
      <div class="genre-tags">
        <span class="genre-tag">剧情短片</span>
        <span class="genre-tag">雨景</span>
        <span class="genre-tag">城市</span>
        <span class="genre-tag">情感</span>
        <span class="genre-tag">手持摄影</span>
      </div>
      <div style="font-size:.85rem;color:var(--text-dim);margin-top:12px;line-height:1.6">
        故事梗概：一个失去妻子的男人在雨夜重返他们初遇的咖啡馆，发现窗玻璃上还留着十年前她画的那把小伞。
      </div>
    </div>
  </div>

  <div class="storyboard">
    <div class="storyboard-header">
      <h2>▶ 分 镜 板</h2>
      <div class="scene-nav" id="sceneNav"></div>
    </div>
    <div class="storyboard-grid" id="storyboardGrid"></div>
  </div>

  <div class="shot-detail" id="shotDetail"></div>

  <div class="timeline">
    <div class="timeline-title">▶ 场 景 时 间 轴</div>
    <div class="timeline-bar"><div class="timeline-progress" id="timelineProgress"></div></div>
    <div class="timeline-markers"><span>0:00</span><span>3:00</span><span>6:00</span><span>9:00</span><span>12:00</span></div>
  </div>

  <div class="toolbar">
    <button class="tool-btn">添加分镜</button>
    <button class="tool-btn">导出PDF</button>
    <button class="tool-btn primary" id="playBtn">▶ 预览连镜</button>
  </div>

  <div class="film-strip-deco" id="filmStrip2"></div>

  <footer>LIGHT &amp; SHADOW · 光影魔术手 · 每一帧都是故事</footer>
</div>

<script>
// 胶片孔
['filmStrip1','filmStrip2'].forEach(id=>{
  const el=document.getElementById(id);
  for(let i=0;i<30;i++){const h=document.createElement('div');h.className='hole';el.appendChild(h)}
});

const shots=[
  {num:'01',visual:'🌧',type:'广角',scene:1,desc:'城市全景，暴雨倾盆，霓虹灯在雨幕中晕开',camera:'广角镜头 24mm',angle:'俯拍',movement:'缓慢推进',duration:'8秒',dialogue:'（无对白，只有雨声）'},
  {num:'02',visual:'🚶',type:'中景',scene:1,desc:'男人撑伞走过空无一人的街道，步伐沉重',camera:'50mm 定焦',angle:'平视跟拍',movement:'手持跟随',duration:'6秒',dialogue:'（画外音）十年了，这家店竟然还在。'},
  {num:'03',visual:'☕',type:'特写',scene:2,desc:'咖啡馆窗户上的水滴缓缓滑落，模糊了室内暖光',camera:'微距 100mm',angle:'正面平视',movement:'固定机位',duration:'5秒',dialogue:'（无对白，钢琴曲渐入）'},
  {num:'04',visual:'🪟',type:'特写',scene:2,desc:'窗玻璃上隐约可见一个用手指画的小伞图案',camera:'微距 100mm',angle:'侧面斜拍',movement:'极慢推近',duration:'7秒',dialogue:'（画外音）你总说下雨天要画把伞，说这样雨就不会淋到心。'},
  {num:'05',visual:'☔',type:'闪回',scene:3,desc:'十年前，年轻女孩笑着在起雾的窗户上画伞',camera:'35mm',angle:'过肩',movement:'手持晃动',duration:'6秒',dialogue:'女孩：你看！这样就有伞了！'},
  {num:'06',visual:'👐',type:'特写',scene:2,desc:'男人的手颤抖着触碰玻璃上的伞痕，指尖停在半空',camera:'微距 100mm',angle:'侧面',movement:'固定',duration:'4秒',dialogue:'（无对白，呼吸声加重）'},
  {num:'07',visual:'💺',type:'中景',scene:2,desc:'男人在靠窗的老位置坐下，面前两杯咖啡',camera:'50mm',angle:'正面',movement:'缓慢横移',duration:'8秒',dialogue:'服务员：还是老样子，两杯？男人：嗯。'},
  {num:'08',visual:'⏰',type:'蒙太奇',scene:4,desc:'时钟、空椅、冷掉的咖啡、窗外的雨，快速剪辑',camera:'多镜头',angle:'多角度',movement:'快速切换',duration:'5秒',dialogue:'（无对白，钢琴曲达到高潮）'},
  {num:'09',visual:'🌅',type:'远景',scene:5,desc:'雨停了，天边泛起微光，男人起身推门走入晨曦',camera:'广角 24mm',angle:'低角度仰拍',movement:'缓慢上摇',duration:'10秒',dialogue:'（画外音）伞还在，你也是。'},
];

// 场景导航
const sceneNav=document.getElementById('sceneNav');
const scenes=[...new Set(shots.map(s=>s.scene))];
scenes.forEach(s=>{
  const btn=document.createElement('button');
  btn.className='scene-btn'+(s===1?' active':'');
  btn.textContent=s;
  btn.addEventListener('click',function(){
    document.querySelectorAll('.scene-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    renderShots(s);
  });
  sceneNav.appendChild(btn);
});

function renderShots(scene){
  const grid=document.getElementById('storyboardGrid');
  grid.innerHTML='';
  const filtered=scene?shots.filter(s=>s.scene===scene):shots;
  filtered.forEach(shot=>{
    const card=document.createElement('div');
    card.className='shot-card';
    card.innerHTML=`
      <div class="shot-frame">
        <div class="shot-number">SHOT ${shot.num}</div>
        <div class="shot-type-badge">${shot.type}</div>
        <div class="shot-visual">${shot.visual}</div>
        <div class="shot-overlay"><div class="shot-overlay-icon">▶</div><div style="font-size:.75rem;color:var(--text-main)">查看详情</div></div>
      </div>
      <div class="shot-info">
        <div class="shot-desc">${shot.desc}</div>
        <div class="shot-camera">📷 ${shot.camera} &nbsp;|&nbsp; 🎯 <span>${shot.angle}</span> &nbsp;|&nbsp; 🎬 ${shot.movement}</div>
      </div>`;
    card.addEventListener('click',()=>showDetail(shot));
    grid.appendChild(card);
  });
}
renderShots(1);

function showDetail(shot){
  const detail=document.getElementById('shotDetail');
  detail.classList.add('show');
  detail.innerHTML=`
    <div class="detail-header">
      <div class="detail-title">分镜 ${shot.num} · 场景${shot.scene}</div>
      <div style="font-family:'Bebas Neue';color:var(--text-dim);font-size:.85rem;letter-spacing:.05em">时长：${shot.duration}</div>
    </div>
    <div class="detail-grid">
      <div class="detail-item"><label>CAMERA · 镜头</label><div class="value">${shot.camera}</div></div>
      <div class="detail-item"><label>ANGLE · 角度</label><div class="value">${shot.angle}</div></div>
      <div class="detail-item"><label>MOVEMENT · 运镜</label><div class="value">${shot.movement}</div></div>
      <div class="detail-item"><label>TYPE · 类型</label><div class="value">${shot.type}</div></div>
    </div>
    <div class="detail-dialogue">${shot.dialogue}</div>
    <div style="margin-top:16px;font-size:.9rem;color:var(--text-main);line-height:1.7;padding:12px;background:var(--theater-black);border-radius:4px">
      <strong style="color:var(--spotlight);font-family:'Bebas Neue';font-size:.8rem;letter-spacing:.05em">SCENE DESCRIPTION:</strong><br>${shot.desc}
    </div>`;
  detail.scrollIntoView({behavior:'smooth',block:'center'});
}

// 预览连镜
document.getElementById('playBtn').addEventListener('click',function(){
  const progress=document.getElementById('timelineProgress');
  let w=0;const interval=setInterval(()=>{
    w+=2;progress.style.width=w+'%';
    if(w>=100){clearInterval(interval);setTimeout(()=>progress.style.width='0%',1000)}
  },50);
});
</script>
</body>
</html>
