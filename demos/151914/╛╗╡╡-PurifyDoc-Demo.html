<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>净档 PurifyDoc — 职场文档清洗与内容调优工具</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --primary: #38bdf8;
            --primary-dark: #0284c7;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #475569;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid var(--border);
            padding: 24px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .logo {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; color: #fff;
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .header p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .container { padding: 24px 32px; max-width: 1600px; margin: 0 auto; }
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 48px;
            text-align: center;
            background: var(--surface);
            transition: all 0.3s;
            cursor: pointer;
            margin-bottom: 24px;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--primary);
            background: rgba(56, 189, 248, 0.05);
        }
        .upload-zone .icon { font-size: 48px; margin-bottom: 12px; }
        .upload-zone h3 { font-size: 16px; margin-bottom: 8px; }
        .upload-zone p { font-size: 13px; color: var(--text-muted); }
        .upload-zone input { display: none; }
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar label {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid var(--border);
            user-select: none;
        }
        .toolbar label:hover { border-color: var(--primary); }
        .toolbar input[type="checkbox"] { accent-color: var(--primary); }
        .btn {
            background: var(--primary);
            color: #0f172a;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-secondary {
            background: var(--surface-light);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .panel-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-body {
            padding: 18px;
            max-height: 500px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .panel-body::-webkit-scrollbar { width: 6px; }
        .panel-body::-webkit-scrollbar-thumb { background: var(--surface-light); border-radius: 3px; }
        .stats-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--surface);
            border-radius: 10px;
            padding: 16px 20px;
            border: 1px solid var(--border);
            flex: 1;
        }
        .stat-card .label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .stat-card .value { font-size: 22px; font-weight: 700; }
        .stat-card .value.good { color: var(--success); }
        .stat-card .value.warn { color: var(--warning); }
        .stat-card .value.bad { color: var(--danger); }
        .chunks-panel { margin-top: 20px; }
        .chunk-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }
        .chunk-item:hover { border-color: var(--primary); }
        .chunk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .chunk-id {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--surface-light);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .chunk-score {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        .score-bar {
            width: 80px;
            height: 6px;
            background: var(--surface-light);
            border-radius: 3px;
            overflow: hidden;
        }
        .score-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s;
        }
        .chunk-text {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text);
            margin-bottom: 8px;
        }
        .chunk-meta {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .suggestion {
            background: rgba(251, 191, 36, 0.1);
            border-left: 3px solid var(--warning);
            padding: 8px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 12px;
            margin-top: 8px;
            color: #fbbf24;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .highlight-add { background: rgba(52, 211, 153, 0.2); color: var(--success); }
        .highlight-del { background: rgba(248, 113, 113, 0.2); color: var(--danger); text-decoration: line-through; }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 4px;
        }
        .tag-clean { background: rgba(52, 211, 153, 0.15); color: var(--success); }
        .tag-issue { background: rgba(248, 113, 113, 0.15); color: var(--danger); }
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            .stats-bar { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo">净</div>
            <div>
                <h1>净档 PurifyDoc</h1>
                <p>职场文档清洗与内容调优工具 — 让脏数据变成干净的知识库原料</p>
            </div>
        </div>
        <div class="badge">学习工作赛道 · TRAE AI 创造力大赛</div>
    </div>

    <div class="container">
        <div class="upload-zone" id="uploadZone">
            <div class="icon">📄</div>
            <h3>拖拽文件到此处，或点击上传</h3>
            <p>支持 .txt / .md / .docx（建议先用 .txt 或 .md 体验）</p>
            <input type="file" id="fileInput" accept=".txt,.md,.docx">
        </div>

        <div class="toolbar" id="toolbar" style="display:none;">
            <label><input type="checkbox" id="optBlank" checked> 去除多余空行</label>
            <label><input type="checkbox" id="optHeader" checked> 去除页眉页脚</label>
            <label><input type="checkbox" id="optDup" checked> 去除重复段落</label>
            <label><input type="checkbox" id="optBreak" checked> 修复断句换行</label>
            <label><input type="checkbox" id="optSpace" checked> 统一空白字符</label>
            <button class="btn" onclick="processDocument()">🚀 开始清洗</button>
            <button class="btn btn-secondary" onclick="exportResult()">⬇️ 导出结果</button>
        </div>

        <div class="stats-bar" id="statsBar" style="display:none;">
            <div class="stat-card">
                <div class="label">原始字数</div>
                <div class="value" id="statRaw">0</div>
            </div>
            <div class="stat-card">
                <div class="label">清洗后字数</div>
                <div class="value good" id="statClean">0</div>
            </div>
            <div class="stat-card">
                <div class="label">冗余去除率</div>
                <div class="value warn" id="statRatio">0%</div>
            </div>
            <div class="stat-card">
                <div class="label">平均质量分</div>
                <div class="value good" id="statScore">0</div>
            </div>
        </div>

        <div class="main-layout" id="mainLayout" style="display:none;">
            <div class="panel">
                <div class="panel-header">📋 原始文档</div>
                <div class="panel-body" id="rawPanel">等待上传...</div>
            </div>
            <div class="panel">
                <div class="panel-header">✨ 清洗结果</div>
                <div class="panel-body" id="cleanPanel">等待处理...</div>
            </div>
        </div>

        <div class="chunks-panel" id="chunksPanel" style="display:none;">
            <div class="panel">
                <div class="panel-header">🧩 智能分块与质量诊断</div>
                <div style="padding: 18px;" id="chunksList"></div>
            </div>
        </div>
    </div>

    <script>
        let rawText = '';
        let cleanText = '';
        let chunks = [];

        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                rawText = e.target.result;
                document.getElementById('rawPanel').textContent = rawText.substring(0, 8000) + (rawText.length > 8000 ? '\n\n... (内容已截断，仅展示前 8000 字)' : '');
                document.getElementById('toolbar').style.display = 'flex';
                document.getElementById('mainLayout').style.display = 'grid';
                document.getElementById('cleanPanel').textContent = '点击「开始清洗」处理文档';
            };
            reader.readAsText(file);
        }

        function processDocument() {
            if (!rawText) return alert('请先上传文档');

            let text = rawText;
            const issues = [];

            // 1. 统一空白字符
            if (document.getElementById('optSpace').checked) {
                text = text.replace(/[\t\u00A0]+/g, ' ');
                text = text.replace(/ +/g, ' ');
            }

            // 2. 去除多余空行
            if (document.getElementById('optBlank').checked) {
                const before = text.length;
                text = text.replace(/\n{3,}/g, '\n\n');
                text = text.replace(/^\s+|\s+$/g, '');
                if (text.length < before) issues.push('去除多余空行与首尾空白');
            }

            // 3. 去除页眉页脚（简单规则）
            if (document.getElementById('optHeader').checked) {
                const lines = text.split('\n');
                const filtered = lines.filter(line => {
                    const trimmed = line.trim();
                    if (!trimmed) return true;
                    // 页码模式
                    if (/^\s*\d+\s*$/.test(trimmed)) return false;
                    if (/^\s*第?\s*[一二三四五六七八九十百]+\s*页\s*$/i.test(trimmed)) return false;
                    if (/^\s*Page\s*\d+\s*$/i.test(trimmed)) return false;
                    // 过短的孤立行（可能是页眉）
                    if (trimmed.length < 8 && lines.indexOf(line) > 0 && lines.indexOf(line) < lines.length - 1) {
                        // 保留可能是标题的短行
                        if (/[。！？.!?]$/.test(trimmed)) return true;
                        return false;
                    }
                    return true;
                });
                if (filtered.length < lines.length) issues.push('去除疑似页眉页脚与页码');
                text = filtered.join('\n');
            }

            // 4. 修复断句换行
            if (document.getElementById('optBreak').checked) {
                text = text.replace(/([^。！？.!?\n])\n([^\n])/g, '$1$2');
                issues.push('修复被错误换行打断的句子');
            }

            // 5. 去除重复段落
            if (document.getElementById('optDup').checked) {
                const paras = text.split('\n\n');
                const seen = new Set();
                const unique = [];
                let dupCount = 0;
                for (const p of paras) {
                    const key = p.trim().replace(/\s+/g, '').substring(0, 50);
                    if (key.length > 10 && seen.has(key)) {
                        dupCount++;
                        continue;
                    }
                    seen.add(key);
                    unique.push(p);
                }
                if (dupCount > 0) issues.push(`去除 ${dupCount} 处重复段落`);
                text = unique.join('\n\n');
            }

            cleanText = text;

            // 智能分块
            chunks = semanticChunk(cleanText);

            // 质量评分
            chunks.forEach(chunk => evaluateChunk(chunk));

            // 更新界面
            document.getElementById('cleanPanel').textContent = cleanText.substring(0, 8000) + (cleanText.length > 8000 ? '\n\n... (内容已截断)' : '');
            document.getElementById('statsBar').style.display = 'flex';
            document.getElementById('chunksPanel').style.display = 'block';

            document.getElementById('statRaw').textContent = rawText.length.toLocaleString();
            document.getElementById('statClean').textContent = cleanText.length.toLocaleString();
            const ratio = rawText.length > 0 ? Math.round((1 - cleanText.length / rawText.length) * 100) : 0;
            const ratioEl = document.getElementById('statRatio');
            ratioEl.textContent = ratio + '%';
            ratioEl.className = 'value ' + (ratio > 20 ? 'good' : ratio > 5 ? 'warn' : '');

            const avgScore = chunks.length ? Math.round(chunks.reduce((s, c) => s + c.score, 0) / chunks.length) : 0;
            const scoreEl = document.getElementById('statScore');
            scoreEl.textContent = avgScore;
            scoreEl.className = 'value ' + (avgScore >= 80 ? 'good' : avgScore >= 60 ? 'warn' : 'bad');

            renderChunks();
        }

        function semanticChunk(text) {
            const paragraphs = text.split(/\n\n+/);
            const result = [];
            let buffer = '';

            for (const para of paragraphs) {
                const trimmed = para.trim();
                if (!trimmed) continue;

                if (trimmed.length < 40) {
                    buffer += (buffer ? '\n' : '') + trimmed;
                    if (buffer.length >= 60) {
                        result.push({ text: buffer });
                        buffer = '';
                    }
                } else if (trimmed.length > 350) {
                    if (buffer) { result.push({ text: buffer }); buffer = ''; }
                    const sentences = trimmed.match(/[^。！？.!?]+[。！？.!?]+/g) || [trimmed];
                    let subBuf = '';
                    for (const sent of sentences) {
                        if ((subBuf + sent).length > 300) {
                            if (subBuf) result.push({ text: subBuf });
                            subBuf = sent;
                        } else {
                            subBuf += sent;
                        }
                    }
                    if (subBuf) result.push({ text: subBuf });
                } else {
                    if (buffer) { result.push({ text: buffer }); buffer = ''; }
                    result.push({ text: trimmed });
                }
            }
            if (buffer) result.push({ text: buffer });
            return result;
        }

        function evaluateChunk(chunk) {
            const text = chunk.text;
            const len = text.length;

            // 长度评分 (0-40)
            let lenScore = 0;
            if (len >= 80 && len <= 300) lenScore = 40;
            else if (len >= 50) lenScore = 35;
            else if (len >= 30) lenScore = 25;
            else lenScore = Math.max(5, len);

            // 完整性评分 (0-30)
            let compScore = 0;
            const endPunct = /[。！？.!?]$/;
            const hasEnd = endPunct.test(text.trim());
            if (hasEnd) compScore = 30;
            else if (text.trim().length > 20) compScore = 15;
            else compScore = 5;

            // 语义密度评分 (0-30)
            let densityScore = 0;
            const chineseChars = (text.match(/[\u4e00-\u9fff]/g) || []).length;
            const ratio = len > 0 ? chineseChars / len : 0;
            if (ratio > 0.5) densityScore = 30;
            else if (ratio > 0.3) densityScore = 20;
            else densityScore = 10;

            chunk.score = Math.min(100, lenScore + compScore + densityScore);
            chunk.len = len;
            chunk.hasEnd = hasEnd;
            chunk.density = ratio;

            // 生成建议
            chunk.suggestions = [];
            if (len < 40) chunk.suggestions.push('段落过短，建议与相邻段落合并，形成更完整的语义单元');
            if (len > 400) chunk.suggestions.push('段落过长，建议按主题或句子边界拆分，便于检索与阅读');
            if (!hasEnd && len > 20) chunk.suggestions.push('段落结尾缺少标点，可能语义不完整，建议检查是否被截断');
            if (ratio < 0.3 && len > 50) chunk.suggestions.push('内容中特殊符号/空白占比过高，建议检查是否残留格式噪音');

            return chunk;
        }

        function renderChunks() {
            const container = document.getElementById('chunksList');
            if (!chunks.length) {
                container.innerHTML = '<div class="empty-state">暂无分块数据</div>';
                return;
            }

            container.innerHTML = chunks.map((chunk, i) => {
                const scoreColor = chunk.score >= 80 ? 'var(--success)' : chunk.score >= 60 ? 'var(--warning)' : 'var(--danger)';
                return `
                    <div class="chunk-item">
                        <div class="chunk-header">
                            <span class="chunk-id">Chunk #${i + 1}</span>
                            <div class="chunk-score">
                                <span>质量分 ${chunk.score}</span>
                                <div class="score-bar"><div class="score-bar-fill" style="width:${chunk.score}%;background:${scoreColor}"></div></div>
                            </div>
                        </div>
                        <div class="chunk-text">${escapeHtml(chunk.text)}</div>
                        <div class="chunk-meta">
                            <span>${chunk.len} 字</span>
                            <span>${chunk.hasEnd ? '✅ 结尾完整' : '⚠️ 结尾不完整'}</span>
                            <span>语义密度 ${Math.round(chunk.density * 100)}%</span>
                        </div>
                        ${chunk.suggestions.map(s => `<div class="suggestion">💡 ${s}</div>`).join('')}
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function exportResult() {
            if (!cleanText) return alert('请先处理文档');
            const report = {
                tool: '净档 PurifyDoc',
                timestamp: new Date().toISOString(),
                originalLength: rawText.length,
                cleanedLength: cleanText.length,
                reductionRate: rawText.length > 0 ? ((1 - cleanText.length / rawText.length) * 100).toFixed(1) + '%' : '0%',
                averageScore: chunks.length ? Math.round(chunks.reduce((s, c) => s + c.score, 0) / chunks.length) : 0,
                chunkCount: chunks.length,
                chunks: chunks.map((c, i) => ({
                    id: i + 1,
                    text: c.text,
                    length: c.len,
                    score: c.score,
                    suggestions: c.suggestions
                }))
            };
            const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'purifydoc-report.json';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
