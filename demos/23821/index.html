<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什么 - 美食推荐</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff6b35;
            --primary-dark: #e55a2b;
            --secondary: #f7c59f;
            --accent: #ffb347;
            --bg-dark: #2d1810;
            --bg-warm: #4a2c2a;
            --text-light: #fff5ee;
            --card-bg: rgba(255, 245, 238, 0.95);
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-warm) 50%, #6b3a3a 100%);
            min-height: 100vh;
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            animation: float 20s ease-in-out infinite;
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            background: var(--primary);
            top: -100px;
            right: -50px;
            animation-delay: 0s;
        }

        .circle-2 {
            width: 200px;
            height: 200px;
            background: var(--accent);
            bottom: -80px;
            left: -60px;
            animation-delay: -7s;
        }

        .circle-3 {
            width: 150px;
            height: 150px;
            background: var(--secondary);
            top: 40%;
            left: 10%;
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-30px) rotate(120deg); }
            66% { transform: translateY(20px) rotate(240deg); }
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 40px 20px 30px;
        }

        .header h1 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: clamp(2.5rem, 6vw, 4rem);
            color: var(--accent);
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3), 0 0 30px rgba(255,179,71,0.3);
            margin-bottom: 10px;
            letter-spacing: 8px;
            animation: titlePulse 3s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .header p {
            font-size: 1.1rem;
            color: var(--secondary);
            opacity: 0.9;
            margin-top: 10px;
        }

        /* 口味筛选区 */
        .filter-section {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 25px 20px;
            margin-bottom: 30px;
        }

        .filter-btn {
            padding: 10px 24px;
            border: 2px solid rgba(255,179,71,0.4);
            border-radius: 25px;
            background: rgba(45,24,16,0.7);
            color: var(--secondary);
            cursor: pointer;
            font-family: 'Noto Serif SC', serif;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .filter-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50%;
            transition: all 0.4s ease;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        .filter-btn:hover {
            border-color: var(--accent);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255,107,53,0.3);
        }

        .filter-btn:hover::before {
            width: 200%;
            height: 200%;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-color: var(--primary);
            color: white;
            box-shadow: 0 6px 20px rgba(255,107,53,0.4);
        }

        /* 随机按钮 */
        .random-section {
            text-align: center;
            margin-bottom: 35px;
        }

        .random-btn {
            padding: 16px 48px;
            font-size: 1.15rem;
            font-family: 'ZCOOL KuaiLe', cursive;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ff6b35 0%, #ffb347 100%);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 30px rgba(255,107,53,0.4);
            position: relative;
            overflow: hidden;
        }

        .random-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 40px rgba(255,107,53,0.5);
        }

        .random-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .random-btn.spinning {
            animation: spinBtn 0.6s ease-in-out;
        }

        @keyframes spinBtn {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(5deg) scale(1.05); }
            50% { transform: rotate(-5deg) scale(1.02); }
            75% { transform: rotate(3deg) scale(1.03); }
            100% { transform: rotate(0deg) scale(1); }
        }

        /* 美食展示区 */
        .food-display {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 40px;
            min-height: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .food-card {
            display: flex;
            align-items: center;
            gap: 40px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 图片区域 */
        .food-image-wrapper {
            flex-shrink: 0;
            width: 380px;
            height: 380px;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            position: relative;
            background: linear-gradient(135deg, #f7c59f, #ffe4d6);
        }

        .food-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .food-image-wrapper:hover .food-image {
            transform: scale(1.08);
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
        }

        /* 信息区域 */
        .food-info {
            flex: 1;
            padding: 10px;
        }

        .food-name {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 2.8rem;
            color: var(--bg-dark);
            margin-bottom: 18px;
            line-height: 1.3;
        }

        .food-tags {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 6px 16px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .food-desc {
            font-size: 1.05rem;
            color: #666;
            line-height: 1.9;
            margin-bottom: 25px;
        }

        .food-meta {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .meta-item {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #fff5ee, #ffe8d6);
            border-radius: 15px;
            transition: transform 0.3s ease;
        }

        .meta-item:hover {
            transform: translateY(-3px);
        }

        .meta-label {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 5px;
        }

        .meta-value {
            font-size: 1.15rem;
            color: var(--bg-dark);
            font-weight: bold;
        }

        /* 导航控制 */
        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 2px dashed rgba(255,179,71,0.3);
        }

        .nav-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--primary);
            color: white;
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255,107,53,0.3);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-indicator {
            font-size: 1.1rem;
            color: var(--bg-dark);
            font-weight: bold;
            min-width: 80px;
            text-align: center;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 30px;
            color: var(--secondary);
            opacity: 0.7;
            font-size: 0.9rem;
        }

        /* 响应式设计 */
        @media (max-width: 900px) {
            .food-card {
                flex-direction: column;
                text-align: center;
            }

            .food-image-wrapper {
                width: 300px;
                height: 300px;
            }

            .food-tags {
                justify-content: center;
            }

            .food-info {
                padding: 0;
            }

            .food-name {
                font-size: 2.2rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .food-display {
                padding: 25px 15px;
                border-radius: 20px;
            }

            .food-image-wrapper {
                width: 250px;
                height: 250px;
                border-radius: 20px;
            }

            .header h1 {
                letter-spacing: 4px;
            }

            .filter-section {
                gap: 8px;
            }

            .filter-btn {
                padding: 8px 16px;
                font-size: 0.85rem;
            }

            .random-btn {
                padding: 14px 36px;
                font-size: 1rem;
            }

            .food-meta {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .meta-item {
                padding: 10px 5px;
            }
        }

        /* 随机选中动画 */
        .highlight-animation {
            animation: highlightGlow 0.8s ease-out;
        }

        @keyframes highlightGlow {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.8);
            }
            70% {
                box-shadow: 0 0 0 30px rgba(255, 107, 53, 0);
            }
            100% {
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            }
        }
    </style>
</head>

    <!-- 背景装饰 -->

            <button class="filter-btn" data-taste="甜">🍬 甜品</button>

            <button class="filter-btn" data-taste="香浓">🍲 香浓</button>

        <!-- 随机推荐按钮 -->
        <section class="random-section">
            <button class="random-btn" id="randomBtn" onclick="randomFood()">
                🎲 随机选一个
            </button>
        </section>

        <!-- 美食展示区 -->
        <main class="food-display" id="foodDisplay">
            <div class="food-card" id="foodCard">
                <!-- 动态内容 -->
            </div>

            <!-- 导航控制 -->
            <div class="navigation">
                <button class="nav-btn" id="prevBtn" onclick="prevFood()">◀</button>
                <span class="page-indicator" id="pageIndicator">1 / 20</span>
                <button class="nav-btn" id="nextBtn" onclick="nextFood()">▶</button>

        <!-- 页脚 -->

            <p>用心选择每一餐 ✨ | 共收录 <span id="totalCount">20</span> 道美味佳肴</p>
        </footer>
    </div>

        // 状态管理
        let currentIndex = 0;
        let currentTaste = 'all';
        let filteredFoods = [...foods];

        // 初始化
        function init() {
            renderFood();
            bindFilterEvents();
            updateTotalCount();
        }

        // 渲染当前美食
        function renderFood() {
            if (filteredFoods.length === 0) {
                document.getElementById('foodCard').innerHTML = `
                    <div style="text-align:center;width:100%;padding:60px 20px;">
                        <div style="font-size:4rem;margin-bottom:20px;">😅</div>
                        <h2 style="color:#666;font-size:1.5rem;margin-bottom:10px;">暂无匹配的美食</h2>
                        <p style="color:#999;">试试其他口味分类吧~</p>
                    </div>
                `;
                return;
            }

            const food = filteredFoods[currentIndex];
            const card = document.getElementById('foodCard');

            card.innerHTML = `
                <div class="food-image-wrapper">
                    <img src="${food.image}" alt="${food.name}" class="food-image"
                         onerror="this.parentElement.innerHTML='<div class=\\'image-placeholder\\'>${getEmoji(food.taste)}</div>'">
                </div>
                <div class="food-info">
                    <h2 class="food-name">${food.name}</h2>
                    <div class="food-tags">
                        ${food.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    <p class="food-desc">${food.desc}</p>
                    <div class="food-meta">
                        <div class="meta-item">
                            <div class="meta-label">📍 来源地</div>
                            <div class="meta-value">${food.region}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">⚡ 制作难度</div>
                            <div class="meta-value">${food.difficulty}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">⏱️ 所需时间</div>
                            <div class="meta-value">${food.time}</div>
                        </div>
                    </div>
                </div>
            `;

            updatePageIndicator();
            updateNavButtons();
        }

        // 根据口味获取emoji
        function getEmoji(taste) {
            const emojiMap = {
                '辣': '🌶️',
                '甜': '🍰',
                '咸鲜': '🍤',
                '清淡': '🥬',
                '酸爽': '🍋',
                '香浓': '🍲',
                '酸甜': '🍊'
            };
            return emojiMap[taste] || '🍽️';
        }

        // 更新页码指示器
        function updatePageIndicator() {
            document.getElementById('pageIndicator').textContent =
                `${currentIndex + 1} / ${filteredFoods.length}`;
        }

        // 更新导航按钮状态
        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === filteredFoods.length - 1;
        }

        // 更新总数显示
        function updateTotalCount() {
            document.getElementById('totalCount').textContent = filteredFoods.length;
        }

        // 上一个美食
        function prevFood() {
            if (currentIndex > 0) {
                currentIndex--;
                animateCardChange();
            }
        }

        // 下一个美食
        function nextFood() {
            if (currentIndex < filteredFoods.length - 1) {
                currentIndex++;
                animateCardChange();
            }
        }

        // 卡片切换动画
        function animateCardChange() {
            const card = document.getElementById('foodCard');
            card.style.animation = 'none';
            card.offsetHeight; // 触发重排
            card.style.animation = 'fadeInUp 0.5s ease-out';
            renderFood();
        }

        // 随机选美食
        function randomFood() {
            if (filteredFoods.length === 0) return;

            const btn = document.getElementById('randomBtn');
            btn.classList.add('spinning');

            // 快速滚动动画效果
            let count = 0;
            const maxCount = 15;
            const interval = setInterval(() => {
                currentIndex = Math.floor(Math.random() * filteredFoods.length);
                renderFood();
                count++;

                if (count >= maxCount) {
                    clearInterval(interval);
                    btn.classList.remove('spinning');

                    // 高亮动画
                    const display = document.getElementById('foodDisplay');
                    display.classList.add('highlight-animation');
                    setTimeout(() => {
                        display.classList.remove('highlight-animation');
                    }, 800);
                }
            }, 80);
        }

        // 绑定筛选事件
        function bindFilterEvents() {
            const filterBtns = document.querySelectorAll('.filter-btn');

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // 更新激活状态
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    // 筛选美食
                    currentTaste = btn.dataset.taste;

                    if (currentTaste === 'all') {
                        filteredFoods = [...foods];
                    } else {
                        filteredFoods = foods.filter(f => f.taste === currentTaste || f.taste.includes(currentTaste));
                    }

                    // 重置索引并重新渲染
                    currentIndex = 0;
                    updateTotalCount();
                    animateCardChange();
                });
            });
        }

        // 键盘导航支持
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                prevFood();
            } else if (e.key === 'ArrowRight') {
                nextFood();
            } else if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                randomFood();
            }
        });

        // 启动应用
        init();
    </script>
