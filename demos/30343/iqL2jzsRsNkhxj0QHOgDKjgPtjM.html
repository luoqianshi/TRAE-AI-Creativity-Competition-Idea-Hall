<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>幸福社区 · 便民信息站</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="logo">🏡</div>
        <div class="brand-text">
          <h1>幸福社区便民信息站</h1>
          <p class="subtitle">身边的生活 / 医疗 / 政务 · 一键触达</p>
        </div>
      </div>
      <nav class="tab-nav" id="tabNav">
        <button class="tab-btn active" data-tab="services">便民点位</button>
        <button class="tab-btn" data-tab="announce">社区公告</button>
        <button class="tab-btn" data-tab="ai">智能问答</button>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <!-- 1. 便民信息点位 -->
    <section class="tab-panel active" id="panel-services">
      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="搜索点位名称 / 地址 / 电话，如：快递、药店、开锁..."
          autocomplete="off"
        />
        <button id="clearBtn" class="clear-btn" style="display:none">清空</button>
      </div>

      <div class="category-tabs" id="categoryTabs">
        <!-- JS 动态渲染 -->
      </div>

      <div class="result-meta" id="resultMeta">共 0 个点位</div>

      <div class="poi-list" id="poiList">
        <!-- JS 动态渲染 -->
      </div>
    </section>

    <!-- 2. 社区公告栏 -->
    <section class="tab-panel" id="panel-announce">
      <div class="announce-tools">
        <h2 class="section-title">📢 社区公告</h2>
        <div class="sort-ctrl">
          <label for="sortSelect">排序：</label>
          <select id="sortSelect">
            <option value="desc">最新发布</option>
            <option value="asc">最早发布</option>
          </select>
        </div>
      </div>
      <div class="announce-list" id="announceList">
        <!-- JS 动态渲染 -->
      </div>
    </section>

    <!-- 3. AI 智能问答 -->
    <section class="tab-panel" id="panel-ai">
      <div class="ai-header">
        <h2 class="section-title">🤖 AI 便民小助手</h2>
        <p class="ai-desc">
          有问题直接问我，例如：「附近哪里有 24 小时药店」「周末能办户籍吗」「最近的菜市场在哪」，我会为您查找相关点位与公告。
        </p>
      </div>

      <div class="chat-box" id="chatBox">
        <div class="chat-msg bot">
          <div class="avatar">🤖</div>
          <div class="bubble">
            您好呀！我是社区 AI 便民小助手，您可以问我周边生活、医疗、政务点位的问题，我会帮您快速查找～
          </div>
        </div>
      </div>

      <div class="quick-questions" id="quickQuestions">
        <button class="q-btn" data-q="附近哪里有快递驿站？">快递驿站在哪？</button>
        <button class="q-btn" data-q="我要找能刷医保的药店">可刷医保的药店</button>
        <button class="q-btn" data-q="紧急开锁换锁">急！开锁电话</button>
        <button class="q-btn" data-q="社区居委会在哪？">居委会在哪</button>
        <button class="q-btn" data-q="电动车充电桩">找充电桩</button>
        <button class="q-btn" data-q="最近的菜市场">菜市场在哪</button>
      </div>

      <form class="chat-input" id="chatForm">
        <input
          type="text"
          id="chatInput"
          placeholder="请输入您的问题，例如：附近哪里有牙科诊所？"
          autocomplete="off"
        />
        <button type="submit">发送</button>
      </form>
    </section>
  </main>

  <!-- 点位详情浮层 -->
  <div class="modal" id="poiModal" aria-hidden="true">
    <div class="modal-mask" data-close></div>
    <div class="modal-panel">
      <button class="modal-close" data-close aria-label="关闭">✕</button>
      <div class="modal-body" id="poiDetail">
        <!-- JS 动态渲染 -->
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <p>© 幸福社区便民信息站 · Demo 版本 · 数据仅供演示</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
