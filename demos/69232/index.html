<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChefEye - 厨房AI烹饪助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #ff6b35;
            --secondary-color: #2ec4b6;
            --warm-orange: #f7931e;
            --dark-bg: #1a1a1a;
            --dark-card: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --success: #4ade80;
            --warning: #fbbf24;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 36px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(90deg, var(--primary-color), var(--warm-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .hero-section {
            text-align: center;
            margin-bottom: 60px;
            padding: 60px 20px;
            background: radial-gradient(circle at center, rgba(255, 107, 53, 0.15) 0%, transparent 70%);
            border-radius: 30px;
        }

        .hero-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .scan-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .scan-box {
            width: 320px;
            height: 320px;
            border: 3px dashed var(--primary-color);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .scan-box:hover {
            border-color: var(--warm-orange);
            transform: scale(1.02);
            background: rgba(255, 107, 53, 0.1);
        }

        .scan-box.active {
            border-color: var(--success);
            border-style: solid;
        }

        .scan-icon {
            font-size: 64px;
            margin-bottom: 15px;
        }

        .scan-text {
            font-size: 16px;
            color: var(--text-secondary);
        }

        .scan-progress {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
            animation: scan 2s linear infinite;
            opacity: 0;
        }

        .scan-box.scanning .scan-progress {
            opacity: 1;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(320px); }
        }

        .camera-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .scan-box.scanning .camera-preview {
            display: block;
        }

        .scan-box.scanning .scan-icon,
        .scan-box.scanning .scan-text {
            display: none;
        }

        .action-buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--primary-color), var(--warm-orange));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid var(--secondary-color);
            color: var(--secondary-color);
        }

        .btn-secondary:hover {
            background: var(--secondary-color);
            color: white;
        }

        .btn-large {
            padding: 20px 60px;
            font-size: 20px;
        }

        .ingredients-section {
            margin-bottom: 60px;
        }

        .section-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
        }

        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
        }

        .ingredient-item {
            background: var(--dark-card);
            border-radius: 15px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .ingredient-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .ingredient-item.selected {
            border-color: var(--primary-color);
            background: rgba(255, 107, 53, 0.15);
        }

        .ingredient-emoji {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .ingredient-name {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .selected-ingredients {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .selected-tag {
            background: linear-gradient(90deg, var(--primary-color), var(--warm-orange));
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .remove-tag {
            cursor: pointer;
            font-size: 16px;
        }

        .recipes-section {
            display: none;
        }

        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .recipe-card {
            background: var(--dark-card);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .recipe-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .recipe-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--primary-color), var(--warm-orange));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
        }

        .recipe-info {
            padding: 20px;
        }

        .recipe-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .recipe-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .recipe-ingredients {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }

        .recipe-ingredient-tag {
            background: rgba(46, 196, 182, 0.2);
            color: var(--secondary-color);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
        }

        .cooking-mode {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--dark-bg);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .cooking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-btn {
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: var(--primary-color);
        }

        .cooking-progress {
            flex: 1;
            margin: 0 20px;
        }

        .progress-bar {
            height: 8px;
            background: var(--dark-card);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            margin-top: 5px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .timer {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
            font-family: monospace;
        }

        .cooking-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .cooking-recipe-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .cooking-recipe-name {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .cooking-recipe-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--warm-orange));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            margin-bottom: 20px;
        }

        .step-container {
            background: var(--dark-card);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            min-height: 400px;
        }

        .step-number {
            display: inline-block;
            background: linear-gradient(90deg, var(--primary-color), var(--warm-orange));
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .step-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .step-description {
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .step-image {
            width: 100%;
            height: 250px;
            border-radius: 15px;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.3), rgba(46, 196, 182, 0.3));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            margin-bottom: 20px;
        }

        .step-tips {
            background: rgba(251, 191, 36, 0.15);
            border-left: 4px solid var(--warning);
            padding: 15px 20px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 20px;
        }

        .step-tips-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--warning);
        }

        .step-tips-content {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .step-controls {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .control-btn {
            flex: 1;
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-prev {
            background: var(--dark-card);
            color: var(--text-secondary);
            border: 2px solid var(--text-secondary);
        }

        .btn-prev:hover:not(:disabled) {
            background: var(--text-secondary);
            color: white;
        }

        .btn-next {
            background: linear-gradient(90deg, var(--primary-color), var(--warm-orange));
            color: white;
        }

        .btn-next:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }

        .btn-finish {
            background: linear-gradient(90deg, var(--success), var(--secondary-color));
            color: white;
        }

        .finish-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .finish-modal.show {
            display: flex;
        }

        .finish-content {
            background: var(--dark-card);
            border-radius: 30px;
            padding: 60px;
            text-align: center;
            max-width: 500px;
            animation: zoomIn 0.3s;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .finish-emoji {
            font-size: 100px;
            margin-bottom: 20px;
        }

        .finish-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .finish-text {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 32px;
            }

            .scan-box {
                width: 280px;
                height: 280px;
            }

            .ingredients-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }

            .recipes-grid {
                grid-template-columns: 1fr;
            }

            .step-container {
                padding: 20px;
            }

            .cooking-recipe-image {
                height: 200px;
            }

            .step-image {
                height: 150px;
            }

            .step-controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-icon">👁️🍳</span>
                <span class="logo-text">ChefEye</span>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="#home">首页</a></li>
                    <li><a href="#recipes">菜谱推荐</a></li>
                    <li><a href="#about">关于我们</a></li>
                </ul>
            </nav>
        </header>

        <section id="home" class="hero-section">
            <h1 class="hero-title">让做饭变得像导航一样简单</h1>
            <p class="hero-subtitle">拍摄或上传食材照片，AI为你智能推荐菜谱，Step-by-step引导完成烹饪</p>
            
            <div class="scan-container">
                <div class="scan-box" id="scanBox">
                    <div class="scan-progress"></div>
                    <video class="camera-preview" id="cameraPreview" autoplay playsinline></video>
                    <span class="scan-icon">📷</span>
                    <span class="scan-text">点击扫描食材</span>
                </div>
                
                <input type="file" id="fileInput" accept="image/*" class="hidden">
                
                <div class="action-buttons">
                    <button class="btn btn-primary" id="cameraBtn">
                        <span>📱</span> 使用摄像头
                    </button>
                    <button class="btn btn-secondary" id="uploadBtn">
                        <span>📁</span> 上传照片
                    </button>
                    <button class="btn btn-primary" id="manualBtn">
                        <span>✋</span> 手动选择食材
                    </button>
                </div>
            </div>
        </section>

        <section id="ingredients" class="ingredients-section hidden">
            <h2 class="section-title">选择你手边的食材</h2>
            
            <div class="selected-ingredients" id="selectedIngredients">
                <span style="color: var(--text-secondary);">还没有选择食材...</span>
            </div>
            
            <div class="ingredients-grid" id="ingredientsGrid"></div>
            
            <div class="action-buttons" style="margin-top: 40px;">
                <button class="btn btn-primary btn-large" id="matchRecipesBtn">
                    <span>✨</span> 智能推荐菜谱
                </button>
            </div>
        </section>

        <section id="recipes" class="recipes-section">
            <h2 class="section-title">为你推荐的菜谱</h2>
            <div class="recipes-grid" id="recipesGrid"></div>
            
            <div class="action-buttons" style="margin-top: 40px;">
                <button class="btn btn-secondary" id="backToIngredientsBtn">
                    <span>←</span> 返回选择食材
                </button>
            </div>
        </section>
    </div>

    <div class="cooking-mode" id="cookingMode">
        <div class="cooking-header">
            <span class="back-btn" id="cookingBackBtn">←</span>
            <div class="cooking-progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">步骤 1/10</div>
            </div>
            <div class="timer" id="cookingTimer">00:00</div>
        </div>
        
        <div class="cooking-content">
            <div class="cooking-recipe-header">
                <div class="cooking-recipe-image" id="cookingRecipeImage">🍳</div>
                <h2 class="cooking-recipe-name" id="cookingRecipeName">菜谱名称</h2>
            </div>
            
            <div class="step-container">
                <div class="step-number" id="stepNumber">1</div>
                <h3 class="step-title" id="stepTitle">步骤标题</h3>
                <div class="step-image" id="stepImage">📝</div>
                <p class="step-description" id="stepDescription">步骤描述...</p>
                <div class="step-tips" id="stepTips">
                    <div class="step-tips-title">💡 小贴士</div>
                    <div class="step-tips-content" id="stepTipsContent">烹饪小贴士...</div>
                </div>
            </div>
            
            <div class="step-controls">
                <button class="control-btn btn-prev" id="prevStepBtn">上一步</button>
                <button class="control-btn" id="voiceBtn" onclick="toggleVoiceControl()" style="background: var(--dark-card); color: var(--text-secondary); border: 2px solid var(--text-secondary);">🎤 语音控制</button>
                <button class="control-btn btn-next" id="nextStepBtn">下一步</button>
            </div>
        </div>
    </div>

    <div class="finish-modal" id="finishModal">
        <div class="finish-content">
            <div class="finish-emoji">🎉</div>
            <h2 class="finish-title">恭喜完成！</h2>
            <p class="finish-text" id="finishText">你成功完成了一道美味的菜肴！</p>
            <button class="btn btn-primary btn-large" id="finishBackBtn">返回首页</button>
        </div>
    </div>

            },
            {
                id: 'carrot-chicken',
                name: '胡萝卜炒鸡肉',
                emoji: '🥕🍗',
                difficulty: '简单',
                cookTime: '18分钟',
                calories: '280',
                ingredients: ['chicken', 'carrot', 'garlic', 'salt', 'oil'],
                steps: [
                    {
                        title: '准备食材',
                        description: '鸡肉切块，胡萝卜去皮切片，大蒜切片。',
                        emoji: '🥣',
                        tips: '鸡肉选择鸡腿肉或鸡胸肉都可以。'
                    },
                    {
                        title: '腌制鸡肉',
                        description: '鸡肉加入料酒、盐、淀粉腌制10分钟。',
                        emoji: '🧂',
                        tips: '腌制可以让鸡肉更嫩滑。'
                    },
                    {
                        title: '炒鸡肉',
                        description: '热锅凉油，放入鸡肉翻炒至变色，盛出备用。',
                        emoji: '🍗',
                        tips: '鸡肉变色即可捞出，以免炒老。'
                    },
                    {
                        title: '炒胡萝卜',
                        description: '锅中留少许油，放入蒜片爆香，加入胡萝卜片翻炒。',
                        emoji: '🥕',
                        tips: '胡萝卜可以多炒一会儿，更容易入味。'
                    },
                    {
                        title: '混合调味',
                        description: '加入炒好的鸡肉，翻炒均匀，加入适量盐调味。',
                        emoji: '🥘',
                        tips: '可以加少许生抽提鲜。'
                    },
                    {
                        title: '出锅',
                        description: '翻炒均匀后即可出锅，一道营养美味的菜肴就完成了！',
                        emoji: '✅',
                        tips: '胡萝卜富含胡萝卜素，营养丰富。'
                    }
                ]
            }
        ];

        let selectedIngredients = [];
        let currentRecipe = null;
        let currentStepIndex = 0;
        let timerInterval = null;
        let cookingStartTime = 0;

        function initIngredientsGrid() {
            const grid = document.getElementById('ingredientsGrid');
            grid.innerHTML = ingredients.map(ing => `
                <div class="ingredient-item" data-id="${ing.id}" onclick="toggleIngredient('${ing.id}')">
                    <div class="ingredient-emoji">${ing.emoji}</div>
                    <div class="ingredient-name">${ing.name}</div>
                </div>
            `).join('');
        }

        function toggleIngredient(id) {
            const index = selectedIngredients.indexOf(id);
            const item = document.querySelector(`.ingredient-item[data-id="${id}"]`);
            
            if (index === -1) {
                selectedIngredients.push(id);
                item.classList.add('selected');
            } else {
                selectedIngredients.splice(index, 1);
                item.classList.remove('selected');
            }
            updateSelectedIngredients();
        }

        function updateSelectedIngredients() {
            const container = document.getElementById('selectedIngredients');
            
            if (selectedIngredients.length === 0) {
                container.innerHTML = '<span style="color: var(--text-secondary);">还没有选择食材...</span>';
                return;
            }
            
            container.innerHTML = selectedIngredients.map(id => {
                const ing = ingredients.find(i => i.id === id);
                return `
                    <div class="selected-tag">
                        ${ing.emoji} ${ing.name}
                        <span class="remove-tag" onclick="toggleIngredient('${id}')">×</span>
                    </div>
                `;
            }).join('');
        }

        function matchRecipes() {
            if (selectedIngredients.length === 0) {
                alert('请先选择至少一种食材！');
                return;
            }
            
            const matched = recipes.map(recipe => {
                const matchedCount = recipe.ingredients.filter(ing => 
                    selectedIngredients.includes(ing)
                ).length;
                const totalRequired = recipe.ingredients.length;
                const matchPercentage = (matchedCount / totalRequired) * 100;
                
                return {
                    ...recipe,
                    matchPercentage,
                    matchedCount,
                    missingCount: totalRequired - matchedCount
                };
            }).filter(r => r.matchPercentage > 0)
            .sort((a, b) => b.matchPercentage - a.matchPercentage);
            
            renderRecipes(matched);
            document.getElementById('ingredients').classList.add('hidden');
            document.getElementById('recipes').classList.remove('hidden');
        }

        function renderRecipes(recipeList) {
            const grid = document.getElementById('recipesGrid');
            
            if (recipeList.length === 0) {
                grid.innerHTML = `
                    <div style="text-align: center; padding: 60px; grid-column: 1/-1;">
                        <div style="font-size: 64px; margin-bottom: 20px;">😕</div>
                        <p style="font-size: 20px;">没有找到匹配的菜谱</p>
                        <p style="color: var(--text-secondary); margin-top: 10px;">试试选择不同的食材组合</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = recipeList.map(recipe => {
                const ingNames = recipe.ingredients.map(id => {
                    const ing = ingredients.find(i => i.id === id);
                    return ing ? ing.name : id;
                });
                
                return `
                    <div class="recipe-card" onclick="startCooking('${recipe.id}')">
                        <div class="recipe-image">${recipe.emoji}</div>
                        <div class="recipe-info">
                            <h3 class="recipe-name">${recipe.name}</h3>
                            <div class="recipe-meta">
                                <span class="meta-item">⭐ ${recipe.difficulty}</span>
                                <span class="meta-item">⏱️ ${recipe.cookTime}</span>
                                <span class="meta-item">🔥 ${recipe.calories}卡</span>
                            </div>
                            <div class="recipe-ingredients">
                                ${ingNames.map(name => 
                                    `<span class="recipe-ingredient-tag">${name}</span>`
                                ).join('')}
                            </div>
                            <div style="margin-top: 10px; font-size: 14px; color: var(--secondary-color);">
                                匹配度: ${Math.round(recipe.matchPercentage)}%
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function startCooking(recipeId) {
            currentRecipe = recipes.find(r => r.id === recipeId);
            currentStepIndex = 0;
            
            document.getElementById('recipes').classList.add('hidden');
            document.getElementById('cookingMode').classList.remove('hidden');
            
            resetTimer();
            updateCookingUI();
        }

        function updateCookingUI() {
            if (!currentRecipe) return;
            
            const step = currentRecipe.steps[currentStepIndex];
            const totalSteps = currentRecipe.steps.length;
            
            document.getElementById('cookingRecipeName').textContent = currentRecipe.name;
            document.getElementById('cookingRecipeImage').textContent = currentRecipe.emoji;
            
            document.getElementById('stepNumber').textContent = currentStepIndex + 1;
            document.getElementById('stepTitle').textContent = step.title;
            document.getElementById('stepImage').textContent = step.emoji;
            document.getElementById('stepDescription').textContent = step.description;
            document.getElementById('stepTipsContent').textContent = step.tips;
            
            const progress = ((currentStepIndex + 1) / totalSteps) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `步骤 ${currentStepIndex + 1}/${totalSteps}`;
            
            document.getElementById('prevStepBtn').disabled = currentStepIndex === 0;
            
            const nextBtn = document.getElementById('nextStepBtn');
            if (currentStepIndex === totalSteps - 1) {
                nextBtn.textContent = '完成烹饪';
                nextBtn.classList.add('btn-finish');
                nextBtn.classList.remove('btn-next');
            } else {
                nextBtn.textContent = '下一步';
                nextBtn.classList.remove('btn-finish');
                nextBtn.classList.add('btn-next');
            }
            
            if (currentStepIndex === 0) {
                startTimer();
            }
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                currentStepIndex--;
                updateCookingUI();
            }
        }

        function nextStep() {
            if (currentStepIndex < currentRecipe.steps.length - 1) {
                currentStepIndex++;
                updateCookingUI();
            } else {
                finishCooking();
            }
        }

        function finishCooking() {
            stopTimer();
            const timer = document.getElementById('cookingTimer').textContent;
            document.getElementById('finishText').textContent = `你用时 ${timer} 成功完成了「${currentRecipe.name}」！`;
            document.getElementById('finishModal').classList.add('show');
        }

        function resetTimer() {
            stopTimer();
            cookingStartTime = Date.now();
            document.getElementById('cookingTimer').textContent = '00:00';
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - cookingStartTime) / 1000);
                const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                document.getElementById('cookingTimer').textContent = `${minutes}:${seconds}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        let recognition = null;
        let isVoiceEnabled = false;

        function initVoiceControl() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'zh-CN';
                recognition.continuous = true;
                recognition.interimResults = false;

                recognition.onresult = function(event) {
                    const transcript = event.results[event.results.length - 1][0].transcript.trim();
                    handleVoiceCommand(transcript);
                };

                recognition.onerror = function(event) {
                    console.error('语音识别错误:', event.error);
                };
            }
        }

        function handleVoiceCommand(command) {
            if (!isVoiceEnabled || !currentRecipe) return;

            if (command.includes('下一步') || command.includes('下一个') || command.includes('继续')) {
                nextStep();
            } else if (command.includes('上一步') || command.includes('上一个') || command.includes('返回')) {
                prevStep();
            } else if (command.includes('完成') || command.includes('结束')) {
                finishCooking();
            }
        }

        function toggleVoiceControl() {
            if (!recognition) {
                alert('您的浏览器不支持语音识别功能');
                return;
            }

            isVoiceEnabled = !isVoiceEnabled;
            const voiceBtn = document.getElementById('voiceBtn');

            if (isVoiceEnabled) {
                recognition.start();
                voiceBtn.textContent = '🔇 关闭语音';
                voiceBtn.style.background = 'var(--success)';
            } else {
                recognition.stop();
                voiceBtn.textContent = '🎤 语音控制';
                voiceBtn.style.background = '';
            }
        }

        function simulateScan() {
            const scanBox = document.getElementById('scanBox');
            scanBox.classList.add('scanning');
            
            setTimeout(() => {
                scanBox.classList.remove('scanning');
                scanBox.classList.add('active');
                
                setTimeout(() => {
                    scanBox.classList.remove('active');
                    const randomIngredients = [...ingredients].sort(() => 0.5 - Math.random()).slice(0, 4);
                    selectedIngredients = randomIngredients.map(i => i.id);
                    
                    initIngredientsGrid();
                    selectedIngredients.forEach(id => {
                        const item = document.querySelector(`.ingredient-item[data-id="${id}"]`);
                        if (item) item.classList.add('selected');
                    });
                    updateSelectedIngredients();
                    
                    document.getElementById('home').classList.add('hidden');
                    document.getElementById('ingredients').classList.remove('hidden');
                }, 500);
            }, 2500);
        }

        function setupCamera() {
            const video = document.getElementById('cameraPreview');
            const scanBox = document.getElementById('scanBox');
            
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => {
                        video.srcObject = stream;
                        scanBox.classList.add('scanning');
                        
                        setTimeout(() => {
                            stream.getTracks().forEach(track => track.stop());
                            video.srcObject = null;
                            scanBox.classList.remove('scanning');
                            simulateScan();
                        }, 3000);
                    })
                    .catch(err => {
                        console.error('无法访问摄像头:', err);
                        alert('无法访问摄像头，请尝试上传照片或手动选择食材');
                    });
            } else {
                alert('您的浏览器不支持摄像头功能');
                simulateScan();
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const scanBox = document.getElementById('scanBox');
            scanBox.classList.add('scanning');
            
            setTimeout(() => {
                scanBox.classList.remove('scanning');
                simulateScan();
            }, 2500);
        }

        document.getElementById('cameraBtn').addEventListener('click', setupCamera);
        document.getElementById('uploadBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });
        document.getElementById('fileInput').addEventListener('change', handleFileUpload);
        document.getElementById('manualBtn').addEventListener('click', () => {
            document.getElementById('home').classList.add('hidden');
            document.getElementById('ingredients').classList.remove('hidden');
        });
        document.getElementById('matchRecipesBtn').addEventListener('click', matchRecipes);
        document.getElementById('backToIngredientsBtn').addEventListener('click', () => {
            document.getElementById('recipes').classList.add('hidden');
            document.getElementById('ingredients').classList.remove('hidden');
        });
        document.getElementById('cookingBackBtn').addEventListener('click', () => {
            stopTimer();
            document.getElementById('cookingMode').classList.add('hidden');
            document.getElementById('recipes').classList.remove('hidden');
        });
        document.getElementById('prevStepBtn').addEventListener('click', prevStep);
        document.getElementById('nextStepBtn').addEventListener('click', nextStep);
        document.getElementById('finishBackBtn').addEventListener('click', () => {
            document.getElementById('finishModal').classList.remove('show');
            document.getElementById('cookingMode').classList.add('hidden');
            document.getElementById('home').classList.remove('hidden');
            selectedIngredients = [];
            currentRecipe = null;
            currentStepIndex = 0;
        });

        document.getElementById('scanBox').addEventListener('click', () => {
            document.getElementById('cameraBtn').click();
        });

        initIngredientsGrid();
        initVoiceControl();
    </script>
</body>
</html>
