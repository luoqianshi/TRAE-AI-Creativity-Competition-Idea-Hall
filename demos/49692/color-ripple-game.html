<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>色彩涟漪 | Color Ripple</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .ui-top {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            text-align: center;
        }

        .game-title {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGlow 4s ease infinite;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        @keyframes titleGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .level-info {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            letter-spacing: 2px;
        }

        .ui-left {
            position: absolute;
            top: 100px;
            left: 30px;
            z-index: 100;
        }

        .color-palette {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .palette-title {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-align: center;
        }

        .color-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .color-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .color-btn:hover {
            transform: scale(1.15);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
        }

        .color-btn.active {
            border-color: #fff;
            transform: scale(1.2);
            box-shadow: 0 0 25px currentColor;
        }

        .color-btn.red { background: #ff6b6b; color: #ff6b6b; }
        .color-btn.yellow { background: #feca57; color: #feca57; }
        .color-btn.blue { background: #48dbfb; color: #48dbfb; }

        .ui-right {
            position: absolute;
            top: 100px;
            right: 30px;
            z-index: 100;
        }

        .target-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .target-title {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .target-color {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px currentColor;
        }

        .target-name {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .target-desc {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        .ui-bottom {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-display {
            color: #feca57;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .ripple-count {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .reset-btn {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.4);
            color: #ff6b6b;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            background: rgba(255, 107, 107, 0.3);
            transform: translateY(-2px);
        }

        .hint-text {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            letter-spacing: 1px;
            text-align: center;
            z-index: 100;
        }

        .success-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            backdrop-filter: blur(5px);
        }

        .success-overlay.show {
            display: flex;
        }

        .success-modal {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px 60px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-title {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }

        .success-info {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            margin-bottom: 10px;
        }

        .success-score {
            color: #feca57;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .next-btn {
            background: linear-gradient(135deg, #48dbfb, #ff9ff3);
            border: none;
            color: #fff;
            padding: 12px 40px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            letter-spacing: 2px;
        }

        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(72, 219, 251, 0.4);
        }

        @media (max-width: 768px) {
            .game-title {
                font-size: 24px;
            }
            
            .ui-left {
                left: 15px;
                top: 80px;
            }
            
            .ui-right {
                right: 15px;
                top: 80px;
            }
            
            .color-btn {
                width: 40px;
                height: 40px;
            }
            
            .target-color {
                width: 60px;
                height: 60px;
            }
            
            .ui-bottom {
                gap: 15px;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-top">
            <h1 class="game-title">色彩涟漪</h1>
            <div class="level-info">第 <span id="levelNum">1</span> 关</div>
        </div>

        <div class="ui-left">
            <div class="color-palette">
                <div class="palette-title">调色板</div>
                <div class="color-buttons">
                    <div class="color-btn red active" data-color="red" onclick="selectColor('red')"></div>
                    <div class="color-btn yellow" data-color="yellow" onclick="selectColor('yellow')"></div>
                    <div class="color-btn blue" data-color="blue" onclick="selectColor('blue')"></div>
                </div>
            </div>
        </div>

        <div class="ui-right">
            <div class="target-panel">
                <div class="target-title">目标颜色</div>
                <div class="target-color" id="targetColor"></div>
                <div class="target-name" id="targetName">橙色</div>
                <div class="target-desc" id="targetDesc">红 + 黄</div>
            </div>
        </div>

        <div class="hint-text">
            选择颜色，点击画布产生涟漪，混合出目标色彩！
        </div>

        <div class="ui-bottom">
            <div class="score-display">得分: <span id="scoreValue">0</span></div>
            <div class="ripple-count">涟漪: <span id="rippleCount">0</span>/10</div>
            <button class="reset-btn" onclick="resetLevel()">重置</button>
        </div>

        <div class="success-overlay" id="successOverlay">
            <div class="success-modal">
                <div class="success-title">色彩匹配成功！</div>
                <div class="success-info">使用了 <span id="usedRipples">0</span> 个涟漪</div>
                <div class="success-score">+<span id="levelScore">0</span> 分</div>
                <button class="next-btn" onclick="nextLevel()">下一关</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let score = 0;
        let level = 1;
        let ripples = [];
        let currentColor = 'red';
        let rippleCount = 0;
        const maxRipples = 10;

        const colorMap = {
            red: { r: 255, g: 107, b: 107, name: '红色' },
            yellow: { r: 254, g: 202, b: 87, name: '黄色' },
            blue: { r: 72, g: 219, b: 251, name: '蓝色' }
        };

        const levels = [
            { target: 'orange', name: '橙色', desc: '红 + 黄', mix: ['red', 'yellow'] },
            { target: 'green', name: '绿色', desc: '黄 + 蓝', mix: ['yellow', 'blue'] },
            { target: 'purple', name: '紫色', desc: '红 + 蓝', mix: ['red', 'blue'] },
            { target: 'coral', name: '珊瑚粉', desc: '红 + 黄 + 少量蓝', mix: ['red', 'yellow', 'blue'] },
            { target: 'teal', name: '青绿色', desc: '蓝 + 黄 + 少量红', mix: ['blue', 'yellow', 'red'] },
            { target: 'amber', name: '琥珀色', desc: '黄 + 红 + 少量蓝', mix: ['yellow', 'red', 'blue'] },
            { target: 'mint', name: '薄荷绿', desc: '蓝 + 黄 + 少量红', mix: ['blue', 'yellow', 'red'] },
            { target: 'rose', name: '玫瑰红', desc: '红 + 蓝 + 少量黄', mix: ['red', 'blue', 'yellow'] },
            { target: 'sky', name: '天蓝色', desc: '蓝 + 少量红 + 少量黄', mix: ['blue', 'red', 'yellow'] },
            { target: 'gold', name: '金黄色', desc: '黄 + 红 + 少量蓝', mix: ['yellow', 'red', 'blue'] }
        ];

        let currentLevel = 0;
        let targetColor = null;
        let centerX = 0;
        let centerY = 0;

        class Ripple {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = 0;
                this.maxRadius = 200 + Math.random() * 100;
                this.speed = 2 + Math.random() * 1;
                this.opacity = 0.6;
                this.lineWidth = 40;
                this.expanding = true;
            }

            update() {
                if (this.expanding) {
                    this.radius += this.speed;
                    if (this.radius >= this.maxRadius) {
                        this.expanding = false;
                    }
                }
                this.opacity = Math.max(0, 0.6 - (this.radius / this.maxRadius) * 0.4);
                return this.opacity > 0;
            }

            draw() {
                const c = colorMap[this.color];
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.strokeStyle = `rgba(${c.r}, ${c.g}, ${c.b}, 0.8)`;
                ctx.lineWidth = this.lineWidth;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.globalAlpha = this.opacity * 0.3;
                ctx.fillStyle = `rgba(${c.r}, ${c.g}, ${c.b}, 0.1)`;
                ctx.fill();
                ctx.restore();
            }
        }

        function selectColor(color) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.color-btn.${color}`).classList.add('active');
        }

        function initLevel() {
            ripples = [];
            rippleCount = 0;
            
            currentLevel = (level - 1) % levels.length;
            const levelData = levels[currentLevel];
            
            let targetRgb = mixColors(levelData.mix);
            targetColor = targetRgb;
            
            document.getElementById('targetColor').style.background = `rgb(${targetRgb.r}, ${targetRgb.g}, ${targetRgb.b})`;
            document.getElementById('targetColor').style.color = `rgb(${targetRgb.r}, ${targetRgb.g}, ${targetRgb.b})`;
            document.getElementById('targetName').textContent = levelData.name;
            document.getElementById('targetDesc').textContent = levelData.desc;
            document.getElementById('levelNum').textContent = level;
            document.getElementById('rippleCount').textContent = rippleCount;
            
            centerX = width / 2;
            centerY = height / 2;
        }

        function mixColors(colors) {
            let r = 0, g = 0, b = 0;
            colors.forEach((c, i) => {
                const weight = i === 0 ? 0.5 : i === 1 ? 0.4 : 0.1;
                const color = colorMap[c];
                r += color.r * weight;
                g += color.g * weight;
                b += color.b * weight;
            });
            return { r: Math.round(r), g: Math.round(g), b: Math.round(b) };
        }

        function getMixedColorAtCenter() {
            let totalWeight = 0;
            let r = 0, g = 0, b = 0;
            
            ripples.forEach(ripple => {
                const dist = Math.sqrt((ripple.x - centerX) ** 2 + (ripple.y - centerY) ** 2);
                const ringWidth = ripple.lineWidth;
                
                if (Math.abs(dist - ripple.radius) < ringWidth / 2) {
                    const overlap = 1 - Math.abs(dist - ripple.radius) / (ringWidth / 2);
                    const c = colorMap[ripple.color];
                    const weight = overlap * ripple.opacity;
                    r += c.r * weight;
                    g += c.g * weight;
                    b += c.b * weight;
                    totalWeight += weight;
                }
            });
            
            if (totalWeight > 0) {
                r = Math.round(r / totalWeight);
                g = Math.round(g / totalWeight);
                b = Math.round(b / totalWeight);
            }
            
            return { r, g, b, totalWeight };
        }

        function checkColorMatch() {
            const mixed = getMixedColorAtCenter();
            if (mixed.totalWeight < 0.3) return false;
            
            const diff = Math.abs(mixed.r - targetColor.r) +
                         Math.abs(mixed.g - targetColor.g) +
                         Math.abs(mixed.b - targetColor.b);
            
            return diff < 50;
        }

        function animate() {
            ctx.fillStyle = 'rgba(26, 26, 46, 0.15)';
            ctx.fillRect(0, 0, width, height);
            
            ripples = ripples.filter(ripple => ripple.update());
            ripples.forEach(ripple => ripple.draw());
            
            drawCenterIndicator();
            
            if (rippleCount > 0 && checkColorMatch()) {
                showSuccess();
                return;
            }
            
            requestAnimationFrame(animate);
        }

        function drawCenterIndicator() {
            const mixed = getMixedColorAtCenter();
            
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.restore();
            
            if (mixed.totalWeight > 0.1) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${mixed.r}, ${mixed.g}, ${mixed.b}, 0.6)`;
                ctx.fill();
                ctx.restore();
            }
        }

        function showSuccess() {
            const levelScore = Math.max(10, (maxRipples - rippleCount + 1) * 10 * level);
            score += levelScore;
            
            document.getElementById('scoreValue').textContent = score;
            document.getElementById('usedRipples').textContent = rippleCount;
            document.getElementById('levelScore').textContent = levelScore;
            document.getElementById('successOverlay').classList.add('show');
        }

        function nextLevel() {
            document.getElementById('successOverlay').classList.remove('show');
            level++;
            initLevel();
            animate();
        }

        function resetLevel() {
            initLevel();
        }

        canvas.addEventListener('click', (e) => {
            if (rippleCount >= maxRipples) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            ripples.push(new Ripple(x, y, currentColor));
            rippleCount++;
            document.getElementById('rippleCount').textContent = rippleCount;
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (rippleCount >= maxRipples) return;
            
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            ripples.push(new Ripple(x, y, currentColor));
            rippleCount++;
            document.getElementById('rippleCount').textContent = rippleCount;
        });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        });

        initLevel();
        animate();
    </script>
</body>
</html>
