.home-bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,0.3) 0%,rgba(0,0,0,0.05) 15%,transparent 40%,transparent 50%,rgba(0,0,0,0.3) 70%,rgba(0,0,0,0.65) 100%);
}
.home-content{position:relative;z-index:2;height:100%;}

/* weather card */
.weather-card{
  position:absolute;top:64px;left:28px;
  display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,0.13);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:12px;
  padding:7px 11px 7px 9px;
}
.weather-card .sun-ico{width:26px;height:26px;flex-shrink:0;}
.weather-temp{font-size:18px;font-weight:700;color:#fff;line-height:1;}
.weather-info{display:flex;flex-direction:column;gap:1px;}
.weather-city{font-size:9px;color:rgba(255,255,255,0.6);}
.weather-text{font-size:10px;color:rgba(255,255,255,0.8);}

/* hero */
.hero{position:absolute;left:24px;right:24px;top:30vh;z-index:15;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;}
.hero-deco-sun{width:20px;height:20px;opacity:0.65;margin-bottom:4px;animation:sway 4s ease-in-out infinite;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.3));}
.hero-row1{font-size:32px;font-weight:800;color:#fff;line-height:1.15;letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,0.4);}
.hero-row2{display:flex;align-items:center;gap:6px;}
.hero-row2-text{font-size:32px;font-weight:800;color:#fff;line-height:1.15;letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,0.4);}
.hero-deco-bike{width:24px;height:18px;opacity:0.55;animation:slide 3s ease-in-out infinite;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.3));}
.hero-deco-flower{width:16px;height:16px;opacity:0.55;animation:sway 5s ease-in-out infinite 0.5s;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.3));}
@keyframes sway{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(5deg);}}
@keyframes slide{0%,100%{transform:translateX(0);}50%{transform:translateX(3px);}}
.hero:active .hero-row1,.hero:active .hero-row2-text{opacity:0.7;}

.hero-cta{
  margin-top:14px;display:inline-flex;align-items:center;gap:5px;
  padding:8px 18px;border-radius:999px;
  background:rgba(255,255,255,0.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.28);
  font-size:13px;color:#fff;font-weight:500;
  text-shadow:0 1px 4px rgba(0,0,0,0.3);
  cursor:pointer;
}
.hero-cta:active{background:rgba(255,255,255,0.28);transform:scale(0.97);}

/* timeline */
.timeline{position:absolute;left:30px;bottom:80px;right:30px;}
.tl-item{position:relative;padding-left:20px;padding-bottom:22px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{
  content:"";position:absolute;left:2px;top:5px;
  width:6px;height:6px;border-radius:50%;
  background:rgba(89,159,230,0.9);
  box-shadow:0 0 8px rgba(89,159,230,0.8);
}
.tl-item:not(:last-child)::after{
  content:"";position:absolute;left:4.5px;top:14px;bottom:0;width:0.5px;
  background:linear-gradient(to bottom,rgba(89,159,230,0.5),rgba(89,159,230,0.1));
}
.tl-code{font-size:10px;font-family:"SF Mono",Menlo,monospace;color:rgba(89,159,230,0.85);letter-spacing:.5px;margin-bottom:3px;}
.tl-text{font-size:12px;color:rgba(255,255,255,0.9);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* ===================== DISCOVER PAGE ===================== */
.page--discover{background:#FAFAFA;padding-top:50px;padding-bottom:90px;}
.page-head{padding:16px 16px 8px;}
.page-title{font-size:22px;font-weight:700;}
.section{margin-top:18px;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px;}
.section-title{font-size:19px;font-weight:700;display:flex;align-items:center;gap:6px;}
.help-btn{width:18px;height:18px;border-radius:50%;border:1px solid rgba(17,17,17,0.25);font-size:11px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;line-height:1;}

.h-scroll{display:flex;gap:16px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none;}
.h-scroll::-webkit-scrollbar{display:none;}
.dcard{width:120px;flex-shrink:0;position:relative;}
.dcard-cover{width:120px;height:120px;border-radius:12px;background-size:cover;background-position:center;background-color:#eee;overflow:hidden;position:relative;}
.dcat{position:absolute;top:6px;right:6px;font-size:10px;color:#fff;background:rgba(0,0,0,0.4);padding:1px 6px;border-radius:999px;backdrop-filter:blur(4px);}
.dcard-title{font-size:13px;line-height:1.35;margin-top:7px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.dcard-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.bm-btn{position:absolute;bottom:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.bm-btn svg{width:14px;height:14px;}
.bm-btn.on svg path{fill:#2563EB;stroke:#2563EB;}

/* vertical list cards */
.vlist{padding:0 16px;display:flex;flex-direction:column;gap:12px;}
.vcard{display:flex;gap:12px;background:#fff;border-radius:12px;padding:10px;box-shadow:var(--shadow-card);position:relative;}
.vcard-cover{width:80px;height:80px;border-radius:8px;background-size:cover;background-position:center;flex-shrink:0;}
.vcard-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
.vcard-title{font-size:14px;font-weight:600;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.vcard-meta{font-size:11px;color:var(--muted);margin-top:4px;}
.ending-tag{position:absolute;top:10px;right:10px;font-size:10px;color:#fff;background:#EF4444;padding:2px 7px;border-radius:999px;font-weight:500;}

/* ===================== FAVORITES PAGE ===================== */
.page--favorites{background:#FAFAFA;padding-top:50px;padding-bottom:90px;}
.seg{margin:14px 16px;height:36px;background:#fff;border-radius:18px;display:flex;padding:3px;box-shadow:var(--shadow-card);position:relative;}
.seg-item{flex:1;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);position:relative;z-index:2;transition:color .25s;font-weight:500;}
.seg-item.is-active{color:#fff;font-weight:600;}
.seg-slider{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:15px;background:linear-gradient(135deg,#3B82F6,#2563EB);box-shadow:0 2px 8px rgba(37,99,235,0.3);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:1;}
.seg.has-places .seg-slider{transform:translateX(100%);}

.fav-section{display:none;}
.fav-section.active{display:block;}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 12px;}
.list-head .title{font-size:19px;font-weight:700;}
.list-head .actions{display:flex;gap:10px;}
.list-head .actions button{width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;color:var(--primary);}

/* masonry grid */
.masonry{padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mcard{height:200px;border-radius:12px;background:#fff;box-shadow:var(--shadow-card);overflow:hidden;position:relative;display:flex;flex-direction:column;}
.mcard:nth-child(odd){margin-top:18px;}
.mcard-cover{height:140px;background-size:cover;background-position:center;}
.mcard-badge{position:absolute;top:8px;left:8px;background:rgba(255,255,255,0.92);font-size:10px;padding:2px 8px;border-radius:999px;color:var(--text);font-weight:500;}
.mcard-body{padding:7px 9px;flex:1;display:flex;flex-direction:column;justify-content:center;}
.mcard-title{font-size:13px;line-height:1.35;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.mcard-time{font-size:11px;color:var(--muted);margin-top:3px;}

/* places / map */
.map-box{margin:0 16px;height:160px;border-radius:12px;overflow:hidden;position:relative;
  background-color:#e8eef5;
  background-image:
    linear-gradient(rgba(37,99,235,0.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,0.06) 1px,transparent 1px),
    linear-gradient(135deg,#dbe7f3,#cdd9e8);
  background-size:24px 24px,24px 24px,100% 100%;
}
.map-box::before{content:"";position:absolute;left:30%;top:0;bottom:0;width:14px;background:linear-gradient(90deg,rgba(37,99,235,0.18),rgba(37,99,235,0.05));}

  {id:3,title:'油罐艺术中心',addr:'徐汇区龙腾大道2380号',dist:'1.2km',pin:{x:'22%',y:'72%'},cover:IMG.tank,acts:[3]},
  {id:4,title:'张园',addr:'静安区茂名北路',dist:'2.1km',pin:{x:'48%',y:'30%'},cover:IMG.zhangyuan,acts:[3]},
  {id:5,title:'上海当代艺术博物馆',addr:'黄浦区花园港路200号',dist:'3.9km',pin:{x:'72%',y:'65%'},cover:IMG.art4,acts:[5,8]},
  {id:6,title:'茑屋书店',addr:'长宁区延安西路1262号',dist:'4.2km',pin:{x:'38%',y:'50%'},cover:IMG.book,acts:[6]}
];

/* ===================== Helpers ===================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const bookmarked = new Set();
const hearted = new Set();

function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'),1800);
}
function pinSvg(){
  return '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z" fill="#2563EB"/><circle cx="12" cy="9" r="2.5" fill="#fff"/></svg>';
}
function heartSvg(on){
  return '<svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.5-9.5-9C1 9 2.5 5.5 6 5.5c2 0 3.2 1.2 4 2.3.8-1.1 2-2.3 4-2.3 3.5 0 5 3.5 3.5 6.5C19 16.5 12 21 12 21z" '+(on?'fill="#2563EB"':'fill="none"')+' stroke="#2563EB" stroke-width="1.8" stroke-linejoin="round"/></svg>';
}
function bmSvg(on){
  return '<svg viewBox="0 0 24 24" fill="none"><path d="M7 4h10v16l-5-3-5 3V4z" '+(on?'fill="#2563EB"':'fill="none"')+' stroke="#2563EB" stroke-width="1.8" stroke-linejoin="round"/></svg>';
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ===================== Page navigation ===================== */
const pages = ['home','discover','favorites','profile'];
function goTo(page){
  // journal placeholder (no real page yet)
  if(page==='journal'){ toast('手账功能开发中'); return; }
  const target = $('#page-'+page);
  if(!target) return;
  $$('.page').forEach(p=>p.classList.remove('active'));
  target.classList.add('active');
  target.scrollTop = 0;
  // status bar color
  const sb = $('#statusBar');
  if(page==='home'){ sb.classList.remove('dark'); sb.classList.add('light'); }
  else { sb.classList.remove('light'); sb.classList.add('dark'); }
  // tab bar visibility (hidden on home)
  const tb = $('#tabBar');
  if(page==='home'){ tb.classList.add('tab-bar--hide'); }
  else { tb.classList.remove('tab-bar--hide'); }
  // active tab state
  $$('.tab-item').forEach(t=>t.classList.toggle('is-active', t.dataset.page===page));
}

// tab bar clicks
$$('.tab-item, #centerBtn').forEach(el=>{
  el.addEventListener('click',()=>{
    const p = el.dataset.page; if(p) goTo(p);
  });
});
// hero CTA -> discover
$('#heroCta').addEventListener('click',()=>goTo('discover'));

/* ===================== Discover render ===================== */
function renderDiscover(){
  const scroll = $('#discoverScroll');
  // 4 cards for 为你精选
  [1,2,3,4].forEach(id=>{
    const a = activities.find(x=>x.id===id);
    const el = document.createElement('div');
    el.className='dcard';
    el.innerHTML = `
      <div class="dcard-cover" style="background-image:url('${a.cover}')">
        <span class="dcat">${a.cat}</span>
        <button class="bm-btn" data-id="${a.id}">${bmSvg(false)}</button>
      </div>
      <div class="dcard-title">${a.title}</div>
      <div class="dcard-meta">${a.place} · ${a.dist}</div>`;
    el.querySelector('.dcard-cover').addEventListener('click',()=>openActivitySheet(a.id));
    el.querySelector('.bm-btn').addEventListener('click',e=>{e.stopPropagation();toggleBm(e.currentTarget,a.id);});
    scroll.appendChild(el);
  });

  const vlist = $('#discoverVlist');
  // 2 ending cards
  [5,6].forEach(id=>{
    const a = activities.find(x=>x.id===id);
    const el = document.createElement('div');
    el.className='vcard';
    el.innerHTML = `
      <div class="vcard-cover" style="background-image:url('${a.cover}')"></div>
      <div class="vcard-body">
        <div class="vcard-title">${a.title}</div>
        <div class="vcard-meta">${a.time} · ${a.place}</div>
      </div>
      <span class="ending-tag">最后几天</span>`;
    el.addEventListener('click',()=>openActivitySheet(a.id));
    vlist.appendChild(el);
  });
}
function toggleBm(btn,id){
  if(bookmarked.has(id)){ bookmarked.delete(id); btn.classList.remove('on'); btn.innerHTML=bmSvg(false); toast('已取消收藏'); }
  else { bookmarked.add(id); btn.classList.add('on'); btn.innerHTML=bmSvg(true); toast('已加入收藏'); }
}

/* ===================== Favorites: masonry + places ===================== */
function renderMasonry(){
  const m = $('#masonry');
  m.innerHTML='';
  activities.forEach(a=>{
    const el = document.createElement('div');
    el.className='mcard';
    el.innerHTML = `
      <div class="mcard-cover" style="background-image:url('${a.cover}')">
        <span class="mcard-badge">我的</span>
      </div>
      <div class="mcard-body">
        <div class="mcard-title">${a.title}</div>
        <div class="mcard-time">${a.time}</div>
      </div>`;
    el.addEventListener('click',()=>openActivitySheet(a.id));
    m.appendChild(el);
  });
}
function renderPlaces(){
  const list = $('#placeList');
  list.innerHTML='';
  places.forEach(p=>{
    const el = document.createElement('div');
    el.className='place-item';
    el.innerHTML = `
      <div class="place-info">
        <div class="place-title">${p.title}</div>
        <div class="place-addr">${p.addr}</div>
        <div class="place-dist"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z" stroke="#2563EB" stroke-width="2"/><circle cx="12" cy="9" r="2.5" fill="#2563EB"/></svg>距离 ${p.dist}</div>
      </div>
      <button class="heart-btn" data-id="${p.id}">${heartSvg(hearted.has(p.id))}</button>`;
    el.querySelector('.place-info').addEventListener('click',()=>openPlaceSheet(p.id));
    el.querySelector('.heart-btn').addEventListener('click',e=>{e.stopPropagation();toggleHeart(e.currentTarget,p.id);});
    list.appendChild(el);
  });

  // map pins
  const map = $('#mapBox');
  map.querySelectorAll('.map-pin').forEach(n=>n.remove());
  places.forEach(p=>{
    const pin = document.createElement('div');
    pin.className='map-pin';
    pin.style.left=p.pin.x; pin.style.top=p.pin.y;
    pin.innerHTML=pinSvg();
    pin.addEventListener('click',()=>openPlaceSheet(p.id));
    map.appendChild(pin);
  });
}
function toggleHeart(btn,id){
  if(hearted.has(id)){ hearted.delete(id); btn.classList.remove('on'); btn.innerHTML=heartSvg(false); toast('已取消收藏地点'); }
  else { hearted.add(id); btn.classList.add('on'); btn.innerHTML=heartSvg(true); toast('已收藏地点'); }
}

/* ===================== Segmented control ===================== */
$$('#seg .seg-item').forEach(item=>{
  item.addEventListener('click',()=>{
    $$('#seg .seg-item').forEach(i=>i.classList.remove('is-active'));
    item.classList.add('is-active');
    const tab = item.dataset.tab;
    $('#seg').classList.toggle('has-places', tab==='place');
    $('#favActivity').classList.toggle('active', tab==='activity');
    $('#favPlace').classList.toggle('active', tab==='place');
  });
});

/* ===================== Bottom Sheet ===================== */
function openSheet(html){
  $('#sheetContent').innerHTML = html;
  $('#sheetOverlay').classList.add('show');
  $('#bottomSheet').classList.add('show');
}
function closeSheet(){
  $('#sheetOverlay').classList.remove('show');
  $('#bottomSheet').classList.remove('show');
}
$('#sheetOverlay').addEventListener('click',closeSheet);

function openActivitySheet(id){
  const a = activities.find(x=>x.id===id); if(!a) return;
  openSheet(`
    <div class="sheet-cover" style="background-image:url('${a.cover}')"></div>
    <div class="sheet-body">
      <span class="sheet-cat">${a.cat}</span>
      <div class="sheet-title">${a.title}</div>
      <div class="sheet-meta">
        <div class="sheet-meta-row"><span class="lbl">时间</span>${a.time}</div>
        <div class="sheet-meta-row"><span class="lbl">地点</span>${a.place}</div>
        <div class="sheet-meta-row"><span class="lbl">地址</span>${a.addr}</div>
        <div class="sheet-meta-row"><span class="lbl">距离</span>${a.dist}</div>
        <div class="sheet-meta-row"><span class="lbl">来源</span>${a.src}</div>
      </div>
      <div class="sheet-desc">${a.desc}</div>
      <button class="sheet-btn" id="remindBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 20a2 2 0 0 0 4 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
        设置提醒
      </button>
    </div>`);
  $('#remindBtn').addEventListener('click',()=>{ toast('已为该活动设置提醒'); closeSheet(); });
}
function openPlaceSheet(id){
  const p = places.find(x=>x.id===id); if(!p) return;
  const linked = p.acts.map(aid=>activities.find(x=>x.id===aid)).filter(Boolean);
  let linkedHtml = '';
  if(linked.length){
    linkedHtml = `<div class="sheet-desc">关联活动</div><div class="linked-list">${
      linked.map(a=>`<div class="linked-item" data-aid="${a.id}"><div class="linked-cover" style="background-image:url('${a.cover}')"></div><div><div class="linked-title">${a.title}</div><div class="linked-time">${a.time}</div></div></div>`).join('')
    }</div>`;
  }
  openSheet(`
    <div class="sheet-cover" style="background-image:url('${p.cover}')"></div>
    <div class="sheet-body">
      <span class="sheet-cat">地点</span>
      <div class="sheet-title">${p.title}</div>
      <div class="sheet-meta">
        <div class="sheet-meta-row"><span class="lbl">地址</span>${p.addr}</div>
        <div class="sheet-meta-row"><span class="lbl">距离</span>${p.dist}</div>
      </div>
      ${linkedHtml}
      <button class="sheet-btn" id="navBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 11l18-8-8 18-2-8-8-2z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
        导航前往
      </button>
    </div>`);
  $('#navBtn').addEventListener('click',()=>{ toast('正在打开导航...'); closeSheet(); });
  $$('#sheetContent .linked-item').forEach(el=>{
    el.addEventListener('click',()=>{ const aid=+el.dataset.aid; openActivitySheet(aid); });
  });
}

/* ===================== Reminder popup ===================== */
function showReminder(){
  $('#reminder').classList.add('show');
}
$('#rClose').addEventListener('click',()=>$('#reminder').classList.remove('show'));
$('#rNo').addEventListener('click',()=>{ $('#reminder').classList.remove('show'); toast('已稍后提醒'); });
$('#rYes').addEventListener('click',()=>{
  $('#reminder').classList.remove('show');
  goTo('discover');
  setTimeout(()=>openActivitySheet(6),400);
});

/* ===================== Init ===================== */
renderDiscover();
renderMasonry();
renderPlaces();
goTo('home');
setTimeout(showReminder, 3000);
</script>
