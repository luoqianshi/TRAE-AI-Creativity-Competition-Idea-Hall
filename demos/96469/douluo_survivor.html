<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斗罗大陆：无限生存</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body {
    background: #1a1a2e; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif;
    display: flex; justify-content: center; align-items: center; height: 100vh;
  }
  #gameContainer {
    position: relative; width: 100vw; height: 100vh; background: #16213e;
    overflow: hidden;
  }
  canvas { display: block; }

  /* ===== 角色选择界面 ===== */
  #charSelectScreen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100;
  }
  #charSelectScreen h1 {
    color: #ffd700; font-size: 48px; margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(255,215,0,0.5); letter-spacing: 4px;
  }
  #charSelectScreen .subtitle {
    color: #aaa; font-size: 18px; margin-bottom: 40px;
  }
  .char-cards {
    display: flex; gap: 60px;
  }
  .char-card {
    width: 220px; height: 320px; background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1); border-radius: 20px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; padding-top: 20px; cursor: pointer;
    transition: all 0.3s ease; position: relative; overflow: hidden;
  }
  .char-card:hover {
    transform: scale(1.08); border-color: #ffd700;
    background: rgba(255,255,255,0.1);
    box-shadow: 0 0 30px rgba(255,215,0,0.3);
  }
  .char-card .char-preview {
    width: 140px; height: 140px; margin-bottom: 15px;
  }
  .char-card .char-name {
    color: #fff; font-size: 24px; font-weight: bold; margin-bottom: 8px;
  }
  .char-card .char-desc {
    color: #ccc; font-size: 14px; text-align: center; padding: 0 15px;
  }
  .char-card .select-btn {
    margin-top: auto; margin-bottom: 20px; padding: 8px 30px;
    background: linear-gradient(45deg, #ffd700, #ffaa00);
    border: none; border-radius: 20px; color: #1a1a2e; font-weight: bold;
    font-size: 16px; cursor: pointer; transition: all 0.3s;
  }
  .char-card .select-btn:hover {
    transform: scale(1.1); box-shadow: 0 0 15px rgba(255,215,0,0.5);
  }

  /* ===== UI层 ===== */
  #uiLayer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }

  /* 顶部状态栏 */
  #topBar {
    position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 20px;
    background: rgba(0,0,0,0.6); padding: 10px 25px;
    border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
  }
  #levelDisplay {
    color: #ffd700; font-size: 20px; font-weight: bold;
  }
  #expBarContainer {
    width: 250px; height: 16px; background: rgba(255,255,255,0.1);
    border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2);
  }
  #expBar {
    width: 0%; height: 100%; background: linear-gradient(90deg, #4fc3f7, #29b6f6);
    border-radius: 8px; transition: width 0.3s ease;
    box-shadow: 0 0 10px rgba(79,195,247,0.5);
  }
  #hpBarContainer {
    width: 200px; height: 14px; background: rgba(255,255,255,0.1);
    border-radius: 7px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2);
  }
  #hpBar {
    width: 100%; height: 100%; background: linear-gradient(90deg, #ef5350, #e53935);
    border-radius: 7px; transition: width 0.2s ease;
  }
  .stat-text { color: #fff; font-size: 12px; }

  /* 升级选择面板 */
  #levelUpPanel {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.75); display: none;
    flex-direction: column; align-items: center; justify-content: center;
    pointer-events: all; z-index: 50;
  }
  #levelUpPanel.show { display: flex; }
  #levelUpPanel h2 {
    color: #ffd700; font-size: 36px; margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(255,215,0,0.5);
  }
  #levelUpPanel .level-tip {
    color: #aaa; font-size: 16px; margin-bottom: 30px;
  }
  .upgrade-options {
    display: flex; gap: 30px;
  }
  .upgrade-card {
    width: 200px; height: 260px; background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15); border-radius: 16px;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; cursor: pointer; transition: all 0.3s;
    pointer-events: all;
  }
  .upgrade-card:hover {
    transform: translateY(-10px) scale(1.05);
    border-color: #ffd700;
    background: rgba(255,255,255,0.15);
    box-shadow: 0 10px 30px rgba(255,215,0,0.2);
  }
  .upgrade-card .upgrade-icon {
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(255,215,0,0.15); display: flex;
    align-items: center; justify-content: center; font-size: 28px;
    margin-bottom: 12px;
  }
  .upgrade-card .upgrade-name {
    color: #fff; font-size: 18px; font-weight: bold; margin-bottom: 8px;
  }
  .upgrade-card .upgrade-desc {
    color: #bbb; font-size: 13px; text-align: center; line-height: 1.5;
  }

  /* 死亡面板 */
  #deathPanel {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); display: none;
    flex-direction: column; align-items: center; justify-content: center;
    pointer-events: all; z-index: 60;
  }
  #deathPanel.show { display: flex; }
  #deathPanel h2 {
    color: #ef5350; font-size: 48px; margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(239,83,80,0.5);
  }
  #deathPanel .death-stats {
    color: #ccc; font-size: 18px; margin-bottom: 30px; text-align: center;
    line-height: 2;
  }
  #deathPanel .restart-btn {
    padding: 15px 50px; background: linear-gradient(45deg, #ef5350, #e53935);
    border: none; border-radius: 30px; color: #fff; font-size: 20px;
    font-weight: bold; cursor: pointer; transition: all 0.3s;
  }
  #deathPanel .restart-btn:hover {
    transform: scale(1.1); box-shadow: 0 0 25px rgba(239,83,80,0.5);
  }

  /* 操作提示 */
  #controlsHint {
    position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.5); font-size: 13px;
    background: rgba(0,0,0,0.4); padding: 8px 20px;
    border-radius: 20px;
  }

  /* 浮动伤害数字 */
  .damage-text {
    position: absolute; color: #fff; font-weight: bold;
    font-size: 16px; pointer-events: none; animation: floatUp 1s forwards;
    text-shadow: 0 0 5px rgba(0,0,0,0.8);
  }
  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-50px); opacity: 0; }
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <!-- 角色选择界面 -->
  <div id="charSelectScreen">
    <h1>斗罗大陆：无限生存</h1>
    <div class="subtitle">选择你的魂师，开始无尽冒险</div>
    <div class="char-cards">
      <div class="char-card" data-char="tangsan">
        <canvas class="char-preview" id="tangsanPreview" width="140" height="140"></canvas>
        <div class="char-name">唐三</div>
        <div class="char-desc">控制系魂师<br>攻守兼备，昊天锤传承者</div>
        <button class="select-btn">选择角色</button>
      </div>
      <div class="char-card" data-char="xiaowu">
        <canvas class="char-preview" id="xiaowuPreview" width="140" height="140"></canvas>
        <div class="char-name">小舞</div>
        <div class="char-desc">敏攻系魂师<br>灵动迅捷，柔骨兔化身</div>
        <button class="select-btn">选择角色</button>
      </div>
    </div>
  </div>

  <!-- UI层 -->
  <div id="uiLayer" style="display:none;">
    <div id="topBar">
      <div id="levelDisplay">Lv.1</div>
      <div>
        <div style="display:flex;justify-content:space-between;margin-bottom:2px;">
          <span class="stat-text">经验</span>
          <span class="stat-text" id="expText">0/100</span>
        </div>
        <div id="expBarContainer"><div id="expBar"></div></div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;margin-bottom:2px;">
          <span class="stat-text">生命</span>
          <span class="stat-text" id="hpText">100/100</span>
        </div>
        <div id="hpBarContainer"><div id="hpBar"></div></div>
      </div>
    </div>
    <div id="controlsHint">WASD / 方向键移动 | 靠近道具自动拾取 | 靠近宝箱自动开启</div>
  </div>

  <!-- 升级选择面板 -->
  <div id="levelUpPanel">
    <h2>等级提升！</h2>
    <div class="level-tip">选择一项强化，让自己变得更强</div>
    <div class="upgrade-options" id="upgradeOptions"></div>
  </div>

  <!-- 死亡面板 -->
  <div id="deathPanel">
    <h2>魂力耗尽</h2>
    <div class="death-stats" id="deathStats"></div>
    <button class="restart-btn" id="restartBtn">重新开始</button>
  </div>
</div>

<script>
/**
 * ============================================
 * 斗罗大陆：无限生存 - 完整游戏代码
 * ============================================
 * 技术栈：HTML5 Canvas + 原生JavaScript + CSS3
 * 特性：纯离线运行，无需后端，打开即玩
 * ============================================
 */

// ===== 工具函数 =====
const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(rand(min, max));
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ===== 游戏配置 =====
const CONFIG = {
  mapWidth: 6000,
  mapHeight: 6000,
  viewWidth: window.innerWidth,
  viewHeight: window.innerHeight,
  baseExp: 100,
  expGrowth: 1.15,
  spawnInterval: 1500,
  eliteChance: 0.08,
  maxMonsters: 80,
  pickupRadius: 60,
  chestOpenRadius: 50,
};

// ===== 升级选项库 =====
const UPGRADE_POOL = [
  { name: "攻击力提升", desc: "武器伤害 +15%", icon: "⚔️", type: "atk", value: 0.15 },
  { name: "生命强化", desc: "最大生命值 +20%", icon: "❤️", type: "hp", value: 0.20 },
  { name: "速度提升", desc: "移动速度 +10%", icon: "💨", type: "spd", value: 0.10 },
  { name: "攻击范围", desc: "武器攻击范围 +12%", icon: "🎯", type: "range", value: 0.12 },
  { name: "攻速强化", desc: "武器旋转速度 +15%", icon: "⚡", type: "aspd", value: 0.15 },
  { name: "吸血之魂", desc: "攻击恢复1%生命", icon: "🩸", type: "leech", value: 0.01 },
  { name: "暴击之力", desc: "暴击率 +8%", icon: "💥", type: "crit", value: 0.08 },
  { name: "防御强化", desc: "受到伤害 -10%", icon: "🛡️", type: "def", value: 0.10 },
  { name: "多重武器", desc: "增加1个环绕武器", icon: "🔱", type: "weapon", value: 1 },
  { name: "经验吸收", desc: "拾取范围 +20%", icon: "✨", type: "magnet", value: 0.20 },
  { name: "坚韧意志", desc: "生命恢复 +2/秒", icon: "🌿", type: "regen", value: 2 },
  { name: "狂暴之力", desc: "伤害 +25%，生命 -10%", icon: "🔥", type: "berserk", value: 0.25 },
];

// ===== 绘制Q版角色预览 =====
function drawCharPreview(canvas, type) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;

  if (type === 'tangsan') {
    // 唐三 - 蓝色调，短发
    // 身体
    ctx.fillStyle = '#1e88e5';
    ctx.beginPath(); ctx.arc(cx, cy + 10, 35, 0, Math.PI * 2); ctx.fill();
    // 头
    ctx.fillStyle = '#ffdbac';
    ctx.beginPath(); ctx.arc(cx, cy - 25, 28, 0, Math.PI * 2); ctx.fill();
    // 头发（蓝色短发）
    ctx.fillStyle = '#1565c0';
    ctx.beginPath(); ctx.arc(cx, cy - 30, 30, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx - 20, cy - 25, 10, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 20, cy - 25, 10, 15, 0, 0, Math.PI * 2); ctx.fill();
    // 眼睛
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(cx - 10, cy - 25, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 10, cy - 25, 4, 0, Math.PI * 2); ctx.fill();
    // 嘴巴
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy - 18, 6, 0, Math.PI); ctx.stroke();
    // 衣服装饰
    ctx.fillStyle = '#ffd700';
    ctx.beginPath(); ctx.arc(cx, cy + 5, 8, 0, Math.PI * 2); ctx.fill();
  } else {
    // 小舞 - 粉色调，兔耳
    // 身体
    ctx.fillStyle = '#f06292';
    ctx.beginPath(); ctx.arc(cx, cy + 10, 32, 0, Math.PI * 2); ctx.fill();
    // 头
    ctx.fillStyle = '#ffdbac';
    ctx.beginPath(); ctx.arc(cx, cy - 22, 26, 0, Math.PI * 2); ctx.fill();
    // 头发（粉色长发）
    ctx.fillStyle = '#e91e63';
    ctx.beginPath(); ctx.arc(cx, cy - 28, 28, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx - 22, cy - 10, 12, 22, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 22, cy - 10, 12, 22, -0.3, 0, Math.PI * 2); ctx.fill();
    // 兔耳
    ctx.fillStyle = '#f48fb1';
    ctx.beginPath(); ctx.ellipse(cx - 12, cy - 55, 8, 22, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 12, cy - 55, 8, 22, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fce4ec';
    ctx.beginPath(); ctx.ellipse(cx - 12, cy - 55, 4, 15, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 12, cy - 55, 4, 15, 0.3, 0, Math.PI * 2); ctx.fill();
    // 眼睛
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(cx - 8, cy - 22, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 8, cy - 22, 4, 0, Math.PI * 2); ctx.fill();
    // 嘴巴
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy - 16, 5, 0, Math.PI); ctx.stroke();
  }
}

// 初始化预览
setTimeout(() => {
  drawCharPreview(document.getElementById('tangsanPreview'), 'tangsan');
  drawCharPreview(document.getElementById('xiaowuPreview'), 'xiaowu');
}, 100);

// ===== 游戏主类 =====
class Game {
  constructor() {
    this.canvas = document.getElementById('gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());

    this.state = 'selecting'; // selecting, playing, levelup, dead
    this.selectedChar = null;

    // 游戏对象
    this.player = null;
    this.weapons = [];
    this.monsters = [];
    this.expOrbs = [];
    this.chests = [];
    this.particles = [];
    this.floatingTexts = [];

    // 相机
    this.camera = { x: 0, y: 0 };

    // 输入
    this.keys = {};
    window.addEventListener('keydown', e => this.keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => this.keys[e.key.toLowerCase()] = false);

    // 计时器
    this.lastTime = 0;
    this.spawnTimer = 0;
    this.gameTime = 0;

    // UI元素
    this.uiLayer = document.getElementById('uiLayer');
    this.levelUpPanel = document.getElementById('levelUpPanel');
    this.deathPanel = document.getElementById('deathPanel');
    this.upgradeOptions = document.getElementById('upgradeOptions');

    // 绑定角色选择
    document.querySelectorAll('.char-card').forEach(card => {
      card.addEventListener('click', () => {
        this.selectedChar = card.dataset.char;
        this.startGame();
      });
    });

    // 绑定重新开始
    document.getElementById('restartBtn').addEventListener('click', () => this.resetGame());

    // 启动循环
    requestAnimationFrame(t => this.loop(t));
  }

  resize() {
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
    CONFIG.viewWidth = this.canvas.width;
    CONFIG.viewHeight = this.canvas.height;
  }

  startGame() {
    document.getElementById('charSelectScreen').style.display = 'none';
    this.uiLayer.style.display = 'block';
    this.state = 'playing';
    this.initPlayer();
    this.spawnInitialExp();
  }

  resetGame() {
    this.state = 'playing';
    this.deathPanel.classList.remove('show');
    this.monsters = [];
    this.expOrbs = [];
    this.chests = [];
    this.particles = [];
    this.floatingTexts = [];
    this.weapons = [];
    this.gameTime = 0;
    this.spawnTimer = 0;
    this.initPlayer();
    this.spawnInitialExp();
  }

  initPlayer() {
    this.player = {
      x: CONFIG.mapWidth / 2,
      y: CONFIG.mapHeight / 2,
      radius: 20,
      speed: 200,
      hp: 100,
      maxHp: 100,
      level: 1,
      exp: 0,
      expToLevel: CONFIG.baseExp,
      atk: 10,
      atkRange: 120,
      atkSpeed: 1,
      critRate: 0,
      def: 0,
      leech: 0,
      regen: 0,
      magnetBonus: 0,
      weaponCount: 1,
      facing: 1,
      invincible: 0,
      animTime: 0,
    };
    this.updateWeaponSystem();
  }

  updateWeaponSystem() {
    this.weapons = [];
    for (let i = 0; i < this.player.weaponCount; i++) {
      this.weapons.push({
        angle: (Math.PI * 2 / this.player.weaponCount) * i,
        orbitRadius: 45,
      });
    }
  }

  spawnInitialExp() {
    for (let i = 0; i < 30; i++) {
      this.spawnExpOrb(
        rand(100, CONFIG.mapWidth - 100),
        rand(100, CONFIG.mapHeight - 100),
        randInt(5, 15)
      );
    }
  }

  spawnExpOrb(x, y, value) {
    this.expOrbs.push({ x, y, value, radius: 6, pulse: rand(0, Math.PI * 2) });
  }

  spawnMonster(isElite = false) {
    const p = this.player;
    let x, y;
    // 在屏幕外生成
    const angle = rand(0, Math.PI * 2);
    const dist = Math.max(CONFIG.viewWidth, CONFIG.viewHeight) / 2 + rand(50, 200);
    x = p.x + Math.cos(angle) * dist;
    y = p.y + Math.sin(angle) * dist;

    // 限制在地图内
    x = clamp(x, 50, CONFIG.mapWidth - 50);
    y = clamp(y, 50, CONFIG.mapHeight - 50);

    const levelFactor = 1 + (p.level - 1) * 0.08;
    const eliteFactor = isElite ? 3 : 1;

    const monster = {
      x, y,
      radius: isElite ? 28 : 18,
      speed: rand(60, 100) * (1 + p.level * 0.03),
      hp: 20 * levelFactor * eliteFactor,
      maxHp: 20 * levelFactor * eliteFactor,
      atk: 5 * levelFactor * eliteFactor * 0.5,
      isElite,
      expValue: (isElite ? 50 : 10) * levelFactor,
      flash: 0,
      animTime: rand(0, 100),
    };
    this.monsters.push(monster);
  }

  spawnChest(x, y) {
    this.chests.push({
      x, y,
      radius: 16,
      opened: false,
      openAnim: 0,
      glow: 0,
    });
  }

  // ===== 更新逻辑 =====
  update(dt) {
    if (this.state !== 'playing') return;

    this.gameTime += dt;
    const p = this.player;
    p.animTime += dt;

    // 玩家移动
    let dx = 0, dy = 0;
    if (this.keys['w'] || this.keys['arrowup']) dy -= 1;
    if (this.keys['s'] || this.keys['arrowdown']) dy += 1;
    if (this.keys['a'] || this.keys['arrowleft']) dx -= 1;
    if (this.keys['d'] || this.keys['arrowright']) dx += 1;
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
      p.x += dx * p.speed * dt;
      p.y += dy * p.speed * dt;
      p.facing = dx >= 0 ? 1 : -1;
    }
    // 限制在地图内
    p.x = clamp(p.x, p.radius, CONFIG.mapWidth - p.radius);
    p.y = clamp(p.y, p.radius, CONFIG.mapHeight - p.radius);

    // 生命恢复
    if (p.regen > 0) {
      p.hp = Math.min(p.maxHp, p.hp + p.regen * dt);
    }

    // 无敌时间递减
    if (p.invincible > 0) p.invincible -= dt;

    // 更新武器旋转
    this.weapons.forEach(w => {
      w.angle += p.atkSpeed * 2.5 * dt;
    });

    // 武器攻击检测
    this.updateWeaponAttack(dt);

    // 更新相机
    this.camera.x = lerp(this.camera.x, p.x - CONFIG.viewWidth / 2, 0.1);
    this.camera.y = lerp(this.camera.y, p.y - CONFIG.viewHeight / 2, 0.1);
    this.camera.x = clamp(this.camera.x, 0, CONFIG.mapWidth - CONFIG.viewWidth);
    this.camera.y = clamp(this.camera.y, 0, CONFIG.mapHeight - CONFIG.viewHeight);

    // 怪物生成
    this.spawnTimer -= dt * 1000;
    const spawnRate = Math.max(300, CONFIG.spawnInterval - p.level * 40);
    if (this.spawnTimer <= 0 && this.monsters.length < CONFIG.maxMonsters) {
      const isElite = Math.random() < CONFIG.eliteChance + p.level * 0.005;
      this.spawnMonster(isElite);
      this.spawnTimer = spawnRate;
    }

    // 更新怪物
    this.updateMonsters(dt);

    // 经验拾取
    this.updateExpPickup(dt);

    // 宝箱
    this.updateChests(dt);

    // 更新粒子
    this.updateParticles(dt);

    // 更新浮动文字
    this.updateFloatingTexts(dt);

    // 更新UI
    this.updateUI();

    // 死亡检测
    if (p.hp <= 0) {
      this.onDeath();
    }
  }

  updateWeaponAttack(dt) {
    const p = this.player;
    const weaponReach = p.atkRange;

    this.weapons.forEach(w => {
      const wx = p.x + Math.cos(w.angle) * w.orbitRadius;
      const wy = p.y + Math.sin(w.angle) * w.orbitRadius;

      // 武器拖尾粒子
      if (Math.random() < 0.3) {
        this.spawnParticle(wx, wy, 'trail');
      }

      // 检测击中怪物
      this.monsters.forEach(m => {
        const d = dist(wx, wy, m.x, m.y);
        if (d < weaponReach + m.radius && m.hp > 0) {
          // 计算伤害
          let damage = p.atk;
          if (Math.random() < p.critRate) damage *= 2;
          damage *= (1 + Math.random() * 0.2);
          damage = Math.max(1, damage);

          m.hp -= damage;
          m.flash = 0.15;
          this.spawnParticle(m.x, m.y, 'hit');
          this.addFloatingText(Math.round(damage), m.x, m.y - 20, '#fff');

          // 吸血
          if (p.leech > 0) {
            p.hp = Math.min(p.maxHp, p.hp + damage * p.leech);
          }

          if (m.hp <= 0) {
            this.onMonsterKill(m);
          }
        }
      });
    });
  }

  updateMonsters(dt) {
    const p = this.player;
    this.monsters.forEach(m => {
      m.animTime += dt;
      if (m.flash > 0) m.flash -= dt;

      // 向玩家移动
      const d = dist(m.x, m.y, p.x, p.y);
      if (d > p.radius + m.radius) {
        const angle = Math.atan2(p.y - m.y, p.x - m.x);
        m.x += Math.cos(angle) * m.speed * dt;
        m.y += Math.sin(angle) * m.speed * dt;
      }

      // 碰撞玩家
      if (d < p.radius + m.radius && p.invincible <= 0) {
        const damage = Math.max(1, m.atk * (1 - p.def));
        p.hp -= damage;
        p.invincible = 0.5;
        this.spawnParticle(p.x, p.y, 'playerHit');
        this.addFloatingText(`-${Math.round(damage)}`, p.x, p.y - 30, '#ef5350');
      }
    });

    // 移除死亡怪物
    this.monsters = this.monsters.filter(m => m.hp > 0);
  }

  updateExpPickup(dt) {
    const p = this.player;
    const magnetRange = CONFIG.pickupRadius + p.magnetBonus * CONFIG.pickupRadius;

    this.expOrbs.forEach(orb => {
      orb.pulse += dt * 3;
      const d = dist(orb.x, orb.y, p.x, p.y);

      if (d < magnetRange + 100) {
        // 向玩家移动
        const angle = Math.atan2(p.y - orb.y, p.x - orb.x);
        const speed = d < magnetRange ? 400 : 200;
        orb.x += Math.cos(angle) * speed * dt;
        orb.y += Math.sin(angle) * speed * dt;
      }

      if (d < p.radius + orb.radius + 10) {
        this.gainExp(orb.value);
        this.spawnParticle(orb.x, orb.y, 'exp');
        orb.collected = true;
      }
    });

    this.expOrbs = this.expOrbs.filter(o => !o.collected);
  }

  updateChests(dt) {
    const p = this.player;
    this.chests.forEach(chest => {
      if (chest.opened) {
        chest.openAnim += dt;
        return;
      }
      chest.glow += dt * 2;
      const d = dist(chest.x, chest.y, p.x, p.y);
      if (d < CONFIG.chestOpenRadius + p.radius) {
        chest.opened = true;
        this.onChestOpen(chest);
      }
    });
    this.chests = this.chests.filter(c => c.openAnim < 2);
  }

  onMonsterKill(m) {
    // 掉落经验
    const orbCount = m.isElite ? randInt(3, 6) : randInt(1, 3);
    for (let i = 0; i < orbCount; i++) {
      const angle = rand(0, Math.PI * 2);
      const dist = rand(10, 40);
      this.spawnExpOrb(
        m.x + Math.cos(angle) * dist,
        m.y + Math.sin(angle) * dist,
        m.expValue / orbCount
      );
    }

    // 精英怪掉落宝箱
    if (m.isElite) {
      this.spawnChest(m.x, m.y);
    }

    // 死亡粒子
    for (let i = 0; i < 8; i++) {
      this.spawnParticle(m.x, m.y, 'death');
    }
  }

  onChestOpen(chest) {
    const p = this.player;
    // 大量经验
    const expGain = p.expToLevel * 0.3;
    this.gainExp(expGain);

    // 随机属性奖励
    const bonuses = [
      () => { p.maxHp += 20; p.hp += 20; this.addFloatingText('+20 生命', chest.x, chest.y - 30, '#4caf50'); },
      () => { p.atk += 3; this.addFloatingText('+3 攻击', chest.x, chest.y - 30, '#ff9800'); },
      () => { p.speed += 10; this.addFloatingText('+10 速度', chest.x, chest.y - 30, '#03a9f4'); },
      () => { p.atkRange += 10; this.addFloatingText('+10 范围', chest.x, chest.y - 30, '#9c27b0'); },
    ];
    bonuses[randInt(0, bonuses.length)]();

    // 粒子效果
    for (let i = 0; i < 15; i++) {
      this.spawnParticle(chest.x, chest.y, 'chest');
    }
    this.addFloatingText('宝箱开启!', chest.x, chest.y - 50, '#ffd700');
  }

  gainExp(amount) {
    const p = this.player;
    p.exp += amount;
    if (p.exp >= p.expToLevel) {
      p.exp -= p.expToLevel;
      p.level++;
      p.expToLevel = Math.floor(CONFIG.baseExp * Math.pow(CONFIG.expGrowth, p.level - 1));
      this.onLevelUp();
    }
  }

  onLevelUp() {
    this.state = 'levelup';
    this.levelUpPanel.classList.add('show');

    // 随机3个升级选项
    const options = [];
    const pool = [...UPGRADE_POOL];
    for (let i = 0; i < 3; i++) {
      const idx = randInt(0, pool.length);
      options.push(pool.splice(idx, 1)[0]);
    }

    this.upgradeOptions.innerHTML = '';
    options.forEach(opt => {
      const card = document.createElement('div');
      card.className = 'upgrade-card';
      card.innerHTML = `
        <div class="upgrade-icon">${opt.icon}</div>
        <div class="upgrade-name">${opt.name}</div>
        <div class="upgrade-desc">${opt.desc}</div>
      `;
      card.addEventListener('click', () => this.applyUpgrade(opt));
      this.upgradeOptions.appendChild(card);
    });

    // 升级特效
    for (let i = 0; i < 30; i++) {
      this.spawnParticle(this.player.x, this.player.y, 'levelup');
    }
  }

  applyUpgrade(opt) {
    const p = this.player;
    switch (opt.type) {
      case 'atk': p.atk *= (1 + opt.value); break;
      case 'hp': p.maxHp *= (1 + opt.value); p.hp *= (1 + opt.value); break;
      case 'spd': p.speed *= (1 + opt.value); break;
      case 'range': p.atkRange *= (1 + opt.value); break;
      case 'aspd': p.atkSpeed *= (1 + opt.value); break;
      case 'leech': p.leech += opt.value; break;
      case 'crit': p.critRate += opt.value; break;
      case 'def': p.def += opt.value; break;
      case 'weapon': p.weaponCount += opt.value; this.updateWeaponSystem(); break;
      case 'magnet': p.magnetBonus += opt.value; break;
      case 'regen': p.regen += opt.value; break;
      case 'berserk': p.atk *= (1 + opt.value); p.maxHp *= 0.9; p.hp = Math.min(p.hp, p.maxHp); break;
    }
    this.levelUpPanel.classList.remove('show');
    this.state = 'playing';
  }

  onDeath() {
    this.state = 'dead';
    const p = this.player;
    document.getElementById('deathStats').innerHTML = `
      存活时间：${Math.floor(this.gameTime)}秒<br>
      达到等级：${p.level}级<br>
      击败怪物：${this.gameTime > 0 ? Math.floor(this.gameTime * 2) : 0}只
    `;
    this.deathPanel.classList.add('show');
  }

  // ===== 粒子系统 =====
  spawnParticle(x, y, type) {
    const colors = {
      trail: ['#4fc3f7', '#29b6f6', '#81d4fa'],
      hit: ['#ff5252', '#ff1744', '#ff8a80'],
      exp: ['#4fc3f7', '#00e5ff', '#18ffff'],
      death: ['#ff5252', '#ffab40', '#ffd740'],
      playerHit: ['#ef5350', '#e53935', '#ffcdd2'],
      chest: ['#ffd700', '#ffaa00', '#ffeb3b'],
      levelup: ['#ffd700', '#ffeb3b', '#fff176', '#4fc3f7'],
    };
    const colorList = colors[type] || ['#fff'];
    this.particles.push({
      x, y,
      vx: rand(-150, 150),
      vy: rand(-150, 150),
      life: rand(0.3, 0.8),
      maxLife: rand(0.3, 0.8),
      radius: rand(2, 6),
      color: colorList[randInt(0, colorList.length)],
    });
  }

  updateParticles(dt) {
    this.particles.forEach(p => {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      p.vx *= 0.98;
      p.vy *= 0.98;
    });
    this.particles = this.particles.filter(p => p.life > 0);
  }

  addFloatingText(text, x, y, color) {
    // 转换为屏幕坐标
    const sx = x - this.camera.x;
    const sy = y - this.camera.y;
    const el = document.createElement('div');
    el.className = 'damage-text';
    el.style.left = sx + 'px';
    el.style.top = sy + 'px';
    el.style.color = color;
    el.textContent = text;
    document.getElementById('gameContainer').appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  updateFloatingTexts(dt) {
    // DOM元素自动由CSS动画处理
  }

  // ===== 渲染 =====
  render() {
    const ctx = this.ctx;
    const w = this.canvas.width, h = this.canvas.height;

    // 清空
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, w, h);

    if (this.state === 'selecting') return;

    ctx.save();
    ctx.translate(-this.camera.x, -this.camera.y);

    // 绘制地图背景
    this.drawMap(ctx);

    // 绘制经验道具
    this.drawExpOrbs(ctx);

    // 绘制宝箱
    this.drawChests(ctx);

    // 绘制怪物
    this.drawMonsters(ctx);

    // 绘制武器
    this.drawWeapons(ctx);

    // 绘制玩家
    this.drawPlayer(ctx);

    // 绘制粒子
    this.drawParticles(ctx);

    ctx.restore();
  }

  drawMap(ctx) {
    // 背景网格
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    const gridSize = 80;
    const startX = Math.floor(this.camera.x / gridSize) * gridSize;
    const startY = Math.floor(this.camera.y / gridSize) * gridSize;

    for (let x = startX; x < this.camera.x + CONFIG.viewWidth + gridSize; x += gridSize) {
      ctx.beginPath(); ctx.moveTo(x, this.camera.y); ctx.lineTo(x, this.camera.y + CONFIG.viewHeight); ctx.stroke();
    }
    for (let y = startY; y < this.camera.y + CONFIG.viewHeight + gridSize; y += gridSize) {
      ctx.beginPath(); ctx.moveTo(this.camera.x, y); ctx.lineTo(this.camera.x + CONFIG.viewWidth, y); ctx.stroke();
    }

    // 地图边界
    ctx.strokeStyle = 'rgba(255,215,0,0.3)';
    ctx.lineWidth = 3;
    ctx.strokeRect(0, 0, CONFIG.mapWidth, CONFIG.mapHeight);
  }

  drawPlayer(ctx) {
    const p = this.player;
    const x = p.x, y = p.y;
    const bounce = Math.sin(p.animTime * 8) * 2;

    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(x, y + 22, 18, 6, 0, 0, Math.PI * 2); ctx.fill();

    if (this.selectedChar === 'tangsan') {
      // 唐三绘制
      // 身体
      ctx.fillStyle = '#1e88e5';
      ctx.beginPath(); ctx.arc(x, y + 8 + bounce, 22, 0, Math.PI * 2); ctx.fill();
      // 衣服装饰
      ctx.fillStyle = '#ffd700';
      ctx.beginPath(); ctx.arc(x, y + 5 + bounce, 8, 0, Math.PI * 2); ctx.fill();
      // 头
      ctx.fillStyle = '#ffdbac';
      ctx.beginPath(); ctx.arc(x, y - 18 + bounce, 20, 0, Math.PI * 2); ctx.fill();
      // 头发
      ctx.fillStyle = '#1565c0';
      ctx.beginPath(); ctx.arc(x, y - 22 + bounce, 22, Math.PI, 0); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x - 16, y - 18 + bounce, 8, 12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + 16, y - 18 + bounce, 8, 12, 0, 0, Math.PI * 2); ctx.fill();
      // 眼睛
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.arc(x - 7, y - 18 + bounce, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 7, y - 18 + bounce, 3, 0, Math.PI * 2); ctx.fill();
      // 嘴巴
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y - 12 + bounce, 4, 0, Math.PI); ctx.stroke();
    } else {
      // 小舞绘制
      // 身体
      ctx.fillStyle = '#f06292';
      ctx.beginPath(); ctx.arc(x, y + 8 + bounce, 20, 0, Math.PI * 2); ctx.fill();
      // 头
      ctx.fillStyle = '#ffdbac';
      ctx.beginPath(); ctx.arc(x, y - 16 + bounce, 18, 0, Math.PI * 2); ctx.fill();
      // 头发
      ctx.fillStyle = '#e91e63';
      ctx.beginPath(); ctx.arc(x, y - 20 + bounce, 20, Math.PI, 0); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x - 15, y - 8 + bounce, 10, 18, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + 15, y - 8 + bounce, 10, 18, -0.3, 0, Math.PI * 2); ctx.fill();
      // 兔耳
      ctx.fillStyle = '#f48fb1';
      ctx.beginPath(); ctx.ellipse(x - 10, y - 42 + bounce, 6, 18, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + 10, y - 42 + bounce, 6, 18, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fce4ec';
      ctx.beginPath(); ctx.ellipse(x - 10, y - 42 + bounce, 3, 12, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + 10, y - 42 + bounce, 3, 12, 0.3, 0, Math.PI * 2); ctx.fill();
      // 眼睛
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.arc(x - 6, y - 16 + bounce, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 6, y - 16 + bounce, 3, 0, Math.PI * 2); ctx.fill();
      // 嘴巴
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y - 10 + bounce, 4, 0, Math.PI); ctx.stroke();
    }

    // 无敌闪烁
    if (p.invincible > 0 && Math.floor(p.invincible * 10) % 2 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath(); ctx.arc(x, y, 25, 0, Math.PI * 2); ctx.fill();
    }

    // 头顶等级与经验条
    const barWidth = 50;
    const barHeight = 6;
    const barX = x - barWidth / 2;
    const barY = y - 50 + bounce;

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(barX - 2, barY - 2, barWidth + 4, barHeight + 4);
    ctx.fillStyle = '#333';
    ctx.fillRect(barX, barY, barWidth, barHeight);
    ctx.fillStyle = '#4fc3f7';
    ctx.fillRect(barX, barY, barWidth * (p.exp / p.expToLevel), barHeight);

    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 12px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText(`Lv.${p.level}`, x, barY - 5);
  }

  drawWeapons(ctx) {
    const p = this.player;
    this.weapons.forEach(w => {
      const wx = p.x + Math.cos(w.angle) * w.orbitRadius;
      const wy = p.y + Math.sin(w.angle) * w.orbitRadius;

      // 武器光晕
      ctx.fillStyle = 'rgba(79,195,247,0.2)';
      ctx.beginPath(); ctx.arc(wx, wy, 12, 0, Math.PI * 2); ctx.fill();

      // 武器本体 - 昊天锤/柔骨兔风格简化
      ctx.save();
      ctx.translate(wx, wy);
      ctx.rotate(w.angle + Math.PI / 2);

      if (this.selectedChar === 'tangsan') {
        // 锤形武器
        ctx.fillStyle = '#5d4037';
        ctx.fillRect(-4, -12, 8, 24);
        ctx.fillStyle = '#8d6e63';
        ctx.fillRect(-10, -8, 20, 16);
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(-8, -6, 16, 12);
      } else {
        // 月牙形武器
        ctx.fillStyle = '#f06292';
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI, true); ctx.fill();
        ctx.fillStyle = '#ffd700';
        ctx.beginPath(); ctx.arc(0, -2, 8, 0, Math.PI, true); ctx.fill();
      }
      ctx.restore();
    });

    // 攻击范围指示（轻微透明圈）
    ctx.strokeStyle = 'rgba(79,195,247,0.08)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.atkRange, 0, Math.PI * 2); ctx.stroke();
  }

  drawMonsters(ctx) {
    this.monsters.forEach(m => {
      const x = m.x, y = m.y;
      const bounce = Math.sin(m.animTime * 6) * 2;

      // 阴影
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.ellipse(x, y + m.radius - 2, m.radius * 0.8, 4, 0, 0, Math.PI * 2); ctx.fill();

      if (m.isElite) {
        // 精英怪 - 紫色，更大，有角
        // 身体
        ctx.fillStyle = '#7b1fa2';
        ctx.beginPath(); ctx.arc(x, y + bounce, m.radius, 0, Math.PI * 2); ctx.fill();
        // 角
        ctx.fillStyle = '#ffd700';
        ctx.beginPath(); ctx.moveTo(x - 12, y - 15 + bounce); ctx.lineTo(x - 18, y - 35 + bounce); ctx.lineTo(x - 5, y - 20 + bounce); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x + 12, y - 15 + bounce); ctx.lineTo(x + 18, y - 35 + bounce); ctx.lineTo(x + 5, y - 20 + bounce); ctx.fill();
        // 眼睛（红色凶恶）
        ctx.fillStyle = '#ff1744';
        ctx.beginPath(); ctx.arc(x - 8, y - 5 + bounce, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 8, y - 5 + bounce, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(x - 9, y - 6 + bounce, 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 7, y - 6 + bounce, 2, 0, Math.PI * 2); ctx.fill();
        // 嘴巴
        ctx.fillStyle = '#333';
        ctx.beginPath(); ctx.arc(x, y + 8 + bounce, 8, 0, Math.PI); ctx.fill();
        // 精英光环
        ctx.strokeStyle = `rgba(255,215,0,${0.3 + Math.sin(m.animTime * 4) * 0.2})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, m.radius + 6, 0, Math.PI * 2); ctx.stroke();
      } else {
        // 普通怪 - 绿色史莱姆风格
        ctx.fillStyle = '#66bb6a';
        ctx.beginPath(); ctx.arc(x, y + bounce, m.radius, 0, Math.PI * 2); ctx.fill();
        // 眼睛
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(x - 6, y - 3 + bounce, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 6, y - 3 + bounce, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#333';
        ctx.beginPath(); ctx.arc(x - 6, y - 3 + bounce, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 6, y - 3 + bounce, 2.5, 0, Math.PI * 2); ctx.fill();
        // 嘴巴
        ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y + 5 + bounce, 4, 0, Math.PI); ctx.stroke();
      }

      // 受击闪光
      if (m.flash > 0) {
        ctx.fillStyle = `rgba(255,255,255,${m.flash * 4})`;
        ctx.beginPath(); ctx.arc(x, y, m.radius + 2, 0, Math.PI * 2); ctx.fill();
      }

      // 血条
      const hpRatio = m.hp / m.maxHp;
      const barW = m.radius * 2;
      const barH = 4;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(x - barW / 2, y - m.radius - 10, barW, barH);
      ctx.fillStyle = hpRatio > 0.5 ? '#4caf50' : hpRatio > 0.25 ? '#ff9800' : '#f44336';
      ctx.fillRect(x - barW / 2, y - m.radius - 10, barW * hpRatio, barH);
    });
  }

  drawExpOrbs(ctx) {
    this.expOrbs.forEach(orb => {
      const pulseScale = 1 + Math.sin(orb.pulse) * 0.2;
      const r = orb.radius * pulseScale;

      // 光晕
      ctx.fillStyle = 'rgba(79,195,247,0.2)';
      ctx.beginPath(); ctx.arc(orb.x, orb.y, r + 4, 0, Math.PI * 2); ctx.fill();

      // 本体
      ctx.fillStyle = '#4fc3f7';
      ctx.beginPath(); ctx.arc(orb.x, orb.y, r, 0, Math.PI * 2); ctx.fill();

      // 高光
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.arc(orb.x - 2, orb.y - 2, r * 0.4, 0, Math.PI * 2); ctx.fill();
    });
  }

  drawChests(ctx) {
    this.chests.forEach(chest => {
      if (chest.opened) {
        // 开箱动画 - 逐渐放大消失
        const scale = 1 + chest.openAnim * 2;
        const alpha = 1 - chest.openAnim / 2;
        ctx.save();
        ctx.translate(chest.x, chest.y);
        ctx.scale(scale, scale);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath(); ctx.arc(0, 0, chest.radius, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        return;
      }

      const glow = 0.3 + Math.sin(chest.glow) * 0.2;

      // 光晕
      ctx.fillStyle = `rgba(255,215,0,${glow * 0.3})`;
      ctx.beginPath(); ctx.arc(chest.x, chest.y, chest.radius + 8, 0, Math.PI * 2); ctx.fill();

      // 宝箱本体
      ctx.fillStyle = '#8d6e63';
      ctx.fillRect(chest.x - chest.radius, chest.y - chest.radius * 0.7, chest.radius * 2, chest.radius * 1.4);
      ctx.fillStyle = '#6d4c41';
      ctx.fillRect(chest.x - chest.radius + 3, chest.y - chest.radius * 0.7 + 3, chest.radius * 2 - 6, chest.radius * 1.4 - 6);
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(chest.x - 3, chest.y - chest.radius * 0.7, 6, chest.radius * 1.4);
      ctx.beginPath(); ctx.arc(chest.x, chest.y, 5, 0, Math.PI * 2); ctx.fill();

      // 提示文字
      ctx.fillStyle = `rgba(255,215,0,${glow})`;
      ctx.font = '10px Microsoft YaHei';
      ctx.textAlign = 'center';
      ctx.fillText('宝箱', chest.x, chest.y - chest.radius - 8);
    });
  }

  drawParticles(ctx) {
    this.particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * (p.life / p.maxLife), 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  updateUI() {
    const p = this.player;
    document.getElementById('levelDisplay').textContent = `Lv.${p.level}`;
    document.getElementById('expBar').style.width = `${(p.exp / p.expToLevel) * 100}%`;
    document.getElementById('expText').textContent = `${Math.floor(p.exp)}/${p.expToLevel}`;
    document.getElementById('hpBar').style.width = `${(p.hp / p.maxHp) * 100}%`;
    document.getElementById('hpText').textContent = `${Math.floor(p.hp)}/${Math.floor(p.maxHp)}`;
  }

  loop(timestamp) {
    const dt = Math.min((timestamp - this.lastTime) / 1000, 0.05);
    this.lastTime = timestamp;

    this.update(dt);
    this.render();

    requestAnimationFrame(t => this.loop(t));
  }
}

// ===== 启动游戏 =====
window.onload = () => {
  new Game();
};
</script>
