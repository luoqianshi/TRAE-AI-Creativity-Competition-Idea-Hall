<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>毛球星 · 宠物纪念馆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #faf8f5;
    --card: #ffffff;
    --primary: #7c6bc0;
    --primary-light: #eeedfe;
    --primary-dark: #534ab7;
    --text: #2c2c2a;
    --text-sub: #888780;
    --text-light: #b4b2a9;
    --border: #f0eee8;
    --warm: #f5e6c8;
    --warm-light: #fefaf3;
    --pink: #f4c0d1;
    --pink-light: #fef5f8;
    --green: #1d9e75;
    --green-light: #e1f5ee;
    --shadow: 0 2px 16px rgba(124, 107, 192, 0.08);
    --radius: 16px;
    --radius-sm: 10px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #e8e6df;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .phone-frame {
    width: 390px;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.12);
  }
  @media (max-width: 430px) {
    body { background: var(--bg); }
    .phone-frame { width: 100%; box-shadow: none; }
  }

  /* ---- Pages ---- */
  .page {
    display: none;
    min-height: 100vh;
    flex-direction: column;
    animation: fadeIn 0.3s ease;
  }
  .page.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }

  /* ---- Splash ---- */
  #page-splash {
    background: linear-gradient(160deg, #eeedfe 0%, #faf8f5 50%, #fef5f8 100%);
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
  }
  .splash-logo {
    width: 88px; height: 88px;
    border-radius: 28px;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(124, 107, 192, 0.3);
    animation: floatUp 0.8s ease;
  }
  @keyframes floatUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .splash-logo svg { width: 48px; height: 48px; }
  .splash-title { font-size: 32px; font-weight: 700; color: var(--text); margin-bottom: 8px; letter-spacing: 2px; }
  .splash-sub { font-size: 14px; color: var(--text-sub); margin-bottom: 48px; line-height: 1.8; }
  .splash-btn {
    background: var(--primary);
    color: #fff; border: none;
    padding: 16px 48px; border-radius: 28px;
    font-size: 16px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(124, 107, 192, 0.3);
  }
  .splash-btn:active { transform: scale(0.96); }

  /* ---- Nav Bar ---- */
  .nav-bar {
    display: flex; align-items: center;
    padding: 56px 20px 12px;
    background: var(--bg);
    position: sticky; top: 0; z-index: 100;
  }
  .nav-back {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 50%;
    transition: background 0.2s;
  }
  .nav-back:active { background: var(--border); }
  .nav-back svg { width: 20px; height: 20px; }
  .nav-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; color: var(--text); margin-right: 36px; }
  .nav-right { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

  /* ---- Home ---- */
  #page-home .nav-bar { padding-top: 52px; }
  .home-header {
    padding: 8px 20px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .home-header .brand { font-size: 24px; font-weight: 700; color: var(--text); }
  .home-header .brand span { color: var(--primary); }
  .home-add-btn {
    width: 40px; height: 40px;
    border-radius: 50%; background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.2s;
    box-shadow: 0 4px 12px rgba(124, 107, 192, 0.3);
  }
  .home-add-btn:active { transform: scale(0.92); }
  .home-add-btn svg { width: 22px; height: 22px; }

  .home-empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px; text-align: center;
  }
  .home-empty .illust {
    width: 120px; height: 120px;
    border-radius: 50%; background: var(--primary-light);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
  }
  .home-empty .illust svg { width: 60px; height: 60px; }
  .home-empty h3 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
  .home-empty p { font-size: 14px; color: var(--text-sub); line-height: 1.8; margin-bottom: 32px; }
  .home-empty .create-btn {
    background: var(--primary); color: #fff; border: none;
    padding: 14px 40px; border-radius: 24px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 16px rgba(124, 107, 192, 0.3);
    transition: transform 0.2s;
  }
  .home-empty .create-btn:active { transform: scale(0.96); }

  .memorial-list { padding: 0 20px 100px; }
  .memorial-card {
    background: var(--card); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 16px;
    cursor: pointer; transition: transform 0.2s;
    box-shadow: var(--shadow);
  }
  .memorial-card:active { transform: scale(0.98); }
  .memorial-card .mc-banner {
    height: 120px; position: relative;
    background: var(--primary-light);
    display: flex; align-items: center; justify-content: center;
  }
  .memorial-card .mc-banner.has-photo { background-size: cover; background-position: center; }
  .memorial-card .mc-banner .placeholder-paw {
    width: 56px; height: 56px; opacity: 0.3;
  }
  .memorial-card .mc-body { padding: 16px 18px; }
  .memorial-card .mc-name { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .memorial-card .mc-info { font-size: 13px; color: var(--text-sub); }
  .memorial-card .mc-info span { margin-right: 12px; }
  .memorial-card .mc-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .memorial-card .mc-tags { display: flex; gap: 6px; }
  .mc-tag {
    font-size: 11px; padding: 3px 8px; border-radius: 10px;
    background: var(--primary-light); color: var(--primary-dark);
  }
  .mc-tag.warm { background: var(--warm-light); color: #854f0b; }
  .mc-tag.green { background: var(--green-light); color: var(--green); }
  .memorial-card .mc-days { font-size: 12px; color: var(--text-light); }

  /* ---- Tab Bar ---- */
  .tab-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 390px; max-width: 100%;
    background: var(--card); border-top: 1px solid var(--border);
    display: flex; padding: 8px 0 24px; z-index: 200;
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; gap: 2px; cursor: pointer;
    transition: opacity 0.2s;
  }
  .tab-item svg { width: 24px; height: 24px; }
  .tab-item .tab-label { font-size: 10px; color: var(--text-light); }
  .tab-item.active .tab-label { color: var(--primary); }
  .tab-item.active svg path,
  .tab-item.active svg circle { stroke: var(--primary); }

  /* ---- Create Memorial ---- */
  #page-create { background: var(--bg); }
  .create-body { flex: 1; padding: 8px 20px 120px; overflow-y: auto; }

  .photo-upload {
    width: 140px; height: 140px; border-radius: 50%;
    background: var(--primary-light); margin: 20px auto 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.2s;
    border: 3px dashed var(--primary);
    overflow: hidden; position: relative;
  }
  .photo-upload:active { transform: scale(0.96); }
  .photo-upload.has-photo { border: none; background-size: cover; background-position: center; }
  .photo-upload svg { width: 36px; height: 36px; margin-bottom: 4px; }
  .photo-upload span { font-size: 12px; color: var(--primary); }
  .photo-preview {
    width: 100%; height: 100%; object-fit: cover;
    border-radius: 50%;
  }

  .form-group { margin-bottom: 20px; }
  .form-label { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; display: block; }
  .form-label .req { color: #e24b4a; margin-left: 2px; }
  .form-input {
    width: 100%; padding: 14px 16px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    font-size: 15px; color: var(--text); background: var(--card);
    transition: border 0.2s; outline: none;
  }
  .form-input:focus { border-color: var(--primary); }
  .form-input::placeholder { color: var(--text-light); }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }

  .species-picker { display: flex; gap: 10px; }
  .species-btn {
    flex: 1; padding: 14px; border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); background: var(--card);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer; transition: all 0.2s; font-size: 13px; color: var(--text-sub);
  }
  .species-btn svg { width: 28px; height: 28px; }
  .species-btn.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary-dark); }
  .species-btn:active { transform: scale(0.97); }

  .form-textarea {
    width: 100%; padding: 14px 16px; min-height: 80px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    font-size: 14px; color: var(--text); background: var(--card);
    outline: none; resize: none; font-family: inherit; line-height: 1.6;
  }
  .form-textarea:focus { border-color: var(--primary); }

  .create-submit {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 390px; max-width: 100%; padding: 16px 20px 32px;
    background: var(--bg); border-top: 1px solid var(--border);
  }
  .create-submit button {
    width: 100%; padding: 16px; border: none; border-radius: 28px;
    background: var(--primary); color: #fff;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform 0.2s;
    box-shadow: 0 4px 16px rgba(124, 107, 192, 0.3);
  }
  .create-submit button:active { transform: scale(0.97); }
  .create-submit button:disabled { background: var(--text-light); box-shadow: none; }

  /* ---- Memorial Detail ---- */
  #page-detail { background: var(--bg); }
  .detail-hero {
    height: 240px; position: relative;
    background: linear-gradient(160deg, var(--primary-light), var(--pink-light));
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .detail-hero.has-photo { background-size: cover; background-position: center; }
  .detail-hero::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
    background: linear-gradient(transparent, var(--bg));
  }
  .detail-hero-placeholder { width: 72px; height: 72px; opacity: 0.25; }
  .detail-hero-info {
    position: absolute; bottom: 20px; left: 20px; right: 20px; z-index: 2;
    text-align: center;
  }
  .detail-hero-info h2 { font-size: 24px; color: var(--text); margin-bottom: 4px; text-shadow: 0 1px 4px rgba(255,255,255,0.8); }
  .detail-hero-info p { font-size: 13px; color: var(--text-sub); text-shadow: 0 1px 4px rgba(255,255,255,0.8); }

  .detail-actions {
    display: flex; gap: 12px; padding: 0 20px; margin-top: -20px;
    position: relative; z-index: 3;
  }
  .action-btn {
    flex: 1; background: var(--card); border-radius: var(--radius-sm);
    padding: 14px 8px; display: flex; flex-direction: column;
    align-items: center; gap: 4px; cursor: pointer;
    transition: transform 0.2s; box-shadow: var(--shadow);
    border: none; font-family: inherit;
  }
  .action-btn:active { transform: scale(0.96); }
  .action-btn svg { width: 26px; height: 26px; }
  .action-btn span { font-size: 12px; color: var(--text-sub); }
  .action-btn .count { font-size: 11px; color: var(--primary); font-weight: 600; }

  .detail-section { padding: 24px 20px 0; }
  .section-title {
    font-size: 16px; font-weight: 600; color: var(--text);
    margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }
  .section-title .line { flex: 1; height: 1px; background: var(--border); }
  .section-title .add-link { font-size: 13px; color: var(--primary); font-weight: 500; cursor: pointer; }

  .pet-info-card {
    background: var(--card); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
  }
  .info-row { display: flex; padding: 8px 0; }
  .info-row .label { width: 80px; font-size: 13px; color: var(--text-sub); }
  .info-row .value { flex: 1; font-size: 14px; color: var(--text); }

  .tribute-wall {
    background: var(--warm-light); border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px; text-align: center;
    border: 1px solid #f5e6c8;
  }
  .tribute-wall .tw-title { font-size: 14px; color: #854f0b; margin-bottom: 12px; font-weight: 500; }
  .tribute-items { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tribute-item {
    width: 40px; height: 40px; border-radius: 50%;
    background: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 20px; animation: popIn 0.3s ease;
  }
  @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

  .timeline-empty {
    text-align: center; padding: 32px 20px;
  }
  .timeline-empty svg { width: 48px; height: 48px; opacity: 0.3; margin-bottom: 12px; }
  .timeline-empty p { font-size: 14px; color: var(--text-sub); margin-bottom: 16px; }
  .timeline-empty button {
    background: var(--primary-light); color: var(--primary-dark);
    border: none; padding: 10px 24px; border-radius: 20px;
    font-size: 13px; font-weight: 500; cursor: pointer;
  }

  .timeline-list { padding-bottom: 100px; }
  .timeline-item {
    display: flex; gap: 14px; margin-bottom: 16px;
    position: relative;
  }
  .timeline-item::before {
    content: ''; position: absolute; left: 15px; top: 40px; bottom: -16px;
    width: 2px; background: var(--border);
  }
  .timeline-item:last-child::before { display: none; }
  .timeline-dot {
    width: 32px; height: 32px; border-radius: 50%;
    flex-shrink: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .timeline-dot.flower { background: var(--pink-light); }
  .timeline-dot.candle { background: var(--warm-light); }
  .timeline-dot.memory { background: var(--primary-light); }
  .timeline-content {
    flex: 1; background: var(--card); border-radius: var(--radius-sm);
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .timeline-content .tc-date { font-size: 12px; color: var(--text-light); margin-bottom: 4px; }
  .timeline-content .tc-text { font-size: 14px; color: var(--text); line-height: 1.6; }
  .timeline-content .tc-img {
    width: 100%; height: 120px; border-radius: 8px;
    background-size: cover; background-position: center;
    margin-top: 8px;
  }
  .timeline-content .tc-delete {
    font-size: 12px; color: var(--text-light); margin-top: 8px;
    cursor: pointer; float: right;
  }

  /* ---- Add Memory ---- */
  #page-add-memory { background: var(--bg); }
  .add-memory-body { flex: 1; padding: 8px 20px 120px; }

  .memory-photo-upload {
    width: 100%; height: 160px; border-radius: var(--radius);
    background: var(--primary-light); margin-bottom: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; border: 2px dashed var(--primary);
    overflow: hidden; position: relative;
  }
  .memory-photo-upload.has-photo { border: none; background-size: cover; background-position: center; }
  .memory-photo-upload svg { width: 40px; height: 40px; margin-bottom: 6px; }
  .memory-photo-upload span { font-size: 13px; color: var(--primary); }

  /* ---- Tribute Modal ---- */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 300;
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.active { display: flex; animation: fadeIn 0.2s; }
  .modal-sheet {
    width: 390px; max-width: 100%;
    background: var(--card); border-radius: 24px 24px 0 0;
    padding: 24px 20px 40px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
  .modal-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 20px; color: var(--text); }
  .tribute-options { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 16px; }
  .tribute-option {
    width: 72px; display: flex; flex-direction: column;
    align-items: center; gap: 8px; cursor: pointer;
    transition: transform 0.2s;
  }
  .tribute-option:active { transform: scale(0.92); }
  .tribute-option .to-icon {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  .tribute-option .to-label { font-size: 12px; color: var(--text-sub); }
  .to-icon.flower { background: var(--pink-light); }
  .to-icon.candle { background: var(--warm-light); }
  .to-icon.incense { background: var(--green-light); }
  .to-icon.bell { background: var(--primary-light); }

  /* ---- Anniversary ---- */
  #page-anniversary { background: var(--bg); }
  .anniv-body { flex: 1; padding: 8px 20px 100px; }
  .anniv-card {
    background: var(--card); border-radius: var(--radius);
    padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .anniv-card .ac-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .anniv-card .ac-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .anniv-card .ac-switch {
    width: 44px; height: 26px; border-radius: 13px;
    background: var(--primary); position: relative; cursor: pointer;
    transition: background 0.3s;
  }
  .anniv-card .ac-switch.off { background: var(--text-light); }
  .anniv-card .ac-switch::after {
    content: ''; position: absolute; top: 3px; left: 21px;
    width: 20px; height: 20px; border-radius: 50%; background: #fff;
    transition: left 0.3s;
  }
  .anniv-card .ac-switch.off::after { left: 3px; }
  .anniv-card .ac-date { font-size: 13px; color: var(--text-sub); }
  .anniv-card .ac-days {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    font-size: 13px; color: var(--primary); font-weight: 500;
  }

  .anniv-add {
    background: var(--primary-light); border: 1.5px dashed var(--primary);
    border-radius: var(--radius); padding: 18px; text-align: center;
    cursor: pointer; transition: transform 0.2s;
  }
  .anniv-add:active { transform: scale(0.98); }
  .anniv-add span { font-size: 14px; color: var(--primary); font-weight: 500; }

  /* ---- Toast ---- */
  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.75); color: #fff;
    padding: 12px 24px; border-radius: 12px; font-size: 14px;
    z-index: 500; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; max-width: 300px; text-align: center;
  }
  .toast.show { opacity: 1; }

  /* ---- Floating petals ---- */
  .petal {
    position: fixed; width: 12px; height: 12px;
    pointer-events: none; z-index: 400;
    animation: petalFall 3s ease-in forwards;
  }
  @keyframes petalFall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(300px) rotate(360deg); }
  }

  /* ---- My Page ---- */
  #page-my { background: var(--bg); }
  .my-header {
    padding: 52px 20px 24px; text-align: center;
    background: linear-gradient(160deg, var(--primary-light), var(--bg));
  }
  .my-avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--primary); margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 24px; font-weight: 600;
  }
  .my-name { font-size: 18px; font-weight: 600; color: var(--text); }
  .my-stats { display: flex; justify-content: center; gap: 32px; margin-top: 16px; }
  .my-stat { text-align: center; }
  .my-stat .v { font-size: 20px; font-weight: 700; color: var(--primary); }
  .my-stat .l { font-size: 12px; color: var(--text-sub); }
  .my-menu { padding: 20px; }
  .my-menu-item {
    display: flex; align-items: center; gap: 12px;
    padding: 16px; background: var(--card); border-radius: var(--radius-sm);
    margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow);
    transition: transform 0.2s;
  }
  .my-menu-item:active { transform: scale(0.98); }
  .my-menu-item svg { width: 22px; height: 22px; }
  .my-menu-item .mm-text { flex: 1; font-size: 15px; color: var(--text); }
  .my-menu-item .mm-arrow { color: var(--text-light); font-size: 18px; }
</style>
</head>
<body>

<div class="phone-frame">

  <!-- ===== SPLASH ===== -->
  <div class="page active" id="page-splash">

<script>
  // ---- State ----
  let memorials = JSON.parse(localStorage.getItem('nn_memorials') || '[]');
  let currentMemorialId = null;
  let currentSpecies = 'dog';
  let createPhotoData = null;
  let memoryPhotoData = null;
  let photoTarget = null;

  // ---- Navigation ----
  function goPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const target = document.getElementById('page-' + page);
    if (target) {
      target.classList.add('active');
      target.scrollTop = 0;
    }
    window.scrollTo(0, 0);

    if (page === 'home') renderHome();
    if (page === 'detail') renderDetail();
    if (page === 'anniversary') renderAnniversary();
    if (page === 'my') renderMy();
    if (page === 'create') resetCreateForm();
    if (page === 'add-memory') resetMemoryForm();
  }

  // ---- Toast ----
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // ---- Photo Upload ----
  function triggerPhotoUpload(target) {
    photoTarget = target;
    document.getElementById('file-input').click();
  }

  document.getElementById('file-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const data = ev.target.result;
      if (photoTarget === 'create') {
        createPhotoData = data;
        const el = document.getElementById('create-photo');
        el.classList.add('has-photo');
        el.innerHTML = '<img class="photo-preview" src="' + data + '">';
      } else if (photoTarget === 'memory') {
        memoryPhotoData = data;
        const el = document.getElementById('memory-photo');
        el.classList.add('has-photo');
        el.style.backgroundImage = 'url(' + data + ')';
        el.innerHTML = '';
      }
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  // ---- Create Memorial ----
  function selectSpecies(el) {
    document.querySelectorAll('.species-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    currentSpecies = el.dataset.species;
  }

  function resetCreateForm() {
    createPhotoData = null;
    currentSpecies = 'dog';
    document.getElementById('create-photo').classList.remove('has-photo');
    document.getElementById('create-photo').innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#7c6bc0" stroke-width="2" stroke-linecap="round"/></svg><span>上传宠物照片</span>';
    document.getElementById('create-name').value = '';
    document.getElementById('create-breed').value = '';
    document.getElementById('create-birthday').value = '';
    document.getElementById('create-passday').value = '';
    document.getElementById('create-words').value = '';
    document.querySelectorAll('.species-btn').forEach((b, i) => {
      b.classList.toggle('active', i === 0);
    });
  }

  function saveMemorial() {
    const name = document.getElementById('create-name').value.trim();
    if (!name) { toast('请给它起个名字'); return; }

    const memorial = {
      id: Date.now(),
      name: name,
      species: currentSpecies,
      breed: document.getElementById('create-breed').value.trim(),
      birthday: document.getElementById('create-birthday').value,
      passday: document.getElementById('create-passday').value,
      words: document.getElementById('create-words').value.trim(),
      photo: createPhotoData,
      tributes: { flower: 0, candle: 0, incense: 0 },
      tributeLog: [],
      memories: [],
      anniversaries: [],
      createdAt: new Date().toISOString()
    };

    // Auto-generate anniversaries
    if (memorial.passday) {
      const d = new Date(memorial.passday);
      memorial.anniversaries = [
        { id: 1, name: name + '离开1个月', date: addDays(d, 30), enabled: true },
        { id: 2, name: name + '离开100天', date: addDays(d, 100), enabled: true },
        { id: 3, name: name + '离开1周年', date: addDays(d, 365), enabled: true },
        { id: 4, name: name + '生日', date: memorial.birthday || '', enabled: !!memorial.birthday }
      ];
    }

    memorials.unshift(memorial);
    saveData();
    currentMemorialId = memorial.id;
    toast('纪念馆已创建');
    setTimeout(() => goPage('detail'), 800);
  }

  function addDays(date, days) {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d.toISOString().split('T')[0];
  }

  // ---- Home ----
  function renderHome() {
    const list = document.getElementById('memorial-list');
    if (memorials.length === 0) {
      list.innerHTML = `
        <div class="home-empty">
          <div class="illust">
            <svg viewBox="0 0 60 60" fill="none">
              <ellipse cx="30" cy="38" rx="16" ry="12" fill="#7c6bc0" opacity="0.3"/>
              <circle cx="24" cy="34" r="2" fill="#7c6bc0"/>
              <circle cx="36" cy="34" r="2" fill="#7c6bc0"/>
              <path d="M18 20c-3 0-5 2-5 5s2 5 5 5M42 20c3 0 5 2 5 5s-2 5-5 5" stroke="#7c6bc0" stroke-width="2" stroke-linecap="round" fill="none"/>
            </svg>
          </div>
          <h3>还没有纪念馆</h3>
          <p>TA去了星球，爱还留在这里<br>为离去的毛球建一颗专属星球</p>
          <button class="create-btn" onclick="goPage('create')">创建第一个纪念馆</button>
        </div>
      `;
      return;
    }

    list.innerHTML = memorials.map(m => {
      const days = m.passday ? Math.floor((Date.now() - new Date(m.passday).getTime()) / 86400000) : 0;
      const speciesText = m.species === 'dog' ? '狗狗' : m.species === 'cat' ? '猫咪' : '其他';
      const bgStyle = m.photo ? `background-image: url(${m.photo})` : '';
      const heroClass = m.photo ? 'mc-banner has-photo' : 'mc-banner';
      const placeholder = m.photo ? '' : '<svg class="placeholder-paw" viewBox="0 0 56 56" fill="none"><ellipse cx="28" cy="36" rx="12" ry="9" fill="#7c6bc0" opacity="0.3"/><circle cx="20" cy="24" r="4" fill="#7c6bc0" opacity="0.3"/><circle cx="36" cy="24" r="4" fill="#7c6bc0" opacity="0.3"/><circle cx="14" cy="32" r="3" fill="#7c6bc0" opacity="0.3"/><circle cx="42" cy="32" r="3" fill="#7c6bc0" opacity="0.3"/></svg>';

      return `
        <div class="memorial-card" onclick="openDetail(${m.id})">
          <div class="${heroClass}" style="${bgStyle}">${placeholder}</div>
          <div class="mc-body">
            <div class="mc-name">${esc(m.name)}</div>
            <div class="mc-info">
              <span>${speciesText}${m.breed ? ' · ' + esc(m.breed) : ''}</span>
              ${m.passday ? `<span>离开 ${days} 天</span>` : ''}
            </div>
            <div class="mc-footer">
              <div class="mc-tags">
                <span class="mc-tag">🌸 ${m.tributes.flower}</span>
                <span class="mc-tag warm">🕯️ ${m.tributes.candle}</span>
                <span class="mc-tag green">🙏 ${m.tributes.incense}</span>
              </div>
              <div class="mc-days">${m.memories.length} 条回忆</div>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function openDetail(id) {
    currentMemorialId = id;
    goPage('detail');
  }

  // ---- Detail ----
  function renderDetail() {
    const m = memorials.find(x => x.id === currentMemorialId);
    if (!m) { goPage('home'); return; }

    // Hero
    const hero = document.getElementById('detail-hero');
    const heroInfo = document.getElementById('detail-hero-info');
    if (m.photo) {
      hero.classList.add('has-photo');
      hero.style.backgroundImage = `url(${m.photo})`;
      heroInfo.innerHTML = `<h2 style="color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.6)">${esc(m.name)}</h2><p style="color:rgba(255,255,255,0.9);text-shadow:0 2px 8px rgba(0,0,0,0.6)">${m.breed || ''}</p>`;
    } else {
      hero.classList.remove('has-photo');
      hero.style.backgroundImage = '';
      heroInfo.innerHTML = `<h2>${esc(m.name)}</h2><p>${m.breed || ''}</p>`;
    }

    // Info card
    const speciesText = m.species === 'dog' ? '狗狗' : m.species === 'cat' ? '猫咪' : '其他';
    let infoHtml = '<div class="info-row"><div class="label">种类</div><div class="value">' + speciesText + '</div></div>';
    if (m.breed) infoHtml += '<div class="info-row"><div class="label">品种</div><div class="value">' + esc(m.breed) + '</div></div>';
    if (m.birthday) infoHtml += '<div class="info-row"><div class="label">出生</div><div class="value">' + formatDate(m.birthday) + '</div></div>';
    if (m.passday) {
      const days = Math.floor((Date.now() - new Date(m.passday).getTime()) / 86400000);
      infoHtml += '<div class="info-row"><div class="label">离开</div><div class="value">' + formatDate(m.passday) + '（已 ' + days + ' 天）</div></div>';
    }
    if (m.words) infoHtml += '<div class="info-row" style="border-top:1px solid var(--border);margin-top:8px;padding-top:12px"><div class="label" style="width:auto;flex:1;font-size:14px;line-height:1.7;color:var(--text)">' + esc(m.words) + '</div></div>';
    document.getElementById('pet-info-card').innerHTML = infoHtml;

    // Counts
    document.getElementById('count-flower').textContent = m.tributes.flower;
    document.getElementById('count-candle').textContent = m.tributes.candle;
    document.getElementById('count-incense').textContent = m.tributes.incense;
    document.getElementById('count-memory').textContent = m.memories.length;

    // Tribute wall
    const tw = document.getElementById('tribute-wall');
    const twItems = document.getElementById('tribute-items');
    if (m.tributeLog.length > 0) {
      tw.style.display = 'block';
      const recent = m.tributeLog.slice(-12).reverse();
      const icons = { flower: '🌸', candle: '🕯️', incense: '🙏' };
      twItems.innerHTML = recent.map(t => `<div class="tribute-item">${icons[t.type]}</div>`).join('');
    } else {
      tw.style.display = 'none';
    }

    // Timeline
    const tl = document.getElementById('timeline-list');
    if (m.memories.length === 0) {
      tl.innerHTML = `
        <div class="timeline-empty">
          <svg viewBox="0 0 48 48" fill="none"><rect x="8" y="10" width="32" height="30" rx="4" stroke="#888780" stroke-width="2"/><path d="M16 10V6M32 10V6M8 20h32" stroke="#888780" stroke-width="2" stroke-linecap="round"/></svg>
          <p>还没有回忆记录<br>添加第一段和它的故事吧</p>
          <button onclick="goPage('add-memory')">添加回忆</button>
        </div>
      `;
    } else {
      const sorted = [...m.memories].sort((a, b) => new Date(b.date) - new Date(a.date));
      const dotIcons = { flower: '🌸', candle: '🕯️', incense: '🙏', memory: '📝' };
      tl.innerHTML = sorted.map(mem => `
        <div class="timeline-item">
          <div class="timeline-dot ${mem.type || 'memory'}">${dotIcons[mem.type || 'memory']}</div>
          <div class="timeline-content">
            <div class="tc-date">${formatDate(mem.date)}</div>
            <div class="tc-text">${esc(mem.text)}</div>
            ${mem.photo ? `<div class="tc-img" style="background-image:url(${mem.photo})"></div>` : ''}
            <div class="tc-delete" onclick="deleteMemory(${mem.id})">删除</div>
          </div>
        </div>
      `).join('');
    }
  }

  // ---- Tribute ----
  function openTributeModal() {
    document.getElementById('tribute-modal').classList.add('active');
  }
  function closeTributeModal() {
    document.getElementById('tribute-modal').classList.remove('active');
  }

  function doTribute(type) {
    const m = memorials.find(x => x.id === currentMemorialId);
    if (!m) return;
    m.tributes[type]++;
    m.tributeLog.push({ type, time: new Date().toISOString() });
    saveData();
    renderDetail();
    showToastForTribute(type);
    spawnPetals(type);
  }

  function showToastForTribute(type) {
    const msgs = { flower: '已为它献上一朵花', candle: '已为它点亮一盏烛', incense: '已为它上一炷香' };
    toast(msgs[type] || '祭奠完成');
  }

  function spawnPetals(type) {
    const colors = { flower: ['#f4c0d1', '#ed93b1', '#d4537e'], candle: ['#fac775', '#ef9f27', '#f5e6c8'], incense: ['#5dcaa5', '#1d9e75', '#9fe1cb'] };
    const palette = colors[type] || colors.flower;
    for (let i = 0; i < 8; i++) {
      setTimeout(() => {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.left = (Math.random() * 350 + 20) + 'px';
        petal.style.top = '40%';
        petal.style.background = palette[Math.floor(Math.random() * palette.length)];
        petal.style.borderRadius = '50%';
        petal.style.animationDuration = (2 + Math.random() * 2) + 's';
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 4000);
      }, i * 100);
    }
  }

  // ---- Memory ----
  function resetMemoryForm() {
    memoryPhotoData = null;
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('memory-date').value = today;
    document.getElementById('memory-text').value = '';
    const el = document.getElementById('memory-photo');
    el.classList.remove('has-photo');
    el.style.backgroundImage = '';
    el.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="#7c6bc0" stroke-width="2"/><circle cx="8.5" cy="10.5" r="1.5" fill="#7c6bc0"/><path d="M3 16l5-5 4 4 3-3 6 6" stroke="#7c6bc0" stroke-width="2" stroke-linejoin="round"/></svg><span>添加照片（可选）</span>';
  }

  function saveMemory() {
    const text = document.getElementById('memory-text').value.trim();
    if (!text) { toast('请写下这段回忆'); return; }

    const m = memorials.find(x => x.id === currentMemorialId);
    if (!m) return;

    const memory = {
      id: Date.now(),
      type: 'memory',
      date: document.getElementById('memory-date').value || new Date().toISOString().split('T')[0],
      text: text,
      photo: memoryPhotoData
    };
    m.memories.push(memory);
    saveData();
    toast('回忆已保存');
    setTimeout(() => goPage('detail'), 800);
  }

  function deleteMemory(id) {
    const m = memorials.find(x => x.id === currentMemorialId);
    if (!m) return;
    m.memories = m.memories.filter(mem => mem.id !== id);
    saveData();
    renderDetail();
    toast('已删除');
  }

  // ---- Anniversary ----
  function renderAnniversary() {
    const body = document.getElementById('anniv-body');
    if (memorials.length === 0) {
      body.innerHTML = '<div class="timeline-empty" style="padding-top:60px"><p>还没有纪念日提醒<br>创建纪念馆后会自动生成</p></div>';
      return;
    }

    let html = '';
    memorials.forEach(m => {
      if (!m.anniversaries || m.anniversaries.length === 0) return;
      html += `<div style="font-size:13px;color:var(--text-sub);margin:8px 0 12px;font-weight:500">${esc(m.name)}的纪念日</div>`;
      m.anniversaries.forEach(a => {
        const days = a.date ? Math.ceil((new Date(a.date) - new Date(new Date().toISOString().split('T')[0])) / 86400000) : null;
        const daysText = days === null ? '日期未设置' : days < 0 ? `已过 ${Math.abs(days)} 天` : days === 0 ? '就是今天' : `还有 ${days} 天`;
        html += `
          <div class="anniv-card">
            <div class="ac-header">
              <div class="ac-name">${esc(a.name)}</div>
              <div class="ac-switch ${a.enabled ? '' : 'off'}" onclick="toggleAnniv(${m.id}, ${a.id})"></div>
            </div>
            <div class="ac-date">${a.date ? formatDate(a.date) : '未设置'}</div>
            <div class="ac-days">${daysText}</div>
          </div>
        `;
      });
    });

    if (!html) {
      html = '<div class="timeline-empty" style="padding-top:60px"><p>还没有纪念日提醒</p></div>';
    }

    body.innerHTML = html;
  }

  function toggleAnniv(mid, aid) {
    const m = memorials.find(x => x.id === mid);
    if (!m) return;
    const a = m.anniversaries.find(x => x.id === aid);
    if (a) {
      a.enabled = !a.enabled;
      saveData();
      renderAnniversary();
      toast(a.enabled ? '已开启提醒' : '已关闭提醒');
    }
  }

  // ---- My ----
  function renderMy() {
    document.getElementById('my-count').textContent = memorials.length;
    let totalTribute = 0;
    let totalMemory = 0;
    memorials.forEach(m => {
      totalTribute += m.tributes.flower + m.tributes.candle + m.tributes.incense;
      totalMemory += m.memories.length;
    });
    document.getElementById('my-tribute').textContent = totalTribute;
    document.getElementById('my-memory').textContent = totalMemory;
  }

  // ---- Utils ----
  function saveData() {
    localStorage.setItem('nn_memorials', JSON.stringify(memorials));
  }

  function esc(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  }

  // Close modal on overlay click
  document.getElementById('tribute-modal').addEventListener('click', function(e) {
    if (e.target === this) closeTributeModal();
  });

  // Init
  renderHome();
</script>
</body>
</html>
