document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"afd6c961-de36-419e-b200-ccfac7600e57\"><\u002Fscript>\n<\u002Fhead>\n\n<body>\n<x-dc>\n<helmet>\n  <style>/* ============================================================\n   FONTS — DP Agent\n   The product ships NO custom webfonts. It uses a warm system\n   stack: Georgia for serif headlines, the native UI sans for\n   body, and the platform monospace for code. This keeps the\n   \"literary salon\" feel without any font binaries to load.\n\n   CJK glyphs resolve through the generic system mechanisms:\n   -apple-system / BlinkMacSystemFont map to PingFang SC on macOS,\n   system-ui / Microsoft YaHei / Hiragino cover Windows & others,\n   and the generic serif/sans-serif keywords pick the OS CJK face.\n   We therefore do NOT name proprietary, non-shippable CJK families\n   (e.g. PingFang SC / Songti SC) explicitly — the system stack\n   already renders them, with no missing-@font-face binaries.\n\n   (Aspirationally the brand references a custom \"Anthropic Serif\".\n    Georgia is the chosen, universally-available substitute — see\n    readme.md › VISUAL FOUNDATIONS. No @font-face is needed.)\n   ============================================================ */\n\n:root {\n  /* Serif — headlines, the \"DP Agent\" wordmark. Single weight (500). */\n  --font-serif: Georgia, \"Times New Roman\", serif;\n\n  /* Sans — all UI, body, labels, buttons. CJK resolves via the system stack\n     (the browser's automatic CJK fallback handles PingFang/YaHei/etc.). */\n  --font-sans: -apple-system, BlinkMacSystemFont, \"Segoe UI\", system-ui, sans-serif;\n\n  /* Mono — code, project numbers, terminal-style figures. */\n  --font-mono: ui-monospace, \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   COLORS — DP Agent\n   A deliberately WARM palette. Every neutral carries a\n   yellow-brown undertone; there are no cool blue-grays.\n   Base hex values mirror src/theme.ts exactly.\n   ============================================================ */\n\n:root {\n  /* ---- Brand ---- */\n  --terracotta: #c96442;   /* core brand — primary CTAs, the serif wordmark */\n  --coral: #d97757;        /* lighter brand variant — hover, accents on dark */\n\n  /* ---- Surfaces (light) ---- */\n  --parchment: #f5f4ed;    /* primary page background — warm aged paper */\n  --ivory: #faf9f5;        /* elevated surface — cards, nav, rails */\n  --white: #ffffff;        /* assistant message bubbles, max contrast */\n  --warm-sand: #e8e6dc;    /* secondary buttons, chips, active session */\n\n  /* ---- Surfaces (dark) ---- */\n  --near-black: #141413;   /* primary text + dark page background */\n  --dark-surface: #30302e; /* dark containers, charcoal buttons */\n\n  /* ---- Text / neutrals (all warm) ---- */\n  --charcoal-warm: #4d4c48; /* dark-on-light body, button text */\n  --olive-gray: #5e5d59;    /* secondary body text */\n  --stone-gray: #87867f;    /* tertiary text, metadata, placeholders */\n  --dark-warm: #3d3d3a;     /* emphasized secondary text */\n  --warm-silver: #b0aea5;   /* text on dark surfaces, timestamps */\n\n  /* ---- Borders ---- */\n  --border-cream: #f0eee6;  /* gentlest light border — nav, rails, dividers */\n  --border-warm: #e8e6dc;   /* prominent light border — cards, inputs */\n  --border-dark: #30302e;   /* border on dark surfaces */\n\n  /* ---- Rings (focus / hover halos) ---- */\n  --ring-warm: #d1cfc5;     /* sand button ring */\n  --ring-deep: #c2c0b6;     /* input focus, pressed states */\n\n  /* ---- Semantic ---- */\n  --crimson: #b53333;       /* errors, destructive — warm red */\n  --focus-blue: #3898ec;    /* the ONLY cool color — accessibility focus only */\n\n  /* ---- Workflow / status accents (used sparingly in tinted chips) ---- */\n  --info-blue-bg: #eff6ff;   --info-blue-fg n JSON.parse(localStorage.getItem('zhh_'+k)) || def; } catch { return def; } }\n  saveJSON(k, v)   { try { localStorage.setItem('zhh_'+k, JSON.stringify(v)); } catch {} }\n\n  groupBy(items, key) {\n    const map = new Map();\n    items.forEach(item => {\n      const k = item[key];\n      if (!map.has(k)) map.set(k, []);\n      map.get(k).push(item);\n    });\n    return [...map.entries()].map(([name, list]) => ({ name, count: list.length, items: list }));\n  }\n\n  state = {\n    tab: 'home',\n    url: 'https://bj.lianjia.com/ershoufang/c1111027378261/',\n    scanning: false,\n    results: null,\n    selected: {},\n    priceFilter: '', areaFilter: '', orientFilter: '', renovFilter: '',\n    homeSchemeId: 'default',\n    analysisActive: false,\n    favSale: this.loadJSON('favSale', []),\n    favSaleSelected: {},\n    schemes: this.loadJSON('schemes', [{ id:'default', name:'默认方案' }, { id:'invest', name:'自住优先' }]),\n    activeScheme: 'default',\n    weights: this.loadJSON('weights', null) || {\n      metro:    { label:'地铁距离', max:15, w:20 },\n      bathroom: { label:'干湿分离', max:15, w:15 },\n      light:    { label:'采光',     max:20, w:20 },\n      renov:    { label:'装修质量', max:20, w:20 },\n      floor:    { label:'楼层',     max:10, w:10 },\n      price:    { label:'性价比',   max:10, w:10 },\n      layout:   { label:'户型',     max:10, w:5  },\n    },\n    showWeights: false,\n    scoreSelected: {},\n    collapsedGroups: {},\n    showCompare: false,\n    compareItems: [],\n  };\n\n  computeScore(prop, weights) {\n    let n = 0, d = 0;\n    Object.entries(weights).forEach(([k, {max, w}]) => { n += (prop.scores[k]||0)*w; d += max*w; });\n    return d > 0 ? Math.round(n/d*100) : 0;\n  }\n\n  applyFilters(list) {\n    const { priceFilter:pf, areaFilter:af, orientFilter:of, renovFilter:rf } = this.state;\n    return list.filter(p => {\n      if (pf==='lt200'   && p.price>=200)                return false;\n      if (pf==='200-300' && (p.price<200||p.price>=300)) return false;\n      if (pf==='300-500' && (p.price<300||p.price>=500)) return false;\n      if (pf==='gt500'   && p.price<500)                 return false;\n      if (af==='lt50'    && p.area>=50)                  return false;\n      if (af==='50-70'   && (p.area<50||p.area>=70))     return false;\n      if (af==='70-100'  && (p.area<70||p.area>=100))    return false;\n      if (af==='gt100'   && p.area<100)                  return false;\n      if (of==='other')  { if (p.orientation.includes('南')||p.orientation.includes('东')) return false; }\n      else if (of==='南北') { if (!p.orientation.includes('南')||!p.orientation.includes('北')) return false; }\n      else if (of && !p.orientation.includes(of)) return false;\n      if (rf && p.renovation!==rf) return false;\n      return true;\n    });\n  }\n\n  doScan() {\n    if (this.state.scanning) return;\n    this.setState({ scanning:true, results:null, selected:{}, analysisActive:false });\n    setTimeout(() => this.setState({ scanning:false, results:[...this.MOCK] }), 1600);\n  }\n\n  addToFav(prop) {\n    if (this.state.favSale.find(p=>p.id===prop.id)) return;\n    const d = new Date();\n    const dateStr = `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;\n    const nf = [...this.state.favSale, { ...prop, favDate:dateStr }];\n    this.setState({ favSale:nf });\n    this.saveJSON('favSale', nf);\n  }\n\n  removeFromFav(id) {\n    const nf = this.state.favSale.filter(p=>p.id!==id);\n    const sel = { ...this.state.favSaleSelected }; delete sel[id];\n    this.setState({ favSale:nf, favSaleSelected:sel });\n    this.saveJSON('favSale', nf);\n  }\n\n  makeRadar(scores, weights, size, fills, strokes) {\n    const dims = Object.keys(weights);\n    const n = dims.length;\n    const cx = size/2, cy = size/2, r = size*0.35;\n    const ang = i => Math.PI*2*i/n - Math.PI/2;\n    const pt  = (i,p) => [cx+r*p*Math.cos(ang(i)), cy+r*p*Math.sin(ang(i))];\n\n    const rings = [.33,.66,1].map(p => React.createElement('polygon',{\n      key:'r'+p, points:dims.map((_,i)=>pt(i,p).join(',')).join(' '),\n      fill:'none', stroke:'#e8e6dc', strokeWidth:size>100?1:.7\n    }));\n    const axes = dims.map((_,i)=>{\n      const [x2,y2]=pt(i,1);\n      return React.createElement('line',{key:'a'+i,x1:cx,y1:cy,x2,y2,stroke:'#e8e6dc',strokeWidth:size>100?1:.7});\n    });\n    const polys = (fills||['rgba(201,100,66,.15)']).map((fill,pi)=>{\n      const stroke = (strokes||['#c96442'])[pi]||'#c96442';\n      const pts = dims.map((dim,i)=>{\n        const s=(Array.isArray(scores)?scores[pi]:scores)[dim]||0, mx=weights[dim]?.max||10;\n        return pt(i,Math.min(s/mx,1)).join(',');\n      }).join(' ');\n      const dots = dims.map((dim,i)=>{\n        const s=(Array.isArray(scores)?scores[pi]:scores)[dim]||0, mx=weights[dim]?.max||10;\n        const [dx,dy]=pt(i,Math.min(s/mx,1));\n        return React.createElement('circle',{key:'d'+pi+dim,cx:dx,cy:dy,r:size>100?3:2,fill:stroke});\n      });\n      return [React.createElement('polygon',{key:'poly'+pi,points:pts,fill,stroke,strokeWidth:size>100?2:1.5,strokeLinejoin:'round'}),...dots];\n    }).flat();\n    const labels = size>60 ? dims.map((dim,i)=>{\n      const [lx,ly]=pt(i,1.32);\n      return React.createElement('text',{key:'l'+dim,x:lx,y:ly,textAnchor:'middle',dominantBaseline:'middle',fontSize:size*0.056,fill:'#5e5d59',fontFamily:'system-ui'},weights[dim]?.label||dim);\n    }) : [];\n    return React.createElement('svg',{viewBox:`0 0 ${size} ${size}`,style:{width:size+'px',height:size+'px',display:'block'}},...rings,...axes,...polys,...labels);\n  }\n\n  renderVals() {\n    const s = this.state, w = s.weights;\n\n    const tabBase = { display:'flex', alignItems:'center', gap:6, padding:'0 22px', height:'100%', background:'none', border:'none', fontSize:14, cursor:'pointer', borderBottom:'2px solid transparent', marginBottom:-1, whiteSpace:'nowrap', transition:'color .12s', fontFamily:'inherit' };\n    const mk = a => ({ ...tabBase, color:a?'#c96442':'#5e5d59', borderBottomColor:a?'#c96442':'transparent', fontWeight:a?600:400 });\n    const cntBadge = { background:'#c96442', color:'#faf9f5', fontSize:10, fontWeight:600, borderRadius:10, padding:'1px 6px', minWidth:18, textAlign:'center', lineHeight:'16px' };\n    const selStyle = { padding:'7px 10px', background:'var(--ivory)', border:'1px solid var(--border-warm)', borderRadius:7, fontSize:13, color:'var(--near-black)', cursor:'pointer', outline:'none', fontFamily:'inherit' };\n    const renovBadge = r => r==='精装'\n      ? {padding:'3px 8px',background:'#ecfdf5',color:'#047857',border:'1px solid #a7f3d0',borderRadius:5,fontSize:11,fontWeight:500}\n      : r==='简装'\n      ? {padding:'3px 8px',background:'#fffbeb',color:'#b45309',border:'1px solid #fde68a',borderRadius:5,fontSize:11,fontWeight:500}\n      : {padding:'3px 8px',background:'var(--warm-sand)',color:'var(--olive-gray)',border:'1px solid var(--border-warm)',borderRadius:5,fontSize:11};\n\n    /* filters */\n    const filterCount = [s.priceFilter,s.areaFilter,s.orientFilter,s.renovFilter].filter(Boolean).length;\n    const raw = s.results || [];\n    const fRaw = this.applyFilters(raw);\n    const avgUnit = raw.filter(p=>p.area>0).length\n      ? Math.round(raw.filter(p=>p.area>0).reduce((a,p)=>a+p.price*10000/p.area,0)/raw.filter(p=>p.area>0).length).toLocaleString() : '—';\n\n    /* analysis */\n    const analysisWeights = w;\n    const analysisScheme = s.schemes.find(sc=>sc.id===s.homeSchemeId);\n    const activeAnalysisSchemeName = analysisScheme?.name || '默认方案';\n\n    /* flat results with computed fields */\n    const flatResults = fRaw.map(p => {\n      const aScore = (s.analysisActive && s.homeSchemeId) ? this.computeScore(p, analysisWeights) : null;\n      return {\n        ...p,\n        unitPrice: p.area>0 ? Math.round(p.price*10000/p.area).toLocaleString() : '—',\n        isSelected: !!s.selected[p.id],\n        inFav: s.favSale.some(f=>f.id===p.id),\n        renovBadge: renovBadge(p.renovation),\n        hasAnalysisScore: aScore !== null,\n        analysisScore: aScore,\n        analysisBarSty: aScore !== null ? {height:'100%',width:aScore+'%',background:'#c96442',borderRadius:2,transition:'width .3s'} : {},\n        toggleSel: ()=>this.setState(prev=>{const sel={...prev.selected};sel[p.id]?delete sel[p.id]:(sel[p.id]=true);return{selected:sel};}),\n        favAction: ()=>{ if(!s.favSale.find(f=>f.id===p.id)) this.addToFav(p); },\n        favLabel: s.favSale.some(f=>f.id===p.id) ? '✓ 已收藏' : '收藏',\n        favBtnSty: s.favSale.some(f=>f.id===p.id)\n          ? {padding:'5px 10px',background:'var(--warm-sand)',color:'var(--olive-gray)',border:'1px solid var(--border-warm)',borderRadius:6,fontSize:12,cursor:'default'}\n          : {padding:'5px 10px',background:'var(--terracotta)',color:'var(--ivory)',border:'none',borderRadius:6,fontSize:12,cursor:'pointer'},\n      };\n    });\n\n    /* Sort within community by analysis score when active */\n    const sortedResults = s.analysisActive\n      ? [...flatResults].sort((a,b)=>((b.analysisScore||0)-(a.analysisScore||0)))\n      : flatResults;\n\n    const groupedResults = this.groupBy(sortedResults, 'community').map(grp => {\n      const key = 'home_'+grp.name;\n      const isCollapsed = !!s.collapsedGroups[key];\n      return { ...grp, isCollapsed, collapseIcon: isCollapsed ? '▶' : '▼',\n        toggleCollapse: () => this.setState(prev => { const cg={...prev.collapsedGroups}; cg[key] ? delete cg[key] : (cg[key]=true); return {collapsedGroups:cg}; }),\n        displayItems: isCollapsed ? [] : grp.items };\n    });\n\n    const selectedCount = Object.keys(s.selected).length;\n    const allSelected = fRaw.length>0 && fRaw.every(p=>s.selected[p.id]);\n\n    /* favorites */\n    const fFavSale = this.applyFilters(s.favSale);\n    const favAvgUnit = s.favSale.filter(p=>p.area>0).length\n      ? Math.round(s.favSale.filter(p=>p.area>0).reduce((a,p)=>a+p.price*10000/p.area,0)/s.favSale.filter(p=>p.area>0).length).toLocaleString() : '—';\n\n    const flatFavSale = fFavSale.map(p => {\n      const sc = this.computeScore(p, w);\n      return {\n        ...p,\n        unitPrice: p.area>0 ? Math.round(p.price*10000/p.area).toLocaleString() : '—',\n        isSelected: !!s.favSaleSelected[p.id],\n        score: sc, scoreLabel: sc>0 ? sc+' 分' : '—',\n        scoreTagSty: sc>0 ? {fontWeight:600,color:'#c96442',fontSize:13} : {color:'var(--stone-gray)',fontSize:13},\n        toggleSel: ()=>this.setState(prev=>{const sel={...prev.favSaleSelected};sel[p.id]?delete sel[p.id]:(sel[p.id]=true);return{favSaleSelected:sel};}),\n        removeFav: ()=>this.removeFromFav(p.id),\n      };\n    });\n    const groupedFavSale = this.groupBy(flatFavSale, 'community').map(grp => {\n      const key = 'sale_'+grp.name;\n      const isCollapsed = !!s.collapsedGroups[key];\n      return { ...grp, isCollapsed, collapseIcon: isCollapsed ? '▶' : '▼',\n        toggleCollapse: () => this.setState(prev => { const cg={...prev.collapsedGroups}; cg[key] ? delete cg[key] : (cg[key]=true); return {collapsedGroups:cg}; }),\n        displayItems: isCollapsed ? [] : grp.items };\n    });\n\n    const favSelCount = Object.keys(s.favSaleSelected).length;\n    const allFavSel = flatFavSale.length>0 && flatFavSale.every(p=>p.isSelected);\n\n    /* scoring */\n    const schemeBtns = s.schemes.map(sc => ({\n      id:sc.id, label:sc.name,\n      onClick:()=>this.setState({activeScheme:sc.id}),\n      style: sc.id===s.activeScheme\n        ? {padding:'8px 18px',background:'var(--terracotta)',color:'var(--ivory)',border:'none',borderRadius:8,fontSize:13,fontWeight:500,cursor:'pointer'}\n        : {padding:'8px 18px',background:'var(--ivory)',color:'var(--olive-gray)',border:'1px solid var(--border-warm)',borderRadius:8,fontSize:13,cursor:'pointer'},\n    }));\n\n    const totalWeight = Object.values(w).reduce((a,v)=>a+v.w,0);\n    const wtOk = Math.abs(totalWeight-100)<1;\n    const totalWtBadge = {fontSize:12,fontWeight:600,color:wtOk?'#047857':'#b45309',background:wtOk?'#ecfdf5':'#fffbeb',padding:'2px 8px',borderRadius:5};\n    const weightDims = Object.entries(w).map(([key,v])=>({\n      key,...v,\n      onChange:e=>{const nw={...this.state.weights,[key]:{...this.state.weights[key],w:+e.target.value}};this.setState({weights:nw});this.saveJSON('weights',nw);}\n    }));\n\n    const rankSty = i => [{display:'inline-flex',alignItems:'center',justifyContent:'center',width:22,height:22,background:'#c96442',color:'#fff',borderRadius:'50%',fontSize:11,fontWeight:700},{display:'inline-flex',alignItems:'center',justifyContent:'center',width:22,height:22,background:'#b45309',color:'#fff',borderRadius:'50%',fontSize:11,fontWeight:700},{display:'inline-flex',alignItems:'center',justifyContent:'center',width:22,height:22,background:'#5e5d59',color:'#fff',borderRadius:'50%',fontSize:11,fontWeight:700}][i] || {display:'inline-flex',alignItems:'center',justifyContent:'center',width:22,height:22,background:'var(--warm-sand)',color:'var(--olive-gray)',borderRadius:'50%',fontSize:11};\n\n    const flatScored = [...s.favSale].map(p=>({...p,score:this.computeScore(p,w)}))\n      .sort((a,b)=>b.score-a.score)\n      .map((p,i)=>({\n        ...p, rank:i+1, rankSty:rankSty(i),\n        unitPrice: p.area>0?Math.round(p.price*10000/p.area).toLocaleString():'—',\n        isSelected:!!s.scoreSelected[p.id],\n        barSty:{height:'100%',width:p.score+'%',background:'#c96442',borderRadius:3,transition:'width .3s ease'},\n        miniRadar: this.makeRadar(p.scores, w, 54),\n        toggleSel:()=>this.setState(prev=>{const sel={...prev.scoreSelected};sel[p.id]?delete sel[p.id]:(sel[p.id]=true);return{scoreSelected:sel};}),\n        removeScore:()=>this.removeFromFav(p.id),\n      }));\n    const groupedScoredProps = this.groupBy(flatScored, 'community').map(grp => {\n      const key = 'score_'+grp.name;\n      const isCollapsed = !!s.collapsedGroups[key];\n      return { ...grp, isCollapsed, collapseIcon: isCollapsed ? '▶' : '▼',\n        toggleCollapse: () => this.setState(prev => { const cg={...prev.collapsedGroups}; cg[key] ? delete cg[key] : (cg[key]=true); return {collapsedGroups:cg}; }),\n        displayItems: isCollapsed ? [] : grp.items };\n    });\n\n    const scoreSelCount = Object.keys(s.scoreSelected).length;\n    const allScoreSel = flatScored.length>0 && flatScored.every(p=>p.isSelected);\n\n    /* compare */\n    const compareData = s.compareItems.map((id,idx)=>{\n      const p=s.favSale.find(x=>x.id===id); if(!p) return null;\n      const color=this.COLORS[idx];\n      return {\n        ...p, score:this.computeScore(p,w),\n        unitPrice: p.area>0?Math.round(p.price*10000/p.area).toLocaleString():'—',\n        badgeSty:{display:'flex',alignItems:'center',justifyContent:'center',width:42,height:42,background:color,color:'#fff',borderRadius:'50%',fontSize:16,fontWeight:700,flexShrink:0},\n        legendDot:{width:10,height:10,borderRadius:'50%',background:color,flexShrink:0},\n      };\n    }).filter(Boolean);\n\n    const radarBig = compareData.length>=2\n      ? this.makeRadar(compareData.map(p=>p.scores),w,280,compareData.map((_,i)=>this.COLORS[i]+'26'),this.COLORS.slice(0,compareData.length))\n      : null;\n\n    return {\n      /* tabs */\n      tabHome:mk(s.tab==='home'), tabSale:mk(s.tab==='sale'), tabRent:mk(s.tab==='rent'), tabScore:mk(s.tab==='score'),\n      cntBadge, isHome:s.tab==='home', isSale:s.tab==='sale', isRent:s.tab==='rent', isScore:s.tab==='score',\n      goHome:()=>this.setState({tab:'home'}), goSale:()=>this.setState({tab:'sale'}),\n      goRent:()=>this.setState({tab:'rent'}), goScore:()=>this.setState({tab:'score'}),\n      favSaleCount:s.favSale.length,\n\n      /* scan */\n      urlValue:s.url, scanning:s.scanning,\n      handleUrl:e=>this.setState({url:e.target.value}),\n      handleScan:()=>this.doScan(),\n      scanBtnStyle:{padding:'11px 28px',background:s.scanning?'#d97757':'#c96442',color:'#faf9f5',border:'none',borderRadius:8,fontSize:14,fontWeight:500,cursor:s.scanning?'default':'pointer',whiteSpace:'nowrap',fontFamily:'inherit'},\n      scanBtnLabel:s.scanning?'分析中…':'扫描 / 分析',\n      hasResults:s.results!==null, showEmpty:s.results===null&&!s.scanning,\n      resultsCount:raw.length, avgUnit,\n\n      /* filters */\n      selStyle, hasFilters:filterCount>0, filterCount,\n      clearFilters:()=>this.setState({priceFilter:'',areaFilter:'',orientFilter:'',renovFilter:''}),\n      priceFilter:s.priceFilter, areaFilter:s.areaFilter, orientFilter:s.orientFilter, renovFilter:s.renovFilter,\n      setPriceFilter:e=>this.setState({priceFilter:e.target.value}),\n      setAreaFilter:e=>this.setState({areaFilter:e.target.value}),\n      setOrientFilter:e=>this.setState({orientFilter:e.target.value}),\n      setRenovFilter:e=>this.setState({renovFilter:e.target.value}),\n\n      /* analysis */\n      schemeOptions:s.schemes,\n      homeSchemeId:s.homeSchemeId,\n      setHomeSchemeId:e=>this.setState({homeSchemeId:e.target.value,analysisActive:false}),\n      runAnalysis:()=>{ if(s.homeSchemeId) this.setState({analysisActive:true}); },\n      analysisActive:s.analysisActive,\n      activeAnalysisSchemeName,\n      analysisBtnSty:s.analysisActive\n        ? {padding:'7px 16px',background:'var(--terracotta)',color:'var(--ivory)',border:'none',borderRadius:7,fontSize:13,cursor:'pointer',fontWeight:500}\n        : {padding:'7px 16px',background:'var(--dark-surface)',color:'var(--ivory)',border:'none',borderRadius:7,fontSize:13,cursor:'pointer'},\n\n      /* results */\n      groupedResults, filteredCount:fRaw.length,\n      rowHover:{backgroundColor:'#f0efe8'},\n      selectedCount, allSelected, hasSelected:selectedCount>0,\n      toggleSelectAll:()=>{\n        const allSel=fRaw.every(p=>s.selected[p.id]);\n        if(allSel){this.setState({selected:{}});}\n        else{const sel={};fRaw.forEach(p=>{sel[p.id]=true;});this.setState({selected:sel});}\n      },\n      addSelectedToFav:()=>{fRaw.filter(p=>s.selected[p.id]).forEach(p=>this.addToFav(p));this.setState({selected:{}});},\n\n      /* sale fav */\n      hasFavSale:s.favSale.length>0, noFavSale:s.favSale.length===0,\n      favSaleCount:s.favSale.length, favAvgUnit,\n      groupedFavSale, filtFavCount:fFavSale.length,\n      favSelCount, allFavSel,\n      toggleAllFav:()=>{\n        const allSel=flatFavSale.every(p=>p.isSelected);\n        if(allSel)this.setState({favSaleSelected:{}});\n        else{const sel={};flatFavSale.forEach(p=>{sel[p.id]=true;});this.setState({favSaleSelected:sel});}\n      },\n      bulkDelete:()=>{\n        const nf=s.favSale.filter(p=>!s.favSaleSelected[p.id]);\n        this.setState({favSale:nf,favSaleSelected:{}});\n        this.saveJSON('favSale',nf);\n      },\n\n      /* scoring */\n      schemeBtns, activeScheme:s.schemes.find(sc=>sc.id===s.activeScheme)?.name||'默认方案',\n      addScheme:()=>{\n        const nm='方案'+(s.schemes.length+1);\n        const ns=[...s.schemes,{id:'sc_'+Date.now(),name:nm}];\n        this.setState({schemes:ns});this.saveJSON('schemes',ns);\n      },\n      weightDims, totalWeight, totalWtBadge,\n      showWeights:s.showWeights,\n      toggleWeights:()=>this.setState(p=>({showWeights:!p.showWeights})),\n      wtToggleLabel:s.showWeights?'收起 ▲':'展开 ▼',\n      groupedScoredProps, scoredCount:flatScored.length,\n      hasScoredProps:flatScored.length>0, noScoredProps:flatScored.length===0,\n      scoreSelCount, allScoreSel, hasScoreSel:scoreSelCount>0,\n      canCompare:scoreSelCount>=2&&scoreSelCount<=3,\n      toggleAllScore:()=>{\n        if(allScoreSel)this.setState({scoreSelected:{}});\n        else{const sel={};flatScored.forEach(p=>{sel[p.id]=true;});this.setState({scoreSelected:sel});}\n      },\n      openCompare:()=>{\n        const ids=Object.keys(s.scoreSelected).slice(0,3);\n        this.setState({compareItems:ids,showCompare:ids.length>=2});\n      },\n\n      /* compare modal */\n      showCompare:s.showCompare,\n      closeCompare:()=>this.setState({showCompare:false}),\n      stopBubble:e=>e.stopPropagation(),\n      compareData, compareCount:compareData.length,\n      cmpGridSty:{display:'grid',gridTemplateColumns:`repeat(${Math.min(compareData.length,3)},1fr)`,gap:16},\n      radarBig,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
