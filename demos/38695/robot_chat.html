<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能对话机器人</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 95vw;
            height: 90vh;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        /* 左侧机器人区域 */
        .robot-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .robot-container {
            position: relative;
            width: 280px;
            height: 380px;
        }

        /* 机器人头部 */
        .robot-head {
            width: 160px;
            height: 140px;
            background: linear-gradient(145deg, #4a90e2, #357abd);
            border-radius: 30px 30px 25px 25px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 10px 30px rgba(74, 144, 226, 0.4), inset 0 2px 10px rgba(255, 255, 255, 0.2);
            z-index: 10;
            animation: headFloat 3s ease-in-out infinite;
        }

        @keyframes headFloat {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }

        /* 天线 */
        .antenna {
            width: 6px;
            height: 30px;
            background: linear-gradient(to bottom, #6ab7ff, #4a90e2);
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 3px;
        }

        .antenna-ball {
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #ee5a5a);
            border-radius: 50%;
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.6);
            animation: antennaBlink 2s ease-in-out infinite;
        }

        @keyframes antennaBlink {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px rgba(255, 107, 107, 0.6); }
            50% { opacity: 0.6; box-shadow: 0 0 20px rgba(255, 107, 107, 0.9); }
        }

        /* 眼睛 */
        .eyes-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 35px;
        }

        .eye {
            width: 42px;
            height: 42px;
            background: radial-gradient(circle at 35% 35%, #ffffff, #e8e8e8);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .eye-pupil {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 35% 35%, #2c3e50, #1a1a2e);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }

        .eye-pupil::after {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 4px;
        }

        /* 眨眼动画 */
        .eye.blink {
            animation: blink 0.2s ease-in-out;
        }

        @keyframes blink {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }

        /* 嘴巴 */
        .mouth {
            width: 60px;
            height: 8px;
            background: #2c3e50;
            border-radius: 0 0 30px 30px;
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .mouth.speaking {
            animation: mouthTalk 0.3s ease-in-out infinite alternate;
        }

        @keyframes mouthTalk {
            0% { height: 8px; width: 60px; border-radius: 0 0 30px 30px; }
            100% { height: 25px; width: 45px; border-radius: 50%; }
        }

        .mouth.listening {
            width: 50px;
            height: 20px;
            border-radius: 50%;
            background: #2c3e50;
            animation: mouthListen 1s ease-in-out infinite;
        }

        @keyframes mouthListen {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
        }

        /* 腮红 */
        .cheek {
            width: 20px;
            height: 12px;
            background: rgba(255, 150, 150, 0.3);
            border-radius: 50%;
            position: absolute;
            top: 75px;
        }

        .cheek.left { left: 15px; }
        .cheek.right { right: 15px; }

        /* 机器人身体 */
        .robot-body {
            width: 120px;
            height: 130px;
            background: linear-gradient(145deg, #5a9fd4, #4a90e2);
            border-radius: 20px 20px 30px 30px;
            position: absolute;
            top: 135px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 10px 25px rgba(74, 144, 226, 0.3);
            z-index: 5;
        }

        /* 胸口显示屏 */
        .chest-screen {
            width: 80px;
            height: 50px;
            background: linear-gradient(145deg, #1a1a2e, #0f3460);
            border-radius: 10px;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            border: 2px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chest-screen-text {
            color: #4a90e2;
            font-size: 10px;
            font-family: 'Courier New', monospace;
            animation: screenText 2s linear infinite;
        }

        @keyframes screenText {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* 手臂 */
        .arm {
            width: 30px;
            height: 80px;
            background: linear-gradient(145deg, #4a90e2, #357abd);
            border-radius: 15px;
            position: absolute;
            top: 150px;
            z-index: 4;
        }

        .arm.left {
            left: 25px;
            transform-origin: top center;
            animation: armWaveLeft 4s ease-in-out infinite;
        }

        .arm.right {
            right: 25px;
            transform-origin: top center;
            animation: armWaveRight 4s ease-in-out infinite;
        }

        @keyframes armWaveLeft {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(15deg); }
        }

        @keyframes armWaveRight {
            0%, 100% { transform: rotate(10deg); }
            50% { transform: rotate(-15deg); }
        }

        /* 手 */
        .hand {
            width: 25px;
            height: 25px;
            background: linear-gradient(145deg, #6ab7ff, #4a90e2);
            border-radius: 50%;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* 腿 */
        .leg {
            width: 35px;
            height: 60px;
            background: linear-gradient(145deg, #357abd, #2a5f9e);
            border-radius: 0 0 15px 15px;
            position: absolute;
            top: 255px;
            z-index: 3;
        }

        .leg.left { left: 85px; }
        .leg.right { right: 85px; }

        /* 脚 */
        .foot {
            width: 45px;
            height: 20px;
            background: linear-gradient(145deg, #2c3e50, #1a1a2e);
            border-radius: 10px 10px 5px 5px;
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* 状态指示 */
        .status-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 20px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2ecc71;
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 5px #2ecc71; }
            50% { opacity: 0.6; box-shadow: 0 0 15px #2ecc71; }
        }

        .status-text {
            color: white;
            font-size: 12px;
        }

        /* 声波效果 */
        .sound-waves {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }

        .sound-waves.active {
            display: block;
        }

        .wave {
            position: absolute;
            border: 2px solid rgba(74, 144, 226, 0.5);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: waveExpand 1.5s ease-out infinite;
        }

        .wave:nth-child(1) { animation-delay: 0s; }
        .wave:nth-child(2) { animation-delay: 0.3s; }
        .wave:nth-child(3) { animation-delay: 0.6s; }

        @keyframes waveExpand {
            0% { width: 100px; height: 100px; opacity: 1; }
            100% { width: 300px; height: 300px; opacity: 0; }
        }

        /* 右侧对话区域 */
        .chat-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-title {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .model-selector label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        .model-selector select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .model-selector select option {
            background: #1a1a2e;
            color: white;
        }

        /* 消息区域 */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 15px;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            animation: messageSlide 0.3s ease-out;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(145deg, #667eea, #764ba2);
        }

        .message.bot .message-avatar {
            background: linear-gradient(145deg, #4a90e2, #357abd);
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(145deg, #667eea, #764ba2);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }

        /* 输入区域 */
        .input-area {
            display: flex;
            gap: 10px;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .message-input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .message-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .message-input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 10px rgba(74, 144, 226, 0.3);
        }

        .voice-btn, .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .voice-btn {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            color: white;
        }

        .voice-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .voice-btn.recording {
            animation: recordingPulse 1s ease-in-out infinite;
        }

        @keyframes recordingPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            50% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(231, 76, 60, 0); }
        }

        .send-btn {
            background: linear-gradient(145deg, #2ecc71, #27ae60);
            color: white;
        }

        .send-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }

        /* 设置面板 */
        .settings-panel {
            position: absolute;
            top: 60px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            padding: 20px;
            width: 300px;
            display: none;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .settings-panel.active {
            display: block;
        }

        .settings-title {
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-close {
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
        }

        .settings-close:hover {
            color: white;
        }

        .setting-item {
            margin-bottom: 15px;
        }

        .setting-item label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            margin-bottom: 5px;
        }

        .setting-item input, .setting-item select {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 13px;
            outline: none;
        }

        .setting-item input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .settings-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 语音波形 */
        .voice-waveform {
            display: none;
            align-items: center;
            gap: 3px;
            height: 30px;
            position: absolute;
            right: 55px;
            top: 50%;
            transform: translateY(-50%);
        }

        .voice-waveform.active {
            display: flex;
        }

        .wave-bar {
            width: 3px;
            background: #e74c3c;
            border-radius: 2px;
            animation: waveBar 0.5s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 15px; animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { height: 20px; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 12px; animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { height: 18px; animation-delay: 0.4s; }

        @keyframes waveBar {
            0% { transform: scaleY(0.5); }
            100% { transform: scaleY(1); }
        }

        /* 加载动画 */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 5px;
            padding: 12px 16px;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .robot-section {
                display: none;
            }
            .chat-section {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧机器人 -->
        <div class="robot-section">
            <button class="settings-btn" onclick="toggleSettings()">⚙️ 设置</button>
            
            <div class="settings-panel" id="settingsPanel">
                <div class="settings-title">
                    <span>连接设置</span>
                    <span class="settings-close" onclick="toggleSettings()">&times;</span>
                </div>
                <div class="setting-item">
                    <label>Ollama API 地址</label>
                    <input type="text" id="apiUrl" value="http://localhost:11434" placeholder="http://localhost:11434">
                </div>
                <div class="setting-item">
                    <label>默认模型</label>
                    <select id="defaultModel">
                        <option value="gemma3:4b">gemma3:4b</option>
                        <option value="qwen3:8b">qwen3:8b</option>
                        <option value="granite4.1:3b">granite4.1:3b</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>语音语言</label>
                    <select id="voiceLang">
                        <option value="zh-CN">中文</option>
                        <option value="en-US">English</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>语音识别语言</label>
                    <select id="recognitionLang">
                        <option value="zh-CN">中文</option>
                        <option value="en-US">English</option>
                    </select>
                </div>
            </div>

            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-text" id="statusText">就绪</span>
            </div>

            <div class="robot-container">
                <div class="robot-head" id="robotHead">
                    <div class="antenna"></div>
                    <div class="antenna-ball"></div>
                    <div class="eyes-container">
                        <div class="eye" id="leftEye">
                            <div class="eye-pupil"></div>
                        </div>
                        <div class="eye" id="rightEye">
                            <div class="eye-pupil"></div>
                        </div>
                    </div>
                    <div class="mouth" id="robotMouth"></div>
                    <div class="cheek left"></div>
                    <div class="cheek right"></div>
                </div>
                <div class="robot-body">
                    <div class="chest-screen">
                        <span class="chest-screen-text" id="chestText">AI</span>
                    </div>
                </div>
                <div class="arm left">
                    <div class="hand"></div>
                </div>
                <div class="arm right">
                    <div class="hand"></div>
                </div>
                <div class="leg left">
                    <div class="foot"></div>
                </div>
                <div class="leg right">
                    <div class="foot"></div>
                </div>
            </div>

            <div class="sound-waves" id="soundWaves">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
            </div>
        </div>

        <!-- 右侧对话 -->
        <div class="chat-section">
            <div class="chat-header">
                <div class="chat-title">🤖 智能对话</div>
                <div class="model-selector">
                    <label>模型:</label>
                    <select id="modelSelect">
                        <option value="gemma3:4b">gemma3:4b</option>
                        <option value="qwen3:8b">qwen3:8b</option>
                        <option value="granite4.1:3b">granite4.1:3b</option>
                    </select>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="message bot">
                    <div class="message-avatar">🤖</div>
                    <div>
                        <div class="message-content">你好！我是你的智能助手。你可以打字或点击麦克风按钮与我语音对话。</div>
                        <div class="message-time" id="welcomeTime"></div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <button class="voice-btn" id="voiceBtn" title="语音输入">🎤</button>
                <div class="input-wrapper">
                    <input type="text" class="message-input" id="messageInput" placeholder="输入消息...">
                    <div class="voice-waveform" id="voiceWaveform">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>
                </div>
                <button class="send-btn" id="sendBtn" title="发送">📤</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let isRecording = false;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let messageHistory = [];
        let isProcessing = false;

        // DOM 元素
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const messagesContainer = document.getElementById('messagesContainer');
        const robotMouth = document.getElementById('robotMouth');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const soundWaves = document.getElementById('soundWaves');
        const voiceWaveform = document.getElementById('voiceWaveform');
        const chestText = document.getElementById('chestText');
        const modelSelect = document.getElementById('modelSelect');
        const settingsPanel = document.getElementById('settingsPanel');

        // 初始化
        document.getElementById('welcomeTime').textContent = new Date().toLocaleTimeString('zh-CN');

        // 默认模型列表（API不可用时使用）
        const fallbackModels = ['gemma3:4b', 'qwen3:8b', 'qwen3.5:4b', 'granite4.1:3b', 'gemma4:e2b', 'openbmb/minicpm4.1:latest'];

        // 填充下拉框
        function populateModelSelects(models) {
            const select = document.getElementById('modelSelect');
            const defaultSelect = document.getElementById('defaultModel');
            select.innerHTML = '';
            defaultSelect.innerHTML = '';
            models.forEach(name => {
                const o1 = document.createElement('option');
                o1.value = name; o1.textContent = name;
                select.appendChild(o1);
                const o2 = document.createElement('option');
                o2.value = name; o2.textContent = name;
                defaultSelect.appendChild(o2);
            });
        }

        // 加载可用模型
        async function loadModels() {
            try {
                const apiUrl = document.getElementById('apiUrl').value || 'http://localhost:11434';
                const response = await fetch(`${apiUrl}/api/tags`);
                const data = await response.json();
                
                if (data.models && data.models.length > 0) {
                    const models = data.models
                        .filter(m => m.details && m.details.capabilities && m.details.capabilities.includes('completion'))
                        .map(m => m.name);
                    if (models.length > 0) {
                        populateModelSelects(models);
                        return;
                    }
                }
            } catch (error) {
                console.log('无法连接到Ollama，使用默认模型列表');
            }
            // API失败时使用默认列表，保证下拉框始终有选项
            populateModelSelects(fallbackModels);
        }

        loadModels();

        // 设置面板
        function toggleSettings() {
            settingsPanel.classList.toggle('active');
        }

        // 更新状态
        function updateStatus(status, type = 'normal') {
            statusText.textContent = status;
            if (type === 'error') {
                statusDot.style.background = '#e74c3c';
                statusDot.style.boxShadow = '0 0 5px #e74c3c';
            } else if (type === 'success') {
                statusDot.style.background = '#2ecc71';
                statusDot.style.boxShadow = '0 0 5px #2ecc71';
            } else if (type === 'warning') {
                statusDot.style.background = '#f39c12';
                statusDot.style.boxShadow = '0 0 5px #f39c12';
            }
        }

        // 添加消息
        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const time = new Date().toLocaleTimeString('zh-CN');
            messageDiv.innerHTML = `
                <div class="message-avatar">${isUser ? '👤' : '🤖'}</div>
                <div>
                    <div class="message-content">${escapeHtml(content)}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 语音合成
        function speak(text) {
            if (synthesis.speaking) {
                synthesis.cancel();
            }
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = document.getElementById('voiceLang').value || 'zh-CN';
            utterance.rate = 1;
            utterance.pitch = 1;
            
            utterance.onstart = () => {
                robotMouth.classList.add('speaking');
                chestText.textContent = '说话中';
                updateStatus('正在说话', 'warning');
            };
            
            utterance.onend = () => {
                robotMouth.classList.remove('speaking');
                chestText.textContent = 'AI';
                updateStatus('就绪');
            };
            
            utterance.onerror = () => {
                robotMouth.classList.remove('speaking');
                chestText.textContent = 'AI';
                updateStatus('就绪');
            };
            
            synthesis.speak(utterance);
        }

        // 调用Ollama API
        async function sendToOllama(message) {
            const apiUrl = document.getElementById('apiUrl').value || 'http://localhost:11434';
            const model = modelSelect.value || document.getElementById('defaultModel').value || 'gemma3:4b';
            
            updateStatus('思考中...', 'warning');
            chestText.textContent = '思考中';
            
            try {
                const response = await fetch(`${apiUrl}/api/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: model,
                        prompt: message,
                        stream: false
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                return data.response || '抱歉，我没有理解你的问题。';
            } catch (error) {
                console.error('Ollama API错误:', error);
                updateStatus('连接失败', 'error');
                return '抱歉，连接到大模型服务失败。请确保Ollama服务已启动，并检查设置中的API地址是否正确。';
            }
        }

        // 发送消息
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isProcessing) return;
            
            isProcessing = true;
            messageInput.value = '';
            addMessage(message, true);
            
            updateStatus('思考中...', 'warning');
            
            const response = await sendToOllama(message);
            addMessage(response, false);
            speak(response);
            
            isProcessing = false;
        }

        // 语音识别初始化
        function initSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('您的浏览器不支持语音识别功能，请使用Chrome浏览器。');
                return null;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            recognition.lang = document.getElementById('recognitionLang').value || 'zh-CN';
            recognition.continuous = false;
            recognition.interimResults = true;
            
            recognition.onstart = () => {
                isRecording = true;
                voiceBtn.classList.add('recording');
                voiceWaveform.classList.add('active');
                robotMouth.classList.add('listening');
                soundWaves.classList.add('active');
                chestText.textContent = '聆听中';
                updateStatus('聆听中...', 'warning');
            };
            
            recognition.onresult = (event) => {
                let finalTranscript = '';
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }
                
                if (finalTranscript) {
                    messageInput.value = finalTranscript;
                } else if (interimTranscript) {
                    messageInput.value = interimTranscript;
                }
            };
            
            recognition.onerror = (event) => {
                console.error('语音识别错误:', event.error);
                isRecording = false;
                voiceBtn.classList.remove('recording');
                voiceWaveform.classList.remove('active');
                robotMouth.classList.remove('listening');
                soundWaves.classList.remove('active');
                chestText.textContent = 'AI';
                updateStatus('语音识别出错', 'error');
            };
            
            recognition.onend = () => {
                isRecording = false;
                voiceBtn.classList.remove('recording');
                voiceWaveform.classList.remove('active');
                robotMouth.classList.remove('listening');
                soundWaves.classList.remove('active');
                chestText.textContent = 'AI';
                updateStatus('就绪');
                
                // 如果有识别内容，自动发送
                if (messageInput.value.trim()) {
                    setTimeout(() => sendMessage(), 500);
                }
            };
            
            return recognition;
        }

        // 语音按钮点击
        voiceBtn.addEventListener('click', () => {
            if (isRecording) {
                if (recognition) {
                    recognition.stop();
                }
            } else {
                recognition = initSpeechRecognition();
                if (recognition) {
                    recognition.start();
                }
            }
        });

        // 发送按钮点击
        sendBtn.addEventListener('click', sendMessage);

        // 回车发送
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 眼睛跟随鼠标
        document.addEventListener('mousemove', (e) => {
            const eyes = document.querySelectorAll('.eye-pupil');
            const robotHead = document.getElementById('robotHead');
            const rect = robotHead.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
            const distance = Math.min(5, Math.hypot(e.clientX - centerX, e.clientY - centerY) / 20);
            
            const x = Math.cos(angle) * distance;
            const y = Math.sin(angle) * distance;
            
            eyes.forEach(eye => {
                eye.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
            });
        });

        // 随机眨眼
        function randomBlink() {
            const eyes = document.querySelectorAll('.eye');
            eyes.forEach(eye => eye.classList.add('blink'));
            setTimeout(() => {
                eyes.forEach(eye => eye.classList.remove('blink'));
            }, 200);
            
            setTimeout(randomBlink, Math.random() * 4000 + 2000);
        }
        randomBlink();

        // 点击外部关闭设置面板
        document.addEventListener('click', (e) => {
            if (!settingsPanel.contains(e.target) && !e.target.classList.contains('settings-btn')) {
                settingsPanel.classList.remove('active');
            }
        });
    </script>
</body>
</html>
