<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube封面复制器 - Thumbnail Copier</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 0;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #ff0000, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header p {
            color: #888;
            font-size: 1.1rem;
        }

        .input-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 0.95rem;
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #ff0000;
            background: rgba(0,0,0,0.5);
        }

        .input-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .btn-primary {
            background: linear-gradient(90deg, #ff0000, #cc0000);
            color: #fff;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,0,0,0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,0,0,0.2);
            border-top-color: #ff0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results {
            display: none;
            gap: 30px;
        }

        .results.active {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        @media (max-width: 900px) {
            .results.active {
                grid-template-columns: 1fr;
            }
        }

        .result-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .result-card h3 {
            color: #ff6b6b;
            margin-bottom: 20px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .thumbnail-preview {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            margin-bottom: 20px;
        }

        .thumbnail-preview img {
            width: 100%;
            height: auto;
            display: block;
        }

        .analysis-list {
            list-style: none;
        }

        .analysis-list li {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .analysis-list li:last-child {
            border-bottom: none;
        }

        .analysis-list .label {
            color: #888;
            font-size: 0.9rem;
        }

        .analysis-list .value {
            color: #fff;
            text-align: right;
            max-width: 60%;
        }

        .color-dots {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .seo-tips {
            background: rgba(255,193,7,0.1);
            border-left: 4px solid #ffc107;
            padding: 20px;
            border-radius: 0 10px 10px 0;
            margin-top: 20px;
        }

        .seo-tips h4 {
            color: #ffc107;
            margin-bottom: 12px;
        }

        .seo-tips ul {
            list-style: none;
            padding-left: 0;
        }

        .seo-tips li {
            padding: 6px 0;
            padding-left: 24px;
            position: relative;
            color: #ddd;
            font-size: 0.95rem;
        }

        .seo-tips li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #ffc107;
            font-weight: bold;
        }

        .generated-thumbnail {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        #canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .download-btn {
            background: #28a745;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .download-btn:hover {
            background: #218838;
        }

        .error-message {
            background: rgba(220,53,69,0.2);
            border: 1px solid #dc3545;
            color: #ff6b6b;
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .style-controls {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .control-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        select, input[type="color"], input[type="range"] {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            background: rgba(0,0,0,0.3);
            color: #fff;
        }

        input[type="color"] {
            height: 45px;
            cursor: pointer;
        }

        input[type="range"] {
            padding: 0;
            height: 6px;
        }

        .range-value {
            text-align: center;
            color: #ff6b6b;
            font-weight: 600;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 YouTube封面复制器</h1>
            <p>分析任意YouTube视频封面风格，生成SEO优化的相似缩略图</p>
        </header>

        <section class="input-section">
            <div class="input-group">
                <label for="videoUrl">YouTube视频链接</label>
                <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=... 或 https://youtu.be/...">
            </div>
            
            <div class="input-group">
                <label for="thumbnailText">封面文字文案</label>
                <textarea id="thumbnailText" placeholder="输入你想要的封面文字，建议3-5个字，例如：10个技巧、震惊！、必看"></textarea>
            </div>

            <button class="btn-primary" onclick="analyzeAndGenerate()">
                <span>🚀</span> 分析并生成封面
            </button>

            <div class="error-message" id="errorMessage"></div>
        </section>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在分析封面风格...</p>
        </div>

        <div class="results" id="results">
            <div class="result-card">
                <h3>📊 原始封面分析</h3>
                <div class="thumbnail-preview">
                    <img id="originalThumbnail" src="" alt="原始缩略图">
                </div>
                <ul class="analysis-list" id="analysisList">
                    <!-- 动态生成 -->
                </ul>
                
                <div class="seo-tips">
                    <h4>💡 SEO优化建议</h4>
                    <ul id="seoTips">
                        <!-- 动态生成 -->
                    </ul>
                </div>
            </div>

            <div class="result-card">
                <h3>🎨 生成的新封面</h3>
                <div class="generated-thumbnail">
                    <canvas id="canvas" width="1280" height="720"></canvas>
                </div>
                <button class="download-btn" onclick="downloadThumbnail()">
                    ⬇️ 下载封面 (1280x720)
                </button>

                <div class="style-controls">
                    <h4 style="color: #ff6b6b; margin-bottom: 15px;">🎛️ 样式调整</h4>
                    
                    <div class="control-group">
                        <label>文字颜色</label>
                        <input type="color" id="textColor" value="#FFFFFF" onchange="regenerateThumbnail()">
                    </div>

                    <div class="control-row">
                        <div class="control-group">
                            <label>描边颜色</label>
                            <input type="color" id="strokeColor" value="#000000" onchange="regenerateThumbnail()">
                        </div>
                        <div class="control-group">
                            <label>背景颜色</label>
                            <input type="color" id="bgColor" value="#FF0000" onchange="regenerateThumbnail()">
                        </div>
                    </div>

                    <div class="control-group">
                        <label>字体大小: <span class="range-value" id="fontSizeValue">80</span>px</label>
                        <input type="range" id="fontSize" min="40" max="150" value="80" oninput="updateFontSize(this.value); regenerateThumbnail()">
                    </div>

                    <div class="control-group">
                        <label>文字位置</label>
                        <select id="textPosition" onchange="regenerateThumbnail()">
                            <option value="center">居中</option>
                            <option value="left">左侧</option>
                            <option value="right">右侧</option>
                            <option value="top">顶部</option>
                            <option value="bottom">底部</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAnalysis = null;
        let originalImage = null;

        function extractVideoId(url) {
            const patterns = [
                /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
                /youtu\.be\/([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
            ];
            
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            return null;
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('active');
            setTimeout(() => errorEl.classList.remove('active'), 5000);
        }

        async function analyzeAndGenerate() {
            const url = document.getElementById('videoUrl').value.trim();
            const text = document.getElementById('thumbnailText').value.trim();

            if (!url) {
                showError('请输入YouTube视频链接');
                return;
            }

            if (!text) {
                showError('请输入封面文字文案');
                return;
            }

            const videoId = extractVideoId(url);
            if (!videoId) {
                showError('无法识别视频ID，请检查链接格式');
                return;
            }

            // 显示加载状态
            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');

            try {
                // 获取缩略图
                const thumbnailUrl = `https://banner.yt/${videoId}?format=jpeg&width=1280`;
                
                // 加载图片进行分析
                originalImage = new Image();
                originalImage.crossOrigin = 'anonymous';
                
                originalImage.onload = function() {
                    // 分析图片
                    currentAnalysis = analyzeImage(originalImage);
                    
                    // 显示原始缩略图
                    document.getElementById('originalThumbnail').src = thumbnailUrl;
                    
                    // 显示分析结果
                    displayAnalysis(currentAnalysis);
                    
                    // 生成新封面
                    generateThumbnail(text, currentAnalysis);
                    
                    // 显示结果
                    document.getElementById('loading').classList.remove('active');
                    document.getElementById('results').classList.add('active');
                };

                originalImage.onerror = function() {
                    showError('无法加载缩略图，请检查视频链接是否正确');
                    document.getElementById('loading').classList.remove('active');
                };

                originalImage.src = thumbnailUrl;

            } catch (error) {
                showError('分析过程中出现错误: ' + error.message);
                document.getElementById('loading').classList.remove('active');
            }
        }

        function analyzeImage(img) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            // 获取图像数据
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            // 分析主色调
            const colorCounts = {};
            let r, g, b, rgb;
            
            // 采样分析（每10个像素）
            for (let i = 0; i < data.length; i += 40) {
                r = data[i];
                g = data[i + 1];
                b = data[i + 2];
                
                // 简化颜色
                rgb = `${Math.round(r/51)*51},${Math.round(g/51)*51},${Math.round(b/51)*51}`;
                colorCounts[rgb] = (colorCounts[rgb] || 0) + 1;
            }

            // 获取主要颜色
            const sortedColors = Object.entries(colorCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5)
                .map(([color]) => {
                    const [r, g, b] = color.split(',').map(Number);
                    return `rgb(${r},${g},${b})`;
                });

            // 检测亮度
            let totalBrightness = 0;
            for (let i = 0; i < data.length; i += 40) {
                totalBrightness += (data[i] + data[i+1] + data[i+2]) / 3;
            }
            const avgBrightness = totalBrightness / (data.length / 40);

            // 检测对比度区域
            const textRegions = detectTextRegions(data, canvas.width, canvas.height);

            return {
                dominantColors: sortedColors,
                brightness: avgBrightness > 128 ? '明亮' : '暗色',
                contrast: avgBrightness > 100 && avgBrightness < 200 ? '高对比' : '低对比',
                hasText: textRegions.length > 0,
                textRegions: textRegions,
                aspectRatio: canvas.width / canvas.height
            };
        }

        function detectTextRegions(data, width, height) {
            // 简化的文本区域检测（基于边缘检测）
            const regions = [];
            const threshold = 30;
            
            for (let y = 10; y < height - 10; y += 20) {
                for (let x = 10; x < width - 10; x += 20) {
                    const idx = (y * width + x) * 4;
                    const idxRight = (y * width + (x + 5)) * 4;
                    
                    const diff = Math.abs(data[idx] - data[idxRight]) +
                                Math.abs(data[idx+1] - data[idxRight+1]) +
                                Math.abs(data[idx+2] - data[idxRight+2]);
                    
                    if (diff > threshold * 3) {
                        regions.push({x, y});
                    }
                }
            }
            
            return regions;
        }

        function displayAnalysis(analysis) {
            const list = document.getElementById('analysisList');
            
            // 提取颜色代码用于显示
            const colorHexes = analysis.dominantColors.slice(0, 3).map(rgb => {
                const match = rgb.match(/rgb\((\d+),(\d+),(\d+)\)/);
                if (match) {
                    return '#' + [match[1], match[2], match[3]].map(x => {
                        const hex = parseInt(x).toString(16);
                        return hex.length === 1 ? '0' + hex : hex;
                    }).join('');
                }
                return '#000000';
            });

            list.innerHTML = `
                <li>
                    <span class="label">主色调</span>
                    <div class="color-dots">
                        ${colorHexes.map(c => `<div class="color-dot" style="background: ${c}"></div>`).join('')}
                    </div>
                </li>
                <li>
                    <span class="label">整体亮度</span>
                    <span class="value">${analysis.brightness}</span>
                </li>
                <li>
                    <span class="label">对比度</span>
                    <span class="value">${analysis.contrast}</span>
                </li>
                <li>
                    <span class="label">检测到文字</span>
                    <span class="value">${analysis.hasText ? '是' : '否'}</span>
                </li>
                <li>
                    <span class="label">推荐风格</span>
                    <span class="value">${analysis.brightness === '明亮' ? '活力/兴奋' : '神秘/专业'}</span>
                </li>
            `;

            // 设置默认颜色
            if (colorHexes.length > 0) {
                document.getElementById('bgColor').value = colorHexes[0];
            }

            // SEO建议
            const seoTips = document.getElementById('seoTips');
            const tips = [
                '文字控制在3-5个字，确保移动端可见',
                '使用高对比度颜色，突出文字内容',
                analysis.brightness === '明亮' ? '保持明亮风格，增强视觉冲击力' : '使用暗色背景营造神秘感',
                '避免右下角放置重要内容（被视频时长遮挡）',
                '使用粗体字和描边效果增强可读性',
                '添加表情符号或数字提升点击率'
            ];
            
            seoTips.innerHTML = tips.map(tip => `<li>${tip}</li>`).join('');
        }

        function generateThumbnail(text, analysis) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            // 获取用户设置
            const bgColor = document.getElementById('bgColor').value;
            const textColor = document.getElementById('textColor').value;
            const strokeColor = document.getElementById('strokeColor').value;
            const fontSize = parseInt(document.getElementById('fontSize').value);
            const textPosition = document.getElementById('textPosition').value;

            // 清空画布
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, 1280, 720);

            // 添加渐变效果
            const gradient = ctx.createLinearGradient(0, 0, 1280, 720);
            gradient.addColorStop(0, bgColor);
            gradient.addColorStop(1, adjustBrightness(bgColor, -30));
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1280, 720);

            // 添加装饰元素
            drawDecorations(ctx, bgColor);

            // 绘制文字
            drawText(ctx, text, textColor, strokeColor, fontSize, textPosition);
        }

        function drawDecorations(ctx, baseColor) {
            // 添加一些视觉装饰元素
            ctx.save();
            
            // 角落装饰
            ctx.strokeStyle = adjustBrightness(baseColor, 30);
            ctx.lineWidth = 8;
            
            // 左上角
            ctx.beginPath();
            ctx.moveTo(30, 80);
            ctx.lineTo(30, 30);
            ctx.lineTo(80, 30);
            ctx.stroke();
            
            // 右下角
            ctx.beginPath();
            ctx.moveTo(1200, 640);
            ctx.lineTo(1250, 640);
            ctx.lineTo(1250, 690);
            ctx.stroke();

            // 添加一些动态线条
            ctx.strokeStyle = adjustBrightness(baseColor, -20);
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(100, 600);
            ctx.quadraticCurveTo(400, 550, 700, 620);
            ctx.stroke();

            ctx.restore();
        }

        function drawText(ctx, text, color, strokeColor, fontSize, position) {
            ctx.save();
            
            // 设置字体
            ctx.font = `900 ${fontSize}px "Arial Black", "Helvetica Neue", Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // 计算位置
            let x = 640;
            let y = 360;
            
            switch(position) {
                case 'left':
                    x = 320;
                    ctx.textAlign = 'left';
                    break;
                case 'right':
                    x = 960;
                    ctx.textAlign = 'right';
                    break;
                case 'top':
                    y = 180;
                    break;
                case 'bottom':
                    y = 540;
                    break;
            }

            // 绘制描边
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = fontSize / 10;
            ctx.lineJoin = 'round';
            ctx.strokeText(text, x, y);

            // 绘制阴影
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillText(text, x + 4, y + 4);

            // 绘制主文字
            ctx.fillStyle = color;
            ctx.fillText(text, x, y);

            // 添加高光效果
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillText(text, x - 2, y - 2);

            ctx.restore();
        }

        function adjustBrightness(color, amount) {
            const hex = color.replace('#', '');
            const r = Math.max(0, Math.min(255, parseInt(hex.substr(0, 2), 16) + amount));
            const g = Math.max(0, Math.min(255, parseInt(hex.substr(2, 2), 16) + amount));
            const b = Math.max(0, Math.min(255, parseInt(hex.substr(4, 2), 16) + amount));
            return `#${r.toString(16).padStart(2,'0')}${g.toString(16).pasteStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
        }

        function regenerateThumbnail() {
            const text = document.getElementById('thumbnailText').value.trim() || '示例文字';
            if (currentAnalysis) {
                generateThumbnail(text, currentAnalysis);
            }
        }

        function updateFontSize(value) {
            document.getElementById('fontSizeValue').textContent = value;
        }

        function downloadThumbnail() {
            const canvas = document.getElementById('canvas');
            const link = document.createElement('a');
            link.download = 'youtube-thumbnail-' + Date.now() + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 回车键触发
        document.getElementById('videoUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') analyzeAndGenerate();
        });
    </script>
</body>
</html>
