<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智汇极简任务统筹助手 - 产品原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4096ff',
                        urgent: '#ff4d4f',
                        important: '#faad14',
                        normal: '#52c41a',
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        .phone-frame {
            width: 375px;
            height: 780px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
            background: #f5f7fa;
            position: relative;
        }
        .task-item {
            transition: all 0.2s ease;
        }
        .task-item:active {
            transform: scale(0.98);
        }
        .modal-mask {
            backdrop-filter: blur(4px);
        }
        .slide-up {
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .tab-active {
            color: #4096ff;
            border-bottom: 2px solid #4096ff;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <!-- 手机端小程序原型 -->
    <div class="phone-frame bg-white flex flex-col">
        <!-- 顶部状态栏 -->
        <div class="h-12 bg-white flex items-center justify-between px-6 text-sm font-medium">
            <span>9:41</span>
            <div class="flex gap-1 items-center">
                <i class="fa fa-signal"></i>
                <i class="fa fa-wifi"></i>
                <i class="fa fa-battery-full"></i>
            </div>
        </div>

        <!-- 顶部标题栏 -->
        <div class="px-5 py-3 bg-white border-b border-gray-100">
            <h1 class="text-lg font-bold text-center">智汇极简任务</h1>
        </div>

        <!-- 视图切换Tab -->
        <div class="flex bg-white border-b border-gray-100">
            <div class="flex-1 text-center py-3 text-sm tab-active cursor-pointer" data-tab="today" onclick="switchTab('today')">今日</div>
            <div class="flex-1 text-center py-3 text-sm text-gray-500 cursor-pointer" data-tab="week" onclick="switchTab('week')">本周</div>
            <div class="flex-1 text-center py-3 text-sm text-gray-500 cursor-pointer" data-tab="done" onclick="switchTab('done')">已完成</div>
        </div>

        <!-- 进度统计 -->
        <div class="px-5 py-4 bg-white">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm text-gray-600">今日进度</span>
                <span class="text-sm font-medium text-primary" id="progress-text">0 / 0</span>
            </div>
            <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
                <div class="h-full bg-primary rounded-full transition-all duration-300" id="progress-bar" style="width: 0%"></div>
            </div>
        </div>

        <!-- 优先级筛选 -->
        <div class="px-5 py-2 flex gap-2 overflow-x-auto">
            <span class="px-3 py-1 text-xs rounded-full bg-primary text-white cursor-pointer filter-btn active" data-level="all">全部</span>
            <span class="px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600 cursor-pointer filter-btn" data-level="urgent">紧急</span>
            <span class="px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600 cursor-pointer filter-btn" data-level="important">重要</span>
            <span class="px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600 cursor-pointer filter-btn" data-level="normal">普通</span>
        </div>

        <!-- 任务列表 -->
        <div class="flex-1 overflow-y-auto px-5 py-3 space-y-3" id="task-list">
            <!-- 任务项由JS动态渲染 -->
            <div class="text-center text-gray-400 text-sm py-20" id="empty-tip">
                <i class="fa fa-check-circle-o text-4xl mb-3 block text-gray-300"></i>
                暂无任务，点击下方按钮添加
            </div>
        </div>

        <!-- 底部添加按钮 -->
        <div class="p-4 bg-white border-t border-gray-100">
            <button onclick="openAddModal()" class="w-full py-3 bg-primary text-white rounded-xl font-medium flex items-center justify-center gap-2 active:bg-blue-600 transition-colors">
                <i class="fa fa-plus"></i>
                添加新任务
            </button>
        </div>

        <!-- 添加任务弹窗 -->
        <div id="add-modal" class="hidden absolute inset-0 z-50 modal-mask bg-black/30 flex items-end">
            <div class="w-full bg-white rounded-t-3xl p-5 slide-up">
                <div class="flex justify-between items-center mb-5">
                    <h3 class="font-bold text-lg">添加任务</h3>
                    <i class="fa fa-times text-gray-400 text-xl cursor-pointer" onclick="closeAddModal()"></i>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="text-sm text-gray-600 block mb-2">任务内容</label>
                        <input type="text" id="task-input" placeholder="输入任务名称..." class="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none focus:border-primary transition-colors">
                    </div>
                    
                    <div>
                        <label class="text-sm text-gray-600 block mb-2">优先级</label>
                        <div class="flex gap-2">
                            <div class="flex-1 py-2 text-center text-sm rounded-lg border border-gray-200 cursor-pointer priority-option" data-level="urgent">
                                <span class="inline-block w-2 h-2 rounded-full bg-urgent mr-1"></span>紧急
                            </div>
                            <div class="flex-1 py-2 text-center text-sm rounded-lg border border-gray-200 cursor-pointer priority-option" data-level="important">
                                <span class="inline-block w-2 h-2 rounded-full bg-important mr-1"></span>重要
                            </div>
                            <div class="flex-1 py-2 text-center text-sm rounded-lg border border-primary bg-primary/5 text-primary cursor-pointer priority-option active" data-level="normal">
                                <span class="inline-block w-2 h-2 rounded-full bg-normal mr-1"></span>普通
                            </div>
                        </div>
                    </div>
                    
                    <div>
                        <label class="text-sm text-gray-600 block mb-2">截止时间</label>
                        <input type="time" id="task-time" class="w-full px-4 py-3 border border-gray-200 rounded-xl outline-none focus:border-primary transition-colors">
                    </div>
                    
                    <button onclick="addTask()" class="w-full py-3 bg-primary text-white rounded-xl font-medium mt-2 active:bg-blue-600 transition-colors">
                        确认添加
                    </button>
                </div>
                <div class="h-6"></div>
            </div>
        </div>
    </div>

    <script>
        // 任务数据
        let tasks = [
            { id: 1, content: '完成产品原型设计', level: 'urgent', time: '10:30', done: false, date: 'today' },
            { id: 2, content: '整理本周工作汇报', level: 'important', time: '14:00', done: false, date: 'today' },
            { id: 3, content: '回复客户邮件', level: 'normal', time: '16:00', done: true, date: 'today' },
        ];
        let currentTab = 'today';
        let currentFilter = 'all';
        let selectedPriority = 'normal';

        // 初始化渲染
        renderTasks();
        updateProgress();

        // 切换Tab
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('[data-tab]').forEach(el => {
                el.classList.remove('tab-active');
                el.classList.add('text-gray-500');
            });
            document.querySelector(`[data-tab="${tab}"]`).classList.add('tab-active');
            document.querySelector(`[data-tab="${tab}"]`).classList.remove('text-gray-500');
            renderTasks();
            updateProgress();
        }

        // 优先级筛选
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('active', 'bg-primary', 'text-white');
                    b.classList.add('bg-gray-100', 'text-gray-600');
                });
                btn.classList.add('active', 'bg-primary', 'text-white');
                btn.classList.remove('bg-gray-100', 'text-gray-600');
                currentFilter = btn.dataset.level;
                renderTasks();
            });
        });

        // 优先级选择
        document.querySelectorAll('.priority-option').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.priority-option').forEach(o => {
                    o.classList.remove('active', 'border-primary', 'bg-primary/5', 'text-primary');
                    o.classList.add('border-gray-200');
                });
                opt.classList.add('active', 'border-primary', 'bg-primary/5', 'text-primary');
                opt.classList.remove('border-gray-200');
                selectedPriority = opt.dataset.level;
            });
        });

        // 渲染任务列表
        function renderTasks() {
            const list = document.getElementById('task-list');
            const emptyTip = document.getElementById('empty-tip');
            
            let filtered = tasks.filter(task => {
                if (currentTab === 'done') return task.done;
                if (currentTab === 'today') return !task.done && task.date === 'today';
                if (currentTab === 'week') return !task.done;
                return true;
            });

            if (currentFilter !== 'all') {
                filtered = filtered.filter(t => t.level === currentFilter);
            }

            // 按优先级排序：紧急 > 重要 > 普通
            const levelOrder = { urgent: 0, important: 1, normal: 2 };
            filtered.sort((a, b) => levelOrder[a.level] - levelOrder[b.level]);

            if (filtered.length === 0) {
                list.innerHTML = '';
                list.appendChild(emptyTip);
                emptyTip.classList.remove('hidden');
                return;
            }

            list.innerHTML = '';
            filtered.forEach(task => {
                const levelColor = {
                    urgent: 'bg-urgent',
                    important: 'bg-important',
                    normal: 'bg-normal'
                }[task.level];
                const levelText = {
                    urgent: '紧急',
                    important: '重要',
                    normal: '普通'
                }[task.level];

                const item = document.createElement('div');
                item.className = 'task-item bg-white p-4 rounded-xl border border-gray-100 flex items-center gap-3';
                item.innerHTML = `
                    <div class="w-5 h-5 rounded-full border-2 ${task.done ? 'bg-primary border-primary' : 'border-gray-300'} flex items-center justify-center cursor-pointer flex-shrink-0" onclick="toggleTask(${task.id})">
                        ${task.done ? '<i class="fa fa-check text-white text-xs"></i>' : ''}
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="${task.done ? 'text-gray-400 line-through' : 'text-gray-800'} truncate">${task.content}</p>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-xs px-2 py-0.5 rounded-full ${levelColor}/10 text-${task.level === 'urgent' ? 'urgent' : task.level === 'important' ? 'important' : 'normal'}">${levelText}</span>
                            ${task.time ? `<span class="text-xs text-gray-400"><i class="fa fa-clock-o mr-1"></i>${task.time}</span>` : ''}
                        </div>
                    </div>
                    <i class="fa fa-trash-o text-gray-300 cursor-pointer hover:text-red-400" onclick="deleteTask(${task.id})"></i>
                `;
                list.appendChild(item);
            });
        }

        // 更新进度
        function updateProgress() {
            const todayTasks = tasks.filter(t => t.date === 'today');
            const doneCount = todayTasks.filter(t => t.done).length;
            const total = todayTasks.length;
            const percent = total === 0 ? 0 : Math.round((doneCount / total) * 100);
            
            document.getElementById('progress-text').textContent = `${doneCount} / ${total}`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        // 切换任务完成状态
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.done = !task.done;
                renderTasks();
                updateProgress();
            }
        }

        // 删除任务
        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
            updateProgress();
        }

        // 打开添加弹窗
        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('task-input').focus();
        }

        // 关闭添加弹窗
        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('task-input').value = '';
            document.getElementById('task-time').value = '';
        }

        // 添加任务
        function addTask() {
            const content = document.getElementById('task-input').value.trim();
            const time = document.getElementById('task-time').value;
            
            if (!content) {
                alert('请输入任务内容');
                return;
            }

            const newTask = {
                id: Date.now(),
                content: content,
                level: selectedPriority,
                time: time,
                done: false,
                date: 'today'
            };

            tasks.unshift(newTask);
            renderTasks();
            updateProgress();
            closeAddModal();
        }

        // 点击遮罩关闭弹窗
        document.getElementById('add-modal').addEventListener('click', (e) => {
            if (e.target.id === 'add-modal') {
                closeAddModal();
            }
        });
    </script>
</body>
</html>
