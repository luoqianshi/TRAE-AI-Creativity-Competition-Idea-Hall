<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>长安夜市美食盲盒</title>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'tang-gold': '#D4AF37',
            'changan-red': '#C41E3A',
            'night-blue': '#1A1A2E',
            'warm-orange': '#FF6B35',
            'jade-green': '#2E8B57',
            'rice-white': '#FDF5E6',
            'lantern-glow': '#FFD700',
          },
          fontFamily: {
            'chinese': ['Ma Shan Zheng', 'serif'],
          },
          animation: {
            'float': 'float 3s ease-in-out infinite',
            'swing': 'swing 3s ease-in-out infinite',
            'sparkle': 'sparkle 1.5s ease-in-out infinite',
            'bounce-once': 'bounce-once 1s ease-in-out',
            'fade-in': 'fade-in 0.5s ease-out',
            'slide-up': 'slide-up 0.5s ease-out',
            'pulse': 'pulse 2s ease-in-out infinite',
          },
          keyframes: {
            float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
            swing: { '0%, 100%': { transform: 'rotate(-5deg)' }, '50%': { transform: 'rotate(5deg)' } },
            sparkle: { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0.5' } },
            'bounce-once': { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
            'fade-in': { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            'slide-up': { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
            pulse: { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0.5' } },
          },
        },
      },
    };
  </script>
  <style>
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background-color: #1A1A2E;
      color: #FDF5E6;
      margin: 0;
      padding: 0;
    }
    .font-chinese {
      font-family: 'Ma Shan Zheng', serif;
    }
    .text-gradient {
      background: linear-gradient(to right, #D4AF37, #FFD700, #D4AF37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .btn-primary {
      background: linear-gradient(to right, #D4AF37, #FFD700);
      color: #1A1A2E;
      font-weight: bold;
      padding: 12px 32px;
      border-radius: 50px;
      border: 2px solid #D4AF37;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
    }
    .btn-secondary {
      background: transparent;
      color: #D4AF37;
      font-weight: 600;
      padding: 8px 24px;
      border-radius: 50px;
      border: 2px solid #D4AF37;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-secondary:hover {
      background: #D4AF37;
      color: #1A1A2E;
    }
    .card {
      background: linear-gradient(to bottom right, rgba(26, 26, 46, 0.8), rgba(26, 26, 46, 0.6));
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 16px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .card-hover:hover {
      border-color: rgba(212, 175, 55, 0.5);
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.1);
      transition: all 0.3s ease;
    }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body>
  <div id="app" class="max-w-md mx-auto min-h-screen relative pb-20 bg-night-blue"></div>

  <script>
    const foods = [
      { id: '1', name: '老孙家羊肉泡馍', desc: '百年老字号，羊肉鲜嫩，馍筋道入味', price: 38, rating: 4.9, cat: '面食', loc: '回民街北院门125号', img: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Xi%27an%20mutton%20pao%20mo%20traditional%20food&image_size=square', tags: ['老字号', '必吃'], shop: '老孙家饭庄', dist: 0.5 },
      { id: '2', name: '贾三灌汤包', desc: '皮薄馅大，汤汁浓郁，一口爆汁', price: 28, rating: 4.8, cat: '小吃', loc: '回民街西羊市12号', img: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Chinese%20soup%20dumplings%20xiaolongbao&image_size=square', tags: ['人气', '必吃'], shop: '贾三灌汤包子馆', dist: 0.3 },
      { id: '3', name: '马洪小炒泡馍', desc: '酸辣鲜香，馍块筋道，地道老陕味', price: 35, rating: 4.9, cat: '面食', loc: '洒金桥122号', img: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Xi%27an%20stir%20fried%20pao%20mo&image_size=square', tags: ['网红', '排队王'], shop: '马洪小炒', dist: 0.8 },
      { id: '4', name: '老金家蛋菜夹馍', desc: '酥脆饼皮配秘制蛋菜', price: 15, rating: 4.7, cat: '小吃', loc: '洒金桥110号', img: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Chinese%20egg%20sandwich%20burger&image_size=square', tags: ['早餐', '便宜'], shop: '老金家蛋菜夹馍', dist: 0.6 },
      { id: '5', name: '刘信牛羊肉小炒', desc: '肉质鲜嫩，汤汁浓郁', price: 36, rating: 4.8, cat: '面食', loc: '洒金桥138号', img: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Xi%27an%20beef%20lamb%20noodles&image_size=square', tags: ['老字号', '必吃'], shop: '刘信牛羊肉小炒', dist: 0.7 },
      { id: '6', name: '柿子糊塌', desc: '金黄酥脆，香甜软糯', price: 8, rating: 4.6, cat: '甜点', loc: '回民街西羊市25号', img: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Chinese%20persimmon%20cake&image_size=square', tags: ['甜点', '特色'], shop: '柿子糊塌老店', dist: 0.4 },
      { id: '7', name: '酸梅汤', desc: '古法熬制，酸甜开胃', price: 10, rating: 4.5, cat: '饮品', loc: '回民街北院门88号', img: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Chinese%20sour%20plum%20drink&image_size=square', tags: ['饮品', '解腻'], shop: '花奶奶酸梅汤', dist: 0.3 },
      { id: '8', name: '牛肉饼', desc: '外酥里嫩，肉香四溢', price: 12, rating: 4.7, cat: '小吃', loc: '洒金桥99号', img: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Chinese%20beef%20cake&image_size=square', tags: ['人气', '酥脆'], shop: '香酥牛肉饼', dist: 0.5 }
    ];

    const cats = [
      { id: '1', name: '面食', icon: '🍜', count: 3 },
      { id: '2', name: '小吃', icon: '🥟', count: 3 },
      { id: '3', name: '甜点', icon: '🍰', count: 1 },
      { id: '4', name: '饮品', icon: '🥤', count: 1 }
    ];

    const coupons = [
      { id: 'c1', food_id: '1', food_name: '老孙家羊肉泡馍', discount: 5, min: 30, expire: '2026-12-31', claimed: true },
      { id: 'c2', food_id: '2', food_name: '贾三灌汤包', discount: 3, min: 20, expire: '2026-12-31', claimed: true },
      { id: 'c3', food_id: '3', food_name: '马洪小炒泡馍', discount: 8, min: 30, expire: '2026-12-31', claimed: false }
    ];

    const state = {
      page: 'home',
      favs: ['1', '3'],
      checkins: [],
      myCoupons: JSON.parse(JSON.stringify(coupons)),
      user: { name: '长安食客', points: 1280 },
      blindboxResult: null,
      selectedFood: null,
      checkinSuccess: false,
      selectedCheckinFood: null,
      photoUrl: ''
    };

    function stars(rating) {
      let s = '';
      for (let i = 0; i < 5; i++) {
        s += i < Math.floor(rating) ? '★' : '☆';
      }
      return s;
    }

    function lantern(size) {
      const w = size === 'sm' ? '32' : size === 'lg' ? '64' : '48';
      const h = size === 'sm' ? '48' : size === 'lg' ? '80' : '64';
      return `<svg viewBox="0 0 100 140" width="${w}" height="${h}" class="drop-shadow-lg"><defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF6B35"/><stop offset="50%" stop-color="#C41E3A"/><stop offset="100%" stop-color="#8B0000"/></linearGradient></defs><path d="M20 30 Q10 50 20 70 L20 110 Q10 120 20 130 L80 130 Q90 120 80 110 L80 70 Q90 50 80 30 Z" fill="url(#lg)"/><path d="M50 30 L50 110" stroke="#D4AF37" stroke-width="3"/><circle cx="50" cy="90" r="15" fill="#FFD700" opacity="0.6"/></svg>`;
    }

    function foodCard(food, action) {
      const isFav = state.favs.includes(food.id);
      return `<div class="card card-hover cursor-pointer min-w-[280px] max-w-[320px]" data-action="${action}" data-id="${food.id}">
        <div class="relative aspect-square rounded-xl overflow-hidden mb-3">
          <img src="${food.img}" alt="${food.name}" class="w-full h-full object-cover"/>
          <button class="absolute top-2 right-2 p-2 rounded-full bg-night-blue/50 text-white/70 hover:text-changan-red ${isFav ? 'bg-changan-red/80 text-white' : ''}" data-action="toggleFav" data-id="${food.id}">
            <svg class="w-5 h-5 ${isFav ? 'fill-current' : ''}" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </button>
          <span class="absolute bottom-2 left-2 bg-changan-red/90 text-white text-xs px-2 py-1 rounded-full">${food.cat}</span>
        </div>
        <h3 class="text-lg font-bold text-rice-white font-chinese">${food.name}</h3>
        <p class="text-sm text-rice-white/60 mb-2 line-clamp-2">${food.desc}</p>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span class="text-tang-gold font-bold text-lg">¥${food.price}</span>
            <span class="text-tang-gold text-sm">${stars(food.rating)} ${food.rating}</span>
          </div>
          <span class="text-rice-white/50 text-xs">📍 ${food.dist}km</span>
        </div>
        <div class="flex gap-1 mt-2">
          ${food.tags.map(t => `<span class="text-xs bg-tang-gold/20 text-tang-gold px-2 py-0.5 rounded-full">${t}</span>`).join('')}
        </div>
      </div>`;
    }

    function renderHome() {
      const trending = foods.filter(f => f.tags.includes('必吃') || f.tags.includes('网红'));
      let html = '<div class="min-h-screen bg-night-blue">';
      html += `<div class="relative h-64 overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-night-blue via-night-blue/80 to-night-blue"></div>
        <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Xi%27an%20Great%20Wild%20Goose%20Pagoda%20night%20view%20with%20lanterns&image_size=landscape_16_9" class="w-full h-full object-cover opacity-60"/>
        <div class="absolute top-4 left-4 animate-swing">${lantern('md')}</div>
        <div class="absolute top-8 right-8 animate-swing" style="animation-delay: 0.5s">${lantern('sm')}</div>
        <div class="absolute bottom-0 left-0 right-0 p-6">
          <h1 class="text-4xl font-bold text-gradient font-chinese mb-2">长安夜市</h1>
          <p class="text-rice-white/80 text-lg">美食盲盒 · 探索千年味道</p>
        </div>
      </div>`;

      html += `<div class="px-4 py-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-bold text-rice-white font-chinese">🔥 热门推荐</h2>
          <button class="text-tang-gold text-sm">查看更多</button>
        </div>
        <div class="flex gap-4 overflow-x-auto pb-4 -mx-4 px-4 scrollbar-hide">
          ${trending.map(f => foodCard(f, 'goDetail')).join('')}
        </div>
      </div>`;

      html += `<div class="px-4 py-6">
        <h2 class="text-xl font-bold text-rice-white font-chinese mb-4">🥢 美食分类</h2>
        <div class="grid grid-cols-4 gap-3">
          ${cats.map(c => `<button class="flex flex-col items-center p-4 rounded-2xl bg-night-blue/50 border border-tang-gold/20 hover:border-tang-gold/50">
            <span class="text-3xl mb-2">${c.icon}</span>
            <span class="text-rice-white text-sm">${c.name}</span>
            <span class="text-tang-gold/60 text-xs">${c.count}</span>
          </button>`).join('')}
        </div>
      </div>`;

      html += `<div class="px-4 py-6">
        <h2 class="text-xl font-bold text-rice-white font-chinese mb-4">✨ 探索盲盒</h2>
        <div class="card bg-gradient-to-br from-tang-gold/10 to-night-blue/60 border-tang-gold/30">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-lg font-bold text-tang-gold font-chinese">开启今日美食奇遇</h3>
              <p class="text-rice-white/60 text-sm mt-1">AI智能推荐，发现你的专属味道</p>
            </div>
            <button class="btn-primary text-sm py-2 px-6" data-action="navigate" data-page="explore">立即探索</button>
          </div>
        </div>
      </div>`;

      html += `<div class="px-4 py-6">
        <h2 class="text-xl font-bold text-rice-white font-chinese mb-4">🏪 附近美食</h2>
        <div class="flex flex-col gap-4">
          ${foods.slice(0, 3).map(f => `<div class="card card-hover flex gap-4 cursor-pointer" data-action="goDetail" data-id="${f.id}">
            <div class="w-24 h-24 rounded-xl overflow-hidden flex-shrink-0"><img src="${f.img}" class="w-full h-full object-cover"/></div>
            <div class="flex-1">
              <h3 class="text-lg font-bold text-rice-white font-chinese">${f.name}</h3>
              <p class="text-rice-white/60 text-sm mt-1 line-clamp-1">${f.desc}</p>
              <div class="flex items-center justify-between mt-2">
                <span class="text-tang-gold font-bold">¥${f.price}</span>
                <span class="text-tang-gold text-sm">${f.rating} · ${f.dist}km</span>
              </div>
            </div>
          </div>`).join('')}
        </div>
      </div>`;

      html += '</div>';
      return html;
    }

    function renderExplore() {
      if (state.blindboxResult) {
        const f = state.blindboxResult;
        const isFav = state.favs.includes(f.id);
        return `<div class="min-h-screen pb-20 bg-night-blue">
          <div class="relative h-40 overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-b from-tang-gold/20 to-night-blue"></div>
            <h1 class="absolute inset-0 flex items-center justify-center text-3xl font-bold text-gradient font-chinese animate-float">探索美食盲盒</h1>
          </div>
          <div class="px-4 py-6">
            <div class="card bg-gradient-to-br from-tang-gold/20 to-night-blue/60 border-tang-gold/40 animate-fade-in">
              <div class="flex justify-between items-start mb-4">
                <h2 class="text-xl font-bold text-tang-gold font-chinese">🎉 惊喜揭晓</h2>
                <button class="text-rice-white/50" data-action="resetBlindbox">✕</button>
              </div>
              <div class="animate-slide-up">
                <div class="relative aspect-square rounded-2xl overflow-hidden mb-4">
                  <img src="${f.img}" class="w-full h-full object-cover"/>
                  <span class="absolute bottom-4 left-4 bg-changan-red/90 text-white text-xs px-2 py-1 rounded-full">${f.cat}</span>
                  <button class="absolute top-4 right-4 p-2 rounded-full bg-night-blue/50 text-white/70 hover:text-changan-red ${isFav ? 'bg-changan-red/80 text-white' : ''}" data-action="toggleFav" data-id="${f.id}">
                    <svg class="w-6 h-6 ${isFav ? 'fill-current' : ''}" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                  </button>
                </div>
                <h3 class="text-2xl font-bold text-rice-white font-chinese mb-2">${f.name}</h3>
                <p class="text-rice-white/70 mb-4">${f.desc}</p>
                <div class="flex items-center justify-between mb-4">
                  <div class="flex items-center gap-4">
                    <span class="text-2xl font-bold text-tang-gold">¥${f.price}</span>
                    <span class="text-tang-gold">${stars(f.rating)} ${f.rating}</span>
                  </div>
                  <span class="text-rice-white/50">📍 ${f.dist}km</span>
                </div>
                <div class="flex gap-2 mb-4">${f.tags.map(t => `<span class="px-3 py-1 bg-tang-gold/20 text-tang-gold text-sm rounded-full">${t}</span>`).join('')}</div>
                <div class="bg-night-blue/40 rounded-xl p-4 mb-4">
                  <p class="text-tang-gold text-sm font-medium mb-1">📜 推荐理由</p>
                  <p class="text-rice-white/60 text-sm">这款美食是西安夜市的经典代表，${f.shop}传承百年工艺，每一口都是大唐盛世的味道。</p>
                </div>
                <div class="flex gap-3">
                  <button class="flex-1 btn-primary" data-action="goDetail" data-id="${f.id}">查看详情</button>
                  <button class="flex-1 btn-secondary" data-action="navigate" data-page="checkin">去打卡</button>
                </div>
              </div>
            </div>
            <button class="w-full mt-4 py-3 text-rice-white/60 hover:text-tang-gold" data-action="resetBlindbox">再开一个盲盒</button>
          </div>
        </div>`;
      }

      return `<div class="min-h-screen pb-20 bg-night-blue">
        <div class="relative h-40 overflow-hidden">
          <div class="absolute inset-0 bg-gradient-to-b from-tang-gold/20 to-night-blue"></div>
          <h1 class="absolute inset-0 flex items-center justify-center text-3xl font-bold text-gradient font-chinese animate-float">探索美食盲盒</h1>
        </div>
        <div class="px-4 py-6">
          <div class="mb-6">
            <h2 class="text-lg font-bold text-rice-white mb-3">⚙️ 选择你的偏好</h2>
            <div class="mb-4">
              <p class="text-rice-white/60 text-sm mb-2">口味偏好</p>
              <div class="flex flex-wrap gap-2">
                <button class="px-4 py-2 rounded-full text-sm bg-night-blue/50 text-rice-white/70 border border-tang-gold/20">🌶️ 香辣</button>
                <button class="px-4 py-2 rounded-full text-sm bg-night-blue/50 text-rice-white/70 border border-tang-gold/20">🍋 酸辣</button>
                <button class="px-4 py-2 rounded-full text-sm bg-night-blue/50 text-rice-white/70 border border-tang-gold/20">🍯 香甜</button>
                <button class="px-4 py-2 rounded-full text-sm bg-night-blue/50 text-rice-white/70 border border-tang-gold/20">🥓 咸香</button>
              </div>
            </div>
            <div class="mb-4">
              <p class="text-rice-white/60 text-sm mb-2">预算范围</p>
              <div class="flex flex-wrap gap-2">
                <button class="px-4 py-2 rounded-full text-sm bg-night-blue/50 text-rice-white/70 border border-tang-gold/20">💰 10-20元</button>
                <button class="px-4 py-2 rounded-full text-sm bg-night-blue/50 text-rice-white/70 border border-tang-gold/20">💸 20-40元</button>
                <button class="px-4 py-2 rounded-full text-sm bg-night-blue/50 text-rice-white/70 border border-tang-gold/20">💎 40元以上</button>
              </div>
            </div>
          </div>
          <div class="flex justify-center">
            <div class="relative flex flex-col items-center py-8">
              <div class="absolute inset-0 bg-tang-gold/20 blur-3xl rounded-full animate-pulse"></div>
              <div class="relative w-48 h-48 cursor-pointer" data-action="openBlindbox">
                <div class="absolute -top-4 -left-4 text-2xl animate-sparkle">✨</div>
                <div class="absolute -top-2 -right-2 text-xl animate-sparkle" style="animation-delay: 0.5s">✨</div>
                <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-2xl">
                  <defs>
                    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#D4AF37"/><stop offset="50%" stop-color="#FFD700"/><stop offset="100%" stop-color="#D4AF37"/></linearGradient>

      const app = document.getElementById('app');
      if (!app) return;

      let content = '';
      switch (state.page) {
        case 'home': content = renderHome(); break;
        case 'explore': content = renderExplore(); break;
        case 'checkin': content = renderCheckin(); break;
        case 'profile': content = renderProfile(); break;
        case 'detail': content = renderDetail(); break;
      }

      app.innerHTML = content + nav();
      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll('[data-action]').forEach(el => {
        el.addEventListener('click', (e) => {
          const t = e.currentTarget;
          const action = t.dataset.action;
          const id = t.dataset.id;
          const page = t.dataset.page;

          switch (action) {
            case 'navigate':
              state.page = page;
              render();
              break;
            case 'goDetail':
              state.selectedFood = foods.find(f => f.id === id);
              state.page = 'detail';
              render();
              break;
            case 'toggleFav':
              const idx = state.favs.indexOf(id);
              if (idx > -1) state.favs.splice(idx, 1);
              else state.favs.push(id);
              render();
              break;
            case 'claimCoupon':
              const c = state.myCoupons.find(c => c.id === id);
              if (c) c.claimed = true;
              render();
              break;
            case 'openBlindbox':
              state.blindboxResult = foods[Math.floor(Math.random() * foods.length)];
              render();
              break;
            case 'resetBlindbox':
              state.blindboxResult = null;
              render();
              break;
            case 'selectCheckinFood':
              state.selectedCheckinFood = id;
              render();
              break;
            case 'takePhoto':
              const photos = [
                'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Delicious%20Chinese%20food%20night%20market&image_size=square',
                'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Xi%27an%20street%20food%20stall%20night&image_size=square',
                'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=People%20eating%20Chinese%20food%20together&image_size=square'
              ];
              state.photoUrl = photos[Math.floor(Math.random() * photos.length)];
              render();
              break;
            case 'doCheckin':
              state.checkins.push({ id: 'c' + Date.now(), food_id: state.selectedCheckinFood, timestamp: new Date().toISOString(), photo: state.photoUrl });
              state.user.points += 50;
              state.checkinSuccess = true;
              render();
              break;
            case 'resetCheckin':
              state.checkinSuccess = false;
              state.selectedCheckinFood = null;
              state.photoUrl = '';
              render();
              break;
            case 'share':
              alert('打卡海报已生成，快去分享给朋友吧！');
              break;
            case 'back':
              state.page = 'home';
              render();
              break;
          }
        });
      });
    }

    document.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
