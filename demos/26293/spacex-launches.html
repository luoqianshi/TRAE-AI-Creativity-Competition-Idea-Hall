<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpaceX Launches · Upcoming Missions</title>
<style>
    :root {
        --bg: #0a0a0a;
        --bg-elevated: #141414;
        --bg-card: #161616;
        --bg-hover: #1c1c1c;
        --border: #262626;
        --border-strong: #333333;
        --text-primary: #fafafa;
        --text-secondary: #a3a3a3;
        --text-tertiary: #737373;
        --text-muted: #525252;
        --accent: #f5f5f5;
        --status-go-bg: #1a2e1a;
        --status-go-fg: #86efac;
        --status-go-dot: #22c55e;
        --status-tbc-bg: #2e281a;
        --status-tbc-fg: #fcd34d;
        --status-tbc-dot: #eab308;
        --status-tbd-bg: #262626;
        --status-tbd-fg: #d4d4d4;
        --status-tbd-dot: #737373;
        --radius: 10px;
        --radius-sm: 6px;
        --radius-pill: 100px;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
        background: var(--bg);
        background-image:
            radial-gradient(circle at 20% 0%, rgba(255,255,255,0.025), transparent 50%),
            radial-gradient(circle at 80% 100%, rgba(255,255,255,0.02), transparent 50%);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
        color: var(--text-primary);
        min-height: 100vh;
        padding: 48px 24px 64px;
        line-height: 1.5;
    }

    .container {
        max-width: 1320px;
        margin: 0 auto;
    }

    /* ---------- Header ---------- */
    .header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
        gap: 24px;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 9px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .brand-mark svg { width: 18px; height: 18px; }

    .brand-text h1 {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--text-primary);
    }

    .brand-text p {
        font-size: 12px;
        color: var(--text-tertiary);
        margin-top: 2px;
        font-weight: 400;
    }

    .header-actions {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
    }

    .stats {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-pill);
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
    }

    .stats .sep {
        width: 1px;
        height: 12px;
        background: var(--border-strong);
        margin: 0 4px;
    }

    .stats .count {
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
    }

    .stats .live-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--status-go-dot);
        box-shadow: 0 0 0 0 rgba(34,197,94,0.6);
        animation: livePulse 2s infinite;
    }

    @keyframes livePulse {
        0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
        70% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
        100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }

    .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 16px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        color: var(--text-primary);
        font-size: 12.5px;
        font-weight: 500;
        font-family: inherit;
        border-radius: var(--radius-pill);
        cursor: pointer;
        transition: all 0.15s ease;
    }

    .btn:hover {
        background: var(--bg-hover);
        border-color: #4a4a4a;
    }

    .btn:active { transform: scale(0.97); }

    .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .btn svg {
        width: 14px;
        height: 14px;
        transition: transform 0.4s ease;
    }

    .btn:hover svg.spin { transform: rotate(180deg); }

    /* ---------- Grid ---------- */
    .launch-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 18px;
    }

    /* ---------- Card ---------- */
    .launch-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        transition: all 0.2s ease;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .launch-card:hover {
        border-color: #404040;
        background: #181818;
    }

    .launch-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
        opacity: 0;
        transition: opacity 0.2s ease;
    }

    .launch-card:hover::before { opacity: 1; }

    .card-top {
        padding: 18px 20px 16px;
        border-bottom: 1px solid var(--border);
    }

    .mission-line {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
    }

    .mission-name {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: -0.01em;
        line-height: 1.35;
    }

    .mission-index {
        font-size: 11px;
        color: var(--text-muted);
        font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 6px;
    }

    .status-badge {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 10.5px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: var(--radius-pill);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
    }

    .status-badge::before {
        content: '';
        width: 5px;
        height: 5px;
        border-radius: 50%;
    }

    .status-go {
        background: var(--status-go-bg);
        color: var(--status-go-fg);
        border: 1px solid rgba(34,197,94,0.2);
    }
    .status-go::before { background: var(--status-go-dot); }

    .status-tbc {
        background: var(--status-tbc-bg);
        color: var(--status-tbc-fg);
        border: 1px solid rgba(234,179,8,0.2);
    }
    .status-tbc::before { background: var(--status-tbc-dot); }

    .status-tbd {
        background: var(--status-tbd-bg);
        color: var(--status-tbd-fg);
        border: 1px solid var(--border-strong);
    }
    .status-tbd::before { background: var(--status-tbd-dot); }

    /* ---------- Card body ---------- */
    .card-body {
        padding: 16px 20px 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    /* Countdown */
    .countdown-block {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 14px 16px;
        margin-bottom: 16px;
    }

    .countdown-label {
        font-size: 10px;
        font-weight: 600;
        color: var(--text-muted);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .countdown-label::before {
        content: '';
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--text-muted);
    }

    .countdown-timer {
        font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, 'Courier New', monospace;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
        line-height: 1.2;
    }

    .countdown-timer.past {
        color: var(--text-tertiary);
    }

    .local-time {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed var(--border);
        font-size: 12px;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .local-time .label {
        color: var(--text-muted);
        font-size: 11px;
    }

    /* Details */
    .details {
        display: flex;
        flex-direction: column;
    }

    .detail-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        font-size: 13px;
        border-bottom: 1px solid rgba(38,38,38,0.6);
    }

    .detail-row:last-child { border-bottom: none; }

    .detail-label {
        color: var(--text-tertiary);
        font-weight: 500;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .detail-value {
        color: var(--text-primary);
        text-align: right;
        font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
        font-size: 12.5px;
        font-weight: 500;
        max-width: 60%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .detail-value.muted { color: var(--text-tertiary); }

    .tag {
        display: inline-block;
        padding: 2px 8px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-pill);
        font-size: 10.5px;
        font-weight: 500;
        color: var(--text-secondary);
    }

    /* Recovery + description */
    .recovery {
        margin-top: 14px;
        padding: 10px 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .recovery-icon {
        width: 28px;
        height: 28px;
        border-radius: var(--radius-sm);
        background: var(--bg-elevated);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .recovery-icon svg { width: 14px; height: 14px; color: var(--text-secondary); }

    .recovery-text {
        font-size: 12px;
        color: var(--text-secondary);
        line-height: 1.4;
    }

    .recovery-text strong {
        color: var(--text-primary);
        font-weight: 600;
        display: block;
        margin-bottom: 1px;
        font-size: 12px;
    }

    .description {
        margin-top: 12px;
        font-size: 12px;
        color: var(--text-tertiary);
        line-height: 1.55;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    /* ---------- Footer ---------- */
    .footer-note {
        text-align: center;
        margin-top: 48px;
        padding-top: 28px;
        border-top: 1px solid var(--border);
        font-size: 11.5px;
        color: var(--text-muted);
        line-height: 1.6;
    }

    /* ---------- States ---------- */
    .error-message {
        grid-column: 1 / -1;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-left: 2px solid #888;
        padding: 20px 24px;
        border-radius: var(--radius);
        color: var(--text-secondary);
        font-size: 13px;
        text-align: center;
    }

    .skeleton-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        height: 440px;
        overflow: hidden;
        position: relative;
    }

    .skeleton-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
        animation: shimmer 1.6s infinite;
    }

    @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 640px) {
        body { padding: 28px 16px 48px; }
        .header { margin-bottom: 28px; }
        .launch-grid {
            grid-template-columns: 1fr;
            gap: 14px;
        }
        .countdown-timer { font-size: 19px; }
        .brand-text h1 { font-size: 15px; }
    }
</style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <header class="header">
        <div class="brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
                    <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
                    <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
                    <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
                </svg>
            </div>
            <div class="brand-text">
                <h1>SpaceX · Upcoming Launches</h1>
                <p>Launch Library 2 API · Core ID · Recovery · CST (UTC+8)</p>
            </div>
        </div>
        <div class="header-actions">
            <div class="stats" id="statsInfo">
                <span class="live-dot"></span>
                <span>Loading<span class="count" id="statCount"></span></span>
            </div>
            <button class="btn" id="forceRefreshBtn">
                <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                    <path d="M21 3v5h-5"/>
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                    <path d="M3 21v-5h5"/>
                </svg>
                Refresh
            </button>
        </div>
    </header>

    <!-- Grid -->
    <main id="launchContainer" class="launch-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
    </main>

    <footer class="footer-note">
        All times converted to China Standard Time (UTC+8) · Countdown updates every second<br>
        Data source: The Space Devs (LL2) · Free quota: 15 requests/hour/IP · Page cache: 10 minutes
    </footer>
</div>

<script>
    // ---------- 配置 ----------
    const API_BASE = 'https://ll.thespacedevs.com/2.2.0/launch/upcoming/';
    const SEARCH_PARAMS = '?search=SpaceX&limit=25&mode=detailed';
    const CACHE_KEY = 'spacex_launches_cache_v2';
    const CACHE_DURATION = 10 * 60 * 1000;

    // 工具：本地化时间
    function formatLocalTime(utcString) {
        if (!utcString) return 'TBD';
        try {
            const date = new Date(utcString);
            if (isNaN(date.getTime())) return utcString;
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}`;
        } catch (e) {
            return utcString;
        }
    }

    function getCountdown(targetUtc) {
        const now = new Date();
        const target = new Date(targetUtc);
        if (isNaN(target.getTime())) return { days: 0, hours: 0, minutes: 0, seconds: 0, isPast: true };
        const diffMs = target - now;
        if (diffMs <= 0) return { days: 0, hours: 0, minutes: 0, seconds: 0, isPast: true };
        const totalSeconds = Math.floor(diffMs / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        return { days, hours, minutes, seconds, isPast: false };
    }

    function formatCountdownText(countdown) {
        if (countdown.isPast) return 'LAUNCHED';
        const pad = (n) => String(n).padStart(2, '0');
        if (countdown.days > 0) {
            return `T-${countdown.days}d ${pad(countdown.hours)}:${pad(countdown.minutes)}:${pad(countdown.seconds)}`;
        }
        return `T-${pad(countdown.hours)}:${pad(countdown.minutes)}:${pad(countdown.seconds)}`;
    }

    function getStatusClass(statusAbbrev) {
        if (!statusAbbrev) return 'status-tbd';
        const s = statusAbbrev.toLowerCase();
        if (s === 'go') return 'status-go';
        if (s === 'tbc') return 'status-tbc';
        return 'status-tbd';
    }

    // 从第一级 (Core) 提取芯级 + 着陆信息
    // LL2 2.2.0 结构: rocket.launcher_stage[0].launcher + .landing
    function getFirstStage(launch) {
        const stages = launch.rocket && launch.rocket.launcher_stage;
        if (stages && stages.length) {
            return stages[0];
        }
        return null;
    }

    function getCoreSerial(launch) {
        const stage = getFirstStage(launch);
        if (stage && stage.launcher && stage.launcher.serial_number) {
            return stage.launcher.serial_number;
        }
        // 兼容老结构
        if (launch.rocket && launch.rocket.core_serial) return launch.rocket.core_serial;
        return 'TBD';
    }

    function getCoreInfo(launch) {
        const stage = getFirstStage(launch);
        if (!stage || !stage.launcher) return {};
        const lc = stage.launcher;
        return {
            serial: lc.serial_number,
            flightProven: lc.flight_proven,
            flights: lc.flights,                 // 历史总飞行次数
            thisFlight: stage.launcher_flight_number,  // 本次是第几次
            reused: stage.reused,
            status: lc.status
        };
    }

    function getRecoveryInfo(launch) {
        const stage = getFirstStage(launch);
        const landing = stage && stage.landing;
        if (!landing) return { landingType: 'No recovery planned', landingShip: '', landingTypeLabel: 'None', isAttempt: false, downrange: null };

        const attempt = landing.attempt;
        const success = landing.success;
        const type = landing.type && landing.type.name;     // e.g. "Autonomous Spaceport Drone Ship"
        const typeAbbrev = landing.type && landing.type.abbrev;  // e.g. "ASDS"
        const shipName = landing.location && landing.location.name;  // e.g. "Of Course I Still Love You"
        const shipAbbrev = landing.location && landing.location.abbrev;
        const downrange = landing.downrange_distance;

        if (!attempt) {
            return { landingType: 'No landing attempt', landingShip: '', landingTypeLabel: typeAbbrev || 'Expendable', isAttempt: false, downrange };
        }

        let label;
        if (success === true) label = 'Recovered';
        else if (success === false) label = 'Failed';
        else label = 'Landing attempt';   // success === null (即将进行)

        const displayType = typeAbbrev ? `${typeAbbrev}` : (type || 'Landing');
        const displayShip = shipAbbrev ? shipAbbrev : (shipName || '');

        return {
            landingType: displayType,
            landingShip: displayShip,
            landingTypeLabel: label,
            isAttempt: true,
            downrange
        };
    }

    function getRocketSpecs(launch) {
        const config = launch.rocket && launch.rocket.configuration;
        if (!config) return {};
        return {
            length: config.length ? `${config.length} m` : null,
            diameter: config.diameter ? `${config.diameter} m` : null,
            leoCapacity: config.leo_capacity ? `${config.leo_capacity} kg` : null,
            stages: config.stages,
            reusable: config.reusable
        };
    }

    function getMissionDescription(launch) {
        if (launch.mission && launch.mission.description) return launch.mission.description;
        if (launch.mission && launch.mission.name) return `${launch.mission.name} mission — details TBD.`;
        return 'No mission description available.';
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function escapeAttr(str) {
        return escapeHtml(str).replace(/"/g, '&quot;');
    }

    // ---------- 渲染 ----------
    function renderLaunchCard(launch, idx) {
        const missionName = launch.name || 'SpaceX Mission';
        const netTime = launch.net;
        const localCST = formatLocalTime(netTime);
        const statusName = (launch.status && launch.status.name) || 'Updating';
        const statusAbbrev = (launch.status && launch.status.abbrev) || '';
        const statusClass = getStatusClass(statusAbbrev);
        const countdown = getCountdown(netTime);
        const countdownText = formatCountdownText(countdown);
        const provider = (launch.launch_service_provider && launch.launch_service_provider.name) || 'SpaceX';
        const padName = (launch.pad && launch.pad.name) || 'Pad TBC';
        const locationName = (launch.pad && launch.pad.location && launch.pad.location.name) || '';
        const fullPad = padName + (locationName ? ` · ${locationName}` : '');

        const coreSerial = getCoreSerial(launch);
        const coreInfo = getCoreInfo(launch);
        const recovery = getRecoveryInfo(launch);
        const missionDesc = getMissionDescription(launch);
        const specs = getRocketSpecs(launch);
        const rocketName = (launch.rocket && launch.rocket.configuration && (launch.rocket.configuration.full_name || launch.rocket.configuration.name)) || 'Falcon 9';

        // 飞行履历标签：复用次数 / 全新
        let flightTag = '';
        if (coreInfo.reused !== undefined) {
            if (coreInfo.reused) {
                const nth = coreInfo.thisFlight ? `#${coreInfo.thisFlight}` : '';
                flightTag = `Reused ${nth}`.trim();
            } else {
                flightTag = 'Brand new';
            }
        }

        // 芯级详情行（仅在有数据时显示）
        let coreDetailLine = '';
        if (coreInfo.flights !== undefined && coreInfo.flights !== null) {
            coreDetailLine = `${coreInfo.flights} prior flights`;
        }

        let specsLine = '';
        const specParts = [];
        if (specs.length) specParts.push(specs.length);
        if (specs.diameter) specParts.push(`Ø ${specs.diameter}`);
        if (specs.leoCapacity) specParts.push(`LEO ${specs.leoCapacity}`);
        specsLine = specParts.join(' · ');

        // 回收区文案
        let recoveryBody = '';
        if (recovery.isAttempt) {
            const parts = [];
            if (recovery.landingType) parts.push(recovery.landingType);
            if (recovery.landingShip) parts.push(recovery.landingShip);
            if (recovery.downrange) parts.push(`${recovery.downrange} km`);
            recoveryBody = parts.join(' · ') || 'Landing attempt';
        } else {
            recoveryBody = recovery.landingType || 'No recovery planned';
        }

        const cardId = `card-${idx}-${Date.now()}`;
        const indexLabel = String(idx + 1).padStart(2, '0');

        return `
            <article class="launch-card" data-net="${escapeAttr(netTime || '')}">
                <div class="card-top">
                    <div class="mission-index">MISSION ${indexLabel}</div>
                    <div class="mission-line">
                        <div class="mission-name">${escapeHtml(missionName)}</div>
                        <span class="status-badge ${statusClass}">${escapeHtml(statusName)}</span>
                    </div>
                </div>
                <div class="card-body">
                    <div class="countdown-block">
                        <div class="countdown-label">Countdown</div>
                        <div class="countdown-timer${countdown.isPast ? ' past' : ''}" id="timer-${cardId}">${countdownText}</div>
                        <div class="local-time">
                            <span class="label">NET</span>
                            <span>${localCST} · UTC+8</span>
                        </div>
                    </div>

                    <div class="details">
                        <div class="detail-row">
                            <span class="detail-label">Rocket</span>
                            <span class="detail-value">${escapeHtml(rocketName)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Core</span>
                            <span class="detail-value ${coreSerial === 'TBD' ? 'muted' : ''}">${escapeHtml(coreSerial)}${coreDetailLine ? ` <span style="color:var(--text-muted)">· ${escapeHtml(coreDetailLine)}</span>` : ''}</span>
                        </div>
                        ${flightTag ? `
                        <div class="detail-row">
                            <span class="detail-label">Stage</span>
                            <span class="detail-value"><span class="tag">${escapeHtml(flightTag)}</span></span>
                        </div>` : ''}
                        <div class="detail-row">
                            <span class="detail-label">Pad</span>
                            <span class="detail-value" title="${escapeAttr(fullPad)}">${escapeHtml(fullPad)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Operator</span>
                            <span class="detail-value">${escapeHtml(provider)}</span>
                        </div>
                        ${specsLine ? `
                        <div class="detail-row">
                            <span class="detail-label">Specs</span>
                            <span class="detail-value">${escapeHtml(specsLine)}</span>
                        </div>` : ''}
                    </div>

                    <div class="recovery">
                        <div class="recovery-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                                <path d="M21 3v6h-6"/>
                            </svg>
                        </div>
                        <div class="recovery-text">
                            <strong>Recovery · ${escapeHtml(recovery.landingTypeLabel)}</strong>
                            ${escapeHtml(recoveryBody)}
                        </div>
                    </div>

                    <p class="description">${escapeHtml(missionDesc)}</p>
                </div>
            </article>
        `;
    }

    function updateAllCountdowns() {
        const cards = document.querySelectorAll('.launch-card');
        cards.forEach(card => {
            const netAttr = card.getAttribute('data-net');
            if (!netAttr) return;
            const countdown = getCountdown(netAttr);
            const timerDiv = card.querySelector('.countdown-timer');
            if (timerDiv) {
                timerDiv.innerText = formatCountdownText(countdown);
                if (countdown.isPast) timerDiv.classList.add('past');
                else timerDiv.classList.remove('past');
            }
        });
    }

    let globalInterval = null;
    function startGlobalCountdownUpdater() {
        if (globalInterval) clearInterval(globalInterval);
        globalInterval = setInterval(updateAllCountdowns, 1000);
    }
    function stopGlobalUpdater() {
        if (globalInterval) { clearInterval(globalInterval); globalInterval = null; }
    }

    // ---------- 数据 ----------
    async function fetchLaunches(force = false) {
        if (!force) {
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                try {
                    const { timestamp, data } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_DURATION) return data;
                } catch (e) {}
            }
        }
        const url = `${API_BASE}${SEARCH_PARAMS}`;
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const json = await response.json();
            const launches = json.results || [];
            localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data: launches }));
            return launches;
        } catch (err) {
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                try {
                    const { data } = JSON.parse(cached);
                    return data;
                } catch (e) {}
            }
            throw err;
        }
    }

    function updateStats(launchCount, isFromCache = false) {
        const statsDiv = document.getElementById('statsInfo');
        if (!statsDiv) return;
        const now = new Date();
        const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });
        const cacheFlag = isFromCache ? ' · cached' : '';
        statsDiv.innerHTML = `
            <span class="live-dot"></span>
            <span><span class="count">${launchCount}</span> upcoming</span>
            <span class="sep"></span>
            <span style="color:var(--text-tertiary);font-variant-numeric:tabular-nums">${timeStr}${cacheFlag}</span>
        `;
    }

    async function renderLaunches(forceRefresh = false) {
        const container = document.getElementById('launchContainer');
        if (!container) return;
        container.innerHTML = '<div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>';
        try {
            let launches = await fetchLaunches(forceRefresh);
            if (!launches || launches.length === 0) {
                container.innerHTML = '<div class="error-message">No upcoming SpaceX launches found. Please retry later.</div>';
                updateStats(0);
                return;
            }
            const now = new Date();
            const upcomingLaunches = launches.filter(launch => {
                if (!launch.net) return false;
                try { return new Date(launch.net) > now; } catch(e) { return false; }
            }).slice(0, 30);

            if (upcomingLaunches.length === 0) {
                container.innerHTML = '<div class="error-message">No imminent SpaceX launches scheduled. Check back soon.</div>';
                updateStats(0);
                return;
            }

            let cardsHtml = '';
            upcomingLaunches.forEach((launch, idx) => {
                cardsHtml += renderLaunchCard(launch, idx);
            });
            container.innerHTML = cardsHtml;

            const cachedRaw = localStorage.getItem(CACHE_KEY);
            let isCached = false;
            if (cachedRaw && !forceRefresh) {
                const { timestamp } = JSON.parse(cachedRaw);
                if (Date.now() - timestamp < CACHE_DURATION) isCached = true;
            }
            updateStats(upcomingLaunches.length, isCached);
            stopGlobalUpdater();
            startGlobalCountdownUpdater();
        } catch (err) {
            container.innerHTML = `<div class="error-message">Failed to load data: ${escapeHtml(err.message)}<br>Check your network or retry manually (API limit: 15 requests/hour).</div>`;
            updateStats(0);
        }
    }

    async function forceRefreshHandler() {
        const btn = document.getElementById('forceRefreshBtn');
        if (btn) {
            btn.disabled = true;
        }
        try {
            await renderLaunches(true);
        } finally {
            if (btn) {
                btn.disabled = false;
            }
        }
    }

    function init() {
        renderLaunches(false);
        const refreshBtn = document.getElementById('forceRefreshBtn');
        if (refreshBtn) refreshBtn.addEventListener('click', forceRefreshHandler);
        setInterval(() => {
            fetchLaunches(true).catch(e => console.warn('Background prefetch failed', e));
        }, 12 * 60 * 1000);
    }

    init();
</script>
</body>
</html>
