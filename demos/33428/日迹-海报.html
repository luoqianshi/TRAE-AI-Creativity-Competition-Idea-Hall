<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日迹 Daily Tracker - TRAE 创新赛 2026</title>
<style>
  /* ===== RESET & BASE ===== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --amber: #F0A060;
    --amber-light: #FFD4A8;
    --purple: #7C5CE7;
    --purple-light: #A78BFA;
    --brown: #3D3226;
    --brown-light: #5C4A3A;
    --cream: #FFF8F0;
    --glass-bg: rgba(255, 248, 240, 0.12);
    --glass-border: rgba(255, 248, 240, 0.18);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ===== POSTER CONTAINER ===== */
  .poster {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--brown);
  }

  /* ===== BACKGROUND LAYERS ===== */
  .poster-bg {
    position: absolute;
    inset: 0;
    background: url('assets/poster-bg.jpg') center/cover no-repeat;
    opacity: 0.35;
    z-index: 0;
  }

  .poster-overlay {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%, rgba(124, 92, 231, 0.25) 0%, transparent 70%),
      radial-gradient(ellipse 60% 50% at 30% 70%, rgba(240, 160, 96, 0.2) 0%, transparent 60%),
      linear-gradient(180deg, rgba(61, 50, 38, 0.6) 0%, rgba(61, 50, 38, 0.85) 100%);
    z-index: 1;
  }

  /* ===== CONTENT ===== */
  .poster-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    max-width: 960px;
    width: 100%;
    gap: 0;
  }

  /* ===== TOP TAG ===== */
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 18px;
    border-radius: 100px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--amber-light);
    margin-bottom: 2rem;
    animation: fadeSlideUp 0.8s ease-out 0.1s both;
  }

  .tag-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
    animation: pulse 2s ease-in-out infinite;
  }

  /* ===== MAIN TITLE ===== */
  .title {
    font-size: clamp(4rem, 12vw, 8rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--amber) 0%, var(--amber-light) 30%, var(--purple-light) 70%, var(--purple) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.6rem;
    animation: fadeSlideUp 0.8s ease-out 0.25s both;
    filter: drop-shadow(0 4px 24px rgba(240, 160, 96, 0.3));
  }

  /* ===== SUBTITLE ===== */
  .subtitle {
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    font-weight: 400;
    color: rgba(255, 248, 240, 0.85);
    letter-spacing: 0.12em;
    margin-bottom: 1.2rem;
    animation: fadeSlideUp 0.8s ease-out 0.4s both;
  }

  /* ===== ONE-LINER ===== */
  .oneliner {
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    font-weight: 400;
    color: rgba(255, 248, 240, 0.55);
    letter-spacing: 0.25em;
    margin-bottom: 2.8rem;
    animation: fadeSlideUp 0.8s ease-out 0.55s both;
  }

  .oneliner span {
    display: inline-block;
    margin: 0 0.3em;
    position: relative;
  }
  .oneliner span::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--amber);
    transform: translate(-50%, -50%);
    opacity: 0.6;
  }
  .oneliner span:first-child::before { display: none; }

  /* ===== FEATURE CARDS ===== */
  .features {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    width: 100%;
    margin-bottom: 2.8rem;
    animation: fadeSlideUp 0.8s ease-out 0.7s both;
  }

  .feature-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.7rem;
    padding: 1.4rem 0.8rem;
    border-radius: 16px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: transform 0.3s ease, background 0.3s ease;
    cursor: default;
  }

  .feature-card:hover {
    transform: translateY(-4px);
    background: rgba(255, 248, 240, 0.18);
  }

  .feature-icon {
    width: 44px; height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(240, 160, 96, 0.2), rgba(124, 92, 231, 0.2));
  }

  .feature-icon svg {
    width: 22px; height: 22px;
    stroke: var(--amber-light);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .feature-name {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--cream);
    letter-spacing: 0.04em;
  }

  .feature-desc {
    font-size: 0.78rem;
    color: rgba(255, 248, 240, 0.5);
    line-height: 1.4;
  }

  /* ===== TECH BAR ===== */
  .tech-bar {
    display: inline-flex;
    align-items: center;
    gap: 0;
    padding: 10px 24px;
    border-radius: 100px;
    background: rgba(61, 50, 38, 0.5);
    border: 1px solid rgba(255, 248, 240, 0.08);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: rgba(255, 248, 240, 0.5);
    margin-bottom: 1.6rem;
    animation: fadeSlideUp 0.8s ease-out 0.85s both;
  }

  .tech-item {
    padding: 0 0.6em;
    white-space: nowrap;
  }

  .tech-sep {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: rgba(255, 248, 240, 0.2);
    flex-shrink: 0;
  }

  /* ===== FOOTER ===== */
  .footer {
    font-size: 0.72rem;
    color: rgba(255, 248, 240, 0.3);
    letter-spacing: 0.1em;
    animation: fadeSlideUp 0.8s ease-out 1s both;
  }

  /* ===== DECORATIVE ELEMENTS ===== */
  .deco-glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
  }
  .deco-glow--amber {
    width: 400px; height: 400px;
    background: rgba(240, 160, 96, 0.12);
    top: -10%; right: -5%;
    animation: floatGlow 8s ease-in-out infinite alternate;
  }
  .deco-glow--purple {
    width: 350px; height: 350px;
    background: rgba(124, 92, 231, 0.1);
    bottom: -8%; left: -5%;
    animation: floatGlow 10s ease-in-out infinite alternate-reverse;
  }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeSlideUp {
    from {
      opacity: 0;
      transform: translateY(24px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  @keyframes floatGlow {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(20px, -15px) scale(1.1); }
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .features {
      grid-template-columns: repeat(2, 1fr);
      gap: 0.7rem;
    }
    .feature-card {
      padding: 1rem 0.6rem;
    }
    .poster-content {
      padding: 1.5rem;
    }
    .tag { margin-bottom: 1.2rem; }
    .oneliner { margin-bottom: 1.8rem; letter-spacing: 0.15em; }
    .tech-bar { padding: 8px 16px; font-size: 0.7rem; }
  }

  @media (max-width: 480px) {
    .features {
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }
    .feature-icon { width: 36px; height: 36px; }
    .feature-icon svg { width: 18px; height: 18px; }
    .feature-name { font-size: 0.85rem; }
    .feature-desc { font-size: 0.7rem; }
  }

  /* ===== SUBTLE NOISE TEXTURE ===== */
  .poster::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
  }
</style>
</head>
<body>
<div class="poster">
  <!-- Background -->
  <div class="poster-bg"></div>
  <div class="poster-overlay"></div>

  <!-- Decorative glows -->

  <div class="deco-glow deco-glow--purple"></div>

  <!-- Content -->
  <div class="poster-content">

    <div class="tag">

      <!-- Card 4: 日志回顾 -->
      <div class="feature-card">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24">

        <span class="feature-name">日志回顾</span>
        <span class="feature-desc">每日复盘成长</span>
      </div>
    </div>

    <!-- Tech Bar -->
    <div class="tech-bar">
      <span class="tech-item">单 HTML 文件</span>
      <span class="tech-sep"></span>
      <span class="tech-item">localStorage</span>
      <span class="tech-sep"></span>
      <span class="tech-item">OpenAI API</span>

      <span class="tech-item">CSS 动画</span>
    </div>

    <!-- Footer -->
    <p class="footer">&copy; 2026 日迹 Daily Tracker</p>

  </div>
</div>
</body>
</html>
