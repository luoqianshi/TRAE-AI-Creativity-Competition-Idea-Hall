<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAD 图纸智能审查</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 0.5s ease-out forwards; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useRef, useEffect } = React;

    // 图标组件 - 使用内联SVG替代lucide
    const Icon = ({ name, className = "w-5 h-5", size }) => {
      const icons = {
        upload: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>,
        fileText: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>,
        checkCircle: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
        alertTriangle: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
        xCircle: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
        eye: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>,
        download: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
        refreshCw: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
        settings: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
        layers: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>,
        ruler: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2zm4-2v4m4-4v6m4-6v4m4-4v6" /></svg>,
        box: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>,
        fileCode: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" /></svg>,
        chevronRight: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" /></svg>,
        zoomIn: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7" /></svg>,
        zoomOut: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7" /></svg>,
        move: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18m0 0l7-7m-7 7l-7-7" /></svg>,
        maximize2: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" /></svg>,
        info: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
        clock: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
        checkCheck: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
        alertCircle: <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      };
      return icons[name] || null;
    };

    // 审查结果数据
    const mockReviewResult = {
      totalIssues: 12,
      errors: 3,
      warnings: 5,
      infos: 4,
      reviewedAt: '2026-07-03 14:32:18',
      fileName: 'bearing_assembly.dxf',
      issues: [
        { id: '1', category: '尺寸标注', severity: 'error', description: '主视图中Φ50H7孔的尺寸标注缺少公差带说明', location: '主视图 A-A', rule: 'GB/T 4458.4-2003 尺寸注法' },
        { id: '2', category: '视图布局', severity: 'error', description: '左视图与主视图投影关系不正确，存在错位', location: '左视图', rule: 'GB/T 4458.6-2002 图样画法' },
        { id: '3', category: '图层规范', severity: 'error', description: '存在未命名图层"Layer 0"，不符合企业图层命名规范', location: '全局', rule: '企业标准 Q/JS-001' },
        { id: '4', category: '尺寸标注', severity: 'warning', description: '部分尺寸数字高度为2.5mm，建议使用3.5mm标准字高', location: '俯视图', rule: 'GB/T 14691-1993 技术制图 字体' },
        { id: '5', category: '形位公差', severity: 'warning', description: '轴承孔同轴度公差缺少基准符号', location: '主视图 Φ50H7', rule: 'GB/T 1182-2008 几何公差' },
        { id: '6', category: '表面粗糙度', severity: 'warning', description: '重要配合面未标注表面粗糙度要求', location: '主视图 右端面', rule: 'GB/T 131-2006 产品几何技术规范' },
        { id: '7', category: '标题栏', severity: 'warning', description: '标题栏中"材料"栏未填写', location: '标题栏', rule: 'GB/T 10609.1-2008 标题栏' },
        { id: '8', category: '视图布局', severity: 'warning', description: '局部放大图比例标注位置不规范', location: '局部放大图 I', rule: 'GB/T 4458.6-2002' },
        { id: '9', category: '尺寸标注', severity: 'info', description: '建议将重复尺寸移至更清晰的位置', location: '俯视图', rule: '最佳实践' },
        { id: '10', category: '图层规范', severity: 'info', description: '中心线线型建议使用标准点画线', location: '全局', rule: 'GB/T 17450-1998' },
        { id: '11', category: '技术要求', severity: 'info', description: '建议补充热处理技术要求', location: '技术要求栏', rule: '最佳实践' },
        { id: '12', category: '标题栏', severity: 'info', description: '建议添加图纸版本号', location: '标题栏', rule: '企业标准 Q/JS-002' }
      ]
    };

    const reviewCategories = [
      { name: '尺寸标注', icon: 'ruler' },
      { name: '视图布局', icon: 'layers' },
      { name: '形位公差', icon: 'box' },
      { name: '表面粗糙度', icon: 'fileText' },
      { name: '图层规范', icon: 'fileCode' },
      { name: '标题栏', icon: 'fileText' }
    ];

    function CadReview() {
      const [isDragging, setIsDragging] = useState(false);
      const [file, setFile] = useState(null);
      const [isReviewing, setIsReviewing] = useState(false);
      const [reviewResult, setReviewResult] = useState(null);
      const [selectedCategory, setSelectedCategory] = useState(null);
      const [selectedIssue, setSelectedIssue] = useState(null);
      const [zoom, setZoom] = useState(1);
      const canvasRef = useRef(null);
      const fileInputRef = useRef(null);

      const handleDragOver = useCallback((e) => {
        e.preventDefault();
        setIsDragging(true);
      }, []);

      const handleDragLeave = useCallback((e) => {
        e.preventDefault();
        setIsDragging(false);
      }, []);

      const handleDrop = useCallback((e) => {
        e.preventDefault();
        setIsDragging(false);
        const droppedFile = e.dataTransfer.files[0];
        if (droppedFile) handleFile(droppedFile);
      }, []);

      const handleFileInput = (e) => {
        const selectedFile = e.target.files && e.target.files[0];
        if (selectedFile) handleFile(selectedFile);
      };

      const handleFile = (f) => {
        const validExtensions = ['.dxf', '.dwg', '.png', '.jpg', '.jpeg', '.pdf'];
        const fileName = f.name.toLowerCase();
        const isValid = validExtensions.some(ext => fileName.endsWith(ext));
        if (isValid) {
          setFile(f);
          setReviewResult(null);
          setSelectedCategory(null);
          setSelectedIssue(null);
        } else {
          alert('请上传有效的CAD图纸文件（.dxf, .dwg, .png, .jpg, .pdf）');
        }
      };

      const startReview = () => {
        if (!file) return;
        setIsReviewing(true);
        setTimeout(() => {
          setIsReviewing(false);
          setReviewResult({
            ...mockReviewResult,
            fileName: file.name,
            reviewedAt: new Date().toLocaleString('zh-CN')
          });
        }, 2000);
      };

      const resetReview = () => {
        setFile(null);
        setReviewResult(null);
        setSelectedCategory(null);
        setSelectedIssue(null);
        setZoom(1);
      };

      const filteredIssues = reviewResult ? reviewResult.issues.filter(
        issue => !selectedCategory || issue.category === selectedCategory
      ) : [];

      const getSeverityIcon = (severity) => {
        const colorMap = { error: 'text-red-500', warning: 'text-yellow-500', info: 'text-blue-500' };
        const nameMap = { error: 'xCircle', warning: 'alertTriangle', info: 'info' };
        return <Icon name={nameMap[severity]} className={"w-5 h-5 " + (colorMap[severity] || 'text-gray-500')} />;
      };

      const getSeverityBadgeClass = (severity) => {
        switch (severity) {
          case 'error': return 'bg-red-50 text-red-700 border-red-200';
          case 'warning': return 'bg-yellow-50 text-yellow-700 border-yellow-200';
          case 'info': return 'bg-blue-50 text-blue-700 border-blue-200';
          default: return 'bg-gray-50 text-gray-700 border-gray-200';
        }
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas || !file) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        if (file.type.startsWith('image/')) {
          const img = new Image();
          img.onload = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const scale = Math.min(canvas.width / img.width, canvas.height / img.height) * zoom;
            const x = (canvas.width - img.width * scale) / 2;
            const y = (canvas.height - img.height * scale) / 2;
            ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
          };
          img.src = URL.createObjectURL(file);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#f8fafc';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          const cx = canvas.width / 2;
          const cy = canvas.height / 2;
          const s = zoom;
          ctx.strokeStyle = '#1e293b';
          ctx.lineWidth = 2 * s;
          ctx.beginPath();
          ctx.rect(cx - 150 * s, cy - 100 * s, 300 * s, 200 * s);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx - 50 * s, cy, 40 * s, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx + 50 * s, cy, 40 * s, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = '#64748b';
          ctx.lineWidth = 1 * s;
          ctx.setLineDash([5 * s, 3 * s]);
          ctx.beginPath();
          ctx.moveTo(cx - 160 * s, cy);
          ctx.lineTo(cx + 160 * s, cy);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(cx, cy - 110 * s);
          ctx.lineTo(cx, cy + 110 * s);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = '#1e293b';
          ctx.font = (14 * s) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('轴承座示意图', cx, cy + 130 * s);
        }
      }, [file, zoom]);

      const cn = (...classes) => classes.filter(Boolean).join(' ');

      return (
        <div className="min-h-screen bg-slate-50">
          <header className="bg-white border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center">
                  <Icon name="checkCheck" className="w-6 h-6 text-white" />
                </div>
                <div>
                  <h1 className="text-xl font-bold text-slate-900">CAD 图纸智能审查</h1>
                  <p className="text-sm text-slate-500">自动化机械制图规范检查</p>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <button className="flex items-center gap-2 px-4 py-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-colors">
                  <Icon name="settings" className="w-5 h-5" />
                  <span>审查规则</span>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-6 py-8">
            {!file ? (
              <div className="max-w-2xl mx-auto">
                <div className="text-center mb-8">
                  <h2 className="text-2xl font-bold text-slate-900 mb-2">上传CAD图纸开始审查</h2>
                  <p className="text-slate-500">支持 DXF、DWG、PDF 及图片格式，自动检测制图规范问题</p>
                </div>

                <div
                  onDragOver={handleDragOver}
                  onDragLeave={handleDragLeave}
                  onDrop={handleDrop}
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}
                  className={cn(
                    "border-2 border-dashed rounded-2xl p-12 text-center cursor-pointer transition-all duration-300",
                    isDragging ? "border-blue-500 bg-blue-50 scale-[1.02]" : "border-slate-300 bg-white hover:border-blue-400 hover:bg-blue-50/50"
                  )}
                >
                  <input
                    ref={fileInputRef}
                    type="file"
                    accept=".dxf,.dwg,.pdf,.png,.jpg,.jpeg"
                    onChange={handleFileInput}
                    className="hidden"
                  />
                  <div className="w-16 h-16 mx-auto mb-6 bg-gradient-to-br from-blue-100 to-indigo-100 rounded-2xl flex items-center justify-center">
                    <Icon name="upload" className="w-8 h-8 text-blue-600" />
                  </div>
                  <p className="text-lg font-semibold text-slate-800 mb-2">
                    {isDragging ? "释放以上传文件" : "拖拽文件到此处，或点击选择"}
                  </p>
                  <p className="text-sm text-slate-500 mb-6">支持 .dxf, .dwg, .pdf, .png, .jpg 格式</p>
                  <button className="px-6 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-medium hover:from-blue-700 hover:to-indigo-700 transition-all shadow-lg shadow-blue-500/25">
                    选择文件
                  </button>
                </div>

                <div className="mt-12 grid grid-cols-3 gap-6">
                  <div className="bg-white rounded-xl p-6 border border-slate-200">
                    <div className="w-12 h-12 bg-red-50 rounded-xl flex items-center justify-center mb-4">
                      <Icon name="xCircle" className="w-6 h-6 text-red-500" />
                    </div>
                    <h3 className="font-semibold text-slate-900 mb-1">错误检测</h3>
                    <p className="text-sm text-slate-500">自动识别严重的制图错误</p>
                  </div>
                  <div className="bg-white rounded-xl p-6 border border-slate-200">
                    <div className="w-12 h-12 bg-yellow-50 rounded-xl flex items-center justify-center mb-4">
                      <Icon name="alertTriangle" className="w-6 h-6 text-yellow-500" />
                    </div>
                    <h3 className="font-semibold text-slate-900 mb-1">规范警告</h3>
                    <p className="text-sm text-slate-500">提醒不符合标准的标注</p>
                  </div>
                  <div className="bg-white rounded-xl p-6 border border-slate-200">
                    <div className="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center mb-4">
                      <Icon name="info" className="w-6 h-6 text-blue-500" />
                    </div>
                    <h3 className="font-semibold text-slate-900 mb-1">优化建议</h3>
                    <p className="text-sm text-slate-500">提供图纸改进建议</p>
                  </div>
                </div>
              </div>
            ) : (
              <div className="grid grid-cols-12 gap-6">
                <div className="col-span-12 lg:col-span-8 space-y-6">
                  <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                    <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <Icon name="eye" className="w-5 h-5 text-slate-500" />
                        <span className="font-semibold text-slate-900">图纸预览</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <button onClick={() => setZoom(z => Math.max(0.5, z - 0.1))} className="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                          <Icon name="zoomOut" className="w-5 h-5 text-slate-600" />
                        </button>
                        <span className="text-sm text-slate-600 w-16 text-center">{Math.round(zoom * 100)}%</span>
                        <button onClick={() => setZoom(z => Math.min(2, z + 0.1))} className="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                          <Icon name="zoomIn" className="w-5 h-5 text-slate-600" />
                        </button>
                        <button onClick={() => setZoom(1)} className="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                          <Icon name="maximize2" className="w-5 h-5 text-slate-600" />
                        </button>
                      </div>
                    </div>
                    <div className="bg-slate-100 p-6 flex items-center justify-center" style={{ height: '500px' }}>
                      <canvas ref={canvasRef} width={600} height={400} className="bg-white rounded-lg shadow-inner" />
                    </div>
                    <div className="px-6 py-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <Icon name="fileText" className="w-5 h-5 text-slate-500" />
                        <span className="text-sm font-medium text-slate-700">{file.name}</span>
                        <span className="text-xs text-slate-500">{(file.size / 1024).toFixed(1)} KB</span>
                      </div>
                      <button onClick={resetReview} className="text-sm text-slate-500 hover:text-slate-700 flex items-center gap-1">
                        <Icon name="refreshCw" className="w-4 h-4" />
                        重新上传
                      </button>
                    </div>
                  </div>

                  {!reviewResult && !isReviewing && (
                    <div className="flex justify-center">
                      <button
                        onClick={startReview}
                        className="px-8 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-semibold hover:from-blue-700 hover:to-indigo-700 transition-all shadow-lg shadow-blue-500/25 flex items-center gap-2 text-lg"
                      >
                        <Icon name="checkCircle" className="w-6 h-6" />
                        开始智能审查
                      </button>
                    </div>
                  )}

                  {isReviewing && (
                    <div className="bg-white rounded-2xl border border-slate-200 p-8 text-center">
                      <div className="w-16 h-16 mx-auto mb-6 relative">
                        <div className="absolute inset-0 border-4 border-blue-200 rounded-full"></div>
                        <div className="absolute inset-0 border-4 border-blue-600 rounded-full border-t-transparent animate-spin"></div>
                      </div>
                      <h3 className="text-xl font-semibold text-slate-900 mb-2">正在审查图纸...</h3>
                      <p className="text-slate-500">正在分析尺寸标注、视图布局、形位公差等规范</p>
                      <div className="mt-6 max-w-md mx-auto">
                        <div className="h-2 bg-slate-200 rounded-full overflow-hidden">
                          <div className="h-full bg-gradient-to-r from-blue-600 to-indigo-600 rounded-full animate-pulse" style={{ width: '60%' }}></div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                <div className="col-span-12 lg:col-span-4 space-y-6">
                  {!reviewResult ? (
                    <div className="bg-white rounded-2xl border border-slate-200 p-6">
                      <h3 className="font-semibold text-slate-900 mb-4 flex items-center gap-2">
                        <Icon name="settings" className="w-5 h-5 text-slate-500" />
                        审查规则配置
                      </h3>
                      <div className="space-y-3">
                        {reviewCategories.map((cat, index) => (
                          <div key={index} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl">
                            <div className="flex items-center gap-3">
                              <div className="w-10 h-10 bg-white rounded-lg flex items-center justify-center shadow-sm">
                                <Icon name={cat.icon} className="w-5 h-5 text-blue-600" />
                              </div>
                              <span className="font-medium text-slate-700">{cat.name}</span>
                            </div>
                            <label className="relative inline-flex items-center cursor-pointer">
                              <input type="checkbox" defaultChecked className="sr-only peer" />
                              <div className="w-11 h-6 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                          </div>
                        ))}
                      </div>
                      <button className="w-full mt-4 py-2 text-sm text-blue-600 hover:text-blue-700 font-medium">
                        自定义规则设置 →
                      </button>
                    </div>
                  ) : (
                    <>
                      <div className="bg-gradient-to-br from-slate-900 to-slate-800 rounded-2xl p-6 text-white">
                        <div className="flex items-center justify-between mb-4">
                          <h3 className="font-semibold">审查结果概览</h3>
                          <span className="text-xs text-slate-400 flex items-center gap-1">
                            <Icon name="clock" className="w-4 h-4" />
                            {reviewResult.reviewedAt}
                          </span>
                        </div>
                        <div className="text-5xl font-bold mb-2">{reviewResult.totalIssues}</div>
                        <p className="text-slate-400 mb-6">个待处理问题</p>
                        <div className="grid grid-cols-3 gap-3">
                          <div className="bg-white/10 rounded-xl p-3 text-center">
                            <div className="text-2xl font-bold text-red-400">{reviewResult.errors}</div>
                            <div className="text-xs text-slate-400">错误</div>
                          </div>
                          <div className="bg-white/10 rounded-xl p-3 text-center">
                            <div className="text-2xl font-bold text-yellow-400">{reviewResult.warnings}</div>
                            <div className="text-xs text-slate-400">警告</div>
                          </div>
                          <div className="bg-white/10 rounded-xl p-3 text-center">
                            <div className="text-2xl font-bold text-blue-400">{reviewResult.infos}</div>
                            <div className="text-xs text-slate-400">建议</div>
                          </div>
                        </div>
                      </div>

                      <div className="bg-white rounded-2xl border border-slate-200 p-6">
                        <h3 className="font-semibold text-slate-900 mb-4">问题分类</h3>
                        <div className="space-y-2">
                          <button
                            onClick={() => setSelectedCategory(null)}
                            className={cn(
                              "w-full flex items-center justify-between p-3 rounded-xl transition-colors",
                              !selectedCategory ? "bg-blue-50 text-blue-700" : "hover:bg-slate-50 text-slate-700"
                            )}
                          >
                            <span className="font-medium">全部问题</span>
                            <span className="text-sm">{reviewResult.totalIssues}</span>
                          </button>
                          {reviewCategories.map((cat, index) => {
                            const categoryIssues = reviewResult.issues.filter(i => i.category === cat.name);
                            const hasErrors = categoryIssues.some(i => i.severity === 'error');
                            const hasWarnings = categoryIssues.some(i => i.severity === 'warning');
                            return (
                              <button
                                key={index}
                                onClick={() => setSelectedCategory(selectedCategory === cat.name ? null : cat.name)}
                                className={cn(
                                  "w-full flex items-center justify-between p-3 rounded-xl transition-colors",
                                  selectedCategory === cat.name ? "bg-blue-50 text-blue-700" : "hover:bg-slate-50 text-slate-700"
                                )}
                              >
                                <div className="flex items-center gap-3">
                                  <Icon name={cat.icon} className="w-5 h-5" />
                                  <span className="font-medium">{cat.name}</span>
                                </div>
                                <div className="flex items-center gap-2">
                                  {hasErrors && <span className="w-2 h-2 bg-red-500 rounded-full"></span>}
                                  {hasWarnings && <span className="w-2 h-2 bg-yellow-500 rounded-full"></span>}
                                  <span className="text-sm">{categoryIssues.length}</span>
                                </div>
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      <button className="w-full flex items-center justify-center gap-2 py-3 bg-slate-900 text-white rounded-xl font-medium hover:bg-slate-800 transition-colors">
                        <Icon name="download" className="w-5 h-5" />
                        下载审查报告
                      </button>
                    </>
                  )}
                </div>
              </div>
            )}

            {reviewResult && (
              <div className="mt-6 bg-white rounded-2xl border border-slate-200 overflow-hidden">
                <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                  <h3 className="font-semibold text-slate-900">
                    问题明细
                    <span className="ml-2 text-sm font-normal text-slate-500">共 {filteredIssues.length} 条</span>
                  </h3>
                  <div className="flex items-center gap-2">
                    <select className="px-3 py-2 border border-slate-200 rounded-lg text-sm text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                      <option>按严重程度</option>
                      <option>按分类</option>
                      <option>按位置</option>
                    </select>
                  </div>
                </div>
                <div className="divide-y divide-slate-100">
                  {filteredIssues.map((issue) => (
                    <div
                      key={issue.id}
                      onClick={() => setSelectedIssue(selectedIssue === issue.id ? null : issue.id)}
                      className={cn(
                        "p-6 cursor-pointer transition-colors",
                        selectedIssue === issue.id ? "bg-blue-50/50" : "hover:bg-slate-50"
                      )}
                    >
                      <div className="flex items-start gap-4">
                        {getSeverityIcon(issue.severity)}
                        <div className="flex-1">
                          <div className="flex items-center gap-3 mb-1 flex-wrap">
                            <span className={cn("text-xs font-medium px-2 py-1 rounded-md border", getSeverityBadgeClass(issue.severity))}>
                              {issue.severity === 'error' ? '错误' : issue.severity === 'warning' ? '警告' : '建议'}
                            </span>
                            <span className="text-sm text-slate-500">{issue.category}</span>
                            {issue.location && (
                              <span className="text-sm text-slate-500 flex items-center gap-1">
                                <Icon name="move" className="w-4 h-4" />
                                {issue.location}
                              </span>
                            )}
                          </div>
                          <p className="text-slate-800 font-medium">{issue.description}</p>
                          {selectedIssue === issue.id && (
                            <div className="mt-4 p-4 bg-slate-50 rounded-xl animate-fadeIn">
                              <div className="flex items-start gap-3">
                                <Icon name="alertCircle" className="w-5 h-5 text-slate-400 mt-0.5" />
                                <div>
                                  <p className="text-sm text-slate-600 mb-2">
                                    <span className="font-medium">依据标准：</span>{issue.rule}
                                  </p>
                                  <p className="text-sm text-slate-600">
                                    <span className="font-medium">修改建议：</span>
                                    请参考相关国家标准进行修正，确保图纸符合机械制图规范要求。
                                  </p>
                                </div>
                              </div>
                            </div>
                          )}
                        </div>
                        <Icon name="chevronRight" className={cn("w-5 h-5 text-slate-400 transition-transform", selectedIssue === issue.id && "rotate-90")} />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CadReview />);
  </script>
</body>
</html>
