        * { font-family: 'Noto Sans SC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .serif { font-family: 'Noto Serif SC', serif; }
        body { background: #ede8e1; }
        .phone-frame { max-width: 430px; margin: 0 auto; min-height: 100vh; background: #faf8f5; position: relative; overflow: hidden; box-shadow: 0 0 60px rgba(89, 67, 47, 0.08); }
        .safe-area { padding-bottom: 100px; }
        
        /* 颜色系统 */
        .bg-primary { background: linear-gradient(135deg, #c17f46 0%, #a86432 100%); }
        .bg-primary-light { background: #fdf6ee; }
        .text-primary { color: #a86432; }
        .border-primary { border-color: #e8d5c0; }
        .bg-secondary { background: linear-gradient(135deg, #6b7aa1 0%, #51608a 100%); }
        .bg-warm { background: linear-gradient(135deg, #e9a66d 0%, #d48a4c 100%); }
        .bg-soft { background: linear-gradient(135deg, #8fb69d 0%, #6b9a7d 100%); }
        .bg-rose { background: linear-gradient(135deg, #d48686 0%, #b86b6b 100%); }
        .bg-sky { background: linear-gradient(135deg, #7ab8c9 0%, #5a9aa8 100%); }
        .bg-violet { background: linear-gradient(135deg, #9b8ec7 0%, #7d70a8 100%); }
        
        /* 卡片 */
        .card { background: #fff; border-radius: 24px; box-shadow: 0 2px 16px rgba(89, 67, 47, 0.05); border: 1px solid rgba(200, 180, 160, 0.2); }
        .card-elevated { box-shadow: 0 8px 30px rgba(168, 100, 50, 0.12); }
        
        /* 按钮 */
        .btn-main { background: linear-gradient(135deg, #c17f46 0%, #a86432 100%); box-shadow: 0 4px 16px rgba(168, 100, 50, 0.25); transition: all 0.2s; }
        .btn-main:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(168, 100, 50, 0.2); }
        .btn-soft { background: #fff; border: 2px solid #e8d5c0; color: #a86432; transition: all 0.2s; }
        .btn-soft:active { background: #fdf6ee; transform: scale(0.97); }
        
        /* 导航 */
        .tab-btn { position: relative; transition: all 0.2s; }
        .tab-active { color: #a86432; }
        .tab-active::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 20px; height: 3px; background: #a86432; border-radius: 3px; }
        
        /* 角色切换 */
        .role-chip { transition: all 0.2s; background: transparent; color: #8a6d4f; }
        .role-chip.active { background: #a86432; color: #fff; }
        
        /* 动画 */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .slide-up { animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 语音 */
        .voice-wave { display: inline-flex; align-items: center; gap: 3px; height: 24px; }
        .voice-wave span { width: 4px; background: #a86432; border-radius: 2px; animation: wave 1.2s ease-in-out infinite; }
        .voice-wave span:nth-child(1) { height: 8px; animation-delay: 0s; }
        .voice-wave span:nth-child(2) { height: 16px; animation-delay: 0.15s; }
        .voice-wave span:nth-child(3) { height: 12px; animation-delay: 0.3s; }
        .voice-wave span:nth-child(4) { height: 20px; animation-delay: 0.45s; }
        @keyframes wave { 0%, 100% { transform: scaleY(0.6); opacity: 0.7; } 50% { transform: scaleY(1.1); opacity: 1; } }
        
        /* 聊天 */
        .chat-bubble { max-width: 82%; padding: 14px 18px; border-radius: 20px; line-height: 1.6; font-size: 15px; }
        .chat-bubble.ai { background: #f0e8ff; color: #5a4a7a; border-bottom-left-radius: 4px; }
        .chat-bubble.user { background: #fdf2e6; color: #7a4a25; border-bottom-right-radius: 4px; margin-left: auto; }
        
        /* 覆盖页 */
        .overlay-page { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #faf8f5; z-index: 100; overflow-y: auto; }
        
        /* 图标容器 */
        .icon-circle { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; flex-shrink: 0; }
        .icon-small { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; flex-shrink: 0; }
        
        .hidden-section { display: none; }
        .section-visible { display: block; animation: fadeIn 0.4s ease-out; }

/* ---- 橙月 · 社会化养老平台探索 ---- */
:root {
    --wq-ink: #3f3228;
    --wq-ink-soft: #5f4a39;
    --wq-muted: #927864;
    --wq-paper: #fbf4e8;
    --wq-cream: #fffaf2;
    --wq-line: rgba(145, 101, 58, .16);
    --wq-line-strong: rgba(132, 86, 45, .24);
    --wq-gold: #c99458;
    --wq-gold-dark: #8d5b32;
    --wq-sage: #78956e;
    --wq-sky: #6aa5b6;
    --wq-violet: #8271b2;
    --wq-rose: #c77a74;
}

html {
    background: #f5efe4;
}

body {
    color: var(--wq-ink);
    background:
        radial-gradient(circle at 50% -12%, rgba(240, 180, 100, .38), transparent 40%),
        radial-gradient(circle at 18% 12%, rgba(220, 150, 130, .18), transparent 28%),
        linear-gradient(135deg, #f7f0e3 0%, #efe6d3 100%) !important;
}

body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .12;
    background-image:
        linear-gradient(120deg, rgba(255,255,255,.72) 0 1px, transparent 1px 18px),
        radial-gradient(circle at 1px 1px, rgba(120, 85, 52, .16) 1px, transparent 0);
    background-size: 28px 28px, 18px 18px;
    mix-blend-mode: soft-light;
}

* {
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif !important;
    -webkit-tap-highlight-color: transparent;
}

.serif,
.serif * {
    font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif !important;
    letter-spacing: .01em;
}

.phone-frame {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    background:
        radial-gradient(circle at 86% 7%, rgba(255, 190, 105, .42), transparent 34%),
        radial-gradient(circle at 5% 24%, rgba(230, 155, 140, .16), transparent 28%),
        linear-gradient(180deg, #fffbf4 0%, #fdf6ec 45%, #f9eede 100%) !important;
    border-left: 1px solid rgba(255,255,255,.82);
    border-right: 1px solid rgba(122, 83, 45, .08);
    box-shadow: 0 28px 88px rgba(70, 45, 24, .16), 0 0 0 1px rgba(255,255,255,.55) inset !important;
}

.phone-frame::before {
    content: '';
    position: absolute;
    top: 48px;
    right: -70px;
    z-index: -1;
    width: 230px;
    height: 230px;
    border-radius: 999px;
    background: radial-gradient(circle at 35% 35%, #ffe9bc 0%, #ffc16e 28%, #f58e4d 55%, #d9644a 76%, transparent 92%);
    opacity: .34;
    filter: blur(1px);
}

.phone-frame::after {
    content: '';
    position: absolute;
    left: -66px;
    bottom: 90px;
    z-index: -1;
    width: 210px;
    height: 210px;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(210, 140, 130, .16), transparent 67%);
    filter: blur(2px);
}

.safe-area { padding-bottom: 118px !important; }
#content-area { position: relative; padding-top: 18px !important; }

/* 顶部品牌区 */
.phone-frame > .sticky:first-child,
.overlay-page .sticky:first-child,
.max-w-\[430px\] > .sticky:first-child {
    background: linear-gradient(180deg, rgba(255,254,250,.96), rgba(255,251,244,.88)) !important;
    border-bottom: 1px solid rgba(157, 111, 65, .12) !important;
    box-shadow: 0 12px 34px rgba(104, 70, 37, .06);
    backdrop-filter: blur(18px) saturate(1.22) !important;
    -webkit-backdrop-filter: blur(18px) saturate(1.22) !important;
}

.phone-frame > .sticky:first-child h1 {
    color: #4a382a !important;
    text-shadow: 0 1px 0 rgba(255,255,255,.8);
}

.phone-frame > .sticky:first-child .w-11.h-11:not(.logo-moon),
.bg-primary {
    background: linear-gradient(135deg, #f0b65e 0%, #e07d3a 48%, #c25435 100%) !important;
    box-shadow: 0 12px 28px rgba(190, 95, 50, .28), inset 0 1px 0 rgba(255,255,255,.40) !important;
}

.logo-moon {
    background: linear-gradient(135deg, #f5b35f 0%, #e07e3e 55%, #b5523b 100%) !important;
    box-shadow: 0 8px 20px rgba(190, 98, 55, .30) !important;
}
.moon-cut {
    position: absolute;
    width: 18px;
    height: 18px;
    background: #fff9f2;
    border-radius: 50%;
    right: -5px;
    top: 50%;
    transform: translateY(-50%);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.25);
}

.role-chip {
    min-width: 44px;
    color: #8b7059 !important;
    border: 1px solid transparent;
    transition: transform .22s ease, background .22s ease, box-shadow .22s ease, color .22s ease;
}
.role-chip.active {
    color: #fff !important;
    background: linear-gradient(135deg, #b9854d, #7f5536) !important;
    border-color: rgba(255,255,255,.38);
    box-shadow: 0 8px 20px rgba(130, 82, 39, .22), inset 0 1px 0 rgba(255,255,255,.30);
    transform: translateY(-1px);
}
.role-chip:not(.active):hover { background: rgba(255,255,255,.58) !important; }

/* 色彩系统升级 */
.bg-primary-light {
    background:
        radial-gradient(circle at 90% 0%, rgba(223, 172, 101, .30), transparent 36%),
        linear-gradient(145deg, #fff7ec 0%, #f7e7cf 100%) !important;
}
.bg-secondary { background: linear-gradient(135deg, #7987ad 0%, #465579 100%) !important; }
.bg-warm { background: linear-gradient(135deg, #e8ad6d 0%, #c8793e 100%) !important; }
.bg-soft { background: linear-gradient(135deg, #9fbd91 0%, #6f9368 100%) !important; }
.bg-rose { background: linear-gradient(135deg, #d9918d 0%, #b6615d 100%) !important; }
.bg-sky { background: linear-gradient(135deg, #8dc4cf 0%, #5799a8 100%) !important; }
.bg-violet { background: linear-gradient(135deg, #a99ada 0%, #7464a8 100%) !important; }
.text-primary { color: #965f34 !important; }
.border-primary { border-color: rgba(184, 126, 73, .28) !important; }

/* 卡片：从“普通白卡”变成暖调玻璃纸感 */
.card {
    position: relative;
    overflow: hidden;
    border-radius: 28px !important;
    background:
        linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(255,252,247,.88) 100%) !important;
    border: 1px solid rgba(175, 130, 85, .12) !important;
    box-shadow:
        0 18px 44px rgba(91, 59, 30, .08),
        0 2px 8px rgba(91, 59, 30, .035),
        inset 0 1px 0 rgba(255,255,255,.82) !important;
    backdrop-filter: blur(10px) saturate(1.12);
    -webkit-backdrop-filter: blur(10px) saturate(1.12);
}
.card::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 92% 8%, rgba(216, 164, 92, .12), transparent 31%),
        linear-gradient(120deg, rgba(255,255,255,.34), transparent 42%);
}
.card > * { position: relative; z-index: 1; }
.card-elevated {
    border-color: rgba(190, 128, 65, .22) !important;
    box-shadow:
        0 24px 58px rgba(137, 79, 34, .16),
        inset 0 1px 0 rgba(255,255,255,.72) !important;
}
.card-elevated::after {
    content: '';
    position: absolute;
    right: -34px;
    top: -46px;
    width: 142px;
    height: 142px;
    border-radius: 999px;

                <div class="bg-[#e8f5e9] border border-[#c8e6c9] rounded-2xl p-4 text-center">
                    <span class="text-3xl">✅</span>
                    <p class="font-black text-[#4a8b4f] mt-2">已通知女儿小芳</p>
                    <p class="text-sm text-[#6a9a6a]">她收到了您的今日安好卡片：步数3260、心情开心、降压药已吃</p>
                </div>
            `;
        }

        function toggleRecording() {
            isRecording = !isRecording;
            const btn = document.getElementById('voice-btn');
            const wave = document.getElementById('voice-wave');
            const text = document.getElementById('voice-text');
            const pulse = document.getElementById('pulse');
            if (isRecording) {
                btn.classList.add('recording');
                wave.classList.remove('opacity-0');
                text.textContent = '正在听您说...';
                pulse.classList.remove('hidden');
            } else {
                btn.classList.remove('recording');
                wave.classList.add('opacity-0');
                text.textContent = '按住说话';
                pulse.classList.add('hidden');
            }
        }

        function sendVoice() {
            const result = document.getElementById('voice-result');
            result.classList.remove('hidden-section');
            result.classList.add('section-visible');
            if (isRecording) toggleRecording();
        }

        function recordStory() {
            const btn = document.getElementById('story-record-btn');
            const preview = document.getElementById('story-preview');
            btn.classList.add('recording');
            setTimeout(() => {
                btn.classList.remove('recording');
                preview.classList.remove('hidden-section');
                preview.classList.add('section-visible');
            }, 2000);
        }

        function matchFriend() {
            matchedFriend = elders[Math.floor(Math.random() * elders.length)];
            const area1 = document.getElementById('match-area');
            const area2 = document.getElementById('match-area-bridge');
            if (area1) area1.innerHTML = renderMatchCard();
            if (area2) area2.innerHTML = renderMatchCard();
        }

        function startChat() {
            const elder = matchedFriend || elders[0];
            alert(`已打开与 ${elder.name} 的信箱，写一封温暖的信吧！`);
        }

        function triggerSOS() {
            alert('🆘 已触发一键求助\n\n正在联系：\n1. 紧急联系人 女儿小芳\n2. 社区养老服务中心\n3. 120 急救中心（如需要）');
        }

        render();
    </script></body>
</html>
