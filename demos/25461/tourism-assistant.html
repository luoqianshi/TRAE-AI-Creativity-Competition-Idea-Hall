    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .card-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            width: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .btn-ai {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }
        .btn-ai:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(17, 153, 142, 0.4);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .tile {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .tile img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .tile h3 {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 8px;
        }
        .tile p {
            color: #666;
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        .tile .price {
            color: #e74c3c;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .tile .tag {
            display: inline-block;
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-top: 8px;
        }
        .route-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }
        .route-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.1);
        }
        .route-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .route-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .route-info span {
            font-size: 0.9rem;
            color: #666;
        }
        .route-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: #e74c3c;
        }
        .route-details {
            display: flex;
            gap: 24px;
            font-size: 0.85rem;
            color: #888;
        }
        .food-item {
            display: flex;
            gap: 16px;
            padding: 16px;
            background: #fff8f0;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .food-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }
        .food-info h4 {
            color: #333;
            margin-bottom: 4px;
        }
        .food-info p {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }
        .food-info .rating {
            color: #f39c12;
            font-size: 0.85rem;
        }
        .attraction-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            height: 200px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .attraction-card:hover {
            transform: scale(1.02);
        }
        .attraction-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .attraction-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            padding: 20px;
            color: white;
        }
        .attraction-overlay h3 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }
        .attraction-overlay p {
            font-size: 0.8rem;
            opacity: 0.9;
        }
        .hidden {
            display: none !important;
        }
        .loader {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .loader i {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .feature-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .feature-item {
            text-align: center;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
        }

            font-size: 1rem;
            margin-bottom: 6px;

            }

            }

        function searchRoute() {
            const startCity = document.getElementById('startCity').value;
            const destCity = document.getElementById('destCity').value;
            
            if (!startCity) {
                alert('请先选择出发城市');
                return;
            }
            if (!destCity) {
                alert('请选择目的地，或点击"AI推荐周边城市"获取推荐');
                return;
            }

            document.getElementById('recommendationSection').classList.add('hidden');
            document.getElementById('routeSection').classList.remove('hidden');
            document.getElementById('attractionSection').classList.remove('hidden');
            document.getElementById('foodSection').classList.remove('hidden');

            renderRoutes(startCity, destCity);
            renderAttractions(destCity);
            renderFoods(destCity);
        }

        function recommendDestinations() {
            const startCity = document.getElementById('startCity').value;
            
            if (!startCity) {
                alert('请先选择出发城市');
                return;
            }

            document.getElementById('recommendationSection').classList.remove('hidden');
            document.getElementById('routeSection').classList.add('hidden');
            document.getElementById('attractionSection').classList.add('hidden');
            document.getElementById('foodSection').classList.add('hidden');

            const recommendations = mockData.recommendations[startCity] || mockData.recommendations['default'];
            const container = document.getElementById('recommendationList');
            
            container.innerHTML = recommendations.map(item => `
                <div class="tile" onclick="selectDestination('${item.city}', '${item.name}')">
                    <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=${encodeURIComponent(item.name + ' city skyline landmark')}&image_size=landscape_16_9" alt="${item.name}">
                    <h3>${item.name}</h3>
                    <p>${item.desc}</p>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="color: #667eea; font-size: 0.9rem;">📍 ${item.distance}</span>
                        <span class="tag">${item.tag}</span>
                    </div>
                </div>
            `).join('');
        }

        function selectDestination(cityCode, cityName) {
            const select = document.getElementById('destCity');
            select.value = cityCode || 'default';
            searchRoute();
        }

        function renderRoutes(startCity, destCity) {
            const key = `${startCity}-${destCity}`;
            const routes = mockData.routes[key] || mockData.routes['default'];
            const container = document.getElementById('routeList');
            const startName = cityNames[startCity] || '出发地';
            const destName = cityNames[destCity] || '目的地';

            container.innerHTML = `
                <div style="margin-bottom: 20px; padding: 16px; background: #f8f9fa; border-radius: 10px; text-align: center;">
                    <span style="font-size: 1.2rem; font-weight: 600; color: #333;">
                        🚄 ${startName} → ${destName}
                    </span>
                </div>
                ${routes.map(route => `
                    <div class="route-card">
                        <div class="route-header">
                            <div class="route-info">
                                <span style="font-size: 1.4rem; font-weight: 700; color: #333;">${route.time}</span>
                                <span>出发</span>
                            </div>
                            <div class="route-price">¥${route.price}</div>
                        </div>
                        <div class="route-details">
                            <span>⏱️ 时长：${route.duration}</span>
                            <span>🚆 类型：${route.type}</span>
                            <span>💺 座位：二等座</span>
                        </div>
                    </div>
                `).join('')}
            `;
        }

        function renderAttractions(destCity) {
            const attractions = mockData.attractions[destCity] || mockData.attractions['default'];
            const container = document.getElementById('attractionList');

            container.innerHTML = attractions.map(attraction => `
                <div class="attraction-card">
                    <img src="${attraction.img}" alt="${attraction.name}">
                    <div class="attraction-overlay">
                        <h3>${attraction.name}</h3>
                        <p>${attraction.desc}</p>
                    </div>
                </div>
            `).join('');
        }

        function renderFoods(destCity) {
            const foods = mockData.foods[destCity] || mockData.foods['default'];
            const container = document.getElementById('foodList');

            container.innerHTML = foods.map(food => `
                <div class="food-item">
                    <img src="${food.img}" alt="${food.name}">
                    <div class="food-info">
                        <h4>${food.name}</h4>
                        <p>${food.desc}</p>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span class="rating">${food.rating}</span>
                            <span style="font-weight: 600; color: #e74c3c;">${food.price}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
