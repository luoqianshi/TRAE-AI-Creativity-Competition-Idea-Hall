<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCB走线线形优化器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>PCB走线线形优化器</h1>
            <p>专业的PCB布线优化工具</p>
        </header>

        <div class="main-content">
            <div class="canvas-container">
                <canvas id="pcbCanvas"></canvas>
                <div class="canvas-info">
                    <span>画布尺寸: <span id="canvasSize">500 x 400</span></span>
                    <span>当前层: <span id="currentLayer">Top</span></span>
                </div>
            </div>

            <div class="control-panel">
                <div class="panel-section">
                    <h2>走线参数</h2>
                    
                    <div class="form-group">
                        <label>起点坐标 (X1, Y1)</label>
                        <div class="coord-input">
                            <input type="number" id="startX" value="50" min="0" max="490">
                            <input type="number" id="startY" value="50" min="0" max="390">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>终点坐标 (X2, Y2)</label>
                        <div class="coord-input">
                            <input type="number" id="endX" value="450" min="0" max="490">
                            <input type="number" id="endY" value="350" min="0" max="390">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>线宽 (mil)</label>
                        <input type="number" id="lineWidth" value="8" min="1" max="100">
                    </div>

                    <div class="form-group">
                        <label>走线层</label>
                        <select id="layerSelect">
                            <option value="Top">Top Layer</option>
                            <option value="Bottom">Bottom Layer</option>
                            <option value="Inner1">Inner Layer 1</option>
                            <option value="Inner2">Inner Layer 2</option>
                        </select>
                    </div>
                </div>

                <div class="panel-section">
                    <h2>优化算法</h2>
                    
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="algorithm" value="manhattan" checked>
                            <span>曼哈顿走线</span>
                        </label>
                        <label>
                            <input type="radio" name="algorithm" value="shortest">
                            <span>最短路径 (Dijkstra)</span>
                        </label>
                        <label>
                            <input type="radio" name="algorithm" value="equalLength">
                            <span>等长走线</span>
                        </label>
                    </div>

                    <div class="form-group">
                        <label>目标长度 (mil)</label>
                        <input type="number" id="targetLength" value="0" min="0">
                        <span class="hint">0表示自动计算最短长度</span>
                    </div>
                </div>

                <div class="panel-section">
                    <h2>操作</h2>
                    
                    <button id="btnOptimize" class="btn btn-primary">执行优化</button>
                    <button id="btnClear" class="btn btn-secondary">清除画布</button>
                    <button id="btnAddObstacle" class="btn btn-warning">添加障碍区域</button>
                    <button id="btnExport" class="btn btn-success">导出走线数据</button>
                </div>

                <div class="panel-section">
                    <h2>结果</h2>
                    <div class="result-display">
                        <div class="result-item">
                            <span class="label">走线长度:</span>
                            <span class="value" id="resultLength">0</span>
                        </div>
                        <div class="result-item">
                            <span class="label">转角数量:</span>
                            <span class="value" id="resultCorners">0</span>
                        </div>
                        <div class="result-item">
                            <span class="label">过孔数量:</span>
                            <span class="value" id="resultVias">0</span>
                        </div>
                        <div class="result-item">
                            <span class="label">优化时间:</span>
                            <span class="value" id="resultTime">0ms</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="obstacle-modal" id="obstacleModal">
            <div class="modal-content">
                <h3>添加障碍区域</h3>
                <div class="form-group">
                    <label>障碍起点 (X, Y)</label>
                    <div class="coord-input">
                        <input type="number" id="obsStartX" value="200" min="0" max="490">
                        <input type="number" id="obsStartY" value="150" min="0" max="390">
                    </div>
                </div>
                <div class="form-group">
                    <label>障碍终点 (X, Y)</label>
                    <div class="coord-input">
                        <input type="number" id="obsEndX" value="300" min="0" max="490">
                        <input type="number" id="obsEndY" value="250" min="0" max="390">
                    </div>
                </div>
                <div class="modal-actions">
                    <button id="btnConfirmObstacle" class="btn btn-primary">确认添加</button>
                    <button id="btnCancelObstacle" class="btn btn-secondary">取消</button>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>PCB走线线形优化器 © 2024 | 专业电子设计工具</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
