/* ============================================
 * QuantCopilot V2 — Brand Design Tokens
 * Dual-layer: Raw Palette → Semantic Roles
 * Aligned with Apple Design Library architecture
 * ============================================ */

/* --- Raw Palette --- */
:root {
  /* Brand Blue */
  --brand-900: #00275a;
  --brand-800: #003b82;
  --brand-700: #0050b3;
  --brand-600: #0066d6;
  --brand-500: #0A84FF;
  --brand-400: #4DA3FF;
  --brand-300: #66b3ff;
  --brand-200: #99ccff;
  --brand-100: #cce5ff;
  --brand-50:  #e6f2ff;

  /* Background */
  --background-900: #000000;
  --background-800: #1C1C1E;
  --background-700: #3A3A3C;
  --background-600: #8E8E93;
  --background-500: #AEAEB2;
  --background-400: #D1D1D6;
  --background-300: #E5E5EA;
  --background-200: #F2F2F7;
  --background-100: #F5F5F7;
  --background-50:  #FFFFFF;

  /* Text */
  --text-900: #000000;
  --text-800: #1D1D1F;
  --text-700: #3C3C43;
  --text-600: #48484A;
  --text-500: #6E6E73;
  --text-400: #8E8E93;
  --text-300: #AEAEB2;
  --text-200: #C7C7CC;
  --text-100: #E3E3E8;
  --text-50:  #F5F5F7;

  /* State */
  --state-success: #30D158;
  --state-error: #FF453A;
  --state-warning: #FFD60A;
  --state-info: #0A84FF;

  /* Chart */
  --chart-1: #30D158;
  --chart-2: #FF453A;
  --chart-3: #FF9F0A;
  --chart-4: #BF5AF2;
  --chart-5: #64D2FF;

  /* Spacing */
  --spacing: 0.24rem;
  --radius: 1.2rem;

  /* Shadow */
  --shadow-2xs: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-xs: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --shadow-xl: 0 16px 48px rgba(0,0,0,0.16);
  --shadow-2xl: 0 24px 64px rgba(0,0,0,0.20);
  --shadow-inner: inset 0 2px 4px rgba(0,0,0,0.06);

  /* Motion */
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --duration-fast: 150ms;
  --duration-normal: 250ms;
  --duration-slow: 350ms;

  /* Font */
  --font-sans: 'DM Sans', 'Noto Sans SC', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --tracking-normal: 0em;
  --tracking-wide: 0.08em;

  /* Dark mode card bg */
  --card-dark-bg: #1C1C1E;
}

/* --- Semantic Tokens (Light Mode) --- */
:root {
  --primary: var(--brand-500);
  --primary-foreground: #FFFFFF;
  --primary-hover: var(--brand-400);

  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);

  --muted: var(--background-100);
  --muted-foreground: var(--text-500);

  --accent: var(--state-warning);

  --destructive: var(--state-error);
  --destructive-foreground: #FFFFFF;

  --background: var(--background-50);
  --foreground: var(--text-800);

  --card: var(--background-50);
  --card-foreground: var(--text-800);

  --popover: var(--background-50);
  --popover-foreground: var(--text-800);

  --border: var(--background-400);
  --input: var(--background-400);
  --ring: var(--brand-400);

  --sidebar: var(--background-100);
  --sidebar-foreground: var(--text-800);

  --icon: var(--text-700);
  --icon-muted: var(--text-400);

  --quant-green: var(--state-success);
  --quant-red: var(--state-error);
  --quant-gold: var(--state-warning);
}

/* --- Semantic Tokens (Dark Mode) --- */
.dark {
  --primary: var(--brand-500);
  --primary-foreground: #FFFFFF;
  --primary-hover: var(--brand-400);

  --secondary: var(--background-800);
  --secondary-foreground: var(--text-100);

  --muted: var(--background-800);
  --muted-foreground: var(--text-400);

  --accent: var(--state-warning);

  --destructive: var(--state-error);
  --destructive-foreground: #FFFFFF;

  --background: var(--background-900);
  --foreground: var(--text-50);

  --card: var(--card-dark-bg);
  --card-foreground: var(--text-50);

  --popover: var(--background-800);
  --popover-foreground: var(--text-50);

  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);

  --icon: var(--text-200);
  --icon-muted: var(--text-500);

  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.35);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
}
  </style>

  <style>
/* ============================================
 * QuantCopilot V2 — Component Styles
 * Based on Apple Design Library component patterns
 * Adapted for fintech/quantitative data context
 * ============================================ */

/* --- Button (Apple-style pill buttons) --- */
.qc-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: calc(var(--spacing) * 1.5);
  height: 44px;
  padding: 0 24px;
  border: none;
  border-radius: 999px;
  background: transparent;
  color: var(--foreground);
  font: 600 14px/1 var(--font-sans);
  letter-spacing: var(--tracking-normal);
  white-space: nowrap;
  cursor: pointer;
  transition: all var(--duration-normal) var(--ease);
}
.qc-btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.qc-btn:disabled { opacity: 0.42; cursor: not-allowed; }

.qc-btn-primary { background: var(--primary); color: var(--primary-foreground); }
.qc-btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

.qc-btn-secondary { background: var(--secondary); color: var(--secondary-foreground); }
.qc-btn-secondary:hover { background: var(--muted); }

.qc-btn-ghost { background: transparent; color: var(--primary); }
.qc-btn-ghost:hover { background: color-mix(in srgb, var(--primary) 10%, transparent); }

.qc-btn-danger { background: var(--destructive); color: var(--destructive-foreground); }
.qc-btn-danger:hover { filter: brightness(1.1); }

.qc-btn-sm { height: 36px; padding: 0 16px; font-size: 12px; }
.qc-btn-lg { height: 56px; padding: 0 28px; font-size: 16px; }

/* --- Card (Apple-style border-first) --- */
.qc-card {
  padding: calc(var(--spacing) * 5);
  display: flex;
  flex-direction: column;
  background: var(--card);
  color: var(--card-foreground);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  transition: transform var(--duration-normal) var(--ease), box-shadow var(--duration-normal) var(--ease), border-color var(--duration-normal) var(--ease);
}
.qc-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.qc-card-glass {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
}

/* --- Input (Apple-style 44px) --- */
.qc-field {
  display: flex;
  align-items: center;
  gap: calc(var(--spacing) * 2);
  height: 44px;
  padding: 0 calc(var(--spacing) * 3);
  border: 1px solid var(--input);
  border-radius: var(--radius);
  background: var(--background);
  color: var(--foreground);
  box-shadow: var(--shadow-xs);
  transition: border-color var(--duration-fast) var(--ease), box-shadow var(--duration-fast) var(--ease);
}
.qc-field:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 30%, transparent); }
.qc-field input { flex: 1; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; }
.qc-field input::placeholder { color: var(--muted-foreground); }

/* --- Navigation (Apple webbar 44px) --- */
.qc-webbar {
  display: flex;
  align-items: center;
  gap: calc(var(--spacing) * 2);
  height: 44px;
  padding: 0 calc(var(--spacing) * 4);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow-sm);
}
.qc-webbar-brand { font-size: 14px; font-weight: 700; letter-spacing: var(--tracking-wide); text-transform: uppercase; white-space: nowrap; }
.qc-webbar-link {
  display: inline-flex; align-items: center; justify-content: center;
  height: 32px; padding: 0 calc(var(--spacing) * 2.5);
  border-radius: 999px; color: inherit; text-decoration: none; white-space: nowrap;
  transition: background-color var(--duration-fast) var(--ease);
}
.qc-webbar-link:hover { background: var(--secondary); }
.qc-webbar-link.active { background: var(--primary); color: var(--primary-foreground); }

/* --- Metric Card (Quant-specific) --- */
.qc-metric {
  padding: calc(var(--spacing) * 3);
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--border);
  text-align: center;
}
.qc-metric-value { font: 700 28px/1 var(--font-mono); }
.qc-metric-label { font-size: 11px; color: var(--muted-foreground); letter-spacing: var(--tracking-wide); text-transform: uppercase; margin-top: 4px; }
.qc-metric--green .qc-metric-value { color: var(--quant-green); }
.qc-metric--red .qc-metric-value { color: var(--quant-red); }
.qc-metric--blue .qc-metric-value { color: var(--primary); }
.qc-metric--gold .qc-metric-value { color: var(--quant-gold); }

/* --- Pill / Badge --- */
.qc-pill {
  display: inline-flex; align-items: center; height: 24px; padding: 0 10px;
  border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
}
.qc-pill-default { background: var(--secondary); color: var(--muted-foreground); }
.qc-pill-success { background: var(--quant-green); color: #fff; }
.qc-pill-error { background: var(--quant-red); color: #fff; }
.qc-pill-primary { background: var(--primary); color: var(--primary-foreground); }
.qc-pill-gold { background: var(--quant-gold); color: #1D1D1F; }

/* --- Table --- */
.qc-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.qc-table th { padding: 10px 12px; text-align: left; font-weight: 600; font-size: 11px; letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--muted-foreground); border-bottom: 1px solid var(--border); }
.qc-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.qc-table tr:last-child td { border-bottom: none; }
.qc-table tr:hover td { background: var(--muted); }

/* --- Animations --- */
@keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes countUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 8px rgba(10,132,255,0.3); } 50% { box-shadow: 0 0 20px rgba(10,132,255,0.6); } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes slideInLeft { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
@keyframes slideInRight { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
@keyframes drawLine { to { stroke-dashoffset: 0; } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

.animate-fade-in-up { animation: fadeInUp var(--duration-slow) var(--ease) both; }
.animate-fade-in { animation: fadeIn var(--duration-slow) var(--ease) both; }
.animate-pulse { animation: pulse 2s ease-in-out infinite; }
.animate-glow { animation: glow 2s ease-in-out infinite; }
.animate-float { animation: float 3s ease-in-out infinite; }
  </style>

  <style type="text/tailwindcss">
@theme inline {
  --color-primary: var(--primary);
  --color-primary-hover: var(--primary-hover);
  --color-primary-foreground: var(--primary-foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-accent: var(--accent);
  --color-destructive: var(--destructive);
  --color-destructive-foreground: var(--destructive-foreground);
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-quant-green: var(--quant-green);
  --color-quant-red: var(--quant-red);
  --color-quant-gold: var(--quant-gold);
}
@layer base {
  body { background: var(--background); color: var(--foreground); }
  td, th { word-break: break-all; }
  th { white-space: nowrap; }
}

  <style>
    /* 全局样式：页面入场动画 + 响应式 + ripple 涟漪 + body/html 基础样式 + 导航增强 */
    @keyframes pageFadeIn { from { opacity: 0; } to { opacity: 1; } }
    .page-enter { animation: pageFadeIn 350ms var(--ease); }
    html, body { margin: 0; padding: 0; overflow-x: hidden; max-width: 100vw; }
    body { font-family: var(--font-sans), system-ui, sans-serif; background: #FFFFFF; color: var(--text-800); }
    #app { width: 100%; min-height: 100vh; }

    /* 可点击元素高亮：移除 overflow:hidden 以便 box-shadow 外溢显示 */
    [data-dom-id] { position: relative; cursor: pointer; transition: box-shadow 200ms ease, transform 200ms ease, border-color 200ms ease; }
    [data-dom-id]::after { content: ''; position: absolute; inset: 0; border: 2px solid rgba(10,132,255,0.6); border-radius: inherit; opacity: 0; transform: scale(0); pointer-events: none; }
    [data-dom-id].ripple::after { opacity: 1; transform: scale(1); transition: all 300ms cubic-bezier(0.32,0.72,0,1); }
    [data-dom-id]:hover {
      box-shadow: 0 0 0 3px rgba(10,132,255,0.25), 0 4px 12px rgba(10,132,255,0.15) !important;
      transform: translateY(-1px);
    }
    /* 主要 CTA 按钮（cta-* 开头的 domId）更强的高亮 + 持续脉冲提示 */
    [data-dom-id^="cta-"] {
      box-shadow: 0 0 0 2px rgba(10,132,255,0.2), 0 2px 8px rgba(10,132,255,0.1) !important;
      animation: ctaPulse 2.5s ease-in-out infinite;
    }
    @keyframes ctaPulse {
      0%, 100% { box-shadow: 0 0 0 2px rgba(10,132,255,0.2), 0 2px 8px rgba(10,132,255,0.1); }
      50% { box-shadow: 0 0 0 4px rgba(10,132,255,0.3), 0 4px 16px rgba(10,132,255,0.2); }
    }
    [data-dom-id^="cta-"]:hover {
      box-shadow: 0 0 0 6px rgba(10,132,255,0.3), 0 6px 20px rgba(10,132,255,0.25) !important;
      transform: translateY(-2px);
    }

    /* 修复：[data-dom-id] 的 position:relative 会覆盖 .nav-next-btn 的 position:fixed，导致按钮被裁剪不可见。用 !important 恢复 fixed 定位，并上移避开底部导航条 */
    .nav-next-btn { position: fixed !important; overflow: hidden; bottom: 64px !important; z-index: 9998; }
    .nav-next-btn::after { content: ''; position: absolute; inset: 0; border: 2px solid rgba(10,132,255,0.5); border-radius: inherit; opacity: 0; transform: scale(0); pointer-events: none; }
    .nav-next-btn.ripple::after { opacity: 1; transform: scale(1); transition: all 300ms cubic-bezier(0.32,0.72,0,1); }

    /* 全局固定顶部导航栏 */
    #global-nav {
      position: fixed; top: 0; left: 0; right: 0; height: 48px;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid #E5E5EA; z-index: 9999;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; font-family: var(--font-sans), system-ui, sans-serif;
    }
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .nav-logo { font-weight: 700; font-size: 15px; color: var(--brand-500); letter-spacing: -0.01em; }
    .nav-title { font-size: 13px; color: var(--text-500); font-weight: 500; }
    .nav-center { display: flex; align-items: center; gap: 6px; }
    .nav-dot { width: 8px; height: 8px; border-radius: 50%; background: #D1D1D6; cursor: pointer; transition: all 200ms; }
    .nav-dot:hover { background: var(--brand-500); transform: scale(1.3); }
    .nav-dot.active { background: var(--brand-500); width: 24px; border-radius: 4px; }
    .nav-right { display: flex; align-items: center; gap: 8px; }
    .nav-btn { padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 500; text-decoration: none; cursor: pointer; border: 1px solid #E5E5EA; color: var(--text-800); background: #FFFFFF; transition: all 200ms; }
    .nav-btn:hover { border-color: var(--brand-500); color: var(--brand-500); }
    .nav-btn-primary { background: var(--brand-500); color: #FFFFFF; border-color: var(--brand-500); }
    .nav-btn-primary:hover { background: #0066CC; color: #FFFFFF; }

    /* 全局固定底部导航条 */
    #bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 52px;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
      border-top: 1px solid #E5E5EA; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
    }
    .bottom-nav-inner { display: flex; align-items: center; gap: 20px; }
    .bottom-nav-btn {
      padding: 8px 20px; border-radius: 999px; font-size: 13px; font-weight: 600;
      text-decoration: none; cursor: pointer; transition: all 200ms;
      font-family: var(--font-sans), system-ui, sans-serif;
    }
    .bottom-nav-prev { color: var(--text-600); border: 1px solid #E5E5EA; background: #FFFFFF; }
    .bottom-nav-prev:hover { border-color: var(--brand-500); color: var(--brand-500); }
    .bottom-nav-next { color: #FFFFFF; background: var(--brand-500); border: 1px solid var(--brand-500); box-shadow: 0 2px 8px rgba(10,132,255,0.3); }
    .bottom-nav-next:hover { background: #0066CC; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(10,132,255,0.4); }
    .bottom-nav-btn.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
    .bottom-nav-hint { font-size: 11px; color: var(--text-400); }

    /* body 顶部/底部留白，避免被导航栏/导航条遮挡 */
    body { padding-top: 48px !important; padding-bottom: 52px !important; }
    /* PPT 幻灯片下移 */
    .slide { margin-top: 0 !important; }

    @media (max-width: 1280px) { .qc-webbar { flex-wrap: wrap; height: auto; } }
    @media (max-width: 1024px) { .qc-webbar { padding: 0 8px; gap: 4px; } .qc-webbar-link { padding: 0 8px; font-size: 12px; } }
  </style>

  <script>
// === QuantCopilot V2 - Standalone Single-File Build ===
// 全部逻辑内联：路由器 + 涟漪 + 响应式 + 18 页数据

const pages = {};

// === Page: p01-cover ===
pages['p01-cover'] = (function() {
// P01 封面 — 参考实现（完整转换自 pages/p01-cover.html）
// HTML：body 内的 .slide 结构 + 导航按钮（不含 <script>/<style>）
// CSS：slide-css 标签内的专属样式（不含 theme-vars / tailwindcss 全局块）
// p01 是纯展示页，无需 mount 函数

const html = `<div class="slide">

    <!-- Decorative subtle circles -->
    <div class="deco-circle deco-circle--tl" aria-hidden="true"></div>
    <div class="deco-circle deco-circle--tr" aria-hidden="true"></div>
    <div class="deco-circle deco-circle--br" aria-hidden="true"></div>

    <!-- Main cover content -->
    <div class="cover-content">

      <!-- QC Logo SVG -->
      <div class="cover-logo-wrap">
        <svg class="cover-logo" viewBox="0 0 64 64" width="64" height="64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#0A84FF" />
              <stop offset="100%" stop-color="#64D2FF" />
            </linearGradient>
          </defs>
          <polyline points="8,52 18,44 28,38 36,22 46,28 56,12" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <circle cx="56" cy="12" r="3.5" fill="#0A84FF" opacity="0.85" />

function mount(container) {
  // 1. 因子卡片点击 header 展开/折叠
  const headers = container.querySelectorAll('.factor-header');
  if (headers && headers.length > 0) {
    headers.forEach((header) => {
      header.addEventListener('click', () => {
        const card = header.closest('.factor-card');
        if (card) {
          card.classList.toggle('expanded');
        }
      });
    });
  }

  // 2. 分类 Tab 筛选：点击 Tab 切换 active 并按因子类型过滤显示
  const tabs = container.querySelectorAll('.cat-tab');
  const cards = container.querySelectorAll('.factor-card');
  if (tabs && tabs.length > 0 && cards && cards.length > 0) {
    // Tab 文本 → factor-type 类名映射
    const typeMap = {
      '技术因子': 'tech',
      '基本面因子': 'fundamental',
      '复合因子': 'compound',
      '自定义': 'custom'
    };
    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        // 切换 active 状态
        tabs.forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        // 按类型筛选
        const type = typeMap[tab.textContent.trim()];
        cards.forEach((card) => {
          const typeEl = card.querySelector('.factor-type');
          if (!typeEl) return;
          if (!type || typeEl.classList.contains(type)) {
            card.style.display = '';
          } else {
            card.style.display = 'none';
          }
        });
      });
    });
  }
}

  return { html: html, css: css, mount: typeof mount === 'function' ? mount : null };
})();

}

function getPage(pageId) {
  return pages[pageId] || pages['placeholder'];
}

function bindRipple(container) {
  if (!container) return;
  const els = container.querySelectorAll('[data-dom-id]');
  els.forEach((el) => {
    if (el.__rippleBound) return;
    el.__rippleBound = true;
    el.addEventListener('click', () => {
      el.classList.add('ripple');
      setTimeout(() => { el.classList.remove('ripple'); }, 350);
    });
  });
}

function adjustResponsive() {
  const slide = document.querySelector('.slide');
  const app = document.getElementById('app');
  if (!app) return;
  const PPT_WIDTH = 1440;
  const PPT_HEIGHT = 810;
  const NAV_TOP = 48;
  const NAV_BOTTOM = 52;
  if (slide) {
    const vw = window.innerWidth;
    const vh = window.innerHeight - NAV_TOP - NAV_BOTTOM;
    const scaleW = vw / PPT_WIDTH;
    const scaleH = vh / PPT_HEIGHT;
    const scale = Math.min(1, scaleW, scaleH);
    slide.style.transform = 'scale(' + scale + ')';
    slide.style.transformOrigin = 'top center';
    app.style.height = (PPT_HEIGHT * scale) + 'px';
    app.style.overflow = 'hidden';
    app.style.display = 'flex';
    app.style.justifyContent = 'center';
    app.style.alignItems = 'flex-start';
  } else {
    app.style.height = '';
    app.style.overflow = '';
    app.style.display = '';
    app.style.justifyContent = '';
    app.style.alignItems = '';
  }
}

function render(pageId) {
  const app = document.getElementById('app');
  const pageStyle = document.getElementById('page-style');
  if (!app) return;
  const route = routes[pageId];
  const module = getPage(pageId);
  if (pageStyle) { pageStyle.textContent = module.css || ''; }
  app.innerHTML = module.html || '';
  if (typeof module.mount === 'function') { module.mount(app); }

  // === 移除页面内重复的导航按钮（统一使用外层框架导航） ===
  // 移除所有 class="nav-next-btn" 的页面内按钮（由底部导航条统一承担）
  app.querySelectorAll('.nav-next-btn').forEach(function(el) { el.remove(); });
  // 移除其他可能的页面内返回按钮（back-*）
  app.querySelectorAll('[data-dom-id^="back-"]').forEach(function(el) { el.remove(); });
  // 注意：保留 demo 页面中的 qc-webbar 顶部导航栏（nav-* 链接），它们是 demo 的标志性 UI

  // === 导航增强：注入顶部固定导航栏 ===
  var pptPages = ['p01-cover','p02-data-impact','p03-pain-points','p04-product','p05-nlp-strategy','p06-backtest','p07-trae-tools','p08-skills','p09-value','p10-roadmap','p11-vision','p12-thanks'];
  var navBarHtml = '<div id="global-nav">' +
    '<div class="nav-left">' +
      '<span class="nav-logo">QuantCopilot</span>' +
      '<span class="nav-title" id="nav-current-title">' + (route ? route.title : '') + '</span>' +
    '</div>' +
    '<div class="nav-center" id="nav-progress"></div>' +
    '<div class="nav-right">' +
      '<a href="#/p01-cover" class="nav-btn" data-nav="home">目录</a>' +
      '<a href="#/demo-home" class="nav-btn nav-btn-primary" data-nav="demo">Demo 体验</a>' +
    '</div>' +
  '</div>';
  app.insertAdjacentHTML('afterbegin', navBarHtml);

  // 生成 PPT 进度圆点（仅 PPT 页面显示）
  var progressEl = document.getElementById('nav-progress');
  if (progressEl) {
    progressEl.innerHTML = '';
    if (pptPages.indexOf(pageId) >= 0) {
      pptPages.forEach(function(p) {
        var dot = document.createElement('div');
        dot.className = 'nav-dot' + (p === pageId ? ' active' : '');
        dot.title = routes[p].title;
        dot.addEventListener('click', function() { location.hash = '#/' + p; });
        progressEl.appendChild(dot);
      });
    }
  }

  // === 注入底部固定导航条（上一步 / 下一步） ===
  var pageOrder = ['p01-cover','p02-data-impact','p03-pain-points','p04-product','p05-nlp-strategy','p06-backtest','p07-trae-tools','p08-skills','p09-value','p10-roadmap','p11-vision','p12-thanks','demo-home','demo-strategy-detail','demo-backtest','demo-report','demo-factor-library','demo-simulation'];
  var currentIdx = pageOrder.indexOf(pageId);
  var prevPage = currentIdx > 0 ? pageOrder[currentIdx - 1] : null;
  var nextPage = (currentIdx >= 0 && currentIdx < pageOrder.length - 1) ? pageOrder[currentIdx + 1] : null;
  var prevHtml = prevPage
    ? '<a class="bottom-nav-btn bottom-nav-prev" href="#/' + prevPage + '">← 上一步</a>'
    : '<span class="bottom-nav-btn bottom-nav-prev disabled">← 上一步</span>';
  var nextHtml = nextPage
    ? '<a class="bottom-nav-btn bottom-nav-next" href="#/' + nextPage + '">下一步 →</a>'
    : '<span class="bottom-nav-btn bottom-nav-next disabled">已到末页</span>';
  var bottomNavHtml = '<div id="bottom-nav"><div class="bottom-nav-inner">' +
    prevHtml +
    '<span class="bottom-nav-hint">点击页面中高亮元素或此按钮继续</span>' +
    nextHtml +
  '</div></div>';
  app.insertAdjacentHTML('beforeend', bottomNavHtml);

  bindRipple(app);
  if (route && Array.isArray(route.interactions)) {
    const navMap = {};
    route.interactions.forEach((it) => { navMap[it.domId] = it.targetPageId; });
    app.querySelectorAll('[data-dom-id]').forEach((el) => {
      const domId = el.getAttribute('data-dom-id');
      // 跳过 cta-* 和 back-* 的跳转绑定（这些按钮已被移除或不应再触发跳转）
      // 路由表里 cta-*/back-* 只保留定义用于兼容，底部导航条统一承担上下页导航
      if (domId && (domId.startsWith('cta-') || domId.startsWith('back-'))) return;
      const targetPageId = navMap[domId];
      if (!targetPageId) return;
      if (el.__navBound) return;
      el.__navBound = true;
      el.addEventListener('click', (e) => {
        e.preventDefault();
        const target = stripPagePrefix(targetPageId);
        setTimeout(() => {
          const targetHash = '#/' + target;
          if (location.hash !== targetHash) { location.hash = targetHash; }
        }, 220);
      });
    });
  }
  document.title = route ? (route.title + ' — QuantCopilot V2') : 'QuantCopilot V2';
  window.scrollTo(0, 0);
  app.classList.remove('page-enter');
  void app.offsetWidth;
  app.classList.add('page-enter');
  adjustResponsive();
}

function handleHashChange() {
  const hash = location.hash || '';
  const match = hash.match(/^#\/(.+)$/);
  const pageId = match ? match[1] : '';
  if (!pageId || !routes[pageId]) {
    location.hash = '#/' + DEFAULT_ROUTE;
    return;
  }
  render(pageId);
}

function initRouter() {
  window.addEventListener('hashchange', handleHashChange);
  handleHashChange();
}

window.addEventListener('resize', adjustResponsive);
window.addEventListener('hashchange', () => setTimeout(adjustResponsive, 60));
initRouter();
  </script>
</body>
</html>
