<script type="module">

// ═══════════════════════════════════════════════════════════════════════

    { id:2, species:"pine",      nutrients:4000000, stage:5, slot:1, plantedAt:"t2" },

// ═══════════════════════════════════════════════════════════════════════
// Deterministic RNG
// ═══════════════════════════════════════════════════════════════════════

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0;
  return (h >>> 0) / 0xffffffff;
}
function makeRng(seed) {
  let s = typeof seed === 'string' ? (hashStr(seed) * 0xffffffff) | 0 : seed;
  return () => { s = Math.imul(1664525, s) + 1013904223 | 0; return (s >>> 0) / 0xffffffff; };
}

// ═══════════════════════════════════════════════════════════════════════
// Tree builder (from tree.js)
// ═══════════════════════════════════════════════════════════════════════

const STAGE_SCALES = [0.15, 0.45, 0.8, 1.0, 1.0];

function getScale(stage, progress) {
  const idx = Math.max(0, Math.min(4, stage - 1));
  const base = STAGE_SCALES[idx];
  if (stage < 5 && idx < 4) return base + (STAGE_SCALES[idx + 1] - base) * progress;
  return base;
}

function buildTrunk(rng, heightRatio) {
  const h = 2.0 * heightRatio;
  const rTop = 0.12 + rng() * 0.04;
  const rBot = rTop * 1.65 + rng() * 0.03;
  return { geo: new THREE.CylinderGeometry(rTop, rBot, h, 7, 1), height: h };
}

function buildCrownSphere(rng, col) {
  const g = new THREE.IcosahedronGeometry(1.0 + rng() * 0.2, 0);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i)*(0.9+rng()*0.2), p.getY(i)*(0.88+rng()*0.24), p.getZ(i)*(0.9+rng()*0.2));
  p.needsUpdate = true; g.computeVertexNormals();
  return [{ geo:g, color:col, y:0 }];
}
function buildCrownCones3(rng, col) {
  return [{r:1.05,h:1.2,y:0},{r:0.82,h:1.1,y:0.7},{r:0.55,h:0.95,y:1.3}].map(t =>
    ({ geo: new THREE.ConeGeometry(t.r*(0.9+rng()*0.2), t.h, 8, 1), color:col, y:t.y }));
}
function buildCrownIcosphere(rng, col) {
  const g = new THREE.IcosahedronGeometry(0.95+rng()*0.18, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const n = 0.92+rng()*0.16; p.setXYZ(i, p.getX(i)*n, p.getY(i)*n, p.getZ(i)*n); }
  p.needsUpdate = true; g.computeVertexNormals();
  return [{ geo:g, color:col, y:0 }];
}
function buildCrownColumn(rng, col) {
  const g = new THREE.SphereGeometry(0.6+rng()*0.12, 8, 6);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { p.setY(i, p.getY(i)*2.2); p.setX(i, p.getX(i)*(0.85+rng()*0.15)); p.setZ(i, p.getZ(i)*(0.85+rng()*0.15)); }
  p.needsUpdate = true; g.computeVertexNormals();
  return [{ geo:g, color:col, y:0.3 }];
}
function buildCrownDrooping(rng, col) {
  const parts = [{ geo: new THREE.IcosahedronGeometry(0.85, 0), color:col, y:0 }];
  const cnt = 6 + Math.floor(rng() * 3);
  for (let i = 0; i < cnt; i++) {
    const a = (i/cnt)*Math.PI*2+rng()*0.4, d = 0.35+rng()*0.25, h = 0.6+rng()*0.4;
    parts.push({ geo: new THREE.ConeGeometry(0.06+rng()*0.04, h, 5, 1), color:col,
      x: Math.cos(a)*d, y: -0.3-h*0.5+rng()*0.1, z: Math.sin(a)*d, rotZ: 0.3+rng()*0.4, rotAngle: a, isDroop: true });
  }
  return parts;
}
function buildCrownFan(rng, col) {
  const parts = [], cnt = 6 + Math.floor(rng()*2);
  for (let i = 0; i < cnt; i++) {
    const a = (i/cnt)*Math.PI*2, len = 1.4+rng()*0.5;
    parts.push({ geo: new THREE.BoxGeometry(0.16, 0.07, len), color:col,
      x: Math.cos(a)*0.6, y: rng()*0.15-0.05, z: Math.sin(a)*0.6, rotY: a, rotX: -(0.4+rng()*0.4), isFan: true });
  }
  return parts;
}
function buildCrownMushroom(rng, col, emissive) {
  const g = new THREE.SphereGeometry(1.2+rng()*0.15, 10, 6, 0, Math.PI*2, 0, Math.PI*0.55);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, p.getY(i)*0.5);
  p.needsUpdate = true; g.computeVertexNormals();
  return [{ geo:g, color:col, y:0, emissive: emissive||null }];
}

function addFlowers(group, stage, accentColor, rng) {
  if (stage < 4) return;
  const count = stage === 4 ? 24+Math.floor(rng()*16) : 30+Math.floor(rng()*20);
  const r = stage === 5 ? 0.065 : 0.045;
  const geo = new THREE.IcosahedronGeometry(r, 0);
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(accentColor), flatShading: true,
    emissive: stage===5 ? new THREE.Color(accentColor).multiplyScalar(0.3) : new THREE.Color(0),
    roughness: 0.6, metalness: stage===5 ? 0.3 : 0.0,
  });
  const isMesh = new THREE.InstancedMesh(geo, mat, count);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < count; i++) {
    const phi = Math.acos(2*rng()-1), theta = rng()*Math.PI*2, rr = 0.9*(0.85+rng()*0.3);
    dummy.position.set(Math.sin(phi)*Math.cos(theta)*rr, Math.sin(phi)*Math.sin(theta)*rr*0.85+0.1, Math.cos(phi)*rr);
    dummy.updateMatrix(); isMesh.setMatrixAt(i, dummy.matrix);
  }
  isMesh.instanceMatrix.needsUpdate = true; isMesh.castShadow = true;
  group.add(isMesh);
}

function buildTree(visual, stage, progress, plantedAt) {
  const rng = makeRng(plantedAt);
  const micro = 0.92 + hashStr(plantedAt) * 0.16;
  const hRatio = (visual.heightRatio || 1.0) * micro;
  const scale = getScale(stage, progress);
  const group = new THREE.Group();

  const { geo: tGeo, height: tH } = buildTrunk(makeRng(plantedAt+'_trunk'), hRatio);
  const trunk = new THREE.Mesh(tGeo, new THREE.MeshStandardMaterial({ color: new THREE.Color(visual.trunkColor), flatShading: true, roughness: 0.9 }));
  trunk.position.y = tH / 2; trunk.castShadow = true; trunk.receiveShadow = true;
  group.add(trunk);

  const crownY = tH + 0.2;
  const cRng = makeRng(plantedAt+'_crown');
  const col = visual.canopyColor || '#4e8f3a';
  let parts;
  switch (visual.shape) {
    case 'cones3':    parts = buildCrownCones3(cRng, col); break;
    case 'icosphere': parts = buildCrownIcosphere(cRng, col); break;
    case 'column':    parts = buildCrownColumn(cRng, col); break;
    case 'drooping':  parts = buildCrownDrooping(cRng, col); break;
    case 'fan':       parts = buildCrownFan(cRng, col); break;
    case 'mushroom':  parts = buildCrownMushroom(cRng, col, visual.emissive); break;
    default:          parts = buildCrownSphere(cRng, col);
  }

  for (const part of parts) {
    const matOpts = { color: new THREE.Color(part.color), flatShading: true, roughness: 0.75 };
    if (part.emissive) { matOpts.emissive = new THREE.Color(part.emissive); matOpts.emissiveIntensity = 0.6; }
    const mesh = new THREE.Mesh(part.geo, new THREE.MeshStandardMaterial(matOpts));
    if (part.isDroop) {
      mesh.position.set(part.x||0, crownY+(part.y||0), part.z||0);
      if (part.rotZ !== undefined) { mesh.rotation.z = part.rotZ; mesh.rotation.y = part.rotAngle||0; }
    } else if (part.isFan) {
      mesh.position.set(part.x||0, crownY+(part.y||0), part.z||0);
      if (part.rotY !== undefined) mesh.rotation.y = part.rotY;
      if (part.rotX !== undefined) mesh.rotation.x = part.rotX;
    } else {
      mesh.position.y = crownY + (part.y||0);
    }
    mesh.castShadow = true; group.add(mesh);
  }

  if (stage >= 4) {
    const fg = new THREE.Group(); fg.position.y = crownY;
    addFlowers(fg, stage, visual.accentColor, makeRng(plantedAt+'_flower'));
    group.add(fg);
  }
  group.scale.setScalar(scale);
  return group;
}

function getTreePosition(slot, radius) {
  const r = 1.6 * Math.sqrt(slot + 0.5);
  const theta = slot * (137.508 * Math.PI / 180);
  const maxR = radius * 0.72;
  let finalR;
  if (r > maxR) { finalR = maxR * (0.25 + (hashStr(String(slot)) % 1) * 0.70); }
  else { finalR = r; }
  return { x: Math.cos(theta) * finalR, z: Math.sin(theta) * finalR };
}

// ═══════════════════════════════════════════════════════════════════════
// Island builder (from island.js)
// ═══════════════════════════════════════════════════════════════════════

function posNoise(x, z, salt) {
  const n = Math.sin(x*12.9898+z*78.233+salt*37.719)*43758.5453;
  return n - Math.floor(n);
}

function buildIsland() {
  const group = new THREE.Group();
  const rng = makeRng(42);
  const topR = 8, botR = 10, h = 3, segs = 12;
  const geo = new THREE.CylinderGeometry(topR, botR, h, segs, 2, false);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i), x = pos.getX(i), z = pos.getZ(i);
    if (y > h/2 - 0.05) {
      const rr = Math.sqrt(x*x+z*z);
      const rim = THREE.MathUtils.clamp(1 - rr/topR, 0, 1);
      pos.setY(i, y + (posNoise(x,z,1)-0.5)*1.2*(0.3+rim*0.7));
    }
  }
  pos.needsUpdate = true; geo.computeVertexNormals();
  const colors = [];
  const grass = new THREE.Color('#68c044'), dirt = new THREE.Color('#9a6838'), mid = new THREE.Color('#8aa040');
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i), x = pos.getX(i), z = pos.getZ(i);
    const t = THREE.MathUtils.clamp((y+h/2)/h, 0, 1);
    const n = posNoise(x,z,2);
    const c = t > 0.6 ? grass.clone().lerp(mid, n*0.3) : dirt.clone().lerp(mid, n*0.2);
    colors.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors:true, flatShading:true, roughness:0.92 }));
  mesh.receiveShadow = true; mesh.castShadow = true; group.add(mesh);
  group.userData.topY = h/2; group.userData.topRadius = topR;

  // Underwater root
  const root = new THREE.Mesh(new THREE.ConeGeometry(botR*0.85, 5, 10, 1),
    new THREE.MeshStandardMaterial({ color:'#6b5030', flatShading:true, roughness:1 }));
  root.position.y = -h/2 - 2.5; root.rotation.y = Math.PI/8; group.add(root);

  // Water
  const waterY = -h/2 - 0.5;
  const water = new THREE.Mesh(new THREE.CircleGeometry(42, 48),
    new THREE.MeshStandardMaterial({ color:'#3a9bd5', transparent:true, opacity:0.85, roughness:0.04, metalness:0.25, depthWrite:false }));
  water.material.polygonOffset = true; water.material.polygonOffsetFactor = -1;
  water.rotation.x = -Math.PI/2; water.position.y = waterY; water.renderOrder = 1; group.add(water);

  // Foam
  const foam = new THREE.Mesh(new THREE.RingGeometry(botR*0.92, botR*1.45, 48),
    new THREE.MeshBasicMaterial({ color:'#dff5ff', transparent:true, opacity:0.45, depthWrite:false }));
  foam.rotation.x = -Math.PI/2; foam.position.y = waterY+0.05; foam.renderOrder = 2; group.add(foam);
  const foam2 = new THREE.Mesh(new THREE.RingGeometry(botR*1.6, botR*1.78, 48),
    new THREE.MeshBasicMaterial({ color:'#ffffff', transparent:true, opacity:0.18, depthWrite:false }));
  foam2.rotation.x = -Math.PI/2; foam2.position.y = waterY+0.05; foam2.renderOrder = 2; group.add(foam2);

  // Rocks
  const rockCols = ['#9e9080','#8a7f72','#b0a898','#7a6e64'];
  for (let i = 0; i < 5; i++) {
    const a = rng()*Math.PI*2, d = 4+rng()*3.5;
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.25+rng()*0.35, 0),
      new THREE.MeshStandardMaterial({ color: rockCols[i%4], flatShading:true, roughness:0.95 }));
    rock.position.set(Math.cos(a)*d, h/2+0.05, Math.sin(a)*d);
    rock.rotation.set(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI);
    rock.scale.set(1, 0.6+rng()*0.5, 1+rng()*0.3);
    rock.castShadow = true; rock.receiveShadow = true; group.add(rock);
  }

  // Grass tufts
  for (let i = 0; i < 18; i++) {
    const a = rng()*Math.PI*2, d = 1.5+rng()*5.5;
    const cx = Math.cos(a)*d, cz = Math.sin(a)*d;
    for (let j = 0; j < 2+Math.floor(rng()*3); j++) {
      const g = new THREE.Mesh(new THREE.ConeGeometry(0.05+rng()*0.04, 0.3+rng()*0.2, 5, 1),
        new THREE.MeshStandardMaterial({ color: new THREE.Color('#4a8a2a').lerp(new THREE.Color('#7ab840'), rng()), flatShading:true, roughness:0.9 }));
      g.position.set(cx+(rng()-0.5)*0.3, h/2+0.18, cz+(rng()-0.5)*0.3);
      g.rotation.z = (rng()-0.5)*0.5; group.add(g);
    }
  }

  // Oasis decorations
  const oRng = makeRng(104);
  for (let i = 0; i < 10; i++) {
    const a = oRng()*Math.PI*2, d = 1.5+oRng()*topR*0.7;
    const gh = 0.25+oRng()*0.2;
    const gm = new THREE.Mesh(new THREE.ConeGeometry(0.06+oRng()*0.05, gh, 5),
      new THREE.MeshStandardMaterial({ color: new THREE.Color('#5aa830').lerp(new THREE.Color('#86d45a'), oRng()), flatShading:true, roughness:0.85 }));
    gm.position.set(Math.cos(a)*d, h/2+gh/2+0.05, Math.sin(a)*d); gm.rotation.z = (oRng()-0.5)*0.4; group.add(gm);
  }
  const flowerCols = ['#ff9dd2','#ffe066','#ff6b8a','#c7e3ff'];
  for (let i = 0; i < 3; i++) {
    const a = oRng()*Math.PI*2, d = 1+oRng()*topR*0.55;
    const fm = new THREE.Mesh(new THREE.SphereGeometry(0.12+oRng()*0.08, 5, 4),
      new THREE.MeshStandardMaterial({ color: flowerCols[Math.floor(oRng()*4)], flatShading:true, roughness:0.6 }));
    fm.position.set(Math.cos(a)*d, h/2+0.18, Math.sin(a)*d); group.add(fm);
  }

  return group;
}

// ═══════════════════════════════════════════════════════════════════════
// World setup (from world.js)
// ═══════════════════════════════════════════════════════════════════════

function buildSky() {
  const g = new THREE.SphereGeometry(380, 32, 16);
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { topColor:{value:new THREE.Color('#1a5ea0')}, midColor:{value:new THREE.Color('#5ab4e0')}, horizColor:{value:new THREE.Color('#c8e8f8')} },
    vertexShader: `varying float vY; void main(){ vY = normalize(position).y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 topColor; uniform vec3 midColor; uniform vec3 horizColor; varying float vY;
      void main(){ float t = clamp(vY, -0.1, 1.0); vec3 col = mix(horizColor, midColor, smoothstep(0.0, 0.35, t));
      col = mix(col, topColor, smoothstep(0.3, 0.85, t)); gl_FragColor = vec4(col, 1.0); }`,
  });
  const sky = new THREE.Mesh(g, m); sky.renderOrder = -1; return sky;
}

function buildCloud(rng) {
  const g = new THREE.Group();
  for (let i = 0; i < 4+Math.floor(rng()*4); i++) {
    const r = 2.5+rng()*2.5;
    const b = new THREE.Mesh(new THREE.SphereGeometry(r, 7, 5),
      new THREE.MeshStandardMaterial({ color:'#fff', transparent:true, opacity:0.82+rng()*0.12, roughness:1, flatShading:true }));
    b.position.set((rng()-0.5)*8, (rng()-0.5)*1.5, (rng()-0.5)*4);
    b.scale.y = 0.45+rng()*0.2; g.add(b);
  }
  return g;
}

// ═══════════════════════════════════════════════════════════════════════
// Particle effects
// ═══════════════════════════════════════════════════════════════════════

class ParticlePool {
  constructor(scene) {
    this._scene = scene; this._particles = []; this._active = new Set();
    this._geo = new THREE.SphereGeometry(0.04, 4, 3);
    for (let i = 0; i < 64; i++) {
      const mat = new THREE.MeshBasicMaterial({ color:'#88ffaa', transparent:true, opacity:1 });
      const mesh = new THREE.Mesh(this._geo, mat); mesh.visible = false; scene.add(mesh);
      this._particles.push({ mesh, active:false, life:0, maxLife:0, vy:0, vx:0, vz:0 });
    }
  }
  emit(pos, count, color, life) {
    const hex = color==='gold' ? '#ffd700' : color==='gray' ? '#aaa' : '#88ffaa';
    let n = 0;
    for (const p of this._particles) {
      if (p.active || n >= count) continue;
      p.active = true; p.life = 0; p.maxLife = life;
      p.vy = 1.5+Math.random()*1.5; p.vx = (Math.random()-0.5)*0.8; p.vz = (Math.random()-0.5)*0.8;
      p.mesh.material.color.set(hex); p.mesh.material.opacity = 1;
      p.mesh.position.set(pos.x+(Math.random()-0.5)*0.5, pos.y, pos.z+(Math.random()-0.5)*0.5);
      p.mesh.visible = true; this._active.add(p); n++;
    }
  }
  update(dt) {
    for (const p of this._active) {
      p.life += dt; const t = p.life/p.maxLife;
      if (t >= 1) { p.active = false; p.mesh.visible = false; this._active.delete(p); continue; }
      p.mesh.position.x += p.vx*dt; p.mesh.position.y += p.vy*dt; p.mesh.position.z += p.vz*dt;
      p.mesh.material.opacity = 1-t; p.vy *= 1-dt*0.8; p.vx *= 1-dt*0.6; p.vz *= 1-dt*0.6;
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
// Main init
// ═══════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('app-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(canvas.clientWidth, canvas.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#5ab4e0');
scene.fog = new THREE.FogExp2('#a8d8f0', 0.0025);
scene.add(buildSky());

scene.add(new THREE.HemisphereLight('#a8d0f0', '#c8a860', 1.0));
const sun = new THREE.DirectionalLight('#ffe8c0', 2.4);
sun.position.set(12, 40, 10); sun.castShadow = true;
sun.shadow.mapSize.width = 1024; sun.shadow.mapSize.height = 1024;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 90;
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -22;
sun.shadow.bias = -0.003; scene.add(sun);
scene.add(new THREE.AmbientLight('#d0e8ff', 0.55));
const rim = new THREE.DirectionalLight('#c0d8ff', 0.7);
rim.position.set(-18, 12, -12); scene.add(rim);

// Clouds
[{a:0.4,r:44,y:17},{a:1.9,r:50,y:18},{a:3.3,r:44,y:16},{a:4.8,r:52,y:18},{a:2.6,r:46,y:17},{a:5.6,r:48,y:16}]
  .forEach((cp, i) => {
    const c = buildCloud(makeRng(i*17+3));
    c.position.set(Math.cos(cp.a)*cp.r, cp.y, Math.sin(cp.a)*cp.r);
    c.scale.setScalar(0.32+(i%3)*0.05); scene.add(c);
  });

const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth/canvas.clientHeight, 0.1, 1000);
camera.position.set(18, 14, 18); camera.lookAt(0, 1.5, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minPolarAngle = 0.15; controls.maxPolarAngle = Math.PI/2 - 0.05;
controls.minDistance = 14; controls.maxDistance = 40; controls.update();

let autoTimer = null;
controls.addEventListener('start', () => { controls.autoRotate = false; if (autoTimer) clearTimeout(autoTimer); });
controls.addEventListener('end', () => { if (autoTimer) clearTimeout(autoTimer); autoTimer = setTimeout(() => controls.autoRotate = true, 5000); });

window.addEventListener('resize', () => {
  camera.aspect = canvas.clientWidth / canvas.clientHeight;
  camera.updateProjectionMatrix(); renderer.setSize(canvas.clientWidth, canvas.clientHeight);
});

// Double-click reset
canvas.addEventListener('dblclick', () => {
  camera.position.set(18, 14, 18); camera.lookAt(0, 1.5, 0);
  controls.target.set(0, 1.5, 0); controls.update();
});

// ── Build scene ──
const islandGroup = buildIsland();
scene.add(islandGroup);
const TOP_Y = islandGroup.userData.topY;
const TOP_R = islandGroup.userData.topRadius;

const treeGroups = new Map();
const particles = new ParticlePool(scene);

function calcProgress(nutrients, stage) {
  if (stage >= 5) return 1;
  const lo = CONFIG.stageThresholds[stage-1]||0;
  const hi = CONFIG.stageThresholds[stage];
  if (!hi || hi <= lo) return 0;
  return Math.min(1, Math.max(0, (nutrients-lo)/(hi-lo)));
}

function placeTree(t) {
  const visual = CONFIG.species[t.species]; if (!visual) return;
  const prog = calcProgress(t.nutrients, t.stage);
  const g = buildTree(visual, t.stage, prog, t.plantedAt);
  const p = getTreePosition(t.slot, TOP_R);
  g.position.set(p.x, TOP_Y, p.z);
  islandGroup.add(g);
  treeGroups.set(t.id, g);
}

for (const t of state.trees) placeTree(t);

// ── HUD helpers ──
function updateHUD() {
  const activeTree = [...state.trees].reverse().find(t => t.stage < 5) || state.trees[state.trees.length-1];
  if (!activeTree) return;
  const sp = CONFIG.speciesList.find(s => s.id === activeTree.species);
  const prog = calcProgress(activeTree.nutrients, activeTree.stage);
  document.getElementById('hud-tree-name').textContent = sp ? sp.name : activeTree.species;
  document.getElementById('hud-tree-stage').textContent = CONFIG.stageNames[(activeTree.stage||1)-1];
  document.getElementById('hud-fill').style.width = (prog*100).toFixed(1)+'%';
  document.getElementById('hud-pct').textContent = Math.round(prog*100)+'%';
  document.getElementById('hud-count').textContent = state.trees.length+' 棵树';
  document.getElementById('hud-tokens').textContent = Math.floor(state.todayTokens).toLocaleString('zh-CN')+' tokens';

  // Island level
  let lvl = CONFIG.islandLevels[0];
  for (const l of CONFIG.islandLevels) { if (state.trees.length >= l.minTrees) lvl = l; }
  state.island.level = lvl.id;
  const meta = LEVEL_META[lvl.id];
  document.getElementById('hud-badge').textContent = meta.emoji + ' ' + meta.label;
  document.getElementById('hud-badge').style.color = meta.color;
}

// ── Simulate growth ──
const allSpeciesIds = Object.keys(CONFIG.species);

document.getElementById('grow-btn').addEventListener('click', () => {
  const added = 100000 + Math.floor(Math.random() * 200000);
  state.todayTokens += added;

  // Find active tree
  let active = [...state.trees].reverse().find(t => t.stage < 5);
  if (!active) {
    // All capped — plant new tree
    const newId = state.trees.length + 1;
    const sp = allSpeciesIds[Math.floor(Math.random() * allSpeciesIds.length)];
    active = { id: newId, species: sp, nutrients: 0, stage: 1, slot: state.trees.length, plantedAt: 'new'+newId };
    state.trees.push(active);
    placeTree(active);
    // Particle burst
    const g = treeGroups.get(newId);
    if (g) { const wp = new THREE.Vector3(); g.getWorldPosition(wp); particles.emit(wp, 12, 'green', 1); }
  }

  active.nutrients = Math.min(active.nutrients + added, CONFIG.stageThresholds[4]);

  // Recalculate stage
  let newStage = 1;
  for (let s = 4; s >= 1; s--) { if (active.nutrients >= CONFIG.stageThresholds[s]) { newStage = s + 1; break; } }
  const stageChanged = newStage !== active.stage;
  active.stage = newStage;

  // Rebuild tree visual
  const oldG = treeGroups.get(active.id);
  if (oldG) {
    islandGroup.remove(oldG);
    oldG.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (Array.isArray(o.material)) o.material.forEach(m => m.dispose()); else o.material.dispose(); }});
  }
  const prog = calcProgress(active.nutrients, active.stage);
  const newG = buildTree(CONFIG.species[active.species], active.stage, prog, active.plantedAt);
  const pos = getTreePosition(active.slot, TOP_R);
  newG.position.set(pos.x, TOP_Y, pos.z);

  if (stageChanged) {
    newG.scale.setScalar(0);
    const target = getScale(active.stage, prog);
    const start = performance.now();
    function bounce(now) {
      const t = Math.min(1, (now - start) / 500);
      const c1 = 1.70158, c3 = c1+1;
      const eased = 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2);
      newG.scale.setScalar(target * eased);
      if (t < 1) requestAnimationFrame(bounce);
    }
    requestAnimationFrame(bounce);
  }

  islandGroup.add(newG);
  treeGroups.set(active.id, newG);

  // Particles
  const wp = new THREE.Vector3(); newG.getWorldPosition(wp);
  particles.emit(wp, 8+Math.floor(Math.random()*8), stageChanged ? 'gold' : 'green', 1.2);

  updateHUD();
});

// ── Render loop ──
let last = 0;
function loop(time) {
  const dt = Math.min((time - last) / 1000, 0.1); last = time;
  particles.update(dt);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
