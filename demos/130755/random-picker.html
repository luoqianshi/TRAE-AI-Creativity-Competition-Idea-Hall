<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 课堂互动随机点名器</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 50%, #a18cd1 100%);
    background-size: 400% 400%;
    animation: gradientShift 8s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container {
    width: 100%;
    max-width: 900px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 40px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  h1 {
    text-align: center;
    font-size: 28px;
    color: #fff;
    margin-bottom: 10px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.15);
    letter-spacing: 2px;
  }

  h1 .highlight {
    background: linear-gradient(135deg, #f6d365, #fda085);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .student-count {
    text-align: center;
    color: rgba(255,255,255,0.9);
    font-size: 14px;
    margin-bottom: 30px;
  }

  .student-count span {
    font-weight: bold;
    font-size: 18px;
    color: #fff;
    background: rgba(255,255,255,0.2);
    padding: 2px 12px;
    border-radius: 20px;
  }

  /* ---- 主交互区 ---- */
  .main-area {
    text-align: center;
    position: relative;
    margin-bottom: 30px;
  }

  .name-display {
    background: rgba(255, 255, 255, 0.85);
    border-radius: 20px;
    padding: 40px 20px;
    margin-bottom: 20px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }

  .name-display .name {
    font-size: 64px;
    font-weight: 800;
    color: #333;
    transition: all 0.15s ease;
    line-height: 1.3;
  }

  .name-display .name.highlight {
    animation: bounceHighlight 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    color: #4facfe;
  }

  @keyframes bounceHighlight {
    0% { transform: scale(1); }
    30% { transform: scale(1.3); color: #f6d365; }
    50% { transform: scale(0.95); }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  .name-display .hint-text {
    font-size: 18px;
    color: #999;
  }

  .name-display .warning-badge {
    display: none;
    margin-top: 10px;
    padding: 6px 20px;
    background: #ff6b6b;
    color: #fff;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    animation: flashWarning 0.8s ease infinite;
  }

  .name-display .warning-badge.show {
    display: inline-block;
  }

  @keyframes flashWarning {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,107,107,0.6); }
    50% { opacity: 0.8; box-shadow: 0 0 0 8px rgba(255,107,107,0); }
  }

  .name-display.warning-border {
    animation: warningBorder 0.8s ease infinite;
  }

  @keyframes warningBorder {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,107,0.5), inset 0 2px 10px rgba(0,0,0,0.05); }
    50% { box-shadow: 0 0 0 6px rgba(255,107,107,0.3), inset 0 2px 10px rgba(0,0,0,0.05); }
  }

  .btn-start {
    padding: 18px 60px;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #f6d365, #fda085);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(253, 160, 133, 0.4);
    transition: all 0.3s ease;
    letter-spacing: 3px;
    position: relative;
    overflow: hidden;
  }

  .btn-start::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
    animation: shimmer 2s ease-in-out infinite;
  }

  @keyframes shimmer {
    0% { transform: translate(-30%, -30%) rotate(0deg); }
    100% { transform: translate(30%, 30%) rotate(360deg); }
  }

  .btn-start:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(253, 160, 133, 0.6);
  }

  .btn-start:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn-start:disabled {
    background: linear-gradient(135deg, #ccc, #bbb);
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    cursor: not-allowed;
  }

  .btn-start:disabled::before {
    display: none;
  }

  /* ---- 主体双栏布局 ---- */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    border-radius: 16px;
    padding: 20px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: #555;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-title .badge {
    font-size: 12px;
    font-weight: 400;
    background: #e8e8e8;
    padding: 2px 10px;
    border-radius: 20px;
    color: #666;
  }

  /* ---- 名单管理 ---- */
  .textarea-input {
    width: 100%;
    height: 100px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    outline: none;
    resize: vertical;
    transition: border-color 0.3s;
    font-family: inherit;
    margin-bottom: 10px;
  }

  .textarea-input:focus {
    border-color: #4facfe;
  }

  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  .btn {
    padding: 8px 18px;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn:hover {
    transform: translateY(-1px);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn-import {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #fff;
  }

  .btn-add {
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    color: #fff;
  }

  .btn-clear {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: #fff;
  }

  .btn-reset {
    background: linear-gradient(135deg, #ffecd2, #fcb69f);
    color: #666;
  }

  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-height: 160px;
    overflow-y: auto;
    padding: 4px 0;
  }

  .tag-list::-webkit-scrollbar {
    width: 4px;
  }

  .tag-list::-webkit-scrollbar-thumb {
    background: #ccc;
    border-radius: 4px;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: linear-gradient(135deg, #e0e7ff, #f0e6ff);
    border-radius: 20px;
    font-size: 14px;
    color: #333;
    font-weight: 500;
    transition: all 0.2s;
    cursor: pointer;
  }

  .tag:hover {
    transform: scale(1.05);
    opacity: 0.8;
  }

  .tag .remove {
    font-size: 14px;
    color: #999;
    cursor: pointer;
    line-height: 1;
  }

  .tag .remove:hover {
    color: #ff6b6b;
  }

  /* ---- 已点名列表 ---- */
  .called-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-height: 200px;
    overflow-y: auto;
    padding: 4px 0;
  }

  .called-list::-webkit-scrollbar {
    width: 4px;
  }

  .called-list::-webkit-scrollbar-thumb {
    background: #ccc;
    border-radius: 4px;
  }

  .called-tag {
    padding: 6px 14px;
    background: linear-gradient(135deg, #f6d365, #fda085);
    border-radius: 20px;
    font-size: 14px;
    color: #fff;
    font-weight: 500;
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .empty-hint {
    color: #bbb;
    font-size: 14px;
    padding: 20px 0;
    text-align: center;
  }

  /* ---- Toast ---- */
  .toast-container {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    pointer-events: none;
  }

  .toast {
    padding: 12px 28px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    animation: toastIn 0.3s ease, toastOut 0.3s ease 2.2s forwards;
    pointer-events: auto;
  }

  .toast.warning {
    background: rgba(255, 107, 107, 0.9);
  }

  .toast.success {
    background: rgba(67, 233, 123, 0.9);
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes toastOut {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-20px); }
  }

  /* ---- 响应式 ---- */
  @media (max-width: 700px) {
    .container {
      padding: 20px;
    }
    h1 {
      font-size: 20px;
    }
    .name-display .name {
      font-size: 36px;
    }
    .btn-start {
      padding: 14px 40px;
      font-size: 18px;
    }
    .main-grid {
      grid-template-columns: 1fr;
    }
    .name-display {
      padding: 24px 16px;
      min-height: 90px;
    }
  }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="container">
  <h1>🎯 <span class="highlight">AI</span> 课堂互动 · 随机点名</h1>
  <div class="student-count">
    👥 总人数：<span id="totalCount">10</span>
  </div>

  <!-- 主交互区 -->
  <div class="main-area">
    <div class="name-display" id="nameDisplay">
      <div class="name" id="studentName">🎯 准备点名</div>
      <div class="warning-badge" id="warningBadge">⚠️ 该同学已被点过！</div>
    </div>
    <button class="btn-start" id="btnStart">开始点名</button>
  </div>

  <!-- 双栏布局 -->
  <div class="main-grid">
    <!-- 左：名单管理 -->
    <div class="card">
      <div class="card-title">
        📋 名单管理
        <span class="badge" id="countBadge">10 人</span>
      </div>
      <textarea class="textarea-input" id="nameInput" placeholder="每行输入一个姓名，支持批量导入……">张明
李红
王强
赵丽
刘洋
陈静
杨帆
黄敏
吴迪
周洁</textarea>
      <div class="btn-group">
        <button class="btn btn-import" id="btnImport">📥 导入名单</button>
        <button class="btn btn-add" id="btnAdd">➕ 添加学生</button>
        <button class="btn btn-clear" id="btnClear">🗑️ 清空名单</button>
      </div>
      <div class="tag-list" id="tagList"></div>
    </div>

    <!-- 右：已点名记录 -->
    <div class="card">
      <div class="card-title">
        ✅ 已点名记录
        <span class="badge" id="calledBadge">0 人</span>
      </div>
      <div class="btn-group">
        <button class="btn btn-reset" id="btnReset">🔄 重置记录</button>
      </div>
      <div class="called-list" id="calledList"></div>
      <div class="empty-hint" id="emptyHint">暂无点名记录</div>
    </div>
  </div>
</div>

<script>
  // ====== 数据 ======
  let students = [];
  let calledStudents = [];
  let isRolling = false;
  let rollTimer = null;
  let rollAnimFrame = null;

  // DOM 引用
  const studentNameEl = document.getElementById('studentName');
  const nameDisplay = document.getElementById('nameDisplay');
  const warningBadge = document.getElementById('warningBadge');
  const btnStart = document.getElementById('btnStart');
  const nameInput = document.getElementById('nameInput');
  const btnImport = document.getElementById('btnImport');
  const btnAdd = document.getElementById('btnAdd');
  const btnClear = document.getElementById('btnClear');
  const btnReset = document.getElementById('btnReset');
  const tagList = document.getElementById('tagList');
  const calledList = document.getElementById('calledList');
  const emptyHint = document.getElementById('emptyHint');
  const totalCount = document.getElementById('totalCount');
  const countBadge = document.getElementById('countBadge');
  const calledBadge = document.getElementById('calledBadge');
  const toastContainer = document.getElementById('toastContainer');

  // ====== Toast ======
  function showToast(msg, type) {
    const el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    el.textContent = msg;
    toastContainer.appendChild(el);
    setTimeout(() => { el.remove(); }, 2500);
  }

  // ====== 渲染 ======
  function renderTags() {
    tagList.innerHTML = '';
    students.forEach((s, i) => {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.innerHTML = `${s} <span class="remove" data-index="${i}">×</span>`;
      tag.querySelector('.remove').addEventListener('click', (e) => {
        e.stopPropagation();
        removeStudent(i);
      });
      tagList.appendChild(tag);
    });
    const count = students.length;
    totalCount.textContent = count;
    countBadge.textContent = count + ' 人';
  }

  function renderCalled() {
    calledList.innerHTML = '';
    calledStudents.forEach(name => {
      const tag = document.createElement('span');
      tag.className = 'called-tag';
      tag.textContent = name;
      calledList.appendChild(tag);
    });
    calledBadge.textContent = calledStudents.length + ' 人';
    emptyHint.style.display = calledStudents.length > 0 ? 'none' : 'block';
  }

  // ====== 学生管理 ======
  function initStudents(arr) {
    students = [...arr];
    renderTags();
    // 如果当前显示的是占位文字，重置
    if (studentNameEl.textContent === '🎯 准备点名' || studentNameEl.textContent === '—') {
      studentNameEl.textContent = '🎯 准备点名';
    } else if (students.length > 0) {
      // 保留当前显示的名字，但确保它属于名单
      const cur = studentNameEl.textContent;
      if (!students.includes(cur)) {
        studentNameEl.textContent = students[0] || '🎯 准备点名';
      }
    }
  }

  function addStudent(name) {
    name = name.trim();
    if (!name) return false;
    if (students.includes(name)) {
      showToast('该学生已存在：' + name, 'warning');
      return false;
    }
    students.push(name);
    renderTags();
    showToast('已添加：' + name, 'success');
    return true;
  }

  function removeStudent(index) {
    if (students.length <= 1) {
      showToast('至少需要保留 1 名学生', 'warning');
      return;
    }
    const removed = students.splice(index, 1)[0];
    renderTags();
    // 如果当前显示的是被删除的学生，重置
    if (studentNameEl.textContent === removed) {
      studentNameEl.textContent = students[0] || '🎯 准备点名';
    }
    showToast('已移除：' + removed);
  }

  function importFromTextarea() {
    const raw = nameInput.value;
    const lines = raw.split('\n').map(s => s.trim()).filter(s => s);
    if (lines.length === 0) {
      showToast('请输入至少一个姓名', 'warning');
      return;
    }
    // 去重
    const unique = [];
    const seen = new Set();
    lines.forEach(s => {
      if (!seen.has(s)) {
        seen.add(s);
        unique.push(s);
      }
    });
    initStudents(unique);
    showToast('已导入 ' + unique.length + ' 名学生', 'success');
  }

  function clearAllStudents() {
    if (students.length === 0) return;
    if (!confirm('确定要清空所有学生名单吗？')) return;
    students = [];
    renderTags();
    studentNameEl.textContent = '🎯 准备点名';
    showToast('名单已清空');
  }

  function resetCalledRecords() {
    if (calledStudents.length === 0) {
      showToast('暂无点名记录');
      return;
    }
    calledStudents = [];
    renderCalled();
    nameDisplay.classList.remove('warning-border');
    warningBadge.classList.remove('show');
    showToast('已清空点名记录', 'success');
  }

  // ====== 点名核心 ======
  function startRoll() {
    if (isRolling) return;
    if (students.length === 0) {
      showToast('名单为空，请先导入学生', 'warning');
      return;
    }

    isRolling = true;
    btnStart.disabled = true;
    nameDisplay.classList.remove('warning-border');
    warningBadge.classList.remove('show');
    studentNameEl.classList.remove('highlight');

    // 滚动阶段：2.5 秒
    const rollDuration = 2000 + Math.random() * 800; // 2~2.8 秒
    const startTime = performance.now();
    let lastIdx = -1;

    function rollStep(timestamp) {
      const elapsed = timestamp - startTime;
      // 随机选择
      let idx;
      do {
        idx = Math.floor(Math.random() * students.length);
      } while (idx === lastIdx && students.length > 1);
      lastIdx = idx;
      studentNameEl.textContent = students[idx];
      studentNameEl.style.transform = 'scale(0.92)';
      requestAnimationFrame(() => {
        studentNameEl.style.transform = 'scale(1)';
      });

      if (elapsed < rollDuration) {
        rollAnimFrame = requestAnimationFrame(rollStep);
      } else {
        // 减速阶段：再滚 0.3~0.5 秒，逐步变慢
        const slowStart = performance.now();
        const slowDuration = 300 + Math.random() * 200;
        let slowCount = 0;

        function slowStep(now) {
          const slowElapsed = now - slowStart;
          // 间隔逐渐增大 —— 模拟减速
          const gap = 80 + (slowElapsed / slowDuration) * 200;
          slowCount++;
          if (slowCount % Math.ceil(gap / 40) === 0 || slowElapsed < 50) {
            let idx2;
            do {
              idx2 = Math.floor(Math.random() * students.length);
            } while (idx2 === lastIdx && students.length > 1);
            lastIdx = idx2;
            studentNameEl.textContent = students[idx2];
            studentNameEl.style.transform = 'scale(0.92)';
            requestAnimationFrame(() => {
              studentNameEl.style.transform = 'scale(1)';
            });
          }

          if (slowElapsed < slowDuration) {
            rollAnimFrame = requestAnimationFrame(slowStep);
          } else {
            // 结束
            const finalName = students[idx];
            studentNameEl.textContent = finalName;
            finishRoll(finalName);
          }
        }

        rollAnimFrame = requestAnimationFrame(slowStep);
      }
    }

    rollAnimFrame = requestAnimationFrame(rollStep);
  }

  function finishRoll(name) {
    isRolling = false;
    btnStart.disabled = false;

    // 弹跳高亮动画
    studentNameEl.classList.remove('highlight');
    void studentNameEl.offsetWidth; // 触发回流
    studentNameEl.classList.add('highlight');

    // 检查是否已点过
    if (calledStudents.includes(name)) {
      nameDisplay.classList.add('warning-border');
      warningBadge.classList.add('show');
      showToast('⚠️ 该同学已被点过：' + name, 'warning');
    } else {
      nameDisplay.classList.remove('warning-border');
      warningBadge.classList.remove('show');
    }

    // 加入已点名列表
    calledStudents.push(name);
    renderCalled();
  }

  // ====== 事件绑定 ======
  btnStart.addEventListener('click', startRoll);

  btnImport.addEventListener('click', importFromTextarea);

  btnAdd.addEventListener('click', () => {
    const raw = nameInput.value;
    const lines = raw.split('\n').map(s => s.trim()).filter(s => s);
    if (lines.length === 0) {
      showToast('请在输入框中输入姓名', 'warning');
      return;
    }
    let added = 0;
    lines.forEach(s => {
      if (addStudent(s)) added++;
    });
    if (added > 0) {
      nameInput.value = '';
      renderTags();
      showToast('成功添加 ' + added + ' 名学生', 'success');
    }
  });

  btnClear.addEventListener('click', clearAllStudents);

  btnReset.addEventListener('click', resetCalledRecords);

  // 键盘快捷键：Enter 添加
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      btnAdd.click();
    }
  });

  // ====== 初始化 ======
  (function init() {
    const defaultNames = ['张明', '李红', '王强', '赵丽', '刘洋', '陈静', '杨帆', '黄敏', '吴迪', '周洁'];
    initStudents(defaultNames);
    renderCalled();
  })();
</script>
</body>
</html>
