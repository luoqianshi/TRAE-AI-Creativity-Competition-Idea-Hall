<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮标数据监控系统 V1.18</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0e17; --bg2: #0d1424; --bg3: #111d30;
            --border: rgba(0, 212, 255, 0.35); --border2: rgba(0, 212, 255, 0.2);
            --cyan: #00d4ff; --green: #00ff88; --red: #ff6666; --yellow: #ffbb44;
            --text: #e0e6ed; --text2: #8899aa; --text3: #556677;
        }
        body { font-family: "Microsoft YaHei", Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; font-size: 15px; }

        .bg-layer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(ellipse at 30% 20%, rgba(0,100,150,0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(0,80,100,0.2) 0%, transparent 50%); }

        .container { position: relative; z-index: 1; padding: 12px; display: flex; flex-direction: column; gap: 12px; min-height: 100vh; }

        .title-bar { background: linear-gradient(135deg, rgba(0,20,50,0.95), rgba(0,30,60,0.9)); border: 1px solid var(--border); border-radius: 6px; padding: 10px 20px; display: flex; align-items: center; gap: 22px; box-shadow: 0 0 18px rgba(0,212,255,0.12); }
        .title-bar h1 { font-size: 20px; font-weight: bold; letter-spacing: 4px;
            background: linear-gradient(90deg, var(--cyan), var(--green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .title-bar h1::before { content: "◆ "; color: var(--green); -webkit-text-fill-color: var(--green); font-size: 15px; }
        .title-right { display: flex; align-items: center; gap: 18px; margin-left: auto; }
        .conn-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); transition: all 0.3s; }
        .conn-dot.online { background: var(--green); box-shadow: 0 0 14px var(--green); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        .conn-text { font-size: 13px; color: var(--text2); }
        .conn-type { font-size: 10px; color: var(--text3); background: rgba(0,212,255,0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border2); }
        .top-time { font-size: 14px; color: var(--cyan); font-weight: bold; }
        .version { font-size: 12px; color: var(--text3); background: rgba(0,212,255,0.1); padding: 4px 12px; border-radius: 10px; border: 1px solid var(--border2); }

        .control-bar { background: rgba(13,20,36,0.9); border: 1px solid var(--border); border-radius: 6px; padding: 9px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; box-shadow: 0 0 14px rgba(0,212,255,0.1); }

        .conn-mode-group { display: flex; align-items: center; gap: 8px; background: rgba(0,50,80,0.5); padding: 6px 12px; border-radius: 5px; border: 1px solid var(--border2); }
        .conn-mode-group label { font-size: 13px; color: var(--cyan); font-weight: bold; }
        .conn-mode-btn { padding: 5px 12px; border: 1px solid transparent; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; background: transparent; color: var(--text3); transition: all 0.3s; }
        .conn-mode-btn.active { background: rgba(0,212,255,0.2); border-color: var(--cyan); color: var(--cyan); }
        .conn-mode-btn:hover:not(.active) { color: var(--text); }

        .serial-group { display: flex; align-items: center; gap: 7px; }
        .serial-group label { font-size: 13px; color: var(--cyan); font-weight: bold; }
        .serial-group select { background: rgba(0,50,80,0.7); color: var(--green); border: 1px solid var(--cyan); padding: 6px 10px; border-radius: 4px; font-size: 12px; min-width: 100px; }

        .ws-group { display: flex; align-items: center; gap: 7px; }
        .ws-group label { font-size: 13px; color: var(--cyan); font-weight: bold; }
        .ws-group input { background: rgba(0,50,80,0.7); color: var(--green); border: 1px solid var(--cyan); padding: 6px 10px; border-radius: 4px; font-size: 12px; min-width: 240px; }
        .ws-addr-display { font-family: monospace; color: var(--green); font-size: 11px; background: rgba(0,80,40,0.5); padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(0,255,136,0.3); }
        .ws-status { font-size: 11px; color: var(--yellow); margin-left: 8px; }

        .btn { padding: 7px 16px; border: none; border-radius: 5px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-green { background: linear-gradient(135deg, #008855, #00aa66); color: #000; border: 1px solid var(--green); }
        .btn-green:hover { box-shadow: 0 0 14px rgba(0,255,136,0.5); }
        .btn-red { background: linear-gradient(135deg, #883333, #aa4444); color: #fff; border: 1px solid var(--red); }
        .btn-blue { background: linear-gradient(135deg, #005577, #006688); color: #fff; border: 1px solid var(--cyan); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none !important; }

        .ctrl-group { display: flex; align-items: center; gap: 7px; }
        .ctrl-group label { font-size: 13px; color: var(--cyan); font-weight: bold; }
        .ctrl-group select, .ctrl-group input { background: rgba(0,50,80,0.7); color: var(--green); border: 1px solid var(--cyan); padding: 6px 10px; border-radius: 4px; font-size: 12px; }
        .ctrl-group select { min-width: 110px; }
        .ctrl-group input[type="text"] { min-width: 200px; }

        .panel { background: rgba(13,20,36,0.88); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; box-shadow: 0 2px 15px rgba(0,0,0,0.35); display: flex; flex-direction: column; }
        .panel-header { background: linear-gradient(90deg, rgba(0,100,160,0.4), rgba(0,50,100,0.25)); padding: 8px 14px; border-bottom: 1px solid var(--border2); display: flex; justify-content: space-between; align-items: center; }
        .panel-header h3 { color: var(--cyan); font-size: 14px; font-weight: bold; letter-spacing: 1px; }
        .panel-header h3::before { content: "▷ "; color: var(--green); font-size: 11px; }
        .panel-badge { background: rgba(0,255,136,0.15); border: 1px solid rgba(0,255,136,0.4); color: var(--green); padding: 3px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; }

        .latest-values { padding: 8px 12px; background: rgba(0,0,0,0.25); display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid var(--border2); }
        .latest-item { display: flex; align-items: center; gap: 5px; font-size: 13px; }
        .latest-item .name { color: var(--text3); }
        .latest-item .value { color: var(--cyan); font-weight: bold; font-family: monospace; font-size: 14px; }
        .latest-item .unit { color: var(--text3); font-size: 11px; }

        .params-row { padding: 6px 12px; background: rgba(0,0,0,0.15); display: flex; flex-wrap: wrap; gap: 5px; border-bottom: 1px solid var(--border2); }
        .param-chip { padding: 3px 9px; background: rgba(0,150,200,0.1); border: 1px solid rgba(0,180,220,0.2); border-radius: 10px; font-size: 11px; cursor: pointer; transition: all 0.2s; color: var(--text3); }
        .param-chip:hover { background: rgba(0,150,200,0.25); color: var(--cyan); }
        .param-chip.on { border-color: var(--green); background: rgba(0,255,136,0.12); color: var(--green); }
        .param-chip input { display: none; }

        /* 图表区域：加入重置按钮 */
        .chart-wrap { height: 160px; padding: 6px 8px; position: relative; flex: 1; }
        .chart-wrap canvas { display: block; }
        .chart-tools { position: absolute; top: 4px; right: 8px; display: flex; gap: 4px; z-index: 10; }
        .chart-tools button { background: rgba(0,50,80,0.7); border: 1px solid var(--border2); color: var(--cyan); padding: 2px 8px; border-radius: 3px; font-size: 10px; cursor: pointer; font-weight: bold; }
        .chart-tools button:hover { background: rgba(0,150,200,0.3); }
        .chart-hint { position: absolute; bottom: 4px; right: 8px; font-size: 10px; color: var(--text3); background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 3px; }

        .row-1 { display: grid; grid-template-columns: 1.1fr 1.8fr 1.1fr; gap: 12px; height: 300px; }

        .map-panel { }
        .gps-wrap { flex: 1; position: relative; min-height: 0; overflow: hidden; }
        .gps-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #0a1628, #0d2035, #0a1628); }
        .gps-img { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; object-fit: cover; }
        .gps-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: grab; }
        .gps-canvas.dragging { cursor: grabbing; }

        .gps-mini-info { position: absolute; top: 10px; left: 10px; background: rgba(0,20,40,0.88); border: 1px solid var(--border); border-radius: 5px; padding: 8px 12px; font-size: 13px; font-family: monospace; color: var(--cyan); line-height: 1.7; pointer-events: none; }
        .gps-mini-info .row { display: flex; gap: 8px; }
        .gps-mini-info .lbl { color: var(--text3); }
        .gps-mini-info .val { color: var(--green); font-weight: bold; }

        .gps-tip { position: absolute; background: rgba(0,20,40,0.95); border: 1px solid var(--cyan); border-radius: 5px; padding: 10px 14px; font-size: 12px; pointer-events: none; display: none; z-index: 50; box-shadow: 0 0 18px rgba(0,212,255,0.3); font-family: monospace; line-height: 1.8; }
        .gps-tip .tip-row { display: flex; gap: 10px; }
        .gps-tip .tip-lbl { color: var(--text2); }
        .gps-tip .tip-val { color: var(--cyan); font-weight: bold; }

        .map-controls { position: absolute; bottom: 10px; right: 10px; display: flex; gap: 6px; align-items: center; background: rgba(0,20,40,0.88); border: 1px solid var(--border2); border-radius: 5px; padding: 5px 10px; font-size: 11px; color: var(--text3); }
        .map-controls span { color: var(--text2); }
        .map-controls .zoom-num { color: var(--green); font-weight: bold; font-size: 13px; }
        .map-controls button { background: rgba(0,150,200,0.2); border: 1px solid var(--border2); color: var(--cyan); padding: 3px 8px; border-radius: 3px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .map-controls button:hover { background: rgba(0,150,200,0.4); }

        .row-2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; height: 280px; }

        /* 流速剖面 - 增大高度 */
        .profile-row { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .profile-cell { background: rgba(13,20,36,0.88); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; box-shadow: 0 2px 15px rgba(0,0,0,0.35); display: flex; flex-direction: column; height: 280px; }
        .profile-label { background: linear-gradient(90deg, rgba(0,100,160,0.4), rgba(0,50,100,0.25)); padding: 8px 14px; border-bottom: 1px solid var(--border2); display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text2); }
        .profile-label .title { color: var(--cyan); font-weight: bold; }
        .profile-label .title::before { content: "▷ "; color: var(--green); font-size: 11px; }
        .profile-label .range { color: var(--green); font-family: monospace; font-size: 12px; }
        .profile-content { flex: 1; position: relative; display: flex; padding: 6px 10px; }
        .profile-canvas-wrap { flex: 1; position: relative; min-width: 0; overflow: hidden; }
        .profile-canvas-wrap canvas { display: block; width: 100%; height: 100%; }
        .colorbar { width: 20px; margin: 6px 6px; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
        .colorbar-speed { background: linear-gradient(to bottom, #ff0000, #ff8800, #ffff00, #00ff00, #00ffff, #0066ff, #0000ff); }
        .cb-labels { width: 32px; display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; color: var(--text3); padding: 6px 3px; flex-shrink: 0; }

        .log-panel { background: rgba(13,20,36,0.9); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; height: 120px; display: flex; flex-direction: column; }
        .log-bar { padding: 7px 14px; background: linear-gradient(90deg, rgba(0,100,160,0.4), rgba(0,50,100,0.25)); border-bottom: 1px solid var(--border2); display: flex; align-items: center; gap: 14px; }
        .log-bar h3 { color: var(--cyan); font-size: 13px; }
        .log-stats { display: flex; gap: 10px; font-size: 11px; color: var(--text2); flex-wrap: wrap; }
        .log-stats b { color: var(--green); font-weight: bold; }
        .log-stats .err { color: var(--red); }
        .log-body { flex: 1; overflow-y: auto; background: rgba(0,0,0,0.45); padding: 5px 12px; font-family: "Consolas", monospace; font-size: 11px; line-height: 1.5; }
        .log-line { display: flex; gap: 7px; padding: 2px 0; }
        .log-t { color: #555; flex-shrink: 0; font-size: 10px; }
        .log-k { flex-shrink: 0; font-weight: bold; min-width: 42px; font-size: 10px; }
        .log-k.env { color: #00cc66; }
        .log-k.exo { color: #ffcc00; }
        .log-k.wxt { color: #ff88dd; }
        .log-k.gps { color: #66ccff; }
        .log-k.sol { color: #ff8866; }
        .log-k.pro { color: #aa88ff; }
        .log-k.inf { color: #88aacc; }
        .log-k.err { color: var(--red); }
        .log-k.ws { color: #ff88ff; }
        .log-m { color: #aabbcc; flex: 1; word-break: break-all; }
        .log-m.err { color: var(--red); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,50,80,0.15); }
        ::-webkit-scrollbar-thumb { background: rgba(0,150,200,0.35); border-radius: 3px; }
    </style>
</head>
<body>
<div class="bg-layer"></div>
<div class="container">
    <div class="title-bar">
        <h1>浮标数据监控系统</h1>
        <div class="title-right">
            <div class="conn-dot" id="connDot"></div>
            <span class="conn-text" id="connText">未连接</span>
            <span class="conn-type" id="connType">--</span>
            <span class="top-time" id="curTime"></span>
            <span class="version">V1.18</span>
        </div>
    </div>

    <div class="control-bar">
        <div class="conn-mode-group">
            <label>连接方式:</label>
            <button class="conn-mode-btn active" id="modeSerial" onclick="setConnMode('serial')">串口</button>
            <button class="conn-mode-btn" id="modeWS" onclick="setConnMode('ws')">WebSocket</button>
        </div>

        <div class="serial-group" id="serialPanel">
            <label>COM口</label>
            <select id="portSel"><option value="">-- 选择 --</option></select>
            <label>波特率</label>
            <select id="baudSel">
                <option value="9600">9600</option>
                <option value="19200">19200</option>
                <option value="38400">38400</option>
                <option value="115200" selected>115200</option>
            </select>
        </div>

        <div class="ws-group" id="wsPanel" style="display:none;">
            <label>服务器</label>
            <input type="text" id="serverAddr" placeholder="ws://IP:PORT" value="">
            <span class="ws-addr-display" id="wsAddrDisplay">ws://************</span>
            <span class="ws-status" id="wsStatus"></span>
        </div>

        <button class="btn btn-green" id="connBtn">连接</button>
        <button class="btn btn-red" id="discBtn" disabled>断开</button>
        <button class="btn btn-blue" id="refBtn">刷新</button>

        <div style="width:1px;background:var(--border2);height:24px"></div>
        <div class="ctrl-group"><label>地图</label>
            <select id="mapType">
                <option value="none">无背景</option>
                <option value="amap" selected>高德</option>
                <option value="tianditu">天地图</option>
                <option value="osm">OSM</option>
            </select>
        </div>
        <div class="ctrl-group"><label>Key</label>
            <input type="text" id="mapKey" placeholder="API Key" value="*************************">
        </div>
        <button class="btn btn-blue" id="loadMapBtn">应用</button>
    </div>

    <!-- 第一行：ENV | GPS MAP | EXO -->
    <div class="row-1">
        <div class="panel">
            <div class="panel-header"><h3>环境数据 ENV</h3><span class="panel-badge" id="cEnv">0</span></div>
            <div class="latest-values" id="lvEnv"></div>
            <div class="params-row" id="pEnv"></div>
            <div class="chart-wrap">
                <div class="chart-tools"><button onclick="resetChart('env')">重置</button></div>
                <canvas id="chEnv"></canvas>
                <div class="chart-hint">滚轮缩放 | 重置恢复</div>
            </div>
        </div>
        <div class="panel map-panel">
            <div class="panel-header"><h3>定位轨迹 GPS</h3><span class="panel-badge" id="cGps">0</span></div>
            <div class="gps-wrap">
                <div class="gps-bg"></div>
                <img class="gps-img" id="gpsImg" style="display:none;">
                <canvas id="gpsCv" class="gps-canvas"></canvas>
                <div class="gps-mini-info">
                    <div class="row"><span class="lbl">经度:</span><span class="val" id="infoLon">--</span></div>
                    <div class="row"><span class="lbl">纬度:</span><span class="val" id="infoLat">--</span></div>
                    <div class="row"><span class="lbl">距离:</span><span class="val" id="infoDst">--</span></div>
                    <div class="row"><span class="lbl">航向:</span><span class="val" id="infoCog">--</span></div>
                </div>
                <div class="gps-tip" id="gpsTip"></div>
                <div class="map-controls">
                    <span>缩放</span><span class="zoom-num" id="mapZoomVal">14</span>
                    <button id="zoomOutBtn">-</button>
                    <button id="zoomInBtn">+</button>
                    <button id="resetBtn">重置</button>
                </div>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header"><h3>水质数据 EXO</h3><span class="panel-badge" id="cExo">0</span></div>
            <div class="latest-values" id="lvExo"></div>
            <div class="params-row" id="pExo"></div>
            <div class="chart-wrap">
                <div class="chart-tools"><button onclick="resetChart('exo')">重置</button></div>
                <canvas id="chExo"></canvas>
                <div class="chart-hint">滚轮缩放 | 重置恢复</div>
            </div>
        </div>
    </div>

    <!-- 第二行：WXT | SOLAR | PRO_HDR -->
    <div class="row-2">
        <div class="panel">
            <div class="panel-header"><h3>气象数据 WXT</h3><span class="panel-badge" id="cWxt">0</span></div>
            <div class="latest-values" id="lvWxt"></div>
            <div class="params-row" id="pWxt"></div>
            <div class="chart-wrap">
                <div class="chart-tools"><button onclick="resetChart('wxt')">重置</button></div>
                <canvas id="chWxt"></canvas>
                <div class="chart-hint">滚轮缩放 | 重置恢复</div>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header"><h3>太阳能 SOLAR</h3><span class="panel-badge" id="cSol">0</span></div>
            <div class="latest-values" id="lvSol"></div>
            <div class="params-row" id="pSol"></div>
            <div class="chart-wrap">
                <div class="chart-tools"><button onclick="resetChart('sol')">重置</button></div>
                <canvas id="chSol"></canvas>
                <div class="chart-hint">滚轮缩放 | 重置恢复</div>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header"><h3>流速仪 PRO_HDR</h3><span class="panel-badge" id="cProHdr">0</span></div>
            <div class="latest-values" id="lvProHdr"></div>
            <div class="params-row" id="pProHdr"></div>
            <div class="chart-wrap">
                <div class="chart-tools"><button onclick="resetChart('proHdr')">重置</button></div>
                <canvas id="chProHdr"></canvas>
                <div class="chart-hint">滚轮缩放 | 重置恢复</div>
            </div>
        </div>
    </div>

    <!-- 第三行：流速大小剖面 -->
    <div class="profile-row">
        <div class="profile-cell">
            <div class="profile-label">
                <span class="title">流速大小剖面</span>
                <span class="range" id="proSpdRange">-- cm/s</span>
            </div>
            <div class="profile-content">
                <div class="profile-canvas-wrap"><canvas id="proSpdCv"></canvas></div>
                <div class="colorbar colorbar-speed"></div>
                <div class="cb-labels">
                    <div>表层</div>
                    <div>中层</div>
                    <div>底层</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 第四行：流向角度剖面 -->
    <div class="profile-row">
        <div class="profile-cell">
            <div class="profile-label">
                <span class="title">流向角度剖面</span>
                <span class="range" id="proDirRange">0 ~ 360°</span>
            </div>
            <div class="profile-content">
                <div class="profile-canvas-wrap"><canvas id="proDirCv"></canvas></div>
                <div class="colorbar colorbar-speed"></div>
                <div class="cb-labels">
                    <div>0°</div>
                    <div>180°</div>
                    <div>360°</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 日志面板 -->
    <div class="log-panel">
        <div class="log-bar">
            <h3>系统日志</h3>
            <div class="log-stats" id="logStats"></div>
        </div>
        <div class="log-body" id="logBody"></div>
    </div>
</div>

<script>
// ==================== 全局状态 ====================
const MAX = 100;

// ============ GPS 地图交互 ============
function initGPSCanvas() {
    const cv = document.getElementById('gpsCv');
    const wrap = cv.parentElement;

    function resize() {
        const rect = wrap.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
            cv.width = rect.width;
            cv.height = rect.height;
            drawGPS();
        }
    }
    window.addEventListener('resize', resize);
    setTimeout(resize, 150);

    cv.addEventListener('mousedown', (e) => {
        isDragging = true;
        dragStartX = e.clientX - panOffsetX;
        dragStartY = e.clientY - panOffsetY;
        cv.classList.add('dragging');
    });
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panOffsetX = e.clientX - dragStartX;
        panOffsetY = e.clientY - dragStartY;
        drawGPS();
    });
    window.addEventListener('mouseup', () => {
        if (isDragging) {
            const pplLon = getPixelsPerDegLon();
            const pplLat = getPixelsPerDegLat();
            mapCenterLon -= panOffsetX / pplLon;
            mapCenterLat += panOffsetY / pplLat;
            panOffsetX = 0;
            panOffsetY = 0;
            drawGPS();
        }
        isDragging = false;
        cv.classList.remove('dragging');
    });

    cv.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = cv.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const geo = canvasToGeo(mx, my);
        if (geo.lat === null || !isFinite(geo.lat)) return;

        const newZoom = Math.max(3, Math.min(18, mapZoom + (e.deltaY < 0 ? 1 : -1)));
        if (newZoom === mapZoom) return;

        const oldZoom = mapZoom;
        mapZoom = newZoom;

        const oldPplLon = 800 * Math.pow(2, oldZoom - 14);
        const oldPplLat = 800 * Math.pow(2, oldZoom - 14) * Math.cos(geo.lat * Math.PI / 180);
        const newPplLon = getPixelsPerDegLon();
        const newPplLat = getPixelsPerDegLat();

        const cx = cv.width / 2, cy = cv.height / 2;
        const mouseToCenterX_deg = (mx - cx) * oldPplLon;
        const mouseToCenterY_deg = (my - cy) * oldPplLat;

        mapCenterLon = geo.lon + mouseToCenterX_deg / newPplLon;
        mapCenterLat = geo.lat - mouseToCenterY_deg / newPplLat;

        document.getElementById('mapZoomVal').textContent = mapZoom;
        loadMap();
    }, { passive: false });

    cv.addEventListener('mousemove', (e) => {
        const rect = cv.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        let closest = null, minD = 30;
        for (const p of gpsPts) {
            const d = Math.hypot((p.px||0) - mx, (p.py||0) - my);
            if (d < minD) { minD = d; closest = p; }
        }
        const tip = document.getElementById('gpsTip');
        if (closest) {
            tip.innerHTML = `<div class="tip-row"><span class="tip-lbl">经度:</span><span class="tip-val">${closest.lon.toFixed(5)}°</span></div>
                             <div class="tip-row"><span class="tip-lbl">纬度:</span><span class="tip-val">${closest.lat.toFixed(5)}°</span></div>
                             <div class="tip-row"><span class="tip-lbl">距离:</span><span class="tip-val">${(closest.dst||0).toFixed(3)} km</span></div>
                             <div class="tip-row"><span class="tip-lbl">航向:</span><span class="tip-val">${(closest.cog||0).toFixed(1)}°</span></div>`;
            tip.style.display = 'block';
            tip.style.left = Math.min(mx + 14, cv.width - 160) + 'px';
            tip.style.top = Math.max(my - 80, 5) + 'px';
        } else {
            tip.style.display = 'none';
        }
    });
    cv.addEventListener('mouseleave', () => { document.getElementById('gpsTip').style.display = 'none'; });
}

function canvasToGeo(px, py) {
    const cv = document.getElementById('gpsCv');
    if (!cv || !cv.width) return { lat: null, lon: null };
    const cx = cv.width / 2, cy = cv.height / 2;
    const pplLat = getPixelsPerDegLat();
    const pplLon = getPixelsPerDegLon();
    const lon = mapCenterLon + (px - cx) / pplLon;
    const lat = mapCenterLat - (py - cy) / pplLat;
    return { lat: isFinite(lat) ? lat : null, lon: isFinite(lon) ? lon : null };
}

function getPixelsPerDegLat() {
    return 800 * Math.pow(2, mapZoom - 14) * Math.cos(mapCenterLat * Math.PI / 180);
}
function getPixelsPerDegLon() {
    return 800 * Math.pow(2, mapZoom - 14);
}

function loadMap() {
    const type = document.getElementById('mapType').value;
    const key = document.getElementById('mapKey').value.trim();
    const img = document.getElementById('gpsImg');
    document.getElementById('mapZoomVal').textContent = mapZoom;
    if (type === 'none') { img.style.display = 'none'; drawGPS(); return; }

    let url = '';
    if (type === 'amap') {
        if (!key) { ilog('err', '高德地图需要 API Key'); return; }
        url = `https://restapi.amap.com/v3/staticmap?location=${mapCenterLon},${mapCenterLat}&zoom=${mapZoom}&size=1000*700&key=${key}`;
    } else if (type === 'tianditu') {
        if (!key) { ilog('err', '天地图需要 Token'); return; }
        url = `https://api.tianditu.gov.cn/staticmap?center=${mapCenterLon},${mapCenterLat}&zoom=${mapZoom}&size=1000*700&tk=${key}`;
    } else if (type === 'osm') {
        url = `https://staticmap.openstreetmap.de/staticmap.php?center=${mapCenterLat},${mapCenterLon}&zoom=${mapZoom}&size=1000x700`;
    }
    if (!url) return;
    img.onload = () => {
        img.style.display = 'block';
        img.style.width = '100%'; img.style.height = '100%';
        img.style.objectFit = 'cover';
        setTimeout(drawGPS, 50);
    };
    img.onerror = () => { ilog('err', '地图加载失败'); };
    img.src = url;
}

// ============ 绘制 GPS 轨迹 ============
// 去掉中心红点，历史轨迹点加粗加大
function drawGPS() {
    const cv = document.getElementById('gpsCv');
    if (!cv || !cv.width) return;
    const ctx = cv.getContext('2d');
    const w = cv.width, h = cv.height;
    ctx.clearRect(0, 0, w, h);

    document.getElementById('infoLon').textContent = '--';
    document.getElementById('infoLat').textContent = '--';
    document.getElementById('infoDst').textContent = '--';
    document.getElementById('infoCog').textContent = '--';

    if (!gpsPts.length) {
        ctx.fillStyle = '#556'; ctx.font = '16px Microsoft YaHei';
        ctx.fillText('等待 GPS 数据...', w/2 - 70, h/2);
        return;
    }

    const last = gpsPts[gpsPts.length - 1];
    document.getElementById('infoLon').textContent = last.lon.toFixed(5) + '°';
    document.getElementById('infoLat').textContent = last.lat.toFixed(5) + '°';
    document.getElementById('infoDst').textContent = (last.dst || 0).toFixed(3) + ' km';
    document.getElementById('infoCog').textContent = (last.cog || 0).toFixed(1) + '°';

    const cx = w / 2, cy = h / 2;
    const pplLat = getPixelsPerDegLat();
    const pplLon = getPixelsPerDegLon();

    // 计算所有点的像素坐标
    gpsPts.forEach((p) => {
        p.px = cx + (p.lon - mapCenterLon) * pplLon;
        p.py = cy - (p.lat - mapCenterLat) * pplLat;
    });

    // 轨迹线
    if (gpsPts.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = '#00d4ff';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#00d4ff';
        ctx.shadowBlur = 8;
        gpsPts.forEach((p, i) => i ? ctx.lineTo(p.px, p.py) : ctx.moveTo(p.px, p.py));
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    // 历史轨迹点 - 加大加粗
    gpsPts.forEach((p, i) => {
        const isFirst = (i === 0);
        const isLast = (i === gpsPts.length - 1);

        ctx.beginPath();
        if (isFirst) {
            // 起点：绿色大圆
            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 12;
            ctx.arc(p.px, p.py, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        } else if (isLast) {
            // 终点：亮蓝色大圆（代替红点）
            ctx.fillStyle = '#00d4ff';
            ctx.shadowColor = '#00d4ff';
            ctx.shadowBlur = 14;
            ctx.arc(p.px, p.py, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        } else {
            // 中间历史点：中等大小白点
            ctx.fillStyle = 'rgba(200,220,255,0.9)';
            ctx.arc(p.px, p.py, 3.5, 0, Math.PI * 2);
            ctx.fill();
        }
    });
}

async function refreshPorts() {
    try {
        const ports = await navigator.serial.getPorts();
        const sel = document.getElementById('portSel');
        sel.innerHTML = '<option value="">-- 选择 --</option>';
        if (!ports.length) sel.innerHTML += '<option value="new">+ 授权新设备</option>';
        else { ports.forEach((_, i) => { sel.innerHTML += `<option value="${i}">COM${i+1}</option>`; }); sel.innerHTML += '<option value="new">+ 授权新设备</option>'; }
    } catch (e) { ilog('err', '刷新串口失败: ' + e.message); }
}

async function connect() {
    if (connMode === 'serial') await connectSerial();
    else await connectWS();
}

async function disconnect() {
    if (connMode === 'serial') await disconnectSerial();
    else disconnectWS();
}

// ============ 串口连接 ============
async function connectSerial() {
    const br = parseInt(document.getElementById('baudSel').value);
    try {
        let ports = await navigator.serial.getPorts();
        const sel = document.getElementById('portSel').value;
        if (!sel || sel === 'new') {
            try { ports = [await navigator.serial.requestPort()]; await refreshPorts(); }
            catch (e) { ilog('err', '串口授权失败'); return; }
        }
        port = ports[parseInt(sel) || 0];
        await port.open({ baudRate: br });
        updateConnUI(true, '串口', `串口 @ ${br}`);
        ilog('inf', `串口连接成功 ${br}bps`);
        let buf = '';
        flushT = setInterval(() => {
            if (buf.length > 3) { const line = buf.trim(); if (line && line.indexOf('\n') === -1) parseLine(line); buf = ''; }
        }, 300);
        const dec = new TextDecoder();
        while (port?.readable) {
            try {
                reader = port.readable.getReader();
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        buf += dec.decode(value, { stream: true });
                        let idx;
                        while ((idx = buf.indexOf('\n')) !== -1) {
                            let line = buf.substring(0, idx).trim();
                            buf = buf.substring(idx + 1);
                            if (line) parseLine(line);
                        }
                    }
                }
            } catch (e) { ilog('err', '串口读取错误'); break; }
            finally { if (reader) { try { reader.releaseLock(); } catch(e) {} reader = null; } }
        }
        if (flushT) { clearInterval(flushT); flushT = null; }
    } catch (e) { ilog('err', '串口连接失败: ' + e.message); }
}

async function disconnectSerial() {
    if (flushT) { clearInterval(flushT); flushT = null; }
    if (reader) { try { await reader.cancel(); } catch(e) {} reader = null; }
    if (port) { try { await port.close(); } catch(e) {} port = null; }
    updateConnUI(false, '串口');
    ilog('inf', '串口已断开');
}

function getWSCloseReason(code) {
    const reasons = { 1000:'正常关闭', 1001:'服务器即将关闭', 1002:'协议错误', 1003:'不支持类型', 1005:'无状态码', 1006:'网络/服务器问题', 1007:'数据格式错误', 1008:'策略违反', 1009:'消息过大', 1010:'需要扩展', 1011:'服务器错误', 1015:'TLS错误' };
    return reasons[code] || '未知(code=' + code + ')';
}

function updateWSStatus(msg, color) {
    const el = document.getElementById('wsStatus');
    if (el) { el.textContent = msg; el.style.color = color || '#ffbb44'; }
}

async function connectWS() {
    if (ws && ws.readyState === WebSocket.OPEN) { ilog('inf', '已经连接'); return; }

    let addr = document.getElementById('serverAddr').value.trim();
    if (!addr) addr = 'ws://' + SERVER_IP + ':' + WEBSOCKET_PORT;
    if (!addr.startsWith('ws://') && !addr.startsWith('wss://')) addr = 'ws://' + addr;

    ilog('ws', '连接: ' + addr);
    updateWSStatus('连接中...', '#ffbb44');

    try {
        ws = new WebSocket(addr);
        const connectTimeout = setTimeout(() => {
            if (ws && ws.readyState === WebSocket.CONNECTING) { ws.close(); ilog('err', '连接超时(10秒)'); updateWSStatus('超时', '#ff6666'); }
        }, 10000);

        ws.onopen = function() {
            clearTimeout(connectTimeout);
            updateConnUI(true, 'WebSocket', '已连接');
            document.getElementById('wsAddrDisplay').textContent = addr;
            ilog('ws', '✅ 服务器连接成功');
            updateWSStatus('已连接', '#00ff88');
            wsLastMsgTime = Date.now(); wsReconnectCount = 0;
            startHeartbeat();
        };

        ws.onmessage = function(event) {
            wsLastMsgTime = Date.now();
            updateWSStatus('接收中', '#00ff88');
            const line = event.data.trim();
            if (line) parseLine(line);
        };

        ws.onclose = function(event) {
            clearTimeout(connectTimeout);
            stopHeartbeat();
            updateConnUI(false, 'WebSocket');
            st.wsClose++;
            const reason = getWSCloseReason(event.code);
            ilog('ws', '❌ 断开: ' + reason);
            updateWSStatus('断开', '#ff6666');
            if (event.code === 1006 && wsReconnectCount < MAX_RECONNECT) {
                wsReconnectCount++;
                ilog('ws', '第' + wsReconnectCount + '次重连...');
                updateWSStatus('重连(' + wsReconnectCount + '/' + MAX_RECONNECT + ')', '#ffbb44');
                wsReconnectTimer = setTimeout(connectWS, RECONNECT_DELAY);
            } else if (event.code === 1006) {
                ilog('err', '重连失败，请检查服务器');
            }
        };

        ws.onerror = function() {
            clearTimeout(connectTimeout);
            ilog('err', 'WebSocket连接错误，请检查服务器是否运行');
            updateWSStatus('错误', '#ff6666');
        };
    } catch (e) { ilog('err', '创建连接失败: ' + e.message); }
}

function startHeartbeat() {
    stopHeartbeat();
    wsHeartbeatTimer = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN && (Date.now() - wsLastMsgTime) > HEARTBEAT_INTERVAL) {
            try { ws.send('ping'); } catch(e) {}
        }
    }, 5000);
}

function stopHeartbeat() { if (wsHeartbeatTimer) { clearInterval(wsHeartbeatTimer); wsHeartbeatTimer = null; } }

function disconnectWS() {
    stopHeartbeat();
    if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
    wsReconnectCount = 0;
    if (ws) { ws.close(1000, '用户断开'); ws = null; }
    updateConnUI(false, 'WebSocket'); updateWSStatus('已断开', '#ff6666');
    ilog('inf', 'WebSocket已断开');
}

// ============ 数据解析 ============
function updateLatestValues(cat) {
    const container = document.getElementById('lv' + cat.charAt(0).toUpperCase() + cat.slice(1));
    if (!container || !H[cat].length) return;
    const latest = H[cat][H[cat].length - 1];
    container.innerHTML = '';
    for (const [k, v] of Object.entries(CFG[cat] || {})) {
        if (!v.show) continue;
        const val = latest[k];
        if (val == null || !isFinite(val)) continue;
        const item = document.createElement('div');
        item.className = 'latest-item';
        item.innerHTML = `<span class="name">${v.n}:</span><span class="value" style="color:${v.c}">${val.toFixed(2)}</span><span class="unit">${v.u}</span>`;
        container.appendChild(item);
    }
}

function parseLine(line) {
    if (!line || line.length < 4) return;
    const p = line.split(',');
    const t = p[0];
    const ts = new Date();

    if (t === 'EnvData') {
        if (p.length >= 8) {
            H.env.push({ ts, PTemp:+p[1], batt_volt:+p[2], Tem:+p[3], RH:+p[4], IMUx:+p[5], IMUy:+p[6], Open:+p[7] });
            if (H.env.length > MAX) H.env.shift();
            updChart('env'); updateLatestValues('env');
            document.getElementById('cEnv').textContent = H.env.length;
        }
        return;
    }

    if (t === 'ExoData') {
        if (p.length >= 15) {
            H.exo.push({ ts, Temp_C:+p[12], pH:+p[3], DO_mgl:+p[8], DO_percent:+p[7], Sal_PSU:+p[14], Depth_m: p.length>17?+p[17]:0, Cond_mscm:+p[13], Turbidity_NTU:+p[5], ORP_mV:+p[4], Chlorophyll:+p[9] });
            if (H.exo.length > MAX) H.exo.shift();
            updChart('exo'); updateLatestValues('exo');
            document.getElementById('cExo').textContent = H.exo.length;
        }
        return;
    }

    if (t === 'WXTData') {
        if (p.length >= 12) {
            H.wxt.push({ ts, Ta_C:+p[1], Pa_H:+p[3], Sm_M:+p[10], Dm_D:+p[7], Sn_M:+p[9], Sx_M:+p[11], Ua_P:+p[2], Rc_M: p.length>12?+p[12]:0 });
            if (H.wxt.length > MAX) H.wxt.shift();
            updChart('wxt'); updateLatestValues('wxt');
            document.getElementById('cWxt').textContent = H.wxt.length;
        }
        return;
    }

    if (t === 'GPSData') {
        const spd = parseFloat(p[7]) || 0;
        const cog = parseFloat(p[8]) || 0;
        const dst = parseFloat(p[12]) || 0;
        let lat = 0, lon = 0;
        if (p.length >= 15 && p[13] && p[14]) { lat = parseFloat(p[13]); lon = parseFloat(p[14]); }
        if (!lat || !lon || !isFinite(lat)) {
            if (p.length >= 7 && p[3] && p[5]) {
                const nmeaLat = parseFloat(p[3]); const nmeaLon = parseFloat(p[5]);
                lat = Math.floor(nmeaLat/100) + (nmeaLat%100)/60;
                lon = Math.floor(nmeaLon/100) + (nmeaLon%100)/60;
                if (p[4] === 'S') lat = -lat;
                if (p[6] === 'W') lon = -lon;
            }
        }
        if (!lat || !lon) return;

        currentLat = lat; currentLon = lon;
        if (!mapCenterLat || mapCenterLat === 37.92686) { mapCenterLat = lat; mapCenterLon = lon; }

        H.gps.push({ ts, RMC_Spd:spd, RMC_Cog:cog, Distance:dst, Lat_True:lat, Lon_True:lon });
        if (H.gps.length > MAX) H.gps.shift();

        gpsPts.push({ ts, t:ts.toLocaleTimeString('zh-CN'), lat, lon, spd, cog, dst });
        if (gpsPts.length > MAX) gpsPts.shift();

        updChart('gps');
        document.getElementById('cGps').textContent = H.gps.length;
        drawGPS();
        if (gpsPts.length === 1) setTimeout(loadMap, 200);
        return;
    }

    if (t === 'SolarData') {
        if (p.length >= 15) {
            H.sol.push({ ts, SOC:+p[2], BATTERY_V:+p[4], PV_CURRENT:p.length>16?+p[16]:0, LOAD_CURRENT:p.length>17?+p[17]:0, TEMPERATURE_INT:+p[13], TEMPERATURE_ENT:+p[14] });
            if (H.sol.length > MAX) H.sol.shift();
            updChart('sol'); updateLatestValues('sol');
            document.getElementById('cSol').textContent = H.sol.length;
        }
        return;
    }

    if (t === 'Pro_HDR') {
        if (p.length >= 15) {
            const nc = Math.max(1, Math.min(20, +p[1] || 20));
            H.proHdr.push({ ts, Temperature: p.length>15?+p[15]:0, Heading:+p[11], BatteryV:+p[9], SoundSpeed:+p[10], Pitch:+p[12], Roll:+p[13] });
            if (H.proHdr.length > MAX) H.proHdr.shift();
            curProf = { ts, nc, layers: [], n: 0 };
            updChart('proHdr'); updateLatestValues('proHdr');
            document.getElementById('cProHdr').textContent = H.proHdr.length;
        }
        return;
    }

    if (t === 'Pro_V') {
        if (p.length >= 4 && curProf) {
            const L = +p[1], Spd = +p[2], Dir = +p[3];
            curProf.layers.push({ L, Spd, Dir });
            curProf.n++;
            if (curProf.n >= curProf.nc) {
                profile.push(curProf);
                if (profile.length > 80) profile.shift();
                updProfile();
                curProf = null;
            }
        }
        return;
    }
}

function updChart(cat) {
    const ch = charts[cat];
    if (!ch) return;
    const ds = [];
    const isDual = dualAxisCats.includes(cat);
    for (const [k, v] of Object.entries(CFG[cat] || {})) {
        if (!v.show || !H[cat].length) continue;
        const d = H[cat].map(r => ({ x: r.ts, y: r[k] != null ? r[k] : null })).filter(r => r.y !== null && isFinite(r.y));
        if (!d.length) continue;
        const dsItem = { label: v.n, data: d, borderColor: v.c, backgroundColor: v.c + '20', borderWidth: 1.5, pointRadius: 0, tension: 0.15 };
        if (isDual) dsItem.yAxisID = v.axis === 'right' ? 'y2' : 'y';
        ds.push(dsItem);
    }
    ch.data.datasets = ds;
    ch.update('none');
}

// ============ 流速剖面（优化版：cell最小2px，完整展示） ============
function updProfile() {
    const spdCv = document.getElementById('proSpdCv');
    const dirCv = document.getElementById('proDirCv');
    if (!spdCv || !dirCv) return;

    function fixCanvas(cv) {
        const parent = cv.parentElement;
        if (!parent) return;
        const rect = parent.getBoundingClientRect();
        // 强制充满父容器
        cv.width = Math.floor(rect.width) || 400;
        cv.height = Math.floor(rect.height) || 220;
    }
    fixCanvas(spdCv); fixCanvas(dirCv);

    const sw = spdCv.width, sh = spdCv.height;
    const dw = dirCv.width, dh = dirCv.height;
    if (sw < 10 || sh < 10 || dw < 10 || dh < 10) return;

    const sCtx = spdCv.getContext('2d');
    sCtx.clearRect(0, 0, sw, sh);
    const dCtx = dirCv.getContext('2d');
    dCtx.clearRect(0, 0, dw, dh);

    if (!profile.length) {
        sCtx.fillStyle = '#556'; sCtx.font = '14px Microsoft YaHei';
        sCtx.fillText('等待流速剖面数据...', sw/2 - 80, sh/2);
        return;
    }

    const nP = profile.length;

    // 动态计算实际最大层数
    let maxLayerCount = 0;
    profile.forEach(pr => { if (pr.layers) maxLayerCount = Math.max(maxLayerCount, pr.layers.length); });
    maxLayerCount = Math.min(20, Math.max(maxLayerCount, 1));

    // 关键：cellH 最小2px，确保完整展示所有层
    const cellH = Math.max(2, Math.floor(sh / maxLayerCount));
    const dCellH = Math.max(2, Math.floor(dh / maxLayerCount));
    // 实际使用的高度
    const usedH = cellH * maxLayerCount;
    const dUsedH = dCellH * maxLayerCount;
    // 垂直偏移，使内容居中
    const yOffset = Math.floor((sh - usedH) / 2);
    const dYOffset = Math.floor((dh - dUsedH) / 2);

    // 流速范围
    let minSpd = Infinity, maxSpd = -Infinity;
    profile.forEach(pr => {
        if (!pr.layers) return;
        pr.layers.forEach(ly => {
            if (ly && isFinite(ly.Spd)) {
                const v = Math.abs(ly.Spd);
                minSpd = Math.min(minSpd, v);
                maxSpd = Math.max(maxSpd, v);
            }
        });
    });
    if (minSpd === Infinity) minSpd = 0;
    if (maxSpd === -Infinity || maxSpd - minSpd < 0.5) maxSpd = minSpd + 50;
    document.getElementById('proSpdRange').textContent = `${minSpd.toFixed(0)}~${maxSpd.toFixed(0)} cm/s | ${nP}帧×${maxLayerCount}层`;

    // 流速大小热力图
    profile.forEach((pr, ti) => {
        if (!pr.layers) return;
        pr.layers.forEach((ly, li) => {
            if (!ly || ly.L == null) return;
            const v = Math.abs(ly.Spd || 0);
            const norm = (v - minSpd) / (maxSpd - minSpd);
            // cellW: 平均分配，保证所有帧都能显示
            const cellW = Math.max(2, Math.floor(sw / nP) - 1);
            const x = Math.floor(ti * sw / nP);
            const y = yOffset + li * cellH;
            sCtx.fillStyle = spdColor(Math.max(0, Math.min(1, norm)));
            sCtx.fillRect(x, y, cellW, cellH);
        });
    });

    // 水平分隔线
    sCtx.strokeStyle = 'rgba(0,150,200,0.1)'; sCtx.lineWidth = 0.5;
    for (let i = 0; i <= maxLayerCount; i++) {
        const y = yOffset + i * cellH;
        sCtx.beginPath(); sCtx.moveTo(0, y); sCtx.lineTo(sw, y); sCtx.stroke();
    }
    // 垂直分隔线
    for (let i = 0; i <= nP; i++) {
        const x = Math.floor(i * sw / nP);
        sCtx.beginPath(); sCtx.moveTo(x, yOffset); sCtx.lineTo(x, yOffset + usedH); sCtx.stroke();
    }

    // 流向箭头
    const avgSpd = (minSpd + maxSpd) / 2;
    profile.forEach((pr, ti) => {
        if (!pr.layers) return;
        pr.layers.forEach((ly, li) => {
            if (!ly || ly.L == null) return;
            const cellW = Math.max(2, Math.floor(dw / nP) - 1);
            const cx = Math.floor(ti * dw / nP) + cellW / 2;
            const cy = dYOffset + li * dCellH + dCellH / 2;
            const dir = ((ly.Dir || 0) % 360 + 360) % 360;
            const angle = (dir - 90) * Math.PI / 180;
            const speed = Math.abs(ly.Spd || 0);
            const arrowLen = Math.min(cellW, dCellH) * 0.45 * Math.max(0.3, Math.min(1, speed / (avgSpd || 1)));
            if (arrowLen < 2) return;

            dCtx.save();
            dCtx.translate(cx, cy);
            dCtx.rotate(angle);
            dCtx.strokeStyle = `hsl(${dir}, 80%, 55%)`;
            dCtx.fillStyle = `hsl(${dir}, 80%, 55%)`;
            dCtx.lineWidth = 1.5;
            dCtx.beginPath(); dCtx.moveTo(-arrowLen * 0.4, 0); dCtx.lineTo(arrowLen * 0.6, 0); dCtx.stroke();
            dCtx.beginPath();
            dCtx.moveTo(arrowLen * 0.6, 0);
            dCtx.lineTo(arrowLen * 0.2, -arrowLen * 0.35);
            dCtx.lineTo(arrowLen * 0.2, arrowLen * 0.35);
            dCtx.closePath(); dCtx.fill();
            dCtx.restore();
        });
    });

    dCtx.strokeStyle = 'rgba(0,150,200,0.1)'; dCtx.lineWidth = 0.5;
    for (let i = 0; i <= maxLayerCount; i++) {
        const y = dYOffset + i * dCellH;
        dCtx.beginPath(); dCtx.moveTo(0, y); dCtx.lineTo(dw, y); dCtx.stroke();
    }
    for (let i = 0; i <= nP; i++) {
        const x = Math.floor(i * dw / nP);
        dCtx.beginPath(); dCtx.moveTo(x, dYOffset); dCtx.lineTo(x, dYOffset + dUsedH); dCtx.stroke();
    }
}

function spdColor(n) {
    if (n < 0.16) return '#0000ff';
    if (n < 0.33) return '#0066ff';
    if (n < 0.5) return '#00ffff';
    if (n < 0.66) return '#00ff00';
    if (n < 0.83) return '#ffff00';
    if (n < 0.95) return '#ff8800';
    return '#ff0000';
}

function ilog(k, m) {
    st.tot++;
    if (k === 'err') st.err++;
    if (['env','exo','wxt','gps','sol','pro'].includes(k)) st[k]++;
    const bd = document.getElementById('logBody');
    if (!bd) return;
    const t = new Date().toLocaleTimeString('zh-CN') + '.' + String(Date.now()%1000).padStart(3,'0');
    const row = document.createElement('div');
    row.className = 'log-line';
    const km = { env:'ENV', exo:'EXO', wxt:'WXT', gps:'GPS', sol:'SOL', pro:'PRO', inf:'INF', err:'ERR', ws:'WS ' };
    row.innerHTML = `<span class="log-t">[${t}]</span><span class="log-k ${k}">${km[k]||k}</span><span class="log-m${k==='err'?' err':''}">${m}</span>`;
    bd.appendChild(row);
    bd.scrollTop = bd.scrollHeight;
    while (bd.children.length > 200) bd.removeChild(bd.firstChild);
    updStats();
}
function updStats() {
    const el = document.getElementById('logStats');
    if (!el) return;
    el.innerHTML = `总<b>${st.tot}</b> ENV<b>${st.env}</b> EXO<b>${st.exo}</b> WXT<b>${st.wxt}</b> GPS<b>${st.gps}</b> SOL<b>${st.sol}</b> PRO<b>${st.proHdr}</b> WS断<span class="err"><b>${st.wsClose}</b></span> 错<span class="err"><b>${st.err}</b></span>`;
}
