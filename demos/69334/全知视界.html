<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全知视界 - 一句话，知全景</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-primary: #0A1628;
  --bg-secondary: #1A1F3A;
  --bg-tertiary: #1A237E;
  --accent-cyan: #00E5FF;
  --accent-gold: #FFD700;
  --text-primary: #ffffff;
  --text-secondary: #9CA3AF;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow-x: hidden;
  min-height: 100vh;
}
/* 粒子背景 */
#particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.particle {
  position: absolute; width: 3px; height: 3px;
  background: var(--accent-cyan); border-radius: 50%;
  opacity: 0.3; animation: float linear infinite;
}
@keyframes float {
  0% { transform: translateY(100vh); opacity: 0; }
  10% { opacity: 0.3; }
  90% { opacity: 0.3; }
  100% { transform: translateY(-10vh); opacity: 0; }
}
/* 页面容器 */
.page { display: none; position: relative; z-index: 1; min-height: 100vh; }
.page.active { display: block; }
/* 首页 */
.home-hero {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 2rem; text-align: center;
  background: radial-gradient(ellipse at center, rgba(0,229,255,0.08) 0%, transparent 70%);
}
.logo-badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 16px; border-radius: 999px;
  background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.3);
  font-size: 13px; color: var(--accent-cyan); margin-bottom: 24px;
}
.logo-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent-cyan); animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.home-title {
  font-size: 3.5rem; font-weight: 800; margin-bottom: 12px;
  background: linear-gradient(135deg, #fff 0%, var(--accent-cyan) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.home-subtitle {
  font-size: 1.8rem; font-weight: 600; margin-bottom: 16px;
  color: var(--accent-gold);
}
.home-desc {
  font-size: 1.1rem; color: var(--text-secondary);
  max-width: 600px; margin-bottom: 40px; line-height: 1.6;
}
.search-box {
  width: 100%; max-width: 640px; position: relative; margin-bottom: 32px;
}
.search-input {
  width: 100%; padding: 18px 60px 18px 24px;
  background: rgba(255,255,255,0.06); backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.15); border-radius: 16px;
  color: #fff; font-size: 1.05rem; outline: none;
  transition: all 0.3s;
}
.search-input::placeholder { color: rgba(255,255,255,0.4); }
.search-input:focus {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 4px rgba(0,229,255,0.15), 0 8px 32px rgba(0,229,255,0.2);
}
.search-btn {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border-radius: 12px; border: none;
  background: linear-gradient(135deg, var(--accent-cyan), #0099FF);
  color: #fff; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: all 0.3s;
}
.search-btn:hover { transform: translateY(-50%) scale(1.05); box-shadow: 0 4px 20px rgba(0,229,255,0.4); }
.hot-queries { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 640px; }
.hot-query {
  padding: 8px 16px; border-radius: 999px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-secondary); font-size: 14px; cursor: pointer;
  transition: all 0.3s;
}
.hot-query:hover {
  background: rgba(0,229,255,0.1); border-color: rgba(0,229,255,0.3);
  color: var(--accent-cyan); transform: translateY(-2px);
}
.hot-query .count { color: var(--accent-gold); font-size: 12px; margin-left: 4px; }
/* 搜索加载动画 */
.search-loading {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 2rem;
}
.loading-ring {
  width: 80px; height: 80px; border-radius: 50%;
  border: 3px solid rgba(0,229,255,0.2);
  border-top-color: var(--accent-cyan);
  animation: spin 1s linear infinite; margin-bottom: 32px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-phases { text-align: center; }
.loading-phase {
  padding: 10px 20px; margin: 6px 0; border-radius: 12px;
  font-size: 15px; color: var(--text-secondary);
  transition: all 0.4s; opacity: 0.4;
}
.loading-phase.active {
  color: var(--accent-cyan); opacity: 1;
  background: rgba(0,229,255,0.08);
  transform: scale(1.02);
}
.loading-phase.done { color: #4ADE80; opacity: 0.7; }
.loading-phase.done::before { content: '✓ '; }
/* 搜索结果页 */
.result-header {
  position: sticky; top: 0; z-index: 20;
  background: rgba(10,22,40,0.85); backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.08); padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.back-btn {
  width: 36px; height: 36px; border-radius: 10px; border: none;
  background: rgba(255,255,255,0.06); color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.back-btn:hover { background: rgba(0,229,255,0.15); }
.header-title { font-size: 16px; font-weight: 600; }
.header-actions { display: flex; gap: 8px; }
.header-btn {
  padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05); color: var(--text-secondary);
  font-size: 13px; cursor: pointer; transition: all 0.2s;
}
.header-btn:hover { background: rgba(0,229,255,0.1); color: var(--accent-cyan); }
.result-container { max-width: 1200px; margin: 0 auto; padding: 24px; }
.result-title-section {
  display: flex; align-items: center; gap: 16px; margin-bottom: 28px;
  padding: 24px; background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
}
.result-avatar {
  width: 64px; height: 64px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; flex-shrink: 0;
}
.result-avatar.person { background: linear-gradient(135deg, #00E5FF, #0099FF); }
.result-avatar.event { background: linear-gradient(135deg, #FFD700, #FFA500); }
.result-avatar.object { background: linear-gradient(135deg, #00E5FF, #0099FF); }
.result-info h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
.result-meta { display: flex; align-items: center; gap: 12px; }
.type-badge {
  padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
}
.type-badge.person { background: rgba(0,229,255,0.15); color: var(--accent-cyan); }
.type-badge.event { background: rgba(255,215,0,0.15); color: var(--accent-gold); }
.type-badge.object { background: rgba(0,229,255,0.15); color: var(--accent-cyan); }
.confidence { font-size: 13px; color: var(--text-secondary); }
.confidence strong { color: #4ADE80; }
/* 布局 */
.result-layout { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
@media (max-width: 900px) { .result-layout { grid-template-columns: 1fr; } }
/* 信息卡片 */
.info-card {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px; margin-bottom: 16px; overflow: hidden;
  transition: all 0.3s;
}
.info-card:hover { border-color: rgba(0,229,255,0.2); }
.info-card-header {
  padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; user-select: none;
}
.info-card-title { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; }
.info-card-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: rgba(0,229,255,0.1); display: flex;
  align-items: center; justify-content: center; font-size: 16px;
}
.info-card-toggle { color: var(--text-secondary); transition: transform 0.3s; }
.info-card.collapsed .info-card-toggle { transform: rotate(-90deg); }
.info-card-body {
  padding: 0 20px 20px;
  max-height: 1000px; overflow: hidden;
  transition: max-height 0.4s ease, padding 0.4s ease;
}
.info-card.collapsed .info-card-body { max-height: 0; padding-top: 0; padding-bottom: 0; }
.data-row { display: flex; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.data-row:last-child { border-bottom: none; }
.data-label { width: 100px; flex-shrink: 0; color: var(--text-secondary); font-size: 14px; }
.data-value { flex: 1; font-size: 14px; line-height: 1.6; }
.data-value .list-item {
  display: inline-block; padding: 2px 10px; margin: 2px 4px 2px 0;
  background: rgba(0,229,255,0.08); border-radius: 6px; font-size: 13px;
}
.data-text { line-height: 1.7; color: rgba(255,255,255,0.9); }
/* 关联图谱 */
.graph-card {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px; padding: 20px; position: sticky; top: 80px;
}
.graph-title {
  font-size: 15px; font-weight: 600; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.graph-canvas-wrapper {
  position: relative; width: 100%; height: 340px;
  background: rgba(0,0,0,0.2); border-radius: 12px; overflow: hidden;
}
#relationCanvas { width: 100%; height: 100%; cursor: pointer; }
.graph-detail {
  margin-top: 16px; padding: 12px 16px;
  background: rgba(0,229,255,0.06); border-radius: 12px;
  border: 1px solid rgba(0,229,255,0.15);
  display: none;
}
.graph-detail.show { display: block; }
.graph-detail-name { font-weight: 600; color: var(--accent-cyan); margin-bottom: 4px; }
.graph-detail-relation { font-size: 13px; color: var(--text-secondary); }
/* 来源信息 */
.sources-section { margin-top: 24px; }
.sources-title {
  font-size: 15px; font-weight: 600; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.source-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; margin-bottom: 8px;
  background: rgba(255,255,255,0.04); border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.06);
}
.source-info { display: flex; align-items: center; gap: 10px; }
.source-type {
  padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;
}
.source-type.official { background: rgba(74,222,128,0.15); color: #4ADE80; }
.source-type.wiki { background: rgba(0,229,255,0.15); color: var(--accent-cyan); }
.source-type.news { background: rgba(255,215,0,0.15); color: var(--accent-gold); }
.source-name { font-size: 14px; }
.source-credibility { font-size: 12px; color: #4ADE80; }
/* 操作栏 */
.action-bar {
  display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
}
.action-btn {
  padding: 8px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05); color: var(--text-secondary);
  font-size: 13px; cursor: pointer; transition: all 0.2s;
}
.action-btn:hover { background: rgba(0,229,255,0.1); color: var(--accent-cyan); }
/* 底部 */
.footer {
  text-align: center; padding: 32px 24px;
  border-top: 1px solid rgba(255,255,255,0.06); margin-top: 40px;
}
.footer-text {
  display: inline-flex; align-items: center; gap: 16px;
  color: var(--text-secondary); font-size: 13px;
}
.footer-divider { color: var(--accent-cyan); }
/* 功能特性 */
.features-section {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
  max-width: 900px; margin: 60px auto 0;
}
@media (max-width: 700px) { .features-section { grid-template-columns: 1fr; } }
.feature-card {
  padding: 24px; border-radius: 16px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  text-align: center; transition: all 0.3s;
}
.feature-card:hover {
  transform: translateY(-4px); border-color: rgba(0,229,255,0.2);
  background: rgba(0,229,255,0.05);
}
.feature-icon { font-size: 32px; margin-bottom: 12px; }
.feature-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.feature-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
</style>
</head>
<body>

<div id="particles"></div>

<!-- 首页 -->
<div class="page active" id="page-home">
  <div class="home-hero">
    <div class="logo-badge">学习工作赛道 · AI驱动的多维信息聚合平台</div>
    <h1 class="home-title">全知视界</h1>
    <div class="home-subtitle">一句话，知全景</div>

    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="输入你感兴趣的人、事、物，例如：埃隆·马斯克" />
      <button class="search-btn" onclick="handleSearch()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    <div class="hot-queries" id="hotQueries"></div>
    
    <div class="features-section">

      </div>
      <div class="feature-card">
        <div class="feature-icon">🕸️</div>
        <div class="feature-title">关联图谱</div>
        <div class="feature-desc">可视化展示对象关联关系，一眼看全景</div>
      </div>
      <div class="feature-card">

      </div>

</div>

<!-- 搜索加载页 -->
<div class="page" id="page-loading">
  <div class="search-loading">
    <div class="loading-ring"></div>

  </div>
</div>

<!-- 搜索结果页 -->
<div class="page" id="page-result">
  <div class="result-header">
    <div class="header-left">

      <div class="result-info">
        <h1 id="resultName"></h1>
        <div class="result-meta">
          <span class="type-badge" id="resultType"></span>
          <span class="confidence">信息可信度：<strong id="resultConfidence"></strong></span>
        </div>
      </div>
    </div>
    
    <div class="action-bar">
      <button class="action-btn" onclick="toggleAll(true)">展开全部</button>
      <button class="action-btn" onclick="toggleAll(false)">收起全部</button>

    <div class="result-layout">
      <div id="infoCards"></div>
      
      <div>
        <div class="graph-card">
          <div class="graph-title">

              <circle cx="12" cy="12" r="3"/>

        <div class="sources-section">

            </svg>
            信息来源

      </div>
    </div>
  </div>
  
  <div class="footer">

      <span>TRAE Work生成</span>
      <span class="footer-divider">|</span>

    </div>
  </div>
</div>

// ============ 粒子背景 ============
function initParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 5 + 's';
    p.style.animationDuration = (4 + Math.random() * 6) + 's';
    container.appendChild(p);
  }
}

// ============ 热门查询 ============
function renderHotQueries() {
  const container = document.getElementById('hotQueries');
  container.innerHTML = hotQueries.map(q =>
    `<div class="hot-query" onclick="quickSearch('${q.key}')">${q.text}<span class="count">${q.count}</span></div>`
  ).join('');
}

function quickSearch(key) {
  document.getElementById('searchInput').value = hotQueries.find(q => q.key === key).text;
  handleSearch(key);
}

// ============ 搜索逻辑 ============
function searchMock(query, key) {
  if (key) return mockData[key];
  const q = query.toLowerCase();
  if (q.includes('马斯克') || q.includes('musk') || q.includes('elon')) return mockData['elon-musk'];
  if (q.includes('chatgpt') || q.includes('gpt') || q.includes('大模型')) return mockData['chatgpt-event'];
  if (q.includes('iphone') || q.includes('苹果手机')) return mockData['iphone'];
  return mockData['elon-musk'];
}

async function handleSearch(key) {
  const input = document.getElementById('searchInput');
  const query = input.value.trim();
  if (!query) return;
  
  showPage('page-loading');
  const phasesContainer = document.getElementById('loadingPhases');
  phasesContainer.innerHTML = loadingPhases.map((p, i) =>
    `<div class="loading-phase" id="phase-${i}">${p}</div>`
  ).join('');
  
  for (let i = 0; i < loadingPhases.length; i++) {
    const prev = document.getElementById(`phase-${i - 1}`);
    if (prev) { prev.classList.remove('active'); prev.classList.add('done'); }
    document.getElementById(`phase-${i}`).classList.add('active');
    await sleep(700);
  }
  const last = document.getElementById(`phase-${loadingPhases.length - 1}`);
  if (last) { last.classList.remove('active'); last.classList.add('done'); }
  await sleep(400);
  
  currentData = searchMock(query, key);
  renderResult();
  showPage('page-result');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ============ 渲染搜索结果 ============
function renderResult() {
  if (!currentData) return;
  const typeLabels = { person: '人物', event: '事件', object: '物件' };
  const avatarIcons = { person: '👤', event: '⚡', object: '📱' };
  
  document.getElementById('resultAvatar').className = 'result-avatar ' + currentData.objectType;
  document.getElementById('resultAvatar').textContent = avatarIcons[currentData.objectType];
  document.getElementById('resultName').textContent = currentData.objectName;
  
  const typeBadge = document.getElementById('resultType');
  typeBadge.className = 'type-badge ' + currentData.objectType;
  typeBadge.textContent = typeLabels[currentData.objectType];
  
  document.getElementById('resultConfidence').textContent = (currentData.confidence * 100) + '%';
  
  // 信息卡片
  const cardsContainer = document.getElementById('infoCards');
  cardsContainer.innerHTML = '';
  Object.values(currentData.dimensions).forEach((dim) => {
    const card = document.createElement('div');
    card.className = 'info-card' + (dim.collapsible ? ' collapsible' : '');
    
    let bodyHtml = '';
    if (typeof dim.content === 'string') {
      bodyHtml = `<div class="data-text">${dim.content}</div>`;
    } else {
      bodyHtml = dim.content.map(item => {
        let valueHtml = '';
        if (item.type === 'list') {
          valueHtml = Array.isArray(item.value)
            ? item.value.map(v => `<span class="list-item">${v}</span>`).join('')
            : `<span class="list-item">${item.value}</span>`;
        } else {
          valueHtml = item.value;
        }
        return `<div class="data-row"><div class="data-label">${item.label}</div><div class="data-value">${valueHtml}</div></div>`;
      }).join('');
    }
    
    card.innerHTML = `
      <div class="info-card-header" onclick="toggleCard(this)">
        <div class="info-card-title">
          <div class="info-card-icon">${dim.icon}</div>
          <span>${dim.title}</span>
        </div>
        ${dim.collapsible ? '<div class="info-card-toggle">▼</div>' : ''}
      </div>
      <div class="info-card-body">${bodyHtml}</div>
    `;
    
    // 默认折叠可折叠的卡片
    if (dim.collapsible) card.classList.add('collapsed');
    cardsContainer.appendChild(card);
  });
  
  // 来源
  const sourcesContainer = document.getElementById('sourcesList');
  const typeColors = { official: 'official', wiki: 'wiki', news: 'news' };
  const typeNames = { official: '官方', wiki: '百科', news: '新闻' };
  sourcesContainer.innerHTML = currentData.sources.map(s =>
    `<div class="source-item">
      <div class="source-info">
        <span class="source-type ${typeColors[s.type] || 'news'}">${typeNames[s.type] || s.type}</span>
        <span class="source-name">${s.title}</span>
      </div>
      <span class="source-credibility">${(s.credibility * 100).toFixed(0)}% 可信</span>
    </div>`
  ).join('');
  
  // 绘制关联图谱
  setTimeout(drawRelationGraph, 100);
}

function toggleCard(header) {
  const card = header.parentElement;
  card.classList.toggle('collapsed');
}

function toggleAll(expand) {
  document.querySelectorAll('.info-card.collapsible').forEach(card => {
    if (expand) card.classList.remove('collapsed');
    else card.classList.add('collapsed');
  });
}

// ============ 关联图谱 ============
function drawRelationGraph() {
  if (animationId) cancelAnimationFrame(animationId);
  
  const canvas = document.getElementById('relationCanvas');
  if (!canvas || !currentData) return;
  
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  ctx.scale(2, 2);
  
  const width = rect.width;
  const height = rect.height;
  const centerX = width / 2;
  const centerY = height / 2;
  const radius = Math.min(width, height) * 0.32;
  
  const relations = currentData.relations;
  const nodePositions = relations.map((rel, i) => {
    const angle = (i / relations.length) * Math.PI * 2 - Math.PI / 2;
    return {
      ...rel,
      x: centerX + radius * Math.cos(angle),
      y: centerY + radius * Math.sin(angle),
    };
  });
  
  function animate() {
    ctx.clearRect(0, 0, width, height);
    
    // 背景网格
    ctx.strokeStyle = 'rgba(0, 229, 255, 0.05)';
    ctx.lineWidth = 1;
    for (let x = 0; x < width; x += 30) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
    }
    for (let y = 0; y < height; y += 30) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
    }
    
    const time = Date.now() / 1000;
    
    // 连线 + 流动光点
    nodePositions.forEach((node, index) => {
      const isActive = activeRelation === node.id;
      const gradient = ctx.createLinearGradient(centerX, centerY, node.x, node.y);
      gradient.addColorStop(0, `rgba(0, 229, 255, ${isActive ? 0.8 : node.strength * 0.4})`);
      gradient.addColorStop(1, `rgba(255, 215, 0, ${isActive ? 0.6 : node.strength * 0.3})`);
      
      ctx.beginPath();
      ctx.strokeStyle = gradient;
      ctx.lineWidth = isActive ? 3 : node.strength * 2;
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(node.x, node.y);
      ctx.stroke();
      
      // 流动光点
      const progress = (time * 0.3 + index * 0.2) % 1;
      const dotX = centerX + (node.x - centerX) * progress;
      const dotY = centerY + (node.y - centerY) * progress;
      ctx.beginPath();
      ctx.arc(dotX, dotY, 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 229, 255, ${0.6 + Math.sin(time * 3) * 0.2})`;
      ctx.fill();
    });
    
    // 中心节点光晕
    const centerGlow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 50);
    centerGlow.addColorStop(0, 'rgba(255, 215, 0, 0.4)');
    centerGlow.addColorStop(1, 'rgba(255, 215, 0, 0)');
    ctx.fillStyle = centerGlow;
    ctx.fillRect(centerX - 50, centerY - 50, 100, 100);
    
    // 中心节点
    ctx.beginPath();
    ctx.arc(centerX, centerY, 22, 0, Math.PI * 2);
    const cgrad = ctx.createRadialGradient(centerX - 5, centerY - 5, 0, centerX, centerY, 22);
    cgrad.addColorStop(0, '#FFD700');
    cgrad.addColorStop(1, '#FFA500');
    ctx.fillStyle = cgrad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // 中心节点文字
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const centerName = currentData.objectName.length > 6 ? currentData.objectName.slice(0, 5) + '…' : currentData.objectName;
    ctx.fillText(centerName, centerX, centerY);
    
    // 关联节点
    nodePositions.forEach((node) => {
      const isActive = activeRelation === node.id;
      const nodeRadius = isActive ? 20 : 16;
      
      // 节点光晕
      if (isActive) {
        const glow = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, 35);
        glow.addColorStop(0, 'rgba(0, 229, 255, 0.4)');
        glow.addColorStop(1, 'rgba(0, 229, 255, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(node.x - 35, node.y - 35, 70, 70);
      }
      
      // 节点圆
      ctx.beginPath();
      ctx.arc(node.x, node.y, nodeRadius, 0, Math.PI * 2);
      const ngrad = ctx.createRadialGradient(node.x - 3, node.y - 3, 0, node.x, node.y, nodeRadius);
      if (node.type === 'person') {
        ngrad.addColorStop(0, isActive ? '#00E5FF' : '#0099FF');
        ngrad.addColorStop(1, '#0066CC');
      } else {
        ngrad.addColorStop(0, isActive ? '#00E5FF' : '#0099FF');
        ngrad.addColorStop(1, '#0066CC');
      }
      ctx.fillStyle = ngrad;
      ctx.fill();
      ctx.strokeStyle = isActive ? '#00E5FF' : 'rgba(0,229,255,0.3)';
      ctx.lineWidth = isActive ? 2 : 1;
      ctx.stroke();
      
      // 节点名称
      ctx.fillStyle = '#fff';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const name = node.name.length > 8 ? node.name.slice(0, 7) + '…' : node.name;
      ctx.fillText(name, node.x, node.y + nodeRadius + 14);
    });
    
    animationId = requestAnimationFrame(animate);
  }
  
  animate();
  
  // 点击交互
  canvas.onclick = (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    let clicked = null;
    nodePositions.forEach(node => {
      const dist = Math.sqrt((x - node.x) ** 2 + (y - node.y) ** 2);
      if (dist < 20) clicked = node;
    });
    
    if (clicked) {
      activeRelation = clicked.id;
      const detail = document.getElementById('graphDetail');
      document.getElementById('detailName').textContent = clicked.name;
      document.getElementById('detailRelation').textContent = '关系：' + clicked.relation + ' · 关联强度：' + (clicked.strength * 100).toFixed(0) + '%';
      detail.classList.add('show');
    } else {
      activeRelation = null;
      document.getElementById('graphDetail').classList.remove('show');
    }
  };
}

// ============ 页面切换 ============
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function goHome() {
  if (animationId) cancelAnimationFrame(animationId);
  activeRelation = null;
  document.getElementById('searchInput').value = '';
  showPage('page-home');
}

// ============ 初始化 ============
initParticles();
renderHotQueries();

// 回车搜索
document.getElementById('searchInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') handleSearch();
});

// 窗口缩放时重绘图谱
window.addEventListener('resize', () => {
  if (document.getElementById('page-result').classList.contains('active') && currentData) {
    setTimeout(drawRelationGraph, 100);
  }
});
</script>

</body>
</html>
