<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生模拟器 - 观察类游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 开始界面 -->
    <div id="start-screen" class="start-screen">
        <div class="title-container">
            <h1 class="game-title pixel-text">人生模拟器</h1>
            <p class="subtitle pixel-text">观察十人同居生活的故事</p>
            <div class="pixel-divider"></div>
            <p class="description">全自动AI驱动 · 无玩家干预 · 纯观察体验</p>
            <button id="start-btn" class="pixel-btn start-btn">开始观察</button>
        </div>
        <div class="characters-preview">
            <h3 class="pixel-text">同居成员</h3>
            <div class="character-list">
                <div class="char-group">
                    <h4>男性成员</h4>
                    <div class="char-names">
                        <span class="char-name main">周星杰</span>
                        <span class="char-name">汪淼</span>
                        <span class="char-name">华子</span>
                        <span class="char-name">刘小成</span>
                    </div>
                </div>
                <div class="char-group">
                    <h4>女性成员</h4>
                    <div class="char-names">
                        <span class="char-name">星唅</span>
                        <span class="char-name">努米亚</span>
                        <span class="char-name">莱茵茵</span>
                        <span class="char-name">琳娜</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 游戏主界面 -->
    <div id="game-screen" class="game-screen hidden">
        <!-- 顶部信息栏 -->
        <div class="top-bar">
            <div class="time-display">
                <span id="game-time" class="pixel-text">06:00</span>
                <span id="game-date" class="pixel-text">第1天 春</span>
            </div>
            <div class="weather-display">
                <span id="weather-icon" class="weather-icon">☀️</span>
            </div>
        </div>

        <!-- 主游戏区域 -->
        <div class="game-container">
            <!-- 楼层切换 -->
            <div class="floor-tabs">
                <button class="floor-tab active" data-floor="floor1">一层公共区</button>
                <button class="floor-tab" data-floor="floor2">二层私密区</button>
            </div>

            <!-- 地图渲染区 -->
            <div class="map-container">
                <canvas id="game-canvas" width="1920" height="1080"></canvas>
                <div id="character-layer" class="character-layer"></div>
            </div>
        </div>

        <!-- 右侧角色面板 -->
        <div class="right-panel">
            <div class="panel-section">
                <h3 class="panel-title pixel-text">角色状态</h3>
                <div id="character-list" class="character-status-list">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>

        <!-- 底部事件日志 -->
        <div class="bottom-panel">
            <div class="event-log">
                <h4 class="pixel-text">实时事件</h4>
                <div id="event-list" class="event-list">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
