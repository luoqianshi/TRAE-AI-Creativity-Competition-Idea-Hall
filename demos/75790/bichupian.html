<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>必出片</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
:root {
  --bg:#050508; --surface:#0e0e1a; --text:#e8e8f0; --muted:rgba(255,255,255,0.45);
  --accent:#FF6B35; --good:#00D4AA; --warn:#FFD166; --danger:#EF476F; --blue:#4facfe; --purple:#a855f7;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { font-family:'Noto+Sans+SC',-apple-system,sans-serif; background:#0a0a0f; color:var(--text); height:100%; overflow:hidden; }

/* ===== 手机外框 ===== */
.device-wrapper { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; overflow:auto; padding:10px; }
.phone-frame { width:390px; height:844px; position:relative; background:#000; border-radius:48px; border:10px solid #1c1c24; box-shadow:0 25px 80px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.05); overflow:hidden; flex-shrink:0; transform-origin:center center; }
.phone-frame::before { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:160px; height:32px; background:#1c1c24; border-radius:0 0 20px 20px; z-index:500; }
.phone-frame::after { content:''; position:absolute; top:10px; left:50%; transform:translateX(-50%); width:80px; height:22px; border-radius:12px; border:2px solid #2a2a35; z-index:501; }
.screen { position:absolute; inset:0; overflow:hidden; border-radius:38px; background:#000; }

/* ===== 启动页 ===== */
.splash { position:absolute; inset:0; z-index:300; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(160deg,#050508 0%,#0f0805 40%,#050508 100%); transition:opacity 0.6s,transform 0.6s; }
.splash.hidden { opacity:0; transform:scale(1.04); pointer-events:none; }
.splash-logo { position:relative; margin-bottom:32px; }
.splash-logo .lens { width:80px; height:80px; border-radius:50%; border:3px solid var(--accent); display:flex; align-items:center; justify-content:center; box-shadow:0 0 30px rgba(255,107,53,0.25),inset 0 0 12px rgba(255,107,53,0.1); animation:pl 2.5s ease-in-out infinite; }
.splash-logo .lens::after { content:''; width:20px; height:20px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
.splash-logo .ring { position:absolute; inset:-16px; border-radius:50%; border:1px solid rgba(255,107,53,0.15); animation:sr 10s linear infinite; }
.splash-logo .ring::before { content:''; position:absolute; top:-2px; left:50%; width:5px; height:5px; border-radius:50%; background:var(--accent); transform:translateX(-50%); }
@keyframes pl { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
@keyframes sr { to{transform:rotate(360deg)} }
.splash h1 { font-size:32px; font-weight:900; letter-spacing:4px; margin-bottom:6px; background:linear-gradient(135deg,#fff,rgba(255,255,255,0.55)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.splash .sub { font-size:14px; color:var(--muted); letter-spacing:2px; margin-bottom:48px; }
.ut-sel { display:flex; flex-direction:column; gap:14px; width:300px; }
.ut-btn { padding:16px 18px; border-radius:16px; border:1.5px solid rgba(255,255,255,0.06); background:rgba(255,255,255,0.03); color:var(--text); cursor:pointer; font-family:inherit; text-align:left; transition:all 0.3s; position:relative; }
.ut-btn:hover { border-color:rgba(255,107,53,0.35); background:rgba(255,107,53,0.05); transform:translateY(-2px); }
.ut-btn .ut-t { font-size:15px; font-weight:700; margin-bottom:4px; display:flex; align-items:center; gap:6px; }
.ut-btn .ut-d { font-size:12px; color:var(--muted); line-height:1.5; }
.ut-btn .ut-a { position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:16px; color:var(--muted); }
.ut-btn:hover .ut-a { color:var(--accent); }

/* ===== 相机主屏 ===== */
.camera { position:absolute; inset:0; opacity:0; transition:opacity 0.4s; z-index:100; }
.camera.on { opacity:1; }
.status-bar { position:absolute; top:0; left:0; right:0; height:44px; display:flex; justify-content:space-between; align-items:flex-end; padding:0 24px 6px; z-index:50; background:linear-gradient(to bottom,rgba(0,0,0,0.5),transparent); font-size:13px; font-weight:600; }

/* ===== 取景框 ===== */
.viewfinder { position:absolute; inset:0; overflow:hidden; background:#000; }
.viewfinder .vf-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 20%; }
.viewfinder .vf-darken { position:absolute; inset:0; background:rgba(0,0,0,0.1); pointer-events:none; }

/* ===== 右侧评分侧边栏 ===== */
.score-side { position:absolute; top:50px; right:0; z-index:45; display:flex; flex-direction:column; align-items:center; gap:5px; opacity:0; transform:translateX(10px); transition:all 0.4s; }
.score-side.show { opacity:1; transform:translateX(0); }
.score-side .ss-live { width:28px; height:28px; border-radius:8px; background:rgba(0,0,0,0.5); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; }
.score-side .ss-live .ssl-dot { width:5px; height:5px; border-radius:50%; background:var(--danger); animation:liveB 1.2s ease-in-out infinite; }
@keyframes liveB { 0%,100%{opacity:1} 50%{opacity:0.3} }
.score-side .ss-item { width:28px; height:28px; border-radius:8px; background:rgba(0,0,0,0.5); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.08); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s; }
.score-side .ss-item:hover { transform:scale(1.1); }
.score-side .ss-item .ssi-v { font-size:10px; font-weight:800; line-height:1; }
.score-side .ss-item .ssi-l { font-size:7px; color:var(--muted); margin-top:1px; }
.score-side .ss-total { width:28px; height:36px; border-radius:8px; background:rgba(0,0,0,0.55); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1); display:flex; flex-direction:column; align-items:center; justify-content:center; }
.score-side .ss-total .sst-v { font-size:13px; font-weight:900; line-height:1; }
.score-side .ss-total .sst-l { font-size:7px; color:var(--muted); margin-top:2px; }

/* 展开详情 */
.score-detail { position:absolute; top:50px; right:0; z-index:46; width:0; overflow:hidden; opacity:0; transition:all 0.35s cubic-bezier(0.16,1,0.3,1); }
.score-detail.on { width:130px; opacity:1; }
.score-detail .sd-inner { width:130px; background:rgba(0,0,0,0.6); backdrop-filter:blur(16px); border-radius:12px 0 0 12px; border:1px solid rgba(255,255,255,0.08); border-right:none; padding:12px; }
.sd-row { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
.sd-row:last-child { margin-bottom:0; padding-top:6px; border-top:1px solid rgba(255,255,255,0.06); }
.sd-row .sd-n { font-size:10px; color:var(--muted); width:22px; }
.sd-row .sd-bar-bg { flex:1; height:4px; background:rgba(255,255,255,0.06); border-radius:2px; overflow:hidden; }
.sd-row .sd-bar-fill { height:100%; border-radius:2px; transition:width 0.5s; }
.sd-row .sd-v { font-size:11px; font-weight:800; min-width:20px; text-align:right; }

/* ===== AR引导层 ===== */
.ar-layer { position:absolute; inset:0; pointer-events:none; z-index:20; }

/* 三分法网格 */
.grid-ol { position:absolute; inset:0; opacity:0; transition:opacity 0.5s; }
.grid-ol.show { opacity:1; }
.grid-ol .gh, .grid-ol .gv { position:absolute; background:rgba(255,255,255,0.08); }
.grid-ol .gh { left:12px; right:12px; height:1px; }
.grid-ol .gv { top:44px; bottom:0; width:1px; }
.grid-ol .gh:nth-child(1){top:33.33%} .grid-ol .gh:nth-child(2){top:66.66%}
.grid-ol .gv:nth-child(3){left:33.33%} .grid-ol .gv:nth-child(4){left:66.66%}

/* 当前位置框 - 固定 */
.frame-curr { position:absolute; border:2px dashed rgba(239,71,111,0.6); border-radius:10px; opacity:0; transition:all 0.5s; z-index:22; }
.frame-curr.show { opacity:1; }
.frame-curr .fc-tag { position:absolute; top:-20px; left:50%; transform:translateX(-50%); background:rgba(239,71,111,0.8); padding:2px 8px; border-radius:6px; font-size:9px; font-weight:700; color:#fff; white-space:nowrap; }

/* 建议位置框 - 随构图模式变化 */
.frame-sug { position:absolute; border:2.5px solid var(--good); border-radius:10px; opacity:0; transition:all 0.5s; z-index:22; box-shadow:0 0 16px rgba(0,212,170,0.12); }
.frame-sug.show { opacity:1; }
.frame-sug .fs-tag { position:absolute; top:-20px; left:50%; transform:translateX(-50%); background:var(--good); padding:2px 8px; border-radius:6px; font-size:9px; font-weight:700; color:#000; white-space:nowrap; }

/* 连接箭头 */
.conn-arrow { position:absolute; opacity:0; transition:opacity 0.5s; z-index:23; }
.conn-arrow.show { opacity:1; }

/* 面部光线提示 */
.face-hint { position:absolute; top:26%; left:50%; transform:translateX(-50%); opacity:0; transition:all 0.4s; z-index:23; display:flex; flex-direction:column; align-items:center; gap:4px; pointer-events:auto; cursor:pointer; }
.face-hint.show { opacity:1; }
.face-hint .fh-bulb { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#ffe066,#ffb700); display:flex; align-items:center; justify-content:center; font-size:16px; box-shadow:0 0 0 3px rgba(255,176,0,0.15),0 0 12px rgba(255,176,0,0.3); animation:bp 2s ease-in-out infinite; }
@keyframes bp { 0%,100%{box-shadow:0 0 0 3px rgba(255,176,0,0.1),0 0 10px rgba(255,176,0,0.2)} 50%{box-shadow:0 0 0 5px rgba(255,176,0,0.2),0 0 18px rgba(255,176,0,0.4)} }
.face-hint .fh-text { background:rgba(0,0,0,0.55); backdrop-filter:blur(8px); padding:3px 10px; border-radius:8px; font-size:11px; font-weight:700; color:#ffb700; white-space:nowrap; }

/* 景别提示 */
.framing-hint { position:absolute; bottom:28%; left:50%; transform:translateX(-50%); opacity:0; transition:all 0.4s; z-index:23; display:flex; flex-direction:column; align-items:center; gap:4px; pointer-events:auto; cursor:pointer; }
.framing-hint.show { opacity:1; }
.framing-hint .fr-icon { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--purple),#c084fc); display:flex; align-items:center; justify-content:center; font-size:16px; box-shadow:0 0 0 3px rgba(168,85,247,0.15),0 0 12px rgba(168,85,247,0.3); animation:fp 2s ease-in-out infinite; }
@keyframes fp { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
.framing-hint .fr-text { background:rgba(0,0,0,0.55); backdrop-filter:blur(8px); padding:3px 10px; border-radius:8px; font-size:11px; font-weight:700; color:var(--purple); white-space:nowrap; }

/* 构图良好提示 */
.comp-ok { position:absolute; top:18%; right:20%; opacity:0; transition:all 0.4s; z-index:23; display:flex; align-items:center; gap:5px; background:rgba(0,212,170,0.15); backdrop-filter:blur(8px); padding:5px 12px; border-radius:10px; border:1px solid rgba(0,212,170,0.2); }
.comp-ok.show { opacity:1; }
.comp-ok .co-icon { width:20px; height:20px; border-radius:50%; background:var(--good); display:flex; align-items:center; justify-content:center; font-size:11px; }
.comp-ok .co-text { font-size:11px; font-weight:700; color:var(--good); }

/* 扫描 */
.scan { position:absolute; top:45%; left:50%; transform:translate(-50%,-50%); width:90px; height:90px; opacity:0; z-index:35; pointer-events:none; transition:opacity 0.3s; }
.scan.show { opacity:1; }
.scan .sr { position:absolute; inset:0; border-radius:50%; border:2px solid transparent; }
.scan .sr:nth-child(1){border-top-color:var(--accent);border-right-color:rgba(255,107,53,0.2);animation:ss 1s linear infinite}
.scan .sr:nth-child(2){inset:14px;border-bottom-color:var(--good);border-left-color:rgba(0,212,170,0.2);animation:ss 1.3s linear infinite reverse}
.scan .stxt { position:absolute; bottom:-22px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:600; color:var(--accent); white-space:nowrap; }
@keyframes ss { to{transform:rotate(360deg)} }

/* ===== HUD ===== */
.hud { position:absolute; top:44px; left:0; right:0; padding:0 14px; z-index:40; display:flex; align-items:flex-start; justify-content:space-between; pointer-events:none; }
.hud > * { pointer-events:auto; }
.ai-ind { display:flex; align-items:center; gap:5px; background:rgba(0,0,0,0.4); backdrop-filter:blur(10px); padding:5px 10px; border-radius:14px; border:1px solid rgba(255,255,255,0.06); opacity:0; transform:translateY(-5px); transition:all 0.4s; font-size:11px; }
.ai-ind.show { opacity:1; transform:translateY(0); }
.ai-ind .aid { width:6px; height:6px; border-radius:50%; }
.ai-ind .aid.ok { background:var(--good); animation:dp 2s ease-in-out infinite; }
.ai-ind .aid.busy { background:var(--warn); animation:dp 0.7s ease-in-out infinite; }
@keyframes dp { 0%,100%{box-shadow:0 0 0 0 currentColor} 50%{box-shadow:0 0 0 3px transparent} }
.scene-tag { background:rgba(0,0,0,0.4); backdrop-filter:blur(10px); padding:5px 10px; border-radius:14px; font-size:11px; border:1px solid rgba(255,255,255,0.06); opacity:0; transform:translateY(-5px); transition:all 0.4s 0.1s; }
.scene-tag.show { opacity:1; transform:translateY(0); }

/* 控制按钮 */
.ctrl-btn { position:absolute; width:34px; height:34px; border-radius:50%; background:rgba(0,0,0,0.4); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; opacity:0; transition:all 0.4s; color:var(--text); z-index:41; }
.ctrl-btn.show { opacity:1; }
.ctrl-btn.off { opacity:0.3; }
.ctrl-btn:active { transform:scale(0.92); }
#aiToggle { top:80px; right:8px; }
#caseBtn { bottom:145px; left:10px; }
#diagBtn { bottom:105px; left:10px; }

/* ===== 构图方案条 ===== */
.comp-bar { position:absolute; bottom:120px; left:0; right:0; z-index:42; display:flex; align-items:center; justify-content:center; gap:5px; padding:0 14px; opacity:0; transform:translateY(8px); transition:all 0.5s; overflow-x:auto; scrollbar-width:none; }
.comp-bar::-webkit-scrollbar { display:none; }
.comp-bar.show { opacity:1; transform:translateY(0); }
.comp-pill { flex-shrink:0; padding:5px 12px; border-radius:16px; font-size:11px; font-weight:600; color:rgba(255,255,255,0.4); background:rgba(0,0,0,0.35); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.06); cursor:pointer; transition:all 0.3s; font-family:inherit; white-space:nowrap; position:relative; }
.comp-pill.on { background:rgba(255,107,53,0.2); border-color:rgba(255,107,53,0.35); color:#fff; }
.comp-pill:hover:not(.on) { color:rgba(255,255,255,0.7); }
.comp-pill .cp-rec { position:absolute; top:-5px; right:-3px; font-size:8px; padding:1px 5px; border-radius:5px; background:var(--accent); color:#fff; font-weight:700; }
.comp-more { flex-shrink:0; width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,0.35); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; color:rgba(255,255,255,0.5); transition:all 0.3s; }
.comp-more:hover { color:#fff; }

/* ===== 底部操作栏 ===== */
.bottom { position:absolute; bottom:0; left:0; right:0; height:110px; z-index:40; display:flex; flex-direction:column; align-items:center; padding:0 16px; background:linear-gradient(to top,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.4) 60%,transparent 100%); }
.modes { display:flex; gap:4px; margin-top:6px; margin-bottom:10px; }
.mode-btn { padding:4px 10px; border-radius:14px; font-size:10px; font-weight:600; color:rgba(255,255,255,0.35); background:rgba(255,255,255,0.04); border:none; cursor:pointer; font-family:inherit; transition:all 0.3s; }
.mode-btn.on { background:var(--accent); color:#fff; }
.actions { display:flex; align-items:center; gap:28px; }
.action-btn { width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); color:rgba(255,255,255,0.55); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
.shutter { width:56px; height:56px; border-radius:50%; background:#fff; border:3px solid rgba(255,255,255,0.25); cursor:pointer; position:relative; transition:all 0.15s; box-shadow:0 0 16px rgba(255,255,255,0.12); }
.shutter:active { transform:scale(0.93); }
.shutter::after { content:''; position:absolute; inset:4px; border-radius:50%; border:2px solid rgba(0,0,0,0.06); }

/* 闪光 */
.flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:60; }
.flash.fire { animation:fa 0.35s ease-out; }
@keyframes fa { 0%{opacity:0.95} 100%{opacity:0} }

/* ready-hint 上移避免重叠 */
.ready-hint { position:absolute; bottom:160px; left:50%; transform:translateX(-50%) translateY(8px); background:var(--good); padding:6px 14px; border-radius:16px; font-size:12px; font-weight:700; color:#000; z-index:35; opacity:0; transition:all 0.4s; pointer-events:none; white-space:nowrap; }
.ready-hint.show { opacity:1; transform:translateX(-50%) translateY(0); }

.toast { position:absolute; bottom:170px; left:50%; transform:translateX(-50%) translateY(10px); background:rgba(0,0,0,0.5); backdrop-filter:blur(10px); padding:6px 14px; border-radius:16px; font-size:11px; font-weight:500; z-index:70; opacity:0; transition:all 0.4s; pointer-events:none; border:1px solid rgba(255,255,255,0.06); white-space:nowrap; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* 场景切换 */
.scene-dots { position:absolute; bottom:118px; right:8px; z-index:42; display:flex; flex-direction:column; gap:5px; opacity:0; transform:translateX(8px); transition:all 0.4s; }
.scene-dots.show { opacity:1; transform:translateX(0); }
.scene-dot { width:28px; height:28px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.1); background:rgba(0,0,0,0.35); cursor:pointer; transition:all 0.2s; font-size:12px; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
.scene-dot.on { border-color:var(--accent); background:rgba(255,107,53,0.15); }

/* ===== 案例图库 ===== */
.case-panel { position:absolute; inset:0; z-index:200; background:linear-gradient(180deg,#0a0a14 0%,#121220 100%); opacity:0; pointer-events:none; transition:opacity 0.4s; display:flex; flex-direction:column; }
.case-panel.on { opacity:1; pointer-events:auto; }
.case-h { display:flex; align-items:center; justify-content:space-between; padding:50px 16px 10px; }
.case-h h2 { font-size:17px; font-weight:800; }
.case-h .cx { width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:var(--muted); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.case-tabs { display:flex; gap:6px; padding:0 16px 10px; overflow-x:auto; scrollbar-width:none; }
.case-tabs::-webkit-scrollbar { display:none; }
.case-tab { padding:5px 12px; border-radius:14px; font-size:11px; font-weight:600; color:var(--muted); background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); cursor:pointer; white-space:nowrap; font-family:inherit; transition:all 0.3s; }
.case-tab.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.case-scroll { flex:1; overflow-y:auto; padding:0 16px 16px; }
.case-scroll::-webkit-scrollbar { display:none; }

.case-card { border-radius:14px; overflow:hidden; margin-bottom:12px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05); }
.case-card .cc-img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#1a1a2a; }
.case-card .cc-bar { padding:10px 12px; display:flex; gap:6px; flex-wrap:wrap; }
.case-card .cc-tag { padding:3px 8px; border-radius:8px; font-size:10px; font-weight:600; }
.case-card .cc-tag.comp { background:rgba(255,107,53,0.1); color:var(--accent); border:1px solid rgba(255,107,53,0.15); }
.case-card .cc-tag.light { background:rgba(255,209,102,0.1); color:var(--warn); border:1px solid rgba(255,209,102,0.15); }
.case-card .cc-tag.framing { background:rgba(168,85,247,0.1); color:var(--purple); border:1px solid rgba(168,85,247,0.15); }
.case-card .cc-tag.ratio { background:rgba(79,172,254,0.1); color:var(--blue); border:1px solid rgba(79,172,254,0.15); }

/* ===== 详细面板 ===== */
.detail-panel, .diagnosis-panel { position:absolute; bottom:0; left:0; right:0; z-index:150; background:linear-gradient(to top,#0a0a14 0%,#121220 85%,rgba(18,18,32,0.95) 100%); border-radius:18px 18px 0 0; padding:14px 16px 24px; transform:translateY(100%); transition:transform 0.45s cubic-bezier(0.16,1,0.3,1); max-height:70%; overflow-y:auto; }
.detail-panel.show, .diagnosis-panel.show { transform:translateY(0); }
.detail-panel::-webkit-scrollbar, .diagnosis-panel::-webkit-scrollbar { display:none; }
.dp-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.dp-h .dp-t { font-size:15px; font-weight:800; }
.dp-h .dp-x { width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:var(--muted); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.dp-prob { padding:10px; background:rgba(255,255,255,0.02); border-radius:10px; border:1px solid rgba(255,255,255,0.05); margin-bottom:12px; }
.dp-prob .dp-l { font-size:9px; font-weight:700; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
.dp-prob .dp-txt { font-size:12px; font-weight:500; line-height:1.5; }
.dp-compare { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.dp-c-item { border-radius:10px; overflow:hidden; position:relative; aspect-ratio:4/5; }
.dp-c-item .dp-c-bg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:28px; }
.dp-c-item .dp-c-tag { position:absolute; bottom:6px; left:6px; right:6px; padding:4px 6px; border-radius:6px; font-size:9px; font-weight:700; text-align:center; }
.dp-c-item.bad .dp-c-tag { background:rgba(239,71,111,0.85); color:#fff; }
.dp-c-item.good .dp-c-tag { background:rgba(0,212,170,0.85); color:#000; }
.dp-steps { margin-bottom:12px; }
.dp-steps-t { font-size:12px; font-weight:700; margin-bottom:8px; }
.dp-step { display:flex; align-items:flex-start; gap:8px; padding:8px; background:rgba(255,255,255,0.02); border-radius:8px; margin-bottom:5px; border:1px solid rgba(255,255,255,0.03); }
.dp-step .dp-n { width:20px; height:20px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; flex-shrink:0; }
.dp-step .dp-s-txt { font-size:11px; line-height:1.5; color:rgba(255,255,255,0.8); }
.dp-btn { width:100%; padding:10px; border-radius:10px; border:none; background:var(--accent); color:#fff; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }

.dg-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.dg-h .dg-t { font-size:15px; font-weight:800; }
.dg-h .dg-x { width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:var(--muted); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.dg-item { display:flex; align-items:center; gap:8px; padding:10px; background:rgba(255,255,255,0.02); border-radius:10px; margin-bottom:6px; border:1px solid rgba(255,255,255,0.03); cursor:pointer; transition:all 0.2s; }
.dg-item:hover { background:rgba(255,255,255,0.04); }
.dg-item .dg-dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
.dg-item .dg-dot.red { background:var(--danger); box-shadow:0 0 5px rgba(239,71,111,0.4); }
.dg-item .dg-dot.yellow { background:var(--warn); box-shadow:0 0 5px rgba(255,209,102,0.3); }
.dg-item .dg-dot.green { background:var(--good); box-shadow:0 0 5px rgba(0,212,170,0.3); }
.dg-item .dg-b { flex:1; }
.dg-item .dg-n { font-size:12px; font-weight:600; }
.dg-item .dg-d { font-size:10px; color:var(--muted); }
.dg-opt { width:100%; padding:10px; border-radius:10px; border:none; background:var(--good); color:#000; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:4px; }

/* ===== 结果页 ===== */
.result { position:absolute; inset:0; z-index:150; background:var(--bg); display:flex; flex-direction:column; opacity:0; pointer-events:none; transition:opacity 0.4s; }
.result.on { opacity:1; pointer-events:auto; }
.rh { display:flex; align-items:center; justify-content:space-between; padding:50px 16px 10px; }
.rh-back { background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; font-family:inherit; }
.rh-t { font-size:14px; font-weight:700; }
.rh-save { background:var(--accent); border:none; color:#fff; font-size:11px; font-weight:700; padding:5px 14px; border-radius:14px; cursor:pointer; font-family:inherit; }
.r-img { flex:1; margin:5px 14px; border-radius:12px; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center; min-height:160px; }
.r-img .ph { font-size:40px; opacity:0.3; }
.r-img .r-sc { position:absolute; top:12px; right:12px; background:rgba(0,0,0,0.5); backdrop-filter:blur(8px); padding:8px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.06); text-align:center; }
.r-img .r-sc .rs-n { font-size:32px; font-weight:900; color:var(--good); line-height:1; }
.r-img .r-sc .rs-l { font-size:9px; color:var(--muted); }
.r-tags { display:flex; gap:5px; padding:8px 16px; flex-wrap:wrap; }
.r-tags span { padding:3px 10px; border-radius:14px; font-size:10px; font-weight:500; background:rgba(0,212,170,0.08); border:1px solid rgba(0,212,170,0.15); color:var(--good); }
.r-analysis { padding:0 16px 14px; flex:1; overflow-y:auto; }
.r-analysis::-webkit-scrollbar { display:none; }
.r-analysis .ra-h { font-size:10px; font-weight:700; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; }
.ra-item { display:flex; align-items:center; gap:8px; padding:8px; background:rgba(255,255,255,0.02); border-radius:10px; margin-bottom:5px; border:1px solid rgba(255,255,255,0.03); }
.ra-item .ra-ic { width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }
.ra-item .ra-b { flex:1; }
.ra-item .ra-n { font-size:11px; font-weight:600; }
.ra-item .ra-d { font-size:9px; color:var(--muted); line-height:1.5; }
.ra-item .ra-s { font-size:12px; font-weight:800; flex-shrink:0; color:var(--good); }

/* ===== 相册 ===== */
.gallery { position:absolute; inset:0; z-index:150; background:var(--bg); opacity:0; pointer-events:none; transition:opacity 0.4s; display:flex; flex-direction:column; }
.gallery.on { opacity:1; pointer-events:auto; }
.gh { display:flex; align-items:center; justify-content:space-between; padding:50px 16px 10px; }
.gh-back { background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; font-family:inherit; }
.gh-t { font-size:14px; font-weight:700; }
.gh-c { font-size:11px; color:var(--muted); }
.g-grid { flex:1; padding:0 10px 12px; overflow-y:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.g-grid::-webkit-scrollbar { display:none; }
.gi { aspect-ratio:1; border-radius:6px; overflow:hidden; position:relative; cursor:pointer; transition:transform 0.2s; }
.gi:active { transform:scale(0.97); }
.gi .gi-bg { position:absolute; inset:0; background-size:cover; background-position:center; }
.gi .gi-sc { position:absolute; bottom:4px; right:4px; background:rgba(0,0,0,0.55); backdrop-filter:blur(4px); padding:2px 6px; border-radius:5px; font-size:9px; font-weight:700; color:var(--good); }
.g-empty { grid-column:1/-1; text-align:center; padding:70px 0; color:var(--muted); font-size:11px; }
</style>
</head>
<body>

<div class="device-wrapper" id="deviceWrapper">
<div class="phone-frame" id="phoneFrame">
<div class="screen">

  <!-- 启动页 -->
  <div class="splash" id="splash">
    <div class="splash-logo"><div class="ring"></div><div class="lens"></div></div>
    <h1>必出片</h1><div class="sub">你的AI拍照领航员，废片清零，夸赞管够。</div>
    <div style="margin-top:40px;font-size:13px;color:rgba(255,255,255,0.4)">正在启动相机...</div>
  </div>

  <!-- 相机主屏 -->
  <div class="camera" id="camera">
    <div class="status-bar"><span id="clock">17:42</span><span class="icons">📶 🔋</span></div>
    <div class="viewfinder" id="viewfinder"></div>

    <!-- AR层 -->
    <div class="ar-layer">
      <div class="grid-ol" id="gridOl"><div class="gh"></div><div class="gh"></div><div class="gv"></div><div class="gv"></div></div>
      <div class="frame-curr" id="frameCurr" style="top:24%;left:36%;width:28%;height:42%;"><span class="fc-tag">当前位置</span></div>
      <div class="frame-sug" id="frameSug" style="top:22%;left:58%;width:24%;height:46%;"><span class="fs-tag">建议位置</span></div>
      <div class="conn-arrow" id="connArrow" style="top:44%;left:52%;">
        <svg width="40" height="18" viewBox="0 0 40 18"><path d="M30 2 L38 9 L30 16" stroke="#00D4AA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="2" y1="9" x2="34" y2="9" stroke="#00D4AA" stroke-width="1.5" stroke-dasharray="4,3"/></svg>
      </div>
      <div class="face-hint" id="faceHint"><div class="fh-bulb">💡</div><div class="fh-text">面部偏暗</div></div>
      <div class="framing-hint" id="framingHint"><div class="fr-icon">📷</div><div class="fr-text" id="frText">靠近一点，拍半身特写</div></div>
      <div class="comp-ok" id="compOk"><div class="co-icon">✓</div><div class="co-text">构图良好</div></div>
      <div class="scan" id="scan"><div class="sr"></div><div class="sr"></div><span class="stxt">正在分析场景...</span></div>
    </div>

    <!-- 右侧评分侧边栏 -->
    <div class="score-side" id="scoreSide">
      <div class="ss-live"><div class="ssl-dot"></div></div>
      <div class="ss-item" onclick="togScoreDetail()"><span class="ssi-v" id="ssvC" style="color:var(--accent)">55</span><span class="ssi-l">构</span></div>
      <div class="ss-item" onclick="togScoreDetail()"><span class="ssi-v" id="ssvL" style="color:var(--warn)">72</span><span class="ssi-l">光</span></div>
      <div class="ss-item" onclick="togScoreDetail()"><span class="ssi-v" id="ssvR" style="color:var(--blue)">85</span><span class="ssi-l">色</span></div>
      <div class="ss-item" onclick="togScoreDetail()"><span class="ssi-v" id="ssvF" style="color:var(--good)">92</span><span class="ssi-l">焦</span></div>
      <div class="ss-item" onclick="togScoreDetail()"><span class="ssi-v" id="ssvV" style="color:var(--purple)">60</span><span class="ssi-l">景</span></div>
      <div class="ss-total"><span class="sst-v" id="sstTotal" style="color:var(--warn)">76</span><span class="sst-l">综合</span></div>
    </div>
    <div class="score-detail" id="scoreDetail">
      <div class="sd-inner">
        <div class="sd-row"><span class="sd-n">构图</span><div class="sd-bar-bg"><div class="sd-bar-fill" id="sdBarC" style="width:55%;background:var(--accent)"></div></div><span class="sd-v" id="sdValC" style="color:var(--accent)">55</span></div>
        <div class="sd-row"><span class="sd-n">光线</span><div class="sd-bar-bg"><div class="sd-bar-fill" id="sdBarL" style="width:72%;background:var(--warn)"></div></div><span class="sd-v" id="sdValL" style="color:var(--warn)">72</span></div>
        <div class="sd-row"><span class="sd-n">色彩</span><div class="sd-bar-bg"><div class="sd-bar-fill" id="sdBarR" style="width:85%;background:var(--blue)"></div></div><span class="sd-v" id="sdValR" style="color:var(--blue)">85</span></div>
        <div class="sd-row"><span class="sd-n">焦点</span><div class="sd-bar-bg"><div class="sd-bar-fill" id="sdBarF" style="width:92%;background:var(--good)"></div></div><span class="sd-v" id="sdValF" style="color:var(--good)">92</span></div>
        <div class="sd-row"><span class="sd-n">景别</span><div class="sd-bar-bg"><div class="sd-bar-fill" id="sdBarV" style="width:60%;background:var(--purple)"></div></div><span class="sd-v" id="sdValV" style="color:var(--purple)">60</span></div>
        <div class="sd-row" style="border-top:1px solid rgba(255,255,255,0.06);padding-top:6px;margin-top:2px;"><span class="sd-n" style="font-size:9px;color:var(--muted)">综合</span><span class="sd-v" id="sdTotal" style="color:var(--warn);font-size:13px">76</span></div>
      </div>
    </div>

    <div class="hud">
      <div class="ai-ind" id="aiInd"><div class="aid" id="aid"></div><span id="aiTxt">AI 就绪</span></div>
      <div class="scene-tag" id="sceneTag">户外建筑人像</div>
    </div>
    <div class="ctrl-btn" id="aiToggle" onclick="togAI()">🤖</div>
    <div class="ctrl-btn" id="caseBtn" onclick="openCase()">📚</div>
    <div class="ctrl-btn" id="diagBtn" onclick="openDiag()">?</div>

    <div class="comp-bar" id="compBar"></div>
    <div class="scene-dots" id="sceneDots">
      <div class="scene-dot on" data-scene="photo1" onclick="swScene('photo1')">👦</div>
      <div class="scene-dot" data-scene="photo2" onclick="swScene('photo2')">👶</div>
      <div class="scene-dot" data-scene="sunset" onclick="swScene('sunset')">🌅</div>
      <div class="scene-dot" data-scene="citynight" onclick="swScene('citynight')">🌃</div>
    </div>

    <div class="flash" id="flash"></div>
    <div class="ready-hint" id="readyHint">✓ 已就绪，可以拍照了</div>
    <div class="toast" id="toast"></div>

    <div class="bottom">
      <div class="modes">
        <button class="mode-btn on" onclick="swMode('ai',this)">AI 拍照</button>
        <button class="mode-btn" onclick="swMode('portrait',this)">人像</button>
        <button class="mode-btn" onclick="swMode('landscape',this)">风景</button>
        <button class="mode-btn" onclick="swMode('food',this)">美食</button>
      </div>
      <div class="actions">
        <button class="action-btn" onclick="openGal()">🖼️</button>
        <button class="shutter" onclick="takePhoto()"></button>
        <button class="action-btn">⚡</button>

      <button class="case-tab on" onclick="swCaseTab('all',this)">全部</button>
      <button class="case-tab" onclick="swCaseTab('thirds',this)">三分法</button>
      <button class="case-tab" onclick="swCaseTab('center',this)">居中</button>
      <button class="case-tab" onclick="swCaseTab('symmetry',this)">对称</button>
      <button class="case-tab" onclick="swCaseTab('diagonal',this)">对角线</button>
      <button class="case-tab" onclick="swCaseTab('frame',this)">框架</button>
      <button class="case-tab" onclick="swCaseTab('light',this)">光线</button>
      <button class="case-tab" onclick="swCaseTab('framing',this)">景别</button>

    <div class="case-scroll" id="caseScroll"></div>
  </div>

    <div class="dp-h"><span class="dp-t" id="dpTitle">📐 构图建议</span><button class="dp-x" onclick="closeDetail()">×</button></div>
    <div class="dp-prob"><div class="dp-l">检测到的问题</div><div class="dp-txt" id="dpProb">人物偏离三分线</div></div>

</div>
</div>

/* ===== AI分析 ===== */
function startAI(){
  if(!S.ai)return; hideAR(); S.aiState='analyzing';
  $('scan').classList.add('show');
  $('aiInd').classList.add('show'); $('aid').className='aid busy'; $('aiTxt').textContent='AI 分析中...';
  $('sceneTag').classList.remove('show'); $('scoreSide').classList.remove('show'); $('scoreDetail').classList.remove('on');
  $('compBar').classList.remove('show'); $('diagBtn').classList.remove('show'); $('caseBtn').classList.remove('show');
  $('aiToggle').classList.remove('show'); $('sceneDots').classList.remove('show'); $('readyHint').classList.remove('show');

  renderScene(S.scene); const d=DATA[S.scene];
  setTimeout(()=>{
    $('scan').classList.remove('show'); S.aiState='ready';
    $('aid').className='aid ok'; $('aiTxt').textContent='AI 就绪';
    $('sceneTag').textContent=d.label; $('sceneTag').classList.add('show');

  },1800);
}
function hideAR(){
  $('gridOl').classList.remove('show'); $('frameCurr').classList.remove('show'); $('frameSug').classList.remove('show');

  $('readyHint').classList.remove('show');
}

/* ===== 评分 ===== */
function updScores(sc){
  if(!sc){ sc=DATA[S.scene].scores; }
  const cols={c:sc.c>=80?'#00D4AA':sc.c>=60?'#FFD166':'#FF6B35',l:sc.l>=80?'#00D4AA':sc.l>=60?'#FFD166':'#FF6B35',r:sc.r>=80?'#00D4AA':sc.r>=60?'#FFD166':'#FF6B35',f:sc.f>=80?'#00D4AA':sc.f>=60?'#FFD166':'#FF6B35',v:sc.v>=80?'#00D4AA':sc.v>=60?'#FFD166':'#FF6B35'};
  const avg=Math.round((sc.c+sc.l+sc.r+sc.f+sc.v)/5), ac=avg>=80?'#00D4AA':avg>=60?'#FFD166':'#FF6B35';
  $('ssvC').textContent=sc.c; $('ssvC').style.color=cols.c;
  $('ssvL').textContent=sc.l; $('ssvL').style.color=cols.l;
  $('ssvR').textContent=sc.r; $('ssvR').style.color=cols.r;
  $('ssvF').textContent=sc.f; $('ssvF').style.color=cols.f;
  $('ssvV').textContent=sc.v; $('ssvV').style.color=cols.v;
  $('sstTotal').textContent=avg; $('sstTotal').style.color=ac;
  $('sdBarC').style.width=sc.c+'%'; $('sdBarC').style.background=cols.c; $('sdValC').textContent=sc.c; $('sdValC').style.color=cols.c;
  $('sdBarL').style.width=sc.l+'%'; $('sdBarL').style.background=cols.l; $('sdValL').textContent=sc.l; $('sdValL').style.color=cols.l;
  $('sdBarR').style.width=sc.r+'%'; $('sdBarR').style.background=cols.r; $('sdValR').textContent=sc.r; $('sdValR').style.color=cols.r;
  $('sdBarF').style.width=sc.f+'%'; $('sdBarF').style.background=cols.f; $('sdValF').textContent=sc.f; $('sdValF').style.color=cols.f;
  $('sdBarV').style.width=sc.v+'%'; $('sdBarV').style.background=cols.v; $('sdValV').textContent=sc.v; $('sdValV').style.color=cols.v;
  $('sdTotal').textContent=avg; $('sdTotal').style.color=ac;
}
function togScoreDetail(){ $('scoreDetail').classList.toggle('on'); }

/* ===== 引导（精简+分情况） ===== */
function showGuides(){
  const d=DATA[S.scene];
  if(!d.hasComp || d.scores.c<50){
    $('frameCurr').classList.add('show'); $('frameSug').classList.add('show'); $('connArrow').classList.add('show'); $('compOk').classList.remove('show');
  } else if(d.scores.c>=80){
    $('frameCurr').classList.remove('show'); $('frameSug').classList.remove('show'); $('connArrow').classList.remove('show'); $('compOk').classList.add('show');
  } else {
    $('frameCurr').classList.add('show'); $('frameSug').classList.add('show'); $('connArrow').classList.add('show'); $('compOk').classList.remove('show');
  }
  if(d.scores.l<80) $('faceHint').classList.add('show');
  if(d.framingAction==='closer'){ $('framingHint').classList.add('show'); $('frText').textContent='靠近一点，拍半身特写'; }
  else if(d.framingAction==='farther'){ $('framingHint').classList.add('show'); $('frText').textContent='后退两步，拍全身照'; }
  else if(d.framingAction==='ok'){ $('framingHint').classList.remove('show'); }
}

/* ===== 构图条 ===== */
function renderCompBar(){
  const d=DATA[S.scene], bar=$('compBar');
  if(S.userMode==='beginner'){
    bar.innerHTML=d.comps.map(cid=>{ const c=COMP_MODES[cid]; return `<button class="comp-pill ${cid===d.rec?'on':''}" data-c="${cid}" onclick="selComp('${cid}')">${cid===d.rec?'<span class="cp-rec">推荐</span>':''}${c.name}</button>`; }).join('');
  } else {
    const c=COMP_MODES[d.rec];
    bar.innerHTML=`<button class="comp-pill on" data-c="${d.rec}" onclick="selComp('${d.rec}')"><span class="cp-rec">推荐</span>${c.name}</button><button class="comp-more" onclick="showAllComp()">+</button>`;
  }
}
function showAllComp(){
  const d=DATA[S.scene];
  $('compBar').innerHTML=d.comps.map(cid=>{ const c=COMP_MODES[cid]; return `<button class="comp-pill ${cid===S.selComp?'on':''}" data-c="${cid}" onclick="selComp('${cid}')">${cid===d.rec?'<span class="cp-rec">推荐</span>':''}${c.name}</button>`; }).join('');
}

/* ===== 选择构图：建议位置框随之变化 ===== */
function selComp(cid){
  S.selComp=cid;
  document.querySelectorAll('.comp-pill').forEach(b=>b.classList.toggle('on',b.dataset.c===cid));
  const d=DATA[S.scene], mode=COMP_MODES[cid];

  // 更新建议位置框位置和大小
  const sug=$('frameSug');
  sug.style.top=mode.pos.top; sug.style.left=mode.pos.left;
  sug.style.width=mode.pos.width; sug.style.height=mode.pos.height;

  // 更新箭头位置
  const arr=$('connArrow');
  arr.style.top=mode.arrow.top; arr.style.left=mode.arrow.left;

  // 更新标签文字
  sug.querySelector('.fs-tag').textContent=mode.name;

  // 评分更新
  const tip=d.tips.find(t=>(cid==='thirds'||cid==='lead')&&t.type==='comp');
  if(tip&&tip.scores) updScores(tip.scores);
  else if(cid==='thirds'||cid==='diagonal'||cid==='frame') updScores({c:95,l:d.scores.l,r:d.scores.r,f:d.scores.f,v:d.scores.v});
  else updScores({c:70,l:d.scores.l,r:d.scores.r,f:d.scores.f,v:d.scores.v});

  if(cid===d.rec){
    $('readyHint').classList.add('show');
    $('frameCurr').classList.remove('show'); $('frameSug').classList.remove('show'); $('connArrow').classList.remove('show');
    if(d.scores.l>=80) $('faceHint').classList.remove('show');
    $('compOk').classList.add('show');
  } else {
    $('readyHint').classList.remove('show'); $('compOk').classList.remove('show');
    $('frameCurr').classList.add('show'); $('frameSug').classList.add('show'); $('connArrow').classList.add('show');
  }
  toast(`已切换至「${mode.name}」构图`);
}

}

/* ===== 场景切换 ===== */
function swScene(id){ document.querySelectorAll('.scene-dot').forEach(d=>d.classList.remove('on')); document.querySelector(`.scene-dot[data-scene="${id}"]`).classList.add('on'); S.scene=id; startAI(); }

/* ===== 模式切换 ===== */
function swMode(mode,btn){ document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); if(mode==='ai'){S.ai=true;startAI();toast('AI 实时引导已开启');}else{S.ai=false;hideAR();$('aiInd').classList.remove('show');$('sceneTag').classList.remove('show');$('compBar').classList.remove('show');$('diagBtn').classList.remove('show');$('caseBtn').classList.remove('show');$('readyHint').classList.remove('show');toast(btn.textContent+'模式');} }
function togAI(){ S.ai=!S.ai; $('aiToggle').classList.toggle('off',!S.ai); if(S.ai){startAI();toast('AI 引导已开启');}else{hideAR();$('aiInd').classList.remove('show');$('sceneTag').classList.remove('show');$('compBar').classList.remove('show');$('diagBtn').classList.remove('show');$('caseBtn').classList.remove('show');$('readyHint').classList.remove('show');toast('AI 引导已关闭');} }

/* ===== 拍照 ===== */
function takePhoto(){ $('flash').classList.add('fire'); setTimeout(()=>$('flash').classList.remove('fire'),400); setTimeout(()=>showRes(),500); }
function showRes(){ const d=DATA[S.scene]; $('rsNum').textContent=d.final; if(d.img){$('rImg').innerHTML=`<img src="${d.img}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"/><div class="r-sc"><div class="rs-n">${d.final}</div><div class="rs-l">AI 评分</div></div>`;} else {$('rImg').innerHTML=`<div class="ph">📸</div><div class="r-sc"><div class="rs-n">${d.final}</div><div class="rs-l">AI 评分</div></div>`;} $('rTags').innerHTML=d.tags.map(t=>`<span>${t}</span>`).join(''); $('rAnalysis').innerHTML=`<div class="ra-h">AI 分析报告</div>`+d.analysis.map(a=>`<div class="ra-item"><div class="ra-ic" style="background:${a.bg}">${a.ic}</div><div class="ra-b"><div class="ra-n">${a.n}</div><div class="ra-d">${a.d}</div></div><div class="ra-s">${a.sc}</div></div>`).join(''); S.photos.unshift({scene:S.scene,score:d.final}); $('result').classList.add('on'); }
function closeRes(){ $('result').classList.remove('on'); }
function saveP(){ toast('照片已保存'); const b=event.target; b.textContent='已保存'; setTimeout(()=>b.textContent='保存',2000); }

/* ===== 相册 ===== */
function openGal(){ renderGal(); $('gallery').classList.add('on'); }
function closeGal(){ $('gallery').classList.remove('on'); }
function renderGal(){ $('gCount').textContent=S.photos.length+' 张照片'; if(S.photos.length===0){$('gGrid').innerHTML='<div class="g-empty">还没有照片<br>去拍一张吧</div>';return;} const bg={photo1:'url(\''+IMG1+'\')',photo2:'url(\''+IMG2+'\')',sunset:'linear-gradient(135deg,#1a3a5c,#4a7fa5,#e8a87c)',citynight:'linear-gradient(135deg,#0a0a1a,#1a1a35,#2a2040)'}; $('gGrid').innerHTML=S.photos.map(p=>`<div class="gi"><div class="gi-bg" style="background:${bg[p.scene]};background-size:cover;background-position:center"></div><div class="gi-sc">${p.score}</div></div>`).join(''); }

function toast(msg){ const e=$('toast'); e.textContent=msg; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2200); }

/* 点击引导打开详细面板 */
$('faceHint').addEventListener('click',()=>{const d=DATA[S.scene];const t=d.tips.find(x=>x.type==='light');if(t)openDetail(d.tips.indexOf(t));});
$('framingHint').addEventListener('click',()=>{const d=DATA[S.scene];const t=d.tips.find(x=>x.type==='framing');if(t)openDetail(d.tips.indexOf(t));});
</script>
</body>
</html>
