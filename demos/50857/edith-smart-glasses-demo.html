<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EDITH | AI 智能眼镜交互原型</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

    :root {
      --bg: #0a0a0f;
      --ink: #e0e8ff;
      --muted: #5a6a8a;
      --accent: #00d4ff;
      --accent2: #ff3a6e;
      --rule: rgba(0, 212, 255, 0.15);
      --glow: rgba(0, 212, 255, 0.4);
      --danger: #ff3a6e;
      --success: #00ff88;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Noto Sans SC', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Boot Screen */
    .boot-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s, visibility 0.8s;
    }
    .boot-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .boot-logo {
      font-family: 'Orbitron', monospace;
      font-size: clamp(36px, 8vw, 72px);
      font-weight: 900;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-shadow: 0 0 30px var(--glow), 0 0 60px var(--glow);
      animation: bootPulse 2s ease-in-out infinite;
    }
    .boot-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      margin-top: 16px;
      letter-spacing: 0.3em;
    }
    .boot-bar {
      width: 200px;
      height: 2px;
      background: var(--rule);
      margin-top: 32px;
      border-radius: 1px;
      overflow: hidden;
    }
    .boot-bar-inner {
      height: 100%;
      width: 0;
      background: var(--accent);
      animation: bootLoad 2.5s ease-out forwards;
    }
    .boot-msg {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      margin-top: 12px;
      opacity: 0;
      animation: fadeIn 0.5s 2s forwards;
    }
    @keyframes bootPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    @keyframes bootLoad {
      to { width: 100%; }
    }
    @keyframes fadeIn { to { opacity: 1; } }

    /* Camera View */
    .camera-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
    .camera-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .camera-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0a1a, #0f1528);
      font-size: 14px;
      color: var(--muted);
      flex-direction: column;
      gap: 12px;
    }
    .camera-fallback button {
      padding: 12px 28px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }
    .camera-fallback button:hover { opacity: 0.85; }

    /* HUD Overlay */
    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    /* Corner Brackets */
    .corner {
      position: absolute;
      width: 60px;
      height: 60px;
      border-color: var(--accent);
      border-style: solid;
      border-width: 0;
      opacity: 0.7;
    }
    .corner-tl { top: 20px; left: 20px; border-top-width: 2px; border-left-width: 2px; }
    .corner-tr { top: 20px; right: 20px; border-top-width: 2px; border-right-width: 2px; }
    .corner-bl { bottom: 20px; left: 20px; border-bottom-width: 2px; border-left-width: 2px; }
    .corner-br { bottom: 20px; right: 20px; border-bottom-width: 2px; border-right-width: 2px; }

    /* Top Bar */
    .top-bar {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 24px;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.1em;
      opacity: 0.8;
    }
    .top-bar .logo {
      font-size: 16px;
      font-weight: 700;
      text-shadow: 0 0 10px var(--glow);
    }
    .top-bar .sep {
      width: 1px;
      height: 16px;
      background: var(--accent);
      opacity: 0.3;
    }
    .top-bar .status {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-bar .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.3} }

    /* Scan Line */
    .scan-line {
      position: absolute;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.3;
      animation: scanMove 4s linear infinite;
    }
    @keyframes scanMove {
      0% { top: 15%; }
      100% { top: 85%; }
    }

    /* Scan Grid */
    .scan-grid {
      position: absolute;
      inset: 8%;
      border: 1px solid var(--rule);
      opacity: 0;
      transition: opacity 0.5s;
    }
    .scan-grid.active {
      opacity: 1;
      animation: gridPulse 0.6s ease-out;
    }
    @keyframes gridPulse {
      0% { opacity: 0; transform: scale(0.98); }
      50% { opacity: 0.6; }
      100% { opacity: 0.15; transform: scale(1); }
    }

    /* Target Box */
    .target-box {
      position: absolute;
      border: 1px solid var(--accent);
      opacity: 0;
      transition: all 0.4s;
      pointer-events: auto;
      cursor: crosshair;
    }
    .target-box.active {
      opacity: 0.8;
      animation: targetAppear 0.5s ease-out;
    }
    @keyframes targetAppear {
      0% { opacity: 0; transform: scale(1.1); }
      100% { opacity: 0.8; transform: scale(1); }
    }
    .target-label {
      position: absolute;
      top: -22px;
      left: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--accent);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .target-label .confidence {
      color: var(--success);
      font-size: 9px;
    }
    .target-detail {
      position: absolute;
      bottom: -20px;
      left: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--muted);
      white-space: nowrap;
    }
    /* Corner ticks on target */
    .target-box::before, .target-box::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--accent);
      border-style: solid;
      border-width: 0;
    }
    .target-box::before {
      top: -1px; left: -1px;
      border-top-width: 2px; border-left-width: 2px;
    }
    .target-box::after {
      bottom: -1px; right: -1px;
      border-bottom-width: 2px; border-right-width: 2px;
    }
    .target-corner-tr, .target-corner-bl {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--accent);
      border-style: solid;
      border-width: 0;
    }
    .target-corner-tr {
      top: -1px; right: -1px;
      border-top-width: 2px; border-right-width: 2px;
    }
    .target-corner-bl {
      bottom: -1px; left: -1px;
      border-bottom-width: 2px; border-left-width: 2px;
    }

    /* Left Panel */
    .panel-left {
      position: absolute;
      top: 50%;
      left: 24px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hud-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--rule);
      border-radius: 10px;
      background: rgba(10, 10, 15, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.3s;
      color: var(--muted);
    }
    .hud-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px var(--glow);
    }
    .hud-btn.active {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Right Panel - Data Readout */
    .panel-right {
      position: absolute;
      top: 50%;
      right: 24px;
      transform: translateY(-50%);
      width: 180px;
      background: rgba(10, 10, 15, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    .panel-right.hidden { opacity: 0; }
    .panel-right h3 {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 0.15em;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--rule);
    }
    .data-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: var(--muted);
    }
    .data-row .val {
      color: var(--ink);
    }
    .data-row .val.danger { color: var(--danger); }
    .data-row .val.success { color: var(--success); }

    /* Bottom Bar */
    .bottom-bar {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .mode-chip {
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      padding: 6px 14px;
      border: 1px solid var(--rule);
      border-radius: 20px;
      background: rgba(10, 10, 15, 0.5);
      color: var(--muted);
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.3s;
    }
    .mode-chip:hover, .mode-chip.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0, 212, 255, 0.1);
    }

    /* Voice Wave */
    .voice-wave {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 3px;
      height: 30px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .voice-wave.active { opacity: 1; }
    .voice-wave span {
      display: block;
      width: 2px;
      background: var(--accent);
      border-radius: 1px;
      animation: waveBar 0.8s ease-in-out infinite;
    }
    @keyframes waveBar {
      0%, 100% { height: 4px; }
      50% { height: 24px; }
    }

    /* Notification Toast */
    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      background: rgba(10, 10, 15, 0.85);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 10px 24px;
      opacity: 0;
      transition: all 0.4s;
      z-index: 50;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Click ripple */
    .click-ripple {
      position: absolute;
      border: 1px solid var(--accent);
      border-radius: 50%;
      pointer-events: none;
      animation: rippleExpand 0.8s ease-out forwards;
    }
    @keyframes rippleExpand {
      0% { width: 0; height: 0; opacity: 1; }
      100% { width: 120px; height: 120px; opacity: 0; }
    }

    /* Info popup on click */
    .info-popup {
      position: absolute;
      width: 200px;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 14px;
      font-size: 11px;
      opacity: 0;
      transition: all 0.3s;
      transform: translateY(8px);
      pointer-events: none;
      z-index: 20;
    }
    .info-popup.show {
      opacity: 1;
      transform: translateY(0);
    }
    .info-popup .popup-title {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }
    .info-popup .popup-desc {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .info-popup .popup-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .info-popup .popup-tag {
      font-size: 9px;
      padding: 2px 8px;
      border: 1px solid var(--rule);
      border-radius: 10px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
  <!-- Boot Screen -->
  <div class="boot-screen" id="bootScreen">
    <div class="boot-logo">EDITH</div>
    <div class="boot-sub">EYE-D-INTELLIGENCE-TRANSMISSION-HELMET</div>
    <div class="boot-bar"><div class="boot-bar-inner"></div></div>
    <div class="boot-msg">INITIALIZING NEURAL INTERFACE...</div>
  </div>

  <!-- Camera -->
  <div class="camera-container" id="cameraContainer">
    <div class="camera-fallback" id="cameraFallback">
      <div style="font-size:48px;margin-bottom:8px">👓</div>
      <div>点击启用摄像头，体验 EDITH 智能眼镜</div>
      <button id="startBtn" onclick="startCamera()">启动摄像头</button>
    </div>
    <video id="cameraVideo" autoplay playsinline style="display:none"></video>
  </div>

  <!-- HUD Overlay -->
  <div class="hud" id="hud" style="display:none">
    <!-- Corners -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Top Bar -->
    <div class="top-bar">
      <span class="logo">EDITH</span>
      <span class="sep"></span>
      <span class="status"><span class="dot"></span> ONLINE</span>
      <span class="sep"></span>
      <span id="clockDisplay">00:00:00</span>
    </div>

    <!-- Scan Line -->
    <div class="scan-line"></div>

    <!-- Scan Grid -->
    <div class="scan-grid" id="scanGrid"></div>

    <!-- Target Boxes -->
    <div id="targetArea"></div>

    <!-- Left Panel -->
    <div class="panel-left">
      <div class="hud-btn active" id="btnScan" onclick="toggleScan()" title="扫描模式">🔍</div>
      <div class="hud-btn" id="btnFace" onclick="toggleFace()" title="人脸识别">👤</div>
      <div class="hud-btn" id="btnText" onclick="toggleOCR()" title="文字识别">📝</div>
      <div class="hud-btn" id="btnVoice" onclick="toggleVoice()" title="语音助手">🎤</div>
      <div class="hud-btn" id="btnData" onclick="toggleData()" title="数据面板">📊</div>
    </div>

    <!-- Right Panel -->
    <div class="panel-right hidden" id="panelRight">
      <h3>SCAN DATA</h3>
      <div class="data-row"><span>MODE</span><span class="val" id="dataMode">SCAN</span></div>
      <div class="data-row"><span>OBJECTS</span><span class="val success" id="dataObjects">0</span></div>
      <div class="data-row"><span>THREAT</span><span class="val success" id="dataThreat">LOW</span></div>
      <div class="data-row"><span>FPS</span><span class="val" id="dataFps">60</span></div>
      <div class="data-row"><span>LATENCY</span><span class="val" id="dataLatency">12ms</span></div>
      <div style="margin-top:12px;padding-top:8px;border-top:1px solid var(--rule);">
        <div class="data-row"><span>UPTIME</span><span class="val" id="dataUptime">0s</span></div>
        <div class="data-row"><span>BATTERY</span><span class="val success" id="dataBattery">87%</span></div>
        <div class="data-row"><span>SIGNAL</span><span class="val success">STRONG</span></div>
      </div>
    </div>

    <!-- Voice Wave -->
    <div class="voice-wave" id="voiceWave"></div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <div class="mode-chip active" id="modeScan">SCAN</div>
      <div class="mode-chip" id="modeFace">FACE ID</div>
      <div class="mode-chip" id="modeOCR">OCR</div>
      <div class="mode-chip" id="modeNav">NAV</div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // Boot sequence
    setTimeout(() => {
      document.getElementById('bootScreen').classList.add('hidden');
    }, 3000);

    // Camera
    let cameraActive = false;
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 1280, height: 720 } });
        const video = document.getElementById('cameraVideo');
        video.srcObject = stream;
        video.style.display = 'block';
        document.getElementById('cameraFallback').style.display = 'none';
        cameraActive = true;
        setTimeout(() => {
          document.getElementById('hud').style.display = 'block';
          showToast('EDITH 系统已启动');
        }, 300);
      } catch (e) {
        showToast('无法访问摄像头: ' + e.message);
      }
    }

    // Clock
    setInterval(() => {
      const now = new Date();
      document.getElementById('clockDisplay').textContent =
        now.toLocaleTimeString('en-US', { hour12: false });
      if (cameraActive) {
        const upSec = Math.floor((Date.now() - bootTime) / 1000);
        const el = document.getElementById('dataUptime');
        if (upSec < 60) el.textContent = upSec + 's';
        else el.textContent = Math.floor(upSec / 60) + 'm ' + (upSec % 60) + 's';
      }
    }, 1000);
    const bootTime = Date.now();

    // Toast
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // Mode switching
    let currentMode = 'SCAN';
    const modes = ['SCAN', 'FACE ID', 'OCR', 'NAV'];
    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
      document.getElementById('mode' + mode.replace(/\s/g, '')).classList.add('active');
      document.querySelectorAll('.panel-left .hud-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('dataMode').textContent = mode;
      showToast('模式切换: ' + mode);
      triggerScanGrid();
      // Regenerate targets
      setTimeout(generateTargets, 800);
    }

    function toggleScan() { setMode('SCAN'); }
    function toggleFace() { setMode('FACE ID'); }
    function toggleOCR() { setMode('OCR'); }
    function toggleVoice() {
      const w = document.getElementById('voiceWave');
      w.classList.toggle('active');
      if (w.classList.contains('active')) {
        showToast('语音助手已激活');
        setTimeout(() => { w.classList.remove('active'); showToast('识别完成: 未检测到语音指令'); }, 3000);
      }
    }
    function toggleData() {
      document.getElementById('panelRight').classList.toggle('hidden');
    }

    // Wire bottom chips
    document.getElementById('modeScan').onclick = () => setMode('SCAN');
    document.getElementById('modeFace').onclick = () => setMode('FACE ID');
    document.getElementById('modeOCR').onclick = () => setMode('OCR');
    document.getElementById('modeNav').onclick = () => setMode('NAV');

    // Scan grid animation
    function triggerScanGrid() {
      const grid = document.getElementById('scanGrid');
      grid.classList.remove('active');
      void grid.offsetWidth;
      grid.classList.add('active');
    }

    // Target generation
    const scanTargets = [
      { label: 'PERSON', detail: 'STANCE: NEUTRAL', w: 120, h: 200, confidence: 96 },
      { label: 'OBJECT', detail: 'CLASS: ELECTRONIC', w: 100, h: 80, confidence: 89 },
      { label: 'OBJECT', detail: 'CLASS: CONTAINER', w: 140, h: 90, confidence: 92 },
      { label: 'TEXT', detail: 'LANG: ZH-CN', w: 160, h: 40, confidence: 94 },
      { label: 'FACE', detail: 'MATCH: NONE', w: 80, h: 100, confidence: 97 },
    ];
    const faceTargets = [
      { label: 'FACE DETECTED', detail: 'EMOTION: NEUTRAL', w: 100, h: 130, confidence: 98 },
      { label: 'FACE DETECTED', detail: 'EMOTION: FOCUSED', w: 100, h: 130, confidence: 95 },
    ];
    const ocrTargets = [
      { label: 'TEXT BLOCK', detail: 'CHARS: 42', w: 180, h: 50, confidence: 91 },
      { label: 'TEXT BLOCK', detail: 'CHARS: 18', w: 120, h: 35, confidence: 94 },
      { label: 'TEXT BLOCK', detail: 'CHARS: 7', w: 80, h: 30, confidence: 97 },
    ];
    const navTargets = [
      { label: 'ROUTE', detail: 'ETA: 12 MIN', w: 100, h: 100, confidence: 88 },
      { label: 'LANDMARK', detail: 'DIST: 240M', w: 80, h: 80, confidence: 91 },
    ];

    function generateTargets() {
      const area = document.getElementById('targetArea');
      area.innerHTML = '';
      let targets;
      switch (currentMode) {
        case 'FACE ID': targets = faceTargets; break;
        case 'OCR': targets = ocrTargets; break;
        case 'NAV': targets = navTargets; break;
        default: targets = scanTargets;
      }
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      targets.forEach((t, i) => {
        setTimeout(() => {
          const box = document.createElement('div');
          box.className = 'target-box active';
          const x = Math.max(80, Math.random() * (vw - 300) + 100);
          const y = Math.max(80, Math.random() * (vh - 250) + 80);
          box.style.left = x + 'px';
          box.style.top = y + 'px';
          box.style.width = t.w + 'px';
          box.style.height = t.h + 'px';
          box.innerHTML = `
            <div class="target-label">${t.label} <span class="confidence">${t.confidence}%</span></div>
            <div class="target-detail">${t.detail}</div>
            <div class="target-corner-tr"></div>
            <div class="target-corner-bl"></div>
          `;
          area.appendChild(box);
          document.getElementById('dataObjects').textContent = i + 1;
        }, i * 600);
      });
    }

    // Click on HUD to create analysis popup
    document.getElementById('hud').addEventListener('click', function(e) {
      if (e.target.closest('.panel-left') || e.target.closest('.panel-right') || e.target.closest('.bottom-bar')) return;
      // Ripple
      const ripple = document.createElement('div');
      ripple.className = 'click-ripple';
      ripple.style.left = (e.clientX - 60) + 'px';
      ripple.style.top = (e.clientY - 60) + 'px';
      this.appendChild(ripple);
      setTimeout(() => ripple.remove(), 800);

      // Info popup
      removePopup();
      const popup = document.createElement('div');
      popup.className = 'info-popup';
      const px = Math.min(e.clientX + 15, window.innerWidth - 220);
      const py = Math.min(e.clientY - 80, window.innerHeight - 180);
      popup.style.left = px + 'px';
      popup.style.top = Math.max(60, py) + 'px';

      const items = [
        { title: 'ENVIRONMENT SCAN', desc: 'Temperature: 24.3°C | Humidity: 58% | Light: 420 lux', tags: ['INDOOR', 'STABLE'] },
        { title: 'OBJECT ANALYSIS', desc: 'Identified 3 objects in view. No anomalies detected.', tags: ['CLEAR', 'SAFE'] },
        { title: 'TEXT DETECTED', desc: 'Chinese Simplified. 67 characters recognized.', tags: ['ZH-CN', '97%'] },
      ];
      const item = items[Math.floor(Math.random() * items.length)];
      popup.innerHTML = `
        <div class="popup-title">${item.title}</div>
        <div class="popup-desc">${item.desc}</div>
        <div class="popup-tags">${item.tags.map(t => `<span class="popup-tag">${t}</span>`).join('')}</div>
      `;
      this.appendChild(popup);
      requestAnimationFrame(() => popup.classList.add('show'));
      setTimeout(removePopup, 3000);
    });

    function removePopup() {
      document.querySelectorAll('.info-popup').forEach(p => {
        p.classList.remove('show');
        setTimeout(() => p.remove(), 300);
      });
    }

    // Voice wave bars
    const voiceWaveEl = document.getElementById('voiceWave');
    for (let i = 0; i < 20; i++) {
      const bar = document.createElement('span');
      bar.style.animationDelay = (i * 0.06) + 's';
      bar.style.height = '4px';
      voiceWaveEl.appendChild(bar);
    }

    // FPS simulation
    setInterval(() => {
      if (!cameraActive) return;
      document.getElementById('dataFps').textContent = (58 + Math.floor(Math.random() * 4));
      document.getElementById('dataLatency').textContent = (10 + Math.floor(Math.random() * 8)) + 'ms';
    }, 2000);

    // Auto regenerate targets
    setInterval(() => {
      if (cameraActive) generateTargets();
    }, 6000);

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === '1') toggleScan();
      if (e.key === '2') toggleFace();
      if (e.key === '3') toggleOCR();
      if (e.key === '4') toggleVoice();
      if (e.key === '5') toggleData();
    });
  </script>
</body>
</html>
