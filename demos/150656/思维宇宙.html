<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>思维宇宙·思辨擂台</title>
<script>document.documentElement.setAttribute('data-theme','dark')</script>
<style>
/* ============ §0 设计令牌 & 基础重置 ============ */
:root{
  --bg:#05060f;--bg2:#0a0c1c;
  --card:rgba(20,22,42,.72);--card2:rgba(28,31,56,.85);
  --text:#eef0ff;--muted:#9aa0c0;
  --line:rgba(120,130,180,.22);
  --brand:#5b5bf0;--brand2:#8b5cf6;--brand3:#22c3a6;
  --accent:#ff8a4c;--danger:#ef4444;--gold:#f59e0b;
  --radius:18px;
  --shadow:0 14px 44px rgba(0,0,0,.5);
  --ease:cubic-bezier(.2,.7,.25,1);
  --p-weiwu:#22c3a6;--p-bian:#8b5cf6;--p-shi:#ff8a4c;--p-wen:#e85d9c;--p-kg:#ef4444;
  --p-su:#ff6b9d;--p-mo:#4dabf7;--p-lu:#ffd43b;
  --font:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  /* 兼容旧引用 */
  --r:18px;--r-sm:12px;--glass:var(--card);--glass-brd:var(--line);
  --text-dim:var(--muted);--sh-soft:var(--shadow);--sh-glow:0 0 40px rgba(91,91,240,.15);--q:.4s;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.card,.case-card,.wall-card,.kb-card,.choice-card,.step-card,
.debate-bubble,.debate-bubble-exam,.debate-thinking,
.report-attribution,.report-text,.wall-wrong-item,
.home-footer-inner,.home-nav-btn,.home-input-wrap,
.kb-back,.btn-secondary,.debate-exit{
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06);
  border-color:var(--line)
}
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;height:100%}
.screen{
  position:fixed;inset:0;display:flex;flex-direction:column;
  opacity:1;transition:opacity .5s var(--ease),transform .6s var(--ease);
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
}
.screen.is-hidden{opacity:0;transform:translateY(14px) scale(.99);pointer-events:none;visibility:hidden}
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-brd);
  border-radius:var(--r-sm);padding:10px 20px;font-size:14px;color:var(--text);
  opacity:0;transition:all .3s var(--ease);z-index:9999;pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--glass-brd);border-radius:3px}

/* ============ §1 入场动画：思维汇聚·黑洞跃迁 ============ */
#screen-entry{align-items:center;justify-content:center;background:radial-gradient(ellipse at center,var(--bg2) 0%,var(--bg) 72%)}
#introStars{position:absolute;inset:0;z-index:1;pointer-events:none}
.entry-core{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.singularity{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#b9a8ff 0%,#8b5cf6 35%,#5b5bf0 65%,#22c3a6 100%);box-shadow:0 0 70px rgba(139,92,246,.6),0 0 120px rgba(91,91,240,.25);animation:coreIn .9s var(--ease) .35s both;position:relative}
.singularity::before{content:'';position:absolute;inset:-16px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0%,rgba(139,92,246,.5) 20%,transparent 45%,rgba(34,195,166,.4) 70%,transparent 100%);animation:coreSpin 5s linear infinite;-webkit-mask:radial-gradient(circle,transparent 54%,#000 55%,#000 100%);mask:radial-gradient(circle,transparent 54%,#000 55%,#000 100%)}
.singularity::after{content:'';position:absolute;inset:-26px;border-radius:50%;border:1px dashed rgba(139,92,246,.28);animation:coreSpin 14s linear infinite reverse}
@keyframes coreIn{from{transform:scale(0) rotate(-120deg);opacity:0;filter:blur(8px)}to{transform:scale(1) rotate(0);opacity:1;filter:none}}
@keyframes coreSpin{to{transform:rotate(360deg)}}
.entry-title{font-size:40px;font-weight:800;letter-spacing:.1em;margin-top:30px;background:linear-gradient(100deg,#a78bfa 0%,#5b5bf0 45%,#22c3a6 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:0;animation:wordIn .7s var(--ease) .85s forwards}
@keyframes wordIn{from{opacity:0;transform:translateY(16px) scale(.92);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.entry-sub{font-size:14px;color:var(--muted);letter-spacing:.45em;margin-top:8px;padding-left:.45em;opacity:0;animation:introUp .5s var(--ease) 1.15s forwards}
@keyframes introUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes introJump{to{opacity:0;transform:scale(1.15);visibility:hidden}}
#screen-home.intro-in{animation:homeIn .5s var(--ease) forwards}
@keyframes homeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.entry-skip{position:absolute;bottom:32px;right:32px;z-index:3;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--radius);padding:8px 18px;font-size:13px;color:var(--muted);cursor:pointer;font-family:var(--font);opacity:0;animation:introUp .5s var(--ease) 1s forwards;transition:color .25s,border-color .25s}
.entry-skip:hover{color:var(--text);border-color:var(--brand)}
@media(max-width:640px){.singularity{width:72px;height:72px}.entry-title{font-size:30px}}

/* ============ §2 首页+换一换 ============ */
#screen-home{padding:0;max-width:920px;margin:0 auto;width:100%}
.home-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 24px;position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg,var(--bg) 55%,transparent)
}
.home-nav-left{display:flex;align-items:center;gap:10px}
.home-nav-logo{
  font-size:20px;font-weight:800;letter-spacing:.04em;
  background:linear-gradient(120deg,var(--brand2),var(--brand),var(--brand3));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent
}
.home-nav-btn{
  background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 16px;font-size:13px;font-weight:500;color:var(--muted);
  cursor:pointer;font-family:var(--font);transition:all .25s var(--ease)
}
.home-nav-btn:hover{color:var(--text);border-color:var(--brand);box-shadow:0 4px 18px rgba(91,91,240,.15)}
.home-nav-right{display:flex;gap:8px}

.home-body{padding:0 24px 100px;flex:1}
.home-hero{text-align:center;padding:28px 0 12px}
.home-hero-title{
  font-size:28px;font-weight:800;letter-spacing:.04em;
  background:linear-gradient(90deg,#a78bfa,#5b5bf0,#22c3a6);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.home-hero-sub{font-size:13px;color:var(--muted);margin-top:6px}

/* 输入区 */
.home-input-section{margin-bottom:28px}
.home-tabs{display:flex;gap:0;margin-bottom:0;position:relative}
.home-tab{
  background:none;border:none;border-bottom:2px solid transparent;
  padding:10px 18px;font-size:13px;color:var(--muted);cursor:pointer;
  font-family:var(--font);transition:all .25s var(--ease)
}
.home-tab.active{color:var(--text);border-bottom-color:var(--brand)}
.home-tab:hover{color:var(--text)}
.home-input-wrap{
  background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:0 var(--radius) var(--radius) var(--radius);
  padding:16px;display:flex;flex-direction:column;gap:12px;
  box-shadow:var(--shadow)
}
.home-input{
  background:rgba(128,128,160,.08);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 16px;font-size:14px;color:var(--text);font-family:var(--font);
  width:100%;outline:none;transition:border-color .25s,background .25s
}
.home-input:focus{border-color:var(--brand);background:rgba(128,128,160,.12)}
.home-input::placeholder{color:var(--muted);opacity:.55}
.home-textarea{min-height:64px;max-height:120px;resize:none;line-height:1.5}
.home-input-go{
  align-self:flex-start;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  border:none;border-radius:var(--radius);padding:9px 22px;font-size:13px;font-weight:600;color:#fff;
  cursor:pointer;font-family:var(--font);transition:transform .2s,box-shadow .3s;
  box-shadow:0 4px 16px rgba(91,91,240,.25)
}
.home-input-go:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(91,91,240,.35)}
.home-input-hint{font-size:11px;color:var(--muted);opacity:.7}

/* 示例案例胶囊 */
.home-examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.home-examples::before{content:'示例 ›';font-size:11px;color:var(--muted);opacity:.55;margin-right:2px;letter-spacing:.02em}
.home-example-pill{
  background:linear-gradient(135deg,rgba(91,91,240,.08),rgba(139,92,246,.06));border:1px solid rgba(91,91,240,.22);border-radius:20px;
  padding:6px 14px;font-size:12px;font-weight:500;color:var(--brand2);cursor:pointer;
  font-family:var(--font);transition:all .25s var(--ease);white-space:nowrap
}
.home-example-pill:hover{background:linear-gradient(135deg,rgba(91,91,240,.18),rgba(139,92,246,.14));border-color:var(--brand);color:var(--text);transform:translateY(-2px);box-shadow:0 4px 16px rgba(91,91,240,.2)}
.home-example-pill:active{transform:scale(.96)}

/* 筛选 + 换一换 */
.home-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.home-filters{display:flex;gap:6px;flex-wrap:wrap}
.home-filter{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:6px 15px;font-size:12px;color:var(--muted);cursor:pointer;
  font-family:var(--font);transition:all .25s var(--ease)
}
.home-filter.active{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;box-shadow:0 3px 14px rgba(91,91,240,.25)}
.home-filter:hover:not(.active){color:var(--text);border-color:var(--brand)}
.home-shuffle{
  display:flex;align-items:center;gap:6px;
  background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:7px 18px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;
  font-family:var(--font);transition:all .25s var(--ease)
}
.home-shuffle:hover{border-color:var(--brand2);color:var(--brand2);box-shadow:0 4px 18px rgba(139,92,246,.15)}
.home-shuffle:active{transform:scale(.96)}

/* 案例卡 */
#case-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.case-card{
  background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease);
  animation:card-enter .5s var(--ease) backwards;
  box-shadow:var(--shadow)
}
@keyframes card-enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.case-card:hover{transform:translateY(-4px);border-color:var(--brand);box-shadow:0 16px 50px rgba(91,91,240,.18)}
.case-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--brand),var(--brand2));opacity:0;transition:opacity .3s
}
.case-card:hover::before{opacity:1}
.case-card-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.case-tag{
  font-size:10px;padding:3px 9px;border-radius:10px;font-weight:600;white-space:nowrap;
  background:rgba(91,91,240,.12);color:var(--brand2)
}
.case-tag.lit{background:rgba(255,107,157,.12);color:var(--p-su)}
.case-section{font-size:11px;color:var(--muted)}
.case-personas{display:flex;gap:6px;margin-left:auto}
.case-persona-dot{
  width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;
  box-shadow:0 0 10px currentColor,0 0 4px currentColor;position:relative
}
.case-persona-dot::after{
  content:'';position:absolute;inset:-3px;border-radius:50%;border:1px solid currentColor;opacity:.35
}
.case-stem{font-size:14px;line-height:1.65;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 底部战绩条 */
.home-footer{
  position:fixed;bottom:0;left:0;right:0;z-index:5;
  background:linear-gradient(0deg,var(--bg) 42%,transparent);
  padding:14px 24px;max-width:920px;margin:0 auto
}
.home-footer-inner{
  display:flex;align-items:center;justify-content:center;gap:14px;
  background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 18px;font-size:12px;box-shadow:var(--shadow)
}
.home-footer-item{display:flex;align-items:center;gap:5px;color:var(--muted);font-weight:400}
.home-footer-val{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.home-footer-rank{color:var(--brand2);font-weight:700}
.home-footer-sep{width:1px;height:14px;background:var(--line)}

@media(max-width:640px){
  #case-list{grid-template-columns:1fr}
  .home-body{padding:0 16px 90px}
  .home-nav{padding:14px 16px}
  .home-nav-logo{font-size:17px}
  .home-footer-inner{gap:8px;font-size:11px;padding:7px 14px}
  .home-footer-sep{display:none}
  .home-tab{padding:8px 14px;font-size:12px}
  .home-footer{padding:10px 16px}
}

/* ============ §3 加载模拟 ============ */
#screen-loader{
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,var(--bg2) 0%,var(--bg) 72%)
}
.loader-center{display:flex;flex-direction:column;align-items:center;width:100%;max-width:480px;padding:0 24px}
.loader-title{
  font-size:16px;font-weight:600;color:var(--text);letter-spacing:.05em;
  margin-bottom:6px;text-align:center
}
.loader-title .loader-title-accent{color:var(--brand2)}
.loader-sub{font-size:12px;color:var(--text-dim);margin-bottom:28px}

.loader-bar-wrap{
  width:100%;height:5px;background:var(--line);border-radius:3px;
  overflow:hidden;margin-bottom:20px
}
.loader-bar-fill{
  height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,var(--brand),var(--brand2),var(--brand3));
  transition:width .5s var(--ease);
  box-shadow:0 0 12px rgba(91,91,240,.4)
}

.loader-stages{width:100%;margin-bottom:24px}
.loader-stage{
  display:flex;align-items:center;gap:10px;padding:6px 0;
  font-size:13px;color:var(--text-dim);opacity:.35;
  transition:opacity .4s var(--ease),color .4s var(--ease)
}
.loader-stage.active{opacity:1;color:var(--text)}
.loader-stage.done{opacity:.7;color:var(--brand3)}
.loader-stage-icon{
  width:18px;height:18px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;border:1px solid var(--line);transition:all .3s
}
.loader-stage.active .loader-stage-icon{border-color:var(--brand2);background:rgba(139,92,246,.15)}
.loader-stage.done .loader-stage-icon{border-color:var(--brand3);background:var(--brand3);color:var(--bg)}

.loader-mentors{display:flex;gap:16px;margin-bottom:24px;min-height:90px;align-items:flex-end;justify-content:center}
.mentor-spawn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  opacity:0;transform:scale(.3) translateY(20px);
  transition:opacity .6s var(--ease),transform .6s var(--ease)
}
.mentor-spawn.show{opacity:1;transform:scale(1) translateY(0)}
.mentor-orb{
  width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:#fff;position:relative
}
.mentor-orb::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1.5px solid currentColor;opacity:.3;animation:mentor-ring 2s ease-in-out infinite
}
@keyframes mentor-ring{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.15);opacity:.1}}
.mentor-name{font-size:11px;color:var(--text-dim);white-space:nowrap}

.loader-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.loader-chip{
  display:flex;align-items:center;gap:5px;
  background:var(--glass);border:1px solid var(--glass-brd);border-radius:20px;
  padding:5px 12px;font-size:11px;color:var(--text-dim);
  opacity:0;transform:translateY(8px);
  transition:opacity .4s var(--ease),transform .4s var(--ease),border-color .3s,color .3s
}
.loader-chip.show{opacity:1;transform:translateY(0)}
.loader-chip.done{border-color:var(--brand3);color:var(--brand3)}
.loader-chip-mark{font-size:10px;opacity:0;transition:opacity .3s}
.loader-chip.done .loader-chip-mark{opacity:1}

@media(max-width:640px){
  .loader-title{font-size:14px}
  .mentor-orb{width:40px;height:40px;font-size:15px}
  .mentor-name{font-size:10px}
  .loader-chip{font-size:10px;padding:4px 10px}
}

/* ============ §4 导师行星+辩论引擎 ============ */
#screen-debate{
  flex-direction:column;align-items:center;justify-content:flex-start;
  padding:24px;max-width:920px;margin:0 auto;width:100%
}
/* 星座区 */
.constellation{
  display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:16px;width:100%;margin-bottom:16px;min-height:80px
}
.star-node{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  opacity:0;transform:scale(.3) translateY(15px);filter:blur(6px);
  transition:opacity .6s var(--ease),transform .6s var(--ease),filter .6s var(--ease),box-shadow .4s;
  position:relative
}
.star-node.entered{opacity:1;transform:scale(1) translateY(0);filter:none}
.star-node .star-sym{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:#fff;
  background:var(--star-color,var(--brand));
  box-shadow:0 0 12px var(--star-color,var(--brand)),0 0 4px var(--star-color,var(--brand));
  position:relative;transition:transform .3s var(--ease),box-shadow .3s var(--ease)
}
.star-node .star-sym::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1px solid var(--star-color,var(--brand));opacity:.35
}
.star-node .star-name{
  font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap
}
.star-node.speaking .star-sym{
  transform:scale(1.2);
  box-shadow:0 0 20px var(--star-color,var(--brand)),0 0 8px var(--star-color,var(--brand)),0 0 40px var(--star-color,var(--brand));
  animation:starPulse 1.6s ease-in-out infinite
}
.star-node.speaking .star-name{color:var(--text)}
@keyframes starPulse{0%,100%{transform:scale(1.2)}50%{transform:scale(1.3)}}

/* 退出按钮 */
.debate-exit{
  position:absolute;top:16px;right:16px;
  width:32px;height:32px;border-radius:50%;
  background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);color:var(--muted);font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .25s var(--ease);z-index:10
}
.debate-exit:hover{color:var(--text);border-color:var(--brand)}

/* 对话流 */
#debate-log{
  width:100%;max-width:720px;display:flex;flex-direction:column;gap:10px;
  flex:1;overflow-y:auto;padding:4px 0
}
.debate-bubble{
  max-width:85%;padding:12px 16px;border-radius:var(--radius);
  font-size:14px;line-height:1.65;word-break:break-word;
  animation:bubbleIn .4s var(--ease)
}
@keyframes bubbleIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.debate-bubble.left{align-self:flex-start;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);
  border-left:3px solid var(--bubble-color,var(--brand));box-shadow:var(--shadow)}
.debate-bubble.right{align-self:flex-end;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);
  border-right:3px solid var(--bubble-color,var(--brand2));box-shadow:var(--shadow)}
.debate-bubble-who{font-size:11px;font-weight:600;color:var(--bubble-color,var(--brand2));margin-bottom:4px}
.debate-bubble-exam{align-self:center;background:rgba(239,68,68,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(239,68,68,.2);
  border-radius:var(--radius);text-align:center;box-shadow:var(--shadow)}
.debate-bubble-exam .debate-bubble-who{color:var(--danger)}

/* 思考态气泡 */
.debate-thinking{
  align-self:center;display:flex;gap:4px;padding:8px 14px;
  background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)
}
.debate-thinking span{width:6px;height:6px;border-radius:50%;background:var(--muted);
  animation:thinkDot 1.2s ease-in-out infinite}
.debate-thinking span:nth-child(2){animation-delay:.2s}
.debate-thinking span:nth-child(3){animation-delay:.4s}
@keyframes thinkDot{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}

/* 底部进度 */
.debate-footer{
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:12px;font-size:12px;color:var(--muted)
}
.debate-progress{display:flex;gap:6px}
.debate-progress-dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .3s}
.debate-progress-dot.done{background:var(--brand3)}
.debate-progress-dot.current{background:var(--brand2);box-shadow:0 0 8px var(--brand2)}
.debate-tap-hint{font-size:11px;color:var(--muted);opacity:.5;animation:hintPulse 2s ease-in-out infinite}
@keyframes hintPulse{0%,100%{opacity:.3}50%{opacity:.7}}

/* 打字机光标 */
.type-cursor{display:inline-block;width:2px;height:14px;background:var(--brand2);
  vertical-align:text-bottom;animation:cursorBlink .8s steps(2) infinite}
@keyframes cursorBlink{0%,50%{opacity:1}51%,100%{opacity:0}}

@media(max-width:640px){
  .constellation{gap:10px;min-height:60px}
  .star-node .star-sym{width:36px;height:36px;font-size:15px}
  .star-node .star-name{font-size:11px}
  .debate-bubble{font-size:13px;max-width:92%}
}

/* ============ §5 质询+参战+黑洞 ============ */
#screen-challenge{flex-direction:column;align-items:center;justify-content:center;padding:24px;max-width:920px;margin:0 auto;width:100%;position:relative}

/* 质询节拍 */
#phase-query{text-align:center;max-width:600px;animation:phaseIn .4s var(--ease)}
@keyframes phaseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.query-examiner{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px}
.query-examiner-orb{width:48px;height:48px;border-radius:50%;background:var(--danger);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:0 0 20px rgba(239,68,68,.4);animation:planetPulse 2s ease-in-out infinite}
.query-examiner-name{font-size:14px;font-weight:600;color:var(--danger)}
.query-text{font-size:18px;line-height:1.7;color:var(--text);margin-bottom:10px;font-weight:500}
.query-follow{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:28px}
.query-go-btn{
  background:linear-gradient(135deg,var(--brand),var(--brand2));border:none;border-radius:var(--radius);
  padding:12px 32px;font-size:15px;font-weight:600;color:#fff;cursor:pointer;font-family:var(--font);
  transition:transform .2s,box-shadow .3s;box-shadow:0 4px 20px rgba(91,91,240,.3)
}
.query-go-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(91,91,240,.4)}

/* 参战节拍 */
#phase-battle{display:none;flex-direction:column;align-items:center;width:100%;animation:phaseIn .4s var(--ease)}
#phase-battle.show{display:flex}
.battle-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:24px;text-align:center}
.battle-choices{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;position:relative;width:100%;min-height:200px;align-items:center}
.choice-card{
  background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;
  width:220px;min-height:120px;display:flex;flex-direction:column;gap:10px;
  position:relative;transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;
  box-shadow:var(--shadow);animation:choiceIn .5s var(--ease) backwards
}
@keyframes choiceIn{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
.choice-card:hover{transform:translateY(-4px);border-color:var(--brand);box-shadow:0 12px 40px rgba(91,91,240,.2)}
.choice-card:active{transform:scale(.97)}
.choice-num{
  width:28px;height:28px;border-radius:50%;background:var(--line);display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text)
}
.choice-label{font-size:14px;line-height:1.65;color:var(--text);flex:1}

/* 黑洞吸入 */
.blackhole-center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:0;height:0;border-radius:50%;z-index:20;pointer-events:none
}
.blackhole-center.active{
  width:80px;height:80px;
  background:radial-gradient(circle,#000 30%,rgba(139,92,246,.3) 60%,transparent 80%);
  animation:bhExpand .4s var(--ease)
}
.blackhole-center.active::before{
  content:'';position:absolute;inset:-20px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent,rgba(139,92,246,.4),transparent,rgba(34,195,166,.3),transparent);
  animation:coreSpin 3s linear infinite
}
@keyframes bhExpand{from{width:0;height:0;opacity:0}to{width:80px;height:80px;opacity:1}}
.choice-card.consuming{
  transform:translate(var(--dx,0),var(--dy,0)) scale(0) rotate(720deg);
  opacity:0;filter:blur(6px);
  transition:transform .8s cubic-bezier(.6,.04,.3,1),opacity .8s,filter .8s
}
.choice-card.locked{
  border-color:var(--lock-color,var(--brand3));border-width:2px;
  pointer-events:none;transform:scale(1.05);
  box-shadow:0 0 30px var(--lock-color,var(--brand3))
}
.choice-locked-info{
  text-align:center;margin-top:20px;font-size:14px;line-height:1.6;
  color:var(--lock-color,var(--brand3));opacity:0;transition:opacity .4s;
  max-width:500px
}
.choice-locked-info.show{opacity:1}

@media(max-width:640px){
  .battle-choices{flex-direction:column;gap:12px}
  .choice-card{width:100%;min-height:auto}
  .query-text{font-size:16px}
  .query-go-btn{padding:10px 24px;font-size:14px}
}

/* ============ §6 四步评分 ============ */
#screen-score{flex-direction:column;align-items:center;padding:24px;max-width:920px;margin:0 auto;width:100%}
.score-load{display:flex;align-items:center;gap:10px;margin-bottom:20px;color:var(--muted);font-size:14px}
.score-load-bar{width:120px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.score-load-bar-fill{height:100%;width:0;background:var(--danger);transition:width 1s var(--ease)}
.score-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:20px;text-align:center}
.score-steps{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:24px;width:100%}
.step-card{
  background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:var(--radius);padding:16px;width:200px;
  box-shadow:var(--shadow);
  opacity:0;transform:rotateY(90deg);
  transition:opacity .5s var(--ease),transform .5s var(--ease)
}
.step-card.show{opacity:1;transform:rotateY(0)}
.step-card.hit{border-color:var(--brand3);box-shadow:var(--shadow),0 0 16px rgba(34,195,166,.15)}
.step-card.miss{border-color:var(--danger);box-shadow:var(--shadow),0 0 16px rgba(239,68,68,.12)}
.step-card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.step-key{font-size:14px;font-weight:600;color:var(--brand2)}
.step-card.hit .step-key{color:var(--brand3)}
.step-card.miss .step-key{color:var(--danger)}
.step-mark{margin-left:auto;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.step-mark.hit{background:rgba(34,195,166,.15);color:var(--brand3)}
.step-mark.miss{background:rgba(239,68,68,.15);color:var(--danger)}
.step-point{font-size:13px;line-height:1.6;color:var(--muted)}
.grade-badge{
  font-size:48px;font-weight:800;border-radius:50%;width:80px;height:80px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
  background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:2px solid var(--line);
  opacity:0;transform:scale(.5);transition:opacity .6s var(--ease),transform .6s var(--ease),box-shadow .4s
}
.grade-badge.show{opacity:1;transform:scale(1)}
.grade-badge.S{border-color:var(--gold);color:var(--gold);box-shadow:0 0 30px rgba(245,158,11,.25),var(--shadow)}
.grade-badge.B{border-color:var(--brand3);color:var(--brand3);box-shadow:0 0 24px rgba(34,195,166,.2),var(--shadow)}
.grade-badge.C{border-color:var(--muted);color:var(--muted);box-shadow:var(--shadow)}
.grade-missed{font-size:13px;color:var(--accent);text-align:center;margin-bottom:16px;max-width:500px}
.score-actions{display:flex;gap:10px;justify-content:center}

/* ============ §7 思维链+战报 ============ */
#screen-report{flex-direction:column;align-items:center;padding:24px;max-width:920px;margin:0 auto;width:100%;overflow-y:auto}
.report-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:16px}
.report-attribution{
  background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 18px;margin-bottom:16px;max-width:600px;width:100%;cursor:pointer;
  transition:border-color .25s,box-shadow .25s;box-shadow:var(--shadow)
}
.report-attribution:hover{border-color:var(--brand2);box-shadow:0 4px 20px rgba(139,92,246,.15)}
.report-attribution-title{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:6px}
.report-attribution-desc{font-size:13px;line-height:1.6;color:var(--muted)}
.report-attribution-link{font-size:12px;color:var(--brand2);margin-top:8px}
.report-text{
  background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:16px;max-width:600px;width:100%;
  font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap;
  box-shadow:var(--shadow);max-height:300px;overflow-y:auto
}
.report-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ============ §8 战绩墙 ============ */
#screen-wall{flex-direction:column;padding:24px;max-width:920px;margin:0 auto;width:100%;overflow-y:auto}
.wall-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:20px;text-align:center}
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:20px}
.wall-card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.wall-card-title{font-size:13px;color:var(--muted);margin-bottom:10px}
.wall-rank-name{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--brand2),var(--brand3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.wall-score-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.wall-score-bar-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:3px;transition:width .8s var(--ease)}
.wall-score-text{font-size:12px;color:var(--muted)}
.wall-streak{display:flex;gap:16px;justify-content:center}
.wall-streak-item{text-align:center}
.wall-streak-val{font-size:24px;font-weight:700;color:var(--text)}
.wall-streak-label{font-size:11px;color:var(--muted)}
.wall-lost{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--danger);text-align:center;padding:10px;border-radius:var(--radius);font-size:13px;animation:planetPulse 2s ease-in-out infinite}
.wall-dist{display:flex;gap:10px;align-items:flex-end;height:120px;justify-content:center}
.wall-dist-bar{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;max-width:50px}
.wall-dist-fill{width:100%;border-radius:var(--radius) var(--radius) 0 0;transition:height .8s var(--ease);min-height:4px}
.wall-dist-fill.S{background:linear-gradient(180deg,#f59e0b,#fbbf24)}
.wall-dist-fill.B{background:linear-gradient(180deg,#22c3a6,#2dd4bf)}
.wall-dist-fill.C{background:linear-gradient(180deg,#64748b,#94a3b8)}
.wall-dist-label{font-size:12px;font-weight:600;color:var(--muted)}
.wall-dist-count{font-size:11px;color:var(--text)}
#wall-radar{display:block;margin:0 auto}
.wall-wrong-list{display:flex;flex-direction:column;gap:14px}
.wall-wrong-item{
  background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;
  cursor:pointer;transition:all .25s var(--ease);display:flex;align-items:center;gap:10px;
  animation:wrongFloat 4s ease-in-out infinite;box-shadow:var(--shadow)
}
@keyframes wrongFloat{0%,100%{transform:translateY(0) rotate(-.3deg)}50%{transform:translateY(-3px) rotate(.3deg)}}
.wall-wrong-item:hover{border-color:var(--brand);transform:translateY(-2px)}
.wall-wrong-section{font-size:11px;color:var(--accent);white-space:nowrap}
.wall-wrong-stem{font-size:13px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wall-wrong-type{font-size:10px;padding:2px 8px;border-radius:8px;background:rgba(239,68,68,.1);color:var(--danger);white-space:nowrap}
.wall-empty{text-align:center;color:var(--muted);padding:30px;font-size:14px}

/* ============ §知识库 ============ */
#screen-kb{flex-direction:column;padding:24px;max-width:920px;margin:0 auto;width:100%;overflow-y:auto}
.kb-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.kb-title{font-size:20px;font-weight:700;color:var(--text)}
.kb-back{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--radius);padding:8px 16px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .25s var(--ease)}
.kb-back:hover{color:var(--text);border-color:var(--brand);box-shadow:0 4px 18px rgba(91,91,240,.15)}
.kb-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.kb-section{margin-bottom:24px}
.kb-section-title{font-size:15px;font-weight:600;color:var(--brand2);margin-bottom:12px}
.kb-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.kb-card{
  background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;
  transition:all .25s var(--ease);box-shadow:var(--shadow)
}
.kb-card:hover{border-color:var(--brand);transform:translateY(-2px)}
.kb-card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px}
.kb-card-f{font-size:13px;line-height:1.6;color:var(--text);margin-bottom:8px}
.kb-card-e{font-size:12px;color:var(--accent);padding-top:8px;border-top:1px solid var(--line)}
.kb-card-q{font-size:13px;line-height:1.6;color:var(--text);font-style:italic;margin-bottom:6px}
.kb-card-a{font-size:12px;color:var(--muted)}

/* ============ §9 全局按钮 ============ */
.btn-primary{
  background:linear-gradient(135deg,var(--brand),var(--brand2));border:none;border-radius:var(--radius);
  padding:10px 22px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;font-family:var(--font);
  transition:transform .2s,box-shadow .3s;box-shadow:0 4px 16px rgba(91,91,240,.25)
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(91,91,240,.35)}
.btn-secondary{
  background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 22px;font-size:13px;color:var(--muted);cursor:pointer;font-family:var(--font);
  transition:all .25s var(--ease);box-shadow:var(--shadow)
}
.btn-secondary:hover{color:var(--text);border-color:var(--brand);transform:translateY(-2px);box-shadow:0 4px 20px rgba(91,91,240,.15)}

@media(max-width:640px){
  .score-steps{flex-direction:column;align-items:center}
  .step-card{width:100%;max-width:300px}
  .wall-grid{grid-template-columns:1fr}
  .kb-cards{grid-template-columns:1fr}
  .report-text{font-size:12px}
  #wall-radar{transform:scale(.8);transform-origin:center}
}
</style>
</head>
<body>
<canvas id="starfield" aria-hidden="true"></canvas>
<div id="app">
  <section id="screen-entry" class="screen">
    <canvas id="introStars"></canvas>
    <div class="entry-core">
      <div class="singularity"></div>
      <h1 class="entry-title">思维宇宙</h1>
      <p class="entry-sub">思辨擂台</p>
    </div>
    <button class="entry-skip" id="entry-skip-btn">跳过</button>
  </section>
  <section id="screen-home" class="screen is-hidden">
    <nav class="home-nav">
      <div class="home-nav-left">
        <span class="home-nav-logo">思维宇宙</span>
      </div>
      <div class="home-nav-right">
        <button class="home-nav-btn" id="nav-kb-btn">知识库</button>
        <button class="home-nav-btn" id="nav-wall-btn">战绩墙</button>
      </div>
    </nav>
    <div class="home-hero">
      <div class="home-hero-title">思辨擂台</div>
      <div class="home-hero-sub">选一道题，进入思维宇宙，与导师星座辩论对决</div>
    </div>
    <div class="home-body">
      <div class="home-input-section">
        <div class="home-tabs">
          <button class="home-tab active" data-tab="search">打字提问</button>
          <button class="home-tab" data-tab="paste">贴笔记</button>
        </div>
        <div class="home-input-wrap">
          <input class="home-input" id="home-search-input" type="text" placeholder="输入关键词，匹配思辨案例" autocomplete="off">
          <textarea class="home-input home-textarea" id="home-paste-input" placeholder="粘贴笔记片段，系统将匹配最贴合的案例" style="display:none"></textarea>
          <button class="home-input-go" id="home-input-go">匹配案例</button>
          <span class="home-input-hint">输入仅用于匹配已有案例，不会生成新内容</span>
        </div>
        <div class="home-examples" id="home-examples"></div>
      </div>
      <div class="home-toolbar">
        <div class="home-filters">
          <button class="home-filter active" data-filter="全部">全部</button>
          <button class="home-filter" data-filter="phil">哲学</button>
          <button class="home-filter" data-filter="lit">语文</button>
        </div>
        <button class="home-shuffle" id="home-shuffle-btn">🔀 换一换</button>
      </div>
      <div id="case-list"></div>
    </div>
    <div class="home-footer">
      <div class="home-footer-inner" id="home-footer-inner"></div>
    </div>
  </section>
  <section id="screen-loader" class="screen is-hidden">
    <div class="loader-center">
      <div class="loader-title"><span class="loader-title-accent">宇宙编排者</span>·正在生成本场对决</div>
      <div class="loader-sub">正在调集星灵、构建论证引擎…</div>
      <div class="loader-bar-wrap"><div class="loader-bar-fill" id="loader-bar-fill"></div></div>
      <div class="loader-stages" id="loader-stages"></div>
      <div class="loader-mentors" id="loader-mentors"></div>
      <div class="loader-chips" id="loader-chips"></div>
    </div>
  </section>
  <section id="screen-debate" class="screen is-hidden">
    <button class="debate-exit" id="debate-exit">✕</button>
    <div class="constellation" id="constellation"></div>
    <div id="debate-log"></div>
