<script>
/* ============ §0 核心命名空间 ============ */
const App=(function(){
  const raw=document.getElementById('data').textContent;
  const DATA=JSON.parse(raw);
  const M={};

  /* ---- Bus 事件总线 ---- */
  const Bus=(function(){
    const map={};
    return{
      on(t,fn){(map[t]=map[t]||[]).push(fn);return()=>this.off(t,fn)},
      once(t,fn){const w=(...a)=>{fn(...a);this.off(t,w)};return this.on(t,w)},
      emit(t,...a){(map[t]||[]).forEach(fn=>{try{fn(...a)}catch(e){console.warn('[Bus]',t,e)}})},
      off(t,fn){if(map[t])map[t]=map[t].filter(f=>f!==fn)}
    };
  })();

  /* ---- State 运行时状态 ---- */
  const State={
    screen:'entry',caseId:null,case:null,
    choice:null,grade:null,script:null,
    kbSection:'全部',kbTarget:null
  };

  /* ---- Store localStorage ---- */
  const STORE_KEY='thinkverse_arena';
  const DEFAULTS={
    v:1,
    profile:{rank:0,mindScore:0,streak:0,bestStreak:0,totalBattles:0,wins:0,lostStreak:0,lost:false},
    wrongBook:[],dist:{S:0,A:0,B:0,C:0},
    errorDist:{'概念混淆':0,'逻辑跳跃':0,'审题偏差':0,'立场摇摆':0,'知识盲区':0,'过度解读':0},
    achievements:[],recent:[],settings:{}
  };
  const Store=(function(){
    let data;
    try{data=JSON.parse(localStorage.getItem(STORE_KEY))||{}}catch(e){data={}}
    function merge(d,base){
      const r={};
      for(const k in base){
        if(typeof base[k]==='object'&&base[k]!==null&&!Array.isArray(base[k])){
          r[k]=merge(d[k]||{},base[k]);
        }else{
          r[k]=d[k]!==undefined?d[k]:Array.isArray(base[k])?[].concat(base[k]):base[k];
        }
      }
      return r;
    }
    data=merge(data,DEFAULTS);
    function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(data))}catch(e){console.warn('[Store] save failed',e)}}
    return{
      get data(){return data},
      load(){return data},
      save,
      patch(path,val){
        const keys=path.split('.');let o=data;
        for(let i=0;i<keys.length-1;i++){if(!o[keys[i]])o[keys[i]]={};o=o[keys[i]]}
        o[keys[keys.length-1]]=val;save();
      },
      reset(){data=JSON.parse(JSON.stringify(DEFAULTS));save()}
    };
  })();

  /* ---- Util 工具函数 ---- */
  const Util={
    delay(ms){return new Promise(r=>setTimeout(r,ms))},
    shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r},
    pick(a){return a[Math.floor(Math.random()*a.length)]},
    clamp(v,a,b){return Math.max(a,Math.min(b,v))},
    lerp(a,b,t){return a+(b-a)*t},
    escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')},
    debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}},
    copyText(text){
      if(navigator.clipboard&&navigator.clipboard.writeText){
        return navigator.clipboard.writeText(text).catch(()=>this._copyFallback(text));
      }
      return this._copyFallback(text);
    },
    _copyFallback(text){
      const ta=document.createElement('textarea');
      ta.value=text;ta.style.cssText='position:fixed;opacity:0';
      document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy')}catch(e){}
      document.body.removeChild(ta);
    },
    downloadText(filename,text){
      const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download=filename;a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    },
    toast(msg){
      const t=document.getElementById('toast');
      t.textContent=msg;t.classList.add('show');
      clearTimeout(this._toastTimer);
      this._toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
    }
  };

  /* ---- Router 屏幕切换 ---- */
  const Router={
    history:[],
    go(name){
      if(State.screen===name)return;
      const cur=document.getElementById('screen-'+State.screen);
      const nxt=document.getElementById('screen-'+name);
      if(cur)cur.classList.add('is-hidden');
      if(nxt){nxt.classList.remove('is-hidden');nxt.scrollTop=0}
      this.history.push(State.screen);
      State.screen=name;
      Bus.emit('route',name);
    },
    back(){
      const prev=this.history.pop();
      if(prev){
        const cur=document.getElementById('screen-'+State.screen);
        const nxt=document.getElementById('screen-'+prev);
        if(cur)cur.classList.add('is-hidden');
        if(nxt){nxt.classList.remove('is-hidden');nxt.scrollTop=0}
        State.screen=prev;Bus.emit('route',prev);
      }
    }
  };

  /* ---- Data 查询函数层 ---- */
  const Data={
    case(id){return DATA.cases.find(c=>c.id===id)||null},
    casesByModule(mod){return DATA.cases.filter(c=>c.module===mod)},
    casesBySection(sec){return DATA.cases.filter(c=>c.section===sec)},
    personas(mod){return DATA.personas[mod]||{}},
    persona(mod,key){return(DATA.personas[mod]||{})[key]||null},
    knowledgeBySection(sec){return sec?DATA.knowledge.filter(k=>k.section===sec):DATA.knowledge},
    socraticBySection(sec){return sec?DATA.socratic.filter(s=>s.section===sec):DATA.socratic},
    stepsOf(id){const c=this.case(id);return c?c.steps:[]},
    extraThinking(){return DATA.extraThinking||[]}
  };

  /* ---- Scoring 评分系统 ---- */
  const RANKS=['见习辩手','思辨新秀','逻辑锐士','辩证宗师'];
  const RANK_THRESH=[0,120,360,720];
  const ERROR_TYPES={
    '概念混淆':'混淆了两个相似但不同的概念,需回到定义辨析种属关系。',
    '逻辑跳跃':'结论方向可能对,但跳过了关键论证环节,需补全中间步骤。',
    '审题偏差':'只看到部分信息就下判断,需全面审读题干。',
    '立场摇摆':'在非此即彼的选择中左右摇摆,辩证不是和稀泥,方向有唯一正解。',
    '知识盲区':'核心原理未掌握,需回归知识点重新学习。',
    '过度解读':'脱离文本/材料过度引申,需回到原文依据。'
  };
  const Scoring={
    grade(choice,caseData){
      if(choice.caught)return'S';
      const hits=choice.hits?choice.hits.length:0;
      if(hits>=3)return'B';
      return'C';
    },
    scoreDelta(grade){return{S:30,B:6,C:-8}[grade]||0},
    rankName(score){
      let r=0;
      for(let i=0;i<RANK_THRESH.length;i++)if(score>=RANK_THRESH[i])r=i;
      return RANKS[r];
    },
    rankIndex(score){
      let r=0;
      for(let i=0;i<RANK_THRESH.length;i++)if(score>=RANK_THRESH[i])r=i;
      return r;
    },
    applyResult(grade,caseData,choice){
      const p=Store.data.profile;
      const delta=this.scoreDelta(grade);
      p.mindScore=Math.max(0,p.mindScore+delta);
      p.totalBattles++;
      if(grade==='S'){p.wins++;p.streak++;p.lostStreak=0;p.bestStreak=Math.max(p.bestStreak,p.streak)}
      else{p.streak=0;p.lostStreak++;if(p.lostStreak>=3)p.lost=true}
      p.rank=this.rankIndex(p.mindScore);
      Store.data.dist[grade]++;
      if(choice.errorType){
        Store.data.errorDist[choice.errorType]=(Store.data.errorDist[choice.errorType]||0)+1;
      }
      if(grade!=='S'||choice.trap){
        const exist=Store.data.wrongBook.find(w=>w.caseId===caseData.id);
        if(!exist){
          Store.data.wrongBook.push({caseId:caseData.id,section:caseData.section,module:caseData.module,errorType:choice.errorType||'知识盲区',ts:Date.now()});
        }
      }
      Store.data.recent.unshift({caseId:caseData.id,grade,ts:Date.now()});
      if(Store.data.recent.length>20)Store.data.recent.length=20;
      Store.save();
      Bus.emit('grade',grade);
    }
  };

  /* ---- Starfield 星空粒子背景 ---- */
  const Starfield=(function(){
    let cv,ctx,parts=[],raf,dpr,density='full',running=true,lastT=0;
    const COLORS_DARK=['rgba(139,139,240,.8)','rgba(34,195,166,.6)','rgba(139,92,246,.5)','rgba(255,255,255,.7)'];
    function count(){const w=innerWidth;return density==='low'?(w<640?40:80):(w<640?90:w<1100?160:240)}
    function seed(){
      parts=[];
      const n=count();
      for(let i=0;i<n;i++){
        parts.push({
          x:Math.random()*innerWidth,y:Math.random()*innerHeight,
          z:0.3+Math.random()*0.7,tw:Math.random()*Math.PI*2,
          tws:0.005+Math.random()*0.02,
          vx:(Math.random()-0.5)*0.03,vy:0.02+Math.random()*0.04
        });
      }
    }
    function resize(){
      dpr=Math.min(devicePixelRatio||1,2);
      cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
      cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);seed();
    }
    function loop(t){
      if(!running)return;
      const dt=Math.min(t-lastT,50);lastT=t;
      const colors=COLORS_DARK;
      ctx.clearRect(0,0,innerWidth,innerHeight);
      for(const p of parts){
        p.x+=p.vx*dt*0.06;p.y+=p.vy*dt*0.06;p.tw+=p.tws*dt*0.06;
        if(p.y>innerHeight+5){p.y=-5;p.x=Math.random()*innerWidth}
        if(p.x>innerWidth+5)p.x=-5;if(p.x<-5)p.x=innerWidth+5;
        const r=Math.max(0.3,p.z*1.6);
        const a=Math.max(0,0.3+Math.sin(p.tw)*0.4);
        ctx.fillStyle=colors[Math.floor(p.z*3)%colors.length];
        ctx.globalAlpha=a*p.z;
        ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;raf=requestAnimationFrame(loop);
    }
    return{
      init(){
        cv=document.getElementById('starfield');ctx=cv.getContext('2d');
        resize();addEventListener('resize',Util.debounce(resize,200));
        document.addEventListener('visibilitychange',()=>{
          if(document.hidden){running=false;cancelAnimationFrame(raf)}
          else if(!running){running=true;lastT=performance.now();raf=requestAnimationFrame(loop)}
        });
        Bus.on('theme',()=>{/* 颜色在 loop 中动态读取,无需重新 seed */});
        running=true;lastT=performance.now();raf=requestAnimationFrame(loop);
      },
      setDensity(d){density=d;seed()},
      pause(){running=false;cancelAnimationFrame(raf)},
      resume(){if(!running){running=true;lastT=performance.now();raf=requestAnimationFrame(loop)}}
    };
  })();

  /* ============ §1 入场动画：思维汇聚·黑洞跃迁 ============ */
  M.entry=(function(){
    let finished=false,icv,ictx,iparticles=[],iraf,istart,icanvasActive=true;

    function init(){
      const skipBtn=document.getElementById('entry-skip-btn');
      skipBtn.addEventListener('click',finish);
      document.addEventListener('keydown',onKey);

      App.Starfield.setDensity('low');
      initIntroStars();
      istart=performance.now();
      iraf=requestAnimationFrame(introTick);

      /* 1.8s 后自动 finish */
      setTimeout(finish,1800);
    }

    function initIntroStars(){
      icv=document.getElementById('introStars');ictx=icv.getContext('2d');
      const dpr=Math.min(devicePixelRatio||1,2);
      icv.width=innerWidth*dpr;icv.height=innerHeight*dpr;
      icv.style.width=innerWidth+'px';icv.style.height=innerHeight+'px';
      ictx.setTransform(dpr,0,0,dpr,0,0);
      const cx=innerWidth/2,cy=innerHeight/2;iparticles=[];
      const colors=['#8b5cf6','#5b5bf0','#22c3a6','#a78bfa','#eef0ff'];
      for(let i=0;i<40;i++){
        const ang=Math.random()*Math.PI*2;
        const dist=Math.max(innerWidth,innerHeight)*0.55*(0.5+Math.random()*0.5);
        iparticles.push({x:cx+Math.cos(ang)*dist,y:cy+Math.sin(ang)*dist,tx:cx,ty:cy,
          r:1+Math.random()*2.2,color:colors[(Math.random()*colors.length)|0],
          speed:0.018+Math.random()*0.022});
      }
    }

    function introTick(t){
      if(finished||!icanvasActive)return;
      ictx.clearRect(0,0,innerWidth,innerHeight);
      const cx=innerWidth/2,cy=innerHeight/2;
      for(const p of iparticles){
        p.x+=(p.tx-p.x)*p.speed;p.y+=(p.ty-p.y)*p.speed;
        const d=Math.hypot(p.x-cx,p.y-cy);
        const dRatio=Math.min(1,d/150);
        const alpha=dRatio*0.9;
        const rad=Math.max(0.2,p.r*dRatio);
        ictx.globalAlpha=alpha;ictx.fillStyle=p.color;ictx.shadowBlur=6;ictx.shadowColor=p.color;
        ictx.beginPath();ictx.arc(p.x,p.y,rad,0,Math.PI*2);ictx.fill();
        if(d<2){
          const a=Math.random()*Math.PI*2,dist=Math.max(innerWidth,innerHeight)*0.55*(0.6+Math.random()*0.4);
          p.x=cx+Math.cos(a)*dist;p.y=cy+Math.sin(a)*dist;
        }
      }
      ictx.shadowBlur=0;ictx.globalAlpha=1;
      iraf=requestAnimationFrame(introTick);
    }

    function onKey(e){
      if(e.key==='Escape'||e.key==='Enter'){e.preventDefault();finish()}
    }

    function finish(){
      if(finished)return;finished=true;
      cancelAnimationFrame(iraf);
      document.removeEventListener('keydown',onKey);
      icanvasActive=false;
      /* 淡出 canvas */
      icv.style.transition='opacity .3s';
      icv.style.opacity='0';

      /* 触发跃迁进场 */
      const entryScreen=document.getElementById('screen-entry');
      const homeScreen=document.getElementById('screen-home');

      entryScreen.style.animation='none';
      void entryScreen.offsetWidth;
      entryScreen.style.animation='introJump .5s var(--ease) forwards';

      homeScreen.classList.remove('is-hidden');
      homeScreen.classList.add('intro-in');

      setTimeout(()=>{
        entryScreen.classList.add('is-hidden');
        App.Starfield.setDensity('full');
        App.Router.go('home');
        setTimeout(()=>homeScreen.classList.remove('intro-in'),500);
      },500);
    }

    return{init};
  })();

  /* ============ §2 首页+换一换 ============ */
  M.home=(function(){
    let activeFilter='全部',activeTab='search',order=null;

    function init(){
      const screen=document.getElementById('screen-home');
      const list=document.getElementById('case-list');
      const shuffleBtn=document.getElementById('home-shuffle-btn');
      const goBtn=document.getElementById('home-input-go');
      const searchInput=document.getElementById('home-search-input');
      const pasteInput=document.getElementById('home-paste-input');

      /* Tab 切换 */
      screen.querySelectorAll('.home-tab').forEach(tab=>{
        tab.addEventListener('click',()=>{
          activeTab=tab.dataset.tab;
          screen.querySelectorAll('.home-tab').forEach(t=>t.classList.toggle('active',t===tab));
          searchInput.style.display=activeTab==='search'?'':'none';
          pasteInput.style.display=activeTab==='paste'?'':'none';
        });
      });

      /* 筛选 */
      screen.querySelectorAll('.home-filter').forEach(f=>{
        f.addEventListener('click',()=>{
          activeFilter=f.dataset.filter;
          screen.querySelectorAll('.home-filter').forEach(x=>x.classList.toggle('active',x===f));
          renderCases();
        });
      });

      /* 换一换 */
      shuffleBtn.addEventListener('click',()=>{
        const cards=[...list.querySelectorAll('.case-card')];
        const oldRects=cards.map(c=>c.getBoundingClientRect());
        order=Util.shuffle(getFilteredCases());
        renderCases();
        const newCards=[...list.querySelectorAll('.case-card')];
        newCards.forEach((nc,i)=>{
          if(!oldRects[i])return;
          const newRect=nc.getBoundingClientRect();
          const dx=oldRects[i].left-newRect.left;
          const dy=oldRects[i].top-newRect.top;
          nc.style.transition='none';
          nc.style.transform='translate('+dx+'px,'+dy+'px)';
          requestAnimationFrame(()=>{
            nc.style.transition='';
            nc.style.transform='';
          });
        });
        Util.toast('已随机重排');
      });

      /* 输入匹配 */
      goBtn.addEventListener('click',handleInput);
      searchInput.addEventListener('keydown',e=>{if(e.key==='Enter')handleInput()});
      pasteInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey)handleInput()});

      /* 导航按钮 */
      document.getElementById('nav-kb-btn').addEventListener('click',()=>Router.go('kb'));
      document.getElementById('nav-wall-btn').addEventListener('click',()=>Router.go('wall'));

      /* 路由进入时刷新 */
      Bus.on('route',name=>{
        if(name==='home'){renderCases();renderFooter()}
      });

      renderCases();
      renderFooter();
      renderExamples();
    }

    function renderExamples(){
      const el=document.getElementById('home-examples');
      if(!el)return;
      const picks=Util.shuffle(DATA.cases).slice(0,4);
      el.innerHTML='';
      picks.forEach(c=>{
        const pill=document.createElement('button');
        pill.className='home-example-pill';
        pill.textContent=c.stem.length>14?c.stem.slice(0,12)+'…':c.stem;
        pill.addEventListener('click',()=>{
          State.caseId=c.id;
          State.case=c;
          Router.go('loader');
        });
        el.appendChild(pill);
      });
    }

    function getFilteredCases(){
      let cases=DATA.cases.slice();
      if(activeFilter!=='全部')cases=cases.filter(c=>c.module===activeFilter);
      if(!order||order.length!==cases.length||(order[0]&&cases.indexOf(order[0])<0)){
        order=cases;
      }
      return order.filter(c=>cases.indexOf(c)>=0);
    }

    function renderCases(){
      const list=document.getElementById('case-list');
      const cases=getFilteredCases();
      list.innerHTML='';
      cases.forEach((c,i)=>{
        const card=document.createElement('div');
        card.className='case-card';
        card.style.animationDelay='calc('+i+'*50ms)';

        const tagClass=c.module==='lit'?'lit':'';
        const moduleName=c.module==='phil'?'哲学':'语文';
        const personas=Data.personas(c.module);
        const personaKeys=c.personas.filter(k=>k!=='kg').slice(0,3);

        let personaDots='';
        personaKeys.forEach(key=>{
          const p=personas[key];
          if(p){
            personaDots+='<span class="case-persona-dot" style="background:'+p.color+'">'+p.sym+'</span>';
          }
        });

        const stemText=c.stem.length>60?c.stem.slice(0,58)+'…':c.stem;

        card.innerHTML=
          '<div class="case-card-top">'+
            '<span class="case-tag '+tagClass+'">'+moduleName+'</span>'+
            '<span class="case-section">'+Util.escapeHtml(c.section)+'</span>'+
            '<div class="case-personas">'+personaDots+'</div>'+
          '</div>'+
          '<div class="case-stem">'+Util.escapeHtml(stemText)+'</div>';

        card.addEventListener('click',()=>{
          State.caseId=c.id;
          State.case=c;
          Router.go('loader');
        });
        list.appendChild(card);
      });
    }

    function handleInput(){
      const text=(activeTab==='search'
        ?document.getElementById('home-search-input').value
        :document.getElementById('home-paste-input').value
      ).trim();
      if(!text){
        Util.toast('请输入关键词');
        return;
      }
      const keywords=text.toLowerCase().split(/[\s,，。；;、]+/).filter(k=>k.length>0);
      let bestMatch=null,bestScore=0;
      DATA.cases.forEach(c=>{
        const haystack=(c.stem+' '+c.section+' '+c.id).toLowerCase();
        let score=0;
        keywords.forEach(kw=>{
          if(haystack.includes(kw))score+=kw.length;
        });
        if(score>bestScore){bestScore=score;bestMatch=c}
      });
      if(bestMatch){
        State.caseId=bestMatch.id;
        State.case=bestMatch;
        Util.toast('已匹配：'+bestMatch.stem.slice(0,20)+'…');
        setTimeout(()=>Router.go('loader'),600);
      }else{
        const random=Util.pick(DATA.cases);
        State.caseId=random.id;
        State.case=random;
        Util.toast('未命中关键词，随机抽取一题');
        setTimeout(()=>Router.go('loader'),600);
      }
    }

    function renderFooter(){
      const el=document.getElementById('home-footer-inner');
      const p=Store.data.profile;
      const rankName=Scoring.rankName(p.mindScore);
      el.innerHTML=
        '<span class="home-footer-item">段位 <span class="home-footer-rank">'+rankName+'</span></span>'+
        '<span class="home-footer-sep"></span>'+
        '<span class="home-footer-item">思维分 <span class="home-footer-val">'+p.mindScore+'</span></span>'+
        '<span class="home-footer-sep"></span>'+
        '<span class="home-footer-item">对局 <span class="home-footer-val">'+p.totalBattles+'</span></span>'+
        '<span class="home-footer-sep"></span>'+
        '<span class="home-footer-item">连胜 <span class="home-footer-val">'+p.streak+'</span></span>';
    }

    return{init,renderFooter};
  })();

  /* ============ §3 加载模拟 ============ */
  M.loader=(function(){
    const STAGES=[
      {label:'解析辩题',dur:500},
      {label:'召唤导师',dur:700},
      {label:'构建论点',dur:600},
      {label:'编排回合',dur:600},
      {label:'校准评分',dur:500}
    ];
    const FIXED_CHIPS=['检索知识库','构建论证引擎','校验逻辑自洽','生成战报模板'];
    let running=false;

    function init(){
      Bus.on('route',name=>{
        if(name==='loader'&&!running)run();
      });
    }

    async function run(){
      if(!State.case){Router.go('home');return}
      running=true;
      const c=State.case;
      const personas=Data.personas(c.module);

      /* 重置 UI */
      const barFill=document.getElementById('loader-bar-fill');
      const stagesEl=document.getElementById('loader-stages');
      const mentorsEl=document.getElementById('loader-mentors');
      const chipsEl=document.getElementById('loader-chips');
      barFill.style.width='0%';
      stagesEl.innerHTML='';
      mentorsEl.innerHTML='';
      chipsEl.innerHTML='';

      /* 渲染阶段列表 */
      STAGES.forEach((s,i)=>{
        const el=document.createElement('div');
        el.className='loader-stage';
        el.innerHTML='<span class="loader-stage-icon"></span><span>'+s.label+'</span>';
        stagesEl.appendChild(el);
      });
      const stageEls=[...stagesEl.querySelectorAll('.loader-stage')];

      /* 渲染导师星灵（先隐藏） */
      const personaKeys=c.personas.slice();
      const mentorEls=[];
      personaKeys.forEach((key,idx)=>{
        const p=personas[key];
        if(!p)return;
        const el=document.createElement('div');
        el.className='mentor-spawn';
        el.innerHTML=
          '<div class="mentor-orb" style="background:'+p.color+';color:'+p.color+'">'+
            '<span style="color:#fff">'+p.sym+'</span>'+
          '</div>'+
          '<div class="mentor-name">'+p.name+'</div>';
        mentorsEl.appendChild(el);
        mentorEls.push(el);
      });

      /* 渲染固定工具 chips（先隐藏） */
      const chipEls=[];
      FIXED_CHIPS.forEach(label=>{
        const el=document.createElement('div');
        el.className='loader-chip';
        el.innerHTML='<span>'+label+'</span><span class="loader-chip-mark">✓</span>';
        chipsEl.appendChild(el);
        chipEls.push(el);
      });

      /* 渲染辅助 chips：从 DATA 取知识点/追问 */
      const kn=Data.knowledgeBySection(c.section).slice(0,2);
      kn.forEach(k=>{
        const el=document.createElement('div');
        el.className='loader-chip';
        el.innerHTML='<span>调取·'+Util.escapeHtml(k.title)+'</span><span class="loader-chip-mark">✓</span>';
        chipsEl.appendChild(el);
        chipEls.push(el);
      });
      const sq=Data.socraticBySection(c.section).slice(0,1);
      sq.forEach(s=>{
        const el=document.createElement('div');
        el.className='loader-chip';
        el.innerHTML='<span>苏格拉底·追问</span><span class="loader-chip-mark">✓</span>';
        chipsEl.appendChild(el);
        chipEls.push(el);
      });

      /* 预取剧本数据 */
      prepareScript(c,personas);

      /* 5 阶段串行推进 */
      let chipIdx=0;
      for(let i=0;i<STAGES.length;i++){
        /* 激活当前阶段 */
        stageEls[i].classList.add('active');
        const stageProgress=(i+1)/STAGES.length;

        /* 阶段 2「召唤导师」：逐个浮现星灵 */
        if(i===1){
          await Util.delay(150);
          for(let m=0;m<mentorEls.length;m++){
            mentorEls[m].classList.add('show');
            await Util.delay(350);
          }
        }

        /* 在阶段 1-4 依次打 chip ✓ */
        if(i<4&&chipEls[chipIdx]){
          chipEls[chipIdx].classList.add('show');
          await Util.delay(200);
          chipEls[chipIdx].classList.add('done');
          chipIdx++;
        }

        await Util.delay(STAGES[i].dur-200);

        /* 标记完成 */
        stageEls[i].classList.remove('active');
        stageEls[i].classList.add('done');
        stageEls[i].querySelector('.loader-stage-icon').textContent='✓';

        /* 更新进度条 */
        barFill.style.width=(stageProgress*100)+'%';
      }

      /* 剩余辅助 chips 依次完成 */
      while(chipIdx<chipEls.length){
        chipEls[chipIdx].classList.add('show');
        await Util.delay(150);
        chipEls[chipIdx].classList.add('done');
        chipIdx++;
      }

      await Util.delay(400);
      running=false;
      Router.go('debate');
    }

    function prepareScript(c,personas){
      const opening=[];
      /* opening 是对象，键=导师key，值=文本 */
      const openingKeys=Object.keys(c.opening);
      openingKeys.forEach(key=>{
        const p=personas[key]||{name:key,sym:'?',color:'#888'};
        opening.push({who:key,name:p.name,color:p.color,sym:p.sym,text:c.opening[key]});
      });

      /* clash 是 {p, t} 对象数组，按发言顺序扁平化为单条发言流 */
      const clashes=[];
      if(c.clash&&Array.isArray(c.clash)){
        const flat=[];
        c.clash.forEach(turn=>{
          const key=turn.p||turn.who||c.personas[0];
          const p=personas[key]||{name:key,sym:'?',color:'#888'};
          flat.push({who:key,name:p.name,color:p.color,sym:p.sym,text:turn.t||turn.text||''});
        });
        clashes.push(flat);
      }

      State.script={
        opening:opening,
        clashes:clashes,
        challenge:c.challenge,
        personas:personas
      };
    }

    return{init};
  })();

  /* ============ §4 导师星座+辩论引擎 ============ */
  M.debate=(function(){
    let playing=false,skipFlag=false;

    function init(){
      Bus.on('route',name=>{
        if(name==='debate'&&!playing)play();
      });
      const exitBtn=document.getElementById('debate-exit');
      if(exitBtn)exitBtn.addEventListener('click',()=>{
        playing=false;skipFlag=true;Router.go('home');
      });
    }

    function buildConstellation(script){
      const el=document.getElementById('constellation');
      el.innerHTML='';
      /* 收集所有 debater（opening + clash 去重，排除 kg 考官） */
      const seen={};
      const debaters=[];
      script.opening.forEach(sp=>{
        if(sp.who!=='kg'&&!seen[sp.who]){seen[sp.who]=1;debaters.push(sp)}
      });
      if(script.clashes){
        script.clashes.forEach(round=>{
          round.forEach(sp=>{
            if(sp.who!=='kg'&&!seen[sp.who]){seen[sp.who]=1;debaters.push(sp)}
          });
        });
      }
      debaters.forEach(sp=>{
        const node=document.createElement('div');
        node.className='star-node';
        node.id='star-'+sp.who;
        node.style.setProperty('--star-color',sp.color||'var(--brand)');
        node.innerHTML='<span class="star-sym">'+Util.escapeHtml(sp.sym||'?')+'</span><span class="star-name">'+Util.escapeHtml(sp.name||sp.who)+'</span>';
        el.appendChild(node);
      });
      return debaters;
    }

    async function play(){
      const script=State.script;
      if(!script||!script.opening){Router.go('home');return}
      playing=true;skipFlag=false;

      const log=document.getElementById('debate-log');
      const tapHint=document.getElementById('debate-tap-hint');
      const progressEl=document.getElementById('debate-progress');

      log.innerHTML='';

      /* 构建星座 */
      const debaters=buildConstellation(script);

      /* 计算总轮次 */
      const totalRounds=(script.clashes?script.clashes.length:0)+1;
      renderProgress(progressEl,0,totalRounds);

      /* 星座入场 */
      tapHint.style.opacity='0';
      await Util.delay(200);
      const nodes=document.querySelectorAll('.star-node');
      nodes.forEach((n,i)=>{
        setTimeout(()=>n.classList.add('entered'),i*150);
      });
      await Util.delay(nodes.length*150+400);

      /* 开场白 */
      renderProgress(progressEl,0,totalRounds);
      for(let i=0;i<script.opening.length;i++){
        const sp=script.opening[i];
        await speak(sp);
        renderProgress(progressEl,i+1,totalRounds);
      }

      /* 互驳回合 */
      if(script.clashes){
        for(let r=0;r<script.clashes.length;r++){
          const round=script.clashes[r];
          renderProgress(progressEl,r+1,totalRounds);
          showThinking(log);
          await Util.delay(500);
          hideThinking(log);
          for(let j=0;j<round.length;j++){
            await speak(round[j]);
          }
        }
      }

      renderProgress(progressEl,totalRounds,totalRounds);

      /* 考官降入 */
      await Util.delay(400);
      const kg=script.personas.kg||{name:'考官',color:'#ef4444',sym:'⚖'};
      showExaminer(log,kg);
      await Util.delay(600);

      const ch=script.challenge;
      if(ch&&ch.q)showExamBubble(log,ch.q);

      tapHint.textContent='点击进入参战 ›';
      tapHint.style.opacity='';

      await waitForTap();
      playing=false;
      Router.go('challenge');
    }

    async function speak(sp){
      const log=document.getElementById('debate-log');
      /* 高亮对应星座节点 */
      document.querySelectorAll('.star-node').forEach(n=>n.classList.remove('speaking'));
      const node=document.getElementById('star-'+sp.who);
      if(node)node.classList.add('speaking');

      /* 创建气泡 */
      const bubble=document.createElement('div');
      bubble.className='debate-bubble left';
      bubble.style.setProperty('--bubble-color',sp.color||'var(--brand)');
      bubble.innerHTML='<div class="debate-bubble-who">'+Util.escapeHtml(sp.name||sp.who)+'</div><span class="bubble-text"></span>';
      log.appendChild(bubble);
      log.scrollTop=log.scrollHeight;

      const textEl=bubble.querySelector('.bubble-text');
      await typeText(textEl,sp.text);

      if(node)node.classList.remove('speaking');
      await Util.delay(300);
    }

    async function typeText(el,text){
      if(!text){el.textContent='';return}
      skipFlag=false;
      const onSkip=()=>{skipFlag=true};
      document.addEventListener('click',onSkip);

      el.innerHTML='';
      const cursor=document.createElement('span');
      cursor.className='type-cursor';
      el.appendChild(cursor);

      for(let i=0;i<text.length;i++){
        if(skipFlag){el.textContent=text;document.removeEventListener('click',onSkip);return}
        cursor.insertAdjacentText('beforebegin',text[i]);
        const ch=text[i];
        const delay=/[。！？；，、]/.test(ch)?80:/[\s]/.test(ch)?10:25;
        await Util.delay(delay);
      }
      cursor.remove();
      document.removeEventListener('click',onSkip);
    }

    function showThinking(log){
      const el=document.createElement('div');
      el.className='debate-thinking';
      el.id='debate-thinking';
      el.innerHTML='<span></span><span></span><span></span>';
      log.appendChild(el);
      log.scrollTop=log.scrollHeight;
    }

    function hideThinking(log){
      const el=document.getElementById('debate-thinking');
      if(el)el.remove();
    }

    function showExaminer(log,kg){
      const el=document.createElement('div');
      el.className='debate-bubble debate-bubble-exam';
      el.style.animation='bubbleIn .5s var(--ease)';
      el.innerHTML='<div class="debate-bubble-who">'+Util.escapeHtml(kg.name||'考官')+'</div>';
      log.appendChild(el);
      log.scrollTop=log.scrollHeight;
    }

    function showExamBubble(log,text){
      const el=document.createElement('div');
      el.className='debate-bubble debate-bubble-exam';
      el.style.maxWidth='90%';
      el.innerHTML='<div style="font-size:14px;line-height:1.65;color:var(--text)">'+Util.escapeHtml(text)+'</div>';
      log.appendChild(el);
      log.scrollTop=log.scrollHeight;
    }

    function renderProgress(el,current,total){
      if(!el)return;
      el.innerHTML='';
      for(let i=0;i<total;i++){
        const dot=document.createElement('span');
        dot.className='debate-progress-dot';
        if(i<current)dot.classList.add('done');
        else if(i===current)dot.classList.add('current');
        el.appendChild(dot);
      }
    }

    function waitForTap(){
      return new Promise(resolve=>{
        const handler=()=>{
          document.removeEventListener('click',handler);
          document.removeEventListener('keydown',keyHandler);
          resolve();
        };
        const keyHandler=e=>{
          if(e.key==='Enter'||e.key===' '){e.preventDefault();handler()}
        };
        document.addEventListener('click',handler);
        document.addEventListener('keydown',keyHandler);
      });
    }

    return{init};
  })();

  /* ============ §5 质询+参战+黑洞 ============ */
  M.challenge=(function(){
    let locked=false;

    function init(){
      Bus.on('route',name=>{
        if(name==='challenge')setup();
      });

      document.getElementById('query-go-btn').addEventListener('click',()=>{
        document.getElementById('phase-query').style.display='none';
        document.getElementById('phase-battle').classList.add('show');
      });
    }

    function setup(){
      locked=false;
      const c=State.case;
      if(!c){Router.go('home');return}

      /* 质询节拍 */
      const ch=c.challenge||{};
      document.getElementById('query-text').textContent=ch.q||'请做出你的判断。';
      document.getElementById('query-follow').textContent=ch.follow||'';
      document.getElementById('phase-query').style.display='';
      document.getElementById('phase-battle').classList.remove('show');

      /* 参战节拍 */
      const choicesEl=document.getElementById('battle-choices');
      const bhCenter=document.getElementById('blackhole-center');
      const lockedInfo=document.getElementById('choice-locked-info');
      choicesEl.innerHTML='';
      bhCenter.classList.remove('active');
      lockedInfo.classList.remove('show');
      lockedInfo.textContent='';
      lockedInfo.style.removeProperty('--lock-color');

      (c.choices||[]).forEach((choice,i)=>{
        const card=document.createElement('div');
        card.className='choice-card';
        card.style.animationDelay='calc('+i+'*120ms)';
        card.innerHTML=
          '<div class="choice-num">'+String.fromCharCode(65+i)+'</div>'+
          '<div class="choice-label">'+Util.escapeHtml(choice.label||choice.text||'')+'</div>';
        card.addEventListener('click',()=>onChoose(card,choice,i,choicesEl,bhCenter,lockedInfo));
        choicesEl.appendChild(card);
      });
    }

    function onChoose(card,choice,idx,choicesEl,bhCenter,lockedInfo){
      if(locked)return;locked=true;
      App.Starfield.setDensity('low');

      /* 选中类型判定 */
      let lockColor,lockText;
      if(choice.caught){
        lockColor='var(--brand3)';
        lockText='✓ 正解：'+(choice.why||'判断正确。');
      }else if(choice.trap){
        lockColor='var(--danger)';
        lockText='✗ 陷阱：'+(choice.why||'踩中了命题陷阱。');
      }else{
        lockColor='var(--accent)';
        lockText='△ 干扰：'+(choice.why||'这个方向有偏差。');
      }

      /* 黑洞中心激活 */
      bhCenter.classList.add('active');

      /* 未选中项吸入（延迟150ms让黑洞先展开） */
      const cards=choicesEl.querySelectorAll('.choice-card');
      const bhRect=bhCenter.getBoundingClientRect();
      const choicesRect=choicesEl.getBoundingClientRect();
      const cx=bhRect.left+bhRect.width/2-choicesRect.left;
      const cy=bhRect.top+bhRect.height/2-choicesRect.top;

      cards.forEach((c,i)=>{
        if(i===idx){
          /* 选中项锁定 */
          c.classList.add('locked');
          c.style.setProperty('--lock-color',lockColor);
        }else{
          /* 未选中项吸入 */
          const cRect=c.getBoundingClientRect();
          const dx=cx-(cRect.left-choicesRect.left+cRect.width/2);
          const dy=cy-(cRect.top-choicesRect.top+cRect.height/2);
          c.style.setProperty('--dx',dx+'px');
          c.style.setProperty('--dy',dy+'px');
          setTimeout(()=>c.classList.add('consuming'),150);
        }
      });

      /* 写入 State */
      State.choice=choice;

      /* 锁定信息 */
      setTimeout(()=>{
        lockedInfo.style.setProperty('--lock-color',lockColor);
        lockedInfo.textContent=lockText;
        lockedInfo.classList.add('show');
      },600);

      /* 进入评分 */
      setTimeout(()=>{
        App.Starfield.setDensity('full');
        Router.go('score');
      },2000);
    }

    return{init};
  })();

  /* ============ §6 四步评分 ============ */
  M.score=(function(){
    function init(){
      Bus.on('route',name=>{if(name==='score')run()});
      document.getElementById('score-next').addEventListener('click',()=>Router.go('report'));
    }
    async function run(){
      const c=State.case,choice=State.choice;
      if(!c||!choice){Router.go('home');return}
      const loadEl=document.getElementById('score-load');
      const loadFill=document.getElementById('score-load-fill');
      const titleEl=document.getElementById('score-title');
      const stepsEl=document.getElementById('score-steps');
      const badge=document.getElementById('grade-badge');
      const missedEl=document.getElementById('grade-missed');
      const actions=document.getElementById('score-actions');

      loadEl.style.display='';titleEl.style.display='none';
      stepsEl.innerHTML='';badge.className='grade-badge';badge.textContent='';
      missedEl.textContent='';actions.style.display='none';

      /* 阅卷加载 */
      loadFill.style.width='0';
      await Util.delay(100);
      loadFill.style.width='100%';
      await Util.delay(1000);
      loadEl.style.display='none';
      titleEl.style.display='';

      /* 动态读取步骤 */
      const steps=Data.stepsOf(c.id);
      const hitsArr=choice.hits||[];
      const grade=Scoring.grade(choice,c);

      for(let i=0;i<steps.length;i++){
        const s=steps[i];
        const hit=hitsArr.includes(s.key);
        const card=document.createElement('div');
        card.className='step-card '+(hit?'hit':'miss');
        card.innerHTML=
          '<div class="step-card-head">'+
            '<span class="step-key">'+Util.escapeHtml(s.key)+'</span>'+
            '<span class="step-mark '+(hit?'hit':'miss')+'">'+(hit?'✓':'✗')+'</span>'+
          '</div>'+
          '<div class="step-point">'+Util.escapeHtml(s.point||s.f||'')+'</div>';
        stepsEl.appendChild(card);
        await Util.delay(150);
        card.classList.add('show');
      }

      await Util.delay(400);

      /* 评级徽章 */
      badge.textContent=grade;
      badge.classList.add(grade);
      await Util.delay(100);
      badge.classList.add('show');

      /* 易错提示 */
      if(c.missed){
        missedEl.textContent='⚠ 易错点：'+c.missed;
      }

      /* 落库 */
      Scoring.applyResult(grade,c,choice);
      State.grade=grade;

      await Util.delay(400);
      actions.style.display='';
    }
    return{init};
  })();

  /* ============ §7 思维链+战报 ============ */
  M.report=(function(){
    function init(){
      Bus.on('route',name=>{if(name==='report')run()});
      document.getElementById('report-copy').addEventListener('click',copy);
      document.getElementById('report-download').addEventListener('click',download);
      document.getElementById('report-next').addEventListener('click',()=>{State.case=null;State.choice=null;Router.go('home')});
      document.getElementById('report-wall').addEventListener('click',()=>Router.go('wall'));
      document.getElementById('report-home').addEventListener('click',()=>{State.case=null;State.choice=null;Router.go('home')});
    }

    function run(){
      const c=State.case,choice=State.choice,grade=State.grade;
      if(!c){Router.go('home');return}
      renderAttribution(c,choice);
      renderText(c,choice,grade);
    }

    function renderAttribution(c,choice){
      const el=document.getElementById('report-attribution');
      if(!choice||choice.caught){
        el.style.display='none';return;
      }
      const errType=choice.errorType||'知识盲区';
      const desc=ERROR_TYPES[errType]||'需回归知识点重新学习。';
      const isLit=c.module==='lit';
      const linkText=isLit?'查看本题四步法解析 →':'查看相关知识点 →';
      el.style.display='';
      el.innerHTML=
        '<div class="report-attribution-title">错题归因：'+errType+'</div>'+
        '<div class="report-attribution-desc">'+desc+'</div>'+
        '<div class="report-attribution-link">'+linkText+'</div>';
      el.onclick=()=>{
        if(isLit){
          /* 语文案例：跳回本题 steps 作为溯源 */
          State.caseId=c.id;State.case=c;Router.go('score');
        }else{
          Router.go('kb');
        }
      };
    }

    function renderText(c,choice,grade){
      const p=Store.data.profile;
      const rankName=Scoring.rankName(p.mindScore);
      const steps=Data.stepsOf(c.id);
      const hitsArr=choice?(choice.hits||[]):[];
      const stepLines=steps.map(s=>'  ['+(hitsArr.includes(s.key)?'✓':'✗')+'] '+s.key+'：'+(s.point||'')).join('\n');
      const text=
        '═══ 思维宇宙·战报 ═══\n\n'+
        '【题目】'+c.stem+'\n'+
        '【学科】'+(c.module==='phil'?'哲学':'语文')+' · '+c.section+'\n'+
        '【你的选择】'+(choice?choice.label:'—')+'\n'+
        '【评级】'+grade+'\n'+
        '【四步法】\n'+stepLines+'\n\n'+
        '【段位】'+rankName+'（思维分 '+p.mindScore+'）\n'+
        '【对局统计】'+p.totalBattles+'战 | 连胜'+p.streak+' | 最高连胜'+p.bestStreak+'\n'+
        (c.missed?'\n【⚠ 易错点】'+c.missed+'\n':'')+
        '\n— 思维宇宙·思辨擂台';
      document.getElementById('report-text').textContent=text;
    }

    function copy(){
      const text=document.getElementById('report-text').textContent;
      Util.copyText(text);
      Util.toast('战报已复制到剪贴板');
    }
    function download(){
      const text=document.getElementById('report-text').textContent;
      Util.downloadText('思维宇宙战报_'+State.caseId+'.txt',text);
      Util.toast('战报已下载');
    }
    return{init};
  })();

  /* ============ §8 战绩墙 ============ */
  M.wall=(function(){
    function init(){
      Bus.on('route',name=>{if(name==='wall')run()});
      document.getElementById('wall-back').addEventListener('click',()=>Router.go('home'));
    }
    function run(){
      const p=Store.data.profile;
      const grid=document.getElementById('wall-grid');
      const rankName=Scoring.rankName(p.mindScore);
      const nextThresh=App.RANK_THRESH[Scoring.rankIndex(p.mindScore)+1]||p.mindScore;
      const curThresh=App.RANK_THRESH[Scoring.rankIndex(p.mindScore)]||0;
      const progress=nextThresh>curThresh?Math.min(100,(p.mindScore-curThresh)/(nextThresh-curThresh)*100):100;

      let html=
        '<div class="wall-card"><div class="wall-card-title">段位</div>'+
        '<div class="wall-rank-name">'+rankName+'</div>'+
        '<div class="wall-score-bar"><div class="wall-score-bar-fill" style="width:'+progress+'%"></div></div>'+
        '<div class="wall-score-text">思维分 '+p.mindScore+' / '+(nextThresh>curThresh?nextThresh:'MAX')+'</div></div>'+
        '<div class="wall-card"><div class="wall-card-title">对局</div><div class="wall-streak">'+
        '<div class="wall-streak-item"><div class="wall-streak-val">'+p.totalBattles+'</div><div class="wall-streak-label">总对局</div></div>'+
        '<div class="wall-streak-item"><div class="wall-streak-val">'+p.wins+'</div><div class="wall-streak-label">胜场</div></div>'+
        '<div class="wall-streak-item"><div class="wall-streak-val">'+p.streak+'</div><div class="wall-streak-label">当前连胜</div></div>'+
        '<div class="wall-streak-item"><div class="wall-streak-val">'+p.bestStreak+'</div><div class="wall-streak-label">最高连胜</div></div>'+
        '</div>'+(p.lost?'<div class="wall-lost" style="margin-top:12px">⚠ 思维迷失：连败 '+p.lostStreak+'，建议复习错题</div>':'')+'</div>'+
        '<div class="wall-card"><div class="wall-card-title">评级分布</div><div class="wall-dist">'+
        ['S','B','C'].map(g=>'<div class="wall-dist-bar"><div class="wall-dist-fill '+g+'" style="height:'+Math.max(4,(Store.data.dist[g]||0)*30)+'px"></div><div class="wall-dist-label">'+g+'</div><div class="wall-dist-count">'+(Store.data.dist[g]||0)+'</div></div>').join('')+
        '</div></div>'+
        '<div class="wall-card"><div class="wall-card-title">错题归因雷达</div>'+radarSVG()+'</div>';

      grid.innerHTML=html;

      /* 错题列表 */
      const wrongSec=document.getElementById('wall-wrong-section');
      const wb=Store.data.wrongBook;
      if(wb.length===0){
        wrongSec.innerHTML='<div class="wall-card"><div class="wall-empty">星图澄明，暂无暗物质</div></div>';
      }else{
        wrongSec.innerHTML='<div class="wall-card"><div class="wall-card-title">暗物质碎片（错题本）</div><div class="wall-wrong-list">'+
          wb.slice().reverse().map(w=>{
            const cs=Data.case(w.caseId);
            const stem=cs?cs.stem:'(已删除)';
            return '<div class="wall-wrong-item" data-id="'+w.caseId+'">'+
              '<span class="wall-wrong-section">'+Util.escapeHtml(w.section)+'</span>'+
              '<span class="wall-wrong-stem">'+Util.escapeHtml(stem.length>30?stem.slice(0,28)+'…':stem)+'</span>'+
              '<span class="wall-wrong-type">'+Util.escapeHtml(w.errorType)+'</span></div>';
          }).join('')+'</div></div>';
        wrongSec.querySelectorAll('.wall-wrong-item').forEach(el=>{
          el.addEventListener('click',()=>{
            const id=el.dataset.id;
            const cs=Data.case(id);
            if(cs){State.caseId=id;State.case=cs;Router.go('loader')}
          });
        });
      }
    }

    function radarSVG(){
      const types=Object.keys(ERROR_TYPES);
      const dist=Store.data.errorDist;
      const maxVal=Math.max(1,...types.map(t=>dist[t]||0));
      const cx=100,cy=100,r=70;
      const points=types.map((t,i)=>{
        const angle=(i/types.length)*Math.PI*2-Math.PI/2;
        const val=(dist[t]||0)/maxVal;
        return [cx+Math.cos(angle)*r*val,cy+Math.sin(angle)*r*val];
      });
      const polyStr=points.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
      const axes=types.map((t,i)=>{
        const angle=(i/types.length)*Math.PI*2-Math.PI/2;
        const x2=cx+Math.cos(angle)*r,y2=cy+Math.sin(angle)*r;
        const lx=cx+Math.cos(angle)*(r+14),ly=cy+Math.sin(angle)*(r+14);
        return '<line x1="'+cx+'" y1="'+cy+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>'+
          '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" font-size="9" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">'+t.slice(0,2)+'</text>';
      }).join('');
      return '<svg id="wall-radar" width="200" height="200" viewBox="0 0 200 200">'+
        '<defs><filter id="radarGlow" x="-30%" y="-30%" width="160%" height="160%">'+
        '<feGaussianBlur stdDeviation="2" result="b"/>'+
        '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'+
        '<circle cx="100" cy="100" r="70" fill="none" stroke="var(--line)" stroke-width="1" opacity=".5"/>'+
        '<circle cx="100" cy="100" r="35" fill="none" stroke="var(--line)" stroke-width="1" opacity=".4"/>'+
        axes+
        '<polygon points="'+polyStr+'" fill="rgba(91,91,240,.12)" stroke="var(--brand2)" stroke-width="2" filter="url(#radarGlow)"/>'+
        points.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="var(--brand3)" filter="url(#radarGlow)"/>').join('')+
        '</svg>';
    }
    return{init};
  })();

  /* ============ §知识库 ============ */
  M.kb=(function(){
    let activeSection='全部';
    function init(){
      Bus.on('route',name=>{if(name==='kb')run()});
      document.getElementById('kb-back').addEventListener('click',()=>Router.back());
    }
    function run(){
      const filtersEl=document.getElementById('kb-filters');
      const contentEl=document.getElementById('kb-content');
      const sections=['全部',...new Set([...DATA.knowledge.map(k=>k.section),...DATA.socratic.map(s=>s.section)])];
      filtersEl.innerHTML=sections.map(s=>
        '<button class="home-filter'+(s===activeSection?' active':'')+'" data-section="'+Util.escapeHtml(s)+'">'+Util.escapeHtml(s)+'</button>'
      ).join('');
      filtersEl.querySelectorAll('.home-filter').forEach(btn=>{
        btn.addEventListener('click',()=>{activeSection=btn.dataset.section;run()});
      });

      const kn=activeSection==='全部'?DATA.knowledge:DATA.knowledge.filter(k=>k.section===activeSection);
      const sq=activeSection==='全部'?DATA.socratic:DATA.socratic.filter(s=>s.section===activeSection);
      const et=DATA.extraThinking||[];

      let html='';
      if(kn.length){
        html+='<div class="kb-section"><div class="kb-section-title">知识点（'+kn.length+'）</div><div class="kb-cards">'+
          kn.map(k=>'<div class="kb-card"><div class="kb-card-title">'+Util.escapeHtml(k.title)+'</div><div class="kb-card-f">'+Util.escapeHtml(k.f)+'</div>'+(k.e?'<div class="kb-card-e">⚠ '+Util.escapeHtml(k.e)+'</div>':'')+'</div>').join('')+
        '</div></div>';
      }
      if(sq.length){
        html+='<div class="kb-section"><div class="kb-section-title">苏格拉底追问（'+sq.length+'）</div><div class="kb-cards">'+
          sq.map(s=>'<div class="kb-card"><div class="kb-card-q">'+Util.escapeHtml(s.g)+'</div><div class="kb-card-a">→ '+Util.escapeHtml(s.a)+'</div></div>').join('')+
        '</div></div>';
      }
      if(et.length&&(activeSection==='全部')){
        html+='<div class="kb-section"><div class="kb-section-title">通用思维点（'+et.length+'）</div><div class="kb-cards">'+
          et.map(e=>'<div class="kb-card"><div class="kb-card-title">'+Util.escapeHtml(e.title)+'</div><div class="kb-card-f">'+Util.escapeHtml(e.f)+'</div>'+(e.e?'<div class="kb-card-e">⚠ '+Util.escapeHtml(e.e)+'</div>':'')+'</div>').join('')+
        '</div></div>';
      }
      if(!html)html='<div class="wall-empty">该分类暂无内容</div>';
      contentEl.innerHTML=html;
    }
    return{init};
  })();

  /* ---- boot ---- */
  function boot(){
    Starfield.init();
    for(const k in M){if(M[k]&&typeof M[k].init==='function')try{M[k].init()}catch(e){console.warn('[boot]',k,e)}}
    Bus.emit('boot');
  }

  return{DATA,M,Bus,State,Store,Util,Router,Data,Scoring,Starfield,RANKS,RANK_THRESH,ERROR_TYPES,boot};
})();

document.addEventListener('DOMContentLoaded',()=>App.boot());
</script>
