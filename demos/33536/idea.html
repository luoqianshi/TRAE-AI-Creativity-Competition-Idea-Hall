<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字雨诗牌</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --neon-cyan: #00f0ff;
    --neon-pink: #ff2d95;
    --neon-gold: #ffd700;
    --neon-purple: #b347ea;
    --bg-deep: #0a0a0f;
    --bg-card: rgba(15, 15, 30, 0.85);
    --text-dim: #8892b0;
  }

  body {
    background: var(--bg-deep);
    color: #e0e0e0;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ---------- 背景粒子 ---------- */
  #particles {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }

  /* ---------- 主容器 ---------- */
  .main-container {
    position: relative; z-index: 1;
    max-width: 800px; margin: 0 auto;
    padding: 20px 24px 60px;
  }

  /* ---------- 头部 ---------- */
  .header {
    text-align: center; padding: 60px 20px 30px;
    position: relative;
  }
  .header .logo-icon {
    font-size: 56px; margin-bottom: 12px;
    animation: float 3s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .header h1 {
    font-family: 'Ma Shan Zheng', 'ZCOOL XiaoWei', 'STKaiti', cursive;
    font-size: clamp(2.4rem, 5vw, 3.6rem);
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink), var(--neon-gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 18px rgba(0,240,255,0.3));
    letter-spacing: 6px;
  }
  .header .subtitle {
    color: var(--text-dim);
    font-size: 1rem;
    letter-spacing: 4px;
  }

  /* ---------- 赛博分割线 ---------- */
  .divider {
    width: 200px; height: 2px;
    margin: 16px auto;
    background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    position: relative;
  }
  .divider::after {
    content: '◆';
    position: absolute; top: -10px; left: 50%;
    transform: translateX(-50%);
    color: var(--neon-cyan);
    font-size: 12px;
  }

  /* ---------- 卡片 ---------- */
  .card {
    background: var(--bg-card);
    border: 1px solid rgba(0,240,255,0.15);
    border-radius: 16px;
    padding: 28px 24px;
    backdrop-filter: blur(12px);
    position: relative;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 100%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,240,255,0.4), transparent);
  }
  .card h2 {
    font-size: 1.3rem;
    margin-bottom: 20px;
    color: var(--neon-cyan);
    letter-spacing: 3px;
    display: flex; align-items: center; gap: 10px;
  }
  .card h2 .icon { font-size: 1.5rem; }

  /* ---------- 文字雨 Canvas ---------- */
  #rainCanvas {
    width: 100%; height: 280px;
    border-radius: 12px;
    background: rgba(5,5,18,0.8);
    border: 1px solid rgba(0,240,255,0.2);
    display: block;
    cursor: crosshair;
  }
  .demo-controls {
    display: flex; gap: 10px;
    align-items: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .demo-controls input {
    flex: 1; min-width: 140px;
    padding: 10px 14px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(0,240,255,0.25);
    border-radius: 8px;
    color: #e0e0e0;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.3s;
  }
  .demo-controls input:focus {
    border-color: var(--neon-pink);
    box-shadow: 0 0 15px rgba(255,45,149,0.15);
  }
  .btn-demo {
    padding: 10px 20px;
    border: 1px solid var(--neon-pink);
    background: rgba(255,45,149,0.08);
    color: var(--neon-pink);
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 2px;
    font-size: 0.9rem;
    transition: all 0.3s;
    white-space: nowrap;
  }
  .btn-demo:hover {
    background: rgba(255,45,149,0.18);
    box-shadow: 0 0 20px rgba(255,45,149,0.25);
  }
  .btn-demo:active { transform: scale(0.95); }

  .theme-presets {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-top: 10px;
  }
  .theme-tag {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 0.82rem;
    cursor: pointer;
    letter-spacing: 1px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.04);
    color: var(--text-dim);
    transition: all 0.3s;
  }
  .theme-tag:hover, .theme-tag.active {
    border-color: var(--neon-gold);
    color: var(--neon-gold);
    background: rgba(255,215,0,0.08);
    box-shadow: 0 0 12px rgba(255,215,0,0.15);
  }

  /* 诗牌收集区 */
  .poem-tray {
    display: flex; flex-wrap: wrap; gap: 10px;
    min-height: 60px;
    padding: 12px;
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    border: 1px dashed rgba(255,215,0,0.25);
    align-items: center;
    justify-content: center;
  }
  .poem-tray:empty::after {
    content: '👆 点击上方飘落的诗句，收集你的诗牌';
    color: var(--text-dim);
    font-size: 0.85rem;
    pointer-events: none;
  }
  .poem-card {
    padding: 8px 16px;
    background: rgba(255,215,0,0.08);
    border: 1px solid rgba(255,215,0,0.35);
    border-radius: 8px;
    font-family: 'Ma Shan Zheng', 'STKaiti', cursive;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 2px;
    animation: cardIn 0.4s ease-out;
  }
  @keyframes cardIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .poem-card:hover {
    box-shadow: 0 0 15px rgba(255,215,0,0.2);
    transform: translateY(-2px);
  }
  .poem-card.removing {
    animation: cardOut 0.3s ease-in forwards;
  }
  @keyframes cardOut {
    to { transform: scale(0) rotate(15deg); opacity: 0; }
  }

  /* ---------- 作品介绍 ---------- */
  .desc-section p {
    color: var(--text-dim);
    line-height: 1.8;
    font-size: 0.95rem;
    text-indent: 2em;
  }
  .tag-list {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 14px;
  }
  .tag {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    letter-spacing: 1px;
    border: 1px solid;
  }
  .tag.cyan  { color: var(--neon-cyan);  border-color: rgba(0,240,255,0.4); }
  .tag.pink  { color: var(--neon-pink);  border-color: rgba(255,45,149,0.4); }
  .tag.gold  { color: var(--neon-gold);  border-color: rgba(255,215,0,0.4); }
  .tag.purple{ color: var(--neon-purple); border-color: rgba(179,71,234,0.4); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; top: 30px; left: 50%;
    transform: translateX(-50%);
    padding: 14px 28px;
    background: rgba(0,0,0,0.9);
    border: 1px solid var(--neon-cyan);
    border-radius: 10px;
    color: var(--neon-cyan);
    font-size: 0.95rem;
    letter-spacing: 2px;
    z-index: 999;
    animation: toastIn 0.4s ease-out, toastOut 0.4s 2.5s ease-in forwards;
    pointer-events: none;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes toastOut {
    from { opacity: 1; }
    to { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 600px) {
    .demo-controls { flex-direction: column; }
    .demo-controls input { width: 100%; }
    .btn-demo { width: 100%; text-align: center; }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="main-container">

  <!-- 头部 -->
  <div class="header">
    <div class="logo-icon">☔</div>
    <h1>文 字 雨 诗 牌</h1>
    <div class="subtitle">赛博霓虹 · 诗意收集</div>
    <div class="divider"></div>
  </div>

  <!-- 文字雨演示区 -->
  <div class="card">
    <h2><span class="icon">🎮</span> 点击诗句，收集诗牌</h2>
    <canvas id="rainCanvas"></canvas>
    <div class="demo-controls">
      <input type="text" id="themeInput" placeholder="输入自定义主题，如：月夜、江湖、星空..." value="月夜">
      <button class="btn-demo" id="btnRain">🌧 下雨</button>
      <button class="btn-demo" id="btnClear" style="border-color:var(--neon-purple);color:var(--neon-purple);background:rgba(179,71,234,0.08);">清空</button>
    </div>
    <div class="theme-presets">
      <span class="theme-tag active" data-theme="月夜">月夜</span>
      <span class="theme-tag" data-theme="江湖">江湖</span>
      <span class="theme-tag" data-theme="星空">星空</span>
      <span class="theme-tag" data-theme="春日">春日</span>
      <span class="theme-tag" data-theme="相思">相思</span>
    </div>
  </div>

  <!-- 诗牌收集区 -->
  <div class="card">
    <h2><span class="icon">🏷</span> 我的诗牌</h2>
    <div class="poem-tray" id="poemTray"></div>
  </div>

  <!-- 作品介绍 -->
  <div class="card desc-section">
    <h2><span class="icon">✨</span> 关于这个作品</h2>
    <p>
      灵感来自赛博朋克美学与中国古典诗词的碰撞。输入主题关键词，诗句以霓虹文字雨的形式从天而降，
      点击"接住"心仪的诗句即可收集为诗牌。每个人都能拼凑出属于自己的、独一无二的诗集。
    </p>
    <p>
      纯前端实现：Canvas 2D 驱动文字雨粒子系统，霓虹光晕渲染，点击碰撞检测。
      赛博霓虹与中国风融合，打造视觉与诗意的双重体验。
    </p>
    <div class="tag-list">
      <span class="tag cyan">#Canvas</span>
      <span class="tag pink">#AI生成</span>
      <span class="tag gold">#中国风</span>
      <span class="tag purple">#赛博朋克</span>
      <span class="tag cyan">#交互艺术</span>
      <span class="tag pink">#粒子系统</span>
      <span class="tag gold">#诗词</span>
    </div>
  </div>

</div>

<script>
  // ========== 背景粒子系统 ==========
  const particlesCanvas = document.getElementById('particles');
  const pctx = particlesCanvas.getContext('2d');
  let pW, pH;
  const bgParticles = [];

  function resizeParticles() {
    pW = particlesCanvas.width = window.innerWidth;
    pH = particlesCanvas.height = window.innerHeight;
  }
  resizeParticles();
  window.addEventListener('resize', resizeParticles);

  class BgParticle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * pW;
      this.y = Math.random() * pH;
      this.size = Math.random() * 1.5 + 0.5;
      this.speedY = Math.random() * 0.3 + 0.1;
      this.opacity = Math.random() * 0.5 + 0.2;
      this.hue = [195, 330, 50, 280][Math.floor(Math.random() * 4)];
    }
    update() {
      this.y -= this.speedY;
      if (this.y < -10) { this.y = pH + 10; this.x = Math.random() * pW; }
    }
    draw() {
      pctx.beginPath();
      pctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      pctx.fillStyle = `hsla(${this.hue}, 90%, 65%, ${this.opacity})`;
      pctx.fill();
    }
  }
  for (let i = 0; i < 80; i++) bgParticles.push(new BgParticle());

  function animateBg() {
    pctx.clearRect(0, 0, pW, pH);
    bgParticles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animateBg);
  }
  animateBg();

  // ========== 文字雨 Canvas ==========
  const rainCanvas = document.getElementById('rainCanvas');
  const rctx = rainCanvas.getContext('2d');
  let rW, rH;

  function resizeRain() {
    const rect = rainCanvas.getBoundingClientRect();
    rW = rainCanvas.width = rect.width;
    rH = rainCanvas.height = rect.height;
  }
  resizeRain();
  window.addEventListener('resize', resizeRain);

  // 诗句库
  const poemDB = {
    default: [
      '霓虹深处觅诗魂','夜色如墨染长街','细雨无声润旧梦',
      '浮光掠影一瞬间','半城烟雨半城灯','风起云涌见真章',
      '星河倒挂入人间','千帆过尽皆不是','灯火阑珊处独行',
      '山高水长路漫漫','一蓑烟雨任平生','此心安处是吾乡',
      '大漠孤烟直如剑','长河落日圆如镜','春风又绿江南岸',
      '明月何时照我还','独钓寒江雪满舟','醉卧沙场君莫笑',
      '人生若只如初见','何事秋风悲画扇','落花人独立',
      '微雨燕双飞','海上生明月','天涯共此时',
    ],
    月夜: ['明月松间照','清泉石上流','月落乌啼霜满天','江枫渔火对愁眠','举杯邀明月','对影成三人','露从今夜白','月是故乡明'],
    江湖: ['一剑霜寒十四州','满堂花醉三千客','大漠孤烟直','长河落日圆','醉里挑灯看剑','梦回吹角连营','十步杀一人','千里不留行'],
    星空: ['星河欲转千帆舞','天接云涛连晓雾','纤云弄巧','飞星传恨','七八个星天外','两三点雨山前','星垂平野阔','月涌大江流'],
    春日: ['春风得意马蹄疾','一日看尽长安花','等闲识得东风面','万紫千红总是春','春眠不觉晓','处处闻啼鸟','乱花渐欲迷人眼','浅草才能没马蹄'],
    相思: ['红豆生南国','春来发几枝','愿君多采撷','此物最相思','玲珑骰子安红豆','入骨相思知不知','两情若是久长时','又岂在朝朝暮暮'],
  };

  const colors = [
    '#00f0ff','#ff2d95','#ffd700','#b347ea',
    '#00ff88','#ff6b35','#5ce0ff','#ff8ac4',
  ];

  class RainDrop {
    constructor(text, color) {
      this.reset(text, color);
    }
    reset(text, color) {
      this.text = text;
      this.color = color;
      this.x = Math.random() * (rW - 100) + 50;
      this.y = Math.random() * -100 - 20;
      this.speed = Math.random() * 1.5 + 0.8;
      this.size = Math.random() * 6 + 14;
      this.opacity = Math.random() * 0.4 + 0.6;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.02 + 0.005;
      this.wobbleAmp = Math.random() * 20 + 5;
      this.caught = false;
      this.hitBox = { x:0, y:0, w:0, h:0 };
    }
    update() {
      if (this.caught) return;
      this.y += this.speed;
      this.wobble += this.wobbleSpeed;
      this.opacity = 0.5 + Math.sin(this.wobble * 2) * 0.3;
      this.hitBox = {
        x: this.x + Math.sin(this.wobble) * this.wobbleAmp - this.text.length * this.size * 0.3,
        y: this.y - this.size * 0.7,
        w: this.text.length * this.size * 0.6,
        h: this.size * 1.2,
      };
      if (this.y > rH + 50) this.reset(this.text, this.color);
    }
    draw() {
      if (this.caught) return;
      const x = this.x + Math.sin(this.wobble) * this.wobbleAmp;
      rctx.save();
      rctx.globalAlpha = this.opacity;
      rctx.font = `bold ${this.size}px "Ma Shan Zheng", "STKaiti", "Microsoft YaHei", sans-serif`;
      rctx.textAlign = 'center';
      rctx.shadowColor = this.color;
      rctx.shadowBlur = 12;
      rctx.fillStyle = this.color;
      rctx.fillText(this.text, x, this.y);
      rctx.shadowBlur = 4;
      rctx.fillStyle = '#ffffff';
      rctx.globalAlpha = this.opacity * 0.6;
      rctx.fillText(this.text, x, this.y);
      rctx.restore();
    }
    hitTest(mx, my) {
      const hb = this.hitBox;
      return mx >= hb.x && mx <= hb.x + hb.w && my >= hb.y && my <= hb.y + hb.h;
    }
  }

  let rainDrops = [];
  const MAX_DROPS = 25;
  let currentTheme = '月夜';

  function spawnRain(theme) {
    const verses = poemDB[theme] || poemDB['default'];
    const needed = MAX_DROPS - rainDrops.length;
    for (let i = 0; i < needed; i++) {
      const text = verses[Math.floor(Math.random() * verses.length)];
      const color = colors[Math.floor(Math.random() * colors.length)];
      rainDrops.push(new RainDrop(text, color));
    }
  }

  function clearRain() { rainDrops = []; }

  function animateRain() {
    rctx.clearRect(0, 0, rW, rH);
    rctx.strokeStyle = 'rgba(0,240,255,0.03)';
    rctx.lineWidth = 0.5;
    for (let x = 0; x < rW; x += 40) {
      rctx.beginPath(); rctx.moveTo(x, 0); rctx.lineTo(x, rH); rctx.stroke();
    }
    for (let y = 0; y < rH; y += 40) {
      rctx.beginPath(); rctx.moveTo(0, y); rctx.lineTo(rW, y); rctx.stroke();
    }
    rainDrops.forEach(d => { d.update(); d.draw(); });
    requestAnimationFrame(animateRain);
  }

  spawnRain('月夜');
  animateRain();

  // 点击收集诗句
  rainCanvas.addEventListener('click', (e) => {
    const rect = rainCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    for (let i = rainDrops.length - 1; i >= 0; i--) {
      const d = rainDrops[i];
      if (!d.caught && d.hitTest(mx, my)) {
        d.caught = true;
        rainDrops.splice(i, 1);
        addPoemCard(d.text, d.color);
        const verses = poemDB[currentTheme] || poemDB['default'];
        rainDrops.push(new RainDrop(
          verses[Math.floor(Math.random() * verses.length)],
          colors[Math.floor(Math.random() * colors.length)]
        ));
        break;
      }
    }
  });

  // 诗牌收集
  function addPoemCard(text, color) {
    const tray = document.getElementById('poemTray');
    const card = document.createElement('span');
    card.className = 'poem-card';
    card.textContent = text;
    card.style.color = color;
    card.style.borderColor = color;
    card.title = '点击移除';
    card.addEventListener('click', () => {
      card.classList.add('removing');
      card.addEventListener('animationend', () => card.remove());
    });
    tray.appendChild(card);
  }

  // 预设主题标签
  document.querySelectorAll('.theme-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      document.querySelectorAll('.theme-tag').forEach(t => t.classList.remove('active'));
      tag.classList.add('active');
      currentTheme = tag.dataset.theme;
      document.getElementById('themeInput').value = currentTheme;
      clearRain();
      spawnRain(currentTheme);
      showToast(`🌧 主题切换：「${currentTheme}」`);
    });
  });

  // 按钮
  document.getElementById('btnRain').addEventListener('click', () => {
    const theme = document.getElementById('themeInput').value.trim();
    currentTheme = theme || 'default';
    document.querySelectorAll('.theme-tag').forEach(t => t.classList.remove('active'));
    clearRain();
    spawnRain(currentTheme);
    showToast(theme ? `🌧 「${theme}」的诗句正在飘落...` : '🌧 诗句正在飘落...');
  });

  document.getElementById('btnClear').addEventListener('click', () => {
    clearRain();
    document.getElementById('poemTray').innerHTML = '';
    showToast('🧹 已清空');
  });

  window.addEventListener('resize', () => {
    resizeRain();
    rainDrops.forEach(d => { if (!d.caught) d.reset(d.text, d.color); });
  });

  // Toast
  function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }
</script>

</body>
</html>
