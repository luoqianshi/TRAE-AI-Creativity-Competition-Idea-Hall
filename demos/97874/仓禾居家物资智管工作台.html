<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仓禾居家物资智管工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;0,9..144,900;1,9..144,400&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7F1E6;
  --cream-deep:#EFE6D4;
  --paper:#FBF7EE;
  --terracotta:#C65D3A;
  --terracotta-deep:#A8472A;
  --sage:#7A8B6F;
  --sage-deep:#5E6E54;
  --gold:#D4A574;
  --espresso:#2E1F15;
  --espresso-soft:#4A3829;
  --ink:#1A120B;
  --danger:#B83A2E;
  --warn:#D4923A;
  --ok:#6B8E5A;
  --line:rgba(46,31,21,.12);
  --line-strong:rgba(46,31,21,.24);
  --shadow:0 2px 0 rgba(46,31,21,.04), 0 18px 40px -24px rgba(46,31,21,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);font-family:"Noto Sans SC",sans-serif;font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(1200px 600px at 85% -5%, rgba(212,165,116,.22), transparent 60%),
    radial-gradient(900px 500px at -5% 30%, rgba(122,139,111,.16), transparent 55%),
    radial-gradient(700px 500px at 60% 110%, rgba(198,93,58,.12), transparent 60%),
    var(--cream);
  min-height:100vh;
  background-attachment:fixed;
}
/* grain overlay */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.5;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  mix-blend-mode:multiply;mix-blend-mode:soft-light;
}
.wrap{max-width:1320px;margin:0 auto;padding:36px 40px 80px;position:relative;z-index:2}

/* ============ TOP BAR ============ */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:34px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{
  width:52px;height:52px;border-radius:14px;
  background:linear-gradient(135deg,var(--terracotta) 0%,var(--terracotta-deep) 100%);
  display:grid;place-items:center;
  box-shadow:0 6px 18px -6px rgba(168,71,42,.55), inset 0 1px 0 rgba(255,255,255,.25);
  position:relative;
}
.brand-mark svg{width:28px;height:28px;color:var(--paper)}
.brand-mark::after{content:"";position:absolute;inset:-3px;border-radius:16px;border:1px dashed rgba(168,71,42,.4)}
.brand-text h1{font-family:"Fraunces",serif;font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--espresso);line-height:1.1}
.brand-text p{font-size:11.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--espresso-soft);font-weight:500;margin-top:3px}
.topbar-actions{display:flex;gap:10px;align-items:center}
.today-chip{
  font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--espresso);
  background:var(--paper);border:1px solid var(--line);padding:9px 14px;border-radius:999px;
  display:flex;align-items:center;gap:8px
}
.today-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 3px rgba(122,139,111,.2);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ============ HERO ============ */
.hero{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:22px;
  padding:30px 32px 28px;
  box-shadow:var(--shadow);
  position:relative;overflow:hidden;
  margin-bottom:28px;
}
.hero::before{
  content:"";position:absolute;top:-60px;right:-40px;width:280px;height:280px;
  background:radial-gradient(circle,rgba(212,165,116,.35),transparent 65%);
  pointer-events:none;
}
.hero-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px;position:relative}
.hero-title{font-family:"Fraunces",serif;font-weight:800;font-size:clamp(34px,4.4vw,52px);line-height:.98;letter-spacing:-.025em;color:var(--espresso)}
.hero-title em{font-style:italic;font-weight:400;color:var(--terracotta)}
.hero-sub{font-size:14px;color:var(--espresso-soft);max-width:380px;margin-top:10px;line-height:1.5}
.btn{
  font-family:"Noto Sans SC",sans-serif;font-weight:500;font-size:13.5px;
  border:none;cursor:pointer;border-radius:12px;padding:12px 20px;
  display:inline-flex;align-items:center;gap:8px;transition:transform .15s ease, box-shadow .15s ease;
  letter-spacing:.02em;
}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--espresso);color:var(--paper);box-shadow:0 4px 0 var(--ink), 0 10px 22px -10px rgba(26,18,11,.6)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink), 0 14px 26px -10px rgba(26,18,11,.7)}
.btn-primary:active{transform:translateY(1px);box-shadow:0 2px 0 var(--ink)}
.btn-ghost{background:transparent;color:var(--espresso);border:1px solid var(--line-strong)}
.btn-ghost:hover{background:var(--cream-deep)}
.btn-sage{background:var(--sage);color:var(--paper);box-shadow:0 4px 0 var(--sage-deep)}
.btn-sage:hover{transform:translateY(-2px)}

/* stat grid */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;position:relative}
.stat{
  background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:18px 20px;
  position:relative;overflow:hidden;transition:transform .2s ease;
}
.stat:hover{transform:translateY(-3px)}
.stat-label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--espresso-soft);font-weight:600}
.stat-num{font-family:"Fraunces",serif;font-weight:800;font-size:42px;line-height:1;margin-top:10px;letter-spacing:-.02em}
.stat-foot{font-size:12px;color:var(--espresso-soft);margin-top:6px}
.stat .icn{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px}
.stat.s1 .stat-num{color:var(--espresso)}
.stat.s1 .icn{background:rgba(46,31,21,.08)}
.stat.s2 .stat-num{color:var(--warn)}
.stat.s2 .icn{background:rgba(212,146,58,.16)}
.stat.s3 .stat-num{color:var(--danger)}
.stat.s3 .icn{background:rgba(184,58,46,.14)}
.stat.s4 .stat-num{color:var(--sage-deep)}
.stat.s4 .icn{background:rgba(122,139,111,.18)}

/* ============ MAIN GRID ============ */
.main-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:22px;align-items:start}
.panel{
  background:var(--paper);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);overflow:hidden;
}
.panel-head{padding:22px 24px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.panel-title{font-family:"Fraunces",serif;font-weight:700;font-size:20px;color:var(--espresso);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.panel-title .tag{font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:600;background:var(--cream-deep);color:var(--espresso-soft);padding:3px 8px;border-radius:6px;letter-spacing:.05em}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:12px;width:15px;height:15px;color:var(--espresso-soft);pointer-events:none}
.search input{
  font-family:inherit;font-size:13px;padding:9px 12px 9px 34px;border-radius:10px;
  border:1px solid var(--line);background:var(--cream);color:var(--ink);width:180px;outline:none;transition:border-color .15s
}
.search input:focus{border-color:var(--terracotta);background:var(--paper)}
.chip{
  font-size:12.5px;font-weight:500;padding:8px 13px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--cream);color:var(--espresso-soft);
  transition:all .15s ease;user-select:none;display:flex;align-items:center;gap:6px
}
.chip:hover{border-color:var(--line-strong)}
.chip.active{background:var(--espresso);color:var(--paper);border-color:var(--espresso)}
.chip .cnt{font-family:"JetBrains Mono",monospace;font-size:10.5px;opacity:.7}

/* product table */
.table-wrap{padding:6px 8px 8px}
.item{
  display:grid;grid-template-columns:38px 1.5fr 1fr 110px 100px 36px;gap:14px;align-items:center;
  padding:14px 16px;border-radius:14px;transition:background .15s;cursor:default;border:1px solid transparent
}
.item:hover{background:var(--cream);border-color:var(--line)}
.item + .item{margin-top:2px}
.emoji{font-size:22px;width:38px;height:38px;display:grid;place-items:center;background:var(--cream-deep);border-radius:10px}
.item-name{font-weight:500;font-size:14.5px;color:var(--espresso)}
.item-cat{font-size:11.5px;color:var(--espresso-soft);margin-top:2px;letter-spacing:.02em}
.item-loc{font-size:13px;color:var(--espresso-soft);display:flex;align-items:center;gap:6px}
.item-loc svg{width:13px;height:13px;opacity:.6}
.qty{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--espresso);font-weight:600}
.qty small{font-weight:400;color:var(--espresso-soft);margin-left:2px}
.badge{font-size:11px;font-weight:600;padding:5px 10px;border-radius:8px;text-align:center;letter-spacing:.02em;font-family:"JetBrains Mono",monospace}
.badge.ok{background:rgba(107,142,90,.14);color:var(--ok)}
.badge.warn{background:rgba(212,146,58,.18);color:#9a6a1f}
.badge.danger{background:rgba(184,58,46,.16);color:var(--danger)}
.del{background:none;border:none;cursor:pointer;color:var(--espresso-soft);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;opacity:0;transition:all .15s}
.item:hover .del{opacity:1}
.del:hover{background:rgba(184,58,46,.12);color:var(--danger)}
.del svg{width:15px;height:15px}

/* right column */
.right-col{display:flex;flex-direction:column;gap:22px}

/* alerts */
.alerts-list{padding:8px 14px 16px;max-height:340px;overflow-y:auto}
.alert{
  display:flex;gap:12px;padding:13px 12px;border-radius:12px;background:var(--cream);border:1px solid var(--line);
  margin-top:8px;position:relative;
}
.alert:first-child{margin-top:0}
.alert.exp{border-left:3px solid var(--danger)}
.alert.soon{border-left:3px solid var(--warn)}
.alert-emoji{font-size:22px}
.alert-body{flex:1;min-width:0}
.alert-name{font-size:13.5px;font-weight:600;color:var(--espresso)}
.alert-meta{font-size:11.5px;color:var(--espresso-soft);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alert-meta .pill{font-family:"JetBrains Mono",monospace;font-weight:600;font-size:10.5px;padding:2px 7px;border-radius:5px}
.alert.exp .pill{background:rgba(184,58,46,.14);color:var(--danger)}
.alert.soon .pill{background:rgba(212,146,58,.16);color:#9a6a1f}
.alert-empty{text-align:center;padding:30px 20px;color:var(--espresso-soft);font-size:13px}
.alert-empty .big{font-size:34px;display:block;margin-bottom:6px;opacity:.5}

/* shopping list */
.shop-summary{
  padding:18px 24px;background:linear-gradient(135deg,rgba(122,139,111,.12),rgba(212,165,116,.08));
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px
}
.shop-summary .lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--espresso-soft);font-weight:600}
.shop-summary .num{font-family:"Fraunces",serif;font-weight:800;font-size:30px;color:var(--sage-deep);line-height:1;margin-top:4px}
.shop-list{padding:10px 14px 16px;max-height:340px;overflow-y:auto}
.shop-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;transition:background .15s;
}
.shop-item:hover{background:var(--cream)}
.shop-check{width:20px;height:20px;border:1.5px solid var(--line-strong);border-radius:6px;cursor:pointer;flex-shrink:0;display:grid;place-items:center;transition:all .15s}
.shop-check.on{background:var(--sage);border-color:var(--sage)}
.shop-check.on svg{width:13px;height:13px;color:var(--paper)}
.shop-name{flex:1;font-size:13.5px;color:var(--espresso);font-weight:500}
.shop-qty{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--espresso-soft);font-weight:600;background:var(--cream-deep);padding:4px 8px;border-radius:6px}
.shop-empty{text-align:center;padding:30px 20px;color:var(--espresso-soft);font-size:13px}
.shop-empty .big{font-size:34px;display:block;margin-bottom:6px;opacity:.5}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(26,18,11,.5);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;animation:fade .2s ease}
.modal-bg.show{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--paper);border-radius:22px;width:100%;max-width:520px;
  box-shadow:0 30px 80px -20px rgba(26,18,11,.6);overflow:hidden;
  animation:pop .25s cubic-bezier(.2,.9,.3,1.1)
}
@keyframes pop{from{transform:translateY(20px) scale(.96);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.modal-head{padding:24px 26px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-family:"Fraunces",serif;font-weight:700;font-size:22px;color:var(--espresso);letter-spacing:-.01em}
.modal-close{background:none;border:none;cursor:pointer;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--espresso-soft);transition:background .15s}
.modal-close:hover{background:var(--cream-deep)}
.modal-body{padding:22px 26px 26px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--espresso-soft);margin-bottom:7px}
.field input,.field select,.field textarea{
  width:100%;font-family:inherit;font-size:14px;padding:11px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--cream);color:var(--ink);outline:none;transition:border-color .15s
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--terracotta);background:var(--paper)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cat-picker{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cat-opt{padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--cream);text-align:center;cursor:pointer;transition:all .15s;font-size:11px;color:var(--espresso-soft)}
.cat-opt .e{font-size:20px;display:block;margin-bottom:3px}
.cat-opt:hover{border-color:var(--line-strong)}
.cat-opt.sel{background:var(--espresso);color:var(--paper);border-color:var(--espresso)}
.modal-foot{padding:16px 26px 24px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line)}

/* toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--espresso);color:var(--paper);padding:13px 22px;border-radius:12px;font-size:13.5px;z-index:200;box-shadow:0 14px 40px -10px rgba(26,18,11,.6);transition:transform .35s cubic-bezier(.2,.9,.3,1.1);display:flex;align-items:center;gap:10px}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast svg{width:17px;height:17px;color:var(--gold)}

/* scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(46,31,21,.18);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(46,31,21,.3)}

/* footer */
.foot{text-align:center;margin-top:40px;font-size:12px;color:var(--espresso-soft);letter-spacing:.06em}
.foot em{font-family:"Fraunces",serif;font-style:italic;color:var(--terracotta)}

/* stagger reveal */
.reveal{opacity:0;transform:translateY(14px);animation:rv .6s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes rv{to{opacity:1;transform:translateY(0)}}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}.d4{animation-delay:.26s}.d5{animation-delay:.33s}.d6{animation-delay:.4s}

@media(max-width:980px){
  .main-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .item{grid-template-columns:38px 1.5fr 90px 90px 36px;font-size:12.5px}
  .item-loc{display:none}
  .wrap{padding:24px 18px 60px}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- TOPBAR -->
  <header class="topbar reveal d1">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      </div>
      <div class="brand-text">
        <h1>仓禾 · 居家物资智管工作台</h1>
        <p>Canghe Home Inventory</p>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="today-chip"><span class="dot"></span><span id="todayStr">—</span></div>
      <button class="btn btn-primary" onclick="openModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        录入物资
      </button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero reveal d2">
    <div class="hero-head">
      <div>
        <h2 class="hero-title">家中万物，<em>心中有数</em></h2>
        <p class="hero-sub">录入保质期与存放位置，临期自动预警，缺货一键汇总。让囤货不再变成浪费，让翻柜子成为过去式。</p>
      </div>
      <button class="btn btn-sage" onclick="exportShopList()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        一键汇总采购清单
      </button>
    </div>
    <div class="stats">
      <div class="stat s1">
        <div class="icn">📦</div>
        <div class="stat-label">在册物资</div>
        <div class="stat-num" id="stTotal">0</div>
        <div class="stat-foot">件 · 全屋在管</div>
      </div>
      <div class="stat s2">
        <div class="icn">⏳</div>
        <div class="stat-label">临期预警</div>
        <div class="stat-num" id="stSoon">0</div>
        <div class="stat-foot">件 · 7日内到期</div>
      </div>
      <div class="stat s3">
        <div class="icn">⚠️</div>
        <div class="stat-label">已过期</div>
        <div class="stat-num" id="stExp">0</div>
        <div class="stat-foot">件 · 建议丢弃</div>
      </div>
      <div class="stat s4">
        <div class="icn">🛒</div>
        <div class="stat-label">采购缺口</div>
        <div class="stat-num" id="stLow">0</div>
        <div class="stat-foot">件 · 库存不足</div>
      </div>
    </div>
  </section>

  <!-- MAIN GRID -->
  <div class="main-grid">

    <!-- LEFT: product list -->
    <section class="panel reveal d3">
      <div class="panel-head">
        <div class="panel-title">物资台账 <span class="tag" id="cntTag">0 项</span></div>
        <div class="filters">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="searchInput" placeholder="搜索物资名称…">
          </div>
          <div class="chip active" data-filter="all">全部 <span class="cnt" id="cAll">0</span></div>
          <div class="chip" data-filter="soon">临期 <span class="cnt" id="cSoon">0</span></div>
          <div class="chip" data-filter="exp">过期 <span class="cnt" id="cExp">0</span></div>
          <div class="chip" data-filter="low">缺口 <span class="cnt" id="cLow">0</span></div>
        </div>
      </div>
      <div class="table-wrap" id="itemList"></div>
    </section>

    <!-- RIGHT: alerts + shopping list -->
    <div class="right-col">
      <section class="panel reveal d4">
        <div class="panel-head">
          <div class="panel-title">临期与过期提醒 <span class="tag">自动</span></div>
        </div>
        <div class="alerts-list" id="alertsList"></div>
      </section>

      <section class="panel reveal d5">
        <div class="shop-summary">
          <div>
            <div class="lbl">采购缺口清单</div>
            <div class="num" id="shopNum">0 项</div>
          </div>
          <button class="btn btn-ghost" onclick="clearChecked()" style="font-size:12px;padding:9px 14px">清除已购</button>
        </div>
        <div class="shop-list" id="shopList"></div>
      </section>
    </div>
  </div>

  <div class="foot reveal d6">仓禾 · <em>居家物资智管工作台</em> · 让每一件囤货都被记得</div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">录入新物资</h3>
      <button class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>物资名称</label>
        <input type="text" id="fName" placeholder="如：海天金标生抽">
      </div>
      <div class="field">
        <label>分类</label>
        <div class="cat-picker" id="catPicker"></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>数量</label>
          <input type="number" id="fQty" placeholder="1" min="0" step="1">
        </div>
        <div class="field">
          <label>单位</label>
          <input type="text" id="fUnit" placeholder="瓶 / 包 / 袋">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>保质期至</label>
          <input type="date" id="fExp">
        </div>
        <div class="field">
          <label>存放位置</label>
          <input type="text" id="fLoc" placeholder="如：厨房吊柜·左">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>安全库存（低于此值提示补货）</label>
          <input type="number" id="fMin" placeholder="1" min="0" step="1">
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveItem()">保存入库</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastMsg">已保存</span>
</div>

<script>
/* ============ DATA ============ */
const CATEGORIES = [
  {key:'零食', emoji:'🍬'},
  {key:'调料', emoji:'🧂'},
  {key:'饮品', emoji:'🧃'},
  {key:'粮油', emoji:'🌾'},
  {key:'护肤', emoji:'🧴'},
  {key:'日用', emoji:'🧻'},
  {key:'冷藏', emoji:'🧊'},
  {key:'药品', emoji:'💊'},
  {key:'其他', emoji:'📦'}
];

const SEED = [
  {id:1,name:'海天金标生抽',cat:'调料',emoji:'🧂',qty:2,unit:'瓶',exp:'2026-08-15',loc:'厨房吊柜·左',min:1},
  {id:2,name:'三只松鼠每日坚果',cat:'零食',emoji:'🥜',qty:1,unit:'盒',exp:'2026-07-13',loc:'客厅零食柜',min:2},
  {id:3,name:'伊利安慕希酸奶',cat:'冷藏',emoji:'🥛',qty:4,unit:'盒',exp:'2026-07-12',loc:'冰箱冷藏·上层',min:6},
  {id:4,name:'舒肤佳沐浴露',cat:'日用',emoji:'🧴',qty:1,unit:'瓶',exp:'2027-06-30',loc:'浴室储物架',min:1},
  {id:5,name:'李锦记蚝油',cat:'调料',emoji:'🧴',qty:0,unit:'瓶',exp:'2026-09-20',loc:'厨房吊柜·右',min:1},
  {id:6,name:'农夫山泉 4L',cat:'饮品',emoji:'💧',qty:1,unit:'桶',exp:'2027-01-10',loc:'阳台储物柜',min:2},
  {id:7,name:'金龙鱼大米 5kg',cat:'粮油',emoji:'🌾',qty:1,unit:'袋',exp:'2026-11-30',loc:'厨房米桶',min:1},
  {id:8,name:'布洛芬缓释胶囊',cat:'药品',emoji:'💊',qty:1,unit:'盒',exp:'2025-12-15',loc:'药箱·上层',min:1},
  {id:9,name:'上好佳洋葱圈',cat:'零食',emoji:'🍿',qty:3,unit:'包',exp:'2026-10-01',loc:'客厅零食柜',min:2},
  {id:10,name:'欧莱雅紫熨斗眼霜',cat:'护肤',emoji:'🧴',qty:1,unit:'支',exp:'2026-04-20',loc:'梳妆台·抽屉',min:1},
  {id:11,name:'心相印抽纸',cat:'日用',emoji:'🧻',qty:2,unit:'条',exp:'2028-05-01',loc:'储物间·货架2',min:4},
  {id:12,name:'湾仔码头水饺',cat:'冷藏',emoji:'🥟',qty:2,unit:'袋',exp:'2026-07-14',loc:'冰箱冷冻·下层',min:2},
];

let items = JSON.parse(JSON.stringify(SEED));
let editId = null;
let curFilter = 'all';
let curSearch = '';
let selCat = '调料';
let shopChecked = new Set();

/* ============ HELPERS ============ */
function daysTo(exp){
  const today = new Date(); today.setHours(0,0,0,0);
  const e = new Date(exp); e.setHours(0,0,0,0);
  return Math.round((e - today) / 86400000);
}
function statusOf(it){
  const d = daysTo(it.exp);
  if(d < 0) return 'danger';
  if(d <= 7) return 'warn';
  return 'ok';
}
function fmtDate(s){
  const d = new Date(s);
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function uid(){return Date.now() + Math.floor(Math.random()*1000)}

/* ============ RENDER ============ */
function render(){
  const today = new Date();
  document.getElementById('todayStr').textContent = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;

  // stats
  const soon = items.filter(i=>{const d=daysTo(i.exp);return d>=0 && d<=7}).length;
  const exp = items.filter(i=>daysTo(i.exp)<0).length;
  const low = items.filter(i=>i.qty <= i.min).length;
  document.getElementById('stTotal').textContent = items.length;
  document.getElementById('stSoon').textContent = soon;
  document.getElementById('stExp').textContent = exp;
  document.getElementById('stLow').textContent = low;
  document.getElementById('cAll').textContent = items.length;
  document.getElementById('cSoon').textContent = soon;
  document.getElementById('cExp').textContent = exp;
  document.getElementById('cLow').textContent = low;

  // list
  let list = items.filter(it=>{
    if(curSearch && !it.name.toLowerCase().includes(curSearch.toLowerCase())) return false;
    if(curFilter==='soon') return daysTo(it.exp)>=0 && daysTo(it.exp)<=7;
    if(curFilter==='exp') return daysTo(it.exp)<0;
    if(curFilter==='low') return it.qty <= it.min;
    return true;
  });
  document.getElementById('cntTag').textContent = `${list.length} 项`;

  const box = document.getElementById('itemList');
  if(list.length===0){
    box.innerHTML = `<div class="alert-empty"><span class="big">🗂️</span>没有符合条件的物资</div>`;
  }else{
    box.innerHTML = list.map(it=>{
      const st = statusOf(it);
      const d = daysTo(it.exp);
      let badgeText;
      if(st==='danger') badgeText = `已过期 ${Math.abs(d)}天`;
      else if(st==='warn') badgeText = d===0 ? '今日到期' : `剩 ${d}天`;
      else badgeText = fmtDate(it.exp);
      return `<div class="item" ondblclick="editItem(${it.id})">
        <div class="emoji">${it.emoji||'📦'}</div>
        <div>
          <div class="item-name">${it.name}</div>
          <div class="item-cat">${it.cat} · ${it.loc}</div>
        </div>
        <div class="item-loc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${it.loc}</div>
        <div class="qty">${it.qty}<small>${it.unit}</small></div>
        <div class="badge ${st}">${badgeText}</div>
        <button class="del" onclick="delItem(${it.id})" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
      </div>`;
    }).join('');
  }

  // alerts
  const alerts = items
    .filter(it=>daysTo(it.exp)<=7)
    .sort((a,b)=>daysTo(a.exp)-daysTo(b.exp));
  const ab = document.getElementById('alertsList');
  if(alerts.length===0){
    ab.innerHTML = `<div class="alert-empty"><span class="big">✨</span>近期无临期物资，安心囤货</div>`;
  }else{
    ab.innerHTML = alerts.map(it=>{
      const st = statusOf(it);
      const cls = st==='danger'?'exp':'soon';
      const d = daysTo(it.exp);
      const pill = st==='danger' ? `已过期 ${Math.abs(d)}天` : (d===0?'今日到期':`${d}天后`);
      return `<div class="alert ${cls}">
        <div class="alert-emoji">${it.emoji||'📦'}</div>
        <div class="alert-body">
          <div class="alert-name">${it.name}</div>
          <div class="alert-meta">
            <span class="pill">${pill}</span>
            <span>${it.loc}</span>
            <span>· 还剩 ${it.qty} ${it.unit}</span>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  // shopping list (qty <= min)
  const lowItems = items.filter(it=>it.qty <= it.min);
  document.getElementById('shopNum').textContent = `${lowItems.length} 项`;
  const sb = document.getElementById('shopList');
  if(lowItems.length===0){
    sb.innerHTML = `<div class="shop-empty"><span class="big">✅</span>库存充足，暂无需采购</div>`;
  }else{
    sb.innerHTML = lowItems.map(it=>{
      const need = Math.max(it.min - it.qty + 1, 1);
      const on = shopChecked.has(it.id);
      return `<div class="shop-item">
        <div class="shop-check ${on?'on':''}" onclick="toggleShop(${it.id})">
          ${on?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>':''}
        </div>
        <div class="shop-name" style="${on?'text-decoration:line-through;opacity:.5':''}">${it.emoji||'📦'} ${it.name}</div>
        <div class="shop-qty">买 ${need} ${it.unit}</div>
      </div>`;
    }).join('');
  }
}

/* ============ ACTIONS ============ */
function delItem(id){
  items = items.filter(i=>i.id!==id);
  render();
  toast('已删除');
}
function editItem(id){
  const it = items.find(i=>i.id===id);
  if(!it) return;
  editId = id;
  document.getElementById('modalTitle').textContent = '编辑物资';
  document.getElementById('fName').value = it.name;
  document.getElementById('fQty').value = it.qty;
  document.getElementById('fUnit').value = it.unit;
  document.getElementById('fExp').value = it.exp;
  document.getElementById('fLoc').value = it.loc;
  document.getElementById('fMin').value = it.min;
  selCat = it.cat;
  buildCatPicker();
  document.getElementById('modalBg').classList.add('show');
}
function openModal(){
  editId = null;
  document.getElementById('modalTitle').textContent = '录入新物资';
  ['fName','fQty','fUnit','fExp','fLoc','fMin'].forEach(id=>document.getElementById(id).value='');
  selCat = '零食';
  buildCatPicker();
  document.getElementById('modalBg').classList.add('show');
  setTimeout(()=>document.getElementById('fName').focus(),100);
}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}
function buildCatPicker(){
  const box = document.getElementById('catPicker');
  box.innerHTML = CATEGORIES.map(c=>`<div class="cat-opt ${c.key===selCat?'sel':''}" onclick="pickCat('${c.key}')"><span class="e">${c.emoji}</span>${c.key}</div>`).join('');
}
function pickCat(k){selCat=k;buildCatPicker()}
function saveItem(){
  const name = document.getElementById('fName').value.trim();
  if(!name){toast('请填写物资名称');return}
  const catObj = CATEGORIES.find(c=>c.key===selCat) || CATEGORIES[0];
  const data = {
    name,
    cat: catObj.key,
    emoji: catObj.emoji,
    qty: parseInt(document.getElementById('fQty').value)||0,
    unit: document.getElementById('fUnit').value.trim() || '个',
    exp: document.getElementById('fExp').value || '2099-12-31',
    loc: document.getElementById('fLoc').value.trim() || '未分类',
    min: parseInt(document.getElementById('fMin').value)||0
  };
  if(editId){
    const it = items.find(i=>i.id===editId);
    Object.assign(it, data);
    toast('已更新');
  }else{
    items.unshift({id:uid(),...data});
    toast('已入库 · '+name);
  }
  closeModal();
  render();
}
function toggleShop(id){
  if(shopChecked.has(id)) shopChecked.delete(id);
  else shopChecked.add(id);
  render();
}
function clearChecked(){
  if(shopChecked.size===0){toast('暂无已购项');return}
  shopChecked.clear();
  render();
  toast('已清除勾选');
}
function exportShopList(){
  const low = items.filter(it=>it.qty<=it.min);
  if(low.length===0){toast('库存充足，无需采购');return}
  const lines = low.map(it=>{
    const need = Math.max(it.min-it.qty+1,1);
    return `${it.emoji||'📦'} ${it.name} —— 买 ${need} ${it.unit}（存放：${it.loc}）`;
  });
  const text = `仓禾居家物资 · 采购清单\n生成时间：${new Date().toLocaleString('zh-CN')}\n共 ${low.length} 项\n${'─'.repeat(20)}\n` + lines.join('\n');
  const blob = new Blob([text],{type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `采购清单_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  toast('采购清单已导出');
}
function toast(msg){
  document.getElementById('toastMsg').textContent = msg;
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============ EVENTS ============ */
document.querySelectorAll('.chip[data-filter]').forEach(c=>{
  c.addEventListener('click',()=>{
    document.querySelectorAll('.chip[data-filter]').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    curFilter = c.dataset.filter;
    render();
  });
});
document.getElementById('searchInput').addEventListener('input',e=>{
  curSearch = e.target.value;
  render();
});
document.getElementById('modalBg').addEventListener('click',e=>{
  if(e.target.id==='modalBg') closeModal();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='n' && e.ctrlKey){e.preventDefault();openModal()}
});

/* init */
render();
</script>
</body>
</html>
