<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperMap - 文献经纬</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #10b981;
            --accent: #f59e0b;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #334155;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(99, 102, 241, 0.1) 100%);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .logo-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .header-stats {
            display: flex;
            gap: 2rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Main Layout */
        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 320px 1fr 360px;
            gap: 1.5rem;
            min-height: calc(100vh - 80px);
        }

        /* Panels */
        .panel {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        /* Upload Zone */
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-zone.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
        }

        .upload-text {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        /* Quick Add */
        .quick-add {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .quick-add input {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.625rem 0.875rem;
            color: var(--text-primary);
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .quick-add input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 0.625rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-dark);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-card-hover);
        }

        .btn-icon {
            padding: 0.5rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        /* Filter Tags */
        .filter-section {
            margin-bottom: 1rem;
        }

        .filter-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: block;
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.375rem;
        }

        .filter-tag {
            padding: 0.25rem 0.625rem;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tag:hover, .filter-tag.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Paper List */
        .paper-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .paper-item {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .paper-item:hover {
            border-color: var(--primary);
            transform: translateX(4px);
        }

        .paper-item.selected {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .paper-title {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.375rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .paper-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .paper-meta .landmark {
            color: var(--accent);
        }

        .paper-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.125rem 0.5rem;
            border-radius: 4px;
            font-size: 0.625rem;
            font-weight: 500;
        }

        .badge-cluster {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
        }

        .badge-landmark {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent);
        }

        /* Network Graph */
        .graph-container {
            flex: 1;
            background: var(--bg-dark);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        #network-graph {
            width: 100%;
            height: 100%;
            min-height: 500px;
        }

        .graph-controls {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .graph-control-btn {
            width: 36px;
            height: 36px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .graph-control-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .graph-legend {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.375rem;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .legend-dot.landmark {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        .legend-dot.normal {
            background: var(--primary);
        }

        .legend-dot.cluster-1 { background: #6366f1; }
        .legend-dot.cluster-2 { background: #22c55e; }
        .legend-dot.cluster-3 { background: #f59e0b; }
        .legend-dot.cluster-4 { background: #ef4444; }

        /* Paper Detail Panel */
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .detail-title {
            font-size: 1.125rem;
            font-weight: 600;
            line-height: 1.4;
            flex: 1;
            padding-right: 1rem;
        }

        .detail-section {
            margin-bottom: 1.25rem;
        }

        .detail-section-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .detail-text {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.375rem;
        }

        .detail-tag {
            padding: 0.25rem 0.625rem;
            background: var(--bg-dark);
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 2rem;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 0.875rem;
        }

        /* View Tabs */
        .view-tabs {
            display: flex;
            gap: 0.25rem;
            background: var(--bg-dark);
            padding: 0.25rem;
            border-radius: 8px;
        }

        .view-tab {
            flex: 1;
            padding: 0.5rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .view-tab:hover {
            color: var(--text-secondary);
        }

        .view-tab.active {
            background: var(--primary);
            color: white;
        }

        /* Citation Relations */
        .citation-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .citation-item {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            padding: 0.625rem;
            background: var(--bg-dark);
            border-radius: 8px;
            font-size: 0.8125rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .citation-item:hover {
            background: var(--bg-card-hover);
        }

        .citation-icon {
            color: var(--text-muted);
            margin-top: 0.125rem;
        }

        .citation-icon.in { color: var(--success); }
        .citation-icon.out { color: var(--primary); }

        /* Timeline View */
        .timeline-container {
            display: none;
            padding: 1rem;
            overflow-y: auto;
        }

        .timeline-container.active {
            display: block;
        }

        .timeline-year {
            margin-bottom: 2rem;
        }

        .timeline-year-label {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--primary);
        }

        .timeline-papers {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.75rem;
        }

        .timeline-paper {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .timeline-paper:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .timeline-paper.landmark {
            border-color: var(--accent);
            background: rgba(245, 158, 11, 0.05);
        }

        .timeline-paper-title {
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .timeline-paper-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 2rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-dark);
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .modal-body {
            padding: 1.25rem;
            overflow-y: auto;
            flex: 1;
        }

        /* Search */
        .search-box {
            position: relative;
            margin-bottom: 1rem;
        }

        .search-box input {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.625rem 0.875rem 0.625rem 2.5rem;
            color: var(--text-primary);
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .panel {
                max-height: 400px;
            }

            .graph-container {
                min-height: 400px;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease forwards;
        }

        /* Sample Data Banner */
        .sample-banner {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(16, 185, 129, 0.1));
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sample-banner-text {
            font-size: 0.8125rem;
            color: var(--text-secondary);
        }

        .sample-banner-text strong {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🗺️</div>
                <div class="logo-text">
                    <h1>PaperMap</h1>
                    <span>文献经纬 · 智能文献分析系统</span>
                </div>
            </div>
            <div class="header-stats">
                <div class="stat-item">
                    <div class="stat-value" id="stat-papers">0</div>
                    <div class="stat-label">论文数量</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-citations">0</div>
                    <div class="stat-label">引用关系</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-clusters">0</div>
                    <div class="stat-label">技术流派</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <!-- Left Panel: Paper List -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <span>📚</span>
                    文献库
                </div>
            </div>
            <div class="panel-content">
                <!-- Upload Zone -->
                <div class="upload-zone" id="upload-zone">
                    <div class="upload-icon">📄</div>
                    <div class="upload-text">拖拽PDF文件或点击上传</div>
                    <div class="upload-hint">支持批量上传 · 单文件≤50MB</div>
                </div>
                <input type="file" id="file-input" multiple accept=".pdf" style="display: none;">

                <!-- Quick Add -->
                <div class="quick-add">
                    <input type="text" id="quick-add-input" placeholder="快速添加论文标题...">
                    <button class="btn btn-primary" onclick="addPaper()">+</button>
                </div>

                <!-- Sample Data -->
                <div class="sample-banner">
                    <div class="sample-banner-text">
                        <strong>演示模式</strong>：点击加载示例数据
                    </div>
                    <button class="btn btn-secondary" onclick="loadSampleData()">加载示例</button>
                </div>

                <!-- Search -->
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="搜索论文标题、作者..." oninput="filterPapers()">
                </div>

                <!-- Filter -->
                <div class="filter-section">
                    <span class="filter-label">筛选流派</span>
                    <div class="filter-tags" id="filter-tags"></div>
                </div>

                <!-- Paper List -->
                <div class="paper-list" id="paper-list"></div>
            </div>
        </div>

        <!-- Center: Graph View -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <span>🔗</span>
                    引文网络图
                </div>
                <div class="view-tabs">
                    <button class="view-tab active" onclick="switchView('network')">网络图</button>
                    <button class="view-tab" onclick="switchView('timeline')">时间线</button>
                </div>
            </div>
            <div class="panel-content" style="padding: 0;">
                <div class="graph-container" id="graph-container">
                    <div id="network-graph"></div>
                    <div class="graph-controls">
                        <button class="graph-control-btn" onclick="zoomIn()" title="放大">+</button>
                        <button class="graph-control-btn" onclick="zoomOut()" title="缩小">−</button>
                        <button class="graph-control-btn" onclick="fitNetwork()" title="适应屏幕">⊡</button>
                    </div>
                    <div class="graph-legend">
                        <div class="legend-item">
                            <div class="legend-dot landmark"></div>
                            <span>关键节点论文</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot normal"></div>
                            <span>普通论文</span>
                        </div>
                    </div>
                </div>

                <!-- Timeline View -->
                <div class="timeline-container" id="timeline-container"></div>
            </div>
        </div>

        <!-- Right Panel: Detail -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <span>📖</span>
                    论文详情
                </div>
            </div>
            <div class="panel-content" id="detail-panel">
                <div class="empty-state">
                    <div class="empty-state-icon">📋</div>
                    <div class="empty-state-text">选择一篇论文查看详情</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">论文详情</div>

    <script>

        // ========== Sample Data ==========

            {

                cluster: "Graph / Network",
                is_landmark: false,
                citation_count: 38,
                contributions: "Provided comprehensive survey of graph neural network architectures.",
                methods: "Message passing, graph convolution, pooling",
                keywords: "GNN, graph neural network, graph representation learning"
            },
            {
                id: 10,
                title: "Deep Residual Learning for Image Recognition",
                authors: "He et al.",
                year: 2016,
                venue: "CVPR",
                abstract: "Deeper neural networks are more difficult to train. We present a residual learning framework.",
                cluster: "Computer Vision",
                is_landmark: true,
                citation_count: 52,
                contributions: "Enabled training of networks over 1000 layers deep.",
                methods: "Skip connections, residual blocks",
                keywords: "ResNet, skip connection, deep learning"
            },
            {
                id: 11,
                title: "U-Net: Convolutional Networks for Biomedical Image Segmentation",
                authors: "Ronneberger et al.",
                year: 2015,
                venue: "MICCAI",
                abstract: "There is large consent that successful training of deep networks requires many thousand annotated training samples.",
                cluster: "Computer Vision",
                is_landmark: false,
                citation_count: 42,
                contributions: "Proposed encoder-decoder architecture for efficient biomedical image segmentation.",
                methods: "Encoder-decoder, skip connections, upsampling",
                keywords: "U-Net, image segmentation, biomedical imaging"
            },
            {
                id: 12,
                title: "Transformer-XL: Attentive Language Models Beyond a Fixed-Length Context",
                authors: "Dai et al.",
                year: 2019,
                venue: "ACL",
                abstract: "Transformers have a potential of learning longer-term dependency, but are limited by fixed-length contexts.",
                cluster: "Natural Language Processing",
                is_landmark: false,
                citation_count: 33,
                contributions: "Introduced recurrence mechanism and relative positional encoding for Transformers.",
                methods: "Segment-level recurrence, relative positional encoding",
                keywords: "Transformer-XL, long dependency, language model"
            }
        ];

        const sampleCitations = [
            { from: 2, to: 1, type: "extends" },
            { from: 3, to: 1, type: "extends" },
            { from: 3, to: 2, type: "extends" },
            { from: 4, to: 6, type: "improves" },
            { from: 5, to: 6, type: "uses" },
            { from: 6, to: 8, type: "uses" },
            { from: 7, to: 1, type: "precedes" },
            { from: 9, to: 1, type: "extends" },
            { from: 10, to: 4, type: "extends" },
            { from: 11, to: 6, type: "extends" },
            { from: 12, to: 1, type: "extends" },
            { from: 12, to: 2, type: "extends" },
            { from: 2, to: 7, type: "builds_on" },
            { from: 4, to: 8, type: "uses" },
        ];

        // ========== Initialization ==========
        document.addEventListener('DOMContentLoaded', () => {
            initUploadZone();
            updateStats();
        });

        // ========== Upload Zone ==========
        function initUploadZone() {
            const zone = document.getElementById('upload-zone');
            const input = document.getElementById('file-input');

            zone.addEventListener('click', () => input.click());

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('dragover');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('dragover');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });

            input.addEventListener('change', (e) => {
                handleFiles(e.target.files);
            });
        }

        function handleFiles(files) {
            // In real implementation, would upload to backend
            alert(`${files.length} 个文件已选择。后端API准备好后将自动解析论文元数据。`);
        }

        // ========== Sample Data ==========
        function loadSampleData() {
            papers = JSON.parse(JSON.stringify(samplePapers));
            citations = JSON.parse(JSON.stringify(sampleCitations));
            renderPaperList();
            renderFilterTags();
            renderNetworkGraph();
            renderTimeline();
            updateStats();
        }

        // ========== Paper Management ==========
        function addPaper() {
            const input = document.getElementById('quick-add-input');
            const title = input.value.trim();

            if (!title) return;

            const newPaper = {
                id: Date.now(),
                title: title,
                authors: "未知作者",
                year: new Date().getFullYear(),
                venue: "未知",
                abstract: "",
                cluster: "General",
                is_landmark: false,
                citation_count: 0,
                contributions: "",
                methods: "",
                keywords: ""
            };

            papers.push(newPaper);
            input.value = '';
            renderPaperList();
            renderFilterTags();
            renderNetworkGraph();
            renderTimeline();
            updateStats();
        }

        function filterPapers() {
            const query = document.getElementById('search-input').value.toLowerCase();
            renderPaperList(query);
        }

        function renderPaperList(searchQuery = '') {
            const container = document.getElementById('paper-list');
            let filtered = papers;

            if (searchQuery) {
                filtered = papers.filter(p =>
                    p.title.toLowerCase().includes(searchQuery) ||
                    (p.authors && p.authors.toLowerCase().includes(searchQuery))
                );
            }

            if (activeFilter !== 'all') {
                filtered = filtered.filter(p => p.cluster === activeFilter);
            }

            container.innerHTML = filtered.map(paper => `
                <div class="paper-item ${paper.id === selectedPaperId ? 'selected' : ''}"
                     onclick="selectPaper(${paper.id})">
                    <div class="paper-title">${paper.title}</div>
                    <div class="paper-meta">
                        <span>${paper.authors || '未知'}</span>
                        <span>·</span>
                        <span>${paper.year || '未知年份'}</span>
                        ${paper.is_landmark ? '<span class="landmark">⭐ 关键论文</span>' : ''}
                    </div>
                    <div class="paper-meta" style="margin-top: 0.375rem;">
                        <span class="paper-badge badge-cluster">${paper.cluster || 'General'}</span>
                        <span style="margin-left: auto; color: var(--text-muted);">
                            被引 ${paper.citation_count || 0}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        function renderFilterTags() {
            const container = document.getElementById('filter-tags');
            const clusters = [...new Set(papers.map(p => p.cluster).filter(Boolean))];

            container.innerHTML = `
                <span class="filter-tag ${activeFilter === 'all' ? 'active' : ''}"
                      onclick="setFilter('all')">全部</span>
                ${clusters.map(c => `
                    <span class="filter-tag ${activeFilter === c ? 'active' : ''}"
                          onclick="setFilter('${c}')">${c}</span>
                `).join('')}
            `;
        }

        function setFilter(cluster) {
            activeFilter = cluster;
            renderFilterTags();
            filterPapers();
        }

        // ========== Paper Selection ==========
        function selectPaper(id) {
            selectedPaperId = id;
            const paper = papers.find(p => p.id === id);

            renderPaperList();
            renderDetailPanel(paper);

            // Highlight in network
            if (network) {
                network.selectNodes([id]);
                network.focus(id, {
                    scale: 1.2,
                    animation: true
                });
            }
        }

        function renderDetailPanel(paper) {
            const container = document.getElementById('detail-panel');

            if (!paper) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <div class="empty-state-text">选择一篇论文查看详情</div>
                    </div>
                `;
                return;
            }

            const paperCitations = citations.filter(c => c.from === paper.id || c.to === paper.id);
            const cites = paperCitations.filter(c => c.from === paper.id);
            const citedBy = paperCitations.filter(c => c.to === paper.id);

            container.innerHTML = `
                <div class="detail-header">
                    <div class="detail-title">${paper.title}</div>
                    <button class="btn-icon" onclick="openModal(${paper.id})">↗</button>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">📝 基本信息</div>
                    <div class="detail-text">
                        <p><strong>作者：</strong>${paper.authors || '未知'}</p>
                        <p><strong>年份：</strong>${paper.year || '未知'}</p>
                        <p><strong>会议/期刊：</strong>${paper.venue || '未知'}</p>
                    </div>
                </div>

                ${paper.abstract ? `
                <div class="detail-section">
                    <div class="detail-section-title">📄 摘要</div>
                    <div class="detail-text">${paper.abstract}</div>
                </div>
                ` : ''}

                ${paper.contributions ? `
                <div class="detail-section">
                    <div class="detail-section-title">💡 核心贡献</div>
                    <div class="detail-text">${paper.contributions}</div>
                </div>
                ` : ''}

                ${paper.methods ? `
                <div class="detail-section">
                    <div class="detail-section-title">🔧 技术方法</div>
                    <div class="detail-text">${paper.methods}</div>
                </div>
                ` : ''}

                <div class="detail-section">
                    <div class="detail-section-title">🏷️ 标签</div>
                    <div class="detail-tags">
                        <span class="detail-tag">${paper.cluster || 'General'}</span>
                        ${paper.keywords ? paper.keywords.split(',').map(k => `<span class="detail-tag">${k.trim()}</span>`).join('') : ''}
                        ${paper.is_landmark ? '<span class="detail-tag" style="background: rgba(245,158,11,0.2); color: var(--accent);">⭐ 关键论文</span>' : ''}
                    </div>
                </div>

                <div class="detail-section">
                    <div class="detail-section-title">🔗 引用关系</div>
                    <div class="citation-list">
                        ${citedBy.length > 0 ? `
                            <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem;">
                                被 ${citedBy.length} 篇论文引用
                            </div>
                            ${citedBy.slice(0, 3).map(c => {
                                const p = papers.find(p => p.id === c.from);
                                return p ? `
                                    <div class="citation-item" onclick="selectPaper(${p.id})">
                                        <span class="citation-icon in">↑</span>
                                        <span>${p.title}</span>
                                    </div>
                                ` : '';
                            }).join('')}
                        ` : ''}
                        ${cites.length > 0 ? `
                            <div style="font-size: 0.75rem; color: var(--text-muted); margin: 0.75rem 0 0.5rem;">
                                引用了 ${cites.length} 篇论文
                            </div>
                            ${cites.slice(0, 3).map(c => {
                                const p = papers.find(p => p.id === c.to);
                                return p ? `
                                    <div class="citation-item" onclick="selectPaper(${p.id})">
                                        <span class="citation-icon out">↓</span>
                                        <span>${p.title}</span>
                                    </div>
                                ` : '';
                            }).join('')}
                        ` : ''}
                        ${citedBy.length === 0 && cites.length === 0 ? `
                            <div style="color: var(--text-muted); font-size: 0.8125rem;">
                                暂无引用关系
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // ========== Network Graph ==========
        function renderNetworkGraph() {
            const container = document.getElementById('network-graph');
            container.innerHTML = '';

            if (papers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="height: 100%;">
                        <div class="empty-state-icon">🕸️</div>
                        <div class="empty-state-text">加载数据后显示引文网络图</div>
                    </div>
                `;
                return;
            }

            const nodes = papers.map(p => ({
                id: p.id,
                label: p.title.length > 30 ? p.title.substring(0, 30) + '...' : p.title,
                title: p.title,
                value: p.is_landmark ? 30 : 15,
                color: {
                    background: p.is_landmark ? '#f59e0b' : getClusterColor(p.cluster),
                    border: p.is_landmark ? '#fbbf24' : getClusterColor(p.cluster),
                    highlight: { background: '#6366f1', border: '#818cf8' }
                },
                font: {
                    color: '#f8fafc',
                    size: p.is_landmark ? 14 : 12
                },
                borderWidth: p.is_landmark ? 3 : 2,
                shadow: p.is_landmark ? {
                    enabled: true,
                    color: 'rgba(245, 158, 11, 0.5)',
                    size: 15,
                    x: 0,
                    y: 0
                } : undefined
            }));

            const edges = citations.map(c => ({
                from: c.from,
                to: c.to,
                arrows: 'to',
                color: { color: '#64748b', highlight: '#6366f1' },
                smooth: { type: 'continuous' }
            }));

            const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
            const options = {
                nodes: {
                    shape: 'dot',
                    scaling: { min: 10, max: 40 }
                },
                physics: {
                    enabled: true,
                    solver: 'forceAtlas2Based',
                    forceAtlas2Based: {
                        gravitationalConstant: -50,
                        centralGravity: 0.01,
                        springLength: 150,
                        springConstant: 0.08
                    },
                    stabilization: { iterations: 100 }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 200
                }
            };

            network = new vis.Network(container, data, options);

            network.on('click', (params) => {
                if (params.nodes.length > 0) {
                    selectPaper(params.nodes[0]);
                }
            });

            network.on('stabilizationIterationsDone', () => {
                network.setOptions({ physics: false });
            });
        }

        function getClusterColor(cluster) {
            const colors = {
                'Deep Learning / Neural Networks': '#6366f1',
                'Natural Language Processing': '#22c55e',
                'Computer Vision': '#f59e0b',
                'Reinforcement Learning': '#ef4444',
                'Graph / Network': '#8b5cf6',
                'Machine Learning Theory': '#06b6d4',
                'Data Mining / Information Retrieval': '#ec4899',
                'Systems / Distributed': '#14b8a6',
                'General': '#64748b'
            };
            return colors[cluster] || '#64748b';
        }

        function zoomIn() {
            if (network) {
                const scale = network.getScale() * 1.2;
                network.moveTo({ scale: scale, animation: true });
            }
        }

        function zoomOut() {
            if (network) {
                const scale = network.getScale() / 1.2;
                network.moveTo({ scale: scale, animation: true });
            }
        }

        function fitNetwork() {
            if (network) {
                network.fit({ animation: true });
            }
        }

        // ========== Timeline View ==========
        function renderTimeline() {
            const container = document.getElementById('timeline-container');

            if (papers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="height: 100%;">
                        <div class="empty-state-icon">📅</div>
                        <div class="empty-state-text">加载数据后显示技术演进时间线</div>
                    </div>
                `;
                return;
            }

            const years = {};
            papers.forEach(p => {
                const year = p.year || 'Unknown';
                if (!years[year]) years[year] = [];
                years[year].push(p);
            });

            const sortedYears = Object.keys(years).sort((a, b) => {
                if (a === 'Unknown') return 1;
                if (b === 'Unknown') return -1;
                return a - b;
            });

            container.innerHTML = sortedYears.map(year => `
                <div class="timeline-year">
                    <div class="timeline-year-label">${year}</div>
                    <div class="timeline-papers">
                        ${years[year].map(p => `
                            <div class="timeline-paper ${p.is_landmark ? 'landmark' : ''}"
                                 onclick="selectPaper(${p.id})">
                                <div class="timeline-paper-title">${p.title}</div>
                                <div class="timeline-paper-meta">
                                    ${p.authors || '未知'} · ${p.venue || '未知'}
                                    ${p.is_landmark ? ' · ⭐' : ''}
                                </div>
                                <div class="paper-badge badge-cluster" style="margin-top: 0.5rem;">
                                    ${p.cluster || 'General'}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function switchView(view) {
            document.querySelectorAll('.view-tab').forEach(tab => {
                tab.classList.toggle('active', tab.textContent.toLowerCase() === view);
            });

            const graphContainer = document.getElementById('graph-container');
            const timelineContainer = document.getElementById('timeline-container');

            if (view === 'network') {
                graphContainer.style.display = 'block';
                timelineContainer.classList.remove('active');
            } else {
                graphContainer.style.display = 'none';
                timelineContainer.classList.add('active');
            }
        }

        // ========== Modal ==========
        function openModal(id) {
            const paper = papers.find(p => p.id === id);
            if (!paper) return;

            document.getElementById('modal-title').textContent = paper.title;
            document.getElementById('modal-body').innerHTML = `
                <div class="detail-section">
                    <div class="detail-section-title">📝 基本信息</div>
                    <div class="detail-text">
                        <p><strong>作者：</strong>${paper.authors || '未知'}</p>
                        <p><strong>年份：</strong>${paper.year || '未知'}</p>
                        <p><strong>会议/期刊：</strong>${paper.venue || '未知'}</p>
                        <p><strong>被引次数：</strong>${paper.citation_count || 0}</p>
                        <p><strong>流派：</strong>${paper.cluster || 'General'}</p>
                    </div>
                </div>

                ${paper.abstract ? `
                <div class="detail-section">
                    <div class="detail-section-title">📄 摘要</div>
                    <div class="detail-text">${paper.abstract}</div>
                </div>
                ` : ''}

                ${paper.contributions ? `
                <div class="detail-section">
                    <div class="detail-section-title">💡 核心贡献</div>
                    <div class="detail-text">${paper.contributions}</div>
                </div>
                ` : ''}

                ${paper.methods ? `
                <div class="detail-section">
                    <div class="detail-section-title">🔧 技术方法</div>
                    <div class="detail-text">${paper.methods}</div>
                </div>
                ` : ''}

                ${paper.keywords ? `
                <div class="detail-section">
                    <div class="detail-section-title">🏷️ 关键词</div>
                    <div class="detail-tags">
                        ${paper.keywords.split(',').map(k => `<span class="detail-tag">${k.trim()}</span>`).join('')}
                    </div>
                </div>
                ` : ''}
            `;

            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
        }

        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // ========== Stats ==========
        function updateStats() {
            document.getElementById('stat-papers').textContent = papers.length;
            document.getElementById('stat-citations').textContent = citations.length;
            const clusters = new Set(papers.map(p => p.cluster).filter(Boolean));
            document.getElementById('stat-clusters').textContent = clusters.size;
        }
    </script>
</body>
