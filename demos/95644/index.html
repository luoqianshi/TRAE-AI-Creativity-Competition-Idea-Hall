<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妙迹 - 打卡待办</title>
<style>
  :root {
    --primary: #6C5CE7;
    --primary-light: #A29BFE;
    --primary-bg: #F0EEFF;
    --success: #00B894;
    --success-light: #E6F9F4;
    --warning: #FDCB6E;
    --danger: #E17055;
    --bg: #F8F9FD;
    --card: #FFFFFF;
    --text: #2D3436;
    --text-secondary: #636E72;
    --text-muted: #B2BEC3;
    --border: #E8E8F0;
    --shadow: 0 2px 16px rgba(108,92,231,0.08);
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== App Shell ===== */
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 16px 100px;
    position: relative;
  }

  /* ===== Header ===== */
  .header {
    padding: 24px 0 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; font-weight: 700;
  }
  .app-title { font-size: 22px; font-weight: 700; }
  .date-display { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .header-right { display: flex; gap: 6px; }
  .btn-icon {
    width: 36px; height: 36px;
    border: none; border-radius: 10px;
    background: var(--card); color: var(--text-secondary);
    cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    box-shadow: var(--shadow);
  }
  .btn-icon:hover { background: var(--primary-bg); color: var(--primary); }

  /* ===== Progress Bar ===== */
  .today-stats {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin: 12px 0 16px;
    box-shadow: var(--shadow);
    display: none;
  }
  .today-stats.show { display: block; }
  .stats-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .stats-label { font-size: 13px; color: var(--text-secondary); }
  .stats-count { font-size: 13px; font-weight: 600; color: var(--primary); }
  .progress-track {
    width: 100%; height: 6px;
    background: var(--border); border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    transition: width 0.4s ease;
    width: 0%;
  }

  /* ===== Tabs ===== */
  .tab-bar {
    display: flex;
    gap: 6px;
    background: var(--card);
    border-radius: var(--radius);
    padding: 5px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .tab-btn {
    flex: 1;
    padding: 10px 0;
    border: none; border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-secondary);
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
    text-align: center;
  }
  .tab-btn .tab-icon { display: block; font-size: 18px; margin-bottom: 2px; }
  .tab-btn.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 8px rgba(108,92,231,0.3);
  }

  /* ===== Content Panels ===== */
  .panel { display: none; }
  .panel.active { display: block; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== Mode Switcher (P/J) ===== */
  .mode-switcher {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 4px;
    box-shadow: var(--shadow);
  }
  .mode-btn {
    flex: 1;
    padding: 8px 0;
    border: none; border-radius: 8px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
  }
  .mode-btn .mode-label { display: block; font-size: 11px; font-weight: 400; color: var(--text-muted); margin-top: 1px; }
  .mode-btn.active {
    background: var(--primary-bg);
    color: var(--primary);
    font-weight: 600;
  }
  .mode-btn.active .mode-label { color: var(--primary-light); }
  .mode-btn .mode-badge {
    display: inline-block;
    font-size: 10px;
    background: var(--border);
    color: var(--text-muted);
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 4px;
  }
  .mode-btn.active .mode-badge {
    background: var(--primary);
    color: #fff;
  }

  /* ===== Task Card ===== */
  .task-list { display: flex; flex-direction: column; gap: 8px; }

  .task-card {
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.2s;
    cursor: default;
    position: relative;
  }
  .task-card:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(108,92,231,0.12); }

  .task-check {
    width: 22px; height: 22px;
    border: 2px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s;
    background: var(--card);
  }
  .task-check:hover { border-color: var(--primary-light); }
  .task-check.checked {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
    font-size: 12px;
  }
  .task-body { flex: 1; min-width: 0; }
  .task-title {
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
    word-break: break-word;
  }
  .task-card.done .task-title { text-decoration: line-through; color: var(--text-muted); }
  .task-time {
    font-size: 12px;
    color: var(--primary-light);
    display: flex; align-items: center; gap: 4px;
    margin-top: 3px;
  }
  .task-delete {
    width: 28px; height: 28px;
    border: none; border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .task-card:hover .task-delete { opacity: 1; }
  .task-delete:hover { background: #FFF0ED; color: var(--danger); }

  /* ===== Add Button ===== */
  .add-btn-wrap {
    margin-top: 14px;
    display: flex;
    justify-content: center;
  }
  .add-btn {
    width: 48px; height: 48px;
    border: none; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(108,92,231,0.3);
    transition: all 0.25s;
    display: flex; align-items: center; justify-content: center;
  }
  .add-btn:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(108,92,231,0.4); }
  .add-btn:active { transform: scale(0.95); }

  /* ===== Timeline (J-mode) ===== */
  .timeline { position: relative; padding-left: 28px; }
  .timeline::before {
    content: '';
    position: absolute; left: 10px; top: 8px; bottom: 8px;
    width: 2px;
    background: var(--border);
    border-radius: 1px;
  }
  .timeline-item { position: relative; margin-bottom: 8px; }
  .timeline-dot {
    position: absolute; left: -22px; top: 16px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--primary-bg);
    border: 2px solid var(--primary);
    z-index: 1;
  }
  .timeline-item.done .timeline-dot { background: var(--success); border-color: var(--success); }
  .timeline .task-card { border-left: 3px solid var(--primary-light); }

  /* ===== Empty State ===== */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state p { font-size: 14px; }

  /* ===== Modal ===== */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 24px 20px 36px;
    width: 100%;
    max-width: 480px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; text-align: center; }
  .modal-field { margin-bottom: 16px; }
  .modal-field label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
  .modal-field input, .modal-field select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    background: var(--bg);
  }
  .modal-field input:focus, .modal-field select:focus { border-color: var(--primary); }
  .modal-field .hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .modal-actions button {
    flex: 1;
    padding: 12px;
    border: none; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .modal-actions .btn-cancel { background: var(--bg); color: var(--text-secondary); }
  .modal-actions .btn-cancel:hover { background: var(--border); }
  .modal-actions .btn-confirm { background: var(--primary); color: #fff; }
  .modal-actions .btn-confirm:hover { box-shadow: 0 2px 12px rgba(108,92,231,0.3); }

  /* ===== Habit Cards ===== */
  .habit-grid { display: flex; flex-direction: column; gap: 10px; }
  .habit-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    transition: all 0.2s;
  }
  .habit-card:hover { transform: translateY(-1px); }
  .habit-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .habit-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .habit-icon.habit-daily { background: #FFF3E0; }
  .habit-icon.habit-weekly { background: #E8F5E9; }
  .habit-icon.habit-monthly { background: #E3F2FD; }
  .habit-icon.habit-custom { background: #F3E5F5; }
  .habit-info { flex: 1; min-width: 0; }
  .habit-name { font-size: 15px; font-weight: 600; }
  .habit-period { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .habit-stats {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
  }
  .habit-stat {
    text-align: center;
    flex: 1;
    background: var(--bg);
    border-radius: 8px;
    padding: 8px 4px;
  }
  .habit-stat-num { font-size: 20px; font-weight: 700; color: var(--primary); }
  .habit-stat-label { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  .habit-checkin-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .habit-checkin-btn {
    width: 36px; height: 36px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    cursor: pointer;
    font-size: 12px; font-weight: 600;
    color: var(--text-secondary);
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .habit-checkin-btn:hover { border-color: var(--primary-light); color: var(--primary); }
  .habit-checkin-btn.checked {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
  }
  .habit-checkin-btn.today-label {
    border-color: var(--primary-light);
    background: var(--primary-bg);
    color: var(--primary);
    font-size: 10px;
    width: auto; padding: 0 8px;
  }
  .habit-actions { display: flex; gap: 6px; margin-left: auto; }
  .habit-del-btn {
    width: 28px; height: 28px;
    border: none; border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .habit-del-btn:hover { background: #FFF0ED; color: var(--danger); }

  /* ===== FAB ===== */
  .fab-wrap {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    max-width: 480px;
    width: calc(100% - 32px);
  }
  .fab-inner {
    display: flex;
    justify-content: center;
  }

  /* ===== Scrollbar ===== */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ===== Responsive ===== */
  @media (max-width: 380px) {
    .app { padding: 0 12px 100px; }
    .tab-btn { font-size: 12px; padding: 8px 0; }
    .tab-btn .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">迹</div>
      <div>
        <div class="app-title">妙迹</div>
        <div class="date-display" id="dateDisplay"></div>
      </div>
    </div>
    <div class="header-right">
      <button class="btn-icon" onclick="clearDoneTasks()" title="清除已完成">✓</button>
    </div>
  </header>

  <!-- Today Stats -->
  <div class="today-stats" id="todayStats">
    <div class="stats-row">
      <span class="stats-label" id="statsLabel">今日进度</span>
      <span class="stats-count" id="statsCount">0/0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="today" onclick="switchTab('today')">
      <span class="tab-icon">📋</span>今日待办
    </button>
    <button class="tab-btn" data-tab="longterm" onclick="switchTab('longterm')">
      <span class="tab-icon">📦</span>远期栈
    </button>
    <button class="tab-btn" data-tab="habits" onclick="switchTab('habits')">
      <span class="tab-icon">🔥</span>习惯营
    </button>
  </div>

  <!-- Panel: 今日待办 -->
  <div class="panel active" id="panelToday">
    <!-- Mode Switcher (P/J) -->
    <div class="mode-switcher">
      <button class="mode-btn active" data-mode="p" onclick="switchMode('p')">
        🌿 悠然视图
        <span class="mode-label">自由罗列 · 轻松打卡</span>
      </button>
      <button class="mode-btn" data-mode="j" onclick="switchMode('j')">
        ⏳ 时光轴
        <span class="mode-label">时间有序 · 严谨规划</span>
      </button>
    </div>
    <div id="todayList"></div>
    <div class="add-btn-wrap">
      <button class="add-btn" onclick="openAddModal('today')">+</button>
    </div>
  </div>

  <!-- Panel: 长期待办 -->
  <div class="panel" id="panelLongterm">
    <div id="longtermList"></div>
    <div class="add-btn-wrap">
      <button class="add-btn" onclick="openAddModal('longterm')">+</button>
    </div>
  </div>

  <!-- Panel: 每日打卡 -->
  <div class="panel" id="panelHabits">
    <div id="habitList"></div>
    <div class="add-btn-wrap">
      <button class="add-btn" onclick="openAddModal('habit')">+</button>
    </div>
  </div>
</div>

<!-- Modal Overlay -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent">
    <div class="modal-title" id="modalTitle">添加任务</div>
    <div id="modalFields"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-confirm" id="modalConfirm" onclick="confirmModal()">确定</button>
    </div>
  </div>
</div>

<script>
  // ===== State =====
  const STORAGE_KEY = 'riji_app_data';

  function defaultData() {
    return {
      todayP: [],
      todayJ: [],
      longterm: [],
      habits: []
    };
  }

  let data = loadData();
  let currentTab = 'today';
  let currentMode = 'p'; // 'p' | 'j'
  let modalContext = null; // { type: 'today'|'longterm'|'habit', editId?: string }

  // ===== Data Persistence =====
  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        // ensure habits have records and config fields
        if (d.habits) {
          d.habits = d.habits.map(h => ({
            ...h,
            records: h.records || {},
            periodType: h.periodType || 'daily',
            periodDays: h.periodDays || 1,
            icon: h.icon || '💪'
          }));
        }
        return d;
      }
    } catch(e) {}
    return defaultData();
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // ===== Utilities =====
  function getToday() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function getTodayCN() {
    const d = new Date();
    const weekdays = ['日','一','二','三','四','五','六'];
    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${weekdays[d.getDay()]}`;
  }

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2,4);
  }

  function getHabitPeriodLabel(h) {
    const map = { daily: '每天', weekly: '每周', monthly: '每月' };
    return map[h.periodType] || `每${h.periodDays}天`;
  }

  function getHabitIcon(h) {
    const map = { daily: 'habit-daily', weekly: 'habit-weekly', monthly: 'habit-monthly' };
    return map[h.periodType] || 'habit-custom';
  }

  function getWeekDates() {
    const arr = [];
    const now = new Date();
    const dayOfWeek = now.getDay();
    const monday = new Date(now);
    monday.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      arr.push(`${y}-${m}-${day}`);
    }
    return arr;
  }

  function getMonthDates() {
    const arr = [];
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const day = String(d).padStart(2,'0');
      const month = String(m+1).padStart(2,'0');
      arr.push(`${y}-${month}-${day}`);
    }
    return arr;
  }

  function getCustomDates(days) {
    const arr = [];
    const now = new Date();
    for (let i = 0; i < days; i++) {
      const d = new Date(now);
      d.setDate(now.getDate() - (days - 1 - i));
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      arr.push(`${y}-${m}-${day}`);
    }
    return arr;
  }

  function getHabitDates(h) {
    if (h.periodType === 'weekly') return getWeekDates();
    if (h.periodType === 'monthly') return getMonthDates();
    if (h.periodType === 'custom') return getCustomDates(h.periodDays || 7);
    // daily: show last 14 days
    const arr = [];
    const now = new Date();
    for (let i = 13; i >= 0; i--) {
      const d = new Date(now);
      d.setDate(now.getDate() - i);
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      arr.push(`${y}-${m}-${day}`);
    }
    return arr;
  }

  function getShortDate(dateStr) {
    const parts = dateStr.split('-');
    return `${parseInt(parts[1])}/${parseInt(parts[2])}`;
  }

  // ===== Render =====
  function renderAll() {
    document.getElementById('dateDisplay').textContent = getTodayCN();
    renderTodayStats();
    renderTodayList();
    renderLongtermList();
    renderHabitList();
    saveData();
  }

  function renderTodayStats() {
    const tasks = currentMode === 'p' ? data.todayP : data.todayJ;
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const el = document.getElementById('todayStats');
    if (currentTab === 'today' && total > 0) {
      el.classList.add('show');
    } else {
      el.classList.remove('show');
      return;
    }
    document.getElementById('statsLabel').textContent = currentMode === 'p' ? '悠然进度' : '时光轴进度';
    document.getElementById('statsCount').textContent = `${done}/${total}`;
    document.getElementById('progressFill').style.width = total > 0 ? `${(done/total)*100}%` : '0%';
  }

  function renderTodayList() {
    const container = document.getElementById('todayList');
    const tasks = currentMode === 'p' ? data.todayP : data.todayJ;
    if (tasks.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">📝</div><p>今日暂无待办，添加一条吧</p></div>`;
      return;
    }
    if (currentMode === 'p') {
      // P mode: simple list
      container.innerHTML = `<div class="task-list">${tasks.map(t => `
        <div class="task-card${t.done ? ' done' : ''}">
          <div class="task-check${t.done ? ' checked' : ''}" onclick="toggleToday('${t.id}')">${t.done ? '✓' : ''}</div>
          <div class="task-body">
            <div class="task-title">${escHtml(t.title)}</div>
          </div>
          <button class="task-delete" onclick="deleteToday('${t.id}')">✕</button>
        </div>
      `).join('')}</div>`;
    } else {
      // J mode: timeline
      // Sort by time
      const sorted = [...tasks].sort((a, b) => (a.time || '00:00').localeCompare(b.time || '00:00'));
      container.innerHTML = `<div class="timeline">${sorted.map(t => `
        <div class="timeline-item${t.done ? ' done' : ''}">
          <div class="timeline-dot"></div>
          <div class="task-card${t.done ? ' done' : ''}">
            <div class="task-check${t.done ? ' checked' : ''}" onclick="toggleToday('${t.id}')">${t.done ? '✓' : ''}</div>
            <div class="task-body">
              <div class="task-title">${escHtml(t.title)}</div>
              <div class="task-time">🕐 ${escHtml(t.time || '00:00')}</div>
            </div>
            <button class="task-delete" onclick="deleteToday('${t.id}')">✕</button>
          </div>
        </div>
      `).join('')}</div>`;
    }
  }

  function renderLongtermList() {
    const container = document.getElementById('longtermList');
    const tasks = data.longterm;
    if (tasks.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">📦</div><p>远期栈空空如也，添加一些不急的任务吧</p></div>`;
      return;
    }
    container.innerHTML = `<div class="task-list">${tasks.map(t => `
      <div class="task-card${t.done ? ' done' : ''}">
        <div class="task-check${t.done ? ' checked' : ''}" onclick="toggleLongterm('${t.id}')">${t.done ? '✓' : ''}</div>
        <div class="task-body">
          <div class="task-title">${escHtml(t.title)}</div>
        </div>
        <button class="task-delete" onclick="deleteLongterm('${t.id}')">✕</button>
      </div>
    `).join('')}</div>`;
  }

  function renderHabitList() {
    const container = document.getElementById('habitList');
    const habits = data.habits;
    if (habits.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔥</div><p>还没有习惯，开始养成一个好习惯吧</p></div>`;
      return;
    }
    container.innerHTML = `<div class="habit-grid">${habits.map(h => {
      const dates = getHabitDates(h);
      const doneInPeriod = dates.filter(d => h.records[d]).length;
      const totalInPeriod = dates.length;
      const ratio = totalInPeriod > 0 ? Math.round((doneInPeriod/totalInPeriod)*100) : 0;
      const todayStr = getToday();
      const todayChecked = !!h.records[todayStr];

      // Calculate streak
      let streak = 0;
      const todayD = new Date();
      for (let i = 0; i < 365; i++) {
        const d = new Date(todayD);
        d.setDate(todayD.getDate() - i);
        const y = d.getFullYear();
        const m = String(d.getMonth()+1).padStart(2,'0');
        const day = String(d.getDate()).padStart(2,'0');
        const key = `${y}-${m}-${day}`;
        if (h.records[key]) streak++;
        else break;
      }

      return `
        <div class="habit-card">
          <div class="habit-top">
            <div class="habit-icon ${getHabitIcon(h)}">${h.icon || '💪'}</div>
            <div class="habit-info">
              <div class="habit-name">${escHtml(h.name)}</div>
              <div class="habit-period">${getHabitPeriodLabel(h)} · 周期进度 ${doneInPeriod}/${totalInPeriod}</div>
            </div>
          </div>
          <div class="habit-stats">
            <div class="habit-stat">
              <div class="habit-stat-num">${streak}</div>
              <div class="habit-stat-label">连续天数</div>
            </div>
            <div class="habit-stat">
              <div class="habit-stat-num">${ratio}%</div>
              <div class="habit-stat-label">完成率</div>
            </div>
            <div class="habit-stat">
              <div class="habit-stat-num">${Object.keys(h.records).length}</div>
              <div class="habit-stat-label">总打卡</div>
            </div>
          </div>
          <div class="habit-checkin-row">
            ${dates.map(d => {
              const checked = !!h.records[d];
              const isToday = d === todayStr;
              return `<button class="habit-checkin-btn${checked ? ' checked' : ''}${isToday ? ' today-label' : ''}" onclick="toggleHabitCheckin('${h.id}','${d}')">${isToday ? '今日' : getShortDate(d)}</button>`;
            }).join('')}
            <div class="habit-actions">
              <button class="habit-del-btn" onclick="deleteHabit('${h.id}')">✕</button>
            </div>
          </div>
        </div>
      `;
    }).join('')}</div>`;
  }

  // ===== Actions: Today =====
  function toggleToday(id) {
    const tasks = currentMode === 'p' ? data.todayP : data.todayJ;
    const t = tasks.find(x => x.id === id);
    if (t) { t.done = !t.done; renderAll(); }
  }

  function deleteToday(id) {
    if (currentMode === 'p') {
      data.todayP = data.todayP.filter(x => x.id !== id);
    } else {
      data.todayJ = data.todayJ.filter(x => x.id !== id);
    }
    renderAll();
  }

  // ===== Actions: Longterm =====
  function toggleLongterm(id) {
    const t = data.longterm.find(x => x.id === id);
    if (t) { t.done = !t.done; renderAll(); }
  }

  function deleteLongterm(id) {
    data.longterm = data.longterm.filter(x => x.id !== id);
    renderAll();
  }

  // ===== Actions: Habits =====
  function toggleHabitCheckin(habitId, dateStr) {
    const h = data.habits.find(x => x.id === habitId);
    if (!h) return;
    if (h.records[dateStr]) {
      delete h.records[dateStr];
    } else {
      h.records[dateStr] = true;
    }
    renderAll();
  }

  function deleteHabit(id) {
    if (!confirm('确定删除这个习惯吗？打卡记录也将被清除。')) return;
    data.habits = data.habits.filter(x => x.id !== id);
    renderAll();
  }

  function clearDoneTasks() {
    if (currentTab === 'today') {
      const tasks = currentMode === 'p' ? data.todayP : data.todayJ;
      const doneCount = tasks.filter(t => t.done).length;
      if (doneCount === 0) return;
      if (!confirm(`清除${currentMode === 'p' ? '悠然视图' : '时光轴'}中所有已完成的任务？`)) return;
      if (currentMode === 'p') data.todayP = data.todayP.filter(t => !t.done);
      else data.todayJ = data.todayJ.filter(t => !t.done);
      renderAll();
    } else if (currentTab === 'longterm') {
      const doneCount = data.longterm.filter(t => t.done).length;
      if (doneCount === 0) return;
      if (!confirm('清除远期栈中所有已完成的任务？')) return;
      data.longterm = data.longterm.filter(t => !t.done);
      renderAll();
    }
  }

  // ===== Tab / Mode Switching =====
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    const panelMap = { today: 'panelToday', longterm: 'panelLongterm', habits: 'panelHabits' };
    document.getElementById(panelMap[tab]).classList.add('active');
    renderAll();
  }

  function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    renderAll();
  }

  // ===== Modal =====
  function openAddModal(type) {
    modalContext = { type };

    if (type === 'today') {
      const isP = currentMode === 'p';
      document.getElementById('modalTitle').textContent = isP ? '添加任务 · 悠然视图' : '添加任务 · 时光轴';
      let fields = `
        <div class="modal-field">
          <label>任务内容</label>
          <input type="text" id="modalInputTitle" placeholder="输入任务内容..." maxlength="100" autofocus>
        </div>
      `;
      if (!isP) {
        fields += `
          <div class="modal-field">
            <label>时间</label>
            <input type="time" id="modalInputTime" value="${new Date().toTimeString().slice(0,5)}">
            <div class="hint">设置任务的具体时间</div>
          </div>
        `;
      }
      document.getElementById('modalFields').innerHTML = fields;
    } else if (type === 'longterm') {
      document.getElementById('modalTitle').textContent = '添加任务 · 远期栈';
      document.getElementById('modalFields').innerHTML = `
        <div class="modal-field">
          <label>任务内容</label>
          <input type="text" id="modalInputTitle" placeholder="不急，先记下来..." maxlength="100" autofocus>
        </div>
      `;
    } else if (type === 'habit') {
      document.getElementById('modalTitle').textContent = '新建习惯';
      document.getElementById('modalFields').innerHTML = `
        <div class="modal-field">
          <label>习惯名称</label>
          <input type="text" id="modalInputTitle" placeholder="如：每天运动30分钟" maxlength="50" autofocus>
        </div>
        <div class="modal-field">
          <label>打卡周期</label>
          <select id="modalInputPeriod">
            <option value="daily">每日打卡</option>
            <option value="weekly">每周打卡</option>
            <option value="monthly">每月打卡</option>
            <option value="custom">自定义天数</option>
          </select>
        </div>
        <div class="modal-field" id="modalCustomDaysWrap" style="display:none;">
          <label>周期天数</label>
          <input type="number" id="modalInputDays" value="7" min="2" max="90">
          <div class="hint">每 N 天为一个周期</div>
        </div>
        <div class="modal-field">
          <label>习惯图标</label>
          <select id="modalInputIcon">
            <option value="💪">💪 运动</option>
            <option value="📖">📖 阅读</option>
            <option value="🧘">🧘 冥想</option>
            <option value="💧">💧 饮水</option>
            <option value="✍️">✍️ 写作</option>
            <option value="🎯">🎯 目标</option>
            <option value="🌅">🌅 早起</option>
            <option value="🌙">🌙 早睡</option>
            <option value="🍎">🍎 健康饮食</option>
            <option value="🎵">🎵 乐器</option>
            <option value="🗣️">🗣️ 语言学习</option>
            <option value="🧹">🧹 整理</option>
          </select>
        </div>
      `;
      // Add period change listener after render
    }

    document.getElementById('modalOverlay').classList.add('show');
    // Focus
    setTimeout(() => {
      const inp = document.getElementById('modalInputTitle');
      if (inp) inp.focus();
    }, 200);
  }

  // Period type change handler (delegated)
  document.getElementById('modalFields').addEventListener('change', function(e) {
    if (e.target && e.target.id === 'modalInputPeriod') {
      const wrap = document.getElementById('modalCustomDaysWrap');
      if (wrap) {
        wrap.style.display = e.target.value === 'custom' ? 'block' : 'none';
      }
    }
  });

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
    modalContext = null;
  }

  function confirmModal() {
    if (!modalContext) return;
    const title = document.getElementById('modalInputTitle')?.value?.trim();
    if (!title) {
      alert('请输入内容');
      return;
    }

    const { type } = modalContext;

    if (type === 'today') {
      const isP = currentMode === 'p';
      const task = { id: genId(), title, done: false, createdAt: Date.now() };
      if (!isP) {
        const time = document.getElementById('modalInputTime')?.value || '00:00';
        task.time = time;
        data.todayJ.push(task);
      } else {
        data.todayP.push(task);
      }
    } else if (type === 'longterm') {
      data.longterm.push({ id: genId(), title, done: false, createdAt: Date.now() });
    } else if (type === 'habit') {
      const periodType = document.getElementById('modalInputPeriod')?.value || 'daily';
      let periodDays = 1;
      if (periodType === 'custom') {
        periodDays = parseInt(document.getElementById('modalInputDays')?.value) || 7;
        if (periodDays < 2) periodDays = 2;
        if (periodDays > 90) periodDays = 90;
      }
      const icon = document.getElementById('modalInputIcon')?.value || '💪';
      data.habits.push({
        id: genId(),
        name: title,
        icon,
        periodType,
        periodDays,
        records: {},
        createdAt: Date.now()
      });
    }

    closeModal();
    renderAll();
  }

  // Close modal on overlay click
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // Enter key in modal
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('modalOverlay').classList.contains('show')) {
      closeModal();
    }
    if (e.key === 'Enter' && document.getElementById('modalOverlay').classList.contains('show')) {
      confirmModal();
    }
  });

  // ===== HTML Escape =====
  function escHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ===== Init =====
  // Migrate legacy data if needed
  if (!data.todayP) data.todayP = [];
  if (!data.todayJ) data.todayJ = [];
  if (!data.longterm) data.longterm = [];
  if (!data.habits) data.habits = [];

  renderAll();
</script>
</body>
</html>
