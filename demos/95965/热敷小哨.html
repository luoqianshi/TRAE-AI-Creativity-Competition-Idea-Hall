<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>热敷小哨</title>
  <style>
    :root {
      --bg-primary: #F5F0EB;
      --card-bg: #FFFFFF;
      --text-primary: #4E3A31;
      --text-secondary: #7D6B60;
      --accent: #F8B992;
      --accent-hover: #F5A87C;
      --border: #E6D9CE;
      --shadow: 0 4px 12px rgba(240, 220, 200, 0.4);
      --transition: all 0.3s ease;
      --radius: 16px;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .dark-theme {
      --bg-primary: #2C2521;
      --card-bg: #3E322B;
      --text-primary: #F8F0E6;
      --text-secondary: #D9C9BC;
      --accent: #D99A6C;
      --accent-hover: #C98A5C;
      --border: #5A4A42;
      --shadow: 0 4px 12px rgba(70, 50, 40, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 8px 0;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      background: var(--accent);
      border-color: var(--accent);
    }

    .theme-toggle svg {
      width: 22px;
      height: 22px;
      fill: var(--text-primary);
    }

    .status-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      text-align: center;
    }

    .status-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .timer-display {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: -0.05em;
      margin: 12px 0;
      color: var(--text-primary);
      text-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .timer-state {
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 8px;
      min-height: 1.4em;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin: 28px 0;
    }

    .time-btn {
      background: var(--accent);
      color: var(--text-primary);
      border: none;
      border-radius: 50px;
      padding: 16px 32px;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      flex: 1;
      min-width: 136px;
      max-width: 160px;
      box-shadow: 0 3px 8px rgba(248, 185, 146, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .time-btn:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(245, 168, 124, 0.4);
    }

    .time-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .time-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .time-btn span {
      font-size: 1.1rem;
    }

    .control-footer {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 22px;
      margin-top: auto;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .footer-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .toggle-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .toggle-label {
      font-size: 1rem;
      color: var(--text-primary);
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 28px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #CCC;
      transition: var(--transition);
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: var(--transition);
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .bluetooth-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      font-size: 0.95rem;
      color: var(--text-secondary);
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .bluetooth-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4CAF50;
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.3);
    }

    .hint {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 28px;
      padding: 0 8px;
      line-height: 1.5;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .timer-display {
        font-size: 2.6rem;
      }
      .time-btn {
        padding: 14px 24px;
        font-size: 1.15rem;
      }
      h1 {
        font-size: 1.6rem;
      }
      .status-card,
      .control-footer {
        padding: 20px;
      }
    }

    @media (max-width: 360px) {
      .timer-display {
        font-size: 2.2rem;
      }
      .time-btn {
        padding: 12px 20px;
        font-size: 1.05rem;
      }
      .btn-group {
        gap: 10px;
      }
    }

    /* Animation for timer digits */
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    .timer-pulse {
      animation: pulse 1.5s infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>热敷小哨</h1>
      <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色主题">
        <svg viewBox="0 0 24 24">
          <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.59-1.59zM21.75 12a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM17.834 18.894a.75.75 0 00-1.06-1.06l-1.59.159a.75.75 0 101.06 1.06l1.59-1.59zM12 18a4.5 4.5 0 110-9 4.5 4.5 0 010 9zM7.758 17.303a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 001.06 1.06l1.59-1.59z" />
        </svg>
      </button>
    </header>

    <main>
      <section class="status-card">
        <div class="status-label">当前状态</div>
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div class="timer-state" id="timerState">待启动</div>
      </section>

      <section class="btn-group">
        <button class="time-btn" data-minutes="10">
          <span>10分钟</span>
        </button>
        <button class="time-btn" data-minutes="15">
          <span>15分钟</span>
        </button>
        <button class="time-btn" data-minutes="20">
          <span>20分钟</span>
        </button>
      </section>

      <section class="control-footer">
        <h2 class="footer-title">辅助设置</h2>
        <div class="toggle-row">
          <span class="toggle-label">语音提醒</span>
          <label class="toggle-switch">
            <input type="checkbox" id="voiceToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">震动反馈</span>
          <label class="toggle-switch">
            <input type="checkbox" id="vibrateToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="bluetooth-status">
          <span class="bluetooth-dot"></span>
          <span>已连接热敷小哨 · 设备ID: H-7A2F</span>
        </div>
      </section>

      <p class="hint">扫码使用｜无需安装APP｜倒计时结束自动断电｜请将热敷袋紧贴小哨放置</p>
    </main>
  </div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'light';
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-theme');
    }
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-theme');
      const isDark = document.body.classList.contains('dark-theme');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // 倒计时逻辑
    let countdownInterval = null;
    let remainingSeconds = 0;
    let isActive = false;
    const timerDisplay = document.getElementById('timerDisplay');
    const timerState = document.getElementById('timerState');
    const timeBtns = document.querySelectorAll('.time-btn');
    const voiceToggle = document.getElementById('voiceToggle');
    const vibrateToggle = document.getElementById('vibrateToggle');

    // 格式化秒数为 MM:SS
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // 播报语音
    function speak(text) {
      if (!voiceToggle.checked || typeof speechSynthesis === 'undefined') return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = navigator.language || 'zh-CN';
      utterance.rate = 0.9;
      utterance.pitch = 1;
      speechSynthesis.speak(utterance);
    }

    // 震动（仅移动端有效）
    function vibrate() {
      if (vibrateToggle.checked && 'vibrate' in navigator) {
        navigator.vibrate(200);
      }
    }

    // 启动/暂停倒计时
    function toggleTimer(minutes) {
      if (isActive && remainingSeconds > 0) {
        // 暂停
        clearInterval(countdownInterval);
        isActive = false;
        timerState.textContent = '已暂停';
        timerState.style.color = '#F5A87C';
        timerDisplay.classList.remove('timer-pulse');
      } else if (remainingSeconds === 0) {
        // 启动新倒计时
        remainingSeconds = minutes * 60;
        isActive = true;
        timerState.textContent = `运行中 · ${minutes}分钟`;
        timerState.style.color = '#4CAF50';
        timerDisplay.classList.add('timer-pulse');
        speak(`热敷已启动，${minutes}分钟`);
        vibrate();

        countdownInterval = setInterval(() => {
          remainingSeconds--;
          timerDisplay.textContent = formatTime(remainingSeconds);
          if (remainingSeconds <= 0) {
            clearInterval(countdownInterval);
            isActive = false;
            timerDisplay.textContent = '00:00';
            timerState.textContent = '时间到！请取下热敷袋';
            timerState.style.color = '#E74C3C';
            timerDisplay.classList.remove('timer-pulse');
            speak('时间到！请取下热敷袋');
            vibrate();
          }
        }, 1000);
      }
    }

    // 绑定按钮事件
    timeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const minutes = parseInt(btn.getAttribute('data-minutes'));
        // 取消其他按钮高亮
        timeBtns.forEach(b => b.style.opacity = '1');
        btn.style.opacity = '0.85';

        // 切换当前定时
        toggleTimer(minutes);
      });
    });

    // 页面卸载前清理
    window.addEventListener('beforeunload', () => {
      if (countdownInterval) {
        clearInterval(countdownInterval);
      }
    });

    // 初始化显示
    timerDisplay.textContent = formatTime(0);
  </script>
</body>
</html>
