<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI幻装衣帽间 - MVP高保真原型</title>
<style>
/* ===== CSS Reset & Design Tokens ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Primary palette - from project.md */
  --rose: #BE185D;
  --rose-light: #FDF2F8;
  --rose-dark: #9D174D;
  --gold: #D97706;
  --gold-light: #FEF3C7;
  --gold-dark: #B45309;
  /* Secondary palette */
  --morandi-green: #C5D5C5;
  --cream: #FFF8E7;
  --lavender: #D4C5D0;
  --lavender-light: #F5F0F5;
  /* Neutral palette */
  --bg-warm: #FBFAF7;
  --bg-card: #FFFFFF;
  --text-primary: #2C2C2C;
  --text-secondary: #8C8C8C;
  --text-tertiary: #B0B0B0;
  --border: #F0EDE8;
  --divider: #EEECE8;
  /* Semantic */
  --success: #4ADE80;
  --error: #FB7185;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.08), 0 4px 8px rgba(0,0,0,0.04);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-full: 9999px;
  /* Typography */
  --font-display: 'Georgia', 'Times New Roman', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', 'Menlo', 'Monaco', monospace;
  /* Animation */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --duration-fast: 150ms;
  --duration-normal: 250ms;
  --duration-slow: 350ms;
}

/* ===== Global Styles ===== */
body {
  font-family: var(--font-body);
  background: linear-gradient(135deg, #FEF5F8 0%, #FDF2F8 30%, #FFF8F3 60%, #F5F0F5 100%);
  color: var(--text-primary);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding: 40px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ===== Header ===== */
.prototype-header {
  text-align: center;
  margin-bottom: 40px;
}
.prototype-header h1 {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}
.prototype-header p {
  font-size: 14px;
  color: var(--text-secondary);
  letter-spacing: 0.02em;
}
.prototype-header .badge {
  display: inline-block;
  background: var(--rose);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  margin-bottom: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* ===== Phones Container ===== */
.phones-container {
  display: flex;
  flex-wrap: wrap;
  gap: 36px;
  justify-content: center;
  align-items: flex-start;
  max-width: 1600px;
  width: 100%;
}

.phone-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.phone-label {
  font-size: 12px;
  color: var(--text-secondary);
  font-style: italic;
  letter-spacing: 0.03em;
  font-weight: 500;
}

/* ===== iPhone Frame ===== */
.iphone-wrapper {
  padding: 12px;
  background: #1a1a1a;
  border-radius: 52px;
  box-shadow: 0 0 0 2px #2a2a2a, 0 20px 60px rgba(0,0,0,0.25), 0 8px 24px rgba(0,0,0,0.15);
  position: relative;
  display: inline-block;
}

.iphone-screen {
  position: relative;
  width: 393px;
  height: 852px;
  border-radius: 40px;
  overflow: hidden;
  background: #fff;
}

/* Dynamic Island */
.dynamic-island {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 126px;
  height: 34px;
  background: #000;
  border-radius: 999px;
  z-index: 100;
}

/* Status Bar */
.status-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 32px 0 32px;
  font-size: 15px;
  font-weight: 600;
  font-family: var(--font-body);
  z-index: 90;
  pointer-events: none;
  color: #000;
}

.status-bar-left { font-weight: 600; }
.status-bar-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Signal bars */
.signal-bars {
  display: flex;
  align-items: flex-end;
  gap: 1.5px;
  height: 12px;
}
.signal-bar {
  width: 3px;
  background: currentColor;
  border-radius: 1px;
}

/* Battery */
.battery {
  width: 26px;
  height: 12px;
  border: 1.5px solid currentColor;
  border-radius: 3px;
  padding: 1.5px;
  position: relative;
  opacity: 0.8;
}
.battery-fill {
  height: 100%;
  background: currentColor;
  border-radius: 1px;
}
.battery-cap {
  position: absolute;
  top: 3px;
  right: -3px;
  width: 2px;
  height: 5px;
  background: currentColor;
  border-radius: 0 1px 1px 0;
}

/* Content Area */
.phone-content {
  position: absolute;
  top: 54px;
  left: 0;
  right: 0;
  bottom: 84px;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.phone-content::-webkit-scrollbar { display: none; }

/* Home Indicator */
.home-indicator {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  background: rgba(0,0,0,0.2);
  border-radius: 999px;
  z-index: 10;
}

/* ===== Tab Bar ===== */
.tab-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 84px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: space-around;
  padding-top: 8px;
  z-index: 50;
}

.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 4px 12px;
  transition: all var(--duration-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  min-width: 52px;
  min-height: 44px;
  justify-content: center;
}

.tab-item svg {
  width: 24px;
  height: 24px;
  transition: all var(--duration-fast) var(--ease-out);
}

.tab-item span {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.01em;
  transition: color var(--duration-fast) var(--ease-out);
}

.tab-item.active svg { color: var(--rose); }
.tab-item.active span { color: var(--rose); font-weight: 600; }
.tab-item:not(.active) svg { color: var(--text-tertiary); }
.tab-item:not(.active) span { color: var(--text-tertiary); }

/* ===== Screen: Home ===== */
.home-screen { padding: 0 20px 20px; }
.home-screen .greeting {
  padding: 16px 0 8px;
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.home-screen .greeting-sub {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}

/* Hero banner */
.hero-banner {
  background: linear-gradient(135deg, var(--rose) 0%, #9D174D 50%, var(--rose-dark) 100%);
  border-radius: var(--radius-lg);
  padding: 24px;
  color: #fff;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-md);
}
.hero-banner::after {
  content: '';
  position: absolute;
  top: -40px;
  right: -30px;
  width: 140px;
  height: 140px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}
.hero-banner .hero-tag {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  opacity: 0.8;
  margin-bottom: 8px;
}
.hero-banner .hero-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 6px;
  line-height: 1.3;
}
.hero-banner .hero-desc {
  font-size: 12px;
  opacity: 0.85;
  line-height: 1.5;
  margin-bottom: 16px;
}
.hero-banner .hero-cta {
  display: inline-block;
  background: #fff;
  color: var(--rose);
  font-size: 13px;
  font-weight: 600;
  padding: 8px 20px;
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}
.hero-banner .hero-cta:active { transform: scale(0.96); }

/* Section header */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-top: 4px;
}
.section-header h3 {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.section-header .see-all {
  font-size: 12px;
  color: var(--rose);
  font-weight: 500;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* Outfit inspiration cards */
.inspo-row {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 12px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}
.inspo-row::-webkit-scrollbar { display: none; }
.inspo-card {
  flex: 0 0 140px;
  scroll-snap-align: start;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--bg-card);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}
.inspo-card:active { transform: scale(0.97); }
.inspo-card .card-img {
  width: 100%;
  height: 160px;
  background: linear-gradient(135deg, #FDF2F8 0%, #F5F0F5 50%, #FFF8E7 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.inspo-card .card-img-placeholder {
  font-size: 40px;
  opacity: 0.3;
}
.inspo-card .card-info {
  padding: 10px 12px;
}
.inspo-card .card-style-tag {
  font-size: 10px;
  color: var(--rose);
  font-weight: 600;
  letter-spacing: 0.03em;
  margin-bottom: 2px;
}
.inspo-card .card-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.4;
}

/* Feature quick actions */
.quick-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.quick-action {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 16px;
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-out);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 12px;
  -webkit-tap-highlight-color: transparent;
}
.quick-action:active { transform: scale(0.97); box-shadow: var(--shadow-md); }
.quick-action .qa-icon {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.quick-action .qa-icon.camera { background: #FDF2F8; color: var(--rose); }
.quick-action .qa-icon.magic { background: #FEF3C7; color: var(--gold); }
.quick-action .qa-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}
.quick-action .qa-sub {
  font-size: 10px;
  color: var(--text-secondary);
  margin-top: 1px;
}

/* ===== Screen: Wardrobe ===== */
.wardrobe-screen { padding: 0 16px 20px; }
.wardrobe-header {
  padding: 16px 4px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.wardrobe-header h2 {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.wardrobe-header .wardrobe-count {
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg-warm);
  padding: 4px 10px;
  border-radius: var(--radius-full);
}

/* Search bar */
.search-bar {
  display: flex;
  align-items: center;
  background: var(--bg-warm);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  gap: 8px;
  margin-bottom: 14px;
  cursor: text;
  transition: box-shadow var(--duration-fast) var(--ease-out);
}
.search-bar:focus-within { box-shadow: 0 0 0 2px var(--rose-light); }
.search-bar svg { color: var(--text-tertiary); flex-shrink: 0; }
.search-bar input {
  border: none;
  background: none;
  outline: none;
  font-size: 14px;
  font-family: var(--font-body);
  color: var(--text-primary);
  width: 100%;
}
.search-bar input::placeholder { color: var(--text-tertiary); }

/* Category tabs */
.category-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 12px;
  -webkit-overflow-scrolling: touch;
}
.category-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
  flex-shrink: 0;
  padding: 7px 16px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
  background: var(--bg-warm);
  color: var(--text-secondary);
}
.cat-tab.active {
  background: var(--rose);
  color: #fff;
  font-weight: 600;
}
.cat-tab:active:not(.active) { background: var(--rose-light); }

/* Clothing grid */
.clothing-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}
.clothing-item {
  aspect-ratio: 3/4;
  border-radius: var(--radius-sm);
  overflow: hidden;
  cursor: pointer;
  position: relative;
  background: var(--bg-warm);
  transition: transform var(--duration-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}
.clothing-item:active { transform: scale(0.96); }
.clothing-item .item-bg {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.clothing-item .item-icon {
  font-size: 36px;
  opacity: 0.25;
}
.clothing-item .item-label {
  position: absolute;
  bottom: 6px;
  left: 6px;
  right: 6px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(8px);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 10px;
  font-weight: 500;
  color: var(--text-primary);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ===== Screen: Camera ===== */
.camera-screen { padding: 0 20px 20px; }
.camera-header {
  text-align: center;
  padding: 20px 0 16px;
}
.camera-header h2 {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.camera-header p {
  font-size: 13px;
  color: var(--text-secondary);
}

/* Camera preview */
.camera-preview {
  width: 100%;
  aspect-ratio: 1;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: var(--shadow-md);
}
.camera-preview .cam-grid {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 70%;
  height: 70%;
  border: 2px dashed rgba(255,255,255,0.2);
  border-radius: var(--radius-md);
}
.camera-preview .cam-icon {
  color: rgba(255,255,255,0.5);
  margin-bottom: 12px;
}
.camera-preview .cam-hint {
  color: rgba(255,255,255,0.5);
  font-size: 13px;
  text-align: center;
  line-height: 1.5;
}

/* Camera actions */
.camera-actions {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}
.cam-btn {
  flex: 1;
  padding: 14px;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.cam-btn.primary {
  background: var(--rose);
  color: #fff;
  box-shadow: 0 4px 12px rgba(190,24,93,0.3);
}
.cam-btn.secondary {
  background: var(--bg-warm);
  color: var(--text-primary);
  border: 1px solid var(--border);
}
.cam-btn:active { transform: scale(0.97); }

/* Processing card */
.processing-card {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 12px;
}
.processing-card .proc-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.processing-card .proc-title {
  font-size: 13px;
  font-weight: 600;
}
.processing-card .proc-status {
  font-size: 11px;
  color: var(--rose);
  font-weight: 500;
}
.progress-bar {
  width: 100%;
  height: 4px;
  background: var(--bg-warm);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--rose), var(--gold));
  border-radius: 2px;
  transition: width 0.6s var(--ease-in-out);
}

/* ===== Screen: Item Detail ===== */
.detail-screen { padding: 0 20px 20px; }
.detail-back {
  padding: 16px 0 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 14px;
  color: var(--rose);
  font-weight: 500;
  -webkit-tap-highlight-color: transparent;
}

/* Item image */
.item-image-area {
  width: 100%;
  aspect-ratio: 1;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, #FDF2F8 0%, #F5F0F5 40%, #FFF8E7 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.item-image-area .item-placeholder {
  font-size: 80px;
  opacity: 0.2;
}
.item-image-area .ai-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(8px);
  padding: 4px 10px;
  border-radius: var(--radius-full);
  font-size: 10px;
  font-weight: 600;
  color: var(--rose);
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Tag groups */
.tag-group {
  margin-bottom: 16px;
}
.tag-group-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 8px;
}
.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tag {
  padding: 6px 14px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}
.tag.category { background: #FDF2F8; color: var(--rose); }
.tag.color { background: #FEF3C7; color: var(--gold-dark); }
.tag.style-tag { background: var(--lavender-light); color: #7C3A6D; }
.tag.material { background: #ECFDF5; color: #065F46; }
.tag.season { background: #F0F9FF; color: #0369A1; }

/* Detail actions */
.detail-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.detail-btn {
  flex: 1;
  padding: 12px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}
.detail-btn.primary { background: var(--rose); color: #fff; }
.detail-btn.secondary { background: var(--bg-warm); color: var(--text-primary); border: 1px solid var(--border); }
.detail-btn:active { transform: scale(0.97); }

/* ===== Screen: Outfit ===== */

// ===== App State =====
const phoneStates = {};

function initPhone(screenId, initialTab) {
  phoneStates[screenId] = {
    activeTab: initialTab,
    wardrobeCat: '全部',
    outfitOccasion: '全部',
    outfitLikes: outfitCards.reduce((acc, o) => { acc[o.id] = o.liked; return acc; }, {}),
  };
}

function renderPhoneContent(screenId) {
  const state = phoneStates[screenId];
  const contentEl = document.getElementById(`content-${screenId}`);
  const tabBarEl = document.getElementById(`tabbar-${screenId}`);
  if (!contentEl || !tabBarEl) return;

  let contentHtml = '';
  switch (state.activeTab) {
    case 'home':
      contentHtml = renderHome();
      break;
    case 'wardrobe':
      contentHtml = renderWardrobe(state.wardrobeCat);
      break;
    case 'camera':
      contentHtml = renderCamera();
      break;
    case 'outfit':
      contentHtml = renderOutfit(state.outfitOccasion, outfitCards.map(o => ({...o, liked: state.outfitLikes[o.id]})));
      break;
    case 'profile':
      contentHtml = renderProfile();
      break;
    default:
      contentHtml = renderHome();
  }

  contentEl.innerHTML = contentHtml;
  contentEl.scrollTop = 0;

  // Render tab bar
  tabBarEl.innerHTML = '';
  const tabs = [
    { key: 'home', label: '发现', icon: icons.home },
    { key: 'wardrobe', label: '衣帽间', icon: icons.wardrobe },
    { key: 'camera', label: '拍照', icon: icons.camera },
    { key: 'outfit', label: '搭配', icon: icons.magic },
    { key: 'profile', label: '我的', icon: icons.profile },
  ];

  tabs.forEach(t => {
    const tabEl = document.createElement('div');
    tabEl.className = 'tab-item' + (t.key === state.activeTab ? ' active' : '');
    tabEl.innerHTML = t.icon + '<span>' + t.label + '</span>';
    tabEl.addEventListener('click', () => {
      phoneStates[screenId].activeTab = t.key;
      renderPhoneContent(screenId);
    });
    tabBarEl.appendChild(tabEl);
  });
}

// ===== Global Actions =====
function updateWardrobeCat(cat) {
  // Find which phone is showing wardrobe
  Object.keys(phoneStates).forEach(sid => {
    if (phoneStates[sid].activeTab === 'wardrobe') {
      phoneStates[sid].wardrobeCat = cat;
      renderPhoneContent(sid);
    }
  });
}

function updateOutfitOccasion(occasion) {
  Object.keys(phoneStates).forEach(sid => {
    if (phoneStates[sid].activeTab === 'outfit') {
      phoneStates[sid].outfitOccasion = occasion;
      renderPhoneContent(sid);
    }
  });
}

function toggleLike(outfitId) {
  Object.keys(phoneStates).forEach(sid => {
    phoneStates[sid].outfitLikes[outfitId] = !phoneStates[sid].outfitLikes[outfitId];
    if (phoneStates[sid].activeTab === 'outfit') {
      renderPhoneContent(sid);
    }
  });
  const liked = Object.values(phoneStates)[0]?.outfitLikes[outfitId];
  showToast(liked ? '❤️ 已收藏' : '已取消收藏');
}

// Make functions globally accessible
window.showToast = showToast;
window.updateWardrobeCat = updateWardrobeCat;
window.updateOutfitOccasion = updateOutfitOccasion;
window.toggleLike = toggleLike;
