<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗境·穿越 - 古诗词互动平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SimSun', '宋体', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f1a 100%);
            min-height: 100vh;
            color: #e8e8e8;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #d4af37;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            letter-spacing: 8px;
        }

        .subtitle {
            color: #888;
            margin-top: 10px;
            font-size: 1.1em;
        }

        .tab-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 15px 30px;
            background: transparent;
            border: 2px solid #d4af37;
            color: #d4af37;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            min-height: 44px;
            min-width: 44px;
        }

        .tab-btn:hover, .tab-btn.active {
            background: #d4af37;
            color: #1a1a2e;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .section-title {
            color: #d4af37;
            font-size: 1.5em;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group textarea {
            flex: 1;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #d4af37;
            border-radius: 8px;
            color: #e8e8e8;
            font-size: 1em;
            font-family: inherit;
            resize: none;
            min-height: 80px;
        }

        .input-group textarea:focus {
            outline: none;
            border-color: #f0d78c;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #d4af37 0%, #b8942e 100%);
            border: none;
            color: #1a1a2e;
            font-size: 1em;
            cursor: pointer;
            border-radius: 8px;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.3s;
            min-height: 44px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-area {
            min-height: 100px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-top: 20px;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(212, 175, 55, 0.3);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #d4af37;
            margin-top: 15px;
            font-size: 1.1em;
        }

        .generated-image {
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
            margin: 20px auto;
            display: block;
            border: 3px solid #d4af37;
        }

        .poetry-analysis {
            background: rgba(212, 175, 55, 0.1);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #d4af37;
            margin-top: 20px;
            line-height: 1.8;
        }

        .storyboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .storyboard-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .storyboard-card .scene-num {
            color: #d4af37;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .storyboard-card .scene-title {
            color: #f0d78c;
            margin-bottom: 10px;
        }

        .storyboard-card .scene-desc {
            color: #aaa;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .poet-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .poet-btn {
            padding: 12px 20px;
            background: transparent;
            border: 2px solid #555;
            color: #888;
            cursor: pointer;
            border-radius: 25px;
            font-size: 1em;
            transition: all 0.3s;
            font-family: inherit;
            min-height: 44px;
            min-width: 44px;
        }

        .poet-btn:hover {
            border-color: #d4af37;
            color: #d4af37;
        }

        .poet-btn.selected {
            background: #d4af37;
            border-color: #d4af37;
            color: #1a1a2e;
        }

        .chat-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .chat-messages {
            min-height: 250px;
            margin-bottom: 20px;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #555;
            border-radius: 25px;
            color: #e8e8e8;
            font-size: 1em;
            font-family: inherit;
            min-height: 44px;
        }

        .chat-input-area input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .message {
            display: flex;
            margin-bottom: 15px;
            align-items: flex-start;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: #d4af37;
        }

        .message.ai .avatar {
            background: #2a2a4a;
            border: 2px solid #d4af37;
        }

        .message .bubble {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 15px;
            line-height: 1.6;
            margin: 0 10px;
        }

        .message.user .bubble {
            background: linear-gradient(135deg, #d4af37 0%, #b8942e 100%);
            color: #1a1a2e;
            border-bottom-right-radius: 5px;
        }

        .message.ai .bubble {
            background: #2a2a4a;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-bottom-left-radius: 5px;
        }

        .preset-poems {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .preset-poem {
            padding: 8px 15px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            color: #d4af37;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
            min-height: 44px;
            display: flex;
            align-items: center;
        }

        .preset-poem:hover {
            background: rgba(212, 175, 55, 0.2);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 4px;
        }

        /* ========================================
           响应式适配 - 媒体查询
           ======================================== */

        /* 平板端：768px - 1023px */
        @media screen and (min-width: 768px) and (max-width: 1023px) {
            .container {
                padding: 15px;
            }

            header {
                padding: 25px 0;
            }

            h1 {
                font-size: 2.2em;
                letter-spacing: 6px;
            }

            .tab-btn {
                padding: 12px 24px;
                font-size: 1em;
            }

            .section-card {
                padding: 25px;
            }
        }

        /* 手机端：max-width: 767px */
        @media screen and (max-width: 767px) {
            .container {
                padding: 12px;
            }

            header {
                padding: 20px 0;
                margin-bottom: 20px;
            }

            h1 {
                font-size: 1.8em;
                letter-spacing: 4px;
            }

            .subtitle {
                font-size: 0.95em;
            }

            .tab-nav {
                gap: 10px;
                margin-bottom: 20px;
                overflow-x: auto;
                flex-wrap: nowrap;
                justify-content: flex-start;
                padding-bottom: 10px;
                -webkit-overflow-scrolling: touch;
            }

            .tab-btn {
                padding: 10px 16px;
                font-size: 0.95em;
                white-space: nowrap;
                flex-shrink: 0;
            }

            .section-card {
                padding: 18px;
                border-radius: 8px;
            }

            .section-title {
                font-size: 1.3em;
                margin-bottom: 15px;
            }

            .input-group {
                flex-direction: column;
                gap: 12px;
            }

            .input-group textarea {
                min-height: 100px;
                font-size: 0.95em;
            }

            .btn {
                width: 100%;
                padding: 14px 20px;
                font-size: 1em;
            }

            .result-area {
                padding: 15px;
                margin-top: 15px;
            }

            .storyboard-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .storyboard-card {
                padding: 15px;
            }

            .storyboard-card .scene-num {
                font-size: 1.1em;
            }

            .storyboard-card .scene-title {
                font-size: 1em;
            }

            .storyboard-card .scene-desc {
                font-size: 0.85em;
            }

            .poet-selector {
                gap: 10px;
            }

            .poet-btn {
                padding: 10px 16px;
                font-size: 0.9em;
                flex: 1 1 calc(50% - 10px);
                min-width: 0;
                text-align: center;
            }

            .chat-container {
                max-height: 350px;
                padding: 15px;
            }

            .chat-messages {
                min-height: 200px;
            }

            .chat-input-area {
                flex-direction: column;
                gap: 10px;
            }

            .chat-input-area input {
                font-size: 0.95em;
            }

            .message .avatar {
                width: 36px;
                height: 36px;
                font-size: 1.2em;
            }

            .message .bubble {
                max-width: 85%;
                padding: 10px 14px;
                font-size: 0.95em;
            }

            .preset-poems {
                gap: 8px;
            }

            .preset-poem {
                padding: 6px 12px;
                font-size: 0.85em;
            }

            .generated-image {
                max-width: 100%;
                border-width: 2px;
            }

            .poetry-analysis {
                padding: 15px;
                font-size: 0.95em;
            }
        }

        /* 横竖屏适配 */
        @media (orientation: landscape) and (max-height: 500px) {
            header {
                padding: 15px 0;
                margin-bottom: 15px;
            }

            h1 {
                font-size: 1.5em;
                letter-spacing: 3px;
            }

            .subtitle {
                display: none;
            }

            .tab-nav {
                margin-bottom: 15px;
            }

            .tab-btn {
                padding: 8px 16px;
                font-size: 0.9em;
            }

            .section-card {
                padding: 15px;
            }

            .chat-container {
                max-height: 280px;
            }

            .chat-messages {
                min-height: 150px;
            }

            .poet-selector {
                gap: 8px;
            }

            .poet-btn {
                padding: 8px 14px;
                font-size: 0.85em;
            }
        }

        /* 超小屏幕适配（小于375px） */
        @media screen and (max-width: 374px) {
            h1 {
                font-size: 1.5em;
                letter-spacing: 2px;
            }

            .tab-btn {
                padding: 8px 12px;
                font-size: 0.85em;
            }

            .poet-btn {
                flex: 1 1 100%;
            }

            .message .avatar {
                width: 32px;
                height: 32px;
                font-size: 1em;
            }

            .message .bubble {
                max-width: 88%;
                padding: 8px 12px;
                font-size: 0.9em;
            }
        }

        /* 触摸设备优化 - 移除hover效果的负面影响 */
        @media (hover: none) and (pointer: coarse) {
            .tab-btn:hover,
            .poet-btn:hover,
            .preset-poem:hover,
            .btn:hover {
                transform: none;
                box-shadow: none;
            }

            .tab-btn:active,
            .poet-btn:active,
            .preset-poem:active,
            .btn:active {
                transform: scale(0.98);
            }
        }

        /* 大屏幕优化 */
        @media screen and (min-width: 1200px) {
            .container {
                max-width: 1000px;
            }

            h1 {
                font-size: 2.8em;
            }

            .section-card {
                padding: 35px;
            }

            .storyboard-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>诗境·穿越</h1>
            <p class="subtitle">古诗词互动平台 Demo</p>
        </header>

        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="tab1">诗画觉醒</button>
            <button class="tab-btn" data-tab="tab2">剧本工坊</button>
            <button class="tab-btn" data-tab="tab3">诗人连线</button>
        </nav>

        <!-- 诗画觉醒 -->
        <section id="tab1" class="tab-content active">
            <div class="section-card">
                <h2 class="section-title">诗画觉醒</h2>
                <div class="preset-poems">
                    <span class="preset-poem" data-poem="静夜思">静夜思</span>
                    <span class="preset-poem" data-poem="春晓">春晓</span>
                    <span class="preset-poem" data-poem="登鹳雀楼">登鹳雀楼</span>
                    <span class="preset-poem" data-poem="望庐山瀑布">望庐山瀑布</span>
                    <span class="preset-poem" data-poem="咏鹅">咏鹅</span>
                </div>
                <div class="input-group">
                    <textarea id="poemInput1" placeholder="请输入古诗词，如：床前明月光，疑是地上霜，举头望明月，低头思故乡"></textarea>
                    <button class="btn" id="generateBtn">生成意境</button>
                </div>
                <div id="resultArea1" class="result-area">
                    <p style="color: #666; text-align: center;">输入诗词，点击生成，感受诗意画境</p>
                </div>
            </div>
        </section>

        <!-- 剧本工坊 -->
        <section id="tab2" class="tab-content">
            <div class="section-card">
                <h2 class="section-title">剧本工坊</h2>
                <div class="preset-poems">
                    <span class="preset-poem" data-poem="静夜思">静夜思</span>
                    <span class="preset-poem" data-poem="春晓">春晓</span>
                    <span class="preset-poem" data-poem="登鹳雀楼">登鹳雀楼</span>
                    <span class="preset-poem" data-poem="望庐山瀑布">望庐山瀑布</span>
                    <span class="preset-poem" data-poem="咏鹅">咏鹅</span>
                </div>
                <div class="input-group">
                    <textarea id="poemInput2" placeholder="请输入古诗词，AI将为你生成分镜脚本"></textarea>
                    <button class="btn" id="scriptBtn">生成分镜</button>
                </div>
                <div id="resultArea2" class="result-area">
                    <p style="color: #666; text-align: center;">输入诗词，点击生成分镜剧本</p>
                </div>
            </div>
        </section>

        <!-- 诗人连线 -->
        <section id="tab3" class="tab-content">
            <div class="section-card">
                <h2 class="section-title">诗人连线</h2>
                <div class="poet-selector">
                    <button class="poet-btn selected" data-poet="libai">李白</button>
                    <button class="poet-btn" data-poet="sushi">苏轼</button>
                    <button class="poet-btn" data-poet="dufu">杜甫</button>
                    <button class="poet-btn" data-poet="liqingzhao">李清照</button>
                </div>
                <div class="chat-container">
                    <div id="chatMessages" class="chat-messages">
                        <div class="message ai">
                            <div class="avatar">🍶</div>
                            <div class="bubble">在下李白，字太白。君乃何人？有何事相询？</div>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="与诗人对话...">
                        <button class="btn" id="sendBtn">发送</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        // Tab导航
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            });
        });

        // 预设诗词数据
        const poemData = {
            '静夜思': {
                full: '床前明月光，疑是地上霜。举头望明月，低头思故乡。',
                analysis: '此诗写秋夜月色，诗人客居在外，于静夜中望月生情。首二句写月光皎洁如霜，营造清冷意境；末二句笔锋一转，由望月而思故乡，情景交融，千古传诵。'
            },
            '春晓': {
                full: '春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。',
                analysis: '此诗写春日清晨之景。诗人酣眠不觉天晓，耳畔处处鸟鸣；回想夜来风雨，不知落花多少。语言平易，意境深远，表达了对春光流逝的淡淡惋惜。'
            },
            '登鹳雀楼': {
                full: '白日依山尽，黄河入海流。欲穷千里目，更上一层楼。',
                analysis: '诗写登楼远眺之景。白日依山而落，黄河奔流入海，气象雄浑。末二句富含哲理：欲观更远之景，需更上层楼。表达了积极进取、不断超越的情怀。'
            },
            '望庐山瀑布': {
                full: '日照香炉生紫烟，遥看瀑布挂前川。飞流直下三千尺，疑是银河落九天。',
                analysis: '此诗描绘庐山瀑布之壮观。香炉峰云雾缭绕，日光照射呈现紫烟；瀑布如白练高悬，飞流直下，气势磅礴。诗人以夸张手法，将瀑布比作银河落天，想象奇特。'
            },
            '咏鹅': {
                full: '鹅鹅鹅，曲项向天歌。白毛浮绿水，红掌拨清波。',
                analysis: '此诗写鹅之形态色泽。首句叠词生动有趣；次句写鹅伸颈高歌之态；三四句描绘白羽浮于绿水、红掌拨动清波之美景，色彩鲜明，对仗工整。'
            }
        };

        // 诗人对话数据
        const poetResponses = {
            libai: [
                '君问归期未有期，巴山夜雨涨秋池。',
                '人生得意须尽欢，莫使金樽空对月。',
                '天生我材必有用，千金散尽还复来。',
                '长风破浪会有时，直挂云帆济沧海。',
                '抽刀断水水更流，举杯消愁愁更愁。'
            ],
            sushi: [
                '明月几时有？把酒问青天。',
                '但愿人长久，千里共婵娟。',
                '大江东去，浪淘尽，千古风流人物。',
                '竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。',
                '回首向来萧瑟处，归去，也无风雨也无晴。'
            ],
            dufu: [
                '国破山河在，城春草木深。',
                '感时花溅泪，恨别鸟惊心。',
                '安得广厦千万间，大庇天下寒士俱欢颜。',
                '会当凌绝顶，一览众山小。',
                '烽火连三月，家书抵万金。'
            ],
            liqingzhao: [
                '寻寻觅觅，冷冷清清，凄凄惨惨戚戚。',
                '莫道不销魂，帘卷西风，人比黄花瘦。',
                '知否？知否？应是绿肥红瘦。',
                '生当作人杰，死亦为鬼雄。',
                '此情无计可消除，才下眉头，却上心头。'
            ]
        };

        const poetAvatars = {
            libai: '🍶',
            sushi: '🖌️',
            dufu: '📜',
            liqingzhao: '🌸'
        };

        const poetNames = {
            libai: '李白',
            sushi: '苏轼',
            dufu: '杜甫',
            liqingzhao: '李清照'
        };

        let currentPoet = 'libai';

        // 预设诗词点击
        document.querySelectorAll('.preset-poem').forEach(tag => {
            tag.addEventListener('click', () => {
                const poem = tag.dataset.poem;
                const inputs = document.querySelectorAll('textarea');
                inputs.forEach(input => input.value = poemData[poem].full);
            });
        });

        // 诗画觉醒 - 生成图片
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const poem = document.getElementById('poemInput1').value.trim();
            if (!poem) {
                alert('请输入古诗词');
                return;
            }

            const resultArea = document.getElementById('resultArea1');
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;

            resultArea.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p class="loading-text">正在生成诗意画境...</p>
                </div>
            `;

            setTimeout(async () => {
                try {
                    // 调用图片生成API
                    const response = await fetch('https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            prompt: `${poem}，中国古风水墨画风格，梦幻意境，淡淡金色点缀`,
                            negative_prompt: '现代建筑，汽车，人物，英文',
                            width: 512,
                            height: 512,
                            steps: 20,
                            seed: Math.floor(Math.random() * 1000000)
                        })
                    });

                    const data = await response.json();
                    const imageUrl = data.images?.[0]?.url || '';

                    // 查找匹配的诗词解析
                    let analysis = '';
                    for (const key in poemData) {
                        if (poem.includes(key) || poemData[key].full.includes(poem)) {
                            analysis = poemData[key].analysis;
                            break;
                        }
                    }
                    if (!analysis) {
                        analysis = '这首诗词意境深远，表达了诗人对自然与人生的深刻感悟。画面中月色朦胧，山水相依，云雾缭绕，仿佛置身于仙境之中。';
                    }

                    resultArea.innerHTML = `
                        ${imageUrl ? `<img src="${imageUrl}" class="generated-image" alt="诗意画境">` : '<p style="color:#d4af37;text-align:center;margin:20px;">图片生成服务暂不可用，请稍后重试</p>'}
                        <div class="poetry-analysis">
                            <h3 style="color:#d4af37;margin-bottom:10px;">诗意解析</h3>
                            <p>${analysis}</p>
                        </div>
                    `;
                } catch (error) {
                    console.error('生成失败:', error);
                    resultArea.innerHTML = '<p style="color:#ff6b6b;text-align:center;">生成失败，请稍后重试</p>';
                }
                btn.disabled = false;
            }, 2000);
        });

        // 剧本工坊 - 生成分镜
        document.getElementById('scriptBtn').addEventListener('click', () => {
            const poem = document.getElementById('poemInput2').value.trim();
            if (!poem) {
                alert('请输入古诗词');
                return;
            }

            const resultArea = document.getElementById('resultArea2');
            const btn = document.getElementById('scriptBtn');
            btn.disabled = true;

            resultArea.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p class="loading-text">正在生成分镜脚本...</p>
                </div>
            `;

            setTimeout(() => {
                const storyboards = [
                    { title: '开场·夜色', desc: '月光洒落，诗人独坐窗前，望月凝思' },
                    { title: '中景·吟诗', desc: '诗人起身踱步，低声吟诵，神情悠然' },
                    { title: '近景·特写', desc: '面部表情变化，由思乡转为释然微笑' },
                    { title: '结尾·留白', desc: '镜头缓缓拉远，月光与诗人剪影渐隐' }
                ];

                let cardsHtml = '<div class="storyboard-grid">';
                storyboards.forEach((scene, i) => {
                    cardsHtml += `
                        <div class="storyboard-card">
                            <div class="scene-num">分镜 ${i + 1}</div>
                            <div class="scene-title">${scene.title}</div>
                            <div class="scene-desc">${scene.desc}</div>
                        </div>
                    `;
                });
                cardsHtml += '</div>';

                resultArea.innerHTML = `
                    <h3 style="color:#d4af37;margin-bottom:15px;">《${poem.slice(0, 10)}...》分镜脚本</h3>
                    ${cardsHtml}
                    <div class="poetry-analysis" style="margin-top:20px;">
                        <h3 style="color:#d4af37;margin-bottom:10px;">创作说明</h3>
                        <p>本分镜以诗意叙事为核心，通过四个场景展现诗人由景生情、借景抒情的创作过程。运用空镜转场与情感递进相结合的手法，呈现古诗词的意境之美。</p>
                    </div>
                `;
                btn.disabled = false;
            }, 2000);
        });

        // 诗人连线
        document.querySelectorAll('.poet-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.poet-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                currentPoet = btn.dataset.poet;
                document.getElementById('chatMessages').innerHTML = `
                    <div class="message ai">
                        <div class="avatar">${poetAvatars[currentPoet]}</div>
                        <div class="bubble">在下${poetNames[currentPoet]}，字太白。君乃何人？有何事相询？</div>
                    </div>
                `;
            });
        });

        function addMessage(text, isUser) {
            const chatMessages = document.getElementById('chatMessages');
            const avatar = isUser ? '👤' : poetAvatars[currentPoet];
            const message = document.createElement('div');
            message.className = `message ${isUser ? 'user' : 'ai'}`;
            message.innerHTML = `
                <div class="avatar">${avatar}</div>
                <div class="bubble">${text}</div>
            `;
            chatMessages.appendChild(message);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, true);
            input.value = '';

            setTimeout(() => {
                const responses = poetResponses[currentPoet];
                const response = responses[Math.floor(Math.random() * responses.length)];
                addMessage(response, false);
            }, 1000);
        }
    </script>
</body>
</html>
