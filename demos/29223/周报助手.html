<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周报小助手 - AI自动生成标准化周报</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .loading::after {
            content: '生成中...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '生成中'; }
            40% { content: '生成中.'; }
            60% { content: '生成中..'; }
            80%, 100% { content: '生成中...'; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 顶部标题 -->
    <header class="gradient-bg text-white py-6 shadow-lg">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold">📝 周报小助手</h1>
                    <p class="text-white/80 mt-1">AI驱动的工作记录归集与周报自动生成工具</p>
                </div>
                <span class="bg-white/20 px-3 py-1 rounded-full text-sm">学习工作赛道</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <!-- 功能演示区 -->
        <div class="grid md:grid-cols-2 gap-6 mb-10">
            <!-- 左侧输入区 -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <h2 class="text-lg font-semibold mb-4 text-gray-800">📌 输入本周工作碎片</h2>
                <textarea id="workInput" class="w-full h-64 p-4 border border-gray-200 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-indigo-400" placeholder="粘贴你的每日工作记录、聊天片段、待办完成项即可
例如：
周一：完成项目A需求评审，和产品对齐3个细节
周二：写了2个接口文档，修复了3个bug
周三：参加部门周会，汇报项目进度
周四：对接运营侧数据需求，导出了5份报表
周五：整理项目文档，同步给团队成员">
周一：完成用户管理模块的需求评审，和产品对齐3个核心逻辑
周二：编写接口文档2份，修复线上bug3个
周三：参加部门周会，汇报项目整体进度
周四：对接运营数据需求，导出月度报表5份
周五：整理项目交付文档，同步给测试团队</textarea>
                <button id="generateBtn" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition-colors">
                    ✨ AI一键生成周报
                </button>
            </div>

            <!-- 右侧输出区 -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <h2 class="text-lg font-semibold mb-4 text-gray-800">📄 生成结果</h2>
                <div id="resultArea" class="w-full h-64 p-4 border border-gray-200 rounded-lg bg-gray-50 text-gray-700 leading-relaxed overflow-auto">
                    点击左侧按钮，AI将自动归集信息并生成标准化周报
                </div>
                <div class="flex gap-2 mt-4">
                    <button class="flex-1 py-2 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50 text-sm">📋 一键复制</button>
                    <button class="flex-1 py-2 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50 text-sm">📥 导出文件</button>
                </div>
            </div>
        </div>

        <!-- 创意说明 -->
        <div class="bg-white rounded-xl shadow-md p-6">
            <h2 class="text-lg font-semibold mb-4 text-gray-800">💡 创意方案说明</h2>
            <div class="grid md:grid-cols-2 gap-6 text-gray-700">
                <div>
                    <h3 class="font-medium text-gray-800 mb-2">核心痛点</h3>
                    <p class="text-sm leading-relaxed">职场人每周撰写周报耗时久，经常遗忘工作细节，重复整理效率低；学生群体也有定期复盘、总结的通用需求，手动撰写费时费力。</p>
                </div>
                <div>
                    <h3 class="font-medium text-gray-800 mb-2">核心功能</h3>
                    <ul class="text-sm space-y-1">
                        <li>• 自动归集碎片化工作记录，提炼核心内容</li>
                        <li>• 按标准框架生成结构化周报，支持多种风格切换</li>
                        <li>• 一键复制导出，适配各类办公系统提交</li>
                        <li>• 支持周报历史存档，方便回溯工作进度</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-6 text-gray-500 text-sm">
        TRAE AI创造力大赛 · 学习工作赛道参赛作品
    </footer>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const workInput = document.getElementById('workInput');
        const resultArea = document.getElementById('resultArea');

        generateBtn.addEventListener('click', () => {
            const input = workInput.value.trim();
            if (!input) {
                alert('请先输入本周工作记录');
                return;
            }

            resultArea.classList.add('loading');
            resultArea.textContent = '';
            
            setTimeout(() => {
                resultArea.classList.remove('loading');
                resultArea.innerHTML = `
<h3 class="font-bold text-gray-800 mb-2">【本周工作总结】</h3>
<p class="mb-2">1. 项目研发：完成用户管理模块需求评审，对齐3项核心逻辑；编写接口文档2份，修复线上bug3个，保障系统稳定运行。</p>
<p class="mb-2">2. 协作沟通：参加部门周会并汇报项目进度；对接运营侧数据需求，完成5份月度报表导出，支撑运营业务开展。</p>
<p class="mb-4">3. 文档沉淀：整理项目交付文档并同步至测试团队，为后续测试环节做好准备。</p>

<h3 class="font-bold text-gray-800 mb-2">【下周工作计划】</h3>
<p class="mb-2">1. 启动用户管理模块开发，完成核心功能编码</p>
<p class="mb-2">2. 配合测试团队开展功能验证，及时跟进问题修复</p>
<p class="mb-2">3. 跟进运营数据需求迭代，优化报表生成效率</p>

<h3 class="font-bold text-gray-800 mb-2">【问题与需求】</h3>
<p>暂无阻塞性问题，后续将按计划推进项目进度。</p>
                `;
            }, 1200);
        });
    </script>
</body>
</html>
