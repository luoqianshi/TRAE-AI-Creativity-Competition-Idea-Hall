<body>
  <div class="app">
    <div class="header">
      <h1>&#128194; 文件夹智能分类助手</h1>
      <div class="header-actions">
        <button class="btn" onclick="showHelp()">&#10067; 帮助</button>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
        &#128193; 导入文件
      </button>
      <input type="file" id="fileInput" class="file-input" multiple onchange="handleFileSelect(event)">
      <button class="btn" onclick="clearFiles()">&#128465; 清空</button>
      <button class="btn" onclick="selectAll()">&#9989; 全选</button>
      <button class="btn" onclick="deselectAll()">&#9744; 取消全选</button>
      <div style="flex:1"></div>
      <button class="btn btn-success" onclick="applyOrganize()" id="applyBtn" disabled>
        &#9989; 执行分类
      </button>
    </div>

    <div class="main">
      <!-- Left: File List -->
      <div class="panel-left">
        <div class="panel-header">
          <span>&#128196; 文件列表</span>
          <span class="count" id="fileCount">0 个文件</span>
        </div>
        <div class="file-list" id="fileList">
          <div class="empty-state">
            <div class="icon">&#128194;</div>
            <p>点击"导入文件"选择要分类的文件</p>
            <p style="font-size:12px;margin-top:8px;">支持多选</p>
          </div>
        </div>
      </div>

      <!-- Center: Rules -->
      <div class="panel-center">
        <div class="panel-header">
          <span>&#9881; 分类规则</span>
        </div>
        <div class="rules-container">
          <!-- Auto Categorize -->
          <div class="rule-section">
            <div class="rule-header">
              <span>&#128208; 按文件类型自动分类</span>
              <label class="switch">
                <input type="checkbox" id="autoCategorize" checked onchange="updatePreview()">
                <span class="slider"></span>
              </label>
            </div>
            <div class="rule-body">
              <div class="category-list" id="categoryList"></div>
            </div>
          </div>

          <!-- By Date -->
          <div class="rule-section">
            <div class="rule-header">
              <span>&#128197; 按日期分类</span>
              <label class="switch">
                <input type="checkbox" id="byDate" onchange="updatePreview()">
                <span class="slider"></span>
              </label>
            </div>
            <div class="rule-body">
              <div class="form-group">
                <label class="form-label">日期格式</label>
                <select class="form-select" id="dateFormat" onchange="updatePreview()">
                  <option value="year">按年份 (2024/)</option>
                  <option value="month">按年月 (2024-06/)</option>
                  <option value="day">按年月日 (2024-06-24/)</option>
                </select>
              </div>
            </div>
          </div>

          <!-- By Name Pattern -->
          <div class="rule-section">
            <div class="rule-header">
              <span>&#128269; 按文件名关键词分类</span>
              <label class="switch">
                <input type="checkbox" id="byKeyword" onchange="updatePreview()">
                <span class="slider"></span>
              </label>
            </div>
            <div class="rule-body">
              <div class="form-group">
                <label class="form-label">关键词规则 (每行一个: 文件夹名=关键词1,关键词2)</label>
                <textarea class="form-input" id="keywordRules" rows="4" placeholder="工作=报告,项目,会议&#10;个人=照片,旅行,家庭&#10;学习=课程,笔记,考试" oninput="updatePreview()"></textarea>
              </div>
            </div>
          </div>

          <!-- Rename Pattern -->
          <div class="rule-section">
            <div class="rule-header">
              <span>&#128295; 统一重命名格式</span>
              <label class="switch">
                <input type="checkbox" id="renamePattern" onchange="updatePreview()">
                <span class="slider"></span>
              </label>
            </div>
            <div class="rule-body">
              <div class="form-group">
                <label class="form-label">前缀</label>
                <input type="text" class="form-input" id="renamePrefix" placeholder="如: 项目_" oninput="updatePreview()">
              </div>
              <div class="form-group">
                <label class="form-label">添加序号</label>
                <select class="form-select" id="addNumber" onchange="updatePreview()">
                  <option value="none">不添加</option>
                  <option value="prefix">序号前缀 (01_, 02_)</option>
                  <option value="suffix">序号后缀 (_01, _02)</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right: Preview -->
      <div class="panel-right">
        <div class="panel-header">
          <span>&#128064; 分类预览</span>
          <span class="count" id="folderCount">0 个文件夹</span>
        </div>
        <div class="preview-container" id="previewContainer">
          <div class="empty-state">
            <div class="icon">&#128064;</div>
            <p>导入文件后将显示分类预览</p>
          </div>
        </div>
      </div>
    </div>

    <div class="status-bar">
      <div class="stats">
        <div class="stat"><span>总文件:</span><span class="stat-value" id="statTotal">0</span></div>
        <div class="stat"><span>已选择:</span><span class="stat-value" id="statSelected">0</span></div>
        <div class="stat"><span>将分类:</span><span class="stat-value" id="statChanged">0</span></div>
      </div>
      <div>文件夹智能分类助手 v1.0 | TRAE 创造大赛作品</div>
    </div>
  </div>

  <!-- Result Modal -->
  <div class="modal-overlay" id="resultModal">
    <div class="modal">
      <div class="modal-header">&#9989; 分类完成</div>
      <div class="modal-body">
        <p style="margin-bottom:12px;">文件已按以下结构分类：</p>
        <div id="resultList"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()" style="color:var(--ink);border-color:var(--rule);">关闭</button>
        <button class="btn btn-primary" onclick="downloadAll()">&#128229; 下载分类结果</button>
      </div>
    </div>
  </div>

  <script>
    let files = [];
    let selectedFiles = new Set();
    let organizedFiles = [];

    const categories = [
      { name: '图片', color: '#f59e0b', exts: ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg', 'ico'] },
      { name: '文档', color: '#3b82f6', exts: ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'txt', 'md', 'csv'] },
      { name: '视频', color: '#ef4444', exts: ['mp4', 'avi', 'mkv', 'mov', 'wmv', 'flv', 'webm'] },
      { name: '音频', color: '#8b5cf6', exts: ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma'] },
      { name: '压缩包', color: '#10b981', exts: ['zip', 'rar', '7z', 'tar', 'gz', 'bz2'] },
      { name: '代码', color: '#6366f1', exts: ['js', 'html', 'css', 'py', 'java', 'cpp', 'c', 'go', 'rs', 'ts', 'json', 'xml'] },
      { name: '其他', color: '#94a3b8', exts: [] }
    ];

    const fileIcons = {
      'image': '&#128444;', 'video': '&#127909;', 'audio': '&#127925;',
      'document': '&#128196;', 'code': '&#128187;', 'archive': '&#128230;', 'default': '&#128193;'
    };

    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      const cat = categories.find(c => c.exts.includes(ext));
      if (!cat || cat.name === '图片') return fileIcons.image;
      if (cat.name === '视频') return fileIcons.video;
      if (cat.name === '音频') return fileIcons.audio;
      if (cat.name === '文档') return fileIcons.document;
      if (cat.name === '代码') return fileIcons.code;
      if (cat.name === '压缩包') return fileIcons.archive;
      return fileIcons.default;
    }

    function getCategory(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      const cat = categories.find(c => c.exts.includes(ext));
      return cat ? cat.name : '其他';
    }

    function formatSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function handleFileSelect(event) {
      const newFiles = Array.from(event.target.files);
      newFiles.forEach(file => {
        files.push({
          id: Date.now() + Math.random(),
          originalName: file.name,
          newName: file.name,
          folder: '',
          size: file.size,
          file: file,
          lastModified: file.lastModified,
          changed: false
        });
        selectedFiles.add(files[files.length - 1].id);
      });
      updateUI();
      updatePreview();
    }

    function clearFiles() {
      files = [];
      selectedFiles.clear();
      updateUI();
      updatePreview();
    }

    function selectAll() {
      files.forEach(f => selectedFiles.add(f.id));
      updateUI();
      updatePreview();
    }

    function deselectAll() {
      selectedFiles.clear();
      updateUI();
      updatePreview();
    }

    function toggleSelect(id) {
      if (selectedFiles.has(id)) selectedFiles.delete(id);
      else selectedFiles.add(id);
      updateUI();
      updatePreview();
    }

    function getFolderPath(file) {
      let path = '';

      // Auto categorize by type
      if (document.getElementById('autoCategorize').checked) {
        path = getCategory(file.originalName);
      }

      // By date
      if (document.getElementById('byDate').checked) {
        const date = new Date(file.lastModified);
        const format = document.getElementById('dateFormat').value;
        let dateStr = '';
        if (format === 'year') dateStr = String(date.getFullYear());
        else if (format === 'month') dateStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
        else dateStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
        path = path ? `${path}/${dateStr}` : dateStr;
      }

      // By keyword
      if (document.getElementById('byKeyword').checked) {
        const rulesText = document.getElementById('keywordRules').value;
        if (rulesText) {
          const rules = rulesText.split('\n').filter(r => r.includes('='));
          for (const rule of rules) {
            const [folder, keywords] = rule.split('=');
            if (folder && keywords) {
              const kws = keywords.split(',').map(k => k.trim());
              if (kws.some(k => file.originalName.toLowerCase().includes(k.toLowerCase()))) {
                path = path ? `${folder.trim()}/${path}` : folder.trim();
                break;
              }
            }
          }
        }
      }

      return path || '未分类';
    }

    function getNewName(file, index) {
      let name = file.originalName;
      const extIndex = name.lastIndexOf('.');
      const ext = extIndex > 0 ? name.substring(extIndex) : '';
      const base = extIndex > 0 ? name.substring(0, extIndex) : name;

      // Add prefix
      if (document.getElementById('renamePattern').checked) {
        const prefix = document.getElementById('renamePrefix').value;
        const numType = document.getElementById('addNumber').value;

        if (prefix) name = prefix + name;

        if (numType !== 'none') {
          const num = String(index + 1).padStart(2, '0');
          if (numType === 'prefix') name = num + '_' + name;
          else name = base + '_' + num + ext;
        }
      }

      return name;
    }

    function updatePreview() {
      const selected = files.filter(f => selectedFiles.has(f.id));
      let changedCount = 0;
      const folders = {};

      selected.forEach((file, idx) => {
        file.folder = getFolderPath(file);
        file.newName = getNewName(file, idx);
        file.changed = file.folder !== '' || file.newName !== file.originalName;
        if (file.changed) changedCount++;

        if (!folders[file.folder]) folders[file.folder] = [];
        folders[file.folder].push(file);
      });

      const container = document.getElementById('previewContainer');
      if (selected.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">&#128064;</div>
            <p>选择文件后将显示分类预览</p>
          </div>`;
        document.getElementById('folderCount').textContent = '0 个文件夹';
      } else {
        container.innerHTML = Object.entries(folders).map(([folder, items]) => `
          <div class="folder-group">
            <div class="folder-header">&#128193; ${folder} (${items.length} 个文件)</div>
            <div class="folder-files">
              ${items.map(f => `
                <div class="folder-file">
                  <span class="old-name" title="${f.originalName}">${f.originalName}</span>
                  <span class="arrow">&#10142;</span>
                  <span class="new-name" title="${f.folder}/${f.newName}">${f.folder}/${f.newName}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('');
        document.getElementById('folderCount').textContent = Object.keys(folders).length + ' 个文件夹';
      }

      document.getElementById('statChanged').textContent = changedCount;
      document.getElementById('applyBtn').disabled = selected.length === 0;
    }

    function updateUI() {
      const fileList = document.getElementById('fileList');
      document.getElementById('fileCount').textContent = files.length + ' 个文件';
      document.getElementById('statTotal').textContent = files.length;
      document.getElementById('statSelected').textContent = selectedFiles.size;

      if (files.length === 0) {
        fileList.innerHTML = `
          <div class="empty-state">
            <div class="icon">&#128194;</div>
            <p>点击"导入文件"选择要分类的文件</p>
            <p style="font-size:12px;margin-top:8px;">支持多选</p>
          </div>`;
        return;
      }

      fileList.innerHTML = files.map(file => `
        <div class="file-item ${selectedFiles.has(file.id) ? 'selected' : ''}" onclick="toggleSelect(${file.id})">
          <input type="checkbox" class="file-checkbox" ${selectedFiles.has(file.id) ? 'checked' : ''} onclick="event.stopPropagation()">
          <span class="file-icon">${getFileIcon(file.originalName)}</span>
          <div class="file-info">
            <div class="file-name" title="${file.originalName}">${file.originalName}</div>
            <div class="file-meta">${formatSize(file.size)}</div>
          </div>
          <span class="file-category">${getCategory(file.originalName)}</span>
        </div>
      `).join('');
    }

    function renderCategoryList() {
      const container = document.getElementById('categoryList');
      container.innerHTML = categories.map(c => `
        <div class="category-item">
          <div class="category-color" style="background:${c.color}"></div>
          <span class="category-name">${c.name}</span>
          <span class="category-exts">${c.exts.slice(0, 5).join(', ')}${c.exts.length > 5 ? '...' : ''}</span>
        </div>
      `).join('');
    }

    function applyOrganize() {
      const selected = files.filter(f => selectedFiles.has(f.id));
      organizedFiles = [];

      selected.forEach(file => {
        organizedFiles.push({
          original: file.originalName,
          folder: file.folder,
          newName: file.newName,
          fileObj: file
        });
      });

      // Show result
      const folders = {};
      organizedFiles.forEach(f => {
        if (!folders[f.folder]) folders[f.folder] = 0;
        folders[f.folder]++;
      });

      document.getElementById('resultList').innerHTML = Object.entries(folders).map(([folder, count]) => `
        <div class="result-item">
          <span>&#128193; ${folder}</span>
          <span class="result-name">${count} 个文件</span>
        </div>
      `).join('');

      document.getElementById('resultModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('resultModal').classList.remove('active');
    }

    function downloadAll() {
      organizedFiles.forEach((f, i) => {
        if (f.fileObj && f.fileObj.file) {
          setTimeout(() => {
            const url = URL.createObjectURL(f.fileObj.file);
            const a = document.createElement('a');
            a.href = url;
            a.download = f.folder + '_' + f.newName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, i * 100);
        }
      });
    }

    function showHelp() {
      alert(`文件夹智能分类助手 使用说明：

1. 点击"导入文件"选择要分类的文件（可多选）
2. 在左侧勾选要处理的文件
3. 在中间配置分类规则：
   - 按文件类型：自动按图片/文档/视频等分类
   - 按日期：按文件修改日期分文件夹
   - 按关键词：按文件名中的关键词分类
   - 统一重命名：添加前缀或序号
4. 右侧实时预览分类结果
5. 点击"执行分类"后下载整理好的文件

提示：可同时组合多种分类规则。`);
    }

    // Init
    renderCategoryList();
    updateUI();
    updatePreview();
  </script>
</body>
</html>
