<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宠物时间管家</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF8E8E;
      --primary-light: #FFB4B4;
      --primary-dark: #E86868;
      --primary-soft: #FFE4E4;
      --focus: #6C9BCF;
      --focus-light: #A8C8E8;
      --focus-soft: #E8F1FA;
      --rest: #7EC8A0;
      --rest-light: #B0E0C8;
      --rest-soft: #E8F5EE;
      --alert: #F4A261;
      --alert-light: #F8C896;
      --alert-soft: #FDF0E4;
      --bg: #F5F0EB;
      --bg-card: #FFFFFF;
      --bg-elevated: #FAFAF8;
      --text-primary: #2D2A26;
      --text-secondary: #6B6560;
      --text-muted: #A39D97;
      --text-inverse: #FFFFFF;
      --shadow-light: #FFFFFF;
      --shadow-dark: rgba(163, 153, 141, 0.4);
      --shadow-raised: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
      --shadow-sunken: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
      --shadow-floating: 12px 12px 24px rgba(163, 153, 141, 0.3), -8px -8px 20px var(--shadow-light);
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.4);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      --pet-primary: #FFB6C1;
      --pet-secondary: #FFF0F5;
      --pet-eye: #4A4A4A;
      --pet-blush: #FF69B4;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --radius-full: 9999px;
      --font-display: 'Fredoka', sans-serif;
      --font-body: 'Nunito', sans-serif;
      --transition-fast: 0.15s ease;
      --transition-base: 0.3s ease;
      --transition-slow: 0.5s ease;
      --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      --nav-height: 72px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); font-weight: 600; line-height: 1.3; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; outline: none; }
    input, select { font-family: inherit; outline: none; border: none; }

    /* Layout */
    .app-container { max-width: 1200px; margin: 0 auto; padding: 0 var(--space-md); }
    .page-section { display: none; padding-bottom: calc(var(--nav-height) + var(--space-lg)); min-height: 100vh; }
    .page-section.active { display: block; }

    /* Navigation */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-height);
      background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); z-index: 1000;
      display: flex; align-items: center; justify-content: space-around; padding: 0 var(--space-lg);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md);
      transition: all var(--transition-base); color: var(--text-muted); position: relative;
      background: none; font-size: 11px; font-weight: 600; font-family: var(--font-display);
    }
    .nav-item:hover { color: var(--text-secondary); transform: translateY(-2px); }
    .nav-item.active { color: var(--primary); }
    .nav-item.active::before {
      content: ''; position: absolute; top: -4px; width: 24px; height: 3px;
      background: var(--primary); border-radius: var(--radius-full);
    }
    .nav-item svg { width: 24px; height: 24px; stroke-width: 2; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-sm);
      padding: var(--space-md) var(--space-xl); border-radius: var(--radius-lg);
      font-family: var(--font-display); font-weight: 600; font-size: 15px;
      transition: all var(--transition-base); cursor: pointer; border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--text-inverse); box-shadow: 0 4px 16px rgba(232, 104, 104, 0.35), var(--shadow-raised);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(232, 104, 104, 0.45), var(--shadow-floating); }
    .btn-primary:active { transform: translateY(0) scale(0.97); }
    .btn-secondary {
      background: var(--bg-card); color: var(--text-primary); box-shadow: var(--shadow-raised);
    }
    .btn-secondary:hover { transform: translateY(-2px); box-shadow: var(--shadow-floating); }
    .btn-sm { padding: var(--space-sm) var(--space-md); font-size: 13px; border-radius: var(--radius-md); }

    /* Cards */
    .card {
      background: var(--bg-card); border-radius: var(--radius-lg); padding: var(--space-lg);
      box-shadow: var(--shadow-raised); transition: all var(--transition-base);
    }
    .card:hover { box-shadow: var(--shadow-floating); }

    /* Timer Circle */
    .timer-section { display: flex; flex-direction: column; align-items: center; gap: var(--space-lg); padding: var(--space-xl) var(--space-lg); }
    .timer-circle { position: relative; width: 240px; height: 240px; }
    .timer-circle svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .timer-circle-bg { fill: none; stroke: var(--bg); stroke-width: 8; }
    .timer-circle-progress { fill: none; stroke: url(#timer-gradient); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 691; stroke-dashoffset: 691; transition: stroke-dashoffset 1s linear; }
    .timer-circle-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-sm); }
    .timer-time { font-family: var(--font-display); font-size: 48px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .timer-label { font-size: 14px; color: var(--text-muted); font-weight: 500; }
    .timer-status { display: flex; align-items: center; gap: var(--space-sm); padding: 6px 16px; border-radius: var(--radius-full); font-size: 13px; font-weight: 600; font-family: var(--font-display); }
    .timer-status.focus { background: var(--focus-soft); color: var(--focus); }
    .timer-status.rest { background: var(--rest-soft); color: var(--rest); }
    .timer-status.idle { background: var(--bg-elevated); color: var(--text-muted); }

    /* Timer Controls */
    .timer-controls { display: flex; align-items: center; gap: var(--space-md); }
    .timer-btn { width: 64px; height: 64px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; transition: all var(--transition-base); box-shadow: var(--shadow-raised); }
    .timer-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-floating); }
    .timer-btn:active { transform: translateY(0) scale(0.95); }
    .timer-btn-primary { width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
    .timer-btn-primary svg { width: 32px; height: 32px; fill: currentColor; }
    .timer-btn-secondary { background: var(--bg-card); color: var(--text-secondary); }
    .timer-btn-secondary svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* Quick Timers */
    .quick-timers { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md); width: 100%; max-width: 400px; }
    .quick-timer-card {
      display: flex; flex-direction: column; align-items: center; gap: var(--space-sm);
      padding: var(--space-lg) var(--space-md); background: var(--bg-card); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-raised); cursor: pointer; transition: all var(--transition-base); border: 2px solid transparent;
    }
    .quick-timer-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-floating); }
    .quick-timer-card:active { transform: translateY(0) scale(0.97); }
    .quick-timer-card.active { border-color: var(--primary); background: var(--primary-soft); }
    .quick-timer-icon { width: 48px; height: 48px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--primary-light), var(--primary)); color: white; }
    .quick-timer-icon svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .quick-timer-label { font-size: 13px; font-weight: 600; color: var(--text-primary); font-family: var(--font-display); }
    .quick-timer-time { font-size: 11px; color: var(--text-muted); }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md); width: 100%; }
    .stat-card { display: flex; flex-direction: column; align-items: center; gap: var(--space-xs); padding: var(--space-md); background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-raised); }
    .stat-value { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--primary); line-height: 1; }
    .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }

    /* Reminders */
    .reminder-list { display: flex; flex-direction: column; gap: var(--space-md); width: 100%; }
    .reminder-item { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md); background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-raised); }
    .reminder-item.completed { opacity: 0.6; }
    .reminder-item.completed .reminder-title { text-decoration: line-through; color: var(--text-muted); }
    .reminder-checkbox { width: 24px; height: 24px; border-radius: var(--radius-sm); border: 2px solid var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all var(--transition-fast); flex-shrink: 0; }
    .reminder-checkbox:hover { border-color: var(--primary); }
    .reminder-checkbox.checked { background: var(--rest); border-color: var(--rest); }
    .reminder-checkbox.checked svg { width: 14px; height: 14px; stroke: white; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .reminder-content { flex: 1; min-width: 0; }
    .reminder-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reminder-time { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    .reminder-actions { display: flex; gap: var(--space-xs); }
    .reminder-action-btn { width: 32px; height: 32px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text-muted); transition: all var(--transition-fast); }
    .reminder-action-btn:hover { background: var(--primary-soft); color: var(--primary-dark); }
    .reminder-action-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .add-reminder-btn { display: flex; align-items: center; justify-content: center; gap: var(--space-sm); padding: var(--space-md); background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-raised); color: var(--text-muted); font-weight: 600; font-size: 14px; width: 100%; transition: all var(--transition-base); border: 2px dashed var(--text-muted); }
    .add-reminder-btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); }

    /* Pet Scene */
    .pet-scene { perspective: 800px; perspective-origin: center center; width: 100%; height: 400px; display: flex; align-items: center; justify-content: center; position: relative; }
    .pet-container { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative; width: 280px; height: 360px; cursor: grab; }
    .pet-container:active { cursor: grabbing; }
    .pet-body-group { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transform-origin: bottom center; }
    .pet-torso { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%) translateZ(0); width: 160px; height: 140px; background: linear-gradient(180deg, var(--pet-primary) 0%, var(--pet-secondary) 100%); border-radius: 50% 50% 45% 45%; box-shadow: inset -10px -10px 20px rgba(0,0,0,0.08), inset 10px 10px 20px rgba(255,255,255,0.3), 0 10px 30px rgba(0,0,0,0.1); }
    .pet-torso::before { content: ''; position: absolute; top: 15%; left: 20%; width: 60%; height: 40%; background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 100%); border-radius: 50%; }
    .pet-head { position: absolute; top: 20px; left: 50%; transform: translateX(-50%) translateZ(30px); width: 140px; height: 130px; background: linear-gradient(180deg, var(--pet-primary) 0%, var(--pet-secondary) 100%); border-radius: 50% 50% 45% 45%; box-shadow: inset -8px -8px 16px rgba(0,0,0,0.06), inset 8px 8px 16px rgba(255,255,255,0.3), 0 8px 20px rgba(0,0,0,0.08); z-index: 10; }
    .pet-face { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 70px; }
    .pet-eye { position: absolute; top: 10px; width: 28px; height: 32px; background: var(--pet-eye); border-radius: 50%; overflow: hidden; }
    .pet-eye.left { left: 8px; }
    .pet-eye.right { right: 8px; }
    .pet-eye::before { content: ''; position: absolute; top: 6px; left: 6px; width: 10px; height: 10px; background: white; border-radius: 50%; }
    .pet-eye::after { content: ''; position: absolute; top: 14px; left: 10px; width: 6px; height: 6px; background: rgba(255,255,255,0.6); border-radius: 50%; }
    .pet-mouth { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 24px; height: 14px; border-bottom: 3px solid var(--pet-eye); border-radius: 0 0 50% 50%; }
    .pet-blush { position: absolute; top: 38px; width: 22px; height: 14px; background: var(--pet-blush); border-radius: 50%; opacity: 0.5; filter: blur(2px); }
    .pet-blush.left { left: -4px; }
    .pet-blush.right { right: -4px; }
    .pet-ear { position: absolute; top: -20px; width: 50px; height: 60px; background: linear-gradient(180deg, var(--pet-primary) 0%, var(--pet-secondary) 100%); border-radius: 50% 50% 30% 30%; transform-origin: bottom center; }
    .pet-ear.left { left: 10px; transform: rotate(-20deg) translateZ(20px); }
    .pet-ear.right { right: 10px; transform: rotate(20deg) translateZ(20px); }
    .pet-limb { position: absolute; background: linear-gradient(180deg, var(--pet-primary) 0%, var(--pet-secondary) 100%); border-radius: 40%; }
    .pet-arm { width: 36px; height: 60px; top: 130px; }
    .pet-arm.left { left: 35px; transform: rotate(15deg) translateZ(15px); }
    .pet-arm.right { right: 35px; transform: rotate(-15deg) translateZ(15px); }
    .pet-leg { width: 42px; height: 50px; bottom: 20px; }
    .pet-leg.left { left: 50px; transform: rotate(-5deg) translateZ(5px); }
    .pet-leg.right { right: 50px; transform: rotate(5deg) translateZ(5px); }
    .pet-tail { position: absolute; bottom: 80px; right: 30px; width: 24px; height: 80px; background: linear-gradient(180deg, var(--pet-primary) 0%, var(--pet-secondary) 100%); border-radius: 50%; transform-origin: bottom center; transform: translateZ(-20px) rotate(20deg); }
    .pet-shadow { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%) rotateX(75deg); width: 180px; height: 180px; background: radial-gradient(ellipse, rgba(0,0,0,0.12) 0%, transparent 70%); border-radius: 50%; pointer-events: none; }

    /* Animations */
    @keyframes breathe { 0%, 100% { transform: scaleY(1) scaleX(1); } 50% { transform: scaleY(1.03) scaleX(0.98); } }
    @keyframes happy-jump { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-20px); } }
    @keyframes excited-spin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
    @keyframes remind-wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes sleepy-sway { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }
    @keyframes eat-chew { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.97); } }
    @keyframes orb-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    .anim-idle-breathe .pet-body-group { animation: breathe 3s ease-in-out infinite; }
    .anim-happy-jump .pet-body-group { animation: happy-jump 0.8s ease-in-out infinite; }
    .anim-excited-spin .pet-body-group { animation: excited-spin 1.2s ease-in-out infinite; }
    .anim-remind-wave .pet-body-group { animation: remind-wave 0.6s ease-in-out infinite; }
    .anim-sleepy-yawn .pet-body-group { animation: sleepy-sway 2s ease-in-out infinite; }
    .anim-eat-chew .pet-body-group { animation: eat-chew 0.4s ease-in-out infinite; }

    /* Pet Status */
    .pet-status-bar { display: flex; align-items: center; justify-content: center; gap: var(--space-md); margin: var(--space-lg) 0; }
    .pet-status-mood { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: var(--radius-full); background: var(--primary-soft); color: var(--primary-dark); font-size: 13px; font-weight: 600; font-family: var(--font-display); }
    .pet-status-text { font-size: 15px; color: var(--text-secondary); font-weight: 500; }

    /* Interaction Buttons */
    .interaction-buttons { display: flex; gap: var(--space-md); justify-content: center; margin: var(--space-lg) 0; flex-wrap: wrap; }
    .interaction-btn { display: flex; flex-direction: column; align-items: center; gap: var(--space-xs); padding: var(--space-md) var(--space-lg); background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-raised); transition: all var(--transition-base); min-width: 72px; }
    .interaction-btn:hover { transform: translateY(-4px); box-shadow: var(--shadow-floating); }
    .interaction-btn:active { transform: translateY(0) scale(0.95); }
    .interaction-btn svg { width: 28px; height: 28px; stroke: var(--primary); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .interaction-btn span { font-size: 12px; font-weight: 600; color: var(--text-secondary); font-family: var(--font-display); }
    .voice-btn { width: 64px; height: 64px; border-radius: var(--radius-full); background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(232, 104, 104, 0.35); transition: all var(--transition-base); }
    .voice-btn:hover { transform: scale(1.1); }
    .voice-btn svg { width: 28px; height: 28px; fill: currentColor; }

    /* Settings */
    .settings-section { margin-bottom: var(--space-xl); }
    .settings-section-title { font-size: 18px; font-weight: 600; margin-bottom: var(--space-md); }
    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: var(--space-md) 0; border-bottom: 1px solid var(--bg-elevated); }
    .setting-row:last-child { border-bottom: none; }
    .setting-label { font-size: 15px; font-weight: 500; color: var(--text-primary); }
    .setting-desc { font-size: 13px; color: var(--text-muted); }
    .slider { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; background: var(--bg); border-radius: var(--radius-full); outline: none; }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: var(--radius-full); cursor: pointer; }
    .color-picker { display: flex; flex-wrap: wrap; gap: var(--space-sm); }
    .color-option { width: 40px; height: 40px; border-radius: var(--radius-full); cursor: pointer; transition: all var(--transition-base); box-shadow: var(--shadow-raised); border: 3px solid transparent; }
    .color-option:hover { transform: scale(1.1); }
    .color-option.selected { border-color: var(--text-primary); transform: scale(1.15); }
    .option-card { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md); background: var(--bg-card); border-radius: var(--radius-md); box-shadow: var(--shadow-raised); cursor: pointer; transition: all var(--transition-base); border: 2px solid transparent; }
    .option-card:hover { transform: translateY(-2px); }
    .option-card.selected { border-color: var(--primary); background: var(--primary-soft); }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); z-index: 1500; display: flex; align-items: center; justify-content: center; padding: var(--space-md); opacity: 0; visibility: hidden; transition: all var(--transition-base); }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { background: var(--bg-card); border-radius: var(--radius-xl); padding: var(--space-xl); width: 100%; max-width: 480px; box-shadow: var(--shadow-floating); transform: scale(0.9) translateY(20px); transition: transform var(--transition-bounce); }
    .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-lg); }
    .modal-title { font-size: 20px; font-weight: 600; }
    .modal-close { width: 36px; height: 36px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; background: var(--bg); box-shadow: var(--shadow-raised); color: var(--text-secondary); transition: all var(--transition-fast); }
    .modal-close:hover { background: var(--primary-soft); color: var(--primary-dark); transform: rotate(90deg); }

    /* Toast */
    .toast { position: fixed; top: var(--space-lg); left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: var(--space-md) var(--space-xl); box-shadow: var(--glass-shadow); z-index: 2000; opacity: 0; transition: all var(--transition-bounce); }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Speech Bubble */
    .speech-bubble { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); background: var(--bg-card); border-radius: var(--radius-lg); padding: var(--space-md) var(--space-lg); box-shadow: var(--shadow-raised); max-width: 280px; font-size: 14px; z-index: 100; animation: bubble-pop 0.4s var(--transition-bounce); }
    .speech-bubble::after { content: ''; position: absolute; bottom: -8px; left: 24px; width: 16px; height: 16px; background: var(--bg-card); transform: rotate(45deg); }
    @keyframes bubble-pop { 0% { transform: translateX(-50%) scale(0); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }

    /* Input */
    .input { width: 100%; padding: var(--space-md) var(--space-lg); background: var(--bg); border-radius: var(--radius-md); font-size: 15px; color: var(--text-primary); box-shadow: var(--shadow-sunken); border: 2px solid transparent; transition: all var(--transition-base); }
    .input:focus { border-color: var(--primary-light); box-shadow: var(--shadow-raised); }

    /* Responsive */
    @media (min-width: 768px) {
      .app-container { padding: 0 var(--space-xl); }
      .pet-scene { height: 500px; }
      .timer-circle { width: 280px; height: 280px; }
      .timer-time { font-size: 56px; }
    }
    @media (max-width: 767px) {
      .pet-container { transform: scale(0.85); }
      .timer-circle { width: 200px; height: 200px; }
      .timer-time { font-size: 40px; }
      .quick-timers { grid-template-columns: repeat(2, 1fr); }
      .stats-row { grid-template-columns: repeat(3, 1fr); }
      .stat-value { font-size: 24px; }
    }
  </style>
</head>

  <script>
    // ═══════════════════════════════════════════════════════════════════════
    // STATE & CONFIG
    // ═══════════════════════════════════════════════════════════════════════
    let timerState = { running: false, paused: false, mode: 'pomodoro', remaining: 1500, total: 1500, interval: null };
    let petConfig = { colors: { primary: '#FFB6C1', secondary: '#FFF0F5', eye: '#4A4A4A', blush: '#FF69B4' }, voice: { rate: 1, pitch: 1.2, volume: 1 } };
    let reminders = [];
    let currentPage = 'home';
    let petAnimation = 'anim-idle-breathe';

    // ═══════════════════════════════════════════════════════════════════════
    // PAGE NAVIGATION
    // ═══════════════════════════════════════════════════════════════════════
    function switchPage(page) {
      document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      event.currentTarget.classList.add('active');
      currentPage = page;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // TIMER ENGINE
    // ═══════════════════════════════════════════════════════════════════════
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function updateProgress() {
      const circumference = 2 * Math.PI * 110;
      const progress = timerState.total > 0 ? 1 - (timerState.remaining / timerState.total) : 0;
      document.getElementById('progressCircle').style.strokeDashoffset = circumference - (progress * circumference);
    }

    function toggleTimer() {
      if (timerState.running) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (timerState.paused) {
        timerState.paused = false;
        timerState.running = true;
        document.getElementById('playIcon').style.display = 'none';
        document.getElementById('pauseIcon').style.display = 'block';
        document.getElementById('timerLabel').textContent = timerState.mode === 'pomodoro' ? '专注中' : '计时中';
        document.getElementById('timerLabel').className = 'timer-status focus';
        timerState.interval = setInterval(tick, 1000);
        setPetAnimation('anim-focus-calm');
        speak('主人，我们一起专注吧！', 'happy');
      } else {
        timerState.running = true;
        timerState.paused = false;
        document.getElementById('playIcon').style.display = 'none';
        document.getElementById('pauseIcon').style.display = 'block';
        document.getElementById('timerLabel').textContent = timerState.mode === 'pomodoro' ? '专注中' : '计时中';
        document.getElementById('timerLabel').className = 'timer-status focus';
        timerState.interval = setInterval(tick, 1000);
        setPetAnimation('anim-focus-calm');
        speak('主人，我们一起专注吧！', 'happy');
      }
    }

    function pauseTimer() {
      timerState.running = false;
      timerState.paused = true;
      clearInterval(timerState.interval);
      document.getElementById('playIcon').style.display = 'block';
      document.getElementById('pauseIcon').style.display = 'none';
      document.getElementById('timerLabel').textContent = '已暂停';
      document.getElementById('timerLabel').className = 'timer-status idle';
    }

    function resetTimer() {
      timerState.running = false;
      timerState.paused = false;
      clearInterval(timerState.interval);
      timerState.remaining = timerState.total;
      document.getElementById('timerDisplay').textContent = formatTime(timerState.remaining);
      document.getElementById('playIcon').style.display = 'block';
      document.getElementById('pauseIcon').style.display = 'none';
      document.getElementById('timerLabel').textContent = '准备开始';
      document.getElementById('timerLabel').className = 'timer-status idle';
      updateProgress();
      setPetAnimation('anim-idle-breathe');
    }

    function tick() {
      if (timerState.mode === 'stopwatch') {
        timerState.remaining++;
        document.getElementById('timerDisplay').textContent = formatTime(timerState.remaining);
        return;
      }
      
      timerState.remaining--;
      document.getElementById('timerDisplay').textContent = formatTime(timerState.remaining);
      updateProgress();
      
      if (timerState.remaining <= 0) {
        completeTimer();
      }
    }

    function completeTimer() {
      clearInterval(timerState.interval);
      timerState.running = false;
      document.getElementById('playIcon').style.display = 'block';
      document.getElementById('pauseIcon').style.display = 'none';
      
      if (timerState.mode === 'pomodoro') {
        document.getElementById('timerLabel').textContent = '休息中';
        document.getElementById('timerLabel').className = 'timer-status rest';
        showToast('太棒了！休息一下吧~', 'success');
        speak('太棒了！休息一下吧~', 'excited');
        setPetAnimation('anim-eat-chew');
        
        // Auto start rest
        timerState.mode = 'rest';
        timerState.total = 300;
        timerState.remaining = 300;
        document.getElementById('timerDisplay').textContent = '05:00';
        updateProgress();
        
        setTimeout(() => {
          if (!timerState.running) startTimer();
        }, 1500);
      } else {
        document.getElementById('timerLabel').textContent = '完成';
        document.getElementById('timerLabel').className = 'timer-status idle';
        showToast('计时完成！', 'success');
        speak('时间到啦！', 'happy');
        setPetAnimation('anim-happy-jump');
      }
    }

    function startQuickTimer(duration, mode) {
      resetTimer();
      timerState.mode = mode;
      timerState.total = duration;
      timerState.remaining = duration;
      document.getElementById('timerDisplay').textContent = formatTime(duration);
      updateProgress();
      startTimer();
    }

    // ═══════════════════════════════════════════════════════════════════════
    // PET INTERACTION
    // ═══════════════════════════════════════════════════════════════════════
    function setPetAnimation(anim) {
      const container = document.getElementById('petContainer');
      container.className = 'pet-container ' + anim;
      petAnimation = anim;
      
      // Reset after animation
      const durations = { 'anim-happy-jump': 3000, 'anim-excited-spin': 2500, 'anim-remind-wave': 3000, 'anim-eat-chew': 3000 };
      if (durations[anim]) {
        setTimeout(() => {
          if (petAnimation === anim) {
            container.className = 'pet-container anim-idle-breathe';
            petAnimation = 'anim-idle-breathe';
          }
        }, durations[anim]);
      }
    }

    function interactPet(type) {
      const responses = {
        pet: { anim: 'anim-happy-jump', text: '好舒服呀~', mood: '开心' },
        feed: { anim: 'anim-eat-chew', text: '好好吃！谢谢主人！', mood: '满足' },
        play: { anim: 'anim-excited-spin', text: '好开心！再来再来！', mood: '兴奋' }
      };
      
      const response = responses[type];
      setPetAnimation(response.anim);
      showSpeechBubble(response.text);
      document.getElementById('petMood').textContent = response.mood;
      document.getElementById('petStatusText').textContent = response.text;
      speak(response.text, 'happy');
    }

    function speakWithPet() {
      const responses = [
        '我在呢，主人！',
        '有什么我可以帮你的吗？',
        '要设置一个番茄钟吗？',
        '我会一直陪着你的！'
      ];
      const text = responses[Math.floor(Math.random() * responses.length)];
      showSpeechBubble(text);
      document.getElementById('petStatusText').textContent = text;
      speak(text, 'happy');
    }

    function showSpeechBubble(text) {
      const bubble = document.getElementById('speechBubble');
      bubble.textContent = text;
      bubble.style.display = 'block';
      setTimeout(() => { bubble.style.display = 'none'; }, 3000);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // VOICE ENGINE
    // ═══════════════════════════════════════════════════════════════════════
    function speak(text, emotion) {
      if (!('speechSynthesis' in window)) return;
      
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = petConfig.voice.rate;
      utter.pitch = emotion === 'excited' ? petConfig.voice.pitch * 1.3 : petConfig.voice.pitch;
      utter.volume = petConfig.voice.volume;
      utter.lang = 'zh-CN';
      window.speechSynthesis.speak(utter);
    }

    function updateVoiceRate(value) {
      petConfig.voice.rate = parseFloat(value);
      document.getElementById('rateValue').textContent = value + 'x';
    }

    function updateVoicePitch(value) {
      petConfig.voice.pitch = parseFloat(value);
      document.getElementById('pitchValue').textContent = value + 'x';
    }

    function updateVoiceVolume(value) {
      petConfig.voice.volume = parseFloat(value);
      document.getElementById('volumeValue').textContent = Math.round(value * 100) + '%';
    }

    function previewVoice() {
      speak('主人，我是你的宠物小助手！我会一直陪着你的哦~', 'happy');
    }

    // ═══════════════════════════════════════════════════════════════════════
    // PET CUSTOMIZATION
    // ═══════════════════════════════════════════════════════════════════════
    function selectColor(element, type, color) {
      element.parentNode.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
      element.classList.add('selected');
      updatePetColor(type, color);
    }

    function updatePetColor(type, value) {
      petConfig.colors[type] = value;
      document.documentElement.style.setProperty('--pet-' + type, value);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // TIMER SETTINGS
    // ═══════════════════════════════════════════════════════════════════════
    function saveTimerSettings() {
      const focusMin = parseInt(document.getElementById('focusDuration').value) || 25;
      const restMin = parseInt(document.getElementById('restDuration').value) || 5;
      showToast('时间设置已保存', 'success');
    }

    // ═══════════════════════════════════════════════════════════════════════
    // REMINDERS
    // ═══════════════════════════════════════════════════════════════════════
    function openModal() {
      const now = new Date();
      now.setHours(now.getHours() + 1);
      now.setMinutes(0);
      document.getElementById('reminderTime').value = now.toISOString().slice(0, 16);
      document.getElementById('reminderModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('reminderModal').classList.remove('active');
      document.getElementById('reminderTitle').value = '';
    }

    function saveReminder() {
      const title = document.getElementById('reminderTitle').value.trim();
      const time = document.getElementById('reminderTime').value;
      if (!title || !time) { showToast('请填写完整信息', 'error'); return; }
      
      reminders.push({ id: Date.now(), title, time, completed: false });
      closeModal();
      renderReminders();
      showToast('提醒添加成功', 'success');
    }

    function toggleReminder(id) {
      const reminder = reminders.find(r => r.id === id);
      if (reminder) { reminder.completed = !reminder.completed; renderReminders(); }
    }

    function deleteReminder(id) {
      reminders = reminders.filter(r => r.id !== id);
      renderReminders();
      showToast('提醒已删除', 'success');
    }

    function renderReminders() {
      const list = document.getElementById('reminderList');
      const emptyBtn = document.getElementById('emptyAddReminderBtn');
      
      if (reminders.length === 0) {
        list.innerHTML = '';
        emptyBtn.style.display = 'flex';
        return;
      }
      
      emptyBtn.style.display = 'none';
      list.innerHTML = reminders.map(r => `
        <div class="reminder-item ${r.completed ? 'completed' : ''}">
          <div class="reminder-checkbox ${r.completed ? 'checked' : ''}" onclick="toggleReminder(${r.id})">
            ${r.completed ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
          </div>
          <div class="reminder-content">
            <div class="reminder-title">${escapeHtml(r.title)}</div>
            <div class="reminder-time">${formatReminderTime(r.time)}</div>
          </div>
          <div class="reminder-actions">
            <button class="reminder-action-btn" onclick="deleteReminder(${r.id})">
              <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    function formatReminderTime(isoString) {
      return new Date(isoString).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(text) {
      const div = document.createElement('div'); div.textContent = text; return div.innerHTML;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // UTILITIES
    // ═══════════════════════════════════════════════════════════════════════
    function showToast(message, type) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show';
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function updateDate() {
      const now = new Date();
      document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    }

    // ═══════════════════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════════════════
    updateDate();
    renderReminders();
    updateProgress();
  </script>
</body>
</html>
