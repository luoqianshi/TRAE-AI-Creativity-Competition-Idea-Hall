<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星途 STAR PATH — 太空开发模拟游戏 Demo</title>
<style>
  :root {
    --bg-deep: #05080f;
    --panel-bg: rgba(10, 16, 36, 0.92);
    --border: rgba(80, 140, 220, 0.25);
    --accent: #3a8fd4;
    --accent-glow: rgba(58, 143, 212, 0.5);
    --gold: #e8b44b;
    --gold-glow: rgba(232, 180, 75, 0.4);
    --metal: #9bb5ce;
    --rare: #c47dff;
    --rare-glow: rgba(196, 125, 255, 0.4);
    --text: #d4dce8;
    --text-dim: #7a8ba0;
    --danger: #e05555;
    --success: #5cc97a;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
  }

  canvas#solar {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  /* ===== 顶栏 ===== */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px;
    background: linear-gradient(180deg, rgba(5,8,15,0.95) 0%, rgba(5,8,15,0) 100%);
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }
  #logo {
    font-size: 22px; font-weight: 700; letter-spacing: 4px;
    background: linear-gradient(135deg, #6db3f2, #c47dff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  #month-display {
    font-size: 15px; color: var(--text-dim);
    background: var(--panel-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 16px;
  }
  #month-display span { color: var(--gold); font-weight: 700; font-size: 18px; margin: 0 4px; }

  /* ===== 资源面板 (右侧) ===== */
  #res-panel {
    position: fixed; right: 20px; top: 50%; transform: translateY(-50%); z-index: 10;
    background: var(--panel-bg); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 18px; min-width: 200px;
    backdrop-filter: blur(12px);
    display: flex; flex-direction: column; gap: 14px;
  }
  .res-item { display: flex; flex-direction: column; gap: 3px; }
  .res-label { font-size: 12px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
  .res-value { font-size: 28px; font-weight: 700; display: flex; align-items: baseline; gap: 6px; }
  .res-value .unit { font-size: 13px; font-weight: 400; color: var(--text-dim); }
  .res-rate { font-size: 11px; color: var(--success); }
  .res-elec .res-value { color: #6db3f2; }
  .res-metal .res-value { color: var(--metal); }
  .res-rare  .res-value { color: var(--rare); }

  /* ===== 戴森球进度 ===== */
  #dyson-bar {
    position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 20px; display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(12px);
  }
  #dyson-bar .icon { font-size: 24px; }
  #dyson-bar .label { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  #dyson-bar .track {
    width: 180px; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden;
  }
  #dyson-bar .fill {
    height: 100%; background: linear-gradient(90deg, #e8b44b, #ff8c3a); border-radius: 4px;
    transition: width 0.6s ease; width: 0%;
  }
  #dyson-bar .pct { font-size: 14px; font-weight: 700; color: var(--gold); min-width: 40px; text-align: right; }

  /* ===== 操作栏 (底部) ===== */
  #actions {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 16px;
  }
  .btn {
    padding: 12px 28px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel-bg); color: var(--text); font-size: 15px;
    cursor: pointer; backdrop-filter: blur(12px); transition: all 0.25s;
    font-family: inherit; letter-spacing: 1px; position: relative; overflow: hidden;
  }
  .btn:hover { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); transform: translateY(-1px); }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(135deg, rgba(58,143,212,0.3), rgba(58,143,212,0.1)); border-color: var(--accent); }
  .btn-gold { background: linear-gradient(135deg, rgba(232,180,75,0.3), rgba(232,180,75,0.1)); border-color: var(--gold); color: var(--gold); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
  .btn .cost { display: block; font-size: 10px; color: var(--text-dim); margin-top: 2px; }

  /* ===== 行星详情弹窗 ===== */
  #planet-modal {
    position: fixed; inset: 0; z-index: 100;
    display: none; align-items: center; justify-content: center;
    background: rgba(5,8,15,0.7); backdrop-filter: blur(4px);
  }
  #planet-modal.show { display: flex; }
  #planet-modal .card {
    background: var(--panel-bg); border: 1px solid var(--border); border-radius: 20px;
    padding: 28px 32px; min-width: 320px; max-width: 420px;
    backdrop-filter: blur(20px); position: relative;
  }
  #planet-modal .close {
    position: absolute; top: 12px; right: 16px;
    background: none; border: none; color: var(--text-dim); font-size: 22px;
    cursor: pointer; transition: color 0.2s;
  }
  #planet-modal .close:hover { color: var(--text); }
  #planet-modal .pname { font-size: 24px; font-weight: 700; margin-bottom: 16px; }
  #planet-modal .pstatus { font-size: 14px; margin-bottom: 8px; padding: 6px 12px; border-radius: 6px; display: inline-block; }
  .status-hidden { background: rgba(120,130,150,0.15); color: var(--text-dim); }
  .status-probed { background: rgba(58,143,212,0.15); color: var(--accent); }
  .status-mining { background: rgba(92,201,122,0.15); color: var(--success); }
  #planet-modal .pres-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  #planet-modal .pres-row .pr { color: var(--text-dim); }
  #planet-modal .modal-actions { margin-top: 18px; display: flex; gap: 10px; }
  #planet-modal .modal-actions .btn { flex: 1; text-align: center; padding: 10px 16px; font-size: 13px; }

  /* ===== 提示消息 ===== */
  #toast {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 200;
    padding: 10px 24px; border-radius: 8px; font-size: 14px;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  .toast-info { background: rgba(58,143,212,0.25); border: 1px solid rgba(58,143,212,0.4); color: #8cc8ff; }
  .toast-warn { background: rgba(232,180,75,0.25); border: 1px solid rgba(232,180,75,0.4); color: #f0c860; }
  .toast-success { background: rgba(92,201,122,0.25); border: 1px solid rgba(92,201,122,0.4); color: #7ee89a; }

  /* ===== 图例提示 ===== */
  #legend {
    position: fixed; left: 20px; bottom: 160px; z-index: 10;
    display: flex; flex-direction: column; gap: 6px;
    font-size: 11px; color: var(--text-dim);
  }
  #legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot-green { background: var(--success); }
  .dot-blue { background: var(--accent); }
  .dot-gray { background: var(--text-dim); }

  /* ===== 响应式 ===== */
  @media (max-width: 768px) {
    #res-panel { right: 4px; padding: 12px 10px; min-width: 140px; gap: 8px; }
    .res-value { font-size: 20px; }
    #actions { gap: 8px; }
    .btn { padding: 10px 16px; font-size: 13px; }
    #dyson-bar { bottom: 120px; padding: 8px 14px; }
    #dyson-bar .track { width: 100px; }
  }
</style>
</head>
<body>

<canvas id="solar"></canvas>

<!-- 顶栏 -->
<div id="topbar">
  <div id="logo">星 途</div>
  <div id="month-display">第 <span id="month-num">1</span> 月</div>
</div>

<!-- 资源面板 -->
<div id="res-panel">
  <div class="res-item res-elec">
    <div class="res-label">电力</div>
    <div class="res-value"><span id="res-elec">1</span><span class="unit">MW</span></div>
    <div class="res-rate">+<span id="rate-elec">1</span>/月</div>
  </div>
  <div class="res-item res-metal">
    <div class="res-label">金属</div>
    <div class="res-value"><span id="res-metal">1</span><span class="unit">t</span></div>
    <div class="res-rate">+<span id="rate-metal">1</span>/月</div>
  </div>
  <div class="res-item res-rare">
    <div class="res-label">稀有资源</div>
    <div class="res-value"><span id="res-rare">1</span><span class="unit">kg</span></div>
    <div class="res-rate">+<span id="rate-rare">1</span>/月</div>
  </div>
</div>

<!-- 图例 -->
<div id="legend">
  <div><span class="dot dot-gray"></span> 未勘测</div>
  <div><span class="dot dot-blue"></span> 已勘测</div>
  <div><span class="dot dot-green"></span> 开采中</div>
</div>

<!-- 戴森球进度 -->
<div id="dyson-bar">
  <div class="icon">☀</div>
  <div class="label">戴森球进度</div>
  <div class="track"><div class="fill" id="dyson-fill"></div></div>
  <div class="pct" id="dyson-pct">0%</div>
</div>

<!-- 操作栏 -->
<div id="actions">
  <button class="btn btn-primary" id="btn-speed" onclick="toggleSpeed()">⏩ 2x 加速</button>
  <button class="btn btn-primary" id="btn-probe" onclick="launchProbe()">
    发射探测器
    <span class="cost">消耗: 3电 2金属</span>
  </button>
  <button class="btn btn-gold" id="btn-dyson" onclick="buildDyson()" disabled>
    建造戴森球
    <span class="cost">需要: 100电 80金属 50稀有</span>
  </button>
</div>

<!-- 行星详情弹窗 -->
<div id="planet-modal">
  <div class="card">
    <button class="close" onclick="closeModal()">✕</button>
    <div class="pname" id="modal-name"></div>
    <div class="pstatus" id="modal-status"></div>
    <div id="modal-resources"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="modal-btn-probe" onclick="modalProbe()">发射探测器</button>
      <button class="btn" id="modal-btn-miner" onclick="modalMiner()" disabled>部署开采器</button>
    </div>
  </div>
</div>

<!-- 提示 -->
<div id="toast"></div>

<script>
// ==================== 游戏数据 ====================
const state = {
  month: 1,
  speed: 1,          // 1x / 2x
  resources: { elec: 1, metal: 1, rare: 1 },
  production: { elec: 1, metal: 1, rare: 1 },
  dysonProgress: 0,
  dysonCost: { elec: 100, metal: 80, rare: 50 },
  probeCost: { elec: 3, metal: 2 },
  minerCost: { elec: 5, metal: 5, rare: 2 },
  activeProbes: [],  // 飞行中的探测器 {planetIdx, x, y, startX, startY, progress}
  selectedPlanet: null,
  tickAccum: 0,
  monthInterval: 4000, // ms per month at 1x
  hoveringPlanet: null,
};

// 行星定义
const planetDefs = [
  { name:'水星', nameCN:'Mercury',   orbit: 60,  size:4,  color:'#b0a090', speed:0.60, res:{elec:0,metal:3,rare:1}, distText:'0.39 AU' },
  { name:'金星', nameCN:'Venus',     orbit: 95,  size:7,  color:'#e8cda0', speed:0.45, res:{elec:2,metal:2,rare:2}, distText:'0.72 AU' },
  { name:'地球', nameCN:'Earth',     orbit:135,  size:8,  color:'#4da6e8', speed:0.36, res:{elec:1,metal:1,rare:1}, distText:'1.00 AU', isHome:true },
  { name:'火星', nameCN:'Mars',      orbit:180,  size:5,  color:'#d45a3a', speed:0.28, res:{elec:0,metal:5,rare:2}, distText:'1.52 AU' },
  { name:'木星', nameCN:'Jupiter',   orbit:250,  size:18, color:'#d4b896', speed:0.18, res:{elec:5,metal:8,rare:5}, distText:'5.20 AU' },
  { name:'土星', nameCN:'Saturn',    orbit:320,  size:15, color:'#e8d5a3', speed:0.13, res:{elec:4,metal:6,rare:6}, distText:'9.54 AU', hasRing:true },
  { name:'天王星', nameCN:'Uranus',  orbit:390,  size:11, color:'#8cc8d8', speed:0.09, res:{elec:6,metal:4,rare:8}, distText:'19.2 AU' },
  { name:'海王星', nameCN:'Neptune', orbit:445,  size:10, color:'#5070d8', speed:0.07, res:{elec:3,metal:3,rare:10},distText:'30.0 AU' },
];

// 每颗行星的游戏状态
const planets = planetDefs.map((def, i) => ({
  ...def,
  idx: i,
  angle: Math.random() * Math.PI * 2,
  probed: def.isHome || false,
  minerDeployed: false,
  miningBonus: 0,   // 开采器带来的额外月产
}));

// ==================== Canvas 渲染 ====================
const canvas = document.getElementById('solar');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  // 太阳系中心偏左一点，给右侧资源面板留空间
  cx = W * 0.42;
  cy = H * 0.48;
}
window.addEventListener('resize', resize);
resize();

// 星空背景
const stars = [];
for (let i=0;i<350;i++) {
  stars.push({
    x: Math.random() * 2000,
    y: Math.random() * 2000,
    r: Math.random() * 1.6 + 0.3,
    a: Math.random() * 0.5 + 0.3,
    twinkle: Math.random() * Math.PI * 2,
    twinkleSpeed: Math.random() * 0.02 + 0.005,
  });
}

// 粒子效果
const particles = [];
function spawnParticles(x, y, count, color) {
  for (let i=0;i<count;i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 3 + 1;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: 1,
      decay: Math.random() * 0.03 + 0.015,
      color,
    });
  }
}

// ==================== 绘制函数 ====================
function drawStars() {
  for (const s of stars) {
    s.twinkle += s.twinkleSpeed;
    const alpha = s.a + Math.sin(s.twinkle) * 0.2;
    ctx.beginPath();
    ctx.arc(s.x % W, s.y % H, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(200,220,255,${alpha})`;
    ctx.fill();
  }
}

function drawSun() {
  // 外层光晕
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 50);
  grad.addColorStop(0, 'rgba(255,240,200,0.9)');
  grad.addColorStop(0.15, 'rgba(255,200,80,0.7)');
  grad.addColorStop(0.35, 'rgba(255,140,30,0.25)');
  grad.addColorStop(0.6, 'rgba(255,80,10,0.06)');
  grad.addColorStop(1, 'rgba(255,40,5,0)');
  ctx.beginPath(); ctx.arc(cx, cy, 50, 0, Math.PI*2);
  ctx.fillStyle = grad; ctx.fill();

  // 内核
  const inner = ctx.createRadialGradient(cx, cy, 0, cx, cy, 18);
  inner.addColorStop(0, '#fffef0');
  inner.addColorStop(0.4, '#ffe8a0');
  inner.addColorStop(1, '#ffa030');
  ctx.beginPath(); ctx.arc(cx, cy, 18, 0, Math.PI*2);
  ctx.fillStyle = inner; ctx.fill();

  // 太阳标记
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '11px "Microsoft YaHei","PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('太阳', cx, cy - 26);
}

function drawOrbits() {
  for (const p of planets) {
    ctx.beginPath();
    ctx.arc(cx, cy, p.orbit, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
}

function drawPlanet(p) {
  const px = cx + Math.cos(p.angle) * p.orbit;
  const py = cy + Math.sin(p.angle) * p.orbit;
  const isHover = state.hoveringPlanet === p.idx;
  const isSelected = state.selectedPlanet === p.idx;

  // 光环 (土星)
  if (p.hasRing) {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(px, py, p.size*1.7, p.size*0.45, -0.3, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(220,200,150,0.45)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(220,200,150,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  // 选中的外发光
  if (isSelected) {
    ctx.beginPath(); ctx.arc(px, py, p.size+8, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
    ctx.stroke();
  }
  if (isHover && !isSelected) {
    ctx.beginPath(); ctx.arc(px, py, p.size+5, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // 行星主体
  const grad = ctx.createRadialGradient(px-p.size*0.3, py-p.size*0.3, 0, px, py, p.size);
  grad.addColorStop(0, lightenColor(p.color, 0.5));
  grad.addColorStop(0.7, p.color);
  grad.addColorStop(1, darkenColor(p.color, 0.6));
  ctx.beginPath(); ctx.arc(px, py, p.size, 0, Math.PI*2);
  ctx.fillStyle = grad; ctx.fill();

  // 状态指示小圆点
  let indicatorColor = 'rgba(120,130,150,0.6)';
  if (p.minerDeployed) indicatorColor = '#5cc97a';
  else if (p.probed) indicatorColor = '#3a8fd4';
  ctx.beginPath(); ctx.arc(px, py - p.size - 7, 3, 0, Math.PI*2);
  ctx.fillStyle = indicatorColor; ctx.fill();

  // 名称
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.font = `${Math.max(10, p.size*0.8)}px "Microsoft YaHei","PingFang SC",sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(p.name, px, py + p.size + 14);

  // 存屏幕坐标
  p._sx = px; p._sy = py;
}

function drawProbes() {
  for (const probe of state.activeProbes) {
    probe.progress += 0.006 * state.speed;
    const t = easeInOutCubic(probe.progress);
    const px = probe.startX + (probe.endX - probe.startX) * t;
    const py = probe.startY + (probe.endY - probe.startY) * t;

    // 尾迹
    ctx.beginPath();
    ctx.arc(px, py, 3, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,200,100,0.9)';
    ctx.fill();
    // 小光晕
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,180,60,0.3)';
    ctx.fill();

    if (probe.progress >= 1) {
      // 到达目标
      const planet = planets[probe.planetIdx];
      if (!planet.probed) {
        planet.probed = true;
        toast(`探测器抵达 ${planet.name}！资源数据已返回。`, 'success');
        spawnParticles(planet._sx, planet._sy, 25, '#ffcc60');
      }
      probe.done = true;
    }
  }
  state.activeProbes = state.activeProbes.filter(p => !p.done);
}

function drawParticles() {
  for (const p of particles) {
    p.x += p.vx * 0.6; p.y += p.vy * 0.6;
    p.life -= p.decay;
    if (p.life <= 0) continue;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${p.color},${p.life})`;
    ctx.fill();
  }
  // 清理
  for (let i=particles.length-1;i>=0;i--) {
    if (particles[i].life <= 0) particles.splice(i,1);
  }
}

function drawDysonIndicator() {
  if (state.dysonProgress <= 0) return;
  // 在太阳周围显示部分戴森球环
  const segments = Math.floor(state.dysonProgress / 10);
  for (let i=0;i<segments;i++) {
    const a = (i / segments) * Math.PI * 2 + Date.now()*0.0003;
    ctx.beginPath();
    ctx.arc(cx, cy, 30, a, a + 0.3);
    ctx.strokeStyle = `rgba(255,180,50,${0.3 + state.dysonProgress/300})`;
    ctx.lineWidth = 3;
    ctx.stroke();
  }
}

// ==================== 主渲染循环 ====================
function render() {
  ctx.clearRect(0, 0, W, H);
  drawStars();
  drawOrbits();
  drawSun();
  drawDysonIndicator();
  for (const p of planets) drawPlanet(p);
  drawProbes();
  drawParticles();
}

// ==================== 游戏逻辑 ====================
function gameTick(dt) {
  state.tickAccum += dt * state.speed;
  const interval = state.monthInterval;

  while (state.tickAccum >= interval) {
    state.tickAccum -= interval;
    // 月度生产
    state.resources.elec += state.production.elec;
    state.resources.metal += state.production.metal;
    state.resources.rare += state.production.rare;
    // 开采器产出
    for (const p of planets) {
      if (p.minerDeployed) {
        state.resources.elec += p.res.elec;
        state.resources.metal += p.res.metal;
        state.resources.rare += p.res.rare;
      }
    }
    state.month++;
    updateUI();
  }

  // 行星公转
  const angleDt = (dt / 1000) * state.speed * 0.5;
  for (const p of planets) {
    p.angle += p.speed * angleDt;
  }

  render();
}

function updateUI() {
  document.getElementById('month-num').textContent = state.month;
  document.getElementById('res-elec').textContent = state.resources.elec;
  document.getElementById('res-metal').textContent = state.resources.metal;
  document.getElementById('res-rare').textContent = state.resources.rare;
  document.getElementById('rate-elec').textContent = state.production.elec;
  document.getElementById('rate-metal').textContent = state.production.metal;
  document.getElementById('rate-rare').textContent = state.production.rare;

  // 戴森球进度
  const dp = Math.min(100, state.dysonProgress);
  document.getElementById('dyson-fill').style.width = dp + '%';
  document.getElementById('dyson-pct').textContent = Math.floor(dp) + '%';

  // 探测器按钮
  const canProbe = state.resources.elec >= state.probeCost.elec &&
                   state.resources.metal >= state.probeCost.metal;
  document.getElementById('btn-probe').disabled = !canProbe;

  // 戴森球按钮
  const canDyson = state.resources.elec >= state.dysonCost.elec &&
                   state.resources.metal >= state.dysonCost.metal &&
                   state.resources.rare >= state.dysonCost.rare &&
                   state.dysonProgress < 100;
  document.getElementById('btn-dyson').disabled = !canDyson;

  // 弹窗按钮
  if (state.selectedPlanet !== null) updateModalButtons();
}

function updateModalButtons() {
  const p = planets[state.selectedPlanet];
  const btnProbe = document.getElementById('modal-btn-probe');
  const btnMiner = document.getElementById('modal-btn-miner');

  if (p.probed) {
    btnProbe.textContent = '已勘测';
    btnProbe.disabled = true;
  } else {
    btnProbe.textContent = '发射探测器 (3电 2金属)';
    btnProbe.disabled = state.resources.elec < state.probeCost.elec || state.resources.metal < state.probeCost.metal;
  }

  if (p.minerDeployed) {
    btnMiner.textContent = '开采中';
    btnMiner.disabled = true;
  } else if (p.probed) {
    btnMiner.textContent = '部署开采器 (5电 5金属 2稀有)';
    const canMine = state.resources.elec >= state.minerCost.elec &&
                    state.resources.metal >= state.minerCost.metal &&
                    state.resources.rare >= state.minerCost.rare;
    btnMiner.disabled = !canMine;
  } else {
    btnMiner.textContent = '需先勘测';
    btnMiner.disabled = true;
  }
}

// ==================== 交互 ====================
canvas.addEventListener('click', (e) => {
  const mx = e.clientX, my = e.clientY;

  // 点击太阳 → 戴森球
  const ds = Math.sqrt((mx-cx)**2 + (my-cy)**2);
  if (ds < 30) {
    showPlanetModal(-1);
    return;
  }

  // 点击行星
  for (const p of planets) {
    const d = Math.sqrt((mx-p._sx)**2 + (my-p._sy)**2);
    if (d < p.size + 8) {
      state.selectedPlanet = p.idx;
      showPlanetModal(p.idx);
      return;
    }
  }
  // 点空白取消
  state.selectedPlanet = null;
  closeModal();
});

canvas.addEventListener('mousemove', (e) => {
  const mx = e.clientX, my = e.clientY;
  let found = null;
  for (const p of planets) {
    const d = Math.sqrt((mx-p._sx)**2 + (my-p._sy)**2);
    if (d < p.size + 10) { found = p.idx; break; }
  }
  if (found !== state.hoveringPlanet) {
    state.hoveringPlanet = found;
    canvas.style.cursor = found !== null ? 'pointer' : 'default';
  }
});

function showPlanetModal(idx) {
  const modal = document.getElementById('planet-modal');
  const mName = document.getElementById('modal-name');
  const mStatus = document.getElementById('modal-status');
  const mRes = document.getElementById('modal-resources');

  if (idx === -1) {
    // 太阳
    mName.textContent = '太阳 — 戴森球目标';
    mStatus.className = 'pstatus status-mining';
    mStatus.textContent = '恒星级能源';
    mRes.innerHTML = `<div class="pres-row"><span class="pr">戴森球进度</span><span>${Math.floor(state.dysonProgress)}%</span></div>`;
    document.getElementById('modal-btn-probe').style.display = 'none';
    document.getElementById('modal-btn-miner').style.display = 'none';
  } else {
    const p = planets[idx];
    mName.textContent = p.name + '  ' + p.distText;
    document.getElementById('modal-btn-probe').style.display = '';
    document.getElementById('modal-btn-miner').style.display = '';

    if (p.minerDeployed) {
      mStatus.className = 'pstatus status-mining';
      mStatus.textContent = '开采中';
    } else if (p.probed) {
      mStatus.className = 'pstatus status-probed';
      mStatus.textContent = '已勘测';
    } else {
      mStatus.className = 'pstatus status-hidden';
      mStatus.textContent = '未勘测';
    }

    if (p.probed) {
      mRes.innerHTML = `
        <div class="pres-row"><span class="pr">电力储量</span><span>${p.res.elec} MW/月</span></div>
        <div class="pres-row"><span class="pr">金属储量</span><span>${p.res.metal} t/月</span></div>
        <div class="pres-row"><span class="pr">稀有资源</span><span>${p.res.rare} kg/月</span></div>
        <div class="pres-row"><span class="pr">开采器</span><span>${p.minerDeployed ? '已部署' : '未部署'}</span></div>
      `;
    } else {
      mRes.innerHTML = `<div class="pres-row"><span class="pr" style="color:var(--text-dim)">资源数据未知 —— 需要探测器勘测</span></div>`;
    }
    updateModalButtons();
  }

  modal.classList.add('show');
}

function closeModal() {
  document.getElementById('planet-modal').classList.remove('show');
  state.selectedPlanet = null;
}

function modalProbe() {
  if (state.selectedPlanet === null) return;
  launchProbeTo(state.selectedPlanet);
  updateModalButtons();
}

function modalMiner() {
  if (state.selectedPlanet === null) return;
  deployMiner(state.selectedPlanet);
  updateModalButtons();
  showPlanetModal(state.selectedPlanet); // 刷新
}

function launchProbe() {
  // 找最近的未勘测行星
  let target = null;
  for (const p of planets) {
    if (!p.probed) { target = p; break; }
  }
  if (!target) {
    toast('所有行星均已勘测完毕！', 'info');
    return;
  }
  launchProbeTo(target.idx);
}

function launchProbeTo(planetIdx) {
  const p = planets[planetIdx];
  if (p.probed) { toast(`${p.name} 已经勘测过了`, 'info'); return; }
  if (state.resources.elec < state.probeCost.elec || state.resources.metal < state.probeCost.metal) {
    toast('资源不足，无法发射探测器', 'warn'); return;
  }

  state.resources.elec -= state.probeCost.elec;
  state.resources.metal -= state.probeCost.metal;

  // 从地球位置发射
  const earth = planets[2];
  state.activeProbes.push({
    planetIdx: p.idx,
    startX: earth._sx, startY: earth._sy,
    endX: p._sx, endY: p._sy,
    progress: 0, done: false,
  });
  spawnParticles(earth._sx, earth._sy, 12, '255,200,100');
  toast(`探测器已发射，目标：${p.name}`, 'info');
  updateUI();
}

function deployMiner(planetIdx) {
  const p = planets[planetIdx];
  if (!p.probed) { toast(`请先勘测 ${p.name}`, 'warn'); return; }
  if (p.minerDeployed) { toast(`${p.name} 已有开采器`, 'info'); return; }
  if (state.resources.elec < state.minerCost.elec ||
      state.resources.metal < state.minerCost.metal ||
      state.resources.rare < state.minerCost.rare) {
    toast('资源不足，无法部署开采器', 'warn'); return;
  }

  state.resources.elec -= state.minerCost.elec;
  state.resources.metal -= state.minerCost.metal;
  state.resources.rare -= state.minerCost.rare;
  p.minerDeployed = true;
  spawnParticles(p._sx, p._sy, 20, '100,220,140');
  toast(`${p.name} 开采器已部署！每月产出 +${p.res.elec}电 +${p.res.metal}金属 +${p.res.rare}稀有`, 'success');
  updateUI();
}

function buildDyson() {
  if (state.resources.elec < state.dysonCost.elec ||
      state.resources.metal < state.dysonCost.metal ||
      state.resources.rare < state.dysonCost.rare) {
    toast('资源不足，无法建造戴森球组件', 'warn'); return;
  }
  state.resources.elec -= state.dysonCost.elec;
  state.resources.metal -= state.dysonCost.metal;
  state.resources.rare -= state.dysonCost.rare;
  state.dysonProgress += 20;
  spawnParticles(cx, cy, 40, '255,200,60');

  if (state.dysonProgress >= 100) {
    state.dysonProgress = 100;
    toast('戴森球建造完成！文明进入了恒星级能源时代！', 'success');
    document.getElementById('btn-dyson').disabled = true;
  } else {
    toast(`戴森球进度 +20% (当前 ${Math.floor(state.dysonProgress)}%)`, 'success');
  }
  updateUI();
}

function toggleSpeed() {
  state.speed = state.speed === 1 ? 2 : 1;
  const btn = document.getElementById('btn-speed');
  btn.textContent = state.speed === 2 ? '⏩ 2x 加速中' : '⏩ 2x 加速';
  if (state.speed === 2) btn.classList.add('btn-gold');
  else btn.classList.remove('btn-gold');
}

// ==================== 辅助 ====================
function easeInOutCubic(t) { return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

function lightenColor(hex, amt) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.min(255, (num >> 16) + 100);
  const g = Math.min(255, ((num >> 8) & 0xFF) + 100);
  const b = Math.min(255, (num & 0xFF) + 100);
  return `rgb(${r},${g},${b})`;
}
function darkenColor(hex, amt) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.floor((num >> 16) * amt);
  const g = Math.floor(((num >> 8) & 0xFF) * amt);
  const b = Math.floor((num & 0xFF) * amt);
  return `rgb(${r},${g},${b})`;
}

let toastTimer;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast-' + type + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); }, 2800);
}

updateUI();

// ==================== 游戏循环 ====================
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(200, now - lastTime); // cap at 200ms to avoid spiral
  lastTime = now;
  gameTick(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ==================== 键盘快捷操作 ====================
document.addEventListener('keydown', (e) => {
  switch(e.key.toLowerCase()) {
    case 'p': launchProbe(); break;
    case 'd': buildDyson(); break;
    case 's': toggleSpeed(); break;
    case 'escape': closeModal(); break;
    case '1': showPlanetModal(0); state.selectedPlanet=0; break;
    case '2': showPlanetModal(1); state.selectedPlanet=1; break;
    case '3': showPlanetModal(2); state.selectedPlanet=2; break;
    case '4': showPlanetModal(3); state.selectedPlanet=3; break;
    case '5': showPlanetModal(4); state.selectedPlanet=4; break;
    case '6': showPlanetModal(5); state.selectedPlanet=5; break;
    case '7': showPlanetModal(6); state.selectedPlanet=6; break;
    case '8': showPlanetModal(7); state.selectedPlanet=7; break;
  }
});
</script>
