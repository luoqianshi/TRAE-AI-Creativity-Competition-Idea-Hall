<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体面请假生成器 — 让请假变得得体又轻松</title>
<meta name="description" content="输入请假类型与风格，AI 帮你生成得体、体面的请假话术。苹果毛玻璃质感。">
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #1d1d1f;
  --muted: #6e6e73;
  --line: #1d1d1f15;
  --glass: #ffffffd0;
  --glass-soft: #ffffffa0;
  --accent: #4f46e5;
  --accent-2: #6366f1;
  --accent-3: #0ea5e9;
  --amber: #f59e0b;
  --green: #16a34a;
  --red: #df4a3a;
  --radius-md: 18px;
  --radius-lg: 24px;
  --radius-xl: 30px;
  --shadow-sm: 0 2px 12px #00000008;
  --shadow-md: 0 8px 30px #0000000d;
  --shadow-lg: 0 20px 60px #1a1a2e14;
}

html { scroll-behavior: smooth; }

body {
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  background: #f5f5f7;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

::selection { background: #4f46e530; color: var(--ink); }

/* ===== Header ===== */
.site-header {
  position: sticky; top: 0; z-index: 100;
  height: 56px;
  background: #f5f5f7b8;
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  border-bottom: 1px solid #0000000c;
}
.header-inner {
  display: flex; align-items: center; justify-content: space-between;
  width: min(1140px, 100% - 44px); height: 100%; margin: 0 auto;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  color: var(--ink); font-size: 17px; font-weight: 680; letter-spacing: -.03em; text-decoration: none;
}
.brand-gem {
  width: 20px; height: 20px;
  background: linear-gradient(135deg, #4f46e5, #6366f1 45%, #0ea5e9);
  border-radius: 6px; transform: rotate(45deg);
  box-shadow: inset -3px -3px 8px #312e8180, 0 0 12px #4f46e533;
}
.main-nav { display: flex; align-items: center; gap: 6px; }
.main-nav a {
  color: #56565b; font-size: 13px; text-decoration: none;
  padding: 7px 12px; border-radius: 18px; transition: all .18s;
}
.main-nav a:hover { color: var(--ink); background: #00000008; }

/* ===== Hero ===== */
.hero {
  position: relative; text-align: center;
  width: min(820px, 100% - 44px); margin: 0 auto;
  padding: 78px 0 44px; overflow: hidden;
}
.ambient {
  position: absolute; pointer-events: none; border-radius: 50%;
  filter: blur(90px); opacity: .5; z-index: 0;
}
.ambient-a {
  width: 420px; height: 320px;
  background: radial-gradient(circle, #6366f155, #6366f100 70%);
  top: -40px; left: -140px; animation: driftA 11s ease-in-out infinite;
}
.ambient-b {
  width: 380px; height: 300px;
  background: radial-gradient(circle, #0ea5e94d, #0ea5e900 70%);
  top: 40px; right: -150px; animation: driftB 13s ease-in-out infinite;
}
@keyframes driftA { 50% { transform: translateY(28px) translateX(14px) scale(1.06); } }
@keyframes driftB { 50% { transform: translateY(-22px) translateX(-12px) scale(1.05); } }

.eyebrow {
  position: relative; z-index: 2;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 13px; font-size: 12px; font-weight: 560; color: #5d5d64;
  background: #ffffffb8; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid #00000010; border-radius: 100px; box-shadow: var(--shadow-sm);
}
.eyebrow .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #4f46e5; box-shadow: 0 0 0 4px #4f46e525; animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot { 50% { box-shadow: 0 0 0 8px #4f46e510; } }

.hero h1 {
  position: relative; z-index: 2;
  font-size: clamp(40px, 6vw, 64px); font-weight: 680; letter-spacing: -.055em; line-height: 1.02;
  margin: 24px 0 16px;
}
.hero h1 .grad {
  background: linear-gradient(95deg, #4f46e5, #6366f1 45%, #0ea5e9);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.hero-copy {
  position: relative; z-index: 2;
  color: #66666c; font-size: clamp(15px, 1.8vw, 18px); line-height: 1.65;
  max-width: 560px; margin: 0 auto;
}

/* ===== Workshop (two-column) ===== */
.workshop {
  width: min(1140px, 100% - 44px); margin: 0 auto;
  display: grid; grid-template-columns: 0.92fr 1.08fr; gap: 22px;
  padding-bottom: 80px;
}

/* Control panel */
.control-panel {
  background: var(--glass);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid #00000015; border-radius: var(--radius-lg);
  padding: 26px 24px; box-shadow: var(--shadow-lg);
  align-self: start; position: sticky; top: 76px;
}
.panel-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 640; letter-spacing: -.02em; margin-bottom: 4px;
}
.panel-title .ico {
  width: 22px; height: 22px; border-radius: 7px;
  background: linear-gradient(135deg, #4f46e5, #6366f1);
  display: grid; place-items: center; color: #fff;
}
.panel-sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }

.field { margin-bottom: 18px; }
.field-label {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; font-weight: 580; color: #56565b; margin-bottom: 9px; letter-spacing: -.01em;
}
.field-label .hint-mini { color: #a0a0a5; font-weight: 450; font-size: 11px; }

.opt-group { display: flex; flex-wrap: wrap; gap: 7px; }
.opt {
  padding: 7px 13px; font-size: 12.5px; cursor: pointer;
  background: #ffffff70; border: 1px solid #00000012; border-radius: 13px;
  color: #56565b; transition: all .16s; user-select: none;
}
.opt:hover { background: #fff; border-color: #00000022; }
.opt.active {
  background: linear-gradient(135deg, #4f46e5, #6366f1);
  color: #fff; border-color: transparent;
  box-shadow: 0 4px 12px #4f46e533;
}

.input-row { display: flex; gap: 7px; align-items: center; }
.text-input, .date-input {
  flex: 1; height: 38px; padding: 0 13px;
  background: #ffffff90; border: 1px solid #00000014; border-radius: 12px;
  font-size: 13px; color: var(--ink); outline: 0; transition: all .16s;
  font-family: inherit;
}
.text-input:focus, .date-input:focus { border-color: #4f46e54d; background: #fff; box-shadow: 0 0 0 4px #4f46e50d; }
.quick-btn {
  padding: 0 11px; height: 38px; font-size: 11.5px; cursor: pointer;
  background: #f2f2f5; border: 1px solid #00000012; border-radius: 12px;
  color: #6e6e73; transition: all .15s; white-space: nowrap;
}
.quick-btn:hover { background: #e9e9ee; color: var(--ink); }

.generate-btn {
  width: 100%; margin-top: 6px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 20px;
  font-size: 14px; font-weight: 600; color: #fff;
  background: linear-gradient(135deg, #4f46e5, #6366f1 55%, #0ea5e9);
  border: 0; border-radius: 16px; cursor: pointer; transition: all .2s;
  box-shadow: 0 6px 18px #4f46e535;
}
.generate-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px #4f46e545; }
.generate-btn:active { transform: translateY(0); }
.generate-btn:disabled { opacity: .55; cursor: default; transform: none; }

/* Result panel */
.result-panel { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

.summary-chips {
  display: flex; flex-wrap: wrap; gap: 7px;
}
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 11px; font-size: 11.5px; font-weight: 540;
  background: #ffffffb0; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid #00000012; border-radius: 100px; color: #56565b;
}
.chip .chip-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.result-card {
  position: relative; min-height: 260px;
  background: var(--glass);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid #00000015; border-radius: var(--radius-lg);
  padding: 30px 30px 24px; box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.result-card::before {
  content: ''; position: absolute; top: -70px; right: -70px;
  width: 220px; height: 220px; border-radius: 50%;
  background: radial-gradient(circle, #6366f120, #6366f100 70%); pointer-events: none;
}

.result-meta {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; position: relative;
}
.result-meta .tag {
  font-size: 11px; font-weight: 580; color: var(--accent);
  background: #4f46e50d; border: 1px solid #4f46e520; border-radius: 8px; padding: 4px 9px;
}
.result-meta .ts { font-size: 11px; color: #a0a0a5; }

.result-text {
  position: relative; white-space: pre-wrap; word-break: break-word;
  font-size: 15.5px; line-height: 1.75; color: #2a2a2e; letter-spacing: -.005em;
}
.result-text.fade-in { animation: fadeUp .35s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.result-actions {
  display: flex; flex-wrap: wrap; gap: 9px; margin-top: 22px;
  padding-top: 18px; border-top: 1px solid var(--line); position: relative;
}
.action-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 14px; font-size: 12.5px; font-weight: 550; cursor: pointer;
  border-radius: 13px; transition: all .16s; font-family: inherit;
}
.action-btn.copy { background: #f2f2f5; border: 1px solid #00000012; color: #424247; }
.action-btn.copy:hover { background: #e9e9ee; }
.action-btn.copy.done { background: #16a34a14; border-color: #16a34a33; color: var(--green); }
.action-btn.mail { background: #fff7e6; border: 1px solid #f59e0b33; color: #b45309; text-decoration: none; }
.action-btn.mail:hover { background: #fef0d0; }
.action-btn.rewrite { background: #ffffff; border: 1px solid #4f46e533; color: var(--accent); }
.action-btn.rewrite:hover { background: #4f46e508; }

/* Empty state */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; min-height: 200px; color: #9b9ba0; gap: 12px;
}
.empty-state .empty-orb {
  width: 56px; height: 56px; border-radius: 16px;
  background: linear-gradient(145deg, #eef2ff, #e0f2fe);
  display: grid; place-items: center; color: var(--accent);
}
.empty-state p { font-size: 13px; line-height: 1.6; max-width: 280px; }

/* Loading */
.loading-state { display: flex; align-items: center; gap: 12px; color: #8b8b91; font-size: 14px; }
.loader {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid #4f46e525; border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* History */
.history-card {
  background: var(--glass-soft);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid #00000012; border-radius: var(--radius-md);
  padding: 18px 20px; box-shadow: var(--shadow-sm);
}
.history-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.history-head h3 { font-size: 13px; font-weight: 600; color: #56565b; display: flex; align-items: center; gap: 6px; }
.history-head .clear-btn {
  font-size: 11px; color: #a0a0a5; cursor: pointer; background: none; border: 0; font-family: inherit;
}
.history-head .clear-btn:hover { color: var(--red); }
.history-list { display: flex; flex-direction: column; gap: 8px; }
.history-item {
  padding: 11px 13px; background: #ffffff80; border: 1px solid #0000000e;
  border-radius: 12px; cursor: pointer; transition: all .15s;
}
.history-item:hover { background: #fff; border-color: #0000001f; transform: translateX(2px); }
.history-item .hi-top {
  display: flex; align-items: center; gap: 7px; font-size: 10.5px; color: #9b9ba0; margin-bottom: 5px;
}
.history-item .hi-top .hi-type { color: var(--accent); font-weight: 580; }
.history-item .hi-snippet {
  font-size: 12.5px; color: #424247; line-height: 1.5;
  overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.history-empty { font-size: 12px; color: #a0a0a5; text-align: center; padding: 14px 0; }

/* ===== Footer ===== */
.site-footer {
  text-align: center; padding: 28px 20px;
  border-top: 1px solid #0000000a; color: #9b9ba0; font-size: 11px;
}

/* ===== Responsive ===== */
@media (max-width: 860px) {
  .workshop { grid-template-columns: 1fr; }
  .control-panel { position: static; }
}
@media (max-width: 560px) {
  .hero { padding: 56px 0 32px; }
  .control-panel, .result-card { padding: 22px 18px; }
  .result-text { font-size: 14.5px; }
  .action-btn { flex: 1; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<!-- ===== Header ===== -->
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#">
      <span class="brand-gem"></span>
      <span>体面请假生成器</span>
    </a>
    <nav class="main-nav">
      <a href="#workshop">生成话术</a>
      <a href="#" id="nav-history">历史 <span style="background:var(--ink);color:#fff;font-size:10px;border-radius:9px;padding:1px 6px;margin-left:2px;" id="nav-count">0</span></a>
    </nav>
  </div>
</header>

<!-- ===== Hero ===== -->
<section class="hero">
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="eyebrow"><span class="dot"></span> AI 职场话术工坊</div>
  <h1>请假不难，<span class="grad">难在开口得体</span></h1>
  <p class="hero-copy">选个类型和风格，AI 帮你把请假理由组织得体面又自然。邮件、微信都能直接发，体面打工，从请假开始。</p>
</section>

<!-- ===== Workshop ===== -->
<section class="workshop" id="workshop">
  <!-- Control Panel -->
  <div class="control-panel">
    <div class="panel-title">
      <span class="ico">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </span>
      请假参数
    </div>
    <p class="panel-sub">告诉 AI 你想怎么请，它来组织语言。</p>

    <!-- 类型 -->
    <div class="field">
      <div class="field-label"><span>请假类型</span></div>
      <div class="opt-group" data-group="type"></div>
    </div>

    <!-- 风格 -->
    <div class="field">
      <div class="field-label"><span>话术风格</span><span class="hint-mini">影响整体语气</span></div>
      <div class="opt-group" data-group="style"></div>
    </div>

    <!-- 天数 -->
    <div class="field">
      <div class="field-label"><span>请假天数</span></div>
      <div class="opt-group" data-group="duration"></div>
    </div>

    <!-- 起始日期 -->
    <div class="field">
      <div class="field-label"><span>起始日期</span><span class="hint-mini">自动算时段</span></div>
      <div class="input-row">
        <input type="date" class="date-input" id="startDate">
        <button class="quick-btn" id="tomorrowBtn">明天</button>
      </div>
    </div>

    <!-- 领导称呼 -->
    <div class="field">
      <div class="field-label"><span>领导称呼</span></div>
      <div class="input-row">
        <input type="text" class="text-input" id="boss" value="领导" placeholder="如：王总">
        <button class="quick-btn" data-fill="boss" data-val="王总">王总</button>
        <button class="quick-btn" data-fill="boss" data-val="张经理">张经理</button>
      </div>
    </div>

    <!-- 交接同事 -->
    <div class="field">
      <div class="field-label"><span>工作交接人</span><span class="hint-mini">可选</span></div>
      <div class="input-row">
        <input type="text" class="text-input" id="colleague" value="同事小张" placeholder="如：小李">
        <button class="quick-btn" data-fill="colleague" data-val="同事小李">小李</button>
      </div>
    </div>

    <button class="generate-btn" id="generateBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/><path d="m14 7 3 3"/><path d="M12 12 3 21"/><path d="m21 3-7 7"/></svg>
      生成体面话术
    </button>
  </div>

  <!-- Result Panel -->
  <div class="result-panel">
    <!-- summary -->
    <div class="summary-chips" id="summaryChips">
      <span class="chip"><span class="chip-dot"></span> 等待生成…</span>
    </div>

    <!-- result -->
    <div class="result-card" id="resultCard">
      <div class="empty-state" id="emptyState">
        <div class="empty-orb">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
        </div>
        <p>填好左侧参数，点击「生成体面话术」<br>这里会出现一段得体的请假话术。</p>
      </div>
    </div>

    <!-- history -->
    <div class="history-card">
      <div class="history-head">
        <h3>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
          最近生成
        </h3>
        <button class="clear-btn" id="clearHistory">清空</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty">还没有记录，生成的话术会出现在这里。</div>
      </div>
    </div>
  </div>
</section>

<!-- ===== Footer ===== -->
<footer class="site-footer">
  <p>体面请假生成器 · 本地运行，数据不出浏览器 · 仅供娱乐参考，请结合实际使用 💼</p>
</footer>

<script>
/* ===== Data: 请假类型 ===== */
const LEAVE_TYPES = {
  personal:       { name: '事假', reasons: ['家中临时有些事需要处理', '家里有点急事得回去一趟', '有个私事需要亲自处理一下'] },
  sick:           { name: '病假', reasons: ['身体不太舒服，想去医院看看', '有点感冒发烧，需要休息恢复一下', '肠胃不太对劲，想请假调养调养'] },
  annual:         { name: '年假', reasons: ['想用年假调整一下状态', '计划把积攒的年假休了', '想休几天年假充充电'] },
  compensatory:   { name: '调休', reasons: ['想把之前加班攒的调休用掉', '用调休稍微休整一下', '调休抵扣，休息调整一下'] },
  marriage:       { name: '婚假', reasons: ['要筹备婚礼相关事宜', '需要处理婚礼的一些安排', '婚礼临近，有些事需亲自打理'] },
  other:          { name: '其他', reasons: ['有些个人事务需要处理', '需要请假处理一些事情', '有点私事需要安排一下'] }
};

/* ===== Data: 话术风格 + 模板 ===== */
const STYLES = {
  gentle: {
    name: '委婉含蓄',
    templates: [
      '{boss}，冒昧打扰您一下。{reason}，想跟您请假{duration}。手头的工作我已经和{colleague}交代清楚了，若有紧急情况也随时能联系到我。给您添麻烦了，非常感谢您的理解。',
      '{boss}，不好意思占用您一点时间。{reason}，所以想请假{duration}。工作方面已和{colleague}做好交接，不会影响进度，有什么急事电话也能找到我。麻烦您了，谢谢。',
      '{boss}，想跟您说个事。{reason}，需要请{duration}假。我已经把要跟进的工作托付给{colleague}了，您放心。给您添麻烦，感谢体谅。'
    ]
  },
  direct: {
    name: '真诚直接',
    templates: [
      '{boss}您好，{reason}，需要向您请假{duration}。手头工作已安排{colleague}协助跟进，有急事可随时电话联系我。谢谢。',
      '{boss}，{reason}，我想请{duration}假。工作已经交接给{colleague}，进度不受影响，紧急情况随时找我。感谢批准。',
      '{boss}您好，因{reason}，申请请假{duration}。{colleague}会帮忙跟进期间的工作，有需要可随时联系。谢谢。'
    ]
  },
  playful: {
    name: '俏皮幽默',
    templates: [
      '{boss}，{reason}，得请{duration}假溜一下～手头的活儿已经托付给{colleague}了，保证不掉链子。等我满血复活回来请您喝奶茶☕ 感谢老板宽宏大量！',
      '{boss}，{reason}，申请请假{duration}开启一下节能模式🔋 工作已交接给{colleague}，安心无忧。回来给您带好吃的，谢谢老板～',
      '{boss}，{reason}，需要请假{duration}去处理一下～ 工作已拜托{colleague}照看，有急事随时召唤。感恩老板的理解，回来加倍努力！💪'
    ]
  },
  formal: {
    name: '正式商务',
    templates: [
      '尊敬的{boss}：\n您好。因{reason}，特向您申请{duration}假期。期间工作已交接至{colleague}，相关进度及应急联络方式均已同步。恳请批准，感谢。\n此致\n敬礼。',
      '{boss}您好：\n兹因{reason}，现申请请假{duration}。请假期间工作由{colleague}代为跟进，紧急事务可致电本人。妥否，请批示。感谢。',
      '尊敬的{boss}：\n您好。因{reason}，拟请假{duration}。工作已妥善交接至{colleague}，期间可保持通讯畅通。恳请予以批准为盼。\n此致\n敬礼。'
    ]
  }
};

/* ===== Data: 天数 ===== */
const DURATIONS = {
  half:  { name: '半天',  addDays: 0, label: d => `半天（${d}）` },
  one:   { name: '1天',   addDays: 0, label: d => `1天（${d}）` },
  two:   { name: '2天',   addDays: 1, label: d => `2天（${d}—${d}` }, // 特殊处理
  three: { name: '3天',   addDays: 2, label: d => `3天（${d}—${d}` },
  week:  { name: '一周',  addDays: 4, label: d => `一周（${d}—${d}` }
};

/* ===== State ===== */
const state = { type: 'personal', style: 'gentle', duration: 'half' };
const history = [];

/* ===== Helpers ===== */
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function toISO(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function cnDate(d) { return `${d.getMonth()+1}月${d.getDate()}日`; }

function durationLabel(key, startStr) {
  const start = new Date(startStr + 'T00:00:00');
  const s = cnDate(start);
  if (key === 'half') return `半天（${s}）`;
  if (key === 'one')  return `1天（${s}）`;
  const add = { two: 1, three: 2, week: 4 }[key];
  const end = new Date(start);
  end.setDate(end.getDate() + add);
  const dayCount = { two: '2天', three: '3天', week: '一周' }[key];
  return `${dayCount}（${s}—${cnDate(end)}）`;
}

function generate() {
  const typeData = LEAVE_TYPES[state.type];
  const styleData = STYLES[state.style];
  const reason = pick(typeData.reasons);
  const duration = durationLabel(state.duration, document.getElementById('startDate').value);
  const boss = document.getElementById('boss').value.trim() || '领导';
  const colleague = document.getElementById('colleague').value.trim() || '同事';
  const template = pick(styleData.templates);
  return template
    .replace(/{boss}/g, boss)
    .replace(/{reason}/g, reason)
    .replace(/{duration}/g, duration)
    .replace(/{colleague}/g, colleague);
}

/* ===== Render option groups ===== */
function renderGroups() {
  const groups = [
    { key: 'type',     data: LEAVE_TYPES, prop: 'name' },
    { key: 'style',    data: STYLES,      prop: 'name' },
    { key: 'duration', data: DURATIONS,   prop: 'name' }
  ];
  groups.forEach(g => {
    const wrap = document.querySelector(`.opt-group[data-group="${g.key}"]`);
    wrap.innerHTML = '';
    Object.entries(g.data).forEach(([k, v]) => {
      const el = document.createElement('button');
      el.className = 'opt' + (state[g.key] === k ? ' active' : '');
      el.textContent = v[g.prop];
      el.dataset.val = k;
      el.addEventListener('click', () => {
        state[g.key] = k;
        wrap.querySelectorAll('.opt').forEach(o => o.classList.toggle('active', o.dataset.val === k));
        renderSummary();
      });
      wrap.appendChild(el);
    });
  });
}

/* ===== Summary chips ===== */
function renderSummary() {
  const wrap = document.getElementById('summaryChips');
  const items = [
    LEAVE_TYPES[state.type].name,
    STYLES[state.style].name,
    DURATIONS[state.duration].name
  ];
  wrap.innerHTML = items.map((t, i) =>
    `<span class="chip"><span class="chip-dot"></span> ${t}</span>`
  ).join('');
}

/* ===== Result rendering ===== */
let lastText = '';

function showResult(text) {
  lastText = text;
  const card = document.getElementById('resultCard');
  const ts = new Date();
  const timeStr = `${pad(ts.getHours())}:${pad(ts.getMinutes())}`;
  card.innerHTML = `
    <div class="result-meta">
      <span class="tag">${LEAVE_TYPES[state.type].name} · ${STYLES[state.style].name}</span>
      <span class="ts">生成于 ${timeStr}</span>
    </div>
    <div class="result-text fade-in" id="resultText">${escapeHtml(text)}</div>
    <div class="result-actions">
      <button class="action-btn copy" id="copyBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        复制
      </button>
      <a class="action-btn mail" id="mailBtn" href="#">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        发邮件
      </a>
      <button class="action-btn rewrite" id="rewriteBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        换一版
      </button>
    </div>
  `;
  bindActions();
}

function showLoading() {
  const card = document.getElementById('resultCard');
  card.innerHTML = `
    <div class="loading-state" style="min-height:200px; align-items:center; justify-content:center;">
      <span class="loader"></span>
      正在组织得体的语言…
    </div>`;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ===== Actions ===== */
function bindActions() {
  document.getElementById('copyBtn').addEventListener('click', async function() {
    try {
      await navigator.clipboard.writeText(lastText);
    } catch(e) {
      const ta = document.createElement('textarea');
      ta.value = lastText; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch(_){}
      document.body.removeChild(ta);
    }
    this.classList.add('done');
    this.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> 已复制`;
    setTimeout(() => {
      this.classList.remove('done');
      this.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> 复制`;
    }, 1600);
  });

  document.getElementById('mailBtn').addEventListener('click', function(e) {
    e.preventDefault();
    const subject = encodeURIComponent(`请假申请 - ${LEAVE_TYPES[state.type].name}`);
    const body = encodeURIComponent(lastText);
    window.location.href = `mailto:?subject=${subject}&body=${body}`;
  });

  document.getElementById('rewriteBtn').addEventListener('click', () => {
    runGenerate(true);
  });
}

/* ===== Generate flow (with fake "thinking" delay for AI feel) ===== */
function runGenerate(isRewrite) {
  showLoading();
  setTimeout(() => {
    const text = generate();
    showResult(text);
    if (!isRewrite) addToHistory(text);
    else updateHistoryTop(text);
  }, 420);
}

/* ===== History ===== */
function addToHistory(text) {
  history.unshift({ text, type: state.type, style: state.style, duration: state.duration });
  if (history.length > 5) history.pop();
  renderHistory();
}
function updateHistoryTop(text) {
  if (history[0]) {
    history[0].text = text;
    history[0].type = state.type;
    history[0].style = state.style;
    history[0].duration = state.duration;
  } else {
    addToHistory(text);
  }
  renderHistory();
}
function renderHistory() {
  const list = document.getElementById('historyList');
  const count = document.getElementById('nav-count');
  count.textContent = history.length;
  if (history.length === 0) {
    list.innerHTML = `<div class="history-empty">还没有记录，生成的话术会出现在这里。</div>`;
    return;
  }
  list.innerHTML = history.map((h, i) => `
    <div class="history-item" data-idx="${i}">
      <div class="hi-top">
        <span class="hi-type">${LEAVE_TYPES[h.type].name}</span>
        <span>·</span><span>${STYLES[h.style].name}</span>
        <span>·</span><span>${DURATIONS[h.duration].name}</span>
      </div>
      <div class="hi-snippet">${escapeHtml(h.text)}</div>
    </div>
  `).join('');
  list.querySelectorAll('.history-item').forEach(el => {
    el.addEventListener('click', () => {
      const h = history[+el.dataset.idx];
      // restore state + show
      Object.assign(state, { type: h.type, style: h.style, duration: h.duration });
      renderGroups(); renderSummary();
      showResult(h.text);
      window.scrollTo({ top: document.getElementById('workshop').offsetTop - 70, behavior: 'smooth' });
    });
  });
}

/* ===== Init ===== */
function init() {
  // default date = tomorrow
  const t = new Date(); t.setDate(t.getDate() + 1);
  document.getElementById('startDate').value = toISO(t);
  document.getElementById('startDate').min = toISO(new Date());

  document.getElementById('tomorrowBtn').addEventListener('click', () => {
    const t = new Date(); t.setDate(t.getDate() + 1);
    document.getElementById('startDate').value = toISO(t);
  });

  // quick fill buttons
  document.querySelectorAll('.quick-btn[data-fill]').forEach(b => {
    b.addEventListener('click', () => {
      document.getElementById(b.dataset.fill).value = b.dataset.val;
    });
  });

  // generate
  document.getElementById('generateBtn').addEventListener('click', () => runGenerate(false));

  // clear history
  document.getElementById('clearHistory').addEventListener('click', () => {
    if (history.length === 0) return;
    history.length = 0;
    renderHistory();
  });

  // nav history scroll
  document.getElementById('nav-history').addEventListener('click', (e) => {
    e.preventDefault();
    document.querySelector('.history-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  renderGroups();
  renderSummary();
  renderHistory();
}

init();
</script>
