<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梗词记 - 单词记忆卡片</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card-box {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .tag-source {
            display: inline-block;
            background: #f472b6;
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 30px;
            margin-bottom: 12px;
        }
        .word-title {
            font-size: 36px;
            font-weight: bold;
            color: #1f2937;
        }
        .phonetic {
            color: #6b7280;
            font-size: 16px;
            margin: 6px 0 16px;
        }
        .meaning-block {
            background: #f3f4f6;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .meaning-block h4 {
            color: #4b5563;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .meaning-block p {
            color: #111827;
            line-height: 1.6;
        }
        .memory-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #7c3aed;
        }
        .memory-content {
            line-height: 1.7;
            color: #374151;
            font-size: 15px;
        }
        .song-info {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #6b7280;
        }
        .footer-mark {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
        }
        .btn-copy {
            width: 100%;
            margin-top: 20px;
            border: none;
            padding: 12px;
            border-radius: 12px;
            background: #7c3aed;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-copy:hover {
            background: #6d28d9;
        }
    </style>
</head>
<body>
<div class="card-box" id="card">
    <span class="tag-source">抖音热梗记忆卡</span>
    <h2 class="word-title">pest</h2>
    <div class="phonetic">英 /pest/  美 /pest/</div>

    <div class="meaning-block">
        <h4>核心释义</h4>
        <p>n. 害虫；讨厌的人、麻烦精</p>
    </div>

    <h3 class="memory-title">AI趣味拆分记忆</h3>
    <p class="memory-content">
        谐音记忆：pest → “拍死它”<br>
        短视频热梗联动：家里蟑螂泛滥崩溃名场面，看见害虫直接想拍死它，一眼记住 pest=害虫；延伸：总烦你的朋友就是 pest（烦人精）
    </p>

    <div class="song-info">
        关联素材：国外网红吐槽居家虫害短视频热梗
    </div>

    <button class="btn-copy" onclick="copyCardText()">复制卡片文案</button>
    <div class="footer-mark">梗词记 · AI单词记忆生成</div>
</div>

<script>
function copyCardText() {
    const text = document.querySelector('#card').innerText;
    navigator.clipboard.writeText(text).then(()=>{
        alert("卡片文字复制成功，可发短视频文案！");
    })
}
</script>
</body>
</html>
