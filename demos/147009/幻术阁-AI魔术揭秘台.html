<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幻术阁 · 魔术揭秘台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Georgia","STSong",serif;}
  html,body{width:100%;height:100%;overflow:hidden;
    background:radial-gradient(ellipse at center,#4a148c 0%,#1a0033 100%);color:#e1bee7;}

  .stage-light{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse 50% 60% at 50% 30%,rgba(255,255,255,0.12),transparent 70%);}
  .stage-light::after{content:"";position:absolute;top:0;left:50%;width:0;height:0;
    border-left:200px solid transparent;border-right:200px solid transparent;border-top:600px solid rgba(255,255,255,0.04);
    transform:translateX(-50%);}

  .particles{position:fixed;inset:0;pointer-events:none;z-index:2;}

  header{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;
    padding:18px 40px;}
  .logo{font-size:30px;letter-spacing:8px;font-weight:bold;text-shadow:0 0 20px rgba(225,190,231,0.5);}
  .logo span{color:#ffeb3b;font-style:italic;}
  .subtitle{font-size:12px;letter-spacing:6px;opacity:0.5;}

  main{position:relative;z-index:5;display:grid;grid-template-rows:1fr auto;height:calc(100% - 75px);
    padding:0 40px 24px;}

  /* 舞台 */
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;perspective:1200px;}
  .stage-title{position:absolute;top:10px;font-size:14px;letter-spacing:8px;opacity:0.5;}

  .card-zone{position:relative;width:300px;height:430px;transform-style:preserve-3d;}
  .magic-card{position:absolute;width:200px;height:290px;left:50px;top:70px;
    transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,0,.2,1);}
  .card-face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.6);}
  .card-front{background:linear-gradient(135deg,#1a0033,#4a148c);
    border:2px solid #ce93d8;}
  .card-back{background:linear-gradient(135deg,#4a148c,#7b1fa2);
    border:2px solid #ffeb3b;transform:rotateY(180deg);}
  .card-pattern{width:80%;height:80%;display:flex;align-items:center;justify-content:center;}
  .card-pattern svg{width:100%;height:100%;stroke:#ffeb3b;fill:none;stroke-width:2;}
  .card-back-pattern{width:90%;height:90%;border:2px solid rgba(255,235,59,0.4);border-radius:8px;
    display:flex;align-items:center;justify-content:center;}
  .card-back-pattern svg{width:60%;height:60%;stroke:#ffeb3b;fill:none;stroke-width:1.5;opacity:0.6;}

  .stage-curtain{position:absolute;width:100%;height:100%;top:0;left:0;pointer-events:none;}
  .curtain-l,.curtain-r{position:absolute;top:0;width:35%;height:100%;
    background:linear-gradient(90deg,#1a0033,#4a148c 80%,transparent);
    transition:transform 1s ease;}
  .curtain-l{left:0;}
  .curtain-r{right:0;transform:scaleX(-1);}
  .stage.open .curtain-l{transform:translateX(-90%);}
  .stage.open .curtain-r{transform:scaleX(-1) translateX(-90%);}

  .reveal-panel{position:absolute;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
    width:520px;background:rgba(26,0,51,0.85);border:1px solid rgba(255,235,59,0.3);
    border-radius:12px;padding:16px 24px;opacity:0;transition:all .5s;backdrop-filter:blur(10px);
    pointer-events:none;}
  .reveal-panel.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
  .reveal-panel h3{color:#ffeb3b;font-size:16px;letter-spacing:3px;margin-bottom:8px;}
  .reveal-panel p{font-size:13px;line-height:1.7;opacity:0.85;}

  .step-indicator{position:absolute;top:50px;display:flex;gap:8px;}
  .step-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.2);transition:all .3s;}
  .step-dot.active{background:#ffeb3b;box-shadow:0 0 10px #ffeb3b;transform:scale(1.3);}

  /* 底部魔术列表 */
  .magic-list{display:flex;gap:14px;justify-content:center;padding:16px;
    background:rgba(26,0,51,0.6);border-radius:20px;border:1px solid rgba(225,190,231,0.15);
    backdrop-filter:blur(10px);overflow-x:auto;}
  .magic-list::-webkit-scrollbar{height:4px;}
  .magic-list::-webkit-scrollbar-thumb{background:rgba(255,235,59,0.3);border-radius:2px;}
  .magic-card-btn{min-width:150px;background:rgba(74,20,140,0.5);border:1px solid rgba(225,190,231,0.25);
    border-radius:14px;padding:14px;cursor:pointer;transition:all .35s;color:#e1bee7;
    display:flex;flex-direction:column;gap:8px;flex-shrink:0;}
  .magic-card-btn:hover{background:rgba(123,31,162,0.6);border-color:#ffeb3b;
    transform:translateY(-4px);box-shadow:0 8px 25px rgba(255,235,59,0.2);}
  .magic-card-btn.active{background:linear-gradient(135deg,#4a148c,#7b1fa2);border-color:#ffeb3b;
    box-shadow:0 0 20px rgba(255,235,59,0.4);}
  .mc-name{font-size:15px;letter-spacing:3px;text-align:center;}
  .mc-stars{display:flex;justify-content:center;gap:2px;}
  .mc-stars span{font-size:12px;color:#ffeb3b;opacity:0.3;}
  .mc-stars span.on{opacity:1;}
  .mc-diff{font-size:10px;text-align:center;opacity:0.6;letter-spacing:2px;}

  .ctrl-bar{position:absolute;top:20px;right:20px;display:flex;gap:10px;}
  .ctrl-btn{background:rgba(255,235,59,0.15);border:1px solid rgba(255,235,59,0.4);color:#ffeb3b;
    padding:8px 18px;border-radius:20px;cursor:pointer;font-size:12px;letter-spacing:2px;transition:all .3s;}
  .ctrl-btn:hover{background:#ffeb3b;color:#1a0033;}
  .ctrl-btn.primary{background:#ffeb3b;color:#1a0033;font-weight:bold;}

  .toast{position:fixed;top:30px;left:50%;transform:translateX(-50%) translateY(-30px);
    background:rgba(255,235,59,0.95);color:#1a0033;padding:10px 24px;border-radius:20px;
    font-size:13px;letter-spacing:2px;opacity:0;transition:all .4s;z-index:100;font-weight:bold;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="stage-light"></div>
<canvas class="particles" id="particles"></canvas>

<header>
  <div class="logo">幻<span>术</span>阁</div>
  <div class="subtitle">M A G I C &nbsp; R E V E A L E D</div>
</header>

<main>
  <div class="stage" id="stage">
    <div class="stage-title" id="stageTitle">请选择一个魔术</div>

    <div class="ctrl-bar" id="ctrlBar" style="display:none;">
      <button class="ctrl-btn" onclick="playStep(-1)">上一步</button>
      <button class="ctrl-btn" onclick="playStep(1)">下一步</button>
      <button class="ctrl-btn primary" onclick="revealSecret()">揭 秘</button>
    </div>

    <div class="step-indicator" id="stepIndicator" style="display:none;"></div>

    <div class="stage-curtain">
      <div class="curtain-l"></div>
      <div class="curtain-r"></div>
    </div>

    <div class="card-zone">
      <div class="magic-card" id="magicCard">
        <div class="card-face card-front">
          <div class="card-pattern" id="cardFrontPattern">
            <svg viewBox="0 0 100 140"><rect x="10" y="10" width="80" height="120" rx="8"/><circle cx="50" cy="70" r="25"/><path d="M35,70 L65,70 M50,55 L50,85"/></svg>
          </div>
        </div>
        <div class="card-face card-back">
          <div class="card-back-pattern">
            <svg viewBox="0 0 100 100"><polygon points="50,10 90,50 50,90 10,50"/><circle cx="50" cy="50" r="20"/><path d="M50,30 L50,70 M30,50 L70,50"/></svg>
          </div>
        </div>
      </div>
    </div>

    <div class="reveal-panel" id="revealPanel">
      <h3 id="revealTitle"></h3>
      <p id="revealText"></p>
    </div>
  </div>

  <div class="magic-list" id="magicList"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const magics=[
  {name:'猜牌术',diff:2,steps:[
    {card:{svg:'<rect x="10" y="10" width="80" height="120" rx="8"/><text x="50" y="80" font-size="50" text-anchor="middle" fill="#ffeb3b" stroke="none">A</text>',flip:false,rotate:0,x:0},
     desc:'观众随意抽一张牌'},
    {card:{svg:'<rect x="10" y="10" width="80" height="120" rx="8"/><text x="50" y="80" font-size="50" text-anchor="middle" fill="#ffeb3b" stroke="none">?</text>',flip:true,rotate:0,x:0},
     desc:'牌面朝下放回牌堆'},
    {card:{svg:'<rect x="10" y="10" width="80" height="120" rx="8"/><text x="50" y="80" font-size="50" text-anchor="middle" fill="#ffeb3b" stroke="none">A</text>',flip:false,rotate:180,x:0},
     desc:'魔术师精准找出这张牌'},
  ],secret:'利用"关键牌"原理：在观众抽牌前，先记住牌堆最底一张。观众抽牌后，将关键牌置于其上。洗牌时只要找到关键牌，其下方一张即为观众所选。'},
  {name:'硬币消失',diff:1,steps:[
    {card:{svg:'<circle cx="50" cy="70" r="25"/><circle cx="50" cy="70" r="15"/>',flip:false,rotate:0,x:0},desc:'硬币握于掌心'},
    {card:{svg:'<circle cx="50" cy="70" r="25" opacity="0.3"/><circle cx="50" cy="70" r="15" opacity="0.3"/>',flip:false,rotate:0,x:0},desc:'手掌缓缓张开'},
    {card:{svg:'<rect x="10" y="10" width="80" height="120" rx="8"/>',flip:false,rotate:0,x:0},desc:'硬币凭空消失！'},
  ],secret:'经典"经典藏币法"（Classic Palm）：硬币并未消失，而是被藏在手掌虎口的肌肉缝隙中。利用观众视角盲区，张开手时硬币仍贴在掌心，从正面看不到。'},
  {name:'读心术',diff:3,steps:[
    {card:{svg:'<circle cx="50" cy="70" r="30"/><circle cx="40" cy="65" r="3" fill="#ffeb3b" stroke="none"/><circle cx="60" cy="65" r="3" fill="#ffeb3b" stroke="none"/>',flip:false,rotate:0,x:0},desc:'凝视观众双眼'},
    {card:{svg:'<circle cx="50" cy="70" r="30"/><path d="M35,80 Q50,90 65,80"/>',flip:false,rotate:0,x:0},desc:'深沉思索片刻'},
    {card:{svg:'<rect x="10" y="10" width="80" height="120" rx="8"/><text x="50" y="80" font-size="40" text-anchor="middle" fill="#ffeb3b" stroke="none">7</text>',flip:false,rotate:0,x:0},desc:'说中观众心中所想数字'},
  ],secret:'"强制选择法"（Force）：魔术师通过精心设计的话术引导，让观众以为自由选择，实则被引导至预设答案。配合冷读术观察微表情，进一步缩小范围。'},
  {name:'橡皮筋穿透',diff:2,steps:[
    {card:{svg:'<rect x="20" y="50" width="60" height="20" rx="10"/><rect x="20" y="70" width="60" height="20" rx="10"/>',flip:false,rotate:0,x:0},desc:'两根橡皮筋交叉穿过'},
    {card:{svg:'<rect x="20" y="50" width="60" height="20" rx="10"/><rect x="20" y="70" width="60" height="20" rx="10" opacity="0.5"/>',flip:false,rotate:0,x:0},desc:'拉扯看似无法分离'},
    {card:{svg:'<rect x="10" y="40" width="50" height="20" rx="10"/><rect x="40" y="80" width="50" height="20" rx="10"/>',flip:false,rotate:0,x:0},desc:'瞬间穿透分离！'},
  ],secret:'"假交叉"手法：展示时两根橡皮筋并未真正交叉，而是利用手指夹持制造视觉交叉假象。拉动时手指松开，两根橡皮筋自然分离，造成"穿透"错觉。'},
  {name:'牌阵预言',diff:4,steps:[
    {card:{svg:'<rect x="10" y="10" width="80" height="120" rx="8"/><text x="25" y="40" font-size="20" fill="#ffeb3b" stroke="none">A</text><text x="60" y="110" font-size="20" fill="#ffeb3b" stroke="none">K</text>',flip:false,rotate:-15,x:-60},desc:'展开四张牌'},
    {card:{svg:'<rect x="10" y="10" width="80" height="120" rx="8"/><text x="50" y="80" font-size="40" text-anchor="middle" fill="#ffeb3b" stroke="none">Q</text>',flip:false,rotate:0,x:0},desc:'观众心中记住一张'},
    {card:{svg:'<rect x="10" y="10" width="80" height="120" rx="8"/><text x="50" y="80" font-size="40" text-anchor="middle" fill="#ffeb3b" stroke="none">Q</text>',flip:true,rotate:0,x:0},desc:'翻开预言信封——正是那张！'},
  ],secret:'"多重预言"技巧：信封中藏有所有可能答案，根据观众选择，利用"翻牌切换"或"双层信封"展示对应预言。配合话术拖延，让观众忘记最初看到的所有选项。'},
];

let currentMagic=0, currentStep=0, isPlaying=false;
const stage=document.getElementById('stage');
const card=document.getElementById('magicCard');
const cardFront=document.getElementById('cardFrontPattern');
const revealPanel=document.getElementById('revealPanel');
const stepIndicator=document.getElementById('stepIndicator');
const ctrlBar=document.getElementById('ctrlBar');

function renderList(){
  const list=document.getElementById('magicList');
  list.innerHTML='';
  magics.forEach((m,i)=>{
    const btn=document.createElement('div');
    btn.className='magic-card-btn'+(i===currentMagic?' active':'');
    let stars='';
    for(let j=0;j<5;j++)stars+=`<span class="${j<m.diff?'on':''}">★</span>`;
    btn.innerHTML=`<div class="mc-name">${m.name}</div><div class="mc-stars">${stars}</div><div class="mc-diff">难度 ${m.diff}/5</div>`;
    btn.onclick=()=>selectMagic(i);
    list.appendChild(btn);
  });
}
renderList();

function selectMagic(i){
  currentMagic=i;currentStep=0;
  renderList();
  document.getElementById('stageTitle').textContent=magics[i].name;
  ctrlBar.style.display='flex';
  stepIndicator.style.display='flex';
  stepIndicator.innerHTML='';
  magics[i].steps.forEach((s,j)=>{
    const d=document.createElement('div');
    d.className='step-dot'+(j===0?' active':'');
    stepIndicator.appendChild(d);
  });
  revealPanel.classList.remove('show');
  stage.classList.add('open');
  setTimeout(()=>playStep(0),600);
  showToast('上演：'+magics[i].name);
}

function playStep(dir){
  const steps=magics[currentMagic].steps;
  currentStep=Math.max(0,Math.min(steps.length-1,currentStep+dir));
  if(dir===0)currentStep=0;
  const step=steps[currentStep];
  cardFront.innerHTML=`<svg viewBox="0 0 100 140">${step.card.svg}</svg>`;
  card.style.transform=`rotateY(${step.card.flip?180:0}deg) rotate(${step.card.rotate||0}deg) translateX(${step.card.x||0}px)`;
  document.querySelectorAll('.step-dot').forEach((d,i)=>d.classList.toggle('active',i===currentStep));
  if(currentStep===steps.length-1){
    setTimeout(()=>showToast('表演完成，点击"揭秘"查看原理'),800);
  }
}

function revealSecret(){
  const m=magics[currentMagic];
  document.getElementById('revealTitle').textContent='「'+m.name+'」原理解析';
  document.getElementById('revealText').textContent=m.secret;
  revealPanel.classList.add('show');
  card.style.transform+=' scale(0.85)';
  showToast('揭秘中…');
}

// 光点粒子
const pcanvas=document.getElementById('particles');
const pctx=pcanvas.getContext('2d');
let pparticles=[];
function resizeP(){pcanvas.width=window.innerWidth;pcanvas.height=window.innerHeight;}
resizeP();window.addEventListener('resize',resizeP);
for(let i=0;i<60;i++){
  pparticles.push({
    x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,
    vx:(Math.random()-0.5)*0.3,vy:Math.random()*0.5+0.2,
    r:Math.random()*2+0.5,opacity:Math.random()*0.6+0.2,
    hue:Math.random()>0.5?50:280
  });
}
function animateP(){
  pctx.clearRect(0,0,pcanvas.width,pcanvas.height);
  pparticles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.y>pcanvas.height){p.y=-5;p.x=Math.random()*pcanvas.width;}
    if(p.x<0||p.x>pcanvas.width)p.vx*=-1;
    pctx.beginPath();
    pctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    pctx.fillStyle=`hsla(${p.hue},80%,70%,${p.opacity})`;
    pctx.shadowBlur=8;pctx.shadowColor=`hsla(${p.hue},80%,70%,0.8)`;
    pctx.fill();
  });
  requestAnimationFrame(animateP);
}
animateP();

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),1800);
}
</script>
</body>
</html>
