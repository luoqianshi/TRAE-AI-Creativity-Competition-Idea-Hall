<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI备考规划师</title>
<style>
  :root {
    --primary: #60a5fa;
    --primary-dark: #3b82f6;
    --primary-light: #dbeafe;
    --bg: #ffffff;
    --bg-warm: #f8fafc;
    --ink: #1e293b;
    --muted: #64748b;
    --rule: #e2e8f0;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
    --shadow-hover: 0 4px 6px rgba(0,0,0,0.05), 0 10px 30px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg-warm);
    color: var(--ink);
    line-height: 1.7;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
  }
  .page { display: none; min-height: 100vh; padding-bottom: 32px; }
  .page.active { display: block; }

  /* Nav */
  .top-nav {
    background: var(--bg);
    border-bottom: 1px solid var(--rule);
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .top-nav .brand {
    font-size: 16px;
    font-weight: 700;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .top-nav .brand span { font-size: 18px; }
  .btn-back {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    display: none;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .btn-back:hover { background: var(--bg-warm); color: var(--ink); }
  .btn-back.show { display: flex; }

  /* Hero */
  .hero {
    background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
    padding: 40px 16px 32px;
    text-align: center;
  }
  .hero h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .hero p {
    font-size: 14px;
    color: var(--muted);
  }

  /* Card */
  .card {
    background: var(--bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .dot {
    width: 8px;
    height: 8px;
    background: var(--primary);
    border-radius: 50%;
  }

  /* Form */
  .form-group { margin-bottom: 18px; }
  .form-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .form-label .sub {
    font-weight: 400;
    color: var(--muted);
    font-size: 13px;
    margin-left: 4px;
  }
  input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--rule);
    border-radius: var(--radius-sm);
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: var(--primary); }
  .subject-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule);
  }
  .subject-row:last-child { border-bottom: none; }
  .subject-name {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
  }
  .star-group {
    display: flex;
    gap: 4px;
  }
  .star {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--rule);
    cursor: pointer;
    transition: color 0.15s;
    user-select: none;
  }
  .star.on { color: #f59e0b; }
  .star-label {
    font-size: 12px;
    color: var(--muted);
    min-width: 44px;
    text-align: right;
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
  }
  .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
  .btn-secondary {
    width: 100%;
    padding: 12px;
    background: var(--bg);
    color: var(--primary-dark);
    border: 1px solid var(--primary-light);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }

  /* Overview */
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .overview-item {
    background: var(--primary-light);
    border-radius: var(--radius-sm);
    padding: 14px 8px;
    text-align: center;
  }
  .overview-item .num {
    font-size: 22px;
    font-weight: 700;
    color: var(--primary-dark);
  }
  .overview-item .label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Phase */
  .phase-list { display: flex; flex-direction: column; gap: 12px; }
  .phase-card {
    background: var(--bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .phase-header {
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .phase-header.p1 { background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); }
  .phase-header.p2 { background: linear-gradient(135deg, #c7d2fe 0%, #a5b4fc 100%); }
  .phase-header.p3 { background: linear-gradient(135deg, #ddd6fe 0%, #c4b5fd 100%); }
  .phase-header .name { font-weight: 700; font-size: 15px; }
  .phase-header .range { font-size: 13px; opacity: 0.8; }
  .phase-body { padding: 16px 20px; }
  .phase-body .desc { font-size: 14px; color: var(--muted); margin-bottom: 10px; }
  .phase-body .tasks { font-size: 13px; color: var(--ink); line-height: 2; }
  .phase-body .tasks span {
    display: inline-block;
    background: var(--bg-warm);
    padding: 2px 10px;
    border-radius: 100px;
    margin-right: 6px;
    margin-bottom: 4px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .tab-btn {
    flex-shrink: 0;
    padding: 8px 16px;
    border: 1px solid var(--rule);
    background: var(--bg);
    border-radius: 100px;
    font-size: 14px;
    cursor: pointer;
    color: var(--muted);
  }
  .tab-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .tab-btn .badge {
    font-size: 11px;
    margin-left: 4px;
    opacity: 0.8;
  }

  /* Daily task */
  .daily-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .daily-header h3 { font-size: 16px; }
  .daily-header .date { font-size: 13px; color: var(--muted); }

  .task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow);
    margin-bottom: 10px;
    transition: transform 0.15s;
  }
  .task-item:active { transform: scale(0.99); }
  .task-check {
    width: 24px;
    height: 24px;
    border: 2px solid var(--rule);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #fff;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .task-check.done { background: var(--primary); border-color: var(--primary); }
  .task-check.done::after { content: "✓"; }
  .task-info { flex: 1; }
  .task-info .title { font-size: 15px; font-weight: 500; }
  .task-info .title.done { text-decoration: line-through; color: var(--muted); }
  .task-info .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .task-tag {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 100px;
    background: var(--primary-light);
    color: var(--primary-dark);
    flex-shrink: 0;
  }
  .task-tag.quiz { background: #fef3c7; color: #b45309; }

  /* Quiz card */
  .quiz-card {
    background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
    border-radius: var(--radius-sm);
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .quiz-card .icon { font-size: 24px; }
  .quiz-card .text { flex: 1; }
  .quiz-card .text strong { font-size: 15px; display: block; }
  .quiz-card .text span { font-size: 13px; opacity: 0.8; }

  /* Progress bar */
  .progress-wrap {
    background: var(--bg-warm);
    border-radius: 100px;
    height: 8px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
    border-radius: 100px;
    transition: width 0.5s ease;
  }

  /* Footer */
  .app-footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--muted);
  }

  /* Empty */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: #fff;
    padding: 12px 24px;
    border-radius: 100px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-nav">
  <button class="btn-back" id="btnBack" onclick="goBack()">← 返回</button>
  <div class="brand"><span>📘</span> AI备考规划师</div>
  <div style="width:48px"></div>
</div>

<!-- 页面1：录入 -->
<div class="page active" id="pageForm">
  <div class="hero">
    <div class="container">
      <h1>智能定制复习方案</h1>
      <p>填写备考信息，AI一键生成专属复习计划</p>
    </div>
  </div>
  <div class="container" style="padding-top:20px">
    <div class="card">
      <div class="card-title"><div class="dot"></div>考试信息</div>
      <div class="form-group">
        <label class="form-label">考试名称</label>
        <input type="text" id="examName" placeholder="例如：2026年考研数学一" value="考研数学">
      </div>
      <div class="form-group">
        <label class="form-label">距离考试剩余天数</label>
        <input type="number" id="totalDays" placeholder="输入天数" value="90" min="7" max="365">
      </div>
      <div class="form-group">
        <label class="form-label">每日可用学习时长（小时）</label>
        <input type="number" id="dailyHours" placeholder="例如：4" value="4" min="1" max="16" step="0.5">
      </div>
    </div>

    <div class="card">
      <div class="card-title"><div class="dot"></div>科目与基础评估 <span class="sub">点击星星评分（1星=薄弱，5星=扎实）</span></div>
      <div id="subjectList"></div>
      <button class="btn-secondary" onclick="addSubject()">+ 添加科目</button>
    </div>

    <div class="card" style="background:transparent; box-shadow:none; padding:8px 0;">
      <button class="btn-primary" onclick="generatePlan()">一键生成复习计划</button>
    </div>
  </div>
</div>

<!-- 页面2：规划结果 -->
<div class="page" id="pageResult">
  <div class="container" style="padding-top:16px">
    <div class="overview-grid">
      <div class="overview-item">
        <div class="num" id="ovDays">--</div>
        <div class="label">总天数</div>
      </div>
      <div class="overview-item">
        <div class="num" id="ovHours">--</div>
        <div class="label">总时长(h)</div>
      </div>
      <div class="overview-item">
        <div class="num" id="ovProgress">--</div>
        <div class="label">完成度</div>
      </div>
    </div>

    <div class="progress-wrap" style="margin-bottom:16px;">
      <div class="progress-bar" id="totalProgress" style="width:0%"></div>
    </div>

    <div class="card">
      <div class="card-title"><div class="dot"></div>三阶段复习规划</div>
      <div class="phase-list" id="phaseList"></div>
    </div>

    <div class="card">
      <div class="card-title"><div class="dot"></div>自测节点安排</div>
      <div id="quizList"></div>
    </div>

    <div class="card" style="background:transparent; box-shadow:none; padding:8px 0;">
      <button class="btn-primary" onclick="showDaily()">查看每日任务清单</button>
      <button class="btn-secondary" onclick="resetPlan()">重新制定计划</button>
    </div>
  </div>
</div>

<!-- 页面3：每日任务 -->
<div class="page" id="pageDaily">
  <div class="container" style="padding-top:16px">
    <div class="card">
      <div class="daily-header">
        <h3>📋 每日学习任务</h3>
        <span class="date" id="dailyDateInfo"></span>
      </div>
      <div class="tabs" id="phaseTabs"></div>
      <div id="dailyList"></div>
    </div>
    <div class="card" style="background:transparent; box-shadow:none; padding:8px 0;">
      <button class="btn-secondary" onclick="showResult()">返回规划总览</button>
    </div>
  </div>
</div>

<div class="app-footer">AI备考规划师 · TRAE AI创造力大赛</div>
<div class="toast" id="toast"></div>

<script>
(function() {
  // ===== State =====
  var subjects = [
    { name: '高等数学', level: 2 },
    { name: '线性代数', level: 3 },
    { name: '概率统计', level: 2 }
  ];
  var plan = null;
  var currentPhase = 0;
  var currentDay = 0;

  // ===== Init =====
  renderSubjects();

  // ===== Subject management =====
  function renderSubjects() {
    var container = document.getElementById('subjectList');
    container.innerHTML = '';
    subjects.forEach(function(s, i) {
      var row = document.createElement('div');
      row.className = 'subject-row';
      var nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.value = s.name;
      nameInput.style.flex = '1';
      nameInput.style.border = 'none';
      nameInput.style.background = 'transparent';
      nameInput.style.fontSize = '15px';
      nameInput.style.padding = '0';
      nameInput.onchange = function() { subjects[i].name = this.value; };

      var starGroup = document.createElement('div');
      starGroup.className = 'star-group';
      for (var j = 1; j <= 5; j++) {
        var star = document.createElement('span');
        star.className = 'star' + (j <= s.level ? ' on' : '');
        star.textContent = '★';
        star.onclick = (function(idx, val) {
          return function() {
            subjects[idx].level = val;
            renderSubjects();
          };
        })(i, j);
        starGroup.appendChild(star);
      }

      var label = document.createElement('span');
      label.className = 'star-label';
      var labels = ['薄弱', '较弱', '一般', '较好', '扎实'];
      label.textContent = labels[s.level - 1];

      var delBtn = document.createElement('span');
      delBtn.textContent = '×';
      delBtn.style.color = '#cbd5e1';
      delBtn.style.cursor = 'pointer';
      delBtn.style.fontSize = '20px';
      delBtn.style.marginLeft = '8px';
      delBtn.onclick = function() {
        subjects.splice(i, 1);
        renderSubjects();
      };

      row.appendChild(nameInput);
      row.appendChild(starGroup);
      row.appendChild(label);
      if (subjects.length > 1) row.appendChild(delBtn);
      container.appendChild(row);
    });
  }

  window.addSubject = function() {
    subjects.push({ name: '新科目', level: 3 });
    renderSubjects();
  };

  // ===== Toast =====
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function() { el.classList.remove('show'); }, 2000);
  }

  // ===== Navigation =====
  function showPage(id) {
    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
    document.getElementById('btnBack').classList.toggle('show', id !== 'pageForm');
  }

  window.goBack = function() {
    if (document.getElementById('pageDaily').classList.contains('active')) {
      showPage('pageResult');
    } else if (document.getElementById('pageResult').classList.contains('active')) {
      showPage('pageForm');
    }
  };

  window.showResult = function() { showPage('pageResult'); };
  window.showDaily = function() { showPage('pageDaily'); renderDaily(); };
  window.resetPlan = function() {
    plan = null;
    showPage('pageForm');
    toast('已重置，请重新填写');
  };

  // ===== Plan Generation =====
  window.generatePlan = function() {
    var name = document.getElementById('examName').value.trim();
    var days = parseInt(document.getElementById('totalDays').value) || 90;
    var hours = parseFloat(document.getElementById('dailyHours').value) || 4;
    if (!name) { toast('请输入考试名称'); return; }
    if (days < 7) { toast('备考周期至少7天'); return; }
    if (hours < 1) { toast('每日时长至少1小时'); return; }
    if (subjects.length === 0) { toast('请至少添加一门科目'); return; }

    // Ratios based on level (weak gets more time)
    var totalWeight = subjects.reduce(function(s, sub) { return s + (6 - sub.level); }, 0);
    var subRatios = subjects.map(function(sub) {
      return { name: sub.name, ratio: (6 - sub.level) / totalWeight, level: sub.level };
    });

    // Phase split
    var p1Days = Math.max(Math.round(days * 0.35), 3);
    var p3Days = Math.max(Math.round(days * 0.15), 2);
    var p2Days = days - p1Days - p3Days;

    var phases = [
      { name: '基础夯实', days: p1Days, desc: '系统梳理知识点，建立完整知识框架', color: 'p1',
        tasks: subRatios.map(function(s) { return s.name + '基础章节系统学习'; }) },
      { name: '强化刷题', days: p2Days, desc: '大量练习真题与模拟题，查漏补缺', color: 'p2',
        tasks: subRatios.map(function(s) { return s.name + '专项训练与真题演练'; }) },
      { name: '冲刺复盘', days: p3Days, desc: '回顾错题、模拟考试、调整状态', color: 'p3',
        tasks: ['全科错题回顾', '模拟考试演练', '重点公式/概念速记'] }
    ];

    // Generate daily tasks
    var dailyTasks = [];
    var dayCursor = 0;
    phases.forEach(function(phase, pi) {
      for (var d = 0; d < phase.days; d++) {
        var dayNum = dayCursor + d + 1;
        var tasks = [];
        var isQuiz = (d === phase.days - 1 && pi < 2) || (pi === 2 && d === Math.floor(phase.days / 2));

        // Allocate hours per subject
        subRatios.forEach(function(s, si) {
          var h = hours * s.ratio;
          if (pi === 0) {
            tasks.push({ subject: s.name, title: s.name + ' 基础学习 第' + (d + 1) + '节', hours: h, done: false });
          } else if (pi === 1) {
            tasks.push({ subject: s.name, title: s.name + ' 刷题训练 第' + (d + 1) + '组', hours: h, done: false });
          } else {
            tasks.push({ subject: s.name, title: s.name + ' 错题回顾与巩固', hours: h, done: false });
          }
        });

        if (isQuiz) {
          tasks.push({ subject: '自测', title: phase.name + ' 阶段自测', hours: 1, done: false, isQuiz: true });
        }

        dailyTasks.push({ day: dayNum, phase: pi, tasks: tasks, isQuiz: isQuiz });
      }
      dayCursor += phase.days;
    });

    plan = {
      examName: name,
      totalDays: days,
      dailyHours: hours,
      subjects: subRatios,
      phases: phases,
      daily: dailyTasks
    };

    renderResult();
    showPage('pageResult');
    toast('复习计划已生成！');
  };

  // ===== Render Result =====
  function renderResult() {
    if (!plan) return;
    document.getElementById('ovDays').textContent = plan.totalDays;
    document.getElementById('ovHours').textContent = plan.totalDays * plan.dailyHours;

    var doneCount = plan.daily.reduce(function(s, d) {
      return s + d.tasks.filter(function(t) { return t.done; }).length;
    }, 0);
    var totalCount = plan.daily.reduce(function(s, d) { return s + d.tasks.length; }, 0);
    var pct = totalCount > 0 ? Math.round(doneCount / totalCount * 100) : 0;
    document.getElementById('ovProgress').textContent = pct + '%';
    document.getElementById('totalProgress').style.width = pct + '%';

    var pContainer = document.getElementById('phaseList');
    pContainer.innerHTML = '';
    plan.phases.forEach(function(ph, i) {
      var el = document.createElement('div');
      el.className = 'phase-card';
      var start = plan.daily.filter(function(d) { return d.phase === i; })[0];
      var end = plan.daily.filter(function(d) { return d.phase === i; }).pop();
      var range = start && end ? '第' + start.day + '-' + end.day + '天' : '';
      el.innerHTML =
        '<div class="phase-header ' + ph.color + '">' +
          '<span class="name">' + (i + 1) + '. ' + ph.name + '</span>' +
          '<span class="range">' + ph.days + '天 · ' + range + '</span>' +
        '</div>' +
        '<div class="phase-body">' +
          '<div class="desc">' + ph.desc + '</div>' +
          '<div class="tasks">' + ph.tasks.map(function(t) { return '<span>' + t + '</span>'; }).join('') + '</div>' +
        '</div>';
      pContainer.appendChild(el);
    });

    var qContainer = document.getElementById('quizList');
    qContainer.innerHTML = '';
    plan.daily.filter(function(d) { return d.isQuiz; }).forEach(function(d) {
      var el = document.createElement('div');
      el.className = 'quiz-card';
      var phaseName = plan.phases[d.phase].name;
      el.innerHTML =
        '<div class="icon">📝</div>' +
        '<div class="text">' +
          '<strong>第' + d.day + '天 · ' + phaseName + '自测</strong>' +
          '<span>完成该阶段学习后进行模拟测试，检测掌握程度</span>' +
        '</div>';
      qContainer.appendChild(el);
    });
  }

  // ===== Render Daily =====
  function renderDaily() {
    if (!plan) return;
    var tabs = document.getElementById('phaseTabs');
    tabs.innerHTML = '';
    plan.phases.forEach(function(ph, i) {
      var btn = document.createElement('button');
      btn.className = 'tab-btn' + (i === currentPhase ? ' active' : '');
      var doneInPhase = plan.daily.filter(function(d) { return d.phase === i; }).reduce(function(s, d) {
        return s + d.tasks.filter(function(t) { return t.done; }).length;
      }, 0);
      var totalInPhase = plan.daily.filter(function(d) { return d.phase === i; }).reduce(function(s, d) {
        return s + d.tasks.length;
      }, 0);
      btn.innerHTML = ph.name + '<span class="badge">' + doneInPhase + '/' + totalInPhase + '</span>';
      btn.onclick = function() { currentPhase = i; currentDay = 0; renderDaily(); };
      tabs.appendChild(btn);
    });

    var daysInPhase = plan.daily.filter(function(d) { return d.phase === currentPhase; });
    document.getElementById('dailyDateInfo').textContent =
      '共' + daysInPhase.length + '天 · 第' + (currentDay + 1) + '天';

    var list = document.getElementById('dailyList');
    list.innerHTML = '';

    if (daysInPhase.length === 0) { list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>该阶段暂无任务</p></div>'; return; }

    var dayData = daysInPhase[currentDay];
    if (!dayData) { currentDay = 0; dayData = daysInPhase[0]; }

    // Day navigator
    var nav = document.createElement('div');
    nav.style.display = 'flex';
    nav.style.justifyContent = 'space-between';
    nav.style.alignItems = 'center';
    nav.style.marginBottom = '12px';
    var prevBtn = document.createElement('button');
    prevBtn.textContent = '◀ 上一天';
    prevBtn.style.cssText = 'background:none;border:none;color:var(--primary-dark);font-size:13px;cursor:pointer;padding:6px 10px;border-radius:6px;';
    prevBtn.onclick = function() { if (currentDay > 0) { currentDay--; renderDaily(); } };
    prevBtn.style.visibility = currentDay > 0 ? 'visible' : 'hidden';
    var nextBtn = document.createElement('button');
    nextBtn.textContent = '下一天 ▶';
    nextBtn.style.cssText = 'background:none;border:none;color:var(--primary-dark);font-size:13px;cursor:pointer;padding:6px 10px;border-radius:6px;';
    nextBtn.onclick = function() { if (currentDay < daysInPhase.length - 1) { currentDay++; renderDaily(); } };
    nextBtn.style.visibility = currentDay < daysInPhase.length - 1 ? 'visible' : 'hidden';
    var center = document.createElement('span');
    center.textContent = '第 ' + dayData.day + ' 天';
    center.style.fontWeight = '600';
    center.style.fontSize = '15px';
    nav.appendChild(prevBtn);
    nav.appendChild(center);
    nav.appendChild(nextBtn);
    list.appendChild(nav);

    if (dayData.isQuiz) {
      var quizBanner = document.createElement('div');
      quizBanner.className = 'quiz-card';
      quizBanner.innerHTML = '<div class="icon">📝</div><div class="text"><strong>今日安排：阶段自测</strong><span>建议用完整时间进行模拟考试，检验学习成果</span></div>';
      list.appendChild(quizBanner);
    }

    dayData.tasks.forEach(function(task, ti) {
      var item = document.createElement('div');
      item.className = 'task-item';
      var check = document.createElement('div');
      check.className = 'task-check' + (task.done ? ' done' : '');
      check.onclick = function() {
        task.done = !task.done;
        renderDaily();
        renderResult();
      };
      var info = document.createElement('div');
      info.className = 'task-info';
      var title = document.createElement('div');
      title.className = 'title' + (task.done ? ' done' : '');
      title.textContent = task.title;
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = '预计用时 ' + task.hours.toFixed(1) + ' 小时';
      info.appendChild(title);
      info.appendChild(meta);
      var tag = document.createElement('span');
      tag.className = 'task-tag' + (task.isQuiz ? ' quiz' : '');
      tag.textContent = task.isQuiz ? '自测' : task.subject;
      item.appendChild(check);
      item.appendChild(info);
      item.appendChild(tag);
      list.appendChild(item);
    });
  }
})();
</script>
</body>
</html>
