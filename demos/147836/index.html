<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>十万八千问 - 少儿科普问答智能体</title>
<style>
  /* ===== 基础重置与变量 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --c-bg: #FDF6E3;
    --c-card: #FFF8E7;
    --c-primary: #B85C38;
    --c-primary-dark: #8B3A1A;
    --c-gold: #D4A843;
    --c-gold-light: #E8C869;
    --c-text: #4A3728;
    --c-text-light: #8B7355;
    --c-user-bubble: #B85C38;
    --c-ai-bubble: #FFF8E7;
    --c-border: #E8D5B5;
    --c-shadow: rgba(139, 90, 43, 0.12);
    --c-toast-bg: rgba(74, 55, 40, 0.92);
    --c-nav-bg: #FFF8E7;
    --c-nav-border: #E8D5B5;
    --font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  }
  html, body {
    height: 100%;
    font-family: var(--font-family);
    background: var(--c-bg);
    color: var(--c-text);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    height: 100%;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    position: relative;
    background: var(--c-bg);
    display: flex;
    flex-direction: column;
  }
  /* 隐藏滚动条但保留滚动功能 */
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* ===== 启动页 ===== */
  #splash-screen {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #1a0a00;
    z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #splash-screen.hidden {
    opacity: 0; visibility: hidden; pointer-events: none;
  }
  .splash-stars {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 2s infinite ease-in-out alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.3; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1.2); }
  }
  /* 悟空剪影 - 用纯CSS绘制 */
  .wukong-silhouette {
    width: 160px; height: 200px;
    position: relative;
    margin-bottom: 30px;
  }
  .wukong-head {
    width: 80px; height: 80px;
    background: #D4A843;
    border-radius: 50%;
    position: absolute; top: 0; left: 40px;
    box-shadow: 0 0 30px rgba(212, 168, 67, 0.4);
  }
  .wukong-head::before {
    content: '';
    position: absolute; top: -15px; left: 20px;
    width: 40px; height: 30px;
    background: #B85C38;
    border-radius: 50% 50% 0 0;
    transform: rotate(-10deg);
  }
  .wukong-head::after {
    content: '';
    position: absolute; top: -10px; left: 45px;
    width: 35px; height: 25px;
    background: #B85C38;
    border-radius: 50% 50% 0 0;
    transform: rotate(15deg);
  }
  .wukong-face {
    position: absolute; top: 25px; left: 55px;
    width: 50px; height: 40px;
    background: #F5D0A9;
    border-radius: 50%;
  }
  .wukong-eye {
    position: absolute; top: 10px; width: 8px; height: 8px;
    background: #4A3728; border-radius: 50%;
  }
  .wukong-eye.left { left: 12px; }
  .wukong-eye.right { right: 12px; }
  .wukong-body {
    width: 100px; height: 80px;
    background: #B85C38;
    border-radius: 40px 40px 20px 20px;
    position: absolute; bottom: 20px; left: 30px;
  }
  .wukong-staff {
    position: absolute; bottom: 0; right: 10px;
    width: 6px; height: 140px;
    background: #D4A843;
    border-radius: 3px;
    transform: rotate(15deg);
  }
  .wukong-cloud {
    position: absolute; bottom: -10px; left: 10px;
    width: 140px; height: 40px;
    background: rgba(255,255,255,0.15);
    border-radius: 50px;
  }
  .wukong-cloud::before {
    content: '';
    position: absolute; top: -20px; left: 30px;
    width: 80px; height: 40px;
    background: rgba(255,255,255,0.12);
    border-radius: 50px;
  }
  .splash-title {
    font-size: 36px; font-weight: 800;
    color: #D4A843;
    letter-spacing: 6px;
    text-shadow: 0 2px 20px rgba(212, 168, 67, 0.3);
    margin-bottom: 12px;
  }
  .splash-slogan {
    font-size: 16px; color: #C9A96E;
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.8;
  }
  .splash-loading {
    margin-top: 40px;
    width: 120px; height: 3px;
    background: rgba(212, 168, 67, 0.2);
    border-radius: 2px;
    overflow: hidden;
  }
  .splash-loading-bar {
    height: 100%; width: 0%;
    background: #D4A843;
    border-radius: 2px;
    animation: loadingBar 2s ease-in-out forwards;
  }
  @keyframes loadingBar {
    0% { width: 0%; }
    100% { width: 100%; }
  }

  /* ===== 顶部栏 ===== */
  .header {
    padding: 14px 16px 10px;
    background: var(--c-card);
    border-bottom: 1px solid var(--c-border);
    position: relative;
    z-index: 100;
    flex-shrink: 0;
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .header-brand {
    display: flex; align-items: center; gap: 8px;
  }
  .brand-icon {
    width: 32px; height: 32px;
    background: var(--c-primary);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #fff;
    position: relative;
  }
  .brand-icon::after {
    content: '';
    position: absolute; top: -4px; left: 6px;
    width: 14px; height: 8px;
    background: #B85C38;
    border-radius: 50% 50% 0 0;
    transform: rotate(-15deg);
  }
  .brand-name {
    font-size: 18px; font-weight: 700;
    color: var(--c-primary-dark);
  }
  .header-slogan {
    font-size: 12px; color: var(--c-gold);
    letter-spacing: 1px;
  }
  .model-status {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--c-text-light);
    background: rgba(184, 92, 56, 0.08);
    padding: 4px 10px;
    border-radius: 12px;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #4CAF50;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ===== 对话区域 ===== */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    position: relative;
  }
  .chat-welcome {
    text-align: center; padding: 30px 20px;
  }
  .welcome-avatar {
    width: 80px; height: 80px;
    margin: 0 auto 16px;
    background: var(--c-primary);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    position: relative;
    box-shadow: 0 4px 16px var(--c-shadow);
  }
  .welcome-avatar::before {
    content: '';
    position: absolute; top: -8px; left: 20px;
    width: 30px; height: 14px;
    background: #B85C38;
    border-radius: 50% 50% 0 0;
    transform: rotate(-10deg);
  }
  .welcome-avatar::after {
    content: '';
    position: absolute; top: -5px; right: 18px;
    width: 26px; height: 12px;
    background: #B85C38;
    border-radius: 50% 50% 0 0;
    transform: rotate(10deg);
  }
  .welcome-title {
    font-size: 20px; font-weight: 700;
    color: var(--c-primary-dark);
    margin-bottom: 8px;
  }
  .welcome-desc {
    font-size: 14px; color: var(--c-text-light);
    line-height: 1.6;
  }
  .message {
    display: flex; margin-bottom: 16px;
    animation: msgAppear 0.3s ease-out;
  }
  @keyframes msgAppear {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user { justify-content: flex-end; }
  .message.ai { justify-content: flex-start; }
  .msg-bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.6;
    word-wrap: break-word;
    position: relative;
  }
  .msg-bubble.user {
    background: var(--c-user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(184, 92, 56, 0.25);
  }
  .msg-bubble.ai {
    background: var(--c-ai-bubble);
    color: var(--c-text);
    border: 1px solid var(--c-border);
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px var(--c-shadow);
  }
  .msg-source {
    font-size: 11px; color: #B0A090;
    margin-top: 6px; padding-left: 4px;
  }
  .msg-intro-tag {
    display: inline-block;
    background: var(--c-gold-light);
    color: var(--c-primary-dark);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .typing-indicator {
    display: flex; align-items: center; gap: 4px;
    padding: 12px 16px;
  }
  .typing-dot {
    width: 6px; height: 6px;
    background: var(--c-text-light);
    border-radius: 50%;
    animation: typingBounce 1.4s infinite ease-in-out both;
  }
  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }
  .thinking-text {
    font-size: 13px; color: var(--c-text-light);
    margin-left: 8px;
  }
  .timeout-toast {
    background: rgba(184, 92, 56, 0.95);
    color: #fff;
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 13px;
    text-align: center;
    margin: 8px 20px;
    animation: shake 0.5s ease-in-out;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* ===== 推荐问题 ===== */
  .suggestions {
    padding: 0 16px 12px;
    display: flex; flex-wrap: wrap; gap: 8px;
    flex-shrink: 0;
  }
  .suggestion-chip {
    background: #FFF;
    border: 1px solid var(--c-border);
    color: var(--c-primary);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 1px 4px var(--c-shadow);
  }
  .suggestion-chip:hover, .suggestion-chip:active {
    background: var(--c-primary);
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(184, 92, 56, 0.25);
  }

  /* ===== 输入区域 ===== */
  .input-area {
    padding: 10px 16px 16px;
    background: var(--c-card);
    border-top: 1px solid var(--c-border);
    flex-shrink: 0;
  }
  .input-wrapper {
    display: flex; align-items: center; gap: 10px;
    background: #FFF;
    border: 1px solid var(--c-border);
    border-radius: 24px;
    padding: 4px 4px 4px 16px;
    box-shadow: 0 1px 6px var(--c-shadow);
  }
  .input-wrapper input {
    flex: 1;
    border: none; outline: none;
    font-size: 15px; color: var(--c-text);
    background: transparent;
    padding: 8px 0;
    font-family: var(--font-family);
  }
  .input-wrapper input::placeholder {
    color: #B0A090;
  }
  .send-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--c-primary);
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .send-btn:hover {
    background: var(--c-primary-dark);
    transform: scale(1.05);
  }
  .send-btn:active { transform: scale(0.95); }
  .send-btn svg {
    width: 20px; height: 20px;
  }

  /* ===== 底部导航 ===== */
  .nav-bar {
    display: flex; justify-content: space-around;
    background: var(--c-nav-bg);
    border-top: 1px solid var(--c-nav-border);
    padding: 6px 0 10px;
    flex-shrink: 0;
    position: relative;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px;
    padding: 4px 8px;
    cursor: pointer;
    border-radius: 12px;
    transition: all 0.2s;
    position: relative;
  }
  .nav-item:hover, .nav-item:active {
    background: rgba(184, 92, 56, 0.08);
  }
  .nav-item.active .nav-icon {
    color: var(--c-primary);
  }
  .nav-item.active .nav-label {
    color: var(--c-primary);
  }
  .nav-icon {
    width: 26px; height: 26px;
    color: var(--c-text-light);
    transition: color 0.2s;
  }
  .nav-label {
    font-size: 11px; color: var(--c-text-light);
    transition: color 0.2s;
    white-space: nowrap;
  }
  /* 大圣府邸的子菜单 */
  .submenu-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 500;
    opacity: 0; visibility: hidden;
    transition: all 0.3s;
  }
  .submenu-overlay.show {
    opacity: 1; visibility: visible;
  }
  .submenu-panel {
    position: absolute; bottom: 70px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--c-card);
    border-radius: 16px;
    padding: 8px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
    display: flex; gap: 8px;
    opacity: 0; visibility: hidden;
    transition: all 0.3s;
    border: 1px solid var(--c-border);
    white-space: nowrap;
  }
  .submenu-overlay.show .submenu-panel {
    opacity: 1; visibility: visible;
    transform: translateX(-50%) translateY(0);
  }
  .submenu-btn {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px;
    padding: 10px 14px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    min-width: 60px;
  }
  .submenu-btn:hover {
    background: rgba(184, 92, 56, 0.1);
  }
  .submenu-btn-icon {
    width: 28px; height: 28px;
    color: var(--c-primary);
  }
  .submenu-btn-label {
    font-size: 11px; color: var(--c-text);
  }

  /* ===== Toast 提示 ===== */
  .toast-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .toast {
    background: var(--c-toast-bg);
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    max-width: 80%;
    text-align: center;
    animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2.2s forwards;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes toastOut {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to { opacity: 0; transform: translateY(-10px) scale(0.95); }
  }

  /* ===== 装饰元素 ===== */
  .cloud-decoration {
    position: absolute;
    opacity: 0.06;
    pointer-events: none;
  }
  .cloud-decoration svg {
    width: 100px; height: 50px;
    fill: var(--c-primary);
  }
  /* 祥云SVG */
  .xiangyun {
    position: absolute;
    opacity: 0.08;
    pointer-events: none;
  }
  .xiangyun svg {
    width: 80px; height: 40px;
    fill: none;
    stroke: var(--c-primary);
    stroke-width: 2;
  }

  /* ===== 响应式 ===== */
  @media (min-width: 768px) {
    #app {
      box-shadow: 0 0 40px rgba(139, 90, 43, 0.1);
      border-left: 1px solid var(--c-border);
      border-right: 1px solid var(--c-border);
    }
  }
</style>
</head>
<body>

<!-- ===== 启动页 ===== -->
<div id="splash-screen">
  <div class="splash-stars" id="splashStars"></div>
  <div class="wukong-silhouette">
    <div class="wukong-head">
      <div class="wukong-face">
        <div class="wukong-eye left"></div>
        <div class="wukong-eye right"></div>
      </div>
    </div>
    <div class="wukong-body"></div>
    <div class="wukong-staff"></div>
    <div class="wukong-cloud"></div>
  </div>
  <div class="splash-title">十万八千问</div>
  <div class="splash-slogan">
    行十万八千里路<br>阅十万八千卷书
  </div>
  <div class="splash-loading">
    <div class="splash-loading-bar"></div>
  </div>
</div>

<!-- ===== 主应用 ===== -->
<div id="app">
  <!-- 装饰祥云 -->
  <div class="xiangyun" style="top:80px;right:20px;">
    <svg viewBox="0 0 80 40"><path d="M5 30 Q20 10 40 25 Q55 10 70 30 Q60 35 40 32 Q20 38 5 30Z"/></svg>
  </div>
  <div class="xiangyun" style="top:200px;left:10px;transform:scaleX(-1);">
    <svg viewBox="0 0 80 40"><path d="M5 30 Q20 10 40 25 Q55 10 70 30 Q60 35 40 32 Q20 38 5 30Z"/></svg>
  </div>

  <!-- 顶部栏 -->
  <div class="header">
    <div class="header-top">
      <div class="header-brand">
        <div class="brand-icon">悟</div>
        <div>
          <div class="brand-name">十万八千问</div>
          <div class="header-slogan">行十万八千里路，阅十万八千卷书</div>
        </div>
      </div>
      <div class="model-status">
        <span class="status-dot"></span>
        <span>Hermes · 双模型就绪</span>
      </div>
    </div>
  </div>

  <!-- 对话区域 -->
  <div class="chat-area" id="chatArea">
    <div class="chat-welcome" id="chatWelcome">
      <div class="welcome-avatar">悟</div>
      <div class="welcome-title">你好呀，小朋友！</div>
      <div class="welcome-desc">
        我是悟空，一纵筋斗云十万八千里<br>
        有什么问题都可以问我哦~
      </div>
    </div>
  </div>

  <!-- 推荐问题 -->
  <div class="suggestions" id="suggestions">
    <div class="suggestion-chip" data-q="为什么天是蓝的">为什么天是蓝的</div>
    <div class="suggestion-chip" data-q="黑洞里面有什么">黑洞里面有什么</div>
    <div class="suggestion-chip" data-q="人为什么会做梦">人为什么会做梦</div>
  </div>

  <!-- 输入区域 -->
  <div class="input-area">
    <div class="input-wrapper">
      <input type="text" id="chatInput" placeholder="想问悟空什么问题呢？" autocomplete="off">
      <button class="send-btn" id="sendBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="nav-bar" id="navBar">
    <div class="nav-item active" data-nav="chat">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span class="nav-label">问答</span>
    </div>
    <div class="nav-item" data-nav="history" data-toast="历史问答记录，后续上线">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      <span class="nav-label">历史卷宗</span>
    </div>
    <div class="nav-item" data-nav="playground" data-toast="趣味闯关学知识，后续上线">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      <span class="nav-label">悟空乐园</span>
    </div>
    <div class="nav-item" data-nav="progress" data-toast="知识图谱与成长报告，后续上线">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span class="nav-label">学习情况</span>
    </div>
    <div class="nav-item" data-nav="home" id="navHome">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span class="nav-label">大圣府邸</span>

<!-- 大圣府邸子菜单遮罩 -->
<div class="submenu-overlay" id="submenuOverlay">
  <div class="submenu-panel" id="submenuPanel">
    <div class="submenu-btn" data-toast="家长控制中心，后续上线">
      <svg class="submenu-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <span class="submenu-btn-label">家长中心</span>
    </div>
    <div class="submenu-btn" data-toast="增值服务，后续上线">
      <svg class="submenu-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      <span class="submenu-btn-label">增值服务</span>
    </div>
    <div class="submenu-btn" data-toast="创作区域，后续上线">
      <svg class="submenu-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
        <path d="M2 2l7.586 7.586"></path>
        <circle cx="11" cy="11" r="2"></circle>
      </svg>
      <span class="submenu-btn-label">创作区域</span>
    </div>
    <div class="submenu-btn" data-toast="系统设置，后续上线">
      <svg class="submenu-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span class="submenu-btn-label">系统设置</span>
    </div>
  </div>
</div>

<script>
(function() {
  // ===== 数据 =====
  const AI_RESPONSES = {
    '为什么天是蓝的': {
      text: '太阳发出的光看起来是白色的，但其实是由红、橙、黄、绿、蓝、靛、紫七种颜色组成的。当阳光穿过地球大气层时，空气分子会让蓝光向四面八方散射开来，就像无数小镜子把蓝光反射到我们眼睛里。而其他颜色的光波长较长，不容易被散射，大部分直接穿透了大气。所以天空看起来就是蓝色的啦！',
      source: '中国数字科技馆 / 课标2022版'
    },
    '黑洞里面有什么': {
      text: '黑洞就像一个超级无敌大吸铁石，它的引力强大到连光都逃不出去！科学家们认为，黑洞中心有一个"奇点"，那里所有的物质都被压缩到一个无限小的点，密度超级大。不过呢，因为连光都出不来，我们至今还没法直接看到黑洞里面到底是什么。就像孙悟空的金箍棒被吸进去，连大圣也看不见里面有什么呢！',
      source: '中国数字科技馆 / 课标2022版'
    },
    '人为什么会做梦': {
      text: '我们睡觉时，大脑并没有完全休息哦！它还在忙着整理白天的记忆，就像图书管理员把看完的书放回书架。做梦就是大脑在整理信息时产生的"小电影"。有时候大脑会把不相关的记忆混在一起，所以梦里面会出现各种奇怪的事情，比如你在天上飞，或者和恐龙做朋友！',
      source: '中国数字科技馆 / 课标2022版'
    },
    'default': [
      {
        text: '这是个很有趣的问题！让我想想...悟空虽然神通广大，但这个问题我也得好好琢磨琢磨。你可以换个方式问问我，或者试试下面的推荐问题哦！',
        source: '中国数字科技馆 / 课标2022版'
      },
      {
        text: '哈哈，小朋友真会提问！这个问题涉及到很多知识呢。悟空我虽然一个筋斗云十万八千里，但这个问题我得去翻翻我的"十万八千问答对"才能给你最准确的答案！',
        source: '中国数字科技馆 / 课标2022版'
      },
      {
        text: '哇！这个问题连大圣我都觉得有意思！知识的世界就像我的筋斗云一样广阔无边。你想不想知道更多相关的知识呢？我可以继续给你讲哦！',
        source: '中国数字科技馆 / 课标2022版'
      },
      {
        text: '小朋友的好奇心就像火焰山的火一样旺盛！这个问题很棒，让我从我的知识宝库里找找答案... 你知道吗，学习就是这样，每一个问题都是打开新世界的大门！',
        source: '中国数字科技馆 / 课标2022版'
      }
    ]
  };

  const SELF_INTRO = '【自我介绍】我依托Hermes底座，拥有很好的记忆，能记住你的喜好和特点，由Llama3.2:1B以及DeepSeek-R1:1.5B提供推理算力；胸藏十万八千问答对储备，还可以联网检索资料；化身孙悟空，一纵筋斗云十万八千里，陪小朋友探索浩瀚宇宙与世间风光。';

  // ===== DOM 元素 =====
  const splash = document.getElementById('splash-screen');
  const chatArea = document.getElementById('chatArea');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const suggestions = document.getElementById('suggestions');
  const chatWelcome = document.getElementById('chatWelcome');
  const navBar = document.getElementById('navBar');
  const navHome = document.getElementById('navHome');
  const submenuOverlay = document.getElementById('submenuOverlay');

  // ===== 启动页星空 =====
  function createStars() {
    const container = document.getElementById('splashStars');
    for (let i = 0; i < 50; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 3 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.top = Math.random() * 100 + '%';
      star.style.left = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 2 + 's';
      container.appendChild(star);
    }
  }
  createStars();

  // 2秒后自动进入主界面
  setTimeout(() => {
    splash.classList.add('hidden');
  }, 2000);

  // ===== 添加消息 =====
  function addMessage(type, text, source) {
    if (chatWelcome) {
      chatWelcome.style.display = 'none';
    }

    const msgDiv = document.createElement('div');
    msgDiv.className = 'message ' + type;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble ' + type;

    if (type === 'ai' && text.includes('【自我介绍】')) {
      const tag = document.createElement('span');
      tag.className = 'msg-intro-tag';
      tag.textContent = '自我介绍';
      bubble.appendChild(tag);
      bubble.appendChild(document.createElement('br'));
      const cleanText = text.replace('【自我介绍】', '').trim();
      bubble.appendChild(document.createTextNode(cleanText));
    } else {
      bubble.textContent = text;
    }

    if (type === 'ai' && source) {
      const sourceDiv = document.createElement('div');
      sourceDiv.className = 'msg-source';
      sourceDiv.textContent = '来源：' + source;
      bubble.appendChild(sourceDiv);
    }

    msgDiv.appendChild(bubble);
    chatArea.appendChild(msgDiv);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  // ===== 添加输入中指示器 =====
  function addTypingIndicator() {
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message ai';
    msgDiv.id = 'typingIndicator';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble ai';

    const indicator = document.createElement('div');
    indicator.className = 'typing-indicator';
    indicator.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';

    const text = document.createElement('span');
    text.className = 'thinking-text';
    text.textContent = '思考中...';

    bubble.appendChild(indicator);
    bubble.appendChild(text);
    msgDiv.appendChild(bubble);
    chatArea.appendChild(msgDiv);
    chatArea.scrollTop = chatArea.scrollHeight;
    return msgDiv;
  }

  // ===== 移除输入中 =====
  function removeTypingIndicator() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  // ===== 添加超时提示 =====
  function addTimeoutToast() {
    const toast = document.createElement('div');
    toast.className = 'timeout-toast';
    toast.textContent = '回答超时，请简化问题后重试';
    chatArea.appendChild(toast);
    chatArea.scrollTop = chatArea.scrollHeight;
    setTimeout(() => toast.remove(), 4000);
  }

  // ===== 发送消息 =====
  let currentTimeout = null;
  let isProcessing = false;

  function sendMessage() {
    const text = chatInput.value.trim();
    if (!text || isProcessing) return;

    isProcessing = true;
    chatInput.value = '';

    // 添加用户消息
    addMessage('user', text);

    // 添加思考中
    addTypingIndicator();

    // 模拟AI回答延迟（1.5-3秒随机）
    const delay = 1500 + Math.random() * 1500;

    // 25秒超时保护
    if (currentTimeout) clearTimeout(currentTimeout);
    currentTimeout = setTimeout(() => {
      removeTypingIndicator();
      addTimeoutToast();
      isProcessing = false;
    }, 25000);

    setTimeout(() => {
      if (!isProcessing) return; // 已被超时处理
      clearTimeout(currentTimeout);
      removeTypingIndicator();

      let response, source;

      if (text.includes('你是谁')) {
        response = SELF_INTRO;
        source = 'Hermes Agent 框架 / 双模型驱动';
      } else if (AI_RESPONSES[text]) {
        response = AI_RESPONSES[text].text;
        source = AI_RESPONSES[text].source;
      } else {
        const defaults = AI_RESPONSES['default'];
        const pick = defaults[Math.floor(Math.random() * defaults.length)];
        response = pick.text;
        source = pick.source;
      }

      addMessage('ai', response, source);
      isProcessing = false;
    }, delay);
  }

  sendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // ===== 推荐问题点击 =====
  suggestions.querySelectorAll('.suggestion-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const q = chip.dataset.q;
      chatInput.value = q;
      sendMessage();
    });
  });

  // ===== Toast 提示 =====
  function showToast(msg) {
    const existing = document.querySelector('.toast-overlay');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.className = 'toast-overlay';
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    overlay.appendChild(toast);
    document.body.appendChild(overlay);
    setTimeout(() => overlay.remove(), 2600);
  }

  // ===== 底部导航 =====
  navBar.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      const nav = item.dataset.nav;
      const toast = item.dataset.toast;

      // 更新激活状态
      if (nav !== 'home') {
        navBar.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        item.classList.add('active');
      }

      if (nav === 'home') {
        // 大圣府邸 - 展开子菜单
        submenuOverlay.classList.add('show');
      } else if (toast) {
        showToast(toast);
      } else if (nav === 'chat') {
        // 回到问答，显示欢迎
        chatArea.scrollTop = 0;
      }
    });
  });

  // 子菜单关闭
  submenuOverlay.addEventListener('click', (e) => {
    if (e.target === submenuOverlay) {
      submenuOverlay.classList.remove('show');
    }
  });

  // 子菜单按钮点击
  submenuOverlay.querySelectorAll('.submenu-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const toast = btn.dataset.toast;
      if (toast) showToast(toast);
      submenuOverlay.classList.remove('show');
    });
  });

  // 点击大圣府邸图标再次关闭子菜单
  navHome.addEventListener('click', () => {
    if (submenuOverlay.classList.contains('show')) {
      submenuOverlay.classList.remove('show');
    }
  });

})();
</script>
</body>
</html>
