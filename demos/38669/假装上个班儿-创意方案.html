 items-start gap-4`,children:[(0,j.jsx)(`div`,{className:`w-12 h-12 rounded-xl bg-violet-500/8 border border-violet-500/15 flex items-center justify-center flex-shrink-0 group-hover:bg-violet-500/15 transition-colors`,children:(0,j.jsx)(pr,{size:22,className:`text-violet-400`})}),(0,j.jsxs)(`div`,{children:[(0,j.jsx)(`h3`,{className:`font-bold text-slate-100 mb-1.5 group-hover:text-violet-400 transition-colors text-lg`,children:`行业研究中心`}),(0,j.jsx)(`p`,{className:`text-sm text-slate-400 font-light leading-relaxed`,children:`组织架构图谱、岗位协作关系、业务痛点与数字化机会——ToB销售/顾问的必备工具。`})]})]})})]})]})]})}),(0,j.jsx)(`footer`,{className:`px-6 md:px-10 py-8 text-center border-t border-border-subtle`,children:(0,j.jsx)(`p`,{className:`text-sm text-slate-600 font-light`,children:`假装上个班儿 · TRAE AI 创造力大赛参赛作品`})})]})]})}var Hr=[{id:`pm`,title:`产品经理`,industry:`互联网/科技`,icon:`📋`,description:`连接用户需求与技术实现，定义产品方向和功能优先级，推动跨团队协作将想法变为现实。`,dailyTasks:[`收集和整理用户反馈，提炼需求`,`撰写PRD文档，设计产品方案`,`组织需求评审会议，与研发对齐方案`,`跟踪项目进度，协调各方资源`,`分析数据指标，迭代优化产品`],skills:[`需求分析`,`项目管理`,`数据驱动`,`跨部门沟通`,`原型设计`],painPoints:[`需求变更频繁，研发抵触情绪大`,`多方利益相关者需求冲突，难以平衡`,`项目排期紧张，经常需要砍需求`,`数据埋点不完善，决策缺乏依据`],orgPosition:`位于技术研发与业务运营之间，向上汇报给产品总监/VP，横向对接研发、设计、运营、市场团队。`,scenarios:[{id:`pm-s1`,title:`收到一条用户反馈`,type:`email`,context:`你刚入职一家电商平台担任产品经理，今天是上班第一天。打开邮箱，发现客服团队转发来一条高频用户反馈。`,messages:[{sender:`客服-小王`,avatar:`👤`,content:`产品同学你好，最近收到大量用户投诉：购物车结算页面在手机上加载很慢，有时候要等10秒以上，很多用户直接放弃下单了。这个月已经有200多条相关投诉，请尽快看看。`,time:`09:15`,type:`received`},{sender:`你的主管-张总`,avatar:`👔`,content:`看到客服转发的反馈了吗？这个问题确实严重，这周先出个初步方案，周五我们过一下。注意要拉上前端同学一起评估。`,time:`09:32`,type:`received`}],decisionPoint:{question:`面对这条反馈，你入职后的第一件事应该做什么？`,options:[{id:`pm-s1-a`,text:`直接去和前端开发沟通，让他们优化结算页面的加载速度`,score:30,feedback:`方向对了，但跳过了关键步骤。作为产品经理，在找开发之前，需要先量化问题、分析根因，才能给出明确的需求优先级。直接找开发说"优化一下"，开发大概率会反问"优化什么？具体指标是什么？"`},{id:`pm-s1-b`,text:`先自己体验一遍结算流程，同时拉取相关数据（页面加载时长、跳出率、转化漏斗），再约前端同学一起分析根因`,score:90,feedback:`非常棒！这是成熟产品经理的做法：先自己体验获得体感，再用数据量化问题严重程度，最后拉上技术同学一起分析根因。这样你带着数据和事实去沟通，开发会更容易接受。`},{id:`pm-s1-c`,text:`回复客服说已经收到，然后把这个需求记录到需求池里，等下次排期再处理`,score:40,feedback:`记录需求是对的，但这个问题的严重程度（200+投诉、直接影响转化率）决定了它不能等。作为产品经理需要判断优先级，影响核心业务指标的问题应该立即响应。`}]}},{id:`pm-s2`,title:`需求评审会议`,type:`meeting`,context:`周五的需求评审会上，你提出了结算页面优化的方案。前端开发负责人提出了质疑。`,messages:[{sender:`你`,avatar:`📋`,content:`结算页面优化方案：1. 图片懒加载 2. 接口合并减少请求次数 3. 增加骨架屏提升体验感知。预计可以提升加载速度60%，降低跳出率15%。`,time:`14:00`,type:`sent`},{sender:`前端负责人-李哥`,avatar:`💻`,content:`方案方向没问题，但图片懒加载涉及到商品详情接口的改造，这个工作量不小。而且下周我们还有两个需求要上线，排期上比较紧张。能不能先只做接口合并，其他的放到下个迭代？`,time:`14:05`,type:`received`},{sender:`运营负责人-陈姐`,avatar:`📊`,content:`等一下，下周是618大促预热周，结算页面的转化率直接影响GMV。如果这个问题不尽快解决，大促期间损失会更大。`,time:`14:08`,type:`received`}],decisionPoint:{question:`前端说排期紧张只能做一部分，运营说大促不能等。你如何决策？`,options:[{id:`pm-s2-a`,text:`同意前端方案，先做接口合并快速上线，图片懒加载放到大促之后`,score:70,feedback:`务实的折中方案。接口合并见效快、风险低，适合在大促前快速止血。但要注意：图片懒加载才是提升体验的关键，大促后必须立即跟进，否则问题会反复出现。建议在会上明确承诺大促后的排期。`},{id:`pm-s2-b`,text:`和前端一起重新评估工作量，看看能否通过加班或借调资源，在大促前完成全部优化`,score:85,feedback:`主动推动资源协调是产品经理的重要能力。不过要注意方式——不是简单地说"加加班"，而是帮助前端梳理优先级、砍掉或推迟低优先级需求，为大促让路。同时要认可前端的压力，给出合理的补偿方案。`},{id:`pm-s2-c`,text:`让运营先上，用运营手段（如优惠券）弥补体验问题，技术优化延后处理`,score:35,feedback:`运营手段可以短期弥补，但治标不治本。用户的核心痛点是页面加载慢，优惠券不能让页面变快。而且长期依赖运营补贴会形成路径依赖，不是可持续的解决方案。`}]}},{id:`pm-s3`,title:`竞品分析报告`,type:`document`,context:`入职第二周，主管让你做一份竞品分析报告，重点关注竞争对手最近上线的"一键下单"功能。`,messages:[{sender:`你的主管-张总`,avatar:`👔`,content:`竞品A上周上线了"一键下单"功能，用户反馈不错。你研究一下他们的实现方式，评估我们做的可行性和优先级，周三给我一份简要报告。`,time:`10:00`,type:`received`}],decisionPoint:{question:`你在竞品分析报告中，最应该关注哪个维度？`,options:[{id:`pm-s3-a`,text:`重点关注竞品"一键下单"的交互设计和视觉细节，看看我们能不能做得更好看`,score:30,feedback:`交互设计值得参考，但不是竞品分析的核心。作为产品经理，竞品分析应该从"用户价值"和"商业价值"出发，而不是停留在UI层面。好看不等于好用，更不等于值得做。`},{id:`pm-s3-b`,text:`从用户场景出发：分析竞品解决的是什么痛点、覆盖了哪些使用场景、对转化率/客单价等核心指标的影响，再评估我们做这个功能的技术成本和预期收益`,score:95,feedback:`满分思路！竞品分析的核心不是"别人做了什么"，而是"别人为什么做、效果如何、我们该不该做"。从用户场景和业务指标出发，结合自身的技术成本和预期收益做判断，这才是产品经理该有的分析框架。`},{id:`pm-s3-c`,text:`把竞品的所有功能都列出来，做一个功能对比表，看看我们缺了哪些功能`,score:40,feedback:`功能对比表是竞品分析的基础工作，但不是目的。单纯的功能罗列容易陷入"人有我也要有"的陷阱。产品经理需要判断哪些功能对用户有价值、对业务有帮助，而不是盲目追赶竞品。`}]}}]},{id:`ops`,title:`运营专员`,industry:`互联网/科技`,icon:`📊`,description:`通过内容策划、活动运营和数据分析，驱动用户增长和活跃，是连接产品与用户的关键桥梁。`,dailyTasks:[`策划和执行线上运营活动`,`撰写和发布内容（推文、短视频、活动页）`,`监控核心数据指标（DAU、转化率、留存率）`,`分析用户行为数据，优化运营策略`,`跨部门协调设计、开发资源`],skills:[`数据分析`,`内容策划`,`活动运营`,`用户洞察`,`项目管理`],painPoints:[`活动效果难以预测，经常"翻车"`,`跨部门沟通成本高，设计资源永远不够`,`数据口径不统一，和产品/技术对不上`,`KPI压力大，短期增长和长期价值难以平衡`],orgPosition:`位于市场/增长团队，向上汇报给运营总监，横向对接产品、设计、技术、市场团队。`,scenarios:[{id:`ops-s1`,title:`策划一场拉新活动`,type:`email`,context:`你刚入职一家社交App担任运营专员，主管给了你第一个任务：策划一场拉新活动，目标是在两周内带来5000个新用户。`,messages:[{sender:`你的主管-刘姐`,avatar:`👔`,content:`我们App最近DAU增长放缓，需要做一波拉新。预算5000元，时间两周，目标5000新用户。你先出一个活动方案，明天下午我们过一下。注意要考虑裂变传播的效果。`,time:`09:00`,type:`received`}],decisionPoint:{question:`5000元预算、两周时间、5000新用户。你的活动方案核心思路是什么？`,options:[{id:`ops-s1-a`,text:`做一个"邀请好友各得10元红包"的活动，利用金钱激励驱动用户主动分享拉新`,score:65,feedback:`裂变红包是常见的拉新手段，见效快。但要注意：纯金钱激励带来的用户质量通常不高，留存率低。而且5000元预算如果每人10元，只能覆盖500人，需要设计好梯度奖励和领取门槛来控制成本。`},{id:`ops-s1-b`,text:`结合产品特色设计一个有趣的互动H5（如"测测你的社交人格"），用户分享后可看结果，同时设置邀请排行榜`,score:85,feedback:`很好的思路！社交类产品适合做有趣的内容驱动传播。H5测试类内容天然具有分享属性，用户不是因为钱才分享，而是因为内容有趣。再加上排行榜的社交竞争机制，传播效果通常不错。成本可控，用户质量也更高。`},{id:`ops-s1-c`,text:`花钱在抖音和信息流投放广告，直接买量`,score:45,feedback:`买量是最直接的方式，但5000元预算在信息流广告中能带来的量非常有限（CPA通常在10-30元），很难达到5000新用户的目标。而且买量用户留存率通常低于自然传播用户。预算有限时，更应该考虑低成本裂变方案。`}]}},{id:`ops-s2`,title:`活动数据复盘`,type:`document`,context:`拉新活动上线一周后，你拿到了第一批数据。结果和预期有较大差距。`,messages:[{sender:`数据看板`,avatar:`📈`,content:`活动第7天数据：
- 活动页面UV：12,000
- 参与人数：3,200
- 分享人数：480（分享率15%）
- 通过分享带来的新用户：720
- 新用户次日留存：18%
- 活动总花费：3,200元

目标完成度：14.4%（720/5000）`,time:`自动生成`,type:`received`},{sender:`你的主管-刘姐`,avatar:`👔`,content:`数据看了吗？分享率偏低，新用户留存也不理想。分析一下原因，看看有没有优化的空间，下午3点开会讨论。`,time:`11:30`,type:`received`}],decisionPoint:{question:`分享率只有15%，留存只有18%。你认为最可能的原因和优化方向是什么？`,options:[{id:`ops-s2-a`,text:`分享率低可能是分享入口不够明显，优化方向：加大分享按钮、增加分享引导弹窗；留存低可能是新用户引导不够，优化方向：增加新人任务和引导流程`,score:80,feedback:`分析到位！分享率和留存率是两个独立的问题，需要分别优化。分享率方面，除了UI层面的优化，还要考虑分享内容本身是否有吸引力——用户愿不愿意把分享卡片发到朋友圈。留存方面，新用户引导确实是关键，但也要检查产品核心功能是否能留住用户。`},{id:`ops-s2-b`,text:`数据不好说明活动本身有问题，应该立即停掉活动，重新策划一个新活动`,score:35,feedback:`操之过急了。活动上线一周就放弃，既浪费了已投入的资源，也失去了优化迭代的机会。运营工作需要数据驱动的迭代思维——先分析问题出在哪里，针对性优化，再评估效果。大多数成功的活动都是经过多轮迭代才跑出来的。`},{id:`ops-s2-c`,text:`应该加大投放预算，买更多流量进来，基数大了数据自然会好看`,score:25,feedback:`这是典型的"用预算掩盖问题"的做法。在分享率和留存率没有优化之前，加大投放只会带来更多低质量用户，拉低整体数据。先修漏水的桶，再往里倒水。`}]}},{id:`ops-s3`,title:`跨部门资源协调`,type:`chat`,context:`活动优化方案需要设计同学做新的分享卡片和落地页，但设计团队说排期满了。`,messages:[{sender:`设计负责人-小美`,avatar:`🎨`,content:`不好意思啊，这周设计组都在忙618大促的素材，实在排不开。你们的活动需求最早也要下周三才能开始做。`,time:`15:20`,type:`received`},{sender:`你的主管-刘姐`,avatar:`👔`,content:`设计那边怎么说？活动优化不能再拖了，每拖一天就少拉一批用户。`,time:`15:25`,type:`received`}],decisionPoint:{question:`设计排不开，但活动优化很紧急。你怎么处理？`,options:[{id:`ops-s3-a`,text:`找主管出面给设计团队施压，要求优先处理你的需求`,score:30,feedback:`让领导施压是下策。虽然可能短期解决问题，但会破坏和其他团队的关系，长期来看得不偿失。作为运营，跨部门协调的核心是"换位思考+提供价值"，而不是"搬救兵"。`},{id:`ops-s3-b`,text:`先了解设计团队618的具体排期，看看有没有可以调整的空间；同时准备一套简化版方案（如用现成模板修改），降低设计工作量`,score:90,feedback:`非常成熟的做法！先理解对方的难处，再寻找双赢的解决方案。准备简化版方案体现了"不给别人添麻烦"的意识，同时也能保证活动优化不中断。如果设计同学觉得简化版可行，既省了他们的时间，也解决了你的问题。`},{id:`ops-s3-c`,text:`自己用Canva/稿定设计等工具做，不依赖设计团队`,score:55,feedback:`自己动手的精神值得肯定，但要注意两点：一是运营产出的设计质量可能不达标，影响活动效果；二是长期来看，运营应该聚焦在策略和数据分析上，而不是陷入设计执行。可以作为应急方案，但不建议作为常规做法。`}]}}]},{id:`dev`,title:`开发工程师`,industry:`互联网/科技`,icon:`💻`,description:`将产品需求转化为可运行的代码，构建和维护技术系统，是数字产品的核心建设者。`,dailyTasks:[`参与需求评审，评估技术方案和工作量`,`编写代码实现产品功能`,`编写单元测试和集成测试`,`Code Review，确保代码质量`,`排查和修复线上Bug`,`优化系统性能和架构`],skills:[`编程能力`,`系统设计`,`问题排查`,`代码质量意识`,`协作沟通`],painPoints:[`需求频繁变更，代码反复修改`,`线上出Bug需要紧急修复，压力巨大`,`技术债务积累，重构时间永远不够`,`和产品经理的需求优先级经常冲突`],orgPosition:`位于技术研发团队，向上汇报给技术负责人/Tech Lead，横向对接产品、设计、测试团队。`,scenarios:[{id:`dev-s1`,title:`需求评审中的技术质疑`,type:`meeting`,context:`你入职一家SaaS公司的前端开发团队。第一次需求评审会上，产品经理提出了一个新功能方案。`,messages:[{sender:`产品经理-小林`,avatar:`📋`,content:`这个迭代我们需要做一个"实时协作编辑"功能，类似飞书文档那种多人同时编辑的效果。用户反馈这个需求很强烈，希望两周内上线。`,time:`10:00`,type:`received`},{sender:`你的Tech Lead-王哥`,avatar:`👨‍💻`,content:`（看了你一眼）实时协作编辑涉及到CRDT/OT算法、WebSocket长连接、冲突处理等，两周时间非常紧张。你怎么看？`,time:`10:05`,type:`received`}],decisionPoint:{question:`产品要求两周内上线"实时协作编辑"功能，但技术复杂度很高。你如何回应？`,options:[{id:`dev-s1-a`,text:`直接说做不了，两周时间根本不够`,score:35,feedback:`诚实但不够专业。单纯说"做不了"会让产品觉得开发在推事。作为开发工程师，更好的做法是：分析技术方案、拆解工作量、给出可行的替代方案或分阶段实施计划。用技术事实说话，而不是情绪。`},{id:`dev-s1-b`,text:`先分析技术方案，拆解出MVP版本：第一版只做"显示其他用户光标位置"和"编辑冲突提示"，不做完整的CRDT，用乐观锁+轮询的方式降低复杂度，两周可以交付MVP`,score:95,feedback:`非常专业的回应！面对不合理的排期，不是简单拒绝，而是给出技术上的降级方案。MVP思维是开发工程师的核心能力——用最小的技术成本交付核心价值，复杂功能放到后续迭代。这样既满足了产品的上线时间要求，又保证了技术方案的合理性。`},{id:`dev-s1-c`,text:`说可以做，先接下需求，后面再慢慢磨`,score:20,feedback:`这是开发工程师最忌讳的做法。接下不可能完成的承诺，最终要么加班赶工导致代码质量差、技术债高筑，要么到期交付不了失信于产品团队。诚实评估工作量、合理管理预期，才是职业化的表现。`}]}},{id:`dev-s2`,title:`线上Bug紧急修复`,type:`chat`,context:`周五下午5点，你正准备下班，突然收到告警：线上支付接口出现异常，部分用户支付失败。`,messages:[{sender:`告警机器人`,avatar:`🚨`,content:`【P0告警】支付接口错误率飙升至12%（正常<0.1%），影响范围：所有使用微信支付的用户。开始时间：17:03。`,time:`17:05`,type:`received`},{sender:`你的Tech Lead-王哥`,avatar:`👨‍💻`,content:`看到告警了吗？先查一下最近的代码发布记录，看看是不是今天下午的发布引入的问题。我马上拉个紧急会议。`,time:`17:06`,type:`received`},{sender:`产品经理-小林`,avatar:`📋`,content:`支付出问题了？！用户群里已经炸了，客服也在问。多久能修好？`,time:`17:08`,type:`received`}],decisionPoint:{question:`周五下班时间，P0级支付故障。你的第一反应和行动是什么？`,options:[{id:`dev-s2-a`,text:`先查看错误日志和监控面板，定位问题根因；同时检查今天下午的发布记录，看是否有关联变更；如果确认是发布引入的问题，准备回滚方案`,score:95,feedback:`教科书级的应急响应！P0故障处理的第一原则是"快速恢复服务"，而不是"找到根本原因"。你的思路完全正确：先定位（日志+监控）、再排查（发布记录）、最后准备恢复方案（回滚）。同时要注意及时同步进展给相关方。`},{id:`dev-s2-b`,text:`先回滚到上一个版本，恢复服务后再慢慢排查原因`,score:70,feedback:`回滚是最快的恢复手段，方向正确。但在回滚之前，最好先确认问题确实是由最近的发布引起的。如果不是发布导致的，回滚可能无法解决问题，反而浪费了排查时间。建议先快速查看日志确认方向，再决定是否回滚。`},{id:`dev-s2-c`,text:`先回复产品和客服说"在排查了"，然后慢慢看代码找问题`,score:25,feedback:`P0故障中每一分钟都在影响用户和公司收入。"慢慢看代码"是最不可取的做法。应该按照"定位-恢复-复盘"的流程快速行动，同时保持高频沟通让各方了解进展。`}]}},{id:`dev-s3`,title:`Code Review中的分歧`,type:`chat`,context:`你在Review一位同事的PR时，发现代码中有一个明显的性能问题，但同事不认同你的意见。`,messages:[{sender:`同事-小张`,avatar:`👨‍💻`,content:`（在PR评论区）这个循环用forEach就行了吧，为什么要改成for循环？性能差别微乎其微，代码可读性更重要。`,time:`14:30`,type:`received`},{sender:`你`,avatar:`💻`,content:`（你注意到这段代码在一个高频调用的接口中，数据量可能达到万级，forEach在大量数据下确实会有性能差异）`,time:`14:32`,type:`sent`}],decisionPoint:{question:`同事认为性能差异可以忽略，你坚持要改。如何处理这个Code Review分歧？`,options:[{id:`dev-s3-a`,text:`直接把他的代码改成for循环，强制通过Review`,score:30,feedback:`强制修改会伤害团队协作氛围。Code Review是技术讨论，不是权力游戏。即使你是对的，也应该通过沟通达成共识，而不是用"我是Reviewer我说了算"的方式。`},{id:`dev-s3-b`,text:`在评论区补充具体数据：说明这段代码的调用频率、预期数据量级、两种写法的性能差异（最好附上benchmark数据），让对方基于事实做判断`,score:90,feedback:`用数据说话是解决技术分歧的最佳方式。不是"我觉得应该改"，而是"在这个调用频率和数据量级下，性能差异是Xms，可能影响接口响应时间"。对方看到具体数据后，更容易理解你的concern并做出合理判断。`},{id:`dev-s3-c`,text:`算了，他说得也有道理，就按他的代码通过吧`,score:40,feedback:`如果你确实认为这是一个值得指出的问题，不应该轻易放弃。Code Review的价值就在于互相把关代码质量。但表达方式可以更温和——用数据支撑你的观点，而不是简单地说"我觉得不行"。`}]}}]},{id:`production-plan`,title:`生产计划员`,industry:`制造业`,icon:`🏭`,description:`负责制定生产排程、协调物料供应、跟踪订单交付，是制造车间运转的"中枢神经"。`,dailyTasks:[`根据销售订单制定生产排程`,`协调物料采购和库存管理`,`跟踪生产进度，处理异常`,`与销售、采购、车间三方对齐交付计划`,`编制生产日报和产能分析报告`],skills:[`排程优化`,`物料管理`,`跨部门协调`,`数据分析`,`应急处理`],painPoints:[`客户需求频繁变更，排产计划反复调整`,`物料到货延迟导致产线停工待料`,`销售承诺的交期和生产实际产能不匹配`,`多个系统数据不互通，需要手工汇总Excel`],orgPosition:`位于生产运营中心，向上汇报给生产经理/运营总监，横向对接销售、采购、仓储、车间主管。`,scenarios:[{id:`prod-s1`,title:`紧急插单冲突`,type:`email`,context:`你是一家汽车零部件工厂的生产计划员。周一早上，你刚排好本周的生产计划，就收到了两封紧急邮件。`,messages:[{sender:`销售经理-赵总`,avatar:`👔`,content:`有个大客户临时加了一个500件的紧急订单，要求周五前交付。这个客户占我们年营收的30%，不能丢。请尽快安排插单，优先级最高。`,time:`08:30`,type:`received`},{sender:`车间主管-老周`,avatar:`🔧`,content:`销售又插单？本周原计划生产A产品800件、B产品600件，产线已经排满了。如果插这个单，A产品要推迟到下周一，但A产品的客户合同约定的也是周五交付。你看着办吧。`,time:`09:15`,type:`received`}],decisionPoint:{question:`大客户的紧急插单和原有订单的交付承诺冲突，你怎么处理？`,options:[{id:`prod-s1-a`,text:`优先满足大客户，把A产品推迟到下周一，然后和客户沟通争取延期`,score:55,feedback:`大客户确实重要，但单方面推迟原有订单会损害其他客户的信任。更好的做法是先评估产能弹性——是否有加班、外协、或者调整B产品排期的空间，而不是简单地"谁大谁优先"。`},{id:`prod-s1-b`,text:`先和车间确认产能上限，计算加班/开夜班的可能性；同时评估外协加工的可行性和成本；最后和销售一起和客户沟通分批交付或微调交期`,score:95,feedback:`非常专业的处理！生产计划的核心不是"排一张表"，而是在约束条件下寻找最优解。先摸清产能边界（车间），再找弹性空间（加班/外协），最后和客户协商（销售），三方联动才能找到真正的最优方案。`},{id:`prod-s1-c`,text:`拒绝插单，告诉销售产能已满，让客户等下周`,score:25,feedback:`过于生硬。占年营收30%的大客户，直接拒绝可能会失去这个客户。生产计划员需要在"满足客户需求"和"保证生产秩序"之间找到平衡，而不是简单地二选一。`}]}},{id:`prod-s2`,title:`物料短缺预警`,type:`chat`,context:`周三下午，仓储系统发出预警：某关键原材料库存只剩2天用量，而下一批采购的物料预计5天后才能到。`,messages:[{sender:`仓储系统`,avatar:`📦`,content:`【库存预警】原材料X-202库存：120件，按当前消耗速度预计2天后耗尽。安全库存：200件。`,time:`14:00`,type:`received`},{sender:`采购专员-小李`,avatar:`📋`,content:`这批物料供应商说因为物流原因要延迟3天到货，最早下周一。我也没办法，已经催了好几次了。`,time:`14:10`,type:`received`},{sender:`车间主管-老周`,avatar:`🔧`,content:`原材料X-202是A产品的核心物料，没有它产线就要停。如果停工3天，本周的交付计划全泡汤。你得想办法。`,time:`14:15`,type:`received`}],decisionPoint:{question:`关键物料即将断供，采购无法提前到货。你的应对方案是什么？`,options:[{id:`prod-s2-a`,text:`立即联系其他供应商询价，哪怕价格高一点也要保证不断供；同时调整生产计划，把不依赖该物料的产品提前生产`,score:90,feedback:`教科书级的应急处理！多源采购是供应链风险管理的核心理念，临时找替代供应商虽然成本可能略高，但能保证交付。同时调整生产顺序，最大化利用现有库存，体现了生产计划的灵活性。`},{id:`prod-s2-b`,text:`把现有库存集中用于最重要的订单，其他订单和客户协商延期`,score:60,feedback:`集中资源保重点客户是务实的做法，但会让部分客户失望。作为备选方案可以，但不应该作为首选——在还有时间窗口的情况下，应该优先尝试找替代供应源，而不是直接放弃部分订单。`},{id:`prod-s2-c`,text:`让采购继续催供应商，同时安排车间周末加班，等物料一到立即赶工`,score:40,feedback:`被动等待不是好的策略。供应商已经明确说延迟3天，继续催促大概率不会有效果。把宝全押在供应商身上风险太高，应该同时启动备选方案（找替代供应商、调整生产计划）。`}]}},{id:`prod-s3`,title:`产能瓶颈分析`,type:`document`,context:`月底，总经理要求你提交一份产能分析报告，因为最近几个订单都出现了交付延迟的问题。`,messages:[{sender:`总经理`,avatar:`👨‍💼`,content:`最近3个月交付准时率从95%降到了78%，客户投诉增多。你分析一下产能瓶颈在哪里，是设备问题、人员问题还是排程问题？下周给我一份报告，同时给出改进建议。`,time:`10:00`,type:`received`}],decisionPoint:{question:`交付准时率下降，你的产能瓶颈分析应该从哪个维度切入？`,options:[{id:`prod-s3-a`,text:`主要分析设备利用率，看看是不是设备老化或故障导致产能不足，建议增加设备投资`,score:45,feedback:`设备利用率是产能分析的一个维度，但不是唯一维度。单纯归因于设备容易忽略其他更根本的问题——比如排程不合理导致设备闲置、换线时间过长、或者人员技能不匹配。产能瓶颈分析需要系统思维。`},{id:`prod-s3-b`,text:`从数据出发：分析近3个月的订单结构变化（小批量多品种是否增加）、各工序的实际工时vs标准工时、设备OEE、人员出勤率，找到真正的瓶颈工序`,score:95,feedback:`满分思路！产能瓶颈分析必须基于数据，而不是拍脑袋。订单结构变化（小批量多品种会增加换线时间）、各工序工时对比（找到瓶颈工序）、设备OEE（综合效率指标）、人员出勤率——这些维度结合起来才能定位真正的问题。`},{id:`prod-s3-c`,text:`问题主要是销售接单太激进，不考虑产能就承诺交期。建议加强销售和生产的信息同步`,score:50,feedback:`销售和生产的信息不同步确实是常见问题，但把问题全部推给销售不够客观。产能瓶颈分析应该先搞清楚"我们的产能到底有多少、瓶颈在哪里"，然后再讨论"销售承诺是否合理"。否则容易陷入互相甩锅。`}]}}]},{id:`quality-inspector`,title:`质量工程师`,industry:`制造业`,icon:`🔍`,description:`建立和维护质量管理体系，监控生产过程中的质量指标，处理客户投诉和不合格品，确保产品符合标准。`,dailyTasks:[`制定检验标准和作业指导书`,`巡检生产线，监控关键质量指标`,`处理不合格品，组织原因分析`,`回复客户质量投诉，编制8D报告`,`推动供应商质量改进`],skills:[`质量工具`,`数据分析`,`问题分析`,`标准制定`,`跨部门沟通`],painPoints:[`生产为了赶交期，经常绕过质量检验`,`客户投诉反复出现同样的问题`,`供应商来料质量不稳定`,`质量部门和生产部门的KPI冲突`],orgPosition:`位于质量管理部门，向上汇报给质量经理，横向对接生产、采购、技术、客户服务团队。`,scenarios:[{id:`qe-s1`,title:`产线绕过检验`,type:`chat`,context:`你正在车间巡检，发现一批产品没有完成全检就被打包准备发货了。`,messages:[{sender:`你`,avatar:`🔍`,content:`（拦住打包人员）这批货怎么没有检验标签？全检完成了吗？`,time:`10:00`,type:`sent`},{sender:`车间班长-老王`,avatar:`🔧`,content:`这批货客户催得急，下午就要装车发走。全检太花时间了，我们做了抽检，合格率100%，应该没问题。你就通融一下吧，不然交期赶不上了。`,time:`10:05`,type:`received`},{sender:`生产经理-马总`,avatar:`👨‍💼`,content:`（电话）小王啊，这批货是大客户要的，今天必须发出去。你那边能不能特批一下？出了事我担着。`,time:`10:10`,type:`received`}],decisionPoint:{question:`生产为了赶交期要求绕过全检，你如何处理？`,options:[{id:`qe-s1-a`,text:`坚持原则，这批货必须完成全检才能发货，和生产经理沟通是否可以延后发货或分批交付`,score:85,feedback:`坚持质量底线是对的，但要注意沟通方式。不是简单地说"不行"，而是给出替代方案：延后发货、分批交付、或者加派人手快速完成检验。让生产部门看到你在帮他们解决问题，而不是在卡他们。`},{id:`qe-s1-b`,text:`同意特批，但要求生产出具书面承诺，如果后续出现质量问题由生产部门承担责任`,score:40,feedback:`书面承诺看似保护了质量部门，但并不能真正降低质量风险。一旦这批货在客户端出现质量问题，损失的是公司声誉和客户信任，不是一纸承诺能挽回的。质量部门的职责是预防问题，而不是事后追责。`},{id:`qe-s1-c`,text:`和生产一起评估风险：如果只做关键项目检验（而非全检），能否在30分钟内完成？同时和客户沟通争取延后半天发货`,score:95,feedback:`非常成熟的处理方式！既不盲目坚持全检导致交期延误，也不完全放弃检验底线。通过风险评估找到折中方案（关键项目检验+沟通客户延后），同时推动建立"紧急放行流程"，避免类似情况反复出现。`}]}},{id:`qe-s2`,title:`客户投诉处理`,type:`email`,context:`你收到一封来自大客户的质量投诉邮件，称最近一批货有5%的产品尺寸超差。`,messages:[{sender:`客户质量经理-刘工`,avatar:`👤`,content:`贵司上月交付的批次中，我们抽检发现5%的产品关键尺寸超出公差范围。这已经是我们第三次反馈类似问题了。请立即提供原因分析和纠正措施报告（8D），并给出返工或换货方案。下次如果再出现，我们将考虑更换供应商。`,time:`09:00`,type:`received`},{sender:`你的主管-质量经理陈总`,avatar:`👔`,content:`这个客户不能丢，你牵头处理这件事。需要车间、技术配合的，我来协调。注意：8D报告要专业，客户很看重这个。`,time:`09:30`,type:`received`}],decisionPoint:{question:`大客户第三次投诉同类质量问题，你的处理优先级是什么？`,options:[{id:`qe-s2-a`,text:`先写一份详细的8D报告给客户，把原因分析、纠正措施、预防措施都写清楚，争取客户谅解`,score:50,feedback:`8D报告是必须的，但不应该作为第一步。在写报告之前，需要先内部调查确认问题的真实原因——是设备问题、人员操作问题、还是来料问题？如果原因分析不准确，8D报告就是纸上谈兵，客户也不会满意。`},{id:`qe-s2-b`,text:`立即组织内部调查：到车间追溯该批次的生产记录、检验记录、设备参数；同时封存同批次库存，暂停发货；找到根因后再写8D报告`,score:95,feedback:`正确的处理顺序！质量问题的处理流程应该是：遏制（暂停发货/封存库存）→ 调查（追溯记录、现场确认）→ 分析（找到根因）→ 报告（8D）。先调查再写报告，确保报告内容真实可信，而不是为了应付客户。`},{id:`qe-s2-c`,text:`先和客户沟通，承诺全额返工并承担运费，争取先把客户稳住，内部调查可以慢慢做`,score:35,feedback:`先稳住客户的心情可以理解，但"全额返工"的承诺可能成本很高，而且如果没有找到根因，问题还会再次发生。更专业的做法是：先内部快速调查确认问题范围，再和客户沟通具体的处理方案（返工/换货/让步接收）。`}]}},{id:`qe-s3`,title:`供应商质量改进`,type:`meeting`,context:`你负责的某关键原材料供应商，连续两批来料合格率低于90%，你需要推动供应商改进。`,messages:[{sender:`采购经理-孙姐`,avatar:`📋`,content:`这家供应商是我们合作了5年的老伙伴，价格很有竞争力。如果因为质量问题换供应商，新供应商的报价要高出15%。你看能不能帮他们改进，而不是直接换掉？`,time:`10:00`,type:`received`},{sender:`供应商质量经理-老陈`,avatar:`👨‍💼`,content:`（电话）我们最近确实有些波动，主要是新招的检验员培训不到位。我们会加强内部管理的，再给一次机会吧。`,time:`10:15`,type:`received`}],decisionPoint:{question:`供应商连续来料不合格，采购希望保留这家供应商。你如何推动改进？`,options:[{id:`qe-s3-a`,text:`给供应商发一份正式的质量整改通知，要求他们在两周内提交整改计划，否则暂停供货资格`,score:60,feedback:`正式通知是必要的，但单纯施压效果有限。供应商可能会敷衍了事，整改计划写得很漂亮但执行不到位。更好的做法是"施压+赋能"——不仅要求整改，还要帮助他们找到问题的根因和改进方法。`},{id:`qe-s3-b`,text:`安排现场审核，实地查看供应商的生产过程、检验流程、人员培训记录，找到问题的根因；然后和供应商一起制定改进计划，设定明确的里程碑和验收标准`,score:95,feedback:`非常专业的供应商质量管理做法！"到现场去"是质量工程师的核心工作方法——不到现场，你永远不知道问题真正出在哪里。和供应商一起制定改进计划（而不是单方面要求），设定可量化的里程碑，既能推动改进，又能维护合作关系。`},{id:`qe-s3-c`,text:`建议采购启动第二供应商开发，同时要求这家供应商提高来料检验标准，增加我们的进货检验频率`,score:55,feedback:`开发第二供应商是长期策略，但不能解决当前的问题。增加进货检验频率是把成本转嫁给己方，而且不能从根本上提升供应商的质量水平。核心应该是帮助供应商找到并解决根因，而不是用更多的检验来掩盖问题。`}]}}]},{id:`crossborder-ops`,title:`跨境电商运营`,industry:`电商/跨境电商`,icon:`🌐`,description:`负责海外电商平台的店铺运营、选品上架、广告投放和客户服务，连接中国制造与全球消费者。`,dailyTasks:[`选品分析，挖掘有潜力的产品`,`优化产品Listing（标题、图片、关键词）`,`管理广告投放，优化ACoS`,`处理客户评价和售后问题`,`监控库存，协调补货和物流`],skills:[`选品洞察`,`广告投放`,`Listing优化`,`数据分析`,`跨文化沟通`],painPoints:[`平台规则频繁变化，账号容易被封`,`广告成本越来越高，利润空间被压缩`,`汇率波动影响利润`,`海外仓库存积压，资金占用大`],orgPosition:`位于跨境电商运营团队，向上汇报给运营总监，横向对接采购、物流、客服、设计团队。`,scenarios:[{id:`cb-s1`,title:`Listing被下架`,type:`email`,context:`你负责的亚马逊店铺，最畅销的一款产品Listing突然被平台下架了。`,messages:[{sender:`亚马逊卖家中心`,avatar:`📧`,content:`【政策警告】您的Listing（ASIN: B08XXXX）因违反知识产权政策被下架。投诉方：XXX公司，投诉类型：商标侵权。请在7天内提交申诉材料，否则账户可能面临进一步限制。`,time:`08:00`,type:`received`},{sender:`你的主管-运营总监李总`,avatar:`👔`,content:`这个Listing月销3000单，是我们店铺的支柱产品。赶紧处理，不能让它一直下架。同时查一下其他Listing有没有类似风险。`,time:`08:30`,type:`received`}],decisionPoint:{question:`支柱产品Listing因侵权被下架，你的第一步行动是什么？`,options:[{id:`cb-s1-a`,text:`立即提交申诉，说明我们产品的差异化点，争取尽快恢复Listing`,score:40,feedback:`申诉是必要的，但在提交之前需要先确认：投诉是否成立？我们的产品是否真的侵权了？如果确实存在侵权，申诉大概率会被驳回，还可能激怒投诉方。先调查清楚再行动。`},{id:`cb-s1-b`,text:`先内部核查：检查产品图片、标题、关键词是否使用了对方的商标；同时让采购确认供应商的知识产权状况；如果确认不侵权，再准备申诉材料`,score:95,feedback:`非常专业的处理流程！跨境电商运营中，知识产权问题是红线。正确的处理顺序：内部核查（确认是否侵权）→ 评估风险（其他Listing是否也有类似问题）→ 准备申诉（如果不侵权）或协商和解（如果侵权）。盲目申诉可能让情况更糟。`},{id:`cb-s1-c`,text:`先上架一个相似的新Listing顶替，保证销量不中断，同时慢慢处理被下架的那个`,score:20,feedback:`这是亚马逊明确禁止的行为（创建重复Listing），一旦被发现，整个账户都可能被封禁。跨境电商运营必须遵守平台规则，任何试图"绕过"规则的做法都可能带来更大的损失。`}]}},{id:`cb-s2`,title:`广告ACoS飙升`,type:`document`,context:`你负责的店铺广告ACoS（广告成本占销售额比例）从20%飙升到了45%，利润被严重侵蚀。`,messages:[{sender:`广告数据看板`,avatar:`📈`,content:`本月广告数据：
- 广告花费：$12,000
- 广告销售额：$26,667
- ACoS：45%（目标<25%）
- 点击率：0.8%（上月1.2%）
- 转化率：5%（上月8%）

主要问题：大词竞争激烈，CPC从$1.5涨到$3.2`,time:`自动生成`,type:`received`},{sender:`你的主管-李总`,avatar:`👔`,content:`ACoS太高了，这个月基本没利润。分析一下原因，看看是关键词问题、竞价问题还是Listing问题。明天给我优化方案。`,time:`16:00`,type:`received`}],decisionPoint:{question:`广告ACoS从20%涨到45%，核心优化方向是什么？`,options:[{id:`cb-s2-a`,text:`直接降低所有广告的竞价，减少广告花费，先把ACoS降下来`,score:35,feedback:`简单粗暴地降竞价会导致广告展示量和点击量大幅下降，进而影响整体销量和排名。ACoS优化的核心不是"少花钱"，而是"花对钱"——找到高转化低竞争的关键词，优化投放策略。`},{id:`cb-s2-b`,text:`分析广告报告：找出高ACoS的关键词暂停或降低竞价；同时挖掘长尾关键词降低CPC；优化Listing提升转化率；测试不同的广告策略（自动 vs 手动，精准 vs 广泛）`,score:95,feedback:`系统性的优化思路！ACoS = 广告花费 / 广告销售额，优化要从分子和分母两个方向入手：降低花费（暂停低效关键词、挖掘低CPC长尾词）和提升销售额（优化Listing转化率、测试不同广告策略）。数据分析驱动的精细化运营才是正解。`},{id:`cb-s2-c`,text:`ACoS高是因为竞争对手恶意抬价，等旺季过了竞价自然会降下来，先忍一忍`,score:25,feedback:`被动等待是最差的选择。跨境电商市场竞争激烈，"忍一忍"意味着持续亏损。而且竞争对手不会因为旺季过了就停止投放。正确的做法是主动优化广告策略，提升自身竞争力。`}]}},{id:`cb-s3`,title:`海外仓库存决策`,type:`chat`,context:`黑五网一（BFCM）大促临近，你需要决定备货量。但去年大促后积压了大量库存，今年不敢多备。`,messages:[{sender:`物流经理-小张`,avatar:`🚚`,content:`海运到美国海外仓要45天，空运要7天但成本高3倍。黑五在11月底，现在走海运刚好赶上，但备货量你得尽快确定，我好订舱。`,time:`10:00`,type:`received`},{sender:`你的主管-李总`,avatar:`👔`,content:`去年黑五我们备了5000件，结果只卖了2800件，剩下2200件到现在还没清完，资金占用太严重了。今年你要谨慎一点，但也不能断货——断货对排名的影响比库存积压更致命。`,time:`10:15`,type:`received`}],decisionPoint:{question:`去年备货过多导致积压，今年黑五备货量如何决策？`,options:[{id:`cb-s3-a`,text:`保守备货，只备去年销量的80%，宁可断货也不积压`,score:45,feedback:`过于保守。断货会导致Listing排名大幅下降，恢复排名需要花费大量广告成本和时间。而且黑五是全年最大的流量窗口，错过这次机会成本很高。备货决策需要在"断货风险"和"积压风险"之间找到平衡。`},{id:`cb-s3-b`,text:`基于数据分析：参考去年同期销量、今年Q3增长趋势、竞品表现、广告预算投入，做销量预测；然后分批备货——第一批海运（主力），第二批空运（补充），根据第一批销售情况决定是否发第二批`,score:95,feedback:`非常专业的库存管理策略！分批备货+动态调整是应对需求不确定性的最佳实践。第一批海运覆盖基础需求，第二批空运作为弹性补充——这样既控制了库存风险，又保证了大促期间不断货。数据分析驱动的预测+灵活的供应链策略，这才是成熟的跨境电商运营。`},{id:`cb-s3-c`,text:`和去年一样备5000件，今年市场应该会更好，多备一点保险`,score:30,feedback:`没有数据支撑的直觉决策风险很大。市场环境每年都在变化，去年的数据不能简单套用到今年。而且去年已经积压了2200件，今年如果重蹈覆辙，资金压力会更大。备货决策必须基于数据分析和风险评估。`}]}}]},{id:`supply-chain`,title:`供应链专员`,industry:`电商/跨境电商`,icon:`📦`,description:`负责采购、物流、仓储的全链路协调，确保商品从工厂到消费者手中的高效流转，是电商履约的幕后操盘手。`,dailyTasks:[`管理供应商，谈判价格和交期`,`制定采购计划，平衡库存和资金`,`协调物流运输，跟踪在途货物`,`处理海外仓入库和库存盘点`,`优化供应链成本，提升履约效率`],skills:[`采购谈判`,`库存管理`,`物流协调`,`成本优化`,`风险管理`],painPoints:[`供应商交期不稳定，经常延迟`,`物流成本波动大，难以预估`,`多仓库存分散，调拨效率低`,`旺季爆仓，物流时效无法保障`],orgPosition:`位于供应链管理部门，向上汇报给供应链总监，横向对接采购、物流、仓储、运营、财务团队。`,scenarios:[{id:`sc-s1`,title:`供应商突然涨价`,type:`email`,context:`你负责的核心供应商突然发邮件通知涨价20%，而你的库存只够维持2周。`,messages:[{sender:`供应商-王总`,avatar:`🏭`,content:`由于原材料价格上涨和人工成本增加，从下个月起，所有产品单价上调20%。这是行业普遍情况，我们的竞争对手也已经涨价了。希望理解。`,time:`09:00`,type:`received`},{sender:`你的主管-供应链总监赵总`,avatar:`👔`,content:`20%的涨幅太大了，直接吃掉我们的利润。你评估一下：能不能谈判压到10%以内？如果谈不下来，开发替代供应商需要多久？库存只够2周，时间很紧。`,time:`09:30`,type:`received`}],decisionPoint:{question:`核心供应商突然涨价20%，库存只够2周。你的应对策略是什么？`,options:[{id:`sc-s1-a`,text:`立即启动紧急采购，在涨价前尽可能多下单囤货，争取时间开发替代供应商`,score:60,feedback:`紧急囤货可以争取时间，但如果涨价已经确定，供应商可能不愿意在涨价前大量接单。而且大量囤货会占用大量资金，增加库存风险。更好的做法是先谈判，同时启动备选方案。`},{id:`sc-s1-b`,text:`先和供应商谈判：了解涨价的具体原因，提出分阶段涨价方案（如先涨10%，半年后再涨10%）；同时启动替代供应商开发，评估切换成本和时间；最后和运营沟通是否调整售价`,score:95,feedback:`非常全面的供应链风险管理策略！谈判（争取缓冲期）、备选（开发替代供应商）、内部协调（运营调整售价）三线并行。分阶段涨价方案既照顾了供应商的成本压力，也给了自己调整的时间窗口。供应链的核心能力就是在不确定性中管理风险。`},{id:`sc-s1-c`,text:`直接接受涨价，把成本转嫁给消费者，提高产品售价`,score:35,feedback:`直接转嫁成本是最简单的做法，但会削弱产品竞争力。在跨境电商中，价格敏感度很高，涨价可能导致销量大幅下滑。应该先尝试谈判和寻找替代方案，把涨价作为最后的选择。`}]}},{id:`sc-s2`,title:`物流延误危机`,type:`chat`,context:`你的一批货已经在美国港口滞留了10天，清关出现问题，而黑五大促只剩2周。`,messages:[{sender:`货代-小李`,avatar:`🚢`,content:`抱歉通知您，您的货物在洛杉矶港被海关抽查，预计还需要5-7天才能放行。原因是申报的HS编码和实际产品有些出入。`,time:`10:00`,type:`received`},{sender:`运营经理-陈姐`,avatar:`📊`,content:`这批货是黑五的主力SKU，如果赶不上，我们整个大促计划都要泡汤。能不能想想办法？空运补货来得及吗？`,time:`10:15`,type:`received`}],decisionPoint:{question:`黑五主力货物被海关滞留，只剩2周时间。你的应急方案是什么？`,options:[{id:`sc-s2-a`,text:`立即安排空运补货，虽然成本高但能保证黑五不断货；同时找清关代理加速处理被滞留的货物`,score:90,feedback:`务实的应急方案！空运补货虽然成本高，但黑五的销量和排名价值远超运费差价。同时加速清关被滞留的货物，双管齐下。事后还要复盘：为什么会HS编码出错？是供应商提供的信息不准确，还是我们自己的申报流程有问题？`},{id:`sc-s2-b`,text:`和运营沟通调整黑五策略，把主推产品换成海外仓有库存的其他SKU，等这批货到了再做促销`,score:65,feedback:`调整策略是备选方案，但黑五的流量窗口一年只有一次，错过就是错过了。而且临时换主推SKU意味着运营需要重新准备Listing、广告、促销页面，时间非常紧张。在有条件空运补货的情况下，不应该轻易放弃原计划。`},{id:`sc-s2-c`,text:`继续等海关放行，同时每天催货代加快进度，相信5-7天内能解决`,score:25,feedback:`把希望全寄托在海关放行上风险太高。海关抽查的时间不确定，5-7天只是预估，实际可能更长。而且即使5-7天放行，货物还要从港口运到海外仓、入库、上架，整个过程可能再需要3-5天。被动等待可能错过黑五。`}]}},{id:`sc-s3`,title:`多仓库存调拨`,type:`document`,context:`年底盘点发现：美国东仓某SKU积压500件，而美国西仓同款SKU只剩50件，即将断货。`,messages:[{sender:`仓储系统`,avatar:`📦`,content:`库存预警：
- 美国东仓：SKU-A 库存500件（周转天数45天，积压）
- 美国西仓：SKU-A 库存50件（周转天数5天，即将断货）
- 建议：东仓向西仓调拨200件`,time:`自动生成`,type:`received`},{sender:`物流经理-小张`,avatar:`🚚`,content:`东仓到西仓的陆运调拨要5天，运费$2.5/件。如果西仓断货，从国内空运补货要3天，运费$8/件。你决定怎么操作？`,time:`10:00`,type:`received`}],decisionPoint:{question:`东仓积压、西仓即将断货，如何优化库存分布？`,options:[{id:`sc-s3-a`,text:`立即从东仓调拨200件到西仓，运费$2.5/件比空运补货便宜很多，而且5天内能到`,score:85,feedback:`合理的调拨决策！仓间调拨的成本（$2.5/件）远低于空运补货（$8/件），而且能把东仓的积压库存转化为西仓的可用库存。但调拨量需要精确计算：200件是否足够支撑到下次补货？调拨后东仓的库存是否还能满足当地需求？`},{id:`sc-s3-b`,text:`先分析两个仓库的销售数据：东仓为什么卖不动？西仓为什么卖得好？是不是定价、Listing或者广告投放的问题？解决根本问题比调拨更重要`,score:90,feedback:`非常有战略思维的回答！库存分布不均往往是表象，背后可能是运营策略的问题。东仓卖不动可能是因为广告投放不足、Listing优化不到位、或者定价不合理。找到根因并解决，才能从根本上避免类似问题反复发生。调拨是治标，优化运营是治本。`},{id:`sc-s3-c`,text:`东仓的货先不动，直接从国内空运补货到西仓，保证不断货。东仓的积压等过完年慢慢清`,score:40,feedback:`这是典型的"用高成本掩盖问题"的做法。明明可以用低成本的仓间调拨解决问题，却选择高成本的空运补货。而且东仓的积压不处理，会继续占用资金和仓储费。供应链优化的核心是"用最低成本满足需求"，而不是"有钱任性"。`}]}}]}],Ur=[{id:`tech`,name:`互联网/科技`,color:`blue`},{id:`manufacturing`,name:`制造业`,color:`amber`},{id:`ecommerce`,name:`电商/跨境电商`,color:`green`}];function Wr(){let e=vt(),[t,n]=(0,_.useState)(`全部`),r=t===`全部`?Hr:Hr.filter(e=>e.industry===t),i={"互联网/科技":{bg:`bg-sky-500/8`,text:`text-sky-400`,border:`border-sky-500/15`,glow:`hover:border-sky-500/30`,accent:`from-sky-500/20 to-sky-500/5`},制造业:{bg:`bg-amber-500/8`,text:`text-amber-400`,border:`border-amber-500/15`,glow:`hover:border-amber-500/30`,accent:`from-amber-500/20 to-amber-500/5`},"电商/跨境电商":{bg:`bg-emerald-500/8`,text:`text-emerald-400`,border:`border-emerald-500/15`,glow:`hover:border-emerald-500/30`,accent:`from-emerald-500/20 to-emerald-500/5`}};return(0,j.jsxs)(`div`,{className:`min-h-screen bg-bg-primary relative`,children:[(0,j.jsx)(`div`,{className:`fixed inset-0 bg-grid pointer-events-none opacity-40`}),(0,j.jsxs)(`div`,{className:`relative z-10`,children:[(0,j.jsxs)(`header`,{className:`px-6 md:px-10 py-5 flex items-center gap-4 max-w-7xl mx-auto w-full`,children:[(0,j.jsxs)(`button`,{onClick:()=>e(`/`),className:`flex items-center gap-2 text-slate-400 hover:text-sky-400 transition-colors curso 能增量。`,example:`这个Sprint团队计划完成用户注册模块的开发和测试，下周一进行Sprint Review。`,relatedTerms:[`tech-agile`,`tech-daily-standup`,`tech-requirement-review`]},{id:`tech-daily-standup`,term:`每日站会`,industry:`互联网/科技`,category:`项目管理`,definition:`敏捷团队每天进行的短会议（通常15分钟），每位成员依次回答三个问题：昨天做了什么、今天计划做什么、遇到什么障碍。目的是保持团队信息同步和快速暴露问题。`,example:`每天早上10点团队开15分钟站会，快速同步进度并识别需要协调的阻塞问题。`,relatedTerms:[`tech-sprint`,`tech-agile`]},{id:`tech-requirement-review`,term:`需求评审`,industry:`互联网/科技`,category:`项目管理`,definition:`产品经理向研发、设计、测试等团队讲解需求方案的会议。各方对需求的技术可行性、工作量、优先级进行讨论和确认。是需求进入开发前的关键对齐环节。`,example:`需求评审会上前端同学指出方案中缺少异常状态的处理逻辑，产品经理记录后补充到PRD中。`,relatedTerms:[`tech-prd`,`tech-sprint`,`tech-tech-debt`]},{id:`tech-tech-debt`,term:`技术债务`,industry:`互联网/科技`,category:`技术管理`,definition:`为了快速交付功能而采取的短期技术妥协（如不写测试、绕过规范、硬编码等），长期来看会增加维护成本和开发效率。类似于金融中的"债务"，需要在未来偿还。`,example:`为了赶上线日期跳过了单元测试，积累了大量技术债务，后续每次改代码都提心吊胆。`,relatedTerms:[`tech-code-review`,`tech-ci-cd`,`tech-refactor`]},{id:`tech-code-review`,term:`Code Review`,industry:`互联网/科技`,category:`技术管理`,definition:`代码审查，团队成员在合并代码前互相检查代码质量的过程。通过同行评审发现潜在Bug、确保代码风格一致、传播最佳实践。是保障代码质量的重要环节。`,example:`提交PR后需要至少两位同事完成Code Review才能合并到主分支。`,relatedTerms:[`tech-tech-debt`,`tech-ci-cd`,`tech-refactor`]},{id:`tech-ci-cd`,term:`CI/CD`,industry:`互联网/科技`,category:`技术管理`,definition:`Continuous Integration / Continuous Deployment，持续集成与持续部署。CI指代码提交后自动触发构建和测试，CD指测试通过后自动部署到生产环境。是现代DevOps实践的核心。`,example:`团队搭建了CI/CD流水线，代码合并后自动运行测试、构建镜像并部署到测试环境。`,relatedTerms:[`tech-code-review`,`tech-tech-debt`,`tech-devops`]},{id:`tech-devops`,term:`DevOps`,industry:`互联网/科技`,category:`技术管理`,definition:`Development与Operations的组合词，强调开发团队与运维团队的协作。通过自动化工具链（CI/CD、容器化、监控告警）缩短从代码提交到上线的周期，提升交付效率和质量。`,example:`公司推行DevOps文化，开发人员也要负责线上服务的监控和故障响应。`,relatedTerms:[`tech-ci-cd`,`tech-sla`]},{id:`tech-sla`,term:`SLA`,industry:`互联网/科技`,category:`技术管理`,definition:`Service Level Agreement，服务等级协议。服务提供商与客户之间关于服务质量（如可用性、响应时间）的正式承诺。常见指标如99.9%可用性（即全年停机不超过8.76小时）。`,example:`云服务商承诺99.95%的SLA，如果未达标将按比例赔偿服务 credits。`,relatedTerms:[`tech-devops`,`tech-p0`]},{id:`tech-p0`,term:`P0故障`,industry:`互联网/科技`,category:`技术管理`,definition:`最高优先级的线上故障，通常导致核心功能不可用或大面积影响用户。要求立即响应、快速恢复，一般需要在15-30分钟内开始处理，数小时内修复。会触发全员告警和应急响应流程。`,example:`支付接口报错率飙升至12%，触发P0告警，值班开发和运维立即开始排查和恢复。`,relatedTerms:[`tech-sla`,`tech-devops`,`tech-tech-debt`]},{id:`tech-dau`,term:`DAU`,industry:`互联网/科技`,category:`数据分析`,definition:`Daily Active Users，日活跃用户数。衡量产品每日活跃用户规模的指标，是互联网产品最核心的运营指标之一。与之相关的还有MAU（月活）、DAU/MAU比值反映用户粘性。`,example:`产品上线新功能后DAU从50万增长到65万，说明新功能有效提升了用户活跃度。`,relatedTerms:[`tech-retention`,`tech-conversion-rate`,`tech-arpu`]},{id:`tech-retention`,term:`留存率`,industry:`互联网/科技`,category:`数据分析`,definition:`用户在首次使用后，在特定时间周期内再次使用产品的比例。次日留存、7日留存、30日留存是最常见的指标。留存率是衡量产品能否持续吸引用户的关键指标。`,example:`新用户次日留存只有18%，远低于行业平均的35%，需要优化新用户引导流程。`,relatedTerms:[`tech-dau`,`tech-conversion-rate`,`tech-churn`]},{id:`tech-conversion-rate`,term:`转化率`,industry:`互联网/科技`,category:`数据分析`,definition:`用户完成某个目标动作的比例，如注册转化率、购买转化率、点击转化率。是衡量产品各环节效率的核心指标，常用于漏斗分析中定位流失环节。`,example:`购物车到支付的转化率从60%降到了40%，需要排查结算流程中是否存在体验问题。`,relatedTerms:[`tech-dau`,`tech-retention`,`tech-funnel`]},{id:`tech-funnel`,term:`漏斗分析`,industry:`互联网/科技`,category:`数据分析`,definition:`分析用户在产品中从进入到完成目标行为的逐步流失情况。将用户行为路径拆分为多个步骤，计算每一步的转化率，定位流失最严重的环节并针对性优化。`,example:`通过漏斗分析发现用户在填写收货地址环节流失率最高，优化地址自动填充功能后转化率提升了12%。`,relatedTerms:[`tech-conversion-rate`,`tech-retention`,`tech-dau`]},{id:`tech-refactor`,term:`重构`,industry:`互联网/科技`,category:`技术管理`,definition:`在不改变软件外部行为的前提下，改善代码内部结构和设计的过程。目的是降低代码复杂度、提升可维护性和可扩展性。重构是偿还技术债务的主要手段。`,example:`这个模块的代码耦合太严重了，需要花一个Sprint的时间做重构，降低后续维护成本。`,relatedTerms:[`tech-tech-debt`,`tech-code-review`]},{id:`tech-pivot`,term:`转型/Pivot`,industry:`互联网/科技`,category:`产品管理`,definition:`创业或产品发展过程中，在验证原有方向不可行后，对产品方向、目标市场或商业模式进行根本性调整。Pivot不是放弃，而是基于学习到的信息做出战略性转变。`,example:`原本做社交App的团队发现视频功能用户参与度更高，决定Pivot为短视频平台。`,relatedTerms:[`tech-mvp`,`tech-prd`]},{id:`tech-arpu`,term:`ARPU`,industry:`互联网/科技`,category:`数据分析`,definition:`Average Revenue Per User，每用户平均收入。衡量产品从每个活跃用户身上获得的收入水平，是评估商业模式健康度的核心财务指标。计算方式为总收入除以活跃用户数。`,example:`通过推出会员增值服务，产品ARPU从每月15元提升到了28元。`,relatedTerms:[`tech-dau`,`tech-conversion-rate`]},{id:`tech-churn`,term:`流失率`,industry:`互联网/科技`,category:`数据分析`,definition:`用户在特定周期内停止使用产品的比例，是留存率的反面指标。高流失率意味着产品无法留住用户，需要关注用户生命周期管理。SaaS行业月流失率超过5%通常被认为较高。`,example:`产品月流失率达到8%，意味着一年后只剩下约37%的用户，需要加强用户召回策略。`,relatedTerms:[`tech-retention`,`tech-dau`,`tech-arpu`]},{id:`mfg-bom`,term:`BOM`,industry:`制造业`,category:`生产管理`,definition:`Bill of Materials，物料清单。详细列出了制造一件产品所需的所有原材料、零部件、子组件及其数量的清单。是生产计划、采购和成本核算的基础文件。`,example:`新产品导入前，工艺工程师需要完成BOM编制，确保采购和生产部门清楚所需物料。`,relatedTerms:[`tech-mrp`,`mfg-mes`,`mfg-purchase-order`]},{id:`mfg-oee`,term:`OEE`,industry:`制造业`,category:`生产管理`,definition:`Overall Equipment Effectiveness，设备综合效率。衡量设备实际产出与理论最大产出的比率，由可用率、性能率和良品率三个指标相乘得出。是制造业评估设备利用效率的核心指标。`,example:`车间OEE从65%提升到80%，意味着在不增加设备的情况下产能提升了约23%。`,relatedTerms:[`mfg-mes`,`mfg-spc`,`mfg-capacity`]},{id:`mfg-mes`,term:`MES`,industry:`制造业`,category:`信息化管理`,definition:`Manufacturing Execution System，制造执行系统。连接上层ERP和底层设备的车间级信息化系统，实时采集生产数据、监控生产进度、管理质量追溯，实现生产过程的数字化管理。`,example:`工厂上线MES系统后，生产进度可以实时查看，不再需要车间统计员每天手工汇总报表。`,relatedTerms:[`mfg-bom`,`mfg-oee`,`tech-mrp`]},{id:`tech-mrp`,term:`MRP`,industry:`制造业`,category:`生产管理`,definition:`Material Requirements Planning，物料需求计划。根据主生产计划、BOM和库存数据，计算出所需物料的数量和采购时间，确保生产所需物料按时到位。是制造业生产计划的核心工具。`,example:`MRP系统运算后生成了未来4周的采购建议清单，采购部门据此安排供应商交货。`,relatedTerms:[`mfg-bom`,`mfg-mes`,`mfg-purchase-order`]},{id:`mfg-spc`,term:`SPC`,industry:`制造业`,category:`质量管理`,definition:`Statistical Process Control，统计过程控制。利用统计方法对生产过程进行实时监控，通过控制图判断过程是否处于受控状态。当数据点超出控制限或呈现异常趋势时，提示需要干预。`,example:`SPC控制图显示某工序的尺寸数据连续7个点呈上升趋势，质量工程师立即到现场排查原因。`,relatedTerms:[`mfg-oee`,`mfg-8d`,`mfg-six-sigma`]},{id:`mfg-8d`,term:`8D报告`,industry:`制造业`,category:`质量管理`,definition:`Eight Disciplines Report，八步法问题解决报告。一种结构化的问题分析和解决方法论，包含从组建团队、描述问题、临时遏制到根因分析、纠正措施和预防措施的完整流程。常用于客户投诉的正式回复。`,example:`客户投诉产品尺寸超差后，质量团队在一周内完成了8D报告，提交了根因分析和纠正措施。`,relatedTerms:[`mfg-spc`,`mfg-six-sigma`,`mfg-iqc`]},{id:`mfg-six-sigma`,term:`六西格玛`,industry:`制造业`,category:`质量管理`,definition:`一种以数据驱动、追求极低缺陷率的质量管理方法论。目标是将缺陷率控制在百万分之3.4以下（即6个标准差范围内）。核心工具包括DMAIC（定义-测量-分析-改进-控制）流程。`,example:`公司推行六西格玛项目，通过DMAIC方法将焊接工序的不良率从2%降到了0.05%。`,relatedTerms:[`mfg-spc`,`mfg-8d`]},{id:`mfg-iqc`,term:`IQC`,industry:`制造业`,category:`质量管理`,definition:`Incoming Quality Control，进料检验。对供应商送达的原材料和零部件进行质量检验，判断是否符合采购规格要求。是质量管理的第一道防线，防止不合格物料流入生产环节。`,example:`IQC检验发现这批来料的关键尺寸超出公差范围，整批退回供应商并要求整改。`,relatedTerms:[`mfg-8d`,`mfg-spc`,`mfg-ipqc`]},{id:`mfg-ipqc`,term:`IPQC`,industry:`制造业`,category:`质量管理`,definition:`In-Process Quality Control，制程检验。在生产过程中对半成品或工序间产品进行质量检查，及时发现生产过程中的异常并纠正。是防止批量不良品产生的关键环节。`,example:`IPQC巡检发现冲压工序的模具磨损导致产品毛刺增大，立即停线更换模具。`,relatedTerms:[`mfg-iqc`,`mfg-spc`,`mfg-oqc`]},{id:`mfg-oqc`,term:`OQC`,industry:`制造业`,category:`质量管理`,definition:`Outgoing Quality Control，出货检验。产品在包装发货前进行的最终质量检查，确保交付给客户的产品符合质量标准。通常采用AQL抽样标准进行检验。`,example:`OQC按AQL 0.65/1.5标准对出货批次进行抽样检验，合格后才能安排发货。`,relatedTerms:[`mfg-ipqc`,`mfg-iqc`]},{id:`mfg-purchase-order`,term:`采购订单`,industry:`制造业`,category:`供应链管理`,definition:`Purchase Order，企业向供应商发出的正式采购文件，明确记载采购物料的规格、数量、价格、交期和交付条件。是采购合同的法律文件，也是财务付款的依据。`,example:`采购专员根据MRP运算结果创建采购订单，确认供应商回复交期后跟踪到货情况。`,relatedTerms:[`tech-mrp`,`mfg-bom`,`mfg-lead-time`]},{id:`mfg-lead-time`,term:`交期/Lead Time`,industry:`制造业`,category:`供应链管理`,definition:`从下达订单到收到货物或完成服务的总时间。在制造业中通常包括供应商备料时间、生产时间和物流运输时间。交期管理是供应链计划的核心要素。`,example:`该关键件的供应商交期为45天，生产计划必须提前至少45天下达采购订单。`,relatedTerms:[`mfg-purchase-order`,`tech-mrp`,`mfg-safety-stock`]},{id:`mfg-safety-stock`,term:`安全库存`,industry:`制造业`,category:`供应链管理`,definition:`为应对需求波动和供应不确定性而额外持有的库存量。安全库存水平取决于需求预测精度、供应商交期稳定性和缺货成本。过高占用资金，过低则面临断供风险。`,example:`根据历史数据分析，将安全库存从200件调整到150件，在保证服务水平的同时减少了资金占用。`,relatedTerms:[`mfg-lead-time`,`tech-mrp`,`mfg-purchase-order`]},{id:`mfg-capacity`,term:`产能`,industry:`制造业`,category:`生产管理`,definition:`工厂或产线在一定时间内的最大产出能力。通常以件/天、吨/月等单位衡量。产能规划需要考虑设备能力、人员配置、工作时间和良品率等因素，是生产计划的基础。`,example:`经过分析发现C工序是产能瓶颈，增加一台设备后整线产能提升了30%。`,relatedTerms:[`mfg-oee`,`tech-mrp`,`mfg-bottleneck`]},{id:`mfg-bottleneck`,term:`瓶颈工序`,industry:`制造业`,category:`生产管理`,definition:`生产流程中产出速率最慢的工序，决定了整条产线的最大产出。根据TOC（约束理论），提升整体产能的关键是优化瓶颈工序的效率，而非改善非瓶颈环节。`,example:`通过工时分析发现热处理工序是瓶颈，单件耗时45分钟，远高于其他工序的10分钟。`,relatedTerms:[`mfg-capacity`,`mfg-oee`]},{id:`mfg-kanban`,term:`看板`,industry:`制造业`,category:`生产管理`,definition:`源自丰田生产方式的一种拉动式生产管理工具。通过可视化的卡片或电子信号，在上下游工序之间传递物料需求信息，实现按需生产、减少在制品库存。也是敏捷开发中任务管理的灵感来源。`,example:`车间引入电子看板系统后，各工序的物料需求一目了然，在制品库存降低了40%。`,relatedTerms:[`mfg-capacity`,`mfg-bottleneck`,`tech-agile`]},{id:`mfg-apqp`,term:`APQP`,industry:`制造业`,category:`质量管理`,definition:`Advanced Product Quality Planning，先期产品质量策划。汽车行业标准的产品开发质量管理流程，覆盖从概念设计到量产的全过程，确保新产品在量产前充分验证质量和产能。`,example:`新项目启动后，质量团队按照APQP流程制定了各阶段的交付物清单和评审节点。`,relatedTerms:[`mfg-8d`,`mfg-spc`,`mfg-bom`]},{id:`ecom-acos`,term:`ACoS`,industry:`电商/跨境电商`,category:`广告投放`,definition:`Advertising Cost of Sales，广告销售成本比。衡量广告投入效率的核心指标，计算方式为广告花费除以广告带来的销售额。ACoS越低说明广告效率越高，利润空间越大。`,example:`本月广告ACoS从25%降到18%，意味着每花100元广告费能带来556元销售额而非400元。`,relatedTerms:[`ecom-roas`,`ecom-cpc`,`ecom-ppc`]},{id:`ecom-roas`,term:`ROAS`,industry:`电商/跨境电商`,category:`广告投放`,definition:`Return on Ad Spend，广告支出回报率。衡量每投入1元广告费能带来多少收入，是ACoS的倒数。ROAS越高说明广告效果越好，通常ROAS大于4（即ACoS<25%）被认为是健康的。`,example:`大促期间ROAS达到6.5，说明每投入1元广告费能带来6.5元销售额，效果非常理想。`,relatedTerms:[`ecom-acos`,`ecom-cpc`,`ecom-ppc`]},{id:`ecom-cpc`,term:`CPC`,industry:`电商/跨境电商`,category:`广告投放`,definition:`Cost Per Click，每次点击成本。广告主为每次用户点击广告所支付的费用。CPC受关键词竞争度、广告质量得分和出价策略影响。跨境电商平台的大词CPC可能高达数美元。`,example:`核心关键词CPC从1.5美元涨到3.2美元，需要通过优化Listing质量得分来降低实际CPC。`,relatedTerms:[`ecom-acos`,`ecom-roas`,`ecom-ppc`]},{id:`ecom-ppc`,term:`PPC`,industry:`电商/跨境电商`,category:`广告投放`,definition:`Pay Per Click，按点击付费广告。广告主只在用户点击广告时付费，展示不收费。是电商平台（如亚马逊Sponsored Products）最主要的广告形式，分为自动广告和手动广告。`,example:`新品上架后先开自动广告跑数据，2周后根据搜索词报告优化手动广告的关键词。`,relatedTerms:[`ecom-acos`,`ecom-cpc`,`ecom-listing`]},{id:`ecom-listing`,term:`Listing`,industry:`电商/跨境电商`,category:`店铺运营`,definition:`电商平台上的产品详情页面，包含标题、图片、价格、描述、关键词等信息。Listing质量直接影响搜索排名和转化率，优化Listing是电商运营的基础工作。`,example:`运营同学花了一周优化Listing的主图和A+页面内容，转化率提升了20%。`,relatedTerms:[`ecom-ppc`,`ecom-seo`,`ecom-bsr`]},{id:`ecom-bsr`,term:`BSR`,industry:`电商/跨境电商`,category:`数据分析`,definition:`Best Sellers Rank，畅销榜排名。电商平台根据产品销量计算的实时排名，分为大类目和小类目。BSR是衡量产品市场表现的重要指标，排名越靠前说明销量越高。`,example:`产品BSR从大类目第500名提升到第120名，说明近期销量增长非常明显。`,relatedTerms:[`ecom-listing`,`ecom-ppc`,`ecom-fba`]},{id:`ecom-fba`,term:`FBA`,industry:`电商/跨境电商`,category:`物流管理`,definition:`Fulfillment by Amazon，亚马逊物流。卖家将库存发送到亚马逊仓库，由亚马逊负责存储、拣货、包装和配送。使用FBA的产品可获得Prime标志，享受更快的配送和更高的搜索权重。`,example:`产品转为FBA发货后，因为获得Prime标志，转化率提升了35%，排名也明显上升。`,relatedTerms:[`ecom-fbm`,`ecom-bsr`,`ecom-overseas-warehouse`]},{id:`ecom-fbm`,term:`FBM`,industry:`电商/跨境电商`,category:`物流管理`,definition:`Fulfillment by Merchant，卖家自发货。卖家自行管理库存和订单配送，不使用平台仓储服务。适合低销量产品或测试新品，但无法获得Prime标志，转化率通常低于FBA。`,example:`新品测试阶段先用FBM发货验证市场反应，确认有销量后再转为FBA。`,relatedTerms:[`ecom-fba`,`ecom-overseas-warehouse`]},{id:`ecom-overseas-warehouse`,term:`海外仓`,industry:`电商/跨境电商`,category:`物流管理`,definition:`在目标市场国家设立的仓储设施。卖家提前将货物运至海外仓，接到订单后从当地发货，大幅缩短配送时间。相比直邮，海外仓可提升用户体验，但需要承担库存风险和仓储成本。`,example:`在美国设立海外仓后，美西地区订单2天即可送达，客户好评率显著提升。`,relatedTerms:[`ecom-fba`,`ecom-fbm`,`ecom-dropshipping`]},{id:`ecom-seo`,term:`SEO`,industry:`电商/跨境电商`,category:`店铺运营`,definition:`Search Engine Optimization，搜索引擎优化。在电商场景中指通过优化产品标题、描述、后台关键词等，提升产品在平台搜索结果中的自然排名。良好的SEO能带来免费的精准流量。`,example:`通过分析竞品关键词并优化Listing的标题和Search Terms，自然搜索流量增长了50%。`,relatedTerms:[`ecom-listing`,`ecom-ppc`,`ecom-bsr`]},{id:`ecom-gmv`,term:`GMV`,industry:`电商/跨境电商`,category:`数据分析`,definition:`Gross Merchandise Volume，商品交易总额。一定时间内的订单总金额（通常包含未支付和已取消的订单）。GMV反映平台或店铺的整体交易规模，是电商行业最常用的规模指标。`,example:`今年双11店铺GMV突破500万元，同比增长120%，超额完成年度目标。`,relatedTerms:[`ecom-acos`,`ecom-bsr`,`ecom-conversion-rate`]},{id:`ecom-conversion-rate`,term:`转化率（电商）`,industry:`电商/跨境电商`,category:`数据分析`,definition:`访问产品页面的用户中完成购买的比例。电商转化率通常在2%-15%之间，受Listing质量、价格竞争力、评价数量和评分等因素影响。是衡量运营效率的核心指标。`,example:`优化产品主图和评价展示后，转化率从3.2%提升到5.8%，广告ROI显著改善。`,relatedTerms:[`ecom-gmv`,`ecom-listing`,`ecom-acos`]},{id:`ecom-dropshipping`,term:`一件代发/Dropshipping`,industry:`电商/跨境电商`,category:`供应链管理`,definition:`卖家接到订单后，由供应商直接代为发货给终端消费者的模式。卖家无需持有库存，降低了资金压力和库存风险，但对供应链控制力弱，利润空间也较薄。`,example:`初创卖家采用一件代发模式测试选品，确认某款产品月销稳定后再转为备货模式。`,relatedTerms:[`ecom-overseas-warehouse`,`ecom-fba`,`ecom-fbm`]},{id:`ecom-private-label`,term:`自有品牌/Private Label`,industry:`电商/跨境电商`,category:`店铺运营`,definition:`卖家在供应商的现有产品基础上，贴上自己的品牌商标进行销售。相比白牌产品，自有品牌可以建立品牌认知、提高产品溢价和客户忠诚度，是跨境电商进阶的主要方向。`,example:`从销售白牌产品转型做自有品牌后，产品溢价提升了40%，复购率也明显提高。`,relatedTerms:[`ecom-listing`,`ecom-seo`,`ecom-bsr`]},{id:`ecom-review`,term:`Review/评价管理`,industry:`电商/跨境电商`,category:`店铺运营`,definition:`用户购买产品后在平台上留下的评价和评分。评价数量和星级直接影响产品转化率和搜索排名。跨境电商中，合规获取评价（如通过Vine计划）是运营的重要工作。`,example:`通过亚马逊Vine计划获取了50条高质量评价，产品评分从3.8提升到4.5，转化率大幅提高。`,relatedTerms:[`ecom-listing`,`ecom-bsr`,`ecom-conversion-rate`]},{id:`ecom-sku`,term:`SKU`,industry:`电商/跨境电商`,category:`供应链管理`,definition:`Stock Keeping Unit，库存量单位。每个不同规格、颜色、尺寸的产品变体对应一个唯一的SKU编码。SKU管理是电商库存管理的基础，SKU数量直接影响库存管理的复杂度。`,example:`一款T恤有3种颜色和5种尺寸，共产生15个SKU，需要分别管理库存和定价。`,relatedTerms:[`ecom-overseas-warehouse`,`ecom-fba`,`ecom-dropshipping`]}],oi=[`全部`,`互联网/科技`,`制造业`,`电商/跨境电商`],si={"互联网/科技":`bg-sky-500/10 text-sky-400 border-sky-500/20`,制造业:`bg-amber-500/10 text-amber-400 border-amber-500/20`,"电商/跨境电商":`bg-emerald-500/10 text-emerald-400 border-emerald-500/20`},ci={产品管理:`bg-violet-500/10 text-violet-400 border-violet-500/20`,项目管理:`bg-indigo-500/10 text-indigo-400 border-indigo-500/20`,技术管理:`bg-sky-500/10 text-sky-400 border-sky-500/20`,数据分析:`bg-teal-500/10 text-teal-400 border-teal-500/20`,生产管理:`bg-orange-500/10 text-orange-400 border-orange-500/20`,质量管理:`bg-rose-500/10 text-rose-400 border-rose-500/20`,信息化管理:`bg-cyan-500/10 text-cyan-400 border-cyan-500/20`,供应链管理:`bg-lime-500/10 text-lime-400 border-lime-500/20`,广告投放:`bg-pink-500/10 text-pink-400 border-pink-500/20`,店铺运营:`bg-emerald-500/10 text-emerald-400 border-emerald-500/20`,物流管理:`bg-violet-500/10 text-violet-400 border-violet-50
