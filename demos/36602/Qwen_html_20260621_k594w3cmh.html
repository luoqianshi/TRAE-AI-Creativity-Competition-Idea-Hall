<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银发伴聊 - 老年人专属AI助手</title>
    <style>
        body {
            font-family: '微软雅黑', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            font-size: 20px; /* 适老化大字体 */
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background-color: #ff7e67;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }
        .chat-area {
            padding: 20px;
            height: 300px;
            overflow-y: auto;
            background-color: #e9ecef;
            border-bottom: 2px solid #ddd;
        }
        .message {
            margin-bottom: 15px;
            padding: 12px 18px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .ai-msg {
            background-color: #fff;
            border: 1px solid #ddd;
            float: left;
            clear: both;
        }
        .user-msg {
            background-color: #d1ecf1;
            float: right;
            clear: both;
            text-align: right;
        }
        .controls {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        button {
            font-size: 22px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-chat {
            background-color: #28a745;
            color: white;
        }
        .btn-scam {
            background-color: #dc3545;
            color: white;
        }
        .warning-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .warning-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 4px solid #dc3545;
            max-width: 90%;
        }
        .warning-content h2 {
            color: #dc3545;
            font-size: 32px;
            margin-top: 0;
        }
        .close-btn {
            background: #6c757d;
            color: white;
            margin-top: 20px;
        }
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">👴 银发伴聊 (SilverChat)</div>
    
    <div class="chat-area clearfix" id="chatArea">
        <div class="message ai-msg">您好！我是您的AI小助手。今天心情怎么样？有什么想跟我聊聊的吗？</div>
    </div>

    <div class="controls">
        <button class="btn-chat" onclick="addChat()">💬 跟我聊聊天 (带语音播报)</button>
        <button class="btn-scam" onclick="simulateScam()">⚠️ 模拟接到可疑推销电话</button>
    </div>
</div>

<!-- 防诈骗警告弹窗 -->
<div class="warning-modal" id="warningModal">
    <div class="warning-content">
        <h2>🚨 诈骗预警！</h2>
        <p style="font-size: 24px;">检测到对方提及“特效药”和“转账”！</p>
        <p style="font-size: 20px; color: #666;">请务必挂断电话，切勿转账！<br>需要我帮您联系子女或报警吗？</p>
        <button class="close-btn" onclick="closeWarning()">我知道了，马上挂断</button>
    </div>
</div>

<script>
    const chatArea = document.getElementById('chatArea');
    
    // 语音播报功能 (适老化体验)
    function speak(text) {
        if ('speechSynthesis' in window) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-CN';
            msg.rate = 0.9; // 语速稍慢，适合老人
            msg.pitch = 1;
            window.speechSynthesis.speak(msg);
        }
    }

    function addChat() {
        const userMsg = document.createElement('div');
        userMsg.className = 'message user-msg';
        userMsg.innerText = '今天一个人在家，感觉有点无聊。';
        chatArea.appendChild(userMsg);
        
        setTimeout(() => {
            const aiMsg = document.createElement('div');
            aiMsg.className = 'message ai-msg';
            const reply = '无聊的时候我们可以听听老歌，或者您给我讲讲您年轻时的故事吧！我一直都在陪着您。';
            aiMsg.innerText = reply;
            chatArea.appendChild(aiMsg);
            chatArea.scrollTop = chatArea.scrollHeight;
            speak(reply);
        }, 1000);
        
        chatArea.scrollTop = chatArea.scrollHeight;
        speak('今天一个人在家，感觉有点无聊。');
    }

    function simulateScam() {
        const userMsg = document.createElement('div');
        userMsg.className = 'message user-msg';
        userMsg.innerText = '喂？哪位？...什么？买十盒送十盒的神药？还要我提供验证码转账？';
        chatArea.appendChild(userMsg);
        chatArea.scrollTop = chatArea.scrollHeight;
        
        setTimeout(() => {
            document.getElementById('warningModal').style.display = 'flex';
            speak('警告！警告！检测到诈骗风险！千万不要转账！');
        }, 1500);
    }

    function closeWarning() {
        document.getElementById('warningModal').style.display = 'none';
        const aiMsg = document.createElement('div');
        aiMsg.className = 'message ai-msg';
        aiMsg.innerText = '您做得很对！遇到要钱、要验证码的电话，一律挂断。我已经把刚才的通话记录发送给您的儿子了，请放心。';
        chatArea.appendChild(aiMsg);
        chatArea.scrollTop = chatArea.scrollHeight;
        speak(aiMsg.innerText);
    }
</script>

</body>
</html>
