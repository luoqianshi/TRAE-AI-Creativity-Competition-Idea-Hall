<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiteLoom — 论文引用代际图谱可视化工具</title>
<style>
/* ========== Reset & Base ========== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg-primary: #0D1117;
  --bg-card: rgba(255,255,255,0.06);
  --color-accent: #58A6FF;
  --color-accent-hover: #79B8FF;
  --color-text: #E6EDF3;
  --color-text-muted: #8B949E;
  --radius: 8px;
  --transition: 0.2s ease;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-primary);
  color: var(--color-text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ========== Loading Overlay ========== */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-primary);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

.loading-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid rgba(255,255,255,0.1);
  border-top-color: var(--color-accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 20px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-text {
  color: var(--color-text-muted);
  font-size: 15px;
  letter-spacing: 0.5px;
}

/* ========== Navbar ========== */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: rgba(13,17,23,0.78);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  gap: 16px;
}

.navbar-left {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

.logo {
  font-size: 20px;
  font-weight: 700;
  color: var(--color-text);
  white-space: nowrap;
  user-select: none;
}

.navbar-center {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 560px;
  margin: 0 auto;
}

.search-input {
  flex: 1;
  height: 40px;
  padding: 0 16px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--radius);
  background: rgba(255,255,255,0.05);
  color: var(--color-text);
  font-size: 14px;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}

.search-input::placeholder {
  color: var(--color-text-muted);
}

.search-input:hover {
  border-color: rgba(255,255,255,0.2);
}

.search-input:focus {
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px rgba(88,166,255,0.15);
}

.btn-generate {
  height: 40px;
  padding: 0 22px;
  border: none;
  border-radius: var(--radius);
  background: var(--color-accent);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--transition), box-shadow var(--transition);
}

.btn-generate:hover {
  background: var(--color-accent-hover);
  box-shadow: 0 4px 14px rgba(88,166,255,0.3);
}

.btn-generate:active {
  transform: scale(0.97);
}

.navbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.btn-icon {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 14px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--radius);
  background: rgba(255,255,255,0.04);
  color: var(--color-text-muted);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--transition), color var(--transition), border-color var(--transition);
}

.btn-icon:hover {
  background: rgba(255,255,255,0.1);
  color: var(--color-text);
  border-color: rgba(255,255,255,0.2);
}

.btn-icon:active {
  transform: scale(0.97);
}

/* ========== Main Layout ========== */
.main-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding-top: 64px;
}

/* ========== Graph Container ========== */
.graph-section {
  flex: 0 0 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-primary);
  position: relative;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.graph-placeholder {
  text-align: center;
  color: var(--color-text-muted);
  user-select: none;
}

.graph-placeholder-icon {
  font-size: 56px;
  margin-bottom: 14px;
  opacity: 0.5;
}

.graph-placeholder-text {
  font-size: 15px;
  letter-spacing: 0.3px;
}

/* ========== Story Panel ========== */
.story-section {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 32px;
}

.story-panel {
  width: 100%;
  max-width: 860px;
  padding: 24px 30px;
  border-radius: 12px;
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.06);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.story-panel h3 {
  font-size: 16px;
  font-weight: 600;
  color: var(--color-accent);
  margin-bottom: 10px;
}

.story-panel p {
  font-size: 14px;
  line-height: 1.75;
  color: var(--color-text-muted);
}

/* ========== Detail Panel (Right Slide-out) ========== */
.detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.detail-overlay.visible {
  opacity: 1;
  visibility: visible;
}

.detail-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 320px;
  max-width: 90vw;
  height: 100vh;
  z-index: 201;
  background: #161B22;
  border-left: 1px solid rgba(255,255,255,0.08);
  padding: 24px;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.detail-panel.visible {
  transform: translateX(0);
}

.detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.detail-header h3 {
  font-size: 16px;
  font-weight: 600;
  color: var(--color-text);
}

.btn-close {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 6px;
  background: rgba(255,255,255,0.06);
  color: var(--color-text-muted);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--transition), color var(--transition);
}

.btn-close:hover {
  background: rgba(255,255,255,0.12);
  color: var(--color-text);
}

.detail-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.detail-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.detail-value {
  font-size: 14px;
  color: var(--color-text);
  line-height: 1.6;
}

.detail-placeholder {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--color-text-muted);
  font-size: 14px;
  text-align: center;
  gap: 10px;
  opacity: 0.6;
}

.detail-placeholder-icon {
  font-size: 40px;
  opacity: 0.5;
}

/* ========== Responsive ========== */
@media (max-width: 768px) {
  .navbar {
    padding: 10px 14px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .navbar-center {
    order: 3;
    flex-basis: 100%;
    max-width: 100%;
  }

  .detail-panel {
    width: 100vw;
    max-width: 100vw;
  }

  .graph-section {
    flex: 0 0 50vh;
  }

  .story-section {
    padding: 16px;
  }
}
/* ========== Graph Canvas ========== */
.graph-section canvas {
  display: block;
}

/* ========== Node Tooltip ========== */
.graph-tooltip {
  position: fixed;
  pointer-events: none;
  z-index: 300;
  padding: 10px 14px;
  background: #1C2333;
  color: #E6EDF3;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.6;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.1);
  opacity: 0;
  transition: opacity 0.15s ease;
  max-width: 280px;
}

.graph-tooltip.visible {
  opacity: 1;
}

.graph-tooltip .tt-title {
  font-weight: 600;
  margin-bottom: 4px;
  font-size: 14px;
}

.graph-tooltip .tt-meta {
  color: #8B949E;
  font-size: 12px;
}

/* ========== Detail Link ========== */
.detail-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
  color: var(--color-accent);
  text-decoration: none;
  font-size: 13px;
  transition: color var(--transition);
}

.detail-link:hover {
  color: var(--color-accent-hover);
  text-decoration: underline;
}

/* ========== Custom Scrollbar ========== */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #58A6FF;
  border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
  background: #79B8FF;
}

/* ========== Graph Fade Transition ========== */
.graph-section {
  transition: opacity 0.5s ease;
}

.graph-section.fading {
  opacity: 0;
}

/* ========== Toast Notification ========== */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 500;
  padding: 10px 22px;
  border-radius: 8px;
  background: #1C2333;
  color: #E6EDF3;
  font-size: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.1);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.toast.show {
  opacity: 1;
}

/* ========== Mobile: Bottom Panel ========== */
@media (max-width: 768px) {
  .detail-panel {
    top: auto;
    bottom: 0;
    width: 100vw;
    max-width: 100vw;
    height: 60vh;
    border-radius: 16px 16px 0 0;
    transform: translateY(100%);
    border-left: none;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  .detail-panel.visible {
    transform: translateY(0);
  }

  .graph-section {
    flex: 0 0 60vh;
  }
}
</style>
<script src="https://unpkg.com/d3@7"></script>
<script src="https://unpkg.com/force-graph"></script>
</head>
<body>

<!-- ========== Loading Overlay ========== -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">正在构建学术家谱…</div>
</div>

<!-- ========== Navbar ========== -->
<nav class="navbar">
  <div class="navbar-left">
    <span class="logo">🔬 CiteLoom</span>
  </div>
  <div class="navbar-center">
    <input
      type="text"
      class="search-input"
      placeholder="输入 arXiv ID，如 1706.03762"
      id="searchInput"
    />
    <button class="btn-generate" id="btnGenerate">生成图谱</button>
  </div>
  <div class="navbar-right">
    <button class="btn-icon" id="btnExportPNG">📷 导出PNG</button>
    <button class="btn-icon" id="btnCopyCite">📋 复制引用</button>
  </div>
</nav>

<!-- ========== Main Container ========== -->
<div class="main-container">
  <!-- Graph Section -->
  <section class="graph-section" id="graphSection">
    <div class="graph-placeholder">
      <div class="graph-placeholder-icon">🕸️</div>
      <p class="graph-placeholder-text">输入 arXiv ID 并点击"生成图谱"，开始可视化论文引用代际关系</p>
    </div>
  </section>

  <!-- Story Panel -->
  <section class="story-section">
    <div class="story-panel">
      <h3>📖 学术故事</h3>
      <p>在此处输入论文 arXiv ID 并生成图谱后，系统将自动分析引用代际关系，并为您生成一段描述该论文学术影响力的故事。图谱将展示论文之间的引用链路、关键节点以及研究脉络的演变。</p>
    </div>
  </section>
</div>

<!-- ========== Detail Panel Overlay ========== -->
<div class="detail-overlay" id="detailOverlay"></div>

<!-- ========== Node Tooltip ========== -->
<div class="graph-tooltip" id="graphTooltip">
  <div class="tt-title" id="ttTitle"></div>
  <div class="tt-meta" id="ttMeta"></div>
</div>

<!-- ========== Toast ========== -->
<div class="toast" id="toast"></div>

<!-- ========== Detail Panel (Slide from Right) ========== -->
<aside class="detail-panel" id="detailPanel">
  <div class="detail-header">
    <h3>📄 论文详情</h3>
    <button class="btn-close" id="btnCloseDetail">✕</button>
  </div>

  <div class="detail-placeholder" id="detailPlaceholder">
    <div class="detail-placeholder-icon">📋</div>
    <p>点击图谱中的节点查看论文详情</p>
  </div>

  <div id="detailContent" style="display:none; flex-direction: column; gap: 16px;">
    <div class="detail-field">
      <span class="detail-label">标题</span>
      <span class="detail-value" id="detailTitle" style="font-weight:600;">—</span>
    </div>
    <div class="detail-field">
      <span class="detail-label">作者</span>
      <span class="detail-value" id="detailAuthors">—</span>
    </div>
    <div class="detail-field">
      <span class="detail-label">年份</span>
      <span class="detail-value" id="detailYear">—</span>
    </div>
    <div class="detail-field">
      <span class="detail-label">被引次数</span>
      <span class="detail-value" id="detailCitations">—</span>
    </div>
    <div class="detail-field">
      <span class="detail-label">类型</span>
      <span class="detail-value" id="detailType">—</span>
    </div>
    <a class="detail-link" id="detailLink" href="#" target="_blank" rel="noopener">🔗 查看原文</a>
  </div>
</aside>

<script>
// ========== DOM 引用 ==========
var loadingOverlay = document.getElementById('loadingOverlay');
var searchInput = document.getElementById('searchInput');
var btnGenerate = document.getElementById('btnGenerate');
var btnExportPNG = document.getElementById('btnExportPNG');
var btnCopyCite = document.getElementById('btnCopyCite');
var graphSection = document.getElementById('graphSection');
var graphPlaceholder = document.querySelector('.graph-placeholder');
var graphTooltip = document.getElementById('graphTooltip');
var ttTitle = document.getElementById('ttTitle');
var ttMeta = document.getElementById('ttMeta');
var toastEl = document.getElementById('toast');
var detailPanel = document.getElementById('detailPanel');
var detailOverlayEl = document.getElementById('detailOverlay');
var btnCloseDetail = document.getElementById('btnCloseDetail');
var detailPlaceholder = document.getElementById('detailPlaceholder');
var detailContent = document.getElementById('detailContent');
var storyPanel = document.querySelector('.story-panel');
var storyTitle = storyPanel.querySelector('h3');
var storyText = storyPanel.querySelector('p');

// ========== 状态 ==========
var graphInstance = null;
var lastApiData = null;
var currentGraphData = null;
var hoveredNode = null;
var isTransitioning = false;

// ========== 性能优化：RAF 节流鼠标位置 ==========
var mouseX = 0;
var mouseY = 0;
var rafPending = false;
document.addEventListener('mousemove', function (e) {
  mouseX = e.clientX;
  mouseY = e.clientY;
  if (!rafPending) {
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;
    });
  }
});

// ========== Toast 通知 ==========
var toastTimer = null;
function showToast(msg, duration) {
  duration = duration || 2500;
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () {
    toastEl.classList.remove('show');
  }, duration);
}

// ========== Loading 控制 ==========
function showLoading() {
  loadingOverlay.classList.remove('hidden');
}

function hideLoading() {
  loadingOverlay.classList.add('hidden');
}

// ========== Detail Panel Toggle ==========
function openDetailPanel() {
  detailPanel.classList.add('visible');
  detailOverlayEl.classList.add('visible');
}

function closeDetailPanel() {
  detailPanel.classList.remove('visible');
  detailOverlayEl.classList.remove('visible');
}

btnCloseDetail.addEventListener('click', closeDetailPanel);
detailOverlayEl.addEventListener('click', closeDetailPanel);

// ========== 填充详情面板 ==========
function populateDetailPanel(node) {
  var typeMap = { seed: '种子论文', reference: '参考文献', citation: '引用论文' };

  detailPlaceholder.style.display = 'none';
  detailContent.style.display = 'flex';

  document.getElementById('detailTitle').textContent = node.fullTitle || '—';
  document.getElementById('detailAuthors').textContent = (node.authors || []).join('、') || '未知';
  document.getElementById('detailYear').textContent = node.year || '未知';
  document.getElementById('detailCitations').textContent = node.citationCount != null ? node.citationCount : '—';
  document.getElementById('detailType').textContent = typeMap[node.type] || '—';

  var paperId = node.id;
  var detailLink = document.getElementById('detailLink');
  if (paperId && paperId.indexOf('_') === -1) {
    detailLink.href = 'https://www.semanticscholar.org/paper/' + paperId;
    detailLink.style.display = '';
  } else {
    detailLink.style.display = 'none';
  }

  openDetailPanel();
}

// ========== 工具函数 ==========
function formatArxivId(rawId) {
  var trimmed = rawId.trim();
  if (!trimmed) return null;
  if (/^\d+\.\d+$/.test(trimmed) || /^\d+$/.test(trimmed)) {
    return 'ARXIV:' + trimmed;
  }
  if (/^ARXIV:/i.test(trimmed)) {
    return trimmed.toUpperCase();
  }
  return trimmed;
}

function truncateTitle(title, maxLen) {
  maxLen = maxLen || 15;
  if (!title) return '';
  return title.length > maxLen ? title.slice(0, maxLen) + '…' : title;
}

function extractAuthorNames(authors) {
  if (!authors || !authors.length) return [];
  return authors.map(function (a) { return a.name; });
}

function sanitizeFilename(name) {
  return name.replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);
}

// ========== 数据转换：API 数据 → force-graph 格式 ==========
function transformToGraphData(apiData) {
  var nodes = [];
  var links = [];
  var nodeMap = {};

  var seedTitle = apiData.title || 'Unknown';
  var seedId = apiData.paperId || 'seed_' + seedTitle;

  nodes.push({
    id: seedId,
    label: truncateTitle(seedTitle) + ' (' + (apiData.year || '?') + ')',
    fullTitle: seedTitle,
    year: apiData.year || null,
    citationCount: apiData.citationCount || 0,
    authors: extractAuthorNames(apiData.authors),
    type: 'seed'
  });
  nodeMap[seedId] = true;

  if (apiData.references && apiData.references.length) {
    apiData.references.forEach(function (ref) {
      var refTitle = ref.title || 'Unknown';
      var refId = ref.paperId || 'ref_' + refTitle;
      if (!nodeMap[refId]) {
        nodes.push({
          id: refId,
          label: truncateTitle(refTitle) + ' (' + (ref.year || '?') + ')',
          fullTitle: refTitle,
          year: ref.year || null,
          citationCount: ref.citationCount || 0,
          authors: extractAuthorNames(ref.authors),
          type: 'reference'
        });
        nodeMap[refId] = true;
      }
      links.push({
        source: refId,
        target: seedId,
        value: ref.citationCount || 1
      });
    });
  }

  if (apiData.citations && apiData.citations.length) {
    apiData.citations.forEach(function (cit) {
      var citTitle = cit.title || 'Unknown';
      var citId = cit.paperId || 'cit_' + citTitle;
      if (!nodeMap[citId]) {
        nodes.push({
          id: citId,
          label: truncateTitle(citTitle) + ' (' + (cit.year || '?') + ')',
          fullTitle: citTitle,
          year: cit.year || null,
          citationCount: cit.citationCount || 0,
          authors: extractAuthorNames(cit.authors),
          type: 'citation'
        });
        nodeMap[citId] = true;
      }
      links.push({
        source: seedId,
        target: citId,
        value: cit.citationCount || 1
      });
    });
  }

  console.log('🔀 数据转换完成: ' + nodes.length + ' 个节点, ' + links.length + ' 条连线');
  return { nodes: nodes, links: links };
}

// ========== 学术故事生成 ==========
function generateStory(apiData) {
  var seedTitle = apiData.title || '未知论文';
  var seedYear = apiData.year || '未知年份';
  var refs = apiData.references || [];
  var cits = apiData.citations || [];
  var refCount = refs.length;
  var citCount = cits.length;

  var refPart;
  if (refCount > 0) {
    var sortedRefs = refs.slice().sort(function (a, b) { return (a.year || 0) - (b.year || 0); });
    var earliest = sortedRefs[0];
    var latest = sortedRefs[sortedRefs.length - 1];
    refPart = '《' + seedTitle + '》（' + seedYear + '）引用了 ' + refCount + ' 篇奠基性工作，其中最早的是《' + (earliest.title || 'Unknown') + '》（' + (earliest.year || '?') + '），最新的是《' + (latest.title || 'Unknown') + '》（' + (latest.year || '?') + '）。';
  } else {
    refPart = '《' + seedTitle + '》（' + seedYear + '）的参考文献暂无数据。';
  }

  var citPart;
  if (citCount > 0) {
    citPart = '它已被 ' + citCount + ' 篇后续研究引用。';
  } else {
    citPart = '它的后续引用暂无数据。';
  }

  return refPart + citPart;
}

// ========== 图谱渲染 ==========
function renderGraph(graphData) {
  if (graphPlaceholder) {
    graphPlaceholder.style.display = 'none';
  }

  if (graphInstance) {
    graphInstance._destructor();
    graphInstance = null;
  }

  currentGraphData = graphData;
  var containerEl = graphSection;
  var width = containerEl.clientWidth;
  var height = containerEl.clientHeight;

  var nodeColors = {
    seed: '#FF6B6B',
    reference: '#4ECDC4',
    citation: '#FFB347'
  };

  // 构建邻接映射，用于 hover 高亮
  var neighborMap = {};
  graphData.links.forEach(function (link) {
    var srcId = typeof link.source === 'object' ? link.source.id : link.source;
    var tgtId = typeof link.target === 'object' ? link.target.id : link.target;
    if (!neighborMap[srcId]) neighborMap[srcId] = {};
    if (!neighborMap[tgtId]) neighborMap[tgtId] = {};
    neighborMap[srcId][tgtId] = true;
    neighborMap[tgtId][srcId] = true;
  });

  graphInstance = ForceGraph()(containerEl)
    .width(width)
    .height(height)
    .backgroundColor('#0D1117')
    .graphData(graphData)
    .nodeId('id')
    .nodeLabel(function (node) { return node.fullTitle; })
    .nodeColor(function (node) { return nodeColors[node.type] || '#888'; })
    .nodeVal(function (node) { return node.type === 'seed' ? 14 : 10; })
    .nodeCanvasObject(function (node, ctx, globalScale) {
      var label = node.label || '';
      var isHovered = hoveredNode && hoveredNode.id === node.id;
      var isNeighbor = hoveredNode && neighborMap[hoveredNode.id] && neighborMap[hoveredNode.id][node.id];
      var dimmed = hoveredNode && !isHovered && !isNeighbor && hoveredNode.id !== node.id;

      var fontSize = node.type === 'seed' ? 13 : 11;
      var radius = node.type === 'seed' ? 7 : 5;
      if (isHovered) radius *= 1.3;

      var alpha = dimmed ? 0.15 : 1;

      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI, false);
      ctx.fillStyle = nodeColors[node.type] || '#888';
      ctx.fill();

      ctx.font = fontSize + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#E6EDF3';
      ctx.fillText(label, node.x, node.y + radius + fontSize * 0.7);
      ctx.globalAlpha = 1;
    })
    .nodePointerAreaPaint(function (node, color, ctx) {
      var radius = node.type === 'seed' ? 7 : 5;
      ctx.beginPath();
      ctx.arc(node.x, node.y, radius + 2, 0, 2 * Math.PI, false);
      ctx.fillStyle = color;
      ctx.fill();
    })
    .linkColor(function (link) {
      var srcId = typeof link.source === 'object' ? link.source.id : link.source;
      var tgtId = typeof link.target === 'object' ? link.target.id : link.target;
      var isHighlighted = hoveredNode && (srcId === hoveredNode.id || tgtId === hoveredNode.id);
      if (hoveredNode && !isHighlighted) return 'rgba(85,85,85,0.15)';
      if (isHighlighted) return 'rgba(255,255,255,0.9)';
      return 'rgba(85,85,85,0.6)';
    })
    .linkWidth(function (link) {
      return Math.max(1, Math.min(5, Math.sqrt(link.value || 1) * 0.6));
    })
    .linkDirectionalArrowLength(6)
    .linkDirectionalArrowRelPos(1)
    .d3AlphaDecay(0.02)
    .d3Force('collision', d3.forceCollide().radius(function (node) {
      return node.type === 'seed' ? 30 : 20;
    }))
    .onNodeHover(function (node) {
      hoveredNode = node || null;
      if (node) {
        var firstAuthor = (node.authors && node.authors.length > 0) ? node.authors[0] : '未知';
        var authorText = firstAuthor + (node.authors && node.authors.length > 1 ? ' 等' : '');
        ttTitle.textContent = node.fullTitle || '—';
        ttMeta.textContent = authorText + ' · ' + (node.year || '?') + ' · 被引 ' + (node.citationCount || 0) + ' 次';
        graphTooltip.style.left = (mouseX + 16) + 'px';
        graphTooltip.style.top = (mouseY - 10) + 'px';
        graphTooltip.classList.add('visible');
      } else {
        graphTooltip.classList.remove('visible');
      }
    })
    .onNodeClick(function (node) {
      populateDetailPanel(node);
      console.log('🖱️ 节点点击:', node);
      console.log('  标题:', node.fullTitle);
      console.log('  年份:', node.year);
      console.log('  类型:', node.type);
      console.log('  引用数:', node.citationCount);
      console.log('  作者:', (node.authors || []).join(', '));
      console.log('  完整节点数据:', JSON.parse(JSON.stringify(node)));
    })
    .onBackgroundClick(function () {
      closeDetailPanel();
    });

  // 入场动画：节点从中心扩散
  graphInstance.d3ReheatSimulation();

  window.addEventListener('resize', function () {
    if (graphInstance) {
      graphInstance.width(graphSection.clientWidth);
      graphInstance.height(graphSection.clientHeight);
    }
  });
}

async function fetchPaperData(arxivId, silentRefresh) {
  var formattedId = formatArxivId(arxivId);
  if (!formattedId) {
    console.warn('⚠️ 请输入 arXiv ID');
    alert('⚠️ 请输入 arXiv ID');
    return null;
  }

  var cacheKey = 'citeLoom_' + formattedId;
  var cached = localStorage.getItem(cacheKey);
  var cachedData = cached ? JSON.parse(cached) : null;

  // 缓存优先：先返回缓存数据
  if (cachedData && !silentRefresh) {
    console.log('📦 从缓存加载:', formattedId);

    // 后台静默刷新
    fetchPaperData(arxivId, true).then(function (freshData) {
      if (freshData) {
        var freshStr = JSON.stringify(freshData);
        var cachedStr = JSON.stringify(cachedData);
        if (freshStr !== cachedStr) {
          console.log('� 后台数据已更新，平滑刷新图谱');
          lastApiData = freshData;
          currentGraphData = transformToGraphData(freshData);
          updateStoryPanel(freshData);
          if (graphInstance) {
            graphInstance.graphData(currentGraphData);
            graphInstance.d3ReheatSimulation();
          }
        }
      }
    }).catch(function () {});

    return cachedData;
  }

  if (silentRefresh && !cachedData) return null;

  var apiUrl = 'https://api.semanticscholar.org/graph/v1/paper/'
    + formattedId
    + '?fields=title,year,citationCount,authors,'
    + 'references.title,references.year,references.citationCount,references.authors,'
    + 'citations.title,citations.year,citations.citationCount,citations.authors'
    + '&references.limit=15&citations.limit=15';

  console.log('🚀 请求 API:', apiUrl);
  if (!silentRefresh) showLoading();

  try {
    var response = await fetch(apiUrl);
    if (!response.ok) {
      throw new Error('HTTP ' + response.status + ': ' + response.statusText);
    }
    var data = await response.json();
    console.log('✅ 数据获取成功:', formattedId, data);

    try {
      localStorage.setItem(cacheKey, JSON.stringify(data));
      console.log('💾 已缓存到 localStorage:', cacheKey);
    } catch (e) {
      console.warn('⚠️ localStorage 写入失败:', e.message);
    }

    return data;
  } catch (err) {
    console.error('❌ API 请求失败:', err.message);

    // 降级 1：有缓存用缓存
    if (cachedData) {
      console.log('📦 API 失败，降级使用缓存数据');
      showToast('📦 当前显示的是缓存数据');
      return cachedData;
    }

    // 降级 2：有内置 Demo 数据
    if (DEMO_DATA[formattedId]) {
      console.log('🎨 API 不可用，使用内置 Demo 数据');
      showToast('📦 使用内置 Demo 数据（API 不可用）', 3000);
      return DEMO_DATA[formattedId];
    }

    alert('⚠️ 网络请求失败，请检查网络连接');
    return null;
  } finally {
    if (!silentRefresh) hideLoading();
  }
}

// ========== 触发搜索（带过渡动画） ==========
async function triggerSearch() {
  if (isTransitioning) return;

  var rawId = searchInput.value.trim();
  if (!rawId) {
    console.warn('⚠️ 请输入 arXiv ID');
    alert('⚠️ 请输入 arXiv ID');
    return;
  }

  isTransitioning = true;

  // 淡出当前图谱
  if (graphInstance) {
    graphSection.classList.add('fading');
    await new Promise(function (r) { setTimeout(r, 500); });
  }

  var data = await fetchPaperData(rawId);
  if (data) {
    lastApiData = data;
    var formattedId = formatArxivId(rawId);
    searchInput.value = formattedId.replace('ARXIV:', '');
    currentGraphData = transformToGraphData(data);
    renderGraph(currentGraphData);
    updateStoryPanel(data);
    graphSection.classList.remove('fading');
  } else {
    graphSection.classList.remove('fading');
  }

  isTransitioning = false;
}

// ========== 事件绑定 ==========
btnGenerate.addEventListener('click', triggerSearch);

searchInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') {
    triggerSearch();
  }
});
