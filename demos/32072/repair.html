<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园智慧维修登记系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            text-align: center;
            color: #fff;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-container {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            color: #333;
            margin-bottom: 10px;
        }

        .form-group label span {
            color: #e74c3c;
            margin-left: 4px;
        }

        .form-group input[type="text"],
        .form-group input[type="tel"],
        .form-group input[type="number"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="tel"]:focus,
        .form-group input[type="number"]:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #667eea;
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: none;
            min-height: 100px;
        }

        .radio-group, .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .radio-item, .checkbox-item {
            display: flex;
            align-items: center;
            padding: 10px 18px;
            background: #f5f5f5;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .radio-item:hover, .checkbox-item:hover {
            background: #eee;
        }

        .radio-item.selected, .checkbox-item.selected {
            background: #eef2ff;
            border-color: #667eea;
            color: #667eea;
        }

        .radio-item input, .checkbox-item input {
            display: none;
        }

        .radio-item span, .checkbox-item span {
            font-size: 14px;
            margin-left: 8px;
        }

        .image-upload {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .image-upload:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .image-upload .upload-icon {
            font-size: 40px;
            color: #999;
            margin-bottom: 12px;
        }

        .image-upload p {
            font-size: 14px;
            color: #666;
        }

        .image-preview {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .preview-item {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            border: 2px solid #eee;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-item .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .success-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .success-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .success-content {
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: scale(0.8);
            transition: all 0.3s ease;
        }

        .success-modal.show .success-content {
            transform: scale(1);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            color: #fff;
        }

        .success-content h2 {
            font-size: 22px;
            color: #333;
            margin-bottom: 10px;
        }

        .success-content p {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        .success-content .order-info {
            background: #f5f7ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .success-content .order-info span {
            font-weight: 600;
            color: #667eea;
        }

        .close-btn {
            padding: 12px 30px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
        }

        .close-btn:hover {
            background: #5a6fd6;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .form-container {
                padding: 20px;
            }

            .radio-group, .checkbox-group {
                gap: 8px;
            }

            .radio-item, .checkbox-item {
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>校园智慧维修登记</h1>
            <p>高效报修 · 透明进度 · 优质服务</p>
        </div>

        <div class="form-container">
            <form id="repairForm" onsubmit="return submitForm()">
                <div class="form-group">
                    <label>姓名 <span>*</span></label>
                    <input type="text" id="name" placeholder="请输入您的姓名" required>
                </div>

                <div class="form-group">
                    <label>联系方式 <span>*</span></label>
                    <input type="tel" id="phone" placeholder="请输入手机号码" required>
                </div>

                <div class="form-group">
                    <label>身份类型 <span>*</span></label>
                    <div class="radio-group">
                        <label class="radio-item" onclick="selectRadio(this)">
                            <input type="radio" name="identity" value="student" checked>
                            <span>学生</span>
                        </label>
                        <label class="radio-item" onclick="selectRadio(this)">
                            <input type="radio" name="identity" value="teacher">
                            <span>教师</span>
                        </label>
                        <label class="radio-item" onclick="selectRadio(this)">
                            <input type="radio" name="identity" value="staff">
                            <span>教职工</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>报修区域 <span>*</span></label>
                    <select id="area" required>
                        <option value="">请选择报修区域</option>
                        <option value="dormitory">学生宿舍</option>
                        <option value="classroom">教学楼</option>
                        <option value="laboratory">实验室</option>
                        <option value="office">办公区域</option>
                        <option value="public">公共区域</option>
                        <option value="other">其他区域</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>详细位置 <span>*</span></label>
                    <input type="text" id="location" placeholder="例如：西校区3号楼402室" required>
                </div>

                <div class="form-group">
                    <label>故障类型 <span>*</span></label>
                    <div class="radio-group">
                        <label class="radio-item" onclick="selectRadio(this)">
                            <input type="radio" name="faultType" value="water" checked>
                            <span>水电故障</span>
                        </label>
                        <label class="radio-item" onclick="selectRadio(this)">
                            <input type="radio" name="faultType" value="furniture">
                            <span>家具损坏</span>
                        </label>
                        <label class="radio-item" onclick="selectRadio(this)">
                            <input type="radio" name="faultType" value="electronics">
                            <span>电器设备</span>
                        </label>
                        <label class="radio-item" onclick="selectRadio(this)">
                            <input type="radio" name="faultType" value="building">
                            <span>建筑设施</span>
                        </label>
                        <label class="radio-item" onclick="selectRadio(this)">
                            <input type="radio" name="faultType" value="network">
                            <span>网络通信</span>
                        </label>
                        <label class="radio-item" onclick="selectRadio(this)">
                            <input type="radio" name="faultType" value="other">
                            <span>其他</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>紧急程度 <span>*</span></label>
                    <div class="radio-group">
                        <label class="radio-item" onclick="selectRadio(this)">
                            <input type="radio" name="urgency" value="low" checked>
                            <span>一般</span>
                        </label>
                        <label class="radio-item" onclick="selectRadio(this)">
                            <input type="radio" name="urgency" value="medium">
                            <span>紧急</span>
                        </label>
                        <label class="radio-item" onclick="selectRadio(this)">
                            <input type="radio" name="urgency" value="high">
                            <span>非常紧急</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>故障描述 <span>*</span></label>
                    <textarea id="description" placeholder="请详细描述故障情况，例如：水龙头漏水、电灯不亮等"></textarea>
                </div>

                <div class="form-group">
                    <label>上传图片（可选）</label>
                    <div class="image-upload" onclick="document.getElementById('imageInput').click()">
                        <div class="upload-icon">📷</div>
                        <p>点击上传故障图片（最多3张）</p>
                        <input type="file" id="imageInput" multiple accept="image/*" style="display: none;" onchange="handleImageUpload(this)">
                    </div>
                    <div class="image-preview" id="imagePreview"></div>
                </div>

                <button type="submit" class="submit-btn">提交报修</button>
            </form>
        </div>
    </div>

    <div class="success-modal" id="successModal">
        <div class="success-content">
            <div class="success-icon">✓</div>
            <h2>报修提交成功</h2>
            <p>您的报修申请已提交，我们将尽快安排维修人员处理</p>
            <div class="order-info">
                <p>工单编号：<span id="orderNo"></span></p>
            </div>
            <button class="close-btn" onclick="closeModal()">返回首页</button>
        </div>
    </div>

    <script>
        let uploadedImages = [];

        function selectRadio(element) {
            const group = element.parentNode;
            const items = group.querySelectorAll('.radio-item');
            items.forEach(item => item.classList.remove('selected'));
            element.classList.add('selected');
        }

        function handleImageUpload(input) {
            const files = input.files;
            if (!files || files.length === 0) return;

            for (let i = 0; i < files.length; i++) {
                if (uploadedImages.length >= 3) {
                    alert('最多只能上传3张图片');
                    break;
                }
                const file = files[i];
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImages.push(e.target.result);
                    renderImagePreview();
                };
                reader.readAsDataURL(file);
            }
            input.value = '';
        }

        function renderImagePreview() {
            const previewContainer = document.getElementById('imagePreview');
            previewContainer.innerHTML = '';
            
            uploadedImages.forEach((src, index) => {
                const item = document.createElement('div');
                item.className = 'preview-item';
                item.innerHTML = `
                    <img src="${src}" alt="故障图片">
                    <div class="remove-btn" onclick="removeImage(${index})">×</div>
                `;
                previewContainer.appendChild(item);
            });
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            renderImagePreview();
        }

        function generateOrderNo() {
            const date = new Date();
            const year = date.getFullYear().toString().slice(-2);
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            const random = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
            return `WX${year}${month}${day}${random}`;
        }

        function submitForm() {
            const form = document.getElementById('repairForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return false;
            }

            const orderNo = generateOrderNo();
            document.getElementById('orderNo').textContent = orderNo;
            
            document.getElementById('successModal').classList.add('show');

            return false;
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('show');
            document.getElementById('repairForm').reset();
            uploadedImages = [];
            renderImagePreview();
            
            document.querySelectorAll('.radio-item').forEach(item => {
                if (item.querySelector('input[checked]')) {
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        document.querySelectorAll('.radio-item').forEach(item => {
            if (item.querySelector('input[checked]')) {
                item.classList.add('selected');
            }
        });
    </script>
</body>
</html>
