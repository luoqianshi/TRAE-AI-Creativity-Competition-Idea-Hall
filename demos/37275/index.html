<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>客厅 Livingroom · 像家一样的浏览器导航</title>
<meta name="description" content="一个会呼吸的浏览器新标签页，记得你的作息、家人的生日、窗外的天气。" />
<style>
  /* ============ 色彩与字体 ============ */
  :root {
    --bg-morning-1: #ffe8c8;   --bg-morning-2: #ffd6a0;   --bg-morning-3: #ffb78a;
    --bg-noon-1:    #ffeac1;   --bg-noon-2:    #fbd29a;   --bg-noon-3:    #e9a679;
    --bg-evening-1: #f7c79e;   --bg-evening-2: #e08c6a;   --bg-evening-3: #6f3957;
    --bg-night-1:   #2c2447;   --bg-night-2:   #1c1834;   --bg-night-3:   #0d0a1f;

    --ink:      #3a2418;
    --ink-soft: rgba(58, 36, 24, 0.72);
    --muted:    rgba(58, 36, 24, 0.55);
    --surface:  rgba(255, 248, 235, 0.55);
    --surface-2:rgba(255, 248, 235, 0.85);
    --rule:     rgba(58, 36, 24, 0.14);
    --accent:   #c0573a;
    --accent-2: #d99857;
    --glow:     rgba(255, 180, 90, 0.55);

    --shadow-soft: 0 8px 28px rgba(120, 60, 30, 0.12);
    --shadow-med:  0 14px 42px rgba(80, 40, 20, 0.18);
    --radius:      18px;
  }

  body.is-night {
    --ink:      #f6e8d0;
    --ink-soft: rgba(246, 232, 208, 0.78);
    --muted:    rgba(246, 232, 208, 0.55);
    --surface:  rgba(40, 32, 60, 0.55);
    --surface-2:rgba(40, 32, 60, 0.78);
    --rule:     rgba(246, 232, 208, 0.14);
    --accent:   #ffb27a;
    --accent-2: #e08c6a;
    --glow:     rgba(255, 180, 100, 0.4);
    --shadow-soft: 0 8px 28px rgba(0, 0, 0, 0.35);
    --shadow-med:  0 14px 42px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg-morning-1), var(--bg-morning-2) 45%, var(--bg-morning-3));
    transition: background 1.6s ease, color 0.6s ease;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }
  body.scene-morning { background: linear-gradient(160deg, var(--bg-morning-1), var(--bg-morning-2) 45%, var(--bg-morning-3)); }
  body.scene-noon    { background: linear-gradient(160deg, var(--bg-noon-1),    var(--bg-noon-2)    45%, var(--bg-noon-3)); }
  body.scene-evening { background: linear-gradient(160deg, var(--bg-evening-1), var(--bg-evening-2) 45%, var(--bg-evening-3)); }
  body.scene-night   { background: linear-gradient(160deg, var(--bg-night-1),   var(--bg-night-2)   55%, var(--bg-night-3)); }

  /* ============ 场景背景（窗户、火炉、猫） ============ */
  .scene {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .window-frame {
    position: absolute;
    top: 6%; right: 5%;
    width: 280px; height: 320px;
    background: linear-gradient(180deg, rgba(255,255,255,0.4), rgba(255,255,255,0.15));
    border: 6px solid rgba(90, 50, 30, 0.35);
    border-radius: 14px;
    box-shadow: var(--shadow-med);
    backdrop-filter: blur(8px);
    overflow: hidden;
  }
  body.is-night .window-frame {
    background: linear-gradient(180deg, #0e1a3a, #1b1640 60%, #2a1c4f);
    border-color: rgba(0,0,0,0.5);
  }
  .window-frame::before, .window-frame::after {
    content:""; position:absolute; background: rgba(90,50,30,0.35);
  }
  .window-frame::before { top: 0; left: 50%; width: 4px; height: 100%; transform: translateX(-50%); }
  .window-frame::after  { top: 50%; left: 0; width: 100%; height: 4px; transform: translateY(-50%); }
  .sun {
    position: absolute; left: 55%; top: 35%;
    width: 70px; height: 70px; border-radius: 50%;
    background: radial-gradient(circle, #fff2c4 0%, #ffd97a 50%, transparent 75%);
    box-shadow: 0 0 60px 12px var(--glow);
    transform: translate(-50%, -50%);
    transition: all 1.2s ease;
  }
  body.scene-evening .sun { background: radial-gradient(circle, #ffd0a0 0%, #e87a4e 60%, transparent 80%); left: 75%; top: 55%; }
  body.scene-night   .sun {
    background: radial-gradient(circle, #fff6e0 0%, #ffe7b0 50%, transparent 70%);
    width: 50px; height: 50px;
    left: 70%; top: 25%;
    box-shadow: 0 0 30px 6px rgba(255,240,200,0.5);
  }
  body.scene-night .sun::after {
    content:""; position:absolute; width: 38px; height: 38px; border-radius:50%;
    top: 8%; left: 18%; background: #2c2447;
  }

  .stars { position:absolute; inset:0; opacity:0; transition: opacity 1s; }
  body.is-night .stars { opacity: 1; }
  .stars span {
    position:absolute; width: 2px; height: 2px; background:#fff; border-radius:50%;
    box-shadow: 0 0 4px #fff;
    animation: twinkle 3s infinite alternate;
  }
  @keyframes twinkle { from { opacity:.2; } to { opacity:1; } }

  /* 火炉 */
  .fireplace {
    position: absolute;
    bottom: 5%; left: 4%;
    width: 220px; height: 180px;
  }
  .hearth {
    position: absolute; bottom: 0; width: 100%; height: 60%;
    background: linear-gradient(180deg, #6a3a25 0%, #4a2418 100%);
    border-radius: 10px 10px 4px 4px;
    box-shadow: var(--shadow-med);
  }
  .hearth-opening {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 70%; height: 75%;
    background: radial-gradient(ellipse at center bottom, #ff8a3c 0%, #c0573a 35%, #2a0e0a 75%);
    border-radius: 50% 50% 4px 4px / 30% 30% 4px 4px;
    overflow: hidden;
  }
  .flame {
    position:absolute; bottom:0; left:50%; transform: translateX(-50%);
    width: 30px; height: 50px;
    background: radial-gradient(ellipse at center bottom, #fff6b0 0%, #ffb74a 45%, #f07432 80%, transparent 100%);
    border-radius: 50% 50% 30% 30% / 60% 60% 40% 40%;
    filter: blur(2px);
    animation: flicker 1.2s infinite alternate;
  }
  .flame.f2 { left: 35%; width: 22px; height: 38px; animation-duration: 0.9s; opacity: .8; }
  .flame.f3 { left: 65%; width: 24px; height: 42px; animation-duration: 1.4s; opacity: .85; }
  @keyframes flicker {
    0%   { transform: translateX(-50%) scaleY(0.85) scaleX(0.95); opacity: .85; }
    100% { transform: translateX(-50%) scaleY(1.1)  scaleX(1.05); opacity: 1; }
  }
  .mantle {
    position: absolute; top: 38%; left: -6%; width: 112%; height: 14px;
    background: #8a4a2d; border-radius: 4px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.18);
  }

  /* 猫 */
  .cat {
    position: absolute;
    bottom: 6%; left: 240px;
    width: 110px; height: 70px;
    z-index: 2;
  }
  .cat-body {
    position:absolute; bottom: 0; width: 100%; height: 56%;
    background: linear-gradient(180deg, #d99857 0%, #a8623a 100%);
    border-radius: 50% 60% 40% 40% / 80% 90% 30% 30%;
  }
  .cat-head {
    position:absolute; bottom: 30%; left: -8%;
    width: 42%; height: 60%;
    background: linear-gradient(180deg, #d99857 0%, #a8623a 100%);
    border-radius: 50%;
  }
  .cat-ear { position:absolute; width: 0; height: 0;
    border-left: 8px solid transparent; border-right: 8px solid transparent;
    border-bottom: 14px solid #a8623a; top: -8px;
  }
  .cat-ear.l { left: 4px; transform: rotate(-15deg); }
  .cat-ear.r { left: 22px; transform: rotate(15deg); }
  .cat-tail {
    position:absolute; right: -10px; top: 30%;
    width: 50px; height: 12px;
    background: linear-gradient(90deg, #a8623a 0%, #d99857 100%);
    border-radius: 0 50% 50% 0;
    transform-origin: 0 50%;
    animation: tail 4s ease-in-out infinite;
  }
  @keyframes tail { 0%,100%{ transform: rotate(-5deg);} 50%{ transform: rotate(15deg);} }

  /* 雨/雪粒子层（脚本注入） */
  .particles { position: fixed; inset:0; pointer-events:none; z-index:1; }
  .particles .p { position:absolute; top:-10px; }
  .particles.rain .p {
    width:1.5px; height:14px;
    background: linear-gradient(180deg, rgba(180,210,255,0.05), rgba(180,210,255,0.7));
    animation: fall linear infinite;
  }
  .particles.snow .p {
    width:6px; height:6px; background:#fff; border-radius:50%; opacity:.85;
    animation: drift linear infinite;
  }
  .particles.firefly .p {
    width:4px; height:4px; border-radius:50%;
    background: radial-gradient(circle, #fff5a0 0%, #ffb84a 50%, transparent 80%);
    box-shadow: 0 0 8px #ffb84a;
    animation: drift linear infinite;
  }
  @keyframes fall  { to { transform: translateY(110vh) translateX(20px); } }
  @keyframes drift {
    0%   { transform: translateY(-10px) translateX(0);    opacity:0; }
    20%  { opacity: 1; }
    100% { transform: translateY(110vh) translateX(40px); opacity:0; }
  }

  /* ============ 主容器 ============ */
  .main {
    position: relative;
    z-index: 5;
    max-width: 720px;
    margin: 0 auto;
    padding: 8vh 24px 6vh;
    display: flex; flex-direction: column; gap: 22px;
    align-items: center;
  }

  /* 顶部 */
  .top-bar {
    width:100%; display:flex; justify-content:space-between; align-items:center;
    font-size: 13px; color: var(--ink-soft); letter-spacing: 0.5px;
  }
  .top-bar .home-tag {
    display:inline-flex; align-items:center; gap:8px;
    padding: 6px 14px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 999px;
    backdrop-filter: blur(12px);
  }
  .home-tag .dot {
    width:8px; height:8px; border-radius:50%; background: var(--accent);
    box-shadow: 0 0 8px var(--glow);
  }
  .top-bar .tools { display:flex; gap:8px; }
  .icon-btn {
    width:36px; height:36px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    background: var(--surface);
    border: 1px solid var(--rule);
    color: var(--ink);
    cursor: pointer;
    backdrop-filter: blur(12px);
    transition: transform .2s, background .2s;
  }
  .icon-btn:hover { transform: translateY(-2px); background: var(--surface-2); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* 问候 */
  .greeting {
    text-align: center;
    margin-top: 16px;
  }
  .clock {
    font-size: 72px;
    font-weight: 200;
    letter-spacing: -2px;
    line-height: 1;
    text-shadow: 0 2px 12px rgba(0,0,0,0.08);
    font-feature-settings: "tnum";
  }
  body.is-night .clock { text-shadow: 0 2px 20px rgba(255,180,100,0.25); }
  .date-row {
    margin-top: 8px;
    font-size: 13px; color: var(--ink-soft);
    letter-spacing: 1px;
  }
  .greeting-line {
    margin: 18px auto 0;
    max-width: 520px;
    font-size: 18px;
    line-height: 1.7;
    color: var(--ink);
    padding: 14px 22px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    backdrop-filter: blur(12px);
    box-shadow: var(--shadow-soft);
  }
  .greeting-line .from { font-size: 12px; color: var(--muted); display:block; margin-top:6px; letter-spacing:0.5px;}

  /* 搜索 */
  .search-row {
    width: 100%;
    display: flex; gap: 10px; align-items: center;
    margin-top: 8px;
  }
  .search {
    flex: 1;
    height: 56px;
    display:flex; align-items:center;
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 0 22px;
    box-shadow: var(--shadow-soft);
    backdrop-filter: blur(14px);
  }
  .search input {
    flex:1; border:none; outline:none; background:transparent;
    font-size: 16px; color: var(--ink);
    font-family: inherit;
  }
  .search input::placeholder { color: var(--muted); }
  .search .engine {
    margin-right: 14px; padding: 4px 10px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff8ec;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }

  /* 心情书签 */
  .moods {
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    margin-top: 6px;
  }
  .mood-chip {
    padding: 6px 14px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink-soft);
    backdrop-filter: blur(10px);
    transition: all .2s;
  }
  .mood-chip:hover { color: var(--ink); }
  .mood-chip.active {
    background: var(--accent);
    color: #fff8ec;
    border-color: var(--accent);
    box-shadow: 0 4px 14px rgba(192, 87, 58, 0.35);
  }

  .bookmarks {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
    margin-top: 4px;
  }
  .bm {
    position: relative;
    aspect-ratio: 1.4 / 1;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-decoration:none; color: var(--ink);
    backdrop-filter: blur(12px);
    transition: transform .25s, box-shadow .25s, background .25s;
    cursor: pointer;
    padding: 10px;
  }
  .bm:hover { transform: translateY(-4px); box-shadow: var(--shadow-med); background: var(--surface-2); }
  .bm .icon {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff8ec;
    display:flex; align-items:center; justify-content:center;
    font-size: 16px; font-weight: 600;
    margin-bottom: 8px;
  }
  .bm .name { font-size: 13px; text-align:center; line-height:1.3; }
  .bm.add { background: transparent; border: 1.5px dashed var(--rule); color: var(--muted); }
  .bm.add:hover { color: var(--accent); border-color: var(--accent); }
  .bm.add .icon { background: transparent; color: var(--muted); font-size: 22px; }
  .bm:hover .del-bm { opacity: 1; }
  .del-bm {
    position: absolute; top: 6px; right: 6px;
    width: 20px; height: 20px; border-radius:50%;
    background: rgba(0,0,0,0.4); color:#fff; border:none; cursor:pointer;
    font-size:11px; line-height:1;
    opacity: 0; transition: opacity .2s;
  }

  /* 卡片：家人格子 + 番茄钟 */
  .grid-2 {
    width: 100%;
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 14px;
    margin-top: 6px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow-soft);
  }
  .card h3 {
    margin: 0 0 12px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 1px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .card h3 .add-btn {
    border: none; background: transparent;
    color: var(--accent); font-size: 18px; cursor:pointer;
    width: 22px; height: 22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    line-height:1;
  }
  .card h3 .add-btn:hover { background: var(--rule); }

  /* 家人 */
  .family-list {
    display:flex; flex-direction: column; gap: 10px;
  }
  .family-item {
    display:flex; align-items:center; gap: 12px;
    padding: 8px 10px;
    border-radius: 12px;
    background: var(--surface-2);
    position: relative;
  }
  .family-item .avatar {
    width: 34px; height: 34px; border-radius:50%;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: #fff8ec;
    display:flex; align-items:center; justify-content:center;
    font-size: 14px; font-weight:600;
    flex-shrink: 0;
  }
  .family-item .info { flex:1; min-width:0; }
  .family-item .name { font-size: 14px; font-weight:500; }
  .family-item .countdown { font-size: 12px; color: var(--muted); margin-top: 2px;}
  .family-item .countdown.soon { color: var(--accent); font-weight: 600; }
  .family-item .del {
    border: none; background: transparent; color: var(--muted);
    cursor:pointer; font-size: 16px; opacity: 0; transition: opacity .2s;
  }
  .family-item:hover .del { opacity: 1; }
  .empty-hint { color: var(--muted); font-size: 13px; text-align:center; padding: 16px 0; }

  /* 番茄钟 */
  .pomodoro {
    display:flex; flex-direction:column; align-items:center;
    gap: 12px;
  }
  .pomo-ring {
    position: relative;
    width: 140px; height: 140px;
    display:flex; align-items:center; justify-content:center;
  }
  .pomo-ring svg {
    position:absolute; inset:0; transform: rotate(-90deg);
  }
  .pomo-ring .bg-ring { stroke: var(--rule); fill: none; stroke-width: 6; }
  .pomo-ring .fg-ring {
    stroke: var(--accent); fill: none; stroke-width: 6;
    stroke-linecap: round;
    transition: stroke-dashoffset .5s linear;
  }
  .pomo-time { font-size: 30px; font-weight: 300; letter-spacing: -1px; font-feature-settings: "tnum";}
  .pomo-actions { display:flex; gap: 8px; }
  .pomo-btn {
    padding: 6px 16px;
    background: var(--accent); color:#fff8ec;
    border:none; border-radius: 999px;
    font-size: 13px; cursor:pointer;
    font-family: inherit;
    transition: transform .2s, box-shadow .2s;
  }
  .pomo-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(192,87,58,0.4); }
  .pomo-btn.ghost {
    background: transparent; color: var(--ink-soft); border: 1px solid var(--rule);
  }

  /* 一键回家 */
  .footer-actions {
    width: 100%;
    display:flex; justify-content:center; gap: 12px;
    margin-top: 4px;
  }
  .ghost-btn {
    padding: 8px 18px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 999px;
    font-size: 13px;
    color: var(--ink-soft);
    cursor:pointer;
    font-family: inherit;
    backdrop-filter: blur(10px);
    transition: all .2s;
  }
  .ghost-btn:hover { color: var(--ink); background: var(--surface-2); }

  /* ============ 模态对话框 ============ */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(20,10,5,0.45);
    display: none;
    align-items:center; justify-content:center;
    backdrop-filter: blur(6px);
  }
  .modal-overlay.show { display:flex; }
  .modal {
    width: 90%; max-width: 460px;
    background: #fff8ec;
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow-med);
    color: #3a2418;
  }
  body.is-night .modal { background: #2c2447; color: #f6e8d0; }
  .modal h2 { margin: 0 0 14px; font-size: 18px; }
  .modal label { display:block; font-size: 12px; color: var(--muted); margin-top: 12px; margin-bottom: 4px; }
  .modal input, .modal select {
    width:100%; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--rule);
    background: var(--surface);
    color: var(--ink);
    font-size: 14px; font-family: inherit;
  }
  .modal-actions { display:flex; justify-content:flex-end; gap: 8px; margin-top: 20px; }
  .modal-actions button {
    padding: 8px 18px; border-radius: 999px; cursor:pointer;
    font-size: 13px; font-family: inherit; border: 1px solid var(--rule);
    background: transparent; color: var(--ink);
  }
  .modal-actions button.primary {
    background: var(--accent); color: #fff8ec; border-color: var(--accent);
  }

  /* 设置面板 */
  .settings-panel {
    position: fixed; top: 0; right: -380px;
    width: 360px; height: 100vh;
    background: #fff8ec;
    box-shadow: var(--shadow-med);
    z-index: 99;
    transition: right .4s ease;
    overflow-y: auto;
    padding: 28px 24px;
    color: #3a2418;
  }
  body.is-night .settings-panel { background: #2c2447; color: #f6e8d0;}
  .settings-panel.show { right: 0; }
  .settings-panel h2 { margin: 0 0 18px; font-size: 18px; }
  .settings-panel section { margin-bottom: 22px; }
  .settings-panel section h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .seg {
    display:flex; gap:0; border:1px solid var(--rule); border-radius: 999px; overflow:hidden;
    background: var(--surface);
  }
  .seg button {
    flex: 1; padding: 8px 4px;
    border: none; background: transparent; cursor:pointer;
    font-size: 13px; color: var(--ink-soft);
    font-family: inherit;
    transition: all .2s;
  }
  .seg button.active {
    background: var(--accent); color: #fff8ec;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff8ec;
    padding: 10px 22px; border-radius: 999px;
    font-size: 13px;
    box-shadow: var(--shadow-med);

<script>
/* =============================================================
   客厅 Livingroom · 主脚本
   单文件、纯前端、localStorage 持久化、无外部依赖
   ============================================================= */

const $ = (s, p=document) => p.querySelector(s);
const $$ = (s, p=document) => Array.from(p.querySelectorAll(s));

const LS = {
  get(k, def) { try { const v = localStorage.getItem('lr_'+k); return v ? JSON.parse(v) : def; } catch(e) { return def; } },
  set(k, v) { localStorage.setItem('lr_'+k, JSON.stringify(v)); }
};

/* ---------------- 入场动画 ---------------- */
window.addEventListener('load', () => {
  setTimeout(() => $('#doorLight').classList.add('expand'), 80);
  setTimeout(() => $('#doorOpen').classList.add('gone'), 1100);
  setTimeout(() => $('#doorOpen').remove(), 2400);
});

/* ---------------- 时钟与场景 ---------------- */
const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const SOLAR_TERMS = {
  // 简化：仅示意几个常见节气彩蛋
  '立春': {m:2, d:4}, '春分': {m:3, d:21}, '立夏': {m:5, d:6},
  '夏至': {m:6, d:21}, '立秋': {m:8, d:8}, '中秋': {m:9, d:17}, // 占位日期
  '立冬': {m:11, d:7}, '冬至': {m:12, d:22}
};

function fmt2(n){ return String(n).padStart(2,'0'); }

function detectScene(hour) {
  if (hour >= 5 && hour < 11) return 'morning';
  if (hour >= 11 && hour < 17) return 'noon';
  if (hour >= 17 && hour < 20) return 'evening';
  return 'night';
}

function applyScene(scene) {
  document.body.classList.remove('scene-morning','scene-noon','scene-evening','scene-night','is-night');
  document.body.classList.add('scene-' + scene);
  if (scene === 'night') document.body.classList.add('is-night');
}

let settings = LS.get('settings', { sceneMode:'auto', weather:'clear', engine:'baidu' });

function getCurrentScene() {
  if (settings.sceneMode === 'auto') return detectScene(new Date().getHours());
  return settings.sceneMode;
}

function refreshScene() {
  const scene = getCurrentScene();
  applyScene(scene);
  // 星空
  if (scene === 'night' && !$('#stars').dataset.built) {
    const stars = $('#stars');
    let html = '';
    for (let i=0;i<40;i++){
      html += `<span style="top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*3}s;"></span>`;
    }
    stars.innerHTML = html;
    stars.dataset.built = '1';
  }
}

function tick() {
  const now = new Date();
  $('#clock').textContent = fmt2(now.getHours()) + ':' + fmt2(now.getMinutes());
  $('#dateRow').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · ${WEEK[now.getDay()]}`;
  refreshScene();
}
setInterval(tick, 30000);
tick();

/* ---------------- AI 暖语问候 ---------------- */
const GREETINGS = {
  morning: [
    '早安。{date} 的太阳刚升起，先给自己倒一杯温水吧。',
    '今天是 {date}，{week}。轻轻起床，外面世界很大。',
    '清晨好。听说今天天气{weather}，{tip}。',
    '一夜好梦？今早第一件事是给自己一个微笑。',
    '{week} 的清晨格外安静，深呼吸三次再开始吧。'
  ],
  noon: [
    '中午好。手已经在键盘上多久了？该让眼睛休息 20 秒。',
    '{date} 的午后阳光很好，要不要走到窗边伸个懒腰？',
    '吃饭了吗？记得，胃比工作重要。',
    '现在是 {time}，下午请按你的节奏来。'
  ],
  evening: [
    '夕阳已经在窗台。{date} 这一天，你已经做得够好了。',
    '傍晚好。把灯调暖一点，让眼睛慢下来。',
    '{week} 的黄昏总是温柔，回家路上慢慢走。',
    '一杯温热的东西，比一份待办清单更重要。'
  ],
  night: [
    '夜深了。把屏幕调暗，让壁炉陪你一会儿。',
    '{date} 已近尾声，关掉所有未读，今晚只属于你。',
    '深夜好。如果还没睡，至少让肩膀松一下。',
    '听说今晚{weather}，盖好被子，明天再说。'
  ]
};
const WEATHER_TIPS = {
  clear:  '适合出门走走',
  rain:   '记得带伞，或者干脆听雨',
  snow:   '今天的世界变白了',
  firefly:'像是有萤火飞进了屋'
};
const WEATHER_LABEL = { clear:'晴', rain:'下雨', snow:'下雪', firefly:'有萤火' };

function pickGreeting() {
  const scene = getCurrentScene();
  const bucket = GREETINGS[scene] || GREETINGS.morning;
  const tpl = bucket[Math.floor(Math.random()*bucket.length)];
  const now = new Date();
  return tpl
    .replace('{date}', `${now.getMonth()+1}月${now.getDate()}日`)
    .replace('{week}', WEEK[now.getDay()])
    .replace('{time}', `${fmt2(now.getHours())}:${fmt2(now.getMinutes())}`)
    .replace('{weather}', WEATHER_LABEL[settings.weather]||'晴')
    .replace('{tip}', WEATHER_TIPS[settings.weather]||'适合出门走走');
}

function refreshGreeting(){
  $('#greetingLine').innerHTML = pickGreeting()
    + '<span class="from">—— 来自客厅</span>';
}
refreshGreeting();
$('#btnNewGreeting').onclick = refreshGreeting;

/* ---------------- 诗签 ---------------- */
const POEMS = [
  ['人闲桂花落，夜静春山空。', '王维 · 鸟鸣涧'],
  ['晚来天欲雪，能饮一杯无。', '白居易 · 问刘十九'],
  ['偷得浮生半日闲。', '李涉 · 题鹤林寺僧舍'],
  ['茅檐长扫净无苔，花木成畦手自栽。', '王安石 · 书湖阴先生壁'],
  ['今夜偏知春气暖，虫声新透绿窗纱。', '刘方平 · 月夜'],
  ['闲看儿童捉柳花。', '杨万里 · 闲居初夏午睡起'],
  ['绿蚁新醅酒，红泥小火炉。', '白居易 · 问刘十九']
];
$('#btnPoem').onclick = () => {
  const p = POEMS[Math.floor(Math.random()*POEMS.length)];
  $('#greetingLine').innerHTML = p[0] + '<span class="from">—— ' + p[1] + '</span>';
};

/* ---------------- 天气标签 ---------------- */
const WEATHER_SHOWN = {
  clear: '晴 · 22° · 适合开窗',
  rain:  '小雨 · 18° · 屋里更暖',
  snow:  '小雪 · -2° · 该煮点热汤',
  firefly:'夏夜 · 24° · 有萤火'
};
function refreshWeatherTag(){
  $('#weather').textContent = WEATHER_SHOWN[settings.weather] || WEATHER_SHOWN.clear;
}

/* ---------------- 粒子层 ---------------- */
function buildParticles(kind) {
  const layer = $('#particles');
  layer.className = 'particles ' + kind;
  if (kind === 'clear') { layer.innerHTML=''; return; }
  let html = '';
  const count = kind === 'rain' ? 80 : (kind === 'snow' ? 50 : 25);
  for (let i=0;i<count;i++) {
    const left = Math.random()*100;
    const dur  = kind==='rain' ? (0.5 + Math.random()*0.6) : (5 + Math.random()*8);
    const del  = Math.random()*dur;
    const size = kind==='snow' ? (3 + Math.random()*5) : (kind==='firefly' ? (3+Math.random()*3) : '');
    let style = `left:${left}%;animation-duration:${dur}s;animation-delay:-${del}s;`;
    if (size !== '') style += `width:${size}px;height:${size}px;`;
    html += `<span class="p" style="${style}"></span>`;
  }
  layer.innerHTML = html;
}
buildParticles(settings.weather);
refreshWeatherTag();

/* ---------------- 搜索 ---------------- */
const ENGINES = {
  baidu:  { name:'百度', url: q => 'https://www.baidu.com/s?wd=' + encodeURIComponent(q) },
  bing:   { name:'必应', url: q => 'https://www.bing.com/search?q=' + encodeURIComponent(q) },
  google: { name:'谷歌', url: q => 'https://www.google.com/search?q=' + encodeURIComponent(q) }
};
function refreshEngine(){ $('#engineToggle').textContent = ENGINES[settings.engine].name; }
refreshEngine();
$('#engineToggle').onclick = () => {
  const keys = Object.keys(ENGINES);
  const next = keys[(keys.indexOf(settings.engine)+1) % keys.length];
  settings.engine = next; LS.set('settings', settings);
  refreshEngine();
  $$('#segEngine button').forEach(b => b.classList.toggle('active', b.dataset.engine === next));
};
$('#searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()) {
    window.open(ENGINES[settings.engine].url(e.target.value.trim()), '_blank');
  }
});

/* ---------------- 书签 ---------------- */
const DEFAULT_BMS = [
  { name:'豆瓣',   url:'https://www.douban.com', mood:'relax' },
  { name:'B 站',   url:'https://www.bilibili.com', mood:'relax' },
  { name:'知乎',   url:'https://www.zhihu.com', mood:'inspire' },
  { name:'微信',   url:'https://wx.qq.com', mood:'connect' },
  { name:'Notion', url:'https://www.notion.so', mood:'focus' },
  { name:'GitHub', url:'https://github.com', mood:'focus' },
  { name:'TRAE',   url:'https://www.trae.cn', mood:'inspire' }
];
let bookmarks = LS.get('bookmarks', DEFAULT_BMS);
let currentMood = 'all';

function renderBookmarks(){
  const list = $('#bookmarks');
  const filtered = bookmarks.filter(b => currentMood==='all' || b.mood===currentMood);
  list.innerHTML = filtered.map((b,i) => `
    <a class="bm" href="${b.url}" data-i="${bookmarks.indexOf(b)}" target="_blank" rel="noopener">
      <button class="del-bm" data-del="${bookmarks.indexOf(b)}" title="删除">×</button>
      <div class="icon">${(b.name||'?').trim().slice(0,1)}</div>
      <div class="name">${b.name}</div>
    </a>
  `).join('') +
  `<div class="bm add" id="addBm">
     <div class="icon">+</div>
     <div class="name">添加</div>
   </div>`;
  $('#addBm').onclick = () => openModal('#modalBm');
  $$('.del-bm').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      const idx = +btn.dataset.del;
      bookmarks.splice(idx,1); LS.set('bookmarks', bookmarks); renderBookmarks();
      toast('已经把这扇门收起来了');
    });
  });
}
renderBookmarks();

$$('#moods .mood-chip').forEach(c => {
  c.onclick = () => {
    $$('#moods .mood-chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    currentMood = c.dataset.mood;
    renderBookmarks();
  };
});

$('#bmSave').onclick = () => {
  const name = $('#bmName').value.trim();
  let url = $('#bmUrl').value.trim();
  const mood = $('#bmMood').value;
  if (!name || !url) { toast('名字和网址都填一下吧'); return; }
  if (!/^https?:\/\//.test(url)) url = 'https://' + url;
  bookmarks.push({ name, url, mood });
  LS.set('bookmarks', bookmarks);
  $('#bmName').value=''; $('#bmUrl').value='';
  closeModals();
  renderBookmarks();
  toast('已为你布置好这个角落');
};

/* ---------------- 家人格子 ---------------- */
let family = LS.get('family', [
  { name:'妈妈', date:'1965-08-15', note:'生日提前订蛋糕' }
]);
function daysUntil(dateStr){
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(dateStr);
  // 取今年（或明年）的同月同日
  const target = new Date(now.getFullYear(), d.getMonth(), d.getDate());
  if (target < now) target.setFullYear(now.getFullYear()+1);
  const diff = Math.round((target - now)/86400000);
  return diff;
}
function renderFamily(){
  const list = $('#familyList');
  if (!family.length) { list.innerHTML = '<div class="empty-hint">还没添加家人，点右上角 +</div>'; return; }
  list.innerHTML = family.map((f,i) => {
    const d = daysUntil(f.date);
    const label = d===0 ? '就是今天 🎂' : (d<=7 ? `还有 ${d} 天` : `还有 ${d} 天`);
    return `<div class="family-item">
      <div class="avatar">${(f.name||'?').trim().slice(0,1)}</div>
      <div class="info">
        <div class="name">${f.name}</div>
        <div class="countdown ${d<=7?'soon':''}">${label} · ${f.note||'下次见面记得抱一下'}</div>
      </div>
      <button class="del" data-fdel="${i}" title="删除">×</button>
    </div>`;
  }).join('');
  $$('.family-item .del').forEach(btn => {
    btn.onclick = () => {
      family.splice(+btn.dataset.fdel, 1);
      LS.set('family', family); renderFamily();
    };
  });
}
renderFamily();

$('#btnAddFamily').onclick = () => openModal('#modalFam');
$('#famSave').onclick = () => {
  const name = $('#famName').value.trim();
  const date = $('#famDate').value;
  const note = $('#famNote').value.trim();
  if (!name || !date) { toast('名字和日期都填一下吧'); return; }
  family.push({ name, date, note });
  LS.set('family', family);
  $('#famName').value=''; $('#famDate').value=''; $('#famNote').value='';
  closeModals(); renderFamily();
  toast('已经把 TA 放进客厅了');
};

/* ---------------- 番茄钟 ---------------- */
const POMO_TOTAL = 25 * 60;
let pomoLeft = POMO_TOTAL;
let pomoTimer = null;
const CIRCUM = 2 * Math.PI * 62; // ≈ 389.557

function renderPomo(){
  const m = Math.floor(pomoLeft/60), s = pomoLeft%60;
  $('#pomoTime').textContent = fmt2(m)+':'+fmt2(s);
  const offset = CIRCUM * (1 - pomoLeft/POMO_TOTAL);
  $('#pomoRing').setAttribute('stroke-dashoffset', offset);
}
renderPomo();

$('#pomoStart').onclick = () => {
  if (pomoTimer) {
    clearInterval(pomoTimer); pomoTimer = null;
    $('#pomoStart').textContent = '继续';
    return;
  }
  $('#pomoStart').textContent = '暂停';
  pomoTimer = setInterval(() => {
    pomoLeft--;
    if (pomoLeft <= 0) {
      clearInterval(pomoTimer); pomoTimer = null;
      pomoLeft = POMO_TOTAL;
      $('#pomoStart').textContent = '开始';
      toast('一只猫醒了，伸了个懒腰 🐱');
    }
    renderPomo();
  }, 1000);
};
$('#pomoReset').onclick = () => {
  clearInterval(pomoTimer); pomoTimer = null;
  pomoLeft = POMO_TOTAL;
  $('#pomoStart').textContent = '开始';
  renderPomo();
};

/* ---------------- 模态 / Toast ---------------- */
function openModal(sel){ $(sel).classList.add('show'); }
function closeModals(){ $$('.modal-overlay').forEach(m => m.classList.remove('show')); }
$$('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) closeModals(); });
});

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------------- 节气彩蛋 ---------------- */
(function festiveCheck(){
  const now = new Date();
  Object.entries(SOLAR_TERMS).forEach(([name, d]) => {
    if (now.getMonth()+1 === d.m && now.getDate() === d.d) {
      setTimeout(() => toast('今天是「'+name+'」 · 客厅为你换了点装饰'), 2500);
    }
  });
})();
