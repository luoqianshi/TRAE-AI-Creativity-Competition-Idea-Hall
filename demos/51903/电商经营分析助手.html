<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商经营分析助手</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; height: 100vh; display: flex; }
        .sidebar { width: 260px; background: #1a1a2e; color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header h2 { font-size: 16px; font-weight: 600; }
        .sidebar-header p { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }
        .new-chat-btn { margin: 16px; padding: 10px; background: rgba(255,255,255,0.1); border: 1px dashed rgba(255,255,255,0.3); border-radius: 8px; color: #fff; cursor: pointer; font-size: 14px; text-align: center; transition: all 0.2s; }
        .new-chat-btn:hover { background: rgba(255,255,255,0.15); }
        .chat-history { flex: 1; overflow-y: auto; padding: 8px; }
        .chat-history-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 2px; transition: all 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-history-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .chat-history-item.active { background: rgba(99, 102, 241, 0.3); color: #fff; }
        .sidebar-footer { padding: 16px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; color: rgba(255,255,255,0.4); }
        .main { flex: 1; display: flex; flex-direction: column; }
        .topbar { height: 56px; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; padding: 0 24px; justify-content: space-between; }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar-left h3 { font-size: 15px; font-weight: 600; color: #1f2937; }
        .topbar-badge { background: #eef2ff; color: #6366f1; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
        .topbar-right { display: flex; align-items: center; gap: 12px; }
        .topbar-btn { padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid #e5e7eb; background: #fff; color: #374151; transition: all 0.2s; }
        .topbar-btn:hover { background: #f9fafb; }
        .chat-area { flex: 1; overflow-y: auto; padding: 24px; }
        .chat-area::-webkit-scrollbar { width: 6px; }
        .chat-area::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        .message { margin-bottom: 24px; display: flex; gap: 12px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message-avatar { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .message-avatar.user { background: #6366f1; color: #fff; }
        .message-avatar.ai { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
        .message-content { flex: 1; max-width: 800px; }
        .message-name { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .message-text { font-size: 14px; line-height: 1.7; color: #1f2937; }
        .message-text p { margin-bottom: 8px; }
        .data-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
        .data-table th { background: #f8fafc; padding: 10px 12px; text-align: left; font-weight: 600; color: #475569; border-bottom: 2px solid #e2e8f0; }
        .data-table td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; color: #334155; }
        .data-table tr:hover td { background: #f8fafc; }
        .data-table .num { font-family: "SF Mono", "Fira Code", monospace; }
        .chart-container { width: 100%; height: 300px; margin: 12px 0; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
        .sql-block { background: #1e1e2e; color: #a6e3a1; padding: 14px 16px; border-radius: 8px; font-family: "SF Mono", "Fira Code", monospace; font-size: 13px; margin: 12px 0; overflow-x: auto; line-height: 1.6; }
        .sql-keyword { color: #89b4fa; font-weight: 600; }
        .sql-string { color: #f9e2af; }
        .sql-comment { color: #6c7086; font-style: italic; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; margin-right: 4px; }
        .tag-up { background: #dcfce7; color: #166534; }
        .tag-down { background: #fef2f2; color: #991b1b; }
        .tag-info { background: #eef2ff; color: #4338ca; }
        .metrics-row { display: flex; gap: 12px; margin: 12px 0; flex-wrap: wrap; }
        .metric-card { flex: 1; min-width: 140px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; }
        .metric-label { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
        .metric-value { font-size: 22px; font-weight: 700; color: #111827; font-family: "SF Mono", "Fira Code", monospace; }
        .metric-change { font-size: 12px; margin-top: 4px; }
        .metric-change.up { color: #16a34a; }
        .metric-change.down { color: #dc2626; }
        .input-area { padding: 16px 24px 24px; background: #fff; border-top: 1px solid #e5e7eb; }
        .input-wrapper { display: flex; gap: 12px; align-items: flex-end; max-width: 800px; margin: 0 auto; }
        .input-box { flex: 1; position: relative; }
        .input-box textarea { width: 100%; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 14px; resize: none; height: 48px; max-height: 120px; font-family: inherit; transition: border-color 0.2s; outline: none; }
        .input-box textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
        .send-btn { width: 48px; height: 48px; border-radius: 12px; background: #6366f1; color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
        .send-btn:hover { background: #4f46e5; }
        .send-btn:disabled { background: #c7d2fe; cursor: not-allowed; }
        .input-hint { font-size: 11px; color: #9ca3af; margin-top: 6px; text-align: center; }
        .loading { display: flex; gap: 4px; align-items: center; padding: 8px 0; }
        .loading-dot { width: 6px; height: 6px; background: #6366f1; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        .welcome { text-align: center; padding: 60px 20px; }
        .welcome-icon { font-size: 48px; margin-bottom: 16px; }
        .welcome h2 { font-size: 22px; color: #111827; margin-bottom: 8px; }
        .welcome p { font-size: 14px; color: #6b7280; margin-bottom: 24px; }
        .welcome-questions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 600px; margin: 0 auto; }
        .welcome-question { padding: 14px; border: 1px solid #e5e7eb; border-radius: 10px; cursor: pointer; text-align: left; font-size: 13px; color: #374151; transition: all 0.2s; background: #fff; }
        .welcome-question:hover { border-color: #6366f1; background: #eef2ff; }
        .welcome-question .icon { font-size: 18px; margin-bottom: 6px; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header">
        <h2>📊 电商经营分析助手</h2>
        <p>AI驱动的数据分析平台</p>
    </div>
    <div class="new-chat-btn" onclick="newChat()">+ 新建对话</div>
    <div class="chat-history" id="chatHistory">
        <div class="chat-history-item active" onclick="loadChat(0)">上个月销售数据分析</div>
        <div class="chat-history-item" onclick="loadChat(1)">商品销量TOP10</div>
        <div class="chat-history-item" onclick="loadChat(2)">各省份订单分布</div>
        <div class="chat-history-item" onclick="loadChat(3)">最近7天销售趋势</div>
    </div>
    <div class="sidebar-footer">基于 Spring AI 2.0 + Text-to-SQL</div>
</div>
<div class="main">
    <div class="topbar">
        <div class="topbar-left">
            <h3>电商经营分析助手</h3>
            <span class="topbar-badge">AI对话</span>
        </div>
        <div class="topbar-right">
            <div class="topbar-btn">📥 导出数据</div>
        </div>
    </div>
    <div class="chat-area" id="chatArea">
        <div class="welcome" id="welcomePage">
            <div class="welcome-icon">📊</div>
            <h2>你好，我是电商经营分析助手</h2>
            <p>用自然语言提问，我帮你查数据、生成图表</p>
            <div class="welcome-questions">
                <div class="welcome-question" onclick="askQuestion('上个月总销售额多少？环比增长多少？')">
                    <div class="icon">💰</div>
                    上个月总销售额多少？环比增长多少？
                </div>
                <div class="welcome-question" onclick="askQuestion('销量最好的10个商品是什么？')">
                    <div class="icon">🏆</div>
                    销量最好的10个商品是什么？
                </div>
                <div class="welcome-question" onclick="askQuestion('各省份的订单量分布')">
                    <div class="icon">🗺️</div>
                    各省份的订单量分布
                </div>
                <div class="welcome-question" onclick="askQuestion('最近7天每天的销售额趋势')">
                    <div class="icon">📈</div>
                    最近7天每天的销售额趋势
                </div>
            </div>
        </div>
        <div id="messageList" style="display:none;"></div>
    </div>
    <div class="input-area">
        <div class="input-wrapper">
            <div class="input-box">
                <textarea id="userInput" placeholder="输入你的问题，如：上个月销售额多少？" rows="1" onkeydown="handleKey(event)"></textarea>
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
            </button>
        </div>
        <div class="input-hint">基于 Spring AI 2.0 · Text-to-SQL · 按 Enter 发送</div>
    </div>
</div>
<script>
const mockResponses={
    '上个月总销售额多少？环比增长多少？':{
        sql:"SELECT DATE_FORMAT(order_time,'%Y-%m') AS month, SUM(amount) AS total_sales, COUNT(DISTINCT order_no) AS order_count FROM orders WHERE order_time>='2025-05-01' AND order_time<'2025-06-01' GROUP BY DATE_FORMAT(order_time,'%Y-%m')",
        answer:`<p>📊 <strong>2025年5月销售数据：</strong></p><div class="metrics-row"><div class="metric-card"><div class="metric-label">总销售额</div><div class="metric-value">¥1,234,567</div><div class="metric-change up">↑ 12.3% 环比增长</div></div><div class="metric-card"><div class="metric-label">订单数</div><div class="metric-value">8,432</div><div class="metric-change up">↑ 8.7% 环比增长</div></div><div class="metric-card"><div class="metric-label">客单价</div><div class="metric-value">¥146.4</div><div class="metric-change up">↑ 3.3% 环比增长</div></div><div class="metric-card"><div class="metric-label">日均销售额</div><div class="metric-value">¥39,825</div><div class="metric-change down">↓ 2.1% 较上月</div></div></div><p>5月销售表现良好，总销售额突破123万，环比增长12.3%。订单量和客单价均有提升。</p>`,
        chart:{type:'bar',data:[{month:'1月',sales:856234},{month:'2月',sales:723456},{month:'3月',sales:945678},{month:'4月',sales:1098765},{month:'5月',sales:1234567}]}
    },
    '销量最好的10个商品是什么？':{
        sql:"SELECT product_name, SUM(quantity) AS total_quantity, SUM(amount) AS total_amount FROM orders WHERE order_time>='2025-05-01' AND order_time<'2025-06-01' GROUP BY product_name ORDER BY total_quantity DESC LIMIT 10",
        answer:`<p>🏆 <strong>2025年5月商品销量TOP10：</strong></p><table class="data-table"><thead><tr><th>排名</th><th>商品名称</th><th>销量</th><th>销售额</th><th>占比</th></tr></thead><tbody><tr><td>🥇 1</td><td>Apple iPhone 15 Pro</td><td class="num">1,234</td><td class="num">¥987,654</td><td><span class="tag tag-info">18.2%</span></td></tr><tr><td>🥈 2</td><td>华为 Mate 60 Pro</td><td class="num">1,089</td><td class="num">¥654,321</td><td><span class="tag tag-info">15.3%</span></td></tr><tr><td>🥉 3</td><td>小米14 Ultra</td><td class="num">876</td><td class="num">¥432,109</td><td><span class="tag tag-info">12.1%</span></td></tr><tr><td>4</td><td>MacBook Air M3</td><td class="num">654</td><td class="num">¥567,890</td><td><span class="tag tag-info">9.8%</span></td></tr><tr><td>5</td><td>iPad Air</td><td class="num">543</td><td class="num">¥321,098</td><td><span class="tag tag-info">7.6%</span></td></tr></tbody></table><p>手机品类占据前三，iPhone 15 Pro以1234件销量领跑。数码3C品类整体占比超过60%。</p>`,
        chart:{type:'hbar',data:[{name:'iPhone 15 Pro',value:1234},{name:'华为 Mate 60 Pro',value:1089},{name:'小米14 Ultra',value:876},{name:'MacBook Air M3',value:654},{name:'iPad Air',value:543},{name:'AirPods Pro 2',value:432},{name:'戴森吹风机',value:321},{name:'索尼WH-1000XM5',value:298},{name:'Switch OLED',value:267},{name:'Kindle Paperwhite',value:234}]}
    },
    '各省份的订单量分布':{
        sql:"SELECT province, COUNT(*) AS order_count, SUM(amount) AS total_amount FROM orders WHERE order_time>='2025-05-01' AND order_time<'2025-06-01' GROUP BY province ORDER BY order_count DESC LIMIT 15",
        answer:`<p>🗺️ <strong>2025年5月各省份订单分布：</strong></p><table class="data-table"><thead><tr><th>排名</th><th>省份</th><th>订单量</th><th>销售额</th><th>占比</th></tr></thead><tbody><tr><td>1</td><td>广东</td><td class="num">2,345</td><td class="num">¥345,678</td><td><span class="tag tag-up">27.8%</span></td></tr><tr><td>2</td><td>浙江</td><td class="num">1,234</td><td class="num">¥189,012</td><td><span class="tag tag-up">14.6%</span></td></tr><tr><td>3</td><td>江苏</td><td class="num">1,089</td><td class="num">¥156,789</td><td><span class="tag tag-info">12.9%</span></td></tr><tr><td>4</td><td>上海</td><td class="num">876</td><td class="num">¥134,567</td><td><span class="tag tag-info">10.4%</span></td></tr><tr><td>5</td><td>北京</td><td class="num">765</td><td class="num">¥123,456</td><td><span class="tag tag-info">9.1%</span></td></tr></tbody></table><p>广东以27.8%的占比遥遥领先，沿海发达省份贡献了超过60%的订单量。</p>`,
        chart:{type:'map',data:[{name:'广东',value:2345},{name:'浙江',value:1234},{name:'江苏',value:1089},{name:'上海',value:876},{name:'北京',value:765},{name:'山东',value:654},{name:'四川',value:543},{name:'湖北',value:432},{name:'福建',value:398},{name:'河南',value:367}]}
    },
    '最近7天每天的销售额趋势':{
        sql:"SELECT DATE(order_time) AS order_date, SUM(amount) AS daily_sales, COUNT(DISTINCT order_no) AS order_count FROM orders WHERE order_time>=DATE_SUB('2025-05-25',INTERVAL 7 DAY) GROUP BY DATE(order_time) ORDER BY order_date",
        answer:`<p>📈 <strong>最近7天销售额趋势：</strong></p><div class="metrics-row"><div class="metric-card"><div class="metric-label">7天总销售额</div><div class="metric-value">¥287,654</div><div class="metric-change up">↑ 5.2% 较上周</div></div><div class="metric-card"><div class="metric-label">日均销售额</div><div class="metric-value">¥41,093</div></div><div class="metric-card"><div class="metric-label">最高日</div><div class="metric-value">周六</div><div class="metric-change">¥52,345</div></div><div class="metric-card"><div class="metric-label">最低日</div><div class="metric-value">周一</div><div class="metric-change">¥31,234</div></div></div><p>周末销售额明显高于工作日，周六达到峰值。建议在周五加大推广力度，抓住周末消费高峰。</p>`,
        chart:{type:'line',data:[{date:'05-19',sales:31234},{date:'05-20',sales:35678},{date:'05-21',sales:38901},{date:'05-22',sales:42345},{date:'05-23',sales:45678},{date:'05-24',sales:52345},{date:'05-25',sales:41413}]}
    }
};
let chatSessions=[[{role:'user',content:'上个月总销售额多少？环比增长多少？'}],[{role:'user',content:'销量最好的10个商品是什么？'}],[{role:'user',content:'各省份的订单量分布'}],[{role:'user',content:'最近7天每天的销售额趋势'}]];
function askQuestion(q){document.getElementById('userInput').value=q;sendMessage();}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function sendMessage(){
    const input=document.getElementById('userInput');
    const question=input.value.trim();
    if(!question)return;
    input.value='';
    document.getElementById('welcomePage').style.display='none';
    document.getElementById('messageList').style.display='block';
    addMessage('user',question);
    const loadingId=addLoading();
    setTimeout(()=>{removeLoading(loadingId);const response=mockResponses[question]||generateDefaultResponse(question);addMessage('ai',response);},1500);
}
function addMessage(role,content){
    const list=document.getElementById('messageList');
    const div=document.createElement('div');
    div.className='message';
    if(role==='user'){
        div.innerHTML=`<div class="message-avatar user">U</div><div class="message-content"><div class="message-name">你</div><div class="message-text"><p>${content}</p></div></div>`;
    }else{
        let html=`<div class="message-avatar ai">AI</div><div class="message-content"><div class="message-name">电商分析助手</div><div class="message-text">${content.answer}</div>`;
        if(content.chart){const chartId='chart_'+Date.now();html+=`<div class="chart-container" id="${chartId}"></div>`;}
        html+=`<div class="sql-block"><span class="sql-comment">-- 生成的SQL查询</span><br>${highlightSQL(content.sql)}</div></div>`;
        div.innerHTML=html;
        list.appendChild(div);
        if(content.chart){setTimeout(()=>{const chartEl=list.querySelector('.chart-container:last-child');if(chartEl)renderChart(chartEl,content.chart);},100);}
        scrollBottom();return;
    }
    list.appendChild(div);scrollBottom();
}
function addLoading(){const list=document.getElementById('messageList');const div=document.createElement('div');div.className='message';const id='loading_'+Date.now();div.id=id;div.innerHTML=`<div class="message-avatar ai">AI</div><div class="message-content"><div class="message-name">电商分析助手</div><div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div><span style="margin-left:8px;font-size:13px;color:#6b7280;">正在分析数据...</span></div></div>`;list.appendChild(div);scrollBottom();return id;}
function removeLoading(id){const el=document.getElementById(id);if(el)el.remove();}
function renderChart(container,chartData){
    const chart=echarts.init(container);
    if(chartData.type==='bar'){chart.setOption({tooltip:{trigger:'axis',formatter:'{b}: ¥{c}'},xAxis:{type:'category',data:chartData.data.map(d=>d.month),axisLabel:{color:'#6b7280'}},yAxis:{type:'value',axisLabel:{color:'#6b7280',formatter:v=>'¥'+(v/10000).toFixed(0)+'万'}},series:[{type:'bar',data:chartData.data.map(d=>d.sales),itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#6366f1'},{offset:1,color:'#8b5cf6'}]),borderRadius:[4,4,0,0]},barWidth:'40%'}],grid:{left:'10%',right:'5%',top:'10%',bottom:'15%'}});}
    else if(chartData.type==='hbar'){chart.setOption({tooltip:{trigger:'axis'},xAxis:{type:'value',axisLabel:{color:'#6b7280'}},yAxis:{type:'category',data:chartData.data.map(d=>d.name).reverse(),axisLabel:{color:'#374151',fontSize:12}},series:[{type:'bar',data:chartData.data.map(d=>d.value).reverse(),itemStyle:{color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#8b5cf6'},{offset:1,color:'#6366f1'}]),borderRadius:[0,4,4,0]},barWidth:'60%'}],grid:{left:'25%',right:'10%',top:'5%',bottom:'10%'}});}
    else if(chartData.type==='line'){chart.setOption({tooltip:{trigger:'axis',formatter:'{b}<br/>销售额: ¥{c}'},xAxis:{type:'category',data:chartData.data.map(d=>d.date),axisLabel:{color:'#6b7280'}},yAxis:{type:'value',axisLabel:{color:'#6b7280',formatter:v=>'¥'+(v/10000).toFixed(1)+'万'}},series:[{type:'line',data:chartData.data.map(d=>d.sales),smooth:true,symbol:'circle',symbolSize:8,lineStyle:{color:'#6366f1',width:3},itemStyle:{color:'#6366f1'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(99,102,241,0.3)'},{offset:1,color:'rgba(99,102,241,0.02)'}])}}],grid:{left:'10%',right:'5%',top:'10%',bottom:'15%'}});}
    else if(chartData.type==='map'){chart.setOption({tooltip:{trigger:'axis',formatter:'{b}: {c} 单'},xAxis:{type:'value',axisLabel:{color:'#6b7280'}},yAxis:{type:'category',data:chartData.data.map(d=>d.name).reverse(),axisLabel:{color:'#374151'}},series:[{type:'bar',data:chartData.data.map(d=>d.value).reverse(),itemStyle:{color:'#6366f1',borderRadius:[0,4,4,0]},barWidth:'50%'}],grid:{left:'12%',right:'10%',top:'5%',bottom:'10%'}});}
    window.addEventListener('resize',()=>chart.resize());
}
function highlightSQL(sql){const keywords=['SELECT','FROM','WHERE','GROUP BY','ORDER BY','LIMIT','AS','AND','OR','JOIN','LEFT','RIGHT','INNER','ON','HAVING','DISTINCT','COUNT','SUM','AVG','MAX','MIN','DATE_FORMAT','DATE_SUB','DATE','INTERVAL','DAY','ROUND','DESC','ASC','BETWEEN','IN','LIKE','IS','NOT','NULL','CASE','WHEN','THEN','ELSE','END'];let result=sql;keywords.forEach(kw=>{const regex=new RegExp('\\b'+kw+'\\b','gi');result=result.replace(regex,`<span class="sql-keyword">${kw}</span>`);});result=result.replace(/'([^']*)'/g,`<span class="sql-string">'$1'</span>`);return result;}
function generateDefaultResponse(question){return{sql:`SELECT * FROM orders WHERE order_time>='2025-05-01' LIMIT 100`,answer:`<p>已为您查询相关数据。以下是基于您的问题"${question}"生成的查询结果。</p><p>如需更精确的分析，请提供更具体的查询条件。</p>`,chart:null};}
function scrollBottom(){const area=document.getElementById('chatArea');setTimeout(()=>area.scrollTop=area.scrollHeight,50);}
function newChat(){document.getElementById('welcomePage').style.display='block';document.getElementById('messageList').style.display='none';document.getElementById('messageList').innerHTML='';document.querySelectorAll('.chat-history-item').forEach(el=>el.classList.remove('active'));}
function loadChat(index){document.querySelectorAll('.chat-history-item').forEach((el,i)=>{el.classList.toggle('active',i===index);});document.getElementById('welcomePage').style.display='none';document.getElementById('messageList').style.display='block';document.getElementById('messageList').innerHTML='';const session=chatSessions[index];if(session){session.forEach(msg=>{if(msg.role==='user')addMessage('user',msg.content);});setTimeout(()=>{const response=mockResponses[session[0].content];if(response)addMessage('ai',response);},500);}}
document.getElementById('userInput').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';});
</script>
