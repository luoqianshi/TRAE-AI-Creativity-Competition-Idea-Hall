<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nestxt · 巢叙 | 宁静文本编辑器 — 极简重构版</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg-app: #F7F5F2;
            --bg-sidebar: #FFFFFF;
            --bg-editor: #FFFFFF;
            --bg-hover: #F3F0EB;
            --bg-active: #F0EBE2;
            --accent: #D46A4A;
            --accent-soft: rgba(212, 106, 74, 0.08);
            --border-light: #EFECE6;
            --text-primary: #2C3E4E;
            --text-secondary: #7C8B9A;
            --text-muted: #B8C2CC;
            --line-number-text: #C2C9D1;
            --line-number-active: #D46A4A;
            --scrollbar-thumb: #D9D4CE;
            --trash-badge-bg: #E05A5A;
        }

        [data-theme="dark"] {
            --bg-app: #1E1F2C;
            --bg-sidebar: #252735;
            --bg-editor: #1E1F2C;
            --bg-hover: #2D2F3E;
            --bg-active: #36384A;
            --accent: #E07C5C;
            --accent-soft: rgba(224, 124, 92, 0.12);
            --border-light: #333544;
            --text-primary: #E4E6F0;
            --text-secondary: #9AA1B5;
            --text-muted: #6E7388;
            --line-number-text: #5D6278;
            --line-number-active: #E07C5C;
            --scrollbar-thumb: #3E4052;
            --trash-badge-bg: #E57373;
        }

        body {
            background: #DCD8D0;
            font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
        }
        [data-theme="dark"] body { background: #14151F; }

        .nestxt-app {
            width: 100%;
            height: 100%;
            background: var(--bg-editor);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部栏 */
        .title-bar-modern {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
        }
        [data-theme="dark"] .title-bar-modern { background: rgba(37, 39, 53, 0.92); }
        .window-brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
        }
        .brand-text { font-weight: 600; font-size: 16px; letter-spacing: -0.3px; color: var(--text-primary); }
        .brand-text span { color: var(--accent); }
        .win-controls { display: flex; gap: 12px; }
        .close-page-btn {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-secondary);
            transition: 0.15s;
        }
        .close-page-btn:hover { background: var(--accent); color: white; }

        /* 主flex容器 */
        .main-flex {
            display: flex;
            flex: 1;
            overflow: hidden;
            background: var(--bg-app);
            position: relative;
        }

        /* 侧边栏 */
        .sidebar-nest {
            width: 280px;
            min-width: 180px;
            max-width: 500px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .resize-handle {
            width: 4px;
            background: var(--border-light);
            cursor: col-resize;
            flex-shrink: 0;
            transition: background 0.1s;
            z-index: 10;
        }
        .resize-handle:hover, .resize-handle.active-drag { background: var(--accent); }

        .sidebar-header-actions {
            padding: 20px 18px 12px 18px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border-light);
        }
        .action-btn {
            flex: 1;
            background: var(--bg-app);
            border: 1px solid var(--border-light);
            padding: 8px 0;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
        }
        .action-btn:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--accent); }
        .tree-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
        }
        .tree-row {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            border-radius: 10px;
            cursor: pointer;
            gap: 8px;
            font-size: 13px;
            color: var(--text-primary);
            transition: 0.1s;
            margin: 2px 0;
        }
        .tree-row:hover { background: var(--bg-hover); }
        .tree-row.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
        .tree-row.drag-over { background: var(--accent-soft); outline: 1px dashed var(--accent); }
        .tree-arrow {
            width: 18px;
            font-size: 10px;
            transition: transform 0.2s;
            color: var(--text-muted);
        }
        .tree-arrow.open { transform: rotate(90deg); }
        .tree-arrow.hidden { visibility: hidden; }
        .tree-icon { font-size: 16px; width: 22px; }
        .tree-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tree-del {
            opacity: 0;
            width: 22px;
            text-align: center;
            font-size: 14px;
            border-radius: 6px;
        }
        .tree-row:hover .tree-del { opacity: 0.6; }
        .tree-del:hover { background: var(--accent); color: white; opacity: 1; }
        .tree-children { margin-left: 20px; padding-left: 6px; border-left: 1px solid var(--border-light); }
        .sidebar-footer-mini {
            padding: 14px 18px;
            border-top: 1px solid var(--border-light);
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-sidebar);
        }
        .theme-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: var(--bg-hover);
            padding: 6px 12px;
            border-radius: 32px;
            transition: 0.2s;
            border: 1px solid var(--border-light);
        }
        .theme-switch-wrapper:hover { background: var(--accent-soft); }
        .theme-switch-wrapper input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); margin: 0; }
        .theme-label { font-size: 12px; font-weight: 500; color: var(--text-primary); }
        .trash-badge-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 13px;
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 40px;
            transition: 0.2s;
        }
        .trash-badge-wrapper:hover { background: var(--bg-hover); }
        .red-badge {
            background-color: var(--trash-badge-bg);
            color: white;
            border-radius: 40px;
            padding: 2px 8px;
            font-weight: 600;
            font-size: 12px;
            margin-left: 4px;
        }
        .editor-core {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-editor);
            overflow: hidden;
        }
        .search-global-bar {
            padding: 8px 24px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-light);
        }
        .search-global-input {
            width: 100%;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-light);
            background: var(--bg-app);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }
        .search-global-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
        .tab-bar-modern {
            display: flex;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-light);
            padding: 0 16px;
            gap: 6px;
            overflow-x: auto;
            flex-shrink: 0;
        }
        .tab-item {
            padding: 0 16px;
            height: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }
        .tab-item.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
        .tab-close {
            width: 18px;
            height: 18px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            opacity: 0;
        }
        .tab-item:hover .tab-close { opacity: 0.6; }
        .tab-close:hover { background: var(--accent); color: white; }
        .toolbar-row {
            padding: 10px 24px;
            background: var(--bg-editor);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .tool-group { display: flex; align-items: center; gap: 20px; }
        .font-control { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); }
        .font-control input {
            width: 56px;
            background: var(--bg-app);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 4px 8px;
            color: var(--text-primary);
            font-family: monospace;
            text-align: center;
        }
        .toggle-switch {
            background: var(--bg-hover);
            border: 1px solid var(--border-light);
            padding: 5px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .toggle-switch.active { background: var(--accent); color: white; border-color: var(--accent); }
        .import-group { display: flex; gap: 8px; }
        .import-export-btn {
            background: var(--bg-hover);
            border-radius: 30px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 12px;
            border: 1px solid var(--border-light);
        }
        .editor-single-scroll {
            flex: 1;
            display: flex;
            overflow-y: auto;
            background: var(--bg-editor);
        }
        .line-numbers-fixed {
            width: 52px;
            background: var(--bg-editor);
            border-right: 1px solid var(--border-light);
            padding: 24px 0;
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.7;
            color: var(--line-number-text);
            flex-shrink: 0;
        }
        .line-numbers-fixed div { padding-right: 12px; height: calc(1.7em); }
        .line-numbers-fixed .active-line-number { color: var(--line-number-active); font-weight: 600; }
        .editor-pure-area {
            flex: 1;
            padding: 24px 32px 80px 32px;
            background: var(--bg-editor);
        }
        .editor-paper-container {
            max-width: 860px;
            margin: 0 auto;
            width: 100%;
        }
        textarea.editor-paper-text {
            width: 100%;
            min-height: 560px;
            border: none;
            outline: none;
            resize: vertical;
            font-family: 'Inter', monospace;
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-primary);
            background: var(--bg-editor);
            padding: 0;
            margin: 0;
            caret-color: var(--accent);
        }
        .drag-overlay-active { border: 2px dashed var(--accent); background: var(--accent-soft); border-radius: 20px; transition: 0.1s; }
        .status-bar-paper {
            padding: 10px 24px;
            background: var(--bg-editor);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .stats-group { display: flex; gap: 16px; }
        .toast-message {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(44, 62, 78, 0.85);
            backdrop-filter: blur(12px);
            padding: 8px 20px;
            border-radius: 60px;
            color: white;
            font-size: 13px;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            z-index: 999;
        }
        .toast-message.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .confirm-card {
            background: var(--bg-sidebar);
            border-radius: 24px;
            padding: 24px 32px;
            width: 320px;
        }
        .trash-panel-fly {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 380px;
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border-light);
            z-index: 1100;
            transform: translateX(100%);
            transition: 0.25s;
            display: flex;
            flex-direction: column;
        }
        .trash-panel-fly.open { transform: translateX(0); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 8px; }
        button { background: none; border: none; cursor: pointer; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<div class="nestxt-app">
    <div class="title-bar-modern">
        <div class="window-brand"><div class="brand-icon">N</div><div class="brand-text">Nestxt · <span>巢叙</span></div></div>
        <div class="win-controls"><button class="close-page-btn" id="closePageBtn">✕</button></div>
    </div>
    <div class="main-flex" id="mainFlexContainer">
        <div class="sidebar-nest" id="sidebarResizeTarget">
            <div class="sidebar-header-actions">
                <button class="action-btn" id="newFileBtn">📄 新建</button>
                <button class="action-btn" id="newFolderBtn">📁 文件夹</button>
            </div>
            <div class="tree-scroll" id="treeContainer"></div>
            <div class="sidebar-footer-mini">
                <label class="theme-switch-wrapper" id="themeCheckboxWrapper">
                    <input type="checkbox" id="themeToggleCheckbox"> <span class="theme-label">🌓 深色模式</span>
                </label>
                <button id="openTrashSideBtn" class="trash-badge-wrapper">🗑️ 回收站 <span id="trashBadgeCount" class="red-badge">0</span></button>
            </div>
        </div>
        <div class="resize-handle" id="resizeHandle"></div>
        <div class="editor-core">
            <div class="search-global-bar"><input type="text" id="globalSearchInput" class="search-global-input" placeholder="🔍 搜索文档标题或内容..."></div>
            <div class="tab-bar-modern" id="tabContainer"></div>
            <div class="toolbar-row">
                <div class="tool-group">
                    <div class="font-control"><span>字号</span><input type="number" id="fontSizeInput" min="3" max="28" value="15"></div>
                    <button id="toggleLineNumbersBtn" class="toggle-switch">📏 行号</button>
                </div>
                <div class="import-group">
                    <button id="importTxtBtn" class="import-export-btn">📂 导入TXT</button>
                    <button id="exportCurrentBtn" class="import-export-btn">⬇️ 导出当前</button>
                    <button id="exportAllBtn" class="import-export-btn">📦 导出全部ZIP</button>
                </div>
            </div>
            <div class="editor-single-scroll" id="editorSingleScroll">
                <div class="line-numbers-fixed" id="lineNumbersPanel"></div>
                <div class="editor-pure-area">
                    <div class="editor-paper-container" id="dropContainer">
                        <textarea class="editor-paper-text" id="editorTextarea" placeholder="开始写作… 纸张质感，宁静书写。"></textarea>
                    </div>
                </div>
            </div>
            <div class="status-bar-paper">
                <span id="saveStatusMsg">✓ 已保存</span>
                <div class="stats-group"><span id="wordStat">0 字</span><span id="lineStat">1 行</span></div>
                <span>⏎ 自动保存 · 拖入TXT</span>
            </div>
        </div>
    </div>
</div>
<div id="globalToast" class="toast-message"></div>
<div id="confirmOverlay" class="confirm-overlay"><div class="confirm-card"><div id="confirmMsg"></div><div style="margin-top:24px;display:flex;gap:12px;justify-content:flex-end;"><button id="confirmNoBtn">取消</button><button id="confirmYesBtn" style="background:var(--accent);color:white;padding:6px 16px;border-radius:30px;">确认</button></div></div></div>
<div id="trashPanel" class="trash-panel-fly"><div style="padding:20px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;"><strong>🗑️ 废纸篓</strong><button id="closeTrashPanelBtn">✕</button></div><div id="trashItemsList" style="flex:1;overflow-y:auto;padding:12px;"></div><div style="padding:16px;border-top:1px solid var(--border-light);"><button id="clearTrashBtn" style="background:var(--accent);color:white;padding:8px;border-radius:40px;width:100%;">清空回收站</button></div></div>

<script>
    // ---------- 状态管理 ----------
    let appState = {
        nestData: [],
        currentFileId: null,
        openTabs: [],
        expandedFolders: [],
        lineNumbersEnabled: true,
        confirmCallback: null,
        autoTimer: null
    };

    // 辅助函数
    function saveToLocal(showMsg = false) {
        localStorage.setItem('nestxt_txt_data', JSON.stringify(appState.nestData));
        localStorage.setItem('nestxt_tabs_txt', JSON.stringify(appState.openTabs));
        localStorage.setItem('nestxt_expanded_txt', JSON.stringify(appState.expandedFolders));
        renderTree();
        renderTabs();
        updateTrashBadge();
        if (showMsg) document.getElementById('saveStatusMsg').innerHTML = `✓ 已保存 ${new Date().toLocaleTimeString()}`;
    }

    function showToast(msg, dur = 1300) {
        const toast = document.getElementById('globalToast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), dur);
    }

    function showConfirm(msg, onOk) {
        document.getElementById('confirmMsg').innerText = msg;
        document.getElementById('confirmOverlay').style.display = 'flex';
        appState.confirmCallback = onOk;
    }

    function updateTrashBadge() {
        const trash = JSON.parse(localStorage.getItem('nestxt_txt_trash') || '[]');
        document.getElementById('trashBadgeCount').innerText = trash.length;
    }

    // 删除逻辑 (文件/文件夹递归进回收站)
    function deleteFolderRecursivelyToTrash(folderId) {
        const children = appState.nestData.filter(item => item.parentId === folderId);
        children.forEach(child => {
            if (child.type === 'file') {
                let trash = JSON.parse(localStorage.getItem('nestxt_txt_trash') || '[]');
                trash.push({ ...child, deletedAt: Date.now() });
                localStorage.setItem('nestxt_txt_trash', JSON.stringify(trash));
                if (appState.currentFileId === child.id) closeTab(child.id);
                appState.nestData = appState.nestData.filter(i => i.id !== child.id);
            } else if (child.type === 'folder') {
                deleteFolderRecursivelyToTrash(child.id);
            }
        });
        let trash = JSON.parse(localStorage.getItem('nestxt_txt_trash') || '[]');
        const folderItem = appState.nestData.find(i => i.id === folderId);
        if (folderItem) {
            trash.push({ ...folderItem, deletedAt: Date.now() });
            localStorage.setItem('nestxt_txt_trash', JSON.stringify(trash));
            appState.nestData = appState.nestData.filter(i => i.id !== folderId);
        }
    }

    function deleteItemById(id, type) {
        const item = appState.nestData.find(i => i.id === id);
        if (!item) return;
        showConfirm(`删除「${item.name}」移至回收站？`, () => {
            if (type === 'file') {
                let trash = JSON.parse(localStorage.getItem('nestxt_txt_trash') || '[]');
                trash.push({ ...item, deletedAt: Date.now() });
                localStorage.setItem('nestxt_txt_trash', JSON.stringify(trash));
                appState.nestData = appState.nestData.filter(i => i.id !== id);
                if (appState.currentFileId === id) closeTab(id);
            } else {
                deleteFolderRecursivelyToTrash(id);
            }
            saveToLocal();
            updateTrashBadge();
            showToast('已移至废纸篓');
        });
    }

    function closeTab(id) {
        appState.openTabs = appState.openTabs.filter(t => t !== id);
        if (appState.currentFileId === id) {
            appState.currentFileId = appState.openTabs.length ? appState.openTabs[0] : null;
            if (appState.currentFileId) loadEditorContent();
            else document.getElementById('editorTextarea').value = '';
        }
        localStorage.setItem('nestxt_tabs_txt', JSON.stringify(appState.openTabs));
        renderTabs();
        renderTree();
        updateWordLineStats();
        updateLineNumbersDisplay();
    }

    function openFileById(id) {
        const file = appState.nestData.find(f => f.id === id && f.type === 'file');
        if (file) {
            if (!appState.openTabs.includes(id)) appState.openTabs.push(id);
            appState.currentFileId = id;
            localStorage.setItem('nestxt_tabs_txt', JSON.stringify(appState.openTabs));
            renderTree();
            renderTabs();
            loadEditorContent();
        }
    }

    function loadEditorContent() {
        const file = appState.nestData.find(f => f.id === appState.currentFileId && f.type === 'file');
        if (file) {
            document.getElementById('editorTextarea').value = file.content || '';
            updateWordLineStats();
            updateLineNumbers();
        }
    }

    function autoSaveCurrent() {
        if (!appState.currentFileId) return;
        const idx = appState.nestData.findIndex(f => f.id === appState.currentFileId && f.type === 'file');
        if (idx !== -1) {
            appState.nestData[idx].content = document.getElementById('editorTextarea').value;
            saveToLocal(true);
        }
    }

    function updateWordLineStats() {
        const text = document.getElementById('editorTextarea').value;
        document.getElementById('wordStat').innerText = text.length + ' 字';
        document.getElementById('lineStat').innerText = text.split(/\r?\n/).length + ' 行';
    }

    function updateLineNumbers() {
        if (!appState.lineNumbersEnabled) {
            document.getElementById('lineNumbersPanel').style.display = 'none';
            return;
        }
        document.getElementById('lineNumbersPanel').style.display = 'block';
        const text = document.getElementById('editorTextarea').value;
        const lines = text.split(/\r?\n/);
        const cursorPos = document.getElementById('editorTextarea').selectionStart;
        const currentLine = text.substring(0, cursorPos).split(/\r?\n/).length;
        let html = '';
        for (let i = 1; i <= lines.length; i++) html += `<div class="${i === currentLine ? 'active-line-number' : ''}">${i}</div>`;
        document.getElementById('lineNumbersPanel').innerHTML = html;
    }
    function updateLineNumbersDisplay() { updateLineNumbers(); }

    // 构建树渲染
    function buildTree() {
        const map = new Map();
        appState.nestData.forEach(item => { if (item.type === 'folder') map.set(item.id, { ...item, children: [] }); });
        const roots = [];
        appState.nestData.forEach(item => {
            if (item.type === 'folder') {
                const parent = item.parentId ? map.get(item.parentId) : null;
                if (parent) parent.children.push(map.get(item.id));
                else roots.push(map.get(item.id));
            }
        });
        appState.nestData.forEach(item => {
            if (item.type === 'file') {
                const parentFolder = item.parentId ? map.get(item.parentId) : null;
                const fileNode = { ...item, type: 'file' };
                if (parentFolder) parentFolder.children.push(fileNode);
                else roots.push(fileNode);
            }
        });
        return roots;
    }

    function renderTree() {
        const container = document.getElementById('treeContainer');
        if (!container) return;
        container.innerHTML = '';
        const roots = buildTree();
        const renderNodes = (items, parentEl) => {
            items.forEach(node => {
                const isFolder = node.type === 'folder';
                const isExpanded = appState.expandedFolders.includes(node.id);
                const hasChildren = isFolder && node.children?.length;
                const nodeDiv = document.createElement('div');
                const row = document.createElement('div');
                row.className = `tree-row ${(!isFolder && appState.currentFileId === node.id) ? 'active' : ''}`;
                row.setAttribute('data-id', node.id);
                row.setAttribute('data-type', node.type);
                row.draggable = true;
                row.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', JSON.stringify({ id: node.id, type: node.type })));
                row.addEventListener('dragover', (e) => { e.preventDefault(); row.classList.add('drag-over'); });
                row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
                row.addEventListener('drop', (e) => {
                    e.preventDefault();
                    row.classList.remove('drag-over');
                    const data = JSON.parse(e.dataTransfer.getData('text/plain'));
                    if (data && data.id && node.type === 'folder') moveItemToFolder(data.id, node.id);
                });
                const arrow = document.createElement('span');
                arrow.className = `tree-arrow ${isExpanded ? 'open' : ''} ${!hasChildren ? 'hidden' : ''}`;
                arrow.innerHTML = '▶';
                const iconSpan = document.createElement('span');
                iconSpan.className = 'tree-icon';
                iconSpan.innerText = isFolder ? (isExpanded ? '📂' : '📁') : '📄';
                const label = document.createElement('span');
                label.className = 'tree-label';
                label.innerText = node.name;
                const delBtn = document.createElement('span');
                delBtn.className = 'tree-del';
                delBtn.innerText = '✕';
                delBtn.onclick = (e) => { e.stopPropagation(); deleteItemById(node.id, node.type); };
                row.appendChild(arrow); row.appendChild(iconSpan); row.appendChild(label); row.appendChild(delBtn);
                nodeDiv.appendChild(row);
                if (isFolder) row.onclick = () => toggleFolder(node.id);
                else row.onclick = () => openFileById(node.id);
                if (hasChildren && isExpanded) {
                    const childDiv = document.createElement('div');
                    childDiv.className = 'tree-children';
                    renderNodes(node.children, childDiv);
                    nodeDiv.appendChild(childDiv);
                }
                parentEl.appendChild(nodeDiv);
            });
        };
        renderNodes(roots, container);
    }

    function toggleFolder(id) {
        if (appState.expandedFolders.includes(id)) appState.expandedFolders = appState.expandedFolders.filter(i => i !== id);
        else appState.expandedFolders.push(id);
        localStorage.setItem('nestxt_expanded_txt', JSON.stringify(appState.expandedFolders));
        renderTree();
    }

    function moveItemToFolder(sourceId, targetFolderId) {
        const sourceItem = appState.nestData.find(i => i.id === sourceId);
        if (sourceItem && sourceItem.parentId !== targetFolderId) {
            sourceItem.parentId = targetFolderId;
            saveToLocal();
            showToast('已移动');
            if (sourceItem.type === 'file' && appState.currentFileId === sourceId) loadEditorContent();
        }
    }

    function renderTabs() {
        const container = document.getElementById('tabContainer');
        if (!container) return;
        container.innerHTML = '';
        appState.openTabs.forEach(tabId => {
            const file = appState.nestData.find(f => f.id === tabId && f.type === 'file');
            if (!file) return;
            const tab = document.createElement('div');
            tab.className = `tab-item ${appState.currentFileId === tabId ? 'active' : ''}`;
            const nameSpan = document.createElement('span');
            nameSpan.innerText = file.name;
            const closeSpan = document.createElement('span');
            closeSpan.className = 'tab-close';
            closeSpan.innerText = '✕';
            closeSpan.onclick = (e) => { e.stopPropagation(); closeTab(tabId); };
            tab.appendChild(nameSpan); tab.appendChild(closeSpan);
            tab.onclick = () => { if (appState.currentFileId !== tabId) openFileById(tabId); };
            container.appendChild(tab);
        });
    }

    // 新建，导入导出等
    function createNewFile() {
        const root = appState.nestData.find(f => f.type === 'folder' && f.parentId === null);
        if (root) {
            const newId = 'f_' + Date.now() + '_' + Math.random();
            appState.nestData.push({ id: newId, name: '未命名.txt', type: 'file', parentId: root.id, content: '' });
            saveToLocal();
            openFileById(newId);
        }
    }
    function createNewFolder() {
        const root = appState.nestData.find(f => f.type === 'folder' && f.parentId === null);
        if (root) {
            const newId = 'fol_' + Date.now() + '_' + Math.random();
            appState.nestData.push({ id: newId, name: '新建文件夹', type: 'folder', parentId: root.id });
            saveToLocal();
        }
    }
    function globalSearch(keyword) {
        const kw = keyword.trim().toLowerCase();
        if (!kw) { renderTree(); return; }
        const results = appState.nestData.filter(f => f.type === 'file' && (f.name.toLowerCase().includes(kw) || (f.content || '').toLowerCase().includes(kw)));
        const container = document.getElementById('treeContainer');
        container.innerHTML = '';
        if (!results.length) { container.innerHTML = '<div style="padding:12px;color:var(--text-muted);">未找到</div>'; return; }
        results.forEach(file => {
            const div = document.createElement('div');
            div.className = 'tree-row';
            div.innerHTML = `<span class="tree-icon">📄</span><span class="tree-label">${escapeHtml(file.name)}</span>`;
            div.onclick = () => openFileById(file.id);
            container.appendChild(div);
        });
    }
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
    function importTxtFile() {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = '.txt';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (file && file.name.endsWith('.txt')) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const root = appState.nestData.find(f => f.type === 'folder' && f.parentId === null);
                    if (root) {
                        const newId = 'file_import_' + Date.now();
                        appState.nestData.push({ id: newId, name: file.name, type: 'file', parentId: root.id, content: ev.target.result });
                        saveToLocal();
                        openFileById(newId);
                        showToast(`已导入 ${file.name}`);
                    }
                };
                reader.readAsText(file, 'UTF-8');
            } else showToast('仅支持 .txt');
        };
        input.click();
    }
    function exportCurrentFile() {
        if (!appState.currentFileId) return;
        const file = appState.nestData.find(f => f.id === appState.currentFileId && f.type === 'file');
        if (file) {
            const blob = new Blob([file.content || ''], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = file.name;
            a.click();
            URL.revokeObjectURL(a.href);
            showToast(`已导出 ${file.name}`);
        }
    }
    async function exportAllAsZip() {
        const files = appState.nestData.filter(f => f.type === 'file');
        if (!files.length) { showToast('无文件'); return; }
        const zip = new JSZip();
        files.forEach(f => zip.file(f.name, f.content || ''));
        const blob = await zip.generateAsync({ type: 'blob' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `nestxt_${Date.now()}.zip`;
        a.click();
        URL.revokeObjectURL(a.href);
        showToast(`已导出${files.length}个文档`);
    }
    function setupDragAndDropImport() {
        const area = document.getElementById('dropContainer');
        area.addEventListener('dragover', (e) => { e.preventDefault(); area.classList.add('drag-overlay-active'); });
        area.addEventListener('dragleave', () => area.classList.remove('drag-overlay-active'));
        area.addEventListener('drop', (e) => {
            e.preventDefault(); area.classList.remove('drag-overlay-active');
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.txt')) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const root = appState.nestData.find(f => f.type === 'folder' && !f.parentId);
                    if (root) {
                        const id = 'drop_' + Date.now();
                        appState.nestData.push({ id, name: file.name, type: 'file', parentId: root.id, content: ev.target.result });
                        saveToLocal();
                        openFileById(id);
                        showToast(`已导入 ${file.name}`);
                    }
                };
                reader.readAsText(file, 'UTF-8');
            } else showToast('请拖入txt文件');
        });
    }
    function openTrashPanel() {
        let trash = JSON.parse(localStorage.getItem('nestxt_txt_trash') || '[]');
        const listDiv = document.getElementById('trashItemsList');
        listDiv.innerHTML = '';
        trash.forEach(t => {
            const div = document.createElement('div');
            div.style.padding = '10px'; div.style.borderBottom = '1px solid var(--border-light)';
            div.innerHTML = `<div><strong>${escapeHtml(t.name)}</strong> <span style="font-size:10px;">${t.type}</span></div><div style="margin-top:6px;display:flex;gap:8px;"><button class="restoreBtn" data-id="${t.id}" style="background:var(--accent-soft);padding:2px 10px;border-radius:30px;">恢复</button> <button class="permBtn" data-id="${t.id}" style="background:var(--bg-hover);padding:2px 10px;border-radius:30px;">永久删除</button></div>`;
            listDiv.appendChild(div);
        });
        document.querySelectorAll('.restoreBtn').forEach(btn => btn.addEventListener('click', () => {
            let id = btn.getAttribute('data-id');
            let arr = JSON.parse(localStorage.getItem('nestxt_txt_trash') || '[]');
            let item = arr.find(x => x.id == id);
            if (item) {
                if (item.type === 'file') appState.nestData.push({ id: item.id, name: item.name, type: 'file', parentId: item.parentId, content: item.content || '' });
                else appState.nestData.push({ id: item.id, name: item.name, type: 'folder', parentId: item.parentId });
                localStorage.setItem('nestxt_txt_trash', JSON.stringify(arr.filter(x => x.id != id)));
                saveToLocal();
                openTrashPanel();
                showToast('已恢复');
            }
        }));
        document.querySelectorAll('.permBtn').forEach(btn => btn.addEventListener('click', () => {
            let id = btn.getAttribute('data-id');
            let arr = JSON.parse(localStorage.getItem('nestxt_txt_trash') || '[]');
            localStorage.setItem('nestxt_txt_trash', JSON.stringify(arr.filter(x => x.id != id)));
            openTrashPanel();
            updateTrashBadge();
            showToast('永久删除');
        }));
        document.getElementById('trashPanel').classList.add('open');
    }

    function initResize() {
        const handle = document.getElementById('resizeHandle');
        const sidebar = document.getElementById('sidebarResizeTarget');
        let startX, startWidth;
        function onMouseMove(e) {
            let newWidth = startWidth + (e.clientX - startX);
            newWidth = Math.min(500, Math.max(180, newWidth));
            sidebar.style.width = newWidth + 'px';
            localStorage.setItem('nestxt_sidebar_width', newWidth);
        }
        function onMouseUp() {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
            handle.classList.remove('active-drag');
            document.body.style.cursor = '';
        }
        handle.addEventListener('mousedown', (e) => {
            startX = e.clientX; startWidth = sidebar.offsetWidth;
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
            handle.classList.add('active-drag');
            document.body.style.cursor = 'col-resize';
            e.preventDefault();
        });
    }

    function initLoad() {
        const storedData = localStorage.getItem('nestxt_txt_data');
        if (storedData) appState.nestData = JSON.parse(storedData);
        else {
            const rootId = 'root_' + Date.now();
            appState.nestData = [
                { id: rootId, name: '我的文稿', type: 'folder', parentId: null },
                { id: 'file_welcome', name: '欢迎.txt', type: 'file', parentId: rootId, content: '欢迎来到 Nestxt 文本编辑器\n陶土橙色点缀，纸张质感。\n支持拖拽移动、自动保存。\n拖入txt文件即可导入。' },
                { id: 'file_note', name: '笔记.txt', type: 'file', parentId: rootId, content: '书写就是回归宁静。' }
            ];
        }
        const savedTabs = localStorage.getItem('nestxt_tabs_txt');
        appState.openTabs = savedTabs ? JSON.parse(savedTabs) : (appState.nestData.find(f => f.type === 'file') ? [appState.nestData.find(f => f.type === 'file').id] : []);
        const savedExpanded = localStorage.getItem('nestxt_expanded_txt');
        appState.expandedFolders = savedExpanded ? JSON.parse(savedExpanded) : [];
        const lineState = localStorage.getItem('nestxt_linenum');
        appState.lineNumbersEnabled = lineState !== null ? lineState === 'true' : true;
        const theme = localStorage.getItem('nestxt_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('themeToggleCheckbox').checked = theme === 'dark';
        const savedWidth = localStorage.getItem('nestxt_sidebar_width');
        if (savedWidth) document.getElementById('sidebarResizeTarget').style.width = Math.min(500, Math.max(180, parseInt(savedWidth))) + 'px';
        appState.currentFileId = appState.openTabs.length ? appState.openTabs[0] : null;
        saveToLocal(false);
        if (appState.currentFileId) loadEditorContent();
        else document.getElementById('editorTextarea').value = '';
        updateLineNumbersDisplay();
        const lineBtn = document.getElementById('toggleLineNumbersBtn');
        if (appState.lineNumbersEnabled) lineBtn.classList.add('active');
        else lineBtn.classList.remove('active');
        const savedFont = localStorage.getItem('nestxt_fontsize');
        if (savedFont) { let sz = parseInt(savedFont); if (sz < 3) sz = 3; document.getElementById('editorTextarea').style.fontSize = sz + 'px'; document.getElementById('fontSizeInput').value = sz; }
    }

    window.addEventListener('load', () => {
        initResize();
        initLoad();
        setupDragAndDropImport();
        document.getElementById('closePageBtn').onclick = () => { autoSaveCurrent(); showToast('请手动关闭标签页'); };
        document.getElementById('newFileBtn').onclick = createNewFile;
        document.getElementById('newFolderBtn').onclick = createNewFolder;
        document.getElementById('openTrashSideBtn').onclick = openTrashPanel;
        document.getElementById('closeTrashPanelBtn').onclick = () => document.getElementById('trashPanel').classList.remove('open');
        document.getElementById('clearTrashBtn').onclick = () => { localStorage.setItem('nestxt_txt_trash', '[]'); updateTrashBadge(); document.getElementById('trashPanel').classList.remove('open'); showToast('已清空'); };
        document.getElementById('globalSearchInput').addEventListener('input', (e) => globalSearch(e.target.value));
        const editor = document.getElementById('editorTextarea');
        editor.addEventListener('input', () => { updateWordLineStats(); updateLineNumbers(); if (appState.autoTimer) clearTimeout(appState.autoTimer); appState.autoTimer = setTimeout(autoSaveCurrent, 600); });
        editor.addEventListener('click', updateLineNumbers);
        editor.addEventListener('keyup', updateLineNumbers);
        document.getElementById('fontSizeInput').addEventListener('change', (e) => { let size = Math.max(3, parseInt(e.target.value) || 15); editor.style.fontSize = size + 'px'; localStorage.setItem('nestxt_fontsize', size); e.target.value = size; });
        document.getElementById('toggleLineNumbersBtn').onclick = () => {
            appState.lineNumbersEnabled = !appState.lineNumbersEnabled;
            localStorage.setItem('nestxt_linenum', appState.lineNumbersEnabled);
            const btn = document.getElementById('toggleLineNumbersBtn');
            if (appState.lineNumbersEnabled) btn.classList.add('active'); else btn.classList.remove('active');
            updateLineNumbersDisplay();
        };
        document.getElementById('importTxtBtn').onclick = importTxtFile;
        document.getElementById('exportCurrentBtn').onclick = exportCurrentFile;
        document.getElementById('exportAllBtn').onclick = exportAllAsZip;
        document.getElementById('themeToggleCheckbox').addEventListener('change', (e) => {
            const newTheme = e.target.checked ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('nestxt_theme', newTheme);
        });
        window.addEventListener('keydown', (e) => { if (e.ctrlKey && e.key === 's') { e.preventDefault(); autoSaveCurrent(); } });
        setInterval(() => { if (appState.currentFileId) autoSaveCurrent(); }, 30000);
        document.getElementById('confirmYesBtn').onclick = () => { if (appState.confirmCallback) appState.confirmCallback(); document.getElementById('confirmOverlay').style.display = 'none'; appState.confirmCallback = null; };
        document.getElementById('confirmNoBtn').onclick = () => document.getElementById('confirmOverlay').style.display = 'none';
    });
</script>
</body>
</html>
