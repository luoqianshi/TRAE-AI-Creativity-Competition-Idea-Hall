        }

        async function drawFortune() {
            if (isSpinning) return;

            isSpinning = true;
            const btn = document.getElementById('fortuneBtn');
            const display = document.getElementById('slotDisplay');
            const label = document.getElementById('slotLabel');
            const resultCard = document.getElementById('resultCard');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');

            // Reset
            btn.disabled = true;
            resultCard.classList.remove('show');
            display.classList.add('spinning');
            progressBar.classList.add('active');
            label.textContent = '求签中...';

            // Spin animation
            const spinDuration = 2500;
            const spinInterval = 80;
            let elapsed = 0;

            const spinTimer = setInterval(() => {
                const randomText = spinningTexts[Math.floor(Math.random() * spinningTexts.length)];
                const randomFortune = fortunes[Math.floor(Math.random() * fortunes.length)];
                display.textContent = Math.random() > 0.5 ? randomText : randomFortune.text;

                elapsed += spinInterval;
                const progress = Math.min((elapsed / spinDuration) * 100, 100);
                progressFill.style.width = progress + '%';

                if (elapsed >= spinDuration) {
                    clearInterval(spinTimer);
                    showResult();
                }
            }, spinInterval);

            function showResult() {
                const result = fortunes[Math.floor(Math.random() * fortunes.length)];
                const now = new Date();
                const timeStr = now.toLocaleString('zh-CN');

                display.classList.remove('spinning');
                display.textContent = result.text;
                label.textContent = '求签完成';
                progressBar.classList.remove('active');
                progressFill.style.width = '0%';

                // Show result card
                document.getElementById('resultTitle').textContent = result.category + '运势';
                document.getElementById('resultContent').textContent = result.text;
                document.getElementById('timestamp').textContent = timeStr;

                const levelEl = document.getElementById('fortuneLevel');
                levelEl.className = 'fortune-level ' + result.level;
                levelEl.textContent = getLevelText(result.level);

                resultCard.classList.add('show');

                // Update count
                drawCount++;
                document.getElementById('count').textContent = drawCount;

                // Add to history
                addToHistory(result, timeStr);

                // Re-enable button
                btn.disabled = false;
                isSpinning = false;
            }
        }

        function getLevelText(level) {
            switch (level) {
                case 'good': return '吉';
                case 'bad': return '凶';
                case 'neutral': return '平';
                default: return '?';
            }
        }

        function getLevelClass(level) {
            switch (level) {
                case 'good': return 'history-tag good';
                case 'bad': return 'history-tag bad';
                case 'neutral': return 'history-tag neutral';
                default: return 'history-tag';
            }
        }

        function addToHistory(result, timeStr) {
            const historySection = document.getElementById('historySection');
            const historyList = document.getElementById('historyList');

            history.unshift({ result, timeStr });
            if (history.length > 10) history.pop();

            historySection.style.display = 'block';

            const item = document.createElement('li');
            item.className = 'history-item';
            item.style.animation = 'slideUp 0.3s ease';
            item.innerHTML = `
                <span class="history-text">${result.text}</span>
                <span>
                    <span class="history-tag ${result.level}">${getLevelText(result.level)}</span>
                    <span class="timestamp">${timeStr.split(' ')[1]}</span>
                </span>
            `;

            historyList.insertBefore(item, historyList.firstChild);

            // Remove old items if needed
            while (historyList.children.length > 10) {
                historyList.removeChild(historyList.lastChild);
            }
        }

        // Add styles for history tags
        const style = document.createElement('style');
        style.textContent = `
            .history-tag.good {
                background: rgba(5, 255, 161, 0.15);
                color: var(--success);
                border: 1px solid var(--success);
            }
            .history-tag.bad {
                background: rgba(255, 42, 109, 0.15);
                color: var(--accent2);
                border: 1px solid var(--accent2);
            }
            .history-tag.neutral {
                background: rgba(255, 204, 0, 0.15);
                color: var(--warning);
                border: 1px solid var(--warning);
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
