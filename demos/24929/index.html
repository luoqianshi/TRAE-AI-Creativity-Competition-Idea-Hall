<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 暖阳 — 银发族智能生活助手</title>
<style>
:root {
  --bg: #fff8f0;
  --card: #fff;
  --accent: #ff8c42;
  --accent2: #ff6b35;
  --text: #3d2c1e;
  --sub: #8b7355;
  --border: #f0dcc8;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  font-size: 17px; /* 适老字号 */
}
.hero {
  text-align: center; padding: 40px 20px 20px;
  background: linear-gradient(180deg, #fff3e6 0%, var(--bg) 100%);
}
.hero h1 { font-size: 2em; font-weight: 800; color: var(--accent2); }
.hero .sub { color: var(--sub); margin-top: 6px; font-size: 1.1em; }
.hero .sun { font-size: 2.2em; display: block; margin-bottom: 6px; }

.container { max-width: 600px; margin: 0 auto; padding: 0 20px 50px; }

/* 大字体天气卡片 */
.weather-card {
  background: var(--card); border-radius: 24px; padding: 28px;
  margin: 16px 0; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,.05);
  border: 2px solid var(--border);
}
.weather-card .w-icon { font-size: 4em; display: block; margin-bottom: 4px; }
.weather-card .w-temp { font-size: 3em; font-weight: 800; color: var(--accent2); }
.weather-card .w-desc { font-size: 1.2em; color: var(--sub); margin-top: 4px; }
.weather-card .w-tip {
  background: #fff3e6; border-radius: 12px; padding: 12px; margin-top: 12px;
  font-size: 1em; color: var(--accent2);
}

/* 功能按钮 - 大号触控 */
.action-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0;
}
.action-btn {
  padding: 24px 16px; border-radius: 20px; border: 2px solid var(--border);
  background: var(--card); cursor: pointer; text-align: center; transition: all .3s;
  font-family: inherit; font-size: 1.1em; box-shadow: 0 2px 10px rgba(0,0,0,.03);
}
.action-btn:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(255,140,66,.15); }
.action-btn:active { transform: scale(.97); }
.action-btn .icon { font-size: 2.5em; display: block; margin-bottom: 6px; }
.action-btn .label { font-weight: 700; color: var(--text); }
.action-btn .sub-label { font-size: .8em; color: var(--sub); margin-top: 2px; }

/* 语音按钮 */
.voice-btn {
  display: block; width: 100%; padding: 20px; border-radius: 50px; border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; font-size: 1.3em; font-weight: 700; cursor: pointer;
  margin: 16px 0; transition: all .3s; box-shadow: 0 4px 16px rgba(255,107,53,.3);
  font-family: inherit;
}
.voice-btn:hover { transform: translateY(-1px); }
.voice-btn:active { transform: scale(.98); }
.voice-btn.listening { animation: pulse 1.5s ease-in-out infinite; background: #e74c3c; }
@keyframes pulse { 0%,100%{ box-shadow: 0 0 0 0 rgba(231,76,60,.5) } 50%{ box-shadow: 0 0 0 20px rgba(231,76,60,0) } }

/* 提醒卡片 */
.reminder-section { margin: 20px 0; }
.reminder-section h3 { font-size: 1.3em; color: var(--accent2); margin-bottom: 10px; }
.reminder-card {
  background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 10px;
  border: 2px solid var(--border); display: flex; align-items: center; gap: 14px;
}
.reminder-card .r-icon { font-size: 2em; min-width: 48px; text-align: center; }
.reminder-card .r-info { flex: 1; }
.reminder-card .r-title { font-weight: 700; }
.reminder-card .r-time { font-size: .9em; color: var(--sub); margin-top: 3px; }
.reminder-card .r-toggle {
  padding: 8px 16px; border-radius: 20px; border: 2px solid var(--accent);
  background: transparent; color: var(--accent); font-weight: 700; cursor: pointer;
  font-family: inherit; font-size: .9em; transition: all .3s;
}
.reminder-card .r-toggle.on { background: var(--accent); color: #fff; }

/* 语音反馈弹窗 */
.voice-popup {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: var(--card); border-radius: 28px; padding: 36px; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.15); z-index: 100; display: none;
  border: 2px solid var(--border); min-width: 280px;
}
.voice-popup.show { display: block; animation: popIn .3s; }
@keyframes popIn { from{opacity:0;transform:translate(-50%,-50%) scale(.9);} to{opacity:1;transform:translate(-50%,-50%) scale(1);} }
.voice-popup .vp-icon { font-size: 3em; display: block; margin-bottom: 8px; }
.voice-popup .vp-text { font-size: 1.2em; color: var(--text); }
.voice-popup .vp-close {
  margin-top: 16px; padding: 10px 28px; border-radius: 14px; border: none;
  background: var(--accent); color: #fff; font-size: 1em; cursor: pointer;
  font-family: inherit; font-weight: 700;
}

/* 紧急联系 */
.emergency {
  background: #fff5f5; border-radius: 20px; padding: 20px; margin-top: 20px;
  border: 2px solid #ffcccc; text-align: center;
}
.emergency h3 { color: #e74c3c; font-size: 1.2em; }
.emergency .contacts { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.emergency .contact-chip {
  padding: 12px 20px; border-radius: 14px; background: #fff;
  border: 2px solid #ffcccc; cursor: pointer; font-weight: 700;
  font-family: inherit; font-size: 1em; transition: all .3s;
}
.emergency .contact-chip:hover { background: #ffcccc; transform: scale(1.03); }

/* 大字版本切换 */
.font-control {
  display: flex; gap: 8px; justify-content: center; margin: 10px 0;
}
.font-btn {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); cursor: pointer; font-family: inherit;
}
.font-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>

<div class="hero">
  <span class="sun">☀️</span>
  <h1>AI 暖阳</h1>
  <div class="sub">银发族智能生活助手 · 语音交互 · 简单贴心</div>
</div>

<div class="container">
  <!-- 天气 -->
  <div class="weather-card" id="weatherCard">
    <span class="w-icon">☀️</span>
    <div class="w-temp" id="wTemp">32°</div>
    <div class="w-desc" id="wDesc">晴 · 深圳南山</div>
    <div class="w-tip" id="wTip">💡 今天天气热，记得多喝水，出门带把遮阳伞哦！</div>
  </div>

  <!-- 语音按钮 -->
  <button class="voice-btn" id="voiceBtn">🎤 按住说话，暖暖帮你</button>

  <!-- 功能入口 -->
  <div class="action-grid">
    <button class="action-btn" onclick="voiceAction('今天吃什么')">
      <span class="icon">🍲</span>
      <span class="label">今天吃什么</span>
      <span class="sub-label">推荐营养餐</span>
    </button>
    <button class="action-btn" onclick="voiceAction('吃药提醒')">
      <span class="icon">💊</span>
      <span class="label">吃药提醒</span>
      <span class="sub-label">按时服药</span>
    </button>
    <button class="action-btn" onclick="voiceAction('听听新闻')">
      <span class="icon">📢</span>
      <span class="label">听听新闻</span>
      <span class="sub-label">今日要闻</span>
    </button>
    <button class="action-btn" onclick="voiceAction('健康操')">
      <span class="icon">🧘</span>
      <span class="label">健康操</span>
      <span class="sub-label">舒展身体</span>
    </button>
    <button class="action-btn" onclick="voiceAction('打电话')">
      <span class="icon">📞</span>
      <span class="label">打电话</span>
      <span class="sub-label">联系家人</span>
    </button>
    <button class="action-btn" onclick="voiceAction('放大字体')">
      <span class="icon">🔍</span>
      <span class="label">放大字体</span>
      <span class="sub-label">看得更清</span>
    </button>
  </div>

  <!-- 提醒 -->
  <div class="reminder-section">
    <h3>⏰ 今日提醒</h3>
    <div class="reminder-card">
      <span class="r-icon">💊</span>
      <div class="r-info">
        <div class="r-title">降压药</div>
        <div class="r-time">每天上午 8:00 · 每日一次</div>
      </div>
      <button class="r-toggle on" onclick="toggleReminder(this)">已开启</button>
    </div>
    <div class="reminder-card">
      <span class="r-icon">🥗</span>
      <div class="r-info">
        <div class="r-title">午餐时间</div>
        <div class="r-time">每天中午 12:00</div>
      </div>
      <button class="r-toggle on" onclick="toggleReminder(this)">已开启</button>
    </div>
    <div class="reminder-card">
      <span class="r-icon">🚶</span>
      <div class="r-info">
        <div class="r-title">饭后散步</div>
        <div class="r-time">每天下午 18:30</div>
      </div>
      <button class="r-toggle on" onclick="toggleReminder(this)">已开启</button>
    </div>
  </div>

  <!-- 紧急联系 -->
  <div class="emergency">
    <h3>🆘 紧急联系</h3>
    <div class="contacts">
      <button class="contact-chip" onclick="voiceAction('拨打儿子电话')">👦 儿子</button>
      <button class="contact-chip" onclick="voiceAction('拨打女儿电话')">👧 女儿</button>
      <button class="contact-chip" onclick="voiceAction('拨打120')">🏥 120</button>
    </div>
  </div>
</div>

<!-- 语音反馈弹窗 -->
<div class="voice-popup" id="voicePopup">
  <span class="vp-icon" id="vpIcon">🤖</span>
  <div class="vp-text" id="vpText"></div>
  <button class="vp-close" onclick="closePopup()">知道了，谢谢~</button>
</div>

<script>
const responses = {
  '今天吃什么': '根据您的健康档案，暖暖建议今天吃：清蒸鲈鱼 + 炒青菜 + 一碗米饭，清淡有营养，对血压也好哦~',
  '吃药提醒': '您今天还有 1 次药需要服用：降压药，晚上 8:00 记得吃。已经帮您设好提醒啦！',
  '听听新闻': '今日头条：本地高温持续，预计明天有雷阵雨，出门记得带伞。社区老年活动中心周六有太极拳课程，欢迎参加~',
  '健康操': '暖暖为您推荐「八段锦」第三式：调理脾胃须单举。跟着我做：左手向上托天，右手向下按地，保持5秒，换边重复。每天做8次，对消化特别好！',
  '打电话': '您想给谁打电话呢？儿子、女儿、还是社区医生？直接告诉暖暖就行~',
  '放大字体': '字体已调大！如果还看不清，随时告诉暖暖，我帮您把字再放大一些。',
};

function voiceAction(action) {
  const popup = document.getElementById('voicePopup');
  const text = responses[action] || `好的，暖暖收到您的「${action}」请求，正在为您处理……`;
  document.getElementById('vpText').textContent = text;
  document.getElementById('vpIcon').textContent = action === '健康操' ? '🧘' : action === '吃药提醒' ? '💊' : '🤖';
  popup.classList.add('show');
  simulateVoice();
}

function closePopup() {
  document.getElementById('voicePopup').classList.remove('show');
}

function toggleReminder(btn) {
  if (btn.classList.contains('on')) {
    btn.classList.remove('on');
    btn.textContent = '已关闭';
    btn.style.borderColor = '#ccc';
    btn.style.color = '#999';
    btn.style.background = 'transparent';
  } else {
    btn.classList.add('on');
    btn.textContent = '已开启';
    btn.style.borderColor = '';
    btn.style.color = '';
    btn.style.background = '';
  }
}

// 语音按钮动画
const voiceBtn = document.getElementById('voiceBtn');
let voiceTimer;
voiceBtn.addEventListener('mousedown', () => {
  voiceBtn.classList.add('listening');
  voiceBtn.textContent = '🎤 正在聆听……';
  voiceTimer = setTimeout(() => {
    voiceBtn.classList.remove('listening');
    voiceBtn.textContent = '🎤 按住说话，暖暖帮你';
    const prompts = ['今天天气不错，建议出门走走~', '您有一通女儿的电话未接，要回拨吗？', '社区明天有免费体检活动哦~'];
    document.getElementById('vpText').textContent = prompts[Math.floor(Math.random() * prompts.length)];
    document.getElementById('vpIcon').textContent = '🎤';
    document.getElementById('voicePopup').classList.add('show');
  }, 2000);
});
voiceBtn.addEventListener('mouseup', () => {
  clearTimeout(voiceTimer);
  voiceBtn.classList.remove('listening');
  voiceBtn.textContent = '🎤 按住说话，暖暖帮你';
});
voiceBtn.addEventListener('mouseleave', () => {
  clearTimeout(voiceTimer);
  voiceBtn.classList.remove('listening');
  voiceBtn.textContent = '🎤 按住说话，暖暖帮你';
});

function simulateVoice() {
  const btn = voiceBtn;
  btn.classList.add('listening');
  btn.textContent = '🎤 正在聆听……';
  setTimeout(() => {
    btn.classList.remove('listening');
    btn.textContent = '🎤 按住说话，暖暖帮你';
  }, 1000);
}

// 模拟天气变化
const weathers = [
  { icon:'☀️',temp:'32°',desc:'晴 · 深圳南山',tip:'💡 今天天气热，记得多喝水，出门带把遮阳伞哦！' },
  { icon:'🌧️',temp:'26°',desc:'雷阵雨 · 深圳南山',tip:'💡 今天有雨，出门记得带伞，路滑走路小心一点~' },
  { icon:'☁️',temp:'28°',desc:'多云 · 深圳南山',tip:'💡 今天气温舒适，很适合出门散步或去公园坐坐~' },
];
let wi = 0;
setInterval(() => {
  wi = (wi + 1) % weathers.length;
  const w = weathers[wi];
  document.getElementById('wTemp').textContent = w.temp;
  document.getElementById('wDesc').textContent = w.desc;
  document.getElementById('wTip').textContent = w.tip;
  document.querySelector('.w-icon').textContent = w.icon;
}, 15000);
</script>
</body>
</html>
