<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4CAF50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="衡健">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>衡健·作息平衡管家 - Demo</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="status-bar">
        <span class="time" id="statusTime">12:00</span>
        <div class="status-icons">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3C7.46 3 3.34 5.78 1.18 9.88c-.19.36-.18.79.03 1.14L2.4 13l1.19-1.98c.18-.3.5-.48.85-.48h15.12c.35 0 .67.18.85.48L21.6 13l1.19-1.98c.21-.35.22-.78.03-1.14C20.66 5.78 16.54 3 12 3z"/>
          </svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/>
          </svg>
        </div>
      </div>

      <div class="app-header">
        <h1 class="app-title" id="pageTitle">首页</h1>
        <div class="header-actions">
          <button class="icon-btn" onclick="showNotification()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="badge">3</span>
          </button>
        </div>
      </div>

      <div class="page-content" id="pageContent">
      </div>

      <div class="bottom-nav">
        <div class="nav-item active" data-page="home" onclick="switchPage('home')">
          <div class="nav-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
          <span>首页</span>
        </div>
        <div class="nav-item" data-page="nutrition" onclick="switchPage('nutrition')">
          <div class="nav-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
              <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
              <line x1="6" y1="1" x2="6" y2="4"/>
              <line x1="10" y1="1" x2="10" y2="4"/>
              <line x1="14" y1="1" x2="14" y2="4"/>
            </svg>
          </div>
          <span>饮食</span>
        </div>
        <div class="nav-item" data-page="sleep" onclick="switchPage('sleep')">
          <div class="nav-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
          </div>
          <span>作息</span>
        </div>
        <div class="nav-item" data-page="cat" onclick="switchPage('cat')">
          <div class="nav-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a8 8 0 0 0-8 8c0 5.5 4 8 8 12 4-4 8-6.5 8-12a8 8 0 0 0-8-8z"/>
              <circle cx="9" cy="10" r="1"/>
              <circle cx="15" cy="10" r="1"/>
              <path d="M9 15c.5 1 1.5 1.5 3 1.5s2.5-.5 3-1.5"/>
            </svg>
          </div>
          <span>猫咪</span>
        </div>
        <div class="nav-item" data-page="social" onclick="switchPage('social')">
          <div class="nav-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <span>社交</span>
        </div>
      </div>
    </div>

    <div class="info-panel">
      <h2>衡健·作息平衡管家</h2>
      <p class="subtitle">全维度健康自律管理系统</p>
      <div class="feature-tags">
        <span class="tag">一人食营养</span>
        <span class="tag">作息监测</span>
        <span class="tag">健康负债</span>
        <span class="tag">学习联动</span>
      </div>
      <div class="instruction">
        <h3>操作指南</h3>
        <ul>
          <li>点击底部导航切换不同功能页面</li>
          <li>页面内按钮均可点击交互</li>
          <li>体验完整的App功能流程</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modalTitle">提示</h3>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modalBody">
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <span id="toastMessage"></span>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('PWA Service Worker 已注册');
        }).catch(err => {
          console.log('SW 注册失败:', err);
        });
      });
    }
  </script>
</body>
</html>
