<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>幸福社区 · 像素物语</title>
  <link rel="stylesheet" href="pixel-styles.css" />
</head>
<body>
  <div id="game-root">
    <canvas id="game-canvas" width="640" height="480" tabindex="0"></canvas>

    <div class="hud-top">
      <div class="hud-title">🏡 幸福社区 · 像素物语</div>
      <div class="hud-hint">方向键 / WASD 移动 · 走到设施前按 E 或 空格 交互</div>
    </div>

    <div class="hud-bottom">
      <div class="hud-status" id="hudStatus">📍 幸福社区广场</div>
      <div class="hud-action" id="hudAction"></div>
    </div>

    <!-- 现实面板：游戏交互到的真实信息 -->
    <div class="real-modal" id="realModal">
      <div class="real-mask" data-close></div>
      <div class="real-panel">
        <div class="real-header">
          <div class="real-title" id="realTitle">📋 社区公告</div>
          <button class="real-close" data-close aria-label="关闭">✕</button>
        </div>
        <div class="real-content" id="realContent"></div>
        <div class="real-footer">
          <button class="real-back" data-close>← 返回社区</button>
        </div>
      </div>
    </div>

    <!-- 移动端虚拟方向键 -->
    <div class="mobile-controls" id="mobileControls">
      <div class="dpad">
        <button data-key="ArrowUp" aria-label="上">▲</button>
        <div class="dpad-mid">
          <button data-key="ArrowLeft" aria-label="左">◀</button>
          <button data-key="ArrowRight" aria-label="右">▶</button>
        </div>
        <button data-key="ArrowDown" aria-label="下">▼</button>
      </div>
      <button class="action-btn" data-key="e" aria-label="交互">E 交互</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
