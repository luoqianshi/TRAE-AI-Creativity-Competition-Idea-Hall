<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创作作品 - 趣享</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="create-page">
    <div class="container">
      <h2 class="section-title">
        <span class="emoji">🎨</span>
        创作你的作品
      </h2>
      
      <div class="create-layout">
        <div class="canvas-container card fade-in">
          <div class="canvas-toolbar">
            <div style="display: flex; gap: 8px;">
              <button class="tool-btn active" onclick="App.setDrawColor(this, '#333333')" title="黑色">✏️</button>
              <button class="tool-btn" onclick="App.setDrawColor(this, '#FF8C42')" title="橙色">🟠</button>
              <button class="tool-btn" onclick="App.setDrawColor(this, '#4ECDC4')" title="薄荷绿">🟢</button>
              <button class="tool-btn" onclick="App.setDrawColor(this, '#9B89B3')" title="紫色">🟣</button>
              <button class="tool-btn" onclick="App.setDrawColor(this, '#FF6B6B')" title="红色">🔴</button>
              <button class="tool-btn" onclick="App.setDrawColor(this, '#FFD93D')" title="黄色">🟡</button>
              <button class="tool-btn" onclick="App.setDrawColor(this, '#6BCB77')" title="绿色">🟩</button>
              <button class="tool-btn" onclick="App.setDrawColor(this, '#4D96FF')" title="蓝色">🔵</button>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="tool-btn" onclick="App.clearDrawing()" title="清空画布">🗑️</button>
            </div>
          </div>
          <canvas id="drawing-canvas" class="drawing-canvas"></canvas>
        </div>

        <div class="create-sidebar">
          <div class="card fade-in" style="padding: 24px;">
            <h3 style="margin-bottom: 20px;">🎨 画笔设置</h3>
            
            <div class="tool-section">
              <div class="tool-section-title">画笔颜色</div>
              <div class="color-palette">
                <div class="color-swatch active" style="background: #333333;" onclick="App.setDrawColor(this, '#333333')"></div>
                <div class="color-swatch" style="background: #FF8C42;" onclick="App.setDrawColor(this, '#FF8C42')"></div>
                <div class="color-swatch" style="background: #4ECDC4;" onclick="App.setDrawColor(this, '#4ECDC4')"></div>
                <div class="color-swatch" style="background: #9B89B3;" onclick="App.setDrawColor(this, '#9B89B3')"></div>
                <div class="color-swatch" style="background: #FF6B6B;" onclick="App.setDrawColor(this, '#FF6B6B')"></div>
                <div class="color-swatch" style="background: #FFD93D;" onclick="App.setDrawColor(this, '#FFD93D')"></div>
                <div class="color-swatch" style="background: #6BCB77;" onclick="App.setDrawColor(this, '#6BCB77')"></div>
                <div class="color-swatch" style="background: #4D96FF;" onclick="App.setDrawColor(this, '#4D96FF')"></div>
                <div class="color-swatch" style="background: #FFFFFF; border: 2px solid #ddd;" onclick="App.setDrawColor(this, '#FFFFFF')"></div>
              </div>
            </div>

            <div class="tool-section">
              <div class="tool-section-title">画笔粗细</div>
              <div style="display: flex; align-items: center; gap: 12px;">
                <input type="range" class="size-slider" min="1" max="30" value="5" oninput="App.setDrawSize(this.value)" />
                <span id="size-value" style="font-size: 14px; color: var(--text-muted); min-width: 40px;">5px</span>
              </div>
            </div>
          </div>

          <form id="publish-form" class="card fade-in" style="padding: 24px;">
            <h3 style="margin-bottom: 20px;">📝 发布作品</h3>
            
            <div class="form-group">
              <label>作品标题 *</label>
              <input type="text" id="work-title" placeholder="给你的作品起个名字吧" maxlength="30" required />
            </div>

            <div class="form-group">
              <label>作品描述</label>
              <textarea id="work-desc" placeholder="分享一下你的创作心得..." maxlength="200"></textarea>
            </div>

            <div class="form-group">
              <label>分类 *</label>
              <select id="work-category" required>
                <option value="handmade">🧶 手工</option>
                <option value="painting">🎨 绘画</option>
                <option value="photo">📷 摄影</option>
                <option value="food">🍳 手作美食</option>
                <option value="video">🎬 数码剪辑</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
              🚀 发布作品
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
