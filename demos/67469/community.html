<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社区广场 - 趣享</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="community-page">
    <div class="container">
      <h2 class="section-title">
        <span class="emoji">🎨</span>
        社区广场
        <span class="text-muted" style="font-size: 16px; font-weight: 400;">发现优秀作品，交流创作灵感</span>
      </h2>

      <div class="community-filters">
        <div class="filter-tags">
          <div class="filter-tag active" data-category="all">全部</div>
          <div class="filter-tag" data-category="handmade">🧶 手工</div>
          <div class="filter-tag" data-category="painting">🎨 绘画</div>
          <div class="filter-tag" data-category="photo">📷 摄影</div>
          <div class="filter-tag" data-category="food">🍳 美食</div>
          <div class="filter-tag" data-category="video">🎬 剪辑</div>
        </div>
        <select class="sort-select" id="sort-select">
          <option value="latest">最新发布</option>
          <option value="hot">最多点赞</option>
        </select>
      </div>

      <div id="community-works"></div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
