<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>趣享 - 发现兴趣，分享快乐</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="navbar"></div>

  <section class="hero">
    <div class="container">
      <div class="hero-content fade-in">
        <h1>
          发现你的<span class="highlight">兴趣之光</span><br>
          零基础轻松学新技能
        </h1>
        <p>手工、绘画、摄影、美食、剪辑... 五大兴趣领域，带你开启创意生活</p>
        <div class="search-box">
          <input type="text" placeholder="搜索你感兴趣的课程或内容..." />
          <button class="btn btn-primary" onclick="Utils.toast('搜索功能开发中~', 'info')">🔍 搜索</button>
        </div>
      </div>
    </div>
  </section>

  <section class="categories">
    <div class="container">
      <h2 class="section-title">
        <span class="emoji">🎯</span>
        兴趣分类
      </h2>
      <div class="category-grid" id="category-grid"></div>
    </div>
  </section>

  <section class="section" id="continue-section" style="display: none;">
    <div class="container">
      <h2 class="section-title">
        <span class="emoji">📖</span>
        继续学习
      </h2>
      <div class="course-scroll" id="continue-learning"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="flex items-center justify-between" style="margin-bottom: 24px;">
        <h2 class="section-title" style="margin-bottom: 0;">
          <span class="emoji">📚</span>
          分级课程体系
        </h2>
      </div>
      <div class="difficulty-tabs" id="difficulty-tabs"></div>
      <div class="course-grid" id="level-courses"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <h2 class="section-title">
        <span class="emoji">✨</span>
        为你推荐
      </h2>
      <div class="course-scroll" id="recommended-courses"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="flex items-center justify-between" style="margin-bottom: 24px;">
        <h2 class="section-title" style="margin-bottom: 0;">
          <span class="emoji">👨‍🏫</span>
          名师风采
        </h2>
        <a href="javascript:;" class="btn btn-ghost" onclick="Utils.toast('更多名师即将上线~', 'info')">查看全部 →</a>
      </div>
      <div class="teacher-grid" id="teacher-grid"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="flex items-center justify-between" style="margin-bottom: 24px;">
        <h2 class="section-title" style="margin-bottom: 0;">
          <span class="emoji">🎨</span>
          学员作品
        </h2>
        <a href="community.html" class="btn btn-ghost">更多作品 →</a>
      </div>
      <div class="gallery-tabs" id="gallery-tabs"></div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="flex items-center justify-between" style="margin-bottom: 24px;">
        <h2 class="section-title" style="margin-bottom: 0;">
          <span class="emoji">🏆</span>
          学习排行榜
        </h2>
      </div>
      <div class="ranking-tabs" id="ranking-tabs"></div>
      <div class="ranking-list" id="ranking-list"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="flex items-center justify-between" style="margin-bottom: 24px;">
        <h2 class="section-title" style="margin-bottom: 0;">
          <span class="emoji">🔥</span>
          热门作品
        </h2>
        <a href="community.html" class="btn btn-ghost">查看全部 →</a>
      </div>
      <div class="work-grid" id="hot-works"></div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
