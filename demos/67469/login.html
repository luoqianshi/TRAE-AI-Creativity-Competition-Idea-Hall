<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 / 注册 - 趣享</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="login-page">
    <div class="login-card scale-in">
      <div style="text-align: center; margin-bottom: 24px;">
        <span style="font-size: 48px;">✨</span>
      </div>
      <h2>欢迎来到趣享</h2>
      <p class="subtitle">发现兴趣，分享快乐</p>

      <div class="login-tabs">
        <div class="login-tab active" data-form="login">登录</div>
        <div class="login-tab" data-form="register">注册</div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="login-username" placeholder="请输入用户名" required />
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="login-password" placeholder="请输入密码" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          🚀 登录
        </button>
        <div class="form-footer">
          还没有账号？<a href="#" onclick="document.querySelector('[data-form=register]').click(); return false;">立即注册</a>
        </div>
      </form>

      <form id="register-form" style="display: none;">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="register-username" placeholder="3-20个字符" minlength="3" maxlength="20" required />
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="register-password" placeholder="至少6个字符" minlength="6" required />
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" id="register-confirm" placeholder="再次输入密码" minlength="6" required />
        </div>
        <div class="form-group">
          <label>选择你的兴趣（可多选）</label>
          <div class="interest-select">
            <div class="interest-option" data-category="handmade">
              <div class="emoji">🧶</div>
              <div class="name">手工</div>
            </div>
            <div class="interest-option" data-category="painting">
              <div class="emoji">🎨</div>
              <div class="name">绘画</div>
            </div>
            <div class="interest-option" data-category="photo">
              <div class="emoji">📷</div>
              <div class="name">摄影</div>
            </div>
            <div class="interest-option" data-category="food">
              <div class="emoji">🍳</div>
              <div class="name">美食</div>
            </div>
            <div class="interest-option" data-category="video">
              <div class="emoji">🎬</div>
              <div class="name">剪辑</div>
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          🎉 加入趣享
        </button>
        <div class="form-footer">
          已有账号？<a href="#" onclick="document.querySelector('[data-form=login]').click(); return false;">去登录</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
