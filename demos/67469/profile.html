<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 趣享</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="profile-page">
    <div class="container">
      <div id="profile-header" class="profile-header"></div>

      <div class="stats-grid" id="stats-grid"></div>

      <div class="section-tabs">
        <div class="section-tab active" data-section="progress">📖 学习进度</div>
        <div class="section-tab" data-section="badges">🏆 成就徽章</div>
        <div class="section-tab" data-section="works">🎨 我的作品</div>
      </div>

      <div id="section-progress"></div>
      <div id="section-badges" style="display: none;"></div>
      <div id="section-works" style="display: none;"></div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
