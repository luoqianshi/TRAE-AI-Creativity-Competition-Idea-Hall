<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅途奇遇 - AI旅行故事生成器 Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* 手机框架 */
        .phone-frame {
            max-width: 420px;
            margin: 0 auto;
            min-height: 100vh;
            background: linear-gradient(180deg, #0f0f23 0%, #1a1a3e 100%);
            position: relative;
            overflow: hidden;
        }

        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            font-size: 14px;
            background: rgba(0,0,0,0.3);
        }

        /* 头部 */
        .header {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 50%, #FFA726 100%);
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .app-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .app-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .location-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            margin-top: 16px;
            font-size: 13px;
            backdrop-filter: blur(10px);
        }

        /* 主内容区 */
        .main-content {
            padding: 20px;
        }

        /* 当前故事卡片 */
        .story-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .story-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .story-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .story-icon {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .story-meta {
            flex: 1;
        }

        .story-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .story-location {
            font-size: 12px;
            opacity: 0.8;
        }

        .story-content {
            position: relative;
            z-index: 1;
            font-size: 15px;
            line-height: 1.8;
            opacity: 0.95;
        }

        .story-content .highlight {
            color: #ffd700;
            font-weight: 600;
        }

        /* 快捷操作 */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .action-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 16px;
            padding: 16px 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .action-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .action-btn i {
            font-size: 24px;
            margin-bottom: 8px;
            display: block;
        }

        .action-btn span {
            font-size: 11px;
            display: block;
        }

        /* 功能区 */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            color: #FF6B6B;
        }

        /* 任务卡片 */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .task-card {
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .task-card:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,107,107,0.5);
        }

        .task-card.completed {
            opacity: 0.6;
        }

        .task-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #FF6B6B, #FFA726);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .task-info {
            flex: 1;
        }

        .task-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .task-reward {
            font-size: 12px;
            color: #ffd700;
        }

        .task-check {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .task-card.completed .task-check {
            background: #4CAF50;
            border-color: #4CAF50;
        }

        /* 故事生成器 */
        .generator-section {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .mood-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .mood-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 8px 16px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mood-btn:hover, .mood-btn.active {
            background: linear-gradient(135deg, #FF6B6B, #FFA726);
            border-color: transparent;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 50%, #FFA726 100%);
            border: none;
            border-radius: 16px;
            padding: 16px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,107,107,0.4);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .generate-btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .generate-btn.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 成就展示 */
        .achievements {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .achievement {
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .achievement-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .achievement-name {
            font-size: 12px;
            opacity: 0.8;
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px;
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-item i {
            font-size: 20px;
        }

        .nav-item.active {
            color: #FF6B6B;
        }

        .nav-item:hover {
            color: #FF6B6B;
        }

        /* 故事生成动画 */
        .story-generating {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .story-generating.show {
            display: block;
        }

        .typing-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .typing-dot {
            width: 12px;
            height: 12px;
            background: #FF6B6B;
            border-radius: 50%;
            animation: typing 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(-10px); opacity: 1; }
        }

        .generating-text {
            font-size: 16px;
            opacity: 0.8;
        }

        /* 新故事展示 */
        .new-story {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .new-story.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 底部留白 */
        .bottom-spacer {
            height: 80px;
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>9:41</span>
            <span><i class="fas fa-signal"></i> <i class="fas fa-wifi"></i> <i class="fas fa-battery-full"></i></span>
        </div>

        <!-- 头部 -->
        <div class="header">
            <div class="header-content">
                <div class="app-title">旅途奇遇</div>
                <div class="app-subtitle">让每段旅程都成为独特的故事</div>
                <div class="location-badge">
                    <i class="fas fa-map-marker-alt"></i>
                    <span id="currentLocation">正在定位...</span>
                </div>
            </div>
        </div>

        <!-- 主内容 -->
        <div class="main-content">
            <!-- 当前故事卡片 -->
            <div class="story-card">
                <div class="story-header">
                    <div class="story-icon">📖</div>
                    <div class="story-meta">
                        <div class="story-title" id="storyTitle">古城探秘</div>
                        <div class="story-location" id="storyLocation">📍 西湖 · 断桥残雪</div>
                    </div>
                </div>
                <div class="story-content" id="storyContent">
                    阳光透过云层洒在湖面上，你站在<span class="highlight">断桥</span>上，远处传来悠扬的古琴声。一位白发老者向你招手，他的手中握着一张泛黄的地图..."年轻人，你愿意听一个关于这座桥的传说吗？"
                </div>
            </div>

            <!-- 快捷操作 -->
            <div class="quick-actions">
                <button class="action-btn" onclick="showToast('AR功能开发中，敬请期待！')">
                    <i class="fas fa-camera"></i>
                    <span>AR探索</span>
                </button>
                <button class="action-btn" onclick="showToast('日记功能开发中，敬请期待！')">
                    <i class="fas fa-book"></i>
                    <span>旅行日记</span>
                </button>
                <button class="action-btn" onclick="showToast('地图功能开发中，敬请期待！')">
                    <i class="fas fa-map"></i>
                    <span>故事地图</span>
                </button>
                <button class="action-btn" onclick="showToast('分享功能开发中，敬请期待！')">
                    <i class="fas fa-share-alt"></i>
                    <span>分享故事</span>
                </button>
            </div>

            <!-- 故事生成器 -->
            <div class="section-title">
                <i class="fas fa-magic"></i>
                生成新故事
            </div>
            <div class="generator-section">
                <div class="mood-selector">
                    <button class="mood-btn active" data-mood="adventure">🎭 冒险</button>
                    <button class="mood-btn" data-mood="romantic">💕 浪漫</button>
                    <button class="mood-btn" data-mood="mystery">🔍 悬疑</button>
                    <button class="mood-btn" data-mood="history">📜 历史</button>
                    <button class="mood-btn" data-mood="fantasy">✨ 奇幻</button>
                </div>
                <button class="generate-btn" id="generateBtn" onclick="generateStory()">
                    <i class="fas fa-wand-magic-sparkles"></i>
                    <span>开始创作故事</span>
                </button>
            </div>

            <!-- 生成中状态 -->
            <div class="story-generating" id="generatingState">
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
                <div class="generating-text">AI正在为你编织故事...</div>
            </div>

            <!-- 新生成的故事 -->
            <div class="new-story" id="newStory">
                <div class="story-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                    <div class="story-header">
                        <div class="story-icon" id="newStoryIcon">🌟</div>
                        <div class="story-meta">
                            <div class="story-title" id="newStoryTitle">新故事</div>
                            <div class="story-location" id="newStoryLocation">📍 未知地点</div>
                        </div>
                    </div>
                    <div class="story-content" id="newStoryContent">
                        故事内容加载中...
                    </div>
                </div>
            </div>

            <!-- 任务挑战 -->
            <div class="section-title">
                <i class="fas fa-tasks"></i>
                今日任务
            </div>
            <div class="task-list">
                <div class="task-card" onclick="completeTask(this)">
                    <div class="task-icon">📸</div>
                    <div class="task-info">
                        <div class="task-name">拍摄3张特色照片</div>
                        <div class="task-reward">+50 故事点数</div>
                    </div>
                    <div class="task-check"></div>
                </div>
                <div class="task-card" onclick="completeTask(this)">
                    <div class="task-icon">🗺️</div>
                    <div class="task-info">
                        <div class="task-name">探索隐藏景点</div>
                        <div class="task-reward">+80 故事点数</div>
                    </div>
                    <div class="task-check"></div>
                </div>
                <div class="task-card" onclick="completeTask(this)">
                    <div class="task-icon">✍️</div>
                    <div class="task-info">
                        <div class="task-name">完成今日故事</div>
                        <div class="task-reward">+100 故事点数</div>
                    </div>
                    <div class="task-check"></div>
                </div>
            </div>

            <!-- 成就展示 -->
            <div class="section-title">
                <i class="fas fa-trophy"></i>
                我的成就
            </div>
            <div class="achievements">
                <div class="achievement">
                    <div class="achievement-icon">🏆</div>
                    <div class="achievement-name">故事达人</div>
                </div>
                <div class="achievement">
                    <div class="achievement-icon">🌟</div>
                    <div class="achievement-name">探索者</div>
                </div>
                <div class="achievement">
                    <div class="achievement-icon">🎯</div>
                    <div class="achievement-name">任务大师</div>
                </div>
            </div>

            <div class="bottom-spacer"></div>
        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </div>
            <div class="nav-item" onclick="showToast('地图功能开发中')">
                <i class="fas fa-compass"></i>
                <span>探索</span>
            </div>
            <div class="nav-item" onclick="showToast('日记功能开发中')">
                <i class="fas fa-book-open"></i>
                <span>日记</span>
            </div>
            <div class="nav-item" onclick="showToast('个人中心开发中')">
                <i class="fas fa-user"></i>
                <span>我的</span>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script>
        // 模拟定位
        const locations = [
            '西湖 · 断桥残雪',
            '故宫 · 太和殿',
            '外滩 · 东方明珠',
            '大雁塔 · 音乐喷泉',
            '洱海 · 双廊古镇'
        ];

        // 模拟故事数据
        const stories = {
            adventure: [
                {
                    icon: '🗺️',
                    title: '藏宝图的秘密',
                    location: '📍 古镇 · 青石板路',
                    content: '你发现脚下有一块松动的石板，下面藏着一个古老的木盒。打开木盒，里面是一张泛黄的藏宝图，上面标记着三个神秘地点..."寻找这三把钥匙，你将发现古镇最大的秘密。"'
                },
                {
                    icon: '⚔️',
                    title: '勇者之路',
                    location: '📍 山顶 · 观景台',
                    content: '传说这座山顶曾是一位英雄的试炼之地。你站在悬崖边，云雾缭绕中隐约可见对面的山峰。一个声音在风中回响："真正的勇者，敢于跨越眼前的障碍..."'
                }
            ],
            romantic: [
                {
                    icon: '💕',
                    title: '邂逅时刻',
                    location: '📍 咖啡馆 · 靠窗座位',
                    content: '窗外的雨滴轻轻敲打着玻璃，你捧着热咖啡望向窗外。就在这时，一个人匆匆跑进来避雨，你们的目光在空中相遇。空气中弥漫着咖啡香和一种说不清的情愫...'
                },
                {
                    icon: '🌹',
                    title: '花语传说',
                    location: '📍 花园 · 玫瑰长廊',
                    content: '传说在这座花园里，有一朵能实现愿望的玫瑰。你漫步在花丛中，忽然发现一朵与众不同的金色玫瑰，花瓣上似乎有字："说出你的心愿，它会在最意想不到的时刻实现..."'
                }
            ],
            mystery: [
                {
                    icon: '🔍',
                    title: '消失的画作',
                    location: '📍 博物馆 · 古代艺术展厅',
                    content: '博物馆即将闭馆时，你发现墙上有一幅画的位置空了。保安说那幅画已经消失了五十年，但每隔一段时间就会有人看到它。你走近那面墙，发现画框上有一行小字："真相藏在倒影中..."'
                },
                {
                    icon: '🔮',
                    title: '预言者',
                    location: '📍 古塔 · 顶层密室',
                    content: '你登上了古塔的顶层，发现一个布满灰尘的房间。房间中央有一面古镜，镜中映出的不是你的倒影，而是一个陌生的场景。镜框上刻着："这面镜子能预见未来，但只有纯心之人才能看到真相..."'
                }
            ],
            history: [
                {
                    icon: '📜',
                    title: '千年往事',
                    location: '📍 古城墙 · 历史遗址',
                    content: '你抚摸着斑驳的城墙砖，忽然感觉一阵眩晕。睁开眼，你发现自己置身于千年前的繁华集市。商贩的吆喝声、马车的铃声、孩童的笑声...一切都如此真实。一位老者走来说："你看到的，是这座城的记忆..."'
                },
                {
                    icon: '🏛️',
                    title: '帝王遗诏',
                    location: '📍 皇陵 · 地下宫殿',
                    content: '在皇陵的深处，你发现了一块从未被发现的石碑。碑文记载着一个惊人的秘密：这位帝王并非自然死亡，而是为了守护一个重要的秘密选择了自我封印。碑文最后写道："后人若能至此，请继续守护这个秘密..."'
                }
            ],
            fantasy: [
                {
                    icon: '✨',
                    title: '精灵之森',
                    location: '📍 森林 · 古树之下',
                    content: '你走进一片被阳光穿透的森林，忽然看到树丛中有微弱的光芒闪烁。走近一看，是一群小精灵在举行聚会。它们看到你并不害怕，反而邀请你加入："人类很少能进入我们的世界，你一定是被选中的那个人..."'
                },
                {
                    icon: '🐉',
                    title: '龙之守护',
                    location: '📍 湖心岛 · 隐秘洞穴',
                    content: '传说这座湖心岛沉睡着一条古老的龙。你划船来到岛上，发现一个隐蔽的洞穴。洞内光芒四射，一条巨大的龙缓缓睁开眼睛："千年了，终于有人再次来到这里。年轻人，你愿意成为新的守护者吗？"'
                }
            ]
        };

        let currentMood = 'adventure';

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 模拟定位
            setTimeout(() => {
                const randomLocation = locations[Math.floor(Math.random() * locations.length)];
                document.getElementById('currentLocation').textContent = randomLocation;
            }, 1000);

            // 心情选择
            document.querySelectorAll('.mood-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentMood = this.dataset.mood;
                });
            });
        });

        // 生成故事
        function generateStory() {
            const btn = document.getElementById('generateBtn');
            const generatingState = document.getElementById('generatingState');
            const newStory = document.getElementById('newStory');

            // 显示加载状态
            btn.classList.add('loading');
            btn.innerHTML = '<i class="fas fa-spinner"></i><span>创作中...</span>';
            generatingState.classList.add('show');
            newStory.classList.remove('show');

            // 模拟AI生成
            setTimeout(() => {
                const storyList = stories[currentMood];
                const randomStory = storyList[Math.floor(Math.random() * storyList.length)];

                // 更新新故事
                document.getElementById('newStoryIcon').textContent = randomStory.icon;
                document.getElementById('newStoryTitle').textContent = randomStory.title;
                document.getElementById('newStoryLocation').textContent = randomStory.location;
                document.getElementById('newStoryContent').textContent = randomStory.content;

                // 隐藏加载，显示新故事
                generatingState.classList.remove('show');
                newStory.classList.add('show');

                // 恢复按钮
                btn.classList.remove('loading');
                btn.innerHTML = '<i class="fas fa-wand-magic-sparkles"></i><span>再创作一个</span>';

                showToast('✨ 故事生成成功！');
            }, 2000);
        }

        // 完成任务
        function completeTask(element) {
            if (element.classList.contains('completed')) {
                return;
            }
            element.classList.add('completed');
            element.querySelector('.task-check').innerHTML = '<i class="fas fa-check" style="color: white; font-size: 12px;"></i>';
            showToast('🎉 任务完成！获得奖励');
        }

        // Toast 提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
