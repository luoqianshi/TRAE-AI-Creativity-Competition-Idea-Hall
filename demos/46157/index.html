<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>程序员工具箱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    margin-bottom: 30px;
  }

  .header h1 {
    font-size: 28px;
    font-weight: 600;
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header p {
    color: #64748b;
    margin-top: 6px;
    font-size: 14px;
  }

  /* 标签页 */
  .tabs {
    display: flex;
    gap: 4px;
    background: #1e293b;
    padding: 6px;
    border-radius: 12px;
    margin-bottom: 20px;
    border: 1px solid #334155;
  }

  .tab-btn {
    flex: 1;
    padding: 12px 16px;
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s ease;
  }

  .tab-btn:hover { color: #e2e8f0; }

  .tab-btn.active {
    background: linear-gradient(135deg, #0ea5e9, #6366f1);
    color: #fff;
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
  }

  .tab-panel { display: none; animation: fadeIn 0.25s ease; }
  .tab-panel.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 卡片 */
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 14px;
    font-weight: 600;
    color: #cbd5e1;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  textarea {
    width: 100%;
    min-height: 160px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 12px 14px;
    color: #e2e8f0;
    font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: #0ea5e9; }

  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 12px 0;
  }

  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary {
    background: linear-gradient(135deg, #0ea5e9, #6366f1);
    color: #fff;
  }
  .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

  .btn-secondary {
    background: #334155;
    color: #cbd5e1;
  }
  .btn-secondary:hover { background: #475569; color: #fff; }

  .btn-success { background: #10b981; color: #fff; }
  .btn-success:hover { background: #059669; }

  .btn-warn { background: #f59e0b; color: #fff; }
  .btn-warn:hover { background: #d97706; }

  .btn-danger { background: #ef4444; color: #fff; }
  .btn-danger:hover { background: #dc2626; }

  /* 进制转换 */
  .base-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  .base-item label {
    display: block;
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .base-item input {
    width: 100%;
    padding: 10px 12px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 6px;
    color: #e2e8f0;
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .base-item input:focus { border-color: #0ea5e9; }

  .status-bar {
    margin-top: 10px;
    font-size: 12px;
    color: #64748b;
    min-height: 18px;
  }

  .status-bar.error { color: #f87171; }
  .status-bar.success { color: #34d399; }

  /* 响应式 */
  @media (max-width: 640px) {
    .base-grid { grid-template-columns: 1fr; }
    .tabs { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🛠️ 程序员工具箱</h1>
    <p>JSON 格式化 · Base64 编解码 · 进制互转</p>
  </div>

  <!-- 标签页 -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="json">JSON 格式化</button>
    <button class="tab-btn" data-tab="base64">Base64 转换</button>
    <button class="tab-btn" data-tab="base">进制转换</button>
  </div>

  <!-- JSON 面板 -->
  <div class="tab-panel active" id="json">
    <div class="card">
      <div class="card-title">
        <span>输入 JSON</span>
      </div>
      <textarea id="jsonInput" placeholder="粘贴 JSON 字符串，支持格式化、压缩、转义..."></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="formatJson()">格式化</button>
        <button class="btn btn-secondary" onclick="compressJson()">压缩</button>
        <button class="btn btn-secondary" onclick="escapeJson()">转义</button>
        <button class="btn btn-secondary" onclick="unescapeJson()">去转义</button>
        <button class="btn btn-warn" onclick="clearJson()">清空</button>
      </div>
      <div class="status-bar" id="jsonStatus"></div>
    </div>
    <div class="card">
      <div class="card-title">
        <span>输出结果</span>
        <button class="btn btn-success" style="padding:6px 12px;font-size:12px;" onclick="copyResult('jsonOutput','jsonStatus')">复制</button>
      </div>
      <textarea id="jsonOutput" readonly></textarea>
    </div>
  </div>

  <!-- Base64 面板 -->
  <div class="tab-panel" id="base64">
    <div class="card">
      <div class="card-title"><span>原文 / 编码结果</span></div>
      <textarea id="b64Input" placeholder="输入普通文本或 Base64 字符串"></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="encodeBase64()">编码 → Base64</button>
        <button class="btn btn-secondary" onclick="decodeBase64()">Base64 → 解码</button>
        <button class="btn btn-warn" onclick="clearB64()">清空</button>
      </div>
      <div class="status-bar" id="b64Status"></div>
    </div>
    <div class="card">
      <div class="card-title">
        <span>输出结果</span>
        <button class="btn btn-success" style="padding:6px 12px;font-size:12px;" onclick="copyResult('b64Output','b64Status')">复制</button>
      </div>
      <textarea id="b64Output" readonly></textarea>
    </div>
  </div>

  <!-- 进制转换面板 -->
  <div class="tab-panel" id="base">
    <div class="card">
      <div class="card-title"><span>进制互转（二进制 / 八进制 / 十进制 / 十六进制）</span></div>
      <div class="base-grid">
        <div class="base-item">
          <label>二进制 (Binary)</label>
          <input type="text" id="bin" oninput="convertFrom('bin')" placeholder="如 11010110">
        </div>
        <div class="base-item">
          <label>八进制 (Octal)</label>
          <input type="text" id="oct" oninput="convertFrom('oct')" placeholder="如 326">
        </div>
        <div class="base-item">
          <label>十进制 (Decimal)</label>
          <input type="text" id="dec" oninput="convertFrom('dec')" placeholder="如 214">
        </div>
        <div class="base-item">
          <label>十六进制 (Hex)</label>
          <input type="text" id="hex" oninput="convertFrom('hex')" placeholder="如 d6">
        </div>
      </div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn btn-secondary" onclick="clearBase()">清空全部</button>
      </div>
      <div class="status-bar" id="baseStatus">在任意输入框中输入数字，其余进制自动转换</div>
    </div>
  </div>
</div>

<script>
  // ========== 标签页切换 ==========
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  // ========== JSON 工具 ==========
  function setStatus(id, msg, type = '') {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'status-bar ' + type;
    if (type) return;
    setTimeout(() => { el.textContent = ''; }, 2000);
  }

  function formatJson() {
    try {
      const raw = document.getElementById('jsonInput').value.trim();
      if (!raw) { setStatus('jsonStatus', '请输入 JSON 内容', 'error'); return; }
      const obj = JSON.parse(raw);
      document.getElementById('jsonOutput').value = JSON.stringify(obj, null, 2);
      setStatus('jsonStatus', '格式化成功', 'success');
    } catch (e) {
      setStatus('jsonStatus', 'JSON 格式错误: ' + e.message, 'error');
    }
  }

  function compressJson() {
    try {
      const raw = document.getElementById('jsonInput').value.trim();
      if (!raw) { setStatus('jsonStatus', '请输入 JSON 内容', 'error'); return; }
      const obj = JSON.parse(raw);
      document.getElementById('jsonOutput').value = JSON.stringify(obj);
      setStatus('jsonStatus', '压缩成功', 'success');
    } catch (e) {
      setStatus('jsonStatus', 'JSON 格式错误: ' + e.message, 'error');
    }
  }

  function escapeJson() {
    const raw = document.getElementById('jsonInput').value;
    document.getElementById('jsonOutput').value = raw
      .replace(/\\/g, '\\\\')
      .replace(/"/g, '\\"')
      .replace(/\n/g, '\\n')
      .replace(/\r/g, '\\r')
      .replace(/\t/g, '\\t');
    setStatus('jsonStatus', '转义完成', 'success');
  }

  function unescapeJson() {
    try {
      const raw = document.getElementById('jsonInput').value;
      const result = JSON.parse('"' + raw + '"');
      document.getElementById('jsonOutput').value = result;
      setStatus('jsonStatus', '去转义完成', 'success');
    } catch (e) {
      setStatus('jsonStatus', '转义字符串格式错误', 'error');
    }
  }

  function clearJson() {
    document.getElementById('jsonInput').value = '';
    document.getElementById('jsonOutput').value = '';
    setStatus('jsonStatus', '已清空');
  }

  // ========== Base64 ==========
  function encodeBase64() {
    try {
      const str = document.getElementById('b64Input').value;
      const encoded = btoa(unescape(encodeURIComponent(str)));
      document.getElementById('b64Output').value = encoded;
      setStatus('b64Status', '编码成功', 'success');
    } catch (e) {
      setStatus('b64Status', '编码失败', 'error');
    }
  }

  function decodeBase64() {
    try {
      const str = document.getElementById('b64Input').value.trim();
      const decoded = decodeURIComponent(escape(atob(str)));
      document.getElementById('b64Output').value = decoded;
      setStatus('b64Status', '解码成功', 'success');
    } catch (e) {
      setStatus('b64Status', '解码失败：无效的 Base64 字符串', 'error');
    }
  }

  function clearB64() {
    document.getElementById('b64Input').value = '';
    document.getElementById('b64Output').value = '';
    setStatus('b64Status', '已清空');
  }

  // ========== 进制转换 ==========
  let converting = false;

  function convertFrom(from) {
    if (converting) return;
    converting = true;

    const val = document.getElementById(from).value.trim();
    const status = document.getElementById('baseStatus');

    if (val === '') {
      ['bin','oct','dec','hex'].forEach(k => {
        if (k !== from) document.getElementById(k).value = '';
      });
      status.textContent = '在任意输入框中输入数字，其余进制自动转换';
      status.className = 'status-bar';
      converting = false;
      return;
    }

    let dec;
    try {
      switch (from) {
        case 'bin':
          if (!/^[01]+$/.test(val)) throw new Error('非法二进制');
          dec = parseInt(val, 2);
          break;
        case 'oct':
          if (!/^[0-7]+$/.test(val)) throw new Error('非法八进制');
          dec = parseInt(val, 8);
          break;
        case 'dec':
          if (!/^\d+$/.test(val)) throw new Error('非法十进制');
          dec = parseInt(val, 10);
          break;
        case 'hex':
          if (!/^[0-9a-fA-F]+$/.test(val)) throw new Error('非法十六进制');
          dec = parseInt(val, 16);
          break;
      }

      if (isNaN(dec) || !isFinite(dec)) throw new Error('数值过大或无效');

      document.getElementById('bin').value = dec.toString(2);
      document.getElementById('oct').value = dec.toString(8);
      document.getElementById('dec').value = dec.toString(10);
      document.getElementById('hex').value = dec.toString(16).toLowerCase();

      status.textContent = '转换成功';
      status.className = 'status-bar success';
    } catch (e) {
      status.textContent = e.message;
      status.className = 'status-bar error';
    }

    converting = false;
  }

  function clearBase() {
    ['bin','oct','dec','hex'].forEach(k => document.getElementById(k).value = '');
    document.getElementById('baseStatus').textContent = '已清空';
    document.getElementById('baseStatus').className = 'status-bar';
  }

  // ========== 通用复制 ==========
  function copyResult(id, statusId) {
    const text = document.getElementById(id).value;
    if (!text) { setStatus(statusId, '没有可复制的内容', 'error'); return; }
    navigator.clipboard.writeText(text).then(() => {
      setStatus(statusId, '已复制到剪贴板', 'success');
    }).catch(() => {
      // 降级方案
      const ta = document.getElementById(id);
      ta.select();
      document.execCommand('copy');
      setStatus(statusId, '已复制到剪贴板', 'success');
    });
  }
</script>
</body>
</html>
