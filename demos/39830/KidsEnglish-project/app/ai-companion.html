<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#9B7ED8">
  <title>AI 英语小精灵 - 幼儿英语启蒙</title>
  <style>
    @font-face { font-family:'InstrumentSans'; src:url('_shared/fonts/InstrumentSans-Regular.ttf') format('truetype'); font-weight:400; }
    @font-face { font-family:'InstrumentSans'; src:url('_shared/fonts/InstrumentSans-Bold.ttf') format('truetype'); font-weight:700; }
    @font-face { font-family:'BricolageGrotesque'; src:url('_shared/fonts/BricolageGrotesque-Regular.ttf') format('truetype'); font-weight:400; }
    @font-face { font-family:'BricolageGrotesque'; src:url('_shared/fonts/BricolageGrotesque-Bold.ttf') format('truetype'); font-weight:700; }

    :root {
      --bg: #F5F0FF; --bg2: #EDE5F8; --ink: #2D2A26; --muted: #8A8580;
      --accent: #9B7ED8; --accent2: #6BCB77; --accent3: #FFB84A;
      --accent4: #FF6B4A; --font: 'InstrumentSans', 'BricolageGrotesque', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font); color: var(--ink); background: var(--bg);
      line-height: 1.6; overscroll-behavior: none; min-height: 100vh;
      -webkit-overflow-scrolling: touch;
    }

    /* Header */
    .ai-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(245,240,255,0.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid #D4C4F0; padding: 12px 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .back-btn {
      width: 40px; height: 40px; border: none; border-radius: 50%;
      background: var(--bg2); color: var(--ink); font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; flex-shrink: 0;
    }
    .back-btn:active { background: var(--accent); color: #fff; transform: scale(0.95); }
    .ai-header h1 {
      font-family: 'BricolageGrotesque', sans-serif; font-size: 1.15rem;
      font-weight: 700; flex: 1; text-align: center; margin-right: 40px;
    }

    /* Pages */
    .page { display: none; max-width: 600px; margin: 0 auto; padding: 1rem; }
    .page.active { display: block; }

    /* ===== Home Page ===== */
    .ai-home { text-align: center; padding-top: 1rem; }
    .elf-avatar {
      width: 120px; height: 120px; border-radius: 50%;
      margin: 0 auto 1rem; background: linear-gradient(135deg, var(--accent), #B8A0E8);
      display: flex; align-items: center; justify-content: center;
      font-size: 4rem; box-shadow: 0 8px 24px rgba(155,126,216,0.3);
      border: 4px solid #fff; position: relative;
    }
    .elf-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .elf-name { font-size: 1.3rem; font-weight: 700; color: var(--accent); margin-bottom: 0.3rem; }
    .elf-greeting { font-size: 0.9rem; color: var(--muted); margin-bottom: 1.5rem; }

    .feature-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .feature-card {
      background: #fff; border-radius: 18px; padding: 1.2rem 1rem;
      border: 2px solid #E0D4F4; cursor: pointer; transition: all 0.2s;
      text-align: center;
    }
    .feature-card:active { transform: scale(0.97); }
    .feature-card .feat-icon { font-size: 2.2rem; margin-bottom: 0.5rem; }
    .feature-card .feat-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 0.2rem; }
    .feature-card .feat-desc { font-size: 0.75rem; color: var(--muted); }

    /* ===== Photo Recognize Page ===== */
    .photo-page { padding: 1rem; }
    .photo-area {
      background: #fff; border-radius: 20px; border: 3px dashed #D4C4F0;
      padding: 2rem; text-align: center; margin-bottom: 1rem;
      cursor: pointer; transition: all 0.2s;
    }
    .photo-area:active { background: var(--bg2); }
    .photo-area .photo-icon { font-size: 3rem; margin-bottom: 0.5rem; }
    .photo-area p { color: var(--muted); font-size: 0.9rem; }
    #photoInput { display: none; }

    .preview-img {
      width: 100%; max-height: 300px; object-fit: contain;
      border-radius: 12px; margin-bottom: 1rem; background: #f5f5f5;
    }

    .recognize-btn {
      display: block; width: 100%; padding: 14px;
      background: var(--accent); color: #fff; border: none;
      border-radius: 14px; font-size: 1.05rem; font-weight: 700;
      font-family: var(--font); cursor: pointer; transition: all 0.2s;
      margin-bottom: 1rem;
    }
    .recognize-btn:active { transform: scale(0.97); }
    .recognize-btn:disabled { background: #D4C4F0; cursor: default; }

    .result-card {
      background: #fff; border-radius: 16px; padding: 1.2rem;
      border: 2px solid #E0D4F4; margin-bottom: 1rem; display: none;
    }
    .result-card.show { display: block; animation: popIn 0.3s ease; }
    .result-card .result-word {
      font-family: 'BricolageGrotesque', sans-serif; font-size: 1.8rem;
      font-weight: 700; color: var(--accent); text-align: center;
    }
    .result-card .result-cn { text-align: center; color: var(--muted); font-size: 1rem; margin-bottom: 0.5rem; }
    .result-card .result-ipa { text-align: center; color: var(--accent2); font-style: italic; margin-bottom: 0.8rem; }
    .result-card .result-sentence { background: var(--bg2); border-radius: 10px; padding: 0.8rem; font-size: 0.85rem; margin-bottom: 0.8rem; }
    .result-card .result-sentence .en { font-weight: 700; color: var(--ink); }
    .result-card .result-sentence .cn { color: var(--muted); margin-top: 0.2rem; }

    .action-btns { display: flex; gap: 0.6rem; }
    .action-btns button {
      flex: 1; padding: 10px; border: none; border-radius: 10px;
      font-size: 0.85rem; font-weight: 700; font-family: var(--font);
      cursor: pointer; transition: all 0.2s;
    }
    .action-btns .btn-primary { background: var(--accent2); color: #fff; }
    .action-btns .btn-secondary { background: var(--bg2); color: var(--ink); }
    .action-btns button:active { transform: scale(0.97); }

    /* ===== Elf Customize Page ===== */
    .custom-page { padding: 1rem; }
    .custom-preview {
      width: 150px; height: 150px; border-radius: 50%;
      margin: 0 auto 1.5rem; background: linear-gradient(135deg, var(--accent), #B8A0E8);
      display: flex; align-items: center; justify-content: center;
      font-size: 5rem; border: 4px solid #fff;
      box-shadow: 0 8px 24px rgba(155,126,216,0.3);
    }
    .custom-preview img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

    .custom-section { margin-bottom: 1.2rem; }
    .custom-section h3 { font-size: 1rem; margin-bottom: 0.6rem; }
    .option-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .option-btn {
      padding: 8px 14px; border: 2px solid #E0D4F4; border-radius: 10px;
      background: #fff; font-size: 0.85rem; cursor: pointer;
      font-family: var(--font); transition: all 0.15s;
    }
    .option-btn.selected { border-color: var(--accent); background: rgba(155,126,216,0.1); }
    .option-btn:active { transform: scale(0.96); }

    .name-input {
      width: 100%; padding: 12px 16px; border: 2px solid #E0D4F4;
      border-radius: 12px; font-size: 1rem; font-family: var(--font);
      outline: none; transition: border-color 0.2s;
    }
    .name-input:focus { border-color: var(--accent); }

    .generate-btn {
      display: block; width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--accent), #B8A0E8);
      color: #fff; border: none; border-radius: 14px;
      font-size: 1.05rem; font-weight: 700; font-family: var(--font);
      cursor: pointer; transition: all 0.2s; margin-top: 1rem;
    }
    .generate-btn:active { transform: scale(0.97); }

    /* ===== Chat Page ===== */
    .chat-page { padding: 0; display: flex; flex-direction: column; height: calc(100vh - 60px); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 1rem; }
    .chat-bubble {
      max-width: 80%; padding: 10px 14px; border-radius: 16px;
      margin-bottom: 0.8rem; font-size: 0.9rem; line-height: 1.5;
    }
    .chat-bubble.elf {
      background: #fff; border: 1px solid #E0D4F4; align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .chat-bubble.user {
      background: var(--accent); color: #fff; align-self: flex-end;
      border-bottom-right-radius: 4px; margin-left: auto;
    }
    .chat-bubble .elf-name-tag { font-size: 0.7rem; color: var(--accent); margin-bottom: 2px; font-weight: 700; }
    .chat-input-area {
      padding: 10px 16px; background: #fff; border-top: 1px solid #E0D4F4;
      display: flex; gap: 8px; align-items: center;
    }
    .chat-input {
      flex: 1; padding: 10px 14px; border: 2px solid #E0D4F4;
      border-radius: 20px; font-size: 0.9rem; font-family: var(--font);
      outline: none;
    }
    .chat-input:focus { border-color: var(--accent); }
    .chat-send {
      width: 40px; height: 40px; border: none; border-radius: 50%;
      background: var(--accent); color: #fff; font-size: 1.2rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .chat-send:active { transform: scale(0.95); }

    /* Loading */
    .loading { text-align: center; padding: 2rem; color: var(--muted); }
    .loading-spinner {
      width: 40px; height: 40px; border: 3px solid #E0D4F4;
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 1s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    /* Toast */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: rgba(45,42,38,0.9); color: #fff; padding: 10px 20px;
      border-radius: 10px; font-size: 0.85rem; z-index: 100;
      transition: transform 0.3s ease; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="ai-header">
    <button class="back-btn" onclick="goBack()">&#8592;</button>
    <h1 id="pageTitle">AI 英语小精灵</h1>
  </div>

  <!-- Home Page -->
  <div class="page active" id="page-home">
    <div class="ai-home">
      <div class="elf-avatar" id="elfAvatar">&#129302;</div>
      <div class="elf-name" id="elfNameDisplay">小精灵</div>
      <div class="elf-greeting" id="elfGreeting">你好呀！我是你的英语小精灵~</div>

      <div class="feature-grid">
        <div class="feature-card" onclick="showPage('page-photo')">
          <div class="feat-icon">&#128247;</div>
          <div class="feat-title">拍照识物</div>
          <div class="feat-desc">拍一拍，认识新单词</div>
        </div>
        <div class="feature-card" onclick="showPage('page-custom')">
          <div class="feat-icon">&#127912;</div>
          <div class="feat-title">定制精灵</div>
          <div class="feat-desc">创造你的专属精灵</div>
        </div>
        <div class="feature-card" onclick="showPage('page-chat')">
          <div class="feat-icon">&#128172;</div>
          <div class="feat-title">情景对话</div>
          <div class="feat-desc">和精灵一起学英语</div>
        </div>
        <div class="feature-card" onclick="showElfStory()">
          <div class="feat-icon">&#128214;</div>
          <div class="feat-title">相遇故事</div>
          <div class="feat-desc">看看今天发生了什么</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Photo Recognize Page -->
  <div class="page" id="page-photo">
    <div class="photo-page">
      <div class="photo-area" id="photoArea" onclick="document.getElementById('photoInput').click()">
        <div class="photo-icon">&#128247;</div>
        <p>点击拍照或上传图片<br>我会告诉你这是什么</p>
      </div>
      <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="handlePhoto(event)">
      <img class="preview-img" id="previewImg" style="display:none;">
      <button class="recognize-btn" id="recognizeBtn" onclick="recognizeImage()" disabled>识别中...</button>

      <div class="result-card" id="resultCard">
        <div class="result-word" id="resultWord">-</div>
        <div class="result-cn" id="resultCn">-</div>
        <div class="result-ipa" id="resultIpa">-</div>
        <div class="result-sentence">
          <div class="en" id="resultEnSentence">-</div>
          <div class="cn" id="resultCnSentence">-</div>
        </div>
        <div class="action-btns">
          <button class="btn-primary" onclick="playWord()">&#128266; 发音</button>
          <button class="btn-secondary" onclick="addToCards()">&#43; 加入词库</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Customize Page -->
  <div class="page" id="page-custom">
    <div class="custom-page">
      <div class="custom-preview" id="customPreview">&#129302;</div>

      <div class="custom-section">
        <h3>&#127775; 选择基础形象</h3>
        <div class="option-row">
          <button class="option-btn selected" data-type="base" data-val="cat" onclick="selectOption(this)">&#128570; 小猫</button>
          <button class="option-btn" data-type="base" data-val="dog" onclick="selectOption(this)">&#128054; 小狗</button>
          <button class="option-btn" data-type="base" data-val="owl" onclick="selectOption(this)">&#129417; 猫头鹰</button>
          <button class="option-btn" data-type="base" data-val="fox" onclick="selectOption(this)">&#129418; 小狐狸</button>
          <button class="option-btn" data-type="base" data-val="rabbit" onclick="selectOption(this)">&#128048; 小兔子</button>
          <button class="option-btn" data-type="base" data-val="dragon" onclick="selectOption(this)">&#128009; 小龙</button>
        </div>
      </div>

      <div class="custom-section">
        <h3>&#127912; 选择颜色风格</h3>
        <div class="option-row">
          <button class="option-btn selected" data-type="color" data-val="purple" onclick="selectOption(this)">&#128156; 紫色</button>
          <button class="option-btn" data-type="color" data-val="blue" onclick="selectOption(this)">&#128153; 蓝色</button>
          <button class="option-btn" data-type="color" data-val="green" onclick="selectOption(this)">&#128154; 绿色</button>
          <button class="option-btn" data-type="color" data-val="pink" onclick="selectOption(this)">&#128150; 粉色</button>
          <button class="option-btn" data-type="color" data-val="orange" onclick="selectOption(this)">&#128155; 橙色</button>
        </div>
      </div>

      <div class="custom-section">
        <h3>&#10024; 选择配饰</h3>
        <div class="option-row">
          <button class="option-btn selected" data-type="acc" data-val="none" onclick="selectOption(this)">无</button>
          <button class="option-btn" data-type="acc" data-val="glasses" onclick="selectOption(this)">&#128083; 眼镜</button>
          <button class="option-btn" data-type="acc" data-val="hat" onclick="selectOption(this)">&#127913; 帽子</button>
          <button class="option-btn" data-type="acc" data-val="bow" onclick="selectOption(this)">&#127872; 蝴蝶结</button>
          <button class="option-btn" data-type="acc" data-val="star" onclick="selectOption(this)">&#11088; 星星</button>
        </div>
      </div>

      <div class="custom-section">
        <h3>&#128172; 给精灵取个名字</h3>
        <input type="text" class="name-input" id="elfNameInput" placeholder="比如：小智、泡泡、豆豆..." maxlength="10">
      </div>

      <button class="generate-btn" onclick="generateElf()">&#10024; 生成我的精灵</button>
    </div>
  </div>

  <!-- Chat Page -->
  <div class="page" id="page-chat">
    <div class="chat-page">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <input type="text" class="chat-input" id="chatInput" placeholder="和精灵说点什么..." onkeypress="if(event.key==='Enter')sendChat()">
        <button class="chat-send" onclick="sendChat()">&#10148;</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ===== State =====
    var currentPage = 'page-home';
    var elfConfig = JSON.parse(localStorage.getItem('ke_elf_config') || '{}');
    var currentPhoto = null;
    var currentWord = null;
    var chatHistory = JSON.parse(localStorage.getItem('ke_elf_chat') || '[]');
    var synth = window.speechSynthesis;

    // ===== Init =====
    function init() {
      if (elfConfig.name) {
        document.getElementById('elfNameDisplay').textContent = elfConfig.name;
        document.getElementById('elfGreeting').textContent = '你好呀！我是' + elfConfig.name + '，你的英语小精灵~';
      }
      if (elfConfig.avatar) {
        document.getElementById('elfAvatar').innerHTML = '<img src="' + elfConfig.avatar + '" alt="elf">';
      }
      // Load chat history
      renderChat();
    }

    // ===== Navigation =====
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
      document.getElementById(pageId).classList.add('active');
      currentPage = pageId;

      var titles = {
        'page-home': 'AI 英语小精灵',
        'page-photo': '拍照识物',
        'page-custom': '定制精灵',
        'page-chat': '情景对话'
      };
      document.getElementById('pageTitle').textContent = titles[pageId] || 'AI 英语小精灵';
    }

    function goBack() {
      if (currentPage === 'page-home') {
        location.replace('index.html');
      } else {
        showPage('page-home');
      }
    }

    // ===== Photo Recognize =====
    function handlePhoto(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(evt) {
        currentPhoto = evt.target.result;
        var img = document.getElementById('previewImg');
        img.src = currentPhoto;
        img.style.display = 'block';
        document.getElementById('photoArea').style.display = 'none';
        var btn = document.getElementById('recognizeBtn');
        btn.disabled = false;
        btn.textContent = '&#128269; 识别这是什么';
        document.getElementById('resultCard').classList.remove('show');
      };
      reader.readAsDataURL(file);
    }

    function recognizeImage() {
      var btn = document.getElementById('recognizeBtn');
      btn.disabled = true;
      btn.textContent = '识别中...';

      // Simulate AI recognition with demo words
      var demoWords = [
        { en: 'apple', cn: '苹果', ipa: '/\u02c8\u00e6pl/', sentence: 'I like to eat apples.', sentenceCn: '我喜欢吃苹果。' },
        { en: 'cat', cn: '猫', ipa: '/k\u00e6t/', sentence: 'The cat is sleeping.', sentenceCn: '小猫在睡觉。' },
        { en: 'flower', cn: '花', ipa: '/\u02c8fla\u028a\u0259r/', sentence: 'This flower is beautiful.', sentenceCn: '这朵花很漂亮。' },
        { en: 'car', cn: '汽车', ipa: '/k\u0251\u02d0r/', sentence: 'Dad drives a car.', sentenceCn: '爸爸开车。' },
        { en: 'dog', cn: '狗', ipa: '/d\u0252\u0261/', sentence: 'The dog is running.', sentenceCn: '小狗在跑。' }
      ];
      var word = demoWords[Math.floor(Math.random() * demoWords.length)];

      setTimeout(function() {
        currentWord = word;
        document.getElementById('resultWord').textContent = word.en;
        document.getElementById('resultCn').textContent = word.cn;
        document.getElementById('resultIpa').textContent = word.ipa;
        document.getElementById('resultEnSentence').textContent = word.sentence;
        document.getElementById('resultCnSentence').textContent = word.sentenceCn;
        document.getElementById('resultCard').classList.add('show');
        btn.textContent = '&#128269; 重新识别';
        btn.disabled = false;

        // Elf story
        var elfName = elfConfig.name || '小精灵';
        addChatMessage('elf', '哇！我在图片里发现了 ' + word.cn + '（' + word.en + '）！\n\n' + word.sentence + '\n' + word.sentenceCn);
      }, 1500);
    }

    function playWord() {
      if (!synth || !currentWord) return;
      synth.cancel();
      var u = new SpeechSynthesisUtterance(currentWord.en);
      u.lang = 'en-US'; u.rate = 0.8; u.pitch = 1.1;
      synth.speak(u);
    }

    function addToCards() {
      if (!currentWord) return;
      var cards = JSON.parse(localStorage.getItem('ke_ai_cards') || '[]');
      cards.push({
        en: currentWord.en, cn: currentWord.cn, ipa: currentWord.ipa,
        sentence: currentWord.sentence, sentenceCn: currentWord.sentenceCn,
        img: currentPhoto, time: new Date().toISOString()
      });
      localStorage.setItem('ke_ai_cards', JSON.stringify(cards));
      showToast('已加入我的词库！');
    }

    // ===== Elf Customize =====
    var customSelections = { base: 'cat', color: 'purple', acc: 'none' };

    function selectOption(btn) {
      var type = btn.getAttribute('data-type');
      document.querySelectorAll('.option-btn[data-type="' + type + '"]').forEach(function(b) {
        b.classList.remove('selected');
      });
      btn.classList.add('selected');
      customSelections[type] = btn.getAttribute('data-val');
      updatePreview();
    }

    function updatePreview() {
      var emojis = {
        cat: '&#128570;', dog: '&#128054;', owl: '&#129417;',
        fox: '&#129418;', rabbit: '&#128048;', dragon: '&#128009;'
      };
      var colors = {
        purple: 'linear-gradient(135deg, #9B7ED8, #B8A0E8)',
        blue: 'linear-gradient(135deg, #4AAFFF, #7EC8E8)',
        green: 'linear-gradient(135deg, #6BCB77, #7EE8A0)',
        pink: 'linear-gradient(135deg, #FF8AC8, #FFB8E0)',
        orange: 'linear-gradient(135deg, #FFB84A, #FFD48A)'
      };
      var preview = document.getElementById('customPreview');
      preview.style.background = colors[customSelections.color] || colors.purple;
      preview.innerHTML = emojis[customSelections.base] || emojis.cat;
    }

    function generateElf() {
      var name = document.getElementById('elfNameInput').value.trim();
      if (!name) {
        showToast('请给精灵取个名字哦~');
        return;
      }

      // Generate avatar using Pollinations.ai
      var prompts = {
        cat: 'cute cartoon cat mascot', dog: 'cute cartoon dog mascot',
        owl: 'cute cartoon owl mascot', fox: 'cute cartoon fox mascot',
        rabbit: 'cute cartoon rabbit mascot', dragon: 'cute cartoon dragon mascot'
      };
      var colorNames = { purple: 'purple', blue: 'blue', green: 'green', pink: 'pink', orange: 'orange' };
      var accNames = { none: '', glasses: 'wearing glasses', hat: 'wearing a hat', bow: 'with a bow', star: 'with a star' };

      var prompt = 'A ' + colorNames[customSelections.color] + ' ' + prompts[customSelections.base];
      if (accNames[customSelections.acc]) prompt += ', ' + accNames[customSelections.acc];
      prompt += ', friendly kawaii style, simple clean design, white background, high quality illustration';

      var avatarUrl = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=300&height=300&nologo=true';

      elfConfig = {
        name: name, base: customSelections.base, color: customSelections.color,
        acc: customSelections.acc, avatar: avatarUrl, created: new Date().toISOString()
      };
      localStorage.setItem('ke_elf_config', JSON.stringify(elfConfig));

      // Update preview with generated image
      var preview = document.getElementById('customPreview');
      preview.innerHTML = '<img src="' + avatarUrl + '" alt="elf">';

      showToast('&#10024; ' + name + ' 诞生了！');
      setTimeout(function() { showPage('page-home'); }, 1500);
    }

    // ===== Chat =====
    function renderChat() {
      var container = document.getElementById('chatMessages');
      container.innerHTML = '';
      var elfName = elfConfig.name || '小精灵';

      // Welcome message
      if (chatHistory.length === 0) {
        var welcome = '你好呀！我是' + elfName + '。\n\n你可以问我：\n&#8226; "苹果怎么说？"\n&#8226; "教我一个句子"\n&#8226; "今天学到了什么？"';
        addChatMessage('elf', welcome, false);
      } else {
        chatHistory.forEach(function(msg) {
          addChatMessage(msg.role, msg.content, false);
        });
      }
    }

    function addChatMessage(role, content, save) {
      if (save !== false) {
        chatHistory.push({ role: role, content: content, time: new Date().toISOString() });
        if (chatHistory.length > 100) chatHistory = chatHistory.slice(-100);
        localStorage.setItem('ke_elf_chat', JSON.stringify(chatHistory));
      }

      var container = document.getElementById('chatMessages');
      var bubble = document.createElement('div');
      bubble.className = 'chat-bubble ' + role;

      if (role === 'elf') {
        var nameTag = document.createElement('div');
        nameTag.className = 'elf-name-tag';
        nameTag.textContent = elfConfig.name || '小精灵';
        bubble.appendChild(nameTag);
      }

      var text = document.createElement('div');
      text.innerHTML = content.replace(/\n/g, '<br>');
      bubble.appendChild(text);

      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
    }

    function sendChat() {
      var input = document.getElementById('chatInput');
      var text = input.value.trim();
      if (!text) return;

      addChatMessage('user', text);
      input.value = '';

      // Simple response logic
      var elfName = elfConfig.name || '小精灵';
      var response = generateResponse(text);
      setTimeout(function() {
        addChatMessage('elf', response);
      }, 500);
    }

    function generateResponse(text) {
      var lower = text.toLowerCase();
      var elfName = elfConfig.name || '小精灵';

      if (lower.indexOf('你好') > -1 || lower.indexOf('hi') > -1 || lower.indexOf('hello') > -1) {
        return '你好呀！今天想学什么英语呢？&#128522;';
      }
      if (lower.indexOf('苹果') > -1) {
        return '苹果是 <b>apple</b>！\n发音：/\u02c8\u00e6pl/\n\n例句：I like apples.（我喜欢苹果。）';
      }
      if (lower.indexOf('狗') > -1 || lower.indexOf('dog') > -1) {
        return '狗是 <b>dog</b>！\n发音：/d\u0252\u0261/\n\n例句：The dog is cute.（这只狗很可爱。）';
      }
      if (lower.indexOf('猫') > -1 || lower.indexOf('cat') > -1) {
        return '猫是 <b>cat</b>！\n发音：/k\u00e6t/\n\n例句：The cat is sleeping.（小猫在睡觉。）';
      }
      if (lower.indexOf('句子') > -1 || lower.indexOf('教') > -1) {
        return '今天教你一句：\n\n<b>Good morning!</b>\n（早上好！）\n\n来，跟我一起说：Good~ morning~';
      }
      if (lower.indexOf('今天') > -1 || lower.indexOf('学到') > -1) {
        var cards = JSON.parse(localStorage.getItem('ke_ai_cards') || '[]');
        if (cards.length === 0) {
          return '今天还没有学到新单词呢，快去"拍照识物"吧！&#128247;';
        }
        return '今天你已经学了 ' + cards.length + ' 个单词啦！\n\n最新学的是：<b>' + cards[cards.length-1].en + '</b>（' + cards[cards.length-1].cn + '）\n\n继续加油！&#11088;';
      }
      if (lower.indexOf('名字') > -1) {
        return '我叫' + elfName + '！是你的英语小精灵~\n\n我们可以一起学英语、拍照识物、讲故事！';
      }
      if (lower.indexOf('故事') > -1) {
        return showElfStory();
      }

      return '哇，这个问题好有趣！\n\n我现在还在学习中，你可以试试问我：\n&#8226; "苹果怎么说？"\n&#8226; "教我一个句子"\n&#8226; "今天学到了什么？"';
    }

    function showElfStory() {
      var elfName = elfConfig.name || '小精灵';
      var now = new Date();
      var hour = now.getHours();
      var timeDesc = hour < 12 ? '早上' : hour < 18 ? '下午' : '晚上';
      var scenes = ['公园', '超市', '幼儿园', '家里', '图书馆'];
      var scene = scenes[Math.floor(Math.random() * scenes.length)];

      var story = timeDesc + '好！我是' + elfName + '。\n\n今天是' + (now.getMonth()+1) + '月' + now.getDate() + '日，' +
        '我在' + scene + '遇到了你！\n\n' +
        '我们一起学英语吧~\n\n' +
        '<b>Today is a good day!</b>\n（今天是美好的一天！）';

      if (currentPage === 'page-home') {
        showToast(story.replace(/<[^>]+>/g, '').substring(0, 50) + '...');
      }
      return story;
    }

    // ===== Utils =====
    function showToast(msg) {
      var toast = document.getElementById('toast');
      toast.innerHTML = msg;
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 2500);
    }

    // Start
    init();
  </script>
</body>
</html>
