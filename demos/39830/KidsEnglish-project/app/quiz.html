<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#6BCB77">
  <title>趣味识图 - 幼儿英语启蒙</title>
  <style>
    @font-face { font-family:'InstrumentSans'; src:url('_shared/fonts/InstrumentSans-Regular.ttf') format('truetype'); font-weight:400; }
    @font-face { font-family:'InstrumentSans'; src:url('_shared/fonts/InstrumentSans-Bold.ttf') format('truetype'); font-weight:700; }
    @font-face { font-family:'BricolageGrotesque'; src:url('_shared/fonts/BricolageGrotesque-Regular.ttf') format('truetype'); font-weight:400; }
    @font-face { font-family:'BricolageGrotesque'; src:url('_shared/fonts/BricolageGrotesque-Bold.ttf') format('truetype'); font-weight:700; }

    :root {
      --bg: #F0FFF4; --bg2: #E8F8EE; --ink: #2D2A26; --muted: #8A8580;
      --accent: #6BCB77; --accent2: #4AAFFF; --accent3: #FFB84A;
      --accent4: #FF6B4A; --accent5: #C77DFF;
      --correct: #6BCB77; --wrong: #FF6B6B;
      --font: 'InstrumentSans', 'BricolageGrotesque', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font); color: var(--ink); background: var(--bg);
      line-height: 1.6; overscroll-behavior: none;
      -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom);
      min-height: 100vh;
    }

    /* ===== Header ===== */
    .q-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(240,255,244,0.92);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid #C8E6C9;
      padding: 12px 16px; display: flex; align-items: center; gap: 8px;
    }
    .back-btn {
      width: 40px; height: 40px; border: none; border-radius: 50%;
      background: var(--bg2); color: var(--ink); font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; flex-shrink: 0;
    }
    .back-btn:active { background: var(--accent); color: #fff; transform: scale(0.95); }
    .q-header h1 {
      font-family: 'BricolageGrotesque', sans-serif; font-size: 1.15rem;
      font-weight: 700; flex: 1; text-align: center; margin-right: 40px;
    }

    /* ===== Pages (show/hide) ===== */
    .page { display: none; }
    .page.active { display: block; }

    /* ===== Gallery Page: Category Grid ===== */
    .gallery-page { max-width: 600px; margin: 0 auto; padding: 1rem 1rem 2rem; }
    .gallery-page h2 {
      font-family: 'BricolageGrotesque', sans-serif; font-size: 1.2rem;
      font-weight: 700; margin-bottom: 1rem; padding: 0 0.5rem;
    }
    .cat-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.7rem;
    }
    .cat-card {
      background: #fff; border: 1.5px solid #C8E6C9; border-radius: 14px;
      padding: 1rem 0.8rem; text-align: center; cursor: pointer; transition: all 0.2s;
    }
    .cat-card:active { transform: scale(0.97); }
    .cat-card .cat-icon { font-size: 2rem; margin-bottom: 0.3rem; }
    .cat-card .cat-name { font-size: 0.9rem; font-weight: 700; }
    .cat-card .cat-count { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

    /* ===== Gallery Detail: Word Cards ===== */
    .gallery-detail { max-width: 600px; margin: 0 auto; padding: 1rem 1rem 2rem; }
    .lang-toggle {
      display: flex; gap: 0; background: var(--bg2); border-radius: 10px;
      overflow: hidden; margin-bottom: 1rem; border: 1px solid #C8E6C9;
    }
    .lang-btn {
      flex: 1; padding: 10px; text-align: center; font-size: 0.85rem;
      font-weight: 600; cursor: pointer; border: none; background: transparent;
      color: var(--muted); font-family: var(--font); transition: all 0.2s;
    }
    .lang-btn.active { background: var(--accent); color: #fff; }

    .section-title {
      font-size: 1rem; font-weight: 700; color: var(--ink);
      padding: 0.8rem 0 0.5rem 0.5rem;
      border-left: 3px solid var(--accent); margin: 1rem 0 0.5rem;
    }
    .section-title:first-child { margin-top: 0; }

    .word-card-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.6rem;
    }
    .wc {
      background: #fff; border: 1.5px solid #E8E0D8; border-radius: 12px;
      overflow: hidden; cursor: pointer; transition: all 0.2s; position: relative;
    }
    .wc:active { transform: scale(0.97); }
    .wc .wc-img {
      width: 100%; height: 110px; object-fit: cover; display: block; background: #f5f5f5;
    }
    .wc .wc-emoji {
      width: 100%; height: 110px; display: flex; align-items: center;
      justify-content: center; font-size: 3.5rem; background: #f5f5f5;
    }
    .wc .wc-info { padding: 8px; text-align: center; }
    .wc .wc-en {
      font-weight: 700; font-size: 0.95rem; color: var(--ink);
      font-family: 'BricolageGrotesque', sans-serif;
    }
    .wc .wc-cn { font-size: 0.78rem; color: var(--muted); margin-top: 1px; }
    .wc .wc-ipa { font-size: 0.7rem; color: var(--accent2); font-style: italic; margin-top: 1px; }
    .wc .wc-speak {
      position: absolute; top: 6px; right: 6px; width: 30px; height: 30px;
      border-radius: 50%; border: none; background: rgba(74,175,255,0.9);
      color: #fff; font-size: 14px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s;
    }
    .wc:hover .wc-speak, .wc:active .wc-speak { opacity: 1; }
    .wc .wc-speak.playing { background: var(--accent4); animation: pulse 1s infinite; }

    /* ===== Quiz Select Page ===== */
    .quiz-select { max-width: 600px; margin: 0 auto; padding: 1.5rem; }
    .quiz-select h2 {
      font-family: 'BricolageGrotesque', sans-serif; font-size: 1.2rem;
      font-weight: 700; margin-bottom: 0.5rem; text-align: center;
    }
    .quiz-select > p { text-align: center; font-size: 0.82rem; color: var(--muted); margin-bottom: 1.2rem; }
    .mode-row { display: flex; gap: 0.8rem; margin-bottom: 1.2rem; }
    .mode-card {
      flex: 1; background: #fff; border: 2px solid #C8E6C9; border-radius: 14px;
      padding: 1rem; text-align: center; cursor: pointer; transition: all 0.2s;
    }
    .mode-card:active { transform: scale(0.97); }
    .mode-card.selected { border-color: var(--accent); background: rgba(107,203,119,0.06); }
    .mode-card .mode-icon { font-size: 1.8rem; margin-bottom: 0.3rem; }
    .mode-card .mode-name { font-size: 0.9rem; font-weight: 700; }
    .mode-card .mode-desc { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

    .diff-row { display: flex; gap: 0.6rem; justify-content: center; margin-bottom: 1rem; }
    .diff-btn {
      padding: 8px 16px; border: 2px solid #C8E6C9; border-radius: 10px;
      background: #fff; font-size: 0.82rem; font-weight: 600;
      color: var(--ink); cursor: pointer; font-family: var(--font); transition: all 0.15s;
    }
    .diff-btn.selected { border-color: var(--accent); background: rgba(107,203,119,0.1); color: var(--accent); }
    .diff-btn:active { transform: scale(0.96); }

    .cat-select-area { margin-bottom: 1rem; }
    .cat-select-area .cat-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .cat-select-area .cat-card { padding: 0.8rem 0.6rem; }
    .cat-select-area .cat-card .cat-icon { font-size: 1.6rem; }
    .cat-select-area .cat-card .cat-name { font-size: 0.82rem; }
    .cat-select-area .cat-card.selected { border-color: var(--accent); background: rgba(107,203,119,0.06); }

    .start-btn {
      display: block; width: 100%; max-width: 300px; margin: 0 auto;
      padding: 14px; background: var(--accent); color: #fff; border: none;
      border-radius: 14px; font-size: 1.05rem; font-weight: 700;
      font-family: var(--font); cursor: pointer; transition: all 0.2s;
    }
    .start-btn:active { transform: scale(0.97); background: #5AB868; }
    .start-btn:disabled { background: #C8E6C9; color: var(--muted); cursor: default; }

    /* ===== Quiz Play Page ===== */
    .progress-bar-wrap { padding: 8px 16px; background: var(--bg2); }
    .progress-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.8rem; color: var(--muted); }
    .progress-info .score { color: var(--accent3); font-weight: 700; font-size: 0.9rem; }
    .progress-track { width: 100%; height: 8px; background: #C8E6C9; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #4CAF50); border-radius: 4px; transition: width 0.4s ease; width: 0%; }

    .quiz-play { max-width: 600px; margin: 0 auto; padding: 1rem 1rem 2rem; }
    .question-box {
      background: #fff; border-radius: 18px; padding: 1.5rem;
      text-align: center; margin-bottom: 1.2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1px solid #C8E6C9;
    }
    .question-prompt { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; }
    .question-word {
      font-family: 'BricolageGrotesque', sans-serif; font-size: 2rem;
      font-weight: 700; color: var(--ink); margin-bottom: 0.3rem;
    }
    .question-cn { font-size: 0.9rem; color: var(--muted); }
    .speak-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 56px; height: 56px; border-radius: 50%;
      border: 3px solid var(--accent2); background: #E3F2FD;
      color: var(--accent2); font-size: 1.5rem; cursor: pointer;
      margin-top: 0.8rem; transition: all 0.2s;
    }
    .speak-btn:active { transform: scale(0.92); background: var(--accent2); color: #fff; }
    .speak-btn.playing { background: var(--accent2); color: #fff; animation: pulse 1s infinite; }

    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    .option-card {
      background: #fff; border: 3px solid #E8E0D8; border-radius: 16px;
      overflow: hidden; cursor: pointer; transition: all 0.2s; position: relative;
    }
    .option-card:active { transform: scale(0.97); }
    .option-card .option-img { width: 100%; height: 140px; object-fit: cover; display: block; background: #f5f5f5; }
    .option-card .option-emoji { width: 100%; height: 140px; display: flex; align-items: center; justify-content: center; font-size: 4rem; background: #f5f5f5; }
    .option-card .option-label { padding: 8px; text-align: center; font-size: 0.85rem; font-weight: 600; color: var(--ink); background: #fff; }
    .option-card.correct { border-color: var(--correct); background: rgba(107,203,119,0.08); animation: correctPop 0.4s ease; }
    .option-card.correct::after {
      content: '\2714'; position: absolute; top: 8px; right: 8px;
      width: 32px; height: 32px; border-radius: 50%; background: var(--correct);
      color: #fff; font-size: 1.1rem; display: flex; align-items: center;
      justify-content: center; animation: popIn 0.3s ease;
    }
    .option-card.wrong { border-color: var(--wrong); background: rgba(255,107,107,0.08); animation: shake 0.4s ease; }
    .option-card.wrong::after {
      content: '\2718'; position: absolute; top: 8px; right: 8px;
      width: 32px; height: 32px; border-radius: 50%; background: var(--wrong);
      color: #fff; font-size: 1.1rem; display: flex; align-items: center;
      justify-content: center; animation: popIn 0.3s ease;
    }
    .option-card.disabled { pointer-events: none; opacity: 0.6; }

    .next-btn {
      display: block; width: 100%; max-width: 300px; margin: 1.2rem auto 0;
      padding: 12px; background: var(--accent2); color: #fff; border: none;
      border-radius: 12px; font-size: 1rem; font-weight: 700;
      font-family: var(--font); cursor: pointer; transition: all 0.2s; display: none;
    }
    .next-btn.show { display: block; animation: popIn 0.3s ease; }
    .next-btn:active { transform: scale(0.97); }

    /* ===== Result Page ===== */
    .result-page { max-width: 500px; margin: 0 auto; padding: 2rem 1.5rem; text-align: center; }
    .result-icon { font-size: 4rem; margin-bottom: 1rem; }
    .result-title { font-family: 'BricolageGrotesque', sans-serif; font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .result-score { font-size: 2.5rem; font-weight: 700; color: var(--accent); margin: 0.5rem 0; }
    .result-score span { font-size: 1rem; color: var(--muted); font-weight: 400; }
    .result-detail { font-size: 0.9rem; color: var(--muted); margin-bottom: 1.5rem; }
    .result-stars { font-size: 2rem; margin: 0.5rem 0 1rem; }
    .result-actions { display: flex; gap: 0.8rem; justify-content: center; }
    .result-btn {
      padding: 12px 24px; border: none; border-radius: 12px;
      font-size: 0.95rem; font-weight: 700; font-family: var(--font);
      cursor: pointer; transition: all 0.2s;
    }
    .result-btn:active { transform: scale(0.97); }
    .result-btn.primary { background: var(--accent); color: #fff; }
    .result-btn.secondary { background: var(--bg2); color: var(--ink); }

    /* ===== Feedback Toast ===== */
    .feedback-toast {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0); z-index: 100;
      padding: 16px 32px; border-radius: 16px; font-size: 1.2rem;
      font-weight: 700; color: #fff; pointer-events: none; transition: all 0.3s ease;
    }
    .feedback-toast.show { transform: translate(-50%, -50%) scale(1); }
    .feedback-toast.correct-toast { background: var(--correct); box-shadow: 0 8px 24px rgba(107,203,119,0.4); }
    .feedback-toast.wrong-toast { background: var(--wrong); box-shadow: 0 8px 24px rgba(255,107,107,0.4); }

    /* ===== Error Message ===== */
    .error-msg {
      text-align: center; padding: 2rem; color: var(--muted);
    }
    .error-msg .retry-btn {
      margin-top: 1rem; padding: 10px 20px; background: var(--accent); color: #fff;
      border: none; border-radius: 10px; font-size: 0.9rem; cursor: pointer;
    }

    /* ===== Animations ===== */
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(74,175,255,0.4); }
      70% { box-shadow: 0 0 0 10px rgba(74,175,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(74,175,255,0); }
    }
    @keyframes correctPop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== Responsive ===== */
    @media (max-width: 360px) {
      .options-grid { gap: 0.6rem; }
      .option-card .option-img, .option-card .option-emoji { height: 110px; }
      .question-word { font-size: 1.6rem; }
      .word-card-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    }
    @media (min-width: 600px) {
      .cat-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="q-header">
    <button class="back-btn" id="backBtn" onclick="handleBack()">&#8592;</button>
    <h1 id="headerTitle">趣味识图</h1>
  </div>

  <!-- ===== Page: Gallery (Category List) ===== -->
  <div class="page active" id="page-gallery">
    <div class="gallery-page" id="galleryList">
      <h2>&#128444; 认识图片</h2>
      <div class="cat-grid" id="galleryCatGrid"></div>
      <div class="error-msg" id="galleryError" style="display:none;">
        <p>数据加载失败，请刷新重试</p>
        <button class="retry-btn" onclick="location.reload()">刷新</button>
      </div>
    </div>
  </div>

  <!-- ===== Page: Gallery Detail (Word Cards) ===== -->
  <div class="page" id="page-gallery-detail">
    <div class="gallery-detail" id="galleryDetail"></div>
  </div>

  <!-- ===== Page: Quiz Select ===== -->
  <div class="page" id="page-quiz">
    <div class="quiz-select" id="quizSelectPage">
      <h2>&#127918; 趣味互动</h2>
      <p>听英语发音，选出对应的图片</p>

      <div class="mode-row">
        <div class="mode-card selected" data-mode="category" onclick="selectMode(this)">
          <div class="mode-icon">&#128218;</div>
          <div class="mode-name">指定分类</div>
          <div class="mode-desc">选择一个分类出题</div>
        </div>
        <div class="mode-card" data-mode="random" onclick="selectMode(this)">
          <div class="mode-icon">&#127922;</div>
          <div class="mode-name">随机出题</div>
          <div class="mode-desc">从所有分类随机混合</div>
        </div>
      </div>

      <div class="diff-row">
        <button class="diff-btn selected" data-count="4" onclick="selectDifficulty(this)">简单 (4选1)</button>
        <button class="diff-btn" data-count="6" onclick="selectDifficulty(this)">普通 (6选1)</button>
      </div>

      <div class="cat-select-area" id="catSelectArea">
        <div class="cat-grid" id="quizCatGrid"></div>
      </div>

      <button class="start-btn" id="startBtn" disabled onclick="startQuiz()">开始挑战</button>
    </div>
  </div>

  <!-- ===== Page: Quiz Play ===== -->
  <div class="page" id="page-quiz-play">
    <div class="progress-bar-wrap" id="progressWrap">
      <div class="progress-info">
        <span id="progressText">第 1/10 题</span>
        <span class="score" id="scoreText">&#9733; 0 分</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
    <div class="quiz-play">
      <div class="question-box">
        <div class="question-prompt">听一听，选出正确的图片</div>
        <div class="question-word" id="questionWord"></div>
        <div class="question-cn" id="questionCn"></div>
        <button class="speak-btn" id="speakBtn" onclick="speakQuestion()">&#128266;</button>
      </div>
      <div class="options-grid" id="optionsGrid"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一题 &#10132;</button>
    </div>
  </div>

  <!-- ===== Page: Result ===== -->
  <div class="page" id="page-result">
    <div class="result-page">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-stars" id="resultStars"></div>
      <div class="result-score" id="resultScore"></div>
      <div class="result-detail" id="resultDetail"></div>
      <div class="result-actions">
        <button class="result-btn secondary" onclick="backToQuizSelect()">返回选择</button>
        <button class="result-btn primary" onclick="retryQuiz()">再来一次</button>
      </div>
    </div>
  </div>

  <!-- Feedback Toast -->
  <div class="feedback-toast" id="feedbackToast"></div>

  <script>
/**
 * KidsEnglish - Word Bank
 * 儿童英语词汇库
 * 包含 34 个分类，涵盖日常生活各场景的英语词汇
 *
 * 数据结构:
 *   WORD_BANK = {
 *     [categoryId]: {
 *       name: '分类中文名',
 *       icon: '代表性emoji',
 *       sections: [
 *         {
 *           name: '小分类名',
 *           words: [
 *             { en: '英文', cn: '中文', ipa: '/音标/', emoji: 'emoji' [, img: '图片路径'] }
 *           ]
 *         }
 *       ]
 *     }
 * <script>
/**
 * KidsEnglish - Word Bank
 * 儿童英语词汇库
 * 包含 34 个分类，涵盖日常生活各场景的英语词汇
 *
 * 数据结构:
 *   WORD_BANK = {
 *     [categoryId]: {
 *       name: '分类中文名',
 *       icon: '代表性emoji',
 *       sections: [
 *         {
 *           name: '小分类名',
 *           words: [
 *             { en: '英文', cn: '中文', ipa: '/音标/', emoji: 'emoji' [, img: '图片路径'] }
 *           ]
 *         }
 *       ]
 *     }
 *   }
 */

var WORD_BANK = {
  actions: {
    name: '动作词',
    icon: '🏃',
    sections: [
      {
        name: '日常动作',
        words: [
          { en: 'walk', cn: '走', ipa: '/wɔːk/', emoji: '🚶' },
          { en: 'run', cn: '跑', ipa: '/rʌn/', emoji: '🏃' },
          { en: 'jump', cn: '跳', ipa: '/dʒʌmp/', emoji: '🦘' },
          { en: 'sit', cn: '坐', ipa: '/sɪt/', emoji: '🪑' },
          { en: 'stand', cn: '站', ipa: '/stænd/', emoji: '🧍' },
          { en: 'sleep', cn: '睡觉', ipa: '/sliːp/', emoji: '😴' },
          { en: 'eat', cn: '吃', ipa: '/iːt/', emoji: '🍽️' },

  <script>
    // ===== State =====
    var currentPage = 'page-gallery'; // default page
    var currentLang = 'en';
    var quizMode = 'category';
    var selectedCatId = null;
    var optionCount = 4;
    var currentQuestions = [];
    var currentIdx = 0;
    var score = 0;
    var answered = false;
    var synth = window.speechSynthesis;
    var currentUtterance = null;
    var pageHistory = ['page-gallery'];
    var isQuizMode = false; // true if entered from quiz sub-entry

    // ===== Init =====
    function init() {
      // Check if WORD_BANK loaded
      if (typeof WORD_BANK === 'undefined' || !WORD_BANK) {
        document.getElementById('galleryError').style.display = 'block';
        return;
      }

      renderGalleryCategories();
      renderQuizCategories();
      if (synth) { synth.onvoiceschanged = function() { synth.getVoices(); }; }

      // Check URL mode parameter
      var params = new URLSearchParams(location.search);
      var mode = params.get('mode');
      if (mode === 'browse') {
        isQuizMode = false;
        showPage('page-gallery');
        pageHistory = ['page-gallery'];
        document.getElementById('headerTitle').textContent = '认识图片';
      } else if (mode === 'quiz') {
        isQuizMode = true;
        showPage('page-quiz');
        pageHistory = ['page-quiz'];
        document.getElementById('headerTitle').textContent = '趣味互动';
      } else {
        // Default: show gallery categories
        isQuizMode = false;
        showPage('page-gallery');
        pageHistory = ['page-gallery'];
        document.getElementById('headerTitle').textContent = '认识图片';
      }
    }

    // ===== Navigation =====
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
      var el = document.getElementById(pageId);
      if (el) el.classList.add('active');
      currentPage = pageId;
    }

    function navigateTo(pageId) {
      showPage(pageId);
      pageHistory.push(pageId);
    }

    function handleBack() {
      if (synth) synth.cancel();
      if (pageHistory.length > 1) {
        pageHistory.pop();
        var prev = pageHistory[pageHistory.length - 1];
        showPage(prev);
        // Update header title based on page
        if (prev === 'page-gallery') {
          document.getElementById('headerTitle').textContent = '认识图片';
        } else if (prev === 'page-quiz') {
          document.getElementById('headerTitle').textContent = '趣味互动';
        } else if (prev === 'page-gallery-detail') {
          // Keep current category name or default
          var title = document.getElementById('headerTitle').textContent;
          if (!title || title === '挑战结果') document.getElementById('headerTitle').textContent = '认识图片';
        } else if (prev === 'page-quiz-play') {
          document.getElementById('headerTitle').textContent = '趣味互动';
        } else if (prev === 'page-result') {
          document.getElementById('headerTitle').textContent = '趣味互动';
        }
      } else {
        // Go back to index.html
        location.replace('index.html');
      }
    }

    // ===== Gallery: Category List =====
    function renderGalleryCategories() {
      var grid = document.getElementById('galleryCatGrid');
      if (!grid) return;
      var html = '';
      var catOrder = ['animals','fruits','food','vehicles','body','toys','plants','weather',
        'sports','dress','family','jobs','colors','emotions','actions','numbers','phonics',
        'hobbies','festivals','greetings','manners','attitude','opinion','willingness',
        'meal','wash','wake-up','bedtime','kindergarten','hospital','siblings','seniors',
        'outing','park','time','supermarket','plan'];
      var hasAny = false;
      for (var i = 0; i < catOrder.length; i++) {
        var catId = catOrder[i];
        if (!WORD_BANK[catId]) continue;
        hasAny = true;
        var cat = WORD_BANK[catId];
        var count = getAllWords(cat).length;
        html += '<div class="cat-card" data-cat="' + catId + '" onclick="openGalleryDetail(\'' + catId + '\')">';
        html += '<div class="cat-icon">' + cat.icon + '</div>';
        html += '<div class="cat-name">' + escapeHtml(cat.name) + '</div>';
        html += '<div class="cat-count">' + count + ' 个单词</div>';
        html += '</div>';
      }
      if (!hasAny) {
        html = '<div class="error-msg"><p>暂无分类数据</p></div>';
      }
      grid.innerHTML = html;
    }

    // ===== Gallery: Word Cards Detail =====
    function openGalleryDetail(catId) {
      var cat = WORD_BANK[catId];
      if (!cat) return;
      document.getElementById('headerTitle').textContent = escapeHtml(cat.name);
      navigateTo('page-gallery-detail');

      var container = document.getElementById('galleryDetail');
      var html = '';

      // Language toggle
      html += '<div class="lang-toggle">';
      html += '<button class="lang-btn active" data-lang="en" onclick="switchLang(\'en\')">English</button>';
      html += '<button class="lang-btn" data-lang="cn" onclick="switchLang(\'cn\')">\u4e2d\u6587</button>';
      html += '</div>';

      // Sections
      if (cat.sections) {
        for (var s = 0; s < cat.sections.length; s++) {
          var sec = cat.sections[s];
          html += '<div class="section-title">' + escapeHtml(sec.name) + '</div>';
          html += '<div class="word-card-grid">';
          for (var w = 0; w < sec.words.length; w++) {
            var word = sec.words[w];
            html += '<div class="wc" onclick="speakWord(this, \'' + escapeAttr(word.en) + '\')">';
            if (word.img) {
              html += '<img class="wc-img" src="' + word.img + '" alt="' + escapeAttr(word.en) + '" loading="lazy">';
            } else {
              html += '<div class="wc-emoji">' + word.emoji + '</div>';
            }
            html += '<div class="wc-info">';
            html += '<div class="wc-en">' + escapeHtml(word.en) + '</div>';
            html += '<div class="wc-cn">' + escapeHtml(word.cn) + '</div>';
            if (word.ipa) html += '<div class="wc-ipa">' + word.ipa + '</div>';
            html += '</div>';
            html += '<button class="wc-speak" onclick="event.stopPropagation(); speakWord(this, \'' + escapeAttr(word.en) + '\')">&#128266;</button>';
            html += '</div>';
          }
          html += '</div>';
        }
      } else if (cat.words) {
        html += '<div class="word-card-grid">';
        for (var w = 0; w < cat.words.length; w++) {
          var word = cat.words[w];
          html += '<div class="wc" onclick="speakWord(this, \'' + escapeAttr(word.en) + '\')">';
          if (word.img) {
            html += '<img class="wc-img" src="' + word.img + '" alt="' + escapeAttr(word.en) + '" loading="lazy">';
          } else {
            html += '<div class="wc-emoji">' + word.emoji + '</div>';
          }
          html += '<div class="wc-info">';
          html += '<div class="wc-en">' + escapeHtml(word.en) + '</div>';
          html += '<div class="wc-cn">' + escapeHtml(word.cn) + '</div>';
          if (word.ipa) html += '<div class="wc-ipa">' + word.ipa + '</div>';
          html += '</div>';
          html += '<button class="wc-speak" onclick="event.stopPropagation(); speakWord(this, \'' + escapeAttr(word.en) + '\')">&#128266;</button>';
          html += '</div>';
        }
        html += '</div>';
      }

      container.innerHTML = html;
      currentLang = 'en';
    }

    function switchLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(function(b) {
        b.classList.toggle('active', b.getAttribute('data-lang') === lang);
      });
      var cards = document.querySelectorAll('.wc .wc-info');
      cards.forEach(function(info) {
        var enEl = info.querySelector('.wc-en');
        var cnEl = info.querySelector('.wc-cn');
        if (!enEl || !cnEl) return;
        if (lang === 'cn') {
          enEl.style.display = 'none';
          cnEl.style.display = 'block';
          cnEl.style.fontWeight = '700';
          cnEl.style.fontSize = '0.95rem';
          cnEl.style.color = 'var(--ink)';
        } else {
          enEl.style.display = 'block';
          cnEl.style.display = 'block';
          cnEl.style.fontWeight = '400';
          cnEl.style.fontSize = '0.78rem';
          cnEl.style.color = 'var(--muted)';
        }
      });
    }

    // ===== Quiz: Category Selection =====
    function renderQuizCategories() {
      var grid = document.getElementById('quizCatGrid');
      if (!grid) return;
      var html = '';
      var catOrder = ['animals','fruits','food','vehicles','body','toys','plants','weather',
        'sports','dress','family','jobs','colors','emotions','actions','numbers','phonics',
        'hobbies','festivals','greetings','manners','attitude','opinion','willingness',
        'meal','wash','wake-up','bedtime','kindergarten','hospital','siblings','seniors',
        'outing','park','time','supermarket','plan'];
      var hasAny = false;
      for (var i = 0; i < catOrder.length; i++) {
        var catId = catOrder[i];
        if (!WORD_BANK[catId]) continue;
        hasAny = true;
        var cat = WORD_BANK[catId];
        var count = getAllWords(cat).length;
        html += '<div class="cat-card" data-cat="' + catId + '" onclick="selectQuizCat(this)">';
        html += '<div class="cat-icon">' + cat.icon + '</div>';
        html += '<div class="cat-name">' + escapeHtml(cat.name) + '</div>';
        html += '<div class="cat-count">' + count + ' 个</div>';
        html += '</div>';
      }
      if (!hasAny) {
        html = '<div class="error-msg"><p>暂无分类数据</p></div>';
      }
      grid.innerHTML = html;
    }

    function selectMode(el) {
      document.querySelectorAll('.mode-card').forEach(function(c) { c.classList.remove('selected'); });
      el.classList.add('selected');
      quizMode = el.getAttribute('data-mode');
      selectedCatId = null;
      document.querySelectorAll('#quizCatGrid .cat-card').forEach(function(c) { c.classList.remove('selected'); });

      var catArea = document.getElementById('catSelectArea');
      if (quizMode === 'random') {
        catArea.style.display = 'none';
        document.getElementById('startBtn').disabled = false;
      } else {
        catArea.style.display = 'block';
        document.getElementById('startBtn').disabled = true;
      }
    }

    function selectQuizCat(el) {
      document.querySelectorAll('#quizCatGrid .cat-card').forEach(function(c) { c.classList.remove('selected'); });
      el.classList.add('selected');
      selectedCatId = el.getAttribute('data-cat');
      document.getElementById('startBtn').disabled = false;
    }

    function selectDifficulty(el) {
      document.querySelectorAll('.diff-btn').forEach(function(b) { b.classList.remove('selected'); });
      el.classList.add('selected');
      optionCount = parseInt(el.getAttribute('data-count'));
    }

    // ===== Quiz: Play =====
    function startQuiz() {
      var allWords = [];
      var quizCatName = '';

      if (quizMode === 'random') {
        for (var catId in WORD_BANK) {
          var cat = WORD_BANK[catId];
          var words = getAllWords(cat);
          for (var i = 0; i < words.length; i++) {
            words[i]._catId = catId;
            allWords.push(words[i]);
          }
        }
        shuffle(allWords);
        quizCatName = '\u968f\u673a\u6311\u6218';
      } else {
        if (!selectedCatId) {
          alert('\u8bf7\u5148\u9009\u62e9\u4e00\u4e2a\u5206\u7c7b');
          return;
        }
        var cat = WORD_BANK[selectedCatId];
        allWords = getAllWords(cat);
        for (var i = 0; i < allWords.length; i++) {
          allWords[i]._catId = selectedCatId;
        }
        shuffle(allWords);
        quizCatName = cat.name;
      }

      if (allWords.length === 0) {
        alert('\u8be5\u5206\u7c7b\u6682\u65e0\u8bcd\u6c47');
        return;
      }

      var total = Math.min(10, allWords.length);
      currentQuestions = allWords.slice(0, total);
      currentIdx = 0;
      score = 0;
      answered = false;

      document.getElementById('headerTitle').textContent = escapeHtml(quizCatName);
      navigateTo('page-quiz-play');

      showQuestion();
    }

    function showQuestion() {
      answered = false;
      var q = currentQuestions[currentIdx];
      var total = currentQuestions.length;

      document.getElementById('progressText').textContent = '\u7b2c ' + (currentIdx + 1) + '/' + total + ' \u9898';
      document.getElementById('scoreText').innerHTML = '&#9733; ' + score + ' \u5206';
      document.getElementById('progressFill').style.width = ((currentIdx / total) * 100) + '%';
      document.getElementById('questionWord').textContent = q.en;
      document.getElementById('questionCn').textContent = q.cn;
      document.getElementById('nextBtn').classList.remove('show');

      var options = buildOptions(q);
      var grid = document.getElementById('optionsGrid');
      var html = '';
      for (var i = 0; i < options.length; i++) {
        var opt = options[i];
        html += '<div class="option-card" data-en="' + escapeAttr(opt.en) + '" onclick="checkAnswer(this, \'' + escapeAttr(q.en) + '\')">';
        if (opt.img) {
          html += '<img class="option-img" src="' + opt.img + '" alt="' + escapeAttr(opt.en) + '" loading="eager">';
        } else {
          html += '<div class="option-emoji">' + opt.emoji + '</div>';
        }
        html += '<div class="option-label">' + escapeHtml(opt.cn) + '</div>';
        html += '</div>';
      }
      grid.innerHTML = html;
      setTimeout(function() { speakQuestion(); }, 400);
    }

    function buildOptions(correctWord) {
      var allWords = [];
      for (var catId in WORD_BANK) {
        var cat = WORD_BANK[catId];
        var words = getAllWords(cat);
        for (var i = 0; i < words.length; i++) {
          if (words[i].en !== correctWord.en) allWords.push(words[i]);
        }
      }
      shuffle(allWords);

      var options = [correctWord];
      var needed = optionCount - 1;
      for (var i = 0; i < needed && i < allWords.length; i++) {
        options.push(allWords[i]);
      }
      shuffle(options);
      return options;
    }

    function checkAnswer(el, correctEn) {
      if (answered) return;
      answered = true;
      var selectedEn = el.getAttribute('data-en');
      var isCorrect = selectedEn === correctEn;

      document.querySelectorAll('.option-card').forEach(function(card) {
        card.classList.add('disabled');
        if (card.getAttribute('data-en') === correctEn) card.classList.add('correct');
      });

      if (isCorrect) {
        score += 10;
        el.classList.add('correct');
        showFeedback(true);
      } else {
        el.classList.add('wrong');
        showFeedback(false);
      }

      document.getElementById('scoreText').innerHTML = '&#9733; ' + score + ' \u5206';
      var nextBtn = document.getElementById('nextBtn');
      nextBtn.textContent = currentIdx < currentQuestions.length - 1 ? '\u4e0b\u4e00\u9898 \u27a1' : '\u67e5\u770b\u7ed3\u679c \u27a1';
      nextBtn.classList.add('show');
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx >= currentQuestions.length) { showResult(); }
      else { showQuestion(); }
    }

    // ===== TTS =====
    function speakQuestion() {
      if (!synth || !currentQuestions[currentIdx]) return;
      synth.cancel();
      if (synth.paused) { try { synth.resume(); } catch(e) {} }
      var btn = document.getElementById('speakBtn');
      btn.classList.add('playing');
      var u = new SpeechSynthesisUtterance(currentQuestions[currentIdx].en);
      u.lang = 'en-US'; u.rate = 0.8; u.pitch = 1.1;
      pickVoice(u);
      u.onend = function() { btn.classList.remove('playing'); };
      u.onerror = function() { btn.classList.remove('playing'); };
      currentUtterance = u;
      setTimeout(function() { try { synth.speak(u); } catch(e) { btn.classList.remove('playing'); } }, 50);
    }

    function speakWord(btn, text) {
      if (!synth) return;
      synth.cancel();
      if (synth.paused) { try { synth.resume(); } catch(e) {} }
      btn.classList.add('playing');
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.8; u.pitch = 1.1;
      pickVoice(u);
      u.onend = function() { btn.classList.remove('playing'); };
      u.onerror = function() { btn.classList.remove('playing'); };
      setTimeout(function() { try { synth.speak(u); } catch(e) { btn.classList.remove('playing'); } }, 50);
    }

    function pickVoice(u) {
      var voices = synth.getVoices();
      var v = voices.find(function(v) { return v.lang.startsWith('en') && v.name.toLowerCase().indexOf('female') > -1; });
      if (!v) v = voices.find(function(v) { return v.lang.startsWith('en-US'); });
      if (!v) v = voices.find(function(v) { return v.lang.startsWith('en'); });
      if (v) u.voice = v;
    }

    // ===== Feedback =====
    function showFeedback(correct) {
      var toast = document.getElementById('feedbackToast');
      toast.className = 'feedback-toast ' + (correct ? 'correct-toast' : 'wrong-toast');
      toast.textContent = correct ? '\u2728 \u592a\u68d2\u4e86\uff01' : '\ud83d\ude1e \u518d\u8bd5\u8bd5\uff01';
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 1200);
    }

    // ===== Result =====
    function showResult() {
      document.getElementById('headerTitle').textContent = '\u6311\u6218\u7ed3\u679c';
      navigateTo('page-result');

      var total = currentQuestions.length;
      var maxScore = total * 10;
      var pct = Math.round((score / maxScore) * 100);

      var icon, title, stars;
      if (pct >= 90) { icon = '\ud83c\udf1f'; title = '\u5b8c\u7f8e\u8868\u73b0\uff01'; stars = '\u2b50\u2b50\u2b50'; }
      else if (pct >= 70) { icon = '\ud83c\udf1f'; title = '\u975e\u5e38\u68d2\uff01'; stars = '\u2b50\u2b50'; }
      else if (pct >= 50) { icon = '\ud83d\udc4d'; title = '\u7ee7\u7eed\u52a0\u6cb9\uff01'; stars = '\u2b50'; }
      else { icon = '\ud83d\udcaa'; title = '\u52a0\u6cb9\u54e6\uff01'; stars = '\ud83d\udd12'; }

      document.getElementById('resultIcon').textContent = icon;
      document.getElementById('resultTitle').textContent = title;
      document.getElementById('resultStars').textContent = stars;
      document.getElementById('resultScore').innerHTML = score + ' <span>/ ' + maxScore + ' \u5206</span>';
      document.getElementById('resultDetail').textContent =
        '\u5171 ' + total + ' \u9898\uff0c\u7b54\u5bf9 ' + (score / 10) + ' \u9898\uff0c\u6b63\u786e\u7387 ' + pct + '%';

      saveLearningRecord();
    }

    function saveLearningRecord() {
      try {
        var key = 'ke_quiz_history';
        var history = JSON.parse(localStorage.getItem(key) || '[]');
        var total = currentQuestions.length;
        var maxScore = total * 10;
        history.push({
          mode: quizMode,
          cat: selectedCatId || 'random',
          score: score, max: maxScore, total: total,
          pct: Math.round((score / maxScore) * 100),
          time: new Date().toISOString()
        });
        if (history.length > 100) history = history.slice(-100);
        localStorage.setItem(key, JSON.stringify(history));
      } catch(e) {}
    }

    function retryQuiz() { startQuiz(); }
    function backToQuizSelect() {
      document.getElementById('headerTitle').textContent = '\u8da3\u5473\u4e92\u52a8';
      showPage('page-quiz');
      pageHistory = ['page-quiz'];
    }

    // ===== Utils =====
    function getAllWords(cat) {
      var words = [];
      if (cat.words) {
        return cat.words.slice();
      }
      if (cat.sections) {
        for (var i = 0; i < cat.sections.length; i++) {
          words = words.concat(cat.sections[i].words);
        }
      }
      return words;
    }

    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // Start
    init();
  </script>
</body>
</html>
