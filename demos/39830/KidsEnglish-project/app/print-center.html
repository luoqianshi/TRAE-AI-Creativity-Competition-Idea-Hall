<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4AAFFF">
  <title>打印中心 - 幼儿英语启蒙</title>
  <style>
    @font-face { font-family:'InstrumentSans'; src:url('_shared/fonts/InstrumentSans-Regular.ttf') format('truetype'); font-weight:400; }
    @font-face { font-family:'InstrumentSans'; src:url('_shared/fonts/InstrumentSans-Bold.ttf') format('truetype'); font-weight:700; }
    @font-face { font-family:'BricolageGrotesque'; src:url('_shared/fonts/BricolageGrotesque-Regular.ttf') format('truetype'); font-weight:400; }
    @font-face { font-family:'BricolageGrotesque'; src:url('_shared/fonts/BricolageGrotesque-Bold.ttf') format('truetype'); font-weight:700; }

    :root {
      --bg: #F0F8FF; --bg2: #E0F0FF; --ink: #2D2A26; --muted: #8A8580;
      --accent: #4AAFFF; --accent2: #6BCB77; --accent3: #FFB84A;
      --font: 'InstrumentSans', 'BricolageGrotesque', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font); color: var(--ink); background: var(--bg);
      line-height: 1.6; overscroll-behavior: none; min-height: 100vh;
      -webkit-overflow-scrolling: touch;
    }

    /* Header */
    .print-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(240,248,255,0.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid #B8D4F0; padding: 12px 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .back-btn {
      width: 40px; height: 40px; border: none; border-radius: 50%;
      background: var(--bg2); color: var(--ink); font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; flex-shrink: 0;
    }
    .back-btn:active { background: var(--accent); color: #fff; transform: scale(0.95); }
    .print-header h1 {
      font-family: 'BricolageGrotesque', sans-serif; font-size: 1.15rem;
      font-weight: 700; flex: 1; text-align: center; margin-right: 40px;
    }

    /* Pages */
    .page { display: none; max-width: 800px; margin: 0 auto; padding: 1rem; }
    .page.active { display: block; }

    /* ===== Select Page ===== */
    .select-page {}
    .guide-box {
      background: linear-gradient(135deg, #E0F0FF, #F0F8FF);
      border: 2px solid #B8D4F0; border-radius: 14px;
      padding: 1rem 1.2rem; margin-bottom: 1rem;
    }
    .guide-box h3 { font-size: 0.95rem; margin-bottom: 0.4rem; color: var(--accent); }
    .guide-box p { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }

    .search-bar {
      display: flex; gap: 8px; margin-bottom: 1rem;
    }
    .search-input {
      flex: 1; padding: 10px 14px; border: 2px solid #B8D4F0;
      border-radius: 10px; font-size: 0.9rem; font-family: var(--font);
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-btn {
      padding: 10px 16px; background: var(--accent); color: #fff;
      border: none; border-radius: 10px; font-size: 0.85rem;
      font-weight: 700; cursor: pointer;
    }

    .filter-row {
      display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem;
      margin-bottom: 0.5rem; scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-btn {
      padding: 6px 12px; border: 2px solid #B8D4F0; border-radius: 20px;
      background: #fff; font-size: 0.8rem; cursor: pointer;
      font-family: var(--font); white-space: nowrap; transition: all 0.15s;
    }
    .filter-btn.selected { border-color: var(--accent); background: rgba(74,175,255,0.1); }
    .filter-btn:active { transform: scale(0.96); }

    .word-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.7rem;
    }
    .word-item {
      background: #fff; border: 2px solid #E0E0E0; border-radius: 12px;
      overflow: hidden; cursor: pointer; transition: all 0.2s; position: relative;
    }
    .word-item.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(74,175,255,0.2); }
    .word-item .check-mark {
      position: absolute; top: 6px; right: 6px; width: 24px; height: 24px;
      border-radius: 50%; background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; opacity: 0; transition: opacity 0.2s; z-index: 2;
    }
    .word-item.selected .check-mark { opacity: 1; }
    .word-item .wi-img {
      width: 100%; height: 90px; object-fit: cover; display: block; background: #f5f5f5;
    }
    .word-item .wi-emoji {
      width: 100%; height: 90px; display: flex; align-items: center;
      justify-content: center; font-size: 2.5rem; background: #f5f5f5;
    }
    .word-item .wi-info { padding: 6px; text-align: center; }
    .word-item .wi-en { font-size: 0.8rem; font-weight: 700; }
    .word-item .wi-cn { font-size: 0.7rem; color: var(--muted); }

    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #fff; border-top: 1px solid #E0E0E0;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      display: flex; align-items: center; gap: 12px; z-index: 100;
    }
    .selected-count { font-size: 0.85rem; color: var(--muted); flex: 1; }
    .selected-count b { color: var(--accent); }
    .print-action-btn {
      padding: 10px 20px; background: var(--accent); color: #fff;
      border: none; border-radius: 10px; font-size: 0.9rem;
      font-weight: 700; font-family: var(--font); cursor: pointer;
    }
    .print-action-btn:disabled { background: #B8D4F0; cursor: default; }

    /* ===== Preview Page ===== */
    .preview-page {}
    .preview-settings {
      background: #fff; border-radius: 14px; padding: 1rem;
      border: 2px solid #E0E0E0; margin-bottom: 1rem;
    }
    .preview-settings h3 { font-size: 0.95rem; margin-bottom: 0.8rem; }
    .setting-row { display: flex; align-items: center; margin-bottom: 0.6rem; }
    .setting-row label { font-size: 0.85rem; color: var(--muted); width: 100px; }
    .setting-row select, .setting-row input[type="checkbox"] {
      padding: 6px 10px; border: 2px solid #E0E0E0; border-radius: 8px;
      font-size: 0.85rem; font-family: var(--font);
    }

    .print-sheet {
      background: #fff; border: 1px solid #ccc;
      width: 210mm; min-height: 297mm; margin: 0 auto 1rem;
      padding: 10mm; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    @media screen {
      .print-sheet { transform: scale(0.45); transform-origin: top center; margin-bottom: -140mm; }
    }

    .sheet-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8mm;
    }
    .sheet-grid.size-2x2 { grid-template-columns: repeat(2, 1fr); }
    .sheet-grid.size-4x2 { grid-template-columns: repeat(4, 1fr); }

    .print-card {
      border: 2px solid #333; border-radius: 8px; overflow: hidden;
      background: #fff; page-break-inside: avoid;
    }
    .print-card .pc-img {
      width: 100%; height: 45mm; object-fit: cover; display: block;
    }
    .print-card .pc-emoji {
      width: 100%; height: 45mm; display: flex; align-items: center;
      justify-content: center; font-size: 3rem; background: #f5f5f5;
    }
    .print-card .pc-content { padding: 4mm; text-align: center; }
    .print-card .pc-en {
      font-family: 'BricolageGrotesque', sans-serif; font-size: 14pt;
      font-weight: 700; margin-bottom: 1mm;
    }
    .print-card .pc-ipa { font-size: 9pt; color: #666; margin-bottom: 1mm; }
    .print-card .pc-cn { font-size: 10pt; color: #333; }
    .print-card .pc-qr {
      width: 15mm; height: 15mm; margin: 2mm auto 0;
      background: #f5f5f5; display: flex; align-items: center;
      justify-content: center; font-size: 8pt; color: #999;
    }

    .print-guide {
      margin-top: 8mm; padding-top: 5mm; border-top: 1px dashed #ccc;
      font-size: 9pt; color: #666; line-height: 1.6;
    }

    .print-btns { display: flex; gap: 0.6rem; justify-content: center; margin: 1rem 0; }
    .print-btns button {
      padding: 12px 24px; border: none; border-radius: 12px;
      font-size: 0.95rem; font-weight: 700; font-family: var(--font);
      cursor: pointer; transition: all 0.2s;
    }
    .print-btns .btn-primary { background: var(--accent); color: #fff; }
    .print-btns .btn-secondary { background: var(--bg2); color: var(--ink); }

    @media print {
      body { background: #fff; }
      .print-header, .bottom-bar, .preview-settings, .print-btns { display: none !important; }
      .print-sheet { transform: none; margin: 0; box-shadow: none; border: none; }
      .page { display: block !important; max-width: none; padding: 0; }
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: rgba(45,42,38,0.9); color: #fff; padding: 10px 20px;
      border-radius: 10px; font-size: 0.85rem; z-index: 100;
      transition: transform 0.3s ease; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="print-header">
    <button class="back-btn" onclick="goBack()">&#8592;</button>
    <h1 id="pageTitle">打印中心</h1>
  </div>

  <!-- Select Page -->
  <div class="page active" id="page-select">
    <div class="select-page">
      <div class="guide-box">
        <h3>&#128161; 使用指南</h3>
        <p>1. 选择想要打印的单词卡片（可多选）<br>
        2. 点击"预览并打印"进入打印页面<br>
        3. 使用 A4 纸打印，建议用厚卡纸或打印后塑封<br>
        4. 裁剪成卡片，陪孩子线下学习</p>
      </div>

      <div class="search-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索单词..." oninput="filterWords()">
        <button class="search-btn" onclick="filterWords()">搜索</button>
      </div>

      <div class="filter-row" id="filterRow"></div>

      <div class="word-grid" id="wordGrid"></div>
    </div>
  </div>

  <!-- Preview Page -->
  <div class="page" id="page-preview">
    <div class="preview-page">
      <div class="preview-settings">
        <h3>&#9881; 打印设置</h3>
        <div class="setting-row">
          <label>每页卡片数</label>
          <select id="cardSize" onchange="renderPreview()">
            <option value="3x3">9 张（小卡片）</option>
            <option value="2x2">4 张（大卡片）</option>
            <option value="4x2">8 张（中卡片）</option>
          </select>
        </div>
        <div class="setting-row">
          <label>显示音标</label>
          <input type="checkbox" id="showIpa" checked onchange="renderPreview()">
        </div>
        <div class="setting-row">
          <label>显示中文</label>
          <input type="checkbox" id="showCn" checked onchange="renderPreview()">
        </div>
        <div class="setting-row">
          <label>显示二维码</label>
          <input type="checkbox" id="showQr" checked onchange="renderPreview()">
        </div>
      </div>

      <div class="print-btns">
        <button class="btn-secondary" onclick="showPage('page-select')">返回选择</button>
        <button class="btn-primary" onclick="doPrint()">&#128424; 打印</button>
      </div>

      <div class="print-sheet" id="printSheet">
        <div class="sheet-grid" id="sheetGrid"></div>
        <div class="print-guide">
          <b>使用建议：</b><br>
          &#8226; 每天展示 3-5 张卡片，每次 5-10 分钟<br>
          &#8226; 先让孩子看图，再告诉TA英文名称<br>
          &#8226; 多重复，配合实物指认效果更好<br>
          &#8226; 扫码可听标准发音<br>
          &#8226; 建议用厚卡纸打印，或打印后塑封更耐用
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <div class="selected-count">已选择 <b id="countNum">0</b> 张卡片</div>
    <button class="print-action-btn" id="previewBtn" disabled onclick="goPreview()">预览并打印</button>
  </div>

  <div class="toast" id="toast"></div>

  <script src="_shared/word-bank.js"></script>
  <script>
    // ===== State =====
    var selectedWords = [];
    var currentFilter = 'all';
    var allWords = [];

    // ===== Init =====
    function init() {
      if (typeof WORD_BANK === 'undefined' || !WORD_BANK) {
        showToast('数据加载失败');
        return;
      }
      buildWordList();
      renderFilters();
      renderWords();
    }

    // ===== Build flat word list =====
    function buildWordList() {
      allWords = [];
      for (var catId in WORD_BANK) {
        var cat = WORD_BANK[catId];
        var words = [];
        if (cat.words) {
          words = cat.words;
        } else if (cat.sections) {
          cat.sections.forEach(function(sec) {
            words = words.concat(sec.words);
          });
        }
        words.forEach(function(w) {
          w._catId = catId;
          w._catName = cat.name;
          allWords.push(w);
        });
      }
    }

    // ===== Filters =====
    function renderFilters() {
      var row = document.getElementById('filterRow');
      var html = '<button class="filter-btn selected" data-cat="all" onclick="selectFilter(this)">全部</button>';
      var catOrder = ['animals','fruits','food','vehicles','body','toys','plants','weather',
        'sports','dress','family','jobs','colors','emotions','actions','numbers','phonics',
        'hobbies','festivals','greetings','manners','attitude','opinion','willingness',
        'meal','wash','wake-up','bedtime','kindergarten','hospital','siblings','seniors',
        'outing','park','time','supermarket','plan'];
      catOrder.forEach(function(catId) {
        if (!WORD_BANK[catId]) return;
        html += '<button class="filter-btn" data-cat="' + catId + '" onclick="selectFilter(this)">' + WORD_BANK[catId].icon + ' ' + WORD_BANK[catId].name + '</button>';
      });
      row.innerHTML = html;
    }

    function selectFilter(btn) {
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
      currentFilter = btn.getAttribute('data-cat');
      filterWords();
    }

    // ===== Word Grid =====
    function renderWords(words) {
      words = words || allWords;
      if (currentFilter !== 'all') {
        words = words.filter(function(w) { return w._catId === currentFilter; });
      }
      var grid = document.getElementById('wordGrid');
      var html = '';
      words.forEach(function(w, idx) {
        var isSelected = selectedWords.some(function(sw) { return sw.en === w.en; });
        html += '<div class="word-item ' + (isSelected ? 'selected' : '') + '" onclick="toggleWord(' + idx + ', this)">';
        html += '<div class="check-mark">&#10003;</div>';
        if (w.img) {
          html += '<img class="wi-img" src="' + w.img + '" alt="' + w.en + '" loading="lazy">';
        } else {
          html += '<div class="wi-emoji">' + w.emoji + '</div>';
        }
        html += '<div class="wi-info">';
        html += '<div class="wi-en">' + w.en + '</div>';
        html += '<div class="wi-cn">' + w.cn + '</div>';
        html += '</div></div>';
      });
      grid.innerHTML = html;
    }

    function filterWords() {
      var query = document.getElementById('searchInput').value.trim().toLowerCase();
      var filtered = allWords;
      if (query) {
        filtered = allWords.filter(function(w) {
          return w.en.toLowerCase().indexOf(query) > -1 || w.cn.indexOf(query) > -1;
        });
      }
      renderWords(filtered);
    }

    function toggleWord(idx, el) {
      var w = allWords[idx];
      var found = selectedWords.findIndex(function(sw) { return sw.en === w.en; });
      if (found > -1) {
        selectedWords.splice(found, 1);
        el.classList.remove('selected');
      } else {
        selectedWords.push(w);
        el.classList.add('selected');
      }
      updateCount();
    }

    function updateCount() {
      document.getElementById('countNum').textContent = selectedWords.length;
      document.getElementById('previewBtn').disabled = selectedWords.length === 0;
    }

    // ===== Preview =====
    function goPreview() {
      showPage('page-preview');
      renderPreview();
    }

    function renderPreview() {
      var size = document.getElementById('cardSize').value;
      var showIpa = document.getElementById('showIpa').checked;
      var showCn = document.getElementById('showCn').checked;
      var showQr = document.getElementById('showQr').checked;

      var grid = document.getElementById('sheetGrid');
      grid.className = 'sheet-grid size-' + size;

      var html = '';
      selectedWords.forEach(function(w) {
        html += '<div class="print-card">';
        if (w.img) {
          html += '<img class="pc-img" src="' + w.img + '" alt="' + w.en + '">';
        } else {
          html += '<div class="pc-emoji">' + w.emoji + '</div>';
        }
        html += '<div class="pc-content">';
        html += '<div class="pc-en">' + w.en + '</div>';
        if (showIpa && w.ipa) html += '<div class="pc-ipa">' + w.ipa + '</div>';
        if (showCn) html += '<div class="pc-cn">' + w.cn + '</div>';
        if (showQr) html += '<div class="pc-qr">扫码听</div>';
        html += '</div></div>';
      });
      grid.innerHTML = html;
    }

    function doPrint() {
      window.print();
    }

    // ===== Navigation =====
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
      document.getElementById(pageId).classList.add('active');
      document.getElementById('bottomBar').style.display = pageId === 'page-select' ? 'flex' : 'none';
    }

    function goBack() {
      location.replace('index.html');
    }

    // ===== Utils =====
    function showToast(msg) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 2500);
    }

    // Start
    init();
  </script>
</body>
</html>
