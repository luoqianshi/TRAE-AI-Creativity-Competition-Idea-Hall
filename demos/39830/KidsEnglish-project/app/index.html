<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#FF6B4A">
  <title>幼儿英语启蒙</title>
  <style>
    :root {
      --bg: #FFF9F5;
      --bg2: #FFF0E8;
      --ink: #2D2A26;
      --muted: #8A8580;
      --accent: #FF6B4A;
      --accent2: #4AAFFF;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .welcome-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Hero Section */
    .hero {
      position: relative;
      width: 100%;
      flex-shrink: 0;
    }

    .hero img {
      width: 100%;
      height: 40vh;
      min-height: 240px;
      max-height: 380px;
      object-fit: cover;
      display: block;
    }

    .hero-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, transparent, rgba(45, 42, 38, 0.75));
      pointer-events: none;
    }

    .hero-text {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 2rem 1.5rem 1.5rem;
      color: #fff;
    }

    .hero-text h1 {
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.4rem;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .hero-text p {
      font-size: 0.95rem;
      opacity: 0.9;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* Main Menu */
    .menu-section {
      flex: 1;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .menu-card {
      background: #fff;
      border-radius: 18px;
      padding: 1.2rem 1rem;
      text-align: center;
      box-shadow: 0 2px 12px rgba(45, 42, 38, 0.06);
      border: 1px solid rgba(232, 224, 216, 0.5);
      cursor: pointer;
      text-decoration: none;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.15s, box-shadow 0.15s;
      opacity: 0;
      transform: translateY(16px);
      animation: cardFadeIn 0.5s ease forwards;
    }

    .menu-card:nth-child(1) { animation-delay: 0.1s; }
    .menu-card:nth-child(2) { animation-delay: 0.2s; }
    .menu-card:nth-child(3) { animation-delay: 0.3s; }
    .menu-card:nth-child(4) { animation-delay: 0.4s; }

    .menu-card:active {
      transform: scale(0.96);
      box-shadow: 0 2px 8px rgba(45, 42, 38, 0.1);
    }

    @keyframes cardFadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .menu-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 0.8rem;
    }

    .menu-card:nth-child(1) .menu-icon { background: #FFF0E8; }
    .menu-card:nth-child(2) .menu-icon { background: #E8F4FD; }
    .menu-card:nth-child(3) .menu-icon { background: #F0F9E8; }
    .menu-card:nth-child(4) .menu-icon { background: #FDF0E8; }

    .menu-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 0.3rem;
    }

    .menu-desc {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .menu-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .menu-card {
      position: relative;
    }

    /* Coming soon overlay */
    .menu-card.coming-soon {
      opacity: 0.6;
      pointer-events: none;
    }

    /* Quiz sub-menu */
    .sub-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      text-decoration: none;
      color: var(--ink);
      border-bottom: 1px solid rgba(232,224,216,0.4);
      transition: background 0.15s;
      cursor: pointer;
    }
    .sub-item:last-child {
      border-bottom: none;
    }
    .sub-item:active {
      background: rgba(255,107,74,0.08);
    }
    .sub-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: #F0F9E8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .sub-item:nth-child(2) .sub-icon {
      background: #FFF0E8;
    }
    .sub-text {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: left;
    }
    .sub-arrow {
      font-size: 1.1rem;
      color: var(--muted);
    }

    .coming-soon-tag {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(45, 42, 38, 0.7);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      pointer-events: none;
    }

    /* Version Label */
    .version-label {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 24px;
      z-index: 100;
      font-size: 0.7rem;
      color: var(--muted);
      opacity: 0.6;
      font-family: inherit;
      user-select: none;
      -webkit-user-select: none;
    }

    @media (max-width: 360px) {
      .version-label {
        left: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom));
      }
    }

    /* Responsive */
    @media (max-width: 360px) {
      .hero img {
        height: 32vh;
        min-height: 200px;
      }
      .hero-text h1 {
        font-size: 1.5rem;
      }
      .menu-grid {
        gap: 0.8rem;
      }
      .menu-card {
        padding: 1rem 0.8rem;
      }
      .menu-icon {
        width: 48px;
        height: 48px;
        font-size: 1.5rem;
      }
      .menu-title {
        font-size: 0.9rem;
      }
      .menu-desc {
        font-size: 0.7rem;
      }
    }

    @media (min-width: 600px) {
      .menu-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="welcome-page">
    <!-- Hero Image -->
    <div class="hero">
      <img src="assets/hero_cover.jpg" alt="幼儿英语启蒙">
      <div class="hero-gradient"></div>
      <div class="hero-text">
        <h1>幼儿英语启蒙</h1>
        <p>开启孩子的英语启蒙之旅</p>
      </div>
    </div>

    <!-- Main Menu -->
    <div class="menu-section">
      <div class="menu-grid">
        <a href="toc.html" class="menu-card" onclick="event.preventDefault(); location.replace('toc.html');">
          <div class="menu-icon">&#128218;</div>
          <div class="menu-title">词汇短句</div>
          <div class="menu-desc">38大主题分类<br>600+高频词汇</div>
        </a>

        <div class="menu-card coming-soon">
          <div class="menu-icon">&#127775;</div>
          <div class="menu-title">今日推荐</div>
          <div class="menu-desc">根据学习进度<br>智能推荐内容</div>
          <div class="coming-soon-tag">即将上线</div>
        </div>

        <div class="menu-card" style="padding:0;overflow:hidden;" id="quizCard">
          <div onclick="toggleQuizSub(event)" style="padding:1.2rem 1rem;width:100%;display:flex;flex-direction:column;align-items:center;cursor:pointer;">
            <div class="menu-icon">&#127912;</div>
            <div class="menu-title">趣味识图</div>
            <div class="menu-desc">听音选图互动<br>巩固记忆效果</div>
            <div id="quizArrow" style="margin-top:6px;font-size:0.7rem;color:var(--muted);transition:transform 0.2s;">&#9660; 展开</div>
          </div>
          <div id="quizSub" style="display:none;width:100%;border-top:1px solid rgba(232,224,216,0.5);background:#FAFAF8;">
            <a href="quiz.html?mode=browse" class="sub-item" onclick="event.preventDefault(); location.replace('quiz.html?mode=browse');">
              <span class="sub-icon">&#128444;</span>
              <span class="sub-text">认识图片</span>
              <span class="sub-arrow">&#8250;</span>
            </a>
            <a href="quiz.html?mode=quiz" class="sub-item" onclick="event.preventDefault(); location.replace('quiz.html?mode=quiz');">
              <span class="sub-icon">&#127922;</span>
              <span class="sub-text">趣味互动</span>
              <span class="sub-arrow">&#8250;</span>
            </a>
          </div>
        </div>

        <a href="print-center.html" class="menu-card" onclick="event.preventDefault(); location.replace('print-center.html');">
          <div class="menu-icon">&#128424;</div>
          <div class="menu-title">打印中心</div>
          <div class="menu-desc">选择卡片打印成册<br>线下亲子互动学习</div>
        </a>
      </div>
    </div>

    <!-- Version Label -->
    <div class="version-label" onclick="showKeLogs()" style="cursor:pointer;text-decoration:underline;">v3.3.0</div>

    <!-- Log Panel -->
    <div id="logPanel" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:3000;align-items:center;justify-content:center;padding:20px;">
      <div style="background:#fff;border-radius:16px;padding:20px;max-width:600px;width:100%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,0.3);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3 style="margin:0;font-size:1rem;">运行日志</h3>
          <button onclick="document.getElementById('logPanel').style.display='none'" style="background:var(--bg2);border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:0.85rem;">关闭</button>
        </div>
        <pre id="logContent" style="flex:1;overflow:auto;background:#1e1e1e;color:#d4d4d4;padding:12px;border-radius:10px;font-size:0.75rem;line-height:1.5;margin:0;white-space:pre-wrap;word-break:break-all;"></pre>
        <div style="margin-top:12px;display:flex;gap:8px;">
          <button onclick="copyKeLogs()" style="flex:1;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px;font-size:0.85rem;cursor:pointer;">复制日志</button>
          <button onclick="clearKeLogs()" style="flex:1;background:var(--bg2);color:var(--ink);border:none;border-radius:10px;padding:10px;font-size:0.85rem;cursor:pointer;">清空日志</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleQuizSub(e) {
      e.stopPropagation();
      var sub = document.getElementById('quizSub');
      var arrow = document.getElementById('quizArrow');
      if (sub.style.display === 'none') {
        sub.style.display = 'block';
        arrow.innerHTML = '&#9650; 收起';
        arrow.style.transform = 'rotate(0deg)';
      } else {
        sub.style.display = 'none';
        arrow.innerHTML = '&#9660; 展开';
        arrow.style.transform = 'rotate(0deg)';
      }
    }
    function showKeLogs() {
      var panel = document.getElementById('logPanel');
      var content = document.getElementById('logContent');
      try {
        var logs = JSON.parse(localStorage.getItem('ke_logs') || '[]');
        if (logs.length === 0) {
          content.textContent = '暂无日志';
        } else {
          content.textContent = logs.map(function(l) { return l.t + '  ' + l.m; }).join('\n');
        }
      } catch(e) {
        content.textContent = '读取日志失败: ' + e;
      }
      panel.style.display = 'flex';
    }
    function copyKeLogs() {
      var content = document.getElementById('logContent');
      navigator.clipboard.writeText(content.textContent).then(function() {
        alert('日志已复制到剪贴板');
      }).catch(function() {
        alert('复制失败，请手动复制');
      });
    }
    function clearKeLogs() {
      localStorage.removeItem('ke_logs');
      document.getElementById('logContent').textContent = '日志已清空';
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
