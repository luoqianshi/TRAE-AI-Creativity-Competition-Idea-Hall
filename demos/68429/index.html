        }
        .star-animation {
            animation: starPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes starPop {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .bounce-in {
            animation: bounceIn 0.5s ease-out;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        .slide-in-left {
            animation: slideInLeft 0.4s ease-out;
        }
        @keyframes slideInLeft {
            0% { transform: translateX(-50px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .slide-in-right {
            animation: slideInRight 0.4s ease-out;
        }
        @keyframes slideInRight {
            0% { transform: translateX(50px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .wave-animation {
            animation: wave 1s ease-in-out infinite;
        }
        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }
        .progress-ring-circle {
            transition: stroke-dashoffset 0.5s ease-in-out;
        }
        .correct-shake {
            animation: correctShake 0.4s ease-out;
        }
        @keyframes correctShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .wrong-shake {
            animation: wrongShake 0.4s ease-out;
        }
        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

function getStoredProgress() {
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : {
            completedUnits: [],
            stars: 0,
            achievements: [...achievements],
            lastStudyDate: null,
            streak: 0
        };
    } catch {
        return {
            completedUnits: [],
            stars: 0,
            achievements: [...achievements],
            lastStudyDate: null,
            streak: 0
        };
    }
}

function saveProgress(progress) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}

function checkAchievements(progress) {
    if (!progress.completedUnits.length && progress.completedUnits.length >= 1) {
        progress.achievements.find(a => a.id === 'first_step').unlocked = true;
    }
    if (progress.stars >= 10) {
        progress.achievements.find(a => a.id === 'star_collector').unlocked = true;
    }
    const mathCompleted = progress.completedUnits.filter(u => u.startsWith('m')).length;
    const chineseCompleted = progress.completedUnits.filter(u => u.startsWith('c')).length;
    const englishCompleted = progress.completedUnits.filter(u => u.startsWith('e')).length;
    if (mathCompleted >= 8) {
        progress.achievements.find(a => a.id === 'math_genius').unlocked = true;
    }
    if (chineseCompleted >= 8) {
        progress.achievements.find(a => a.id === 'chinese_master').unlocked = true;
    }
    if (englishCompleted >= 8) {
        progress.achievements.find(a => a.id === 'english_star').unlocked = true;
    }
    if (progress.completedUnits.length >= 24) {
        progress.achievements.find(a => a.id === 'all_around').unlocked = true;
    }
    return progress;
}

function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.8;
        window.speechSynthesis.speak(utterance);
    }
}

const App = {
    state: {
        currentPage: 'home',
        selectedGrade: null,
        selectedSubject: null,
        selectedUnit: null,
        progress: getStoredProgress(),
        currentQuestion: 0,
        testScore: 0,
        showFeedback: false,
        feedbackType: '',
        isRecording: false,
        recordingScore: 0
    },

    init() {
        this.render();
    },

    setState(newState) {
        this.state = { ...this.state, ...newState };
        this.render();
    },

    goToHome() {
        this.setState({ currentPage: 'home', selectedGrade: null, selectedSubject: null, selectedUnit: null });
    },

    selectGrade(gradeId) {
        const grade = learningData.grades.find(g => g.id === gradeId);
        this.setState({ currentPage: 'grade', selectedGrade: grade });
    },

    selectSubject(subjectId) {
        const subject = this.state.selectedGrade.subjects.find(s => s.id === subjectId);
        this.setState({ currentPage: 'unit', selectedSubject: subject });
    },

    startStudy(unit) {
        this.setState({ currentPage: 'study', selectedUnit: unit, currentQuestion: 0, testScore: 0 });
    },

    startTest(unit) {
        this.setState({ currentPage: 'test', selectedUnit: unit, currentQuestion: 0, testScore: 0 });
    },

    goToProgress() {
        this.setState({ currentPage: 'progress' });
    },

    handleAnswer(userAnswer) {
        const question = this.state.selectedUnit.questions[this.state.currentQuestion];
        const correctAnswer = question.answer;
        const isCorrect = userAnswer === correctAnswer;
        
        if (isCorrect) {
            this.setState({ 
                testScore: this.state.testScore + 1,
                feedbackType: 'correct',
                showFeedback: true
            });
        } else {
            this.setState({ 
                feedbackType: 'wrong',
                showFeedback: true
            });
        }
        
        setTimeout(() => {
            this.setState({ showFeedback: false });
            if (this.state.currentQuestion < this.state.selectedUnit.questions.length - 1) {
                this.setState({ currentQuestion: this.state.currentQuestion + 1 });
            } else {
                this.finishTest();
            }
        }, 1500);
    },

    finishTest() {
        const totalQuestions = this.state.selectedUnit.questions.length;
        const score = this.state.testScore;
        const percentage = Math.round((score / totalQuestions) * 100);
        const stars = score === totalQuestions ? 3 : score >= totalQuestions * 0.7 ? 2 : score >= totalQuestions * 0.4 ? 1 : 0;
        
        const newProgress = { ...this.state.progress };
        newProgress.stars += stars;
        
        if (!newProgress.completedUnits.includes(this.state.selectedUnit.id)) {
            newProgress.completedUnits.push(this.state.selectedUnit.id);
        }
        
        const today = new Date().toDateString();
        if (newProgress.lastStudyDate !== today) {
            if (newProgress.lastStudyDate) {
                const lastDate = new Date(newProgress.lastStudyDate);
                const currentDate = new Date(today);
                const diffDays = Math.floor((currentDate - lastDate) / (1000 * 60 * 60 * 24));
                if (diffDays === 1) {
                    newProgress.streak += 1;
                } else if (diffDays > 1) {
                    newProgress.streak = 1;
                }
            } else {
                newProgress.streak = 1;
            }
            newProgress.lastStudyDate = today;
        }
        
        if (score === totalQuestions) {
            newProgress.achievements.find(a => a.id === 'perfectionist').unlocked = true;
        }
        
        if (newProgress.streak >= 7) {
            newProgress.achievements.find(a => a.id === 'hard_worker').unlocked = true;
        }
        
        const updatedProgress = checkAchievements(newProgress);
        saveProgress(updatedProgress);
        
        this.setState({ 
            currentPage: 'result', 
            progress: updatedProgress,
            finalStars: stars,
            finalPercentage: percentage
        });
    },

    renderHome() {
        const unlockedAchievements = this.state.progress.achievements.filter(a => a.unlocked).length;
        
        return `
            <div class="fade-in">
                <div class="text-center mb-6">
                    <h1 class="text-4xl text-white drop-shadow-lg mb-2">快乐背诵</h1>
                    <p class="text-white/90 text-lg">小学生学习助手</p>
                </div>
                
                <div class="bg-white/20 backdrop-blur-sm rounded-3xl p-4 mb-6 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-yellow-400 rounded-full flex items-center justify-center text-2xl">⭐</div>
                        <div>
                            <p class="text-white font-bold text-lg">${this.state.progress.stars}</p>
                            <p class="text-white/70 text-sm">星星总数</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-orange-400 rounded-full flex items-center justify-center text-2xl">🔥</div>
                        <div>
                            <p class="text-white font-bold text-lg">${this.state.progress.streak}</p>
                            <p class="text-white/70 text-sm">连续学习</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-purple-400 rounded-full flex items-center justify-center text-2xl">🏆</div>
                        <div>
                            <p class="text-white font-bold text-lg">${unlockedAchievements}</p>
                            <p class="text-white/70 text-sm">成就解锁</p>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white/95 rounded-3xl p-6 card-shadow">
                    <h2 class="text-xl font-bold text-gray-700 mb-4 text-center">选择年级</h2>
                    <div class="grid grid-cols-2 gap-4">
                        ${learningData.grades.map((grade, index) => {
                            const isEven = index % 2 === 0;
                            return `
                                <button 
                                    onclick="app.selectGrade(${grade.id})"
                                    class="btn-press ${isEven ? 'slide-in-left' : 'slide-in-right'} bg-gradient-to-br ${this.getGradeColor(grade.id)} text-white rounded-2xl p-4 flex flex-col items-center gap-2 transition-all hover:scale-105"
                                    style="animation-delay: ${index * 0.1}s"
                                >
                                    <span class="text-4xl">${grade.icon}</span>
                                    <span class="text-xl font-bold">${grade.name}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>
                
                <button 
                    onclick="app.goToProgress()"
                    class="btn-press mt-6 w-full bg-white/95 text-purple-600 rounded-2xl p-4 font-bold text-lg card-shadow flex items-center justify-center gap-2"
                >
                    <span>📊</span>
                    <span>学习进度</span>
                </button>
            </div>
        `;
    },

    getGradeColor(gradeId) {
        const colors = ['from-pink-400 to-rose-400', 'from-blue-400 to-cyan-400', 'from-green-400 to-emerald-400', 'from-purple-400 to-violet-400', 'from-orange-400 to-amber-400'];
        return colors[gradeId - 1] || colors[0];
    },

    renderGrade() {
        return `
            <div class="fade-in">
                <button onclick="app.goToHome()" class="btn-press mb-4 text-white flex items-center gap-2">
                    <span>←</span>
                    <span>返回首页</span>
                </button>
                
                <div class="text-center mb-6">
                    <h1 class="text-3xl text-white drop-shadow-lg">${this.state.selectedGrade.name}</h1>
                    <p class="text-white/80">选择学科开始学习</p>
                </div>
                
                <div class="space-y-4">
                    ${this.state.selectedGrade.subjects.map((subject, index) => `
                        <button 
                            onclick="app.selectSubject('${subject.id}')"
                            class="btn-press bounce-in w-full bg-white/95 rounded-2xl p-5 card-shadow flex items-center gap-4 transition-all hover:scale-[1.02]"
                            style="animation-delay: ${index * 0.15}s"
                        >
                            <div class="w-14 h-14 rounded-xl flex items-center justify-center text-3xl" style="background-color: ${subject.color}20">
                                ${subject.icon}
                            </div>
                            <div class="flex-1 text-left">
                                <h3 class="text-xl font-bold text-gray-700">${subject.name}</h3>
                                <p class="text-gray-500">${subject.units.length}个学习单元</p>
                            </div>
                            <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center">
                                <span class="text-gray-400">→</span>
                            </div>
                        </button>
                    `).join('')}
                </div>
            </div>
        `;
    },

    renderUnit() {
        const completedCount = this.state.selectedSubject.units.filter(u => 
            this.state.progress.completedUnits.includes(u.id)
        ).length;
        
        return `
            <div class="fade-in">
                <button onclick="app.selectSubject('${this.state.selectedSubject.id}')" class="btn-press mb-4 text-white flex items-center gap-2">
                    <span>←</span>
                    <span>返回学科</span>
                </button>
                
                <div class="text-center mb-6">
                    <div class="inline-flex items-center gap-2 bg-white/20 backdrop-blur-sm rounded-full px-4 py-2 mb-2">
                        <span>${this.state.selectedSubject.icon}</span>
                        <span class="text-white font-bold">${this.state.selectedSubject.name}</span>
                    </div>
                    <div class="w-full bg-white/30 rounded-full h-3 mt-4">
                        <div 
                            class="bg-white rounded-full h-3 transition-all duration-500" 
                            style="width: ${(completedCount / this.state.selectedSubject.units.length) * 100}%"
                        ></div>
                    </div>
                    <p class="text-white/80 mt-2">已完成 ${completedCount}/${this.state.selectedSubject.units.length}</p>
                </div>
                
                <div class="space-y-4">
                    ${this.state.selectedSubject.units.map((unit, index) => {
                        const isCompleted = this.state.progress.completedUnits.includes(unit.id);
                        return `
                            <div class="bounce-in bg-white/95 rounded-2xl p-5 card-shadow" style="animation-delay: ${index * 0.1}s">
                                <div class="flex items-start gap-4">
                                    <div class="w-12 h-12 rounded-xl flex-shrink-0 overflow-hidden">
                                        <img src="${unit.imageUrl}" alt="${unit.title}" class="w-full h-full object-cover" />
                                    </div>
                                    <div class="flex-1">
                                        <div class="flex items-center gap-2 mb-1">
                                            <h3 class="text-lg font-bold text-gray-700">${unit.title}</h3>
                                            ${isCompleted ? '<span class="text-green-500">✓</span>' : ''}
                                        </div>
                                        <p class="text-gray-500 text-sm mb-3">${unit.description}</p>
                                        <div class="flex gap-2">
                                            ${Array(unit.difficulty).fill('⭐').map((star, i) => 
                                                `<span class="text-yellow-400 text-sm">${star}</span>`
                                            ).join('')}
                                        </div>
                                    </div>
                                </div>
                                <div class="flex gap-3 mt-4">
                                    <button 
                                        onclick="app.startStudy(this)" 
                                        data-unit='${JSON.stringify(unit)}'
                                        class="btn-press flex-1 bg-blue-500 text-white rounded-xl py-3 font-bold flex items-center justify-center gap-2"
                                    >
                                        <span>📖</span>
                                        <span>学习</span>
                                    </button>
                                    <button 
                                        onclick="app.startTest(this)" 
                                        data-unit='${JSON.stringify(unit)}'
                                        class="btn-press flex-1 bg-orange-500 text-white rounded-xl py-3 font-bold flex items-center justify-center gap-2"
                                    >
                                        <span>✍️</span>
                                        <span>测试</span>
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
    },

    renderStudy() {
        return `
            <div class="fade-in">
                <button onclick="app.selectSubject('${this.state.selectedSubject.id}')" class="btn-press mb-4 text-white flex items-center gap-2">
                    <span>←</span>
                    <span>返回单元</span>
                </button>
                
                <div class="text-center mb-4">
                    <h1 class="text-2xl text-white drop-shadow-lg">${this.state.selectedUnit.title}</h1>
                </div>
                
                <div class="bg-white/95 rounded-3xl p-6 card-shadow mb-4">
                    <div class="relative overflow-hidden rounded-2xl mb-6">
                        <img src="${this.state.selectedUnit.imageUrl}" alt="${this.state.selectedUnit.title}" class="w-full h-48 object-cover" />
                        <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent"></div>
                    </div>
                    
                    <div class="bg-gray-50 rounded-2xl p-6 mb-6">
                        <p class="text-xl text-gray-700 leading-relaxed whitespace-pre-line">${this.state.selectedUnit.content}</p>
                    </div>
                    
                    <div class="flex gap-3">
                        <button 
                            onclick="speakText('${this.state.selectedUnit.audioText}')"
                            class="btn-press flex-1 bg-green-500 text-white rounded-xl py-4 font-bold text-lg flex items-center justify-center gap-2"
                        >
                            <span>🔊</span>
                            <span>播放语音</span>
                        </button>
                        <button 
                            onclick="app.toggleRecording()"
                            class="btn-press flex-1 ${this.state.isRecording ? 'bg-red-500' : 'bg-purple-500'} text-white rounded-xl py-4 font-bold text-lg flex items-center justify-center gap-2"
                        >
                            <span>🎤</span>
                            <span>${this.state.isRecording ? '停止录音' : '跟读练习'}</span>
                        </button>
                    </div>
                    
                    ${this.state.isRecording ? `
                        <div class="mt-4 bg-purple-100 rounded-xl p-4">
                            <div class="flex items-center justify-center gap-2 h-12">
                                ${Array(8).fill(0).map((_, i) => `
                                    <div class="w-2 bg-purple-500 rounded-full wave-animation" style="animation-delay: ${i * 0.1}s"></div>
                                `).join('')}
                            </div>
                            <p class="text-center text-purple-600 mt-2 font-bold">正在录音，请大声朗读...</p>
                        </div>
                    ` : ''}
                    
                    ${this.state.recordingScore > 0 ? `
                        <div class="mt-4 bg-yellow-100 rounded-xl p-4 text-center">
                            <p class="text-yellow-700 font-bold">跟读评分: ${this.state.recordingScore}分</p>
                            <div class="flex justify-center gap-1 mt-2">
                                ${Array(Math.floor(this.state.recordingScore / 20)).fill('⭐').map(() => '<span class="text-xl">⭐</span>').join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
                
                <button 
                    onclick="app.startTest(this)" 
                    data-unit='${JSON.stringify(this.state.selectedUnit)}'
                    class="btn-press w-full bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-2xl py-4 font-bold text-xl card-shadow"
                >
                    🚀 开始测试
                </button>
            </div>
        `;
    },

    toggleRecording() {
        if (this.state.isRecording) {
            this.setState({ isRecording: false, recordingScore: Math.floor(Math.random() * 40) + 60 });
        } else {
            this.setState({ isRecording: true, recordingScore: 0 });
            setTimeout(() => {
                if (this.state.isRecording) {
                    this.setState({ isRecording: false, recordingScore: Math.floor(Math.random() * 40) + 60 });
                }
            }, 5000);
        }
    },

    renderTest() {
        const question = this.state.selectedUnit.questions[this.state.currentQuestion];
        const progress = ((this.state.currentQuestion + 1) / this.state.selectedUnit.questions.length) * 100;
        
        return `
            <div class="fade-in">
                <button onclick="app.selectSubject('${this.state.selectedSubject.id}')" class="btn-press mb-4 text-white flex items-center gap-2">
                    <span>←</span>
                    <span>返回单元</span>
                </button>
                
                <div class="text-center mb-4">
                    <h1 class="text-2xl text-white drop-shadow-lg">${this.state.selectedUnit.title}</h1>
                    <p class="text-white/80">测试 - 第 ${this.state.currentQuestion + 1}/${this.state.selectedUnit.questions.length} 题</p>
                </div>
                
                <div class="w-full bg-white/30 rounded-full h-3 mb-6">
                        <div class="bg-white rounded-full h-3 transition-all duration-500" style="width: ${progress}%"></div>
                    </div>
                    
                    <div class="bg-white/95 rounded-3xl p-6 card-shadow ${this.state.showFeedback ? (this.state.feedbackType === 'correct' ? 'correct-shake' : 'wrong-shake') : ''}">
                        ${this.state.showFeedback ? `
                            <div class="absolute top-4 right-4 text-4xl ${this.state.feedbackType === 'correct' ? 'text-green-500' : 'text-red-500'}">
                                ${this.state.feedbackType === 'correct' ? '🎉' : '😅'}
                            </div>
                        ` : ''}
                        
                        <h3 class="text-xl font-bold text-gray-700 mb-6">${question.question}</h3>
                        
                        ${question.type === 'choice' ? `
                            <div class="space-y-3">
                                ${question.options.map((option, i) => `
                                    <button 
                                        onclick="app.handleAnswer('${option}')"
                                        class="btn-press w-full bg-gray-100 hover:bg-blue-100 text-gray-700 rounded-xl p-4 font-bold text-lg transition-all"
                                    >
                                        ${String.fromCharCode(65 + i)}. ${option}
                                    </button>
                                `).join('')}
                            </div>
                        ` : `
                            <div class="flex gap-2">
                                <input 
                                    type="text" 
                                    id="fill-input"
                                    class="flex-1 bg-gray-100 rounded-xl px-4 py-4 text-xl font-bold text-center focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="输入答案"
                                    onkeydown="if(event.key === 'Enter') app.handleAnswer(this.value)"
                                />
                                <button 
                                    onclick="app.handleAnswer(document.getElementById('fill-input').value)"
                                    class="btn-press bg-blue-500 text-white rounded-xl px-6 font-bold"
                                >
                                    确定
                                </button>
                            </div>
                        `}
                    </div>
                </div>
        `;
    },

    renderResult() {
        return `
            <div class="fade-in">
                <div class="text-center">
                    <h1 class="text-3xl text-white drop-shadow-lg mb-4">测试完成！</h1>
                    
                    <div class="bg-white/95 rounded-3xl p-8 card-shadow mb-6">
                        <div class="text-6xl mb-4">
                            ${this.state.finalStars === 3 ? '🏆' : this.state.finalStars === 2 ? '🌟' : this.state.finalStars === 1 ? '⭐' : '💪'}
                        </div>
                        
                        <p class="text-2xl font-bold text-gray-700 mb-2">得分：${this.state.finalPercentage}%</p>
                        
                        <div class="flex justify-center gap-2 mb-4">
                            ${Array(3).fill(0).map((_, i) => `
                                <span class="text-3xl ${i < this.state.finalStars ? 'star-animation' : 'text-gray-300'}">⭐</span>
                            `).join('')}
                        </div>
                        
                        <p class="text-gray-500">${this.state.finalPercentage >= 80 ? '太棒了！继续保持！' : this.state.finalPercentage >= 60 ? '做得不错，再接再厉！' : '加油！多练习几次吧！'}</p>
                    </div>
                    
                    <div class="flex gap-4">
                        <button onclick="app.goToHome()" class="btn-press flex-1 bg-white/95 text-gray-700 rounded-2xl py-4 font-bold text-lg card-shadow">
                            返回首页
                        </button>
                        <button onclick="app.startTest(app.state.selectedUnit)" class="btn-press flex-1 bg-blue-500 text-white rounded-2xl py-4 font-bold text-lg">
                            再测一次
                        </button>
                    </div>
                </div>
            </div>
        `;
    },

    renderProgress() {
        const totalUnits = learningData.grades.reduce((sum, grade) => 
            sum + grade.subjects.reduce((s, subject) => s + subject.units.length, 0), 0
        );
        const completedUnits = this.state.progress.completedUnits.length;
        const progressPercent = Math.round((completedUnits / totalUnits) * 100);
        
        const mathCompleted = this.state.progress.completedUnits.filter(u => u.startsWith('m')).length;
        const chineseCompleted = this.state.progress.completedUnits.filter(u => u.startsWith('c')).length;
        const englishCompleted = this.state.progress.completedUnits.filter(u => u.startsWith('e')).length;
        
        return `
            <div class="fade-in">
                <button onclick="app.goToHome()" class="btn-press mb-4 text-white flex items-center gap-2">
                    <span>←</span>
                    <span>返回首页</span>
                </button>
                
                <div class="text-center mb-6">
                    <h1 class="text-3xl text-white drop-shadow-lg">学习进度</h1>
                </div>
                
                <div class="bg-white/95 rounded-3xl p-6 card-shadow mb-6">
                    <div class="flex items-center justify-center mb-6">
                        <div class="relative w-32 h-32">
                            <svg class="w-full h-full transform -rotate-90">
                                <circle cx="64" cy="64" r="56" fill="none" stroke="#e5e7eb" stroke-width="12" />
                                <circle cx="64" cy="64" r="56" fill="none" stroke="#4A90D9" stroke-width="12" stroke-linecap="round" stroke-dasharray="${progressPercent * 3.52} 352" class="progress-ring-circle" />
                            </svg>
                            <div class="absolute inset-0 flex items-center justify-center">
                                <div class="text-center">
                                    <p class="text-3xl font-bold text-gray-700">${progressPercent}%</p>
                                    <p class="text-sm text-gray-500">完成度</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-4 mb-6">
                        <div class="bg-red-50 rounded-xl p-4 text-center">
                            <p class="text-2xl font-bold text-red-500">${chineseCompleted}</p>
                            <p class="text-sm text-gray-500">语文</p>
                        </div>
                        <div class="bg-blue-50 rounded-xl p-4 text-center">
                            <p class="text-2xl font-bold text-blue-500">${mathCompleted}</p>
                            <p class="text-sm text-gray-500">数学</p>
                        </div>
                        <div class="bg-green-50 rounded-xl p-4 text-center">
                            <p class="text-2xl font-bold text-green-500">${englishCompleted}</p>
                            <p class="text-sm text-gray-500">英语</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between bg-yellow-50 rounded-xl p-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 bg-yellow-400 rounded-full flex items-center justify-center text-2xl">⭐</div>
                            <div>
                                <p class="font-bold text-gray-700">星星总数</p>
                                <p class="text-2xl font-bold text-yellow-500">${this.state.progress.stars}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-sm text-gray-500">连续学习</p>
                            <p class="text-xl font-bold text-orange-500">🔥 ${this.state.progress.streak}天</p>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white/95 rounded-3xl p-6 card-shadow">
                    <h2 class="text-xl font-bold text-gray-700 mb-4">成就徽章</h2>
                    <div class="grid grid-cols-4 gap-4">
                        ${this.state.progress.achievements.map((achievement, index) => `
                            <div class="text-center">
                                <div class="w-14 h-14 mx-auto mb-2 rounded-xl flex items-center justify-center text-3xl ${achievement.unlocked ? 'bg-gradient-to-br from-yellow-400 to-orange-400 bounce-in' : 'bg-gray-200 grayscale'}">
                                    ${achievement.icon}
                                </div>
                                <p class="text-xs font-bold text-gray-700">${achievement.name}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;
    },

    render() {
        const app = document.getElementById('app');
        if (!app) return;
        
        switch (this.state.currentPage) {
            case 'home':
                app.innerHTML = this.renderHome();
                break;
            case 'grade':
                app.innerHTML = this.renderGrade();
                break;
            case 'unit':
                app.innerHTML = this.renderUnit();
                break;
            case 'study':
                app.innerHTML = this.renderStudy();
                break;
            case 'test':
                app.innerHTML = this.renderTest();
                break;
            case 'result':
                app.innerHTML = this.renderResult();
                break;
            case 'progress':
                app.innerHTML = this.renderProgress();
                break;
            default:
                app.innerHTML = this.renderHome();
        }
    }
};

document.addEventListener('DOMContentLoaded', () => {
    window.app = App;
    App.init();
});
