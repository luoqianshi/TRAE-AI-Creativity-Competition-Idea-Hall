<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知境 — AI个人成长伴侣</title>
<style>
  :root{
    --p1:#8B7EC8;--p2:#B8AEE0;--p3:#5E4FA2;
    --a1:#D4A574;--a2:#EDD4B7;
    --g1:#7EC8A0;--g2:#5FA890;
    --r1:#E8787E;--b1:#6BA8D9;--y1:#E8B87D;
    --glass:rgba(255,255,255,0.42);
    --glass2:rgba(255,255,255,0.72);
    --border:rgba(255,255,255,0.5);
    --text:#2D2452;--text2:#5E5580;--text3:#9E96B8;
    --shadow:0 8px 32px rgba(94,79,162,0.07);
    --shadow2:0 16px 48px rgba(94,79,162,0.13);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:linear-gradient(155deg,#F0EBF8 0%,#FAF7F2 45%,#F5F0FA 100%);min-height:100vh;color:var(--text);overflow-x:hidden}

  #pc{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}

  .app{position:relative;z-index:1;max-width:1420px;margin:0 auto;padding:28px;display:flex;gap:28px}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:24px}
  .side{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:20px}

  .card{background:var(--glass);backdrop-filter:blur(28px) saturate(1.15);-webkit-backdrop-filter:blur(28px) saturate(1.15);border:1px solid var(--border);border-radius:24px;padding:28px;box-shadow:var(--shadow);transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;opacity:0;transform:translateY(30px)}
  .card.v{opacity:1;transform:translateY(0)}
  .card:hover{box-shadow:var(--shadow2)}

  .ct{font-size:17px;font-weight:600;margin-bottom:22px;display:flex;align-items:center;gap:10px}
  .ct .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--p2),var(--p1));box-shadow:0 4px 12px rgba(139,126,200,0.22)}

  .hd{display:flex;align-items:center;gap:16px;padding:8px 0 4px}
  .lg{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--p1),var(--p3));display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;font-weight:700;box-shadow:0 6px 20px rgba(94,79,162,0.2);position:relative;overflow:hidden}
  .lg::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.3) 0%,transparent 60%)}
  .hd h1{font-size:26px;font-weight:700;letter-spacing:2px}
  .hd p{font-size:13px;color:var(--text2);margin-top:2px}

  /* 对话区 */
  .chat{display:flex;flex-direction:column;gap:0}
  .ca{max-height:520px;overflow-y:auto;padding-right:6px;margin-bottom:18px;flex:1}
  .ca::-webkit-scrollbar{width:4px}
  .ca::-webkit-scrollbar-thumb{background:rgba(94,79,162,0.12);border-radius:4px}

  .msg{display:flex;gap:12px;margin-bottom:18px;animation:msgIn .45s cubic-bezier(.34,1.56,.64,1) forwards;opacity:0;transform:translateY(12px) scale(0.96)}
  @keyframes msgIn{to{opacity:1;transform:translateY(0) scale(1)}}
  .msg.user{flex-direction:row-reverse}
  .m-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px}
  .msg.ai .m-avatar{background:linear-gradient(135deg,var(--p1),var(--p3))}
  .msg.user .m-avatar{background:linear-gradient(135deg,var(--a1),#C49464)}

  .m-body{max-width:75%;display:flex;flex-direction:column;gap:6px}
  .m-bubble{padding:14px 18px;border-radius:18px;font-size:14px;line-height:1.8;word-break:break-word}
  .msg.ai .m-bubble{background:var(--glass2);border:1px solid var(--border);color:var(--text);border-top-left-radius:5px}
  .msg.user .m-bubble{background:linear-gradient(135deg,var(--p1),var(--p3));color:#fff;border-top-right-radius:5px;box-shadow:0 4px 16px rgba(94,79,162,0.16)}

  /* 记录卡片（嵌入对话流） */
  .m-record{
    padding:14px 16px;background:linear-gradient(135deg,rgba(139,126,200,0.06),rgba(212,165,116,0.04));
    border-radius:14px;border:1px solid rgba(139,126,200,0.1);
    display:flex;align-items:center;gap:10px;font-size:13px;
    animation:recSlide .5s cubic-bezier(.34,1.56,.64,1) forwards;
    opacity:0;transform:translateY(8px) scale(0.97);
  }
  @keyframes recSlide{to{opacity:1;transform:translateY(0) scale(1)}}
  .m-record .rec-emoji{font-size:22px;flex-shrink:0}
  .m-record .rec-content{flex:1;color:var(--text2);line-height:1.6}
  .m-record .rec-content strong{color:var(--text);font-weight:600}
  .m-record .rec-time{font-size:11px;color:var(--text3);flex-shrink:0}

  /* AI回复中的推荐卡片 */
  .m-quote{
    padding:16px;background:rgba(255,255,255,0.6);border-radius:14px;
    border:1px solid rgba(139,126,200,0.12);margin-top:8px;
  }
  .m-quote .qt{font-size:14px;font-style:italic;line-height:1.85;color:var(--text);padding-left:12px;border-left:2px solid rgba(139,126,200,0.25);margin-bottom:8px}
  .m-quote .qs{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px}
  .m-quote .qs .qn{font-weight:600;color:var(--p3)}
  .m-quote .qtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .m-quote .qtag{padding:3px 10px;background:rgba(139,126,200,0.1);color:var(--p3);border-radius:50px;font-size:11px;font-weight:500}

  .blink::after{content:'|';animation:blinkA 1s step-end infinite;color:var(--p1);font-weight:300}
  @keyframes blinkA{50%{opacity:0}}

  .typing{display:flex;gap:4px;padding:14px 18px;background:var(--glass2);border-radius:18px;border-top-left-radius:5px;border:1px solid var(--border);width:fit-content}
  .typing span{width:7px;height:7px;background:var(--p2);border-radius:50%;animation:tB 1.3s ease-in-out infinite}
  .typing span:nth-child(2){animation-delay:.18s}
  .typing span:nth-child(3){animation-delay:.36s}
  @keyframes tB{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}

  /* 快捷标签行 */
  .quick-moods{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .qm{
    padding:7px 16px;border-radius:50px;background:rgba(255,255,255,0.5);
    border:1px solid rgba(139,126,200,0.1);cursor:pointer;font-size:13px;
    color:var(--text2);transition:all .3s ease;user-select:none;
  }
  .qm:hover{background:rgba(255,255,255,0.85);transform:translateY(-1px);box-shadow:0 3px 10px rgba(94,79,162,0.08)}

  .cir{display:flex;gap:10px}
  .ci{flex:1;padding:14px 18px;border:1.5px solid rgba(94,79,162,0.1);border-radius:14px;background:rgba(255,255,255,0.7);font-size:14px;color:var(--text);outline:none;transition:all .3s;font-family:inherit}
  .ci:focus{border-color:var(--p2);background:rgba(255,255,255,0.92);box-shadow:0 0 0 4px rgba(139,126,200,0.07)}
  .ci::placeholder{color:var(--text3)}
  .bs{background:linear-gradient(135deg,var(--a1),#C49464);color:#fff;box-shadow:0 4px 14px rgba(212,165,116,0.2);padding:14px 22px;border:none;border-radius:14px;font-size:14px;cursor:pointer;font-family:inherit;transition:all .3s}
  .bs:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(212,165,116,0.28)}

  /* 情绪洞察区（上方小卡片） */
  .insight-strip{
    padding:16px 22px;background:linear-gradient(135deg,rgba(139,126,200,0.07),rgba(212,165,116,0.05));
    border-radius:16px;border:1px solid rgba(139,126,200,0.1);
    font-size:14px;line-height:1.8;color:var(--text2);
    display:none;align-items:flex-start;gap:10px;
  }
  .insight-strip.show{display:flex;animation:inFade .5s ease}
  .insight-strip .is-icon{font-size:20px;flex-shrink:0;margin-top:2px}
  .insight-strip .is-text{flex:1}
  .insight-strip .is-text strong{color:var(--text);font-weight:600}
  @keyframes inFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* 仪式感弹窗 */
  .modal-overlay{position:fixed;inset:0;background:rgba(45,36,82,0.35);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s ease}
  .modal-overlay.on{opacity:1;pointer-events:auto}
  .mem-card{width:360px;background:var(--glass2);backdrop-filter:blur(30px);border:1px solid var(--border);border-radius:24px;padding:32px;text-align:center;box-shadow:var(--shadow2);transform:scale(0.7) rotateY(90deg);transition:transform .6s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
  .modal-overlay.on .mem-card{transform:scale(1) rotateY(0)}
  .mem-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 50% 50%,rgba(139,126,200,0.08) 0%,transparent 60%);animation:memG 4s ease-in-out infinite}
  @keyframes memG{0%,100%{transform:rotate(0deg)}50%{transform:rotate(180deg)}}
  .mem-emoji{font-size:52px;margin-bottom:12px;position:relative;z-index:1}
  .mem-mood{font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px;position:relative;z-index:1}
  .mem-text{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:16px;position:relative;z-index:1;word-break:break-word}
  .mem-date{font-size:12px;color:var(--text3);position:relative;z-index:1}
  .mem-line{width:50px;height:2px;background:linear-gradient(90deg,var(--p1),var(--a1));margin:16px auto;border-radius:2px;position:relative;z-index:1}
  .mem-quote{font-size:13px;color:var(--text2);font-style:italic;line-height:1.7;position:relative;z-index:1}
  .badge-wrap{margin-top:20px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;position:relative;z-index:1;min-height:60px}
  .badge{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 4px 14px rgba(212,165,116,0.25);animation:bPop .5s cubic-bezier(.34,1.56,.64,1) forwards;opacity:0;transform:scale(0);position:relative}
  @keyframes bPop{to{opacity:1;transform:scale(1)}}
  .badge::after{content:attr(data-title);position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text3);white-space:nowrap}
  .badge.shine::before{content:'';position:absolute;inset:-4px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--g1),var(--b1),var(--a1));opacity:0.3;z-index:-1;animation:bRot 3s linear infinite}
  @keyframes bRot{to{transform:rotate(360deg)}}
  .btn-close{margin-top:24px;padding:10px 28px;background:rgba(139,126,200,0.1);color:var(--p3);border:1px solid rgba(139,126,200,0.2);border-radius:50px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .25s;position:relative;z-index:1}
  .btn-close:hover{background:rgba(139,126,200,0.18);transform:scale(1.05)}

  /* 侧边栏 */
  .pf{text-align:center}
  .paw{width:88px;height:88px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(135deg,var(--p2),var(--p1));display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 8px 28px rgba(94,79,162,0.16);position:relative}
  .paw::before{content:'';position:absolute;inset:-4px;border-radius:50%;background:linear-gradient(135deg,var(--p2),var(--a2));opacity:0.3;z-index:-1;animation:pu 3s ease-in-out infinite}
  @keyframes pu{0%,100%{transform:scale(1);opacity:0.3}50%{transform:scale(1.06);opacity:0.18}}
  .pn{font-size:19px;font-weight:600}
  .pbio{font-size:13px;color:var(--text2);margin-top:3px}
  .sts{display:flex;justify-content:center;gap:28px;margin-top:22px;padding-top:22px;border-top:1px solid var(--border)}
  .st{text-align:center}
  .stv{font-size:28px;font-weight:700;background:linear-gradient(135deg,var(--p1),var(--p3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .stl{font-size:12px;color:var(--text2);margin-top:2px}

  .cal-wrap{margin-top:18px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-cell{aspect-ratio:1;border-radius:6px;background:rgba(139,126,200,0.06);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text3);cursor:pointer;transition:all .2s;position:relative}
  .cal-cell:hover{transform:scale(1.15);z-index:2}
  .cal-cell.has{color:#fff;box-shadow:0 2px 8px rgba(139,126,200,0.2)}
  .cal-cell.has.m-迷茫{background:var(--p2)}.cal-cell.has.m-焦虑{background:var(--r1)}.cal-cell.has.m-好奇{background:var(--b1)}.cal-cell.has.m-平静{background:var(--g1)}.cal-cell.has.m-疲惫{background:var(--p3)}.cal-cell.has.m-充满干劲{background:var(--a1)}.cal-cell.has.m-自定义{background:var(--p1)}
  .cal-labels{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px;text-align:center;font-size:10px;color:var(--text3)}
  .cal-tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%) scale(0.9);background:var(--text);color:#fff;padding:6px 10px;border-radius:8px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:all .2s;z-index:10}
  .cal-cell:hover .cal-tip{opacity:1;transform:translateX(-50%) scale(1)}

  .tc{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .tag{padding:6px 14px;background:rgba(139,126,200,0.1);color:var(--p3);border-radius:50px;font-size:13px;transition:all .25s;cursor:default}
  .tag:hover{background:rgba(139,126,200,0.2);transform:scale(1.06)}

  .rc{margin-top:16px;padding:16px;background:rgba(255,255,255,0.5);border-radius:14px;border:1px solid var(--border)}
  .rcl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
  .rct{font-size:14px;font-weight:500;color:var(--text)}
  .rctime{font-size:12px;color:var(--text3);margin-top:5px}

  .hl{margin-top:14px;max-height:200px;overflow-y:auto}
  .hl::-webkit-scrollbar{width:3px}
  .hl::-webkit-scrollbar-thumb{background:rgba(94,79,162,0.1);border-radius:3px}
  .hi{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,0.4);border-radius:10px;margin-bottom:8px;font-size:13px;animation:si .35s ease forwards;opacity:0;transform:translateX(-10px)}
  @keyframes si{to{opacity:1;transform:translateX(0)}}
  .hi:hover{background:rgba(255,255,255,0.75)}
  .hdot{width:7px;height:7px;border-radius:50%;background:var(--p1);flex-shrink:0}
  .htxt{flex:1;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .htime{font-size:11px;color:var(--text3);flex-shrink:0}

  .fly{position:fixed;width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--p2),var(--p1));pointer-events:none;z-index:9999;box-shadow:0 0 10px rgba(139,126,200,0.5)}

  @media(max-width:980px){.app{flex-direction:column}.side{width:100%}}
</style>
</head>
<body>

<canvas id="pc"></canvas>

<!-- 仪式感弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="mem-card">
    <div class="mem-emoji" id="memEmoji">🌿</div>
    <div class="mem-mood" id="memMood"></div>
    <div class="mem-text" id="memText"></div>
    <div class="mem-date" id="memDate"></div>
    <div class="mem-line"></div>
    <div class="mem-quote" id="memQuote"></div>
    <div class="badge-wrap" id="badgeWrap"></div>
    <button class="btn-close" id="btnClose">收下这份记录</button>
  </div>
</div>

<div class="app">
  <div class="main">
    <div class="hd">
      <div class="lg">知</div>
      <div>
        <h1>知境</h1>
        <p>AI个人成长伴侣 — 说你想说的，剩下的交给我</p>
      </div>
    </div>

    <!-- 对话流（核心 — 记录+对话合一） -->
    <div class="card" id="cChat">
      <div class="ct"><div class="ic">💬</div>知境对话</div>
      <div class="insight-strip" id="insightStrip">
        <div class="is-icon" id="isIcon">🌿</div>
        <div class="is-text" id="isText"></div>
      </div>
      <div class="chat">
        <div class="ca" id="chatArea"></div>
        <div class="quick-moods" id="quickMoods">
          <!-- 可选快捷情绪标签 -->
        </div>
        <div class="cir">
          <input class="ci" id="chatInput" placeholder="说你想说的...比如「今天好累，什么都不想做」" autocomplete="off">
          <button class="bs" id="btnSend">发送</button>
        </div>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="card pf" id="cProfile">
      <div class="paw">🌸</div>
      <div class="pn">探索者</div>
      <div class="pbio">在成长路上，每一步都算数</div>
      <div class="sts">
        <div class="st"><div class="stv" id="sRec">0</div><div class="stl">状态记录</div></div>
        <div class="st"><div class="stv" id="sChat">0</div><div class="stl">对话次数</div></div>
        <div class="st"><div class="stv" id="sStr">0</div><div class="stl">连续天数</div></div>
      </div>
    </div>

    <div class="card" id="cCal">
      <div class="ct"><div class="ic" style="background:linear-gradient(135deg,var(--a1),var(--a2))">📅</div>情绪日历</div>
      <div class="cal-wrap">
        <div class="cal-labels"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>

    <div class="card" id="cTags">
      <div class="ct"><div class="ic" style="background:linear-gradient(135deg,var(--g1),var(--g2))">🏷️</div>兴趣标签</div>
      <div class="tc" id="tagCloud"></div>
    </div>

    <div class="card" id="cRecent">
      <div class="ct"><div class="ic" style="background:linear-gradient(135deg,var(--b1),#A0C8E8)">📝</div>最近状态</div>
      <div class="rc">
        <div class="rcl">Latest</div>
        <div class="rct" id="rText">暂无记录</div>
        <div class="rctime" id="rTime">—</div>
      </div>
      <div class="hl" id="histList"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   知境 v4 — 对话即记录，AI自动识别情绪，无需手动选标签
   ============================================================ */

/* ---------- 情绪自动识别 ---------- */
const MOODS=['迷茫','焦虑','好奇','平静','疲惫','充满干劲'];
const MOOD_EMOJI={'迷茫':'🌫️','焦虑':'😰','好奇':'🤔','平静':'🌿','疲惫':'😮‍💨','充满干劲':'🔥','自定义':'📝'};
const MOOD_KW={
  '迷茫':['迷茫','不知道','困惑','迷失','方向','找不到','不确定','十字路口','犹豫'],
  '焦虑':['焦虑','着急','担心','不安','紧张','怕','害怕','慌','崩溃','压力','窒息','喘不过'],
  '好奇':['好奇','想学','兴趣','想知道','探索','试试','想了解','新鲜','有趣'],
  '平静':['平静','安静','舒服','放松','还好','不错','挺好的','安心','踏实'],
  '疲惫':['累','疲惫','疲倦','辛苦','困','乏力','透支','受不了','撑不住','耗尽'],
  '充满干劲':['干劲','动力','冲','兴奋','期待','信心满满','斗志','来了','想做事','能量满满']
};

function detectMood(text){
  let best='自定义',bestScore=0;
  for(const[mood,kws]of Object.entries(MOOD_KW)){
    const score=kws.filter(k=>text.includes(k)).length;
    if(score>bestScore){bestScore=score;best=mood;}
  }
  return bestScore>0?best:'自定义';
}

/* ---------- 主题识别 + 书中原话 ---------- */

function detectTopic(text){
  let best=null,bestScore=0;
  for(const[key,topic]of Object.entries(TOPICS)){
    const hits=topic.kw.filter(k=>text.includes(k));
    if(hits.length>bestScore){bestScore=hits.length;best=key;}
  }
  return best;
}

function getQuote(topicKey){
  const t=TOPICS[topicKey]; if(!t)return null;
  return t.quotes[Math.floor(Math.random()*t.quotes.length)];
}
function getInsight(topicKey,mood){
  const t=TOPICS[topicKey]; if(!t)return'';
  const idx=MOODS.indexOf(mood);
  if(idx>=0&&t.insights[idx])return t.insights[idx];
  return t.insights[Math.floor(Math.random()*t.insights.length)];
}

/* ---------- 粒子 ---------- */
const cvs=document.getElementById('pc'),ctx=cvs.getContext('2d');
let pts=[];
function rs(){cvs.width=innerWidth;cvs.height=innerHeight}
addEventListener('resize',rs);rs();
class Pt{constructor(){this.reset()}
reset(){this.x=Math.random()*cvs.width;this.y=Math.random()*cvs.height;this.vx=(Math.random()-.5)*.3;this.vy=(Math.random()-.5)*.3;this.r=Math.random()*2+1;this.a=Math.random()*.2+.06}
update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>cvs.width)this.vx*=-1;if(this.y<0||this.y>cvs.height)this.vy*=-1}
draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(139,126,200,${this.a})`;ctx.fill()}}
for(let i=0;i<55;i++)pts.push(new Pt());
function animP(){ctx.clearRect(0,0,cvs.width,cvs.height);pts.forEach(p=>{p.update();p.draw()});
for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<140){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(139,126,200,${0.05*(1-d/140)})`;ctx.lineWidth=.8;ctx.stroke()}}requestAnimationFrame(animP)}
animP();

function addMsg(role,content,extra){
  const wrap=document.createElement('div');wrap.className=`msg ${role}`;
  const avatar=document.createElement('div');avatar.className='m-avatar';
  avatar.textContent=role==='ai'?'🦉':'🌸';
  const body=document.createElement('div');body.className='m-body';
  const bubble=document.createElement('div');bubble.className='m-bubble';
  wrap.appendChild(avatar);wrap.appendChild(body);body.appendChild(bubble);
  chatArea.appendChild(wrap);
  chatArea.scrollTop=chatArea.scrollHeight;

  if(typeof content==='string'){
    if(role==='ai') return typeText(bubble,content);
    bubble.textContent=content;
    return Promise.resolve();
  }
  // content is a function that populates bubble
  return content(bubble);
}

function typeText(el,text,spd=26){
  return new Promise(r=>{
    el.classList.add('blink');el.textContent='';let i=0;
    function step(){if(i<text.length){el.textContent+=text.charAt(i);i++;setTimeout(step,spd+Math.random()*12)}else{el.classList.remove('blink');r()}}
    step();
  });
}

function showTyping(){
  const wrap=document.createElement('div');wrap.className='msg ai';wrap.id='typEl';
  wrap.innerHTML='<div class="m-avatar">🦉</div><div class="m-body"><div class="typing"><span></span><span></span><span></span></div></div>';
  chatArea.appendChild(wrap);chatArea.scrollTop=chatArea.scrollHeight;
}
function rmTyping(){const e=document.getElementById('typEl');if(e)e.remove();}

      // 如果有推荐，追加推荐卡片
      if(quote){
        const qCard=document.createElement('div');qCard.className='m-quote';
        qCard.innerHTML=`<div class="qt">${quote.text}</div><div class="qs"><span class="qn">${quote.book}</span></div><div class="qtags">${quote.tags.map(t=>`<span class="qtag">${t}</span>`).join('')}</div>`;
        bubble.parentElement.appendChild(qCard);
        // 加入标签
        quote.tags.forEach(t=>S.tags.add(t));
        const tagMap={work:'职场',relationship:'关系',study:'学业',family:'家庭',health:'健康',money:'财务',self:'自我探索',social:'社交'};
        if(topicKey&&tagMap[topicKey])S.tags.add(tagMap[topicKey]);
        updateTags();
        chatArea.scrollTop=chatArea.scrollHeight;
      }
    });
  };
}

// 添加记录卡片到对话流
function addRecordToChat(mood,text,timeStr){
  const wrap=document.createElement('div');wrap.className='msg ai';
  wrap.innerHTML=`<div class="m-avatar">🦉</div><div class="m-body"><div class="m-record"><span class="rec-emoji">${MOOD_EMOJI[mood]||'📝'}</span><div class="rec-content"><strong>已记录：</strong>${escHtml(text)}</div><span class="rec-time">${timeStr}</span></div></div>`;
  chatArea.appendChild(wrap);
  chatArea.scrollTop=chatArea.scrollHeight;
}

function escHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}

/* ---------- 核心发送逻辑 ---------- */
function sendMsg(){
  const text=chatInput.value.trim();
  if(!text)return;
  chatInput.value='';

  // 添加用户消息
  addMsg('user',text);
  S.chatCount++;sChat.textContent=S.chatCount;

  // AI自动识别情绪
  const mood=detectMood(text);
  const topicKey=detectTopic(text);

  // 对话轮次：每3轮做一次完整反馈（洞察+记录+推荐）
  S.dialogueRound++;
  const shouldRecord=S.dialogueRound%3===1; // 第1、4、7轮记录

  if(shouldRecord){
    // 1. 苏格拉底追问 + 推荐卡片 + 洞察
    const quote=topicKey?getQuote(topicKey):null;
    const insight=topicKey?getInsight(topicKey,mood):null;

    // 更新洞察条
    if(insight){
      isIcon.textContent=MOOD_EMOJI[mood]||'🌿';
      isText.innerHTML=`<strong>状态洞察：</strong>${insight}`;
      insightStrip.classList.add('show');
    }

    // 苏格拉底回复
    const dlgNode=DIALOGUE[S.node];
    let aiText=dlgNode?dlgNode.ai:'我听到了。能多说说吗？';

    // 如果有话题，在苏格拉底回复后面追加推荐
    showTyping();
    setTimeout(()=>{
      rmTyping();
      addMsg('ai',aiReply(aiText,quote,topicKey,mood));
    },800+Math.random()*500);

    // 2. 自动记录
    const now=new Date();
    const ts=now.getTime();
    const timeStr=`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    S.records.unshift({mood,text:substring(text,40),time:timeStr,ts});
    if(S.records.length>100)S.records.pop();
    sRec.textContent=S.records.length;
    rText.textContent=text;rTime.textContent=timeStr;

    const hi=document.createElement('div');hi.className='hi';
    hi.innerHTML=`<div class="hdot"></div><div class="htxt">${escHtml(text)}</div><div class="htime">${timeStr}</div>`;
    histList.insertBefore(hi,histList.firstChild);

    if(mood!=='自定义')S.tags.add(mood);
    updateTags();updateCal();updateStr();save();

    // 记录卡片出现在对话流中
    setTimeout(()=>addRecordToChat(mood,text,timeStr),2000);

    // 首次记录弹窗
    if(S.records.length===1){
      setTimeout(()=>showModal(mood,text,timeStr),2500);
    }

  } else {
    // 纯苏格拉底对话
    const node=DIALOGUE[S.node];
    let nextNode=null;
    if(node&&node.branches){
      for(const b of node.branches){
        if(b.kw.length&&b.kw.some(k=>text.includes(k))){nextNode=b.next;break;}
      }
      if(!nextNode){const fb=node.branches.find(b=>!b.kw.length);if(fb)nextNode=fb.next;}
    }
    if(nextNode&&DIALOGUE[nextNode])S.node=nextNode;

    const nd=DIALOGUE[S.node];
    if(nd){
      showTyping();
      setTimeout(()=>{rmTyping();addMsg('ai',nd.ai,true);},800+Math.random()*500);
    }
    save();
  }
}

function substring(s,n){return s.length>n?s.substring(0,n)+'...':s;}

document.getElementById('btnSend').addEventListener('click',sendMsg);
chatInput.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.isComposing){e.preventDefault();sendMsg();}
});

function updateTags(){tagCloud.innerHTML=[...S.tags].map(t=>`<div class="tag">${t}</div>`).join('');}

/* ---------- 情绪日历 ---------- */
function updateCal(){
  calGrid.innerHTML='';
  const today=new Date();
  for(let i=34;i>=0;i--){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const cell=document.createElement('div');cell.className='cal-cell';
    cell.textContent=d.getDate();
    const dayStart=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
    const dayEnd=dayStart+86400000;
    const recs=S.records.filter(r=>r.ts>=dayStart&&r.ts<dayEnd);
    if(recs.length){
      const r=recs[0];
      cell.classList.add('has');
      cell.classList.add('m-'+r.mood.replace(/\s/g,''));
      const tip=document.createElement('div');tip.className='cal-tip';
      tip.textContent=r.text;
      cell.appendChild(tip);
    }
    calGrid.appendChild(cell);
  }
}

function updateStr(){
  if(!S.records.length){sStr.textContent='0';return;}
  const ds=new Set();
  S.records.forEach(r=>{const d=new Date(r.ts);ds.add(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`);});
  const sorted=[...ds].sort();
  let str=1;
  for(let i=sorted.length-1;i>0;i--){
    if((new Date(sorted[i])-new Date(sorted[i-1]))/86400000<=1)str++;else break;
  }
  sStr.textContent=str;
}

/* ---------- 仪式感弹窗 ---------- */
const MEM_QUOTES=['每一次记录，都是与自己对话的开始。','你不需要完美，只需要真实。','今天的感受，是明天成长的土壤。','看见自己，就是改变的开始。','情绪的波浪里，藏着最真实的你。'];
const BADGES=[{n:1,emoji:'🌱',title:'第一步'},{n:3,emoji:'🌿',title:'萌芽'},{n:7,emoji:'🍀',title:'一周行者'},{n:14,emoji:'🔥',title:'双周'},{n:30,emoji:'⭐',title:'月度之星'},{n:60,emoji:'🌟',title:'习惯养成'},{n:100,emoji:'👑',title:'百日匠人'}];

function showModal(mood,text,timeStr){
  document.getElementById('memEmoji').textContent=MOOD_EMOJI[mood]||'📝';
  document.getElementById('memMood').textContent=mood==='自定义'?'记录':mood;
  document.getElementById('memText').textContent=text;
  document.getElementById('memDate').textContent=timeStr;
  document.getElementById('memQuote').textContent='"'+MEM_QUOTES[Math.floor(Math.random()*MEM_QUOTES.length)]+'"';
  const wrap=document.getElementById('badgeWrap');wrap.innerHTML='';
  const unlocked=BADGES.filter(b=>S.records.length>=b.n);
  const display=unlocked.length>3?unlocked.slice(-3):unlocked;
  display.forEach((b,i)=>{
    const el=document.createElement('div');
    el.className='badge'+(b.n>=30?' shine':'');
    el.textContent=b.emoji;el.dataset.title=b.title;
    el.style.animationDelay=(i*.15)+'s';
    wrap.appendChild(el);
  });
  document.getElementById('modal').classList.add('on');
}

document.getElementById('btnClose').addEventListener('click',()=>{
  document.getElementById('modal').classList.remove('on');
});
addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').classList.remove('on');});

/* ---------- 入场 ---------- */
const io=new IntersectionObserver((es)=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('v')}),{threshold:.1});
document.querySelectorAll('.card').forEach(c=>io.observe(c));

/* ---------- 恢复数据 ---------- */
function render(){
  histList.innerHTML='';
  S.records.forEach(r=>{
    const hi=document.createElement('div');hi.className='hi';
    hi.innerHTML=`<div class="hdot"></div><div class="htxt">${escHtml(r.text)}</div><div class="htime">${r.time}</div>`;
    histList.appendChild(hi);
  });
  if(S.records.length){rText.textContent=S.records[0].text;rTime.textContent=S.records[0].time;}
  sRec.textContent=S.records.length;sChat.textContent=S.chatCount;
  updateTags();updateCal();updateStr();
}

load();render();

// 初始欢迎
addMsg('ai','你好，我是知境。说说看，你此刻在想什么？');
</script>
