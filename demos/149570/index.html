<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨阅 · 沉浸式互动书库</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --gold:#c9a86a;
  --gold-light:#e8d5a8;
  --gold-deep:#a07a3a;
  --gold-glow:rgba(201,168,106,0.4);
  --blue:#6aa0d6;
  --ink:#000000;
  --ink-soft:#0a0e1a;
  --ink-card:rgba(18,24,40,0.6);
  --paper:#e8e2d0;
  --paper-dim:#9aa0a8;
  --paper-faint:#555a64;
  --line:rgba(201,168,106,0.15);
  --glass-bg:rgba(10,14,26,0.4);
  --glass-border:rgba(201,168,106,0.2);
}

html{scroll-behavior:smooth}
body{font-family:'Noto Sans SC','PingFang SC',sans-serif;-webkit-font-smoothing:antialiased;background:var(--ink);color:var(--paper);overflow-x:hidden}
.serif{font-family:'Noto Serif SC','Songti SC',serif}

/* ===== 场景切换 ===== */
.scene{display:none;position:fixed;inset:0;overflow:hidden}
.scene.active{display:block}

/* ================================================================
   场景1: HERO 首页（参考动态背景效果风格）
   ================================================================ */
#scene-hero{background:#000}

/* 背景层 */
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-bg-base{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 40%, #1a2438 0%, #0a0e1a 40%, #000 100%)}

/* 金色辉光 - mix-blend-screen */
.hero-glow{position:absolute;inset:0;mix-blend-mode:screen;background:radial-gradient(circle at 70% 50%, rgba(201,168,106,0.18), transparent 60%)}
.hero-glow-blue{position:absolute;inset:0;mix-blend-mode:screen;background:radial-gradient(circle at 30% 80%, rgba(106,160,214,0.12), transparent 50%)}

/* 暗角 */
.hero-vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 200px rgba(0,0,0,0.8)}

/* 左侧深色渐变遮罩（确保文字可读） */
.hero-left-fade{position:absolute;left:0;top:0;bottom:0;width:55%;background:linear-gradient(to right, #000 0%, #000 30%, rgba(0,0,0,0.7) 60%, transparent 100%);z-index:1}

/* 光束 - 两束倾斜的光 */
.hero-light-ray{position:absolute;top:-20%;width:300px;height:160%;background:linear-gradient(180deg, transparent, rgba(201,168,106,0.06), transparent);filter:blur(40px);transform:rotate(-25deg);animation:rayPulse 6s ease-in-out infinite}
.hero-light-ray.r1{right:20%;animation-delay:0s}
.hero-light-ray.r2{right:45%;animation-delay:3s;opacity:0.5}
@keyframes rayPulse{0%,100%{opacity:0.4}50%{opacity:0.8}}

/* 漂浮粒子 */
.particles{position:absolute;inset:0;overflow:hidden;z-index:2;pointer-events:none}
.particle{position:absolute;width:3px;height:3px;background:var(--gold);border-radius:50%;box-shadow:0 0 6px var(--gold);animation:particleFloat linear infinite;opacity:0.6}
.particle.blue{background:var(--blue);box-shadow:0 0 6px var(--blue)}
.particle.large{width:4px;height:4px;opacity:0.8}
.particle.small{width:2px;height:2px;opacity:0.4}
@keyframes particleFloat{
  0%{transform:translateY(100vh) translateX(0);opacity:0}
  10%{opacity:0.6}
  90%{opacity:0.6}
  100%{transform:translateY(-10vh) translateX(50px);opacity:0}
}

/* 导航栏 */
.navbar{position:fixed;top:0;left:0;width:100%;z-index:100;padding:24px 48px;display:flex;align-items:center;justify-between}
.navbar .logo{display:flex;flex-direction:column;gap:2px}
.navbar .logo-text{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;color:var(--gold);letter-spacing:2px}
.navbar .logo-tag{font-size:10px;color:var(--paper-faint);letter-spacing:4px;text-transform:uppercase}
.navbar .nav-links{display:flex;gap:32px;align-items:center}
.navbar .nav-link{font-size:13px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--paper-dim);cursor:pointer;transition:all .3s;position:relative;padding-bottom:4px}
.navbar .nav-link:hover{color:var(--gold)}
.navbar .nav-link.active{color:var(--gold)}
.navbar .nav-link.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--gold)}
.navbar .nav-right{display:flex;align-items:center;gap:16px}
.navbar .nav-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--paper-dim);cursor:pointer;transition:all .3s}
.navbar .nav-icon:hover{color:var(--gold);background:rgba(201,168,106,0.1)}

/* Hero 内容区 */
.hero-content{position:relative;z-index:10;height:100vh;display:flex;align-items:center;padding:0 48px}
.hero-content-inner{max-width:640px}

/* 顶部标签 */
.hero-top-label{display:flex;align-items:center;gap:10px;margin-bottom:24px;opacity:0;animation:fadeInUp 0.8s 0.2s ease-out forwards}
.hero-top-label-icon{width:28px;height:28px;color:var(--gold)}
.hero-top-label-text{font-size:11px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--gold)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* 主标题 - 逐行揭示 */
.hero-title{font-family:'Noto Serif SC',serif;font-weight:900;line-height:0.95;letter-spacing:-0.02em;margin-bottom:24px}
.hero-title-line{overflow:hidden;display:block}
.hero-title-line span{display:block;animation:revealLine 0.8s cubic-bezier(0.16,1,0.3,1) forwards;transform:translateY(100%)}
.hero-title-line:nth-child(1) span{animation-delay:0.3s}
.hero-title-line:nth-child(2) span{animation-delay:0.4s}
.hero-title-line:nth-child(3) span{animation-delay:0.5s}
@keyframes revealLine{from{transform:translateY(100%)}to{transform:translateY(0)}}
.hero-title-main{font-size:clamp(48px,7vw,88px);color:#fff}
.hero-title-highlight{font-size:clamp(48px,7vw,88px);background:linear-gradient(to right, var(--gold-light), var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}

/* 描述文字 */
.hero-desc{font-size:16px;line-height:1.7;color:var(--paper-dim);max-width:480px;margin-bottom:40px;opacity:0;animation:fadeInUp 0.8s 0.6s ease-out forwards}

/* CTA 按钮区 */
.hero-ctas{display:flex;gap:20px;align-items:center;opacity:0;animation:fadeInUp 0.8s 0.75s ease-out forwards}
.btn-primary{position:relative;display:inline-flex;align-items:center;gap:10px;padding:14px 32px;border-radius:12px;background:linear-gradient(135deg, var(--gold), var(--gold-deep));color:#0a0e1a;font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .3s;border:none;overflow:hidden}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(201,168,106,0.3)}
.btn-primary::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);transition:left .5s}
.btn-primary:hover::before{left:100%}
.btn-secondary{display:inline-flex;align-items:center;gap:8px;padding:14px 0;color:var(--paper-dim);font-size:14px;font-weight:500;letter-spacing:1px;cursor:pointer;transition:all .3s;position:relative;border:none;background:none}
.btn-secondary::after{content:'';position:absolute;bottom:10px;left:0;width:0;height:2px;background:var(--gold);transition:width .3s}
.btn-secondary:hover{color:#fff}
.btn-secondary:hover::after{width:100%}

/* 特色功能行 */
.hero-features{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:60px;max-width:560px;opacity:0;animation:fadeInUp 0.8s 0.9s ease-out forwards}
.hero-feat{display:flex;align-items:center;gap:12px}
.hero-feat-icon{width:44px;height:44px;border-radius:10px;border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;color:var(--gold);transition:all .3s}
.hero-feat:hover .hero-feat-icon{border-color:var(--gold);background:rgba(201,168,106,0.1)}
.hero-feat-text{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--paper-dim)}

/* 右侧视觉区 */
.hero-visual{position:absolute;right:0;top:0;bottom:0;width:60%;z-index:5;pointer-events:none}
.hero-visual-inner{position:relative;width:100%;height:100%}

/* 漂浮书本（右侧视觉焦点） */
.float-book{position:absolute;border-radius:4px 10px 10px 4px;box-shadow:0 30px 80px rgba(0,0,0,0.5);animation:bookFloat 6s ease-in-out infinite}
.float-book .fb-spine{position:absolute;left:0;top:0;bottom:0;width:10px;background:rgba(0,0,0,0.3);border-radius:4px 0 0 4px}
.float-book .fb-cover{position:absolute;inset:0;border-radius:4px 10px 10px 4px;overflow:hidden}
.float-book .fb-cover::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg, rgba(255,255,255,0.1), transparent 50%)}
.float-book .fb-title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center}
.float-book .fb-title-text{font-family:'Noto Serif SC',serif;font-weight:700;color:#fff;font-size:16px;line-height:1.3;text-shadow:0 2px 8px rgba(0,0,0,0.5)}
.float-book .fb-sub{font-size:10px;color:rgba(255,255,255,0.6);margin-top:6px}

.float-book.b1{width:180px;height:240px;top:20%;right:25%;animation-delay:0s}
.float-book.b2{width:140px;height:190px;top:45%;right:10%;animation-delay:1s}
.float-book.b3{width:120px;height:160px;top:15%;right:8%;animation-delay:2s}
@keyframes bookFloat{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-20px) rotate(2deg)}
}

/* 滚动提示 */
.scroll-hint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;animation:fadeInUp 1s 1.2s ease-out forwards}
.scroll-hint-text{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--paper-faint)}
.scroll-hint-line{width:1px;height:40px;background:linear-gradient(to bottom, var(--gold), transparent);animation:scrollLine 2s ease-in-out infinite}
@keyframes scrollLine{0%,100%{opacity:0.3}50%{opacity:1}}

/* ================================================================
   场景2: 书架
   ================================================================ */
#scene-shelf{background:#000;overflow-y:auto}

.shelf-hero{position:relative;height:40vh;min-height:300px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.shelf-hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 80%, rgba(201,168,106,0.08), transparent 60%)}
.shelf-hero .particles{opacity:0.5}
.shelf-hero-content{position:relative;z-index:10;text-align:center}
.shelf-hero h2{font-family:'Noto Serif SC',serif;font-size:clamp(36px,5vw,60px);font-weight:700;color:#fff;margin-bottom:12px;letter-spacing:4px}
.shelf-hero p{font-size:13px;color:var(--paper-faint);letter-spacing:3px}

.shelf-container{position:relative;z-index:10;max-width:1400px;margin:0 auto;padding:0 48px 80px}

/* 分类筛选 */
.shelf-cats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:48px}
.shelf-cat{padding:8px 24px;border-radius:999px;font-size:12px;font-weight:500;letter-spacing:1px;cursor:pointer;transition:all .3s;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:var(--paper-dim)}
.shelf-cat:hover{border-color:var(--gold-glow);color:var(--gold);background:rgba(201,168,106,0.05)}
.shelf-cat.active{background:linear-gradient(135deg, var(--gold), var(--gold-deep));color:#0a0e1a;border-color:transparent;font-weight:600;box-shadow:0 4px 20px rgba(201,168,106,0.2)}

/* 书架网格 */
.shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:32px}

/* 书本卡片 - 玻璃拟态 */
.book-card{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;transition:all .4s cubic-bezier(0.16,1,0.3,1);background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(10px)}
.book-card:hover{transform:translateY(-8px);border-color:var(--gold-glow);box-shadow:0 30px 60px rgba(0,0,0,0.4), 0 0 40px rgba(201,168,106,0.1)}

.book-card-cover{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden}
.book-card-cover .cover-inner{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:24px}
.book-card-cover .cover-glyph{font-family:'Noto Serif SC',serif;font-size:56px;font-weight:900;opacity:0.2;color:#fff}
.book-card-cover .cover-info{position:relative;z-index:1}
.book-card-cover .cover-title{font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700;color:#fff;line-height:1.3;margin-bottom:4px}
.book-card-cover .cover-author{font-size:12px;color:rgba(255,255,255,0.6)}
.book-card-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.7) 100%)}

.book-card-body{padding:20px}
.book-card-summary{font-size:13px;color:var(--paper-dim);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:16px}
.book-card-stats{display:flex;gap:16px;padding-top:16px;border-top:1px solid var(--line)}
.book-card-stat{flex:1;text-align:center}
.book-card-stat .num{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:600;color:var(--gold)}
.book-card-stat .label{font-size:10px;color:var(--paper-faint);letter-spacing:1px;margin-top:2px}
.book-card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.book-card-tag{font-size:10px;color:var(--gold);padding:3px 10px;border-radius:999px;background:rgba(201,168,106,0.1);border:1px solid rgba(201,168,106,0.2)}

/* 卡片悬浮发光效果 */
.book-card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:2px;background:linear-gradient(90deg, transparent, var(--gold), transparent);opacity:0;transition:opacity .4s}
.book-card:hover::before{opacity:1}

/* 返回按钮 */
.back-btn{position:fixed;top:24px;left:48px;z-index:100;display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;background:rgba(10,14,26,0.6);backdrop-filter:blur(10px);border:1px solid var(--glass-border);color:var(--gold);font-size:13px;cursor:pointer;transition:all .3s}
.back-btn:hover{background:rgba(201,168,106,0.15);border-color:var(--gold)}

/* ================================================================
   详情弹窗
   ================================================================ */
.detail-modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.8);backdrop-filter:blur(12px)}
.detail-modal.show{display:flex;animation:fadeIn 0.3s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.detail-box{position:relative;background:linear-gradient(180deg, rgba(18,24,40,0.95), rgba(10,14,26,0.98));border:1px solid var(--glass-border);border-radius:24px;max-width:640px;width:92%;max-height:88vh;overflow-y:auto;box-shadow:0 50px 100px rgba(0,0,0,0.5), 0 0 60px rgba(201,168,106,0.1)}
.detail-box::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:50%;height:2px;background:linear-gradient(90deg, transparent, var(--gold), transparent)}

.detail-close{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--paper-dim);font-size:20px;cursor:pointer;transition:all .3s;z-index:5}
.detail-close:hover{background:rgba(255,255,255,0.1);color:#fff;border-color:var(--gold-glow)}

/* 详情封面区 */
.detail-cover{position:relative;height:240px;border-radius:24px 24px 0 0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.detail-cover .cover-glyph{font-family:'Noto Serif SC',serif;font-size:120px;font-weight:900;opacity:0.15;color:#fff;z-index:1}
.detail-cover .cover-glow{position:absolute;bottom:-50%;left:50%;transform:translateX(-50%);width:200%;height:200%;background:radial-gradient(ellipse at center, rgba(201,168,106,0.2), transparent 50%)}

.detail-body{padding:32px;position:relative;z-index:2}
.detail-body h3{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:700;color:#fff;margin-bottom:4px}
.detail-body .subtitle{font-size:14px;color:var(--paper-dim);margin-bottom:12px}
.detail-body .author{font-size:13px;color:var(--gold);margin-bottom:24px}

.detail-summary{font-size:14px;color:var(--paper);line-height:1.7;margin-bottom:28px;padding:16px 20px;background:rgba(201,168,106,0.05);border-left:3px solid var(--gold);border-radius:0 12px 12px 0}

.detail-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.detail-tag{font-size:11px;color:var(--gold);padding:4px 14px;border-radius:999px;background:rgba(201,168,106,0.1);border:1px solid rgba(201,168,106,0.2)}

.detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:24px 0;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.detail-stat{text-align:center;position:relative}
.detail-stat + .detail-stat::before{content:'';position:absolute;left:0;top:20%;height:60%;width:1px;background:var(--line)}
.detail-stat .num{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:600;color:var(--gold)}
.detail-stat .label{font-size:11px;color:var(--paper-faint);letter-spacing:1px;margin-top:4px}

.detail-section{margin-top:24px}
.detail-section-title{font-size:11px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.detail-section-title::before{content:'';width:20px;height:2px;background:var(--gold)}

.detail-features{list-style:none;padding:0}
.detail-features li{font-size:13px;color:var(--paper);line-height:1.7;padding:6px 0 6px 20px;position:relative}
.detail-features li::before{content:'◆';position:absolute;left:0;color:var(--gold);font-size:8px;top:10px}

.detail-experience{font-size:14px;color:var(--paper-dim);line-height:1.7;font-family:'Noto Serif SC',serif;padding:18px 20px;background:rgba(106,160,214,0.06);border-radius:12px;border-left:3px solid var(--blue);font-style:italic}

.detail-enter{display:block;width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg, var(--gold), var(--gold-deep));color:#0a0e1a;font-size:15px;font-weight:700;text-align:center;border:none;cursor:pointer;transition:all .3s;letter-spacing:3px;text-transform:uppercase;margin-top:28px;box-shadow:0 10px 30px rgba(201,168,106,0.2)}
.detail-enter:hover{transform:translateY(-2px);box-shadow:0 15px 40px rgba(201,168,106,0.3)}

/* 滚动条 */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(201,168,106,0.2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(201,168,106,0.4)}

/* 响应式 */
@media(max-width:1024px){
  .navbar{padding:20px 24px}
  .navbar .nav-links{display:none}
  .hero-content{padding:0 24px}
  .hero-visual{width:50%;opacity:0.5}
  .hero-features{grid-template-columns:1fr;gap:16px}
  .shelf-container{padding:0 24px 60px}
  .back-btn{left:24px}
}
@media(max-width:640px){
  .hero-visual{display:none}
  .hero-left-fade{width:100%;background:linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.5) 50%, #000 100%)}
  .shelf-grid{grid-template-columns:1fr 1fr;gap:16px}
  .hero-features{display:none}
  .detail-stats{grid-template-columns:repeat(3,1fr)}
  .detail-stat .num{font-size:22px}
}
</style>
</head>
<body>

<!-- ===== 场景1: HERO 首页 ===== -->
<div class="scene active" id="scene-hero">
  <!-- 背景层 -->
  <div class="hero-bg">
    <div class="hero-bg-base"></div>
    <div class="hero-glow"></div>
    <div class="hero-glow-blue"></div>
    <div class="hero-light-ray r1"></div>
    <div class="hero-light-ray r2"></div>
    <div class="hero-left-fade"></div>
    <div class="hero-vignette"></div>
  </div>

  <!-- 粒子 -->
  <div class="particles" id="particles"></div>

  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="logo">
      <span class="logo-text">墨 阅</span>
      <span class="logo-tag">Immersive Library</span>
    </div>
    <div class="nav-links">
      <span class="nav-link active" onclick="switchScene('hero')">首页</span>
      <span class="nav-link" onclick="switchScene('shelf')">书架</span>
      <span class="nav-link" onclick="alert('分类浏览功能开发中')">分类</span>
      <span class="nav-link" onclick="alert('关于墨阅功能开发中')">关于</span>
    </div>
    <div class="nav-right">
      <div class="nav-icon" onclick="alert('搜索功能开发中')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
      <div class="nav-icon" onclick="alert('用户功能开发中')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
    </div>
  </nav>

  <!-- 右侧视觉区 -->
  <div class="hero-visual">
    <div class="hero-visual-inner" id="hero-visual-inner">
      <div class="float-book b1" id="fb1" onclick="showDetail(bookData[0])">
        <div class="fb-spine"></div>
        <div class="fb-cover"></div>
        <div class="fb-title"><span class="fb-title-text" id="fb1-title">加载中</span><span class="fb-sub" id="fb1-sub"></span></div>
      </div>
      <div class="float-book b2" id="fb2" onclick="showDetail(bookData[1])">
        <div class="fb-spine"></div>
        <div class="fb-cover"></div>
        <div class="fb-title"><span class="fb-title-text" id="fb2-title"></span><span class="fb-sub" id="fb2-sub"></span></div>
      </div>
      <div class="float-book b3" id="fb3" onclick="showDetail(bookData[2])">
        <div class="fb-spine"></div>
        <div class="fb-cover"></div>
        <div class="fb-title"><span class="fb-title-text" id="fb3-title"></span><span class="fb-sub" id="fb3-sub"></span></div>
      </div>
    </div>
  </div>

  <!-- Hero 内容 -->
  <div class="hero-content">
    <div class="hero-content-inner">
      <div class="hero-top-label">
        <svg class="hero-top-label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span class="hero-top-label-text">沉浸式互动阅读</span>
      </div>

      <h1 class="hero-title">
        <span class="hero-title-line"><span class="hero-title-main">翻 开 一 本 书</span></span>
        <span class="hero-title-line"><span class="hero-title-highlight">进 入 一 个 世 界</span></span>
        <span class="hero-title-line"><span class="hero-title-main">的 思 想 之 旅</span></span>
      </h1>

      <p class="hero-desc">
        不只是阅读，而是一场沉浸式的思维旅程。每本书都配有互动练习、可视化工具和沉浸式阅读体验，让知识不再停留在纸面上。
      </p>

      <div class="hero-ctas">
        <button class="btn-primary" onclick="switchScene('shelf')">
          浏览书架
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
        <button class="btn-secondary" onclick="scrollToFeatures()">
          了解特色功能
        </button>
      </div>

      <div class="hero-features" id="hero-features">
        <div class="hero-feat">
          <div class="hero-feat-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          </div>
          <span class="hero-feat-text">互动阅读</span>
        </div>
        <div class="hero-feat">
          <div class="hero-feat-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          </div>
          <span class="hero-feat-text">知识可视化</span>
        </div>
        <div class="hero-feat">
          <div class="hero-feat-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <span class="hero-feat-text">可复用生成</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 滚动提示 -->
  <div class="scroll-hint">
    <span class="scroll-hint-text">向下滚动</span>
    <div class="scroll-hint-line"></div>
  </div>
</div>

<!-- ===== 场景2: 书架 ===== -->
<div class="scene" id="scene-shelf">
  <!-- 书架 Hero 区 -->
  <div class="shelf-hero">
    <div class="shelf-hero-bg"></div>
    <div class="particles" id="shelf-particles"></div>
    <div class="shelf-hero-content">
      <h2>书 架</h2>
      <p>选 择 一 本 书 ， 开 始 你 的 阅 读 之 旅</p>
    </div>
  </div>

  <!-- 返回按钮 -->
  <button class="back-btn" onclick="switchScene('hero')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    返回首页
  </button>

  <!-- 书架内容 -->
  <div class="shelf-container">
    <div class="shelf-cats" id="shelf-cats"></div>
    <div class="shelf-grid" id="shelf-grid"></div>
  </div>
</div>

<!-- ===== 详情弹窗 ===== -->
<div class="detail-modal" id="detail-modal">
  <div class="detail-box" id="detail-box"></div>
</div>

<script>
// ============ 配置 ============
const BOOK_DIRS = ['金字塔原理1', '金字塔原理2', '人选天选论'];
let bookData = [];
let activeCategory = '全部';

// ============ 粒子生成 ============
function createParticles(containerId, count=30) {
  const container = document.getElementById(containerId);
  if (!container) return;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    const type = Math.random() > 0.7 ? 'blue' : (Math.random() > 0.5 ? 'large' : (Math.random() > 0.3 ? 'small' : ''));
    p.className = 'particle ' + type;
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (6 + Math.random() * 8) + 's';
    p.style.animationDelay = (Math.random() * -10) + 's';
    container.appendChild(p);
  }
}
createParticles('particles', 40);

// ============ 鼠标视差效果 ============
let mouseX = 0, mouseY = 0;
let currentX = 0, currentY = 0;
document.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 30;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 30;
});
function animateParallax() {
  currentX += (mouseX - currentX) * 0.05;
  currentY += (mouseY - currentY) * 0.05;
  const visual = document.getElementById('hero-visual-inner');
  if (visual) {
    visual.style.transform = `translate(${currentX}px, ${currentY}px)`;
  }
  const glow = document.querySelector('.hero-glow');
  if (glow) {
    glow.style.transform = `translate(${currentX * 0.3}px, ${currentY * 0.3}px)`;
  }
  requestAnimationFrame(animateParallax);
}
animateParallax();

// ============ 加载书本数据 ============
async function loadBooks() {
  const results = await Promise.all(
    BOOK_DIRS.map(async dir => {
      try {
        const res = await fetch(`books/${dir}/book-meta.json`);
        if (!res.ok) return null;
        const meta = await res.json();
        return { ...meta, dir };
      } catch(e) { return null; }
    })
  );
  bookData = results.filter(b => b !== null);
  renderHeroBooks();
  renderShelf();
  renderCategories();
}

// ============ Hero 漂浮书本 ============
function renderHeroBooks() {
  for (let i = 0; i < Math.min(3, bookData.length); i++) {
    const b = bookData[i];
    const el = document.getElementById(`fb${i+1}`);
    const titleEl = document.getElementById(`fb${i+1}-title`);
    const subEl = document.getElementById(`fb${i+1}-sub`);
    if (el && titleEl) {
      el.querySelector('.fb-cover').style.background = b.coverGradient || `linear-gradient(135deg, #0a0e1a, ${b.coverColor || '#c9a86a'})`;
      titleEl.textContent = b.title;
      subEl.textContent = b.author || '';
      el.onclick = () => showDetail(b);
      el.style.pointerEvents = 'auto';
      el.style.cursor = 'pointer';
    }
  }
}

// ============ 书架渲染 ============
function renderShelf() {
  const grid = document.getElementById('shelf-grid');
  const filtered = activeCategory === '全部'
    ? bookData
    : bookData.filter(b => b.category === activeCategory);

  grid.innerHTML = filtered.length === 0
    ? '<div style="grid-column:1/-1;text-align:center;color:var(--paper-faint);padding:60px">该分类下暂无书籍</div>'
    : filtered.map(b => {
      const glyph = b.title.charAt(0);
      return `
      <div class="book-card" onclick="showDetail(${JSON.stringify(b).replace(/"/g,'&quot;')})">
        <div class="book-card-cover">
          <div class="cover-inner" style="background:${b.coverGradient || `linear-gradient(135deg,#0a0e1a,${b.coverColor})`}">
            <div class="cover-glyph">${glyph}</div>
            <div class="cover-info">
              <div class="cover-title">${b.title}</div>
              <div class="cover-author">${b.author || ''}</div>
            </div>
          </div>
        </div>
        <div class="book-card-body">
          <div class="book-card-tags">
            ${(b.tags || []).slice(0,3).map(t=>`<span class="book-card-tag">${t}</span>`).join('')}
          </div>
          <div class="book-card-summary">${b.summary || ''}</div>
          <div class="book-card-stats">
            <div class="book-card-stat"><div class="num">${b.chapterCount||0}</div><div class="label">章节</div></div>
            <div class="book-card-stat"><div class="num">${b.gameCount||0}</div><div class="label">练习</div></div>
            <div class="book-card-stat"><div class="num">${b.toolCount||0}</div><div class="label">工具</div></div>
          </div>
        </div>
      </div>`;
    }).join('');
}

// ============ 分类 ============
function renderCategories() {
  const cats = ['全部', ...new Set(bookData.map(b => b.category).filter(Boolean))];
  document.getElementById('shelf-cats').innerHTML = cats.map(c => `
    <button class="shelf-cat ${c === activeCategory ? 'active' : ''}" onclick="selectCat('${c}')">${c}</button>
  `).join('');
}

function selectCat(cat) {
  activeCategory = cat;
  renderCategories();
  renderShelf();
}

// ============ 详情弹窗 ============
function showDetail(b) {
  if (typeof b === 'string') b = JSON.parse(b.replace(/&quot;/g, '"'));
  const box = document.getElementById('detail-box');
  const glyph = b.title.charAt(0);
  box.innerHTML = `
    <button class="detail-close" onclick="closeDetail()">×</button>
    <div class="detail-cover" style="background:${b.coverGradient || `linear-gradient(135deg,#0a0e1a,${b.coverColor})`}">
      <div class="cover-glow"></div>
      <div class="cover-glyph">${glyph}</div>
    </div>
    <div class="detail-body">
      <h3>${b.title}</h3>
      <div class="subtitle">${b.subtitle || ''}</div>
      <div class="author">${b.author || ''}</div>

      <div class="detail-summary">${b.summary || ''}</div>

      <div class="detail-tags">
        ${(b.tags || []).map(t => `<span class="detail-tag">${t}</span>`).join('')}
      </div>

      <div class="detail-stats">
        <div class="detail-stat"><div class="num">${b.chapterCount || 0}</div><div class="label">章节</div></div>
        <div class="detail-stat"><div class="num">${b.gameCount || 0}</div><div class="label">练习</div></div>
        <div class="detail-stat"><div class="num">${b.toolCount || 0}</div><div class="label">工具</div></div>
      </div>

      ${b.features ? `
      <div class="detail-section">
        <div class="detail-section-title">特色功能</div>
        <ul class="detail-features">
          ${b.features.map(f => `<li>${f}</li>`).join('')}
        </ul>
      </div>` : ''}

      ${b.experience ? `
      <div class="detail-section">
        <div class="detail-section-title">阅读体验</div>
        <div class="detail-experience">${b.experience}</div>
      </div>` : ''}

      <button class="detail-enter" onclick="window.open('books/${b.dir}/${b.entry || 'index.html'}','_blank')">
        进 入 阅 读
      </button>
    </div>
  `;
  document.getElementById('detail-modal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detail-modal').classList.remove('show');
  document.body.style.overflow = '';
}

// 点击背景关闭
document.getElementById('detail-modal').addEventListener('click', (e) => {
  if (e.target.id === 'detail-modal') closeDetail();
});
// ESC 关闭
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDetail();
});

// ============ 场景切换 ============
function switchScene(scene) {
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
  document.getElementById(`scene-${scene}`).classList.add('active');
  document.body.style.overflow = scene === 'shelf' ? 'auto' : '';
  // 更新导航激活状态
  document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
  const navLink = document.querySelector(`.nav-link[onclick*="${scene}"]`);
  if (navLink) navLink.classList.add('active');
  window.scrollTo(0, 0);
}

function scrollToFeatures() {
  switchScene('shelf');
}

// ============ 启动 ============
loadBooks();
</script>
</body>
</html>
