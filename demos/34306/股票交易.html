<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSim — 模拟股票交易平台</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root {
    --bg-deep: #08080f;
    --bg-panel: #0f0f1a;
    --bg-card: #141425;
    --border: #1a1a30;
    --border-active: #2a2a48;
    --text-primary: #d8d8e0;
    --text-secondary: #8888a0;
    --text-dim: #555570;
    --green: #00d4aa;
    --green-bg: rgba(0,212,170,0.08);
    --green-glow: rgba(0,212,170,0.25);
    --red: #ff4466;
    --red-bg: rgba(255,68,102,0.08);
    --red-glow: rgba(255,68,102,0.25);
    --accent: #5b7fff;
    --accent-bg: rgba(91,127,255,0.1);
    --gold: #ffb347;
    --radius: 6px;
    --shimmer: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { font-size: 14px; }

  body {
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none; z-index: 9999;
  }

  .app {
    max-width: 1400px;
    margin: 0 auto;
    padding: 12px 16px;
  }

  /* ---- HEADER ---- */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    flex-wrap: wrap; gap: 10px;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem; font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--green), #5ce0c8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim); transition: all 0.3s;
    box-shadow: 0 0 6px var(--text-dim);
  }
  .status-dot.running { background: var(--green); box-shadow: 0 0 10px var(--green-glow); }
  .header-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem; color: var(--text-secondary);
  }
  .header-actions { display: flex; gap: 8px; }

  .btn {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.8rem; font-weight: 500;
    padding: 6px 16px; border: 1px solid var(--border-active);
    border-radius: var(--radius); cursor: pointer;
    transition: all 0.2s; background: var(--bg-card);
    color: var(--text-primary);
    letter-spacing: 0.5px;
  }
  .btn:hover { border-color: var(--accent); background: var(--accent-bg); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #6e8fff; }
  .btn-danger { border-color: var(--red); color: var(--red); }
  .btn-danger:hover { background: var(--red-bg); }

  /* ---- SETTINGS PANEL ---- */
  .settings-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
    transition: max-height 0.4s ease;
  }
  .settings-panel.collapsed { max-height: 0; }
  .settings-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    user-select: none;
  }
  .settings-title {
    font-size: 0.85rem; font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 1px;
  }
  .settings-body {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px; padding: 16px 18px;
  }
  .setting-group label {
    display: block; font-size: 0.75rem; font-weight: 500;
    color: var(--text-secondary); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .setting-group input[type="range"] {
    width: 100%; height: 6px;
    -webkit-appearance: none;
    background: var(--border-active); border-radius: 3px;
    outline: none;
  }
  .setting-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: var(--accent);
    cursor: pointer; border: 2px solid var(--bg-panel);
  }
  .setting-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem; color: var(--accent);
    margin-top: 4px;
  }
  .settings-presets { display: flex; gap: 8px; align-items: flex-end; }
  .preset-btn {
    font-size: 0.7rem; padding: 4px 10px;
    border: 1px solid var(--border-active); border-radius: 3px;
    background: transparent; color: var(--text-secondary);
    cursor: pointer; transition: all 0.2s;
  }
  .preset-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- MAIN GRID ---- */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 12px;
  }

  /* ---- PANELS ---- */
  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 0.75rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--text-secondary);
  }
  .panel-body { padding: 12px 14px; }

  /* ---- QUOTE QUICK ---- */
  .quote-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .quote-main {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex; align-items: center; gap: 16px;
  }
  .quote-price-big {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2.8rem; font-weight: 700;
    line-height: 1;
    transition: color 0.3s;
  }
  .quote-change-info { display: flex; flex-direction: column; gap: 2px; }
  .quote-change {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem; font-weight: 600;
  }
  .quote-change.up { color: var(--green); }
  .quote-change.down { color: var(--red); }
  .quote-change.flat { color: var(--text-secondary); }
  .quote-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }

  .quote-stats {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .quote-stat {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 14px;
    text-align: center;
  }
  .quote-stat .val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem; font-weight: 600;
  }
  .quote-stat .lbl { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }

  /* ---- CHART ---- */
  .chart-container {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 12px;
    height: 200px;
    position: relative;
  }
  .chart-container canvas { width: 100%; height: 100%; }

  /* ---- TRADING ---- */
  .trade-panel {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .trade-side {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    text-align: center;
    transition: border-color 0.2s;
  }
  .trade-side.buy:hover { border-color: var(--green); }
  .trade-side.sell:hover { border-color: var(--red); }
  .trade-label {
    font-size: 0.7rem; text-transform: uppercase;
    letter-spacing: 1.5px; font-weight: 600;
    margin-bottom: 8px;
  }
  .trade-side.buy .trade-label { color: var(--green); }
  .trade-side.sell .trade-label { color: var(--red); }
  .trade-qty {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; margin-bottom: 10px;
  }
  .trade-qty button {
    width: 26px; height: 26px; border-radius: 3px;
    border: 1px solid var(--border-active);
    background: var(--bg-panel);
    color: var(--text-primary);
    font-size: 1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .trade-qty button:hover { border-color: var(--accent); }
  .trade-qty input {
    width: 50px; text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem; font-weight: 600;
    background: var(--bg-panel);
    border: 1px solid var(--border-active);
    border-radius: 3px; color: var(--text-primary);
    padding: 3px 4px;
  }
  .trade-btn {
    width: 100%; padding: 10px; border: none;
    border-radius: var(--radius); font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.85rem; font-weight: 600; cursor: pointer;
    transition: all 0.2s; text-transform: uppercase;
    letter-spacing: 1px;
  }
  .btn-buy { background: var(--green); color: #000; }
  .btn-buy:hover { box-shadow: 0 0 20px var(--green-glow); }
  .btn-sell { background: var(--red); color: #fff; }
  .btn-sell:hover { box-shadow: 0 0 20px var(--red-glow); }
  .btn-buy:disabled, .btn-sell:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .trade-hint {
    font-size: 0.7rem; color: var(--text-dim);
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ---- PORTFOLIO ---- */
  .portfolio-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .portfolio-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .portfolio-card::after {
    content: '';
    position: absolute; top: 0; left: -100%;
    width: 100%; height: 100%;
    background: var(--shimmer);
    animation: shimmer 3s infinite;
  }
  @keyframes shimmer {
    0% { left: -100%; }
    100% { left: 100%; }
  }
  .portfolio-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem; font-weight: 700;
    display: block; margin-bottom: 2px;
    position: relative; z-index: 1;
  }
  .portfolio-lbl {
    font-size: 0.65rem; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.5px;
    position: relative; z-index: 1;
  }
  .portfolio-pnl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    position: relative; z-index: 1;
  }

  /* ---- RIGHT SIDEBAR ---- */
  .right-sidebar { display: flex; flex-direction: column; gap: 12px; }

  /* ---- LOG ---- */
  .log-list {
    max-height: 220px; overflow-y: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    display: flex; flex-direction: column; gap: 2px;
  }
  .log-list::-webkit-scrollbar { width: 4px; }
  .log-list::-webkit-scrollbar-track { background: transparent; }
  .log-list::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 2px; }
  .log-entry {
    padding: 3px 6px; border-radius: 2px;
    display: flex; align-items: center; gap: 6px;
    animation: fadeIn 0.3s ease;
    border-left: 2px solid transparent;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .log-entry.buy { border-left-color: var(--green); background: var(--green-bg); }
  .log-entry.sell { border-left-color: var(--red); background: var(--red-bg); }
  .log-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .log-entry.buy .log-dot { background: var(--green); }
  .log-entry.sell .log-dot { background: var(--red); }
  .log-trader { color: var(--text-secondary); min-width: 45px; }
  .log-action { color: var(--text-dim); min-width: 20px; }
  .log-qty { color: var(--text-primary); min-width: 35px; }
  .log-price { color: var(--text-dim); }
  .log-empty { color: var(--text-dim); text-align: center; padding: 20px; font-size: 0.75rem; }

  /* ---- LEADERBOARD ---- */
  .leaderboard-table {
    width: 100%; border-collapse: collapse;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
  }
  .leaderboard-table th {
    text-align: left; padding: 6px 8px;
    color: var(--text-dim); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    font-size: 0.65rem;
  }
  .leaderboard-table td {
    padding: 5px 8px; border-bottom: 1px solid rgba(26,26,48,0.5);
  }
  .leaderboard-table tr.player-row {
    background: var(--accent-bg); border-radius: 3px;
  }
  .leaderboard-table tr.player-row td { color: var(--accent); font-weight: 600; }
  .leaderboard-table .rank { color: var(--text-dim); text-align: center; width: 30px; }
  .leaderboard-table .rank.top { color: var(--gold); font-weight: 700; }
  .leaderboard-table .pnl-up { color: var(--green); }
  .leaderboard-table .pnl-down { color: var(--red); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 3px; }

  /* Responsive */
  @media (max-width: 900px) {
    .main-grid { grid-template-columns: 1fr; }
    .quote-bar { grid-template-columns: 1fr; }
    .trade-panel { grid-template-columns: 1fr; }
    .quote-price-big { font-size: 2rem; }
  }
  @media (max-width: 600px) {
    .app { padding: 8px; }
    .settings-body { grid-template-columns: 1fr; }
    .portfolio-grid { grid-template-columns: 1fr 1fr; }
    .chart-container { height: 150px; }
    .quote-price-big { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <span class="logo">StockSim</span>
      <span class="status-dot" id="statusDot"></span>
      <span class="header-time" id="headerTime">--</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" id="btnStart">▶ 开始模拟</button>
      <button class="btn" id="btnPause" disabled>⏸ 暂停</button>
      <button class="btn btn-danger" id="btnReset">↺ 重置</button>
      <button class="btn" id="btnSpeed" title="切换速度">⏱ 1x</button>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-panel-header" id="settingsToggle">
      <span class="settings-title">⚙ 参数设置</span>
      <span style="color:var(--text-dim);font-size:0.8rem;">▼</span>
    </div>
    <div class="settings-body">
      <div class="setting-group">
        <label>股票初始价格</label>
        <input type="range" id="initPrice" min="1" max="1000" value="100" step="1">
        <div class="setting-val">¥ <span id="initPriceVal">100.00</span></div>
      </div>
      <div class="setting-group">
        <label>你的初始资金</label>
        <input type="range" id="playerCash" min="1000" max="1000000" value="100000" step="1000">
        <div class="setting-val">¥ <span id="playerCashVal">100,000.00</span></div>
      </div>
      <div class="setting-group">
        <label>每散户初始资金</label>
        <input type="range" id="retailCash" min="1000" max="1000000" value="50000" step="1000">
        <div class="setting-val">¥ <span id="retailCashVal">50,000.00</span></div>
      </div>
      <div class="settings-presets">
        <button class="preset-btn" data-preset="easy">📗 简单模式</button>
        <button class="preset-btn" data-preset="normal">📘 普通模式</button>
        <button class="preset-btn" data-preset="hard">📕 困难模式</button>
        <button class="preset-btn" data-preset="chaos">🔥 混沌模式</button>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main-grid">
    <!-- LEFT -->
    <div class="left-col">
      <!-- QUOTE BAR -->
      <div class="quote-bar">
        <div class="quote-main">
          <div>
            <div class="quote-price-big" id="priceBig" style="color:var(--text-primary)">¥100.00</div>
            <div class="quote-change flat" id="priceChange">+0.00 (0.00%)</div>
          </div>
          <div class="quote-change-info">
            <span class="quote-label">初始价格</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:var(--text-secondary)" id="initPriceDisplay">¥100.00</span>
          </div>
        </div>
        <div class="quote-stats">
          <div class="quote-stat">
            <div class="val" style="color:var(--green)" id="buyVol">0</div>
            <div class="lbl">本周期买入量</div>
          </div>
          <div class="quote-stat">
            <div class="val" style="color:var(--red)" id="sellVol">0</div>
            <div class="lbl">本周期卖出量</div>
          </div>
          <div class="quote-stat">
            <div class="val" id="totalShares">0</div>
            <div class="lbl">市场总流通股</div>
          </div>
          <div class="quote-stat">
            <div class="val" id="tickCount">0</div>
            <div class="lbl">已运行周期</div>
          </div>
        </div>
      </div>

      <!-- CHART -->
      <div class="chart-container">
        <canvas id="chartCanvas"></canvas>
      </div>

      <!-- TRADING -->
      <div class="trade-panel">
        <div class="trade-side buy">
          <div class="trade-label">🟢 买入</div>
          <div class="trade-qty">
            <button onclick="changeBuyQty(-1)">−</button>
            <input type="number" id="buyQty" value="1" min="1" onchange="clampBuyQty()">
            <button onclick="changeBuyQty(1)">+</button>
          </div>
          <button class="trade-btn btn-buy" id="btnBuy" disabled onclick="playerTrade('buy')">
            买入
          </button>
          <div class="trade-hint" id="buyHint">可买 0 股</div>
        </div>
        <div class="trade-side sell">
          <div class="trade-label">🔴 卖出</div>
          <div class="trade-qty">
            <button onclick="changeSellQty(-1)">−</button>
            <input type="number" id="sellQty" value="1" min="1" onchange="clampSellQty()">
            <button onclick="changeSellQty(1)">+</button>
          </div>
          <button class="trade-btn btn-sell" id="btnSell" disabled onclick="playerTrade('sell')">
            卖出
          </button>
          <div class="trade-hint" id="sellHint">持仓 0 股</div>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDEBAR -->
    <div class="right-sidebar">
      <!-- PORTFOLIO -->
      <div class="panel">
        <div class="panel-header">💰 我的资产</div>
        <div class="panel-body">
          <div class="portfolio-grid">
            <div class="portfolio-card">
              <span class="portfolio-val" id="portCash">¥100,000.00</span>
              <span class="portfolio-lbl">现金余额</span>
            </div>
            <div class="portfolio-card">
              <span class="portfolio-val" id="portShares">0</span>
              <span class="portfolio-lbl">持仓股数</span>
            </div>
            <div class="portfolio-card">
              <span class="portfolio-val" id="portValue">¥0.00</span>
              <span class="portfolio-lbl">持仓市值</span>
            </div>
            <div class="portfolio-card">
              <span class="portfolio-val" id="portTotal">¥100,000.00</span>
              <span class="portfolio-lbl">总资产</span>
              <span class="portfolio-pnl flat" id="portPnl" style="margin-top:4px;display:block;">+0.00</span>
            </div>
          </div>
        </div>
      </div>

      <!-- LOG -->
      <div class="panel">
        <div class="panel-header">📋 交易日志</div>
        <div class="panel-body" style="padding:8px 10px;">
          <div class="log-list" id="logList">
            <div class="log-empty">等待市场启动…</div>
          </div>
        </div>
      </div>

      <!-- LEADERBOARD -->
      <div class="panel">
        <div class="panel-header">🏆 排行榜</div>
        <div class="panel-body" style="padding:8px 10px; overflow-x:auto;">
          <table class="leaderboard-table">
            <thead>
              <tr>
                <th>#</th><th>名称</th><th>现金</th><th>持仓</th><th>总资产</th><th>收益</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ===================== STATE =====================
let INIT_PRICE = 100;
let PLAYER_INIT_CASH = 100000;
let RETAIL_INIT_CASH = 50000;

const player = { name: '🏦 你', cash: PLAYER_INIT_CASH, shares: 0, initCash: PLAYER_INIT_CASH };
const retailers = [];
let marketState = {
  stockPrice: INIT_PRICE,
  initPrice: INIT_PRICE,
  priceHistory: [],
  buyVolume: 0,
  sellVolume: 0,
  tickCount: 0,
  isRunning: false,
};
let tradeLog = [];
let intervalId = null;
let speedMultiplier = 1;
const MAX_LOG = 100;
const MAX_HISTORY = 60;

// Init retailers
for (let i = 1; i <= 10; i++) {
  retailers.push({
    id: i,
    name: `散户${String(i).padStart(2,'0')}`,
    cash: RETAIL_INIT_CASH,
    shares: 0,
    initCash: RETAIL_INIT_CASH,
  });
}

// Init price history
marketState.priceHistory = Array(MAX_HISTORY).fill(INIT_PRICE);
marketState.initPrice = INIT_PRICE;
player.initCash = PLAYER_INIT_CASH;

// ===================== UI HELPERS =====================
const $ = (id) => document.getElementById(id);

function fmtMoney(n) {
  if (Math.abs(n) >= 1e6) return '¥' + (n/1e6).toFixed(2) + 'M';
  return '¥' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtNum(n) { return Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 }); }
function fmtPct(n) { return (n >= 0 ? '+' : '') + n.toFixed(2) + '%'; }

function updateClock() {
  const now = new Date();
  $('headerTime').textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
}
setInterval(updateClock, 1000);
updateClock();

// ===================== SLIDERS =====================
$('initPrice').addEventListener('input', function() {
  INIT_PRICE = Number(this.value);
  $('initPriceVal').textContent = INIT_PRICE.toFixed(2);
});
$('playerCash').addEventListener('input', function() {
  PLAYER_INIT_CASH = Number(this.value);
  $('playerCashVal').textContent = PLAYER_INIT_CASH.toLocaleString('en-US', { minimumFractionDigits: 2 });
});
$('retailCash').addEventListener('input', function() {
  RETAIL_INIT_CASH = Number(this.value);
  $('retailCashVal').textContent = RETAIL_INIT_CASH.toLocaleString('en-US', { minimumFractionDigits: 2 });
});

// Settings toggle
let settingsOpen = true;
$('settingsToggle').addEventListener('click', () => {
  settingsOpen = !settingsOpen;
  if (settingsOpen) {
    $('settingsPanel').classList.remove('collapsed');
    $('settingsToggle').querySelector('span:last-child').textContent = '▼';
  } else {
    $('settingsPanel').classList.add('collapsed');
    $('settingsToggle').querySelector('span:last-child').textContent = '▶';
  }
});

// Presets
document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const preset = this.dataset.preset;
    const configs = {
      easy:   { price: 50,  playerCash: 500000, retailCash: 200000 },
      normal: { price: 100, playerCash: 100000, retailCash: 50000 },
      hard:   { price: 200, playerCash: 30000,  retailCash: 100000 },
      chaos:  { price: 500, playerCash: 50000,  retailCash: 50000 },
    };
    const c = configs[preset];
    $('initPrice').value = c.price; $('initPriceVal').textContent = c.price.toFixed(2);
    $('playerCash').value = c.playerCash; $('playerCashVal').textContent = c.playerCash.toLocaleString('en-US', { minimumFractionDigits: 2 });
    $('retailCash').value = c.retailCash; $('retailCashVal').textContent = c.retailCash.toLocaleString('en-US', { minimumFractionDigits: 2 });
    INIT_PRICE = c.price;
    PLAYER_INIT_CASH = c.playerCash;
    RETAIL_INIT_CASH = c.retailCash;
    resetSimulation();
  });
});

// ===================== RESET =====================
function resetSimulation() {
  stopSimulation();
  marketState.stockPrice = INIT_PRICE;
  marketState.initPrice = INIT_PRICE;
  marketState.priceHistory = Array(MAX_HISTORY).fill(INIT_PRICE);
  marketState.buyVolume = 0;
  marketState.sellVolume = 0;
  marketState.tickCount = 0;

  player.cash = PLAYER_INIT_CASH;
  player.shares = 0;
  player.initCash = PLAYER_INIT_CASH;

  retailers.forEach(r => {
    r.cash = RETAIL_INIT_CASH;
    r.shares = 0;
    r.initCash = RETAIL_INIT_CASH;
  });

  tradeLog = [];
  $('logList').innerHTML = '<div class="log-empty">已重置，等待市场启动…</div>';
  $('initPriceDisplay').textContent = '¥' + INIT_PRICE.toFixed(2);
  updateAllUI();
  drawChart();
}

// ===================== SIM ENGINE =====================
function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

function simTick() {
  const p = marketState.stockPrice;
  let buyPressure = 0;
  let sellPressure = 0;

  // Retail trader decisions
  retailers.forEach(r => {
    const roll = Math.random();
    const maxAfford = Math.floor(r.cash / p);
    if (maxAfford <= 0 && r.shares <= 0) return;

    if (roll < 0.55 && maxAfford > 0) {
      // Buy
      const qty = clamp(Math.floor(maxAfford * (0.05 + Math.random() * 0.2)), 1, maxAfford);
      const cost = qty * p;
      if (r.cash >= cost) {
        r.cash -= cost;
        r.shares += qty;
        buyPressure += qty;
        addLog(r.name, 'buy', qty, p);
      }
    } else if (roll < 0.85 && r.shares > 0) {
      // Sell
      const qty = clamp(Math.floor(r.shares * (0.1 + Math.random() * 0.3)), 1, r.shares);
      r.cash += qty * p;
      r.shares -= qty;
      sellPressure += qty;
      addLog(r.name, 'sell', qty, p);
    }
    // else hold
  });

  marketState.buyVolume = buyPressure;
  marketState.sellVolume = sellPressure;

  // Price change calculation
  const netPressure = buyPressure - sellPressure;
  const baseVol = 0.005;
  let changePct = (Math.random() - 0.48) * baseVol; // slight upward bias
  changePct += netPressure * 0.0003;

  // Mean reversion: if price deviates > 30% from initial
  const devFromInit = (p - marketState.initPrice) / marketState.initPrice;
  if (Math.abs(devFromInit) > 0.3) {
    changePct -= devFromInit * 0.002;
  }

  // Momentum (light)
  const hist = marketState.priceHistory.slice(-3);
  if (hist.length === 3 && hist[2] > hist[1] && hist[1] > hist[0]) changePct += 0.001;
  if (hist.length === 3 && hist[2] < hist[1] && hist[1] < hist[0]) changePct -= 0.001;

  const newPrice = clamp(p * (1 + changePct), 0.01, 999999);
  marketState.stockPrice = newPrice;
  marketState.priceHistory.push(newPrice);
  if (marketState.priceHistory.length > MAX_HISTORY) marketState.priceHistory.shift();
  marketState.tickCount++;

  updateAllUI();
  drawChart();
}

function addLog(name, action, qty, price) {
  tradeLog.unshift({ name, action, qty, price, time: Date.now() });
  if (tradeLog.length > MAX_LOG) tradeLog.pop();
}

// ===================== PLAYER TRADE =====================
function playerTrade(action) {
  if (!marketState.isRunning) return;
  const p = marketState.stockPrice;

  if (action === 'buy') {
    const qty = Math.max(1, parseInt($('buyQty').value) || 1);
    const cost = qty * p;
    if (player.cash >= cost) {
      player.cash -= cost;
      player.shares += qty;
      addLog(player.name, 'buy', qty, p);
      // Price boost from player buying
      marketState.stockPrice = clamp(p * (1 + qty * 0.0005), 0.01, 999999);
      updateAllUI();
      drawChart();
    }
  } else {
    const qty = Math.max(1, parseInt($('sellQty').value) || 1);
    if (player.shares >= qty) {
      player.cash += qty * p;
      player.shares -= qty;
      addLog(player.name, 'sell', qty, p);
      marketState.stockPrice = clamp(p * (1 - qty * 0.0005), 0.01, 999999);
      updateAllUI();
      drawChart();
    }
  }
  clampTradeInputs();
}

function changeBuyQty(d) {
  const el = $('buyQty');
  el.value = Math.max(1, (parseInt(el.value) || 1) + d);
  clampTradeInputs();
}
function changeSellQty(d) {
  const el = $('sellQty');
  el.value = Math.max(1, (parseInt(el.value) || 1) + d);
  clampTradeInputs();
}
function clampBuyQty() { clampTradeInputs(); }
function clampSellQty() { clampTradeInputs(); }
function clampTradeInputs() {
  const p = marketState.stockPrice;
  const maxBuy = Math.floor(player.cash / p);
  const elBuy = $('buyQty');
  if (parseInt(elBuy.value) > maxBuy && maxBuy > 0) elBuy.value = maxBuy;
  if (parseInt(elBuy.value) < 1) elBuy.value = 1;
  const elSell = $('sellQty');
  if (parseInt(elSell.value) > player.shares) elSell.value = player.shares;
  if (parseInt(elSell.value) < 1) elSell.value = 1;
  updateTradeButtons();
}

function updateTradeButtons() {
  const p = marketState.stockPrice;
  const maxBuy = Math.floor(player.cash / p);
  $('buyHint').textContent = `可买 ${maxBuy} 股`;
  $('sellHint').textContent = `持仓 ${player.shares} 股`;
  $('btnBuy').disabled = maxBuy <= 0 || !marketState.isRunning;
  $('btnSell').disabled = player.shares <= 0 || !marketState.isRunning;
}

// ===================== UI UPDATE =====================
function updateAllUI() {
  const p = marketState.stockPrice;
  const initP = marketState.initPrice;
  const change = p - initP;
  const changePct = initP > 0 ? (change / initP) * 100 : 0;

  // Price display
  const priceEl = $('priceBig');
  priceEl.textContent = '¥' + p.toFixed(2);
  if (changePct > 0.01) {
    priceEl.style.color = 'var(--green)';
    $('priceChange').className = 'quote-change up';
    $('priceChange').textContent = `+${change.toFixed(2)} (+${changePct.toFixed(2)}%)`;
  } else if (changePct < -0.01) {
    priceEl.style.color = 'var(--red)';
    $('priceChange').className = 'quote-change down';
    $('priceChange').textContent = `${change.toFixed(2)} (${changePct.toFixed(2)}%)`;
  } else {
    priceEl.style.color = 'var(--text-primary)';
    $('priceChange').className = 'quote-change flat';
    $('priceChange').textContent = `${change >= 0 ? '+' : ''}${change.toFixed(2)} (${changePct.toFixed(2)}%)`;
  }

  $('initPriceDisplay').textContent = '¥' + initP.toFixed(2);
  $('buyVol').textContent = marketState.buyVolume;
  $('sellVol').textContent = marketState.sellVolume;

  let totalCirculating = player.shares;
  retailers.forEach(r => totalCirculating += r.shares);
  $('totalShares').textContent = totalCirculating;
  $('tickCount').textContent = marketState.tickCount;

  // Portfolio
  const portValue = player.shares * p;
  const portTotal = player.cash + portValue;
  $('portCash').textContent = fmtMoney(player.cash);
  $('portShares').textContent = player.shares;
  $('portValue').textContent = fmtMoney(portValue);
  $('portTotal').textContent = fmtMoney(portTotal);
  const pnl = portTotal - player.initCash;
  const pnlEl = $('portPnl');
  pnlEl.textContent = (pnl >= 0 ? '+' : '') + fmtMoney(pnl);
  pnlEl.className = 'portfolio-pnl ' + (pnl > 0 ? 'up' : pnl < 0 ? 'down' : 'flat');
  if (pnl > 0) pnlEl.style.color = 'var(--green)';
  else if (pnl < 0) pnlEl.style.color = 'var(--red)';
  else pnlEl.style.color = 'var(--text-dim)';

  updateTradeButtons();

  // Log
  renderLog();

  // Leaderboard
  renderLeaderboard();
}

function renderLog() {
  const container = $('logList');
  if (tradeLog.length === 0) {
    container.innerHTML = '<div class="log-empty">暂无交易记录</div>';
    return;
  }
  const visible = tradeLog.slice(0, 50);
  container.innerHTML = visible.map(t => {
    const cls = t.action === 'buy' ? 'buy' : 'sell';
    const actionText = t.action === 'buy' ? '买入' : '卖出';
    return `<div class="log-entry ${cls}">
      <span class="log-dot"></span>
      <span class="log-trader">${t.name}</span>
      <span class="log-action">${actionText}</span>
      <span class="log-qty">${t.qty}股</span>
      <span class="log-price">@${t.price.toFixed(2)}</span>
    </div>`;
  }).join('');
}

function renderLeaderboard() {
  const p = marketState.stockPrice;
  const all = [
    { name: player.name, cash: player.cash, shares: player.shares, initCash: player.initCash, isPlayer: true },
    ...retailers.map(r => ({ name: r.name, cash: r.cash, shares: r.shares, initCash: r.initCash, isPlayer: false })),
  ];

  all.sort((a, b) => (b.cash + b.shares * p) - (a.cash + a.shares * p));

  $('leaderboardBody').innerHTML = all.map((a, i) => {
    const total = a.cash + a.shares * p;
    const pnlPct = a.initCash > 0 ? ((total - a.initCash) / a.initCash * 100) : 0;
    const rankCls = i < 3 ? 'top' : '';
    const rowCls = a.isPlayer ? 'player-row' : '';
    const pnlCls = pnlPct > 0 ? 'pnl-up' : pnlPct < 0 ? 'pnl-down' : '';
    return `<tr class="${rowCls}">
      <td class="rank ${rankCls}">${i+1}</td>
      <td>${a.isPlayer ? '🏦 你' : a.name}</td>
      <td>${fmtMoney(a.cash)}</td>
      <td>${a.shares}股</td>
      <td>${fmtMoney(total)}</td>
      <td class="${pnlCls}">${fmtPct(pnlPct)}</td>
    </tr>`;
  }).join('');
}

// ===================== CHART =====================
function drawChart() {
  const canvas = $('chartCanvas');
  const container = canvas.parentElement;
  canvas.width = container.clientWidth - 24;
  canvas.height = container.clientHeight - 24;

  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const data = marketState.priceHistory;
  const initP = marketState.initPrice;

  // Background
  ctx.fillStyle = '#141425';
  ctx.fillRect(0, 0, W, H);

  // Grid lines
  ctx.strokeStyle = '#1a1a30';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 4; i++) {
    const y = (H / 4) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Init price line
  const prices = data;
  let minP = Math.min(...prices) * 0.98;
  let maxP = Math.max(...prices) * 1.02;
  const range = maxP - minP || 1;

  const initY = H - ((initP - minP) / range) * H;
  ctx.strokeStyle = '#333355';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(0, initY); ctx.lineTo(W, initY); ctx.stroke();
  ctx.setLineDash([]);

  // Price line
  if (data.length < 2) return;
  const stepX = W / (data.length - 1);
  ctx.strokeStyle = '#5b7fff';
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(91,127,255,0.3)';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = i * stepX;
    const y = H - ((v - minP) / range) * H;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Gradient fill
  const lastX = (data.length - 1) * stepX;
  ctx.lineTo(lastX, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, 'rgba(91,127,255,0.15)');
  grad.addColorStop(1, 'rgba(91,127,255,0.0)');
  ctx.fillStyle = grad;
  ctx.fill();

  // Last price dot
  const lastVal = data[data.length - 1];
  const dotY = H - ((lastVal - minP) / range) * H;
  ctx.fillStyle = '#5b7fff';
  ctx.beginPath(); ctx.arc(lastX, dotY, 4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

// ===================== CONTROL =====================
function startSimulation() {
  if (marketState.isRunning) return;
  if (marketState.tickCount === 0) {
    // First start: apply current settings
    marketState.stockPrice = INIT_PRICE;
    marketState.initPrice = INIT_PRICE;
    player.cash = PLAYER_INIT_CASH;
    player.shares = 0;
    player.initCash = PLAYER_INIT_CASH;
    retailers.forEach(r => {
      r.cash = RETAIL_INIT_CASH;
      r.shares = 0;
      r.initCash = RETAIL_INIT_CASH;
    });
    marketState.priceHistory = Array(MAX_HISTORY).fill(INIT_PRICE);
    $('initPriceDisplay').textContent = '¥' + INIT_PRICE.toFixed(2);
  }

  marketState.isRunning = true;
  $('statusDot').classList.add('running');
  $('btnStart').disabled = true;
  $('btnPause').disabled = false;

  const baseInterval = 800;
  clearInterval(intervalId);
  intervalId = setInterval(simTick, Math.max(200, baseInterval / speedMultiplier));
  updateAllUI();
  drawChart();
}

function stopSimulation() {
  marketState.isRunning = false;
  $('statusDot').classList.remove('running');
  $('btnStart').disabled = false;
  $('btnPause').disabled = true;
  clearInterval(intervalId);
  intervalId = null;
  updateAllUI();
}

$('btnStart').addEventListener('click', startSimulation);
$('btnPause').addEventListener('click', stopSimulation);
$('btnReset').addEventListener('click', resetSimulation);

$('btnSpeed').addEventListener('click', function() {
  const speeds = [0.5, 1, 2, 4];
  const labels = ['0.5x', '1x', '2x', '4x'];
  let idx = speeds.indexOf(speedMultiplier);
  idx = (idx + 1) % speeds.length;
  speedMultiplier = speeds[idx];
  this.textContent = '⏱ ' + labels[idx];
  if (marketState.isRunning) {
    clearInterval(intervalId);
    intervalId = setInterval(simTick, Math.max(200, 800 / speedMultiplier));
  }
});

// ===================== INIT =====================
function initUI() {
  $('initPriceVal').textContent = INIT_PRICE.toFixed(2);
  $('playerCashVal').textContent = PLAYER_INIT_CASH.toLocaleString('en-US', { minimumFractionDigits: 2 });
  $('retailCashVal').textContent = RETAIL_INIT_CASH.toLocaleString('en-US', { minimumFractionDigits: 2 });
  $('initPriceDisplay').textContent = '¥' + INIT_PRICE.toFixed(2);
  updateAllUI();
  renderLeaderboard();
  drawChart();

  // Resize chart on window resize
  window.addEventListener('resize', drawChart);
}

initUI();
console.log('🚀 StockSim 模拟股票交易平台已就绪');
console.log('   设置参数 → 点击"开始模拟" → 观察市场变化 → 手动买卖');
</script>
