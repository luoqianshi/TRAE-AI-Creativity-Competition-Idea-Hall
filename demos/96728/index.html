<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>课研AI</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f8fafc; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 1000px; margin: 0 auto; }
        button { padding: 12px 24px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; }
        #result { margin-top: 20px; line-height: 1.8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>课研AI - 智能教学设计助手</h1>
        
        <p>年级: <select id="grade"><option>小学三年级</option><option>初中二年级</option></select></p>
        <p>科目: <select id="subject"><option>语文</option><option>数学</option></select></p>
        <p>内容: <input id="content" value="荷塘月色" style="width:80%; padding:8px;"></p>
        
        <button onclick="generate()">🚀 生成教案</button>
        
        <div id="result"></div>
    </div>

    <script>
        function generate() {
            const content = document.getElementById('content').value;
            document.getElementById('result').innerHTML = `
                <h2>教案：${content}</h2>
                <h3>教学目标</h3>
                <ul><li>掌握${content}的核心内容</li><li>提升阅读理解能力</li></ul>
                <h3>教学过程</h3>
                <p>1. 导入 2. 讲解 3. 练习 4. 总结</p>
                <p><strong>Demo 已生成！</strong> 可以拿这个去参赛了。</p>
            `;
        }
    </script>
</body>
</html>
