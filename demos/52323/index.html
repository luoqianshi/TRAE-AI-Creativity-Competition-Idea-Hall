<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>疲劳驾驶预警助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f1923;color:#e0e6ed;min-height:100vh}
.header{background:linear-gradient(135deg,#1a3a5c,#0f2840);text-align:center;padding:28px 16px;border-bottom:2px solid #2196f3}
.header h1{font-size:24px;margin-bottom:6px;color:#64b5f6}
.header p{font-size:13px;color:#90caf9;opacity:.85}
.container{max-width:600px;margin:0 auto;padding:16px}
.card{background:#1a2a3a;border-radius:12px;padding:18px;margin-bottom:14px;border:1px solid #263850}
.card h2{font-size:16px;margin-bottom:14px;color:#64b5f6;display:flex;align-items:center;gap:8px}
.question{margin-bottom:16px}
.question label{display:block;font-size:14px;margin-bottom:8px;color:#b0bec5}
.radio-group{display:flex;flex-wrap:wrap;gap:8px}
.radio-btn{padding:8px 16px;border:2px solid #37474f;border-radius:20px;background:transparent;color:#b0bec5;cursor:pointer;font-size:13px;transition:all .2s;user-select:none}
.radio-btn:hover{border-color:#2196f3;color:#fff}
.radio-btn.selected{background:#2196f3;color:#fff;border-color:#2196f3}
.btn{padding:12px 32px;border:none;border-radius:24px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;width:100%}
.btn-primary{background:linear-gradient(135deg,#2196f3,#1976d2);color:#fff}
.btn-primary:hover{box-shadow:0 4px 16px rgba(33,150,243,.4);transform:translateY(-1px)}
.result-area{display:none}
.level-indicator{text-align:center;padding:20px;margin-bottom:16px;border-radius:12px}
.level-number{font-size:48px;font-weight:700}
.level-label{font-size:16px;margin-top:4px}
.level-1{background:linear-gradient(135deg,#1b5e20,#2e7d32);color:#a5d6a7}
.level-2{background:linear-gradient(135deg,#e65100,#f57c00);color:#ffe0b2}
.level-3{background:linear-gradient(135deg,#b71c1c,#d32f2f);color:#ffcdd2}
.suggestion{background:#1a2a3a;border-radius:10px;padding:14px;margin-bottom:10px;border-left:4px solid #2196f3}
.suggestion.urgent{border-left-color:#f44336;background:#2a1a1a}
.suggestion h3{font-size:14px;margin-bottom:6px;color:#90caf9}
.suggestion p{font-size:13px;line-height:1.6;color:#b0bec5}
.action-card{background:#1a2a3a;border-radius:10px;padding:14px;margin-bottom:10px;border:1px solid #263850}
.action-card h3{font-size:14px;margin-bottom:8px;color:#64b5f6}
.action-card .steps{font-size:13px;line-height:1.8;color:#b0bec5}
.action-card .steps span{display:inline-block;background:#2196f3;color:#fff;width:20px;height:20px;border-radius:50%;text-align:center;line-height:20px;font-size:11px;margin-right:6px}
.warning-box{background:#4a1a1a;border:2px solid #f44336;border-radius:12px;padding:18px;text-align:center;margin-bottom:14px;display:none}
.warning-box h3{color:#f44336;font-size:18px;margin-bottom:6px}
.warning-box p{color:#ffcdd2;font-size:14px}
.timer-section{text-align:center;padding:16px}
.timer-display{font-size:36px;font-weight:700;color:#64b5f6;font-variant-numeric:tabular-nums}
.timer-label{font-size:13px;color:#90caf9;margin-top:4px}
.timer-btns{display:flex;gap:10px;justify-content:center;margin-top:12px}
.timer-btn{padding:8px 20px;border:2px solid #37474f;border-radius:20px;background:transparent;color:#b0bec5;cursor:pointer;font-size:13px;transition:all .2s}
.timer-btn:hover{border-color:#2196f3;color:#fff}
.timer-btn.active{background:#2196f3;color:#fff;border-color:#2196f3}
</style>
</head>
<body>

<div class="header">
  <h1>🚗 疲劳驾驶预警助手</h1>
  <p>评估疲劳等级，科学提神，安全到家</p>
</div>

<div class="container">
  <div id="assessPanel">
    <div class="card">
      <h2>📋 快速疲劳评估</h2>
      <div class="question">
        <label>1. 你已经连续驾驶多久了？</label>
        <div class="radio-group" data-q="driveTime">
          <button class="radio-btn" data-v="1" onclick="select(this)">不到1小时</button>
          <button class="radio-btn" data-v="2" onclick="select(this)">1-2小时</button>
          <button class="radio-btn" data-v="3" onclick="select(this)">2-3小时</button>
          <button class="radio-btn" data-v="4" onclick="select(this)">3-4小时</button>
          <button class="radio-btn" data-v="5" onclick="select(this)">4小时以上</button>
        </div>
      </div>
      <div class="question">
        <label>2. 你现在的困倦程度？</label>
        <div class="radio-group" data-q="drowsy">
          <button class="radio-btn" data-v="1" onclick="select(this)">精神很好</button>
          <button class="radio-btn" data-v="2" onclick="select(this)">有点犯困</button>
          <button class="radio-btn" data-v="3" onclick="select(this)">眼皮发沉</button>
          <button class="radio-btn" data-v="4" onclick="select(this)">频繁点头</button>
          <button class="radio-btn" data-v="5" onclick="select(this)">几乎睁不开眼</button>
        </div>
      </div>
      <div class="question">
        <label>3. 是否夜间行车？</label>
        <div class="radio-group" data-q="night">
          <button class="radio-btn" data-v="1" onclick="select(this)">白天</button>
          <button class="radio-btn" data-v="2" onclick="select(this)">傍晚</button>
          <button class="radio-btn" data-v="3" onclick="select(this)">深夜</button>
        </div>
      </div>
      <div class="question">
        <label>4. 昨晚睡了多久？</label>
        <div class="radio-group" data-q="sleep">
          <button class="radio-btn" data-v="1" onclick="select(this)">7小时以上</button>
          <button class="radio-btn" data-v="2" onclick="select(this)">5-7小时</button>
          <button class="radio-btn" data-v="3" onclick="select(this)">3-5小时</button>
          <button class="radio-btn" data-v="4" onclick="select(this)">不到3小时</button>
        </div>
      </div>
      <div class="question">
        <label>5. 是否午饭后驾驶？</label>
        <div class="radio-group" data-q="afterLunch">
          <button class="radio-btn" data-v="1" onclick="select(this)">否</button>
          <button class="radio-btn" data-v="2" onclick="select(this)">是</button>
        </div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="assess()">🔍 评估疲劳等级</button>
  </div>

  <div class="result-area" id="resultArea">
    <div class="warning-box" id="warningBox">
      <h3>⚠️ 危险！请立即停车休息！</h3>
      <p>你已处于严重疲劳状态，继续驾驶极度危险！<br>请就近寻找服务区或安全区域停车休息！</p>
    </div>
    <div class="level-indicator" id="levelIndicator">
      <div class="level-number" id="levelNumber"></div>
      <div class="level-label" id="levelLabel"></div>
    </div>
    <div class="card">
      <h2>💡 提神建议</h2>
      <div id="suggestions"></div>
    </div>
    <div class="card">
      <h2>🤸 车内提神动作</h2>
      <div id="actions"></div>
    </div>
    <div class="card">
      <h2>⏱️ 驾驶休息计时器</h2>
      <div class="timer-section">
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div class="timer-label" id="timerLabel">建议休息时长</div>
        <div class="timer-btns">
          <button class="timer-btn" onclick="startTimer()">开始计时</button>
          <button class="timer-btn" onclick="resetTimer()">重置</button>
        </div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="reassess()" style="margin-top:8px">🔄 重新评估</button>
  </div>
</div>

<script>
const answers = {};
let timerInterval = null;
let timerSeconds = 0;

function select(el) {
  const group = el.parentElement;
  group.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  answers[group.dataset.q] = parseInt(el.dataset.v);
}

function assess() {
  if (Object.keys(answers).length < 5) {
    alert('请完成所有评估项');
    return;
  }
  const score = answers.driveTime * 2 + answers.drowsy * 3 + answers.night * 1.5 + answers.sleep * 1.5 + answers.afterLunch * 1;
  let level, label, cls;
  if (score <= 10) { level = 1; label = '轻度疲劳 — 注意保持'; cls = 'level-1'; }
  else if (score <= 18) { level = 2; label = '中度疲劳 — 建议休息'; cls = 'level-2'; }
  else { level = 3; label = '重度疲劳 — 立即停车！'; cls = 'level-3'; }

  document.getElementById('levelNumber').textContent = level;
  document.getElementById('levelLabel').textContent = label;
  document.getElementById('levelIndicator').className = 'level-indicator ' + cls;
  document.getElementById('warningBox').style.display = level === 3 ? 'block' : 'none';

  const suggestionsData = {
    1: [
      { title: '保持良好状态', text: '当前状态尚可，但不要掉以轻心。建议每驾驶2小时主动休息15分钟，打开车窗保持空气流通。', urgent: false },
      { title: '提前规划休息点', text: '查看前方服务区位置，在疲劳感加重前主动停车，不要等到犯困才找地方。', urgent: false },
      { title: '适当补充水分', text: '小口喝水保持身体水分，避免一次性大量饮水导致频繁如厕。', urgent: false }
    ],
    2: [
      { title: '尽快寻找休息区', text: '你已处于中度疲劳，反应速度明显下降。请在30分钟内找到服务区或安全区域停车休息15-20分钟。', urgent: true },
      { title: '短睡恢复法', text: '停车后设置15-20分钟闹钟，闭眼小睡。超过30分钟会进入深度睡眠，醒来反而更困。', urgent: false },
      { title: '咖啡小睡法', text: '喝一杯咖啡后立即小睡15分钟，醒来时咖啡因刚好起效，提神效果翻倍。', urgent: false },
      { title: '开窗通风+嚼口香糖', text: '打开车窗让新鲜空气进入，嚼薄荷味口香糖刺激面部神经，暂时缓解困意。', urgent: false }
    ],
    3: [
      { title: '🛑 立即停车！', text: '你已处于极度疲劳状态，继续驾驶随时可能发生事故！请立即打开双闪，就近寻找安全区域停车。哪怕停在应急车道也比继续开强！', urgent: true },
      { title: '必须休息30分钟以上', text: '重度疲劳需要至少30分钟的深度休息。不要心存侥幸，疲劳驾驶的事故率是正常驾驶的6倍。', urgent: true },
      { title: '联系他人', text: '如果可能，联系家人朋友告知你的位置和状况。如果实在无法继续驾驶，考虑代驾或在车内过夜。', urgent: false },
      { title: '不要依赖提神手段', text: '任何提神方法都无法替代休息！咖啡、红牛只是暂时掩盖困意，药效过后疲劳会加倍袭来。', urgent: true }
    ]
  };

  const actionsData = {
    1: [
      { title: '深呼吸提神法', steps: ['鼻子深吸气4秒', '屏住呼吸4秒', '嘴巴缓慢呼气6秒', '重复5次'] },
      { title: '肩颈放松', steps: ['双肩向上耸起保持5秒', '突然放松落下', '头部缓慢左右转动各3次', '重复2组'] }
    ],
    2: [
      { title: '穴位按压提神', steps: ['用拇指按压太阳穴（眉梢与外眼角中间后方凹陷处）', '顺时针揉压20秒', '按压风池穴（后脑勺两侧凹陷处）20秒', '按压合谷穴（虎口处）20秒'] },
      { title: '面部刺激法', steps: ['双手搓热捂住面部5秒', '用指尖轻敲头皮从前到后10次', '用力闭眼再睁大重复5次', '用冷水（如有）拍打面部和后颈'] },
      { title: '车内拉伸', steps: ['等红灯时：双手交叉向前推拉伸背部', '单手抓住方向盘，身体向对侧拉伸', '脚踝做画圈运动各10次', '收缩腹部肌肉保持10秒再放松'] }
    ],
    3: [
      { title: '紧急提神（停车后）', steps: ['下车走动，深呼吸新鲜空气', '用冷水洗脸和手腕内侧', '做10个深蹲促进血液循环', '按压人中穴（鼻唇沟中点）1分钟'] },
      { title: '安全停车检查', steps: ['打开双闪警示灯', '将车停在安全区域（服务区优先）', '锁好车门，座椅调至舒适角度', '设置闹钟，闭眼休息'] }
    ]
  };

  const restMinutes = level === 1 ? 15 : level === 2 ? 20 : 30;
  document.getElementById('timerLabel').textContent = `建议休息 ${restMinutes} 分钟`;

  let sugHtml = '';
  suggestionsData[level].forEach(s => {
    sugHtml += `<div class="suggestion${s.urgent ? ' urgent' : ''}"><h3>${s.title}</h3><p>${s.text}</p></div>`;
  });
  document.getElementById('suggestions').innerHTML = sugHtml;

  let actHtml = '';
  actionsData[level].forEach(a => {
    actHtml += `<div class="action-card"><h3>${a.title}</h3><div class="steps">`;
    a.steps.forEach((s, i) => { actHtml += `<div><span>${i + 1}</span>${s}</div>`; });
    actHtml += '</div></div>';
  });
  document.getElementById('actions').innerHTML = actHtml;

  document.getElementById('assessPanel').style.display = 'none';
  document.getElementById('resultArea').style.display = 'block';
  window.scrollTo(0, 0);
}

function reassess() {
  Object.keys(answers).forEach(k => delete answers[k]);
  document.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('assessPanel').style.display = 'block';
  document.getElementById('resultArea').style.display = 'none';
  resetTimer();
}

function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    timerSeconds++;
    const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
    const s = String(timerSeconds % 60).padStart(2, '0');
    document.getElementById('timerDisplay').textContent = `${m}:${s}`;
  }, 1000);
}

function resetTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timerSeconds = 0;
  document.getElementById('timerDisplay').textContent = '00:00';
}
</script>
</body>
</html>
