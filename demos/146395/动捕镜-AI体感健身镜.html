<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动捕镜 · AI体感健身镜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --neon-g:#39ff14;--neon-p:#ff00ff;--neon-r:#ff3030;
  --neon-c:#00ffff;--neon-y:#ffd700;
  --bg:#06080a;--panel:rgba(10,14,18,0.85);
  --border-g:rgba(57,255,20,0.3);--border-p:rgba(255,0,255,0.3);
}
body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg);min-height:100vh;color:#c8d0d8;
  overflow-x:hidden;position:relative;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(rgba(57,255,20,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(57,255,20,0.03) 1px,transparent 1px);
  background-size:50px 50px;
}
.grid-floor{
  position:fixed;bottom:0;left:0;right:0;height:45%;
  background:
    linear-gradient(rgba(57,255,20,0.12) 1px,transparent 1px),
    linear-gradient(90deg,rgba(57,255,20,0.12) 1px,transparent 1px);
  background-size:60px 60px;
  transform:perspective(400px) rotateX(62deg);
  transform-origin:bottom;opacity:0.6;z-index:0;
  animation:gridMove 2.5s linear infinite;
  mask-image:linear-gradient(to top,rgba(0,0,0,1),transparent 80%);
  -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,1),transparent 80%);
}
@keyframes gridMove{from{background-position:0 0;}to{background-position:0 60px;}}
.glow-orb{
  position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  filter:blur(60px);
}
.glow-orb.g1{top:10%;left:5%;width:300px;height:300px;background:rgba(57,255,20,0.08);animation:orbFloat1 8s ease-in-out infinite;}
.glow-orb.g2{bottom:10%;right:5%;width:350px;height:350px;background:rgba(255,0,255,0.06);animation:orbFloat2 10s ease-in-out infinite;}
@keyframes orbFloat1{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,-30px);}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0);}50%{transform:translate(-40px,30px);}}

.container{
  position:relative;z-index:1;max-width:1340px;margin:0 auto;padding:28px 24px 48px;
}

/* ===== Header ===== */
.header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;flex-wrap:wrap;gap:16px;
}
.header-left{display:flex;align-items:center;gap:16px;}
.logo-mark{
  width:48px;height:48px;border-radius:12px;
  background:linear-gradient(135deg,rgba(57,255,20,0.15),rgba(255,0,255,0.15));
  border:1px solid var(--border-g);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 20px rgba(57,255,20,0.2);
}
.logo-mark svg{width:28px;height:28px;}
.header h1{
  font-size:28px;font-weight:900;letter-spacing:4px;
  background:linear-gradient(90deg,var(--neon-g),var(--neon-c),var(--neon-p));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.header h1 small{
  font-size:13px;font-weight:500;letter-spacing:2px;
  background:none;-webkit-background-clip:initial;color:#5a6a78;
  display:block;margin-top:2px;
}
.header-right{display:flex;align-items:center;gap:12px;}
.live-badge{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;background:rgba(255,0,255,0.08);
  border:1px solid var(--border-p);border-radius:24px;
  font-size:13px;color:var(--neon-p);font-weight:600;
}
.live-dot{
  width:8px;height:8px;border-radius:50%;background:var(--neon-p);
  box-shadow:0 0 10px var(--neon-p);animation:liveBlink 1.2s infinite;
}
@keyframes liveBlink{0%,100%{opacity:1;}50%{opacity:0.3;}}
.hr-badge{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;background:rgba(255,48,48,0.08);
  border:1px solid rgba(255,48,48,0.3);border-radius:24px;
  font-size:13px;color:var(--neon-r);font-weight:600;
  font-family:monospace;
}
.hr-icon{animation:heartBeat 1s ease-in-out infinite;}
@keyframes heartBeat{0%,100%{transform:scale(1);}15%{transform:scale(1.25);}30%{transform:scale(1);}45%{transform:scale(1.15);}}

/* ===== Main Grid ===== */
.main-grid{
  display:grid;grid-template-columns:260px 1fr 290px;gap:18px;margin-bottom:20px;
}
@media(max-width:1000px){.main-grid{grid-template-columns:1fr;}}

/* ===== Courses Panel ===== */
.panel{
  background:var(--panel);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:16px;padding:22px 20px;
}
.courses-panel{border:1px solid var(--border-g);box-shadow:0 0 30px rgba(57,255,20,0.06);}
.panel-title{
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--neon-g);letter-spacing:2px;
  margin-bottom:18px;text-transform:uppercase;font-weight:700;
}
.panel-title .dot{width:6px;height:6px;border-radius:50%;background:var(--neon-g);box-shadow:0 0 8px var(--neon-g);}
.panel-title .line{flex:1;height:1px;background:linear-gradient(90deg,rgba(57,255,20,0.3),transparent);}
.course-item{
  padding:14px 16px;background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.06);border-radius:12px;
  margin-bottom:10px;cursor:pointer;transition:all .3s;
  position:relative;overflow:hidden;
}
.course-item::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--neon-g);border-radius:3px;
  transform:scaleY(0);transition:transform .3s;
}
.course-item:hover{
  background:rgba(57,255,20,0.06);
  border-color:rgba(57,255,20,0.3);
  transform:translateX(4px);
}
.course-item.active{
  background:rgba(57,255,20,0.1);
  border-color:var(--neon-g);
  box-shadow:0 0 20px rgba(57,255,20,0.15);
}
.course-item.active::before{transform:scaleY(1);}
.course-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.course-icon{
  width:32px;height:32px;border-radius:8px;
  background:rgba(57,255,20,0.1);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.course-icon svg{width:18px;height:18px;color:var(--neon-g);}
.course-name{font-size:14px;font-weight:700;color:#e0e6ec;flex:1;}
.course-diff{display:flex;gap:2px;}
.course-diff span{font-size:10px;color:var(--neon-y);}
.course-diff span.off{color:#333;}
.course-meta{font-size:11px;color:#5a6a78;display:flex;gap:12px;padding-left:42px;}
.course-meta span{display:flex;align-items:center;gap:4px;}
.course-meta span::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--neon-g);opacity:0.5;}

/* ===== Mirror Panel ===== */
.mirror-panel{
  background:rgba(4,6,8,0.7);
  border:1px solid var(--border-g);
  border-radius:16px;padding:20px;
  position:relative;overflow:hidden;
  min-height:580px;
  box-shadow:0 0 40px rgba(57,255,20,0.08),inset 0 0 60px rgba(0,0,0,0.5);
}
/* Corner brackets */
.corner{position:absolute;width:24px;height:24px;border-color:var(--neon-g);z-index:6;}
.corner.tl{top:10px;left:10px;border-top:2px solid;border-left:2px solid;border-radius:6px 0 0 0;}
.corner.tr{top:10px;right:10px;border-top:2px solid;border-right:2px solid;border-radius:0 6px 0 0;}
.corner.bl{bottom:10px;left:10px;border-bottom:2px solid;border-left:2px solid;border-radius:0 0 0 6px;}
.corner.br{bottom:10px;right:10px;border-bottom:2px solid;border-right:2px solid;border-radius:0 0 6px 0;}
/* Scan line */
.scan-line{
  position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(57,255,20,0.6),transparent);
  z-index:4;animation:scanMove 4s linear infinite;
}
@keyframes scanMove{0%{top:0;}100%{top:100%;}}
.mirror-hud{
  position:absolute;top:14px;left:44px;right:44px;
  display:flex;justify-content:space-between;
  font-size:10px;color:var(--neon-g);font-family:monospace;z-index:5;
  letter-spacing:1px;
}
.hud-item{display:flex;align-items:center;gap:5px;opacity:0.7;}
.hud-item .blip{width:5px;height:5px;border-radius:50%;background:var(--neon-g);animation:liveBlink 1.5s infinite;}
/* Center crosshair */
.crosshair{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:80px;height:80px;z-index:3;opacity:0.15;pointer-events:none;
}
.crosshair::before,.crosshair::after{
  content:"";position:absolute;background:var(--neon-g);
}
.crosshair::before{top:50%;left:0;right:0;height:1px;transform:translateY(-50%);}
.crosshair::after{left:50%;top:0;bottom:0;width:1px;transform:translateX(-50%);}

.skeleton-stage{
  position:relative;width:100%;height:540px;
  display:flex;align-items:center;justify-content:center;z-index:2;
}
#skeletonSvg{
  filter:drop-shadow(0 0 10px rgba(57,255,20,0.5));
}
.bone{stroke:var(--neon-g);stroke-width:3.5;stroke-linecap:round;fill:none;transition:stroke .3s,filter .3s;}
.bone.warn{stroke:var(--neon-r);filter:drop-shadow(0 0 10px var(--neon-r));animation:warnFlash .4s infinite;}
@keyframes warnFlash{0%,100%{opacity:1;}50%{opacity:0.5;}}
.joint{fill:var(--neon-p);filter:drop-shadow(0 0 8px var(--neon-p));transition:fill .3s,filter .3s;}
.joint.warn{fill:var(--neon-r);filter:drop-shadow(0 0 10px var(--neon-r));}
.joint.head{fill:rgba(57,255,20,0.15);stroke:var(--neon-g);stroke-width:2.5;}
.trail{stroke:var(--neon-g);stroke-width:1.5;opacity:0.15;fill:none;stroke-linecap:round;}

.action-label{
  position:absolute;bottom:24px;left:50%;
  transform:translateX(-50%);
  padding:10px 28px;
  background:rgba(57,255,20,0.1);
  border:1px solid var(--neon-g);border-radius:24px;
  font-size:16px;font-weight:700;color:var(--neon-g);
  letter-spacing:4px;text-shadow:0 0 12px var(--neon-g);
  z-index:5;transition:all .3s;
  backdrop-filter:blur(8px);
}
.action-label.idle{color:#5a6a78;border-color:rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);text-shadow:none;}

/* ===== Scores Panel ===== */
.scores-panel{border:1px solid var(--border-p);box-shadow:0 0 30px rgba(255,0,255,0.06);}
.scores-panel .panel-title{color:var(--neon-p);}
.scores-panel .panel-title .dot{background:var(--neon-p);box-shadow:0 0 8px var(--neon-p);}
.scores-panel .panel-title .line{background:linear-gradient(90deg,rgba(255,0,255,0.3),transparent);}

.score-item{margin-bottom:18px;}
.score-label{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;margin-bottom:8px;
}
.score-label .name{color:#9aa8b6;display:flex;align-items:center;gap:6px;}
.score-label .name .si{width:14px;height:14px;opacity:0.7;}
.score-label .val{color:var(--neon-g);font-weight:800;font-family:monospace;font-size:16px;}
.score-bar{
  height:6px;background:rgba(255,255,255,0.06);
  border-radius:3px;overflow:hidden;position:relative;
}
.score-fill{
  height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,var(--neon-p),var(--neon-g));
  transition:width .5s ease;
  box-shadow:0 0 8px rgba(57,255,20,0.4);
  position:relative;
}
.score-fill::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);
  animation:shimmer 2s linear infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}

.gauge-section{
  margin-top:24px;text-align:center;
  padding:16px;background:rgba(255,255,255,0.02);border-radius:12px;
}
.gauge-wrap{position:relative;width:130px;height:130px;margin:0 auto;}
.gauge-wrap svg{filter:drop-shadow(0 0 12px rgba(57,255,20,0.4));}
.gauge-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;
}
.gauge-value{
  font-size:30px;font-weight:900;color:var(--neon-g);
  font-family:monospace;text-shadow:0 0 15px var(--neon-g);
  line-height:1;
}
.gauge-label{font-size:10px;color:#5a6a78;margin-top:4px;letter-spacing:1px;}

.reps-counter{
  display:flex;justify-content:center;gap:20px;margin-top:18px;
}
.rep-circle{
  width:72px;height:72px;border-radius:50%;
  border:2px solid rgba(57,255,20,0.2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:all .3s;position:relative;
}
.rep-circle.active{
  border-color:var(--neon-g);
  box-shadow:0 0 20px rgba(57,255,20,0.4);
  transform:scale(1.08);
}
.rep-circle::before{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1px solid rgba(57,255,20,0.15);
}
.rep-num{font-size:20px;font-weight:900;color:var(--neon-g);font-family:monospace;}
.rep-text{font-size:9px;color:#5a6a78;letter-spacing:1px;margin-top:2px;}

/* ===== Stats Section ===== */
.stats-section{
  display:grid;grid-template-columns:repeat(4,1fr);gap:16px;
}
@media(max-width:700px){.stats-section{grid-template-columns:repeat(2,1fr);}}
.stat-card{
  background:var(--panel);
  border:1px solid rgba(57,255,20,0.15);
  border-radius:14px;padding:20px;text-align:center;
  transition:all .3s;position:relative;overflow:hidden;
  backdrop-filter:blur(8px);
}
.stat-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--neon-g),transparent);
  opacity:0.5;
}
.stat-card:hover{
  border-color:var(--neon-g);
  box-shadow:0 0 25px rgba(57,255,20,0.12);
  transform:translateY(-3px);
}
.stat-icon{
  width:28px;height:28px;margin:0 auto 10px;
  color:var(--neon-g);opacity:0.6;
}
.stat-value{
  font-size:26px;font-weight:900;color:var(--neon-g);
  font-family:monospace;text-shadow:0 0 10px rgba(57,255,20,0.4);
  line-height:1;
}
.stat-label{font-size:11px;color:#5a6a78;margin-top:8px;letter-spacing:2px;}

/* ===== Floating Data Particles ===== */
.data-particle{
  position:fixed;font-size:10px;font-family:monospace;
  color:rgba(57,255,20,0.3);pointer-events:none;z-index:0;
  animation:dataFloat 6s linear forwards;
}
@keyframes dataFloat{
  0%{transform:translateY(0);opacity:0;}
  20%{opacity:0.3;}
  80%{opacity:0.3;}
  100%{transform:translateY(-100vh);opacity:0;}
}
</style>
</head>
<body>
<div class="grid-floor"></div>
<div class="glow-orb g1"></div>
<div class="glow-orb g2"></div>
<div class="container">
  <div class="header">
    <div class="header-left">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#39ff14" stroke-width="2">
          <circle cx="12" cy="5" r="3"/><line x1="12" y1="8" x2="12" y2="15"/>
          <line x1="12" y1="10" x2="7" y2="13"/><line x1="12" y1="10" x2="17" y2="13"/>
          <line x1="12" y1="15" x2="8" y2="21"/><line x1="12" y1="15" x2="16" y2="21"/>
        </svg>
      </div>
      <div>
        <h1>动捕镜<small>MOTION CAPTURE FITNESS MIRROR</small></h1>
      </div>
    </div>
    <div class="header-right">
      <div class="hr-badge">
        <span class="hr-icon">♥</span>
        <span id="hrVal">128</span> BPM
      </div>
      <div class="live-badge">
        <div class="live-dot"></div>
        实时捕捉中
      </div>
    </div>
  </div>

  <div class="main-grid">
    <!-- Courses Panel -->
    <div class="panel courses-panel">
      <div class="panel-title">
        <span class="dot"></span>动作课程
        <span class="line"></span>
      </div>
      <div id="courseList"></div>
    </div>

    <!-- Mirror Panel -->
    <div class="mirror-panel">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="scan-line"></div>
      <div class="mirror-hud">
        <div class="hud-item"><span class="blip"></span>CAM_ACTIVE</div>
        <div class="hud-item">FPS: <span id="fpsVal">60</span></div>
        <div class="hud-item">FRAME: <span id="frameCount">0</span></div>
      </div>
      <div class="crosshair"></div>
      <div class="skeleton-stage">
        <svg id="trailSvg" width="240" height="480" viewBox="0 0 240 480" style="position:absolute;opacity:0.3;">
          <g id="trailGroup"></g>
        </svg>
        <svg id="skeletonSvg" width="240" height="480" viewBox="0 0 240 480">
          <g id="skeletonGroup">
            <line class="bone" id="b-spine" x1="120" y1="80" x2="120" y2="240"/>
            <line class="bone" id="b-lshoulder" x1="120" y1="90" x2="90" y2="100"/>
            <line class="bone" id="b-rshoulder" x1="120" y1="90" x2="150" y2="100"/>
            <line class="bone" id="b-llarm" x1="90" y1="100" x2="75" y2="150"/>
            <line class="bone" id="b-rlarm" x1="150" y1="100" x2="165" y2="150"/>
            <line class="bone" id="b-lfarm" x1="75" y1="150" x2="70" y2="200"/>
            <line class="bone" id="b-rfarm" x1="165" y1="150" x2="170" y2="200"/>
            <line class="bone" id="b-lhip" x1="100" y1="250" x2="140" y2="250"/>
            <line class="bone" id="b-lthigh" x1="100" y1="250" x2="95" y2="330"/>
            <line class="bone" id="b-rthigh" x1="140" y1="250" x2="145" y2="330"/>
            <line class="bone" id="b-lcalf" x1="95" y1="330" x2="92" y2="420"/>
            <line class="bone" id="b-rcalf" x1="145" y1="330" x2="148" y2="420"/>
            <circle class="joint head" id="j-head" cx="120" cy="35" r="14"/>
            <circle class="joint" id="j-neck" cx="120" cy="80" r="5"/>
            <circle class="joint" id="j-lshoulder" cx="90" cy="100" r="5"/>
            <circle class="joint" id="j-rshoulder" cx="150" cy="100" r="5"/>
            <circle class="joint" id="j-lelbow" cx="75" cy="150" r="4"/>
            <circle class="joint" id="j-relbow" cx="165" cy="150" r="4"/>
            <circle class="joint" id="j-lhand" cx="70" cy="200" r="4"/>
            <circle class="joint" id="j-rhand" cx="170" cy="200" r="4"/>
            <circle class="joint" id="j-lhip" cx="100" cy="250" r="5"/>
            <circle class="joint" id="j-rhip" cx="140" cy="250" r="5"/>
            <circle class="joint" id="j-lknee" cx="95" cy="330" r="4"/>
            <circle class="joint" id="j-rknee" cx="145" cy="330" r="4"/>
            <circle class="joint" id="j-lfoot" cx="92" cy="420" r="4"/>
            <circle class="joint" id="j-rfoot" cx="148" cy="420" r="4"/>
          </g>
        </svg>
        <div class="action-label idle" id="actionLabel">请选择动作课程</div>
      </div>
    </div>

    <!-- Scores Panel -->
    <div class="panel scores-panel">
      <div class="panel-title">
        <span class="dot"></span>动作评分
        <span class="line"></span>
      </div>
      <div class="score-item">
        <div class="score-label">
          <span class="name"><svg class="si" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 14L8 2L14 14Z"/><circle cx="8" cy="10" r="2"/></svg>角度准确度</span>
          <span class="val" id="angleVal">0</span>
        </div>
        <div class="score-bar"><div class="score-fill" id="angleFill"></div></div>
      </div>
      <div class="score-item">
        <div class="score-label">
          <span class="name"><svg class="si" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><line x1="8" y1="8" x2="8" y2="4"/><line x1="8" y1="8" x2="11" y2="8"/></svg>节奏感</span>
          <span class="val" id="rhythmVal">0</span>
        </div>
        <div class="score-bar"><div class="score-fill" id="rhythmFill"></div></div>
      </div>
      <div class="score-item">
        <div class="score-label">
          <span class="name"><svg class="si" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8L7 12L13 4"/></svg>完成度</span>
          <span class="val" id="completeVal">0</span>
        </div>
        <div class="score-bar"><div class="score-fill" id="completeFill"></div></div>
      </div>

      <div class="gauge-section">
        <div class="gauge-wrap">
          <svg width="130" height="130" viewBox="0 0 130 130">
            <circle cx="65" cy="65" r="55" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6"/>
            <circle id="gaugeArc" cx="65" cy="65" r="55" fill="none" stroke="#39ff14" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="346" stroke-dashoffset="346"
              transform="rotate(-90 65 65)"
              style="filter:drop-shadow(0 0 8px #39ff14);transition:stroke-dashoffset .5s ease;"/>
          </svg>
          <div class="gauge-center">
            <div class="gauge-value" id="totalScore">0</div>
            <div class="gauge-label">综合评分</div>
          </div>
        </div>
        <div class="reps-counter" id="repsCounter">
          <div class="rep-circle" id="repCircle"><div class="rep-num" id="repNum">0</div><div class="rep-text">REPS</div></div>
          <div class="rep-circle" id="calCircle"><div class="rep-num" id="calNum">0</div><div class="rep-text">KCAL</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-section">
    <div class="stat-card">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="12" x2="15" y2="14"/></svg>
      <div class="stat-value" id="statTime">00:00</div><div class="stat-label">训练时长</div>
    </div>
    <div class="stat-card">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg>
      <div class="stat-value" id="statReps">0</div><div class="stat-label">总次数</div>
    </div>
    <div class="stat-card">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L9 8h6z"/><path d="M5 22V10h14v12"/><line x1="12" y1="14" x2="12" y2="18"/></svg>
      <div class="stat-value" id="statCal">0</div><div class="stat-label">消耗(KCAL)</div>
    </div>
    <div class="stat-card">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg>
      <div class="stat-value" id="statBest">0</div><div class="stat-label">最佳评分</div>
    </div>
  </div>
</div>

<script>
const courseIcons={
  squat:'<path d="M8 4v6l-3 8h10l-3-8V4"/><line x1="7" y1="4" x2="9" y2="4"/>',
  lunge:'<path d="M6 4l4 8-2 8h4l-2-8 4-8"/>',
  jumping:'<path d="M8 2v6l-3 4h10l-3-4V2"/><line x1="4" y1="18" x2="20" y2="18"/>',
  plank:'<line x1="4" y1="16" x2="20" y2="16"/><line x1="6" y1="16" x2="8" y2="20"/><line x1="16" y1="16" x2="18" y2="20"/><circle cx="8" cy="8" r="3"/>',
  knee:'<path d="M8 2v6h8V2"/><path d="M10 8v6l-2 6h4l2-6V8"/>'
};
const courses=[
  {id:'squat',name:'深蹲',reps:'15次',time:'30秒',diff:2,anim:'squat'},
  {id:'lunge',name:'弓步蹲',reps:'12次',time:'40秒',diff:3,anim:'lunge'},
  {id:'jumping',name:'开合跳',reps:'30次',time:'30秒',diff:1,anim:'jumping'},
  {id:'plank',name:'平板支撑',reps:'1组',time:'60秒',diff:3,anim:'plank'},
  {id:'knee',name:'高抬腿',reps:'40次',time:'30秒',diff:2,anim:'knee'}
];
let currentCourse=null,animTimer=null,frame=0;
let reps=0,calories=0,startTime=0,bestScore=0;
let scores={angle:0,rhythm:0,complete:0};
let trailPoints=[];

const courseList=document.getElementById('courseList');
courses.forEach(c=>{
  const item=document.createElement('div');
  item.className='course-item';item.dataset.id=c.id;
  let stars='';for(let i=0;i<3;i++)stars+=`<span class="${i<c.diff?'':'off'}">★</span>`;
  item.innerHTML=`
    <div class="course-row">
      <div class="course-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${courseIcons[c.id]||''}</svg></div>
      <div class="course-name">${c.name}</div>
      <div class="course-diff">${stars}</div>
    </div>
    <div class="course-meta"><span>${c.reps}</span><span>${c.time}</span></div>`;
  item.addEventListener('click',()=>selectCourse(c));
  courseList.appendChild(item);
});

function selectCourse(c){
  document.querySelectorAll('.course-item').forEach(i=>i.classList.remove('active'));
  document.querySelector(`[data-id="${c.id}"]`).classList.add('active');
  currentCourse=c;
  const label=document.getElementById('actionLabel');
  label.textContent=c.name;label.classList.remove('idle');
  if(animTimer)clearInterval(animTimer);
  scores={angle:0,rhythm:0,complete:0};reps=0;calories=0;
  if(!startTime)startTime=Date.now();
  startAnimation(c.anim);
  updateScores();
}

function moveJoint(id,cx,cy){
  const el=document.getElementById(id);
  if(el){el.setAttribute('cx',cx);el.setAttribute('cy',cy);}
}
function updateBones(){
  const boneMap={
    'b-spine':['j-neck','j-lhip'],
    'b-lshoulder':['j-neck','j-lshoulder'],
    'b-rshoulder':['j-neck','j-rshoulder'],
    'b-llarm':['j-lshoulder','j-lelbow'],
    'b-rlarm':['j-rshoulder','j-relbow'],
    'b-lfarm':['j-lelbow','j-lhand'],
    'b-rfarm':['j-relbow','j-rhand'],
    'b-lhip':['j-lhip','j-rhip'],
    'b-lthigh':['j-lhip','j-lknee'],
    'b-rthigh':['j-rhip','j-rknee'],
    'b-lcalf':['j-lknee','j-lfoot'],
    'b-rcalf':['j-rknee','j-rfoot']
  };
  Object.entries(boneMap).forEach(([bone,[j1,j2]])=>{
    const el=document.getElementById(bone);
    const p1=document.getElementById(j1),p2=document.getElementById(j2);
    if(el&&p1&&p2){
      el.setAttribute('x1',p1.getAttribute('cx'));
      el.setAttribute('y1',p1.getAttribute('cy'));
      el.setAttribute('x2',p2.getAttribute('cx'));
      el.setAttribute('y2',p2.getAttribute('cy'));
    }
  });
}

function startAnimation(type){
  let t=0;
  animTimer=setInterval(()=>{
    t+=0.1;frame++;
    document.getElementById('frameCount').textContent=frame;
    document.getElementById('fpsVal').textContent=58+Math.floor(Math.random()*5);
    document.getElementById('hrVal').textContent=120+Math.floor(Math.sin(t)*15+Math.random()*8);
    if(type==='squat')animateSquat(t);
    else if(type==='lunge')animateLunge(t);
    else if(type==='jumping')animateJumping(t);
    else if(type==='plank')animatePlank(t);
    else if(type==='knee')animateKnee(t);
    updateBones();
    updateTrail();
    updateLiveScores(t);
  },80);
}

function animateSquat(t){
  const offset=Math.sin(t*2)*40;
  moveJoint('j-lhip',100,250+offset);moveJoint('j-rhip',140,250+offset);
  moveJoint('j-lknee',95,330+offset*0.5);moveJoint('j-rknee',145,330+offset*0.5);
  moveJoint('j-lshoulder',90,100+offset);moveJoint('j-rshoulder',150,100+offset);
  moveJoint('j-neck',120,80+offset);moveJoint('j-head',120,35+offset);
  moveJoint('j-lelbow',60,150+offset*0.7);moveJoint('j-relbow',180,150+offset*0.7);
  moveJoint('j-lhand',50,200+offset);moveJoint('j-rhand',190,200+offset);
  if(offset>30)markWarn(['j-lknee','j-rknee']);else clearWarn();
}
function animateLunge(t){
  const offset=Math.sin(t*2)*30;
  moveJoint('j-lknee',95-offset,330+offset*0.3);moveJoint('j-rknee',145+offset,330-offset*0.3);
  moveJoint('j-lfoot',85-offset*0.5,420);moveJoint('j-rfoot',160+offset*0.5,420);
  moveJoint('j-lhip',100,250+offset*0.5);moveJoint('j-rhip',140,250+offset*0.5);
  moveJoint('j-lshoulder',90,100);moveJoint('j-rshoulder',150,100);
  moveJoint('j-lhand',70,200+offset);moveJoint('j-rhand',170,200+offset);
}
function animateJumping(t){
  const jump=Math.abs(Math.sin(t*3))*30;const spread=Math.sin(t*3)*20;
  moveJoint('j-lfoot',92-spread,420-jump);moveJoint('j-rfoot',148+spread,420-jump);
  moveJoint('j-lhand',70+spread*2,180-jump);moveJoint('j-rhand',170-spread*2,180-jump);
  moveJoint('j-lhip',100,250-jump*0.3);moveJoint('j-rhip',140,250-jump*0.3);
  moveJoint('j-lshoulder',90,100-jump*0.2);moveJoint('j-rshoulder',150,100-jump*0.2);
  moveJoint('j-head',120,35-jump*0.2);
}
function animatePlank(t){
  const wobble=Math.sin(t)*3;
  moveJoint('j-lshoulder',90+wobble,200);moveJoint('j-rshoulder',150+wobble,200);
  moveJoint('j-neck',120+wobble,195);moveJoint('j-head',120+wobble,175);
  moveJoint('j-lhand',70+wobble,220);moveJoint('j-rhand',170+wobble,220);
  moveJoint('j-lhip',100+wobble,220);moveJoint('j-rhip',140+wobble,220);
  moveJoint('j-lknee',95+wobble,250);moveJoint('j-rknee',145+wobble,250);
  moveJoint('j-lfoot',92+wobble,280);moveJoint('j-rfoot',148+wobble,280);
  moveJoint('j-lelbow',80+wobble,210);moveJoint('j-relbow',160+wobble,210);
}
function animateKnee(t){
  const lift=Math.abs(Math.sin(t*4))*50;
  moveJoint('j-lknee',95,330);moveJoint('j-rknee',145,330);
  if(Math.sin(t*4)>0){
    moveJoint('j-lknee',100,330-lift);moveJoint('j-lfoot',105,380-lift);
    moveJoint('j-lhip',100,250);
  }else{
    moveJoint('j-rknee',140,330-lift);moveJoint('j-rfoot',135,380-lift);
    moveJoint('j-rhip',140,250);
  }
  moveJoint('j-lhand',70,200-lift*0.5);moveJoint('j-rhand',170,200-lift*0.5);
}

function markWarn(joints){clearWarn();joints.forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add('warn');});}
function clearWarn(){document.querySelectorAll('.bone,.joint').forEach(el=>el.classList.remove('warn'));}

function updateTrail(){
  const hand=document.getElementById('j-rhand');
  if(hand){
    trailPoints.push({x:parseFloat(hand.getAttribute('cx')),y:parseFloat(hand.getAttribute('cy'))});
    if(trailPoints.length>15)trailPoints.shift();
    const tg=document.getElementById('trailGroup');
    tg.innerHTML=trailPoints.map((p,i)=>{
      const op=(i/trailPoints.length)*0.4;
      return `<circle cx="${p.x}" cy="${p.y}" r="${1+i*0.2}" fill="#39ff14" opacity="${op}"/>`;
    }).join('');
  }
}

function updateLiveScores(t){
  scores.angle=Math.min(100,Math.floor(75+Math.sin(t)*20+Math.random()*8));
  scores.rhythm=Math.min(100,Math.floor(70+Math.cos(t*1.5)*15+Math.random()*12));
  scores.complete=Math.min(100,Math.floor((t*10)%100));
  if(Math.sin(t*2)>0.9){reps=Math.floor(t/1.5);calories=reps*3;}
  updateScores();
}

function updateScores(){
  document.getElementById('angleVal').textContent=scores.angle;
  document.getElementById('rhythmVal').textContent=scores.rhythm;
  document.getElementById('completeVal').textContent=scores.complete;
  document.getElementById('angleFill').style.width=scores.angle+'%';
  document.getElementById('rhythmFill').style.width=scores.rhythm+'%';
  document.getElementById('completeFill').style.width=scores.complete+'%';
  const total=Math.floor((scores.angle+scores.rhythm+scores.complete)/3);
  document.getElementById('totalScore').textContent=total;
  document.getElementById('gaugeArc').style.strokeDashoffset=346-(total/100)*346;
  document.getElementById('repNum').textContent=reps;
  document.getElementById('calNum').textContent=calories;
  document.getElementById('repCircle').classList.toggle('active',reps>0);
  document.getElementById('calCircle').classList.toggle('active',calories>0);
  document.getElementById('statReps').textContent=reps;
  document.getElementById('statCal').textContent=calories;
  if(total>bestScore){bestScore=total;document.getElementById('statBest').textContent=bestScore;}
}

setInterval(()=>{
  if(startTime){
    const elapsed=Math.floor((Date.now()-startTime)/1000);
    const m=String(Math.floor(elapsed/60)).padStart(2,'0');
    const s=String(elapsed%60).padStart(2,'0');
    document.getElementById('statTime').textContent=m+':'+s;
  }
},1000);

function spawnData(){
  const d=document.createElement('div');
  d.className='data-particle';
  d.textContent=['0x'+Math.floor(Math.random()*65535).toString(16).toUpperCase().padStart(4,'0'),'DATA:'+Math.floor(Math.random()*999),'JOINT:'+['LKNEE','RHIP','LSHLDR','RKNEE'][Math.floor(Math.random()*4)]][Math.floor(Math.random()*3)];
  d.style.left=Math.random()*100+'vw';d.style.bottom='0';
  d.style.animationDuration=(5+Math.random()*3)+'s';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),8000);
}
setInterval(spawnData,2000);
</script>
</body>
</html>
