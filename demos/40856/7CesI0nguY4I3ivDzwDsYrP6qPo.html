    }
    .meat-card .meat-name {

    @media (max-width: 600px) {
      .header h1 { font-size: 1.5rem; }
      .timer-display .time { font-size: 3rem; }
      .meats-grid { grid-template-columns: repeat(2, 1fr); }
      .controls { flex-wrap: wrap; }
    }

<body>
  <div class="header">
    <h1>潮汕牛肉火锅计时器</h1>
    <p>精准掌控每种部位的涮烫时间，享受最佳口感</p>
  </div>

  <div class="container">
    <div class="timer-display">
      <div class="current-meat" id="currentMeat">请选择一种牛肉部位开始计时</div>
      <div class="time" id="timerDisplay">00:00</div>
      <div class="status" id="timerStatus">点击下方部位开始计时</div>
    </div>

    <div class="controls">
      <button class="btn btn-start" id="startBtn" onclick="startTimer()">开始计时</button>
      <button class="btn btn-pause" id="pauseBtn" onclick="pauseTimer()" disabled>暂停</button>
      <button class="btn btn-reset" id="resetBtn" onclick="resetTimer()">重置</button>
    </div>

    <div class="meats-grid" id="meatsGrid"></div>

    <div class="tips">
      <h3>涮肉小贴士</h3>
      <ul>
        <li>汤底保持微沸状态，大火沸腾时涮肉口感更佳</li>
        <li>肉片切得越薄，涮烫时间越短，口感越嫩</li>
        <li>每次涮烫少量肉片，避免锅内温度骤降</li>
        <li>涮好的肉片蘸沙茶酱或普宁豆酱，风味更佳</li>
        <li>三起三落是传统涮法：入汤-提起-再入汤，重复三次</li>
      </ul>
    </div>
  </div>

  <div class="notification" id="notification">时间到！可以享用啦！</div>

  <script>
    var meats = [
      { id: 'diaolong', name: '吊龙', icon: '\uD83E\uDD69', time: 8, desc: '脊背肉，肥瘦相间' },
      { id: 'xueli', name: '匙柄', icon: '\uD83C\uDF56', time: 8, desc: '肩胛肉，纹理清晰' },
      { id: 'shirao', name: '匙仁', icon: '\uD83E\uDD53', time: 10, desc: '肩胛里脊，鲜嫩多汁' },
      { id: 'bajian', name: '脖仁', icon: '\uD83C\uDF57', time: 12, desc: '颈部肉，稀有部位' },
      { id: 'sanjiao', name: '三花趾', icon: '\uD83E\uDDB4', time: 10, desc: '前腿腱子，带筋有嚼劲' },
      { id: 'wuhua', name: '五花趾', icon: '\uD83E\uDD69', time: 12, desc: '后腿腱子，筋络分明' },
      { id: 'feipian', name: '肥胼', icon: '\uD83E\uDD53', time: 6, desc: '腹部双层肉，油脂丰富' },
      { id: 'niupi', name: '胸口朥', icon: '\uD83C\uDF56', time: 120, desc: '胸口油，爽脆弹牙' },
      { id: 'niushe', name: '牛舌', icon: '\uD83D\uDC4B', time: 15, desc: '薄切牛舌，口感细腻' },
      { id: 'niudan', name: '牛百叶', icon: '\uD83C\uDF58', time: 10, desc: '爽脆可口，七上八下' },
      { id: 'niuzhen', name: '嫩肉', icon: '\uD83C\uDF57', time: 8, desc: '臀部嫩肉，纯瘦鲜嫩' },
      { id: 'feiniu', name: '肥牛', icon: '\uD83E\uDD69', time: 6, desc: '肥瘦相间，入口即化' }
    ];

    var currentMeat = null;
    var timeLeft = 0;
    var totalTime = 0;
    var timerInterval = null;
    var isRunning = false;
    var isPaused = false;

    function init() {
      var grid = document.getElementById('meatsGrid');
      meats.forEach(function(meat) {
        var card = document.createElement('div');
        card.className = 'meat-card';
        card.id = 'card-' + meat.id;
        card.onclick = function() { selectMeat(meat); };
        card.innerHTML =
          '<div class="meat-icon">' + meat.icon + '</div>' +
          '<div class="meat-name">' + meat.name + '</div>' +
          '<div class="meat-time">' + formatTime(meat.time) + '</div>' +
          '<div class="meat-desc">' + meat.desc + '</div>' +
          '<div class="progress-bar" id="progress-' + meat.id + '"></div>';
        grid.appendChild(card);
      });
    }

    function selectMeat(meat) {
      if (isRunning) pauseTimer();
      currentMeat = meat;
      timeLeft = meat.time;
      totalTime = meat.time;
      isPaused = false;

      var cards = document.querySelectorAll('.meat-card');
      for (var i = 0; i < cards.length; i++) cards[i].classList.remove('active');
      document.getElementById('card-' + meat.id).classList.add('active');
      document.getElementById('currentMeat').textContent = '\u5F53\u524D\uFF1A' + meat.name + ' (' + meat.desc + ')';
      document.getElementById('timerDisplay').textContent = formatTime(timeLeft);
      document.getElementById('timerDisplay').className = 'time';
      document.getElementById('timerStatus').textContent = '\u70B9\u51FB\u201C\u5F00\u59CB\u8BA1\u65F6\u201D\u542F\u52A8';
      document.getElementById('startBtn').disabled = false;
      document.getElementById('pauseBtn').disabled = true;
      updateProgress();
    }

    function startTimer() {
      if (!currentMeat) { showNotification('\u8BF7\u5148\u9009\u62E9\u4E00\u4E2A\u90E8\u4F4D\uFF01'); return; }
      if (isPaused) { isPaused = false; }
      else { timeLeft = currentMeat.time; totalTime = currentMeat.time; }
      isRunning = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('pauseBtn').disabled = false;
      document.getElementById('timerStatus').textContent = '\u8BA1\u65F6\u4E2D...';

      timerInterval = setInterval(function() {
        timeLeft--;
        document.getElementById('timerDisplay').textContent = formatTime(timeLeft);
        updateProgress();
        if (timeLeft <= 3 && timeLeft > 0) {
          document.getElementById('timerDisplay').className = 'time warning';
          document.getElementById('timerStatus').textContent = '\u5373\u5C06\u5B8C\u6210\uFF01';
        }
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          isRunning = false;
          timeLeft = 0;
          document.getElementById('timerDisplay').className = 'time done';
          document.getElementById('timerDisplay').textContent = '00:00';
          document.getElementById('timerStatus').textContent = currentMeat.name + ' \u53EF\u4EE5\u4EAB\u7528\u5566\uFF01';
          document.getElementById('startBtn').disabled = false;
          document.getElementById('pauseBtn').disabled = true;
          showNotification('\u23F0 ' + currentMeat.name + ' \u6D93\u597D\u4E86\uFF01\u53EF\u4EE5\u4EAB\u7528\u5566\uFF01');
          playBeep();
        }
      }, 1000);
    }

    function pauseTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      isRunning = false;
      isPaused = true;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('pauseBtn').disabled = true;
      document.getElementById('timerStatus').textContent = '\u5DF2\u6682\u505C';
      document.getElementById('timerDisplay').className = 'time';
    }

    function resetTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      isRunning = false;
      isPaused = false;
      if (currentMeat) {
        timeLeft = currentMeat.time;
        totalTime = currentMeat.time;
        document.getElementById('timerDisplay').textContent = formatTime(timeLeft);
        document.getElementById('timerStatus').textContent = '\u5DF2\u91CD\u7F6E\uFF0C\u70B9\u51FB\u5F00\u59CB';
      } else {
        timeLeft = 0;
        document.getElementById('timerDisplay').textContent = '00:00';
        document.getElementById('timerStatus').textContent = '\u8BF7\u9009\u62E9\u90E8\u4F4D';
      }
      document.getElementById('timerDisplay').className = 'time';
      document.getElementById('startBtn').disabled = false;
      document.getElementById('pauseBtn').disabled = true;
      updateProgress();
    }

    function updateProgress() {
      if (!currentMeat) return;
      var progress = ((totalTime - timeLeft) / totalTime) * 100;
      var bar = document.getElementById('progress-' + currentMeat.id);
      if (bar) bar.style.width = progress + '%';
    }

    function formatTime(seconds) {
      var m = Math.floor(seconds / 60);
      var s = seconds % 60;
      return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    function showNotification(message) {
      var notif = document.getElementById('notification');
      notif.textContent = message;
      notif.classList.add('show');
      setTimeout(function() { notif.classList.remove('show'); }, 3000);
    }

    function playBeep() {
      try {
        var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function beep(freq, start, dur) {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.frequency.value = freq;
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime + start);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + start + dur);
          osc.start(audioCtx.currentTime + start);
          osc.stop(audioCtx.currentTime + start + dur);
        }
        beep(800, 0, 0.5);
        beep(800, 0.6, 0.5);
        beep(1000, 1.2, 0.8);
      } catch (e) { console.log('Audio not supported'); }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
