<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洗头管家</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2;
    --bg-deep: #f0ebe3;
    --fg: #3a2e2a;
    --fg-light: #7a6e68;
    --accent: #c4785a;
    --accent-light: #e8a88c;
    --accent-glow: rgba(196,120,90,0.15);
    --card: #ffffff;
    --card-hover: #fffdfb;
    --border: #e8e0d8;
    --border-light: #f0ebe3;
    --success: #7ab88f;
    --success-light: #d4edda;
    --warning: #e8b84a;
    --wash-day: #c4785a;
    --wash-day-bg: rgba(196,120,90,0.08);
    --must-wash: #d45a5a;
    --must-wash-bg: rgba(212,90,90,0.08);
    --rest-day: #8fa68a;
    --rest-day-bg: rgba(143,166,138,0.12);
    --shadow-sm: 0 1px 3px rgba(58,46,42,0.06);
    --shadow-md: 0 4px 12px rgba(58,46,42,0.08);
    --shadow-lg: 0 8px 30px rgba(58,46,42,0.12);
    --radius: 16px;
    --radius-sm: 10px;
    --radius-xs: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* 背景装饰 */
  body::before {
    content: '';
    position: fixed;
    top: -200px;
    right: -200px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -150px;
    left: -150px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(184,196,212,0.1) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .app-container {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 20px 100px;
    position: relative;
    z-index: 1;
  }

  /* 顶部导航 */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 10px;
    position: sticky;
    top: 0;
    background: rgba(250,247,242,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 100;
    margin: 0 -20px;
    padding-left: 20px;
    padding-right: 20px;
  }

  .app-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: white;
    box-shadow: 0 2px 8px rgba(196,120,90,0.3);
  }

  .logo-text {
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: 20px;
    color: var(--fg);
    letter-spacing: 2px;
  }

  .week-nav {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .week-nav button {
    width: 32px;
    height: 32px;
    border: 1.5px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg-light);
    font-size: 14px;
    transition: all 0.2s;
  }
  .week-nav button:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }

  .week-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--fg-light);
    min-width: 90px;
    text-align: center;
  }

  /* 状态概览卡片 */
  .status-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px;
    margin: 16px 0;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border-light);
    position: relative;
    overflow: hidden;
  }

  .status-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-light), var(--rest-day));
  }

  .status-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
  }

  .status-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--fg);
  }

  .status-subtitle {
    font-size: 13px;
    color: var(--fg-light);
    margin-top: 4px;
  }

  .wash-count-badge {
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(196,120,90,0.3);
  }

  .stats-row {
    display: flex;
    gap: 12px;
  }

  .stat-item {
    flex: 1;
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 14px;
    text-align: center;
    border: 1px solid var(--border-light);
  }

  .stat-value {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
  }

  .stat-value.success { color: var(--success); }
  .stat-value.warning { color: var(--warning); }

  .stat-label {
    font-size: 11px;
    color: var(--fg-light);
    margin-top: 6px;
    font-weight: 500;
  }

  /* 一周日历 */
  .section-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--fg);
    margin: 24px 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title::before {
    content: '';
    width: 4px;
    height: 18px;
    background: var(--accent);
    border-radius: 2px;
  }

  .week-calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }

  .day-header {
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: var(--fg-light);
    padding: 4px 0;
  }

  .day-cell {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    border: 2px solid transparent;
    position: relative;
    font-size: 15px;
    font-weight: 500;
    background: var(--card);
    box-shadow: var(--shadow-sm);
  }

  .day-cell:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .day-cell.today {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .day-cell.wash-day {
    background: var(--wash-day-bg);
    color: var(--wash-day);
    border-color: rgba(196,120,90,0.3);
  }
  .day-cell.wash-day .day-icon {
    color: var(--wash-day);
  }

  .day-cell.must-wash {
    background: var(--must-wash-bg);
    color: var(--must-wash);
    border-color: rgba(212,90,90,0.3);
  }
  .day-cell.must-wash .day-icon {
    color: var(--must-wash);
  }

  .day-cell.rest-day {
    background: var(--rest-day-bg);
    color: var(--rest-day);
  }
  .day-cell.rest-day .day-icon {
    color: var(--rest-day);
  }

  .day-cell .day-num {
    font-weight: 700;
    font-size: 16px;
    line-height: 1;
  }

  .day-cell .day-icon {
    font-size: 10px;
    margin-top: 3px;
    opacity: 0.9;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
  }

  .day-cell .day-icon svg {
    width: 18px;
    height: 18px;
  }

  .day-cell .day-tag {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--must-wash);
  }

  .day-cell .day-tag.wash {
    background: var(--wash-day);
  }

  /* 节假日样式 */
  .day-cell.holiday {
    border-color: #e8b84a !important;
    background: rgba(232, 184, 74, 0.08) !important;
  }

  .day-cell.holiday .day-num {
    color: #c4880a;
    font-weight: 700;
  }

  .day-cell.holiday .holiday-badge {
    position: absolute;
    top: 2px;
    left: 2px;
    background: linear-gradient(135deg, #e8b84a, #d49a0a);
    color: white;
    font-size: 8px;
    padding: 1px 4px;
    border-radius: 3px;
    font-weight: 500;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 图例 */
  .legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin: 8px 0 4px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--fg-light);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
  }

  .legend-dot.wash { background: var(--wash-day); }
  .legend-dot.must { background: var(--must-wash); }
  .legend-dot.rest { background: var(--rest-day); }
  .legend-dot.today { background: var(--accent); }
  .legend-dot.holiday { background: linear-gradient(135deg, #e8b84a, #d49a0a); }

  /* 操作按钮区 */
  .action-bar {
    display: flex;
    gap: 10px;
    margin: 20px 0;
  }

  .btn {
    flex: 1;
    padding: 14px 16px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: white;
    box-shadow: 0 4px 12px rgba(196,120,90,0.3);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(196,120,90,0.4);
  }

  .btn-secondary {
    background: var(--card);
    color: var(--fg);
    border: 1.5px solid var(--border);
  }
  .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }

  .btn-sm {
    padding: 8px 14px;
    font-size: 12px;
    border-radius: var(--radius-xs);
    flex: none;
  }

  /* 每日小知识卡片 */
  .tip-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border-light);
    position: relative;
    overflow: hidden;
    margin: 8px 0;
  }

  .tip-card::after {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 80px;
    height: 80px;
    background: radial-gradient(circle at top right, var(--accent-glow), transparent 70%);
    pointer-events: none;
  }

  .tip-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .tip-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent-glow), rgba(184,196,212,0.15));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .tip-category {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .tip-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--fg);
    line-height: 1.5;
    margin-bottom: 10px;
  }

  .tip-content {
    font-size: 14px;
    color: var(--fg-light);
    line-height: 1.8;
  }

  .tip-footer {
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .tip-date {
    font-size: 11px;
    color: var(--fg-light);
    opacity: 0.6;
  }

  .tip-refresh {
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 500;
    transition: opacity 0.2s;
    padding: 4px 8px;
    border-radius: var(--radius-xs);
  }
  .tip-refresh:hover {
    background: var(--accent-glow);
  }

  /* 设置面板（模态框） */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(58,46,42,0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--bg);
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 0 24px 32px;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  }

  .modal-overlay.active .modal {
    transform: translateY(0);
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 20px;
  }

  .modal-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--fg);
    margin-bottom: 8px;
  }

  .modal-desc {
    font-size: 13px;
    color: var(--fg-light);
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .modal-section {
    margin-bottom: 24px;
  }

  .modal-section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--fg);
    margin-bottom: 12px;
  }

  /* 必须洗头日期选择器 */
  .must-wash-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .must-wash-chip {
    padding: 10px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--card);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 13px;
    font-weight: 500;
    color: var(--fg);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .must-wash-chip:hover {
    border-color: var(--must-wash);
    background: var(--must-wash-bg);
  }

  .must-wash-chip.selected {
    border-color: var(--must-wash);
    background: var(--must-wash-bg);
    color: var(--must-wash);
    font-weight: 700;
  }

  .must-wash-chip .chip-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 2px solid var(--border);
    transition: all 0.2s;
  }

  .must-wash-chip.selected .chip-dot {
    background: var(--must-wash);
    border-color: var(--must-wash);
  }

  .must-wash-chip .chip-reason {
    font-size: 11px;
    color: var(--fg-light);
    margin-left: 2px;
  }

  /* 滑块 */
  .slider-group {
    margin-bottom: 20px;
  }

  .slider-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .slider-label span:first-child {
    font-size: 14px;
    font-weight: 500;
    color: var(--fg);
  }

  .slider-value {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-glow);
    padding: 2px 10px;
    border-radius: 12px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(196,120,90,0.4);
    border: 3px solid white;
  }

  /* 活动备注输入 */
  .event-input-group {
    margin-top: 12px;
  }

  .event-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }

  .event-day-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--fg);
    min-width: 60px;
  }

  .event-input {
    flex: 1;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-xs);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 13px;
    color: var(--fg);
    background: var(--card);
    outline: none;
    transition: border-color 0.2s;
  }

  .event-input:focus {
    border-color: var(--accent);
  }

  .event-input::placeholder {
    color: var(--fg-light);
    opacity: 0.5;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }

  /* Toast 通知 */
  .toast-container {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }

  .toast {
    background: var(--fg);
    color: white;
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-lg);
    animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
    pointer-events: all;
    text-align: center;
    max-width: 360px;
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes toastOut {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-10px); }
  }

  /* 洗头计划详情列表 */
  .plan-list {
    margin-top: 8px;
  }

  .plan-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--card);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
    border: 1px solid var(--border-light);
    transition: all 0.2s;
  }

  .plan-item:hover {
    box-shadow: var(--shadow-sm);
  }

  .plan-day-badge {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 500;
    flex-shrink: 0;
  }

  .plan-day-badge .badge-day {
    font-size: 16px;
    font-weight: 900;
    line-height: 1;
  }

  .plan-day-badge.wash {
    background: var(--wash-day-bg);
    color: var(--wash-day);
  }

  .plan-day-badge.must {
    background: var(--must-wash-bg);
    color: var(--must-wash);
  }

  .plan-day-badge.rest {
    background: var(--rest-day-bg);
    color: var(--rest-day);
  }

  .plan-info {
    flex: 1;
  }

  .plan-info-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
  }

  .plan-info-desc {
    font-size: 12px;
    color: var(--fg-light);
    margin-top: 2px;
  }

  .plan-status {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 12px;
  }

  .plan-status.wash {
    background: var(--wash-day-bg);
    color: var(--wash-day);
  }
  .plan-status.must {
    background: var(--must-wash-bg);
    color: var(--must-wash);
  }
  .plan-status.rest {
    background: var(--rest-day-bg);
    color: var(--rest-day);
  }
  .plan-status.done {
    background: var(--success-light);
    color: var(--success);
  }

  /* 进度条 */
  .progress-bar-container {
    margin: 16px 0 8px;
  }

  .progress-bar-bg {
    height: 8px;
    background: var(--border-light);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;

<script>
// ========== 数据层 ==========
const DAY_NAMES = ['一','二','三','四','五','六','日'];
const DAY_FULL = ['周一','周二','周三','周四','周五','周六','周日'];

// 2026年中国法定节假日
const HOLIDAYS = {
  // 元旦：1月1日(周四)至3日(周六)，共3天
  '2026-01-01': '元旦', '2026-01-02': '元旦', '2026-01-03': '元旦',
  // 春节：2月15日(周日)至23日(周一)，共9天
  '2026-02-15': '春节', '2026-02-16': '春节', '2026-02-17': '春节',
  '2026-02-18': '春节', '2026-02-19': '春节', '2026-02-20': '春节',
  '2026-02-21': '春节', '2026-02-22': '春节', '2026-02-23': '春节',
  // 清明节：4月4日(周六)至6日(周一)，共3天
  '2026-04-04': '清明', '2026-04-05': '清明', '2026-04-06': '清明',
  // 劳动节：5月1日(周五)至5日(周二)，共5天
  '2026-05-01': '劳动节', '2026-05-02': '劳动节', '2026-05-03': '劳动节',
  '2026-05-04': '劳动节', '2026-05-05': '劳动节',
  // 端午节：6月19日(周五)至21日(周日)，共3天
  '2026-06-19': '端午', '2026-06-20': '端午', '2026-06-21': '端午',
  // 中秋节：9月25日(周五)至27日(周日)，共3天
  '2026-09-25': '中秋', '2026-09-26': '中秋', '2026-09-27': '中秋',
  // 国庆节：10月1日(周四)至7日(周三)，共7天
  '2026-10-01': '国庆', '2026-10-02': '国庆', '2026-10-03': '国庆',
  '2026-10-04': '国庆', '2026-10-05': '国庆', '2026-10-06': '国庆', '2026-10-07': '国庆',
};

// 获取日期对应的节假日名称
function getHolidayName(date) {
  const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
  return HOLIDAYS[key] || null;
}

let state = {
  currentWeekOffset: 0,
  maxWashPerWeek: 3,
  mustWashDays: [],       // 本周必须洗头的日期索引 (0-6, 相对于周一)
  washPlan: [],           // 本周洗头计划: [{dayIndex, type:'must'|'auto', reason}]
  completedDays: new Set(),
  eventNotes: {},         // {dayIndex: '活动名称'}
  currentTipIndex: 0,
};

// 从 localStorage 加载
function loadState() {
  try {
    const saved = localStorage.getItem('hairManager');
    if (saved) {
      const parsed = JSON.parse(saved);
      state.maxWashPerWeek = parsed.maxWashPerWeek || 3;
      state.completedDays = new Set(parsed.completedDays || []);
      state.eventNotes = parsed.eventNotes || {};
      // 检查是否同一周
      const savedWeekStart = parsed.weekStart;
      const currentWeekStart = getWeekStart(new Date()).toISOString().slice(0,10);
      if (savedWeekStart === currentWeekStart) {
        state.mustWashDays = parsed.mustWashDays || [];
        state.washPlan = parsed.washPlan || [];
      }
    }
  } catch(e) {}
}

function saveState() {
  const weekStart = getWeekStart(new Date()).toISOString().slice(0,10);
  localStorage.setItem('hairManager', JSON.stringify({
    maxWashPerWeek: state.maxWashPerWeek,
    mustWashDays: state.mustWashDays,
    washPlan: state.washPlan,
    completedDays: [...state.completedDays],
    eventNotes: state.eventNotes,
    weekStart: weekStart,
  }));
}

// ========== 日期工具 ==========
function getWeekStart(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1); // 周一为起始
  return new Date(d.setDate(diff));
}

function getWeekDates(offset) {
  const start = getWeekStart(new Date());
  start.setDate(start.getDate() + offset * 7);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    dates.push(d);
  }
  return dates;
}

function isToday(date) {
  const today = new Date();
  return date.toDateString() === today.toDateString();
}

function formatDate(date) {
  return `${date.getMonth()+1}月${date.getDate()}日`;
}

function getWeekLabel(offset) {
  if (offset === 0) return '本周';
  if (offset === -1) return '上周';
  if (offset === 1) return '下周';
  const dates = getWeekDates(offset);
  return `${formatDate(dates[0])} - ${formatDate(dates[6])}`;
}

// ========== 智能规划算法 ==========
function autoPlan() {
  const mustDays = [...state.mustWashDays].sort((a,b) => a-b);
  const maxWash = state.maxWashPerWeek;

  // 必须洗头的日子
  const plan = mustDays.map(d => ({
    dayIndex: d,
    type: 'must',
    reason: state.eventNotes[d] || '重要场合'
  }));

  // 剩余可安排次数
  let remaining = maxWash - mustDays.length;
  if (remaining <= 0) {
    state.washPlan = plan;
    saveState();
    render();
    showToast(`已安排 ${plan.length} 天洗头（全部为必洗日）`);
    return;
  }

  // 智能分配剩余洗头日：强制间隔至少1天，优先间隔2天
  const occupied = new Set(mustDays);

  // 检查必洗日之间是否有冲突（间隔不足1天）
  const mustSorted = [...mustDays].sort((a,b) => a-b);
  for (let i = 1; i < mustSorted.length; i++) {
    if (mustSorted[i] - mustSorted[i-1] < 2) {
      showToast('注意：必洗日之间间隔不足1天，建议调整');
    }
  }

  // 贪心算法：每次选择与所有已选洗头日距离最大的候选日，且距离>=2（优先）或>=1（保底）
  const selected = new Set(mustDays);

  for (let r = 0; r < remaining; r++) {
    let bestDay = -1;
    let bestScore = -1;

    for (let d = 0; d < 7; d++) {
      if (selected.has(d)) continue;

      // 计算与所有已选洗头日的最小距离
      let minDist = 7;
      for (const s of selected) {
        const dist = Math.abs(d - s);
        minDist = Math.min(minDist, dist);
      }

      // 距离不足1天，跳过
      if (minDist < 1) continue;

      // 评分：距离越大越好，优先选间隔>=2的
      let score = minDist;
      if (minDist >= 2) score += 10; // 大幅加分，优先间隔2天

      if (score > bestScore) {
        bestScore = score;
        bestDay = d;
      }
    }

    if (bestDay >= 0) {
      plan.push({
        dayIndex: bestDay,
        type: 'auto',
        reason: '管家推荐'
      });
      selected.add(bestDay);
    } else {
      // 如果找不到间隔>=1的位置，放宽条件（不应该发生，但以防万一）
      for (let d = 0; d < 7; d++) {
        if (!selected.has(d)) {
          plan.push({
            dayIndex: d,
            type: 'auto',
            reason: '管家推荐（紧凑安排）'
          });
          selected.add(d);
          break;
        }
      }
    }
  }

  // 按日期排序
  plan.sort((a, b) => a.dayIndex - b.dayIndex);

  state.washPlan = plan;
  saveState();
  render();

  // 验证间隔
  const planDays = plan.map(p => p.dayIndex).sort((a,b) => a-b);
  let minGap = 7;
  for (let i = 1; i < planDays.length; i++) {
    minGap = Math.min(minGap, planDays[i] - planDays[i-1]);
  }
  if (minGap >= 2) {
    showToast(`管家已安排 ${plan.length} 天洗头，每次间隔至少2天`);
  } else {
    showToast(`管家已安排 ${plan.length} 天洗头，间隔至少1天`);
  }
}

// ========== 渲染 ==========
function render() {
  renderWeekNav();
  renderCalendar();
  renderPlanList();
  renderStats();
  renderTip();
}

function renderWeekNav() {
  document.getElementById('weekLabel').textContent = getWeekLabel(state.currentWeekOffset);
}

function renderCalendar() {
  const container = document.getElementById('weekCalendar');
  const dates = getWeekDates(state.currentWeekOffset);

  // 先渲染星期头
  let html = DAY_NAMES.map(n => `<div class="day-header">${n}</div>`).join('');

  // 渲染日期格子
  const washSet = new Set(state.washPlan.map(p => p.dayIndex));
  const mustSet = new Set(state.mustWashDays);

  dates.forEach((date, i) => {
    const today = isToday(date);
    const isWash = washSet.has(i);
    const isMust = mustSet.has(i);
    const isCompleted = state.completedDays.has(i) && state.currentWeekOffset === 0;
    const holiday = getHolidayName(date);

    let cls = 'day-cell';
    if (today) cls += ' today';
    if (isMust) cls += ' must-wash';
    else if (isWash) cls += ' wash-day';
    else cls += ' rest-day';
    if (holiday) cls += ' holiday';

    let icon = '';
    if (isCompleted) icon = '✓';
    else if (isMust) icon = '❗';
    else if (isWash) icon = '🚿';
    else icon = '👒';

    let tag = '';
    if (isMust) tag = '<div class="day-tag"></div>';
    else if (isWash) tag = '<div class="day-tag wash"></div>';

    let holidayBadge = '';
    if (holiday) holidayBadge = `<div class="holiday-badge">${holiday}</div>`;

    let title = isMust ? '必须洗头' : isWash ? '计划洗头' : '休息日';
    if (holiday) title = `${holiday} - ${title}`;

    html += `
      <div class="${cls}" onclick="toggleMustWash(${i})" title="${title}">
        ${tag}
        ${holidayBadge}
        <span class="day-num">${date.getDate()}</span>
        <span class="day-icon">${icon}</span>
      </div>
    `;
  });

  container.innerHTML = html;
}

function renderPlanList() {
  const container = document.getElementById('planList');
  const washSet = new Set(state.washPlan.map(p => p.dayIndex));
  const mustSet = new Set(state.mustWashDays);
  const dates = getWeekDates(state.currentWeekOffset);

  let html = '';
  for (let i = 0; i < 7; i++) {
    const isMust = mustSet.has(i);
    const isWash = washSet.has(i);
    const isCompleted = state.completedDays.has(i) && state.currentWeekOffset === 0;
    const holiday = getHolidayName(dates[i]);

    let type, title, desc, statusText, statusClass, badgeClass;

    if (isMust) {
      type = 'must';
      title = `${DAY_FULL[i]} · 必须洗头`;
      desc = state.eventNotes[i] || (holiday ? `🎉${holiday}` : '重要场合');
      statusText = '必洗';
      statusClass = 'must';
      badgeClass = 'must';
    } else if (isWash) {
      const planItem = state.washPlan.find(p => p.dayIndex === i);
      type = 'wash';
      title = `${DAY_FULL[i]} · 洗头日`;
      desc = holiday ? `🎉${holiday} - ${planItem?.reason || '管家推荐'}` : (planItem?.reason || '管家推荐');
      statusText = '计划';
      statusClass = 'wash';
      badgeClass = 'wash';
    } else {
      type = 'rest';
      title = `${DAY_FULL[i]} · 休息日`;
      desc = holiday ? `🎉${holiday} · 让头发休息` : '让头发自然休息';
      statusText = '休息';
      statusClass = 'rest';
      badgeClass = 'rest';
    }

    if (isCompleted) {
      statusText = '已完成';
      statusClass = 'done';
    }

    html += `
      <div class="plan-item">
        <div class="plan-day-badge ${badgeClass}">
          <span class="badge-day">${dates[i].getDate()}</span>
          <span>${DAY_NAMES[i]}</span>
        </div>
        <div class="plan-info">
          <div class="plan-info-title">${title}</div>
          <div class="plan-info-desc">${desc}</div>
        </div>
        <span class="plan-status ${statusClass}">${statusText}</span>
      </div>
    `;
  }

  container.innerHTML = html;
}

function renderStats() {
  const total = state.washPlan.length;
  const done = state.completedDays.size;
  const remain = total - done;
  const max = state.maxWashPerWeek;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  document.getElementById('statWash').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statRemain').textContent = remain;
  document.getElementById('washCountBadge').textContent = `${total}/${max} 次`;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '%';

  const statusTitle = document.getElementById('statusTitle');
  const statusSub = document.getElementById('statusSubtitle');

  if (total === 0) {
    statusTitle.textContent = '尚未规划';
    statusSub.textContent = '点击"智能规划"开始安排';
  } else if (done === total) {
    statusTitle.textContent = '本周计划已完成';
    statusSub.textContent = '太棒了！坚持就是胜利';
  } else {
    statusTitle.textContent = '本周洗头计划';
    statusSub.textContent = `还剩 ${remain} 次待完成`;
  }
}

// ========== 护发小知识 ==========
const hairTips = [
  {
    category: '洗发技巧',
    title: '水温不宜过高',
    content: '洗头时水温控制在38-40°C最为适宜。过热的水会刺激头皮，导致油脂分泌过多，反而让头发更快变油。过冷的水则无法有效清洁。建议先用温水充分湿润头发和头皮，再开始使用洗发水。',
  },
  {

function renderTip() {
  const today = new Date();
  // 根据日期生成一个稳定的索引
  const dayOfYear = Math.floor((today - new Date(today.getFullYear(),0,0)) / 86400000);
  const idx = state.currentTipIndex !== undefined ? state.currentTipIndex : dayOfYear % hairTips.length;
  const tip = hairTips[idx % hairTips.length];

  document.getElementById('tipCategory').textContent = tip.category;
  document.getElementById('tipTitle').textContent = tip.title;
  document.getElementById('tipContent').textContent = tip.content;
  document.getElementById('tipDate').textContent = `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;
}

function refreshTip() {
  state.currentTipIndex = (state.currentTipIndex + 1) % hairTips.length;
  renderTip();
  // 添加刷新动画
  const card = document.getElementById('tipCard');
  card.style.opacity = '0';
  card.style.transform = 'translateY(8px)';
  setTimeout(() => {
    card.style.transition = 'all 0.3s ease';
    card.style.opacity = '1';
    card.style.transform = 'translateY(0)';
  }, 50);
}

// ========== 交互 ==========
function changeWeek(delta) {
  state.currentWeekOffset += delta;
  render();
}

function toggleMustWash(dayIndex) {
  const idx = state.mustWashDays.indexOf(dayIndex);
  if (idx >= 0) {
    state.mustWashDays.splice(idx, 1);
    delete state.eventNotes[dayIndex];
    showToast(`已取消 ${DAY_FULL[dayIndex]} 的必洗安排`);
  } else {
    state.mustWashDays.push(dayIndex);
    showToast(`已标记 ${DAY_FULL[dayIndex]} 为必洗日`);
  }
  saveState();
  render();
}

function openSettings() {
  const modal = document.getElementById('settingsModal');
  modal.classList.add('active');

  // 渲染必洗日选择器
  const picker = document.getElementById('mustWashPicker');
  const dates = getWeekDates(0);
  let html = '';
  for (let i = 0; i < 7; i++) {
    const selected = state.mustWashDays.includes(i);
    html += `
      <div class="must-wash-chip ${selected ? 'selected' : ''}" onclick="toggleMustWashChip(this, ${i})">
        <span class="chip-dot"></span>
        ${DAY_FULL[i]} ${formatDate(dates[i])}
      </div>
    `;
  }
  picker.innerHTML = html;

  // 渲染活动备注输入
  renderEventInputs();

  // 设置滑块
  document.getElementById('maxWashSlider').value = state.maxWashPerWeek;
  document.getElementById('maxWashValue').textContent = state.maxWashPerWeek + ' 次';
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('active');
}

function toggleMustWashChip(el, dayIndex) {
  const idx = state.mustWashDays.indexOf(dayIndex);
  if (idx >= 0) {
    state.mustWashDays.splice(idx, 1);
    el.classList.remove('selected');
  } else {
    state.mustWashDays.push(dayIndex);
    el.classList.add('selected');
  }
  renderEventInputs();
}

function renderEventInputs() {
  const container = document.getElementById('eventInputs');
  const dates = getWeekDates(0);
  let html = '';
  state.mustWashDays.sort((a,b) => a-b).forEach(dayIndex => {
    html += `
      <div class="event-input-group">
        <div class="event-input-row">
          <span class="event-day-label">${DAY_FULL[dayIndex]}</span>
          <input class="event-input" type="text" placeholder="备注活动（如：约会、面试）"
            value="${state.eventNotes[dayIndex] || ''}"
            oninput="updateEventNote(${dayIndex}, this.value)">
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

function updateEventNote(dayIndex, value) {
  state.eventNotes[dayIndex] = value;
}

function updateMaxWash(value) {
  state.maxWashPerWeek = parseInt(value);
  document.getElementById('maxWashValue').textContent = value + ' 次';
}

function saveSettings() {
  saveState();
  closeSettings();
  autoPlan();
}

function markTodayWashed() {
  const today = new Date();
  const dates = getWeekDates(0);
  let todayIndex = -1;
  dates.forEach((d, i) => {
    if (isToday(d)) todayIndex = i;
  });

  if (todayIndex < 0) return;

  if (state.completedDays.has(todayIndex)) {
    state.completedDays.delete(todayIndex);
    showToast('已取消今日的洗头记录');
  } else {
    state.completedDays.add(todayIndex);
    showToast('已标记今天为已洗头 ✓');
  }
  saveState();
  render();
}

// ========== Toast ==========
function showToast(msg) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ========== 点击模态框外部关闭 ==========
document.getElementById('settingsModal').addEventListener('click', function(e) {
  if (e.target === this) closeSettings();
});

// ========== 初始化 ==========
loadState();
render();

// 如果没有计划，自动生成一个
if (state.washPlan.length === 0 && state.mustWashDays.length === 0) {
  // 默认计划：周一和周四洗头（间隔3天）
  state.washPlan = [
    { dayIndex: 0, type: 'auto', reason: '管家推荐' },
    { dayIndex: 3, type: 'auto', reason: '管家推荐' },
  ];
  saveState();
  render();
}
