            tired: [
                "累了就休息一下吧，你已经很努力了。就像手机需要充电一样，人也需要停下来积蓄能量。今天的疲惫是明天活力的铺垫。",
                "辛苦了一整天，真的不容易。允许自己此刻的脆弱吧，不需要一直坚强。好好睡一觉，明天又是新的开始。",
                "疲惫是身体在提醒你要关爱自己了。泡一杯热茶，听一首轻音乐，或者什么都不做，就只是静静地待着。你值得被温柔对待。",
                "今天的你已经很棒了，即使觉得累，也坚持到了现在。现在，请把肩上的担子放下一会儿，让自己好好喘口气吧。"
            ],
            anxious: [
                "焦虑的时候，试着深呼吸三次。你知道吗？这种情绪就像天空中的云，看着很大，但总会飘走的。你比想象中更强大。",
                "感到焦虑是很正常的，这说明你在乎一些事情。但请记住，你担心的很多事情，最后都不会发生。相信自己，你能应对一切。",
                "当你感到不安时，试着把注意力放在当下。感受脚踏实地的触感，听周围的声音。焦虑会过去，而你一直在前进。",
                "每个人都会有焦虑的时刻，你并不孤单。给自己多一点耐心，就像对待一个好朋友一样。慢慢地，一切都会好起来的。"
            ],
            sad: [
                "难过的时候，就让自己难过一会儿吧。情绪需要被释放，就像雨水需要落下。哭出来也没关系，这是心灵在自我疗愈。",
                "我知道现在可能不太好受。但请记住，即使是下雨天，天空也还是在那里的，太阳终会再次出来。给你一个大大的拥抱。",
                "有些日子就是会比较难，这不是你的错。允许自己悲伤，允许自己不完美。你已经在尽力了，这就够了。",
                "每一次难过，都是心灵在成长。就像珍珠需要砂砾的磨砺，你的坚强也在悄悄积累。这段时光会过去，而你会变得更好。"
            ]
        };

        const MOOD_QUOTES = {
            happy: ["快乐不是因为拥有的多，而是计较的少。", "每一天都是新的开始，带着微笑去迎接吧。", "幸福不在远方，就在当下的每一个瞬间。", "阳光总在风雨后，而你正沐浴着阳光。"],
            calm: ["心静自然凉，从容是最好的姿态。", "在宁静中，听见内心最真实的声音。", "波澜不惊，才是生活的最高境界。", "安静的力量，胜过喧嚣的表达。"],
            tired: ["休息不是放弃，而是为了更好地出发。", "累了就停下来，世界不会因为你的暂停而崩塌。", "给自己一点温柔，你值得被善待。", "今天的疲惫，是明天成长的养分。"],
            anxious: ["深呼吸，一切都会好起来的。", "焦虑是未来的烦恼，而此刻你一切都好。", "相信自己，你比想象中更加勇敢。", "放下担忧，专注于眼前的每一步。"],
            sad: ["雨后总会有彩虹，阴霾终将散去。", "允许自己脆弱，那是通往坚强的路。", "每一次哭泣，都是心灵的洗礼。", "你并不孤单，总有人在默默关心着你。"]
        };

        // 状态
        let selectedMood = null;
        let selectedEmoji = '';
        let selectedLabel = '';

        // DOM 元素
        const moodItems = document.querySelectorAll('.mood-item');
        const moodInput = document.getElementById('moodInput');
        const charCount = document.getElementById('charCount');
        const generateBtn = document.getElementById('generateBtn');
        const responseCard = document.getElementById('responseCard');
        const aiResponse = document.getElementById('aiResponse');
        const aiText = document.getElementById('aiText');
        const previewCard = document.getElementById('previewCard');
        const shareCard = document.getElementById('shareCard');
        const cardDate = document.getElementById('cardDate');
        const cardMoodEmoji = document.getElementById('cardMoodEmoji');
        const cardMoodLabel = document.getElementById('cardMoodLabel');
        const cardQuote = document.getElementById('cardQuote');
        const copyBtn = document.getElementById('copyBtn');
        const saveBtn = document.getElementById('saveBtn');
        const toast = document.getElementById('toast');
        const currentDateEl = document.getElementById('currentDate');

        // 初始化日期
        function initDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            currentDateEl.textContent = now.toLocaleDateString('zh-CN', options);
        }

        // 心情选择
        moodItems.forEach(item => {
            item.addEventListener('click', () => {
                moodItems.forEach(m => m.classList.remove('selected'));
                item.classList.add('selected');
                selectedMood = item.dataset.mood;
                selectedEmoji = item.dataset.emoji;
                selectedLabel = item.dataset.label;

                // 添加点击特效
                createSparkle(item);
            });
        });

        // 字符计数
        moodInput.addEventListener('input', () => {
            charCount.textContent = moodInput.value.length;
        });

        // 生成回应
        generateBtn.addEventListener('click', async () => {
            if (!selectedMood) {
                showToast('请先选择一个心情哦～');
                return;
            }

            const text = moodInput.value.trim();
            if (!text) {
                showToast('写点什么吧，哪怕是短短的一句话～');
                return;
            }

            // 显示加载状态
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span>';

            // 模拟AI思考
            await delay(1500);

            // 获取回应
            const responses = MOOD_RESPONSES[selectedMood];
            const response = responses[Math.floor(Math.random() * responses.length)];

            // 显示回应
            responseCard.style.display = 'block';
            aiResponse.classList.add('visible');
            aiText.innerHTML = '';

            // 打字机效果
            await typeWriter(aiText, response);

            // 生成卡片
            generateCard(text);

            // 恢复按钮
            generateBtn.disabled = false;
            generateBtn.innerHTML = '<span>✨</span>重新生成';
        });

        // 生成卡片
        function generateCard(userText) {
            previewCard.style.display = 'block';
            shareCard.classList.add('visible');

            const now = new Date();
            cardDate.textContent = now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' });
            cardMoodEmoji.textContent = selectedEmoji;
            cardMoodLabel.textContent = `今日心情：${selectedLabel}`;

            const quotes = MOOD_QUOTES[selectedMood];
            const quote = quotes[Math.floor(Math.random() * quotes.length)];
            cardQuote.innerHTML = `${userText}<br><br><em style="color: var(--muted); font-size: 14px;">${quote}</em>`;

            // 滚动到卡片
            setTimeout(() => {
                previewCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        // 复制文字
        copyBtn.addEventListener('click', () => {
            const text = `【情绪日记】${cardDate.textContent}\n今日心情：${selectedLabel} ${selectedEmoji}\n\n${cardQuote.textContent}\n\n来自：情绪日记 · AI治愈伙伴`;
            navigator.clipboard.writeText(text).then(() => {
                showToast('卡片文字已复制到剪贴板！');
            }).catch(() => {
                showToast('复制失败，请手动复制～');
            });
        });

        // 保存图片（使用 html2canvas 或其他方式，这里用提示）
        saveBtn.addEventListener('click', () => {
            showToast('🎨 提示：截图即可保存精美卡片！');
        });

        // 打字机效果
        async function typeWriter(element, text) {
            element.innerHTML = '<span class="typing-cursor"></span>';
            const cursor = element.querySelector('.typing-cursor');

            for (let i = 0; i < text.length; i++) {
                element.insertBefore(document.createTextNode(text[i]), cursor);
                await delay(30);
            }

            cursor.remove();
        }

        // 延迟函数
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 显示提示
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 创建闪光特效
        function createSparkle(element) {
            const rect = element.getBoundingClientRect();
            const colors = ['#FFB84D', '#E8956A', '#D4A574', '#8FBFA3', '#C495A0'];

            for (let i = 0; i < 6; i++) {
                const sparkle = document.createElement('span');
                sparkle.className = 'sparkle';
                sparkle.textContent = ['✨', '⭐', '💫'][Math.floor(Math.random() * 3)];
                sparkle.style.left = (rect.left + rect.width / 2 + (Math.random() - 0.5) * 60) + 'px';
                sparkle.style.top = (rect.top + rect.height / 2 + (Math.random() - 0.5) * 60) + 'px';
                sparkle.style.color = colors[Math.floor(Math.random() * colors.length)];
                sparkle.style.fontSize = (14 + Math.random() * 10) + 'px';
                sparkle.style.animationDelay = (Math.random() * 0.3) + 's';
                document.body.appendChild(sparkle);

                setTimeout(() => sparkle.remove(), 1000);
            }
        }

        // 初始化
        initDate();
    </script>
</body>
</html>
