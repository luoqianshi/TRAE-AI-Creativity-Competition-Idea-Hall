<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生棋局 - 你的成长大富翁</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        /* 头部 */
        .header {
            text-align: center;
            padding: 30px 0;
            background: linear-gradient(90deg, transparent, rgba(233, 196, 106, 0.2), transparent);
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #e9c46a, #f4a261, #e76f51);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(233, 196, 106, 0.3);
        }
        .header p { color: #a0a0a0; margin-top: 10px; font-size: 1.1em; }
        
        /* 主布局 */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        /* 左侧：属性面板 */
        .stats-panel {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        .stats-panel h3 {
            color: #e9c46a;
            margin-bottom: 15px;
            font-size: 1.2em;
            text-align: center;
        }
        .stat-item {
            margin-bottom: 12px;
        }
        .stat-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            margin-bottom: 4px;
        }
        .stat-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        .stat-growth { background: linear-gradient(90deg, #2a9d8f, #48cae4); }
        .stat-tech { background: linear-gradient(90deg, #0077b6, #00b4d8); }
        .stat-wealth { background: linear-gradient(90deg, #e9c46a, #f4a261); }
        .stat-knowledge { background: linear-gradient(90deg, #9b5de5, #c77dff); }
        .stat-network { background: linear-gradient(90deg, #f72585, #b5179e); }
        .stat-health { background: linear-gradient(90deg, #38b000, #70e000); }
        .stat-experience { background: linear-gradient(90deg, #ff6d00, #ff9e00); }
        .stat-language { background: linear-gradient(90deg, #3a86ff, #8338ec); }
        .stat-goal { background: linear-gradient(90deg, #ff006e, #fb5607); }
        .stat-ideal { background: linear-gradient(90deg, #06ffa5, #00bbf9); }
        .stat-relation { background: linear-gradient(90deg, #ffbe0b, #fb5607); }
        
        /* 中间：棋盘 */
        .board-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .phase-info {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(233, 196, 106, 0.1);
            border-radius: 10px;
        }
        .phase-info h2 {
            color: #e9c46a;
            font-size: 1.5em;
        }
        .phase-info span {
            color: #a0a0a0;
            font-size: 0.9em;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .cell {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.75em;
            text-align: center;
            padding: 5px;
            border: 2px solid transparent;
            transition: all 0.3s;
            position: relative;
        }
        .cell:hover { transform: scale(1.05); }
        .cell.start { border-color: #2a9d8f; background: rgba(42, 157, 143, 0.2); }
        .cell.event { border-color: #e9c46a; background: rgba(233, 196, 106, 0.15); }
        .cell.chance { border-color: #9b5de5; background: rgba(155, 93, 229, 0.15); }
        .cell.risk { border-color: #e76f51; background: rgba(231, 111, 81, 0.15); }
        .cell.connection { border-color: #f72585; background: rgba(247, 37, 133, 0.15); }
        .cell.goal-cell { border-color: #38b000; background: rgba(56, 176, 0, 0.15); }
        .cell.current {
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255,255,255,0.3); }
            50% { box-shadow: 0 0 30px rgba(255,255,255,0.5); }
        }
        .player-token {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #e9c46a, #f4a261);
            border-radius: 50%;
            position: absolute;
            top: -8px;
            right: -8px;
            box-shadow: 0 2px 10px rgba(233, 196, 106, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7em;
            font-weight: bold;
            color: #1a1a2e;
        }
        
        /* 控制区 */
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .btn-roll {
            background: linear-gradient(135deg, #e9c46a, #f4a261);
            color: #1a1a2e;
        }
        .btn-roll:hover { transform: scale(1.05); box-shadow: 0 5px 20px rgba(233, 196, 106, 0.4); }
        .btn-god {
            background: linear-gradient(135deg, #9b5de5, #c77dff);
            color: #fff;
        }
        .btn-god:hover { transform: scale(1.05); box-shadow: 0 5px 20px rgba(155, 93, 229, 0.4); }
        .dice-result {
            text-align: center;
            font-size: 1.2em;
            color: #e9c46a;
            margin-bottom: 10px;
            min-height: 30px;
        }
        
        /* 右侧：人脉 & 日志 */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .panel-box {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            flex: 1;
        }
        .panel-box h3 {
            color: #e9c46a;
            margin-bottom: 10px;
            font-size: 1.1em;
            text-align: center;
        }
        .contact-item {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 8px;
            font-size: 0.85em;
            border-left: 3px solid;
        }
        .contact-good { border-left-color: #2a9d8f; }
        .contact-bad { border-left-color: #e76f51; }
        .contact-normal { border-left-color: #a0a0a0; }
        .contact-name { font-weight: bold; color: #fff; }
        .contact-type { font-size: 0.8em; color: #a0a0a0; }
        .contact-value { font-size: 0.8em; color: #e9c46a; margin-top: 2px; }
        
        .log-area {
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.85em;
        }
        .log-item {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #c0c0c0;
        }
        .log-item:last-child { border-bottom: none; }
        .log-positive { color: #2a9d8f; }
        .log-negative { color: #e76f51; }
        .log-neutral { color: #e9c46a; }
        
        /* 上帝视角弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 20px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(155, 93, 229, 0.3);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal h2 {
            color: #c77dff;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        .analysis-section {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .analysis-section h4 {
            color: #e9c46a;
            margin-bottom: 10px;
        }
        .analysis-section p, .analysis-section li {
            color: #c0c0c0;
            line-height: 1.6;
            font-size: 0.95em;
        }
        .analysis-section ul { margin-left: 20px; }
        .suggestion {
            background: rgba(42, 157, 143, 0.1);
            border-left: 3px solid #2a9d8f;
            padding: 10px;
            margin: 5px 0;
            border-radius: 0 8px 8px 0;
        }
        .warning {
            background: rgba(231, 111, 81, 0.1);
            border-left: 3px solid #e76f51;
            padding: 10px;
            margin: 5px 0;
            border-radius: 0 8px 8px 0;
        }
        .close-btn {
            display: block;
            margin: 20px auto 0;
            padding: 10px 40px;
            background: linear-gradient(135deg, #9b5de5, #c77dff);
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
        }
        
        /* 事件弹窗 */
        .event-modal .modal {
            border-color: rgba(233, 196, 106, 0.3);
        }
        .event-modal h2 { color: #e9c46a; }
        .choice-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }
        .choice-btn:hover {
            background: rgba(233, 196, 106, 0.2);
            border-color: #e9c46a;
        }
        
        /* 人脉详情弹窗 */
        .contact-detail {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .contact-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f72585, #b5179e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
        }
        .contact-info h4 { color: #fff; margin-bottom: 5px; }
        .contact-info p { color: #a0a0a0; font-size: 0.9em; }
        .influence-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }
        .tag {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            background: rgba(255,255,255,0.1);
        }
        .tag-positive { background: rgba(42, 157, 143, 0.2); color: #2a9d8f; }
        .tag-negative { background: rgba(231, 111, 81, 0.2); color: #e76f51; }
        
        /* 人生轨迹图 */
        .life-path {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .life-path h3 {
            color: #e9c46a;
            text-align: center;
            margin-bottom: 15px;
        }
        .path-timeline {
            display: flex;
            justify-content: space-between;
            position: relative;
            padding: 20px 0;
        }
        .path-timeline::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #2a9d8f, #e9c46a, #e76f51, #9b5de5);
            border-radius: 2px;
        }
        .path-node {
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .path-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #0f3460;
            border: 3px solid #a0a0a0;
            margin: 0 auto 8px;
        }
        .path-dot.completed { border-color: #2a9d8f; background: #2a9d8f; }
        .path-dot.current { border-color: #e9c46a; background: #e9c46a; animation: pulse 1.5s infinite; }
        .path-label { font-size: 0.8em; color: #a0a0a0; }
        .path-label.active { color: #e9c46a; font-weight: bold; }
        
        /* 响应式 */
        @media (max-width: 1200px) {
            .main-layout { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            .board { grid-template-columns: repeat(4, 1fr); }
            .header h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>人生棋局</h1>
            <p>每一步选择，都在塑造你的未来 | 像大富翁一样，走向人生巅峰</p>
        </div>
        
        <div class="main-layout">
            <!-- 左侧属性面板 -->
            <div class="stats-panel">
                <h3>人生属性</h3>
                <div class="stat-item">
                    <div class="stat-label"><span>成长</span><span id="val-growth">50</span></div>
                    <div class="stat-bar"><div class="stat-fill stat-growth" id="bar-growth" style="width:50%"></div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label"><span>技术</span><span id="val-tech">30</span></div>
                    <div class="stat-bar"><div class="stat-fill stat-tech" id="bar-tech" style="width:30%"></div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label"><span>财富</span><span id="val-wealth">20</span></div>
                    <div class="stat-bar"><div class="stat-fill stat-wealth" id="bar-wealth" style="width:20%"></div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label"><span>知识</span><span id="val-knowledge">40</span></div>
                    <div class="stat-bar"><div class="stat-fill stat-knowledge" id="bar-knowledge" style="width:40%"></div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label"><span>人脉</span><span id="val-network">30</span></div>
                    <div class="stat-bar"><div class="stat-fill stat-network" id="bar-network" style="width:30%"></div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label"><span>健康</span><span id="val-health">80</span></div>
                    <div class="stat-bar"><div class="stat-fill stat-health" id="bar-health" style="width:80%"></div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label"><span>经验</span><span id="val-experience">20</span></div>
                    <div class="stat-bar"><div class="stat-fill stat-experience" id="bar-experience" style="width:20%"></div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label"><span>语言</span><span id="val-language">20</span></div>
                    <div class="stat-bar"><div class="stat-fill stat-language" id="bar-language" style="width:20%"></div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label"><span>目标</span><span id="val-goal">40</span></div>
                    <div class="stat-bar"><div class="stat-fill stat-goal" id="bar-goal" style="width:40%"></div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label"><span>理想</span><span id="val-ideal">50</span></div>
                    <div class="stat-bar"><div class="stat-fill stat-ideal" id="bar-ideal" style="width:50%"></div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label"><span>人际关系</span><span id="val-relation">40</span></div>
                    <div class="stat-bar"><div class="stat-fill stat-relation" id="bar-relation" style="width:40%"></div></div>
                </div>
            </div>
            
            <!-- 中间棋盘 -->
            <div class="board-section">
                <div class="phase-info">
                    <h2 id="current-phase">小学阶段</h2>
                    <span id="phase-desc">人生的起点，打好基础的关键时期</span>
                </div>
                <div class="board" id="board"></div>
                <div class="dice-result" id="dice-result"></div>
                <div class="controls">
                    <button class="btn btn-roll" onclick="rollDice()">掷骰子</button>
                    <button class="btn btn-god" onclick="openGodView()">上帝视角</button>
                </div>
            </div>
            
            <!-- 右侧面板 -->
            <div class="right-panel">
                <div class="panel-box">
                    <h3>人脉网络</h3>
                    <div id="contacts-list"></div>
                </div>
                <div class="panel-box">
                    <h3>人生日志</h3>
                    <div class="log-area" id="log-area"></div>
                </div>
            </div>
        </div>
        
        <!-- 人生轨迹 -->
        <div class="life-path">
            <h3>人生轨迹</h3>
            <div class="path-timeline">
                <div class="path-node">
                    <div class="path-dot completed"></div>
                    <div class="path-label active">小学</div>
                </div>
                <div class="path-node">
                    <div class="path-dot" id="dot-middle"></div>
                    <div class="path-label">初中</div>
                </div>
                <div class="path-node">
                    <div class="path-dot" id="dot-high"></div>
                    <div class="path-label">高中</div>
                </div>
                <div class="path-node">
                    <div class="path-dot" id="dot-uni"></div>
                    <div class="path-label">大学</div>
                </div>
                <div class="path-node">
                    <div class="path-dot" id="dot-work"></div>
                    <div class="path-label">职场</div>
                </div>
                <div class="path-node">
                    <div class="path-dot" id="dot-startup"></div>
                    <div class="path-label">创业</div>
                </div>
                <div class="path-node">
                    <div class="path-dot" id="dot-mature"></div>
                    <div class="path-label">成熟</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 上帝视角弹窗 -->
    <div class="modal-overlay" id="god-modal">
        <div class="modal">
            <h2>上帝视角 - 人生分析报告</h2>
            <div id="god-analysis"></div>
            <button class="close-btn" onclick="closeGodView()">关闭</button>
        </div>
    </div>
    
    <!-- 事件弹窗 -->
    <div class="modal-overlay event-modal" id="event-modal">
        <div class="modal">
            <h2 id="event-title">事件</h2>
            <p id="event-desc" style="color:#c0c0c0; margin-bottom:15px;"></p>
            <div id="event-choices"></div>
        </div>
    </div>

    <script>
        // ==================== 游戏核心数据 ====================
        const STATS = ['growth', 'tech', 'wealth', 'knowledge', 'network', 'health', 'experience', 'language', 'goal', 'ideal', 'relation'];
        const STAT_NAMES = { growth: '成长', tech: '技术', wealth: '财富', knowledge: '知识', network: '人脉', health: '健康', experience: '经验', language: '语言', goal: '目标', ideal: '理想', relation: '人际关系' };

        const PHASES = [
            { id: 'elementary', name: '小学阶段', desc: '人生的起点，打好基础的关键时期', dotId: null, round: 0 },
            { id: 'middle', name: '初中阶段', desc: '青春期萌芽，开始形成独立人格', dotId: 'dot-middle', round: 0 },
            { id: 'high', name: '高中阶段', desc: '人生关键转折期，选择决定未来方向', dotId: 'dot-high', round: 0 },
            { id: 'university', name: '大学阶段', desc: '开阔视野，积累人脉与专业知识', dotId: 'dot-uni', round: 0 },
            { id: 'work', name: '职场阶段', desc: '进入社会，用实力证明自己', dotId: 'dot-work', round: 0 },
            { id: 'startup', name: '创业阶段', desc: '开创自己的事业，走向财富自由', dotId: 'dot-startup', round: 0 },
            { id: 'mature', name: '成熟阶段', desc: '人生巅峰，传承智慧与经验', dotId: 'dot-mature', round: 0 }
        ];

        // 游戏状态
        let gameState = {
            currentPhase: 0,
            position: 0,
            stats: { growth: 50, tech: 30, wealth: 20, knowledge: 40, network: 30, health: 80, experience: 20, language: 20, goal: 40, ideal: 50, relation: 40 },
            contacts: [],
            logs: [],
            eventsTriggered: {},
            choices: {},
            phaseCompleted: false,
            wealthAmount: 0
        };

        // 人脉模板
        const CONTACT_TEMPLATES = {
            positive: [

        // ==================== 界面渲染 ====================
        function renderBoard() {
            const phase = PHASES[gameState.currentPhase];
            const cells = getCurrentCells();
            const board = document.getElementById('board');
            board.innerHTML = '';
            
            cells.forEach((cell, idx) => {
                const div = document.createElement('div');
                div.className = `cell ${cell.type}`;
                if (idx === gameState.position) div.classList.add('current');
                div.innerHTML = `
                    <div style="font-size:1.5em;">${cell.icon}</div>
                    <div>${cell.label}</div>
                    ${idx === gameState.position ? '<div class="player-token">你</div>' : ''}
                `;
                board.appendChild(div);
            });
            
            document.getElementById('current-phase').textContent = phase.name;
            document.getElementById('phase-desc').textContent = phase.desc;
        }

        function getCurrentCells() {
            const phase = PHASES[gameState.currentPhase];
            return PHASE_CELLS[phase.id] || PHASE_CELLS.elementary;
        }

        function renderStats() {
            STATS.forEach(stat => {
                const val = Math.max(0, Math.min(100, gameState.stats[stat]));
                document.getElementById(`val-${stat}`).textContent = val;
                document.getElementById(`bar-${stat}`).style.width = val + '%';
            });
        }

        function renderContacts() {
            const list = document.getElementById('contacts-list');
            if (gameState.contacts.length === 0) {
                list.innerHTML = '<div style="color:#a0a0a0;font-size:0.85em;text-align:center;padding:10px;">还没有认识任何人</div>';
                return;
            }
            list.innerHTML = gameState.contacts.map(c => `
                <div class="contact-item contact-${c.kind}" onclick="showContactDetail(${c.id})" style="cursor:pointer;">
                    <div class="contact-name">${c.name}</div>
                    <div class="contact-type">${c.type} · ${c.phase}</div>
                    <div class="contact-value">${c.value}</div>
                </div>
            `).join('');
        }

        function renderLogs() {
            const area = document.getElementById('log-area');
            if (gameState.logs.length === 0) {
                area.innerHTML = '<div style="color:#a0a0a0;font-size:0.85em;text-align:center;padding:10px;">人生刚刚开始…</div>';
                return;
            }
            area.innerHTML = gameState.logs.slice(-20).reverse().map(l => {
                let cls = 'log-neutral';
                if (l.type === 'positive') cls = 'log-positive';
                if (l.type === 'negative') cls = 'log-negative';
                return `<div class="log-item ${cls}">[${l.phase}] ${l.text}</div>`;
            }).join('');
        }

        function renderLifePath() {
            for (let i = 0; i < PHASES.length; i++) {
                const dotId = PHASES[i].dotId;
                if (!dotId) continue;
                const dot = document.getElementById(dotId);
                if (!dot) continue;
                dot.classList.remove('completed', 'current');
                const label = dot.parentElement.querySelector('.path-label');
                if (label) label.classList.remove('active');
                
                if (i < gameState.currentPhase) {
                    dot.classList.add('completed');
                } else if (i === gameState.currentPhase) {
                    dot.classList.add('current');
                    if (label) label.classList.add('active');
                }
            }
        }

        function refreshUI() {
            renderBoard();
            renderStats();
            renderContacts();
            renderLogs();
            renderLifePath();
        }

        // ==================== 骰子 & 移动 ====================
        function rollDice() {
            const dice = Math.floor(Math.random() * 6) + 1;
            const cells = getCurrentCells();
            const oldPos = gameState.position;
            const newPos = Math.min(gameState.position + dice, cells.length - 1);
            gameState.position = newPos;
            
            document.getElementById('dice-result').innerHTML = `掷出了 <b style="font-size:1.5em;">${dice}</b> 点，前进到第 ${newPos + 1} 格`;
            
            refreshUI();
            
            // 触发格子事件
            setTimeout(() => {
                const cell = cells[newPos];
                if (cell.event) {
                    triggerEvent(cell.event, cell);
                }
                if (newPos === cells.length - 1) {
                    completePhase();
                }
            }, 500);
        }

        // ==================== 事件系统 ====================
        function triggerEvent(eventId, cell) {
            const phase = PHASES[gameState.currentPhase];
            const key = `${phase.id}-${eventId}`;
            
            if (gameState.eventsTriggered[key] && gameState.eventsTriggered[key] >= 2) {
                addLog('neutral', '这个事件你已经经历过了，没有新的变化。');
                return;
            }
            gameState.eventsTriggered[key] = (gameState.eventsTriggered[key] || 0) + 1;
            
            const event = ALL_EVENTS[eventId];
            if (event) {
                showEventModal(event);
            }
        }

        function showEventModal(event) {
            document.getElementById('event-title').textContent = event.title;
            document.getElementById('event-desc').textContent = event.desc;
            const choicesDiv = document.getElementById('event-choices');
            choicesDiv.innerHTML = event.choices.map((c, i) => `
                <button class="choice-btn" onclick="makeChoice(${i})">
                    <b>${c.label}</b><br>
                    <span style="font-size:0.8em;color:#a0a0a0;">${c.preview || ''}</span>
                </button>
            `).join('');
            document.getElementById('event-modal').classList.add('active');
        }

        function makeChoice(choiceIndex) {
            const eventId = document.getElementById('event-title').textContent;
            const event = Object.values(ALL_EVENTS).find(e => e.title === eventId);
            if (!event) return;
            
            const choice = event.choices[choiceIndex];
            document.getElementById('event-modal').classList.remove('active');
            
            applyEffects(choice.effects || {});
            if (choice.contact) {
                addContact(choice.contact);
            }
            if (choice.log) {
                const logType = choice.logType || (choice.effects && Object.values(choice.effects).some(v => v < 0) ? 'negative' : 'positive');
                addLog(logType, choice.log);
            }
            
            refreshUI();
        }

        function applyEffects(effects) {
            STATS.forEach(stat => {
                if (effects[stat]) {
                    gameState.stats[stat] = Math.max(0, Math.min(100, gameState.stats[stat] + effects[stat]));
                }
            });
            if (effects.wealthAmount) {
                gameState.wealthAmount += effects.wealthAmount;
            }
        }

        function addContact(contactData) {
            const exists = gameState.contacts.find(c => c.name === contactData.name);
            if (exists) return;
            
            gameState.contacts.push({
                id: gameState.contacts.length + 1,
                ...contactData,
                phase: PHASES[gameState.currentPhase].name,
                addedAt: new Date().toISOString()
            });
        }

        function addLog(type, text) {
            gameState.logs.push({
                type,
                text,
                phase: PHASES[gameState.currentPhase].name,
                time: new Date().toISOString()
            });
        }

        function showContactDetail(id) {
            const contact = gameState.contacts.find(c => c.id === id);
            if (!contact) return;
            
            const modal = document.getElementById('god-modal');
            const analysis = document.getElementById('god-analysis');
            
            const emoji = contact.kind === 'good' ? '😊' : contact.kind === 'bad' ? '😈' : '😐';
            const kindLabel = contact.kind === 'good' ? '益友' : contact.kind === 'bad' ? '损友' : '普通';
            const kindColor = contact.kind === 'good' ? '#2a9d8f' : contact.kind === 'bad' ? '#e76f51' : '#a0a0a0';
            
            let advice = '';
            if (contact.kind === 'good') {
                advice = '<div class="suggestion">建议：这是一位值得深交的益友。在当前阶段对你有帮助，未来也可能成为重要的合作伙伴。</div>';

                advice = '<div class="warning">警示：建议保持距离，这类人脉可能拖累你的发展。及时止损，把精力放在更有价值的关系上。</div>';

                advice = '<div class="suggestion">建议：普通关系，不必投入太多精力。保持礼貌即可。</div>';

            analysis.innerHTML = `

                    <div class="contact-detail">
                        <div class="contact-avatar" style="background:${kindColor};">${emoji}</div>
                        <div class="contact-info">
                            <h4>${contact.name} <span style="color:${kindColor};font-size:0.8em;">[${kindLabel}]</span></h4>
                            <p>${contact.type} · 结识于${contact.phase}</p>
                        </div>
                    </div>
                    <p>${contact.desc}</p>
                    <div class="influence-tags">
                        <span class="tag tag-${contact.kind === 'good' ? 'positive' : contact.kind === 'bad' ? 'negative' : ''}">${contact.value}</span>
                    </div>
                    ${advice}
                </div>

            modal.classList.add('active');
        }

        // ==================== 阶段完成 ====================
        function completePhase() {
            if (gameState.currentPhase < PHASES.length - 1) {
                gameState.currentPhase++;
                gameState.position = 0;
                gameState.phaseCompleted = false;
                document.getElementById('dice-result').innerHTML = '';
                addLog('neutral', `恭喜！你完成了${PHASES[gameState.currentPhase - 1].name}，进入${PHASES[gameState.currentPhase].name}！`);
                refreshUI();
            } else {
                addLog('positive', '恭喜！你走完了人生棋局，成为了人生赢家！');
                refreshUI();
                alert('恭喜你走完了全部人生阶段！财富值：' + gameState.wealthAmount + ' 万。你可以点击"上帝视角"查看完整分析报告。');
            }
        }
