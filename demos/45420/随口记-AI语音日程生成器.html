<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随口记 - AI语音日程自动生成器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --primary: #4A90D9;
    --primary-light: #E8F4FD;
    --primary-dark: #357ABD;
    --secondary: #7CB9E8;
    --accent: #5BA3D0;
    --bg: #F5F9FC;
    --card-bg: #FFFFFF;
    --text: #2C3E50;
    --text-light: #7F8C8D;
    --border: #DCE8F2;
    --high-priority: #E74C3C;
    --medium-priority: #F39C12;
    --low-priority: #27AE60;
    --shadow: 0 2px 12px rgba(74, 144, 217, 0.1);
    --shadow-hover: 0 4px 20px rgba(74, 144, 217, 0.18);
    --radius: 12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* 顶部导航 */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    color: white;
    padding: 16px 32px;
    box-shadow: 0 2px 16px rgba(74, 144, 217, 0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header h1 {
    font-size: 24px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header h1 .logo {
    width: 36px;
    height: 36px;
    background: rgba(255,255,255,0.25);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .header-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
    white-space: nowrap;
  }

  .btn-primary {
    background: rgba(255,255,255,0.2);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
  }

  .btn-primary:hover {
    background: rgba(255,255,255,0.3);
    transform: translateY(-1px);
  }

  .btn-blue {
    background: var(--primary);
    color: white;
  }

  .btn-blue:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(74, 144, 217, 0.4);
  }

  .btn-outline {
    background: white;
    color: var(--primary);
    border: 1px solid var(--primary);
  }

  .btn-outline:hover {
    background: var(--primary-light);
    transform: translateY(-1px);
  }

  .btn-danger {
    background: #FEE;
    color: #C0392B;
    border: 1px solid #F5B7B1;
  }

  .btn-danger:hover {
    background: #FADBD8;
  }

  .btn-success {
    background: #D5F5E3;
    color: #1E8449;
    border: 1px solid #82E0AA;
  }

  .btn-success:hover {
    background: #ABEBC6;
  }

  /* 主容器 */
  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 24px;
  }

  /* 卡片 */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 20px;
    transition: box-shadow 0.3s ease;
  }

  .card:hover {
    box-shadow: var(--shadow-hover);
  }

  .card-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--primary-light);
  }

  .card-title .icon {
    width: 28px;
    height: 28px;
    background: var(--primary-light);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  /* 录音区域 */
  .record-section {
    text-align: center;
    padding: 20px 0;
  }

  .record-btn {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    border: none;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    margin: 0 auto 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    box-shadow: 0 6px 20px rgba(74, 144, 217, 0.4);
  }

  .record-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 28px rgba(74, 144, 217, 0.5);
  }

  .record-btn.recording {
    background: linear-gradient(135deg, #E74C3C 0%, #C0392B 100%);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4); }
    50% { box-shadow: 0 6px 40px rgba(231, 76, 60, 0.7); }
  }

  .record-btn .mic-icon {
    font-size: 36px;
  }

  .record-status {
    font-size: 14px;
    color: var(--text-light);
    margin-bottom: 8px;
  }

  .record-status.active {
    color: var(--high-priority);
    font-weight: 600;
  }

  .transcript-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    min-height: 120px;
    max-height: 200px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
    text-align: left;
    margin-top: 12px;
    outline: none;
    transition: border-color 0.2s;
  }

  .transcript-box:focus {
    border-color: var(--primary);
  }

  .transcript-box:empty::before {
    content: '识别结果将显示在这里，支持手动编辑...';
    color: #BDC3C7;
  }

  .action-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .action-row .btn {
    flex: 1;
    justify-content: center;
    min-width: 100px;
  }

  /* 视图切换 */
  .view-tabs {
    display: flex;
    background: var(--primary-light);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 16px;
  }

  .view-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-light);
    transition: all 0.25s ease;
  }

  .view-tab.active {
    background: white;
    color: var(--primary);
    box-shadow: 0 2px 8px rgba(74, 144, 217, 0.15);
  }

  .view-tab:hover:not(.active) {
    color: var(--primary-dark);
  }

  .view-content {
    display: none;
  }

  .view-content.active {
    display: block;
  }

  /* 表格视图 */
  .schedule-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  .schedule-table th {
    background: var(--primary-light);
    padding: 12px;
    text-align: left;
    font-weight: 600;
    color: var(--primary-dark);
    position: sticky;
    top: 0;
  }

  .schedule-table th:first-child {
    border-top-left-radius: 8px;
  }

  .schedule-table th:last-child {
    border-top-right-radius: 8px;
  }

  .schedule-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  .schedule-table tr:hover td {
    background: var(--primary-light);
  }

  .schedule-table input,
  .schedule-table select,
  .schedule-table textarea {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  .schedule-table input:focus,
  .schedule-table select:focus,
  .schedule-table textarea:focus {
    outline: none;
    border-color: var(--primary);
  }

  .schedule-table textarea {
    resize: vertical;
    min-height: 32px;
  }

  .priority-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
  }

  .priority-high {
    background: #FADBD8;
    color: #C0392B;
  }

  .priority-medium {
    background: #FEF5E7;
    color: #D68910;
  }

  .priority-low {
    background: #D5F5E3;
    color: #1E8449;
  }

  .table-actions {
    display: flex;
    gap: 6px;
  }

  .icon-btn {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.2s;
    background: transparent;
  }

  .icon-btn.delete {
    color: #E74C3C;
  }

  .icon-btn.delete:hover {
    background: #FADBD8;
  }

  .icon-btn.add-row-btn {
    color: var(--primary);
    width: auto;
    height: auto;
    padding: 6px 12px;
    font-size: 13px;
    gap: 4px;
  }

  .icon-btn.add-row-btn:hover {
    background: var(--primary-light);
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-light);
  }

  .empty-state .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.5;
  }

  /* 时间轴视图 */
  .timeline-section {
    margin-bottom: 24px;
  }

  .timeline-section-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--primary-dark);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--primary-light);
    border-radius: 8px;
  }

  .timeline {
    position: relative;
    padding-left: 80px;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 60px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--border);
  }

  .timeline-item {
    position: relative;
    margin-bottom: 12px;
  }

  .timeline-time {
    position: absolute;
    left: -80px;
    top: 12px;
    width: 65px;
    text-align: right;
    font-size: 13px;
    font-weight: 600;
    color: var(--primary-dark);
  }

  .timeline-dot {
    position: absolute;
    left: -24px;
    top: 14px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    z-index: 1;
  }

  .timeline-dot.high { background: var(--high-priority); }
  .timeline-dot.medium { background: var(--medium-priority); }
  .timeline-dot.low { background: var(--low-priority); }

  .timeline-card {
    background: white;
    border-radius: 10px;
    padding: 12px 16px;
    box-shadow: 0 2px 8px rgba(74, 144, 217, 0.1);
    border-left: 4px solid var(--primary);
    transition: all 0.25s ease;
  }

  .timeline-card:hover {
    transform: translateX(4px);
    box-shadow: 0 4px 16px rgba(74, 144, 217, 0.18);
  }

  .timeline-card.high { border-left-color: var(--high-priority); }
  .timeline-card.medium { border-left-color: var(--medium-priority); }
  .timeline-card.low { border-left-color: var(--low-priority); }

  .timeline-task {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 4px;
  }

  .timeline-duration {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 6px;
  }

  .timeline-note {
    font-size: 13px;
    color: var(--text-light);
    padding-top: 6px;
    border-top: 1px dashed var(--border);
    margin-top: 6px;
  }

  .todo-section {
    margin-top: 20px;
  }

  .todo-section .timeline {
    padding-left: 0;
  }

  .todo-section .timeline::before {
    display: none;
  }

  .todo-section .timeline-item {
    padding-left: 0;
  }

  .todo-section .timeline-time,
  .todo-section .timeline-dot {
    display: none;
  }

  /* 优先级图例 */
  .legend {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-light);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  /* 统计信息 */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }

  .stat-card {
    background: var(--primary-light);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }

  .stat-number {
    font-size: 24px;
    font-weight: 700;
    color: var(--primary);
  }

  .stat-label {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 2px;
  }

  /* 移动端适配 */
  @media (max-width: 900px) {
    .container {
      grid-template-columns: 1fr;
      padding: 16px;
    }

    .header {
      padding: 12px 16px;
      flex-direction: column;
      gap: 10px;
    }

    .header h1 {
      font-size: 20px;
    }

    .header-actions {
      width: 100%;
      justify-content: center;
    }

    .stats {
      grid-template-columns: repeat(3, 1fr);
    }

    .schedule-table {
      font-size: 12px;
    }

    .schedule-table th,
    .schedule-table td {
      padding: 8px 6px;
    }
  }

  /* 滚动条美化 */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  ::-webkit-scrollbar-track {
    background: var(--bg);
    border-radius: 4px;
  }

  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: var(--secondary);
  }

  /* 提示动画 */
  .toast {
    position: fixed;
    top: 80px;
    right: 24px;
    background: var(--text);
    color: white;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 1000;
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.3s ease;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  .toast.success { background: #27AE60; }
  .toast.error { background: #E74C3C; }
  .toast.info { background: var(--primary); }

  /* 表格容器 */
  .table-container {
    max-height: 500px;
    overflow-y: auto;
    border-radius: 8px;
  }

  /* 文本输入样式 */
  .text-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  .text-input:focus {
    outline: none;
    border-color: var(--primary);
  }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
    margin-top: 12px;
  }

  .form-label:first-child {
    margin-top: 0;
  }
</style>
</head>
<body>

<div class="header">
  <h1>
    <span class="logo">🎙️</span>
    随口记 - AI语音日程自动生成器
  </h1>
  <div class="header-actions">
    <button class="btn btn-primary" onclick="exportToExcel()">
      📊 导出Excel
    </button>
    <button class="btn btn-primary" onclick="exportToImage()">
      🖼️ 生成图片
    </button>
    <button class="btn btn-primary" onclick="loadDemoData()">
      📋 演示数据
    </button>
    <button class="btn btn-primary" onclick="clearAll()">
      🗑️ 清空全部
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="container">
  <!-- 左侧操作区 -->
  <div class="left-panel">
    <div class="card">
      <div class="card-title">
        <span class="icon">🎤</span>
        语音录入
      </div>
      <div class="record-section">
        <button class="record-btn" id="recordBtn" onclick="toggleRecording()">
          <span class="mic-icon" id="micIcon">🎙️</span>
          <span id="recordText">开始录音</span>
        </button>
        <div class="record-status" id="recordStatus">点击按钮开始语音识别</div>
        <div class="transcript-box" id="transcriptBox" contenteditable="true"></div>
        <div class="action-row">
          <button class="btn btn-blue" onclick="parseSchedule()">
            ✨ 智能解析
          </button>
          <button class="btn btn-outline" onclick="clearTranscript()">
            清空文本
          </button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <span class="icon">📊</span>
        今日统计
      </div>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-number" id="statTotal">0</div>
          <div class="stat-label">总任务数</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="statHigh">0</div>
          <div class="stat-label">高优先级</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="statDone">0</div>
          <div class="stat-label">待办事项</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <span class="icon">💡</span>
        使用提示
      </div>
      <div style="font-size: 13px; color: var(--text-light); line-height: 2;">
        <div>✅ 支持自然语言描述日程</div>
        <div>✅ 自动提取时间和优先级</div>
        <div>✅ 可手动编辑修改</div>
        <div>✅ 数据自动本地保存</div>
        <div style="margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border);">
          <strong style="color: var(--primary-dark);">示例：</strong><br>
          "明天上午九点到十点开项目会议，很重要"<br>
          "下午三点写报告，优先级中等"
        </div>
      </div>
    </div>
  </div>

  <!-- 右侧展示区 -->
  <div class="right-panel">
    <div class="card">
      <div class="card-title">
        <span class="icon">📅</span>
        日程管理
      </div>

      <div class="view-tabs">
        <div class="view-tab active" onclick="switchView('table')">📋 表格视图</div>
        <div class="view-tab" onclick="switchView('timeline')">⏰ 时间轴视图</div>
      </div>

      <!-- 表格视图 -->
      <div class="view-content active" id="tableView">
        <div class="table-container" id="tableContainer">
          <table class="schedule-table">
            <thead>
              <tr>
                <th style="width: 180px;">时间</th>
                <th>任务内容</th>
                <th style="width: 100px;">优先级</th>
                <th>备注</th>
                <th style="width: 50px;">操作</th>
              </tr>
            </thead>
            <tbody id="scheduleTableBody">
            </tbody>
          </table>
        </div>
        <div style="margin-top: 12px; text-align: center;">
          <button class="btn btn-outline" onclick="addNewTask()" style="width: 100%; justify-content: center;">
            ➕ 添加新任务
          </button>
        </div>
      </div>

      <!-- 时间轴视图 -->
      <div class="view-content" id="timelineView">
        <div class="legend">
          <div class="legend-item">
            <span class="legend-dot" style="background: var(--high-priority);"></span>
            高优先级
          </div>
          <div class="legend-item">
            <span class="legend-dot" style="background: var(--medium-priority);"></span>
            中优先级
          </div>
          <div class="legend-item">
            <span class="legend-dot" style="background: var(--low-priority);"></span>
            低优先级
          </div>
        </div>
        <div id="timelineContainer">
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 隐藏的导出画布 -->
<canvas id="exportCanvas" style="display: none;"></canvas>

<script>
  let scheduleData = [];
  let isRecording = false;
  let recognition = null;
  let currentView = 'table';

  const demoData = [
    { startTime: '08:00', endTime: '08:30', task: '晨间运动', priority: 'medium', note: '慢跑30分钟' },
    { startTime: '09:00', endTime: '10:30', task: '项目周会', priority: 'high', note: '讨论Q3进度计划' },
    { startTime: '11:00', endTime: '12:00', task: '代码审查', priority: 'high', note: 'Review新功能PR' },
    { startTime: '12:00', endTime: '13:30', task: '午餐休息', priority: 'low', note: '公司食堂' },

    { startTime: '19:00', endTime: '20:00', task: '阅读技术书籍', priority: 'low', note: '《深入理解计算机系统》' },

  function init() {
    loadFromStorage();
    if (scheduleData.length === 0) {
      scheduleData = JSON.parse(JSON.stringify(demoData));
      saveToStorage();
    }
    renderTable();
    renderTimeline();
    updateStats();
    initSpeechRecognition();
  }

  function initSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = function(event) {
        let transcript = '';
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            transcript += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        const box = document.getElementById('transcriptBox');
        if (box.innerText.trim() === '') {
          box.innerText = transcript + interim;
        } else {
          const finalText = box.innerText.replace(/\s*$/,'') + transcript;
          box.innerText = finalText + interim;
        }
      };

      recognition.onerror = function(event) {
        console.error('语音识别错误:', event.error);
        if (event.error === 'not-allowed') {
          showToast('请允许麦克风权限', 'error');
        }
        stopRecording();
      };

      recognition.onend = function() {
        if (isRecording) {
          try { recognition.start(); } catch(e) {}
        }
      };
    }
  }

  function toggleRecording() {
    if (!recognition) {
      showToast('您的浏览器不支持语音识别，请使用Chrome浏览器', 'error');
      return;
    }

    if (isRecording) {
      stopRecording();
    } else {
      startRecording();
    }
  }

  function startRecording() {
    try {
      recognition.start();
      isRecording = true;
      document.getElementById('recordBtn').classList.add('recording');
      document.getElementById('micIcon').textContent = '⏹️';
      document.getElementById('recordText').textContent = '停止录音';
      document.getElementById('recordStatus').textContent = '🎙️ 正在录音中...请说话';
      document.getElementById('recordStatus').classList.add('active');
    } catch (e) {
      console.error('启动录音失败:', e);
      showToast('启动录音失败', 'error');
    }
  }

  function stopRecording() {
    isRecording = false;
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
    }
    document.getElementById('recordBtn').classList.remove('recording');
    document.getElementById('micIcon').textContent = '🎙️';
    document.getElementById('recordText').textContent = '开始录音';
    document.getElementById('recordStatus').textContent = '识别完成，可编辑后点击智能解析';
    document.getElementById('recordStatus').classList.remove('active');
  }

  function clearTranscript() {
    document.getElementById('transcriptBox').innerText = '';
  }

  function parseSchedule() {
    const text = document.getElementById('transcriptBox').innerText.trim();
    if (!text) {
      showToast('请先输入或录制语音内容', 'error');
      return;
    }

    const tasks = parseTextToTasks(text);
    if (tasks.length === 0) {
      showToast('未能识别出任务，请描述得更详细一些', 'error');
      return;
    }

    tasks.forEach(task => {
      scheduleData.push(task);
    });

    sortSchedule();
    saveToStorage();
    renderTable();
    renderTimeline();
    updateStats();
    showToast(`成功解析 ${tasks.length} 个任务`, 'success');
  }

  function parseTextToTasks(text) {
    const tasks = [];
    const sentences = text.split(/[。！？，,；;.\n]+/).filter(s => s.trim().length > 2);

    for (const sentence of sentences) {
      const task = parseSentence(sentence.trim());
      if (task) {
        tasks.push(task);
      }
    }

    if (tasks.length === 0 && text.trim().length > 3) {
      const task = parseSentence(text.trim());
      if (task) tasks.push(task);
    }

    return tasks;
  }

  function parseSentence(sentence) {
    if (!sentence || sentence.length < 2) return null;

    let startTime = '';
    let endTime = '';
    let priority = 'medium';
    let note = '';

    if (/高优先|非常重要|很重要|紧急|最重要|优先级高/.test(sentence)) {
      priority = 'high';
    } else if (/低优先|不重要|有空|随便|不急|优先级低/.test(sentence)) {
      priority = 'low';
    } else if (/中优先|一般|普通|中等/.test(sentence)) {
      priority = 'medium';
    }

    const timeResult = extractTimeRange(sentence);
    if (timeResult) {
      startTime = timeResult.start;
      endTime = timeResult.end;
    }

    let taskText = sentence
      .replace(/高优先|非常重要|很重要|紧急|最重要|优先级高/g, '')
      .replace(/低优先|不重要|有空|随便|不急|优先级低/g, '')
      .replace(/中优先|一般|普通|中等优先级/g, '')
      .replace(/明天|今天|后天|上午|下午|晚上|早上|中午|凌晨|傍晚|深夜/g, '')
      .replace(/\d{1,2}[点时:：]\d{0,2}[分]?(\s*[-~到至]\s*\d{1,2}[点时:：]\d{0,2}[分]?)?/g, '')
      .replace(/[，,。！？；;.\s]+$/g, '')
      .replace(/^[，,。！？；;.\s]+/g, '')
      .trim();

    if (taskText.length < 2) {
      taskText = sentence.substring(0, 20);
    }

    if (taskText.length > 30) {
      note = taskText.substring(20);
      taskText = taskText.substring(0, 20);
    }

    return {
      startTime,
      endTime,
      task: taskText,
      priority,
      note
    };
  }

  function extractTimeRange(text) {
    let start = '';
    let end = '';
    let periodOffset = 0;

    if (/明天/.test(text)) {
    }

    if (/上午|早上/.test(text)) {
      periodOffset = 0;
    } else if (/下午/.test(text)) {
      periodOffset = 12;
    } else if (/晚上|傍晚|夜里|深夜/.test(text)) {
      periodOffset = 12;
    }

    const rangePattern = /(\d{1,2})[点时:：](\d{0,2})[分]?\s*[-~到至]\s*(\d{1,2})[点时:：](\d{0,2})[分]?/;
    const rangeMatch = text.match(rangePattern);
    if (rangeMatch) {
      let startHour = parseInt(rangeMatch[1]);
      let startMin = rangeMatch[2] ? parseInt(rangeMatch[2]) : 0;
      let endHour = parseInt(rangeMatch[3]);
      let endMin = rangeMatch[4] ? parseInt(rangeMatch[4]) : 0;

      if (periodOffset > 0 && startHour < 12) startHour += periodOffset;
      if (periodOffset > 0 && endHour < 12) endHour += periodOffset;
      if (/下午|晚上/.test(text) && endHour <= 12 && startHour > endHour) endHour += 12;

      start = `${padZero(startHour)}:${padZero(startMin)}`;
      end = `${padZero(endHour)}:${padZero(endMin)}`;
      return { start, end };
    }

    const singlePattern = /(\d{1,2})[点时:：](\d{0,2})[分]?/;
    const singleMatch = text.match(singlePattern);
    if (singleMatch) {
      let hour = parseInt(singleMatch[1]);
      let min = singleMatch[2] ? parseInt(singleMatch[2]) : 0;

      if (periodOffset > 0 && hour < 12) hour += periodOffset;

      start = `${padZero(hour)}:${padZero(min)}`;
      const endHour = hour + 1;
      end = `${padZero(endHour > 23 ? 23 : endHour)}:${padZero(min)}`;
      return { start, end };
    }

    const keywordTimes = {
      '早餐': ['07:00', '07:30'],
      '午饭|午餐': ['12:00', '13:00'],
      '晚饭|晚餐|吃饭': ['18:00', '19:00'],
      '睡觉|休息': ['22:00', '23:00'],
      '上班|工作': ['09:00', '18:00'],
      '下班': ['18:00', '18:30']
    };

    for (const [keyword, times] of Object.entries(keywordTimes)) {
      if (new RegExp(keyword).test(text)) {
        return { start: times[0], end: times[1] };
      }
    }

    if (/早上|早晨/.test(text)) {
      return { start: '08:00', end: '09:00' };
    } else if (/上午/.test(text)) {
      return { start: '10:00', end: '11:00' };
    } else if (/中午|午休/.test(text)) {
      return { start: '12:00', end: '13:00' };
    } else if (/下午/.test(text)) {
      return { start: '14:00', end: '15:00' };
    } else if (/傍晚|黄昏/.test(text)) {
      return { start: '17:00', end: '18:00' };
    } else if (/晚上|夜里/.test(text)) {
      return { start: '19:00', end: '20:00' };
    } else if (/深夜|半夜/.test(text)) {
      return { start: '23:00', end: '00:00' };
    }

    return null;
  }

  function padZero(n) {
    return n < 10 ? '0' + n : '' + n;
  }

  function sortSchedule() {
    const withTime = [];
    const withoutTime = [];

    for (const item of scheduleData) {
      if (item.startTime) {
        withTime.push(item);
      } else {
        withoutTime.push(item);
      }
    }

    withTime.sort((a, b) => a.startTime.localeCompare(b.startTime));
    scheduleData = [...withTime, ...withoutTime];
  }

  function renderTable() {
    const tbody = document.getElementById('scheduleTableBody');
    tbody.innerHTML = '';

    if (scheduleData.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="5">
            <div class="empty-state">
              <div class="empty-icon">📝</div>
              <div>暂无日程，快去添加吧！</div>
            </div>
          </td>
        </tr>
      `;
      return;
    }

    scheduleData.forEach((item, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>
          <div style="display: flex; gap: 4px; align-items: center;">
            <input type="time" value="${item.startTime}" onchange="updateTask(${index}, 'startTime', this.value)" style="width: 90px;">
            <span style="color: var(--text-light); font-size: 12px;">-</span>
            <input type="time" value="${item.endTime}" onchange="updateTask(${index}, 'endTime', this.value)" style="width: 90px;">
          </div>
        </td>
        <td>
          <input type="text" value="${escapeHtml(item.task)}" onchange="updateTask(${index}, 'task', this.value)" placeholder="任务内容">
        </td>
        <td>
          <select onchange="updateTask(${index}, 'priority', this.value)">
            <option value="high" ${item.priority === 'high' ? 'selected' : ''}>高</option>
            <option value="medium" ${item.priority === 'medium' ? 'selected' : ''}>中</option>
            <option value="low" ${item.priority === 'low' ? 'selected' : ''}>低</option>
          </select>
        </td>
        <td>
          <input type="text" value="${escapeHtml(item.note || '')}" onchange="updateTask(${index}, 'note', this.value)" placeholder="备注">
        </td>
        <td>
          <div class="table-actions">
            <button class="icon-btn delete" onclick="deleteTask(${index})" title="删除">🗑️</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function renderTimeline() {
    const container = document.getElementById('timelineContainer');
    container.innerHTML = '';

    const morning = [];
    const afternoon = [];
    const evening = [];
    const todo = [];

    for (const item of scheduleData) {
      if (!item.startTime) {
        todo.push(item);
        continue;
      }
      const hour = parseInt(item.startTime.split(':')[0]);
      if (hour < 12) {
        morning.push(item);
      } else if (hour < 18) {
        afternoon.push(item);
      } else {
        evening.push(item);
      }
    }

    if (morning.length > 0) {
      container.innerHTML += renderTimelineSection('🌅 上午 (00:00-12:00)', morning);
    }
    if (afternoon.length > 0) {
      container.innerHTML += renderTimelineSection('☀️ 下午 (12:00-18:00)', afternoon);
    }
    if (evening.length > 0) {
      container.innerHTML += renderTimelineSection('🌙 晚上 (18:00-24:00)', evening);
    }
    if (todo.length > 0) {
      container.innerHTML += `
        <div class="todo-section">
          <div class="timeline-section-title">
            📋 待办事项 (未安排时间)
          </div>
          <div class="timeline">
            ${todo.map(item => renderTimelineItem(item, true)).join('')}
          </div>
        </div>
      `;
    }

    if (scheduleData.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📅</div>
          <div>暂无日程安排</div>
        </div>
      `;
    }
  }

  function renderTimelineSection(title, items) {
    return `
      <div class="timeline-section">
        <div class="timeline-section-title">${title}</div>
        <div class="timeline">
          ${items.map(item => renderTimelineItem(item)).join('')}
        </div>
      </div>
    `;
  }

  function renderTimelineItem(item, isTodo = false) {
    const priorityClass = item.priority || 'medium';
    const duration = item.startTime && item.endTime ? `${item.startTime} - ${item.endTime}` : '未设定时间';
    const displayTime = item.startTime || '';

    return `
      <div class="timeline-item">
        ${!isTodo ? `<div class="timeline-time">${displayTime}</div>` : ''}
        ${!isTodo ? `<div class="timeline-dot ${priorityClass}"></div>` : ''}
        <div class="timeline-card ${priorityClass}">
          <div class="timeline-task">${escapeHtml(item.task)}</div>
          <div class="timeline-duration">⏰ ${duration}
            <span class="priority-tag priority-${priorityClass}" style="margin-left: 8px;">
              ${priorityClass === 'high' ? '高优先级' : priorityClass === 'medium' ? '中优先级' : '低优先级'}
            </span>
          </div>
          ${item.note ? `<div class="timeline-note">📝 ${escapeHtml(item.note)}</div>` : ''}
        </div>
      </div>
    `;
  }

  function switchView(view) {
    currentView = view;
    document.querySelectorAll('.view-tab').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.view-content').forEach(content => content.classList.remove('active'));

    if (view === 'table') {
      document.querySelectorAll('.view-tab')[0].classList.add('active');
      document.getElementById('tableView').classList.add('active');
    } else {
      document.querySelectorAll('.view-tab')[1].classList.add('active');
      document.getElementById('timelineView').classList.add('active');
      renderTimeline();
    }
  }

  function updateTask(index, field, value) {
    if (index >= 0 && index < scheduleData.length) {
      scheduleData[index][field] = value;
      sortSchedule();
      saveToStorage();
      renderTable();
      renderTimeline();
      updateStats();
    }
  }

  function deleteTask(index) {
    if (confirm('确定要删除这个任务吗？')) {
      scheduleData.splice(index, 1);
      saveToStorage();
      renderTable();
      renderTimeline();
      updateStats();
      showToast('已删除任务', 'success');
    }
  }

  function addNewTask() {
    scheduleData.push({
      startTime: '',
      endTime: '',
      task: '新任务',
      priority: 'medium',
      note: ''
    });
    saveToStorage();
    renderTable();
    renderTimeline();
    updateStats();
  }

  function updateStats() {
    const total = scheduleData.length;
    const high = scheduleData.filter(i => i.priority === 'high').length;
    const todo = scheduleData.filter(i => !i.startTime).length;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statHigh').textContent = high;
    document.getElementById('statDone').textContent = todo;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function saveToStorage() {
    try {
      localStorage.setItem('suikouji_schedule', JSON.stringify(scheduleData));
    } catch (e) {
      console.error('保存失败:', e);
    }
  }

  function loadFromStorage() {
    try {
      const data = localStorage.getItem('suikouji_schedule');
      if (data) {
        scheduleData = JSON.parse(data);
      }
    } catch (e) {
      console.error('读取失败:', e);
    }
  }

  function loadDemoData() {
    if (scheduleData.length > 0 && !confirm('当前有数据，确定要加载演示数据吗？')) {
      return;
    }
    scheduleData = JSON.parse(JSON.stringify(demoData));
    sortSchedule();
    saveToStorage();
    renderTable();
    renderTimeline();
    updateStats();
    showToast('已加载演示数据', 'success');
  }

  function clearAll() {
    if (confirm('确定要清空所有日程吗？此操作不可恢复！')) {
      scheduleData = [];
      saveToStorage();
      renderTable();
      renderTimeline();
      updateStats();
      showToast('已清空全部日程', 'success');
    }
  }

  function exportToImage() {
    if (scheduleData.length === 0) {
      showToast('暂无数据可导出', 'error');
      return;
    }

    const canvas = document.getElementById('exportCanvas');
    const ctx = canvas.getContext('2d');

    const padding = 30;
    const titleHeight = 60;
    const headerHeight = 45;
    const rowHeight = 40;
    const colWidths = [50, 100, 100, 250, 80, 150];
    const totalWidth = colWidths.reduce((a, b) => a + b, 0) + padding * 2;
    const totalHeight = padding * 2 + titleHeight + headerHeight + rowHeight * scheduleData.length + 20;

    canvas.width = totalWidth;
    canvas.height = totalHeight;

    ctx.fillStyle = '#F5F9FC';
    ctx.fillRect(0, 0, totalWidth, totalHeight);

    const gradient = ctx.createLinearGradient(0, 0, totalWidth, 0);
    gradient.addColorStop(0, '#4A90D9');
    gradient.addColorStop(1, '#7CB9E8');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, totalWidth, titleHeight + padding);

    ctx.fillStyle = 'white';
    ctx.font = 'bold 22px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('🎙️ 随口记 - 每日日程安排', padding, padding + 30);

    const today = new Date();
    const dateStr = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日`;
    ctx.font = '14px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(dateStr, totalWidth - padding, padding + 30);

    const headerY = padding + titleHeight;
    ctx.fillStyle = '#E8F4FD';
    ctx.fillRect(padding, headerY, totalWidth - padding * 2, headerHeight);

    ctx.strokeStyle = '#DCE8F2';
    ctx.lineWidth = 1;
    ctx.strokeRect(padding, headerY, totalWidth - padding * 2, headerHeight);

    const headers = ['序号', '开始时间', '结束时间', '任务内容', '优先级', '备注'];
    ctx.fillStyle = '#357ABD';
    ctx.font = 'bold 14px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    let x = padding;
    headers.forEach((header, i) => {
      ctx.fillText(header, x + colWidths[i] / 2, headerY + 28);
      if (i < headers.length - 1) {
        x += colWidths[i];
        ctx.beginPath();
        ctx.moveTo(x, headerY);
        ctx.lineTo(x, headerY + headerHeight);
        ctx.strokeStyle = '#DCE8F2';
        ctx.stroke();
      }
    });

    const priorityText = { high: '高', medium: '中', low: '低' };
    const priorityBgColor = { high: '#FADBD8', medium: '#FEF5E7', low: '#D5F5E3' };
    const priorityTextColor = { high: '#C0392B', medium: '#D68910', low: '#1E8449' };

    scheduleData.forEach((item, index) => {
      const rowY = headerY + headerHeight + index * rowHeight;

      ctx.fillStyle = index % 2 === 0 ? 'white' : '#FAFCFE';
      ctx.fillRect(padding, rowY, totalWidth - padding * 2, rowHeight);

      ctx.strokeStyle = '#DCE8F2';
      ctx.strokeRect(padding, rowY, totalWidth - padding * 2, rowHeight);

      ctx.fillStyle = '#2C3E50';
      ctx.font = '13px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(String(index + 1), padding + colWidths[0] / 2, rowY + 25);

      ctx.fillText(item.startTime || '-', padding + colWidths[0] + colWidths[1] / 2, rowY + 25);
      ctx.fillText(item.endTime || '-', padding + colWidths[0] + colWidths[1] + colWidths[2] / 2, rowY + 25);

      ctx.textAlign = 'left';
      ctx.fillStyle = '#2C3E50';
      const taskX = padding + colWidths[0] + colWidths[1] + colWidths[2] + 10;
      const displayTask = item.task.length > 15 ? item.task.substring(0, 15) + '...' : item.task;
      ctx.fillText(displayTask, taskX, rowY + 25);

      const priorityX = padding + colWidths[0] + colWidths[1] + colWidths[2] + colWidths[3] + colWidths[4] / 2;
      ctx.fillStyle = priorityBgColor[item.priority] || '#FEF5E7';
      const priText = priorityText[item.priority] || '中';
      const priWidth = 36;
      ctx.beginPath();
      const priX = priorityX - priWidth / 2;
      const priY = rowY + 12;
      const radius = 10;
      ctx.moveTo(priX + radius, priY);
      ctx.lineTo(priX + priWidth - radius, priY);
      ctx.quadraticCurveTo(priX + priWidth, priY, priX + priWidth, priY + radius);
      ctx.lineTo(priX + priWidth, priY + 16);
      ctx.quadraticCurveTo(priX + priWidth, priY + 20, priX + priWidth - radius, priY + 20);
      ctx.lineTo(priX + radius, priY + 20);
      ctx.quadraticCurveTo(priX, priY + 20, priX, priY + 16);
      ctx.lineTo(priX, priY + radius);
      ctx.quadraticCurveTo(priX, priY, priX + radius, priY);
      ctx.fill();

      ctx.fillStyle = priorityTextColor[item.priority] || '#D68910';
      ctx.textAlign = 'center';
      ctx.font = '12px "Microsoft YaHei", sans-serif';
      ctx.fillText(priText, priorityX, rowY + 26);

      ctx.fillStyle = '#7F8C8D';
      ctx.font = '12px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'left';
      const noteX = padding + colWidths[0] + colWidths[1] + colWidths[2] + colWidths[3] + colWidths[4] + 10;
      const displayNote = (item.note || '-').length > 10 ? (item.note || '-').substring(0, 10) + '...' : (item.note || '-');
      ctx.fillText(displayNote, noteX, rowY + 25);
    });

    ctx.fillStyle = '#7F8C8D';
    ctx.font = '12px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('由「随口记」AI语音日程生成器自动生成', totalWidth / 2, totalHeight - 10);

    const link = document.createElement('a');
    const today2 = new Date();
    const dateStr2 = `${today2.getFullYear()}${padZero(today2.getMonth() + 1)}${padZero(today2.getDate())}`;
    link.download = `随口记日程_${dateStr2}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('日程图片已生成', 'success');
  }

  function showToast(message, type = 'info') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = `toast ${type} show`;
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  }

  document.addEventListener('DOMContentLoaded', init);
</script>

</body>
