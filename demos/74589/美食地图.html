<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寻味中国 - 中国美食地图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/china.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'STKaiti', 'KaiTi', 'Songti SC', 'PingFang SC', 'Microsoft YaHei', serif;
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            height: 100vh;
            color: #3f1f0a;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(234, 88, 12, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(185, 28, 28, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 35px;
            background: linear-gradient(90deg, #b91c1c 0%, #dc2626 50%, #ea580c 100%);
            color: #fffbeb;
            box-shadow: 0 4px 20px rgba(185, 28, 28, 0.25);
            position: relative;
            flex-shrink: 0;
            z-index: 10;
            border-bottom: 3px solid #d97706;
        }
        .header::before {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #d97706, transparent);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-center {
            text-align: center;
        }
        .header h1 { 
            font-size: 28px; 
            margin-bottom: 3px; 
            letter-spacing: 6px; 
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            font-family: 'STKaiti', 'KaiTi', serif;
        }
        .header p { 
            font-size: 12px; 
            opacity: 0.85; 
            letter-spacing: 3px;
        }
        .header-actions {
            display: flex;
            gap: 12px;
        }
        .weather-btn, .header-fridge-btn {
            padding: 9px 18px;
            background: rgba(254, 243, 199, 0.15);
            border: 1.5px solid rgba(217, 119, 6, 0.6);
            border-radius: 20px;
            color: #fffbeb;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            font-family: inherit;
            letter-spacing: 1px;
        }
        .weather-btn:hover, .header-fridge-btn:hover {
            background: rgba(254, 243, 199, 0.25);
            border-color: #fbbf24;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
        }
        .nav-btn {
            padding: 9px 22px;
            border: none;
            border-radius: 18px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            font-family: inherit;
            letter-spacing: 2px;
        }
        .nav-btn.primary {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #7c2d12;
            box-shadow: 0 2px 8px rgba(217, 119, 6, 0.3);
        }
        .nav-btn.secondary {
            background: rgba(254, 243, 199, 0.1);
            color: #fffbeb;
            border: 1px solid rgba(251, 191, 36, 0.4);
        }
        .nav-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4); 
        }
        .nav-btn.secondary:hover {
            background: rgba(254, 243, 199, 0.2);
            border-color: #fbbf24;
        }
        .nav-bar-inner {
            display: flex;
            gap: 12px;
        }
        .container { 
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }
        .map-search {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-box {
            display: flex;
            gap: 8px;
            background: rgba(255, 251, 235, 0.95);
            backdrop-filter: blur(10px);
            padding: 6px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(185, 28, 28, 0.15);
            border: 1px solid rgba(217, 119, 6, 0.3);
        }
        .search-box input {
            width: 240px;
            padding: 8px 16px;
            border: none;
            border-radius: 25px;
            font-size: 13px;
            outline: none;
            background: transparent;
            color: #7c2d12;
            font-family: inherit;
        }
        .search-box input::placeholder {
            color: #b45309;
            opacity: 0.7;
        }
        .search-box button {
            padding: 8px 20px;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #fffbeb;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            font-family: inherit;
            letter-spacing: 1px;
        }
        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(185, 28, 28, 0.4);
        }
        #map-container {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border-radius: 0;
            box-shadow: none;
            margin: 0;
            position: relative;
        }
        .map-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #map-page {
            width: 100%;
            height: 100%;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(63, 31, 10, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 50px rgba(185, 28, 28, 0.3);
            border: 2px solid rgba(217, 119, 6, 0.3);
        }
        @keyframes slideUp {
            from { transform: translateY(60px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
        }
        .modal-close:hover { color: #b91c1c; background: #fef3c7; }
        .food-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 20px; }
        .food-item {
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .food-item:hover { 
            transform: translateY(-4px); 
            border-color: #dc2626; 
            box-shadow: 0 6px 20px rgba(185, 28, 28, 0.2); 
        }
        .food-item .food-name { font-weight: 600; color: #b91c1c; margin-top: 8px; font-family: inherit; }
        .food-detail-img {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #fde68a, #fcd34d);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin-bottom: 15px;
        }
        .food-detail h2 { color: #b91c1c; margin-bottom: 10px; font-family: inherit; letter-spacing: 2px; }
        .food-detail .tag {
            display: inline-block;
            padding: 4px 12px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            color: #92400e;
            border-radius: 15px;
            font-size: 12px;
            margin-right: 8px;
            margin-bottom: 8px;
            border: 1px solid rgba(217, 119, 6, 0.3);
        }
        .food-detail .section-title {
            font-weight: 600;
            color: #7c2d12;
            margin: 15px 0 8px 0;
            padding-left: 12px;
            border-left: 3px solid #dc2626;
            font-family: inherit;
            letter-spacing: 1px;
        }
        .food-detail p { color: #7c2d12; line-height: 1.8; }
        .steps { list-style: none; counter-reset: step; }
        .steps li {
            padding: 10px 0;
            padding-left: 35px;
            position: relative;
            border-bottom: 1px dashed rgba(217, 119, 6, 0.3);
        }
        .steps li::before {
            counter-increment: step;
            content: counter(step);
            position: absolute;
            left: 0;
            top: 8px;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #f59e0b, #dc2626);
            color: #fffbeb;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(185, 28, 28, 0.3);
        }
        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .action-btns button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
            letter-spacing: 2px;
        }
        .btn-collect { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #7c2d12; }
        .btn-collect:hover { background: linear-gradient(135deg, #dc2626, #b91c1c); color: #fffbeb; }
        .btn-collect.active { background: linear-gradient(135deg, #dc2626, #b91c1c); color: #fffbeb; }
        .btn-share { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; border: 1px solid rgba(217, 119, 6, 0.3); }
        .favorites-page, .ranking-page { display: none; }
        .favorites-grid, .ranking-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .favorite-card, .ranking-card {
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(185, 28, 28, 0.08);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            border: 1px solid rgba(217, 119, 6, 0.2);
        }
        .favorite-card:hover, .ranking-card:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 8px 25px rgba(185, 28, 28, 0.15);
            border-color: rgba(220, 38, 38, 0.4);
        }
        .empty-state { text-align: center; padding: 60px; color: #b45309; }
        .empty-state .icon { font-size: 60px; margin-bottom: 15px; }
        .weather-recommendation {
            text-align: center;
        }
        .weather-recommendation .weather-icon {
            font-size: 70px;
            margin-bottom: 15px;
            animation: pulse 2s ease-in-out infinite;
        }
        .weather-recommendation .weather-title {
            font-size: 24px;
            color: #b91c1c;
            margin-bottom: 8px;
            font-family: inherit;
            letter-spacing: 3px;
        }
        .weather-recommendation .weather-desc {
            color: #92400e;
            margin-bottom: 20px;
        }
        .recommended-foods {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }
        .recommended-food {
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .recommended-food:hover {
            border-color: #dc2626;
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(185, 28, 28, 0.15);
        }
        .recommended-food .emoji {
            font-size: 42px;
            margin-bottom: 8px;
        }
        .recommended-food .name {
            font-weight: 600;
            color: #b91c1c;
            margin-bottom: 4px;
            font-family: inherit;
        }
        .recommended-food .reason {
            font-size: 12px;
            color: #92400e;
        }
        .fridge-input-area {
            margin-top: 20px;
        }
        .fridge-input-area textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            border: 2px solid rgba(217, 119, 6, 0.3);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            resize: none;
            background: rgba(255, 251, 235, 0.8);
            transition: all 0.3s;
            color: #7c2d12;
            font-family: inherit;
        }
        .fridge-input-area textarea:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }
        .fridge-input-area .hint {
            font-size: 13px;
            color: #b45309;
            margin-bottom: 10px;
        }
        .fridge-input-area button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #dc2626, #b91c1c);
            color: #fffbeb;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            transition: all 0.3s;
            font-family: inherit;
            letter-spacing: 2px;
        }
        .fridge-input-area button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(185, 28, 28, 0.4);
        }
        .fridge-result {
            margin-top: 20px;
        }
        .fridge-result h3 {
            color: #b91c1c;
            margin-bottom: 15px;
            font-family: inherit;
            letter-spacing: 2px;
        }
        .ranking-header {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .rank-tab {
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            color: #92400e;
            font-family: inherit;
            letter-spacing: 1px;
            border: 1px solid rgba(217, 119, 6, 0.3);
        }
        .rank-tab.active {
            background: linear-gradient(90deg, #dc2626, #b91c1c);
            color: #fffbeb;
            border-color: #dc2626;
            box-shadow: 0 4px 12px rgba(185, 28, 28, 0.3);
        }
        .ranking-card .rank-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
        }
        .ranking-card .rank-badge.top1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: white; }
        .ranking-card .rank-badge.top2 { background: linear-gradient(135deg, #9ca3af, #6b7280); color: white; }
        .ranking-card .rank-badge.top3 { background: linear-gradient(135deg, #fdba74, #f97316); color: white; }
        .ranking-card .rank-badge.other { background: #f3f4f6; color: #666; }
        .ranking-card .stats {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 13px;
            color: #999;
        }
        .ranking-card .stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .discovery-stats {
            position: absolute;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 18px 22px;
            background: linear-gradient(135deg, rgba(255, 251, 235, 0.98), rgba(254, 243, 199, 0.98));
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(185, 28, 28, 0.15);
            z-index: 10;
            min-width: 190px;
            border: 1px solid rgba(217, 119, 6, 0.3);
        }
        .discovery-stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .discovery-stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .discovery-stat .label {
            font-size: 12px;
            color: #92400e;
            font-family: inherit;
            letter-spacing: 1px;
        }
        .discovery-stat .number {
            font-size: 17px;
            font-weight: 600;
            color: #b91c1c;
            font-family: inherit;
        }
        .discovery-stat.highlight .number {
            font-size: 19px;
            color: #dc2626;
            text-shadow: 0 0 10px rgba(220, 38, 38, 0.2);
        }
        .progress-bar {
            width: 100%;
            height: 7px;
            background: linear-gradient(90deg, #fef3c7, #fde68a);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar .progress {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #dc2626);
            border-radius: 4px;
            transition: width 0.5s ease;
            box-shadow: 0 0 8px rgba(220, 38, 38, 0.4);
        }

        @media (max-width: 768px) {
            .search-box input { width: 150px; }
            .nav-btn { padding: 6px 12px; font-size: 12px; }
            .header { padding: 12px 15px; }
            .header h1 { font-size: 20px; }
            .header p { font-size: 10px; }
            .weather-btn, .header-fridge-btn { padding: 6px 12px; font-size: 12px; }
            .recommended-foods { grid-template-columns: 1fr; }
            .discovery-stats { bottom: 10px; right: 10px; min-width: 140px; padding: 8px 12px; }
            .map-search { top: 10px; left: 10px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="nav-bar-inner">
                <button class="nav-btn primary" onclick="showMap()">美食地图</button>
                <button class="nav-btn secondary" onclick="showRanking()">排行榜</button>
                <button class="nav-btn secondary" onclick="showFavorites()">我的收藏</button>
            </div>
        </div>
        <div class="header-center">
            <h1>寻味中国</h1>
            <p>探索中国美食，从一张地图开始</p>
        </div>
        <div class="header-actions">
            <button class="weather-btn" onclick="showWeatherRecommendation()">
                🌤️ 今天吃什么
            </button>
            <button class="header-fridge-btn" onclick="showFridgeModal()">
                🧊 冰箱有什么
            </button>
        </div>
    </div>

    <div class="container">
        <div id="map-page">
            <div class="map-wrapper">
                <div class="map-search">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="搜索美食...如：火锅、烤鸭、胡辣汤">
                        <button onclick="searchFood()">搜索</button>
                    </div>
                </div>
                <div id="map-container"></div>
                <div class="discovery-stats" id="discoveryStats" style="display: none;">
                    <div class="discovery-stat-row">
                        <div class="discovery-stat">
                            <span class="label">已探索</span>
                            <span class="number" id="discoveredCount">0</span>
                        </div>
                        <div class="discovery-stat">
                            <span class="label">总省份</span>
                            <span class="number" id="totalCount">0</span>
                        </div>
                    </div>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress" id="progressFill" style="width: 0%"></div>
                    </div>
                    <div class="discovery-stat-row">
                        <span class="label">探索进度</span>
                        <span class="discovery-stat highlight">
                            <span class="number" id="progressPercent">0%</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <div id="favorites-page" class="favorites-page">
            <h2 style="margin-bottom: 10px; color: #b91c1c; font-family: inherit; letter-spacing: 3px;">我的收藏</h2>
            <div id="favorites-list" class="favorites-grid"></div>
        </div>

        <div id="ranking-page" class="ranking-page">
            <h2 style="margin-bottom: 15px; color: #b91c1c; font-family: inherit; letter-spacing: 3px;">美食排行榜</h2>
            <div class="ranking-header">
                <button class="rank-tab active" onclick="showRank('popular')">🔥 最受欢迎</button>
                <button class="rank-tab" onclick="showRank('collected')">⭐ 收藏最多</button>
                <button class="rank-tab" onclick="showRank('viewed')">👀 浏览最多</button>
            </div>
            <div id="ranking-list" class="ranking-grid"></div>
        </div>
    </div>

    <div class="modal" id="provinceModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('provinceModal')">&times;</span>
            <h2 id="provinceTitle" style="color: #b91c1c; font-family: inherit; letter-spacing: 3px;"></h2>
            <div class="food-list" id="provinceFoodList"></div>
        </div>
    </div>

    <div class="modal" id="foodModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('foodModal')">&times;</span>
            <div id="foodDetailContent"></div>
        </div>
    </div>

    <div class="modal" id="weatherModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('weatherModal')">&times;</span>
            <div id="weatherContent"></div>
        </div>
    </div>

    <div class="modal" id="fridgeModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('fridgeModal')">&times;</span>

                    { name: '肉夹馍', emoji: '🥙', reason: '馍酥肉香，满足味蕾', province: '陕西', index: 0 }
                ]
            }
        };

        function getRandomWeather() {
            const weathers = ['sunny', 'rainy', 'cold', 'cloudy'];
            const temp = Math.floor(Math.random() * 30) + 5;
            if (temp > 28) return 'sunny';
            if (temp < 10) return 'cold';
            if (Math.random() > 0.7) return 'rainy';
            return 'cloudy';
        }

        function showWeatherRecommendation() {
            const weatherType = getRandomWeather();
            const rec = weatherRecommendations[weatherType];
            
            const html = `
                <div class="weather-recommendation">
                    <div class="weather-icon">${rec.icon}</div>
                    <h3 class="weather-title">${rec.title}</h3>
                    <p class="weather-desc">${rec.desc}</p>
                    <div class="recommended-foods">
                        ${rec.foods.map(f => `
                            <div class="recommended-food" onclick="openFoodFromWeather('${f.province}', ${f.index})">
                                <div class="emoji">${f.emoji}</div>
                                <div class="name">${f.name}</div>
                                <div class="reason">${f.reason}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('weatherContent').innerHTML = html;
            document.getElementById('weatherModal').style.display = 'flex';
        }

        function openFoodFromWeather(province, index) {
            closeModal('weatherModal');
            setTimeout(() => showFoodDetail(province, index), 300);
        }

        function showFridgeModal() {
            document.getElementById('fridgeInput').value = '';
            document.getElementById('fridgeResult').innerHTML = '';
            document.getElementById('fridgeModal').style.display = 'flex';
        }

        function matchFridgeFoods() {
            const input = document.getElementById('fridgeInput').value.trim();
            if (!input) {
                alert('请输入冰箱里的食材！');
                return;
            }

            const ingredients = input.split(/[,，、\s]+/).map(i => i.trim()).filter(i => i);
            const matches = [];

            for (const [province, foods] of Object.entries(foodData)) {
                foods.forEach((food, index) => {
                    let matchCount = 0;
                    if (food.ingredients) {
                        food.ingredients.forEach(ing => {
                            ingredients.forEach(inputIng => {
                                if (ing.includes(inputIng) || inputIng.includes(ing)) {
                                    matchCount++;
                                }
                            });
                        });
                    }
                    if (matchCount > 0) {
                        matches.push({
                            ...food,
                            province,
                            index,
                            matchCount,
                            matchedIngredients: food.ingredients ? food.ingredients.filter(ing => 
                                ingredients.some(inputIng => ing.includes(inputIng) || inputIng.includes(ing))
                            ) : []
                        });
                    }
                });
            }

            matches.sort((a, b) => b.matchCount - a.matchCount);

            if (matches.length === 0) {
                document.getElementById('fridgeResult').innerHTML = `
                    <h3>未找到匹配的菜谱 😔</h3>
                    <p style="color: #666;">试试其他食材组合，或者直接浏览地图发现美食！</p>
                `;
                return;
            }

            let html = `<h3>为你推荐 ${matches.length} 道菜谱：</h3>`;
            html += '<div class="food-list">';
            matches.slice(0, 6).forEach(match => {
                html += `
                    <div class="food-item" onclick="openFoodFromFridge('${match.province}', ${match.index})">
                        <div style="font-size:40px;">${match.emoji}</div>
                        <div class="food-name">${match.name}</div>
                        <div style="font-size:12px;color:#999;margin-top:5px;">
                            匹配食材：${match.matchedIngredients.join('、')}
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            
            document.getElementById('fridgeResult').innerHTML = html;
        }

        function openFoodFromFridge(province, index) {
            closeModal('fridgeModal');
            setTimeout(() => showFoodDetail(province, index), 300);
        }

        function initMap() {
            myChart = echarts.init(document.getElementById('map-container'));
            updateDiscoveryStats();
            
            const mapData = Object.keys(foodData).map(province => {
                const isDiscovered = discoveredProvinces.includes(province);
                return {
                    name: province,
                    value: isDiscovered ? 100 : 50,
                    itemStyle: isDiscovered ? {
                        areaColor: '#dc2626',
                        borderColor: '#b91c1c',
                        borderWidth: 2
                    } : {}
                };
            });

            const option = {
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(255, 251, 235, 0.98)',
                    borderColor: 'rgba(217, 119, 6, 0.4)',
                    borderWidth: 1,
                    textStyle: { color: '#7c2d12', fontFamily: 'inherit' },
                    formatter: function(params) {
                        const foods = foodData[params.name];
                        const isDiscovered = discoveredProvinces.includes(params.name);
                        const status = isDiscovered ? '<span style="color:#dc2626;">✓ 已探索</span>' : '<span style="color:#b45309;">未探索</span>';
                        if (foods) {
                            return `<div style="padding:6px;"><strong style="color:#b91c1c;font-size:16px;letter-spacing:1px;">${params.name}</strong> ${status}<br/><span style="color:#92400e;font-size:12px;">代表美食：${foods.map(f => f.name).join('、')}</span></div>`;
                        }
                        return params.name;
                    }
                },
                visualMap: {
                    min: 0,
                    max: 100,
                    show: false,
                    inRange: { color: ['#fde68a', '#dc2626'] }
                },
                series: [{
                    name: '中国美食',
                    type: 'map',
                    map: 'china',
                    roam: true,
                    zoom: 1.2,
                    label: { show: true, fontSize: 10, color: '#7c2d12' },
                    emphasis: {
                        label: { show: true, fontSize: 14, fontWeight: 'bold', color: '#7f1d1d' },
                        itemStyle: { areaColor: '#ea580c' }
                    },
                    itemStyle: {
                        areaColor: '#fef3c7',
                        borderColor: '#d97706',
                        borderWidth: 1,
                        borderType: 'solid'
                    },
                    data: mapData,
                    animationDurationUpdate: 800,
                    animationEasingUpdate: 'cubicOut'
                }]
            };
            myChart.setOption(option);

            myChart.on('click', function(params) {
                discoverProvince(params.name);
                showProvinceFoods(params.name);
            });
        }

        function discoverProvince(province) {
            if (!discoveredProvinces.includes(province)) {
                discoveredProvinces.push(province);
                localStorage.setItem('discoveredProvinces', JSON.stringify(discoveredProvinces));
                updateMapColors();
                updateDiscoveryStats();
            }
        }

        function updateMapColors() {
            if (!myChart) return;
            
            const mapData = Object.keys(foodData).map(province => {
                const isDiscovered = discoveredProvinces.includes(province);
                return {
                    name: province,
                    value: isDiscovered ? 100 : 50,
                    itemStyle: isDiscovered ? {
                        areaColor: '#dc2626',
                        borderColor: '#b91c1c',
                        borderWidth: 2
                    } : {}
                };
            });

            myChart.setOption({
                series: [{
                    data: mapData
                }]
            });
        }

        function updateDiscoveryStats() {
            const total = Object.keys(foodData).length;
            const discovered = discoveredProvinces.length;
            const percent = Math.round((discovered / total) * 100);

            document.getElementById('discoveryStats').style.display = 'flex';
            document.getElementById('discoveredCount').textContent = discovered;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('progressPercent').textContent = percent + '%';
            document.getElementById('progressFill').style.width = percent + '%';
        }

        function showProvinceFoods(province) {
            const foods = foodData[province] || defaultFoods.map(f => ({...f, name: province + f.name.slice(2)}));
            document.getElementById('provinceTitle').textContent = province + '美食';
            const listHtml = foods.map((food, index) => `
                <div class="food-item" onclick="showFoodDetail('${province}', ${index})">
                    <div style="font-size:40px;">${food.emoji}</div>
                    <div class="food-name">${food.name}</div>
                </div>
            `).join('');
            document.getElementById('provinceFoodList').innerHTML = listHtml;
            document.getElementById('provinceModal').style.display = 'flex';
        }

        function showFoodDetail(province, index) {
            const foods = foodData[province] || defaultFoods;
            const food = foods[index];
            
            if (!foodClicks[food.name]) {
                foodClicks[food.name] = 0;
            }
            foodClicks[food.name]++;
            localStorage.setItem('foodClicks', JSON.stringify(foodClicks));

            const isFav = favorites.some(f => f.name === food.name);
            const detailHtml = `
                <div class="food-detail">
                    <div class="food-detail-img">${food.emoji}</div>
                    <h2>${food.name}</h2>
                    <div style="margin: 10px 0;">
                        ${food.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    <div class="section-title">简介</div>
                    <p>${food.desc}</p>
                    ${food.ingredients ? `
                        <div class="section-title">主要食材</div>
                        <p>${food.ingredients.join('、')}</p>
                    ` : ''}
                    <div class="section-title">制作步骤</div>
                    <ol class="steps">
                        ${food.steps.map(step => `<li>${step}</li>`).join('')}
                    </ol>
                    <div class="action-btns">
                        <button class="btn-collect ${isFav ? 'active' : ''}" onclick="toggleFavorite('${province}', ${index}, this)">
                            ${isFav ? '已收藏' : '收藏'}
                        </button>
                        <button class="btn-share" onclick="shareFood('${food.name}')">分享</button>
                    </div>
                </div>
            `;
            document.getElementById('foodDetailContent').innerHTML = detailHtml;
            document.getElementById('foodModal').style.display = 'flex';
        }

        function toggleFavorite(province, index, btn) {
            const foods = foodData[province] || defaultFoods;
            const food = foods[index];
            const existingIndex = favorites.findIndex(f => f.name === food.name);
            if (existingIndex >= 0) {
                favorites.splice(existingIndex, 1);
                btn.textContent = '收藏';
                btn.classList.remove('active');
            } else {
                favorites.push({...food, province});
                btn.textContent = '已收藏';
                btn.classList.add('active');
            }
            localStorage.setItem('foodFavorites', JSON.stringify(favorites));
        }

        function shareFood(name) {
            const text = `我在「爱吃才会赢」发现了一道美食：${name}，快来一起探索中国美食地图吧！`;
            if (navigator.share) {
                navigator.share({ title: '爱吃才会赢', text: text });
            } else {
                alert('分享内容已复制：' + text);
            }
        }

        function searchFood() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return;
            for (const [province, foods] of Object.entries(foodData)) {
                const found = foods.find(f => f.name.includes(keyword));
                if (found) {
                    const index = foods.indexOf(found);
                    showFoodDetail(province, index);
                    return;
                }
            }
            alert('暂未找到相关美食，试试搜索：火锅、烤鸭、胡辣汤...');
        }

        function showMap() {
            document.getElementById('map-page').style.display = 'block';
            document.getElementById('favorites-page').style.display = 'none';
            document.getElementById('ranking-page').style.display = 'none';
            if (myChart) myChart.resize();
        }

        function showFavorites() {
            document.getElementById('map-page').style.display = 'none';
            document.getElementById('favorites-page').style.display = 'block';
            document.getElementById('ranking-page').style.display = 'none';
            renderFavorites();
        }

        function renderFavorites() {
            const container = document.getElementById('favorites-list');
            if (favorites.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="icon">📭</div>
                        <p>还没有收藏任何美食</p>
                        <p style="font-size: 14px; margin-top: 8px;">快去地图上探索吧！</p>
                    </div>
                `;
                return;
            }
            container.innerHTML = favorites.map(f => `
                <div class="favorite-card" onclick="showFoodDetail('${f.province}', ${foodData[f.province].findIndex(food => food.name === f.name)})">
                    <div style="font-size: 40px; margin-bottom: 10px;">${f.emoji}</div>
                    <h3 style="color: #b91c1c; margin-bottom: 5px; font-family: inherit; letter-spacing: 1px;">${f.name}</h3>
                    <p style="color: #b45309; font-size: 13px;">${f.province} · ${f.tags.join(' ')}</p>
                    <p style="color: #7c2d12; font-size: 14px; margin-top: 8px; line-height: 1.6;">${f.desc}</p>
                </div>
            `).join('');
        }

        function showRanking() {
            document.getElementById('map-page').style.display = 'none';
            document.getElementById('favorites-page').style.display = 'none';
            document.getElementById('ranking-page').style.display = 'block';
            showRank('popular');
        }

        function showRank(type) {
            document.querySelectorAll('.rank-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.rank-tab[onclick="showRank('${type}')"]`).classList.add('active');

            const allFoods = [];
            for (const [province, foods] of Object.entries(foodData)) {
                foods.forEach((food, index) => {
                    const clicks = foodClicks[food.name] || 0;
                    const collected = favorites.filter(f => f.name === food.name).length;
                    allFoods.push({
                        ...food,
                        province,
                        index,
                        clicks,
                        collected,
                        score: clicks * 2 + collected * 5
                    });
                });
            }

            let sortedFoods;
            if (type === 'popular') {
                sortedFoods = allFoods.sort((a, b) => b.score - a.score);
            } else if (type === 'collected') {
                sortedFoods = allFoods.sort((a, b) => b.collected - a.collected);
            } else {
                sortedFoods = allFoods.sort((a, b) => b.clicks - a.clicks);
            }

            const container = document.getElementById('ranking-list');
            container.innerHTML = sortedFoods.slice(0, 9).map((food, idx) => {
                const rankClass = idx === 0 ? 'top1' : idx === 1 ? 'top2' : idx === 2 ? 'top3' : 'other';
                return `
                    <div class="ranking-card" onclick="showFoodDetail('${food.province}', ${food.index})">
                        <div class="rank-badge ${rankClass}">${idx + 1}</div>
                        <div style="font-size: 45px; margin-bottom: 12px;">${food.emoji}</div>
                        <h3 style="color: #b91c1c; margin-bottom: 5px; font-size: 18px; font-family: inherit; letter-spacing: 1px;">${food.name}</h3>
                        <p style="color: #b45309; font-size: 13px; margin-bottom: 8px;">${food.province}</p>
                        <p style="color: #7c2d12; font-size: 14px; line-height: 1.5;">${food.desc}</p>
                        <div class="stats">
                            <span>🔥 ${food.clicks} 浏览</span>
                            <span>⭐ ${food.collected} 收藏</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchFood();
        });

        window.addEventListener('load', initMap);
        window.addEventListener('resize', () => myChart && myChart.resize());
    </script>
</body>
</html>
