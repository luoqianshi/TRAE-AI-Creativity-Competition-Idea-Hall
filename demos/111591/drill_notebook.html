<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drill Client - 刷题客户端</title>
<style>
:root {
  --bg: #fdf6ed;
  --surface: #fffaf3;
  --border: #e8dcc8;
  --text: #3a3226;
  --text-secondary: #8c7b6b;
  --primary: #c0853d;
  --primary-hover: #a06d2e;
  --correct: #6b8e5a;
  --wrong: #c95a4a;
  --note-bg: #fff9e6;
  --shadow: 0 2px 12px rgba(60, 40, 20, 0.08);
  --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
}

#app {
  display: flex;
  width: 100%;
  min-height: 100vh;
}

.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  transition: margin-right 0.3s ease;
}

.header {
  padding: 20px 32px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.5px;
}

.header h1 span {
  color: var(--primary);
}

.header-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

.progress-bar-wrap {
  width: 180px;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 3px;
  transition: width 0.3s ease;
}

.progress-text {
  font-size: 13px;
  color: var(--text-secondary);
  min-width: 60px;
  text-align: right;
}

.content {
  flex: 1;
  padding: 24px 32px 32px;
  display: flex;
  flex-direction: column;
}

.category-select {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 32px;
}

.category-select h2 {
  font-size: 24px;
  font-weight: 600;
  color: var(--text);
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  max-width: 720px;
  width: 100%;
}

.category-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
}

.category-card:hover {
  border-color: var(--primary);
  box-shadow: var(--shadow);
  transform: translateY(-2px);
}

.category-card .icon {
  font-size: 36px;
  margin-bottom: 12px;
}

.category-card .name {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 6px;
}

.category-card .count {
  font-size: 13px;
  color: var(--text-secondary);
}

.quiz-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  max-width: 720px;
  margin: 0 auto;
  width: 100%;
}

.question-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.question-num {
  font-size: 14px;
  color: var(--text-secondary);
  font-weight: 500;
}

.question-type-badge {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--note-bg);
  color: var(--primary);
  border: 1px solid var(--border);
}

.question-text {
  font-size: 20px;
  font-weight: 600;
  line-height: 1.6;
  margin-bottom: 28px;
  color: var(--text);
}

.options-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 28px;
}

.option-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border: 2px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s ease;
  background: var(--surface);
  font-size: 16px;
}

.option-item:hover {
  border-color: var(--primary);
  background: var(--note-bg);
}

.option-item.selected {
  border-color: var(--primary);
  background: #fdf0dd;
}

.option-item.correct {
  border-color: var(--correct);
  background: #edf5e6;
}

.option-item.wrong {
  border-color: var(--wrong);
  background: #fce8e5;
}

.option-letter {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
  color: var(--text-secondary);
}

.option-item.selected .option-letter {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

.option-item.correct .option-letter {
  background: var(--correct);
  border-color: var(--correct);
  color: #fff;
}

.option-item.wrong .option-letter {
  background: var(--wrong);
  border-color: var(--wrong);
  color: #fff;
}

.option-text {
  flex: 1;
  line-height: 1.5;
}

.fill-input {
  width: 100%;
  padding: 14px 18px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 16px;
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s ease;
  margin-bottom: 28px;
}

.fill-input:focus {
  border-color: var(--primary);
}

.feedback-box {
  padding: 16px 20px;
  border-radius: 10px;
  margin-bottom: 20px;
  font-size: 15px;
  line-height: 1.5;
  display: none;
}

.feedback-box.show {
  display: block;
}

.feedback-box.correct-fb {
  background: #edf5e6;
  border: 1px solid var(--correct);
  color: #4a6e3a;
}

.feedback-box.wrong-fb {
  background: #fce8e5;
  border: 1px solid var(--wrong);
  color: #8c3a2e;
}

.action-buttons {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.btn {
  padding: 10px 24px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.15s ease;
  font-weight: 600;
  background: var(--surface);
  color: var(--text);
}

.btn:hover {
  border-color: var(--primary);
  background: var(--note-bg);
}

.btn-primary {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.btn-primary:hover {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
}

.btn-note {
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-back {
  border: none;
  background: transparent;
  color: var(--text-secondary);
  padding: 8px 0;
  font-size: 14px;
  cursor: pointer;
  transition: color 0.15s;
  align-self: flex-start;
  margin-bottom: 16px;
}

.btn-back:hover {
  color: var(--primary);
}

/* Sidebar */
.note-sidebar {
  width: 0;
  overflow: hidden;
  background: var(--note-bg);
  border-left: 1px solid var(--border);
  transition: width 0.3s ease;
  display: flex;
  flex-direction: column;
}

.note-sidebar.open {
  width: 360px;
}

.note-sidebar-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-width: 360px;
}

.note-sidebar-header h3 {
  font-size: 16px;
  font-weight: 600;
}

.note-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: all 0.15s;
}

.note-close:hover {
  background: var(--border);
  color: var(--text);
}

.note-sidebar-body {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  min-width: 360px;
}

.note-question-ref {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  padding: 8px 12px;
  background: var(--surface);
  border-radius: 8px;
  border: 1px solid var(--border);
}

.note-textarea {
  width: 100%;
  height: calc(100vh - 200px);
  border: 2px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  font-size: 15px;
  font-family: inherit;
  line-height: 1.6;
  resize: none;
  outline: none;
  background: var(--surface);
  color: var(--text);
  transition: border-color 0.15s;
}

.note-textarea:focus {
  border-color: var(--primary);
}

.shortcut-hint {
  font-size: 12px;
  color: var(--text-secondary);
  padding: 4px 8px;
  background: var(--surface);
  border-radius: 4px;
  border: 1px solid var(--border);
}

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  gap: 8px;
}

.empty-state .empty-icon {
  font-size: 48px;
  margin-bottom: 8px;
}

.empty-state p {
  font-size: 15px;
}

.summary {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.summary h2 {
  font-size: 28px;
  font-weight: 700;
}

.summary .score {
  font-size: 56px;
  font-weight: 700;
  color: var(--primary);
}

.summary .detail {
  font-size: 16px;
  color: var(--text-secondary);
}

@media (max-width: 900px) {
  .category-grid {
    grid-template-columns: 1fr 1fr;
  }
  .note-sidebar.open {
    width: 280px;
  }
  .note-sidebar-header,
  .note-sidebar-body {
    min-width: 280px;
  }
}

@media (max-width: 640px) {
  .category-grid {
    grid-template-columns: 1fr;
  }
  .header {
    padding: 16px 16px 0;
  }
  .content {
    padding: 16px 16px 24px;
  }
}
</style>
</head>
<body>
<div id="app">
  <div class="main-area" id="mainArea">
    <div class="header">
      <h1><span>Drill</span> Client</h1>
      <div class="header-actions" id="headerActions"></div>
    </div>
    <div class="content" id="contentArea"></div>
  </div>
  <div class="note-sidebar" id="noteSidebar">
    <div class="note-sidebar-header">
      <h3>Notebook</h3>
      <button class="note-close" id="noteClose" title="Close (Ctrl+N)">x</button>
    </div>
    <div class="note-sidebar-body" id="noteBody"></div>
  </div>
</div>

<script>

const STORAGE_KEY = 'drill-client-data';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch {
    return {};
  }
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getNotesKey(questionId) {
  return 'notes_' + questionId;
}

function getProgressKey(categoryKey) {
  return 'progress_' + categoryKey;
}

let state = loadState();
let currentCategory = null;
let currentIndex = 0;
let questions = [];
let answered = false;
let selectedOption = -1;
let fillAnswer = '';
let quizCompleted = false;

const $mainArea = document.getElementById('mainArea');
const $contentArea = document.getElementById('contentArea');
const $headerActions = document.getElementById('headerActions');
const $noteSidebar = document.getElementById('noteSidebar');
const $noteBody = document.getElementById('noteBody');
const $noteClose = document.getElementById('noteClose');

function getProgress() {
  if (!currentCategory) return { done: 0, total: 0, correct: 0 };
  const key = getProgressKey(currentCategory);
  return state[key] || { done: 0, total: questions.length, correct: 0, answered: [] };
}

function markAnswered(correct) {
  const key = getProgressKey(currentCategory);
  if (!state[key]) {
    state[key] = { done: 0, total: questions.length, correct: 0, answered: [] };
  }
  const q = questions[currentIndex];
  if (!state[key].answered.includes(q.id)) {
    state[key].answered.push(q.id);
    state[key].done = state[key].answered.length;
    if (correct) state[key].correct++;
  }
  saveState(state);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderCategorySelect() {
  quizCompleted = false;
  currentCategory = null;
  currentIndex = 0;
  questions = [];
  answered = false;
  selectedOption = -1;
  fillAnswer = '';
  $headerActions.innerHTML = '';
  $noteBody.innerHTML = '';

  let html = '<div class="category-select"><h2>Choose a question bank</h2><div class="category-grid">';
  for (const [key, bank] of Object.entries(QUESTION_BANKS)) {
    const icons = { gongkao: 'document', kaoyan: 'study', word: 'book' };
    const progress = state[getProgressKey(key)] || { done: 0, total: bank.questions.length };
    html += '<div class="category-card" data-category="' + key + '">';
    html += '<div class="icon">' + ({ document: 'document', study: 'study', book: 'book' }[icons[key]]) + '</div>';
    html += '<div class="name">' + escapeHtml(bank.name) + '</div>';
    html += '<div class="count">' + progress.done + ' / ' + bank.questions.length + ' questions completed</div>';
    html += '</div>';
  }
  html += '</div></div>';
  $contentArea.innerHTML = html;

  document.querySelectorAll('.category-card').forEach(card => {
    card.addEventListener('click', () => startQuiz(card.dataset.category));
  });
}

function startQuiz(categoryKey) {
  currentCategory = categoryKey;
  const bank = QUESTION_BANKS[categoryKey];
  questions = bank.questions;
  const progress = getProgress();

  if (progress.done >= questions.length) {
    quizCompleted = true;
    renderSummary();
    return;
  }

  currentIndex = progress.answered.length;
  for (let i = 0; i < questions.length; i++) {
    if (!progress.answered.includes(questions[i].id)) {
      currentIndex = i;
      break;
    }
  }

  answered = false;
  selectedOption = -1;
  fillAnswer = '';
  renderQuizHeader();
  renderQuestion();
  renderNotePanel();
}

function renderQuizHeader() {
  const p = getProgress();
  const pct = questions.length > 0 ? Math.round((p.done / questions.length) * 100) : 0;
  $headerActions.innerHTML =
    '<span class="shortcut-hint">Ctrl+N: notebook</span>' +
    '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div>' +
    '<span class="progress-text">' + p.correct + '/' + p.done + ' correct</span>';
}

function renderQuestion() {
  const q = questions[currentIndex];
  let html = '<div class="quiz-area">';
  html += '<button class="btn-back" id="btnBack">Back to category</button>';
  html += '<div class="question-header">';
  html += '<span class="question-num">Question ' + (currentIndex + 1) + ' / ' + questions.length + '</span>';
  html += '<span class="question-type-badge">' + (q.type === 'single' ? 'Single Choice' : 'Fill in the Blank') + '</span>';
  html += '</div>';
  html += '<div class="question-text">' + escapeHtml(q.question) + '</div>';

  if (q.type === 'single') {
    html += '<div class="options-list">';
    const letters = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, i) => {
      let cls = 'option-item';
      if (answered && i === q.answer) cls += ' correct';
      if (answered && i === selectedOption && i !== q.answer) cls += ' wrong';
      if (!answered && i === selectedOption) cls += ' selected';
      html += '<div class="' + cls + '" data-index="' + i + '">';
      html += '<span class="option-letter">' + letters[i] + '</span>';
      html += '<span class="option-text">' + escapeHtml(opt) + '</span>';
      html += '</div>';
    });
    html += '</div>';
  } else {
    html += '<input type="text" class="fill-input" id="fillInput" placeholder="Enter your answer..." value="' + escapeHtml(fillAnswer) + '" ' + (answered ? 'disabled' : '') + '>';
  }

  html += '<div class="feedback-box" id="feedbackBox"></div>';
  html += '<div class="action-buttons">';
  if (!answered) {
    html += '<button class="btn btn-primary" id="btnSubmit">Submit</button>';
  } else if (currentIndex < questions.length - 1 || hasUnanswered()) {
    html += '<button class="btn btn-primary" id="btnNext">Next Question</button>';
  }
  if (!answered) {
    html += '<button class="btn btn-note" id="btnToggleNote">&#9998; Notebook (Ctrl+N)</button>';
  }
  html += '</div>';
  html += '</div>';

  $contentArea.innerHTML = html;

  if (!answered && q.type === 'single') {
    document.querySelectorAll('.option-item').forEach(item => {
      item.addEventListener('click', () => {
        selectedOption = parseInt(item.dataset.index);
        renderQuestion();
      });
    });
  }

  if (!answered && q.type === 'fill') {
    const input = document.getElementById('fillInput');
    if (input) {
      input.addEventListener('input', () => {
        fillAnswer = input.value;
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitAnswer();
      });
      setTimeout(() => input.focus(), 0);
    }
  }

  const btnSubmit = document.getElementById('btnSubmit');
  if (btnSubmit) btnSubmit.addEventListener('click', submitAnswer);

  const btnNext = document.getElementById('btnNext');
  if (btnNext) btnNext.addEventListener('click', nextQuestion);

  const btnToggleNote = document.getElementById('btnToggleNote');
  if (btnToggleNote) btnToggleNote.addEventListener('click', toggleNote);

  const btnBack = document.getElementById('btnBack');
  if (btnBack) btnBack.addEventListener('click', renderCategorySelect);

  if (answered) {
    const fb = document.getElementById('feedbackBox');
    if (fb) {
      const correct = isCorrect();
      fb.className = 'feedback-box show ' + (correct ? 'correct-fb' : 'wrong-fb');
      fb.innerHTML = correct
        ? 'Correct! Well done!'
        : '<strong>Incorrect.</strong><br>' + (q.options ? 'Correct answer: ' + q.options[q.answer] : 'Correct answer: ' + escapeHtml(q.answer)) + '<br><br>' + escapeHtml(q.explanation);
    }
  }

  if (answered && !document.getElementById('btnNext')) {
    const allDone = !hasUnanswered();
    if (allDone && !quizCompleted) {
      quizCompleted = true;
      setTimeout(() => renderSummary(), 500);
    }
  }
}

function hasUnanswered() {
  const p = getProgress();
  return p.answered.length < questions.length;
}

function isCorrect() {
  const q = questions[currentIndex];
  if (q.type === 'single') return selectedOption === q.answer;
  return fillAnswer.trim().toLowerCase() === q.answer.toLowerCase();
}

function submitAnswer() {
  if (answered) return;
  const q = questions[currentIndex];
  if (q.type === 'single' && selectedOption < 0) return;
  if (q.type === 'fill' && fillAnswer.trim() === '') return;
  answered = true;
  markAnswered(isCorrect());
  renderQuizHeader();
  renderQuestion();
  renderNotePanel();
}

function nextQuestion() {
  const p = getProgress();
  const remaining = questions.filter((_, i) => !p.answered.includes(questions[i].id));
  if (remaining.length === 0) {
    quizCompleted = true;
    renderSummary();
    return;
  }
  currentIndex = questions.findIndex(q => !p.answered.includes(q.id));
  answered = false;
  selectedOption = -1;
  fillAnswer = '';
  renderQuestion();
  renderQuizHeader();
  renderNotePanel();
}

function renderSummary() {
  const p = getProgress();
  const total = p.total || questions.length;
  const correct = p.correct || 0;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  let html = '<div class="summary">';
  html += '<h2>Quiz Complete!</h2>';
  html += '<div class="score">' + pct + '%</div>';
  html += '<div class="detail">' + correct + ' / ' + total + ' correct</div>';
  html += '<div class="action-buttons">';
  html += '<button class="btn btn-primary" id="btnRetry">Retry</button>';
  html += '<button class="btn" id="btnHome">Back to Categories</button>';
  html += '</div></div>';
  $contentArea.innerHTML = html;

  document.getElementById('btnRetry').addEventListener('click', () => {
    const key = getProgressKey(currentCategory);
    delete state[key];
    saveState(state);
    quizCompleted = false;
    startQuiz(currentCategory);
  });
  document.getElementById('btnHome').addEventListener('click', renderCategorySelect);
}

function renderNotePanel() {
  const q = questions[currentIndex];
  const noteKey = getNotesKey(q.id);
  const savedNote = state[noteKey] || '';
  let html = '<div class="note-question-ref">Question ' + (currentIndex + 1) + ': ' + escapeHtml(q.question.substring(0, 60)) + (q.question.length > 60 ? '...' : '') + '</div>';
  html += '<textarea class="note-textarea" id="noteTextarea" placeholder="Write your notes here... e.g., key concepts, solution tips, common mistakes...">' + escapeHtml(savedNote) + '</textarea>';
  $noteBody.innerHTML = html;

  const textarea = document.getElementById('noteTextarea');
  if (textarea) {
    textarea.addEventListener('input', () => {
      state[noteKey] = textarea.value;
      saveState(state);
    });
  }
}

function toggleNote() {
  $noteSidebar.classList.toggle('open');
  if ($noteSidebar.classList.contains('open') && currentCategory) {
    renderNotePanel();
  }
}

$noteClose.addEventListener('click', () => {
  $noteSidebar.classList.remove('open');
});

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'n') {
    e.preventDefault();
    toggleNote();
  }
  if (e.key === 'Enter' && !e.ctrlKey && currentCategory && !answered) {
    const activeEl = document.activeElement;
    if (!activeEl || activeEl.tagName !== 'TEXTAREA') {
      e.preventDefault();
      submitAnswer();
    }
  }
});

renderCategorySelect();
</script>
</body>
</html>
