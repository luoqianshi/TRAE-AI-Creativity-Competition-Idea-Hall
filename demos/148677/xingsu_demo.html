<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星系App - 交互原型</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif; background: #050510; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

.phone-frame {
  width: 375px; height: 812px; background: #0A0A1A; border-radius: 44px;
  position: relative; overflow: hidden; box-shadow: 0 0 0 12px #1a1a2e, 0 0 60px rgba(124,77,255,0.3);
}

/* 状态栏 */
.status-bar {
  height: 44px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; color: #fff; font-size: 14px; font-weight: 600;
  position: relative; z-index: 100; pointer-events: none;
}
.status-bar .time { font-size: 15px; }
.status-bar .icons { display: flex; gap: 5px; align-items: center; }
.status-bar .icons svg { width: 16px; height: 16px; fill: #fff; }

/* 页面容器 */
.page-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
.page { position: absolute; top: 0; left: 0; right: 0; bottom: 83px; overflow-y: auto; display: none; -webkit-overflow-scrolling: touch; }
.page.active { display: block; }

/* 底部导航 */
.bottom-nav {
  position: absolute; bottom: 0; left: 0; right: 0; height: 83px;
  background: rgba(10,10,26,0.95); backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: flex-start; padding-top: 8px; z-index: 100;
}
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding-top: 4px; }
.nav-item svg { width: 26px; height: 26px; stroke: rgba(255,255,255,0.4); transition: all 0.3s; }
.nav-item.active svg { stroke: #7C4DFF; }
.nav-item span { font-size: 10px; color: rgba(255,255,255,0.4); transition: all 0.3s; }
.nav-item.active span { color: #7C4DFF; font-weight: 600; }
.nav-item .indicator { position: absolute; top: 0; width: 24px; height: 2px; background: #7C4DFF; border-radius: 0 0 4px 4px; opacity: 0; transition: opacity 0.3s; }
.nav-item.active .indicator { opacity: 1; }

/* ===== 拍照页 ===== */
#page-camera { background: #0A0A1A; flex-direction: column; align-items: center; justify-content: center; padding: 40px 32px; }
#page-camera.active { display: flex; }
.camera-icon-wrap { margin-bottom: 40px; }
.camera-icon-wrap .circle-bg {
  width: 100px; height: 100px; border-radius: 50%;
  background: linear-gradient(135deg, #7C4DFF, #536DFE);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 40px rgba(124,77,255,0.4); animation: pulse 3s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { transform: scale(1); box-shadow: 0 0 40px rgba(124,77,255,0.4); } 50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(124,77,255,0.6); } }
.camera-icon-wrap svg { width: 48px; height: 48px; stroke: #fff; fill: none; stroke-width: 1.5; }
.camera-title { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 8px; }
.camera-subtitle { font-size: 13px; color: rgba(255,255,255,0.5); text-align: center; margin-bottom: 48px; line-height: 1.5; }
.action-btn {
  width: 100%; height: 56px; border-radius: 16px; border: none;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 16px; font-weight: 600; color: #fff; cursor: pointer; transition: all 0.2s; margin-bottom: 16px;
}
.action-btn:active { transform: scale(0.97); }
.action-btn.primary { background: #7C4DFF; box-shadow: 0 4px 20px rgba(124,77,255,0.3); }
.action-btn.secondary { background: #448AFF; box-shadow: 0 4px 20px rgba(68,138,255,0.3); }
.action-btn svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2; }

/* 处理中遮罩 */
.processing-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(5,5,16,0.95); z-index: 200;
  display: none; flex-direction: column; align-items: center; justify-content: center;
}
.processing-overlay.show { display: flex; }
.processing-spinner { width: 60px; height: 60px; border: 3px solid rgba(124,77,255,0.2); border-top-color: #7C4DFF; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.processing-text { color: rgba(255,255,255,0.7); font-size: 15px; margin-top: 24px; }
.processing-sub { color: rgba(255,255,255,0.3); font-size: 13px; margin-top: 8px; }
.processing-step { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: rgba(255,255,255,0.4); font-size: 13px; }
.processing-step .dot { width: 6px; height: 6px; border-radius: 50%; background: #7C4DFF; }
.processing-step.done .dot { background: #4CAF50; }
.processing-step.done { color: rgba(255,255,255,0.6); }

/* ===== 历史页 ===== */
#page-history { background: #0A0A1A; }
.history-header {
  position: sticky; top: 0; z-index: 50; padding: 8px 20px 12px;
  background: linear-gradient(180deg, rgba(10,10,26,0.95), rgba(10,10,26,0.7));
  backdrop-filter: blur(20px);
  display: flex; align-items: center; justify-content: space-between;
}
.history-header h1 { color: #fff; font-size: 20px; font-weight: 700; }
.history-header .count { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }
.refresh-btn { background: rgba(255,255,255,0.08); border: none; border-radius: 10px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.refresh-btn svg { width: 18px; height: 18px; stroke: rgba(255,255,255,0.6); fill: none; stroke-width: 2; }

.hist-search-bar { display: flex; gap: 8px; padding: 0 16px 10px; box-sizing: border-box; width: 100%; }
.hist-search-field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: #1A1A2E; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 8px 12px; box-sizing: border-box; }
.hist-search-field svg { width: 16px; height: 16px; stroke: rgba(255,255,255,0.4); fill: none; stroke-width: 2; flex-shrink: 0; }
.hist-search-field input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: #fff; font-size: 13px; }
.hist-search-field input::placeholder { color: rgba(255,255,255,0.3); }

.history-list { padding: 8px 16px 20px; }
.history-card {
  background: #1A1A2E; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06);
  display: flex; overflow: hidden; margin-bottom: 12px; cursor: pointer; transition: all 0.2s;
}
.history-card:active { transform: scale(0.98); }
.history-card .thumb { width: 80px; height: 80px; flex-shrink: 0; background: #2A2A3E; display: flex; align-items: center; justify-content: center; }
.history-card .thumb .thumb-color { width: 80px; height: 80px; }
.history-card .info { flex: 1; padding: 10px 12px; overflow: hidden; }
.history-card .info .name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.history-card .info .name { font-size: 15px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.history-card .info .badge { font-size: 10px; padding: 2px 8px; border-radius: 8px; background: rgba(124,77,255,0.2); color: #7C4DFF; flex-shrink: 0; }
.history-card .info .badge.gray { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.3); }
.history-card .info .story-preview { font-size: 12px; color: rgba(255,255,255,0.4); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
.history-card .info .meta { display: flex; gap: 12px; margin-top: 6px; font-size: 11px; color: rgba(255,255,255,0.3); }
.history-card .info .meta-item { display: flex; align-items: center; gap: 3px; }
.history-card .info .meta-item svg { width: 12px; height: 12px; stroke: rgba(255,255,255,0.3); fill: none; stroke-width: 2; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; }
.empty-state svg { width: 56px; height: 56px; stroke: rgba(255,255,255,0.2); fill: none; stroke-width: 1; }
.empty-state p { color: rgba(255,255,255,0.3); font-size: 15px; margin-top: 16px; }
.empty-state span { color: rgba(255,255,255,0.2); font-size: 13px; margin-top: 6px; }

/* ===== 详情页 ===== */
.detail-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 300;
  background: #0A0A1A; display: none; flex-direction: column; overflow-y: auto;
}
.detail-overlay.show { display: flex; }
.detail-header { display: flex; align-items: center; padding: 8px 16px; position: sticky; top: 0; background: #0A0A1A; z-index: 10; }
.detail-back { background: rgba(255,255,255,0.08); border: none; border-radius: 10px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.detail-back svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2; }
.detail-header h2 { flex: 1; text-align: center; color: #fff; font-size: 17px; font-weight: 600; margin-right: 36px; }

.detail-image { width: 100%; height: 260px; display: flex; align-items: center; justify-content: center; }
.detail-image .gradient-bg { width: 100%; height: 100%; }

.detail-body { padding: 16px 20px 40px; }
.detail-name-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.detail-name-row h3 { color: #fff; font-size: 22px; font-weight: 700; }
.upload-badge { display: flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 12px; background: rgba(124,77,255,0.15); }
.upload-badge svg { width: 14px; height: 14px; stroke: #7C4DFF; fill: none; stroke-width: 2; }
.upload-badge span { color: #7C4DFF; font-size: 13px; }

.section-label { color: #7C4DFF; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.detail-story { color: rgba(255,255,255,0.7); font-size: 15px; line-height: 1.8; margin-bottom: 24px; }

/* AI朗诵 */
.ai-voice-row { display: flex; gap: 16px; margin-bottom: 24px; }
.voice-card { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s; position: relative; }
.voice-card:active { transform: scale(0.95); }
.voice-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.voice-avatar-sweet { background: linear-gradient(135deg, #FF6B9D, #C44CE8); }
.voice-avatar-magnetic { background: linear-gradient(135deg, #FF8C42, #E83E3E); }
.voice-avatar .play-overlay { display: flex; position: absolute; inset: 0; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff; font-size: 13px; align-items: center; justify-content: center; }
.voice-card.playing .voice-avatar .play-overlay { background: rgba(124,77,255,0.85); }
.voice-card.playing .voice-avatar { box-shadow: 0 0 12px rgba(124,77,255,0.5); }
.voice-name { color: rgba(255,255,255,0.8); font-size: 12px; }

.edit-row { background: #1A1A2E; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.2s; }
.edit-row:active { border-color: rgba(124,77,255,0.3); }
.edit-row svg { width: 20px; height: 20px; stroke: #7C4DFF; fill: none; stroke-width: 2; flex-shrink: 0; }
.edit-row .edit-label { flex: 1; }
.edit-row .edit-label .label-title { color: rgba(255,255,255,0.5); font-size: 12px; margin-bottom: 2px; }
.edit-row .edit-label .label-value { color: #fff; font-size: 15px; }
.edit-row .chevron { width: 18px; height: 18px; stroke: rgba(255,255,255,0.3); fill: none; stroke-width: 2; }

.upload-btn {
  width: 100%; height: 50px; border-radius: 14px; border: none;
  background: #7C4DFF; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; margin-top: 16px;
}
.upload-btn:active { transform: scale(0.97); }
.upload-btn:disabled { background: #2A2A3E; color: rgba(255,255,255,0.3); }
.upload-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
.upload-btn.uploading { background: #2A2A3E; }
.upload-btn.uploading .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #7C4DFF; border-radius: 50%; animation: spin 0.8s linear infinite; }

.delete-btn {
  width: 100%; height: 44px; border-radius: 14px; border: 1px solid rgba(255,82,82,0.3);
  background: transparent; color: #FF5252; font-size: 15px; cursor: pointer; margin-top: 12px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.delete-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

/* ===== 星系页 ===== */
#page-galaxy { background: #020208; overflow: hidden; }
#galaxy-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

.galaxy-header {
  position: absolute; top: 44px; left: 0; right: 0; z-index: 50;
  padding: 12px 20px;
  background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent);
  display: flex; align-items: center; justify-content: space-between;
}
.galaxy-header h1 { color: #fff; font-size: 20px; font-weight: 700; }
.galaxy-header .right-area { display: flex; align-items: center; gap: 12px; }
.galaxy-header .story-count { font-size: 12px; color: rgba(255,255,255,0.5); padding: 4px 12px; background: rgba(255,255,255,0.08); border-radius: 12px; }
.galaxy-header .search-btn { background: transparent; border: none; cursor: pointer; padding: 4px; }
.galaxy-header .search-btn svg { width: 22px; height: 22px; stroke: rgba(255,255,255,0.6); fill: none; stroke-width: 2; }

.story-cards-wrap {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 60;
  padding-bottom: 83px;
}
.story-cards-gradient {
  height: 80px;
  background: linear-gradient(180deg, transparent, #020208 80%);
  margin-bottom: -20px;
}
.story-cards-scroll {
  display: flex; gap: 12px; padding: 0 16px 16px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
}
.story-cards-scroll::-webkit-scrollbar { display: none; }
.story-card {
  flex-shrink: 0; width: 300px; scroll-snap-align: center;
  background: rgba(26,26,46,0.9); backdrop-filter: blur(20px);
  border-radius: 20px; border: 1px solid rgba(255,255,255,0.06);
  padding: 16px; display: flex; gap: 14px; cursor: pointer; transition: all 0.3s;
}
.story-card.active { border-color: rgba(124,77,255,0.5); box-shadow: 0 0 30px rgba(124,77,255,0.15); }
.story-card .meteor-dot {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  position: relative;
}
.story-card .meteor-dot::after {
  content: ''; position: absolute; right: 100%; top: 50%;
  width: 30px; height: 2px; border-radius: 1px;
  background: inherit; opacity: 0.3; filter: blur(2px);
  transform: translateY(-50%);
}
.story-card .card-content { flex: 1; overflow: hidden; }
.story-card .card-title { color: #fff; font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.story-card .card-preview { color: rgba(255,255,255,0.4); font-size: 12px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.story-card .card-meta { display: flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 11px; color: rgba(255,255,255,0.25); }
.story-card .card-meta svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; }

/* 星系故事弹窗 */
.galaxy-modal {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 300;
  background: #0A0A1A; border-radius: 24px 24px 0 0;
  transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  max-height: 80%; overflow-y: auto;
}
.galaxy-modal.show { transform: translateY(0); }
.galaxy-modal .drag-handle { display: none; }
.galaxy-modal .modal-planet { display: flex; align-items: center; gap: 12px; padding: 0 24px; margin-bottom: 16px; }
.galaxy-modal .modal-planet .orb { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 16px currentColor; }
.galaxy-modal .modal-planet h3 { color: #fff; font-size: 22px; font-weight: 700; }
.galaxy-modal .modal-image-wrap { padding: 0 24px; margin-bottom: 20px; }
.galaxy-modal .modal-image { width: 100%; height: 200px; border-radius: 16px; overflow: hidden; }
.galaxy-modal .modal-section { padding: 0 24px; margin-bottom: 20px; }
.galaxy-modal .modal-label { color: #7C4DFF; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.galaxy-modal .modal-text { color: rgba(255,255,255,0.7); font-size: 15px; line-height: 1.8; }
.galaxy-modal .modal-time-row { display: flex; align-items: center; gap: 8px; }
.galaxy-modal .modal-time-row svg { width: 16px; height: 16px; stroke: rgba(255,255,255,0.5); fill: none; stroke-width: 2; }
.galaxy-modal .modal-time-row span { color: rgba(255,255,255,0.7); font-size: 14px; }
.galaxy-modal .modal-location { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #1A1A2E; border-radius: 14px; }
.galaxy-modal .modal-location svg { width: 16px; height: 16px; stroke: #7C4DFF; fill: none; stroke-width: 2; flex-shrink: 0; }
.galaxy-modal .modal-location span { color: rgba(255,255,255,0.7); font-size: 14px; }
.modal-backdrop { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 250; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.modal-backdrop.show { opacity: 1; pointer-events: auto; }

/* ===== 星系搜索面板 ===== */
.search-panel {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 310;
  background: #0A0A1A; border-radius: 24px 24px 0 0;
  transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  max-height: 85%; display: flex; flex-direction: column;
  border-top: 1px solid rgba(124,77,255,0.2);
}
.search-panel.show { transform: translateY(0); }
.search-panel .drag-handle { display: none; }
.search-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 20px 12px; }
.search-header h3 { color: #fff; font-size: 18px; font-weight: 700; }
.search-close-btn { background: rgba(255,255,255,0.08); border: none; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.search-close-btn svg { width: 16px; height: 16px; stroke: rgba(255,255,255,0.6); fill: none; stroke-width: 2; }

/* 当前定位条 */
.search-location-bar { margin: 0 20px 12px; padding: 10px 14px; background: rgba(124,77,255,0.08); border: 1px solid rgba(124,77,255,0.15); border-radius: 12px; display: flex; align-items: center; gap: 8px; }
.search-location-bar svg { width: 16px; height: 16px; stroke: #7C4DFF; fill: none; stroke-width: 2; flex-shrink: 0; }
.search-location-bar span { flex: 1; color: rgba(255,255,255,0.7); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-location-bar .relocate-btn { background: transparent; border: 1px solid rgba(124,77,255,0.3); border-radius: 8px; padding: 4px 10px; color: #7C4DFF; font-size: 12px; cursor: pointer; white-space: nowrap; }

/* 搜索Tab */
.search-input-wrap { padding: 0 20px; }
.search-tab-bar { display: flex; gap: 8px; margin-bottom: 12px; }
.search-tab { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 8px 16px; color: rgba(255,255,255,0.5); font-size: 13px; cursor: pointer; transition: all 0.2s; }
.search-tab.active { background: rgba(124,77,255,0.15); border-color: rgba(124,77,255,0.4); color: #7C4DFF; font-weight: 600; }

/* 搜索输入框 */
.search-input-box { display: flex; align-items: center; gap: 8px; background: #1A1A2E; border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; }
.search-input-box svg { width: 18px; height: 18px; stroke: rgba(255,255,255,0.4); fill: none; stroke-width: 2; flex-shrink: 0; }
.search-input-box input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 15px; }
.search-input-box input::placeholder { color: rgba(255,255,255,0.3); }
.search-input-box .clear-btn { background: rgba(255,255,255,0.1); border: none; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.search-input-box .clear-btn svg { width: 12px; height: 12px; stroke: rgba(255,255,255,0.5); }

/* 距离筛选 */
.radius-filter { display: flex; align-items: center; gap: 8px; padding: 0 20px 12px; }
.radius-label { color: rgba(255,255,255,0.4); font-size: 13px; flex-shrink: 0; }
.radius-options { display: flex; gap: 6px; flex-wrap: wrap; }
.radius-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 5px 12px; color: rgba(255,255,255,0.5); font-size: 12px; cursor: pointer; transition: all 0.2s; }
.radius-btn.active { background: rgba(124,77,255,0.15); border-color: rgba(124,77,255,0.4); color: #7C4DFF; }

/* 搜索结果 */

.search-empty { text-align: center; color: rgba(255,255,255,0.3); font-size: 14px; padding: 40px 0; }
.load-more-btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 14px; margin-top: 8px; background: rgba(124,77,255,0.08); border: 1px solid rgba(124,77,255,0.2); border-radius: 14px; color: #7C4DFF; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }

.load-more-btn svg { width: 16px; height: 16px; stroke: #7C4DFF; fill: none; stroke-width: 2; }
.result-summary { text-align: center; color: rgba(255,255,255,0.25); font-size: 12px; padding: 12px 0 4px; }

/* Toast */
.toast {

}

/* 日期选择器 */

  { dynasty: '明', name: '青花瓷瓶', image: 'assets/artifact_qinghuaci.jpg', story: '明代永乐年间的青花瓷瓶精品，瓶身绘有缠枝莲纹，青花发色浓艳。此瓶曾辗转流落民间数百年，最终被一位收藏家在江南古镇的旧货市场中偶然发现，经过精心修复后重现昔日光彩。瓶底刻有"大明永乐年制"楷书款识，是研究明代景德镇制瓷工艺的重要实物资料。', address: '江西省景德镇市珠山区御窑厂遗址', lat: 29.2687, lng: 117.1784, captureTime: '2025-03-15T14:30:00' },

/// 格式化显示名：朝代·名称
function displayName(item) {
  return item.dynasty ? `${item.dynasty}·${item.name}` : item.name;
}

// ===== 页面切换 =====
function switchPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');

  if (page === 'history') renderHistory();
  // 延迟一帧，等页面 display:block 生效后 canvas 才能获取正确尺寸
  if (page === 'galaxy') {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        initGalaxy();
      });
    });
  }
}

// ===== 拍照页逻辑 =====
function takePhoto(source) {
  const overlay = document.getElementById('processing-overlay');
  const stepsDiv = document.getElementById('processing-steps');
  overlay.classList.add('show');

  // 模拟处理步骤
  stepsDiv.innerHTML = '';
  const steps = [
    { text: source === 'camera' ? '正在拍摄照片...' : '正在读取图片...', delay: 600 },
    { text: 'AI正在解析图片...', delay: 1400 },
    { text: '正在生成故事内容...', delay: 800 },
    { text: '正在保存到本地数据库...', delay: 500 },
  ];

  let stepIndex = 0;
  function nextStep() {
    if (stepIndex >= steps.length) {
      // 完成 - 创建记录
      finishProcessing();
      return;
    }
    const step = steps[stepIndex];
    document.getElementById('processing-text').textContent = step.text;

    // 添加步骤UI
    const div = document.createElement('div');
    div.className = 'processing-step';
    div.innerHTML = `<div class="dot"></div><span>${step.text}</span>`;
    stepsDiv.appendChild(div);

    setTimeout(() => {
      div.classList.add('done');
      stepIndex++;
      nextStep();
    }, step.delay);
  }

  nextStep();
}

function finishProcessing() {
  // 随机选一个mock故事
  const mock = MOCK_STORIES[Math.floor(Math.random() * MOCK_STORIES.length)];
  const color = COLORS[Math.floor(Math.random() * COLORS.length)];

  const record = {
    id: Date.now(),
    imagePath: '',
    image: mock.image,
    color: color,
    dynasty: mock.dynasty,
    name: mock.name,
    story: mock.story,
    captureTime: new Date().toISOString(),
    latitude: 30.0 + Math.random() * 10,
    longitude: 120.0 + Math.random() * 10,
    locationName: null,
    isUploaded: false,
  };

  records.unshift(record);

  setTimeout(() => {
    document.getElementById('processing-overlay').classList.remove('show');
    showToast('解析完成: ' + displayName(mock));
    switchPage('history');
  }, 500);
}

// ===== 历史页逻辑 =====
function renderHistory() {
  const list = document.getElementById('history-list');

  // 读取搜索条件
  const nameQuery = (document.getElementById('hist-name-input')?.value || '').trim().toLowerCase();
  const locQuery = (document.getElementById('hist-loc-input')?.value || '').trim().toLowerCase();

  // 筛选记录
  let filtered = records.filter(r => {
    if (nameQuery) {
      const matchName = r.name.toLowerCase().includes(nameQuery) ||
             r.story.toLowerCase().includes(nameQuery) ||
             (r.dynasty && r.dynasty.toLowerCase().includes(nameQuery));
      if (!matchName) return false;
    }
    if (locQuery) {
      const matchLoc = (r.locationName && r.locationName.toLowerCase().includes(locQuery));
      if (!matchLoc) return false;
    }
    return true;
  });

  document.getElementById('history-count').textContent = filtered.length + ' 条记录';

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        <p>${records.length === 0 ? '暂无记录' : '未找到匹配的记录'}</p>
        <span>${records.length === 0 ? '去拍照页面记录你的故事吧' : '试试其他关键词'}</span>
      </div>`;
    return;
  }

  list.innerHTML = filtered.map(r => {
    const time = formatTime(r.captureTime);
    const colorStr = `rgb(${r.color.r},${r.color.g},${r.color.b})`;
    const thumbHtml = r.image
      ? `<img src="${r.image}" style="width:80px;height:80px;object-fit:cover;border-radius:0;" />`
      : `<div class="thumb-color" style="background: linear-gradient(135deg, ${colorStr}, ${colorStr}88);"></div>`;
    return `
      <div class="history-card" onclick="openDetail(${r.id})">
        <div class="thumb">
          ${thumbHtml}
        </div>
        <div class="info">
          <div class="name-row">
            <div class="name">${displayName(r)}</div>
            ${r.isUploaded ? '<div class="badge">已上传</div>' : '<div class="badge gray">未上传</div>'}
          </div>
          <div class="story-preview">${r.story}</div>
          <div class="meta">
            <div class="meta-item">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              ${time}
            </div>
            ${r.locationName ? `<div class="meta-item"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${r.locationName}</div>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

function formatTime(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

  document.getElementById('detail-name').textContent = displayName(r);

function closeDetail() {

// ===== AI朗诵逻辑 =====
let selectedVoice = null;
let isReciting = false;

function resetVoice() {
  stopRecitation();
  selectedVoice = null;
  document.querySelectorAll('.voice-card').forEach(c => {
    c.classList.remove('selected', 'playing');
    c.querySelector('.play-overlay').textContent = '▶';
  });
}

function toggleVoice(voice) {
  const cards = document.querySelectorAll('.voice-card');
  if (selectedVoice === voice) {
    // 同一智能体：切换播放/暂停
    if (isReciting) {
      stopRecitation();
    } else {
      playRecitation(voice);
    }
  } else {
    // 切换到另一个智能体
    stopRecitation();
    selectedVoice = voice;
    cards.forEach(c => {
      c.classList.remove('selected', 'playing');
      c.querySelector('.play-overlay').textContent = '▶';
      if (c.dataset.voice === voice) {
        c.classList.add('selected');
        c.querySelector('.play-overlay').textContent = '▶';
      }
    });
  }
}

function playRecitation(voice) {
  const r = records.find(x => x.id === currentDetailId);
  if (!r || !r.story) return;

  if (!('speechSynthesis' in window)) {
    showToast('浏览器不支持语音朗诵');
    return;
  }

  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(displayName(r) + '。' + r.story);
  utter.lang = 'zh-CN';

  if (voice === 'sweet') {
    utter.pitch = 1.6;   // 温柔甜美：高音调
    utter.rate = 0.9;
    utter.volume = 1;
  } else {
    utter.pitch = 0.6;   // 热血磁性：低音调
    utter.rate = 1.05;
    utter.volume = 1;
  }

  utter.onend = () => {
    isReciting = false;
    const card = document.querySelector(`.voice-card[data-voice="${voice}"]`);
    if (card) {
      card.classList.remove('playing');
      card.querySelector('.play-overlay').textContent = '▶';
    }
  };

  utter.onerror = () => {
    isReciting = false;
    const card = document.querySelector(`.voice-card[data-voice="${voice}"]`);
    if (card) {
      card.classList.remove('playing');
      card.querySelector('.play-overlay').textContent = '▶';
    }
  };

  window.speechSynthesis.speak(utter);
  isReciting = true;

  const card = document.querySelector(`.voice-card[data-voice="${voice}"]`);
  if (card) {
    card.classList.add('playing');
    card.querySelector('.play-overlay').textContent = '⏸';
  }
}

function stopRecitation() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  isReciting = false;
  document.querySelectorAll('.voice-card.playing').forEach(c => {
    c.classList.remove('playing');
    c.querySelector('.play-overlay').textContent = '▶';
  });
}

// ===== 星系页 - 流星星空 =====
// 每个上传的故事 = 一颗流星，拖着彩色尾巴划过夜空
let galaxyMeteors = [];   // 故事流星（可点击）
let ambientMeteors = [];  // 环境装饰流星
let bgStars = null;
let parallaxX = 0, parallaxY = 0;

function initGalaxy() {
  canvas = document.getElementById('galaxy-canvas');
  ctx = canvas.getContext('2d');

  // 收集所有已上传的故事
  const uploadedRecords = records.filter(r => r.isUploaded);
  galaxyMeteors = [];

  // mock故事数据 + 用户上传记录 = 流星
  MOCK_STORIES.forEach((mock, i) => {
    galaxyMeteors.push(createMeteor({
      id: 'mock_' + i,
      dynasty: mock.dynasty,
      name: mock.name,
      image: mock.image,
      story: mock.story,
      color: COLORS[i % COLORS.length],
      latitude: mock.lat,
      longitude: mock.lng,
      address: mock.address,
      captureTime: mock.captureTime,
    }));
  });

  uploadedRecords.forEach(r => {
    galaxyMeteors.push(createMeteor({
      id: 'record_' + r.id,
      dynasty: r.dynasty,
      name: r.name,
      image: r.image,
      story: r.story,
      color: r.color,
      latitude: r.latitude,
      longitude: r.longitude,
      address: r.locationName || '未知位置',
      captureTime: r.captureTime,
    }));
  });

  document.getElementById('galaxy-count').textContent = galaxyMeteors.length + '颗流星';

  if (animationId) cancelAnimationFrame(animationId);
  bgStars = null;
  resizeCanvas();
  animate();
  setupGalaxyGestures();
}

/// 创建一颗故事流星
function createMeteor(data) {
  const angle = Math.PI * 0.15 + Math.random() * Math.PI * 0.25; // 15~40度，斜向右下
  const speed = 0.6 + Math.random() * 1.2;
  return {
    ...data,
    x: -50 + Math.random() * 200,
    y: -50 + Math.random() * 150,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    tailLength: 80 + Math.random() * 120,
    glowRadius: 5 + Math.random() * 4,
    trail: [],         // 尾迹点列表
    paused: false,
    screenX: 0,
    screenY: 0,
  };
}

function resizeCanvas() {
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = rect.width > 0 ? rect.width : 375;
  const h = rect.height > 0 ? rect.height : 729;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
}

function animate() {
  if (!canvas) return;
  const w = canvas.width / (window.devicePixelRatio || 1);
  const h = canvas.height / (window.devicePixelRatio || 1);
  const cx = w / 2, cy = h / 2;

  // 清屏（带轻微残影，让流星有拖尾感）
  ctx.fillStyle = 'rgba(2, 2, 8, 0.25)';
  ctx.fillRect(0, 0, w, h);

  // 1. 背景星星（带视差）
  drawBackgroundStars(w, h);

  // 2. 星轨弧线
  drawStarTrails(w, h, cx, cy);

  // 3. 环境装饰流星（随机划过的小流星）
  updateAmbientMeteors(w, h);
  drawAmbientMeteors();

  // 4. 故事流星（核心！每个上传的故事）
  updateStoryMeteors(w, h);
  drawStoryMeteors();

  animationId = requestAnimationFrame(animate);
}

/// 背景星星
function drawBackgroundStars(w, h) {
  if (!bgStars) {
    bgStars = [];
    for (let i = 0; i < 350; i++) {
      bgStars.push({
        x: Math.random() * (w + 100) - 50,
        y: Math.random() * (h + 100) - 50,
        r: Math.random() * 1.3,
        brightness: 0.15 + Math.random() * 0.85,
        twinkleSpeed: 0.01 + Math.random() * 0.04,
        twinkleOffset: Math.random() * Math.PI * 2,
        depth: 0.3 + Math.random() * 0.7, // 视差深度
      });
    }
  }

  const t = Date.now() * 0.001;
  bgStars.forEach(s => {
    const twinkle = 0.5 + 0.5 * Math.sin(t * s.twinkleSpeed * 10 + s.twinkleOffset);
    ctx.globalAlpha = s.brightness * twinkle;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x + parallaxX * s.depth, s.y + parallaxY * s.depth, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

/// 星轨弧线
function drawStarTrails(w, h, cx, cy) {
  if (starTrails.length === 0) {
    const trailColors = [
      'rgba(255,215,0,0.12)', 'rgba(255,179,71,0.1)',
      'rgba(135,206,235,0.08)', 'rgba(255,255,255,0.06)',
      'rgba(255,105,180,0.08)', 'rgba(124,77,255,0.1)',
    ];
    for (let i = 0; i < 50; i++) {
      starTrails.push({
        angle: Math.random() * Math.PI * 2,
        radius: 50 + Math.random() * Math.max(w, h) * 0.6,
        arcLength: 0.15 + Math.random() * 0.7,
        color: trailColors[Math.floor(Math.random() * trailColors.length)],
        width: 0.4 + Math.random() * 1.2,
      });
    }
  }

  const t = Date.now() * 0.00008;
  starTrails.forEach(trail => {
    const offset = (trail.angle + t) % (Math.PI * 2);
    ctx.strokeStyle = trail.color;
    ctx.lineWidth = trail.width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx + parallaxX * 0.3, cy + parallaxY * 0.3, trail.radius, offset, offset + trail.arcLength);
    ctx.stroke();
  });
}

/// 更新故事流星位置
function updateStoryMeteors(w, h) {
  galaxyMeteors.forEach(m => {
    if (m.paused) return;

    // 记录尾迹点
    m.trail.push({ x: m.x, y: m.y });
    if (m.trail.length > 30) m.trail.shift();

    // 移动
    m.x += m.vx;
    m.y += m.vy;

    // 记录屏幕坐标（用于点击检测）
    m.screenX = m.x;
    m.screenY = m.y;

    // 超出屏幕后从左侧/上方重新进入
    if (m.x > w + m.tailLength || m.y > h + m.tailLength) {
      m.x = -m.tailLength - Math.random() * 100;
      m.y = -50 + Math.random() * h * 0.4;
      m.trail = [];
    }
  });
}

/// 绘制故事流星
function drawStoryMeteors() {
  galaxyMeteors.forEach(m => {
    const c = m.color;
    const colorStr = `rgb(${c.r},${c.g},${c.b})`;

    // --- 绘制长尾巴 ---
    if (m.trail.length > 1) {
      for (let i = 0; i < m.trail.length - 1; i++) {
        const p1 = m.trail[i];
        const p2 = m.trail[i + 1];
        const alpha = (i / m.trail.length) * 0.8;
        const width = (i / m.trail.length) * 4 + 0.5;

        ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${alpha})`;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      // 尾巴末端到头部的渐变线
      const tailStart = m.trail[0];
      const grad = ctx.createLinearGradient(tailStart.x, tailStart.y, m.x, m.y);
      grad.addColorStop(0, `rgba(${c.r},${c.g},${c.b},0)`);
      grad.addColorStop(0.6, `rgba(${c.r},${c.g},${c.b},0.4)`);
      grad.addColorStop(1, `rgba(${c.r},${c.g},${c.b},0.9)`);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tailStart.x, tailStart.y);
      ctx.lineTo(m.x, m.y);
      ctx.stroke();
    }

    // --- 绘制头部光晕 ---
    const glowGrad = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.glowRadius * 4);
    glowGrad.addColorStop(0, `rgba(${c.r},${c.g},${c.b},0.6)`);
    glowGrad.addColorStop(0.4, `rgba(${c.r},${c.g},${c.b},0.2)`);
    glowGrad.addColorStop(1, `rgba(${c.r},${c.g},${c.b},0)`);
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.glowRadius * 4, 0, Math.PI * 2);
    ctx.fill();

    // --- 绘制头部亮点 ---
    const headGrad = ctx.createRadialGradient(m.x - 1, m.y - 1, 0, m.x, m.y, m.glowRadius);
    headGrad.addColorStop(0, '#fff');
    headGrad.addColorStop(0.5, `rgb(${Math.min(255,c.r+80)},${Math.min(255,c.g+80)},${Math.min(255,c.b+80)})`);
    headGrad.addColorStop(1, colorStr);
    ctx.fillStyle = headGrad;
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.glowRadius, 0, Math.PI * 2);
    ctx.fill();

    // --- 绘制名称标签 ---
    const label = displayName(m);
    ctx.font = 'bold 12px -apple-system, "Noto Sans SC", sans-serif';
    ctx.textAlign = 'left';
    // 标签背景
    const textW = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.roundRect(m.x + 12, m.y - 10, textW + 16, 22, 8);
    ctx.fill();
    // 标签文字
    ctx.fillStyle = colorStr;
    ctx.fillText(label, m.x + 20, m.y + 5);
  });
}

/// 环境装饰流星（随机小流星）
function updateAmbientMeteors(w, h) {
  if (Math.random() < 0.03 && ambientMeteors.length < 5) {
    const angle = Math.PI * 0.1 + Math.random() * Math.PI * 0.3;
    ambientMeteors.push({
      x: Math.random() * w,
      y: -10,
      vx: Math.cos(angle) * (2 + Math.random() * 3),
      vy: Math.sin(angle) * (2 + Math.random() * 3),
      life: 1.0,
      length: 30 + Math.random() * 50,
    });
  }

  ambientMeteors = ambientMeteors.filter(s => {
    s.x += s.vx;
    s.y += s.vy;
    s.life -= 0.015;
    return s.life > 0 && s.y < h + 50;
  });
}

function drawAmbientMeteors() {
  ambientMeteors.forEach(s => {
    const tailX = s.x - s.vx * s.length / 4;
    const tailY = s.y - s.vy * s.length / 4;

    const grad = ctx.createLinearGradient(tailX, tailY, s.x, s.y);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.7, `rgba(255,255,255,${s.life * 0.4})`);
    grad.addColorStop(1, `rgba(255,255,255,${s.life * 0.8})`);

    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(s.x, s.y);
    ctx.stroke();

    ctx.fillStyle = `rgba(255,255,255,${s.life * 0.3})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 2, 0, Math.PI * 2);
    ctx.fill();
  });
}

/// 手势：拖动产生视差 + 点击流星
function setupGalaxyGestures() {
  if (!canvas) return;
  let isDragging = false;

  // 触摸
  canvas.ontouchstart = (e) => {
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const tapX = touch.clientX - rect.left;
    const tapY = touch.clientY - rect.top;
    lastTouchX = touch.clientX;
    lastTouchY = touch.clientY;
    isDragging = false;

    // 检测是否点击了流星
    checkMeteorTap(tapX, tapY);
  };
  canvas.ontouchmove = (e) => {
    if (lastTouchX !== null) {
      const dx = e.touches[0].clientX - lastTouchX;
      const dy = e.touches[0].clientY - lastTouchY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDragging = true;
      parallaxX += dx * 0.5;
      parallaxY += dy * 0.5;
      parallaxX = Math.max(-80, Math.min(80, parallaxX));
      parallaxY = Math.max(-80, Math.min(80, parallaxY));
      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
    }
    e.preventDefault();
  };
  canvas.ontouchend = () => {
    lastTouchX = lastTouchY = null;
  };

  // 鼠标（PC预览）
  canvas.onmousedown = (e) => {
    const rect = canvas.getBoundingClientRect();
    const tapX = e.clientX - rect.left;
    const tapY = e.clientY - rect.top;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
    isDragging = false;

    checkMeteorTap(tapX, tapY);
  };
  canvas.onmousemove = (e) => {
    if (lastTouchX !== null) {
      const dx = e.clientX - lastTouchX;
      const dy = e.clientY - lastTouchY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDragging = true;
      parallaxX += dx * 0.5;
      parallaxY += dy * 0.5;
      parallaxX = Math.max(-80, Math.min(80, parallaxX));
      parallaxY = Math.max(-80, Math.min(80, parallaxY));
      lastTouchX = e.clientX;
      lastTouchY = e.clientY;
    }
  };
  canvas.onmouseup = () => {
    lastTouchX = lastTouchY = null;
  };
}

/// 检测点击是否命中流星
function checkMeteorTap(tapX, tapY) {
  for (let i = 0; i < galaxyMeteors.length; i++) {
    const m = galaxyMeteors[i];
    const dist = Math.sqrt((tapX - m.screenX) ** 2 + (tapY - m.screenY) ** 2);
    if (dist < 25) {
      // 暂停该流星，弹出故事
      m.paused = true;
      setTimeout(() => { m.paused = false; }, 5000);
      showGalaxyModal(i);
      return;
    }
  }
}

/// 点击流星弹出详情
function showGalaxyModal(index) {
  const m = galaxyMeteors[index];
  if (!m) return;
  const c = m.color;
  const colorStr = `rgb(${c.r},${c.g},${c.b})`;

  // 颜色球 + 标题
  document.getElementById('modal-orb').style.background = colorStr;
  document.getElementById('modal-orb').style.color = colorStr;
  document.getElementById('modal-title').textContent = displayName(m);

  // 图片
  const modalImg = document.getElementById('modal-image');
  if (m.image) {
    modalImg.style.background = '';
    modalImg.innerHTML = `<img src="${m.image}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;" />`;
  } else {
    modalImg.innerHTML = '';
    modalImg.style.background = `linear-gradient(135deg, ${colorStr}, ${colorStr}33)`;
  }

  // 故事
  document.getElementById('modal-story').textContent = m.story;

  // 时间
  document.getElementById('modal-time').textContent = m.captureTime ? formatTime(m.captureTime) : '未知时间';

  // 位置（显示地址，不是经纬度）
  document.getElementById('modal-location').textContent = m.address || '未知位置';

  document.getElementById('galaxy-modal').classList.add('show');
  document.getElementById('galaxy-backdrop').classList.add('show');
}

function closeGalaxyModal() {
  document.getElementById('galaxy-modal').classList.remove('show');
  document.getElementById('galaxy-backdrop').classList.remove('show');
}

// ===== 星系搜索功能 =====
let searchTab = 'name';         // 'name' | 'location'
let userLocation = null;        // { lat, lng, name }
let searchPage = 0;             // 当前页码
const SEARCH_PAGE_SIZE = 5;     // 每页显示条数
let searchResultsCache = [];    // 缓存当前搜索全部结果

/// 打开搜索面板
function openGalaxySearch() {

  document.getElementById('search-backdrop').classList.add('show');

}

function closeGalaxySearch() {
  document.getElementById('search-panel').classList.remove('show');
  document.getElementById('search-backdrop').classList.remove('show');
}

/// 检测用户当前位置（模拟）
function detectUserLocation() {

/// 切换搜索Tab
function switchSearchTab(tab) {
  searchTab = tab;
  document.querySelectorAll('.search-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  const input = document.getElementById('search-input');

/// 执行搜索
let geocodeTimer = null;
let isGeocoding = false;

function doSearch() {
  const query = document.getElementById('search-input').value.trim();
  document.getElementById('search-clear').style.display = query ? 'flex' : 'none';

  if (searchTab === 'name') {
    // 按名称搜索（含朝代）
    searchResultsCache = galaxyMeteors.filter(m => {
      if (!query) return true;
      return m.name.toLowerCase().includes(query) ||
             m.story.toLowerCase().includes(query) ||
             (m.dynasty && m.dynasty.toLowerCase().includes(query));
    });
    searchPage = 0;
    renderSearchResults();
  } else {
    // 按地点搜索 — 调用地理编码API获取坐标，再按距离匹配
    if (!query) {
      // 无输入时，用用户当前位置排序
      searchResultsCache = [...galaxyMeteors];
      if (userLocation) {
        searchResultsCache.forEach(m => {
          m._distance = calcDistance(userLocation.lat, userLocation.lng, m.latitude, m.longitude);
        });
        searchResultsCache.sort((a, b) => (a._distance || 9999) - (b._distance || 9999));
      }
      searchPage = 0;
      renderSearchResults();
      return;
    }

    // 防抖：输入停止500ms后调用API
    clearTimeout(geocodeTimer);
    const container = document.getElementById('search-results');
    container.innerHTML = '<div class="search-empty">正在查询地点坐标...</div>';

    geocodeTimer = setTimeout(() => {
      geocodeAndSearch(query);
    }, 500);
  }
}

/// 调用地理编码API获取经纬度，然后按距离匹配后端数据
async function geocodeAndSearch(query) {
  isGeocoding = true;
  const container = document.getElementById('search-results');
  container.innerHTML = '<div class="search-empty">正在调用地理编码API...</div>';

  try {
    // 调用 Nominatim 地理编码 API（OpenStreetMap 免费服务）
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1&accept-language=zh-CN`;
    const resp = await fetch(url, {
      headers: { 'Accept': 'application/json' }
    });

    if (!resp.ok) throw new Error('API请求失败: ' + resp.status);
    const data = await resp.json();

    let searchLat, searchLng, searchName;

    if (data && data.length > 0) {
      searchLat = parseFloat(data[0].lat);
      searchLng = parseFloat(data[0].lon);
      searchName = data[0].display_name || query;
    } else {
      // API未找到结果 — 使用内置模拟地理编码作为兜底
      const mock = mockGeocode(query);
      if (mock) {
        searchLat = mock.lat;
        searchLng = mock.lng;
        searchName = mock.name;
      } else {
        container.innerHTML = `<div class="search-empty">未找到地点「${query}」的坐标</div>`;
        isGeocoding = false;
        return;
      }
    }

    // 用获取到的坐标，与后端数据按距离匹配
    searchResultsCache = galaxyMeteors.map(m => {
      const dist = calcDistance(searchLat, searchLng, m.latitude, m.longitude);
      return { ...m, _distance: dist };
    }).sort((a, b) => (a._distance || 9999) - (b._distance || 9999));

    searchPage = 0;
    isGeocoding = false;
    renderSearchResults(query);

    // 更新定位栏显示搜索到的地点
    const locSpan = document.getElementById('search-current-loc');
    if (locSpan) {
      locSpan.textContent = `搜索地点: ${searchName} (${searchLat.toFixed(4)}, ${searchLng.toFixed(4)})`;
    }

  } catch (err) {
    // 网络错误时使用模拟地理编码兜底
    const mock = mockGeocode(query);
    if (mock) {
      searchResultsCache = galaxyMeteors.map(m => {
        const dist = calcDistance(mock.lat, mock.lng, m.latitude, m.longitude);
        return { ...m, _distance: dist };
      }).sort((a, b) => (a._distance || 9999) - (b._distance || 9999));
      searchPage = 0;
      renderSearchResults(query);
      const locSpan = document.getElementById('search-current-loc');
      if (locSpan) locSpan.textContent = `搜索地点: ${mock.name} (离线匹配)`;
    } else {
      container.innerHTML = `<div class="search-empty">地理编码请求失败，请稍后重试</div>`;
    }
    isGeocoding = false;
  }
}

/// 模拟地理编码（离线兜底，匹配常见城市）
function mockGeocode(query) {
  const cityMap = [
    { keys: ['景德镇', '御窑'], lat: 29.2687, lng: 117.1784, name: '景德镇市' },
    { keys: ['苏州', '寒山寺'], lat: 31.3105, lng: 120.5697, name: '苏州市' },
    { keys: ['宜兴', '丁蜀', '紫砂'], lat: 31.2841, lng: 119.9084, name: '宜兴市' },
    { keys: ['杭州', '西湖', '浙江'], lat: 30.2592, lng: 120.1494, name: '杭州市' },
    { keys: ['安阳', '殷墟'], lat: 36.1165, lng: 114.3926, name: '安阳市' },
    { keys: ['瑞丽', '德宏', '翡翠'], lat: 24.0127, lng: 97.8517, name: '瑞丽市' },
    { keys: ['成都', '锦里', '春熙路'], lat: 30.5728, lng: 104.0668, name: '成都市' },
    { keys: ['上海', '城隍庙'], lat: 31.2304, lng: 121.4737, name: '上海市' },
    { keys: ['北京'], lat: 39.9042, lng: 116.4074, name: '北京市' },
    { keys: ['南京'], lat: 32.0603, lng: 118.7969, name: '南京市' },
    { keys: ['广州'], lat: 23.1291, lng: 113.2644, name: '广州市' },
    { keys: ['西安'], lat: 34.3416, lng: 108.9398, name: '西安市' },

  const q = query.toLowerCase();
  for (const c of cityMap) {

/// 渲染搜索结果（分页）
function renderSearchResults() {
  const container = document.getElementById('search-results');

  if (searchResultsCache.length === 0) {
    container.innerHTML = '<div class="search-empty">未找到匹配的故事</div>';
    return;
  }

  const start = 0;
  const end = (searchPage + 1) * SEARCH_PAGE_SIZE;
  const visible = searchResultsCache.slice(start, end);
  const hasMore = end < searchResultsCache.length;

  const keyword = document.getElementById('search-input').value.trim();

  container.innerHTML = visible.map(m => {
    const c = m.color;
    const colorStr = `rgb(${c.r},${c.g},${c.b})`;
    const idx = galaxyMeteors.indexOf(m);
    let distHtml = '';
    if (searchTab === 'location' && m._distance !== undefined) {
      const distText = m._distance < 1 ? `${(m._distance * 1000).toFixed(0)}m` : `${m._distance.toFixed(1)}km`;
      distHtml = `<div class="result-dist">${distText}</div>`;
    }
    return `
      <div class="search-result-item" onclick="jumpToMeteor(${idx})">
        <div class="result-dot" style="background: radial-gradient(circle at 30% 30%, #fff, ${colorStr}); color: ${colorStr};"></div>
        <div class="result-info">
          <div class="result-name">${highlightText(displayName(m), keyword)}</div>
          <div class="result-story">${m.story.substring(0, 40)}...</div>
          <div class="result-loc">
            <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            ${m.latitude.toFixed(2)}°N, ${m.longitude.toFixed(2)}°E
          </div>
        </div>
        ${distHtml}
      </div>`;
  }).join('') + (hasMore ? `
    <div class="load-more-btn" onclick="loadMoreResults()">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      查看更多 (${searchResultsCache.length - end} 条)
    </div>` : '') + (searchTab === 'location' && userLocation ? `
    <div class="result-summary">共 ${searchResultsCache.length} 条结果，已按距离排序</div>` : '');

  // 滚动到底部自动加载
  container.onscroll = () => {
    if (container.scrollTop + container.clientHeight >= container.scrollHeight - 50 && hasMore) {
      loadMoreResults();
    }
  };
}

/// 加载更多
function loadMoreResults() {
  searchPage++;
  renderSearchResults();
  // 保持滚动位置
  const container = document.getElementById('search-results');
  container.scrollTop = container.scrollHeight - 120;
}

/// 关键词高亮
function highlightText(text, keyword) {
  if (!keyword) return text;
  const lower = text.toLowerCase();
  const idx = lower.indexOf(keyword.toLowerCase());
  if (idx === -1) return text;
  return text.substring(0, idx) +
    `<span style="color:#7C4DFF;font-weight:700;">${text.substring(idx, idx + keyword.length)}</span>` +
    text.substring(idx + keyword.length);
}

/// 清空搜索
function clearSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  searchPage = 0;
  doSearch();
}

/// 点击搜索结果跳转到对应流星
function jumpToMeteor(index) {
  closeGalaxySearch();
  const m = galaxyMeteors[index];
  if (m) {
    m.paused = true;
    setTimeout(() => { m.paused = false; }, 5000);
    showGalaxyModal(index);
  }
}

/// 计算两个经纬度之间的距离（km）
function calcDistance(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLng / 2) * Math.sin(dLng / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}
