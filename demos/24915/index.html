<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 邻里帮 — 智慧社区互助平台</title>
<style>
:root {
  --bg: #1a2a1a;
  --card: #223322;
  --accent: #4eca6a;
  --accent2: #2ea043;
  --warm: #f0a050;
  --info: #58a6ff;
  --text: #e6f0e6;
  --sub: #8a9a8a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
.hero {
  text-align: center; padding: 44px 20px 20px;
  background: linear-gradient(135deg, #1a2a1a 0%, #1a3020 100%);
}
.hero .logo { font-size: 3em; display: block; margin-bottom: 8px; }
.hero h1 { font-size: 2.3em; font-weight: 800; }
.hero h1 span { background: linear-gradient(135deg, var(--accent), var(--warm)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.hero p { color: var(--sub); margin-top: 6px; font-size: .95em; }

.container { max-width: 960px; margin: 0 auto; padding: 0 20px 50px; }

/* 快捷入口 */
.quick-actions {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 10px; margin: 20px 0;
}
.qa-card {
  padding: 16px 10px; border-radius: 14px; text-align: center; cursor: pointer;
  background: var(--card); border: 2px solid rgba(255,255,255,.05); transition: all .3s;
}
.qa-card:hover { border-color: rgba(78,202,106,.3); transform: translateY(-2px); }
.qa-card.active { border-color: var(--accent); background: rgba(78,202,106,.1); }
.qa-card .icon { font-size: 2em; display: block; margin-bottom: 4px; }
.qa-card .name { font-weight: 600; font-size: .85em; }

/* 互助列表 */
.section-title {
  display: flex; justify-content: space-between; align-items: center; margin: 24px 0 12px;
}
.section-title h3 { color: var(--accent); }
.section-title .count { font-size: .85em; color: var(--sub); }

.help-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}
.help-card {
  background: var(--card); border-radius: 16px; padding: 20px;
  border: 1px solid rgba(255,255,255,.05); transition: all .3s;
  cursor: pointer;
}
.help-card:hover { border-color: rgba(78,202,106,.2); transform: translateY(-2px); }
.help-card .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.help-card .badge {
  padding: 4px 10px; border-radius: 20px; font-size: .75em; font-weight: 600;
}
.badge-help { background: rgba(240,160,80,.15); color: var(--warm); }
.badge-offer { background: rgba(78,202,106,.15); color: var(--accent); }
.badge-urgent { background: rgba(255,80,80,.15); color: #ff5050; }
.help-card .title { font-weight: 600; font-size: 1.05em; margin-bottom: 6px; }
.help-card .desc { font-size: .85em; color: var(--sub); line-height: 1.5; margin-bottom: 12px; }
.help-card .footer { display: flex; justify-content: space-between; font-size: .8em; color: var(--sub); }
.help-card .footer span { display: flex; align-items: center; gap: 4px; }

/* 发布表单 */
.form-panel {
  background: var(--card); border-radius: 20px; padding: 28px;
  margin: 20px 0; border: 1px solid rgba(255,255,255,.06); display: none;
}
.form-panel.show { display: block; animation: fadeIn .4s; }
@keyframes fadeIn { from{opacity:0;transform:translateY(-8px);} to{opacity:1;transform:translateY(0);} }
.form-panel h3 { color: var(--accent); margin-bottom: 16px; }
.form-row { margin-bottom: 14px; }
.form-row label { display: block; margin-bottom: 5px; font-size: .9em; color: var(--sub); }
.form-row input, .form-row textarea, .form-row select {
  width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1);
  background: rgba(0,0,0,.3); color: #fff; font-size: .9em; outline: none;
  font-family: inherit;
}
.form-row input:focus, .form-row textarea:focus, .form-row select:focus {
  border-color: var(--accent);
}
.form-row textarea { height: 90px; resize: vertical; }
.form-row select { cursor: pointer; }
.btn {
  padding: 12px 28px; border-radius: 12px; border: none; font-weight: 600;
  cursor: pointer; transition: all .3s; font-size: .9em;
}
.btn-primary { background: var(--accent); color: #1a2a1a; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(78,202,106,.3); }
.btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
.btn-outline:hover { background: rgba(78,202,106,.1); }
.form-btns { display: flex; gap: 12px; margin-top: 16px; }

/* 通知 */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 999;
  padding: 12px 24px; border-radius: 12px; background: var(--accent); color: #1a2a1a;
  font-weight: 600; display: none; animation: slideDown .3s;
}
.toast.show { display: block; }
@keyframes slideDown { from{opacity:0;transform:translateX(-50%) translateY(-20px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }
</style>
</head>
<body>

<div class="hero">
  <span class="logo">🏘️</span>
  <h1>AI <span>邻里帮</span></h1>
  <p>社区互助 · 邻里共享 · AI 智能匹配你身边的帮助</p>
</div>

<div class="container">
  <!-- 快捷入口 -->
  <div class="quick-actions" id="quickActions">
    <div class="qa-card active" data-cat="all"><span class="icon">🌟</span><span class="name">全部</span></div>
    <div class="qa-card" data-cat="维修"><span class="icon">🔧</span><span class="name">维修帮手</span></div>
    <div class="qa-card" data-cat="宠物"><span class="icon">🐾</span><span class="name">宠物照料</span></div>
    <div class="qa-card" data-cat="家教"><span class="icon">📚</span><span class="name">学习辅导</span></div>
    <div class="qa-card" data-cat="跑腿"><span class="icon">🏃</span><span class="name">代办跑腿</span></div>
    <div class="qa-card" data-cat="陪伴"><span class="icon">💛</span><span class="name">暖心陪伴</span></div>
  </div>

  <!-- 发布按钮 -->
  <div style="text-align:right;margin:12px 0;">
    <button class="btn btn-outline" id="btnToggleForm">📝 发布互助</button>
  </div>

  <!-- 发布表单 -->
  <div class="form-panel" id="formPanel">
    <h3>📝 发布新的互助信息</h3>
    <div class="form-row">
      <label>类型</label>
      <select id="formType">
        <option value="求助">🙏 我需要帮助</option>
        <option value="提供">🤝 我可以帮忙</option>
      </select>
    </div>
    <div class="form-row">
      <label>类别</label>
      <select id="formCat">
        <option value="维修">🔧 维修帮手</option>
        <option value="宠物">🐾 宠物照料</option>
        <option value="家教">📚 学习辅导</option>
        <option value="跑腿">🏃 代办跑腿</option>
        <option value="陪伴">💛 暖心陪伴</option>
      </select>
    </div>
    <div class="form-row">
      <label>标题</label>
      <input type="text" id="formTitle" placeholder="简要描述你的需求或能提供的帮助">
    </div>
    <div class="form-row">
      <label>详细描述</label>
      <textarea id="formDesc" placeholder="具体说说时间、地点、要求等细节……"></textarea>
    </div>
    <div class="form-btns">
      <button class="btn btn-primary" id="btnPublish">✅ 发布</button>
      <button class="btn btn-outline" id="btnCancelForm">取消</button>
    </div>
  </div>

  <div class="section-title">
    <h3>🤝 社区互助信息</h3>
    <span class="count" id="helpCount"></span>
  </div>
  <div class="help-grid" id="helpGrid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// 初始数据
let helps = [
  { id:1, type:'求助', cat:'维修', title:'水龙头漏水，急求帮忙', desc:'家里厨房水龙头坏了，滴滴答答漏了一晚上，物业下班了，有没有邻居会修水龙头的？有偿！', author:'3栋老王', time:'10分钟前', views:28, urgent:true },
  { id:2, type:'提供', cat:'家教', title:'免费辅导中小学生数学', desc:'我是退休数学老师，每周六下午可以免费辅导邻居孩子的数学，小学初中都行。', author:'5栋李老师', time:'30分钟前', views:56, urgent:false },
  { id:3, type:'求助', cat:'宠物', title:'出差三天，求帮忙喂猫', desc:'本周末出差，家里有只英短需要早晚各喂一次+换猫砂，就在2栋，有养猫经验的邻居求帮忙！', author:'2栋小陈', time:'1小时前', views:42, urgent:true },
  { id:4, type:'提供', cat:'陪伴', title:'想找人一起晨跑锻炼', desc:'每天6:30小区门口出发，沿河边跑3公里，有没有一起的？互相鼓励坚持！', author:'7栋跑友', time:'2小时前', views:35, urgent:false },
  { id:5, type:'求助', cat:'跑腿', title:'帮忙取个快递，下楼不方便', desc:'腿脚不方便，快递在小区门口菜鸟驿站，有没有好心邻居帮忙带上来？1栋6楼。', author:'1栋张奶奶', time:'3小时前', views:67, urgent:true },
  { id:6, type:'提供', cat:'维修', title:'周末免费帮邻居修电脑', desc:'我是程序员，周末有空可以帮邻居修电脑、装系统、清灰等小问题，不收钱。', author:'4栋IT哥', time:'4小时前', views:89, urgent:false },
];

let currentCat = 'all';
let nextId = 7;

function renderHelps() {
  const filtered = currentCat === 'all' ? helps : helps.filter(h => h.cat === currentCat);
  document.getElementById('helpCount').textContent = `共 ${filtered.length} 条`;
  document.getElementById('helpGrid').innerHTML = filtered.map(h => `
    <div class="help-card">
      <div class="header">
        <span class="badge ${h.type === '求助' ? 'badge-help' : 'badge-offer'} ${h.urgent ? 'badge-urgent' : ''}">
          ${h.urgent ? '🔴 ' : ''}${h.type}${h.urgent ? ' · 紧急' : ''}
        </span>
        <span style="font-size:.8em;color:var(--sub);">${h.cat}</span>
      </div>
      <div class="title">${h.title}</div>
      <div class="desc">${h.desc}</div>
      <div class="footer">
        <span>👤 ${h.author}</span>
        <span>🕐 ${h.time}</span>
        <span>👁️ ${h.views}</span>
      </div>
    </div>
  `).join('');
}

// 分类筛选
document.getElementById('quickActions').addEventListener('click', function(e) {
  const card = e.target.closest('.qa-card');
  if (!card) return;
  document.querySelectorAll('.qa-card').forEach(c => c.classList.remove('active'));
  card.classList.add('active');
  currentCat = card.dataset.cat;
  renderHelps();
});

// 表单切换
document.getElementById('btnToggleForm').addEventListener('click', function() {
  document.getElementById('formPanel').classList.toggle('show');
});
document.getElementById('btnCancelForm').addEventListener('click', function() {
  document.getElementById('formPanel').classList.remove('show');
});

// 发布
document.getElementById('btnPublish').addEventListener('click', function() {
  const type = document.getElementById('formType').value;
  const cat = document.getElementById('formCat').value;
  const title = document.getElementById('formTitle').value.trim();
  const desc = document.getElementById('formDesc').value.trim();
  if (!title || !desc) { showToast('请填写完整的互助信息哦~'); return; }

  helps.unshift({
    id: nextId++, type, cat, title, desc,
    author: '匿名邻居', time: '刚刚', views: 0, urgent: type === '求助'
  });

  document.getElementById('formTitle').value = '';
  document.getElementById('formDesc').value = '';
  document.getElementById('formPanel').classList.remove('show');
  renderHelps();
  showToast('✅ 互助信息发布成功！AI 正在为你匹配合适的邻居……');
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

renderHelps();
</script>
</body>
</html>
