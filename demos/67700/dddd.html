<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌伴AI智能感应灯 - 功能初稿演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f6f8fa;
            padding: 20px;
        }
        .wrap {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2364aa;
            font-size: 26px;
            margin-bottom: 8px;
        }
        .sub-title {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .demo-box {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .lamp-view {
            flex: 1;
            min-width: 320px;
            text-align: center;
        }
        .lamp {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: #999;
            margin: 20px auto;
            transition: all 0.4s ease;
            box-shadow: 0 0 0 rgba(255,255,200,0);
        }
        .lamp.on {
            background: #fffde8;
        }
        .lamp.read {
            box-shadow: 0 0 60px rgba(255, 240, 180, 0.7);
        }
        .lamp.draw {
            box-shadow: 0 0 60px rgba(220, 240, 255, 0.7);
        }
        .lamp.relax {
            box-shadow: 0 0 60px rgba(255, 220, 230, 0.6);
        }
        .control-panel {
            flex: 1;
            min-width: 320px;
        }
        .item {
            margin-bottom: 22px;
        }
        .item h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 17px;
        }
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #409eff;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 8px;
        }
        button:hover {
            background: #337ecc;
        }
        .mode-btn {
            background: #67c23a;
        }
        input[type="range"] {
            width: 100%;
        }
        .info-text {
            background: #f0f7ff;
            padding: 12px 16px;
            border-radius: 8px;
            color: #224466;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            color: #999;
            font-size: 14px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>桌伴AI智能桌面氛围感应灯</h1>
        <div class="sub-title">硬件交互赛道 · 初稿功能演示 TRAE Work Auto</div>

        <div class="demo-box">
            <div class="lamp-view">
                <div class="lamp" id="lampBox"></div>
                <p>当前灯光状态：<span id="statusText">待机关闭</span></p>
            </div>
            <div class="control-panel">
                <div class="item">
                    <h3>人体感应模拟（核心硬件功能）</h3>
                    <button id="sitBtn">模拟入座</button>
                    <button id="leaveBtn">模拟离座</button>
                </div>
                <div class="item">
                    <h3>亮度手动调节（联动光敏传感器）</h3>
                    <input type="range" id="brightSlider" min="20" max="100" value="60">
                    <p>当前亮度：<span id="brightVal">60</span> %</p>
                </div>
                <div class="item">
                    <h3>场景模式切换</h3>
                    <button class="mode-btn" data-type="read">阅读模式</button>
                    <button class="mode-btn" data-type="draw">绘图模式</button>
                    <button class="mode-btn" data-type="relax">休闲模式</button>
                </div>
                <div class="info-text">
                    <p>环境光敏数值：<span id="lightNum">350</span> lux</p>
                    <p>硬件方案：ESP32主控 + 人体红外模块 + 光敏传感器 + LED灯组</p>
                </div>
            </div>
        </div>

        <footer>
            本HTML为创意初稿功能演示产物，用于展示产品核心交互逻辑
        </footer>
    </div>

    <script>
        const lampBox = document.getElementById('lampBox');
        const statusText = document.getElementById('statusText');
        const brightSlider = document.getElementById('brightSlider');
        const brightVal = document.getElementById('brightVal');
        const lightNum = document.getElementById('lightNum');
        const sitBtn = document.getElementById('sitBtn');
        const leaveBtn = document.getElementById('leaveBtn');
        const modeBtns = document.querySelectorAll('.mode-btn');

        let isOn = false;
        let currentMode = '';

        // 入座亮灯
        sitBtn.onclick = () => {
            isOn = true;
            lampBox.classList.add('on');
            statusText.innerText = '已入座，灯光开启';
            lightNum.innerText = Math.floor(Math.random() * 400 + 200);
        }
        // 离座关灯
        leaveBtn.onclick = () => {
            isOn = false;
            lampBox.className = 'lamp';
            currentMode = '';
            statusText.innerText = '已离座，灯光关闭（延时断电）';
        }
        // 亮度调节
        brightSlider.oninput = function() {
            let val = this.value;
            brightVal.innerText = val;
            lampBox.style.opacity = val / 100;
        }
        // 场景模式
        modeBtns.forEach(btn => {
            btn.onclick = () => {
                if(!isOn) {
                    alert('请先点击【模拟入座】开启灯光');
                    return;
                }
                let type = btn.dataset.type;
                lampBox.classList.remove('read','draw','relax');
                lampBox.classList.add(type);
                switch(type){
                    case 'read': statusText.innerText = '阅读模式（暖白光护眼）';break;
                    case 'draw': statusText.innerText = '绘图模式（冷白光高显色）';break;
                    case 'relax': statusText.innerText = '休闲模式（柔暖氛围光）';break;
                }
            }
        })
    </script>
</body>
</html>
