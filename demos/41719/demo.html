    this.canvas.width = rect.width * dpr;
    this.canvas.height = rect.height * dpr;
    this.ctx.scale(dpr, dpr);
    this.w = rect.width;
    this.h = rect.height;
  }

  setAction(action) {
    if (this.action !== action) {
      this.prevAction = this.action;
      this.action = action;
      this.transitionProgress = 0;
      this.particles = [];
    }
  }

  // ---- Pose calculations ----
  // Each returns { head, neck, hip, lHand, rHand, lFoot, rFoot, extra }
  // Coordinates relative to centerX, baselineY

  getPose(action, t) {
    const cx = this.w / 2;
    const baseY = this.h - 50;
    const scale = Math.min(this.w / 400, this.h / 240, 1);
    const s = scale; // scale factor

    switch(action) {
      case 'standing': return this.poseStanding(cx, baseY, t, s);
      case 'walking': return this.poseWalking(cx, baseY, t, s);
      case 'running': return this.poseRunning(cx, baseY, t, s);
      case 'jumping': return this.poseJumping(cx, baseY, t, s);
      case 'fighting': return this.poseFighting(cx, baseY, t, s);
      case 'sitting': return this.poseSitting(cx, baseY, t, s);
      case 'laughing': return this.poseLaughing(cx, baseY, t, s);
      case 'crying': return this.poseCrying(cx, baseY, t, s);
      case 'falling': return this.poseFalling(cx, baseY, t, s);
      case 'flying': return this.poseFlying(cx, baseY, t, s);
      case 'sleeping': return this.poseSleeping(cx, baseY, t, s);
      case 'waving': return this.poseWaving(cx, baseY, t, s);
      default: return this.poseStanding(cx, baseY, t, s);
    }
  }

  // -- Standing: slight breathing
  poseStanding(cx, by, t, s) {
    const breath = Math.sin(t * 2) * 2 * s;
    const hipY = by - 55 * s + breath;
    return {
      head: { x: cx, y: hipY - 45 * s, r: 12 * s },
      neck: { x: cx, y: hipY - 30 * s },
      hip: { x: cx, y: hipY },
      lHand: { x: cx - 18 * s, y: hipY + 5 * s },
      rHand: { x: cx + 18 * s, y: hipY + 5 * s },
      lFoot: { x: cx - 12 * s, y: by },
      rFoot: { x: cx + 12 * s, y: by },
    };
  }

  // -- Walking: alternating legs and arms
  poseWalking(cx, by, t, s) {
    const cycle = Math.sin(t * 4);
    const cycle2 = Math.sin(t * 4 + Math.PI);
    const bob = Math.abs(Math.sin(t * 4)) * 3 * s;
    const hipY = by - 55 * s - bob;
    return {
      head: { x: cx, y: hipY - 45 * s, r: 12 * s },
      neck: { x: cx, y: hipY - 30 * s },
      hip: { x: cx, y: hipY },
      lHand: { x: cx + cycle * 15 * s, y: hipY + 10 * s + Math.abs(cycle) * 5 * s },
      rHand: { x: cx + cycle2 * 15 * s, y: hipY + 10 * s + Math.abs(cycle2) * 5 * s },
      lFoot: { x: cx + cycle2 * 18 * s, y: by - Math.max(0, cycle2) * 10 * s },
      rFoot: { x: cx + cycle * 18 * s, y: by - Math.max(0, cycle) * 10 * s },
    };
  }

  // -- Running: faster, leaning forward
  poseRunning(cx, by, t, s) {
    const cycle = Math.sin(t * 8);
    const cycle2 = Math.sin(t * 8 + Math.PI);
    const bob = Math.abs(Math.sin(t * 8)) * 6 * s;
    const lean = 12 * s;
    const hipY = by - 50 * s - bob;
    return {
      head: { x: cx + lean, y: hipY - 40 * s, r: 12 * s },
      neck: { x: cx + lean * 0.6, y: hipY - 25 * s },
      hip: { x: cx, y: hipY },
      lHand: { x: cx + lean * 0.5 - cycle * 20 * s, y: hipY - 5 * s + Math.abs(cycle) * 8 * s },
      rHand: { x: cx + lean * 0.5 - cycle2 * 20 * s, y: hipY - 5 * s + Math.abs(cycle2) * 8 * s },
      lFoot: { x: cx + 5 * s - cycle2 * 25 * s, y: by - Math.max(0, -cycle2) * 15 * s },
      rFoot: { x: cx + 5 * s - cycle * 25 * s, y: by - Math.max(0, -cycle) * 15 * s },
    };
  }

  // -- Jumping: crouch → extend → air → land
  poseJumping(cx, by, t, s) {
    const phase = (t * 1.5) % (Math.PI * 2);
    const jump = Math.sin(phase);
    const height = Math.max(0, jump) * 60 * s;
    const crouch = jump < 0 ? Math.abs(jump) * 10 * s : 0;
    const hipY = by - 50 * s - height + crouch;
    const armRaise = height / (60 * s);
    return {
      head: { x: cx, y: hipY - 40 * s, r: 12 * s },
      neck: { x: cx, y: hipY - 25 * s },
      hip: { x: cx, y: hipY },
      lHand: { x: cx - 15 * s, y: hipY - 20 * s - armRaise * 30 * s },
      rHand: { x: cx + 15 * s, y: hipY - 20 * s - armRaise * 30 * s },
      lFoot: { x: cx - 10 * s, y: by - height + (jump > 0.3 ? 15 * s : 0) },
      rFoot: { x: cx + 10 * s, y: by - height + (jump > 0.3 ? 15 * s : 0) },
    };
  }

  // -- Fighting: alternate punches
  poseFighting(cx, by, t, s) {
    const punch = Math.sin(t * 5);
    const punch2 = Math.sin(t * 5 + Math.PI);
    const dodge = Math.sin(t * 5 + Math.PI / 2) * 5 * s;
    const hipY = by - 55 * s;
    return {
      head: { x: cx + dodge, y: hipY - 45 * s, r: 12 * s },
      neck: { x: cx + dodge * 0.5, y: hipY - 30 * s },
      hip: { x: cx, y: hipY },
      lHand: { x: cx - 10 * s + punch * 30 * s, y: hipY - 15 * s + Math.abs(punch) * 5 * s },
      rHand: { x: cx + 10 * s + punch2 * 30 * s, y: hipY - 15 * s + Math.abs(punch2) * 5 * s },
      lFoot: { x: cx - 18 * s, y: by },
      rFoot: { x: cx + 18 * s, y: by },
    };
  }

  // -- Sitting: legs bent, body lowered
  poseSitting(cx, by, t, s) {
    const breath = Math.sin(t * 2) * 1.5 * s;
    const hipY = by - 25 * s + breath;
    return {
      head: { x: cx, y: hipY - 40 * s, r: 12 * s },
      neck: { x: cx, y: hipY - 25 * s },
      hip: { x: cx, y: hipY },
      lHand: { x: cx - 20 * s, y: hipY + 5 * s },
      rHand: { x: cx + 20 * s, y: hipY + 5 * s },
      lFoot: { x: cx - 25 * s, y: by },
      rFoot: { x: cx + 25 * s, y: by },
      sitting: true,
    };
  }

  // -- Laughing: head back, shaking
  poseLaughing(cx, by, t, s) {
    const shake = Math.sin(t * 10) * 3 * s;
    const headBack = Math.sin(t * 5) * 5 * s + 5 * s;
    const hipY = by - 55 * s + Math.sin(t * 10) * 2 * s;
    return {
      head: { x: cx + shake, y: hipY - 45 * s - headBack, r: 12 * s },
      neck: { x: cx, y: hipY - 30 * s },
      hip: { x: cx, y: hipY },
      lHand: { x: cx - 15 * s, y: hipY - 5 * s + Math.sin(t * 10) * 3 * s },
      rHand: { x: cx + 15 * s, y: hipY - 5 * s + Math.sin(t * 10 + 1) * 3 * s },
      lFoot: { x: cx - 12 * s, y: by },
      rFoot: { x: cx + 12 * s, y: by },
    };
  }

  // -- Crying: head down, shoulders shaking
  poseCrying(cx, by, t, s) {
    const shake = Math.sin(t * 12) * 2 * s;
    const hipY = by - 50 * s;
    return {
      head: { x: cx + shake, y: hipY - 35 * s, r: 12 * s },
      neck: { x: cx, y: hipY - 25 * s },
      hip: { x: cx, y: hipY },
      lHand: { x: cx - 8 * s, y: hipY - 20 * s },
      rHand: { x: cx + 8 * s, y: hipY - 20 * s },
      lFoot: { x: cx - 12 * s, y: by },
      rFoot: { x: cx + 12 * s, y: by },
      crying: true,
    };
  }

  // -- Falling: tipping over
  poseFalling(cx, by, t, s) {
    const cycle = (t * 1.2) % (Math.PI * 2);
    const fall = Math.min(1, (1 - Math.cos(cycle)) / 2);
    const angle = fall * (Math.PI / 2);
    const hipY = by - 55 * s;
    // Rotate the whole figure
    const hipX = cx;
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    const rot = (px, py) => ({
      x: hipX + (px - hipX) * cos - (py - hipY) * sin,
      y: hipY + (px - hipX) * sin + (py - hipY) * cos
    });
    const head = rot(cx, hipY - 45 * s);
    const neck = rot(cx, hipY - 30 * s);
    const lHand = rot(cx - 18 * s, hipY);
    const rHand = rot(cx + 18 * s, hipY);
    const lFoot = rot(cx - 12 * s, by);
    const rFoot = rot(cx + 12 * s, by);
    return {
      head: { x: head.x, y: head.y, r: 12 * s },
      neck: neck,
      hip: { x: hipX, y: hipY },
      lHand: lHand,
      rHand: rHand,
      lFoot: lFoot,
      rFoot: rFoot,
    };
  }

  // -- Flying: horizontal, arms outstretched
  poseFlying(cx, by, t, s) {
    const float = Math.sin(t * 2) * 8 * s;
    const cy = by - 100 * s + float;
    return {
      head: { x: cx + 35 * s, y: cy - 5 * s, r: 12 * s },
      neck: { x: cx + 20 * s, y: cy },
      hip: { x: cx - 20 * s, y: cy },
      lHand: { x: cx + 5 * s, y: cy - 25 * s },
      rHand: { x: cx + 5 * s, y: cy + 25 * s },
      lFoot: { x: cx - 40 * s, y: cy - 8 * s },
      rFoot: { x: cx - 40 * s, y: cy + 8 * s },
      flying: true,
    };
  }

  // -- Sleeping: lying down, Z's floating
  poseSleeping(cx, by, t, s) {
    const breath = Math.sin(t * 1.5) * 2 * s;
    const cy = by - 20 * s + breath;
    return {
      head: { x: cx + 50 * s, y: cy, r: 12 * s },
      neck: { x: cx + 35 * s, y: cy },
      hip: { x: cx - 20 * s, y: cy },
      lHand: { x: cx + 15 * s, y: cy + 8 * s },
      rHand: { x: cx + 15 * s, y: cy - 8 * s },
      lFoot: { x: cx - 45 * s, y: cy + 3 * s },
      rFoot: { x: cx - 45 * s, y: cy - 3 * s },
      sleeping: true,
    };
  }

  // -- Waving: one arm raised and waving
  poseWaving(cx, by, t, s) {
    const wave = Math.sin(t * 5) * 15 * s;
    const hipY = by - 55 * s;
    return {
      head: { x: cx, y: hipY - 45 * s, r: 12 * s },
      neck: { x: cx, y: hipY - 30 * s },
      hip: { x: cx, y: hipY },
      lHand: { x: cx - 18 * s, y: hipY + 5 * s },
      rHand: { x: cx + 15 * s + wave, y: hipY - 35 * s },
      rElbow: { x: cx + 10 * s, y: hipY - 20 * s },
      lFoot: { x: cx - 12 * s, y: by },
      rFoot: { x: cx + 12 * s, y: by },
      waving: true,
    };
  }

  // ---- Drawing ----
  draw() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.w, this.h);

    // Draw ground
    this.drawGround();

    // Get current pose
    const pose = this.getPose(this.action, this.time);

    // Draw shadow
    this.drawShadow(pose);

    // Draw stick figure
    this.drawFigure(pose);

    // Draw effects
    this.drawEffects(pose);
  }

  drawGround() {
    const ctx = this.ctx;
    ctx.strokeStyle = 'rgba(88, 139, 139, 0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(0, this.h - 35);
    ctx.lineTo(this.w, this.h - 35);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  drawShadow(pose) {
    const ctx = this.ctx;
    const cx = this.w / 2;
    const groundY = this.h - 35;
    // Calculate shadow based on figure height
    let figureY = pose.hip.y;
    let heightFromGround = groundY - figureY;
    let shadowScale = Math.max(0.3, 1 - heightFromGround / 200);
    ctx.fillStyle = `rgba(0, 0, 0, ${0.15 * shadowScale})`;
    ctx.beginPath();
    ctx.ellipse(cx, groundY + 2, 30 * shadowScale, 5 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  drawFigure(pose) {
    const ctx = this.ctx;
    const lineWidth = 3.5;

    ctx.strokeStyle = '#2c2825';
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Draw legs first (behind body)
    ctx.beginPath();
    ctx.moveTo(pose.hip.x, pose.hip.y);
    ctx.lineTo(pose.lFoot.x, pose.lFoot.y);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(pose.hip.x, pose.hip.y);
    ctx.lineTo(pose.rFoot.x, pose.rFoot.y);
    ctx.stroke();

    // Draw torso
    ctx.beginPath();
    ctx.moveTo(pose.hip.x, pose.hip.y);
    ctx.lineTo(pose.neck.x, pose.neck.y);
    ctx.stroke();

    // Draw arms
    if (pose.waving && pose.rElbow) {
      // Right arm with elbow (waving)
      ctx.beginPath();
      ctx.moveTo(pose.neck.x, pose.neck.y);
      ctx.lineTo(pose.rElbow.x, pose.rElbow.y);
      ctx.lineTo(pose.rHand.x, pose.rHand.y);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(pose.neck.x, pose.neck.y);
      ctx.lineTo(pose.rHand.x, pose.rHand.y);
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.moveTo(pose.neck.x, pose.neck.y);
    ctx.lineTo(pose.lHand.x, pose.lHand.y);
    ctx.stroke();

    // Draw neck to head
    ctx.beginPath();
    ctx.moveTo(pose.neck.x, pose.neck.y);
    ctx.lineTo(pose.head.x, pose.head.y);
    ctx.stroke();

    // Draw head
    ctx.fillStyle = '#2c2825';
    ctx.beginPath();
    ctx.arc(pose.head.x, pose.head.y, pose.head.r, 0, Math.PI * 2);
    ctx.fill();

    // Draw face features based on action
    this.drawFace(pose);
  }

  drawFace(pose) {
    const ctx = this.ctx;
    const h = pose.head;
    const r = h.r;
    ctx.fillStyle = '#f5f0e6';
    ctx.strokeStyle = '#2c2825';
    ctx.lineWidth = 1.5;

    if (this.action === 'sleeping') {
      // Closed eyes (lines)
      ctx.strokeStyle = '#f5f0e6';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(h.x - r * 0.4, h.y - 2);
      ctx.lineTo(h.x - r * 0.15, h.y - 2);
      ctx.moveTo(h.x + r * 0.15, h.y - 2);
      ctx.lineTo(h.x + r * 0.4, h.y - 2);
      ctx.stroke();
    } else if (this.action === 'crying') {
      // X eyes
      ctx.strokeStyle = '#f5f0e6';
      ctx.lineWidth = 1.5;
      this.drawXEye(h.x - r * 0.3, h.y - 2, r * 0.2);
      this.drawXEye(h.x + r * 0.3, h.y - 2, r * 0.2);
    } else if (this.action === 'laughing') {
      // Happy eyes (^ ^)
      ctx.strokeStyle = '#f5f0e6';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(h.x - r * 0.4, h.y);
      ctx.lineTo(h.x - r * 0.2, h.y - 3);
      ctx.lineTo(h.x - r * 0.05, h.y);
      ctx.moveTo(h.x + r * 0.05, h.y);
      ctx.lineTo(h.x + r * 0.2, h.y - 3);
      ctx.lineTo(h.x + r * 0.4, h.y);
      ctx.stroke();
      // Open mouth
      ctx.beginPath();
      ctx.arc(h.x, h.y + r * 0.3, r * 0.3, 0, Math.PI);
      ctx.stroke();
    } else if (this.action === 'flying') {
      // Determined eyes
      ctx.fillStyle = '#f5f0e6';
      ctx.beginPath();
      ctx.arc(h.x - r * 0.25, h.y - 1, 1.5, 0, Math.PI * 2);
      ctx.arc(h.x + r * 0.25, h.y - 1, 1.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Normal dot eyes
      ctx.fillStyle = '#f5f0e6';
      ctx.beginPath();
      ctx.arc(h.x - r * 0.25, h.y - 1, 1.8, 0, Math.PI * 2);
      ctx.arc(h.x + r * 0.25, h.y - 1, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  drawXEye(x, y, size) {
    const ctx = this.ctx;
    ctx.beginPath();
    ctx.moveTo(x - size, y - size);
    ctx.lineTo(x + size, y + size);
    ctx.moveTo(x + size, y - size);
    ctx.lineTo(x - size, y + size);
    ctx.stroke();
  }

  drawEffects(pose) {
    const ctx = this.ctx;

    if (this.action === 'crying') {
      // Tear drops
      if (Math.random() < 0.15) {
        this.particles.push({
          x: pose.head.x + (Math.random() < 0.5 ? -1 : 1) * pose.head.r * 0.3,
          y: pose.head.y + pose.head.r * 0.3,
          vx: (Math.random() - 0.5) * 0.5,
          vy: 1 + Math.random(),
          life: 1,
          type: 'tear'
        });
      }
    }

    if (this.action === 'sleeping') {
      // Z particles
      if (Math.random() < 0.03) {
        this.particles.push({
          x: pose.head.x + pose.head.r,
          y: pose.head.y - pose.head.r,
          vx: 0.3,
          vy: -0.5,
          life: 1,
          type: 'z'
        });
      }
    }

    if (this.action === 'laughing') {
      // Ha particles
      if (Math.random() < 0.05) {
        this.particles.push({
          x: pose.head.x + (Math.random() - 0.5) * 20,
          y: pose.head.y - pose.head.r,
          vx: (Math.random() - 0.5) * 0.5,
          vy: -0.8,
          life: 1,
          type: 'ha'
        });
      }
    }

    if (this.action === 'flying') {
      // Speed lines
      if (Math.random() < 0.3) {
        this.particles.push({
          x: this.w,
          y: pose.hip.y + (Math.random() - 0.5) * 60,
          vx: -3 - Math.random() * 2,
          vy: 0,
          life: 1,
          type: 'speed'
        });
      }
    }

    if (this.action === 'fighting') {
      // Impact stars
      if (Math.random() < 0.08) {
        const hand = Math.random() < 0.5 ? pose.lHand : pose.rHand;
        this.particles.push({
          x: hand.x,
          y: hand.y,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          life: 1,
          type: 'impact'
        });
      }
    }

    // Update and draw particles
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.02;

      if (p.life <= 0) {
        this.particles.splice(i, 1);
        continue;
      }

      ctx.globalAlpha = p.life;

      if (p.type === 'tear') {
        ctx.fillStyle = '#588b8b';
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, 2, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'z') {
        ctx.fillStyle = '#588b8b';
        ctx.font = `${10 + (1 - p.life) * 8}px sans-serif`;
        ctx.fillText('Z', p.x, p.y);
      } else if (p.type === 'ha') {
        ctx.fillStyle = '#c8553d';
        ctx.font = `${10 + (1 - p.life) * 6}px sans-serif`;
        ctx.fillText('哈', p.x, p.y);
      } else if (p.type === 'speed') {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + 20, p.y);
        ctx.stroke();
      } else if (p.type === 'impact') {
        ctx.fillStyle = '#c8553d';
        ctx.font = `${12 * p.life}px sans-serif`;
        ctx.fillText('✦', p.x, p.y);
      }
    }
    ctx.globalAlpha = 1;
  }

  animate() {
    const now = performance.now();
    const dt = (now - this.lastTime) / 1000;
    this.lastTime = now;
    this.time += dt;

    if (this.transitionProgress < 1) {
      this.transitionProgress = Math.min(1, this.transitionProgress + dt * 3);
    }

    this.draw();
    requestAnimationFrame(() => this.animate());
  }
}

// ============================================================
//  Reader Controller
// ============================================================
let currentScene = 0;
let stickFigure;

function init() {
  const canvas = document.getElementById('animCanvas');
  stickFigure = new StickFigure(canvas);
  renderScene(0);
}

function renderScene(index) {
  const scene = scenes[index];
  currentScene = index;

  // Update chapter info
  document.getElementById('chapterTitle').textContent = scene.title;
  document.getElementById('chapterMeta').textContent = `场景 ${index + 1} / ${scenes.length}`;
  document.getElementById('currentScene').textContent = index + 1;

  // Render paragraphs with keyword highlighting
  const body = document.getElementById('readerBody');
  body.innerHTML = '';

  // Combine all text for keyword detection
  const fullText = scene.paragraphs.join('');
  const detectedKeywords = detectKeywords(fullText);
  const primaryAction = detectedKeywords.length > 0 ? detectedKeywords[0].action : 'standing';

  scene.paragraphs.forEach(para => {
    const p = document.createElement('p');
    p.innerHTML = highlightKeywords(para, detectedKeywords);
    body.appendChild(p);
  });

  // Update animation
  stickFigure.setAction(primaryAction);

  // Update action badge
  document.getElementById('actionBadge').textContent = actionNames[primaryAction] || '站立';

  // Update detected keywords display
  const kwDiv = document.getElementById('detectedKw');
  if (detectedKeywords.length > 0) {
    kwDiv.innerHTML = detectedKeywords.map(k =>
      `<span>${k.word} → ${actionNames[k.action]}</span>`
    ).join('');
  } else {
    kwDiv.innerHTML = '<span>无</span>';
  }

  // Update nav buttons
  document.getElementById('prevBtn').disabled = index === 0;
  document.getElementById('nextBtn').disabled = index === scenes.length - 1;

  // Scroll to top
  body.scrollTop = 0;
}

function detectKeywords(text) {
  const actionStats = {}; // action -> { count, firstPos, words: Set }
  const sortedKeywords = Object.keys(keywordMap).sort((a, b) => b.length - a.length);
  const matchedRanges = []; // track positions to avoid overlap

  for (const kw of sortedKeywords) {
    let searchFrom = 0;
    while (true) {
      const pos = text.indexOf(kw, searchFrom);
      if (pos === -1) break;
      // Check if this position overlaps with an already matched longer keyword
      const overlaps = matchedRanges.some(r => pos < r.end && pos + kw.length > r.start);
      if (!overlaps) {
        const action = keywordMap[kw];
        if (!actionStats[action]) {
          actionStats[action] = { count: 0, firstPos: pos, words: new Set() };
        }
        actionStats[action].count++;
        actionStats[action].firstPos = Math.min(actionStats[action].firstPos, pos);
        actionStats[action].words.add(kw);
        matchedRanges.push({ start: pos, end: pos + kw.length });
      }
      searchFrom = pos + kw.length;
    }
  }

  // Sort by count (desc), then by first position (asc)
  const results = Object.entries(actionStats)
    .sort((a, b) => b[1].count - a[1].count || a[1].firstPos - b[1].firstPos)
    .map(([action, stats]) => ({
      word: Array.from(stats.words).sort((a, b) => b.length - a.length)[0],
      action: action
    }));

  return results;
}

function highlightKeywords(text, detected) {
  // Collect all keywords that map to any detected action
  const detectedActions = new Set(detected.map(d => d.action));
  const allKws = Object.keys(keywordMap)
    .filter(kw => detectedActions.has(keywordMap[kw]))
    .sort((a, b) => b.length - a.length);

  // Replace keywords with highlighted spans (process longer keywords first)
  // Use placeholder approach to avoid double-highlighting
  let result = text;
  const placeholders = [];
  for (const kw of allKws) {
    const regex = new RegExp(kw, 'g');
    result = result.replace(regex, (match) => {
      const placeholder = `\x00${placeholders.length}\x00`;
      placeholders.push(`<span class="kw">${match}</span>`);
      return placeholder;
    });
  }
  // Restore placeholders
  result = result.replace(/\x00(\d+)\x00/g, (_, i) => placeholders[parseInt(i)]);
  return result;
}

function changeScene(delta) {
  const newIndex = currentScene + delta;
  if (newIndex >= 0 && newIndex < scenes.length) {
    renderScene(newIndex);
  }
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') changeScene(-1);
  if (e.key === 'ArrowRight') changeScene(1);
});

// Initialize
window.addEventListener('load', init);
</script>
