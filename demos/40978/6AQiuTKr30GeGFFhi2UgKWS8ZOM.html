<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI费曼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .clear-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message.loading {
            display: flex;
            gap: 4px;
            padding: 16px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        #userInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            resize: none;
            max-height: 120px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        #userInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #sendBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        #sendBtn:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>AI费曼助手</h1>
            <button class="clear-btn" id="clearBtn">清空对话</button>
        </div>
        <div class="chat-history" id="chatHistory"></div>
        <div class="input-area">
            <textarea id="userInput" placeholder="请输入你的问题..." rows="1"></textarea>
            <button id="sendBtn">发送</button>
        </div>
    </div>

    <script>
        const config = {
            initialMessages: [],
            placeholder: "请输入你的问题...",
            autoScroll: true,
            simulateDelay: 1000,
            aiName: "AI 助手",
            userName: "You",
            enableSubmitOnEnter: true
        };

        let messages = [...config.initialMessages];
        let messageIdCounter = 1;

        const chatHistory = document.getElementById('chatHistory');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');

        function mockFeynmanResponse(question) {
            const lowerQuestion = question.toLowerCase();
            
            if (lowerQuestion.includes('费曼')) {
                return "费曼技巧的核心是：如果你不能向一个12岁孩子解释清楚某个概念，说明你自己也没真正理解它。这个技巧分为四个步骤：1）选择一个概念；2）向小白解释它；3）遇到卡壳就回顾；4）简化语言。";
            }
            if (lowerQuestion.includes('你好') || lowerQuestion.includes('hello')) {
                return "你好！很高兴为你服务。有什么问题我可以帮你解答吗？";
            }
            if (lowerQuestion.includes('量子') || lowerQuestion.includes('力学')) {
                return "量子力学是研究微观粒子运动规律的物理学分支。简单来说，微观世界的粒子可以同时处于多个状态，就像薛定谔的猫可以同时是活的和死的，直到我们观察它。";
            }
            if (lowerQuestion.includes('编程') || lowerQuestion.includes('代码')) {
                return "编程就是告诉计算机做什么。就像写菜谱一样，你需要把步骤一步步写清楚，计算机才能按照你的指令执行。";
            }
            return `这是一个很好的问题！试着用简单语言和类比来思考："${question}"——这正是费曼思考法的第一步！`;
        }

        function createMessageElement(msg) {
            const div = document.createElement('div');
            div.className = `message ${msg.role}`;
            div.id = `msg_${msg.id}`;

            if (msg.status === 'loading') {
                div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            } else {
                div.textContent = msg.content;
            }

            return div;
        }

        function addMessage(content, role, status = 'sent') {
            const msg = {
                id: messageIdCounter++,
                role: role,
                content: content,
                timestamp: Date.now(),
                status: status
            };
            messages.push(msg);
            
            const element = createMessageElement(msg);
            chatHistory.appendChild(element);
            
            if (config.autoScroll) {
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }
            
            return msg;
        }

        function updateLastMessage(content) {
            const lastMsg = messages[messages.length - 1];
            lastMsg.content = content;
            lastMsg.status = 'sent';
            
            const element = document.getElementById(`msg_${lastMsg.id}`);
            element.className = `message ${lastMsg.role}`;
            element.textContent = content;
            
            if (config.autoScroll) {
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }
        }

        function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';

            addMessage('', 'assistant', 'loading');

            setTimeout(() => {
                const reply = mockFeynmanResponse(text);
                updateLastMessage(reply);
            }, config.simulateDelay);
        }

        function autoResize() {
            userInput.style.height = 'auto';
            userInput.style.height = userInput.scrollHeight + 'px';
        }

        sendBtn.addEventListener('click', handleSend);
        
        userInput.addEventListener('input', autoResize);
        
        userInput.addEventListener('keydown', (e) => {
            if (config.enableSubmitOnEnter && e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        function showWelcome() {
            const welcomeMessage = `👋 你好！我是 AI 费曼助手

我可以帮助你：
• 解释复杂的概念（用简单易懂的语言）
• 解答学习和工作中的问题
• 帮你理解编程、科学、技术等知识
• 使用费曼学习法帮你深度学习

试试问我一些问题吧！`;
            addMessage(welcomeMessage, 'assistant');
        }

        clearBtn.addEventListener('click', () => {
            messages = [];
            chatHistory.innerHTML = '';
            messageIdCounter = 1;
            showWelcome();
        });

        showWelcome();
    </script>
</body>
</html>
