<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 食材管家</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        /* 手机壳 */
        .phone-frame {
            width: 390px;
            min-height: 844px;
            background: #fff;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2), inset 0 0 0 2px #e0e0e0;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 状态栏 */
        .status-bar {
            height: 50px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        /* 顶部导航 */
        .top-nav {
            padding: 0 20px 16px;
            background: #fff;
        }

        .top-nav h1 {
            font-size: 26px;
            font-weight: 800;
            color: #1a1a2e;
        }

        .top-nav .greeting {
            font-size: 14px;
            color: #999;
            margin-top: 2px;
        }

        /* 搜索栏 */
        .search-bar {
            margin: 0 20px 16px;
            background: #f5f6fa;
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #bbb;
            font-size: 14px;
            cursor: pointer;
        }

        /* 快捷操作 */
        .quick-actions {
            display: flex;
            gap: 12px;
            padding: 0 20px 20px;
        }

        .quick-btn {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 14px 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .quick-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .quick-btn .btn-icon {
            font-size: 22px;
        }

        .quick-btn.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .quick-btn.third {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        /* 内容区 */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 20px;
        }

        /* 区块标题 */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .section-header .more {
            font-size: 13px;
            color: #667eea;
            cursor: pointer;
        }

        /* 临期提醒横幅 */
        .alert-banner {
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .alert-banner:hover {
            transform: scale(1.02);
        }

        .alert-banner .alert-icon {
            font-size: 28px;
        }

        .alert-banner .alert-text h4 {
            font-size: 14px;
            color: #e65100;
        }

        .alert-banner .alert-text p {
            font-size: 12px;
            color: #bf360c;
            margin-top: 2px;
        }

        .alert-banner .alert-count {
            margin-left: auto;
            background: #e65100;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        /* 食材卡片网格 */
        .food-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .food-card {
            background: #f8f9fe;
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .food-card:hover {
            background: #eef0ff;
            transform: translateY(-2px);
        }

        .food-card .food-emoji {
            font-size: 30px;
            margin-bottom: 6px;
        }

        .food-card .food-name {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }

        .food-card .food-qty {
            font-size: 11px;
            color: #999;
            margin-top: 2px;
        }

        .food-card .expiry-tag {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 600;
        }

        .expiry-tag.warn {
            background: #fff3e0;
            color: #e65100;
        }

        .expiry-tag.ok {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .expiry-tag.danger {
            background: #ffebee;
            color: #c62828;
        }

        /* 菜谱推荐卡片 */
        .recipe-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 24px;
        }

        .recipe-scroll::-webkit-scrollbar {
            display: none;
        }

        .recipe-card {
            min-width: 200px;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            flex-shrink: 0;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .recipe-card:hover {
            transform: translateY(-3px);
        }

        .recipe-img {
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .recipe-card .recipe-info {
            padding: 12px;
        }

        .recipe-card .recipe-name {
            font-size: 14px;
            font-weight: 700;
            color: #333;
        }

        .recipe-card .recipe-meta {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            display: flex;
            gap: 8px;
        }

        .recipe-card .match-tag {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 6px;
            margin-top: 6px;
            font-weight: 600;
        }

        /* 购物清单 */
        .shopping-list {
            background: #f8f9fe;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .shop-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .shop-item:last-child {
            border-bottom: none;
        }

        .shop-item .check {
            width: 20px;
            height: 20px;
            border: 2px solid #ccc;
            border-radius: 50%;
            margin-right: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .shop-item .check.checked {
            background: #667eea;
            border-color: #667eea;
            color: #fff;
            font-size: 12px;
        }

        .shop-item .item-name {
            flex: 1;
            color: #333;
        }

        .shop-item .item-name.done {
            text-decoration: line-through;
            color: #bbb;
        }

        .shop-item .item-qty {
            color: #999;
            font-size: 12px;
        }

        /* 底部导航 */
        .bottom-nav {
            display: flex;
            background: #fff;
            border-top: 1px solid #f0f0f0;
            padding: 8px 0 24px;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            color: #bbb;
            font-size: 11px;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: #667eea;
        }

        .nav-item .nav-icon {
            font-size: 22px;
        }

        /* 拍照弹窗 */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: #fff;
            border-radius: 24px;
            padding: 30px 24px;
            width: 85%;
            text-align: center;
        }

        .modal-content h3 {
            font-size: 20px;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .modal-content p {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
        }

        .scan-area {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            border: 3px dashed #667eea;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #667eea;
            font-size: 14px;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .scan-area .scan-icon {
            font-size: 40px;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #667eea, transparent);
            animation: scanMove 2s ease-in-out infinite;
        }

        @keyframes scanMove {

            0%,
            100% {
                top: 10%;
            }

            50% {
                top: 85%;
            }
        }

        .modal-btns {
            display: flex;
            gap: 12px;
        }

        .modal-btns button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .modal-btns .btn-cancel {
            background: #f0f2f5;
            color: #666;
        }

        .modal-btns .btn-confirm {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }

        /* 识别结果弹窗 */
        .result-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .result-overlay.show {
            display: flex;
        }

        .result-content {
            background: #fff;
            border-radius: 24px;
            padding: 24px;
            width: 85%;
        }

        .result-content h3 {
            font-size: 18px;
            color: #1a1a2e;
            margin-bottom: 16px;
            text-align: center;
        }

        .result-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item .r-emoji {
            font-size: 24px;
            margin-right: 12px;
        }

        .result-item .r-info {
            flex: 1;
        }

        .result-item .r-name {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .result-item .r-detail {
            font-size: 12px;
            color: #999;
        }

        .result-item .r-add {
            background: #667eea;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .result-item .r-add.added {
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* 菜谱详情弹窗 */
        .recipe-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .recipe-overlay.show {
            display: flex;
        }

        .recipe-detail {
            background: #fff;
            border-radius: 24px;
            padding: 24px;
            width: 90%;
            max-height: 80%;
            overflow-y: auto;
        }

        .recipe-detail h3 {
            font-size: 20px;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .recipe-detail .rd-meta {
            font-size: 12px;
            color: #999;
            margin-bottom: 16px;
        }

        .recipe-detail .rd-section {
            margin-bottom: 16px;
        }

        .recipe-detail .rd-section h4 {
            font-size: 14px;
            color: #667eea;
            margin-bottom: 8px;
        }

        .recipe-detail .rd-section p,
        .recipe-detail .rd-section li {
            font-size: 13px;
            color: #555;
            line-height: 1.8;
        }

        .recipe-detail .rd-section ul {
            padding-left: 18px;
        }

        .recipe-detail .close-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: #f0f2f5;
            border: none;
            font-size: 14px;
            color: #666;
            cursor: pointer;
            margin-top: 8px;
        }

        /* Toast 提示 */
        .toast {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 200;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 420px) {
            body {
                padding: 0;
            }

            .phone-frame {
                width: 100%;
                min-height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>
    <div class="phone-frame">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 🔋</span>
        </div>

        <!-- 顶部 -->
        <div class="top-nav">
            <h1>AI 食材管家</h1>
            <div class="greeting">今天想做点什么好吃的？</div>
        </div>

        <!-- 搜索 -->
        <div class="search-bar" onclick="showToast('搜索功能开发中...')">
            🔍 搜索食材、菜谱...
        </div>

        <!-- 快捷操作 -->
        <div class="quick-actions">
            <button class="quick-btn" onclick="openScanModal()">
                <span class="btn-icon">📸</span>
                拍照录入
            </button>
            <button class="quick-btn secondary" onclick="showToast('AI 正在为你生成菜谱...')">
                <span class="btn-icon">🍳</span>
                AI 推荐菜谱
            </button>
            <button class="quick-btn third" onclick="showToast('购物清单已更新')">
                <span class="btn-icon">🛒</span>
                购物清单
            </button>
        </div>

        <!-- 内容区 -->
        <div class="content-area">
            <!-- 临期提醒 -->
            <div class="alert-banner" onclick="showToast('查看临期食材详情')">
                <span class="alert-icon">⚠️</span>
                <div class="alert-text">
                    <h4>临期食材提醒</h4>
                    <p>牛奶、生菜即将过期，建议优先使用</p>
                </div>
                <span class="alert-count">3</span>
            </div>

            <!-- 我的冰箱 -->
            <div class="section-header">
                <h2>🧊 我的冰箱</h2>
                <span class="more" onclick="showToast('查看全部食材')">全部 ›</span>
            </div>
            <div class="food-grid" id="foodGrid">
                <!-- JS 动态渲染 -->
            </div>

            <!-- AI 菜谱推荐 -->
            <div class="section-header">
                <h2>🍳 AI 推荐菜谱</h2>
                <span class="more" onclick="showToast('更多菜谱')">换一批 ›</span>
            </div>
            <div class="recipe-scroll" id="recipeScroll">
                <!-- JS 动态渲染 -->
            </div>

            <!-- 购物清单 -->
            <div class="section-header">
                <h2>🛒 购物清单</h2>
                <span class="more" onclick="showToast('编辑购物清单')">编辑 ›</span>
            </div>
            <div class="shopping-list" id="shoppingList">
                <!-- JS 动态渲染 -->
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <span class="nav-icon">🏠</span>
                首页
            </div>
            <div class="nav-item" onclick="showToast('冰箱管理页开发中...')">
                <span class="nav-icon">🧊</span>
                冰箱
            </div>
            <div class="nav-item" onclick="openScanModal()">
                <span class="nav-icon">➕</span>
                录入
            </div>
            <div class="nav-item" onclick="showToast('菜谱库开发中...')">
                <span class="nav-icon">📖</span>
                菜谱
            </div>
            <div class="nav-item" onclick="showToast('个人中心开发中...')">
                <span class="nav-icon">👤</span>
                我的
            </div>
        </div>

        <!-- 拍照弹窗 -->
        <div class="modal-overlay" id="scanModal">
            <div class="modal-content">
                <h3>拍照识别食材</h3>
                <p>对准冰箱或食材拍照，AI 自动识别</p>
                <div class="scan-area">
                    <div class="scan-line"></div>
                    <span class="scan-icon">📷</span>
                    <span>点击拍照</span>
                </div>
                <div class="modal-btns">
                    <button class="btn-cancel" onclick="closeScanModal()">取消</button>
                    <button class="btn-confirm" onclick="simulateScan()">识别</button>
                </div>
            </div>
        </div>

        <!-- 识别结果弹窗 -->
        <div class="result-overlay" id="resultModal">
            <div class="result-content">
                <h3>✅ 识别结果</h3>
                <div id="resultList"></div>
                <div class="modal-btns" style="margin-top: 16px;">
                    <button class="btn-cancel" onclick="closeResultModal()">取消</button>
                    <button class="btn-confirm" onclick="addAllToInventory()">全部加入</button>
                </div>
            </div>
        </div>

        <!-- 菜谱详情弹窗 -->
        <div class="recipe-overlay" id="recipeModal">
            <div class="recipe-detail" id="recipeDetail">
                <!-- JS 动态渲染 -->
            </div>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        // ===== 数据 =====
        const foodData = [
            { emoji: '🥚', name: '鸡蛋', qty: '6个', expiry: '5天', status: 'ok' },
            { emoji: '🥛', name: '牛奶', qty: '1盒', expiry: '2天', status: 'danger' },
            { emoji: '🥬', name: '生菜', qty: '1颗', expiry: '1天', status: 'danger' },
            { emoji: '🍅', name: '番茄', qty: '3个', expiry: '4天', status: 'warn' },
            { emoji: '🥩', name: '猪肉', qty: '300g', expiry: '3天', status: 'warn' },
            { emoji: '🍚', name: '大米', qty: '2kg', expiry: '60天', status: 'ok' },
            { emoji: '🧅', name: '洋葱', qty: '2个', expiry: '14天', status: 'ok' },
            { emoji: '🥕', name: '胡萝卜', qty: '2根', expiry: '7天', status: 'ok' },
            { emoji: '🍗', name: '鸡翅', qty: '6个', expiry: '2天', status: 'danger' },
        ];

        const recipeData = [
            {
                emoji: '🍳', name: '番茄炒蛋', time: '15分钟', difficulty: '简单',
                match: '食材匹配 100%', color: '#fff3e0',
                ingredients: ['番茄 2个', '鸡蛋 3个', '盐适量', '糖少许', '食用油'],
                steps: ['番茄切块，鸡蛋打散', '热锅倒油，先炒鸡蛋盛出', '再倒油炒番茄至出汁', '倒回鸡蛋翻炒，加盐和糖调味']
            },
            {
                emoji: '🥘', name: '洋葱炒猪肉', time: '20分钟', difficulty: '简单',
                match: '食材匹配 90%', color: '#fce4ec',
                ingredients: ['猪肉 200g', '洋葱 1个', '生抽', '料酒', '盐'],
                steps: ['猪肉切片，用生抽料酒腌制', '洋葱切丝', '热锅炒肉变色盛出', '炒洋葱至透明，倒回肉片翻炒调味']
            },
            {
                emoji: '🥗', name: '生菜沙拉', time: '10分钟', difficulty: '简单',
                match: '食材匹配 80%', color: '#e8f5e9',
                ingredients: ['生菜 1颗', '胡萝卜 1根', '沙拉酱', '番茄 1个'],
                steps: ['生菜洗净撕成小块', '胡萝卜切丝，番茄切块', '所有食材放入碗中', '淋上沙拉酱拌匀']
            },
            {
                emoji: '🍗', name: '可乐鸡翅', time: '30分钟', difficulty: '中等',
                match: '食材匹配 85%', color: '#fff8e1',
                ingredients: ['鸡翅 6个', '可乐 1罐', '生抽', '老抽', '姜'],
                steps: ['鸡翅划刀，焯水去腥', '热锅煎至两面金黄', '倒入可乐、生抽、老抽', '大火烧开转小火收汁']
            },
        ];

        const shoppingData = [
            { name: '生姜', qty: '1块', checked: false },
            { name: '大蒜', qty: '3头', checked: false },
            { name: '酱油', qty: '1瓶', checked: true },
            { name: '豆腐', qty: '1块', checked: false },
            { name: '青椒', qty: '2个', checked: false },
        ];

        const scanResults = [
            { emoji: '🥦', name: '西兰花', detail: '约 1 颗 · 保质期约 5 天' },
            { emoji: '🧈', name: '黄油', detail: '约 100g · 保质期约 30 天' },
            { emoji: '🫑', name: '青椒', detail: '约 2 个 · 保质期约 5 天' },
            { emoji: '🧀', name: '芝士', detail: '约 200g · 保质期约 15 天' },
        ];

        // ===== 渲染 =====
        function renderFoodGrid() {
            const grid = document.getElementById('foodGrid');
            grid.innerHTML = foodData.map(f => `
                <div class="food-card" onclick="showToast('${f.name}：剩余 ${f.expiry}')">
                    <span class="expiry-tag ${f.status}">${f.expiry}</span>
                    <div class="food-emoji">${f.emoji}</div>
                    <div class="food-name">${f.name}</div>
                    <div class="food-qty">${f.qty}</div>
                </div>
            `).join('');
        }

        function renderRecipes() {
            const scroll = document.getElementById('recipeScroll');
            scroll.innerHTML = recipeData.map((r, i) => `
                <div class="recipe-card" onclick="openRecipeDetail(${i})">
                    <div class="recipe-img" style="background:${r.color}">${r.emoji}</div>
                    <div class="recipe-info">
                        <div class="recipe-name">${r.name}</div>
                        <div class="recipe-meta">
                            <span>⏱ ${r.time}</span>
                            <span>📊 ${r.difficulty}</span>
                        </div>
                        <span class="match-tag">${r.match}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderShoppingList() {
            const list = document.getElementById('shoppingList');
            list.innerHTML = shoppingData.map((s, i) => `
                <div class="shop-item">
                    <div class="check ${s.checked ? 'checked' : ''}" onclick="toggleCheck(${i})">
                        ${s.checked ? '✓' : ''}
                    </div>
                    <span class="item-name ${s.checked ? 'done' : ''}">${s.name}</span>
                    <span class="item-qty">${s.qty}</span>
                </div>
            `).join('');
        }

        // ===== 交互 =====
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function openScanModal() {
            document.getElementById('scanModal').classList.add('show');
        }
        function closeScanModal() {
            document.getElementById('scanModal').classList.remove('show');
        }

        function simulateScan() {
            closeScanModal();
            showToast('AI 正在识别...');
            setTimeout(() => {
                renderScanResults();
                document.getElementById('resultModal').classList.add('show');
            }, 1200);
        }

        function renderScanResults() {
            const list = document.getElementById('resultList');
            list.innerHTML = scanResults.map((r, i) => `
                <div class="result-item">
                    <span class="r-emoji">${r.emoji}</span>
                    <div class="r-info">
                        <div class="r-name">${r.name}</div>
                        <div class="r-detail">${r.detail}</div>
                    </div>
                    <button class="r-add" id="addBtn${i}" onclick="addToInventory(${i})">加入</button>
                </div>
            `).join('');
        }

        function addToInventory(idx) {
            const btn = document.getElementById('addBtn' + idx);
            btn.textContent = '已加入';
            btn.classList.add('added');
            btn.disabled = true;
            showToast(scanResults[idx].name + ' 已加入冰箱');
        }

        function addAllToInventory() {
            scanResults.forEach((_, i) => {
                const btn = document.getElementById('addBtn' + i);
                if (btn && !btn.disabled) {
                    btn.textContent = '已加入';
                    btn.classList.add('added');
                    btn.disabled = true;
                }
            });
            showToast('全部食材已加入冰箱！');
            setTimeout(() => closeResultModal(), 800);
        }

        function closeResultModal() {
            document.getElementById('resultModal').classList.remove('show');
        }

        function openRecipeDetail(idx) {
            const r = recipeData[idx];
            const detail = document.getElementById('recipeDetail');
            detail.innerHTML = `
                <h3>${r.emoji} ${r.name}</h3>
                <div class="rd-meta">⏱ ${r.time} · 📊 ${r.difficulty} · ${r.match}</div>
                <div class="rd-section">
                    <h4>📋 所需食材</h4>
                    <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
                </div>
                <div class="rd-section">
                    <h4>👨‍🍳 烹饪步骤</h4>
                    <ol>${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>
                </div>
                <button class="close-btn" onclick="closeRecipeDetail()">关闭</button>
            `;
            document.getElementById('recipeModal').classList.add('show');
        }

        function closeRecipeDetail() {
            document.getElementById('recipeModal').classList.remove('show');
        }

        function toggleCheck(idx) {
            shoppingData[idx].checked = !shoppingData[idx].checked;
            renderShoppingList();
        }

        // ===== 初始化 =====
        renderFoodGrid();
        renderRecipes();
        renderShoppingList();
    </script>
</body>

</html>
