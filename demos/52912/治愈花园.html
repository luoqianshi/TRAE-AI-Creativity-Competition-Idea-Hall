<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>治愈花园</title>
<style>
  :root {
    --sky-top: #a8d8ea;
    --sky-bottom: #f6f9fc;
    --grass: #7ec882;
    --grass-dark: #5ba85e;
    --soil: #8B6F47;
    --accent: #ff9a76;
    --text: #3d3d3d;
    --card-bg: rgba(255,255,255,0.92);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; }

  /* ===== 主场景 ===== */
  #app {
    width:100%; height:100%; position:relative;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 60%, var(--grass) 60%, var(--grass-dark) 100%);
    overflow: hidden;
    touch-action: manipulation;
  }

  /* 太阳 */
  .sun {
    position:absolute; top:6%; right:12%; width:60px; height:60px;
    background: radial-gradient(circle, #ffe066 40%, #ffcc33 100%);
    border-radius:50%; box-shadow: 0 0 40px 10px rgba(255,204,51,0.4);
    animation: sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%,100%{ transform:scale(1); box-shadow:0 0 40px 10px rgba(255,204,51,0.4); }
    50%{ transform:scale(1.08); box-shadow:0 0 60px 15px rgba(255,204,51,0.5); }
  }

  /* 云朵 */
  .cloud {
    position:absolute; background:rgba(255,255,255,0.85); border-radius:50px;
    animation: cloudFloat linear infinite;
  }
  .cloud::before, .cloud::after {
    content:''; position:absolute; background:inherit; border-radius:50%;
  }
  .cloud-1 { width:90px; height:30px; top:10%; left:-100px; animation-duration:35s; }
  .cloud-1::before { width:40px; height:40px; top:-20px; left:15px; }
  .cloud-1::after { width:30px; height:30px; top:-12px; left:45px; }
  .cloud-2 { width:70px; height:24px; top:18%; left:-80px; animation-duration:45s; animation-delay:10s; }
  .cloud-2::before { width:32px; height:32px; top:-16px; left:12px; }
  .cloud-2::after { width:24px; height:24px; top:-10px; left:36px; }
  .cloud-3 { width:100px; height:32px; top:5%; left:-120px; animation-duration:55s; animation-delay:20s; }
  .cloud-3::before { width:44px; height:44px; top:-22px; left:18px; }
  .cloud-3::after { width:34px; height:34px; top:-14px; left:52px; }
  @keyframes cloudFloat {
    from { transform:translateX(0); }
    to { transform:translateX(calc(100vw + 200px)); }
  }

  /* 草地装饰 */
  .grass-blade {
    position:absolute; bottom:38%; width:3px; border-radius:2px 2px 0 0;
    background: linear-gradient(to top, var(--grass-dark), #a8e6a3);
    transform-origin: bottom center;
    animation: sway 3s ease-in-out infinite;
  }
  @keyframes sway {
    0%,100%{ transform:rotate(-5deg); }
    50%{ transform:rotate(5deg); }
  }

  /* 花园区域 */
  #garden {
    position:absolute; bottom:4%; left:50%; transform:translateX(-50%);
    width:92%; max-width:420px; height:52%;
    display:grid; grid-template-columns: repeat(4,1fr); grid-template-rows: repeat(3,1fr);
    gap:8px; padding:12px;
  }

  /* 花盆 */
  .pot {
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    cursor:pointer; border-radius:12px; transition: transform 0.2s;
  }
  .pot:active { transform:scale(0.95); }
  .pot-body {
    width:80%; height:36%; background: linear-gradient(135deg, #d4956a, var(--soil));
    border-radius: 4px 4px 12px 12px; position:relative;
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.15);
  }
  .pot-rim {
    width:90%; height:8%; background: linear-gradient(135deg, #e0a87c, #c4855a);
    border-radius:4px 4px 0 0; margin-bottom:-1px;
  }
  .pot-soil {
    position:absolute; top:0; left:10%; width:80%; height:40%;
    background: radial-gradient(ellipse, #6b4e2e, #5a3e1e);
    border-radius: 0 0 4px 4px;
  }

  /* 植物容器 */
  .plant-area {
    position:absolute; bottom:34%; left:50%; transform:translateX(-50%);
    width:100%; height:60%; display:flex; align-items:flex-end; justify-content:center;
  }

  /* 花朵样式 */
  .flower { position:relative; animation: growIn 0.8s ease-out forwards; }
  @keyframes growIn {
    from { transform:scale(0) translateY(10px); opacity:0; }
    to { transform:scale(1) translateY(0); opacity:1; }
  }
  .stem { width:3px; background:#4a9e4e; border-radius:2px; margin:0 auto; }
  .leaf {
    position:absolute; width:14px; height:8px; background:#5cb85c; border-radius:50%;
  }
  .leaf-left { left:-12px; transform:rotate(-30deg); }
  .leaf-right { right:-12px; transform:rotate(30deg); }

  .bloom {
    position:relative; margin:0 auto;
  }
  .petal {
    position:absolute; border-radius:50%; transform-origin:center bottom;
  }

  /* 向日葵 */
  .flower-sunflower .bloom { width:28px; height:28px; }
  .flower-sunflower .petal {
    width:10px; height:14px; background:#ffd54f;
  }
  .flower-sunflower .center {
    position:absolute; width:14px; height:14px; background:#795548;
    border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%); z-index:2;
  }

  /* 玫瑰 */
  .flower-rose .bloom { width:24px; height:24px; }
  .flower-rose .petal {
    width:11px; height:11px; background:#ef5350; border-radius:50%;
  }
  .flower-rose .center {
    position:absolute; width:8px; height:8px; background:#ffcdd2;
    border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%); z-index:2;
  }

  /* 郁金香 */
  .flower-tulip .bloom { width:20px; height:26px; }
  .flower-tulip .petal {
    width:12px; height:20px; background:#ce93d8; border-radius:50% 50% 10% 10%;
  }

  /* 雏菊 */
  .flower-daisy .bloom { width:26px; height:26px; }
  .flower-daisy .petal {
    width:8px; height:12px; background:#fff; border:1px solid #e0e0e0;
  }
  .flower-daisy .center {
    position:absolute; width:10px; height:10px; background:#ffeb3b;
    border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%); z-index:2;
  }

  /* 薰衣草 */
  .flower-lavender .bloom { width:12px; height:30px; }
  .flower-lavender .petal {
    width:6px; height:8px; background:#b39ddb; border-radius:50%;
  }

  /* 花朵摇摆 */
  .flower-grown { animation: flowerSway 4s ease-in-out infinite; }
  @keyframes flowerSway {
    0%,100%{ transform:rotate(-3deg); }
    50%{ transform:rotate(3deg); }
  }

  /* 蝴蝶 */
  .butterfly {
    position:absolute; width:24px; height:24px; pointer-events:none; z-index:10;
    animation: butterflyFly 8s ease-in-out infinite;
  }
  .butterfly-wing {
    position:absolute; width:10px; height:14px; border-radius:50%;
    animation: wingFlap 0.3s ease-in-out infinite alternate;
  }
  .butterfly-wing-left { background:rgba(255,183,197,0.8); left:0; transform-origin:right center; }
  .butterfly-wing-right { background:rgba(255,183,197,0.8); right:0; transform-origin:left center; }
  @keyframes wingFlap {
    from { transform:scaleX(1); }
    to { transform:scaleX(0.3); }
  }
  @keyframes butterflyFly {
    0%{ top:30%; left:10%; }
    25%{ top:25%; left:60%; }
    50%{ top:35%; left:80%; }
    75%{ top:20%; left:40%; }
    100%{ top:30%; left:10%; }
  }

  /* 种子动画 */
  .seed-anim {
    position:absolute; bottom:34%; left:50%; transform:translateX(-50%);
    width:8px; height:8px; background:#8d6e63; border-radius:50%;
    animation: seedDrop 0.5s ease-in forwards;
  }
  @keyframes seedDrop {
    from { bottom:80%; opacity:1; }
    to { bottom:34%; opacity:0.8; }
  }

  /* 生长阶段 */
  .sprout {
    width:4px; height:16px; background:linear-gradient(to top, #4caf50, #81c784);
    border-radius:2px; margin:0 auto; animation: sproutGrow 0.6s ease-out forwards;
  }
  @keyframes sproutGrow {
    from { height:0; } to { height:16px; }
  }
  .sprout-leaf {
    position:absolute; width:10px; height:6px; background:#66bb6a; border-radius:50%;
  }
  .sprout-leaf-l { left:-8px; top:8px; transform:rotate(-25deg); }
  .sprout-leaf-r { right:-8px; top:8px; transform:rotate(25deg); }

  /* 花瓣飘落 */
  .falling-petal {
    position:absolute; width:8px; height:8px; border-radius:50% 0 50% 50%;
    pointer-events:none; z-index:5;
    animation: petalFall linear forwards;
  }
  @keyframes petalFall {
    0% { opacity:1; transform:translateY(0) rotate(0deg); }
    100% { opacity:0; transform:translateY(120px) rotate(360deg) translateX(30px); }
  }

  /* ===== 顶部 UI ===== */
  #top-bar {
    position:absolute; top:0; left:0; right:0; padding:12px 16px;
    display:flex; justify-content:space-between; align-items:center;
    z-index:20; pointer-events:none;
  }
  #top-bar > * { pointer-events:auto; }
  .title-badge {
    background: var(--card-bg); padding:8px 16px; border-radius:20px;
    box-shadow:0 2px 12px rgba(0,0,0,0.08); font-size:15px; font-weight:600;
    color:var(--text); backdrop-filter:blur(8px);
  }
  .stats {
    display:flex; gap:8px;
  }
  .stat-badge {
    background:var(--card-bg); padding:6px 12px; border-radius:16px;
    box-shadow:0 2px 12px rgba(0,0,0,0.08); font-size:13px;
    color:var(--text); backdrop-filter:blur(8px); display:flex; align-items:center; gap:4px;
  }
  .stat-icon { font-size:16px; }

  /* 底部工具栏 */
  #toolbar {
    position:absolute; bottom:0; left:0; right:0; padding:10px 16px 20px;
    display:flex; justify-content:center; gap:10px; z-index:20;
    background:linear-gradient(to top, rgba(255,255,255,0.9), transparent);
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  .tool-btn {
    padding:10px 18px; border-radius:20px; border:none; font-size:13px;
    font-weight:600; cursor:pointer; transition:all 0.2s;
    box-shadow:0 2px 8px rgba(0,0,0,0.1); color:#fff;
  }
  .tool-btn:active { transform:scale(0.95); }
  .tool-btn.active { box-shadow:0 0 0 3px rgba(255,255,255,0.5), 0 2px 8px rgba(0,0,0,0.15); }
  .btn-plant { background:linear-gradient(135deg, #66bb6a, #43a047); }
  .btn-water { background:linear-gradient(135deg, #42a5f5, #1e88e5); }
  .btn-shake { background:linear-gradient(135deg, #ffa726, #fb8c00); }
  .btn-clear { background:linear-gradient(135deg, #ef5350, #e53935); }

  /* ===== 弹层 ===== */
  .screen {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:100; opacity:0; visibility:hidden; pointer-events:none;
    transition: opacity 0.3s, visibility 0.3s;
    background:rgba(0,0,0,0.35); backdrop-filter:blur(4px);
  }
  .screen.active { opacity:1; visibility:visible; pointer-events:auto; }
  .modal-card {
    background:#fff; border-radius:20px; padding:28px 24px; width:85%; max-width:340px;
    text-align:center; box-shadow:0 8px 32px rgba(0,0,0,0.15);
    transform:scale(0.9); transition:transform 0.3s;
  }
  .screen.active .modal-card { transform:scale(1); }
  .modal-title { font-size:20px; font-weight:700; color:var(--text); margin-bottom:8px; }
  .modal-message { font-size:14px; color:#666; line-height:1.6; margin-bottom:20px; }
  .modal-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .modal-btn {
    padding:10px 24px; border-radius:16px; border:none; font-size:14px;
    font-weight:600; cursor:pointer; transition:all 0.2s;
  }
  .modal-btn:active { transform:scale(0.95); }
  .modal-btn-primary { background:linear-gradient(135deg, #66bb6a, #43a047); color:#fff; }
  .modal-btn-secondary { background:#f5f5f5; color:#666; }

  /* 鼓励语 */
  .encourage-toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:var(--card-bg); padding:12px 24px; border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,0.12); font-size:15px; font-weight:600;
    color:var(--text); z-index:50; pointer-events:none;
    animation: toastAnim 1.8s ease-out forwards;
  }
  @keyframes toastAnim {
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0.8); }
    15%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
    70%{ opacity:1; transform:translate(-50%,-60%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-80%) scale(0.9); }
  }

  /* 水滴动画 */
  .water-drop {
    position:absolute; width:6px; height:10px; background:#42a5f5;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: waterDrop 0.6s ease-in forwards; pointer-events:none; z-index:5;
  }
  @keyframes waterDrop {
    0%{ top:-20px; opacity:1; }
    100%{ top:60%; opacity:0; }
  }

  /* 星星粒子 */
  .sparkle {
    position:absolute; width:6px; height:6px; pointer-events:none; z-index:5;
    animation: sparkleAnim 0.8s ease-out forwards;
  }
  @keyframes sparkleAnim {
    0%{ opacity:1; transform:scale(0); }
    50%{ opacity:1; transform:scale(1.2); }
    100%{ opacity:0; transform:scale(0) translateY(-20px); }
  }

  /* 响应式 */
  @media (max-height:600px) {
    #garden { height:46%; }
    .sun { width:40px; height:40px; top:4%; }
  }
  @media (min-width:500px) {
    #garden { max-width:480px; gap:12px; }
  }
</style>
</head>
<body>
<div id="app">
  <!-- 天空装饰 -->
  <div class="sun"></div>
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>

  <!-- 蝴蝶 -->
  <div class="butterfly" id="butterfly1">
    <div class="butterfly-wing butterfly-wing-left"></div>
    <div class="butterfly-wing butterfly-wing-right"></div>
  </div>
  <div class="butterfly" id="butterfly2" style="animation-delay:-3s; animation-duration:10s;">
    <div class="butterfly-wing butterfly-wing-left" style="background:rgba(179,157,219,0.8);"></div>
    <div class="butterfly-wing butterfly-wing-right" style="background:rgba(179,157,219,0.8);"></div>
  </div>

  <!-- 顶部信息栏 -->
  <div id="top-bar">
    <div class="title-badge">🌿 治愈花园</div>
    <div class="stats">
      <div class="stat-badge"><span class="stat-icon">🌸</span><span id="flower-count">0</span></div>
      <div class="stat-badge"><span class="stat-icon">✨</span><span id="best-score">0</span></div>
    </div>
  </div>

  <!-- 花园 -->
  <div id="garden"></div>

  <!-- 底部工具栏 -->
  <div id="toolbar">
    <button class="tool-btn btn-plant active" data-tool="plant">🌱 种花</button>
    <button class="tool-btn btn-water" data-tool="water">💧 浇水</button>
    <button class="tool-btn btn-shake" data-tool="shake">🍃 摇一摇</button>
    <button class="tool-btn btn-clear" data-tool="clear">🗑️ 清理</button>
  </div>

  <!-- 开始弹层 -->
  <div id="screen-start" class="screen active" aria-hidden="false">
    <div class="modal-card">
      <h2 class="modal-title">🌿 治愈花园</h2>
      <p class="modal-message">
        在繁忙的生活中，给自己留一片小花园吧。<br>
        点击花盆种下种子，浇水让它成长，<br>
        看着花朵绽放，感受片刻宁静 🌸
      </p>
      <div class="modal-actions">
        <button type="button" class="modal-btn modal-btn-primary" data-action="start">开始体验</button>
      </div>
    </div>
  </div>

  <!-- 收获弹层 -->
  <div id="screen-harvest" class="screen" aria-hidden="true">
    <div class="modal-card">
      <h2 class="modal-title" id="harvest-title">🌸 花园满园</h2>
      <p class="modal-message" id="harvest-msg"></p>
      <div class="modal-actions">
        <button type="button" class="modal-btn modal-btn-primary" data-action="restart">重新开始</button>
        <button type="button" class="modal-btn modal-btn-secondary" data-action="continue">继续欣赏</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  /* ===== 状态管理 ===== */
  const STORAGE_PREFIX = 'healing_garden_';
  let currentTool = 'plant';
  let flowerCount = 0;
  let bestScore = parseInt(localStorage.getItem(STORAGE_PREFIX + 'best') || '0', 10);
  let pots = [];
  const POT_COUNT = 12;

  /* 花朵类型 */
  const FLOWER_TYPES = ['sunflower', 'rose', 'tulip', 'daisy', 'lavender'];
  const FLOWER_NAMES = { sunflower:'向日葵', rose:'玫瑰', tulip:'郁金香', daisy:'雏菊', lavender:'薰衣草' };
  const FLOWER_COLORS = { sunflower:'#ffd54f', rose:'#ef5350', tulip:'#ce93d8', daisy:'#fff', lavender:'#b39ddb' };

  /* 鼓励语 */
  const ENCOURAGES = [
    '每一朵花都是你的小心意 🌷',
    '花园越来越美了呢 ✨',
    '慢慢来，不着急 🌿',
    '生活需要一点仪式感 🌸',
    '你种下的不只是花，是希望 💛',
    '真好，又多了一朵花 🌺',
    '享受这份宁静吧 🍃',
    '你的花园独一无二 🦋',
    '种花是一种修行 🌱',
    '花开有时，静待美好 🌼',
  ];

  /* ===== DOM 引用 ===== */
  const garden = document.getElementById('garden');
  const flowerCountEl = document.getElementById('flower-count');
  const bestScoreEl = document.getElementById('best-score');
  const butterfly1 = document.getElementById('butterfly1');
  const butterfly2 = document.getElementById('butterfly2');

  /* ===== 初始化 ===== */
  function init() {
    bestScoreEl.textContent = bestScore;
    createGrassBlades();
    createPots();
    bindToolbar();
    bindScreens();
  }

  /* 创建草叶装饰 */
  function createGrassBlades() {
    const app = document.getElementById('app');
    for (let i = 0; i < 20; i++) {
      const blade = document.createElement('div');
      blade.className = 'grass-blade';
      blade.style.left = (Math.random() * 100) + '%';
      blade.style.height = (12 + Math.random() * 18) + 'px';
      blade.style.animationDelay = (Math.random() * 3) + 's';
      blade.style.animationDuration = (2.5 + Math.random() * 2) + 's';
      app.appendChild(blade);
    }
  }

  /* 创建花盆 */
  function createPots() {
    garden.innerHTML = '';
    pots = [];
    for (let i = 0; i < POT_COUNT; i++) {
      const pot = document.createElement('div');
      pot.className = 'pot';
      pot.dataset.index = i;
      pot.innerHTML = `
        <div class="plant-area"></div>
        <div class="pot-rim"></div>
        <div class="pot-body"><div class="pot-soil"></div></div>
      `;
      pot.addEventListener('pointerdown', onPotClick);
      garden.appendChild(pot);
      pots.push({ el: pot, state: 'empty', type: null, timer: null });
    }
  }

  /* ===== 工具栏 ===== */
  function bindToolbar() {
    document.querySelectorAll('.tool-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        currentTool = this.dataset.tool;
        document.querySelectorAll('.tool-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
      });
    });
  }

  /* ===== 弹层 ===== */
  function bindScreens() {
    document.querySelectorAll('.modal-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var action = this.dataset.action;
        if (action === 'start') {
          hideAllScreens();
        } else if (action === 'restart') {
          hideAllScreens();
          resetGarden();
        } else if (action === 'continue') {
          hideAllScreens();
        }
      });
    });
  }

  function hideAllScreens() {
    document.querySelectorAll('.screen').forEach(function(s) {
      s.classList.remove('active');
      s.setAttribute('aria-hidden', 'true');
    });
  }

  function showScreen(id) {
    hideAllScreens();
    var target = document.getElementById(id);
    if (target) {
      target.classList.add('active');
      target.setAttribute('aria-hidden', 'false');
    }
  }

  /* ===== 花盆点击 ===== */
  function onPotClick(e) {
    e.preventDefault();
    var idx = parseInt(this.dataset.index, 10);
    var pot = pots[idx];

    if (currentTool === 'plant') {
      handlePlant(pot, idx);
    } else if (currentTool === 'water') {
      handleWater(pot, idx);
    } else if (currentTool === 'shake') {
      handleShake(pot, idx);
    } else if (currentTool === 'clear') {
      handleClear(pot, idx);
    }
  }

  /* 种花 */
  function handlePlant(pot, idx) {
    if (pot.state !== 'empty') {
      showEncourage('这里已经有植物了哦 🌱');
      return;
    }

    var type = FLOWER_TYPES[Math.floor(Math.random() * FLOWER_TYPES.length)];
    pot.state = 'seed';
    pot.type = type;

    var area = pot.el.querySelector('.plant-area');
    area.innerHTML = '<div class="seed-anim"></div>';

    showEncourage('种下了一颗' + FLOWER_NAMES[type] + '的种子 💧');

    /* 3秒后发芽 */
    setTimeout(function() {
      if (pot.state !== 'seed') return;
      pot.state = 'sprout';
      area.innerHTML = '<div class="sprout"><div class="sprout-leaf sprout-leaf-l"></div><div class="sprout-leaf sprout-leaf-r"></div></div>';
      showSparkles(pot.el);
    }, 1500);

    /* 5秒后开花 */
    setTimeout(function() {
      if (pot.state !== 'sprout') return;
      pot.state = 'bloom';
      area.innerHTML = createFlowerHTML(type);
      flowerCount++;
      flowerCountEl.textContent = flowerCount;
      if (flowerCount > bestScore) {
        bestScore = flowerCount;
        localStorage.setItem(STORAGE_PREFIX + 'best', String(bestScore));
        bestScoreEl.textContent = bestScore;
      }
      showEncourage(ENCOURAGES[Math.floor(Math.random() * ENCOURAGES.length)]);
      showSparkles(pot.el);
      spawnPetals(pot.el, type);

      /* 检查是否满园 */
      var bloomed = pots.filter(function(p) { return p.state === 'bloom'; }).length;
      if (bloomed >= POT_COUNT) {
        setTimeout(function() {
          var msg = document.getElementById('harvest-msg');
          msg.textContent = '你种满了 ' + POT_COUNT + ' 朵花！\n最高纪录：' + bestScore + ' 朵 🏆';
          showScreen('screen-harvest');
        }, 1000);
      }
    }, 3500);
  }

  /* 浇水 */
  function handleWater(pot, idx) {
    if (pot.state === 'empty') {
      showEncourage('这里还没有植物哦 🪹');
      return;
    }
    if (pot.state === 'bloom') {
      showEncourage('这朵花已经开得很美了 🌸');
      return;
    }

    /* 水滴动画 */
    for (var i = 0; i < 5; i++) {
      (function(delay) {
        setTimeout(function() {
          var drop = document.createElement('div');
          drop.className = 'water-drop';
          drop.style.left = (30 + Math.random() * 40) + '%';
          drop.style.animationDelay = '0s';
          pot.el.appendChild(drop);
          setTimeout(function() { drop.remove(); }, 700);
        }, delay);
      })(i * 120);
    }
    showEncourage('浇水成功，快快长大吧 💦');
  }

  /* 摇一摇 */
  function handleShake(pot, idx) {
    if (pot.state !== 'bloom') {
      showEncourage('只有盛开的花才能摇出花瓣哦 🌸');
      return;
    }
    pot.el.style.animation = 'none';
    pot.el.offsetHeight; /* reflow */
    pot.el.style.animation = 'sway 0.3s ease-in-out 3';
    spawnPetals(pot.el, pot.type, 8);
    showEncourage('花瓣纷飞，真美呀 🍃');
  }

  /* 清理 */
  function handleClear(pot, idx) {
    if (pot.state === 'empty') {
      showEncourage('这里已经是空的了 🪹');
      return;
    }
    pot.state = 'empty';
    pot.type = null;
    pot.el.querySelector('.plant-area').innerHTML = '';
    if (pot.timer) { clearTimeout(pot.timer); pot.timer = null; }
    showEncourage('已清理，可以重新种植 🌱');
  }

  /* 重置花园 */
  function resetGarden() {
    flowerCount = 0;
    flowerCountEl.textContent = '0';
    createPots();
  }

  /* ===== 花朵 HTML 生成 ===== */
  function createFlowerHTML(type) {
    var stemH = 28 + Math.floor(Math.random() * 12);
    var html = '<div class="flower flower-' + type + ' flower-grown">';

    /* 茎 */
    html += '<div style="position:relative;display:flex;flex-direction:column;align-items:center;">';
    html += '<div class="stem" style="height:' + stemH + 'px;"></div>';

    /* 叶子 */
    html += '<div class="leaf leaf-left" style="bottom:' + (stemH * 0.4) + 'px;"></div>';
    html += '<div class="leaf leaf-right" style="bottom:' + (stemH * 0.6) + 'px;"></div>';

    /* 花朵 */
    html += '<div class="bloom">';
    if (type === 'sunflower') {
      for (var i = 0; i < 8; i++) {
        var angle = i * 45;
        html += '<div class="petal" style="transform:rotate(' + angle + 'deg) translateY(-10px);"></div>';
      }
      html += '<div class="center"></div>';
    } else if (type === 'rose') {
      for (var i = 0; i < 6; i++) {
        var angle = i * 60;
        var r = 5;
        var x = Math.cos(angle * Math.PI / 180) * r;
        var y = Math.sin(angle * Math.PI / 180) * r;
        html += '<div class="petal" style="left:' + (12 + x - 5.5) + 'px;top:' + (12 + y - 5.5) + 'px;"></div>';
      }
      html += '<div class="center"></div>';
    } else if (type === 'tulip') {
      html += '<div class="petal" style="left:4px;top:0;"></div>';
      html += '<div class="petal" style="left:0;top:2px;opacity:0.8;"></div>';
      html += '<div class="petal" style="left:8px;top:2px;opacity:0.8;"></div>';
    } else if (type === 'daisy') {
      for (var i = 0; i < 8; i++) {
        var angle = i * 45;
        html += '<div class="petal" style="transform:rotate(' + angle + 'deg) translateY(-8px);"></div>';
      }
      html += '<div class="center"></div>';
    } else if (type === 'lavender') {
      for (var i = 0; i < 5; i++) {
        html += '<div class="petal" style="left:3px;top:' + (i * 6) + 'px;"></div>';
      }
    }

    html += '</div>'; /* bloom */
    html += '</div>'; /* flower inner */
    html += '</div>';
    return html;
  }

  /* ===== 特效 ===== */
  function showEncourage(text) {
    var toast = document.createElement('div');
    toast.className = 'encourage-toast';
    toast.textContent = text;
    document.getElementById('app').appendChild(toast);
    setTimeout(function() { toast.remove(); }, 2000);
  }

  function showSparkles(potEl) {
    var colors = ['#ffd54f', '#ff9a76', '#ce93d8', '#81c784', '#64b5f6'];
    for (var i = 0; i < 6; i++) {
      (function(delay) {
        setTimeout(function() {
          var sp = document.createElement('div');
          sp.className = 'sparkle';
          sp.style.background = colors[Math.floor(Math.random() * colors.length)];
          sp.style.left = (20 + Math.random() * 60) + '%';
          sp.style.top = (10 + Math.random() * 50) + '%';
          sp.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          potEl.appendChild(sp);
          setTimeout(function() { sp.remove(); }, 900);
        }, delay);
      })(i * 100);
    }
  }

  function spawnPetals(potEl, type, count) {
    count = count || 4;
    var color = FLOWER_COLORS[type] || '#ffcdd2';
    for (var i = 0; i < count; i++) {
      (function(delay) {
        setTimeout(function() {
          var petal = document.createElement('div');
          petal.className = 'falling-petal';
          petal.style.background = color;
          petal.style.left = (20 + Math.random() * 60) + '%';
          petal.style.top = '20%';
          petal.style.animationDuration = (1.5 + Math.random()) + 's';
          potEl.appendChild(petal);
          setTimeout(function() { petal.remove(); }, 3000);
        }, delay);
      })(i * 200);
    }
  }

  /* ===== 启动 ===== */
  window.addEventListener('load', function() {
    try {
      init();
    } catch (error) {
      console.error(error);
      var fallback = document.createElement('div');
      fallback.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;color:#111;font-size:18px;padding:24px;text-align:center;z-index:9999;';
      fallback.textContent = '哎呀，出错了，请刷新试试吧~';
      document.body.innerHTML = '';
      document.body.appendChild(fallback);
    }
  });
})();
</script>
</body>
</html>
