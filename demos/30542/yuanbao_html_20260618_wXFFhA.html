<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapSheet - 极简智能表格</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #0f0f0f;
            --elevated: #181818;
            --hover: #222;
            --selected: #2a2a2a;
            --border: #2e2e2e;
            --text: #f5f5f5;
            --muted: #888;
            --font-display: 'Playfair Display', serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
        }

        /* 顶部工具栏 */
        .navbar {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .toolbar {
            display: flex;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .btn {
            background: var(--elevated);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.4rem 0.7rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .btn:hover {
            background: var(--hover);
            border-color: #444;
        }

        .formula-bar {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-width: 0;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.35rem 0.6rem;
        }

        .cell-ref {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--muted);
            min-width: 2.8rem;
            text-align: center;
            font-weight: 500;
            border-right: 1px solid var(--border);
            padding-right: 0.6rem;
        }

        .formula-input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .formula-input::placeholder { color: #555; }

        /* 主区域 */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .grid-wrap {
            flex: 3;
            overflow: auto;
            padding: 1rem;
            background: var(--bg);
        }

        table {
            border-collapse: collapse;
            min-width: 100%;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            user-select: none;
        }

        th, td {
            border: 1px solid var(--border);
            min-width: 100px;
            height: 34px;
            padding: 0.3rem 0.6rem;
            text-align: left;
            vertical-align: middle;
            background: var(--surface);
            transition: background 0.1s;
        }

        th {
            background: var(--elevated);
            color: var(--muted);
            font-weight: 500;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        td.row-head, th.row-head {
            background: var(--elevated);
            color: var(--muted);
            text-align: center;
            min-width: 44px;
            position: sticky;
            left: 0;
            font-weight: 500;
        }

        th.row-head { z-index: 3; }

        td.cell {
            cursor: cell;
            outline: none;
        }

        td.cell:hover { background: var(--hover); }

        td.cell.selected {
            outline: 2px solid #fff;
            outline-offset: -2px;
            background: var(--selected);
        }

        td.cell[contenteditable="true"] {
            user-select: text;
            background: var(--bg);
            outline: 2px solid #fff;
            outline-offset: -2px;
            cursor: text;
        }

        /* 右侧 AI 面板 */
        .sidebar {
            flex: 1;
            min-width: 280px;
            max-width: 380px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            padding: 1.25rem;
            overflow: auto;
        }

        .sidebar h3 {
            margin: 0 0 1rem 0;
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 700;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--border);
        }

        .explain-box {
            background: var(--elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--muted);
        }

        .explain-box strong { color: var(--text); font-weight: 600; }

        .explain-box ul { padding-left: 1.2rem; margin: 0.6rem 0; }
        .explain-box li { margin: 0.3rem 0; }
        .explain-box p { margin: 0.5rem 0; }

        code {
            font-family: var(--font-mono);
            background: var(--bg);
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
            color: var(--text);
            font-size: 0.85em;
        }

        .empty-tip { color: #555; font-style: italic; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .formula-bar { min-width: 0; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">SnapSheet</div>
        <div class="toolbar">
            <button class="btn" id="addRow">+ 行</button>
            <button class="btn" id="addCol">+ 列</button>
            <button class="btn" id="reset">重置</button>
        </div>
        <div class="formula-bar">
            <span class="cell-ref" id="cellRef">A1</span>
            <input type="text" class="formula-input" id="formulaInput" placeholder="输入值或公式，例如 =SUM(B1:B2)">
        </div>
    </div>

    <div class="main">
        <div class="grid-wrap">
            <table id="sheet"></table>
        </div>
        <div class="sidebar">
            <h3>AI 逻辑解析</h3>
            <div class="explain-box" id="aiBox">
                <p class="empty-tip">选中任意单元格，AI 将在这里解释其内容或公式含义。</p>
            </div>
        </div>
    </div>

    <script>
        const sheet = document.getElementById('sheet');
        const cellRef = document.getElementById('cellRef');
        const formulaInput = document.getElementById('formulaInput');
        const aiBox = document.getElementById('aiBox');

        let rows = 8;
        let cols = 6;
        let data = [];
        let selected = { r: 0, c: 0 };

        function indexToCol(n) {
            let s = '';
            while (n >= 0) {
                s = String.fromCharCode(65 + (n % 26)) + s;
                n = Math.floor(n / 26) - 1;
            }
            return s;
        }

        function colToIndex(s) {
            let idx = 0;
            for (let i = 0; i < s.length; i++) {
                idx = idx * 26 + (s.charCodeAt(i) - 64);
            }
            return idx - 1;
        }

        function parseRef(ref) {
            const m = String(ref).match(/^([A-Z]+)([0-9]+)$/i);
            if (!m) return null;
            const c = colToIndex(m[1]);
            const r = parseInt(m[2], 10) - 1;
            if (c < 0 || c >= cols || r < 0 || r >= rows) return null;
            return { r, c };
        }

        function getCellValue(ref) {
            const pos = parseRef(ref);
            if (!pos) return 0;
            return data[pos.r][pos.c].computed;
        }

        function numericValue(ref) {
            const v = getCellValue(ref);
            const n = Number(v);
            return isNaN(n) ? 0 : n;
        }

        function sumRange(start, end) {
            const a = parseRef(start);
            const b = parseRef(end);
            if (!a || !b) return 0;
            let total = 0;
            for (let r = Math.min(a.r, b.r); r <= Math.max(a.r, b.r); r++) {
                for (let c = Math.min(a.c, b.c); c <= Math.max(a.c, b.c); c++) {
                    const n = Number(data[r][c].computed);
                    if (!isNaN(n)) total += n;
                }
            }
            return total;
        }

        function evaluateFormula(expr) {
            // 处理 SUM 函数
            let replaced = expr.replace(/SUM\(([^()]+)\)/gi, (match, argsStr) => {
                const args = argsStr.split(',').map(s => s.trim());
                let total = 0;
                args.forEach(arg => {
                    if (arg.includes(':')) {
                        const [start, end] = arg.split(':');
                        total += sumRange(start, end);
                    } else {
                        total += numericValue(arg);
                    }
                });
                return String(total);
            });

            // 替换其余单元格引用
            replaced = replaced.replace(/[A-Z]+[0-9]+/gi, ref => {
                const v = getCellValue(ref);
                return typeof v === 'number' ? String(v) : "'" + String(v).replace(/'/g, "\\'") + "'";
            });

            // 只允许数字、运算符、括号、空格和单引号字符串
            if (/[^0-9\s\.\+\-\*\/\(\)\']/.test(replaced)) return '#ERROR';

            try {
                const result = new Function('return (' + replaced + ')')();
                if (typeof result === 'number' && !Number.isFinite(result)) return '#ERROR';
                return result;
            } catch (e) {
                return '#ERROR';
            }
        }

        function parseRaw(raw) {
            if (raw === '') return '';
            const n = Number(raw);
            return raw.trim() !== '' && !isNaN(n) ? n : raw;
        }

        function recompute() {
            // 先计算非公式单元格
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const raw = data[r][c].raw;
                    if (!String(raw).startsWith('=')) {
                        data[r][c].computed = parseRaw(raw);
                    }
                }
            }
            // 迭代计算公式，最多 10 轮
            for (let pass = 0; pass < 10; pass++) {
                let changed = false;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const raw = data[r][c].raw;
                        if (String(raw).startsWith('=')) {
                            const newVal = evaluateFormula(raw.slice(1));
                            if (newVal !== data[r][c].computed) {
                                data[r][c].computed = newVal;
                                changed = true;
                            }
                        }
                    }
                }
                if (!changed) break;
            }
        }

        function formatValue(v) {
            if (v === '' || v === null || v === undefined) return '';
            if (typeof v === 'number') {
                return Number.isInteger(v) ? String(v) : String(parseFloat(v.toFixed(4)));
            }
            return String(v);
        }

        function initData() {
            data = [];
            for (let r = 0; r < rows; r++) {
                const row = [];
                for (let c = 0; c < cols; c++) {
                    row.push({ raw: '', computed: '' });
                }
                data.push(row);
            }
            data[0][0].raw = '项目 A';
            data[0][1].raw = '100';
            data[1][0].raw = '项目 B';
            data[1][1].raw = '200';
            data[2][0].raw = '总计';
            data[2][1].raw = '=SUM(B1:B2)';
            recompute();
        }

        function getTd(r, c) {
            return sheet.querySelector('td.cell[data-r="' + r + '"][data-c="' + c + '"]');
        }

        function updateDisplays() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const td = getTd(r, c);
                    if (td && td.contentEditable !== 'true') {
                        td.textContent = formatValue(data[r][c].computed);
                    }
                }
            }
            formulaInput.value = data[selected.r][selected.c].raw;
            explainCell(selected.r, selected.c);
        }

        function explainCell(r, c) {
            const ref = indexToCol(c) + (r + 1);
            const { raw, computed } = data[r][c];
            let html = '<p><strong>单元格：</strong><code>' + ref + '</code></p>';

            if (raw === '') {
                html += '<p class="empty-tip">当前单元格为空，可直接输入数值、文本或公式。</p>';
            } else if (String(raw).startsWith('=')) {
                const formula = raw.slice(1);
                html += '<p><strong>公式：</strong><code>' + raw + '</code></p>';
                html += '<p><strong>计算结果：</strong>' + formatValue(computed) + '</p>';

                if (/SUM\(/i.test(formula)) {
                    html += '<p><strong>含义：</strong>SUM 是求和函数，会对指定范围内的所有数值进行累加。</p><ul>';
                    const matches = formula.match(/SUM\(([^()]+)\)/gi) || [];
                    matches.forEach(m => {
                        const args = m.slice(4, -1).split(',').map(s => s.trim());
                        args.forEach(arg => {
                            if (arg.includes(':')) {
                                html += '<li>范围 <code>' + arg + '</code> 包含其间所有单元格的数值。</li>';
                            } else {
                                html += '<li>单元格 <code>' + arg + '</code> 的数值将被加入总和。</li>';
                            }
                        });
                    });
                    html += '</ul><p><strong>应用场景：</strong>统计总量、计算合计、汇总预算等。</p>';
                } else {
                    html += '<p><strong>含义：</strong>该公式根据单元格引用与运算符计算结果。</p>';
                }

                if (computed === '#ERROR') {
                    html += '<p style="color:#aaa"><strong>提示：</strong>公式出现错误，请检查引用或语法。</p>';
                }
            } else if (typeof computed === 'number') {
                html += '<p><strong>数值：</strong>' + formatValue(computed) + '</p>';
                html += '<p>该单元格为纯数值，可被其他公式引用并参与计算。</p>';
            } else {
                html += '<p><strong>内容：</strong>' + computed + '</p>';
                html += '<p>该单元格为文本内容，适合作为标签或说明。</p>';
            }

            aiBox.innerHTML = html;
        }

        function selectCell(r, c) {
            if (r < 0 || r >= rows || c < 0 || c >= cols) return;
            const prev = sheet.querySelector('td.cell.selected');
            if (prev) prev.classList.remove('selected');
            selected = { r, c };
            const td = getTd(r, c);
            if (td) td.classList.add('selected');
            cellRef.textContent = indexToCol(c) + (r + 1);
            formulaInput.value = data[r][c].raw;
            explainCell(r, c);
        }

        function startEdit(td) {
            if (td.contentEditable === 'true') return;
            const r = parseInt(td.dataset.r, 10);
            const c = parseInt(td.dataset.c, 10);
            selectCell(r, c);
            td.contentEditable = 'true';
            td.textContent = data[r][c].raw;
            td.focus();
            document.execCommand('selectAll', false, null);

            function onBlur() {
                finishEdit(td, r, c);
                td.removeEventListener('blur', onBlur);
            }
            td.addEventListener('blur', onBlur);
        }

        function finishEdit(td, r, c) {
            data[r][c].raw = td.textContent.trim();
            td.contentEditable = 'false';
            recompute();
            updateDisplays();
            selectCell(r, c);
        }

        function render() {
            sheet.innerHTML = '';
            const thead = document.createElement('thead');
            const trHead = document.createElement('tr');
            const corner = document.createElement('th');
            corner.className = 'row-head';
            trHead.appendChild(corner);
            for (let c = 0; c < cols; c++) {
                const th = document.createElement('th');
                th.textContent = indexToCol(c);
                trHead.appendChild(th);
            }
            thead.appendChild(trHead);
            sheet.appendChild(thead);

            const tbody = document.createElement('tbody');
            for (let r = 0; r < rows; r++) {
                const tr = document.createElement('tr');
                const rh = document.createElement('td');
                rh.className = 'row-head';
                rh.textContent = r + 1;
                tr.appendChild(rh);
                for (let c = 0; c < cols; c++) {
                    const td = document.createElement('td');
                    td.className = 'cell';
                    td.dataset.r = r;
                    td.dataset.c = c;
                    td.textContent = formatValue(data[r][c].computed);
                    td.addEventListener('click', () => selectCell(r, c));
                    td.addEventListener('dblclick', () => startEdit(td));
                    td.addEventListener('keydown', e => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            td.blur();
                        }
                    });
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
            sheet.appendChild(tbody);
            selectCell(selected.r, selected.c);
        }

        function commitFormula() {
            const td = getTd(selected.r, selected.c);
            if (!td) return;
            data[selected.r][selected.c].raw = formulaInput.value;
            recompute();
            updateDisplays();
            selectCell(selected.r, selected.c);
        }

        formulaInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                commitFormula();
                formulaInput.blur();
            }
        });

        formulaInput.addEventListener('blur', commitFormula);

        document.getElementById('addRow').addEventListener('click', () => {
            const newRow = [];
            for (let c = 0; c < cols; c++) newRow.push({ raw: '', computed: '' });
            data.push(newRow);
            rows++;
            render();
        });

        document.getElementById('addCol').addEventListener('click', () => {
            for (let r = 0; r < rows; r++) {
                data[r].push({ raw: '', computed: '' });
            }
            cols++;
            render();
        });

        document.getElementById('reset').addEventListener('click', () => {
            rows = 8;
            cols = 6;
            selected = { r: 0, c: 0 };
            initData();
            render();
        });

        // 方向键切换选中单元格
        document.addEventListener('keydown', e => {
            const active = document.activeElement;
            if (active === formulaInput) return;
            if (active && active.isContentEditable) return;

            let { r, c } = selected;
            let moved = false;
            if (e.key === 'ArrowUp') { r--; moved = true; }
            else if (e.key === 'ArrowDown') { r++; moved = true; }
            else if (e.key === 'ArrowLeft') { c--; moved = true; }
            else if (e.key === 'ArrowRight') { c++; moved = true; }

            if (moved) {
                e.preventDefault();
                r = Math.max(0, Math.min(rows - 1, r));
                c = Math.max(0, Math.min(cols - 1, c));
                selectCell(r, c);
            }
        });

        initData();
        render();
    </script>
</body>
</html>
