<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Three.js 曲线框选删除</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f1117; overflow: hidden; }
canvas { display: block; }
#hint {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.06);
  border: 0.5px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  padding: 8px 20px;
  color: rgba(255,255,255,0.55);
  font-family: system-ui, sans-serif;
  font-size: 13px;
  pointer-events: none;
  white-space: nowrap;
}
#hint span { color: rgba(255,255,255,0.85); font-weight: 500; }
#selection-box {
  position: absolute;
  border: 1px solid rgba(99,179,133,0.8);
  background: rgba(99,179,133,0.08);
  pointer-events: none;
  display: none;
}
</style>
</head>
<body>
<div id="hint">鼠标拖拽框选曲线，按 <span>Delete / Backspace</span> 删除选中段</div>
<div id="selection-box"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W = window.innerWidth, H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1117);

const camera = new THREE.OrthographicCamera(-W/2, W/2, H/2, -H/2, 0.1, 1000);
camera.position.z = 10;

// ── 生成曲线点 ──
function buildCurvePoints() {
  const pts = [];
  const count = 300;
  for (let i = 0; i < count; i++) {
    const t = (i / (count - 1)) * Math.PI * 4;
    const x = (i / (count - 1) - 0.5) * (W * 0.85);
    const y = Math.sin(t) * 120 + Math.sin(t * 0.5) * 60 + Math.cos(t * 1.3) * 40;
    pts.push(new THREE.Vector3(x, y, 0));
  }
  return pts;
}

// 曲线段：每段是连续的点数组
let segments = [buildCurvePoints()];
let lineObjects = [];

function buildLineFromPoints(pts) {
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: 0x63b385, linewidth: 2 });
  return new THREE.Line(geo, mat);
}

function rebuildScene() {
  lineObjects.forEach(l => scene.remove(l));
  lineObjects = [];
  segments.forEach(pts => {
    if (pts.length >= 2) {
      const line = buildLineFromPoints(pts);
      scene.add(line);
      lineObjects.push(line);
    }
  });
}

rebuildScene();

// ── 框选 ──
const selBox = document.getElementById('selection-box');
let isSelecting = false;
let startX = 0, startY = 0;
let selRect = null; // { x1,y1,x2,y2 } in screen coords

// 高亮选中的点（黄色覆盖线）
let highlightLine = null;

function screenToWorld(sx, sy) {
  return new THREE.Vector3(
    sx - W / 2,
    -(sy - H / 2),
    0
  );
}

function getSelectionWorldRect() {
  if (!selRect) return null;
  const tl = screenToWorld(Math.min(selRect.x1, selRect.x2), Math.min(selRect.y1, selRect.y2));
  const br = screenToWorld(Math.max(selRect.x1, selRect.x2), Math.max(selRect.y1, selRect.y2));
  return { minX: tl.x, maxX: br.x, minY: br.y, maxY: tl.y };
}

function isPointInRect(pt, rect) {
  return pt.x >= rect.minX && pt.x <= rect.maxX && pt.y >= rect.minY && pt.y <= rect.maxY;
}

function updateHighlight() {
  if (highlightLine) { scene.remove(highlightLine); highlightLine = null; }
  if (!selRect) return;
  const rect = getSelectionWorldRect();
  const selectedPts = [];
  segments.forEach(pts => {
    pts.forEach(pt => {
      if (isPointInRect(pt, rect)) selectedPts.push(pt.clone());
    });
  });
  if (selectedPts.length >= 2) {
    // 找连续段中在框内的点，连线高亮
    segments.forEach(pts => {
      let run = [];
      pts.forEach(pt => {
        if (isPointInRect(pt, rect)) {
          run.push(pt);
        } else {
          if (run.length >= 2) {
            const geo = new THREE.BufferGeometry().setFromPoints(run);
            const mat = new THREE.LineBasicMaterial({ color: 0xf0c060, linewidth: 3 });
            if (!highlightLine) {
              highlightLine = new THREE.Group();
              scene.add(highlightLine);
            }
            highlightLine.add(new THREE.Line(geo, mat));
          }
          run = [];
        }
      });
      if (run.length >= 2) {
        const geo = new THREE.BufferGeometry().setFromPoints(run);
        const mat = new THREE.LineBasicMaterial({ color: 0xf0c060, linewidth: 3 });
        if (!highlightLine) {
          highlightLine = new THREE.Group();
          scene.add(highlightLine);
        }
        highlightLine.add(new THREE.Line(geo, mat));
      }
    });
  }
}

function deleteSelected() {
  if (!selRect) return;
  const rect = getSelectionWorldRect();
  const newSegments = [];

  segments.forEach(pts => {
    let run = [];
    pts.forEach(pt => {
      if (!isPointInRect(pt, rect)) {
        run.push(pt);
      } else {
        if (run.length >= 2) newSegments.push(run);
        run = [];
      }
    });
    if (run.length >= 2) newSegments.push(run);
  });

  segments = newSegments;
  selRect = null;
  selBox.style.display = 'none';
  if (highlightLine) { scene.remove(highlightLine); highlightLine = null; }
  rebuildScene();
}

renderer.domElement.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  isSelecting = true;
  startX = e.clientX;
  startY = e.clientY;
  selRect = { x1: startX, y1: startY, x2: startX, y2: startY };
  selBox.style.display = 'block';
  selBox.style.left = startX + 'px';
  selBox.style.top = startY + 'px';
  selBox.style.width = '0px';
  selBox.style.height = '0px';
});

renderer.domElement.addEventListener('mousemove', e => {
  if (!isSelecting) return;
  selRect = { x1: startX, y1: startY, x2: e.clientX, y2: e.clientY };
  const left   = Math.min(selRect.x1, selRect.x2);
  const top    = Math.min(selRect.y1, selRect.y2);
  const width  = Math.abs(selRect.x2 - selRect.x1);
  const height = Math.abs(selRect.y2 - selRect.y1);
  selBox.style.left   = left + 'px';
  selBox.style.top    = top + 'px';
  selBox.style.width  = width + 'px';
  selBox.style.height = height + 'px';
  updateHighlight();
});

renderer.domElement.addEventListener('mouseup', () => {
  isSelecting = false;
  // 保留选框和高亮，等待 Delete 键
});

window.addEventListener('keydown', e => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    deleteSelected();
  }
  // Ctrl+Z 撤销（简单单步）
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
    // 重置
    segments = [buildCurvePoints()];
    selRect = null;
    selBox.style.display = 'none';
    if (highlightLine) { scene.remove(highlightLine); highlightLine = null; }
    rebuildScene();
  }
});

// 点击空白处取消框选
renderer.domElement.addEventListener('click', e => {
  if (Math.abs(e.clientX - startX) < 3 && Math.abs(e.clientY - startY) < 3) {
    selRect = null;
    selBox.style.display = 'none';
    if (highlightLine) { scene.remove(highlightLine); highlightLine = null; }
  }
});

// ── 动画 ──
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
