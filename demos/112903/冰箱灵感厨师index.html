<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>冰箱灵感厨师 - AI 今天吃什么</title>
  <style>
    :root {
      --bg: #fff8ef;
      --card: #ffffff;
      --card-soft: #fff1df;
      --text: #222222;
      --muted: #6f6a64;
      --primary: #ff7a3d;
      --primary-dark: #d95d28;
      --green: #2f9e6d;
      --border: rgba(34, 34, 34, 0.1);
      --shadow: 0 20px 50px rgba(94, 58, 25, 0.12);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 179, 92, 0.35), transparent 30%),
        radial-gradient(circle at 82% 12%, rgba(84, 186, 136, 0.18), transparent 28%),
        var(--bg);
    }

    .page {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 56px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 28px;
      align-items: stretch;
      margin-bottom: 28px;
    }

    .hero-copy,
    .panel,
    .result-card {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .hero-copy {
      padding: 38px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .tagline {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--card-soft);
      color: var(--primary-dark);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1.04;
      letter-spacing: -0.06em;
    }

    .hero-copy p {
      margin: 20px 0 0;
      max-width: 680px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 28px;
    }

    .stat {
      padding: 16px;
      border-radius: 18px;
      background: #fff7ec;
      border: 1px solid rgba(255, 122, 61, 0.12);
    }

    .stat strong {
      display: block;
      font-size: 22px;
      color: var(--primary-dark);
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .demo-preview {
      padding: 28px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, #ffffff 0%, #fff4e5 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .phone {
      min-height: 100%;
      border-radius: 28px;
      background: #26211d;
      padding: 16px;
      color: white;
    }

    .phone-screen {
      height: 100%;
      border-radius: 20px;
      background: #fffdf8;
      color: var(--text);
      padding: 18px;
    }

    .mini-title {
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 14px;
    }

    .mini-card {
      padding: 14px;
      border-radius: 16px;
      background: #fff1df;
      margin-bottom: 12px;
    }

    .mini-row {
      height: 12px;
      border-radius: 999px;
      background: rgba(255, 122, 61, 0.22);
      margin: 10px 0;
    }

    .mini-row.short {
      width: 68%;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 24px;
      align-items: start;
    }

    .panel {
      padding: 24px;
      position: sticky;
      top: 24px;
    }

    .section-title {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: -0.03em;
    }

    .section-desc {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.7;
    }

    .field {
      margin-bottom: 22px;
    }

    .label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    textarea,
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: white;
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      padding: 14px 16px;
      line-height: 1.7;
    }

    select {
      padding: 13px 14px;
    }

    textarea:focus,
    select:focus {
      border-color: rgba(255, 122, 61, 0.7);
      box-shadow: 0 0 0 4px rgba(255, 122, 61, 0.12);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      border: 1px solid var(--border);
      background: white;
      color: var(--muted);
      border-radius: 999px;
      padding: 9px 13px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.15s, border 0.15s, background 0.15s, color 0.15s;
    }

    .chip:hover {
      transform: translateY(-1px);
    }

    .chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      font: inherit;
    }

    .primary-btn,
    .ghost-btn {
      border: 0;
      border-radius: 16px;
      padding: 14px 18px;
      cursor: pointer;
      font-weight: 900;
    }

    .primary-btn {
      background: var(--primary);
      color: white;
      box-shadow: 0 12px 28px rgba(255, 122, 61, 0.28);
    }

    .ghost-btn {
      background: #fff1df;
      color: var(--primary-dark);
    }

    .result-area {
      display: grid;
      gap: 18px;
    }

    .empty {
      min-height: 500px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.62);
      border: 1px dashed rgba(34, 34, 34, 0.18);
      border-radius: var(--radius);
      padding: 36px;
    }

    .empty strong {
      display: block;
      color: var(--text);
      font-size: 24px;
      margin-bottom: 10px;
    }

    .result-card {
      padding: 26px;
    }

    .recipe-head {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
      margin-bottom: 20px;
    }

    .recipe-head h2 {
      margin: 0;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.15;
      letter-spacing: -0.05em;
    }

    .score {
      min-width: 94px;
      text-align: center;
      padding: 12px;
      border-radius: 18px;
      background: #effaf4;
      color: var(--green);
      font-weight: 900;
    }

    .score span {
      display: block;
      font-size: 12px;
      color: #4f8b70;
      margin-top: 2px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 0;
    }

    .meta span {
      padding: 8px 11px;
      border-radius: 999px;
      background: var(--card-soft);
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 800;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .block {
      padding: 18px;
      border-radius: 18px;
      background: rgba(255, 248, 239, 0.72);
      border: 1px solid var(--border);
    }

    .block.full {
      grid-column: 1 / -1;
    }

    .block h3 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    .block p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .ingredient-list,
    .steps {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .ingredient-list li,
    .steps li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      color: var(--muted);
      line-height: 1.7;
    }

    .dot,
    .step-num {
      flex: 0 0 auto;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: white;
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 900;
      border: 1px solid rgba(255, 122, 61, 0.2);
    }

    .history {
      display: grid;
      gap: 12px;
    }

    .history-card {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      background: white;
      border: 1px solid var(--border);
    }

    .history-card strong {
      display: block;
      margin-bottom: 4px;
    }

    .history-card span {
      color: var(--muted);
      font-size: 13px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: #26211d;
      color: white;
      padding: 12px 16px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      transition: opacity 0.2s, transform 0.2s;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 900px) {
      .hero,
      .main-grid,
      .content-grid {
        grid-template-columns: 1fr;
      }

      .panel {
        position: static;
      }

      .hero-stats {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 20px, 1160px);
        padding-top: 18px;
      }

      .hero-copy,
      .panel,
      .result-card {
        padding: 20px;
      }

      .form-row,
      .actions,
      .recipe-head {
        grid-template-columns: 1fr;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-label="作品介绍">
      <div class="hero-copy">
        <div class="tagline">AI 今天吃什么 · 生活娱乐赛道</div>
        <h1>打开冰箱，生成今天的一餐灵感。</h1>
        <p>输入现有食材、口味偏好和健康目标，冰箱灵感厨师会优先利用已有食材，生成低浪费、易上手、适合当下的一餐方案。</p>
        <div class="hero-stats">
          <div class="stat"><strong>15 分钟</strong><span>支持快手餐目标</span></div>
          <div class="stat"><strong>3 步</strong><span>输入、生成、开做</span></div>
          <div class="stat"><strong>低浪费</strong><span>优先清空冰箱</span></div>
        </div>
      </div>
      <div class="demo-preview" aria-hidden="true">
        <div class="phone">
          <div class="phone-screen">
            <div class="mini-title">今日推荐</div>
            <div class="mini-card">
              <strong>番茄豆腐蛋花汤</strong>
              <div class="mini-row"></div>
              <div class="mini-row short"></div>
            </div>
            <div class="mini-card">
              <strong>健康提示</strong>
              <div class="mini-row"></div>
              <div class="mini-row short"></div>
            </div>
            <div class="mini-card">
              <strong>替换建议</strong>
              <div class="mini-row short"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="main-grid" aria-label="菜谱生成器">
      <aside class="panel">
        <h2 class="section-title">今天冰箱里有什么？</h2>
        <p class="section-desc">选择几个食材和限制条件，点击生成即可看到一张可展示的 AI 菜谱卡片。</p>

        <div class="field">
          <div class="label">食材输入 <span class="hint">用逗号隔开</span></div>
          <textarea id="ingredients" placeholder="例如：鸡蛋、番茄、豆腐、青菜、米饭">鸡蛋、番茄、豆腐、青菜、米饭</textarea>
        </div>

        <div class="field">
          <div class="label">常见食材 <span class="hint">点击添加/取消</span></div>
          <div class="chips" id="ingredientChips">
            <button class="chip active" data-value="鸡蛋">鸡蛋</button>
            <button class="chip active" data-value="番茄">番茄</button>
            <button class="chip active" data-value="豆腐">豆腐</button>
            <button class="chip active" data-value="青菜">青菜</button>
            <button class="chip" data-value="鸡胸肉">鸡胸肉</button>
            <button class="chip" data-value="虾仁">虾仁</button>
            <button class="chip" data-value="蘑菇">蘑菇</button>
            <button class="chip" data-value="剩米饭">剩米饭</button>
          </div>
        </div>

        <div class="field">
          <div class="label">口味偏好</div>
          <div class="chips" id="tasteChips">
            <button class="chip active" data-value="清淡">清淡</button>
            <button class="chip" data-value="家常">家常</button>
            <button class="chip" data-value="微辣">微辣</button>
            <button class="chip" data-value="少油">少油</button>
            <button class="chip" data-value="快手">快手</button>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <div class="label">健康目标</div>
            <select id="goal">
              <option>不限</option>
              <option selected>减脂</option>
              <option>增肌</option>
              <option>控糖</option>
              <option>养胃</option>
              <option>少盐</option>
            </select>
          </div>
          <div class="field">
            <div class="label">用餐人数</div>
            <select id="people">
              <option selected>1 人食</option>
              <option>2 人餐</option>
              <option>3-4 人餐</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <div class="label">时间限制</div>
            <select id="timeLimit">
              <option selected>15 分钟内</option>
              <option>30 分钟内</option>
              <option>不限时间</option>
            </select>
          </div>
          <div class="field">
            <div class="label">做饭水平</div>
            <select id="level">
              <option selected>新手友好</option>
              <option>普通家常</option>
              <option>愿意挑战</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button class="primary-btn" id="generateBtn">生成今日菜单</button>
          <button class="ghost-btn" id="resetBtn">重置</button>
        </div>
      </aside>

      <section class="result-area" id="resultArea">
        <div class="empty" id="emptyState">
          <div>
            <strong>菜谱卡片会出现在这里</strong>
            <p>试着点击“生成今日菜单”，查看比赛演示版的输出效果。</p>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast">已收藏到历史记录</div>

  <script>
    const ingredientsInput = document.querySelector("#ingredients");
    const ingredientChips = document.querySelector("#ingredientChips");
    const tasteChips = document.querySelector("#tasteChips");
    const generateBtn = document.querySelector("#generateBtn");
    const resetBtn = document.querySelector("#resetBtn");
    const resultArea = document.querySelector("#resultArea");
    const emptyState = document.querySelector("#emptyState");
    const toast = document.querySelector("#toast");

    const recipes = [
      {
        keywords: ["番茄", "鸡蛋", "豆腐"],
        name: "番茄豆腐蛋花汤 + 青菜拌饭",
        reason: "这份搭配能同时用掉番茄、鸡蛋、豆腐和青菜，做法简单，蛋白质和蔬菜比较均衡，适合作为轻量晚餐。",
        ingredients: ["鸡蛋 2 个", "番茄 1 个", "豆腐半盒", "青菜一小把", "米饭 1 碗"],
        steps: [
          "番茄切块，豆腐切小块，鸡蛋打散，青菜洗净后焯水。",
          "锅中放少量油，加入番茄炒出汁，再加入清水和豆腐煮开。",
          "转小火淋入蛋液，加入少量盐调味，青菜切碎后拌入米饭。",
          "汤和青菜拌饭一起食用，口味清淡，适合新手操作。"
        ],
        swap: "没有豆腐可以换成蘑菇；想增加饱腹感可以加入玉米粒；想增肌可以加入鸡胸肉或虾仁。",
        score: "92"
      },
      {
        keywords: ["剩米饭", "鸡蛋", "青菜"],
        name: "少油青菜鸡蛋炒饭",
        reason: "适合处理剩米饭，步骤少、出餐快，可以把零散蔬菜变成一份完整主食。",
        ingredients: ["剩米饭 1 碗", "鸡蛋 1-2 个", "青菜一小把", "葱花少许"],
        steps: [
          "鸡蛋打散，青菜切碎，剩米饭提前压散。",
          "锅中刷薄油，先炒鸡蛋，再放入青菜和米饭翻炒。",
          "加入少量盐和生抽，翻炒到米饭粒粒分明即可。",
          "如果想更健康，可以减少调味料，并搭配一杯无糖豆浆。"
        ],
        swap: "青菜可以换成生菜、菠菜或西兰花碎；没有鸡蛋可换成豆腐丁。",
        score: "88"
      },
      {
        keywords: ["鸡胸肉", "蘑菇", "青菜"],
        name: "蘑菇鸡胸肉轻食碗",
        reason: "蛋白质充足，油脂较低，适合减脂或健身人群，也适合做午餐便当。",
        ingredients: ["鸡胸肉 1 块", "蘑菇 5-6 个", "青菜一小把", "米饭半碗"],
        steps: [
          "鸡胸肉切片，用少量生抽和黑胡椒腌制 5 分钟。",
          "蘑菇切片，青菜焯水，米饭盛入碗底。",
          "平底锅少油煎鸡胸肉，再加入蘑菇翻炒出香味。",
          "把鸡胸肉、蘑菇和青菜铺在米饭上，少量调味即可。"
        ],
        swap: "鸡胸肉可换成虾仁、牛肉片或老豆腐；米饭可换成玉米或红薯。",
        score: "90"
      }
    ];

    function parseIngredients() {
      return ingredientsInput.value
        .split(/[，,、\n]/)
        .map(item => item.trim())
        .filter(Boolean);
    }

    function syncIngredientText(value, active) {
      const list = parseIngredients();
      const exists = list.includes(value);
      let next = list;
      if (active && !exists) next = [...list, value];
      if (!active && exists) next = list.filter(item => item !== value);
      ingredientsInput.value = next.join("、");
    }

    function getSelectedTaste() {
      return [...tasteChips.querySelectorAll(".chip.active")].map(btn => btn.dataset.value);
    }

    function chooseRecipe(ingredients) {
      let best = recipes[0];
      let bestScore = -1;
      recipes.forEach(recipe => {
        const score = recipe.keywords.filter(keyword => ingredients.some(item => item.includes(keyword) || keyword.includes(item))).length;
        if (score > bestScore) {
          bestScore = score;
          best = recipe;
        }
      });
      return best;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1600);
    }

    function renderRecipe() {
      const ingredients = parseIngredients();
      const tastes = getSelectedTaste();
      const goal = document.querySelector("#goal").value;
      const people = document.querySelector("#people").value;
      const timeLimit = document.querySelector("#timeLimit").value;
      const level = document.querySelector("#level").value;

      if (!ingredients.length) {
        showToast("请先输入至少一种食材");
        ingredientsInput.focus();
        return;
      }

      const recipe = chooseRecipe(ingredients);
      const tasteText = tastes.length ? tastes.join(" / ") : "不限口味";

      emptyState?.remove();
      resultArea.innerHTML = `
        <article class="result-card">
          <div class="recipe-head">
            <div>
              <h2>${recipe.name}</h2>
              <div class="meta">
                <span>${timeLimit}</span>
                <span>${level}</span>
                <span>${goal}</span>
                <span>${people}</span>
                <span>${tasteText}</span>
              </div>
            </div>
            <div class="score">${recipe.score}<span>匹配分</span></div>
          </div>

          <div class="content-grid">
            <section class="block full">
              <h3>为什么推荐</h3>
              <p>${recipe.reason}</p>
            </section>

            <section class="block">
              <h3>所需食材</h3>
              <ul class="ingredient-list">
                ${recipe.ingredients.map(item => `<li><span class="dot">✓</span><span>${item}</span></li>`).join("")}
              </ul>
            </section>

            <section class="block">
              <h3>健康提示</h3>
              <p>${buildHealthTip(goal, tasteText)}</p>
            </section>

            <section class="block full">
              <h3>新手友好步骤</h3>
              <ol class="steps">
                ${recipe.steps.map((step, index) => `<li><span class="step-num">${index + 1}</span><span>${step}</span></li>`).join("")}
              </ol>
            </section>

            <section class="block full">
              <h3>替换建议</h3>
              <p>${recipe.swap}</p>
            </section>
          </div>

          <div class="actions">
            <button class="primary-btn" id="regenerateBtn">换一种搭配</button>
            <button class="ghost-btn" id="saveBtn">收藏</button>
          </div>
        </article>

        <section class="result-card">
          <h2 class="section-title">最近灵感</h2>
          <p class="section-desc">这里用于比赛展示“历史记录/收藏菜谱”的后续扩展。</p>
          <div class="history" id="historyList"></div>
        </section>
      `;

      document.querySelector("#regenerateBtn").addEventListener("click", () => {
        const shuffled = [...ingredients].reverse().join("、");
        ingredientsInput.value = shuffled;
        renderRecipe();
      });

      document.querySelector("#saveBtn").addEventListener("click", () => {
        addHistory(recipe.name, ingredients.join("、"));
        showToast("已收藏到历史记录");
      });

      addHistory(recipe.name, ingredients.join("、"), true);
    }

    function buildHealthTip(goal, tasteText) {
      const tips = {
        "减脂": "建议少油烹饪，主食控制在半碗到一碗之间，优先保证蛋白质和蔬菜摄入。",
        "增肌": "建议在现有食材基础上增加鸡胸肉、虾仁或豆制品，提高蛋白质比例。",
        "控糖": "建议减少精米饭用量，增加蔬菜和蛋白质，避免额外加糖或重口调味。",
        "养胃": "建议选择温热、软烂、少刺激的做法，减少辣椒和过多油脂。",
        "少盐": "建议用葱姜、番茄自然酸甜味提鲜，减少盐和酱油用量。",
        "不限": "这份方案偏家常易操作，可根据口味调整咸淡和主食量。"
      };
      return `${tips[goal] || tips["不限"]} 当前口味偏好为：${tasteText}。`;
    }

    function addHistory(name, ingredients, silent = false) {
      const list = document.querySelector("#historyList");
      if (!list) return;
      const card = document.createElement("div");
      card.className = "history-card";
      card.innerHTML = `<div><strong>${name}</strong><span>${ingredients}</span></div><span>刚刚</span>`;
      list.prepend(card);
      while (list.children.length > 4) list.lastElementChild.remove();
      if (!silent) showToast("已收藏到历史记录");
    }

    ingredientChips.addEventListener("click", event => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      chip.classList.toggle("active");
      syncIngredientText(chip.dataset.value, chip.classList.contains("active"));
    });

    tasteChips.addEventListener("click", event => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      chip.classList.toggle("active");
    });

    generateBtn.addEventListener("click", renderRecipe);

    resetBtn.addEventListener("click", () => {
      ingredientsInput.value = "";
      document.querySelectorAll("#ingredientChips .chip").forEach(chip => chip.classList.remove("active"));
      showToast("已清空输入");
    });
  </script>
</body>
</html>
