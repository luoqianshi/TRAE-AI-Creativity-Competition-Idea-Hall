<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>招真真｜本地公益岗真伪快筛</title>
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --border: #e2e8f0;
      --accent-blue: #4a6fa5;
      --accent-green: #6c9e6f;
      --accent-orange: #d97706;
      --accent-red: #dc2626;
      --shadow: 0 2px 8px rgba(0,0,0,0.05);
      --radius: 12px;
      --transition: all 0.2s ease;
    }

    .dark-theme {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: #334155;
      --accent-blue: #60a5fa;
      --accent-green: #4ade80;
      --accent-orange: #f97316;
      --accent-red: #f87171;
      --shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      transition: var(--transition);
      padding: 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 16px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--accent-blue);
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 24px;
      transition: var(--transition);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg {
      width: 18px;
      height: 18px;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg-card);
      color: var(--text-primary);
      resize: vertical;
      transition: var(--transition);
      font-family: inherit;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.1);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-blue);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 12px;
      width: 100%;
      max-width: 240px;
    }

    .btn:hover:not(:disabled) {
      background: #3a5a8c;
      transform: translateY(-1px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      display: none;
      margin-top: 24px;
      padding: 20px;
      border-radius: var(--radius);
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result--verified {
      background: rgba(108, 158, 111, 0.1);
      border: 1px solid rgba(108, 158, 111, 0.3);
      color: var(--accent-green);
    }

    .result--pending {
      background: rgba(217, 119, 6, 0.1);
      border: 1px solid rgba(217, 119, 6, 0.3);
      color: var(--accent-orange);
    }

    .result--suspicious {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: var(--accent-red);
    }

    .result-icon {
      font-size: 1.4rem;
      margin-right: 8px;
      vertical-align: middle;
    }

    .result-title {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .result-source {
      font-size: 0.9rem;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      color: var(--text-secondary);
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--text-primary);
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      margin-top: 48px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .card {
        padding: 20px 16px;
      }
      textarea {
        min-height: 120px;
        padding: 12px;
      }
      .btn {
        padding: 11px 20px;
      }
    }

    /* Print-friendly */
    @media print {
      .theme-toggle, footer {
        display: none;
      }
      body {
        background: white;
        color: black;
      }
    }
  </style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle" title="切换深色/浅色模式">
    <svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.042-.132l-.853.853A.75.75 0 1116.06 6.06l.853-.853a.75.75 0 00-.132-1.042zM21.75 12a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM17.834 18.894a.75.75 0 001.042.132l.853-.853a.75.75 0 11-1.042-1.042l-.853.853a.75.75 0 00.132 1.042zM12 21.75a4.5 4.5 0 110-9 4.5 4.5 0 010 9zM7.758 17.303a.75.75 0 00-1.042.132l-.853.853a.75.75 0 00.132 1.042l.853-.853z"/></svg>
  </div>

  <div class="container">
    <header>
      <h1>招真真</h1>
      <p class="subtitle">粘贴招聘文字，3秒识别真伪｜对接民政、人社等8个本地权威信源</p>
    </header>

    <main>
      <section class="card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          快速筛查
        </h2>
        <p>请粘贴或输入您看到的招聘启事文字（例如：“XX街道招聘助老志愿者2名，联系电话138xxxxxxx，报名截止8月31日”）</p>
        <textarea id="inputText" placeholder="在此粘贴招聘内容…"></textarea>
        <button id="checkBtn" class="btn">查一查</button>
      </section>

      <section id="resultSection" class="result">
        <h3 class="result-title">
          <span class="result-icon" id="resultIcon">✅</span>
          <span id="resultLabel">已核实</span>
        </h3>
        <p id="resultDesc">该岗位信息已在<span id="sourceName">XX区民政局官网</span>公示，发布日期：2024年7月12日，有效期至8月31日。</p>
        <div class="result-source">
          ✅ 来源链接：<a id="sourceLink" href="#" target="_blank" style="color:inherit;text-decoration:underline;">点击查看原文</a>
        </div>
      </section>
    </main>

    <footer>
      <p>招真真｜本地公益岗真伪快筛小工具 · 不收集、不存储、不上传您的文本</p>
      <p>基于公开政务数据比对 · 模拟演示版</p>
    </footer>
  </div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      html.classList.add('dark-theme');
    }

    themeToggle.addEventListener('click', () => {
      html.classList.toggle('dark-theme');
      const isDark = html.classList.contains('dark-theme');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // 模拟核查逻辑
    const checkBtn = document.getElementById('checkBtn');
    const inputText = document.getElementById('inputText');
    const resultSection = document.getElementById('resultSection');
    const resultIcon = document.getElementById('resultIcon');
    const resultLabel = document.getElementById('resultLabel');
    const resultDesc = document.getElementById('resultDesc');
    const sourceName = document.getElementById('sourceName');
    const sourceLink = document.getElementById('sourceLink');

    // 简化关键词规则库（贴近真实场景）
    const rules = [
      {
        keywords: ['民政局', '人社局', '文明办', '街道办事处', '社区服务中心', '公益岗', '社工助理'],
        pattern: /联系电话[：:\s]*\d{11}/i,
        validDate: /截止[：:\s]*(\d{4}年\d{1,2}月\d{1,2}日)/,
        source: 'XX区民政局官网',
        link: '#',
        status: 'verified'
      },
      {
        keywords: ['培训费', '押金', '保证金', '先交钱', '上岗前缴费'],
        status: 'suspicious'
      },
      {
        keywords: ['咨询电话', '联系人', '报名方式'],
        pattern: /电话[：:\s]*\d{8,11}/i,
        status: 'pending'
      }
    ];

    function analyzeText(text) {
      if (!text.trim()) return null;

      // 规则匹配
      for (let rule of rules) {
        const hasKeyword = rule.keywords.some(kw => text.includes(kw) || text.toLowerCase().includes(kw.toLowerCase()));
        if (!hasKeyword) continue;

        if (rule.status === 'suspicious') {
          return {
            status: 'suspicious',
            label: '疑似中介',
            icon: '❌',
            desc: '检测到“培训费”“押金”等敏感词，公益岗位不应收取任何费用，请谨慎核实。',
            source: '风险提示',
            link: '#'
          };
        }

        if (rule.status === 'pending') {
          return {
            status: 'pending',
            label: '待验证',
            icon: '⚠️',
            desc: '联系方式有效，但未在权威信源库中找到完全匹配的公示信息，建议拨打官方电话二次确认。',
            source: '本地街道服务热线',
            link: '#'
          };
        }

        // verified case
        const dateMatch = rule.validDate?.exec(text);
        const dateStr = dateMatch ? dateMatch[1] : '近期发布';
        return {
          status: 'verified',
          label: '已核实',
          icon: '✅',
          desc: `该岗位信息已在${rule.source}公示，发布日期：${dateStr}，有效期至${dateStr.replace(/(\d{4}年\d{1,2}月)\d{1,2}日/, '$131日')}。`,
          source: rule.source,
          link: rule.link
        };
      }

      // 默认 fallback
      return {
        status: 'pending',
        label: '待验证',
        icon: '⚠️',
        desc: '文本信息较简略，未识别到明确信源特征。建议补充“招聘单位”“截止日期”等关键字段后重试。',
        source: '综合判断',
        link: '#'
      };
    }

    checkBtn.addEventListener('click', () => {
      const text = inputText.value.trim();
      if (!text) {
        alert('请输入招聘文字内容');
        return;
      }

      const result = analyzeText(text);
      if (!result) return;

      // 更新结果区域
      resultSection.className = `result result--${result.status}`;
      resultIcon.textContent = result.icon;
      resultLabel.textContent = result.label;
      resultDesc.textContent = result.desc;
      sourceName.textContent = result.source;
      sourceLink.href = result.link;

      resultSection.style.display = 'block';

      // 滚动到结果
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    // 回车快捷提交
    inputText.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        checkBtn.click();
      }
    });
  </script>
</body>
</html>
