<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星图相册AI - 智能照片甄选整理</title>
<style>
/* ============ CSS 变量与基础重置 ============ */
:root {
  --bg-primary: #0f0f14;
  --bg-secondary: #1a1a24;
  --bg-card: rgba(26, 26, 36, 0.85);
  --bg-panel: rgba(22, 22, 34, 0.9);
  --bg-hover: rgba(40, 40, 60, 0.6);
  --border: rgba(255, 255, 255, 0.08);
  --border-active: rgba(120, 100, 255, 0.5);
  --text-primary: #e8e8f0;
  --text-secondary: #9a9ab0;
  --text-muted: #5a5a70;
  --accent: #7b68ee;
  --accent-light: #9b8fff;
  --accent-glow: rgba(123, 104, 238, 0.4);
  --gold: #f0c040;
  --gold-glow: rgba(240, 192, 64, 0.35);
  --red: #e0556a;
  --red-glow: rgba(224, 85, 106, 0.35);
  --green: #4caf84;
  --green-glow: rgba(76, 175, 132, 0.3);
  --star-color: #f5a623;
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.6);
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --navbar-h: 64px;
  --sidebar-w: 220px;
  --sidebar-collapsed: 56px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.5;
}

::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.12); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,0.2); }

/* ============ 顶部导航栏 ============ */
.navbar {
  position: fixed; top:0; left:0; right:0; z-index:100;
  height: var(--navbar-h);
  background: rgba(15,15,20,0.92);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--border);
  display:flex; align-items:center; padding:0 20px; gap:16px;
}
.navbar-logo {
  font-size:1.2rem; font-weight:700; white-space:nowrap;
  color: var(--text-primary); display:flex; align-items:center; gap:6px;
  margin-right:8px;
}
.navbar-logo .logo-icon { font-size:1.4rem; }

.navbar-stats {
  display:flex; gap:18px; flex:1; justify-content:center; flex-wrap:wrap;
}
.stat-item { text-align:center; min-width:60px; }
.stat-value { font-size:1.1rem; font-weight:700; color:var(--text-primary); }
.stat-value.quality { color:var(--green); }
.stat-value.cleanup { color:var(--red); }
.stat-value.space { color:var(--accent-light); }
.stat-label { font-size:0.65rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; }

.navbar-actions { display:flex; gap:10px; flex-shrink:0; }

.btn {
  padding:9px 18px; border-radius:var(--radius-sm); border:none; cursor:pointer;
  font-size:0.85rem; font-weight:600; transition:var(--transition);
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  outline:none; font-family:inherit;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), #6a5acd);
  color:#fff; box-shadow: 0 0 20px var(--accent-glow);
}
.btn-primary:hover { box-shadow: 0 0 32px var(--accent-glow); transform:translateY(-1px); }
.btn-primary:active { transform:scale(0.97); }
.btn-primary:disabled { opacity:0.5; pointer-events:none; }

.btn-danger {
  background: rgba(224,85,106,0.2);
  color: var(--red); border:1px solid rgba(224,85,106,0.3);
}
.btn-danger:hover { background:rgba(224,85,106,0.3); box-shadow: 0 0 16px var(--red-glow); }
.btn-danger:disabled { opacity:0.35; pointer-events:none; }

/* ============ 布局 ============ */
.app-layout {
  display:flex; padding-top:var(--navbar-h);
  min-height:100vh;
}

/* ============ 侧边栏 ============ */
.sidebar {
  position:fixed; top:var(--navbar-h); left:0; bottom:0; z-index:90;
  width:var(--sidebar-w);
  background: var(--bg-secondary);
  border-right:1px solid var(--border);
  overflow-y:auto; padding:16px 12px;
  transition:var(--transition);
  display:flex; flex-direction:column; gap:4px;
}
.sidebar-section {
  margin-bottom:8px;
}
.sidebar-section-title {
  font-size:0.7rem; font-weight:700; text-transform:uppercase;
  color:var(--text-muted); letter-spacing:1px; padding:8px 10px 4px;
}
.sidebar-item {
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:var(--radius-sm);
  cursor:pointer; transition:var(--transition);
  color:var(--text-secondary); font-size:0.88rem;
  position:relative;
}
.sidebar-item:hover { background:var(--bg-hover); color:var(--text-primary); }
.sidebar-item.active {
  background:rgba(123,104,238,0.15);
  color:var(--accent-light);
  font-weight:600;
}
.sidebar-item.active::before {
  content:''; position:absolute; left:0; top:8px; bottom:8px;
  width:3px; background:var(--accent); border-radius:0 3px 3px 0;
}
.sidebar-item .icon { font-size:1.1rem; width:22px; text-align:center; flex-shrink:0; }
.sidebar-item .label { flex:1; }
.sidebar-badge {
  font-size:0.72rem; background:rgba(255,255,255,0.08);
  padding:2px 8px; border-radius:10px; color:var(--text-muted);
  font-weight:600;
}
.sidebar-divider {
  height:1px; background:var(--border); margin:8px 10px;
}

/* ============ 主内容区 ============ */
.main-content {
  flex:1; margin-left:var(--sidebar-w);
  padding:20px; min-height:calc(100vh - var(--navbar-h));
  transition:var(--transition);
}

/* 标签切换栏 */
.tabs-bar {
  display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;
  padding:4px; background:var(--bg-panel); border-radius:var(--radius);
  border:1px solid var(--border);
}
.tab-btn {
  padding:8px 16px; border-radius:var(--radius-sm); border:none; cursor:pointer;
  background:transparent; color:var(--text-secondary); font-size:0.82rem;
  font-weight:500; transition:var(--transition); font-family:inherit; white-space:nowrap;
}
.tab-btn:hover { color:var(--text-primary); background:var(--bg-hover); }
.tab-btn.active { background:var(--accent); color:#fff; font-weight:600; }

/* 星级筛选 */
.star-filter-bar {
  display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; align-items:center;
}
.star-filter-btn {
  padding:5px 12px; border-radius:20px; border:1px solid var(--border); cursor:pointer;
  background:transparent; color:var(--text-secondary); font-size:0.78rem;
  font-weight:500; transition:var(--transition); display:flex; align-items:center; gap:4px;
  font-family:inherit;
}
.star-filter-btn:hover { border-color:var(--star-color); color:var(--star-color); }
.star-filter-btn.active {
  background:rgba(245,166,35,0.15); border-color:var(--star-color); color:var(--star-color); font-weight:600;
}

/* ============ 相似分组堆叠卡片（仿手机重复照片） ============ */
.dup-group-card {
  margin:20px 0 10px; position:relative;
}

/* 堆叠效果 - 背后的卡片层 */
.dup-stack {
  position:relative; cursor:pointer; transition:var(--transition);
  margin-bottom:4px;
}
.dup-stack-inner {
  position:relative; width:160px; height:160px; margin:0 auto;
}
.dup-stack-layer {
  position:absolute; inset:0; border-radius:var(--radius);
  border:2px solid var(--border); overflow:hidden;
  transition:var(--transition);
}
.dup-stack-layer:nth-child(1) { transform:rotate(-6deg) translateX(-8px); z-index:1; }
.dup-stack-layer:nth-child(2) { transform:rotate(4deg) translateX(6px); z-index:2; }
.dup-stack-layer:nth-child(3) { transform:rotate(-2deg) translateX(-2px); z-index:3; }
.dup-stack-layer:nth-child(4) { transform:none; z-index:4; position:relative; }

.dup-stack:hover .dup-stack-layer:nth-child(1) { transform:rotate(-8deg) translateX(-12px); }
.dup-stack:hover .dup-stack-layer:nth-child(2) { transform:rotate(6deg) translateX(10px); }
.dup-stack:hover .dup-stack-layer:nth-child(3) { transform:rotate(-3deg) translateX(-4px); }

.dup-group-info {
  background:var(--bg-panel); border-radius:var(--radius);
  border:1px solid var(--border); padding:16px;
  transition:var(--transition);
}
.dup-group-info:hover { border-color:var(--accent); }

.dup-group-header {
  display:flex; align-items:center; gap:12px; margin-bottom:12px;
}
.dup-group-name {
  font-size:1rem; font-weight:700; flex:1;
  display:flex; align-items:center; gap:8px;
}
.dup-group-name .similarity-badge {
  font-size:0.68rem; padding:2px 10px; border-radius:12px;
  background:rgba(240,192,64,0.15); color:var(--gold);
  font-weight:600;
}

.dup-group-meta {
  display:flex; gap:20px; flex-wrap:wrap; margin-bottom:12px;
}
.dup-meta-item {
  display:flex; align-items:center; gap:6px; font-size:0.78rem;
  color:var(--text-secondary);
}
.dup-meta-item .val { color:var(--text-primary); font-weight:600; }
.dup-meta-item .val.save { color:var(--green); }

.dup-group-actions {
  display:flex; gap:8px; flex-wrap:wrap;
}
.dup-group-actions button {
  padding:7px 14px; border-radius:20px; border:none; cursor:pointer;
  font-size:0.78rem; font-weight:600; transition:var(--transition);
  font-family:inherit; display:flex; align-items:center; gap:5px;
}
.btn-compare {
  background:var(--accent); color:#fff;
}
.btn-compare:hover { box-shadow:0 0 14px var(--accent-glow); }
.btn-keepbest {
  background:rgba(240,192,64,0.12); color:var(--gold); border:1px solid rgba(240,192,64,0.2);
}
.btn-keepbest:hover { background:rgba(240,192,64,0.25); }
.btn-expand-group {
  background:rgba(255,255,255,0.06); color:var(--text-secondary);
}
.btn-expand-group:hover { background:rgba(255,255,255,0.12); color:var(--text-primary); }

/* 展开的照片网格 */
.group-photos-expanded {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
  gap:10px; margin-top:12px; padding-top:12px;
  border-top:1px solid var(--border);
}
.group-photos-expanded.hidden { display:none; }

/* 分组标题（独立照片用） */
.group-header {
  display:flex; align-items:center; gap:10px;
  padding:12px 16px; margin:20px 0 10px;
  background:var(--bg-panel); border-radius:var(--radius);
  border:1px solid var(--border); cursor:pointer;
  transition:var(--transition);
}
.group-header:hover {
  border-color:var(--accent);
  box-shadow: 0 0 16px rgba(123,104,238,0.15);
}
.group-header .group-title {
  font-size:0.95rem; font-weight:600; flex:1;
  display:flex; align-items:center; gap:8px;
}
.group-header .group-count {
  font-size:0.78rem; color:var(--text-muted);
}
.group-header .group-arrow {
  color:var(--text-muted); transition:var(--transition);
  font-size:0.8rem;
}
.group-header:hover .group-arrow { color:var(--accent-light); }

/* ============ 添加照片弹窗 ============ */
.add-photo-modal .modal { max-width:520px; }
.form-group {
  margin-bottom:16px;
}
.form-label {
  display:block; font-size:0.82rem; font-weight:600; color:var(--text-secondary);
  margin-bottom:6px;
}
.form-select, .form-input {
  width:100%; padding:10px 14px; border-radius:var(--radius-sm);
  background:var(--bg-primary); border:1px solid var(--border);
  color:var(--text-primary); font-size:0.88rem; font-family:inherit;
  transition:var(--transition); outline:none;
}
.form-select:focus, .form-input:focus { border-color:var(--accent); }

.star-picker {
  display:flex; gap:4px; font-size:1.6rem; cursor:pointer;
}
.star-picker span {
  color:var(--text-muted); transition:var(--transition);
}
.star-picker span.active, .star-picker:hover span { color:var(--star-color); }
.star-picker span:hover ~ span { color:var(--text-muted); }

.emoji-grid {
  display:flex; flex-wrap:wrap; gap:8px;
}
.emoji-opt {
  width:42px; height:42px; border-radius:10px; border:2px solid var(--border);
  background:var(--bg-primary); font-size:1.3rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:var(--transition);
}
.emoji-opt:hover { border-color:var(--accent); transform:scale(1.1); }
.emoji-opt.selected { border-color:var(--accent); background:rgba(123,104,238,0.15); }

.color-presets {
  display:flex; gap:8px; flex-wrap:wrap;
}
.color-preset {
  width:32px; height:32px; border-radius:50%; border:2px solid transparent;
  cursor:pointer; transition:var(--transition);
}
.color-preset:hover { transform:scale(1.15); }
.color-preset.selected { border-color:#fff; box-shadow:0 0 10px rgba(255,255,255,0.3); }

/* ============ 设置弹窗 ============ */
.settings-modal .modal { max-width:560px; }
.api-key-wrap {
  position:relative; display:flex; gap:8px;
}
.api-key-wrap .form-input { flex:1; padding-right:40px; }
.toggle-key {
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--text-muted); cursor:pointer;
  font-size:1rem; padding:4px;
}
.toggle-key:hover { color:var(--text-primary); }

.model-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
}
.model-card {
  padding:12px; border-radius:var(--radius-sm); border:2px solid var(--border);
  cursor:pointer; transition:var(--transition); background:var(--bg-primary);
  display:flex; flex-direction:column; gap:4px;
}
.model-card:hover { border-color:rgba(255,255,255,0.2); }
.model-card.selected {
  border-color:var(--accent); background:rgba(123,104,238,0.08);
}
.model-card .model-name { font-size:0.85rem; font-weight:600; }
.model-card .model-desc { font-size:0.7rem; color:var(--text-muted); }
.model-card .model-badge {
  align-self:flex-start; font-size:0.6rem; padding:1px 8px;
  border-radius:8px; margin-top:2px;
}
.model-badge.fast { background:rgba(76,175,132,0.15); color:var(--green); }
.model-badge.best { background:rgba(123,104,238,0.15); color:var(--accent-light); }
.model-badge.free { background:rgba(240,192,64,0.15); color:var(--gold); }

.endpoint-hint {
  font-size:0.68rem; color:var(--text-muted); margin-top:4px;
  word-break:break-all;
}

.conn-status {
  display:flex; align-items:center; gap:6px; font-size:0.78rem;
  padding:6px 12px; border-radius:6px; margin-top:6px;
}
.conn-status.ok { background:rgba(76,175,132,0.12); color:var(--green); }
.conn-status.err { background:rgba(224,85,106,0.12); color:var(--red); }
.conn-status.testing { background:rgba(245,166,35,0.12); color:var(--star-color); }

.settings-saved {
  position:absolute; right:16px; top:16px;
  font-size:0.72rem; color:var(--green); opacity:0;
  transition:opacity 0.3s;
}
.settings-saved.show { opacity:1; }

/* 照片网格 */
.photo-grid {
  display:grid; gap:14px;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
}
.photo-grid.compact {
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
}
.photo-grid.large {
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
}

/* 照片卡片 */
.photo-card {
  position:relative; border-radius:var(--radius); overflow:hidden;
  cursor:pointer; transition:var(--transition);
  background:var(--bg-card); border:2px solid transparent;
  aspect-ratio:1;
  display:flex; flex-direction:column;
}
.photo-card:hover {
  transform:translateY(-4px);
  border-color:rgba(255,255,255,0.2);
  box-shadow: var(--shadow);
}
.photo-card.selected {
  border-color:var(--accent) !important;
  box-shadow: 0 0 20px var(--accent-glow);
}
.photo-card.marked-delete {
  border-color:var(--red) !important;
  box-shadow: 0 0 14px var(--red-glow);
  opacity:0.7;
}
.photo-card.marked-delete.selected {
  border-color:var(--red) !important;
  box-shadow: 0 0 20px var(--red-glow);
  opacity:1;
}

/* 卡片图片区域 */
.card-image {
  flex:1; position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  font-size:3rem;
  transition:var(--transition);
}
.card-image::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 40%);
}

/* 选中勾选标记 */
.card-check {
  position:absolute; top:8px; right:8px; z-index:5;
  width:26px; height:26px; border-radius:50%;
  background:var(--accent); color:#fff; font-size:0.8rem;
  display:none; align-items:center; justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  font-weight:bold;
}
.photo-card.selected .card-check { display:flex; }

/* 最优徽章 */
.card-best-badge {
  position:absolute; top:8px; left:8px; z-index:5;
  background:linear-gradient(135deg, #f0c040, #d4a020);
  color:#1a1a14; font-size:0.65rem; font-weight:700;
  padding:3px 8px; border-radius:20px;
  box-shadow:0 0 12px var(--gold-glow);
  display:flex; align-items:center; gap:3px;
}
.card-delete-badge {
  position:absolute; top:8px; left:8px; z-index:5;
  background:var(--red); color:#fff; font-size:0.65rem; font-weight:700;
  padding:3px 8px; border-radius:20px;
  display:flex; align-items:center; gap:3px;
}

/* 卡片信息底部 */
.card-info {
  padding:8px 10px; position:relative; z-index:2;
  background:rgba(0,0,0,0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.card-stars {
  font-size:0.75rem; color:var(--star-color); letter-spacing:1px;
  margin-bottom:2px;
}
.card-meta {
  display:flex; align-items:center; justify-content:space-between;
  font-size:0.7rem; color:var(--text-muted);
}
.card-tag {
  font-size:0.62rem; padding:2px 8px;
  border-radius:10px; background:rgba(255,255,255,0.08);
  color:var(--text-secondary);
}
.card-size { font-size:0.65rem; }

/* 选中计数浮动栏 */
.selection-bar {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:rgba(30,30,48,0.95); backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--accent); border-radius:30px;
  padding:8px 24px; display:flex; align-items:center; gap:14px;
  z-index:80; box-shadow:0 4px 24px rgba(0,0,0,0.5);
  transition:var(--transition);
}
.selection-bar.hidden { display:none; }
.selection-bar .count { font-weight:700; color:var(--accent-light); }
.selection-bar button {
  padding:6px 14px; border-radius:16px; border:none; cursor:pointer;
  font-size:0.78rem; font-weight:600;
  background:rgba(255,255,255,0.08); color:var(--text-primary);
  transition:var(--transition); font-family:inherit;
}
.selection-bar button:hover { background:rgba(255,255,255,0.15); }
.selection-bar button.danger { background:rgba(224,85,106,0.2); color:var(--red); }
.selection-bar button.danger:hover { background:rgba(224,85,106,0.35); }

/* ============ 模态弹窗 ============ */
.modal-overlay {
  position:fixed; inset:0; z-index:200;
  background:rgba(0,0,0,0.65); backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center;
  animation:fadeIn 0.2s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

.modal {
  background:var(--bg-secondary); border-radius:var(--radius-lg);
  border:1px solid var(--border); box-shadow:var(--shadow-lg);
  max-width:820px; width:92vw; max-height:85vh; overflow-y:auto;
  padding:24px; animation:slideUp 0.25s ease;
}
@keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

.modal-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid var(--border);
}
.modal-title { font-size:1.15rem; font-weight:700; display:flex; align-items:center; gap:8px; }
.modal-close {
  width:32px; height:32px; border-radius:50%; border:none; cursor:pointer;
  background:rgba(255,255,255,0.06); color:var(--text-secondary);
  font-size:1.1rem; transition:var(--transition); display:flex;
  align-items:center; justify-content:center;
}

.compare-card {

.toast-container {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);

  align-items:center; pointer-events:none;
}
.toast {
  padding:10px 22px; border-radius:24px; font-size:0.85rem; font-weight:500;
  background:rgba(30,30,48,0.95); border:1px solid var(--border);
  color:var(--text-primary); box-shadow:var(--shadow);
  animation:toastIn 0.3s ease, toastOut 0.3s ease 1.8s forwards;
  pointer-events:auto; white-space:nowrap;
}
.toast.success { border-color:var(--green); color:var(--green); }
.toast.info { border-color:var(--accent); color:var(--accent-light); }
@keyframes toastIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
@keyframes toastOut { from{opacity:1;transform:translateY(0)} to{opacity:0;transform:translateY(-10px)} }

.scanning-spinner {

}

// AI 自动判定每组最优照片（综合清晰度 60% + 曝光 40%）
function autoAssignBest() {
  const groups = new Map();
  photos.forEach(p => {
    if (p.groupId > 0) {
      if (!groups.has(p.groupId)) groups.set(p.groupId, []);
      groups.get(p.groupId).push(p);
    }
  });
  groups.forEach(groupPhotos => {
    // 先清除该组所有 isBest
    groupPhotos.forEach(p => { p.isBest = false; });
    // 按综合评分排序，取最高分为最优
    let best = groupPhotos[0];
    let bestScore = 0;
    groupPhotos.forEach(p => {
      const score = p.clarity * 0.6 + p.exposure * 0.4;
      if (score > bestScore) { bestScore = score; best = p; }
    });
    best.isBest = true;
  });

    case 'best': result = result.filter(p => p.isBest && p.star >= 4); break;
    case 'trash': result = result.filter(p => p.markedDelete); break;
    default:
      if (currentView.startsWith('tag-')) {
        const tagMap = { 'tag-person':'人物', 'tag-landscape':'风景', 'tag-food':'美食', 'tag-document':'文档', 'tag-pet':'宠物' };
        result = result.filter(p => p.tag === (tagMap[currentView] || ''));
      }
  }

  // 层级过滤
  switch (currentLayer) {
    case 'quick': result = result.filter(p => p.markedDelete); break;
    case 'deep': result = result.filter(p => p.star >= 4 || p.isBest); break;
    case 'batch': result = result.filter(p => p.markedDelete); break;
    case 'archive': result = result.filter(p => p.star >= 3 && p.tag); break;
    // 'smart': 不过滤，全部显示但按分组排列
  }

  // 星级过滤
  if (currentStarFilter !== 'all') {
    result = result.filter(p => p.star === currentStarFilter);

  return result;

// 计算分组相似度（基于清晰度和曝光度的综合差值）
function calcGroupSimilarity(groupPhotos) {
  if (groupPhotos.length < 2) return 100;
  const clarities = groupPhotos.map(p => p.clarity);
  const exposures = groupPhotos.map(p => p.exposure);
  const maxC = Math.max(...clarities), minC = Math.min(...clarities);
  const maxE = Math.max(...exposures), minE = Math.min(...exposures);
  const varC = maxC - minC;
  const varE = maxE - minE;
  const diff = (varC + varE) / 2;
  return Math.max(60, Math.round(100 - diff));
}

// 渲染相似分组堆叠卡片（仿手机重复照片管理）
function renderDupGroupCard(groupPhotos) {
  const name = groupPhotos[0].groupName;
  const count = groupPhotos.length;
  const bestPhoto = groupPhotos.find(p => p.isBest) || groupPhotos[0];
  const similarity = calcGroupSimilarity(groupPhotos);

  // 可节省空间 = 非最优照片的总大小（如果仅保留最优）
  const otherPhotos = groupPhotos.filter(p => !p.isBest);
  const saveSpace = otherPhotos.reduce((s, p) => s + p.size, 0);

  const gradientColors = bestPhoto.color.split(',');
  const bgGradient = `linear-gradient(135deg, ${gradientColors[0]}, ${gradientColors[1]})`;

  // 堆叠层（取前3张做背景层效果）
  const stackPhotos = groupPhotos.slice(0, Math.min(4, groupPhotos.length));
  // 让最优照片在最上层
  const displayStack = [bestPhoto, ...stackPhotos.filter(p => p.id !== bestPhoto.id)].slice(0, 4);

  let stackLayersHtml = '';
  displayStack.forEach((p, i) => {
    const gc = p.color.split(',');
    const g = `linear-gradient(135deg, ${gc[0]}, ${gc[1]})`;
    const layerEmoji = p.emoji;
    stackLayersHtml += `
      <div class="dup-stack-layer" style="background:${g};display:flex;align-items:center;justify-content:center;font-size:2rem;">
        <span style="position:relative;z-index:1">${layerEmoji}</span>
      </div>`;
  });

  return `
    <div class="dup-group-card">
      <div class="dup-stack" onclick="openCompareModal('${name}')">
        <div class="dup-stack-inner">${stackLayersHtml}</div>
      </div>
      <div class="dup-group-info">
        <div class="dup-group-header">
          <div class="dup-group-name">
            📑 ${name}
            <span class="similarity-badge">相似度 ${similarity}%</span>
          </div>
        </div>
        <div class="dup-group-meta">
          <div class="dup-meta-item">� <span class="val">${count} 张</span> 相似照片</div>
          <div class="dup-meta-item">⭐ 最高评分 <span class="val">${Math.max(...groupPhotos.map(p => p.star))} 星</span></div>
          <div class="dup-meta-item">💾 可节省 <span class="val save">${saveSpace.toFixed(1)} MB</span></div>
        </div>
        <div class="dup-group-actions">
          <button class="btn-compare" onclick="event.stopPropagation();openCompareModal('${name}')">🔍 对比查看</button>
          <button class="btn-keepbest" onclick="event.stopPropagation();keepOnlyBest('${name}')">🏆 仅保留最优</button>
          <button class="btn-expand-group" onclick="event.stopPropagation();toggleGroupExpand('${name}')">📋 展开/收起</button>
        </div>
        <div class="group-photos-expanded hidden" data-expand-group="${name}">
          ${groupPhotos.map(p => renderPhotoCard(p)).join('')}
        </div>
      </div>
    </div>`;
}

function render() {
  const filtered = getFilteredPhotos();

  if (filtered.length === 0) {
    photoContainer.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>没有符合条件的照片</p></div>';
    updateStats();
    return;
  }

  let html = '';

  // 智能分拣模式 & 全部模式 & 相似分组模式：按分组显示
  if (currentLayer === 'smart' || currentView === 'groups') {
    const grouped = new Map();
    const ungrouped = [];

    filtered.forEach(p => {
      if (p.groupId > 0) {
        if (!grouped.has(p.groupId)) grouped.set(p.groupId, []);
        grouped.get(p.groupId).push(p);
      } else {
        ungrouped.push(p);
      }
    });

    // 渲染分组（使用堆叠卡片）
    grouped.forEach((groupPhotos, groupId) => {
      html += renderDupGroupCard(groupPhotos);
    });

    // 渲染未分组照片
    if (ungrouped.length > 0) {
      html += renderGroupHeader('独立照片', ungrouped.length);
      html += '<div class="photo-grid">';
      ungrouped.forEach(p => { html += renderPhotoCard(p); });
      html += '</div>';
    }
  } else {
    // 其他模式：简单网格
    html += '<div class="photo-grid">';
    filtered.forEach(p => { html += renderPhotoCard(p); });
    html += '</div>';
  }

  photoContainer.innerHTML = html;
  updateStats();
}

async function performRealAISort() {
  // 构建照片摘要数据发送给 AI
  const groups = new Map();
  photos.forEach(p => {
    if (p.groupId > 0) {
      if (!groups.has(p.groupId)) groups.set(p.groupId, []);
      groups.get(p.groupId).push(p);
    }
  });

  // 每组取简要信息发送
  let contextParts = ['以下是用户的相册照片数据，请分析每组相似照片，判断哪些值得保留、哪些建议清理：'];
  let photoIndex = 0;

  const soloPhotos = photos.filter(p => p.groupId === 0);

  groups.forEach((groupPhotos, gid) => {
    contextParts.push(`\n【${groupPhotos[0].groupName}】（共${groupPhotos.length}张相似照片）：`);
    groupPhotos.forEach(p => {
      photoIndex++;
      const bestTag = p.isBest ? ' [当前AI判定最优]' : '';
      contextParts.push(`  #${p.id} ${p.emoji} ${p.tag} | 清晰度:${p.clarity}/100 曝光:${p.exposure}/100 星级:${p.star} 大小:${p.size}MB${bestTag}`);
    });
  });

  if (soloPhotos.length > 0) {
    contextParts.push(`\n【独立照片】（共${soloPhotos.length}张）：`);
    soloPhotos.forEach(p => {
      contextParts.push(`  #${p.id} ${p.emoji} ${p.tag} | 清晰度:${p.clarity}/100 曝光:${p.exposure}/100 星级:${p.star} 大小:${p.size}MB`);
    });
  }

  contextParts.push('\n请执行以下任务，并以 JSON 格式返回结果：');
  contextParts.push('1. 每组相似照片中选出最优的一张（综合考虑清晰度、曝光度）');
  contextParts.push('2. 标记应该清理的照片 ID（清晰度<50 或 曝光严重不足的）');
  contextParts.push('3. 返回格式：{"groupBest":{"1":最佳照片ID,"2":最佳照片ID,...},"deleteIds":[要清理的照片ID,...],"summary":"一句话总结建议"}');
  contextParts.push('只返回 JSON，不要其他内容。');

  const prompt = contextParts.join('\n');
  const cfg = MODEL_CONFIGS[aiSettings.model];
  const endpoint = getActiveEndpoint();

  try {
    let aiResult;
    if (cfg.type === 'anthropic') {
      const resp = await fetch(endpoint, {
        method:'POST',
        headers:{'x-api-key':aiSettings.apiKey,'anthropic-version':'2023-06-01','content-type':'application/json'},
        body:JSON.stringify({model:'claude-3-5-sonnet-20241022',max_tokens:1024,messages:[{role:'user',content:prompt}]})
      });
      const data = await resp.json();
      const text = data?.content?.[0]?.text || '';
      aiResult = parseAIResponse(text);
    } else {
      const resp = await fetch(endpoint, {
        method:'POST',
        headers:{'Authorization':`Bearer ${aiSettings.apiKey}`,'Content-Type':'application/json'},
        body:JSON.stringify({model:aiSettings.model,max_tokens:1024,messages:[{role:'user',content:prompt}]})
      });
      const data = await resp.json();
      const text = data?.choices?.[0]?.message?.content || '';
      aiResult = parseAIResponse(text);
    }

    // 应用 AI 结果
    let cleaned = 0, bestUpdated = 0;

    if (aiResult.groupBest) {
      Object.entries(aiResult.groupBest).forEach(([gid, bestId]) => {
        const groupPhotos = photos.filter(p => p.groupId === parseInt(gid));
        if (groupPhotos.length > 0) {
          groupPhotos.forEach(p => { p.isBest = false; });
          const best = photos.find(p => p.id === bestId);
          if (best) { best.isBest = true; bestUpdated++; }
        }
      });
    }

    if (aiResult.deleteIds && aiResult.deleteIds.length > 0) {
      aiResult.deleteIds.forEach(id => {
        const p = photos.find(p => p.id === id);
        if (p && !p.markedDelete) { p.markedDelete = true; cleaned++; }
      });
    }

    // 切换视图
    currentLayer = 'smart';
    currentView = 'all';
    $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.layer === 'smart'));
    $$('.sidebar-item').forEach(b => b.classList.toggle('active', b.dataset.view === 'all'));

    render();
    const summary = aiResult.summary ? ` — ${aiResult.summary}` : '';
    showToast(`AI 分析完成！更新最优 ${bestUpdated} 张，标记清理 ${cleaned} 张${summary}`, 'success');

  } catch(e) {
    console.error('AI call failed:', e);
    // 降级到本地模拟
    performLocalAISort();
    showToast('AI 接口调用失败，已使用本地算法整理', 'info');
  }
}

function parseAIResponse(text) {
  // 尝试提取 JSON
  const jsonMatch = text.match(/\{[\s\S]*\}/);
  if (jsonMatch) {
    try { return JSON.parse(jsonMatch[0]); } catch(e) {}
  }
  return { groupBest:{}, deleteIds:[], summary:'' };
}

function performLocalAISort() {
  // 本地模拟算法（AI 不可用时的降级方案）
  let cleaned = 0;
  photos.forEach(p => {
    if (p.clarity < 50 && !p.markedDelete) { p.markedDelete = true; cleaned++; }
  });

  autoAssignBest();

  currentLayer = 'smart';
  currentView = 'all';
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.layer === 'smart'));
  $$('.sidebar-item').forEach(b => b.classList.toggle('active', b.dataset.view === 'all'));

  render();
  showToast(`本地算法完成！已标记 ${cleaned} 张待清理照片`, 'info');
}

// ============ 批量清理 ============
function triggerBatchClean() {
  const selected = getSelectedPhotos();
  if (selected.length === 0) {
    showToast('请先选择要清理的照片', 'info');
    return;
  }
  showConfirmModal(
    `确认清理 ${selected.length} 张照片？`,
    '清理后照片将从相册中移除（演示模式）。',
    () => {
      const ids = selected.map(p => p.id);
      photos = photos.filter(p => !ids.includes(p.id));
      clearAllSelection();
      render();
      showToast(`已清理 ${ids.length} 张照片`, 'success');
    }
  );
}

// ============ 对比弹窗 ============
function openCompareModal(groupName) {
  const groupPhotos = photos.filter(p => p.groupName === groupName);

  let cardsHtml = '';
  groupPhotos.forEach(p => {
    const gradientColors = p.color.split(',');
    const bgGradient = `linear-gradient(135deg, ${gradientColors[0]}, ${gradientColors[1]})`;
    const starsHtml = '★'.repeat(p.star) + '☆'.repeat(5 - p.star);

    cardsHtml += `
      <div class="compare-card${p.isBest ? ' is-best' : ''}" data-compare-id="${p.id}">
        <div class="card-image" style="background:${bgGradient};font-size:3rem;display:flex;align-items:center;justify-content:center;">
          <span>${p.emoji}</span>
        </div>
        <div class="compare-info">
          <div class="compare-stars">${starsHtml}</div>
          <div class="compare-stats">
            <span>📐 清晰度: ${p.clarity}/100</span>
            <span>☀️ 曝光: ${p.exposure}/100</span>
            <span>💾 ${p.size}MB</span>
          </div>
        </div>
        <div class="compare-actions">
          <button class="btn-best" onclick="event.stopPropagation();setAsBest(${p.id},'${groupName}')">⭐ 设为最优</button>
          <button class="btn-delete-mark" onclick="event.stopPropagation();markForDelete(${p.id})">🗑 标记清理</button>
        </div>
      </div>`;
  });

  const modalHtml = `
    <div class="modal-overlay" onclick="closeCompareModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div class="modal-title">📑 ${groupName} - 对比视图</div>
          <button class="modal-close" onclick="closeCompareModal()">✕</button>
        </div>
        <div class="compare-grid">${cardsHtml}</div>
        <div class="modal-footer">
          <button class="btn btn-primary" onclick="keepOnlyBest('${groupName}')">🏆 仅保留最优照片</button>
          <button class="btn" style="background:rgba(255,255,255,0.06);color:var(--text-secondary);" onclick="closeCompareModal()">关闭</button>
        </div>
      </div>
    </div>`;

  $('#modal-compare').innerHTML = modalHtml;
  $('#modal-compare').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function closeCompareModal(e) {
  if (e && e.target !== e.currentTarget) return;
  $('#modal-compare').style.display = 'none';
  $('#modal-compare').innerHTML = '';
  document.body.style.overflow = '';
}

function setAsBest(id, groupName) {
  photos.forEach(p => {
    if (p.groupName === groupName) p.isBest = false;
  });
  const photo = photos.find(p => p.id === id);
  if (photo) photo.isBest = true;
  render();
  // 刷新弹窗
  const overlay = $('#modal-compare .modal-overlay');
  if (overlay) {
    openCompareModal(groupName);
  }
  showToast('已更新最优照片', 'success');
}

function markForDelete(id) {
  const photo = photos.find(p => p.id === id);
  if (photo) {
    photo.markedDelete = !photo.markedDelete;
    photo.selected = false;
  }
  render();
  // 刷新弹窗
  const groupName = photo?.groupName;
  if (groupName && $('#modal-compare').style.display !== 'none') {
    openCompareModal(groupName);
  }
  showToast(photo?.markedDelete ? '已标记为待清理' : '已取消待清理标记', 'info');
}

function keepOnlyBest(groupName) {
  const groupPhotos = photos.filter(p => p.groupName === groupName);
  const bestPhoto = groupPhotos.find(p => p.isBest);

  // 将非最优照片标记为待清理
  let count = 0;
  groupPhotos.forEach(p => {
    if (!p.isBest && !p.markedDelete) {
      p.markedDelete = true;
      count++;
    }
  });

  closeCompareModal();
  render();
  showToast(`已标记 ${count} 张照片为待清理，仅保留最优`, 'success');
}

// ============ 确认弹窗 ============
function showConfirmModal(title, message, onConfirm) {
  const modalHtml = `
    <div class="modal-overlay confirm-modal" onclick="closeConfirmModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div class="modal-title">⚠️ ${title}</div>
          <button class="modal-close" onclick="closeConfirmModal()">✕</button>
        </div>
        <p>${message}</p>
        <div class="modal-footer" style="justify-content:center;">
          <button class="btn btn-danger" id="confirm-btn-yes">确认清理</button>
          <button class="btn" style="background:rgba(255,255,255,0.06);color:var(--text-secondary);" onclick="closeConfirmModal()">取消</button>
        </div>
      </div>
    </div>`;

  $('#modal-confirm').innerHTML = modalHtml;
  $('#modal-confirm').style.display = 'block';
  document.body.style.overflow = 'hidden';

  $('#confirm-btn-yes').addEventListener('click', () => {
    closeConfirmModal();
    onConfirm();
  });
}

function closeConfirmModal(e) {
  if (e && e.target !== e.currentTarget) return;
  $('#modal-confirm').style.display = 'none';
  $('#modal-confirm').innerHTML = '';
  document.body.style.overflow = '';
  // 检查对比弹窗是否还开着
  if ($('#modal-compare').style.display === 'none') {
    document.body.style.overflow = '';
  }
}

// ============ 添加照片弹窗 ============
let addPhotoState = { tag:'风景', star:4, emoji:'🖼', color:'#16213e,#0f3460,#f5a623', groupChoice:'none' };
let nextPhotoId = photos.length > 0 ? Math.max(...photos.map(p => p.id)) + 1 : 1;

const EMOJI_OPTIONS = ['🌅','🏔','🌌','🌊','🌸','🏖','🌃','☀️','🐱','🐶','🐰','🐦','🍜','🍰','🍕','🍣','👤','👥','🎉','🎂','📄','📋','🏠','🚗'];
const COLOR_PRESETS = [
  '#16213e,#0f3460,#f5a623', '#1a1a2e,#2d1b4e,#a29bfe',
  '#1e272e,#2d3436,#fdcb6e', '#2d1b2e,#3d2b3e,#f8b500',
  '#ecf0f1,#dfe6e9,#2d3436', '#0c0c1d,#1a1a3e,#6c5ce7',
  '#1e1e2e,#2a2a4e,#00cec9', '#1e1e2e,#2d1b4e,#fd79a8'
];

function openAddPhotoModal() {
  addPhotoState = { tag:'风景', star:4, emoji:'🖼', color:COLOR_PRESETS[0], groupChoice:'none' };
  renderAddPhotoModal();
}

function renderAddPhotoModal() {
  const s = addPhotoState;
  const existingGroups = [...new Set(photos.filter(p => p.groupName).map(p => p.groupName))];

  // 星级选择器
  let starHtml = '<div class="star-picker" onclick="pickStar(event)">';
  for (let i = 1; i <= 5; i++) {
    starHtml += `<span data-star="${i}" class="${i <= s.star ? 'active' : ''}">★</span>`;
  }
  starHtml += '</div>';

  // Emoji选择器
  let emojiHtml = '<div class="emoji-grid">';
  EMOJI_OPTIONS.forEach(e => {
    emojiHtml += `<div class="emoji-opt${s.emoji === e ? ' selected' : ''}" onclick="pickEmoji('${e}', this)">${e}</div>`;
  });
  emojiHtml += '</div>';

  // 颜色预设
  let colorHtml = '<div class="color-presets">';
  COLOR_PRESETS.forEach(c => {
    const mainColor = c.split(',')[1];
    colorHtml += `<div class="color-preset${s.color === c ? ' selected' : ''}" style="background:${mainColor}" onclick="pickColor('${c}', this)"></div>`;
  });
  colorHtml += '</div>';

  // 分组选择
  let groupHtml = `<select class="form-select" id="add-group-select" onchange="addPhotoState.groupChoice=this.value;renderAddPhotoModal()">
    <option value="none" ${s.groupChoice === 'none' ? 'selected' : ''}>独立照片（不分组）</option>`;
  existingGroups.forEach(g => {
    groupHtml += `<option value="existing:${g}" ${s.groupChoice === 'existing:' + g ? 'selected' : ''}>加入 "${g}"</option>`;
  });
  groupHtml += `<option value="new" ${s.groupChoice === 'new' ? 'selected' : ''}>创建新分组…</option></select>`;

  const newGroupInput = s.groupChoice === 'new'
    ? '<div class="form-group" style="margin-top:8px;"><label class="form-label">新分组名称</label><input class="form-input" id="add-new-group-name" placeholder="例如：旅行随拍组" value=""></div>'
    : '';

  const modalHtml = `
    <div class="modal-overlay add-photo-modal" onclick="event.target===this.currentTarget||event.target.classList.contains('modal-overlay')?closeAddPhotoModal():null">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div class="modal-title">＋ 添加新照片</div>
          <button class="modal-close" onclick="closeAddPhotoModal()">✕</button>
        </div>
        <div class="form-group">
          <label class="form-label">内容标签</label>
          <select class="form-select" id="add-tag" onchange="addPhotoState.tag=this.value">
            <option value="风景" ${s.tag === '风景' ? 'selected' : ''}>🏞 风景</option>
            <option value="人物" ${s.tag === '人物' ? 'selected' : ''}>👤 人物</option>
            <option value="美食" ${s.tag === '美食' ? 'selected' : ''}>🍜 美食</option>
            <option value="宠物" ${s.tag === '宠物' ? 'selected' : ''}>🐾 宠物</option>
            <option value="文档" ${s.tag === '文档' ? 'selected' : ''}>📄 文档</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">星级评分</label>
          ${starHtml}
        </div>
        <div class="form-group">
          <label class="form-label">选择图标</label>
          ${emojiHtml}
        </div>
        <div class="form-group">
          <label class="form-label">卡片配色</label>
          ${colorHtml}
        </div>
        <div class="form-group">
          <label class="form-label">所属分组</label>
          ${groupHtml}
          ${newGroupInput}
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" onclick="confirmAddPhoto()">✅ 确认添加</button>
          <button class="btn" style="background:rgba(255,255,255,0.06);color:var(--text-secondary);" onclick="closeAddPhotoModal()">取消</button>
        </div>
      </div>
    </div>`;

  $('#modal-add-photo').innerHTML = modalHtml;
  $('#modal-add-photo').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function pickStar(e) {
  const star = parseInt(e.target.dataset.star);
  if (!star) return;
  addPhotoState.star = star;
  renderAddPhotoModal();
}

function pickEmoji(emoji, el) {
  addPhotoState.emoji = emoji;
  renderAddPhotoModal();
}

function pickColor(color, el) {
  addPhotoState.color = color;
  renderAddPhotoModal();
}

function confirmAddPhoto() {
  const s = addPhotoState;
  const tag = $('#add-tag')?.value || s.tag;

  // 根据星级自动生成清晰度和曝光度
  const clarity = Math.min(98, s.star * 18 + Math.floor(Math.random() * 12));
  const exposure = Math.min(95, s.star * 17 + Math.floor(Math.random() * 14));
  const size = parseFloat((3 + s.star * 2.5 + Math.random() * 4).toFixed(1));

  let groupId = 0;
  let groupName = '';

  if (s.groupChoice.startsWith('existing:')) {
    const gName = s.groupChoice.replace('existing:', '');
    const existing = photos.find(p => p.groupName === gName);
    if (existing) { groupId = existing.groupId; groupName = gName; }
  } else if (s.groupChoice === 'new') {
    groupName = document.getElementById('add-new-group-name')?.value?.trim();
    if (!groupName) { showToast('请输入新分组名称', 'info'); return; }
    // 分配新的 groupId
    const maxGroupId = Math.max(0, ...photos.map(p => p.groupId));
    groupId = maxGroupId + 1;
  }

  // 如果是新分组，在组内随机指定一张为最优（如果组内还没有最优照片）
  let isBest = false;
  if (groupId > 0) {
    const groupHasBest = photos.some(p => p.groupId === groupId && p.isBest);
    isBest = !groupHasBest;
  }

  const newPhoto = {
    id: nextPhotoId++,
    groupId, groupName, isBest,
    color: s.color, emoji: s.emoji, tag,
    star: s.star, clarity, exposure,
    selected: false, markedDelete: false, size
  };

  photos.push(newPhoto);
  // 如果加入已有分组，让 AI 重新判定最优
  if (groupId > 0) autoAssignBest();
  closeAddPhotoModal();
  render();
  showToast(`已添加照片 (${tag}, ${'★'.repeat(s.star)}${'☆'.repeat(5 - s.star)})`, 'success');
}

function closeAddPhotoModal() {
  $('#modal-add-photo').style.display = 'none';
  $('#modal-add-photo').innerHTML = '';
  document.body.style.overflow = '';
}

// ============ 键盘快捷键 ============
document.addEventListener('keydown', (e) => {
  // 如果焦点在输入框内，忽略
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key === 'Escape') {
    clearAllSelection();
    if ($('#modal-compare').style.display !== 'none') closeCompareModal();
    if ($('#modal-confirm').style.display !== 'none') closeConfirmModal();
    if ($('#modal-add-photo').style.display !== 'none') closeAddPhotoModal();
    if ($('#modal-settings').style.display !== 'none') closeSettingsModal();
  }

  if (e.key === 'Delete') {
    e.preventDefault();
    const selected = getSelectedPhotos();
    if (selected.length > 0) {
      triggerBatchClean();
    }
  }

  if (e.ctrlKey && e.key === 'a') {
    e.preventDefault();
    selectAll();
  }
});

// ============ 点击遮罩关闭弹窗 ============
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('modal-overlay')) {
    if (e.target.closest('#modal-compare')) closeCompareModal(e);
    if (e.target.closest('#modal-confirm')) closeConfirmModal(e);
    if (e.target.closest('#modal-add-photo')) closeAddPhotoModal();
    if (e.target.closest('#modal-settings')) closeSettingsModal();
  }
});

// ============ 初始化 ============
function init() {
  render();
  showToast('✨ 星图相册AI 已就绪', 'info');
}

init();
</script>
