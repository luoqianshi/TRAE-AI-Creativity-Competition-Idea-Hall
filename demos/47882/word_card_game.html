<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 单词卡 - 背单词也能收集卡片</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            padding: 30px 0;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            color: white;
            backdrop-filter: blur(10px);
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 0.8em;
            opacity: 0.8;
        }
        
        .card-display {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .card-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        
        .word-text {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .word-phonetic {
            color: #888;
            font-size: 1.1em;
            margin-bottom: 20px;
        }
        
        .word-meaning {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 15px;
            min-height: 30px;
        }
        
        .word-example {
            font-size: 0.95em;
            color: #666;
            font-style: italic;
            line-height: 1.6;
            min-height: 50px;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        
        .option-btn {
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }
        
        .option-btn:hover {
            border-color: #667eea;
            background: #f5f5ff;
        }
        
        .option-btn.correct {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        
        .option-btn.wrong {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }
        
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.95em;
            display: none;
        }
        
        .feedback.correct {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
        
        .feedback.wrong {
            background: #ffebee;
            color: #c62828;
            display: block;
        }
        
        .next-btn {
            display: none;
            margin-top: 15px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .next-btn:hover {
            transform: scale(1.05);
        }
        
        .next-btn.show {
            display: inline-block;
        }
        
        .collection-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        
        .collection-card {
            aspect-ratio: 3/4;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            text-align: center;
            font-size: 0.8em;
            transition: transform 0.3s;
        }
        
        .collection-card:hover {
            transform: scale(1.05);
        }
        
        .collection-card.locked {
            background: #e0e0e0;
            color: #999;
        }
        
        .collection-card.unlocked {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .collection-card .card-icon {
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .collection-card .card-name {
            font-weight: bold;
        }
        
        .collection-card .card-rarity {
            font-size: 0.7em;
            opacity: 0.8;
        }
        
        .section-title {
            color: white;
            font-size: 1.2em;
            margin: 20px 0 10px;
            text-align: center;
        }
        
        .start-screen, .game-screen, .collection-screen {
            display: none;
        }
        
        .start-screen.active, .game-screen.active, .collection-screen.active {
            display: block;
        }
        
        .start-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0;
            transition: transform 0.2s;
        }
        
        .start-btn:hover {
            transform: scale(1.02);
        }
        
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .nav-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .nav-btn:hover, .nav-btn.active {
            background: white;
            color: #667eea;
        }
        
        .combo-display {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .combo-display.hidden {
            display: none;
        }
        
        @keyframes cardFlip {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(90deg); }
            100% { transform: rotateY(0deg); }
        }
        
        .card-flip {
            animation: cardFlip 0.6s ease;
        }
        
        .rarity-common { border: 2px solid #c0c0c0; }
        .rarity-rare { border: 2px solid #4a90d9; }
        .rarity-epic { border: 2px solid #9b59b6; }
        .rarity-legendary { border: 2px solid #f1c40f; box-shadow: 0 0 20px rgba(241, 196, 15, 0.5); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎴 AI 单词卡</h1>
            <p>背单词，收集卡片，解锁你的词汇图鉴</p>
        </div>
        
        <!-- 开始界面 -->
        <div class="start-screen active" id="startScreen">
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="totalWords">0</div>
                    <div class="stat-label">已掌握</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalCards">0</div>
                    <div class="stat-label">卡片收集</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="bestStreak">0</div>
                    <div class="stat-label">最高连击</div>
                </div>
            </div>
            
            <button class="start-btn" onclick="startGame()">🎮 开始背单词</button>
            <button class="start-btn" onclick="showCollection()">📚 查看卡片图鉴</button>
            
            <div style="color: white; text-align: center; margin-top: 20px; opacity: 0.8;">
                <p>💡 玩法：选择正确的中文释义，答对收集单词卡片</p>
                <p>🔥 连续答对可获得连击加成</p>
            </div>
        </div>
        
        <!-- 游戏界面 -->
        <div class="game-screen" id="gameScreen">
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="currentScore">0</div>
                    <div class="stat-label">积分</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="currentStreak">0</div>
                    <div class="stat-label">连击</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="cardsCollected">0</div>
                    <div class="stat-label">本轮卡片</div>
                </div>
            </div>
            
            <div class="card-display" id="cardDisplay">
                <div class="combo-display hidden" id="comboDisplay">🔥 x3</div>
                <div class="word-text" id="wordText">Hello</div>
                <div class="word-phonetic" id="wordPhonetic">/həˈloʊ/</div>
                <div class="word-meaning" id="wordMeaning"></div>
                <div class="word-example" id="wordExample"></div>
                
                <div class="options" id="options">
                    <button class="option-btn" onclick="checkAnswer(0)">选项 A</button>
                    <button class="option-btn" onclick="checkAnswer(1)">选项 B</button>
                    <button class="option-btn" onclick="checkAnswer(2)">选项 C</button>
                    <button class="option-btn" onclick="checkAnswer(3)">选项 D</button>
                </div>
                
                <div class="feedback" id="feedback"></div>
                <button class="next-btn" id="nextBtn" onclick="nextWord()">下一题 →</button>
            </div>
            
            <div class="nav-bar">
                <button class="nav-btn" onclick="endGame()">结束游戏</button>
            </div>
        </div>
        
        <!-- 图鉴界面 -->
        <div class="collection-screen" id="collectionScreen">
            <div class="section-title">📚 我的单词卡片图鉴</div>
            <div class="collection-grid" id="collectionGrid"></div>
            
            <div class="nav-bar">
                <button class="nav-btn" onclick="showStart()">返回首页</button>
            </div>
        </div>
    </div>

    <script>
        // 单词数据库
        const wordDatabase = [
            { word: 'abandon', phonetic: '/əˈbændən/', meaning: '放弃，抛弃', example: 'He had to abandon his car in the snow.', rarity: 'common' },
            { word: 'ability', phonetic: '/əˈbɪləti/', meaning: '能力，才能', example: 'She has the ability to speak four languages.', rarity: 'common' },
            { word: 'absent', phonetic: '/ˈæbsənt/', meaning: '缺席的，不在的', example: 'Three students were absent from class today.', rarity: 'common' },
            { word: 'absolute', phonetic: '/ˈæbsəluːt/', meaning: '绝对的，完全的', example: 'I have absolute confidence in you.', rarity: 'rare' },
            { word: 'absorb', phonetic: '/əbˈzɔːrb/', meaning: '吸收，理解', example: 'Plants absorb carbon dioxide from the air.', rarity: 'common' },
            { word: 'abstract', phonetic: '/ˈæbstrækt/', meaning: '抽象的', example: 'The painting is very abstract.', rarity: 'rare' },
            { word: 'abundant', phonetic: '/əˈbʌndənt/', meaning: '丰富的，大量的', example: 'The region is abundant in wildlife.', rarity: 'rare' },
            { word: 'academy', phonetic: '/əˈkædəmi/', meaning: '学院，研究院', example: 'She studied at the Royal Academy of Music.', rarity: 'common' },
            { word: 'accelerate', phonetic: '/əkˈseləreɪt/', meaning: '加速，促进', example: 'The car accelerated to overtake the bus.', rarity: 'epic' },
            { word: 'accent', phonetic: '/ˈæksent/', meaning: '口音，重音', example: 'She speaks English with a French accent.', rarity: 'common' },
            { word: 'access', phonetic: '/ˈækses/', meaning: '进入，使用权', example: 'Students have access to the library.', rarity: 'common' },
            { word: 'accomplish', phonetic: '/əˈkʌmplɪʃ/', meaning: '完成，实现', example: 'We accomplished our mission.', rarity: 'rare' },
            { word: 'accurate', phonetic: '/ˈækjərət/', meaning: '精确的，准确的', example: 'The weather forecast was accurate.', rarity: 'rare' },
            { word: 'accuse', phonetic: '/əˈkjuːz/', meaning: '控告，指责', example: 'He was accused of stealing money.', rarity: 'common' },
            { word: 'achieve', phonetic: '/əˈtʃiːv/', meaning: '达到，实现', example: 'She worked hard to achieve her goals.', rarity: 'common' }
        ];

        // 干扰项词库
        const distractorPool = [
            '接受，承认', '积累，积聚', '准确的，正确的', '达到，实现',
            '完成，实现', '陪伴，伴随', '完成，实现', '承认，准许进入',
            '地址，演讲', '足够的，适当的', '调整，适应', '管理，执行',
            '钦佩，赞赏', '采纳，采用', '先进的，高级的'
        ];

        let gameState = {
            currentWord: null,
            score: 0,
            streak: 0,
            bestStreak: parseInt(localStorage.getItem('bestStreak')) || 0,
            cardsCollected: [],
            totalWords: parseInt(localStorage.getItem('totalWords')) || 0,
            totalCards: parseInt(localStorage.getItem('totalCards')) || 0,
            answered: false
        };

        let currentRoundCards = 0;

        function showScreen(screenName) {
            document.querySelectorAll('.start-screen, .game-screen, .collection-screen').forEach(s => {
                s.classList.remove('active');
            });
            document.getElementById(screenName).classList.add('active');
        }

        function showStart() {
            updateStartStats();
            showScreen('startScreen');
        }

        function updateStartStats() {
            document.getElementById('totalWords').textContent = gameState.totalWords;
            document.getElementById('totalCards').textContent = gameState.totalCards;
            document.getElementById('bestStreak').textContent = gameState.bestStreak;
        }

        function startGame() {
            gameState.score = 0;
            gameState.streak = 0;
            currentRoundCards = 0;
            gameState.answered = false;
            
            document.getElementById('currentScore').textContent = '0';
            document.getElementById('currentStreak').textContent = '0';
            document.getElementById('cardsCollected').textContent = '0';
            
            showScreen('gameScreen');
            nextWord();
        }

        function getRandomWord() {
            return wordDatabase[Math.floor(Math.random() * wordDatabase.length)];
        }

        function generateOptions(correctMeaning) {
            let options = [correctMeaning];
            let availableDistractors = distractorPool.filter(d => d !== correctMeaning);
            
            while (options.length < 4 && availableDistractors.length > 0) {
                let randomIndex = Math.floor(Math.random() * availableDistractors.length);
                let distractor = availableDistractors.splice(randomIndex, 1)[0];
                if (!options.includes(distractor)) {
                    options.push(distractor);
                }
            }
            
            // 打乱顺序
            return options.sort(() => Math.random() - 0.5);
        }

        function nextWord() {
            gameState.answered = false;
            gameState.currentWord = getRandomWord();
            
            document.getElementById('wordText').textContent = gameState.currentWord.word;
            document.getElementById('wordPhonetic').textContent = gameState.currentWord.phonetic;
            document.getElementById('wordMeaning').textContent = '';
            document.getElementById('wordExample').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('nextBtn').classList.remove('show');
            document.getElementById('comboDisplay').classList.add('hidden');
            
            let options = generateOptions(gameState.currentWord.meaning);
            let optionButtons = document.querySelectorAll('.option-btn');
            
            optionButtons.forEach((btn, index) => {
                btn.textContent = options[index] || '---';
                btn.className = 'option-btn';
                btn.disabled = false;
            });
            
            document.getElementById('cardDisplay').classList.remove('card-flip');
        }

        function checkAnswer(selectedIndex) {
            if (gameState.answered) return;
            gameState.answered = true;
            
            let optionButtons = document.querySelectorAll('.option-btn');
            let selectedOption = optionButtons[selectedIndex].textContent;
            let isCorrect = selectedOption === gameState.currentWord.meaning;
            
            optionButtons.forEach((btn, index) => {
                btn.disabled = true;
                if (btn.textContent === gameState.currentWord.meaning) {
                    btn.classList.add('correct');
                } else if (index === selectedIndex && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });
            
            let feedback = document.getElementById('feedback');
            
            if (isCorrect) {
                gameState.streak++;
                let points = 10 * Math.max(1, Math.floor(gameState.streak / 3));
                gameState.score += points;
                currentRoundCards++;
                
                // 检查是否已收集
                if (!gameState.cardsCollected.includes(gameState.currentWord.word)) {
                    gameState.cardsCollected.push(gameState.currentWord.word);
                    gameState.totalCards++;
                    localStorage.setItem('totalCards', gameState.totalCards);
                }
                
                gameState.totalWords++;
                localStorage.setItem('totalWords', gameState.totalWords);
                
                if (gameState.streak > gameState.bestStreak) {
                    gameState.bestStreak = gameState.streak;
                    localStorage.setItem('bestStreak', gameState.bestStreak);
                }
                
                feedback.textContent = `🎉 答对了！+${points}分 连击 x${gameState.streak}`;
                feedback.className = 'feedback correct';
                
                if (gameState.streak >= 3) {
                    document.getElementById('comboDisplay').textContent = `🔥 x${gameState.streak}`;
                    document.getElementById('comboDisplay').classList.remove('hidden');
                }
                
                // 显示例句
                document.getElementById('wordExample').textContent = `💡 ${gameState.currentWord.example}`;
                
            } else {
                gameState.streak = 0;
                feedback.textContent = `❌ 答错了！正确答案是：${gameState.currentWord.meaning}`;
                feedback.className = 'feedback wrong';
                
                // 显示正确答案和例句
                document.getElementById('wordMeaning').textContent = gameState.currentWord.meaning;
                document.getElementById('wordExample').textContent = `💡 ${gameState.currentWord.example}`;
            }
            
            document.getElementById('currentScore').textContent = gameState.score;
            document.getElementById('currentStreak').textContent = gameState.streak;
            document.getElementById('cardsCollected').textContent = currentRoundCards;
            
            document.getElementById('nextBtn').classList.add('show');
        }

        function endGame() {
            alert(`🎮 本轮结束！\n\n积分：${gameState.score}\n最高连击：${gameState.streak}\n收集卡片：${currentRoundCards}张`);
            showStart();
        }

        function showCollection() {
            let grid = document.getElementById('collectionGrid');
            grid.innerHTML = '';
            
            wordDatabase.forEach(word => {
                let isUnlocked = gameState.cardsCollected.includes(word.word);
                let card = document.createElement('div');
                card.className = `collection-card ${isUnlocked ? 'unlocked' : 'locked'} rarity-${word.rarity}`;
                
                let rarityIcon = {
                    'common': '⚪',
                    'rare': '🔵',
                    'epic': '🟣',
                    'legendary': '🟡'
                };
                
                if (isUnlocked) {
                    card.innerHTML = `
                        <div class="card-icon">${rarityIcon[word.rarity]}</div>
                        <div class="card-name">${word.word}</div>
                        <div class="card-rarity">${word.meaning}</div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="card-icon">🔒</div>
                        <div class="card-name">???</div>
                        <div class="card-rarity">未解锁</div>
                    `;
                }
                
                grid.appendChild(card);
            });
            
            showScreen('collectionScreen');
        }

        // 初始化
        updateStartStats();
    </script>
</body>
</html>
