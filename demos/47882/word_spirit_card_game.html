<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 单词精灵 - 背单词，抽精灵</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        
        .header { text-align: center; color: white; padding: 30px 0; }
        .header h1 { font-size: 2em; margin-bottom: 10px; }
        .header p { opacity: 0.9; }
        
        .stats-bar {
            display: flex; justify-content: space-around;
            background: rgba(255,255,255,0.15); border-radius: 15px;
            padding: 15px; margin-bottom: 20px; color: white;
            backdrop-filter: blur(10px);
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.8em; font-weight: bold; }
        .stat-label { font-size: 0.8em; opacity: 0.8; }
        
        .card-display {
            background: white; border-radius: 20px; padding: 30px;
            margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center; min-height: 300px;
            display: flex; flex-direction: column; justify-content: center;
            position: relative; overflow: hidden;
        }
        .card-display::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 5px; background: linear-gradient(90deg, #667eea, #764ba2);
        }
        
        .word-text { font-size: 2.5em; font-weight: bold; color: #333; margin-bottom: 10px; }
        .word-phonetic { color: #888; font-size: 1.1em; margin-bottom: 20px; }
        .word-meaning { font-size: 1.3em; color: #667eea; margin-bottom: 15px; min-height: 30px; }
        .word-example { font-size: 0.95em; color: #666; font-style: italic; line-height: 1.6; min-height: 50px; }
        
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .option-btn {
            padding: 15px 20px; border: 2px solid #e0e0e0; border-radius: 12px;
            background: white; cursor: pointer; font-size: 1em; transition: all 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .option-btn .pos-tag {
            font-size: 0.7em; color: #999; background: #f0f0f0;
            padding: 2px 8px; border-radius: 10px;
        }
        .option-btn:hover { border-color: #667eea; background: #f5f5ff; }
        .option-btn.correct { background: #4CAF50; color: white; border-color: #4CAF50; }
        .option-btn.correct .pos-tag { background: rgba(255,255,255,0.3); color: white; }
        .option-btn.wrong { background: #f44336; color: white; border-color: #f44336; }
        .option-btn.wrong .pos-tag { background: rgba(255,255,255,0.3); color: white; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.7; }
        
        .feedback {
            margin-top: 15px; padding: 15px; border-radius: 10px;
            font-size: 0.95em; display: none;
        }
        .feedback.correct { background: #e8f5e9; color: #2e7d32; display: block; }
        .feedback.wrong { background: #ffebee; color: #c62828; display: block; }
        
        .next-btn {
            display: none; margin-top: 15px; padding: 12px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 25px;
            font-size: 1em; cursor: pointer; transition: transform 0.2s;
        }
        .next-btn:hover { transform: scale(1.05); }
        .next-btn.show { display: inline-block; }
        
        .collection-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-top: 20px;
        }
        .collection-card {
            aspect-ratio: 3/4; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 10px; text-align: center;
            font-size: 0.8em; transition: transform 0.3s; position: relative;
            overflow: hidden;
        }
        .collection-card:hover { transform: scale(1.05); }
        .collection-card.locked { background: #e0e0e0; color: #999; }
        .collection-card.unlocked { color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .collection-card .card-img {
            width: 80px; height: 80px; border-radius: 50%;
            object-fit: cover; margin-bottom: 5px; border: 2px solid rgba(255,255,255,0.5);
        }
        .collection-card .card-name { font-weight: bold; font-size: 0.9em; }
        .collection-card .card-rarity { font-size: 0.7em; opacity: 0.8; }
        .collection-card.unlocked { cursor: pointer; }
        
        /* 放大查看弹窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); z-index: 1000;
            display: none; justify-content: center; align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            width: 320px; max-height: 90vh; overflow-y: auto;
            border-radius: 20px; padding: 30px;
            color: white; text-align: center;
            position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal-card .modal-img {
            width: 180px; height: 180px; border-radius: 50%;
            object-fit: cover; margin-bottom: 15px;
            border: 4px solid rgba(255,255,255,0.6);
        }
        .modal-card .modal-emoji { font-size: 6em; margin-bottom: 10px; }
        .modal-card .modal-name { font-size: 1.8em; font-weight: bold; margin-bottom: 5px; }
        .modal-card .modal-title { font-size: 1em; opacity: 0.9; margin-bottom: 10px; }
        .modal-card .modal-desc { font-size: 0.95em; opacity: 0.85; line-height: 1.5; margin-bottom: 15px; }
        .modal-card .modal-rarity {
            display: inline-block; padding: 5px 15px; border-radius: 15px;
            font-size: 0.85em; font-weight: bold; margin-bottom: 15px;
        }
        .modal-close {
            position: absolute; top: 10px; right: 10px;
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.2); color: white;
            border: none; font-size: 1.2em; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-close:hover { background: rgba(255,255,255,0.4); }
        
        .section-title { color: white; font-size: 1.2em; margin: 20px 0 10px; text-align: center; }
        
        .start-screen, .game-screen, .collection-screen, .gacha-screen { display: none; }
        .start-screen.active, .game-screen.active, .collection-screen.active, .gacha-screen.active { display: block; }
        
        .start-btn {
            display: block; width: 100%; padding: 18px; background: white;
            color: #667eea; border: none; border-radius: 15px;
            font-size: 1.2em; font-weight: bold; cursor: pointer;
            margin: 10px 0; transition: transform 0.2s;
        }
        .start-btn:hover { transform: scale(1.02); }
        
        .nav-bar { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .nav-btn {
            padding: 10px 20px; background: rgba(255,255,255,0.2); color: white;
            border: 1px solid rgba(255,255,255,0.3); border-radius: 20px;
            cursor: pointer; transition: all 0.3s;
        }
        .nav-btn:hover, .nav-btn.active { background: white; color: #667eea; }
        
        .combo-display {
            position: absolute; top: 15px; right: 15px;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            color: white; padding: 5px 15px; border-radius: 20px;
            font-weight: bold; font-size: 0.9em;
        }
        .combo-display.hidden { display: none; }
        
        /* 抽卡界面 */
        .gacha-container { text-align: center; padding: 20px; }
        .gacha-card {
            width: 280px; height: 380px; margin: 20px auto;
            border-radius: 20px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px;
            color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.5s; position: relative; overflow: hidden;
        }
        .gacha-card::before {
            content: ''; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
        }
        .gacha-card.revealed::before { animation: shine 1s ease; }
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
        .gacha-card .spirit-img {
            width: 140px; height: 140px; border-radius: 50%;
            object-fit: cover; margin-bottom: 15px;
            border: 3px solid rgba(255,255,255,0.6);
        }
        .gacha-card .spirit-name { font-size: 1.5em; font-weight: bold; margin-bottom: 5px; }
        .gacha-card .spirit-title { font-size: 0.9em; opacity: 0.9; margin-bottom: 10px; }
        .gacha-card .spirit-desc { font-size: 0.85em; opacity: 0.85; line-height: 1.4; }
        .gacha-card .rarity-badge {
            position: absolute; top: 10px; right: 10px;
            padding: 5px 10px; border-radius: 10px;
            font-size: 0.8em; font-weight: bold;
        }
        
        /* 跳过按钮 */
        .skip-btn {
            padding: 8px 20px; background: rgba(255,255,255,0.3);
            color: white; border: 1px solid rgba(255,255,255,0.5);
            border-radius: 20px; cursor: pointer; margin-top: 10px;
            font-size: 0.9em; transition: all 0.3s;
        }
        .skip-btn:hover { background: white; color: #667eea; }
        
        /* 结果汇总 */
        .result-summary {
            background: rgba(255,255,255,0.95); border-radius: 20px;
            padding: 20px; margin: 20px 0; max-height: 400px;
            overflow-y: auto;
        }
        .result-summary h3 {
            color: #333; margin-bottom: 15px; font-size: 1.2em;
        }
        .result-grid {
            display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        .result-item {
            aspect-ratio: 3/4; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 8px; text-align: center;
            font-size: 0.75em; color: white;
        }
        .result-item .res-img {
            width: 50px; height: 50px; border-radius: 50%;
            object-fit: cover; margin-bottom: 4px;
            border: 2px solid rgba(255,255,255,0.5);
        }
        .result-item .res-emoji { font-size: 2em; margin-bottom: 4px; }
        .result-item .res-name { font-weight: bold; font-size: 0.85em; }
        .result-item .res-rarity { font-size: 0.7em; opacity: 0.9; }
        
        .gacha-btn {
            padding: 15px 40px; font-size: 1.2em; border: none;
            border-radius: 30px; cursor: pointer; margin: 10px;
            transition: all 0.3s; font-weight: bold;
        }
        .gacha-btn:hover { transform: scale(1.05); }
        .gacha-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .gacha-btn.single { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .gacha-btn.ten { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
        
        .gacha-points { color: white; font-size: 1.1em; margin-bottom: 15px; }
        .gacha-info { color: white; opacity: 0.8; font-size: 0.9em; margin-top: 15px; }
        
        /* 稀有度颜色 */
        .rarity-common { background: linear-gradient(135deg, #9e9e9e, #bdbdbd); border: 3px solid #9e9e9e; }
        .rarity-rare { background: linear-gradient(135deg, #2196F3, #03A9F4); border: 3px solid #2196F3; box-shadow: 0 0 20px rgba(33, 150, 243, 0.4); }
        .rarity-epic { background: linear-gradient(135deg, #9C27B0, #E91E63); border: 3px solid #9C27B0; box-shadow: 0 0 30px rgba(156, 39, 176, 0.5); }
        .rarity-legendary { background: linear-gradient(135deg, #FFD700, #FFA000); border: 3px solid #FFD700; box-shadow: 0 0 40px rgba(255, 215, 0, 0.6); }
        
        .rarity-badge-common { background: #9e9e9e; }
        .rarity-badge-rare { background: #2196F3; }
        .rarity-badge-epic { background: #9C27B0; }
        .rarity-badge-legendary { background: #FFD700; color: #333; }
        
        @keyframes gachaShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            75% { transform: translateX(10px) rotate(5deg); }
        }
        .gacha-shake { animation: gachaShake 0.5s ease 3; }
        
        @keyframes gachaReveal {
            0% { transform: scale(0) rotateY(180deg); opacity: 0; }
            50% { transform: scale(1.2) rotateY(90deg); }
            100% { transform: scale(1) rotateY(0deg); opacity: 1; }
        }
        .gacha-reveal { animation: gachaReveal 0.8s ease; }
        
        .progress-bar {
            width: 100%; height: 20px; background: rgba(255,255,255,0.2);
            border-radius: 10px; overflow: hidden; margin: 10px 0;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px; transition: width 0.5s;
        }
        .progress-text { color: white; font-size: 0.9em; text-align: center; margin-top: 5px; }
        
        .score-change {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 2em; font-weight: bold; pointer-events: none;
            animation: scoreFloat 1s ease forwards;
        }
        .score-change.plus { color: #4CAF50; }
        .score-change.minus { color: #f44336; }
        @keyframes scoreFloat {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -150%) scale(1.5); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧚 AI 单词精灵</h1>
            <p>背单词，攒积分，抽精灵卡片</p>
        </div>
        
        <!-- 开始界面 -->
        <div class="start-screen active" id="startScreen">
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="totalWords">0</div>
                    <div class="stat-label">已掌握</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalCards">0</div>
                    <div class="stat-label">精灵收集</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="gachaPoints">0</div>
                    <div class="stat-label">抽卡积分</div>
                </div>
            </div>
            
            <button class="start-btn" onclick="startGame()">🎮 开始背单词</button>
            <button class="start-btn" onclick="showGacha()">🎴 前往抽卡</button>
            <button class="start-btn" onclick="showCollection()">📚 查看精灵图鉴</button>
            
            <div style="color: white; text-align: center; margin-top: 20px; opacity: 0.8;">
                <p>💡 答对获得积分，连击有加成，答错扣 3 分</p>
                <p>🎴 攒够 10 积分即可抽取精灵卡片</p>
            </div>
        </div>
        
        <!-- 游戏界面 -->
        <div class="game-screen" id="gameScreen">
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-value" id="currentScore">0</div>
                    <div class="stat-label">本轮积分</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="currentStreak">0</div>
                    <div class="stat-label">连击</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="currentPoints">0</div>
                    <div class="stat-label">抽卡积分</div>
                </div>
            </div>
            
            <div class="card-display" id="cardDisplay">
                <div class="combo-display hidden" id="comboDisplay">🔥 x3</div>
                <div class="word-text" id="wordText">Hello</div>
                <div class="word-phonetic" id="wordPhonetic"></div>
                <div class="word-meaning" id="wordMeaning"></div>
                <div class="word-example" id="wordExample"></div>
                
                <div class="options" id="options">
                    <button class="option-btn" onclick="checkAnswer(0)">
                        <span class="pos-tag">n.</span>
                        <span>选项 A</span>
                    </button>
                    <button class="option-btn" onclick="checkAnswer(1)">
                        <span class="pos-tag">v.</span>
                        <span>选项 B</span>
                    </button>
                    <button class="option-btn" onclick="checkAnswer(2)">
                        <span class="pos-tag">adj.</span>
                        <span>选项 C</span>
                    </button>
                    <button class="option-btn" onclick="checkAnswer(3)">
                        <span class="pos-tag">adv.</span>
                        <span>选项 D</span>
                    </button>
                </div>
                
                <div class="feedback" id="feedback"></div>
                <button class="next-btn" id="nextBtn" onclick="nextWord()">下一题 →</button>
            </div>
            
            <div class="nav-bar">
                <button class="nav-btn" onclick="showStart()">返回首页</button>
                <button class="nav-btn" onclick="showGacha()">去抽卡</button>
            </div>
        </div>
        
        <!-- 抽卡界面 -->
        <div class="gacha-screen" id="gachaScreen">
            <div class="gacha-container">
                <div class="gacha-points">
                    💎 当前积分：<span id="gachaPointDisplay">0</span>
                </div>
                
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="progress-text" id="progressText">再获得积分即可抽卡（10积分/次）</div>
                
                <!-- 单卡展示（动画用） -->
                <div class="gacha-card" id="gachaCard" style="display: none;">
                    <div class="rarity-badge" id="rarityBadge">普通</div>
                    <img class="spirit-img" id="spiritImg" src="" alt="">
                    <div class="spirit-name" id="spiritName">灰烬兽</div>
                    <div class="spirit-title" id="spiritTitle">火系精灵</div>
                    <div class="spirit-desc" id="spiritDesc">描述</div>
                </div>
                
                <!-- 跳过按钮 -->
                <button class="skip-btn" id="skipBtn" style="display: none;" onclick="skipAnimation()">
                    ⏩ 跳过动画
                </button>
                
                <!-- 结果汇总 -->
                <div class="result-summary" id="resultSummary" style="display: none;">
                    <h3>🎉 抽卡结果</h3>
                    <div class="result-grid" id="resultGrid"></div>
                </div>
                
                <div id="gachaButtons">
                    <button class="gacha-btn single" id="singleGachaBtn" onclick="doGacha(1)">
                        🎴 单抽（10积分）
                    </button>
                    <button class="gacha-btn ten" id="tenGachaBtn" onclick="doGacha(10)">
                        🎴🎴 十连抽（100积分）
                    </button>
                </div>
                
                <div class="gacha-info">
                    <p>📊 概率：普通 60% | 稀有 25% | 史诗 10% | 传说 5%</p>
                    <p>✨ 十连抽必得稀有及以上精灵</p>
                </div>
            </div>
            
            <div class="nav-bar">
                <button class="nav-btn" onclick="showStart()">返回首页</button>
                <button class="nav-btn" onclick="showCollection()">查看图鉴</button>
            </div>
        </div>
        
        <!-- 图鉴界面 -->
        <div class="collection-screen" id="collectionScreen">
            <div class="section-title">📚 我的精灵图鉴</div>
            <div class="collection-grid" id="collectionGrid"></div>
            
            <div class="nav-bar">
                <button class="nav-btn" onclick="showStart()">返回首页</button>
                <button class="nav-btn" onclick="showGacha()">去抽卡</button>
            </div>
        </div>
        
        <!-- 放大查看弹窗 -->
        <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
            <div class="modal-card" id="modalCard">
                <button class="modal-close" onclick="closeModal()">✕</button>
                <img class="modal-img" id="modalImg" src="" alt="" style="display: none;">
                <div class="modal-emoji" id="modalEmoji" style="display: none;"></div>
                <div class="modal-rarity" id="modalRarity">普通</div>
                <div class="modal-name" id="modalName">精灵名称</div>
                <div class="modal-title" id="modalTitle">属性</div>
                <div class="modal-desc" id="modalDesc">描述</div>
            </div>
        </div>
    </div>

    <script>
        // 精灵数据库（与单词解绑，独立设计）
        const spiritDatabase = [
            { id: 1, name: '灰烬兽', title: '火系精灵', img: 'spirit_01_ash_beast.jpg', desc: '尾巴冒着余烬的小恐龙，性格热情但容易冲动。', rarity: 'common' },
            { id: 2, name: '水精灵', title: '水系精灵', img: 'spirit_02_aqua_sponge.jpg', desc: '圆滚滚的水滴精灵，喜欢抱着书本在海底阅读。', rarity: 'common' },
            { id: 3, name: '星火蛾', title: '火系精灵', img: 'spirit_03_starfire_moth.jpg', desc: '蓝色翅膀洒落星点的飞蛾，是夜晚的引路者。', rarity: 'common' },
            { id: 4, name: '迷雾行者', title: '幻系精灵', img: 'spirit_03_fog_walker.jpg', desc: '由紫色迷雾构成的神秘旅者，从不说出自己的来历。', rarity: 'rare' },
            { id: 5, name: '丰收神', title: '森系精灵', img: 'spirit_05_harvest_god.jpg', desc: '守护丰收的森林之神，身边永远环绕着金色麦穗。', rarity: 'rare' },
            { id: 6, name: '学者猫头鹰', title: '智系精灵', img: 'spirit_06_scholar_owl.jpg', desc: '戴着单片眼镜的猫头鹰教授，无所不知。', rarity: 'common' },
            { id: 7, name: '雷精灵', title: '雷系精灵', img: 'spirit_04_thunder_spirit.jpg', desc: '身穿蓝黄战甲的雷电战士，手持闪电长枪。', rarity: 'epic' },
            { id: 8, name: '歌唱家', title: '音系精灵', img: 'spirit_08_songstress.jpg', desc: '用歌声治愈万物的精灵，歌声能让枯木逢春。', rarity: 'common' },
            { id: 9, name: '守门人', title: '岩系精灵', img: 'spirit_09_gatekeeper.jpg', desc: '守护知识之门的古老石像，只有答对问题才能通过。', rarity: 'common' },
            { id: 10, name: '成就大师', title: '光系精灵', img: 'spirit_10_achievement_master.jpg', desc: '手持奖杯的光之使者，奖励每一个努力的人。', rarity: 'rare' },
            { id: 11, name: '神射手', title: '风系精灵', img: 'spirit_11_divine_archer.jpg', desc: '百发百中的风之弓手，箭矢带着精准之风。', rarity: 'rare' },
            { id: 12, name: '审判官', title: '暗系精灵', img: 'spirit_12_dark_judge.jpg', desc: '手持天平的暗影审判者，对错分明，绝不留情。', rarity: 'common' },
            { id: 13, name: '梦想家', title: '星系精灵', img: 'spirit_13_dreamer.jpg', desc: '在星空中编织梦想的精灵，相信一切皆有可能。', rarity: 'common' },
            { id: 14, name: '绝对零度', title: '冰系精灵', img: 'spirit_14_absolute_zero.jpg', desc: '能冻结一切的冰之精灵，冷静而强大。', rarity: 'rare' },
            { id: 15, name: '时之龙', title: '传说精灵', img: 'spirit_05_time_dragon.jpg', desc: '身披三条时间纹路的金色巨龙，掌控过去、现在与未来。', rarity: 'legendary' },
            { id: 16, name: '知识古树', title: '传说精灵', img: 'spirit_06_wisdom_tree.jpg', desc: '树干上刻满文字的远古之树，据说它记住了世间所有知识。', rarity: 'legendary' },
            { id: 17, name: '语言凤凰', title: '传说精灵', img: 'spirit_17_language_phoenix.jpg', desc: '从语言之火中重生的凤凰，掌握所有语言的奥秘。', rarity: 'legendary' },
            { id: 18, name: '深渊之眼', title: '传说精灵', img: 'spirit_18_abyss_eye.jpg', desc: '凝视深渊的神秘之眼，据说能看透一切真相。', rarity: 'legendary' }
        ];

        // 单词数据库（带词性）
        const wordDatabase = [
            { word: 'abandon', phonetic: '/əˈbændən/', pos: 'v.', meaning: '放弃，抛弃', example: 'He had to abandon his car in the snow.' },
            { word: 'ability', phonetic: '/əˈbɪləti/', pos: 'n.', meaning: '能力，才能', example: 'She has the ability to speak four languages.' },
            { word: 'absent', phonetic: '/ˈæbsənt/', pos: 'adj.', meaning: '缺席的，不在的', example: 'Three students were absent from class today.' },
            { word: 'absolute', phonetic: '/ˈæbsəluːt/', pos: 'adj.', meaning: '绝对的，完全的', example: 'I have absolute confidence in you.' },
            { word: 'absorb', phonetic: '/əbˈzɔːrb/', pos: 'v.', meaning: '吸收，理解', example: 'Plants absorb carbon dioxide from the air.' },
            { word: 'abstract', phonetic: '/ˈæbstrækt/', pos: 'adj.', meaning: '抽象的', example: 'The painting is very abstract.' },
            { word: 'abundant', phonetic: '/əˈbʌndənt/', pos: 'adj.', meaning: '丰富的，大量的', example: 'The region is abundant in wildlife.' },
            { word: 'academy', phonetic: '/əˈkædəmi/', pos: 'n.', meaning: '学院，研究院', example: 'She studied at the Royal Academy of Music.' },
            { word: 'accelerate', phonetic: '/əkˈseləreɪt/', pos: 'v.', meaning: '加速，促进', example: 'The car accelerated to overtake the bus.' },
            { word: 'accent', phonetic: '/ˈæksent/', pos: 'n.', meaning: '口音，重音', example: 'She speaks English with a French accent.' },
            { word: 'access', phonetic: '/ˈækses/', pos: 'n.', meaning: '进入，使用权', example: 'Students have access to the library.' },
            { word: 'accomplish', phonetic: '/əˈkʌmplɪʃ/', pos: 'v.', meaning: '完成，实现', example: 'We accomplished our mission.' },
            { word: 'accurate', phonetic: '/ˈækjərət/', pos: 'adj.', meaning: '精确的，准确的', example: 'The weather forecast was accurate.' },
            { word: 'accuse', phonetic: '/əˈkjuːz/', pos: 'v.', meaning: '控告，指责', example: 'He was accused of stealing money.' },
            { word: 'achieve', phonetic: '/əˈtʃiːv/', pos: 'v.', meaning: '达到，实现', example: 'She worked hard to achieve her goals.' },
            { word: 'acknowledge', phonetic: '/əkˈnɒlɪdʒ/', pos: 'v.', meaning: '承认，确认', example: 'He acknowledged his mistake.' },
            { word: 'acquire', phonetic: '/əˈkwaɪər/', pos: 'v.', meaning: '获得，习得', example: 'She acquired a taste for classical music.' },
            { word: 'adapt', phonetic: '/əˈdæpt/', pos: 'v.', meaning: '适应，改编', example: 'Animals must adapt to their environment.' },
            { word: 'adequate', phonetic: '/ˈædɪkwət/', pos: 'adj.', meaning: '足够的，适当的', example: 'The food was adequate but not special.' },
            { word: 'adjust', phonetic: '/əˈdʒʌst/', pos: 'v.', meaning: '调整，适应', example: 'You need to adjust the settings.' }
        ];

        // 词性标签池（用于干扰项）
        const posTags = ['n.', 'v.', 'adj.', 'adv.', 'prep.', 'conj.'];

        const distractorPool = [
            { meaning: '接受，承认', pos: 'v.' }, { meaning: '积累，积聚', pos: 'v.' },
            { meaning: '准确的，正确的', pos: 'adj.' }, { meaning: '达到，实现', pos: 'v.' },
            { meaning: '完成，实现', pos: 'v.' }, { meaning: '陪伴，伴随', pos: 'v.' },
            { meaning: '承认，准许进入', pos: 'v.' }, { meaning: '地址，演讲', pos: 'n.' },
            { meaning: '足够的，适当的', pos: 'adj.' }, { meaning: '调整，适应', pos: 'v.' },
            { meaning: '管理，执行', pos: 'v.' }, { meaning: '钦佩，赞赏', pos: 'v.' },
            { meaning: '采纳，采用', pos: 'v.' }, { meaning: '先进的，高级的', pos: 'adj.' },
            { meaning: '获得，习得', pos: 'v.' }, { meaning: '活跃的，积极的', pos: 'adj.' },
            { meaning: '实际上，事实上', pos: 'adv.' }, { meaning: '添加，增加', pos: 'v.' },
            { meaning: '地址，住址', pos: 'n.' }, { meaning: '管理，行政', pos: 'n.' }
        ];

        let gameState = {
            currentWord: null,
            score: 0,
            streak: 0,
            gachaPoints: parseInt(localStorage.getItem('gachaPoints2')) || 0,
            cardsCollected: JSON.parse(localStorage.getItem('cardsCollected2')) || [],
            totalWords: parseInt(localStorage.getItem('totalWords2')) || 0,
            answered: false
        };

        let currentGachaResults = [];
        let gachaAnimationTimer = null;

        function showScreen(screenName) {
            document.querySelectorAll('.start-screen, .game-screen, .collection-screen, .gacha-screen').forEach(s => {
                s.classList.remove('active');
            });
            document.getElementById(screenName).classList.add('active');
        }

        function showStart() {
            updateStartStats();
            showScreen('startScreen');
        }

        function updateStartStats() {
            document.getElementById('totalWords').textContent = gameState.totalWords;
            document.getElementById('totalCards').textContent = gameState.cardsCollected.length;
            document.getElementById('gachaPoints').textContent = Math.max(0, gameState.gachaPoints);
        }

        function startGame() {
            gameState.score = 0;
            gameState.streak = 0;
            gameState.answered = false;
            
            document.getElementById('currentScore').textContent = '0';
            document.getElementById('currentStreak').textContent = '0';
            document.getElementById('currentPoints').textContent = Math.max(0, gameState.gachaPoints);
            
            showScreen('gameScreen');
            nextWord();
        }

        function getRandomWord() {
            return wordDatabase[Math.floor(Math.random() * wordDatabase.length)];
        }

        function generateOptions(correctMeaning, correctPos) {
            let options = [{ meaning: correctMeaning, pos: correctPos }];
            let available = distractorPool.filter(d => d.meaning !== correctMeaning);
            
            while (options.length < 4 && available.length > 0) {
                let idx = Math.floor(Math.random() * available.length);
                let d = available.splice(idx, 1)[0];
                if (!options.find(o => o.meaning === d.meaning)) options.push(d);
            }
            
            // 如果不够4个，随机补词性
            while (options.length < 4) {
                let randomPos = posTags[Math.floor(Math.random() * posTags.length)];
                options.push({ meaning: '---', pos: randomPos });
            }
            
            return options.sort(() => Math.random() - 0.5);
        }

        function nextWord() {
            gameState.answered = false;
            gameState.currentWord = getRandomWord();
            
            document.getElementById('wordText').textContent = gameState.currentWord.word;
            document.getElementById('wordPhonetic').textContent = gameState.currentWord.phonetic;
            document.getElementById('wordMeaning').textContent = '';
            document.getElementById('wordExample').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('nextBtn').classList.remove('show');
            document.getElementById('comboDisplay').classList.add('hidden');
            
            let options = generateOptions(gameState.currentWord.meaning, gameState.currentWord.pos);
            let btns = document.querySelectorAll('.option-btn');
            btns.forEach((btn, i) => {
                let opt = options[i];
                btn.innerHTML = `<span class="pos-tag">${opt.pos}</span><span>${opt.meaning}</span>`;
                btn.dataset.meaning = opt.meaning;
                btn.className = 'option-btn';
                btn.disabled = false;
            });
        }

        function showScoreChange(amount) {
            let el = document.createElement('div');
            el.className = 'score-change ' + (amount > 0 ? 'plus' : 'minus');
            el.textContent = (amount > 0 ? '+' : '') + amount;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function checkAnswer(selectedIndex) {
            if (gameState.answered) return;
            gameState.answered = true;
            
            let btns = document.querySelectorAll('.option-btn');
            let selected = btns[selectedIndex].dataset.meaning;
            let isCorrect = selected === gameState.currentWord.meaning;
            
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (btn.dataset.meaning === gameState.currentWord.meaning) btn.classList.add('correct');
                else if (i === selectedIndex && !isCorrect) btn.classList.add('wrong');
            });
            
            let feedback = document.getElementById('feedback');
            
            if (isCorrect) {
                gameState.streak++;
                let base = 5;
                // 连击达到3次才开始额外加分
                let bonus = gameState.streak >= 3 ? (gameState.streak - 2) * 2 : 0;
                let total = base + bonus;
                
                gameState.score += total;
                gameState.gachaPoints += total;
                gameState.totalWords++;
                
                localStorage.setItem('gachaPoints2', gameState.gachaPoints);
                localStorage.setItem('totalWords2', gameState.totalWords);
                
                showScoreChange(total);
                let bonusText = bonus > 0 ? ` + 连击+${bonus}` : '';
                feedback.textContent = `🎉 答对了！+${total}积分（基础${base}${bonusText}）`;
                feedback.className = 'feedback correct';
                
                if (gameState.streak >= 3) {
                    document.getElementById('comboDisplay').textContent = `🔥 x${gameState.streak}`;
                    document.getElementById('comboDisplay').classList.remove('hidden');
                }
                
                document.getElementById('wordExample').textContent = `💡 ${gameState.currentWord.example}`;
                
            } else {
                let penalty = 3;
                gameState.streak = 0;
                gameState.gachaPoints = Math.max(0, gameState.gachaPoints - penalty);
                
                localStorage.setItem('gachaPoints2', gameState.gachaPoints);
                
                showScoreChange(-penalty);
                feedback.textContent = `❌ 答错了！-${penalty}积分 | 正确答案：${gameState.currentWord.pos} ${gameState.currentWord.meaning}`;
                feedback.className = 'feedback wrong';
                
                document.getElementById('wordMeaning').textContent = `${gameState.currentWord.pos} ${gameState.currentWord.meaning}`;
                document.getElementById('wordExample').textContent = `💡 ${gameState.currentWord.example}`;
            }
            
            document.getElementById('currentScore').textContent = gameState.score;
            document.getElementById('currentStreak').textContent = gameState.streak;
            document.getElementById('currentPoints').textContent = Math.max(0, gameState.gachaPoints);
            document.getElementById('nextBtn').classList.add('show');
        }

        // 抽卡系统
        function showGacha() {
            updateGachaDisplay();
            showScreen('gachaScreen');
        }

        function updateGachaDisplay() {
            let pts = Math.max(0, gameState.gachaPoints);
            document.getElementById('gachaPointDisplay').textContent = pts;
            
            let progress = (pts % 10) / 10 * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            
            let needed = 10 - (pts % 10);
            document.getElementById('progressText').textContent = 
                needed === 10 ? '可以抽卡了！' : `再获得 ${needed} 积分即可抽卡`;
            
            document.getElementById('singleGachaBtn').disabled = pts < 10;
            document.getElementById('tenGachaBtn').disabled = pts < 100;
        }

        function getRandomRarity() {
            let r = Math.random();
            if (r < 0.05) return 'legendary';
            if (r < 0.15) return 'epic';
            if (r < 0.40) return 'rare';
            return 'common';
        }

        function getRandomSpirit(rarity) {
            let pool = spiritDatabase.filter(s => s.rarity === rarity);
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function getGuaranteedRare() {
            let r = Math.random();
            let rarity = r < 0.10 ? 'legendary' : r < 0.40 ? 'epic' : 'rare';
            return getRandomSpirit(rarity);
        }

        function doGacha(count) {
            let cost = count * 10;
            if (gameState.gachaPoints < cost) return;
            
            gameState.gachaPoints -= cost;
            localStorage.setItem('gachaPoints2', gameState.gachaPoints);
            
            // 隐藏按钮和之前的汇总
            document.getElementById('gachaButtons').style.display = 'none';
            document.getElementById('gachaCard').style.display = 'none';
            document.getElementById('resultSummary').style.display = 'none';
            document.getElementById('resultGrid').innerHTML = '';
            
            currentGachaResults = [];
            for (let i = 0; i < count; i++) {
                let spirit;
                if (count === 10 && i === 9) {
                    spirit = getGuaranteedRare();
                } else {
                    spirit = getRandomSpirit(getRandomRarity());
                }
                currentGachaResults.push(spirit);
                if (!gameState.cardsCollected.find(c => c.id === spirit.id)) {
                    gameState.cardsCollected.push(spirit);
                }
            }
            
            localStorage.setItem('cardsCollected2', JSON.stringify(gameState.cardsCollected));
            
            // 显示跳过按钮
            document.getElementById('skipBtn').style.display = 'inline-block';
            
            // 开始动画
            showGachaAnimation(currentGachaResults, 0);
        }

        function skipAnimation() {
            // 清除定时器
            if (gachaAnimationTimer) {
                clearTimeout(gachaAnimationTimer);
                gachaAnimationTimer = null;
            }
            
            // 隐藏单卡展示和跳过按钮
            document.getElementById('gachaCard').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            
            // 直接显示汇总
            showResultSummary(currentGachaResults);
        }

        function showGachaAnimation(results, index) {
            if (index >= results.length) {
                // 动画结束，显示汇总
                document.getElementById('skipBtn').style.display = 'none';
                showResultSummary(results);
                return;
            }
            
            let spirit = results[index];
            let card = document.getElementById('gachaCard');
            
            card.className = 'gacha-card rarity-' + spirit.rarity;
            
            let rarityNames = { common: '普通', rare: '稀有', epic: '史诗', legendary: '传说' };
            document.getElementById('rarityBadge').textContent = rarityNames[spirit.rarity];
            document.getElementById('rarityBadge').className = 'rarity-badge rarity-badge-' + spirit.rarity;
            
            let imgEl = document.getElementById('spiritImg');
            if (spirit.img) {
                imgEl.src = spirit.img;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }
            
            document.getElementById('spiritName').textContent = spirit.name;
            document.getElementById('spiritTitle').textContent = spirit.title;
            document.getElementById('spiritDesc').textContent = spirit.desc;
            
            card.style.display = 'flex';
            card.classList.add('gacha-shake');
            
            gachaAnimationTimer = setTimeout(() => {
                card.classList.remove('gacha-shake');
                card.classList.add('gacha-reveal', 'revealed');
                
                gachaAnimationTimer = setTimeout(() => {
                    card.classList.remove('gacha-reveal', 'revealed');
                    
                    if (results.length > 1 && index < results.length - 1) {
                        gachaAnimationTimer = setTimeout(() => {
                            showGachaAnimation(results, index + 1);
                        }, 1200);
                    } else {
                        gachaAnimationTimer = setTimeout(() => {
                            document.getElementById('skipBtn').style.display = 'none';
                            showResultSummary(results);
                        }, 2000);
                    }
                }, 1000);
            }, 1500);
        }

        function showResultSummary(results) {
            let grid = document.getElementById('resultGrid');
            grid.innerHTML = '';
            
            results.forEach(spirit => {
                let item = document.createElement('div');
                item.className = 'result-item rarity-' + spirit.rarity;
                
                if (spirit.img) {
                    item.innerHTML = `
                        <img class="res-img" src="${spirit.img}" alt="${spirit.name}">
                        <div class="res-name">${spirit.name}</div>
                        <div class="res-rarity">${spirit.title}</div>
                    `;
                } else {
                    item.innerHTML = `
                        <div class="res-emoji">${spirit.emoji || '✨'}</div>
                        <div class="res-name">${spirit.name}</div>
                        <div class="res-rarity">${spirit.title}</div>
                    `;
                }
                
                grid.appendChild(item);
            });
            
            document.getElementById('resultSummary').style.display = 'block';
            document.getElementById('gachaButtons').style.display = 'block';
            updateGachaDisplay();
        }

        function showCollection() {
            let grid = document.getElementById('collectionGrid');
            grid.innerHTML = '';
            
            spiritDatabase.forEach(spirit => {
                let collected = gameState.cardsCollected.find(c => c.id === spirit.id);
                let card = document.createElement('div');
                card.className = `collection-card ${collected ? 'unlocked rarity-' + spirit.rarity : 'locked'}`;
                
                if (collected) {
                    let imgHtml = spirit.img 
                        ? `<img class="card-img" src="${spirit.img}" alt="${spirit.name}">`
                        : `<div style="font-size:2.5em;margin-bottom:5px;">${spirit.emoji || '✨'}</div>`;
                    card.innerHTML = `
                        ${imgHtml}
                        <div class="card-name">${spirit.name}</div>
                        <div class="card-rarity">${spirit.title}</div>
                    `;
                    card.onclick = () => openModal(spirit);
                } else {
                    card.innerHTML = `
                        <div style="font-size:2.5em;margin-bottom:5px;">🔒</div>
                        <div class="card-name">???</div>
                        <div class="card-rarity">未解锁</div>
                    `;
                }
                
                grid.appendChild(card);
            });
            
            showScreen('collectionScreen');
        }

        function openModal(spirit) {
            let overlay = document.getElementById('modalOverlay');
            let card = document.getElementById('modalCard');
            
            card.className = 'modal-card rarity-' + spirit.rarity;
            
            let rarityNames = { common: '普通', rare: '稀有', epic: '史诗', legendary: '传说' };
            let rarityColors = { common: '#9e9e9e', rare: '#2196F3', epic: '#9C27B0', legendary: '#FFD700' };
            
            document.getElementById('modalRarity').textContent = rarityNames[spirit.rarity];
            document.getElementById('modalRarity').style.background = rarityColors[spirit.rarity];
            document.getElementById('modalName').textContent = spirit.name;
            document.getElementById('modalTitle').textContent = spirit.title;
            document.getElementById('modalDesc').textContent = spirit.desc;
            
            let imgEl = document.getElementById('modalImg');
            let emojiEl = document.getElementById('modalEmoji');
            
            if (spirit.img) {
                imgEl.src = spirit.img;
                imgEl.style.display = 'block';
                emojiEl.style.display = 'none';
            } else {
                imgEl.style.display = 'none';
                emojiEl.textContent = spirit.emoji || '✨';
                emojiEl.style.display = 'block';
            }
            
            overlay.classList.add('active');
        }

        function closeModal(event) {
            if (event && event.target !== document.getElementById('modalOverlay') && event.target !== document.querySelector('.modal-close')) {
                return;
            }
            document.getElementById('modalOverlay').classList.remove('active');
        }

        updateStartStats();
    </script>
</body>
</html>
