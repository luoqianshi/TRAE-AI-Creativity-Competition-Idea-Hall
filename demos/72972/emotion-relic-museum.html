<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>情绪遗物记忆馆 · 治愈系日历手账</title>
  <style>
/* ============================================
   情绪遗物记忆馆 - 全局治愈风样式
   ============================================ */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --cream: #FAF6F0;
  --apricot: #E8DCC8;
  --warm-orange: #E8A87C;
  --mint: #C9D6DF;
  --soft-pink: #F4C2C2;
  --lavender: #D4C5E2;
  --ink: #5B5447;
  --ink-light: #8B8275;
  --line: #E5DCC9;

  --c-food: #E8A87C;
  --c-scenery: #C9D6DF;
  --c-emotion: #F4C2C2;
  --c-lucky: #D4C5E2;

  --shadow-soft: 0 4px 20px rgba(139, 130, 117, 0.12);
  --shadow-card: 0 8px 32px rgba(139, 130, 117, 0.18);
}

html, body {
  height: 100%;
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  color: var(--ink);
  background: var(--cream);
  overflow-x: hidden;
}

.paper-texture {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(232, 168, 124, 0.06) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(201, 214, 223, 0.08) 0%, transparent 50%),
    repeating-linear-gradient(
      45deg,
      transparent 0,
      transparent 2px,
      rgba(139, 130, 117, 0.015) 2px,
      rgba(139, 130, 117, 0.015) 4px
    ),
    var(--cream);
  z-index: -1;
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 40px;
  background: rgba(250, 246, 240, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon { font-size: 26px; }

.logo-text {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--ink);
}

.nav-menu { display: flex; gap: 8px; }

.nav-link {
  padding: 8px 20px;
  border-radius: 24px;
  text-decoration: none;
  color: var(--ink-light);
  font-size: 15px;
  transition: all 0.3s ease;
  cursor: pointer;
}

.nav-link:hover { background: var(--apricot); color: var(--ink); }

.nav-link.active { background: var(--warm-orange); color: #fff; }

.app-main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 40px 80px;
  min-height: calc(100vh - 80px);
}

.page-title {
  font-size: 28px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.page-subtitle {
  font-size: 14px;
  color: var(--ink-light);
  margin-bottom: 32px;
}

.card {
  background: #fff;
  border-radius: 16px;
  box-shadow: var(--shadow-soft);
  border: 1px solid rgba(229, 220, 201, 0.5);
}

.btn {
  padding: 10px 24px;
  border: none;
  border-radius: 24px;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.3s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary { background: var(--warm-orange); color: #fff; }

.btn-primary:hover {
  background: #d8976a;
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(232, 168, 124, 0.4);
}

.btn-ghost {
  background: transparent;
  color: var(--ink-light);
  border: 1px solid var(--line);
}

.btn-ghost:hover { background: var(--apricot); color: var(--ink); }

.toast {
  position: fixed;
  top: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(91, 84, 71, 0.92);
  color: #fff;
  padding: 12px 28px;
  border-radius: 24px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.4s ease;
  z-index: 9999;
  backdrop-filter: blur(8px);
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(250, 246, 240, 0.92);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9998;
}

.loading-overlay.show { display: flex; }

.loading-card {
  background: #fff;
  padding: 40px 56px;
  border-radius: 20px;
  box-shadow: var(--shadow-card);
  text-align: center;
}

.loading-spinner {
  width: 48px;
  height: 48px;
  border: 4px solid var(--apricot);
  border-top-color: var(--warm-orange);
  border-radius: 50%;
  margin: 0 auto 20px;
  animation: spin 0.9s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 6px;
}

.loading-sub {
  font-size: 13px;
  color: var(--ink-light);
}

/* ---------- 日历首页 ---------- */
.calendar-page {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 24px;
}

.sidebar {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.sidebar-card {
  background: #fff;
  border-radius: 16px;
  padding: 22px;
  box-shadow: var(--shadow-soft);
  border: 1px solid rgba(229, 220, 201, 0.5);
}

.sidebar-title {
  font-size: 14px;
  color: var(--ink-light);
  margin-bottom: 12px;
  letter-spacing: 1px;
}

.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stat-item {
  background: var(--cream);
  border-radius: 10px;
  padding: 14px;
  text-align: center;
}

.stat-num {
  font-size: 24px;
  font-weight: 600;
  color: var(--warm-orange);
}

.stat-label {
  font-size: 12px;
  color: var(--ink-light);
  margin-top: 4px;
}

.quote-text {
  font-size: 14px;
  line-height: 1.8;
  color: var(--ink);
  font-style: italic;
}

.quote-author {
  font-size: 12px;
  color: var(--ink-light);
  margin-top: 10px;
  text-align: right;
}

.calendar-main {
  background: #fff;
  border-radius: 16px;
  padding: 28px;
  box-shadow: var(--shadow-soft);
  border: 1px solid rgba(229, 220, 201, 0.5);
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.month-switch {
  display: flex;
  align-items: center;
  gap: 16px;
}

.month-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: #fff;
  cursor: pointer;
  font-size: 14px;
  color: var(--ink-light);
  transition: all 0.2s;
}

.month-btn:hover { background: var(--apricot); color: var(--ink); }

.month-label {
  font-size: 20px;
  font-weight: 600;
  color: var(--ink);
  min-width: 140px;
  text-align: center;
}

.today-btn {
  font-size: 13px;
  color: var(--warm-orange);
  cursor: pointer;
  padding: 4px 12px;
  border-radius: 12px;
  border: 1px solid var(--warm-orange);
  background: transparent;
  transition: all 0.2s;
}

.today-btn:hover { background: var(--warm-orange); color: #fff; }

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
}

.weekday {
  text-align: center;
  font-size: 12px;
  color: var(--ink-light);
  padding: 8px 0;
  letter-spacing: 1px;
}

.day-cell {
  aspect-ratio: 1 / 1.1;
  border-radius: 10px;
  padding: 6px;
  background: var(--cream);
  border: 1px solid transparent;
  cursor: pointer;
  position: relative;
  display: flex;
  flex-direction: column;
  transition: all 0.2s;
  overflow: hidden;
}

.day-cell:hover {
  border-color: var(--warm-orange);
  transform: translateY(-2px);
  box-shadow: var(--shadow-soft);
}

.day-cell.empty {
  background: transparent;
  cursor: default;
  pointer-events: none;
}

.day-cell.today {
  background: linear-gradient(135deg, #FFF4EA, #FFE6D1);
  border-color: var(--warm-orange);
}

.day-num {
  font-size: 13px;
  color: var(--ink);
  font-weight: 500;
  margin-bottom: 4px;
}

.day-cell.has-record .day-num {
  color: var(--warm-orange);
  font-weight: 600;
}

.day-thumb {
  flex: 1;
  border-radius: 6px;
  background-size: cover;
  background-position: center;
  background-color: var(--apricot);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.day-empty-hint {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-light);
  font-size: 18px;
  opacity: 0.4;
}

.day-emoji {
  position: absolute;
  top: 4px;
  right: 6px;
  font-size: 11px;
}

.day-tooltip {
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: #fff;
  border-radius: 10px;
  padding: 10px 14px;
  box-shadow: var(--shadow-card);
  font-size: 12px;
  white-space: nowrap;
  z-index: 10;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  border: 1px solid var(--line);
}

.day-cell:hover .day-tooltip { opacity: 1; }

.tooltip-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 11px;
  color: #fff;
}

/* ---------- 上传记录页 ---------- */
.upload-page {
  max-width: 720px;
  margin: 0 auto;
}

.upload-card {
  background: #fff;
  border-radius: 20px;
  padding: 36px;
  box-shadow: var(--shadow-soft);
  border: 1px solid rgba(229, 220, 201, 0.5);
}

.section-label {
  font-size: 14px;
  color: var(--ink-light);
  margin-bottom: 12px;
  letter-spacing: 1px;
}

.section-label .required { color: var(--soft-pink); }

.category-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}

.category-item {
  background: var(--cream);
  border: 2px solid transparent;
  border-radius: 14px;
  padding: 18px 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}

.category-item:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-soft);
}

.category-item.selected {
  border-color: var(--warm-orange);
  background: #FFF4EA;
}

.category-icon { font-size: 32px; margin-bottom: 6px; }

.category-name {
  font-size: 13px;
  color: var(--ink);
  font-weight: 500;
}

.category-desc {
  font-size: 11px;
  color: var(--ink-light);
  margin-top: 2px;
}

.photo-upload-area {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}

.photo-slot {
  aspect-ratio: 1 / 1;
  border: 2px dashed var(--apricot);
  border-radius: 12px;
  background: var(--cream);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.2s;
}

.photo-slot:hover {
  border-color: var(--warm-orange);
  background: #FFF4EA;
}

.photo-slot.has-image {
  border-style: solid;
  border-color: var(--warm-orange);
}

.photo-slot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-add-icon {
  font-size: 28px;
  color: var(--ink-light);
  margin-bottom: 4px;
}

.photo-add-text {
  font-size: 12px;
  color: var(--ink-light);
}

.photo-remove {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(91, 84, 71, 0.7);
  color: #fff;
  border: none;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.emotion-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 28px;
}

.emotion-tag {
  padding: 8px 18px;
  border-radius: 20px;
  background: var(--cream);
  border: 1px solid var(--line);
  font-size: 13px;
  color: var(--ink-light);
  cursor: pointer;
  transition: all 0.2s;
}

.emotion-tag:hover { background: var(--apricot); }

.emotion-tag.selected {
  background: var(--soft-pink);
  color: var(--ink);
  border-color: var(--soft-pink);
  font-weight: 500;
}

.text-input {
  width: 100%;
  min-height: 90px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--cream);
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
}

.text-input:focus { border-color: var(--warm-orange); }

.input-counter {
  text-align: right;
  font-size: 12px;
  color: var(--ink-light);
  margin-top: 6px;
}

.date-picker {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
}

.date-input {
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--cream);
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  outline: none;
}

.submit-row {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px dashed var(--line);
}

/* ---------- 手账详情页 ---------- */
.detail-page {
  max-width: 1000px;
  margin: 0 auto;
}

.detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.detail-meta {
  display: flex;
  align-items: center;
  gap: 12px;
}

.detail-date {
  font-size: 22px;
  font-weight: 600;
  color: var(--ink);
}

.detail-badge {
  padding: 4px 14px;
  border-radius: 12px;
  font-size: 12px;
  color: #fff;
}

.journal-spread {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow-card);
  border: 1px solid var(--line);
  position: relative;
}

.journal-spread::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: repeating-linear-gradient(
    to bottom,
    var(--line) 0,
    var(--line) 4px,
    transparent 4px,
    transparent 10px
  );
}

.journal-page {
  padding: 32px;
  position: relative;
}

.journal-page.left {
  background: linear-gradient(135deg, #FFFBF5 0%, #FFF6EA 100%);
}

.journal-page.right {
  background: linear-gradient(135deg, #FFFBF5 0%, #FDF8F0 100%);
}

.page-corner {
  position: absolute;
  bottom: 16px;
  font-size: 11px;
  color: var(--ink-light);
  letter-spacing: 1px;
}

.page-corner.left { left: 24px; }
.page-corner.right { right: 24px; }

.journal-image-block { margin-bottom: 20px; }

.journal-image-label {
  font-size: 12px;
  color: var(--ink-light);
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.journal-image {
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: 12px;
  background-size: cover;
  background-position: center;
  background-color: var(--apricot);
  border: 6px solid #fff;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

.journal-illustration {
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
  background: linear-gradient(135deg, var(--cream), var(--apricot));
  border: 6px solid #fff;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

.journal-section-title {
  font-size: 14px;
  color: var(--ink);
  margin-bottom: 10px;
  margin-top: 24px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.journal-text {
  font-size: 14px;
  line-height: 2;
  color: var(--ink);
  padding: 16px;
  background: rgba(232, 220, 200, 0.18);
  border-radius: 10px;
  border-left: 3px solid var(--warm-orange);
}

.journal-text.ai {
  border-left-color: var(--soft-pink);
  font-style: italic;
}

.journal-decor {
  position: absolute;
  font-size: 28px;
  opacity: 0.5;
  pointer-events: none;
}

.decor-tl { top: 16px; left: 20px; }
.decor-br { bottom: 50px; right: 24px; }

.card-preview-section {
  margin-top: 32px;
  text-align: center;
}

.collection-card {
  max-width: 480px;
  margin: 0 auto;
  background: linear-gradient(135deg, #FFFBF5, #FFF0E0);
  border-radius: 18px;
  padding: 28px;
  box-shadow: var(--shadow-card);
  border: 1px solid var(--apricot);
  position: relative;
}

.cc-date {
  font-size: 12px;
  color: var(--ink-light);
  letter-spacing: 2px;
}

.cc-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
  margin: 6px 0 16px;
}

.cc-image {
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: 12px;
  background-size: cover;
  background-position: center;
  background-color: var(--apricot);
  margin-bottom: 16px;
  border: 4px solid #fff;
  box-shadow: 0 4px 14px rgba(0,0,0,0.1);
}

.cc-story {
  font-size: 13px;
  line-height: 1.9;
  color: var(--ink);
  font-style: italic;
  margin-bottom: 16px;
  text-align: left;
}

.cc-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--ink-light);
}

/* ---------- 藏品图鉴 ---------- */
.gallery-page {
  max-width: 1100px;
  margin: 0 auto;
}

.gallery-stats {
  display: flex;
  gap: 16px;
  margin-bottom: 24px;
}

.gallery-stat-card {
  flex: 1;
  background: #fff;
  border-radius: 14px;
  padding: 18px 20px;
  box-shadow: var(--shadow-soft);
  display: flex;
  align-items: center;
  gap: 14px;
}

.stat-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

.stat-info-num {
  font-size: 22px;
  font-weight: 600;
  color: var(--ink);
}

.stat-info-label {
  font-size: 12px;
  color: var(--ink-light);
}

.gallery-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}

.gallery-tab {
  padding: 8px 18px;
  border-radius: 20px;
  background: transparent;
  border: none;
  font-size: 14px;
  color: var(--ink-light);
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.gallery-tab:hover { background: var(--apricot); }

.gallery-tab.active {
  background: var(--warm-orange);
  color: #fff;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}

.gallery-item {
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow-soft);
  cursor: pointer;
  transition: all 0.3s;
  border: 1px solid rgba(229, 220, 201, 0.5);
}

.gallery-item:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-card);
}

.gallery-thumb {
  width: 100%;
  aspect-ratio: 1 / 1;
  background-size: cover;
  background-position: center;
  background-color: var(--apricot);
}

.gallery-thumb-placeholder {
  width: 100%;
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  background: linear-gradient(135deg, var(--cream), var(--apricot));
}

.gallery-info { padding: 14px 16px; }

.gallery-info-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.gallery-date {
  font-size: 12px;
  color: var(--ink-light);
}

.gallery-emotion {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 8px;
  color: #fff;
}

.gallery-text {
  font-size: 13px;
  color: var(--ink);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 2;

  <script>
const Storage = (function () {
  const STORAGE_KEY = 'emotion_relic_records';

  function getAll() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    try {
      return JSON.parse(raw);
    } catch (e) {
      console.error('数据解析失败', e);
      return [];
    }
  }

  function saveAll(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function add(record) {
    const list = getAll();
    record.id = 'r_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
    record.created_at = new Date().toISOString();
    list.push(record);
    saveAll(list);
    return record;
  }

  function getById(id) {
    return getAll().find(r => r.id === id);
  }

  function getByDate(dateStr) {
    return getAll().filter(r => r.record_date === dateStr);
  }

  function update(id, patch) {
    const list = getAll();
    const idx = list.findIndex(r => r.id === id);
    if (idx >= 0) {
      list[idx] = { ...list[idx], ...patch };
      saveAll(list);
      return list[idx];
    }
    return null;
  }

  function remove(id) {
    const list = getAll().filter(r => r.id !== id);
    saveAll(list);
  }

  function getByMonth(year, month) {
    const list = getAll();
    return list.filter(r => {
      const d = new Date(r.record_date);
      return d.getFullYear() === year && (d.getMonth() + 1) === month;
    });
  }

  function getByCategory(category) {
    if (category === 'all') return getAll();
    return getAll().filter(r => r.category === category);
  }

  function getStats() {
    const list = getAll();
    return {
      total: list.length,
      food: list.filter(r => r.category === 'food').length,
      scenery: list.filter(r => r.category === 'scenery').length,
      emotion: list.filter(r => r.category === 'emotion').length,
      lucky: list.filter(r => r.category === 'lucky').length,
    };
  }

  function getMonthStats(year, month) {
    const list = getByMonth(year, month);
    return {
      total: list.length,
      food: list.filter(r => r.category === 'food').length,
      scenery: list.filter(r => r.category === 'scenery').length,
      emotion: list.filter(r => r.category === 'emotion').length,
      lucky: list.filter(r => r.category === 'lucky').length,
    };
  }

  function seedSampleData() {
    if (getAll().length > 0) return;

    const today = new Date();
    const y = today.getFullYear();
    const m = today.getMonth() + 1;
    const fmt = (d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

    const samples = [
      {
        record_date: fmt(Math.max(1, today.getDate() - 4)),
        category: 'food',
        emotion_tag: 'heal',
        user_text: '今天和朋友去吃了日料，三文鱼很新鲜，幸福感满满。',
        photo_url: 'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=600',
        ai_story: '你坐下来，把筷子轻轻分开。三文鱼的橘色像傍晚的云，落在白瓷盘里。朋友说起今天的事，你笑出声。这一刻没什么了不起，却足够温柔，足够让你记得很久。',
        ai_illustration_emoji: '🍣',
      },
      {
        record_date: fmt(Math.max(1, today.getDate() - 3)),
        category: 'scenery',
        emotion_tag: 'gentle',
        user_text: '下班路上的日落，粉紫色的天空温柔得不像话。',
        photo_url: 'https://images.unsplash.com/photo-1495616811223-4d98c6e9c869?w=600',
        ai_story: '你站在路口，太阳慢慢沉下去。粉紫色的天空铺开，像谁不小心打翻了颜料。你没有赶路，只是站着看了一会儿。生活里有些温柔，是停下来的那一刻才看得见的。',
        ai_illustration_emoji: '🌅',
      },
      {
        record_date: fmt(Math.max(1, today.getDate() - 2)),
        category: 'emotion',
        emotion_tag: 'miss',
        user_text: '整理抽屉翻出高中的电影票根，是那场我们一起看的《你的名字》。',
        photo_url: 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=600',
        ai_story: '你捏着那张褪色的票根，纸张已经发软。那年的电影院灯光很暗，你们没说什么话，只是并肩坐着。时间走得很快，但有些东西被留在了那张小纸片里，一直没有走。',
        ai_illustration_emoji: '🎞️',
      },
      {
        record_date: fmt(Math.max(1, today.getDate() - 1)),
        category: 'lucky',
        emotion_tag: 'happy',
        user_text: '楼下咖啡店送了我一朵小花，开心了一整天。',
        photo_url: 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=600',
        ai_story: '咖啡师把小花递过来时，你愣了一下。那是一朵很小的雏菊，被包在牛皮纸里。你捧着它走回家，像捧着一整个春天。原来快乐可以这么轻，轻到一朵花就能装下。',
        ai_illustration_emoji: '☕',
      },
      {
        record_date: fmt(today.getDate()),
        category: 'food',
        emotion_tag: 'relax',
        user_text: '周末给自己煮了一碗面，配一颗溏心蛋，慢慢吃完。',
        photo_url: 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=600',
        ai_story: '你把面盛进白瓷碗，溏心蛋切开的瞬间，金黄流出来。窗外有风，房间里只有筷子碰碗的声音。一个人吃饭也可以很郑重，这是你今天给自己的一份温柔。',
        ai_illustration_emoji: '🍜',
      },
    ];

    samples.forEach(s => {
      s.id = 'r_seed_' + Math.random().toString(36).slice(2, 9);
      s.created_at = new Date().toISOString();
    });

    saveAll(samples);
  }

  return {
    getAll, add, getById, getByDate, update, remove,
    getByMonth, getByCategory, getStats, getMonthStats, seedSampleData,
  };
})();

const AI = (function () {
  const CATEGORY_CONFIG = {
    food: {

      icon: '🍱',
      color: '#E8A87C',
      emoji: '🍣',

  const EMOTION_CONFIG = {
    happy:   { name: '开心', color: '#E8A87C' },
    heal:    { name: '治愈', color: '#C9D6DF' },
    miss:    { name: '怀念', color: '#F4C2C2' },

    gentle:  { name: '温柔', color: '#D4C5E2' },
  };

  const STORY_TEMPLATES = {
    food: [
      '你坐下来，把筷子轻轻分开。{kw1}从盘子里漫出来，落在你眉眼上。{user}这一刻没什么了不起，却足够温柔，足够让你在很久以后，还想起这顿饭的温度。',
      '热气从碗里升起来，模糊了窗外的光。{kw1}裹着{kw2}，慢慢沉进心里。{user}原来生活的善意，常常藏在这样一小口滋味里。',
      '你把食物盛进白瓷碗，颜色很好看。{kw1}是这顿饭的背景音。{user}一个人吃饭也可以很郑重，这是你今天给自己的一份温柔。',
    ],
    scenery: [
      '你站在那里，{kw1}从远处铺过来。{user}天空慢慢换了一种颜色，你也没赶路，只是看着。生活里有些温柔，是停下来的那一刻才看得见的。',
      '{kw1}落在你肩上，{kw2}轻轻拂过脸。{user}你没说话，但心里好像有什么被松开了。这一刻的辽阔，是只属于你一个人的。',
      '你抬头看了一眼，{kw1}正在变成另一种颜色。{user}原来世界一直在悄悄给你递温柔，只是平时太忙，没接住而已。',
    ],
    emotion: [
      '你捏着那件小东西，{kw1}从指尖漫上来。{user}时间走得很快，但有些东西被留在了这里，一直没有走。',
      '它静静躺在手心，{kw1}像一封旧信。{user}那年的人不在身边了，可那一刻的温度，还捂在这小小的遗物里。',
      '你看了它一会儿，{kw2}慢慢浮上来。{user}回忆不一定要被解开，有些就让它妥帖地放在这里，也是一种温柔。',
    ],
    lucky: [
      '{kw1}落在你手心时，你愣了一下。{user}原来快乐可以这么轻，轻到一朵花、一杯咖啡，就能装下整个春天。',
      '你捧着它，{kw2}在心底慢慢化开。{user}生活其实一直在偷偷送你小礼物，只是有时你没注意。今天你接住了。',
      '这小小的东西，被你郑重地收下。{kw1}是它给你的回应。{user}愿你一直有这种能力——为一点点小确幸，开心一整天。',
    ],
  };

  const DAILY_QUOTES = [
    { text: '愿你被这个世界温柔以待，也愿你温柔地对待自己。', author: '— 给每一个记录者' },
    { text: '生活不是缺少美好，而是缺少记录美好的习惯。', author: '— 致情绪遗物馆藏家' },
    { text: '今天的小确幸，是明天回望时的光。', author: '— 来自记忆馆' },
    { text: '你记下的每一帧，都是给未来自己的礼物。', author: '— 来自记忆馆' },
    { text: '慢慢来，好的东西都值得被温柔收藏。', author: '— 来自记忆馆' },
    { text: '愿你眼里有光，心里有暖，手中有花。', author: '— 来自记忆馆' },
    { text: '日子是琐碎的，但温柔藏在每一处缝隙里。', author: '— 来自记忆馆' },
    { text: '不必每天都闪闪发光，能记录平凡，已经很了不起。', author: '— 来自记忆馆' },
    { text: '把今天的情绪妥善收好，明天又是新的开始。', author: '— 来自记忆馆' },
    { text: '你留下的不是照片，是一段被认真对待的时间。', author: '— 来自记忆馆' },
  ];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function buildPrompt(category, emotion, userText, date) {
    return `角色：你是一位温柔的治愈系文字创作者
任务：根据用户上传的生活照片与文字，生成一段专属治愈短文

输入：
- 场景类型：${CATEGORY_CONFIG[category].name}
- 情绪标签：${EMOTION_CONFIG[emotion].name}
- 用户文字：${userText || '（用户未填写文字）'}
- 日期：${date}

要求：
1. 字数 80-150 字
2. 第二人称"你"叙述，温柔治愈基调
3. 不说教、不鸡汤，聚焦当下生活美好
4. 可适当融入场景元素
5. 结尾留一句轻盈的祝福或感悟

输出格式：纯文本，无标题，无分段`;
  }

  function generateStory(category, emotion, userText, date) {
    const cfg = CATEGORY_CONFIG[category];
    const templates = STORY_TEMPLATES[category] || STORY_TEMPLATES.lucky;
    let tpl = pick(templates);

    const kw1 = pick(cfg.keywords);
    let kw2 = pick(cfg.keywords.filter(k => k !== kw1));
    if (!kw2) kw2 = kw1;

    let story = tpl
      .replace('{kw1}', kw1)
      .replace('{kw2}', kw2)
      .replace('{user}', userText ? `${userText}——` : '');

    story = story.replace(/————/g, '——').replace(/——$/g, '。');

    return { story, prompt: buildPrompt(category, emotion, userText, date) };
  }

  function buildImagePrompt(category, emotion) {
    const cfg = CATEGORY_CONFIG[category];
    const emo = EMOTION_CONFIG[emotion];
    return `风格：治愈系插画，柔和水彩质感，奶白浅杏色调
场景：${cfg.name}场景
情绪：${emo.name}
要求：
- 不要出现人物正面
- 突出氛围感与温暖光感
- 留白构图，适合作为手账插画
- 4:3 横版比例`;
  }

  function generateIllustration(category, emotion) {
    return {
      emoji: CATEGORY_CONFIG[category].illustration,
      prompt: buildImagePrompt(category, emotion),
      imageUrl: null,
    };
  }

  function getDailyQuote() { return pick(DAILY_QUOTES); }

  function generateAll(category, emotion, userText, date) {
    return new Promise((resolve) => {
      const delay = 1500 + Math.random() * 1000;
      setTimeout(() => {
        const story = generateStory(category, emotion, userText, date);
        const illustration = generateIllustration(category, emotion);
        resolve({
          ai_story: story.story,
          ai_story_prompt: story.prompt,
          ai_illustration_emoji: illustration.emoji,
          ai_illustration_prompt: illustration.prompt,
          ai_illustration_url: illustration.imageUrl,
        });
      }, delay);
    });
  }

  return {
    CATEGORY_CONFIG, EMOTION_CONFIG, DAILY_QUOTES,
    generateAll, getDailyQuote, buildPrompt, buildImagePrompt,
  };
})();

const App = (function () {
  const state = {
    currentRoute: 'calendar',
    calYear: new Date().getFullYear(),
    calMonth: new Date().getMonth() + 1,
    uploadForm: {
      category: null,
      emotion_tag: null,
      user_text: '',
      photo_url: '',
      record_date: new Date().toISOString().slice(0, 10),
    },

  };

  const appEl = document.getElementById('app');

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  function showLoading(text) {
    const el = document.getElementById('loading');
    if (text) el.querySelector('.loading-text').textContent = text;
    else el.querySelector('.loading-text').textContent = 'AI 正在为你生成治愈内容...';
    el.classList.add('show');
  }

  function hideLoading() {
    document.getElementById('loading').classList.remove('show');
  }

  function fmtDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function getTodayStr() { return fmtDate(new Date()); }
  function pad(n) { return String(n).padStart(2, '0'); }

  function navigate(route, params = {}) {
    state.currentRoute = route;
    state.routeParams = params;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function handleHashChange() {
    const hash = location.hash.replace(/^#\/?/, '');
    const [route, param] = hash.split('/');
    if (route === 'upload' || route === 'gallery' || route === 'calendar') {
      navigate(route);
    } else if (route === 'detail' && param) {
      navigate('detail', { id: param });
    } else {
      navigate('calendar');
    }
  }

  function render() {
    document.querySelectorAll('.nav-link').forEach(a => {
      a.classList.toggle('active', a.dataset.route === state.currentRoute);
    });

    const route = state.currentRoute;
    if (route === 'calendar') renderCalendar();
    else if (route === 'upload') renderUpload();
    else if (route === 'detail') renderDetail();
    else if (route === 'gallery') renderGallery();
    else renderCalendar();
  }

  function renderCalendar() {
    const { calYear, calMonth } = state;
    const monthRecords = Storage.getByMonth(calYear, calMonth);
    const stats = Storage.getMonthStats(calYear, calMonth);
    const quote = AI.getDailyQuote();
    const todayStr = getTodayStr();

    const recordMap = {};
    monthRecords.forEach(r => {
      const day = parseInt(r.record_date.slice(8), 10);
      if (!recordMap[day]) recordMap[day] = [];
      recordMap[day].push(r);
    });

    const firstDay = new Date(calYear, calMonth - 1, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth, 0).getDate();
    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];

    let cells = '';
    for (let i = 0; i < firstDay; i++) {
      cells += `<div class="day-cell empty"></div>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${calYear}-${pad(calMonth)}-${pad(d)}`;
      const recs = recordMap[d];
      const hasRecord = recs && recs.length > 0;
      const isToday = dateStr === todayStr;

      let thumbHtml = '';
      let emojiHtml = '';
      let tooltipHtml = '';

      if (hasRecord) {
        const r = recs[0];

          thumbHtml = `<div class="day-thumb" style="background-image:url('${r.photo_url}')"></div>`;

        }
        const emo = AI.EMOTION_CONFIG[r.emotion_tag];

        thumbHtml = `<div class="day-empty-hint">+</div>`;

          ${thumbHtml}

              </div>

                <div class="stat-num">${stats.scenery}</div>
                <div class="stat-label">风景遗物</div>

              </div>
            </div>
          </div>

          <div class="sidebar-card">
            <div class="sidebar-title">今日治愈</div>
            <div class="quote-text">${quote.text}</div>
            <div class="quote-author">${quote.author}</div>
          </div>

          <div class="sidebar-card" style="text-align:center;">
            <div class="sidebar-title">留存今日</div>
            <p style="font-size:13px;color:#8B8275;line-height:1.8;margin-bottom:14px;">
              把今天的一个小瞬间，<br/>妥帖地收进馆藏里。
            </p>
            <button class="btn btn-primary" id="go-upload-btn" style="width:100%;">+ 留存今日遗物</button>
          </div>
        </aside>

        <section class="calendar-main">
          <div class="calendar-header">
            <div class="month-switch">
              <button class="month-btn" id="prev-month">‹</button>
              <div class="month-label">${calYear} 年 ${calMonth} 月</div>
              <button class="month-btn" id="next-month">›</button>
            </div>
            <button class="today-btn" id="today-btn">回到今日</button>
          </div>

          <div class="calendar-grid">
            ${weekdays.map(w => `<div class="weekday">${w}</div>`).join('')}
            ${cells}
          </div>
        </section>
      </div>
    `;

    document.getElementById('prev-month').onclick = () => changeMonth(-1);
    document.getElementById('next-month').onclick = () => changeMonth(1);
    document.getElementById('today-btn').onclick = () => {
      const now = new Date();
      state.calYear = now.getFullYear();
      state.calMonth = now.getMonth() + 1;
      render();
    };
    document.getElementById('go-upload-btn').onclick = () => navigate('upload');

    document.querySelectorAll('.day-cell:not(.empty)').forEach(cell => {
      cell.onclick = () => {
        const id = cell.dataset.id;
        const date = cell.dataset.date;
        if (id) navigate('detail', { id });
        else {
          state.uploadForm.record_date = date;
          navigate('upload');
        }
      };
    });
  }

  function changeMonth(delta) {
    let m = state.calMonth + delta;
    let y = state.calYear;
    if (m < 1) { m = 12; y--; }
    if (m > 12) { m = 1; y++; }
    state.calMonth = m;
    state.calYear = y;
    render();
  }

  function renderUpload() {
    const form = state.uploadForm;
    const cats = AI.CATEGORY_CONFIG;
    const emos = AI.EMOTION_CONFIG;

    appEl.innerHTML = `
      <div class="upload-page">
        <h1 class="page-title">留存今日的情绪遗物</h1>
        <p class="page-subtitle">把今天的一个小瞬间，妥帖地交给 AI，让它陪你写成温柔的故事。</p>

        <div class="upload-card">
          <div class="section-label">选择场景类型 <span class="required">*</span></div>
          <div class="category-grid">
            ${Object.keys(cats).map(key => `
              <div class="category-item ${form.category === key ? 'selected' : ''}" data-cat="${key}">
                <div class="category-icon">${cats[key].icon}</div>
                <div class="category-name">${cats[key].name}</div>
                <div class="category-desc">${getCategoryDesc(key)}</div>
              </div>
            `).join('')}
          </div>

          <div class="section-label">上传生活照片 <span class="required">*</span></div>
          <div class="photo-upload-area">
            <div class="photo-slot ${form.photo_url ? 'has-image' : ''}" id="photo-slot">
              ${form.photo_url
                ? `<img src="${form.photo_url}" alt=""/><button class="photo-remove" id="remove-photo">×</button>`
                : `<div class="photo-add-icon">📷</div><div class="photo-add-text">点击上传</div>`
              }
              <input type="file" id="photo-input" accept="image/*" style="display:none;"/>
            </div>
            <div class="photo-slot" style="border-style:dashed;opacity:0.5;">
              <div class="photo-add-icon">📷</div>
              <div class="photo-add-text">可选</div>
            </div>
            <div class="photo-slot" style="border-style:dashed;opacity:0.5;">
              <div class="photo-add-icon">📷</div>
              <div class="photo-add-text">可选</div>
            </div>
          </div>

          <div class="section-label">当下的情绪 <span class="required">*</span></div>
          <div class="emotion-tags">
            ${Object.keys(emos).map(key => `
              <div class="emotion-tag ${form.emotion_tag === key ? 'selected' : ''}" data-emo="${key}">
                ${emos[key].name}
              </div>
            `).join('')}
          </div>

          <div class="section-label">今日记事（可不填，AI 也会基于照片生成）</div>
          <textarea class="text-input" id="user-text" maxlength="100"
            placeholder="写一句话记录此刻...">${form.user_text}</textarea>
          <div class="input-counter"><span id="text-count">${form.user_text.length}</span> / 100</div>

          <div class="section-label">记录日期</div>
          <div class="date-picker">
            <input type="date" class="date-input" id="record-date" value="${form.record_date}"/>
          </div>

          <div class="submit-row">
            <button class="btn btn-ghost" id="cancel-btn">取消</button>
            <button class="btn btn-primary" id="submit-btn">✨ 生成 AI 治愈内容</button>
          </div>
        </div>
      </div>
    `;

    bindUploadEvents();
  }

  function getCategoryDesc(key) {
    return {
      food: '美食·奶茶·聚餐',
      scenery: '日落·风景·旅途',
      emotion: '票根·旧物·礼物',
      lucky: '鲜花·书本·咖啡',
    }[key];
  }

  function bindUploadEvents() {
    document.querySelectorAll('.category-item').forEach(el => {
      el.onclick = () => {
        state.uploadForm.category = el.dataset.cat;
        document.querySelectorAll('.category-item').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
      };
    });

    document.querySelectorAll('.emotion-tag').forEach(el => {
      el.onclick = () => {
        state.uploadForm.emotion_tag = el.dataset.emo;
        document.querySelectorAll('.emotion-tag').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
      };
    });

    const textInput = document.getElementById('user-text');
    textInput.oninput = () => {
      state.uploadForm.user_text = textInput.value;
      document.getElementById('text-count').textContent = textInput.value.length;
    };

    document.getElementById('record-date').onchange = (e) => {
      state.uploadForm.record_date = e.target.value;
    };

    const photoSlot = document.getElementById('photo-slot');
    const photoInput = document.getElementById('photo-input');
    photoSlot.onclick = () => photoInput.click();
    photoInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        state.uploadForm.photo_url = ev.target.result;
        render();
      };
      reader.readAsDataURL(file);
    };
    document.getElementById('remove-photo').onclick = (e) => {
      e.stopPropagation();
      state.uploadForm.photo_url = '';
      render();
    };

    document.getElementById('cancel-btn').onclick = () => {
      resetUploadForm();
      navigate('calendar');
    };

    document.getElementById('submit-btn').onclick = handleSubmit;
  }

  function resetUploadForm() {
    state.uploadForm = {
      category: null,
      emotion_tag: null,
      user_text: '',
      photo_url: '',
      record_date: getTodayStr(),
    };
  }

  function handleSubmit() {
    const f = state.uploadForm;
    if (!f.category) { toast('请先选择一个场景类型'); return; }
    if (!f.photo_url) { toast('请上传一张生活照片'); return; }
    if (!f.emotion_tag) { toast('请选择当下的情绪'); return; }

    showLoading();

    AI.generateAll(f.category, f.emotion_tag, f.user_text, f.record_date).then(aiResult => {
      const record = {
        record_date: f.record_date,
        category: f.category,
        emotion_tag: f.emotion_tag,
        user_text: f.user_text,
        photo_url: f.photo_url,
        ai_story: aiResult.ai_story,
        ai_illustration_emoji: aiResult.ai_illustration_emoji,
        ai_illustration_url: aiResult.ai_illustration_url,
      };

      const saved = Storage.add(record);
      hideLoading();
      resetUploadForm();
      toast('治愈内容已生成，正在跳转到手账详情...');
      setTimeout(() => navigate('detail', { id: saved.id }), 800);
    });
  }

  function renderDetail() {
    const id = state.routeParams && state.routeParams.id;
    const r = Storage.getById(id);

    if (!r) {
      appEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">🗂️</div>
          <div class="empty-state-text">没有找到这条记忆</div>
          <button class="btn btn-primary" onclick="location.hash='#/calendar'">回到日历</button>
        </div>`;
      return;
    }

    const cat = AI.CATEGORY_CONFIG[r.category];
    const emo = AI.EMOTION_CONFIG[r.emotion_tag];
    const dateObj = new Date(r.record_date);
    const dateLabel = `${dateObj.getFullYear()}年${dateObj.getMonth()+1}月${dateObj.getDate()}日`;

    appEl.innerHTML = `
      <div class="detail-page">
        <div class="detail-header">
          <div class="detail-meta">
            <div class="detail-date">📅 ${dateLabel}</div>
            <span class="detail-badge" style="background:${cat.color}">${cat.icon} ${cat.name}</span>
            <span class="detail-badge" style="background:${emo.color}">${emo.name}</span>
          </div>
          <button class="btn btn-ghost" onclick="location.hash='#/calendar'">‹ 返回日历</button>
        </div>

        <div class="journal-spread">
          <div class="journal-page left">
            <div class="journal-decor decor-tl">${cat.emoji}</div>
            <div class="journal-image-block">
              <div class="journal-image-label">— 你的瞬间 —</div>
              <div class="journal-image" style="background-image:url('${r.photo_url}')"></div>
            </div>
            <div class="journal-image-block">
              <div class="journal-image-label">— AI 氛围插画 —</div>
              <div class="journal-illustration">${r.ai_illustration_emoji || cat.illustration}</div>
            </div>
            <div class="page-corner left">— ${pad(dateObj.getMonth()+1)}.${pad(dateObj.getDate())} —</div>
            <div class="journal-decor decor-br">${emo.name === '治愈' ? '🌿' : '🌸'}</div>
          </div>

          <div class="journal-page right">
            <div class="journal-section-title">📝 我的记事</div>
            <div class="journal-text">
              ${r.user_text || '<span style="color:#8B8275;font-style:italic;">（这一天，你没写字，只留了一张照片）</span>'}
            </div>

            <div class="journal-section-title">✨ AI 治愈故事</div>
            <div class="journal-text ai">${r.ai_story}</div>

            <div class="journal-section-title">🏷️ 情绪标签</div>
            <div style="display:flex;gap:8px;">
              <span class="emotion-tag selected" style="cursor:default;">${emo.name}</span>
              <span class="emotion-tag" style="background:${cat.color};color:#fff;border-color:${cat.color};cursor:default;">${cat.name}</span>
            </div>

            <div class="page-corner right">— No. ${r.id.slice(-4).toUpperCase()} —</div>
          </div>
        </div>

        <div class="card-preview-section">
          <h3 style="font-size:16px;color:#5B5447;margin-bottom:16px;letter-spacing:1px;">🎴 专属手账收藏卡片</h3>
          <div class="collection-card">
            <div class="cc-date">${dateLabel}</div>
            <div class="cc-title">${cat.icon} ${cat.name} · ${emo.name}</div>
            <div class="cc-image" style="background-image:url('${r.photo_url}')"></div>
            <div class="cc-story">"${r.ai_story}"</div>
            <div class="cc-footer">
              <span>情绪遗物记忆馆</span>
              <span>— ${r.id.slice(-4).toUpperCase()} —</span>
            </div>
          </div>
          <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;">
            <button class="btn btn-ghost" onclick="location.hash='#/gallery'">查看图鉴</button>
            <button class="btn btn-primary" onclick="location.hash='#/upload'">再留存一条</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderGallery() {
    const stats = Storage.getStats();
    const cats = AI.CATEGORY_CONFIG;
    const tab = state.galleryTab;
    const list = Storage.getByCategory(tab).sort((a, b) =>
      new Date(b.record_date) - new Date(a.record_date)
    );

    const statCards = [
      { key: 'total',   icon: '📦', label: '总藏品', num: stats.total,   color: '#E8A87C' },
      { key: 'food',    icon: cats.food.icon,    label: cats.food.name,    num: stats.food,    color: cats.food.color },
      { key: 'scenery', icon: cats.scenery.icon, label: cats.scenery.name, num: stats.scenery, color: cats.scenery.color },
      { key: 'emotion', icon: cats.emotion.icon, label: cats.emotion.name, num: stats.emotion, color: cats.emotion.color },
      { key: 'lucky',   icon: cats.lucky.icon,   label: cats.lucky.name,   num: stats.lucky,   color: cats.lucky.color },
    ];

    const tabs = [
      { key: 'all',     label: '全部' },
      { key: 'food',    label: cats.food.name },
      { key: 'scenery', label: cats.scenery.name },
      { key: 'emotion', label: cats.emotion.name },
      { key: 'lucky',   label: cats.lucky.name },
    ];

    let gridHtml = '';
    if (list.length === 0) {
      gridHtml = `
        <div class="empty-state">
          <div class="empty-state-icon">🌸</div>
          <div class="empty-state-text">这里还没有藏品，去留存第一份温柔吧</div>
          <button class="btn btn-primary" onclick="location.hash='#/upload'">+ 留存今日遗物</button>
        </div>`;
    } else {
      gridHtml = `<div class="gallery-grid">` + list.map(r => {
        const cat = cats[r.category];
        const emo = AI.EMOTION_CONFIG[r.emotion_tag];
        const d = new Date(r.record_date);
        const dateStr = `${d.getMonth()+1}.${d.getDate()}`;
        const thumb = r.photo_url
          ? `<div class="gallery-thumb" style="background-image:url('${r.photo_url}')"></div>`
          : `<div class="gallery-thumb-placeholder">${cat.illustration}</div>`;
        return `
          <div class="gallery-item" data-id="${r.id}">
            ${thumb}
            <div class="gallery-info">
              <div class="gallery-info-top">
                <span class="gallery-date">${dateStr}</span>
                <span class="gallery-emotion" style="background:${emo.color}">${emo.name}</span>
              </div>
              <div class="gallery-text">${r.user_text || r.ai_story.slice(0, 40) + '...'}</div>
            </div>
          </div>`;
      }).join('') + `</div>`;
    }

    appEl.innerHTML = `
      <div class="gallery-page">
        <h1 class="page-title">我的情绪藏品图鉴</h1>
        <p class="page-subtitle">每一份温柔，都被妥帖地收在这里。</p>

        <div class="gallery-stats">
          ${statCards.map(s => `
            <div class="gallery-stat-card">
              <div class="stat-icon" style="background:${s.color}20;color:${s.color}">${s.icon}</div>
              <div>
                <div class="stat-info-num">${s.num}</div>
                <div class="stat-info-label">${s.label}</div>
              </div>
            </div>
          `).join('')}
        </div>

        <div class="gallery-tabs">
          ${tabs.map(t => `
            <button class="gallery-tab ${tab === t.key ? 'active' : ''}" data-tab="${t.key}">${t.label}</button>
          `).join('')}
        </div>

        ${gridHtml}
      </div>
    `;

    document.querySelectorAll('.gallery-tab').forEach(el => {
      el.onclick = () => {
        state.galleryTab = el.dataset.tab;
        render();
      };
    });
    document.querySelectorAll('.gallery-item').forEach(el => {
      el.onclick = () => navigate('detail', { id: el.dataset.id });
    });
  }

  function init() {
    Storage.seedSampleData();
    window.addEventListener('hashchange', handleHashChange);
    handleHashChange();
  }

  return { init, navigate };
})();

document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
