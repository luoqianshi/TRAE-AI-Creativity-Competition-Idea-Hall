<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纠结GAME OVER - SmartChoice 加权决策助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --purple: #667eea;
  --pink: #f093fb;
  --blue: #4facfe;
  --bg-dark: #0a0a1a;
  --bg-card: rgba(15, 15, 35, 0.85);
  --bg-card-hover: rgba(25, 25, 55, 0.9);
  --text-primary: #e0e0ff;
  --text-secondary: #8888aa;
  --text-muted: #555577;
  --border-color: rgba(102, 126, 234, 0.2);
  --glow-purple: rgba(102, 126, 234, 0.3);
  --glow-pink: rgba(240, 147, 251, 0.3);
  --glow-blue: rgba(79, 172, 254, 0.3);
  --success: #00e676;
  --warn: #ffab40;
  --error: #ff5252;
  --info: #40c4ff;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --font-main: 'Noto Sans SC', sans-serif;
  --font-code: 'JetBrains Mono', monospace;
  --transition: all 0.3s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: var(--font-main);
  background: var(--bg-dark);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

#matrix-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ===== Particle Overlay ===== */
#particles-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
  pointer-events: none;
}

/* ===== Opening Screen ===== */
#opening-screen {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-dark);
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
#opening-screen.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.terminal-window {
  width: 90%;
  max-width: 720px;
  background: rgba(5, 5, 20, 0.95);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  box-shadow: var(--shadow), 0 0 60px rgba(102, 126, 234, 0.15);
  overflow: hidden;
}

.terminal-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  background: rgba(20, 20, 45, 0.9);
  border-bottom: 1px solid var(--border-color);
}
.terminal-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
}
.terminal-dot.red { background: #ff5f57; }
.terminal-dot.yellow { background: #ffbd2e; }
.terminal-dot.green { background: #28ca42; }
.terminal-title {
  flex: 1;
  text-align: center;
  font-family: var(--font-code);
  font-size: 0.8rem;
  color: var(--text-secondary);
}

.terminal-body {
  padding: 20px;
  min-height: 340px;
  max-height: 400px;
  overflow-y: auto;
  font-family: var(--font-code);
  font-size: 0.85rem;
  line-height: 1.8;
}
.terminal-line {
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  white-space: pre-wrap;
  word-break: break-all;
}
.terminal-line.visible {
  opacity: 1;
  transform: translateY(0);
}
.terminal-line.cmd { color: var(--info); }
.terminal-line.error { color: var(--error); }
.terminal-line.success { color: var(--success); }
.terminal-line.info { color: var(--text-secondary); }
.terminal-line.highlight { color: var(--pink); font-weight: 700; font-size: 1rem; }
.terminal-line.slogan { color: var(--blue); font-size: 0.9rem; }

.terminal-cursor {
  display: inline-block;
  width: 8px;
  height: 16px;
  background: var(--success);
  animation: blink 1s step-end infinite;
  vertical-align: middle;
  margin-left: 4px;
}
@keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }

#enter-btn-wrap {
  text-align: center;
  padding: 16px 20px 24px;
  display: none;
}
#enter-btn {
  font-family: var(--font-code);
  font-size: 1rem;
  padding: 12px 40px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: #fff;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
  letter-spacing: 2px;
}
#enter-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 30px rgba(240, 147, 251, 0.5);
}

/* ===== Main App ===== */
#main-app {
  position: relative;
  z-index: 10;
  display: none;
  min-height: 100vh;
  padding-bottom: 80px;
}
#main-app.active { display: block; }

/* Top Slogan Bar */
.slogan-bar {
  text-align: center;
  padding: 20px 16px 10px;
  font-family: var(--font-code);
  font-size: 0.85rem;
  color: var(--blue);
  letter-spacing: 2px;
  opacity: 0.8;
}

/* Header */
.app-header {
  text-align: center;
  padding: 20px 16px 10px;
}
.app-header h1 {
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  font-weight: 900;
  background: linear-gradient(135deg, var(--purple), var(--pink), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.app-header p {
  font-family: var(--font-code);
  font-size: 0.8rem;
  color: var(--text-secondary);
}

/* Container */
.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 16px;
}

/* ===== Scene Selection ===== */
.section-title {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 16px;
  padding-left: 12px;
  border-left: 3px solid var(--purple);
  color: var(--text-primary);
}

.scene-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 32px;
}
.scene-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 16px 12px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.scene-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--purple), var(--pink));
  opacity: 0;
  transition: opacity 0.3s ease;
}
.scene-card:hover::before,
.scene-card.active::before { opacity: 1; }
.scene-card:hover {
  background: var(--bg-card-hover);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(102, 126, 234, 0.2);
}
.scene-card.active {
  border-color: var(--purple);
  box-shadow: 0 0 20px var(--glow-purple);
}
.scene-icon { font-size: 1.5rem; margin-bottom: 6px; }
.scene-label { font-size: 0.82rem; color: var(--text-primary); }

/* ===== Cards ===== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
}
.card-title {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 16px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title .badge {
  font-family: var(--font-code);
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 50px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: #fff;
}

/* ===== Options Management ===== */
.options-list { margin-bottom: 16px; }
.option-item {
  background: rgba(20, 20, 50, 0.6);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 16px;
  margin-bottom: 12px;
  transition: var(--transition);
  animation: fadeInUp 0.3s ease;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.option-item:hover { border-color: rgba(102, 126, 234, 0.4); }

.option-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.option-name {
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.option-name .idx {
  font-family: var(--font-code);
  font-size: 0.7rem;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(102, 126, 234, 0.2);
  color: var(--purple);
}
.option-delete {
  background: none;
  border: 1px solid rgba(255, 82, 82, 0.3);
  color: var(--error);
  font-size: 0.75rem;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--font-code);
  transition: var(--transition);
}
.option-delete:hover {
  background: rgba(255, 82, 82, 0.15);
  border-color: var(--error);
}

.option-weight {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.weight-label {
  font-family: var(--font-code);
  font-size: 0.75rem;
  color: var(--text-secondary);
  min-width: 50px;
}
.weight-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--purple), var(--pink));
  outline: none;
  opacity: 0.7;
  transition: opacity 0.2s;
}
.weight-slider:hover { opacity: 1; }
.weight-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
.weight-slider::-moz-range-thumb {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  border: none;
}
.weight-value {
  font-family: var(--font-code);
  font-size: 0.85rem;
  color: var(--pink);
  font-weight: 700;
  min-width: 36px;
  text-align: right;
}

.reasons-area { margin-top: 8px; }
.reasons-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.reasons-header span {
  font-size: 0.78rem;
  color: var(--text-secondary);
}
.add-reason-btn {
  font-family: var(--font-code);
  font-size: 0.7rem;
  padding: 3px 10px;
  background: rgba(79, 172, 254, 0.15);
  border: 1px solid rgba(79, 172, 254, 0.3);
  color: var(--blue);
  border-radius: 4px;
  cursor: pointer;
  transition: var(--transition);
}
.add-reason-btn:hover {
  background: rgba(79, 172, 254, 0.25);
}

.reason-list { margin-top: 6px; }
.reason-item {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 4px 0;
  font-size: 0.8rem;
  animation: fadeInUp 0.2s ease;
}
.reason-tag {
  font-family: var(--font-code);
  font-size: 0.65rem;
  padding: 1px 6px;
  border-radius: 3px;
  flex-shrink: 0;
  margin-top: 2px;
}
.reason-tag.positive { background: rgba(0, 230, 118, 0.15); color: var(--success); }
.reason-tag.negative { background: rgba(255, 82, 82, 0.15); color: var(--error); }
.reason-tag.neutral { background: rgba(255, 171, 64, 0.15); color: var(--warn); }
.reason-text { color: var(--text-secondary); flex: 1; }
.reason-remove {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.7rem;
  flex-shrink: 0;
}
.reason-remove:hover { color: var(--error); }

/* Add new option */
.add-option-area {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.add-option-input {
  flex: 1;
  font-family: var(--font-main);
  font-size: 0.9rem;
  padding: 10px 14px;
  background: rgba(20, 20, 50, 0.6);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  outline: none;
  transition: var(--transition);
}
.add-option-input:focus { border-color: var(--purple); }
.add-option-input::placeholder { color: var(--text-muted); }
.add-option-btn {
  font-family: var(--font-code);
  font-size: 0.82rem;
  padding: 10px 20px;
  background: linear-gradient(135deg, var(--purple), var(--blue));
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
}
.add-option-btn:hover {
  box-shadow: 0 4px 16px var(--glow-purple);
  transform: translateY(-1px);
}

/* ===== Poker Cards ===== */
.poker-area {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: center;
  min-height: 200px;
  align-items: center;
  padding: 20px 0;
}
.poker-card {
  width: 120px;
  height: 180px;
  perspective: 800px;
  cursor: pointer;
  transition: var(--transition);
}
.poker-card:hover { transform: translateY(-4px); }
.poker-card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s ease;
  border-radius: var(--radius-sm);
}
.poker-card.flipped .poker-card-inner {
  transform: rotateY(180deg);
}
.poker-card.selected .poker-card-inner {
  transform: rotateY(180deg);
  box-shadow: 0 0 30px var(--glow-pink), 0 0 60px var(--glow-purple);
}
.poker-face {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: var(--radius-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px;
  text-align: center;
}
.poker-front {
  background: linear-gradient(135deg, #1a1a3e, #2a2a5e);
  border: 2px solid var(--border-color);
}
.poker-front .card-back-pattern {
  width: 80%;
  height: 80%;
  border: 1px solid rgba(102, 126, 234, 0.3);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(102, 126, 234, 0.05) 5px, rgba(102, 126, 234, 0.05) 10px);
}
.poker-front .card-back-pattern span {
  font-size: 1.8rem;
  opacity: 0.5;
}
.poker-back {
  background: linear-gradient(135deg, rgba(102, 126, 234, 0.15), rgba(240, 147, 251, 0.15));
  border: 2px solid var(--purple);
  transform: rotateY(180deg);
  gap: 8px;
}
.poker-back .poker-idx {
  font-family: var(--font-code);
  font-size: 0.7rem;
  color: var(--text-muted);
}
.poker-back .poker-name {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--text-primary);
}
.poker-back .poker-weight {
  font-family: var(--font-code);
  font-size: 0.75rem;
  color: var(--pink);
}
.poker-card.selected .poker-back {
  border-color: var(--pink);
  background: linear-gradient(135deg, rgba(240, 147, 251, 0.2), rgba(102, 126, 234, 0.2));
}

/* ===== Progress Bar ===== */
.progress-wrap {
  margin: 20px 0;
  display: none;
}
.progress-wrap.active { display: block; }
.progress-bar-outer {
  width: 100%;
  height: 12px;
  background: rgba(20, 20, 50, 0.8);
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 10px;
}
.progress-bar-inner {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--purple), var(--pink), var(--blue));
  border-radius: 6px;
  transition: width 0.5s ease;
  box-shadow: 0 0 10px var(--glow-pink);
}
.progress-text {
  font-family: var(--font-code);
  font-size: 0.8rem;
  color: var(--text-secondary);
  text-align: center;
}
.progress-step {
  font-family: var(--font-code);
  font-size: 0.75rem;
  color: var(--pink);
  margin-top: 4px;
  text-align: center;
}

/* Run Button */
.run-btn {
  display: block;
  width: 100%;
  font-family: var(--font-code);
  font-size: 1rem;
  padding: 14px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  cursor: pointer;
  transition: var(--transition);
  letter-spacing: 2px;
  margin-top: 16px;
}
.run-btn:hover {
  box-shadow: 0 4px 20px rgba(240, 147, 251, 0.4);
  transform: translateY(-1px);
}
.run-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* Confirm Button */
.confirm-btn {
  display: block;
  width: 100%;
  font-family: var(--font-code);
  font-size: 0.95rem;
  padding: 14px;
  background: linear-gradient(135deg, var(--success), #00c853);
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  cursor: pointer;
  transition: var(--transition);
  letter-spacing: 2px;
  margin-top: 12px;
}
.confirm-btn:hover {
  box-shadow: 0 4px 20px rgba(0, 230, 118, 0.4);
  transform: translateY(-1px);
}

/* Reject Button */
.reject-btn {
  display: block;
  width: 100%;
  font-family: var(--font-code);
  font-size: 0.9rem;
  padding: 12px;
  background: linear-gradient(135deg, var(--warn), #ff6e40);
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  cursor: pointer;
  transition: var(--transition);
  letter-spacing: 1px;
  margin-top: 10px;
}
.reject-btn:hover {
  box-shadow: 0 4px 20px rgba(255, 171, 64, 0.4);
  transform: translateY(-1px);
}

.reset-btn {
  display: block;
  width: 100%;
  font-family: var(--font-code);
  font-size: 0.85rem;
  padding: 10px;
  background: none;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  margin-top: 8px;
}
.reset-btn:hover {
  border-color: var(--text-secondary);
  color: var(--text-primary);
}

/* ===== AI Analysis ===== */
#analysis-result { display: none; }
#analysis-result.active { display: block; }

.analysis-badge {
  display: inline-block;
  font-family: var(--font-code);
  font-size: 0.8rem;
  padding: 4px 16px;
  border-radius: 50px;
  margin-bottom: 16px;
  font-weight: 700;
}
.analysis-badge.high { background: rgba(0, 230, 118, 0.15); color: var(--success); border: 1px solid rgba(0, 230, 118, 0.3); }
.analysis-badge.medium { background: rgba(255, 171, 64, 0.15); color: var(--warn); border: 1px solid rgba(255, 171, 64, 0.3); }
.analysis-badge.low { background: rgba(255, 82, 82, 0.15); color: var(--error); border: 1px solid rgba(255, 82, 82, 0.3); }

.analysis-section {
  margin-bottom: 16px;
}
.analysis-section-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--blue);
  margin-bottom: 6px;
}
.analysis-section-content {
  font-size: 0.85rem;
  color: var(--text-secondary);
  line-height: 1.7;
  padding-left: 12px;
  border-left: 2px solid var(--border-color);
}

.confidence-bar {
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.confidence-label {
  font-family: var(--font-code);
  font-size: 0.75rem;
  color: var(--text-secondary);
  min-width: 60px;
}
.confidence-track {
  flex: 1;
  height: 8px;
  background: rgba(20, 20, 50, 0.8);
  border-radius: 4px;
  overflow: hidden;
}
.confidence-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 1s ease;
}
.confidence-fill.high { background: linear-gradient(90deg, var(--purple), var(--success)); }
.confidence-fill.medium { background: linear-gradient(90deg, var(--purple), var(--warn)); }
.confidence-fill.low { background: linear-gradient(90deg, var(--purple), var(--error)); }
.confidence-value {
  font-family: var(--font-code);
  font-size: 0.8rem;
  font-weight: 700;
  min-width: 36px;
  text-align: right;
}

/* Pros and Cons */
.pros-cons-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 500px) {
  .pros-cons-grid { grid-template-columns: 1fr; }
}
.pros-list, .cons-list { list-style: none; }
.pros-list li, .cons-list li {
  font-size: 0.82rem;
  padding: 6px 0;
  padding-left: 16px;
  position: relative;
}

function initMatrixRain() {
  const canvas = document.getElementById('matrix-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン01234567890ABCDEF';
  const fontSize = 14;
  const columns = Math.floor(canvas.width / fontSize);
  const drops = Array.from({ length: columns }, () => Math.random() * -100);

  function draw() {
    ctx.fillStyle = 'rgba(10, 10, 26, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(102, 126, 234, 0.25)';
    ctx.font = fontSize + 'px JetBrains Mono, monospace';

    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
    requestAnimationFrame(draw);
  }
  draw();

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
}

// ============================================================
// PARTICLES
// ============================================================
function initParticles() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const particles = [];
  const count = 40;
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5,
      r: Math.random() * 2 + 1,
      alpha: Math.random() * 0.4 + 0.1
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;

      ctx.beginPath();
      const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
      gradient.addColorStop(0, `rgba(102, 126, 234, ${p.alpha})`);
      gradient.addColorStop(0.5, `rgba(240, 147, 251, ${p.alpha * 0.5})`);
      gradient.addColorStop(1, 'transparent');
      ctx.fillStyle = gradient;
      ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
      ctx.fill();
    });

    // Connect nearby particles
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 150) {
          ctx.beginPath();
          ctx.strokeStyle = `rgba(102, 126, 234, ${0.06 * (1 - dist / 150)})`;
          ctx.lineWidth = 0.5;
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
}

  if (state.options.length >= 10) {

  renderPokerCards();

async function runDecision() {
  if (state.isRunning) return;
  if (state.options.length < 2) {
    addLog('error', '至少需要 2 个选项才能运行决策');
    return;
  }
  state.isRunning = true;
  state.selectedOption = null;
  const runBtn = document.getElementById('run-btn');
  runBtn.disabled = true;
  document.getElementById('confirm-btn').style.display = 'none';
  document.getElementById('reset-btn').style.display = 'none';
  hideAnalysis();

  // Reset poker cards
  renderPokerCards();

  // Show progress
  const progressWrap = document.getElementById('progress-wrap');
  const progressBar = document.getElementById('progress-bar');
  const progressText = document.getElementById('progress-text');
  const progressStep = document.getElementById('progress-step');
  progressWrap.classList.add('active');
  progressBar.style.width = '0%';
  progressText.textContent = '准备中...';
  progressStep.textContent = '';

  addLog('info', '开始运行 SmartChoice 决策引擎...');

  // Animate progress
  for (let i = 0; i < PROGRESS_STEPS.length; i++) {
    const step = PROGRESS_STEPS[i];
    await sleep(600 + Math.random() * 400);
    progressBar.style.width = step.pct + '%';
    progressText.textContent = step.text;
    progressStep.textContent = step.step;
    const logType = step.pct === 100 ? 'success' : 'info';
    addLog(logType, step.text);
  }

  await sleep(500);

  // Calculate weighted random
  const weights = state.options.map(o => o.weight);
  const totalWeight = weights.reduce((a, b) => a + b, 0);
  let rand = Math.random() * totalWeight;
  let selectedIdx = 0;
  for (let i = 0; i < weights.length; i++) {
    rand -= weights[i];
    if (rand <= 0) {
      selectedIdx = i;
      break;
    }
  }

  state.selectedOption = selectedIdx;
  addLog('success', `决策结果：${state.options[selectedIdx].name}（权重 ${state.options[selectedIdx].weight.toFixed(1)}x）`);

  // Flip cards with delay
  for (let i = 0; i < state.options.length; i++) {
    await sleep(200);
    const card = document.getElementById('poker-' + i);
    if (card) card.classList.add('flipped');
  }

  await sleep(300);

  // Highlight selected
  const selectedCard = document.getElementById('poker-' + selectedIdx);
  if (selectedCard) selectedCard.classList.add('selected');

  await sleep(300);

  // Show analysis
  showAnalysis(selectedIdx);

  // Show confirm button
  document.getElementById('confirm-btn').style.display = 'block';
  document.getElementById('reject-btn').style.display = 'block';
  document.getElementById('reset-btn').style.display = 'block';

  state.isRunning = false;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// ============================================================
// AI ANALYSIS
// ============================================================
function showAnalysis(idx) {
  const opt = state.options[idx];
  const allWeights = state.options.map(o => o.weight);
  const maxWeight = Math.max(...allWeights);
  const minWeight = Math.min(...allWeights);
  const weightRange = maxWeight - minWeight;

  // Determine level based on weight difference and reasons
  let level;
  const scoreDiff = weightRange;
  const negReasons = opt.reasons.filter(r => r.type === 'negative').length;
  const posReasons = opt.reasons.filter(r => r.type === 'positive').length;

  if (scoreDiff > 1.5 || (posReasons >= 2 && negReasons <= 1)) {
    level = 'high';
  } else if (scoreDiff > 0.5 || posReasons >= negReasons) {
    level = 'medium';
  } else {
    level = 'low';
  }

  // Select template based on scene
  const sceneKey = state.currentScene === 'interview' ? 'interview' : 
                   state.currentScene === 'career' ? 'career' : 'default';
  const template = ANALYSIS_TEMPLATES[sceneKey][level];
  const confidence = template.confidence();

  // Generate pros and cons
  const pros = opt.reasons.filter(r => r.type === 'positive').map(r => r.text);
  const cons = opt.reasons.filter(r => r.type === 'negative').map(r => r.text);
  const neutrals = opt.reasons.filter(r => r.type === 'neutral').map(r => r.text);

  // If no reasons, generate some based on name
  if (pros.length === 0) pros.push(`${opt.name} 的优势在于它能满足当前需求`);
  if (cons.length === 0) cons.push('可能需要付出一定的时间或精力成本');
  if (neutrals.length === 0) neutrals.push('最终效果取决于执行力和外部环境');

  const scoreValue = Math.floor((opt.weight / allWeights.reduce((a, b) => a + b, 0) / allWeights.length) * 60 + 40);
  const clampedScore = Math.min(99, Math.max(50, scoreValue));

  const content = document.getElementById('analysis-content');
  content.innerHTML = `
    <div class="analysis-badge ${level}">${template.badge}</div>

    <div class="analysis-section">
      <div class="analysis-section-title">综合分析</div>
      <div class="analysis-section-content">${template.analysis(opt.name, state.options.length)}</div>
    </div>

    <div class="analysis-section">
      <div class="analysis-section-title">深度分析</div>
      <div class="analysis-section-content">${template.deepAnalysis(opt.name, opt.reasons).replace(/\n/g, '<br>')}</div>
    </div>

    <div class="pros-cons-grid">
      <div>
        <div class="analysis-section-title" style="color:var(--success);">优点</div>
        <ul class="pros-list">${pros.map(p => `<li>${p}</li>`).join('')}</ul>
      </div>
      <div>
        <div class="analysis-section-title" style="color:var(--error);">缺点</div>
        <ul class="cons-list">${cons.map(c => `<li>${c}</li>`).join('')}</ul>
      </div>
    </div>

    <div class="recommend-index">
      <div class="recommend-score">${clampedScore}</div>
      <div>
        <div style="font-size:0.9rem;font-weight:700;color:var(--text-primary);">推荐指数</div>
        <div style="font-size:0.78rem;color:var(--text-secondary);">基于加权评分和纠结原因综合计算</div>
      </div>
    </div>

    <div class="confidence-bar">
      <span class="confidence-label">置信度</span>
      <div class="confidence-track">
        <div class="confidence-fill ${level}" id="confidence-fill" style="width:0%;"></div>
      </div>
      <span class="confidence-value" style="color:${level === 'high' ? 'var(--success)' : level === 'medium' ? 'var(--warn)' : 'var(--error)'}">${confidence}%</span>
    </div>

    <div class="analysis-section" style="margin-top:16px;">
      <div class="analysis-section-title">综合建议</div>
      <div class="analysis-section-content">${template.conclusion(opt.name)}</div>
    </div>
  `;

  const resultEl = document.getElementById('analysis-result');
  resultEl.classList.add('active');

  // Animate confidence bar
  setTimeout(() => {
    document.getElementById('confidence-fill').style.width = confidence + '%';
  }, 200);
}

function hideAnalysis() {
  document.getElementById('analysis-result').classList.remove('active');
}

// ============================================================
// CONFIRM CHOICE
// ============================================================
function confirmChoice() {
  if (state.selectedOption === null) return;
  const opt = state.options[state.selectedOption];
  const scene = SCENES.find(s => s.id === state.currentScene);

  // Add to history
  const record = {
    id: Date.now(),
    scene: scene ? scene.label : '通用决策',
    sceneId: state.currentScene,
    choice: opt.name,
    options: state.options.map(o => ({ name: o.name, weight: o.weight, reasons: o.reasons })),
    time: new Date().toLocaleString('zh-CN')
  };
  state.history.unshift(record);
  if (state.history.length > 50) state.history = state.history.slice(0, 50);
  localStorage.setItem('sc_history', JSON.stringify(state.history));

  // Show encouragement
  const encouragement = ENCOURAGEMENTS[Math.floor(Math.random() * ENCOURAGEMENTS.length)];
  const content = document.getElementById('analysis-content');
  content.innerHTML += `
    <div class="encouragement">${encouragement}</div>
  `;

  addLog('success', `已确认选择：${opt.name}`);
  document.getElementById('confirm-btn').style.display = 'none';
  document.getElementById('reject-btn').style.display = 'none';
  renderHistory();
}

// ============================================================
// REJECT AND REDRAW
// ============================================================
function rejectAndRedraw() {
  if (state.selectedOption === null || state.isRunning) return;
  const opt = state.options[state.selectedOption];
  const oldWeight = opt.weight;
  opt.weight = Math.max(0.1, opt.weight * 0.85);
  const weightReduction = ((oldWeight - opt.weight) / oldWeight * 100).toFixed(0);

  addLog('warn', `不满意「${opt.name}」，权重降低 ${weightReduction}%（${oldWeight.toFixed(1)}x → ${opt.weight.toFixed(1)}x），重新抽取中...`);

  state.selectedOption = null;
  hideAnalysis();
  document.getElementById('confirm-btn').style.display = 'none';
  document.getElementById('reject-btn').style.display = 'none';
  document.getElementById('reset-btn').style.display = 'none';
  renderOptions();
  renderPokerCards();

  setTimeout(() => {
    runDecision();
  }, 600);
}

// ============================================================
// RESET
// ============================================================
function resetDecision() {
  if (state.isRunning) return;
  state.selectedOption = null;
  renderPokerCards();
  hideAnalysis();
  document.getElementById('confirm-btn').style.display = 'none';
  document.getElementById('reject-btn').style.display = 'none';
  document.getElementById('reset-btn').style.display = 'none';
  document.getElementById('run-btn').style.display = 'block';
  document.getElementById('run-btn').disabled = false;
  document.getElementById('progress-wrap').classList.remove('active');
  addLog('info', '已重置，可以重新决策');
}

// ============================================================
// LOG
// ============================================================
function addLog(type, msg) {
  const area = document.getElementById('log-area');
  const now = new Date();
  const time = [now.getHours(), now.getMinutes(), now.getSeconds()].map(v => String(v).padStart(2, '0')).join(':');
  const tagLabels = { info: 'INFO', success: 'OK', warn: 'WARN', error: 'ERR' };
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `
    <span class="log-time">[${time}]</span>
    <span class="log-tag ${type}">${tagLabels[type] || 'INFO'}</span>
    <span class="log-msg">${msg}</span>
  `;
  area.appendChild(entry);
  area.scrollTop = area.scrollHeight;
}

// ============================================================
// HISTORY
// ============================================================
function renderHistory() {
  const list = document.getElementById('history-list');
  if (state.history.length === 0) {
    list.innerHTML = '<div class="history-empty">暂无决策记录，开始你的第一次决策吧</div>';
    return;
  }
  list.innerHTML = state.history.map(h => `
    <div class="history-item" onclick="loadHistory(${h.id})">
      <div class="history-scene">${h.scene}</div>
      <div class="history-result">选择了：${h.choice}</div>
      <div class="history-time">${h.time}</div>
    </div>
  `).join('');
}

function loadHistory(id) {
  const record = state.history.find(h => h.id === id);
  if (!record) return;
  addLog('info', `加载历史记录：${record.scene} - ${record.choice}`);
  // Simple visual feedback
}

// ============================================================
// DOWNLOAD REPORT
// ============================================================
function downloadReport() {
  if (state.history.length === 0) {
    addLog('warn', '没有可下载的决策记录');
    return;
  }

  let content = '===========================================\n';
  content += '  纠结GAME OVER - SmartChoice 决策报告\n';
  content += '  把纠结交给程序，把大脑还给生活\n';
  content += '===========================================\n\n';
  content += `生成时间：${new Date().toLocaleString('zh-CN')}\n`;
  content += `总决策数：${state.history.length}\n\n`;
  content += '-------------------------------------------\n\n';

  state.history.forEach((h, i) => {
    content += `【决策 #${i + 1}】\n`;
    content += `场景：${h.scene}\n`;
    content += `结果：选择了 "${h.choice}"\n`;
    content += `时间：${h.time}\n`;
    if (h.options) {
      content += `候选项：\n`;
      h.options.forEach(o => {
        content += `  - ${o.name}（权重 ${o.weight.toFixed(1)}x）`;
        if (o.reasons && o.reasons.length > 0) {
          content += ` [${o.reasons.map(r => r.type === 'positive' ? '+' : r.type === 'negative' ? '-' : '~' + r.text).join(', ')}]`;
        }
        content += '\n';
      });
    }
    content += '\n-------------------------------------------\n\n';
  });

  content += '\n创作背景：这个世界上没有人能了解我，包括我自己。但我可以选择不再让纠结消耗我。\n';

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `SmartChoice_决策报告_${new Date().toISOString().slice(0, 10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  addLog('success', '决策报告已下载');
}

// ============================================================
// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  initMatrixRain();
  initParticles();
  startTerminalAnimation();
});
</script>
</body>
</html>
