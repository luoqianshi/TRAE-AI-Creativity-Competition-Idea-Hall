<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>

        .coefficients-grid {

        .coefficient-item {

        .table-container {

        th, td {

        .chart-container {

    <!-- 内联的Chart.js -->
    <script>
    // 简化版图表绘制，不依赖外部Chart.js
    class SimpleChart {
        constructor(canvas, data) {
            this.canvas = canvas;
            this.ctx = canvas.getContext('2d');
            this.data = data;
            this.draw();
        }
        
        draw() {
            const ctx = this.ctx;
            const canvas = this.canvas;
            const data = this.data;
            
            // 清除画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 设置尺寸
            const padding = { top: 40, right: 40, bottom: 60, left: 60 };
            const width = canvas.width - padding.left - padding.right;
            const height = canvas.height - padding.top - padding.bottom;
            
            // 计算最大值和最小值
            const allValues = [...data.actual, ...data.predicted];
            const maxValue = Math.max(...allValues);
            const minValue = Math.min(...allValues);
            const range = maxValue - minValue || 1;
            
            // 绘制网格
            ctx.strokeStyle = '#e5e7eb';
            ctx.lineWidth = 1;
            
            // 水平网格
            for (let i = 0; i <= 5; i++) {
                const y = padding.top + (height * i / 5);
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(padding.left + width, y);
                ctx.stroke();
                
                // Y轴标签
                ctx.fillStyle = '#6b7280';
                ctx.font = '12px sans-serif';
                const value = maxValue - (range * i / 5);
                ctx.textAlign = 'right';
                ctx.fillText(value.toFixed(0), padding.left - 10, y + 4);
            }
            
            // 垂直网格
            const xStep = width / (data.actual.length - 1);
            for (let i = 0; i < data.actual.length; i++) {
                const x = padding.left + (i * xStep);
                ctx.beginPath();
                ctx.moveTo(x, padding.top);
                ctx.lineTo(x, padding.top + height);
                ctx.stroke();
                
                // X轴标签
                ctx.fillStyle = '#6b7280';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(i + 1, x, padding.top + height + 20);
            }
            
            // 绘制实际值
            ctx.strokeStyle = '#3b82f6';
            ctx.fillStyle = 'rgba(59, 130, 246, 0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            for (let i = 0; i < data.actual.length; i++) {
                const x = padding.left + (i * xStep);
                const y = padding.top + height - ((data.actual[i] - minValue) / range * height);
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
                
                // 绘制点
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            }
            ctx.stroke();
            
            // 绘制预测值
            ctx.strokeStyle = '#22c55e';
            ctx.fillStyle = 'rgba(34, 197, 94, 0.7)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            for (let i = 0; i < data.predicted.length; i++) {
                const x = padding.left + (i * xStep);
                const y = padding.top + height - ((data.predicted[i] - minValue) / range * height);
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
                
                // 绘制点
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            }
            ctx.stroke();
            
            // 绘制标题
            ctx.fillStyle = '#1f2937';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('真实值 vs 计算值', padding.left + width / 2, 20);
            
            // 绘制图例
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(padding.left, padding.top + height + 30, 15, 15);
            ctx.fillStyle = '#1f2937';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('真实值', padding.left + 20, padding.top + height + 42);
            
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(padding.left + 80, padding.top + height + 30, 15, 15);
            ctx.fillStyle = '#1f2937';
            ctx.fillText('计算值', padding.left + 100, padding.top + height + 42);
            
            // X轴标题
            ctx.fillStyle = '#6b7280';
            ctx.textAlign = 'center';
            ctx.fillText('数据点序号', padding.left + width / 2, padding.top + height + 55);
            
            // Y轴标题
            ctx.save();
            ctx.translate(15, padding.top + height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.textAlign = 'center';
            ctx.fillText('Lux值', 0, 0);
            ctx.restore();
        }
    }
    </script>
</head>
<body>
    <div class="container">
        <!-- 页面标题 -->
        <header class="header">
            <h1>Lux系数计算器</h1>
            <p>天易合芯，世界一流国产传感芯片！</p>
        </header>

        <!-- 主要内容区 -->
        <div class="main-grid">
            <!-- 左侧：数据输入区 -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">数据输入</h2>
                    <div class="button-group">
                        <button id="pasteExampleBtn" class="btn">📋 粘贴示例</button>
                        <button id="clearDataBtn" class="btn">🗑️ 清空</button>
                    </div>
                </div>
                
                <div class="input-section">
                    <label for="dataInput" class="input-label">请粘贴数据（格式：lux,als,clear,ir，每行一组数据，支持逗号或空格分隔）</label>
                    <textarea id="dataInput" rows="10" placeholder="例如:&#10;50,100,200,300&#10;100,200,400,600&#10;150,300,600,900"></textarea>
                </div>
                
                <div class="calculate-section">
                    <button id="calculateBtn" class="btn btn-primary">📊 计算系数</button>
                </div>
            </div>
            
            <!-- 右侧：结果展示区 -->
            <div class="card">
                <h2 class="card-title">计算结果</h2>
                
                <!-- 计算结果卡片 -->
                <div id="resultCard" class="result-card hidden">
                    <h3 class="result-title">回归系数</h3>
                    
                    <div class="coefficients-grid">
                        <div class="coefficient-item">
                            <div class="coefficient-label">系数 a</div>
                            <div id="coeffA" class="coefficient-value">0.00</div>
                        </div>
                        <div class="coefficient-item">
                            <div class="coefficient-label">系数 b</div>
                            <div id="coeffB" class="coefficient-value">0.00</div>
                        </div>
                        <div class="coefficient-item">
                            <div class="coefficient-label">系数 c</div>
                            <div id="coeffC" class="coefficient-value">0.00</div>
                        </div>
                    </div>
                    
                    <div class="equation">
                        <span id="equation">lux = a × als + b × clear + c × ir</span>
                    </div>
                </div>
                
                <!-- 数据预览表格 -->
                <div id="previewCard" class="preview-card hidden">
                    <h3 class="preview-title">数据预览</h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>序号</th>
                                    <th>Lux (真实值)</th>
                                    <th>Lux (计算值)</th>
                                    <th>误差 (%)</th>
                                    <th>ALS</th>
                                    <th>Clear</th>
                                    <th>IR</th>
                                </tr>
                            </thead>
                            <tbody id="previewTableBody">
                                <!-- 数据行将通过JavaScript动态生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>
                
                <!-- 可视化图表 -->
                <div id="chartCard" class="chart-card hidden">
                    <h3 class="chart-title">数据可视化</h3>
                    <div class="chart-container">
                        <canvas id="comparisonChart" width="600" height="250"></canvas>
                    </div>
                </div>
                
                <!-- 初始提示 -->
                <div id="initialPrompt" class="initial-prompt">
                    <div style="font-size: 3rem; margin-bottom: 16px;">⬅️</div>
                    <p>请在左侧输入数据并点击"计算系数"按钮</p>
                </div>
                
                <!-- 加载中提示 -->
                <div id="loadingIndicator" class="loading-indicator hidden">
                    <div class="spinner"></div>
                    <p>正在计算系数，请稍候...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
    // 示例数据
    const exampleData = `100,250,180,45
200,520,370,95
300,780,560,140
400,1050,750,190
500,1320,940,240
600,1580,1130,290
700,1850,1320,340
800,2120,1510,390
900,2380,1700,440
1000,2650,1890,490`;

    // DOM元素
    const dataInput = document.getElementById('dataInput');
    const calculateBtn = document.getElementById('calculateBtn');
    const pasteExampleBtn = document.getElementById('pasteExampleBtn');
    const clearDataBtn = document.getElementById('clearDataBtn');
    const resultCard = document.getElementById('resultCard');
    const previewCard = document.getElementById('previewCard');
    const chartCard = document.getElementById('chartCard');
    const initialPrompt = document.getElementById('initialPrompt');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const previewTableBody = document.getElementById('previewTableBody');
    const coeffA = document.getElementById('coeffA');
    const coeffB = document.getElementById('coeffB');
    const coeffC = document.getElementById('coeffC');
    const equation = document.getElementById('equation');
    const comparisonChart = document.getElementById('comparisonChart');

    // 全局图表实例
    let chart = null;

    // 粘贴示例数据
    pasteExampleBtn.addEventListener('click', () => {
        dataInput.value = exampleData;
        parseAndPreviewData();
    });

    // 清空数据
    clearDataBtn.addEventListener('click', () => {
        dataInput.value = '';
        hideAllResults();
    });

    // 计算按钮点击事件
    calculateBtn.addEventListener('click', () => {
        calculateCoefficients();
    });

    // 输入框内容变化时自动解析预览
    dataInput.addEventListener('input', debounce(parseAndPreviewData, 500));

    // 解析并预览数据
    function parseAndPreviewData() {
        const inputText = dataInput.value.trim();
        if (!inputText) {
            hideAllResults();
            return;
        }

        try {
            const data = parseInputData(inputText);
            if (data.length < 3) {
                showNotification('需要至少3组数据才能进行计算', 'warning');
                return;
            }
            
            displayDataPreview(data);
            previewCard.classList.remove('hidden');
            initialPrompt.classList.add('hidden');
        } catch (error) {
            showNotification('数据格式错误：' + error.message, 'error');
            hideAllResults();
        }
    }

    // 计算系数
    function calculateCoefficients() {
        const inputText = dataInput.value.trim();
        if (!inputText) {
            showNotification('请先输入数据', 'warning');
            return;
        }

        // 显示加载指示器
        showLoading();
        
        try {
            // 解析数据
            const data = parseInputData(inputText);
            
            if (data.length < 3) {
                showNotification('需要至少3组数据才能进行计算', 'warning');
                hideLoading();
                return;
            }
            
            // 模拟计算延迟，增强用户体验
            setTimeout(() => {
                try {
                    // 执行归一化和最小二乘法计算
                    const { coefficients, normalizedData, predictions, errors } = performRegression(data);
                    
                    // 更新系数显示
                    updateResults(coefficients, data, predictions, errors);
                    
                    // 绘制图表
                    drawChart(data.map(d => d.lux), predictions);
                    
                    // 显示结果
                    showAllResults();
                    hideLoading();
                    
                    showNotification('计算完成！', 'success');
                } catch (error) {
                    console.error('计算过程中出错:', error);
                    showNotification('计算错误：' + error.message, 'error');
                    hideLoading();
                }
            }, 800);
        } catch (error) {
            console.error('数据处理过程中出错:', error);
            showNotification('数据处理错误：' + error.message, 'error');
            hideLoading();
        }
    }

    // 解析输入数据
    function parseInputData(inputText) {
        const lines = inputText.trim().split('\n');
        const data = [];
        
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            
            // 支持逗号、空格或制表符分隔
            const values = line.split(/[\s,\t]+/).map(v => v.trim()).filter(v => v !== '');
            
            if (values.length < 4) {
                throw new Error(`第${i+1}行数据不完整，需要4个值（lux,als,clear,ir）`);
            }
            
            const [luxStr, alsStr, clearStr, irStr] = values;
            const lux = parseFloat(luxStr);
            const als = parseFloat(alsStr);
            const clear = parseFloat(clearStr);
            const ir = parseFloat(irStr);
            
            if (isNaN(lux) || isNaN(als) || isNaN(clear) || isNaN(ir)) {
                throw new Error(`第${i+1}行包含非数字值`);
            }
            
            if (lux < 0) {
                throw new Error(`第${i+1}行的lux值不能为负数`);
            }
            
            data.push({ lux, als, clear, ir });
        }
        
        if (data.length === 0) {
            throw new Error('未找到有效数据');
        }
        
        return data;
    }

    // 执行归一化和最小二乘法计算
    function performRegression(data) {
        // 归一化处理：将als、clear、ir除以对应的lux值（处理lux=0的情况）
        const normalizedData = data.map(item => {
            if (item.lux === 0) {
                // 当lux为0时，直接使用原始值作为归一化结果
                return {
                    lux: item.lux,
                    als: item.als,
                    clear: item.clear,
                    ir: item.ir
                };
            }
            return {
                lux: item.lux,
                als: item.als / item.lux,
                clear: item.clear / item.lux,
                ir: item.ir / item.lux
            };
        });
        
        // 构建矩阵 X 和向量 y
        // 对于每个数据点，X的一行是 [als, clear, ir]，y是 1（因为归一化后 lux/lux = 1）
        const X = normalizedData.map(item => [item.als, item.clear, item.ir]);
        const y = Array(normalizedData.length).fill(1);
        
        // 使用最小二乘法计算系数
        // 系数向量 β = (X^T * X)^(-1) * X^T * y
        const Xt = transpose(X);
        const XtX = multiplyMatrices(Xt, X);
        
        // 检查矩阵是否可逆
        const det = calculateDeterminant(XtX);
        let coefficients;
        
        if (Math.abs(det) < 1e-10) {
            // 矩阵接近奇异，使用岭回归（Ridge Regression）来处理
            console.warn('检测到数据线性相关，使用岭回归方法求解近似解');
            
            // 添加正则化参数λ（岭参数）
            const lambda = 1e-6;
            
            // 构造正则化矩阵 XtX + λI
            const XtXReg = XtX.map((row, i) => 
                row.map((val, j) => val + (i === j ? lambda : 0))
            );
            
            // 检查正则化后的矩阵是否可逆
            const regDet = calculateDeterminant(XtXReg);
            if (Math.abs(regDet) < 1e-10) {
                throw new Error('数据严重线性相关，即使使用正则化也无法求解。请尝试增加数据量或调整输入数据，确保各变量之间存在足够的差异性。');
            }
            
            const XtXRegInv = invertMatrix(XtXReg);
            const XtXRegInvXt = multiplyMatrices(XtXRegInv, Xt);
            coefficients = multiplyMatrices(XtXRegInvXt, y);
        } else {
            // 正常的最小二乘法求解
            const XtXInv = invertMatrix(XtX);
            const XtXInvXt = multiplyMatrices(XtXInv, Xt);
            coefficients = multiplyMatrices(XtXInvXt, y);
        }
        
        // 检查计算结果是否有效
        if (coefficients.some(coeff => isNaN(coeff) || !isFinite(coeff))) {
            throw new Error('计算结果包含无效值（NaN或无穷大），可能是由于数据问题导致。请尝试调整输入数据。');
        }
        
        // 计算预测值和误差
        const predictions = data.map((item, i) => {
            return coefficients[0] * item.als + coefficients[1] * item.clear + coefficients[2] * item.ir;
        });
        
        const errors = predictions.map((pred, i) => {
            if (data[i].lux === 0) {
                // 当lux为0时，误差直接为预测值（因为0作为分母无意义）
                return pred;
            }
            return (pred / data[i].lux) - 1;
        });
        
        return { coefficients, normalizedData, predictions, errors };
    }
    
    // 计算3x3矩阵的行列式
    function calculateDeterminant(matrix) {
        if (matrix.length !== 3 || matrix[0].length !== 3) {
            throw new Error('只能计算3x3矩阵的行列式');
        }
        
        const [
            [a, b, c],
            [d, e, f],
            [g, h, i]
        ] = matrix;
        
        return a*(e*i - f*h) - b*(d*i - f*g) + c*(d*h - e*g);
    }

    // 矩阵转置
    function transpose(matrix) {
        const result = [];
        for (let i = 0; i < matrix[0].length; i++) {
            result[i] = [];
            for (let j = 0; j < matrix.length; j++) {
                result[i][j] = matrix[j][i];
            }
        }
        return result;
    }

    // 矩阵乘法
    function multiplyMatrices(A, B) {
        // 如果B是向量
        if (typeof B[0] === 'number') {
            const result = [];
            for (let i = 0; i < A.length; i++) {
                let sum = 0;
                for (let j = 0; j < A[i].length; j++) {
                    sum += A[i][j] * B[j];
                }
                result.push(sum);
            }
            return result;
        }
        
        // 如果B是矩阵
        const result = [];
        for (let i = 0; i < A.length; i++) {
            result[i] = [];
            for (let j = 0; j < B[0].length; j++) {
                let sum = 0;
                for (let k = 0; k < A[i].length; k++) {
                    sum += A[i][k] * B[k][j];
                }
                result[i][j] = sum;
            }
        }
        return result;
    }

    // 3x3矩阵求逆
    function invertMatrix(matrix) {
        // 只处理3x3矩阵
        if (matrix.length !== 3 || matrix[0].length !== 3) {
            throw new Error('只能计算3x3矩阵的逆');
        }
        
        const [
            [a, b, c],
            [d, e, f],
            [g, h, i]
        ] = matrix;
        
        // 计算行列式
        const det = calculateDeterminant(matrix);
        
        if (Math.abs(det) < 1e-10) {
            throw new Error('矩阵不可逆，可能是由于数据线性相关');
        }
        
        // 计算伴随矩阵
        const adjugate = [
            [e*i - f*h, c*h - b*i, b*f - c*e],
            [f*g - d*i, a*i - c*g, c*d - a*f],
            [d*h - e*g, b*g - a*h, a*e - b*d]
        ];
        
        // 逆矩阵 = 伴随矩阵 / 行列式
        const inverse = adjugate.map(row => row.map(val => val / det));
        
        return inverse;
    }

    // 显示数据预览
    function displayDataPreview(data) {
        previewTableBody.innerHTML = '';
        
        // 限制显示前10行数据
        const displayData = data.slice(0, 10);
        
        displayData.forEach((item, index) => {
            const row = document.createElement('tr');
            
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${Math.round(item.lux)}</td>
                <td>-</td>
                <td>-</td>
                <td>${Math.round(item.als)}</td>
                <td>${Math.round(item.clear)}</td>
                <td>${Math.round(item.ir)}</td>
            `;
            
            previewTableBody.appendChild(row);
        });
        
        // 如果数据超过10行，添加提示
        if (data.length > 10) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td colspan="7" style="text-align: center; color: #6b7280;">
                    显示前10行，共${data.length}行数据
                </td>
            `;
            previewTableBody.appendChild(row);
        }
    }

    // 更新结果显示
    function updateResults(coefficients, data, predictions, errors) {
        // 更新系数
        coeffA.textContent = coefficients[0].toFixed(6);
        coeffB.textContent = coefficients[1].toFixed(6);
        coeffC.textContent = coefficients[2].toFixed(6);
        
        // 更新方程
        equation.textContent = `lux = ${coefficients[0].toFixed(4)} × als + ${coefficients[1].toFixed(4)} × clear + ${coefficients[2].toFixed(4)} × ir`;
        
        // 更新数据预览表格中的计算值和误差
        const rows = previewTableBody.querySelectorAll('tr');
        const displayData = data.slice(0, 10);
        
        // 找到误差绝对值最大的索引
        let maxErrorIndex = -1;
        let maxErrorValue = 0;
        displayData.forEach((item, index) => {
            let errorAbs;
            if (item.lux === 0) {
                errorAbs = Math.abs(errors[index]);
            } else {
                errorAbs = Math.abs(errors[index] * 100);
            }
            if (errorAbs > maxErrorValue) {
                maxErrorValue = errorAbs;
                maxErrorIndex = index;
            }
        });
        
        displayData.forEach((item, index) => {
            if (rows[index]) {
                const cells = rows[index].querySelectorAll('td');
                cells[2].textContent = Math.round(predictions[index]);
                
                // 先设置误差值
                if (item.lux === 0) {
                    cells[3].textContent = Math.round(errors[index]);
                } else {
                    const errorPercent = errors[index] * 100;
                    cells[3].textContent = errorPercent.toFixed(2) + '%';
                }
                
                // 只有最大误差用error-large类（有跳动效果）
                if (index === maxErrorIndex) {
                    cells[3].className = 'error-large';
                } else {
                    // 其他误差用普通颜色，没有跳动
                    if (item.lux !== 0) {
                        const errorPercent = errors[index] * 100;
                        if (Math.abs(errorPercent) >= 5) {
                            cells[3].style.color = '#ef4444';
                        } else if (Math.abs(errorPercent) >= 1) {
                            cells[3].style.color = '#f59e0b';
                        } else {
                            cells[3].style.color = '#22c55e';
                        }
                    }
                    cells[3].className = 'error-small';
                }
            }
        });
    }

    // 绘制图表
    function drawChart(actual, predicted) {
        // 确保canvas尺寸正确
        comparisonChart.width = 600;
        comparisonChart.height = 250;
        
        // 创建新图表
        chart = new SimpleChart(comparisonChart, {
            actual: actual,
            predicted: predicted
        });
    }

    // 显示所有结果
    function showAllResults() {
        resultCard.classList.remove('hidden');
        previewCard.classList.remove('hidden');
        chartCard.classList.remove('hidden');
        initialPrompt.classList.add('hidden');
    }

    // 隐藏所有结果
    function hideAllResults() {
        resultCard.classList.add('hidden');
        previewCard.classList.add('hidden');
        chartCard.classList.add('hidden');
        initialPrompt.classList.remove('hidden');
    }

    // 显示加载指示器
    function showLoading() {
        loadingIndicator.classList.remove('hidden');
        initialPrompt.classList.add('hidden');
        resultCard.classList.add('hidden');
        previewCard.classList.add('hidden');
        chartCard.classList.add('hidden');
    }

    // 隐藏加载指示器
    function hideLoading() {
        loadingIndicator.classList.add('hidden');
    }

    // 显示通知
    function showNotification(message, type = 'info') {
        // 创建通知元素
        const notification = document.createElement('div');
        
        // 设置样式和内容
        let bgClass = 'notification-info';
        let icon = 'ℹ️';
        switch (type) {
            case 'success':
                bgClass = 'notification-success';
                icon = '✅';
                break;
            case 'error':
                bgClass = 'notification-error';
                icon = '❌';
                break;
            case 'warning':
                bgClass = 'notification-warning';
                icon = '⚠️';
                break;
        }
        
        notification.className = `notification ${bgClass}`;
        notification.innerHTML = `
            <span>${icon}</span>
            <span>${message}</span>
        `;
        
        // 添加到页面
        document.body.appendChild(notification);
        
        // 显示通知
        setTimeout(() => {
            notification.classList.add('show');
        }, 10);
        
        // 自动隐藏
        setTimeout(() => {
            notification.classList.remove('show');
            
            // 移除元素
            setTimeout(() => {
                document.body.removeChild(notification);
            }, 300);
        }, 3000);
    }

    // 防抖函数
    function debounce(func, wait) {
        let timeout;
        return function() {
            const context = this;
            const args = arguments;
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                func.apply(context, args);
            }, wait);
        };
    }
