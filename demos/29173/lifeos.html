<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>LifeOS - 人生操作系统</title>
    <style>
        body{
            font-family:-apple-system,BlinkMacSystemFont,sans-serif;
            background:#0f172a;
            color:white;
            margin:0;
        }

        .hero{
            height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
        }

        h1{
            font-size:72px;
            margin:0;
        }

        .subtitle{
            font-size:24px;
            opacity:.8;
        }

        .section{
            max-width:1200px;
            margin:auto;
            padding:80px 20px;
        }

        .card{
            background:#1e293b;
            padding:24px;
            border-radius:16px;
            margin:20px 0;
        }

        .flow{
            font-size:24px;
            text-align:center;
            line-height:2;
        }
    </style>
</head>
<body>

<div class="hero">
    <h1>LifeOS</h1>
    <p class="subtitle">
        让人生变成可检索、可迁移、可对话的数字记忆库
    </p>
</div>

<div class="section">

    <div class="card">
        <h2>问题</h2>
        <p>
            我们记录了无数数据，
            却无法真正保存自己的记忆。
        </p>
    </div>

    <div class="card">
        <h2>解决方案</h2>

        <div class="flow">
            写日记<br>
            ↓<br>
            AI理解内容<br>
            ↓<br>
            结构化记忆<br>
            ↓<br>
            本地向量库<br>
            ↓<br>
            人生知识图谱<br>
            ↓<br>
            数字人格
        </div>
    </div>

    <div class="card">
        <h2>核心能力</h2>

        <ul>
            <li>AI日记</li>
            <li>长期记忆</li>
            <li>人生检索</li>
            <li>知识图谱</li>
            <li>数字分身</li>
            <li>数字遗产</li>
        </ul>
    </div>

    <div class="card">
        <h2>未来愿景</h2>

        <p>
            每个人都拥有属于自己的数字生命档案。
        </p>

        <p>
            AI不会替代你，
            而是帮助你保存和理解自己的一生。
        </p>
    </div>

</div>

</body>
</html>
