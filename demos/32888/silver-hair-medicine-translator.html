    </section>

    <!-- Voice Button -->
    <section class="voice-section">
      <button class="voice-btn" id="voiceBtn" onclick="handleVoiceClick()">
        <div class="voice-icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </div>
        <span>语音播报</span>
        <div class="sound-waves">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </button>
    </section>

    <!-- Calendar Section -->
    <section class="calendar-section">
      <div class="section-title">
        <span class="title-icon">&#128197;</span>
        用药打卡日历
      </div>

      <div class="calendar-header">
        <button class="nav-btn" onclick="changeMonth(-1)">&#8249;</button>
        <span class="month-label" id="monthLabel"></span>
        <button class="nav-btn" onclick="changeMonth(1)">&#8250;</button>
      </div>

      <div class="calendar-weekdays">
        <div class="weekday">日</div>
        <div class="weekday">一</div>
        <div class="weekday">二</div>
        <div class="weekday">三</div>
        <div class="weekday">四</div>
        <div class="weekday">五</div>
        <div class="weekday">六</div>
      </div>

      <div class="calendar-days" id="calendarDays"></div>

      <div class="stats-bar">
        <div class="stat-item">
          <div class="stat-number" id="checkedCount">0</div>
          <div class="stat-label">已打卡天数</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="streakCount">0</div>
          <div class="stat-label">连续打卡</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="totalDays">0</div>
          <div class="stat-label">本月天数</div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <p>用 <span class="heart">&#10084;&#65039;</span> 为爸妈设计的智能用药助手</p>
      <p style="margin-top:0.5rem;font-size:0.85rem;">银发药盒翻译官 · TRAE AI 创造力大赛</p>
    </footer>

  </div>

  <script>
    // === Toast ===
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    // === Camera Click ===
    function handleCameraClick() {
      var btn = document.getElementById('cameraBtn');
      btn.style.transform = 'scale(0.95)';
      setTimeout(function() { btn.style.transform = ''; }, 200);

      var card = document.getElementById('resultCard');
      card.style.animation = 'none';
      card.offsetHeight; // trigger reflow
      card.style.animation = 'fadeInUp 0.6s ease both';

      showToast('&#128247; 正在识别药品，请稍候...');
      setTimeout(function() {
        showToast('&#9989; 识别成功！请查看下方结果');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 1500);
    }

    // === Voice Click ===
    var isSpeaking = false;
    function handleVoiceClick() {
      var btn = document.getElementById('voiceBtn');
      if (!isSpeaking) {
        btn.classList.add('speaking');
        isSpeaking = true;
        showToast('&#128266; 正在为您播报用药说明...');

        // Use Web Speech API if available
        if ('speechSynthesis' in window) {
          var utterance = new SpeechSynthesisUtterance(
            '阿莫西林胶囊。大白话翻译：一天吃3次，每次吃1粒，饭后吃效果更好，注意多喝水。温馨提醒：如果您对青霉素过敏，请千万不要吃这个药！'
          );
          utterance.lang = 'zh-CN';
          utterance.rate = 0.85;
          utterance.pitch = 1;
          utterance.onend = function() {
            btn.classList.remove('speaking');
            isSpeaking = false;
          };
          speechSynthesis.speak(utterance);
        } else {
          // Fallback: simulate
          setTimeout(function() {
            btn.classList.remove('speaking');
            isSpeaking = false;
          }, 8000);
        }
      } else {
        btn.classList.remove('speaking');
        isSpeaking = false;
        if ('speechSynthesis' in window) {
          speechSynthesis.cancel();
        }
        showToast('&#128266; 已停止播报');
      }
    }

    // === Calendar ===
    var currentYear = 2026;
    var currentMonth = 5; // June (0-indexed)
    var checkedDays = {};

    // Pre-populate some checked days for demo
    var today = new Date();
    currentYear = today.getFullYear();
    currentMonth = today.getMonth();
    for (var i = 1; i < today.getDate(); i++) {
      checkedDays[currentYear + '-' + currentMonth + '-' + i] = true;
    }

    function renderCalendar() {
      var label = document.getElementById('monthLabel');
      var container = document.getElementById('calendarDays');
      var monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
      label.textContent = currentYear + '年 ' + monthNames[currentMonth];

      var firstDay = new Date(currentYear, currentMonth, 1).getDay();
      var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      var todayDate = new Date();
      var isCurrentMonth = (todayDate.getFullYear() === currentYear && todayDate.getMonth() === currentMonth);

      var html = '';

      // Empty cells
      for (var e = 0; e < firstDay; e++) {
        html += '<div class="day empty"></div>';
      }

      // Day cells
      for (var d = 1; d <= daysInMonth; d++) {
        var key = currentYear + '-' + currentMonth + '-' + d;
        var classes = 'day';
        if (isCurrentMonth && d === todayDate.getDate()) classes += ' today';
        if (checkedDays[key]) classes += ' checked';
        if (isCurrentMonth && d > todayDate.getDate()) classes += ' future';

        html += '<div class="' + classes + '" onclick="toggleDay(' + d + ')" data-day="' + d + '">';
        html += '<span>' + d + '</span>';
        html += '<span class="check-mark">&#10003;</span>';
        html += '</div>';
      }

      container.innerHTML = html;
      updateStats(daysInMonth);
    }

    function toggleDay(day) {
      var todayDate = new Date();
      var isCurrentMonth = (todayDate.getFullYear() === currentYear && todayDate.getMonth() === currentMonth);

      // Don't allow checking future days
      if (isCurrentMonth && day > todayDate.getDate()) return;

      var key = currentYear + '-' + currentMonth + '-' + day;
      if (checkedDays[key]) {
        delete checkedDays[key];
        showToast('已取消 ' + day + ' 日的打卡');
      } else {
        checkedDays[key] = true;
        showToast('&#9989; ' + day + '日 打卡成功！');
      }
      renderCalendar();
    }

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar();
    }

    function updateStats(daysInMonth) {
      var count = 0;
      var streak = 0;
      var todayDate = new Date();
      var isCurrentMonth = (todayDate.getFullYear() === currentYear && todayDate.getMonth() === currentMonth);

      for (var d = 1; d <= daysInMonth; d++) {
        var key = currentYear + '-' + currentMonth + '-' + d;
        if (checkedDays[key]) {
          count++;
          if (isCurrentMonth && d <= todayDate.getDate()) {
            streak++;
          }
        }
      }

      document.getElementById('checkedCount').textContent = count;
      document.getElementById('streakCount').textContent = streak;
      document.getElementById('totalDays').textContent = isCurrentMonth ? todayDate.getDate() : daysInMonth;
    }

    // Initialize calendar
    renderCalendar();
  </script>

</body>
</html>
