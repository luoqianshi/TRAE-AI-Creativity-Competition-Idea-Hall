<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手语译视 - 手语翻译器原型</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: white; border-radius: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.08); width: 380px; padding: 32px 24px; }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 22px; color: #1a202c; }
        .header p { font-size: 13px; color: #718096; margin-top: 6px; }
        .camera-box { background: #e2e8f0; border-radius: 16px; height: 220px; display: flex; align-items: center; justify-content: center; color: #a0aec0; flex-direction: column; gap: 8px; margin-bottom: 20px; position: relative; }
        .camera-box .cam-icon { font-size: 48px; }
        .camera-box .status { font-size: 14px; font-weight: 500; }
        .result-area { background: #edf2f7; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .label { font-size: 12px; color: #4a5568; font-weight: 600; margin-bottom: 6px; }
        .text-output { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; min-height: 48px; font-size: 16px; color: #2d3748; word-break: break-word; }
        .control-row { display: flex; gap: 12px; }
        .btn { flex: 1; background: #3182ce; color: white; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.96); }
        .btn.secondary { background: #718096; }
        .btn.voice { background: #38a169; }
        .footer { margin-top: 24px; text-align: center; font-size: 12px; color: #a0aec0; }
        .badge { display: inline-block; background: #ebf4ff; color: #3182ce; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="badge">🏆 学习工作赛道 · 附加公益</div>
            <h1>手语译视</h1>
            <p>手语 → 文字/语音 实时翻译</p>
        </div>
 
        <div class="camera-box">
            <div class="cam-icon">📹</div>
            <div class="status">等待开始识别...</div>
            <div style="font-size:12px; color:#718096;">（模拟摄像头画面）</div>
        </div>
 
        <div class="result-area">
            <div class="label">✍️ 手语翻译结果（文字）</div>
            <div class="text-output" id="translated">—</div>
        </div>
 
        <div class="control-row">
            <button class="btn" id="startBtn">▶ 开始识别手语</button>
            <button class="btn secondary" id="clearBtn">🗑 清空</button>
            <button class="btn voice" id="voiceBtn">🔊 语音播报结果</button>
        </div>
 
        <div class="footer">
            ⚡ 延迟 &lt; 500ms · 支持常见手语词汇 · 离线可用
        </div>
    </div>
 
    <script>
        const statusEl = document.querySelector('.status');
        const translatedEl = document.getElementById('translated');
 
        // 模拟手语识别进度
        function simulateRecognition() {
            const phases = [
                { msg: '正在捕捉手语...', result: '' },
                { msg: '手语分析中...', result: '' },
                { msg: '翻译完成！', result: '我要挂一个耳鼻喉科的号。' }
            ];
 
            let step = 0;
            statusEl.textContent = phases[0].msg;
            translatedEl.textContent = '...';
 
            const interval = setInterval(() => {
                step++;
                if (step >= phases.length) {
                    clearInterval(interval);
                    statusEl.textContent = '等待开始识别...';
                    return;
                }
                statusEl.textContent = phases[step].msg;
                if (phases[step].result) {
                    translatedEl.textContent = phases[step].result;
                } else {
                    translatedEl.textContent = '...';
                }
            }, 800);
        }
 
        document.getElementById('startBtn').addEventListener('click', function() {
            simulateRecognition();
        });
 
        document.getElementById('clearBtn').addEventListener('click', function() {
            translatedEl.textContent = '—';
            statusEl.textContent = '等待开始识别...';
        });
 
        document.getElementById('voiceBtn').addEventListener('click', function() {
            const text = translatedEl.textContent;
            if (text && text !== '—' && text !== '...') {
                alert('🔊 语音播报：“' + text + '”');
            } else {
                alert('请先识别手语，获取有效内容。');
            }
        });
    </script>
</body>
</html>
