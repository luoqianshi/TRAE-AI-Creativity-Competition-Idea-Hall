<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星眸 - AI品测师</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-color: #10b981; --primary-light: #34d399; --primary-dark: #059669;
            --secondary-color: #6366f1; --accent-color: #f59e0b;
            --bg-color: #f8fafc; --card-bg: #ffffff;
            --text-primary: #1e293b; --text-secondary: #64748b; --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-primary); line-height: 1.6;
        }
        .app { min-height: 100vh; display: flex; flex-direction: column; }
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white; padding: 1.5rem; box-shadow: var(--shadow-md);
        }
        .logo { display: flex; align-items: center; gap: 1rem; }
        .logo-icon { font-size: 2.5rem; }
        .logo-text h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.25rem; }
        .logo-text p { font-size: 0.9rem; opacity: 0.9; }
        .main-content { flex: 1; max-width: 1200px; margin: 0 auto; padding: 2rem; width: 100%; }
        .section {
            background: var(--card-bg); border-radius: 1rem; padding: 2rem;
            box-shadow: var(--shadow-sm); margin-bottom: 2rem;
        }
        .section.hidden { display: none; }
        .section-header { text-align: center; margin-bottom: 2rem; }
        .section-header h2 { font-size: 1.5rem; color: var(--text-primary); margin-bottom: 0.5rem; }
        .section-header p { color: var(--text-secondary); }
        .input-form { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-primary); }
        .form-group select, .form-group textarea {
            width: 100%; padding: 0.75rem; border: 2px solid var(--border-color);
            border-radius: 0.5rem; font-size: 1rem; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            padding: 0.75rem 1.5rem; border: none; border-radius: 0.5rem;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .btn-secondary {
            background: var(--card-bg); color: var(--text-primary);
            border: 2px solid var(--border-color);
        }
        .btn-secondary:hover { border-color: var(--primary-color); color: var(--primary-color); }
        .btn-icon { font-size: 1.25rem; }
        .features-preview {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem; margin-top: 3rem;
        }
        .feature-card {
            text-align: center; padding: 1.5rem; background: var(--bg-color);
            border-radius: 0.75rem;
        }
        .feature-icon { font-size: 2.5rem; margin-bottom: 1rem; }
        .feature-card h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
        .feature-card p { font-size: 0.9rem; color: var(--text-secondary); }
        .loading-container { text-align: center; padding: 4rem 2rem; }
        .loading-spinner {
            width: 60px; height: 60px; border: 4px solid var(--border-color);
            border-top-color: var(--primary-color); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 2rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-container h3 { font-size: 1.25rem; margin-bottom: 0.5rem; }
        .loading-container p { color: var(--text-secondary); margin-bottom: 2rem; }
        .loading-progress {
            width: 300px; height: 8px; background: var(--border-color);
            border-radius: 4px; margin: 0 auto; overflow: hidden;
        }
        .progress-bar {
            height: 100%; background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            width: 0%; animation: progress 2s ease-in-out infinite;
        }
        @keyframes progress { 0% { width: 0%; } 100% { width: 100%; } }
        .report-summary {
            display: flex; justify-content: center; align-items: center; gap: 2rem;
            margin-top: 1.5rem;
        }
        .overall-score { text-align: center; }
        .score-value { display: block; font-size: 3.5rem; font-weight: 700; color: var(--primary-color); }
        .score-label { font-size: 0.9rem; color: var(--text-secondary); }
        .score-level { padding: 0.5rem 1.5rem; border-radius: 9999px; font-weight: 600; }
        .score-level.excellent { background: rgba(16,185,129,0.1); color: var(--primary-color); }
        .score-level.good { background: rgba(99,102,241,0.1); color: var(--secondary-color); }
        .score-level.average { background: rgba(245,158,11,0.1); color: var(--accent-color); }
        .score-level.poor { background: rgba(239,68,68,0.1); color: #ef4444; }
        .report-content { margin-top: 2rem; }
        .radar-chart-container { max-width: 600px; margin: 0 auto; padding: 1rem; }
        .dimension-details { margin-top: 2rem; }
        .dimension-details h3 { font-size: 1.25rem; margin-bottom: 1rem; text-align: center; }
        .dimensions-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        .dimension-card {
            background: var(--bg-color); padding: 1rem; border-radius: 0.5rem;
            text-align: center;
        }
        .dimension-card .dim-name { font-weight: 600; margin-bottom: 0.5rem; }
        .dimension-card .dim-score { font-size: 1.5rem; font-weight: 700; color: var(--primary-color); }
        .highlights-section {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem; margin-top: 2rem;
        }
        .highlights-card { background: var(--bg-color); border-radius: 0.75rem; overflow: hidden; }
        .card-header { display: flex; align-items: center; gap: 0.5rem; padding: 1rem; font-weight: 600; }
        .card-icon { font-size: 1.25rem; }
        .highlights-card ul { list-style: none; padding: 0 1rem 1rem; }
        .highlights-card li {
            padding: 0.75rem; margin-bottom: 0.5rem; background: var(--card-bg);
            border-radius: 0.5rem; font-size: 0.9rem;
        }
        .fix-suggestions { margin-top: 2rem; }
        .fix-suggestions h3 { font-size: 1.25rem; margin-bottom: 1rem; text-align: center; }
        .suggestion-item {
            background: linear-gradient(135deg, rgba(16,185,129,0.05) 0%, rgba(99,102,241,0.05) 100%);
            border-left: 4px solid var(--primary-color); padding: 1rem;
            margin-bottom: 1rem; border-radius: 0 0.5rem 0.5rem 0;
        }
        .suggestion-item .suggestion-title { font-weight: 600; margin-bottom: 0.5rem; }
        .suggestion-item .suggestion-desc { font-size: 0.9rem; color: var(--text-secondary); }
        .footer { text-align: center; padding: 1.5rem; color: var(--text-secondary); font-size: 0.9rem; }
        @media (max-width: 768px) {
            .main-content { padding: 1rem; }
            .section { padding: 1.5rem; }
            .report-summary { flex-direction: column; gap: 1rem; }
            .score-value { font-size: 2.5rem; }
            .features-preview { grid-template-columns: 1fr; }
            .highlights-section { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">✨</div>
                <div class="logo-text">
                    <h1>星眸</h1>
                    <p>AI创作的品味守门人</p>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section id="input-section" class="section">
                <div class="section-header">
                    <h2>开始品测</h2>
                    <p>输入URL或粘贴内容，让AI帮你评测品质</p>
                </div>
                <div class="input-form">
                    <div class="form-group">
                        <label for="input-type">选择品测类型</label>
                        <select id="input-type">
                            <option value="url">网页URL</option>
                            <option value="document">文档内容</option>
                            <option value="image">设计稿描述</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="content-input">输入内容</label>
                        <textarea id="content-input" placeholder="请输入网页URL或粘贴需要评测的内容..."></textarea>
                    </div>
                    <button id="start-btn" class="btn btn-primary">
                        <span class="btn-icon">🚀</span>
                        开始智能品测
                    </button>
                </div>
                <div class="features-preview">
                    <div class="feature-card">
                        <div class="feature-icon">📊</div>
                        <h3>9维深度评测</h3>
                        <p>覆盖创新性、清晰度、美感等9大维度</p>
                    </div>
                    <div class="feature-card">
                        <div class="feature-icon">🎯</div>
                        <h3>精准定位问题</h3>
                        <p>45个子项扫描，发现潜在问题</p>
                    </div>
                    <div class="feature-card">
                        <div class="feature-icon">✨</div>
                        <h3>一键修复建议</h3>
                        <p>智能生成优化方案</p>
                    </div>
                </div>
            </section>

            <section id="loading-section" class="section hidden">
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <h3>正在进行智能评测...</h3>
                    <p>AI正在从9个维度、45个子项进行深度扫描分析</p>
                    <div class="loading-progress">
                        <div class="progress-bar"></div>
                    </div>
                </div>
            </section>

            <section id="result-section" class="section hidden">
                <div class="section-header">
                    <h2>品测报告</h2>
                    <div class="report-summary">
                        <div class="overall-score">
                            <span class="score-value" id="overall-score">0</span>
                            <span class="score-label">综合评分</span>
                        </div>
                        <div class="score-level" id="score-level">优秀</div>
                    </div>
                </div>
                <div class="report-content">
                    <div class="radar-chart-container">
                        <canvas id="radar-chart"></canvas>
                    </div>
                    <div class="dimension-details">
                        <h3>各维度详情</h3>
                        <div class="dimensions-grid" id="dimensions-grid"></div>
                    </div>
                    <div class="highlights-section">
                        <div class="highlights-card">
                            <div class="card-header">
                                <span class="card-icon">👍</span>
                                <h3>亮点</h3>
                            </div>
                            <ul id="highlights-list"></ul>
                        </div>
                        <div class="highlights-card">
                            <div class="card-header">
                                <span class="card-icon">👎</span>
                                <h3>槽点</h3>
                            </div>
                            <ul id="weaknesses-list"></ul>
                        </div>
                    </div>
                    <div class="fix-suggestions">
                        <h3>优化建议</h3>
                        <div id="suggestions-list"></div>
                    </div>
                </div>
                <button id="retry-btn" class="btn btn-secondary">
                    <span class="btn-icon">🔄</span>
                    重新评测
                </button>
            </section>
        </main>

        <footer class="footer">
            <p>星眸 - AI品测师 | 让AI创作更有品质</p>
        </footer>
    </div>

    <script>
        class EvaluationEngine {
            constructor() {
                this.dimensions = [
                    { id: 'innovation', name: '创新性', maxScore: 100 },
                    { id: 'clarity', name: '产品清晰度', maxScore: 100 },
                    { id: 'aesthetics', name: '视觉美感', maxScore: 100 },
                    { id: 'usability', name: '易用性', maxScore: 100 },
                    { id: 'consistency', name: '一致性', maxScore: 100 },
                    { id: 'contentQuality', name: '内容质量', maxScore: 100 },
                    { id: 'completion', name: '完成度', maxScore: 100 },
                    { id: 'performance', name: '性能', maxScore: 100 },
                    { id: 'inclusivity', name: '包容性', maxScore: 100 }
                ];
                this.subItems = {
                    innovation: ['产品差异化', '记忆点', '模板规避', '视觉识别', '版式独创'],
                    clarity: ['产品认知', '行动指引', '信息优先', '视觉聚焦', '文案直白'],
                    aesthetics: ['视觉统一', '视觉清晰', '视觉品质', '风格辨识'],
                    usability: ['操作可发现', '操作反馈', '任务流效率', '错误预防', '状态可见'],
                    consistency: ['视觉', '交互', '文案', '布局', '跨页面一致'],
                    contentQuality: ['表达清晰度', '专业可信度', '内容有效性'],
                    completion: ['边界状态', '工程细节', '微交互', '过度动效', '兼容性'],
                    performance: ['加载速度', '交互响应', '视觉稳定', '资源效率', '感知性能'],
                    inclusivity: ['视觉可访问', '键盘可访问', '响应式适配', '暗黑模式']
                };
            }

            evaluate(content, type) {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        const scores = this.generateScores();
                        const highlights = this.generateHighlights(scores);
                        const suggestions = this.generateSuggestions(scores);
                        const overallScore = Math.round(scores.reduce((sum, dim) => sum + dim.score, 0) / scores.length);
                        const level = this.getScoreLevel(overallScore);
                        resolve({ overallScore, level, dimensions: scores, highlights, suggestions });
                    }, 2500);
                });
            }

            generateScores() {
                return this.dimensions.map(dim => {
                    const baseScore = 60 + Math.random() * 35;
                    const score = Math.round(baseScore);
                    const subScores = this.subItems[dim.id].map(sub => ({ name: sub, score: Math.round(50 + Math.random() * 45) }));
                    return { ...dim, score, subItems: subScores };
                });
            }

            generateHighlights(scores) {
                const highScoreDims = scores.filter(d => d.score >= 80);
                const highlights = [];
                if (highScoreDims.length > 0) {
                    const dim = highScoreDims[Math.floor(Math.random() * highScoreDims.length)];
                    highlights.push(`${dim.name}表现优秀，达到${dim.score}分`);
                }
                highlights.push('整体设计风格统一，视觉层次分明');
                highlights.push('信息架构清晰，用户能够快速找到所需内容');
                highlights.push('交互反馈及时，用户操作有明确响应');
                return highlights;
            }

            generateSuggestions(scores) {
                const lowScoreDims = scores.filter(d => d.score < 75);
                const suggestions = [];
                const suggestionTemplates = {
                    innovation: [
                        { title: '增强产品差异化', desc: '建议增加独特的视觉元素或交互方式，避免模板化风格' },
                        { title: '打造记忆点', desc: '可以考虑在关键页面增加独特的品牌识别元素' }
                    ],
                    clarity: [
                        { title: '优化信息层级', desc: '建议明确区分主要信息和次要信息，使用视觉权重引导用户注意力' },
                        { title: '简化文案表达', desc: '文案可以更加简洁直白，降低用户理解成本' }
                    ],
                    aesthetics: [
                        { title: '提升视觉品质', desc: '建议优化细节处理，如间距、阴影、圆角等，提升整体精致感' },
                        { title: '强化风格辨识度', desc: '可以考虑增加独特的色彩搭配或图形风格' }
                    ],
                    usability: [
                        { title: '优化操作流程', desc: '建议简化任务流程，减少用户操作步骤' },
                        { title: '增加错误预防', desc: '在关键操作前增加确认机制，防止误操作' }
                    ],
                    consistency: [
                        { title: '统一视觉规范', desc: '建议建立完整的设计规范，确保各页面风格一致' },
                        { title: '标准化交互模式', desc: '统一按钮样式、弹窗样式等交互组件' }
                    ],
                    contentQuality: [
                        { title: '提升内容专业性', desc: '建议增加数据支撑或专业背书，提升内容可信度' },
                        { title: '优化内容有效性', desc: '确保内容能够有效促使用户采取行动' }
                    ],
                    completion: [
                        { title: '完善边界状态', desc: '建议补充空状态、加载状态、错误状态等场景的设计' },
                        { title: '优化兼容性', desc: '确保在不同浏览器和设备上都能正常显示' }
                    ],
                    performance: [
                        { title: '优化加载速度', desc: '建议压缩资源文件，使用懒加载等技术提升加载性能' },
                        { title: '提升交互响应', desc: '优化JavaScript执行效率，减少用户操作延迟' }
                    ],
                    inclusivity: [
                        { title: '增强可访问性', desc: '建议确保颜色对比度符合WCAG标准，支持键盘导航' },
                        { title: '优化响应式设计', desc: '确保在移动端和桌面端都有良好的体验' }
                    ]
                };
                lowScoreDims.forEach(dim => {
                    const templates = suggestionTemplates[dim.id] || suggestionTemplates.clarity;
                    const template = templates[Math.floor(Math.random() * templates.length)];
                    suggestions.push({ ...template, dimension: dim.name, currentScore: dim.score });
                });
                if (suggestions.length === 0) {
                    suggestions.push({ title: '持续优化', desc: '当前表现优秀，建议持续关注用户反馈，保持领先优势', dimension: '综合', currentScore: 85 });
                }
                return suggestions;
            }

            getScoreLevel(score) {
                if (score >= 90) return 'excellent';
                if (score >= 80) return 'good';
                if (score >= 60) return 'average';
                return 'poor';
            }

            getScoreLevelText(level) {
                const texts = { excellent: '优秀', good: '良好', average: '一般', poor: '较差' };
                return texts[level] || '未知';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const inputSection = document.getElementById('input-section');
            const loadingSection = document.getElementById('loading-section');
            const resultSection = document.getElementById('result-section');
            const inputTypeSelect = document.getElementById('input-type');
            const contentInput = document.getElementById('content-input');
            const startBtn = document.getElementById('start-btn');
            const retryBtn = document.getElementById('retry-btn');
            const overallScoreEl = document.getElementById('overall-score');
            const scoreLevelEl = document.getElementById('score-level');
            const dimensionsGridEl = document.getElementById('dimensions-grid');
            const highlightsListEl = document.getElementById('highlights-list');
            const weaknessesListEl = document.getElementById('weaknesses-list');
            const suggestionsListEl = document.getElementById('suggestions-list');
            let radarChart = null;
            const engine = new EvaluationEngine();

            startBtn.addEventListener('click', async () => {
                const content = contentInput.value.trim();
                if (!content) { alert('请输入需要评测的内容'); return; }
                inputSection.classList.add('hidden');
                loadingSection.classList.remove('hidden');
                try {
                    const result = await engine.evaluate(content, inputTypeSelect.value);
                    showResults(result);
                } catch (error) {
                    console.error('评测失败:', error);
                    alert('评测过程中发生错误，请重试');
                    loadingSection.classList.add('hidden');
                    inputSection.classList.remove('hidden');
                }
            });

            retryBtn.addEventListener('click', () => {
                resultSection.classList.add('hidden');
                inputSection.classList.remove('hidden');
                contentInput.value = '';
                if (radarChart) { radarChart.destroy(); radarChart = null; }
            });

            function showResults(result) {
                loadingSection.classList.add('hidden');
                resultSection.classList.remove('hidden');
                overallScoreEl.textContent = result.overallScore;
                scoreLevelEl.textContent = engine.getScoreLevelText(result.level);
                scoreLevelEl.className = 'score-level ' + result.level;
                renderRadarChart(result.dimensions);
                renderDimensionsGrid(result.dimensions);
                renderHighlights(result.highlights);
                renderWeaknesses(result.dimensions);
                renderSuggestions(result.suggestions);
            }

            function renderRadarChart(dimensions) {
                const ctx = document.getElementById('radar-chart').getContext('2d');
                if (radarChart) radarChart.destroy();
                const labels = dimensions.map(d => d.name);
                const data = dimensions.map(d => d.score);
                radarChart = new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '评分', data: data,
                            backgroundColor: 'rgba(16, 185, 129, 0.2)',
                            borderColor: 'rgba(16, 185, 129, 1)',
                            borderWidth: 2, pointBackgroundColor: 'rgba(16, 185, 129, 1)',
                            pointBorderColor: '#fff', pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: 'rgba(16, 185, 129, 1)'
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: true,
                        scales: {
                            r: {
                                beginAtZero: true, max: 100,
                                ticks: { stepSize: 20, font: { size: 10 } },
                                pointLabels: { font: { size: 12, weight: 'bold' } }
                            }
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: { callbacks: { label: function(c) { return '评分: ' + c.raw + '分'; } } }
                        }
                    }
                });
            }

            function renderDimensionsGrid(dimensions) {
                dimensionsGridEl.innerHTML = dimensions.map(dim => {
                    const scoreColor = dim.score >= 80 ? '#10b981' : dim.score >= 60 ? '#6366f1' : dim.score >= 40 ? '#f59e0b' : '#ef4444';
                    return `<div class="dimension-card"><div class="dim-name">${dim.name}</div><div class="dim-score" style="color: ${scoreColor}">${dim.score}</div></div>`;
                }).join('');
            }

            function renderHighlights(highlights) {
                highlightsListEl.innerHTML = highlights.map(h => `<li>${h}</li>`).join('');
            }

            function renderWeaknesses(dimensions) {
                const lowScoreDims = dimensions.filter(d => d.score < 75);
                const weaknesses = lowScoreDims.length ? lowScoreDims.map(d => `${d.name}得分较低(${d.score}分)，建议重点优化`) : ['整体表现良好，暂无明显短板'];
                weaknessesListEl.innerHTML = weaknesses.map(w => `<li>${w}</li>`).join('');
            }

            function renderSuggestions(suggestions) {
                suggestionsListEl.innerHTML = suggestions.map(s => `<div class="suggestion-item"><div class="suggestion-title">${s.title} <span style="font-size: 0.8rem; color: var(--text-secondary);">(${s.dimension}: ${s.currentScore}分)</span></div><div class="suggestion-desc">${s.desc}</div></div>`).join('');
            }
        });
    </script>
</body>
</html>
