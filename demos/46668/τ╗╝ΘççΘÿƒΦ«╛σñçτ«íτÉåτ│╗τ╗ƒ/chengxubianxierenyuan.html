<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我们 - 综采队设备管理系统</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        
        header {
            background-color: #2c3e50;
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        header .logo {
            height: 80px;
            margin-bottom: 1rem;
        }
        
        section {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .team-member {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .team-member:hover {
            transform: translateY(-5px);
        }
        
        .team-member img {
            width: 100%;
            height: auto;
            max-height: 200px;
            object-fit: contain;
        }
        
        .team-member h3 {
            margin: 1rem 0 0.5rem;
            padding: 0 1rem;
            color: #2c3e50;
        }
        
        .team-member p {
            padding: 0 1rem 1rem;
            color: #7f8c8d;
        }
        
        .about-section {
            background: white;
            margin: 2rem auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 3rem;
            font-size: 0.9rem;
        }
        
        footer a {
            color: #3498db;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        footer a:hover {
            color: #5dade2;
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .team-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .team-member {
                margin-bottom: 1rem;
            }
            
            .team-member img {
                height: 150px;
            }
            
            h1, h2, h3 {
                font-size: 1.5rem;
            }
            
            section {
                padding: 1rem;
            }
            
            header {
                padding: 1rem;
            }
            
            header .logo {
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="img/图片1.png" alt="公司Logo" class="logo">
        <h1>关于我们</h1>
    </header>
    
    <section class="team-section">
        <h2>我们的团队</h2>
        <div class="team-grid">
            <div class="team-member">
                <img src="img/team1.jpg" alt="团队成员1">
                <h3>张三</h3>
                <p>项目经理</p>
            </div>
            <div class="team-member">
                <img src="img/ghf.jpg" alt="团队成员2">
                <h3>顾昊凡</h3>
                <p>前端开发</p>
            </div>
            <div class="team-member">
                <img src="img/ghf.jpg" alt="团队成员3">
                <h3>顾昊凡</h3>
                <p>后端开发</p>
            </div>
            <div class="team-member">
                <img src="img/zzm.jpg" alt="团队成员3">
                <h3>张重敏</h3>
                <p>项目设计</p>
            </div>
        </div>
    </section>
    
    <section class="about-section">
        <h2>关于项目</h2>
        <p>综采队设备管理系统是一个用于管理煤矿综采设备的专业系统，提供设备监控、维护记录和数据分析功能。</p>
    </section>
    
    <footer>
    <p>© 2023 设备管理系统 版权所有 <a href="chengxubianxierenyuan.html">关于我们</a></p>
    </footer>
</body>
</html>
