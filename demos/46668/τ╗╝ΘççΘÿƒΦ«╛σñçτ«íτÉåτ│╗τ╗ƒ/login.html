<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备管理系统登录</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="js/security.js"></script>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <img src="img/图片1.png" alt="公司logo" class="company-logo">
        <h1>设备管理系统</h1>
        <p>请登录您的账户</p>
    </div>
    <form class="login-form" id="loginForm">
        <div id="errorMsg" class="error-msg" style="display: none;"></div>
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="login-btn">登录</button>
    </form>
    <div class="login-footer">
        <p>© 2023 设备管理系统 版权所有 <a href="chengxubianxierenyuan.html">关于我们</a></p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    
    // 检查是否有保存的用户名
    const savedUsername = localStorage.getItem('savedUsername');
    if (savedUsername) {
        document.getElementById('username').value = savedUsername;
    }
    
    // 登录表单提交处理
    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        
        // 使用安全的密码验证（模拟）
        const validUsers = [
            { username: 'admin', password: 'admin123', role: 'admin' },
            { username: 'operator', password: '123456', role: 'operator' }
        ];
        
        const user = validUsers.find(u => u.username === username && u.password === password);
        
        if (user) {
            // 保存登录状态到 sessionStorage
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('userRole', user.role);
            sessionStorage.setItem('username', user.username);
            
            // 保存用户名到 localStorage（可选）
            localStorage.setItem('savedUsername', username);
            
            // 跳转到主页
            window.location.href = 'index.html';
        } else {
            errorMsg.textContent = '用户名或密码错误';
            errorMsg.style.display = 'block';
        }
    });
    
    // 输入时隐藏错误信息
    document.getElementById('username').addEventListener('input', function() {
        errorMsg.style.display = 'none';
    });
    document.getElementById('password').addEventListener('input', function() {
        errorMsg.style.display = 'none';
    });
});
</script>
</body>
</html>
