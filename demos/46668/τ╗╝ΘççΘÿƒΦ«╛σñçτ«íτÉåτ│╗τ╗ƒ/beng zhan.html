<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>综采队设备管理系统 - 泵站设备</title>
		<link rel="stylesheet" href="css/styles.css">
		<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
		<script src="js/security.js"></script>
		<script src="js/common.js"></script>
	</head>
	<body>
		<div class="logo-container"><img src="img/图片1.png" alt="公司logo" class="company-logo"></div>
		<h1>设备定检系统 - 泵站设备</h1>
		<nav>
			<ul>
				<li><a href="index.html">三机设备</a></li>
				<li><a href="meiji.html">煤机设备</a></li>
				<li><a href="dianqi.html">电器设备</a></li>
				<li><a href="pidai.html">皮带设备</a></li>
				<li><a href="beng zhan.html">泵站设备</a></li>
				<li><a href="zhijia.html">支架设备</a></li>
			</ul>
		</nav>
		<div class="container">
			<button onclick="saveData()">保存</button>
			<button onclick="addDevice()">添加设备</button>
			<button onclick="handleDeleteDevice()">删除设备</button>
			<a href="login.html"><button>退出</button></a>
			<button onclick="searchDevice()">查询设备</button>
			<button onclick="showHistory()">查看历史记录</button>
			<button onclick="exportToExcel()">导出Excel</button>
			<button onclick="importFromExcel()">导入Excel</button>
		<div id="historyContainer" style="display:none; margin-top:20px;">
			<h3>操作历史记录</h3>
			<table id="historyTable">
				<thead>
					<tr>
						<th>操作类型</th>
						<th>设备名称</th>
						<th>操作时间</th>
						<th>详情</th>
					</tr>
				</thead>
				<tbody id="historyTableBody"></tbody>
			</table>
		</div>
		<table>
			<thead>
				<tr>
					<th>序号</th>
					<th>设备名称</th>
					<th>设备分类</th>
					<th>设备型号</th>
					<th>检查内容</th>
					<th>检查方法</th>
					<th>标准要求</th>
					<th>检修周期 (天)</th>
					<th>上次检修时间</th>
					<th>下次检修时间</th>
					<th>提醒日期</th>
					<th>状态</th>
					<th>检修</th>
					<th>检查人</th>
					<th>删除</th>
				</tr>
			</thead>
			<tbody id="deviceTableBody">
			</tbody>
		</table>
	</div>
		<script src="js/bengzhan.js"></script>
		<script>
		    // 检查登录状态
		    const isLoggedIn = sessionStorage.getItem('isLoggedIn');
		    if (!isLoggedIn) {
		        window.location.href = 'login.html';
		    }
		</script>
	</body>
</html>
