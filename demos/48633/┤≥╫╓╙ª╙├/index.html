<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>打字练习 - 提升你的打字速度与准确率</title>
  <style>
    /* ============ 主题变量 ============ */
    :root {
      --background: #f8fafc;
      --background-2: #eff6ff;
      --foreground: #1e293b;
      --card: #ffffff;
      --card-foreground: #1e293b;
      --muted: #f1f5f9;
      --muted-foreground: #64748b;
      --border: #e2e8f0;
      --primary: #3b82f6;
      --primary-2: #6366f1;
      --ring: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
      --purple: #8b5cf6;
      --shadow: rgba(0, 0, 0, 0.08);
      --shadow-strong: rgba(59, 130, 246, 0.3);
    }
    [data-theme='dark'] {
      --background: #0f172a;
      --background-2: #1e293b;
      --foreground: #f1f5f9;
      --card: #1e293b;
      --card-foreground: #f1f5f9;
      --muted: #1e293b;
      --muted-foreground: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-2: #6366f1;
      --ring: #3b82f6;
      --green: #34d399;
      --red: #f87171;
      --amber: #fbbf24;
      --purple: #a78bfa;
      --shadow: rgba(0, 0, 0, 0.3);
      --shadow-strong: rgba(59, 130, 246, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; border-color: var(--border); }

    body {
      background: linear-gradient(135deg, var(--background) 0%, var(--background-2) 100%);
      color: var(--foreground);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--muted); border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--muted-foreground); border-radius: 4px; opacity: 0.5; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); }

    /* ============ 布局 ============ */
    .app { min-height: 100vh; display: flex; flex-direction: column; }

    .header {
      position: sticky; top: 0; z-index: 50;
      background: color-mix(in srgb, var(--card) 80%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1152px; margin: 0 auto; padding: 0 16px;
      height: 56px; display: flex; align-items: center; justify-content: space-between;
    }
    .logo-btn { display: flex; align-items: center; gap: 8px; cursor: pointer; background: none; border: none; }
    .logo-btn:hover { opacity: 0.8; }
    .logo-icon { font-size: 20px; }
    .logo-text {
      font-size: 18px; font-weight: 700;
      background: linear-gradient(to right, var(--primary), var(--primary-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .nav-btn {
      padding: 6px 12px; font-size: 14px; border-radius: 8px; cursor: pointer;
      background: none; border: none; color: var(--foreground); transition: background 0.2s;
    }
    .nav-btn:hover { background: var(--muted); }
    .icon-btn {
      padding: 6px 10px; font-size: 16px; border-radius: 8px; cursor: pointer;
      background: none; border: 1px solid var(--border); color: var(--foreground);
      transition: background 0.2s;
    }
    .icon-btn:hover { background: var(--muted); }

    .main { flex: 1; }
    .footer {
      padding: 16px; text-align: center; font-size: 14px;
      color: var(--muted-foreground); border-top: 1px solid var(--border);
    }

    .page { display: none; }
    .page.active { display: block; }

    .container { max-width: 1152px; margin: 0 auto; padding: 0 16px; }
    .container-narrow { max-width: 768px; margin: 0 auto; padding: 0 16px; }
    .container-mid { max-width: 896px; margin: 0 auto; padding: 0 16px; }

    /* ============ 按钮 ============ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 16px; font-size: 14px; font-weight: 500; border-radius: 8px;
      cursor: pointer; border: 1px solid var(--border); background: var(--card);
      color: var(--foreground); transition: all 0.15s;
    }
    .btn:hover { background: var(--muted); }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: var(--muted); }
    .btn-lg { font-size: 18px; padding: 16px 32px; border-radius: 16px; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }

    .btn-gradient {
      background: linear-gradient(to right, var(--primary), var(--primary-2));
      color: #fff; border: none;
      box-shadow: 0 10px 25px var(--shadow-strong);
    }
    .btn-gradient:hover { filter: brightness(0.95); }

    /* ============ 首页 ============ */
    .hero { text-align: center; padding: 40px 16px 40px; }
    .hero h2 {
      font-size: 36px; font-weight: 700; margin-bottom: 12px; color: var(--foreground);
    }
    .hero p { font-size: 18px; color: var(--muted-foreground); margin-bottom: 24px; }

    .mode-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px;
      margin-bottom: 40px;
    }
    @media (max-width: 768px) { .mode-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .mode-grid { grid-template-columns: 1fr; } }

    .mode-card {
      background: var(--card); border-radius: 16px; padding: 20px;
      box-shadow: 0 4px 12px var(--shadow); border: 1px solid var(--border);
      cursor: pointer; transition: all 0.2s;
    }
    .mode-card:hover { box-shadow: 0 8px 20px var(--shadow); transform: scale(1.03); }
    .mode-card .icon { font-size: 24px; margin-bottom: 8px; }
    .mode-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; color: var(--foreground); }
    .mode-card p { font-size: 13px; color: var(--muted-foreground); }

    .settings-panel {
      max-width: 576px; margin: 0 auto; background: var(--card); border-radius: 16px;
      padding: 24px; box-shadow: 0 4px 12px var(--shadow); border: 1px solid var(--border);
    }
    .settings-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

    .form-row { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; color: var(--muted-foreground); margin-bottom: 6px; }
    .select {
      width: 100%; height: 36px; padding: 0 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card); color: var(--foreground);
      font-size: 14px;
    }
    .voice-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 12px; }
    .voice-row .select-wrap { flex: 1; min-width: 0; }
    .voice-row .select { max-width: 100%; }

    .action-row { display: flex; gap: 4px; }
    .mini-btn {
      height: 28px; padding: 0 8px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px;
      border-radius: 8px; border: 1px solid var(--border); background: var(--card);
      color: var(--primary); cursor: pointer; transition: background 0.15s;
    }
    .mini-btn:hover { background: var(--muted); }
    .mini-btn.muted { color: var(--foreground); }
    .mini-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    input[type="range"] {
      width: 100%; height: 6px; border-radius: 3px; background: var(--muted);
      appearance: none; -webkit-appearance: none; cursor: pointer; outline: none;
    }
    /* WebKit (Chrome / Edge / Safari) */
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--primary); cursor: pointer;
      border: 2px solid var(--card); box-shadow: 0 1px 3px var(--shadow);
    }
    /* Firefox */
    input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--primary); cursor: pointer; border: 2px solid var(--card);
      box-shadow: 0 1px 3px var(--shadow);
    }
    input[type="range"]::-moz-range-track {
      height: 6px; border-radius: 3px; background: var(--muted);
    }
    input[type="range"]::-moz-range-progress {
      height: 6px; border-radius: 3px; background: var(--primary);
    }
    .range-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted-foreground); margin-top: 2px; }

    .warn { font-size: 14px; color: var(--amber); text-align: center; margin-top: 12px; }
    .hint-tiny { font-size: 10px; color: var(--amber); margin-top: 4px; }

    /* ============ 练习页 ============ */
    .tabs {
      display: flex; border-radius: 12px; background: var(--muted); padding: 4px;
      gap: 4px; margin-bottom: 24px;
    }
    .tab {
      flex: 1; padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: 500;
      cursor: pointer; border: none; background: none; color: var(--muted-foreground);
      transition: all 0.15s;
    }
    .tab:hover { color: var(--foreground); }
    .tab.active { background: var(--card); color: var(--foreground); box-shadow: 0 1px 3px var(--shadow); }

    .practice-target {
      background: var(--card); border-radius: 16px; padding: 20px;
      border: 1px solid var(--border); box-shadow: 0 4px 12px var(--shadow); margin-bottom: 16px;
    }
    .practice-hanzi {
      font-size: 28px; font-weight: 600; text-align: center; margin-bottom: 12px;
      color: var(--foreground); letter-spacing: 4px;
    }
    .practice-text {
      font-size: 20px; line-height: 1.7; font-family: 'Courier New', monospace; letter-spacing: 1px;
      text-align: center;
    }
    .char { transition: color 0.1s, background 0.1s; border-radius: 2px; }
    .char.correct { color: var(--green); background: color-mix(in srgb, var(--green) 10%, transparent); }
    .char.wrong { color: var(--red); background: color-mix(in srgb, var(--red) 10%, transparent); }
    .char.current { background: color-mix(in srgb, var(--primary) 20%, transparent); border-radius: 3px; }

    .practice-input {
      background: var(--muted); border-radius: 12px; padding: 12px; margin-bottom: 16px;
      text-align: center; border: 2px dashed var(--border); min-height: 48px;
      display: flex; align-items: center; justify-content: center;
    }
    .practice-input .typed { font-size: 18px; font-family: 'Courier New', monospace; color: var(--foreground); }
    .practice-input .placeholder { font-size: 14px; color: var(--muted-foreground); }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat-card {
      background: var(--card); border-radius: 12px; padding: 12px; text-align: center;
      border: 1px solid var(--border);
    }
    .stat-value { font-size: 20px; font-weight: 700; }
    .stat-value.blue { color: var(--primary); }
    .stat-value.green { color: var(--green); }
    .stat-value.purple { color: var(--purple); }
    .stat-label { font-size: 10px; color: var(--muted-foreground); margin-top: 2px; }

    .practice-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .practice-header .back-btn {
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; border: 1px solid var(--border); background: var(--card);
      cursor: pointer; font-size: 16px; color: var(--foreground); transition: background 0.15s;
    }
    .practice-header .back-btn:hover { background: var(--muted); }
    .practice-header .title {
      font-size: 18px; font-weight: 600; flex: 1; text-align: center;
    }
    .practice-header .spacer { width: 36px; }

    .control-row { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }

    /* 自由练习 */
    .free-view { text-align: center; padding: 24px 0; }
    .free-key-box {
      width: 144px; height: 144px; margin: 0 auto 24px; border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      background: var(--card); box-shadow: 0 4px 12px var(--shadow);
      border: 2px solid var(--border); transition: all 0.15s;
    }
    .free-key-box.pressed { border-color: var(--primary); box-shadow: 0 4px 20px var(--shadow-strong); transform: scale(0.95); }
    .free-key-text { font-size: 60px; font-weight: 700; color: var(--muted-foreground); transition: color 0.15s; }
    .free-key-box.pressed .free-key-text { color: var(--primary); }
    .free-hint { color: var(--muted-foreground); }

    /* 自定义练习模式 */
    .custom-view { max-width: 800px; margin: 0 auto; }
    .custom-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .custom-file-name { font-size: 13px; color: var(--muted-foreground); }
    .custom-progress { font-size: 14px; color: var(--muted-foreground); margin-bottom: 12px; text-align: center; }
    .custom-empty { text-align: center; padding: 48px 16px; color: var(--muted-foreground); }

    /* 跟练模式 */
    .follow-view { max-width: 448px; margin: 0 auto; text-align: center; }
    .follow-stats { display: flex; justify-content: center; gap: 32px; margin-bottom: 24px; }
    .follow-stat .num { font-size: 24px; font-weight: 700; }
    .follow-stat .num.green { color: var(--green); }
    .follow-stat .num.blue { color: var(--primary); }
    .follow-stat .label { font-size: 10px; color: var(--muted-foreground); }

    .follow-card {
      background: var(--card); border-radius: 16px; padding: 32px;
      border: 1px solid var(--border); box-shadow: 0 4px 12px var(--shadow); margin-bottom: 16px;
    }
    .follow-icon { font-size: 48px; margin-bottom: 12px; }
    .follow-pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .follow-question {
      width: 80px; height: 80px; margin: 0 auto; border-radius: 16px;
      border: 3px dashed var(--primary); display: flex; align-items: center; justify-content: center;
      animation: glowPulse 1.5s ease-in-out infinite;
    }
    .follow-question span { font-size: 24px; color: var(--primary); }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 5px rgba(99, 102, 241, 0.5); }
      50% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.8), 0 0 40px rgba(99, 102, 241, 0.3); }
    }

    /* ============ 虚拟键盘 ============ */
    .virtual-keyboard { width: 100%; max-width: 768px; margin: 16px auto 0; padding: 16px; }
    .kb-container {
      background: var(--muted); border-radius: 16px; padding: 12px 16px;
      border: 1px solid var(--border);
    }
    .kb-row { display: flex; gap: 4px; margin-bottom: 4px; justify-content: center; }
    .kb-row:last-child { margin-bottom: 0; }
    .kb-key {
      flex: 1; height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 6px; font-weight: 600; font-size: 12px; user-select: none;
      background: var(--muted-foreground); color: var(--card); transition: all 0.1s;
      opacity: 0.5;
    }
    [data-theme='dark'] .kb-key { background: #475569; color: #e2e8f0; }
    .kb-key.pressed {
      background: var(--primary) !important; color: #fff !important;
      transform: scale(0.9) translateY(-2px); box-shadow: 0 8px 16px var(--shadow-strong);
      opacity: 1;
    }

    /* ============ 统计页 ============ */
    .stats-page { padding: 32px 16px; }
    .stats-title { font-size: 30px; font-weight: 700; margin-bottom: 32px; }
    .overview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    @media (max-width: 640px) { .overview-grid { grid-template-columns: repeat(2, 1fr); } }
    .overview-card {
      background: var(--card); border-radius: 16px; padding: 16px;
      box-shadow: 0 4px 12px var(--shadow); border: 1px solid var(--border);
    }
    .overview-num { font-size: 30px; font-weight: 700; }
    .overview-num.blue { color: var(--primary); }
    .overview-num.green { color: var(--green); }
    .overview-num.purple { color: var(--purple); }
    .overview-num.amber { color: var(--amber); }
    .overview-label { font-size: 14px; color: var(--muted-foreground); margin-top: 4px; }

    .history-box {
      background: var(--card); border-radius: 16px; box-shadow: 0 4px 12px var(--shadow);
      border: 1px solid var(--border); overflow: hidden;
    }
    .history-head {
      padding: 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .history-head h2 { font-size: 18px; font-weight: 600; }
    .clear-btn { font-size: 14px; color: var(--red); background: none; border: none; cursor: pointer; }
    .clear-btn:hover { text-decoration: underline; }
    .history-item { padding: 16px; border-bottom: 1px solid var(--border); transition: background 0.15s; }
    .history-item:last-child { border-bottom: none; }
    .history-item:hover { background: var(--muted); }
    .history-item-inner { display: flex; align-items: center; justify-content: space-between; }
    .history-mode { font-weight: 500; }
    .history-date { font-size: 14px; color: var(--muted-foreground); }
    .history-metrics { display: flex; align-items: center; gap: 16px; font-size: 14px; }
    .history-metric { text-align: center; }
    .history-metric .val { font-weight: 700; }
    .history-metric .val.blue { color: var(--primary); }
    .history-metric .val.green { color: var(--green); }
    .history-metric .val.purple { color: var(--purple); }
    .history-metric .lbl { font-size: 12px; color: var(--muted-foreground); }
    .history-empty { padding: 32px; text-align: center; color: var(--muted-foreground); }
  </style>
</head>
<body>
  <div class="app">
    <!-- 顶部导航 -->
    <header class="header">
      <div class="header-inner">
        <button class="logo-btn" id="logoBtn">
          <span class="logo-icon">⌨️</span>
          <span class="logo-text">打字练习</span>
        </button>
        <div class="header-actions">
          <button class="nav-btn" id="statsNavBtn">📊 统计</button>
          <button class="icon-btn" id="themeBtn">🌙</button>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 首页 -->
      <section class="page active" id="homePage">
        <div class="container" style="max-width: 896px; padding: 40px 16px;">
          <div class="hero">
            <h2>提升你的打字速度</h2>
            <p>通过科学练习方法，快速提升打字准确率与速度</p>
            <button class="btn btn-gradient btn-lg" id="startPracticeBtn">开始练习 →</button>
          </div>

          <div class="mode-grid" id="modeGrid"></div>

          <div class="settings-panel">
            <h3 class="settings-title">🎙 语音设置</h3>
            <p class="hint-tiny" style="margin-bottom:12px;color:var(--muted-foreground);font-size:12px;">💡 字母发音使用预生成音频（支持重叠播放）</p>
            <div class="form-row">
              <div class="voice-row">
                <div class="select-wrap">
                  <label class="form-label">选择语音</label>
                  <select class="select" id="voiceSelect">
                    <option value="female">👩 女声</option>
                    <option value="male">👨 男声</option>
                  </select>
                </div>
                <button class="btn btn-sm" id="speechToggleBtn">🔊</button>
              </div>
              <div class="action-row">
                <button class="mini-btn" id="previewBtn">▶ 试听</button>
              </div>
              <p class="hint-tiny" style="color:var(--muted-foreground);">试听将播放 A、B、C 三个字母</p>
            </div>
            <div class="form-row">
              <label class="form-label">字母音量: <span id="volumeLabel">100%</span></label>
              <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1" />
              <div class="range-labels">
                <span>静音</span><span>正常</span><span>最大</span>
              </div>
            </div>
            <p class="warn" id="speechUnsupportedWarn" style="display:none;">⚠ 当前浏览器不支持语音合成</p>
          </div>
        </div>
      </section>

      <!-- 练习页 -->
      <section class="page" id="practicePage">
        <div class="container-mid" style="padding: 24px 16px;">
          <div class="practice-header">
            <button class="back-btn" id="practiceBackBtn" title="返回首页">←</button>
            <div class="title">打字练习</div>
            <div class="spacer"></div>
          </div>
          <div class="tabs" id="practiceTabs"></div>
          <div id="practiceContent"></div>
          <div class="virtual-keyboard">
            <div class="kb-container" id="virtualKeyboard"></div>
          </div>
        </div>
      </section>

      <!-- 统计页 -->
      <section class="page" id="statsPage">
        <div class="container stats-page">
          <h1 class="stats-title">练习统计</h1>
          <div class="overview-grid" id="overviewGrid"></div>
          <div class="history-box">
            <div class="history-head">
              <h2>练习历史</h2>
              <button class="clear-btn" id="clearHistoryBtn" style="display:none;">清除记录</button>
            </div>
            <div id="historyList"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">打字练习应用 - 提升你的打字速度与准确率</footer>
  </div>

  <script src="audio_data.js"></script>
  <script>
  (function () {
    'use strict';

    // ============ 常量数据 ============
    const QWERTY_LAYOUT = [
      [
        { code: 'Backquote', label: '`' }, { code: 'Digit1', label: '1' },
        { code: 'Digit2', label: '2' }, { code: 'Digit3', label: '3' },

    function formatTime(seconds) {

    const Storage = {
      get(key, def) {
        try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : def; }
        catch (e) { return def; }
      },
      set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} },
      remove(key) { try { localStorage.removeItem(key); } catch (e) {} },
    };

    const KEYS = { SETTINGS: 'typing-speech-settings', HISTORY: 'typing-app-history', THEME: 'typing-app-theme' };

    function loadSpeechSettings() {
      return Storage.get(KEYS.SETTINGS, { volume: 1.0, enabled: true, voiceURI: 'female' });
    }
    function saveSpeechSettings(s) { Storage.set(KEYS.SETTINGS, s); }

    function getPracticeHistory() { return Storage.get(KEYS.HISTORY, []); }
    function savePracticeSession(session) {
      const history = getPracticeHistory();

      const root = document.documentElement;
      if (theme === 'dark') root.setAttribute('data-theme', 'dark');
      else if (theme === 'light') root.removeAttribute('data-theme');
      else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark) root.setAttribute('data-theme', 'dark');
        else root.removeAttribute('data-theme');

      Storage.set(KEYS.THEME, theme);
      updateThemeBtn(theme);

    // ============ 语音模块 ============
    // 实现真正的重叠播放：用 Web Audio API 加载预生成的字母音频为 AudioBuffer，
    // 按键时创建 AudioBufferSourceNode 触发播放。多个 source 可真正同时发声。
    //
    // 音频来源：audio_data.js 内嵌的 base64 数据，分 male / female 两套。
    // 试听功能：按顺序播放 A、B、C 三个字母（用当前选中的语音）。
    const Speech = {
      audioSupported: (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined'),
      settings: loadSpeechSettings(),
      audioCtx: null,
      // 缓存结构：{ female: { A: AudioBuffer, ... }, male: { ... } }
      bufferCache: { female: {}, male: {} },
      bufferLoaded: { female: {}, male: {} },
      loadingStarted: { female: false, male: false },

      // ===== Web Audio API 核心 =====
      _ensureAudioCtx() {
        if (!this.audioSupported) return null;
        if (!this.audioCtx) {
          const Ctor = window.AudioContext || window.webkitAudioContext;
          this.audioCtx = new Ctor();
        }
        if (this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
        return this.audioCtx;
      },

      // 当前选中的语音性别
      get gender() {
        const g = this.settings.voiceURI || 'female';
        return (g === 'male') ? 'male' : 'female';
      },

      // 预加载指定性别的字母音频
      preloadLetters(gender) {
        gender = gender || this.gender;
        if (this.loadingStarted[gender]) return;
        this.loadingStarted[gender] = true;
        const ctx = this._ensureAudioCtx();
        if (!ctx) return;

        const dataMap = (window.LETTER_AUDIO_BASE64 && window.LETTER_AUDIO_BASE64[gender]) || {};
        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        const self = this;
        letters.forEach(function (letter) {
          const dataUri = dataMap[letter];
          if (!dataUri) { self.bufferLoaded[gender][letter] = false; return; }
          fetch(dataUri)
            .then(function (res) { return res.arrayBuffer(); })
            .then(function (buf) {
              return new Promise(function (resolve, reject) {
                ctx.decodeAudioData(buf, resolve, reject);
              });
            })
            .then(function (audioBuf) {
              self.bufferCache[gender][letter] = audioBuf;
              self.bufferLoaded[gender][letter] = true;
            })
            .catch(function () { self.bufferLoaded[gender][letter] = false; });
        });
      },

      // 用 Web Audio API 播放 AudioBuffer（多个可同时发声）
      _playLetter(letter, onEnd) {
        const ctx = this._ensureAudioCtx();
        if (!ctx) { if (onEnd) onEnd(); return false; }
        const gender = this.gender;
        if (!this.bufferLoaded[gender] || !this.bufferLoaded[gender][letter] || !this.bufferCache[gender][letter]) {
          if (!this.loadingStarted[gender]) this.preloadLetters(gender);
          if (onEnd) onEnd();
          return false;
        }
        const src = ctx.createBufferSource();
        src.buffer = this.bufferCache[gender][letter];
        const gain = ctx.createGain();
        gain.gain.value = this.settings.volume;
        src.connect(gain);
        gain.connect(ctx.destination);
        if (onEnd) {
          src.onended = function () { onEnd(); };
        }
        src.start(0);
        return true;
      },

      // 播放单个字母（用于练习时按键发音，支持重叠播放）
      speak(text, onEnd) {
        if (!this.settings.enabled) { if (onEnd) onEnd(); return; }
        const upper = text.toUpperCase();
        if (text.length === 1 && /[A-Z]/.test(upper)) {
          if (!this.bufferLoaded[this.gender] || !this.bufferLoaded[this.gender][upper]) {
            if (!this.loadingStarted[this.gender]) this.preloadLetters();
            if (onEnd) onEnd();
            return;
          }
          this._playLetter(upper, onEnd);
          return;
        }
        if (onEnd) onEnd();
      },

      // 依次播放多个字母（用于试听 A B C）
      speakSequence(letters, onEnd) {
        if (!this.settings.enabled) { if (onEnd) onEnd(); return; }
        const self = this;
        let idx = 0;
        function playNext() {
          if (idx >= letters.length) { if (onEnd) onEnd(); return; }
          const letter = letters[idx].toUpperCase();
          idx++;
          self._playLetter(letter, function () {
            // 字母间短暂间隔
            setTimeout(playNext, 150);
          });
        }
        // 确保音频已加载
        if (!this.loadingStarted[this.gender]) this.preloadLetters();
        // 给一点时间让音频解码（首次播放时）
        setTimeout(playNext, 100);
      },

      speakNow(text, onEnd) {
        if (!this.settings.enabled) { if (onEnd) onEnd(); return; }
        const upper = text.toUpperCase();
        if (text.length === 1 && /[A-Z]/.test(upper)) {
          this._playLetter(upper, onEnd);
          return;
        }
        if (onEnd) onEnd();
      },
      stop() {
        // Web Audio API 已触发的 source 无法停止，会自然播完
      },
      updateSettings(partial) {
        const oldGender = this.gender;
        this.settings = Object.assign({}, this.settings, partial);
        saveSpeechSettings(this.settings);
        // 切换语音后预加载新语音
        const newGender = this.gender;
        if (oldGender !== newGender) {
          this.preloadLetters(newGender);
        }
      },
      init() {
        // 页面加载时预解码当前选中性别的字母音频
        if (this.audioSupported) {
          this._ensureAudioCtx();
          this.preloadLetters();
        }
      }
    };

    // ============ 页面导航 ============
    let currentPage = 'home';
    let activeTab = 'free';

    function showPage(page) {
      currentPage = page;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(page + 'Page').classList.add('active');
      const statsBtn = document.getElementById('statsNavBtn');
      statsBtn.textContent = page === 'stats' ? '🏠 首页' : '📊 统计';
      if (page === 'stats') renderStatsPage();
    }

    function goToPractice(tab) {
      activeTab = tab;
      showPage('practice');
      renderPracticeTabs();
      renderPracticeContent();
    }

    // ============ 首页渲染 ============
    function renderModeGrid() {
      const grid = document.getElementById('modeGrid');
      grid.innerHTML = '';
      Object.keys(PRACTICE_MODES).forEach(key => {
        const mode = PRACTICE_MODES[key];
        const card = document.createElement('div');
        card.className = 'mode-card';
        card.innerHTML = '<div class="icon">' + mode.icon + '</div>' +
          '<h3>' + mode.name + '</h3><p>' + mode.description + '</p>';
        card.onclick = () => {
          // 用户交互时启动 AudioContext 并预加载字母音频
          if (Speech.audioSupported) {
            Speech._ensureAudioCtx();
            Speech.preloadLetters();
          }
          goToPractice(key);
        };
        grid.appendChild(card);
      });
    }

    function renderHome() {
      renderModeGrid();

      // 语音选择下拉框
      const voiceSelect = document.getElementById('voiceSelect');
      voiceSelect.value = Speech.gender;

      const toggleBtn = document.getElementById('speechToggleBtn');
      toggleBtn.textContent = Speech.settings.enabled ? '🔊' : '🔇';

      const volumeSlider = document.getElementById('volumeSlider');
      const volumeLabel = document.getElementById('volumeLabel');
      volumeSlider.value = Speech.settings.volume;
      volumeLabel.textContent = Math.round(Speech.settings.volume * 100) + '%';
    }

    // ============ 练习页 ============
    function renderPracticeTabs() {
      const tabsEl = document.getElementById('practiceTabs');
      tabsEl.innerHTML = '';
      Object.keys(PRACTICE_MODES).forEach(key => {
        const tab = document.createElement('button');
        tab.className = 'tab' + (key === activeTab ? ' active' : '');
        tab.textContent = PRACTICE_MODES[key].name;
        tab.onclick = () => { activeTab = key; renderPracticeTabs(); renderPracticeContent(); };
        tabsEl.appendChild(tab);
      });
    }

    // 练习状态
    let practiceState = {
      targetText: '', inputText: '', startTime: null, stats: { wpm: 0, accuracy: 100, elapsedTime: 0 },
      keyHandler: null, timerInterval: null,
    };

    function clearPracticeHandlers() {
      if (practiceState.keyHandler) {
        window.removeEventListener('keydown', practiceState.keyHandler);
        practiceState.keyHandler = null;
      }
      if (practiceState.timerInterval) {
        clearInterval(practiceState.timerInterval);
        practiceState.timerInterval = null;
      }
    }

    function renderPracticeContent() {
      clearPracticeHandlers();
      const content = document.getElementById('practiceContent');
      content.innerHTML = '';

      if (activeTab === 'free') { renderFreeMode(content); return; }
      if (activeTab === 'follow') { renderFollowMode(content); return; }
      if (activeTab === 'custom') { renderCustomMode(content); return; }

      // word / sentence (单字 / 句子练习，使用拼音)
      let item = null;
      if (activeTab === 'word') item = getRandomChar();
      else if (activeTab === 'sentence') item = getRandomSentence();

      practiceState.targetText = item.pinyin;
      practiceState.displayHanzi = item.hanzi;
      practiceState.inputText = '';
      practiceState.startTime = Date.now();
      practiceState.stats = { wpm: 0, accuracy: 100, elapsedTime: 0 };

      content.innerHTML =
        '<div class="practice-target">' +
          '<div class="practice-hanzi" id="targetHanzi"></div>' +
          '<div class="practice-text" id="targetText"></div>' +
        '</div>' +
        '<div class="practice-input" id="practiceInput"><span class="placeholder">直接开始打拼音... 按 Backspace 删除</span></div>' +
        '<div class="stats-grid">' +
          '<div class="stat-card"><div class="stat-value blue" id="wpmVal">0</div><div class="stat-label">WPM</div></div>' +
          '<div class="stat-card"><div class="stat-value green" id="accVal">100%</div><div class="stat-label">准确率</div></div>' +
          '<div class="stat-card"><div class="stat-value purple" id="timeVal">00:00</div><div class="stat-label">用时</div></div>' +
        '</div>' +
        '<div class="control-row">' +
          '<button class="btn btn-primary" id="restartBtn">重新开始</button>' +
          '<button class="btn" id="changeBtn">换一个</button>' +
        '</div>';

      renderTargetText();
      renderPracticeInput();

      // 计时器
      practiceState.timerInterval = setInterval(updateElapsedTime, 200);

      // 按键监听
      practiceState.keyHandler = function (e) {
        if (e.isComposing) return;
        if (e.key.length > 1 && e.key !== 'Backspace' && e.key !== ' ') return;
        e.preventDefault();

        if (e.key === 'Backspace') {
          practiceState.inputText = practiceState.inputText.slice(0, -1);
          updateStats();
          renderTargetText();
          renderPracticeInput();
          return;
        }
        if (e.key.length !== 1) return;

        practiceState.inputText += e.key;
        updateStats();
        renderTargetText();
        renderPracticeInput();

        // 完成自动换题（忽略大小写模式用小写对比）
        const done = isCaseInsensitive()
          ? practiceState.inputText.toLowerCase() === practiceState.targetText.toLowerCase()
          : practiceState.inputText === practiceState.targetText;
        if (done) {
          saveCurrentSession();
          setTimeout(() => {
            let newItem = null;
            if (activeTab === 'word') newItem = getRandomChar();
            else if (activeTab === 'sentence') newItem = getRandomSentence();
            practiceState.targetText = newItem.pinyin;
            practiceState.displayHanzi = newItem.hanzi;
            practiceState.inputText = '';
            practiceState.startTime = Date.now();
            practiceState.stats = { wpm: 0, accuracy: 100, elapsedTime: 0 };
            renderTargetText();
            renderPracticeInput();
          }, 300);
        }

        // 语音
        if (Speech.settings.enabled && /[a-zA-Z]/.test(e.key)) {
          Speech.speak(e.key);
        }
      };
      window.addEventListener('keydown', practiceState.keyHandler);

      document.getElementById('restartBtn').onclick = function () {
        practiceState.inputText = '';
        practiceState.startTime = Date.now();
        practiceState.stats = { wpm: 0, accuracy: 100, elapsedTime: 0 };
        renderTargetText();
        renderPracticeInput();
        updateStatsDisplay();
      };
      document.getElementById('changeBtn').onclick = function () {
        let newItem = null;
        if (activeTab === 'word') newItem = getRandomChar();
        else if (activeTab === 'sentence') newItem = getRandomSentence();
        practiceState.targetText = newItem.pinyin;
        practiceState.displayHanzi = newItem.hanzi;
        practiceState.inputText = '';
        practiceState.startTime = Date.now();
        practiceState.stats = { wpm: 0, accuracy: 100, elapsedTime: 0 };
        renderTargetText();
        renderPracticeInput();
        updateStatsDisplay();
      };
    }

    function saveCurrentSession() {
      const session = {
        id: generateId(),
        date: Date.now(),
        mode: activeTab,
        stats: {
          wpm: practiceState.stats.wpm,
          accuracy: practiceState.stats.accuracy,
          totalKeystrokes: practiceState.inputText.length,
          correctKeystrokes: computeCorrect(),
          wrongKeystrokes: practiceState.inputText.length - computeCorrect(),
          elapsedTime: practiceState.stats.elapsedTime,
        },
        text: practiceState.targetText,
      };
      savePracticeSession(session);
    }

    function computeCorrect() {
      let correct = 0;
      const len = Math.min(practiceState.inputText.length, practiceState.targetText.length);
      for (let i = 0; i < len; i++) {
        if (practiceState.inputText[i] === practiceState.targetText[i]) correct++;
      }
      return correct;
    }

    // 是否忽略大小写（句子练习、自定义练习不区分大小写）
    function isCaseInsensitive() {
      return activeTab === 'sentence' || activeTab === 'custom';
    }
    // 字符匹配（根据当前模式决定是否忽略大小写）
    function charMatch(a, b) {
      if (a === b) return true;
      if (isCaseInsensitive()) return a.toLowerCase() === b.toLowerCase();
      return false;
    }

    function renderTargetText() {
      const hanziEl = document.getElementById('targetHanzi');
      if (hanziEl && practiceState.displayHanzi) {
        hanziEl.textContent = practiceState.displayHanzi;
      }
      const el = document.getElementById('targetText');
      if (!el) return;
      const input = practiceState.inputText;
      const target = practiceState.targetText;
      let html = '';
      for (let i = 0; i < target.length; i++) {
        let cls = 'char';
        if (i < input.length) {
          cls += charMatch(input[i], target[i]) ? ' correct' : ' wrong';
        } else if (i === input.length) {
          cls += ' current';
        }
        html += '<span class="' + cls + '">' + escapeHtml(target[i]) + '</span>';
      }
      el.innerHTML = html;
    }

    function renderPracticeInput() {
      const el = document.getElementById('practiceInput');
      if (!el) return;
      if (practiceState.inputText) {
        el.innerHTML = '<span class="typed">' + escapeHtml(practiceState.inputText) + '</span>';
      } else {
        el.innerHTML = '<span class="placeholder">直接开始打字... 按 Backspace 删除</span>';
      }
    }

    function updateStats() {
      const input = practiceState.inputText;
      const target = practiceState.targetText;
      let correct = 0;
      const len = Math.min(input.length, target.length);
      for (let i = 0; i < len; i++) {
        if (charMatch(input[i], target[i])) correct++;
      }
      const wrong = input.length - correct;
      const total = correct + wrong;
      const accuracy = total > 0 ? Math.round((correct / total) * 1000) / 10 : 100;
      const elapsed = practiceState.startTime ? (Date.now() - practiceState.startTime) / 1000 : 0;
      const minutes = elapsed / 60;
      const wpm = minutes > 0 ? Math.round((correct / 5) / minutes) : 0;
      practiceState.stats = { wpm: wpm, accuracy: accuracy, elapsedTime: elapsed };
      updateStatsDisplay();
    }

    function updateElapsedTime() {
      if (!practiceState.startTime) return;
      const elapsed = (Date.now() - practiceState.startTime) / 1000;
      practiceState.stats.elapsedTime = elapsed;
      const timeEl = document.getElementById('timeVal');
      if (timeEl) timeEl.textContent = formatTime(elapsed);
    }

    function updateStatsDisplay() {
      const wpmEl = document.getElementById('wpmVal');
      const accEl = document.getElementById('accVal');
      const timeEl = document.getElementById('timeVal');
      if (wpmEl) wpmEl.textContent = practiceState.stats.wpm;
      if (accEl) accEl.textContent = practiceState.stats.accuracy + '%';
      if (timeEl) timeEl.textContent = formatTime(practiceState.stats.elapsedTime);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
      });
    }

    // ====== 自由练习 ======
    function renderFreeMode(container) {
      clearPracticeHandlers();
      container.innerHTML =
        '<div class="free-view">' +
          '<div class="free-key-box" id="freeKeyBox"><span class="free-key-text" id="freeKeyText">⌨</span></div>' +
          '<p class="free-hint">按下任意字母键听取发音</p>' +
        '</div>';

      const box = document.getElementById('freeKeyBox');
      const text = document.getElementById('freeKeyText');
      let pressTimer = null;

      practiceState.keyHandler = function (e) {
        if (e.repeat) return;
        if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
          const key = e.key.toUpperCase();
          text.textContent = key;
          box.classList.add('pressed');
          // 直接传字母（不是 speakableLetter 的结果），触发 Web Audio API 重叠播放
          Speech.speak(e.key);
          if (pressTimer) clearTimeout(pressTimer);
          pressTimer = setTimeout(function () {
            box.classList.remove('pressed');
            text.textContent = '⌨';
          }, 200);
        }
      };
      window.addEventListener('keydown', practiceState.keyHandler);
    }

    // ====== 自定义练习模式 ======
    // 自定义模式状态：保存导入的文本行、当前行索引
    let customState = {
      lines: [],      // 拆分后的练习行
      index: 0,       // 当前练习到第几行
      fileName: '',   // 导入的文件名
    };

    function renderCustomMode(container) {
      clearPracticeHandlers();
      container.innerHTML =
        '<div class="custom-view">' +
          '<div class="custom-toolbar">' +
            '<label class="btn btn-primary" for="customFileInput">📁 导入文本文件</label>' +
            '<input type="file" id="customFileInput" accept=".txt,.md,.csv,.log,text/*" style="display:none;" />' +
            '<span class="custom-file-name" id="customFileName">未导入文件</span>' +
          '</div>' +
          '<div id="customContent"></div>' +
        '</div>';

      const fileInput = document.getElementById('customFileInput');
      fileInput.onchange = function (e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          const text = String(ev.target.result || '');
          // 按换行拆分，过滤空行，合并连续空格
          customState.lines = text.split(/\r?\n/).map(function (l) { return l.replace(/\s+/g, ' ').trim(); }).filter(function (l) { return l.length > 0; });
          customState.index = 0;
          customState.fileName = file.name;
          document.getElementById('customFileName').textContent = file.name + '（共 ' + customState.lines.length + ' 行）';
          startCustomLine();
        };
        reader.readAsText(file, 'utf-8');
      };

      // 如果之前已导入文件，直接继续
      if (customState.lines.length > 0) {
        document.getElementById('customFileName').textContent = customState.fileName + '（共 ' + customState.lines.length + ' 行）';
        startCustomLine();
      } else {
        document.getElementById('customContent').innerHTML =
          '<div class="custom-empty"><p>请点击上方按钮导入本地文本文件</p>' +
          '<p class="hint-tiny" style="color:var(--muted-foreground);">支持 .txt / .md / .csv 等文本文件，每行作为一段练习内容，不区分大小写</p></div>';
      }
    }

    // 开始练习当前行
    function startCustomLine() {
      const content = document.getElementById('customContent');
      if (!content) return;
      if (customState.lines.length === 0) {
        content.innerHTML = '<div class="custom-empty"><p>文件内容为空，请重新导入</p></div>';
        return;
      }
      if (customState.index >= customState.lines.length) customState.index = 0;

      // 先清除旧的监听器和计时器，避免重复绑定导致一次按键触发多次
      clearPracticeHandlers();

      const text = customState.lines[customState.index];
      practiceState.targetText = text;
      practiceState.inputText = '';
      practiceState.startTime = Date.now();
      practiceState.stats = { wpm: 0, accuracy: 100, elapsedTime: 0 };

      content.innerHTML =
        '<div class="custom-progress">第 ' + (customState.index + 1) + ' / ' + customState.lines.length + ' 行</div>' +
        '<div class="practice-target"><div class="practice-text" id="targetText"></div></div>' +
        '<div class="practice-input" id="practiceInput"><span class="placeholder">直接开始打字... 按 Backspace 删除</span></div>' +
        '<div class="stats-grid">' +
          '<div class="stat-card"><div class="stat-value blue" id="wpmVal">0</div><div class="stat-label">WPM</div></div>' +
          '<div class="stat-card"><div class="stat-value green" id="accVal">100%</div><div class="stat-label">准确率</div></div>' +
          '<div class="stat-card"><div class="stat-value purple" id="timeVal">00:00</div><div class="stat-label">用时</div></div>' +
        '</div>' +
        '<div class="control-row">' +
          '<button class="btn btn-primary" id="restartBtn">重新开始本行</button>' +
          '<button class="btn" id="nextLineBtn">⏭ 下一行</button>' +
          '<button class="btn" id="reimportBtn">重新导入</button>' +
        '</div>';

      renderTargetText();
      renderPracticeInput();

      // 计时器
      practiceState.timerInterval = setInterval(updateElapsedTime, 200);

      // 按键监听
      practiceState.keyHandler = function (e) {
        // 忽略 IME 组合输入（中文输入法输入拼音过程中不处理）
        if (e.isComposing) return;
        if (e.key.length > 1 && e.key !== 'Backspace' && e.key !== ' ') return;
        e.preventDefault();

        if (e.key === 'Backspace') {
          practiceState.inputText = practiceState.inputText.slice(0, -1);
          updateStats();
          renderTargetText();
          renderPracticeInput();
          return;
        }
        if (e.key.length !== 1) return;

        practiceState.inputText += e.key;
        updateStats();
        renderTargetText();
        renderPracticeInput();

        // 完成当前行（不区分大小写）
        const done = practiceState.inputText.toLowerCase() === practiceState.targetText.toLowerCase();
        if (done) {
          saveCurrentSession();
          setTimeout(function () {
            customState.index++;
            if (customState.index >= customState.lines.length) {
              customState.index = 0;
            }
            startCustomLine();
          }, 300);
        }

        // 语音
        if (Speech.settings.enabled && /[a-zA-Z]/.test(e.key)) {
          Speech.speak(e.key);
        }
      };
      window.addEventListener('keydown', practiceState.keyHandler);

      document.getElementById('restartBtn').onclick = function () {
        practiceState.inputText = '';
        practiceState.startTime = Date.now();
        practiceState.stats = { wpm: 0, accuracy: 100, elapsedTime: 0 };
        renderTargetText();
        renderPracticeInput();
        updateStatsDisplay();
      };
      document.getElementById('nextLineBtn').onclick = function () {
        customState.index++;
        if (customState.index >= customState.lines.length) customState.index = 0;
        startCustomLine();
      };
      document.getElementById('reimportBtn').onclick = function () {
        document.getElementById('customFileInput').click();
      };
    }

    // ====== 跟练模式 ======
    function renderFollowMode(container) {
      clearPracticeHandlers();
      const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      let currentLetter = '';
      let result = null;
      let correctCount = 0;
      let totalCount = 0;
      let answered = false;
      let speaking = false;

      container.innerHTML =
        '<div class="follow-view">' +
          '<div class="follow-stats">' +
            '<div class="follow-stat"><div class="num green" id="followCorrect">0</div><div class="label">正确</div></div>' +
            '<div class="follow-stat"><div class="num" id="followTotal">0</div><div class="label">总计</div></div>' +
            '<div class="follow-stat"><div class="num blue" id="followAcc">0%</div><div class="label">准确率</div></div>' +
          '</div>' +
          '<div class="follow-card" id="followCard"></div>' +
          '<button class="btn btn-sm" id="followSkipBtn">🔄 跳过 / 重新朗读</button>' +
        '</div>';

      if (!Speech.audioSupported) {
        const warn = document.createElement('p');
        warn.className = 'warn';
        warn.textContent = '⚠ 当前浏览器不支持 Web Audio API，无法播放语音';
        container.appendChild(warn);
      } else if (!Speech.settings.enabled) {
        const warn = document.createElement('p');
        warn.className = 'warn';
        warn.textContent = '⚠ 语音功能已关闭，请在首页开启';
        container.appendChild(warn);
      }

      function pickAndSpeak() {
        const letter = LETTERS[Math.floor(Math.random() * LETTERS.length)];
        currentLetter = letter;
        result = null;
        answered = false;
        speaking = true;
        renderCard();
        // 播放字母，播放过程中用户即可输入（边听边答）
        Speech.speakNow(letter, function () {
          speaking = false;
          if (!answered) {
            // 还没答，刷新一下卡片的状态提示
            renderCard();
          }
        });
      }

      function renderCard() {
        const card = document.getElementById('followCard');
        if (result) {
          if (result.correct) {
            card.innerHTML = '<div class="follow-icon">✅</div>' +
              '<p style="font-size:20px;font-weight:700;color:var(--green);">正确！ ' + currentLetter + '</p>' +
              (speaking ? '<p style="font-size:13px;color:var(--muted-foreground);margin-top:8px;">🔊 正在播放</p>' : '');
          } else {
            card.innerHTML = '<div class="follow-icon">❌</div>' +
              '<p style="font-size:18px;margin-bottom:4px;">你输入了 <span style="color:var(--red);font-weight:700;font-size:20px;">' + result.answer + '</span></p>' +
              '<p style="font-size:18px;color:var(--muted-foreground);">正确的是 <span style="color:var(--green);font-weight:700;font-size:24px;">' + currentLetter + '</span></p>' +
              (speaking ? '<p style="font-size:13px;color:var(--muted-foreground);margin-top:8px;">🔊 正在播放</p>' : '');
          }
        } else {
          // 答题阶段（播放中即可输入）
          const hint = speaking
            ? '<p style="font-size:14px;color:var(--muted-foreground);margin-top:8px;">🔊 仔细听，边听边答</p>'
            : '<p style="font-size:14px;color:var(--muted-foreground);margin-top:8px;">已播放完，请尽快作答</p>';
          card.innerHTML = '<div class="follow-icon follow-pulse">🎧</div>' +
            '<p style="font-size:20px;font-weight:700;margin-bottom:8px;">请输入你听到的字母</p>' +
            '<div class="follow-question"><span>' + (speaking ? '🔊' : '?') + '</span></div>' +
            hint;
        }
      }

      function updateFollowStats() {
        document.getElementById('followCorrect').textContent = correctCount;
        document.getElementById('followTotal').textContent = totalCount;
        const acc = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
        document.getElementById('followAcc').textContent = acc + '%';
      }

      practiceState.keyHandler = function (e) {
        if (e.repeat) return;
        if (e.key.length !== 1 || !/[a-zA-Z]/.test(e.key)) return;
        if (answered || result) return;
        e.preventDefault();
        const typed = e.key.toUpperCase();
        const isCorrect = typed === currentLetter;
        totalCount++;
        if (isCorrect) correctCount++;
        result = { correct: isCorrect, answer: typed };
        answered = true;
        renderCard();
        updateFollowStats();
        setTimeout(pickAndSpeak, isCorrect ? 800 : 1500);
      };
      window.addEventListener('keydown', practiceState.keyHandler);

      document.getElementById('followSkipBtn').onclick = pickAndSpeak;

      pickAndSpeak();
    }

    // ============ 虚拟键盘 ============
    let pressedKeyLabel = null;
    let kbPressTimer = null;

    function renderVirtualKeyboard() {
      const container = document.getElementById('virtualKeyboard');
      container.innerHTML = '';
      QWERTY_LAYOUT.forEach(row => {
        const rowEl = document.createElement('div');
        rowEl.className = 'kb-row';
        row.forEach(key => {
          const keyEl = document.createElement('div');
          keyEl.className = 'kb-key';
          keyEl.dataset.code = key.code;
          keyEl.dataset.label = key.label.toUpperCase();
          keyEl.textContent = key.label.length > 2 ? key.label.slice(0, 3) : key.label;
          if (key.width) keyEl.style.flex = key.width;
          rowEl.appendChild(keyEl);
        });
        container.appendChild(rowEl);
      });
    }

    function updateKeyboardHighlight(pressedKey) {
      // 清除旧高亮
      document.querySelectorAll('.kb-key.pressed').forEach(el => el.classList.remove('pressed'));
      if (!pressedKey) return;

      const upper = pressedKey.toUpperCase();
      let matched = null;
      for (const row of QWERTY_LAYOUT) {
        for (const key of row) {
          if (key.label.toUpperCase() === upper || key.code === 'Key' + upper) {
            matched = key.label.toUpperCase();
            break;
          }
        }
        if (matched) break;
      }
      const label = matched || upper;
      const els = document.querySelectorAll('.kb-key[data-label="' + label + '"]');
      els.forEach(el => el.classList.add('pressed'));
    }

    // 全局键盘监听用于虚拟键盘高亮
    window.addEventListener('keydown', function (e) {
      if (e.repeat) return;
      const key = e.key.length === 1 ? e.key.toUpperCase() : e.key;
      pressedKeyLabel = key;
      updateKeyboardHighlight(key);
      if (kbPressTimer) clearTimeout(kbPressTimer);
      kbPressTimer = setTimeout(function () {
        pressedKeyLabel = null;
        updateKeyboardHighlight(null);
      }, 150);
    });
    window.addEventListener('keyup', function () {
      pressedKeyLabel = null;
      updateKeyboardHighlight(null);
    });

    // ============ 统计页 ============
    function renderStatsPage() {
      const history = getPracticeHistory();
      const totalSessions = history.length;
      const avgWPM = totalSessions > 0 ? Math.round(history.reduce((s, h) => s + h.stats.wpm, 0) / totalSessions) : 0;
      const avgAccuracy = totalSessions > 0 ? Math.round(history.reduce((s, h) => s + h.stats.accuracy, 0) / totalSessions * 10) / 10 : 0;
      const bestWPM = totalSessions > 0 ? Math.max.apply(null, history.map(h => h.stats.wpm)) : 0;

      const overviewGrid = document.getElementById('overviewGrid');
      overviewGrid.innerHTML =
        '<div class="overview-card"><div class="overview-num blue">' + totalSessions + '</div><div class="overview-label">练习次数</div></div>' +
        '<div class="overview-card"><div class="overview-num green">' + avgWPM + '</div><div class="overview-label">平均 WPM</div></div>' +
        '<div class="overview-card"><div class="overview-num purple">' + avgAccuracy + '%</div><div class="overview-label">平均准确率</div></div>' +
        '<div class="overview-card"><div class="overview-num amber">' + bestWPM + '</div><div class="overview-label">最高 WPM</div></div>';

      const list = document.getElementById('historyList');
      const clearBtn = document.getElementById('clearHistoryBtn');
      if (history.length === 0) {
        list.innerHTML = '<div class="history-empty">暂无练习记录，开始练习吧！</div>';
        clearBtn.style.display = 'none';
      } else {
        clearBtn.style.display = 'inline';
        const modeNames = { free:'自由练习', word:'单字练习', sentence:'句子练习', custom:'自定义练习', follow:'跟练模式' };
        let html = '';
        history.slice().reverse().forEach(session => {
          html += '<div class="history-item"><div class="history-item-inner">' +
            '<div><div class="history-mode">' + (modeNames[session.mode] || session.mode) + '</div>' +
            '<div class="history-date">' + new Date(session.date).toLocaleString('zh-CN') + '</div></div>' +
            '<div class="history-metrics">' +
              '<div class="history-metric"><div class="val blue">' + session.stats.wpm + '</div><div class="lbl">WPM</div></div>' +
              '<div class="history-metric"><div class="val green">' + session.stats.accuracy + '%</div><div class="lbl">准确率</div></div>' +
              '<div class="history-metric"><div class="val purple">' + formatTime(session.stats.elapsedTime) + '</div><div class="lbl">用时</div></div>' +
            '</div>' +
          '</div></div>';
        });
        list.innerHTML = html;
      }
    }

    // ============ 事件绑定 ============
    document.getElementById('logoBtn').onclick = () => showPage('home');
    document.getElementById('statsNavBtn').onclick = () => showPage(currentPage === 'stats' ? 'home' : 'stats');
    document.getElementById('themeBtn').onclick = () => {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(currentTheme);
    };
    document.getElementById('startPracticeBtn').onclick = () => {
      // 用户交互时启动 AudioContext 并预加载字母音频
      if (Speech.audioSupported) {
        Speech._ensureAudioCtx();
        Speech.preloadLetters();
      }
      goToPractice('free');
    };

    // 语音设置
    document.getElementById('voiceSelect').onchange = function (e) {
      Speech.updateSettings({ voiceURI: e.target.value });
    };
    document.getElementById('speechToggleBtn').onclick = function () {
      Speech.updateSettings({ enabled: !Speech.settings.enabled });
      this.textContent = Speech.settings.enabled ? '🔊' : '🔇';
    };
    document.getElementById('previewBtn').onclick = function () {
      // 试听：依次播放 A、B、C 三个字母（用当前选中的语音）
      Speech.speakSequence(['A', 'B', 'C']);
    };
    document.getElementById('volumeSlider').oninput = function (e) {
      const volume = parseFloat(e.target.value);
      Speech.updateSettings({ volume: volume });
      document.getElementById('volumeLabel').textContent = Math.round(volume * 100) + '%';
    };

    document.getElementById('clearHistoryBtn').onclick = function () {
      clearPracticeHistory();
      renderStatsPage();
    };

    document.getElementById('practiceBackBtn').onclick = function () {
      clearPracticeHandlers();
      Speech.stop();
      showPage('home');
    };

    // ============ 初始化 ============
    Speech.init();
    renderHome();
    renderVirtualKeyboard();
    renderPracticeTabs();

    // 监听系统主题变化
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      if (currentTheme === 'system') updateThemeBtn('system');
    });

  })();
  </script>
</body>
</html>
