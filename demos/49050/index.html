<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨愈 - 以字静心，笔迹识心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'STKaiti', 'KaiTi', '楷体', serif;
            background: linear-gradient(180deg, #f4f1ea 0%, #e8e3d9 100%);
            min-height: 100vh;
            overflow: hidden;
            color: #3d3d3d;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(180deg, rgba(244, 241, 234, 0.95) 0%, rgba(244, 241, 234, 0) 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 20px;
            pointer-events: none;
        }

        .header-title {
            font-size: 48px;
            font-weight: bold;
            color: #2c2c2c;
            letter-spacing: 12px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .header-title::before,
        .header-title::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #8b7355, transparent);
            top: 50%;
            transform: translateY(-50%);
        }

        .header-title::before {
            left: -80px;
        }

        .header-title::after {
            right: -80px;
        }

        .header-subtitle {
            font-size: 18px;
            color: #6b5b4f;
            letter-spacing: 8px;
            margin-top: 8px;
            font-weight: normal;
        }

        .ink-bg {
            position: absolute;
            top: -100px;
            left: -100px;
            width: 800px;
            height: 400px;
            background: radial-gradient(ellipse at 30% 70%, rgba(139, 115, 85, 0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .ink-bg-right {
            position: absolute;
            top: -50px;
            right: -100px;
            width: 600px;
            height: 500px;
            background: radial-gradient(ellipse at 70% 30%, rgba(139, 115, 85, 0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        .main-container {
            display: flex;
            height: 100vh;
            padding-top: 120px;
        }

        .canvas-area {
            flex: 1;
            position: relative;
            margin-right: 320px;
        }

        #canvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
            background: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%238b7355' fill-opacity='0.03' fill-rule='evenodd'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40'/%3E%3C/g%3E%3C/svg%3E");
        }

        .brush-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.7);
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(139, 115, 85, 0.2);
        }

        .control-label {
            font-size: 14px;
            color: #5a4a3e;
            letter-spacing: 2px;
        }

        input[type="range"] {
            width: 120px;
            height: 4px;
            -webkit-appearance: none;
            background: #e0d8cc;
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #5a4a3e;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .density-value {
            font-size: 14px;
            color: #5a4a3e;
            min-width: 40px;
            text-align: center;
        }

        .sidebar {
            position: fixed;
            right: 0;
            top: 120px;
            bottom: 0;
            width: 320px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(139, 115, 85, 0.2);
            padding: 24px;
            display: flex;
            flex-direction: column;
            z-index: 50;
        }

        .panel-title {
            font-size: 20px;
            color: #2c2c2c;
            letter-spacing: 6px;
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(139, 115, 85, 0.2);
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px dashed rgba(139, 115, 85, 0.1);
        }

        .data-label {
            font-size: 16px;
            color: #5a4a3e;
            letter-spacing: 2px;
        }

        .data-value {
            font-size: 24px;
            font-weight: bold;
            color: #2c2c2c;
            font-family: 'STSong', 'SimSun', serif;
        }

        .data-unit {
            font-size: 12px;
            color: #8b7355;
            margin-left: 4px;
        }

        .action-buttons {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'STKaiti', 'KaiTi', serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #5a4a3e 0%, #3d3d3d 100%);
            color: #f4f1ea;
            box-shadow: 0 4px 12px rgba(90, 74, 62, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(90, 74, 62, 0.4);
        }

        .btn-secondary {
            background: rgba(139, 115, 85, 0.1);
            color: #5a4a3e;
            border: 1px solid rgba(139, 115, 85, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(139, 115, 85, 0.2);
        }

        .result-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 320px;
            height: 0;
            background: rgba(244, 241, 234, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(139, 115, 85, 0.2);
            transition: height 0.5s ease;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 0 40px;
            z-index: 60;
        }

        .result-panel.show {
            height: 200px;
        }

        .result-content {
            display: flex;
            align-items: center;
            gap: 40px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .mood-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            background: rgba(139, 115, 85, 0.1);
        }

        .mood-info {
            flex: 1;
        }

        .mood-title {
            font-size: 28px;
            font-weight: bold;
            color: #2c2c2c;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .mood-desc {
            font-size: 16px;
            color: #6b5b4f;
            line-height: 1.8;
            max-width: 600px;
        }

        .image-preview {
            width: 120px;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(139, 115, 85, 0.3);
            background-size: cover;
            background-position: center;
        }

        .audio-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .audio-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #8b7355 0%, #5a4a3e 100%);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .audio-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(139, 115, 85, 0.4);
        }

        .audio-btn.playing {
            animation: pulse 2s infinite;
        }

        .audio-label {
            font-size: 12px;
            color: #8b7355;
            letter-spacing: 2px;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(139, 115, 85, 0.4);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(139, 115, 85, 0);
            }
        }

        .ink-splash {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 1200px) {
            .sidebar {
                width: 280px;
            }
            .canvas-area {
                margin-right: 280px;
            }
            .result-panel {
                right: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="ink-bg"></div>
        <div class="ink-bg-right"></div>
        <h1 class="header-title">墨愈</h1>
        <p class="header-subtitle">以字静心，笔迹识心</p>
    </div>

    <div class="main-container">
        <div class="canvas-area">
            <canvas id="canvas"></canvas>
            <div class="brush-controls">
                <span class="control-label">笔墨浓淡</span>
                <input type="range" id="density-slider" min="10" max="80" value="40">
                <span class="density-value" id="density-value">40%</span>
            </div>
        </div>

        <div class="sidebar">
            <h2 class="panel-title">书写数据</h2>
            
            <div class="data-item">
                <span class="data-label">书写速度</span>
                <span class="data-value"><span id="speed-value">0</span><span class="data-unit">px/s</span></span>
            </div>
            
            <div class="data-item">
                <span class="data-label">停顿次数</span>
                <span class="data-value"><span id="pause-value">0</span></span>
            </div>
            
            <div class="data-item">
                <span class="data-label">笔画断连</span>
                <span class="data-value"><span id="break-value">0</span></span>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" id="analyze-btn">心境解析</button>
                <button class="btn btn-secondary" id="clear-btn">清空画布</button>
                <button class="btn btn-secondary" id="reset-btn">重新书写</button>
            </div>
        </div>
    </div>

    <div class="result-panel" id="result-panel">
        <div class="result-content">
            <div class="mood-icon" id="mood-icon">🎐</div>
            <div class="mood-info">
                <div class="mood-title" id="mood-title">心境平和</div>
                <div class="mood-desc" id="mood-desc">心若止水，万物皆静。</div>
            </div>
            <div class="image-preview" id="image-preview"></div>
            <div class="audio-controls">
                <button class="audio-btn" id="audio-btn">🌧️</button>
                <span class="audio-label" id="audio-label">雨声</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let lastTime = 0;
        let density = 40;
        
        let writingData = {
            speed: 0,
            pauseCount: 0,
            breakCount: 0,
            totalDistance: 0,
            totalTime: 0,
            points: [],
            lastPointTime: 0
        };
        
        let audioContext = null;
        let isPlaying = false;
        let rainOscillators = [];
        let guqinOscillators = [];

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            initCanvasStyle();
        }

        function initCanvasStyle() {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#2c2c2c';
        }

        function updateDensity(value) {
            density = parseInt(value);
            document.getElementById('density-value').textContent = density + '%';
        }

        function getBrushWidth(pressure = 0.5) {
            return density * (0.3 + pressure * 0.7) / 10;
        }

        function getBrushOpacity(pressure = 0.5) {
            return 0.3 + (density / 100) * pressure * 0.7;
        }

        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
            lastTime = Date.now();
            writingData.lastPointTime = lastTime;
            writingData.points = [{ x: lastX, y: lastY, time: lastTime }];
        }

        function draw(e) {
            if (!isDrawing) return;
            
            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;
            const currentTime = Date.now();
            
            const distance = Math.sqrt(
                Math.pow(currentX - lastX, 2) + Math.pow(currentY - lastY, 2)
            );
            const timeDiff = currentTime - lastTime;
            
            if (timeDiff > 0) {
                const speed = distance / (timeDiff / 1000);
                writingData.totalDistance += distance;
                writingData.totalTime += timeDiff;
                
                if (timeDiff > 500 && distance < 5) {
                    writingData.pauseCount++;
                }
                
                if (timeDiff > 200 && distance < 2) {
                    writingData.breakCount++;
                }
                
                writingData.speed = Math.round(writingData.totalDistance / (writingData.totalTime / 1000) || 0);
                
                document.getElementById('speed-value').textContent = writingData.speed;
                document.getElementById('pause-value').textContent = writingData.pauseCount;
                document.getElementById('break-value').textContent = writingData.breakCount;
            }
            
            const pressure = Math.min(distance / 20, 1);
            const brushWidth = getBrushWidth(pressure);
            const brushOpacity = getBrushOpacity(pressure);
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(currentX, currentY);
            ctx.lineWidth = brushWidth;
            ctx.strokeStyle = `rgba(44, 44, 44, ${brushOpacity})`;
            ctx.stroke();
            
            const blurWidth = brushWidth * 1.5;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(currentX, currentY);
            ctx.lineWidth = blurWidth;
            ctx.strokeStyle = `rgba(139, 115, 85, ${brushOpacity * 0.3})`;
            ctx.stroke();
            
            lastX = currentX;
            lastY = currentY;
            lastTime = currentTime;
            writingData.points.push({ x: currentX, y: currentY, time: currentTime });
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function resetData() {
            writingData = {
                speed: 0,
                pauseCount: 0,
                breakCount: 0,
                totalDistance: 0,
                totalTime: 0,
                points: [],
                lastPointTime: 0
            };
            document.getElementById('speed-value').textContent = '0';
            document.getElementById('pause-value').textContent = '0';
            document.getElementById('break-value').textContent = '0';
            clearCanvas();
            document.getElementById('result-panel').classList.remove('show');
            stopAudio();
        }

        const moodThemes = {
            anxious: {
                title: '浮躁焦虑',
                icon: '🍂',
                desc: '疾风骤雨，心乱如麻。放下执念，静听竹声。',
                image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Chinese%20ink%20wash%20painting%20of%20wind%20blowing%20through%20dry%20bamboo%20forest%2C%20stormy%20atmosphere%2C%20traditional%20style%2C%20minimal%2C%20monochrome&image_size=portrait_4_3',
                audio: 'rain'
            },
            tired: {
                title: '疲惫紧绷',
                icon: '🌧️',
                desc: '空山新雨，洗涤尘埃。闭目凝神，静待花开。',
                image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Chinese%20ink%20wash%20painting%20of%20misty%20mountains%20in%20autumn%20rain%2C%20serene%20atmosphere%2C%20traditional%20style%2C%20minimal%2C%20monochrome&image_size=portrait_4_3',
                audio: 'rain'
            },
            calm: {
                title: '内心平静',
                icon: '☁️',
                desc: '远山云海，天地悠悠。心若止水，万物皆安。',
                image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Chinese%20ink%20wash%20painting%20of%20distant%20mountains%20above%20clouds%2C%20peaceful%20sky%2C%20traditional%20style%2C%20minimal%2C%20monochrome&image_size=portrait_4_3',
                audio: 'guqin'
            }
        };

        function analyzeMood() {
            const avgSpeed = writingData.speed;
            const pauseCount = writingData.pauseCount;
            const breakCount = writingData.breakCount;
            
            let mood = 'calm';
            
            if (avgSpeed > 150 || breakCount > 5 || (pauseCount > 3 && avgSpeed > 80)) {
                mood = 'anxious';
            } else if (avgSpeed < 50 && pauseCount > 5) {
                mood = 'tired';
            }
            
            const theme = moodThemes[mood];
            
            document.getElementById('mood-icon').textContent = theme.icon;
            document.getElementById('mood-title').textContent = theme.title;
            document.getElementById('mood-desc').textContent = theme.desc;
            document.getElementById('image-preview').style.backgroundImage = `url(${theme.image})`;
            
            const audioBtn = document.getElementById('audio-btn');
            const audioLabel = document.getElementById('audio-label');
            
            if (theme.audio === 'rain') {
                audioBtn.textContent = '🌧️';
                audioLabel.textContent = '雨声';
            } else {
                audioBtn.textContent = '🎐';
                audioLabel.textContent = '古琴';
            }
            
            audioBtn.dataset.type = theme.audio;
            
            document.getElementById('result-panel').classList.add('show');
            
            setTimeout(() => {
                playAudio(theme.audio);
            }, 1000);
        }

        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playRainSound() {
            initAudioContext();
            
            const bufferSize = audioContext.sampleRate * 2;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(Math.random(), 3);
            }
            
            for (let i = 0; i < 20; i++) {
                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                
                const filter = audioContext.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 800 + Math.random() * 400;
                
                const gainNode = audioContext.createGain();
                gainNode.gain.value = 0.03 + Math.random() * 0.02;
                
                source.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                source.start(Math.random() * 0.5);
                source.loop = true;
                
                rainOscillators.push({ source, filter, gainNode });
            }
        }

        function playGuqinSound() {
            initAudioContext();
            
            const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88];
            
            function playNote() {
                if (!isPlaying) return;
                
                const note = notes[Math.floor(Math.random() * notes.length)];
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                const filter = audioContext.createBiquadFilter();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(note, audioContext.currentTime);
                
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, audioContext.currentTime);
                
                gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.08, audioContext.currentTime + 0.1);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 3);
                
                oscillator.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 3);
                
                guqinOscillators.push({ oscillator, gainNode, filter });
                
                setTimeout(playNote, 1500 + Math.random() * 2000);
            }
            
            playNote();
        }

        function playAudio(type) {
            stopAudio();
            isPlaying = true;
            
            document.getElementById('audio-btn').classList.add('playing');
            
            if (type === 'rain') {
                playRainSound();
            } else {
                playGuqinSound();
            }
        }

        function stopAudio() {
            isPlaying = false;
            
            rainOscillators.forEach(o => {
                o.source.stop();
                o.source.disconnect();
                o.filter.disconnect();
                o.gainNode.disconnect();
            });
            rainOscillators = [];
            
            guqinOscillators.forEach(o => {
                o.oscillator.stop();
                o.oscillator.disconnect();
                o.gainNode.disconnect();
                o.filter.disconnect();
            });
            guqinOscillators = [];
            
            document.getElementById('audio-btn').classList.remove('playing');
        }

        function toggleAudio() {
            const audioBtn = document.getElementById('audio-btn');
            const type = audioBtn.dataset.type || 'rain';
            
            if (isPlaying) {
                stopAudio();
            } else {
                playAudio(type);
            }
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        
        document.getElementById('density-slider').addEventListener('input', (e) => {
            updateDensity(e.target.value);
        });
        
        document.getElementById('clear-btn').addEventListener('click', clearCanvas);
        document.getElementById('reset-btn').addEventListener('click', resetData);
        document.getElementById('analyze-btn').addEventListener('click', analyzeMood);
        document.getElementById('audio-btn').addEventListener('click', toggleAudio);
        
        window.addEventListener('resize', resizeCanvas);
        
        resizeCanvas();
    </script>
</body>
</html>
