    .progress-overlay {

      font-size: 1.3rem; margin-bottom: 1.2rem;

    .video-player {
      background: #000; border-radius: 12px;

    }
    .video-player img, .video-player video {
      width: 100%; height: 100%; object-fit: contain;
    }
    .play-btn {
      position: absolute;
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(255,255,255,0.9);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s;
    }
    .play-btn:hover { transform: scale(1.1); }
    .play-btn svg { width: 24px; height: 24px; fill: var(--accent); margin-left: 3px; }
    .result-actions {
      display: flex; gap: 1rem; margin-top: 1.2rem;
    }
    .result-actions button {
      flex: 1; padding: 0.8rem;
      border-radius: 10px; border: none;
      font-size: 0.95rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    .result-actions .primary { background: var(--accent); color: #fff; }
    .result-actions .primary:hover { background: #234a3c; }
    .result-actions .secondary { background: var(--bg); color: var(--ink); border: 1px solid var(--rule); }
    .result-actions .secondary:hover { border-color: var(--accent); }

    /* Responsive */
    @media (max-width: 900px) {
      .app-container { grid-template-columns: 1fr; }
      .nav-links { display: none; }
      .style-grid { grid-template-columns: repeat(3, 1fr); }

    @media (max-width: 600px) {
      .app-container, .result-section { padding: 1rem; }
      .panel { padding: 1.2rem; }
      .style-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>

<nav>
  <div class="nav-inner">
    <a href="#" class="logo">旅剪</a>
    <ul class="nav-links">
      <li><a href="#">我的作品</a></li>
      <li><a href="#">模板中心</a></li>
      <li><a href="#" class="btn-small">登录</a></li>
    </ul>
  </div>
</nav>

<div class="app-container">
  <!-- Left: Upload & Preview -->
  <div>
    <div class="panel">
      <h2><span class="num">1</span>上传旅行素材</h2>
      <div class="upload-zone" id="uploadZone">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <p>点击或拖拽视频/图片到此处上传</p>

  <div>
    <div class="panel">

      <textarea id="descInput" placeholder="例如：帮我把云南的素材剪成一个30秒的治愈系短片，配上轻音乐和字幕，整体想要温暖胶片的感觉..."></textarea>
      <div class="char-count"><span id="charCount">0</span> / 200</div>

      <div style="margin-top:1.2rem;">
        <label>选择风格</label>
        <div class="style-grid" id="styleGrid">
          <div class="style-chip active" data-style="胶片">胶片</div>
          <div class="style-chip" data-style="清新">清新</div>
          <div class="style-chip" data-style="电影感">电影感</div>
          <div class="style-chip" data-style="复古">复古</div>

          <option>智能推荐（根据内容自动匹配）</option>
          <option>轻音乐 / 治愈</option>
          <option>电子 / 节奏感</option>
          <option>民谣 / 叙事感</option>

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>

        </button>

<!-- Progress Overlay -->
<div class="progress-overlay" id="progressOverlay">
  <div class="spinner"></div>
  <p>正在分析素材并智能剪辑...</p>
  <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
  <p class="progress-text" id="progressText">识别画面内容...</p>
</div>

<!-- Result Section -->
<div class="result-section" id="resultSection">
  <h2>剪辑完成</h2>
  <div class="video-player" id="videoPlayer">
    <div id="resultPlaceholder" style="color:#fff;text-align:center;padding:2rem;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:1rem;opacity:0.6;"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="22" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
      <p style="opacity:0.8;">演示模式下，此处将展示生成的视频预览</p>
      <p style="font-size:0.85rem;opacity:0.5;margin-top:0.5rem;">实际产品将调用AI剪辑引擎生成真实视频</p>
    </div>
    <button class="play-btn" id="playBtn" style="display:none;">
      <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
  </div>
  <div class="result-actions">
    <button class="primary">下载视频</button>
    <button class="secondary">重新剪辑</button>
    <button class="secondary">分享</button>
  </div>
</div>

<script>
(function() {
  const uploadZone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('fileInput');
  const thumbGrid = document.getElementById('thumbGrid');
  const descInput = document.getElementById('descInput');
  const charCount = document.getElementById('charCount');
  const styleGrid = document.getElementById('styleGrid');
  const btnGenerate = document.getElementById('btnGenerate');
  const progressOverlay = document.getElementById('progressOverlay');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const resultSection = document.getElementById('resultSection');
  const resultPlaceholder = document.getElementById('resultPlaceholder');
  const playBtn = document.getElementById('playBtn');

  let files = [];

  // Upload interactions
  uploadZone.addEventListener('click', () => fileInput.click());
  uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', () => handleFiles(fileInput.files));

  function handleFiles(fileList) {
    const newFiles = Array.from(fileList).slice(0, 20 - files.length);
    if (newFiles.length === 0) return;
    files = files.concat(newFiles);
    renderThumbs();
  }

  function renderThumbs() {
    thumbGrid.innerHTML = '';
    files.forEach((file, idx) => {
      const div = document.createElement('div');
      div.className = 'thumb-item';
      const url = URL.createObjectURL(file);
      if (file.type.startsWith('video/')) {
        const video = document.createElement('video');
        video.src = url; video.muted = true; video.playsInline = true;
        div.appendChild(video);
        const dur = document.createElement('span');
        dur.className = 'dur';
        video.addEventListener('loadedmetadata', () => {
          const m = Math.floor(video.duration / 60);
          const s = Math.floor(video.duration % 60);
          dur.textContent = (m > 0 ? m + ':' : '') + (s < 10 ? '0' : '') + s;
        });
        div.appendChild(dur);
      } else {
        const img = document.createElement('img');
        img.src = url;
        div.appendChild(img);
      }
      const rm = document.createElement('button');
      rm.className = 'remove'; rm.textContent = '\u00d7';
      rm.addEventListener('click', (e) => { e.stopPropagation(); files.splice(idx, 1); renderThumbs(); });
      div.appendChild(rm);
      thumbGrid.appendChild(div);
    });
  }

  // Character count
  descInput.addEventListener('input', () => {
    const len = descInput.value.length;
    charCount.textContent = len;
    if (len > 200) { descInput.value = descInput.value.slice(0, 200); charCount.textContent = 200; }
  });

  // Style chips
  styleGrid.addEventListener('click', (e) => {
    if (!e.target.classList.contains('style-chip')) return;
    styleGrid.querySelectorAll('.style-chip').forEach(c => c.classList.remove('active'));
    e.target.classList.add('active');
  });

  // Generate
  btnGenerate.addEventListener('click', () => {
    if (files.length === 0) { alert('请先上传素材'); return; }
    if (!descInput.value.trim()) { alert('请描述你想要的视频效果'); return; }

    progressOverlay.classList.add('active');
    resultSection.classList.remove('active');
    let pct = 0;
    const steps = [
      { t: 800, p: 15, m: '识别画面内容...' },
      { t: 1800, p: 35, m: '分析场景与情绪...' },
      { t: 3000, p: 55, m: '智能选取最佳片段...' },
      { t: 4500, p: 75, m: '自动卡点与转场...' },
      { t: 6000, p: 90, m: '调色与添加字幕...' },
      { t: 7500, p: 100, m: '生成完成' }
    ];
    steps.forEach(s => {
      setTimeout(() => {
        progressFill.style.width = s.p + '%';
        progressText.textContent = s.m;
        if (s.p === 100) {
          setTimeout(() => {
            progressOverlay.classList.remove('active');
            resultSection.classList.add('active');
            resultSection.scrollIntoView({ behavior: 'smooth' });
            // Show first image/video as "result" demo
            if (files[0].type.startsWith('video/')) {
              const v = document.createElement('video');
              v.src = URL.createObjectURL(files[0]);
              v.controls = true; v.style.width = '100%';
              resultPlaceholder.replaceWith(v);
            } else {
              const img = document.createElement('img');
              img.src = URL.createObjectURL(files[0]);
              resultPlaceholder.replaceWith(img);
            }
            playBtn.style.display = 'none';
          }, 600);
        }
      }, s.t);
    });
  });
})();
</script>

</body>
</html>
