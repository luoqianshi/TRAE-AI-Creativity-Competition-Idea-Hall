<body>

  <div class="container">
    <!-- 头部 -->
    <header>
      <h1>灵感手记</h1>
      <p class="subtitle">随时记录，随时创作</p>
      <div class="divider"></div>
    </header>

    <!-- 标签页切换 -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="write">记录灵感</button>
      <button class="tab-btn" data-tab="list">灵感库</button>
      <button class="tab-btn" data-tab="stats">统计</button>
      <button class="tab-btn" data-tab="export">导出</button>
    </div>

    <!-- 记录灵感 -->
    <div id="tab-write" class="tab-content active">
      <div class="card">
        <div class="input-group">
          <label for="title">标题</label>
          <input type="text" id="title" placeholder="给你的灵感起个名字...">
        </div>
        <div class="input-group">
          <label for="category">分类</label>
          <select id="category">
            <option value="情节">情节构思</option>
            <option value="人物">人物设定</option>
            <option value="对话">对话片段</option>
            <option value="场景">场景描写</option>
            <option value="主题">主题思想</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="input-group">
          <label for="content">灵感内容</label>
          <textarea id="content" placeholder="在这里写下你的灵感...&#10;&#10;比如：&#10;- 一个突如其来的情节转折&#10;- 一段有趣的对话&#10;- 一个角色的性格特点&#10;- 一个场景的氛围描写"></textarea>
        </div>
        <div class="input-group">
          <label>标签</label>
          <div class="tag-input-wrapper" id="tagWrapper">
            <input type="text" class="tag-input" id="tagInput" placeholder="输入标签后按回车...">
          </div>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="saveBtn">保存灵感</button>
          <button class="btn btn-secondary" id="clearBtn">清空</button>
        </div>
      </div>
    </div>

    <!-- 灵感库 -->
    <div id="tab-list" class="tab-content">
      <div class="search-box">
        <span class="search-icon">&#128269;</span>
        <input type="text" id="searchInput" placeholder="搜索标题、内容或标签...">
      </div>
      <div class="filter-bar">
        <label>筛选：</label>
        <button class="filter-chip active" data-filter="all">全部</button>
        <button class="filter-chip" data-filter="情节">情节</button>
        <button class="filter-chip" data-filter="人物">人物</button>
        <button class="filter-chip" data-filter="对话">对话</button>
        <button class="filter-chip" data-filter="场景">场景</button>
        <button class="filter-chip" data-filter="主题">主题</button>
        <button class="filter-chip" data-filter="其他">其他</button>
      </div>
      <div id="inspirationList" class="inspiration-list">
        <!-- 动态生成 -->
      </div>
      <div id="emptyState" class="empty-state" style="display:none;">
        <div class="empty-icon">&#128221;</div>
        <p>还没有记录任何灵感，去写第一条吧！</p>
      </div>
    </div>

    <!-- 统计 -->
    <div id="tab-stats" class="tab-content">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number" id="statTotal">0</div>
          <div class="stat-label">总灵感数</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="statThisWeek">0</div>
          <div class="stat-label">本周新增</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="statThisMonth">0</div>
          <div class="stat-label">本月新增</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="statCategories">0</div>
          <div class="stat-label">涉及分类</div>
        </div>
      </div>
      <div class="card">
        <h3 style="font-family:'Lora',serif;margin-bottom:1rem;">分类分布</h3>
        <div id="categoryChart" style="width:100%;min-height:300px"></div>
      </div>
    </div>

    <!-- 导出 -->
    <div id="tab-export" class="tab-content">
      <div class="card">
        <h3 style="font-family:'Lora',serif;margin-bottom:1.2rem;">导出灵感</h3>
        <div class="export-options">
          <div class="export-card" id="exportJson">
            <div class="export-icon">&#128190;</div>
            <h3>导出 JSON</h3>
            <p>导出为结构化数据文件</p>
          </div>
          <div class="export-card" id="exportTxt">
            <div class="export-icon">&#128196;</div>
            <h3>导出文本</h3>
            <p>导出为纯文本格式</p>
          </div>
          <div class="export-card" id="exportMd">
            <div class="export-icon">&#128211;</div>
            <h3>导出 Markdown</h3>
            <p>导出为 Markdown 文档</p>
          </div>
        </div>
      </div>
      <div class="card" style="margin-top:1.5rem;">
        <h3 style="font-family:'Lora',serif;margin-bottom:1.2rem;">数据管理</h3>
        <div class="btn-group">
          <button class="btn btn-secondary" id="importBtn">导入数据</button>
          <input type="file" id="importFile" accept=".json" style="display:none">
          <button class="btn btn-danger" id="clearAllBtn">清空所有数据</button>
        </div>
      </div>
    </div>

    <!-- 页脚 -->
    <footer>
      <p>灵感手记 - 让创作无处不在</p>
    </footer>
  </div>

  <!-- 详情弹窗 -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">灵感详情</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="meta">
          <span id="modalCategory">分类</span>
          <span id="modalDate">日期</span>
        </div>
        <div class="content-text" id="modalContent"></div>
        <div class="tag-list" id="modalTags"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modalEdit">编辑</button>
        <button class="btn btn-danger" id="modalDelete">删除</button>
      </div>
    </div>
  </div>

  <script src="./_shared/js/echarts.min.js"></script>
  <script>
    // ===== 数据存储 =====
    const STORAGE_KEY = 'writer_inspiration_data';
    let inspirations = [];
    let currentTags = [];
    let currentEditId = null;
    let currentDetailId = null;

    function loadData() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) {
          inspirations = JSON.parse(data);
        }
      } catch (e) {
        console.error('加载数据失败', e);
        inspirations = [];
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(inspirations));
      } catch (e) {
        console.error('保存数据失败', e);
        alert('保存失败，可能是存储空间不足');
      }
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }

    // ===== 标签输入 =====
    const tagWrapper = document.getElementById('tagWrapper');
    const tagInput = document.getElementById('tagInput');

    tagInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const tag = this.value.trim();
        if (tag && !currentTags.includes(tag)) {
          currentTags.push(tag);
          renderTags();
        }
        this.value = '';
      } else if (e.key === 'Backspace' && !this.value && currentTags.length > 0) {
        currentTags.pop();
        renderTags();
      }
    });

    function renderTags() {
      const existing = tagWrapper.querySelectorAll('.tag-chip');
      existing.forEach(el => el.remove());
      currentTags.forEach((tag, index) => {
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        chip.innerHTML = tag + '<span class="remove-tag" data-index="' + index + '">&times;</span>';
        tagWrapper.insertBefore(chip, tagInput);
      });
      tagWrapper.querySelectorAll('.remove-tag').forEach(btn => {
        btn.addEventListener('click', function() {
          const idx = parseInt(this.dataset.index);
          currentTags.splice(idx, 1);
          renderTags();
        });
      });
    }

    // ===== 标签页切换 =====
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const tab = this.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('tab-' + tab).classList.add('active');
        if (tab === 'list') renderList();
        if (tab === 'stats') renderStats();
      });
    });

    // ===== 保存灵感 =====
    document.getElementById('saveBtn').addEventListener('click', function() {
      const title = document.getElementById('title').value.trim();
      const category = document.getElementById('category').value;
      const content = document.getElementById('content').value.trim();
      if (!title || !content) {
        alert('请填写标题和内容');
        return;
      }
      const inspiration = {
        id: currentEditId || generateId(),
        title,
        category,
        content,
        tags: [...currentTags],
        createdAt: currentEditId ? inspirations.find(i => i.id === currentEditId).createdAt : new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      if (currentEditId) {
        const idx = inspirations.findIndex(i => i.id === currentEditId);
        if (idx !== -1) inspirations[idx] = inspiration;
        currentEditId = null;
        this.textContent = '保存灵感';
      } else {
        inspirations.unshift(inspiration);
      }
      saveData();
      clearForm();
      alert('灵感已保存！');
    });

    // ===== 清空表单 =====
    function clearForm() {
      document.getElementById('title').value = '';
      document.getElementById('category').value = '情节';
      document.getElementById('content').value = '';
      currentTags = [];
      renderTags();
      currentEditId = null;
      document.getElementById('saveBtn').textContent = '保存灵感';
    }

    document.getElementById('clearBtn').addEventListener('click', clearForm);

    // ===== 渲染列表 =====
    function renderList() {
      const list = document.getElementById('inspirationList');
      const empty = document.getElementById('emptyState');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filter = document.querySelector('.filter-chip.active').dataset.filter;

      let filtered = inspirations;
      if (filter !== 'all') {
        filtered = filtered.filter(i => i.category === filter);
      }
      if (search) {
        filtered = filtered.filter(i =>
          i.title.toLowerCase().includes(search) ||
          i.content.toLowerCase().includes(search) ||
          i.tags.some(t => t.toLowerCase().includes(search))
        );
      }

      if (filtered.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      list.innerHTML = filtered.map(item => {
        const date = new Date(item.createdAt);
        const dateStr = date.getFullYear() + '-' +
          String(date.getMonth()+1).padStart(2,'0') + '-' +
          String(date.getDate()).padStart(2,'0') + ' ' +
          String(date.getHours()).padStart(2,'0') + ':' +
          String(date.getMinutes()).padStart(2,'0');
        return `
          <div class="inspiration-item slide-in" data-id="${item.id}">
            <div class="item-header">
              <div>
                <div class="item-title">${escapeHtml(item.title)}</div>
                <span style="font-size:0.8rem;color:var(--accent2);font-weight:500;">${item.category}</span>
              </div>
              <span class="item-date">${dateStr}</span>
            </div>
            <div class="item-preview">${escapeHtml(item.content)}</div>
            ${item.tags.length ? `<div class="item-tags">${item.tags.map(t => `<span class="item-tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
            <div class="item-actions">
              <button onclick="viewDetail('${item.id}')">查看</button>
              <button onclick="editInspiration('${item.id}')">编辑</button>
              <button class="btn-delete" onclick="deleteInspiration('${item.id}')">删除</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ===== 搜索和筛选 =====
    document.getElementById('searchInput').addEventListener('input', renderList);
    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', function() {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        renderList();
      });
    });

    // ===== 查看详情 =====
    function viewDetail(id) {
      const item = inspirations.find(i => i.id === id);
      if (!item) return;
      currentDetailId = id;
      document.getElementById('modalTitle').textContent = item.title;
      document.getElementById('modalCategory').textContent = item.category;
      const date = new Date(item.createdAt);
      document.getElementById('modalDate').textContent = date.getFullYear() + '-' +
        String(date.getMonth()+1).padStart(2,'0') + '-' +
        String(date.getDate()).padStart(2,'0') + ' ' +
        String(date.getHours()).padStart(2,'0') + ':' +
        String(date.getMinutes()).padStart(2,'0');
      document.getElementById('modalContent').textContent = item.content;
      document.getElementById('modalTags').innerHTML = item.tags.map(t =>
        `<span class="item-tag">${escapeHtml(t)}</span>`
      ).join('');
      document.getElementById('detailModal').classList.add('active');
    }

    document.getElementById('modalClose').addEventListener('click', function() {
      document.getElementById('detailModal').classList.remove('active');
    });
    document.getElementById('detailModal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('active');
    });

    // ===== 编辑 =====
    function editInspiration(id) {
      const item = inspirations.find(i => i.id === id);
      if (!item) return;
      currentEditId = id;
      document.getElementById('title').value = item.title;
      document.getElementById('category').value = item.category;
      document.getElementById('content').value = item.content;
      currentTags = [...item.tags];
      renderTags();
      document.getElementById('saveBtn').textContent = '更新灵感';
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelector('[data-tab="write"]').classList.add('active');
      document.getElementById('tab-write').classList.add('active');
      document.getElementById('detailModal').classList.remove('active');
    }
    document.getElementById('modalEdit').addEventListener('click', function() {
      if (currentDetailId) editInspiration(currentDetailId);
    });

    // ===== 删除 =====
    function deleteInspiration(id) {
      if (!confirm('确定要删除这条灵感吗？')) return;
      inspirations = inspirations.filter(i => i.id !== id);
      saveData();
      renderList();
      document.getElementById('detailModal').classList.remove('active');
    }
    document.getElementById('modalDelete').addEventListener('click', function() {
      if (currentDetailId) deleteInspiration(currentDetailId);
    });

    // ===== 统计 =====
    function renderStats() {
      const now = new Date();
      const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
      const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);

      document.getElementById('statTotal').textContent = inspirations.length;
      document.getElementById('statThisWeek').textContent = inspirations.filter(i => new Date(i.createdAt) >= weekAgo).length;
      document.getElementById('statThisMonth').textContent = inspirations.filter(i => new Date(i.createdAt) >= monthAgo).length;
      const categories = new Set(inspirations.map(i => i.category));
      document.getElementById('statCategories').textContent = categories.size;

      // 分类图表
      const categoryCounts = {};
      inspirations.forEach(i => {
        categoryCounts[i.category] = (categoryCounts[i.category] || 0) + 1;
      });
      const chartData = Object.entries(categoryCounts).map(([name, value]) => ({ name, value }));

      const chart = echarts.init(document.getElementById('categoryChart'), null, { renderer: 'svg' });
      const style = getComputedStyle(document.documentElement);
      const accent = style.getPropertyValue('--accent').trim();
      const accent2 = style.getPropertyValue('--accent2').trim();
      const muted = style.getPropertyValue('--muted').trim();
      const ink = style.getPropertyValue('--ink').trim();

      chart.setOption({
        animation: false,
        tooltip: { trigger: 'item', appendToBody: true },
        color: [accent, accent2, '#D4A574', '#7B9E87', '#B8A9C9', '#E8A87C'],
        series: [{
          type: 'pie',
          radius: ['40%', '70%'],
          avoidLabelOverlap: true,
          itemStyle: { borderRadius: 8, borderColor: '#fff', borderWidth: 2 },
          label: { show: true, color: ink, fontSize: 14 },
          labelLine: { lineStyle: { color: muted } },
          data: chartData
        }]
      });
      window.addEventListener('resize', function() { chart.resize(); });
    }

    // ===== 导出 =====
    function downloadFile(content, filename, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById('exportJson').addEventListener('click', function() {
      const data = JSON.stringify(inspirations, null, 2);
      downloadFile(data, 'inspirations.json', 'application/json');
    });

    document.getElementById('exportTxt').addEventListener('click', function() {
      let text = '灵感手记导出\n' + '='.repeat(30) + '\n\n';
      inspirations.forEach((item, idx) => {
        text += `[${idx+1}] ${item.title}\n`;
        text += `分类: ${item.category}\n`;
        text += `时间: ${item.createdAt}\n`;
        text += `标签: ${item.tags.join(', ')}\n`;
        text += `内容:\n${item.content}\n`;
        text += '-'.repeat(30) + '\n\n';
      });
      downloadFile(text, 'inspirations.txt', 'text/plain');
    });

    document.getElementById('exportMd').addEventListener('click', function() {
      let md = '# 灵感手记\n\n';
      inspirations.forEach((item, idx) => {
        md += `## ${idx+1}. ${item.title}\n\n`;
        md += `- **分类**: ${item.category}\n`;
        md += `- **时间**: ${item.createdAt}\n`;
        md += `- **标签**: ${item.tags.join(', ')}\n\n`;
        md += `${item.content}\n\n`;
        md += '---\n\n';
      });
      downloadFile(md, 'inspirations.md', 'text/markdown');
    });

    // ===== 导入 =====
    document.getElementById('importBtn').addEventListener('click', function() {
      document.getElementById('importFile').click();
    });
    document.getElementById('importFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const data = JSON.parse(event.target.result);
          if (Array.isArray(data)) {
            if (confirm(`确定要导入 ${data.length} 条灵感吗？这将覆盖现有数据。`)) {
              inspirations = data;
              saveData();
              alert('导入成功！');
            }
          } else {
            alert('文件格式不正确');
          }
        } catch (err) {
          alert('解析文件失败');
        }
      };
      reader.readAsText(file);
      this.value = '';
    });

    // ===== 清空所有 =====
    document.getElementById('clearAllBtn').addEventListener('click', function() {
      if (confirm('确定要清空所有灵感数据吗？此操作不可恢复！')) {
        inspirations = [];
        saveData();
        alert('所有数据已清空');
      }
    });

    // ===== 初始化 =====
    loadData();
    renderList();
  </script>
</body>
</html>
