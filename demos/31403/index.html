<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>丧尸攻城 - Zombie Siege</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:'Microsoft YaHei',sans-serif;color:#fff}
#app{display:flex;width:100vw;height:100vh}
#canvasWrap{flex:1;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#sidePanel{width:260px;min-width:260px;background:#10102a;border-left:2px solid #2a2a5a;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.pnl{background:#12122a;border:1px solid #2a2a5a;border-radius:6px;padding:8px;margin:4px 6px}
.pnl h3{font-size:12px;color:#6a8aff;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid #2a2a4a}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:#0d0d20;border-bottom:1px solid #2a2a5a}
.top-bar .gold{color:#ffd700;font-size:16px;font-weight:bold}
.top-bar .wave{color:#ff6a6a;font-size:14px;font-weight:bold}
.top-bar .level{color:#6aff8a;font-size:14px;font-weight:bold}
.top-bar .lives{color:#f44;font-size:13px}
.top-bar .speed{color:#6a8aff;font-size:13px;cursor:pointer}
.tabs{display:flex;gap:2px;margin:4px 6px}
.tab{flex:1;padding:5px;border:1px solid #2a2a5a;border-radius:4px;cursor:pointer;font-size:11px;background:#0a0a1a;color:#666;text-align:center;transition:.2s}
.tab.on{background:#1a1a3a;color:#fff;border-bottom-color:#1a1a3a}
.tab:hover{color:#aaa}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:4px}
.item{background:#1a1a3a;border:1px solid #2a2a5a;border-radius:5px;padding:5px;cursor:pointer;text-align:center;transition:.2s;font-size:11px;color:#aaa}
.item:hover{background:#2a2a5a;border-color:#4a4aff;color:#fff}
.item.sel{border-color:#ffd700;background:#2a2a4a;box-shadow:0 0 8px rgba(255,215,0,.2)}
.item .cost{color:#ffd700;font-size:10px}
.item.no{opacity:.35;cursor:not-allowed}
.btns{display:flex;gap:3px;padding:4px 6px}
.btns button{flex:1;padding:7px;border:1px solid #2a2a5a;border-radius:5px;cursor:pointer;font-size:12px;background:#1a1a3a;color:#aaa;transition:.2s}
.btns button:hover{background:#2a2a5a;color:#fff}
.btns button.go{background:#2a4a2a;border-color:#4a8a4a;color:#6aff8a}
.btns button.go:hover{background:#3a6a3a}
.btns button.go:disabled{opacity:.5;cursor:not-allowed}
#upgradePnl{display:none}
#upgradePnl h3{font-size:12px;color:#ffd700;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid #2a2a4a}
#upgradePnl .row{font-size:11px;padding:2px 0;color:#ccc}
#upgradePnl button{width:100%;padding:7px;margin-top:4px;border:1px solid #4a8a4a;border-radius:5px;cursor:pointer;font-size:12px;background:#2a4a2a;color:#6aff8a;transition:.2s}
#upgradePnl button:hover{background:#3a6a3a}
#upgradePnl button.mx{border-color:#666;background:#333;color:#888;cursor:not-allowed}
#upgradePnl .sell{background:#4a2a2a;border-color:#8a4a4a;color:#ff6a6a;margin-top:3px}
#upgradePnl .sell:hover{background:#6a3a3a}
#log{font-size:11px;color:#888;max-height:90px;overflow-y:auto;padding:4px}
#log .m{padding:1px 0;border-bottom:1px solid #1a1a2a}
.hl{color:#ffd700}.dm{color:#ff6a6a}.he{color:#6aff8a}.sp{color:#6a8aff}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;justify-content:center;align-items:center;flex-direction:column}
#overlay.show{display:flex}
#overlay h1{font-size:42px;margin-bottom:16px}
#overlay p{font-size:18px;margin-bottom:8px;color:#aaa}
#overlay button{padding:12px 36px;font-size:16px;border:2px solid #4a8a4a;border-radius:8px;background:#2a4a2a;color:#6aff8a;cursor:pointer;margin-top:16px;transition:.3s}
#overlay button:hover{background:#3a6a3a;transform:scale(1.05)}
#helpTip{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:6px 16px;border-radius:20px;font-size:12px;color:#aaa;pointer-events:none;white-space:nowrap}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#0a0a1a}
::-webkit-scrollbar-thumb{background:#2a2a5a;border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <div id="canvasWrap">
    <canvas id="gc"></canvas>
    <div id="helpTip">全地图可放置防御 → 丧尸会寻找大门进攻 → 空格键快进</div>
  </div>
  <div id="sidePanel">
    <div class="top-bar">
      <span class="level" id="elLevel">准备开始</span>
      <span class="wave" id="elWave">等待中</span>
      <span class="lives" id="elLives">❤20</span>
      <span class="gold" id="elGold">💰500</span>
      <span class="speed" id="elSpeed" onclick="toggleSpeed()">⏵ 1x</span>
    </div>
    <div class="tabs">
      <div class="tab on" data-t="towers" onclick="switchTab('towers')">攻击塔</div>
      <div class="tab" data-t="defs" onclick="switchTab('defs')">防御工事</div>
    </div>
    <div id="towersGrid" class="grid"></div>
    <div id="defsGrid" class="grid" style="display:none"></div>
    <div class="btns">
      <button class="go" id="btnWave" onclick="startWave()">开始下一波</button>
      <button onclick="doSell()">出售选中</button>
    </div>
    <div class="pnl" id="upgradePnl"></div>
    <div class="pnl" id="log"></div>
  </div>
</div>
<div id="overlay">
  <h1 id="ovTitle">游戏结束</h1>
  <p id="ovDetail"></p>
  <p id="ovStats"></p>
  <button onclick="restart()">重新开始</button>
</div>

<script>
// ===== CONFIG =====
const COLS=20,ROWS=16;
const GATE_COL=7, GATE_COL2=12;
const WALL_ROW=13;
const PALACE_ROW=15;
const TOWERS={
  arrow:{n:'箭塔',cost:80,range:140,dmg:18,spd:25,clr:'#4ac',desc:'快速单体攻击',ico:'🏹'},
  cannon:{n:'炮塔',cost:150,range:110,dmg:45,spd:45,aoe:50,clr:'#f84',desc:'范围溅射伤害',ico:'💣'},
  magic:{n:'魔法塔',cost:200,range:150,dmg:28,spd:30,slow:.4,clr:'#c4f',desc:'减速敌人40%',ico:'🔮'},
  sniper:{n:'狙击塔',cost:300,range:240,dmg:90,spd:60,clr:'#f44',desc:'超远程高伤害',ico:'🎯'},
  tesla:{n:'雷电塔',cost:350,range:120,dmg:22,spd:20,chain:3,clr:'#4ef',desc:'连锁闪电3次',ico:'⚡'}
};
const DEFS={
  wall:{n:'城墙',cost:60,hp:800,clr:'#864',desc:'阻挡怪物',ico:'🧱'},
  slow:{n:'减速带',cost:100,slw:.5,clr:'#8af',desc:'减速50%',ico:'❄️'},
  spike:{n:'地刺',cost:120,dmg:120,cd:90,clr:'#f84',desc:'持续伤害',ico:'⚔️'}
};
const ZTYPES={
  normal:{n:'普通丧尸',hp:60,spd:.9,clr:'#5a5',rwd:5,sz:12},
  fast:{n:'快速丧尸',hp:30,spd:1.6,clr:'#af4',rwd:8,sz:10},
  tank:{n:'坦克丧尸',hp:200,spd:.5,clr:'#a55',rwd:15,sz:16},
  giant:{n:'巨型丧尸',hp:500,spd:.35,clr:'#c44',rwd:30,sz:22}
};
const MAXLV=100;

// ===== STATE =====
let G={
  gold:500,wave:0,lives:20,maxLives:20,kills:0,
  items:[],zombies:[],projs:[],parts:[],fx:[],
  sel:null,preview:null,tab:'towers',
  active:false,over:false,
  spawnQ:[],spawned:0,total:0,spawnT:0,spawnI:0,
  frame:0,msgs:[],
  palaceHp:800,palaceMax:800,
  speedMult:1,speedIdx:0,
  gateX:0,gateY:0
};
const SPEEDS=[1,2,4,8];
const SPEED_LABELS=['⏵ 1x','⏩ 2x','⏩⏩ 4x','⏩⏩⏩ 8x'];

// ===== CANVAS =====
const cv=document.getElementById('gc');
const cx=cv.getContext('2d');
let CELL=60,W,H;
function resize(){
  const wrap=document.getElementById('canvasWrap');
  W=wrap.clientWidth; H=wrap.clientHeight;
  cv.width=W; cv.height=H;
  CELL=Math.min(Math.floor(W/COLS),Math.floor(H/ROWS));
  G.gateX=(GATE_COL+GATE_COL2+1)*CELL/2;
  G.gateY=(WALL_ROW+0.5)*CELL;
}
window.addEventListener('resize',resize);

function isPalace(c,r){return r>=PALACE_ROW;}
function isWallLine(c,r){return r===WALL_ROW && (c<GATE_COL || c>GATE_COL2);}
function canBuild(c,r){
  if(c<0||c>=COLS||r<0||r>=ROWS)return false;
  if(isPalace(c,r))return false;
  if(isWallLine(c,r))return false;
  if(r===WALL_ROW && c>=GATE_COL && c<=GATE_COL2)return false;
  return!G.items.some(it=>it.c===c&&it.r===r);
}

// ===== CLASSES =====
class Item{
  constructor(type,cat,c,r){
    this.type=type;this.cat=cat;this.c=c;this.r=r;
    this.x=c*CELL+CELL/2;this.y=r*CELL+CELL/2;
    this.lv=1;this.shots=0;
    const d=cat==='tower'?TOWERS[type]:DEFS[type];
    this.def=d;
    if(cat==='tower'){
      this.dmg=d.dmg;this.range=d.range;this.spd=d.spd;
      this.cd=0;this.aoe=d.aoe||0;this.slow=d.slow||0;this.chain=d.chain||0;
    }else{
      if(type==='wall'){this.hp=d.hp;this.maxHp=d.hp}
      if(type==='slow'){this.slw=d.slw}
      if(type==='spike'){this.dmg=d.dmg;this.cd=0;this.maxCd=d.cd;this.hit=new Set()}
    }
  }
  upCost(){return Math.floor((this.def.cost||80)*(0.5+this.lv*0.12))}
  sellVal(){
    let t=this.def.cost||80;
    for(let i=1;i<this.lv;i++)t+=Math.floor((this.def.cost||80)*(0.5+i*0.12));
    return Math.floor(t*.6);
  }
  upgrade(){
    if(this.lv>=MAXLV||G.gold<this.upCost())return false;
    G.gold-=this.upCost();this.lv++;
    const s=1+(this.lv-1)*.08;
    if(this.cat==='tower'){
      this.dmg=Math.floor(this.def.dmg*s);
      this.range=this.def.range*(1+(this.lv-1)*.005);
      this.spd=Math.max(this.def.spd*(1-(this.lv-1)*.003),5);
    }else{
      if(this.type==='wall'){this.maxHp=Math.floor(this.def.hp*s);this.hp=this.maxHp}
      if(this.type==='spike')this.dmg=Math.floor(this.def.dmg*s);
    }
    log(this.def.n+' 升至 Lv.'+this.lv+'!','hl');return true;
  }
}

// ===== ZOMBIE with walking animation =====
class Zombie{
  constructor(type,wave){
    const d=ZTYPES[type];
    this.type=type;this.def=d;
    const dm=1+(wave-1)*.02;
    this.maxHp=Math.floor(d.hp*dm);this.hp=this.maxHp;
    this.baseSpd=d.spd*(1+(wave-1)*.01);
    this.spd=this.baseSpd;
    this.sz=d.sz;this.rwd=Math.floor(d.rwd*(1+(wave-1)*.03));
    this.clr=d.clr;this.nm=d.n;
    this.alive=true;this.ended=false;
    this.slowT=0;this.slowA=0;this.flash=0;
    this.atkCd=0;this.atkDmg=Math.floor(8+wave*.8);
    this.animFrame=Math.floor(Math.random()*100);
    this.walkOffset=Math.random()*Math.PI*2;
    // spawn from top with random x
    this.x=Math.random()*W;
    this.y=-this.sz*3;
    this.facing=Math.PI/2;
    this.state='approach';
    this.gateTarget=null;
    this.stumble=Math.random()<0.3;
  }
  update(){
    if(!this.alive)return;
    this.animFrame++;
    if(this.flash>0)this.flash--;
    let s=this.spd*G.speedMult;
    if(this.slowT>0){s*=(1-this.slowA);this.slowT--}

    // AI: find path to gate - smarter pathfinding
    let tx,ty;
    const gateLeft=GATE_COL*CELL;
    const gateRight=(GATE_COL2+1)*CELL;
    const gateCenter=(gateLeft+gateRight)/2;
    const gateHalfWidth=(gateRight-gateLeft)/2;
    const wallY=WALL_ROW*CELL;
    const gateY=wallY+CELL;

    if(this.y<wallY-CELL){
      // Above wall: head toward gate x position
      if(this.x>gateLeft+CELL*0.5 && this.x<gateRight-CELL*0.5){
        // Within gate column range, go straight down to gate
        tx=this.x; ty=gateY;
      }else{
        // Move diagonally toward nearest gate edge
        let nearestX=this.x<gateCenter?gateLeft+CELL*0.5:gateRight-CELL*0.5;
        tx=nearestX; ty=this.y+Math.abs(nearestX-this.x)*0.6;
        if(ty>gateY)ty=gateY;
      }
    }else if(this.y<gateY+CELL){
      // At gate level, move through gate
      tx=this.x; ty=this.y+CELL;
    }else{
      // Below wall: head to palace center
      tx=W/2; ty=H-CELL*1.5;
    }

    let dx=tx-this.x,dy=ty-this.y,d=Math.hypot(dx,dy);
    this.facing=Math.atan2(dy,dx);

    // Reached palace?
    if(this.y>H-CELL*2.5){this.atkPalace();return;}

    // Check wall collision
    let blocked=false;
    for(let it of G.items){
      if(it.cat==='defense'&&it.type==='wall'&&it.hp>0){
        let wdx=this.x-it.x,wdy=this.y-it.y,wd=Math.hypot(wdx,wdy);
        if(wd<CELL*.5+this.sz){
          blocked=true;
          if(this.atkCd<=0){
            it.hp-=this.atkDmg;
            this.atkCd=35;
            G.fx.push({t:'hit',x:this.x,y:this.y,tx:it.x,ty:it.y,l:6});
            if(it.hp<=0){log('城墙被摧毁!','dm');it.hp=0}
          }
          break;
        }
      }
    }
    if(!blocked){
      if(d>0.1){this.x+=dx/d*s;this.y+=dy/d*s;}
    }

    // Spike trap
    for(let it of G.items){
      if(it.cat==='defense'&&it.type==='spike'&&it.cd<=0){
        let dx=this.x-it.x,dy=this.y-it.y;
        if(Math.abs(dx)<CELL*.4&&Math.abs(dy)<CELL*.4&&!it.hit.has(this)){
          this.hurt(it.dmg);it.hit.add(this);it.cd=it.maxCd;
          boom(it.x,it.y,'#f84',8);
        }
      }
    }
    // Slow zone
    for(let it of G.items){
      if(it.cat==='defense'&&it.type==='slow'){
        let dx=this.x-it.x,dy=this.y-it.y;
        if(Math.abs(dx)<CELL*.5&&Math.abs(dy)<CELL*.5){
          this.slowT=20;this.slowA=Math.min(this.slowA+.1,it.slw);
        }
      }
    }
    if(this.atkCd>0)this.atkCd--;
  }
  atkPalace(){
    if(this.atkCd>0){this.atkCd--;return}
    this.atkCd=25;
    G.palaceHp-=this.atkDmg;
    G.fx.push({t:'hit',x:this.x,y:this.y,tx:W/2,ty:H-CELL,l:8});
    if(G.palaceHp<=0){G.palaceHp=0;endGame()}
  }
  hurt(dmg){
    this.hp-=dmg;this.flash=5;
    if(this.hp<=0&&this.alive){
      this.alive=false;G.gold+=this.rwd;G.kills++;
      boom(this.x,this.y,this.clr,12);
      log('击杀 '+this.nm+' +'+this.rwd+'金币','hl');
    }
  }
  draw(){
    if(!this.alive)return;
    cx.save();cx.translate(this.x,this.y);
    // Face direction of movement
    let faceRight=this.facing>-Math.PI/2&&this.facing<Math.PI/2;
    if(!faceRight)cx.scale(-1,1);

    let c=this.flash>0?'#fff':this.clr;
    let sz=this.sz;
    let walk=Math.sin(this.animFrame*.15+this.walkOffset);
    let walk2=Math.sin(this.animFrame*.15+this.walkOffset+Math.PI);
    let stumbleTilt=this.stumble?Math.sin(this.animFrame*.08)*0.15:0;

    // Shadow
    cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();
    cx.ellipse(0,sz*.9,sz*.8,sz*.3,0,0,Math.PI*2);cx.fill();

    cx.rotate(stumbleTilt);

    // Zombie body - hunched forward posture
    cx.fillStyle=c;
    // Torso (leaning forward, hunched back)
    cx.beginPath();
    cx.ellipse(sz*.1,-sz*.15,sz*.5,sz*.65,0.25,0,Math.PI*2);
    cx.fill();

    // Shoulders (hunched up)
    cx.beginPath();
    cx.ellipse(-sz*.1,-sz*.45,sz*.35,sz*.25,-0.2,0,Math.PI*2);
    cx.fill();

    // Head (tilted forward and down, zombie-like)
    cx.save();
    cx.translate(sz*.2,-sz*.7);
    cx.rotate(0.3);
    cx.beginPath();cx.arc(0,0,sz*.38,0,Math.PI*2);cx.fill();

    // Eyes (glowing red, uneven - one bigger, one drooping)
    cx.fillStyle='#f00';cx.shadowColor='#f00';cx.shadowBlur=5;
    cx.beginPath();cx.arc(sz*.08,-sz*.05,sz*.1,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.arc(sz*.18,sz*.02,sz*.06,0,Math.PI*2);cx.fill();
    cx.shadowBlur=0;

    // Dark eye sockets
    cx.fillStyle='rgba(0,0,0,.4)';
    cx.beginPath();cx.arc(sz*.08,-sz*.05,sz*.14,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.arc(sz*.18,sz*.02,sz*.1,0,Math.PI*2);cx.fill();
    // Re-draw eyes
    cx.fillStyle='#f00';cx.shadowColor='#f00';cx.shadowBlur=4;
    cx.beginPath();cx.arc(sz*.08,-sz*.05,sz*.08,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.arc(sz*.18,sz*.02,sz*.05,0,Math.PI*2);cx.fill();
    cx.shadowBlur=0;

    // Mouth (open, agape, drooling)
    cx.fillStyle='#200';
    cx.beginPath();
    cx.ellipse(sz*.1,sz*.18,sz*.14,sz*.1,0.1,0,Math.PI*2);
    cx.fill();
    // Teeth
    cx.fillStyle='#ddd';
    for(let i=-2;i<=2;i++){
      cx.beginPath();cx.arc(sz*.1+i*sz*.06,sz*.12,sz*.03,0,Math.PI);cx.fill();
    }
    // Drool
    cx.fillStyle='rgba(80,180,80,.7)';
    cx.beginPath();
    cx.ellipse(sz*.05,sz*.28,sz*.04,sz*.12,0.1,0,Math.PI*2);
    cx.fill();
    cx.beginPath();
    cx.ellipse(sz*.15,sz*.32,sz*.03,sz*.08,-0.2,0,Math.PI*2);
    cx.fill();

    // Exposed brain (some zombies)
    if(this.type==='tank'||this.type==='giant'){
      cx.fillStyle='rgba(200,100,100,.6)';
      cx.beginPath();cx.arc(-sz*.1,-sz*.15,sz*.12,Math.PI,0);cx.fill();
    }

    cx.restore(); // end head

    // Arms (reaching forward, swaying with walk)
    cx.fillStyle=c;
    let armSwing1=walk*sz*.25;
    let armSwing2=walk2*sz*.25;

    // Left arm (reaching forward)
    cx.save();
    cx.translate(sz*.15,-sz*.35);
    cx.rotate(0.4+armSwing1*0.3);
    cx.beginPath();cx.ellipse(sz*.25,0,sz*.35,sz*.1,0,0,Math.PI*2);cx.fill();
    // Hand/claw
    cx.fillStyle='#433';
    cx.beginPath();cx.arc(sz*.55,0,sz*.1,0,Math.PI*2);cx.fill();
    // Fingers
    cx.strokeStyle='#433';cx.lineWidth=2;
    for(let i=-1;i<=1;i++){
      cx.beginPath();cx.moveTo(sz*.6,i*sz*.04);cx.lineTo(sz*.75,i*sz*.04+armSwing1*0.1);cx.stroke();
    }
    cx.restore();

    // Right arm (hanging/dragging)
    cx.fillStyle=c;
    cx.save();
    cx.translate(-sz*.05,-sz*.3);
    cx.rotate(-0.2+armSwing2*0.2);
    cx.beginPath();cx.ellipse(sz*.2,sz*.1,sz*.3,sz*.1,0.3,0,Math.PI*2);cx.fill();
    cx.fillStyle='#433';
    cx.beginPath();cx.arc(sz*.45,sz*.18,sz*.09,0,Math.PI*2);cx.fill();
    cx.restore();

    // Legs (shuffling walk - one drags, one steps)
    cx.fillStyle=c;
    let leg1Y=sz*.4+walk*sz*.2;
    let leg2Y=sz*.4+walk2*sz*.2;

    // Left leg (dragging)
    cx.fillRect(-sz*.2,leg1Y,sz*.22,sz*.45);
    // Foot (dragging, angled)
    cx.save();
    cx.translate(-sz*.1,leg1Y+sz*.45);
    cx.rotate(0.2+walk*0.1);
    cx.fillStyle='#433';
    cx.fillRect(-sz*.15,0,sz*.4,sz*.12);
    cx.restore();

    // Right leg (stepping)
    cx.fillStyle=c;
    cx.fillRect(sz*.02,leg2Y,sz*.22,sz*.45);
    // Foot
    cx.save();
    cx.translate(sz*.12,leg2Y+sz*.45);
    cx.rotate(-0.1+walk2*0.1);
    cx.fillStyle='#433';
    cx.fillRect(-sz*.1,0,sz*.35,sz*.12);
    cx.restore();

    // Ripped clothes (tattered strips)
    cx.fillStyle='rgba(0,0,0,.25)';
    // Shirt tears
    cx.beginPath();cx.moveTo(-sz*.1,-sz*.3);cx.lineTo(sz*.1,-sz*.2);cx.lineTo(sz*.05,-sz*.1);cx.lineTo(-sz*.15,-sz*.15);cx.closePath();cx.fill();
    cx.beginPath();cx.moveTo(sz*.2,-sz*.1);cx.lineTo(sz*.4,0);cx.lineTo(sz*.3,sz*.1);cx.lineTo(sz*.15,-sz*.05);cx.closePath();cx.fill();
    // Pants tear
    cx.fillRect(-sz*.15,sz*.3,sz*.1,sz*.15);

    // Blood stains (multiple, varied)
    cx.fillStyle='rgba(160,20,20,.5)';
    cx.beginPath();cx.arc(-sz*.15,sz*.05,sz*.18,0,Math.PI*2);cx.fill();
    cx.fillStyle='rgba(140,30,30,.4)';
    cx.beginPath();cx.arc(sz*.25,-sz*.35,sz*.12,0,Math.PI*2);cx.fill();
    cx.fillStyle='rgba(120,20,20,.35)';
    cx.beginPath();cx.arc(sz*.05,sz*.25,sz*.1,0,Math.PI*2);cx.fill();

    // Rotten flesh spots (greenish)
    cx.fillStyle='rgba(80,120,60,.3)';
    cx.beginPath();cx.arc(-sz*.05,-sz*.2,sz*.08,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.arc(sz*.3,sz*.1,sz*.06,0,Math.PI*2);cx.fill();

    // Exposed bone (ribs hint)
    if(this.type==='tank'||this.type==='giant'){
      cx.fillStyle='rgba(220,200,180,.6)';
      cx.fillRect(-sz*.05,-sz*.25,sz*.04,sz*.15);
      cx.fillRect(sz*.05,-sz*.22,sz*.04,sz*.12);
    }

    cx.restore(); // end stumble rotation
    cx.restore(); // end translate

    // HP bar (not rotated, in world space)
    let bw=sz*2.8,bh=3,bx=this.x-bw/2,by=this.y-sz-14;
    cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(bx,by,bw,bh);
    let r=this.hp/this.maxHp;
    cx.fillStyle=r>.5?'#4a4':r>.25?'#ca4':'#c44';
    cx.fillRect(bx,by,bw*r,bh);

    // Slow effect ring
    if(this.slowT>0){
      cx.strokeStyle='rgba(100,150,255,.4)';cx.lineWidth=2;
      cx.beginPath();cx.arc(this.x,this.y,sz+5,0,Math.PI*2);cx.stroke();
    }
  }
}

class Proj{
  constructor(fx,fy,tgt,dmg,clr,aoe,slow,chain){
    this.x=fx;this.y=fy;this.tgt=tgt;this.dmg=dmg;this.clr=clr;
    this.aoe=aoe||0;this.slow=slow||0;this.chain=chain||0;
    this.spd=9;this.alive=true;this.sz=3;
  }
  update(){
    if(!this.alive)return;
    if(!this.tgt||!this.tgt.alive){this.alive=false;return}
    let dx=this.tgt.x-this.x,dy=this.tgt.y-this.y,d=Math.hypot(dx,dy);
    if(d<this.spd+this.tgt.sz){this.hit();return}
    this.x+=dx/d*this.spd;this.y+=dy/d*this.spd;
  }
  hit(){
    this.alive=false;
    if(!this.tgt||!this.tgt.alive)return;
    this.tgt.hurt(this.dmg);
    if(this.slow>0)this.tgt.slowT=60;
    if(this.aoe>0){
      for(let z of G.zombies){
        if(z!==this.tgt&&z.alive){
          if(Math.hypot(z.x-this.tgt.x,z.y-this.tgt.y)<this.aoe)z.hurt(this.dmg*.5);
        }
      }
      boom(this.tgt.x,this.tgt.y,'#f84',12);
    }
    if(this.chain>0)this.chainHit(this.tgt,this.dmg*.6,this.chain);
    boom(this.tgt.x,this.tgt.y,this.clr,4);
  }
  chainHit(src,dmg,rem){
    if(rem<=0)return;
    let best=null,bd=180;
    for(let z of G.zombies){
      if(z!==src&&z.alive){
        let d=Math.hypot(z.x-src.x,z.y-src.y);
        if(d<bd){bd=d;best=z}
      }
    }
    if(best){
      G.fx.push({t:'l',x1:src.x,y1:src.y,x2:best.x,y2:best.y,l:8});
      best.hurt(dmg);this.chainHit(best,dmg*.6,rem-1);
    }
  }
  draw(){
    if(!this.alive)return;
    cx.save();cx.shadowColor=this.clr;cx.shadowBlur=8;
    cx.fillStyle=this.clr;cx.beginPath();cx.arc(this.x,this.y,this.sz,0,Math.PI*2);cx.fill();
    cx.restore();
  }
}

function boom(x,y,c,n){
  for(let i=0;i<n;i++)G.parts.push({x,y,c,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,l:15+Math.random()*15,ml:30,sz:2+Math.random()*2});
}

function tickTowers(){
  for(let it of G.items){
    if(it.cat!=='tower')continue;
    if(it.cd>0){it.cd--;continue}
    let best=null,bd=it.range;
    for(let z of G.zombies){
      if(!z.alive)continue;
      let d=Math.hypot(z.x-it.x,z.y-it.y);
      if(d<bd){bd=d;best=z}
    }
    if(best){
      it.cd=it.spd;it.shots++;
      G.projs.push(new Proj(it.x,it.y,best,it.dmg,it.def.clr,it.aoe,it.slow,it.chain));
    }
  }
}
function tickDefs(){
  for(let it of G.items){
    if(it.cat!=='defense')continue;
    if(it.type==='spike'){if(it.cd>0)it.cd--;if(it.cd<=0)it.hit.clear()}
  }
}

// ===== WAVES - gradual spawn =====
function waveCount(w){
  if(w>=8)return 2000;
  return Math.min(100*Math.pow(2,w-1),2000);
}
function waveComp(w){
  let total=waveCount(w);
  let types=w<=3?['normal']:w<=6?['normal','fast']:w<=10?['normal','fast','tank']:['normal','fast','tank','giant'];
  let wt={normal:50,fast:20,tank:15,giant:5};
  if(w>10){wt.fast=25;wt.tank=20;wt.giant=15}
  if(w>20){wt.normal=30;wt.fast=25;wt.tank=25;wt.giant=20}
  if(w>50){wt.normal=20;wt.fast=20;wt.tank=30;wt.giant=30}
  let q=[],keys=Object.keys(wt).filter(k=>types.includes(k)),tw=keys.reduce((s,k)=>s+wt[k],0);
  for(let i=0;i<total;i++){
    let r=Math.random()*tw,cum=0;
    for(let k of keys){cum+=wt[k];if(r<=cum){q.push(k);break}}
  }
  for(let i=q.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}
  return q;
}

function startWave(){
  if(G.active||G.over)return;
  if(G.wave>=200){endGame(true);return}
  G.wave++;G.active=true;
  G.total=waveCount(G.wave);G.spawned=0;
  G.spawnQ=waveComp(G.wave);
  G.spawnI=Math.max(4,55-G.wave*.4);G.spawnT=0;
  document.getElementById('btnWave').disabled=true;
  document.getElementById('btnWave').textContent='波次进行中...';
  log('第 '+G.wave+' 波入侵! 丧尸: '+G.total,'sp');
}
function tickWave(){
  if(!G.active)return;
  if(G.spawned<G.spawnQ.length){
    G.spawnT--;
    if(G.spawnT<=0){
      let z=new Zombie(G.spawnQ[G.spawned],G.wave);
      G.zombies.push(z);G.spawned++;G.spawnT=G.spawnI;
    }
  }
  let alive=G.zombies.filter(z=>z.alive).length;
  if(G.spawned>=G.spawnQ.length&&alive===0){
    G.active=false;
    document.getElementById('btnWave').disabled=false;
    document.getElementById('btnWave').textContent='开始下一波';
    let bonus=Math.floor(G.wave*25);G.gold+=bonus;
    G.palaceHp=Math.min(G.palaceHp+30,G.palaceMax);
    log('波次完成! 奖励 '+bonus+' 金币, 皇宫恢复 30 HP','hl');
  }
}

function drawItems(){
  for(let it of G.items){
    let x=it.x,y=it.y;
    if(it.cat==='tower'){
      if(G.sel===it){
        cx.strokeStyle='rgba(255,255,255,.12)';cx.lineWidth=1;
        cx.beginPath();cx.arc(x,y,it.range,0,Math.PI*2);cx.stroke();
      }
      let bs=CELL*.38;
      cx.fillStyle='#222';cx.fillRect(x-bs,y-bs,bs*2,bs*2);
      cx.fillStyle=it.def.clr;cx.shadowColor=it.def.clr;cx.shadowBlur=5;
      let s=CELL*.3;
      switch(it.type){
        case'arrow':cx.fillRect(x-s*.4,y-s*.9,s*.8,s*1.8);cx.fillStyle='#ddd';cx.fillRect(x-s*.2,y-s*1.2,s*.4,s*.4);break;
        case'cannon':cx.beginPath();cx.arc(x,y,s,0,Math.PI*2);cx.fill();cx.fillStyle='#333';cx.fillRect(x-s*.2,y-s*1.2,s*.4,s*.5);break;
        case'magic':cx.beginPath();cx.moveTo(x,y-s);cx.lineTo(x+s*.85,y+s*.5);cx.lineTo(x-s*.85,y+s*.5);cx.closePath();cx.fill();break;
        case'sniper':cx.fillRect(x-s*.25,y-s*1.25,s*.5,s*2.5);cx.fillStyle='#666';cx.fillRect(x-s*.75,y-s*.3,s*1.5,s*.6);break;
        case'tesla':cx.beginPath();cx.arc(x,y,s*.9,0,Math.PI*2);cx.fill();cx.fillStyle='#444';cx.fillRect(x-s*.15,y-s*1.1,s*.3,s*2.2);cx.fillRect(x-s*1.1,y-s*.15,s*2.2,s*.3);break;
      }
      cx.shadowBlur=0;
      cx.fillStyle='#ffd700';cx.font='bold '+Math.max(8,CELL*.15)+'px Arial';cx.textAlign='center';
      cx.fillText('Lv'+it.lv,x,y+bs+Math.max(8,CELL*.15));
    }else{
      cx.shadowBlur=0;
      let bs=CELL*.42;
      if(it.type==='wall'){
        if(it.hp>0){
          if(it.r!==WALL_ROW){
            let r=it.hp/it.maxHp;
            cx.fillStyle=r>.5?'#c98':r>.25?'#a76':'#864';
            cx.fillRect(x-bs,y-bs,bs*2,bs*2);
            cx.strokeStyle='#654';cx.lineWidth=2;cx.strokeRect(x-bs,y-bs,bs*2,bs*2);
            cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(x-bs,y-bs-6,bs*2,4);
            cx.fillStyle=r>.5?'#4a4':r>.25?'#ca4':'#c44';
            cx.fillRect(x-bs,y-bs-6,bs*2*r,4);
          }
        }else{
          if(it.r!==WALL_ROW){
            cx.fillStyle='rgba(50,30,20,.5)';cx.fillRect(x-bs,y-bs,bs*2,bs*2);
            cx.fillStyle='#444';cx.font=Math.max(8,CELL*.15)+'px Arial';cx.textAlign='center';
            cx.fillText('已摧毁',x,y+4);
          }
        }
      }else if(it.type==='slow'){
        cx.fillStyle='rgba(100,150,255,.2)';cx.beginPath();cx.arc(x,y,bs,0,Math.PI*2);cx.fill();
        cx.strokeStyle='rgba(100,150,255,.4)';cx.lineWidth=2;cx.beginPath();cx.arc(x,y,bs,0,Math.PI*2);cx.stroke();
      }else if(it.type==='spike'){
        let ready=it.cd<=0;
        cx.fillStyle=ready?'rgba(200,100,50,.25)':'rgba(100,50,25,.15)';
        cx.fillRect(x-bs,y-bs,bs*2,bs*2);
        for(let i=0;i<8;i++){
          let a=i*Math.PI/4;
          cx.strokeStyle=ready?'#f84':'#642';cx.lineWidth=2;cx.beginPath();
          cx.moveTo(x+Math.cos(a)*bs*.3,y+Math.sin(a)*bs*.3);
          cx.lineTo(x+Math.cos(a)*bs,y+Math.sin(a)*bs);cx.stroke();
        }
      }
      if(G.sel===it){
        cx.strokeStyle='#ffd700';cx.lineWidth=2;cx.setLineDash([4,4]);
        cx.strokeRect(x-bs-2,y-bs-2,bs*2+4,bs*2+4);cx.setLineDash([]);
      }
    }
  }
}

  for(let[k,d]of Object.entries(DEFS)){
    let b=document.createElement('div');b.className='item';b.dataset.type=k;b.dataset.cat='defense';
    b.innerHTML=d.ico+' '+d.n+'<br><span class="cost">💰'+d.cost+'</span><br><span style="font-size:9px;color:#666">'+d.desc+'</span>';
    b.onclick=()=>selItem(k,'defense');dg.appendChild(b);
  }
}
function switchTab(t){
  G.tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.getElementById('towersGrid').style.display=t==='towers'?'grid':'none';
  document.getElementById('defsGrid').style.display=t==='defs'?'grid':'none';
  G.sel=null;upgPanel();
}
function selItem(type,cat){
  G.preview={type,cat};
  document.querySelectorAll('.item').forEach(b=>b.classList.toggle('sel',b.dataset.type===type&&b.dataset.cat===cat));
  let d=cat==='tower'?TOWERS[type]:DEFS[type];
  log('已选择 '+d.n+' → 点击地图放置','sp');
  document.getElementById('helpTip').textContent='点击地图放置 '+d.n+' | 右键取消 | 空格键快进';
}

// ===== LOOP with speed support =====
function loop(){
  if(G.over)return;
  let steps=G.speedMult;
  for(let step=0;step<steps;step++){
    for(let i=G.zombies.length-1;i>=0;i--){let z=G.zombies[i];if(!z.alive)G.zombies.splice(i,1)}
    G.zombies=G.zombies.filter(z=>z.alive);
    G.projs=G.projs.filter(p=>p.alive);
    tickTowers();tickDefs();tickWave();
    for(let z of G.zombies)z.update();
    for(let p of G.projs)p.update();
    G.frame++;
  }
  drawMap();drawWallLine();drawPalace();drawItems();drawPreview();drawZombies();drawProjs();drawFx();drawParts();drawHUD();
  if(G.frame%6===0)upUI();
  requestAnimationFrame(loop);
}

// ===== INPUT =====
let mouseX=0,mouseY=0;
cv.addEventListener('mousemove',e=>{
  let r=cv.getBoundingClientRect();
  mouseX=(e.clientX-r.left)*(cv.width/r.width);
  mouseY=(e.clientY-r.top)*(cv.height/r.height);
});
cv.addEventListener('click',e=>{
  if(G.over)return;
  let c=Math.floor(mouseX/CELL),r=Math.floor(mouseY/CELL);
  if(c<0||c>=COLS||r<0||r>=ROWS)return;
  let hit=G.items.find(it=>it.c===c&&it.r===r);
  if(hit){G.sel=hit;G.preview=null;document.querySelectorAll('.item').forEach(b=>b.classList.remove('sel'));upgPanel();return}
  if(!G.preview)return;
  if(!canBuild(c,r)){log('此处不可放置! (皇宫/城墙/大门区域)','dm');return}
  let d=G.preview.cat==='tower'?TOWERS[G.preview.type]:DEFS[G.preview.type];
  if(G.gold<d.cost){log('金币不足! 需要 '+d.cost,'dm');return}
  G.gold-=d.cost;
  let it=new Item(G.preview.type,G.preview.cat,c,r);
  G.items.push(it);log('放置 '+d.n+' 成功!','he');
  G.sel=it;upgPanel();upUI();
});
cv.addEventListener('contextmenu',e=>{
  e.preventDefault();G.sel=null;G.preview=null;
  document.querySelectorAll('.item').forEach(b=>b.classList.remove('sel'));
  upgPanel();
  document.getElementById('helpTip').textContent='全地图可放置防御 → 丧尸会寻找大门进攻 → 空格键快进';
});

// Space key for speed
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();toggleSpeed();}
});

// ===== UPGRADE PANEL =====
function upgPanel(){
  let p=document.getElementById('upgradePnl'),it=G.sel;
  if(!it){p.style.display='none';p.innerHTML='';return}
  p.style.display='block';
  let d=it.def,h='<h3>'+d.ico+' '+d.n+' Lv.'+it.lv+'</h3>';
  if(it.cat==='tower'){
    h+='<div class="row">⚔ 攻击: '+it.dmg+'</div>';
    h+='<div class="row">📏 射程: '+Math.floor(it.range)+'</div>';
    h+='<div class="row">⏱ 攻速: '+it.spd+'帧</div>';
    if(it.aoe>0)h+='<div class="row">💥 溅射: '+it.aoe+'</div>';
    if(it.chain>0)h+='<div class="row">⚡ 连锁: '+it.chain+'次</div>';
  }else{
    if(it.type==='wall')h+='<div class="row">❤ 血量: '+Math.floor(it.hp)+'/'+it.maxHp+'</div>';
    if(it.type==='slow')h+='<div class="row">❄ 减速: '+Math.floor(it.slw*100)+'%</div>';
    if(it.type==='spike')h+='<div class="row">⚔ 伤害: '+it.dmg+'</div>';
  }
  if(it.lv<MAXLV){
    let cost=it.upCost(),ok=G.gold>=cost;
    h+='<button onclick="doUpgrade()" '+(ok?'':'style="opacity:.5"')+'>'+'升级 Lv.'+it.lv+'→Lv.'+(it.lv+1)+' 💰'+cost+'</button>';
  }else h+='<button class="mx">已满级 MAX Lv.100</button>';
  h+='<button class="sell" onclick="doSell()">出售 💰+'+it.sellVal()+'</button>';
  p.innerHTML=h;
}
function doUpgrade(){
  if(!G.sel)return;
  if(G.sel.upgrade()){upgPanel();upUI()}
  else log('金币不足或已满级!','dm');
}
function doSell(){
  if(!G.sel)return;
  let v=G.sel.sellVal(),n=G.sel.def.n;
  G.gold+=v;G.items=G.items.filter(it=>it!==G.sel);
  log('出售 '+n+' +'+v+' 金币','hl');
  G.sel=null;upgPanel();upUI();
}

// ===== LOG =====
function log(t,c=''){
  G.msgs.push({t,c});if(G.msgs.length>40)G.msgs.shift();
  let el=document.getElementById('log');
  el.innerHTML=G.msgs.slice(-8).map(m=>'<div class="m '+m.c+'">'+m.t+'</div>').join('');
  el.scrollTop=el.scrollHeight;
}

// ===== UI UPDATE =====
function upUI(){
  document.getElementById('elGold').textContent='💰'+G.gold;
  document.getElementById('elWave').textContent=G.active?('剩余: '+G.zombies.filter(z=>z.alive).length):(G.wave===0?'等待中':'通关: '+G.wave);
  document.getElementById('elLevel').textContent=G.wave===0?'准备开始':'第 '+G.wave+'/200 关';
  document.getElementById('elLives').textContent='❤'+G.lives;
  document.querySelectorAll('.item').forEach(b=>{
    let t=b.dataset.type,cat=b.dataset.cat;
    let d=cat==='tower'?TOWERS[t]:DEFS[t];
    b.classList.toggle('no',G.gold<d.cost);
  });
  upgPanel();
}

// ===== GAME OVER =====
function endGame(win=false){
  G.over=true;
  document.getElementById('ovTitle').textContent=win?'🎉 恭喜通关!':'💀 皇宫沦陷!';
  document.getElementById('ovDetail').textContent=win?'你成功守护了皇宫 200 关!':'皇宫在第 '+G.wave+' 波沦陷';
  document.getElementById('ovStats').textContent='击杀: '+G.kills+' 只丧尸 | 金币: '+G.gold;
  document.getElementById('overlay').classList.add('show');
}
function restart(){
  document.getElementById('overlay').classList.remove('show');
  G.gold=500;G.wave=0;G.lives=20;G.kills=0;
  G.items=[];G.zombies=[];G.projs=[];G.parts=[];G.fx=[];
  G.sel=null;G.preview=null;G.active=false;G.over=false;
  G.spawnQ=[];G.msgs=[];G.palaceHp=G.palaceMax;
  G.speedMult=1;G.speedIdx=0;
  document.getElementById('elSpeed').textContent='⏵ 1x';
  document.getElementById('btnWave').disabled=false;
  document.getElementById('btnWave').textContent='开始下一波';
  upUI();log('游戏重新开始!','sp');
  loop();
}

// ===== INIT =====
function init(){
  resize();setupShop();upUI();
  log('欢迎! 守护皇宫，抵御丧尸入侵!','sp');
  log('丧尸会寻找大门进入，在沿途布置防线','sp');
  log('点击速度按钮或按空格键可快进游戏','sp');
  loop();
}
window.switchTab=switchTab;window.selItem=selItem;
window.doUpgrade=doUpgrade;window.doSell=doSell;
window.startWave=startWave;window.restart=restart;
window.toggleSpeed=toggleSpeed;
init();
</script>
</body>
</html>
