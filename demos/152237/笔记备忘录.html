  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="app-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <h1>笔记备忘录</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" title="切换主题">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-icon notes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="statNotes">0</span>
          <span class="stat-label">笔记</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon memos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="statMemos">0</span>
          <span class="stat-label">待办</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon done">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="statDone">0</span>
          <span class="stat-label">已完成</span>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        笔记
      </button>
      <button class="tab-btn" data-tab="memos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        备忘录
      </button>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="搜索笔记或备忘录...">
    </div>

    <!-- Notes View -->
    <div class="view-content active" id="view-notes">
      <button class="add-btn" id="addNoteBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建笔记
      </button>
      <div class="notes-grid" id="notesGrid"></div>
    </div>

    <!-- Memos View -->
    <div class="view-content" id="view-memos">
      <button class="add-btn" id="addMemoBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建备忘
      </button>
      <div class="filter-chips" id="filterChips">
        <button class="chip active" data-filter="all">全部</button>
        <button class="chip" data-filter="active">待办中</button>
        <button class="chip" data-filter="completed">已完成</button>
        <button class="chip" data-filter="high">高优先级</button>
      </div>
      <div class="memo-list" id="memoList"></div>
    </div>
  </div>

  <!-- Note Modal -->
  <div class="modal-overlay" id="noteModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="noteModalTitle">新建笔记</h2>
        <button class="modal-close" onclick="closeNoteModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="form-group">
        <label class="form-label">标题</label>
        <input type="text" class="form-input" id="noteTitle" placeholder="输入笔记标题..." maxlength="100">
      </div>
      <div class="form-group">
        <label class="form-label">内容</label>
        <textarea class="form-textarea" id="noteContent" placeholder="输入笔记内容..." maxlength="2000"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">颜色标签</label>
        <div class="color-picker" id="colorPicker">
          <div class="color-swatch selected" data-color="yellow" style="background: var(--note-yellow); border-color: #facc15;"></div>
          <div class="color-swatch" data-color="green" style="background: var(--note-green); border-color: #34d399;"></div>
          <div class="color-swatch" data-color="blue" style="background: var(--note-blue); border-color: #60a5fa;"></div>
          <div class="color-swatch" data-color="pink" style="background: var(--note-pink); border-color: #f472b6;"></div>
          <div class="color-swatch" data-color="purple" style="background: var(--note-purple); border-color: #a78bfa;"></div>
          <div class="color-swatch" data-color="orange" style="background: var(--note-orange); border-color: #fb923c;"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeNoteModal()">取消</button>
        <button class="btn-primary" id="saveNoteBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- Memo Modal -->
  <div class="modal-overlay" id="memoModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="memoModalTitle">新建备忘</h2>
        <button class="modal-close" onclick="closeMemoModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="form-group">
        <label class="form-label">内容</label>
        <textarea class="form-textarea" id="memoText" placeholder="输入备忘内容..." maxlength="500"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">优先级</label>
        <div class="priority-picker" id="priorityPicker">
          <div class="priority-option selected high" data-priority="high">高</div>
          <div class="priority-option" data-priority="medium">中</div>
          <div class="priority-option" data-priority="low">低</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">截止日期（可选）</label>
        <input type="date" class="form-input" id="memoDue">
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeMemoModal()">取消</button>
        <button class="btn-primary" id="saveMemoBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // === State ===
    let notes = [];
    let memos = [];
    let currentTab = 'notes';
    let searchQuery = '';
    let memoFilter = 'all';
    let editingNoteId = null;
    let editingMemoId = null;
    let selectedColor = 'yellow';
    let selectedPriority = 'high';

    const STORAGE_KEYS = { notes: 'nm_notes', memos: 'nm_memos', theme: 'nm_theme' };

    // === Storage ===
    function loadData() {
      try {
        notes = JSON.parse(localStorage.getItem(STORAGE_KEYS.notes)) || [];
        memos = JSON.parse(localStorage.getItem(STORAGE_KEYS.memos)) || [];
      } catch(e) { notes = []; memos = []; }
    }
    function saveNotes() { localStorage.setItem(STORAGE_KEYS.notes, JSON.stringify(notes)); }
    function saveMemos() { localStorage.setItem(STORAGE_KEYS.memos, JSON.stringify(memos)); }

    // === Theme ===
    function initTheme() {
      const saved = localStorage.getItem(STORAGE_KEYS.theme) || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      updateThemeIcon(saved);
    }
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem(STORAGE_KEYS.theme, next);
      updateThemeIcon(next);
    }
    function updateThemeIcon(theme) {
      const icon = document.getElementById('themeIcon');
      if (theme === 'dark') {
        icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
      } else {
        icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
      }
    }

    // === Utils ===
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function formatDate(ts) {
      const d = new Date(ts);
      const now = new Date();
      const diff = now - d;
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff/60000) + '分钟前';
      if (diff < 86400000) return Math.floor(diff/3600000) + '小时前';
      if (diff < 604800000) return Math.floor(diff/86400000) + '天前';
      return `${d.getMonth()+1}月${d.getDate()}日`;
    }
    function formatDue(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const now = new Date();
      now.setHours(0,0,0,0);
      d.setHours(0,0,0,0);
      const diff = d - now;
      if (diff < 0) return '已逾期';
      if (diff === 0) return '今天';
      if (diff === 86400000) return '明天';
      return `${d.getMonth()+1}月${d.getDate()}日`;
    }
    function isOverdue(dateStr, completed) {
      if (!dateStr || completed) return false;
      const d = new Date(dateStr);
      const now = new Date();
      now.setHours(0,0,0,0);
      d.setHours(0,0,0,0);
      return d < now;
    }
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    const COLOR_MAP = {
      yellow: { bar: '#facc15', bg: 'var(--note-yellow)' },
      green:  { bar: '#34d399', bg: 'var(--note-green)' },
      blue:   { bar: '#60a5fa', bg: 'var(--note-blue)' },
      pink:   { bar: '#f472b6', bg: 'var(--note-pink)' },
      purple: { bar: '#a78bfa', bg: 'var(--note-purple)' },
      orange: { bar: '#fb923c', bg: 'var(--note-orange)' },
    };

    const PRIORITY_LABELS = { high: '高', medium: '中', low: '低' };

    // === Render ===
    function renderNotes() {
      const grid = document.getElementById('notesGrid');
      let filtered = notes.filter(n =>
        !searchQuery ||
        n.title.toLowerCase().includes(searchQuery) ||
        n.content.toLowerCase().includes(searchQuery)
      );
      // Sort: pinned first, then by updated desc
      filtered.sort((a, b) => {
        if (a.pinned !== b.pinned) return b.pinned ? 1 : -1;
        return b.updatedAt - a.updatedAt;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <h3>${searchQuery ? '没有找到匹配的笔记' : '还没有笔记'}</h3>
            <p>${searchQuery ? '试试其他关键词' : '点击上方按钮创建第一篇笔记'}</p>
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map(n => {
        const color = COLOR_MAP[n.color] || COLOR_MAP.yellow;
        return `
          <div class="note-card ${n.pinned ? 'pinned' : ''}" data-id="${n.id}" style="background: ${color.bg};">
            <div class="note-color-bar" style="background: ${color.bar};"></div>
            <button class="note-pin ${n.pinned ? 'pinned' : ''}" onclick="event.stopPropagation(); togglePin('${n.id}')" title="${n.pinned ? '取消置顶' : '置顶'}">
              <svg viewBox="0 0 24 24" fill="${n.pinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
            </button>
            <div class="note-header">
              <div class="note-title">${escapeHtml(n.title || '无标题')}</div>
            </div>
            <div class="note-content">${escapeHtml(n.content || '')}</div>
            <div class="note-footer">
              <span class="note-date">${formatDate(n.updatedAt)}</span>
              <div class="note-actions">
                <button class="note-action-btn edit" onclick="event.stopPropagation(); openNoteModal('${n.id}')" title="编辑">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
                <button class="note-action-btn delete" onclick="event.stopPropagation(); deleteNote('${n.id}')" title="删除">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
              </div>
            </div>
          </div>`;
      }).join('');

      // Card click opens edit
      grid.querySelectorAll('.note-card').forEach(card => {
        card.addEventListener('click', () => openNoteModal(card.dataset.id));
      });
    }

    function renderMemos() {
      const list = document.getElementById('memoList');
      let filtered = memos.filter(m => {
        if (searchQuery && !m.text.toLowerCase().includes(searchQuery)) return false;
        if (memoFilter === 'active') return !m.completed;
        if (memoFilter === 'completed') return m.completed;
        if (memoFilter === 'high') return m.priority === 'high';
        return true;
      });
      // Sort: incomplete first, then by priority, then by due date
      const priOrder = { high: 0, medium: 1, low: 2 };
      filtered.sort((a, b) => {
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        if (a.priority !== b.priority) return priOrder[a.priority] - priOrder[b.priority];
        if (a.dueDate && b.dueDate) return new Date(a.dueDate) - new Date(b.dueDate);
        if (a.dueDate) return -1;
        if (b.dueDate) return 1;
        return b.createdAt - a.createdAt;
      });

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <h3>${searchQuery ? '没有找到匹配的备忘' : '还没有备忘'}</h3>
            <p>${searchQuery ? '试试其他关键词' : '点击上方按钮创建第一个备忘'}</p>
          </div>`;
        return;
      }

      list.innerHTML = filtered.map(m => {
        const overdue = isOverdue(m.dueDate, m.completed);
        const dueText = formatDue(m.dueDate);
        return `
          <div class="memo-item ${m.completed ? 'completed' : ''}" data-id="${m.id}">
            <button class="memo-checkbox ${m.completed ? 'checked' : ''}" onclick="toggleMemo('${m.id}')" title="${m.completed ? '标记为待办' : '标记为完成'}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
            <div class="memo-body">
              <div class="memo-text">${escapeHtml(m.text)}</div>
              <div class="memo-meta">
                <span class="priority-badge ${m.priority}">${PRIORITY_LABELS[m.priority]}</span>
                ${dueText ? `<span class="memo-due ${overdue ? 'overdue' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${dueText}</span>` : ''}
                <span class="memo-due"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${formatDate(m.createdAt)}</span>
              </div>
            </div>
            <div class="memo-actions">
              <button class="note-action-btn edit" onclick="openMemoModal('${m.id}')" title="编辑">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button class="note-action-btn delete" onclick="deleteMemo('${m.id}')" title="删除">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
            </div>
          </div>`;
      }).join('');
    }

    function renderStats() {
      document.getElementById('statNotes').textContent = notes.length;
      document.getElementById('statMemos').textContent = memos.filter(m => !m.completed).length;
      document.getElementById('statDone').textContent = memos.filter(m => m.completed).length;
    }

    function renderAll() {
      renderNotes();
      renderMemos();
      renderStats();
    }

    // === Note CRUD ===
    function openNoteModal(id) {
      const modal = document.getElementById('noteModal');
      const titleEl = document.getElementById('noteModalTitle');
      const titleInput = document.getElementById('noteTitle');
      const contentInput = document.getElementById('noteContent');

      if (id) {
        const note = notes.find(n => n.id === id);
        if (!note) return;
        editingNoteId = id;
        titleEl.textContent = '编辑笔记';
        titleInput.value = note.title;
        contentInput.value = note.content;
        selectedColor = note.color || 'yellow';
      } else {
        editingNoteId = null;
        titleEl.textContent = '新建笔记';
        titleInput.value = '';
        contentInput.value = '';
        selectedColor = 'yellow';
      }

      // Update color picker
      document.querySelectorAll('.color-swatch').forEach(s => {
        s.classList.toggle('selected', s.dataset.color === selectedColor);
      });

      modal.classList.add('active');
      setTimeout(() => titleInput.focus(), 100);
    }
    function closeNoteModal() {
      document.getElementById('noteModal').classList.remove('active');
      editingNoteId = null;
    }
    function saveNote() {
      const title = document.getElementById('noteTitle').value.trim();
      const content = document.getElementById('noteContent').value.trim();
      if (!title && !content) { showToast('请输入标题或内容'); return; }

      if (editingNoteId) {
        const note = notes.find(n => n.id === editingNoteId);
        note.title = title;
        note.content = content;
        note.color = selectedColor;
        note.updatedAt = Date.now();
        showToast('笔记已更新');
      } else {
        notes.unshift({
          id: uid(),
          title, content,
          color: selectedColor,
          pinned: false,
          createdAt: Date.now(),
          updatedAt: Date.now(),
        });
        showToast('笔记已创建');
      }
      saveNotes();
      renderAll();
      closeNoteModal();
    }
    function deleteNote(id) {
      notes = notes.filter(n => n.id !== id);
      saveNotes();
      renderAll();
      showToast('笔记已删除');
    }
    function togglePin(id) {
      const note = notes.find(n => n.id === id);
      if (note) {
        note.pinned = !note.pinned;
        note.updatedAt = Date.now();
        saveNotes();
        renderAll();
        showToast(note.pinned ? '已置顶' : '已取消置顶');
      }
    }

    // === Memo CRUD ===
    function openMemoModal(id) {
      const modal = document.getElementById('memoModal');
      const titleEl = document.getElementById('memoModalTitle');
      const textInput = document.getElementById('memoText');
      const dueInput = document.getElementById('memoDue');

      if (id) {
        const memo = memos.find(m => m.id === id);
        if (!memo) return;
        editingMemoId = id;
        titleEl.textContent = '编辑备忘';
        textInput.value = memo.text;
        dueInput.value = memo.dueDate || '';
        selectedPriority = memo.priority;
      } else {
        editingMemoId = null;
        titleEl.textContent = '新建备忘';
        textInput.value = '';
        dueInput.value = '';
        selectedPriority = 'high';
      }

      document.querySelectorAll('.priority-option').forEach(o => {
        o.classList.remove('selected', 'high', 'medium', 'low');
        if (o.dataset.priority === selectedPriority) {
          o.classList.add('selected', selectedPriority);
        }
      });

      modal.classList.add('active');
      setTimeout(() => textInput.focus(), 100);
    }
    function closeMemoModal() {
      document.getElementById('memoModal').classList.remove('active');
      editingMemoId = null;
    }
    function saveMemo() {
      const text = document.getElementById('memoText').value.trim();
      const dueDate = document.getElementById('memoDue').value;
      if (!text) { showToast('请输入备忘内容'); return; }

      if (editingMemoId) {
        const memo = memos.find(m => m.id === editingMemoId);
        memo.text = text;
        memo.priority = selectedPriority;
        memo.dueDate = dueDate || null;
        showToast('备忘已更新');
      } else {
        memos.unshift({
          id: uid(),
          text, priority: selectedPriority,
          dueDate: dueDate || null,
          completed: false,
          createdAt: Date.now(),
        });
        showToast('备忘已创建');
      }
      saveMemos();
      renderAll();
      closeMemoModal();
    }
    function deleteMemo(id) {
      memos = memos.filter(m => m.id !== id);
      saveMemos();
      renderAll();
      showToast('备忘已删除');
    }
    function toggleMemo(id) {
      const memo = memos.find(m => m.id === id);
      if (memo) {
        memo.completed = !memo.completed;
        saveMemos();
        renderAll();
      }
    }

    // === Event Bindings ===
    function bindEvents() {
      // Theme toggle
      document.getElementById('themeToggle').addEventListener('click', toggleTheme);

      // Tab switching
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTab = btn.dataset.tab;
          document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
          document.getElementById('view-' + currentTab).classList.add('active');
        });
      });

      // Search
      document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        renderNotes();
        renderMemos();
      });

      // Add buttons
      document.getElementById('addNoteBtn').addEventListener('click', () => openNoteModal());
      document.getElementById('addMemoBtn').addEventListener('click', () => openMemoModal());

      // Save buttons
      document.getElementById('saveNoteBtn').addEventListener('click', saveNote);
      document.getElementById('saveMemoBtn').addEventListener('click', saveMemo);

      // Color picker
      document.querySelectorAll('.color-swatch').forEach(s => {
        s.addEventListener('click', () => {
          document.querySelectorAll('.color-swatch').forEach(x => x.classList.remove('selected'));
          s.classList.add('selected');
          selectedColor = s.dataset.color;
        });
      });

      // Priority picker
      document.querySelectorAll('.priority-option').forEach(o => {
        o.addEventListener('click', () => {
          document.querySelectorAll('.priority-option').forEach(x => {
            x.classList.remove('selected', 'high', 'medium', 'low');
          });
          selectedPriority = o.dataset.priority;
          o.classList.add('selected', selectedPriority);
        });
      });

      // Filter chips
      document.querySelectorAll('.chip').forEach(c => {
        c.addEventListener('click', () => {
          document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
          c.classList.add('active');
          memoFilter = c.dataset.filter;
          renderMemos();
        });
      });

      // Modal overlay click to close
      document.getElementById('noteModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeNoteModal();
      });
      document.getElementById('memoModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeMemoModal();
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeNoteModal(); closeMemoModal(); }
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          if (document.getElementById('noteModal').classList.contains('active')) saveNote();
          if (document.getElementById('memoModal').classList.contains('active')) saveMemo();
        }
      });
    }

    // === Init ===
    function seedDemoData() {
      if (notes.length === 0 && memos.length === 0) {
        notes = [
          { id: uid(), title: '欢迎使用笔记备忘录', content: '这是一个简洁实用的笔记与备忘录应用。\n\n你可以在这里记录想法、灵感、待办事项等所有重要内容。数据自动保存在本地，安全可靠。', color: 'purple', pinned: true, createdAt: Date.now(), updatedAt: Date.now() },
          { id: uid(), title: '功能介绍', content: '笔记功能：\n- 创建、编辑、删除笔记\n- 6种颜色标签分类\n- 置顶重要笔记\n- 全文搜索\n\n备忘录功能：\n- 创建待办事项\n- 三级优先级\n- 设置截止日期\n- 一键标记完成\n- 按状态筛选', color: 'blue', pinned: false, createdAt: Date.now() - 3600000, updatedAt: Date.now() - 3600000 },
          { id: uid(), title: '读书笔记', content: '《深度工作》要点：\n1. 专注于高认知密度任务\n2. 减少浅层工作的比例\n3. 建立固定的工作仪式\n4. 学会拥抱无聊', color: 'green', pinned: false, createdAt: Date.now() - 86400000, updatedAt: Date.now() - 86400000 },
        ];
        const today = new Date().toISOString().slice(0, 10);
        const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
        memos = [
          { id: uid(), text: '回复客户邮件', priority: 'high', dueDate: today, completed: false, createdAt: Date.now() },
          { id: uid(), text: '准备明天的会议演示文稿', priority: 'high', dueDate: tomorrow, completed: false, createdAt: Date.now() - 1800000 },
          { id: uid(), text: '购买生日礼物', priority: 'medium', dueDate: null, completed: false, createdAt: Date.now() - 7200000 },
          { id: uid(), text: '整理桌面文件', priority: 'low', dueDate: null, completed: true, createdAt: Date.now() - 172800000 },
        ];
        saveNotes();
        saveMemos();
      }
    }

    // === Start ===
    initTheme();
    loadData();
    seedDemoData();
    bindEvents();
    renderAll();
  </script>
</body>
</html>
