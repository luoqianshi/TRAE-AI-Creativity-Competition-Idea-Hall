<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能数据汇聚分析台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2235;
            --accent-cyan: #00f5ff;
            --accent-magenta: #ff00aa;
            --accent-purple: #8b5cf6;
            --accent-orange: #ff6b35;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --glow-cyan: 0 0 20px rgba(0, 245, 255, 0.4);
            --glow-magenta: 0 0 20px rgba(255, 0, 170, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景效果 */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow-1 {
            top: -200px;
            right: -100px;
            background: var(--accent-cyan);
        }

        .bg-glow-2 {
            bottom: -200px;
            left: -100px;
            background: var(--accent-magenta);
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
            min-height: 100vh;
        }

        /* 头部 */
        header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: var(--glow-cyan);
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            letter-spacing: 2px;
        }

        /* 输入区域 */
        .input-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 245, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .input-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta), var(--accent-purple));
        }

        .input-wrapper {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        .main-input {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid rgba(0, 245, 255, 0.2);
            border-radius: 12px;
            padding: 16px 20px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            resize: none;
            min-height: 60px;
            transition: all 0.3s ease;
        }

        .main-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
        }

        .main-input::placeholder {
            color: var(--text-secondary);
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            color: var(--bg-primary);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-cyan);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* 智能体选择 */
        .agents-section {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .agent-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .agent-chip:hover {
            border-color: rgba(0, 245, 255, 0.3);
        }

        .agent-chip.selected {
            border-color: var(--accent-cyan);
            background: rgba(0, 245, 255, 0.1);
            box-shadow: var(--glow-cyan);
        }

        .agent-chip.selected .agent-dot {
            background: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
        }

        .agent-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .agent-name {
            font-size: 14px;
            font-weight: 500;
        }

        .agent-status {
            font-size: 10px;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        /* 主内容区 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* 数据面板 */
        .data-panel {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(0, 245, 255, 0.1);
            position: relative;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-badge {
            background: var(--accent-cyan);
            color: var(--bg-primary);
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 10px;
        }

        /* 关键词云 */
        .keywords-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 80px;
        }

        .keyword {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .keyword::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .keyword:hover {
            transform: scale(1.05);
        }

        .keyword.keyword-1 {
            background: rgba(0, 245, 255, 0.15);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .keyword.keyword-2 {
            background: rgba(255, 0, 170, 0.15);
            border: 1px solid var(--accent-magenta);
            color: var(--accent-magenta);
        }

        .keyword.keyword-3 {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid var(--accent-purple);
            color: var(--accent-purple);
        }

        .keyword.keyword-4 {
            background: rgba(255, 107, 53, 0.15);
            border: 1px solid var(--accent-orange);
            color: var(--accent-orange);
        }

        .keyword.highlighted {
            transform: scale(1.1);
            box-shadow: 0 0 20px currentColor;
        }

        /* 数据流展示 */
        .data-stream {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .data-stream::-webkit-scrollbar {
            width: 4px;
        }

        .data-stream::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 2px;
        }

        .data-stream::-webkit-scrollbar-thumb {
            background: var(--accent-cyan);
            border-radius: 2px;
        }

        .data-item {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 14px 16px;
            border-left: 3px solid var(--accent-cyan);
            transition: all 0.3s ease;
        }

        .data-item:hover {
            background: rgba(0, 245, 255, 0.05);
            transform: translateX(4px);
        }

        .data-item.item-2 {
            border-left-color: var(--accent-magenta);
        }

        .data-item.item-3 {
            border-left-color: var(--accent-purple);
        }

        .data-item.item-4 {
            border-left-color: var(--accent-orange);
        }

        .data-source {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .data-source-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .data-content {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-primary);
        }

        .data-tags {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .data-tag {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(0, 245, 255, 0.1);
            color: var(--accent-cyan);
        }

        /* 交互画布 */
        .interaction-canvas-container {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 0, 170, 0.2);
            position: relative;
        }

        .canvas-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .tool-bar {
            display: flex;
            gap: 8px;
        }

        .tool-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .tool-btn:hover {
            border-color: var(--accent-magenta);
            color: var(--accent-magenta);
        }

        .tool-btn.active {
            background: rgba(255, 0, 170, 0.15);
            border-color: var(--accent-magenta);
            color: var(--accent-magenta);
        }

        .canvas-wrapper {
            position: relative;
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            min-height: 350px;
        }

        #interactionCanvas {
            width: 100%;
            height: 350px;
            cursor: crosshair;
        }

        .canvas-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .canvas-placeholder.hidden {
            display: none;
        }

        .canvas-placeholder svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        /* 用户反馈区 */
        .feedback-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .feedback-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .feedback-item {
            background: var(--bg-secondary);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .feedback-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .feedback-content {
            flex: 1;
        }

        .feedback-type {
            font-size: 11px;
            color: var(--accent-purple);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .feedback-text {
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .feedback-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .feedback-action {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .feedback-action:hover {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
        }

        .feedback-action.primary {
            background: rgba(139, 92, 246, 0.15);
            border-color: var(--accent-purple);
            color: var(--accent-purple);
        }

        /* 状态栏 */
        .status-bar {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(0, 245, 255, 0.1);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-cyan);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-indicator.searching {
            background: var(--accent-orange);
            animation: pulse 0.5s infinite;
        }

        .status-indicator.complete {
            background: var(--accent-cyan);
            animation: none;
        }

        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 23, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(0, 245, 255, 0.1);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .loading-agents {
            display: flex;
            gap: 16px;
            margin-top: 20px;
        }

        .loading-agent {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-card);
            border-radius: 20px;
            font-size: 12px;
        }

        .loading-agent-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-cyan);
            animation: pulse 1s infinite;
        }

        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.5s ease forwards;
        }

        .stagger-1 { animation-delay: 0.1s; opacity: 0; }
        .stagger-2 { animation-delay: 0.2s; opacity: 0; }
        .stagger-3 { animation-delay: 0.3s; opacity: 0; }
        .stagger-4 { animation-delay: 0.4s; opacity: 0; }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="container">
        <header class="animate-in">
            <div class="logo">智能数据汇聚分析台</div>
            <div class="subtitle">MULTI-AGENT DATA SYNTHESIS ENGINE</div>
        </header>

        <section class="input-section animate-in stagger-1">
            <div class="input-wrapper">
                <textarea 
                    class="main-input" 
                    id="userInput" 
                    placeholder="输入你的需求或问题... 例如：分析2024年新能源汽车市场趋势"
                    rows="2"
                ></textarea>
                <button class="submit-btn" id="submitBtn">
                    <span>搜索分析</span>
                </button>
            </div>
            <div class="agents-section" id="agentsSection">
                <div class="agent-chip selected" data-agent="gpt4">
                    <span class="agent-dot"></span>
                    <span class="agent-name">GPT-4</span>
                    <span class="agent-status">在线</span>
                </div>
                <div class="agent-chip selected" data-agent="claude">
                    <span class="agent-dot"></span>
                    <span class="agent-name">Claude</span>
                    <span class="agent-status">在线</span>
                </div>
                <div class="agent-chip selected" data-agent="gemini">
                    <span class="agent-dot"></span>
                    <span class="agent-name">Gemini</span>
                    <span class="agent-status">在线</span>
                </div>
                <div class="agent-chip selected" data-agent="deepseek">
                    <span class="agent-dot"></span>
                    <span class="agent-name">DeepSeek</span>
                    <span class="agent-status">在线</span>
                </div>
            </div>
        </section>

        <div class="main-content">
            <section class="data-panel animate-in stagger-2">
                <div class="panel-header">
                    <div class="panel-title">
                        <div class="panel-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <path d="m21 21-4.35-4.35"/>
                            </svg>
                        </div>
                        数据汇聚
                        <span class="panel-badge" id="dataCount">0</span>
                    </div>
                </div>
                <div class="data-stream" id="dataStream">
                    <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                        暂无数据，请先输入需求
                    </div>
                </div>
            </section>

            <section class="data-panel animate-in stagger-3">
                <div class="panel-header">
                    <div class="panel-title">
                        <div class="panel-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                            </svg>
                        </div>
                        关键词提取
                    </div>
                </div>
                <div class="keywords-container" id="keywordsContainer">
                    <div style="text-align: center; padding: 40px; color: var(--text-secondary); width: 100%;">
                        数据将自动提取关键词
                    </div>
                </div>
            </section>
        </div>

        <section class="interaction-canvas-container animate-in stagger-4">
            <div class="canvas-header">
                <div class="panel-title">
                    <div class="panel-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-magenta)" stroke-width="2">
                            <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                            <path d="M2 2l7.586 7.586"/>
                            <circle cx="11" cy="11" r="2"/>
                        </svg>
                    </div>
                    交互标注区
                </div>
                <div class="tool-bar">
                    <button class="tool-btn active" id="selectTool" title="选择">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
                        </svg>
                    </button>
                    <button class="tool-btn" id="rectTool" title="框选">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                        </svg>
                    </button>
                    <button class="tool-btn" id="drawTool" title="划线">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 17l6-6 4 4 8-8"/>
                        </svg>
                    </button>
                    <button class="tool-btn" id="clearTool" title="清除">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="canvas-wrapper">
                <canvas id="interactionCanvas"></canvas>
                <div class="canvas-placeholder" id="canvasPlaceholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M3 9h18M9 21V9"/>
                    </svg>
                    <div>使用框选或划线工具标注数据</div>
                    <div style="font-size: 12px; margin-top: 8px;">选中的区域将作为二次分析的参考</div>
                </div>
            </div>
        </section>

        <section class="feedback-section animate-in stagger-4" style="margin-top: 24px;">
            <div class="panel-header">
                <div class="panel-title">
                    <div class="panel-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-purple)" stroke-width="2">
                            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                        </svg>
                    </div>
                    用户反馈
                </div>
            </div>
            <div class="feedback-list" id="feedbackList">
                <div style="text-align: center; padding: 30px; color: var(--text-secondary);">
                    在画布上框选或划线后，将自动生成反馈意见
                </div>
            </div>
        </section>

        <div class="status-bar" style="margin-top: 24px;">
            <div class="status-item">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">就绪</span>
            </div>
            <div class="status-item">
                <span id="selectedCount">已选: 0 个智能体</span>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在分析搜索...</div>
        <div class="loading-agents" id="loadingAgents"></div>
    </div>

    <script>
        // 状态管理
        const state = {
            agents: ['gpt4', 'claude', 'gemini', 'deepseek'],
            selectedAgents: ['gpt4', 'claude', 'gemini', 'deepseek'],
            currentTool: 'select',
            isDrawing: false,
            startX: 0,
            startY: 0,
            annotations: [],
            feedbacks: [],
            dataResults: []
        };

        // 模拟数据
        const mockData = {
            gpt4: {
                name: 'GPT-4',
                color: 'var(--accent-cyan)',
                results: [
                    { content: '2024年新能源汽车市场呈现爆发式增长，预计全年销量将突破1000万辆，同比增长35%。动力电池技术持续突破，固态电池成为研发热点。', tags: ['销量增长', '电池技术', '固态电池'] },
                    { content: '特斯拉Model 3和Model Y持续领跑，比亚迪汉 EV销量稳步提升。造车新势力中，理想汽车凭借增程式路线表现亮眼。', tags: ['特斯拉', '比亚迪', '理想汽车'] },
                    { content: '充电基础设施加快建设，全国充电桩数量已超过300万根。800V高压快充技术逐步普及，充电时间缩短至15分钟。', tags: ['充电桩', '800V快充', '基础设施'] }
                ],
                keywords: ['新能源汽车', '动力电池', '智能驾驶', '充电网络', '市场份额', '技术创新']
            },
            claude: {
                name: 'Claude',
                color: 'var(--accent-magenta)',
                results: [
                    { content: '政策层面，国家继续实施新能源汽车购置税减免政策至2025年底，补贴退坡有序进行，引导行业向市场化转型。', tags: ['购置税减免', '补贴政策', '市场化'] },
                    { content: '动力电池回收产业链加速形成，工信部发布电池回收利用指南，构建绿色循环经济体系。', tags: ['电池回收', '绿色经济', '产业链'] },
                    { content: '智能座舱和自动驾驶成为核心竞争力，多屏联动、语音交互、OTA升级成为标配功能。', tags: ['智能座舱', '自动驾驶', 'OTA'] }
                ],
                keywords: ['政策支持', '电池回收', '智能座舱', '自动驾驶', '产业链', '绿色发展']
            },
            gemini: {
                name: 'Gemini',
                color: 'var(--accent-purple)',
                results: [
                    { content: '原材料价格回落，碳酸锂价格从60万/吨降至20万/吨，电池成本下降20%，整车成本压力缓解。', tags: ['碳酸锂', '成本下降', '原材料'] },
                    { content: '出口市场持续扩大，欧洲成为最大出口目的地，中国品牌在欧洲市场份额提升至8%。', tags: ['出口增长', '欧洲市场', '中国品牌'] },
                    { content: '混动车型增速领先，插电混动和增程式车型销量同比翻倍，满足多样化消费需求。', tags: ['混动车型', '插电混动', '增程式'] }
                ],
                keywords: ['原材料价格', '出口市场', '混动车型', '欧洲布局', '消费需求', '市场细分']
            },
            deepseek: {
                name: 'DeepSeek',
                color: 'var(--accent-orange)',
                results: [
                    { content: '技术创新持续突破，CTP/CTC技术、刀片电池、4680大圆柱电池等技术路线并行发展，能量密度不断提升。', tags: ['CTP技术', '刀片电池', '4680电池'] },
                    { content: '固态电池量产进程加速，宁德时代和比亚迪计划2026年实现全固态电池装车，能量密度目标500Wh/kg。', tags: ['固态电池', '量产计划', '能量密度'] },
                    { content: '智能驾驶L2+级辅助驾驶渗透率超过40%，城市NOA成为新一轮竞争焦点，华为、小鹏领跑。', tags: ['城市NOA', 'L2+辅助', '华为'] }
                ],
                keywords: ['技术创新', '固态电池', '智能驾驶', '能量密度', '竞争格局', '技术路线']
            }
        };

        // DOM 元素
        const userInput = document.getElementById('userInput');
        const submitBtn = document.getElementById('submitBtn');
        const agentsSection = document.getElementById('agentsSection');
        const dataStream = document.getElementById('dataStream');
        const keywordsContainer = document.getElementById('keywordsContainer');
        const dataCount = document.getElementById('dataCount');
        const canvas = document.getElementById('interactionCanvas');
        const ctx = canvas.getContext('2d');
        const canvasPlaceholder = document.getElementById('canvasPlaceholder');
        const feedbackList = document.getElementById('feedbackList');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingAgents = document.getElementById('loadingAgents');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const selectedCount = document.getElementById('selectedCount');

        // 工具按钮
        const toolBtns = document.querySelectorAll('.tool-btn:not(#clearTool)');
        const clearTool = document.getElementById('clearTool');

        // 初始化画布
        function initCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            redrawCanvas();
        }

        // 重绘画布
        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格背景
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width / window.devicePixelRatio; x += 30) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height / window.devicePixelRatio);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height / window.devicePixelRatio; y += 30) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width / window.devicePixelRatio, y);
                ctx.stroke();
            }

            // 绘制数据区域背景
            state.dataResults.forEach((item, index) => {
                const x = 50 + (index % 3) * 200;
                const y = 50 + Math.floor(index / 3) * 120;
                const width = 180;
                const height = 100;

                // 背景
                ctx.fillStyle = item.color.replace(')', ', 0.1)').replace('var(--', 'rgba(');
                ctx.fillRect(x, y, width, height);

                // 边框
                ctx.strokeStyle = item.color.replace(')', ', 0.3)').replace('var(--', 'rgba(');
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, width, height);

                // 标签
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.font = '10px Noto Sans SC';
                ctx.fillText(item.source, x + 10, y + 20);
            });

            // 绘制标注
            state.annotations.forEach(anno => {
                if (anno.type === 'rect') {
                    ctx.strokeStyle = '#ff00aa';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(anno.x, anno.y, anno.width, anno.height);
                    ctx.setLineDash([]);
                    
                    // 标注文字
                    ctx.fillStyle = '#ff00aa';
                    ctx.font = '12px Noto Sans SC';
                    ctx.fillText(anno.label || '选中区域', anno.x, anno.y - 5);
                } else if (anno.type === 'line') {
                    ctx.strokeStyle = '#ff6b35';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(anno.x1, anno.y1);
                    ctx.lineTo(anno.x2, anno.y2);
                    ctx.stroke();

                    // 端点
                    ctx.fillStyle = '#ff6b35';
                    ctx.beginPath();
                    ctx.arc(anno.x1, anno.y1, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(anno.x2, anno.y2, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        // 智能体选择
        agentsSection.addEventListener('click', (e) => {
            const chip = e.target.closest('.agent-chip');
            if (chip) {
                const agent = chip.dataset.agent;
                chip.classList.toggle('selected');
                if (state.selectedAgents.includes(agent)) {
                    state.selectedAgents = state.selectedAgents.filter(a => a !== agent);
                } else {
                    state.selectedAgents.push(agent);
                }
                selectedCount.textContent = `已选: ${state.selectedAgents.length} 个智能体`;
            }
        });

        // 工具选择
        toolBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                toolBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.currentTool = btn.id.replace('Tool', '');
                canvas.style.cursor = state.currentTool === 'select' ? 'default' : 'crosshair';
            });
        });

        // 清除工具
        clearTool.addEventListener('click', () => {
            state.annotations = [];
            state.feedbacks = [];
            updateFeedbackList();
            redrawCanvas();
        });

        // 画布交互
        canvas.addEventListener('mousedown', (e) => {
            if (state.currentTool === 'select') return;
            
            const rect = canvas.getBoundingClientRect();
            state.isDrawing = true;
            state.startX = e.clientX - rect.left;
            state.startY = e.clientY - rect.top;
            canvasPlaceholder.classList.add('hidden');
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!state.isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            redrawCanvas();

            if (state.currentTool === 'rect') {
                ctx.strokeStyle = '#ff00aa';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(
                    state.startX,
                    state.startY,
                    currentX - state.startX,
                    currentY - state.startY
                );
                ctx.setLineDash([]);
            } else if (state.currentTool === 'draw') {
                ctx.strokeStyle = '#ff6b35';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(state.startX, state.startY);
                ctx.lineTo(currentX, currentY);
                ctx.stroke();
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!state.isDrawing) return;
            state.isDrawing = false;

            const rect = canvas.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;

            if (state.currentTool === 'rect') {
                const annotation = {
                    type: 'rect',
                    x: Math.min(state.startX, endX),
                    y: Math.min(state.startY, endY),
                    width: Math.abs(endX - state.startX),
                    height: Math.abs(endY - state.startY)
                };
                state.annotations.push(annotation);
                generateFeedback(annotation);
            } else if (state.currentTool === 'draw') {
                const annotation = {
                    type: 'line',
                    x1: state.startX,
                    y1: state.startY,
                    x2: endX,
                    y2: endY
                };
                state.annotations.push(annotation);
                generateFeedback(annotation);
            }

            redrawCanvas();
        });

        // 生成反馈
        function generateFeedback(annotation) {
            const feedbacks = [
                { type: '疑问', text: '这个区域的锂电池成本数据是否完整？建议补充2023年Q4的价格走势' },
                { type: '建议', text: '可以增加关于磷酸铁锂和三元锂电池的对比分析' },
                { type: '看法', text: '我认为固态电池的商业化时间表可能过于乐观' },
                { type: '疑问', text: '欧洲市场的数据来源是哪里？需要更详细的出处说明' },
                { type: '建议', text: '建议增加关于特斯拉FSD和华为ADS的对比内容' }
            ];

            const feedback = feedbacks[Math.floor(Math.random() * feedbacks.length)];
            state.feedbacks.push(feedback);
            updateFeedbackList();
        }

        // 更新反馈列表
        function updateFeedbackList() {
            if (state.feedbacks.length === 0) {
                feedbackList.innerHTML = `
                    <div style="text-align: center; padding: 30px; color: var(--text-secondary);">
                        在画布上框选或划线后，将自动生成反馈意见
                    </div>
                `;
                return;
            }

            feedbackList.innerHTML = state.feedbacks.map((f, i) => `
                <div class="feedback-item">
                    <div class="feedback-icon">${f.type[0]}</div>
                    <div class="feedback-content">
                        <div class="feedback-type">${f.type}</div>
                        <div class="feedback-text">${f.text}</div>
                        <div class="feedback-actions">
                            <button class="feedback-action primary" onclick="applyFeedback(${i})">应用到二次分析</button>
                            <button class="feedback-action" onclick="removeFeedback(${i})">删除</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 应用反馈到二次分析
        window.applyFeedback = function(index) {
            const feedback = state.feedbacks[index];
            userInput.value = userInput.value + ' ' + feedback.text;
            statusIndicator.className = 'status-indicator searching';
            statusText.textContent = '正在根据反馈二次分析...';
            
            setTimeout(() => {
                statusIndicator.className = 'status-indicator complete';
                statusText.textContent = '二次分析完成';
            }, 1500);
        };

        // 删除反馈
        window.removeFeedback = function(index) {
            state.feedbacks.splice(index, 1);
            updateFeedbackList();
        };

        // 关键词点击
        keywordsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('keyword')) {
                e.target.classList.toggle('highlighted');
                const keyword = e.target.textContent;
                if (userInput.value) {
                    userInput.value += ' ' + keyword;
                } else {
                    userInput.value = keyword;
                }
            }
        });

        // 提交搜索
        submitBtn.addEventListener('click', performSearch);
        userInput.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                performSearch();
            }
        });

        async function performSearch() {
            const query = userInput.value.trim();
            if (!query) return;
            if (state.selectedAgents.length === 0) {
                alert('请至少选择一个智能体');
                return;
            }

            // 显示加载
            loadingOverlay.classList.add('active');
            loadingAgents.innerHTML = state.selectedAgents.map(agent => `
                <div class="loading-agent">
                    <span class="loading-agent-dot"></span>
                    <span>${mockData[agent].name}</span>
                </div>
            `).join('');

            statusIndicator.className = 'status-indicator searching';
            statusText.textContent = '搜索分析中...';

            // 模拟搜索延迟
            await new Promise(resolve => setTimeout(resolve, 2000));

            // 收集数据
            state.dataResults = [];
            let allKeywords = [];

            state.selectedAgents.forEach(agent => {
                const data = mockData[agent];
                data.results.forEach(result => {
                    state.dataResults.push({
                        ...result,
                        source: data.name,
                        color: data.color
                    });
                });
                allKeywords = allKeywords.concat(data.keywords);
            });

            // 更新UI
            updateDataStream();
            updateKeywords(allKeywords);
            dataCount.textContent = state.dataResults.length;

            // 重绘画布
            redrawCanvas();

            // 隐藏加载
            loadingOverlay.classList.remove('active');
            statusIndicator.className = 'status-indicator complete';
            statusText.textContent = '分析完成';
        }

        function updateDataStream() {
            dataStream.innerHTML = state.dataResults.map((item, index) => `
                <div class="data-item item-${(index % 4) + 1}">
                    <div class="data-source">
                        <span class="data-source-dot" style="background: ${item.color}"></span>
                        ${item.source}
                    </div>
                    <div class="data-content">${item.content}</div>
                    <div class="data-tags">
                        ${item.tags.map(tag => `<span class="data-tag">${tag}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        function updateKeywords(keywords) {
            const keywordClasses = ['keyword-1', 'keyword-2', 'keyword-3', 'keyword-4'];
            keywordsContainer.innerHTML = keywords.map((keyword, index) => `
                <span class="keyword ${keywordClasses[index % 4]}">${keyword}</span>
            `).join('');
        }

        // 初始化
        initCanvas();
        window.addEventListener('resize', initCanvas);
        selectedCount.textContent = `已选: ${state.selectedAgents.length} 个智能体`;
    </script>
</body>
</html>
