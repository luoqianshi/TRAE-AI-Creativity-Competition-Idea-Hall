    action: 'HUNG_UP'
  },
  suspicious: {
    number: '171****9999',
    label: '陌生号码',
    risk: 'SUSPICIOUS',
    riskLabel: '可疑',
    message: '检测到可疑关键词：验证码',
    detail: '请谨慎接听，已通知家人',
    color: 'badge-suspicious',
    alertIcon: '⚠️',
    alertTitle: '请注意',
    alertMsg: '此电话存在风险，请注意不要透露个人信息',
    action: 'WARNED'
  },
  fraud: {
    number: '+852****1234',
    label: '境外来电',
    risk: 'FRAUD',
    riskLabel: '诈骗',
    message: '检测到诈骗话术：安全账户、转账、涉嫌洗钱',
    detail: '已通知家人',
    color: 'badge-fraud',
    alertIcon: '🚨',
    alertTitle: '紧急提醒！',
    alertMsg: '此电话被判定为诈骗电话，请立即挂断！不要转账！',
    action: 'NOTIFIED_FAMILY'
  }
};

function now() {
  return new Date().toLocaleTimeString('zh-CN');
}

function log(tag, text, tagClass) {
  const content = document.getElementById('logContent');
  const line = document.createElement('div');
  line.className = 'log-line';
  line.innerHTML = `<span class="log-time">${now()}</span><span class="log-tag ${tagClass}">${tag}</span>${text}`;
  content.insertBefore(line, content.firstChild);
}

function toggleGuard() {
  isGuarding = !isGuarding;
  const btn = document.getElementById('elderStatusBtn');
  const text = document.getElementById('statusText');
  const check = document.getElementById('checkIcon');
  const guardBtn = document.getElementById('guardBtn');

  if (isGuarding) {
    btn.className = 'elder-status-btn active';
    text.textContent = '正在保护';
    check.textContent = '✓';
    guardBtn.textContent = '关闭守护';
    guardBtn.className = 'btn btn-secondary';
    log('系统', '守护功能已开启', 'tag-system');
    updateChildStatus(true);
  } else {
    btn.className = 'elder-status-btn inactive';
    text.textContent = '点击开启';
    check.textContent = '';
    guardBtn.textContent = '开启守护';
    guardBtn.className = 'btn btn-primary';
    log('系统', '守护功能已关闭', 'tag-system');
    updateChildStatus(false);
  }
}

function updateChildStatus(active) {
  const card = document.getElementById('childStatusCard');
  const text = document.getElementById('childStatusText');
  if (active) {
    card.className = 'status-card';
    text.textContent = '守护中 · 一切正常';
  } else {
    card.className = 'status-card offline';
    text.textContent = '守护已暂停';
  }
}

function speakStatus() {
  if (!isGuarding) {
    showElderAlert('🔇', '守护未开启', '请点击上方按钮开启防诈耳');
    return;
  }
  log('系统', '语音播报：防诈耳正在保护您的通话安全', 'tag-system');
  showElderAlert('🔊', '播报状态', '防诈耳正在保护您的通话安全');
}

function showRecentCalls() {
  log('系统', '打开最近来电列表', 'tag-system');
}

function simulateCall(type) {
  if (!isGuarding) {
    showElderAlert('🔇', '守护未开启', '请先点击开启守护功能');
    return;
  }

  const scenario = SCENARIOS[type];
  log('来电', `收到来电：${scenario.number} (${scenario.label})`, 'tag-record');

  // Show incoming call on elder phone
  document.getElementById('callerNumber').textContent = scenario.number;
  document.getElementById('callerLabel').textContent = scenario.label;
  document.getElementById('incomingCall').classList.add('show');

  // Auto-answer after 1s for demo
  setTimeout(() => {
    document.getElementById('incomingCall').classList.remove('show');
    startAnalysis(scenario);
  }, 1500);
}

function answerCall() {
  document.getElementById('incomingCall').classList.remove('show');
}

function hangupCall() {
  document.getElementById('incomingCall').classList.remove('show');
}

function startAnalysis(scenario) {
  const overlay = document.getElementById('analysisOverlay');
  const icon = document.getElementById('analysisIcon');
  const title = document.getElementById('analysisTitle');
  const detail = document.getElementById('analysisDetail');
  const bar = document.getElementById('progressBar');

  overlay.classList.add('show');
  icon.textContent = '🛡️';
  title.textContent = '正在分析通话...';
  detail.textContent = '防诈耳正在实时检测通话内容';
  bar.style.width = '0%';

  log('AI', '开始本地关键词检测', 'tag-ai');

  setTimeout(() => { bar.style.width = '30%'; }, 300);
  setTimeout(() => { bar.style.width = '60%'; log('AI', `匹配关键词：${scenario.message}`, 'tag-ai'); }, 800);

  setTimeout(() => {
    bar.style.width = '100%';
    overlay.classList.remove('show');

    // Record call
    const record = {
      id: Date.now(),
      name: scenario.label === '陌生号码' ? null : scenario.label,
      phone: scenario.number,
      time: new Date(),
      duration: Math.floor(Math.random() * 60 + 10),
      risk: scenario.risk,
      riskLabel: scenario.riskLabel,
      color: scenario.color,
      action: scenario.action
    };
    callHistory.unshift(record);

    // Show alert on elder phone
    if (scenario.risk !== 'NORMAL') {
      showElderAlert(scenario.alertIcon, scenario.alertTitle, scenario.alertMsg);
    }

    // Notify child phone
    if (scenario.risk === 'SUSPICIOUS' || scenario.risk === 'FRAUD') {
      setTimeout(() => {
        showChildToast(scenario);
        log('通知', `已通知家人：${scenario.number} - ${scenario.riskLabel}`, 'tag-notify');
      }, 500);
    }

    // Update child screens
    renderCalls();
    log('系统', `通话分析完成：${scenario.riskLabel}`, 'tag-system');

  }, 1800);
}

function showElderAlert(icon, title, msg) {
  document.getElementById('alertIcon').textContent = icon;
  document.getElementById('alertTitle').textContent = title;
  document.getElementById('alertMsg').textContent = msg;
  document.getElementById('alertOverlay').classList.add('show');
}

function closeAlert() {
  document.getElementById('alertOverlay').classList.remove('show');
}

function showChildToast(scenario) {
  const toast = document.getElementById('toast');
  const text = document.getElementById('toastText');
  text.innerHTML = `<strong>【${scenario.riskLabel}风险】</strong><br>老人接到来自 ${scenario.number} 的${scenario.riskLabel}电话，请尽快联系确认！`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 5000);
}

function renderCalls() {
  const recentList = document.getElementById('recentCallsList');
  const allList = document.getElementById('allCallsList');

  const html = calls => calls.map(c => `
    <div class="call-item">
      <div class="call-avatar ${c.color.replace('badge-', 'bg-')}" style="background:${getRiskBg(c.risk)};color:${getRiskColor(c.risk)};">
        📞
      </div>
      <div class="call-info">
        <div class="name">${c.name || c.phone}</div>
        <div class="time">${c.time.toLocaleString('zh-CN')} · ${c.duration}秒</div>
      </div>
      <div class="call-badge ${c.color}">${c.riskLabel}</div>
    </div>
  `).join('');

  recentList.innerHTML = html(callHistory.slice(0, 3));
  allList.innerHTML = html(callHistory);
}

function getRiskBg(risk) {
  const map = { NORMAL: '#d1fae5', SALES: '#fef3c7', SUSPICIOUS: '#ffedd5', FRAUD: '#fee2e2' };
  return map[risk] || '#f1f5f9';
}
function getRiskColor(risk) {
  const map = { NORMAL: '#059669', SALES: '#d97706', SUSPICIOUS: '#ea580c', FRAUD: '#dc2626' };
  return map[risk] || '#64748b';
}

function switchTab(tab) {
  document.querySelectorAll('.child-screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

  if (tab === 'dashboard') {
    document.getElementById('screenDashboard').classList.add('active');
    document.querySelectorAll('.tab')[0].classList.add('active');
  } else if (tab === 'calls') {
    document.getElementById('screenCalls').classList.add('active');
    document.querySelectorAll('.tab')[1].classList.add('active');
  } else if (tab === 'whitelist') {
    document.getElementById('screenWhitelist').classList.add('active');
    document.querySelectorAll('.tab')[2].classList.add('active');
    renderWhitelist();
  } else if (tab === 'notifyContacts') {
    document.getElementById('screenNotifyContacts').classList.add('active');
    document.querySelectorAll('.tab')[3].classList.add('active');
    renderNotifyContacts();
  }
}

function renderWhitelist() {
  const list = document.getElementById('whitelistList');
  list.innerHTML = whitelist.map(w => `
    <div class="wl-item">
      <div class="wl-avatar">✅</div>
      <div class="wl-info">
        <div class="name">${w.name}</div>
        <div class="phone">${w.phone}</div>
      </div>
      <button class="wl-delete">🗑️</button>
    </div>
  `).join('');
}

function showConfig() {
  alert('远程配置功能：\n\n• 灵敏度：HIGH\n• 守护状态：开启\n• 紧急联系人：已设置');
}

function renderNotifyContacts() {
  const list = document.getElementById('notifyContactsList');
  if (notifyContacts.length === 0) {
    list.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:40px;">暂无通知人员，请点击右上角添加</div>';
    return;
  }
  list.innerHTML = notifyContacts.map(c => `
    <div class="nc-item" style="opacity:${c.isActive ? 1 : 0.6}">
      <div class="nc-priority ${c.isActive ? '' : 'inactive'}">${c.priority}</div>
      <div class="nc-info">
        <div class="name">
          ${c.name}
          ${c.priority === 1 ? '<span class="nc-badge">首选</span>' : ''}
        </div>
        <div class="phone">${c.phone}</div>
        <div class="methods">通知方式：${c.methods.join(' · ')}</div>
      </div>
      <button class="nc-toggle ${c.isActive ? 'on' : 'off'}" onclick="toggleContact(${c.id})"></button>
      <button class="wl-delete" onclick="deleteContact(${c.id})" style="margin-left:4px;">🗑️</button>
    </div>
  `).join('');
}

function toggleContact(id) {
  const c = notifyContacts.find(x => x.id === id);
  if (c) {
    c.isActive = !c.isActive;
    renderNotifyContacts();
    log('通知', `${c.isActive ? '启用' : '暂停'}通知联系人：${c.name}`, 'tag-notify');
  }
}

function deleteContact(id) {
  const c = notifyContacts.find(x => x.id === id);
  if (!c) return;
  if (!confirm(`确定删除通知联系人「${c.name}」吗？`)) return;
  notifyContacts = notifyContacts.filter(x => x.id !== id);
  // Re-assign priorities
  notifyContacts.sort((a, b) => a.priority - b.priority);
  notifyContacts.forEach((c, i) => c.priority = i + 1);
  renderNotifyContacts();
  log('通知', `已删除通知联系人：${c.name}`, 'tag-notify');
}

function showAddContactDialog() {
  const name = prompt('请输入联系人姓名：');
  if (!name || !name.trim()) return;
  const phone = prompt('请输入电话号码：');
  if (!phone || !phone.trim()) return;

  const methodStr = prompt('请选择通知方式（可多选，用逗号分隔）：\n1-推送  2-短信  3-电话\n例如输入：1,2,3');
  let methods = ['推送'];
  if (methodStr) {
    const map = { '1': '推送', '2': '短信', '3': '电话' };
    const selected = methodStr.split(/[,，]/).map(s => map[s.trim()]).filter(Boolean);
    if (selected.length) methods = selected;
  }

  const newContact = {
    id: Date.now(),
    name: name.trim(),
    phone: phone.trim(),
    priority: notifyContacts.length + 1,
    methods,
    isActive: true
  };
  notifyContacts.push(newContact);
  renderNotifyContacts();
  log('通知', `新增通知联系人：${newContact.name} (${newContact.phone})`, 'tag-notify');
}

// Init
renderWhitelist();
renderNotifyContacts();
</script>
