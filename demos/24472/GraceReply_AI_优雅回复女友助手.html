<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优雅回应女友助手 — Grace Reply</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #7c5cfc;
            --primary-light: #a78bfa;
            --primary-dark: #5b3fd4;
            --accent-safe: #10b981;
            --accent-sweet: #f472b6;
            --accent-humor: #f59e0b;
            --bg: #0f0b1e;
            --bg-card: rgba(255,255,255,0.04);
            --bg-card-hover: rgba(255,255,255,0.08);
            --text: #e2e0f0;
            --text-muted: #9895b0;
            --border: rgba(255,255,255,0.08);
            --radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 背景装饰 ===== */
        .bg-orbs {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
        }
        .bg-orbs .orb {
            position: absolute; border-radius: 50%; filter: blur(100px); opacity: .18;
        }
        .bg-orbs .orb-1 { width: 600px; height: 600px; background: #7c5cfc; top: -200px; left: -100px; }
        .bg-orbs .orb-2 { width: 500px; height: 500px; background: #f472b6; bottom: -150px; right: -100px; }
        .bg-orbs .orb-3 { width: 350px; height: 350px; background: #10b981; top: 40%; left: 60%; }

        /* ===== 容器 ===== */
        .container {
            position: relative; z-index: 1;
            max-width: 820px; margin: 0 auto; padding: 40px 20px 60px;
        }

        /* ===== Header ===== */
        header { text-align: center; margin-bottom: 48px; }
        header .badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--accent-sweet));
            color: #fff; font-size: 12px; font-weight: 600;
            padding: 4px 14px; border-radius: 20px; margin-bottom: 16px;
            letter-spacing: 1px;
        }
        header h1 {
            font-size: 2rem; font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, var(--primary-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            line-height: 1.3;
        }
        header p {
            margin-top: 12px; color: var(--text-muted); font-size: 15px; line-height: 1.7; max-width: 540px; margin-left: auto; margin-right: auto;
        }

        /* ===== 输入区 ===== */
        .input-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 32px;
            backdrop-filter: blur(12px);
        }
        .input-section label {
            display: flex; align-items: center; gap: 8px;
            font-size: 14px; font-weight: 600; margin-bottom: 14px; color: var(--primary-light);
        }
        .input-section label .icon { font-size: 20px; }
        .input-wrap {
            position: relative;
        }
        .input-wrap textarea {
            width: 100%; min-height: 110px;
            background: rgba(0,0,0,.35);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 16px 18px;
            color: var(--text);
            font-size: 15px; line-height: 1.7;
            resize: vertical;
            transition: border-color .25s;
        }
        .input-wrap textarea::placeholder { color: var(--text-muted); opacity: .55; }
        .input-wrap textarea:focus { outline: none; border-color: var(--primary); }

        .btn-generate {
            margin-top: 18px;
            width: 100%; height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff; font-size: 15px; font-weight: 700;
            border: none; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: transform .15s, box-shadow .25s;
        }
        .btn-generate:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(124,92,252,.35); }
        .btn-generate:active { transform: scale(.98); }
        .btn-generate .arrow { font-size: 18px; transition: transform .2s; }
        .btn-generate:hover .arrow { transform: translateX(3px); }

        /* ===== 情绪分析模块 ===== */
        .emotion-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 32px;
            backdrop-filter: blur(12px);
            display: none;
        }
        .emotion-section.visible { display: block; animation: fadeSlideUp .45s ease; }
        .emotion-section .section-title {
            font-size: 14px; font-weight: 600; color: var(--primary-light); margin-bottom: 18px;
            display: flex; align-items: center; gap: 8px;
        }
        .emotion-bar-group { display: flex; flex-direction: column; gap: 12px; }
        .emotion-bar-item { display: flex; align-items: center; gap: 12px; }
        .emotion-bar-item .emo-label {
            width: 72px; font-size: 13px; font-weight: 500; text-align: right; flex-shrink: 0;
        }
        .emotion-bar-item .bar-track {
            flex: 1; height: 10px; background: rgba(255,255,255,.06); border-radius: 5px; overflow: hidden;
        }
        .emotion-bar-item .bar-fill {
            height: 100%; border-radius: 5px; transition: width .8s cubic-bezier(.22,1,.36,1);
            width: 0;
        }
        .emotion-bar-item .emo-value { width: 42px; font-size: 13px; color: var(--text-muted); font-weight: 600; }
        .emotion-tags { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
        .emotion-tags .tag {
            font-size: 12px; padding: 4px 12px; border-radius: 20px;
            background: rgba(124,92,252,.15); color: var(--primary-light); font-weight: 500;
            border: 1px solid rgba(124,92,252,.2);
        }

        /* ===== 回复卡片 ===== */
        .cards-section { display: none; }
        .cards-section.visible { display: block; animation: fadeSlideUp .5s ease; }
        .cards-section .section-title {
            font-size: 14px; font-weight: 600; color: var(--primary-light); margin-bottom: 18px;
            display: flex; align-items: center; gap: 8px;
        }
        .reply-cards { display: flex; flex-direction: column; gap: 18px; }

        .reply-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 26px;
            backdrop-filter: blur(12px);
            transition: background .25s, transform .2s, box-shadow .25s;
            position: relative;
            overflow: hidden;
        }
        .reply-card::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 4px; height: 100%; border-radius: 4px 0 0 4px;
        }
        .reply-card:hover { background: var(--bg-card-hover); transform: translateY(-2px); }

        .reply-card.safe::before { background: var(--accent-safe); }
        .reply-card.sweet::before { background: var(--accent-sweet); }
        .reply-card.humor::before { background: var(--accent-humor); }

        .card-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
        }
        .card-header .card-label {
            display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700;
        }
        .card-header .card-label .dot {
            width: 10px; height: 10px; border-radius: 50%;
        }
        .reply-card.safe .dot { background: var(--accent-safe); box-shadow: 0 0 10px rgba(16,185,129,.4); }
        .reply-card.sweet .dot { background: var(--accent-sweet); box-shadow: 0 0 10px rgba(244,114,182,.4); }
        .reply-card.humor .dot { background: var(--accent-humor); box-shadow: 0 0 10px rgba(245,158,11,.4); }

        .card-header .card-desc {
            font-size: 11px; color: var(--text-muted); font-weight: 500;
        }

        .reply-text {
            font-size: 15px; line-height: 1.8; color: var(--text); padding-left: 6px;
            min-height: 48px;
        }

        .card-footer {
            margin-top: 16px; display: flex; align-items: center; justify-content: flex-end; gap: 10px;
        }
        .btn-copy {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,.06); border: 1px solid var(--border);
            color: var(--text-muted); font-size: 12px; font-weight: 600;
            padding: 7px 16px; border-radius: 8px; cursor: pointer;
            transition: all .2s;
        }
        .btn-copy:hover { background: rgba(255,255,255,.12); color: #fff; }
        .btn-copy.copied {
            background: rgba(16,185,129,.15); border-color: rgba(16,185,129,.3);
            color: var(--accent-safe);
        }

        /* ===== 底部说明 ===== */
        .footer-note {
            margin-top: 48px; text-align: center; font-size: 12px; color: var(--text-muted); opacity: .5;
        }

        /* ===== 动画 ===== */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .loading-shimmer {
            background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,.06) 50%, transparent 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed; top: 24px; right: 24px; z-index: 999;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            background: rgba(16,185,129,.9); color: #fff;
            padding: 10px 20px; border-radius: 10px;
            font-size: 13px; font-weight: 600;
            box-shadow: 0 8px 24px rgba(0,0,0,.3);
            animation: toastIn .3s ease, toastOut .3s ease 1.7s forwards;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            header h1 { font-size: 1.5rem; }
            .input-section, .emotion-section, .reply-card { padding: 18px 16px; }
        }
    </style>
</head>

// ===== 匹配回复 =====
function matchReply(input) {
    const text = input.trim();
    if (!text) return null;

    // 按关键词匹配
    const keywords = Object.keys(REPLY_DB).filter(k => k !== '默认');
    for (const kw of keywords) {
        if (text.includes(kw)) return REPLY_DB[kw];
    }

    // 模糊匹配
    const fuzzyMap = [
        [['不在乎', '不爱', '不关心', '心里没我'], '不在乎'],
        [['忙吧', '忙你的', '你先忙', '不用管我'], '忙'],
        [['随便', '都行', '无所谓'], '随便'],
        [['不管', '不顾', '不闻不问'], '不管'],
        [['算了', '作罢', '不说了'], '算了'],
        [['哦', '嗯哦', '噢'], '哦'],
        [['生气', '恼火', '火大', '烦死', '气死'], '生气'],
        [['分手', '分开', '结束'], '分手'],
        [['没事', '没什么', '还好'], '没事'],
        [['冷', '冷淡', '冷漠', '冷战'], '冷'],
        [['呵呵', '嘿嘿'], '呵呵'],
        [['行吧', '好吧', '随你'], '行吧'],
    ];
    for (const [patterns, key] of fuzzyMap) {
        if (patterns.some(p => text.includes(p))) return REPLY_DB[key];
    }

    return REPLY_DB['默认'];
}

// ===== 情绪分析 =====
function analyzeEmotion(input) {
    const text = input.trim();
    const dims = { '失落感': 0, '不满度': 0, '敷衍感': 0, '试探性': 0, '冷淡度': 0 };

    const patterns = {
        '失落感': ['不在乎', '不爱', '哭', '难过', '伤心', '委屈', '没事', '算了', '分手'],
        '不满度': ['生气', '恼', '烦', '怒', '又怎么', '呵呵', '行吧', '好吧'],
        '敷衍感': ['随便', '哦', '嗯', '敷衍', '呵呵', '都行', '无所谓'],
        '试探性': ['你是不是', '你忙吧', '不用管', '又怎么', '不管我', '不在乎'],
        '冷淡度': ['冷', '沉默', '算了', '忙', '不管', '哦', '行吧', '好吧'],
    };

    let totalHits = 0;
    for (const [dim, kws] of Object.entries(patterns)) {
        let hits = 0;
        kws.forEach(kw => { if (text.includes(kw)) hits++; });
        dims[dim] = hits;
        totalHits += hits;
    }

    // 归一化到百分比
    const result = {};
    for (const [dim, val] of Object.entries(dims)) {
        result[dim] = totalHits > 0 ? Math.min(100, Math.round((val / totalHits) * 100 + Math.random() * 10)) : Math.round(Math.random() * 15);
    }
    // 保证至少有一个维度突出
    if (totalHits === 0) {
        const keys = Object.keys(result);
        result[keys[Math.floor(Math.random() * keys.length)]] = Math.round(30 + Math.random() * 25);
    }

    // 提取情绪标签
    const tags = [];
    if (text.includes('不在乎') || text.includes('不爱')) tags.push('缺乏安全感');
    if (text.includes('忙') || text.includes('不用管')) tags.push('渴望关注');
    if (text.includes('随便') || text.includes('哦')) tags.push('被动攻击');
    if (text.includes('生气') || text.includes('烦')) tags.push('情绪高涨');
    if (text.includes('又怎么') || text.includes('你是不是')) tags.push('测试型提问');
    if (text.includes('算了') || text.includes('冷战')) tags.push('回避沟通');
    if (text.includes('分手')) tags.push('极端表达');
    if (tags.length === 0) tags.push('需要安抚');

    return { dims: result, tags };
}

// ===== 渲染情绪分析 =====
function renderEmotion(analysis) {
    const section = document.getElementById('emotionSection');
    const barsEl = document.getElementById('emotionBars');
    const tagsEl = document.getElementById('emotionTags');

    barsEl.innerHTML = '';
    tagsEl.innerHTML = '';

    const dimColors = { '失落感': '#6366f1', '不满度': '#ef4444', '敷衍感': '#f59e0b', '试探性': '#ec4899', '冷淡度': '#8b5cf6' };

    for (const [dim, val] of Object.entries(analysis.dims)) {
        const color = dimColors[dim] || '#7c5cfc';
        barsEl.innerHTML += `
            <div class="emotion-bar-item">
                <span class="emo-label">${dim}</span>
                <div class="bar-track">
                    <div class="bar-fill" data-width="${val}" style="background:${color};width:0"></div>
                </div>
                <span class="emo-value">${val}%</span>
            </div>`;
    }

    analysis.tags.forEach(t => {
        tagsEl.innerHTML += `<span class="tag">${t}</span>`;
    });

    section.classList.add('visible');

    // 动画填充 bar
    requestAnimationFrame(() => {
        setTimeout(() => {
            barsEl.querySelectorAll('.bar-fill').forEach(bar => {
                bar.style.width = bar.dataset.width + '%';
            });
        }, 100);
    });
}

// ===== 生成回复 =====
function generateReplies() {
    const input = document.getElementById('msgInput').value.trim();
    if (!input) {
        showToast('请先输入女朋友的消息哦～');
        return;
    }

    const btn = document.getElementById('btnGenerate');
    btn.innerHTML = '正在分析情绪… <span class="arrow">✨</span>';
    btn.disabled = true;

    // 模拟延迟
    setTimeout(() => {
        const reply = matchReply(input);
        const analysis = analyzeEmotion(input);

        // 渲染情绪分析
        renderEmotion(analysis);

        // 渲染回复卡片
        document.getElementById('replySafe').textContent = reply.safe;
        document.getElementById('replySweet').textContent = reply.sweet;
        document.getElementById('replyHumor').textContent = reply.humor;

        document.getElementById('cardsSection').classList.add('visible');

        btn.innerHTML = '重新分析 <span class="arrow">→</span>';
        btn.disabled = false;

        // 滚动到情绪分析区域
        document.getElementById('emotionSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 900);
}

// ===== 复制功能 =====
function copyReply(id, btnEl) {
    const text = document.getElementById(id).textContent;
    navigator.clipboard.writeText(text).then(() => {
        btnEl.classList.add('copied');
        btnEl.innerHTML = '✅ 已复制';
        showToast('复制成功！快去粘贴吧～');
        setTimeout(() => {
            btnEl.classList.remove('copied');
            btnEl.innerHTML = '📋 一键复制';
        }, 2000);
    }).catch(() => {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        btnEl.classList.add('copied');
        btnEl.innerHTML = '✅ 已复制';
        showToast('复制成功！快去粘贴吧～');
        setTimeout(() => {
            btnEl.classList.remove('copied');
            btnEl.innerHTML = '📋 一键复制';
        }, 2000);
    });
}

// ===== Toast =====
function showToast(msg) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 2200);
}

// ===== 回车提交 =====
document.getElementById('msgInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        generateReplies();
    }
});
</script>
