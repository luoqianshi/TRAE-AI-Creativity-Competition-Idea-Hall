<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本链接分离器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .main-content {
            padding: 30px;
        }

        .section {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background: #fafafa;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .textarea-container {
            display: flex;
            gap: 20px;
        }

        .textarea-wrapper {
            flex: 1;
        }

        .textarea-wrapper label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .drag-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            color: #666;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .drag-area.drag-over {
            border-color: #4CAF50;
            background-color: #f0f8f0;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-group {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .control-group h4 {
            margin-bottom: 10px;
            color: #333;
            font-size: 14px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }

        .checkbox-item label {
            font-size: 13px;
            color: #555;
        }

        .text-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #2196F3;
            color: white;
        }

        .btn-secondary:hover {
            background: #1976D2;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #d32f2f;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #FF9800;
            color: white;
        }

        .btn-success:hover {
            background: #F57C00;
            transform: translateY(-2px);
        }

        .export-section {
            background: #e8f5e8;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .export-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.3s;
        }

        @media (max-width: 768px) {
            .textarea-container {
                flex-direction: column;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                flex-direction: column;
            }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            z-index: 10000;
            animation: slideIn 0.3s ease;
        }

        .notification.success {
            background: #4CAF50;
        }

        .notification.error {
            background: #f44336;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 文本链接分离器</h1>
            <p>专业的影视资源链接整理工具</p>
        </div>

        <div class="main-content">
            <!-- 文本输入区域 -->
            <div class="section">
                <div class="section-title">📝 文本输入区域</div>
                <div class="textarea-container">
                    <div class="textarea-wrapper">
                        <label for="inputText">输入文本内容：</label>
                        <div class="drag-area" id="dragArea">
                            拖拽文件到此处或点击选择文件<br>
                            <small>支持 .txt, .xlsx, .xls 格式</small>
                        </div>
                        <textarea id="inputText" placeholder="请输入包含影视名称和网盘链接的文本内容...&#10;&#10;支持格式：&#10;1. 影视名称 + 网盘链接（同行或多行）&#10;2. 直接拖拽文件到上方区域"></textarea>
                    </div>
                    <div class="textarea-wrapper">
                        <label for="outputText">处理结果：</label>
                        <textarea id="outputText" placeholder="处理后的结果将显示在这里..." readonly></textarea>
                    </div>
                </div>
                <input type="file" id="fileInput" accept=".txt,.xlsx,.xls" style="display: none;">
            </div>

            <!-- 控制面板 -->
            <div class="section">
                <div class="section-title">⚙️ 功能控制面板</div>
                <div class="controls">
                    <!-- 网盘过滤选项 -->
                    <div class="control-group">
                        <h4>🚫 网盘链接过滤</h4>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" id="filterBaidu">
                                <label for="filterBaidu">过滤百度链接</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="filterQuark">
                                <label for="filterQuark">过滤夸克链接</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="filterXunlei">
                                <label for="filterXunlei">过滤迅雷链接</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="filterAli">
                                <label for="filterAli">过滤阿里链接</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="filter115">
                                <label for="filter115">过滤115链接</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="filter123">
                                <label for="filter123">过滤123链接</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="filterUC">
                                <label for="filterUC">过滤UC链接</label>
                            </div>
                        </div>
                    </div>

                    <!-- 文本清理选项 -->
                    <div class="control-group">
                        <h4>🧹 文本清理选项</h4>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" id="keepChineseOnly">
                                <label for="keepChineseOnly">只保留中文、数字、英文、括号</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="filterEmoji">
                                <label for="filterEmoji">过滤表情符号</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="filterSymbols">
                                <label for="filterSymbols">过滤网络符号</label>
                            </div>
                        </div>
                    </div>

                    <!-- 输出格式选项 -->
                    <div class="control-group">
                        <h4>📋 输出格式</h4>
                        <div class="radio-group">
                            <div class="radio-item">
                                <input type="radio" id="formatSameLine" name="outputFormat" value="sameLine" checked>
                                <label for="formatSameLine">名称和网盘链接在同一行</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" id="formatOneToOne" name="outputFormat" value="oneToOne">
                                <label for="formatOneToOne">一行网盘链接，对应一行名称</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" id="formatOneToMany" name="outputFormat" value="oneToMany">
                                <label for="formatOneToMany">一行名称，多行网盘链接</label>
                            </div>
                        </div>
                    </div>

                    <!-- 前缀设置 -->
                    <div class="control-group">
                        <h4>🏷️ 前缀设置</h4>
                        <label>名称前缀：</label>
                        <input type="text" id="namePrefix" class="text-input" placeholder="可选，如：【电影】">
                        <label style="margin-top: 8px;">链接前缀：</label>
                        <input type="text" id="linkPrefix" class="text-input" placeholder="可选，如：下载：">
                    </div>

                    <!-- 过滤关键词 -->
                    <div class="control-group">
                        <h4>🔍 关键词过滤</h4>
                        <label>过滤名称中的词语：</label>
                        <input type="text" id="filterNameWords" class="text-input" placeholder="用逗号分隔，如：广告,推广">
                        <label style="margin-top: 8px;">过滤链接中的词语：</label>
                        <input type="text" id="filterLinkWords" class="text-input" placeholder="用逗号分隔">
                    </div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="section">
                <div class="section-title">🎛️ 操作控制</div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="processText()">🔄 解析文本</button>
                    <button class="btn btn-danger" onclick="clearAll()">🗑️ 清除所有内容</button>
                    <button class="btn btn-secondary" onclick="copyInput()">📋 复制输入内容</button>
                    <button class="btn btn-secondary" onclick="copyOutput()">📋 复制结果内容</button>
                </div>
            </div>

            <!-- 导出功能 -->
            <div class="export-section">
                <div class="section-title">📤 导出功能</div>
                <div class="export-controls">
                    <div class="control-group">
                        <h4>Excel 导出设置</h4>
                        <label>名称列前增加列：</label>
                        <input type="text" id="excelPreNameColumn" class="text-input" placeholder="可选">
                        <label style="margin-top: 8px;">链接列前增加列：</label>
                        <input type="text" id="excelPreLinkColumn" class="text-input" placeholder="可选">
                        <label style="margin-top: 8px;">链接列后增加列：</label>
                        <input type="text" id="excelPostLinkColumn" class="text-input" placeholder="可选">
                    </div>
                </div>
                <div class="button-group">
                    <button class="btn btn-success" onclick="exportToExcel()">📊 导出到 Excel</button>
                    <button class="btn btn-success" onclick="exportToWord()">📄 导出到 Word</button>
                    <button class="btn btn-success" onclick="exportToTxt()">📝 导出到 TXT</button>
                </div>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入必要的库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        // 全局变量
        let parsedData = [];

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeDragAndDrop();
            setupFileInput();
        });

        // 初始化拖拽功能
        function initializeDragAndDrop() {
            const dragArea = document.getElementById('dragArea');
            const fileInput = document.getElementById('fileInput');

            dragArea.addEventListener('click', () => fileInput.click());

            dragArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                dragArea.classList.add('drag-over');
            });

            dragArea.addEventListener('dragleave', () => {
                dragArea.classList.remove('drag-over');
            });

            dragArea.addEventListener('drop', (e) => {
                e.preventDefault();
                dragArea.classList.remove('drag-over');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFile(files[0]);
                }
            });
        }

        // 设置文件输入
        function setupFileInput() {
            const fileInput = document.getElementById('fileInput');
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });
        }

        // 生成本地时间文件名前缀
        function getLocalFileNamePrefix() {
            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            return `links_${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
        }

        // 显示进度条
        function showProgress(show) {
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            
            if (show) {
                progressBar.style.display = 'block';
                progressFill.style.width = '0%';
                setTimeout(() => progressFill.style.width = '100%', 100);
            } else {
                setTimeout(() => {
                    progressBar.style.display = 'none';
                    progressFill.style.width = '0%';
                }, 500);
            }
        }

        // 显示通知
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = 'notification ' + type;
            notification.textContent = message;

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // 从行中提取链接
        function extractLinksFromLine(line, linkPatterns) {
            const links = [];
            for (const [platform, pattern] of Object.entries(linkPatterns)) {
                const matches = line.match(pattern);
                if (matches) {
                    matches.forEach(match => {
                        if (!match.startsWith('http')) {
                            match = 'https://' + match;
                        }
                        links.push({ platform, url: match });
                    });
                }
            }
            return links;
        }

        // 从包含链接的行中提取名称
        function extractNameFromLine(line, links) {
            let cleanLine = line;
            // 移除所有链接
            links.forEach(link => {
                cleanLine = cleanLine.replace(link.url, '').replace(link.url.replace('https://', ''), '');
            });
            
            // 清理并返回名称
            const name = cleanName(cleanLine);
            return name.length > 0 ? name : null;
        }

        // 清理名称
        function cleanName(name) {
            if (!name) return '';
            
            // 移除常见的分隔符和无用字符
            let cleaned = name.replace(/[｜|：:\-\—\–\s]+/g, ' ').trim();
            
            // 只保留中文、英文、数字、括号和基本标点
            cleaned = cleaned.replace(/[^\u4e00-\u9fa5a-zA-Z0-9()\[\]（）【】\s]/g, '');
            
            return cleaned.trim();
        }

        // 应用各种过滤器
        function applyFilters(data) {
            return data.map(item => {
                let filteredLinks = [...item.links];
                let filteredName = item.name;

                // 应用网盘过滤
                if (document.getElementById('filterBaidu').checked) {
                    filteredLinks = filteredLinks.filter(link => link.platform !== 'baidu');
                }
                if (document.getElementById('filterQuark').checked) {
                    filteredLinks = filteredLinks.filter(link => link.platform !== 'quark');
                }
                if (document.getElementById('filterXunlei').checked) {
                    filteredLinks = filteredLinks.filter(link => link.platform !== 'xunlei');
                }
                if (document.getElementById('filterAli').checked) {
                    filteredLinks = filteredLinks.filter(link => link.platform !== 'ali');
                }
                if (document.getElementById('filter115').checked) {
                    filteredLinks = filteredLinks.filter(link => link.platform !== '115');
                }
                if (document.getElementById('filter123').checked) {
                    filteredLinks = filteredLinks.filter(link => link.platform !== '123');
                }
                if (document.getElementById('filterUC').checked) {
                    filteredLinks = filteredLinks.filter(link => link.platform !== 'uc');
                }

                // 应用文本清理
                if (document.getElementById('keepChineseOnly').checked) {
                    filteredName = filteredName.replace(/[^\u4e00-\u9fa5a-zA-Z0-9()\[\]（）【】\s]/g, '');
                }
                if (document.getElementById('filterEmoji').checked) {
                    filteredName = filteredName.replace(/[\u{1F600}-\u{1F64F}]|[\u{1F300}-\u{1F5FF}]|[\u{1F680}-\u{1F6FF}]|[\u{1F1E0}-\u{1F1FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]/gu, '');
                }
                if (document.getElementById('filterSymbols').checked) {
                    filteredName = filteredName.replace(/[^\u4e00-\u9fa5a-zA-Z0-9\s]/g, '');
                }

                // 应用关键词过滤
                const filterNameWords = document.getElementById('filterNameWords').value;
                if (filterNameWords) {
                    const words = filterNameWords.split(',').map(w => w.trim());
                    words.forEach(word => {
                        if (word) {
                            filteredName = filteredName.replace(new RegExp(word, 'gi'), '');
                        }
                    });
                }

                const filterLinkWords = document.getElementById('filterLinkWords').value;
                if (filterLinkWords) {
                    const words = filterLinkWords.split(',').map(w => w.trim());
                    filteredLinks = filteredLinks.filter(link => {
                        return !words.some(word => word && link.url.includes(word));
                    });
                }

                // 添加前缀
                const namePrefix = document.getElementById('namePrefix').value;
                const linkPrefix = document.getElementById('linkPrefix').value;

                if (namePrefix) {
                    filteredName = namePrefix + filteredName;
                }

                if (linkPrefix) {
                    filteredLinks = filteredLinks.map(link => ({
                        ...link,
                        url: linkPrefix + link.url
                    }));
                }

                return {
                    name: filteredName.trim(),
                    links: filteredLinks
                };
            }).filter(item => item.name && item.links.length > 0);
        }

        // 格式化输出
        function formatOutput(data) {
            const format = document.querySelector('input[name="outputFormat"]:checked').value;
            let output = '';

            data.forEach(item => {
                switch (format) {
                    case 'sameLine':
                        item.links.forEach(link => {
                            output += `${item.name} ${link.url}\n`;
                        });
                        break;
                    case 'oneToOne':
                        item.links.forEach(link => {
                            output += `${item.name}\n${link.url}\n`;
                        });
                        break;
                    case 'oneToMany':
                        output += `${item.name}\n`;
                        item.links.forEach(link => {
                            output += `${link.url}\n`;
                        });
                        output += '\n';
                        break;
                }
            });

            return output.trim();
        }

        // 清除所有内容
        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            parsedData = [];
            showNotification('所有内容已清除！', 'success');
        }

        // 复制输入内容
        function copyInput() {
            const inputText = document.getElementById('inputText').value;
            if (!inputText) {
                showNotification('输入框为空！', 'error');
                return;
            }
            
            navigator.clipboard.writeText(inputText).then(() => {
                showNotification('输入内容已复制到剪贴板！', 'success');
            }).catch(() => {
                showNotification('复制失败！', 'error');
            });
        }

        // 复制输出内容
        function copyOutput() {
            const outputText = document.getElementById('outputText').value;
            if (!outputText) {
                showNotification('结果框为空！', 'error');
                return;
            }
            
            navigator.clipboard.writeText(outputText).then(() => {
                showNotification('结果内容已复制到剪贴板！', 'success');
            }).catch(() => {
                showNotification('复制失败！', 'error');
            });
        }

        // 导出到Excel
        function exportToExcel() {
            if (parsedData.length === 0) {
                showNotification('请先解析文本！', 'error');
                return;
            }

            showProgress(true);

            try {
                const workbook = XLSX.utils.book_new();
                const worksheetData = [];

                // 添加表头
                const headers = [];
                const preNameColumn = document.getElementById('excelPreNameColumn').value;
                const preLinkColumn = document.getElementById('excelPreLinkColumn').value;
                const postLinkColumn = document.getElementById('excelPostLinkColumn').value;

                if (preNameColumn) headers.push(preNameColumn);
                headers.push('name');
                if (preLinkColumn) headers.push(preLinkColumn);
                headers.push('url');
                if (postLinkColumn) headers.push(postLinkColumn);

                worksheetData.push(headers);

                // 添加数据
                parsedData.forEach(item => {
                    item.links.forEach(link => {
                        const row = [];
                        if (preNameColumn) row.push('');
                        row.push(item.name);
                        if (preLinkColumn) row.push('');
                        row.push(link.url);
                        if (postLinkColumn) row.push('');
                        worksheetData.push(row);
                    });
                });

                const worksheet = XLSX.utils.aoa_to_sheet(worksheetData);
                XLSX.utils.book_append_sheet(workbook, worksheet, 'Links');

                // 导出文件
                const fileName = `${getLocalFileNamePrefix()}.xlsx`;
                XLSX.writeFile(workbook, fileName);

                showProgress(false);
                showNotification('Excel文件导出成功！', 'success');
            } catch (error) {
                showProgress(false);
                showNotification('Excel导出失败！', 'error');
                console.error('Excel导出错误:', error);
            }
        }

        // 导出到Word
        function exportToWord() {
            if (parsedData.length === 0) {
                showNotification('请先解析文本！', 'error');
                return;
            }

            showProgress(true);

            try {
                let content = '';
                const format = document.querySelector('input[name="outputFormat"]:checked').value;

                parsedData.forEach(item => {
                    switch (format) {
                        case 'sameLine':
                            item.links.forEach(link => {
                                content += `${item.name} ${link.url}\n`;
                            });
                            break;
                        case 'oneToOne':
                            item.links.forEach(link => {
                                content += `${item.name}\n${link.url}\n\n`;
                            });
                            break;
                        case 'oneToMany':
                            content += `${item.name}\n`;
                            item.links.forEach(link => {
                                content += `${link.url}\n`;
                            });
                            content += '\n';
                            break;
                    }
                });

                // 创建Word文档内容
                const docContent = `
                    <html>
                        <head>
                            <meta charset="utf-8">
                            <title>链接整理结果</title>
                        </head>
                        <body>
                            <h1>链接整理结果</h1>
                            <pre>${content}</pre>
                        </body>
                    </html>
                `;

                const blob = new Blob([docContent], { type: 'application/msword' });
                const fileName = `${getLocalFileNamePrefix()}.doc`;
                
                if (window.saveAs) {
                    saveAs(blob, fileName);
                } else {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }

                showProgress(false);
                showNotification('Word文件导出成功！', 'success');
            } catch (error) {
                showProgress(false);
                showNotification('Word导出失败！', 'error');
                console.error('Word导出错误:', error);
            }
        }

        // 导出到TXT
        function exportToTxt() {
            const outputText = document.getElementById('outputText').value;
            if (!outputText) {
                showNotification('请先解析文本！', 'error');
                return;
            }

            showProgress(true);

            try {
                const blob = new Blob([outputText], { type: 'text/plain;charset=utf-8' });
                const fileName = `${getLocalFileNamePrefix()}.txt`;
                
                if (window.saveAs) {
                    saveAs(blob, fileName);
                } else {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }

                showProgress(false);
                showNotification('TXT文件导出成功！', 'success');
            } catch (error) {
                showProgress(false);
                showNotification('TXT导出失败！', 'error');
                console.error('TXT导出错误:', error);
            }
        }

        // 自动识别影视年份（简单实现）
        function extractYear(name) {
            const yearMatch = name.match(/\b(19|20)\d{2}\b/);
            return yearMatch ? yearMatch[0] : '';
        }

        // 规范化影视名称
        function normalizeMovieName(name) {
            // 移除常见的标识符
            let normalized = name.replace(/\b(HD|4K|1080P|720P|蓝光|高清|中文|字幕|国语|粤语|英语)\b/gi, '');
            
            // 移除多余空格
            normalized = normalized.replace(/\s+/g, ' ').trim();
            
            // 尝试提取年份
            const year = extractYear(normalized);
            if (year && !normalized.includes('(' + year + ')')) {
                normalized = normalized.replace(year, '').trim() + ' (' + year + ')';
            }
            
            return normalized;
        }

        // 检测链接去重（基于URL主体部分）
        function deduplicateLinks(links) {
            const seen = new Set();
            return links.filter(link => {
                const urlKey = link.url.split('?')[0]; // 移除查询参数
                if (seen.has(urlKey)) {
                    return false;
                }
                seen.add(urlKey);
                return true;
            });
        }

        // 解析文本内容
        function parseTextContent(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line);
            const data = [];
            
            // 网盘链接的正则表达式（更全面）
            const linkPatterns = {
                baidu: /(?:https?:\/\/)?(?:pan\.baidu\.com|yun\.baidu\.com|bdpan\.com)\/[^\s]+/gi,
                quark: /(?:https?:\/\/)?(?:pan\.quark\.cn|drive\.quark\.cn|quark\.cn)\/[^\s]+/gi,
                xunlei: /(?:https?:\/\/)?(?:pan\.xunlei\.com|drive\.xunlei\.com)\/[^\s]+/gi,
                ali: /(?:https?:\/\/)?(?:www\.aliyundrive\.com|www\.alipan\.com|aliyundrive\.com|alipan\.com)\/[^\s]+/gi,
                '115': /(?:https?:\/\/)?115\.com\/[^\s]+/gi,
                '123': /(?:https?:\/\/)?(?:www\.123pan\.com|123pan\.com)\/[^\s]+/gi,
                uc: /(?:https?:\/\/)?(?:drive\.uc\.cn|pan\.uc\.cn)\/[^\s]+/gi,
                onedrive: /(?:https?:\/\/)?(?:1drv\.ms|onedrive\.live\.com)\/[^\s]+/gi,
                googledrive: /(?:https?:\/\/)?drive\.google\.com\/[^\s]+/gi
            };

            let currentName = '';
            let currentLinks = [];
            let processingMode = 'auto'; // auto, name_first, link_first

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const links = extractLinksFromLine(line, linkPatterns);
                
                // 智能判断行类型
                if (links.length > 0) {
                    // 包含链接的行
                    const nameFromLine = extractNameFromLine(line, links);
                    
                    if (nameFromLine && nameFromLine.length > 2) {
                        // 同行包含名称和链接
                        if (currentName && currentLinks.length > 0) {
                            data.push({
                                name: normalizeMovieName(currentName),
                                links: deduplicateLinks(currentLinks)
                            });
                        }
                        currentName = nameFromLine;
                        currentLinks = links;
                    } else {
                        // 只有链接
                        if (currentName) {
                            currentLinks = currentLinks.concat(links);
                        } else {
                            // 查找前面的名称
                            for (let j = i - 1; j >= 0 && j >= i - 3; j--) {
                                const prevLine = lines[j];
                                if (!extractLinksFromLine(prevLine, linkPatterns).length) {
                                    const potentialName = cleanName(prevLine);
                                    if (potentialName && potentialName.length > 1) {
                                        currentName = potentialName;
                                        currentLinks = links;
                                        break;
                                    }
                                }
                            }
                        }
                    }
                } else {
                    // 不包含链接的行，可能是名称
                    const cleanedLine = cleanName(line);
                    if (cleanedLine && cleanedLine.length > 1) {
                        if (currentName && currentLinks.length > 0) {
                            data.push({
                                name: normalizeMovieName(currentName),
                                links: deduplicateLinks(currentLinks)
                            });
                            currentLinks = [];
                        }
                        currentName = cleanedLine;
                    }
                }
            }

            // 保存最后一组数据
            if (currentName && currentLinks.length > 0) {
                data.push({
                    name: normalizeMovieName(currentName),
                    links: deduplicateLinks(currentLinks)
                });
            }

            return data.filter(item => item.name && item.links.length > 0);
        }

        // 主要的文本处理函数
        function processText() {
            const inputText = document.getElementById('inputText').value.trim();
            if (!inputText) {
                showNotification('请先输入文本内容！', 'error');
                return;
            }

            showProgress(true);

            try {
                // 解析文本
                const rawData = parseTextContent(inputText);
                
                // 应用各种过滤器
                const filteredData = applyFilters(rawData);
                
                // 格式化输出
                const formattedOutput = formatOutput(filteredData);
                
                // 更新结果
                document.getElementById('outputText').value = formattedOutput;
                parsedData = filteredData;

                showProgress(false);
                showNotification(`文本处理完成！共处理 ${filteredData.length} 个项目`, 'success');
            } catch (error) {
                showProgress(false);
                showNotification('处理过程中出现错误！', 'error');
                console.error('处理错误:', error);
            }
        }

        // 处理文件
        function handleFile(file) {
            showProgress(true);
            const fileName = file.name.toLowerCase();

            if (fileName.endsWith('.txt')) {
                // 对于txt文件，尝试多种编码
                const reader = new FileReader();
                reader.onload = function(e) {
                    let content = e.target.result;
                    
                    // 简单的编码检测和转换
                    if (content.includes('�')) {
                        // 可能是编码问题，尝试重新读取
                        const reader2 = new FileReader();
                        reader2.onload = function(e2) {
                            document.getElementById('inputText').value = e2.target.result;
                            showProgress(false);
                            showNotification('文件读取成功！', 'success');
                        };
                        reader2.readAsText(file, 'GBK');
                    } else {
                        document.getElementById('inputText').value = content;
                        showProgress(false);
                        showNotification('文件读取成功！', 'success');
                    }
                };
                reader.readAsText(file, 'UTF-8');
            } else if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const workbook = XLSX.read(e.target.result, { type: 'binary' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const content = XLSX.utils.sheet_to_csv(firstSheet);
                        document.getElementById('inputText').value = content;
                        showProgress(false);
                        showNotification('Excel文件读取成功！', 'success');
                    } catch (error) {
                        showProgress(false);
                        showNotification('Excel文件读取失败！', 'error');
                    }
                };
                reader.readAsBinaryString(file);
            } else {
                showProgress(false);
                showNotification('不支持的文件格式！', 'error');
            }
        }

        // 添加键盘快捷键支持
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case 'Enter':
                        e.preventDefault();
                        processText();
                        break;
                    case 'l':
                        e.preventDefault();
                        clearAll();
                        break;
                    case 'c':
                        if (e.shiftKey) {
                            e.preventDefault();
                            copyOutput();
                        }
                        break;
                }
            }
        });

        // 初始化提示信息
        showNotification('文本链接分离器已准备就绪！', 'success');

    </script>
