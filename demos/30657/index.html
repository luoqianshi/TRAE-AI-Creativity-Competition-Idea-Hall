<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安全通行 Safe Crossing — 交通安全教育游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1923;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;color:#fff}
#gameContainer{position:relative;width:900px;height:650px;border-radius:12px;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.5)}
canvas{display:block;background:#2d5a27}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,25,35,.92);transition:opacity .4s;z-index:10}
.screen.hidden{opacity:0;pointer-events:none}
.screen h1{font-size:42px;margin-bottom:8px;background:linear-gradient(135deg,#4ecdc4,#44bd88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.screen h2{font-size:22px;color:#8899aa;margin-bottom:30px;font-weight:400}
.screen .subtitle{font-size:15px;color:#667;margin-bottom:30px;max-width:500px;text-align:center;line-height:1.7}
.btn{padding:14px 40px;font-size:17px;border:none;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s;margin:6px}
.btn-primary{background:linear-gradient(135deg,#4ecdc4,#44bd88);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(78,205,196,.4)}
.btn-secondary{background:rgba(255,255,255,.1);color:#aac;border:1px solid rgba(255,255,255,.15)}
.btn-secondary:hover{background:rgba(255,255,255,.18)}
.btn-small{padding:10px 24px;font-size:14px}
.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0;max-width:600px}
.level-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:20px;cursor:pointer;transition:all .25s;text-align:center}
.level-card:hover{background:rgba(78,205,196,.15);border-color:#4ecdc4;transform:translateY(-3px)}
.level-card .lv-num{font-size:28px;font-weight:700;color:#4ecdc4}
.level-card .lv-name{font-size:16px;margin:8px 0 4px;color:#dde}
.level-card .lv-desc{font-size:12px;color:#789;line-height:1.5}
.level-card .lv-score{font-size:12px;color:#4ecdc4;margin-top:8px}
.hud{position:absolute;top:0;left:0;width:100%;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);z-index:5;pointer-events:none}
.hud-left,.hud-right{display:flex;align-items:center;gap:16px}
.hud-item{font-size:14px;color:#cde}
.hud-item span{color:#4ecdc4;font-weight:700}
.feedback-bar{position:absolute;bottom:0;left:0;width:100%;padding:16px 20px;text-align:center;z-index:5;transition:all .3s}
.feedback-bar.info{background:linear-gradient(0deg,rgba(30,60,90,.9),transparent)}
.feedback-bar.success{background:linear-gradient(0deg,rgba(30,90,60,.9),transparent)}
.feedback-bar.fail{background:linear-gradient(0deg,rgba(120,30,30,.9),transparent)}
.feedback-bar .fb-title{font-size:20px;font-weight:700;margin-bottom:4px}
.feedback-bar .fb-desc{font-size:13px;color:#abc;line-height:1.6}
.feedback-bar.success .fb-title{color:#4ecdc4}
.feedback-bar.fail .fb-title{color:#ff6b6b}
.hint{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);font-size:15px;color:rgba(255,255,255,.6);z-index:5;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.result-stars{font-size:48px;margin:16px 0}
.result-detail{font-size:14px;color:#899;line-height:1.8;text-align:center;margin:10px 0 20px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:rgba(78,205,196,.2);color:#4ecdc4}
.badge-red{background:rgba(255,107,107,.2);color:#ff6b6b}
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="canvas" width="900" height="650"></canvas>

<!-- 标题界面 -->
<div id="titleScreen" class="screen">
<h1>🚗 安全通行</h1>
<h2>Safe Crossing — 交通安全教育游戏</h2>
<p class="subtitle">通过模拟真实路口场景，学习车辆会车与拐弯时的让行规则。<br>在互动中掌握交通安全知识，做文明出行的守护者。</p>
<button class="btn btn-primary" onclick="showScreen('levelSelect')">开始游戏</button>
</div>

<!-- 关卡选择 -->
<div id="levelSelect" class="screen hidden">
<h1 style="font-size:28px">选择关卡</h1>
<h2>掌握每一种让行规则</h2>
<div class="level-grid">
<div class="level-card" onclick="startLevel(0)">
<div class="lv-num">01</div>
<div class="lv-name">无保护左转</div>
<div class="lv-desc">左转车辆须让行对向直行车辆，找准安全时机通过</div>
<div class="lv-score" id="score0">尚未挑战</div>
</div>
<div class="level-card" onclick="startLevel(1)">
<div class="lv-num">02</div>
<div class="lv-name">右转让行人</div>
<div class="lv-desc">右转时遇到行人过街，必须停车让行</div>
<div class="lv-score" id="score1">尚未挑战</div>
</div>
<div class="level-card" onclick="startLevel(2)">
<div class="lv-num">03</div>
<div class="lv-name">窄路会车</div>
<div class="lv-desc">狭窄路段会车，靠山体一侧让行不靠山体一侧</div>
<div class="lv-score" id="score2">尚未挑战</div>
</div>
</div>
<button class="btn btn-secondary btn-small" onclick="showScreen('titleScreen')">← 返回</button>
</div>

<!-- HUD -->
<div id="hud" class="hud" style="display:none">
<div class="hud-left">
<div class="hud-item">关卡：<span id="hudLevel">1</span></div>
<div class="hud-item" id="hudMission"></div>
</div>
<div class="hud-right">
<div class="hud-item">得分：<span id="hudScore">0</span></div>
</div>
</div>

<!-- 底部提示 -->
<div id="hintBar" class="hint" style="display:none">按 空格键 启动车辆</div>

<!-- 反馈栏 -->
<div id="feedbackBar" class="feedback-bar info" style="display:none">
<div class="fb-title" id="fbTitle"></div>
<div class="fb-desc" id="fbDesc"></div>
</div>

<!-- 结果界面 -->
<div id="resultScreen" class="screen hidden">
<h1 id="resultTitle">挑战结果</h1>
<div class="result-stars" id="resultStars"></div>
<div class="result-detail" id="resultDetail"></div>
<div>
<button class="btn btn-primary btn-small" onclick="retryLevel()">重新挑战</button>
<button class="btn btn-secondary btn-small" onclick="showScreen('levelSelect');hideGameUI()">返回选关</button>
</div>
</div>
</div>

<script>
// ======================== 配置 ========================
const W = 900, H = 650;
const ROAD_COLOR = '#3a3a4a';
const ROAD_LINE = '#f0c040';
const ROAD_EDGE = '#eee';
const SIDEWALK = '#888';
const GRASS = '#2d5a27';
const PLAYER_COLOR = '#4ecdc4';
const NPC_COLORS = ['#e74c3c','#f39c12','#9b59b6','#3498db','#e67e22','#1abc9c'];
const PEDESTRIAN_COLOR = '#ffeaa7';

const LEVELS = [
  {
    id: 0, name: '无保护左转', badge: '左转',
    mission: '你是蓝色车辆，需要<b>左转</b>通过路口',
    rule: '《道路交通安全法实施条例》第五十一条：在没有方向指示信号灯的交叉路口，转弯的机动车让直行的车辆、行人先行。',
    ruleShort: '转弯让直行',
    rounds: 3
  },
  {
    id: 1, name: '右转让行人', badge: '右转',
    mission: '你是蓝色车辆，需要<b>右转</b>通过路口',
    rule: '《道路交通安全法实施条例》第四十七条：机动车行经人行横道时，应当减速行驶；遇行人正在通过人行横道，应当停车让行。',
    ruleShort: '右转让行人',
    rounds: 3
  },
  {
    id: 2, name: '窄路会车', badge: '会车',
    mission: '你是蓝色车辆，需要通过<b>狭窄路段</b>',
    rule: '《道路交通安全法实施条例》第四十八条：在没有中心隔离设施或者没有中心线的道路上，机动车遇相对方向来车时，在有障碍的路段，无障碍的一方先行。',
    ruleShort: '有障碍方让行',
    rounds: 3
  }
];

// ======================== 状态 ========================
let canvas, ctx;
let gameState = 'title';
let currentLevel = 0;
let currentRound = 0;
let score = 0;
let roundScores = [];
let levelBestScores = [0, 0, 0];
let time = 0;
let lastTs = 0;
let vehicles = [];
let pedestrians = [];
let player = null;
let playerAction = 'idle'; // idle, moving, done
let playerPath = [];
let playerPathIdx = 0;
let playerSpeed = 0;
let feedbackTimeout = null;
let shakeTimer = 0;
let shakeIntensity = 0;
let flashTimer = 0;
let particles = [];
let waitingInput = false;
let inputDelay = 0;
let roundResults = [];
let obstacleZone = null;

// ======================== 初始化 ========================
window.onload = function() {
  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');
  showScreen('titleScreen');
  requestAnimationFrame(gameLoop);
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('touchstart', function(e) {
    if (waitingInput) { e.preventDefault(); handleAction(); }
  });
};

function gameLoop(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  time += dt;
  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}

// ======================== 画面管理 ========================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  const el = document.getElementById(id);
  if (el) el.classList.remove('hidden');
  if (id === 'levelSelect') updateLevelCards();
}

function showGameUI() {
  document.getElementById('hud').style.display = 'flex';
}

function hideGameUI() {
  document.getElementById('hud').style.display = 'none';
  document.getElementById('hintBar').style.display = 'none';
  document.getElementById('feedbackBar').style.display = 'none';
}

function updateLevelCards() {
  for (let i = 0; i < 3; i++) {
    const el = document.getElementById('score' + i);
    if (levelBestScores[i] > 0) {
      el.textContent = '最高分：' + levelBestScores[i];
    }
  }
}

function showFeedback(type, title, desc) {
  const bar = document.getElementById('feedbackBar');
  bar.className = 'feedback-bar ' + type;
  bar.style.display = 'block';
  document.getElementById('fbTitle').textContent = title;
  document.getElementById('fbDesc').innerHTML = desc;
}

function hideFeedback() {
  document.getElementById('feedbackBar').style.display = 'none';
}

// ======================== 关卡系统 ========================
function startLevel(idx) {
  currentLevel = idx;
  currentRound = 0;
  score = 0;
  roundResults = [];
  gameState = 'playing';
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  showGameUI();
  document.getElementById('hudLevel').textContent = LEVELS[idx].name;
  document.getElementById('hudMission').innerHTML = LEVELS[idx].mission;
  updateScore();
  startRound();
}

function retryLevel() {
  gameState = 'playing';
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  startLevel(currentLevel);
}

function startRound() {
  currentRound++;
  vehicles = [];
  pedestrians = [];
  particles = [];
  playerAction = 'idle';
  playerPath = [];
  playerPathIdx = 0;
  playerSpeed = 0;
  waitingInput = false;
  inputDelay = 0;
  obstacleZone = null;
  hideFeedback();
  document.getElementById('hintBar').style.display = 'none';

  const lv = LEVELS[currentLevel];
  if (currentRound > lv.rounds) {
    endLevel();
    return;
  }

  // 初始化关卡场景
  switch (currentLevel) {
    case 0: initLevel1(); break;
    case 1: initLevel2(); break;
    case 2: initLevel3(); break;
  }

  // 延迟后显示提示
  setTimeout(() => {
    if (gameState !== 'playing') return;
    document.getElementById('hintBar').style.display = 'block';
    document.getElementById('hintBar').textContent = '按 空格键 启动车辆';
    showFeedback('info', '观察路况', '等待安全时机后按空格键通过');
    waitingInput = true;
  }, 1200);
}

function endLevel() {
  gameState = 'result';
  hideGameUI();
  const lv = LEVELS[currentLevel];
  const maxScore = lv.rounds * 100;
  const pct = score / maxScore;
  let stars = pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : pct > 0 ? 1 : 0;
  levelBestScores[currentLevel] = Math.max(levelBestScores[currentLevel], score);

  document.getElementById('resultTitle').textContent =
    stars >= 3 ? '🎉 完美通关！' : stars >= 2 ? '👍 表现不错！' : stars >= 1 ? '💪 继续努力！' : '❌ 挑战失败';
  document.getElementById('resultStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  document.getElementById('resultDetail').innerHTML =
    `关卡：${lv.name}<br>得分：${score} / ${maxScore}<br>正确率：${Math.round(pct * 100)}%<br><br><span style="color:#4ecdc4">📖 ${lv.rule}</span>`;
  showScreen('resultScreen');
}

function updateScore() {
  document.getElementById('hudScore').textContent = score;
}

// ======================== 关卡1：无保护左转 ========================
function initLevel1() {
  const cx = W / 2, cy = H / 2;
  const rw = 160; // road width
  const lw = rw / 2; // lane width

  // 玩家车辆 - 从下方出发，在南北路中线右侧车道（北向车道），路口停止线前
  player = {
    x: cx + 20, y: cy + rw / 2 + 30,
    w: 36, h: 56, color: PLAYER_COLOR, angle: 0,
    label: '你'
  };

  // 左转路径 - 从中线右侧北上，到路口中心后左转驶入西向车道（y≈305）
  playerPath = [
    { x: player.x, y: player.y, a: 0 },              // 起点（停止线前，中线右侧）
    { x: player.x, y: cy + 30, a: 0 },                // 进入路口
    { x: player.x, y: cy, a: 0 },                     // 到达路口中心
    { x: cx - 15, y: cy - 15, a: -0.5 },               // 开始左转弯
    { x: cx - 50, y: cy - 35, a: -1.0 },               // 转弯中
    { x: cx - lw - 20, y: cy - lw/2 + 20, a: -Math.PI/2 }, // 完成转弯（进入西向车道 y≈305）
    { x: cx - lw - 120, y: cy - lw/2 + 20, a: -Math.PI/2 }, // 驶出
    { x: cx - lw - 260, y: cy - lw/2 + 20, a: -Math.PI/2 }  // 终点
  ];

  // 对向来车（由北向南，在中线左侧的南向车道 x≈410）
  const round = currentRound;
  // 第1轮 2辆，第2轮 3辆，第3轮 3辆，给玩家留足安全窗口
  const npcCount = Math.min(1 + round, 3);
  for (let i = 0; i < npcCount; i++) {
    vehicles.push({
      x: 408, y: -100 - i * 400,
      w: 36, h: 56, speed: 110 + round * 15,
      dir: 'down', color: NPC_COLORS[i % NPC_COLORS.length],
      active: true
    });
  }

  // 横向车辆（西向车道 y=285，向左行驶，与玩家同向不冲突）
  vehicles.push({
    x: W + 200, y: 285,
    w: 36, h: 56, speed: 100,
    dir: 'left', color: NPC_COLORS[3],
    active: true
  });
}

// ======================== 关卡2：右转让行人 ========================
function initLevel2() {
  const cx = W / 2, cy = H / 2;
  const rw = 160;
  const lw = rw / 2;

  // 玩家 - 从北方出发，在南向车道（x≈410，中线左侧），车头朝下（南）
  player = {
    x: 410, y: 100,
    w: 36, h: 56, color: PLAYER_COLOR, angle: Math.PI,
    label: '你'
  };

  // 右转路径：南向驶入路口 → 右拐 → 西向驶出（进入西向车道 y≈285）
  // 角度递增：PI(南) → 3.54 → 3.93 → 4.32 → 3PI/2(西)，顺时针转 90°
  playerPath = [
    { x: 410, y: 100, a: Math.PI },             // 起点（车头朝南）
    { x: 410, y: cy - 60, a: Math.PI },          // 接近路口
    { x: 410, y: cy - 20, a: Math.PI },           // 到达路口
    { x: 420, y: cy + 5, a: 3.54 },              // 开始右转弯
    { x: 430, y: cy + 15, a: 3.93 },             // 转弯中
    { x: 438, y: cy + 25, a: 4.32 },             // 继续转弯
    { x: cx - lw / 2, y: cy - lw / 2 + 20, a: 3 * Math.PI / 2 }, // 完成转弯（车头朝西）
    { x: cx - lw - 60, y: cy - lw / 2 + 20, a: 3 * Math.PI / 2 }, // 驶出
    { x: cx - lw - 200, y: cy - lw / 2 + 20, a: 3 * Math.PI / 2 } // 终点
  ];

  // 行人 - 在西方人行横道，由上向下走（穿过右转车辆的路径）
  const round = currentRound;
  const pedCount = 2 + round;
  for (let i = 0; i < pedCount; i++) {
    const startY = cy - rw / 2 - 20 - i * 50;
    pedestrians.push({
      x: cx - rw / 2 - 8, y: startY,
      targetY: cy + rw / 2 + 60,
      speed: 35 + Math.random() * 15 + round * 5,
      r: 10, color: PEDESTRIAN_COLOR,
      active: true, dir: 'down'
    });
  }

  // 对向车辆（由南向北，在北向车道 x≈490，从下方驶来）
  for (let i = 0; i < 2; i++) {
    vehicles.push({
      x: 490, y: H + 120 + i * 450,
      w: 36, h: 56, speed: 100 + round * 10,
      dir: 'up', color: NPC_COLORS[i],
      active: true
    });
  }
}

// ======================== 关卡3：窄路会车 ========================
function initLevel3() {
  const cy = H / 2;
  const roadW = 100;
  const narrowW = 50;

  // 障碍区域（施工/障碍物）
  obstacleZone = {
    x: W / 2 - 30, y: cy - roadW / 2,
    w: 60, h: roadW / 2 + narrowW / 2,
    label: '施工'
  };

  // 玩家 - 从左侧出发向右（车头朝右/东）
  player = {
    x: 60, y: cy + 10,
    w: 36, h: 56, color: PLAYER_COLOR, angle: Math.PI / 2,
    label: '你'
  };

  // 路径（沿下方车道行驶，绕过障碍区）
  const narrowY = cy + narrowW / 2 - 5;
  playerPath = [
    { x: 60, y: cy + 10, a: Math.PI/2 },                  // 起点
    { x: W/2 - 80, y: cy + 10, a: Math.PI/2 },            // 接近障碍
    { x: W/2 - 40, y: narrowY, a: Math.PI/2 },            // 变道到窄道
    { x: W/2, y: narrowY, a: Math.PI/2 },                  // 通过障碍区
    { x: W/2 + 40, y: narrowY, a: Math.PI/2 },            // 离开障碍区
    { x: W/2 + 80, y: cy + 10, a: Math.PI/2 },            // 回到正常车道
    { x: W - 60, y: cy + 10, a: Math.PI/2 }               // 终点
  ];

  // 对向车辆（间距充足，确保有安全窗口）
  const round = currentRound;
  const oncomingCount = Math.min(round, 2);
  for (let i = 0; i < oncomingCount; i++) {
    vehicles.push({
      x: W + 100 + i * 500, y: cy - roadW / 2 + 20,
      w: 36, h: 56, speed: 80 + round * 10,
      dir: 'left', color: NPC_COLORS[i + 1],
      active: true, isOncoming: true
    });
  }
}

// ======================== 输入处理 ========================
function onKeyDown(e) {
  if (e.code === 'Space') {
    e.preventDefault();
    if (waitingInput) handleAction();
  }
}

function handleAction() {
  if (!waitingInput || playerAction !== 'idle') return;
  waitingInput = false;
  playerAction = 'moving';
  document.getElementById('hintBar').style.display = 'none';
  playerSpeed = 200;
}

// ======================== 更新逻辑 ========================
function update(dt) {
  if (gameState !== 'playing') return;
  if (!player) return;

  // 更新NPC车辆
  vehicles.forEach(v => {
    if (!v.active) return;
    switch (v.dir) {
      case 'down': v.y += v.speed * dt; if (v.y > H + 100) { v.y = -100 - Math.random() * 200; } break;
      case 'up': v.y -= v.speed * dt; if (v.y < -100) { v.y = H + 100 + Math.random() * 200; } break;
      case 'right': v.x += v.speed * dt; if (v.x > W + 100) { v.x = -100 - Math.random() * 200; } break;
      case 'left': v.x -= v.speed * dt; if (v.x < -100) { v.x = W + 100 + Math.random() * 200; } break;
    }
  });

  // 更新行人
  pedestrians.forEach(p => {
    if (!p.active) return;
    switch (p.dir) {
      case 'left':
        p.x -= p.speed * dt;
        if (p.x < p.targetX) { p.x = p.targetX; p.active = false; }
        break;
      case 'right':
        p.x += p.speed * dt;
        if (p.x > p.targetX) { p.x = p.targetX; p.active = false; }
        break;
      case 'down':
        p.y += p.speed * dt;
        if (p.y > p.targetY) { p.y = p.targetY; p.active = false; }
        break;
      case 'up':
        p.y -= p.speed * dt;
        if (p.y < p.targetY) { p.y = p.targetY; p.active = false; }
        break;
    }
  });

  // 更新玩家
  if (playerAction === 'moving' && playerPath.length > 0) {
    playerPathIdx += playerSpeed * dt / getSegLen(playerPathIdx);
    if (playerPathIdx >= playerPath.length - 1) {
      playerPathIdx = playerPath.length - 1;
      playerAction = 'done';
      onPlayerArrived();
      return;
    }
    const pos = interpPath(playerPathIdx);
    player.x = pos.x;
    player.y = pos.y;
    player.angle = pos.a;

    // 碰撞检测
    const collision = checkCollision();
    if (collision) {
      playerAction = 'done';
      onPlayerCollision(collision);
    }
  }

  // 更新粒子
  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
  });
  particles = particles.filter(p => p.life > 0);

  // 震动衰减
  if (shakeTimer > 0) shakeTimer -= dt;
  if (flashTimer > 0) flashTimer -= dt;

  // 等待输入延迟（判断安全时机）
  if (inputDelay > 0) inputDelay -= dt;
}

function getSegLen(idx) {
  const i = Math.floor(idx);
  if (i >= playerPath.length - 1) return 1;
  const a = playerPath[i], b = playerPath[i + 1];
  return Math.max(Math.hypot(b.x - a.x, b.y - a.y), 1);
}

function interpPath(idx) {
  const i = Math.floor(idx);
  const f = idx - i;
  if (i >= playerPath.length - 1) {
    const p = playerPath[playerPath.length - 1];
    return { x: p.x, y: p.y, a: p.a };
  }
  const a = playerPath[i], b = playerPath[i + 1];
  return {
    x: a.x + (b.x - a.x) * f,
    y: a.y + (b.y - a.y) * f,
    a: a.a + (b.a - a.a) * f
  };
}

function checkCollision() {
  const px = player.x, py = player.y, pw = 30, ph = 30;

  // 检测与车辆碰撞
  for (const v of vehicles) {
    if (!v.active) continue;
    if (rectsOverlap(px - pw / 2, py - ph / 2, pw, ph, v.x - v.w / 2 + 4, v.y - v.h / 2 + 4, v.w - 8, v.h - 8)) {
      return { type: 'vehicle', obj: v };
    }
  }

  // 检测与行人碰撞
  for (const p of pedestrians) {
    if (!p.active) continue;
    if (Math.hypot(px - p.x, py - p.y) < 25) {
      return { type: 'pedestrian', obj: p };
    }
  }

  return null;
}

function rectsOverlap(x1, y1, w1, h1, x2, y2, w2, h2) {
  return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
}

function onPlayerCollision(collision) {
  shakeTimer = 0.5;
  shakeIntensity = 8;
  flashTimer = 0.3;
  spawnParticles(player.x, player.y, '#ff6b6b', 15);

  const lv = LEVELS[currentLevel];
  let msg = '';
  if (collision.type === 'vehicle') {
    msg = `💥 碰撞！你的车辆与对向车辆发生碰撞。<br>📖 <b>${lv.ruleShort}</b>：${lv.rule}`;
  } else {
    msg = `💥 危险！你没有让行人先行。<br>📖 <b>${lv.ruleShort}</b>：${lv.rule}`;
  }
  showFeedback('fail', '操作失误！', msg);
  roundResults.push(false);

  setTimeout(() => { startRound(); }, 3500);
}

function onPlayerArrived() {
  // 检查是否安全通过（检查关键时间窗）
  const safe = evaluateSafety();
  if (safe) {
    const roundScore = 80 + Math.floor(Math.random() * 21);
    score += roundScore;
    updateScore();
    spawnParticles(player.x, player.y, '#4ecdc4', 20);
    showFeedback('success', '✅ 安全通过！+' + roundScore + '分',
      `判断准确！你正确遵守了「${LEVELS[currentLevel].ruleShort}」规则。`);
    roundResults.push(true);
  } else {
    score += 30;
    updateScore();
    showFeedback('info', '⚠️ 勉强通过 +30分',
      `虽然通过了，但时机选择不够理想，存在安全隐患。<br>记住：${LEVELS[currentLevel].ruleShort}`);
    roundResults.push(false);
  }

  setTimeout(() => { startRound(); }, 3000);
}

function evaluateSafety() {
  const px = player.x, py = player.y;
  // 检查周围是否有NPC车辆/行人太近
  let minDist = Infinity;
  vehicles.forEach(v => {
    if (!v.active) return;
    const d = Math.hypot(px - v.x, py - v.y);
    minDist = Math.min(minDist, d);
  });
  pedestrians.forEach(p => {
    if (!p.active) return;
    const d = Math.hypot(px - p.x, py - p.y);
    minDist = Math.min(minDist, d);
  });

  if (currentLevel === 2) {
    // 窄路会车：判断是否在障碍区附近与对向车相遇
    if (obstacleZone) {
      const nearObstacle = vehicles.some(v =>
        v.isOncoming && v.active &&
        Math.abs(v.x - obstacleZone.x) < obstacleZone.w + 60 &&
        Math.abs(player.x - obstacleZone.x) < obstacleZone.w + 60
      );
      if (nearObstacle) return false;
    }
  }

  return minDist > 120;
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 60 + Math.random() * 120;
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 0.6 + Math.random() * 0.4, color, r: 2 + Math.random() * 3
    });
  }
}

// ======================== 渲染 ========================
function render() {
  ctx.save();

  // 震动效果
  if (shakeTimer > 0) {
    const sx = (Math.random() - 0.5) * shakeIntensity * (shakeTimer / 0.5);
    const sy = (Math.random() - 0.5) * shakeIntensity * (shakeTimer / 0.5);
    ctx.translate(sx, sy);
  }

  // 清屏
  ctx.fillStyle = GRASS;
  ctx.fillRect(0, 0, W, H);

  switch (currentLevel) {
    case 0: renderIntersection(); break;
    case 1: renderIntersection(); break;
    case 2: renderNarrowRoad(); break;
  }

  // 绘制NPC车辆
  vehicles.forEach(v => {
    if (!v.active) return;
    drawVehicle(v);
  });

  // 绘制行人
  pedestrians.forEach(p => {
    if (!p.active) return;
    drawPedestrian(p);
  });

  // 绘制玩家
  if (player && gameState !== 'title') {
    drawVehicle(player, true);
  }

  // 粒子
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // 碰撞闪红
  if (flashTimer > 0) {
    ctx.fillStyle = `rgba(255,50,50,${flashTimer * 0.5})`;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();
}

function renderIntersection() {
  const cx = W / 2, cy = H / 2;
  const rw = 160;
  const lw = rw / 2;

  // 人行道纹理
  ctx.fillStyle = '#777';
  ctx.fillRect(cx - rw / 2 - 20, 0, rw + 40, H); // 纵向
  ctx.fillRect(0, cy - rw / 2 - 20, W, rw + 40); // 横向

  // 道路
  ctx.fillStyle = ROAD_COLOR;
  ctx.fillRect(cx - rw / 2, 0, rw, H);
  ctx.fillRect(0, cy - rw / 2, W, rw);

  // 道路边缘线
  ctx.strokeStyle = ROAD_EDGE;
  ctx.lineWidth = 2;
  ctx.setLineDash([]);
  // 纵向
  ctx.beginPath(); ctx.moveTo(cx - rw / 2, 0); ctx.lineTo(cx - rw / 2, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + rw / 2, 0); ctx.lineTo(cx + rw / 2, H); ctx.stroke();
  // 横向
  ctx.beginPath(); ctx.moveTo(0, cy - rw / 2); ctx.lineTo(W, cy - rw / 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, cy + rw / 2); ctx.lineTo(W, cy + rw / 2); ctx.stroke();

  // 中心线（黄色虚线）
  ctx.strokeStyle = ROAD_LINE;
  ctx.lineWidth = 2;
  ctx.setLineDash([16, 12]);
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, cy - rw / 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy + rw / 2); ctx.lineTo(cx, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(cx - rw / 2, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + rw / 2, cy); ctx.lineTo(W, cy); ctx.stroke();
  ctx.setLineDash([]);

  // 人行横道
  drawCrosswalk(cx, cy - rw / 2 - 16, rw, 16, true);
  drawCrosswalk(cx, cy + rw / 2, rw, 16, true);
  drawCrosswalk(cx - rw / 2 - 16, cy, 16, rw, false);
  drawCrosswalk(cx + rw / 2, cy, 16, rw, false);

  // 停止线（覆盖每个方向的正确车道）
  ctx.fillStyle = '#fff';
  ctx.fillRect(cx + 4, cy + rw / 2 - 3, lw - 4, 3);    // 下方停止线（北向车道，中线右侧）
  ctx.fillRect(cx - lw + 4, cy - rw / 2, lw - 4, 3);  // 上方停止线（南向车道，中线左侧）
  ctx.fillRect(cx - rw / 2, cy + 4, 3, lw - 4);        // 左方停止线（东向车道）
  ctx.fillRect(cx + rw / 2 - 3, cy - lw + 4, 3, lw - 4); // 右方停止线（西向车道）

  // 方向箭头（放在正确车道上）
  drawArrow(cx + lw / 2, cy + rw / 2 + 60, 0, 'left-turn');  // 北向车道左转箭头
  drawArrow(cx - lw / 2, cy - rw / 2 - 60, Math.PI, 'straight'); // 南向车道直行箭头
}

function drawCrosswalk(x, y, w, h, horizontal) {
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  if (horizontal) {
    const stripes = Math.floor(w / 12);
    for (let i = 0; i < stripes; i++) {
      ctx.fillRect(x - w / 2 + i * 12 + 2, y, 8, h);
    }
  } else {
    const stripes = Math.floor(h / 12);
    for (let i = 0; i < stripes; i++) {
      ctx.fillRect(x, y - h / 2 + i * 12 + 2, w, 8);
    }
  }
}

function drawArrow(x, y, angle, type) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.moveTo(0, -18);
  ctx.lineTo(10, -4);
  ctx.lineTo(4, -4);
  ctx.lineTo(4, 18);
  ctx.lineTo(-4, 18);
  ctx.lineTo(-4, -4);
  ctx.lineTo(-10, -4);
  ctx.closePath();
  ctx.fill();
  if (type === 'left-turn') {
    ctx.beginPath();
    ctx.moveTo(-4, 0);
    ctx.lineTo(-18, 0);
    ctx.lineTo(-18, -6);
    ctx.lineTo(-4, -6);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function renderNarrowRoad() {
  const cy = H / 2;
  const roadW = 100;
  const narrowW = 50;

  // 道路背景
  ctx.fillStyle = '#777';
  ctx.fillRect(0, cy - roadW / 2 - 20, W, roadW + 40);

  ctx.fillStyle = ROAD_COLOR;
  ctx.fillRect(0, cy - roadW / 2, W, roadW);

  // 窄路段
  ctx.fillStyle = GRASS;
  ctx.fillRect(obstacleZone.x, cy - roadW / 2, obstacleZone.w, roadW / 2 + narrowW / 2);

  // 施工区域标记
  ctx.fillStyle = '#f39c12';
  const oz = obstacleZone;
  for (let i = 0; i < oz.w; i += 20) {
    ctx.fillStyle = i % 40 < 20 ? '#f39c12' : '#222';
    ctx.fillRect(oz.x + i, oz.y + oz.h - 8, Math.min(20, oz.w - i), 8);
  }

  // 施工标志
  ctx.fillStyle = '#f39c12';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('⚠ 施工', oz.x + oz.w / 2, oz.y + oz.h / 2);

  // 中心线
  ctx.strokeStyle = ROAD_LINE;
  ctx.lineWidth = 2;
  ctx.setLineDash([16, 12]);
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(oz.x, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(oz.x + oz.w, cy); ctx.lineTo(W, cy); ctx.stroke();
  ctx.setLineDash([]);

  // 边缘线
  ctx.strokeStyle = ROAD_EDGE;
  ctx.lineWidth = 2;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(0, cy - roadW / 2); ctx.lineTo(W, cy - roadW / 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, cy + roadW / 2); ctx.lineTo(W, cy + roadW / 2); ctx.stroke();

  // 窄路段边缘
  ctx.strokeStyle = '#f39c12';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(oz.x, oz.y + oz.h);
  ctx.lineTo(oz.x, cy + roadW / 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(oz.x + oz.w, oz.y + oz.h);
  ctx.lineTo(oz.x + oz.w, cy + roadW / 2);
  ctx.stroke();

  // 标注
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('← 你的方向', 150, cy + roadW / 2 + 30);
  ctx.fillText('对向车辆 →', W - 150, cy - roadW / 2 - 15);
}

function drawVehicle(v, isPlayer) {
  ctx.save();
  ctx.translate(v.x, v.y);
  // 确定旋转角度
  let rot = v.angle || 0;
  if (!isPlayer && v.dir) {
    switch(v.dir) {
      case 'down': rot = Math.PI; break;
      case 'up': rot = 0; break;
      case 'right': rot = Math.PI/2; break;
      case 'left': rot = -Math.PI/2; break;
    }
  }
  ctx.rotate(rot);

  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(-v.w / 2 + 3, -v.h / 2 + 3, v.w, v.h);

  // 车身
  ctx.fillStyle = v.color;
  const r = 6;
  roundRect(ctx, -v.w / 2, -v.h / 2, v.w, v.h, r);
  ctx.fill();

  // 车窗（所有车辆统一尺寸 w=36,h=56，车头在 -y 方向）
  ctx.fillStyle = 'rgba(150,220,255,0.5)';
  ctx.fillRect(-v.w / 2 + 4, -v.h / 2 + 6, v.w - 8, v.h * 0.25);

  // 标签
  if (v.label) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(v.label, 0, 0);
  }

  // 高亮边框（玩家）
  if (isPlayer) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    roundRect(ctx, -v.w / 2, -v.h / 2, v.w, v.h, r);
    ctx.stroke();

    // 呼吸灯效果
    const glow = 0.3 + Math.sin(time * 3) * 0.15;
    ctx.shadowColor = v.color;
    ctx.shadowBlur = 15 * glow;
    roundRect(ctx, -v.w / 2, -v.h / 2, v.w, v.h, r);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

function drawPedestrian(p) {
  ctx.save();
  ctx.translate(p.x, p.y);

  // 身体
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(0, 0, p.r, 0, Math.PI * 2);
  ctx.fill();

  // 头
  ctx.fillStyle = '#ffd699';
  ctx.beginPath();
  ctx.arc(0, -2, p.r * 0.55, 0, Math.PI * 2);
  ctx.fill();

  // 行走动画
  const legOffset = Math.sin(time * 8) * 4;
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-3, p.r * 0.5);
  ctx.lineTo(-3 + legOffset, p.r + 4);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(3, p.r * 0.5);
  ctx.lineTo(3 - legOffset, p.r + 4);
  ctx.stroke();

  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
</script>
