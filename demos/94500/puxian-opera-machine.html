<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>莆仙戏点戏机</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');

  :root {
    --gold: #D4A853;
    --gold-light: #F5E6B8;
    --red: #C0392B;
    --red-dark: #8B1A1A;
    --bg-dark: #1A0A00;
    --bg-card: #2A1500;
    --text-light: #FFF5E1;
    --text-muted: #B89878;
    --shadow-gold: 0 0 30px rgba(212,168,83,0.3);
    --radius: 16px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Noto Serif SC', serif;
    background: var(--bg-dark);
    color: var(--text-light);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== Background Decoration ===== */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
      radial-gradient(ellipse at 20% 50%, rgba(192,57,43,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(212,168,83,0.1) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(139,26,26,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px;
    position: relative;
    z-index: 1;
  }

  /* ===== Header ===== */
  .header {
    text-align: center;
    padding: 30px 0 20px;
  }

  .header-icon {
    font-size: 48px;
    margin-bottom: 8px;
    display: block;
    filter: drop-shadow(0 0 15px rgba(212,168,83,0.5));
  }

  .header h1 {
    font-size: 2.4em;
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 6px;
    text-shadow: none;
  }

  .header .subtitle {
    color: var(--text-muted);
    font-size: 0.95em;
    margin-top: 8px;
    letter-spacing: 2px;
  }

  /* ===== Voice Input Section ===== */
  .voice-section {
    background: linear-gradient(135deg, var(--bg-card), #3A2000);
    border: 2px solid rgba(212,168,83,0.3);
    border-radius: var(--radius);
    padding: 24px;
    margin: 20px 0;
    box-shadow: var(--shadow-gold);
  }

  .voice-section h2 {
    color: var(--gold);
    font-size: 1.2em;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .input-area {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .text-input {
    flex: 1;
    background: rgba(0,0,0,0.4);
    border: 2px solid rgba(212,168,83,0.2);
    border-radius: 12px;
    padding: 14px 18px;
    color: var(--text-light);
    font-size: 1.1em;
    font-family: 'Noto Serif SC', serif;
    outline: none;
    transition: border-color 0.3s;
  }

  .text-input:focus {
    border-color: var(--gold);
  }

  .text-input::placeholder {
    color: var(--text-muted);
    font-size: 0.9em;
  }

  /* Mic Button */
  .mic-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    background: linear-gradient(135deg, var(--red-dark), var(--red));
    color: white;
    font-size: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .mic-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 25px rgba(192,57,43,0.6);
  }

  .mic-btn.listening {
    animation: pulse-mic 1.2s infinite;
    border-color: #FF6B6B;
    background: linear-gradient(135deg, #FF4444, #CC0000);
  }

  @keyframes pulse-mic {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,68,68,0.6); }
    50% { box-shadow: 0 0 0 18px rgba(255,68,68,0); }
  }

  .mic-btn .ripple {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4);
    animation: ripple-out 1.5s infinite;
    opacity: 0;
  }

  .mic-btn.listening .ripple { opacity: 1; }

  @keyframes ripple-out {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(2.2); opacity: 0; }
  }

  .search-btn {
    padding: 14px 24px;
    border-radius: 12px;
    border: 2px solid var(--gold);
    background: linear-gradient(135deg, var(--gold), #C49A3A);
    color: var(--bg-dark);
    font-size: 1em;
    font-weight: 700;
    font-family: 'Noto Serif SC', serif;
    cursor: pointer;
    transition: all 0.3s;
    flex-shrink: 0;
  }

  .search-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(212,168,83,0.4);
  }

  /* Recognition Status */
  .recognition-status {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.9em;
    display: none;
    align-items: center;
    gap: 8px;
  }

  .recognition-status.active {
    display: flex;
  }

  .recognition-status.listening-status {
    background: rgba(255,68,68,0.15);
    border: 1px solid rgba(255,68,68,0.3);
    color: #FFB8B8;
  }

  .recognition-status.result-status {
    background: rgba(212,168,83,0.15);
    border: 1px solid rgba(212,168,83,0.3);
    color: var(--gold-light);
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #FF4444;
    animation: blink 0.8s infinite;
  }

  .result-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--gold);
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ===== Result Card ===== */
  .result-section {
    margin: 24px 0;
    display: none;
  }

  .result-section.active {
    display: block;
    animation: fadeInUp 0.5s ease;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-card {
    background: linear-gradient(135deg, var(--bg-card), #3A2000);
    border: 2px solid rgba(212,168,83,0.4);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-gold);
  }

  .result-card .match-label {
    background: linear-gradient(90deg, var(--red-dark), var(--red));
    padding: 8px 20px;
    font-size: 0.85em;
    color: white;
    letter-spacing: 2px;
  }

  .result-body {
    display: flex;
    gap: 20px;
    padding: 20px;
    align-items: center;
  }

  @media (max-width: 600px) {
    .result-body { flex-direction: column; }
  }

  .result-poster {
    width: 200px;
    height: 130px;
    border-radius: 10px;
    object-fit: cover;
    border: 2px solid rgba(212,168,83,0.3);
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    flex-shrink: 0;
  }

  .result-info {
    flex: 1;
    text-align: left;
  }

  .result-info h3 {
    font-size: 1.6em;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .result-info .opera-desc {
    color: var(--text-muted);
    font-size: 0.9em;
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .result-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn-confirm {
    padding: 12px 32px;
    border-radius: 12px;
    border: 2px solid var(--gold);
    background: linear-gradient(135deg, var(--gold), #C49A3A);
    color: var(--bg-dark);
    font-size: 1.05em;
    font-weight: 700;
    font-family: 'Noto Serif SC', serif;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-confirm:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(212,168,83,0.4);
  }

  .btn-switch {
    padding: 12px 32px;
    border-radius: 12px;
    border: 2px solid rgba(212,168,83,0.3);
    background: transparent;
    color: var(--text-muted);
    font-size: 1.05em;
    font-family: 'Noto Serif SC', serif;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-switch:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(212,168,83,0.08);
  }

  .match-index {
    font-size: 0.8em;
    color: var(--text-muted);
    margin-left: 8px;
  }

  /* ===== Player Section ===== */
  .player-section {
    margin: 24px 0;
    display: none;
  }

  .player-section.active {
    display: block;
    animation: fadeInUp 0.5s ease;
  }

  .player-card {
    background: linear-gradient(135deg, var(--bg-card), #3A2000);
    border: 2px solid rgba(212,168,83,0.4);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-gold);
  }

  .player-header {
    background: linear-gradient(90deg, var(--red-dark), var(--red));
    padding: 8px 20px;
    font-size: 0.85em;
    color: white;
    letter-spacing: 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .player-now-playing {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .playing-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ADE80;
    animation: blink 1s infinite;
  }

  .playing-dot.paused { background: var(--gold); animation: none; }

  .player-body {
    padding: 20px;
  }

  .player-display {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border: 2px solid rgba(212,168,83,0.2);
    margin-bottom: 20px;
  }

  .player-display video,
  .player-display img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .player-display .audio-visual {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    height: 100%;
    justify-content: center;
    background: linear-gradient(135deg, #1A0A00, #2A1500);
  }

  .audio-visual .opera-poster-display {
    width: 180px;
    height: 120px;
    border-radius: 12px;
    object-fit: cover;
    border: 2px solid rgba(212,168,83,0.4);
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  }

  .audio-visual .eq-bars {
    display: flex;
    gap: 4px;
    align-items: flex-end;
    height: 40px;
  }

  .eq-bars .bar {
    width: 6px;
    border-radius: 3px;
    background: var(--gold);
    animation: eq-dance 0.6s ease-in-out infinite alternate;
  }

  .eq-bars .bar:nth-child(1) { height: 15px; animation-delay: 0s; }
  .eq-bars .bar:nth-child(2) { height: 25px; animation-delay: 0.1s; }
  .eq-bars .bar:nth-child(3) { height: 35px; animation-delay: 0.2s; }
  .eq-bars .bar:nth-child(4) { height: 20px; animation-delay: 0.15s; }
  .eq-bars .bar:nth-child(5) { height: 30px; animation-delay: 0.05s; }
  .eq-bars .bar:nth-child(6) { height: 18px; animation-delay: 0.25s; }
  .eq-bars .bar:nth-child(7) { height: 28px; animation-delay: 0.12s; }

  .eq-bars.paused .bar { animation-play-state: paused; }

  @keyframes eq-dance {
    0% { transform: scaleY(0.3); }
    100% { transform: scaleY(1); }
  }

  .audio-visual .title-display {
    color: var(--gold);
    font-size: 1.2em;
    font-weight: 700;
  }

  /* Progress Bar */
  .progress-container {
    margin-bottom: 16px;
  }

  .progress-bar-wrap {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    cursor: pointer;
    position: relative;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--red), var(--gold));
    border-radius: 4px;
    width: 0%;
    transition: width 0.3s linear;
  }

  .progress-time {
    display: flex;
    justify-content: space-between;
    font-size: 0.8em;
    color: var(--text-muted);
    margin-top: 6px;
  }

  /* Player Controls */
  .player-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid rgba(212,168,83,0.3);
    background: rgba(0,0,0,0.3);
    color: var(--text-light);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }

  .ctrl-btn:hover {
    border-color: var(--gold);
    background: rgba(212,168,83,0.1);
    transform: scale(1.08);
  }

  .ctrl-btn.play-btn {
    width: 68px;
    height: 68px;
    font-size: 28px;
    border-color: var(--gold);
    background: linear-gradient(135deg, var(--red-dark), var(--red));
    box-shadow: 0 0 20px rgba(192,57,43,0.3);
  }

  .ctrl-btn.play-btn:hover {
    box-shadow: 0 0 30px rgba(192,57,43,0.5);
  }

  .btn-back-to-select {
    padding: 10px 24px;
    border-radius: 10px;
    border: 2px solid rgba(212,168,83,0.2);
    background: transparent;
    color: var(--text-muted);
    font-size: 0.9em;
    font-family: 'Noto Serif SC', serif;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 12px;
  }

  .btn-back-to-select:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  /* ===== Opera Gallery ===== */
  .gallery-section {
    margin: 30px 0;
  }

  .gallery-section h2 {
    color: var(--gold);
    font-size: 1.2em;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .gallery-item {
    background: var(--bg-card);
    border: 2px solid rgba(212,168,83,0.15);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s;
  }

  .gallery-item:hover {
    border-color: var(--gold);
    transform: translateY(-4px);
    box-shadow: var(--shadow-gold);
  }

  .gallery-item img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    display: block;
  }

  .gallery-item .item-title {
    padding: 10px 12px;
    font-size: 0.95em;
    color: var(--text-light);
    text-align: center;
  }

  /* ===== Footer ===== */
  .footer {
    text-align: center;
    padding: 30px 0 20px;
    color: var(--text-muted);
    font-size: 0.8em;
    letter-spacing: 1px;
  }

  .footer .heart {
    color: var(--red);
  }

  /* ===== Responsive ===== */
  @media (max-width: 600px) {
    .header h1 { font-size: 1.8em; letter-spacing: 3px; }
    .input-area { flex-wrap: wrap; }
    .text-input { width: 100%; }
    .search-btn { width: 100%; }
    .mic-btn { margin: 0 auto; }
    .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .result-poster { width: 100%; height: 160px; }
  }

  /* ===== Loading Spinner ===== */
  .loading-spinner {
    display: none;
    text-align: center;
    padding: 40px 20px;
    color: var(--gold);
  }

  .loading-spinner.active { display: block; }

  .spinner-icon {
    font-size: 40px;
    animation: spin 1.5s linear infinite;
    display: inline-block;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .loading-text {
    margin-top: 12px;
    color: var(--text-muted);
    font-size: 0.95em;
  }

  /* ===== Translation Flow ===== */
  .translation-flow {
    display: none;
    margin: 20px 0;
    animation: fadeInUp 0.5s ease;
  }
  .translation-flow.active { display: block; }

  .flow-card {
    background: linear-gradient(135deg, var(--bg-card), #3A2000);
    border: 2px solid rgba(212,168,83,0.3);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow-gold);
  }

  .flow-header {
    background: linear-gradient(90deg, #2D5A27, #3B7A33);
    padding: 8px 20px;
    font-size: 0.85em;
    color: white;
    letter-spacing: 2px;
    border-radius: 14px 14px 0 0;
    margin: -20px -20px 16px -20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .flow-steps {
    display: flex;
    align-items: stretch;
    gap: 0;
  }

  @media (max-width: 600px) {
    .flow-steps { flex-direction: column; }
  }

  .flow-step {
    flex: 1;
    text-align: center;
    padding: 16px 12px;
    position: relative;
  }

  .flow-step-icon {
    font-size: 28px;
    margin-bottom: 6px;
    display: block;
  }

  .flow-step-label {
    font-size: 0.75em;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .flow-step-content {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(212,168,83,0.2);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 1.05em;
    color: var(--gold-light);
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    word-break: break-all;
  }

  .flow-step-content.original {
    border-color: rgba(255,100,100,0.4);
    color: #FFB8B8;
  }

  .flow-step-content.translated {
    border-color: rgba(78,222,128,0.4);
    color: #A8F0B0;
  }

  .flow-step-content.matched {
    border-color: rgba(212,168,83,0.5);
    color: var(--gold-light);
  }

  .flow-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--gold);
    padding: 0 8px;
    flex-shrink: 0;
  }

  @media (max-width: 600px) {
    .flow-arrow { transform: rotate(90deg); padding: 6px 0; }
  }

  .flow-no-translate {
    color: var(--text-muted);
    font-size: 0.85em;
    font-style: italic;
  }

  /* Hidden elements */
  .hidden { display: none !important; }

  /* Volume Control */
  .volume-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    justify-content: center;
  }

  .volume-wrap label {
    color: var(--text-muted);
    font-size: 0.85em;
  }

  .volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 120px;
    height: 6px;
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
    outline: none;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--gold);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(212,168,83,0.4);
  }
</style>
</head>
<body>

<div class="container">

  <!-- ===== Header ===== -->
  <div class="header">
    <span class="header-icon">&#127917;</span>
    <h1>莆仙戏点戏机</h1>
    <p class="subtitle">奶奶外婆，用莆仙话说话，系统自动翻译找戏！</p>
  </div>

  <!-- ===== Voice Input Section ===== -->
  <div class="voice-section">
    <h2>&#127908; 请说出想看的戏</h2>
    <div class="input-area">
      <input type="text" class="text-input" id="userInput" placeholder="用莆仙话说戏名，如：食了去睇春草闯堂、汝卜看咩戏..." />
      <button class="mic-btn" id="micBtn" title="按住说话">
        &#127908;
        <span class="ripple"></span>
      </button>
      <button class="search-btn" id="searchBtn">点 戏</button>
    </div>
    <div class="recognition-status" id="recogStatus">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">正在听您说话...</span>
    </div>
  </div>

  <!-- ===== Translation Flow ===== -->
  <div class="translation-flow" id="translationFlow">
    <div class="flow-card">
      <div class="flow-header">&#127760; 莆仙话翻译流程</div>
      <div class="flow-steps">
        <div class="flow-step">
          <span class="flow-step-icon">&#127908;</span>
          <div class="flow-step-label">方言输入</div>
          <div class="flow-step-content original" id="flowOriginal">--</div>
        </div>
        <div class="flow-arrow">&#10132;</div>
        <div class="flow-step">
          <span class="flow-step-icon">&#129309;</span>

// =============================================
// 莆仙话翻译引擎
// =============================================
function translatePuxian(input) {
  if (!input) return { translated: '', changed: false };

  const trimmed = input.trim();
  let translated = trimmed;
  let changed = false;

  // 第一优先：整句匹配
  for (const [k, v] of Object.entries(puxianDict)) {
    if (translated.includes(k) && k === v) continue;
    if (translated.includes(k)) {
      translated = translated.replaceAll(k, v);
      if (v !== k) changed = true;
    }
  }

  // 第二优先：逐字/逐词替换（按长度降序，避免短词覆盖长词）
  const sortedKeys = Object.keys(puxianDict).sort((a, b) => b.length - a.length);
  for (const k of sortedKeys) {
    if (translated.includes(k)) {
      translated = translated.replaceAll(k, puxianDict[k]);
      if (puxianDict[k] !== k) changed = true;
    }
  }

  return { translated: translated.trim(), changed };
}

function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    micBtn.title = '此浏览器不支持语音识别';
    micBtn.style.opacity = '0.5';
    micBtn.style.cursor = 'not-allowed';
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onresult = function(event) {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    userInput.value = transcript;

    if (event.results[event.results.length - 1].isFinal) {
      showStatus('result', `莆仙话识别：${transcript}`);
      setTimeout(() => startSearch(), 600);
    }
  };

  recognition.onstart = function() {
    micBtn.classList.add('listening');
    showStatus('listening', '正在听您说话...');
  };

  recognition.onend = function() {
    micBtn.classList.remove('listening');
    if (!userInput.value.trim()) {
      recogStatus.classList.remove('active');
    }
  };

  recognition.onerror = function(event) {
    micBtn.classList.remove('listening');
    if (event.error === 'no-speech') {
      showStatus('result', '没有听到声音，请再试一次');
    } else if (event.error === 'not-allowed') {
      showStatus('result', '请允许使用麦克风');
    } else {
      showStatus('result', '语音识别出错，请再试一次');
    }
  };
}

function showStatus(type, text) {
  recogStatus.className = 'recognition-status active ' + (type === 'listening' ? 'listening-status' : 'result-status');
  statusDot.className = type === 'listening' ? 'status-dot' : 'result-dot';
  statusText.textContent = text;
}

function startSearch() {
  const rawInput = userInput.value.trim();
  if (!rawInput) return;
  originalInput = rawInput;

  // Step 1: 莆仙话翻译

  // 显示翻译流程卡片

  playerSection.classList.remove('active');
  translationFlow.classList.add('active');

  // Step 1: 显示原始输入
  flowOriginal.innerHTML = rawInput;
  flowOriginal.className = 'flow-step-content original';

  // Step 2: 显示翻译结果（带动画延迟）
  if (changed) {
    flowTranslated.innerHTML = `<strong>${translated}</strong>`;
    flowTranslated.className = 'flow-step-content translated';
  } else {
    flowTranslated.innerHTML = `<span class="flow-no-translate">已是普通话，无需翻译</span>`;
    flowTranslated.className = 'flow-step-content translated';
  }

  flowMatched.innerHTML = '<span class="flow-no-translate">搜索中...</span>';
  flowMatched.className = 'flow-step-content matched';

  // Show loading
  loadingSpinner.classList.add('active');

  // Simulate search delay with step-by-step animation
  setTimeout(() => {
    // Step 3: 搜索匹配
    const searchQuery = changed ? translated : rawInput;
    matchResults = searchOpera(searchQuery);
    currentMatchIndex = 0;

    if (matchResults.length > 0) {
      flowMatched.innerHTML = `<strong>${matchResults[0].title}</strong>`;
    } else {
      flowMatched.innerHTML = '<span class="flow-no-translate">未匹配到戏目</span>';
    }

    loadingSpinner.classList.remove('active');

    if (matchResults.length > 0) {
      showResult();
    } else {
      showNoResult();
    }
  }, 1000);
}

function searchOpera(query) {
  const q = query.toLowerCase();
  const results = [];

  operaDB.forEach(opera => {
    let score = 0;

    // Exact title match
    if (opera.title === query) {
      score += 100;
    }
    // Title contains query
    if (opera.title.includes(query) || query.includes(opera.title)) {
      score += 50;
    }

    // Keyword matching
    opera.keywords.forEach(kw => {
      const kwLower = kw.toLowerCase();
      if (kwLower === q) score += 40;
      else if (kwLower.includes(q) || q.includes(kwLower)) score += 20;

      // Fuzzy: character overlap
      let common = 0;
      for (let i = 0; i < q.length; i++) {
        if (kwLower.includes(q[i])) common++;
      }
      if (common > 0) score += common * 5;
    });

    if (score > 0) results.push({ opera, score });
  });

  // Sort by score descending
  results.sort((a, b) => b.score - a.score);
  return results.map(r => r.opera);
}

function showResult() {
  currentOpera = matchResults[currentMatchIndex];

}

  }, 100);
}

// =============================================
// Player
// =============================================
function startPlayback(opera) {
  resultSection.classList.remove('active');
  playerSection.classList.add('active');
  playerTitle.textContent = opera.title;
  isPlaying = true;
  updatePlayPauseIcon();

  // In Demo mode, we show a poster + simulated audio waveform
  // When real MP3/video files are available, replace this section
  renderDemoPlayer(opera);
}

function renderDemoPlayer(opera) {
  playerDisplay.innerHTML = `
    <div class="audio-visual">
      <img class="opera-poster-display" src="${opera.poster}" alt="${opera.title}" />
      <div class="eq-bars" id="eqBars">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
      <div class="title-display">${opera.title}</div>
      <div style="color: var(--text-muted); font-size: 0.85em; margin-top: 4px;">（Demo模式 · 等待音频文件接入）</div>
    </div>
  `;

  // Simulate a 90-second playback
  let elapsed = 0;
  const duration = 90;

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }

  totalTimeEl.textContent = formatTime(duration);

  if (window._demoInterval) clearInterval(window._demoInterval);

  function tick() {
    if (isPlaying) {
      elapsed += 0.3;
      if (elapsed >= duration) {
        elapsed = duration;
        isPlaying = false;
        updatePlayPauseIcon();
      }
      progressFill.style.width = (elapsed / duration * 100) + '%';
      currentTimeEl.textContent = formatTime(elapsed);
    }
  }

  window._demoInterval = setInterval(tick, 300);

  window._demoSeek = function(newElapsed) {
    elapsed = Math.max(0, Math.min(newElapsed, duration));
    progressFill.style.width = (elapsed / duration * 100) + '%';
    currentTimeEl.textContent = formatTime(elapsed);
  };

  window._demoReset = function() {
    elapsed = 0;
    isPlaying = true;
    updatePlayPauseIcon();
    const eqBars = document.getElementById('eqBars');
    if (eqBars) eqBars.classList.remove('paused');
    tick();
  };
}

function updatePlayPauseIcon() {
  btnPlayPause.innerHTML = isPlaying ? '&#9646;&#9646;' : '&#9654;';
  playingDot.className = isPlaying ? 'playing-dot' : 'playing-dot paused';
  const eqBars = document.getElementById('eqBars');
  if (eqBars) {
    eqBars.classList.toggle('paused', !isPlaying);
  }
}

// =============================================
// Event Listeners
// =============================================

// Mic button
micBtn.addEventListener('click', () => {
  if (!recognition) {
    showStatus('result', '此浏览器不支持语音识别，请使用Chrome浏览器');
    return;
  }
  try {
    recognition.start();
  } catch(e) {
    // Already started, ignore
  }
});

// Search button
searchBtn.addEventListener('click', startSearch);

// Enter key
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') startSearch();
});

// Confirm
confirmBtn.addEventListener('click', () => {
  if (currentOpera) startPlayback(currentOpera);
});

// Switch
switchBtn.addEventListener('click', () => {
  currentMatchIndex = (currentMatchIndex + 1) % matchResults.length;
  showResult();
});

// Play/Pause
btnPlayPause.addEventListener('click', () => {
  isPlaying = !isPlaying;
  updatePlayPauseIcon();
});

// Rewind
btnRewind.addEventListener('click', () => {
  if (window._demoSeek) {
    const current = parseFloat(progressFill.style.width) / 100 * 90;
    window._demoSeek(current - 10);
  }
});

// Forward
btnForward.addEventListener('click', () => {
  if (window._demoSeek) {
    const current = parseFloat(progressFill.style.width) / 100 * 90;
    window._demoSeek(current + 10);
  }
});

// Replay
btnReplay.addEventListener('click', () => {
  if (window._demoReset) window._demoReset();
});

// Progress bar click
progressWrap.addEventListener('click', (e) => {
  const rect = progressWrap.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  if (window._demoSeek) {
    window._demoSeek(ratio * 90);
  }
});

// Volume
volumeSlider.addEventListener('input', () => {
  // When real audio is connected: mediaElement.volume = volumeSlider.value / 100;
});

// Back to select
btnBackSelect.addEventListener('click', () => {
  playerSection.classList.remove('active');
  if (window._demoInterval) clearInterval(window._demoInterval);
  isPlaying = false;
  resultSection.classList.add('active');
});

// =============================================
// Init
// =============================================
initGallery();
initSpeechRecognition();

</script>
</body>
</html>
