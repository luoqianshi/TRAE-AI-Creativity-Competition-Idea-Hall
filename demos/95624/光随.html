<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>光随手动 · 智能补光演示</title>
  <style>
    :root {
      --bg-primary: #F8F9FA;
      --bg-surface: #FFFFFF;
      --text-primary: #333333;
      --text-secondary: #6C757D;
      --accent: #FF9E44;
      --accent-light: #FFE0B2;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
      --radius: 12px;
      --transition: all 0.3s ease;
      --wood-bg: linear-gradient(135deg, #F5F1E9 0%, #EDE7DA 100%);
      --desk-height: 120px;
    }

    .dark-mode {
      --bg-primary: #1E1E26;
      --bg-surface: #25252F;
      --text-primary: #E6E6E6;
      --text-secondary: #A6A6A6;
      --accent: #FFB366;
      --accent-light: #4A3A2A;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
      --wood-bg: linear-gradient(135deg, #2A2A32 0%, #3A3A4A 100%);
      --desk-height: 140px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background: var(--wood-bg);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      min-height: 100vh;
      transition: var(--transition);
      background-attachment: fixed;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 24px 0;
      margin-bottom: 24px;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .demo-card {
      background: var(--bg-surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      margin-bottom: 28px;
      transition: var(--transition);
    }

    .card-header {
      padding: 16px 24px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .card-body {
      padding: 24px;
    }

    .workbench {
      position: relative;
      height: 320px;
      background: #FFF9F0;
      border-radius: var(--radius);
      overflow: hidden;
      margin: 24px 0;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.03);
      border: 1px solid #EEE5D6;
    }

    .desk {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: var(--desk-height);
      background: #D9C7A8;
      border-top: 4px solid #B8A48A;
    }

    .lamp-base {
      position: absolute;
      bottom: var(--desk-height);
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 120px;
      background: #5D5D5D;
      border-radius: 8px 8px 0 0;
      z-index: 2;
    }

    .lamp-arm {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) rotate(0deg);
      width: 8px;
      height: 140px;
      background: #4A4A4A;
      transform-origin: bottom center;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 3;
    }

    .lamp-head {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 96px;
      height: 48px;
      background: #FFD580;
      border-radius: 50% 50% 12px 12px;
      box-shadow: 0 0 24px rgba(255, 158, 68, 0.4);
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #333;
      font-weight: bold;
      letter-spacing: 0.5px;
      opacity: 0.95;
    }

    .light-beam {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(255,213,128,0.8) 0%, rgba(255,213,128,0) 70%);
      border-radius: 50%;
      filter: blur(12px);
      z-index: 1;
      transition: opacity 0.3s, transform 0.4s;
    }

    .hand-shadow {
      position: absolute;
      top: 120px;
      left: 50%;
      transform: translateX(-50%) translateX(-30px) translateY(-10px);
      width: 120px;
      height: 120px;
      background: rgba(0,0,0,0.12);
      border-radius: 50%;
      filter: blur(16px);
      z-index: 2;
      transition: all 0.3s ease;
      opacity: 0.4;
    }

    .hand-shadow.active {
      opacity: 0.7;
      transform: translateX(-50%) translateX(0) translateY(-20px) scale(1.1);
      filter: blur(20px);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 24px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 500;
      color: var(--text-primary);
      font-size: 0.95rem;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      flex: 1;
      height: 8px;
      -webkit-appearance: none;
      background: #E0E0E0;
      border-radius: 4px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .value-display {
      min-width: 56px;
      text-align: center;
      font-weight: 600;
      color: var(--accent);
      font-size: 1.1rem;
    }

    .mode-toggle {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .toggle-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #E9ECEF;
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.95rem;
    }

    .toggle-btn.active {
      background: var(--accent);
      color: white;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
      padding: 16px;
      background: var(--accent-light);
      border-radius: var(--radius);
      font-size: 0.9rem;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-weight: 700;
      color: #D32F2F;
      font-size: 1.2rem;
    }

    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      z-index: 100;
      transition: var(--transition);
      outline: none;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .theme-toggle.dark {
      background: #333;
      color: #FFD700;
    }

    footer {
      text-align: center;
      padding: 24px 0;
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-top: 16px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .workbench {
        height: 260px;
      }
      .lamp-arm {
        height: 110px;
      }
      .lamp-head {
        width: 80px;
        height: 40px;
      }
      .light-beam {
        width: 180px;
        height: 180px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .controls {
        gap: 16px;
      }
    }

    @media (max-width: 480px) {
      .mode-toggle {
        flex-direction: column;
      }
      .stats {
        flex-direction: column;
      }
      .container {
        padding: 12px;
      }
      header {
        padding: 16px 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>光随手动</h1>
      <p class="subtitle">手机摄像头识别手部位置，自动调节台灯亮度与角度｜无需APP，即开即用</p>
    </header>

    <div class="demo-card">
      <div class="card-header">实时补光模拟台</div>
      <div class="card-body">
        <div class="workbench">
          <div class="desk"></div>
          <div class="lamp-base"></div>
          <div class="lamp-arm" id="lampArm"></div>
          <div class="lamp-head">LED 补光头</div>
          <div class="light-beam" id="lightBeam"></div>
          <div class="hand-shadow" id="handShadow"></div>
        </div>

        <div class="controls">
          <div class="control-group">
            <label>手部遮挡强度（模拟）</label>
            <div class="slider-container">
              <input type="range" id="obstructionSlider" min="0" max="100" value="30">
              <span class="value-display" id="obstructionValue">30%</span>
            </div>
          </div>

          <div class="control-group">
            <label>当前光照模式</label>
            <div class="mode-toggle">
              <button class="toggle-btn active" id="modeOriginal">原始光照</button>
              <button class="toggle-btn" id="modeOptimized">光随手动</button>
            </div>
          </div>

          <div class="stats">
            <div class="stat-item">
              <div>亮度</div>
              <div class="stat-value" id="brightnessStat">72%</div>
            </div>
            <div class="stat-item">
              <div>灯臂角度</div>
              <div class="stat-value" id="angleStat">4°</div>
            </div>
            <div class="stat-item">
              <div>阴影减弱</div>
              <div class="stat-value" id="shadowStat">中</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <p>本演示基于浏览器摄像头逻辑模拟｜实际设备需搭配蓝牙模组与微信小程序</p>
    </footer>
  </div>

  <button class="theme-toggle" id="themeToggle">☀️</button>

  <script>
    // DOM Elements
    const lampArm = document.getElementById('lampArm');
    const lightBeam = document.getElementById('lightBeam');
    const handShadow = document.getElementById('handShadow');
    const obstructionSlider = document.getElementById('obstructionSlider');
    const obstructionValue = document.getElementById('obstructionValue');
    const modeOriginal = document.getElementById('modeOriginal');
    const modeOptimized = document.getElementById('modeOptimized');
    const brightnessStat = document.getElementById('brightnessStat');
    const angleStat = document.getElementById('angleStat');
    const shadowStat = document.getElementById('shadowStat');
    const themeToggle = document.getElementById('themeToggle');

    // State
    let isOptimized = true;
    let obstruction = 30;

    // Initialize
    function init() {
      updateDisplay();
      updateThemeFromSystem();
    }

    // Update visual & stats based on state
    function updateDisplay() {
      // Hand shadow
      handShadow.className = obstruction > 20 ? 'hand-shadow active' : 'hand-shadow';

      // Lamp arm angle (0°–12°)
      const angle = isOptimized ? Math.min(12, Math.max(0, obstruction * 0.12)) : 0;
      lampArm.style.transform = `translateX(-50%) rotate(${angle}deg)`;

      // Light beam opacity & size (brighter when less obstruction in optimized mode)
      const baseOpacity = isOptimized ? 0.6 + (100 - obstruction) * 0.004 : 0.6;
      const beamSize = isOptimized ? 220 + (100 - obstruction) * 0.3 : 220;
      lightBeam.style.opacity = Math.max(0.3, baseOpacity);
      lightBeam.style.width = `${beamSize}px`;
      lightBeam.style.height = `${beamSize}px`;

      // Stats
      const brightness = isOptimized ? Math.max(30, 100 - obstruction * 0.7) : 100 - obstruction * 0.3;
      brightnessStat.textContent = `${Math.round(brightness)}%`;
      angleStat.textContent = `${Math.round(angle)}°`;
      shadowStat.textContent = obstruction > 60 ? '强' : obstruction > 30 ? '中' : '弱';
    }

    // Event Listeners
    obstructionSlider.addEventListener('input', function () {
      obstruction = parseInt(this.value);
      obstructionValue.textContent = `${obstruction}%`;
      updateDisplay();
    });

    modeOriginal.addEventListener('click', function () {
      isOptimized = false;
      modeOriginal.classList.add('active');
      modeOptimized.classList.remove('active');
      updateDisplay();
    });

    modeOptimized.addEventListener('click', function () {
      isOptimized = true;
      modeOptimized.classList.add('active');
      modeOriginal.classList.remove('active');
      updateDisplay();
    });

    themeToggle.addEventListener('click', function () {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      this.textContent = isDark ? '🌙' : '☀️';
      this.classList.toggle('dark', isDark);
    });

    function updateThemeFromSystem() {
      const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (isDark) {
        document.body.classList.add('dark-mode');
        themeToggle.textContent = '🌙';
        themeToggle.classList.add('dark');
      }
    }

    // Init on load
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
