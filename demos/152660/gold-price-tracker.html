    <style>

        body {

        .card {

        }

        .card:hover {
            transform: translateY(-2px);

            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }

        .price-label {

            font-size: 0.95rem;

        .current-price {

        }

        .price-unit {

        }

        .price-update-time {
            color: var(--text-soft);
            font-size: 0.85rem;
            margin-top: 15px;
            position: relative;
        }

        /* 买入提醒状态 */
        .alert-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 15px;
            position: relative;
        }

        .alert-badge.waiting {
            background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
            color: #2E7D32;
            border: 1px solid #A5D6A7;
        }

        .alert-badge.hit {
            background: linear-gradient(135deg, #FFEBEE, #FFCDD2);
            color: #C62828;
            border: 2px solid #EF5350;
            animation: pulse 1.5s infinite;
            font-weight: 700;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 83, 80, 0.4); }
            50% { box-shadow: 0 0 0 15px rgba(239, 83, 80, 0); }
        }

        /* 输入区域 */
        .input-section {
            display: grid;
            gap: 20px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title .icon {
            font-size: 1.3rem;
        }

        .input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .input-wrapper {
            flex: 1;
            min-width: 150px;
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(255, 183, 77, 0.3);
            border-radius: 16px;
            font-size: 1rem;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-dark);
            transition: all 0.3s ease;
            outline: none;
        }

        input::placeholder {
            color: #BCAAA4;
        }

        input:focus {
            border-color: var(--gold-main);

        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-main));
            color: white;
            box-shadow: 0 4px 15px var(--shadow-gold);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow-gold);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--pink-light), var(--pink-main));
            color: white;
            box-shadow: 0 4px 15px var(--shadow-pink);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow-pink);
        }

        .btn-outline {
            background: transparent;
            color: var(--gold-dark);
            border: 2px solid var(--gold-main);
        }

        .btn-outline:hover {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-main));
            color: white;
        }

        /* 查询链接 */
        .query-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--pink-main);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 10px 16px;
            background: rgba(255, 105, 180, 0.1);
            border-radius: 12px;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .query-link:hover {
            background: rgba(255, 105, 180, 0.2);
            transform: translateX(4px);
        }

        /* 目标价格区域 */
        .target-price-section {
            background: linear-gradient(135deg, rgba(255, 248, 225, 0.9), rgba(255, 228, 225, 0.9));
        }

        /* 图表区域 */
        .chart-container {
            width: 100%;
            min-height: 400px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.5);
        }

        /* 历史记录列表 */
        .history-list {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .history-list::-webkit-scrollbar {
            width: 6px;
        }

        .history-list::-webkit-scrollbar-track {
            background: rgba(255, 183, 77, 0.1);
            border-radius: 3px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--gold-light), var(--pink-light));
            border-radius: 3px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateX(4px);
        }

        .history-date {
            color: var(--text-soft);
            font-size: 0.9rem;
        }

        .history-price {
            font-weight: 600;
            color: var(--gold-dark);
            font-size: 1.05rem;
        }

        .history-price.high {
            color: #E53935;
        }

        .history-price.low {
            color: #43A047;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #EF9A9A;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .delete-btn:hover {
            background: rgba(239, 83, 80, 0.1);
            color: #E53935;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-soft);
        }

        .empty-state .emoji {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
        }

        /* 两栏布局 */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 25px;
            color: var(--text-soft);
            font-size: 0.85rem;
        }

        .footer .heart {
            color: var(--pink-main);
            animation: heartbeat 1s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* 提醒弹窗 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
            padding: 18px 30px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 10px 40px rgba(255, 165, 0, 0.4);
            z-index: 1000;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .header h1 {
                font-size: 1.7rem;
            }

            .current-price {
                font-size: 2.5rem;
            }

            .two-col {
                grid-template-columns: 1fr;
            }

            .input-group {
                flex-direction: column;
            }

            .card {
                padding: 20px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1><span class="sparkle">✨</span> 小金子盯盘助手 <span class="sparkle">✨</span></h1>
            <p class="subtitle">帮小姐姐们在最合适的时机入手黄金 💕</p>
        </div>

        <!-- 当前价格卡片 -->
        <div class="card price-display" id="priceCard">
            <div class="price-label">💰 当前黄金价格</div>
            <div class="current-price" id="currentPriceDisplay">--<span class="price-unit">元/克</span></div>
            <div class="price-update-time" id="updateTime">还没有记录价格哦，快去查询吧~</div>
            <div class="alert-badge waiting" id="alertBadge">🎯 等待设置目标价格</div>
        </div>

        <!-- 价格录入区域 -->
        <div class="card">
            <div class="section-title">
                <span class="icon">📝</span>
                录入今日金价
            </div>
            <a href="https://www.baidu.com/s?wd=今日黄金价格" target="_blank" class="query-link">
                🔍 点击跳转到百度查询最新金价 →
            </a>
            <div class="input-group">
                <div class="input-wrapper">
                    <input type="number" id="priceInput" placeholder="输入今日金价（元/克）" step="0.01">
                </div>
                <button class="btn btn-primary" onclick="addPrice()">
                    ✅ 添加记录
                </button>
            </div>
        </div>

        <!-- 目标价格设置 -->
        <div class="card target-price-section">
            <div class="section-title">
                <span class="icon">🎯</span>
                我的心理价位
            </div>
            <p style="color: var(--text-soft); font-size: 0.9rem; margin-bottom: 15px;">
                设置你期望买入的价格，当金价达到或低于这个价格时，会提醒你哦~
            </p>
            <div class="input-group">
                <div class="input-wrapper">
                    <input type="number" id="targetPriceInput" placeholder="输入目标买入价（元/克）" step="0.01">
                </div>
                <button class="btn btn-secondary" onclick="setTargetPrice()">
                    💖 设置提醒
                </button>
                <button class="btn btn-outline" onclick="clearTargetPrice()">
                    🔄 清除
                </button>
            </div>
        </div>

        <!-- 价格走势图 -->
        <div class="card">
            <div class="section-title">
                <span class="icon">📈</span>
                黄金价格走势
            </div>
            <figure class="chart-figure">
                <div id="priceChart" class="chart-container"></div>
            </figure>
        </div>

        <!-- 历史记录 -->
        <div class="two-col">
            <div class="card">
                <div class="section-title">
                    <span class="icon">📋</span>
                    历史记录
                </div>
                <div class="history-list" id="historyList">
                    <div class="empty-state">
                        <span class="emoji">📭</span>
                        <p>还没有价格记录呢</p>
                        <p style="font-size: 0.85rem; margin-top: 8px;">添加第一条记录开始追踪吧~</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="section-title">
                    <span class="icon">📊</span>
                    价格统计
                </div>
                <div id="statsContainer" style="display: grid; gap: 15px;">
                    <div class="empty-state" style="padding: 20px;">
                        <span class="emoji">💫</span>
                        <p>添加记录后查看统计</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            <p>用 <span class="heart">❤️</span> 制作 · 数据保存在本地浏览器</p>
            <p style="margin-top: 8px; font-size: 0.8rem;">💡 小提示：每天下午2点记得查看金价更新哦~</p>
        </div>
    </div>

    <!-- 提醒弹窗 -->
    <div class="toast" id="toast"></div>

    <!-- ECharts库 -->
    <script src="./_shared/js/echarts.min.js"></script>
    <script src="assets/charts.js"></script>
</body>
</html>
