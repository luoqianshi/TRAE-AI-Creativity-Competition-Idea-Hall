<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>字里行间 · 沉浸式词汇阅读</title>
  <meta name="description" content="把高考英语词汇融入霸总搞笑小说的趣味背单词网页阅读器" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    /* =========================================================
       Design tokens —— 严格遵循 claude-DESIGN.md
       ========================================================= */
    :root {
      --color-primary: #cc785c;
      --color-primary-active: #a9583e;
      --color-primary-soft: rgba(204, 120, 92, 0.12);
      --color-primary-softer: rgba(204, 120, 92, 0.18);
      --color-primary-disabled: #e6dfd8;
      --color-ink: #141413;
      --color-body: #3d3d3a;
      --color-body-strong: #252523;
      --color-muted: #6c6a64;
      --color-muted-soft: #8e8b82;
      --color-hairline: #e6dfd8;
      --color-hairline-soft: #ebe6df;
      --color-canvas: #faf9f5;
      --color-surface-soft: #f5f0e8;
      --color-surface-card: #efe9de;
      --color-surface-cream-strong: #e8e0d2;
      --color-surface-dark: #181715;
      --color-on-primary: #ffffff;

      --font-serif: "Cormorant Garamond", "Tiempos Headline", "EB Garamond", Garamond, "Times New Roman", serif;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-pill: 9999px;

      --space-xxs: 4px;
      --space-xs: 8px;
      --space-sm: 12px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-xxl: 48px;

      --shadow-popup: 0 12px 32px rgba(20, 20, 19, 0.16), 0 2px 6px rgba(20, 20, 19, 0.06);
      --transition: 200ms ease;
      --topbar-h: 64px;
      --progress-h: 2px;
      --footer-h: 81px;
    }

    /* =========================================================
       Reset & base
       ========================================================= */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      color: var(--color-body);
      background: var(--color-canvas);
      line-height: 1.55;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; }
    ul { list-style: none; }
    :focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
      border-radius: 3px;
    }

    /* =========================================================
       Topbar
       ========================================================= */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-hairline);
    }
    .topbar-inner {
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-xl);
      max-width: 1440px;
      margin: 0 auto;
      gap: var(--space-md);
    }
    .wordmark {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 500;
      color: var(--color-ink);
      letter-spacing: -0.5px;
    }
    .wordmark .mark {
      width: 18px;
      height: 18px;
      color: var(--color-ink);
      flex-shrink: 0;
    }
    .wordmark .mark-divider {
      width: 1px;
      height: 18px;
      background: var(--color-hairline);
      margin: 0 var(--space-xxs);
    }
    .wordmark-sub {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--color-muted-soft);
    }
    .progress-info {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      color: var(--color-muted);
      letter-spacing: 0.5px;
      flex: 1;
      text-align: center;
    }
    .progress-info strong {
      color: var(--color-ink);
      font-weight: 600;
    }
    .progress-info .sep {
      color: var(--color-muted-soft);
      margin: 0 var(--space-xs);
    }
    .btn-primary {
      background: var(--color-primary);
      color: var(--color-on-primary);
      border: none;
      padding: 0 18px;
      height: 38px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--transition);
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
    }
    .btn-primary:hover { background: var(--color-primary-active); }

    .progress-bar {
      height: var(--progress-h);
      background: var(--color-hairline-soft);
      position: relative;
      overflow: hidden;
    }
    .progress-fill {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      background: var(--color-primary);
      transition: width 500ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* =========================================================
       Layout — grid: shelf | reader-vocab
       reader-vocab is the ONLY scroll container for content area,
       so vocab column scrolls in sync with text column naturally.
       ========================================================= */
    .layout {
      position: fixed;
      top: calc(var(--topbar-h) + var(--progress-h));
      left: 0; right: 0;
      bottom: var(--footer-h);
      display: grid;
      grid-template-columns: 220px 1fr;
      max-width: 1440px;
      margin: 0 auto;
      overflow: hidden;
    }

    /* =========================================================
       Left: shelf (fixed, own scroll if needed)
       ========================================================= */
    .shelf {
      padding: var(--space-xxl) var(--space-lg);
      border-right: 1px solid var(--color-hairline);
      background: var(--color-canvas);
      overflow-y: auto;
      height: 100%;
    }
    .shelf-title {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--color-muted-soft);
      margin-bottom: var(--space-lg);
      padding-left: var(--space-xxs);
    }
    .shelf-books {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    .book-spine {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg) var(--space-md);
      background: var(--color-surface-card);
      border-radius: var(--radius-md);
      border: 2px solid transparent;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      writing-mode: vertical-rl;
      text-orientation: upright;
      min-height: 180px;
      box-shadow: inset 0 0 0 1px rgba(20, 20, 19, 0.04);
    }
    .book-spine::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 60%;
      background: var(--color-hairline);
      border-radius: var(--radius-pill);
      opacity: 0.6;
    }
    .book-spine:hover {
      background: var(--color-surface-cream-strong);
      transform: translateY(-2px);
    }
    .book-spine.active {
      background: var(--color-surface-cream-strong);
      border-color: var(--color-primary);
    }
    .book-spine.active::before {
      background: var(--color-primary);
      opacity: 1;
    }
    .book-spine-text {
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 500;
      color: var(--color-ink);
      letter-spacing: 6px;
    }
    .book-spine.active .book-spine-text {
      color: var(--color-primary-active);
    }
    .book-spine-num {
      position: absolute;
      top: var(--space-xs);
      right: var(--space-xs);
      writing-mode: horizontal-tb;
      font-family: var(--font-serif);
      font-size: 13px;
      font-weight: 500;
      color: var(--color-muted-soft);
    }
    .shelf-footer {
      margin-top: var(--space-xl);
      padding-top: var(--space-md);
      border-top: 1px solid var(--color-hairline-soft);
      font-family: var(--font-sans);
      font-size: 11px;
      color: var(--color-muted-soft);
      line-height: 1.5;
      padding-left: var(--space-xxs);
    }

    /* =========================================================
       Reader + Vocab shared scroll container
       ========================================================= */
    .reader-vocab {
      overflow-y: auto;
      height: 100%;
      scroll-behavior: smooth;
    }
    .reader-vocab-inner {
      display: grid;
      grid-template-columns: 1fr 320px;
      align-items: start;
    }

    /* Reader column */
    .reader-col {
      padding: var(--space-xxl) var(--space-xl);
    }
    .reader-inner {
      max-width: 680px;
      margin: 0 auto;
    }
    .chapter-eyebrow {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }
    .chapter-title {
      font-family: var(--font-serif);
      font-size: 38px;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.6px;
      color: var(--color-ink);
      margin-bottom: var(--space-md);
    }
    .chapter-title .num {
      color: var(--color-muted-soft);
      font-weight: 400;
    }
    .chapter-meta {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding-bottom: var(--space-lg);
      margin-bottom: var(--space-xl);
      border-bottom: 1px solid var(--color-hairline);
      flex-wrap: wrap;
    }
    .meta-item {
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--color-muted);
      letter-spacing: 0.2px;
    }
    .meta-item.coral { color: var(--color-primary); font-weight: 500; }
    .meta-divider {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--color-muted-soft);
      opacity: 0.6;
    }
    .chapter-body {
      font-family: var(--font-sans);
      font-size: 17px;
      line-height: 1.85;
      color: var(--color-body);
    }
    .chapter-body p {
      margin-bottom: var(--space-lg);
      text-indent: 2em;
    }
    .chapter-body p.dialogue {
      text-indent: 0;
      padding: var(--space-sm) var(--space-lg);
      margin-left: var(--space-xs);
      border-left: 2px solid var(--color-primary);
      background: var(--color-surface-soft);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--color-body-strong);
      font-style: italic;
    }
    /* Word: tight inline highlight — no extra horizontal gap */
    .word {
      color: var(--color-primary);
      cursor: pointer;
      font-weight: 500;
      transition: background var(--transition), border-color var(--transition);
      border-bottom: 1px solid transparent;
      padding: 0 1px;
      border-radius: 2px;
      font-style: normal;
    }
    .word:hover {
      background: var(--color-primary-soft);
      border-bottom-color: var(--color-primary);
    }
    .word.word-active {
      background: var(--color-primary-softer);
      border-bottom: 1px solid var(--color-primary);
    }
    .chapter-end {
      text-align: center;
      margin-top: var(--space-xxl);
      padding-top: var(--space-lg);
      font-family: var(--font-serif);
      color: var(--color-muted-soft);
      font-size: 18px;
      letter-spacing: 6px;
    }

    /* Vocab column */
    .vocab-col {
      background: var(--color-canvas);
      border-left: 1px solid var(--color-hairline);
      position: relative;
    }
    .vocab-header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--color-surface-card);
      padding: var(--space-xxl) var(--space-lg) var(--space-md);
      border-bottom: 1px solid var(--color-hairline);
    }
    .vocab-eyebrow {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: var(--space-xxs);
    }
    .vocab-count {
      font-family: var(--font-serif);
      font-size: 24px;
      color: var(--color-ink);
      font-weight: 500;
      line-height: 1;
    }
    .vocab-count span {
      color: var(--color-muted-soft);
      font-size: 14px;
      font-family: var(--font-sans);
      margin-left: var(--space-xxs);
    }
    /* word-list acts as the relative container for absolutely-positioned items */
    .word-list {
      position: relative;
      padding: 0 var(--space-lg);
    }
    .word-item {
      position: absolute;
      left: var(--space-lg);
      right: var(--space-lg);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-md);
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
      background: transparent;
    }
    .word-item:hover,
    .word-item.highlighted {
      background: var(--color-surface-cream-strong);
      border-left-color: var(--color-primary);
    }
    .word-item-head {
      display: flex;
      align-items: baseline;
      gap: var(--space-xs);
      margin-bottom: 2px;
      flex-wrap: wrap;
    }
    .word-item-word {
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 600;
      color: var(--color-primary);
      letter-spacing: 0.1px;
    }
    .word-item-pos {
      font-family: var(--font-sans);
      font-size: 11px;
      color: var(--color-muted-soft);
      font-style: italic;
      letter-spacing: 0.2px;
    }
    .word-item-meaning {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--color-body);
      line-height: 1.5;
    }

    /* =========================================================
       Footer nav
       ========================================================= */
    .footer-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 50;
      background: var(--color-canvas);
      border-top: 1px solid var(--color-hairline);
      padding: var(--space-lg) var(--space-xl);
      height: var(--footer-h);
      display: flex;
      align-items: center;
    }
    .footer-inner {
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-lg);
    }
    .btn-secondary {
      background: var(--color-canvas);
      color: var(--color-ink);
      border: 1px solid var(--color-hairline);
      padding: 0 18px;
      height: 40px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      min-width: 110px;
      justify-content: center;
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--color-surface-card);
      border-color: var(--color-muted-soft);
    }
    .btn-secondary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .footer-center {
      text-align: center;
      flex: 1;
    }
    .footer-center-eyebrow {
      font-family: var(--font-sans);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--color-muted-soft);
      margin-bottom: 2px;
    }
    .footer-center-title {
      font-family: var(--font-serif);
      font-size: 16px;
      color: var(--color-ink);
      font-weight: 500;
    }

    /* =========================================================
       Popup
       ========================================================= */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 19, 0.32);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity var(--transition), visibility var(--transition);
      padding: var(--space-lg);
    }
    .popup-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .popup-card {
      background: var(--color-surface-card);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-popup);
      position: relative;
      transform: translateY(12px) scale(0.98);
      transition: transform var(--transition);
    }
    .popup-overlay.show .popup-card {
      transform: translateY(0) scale(1);
    }
    .popup-close {
      position: absolute;
      top: var(--space-md);
      right: var(--space-md);
      background: transparent;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--color-muted);
      font-size: 22px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }
    .popup-close:hover {
      background: var(--color-surface-cream-strong);
      color: var(--color-ink);
    }
    .popup-eyebrow {
      font-family: var(--font-sans);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--color-muted-soft);
      margin-bottom: var(--space-xs);
    }
    .popup-word {
      font-family: var(--font-serif);
      font-size: 40px;
      font-weight: 500;
      color: var(--color-ink);
      letter-spacing: -0.6px;
      line-height: 1.1;
      margin-bottom: var(--space-xxs);
    }
    .popup-phonetic {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--color-muted);
      margin-bottom: var(--space-md);
    }
    .popup-pos {
      display: inline-block;
      background: var(--color-surface-cream-strong);
      color: var(--color-ink);
      padding: 3px 12px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.3px;
      margin-bottom: var(--space-lg);
    }
    .popup-meaning {
      font-family: var(--font-sans);
      font-size: 16px;
      color: var(--color-body-strong);
      line-height: 1.5;
      margin-bottom: var(--space-lg);
      padding-bottom: var(--space-lg);
      border-bottom: 1px solid var(--color-hairline);
    }
    .popup-example-label {
      font-family: var(--font-sans);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--color-muted-soft);
      margin-bottom: var(--space-xs);
    }
    .popup-example {
      font-family: var(--font-serif);
      font-size: 17px;
      color: var(--color-ink);
      font-style: italic;
      line-height: 1.5;
    }

    /* =========================================================
       Mobile shelf (horizontal scroller)
       ========================================================= */
    .shelf-mobile {
      display: none;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-xl);
      border-bottom: 1px solid var(--color-hairline);
      background: var(--color-canvas);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .book-spine-mobile {
      flex-shrink: 0;
      padding: var(--space-xs) var(--space-md);
      background: var(--color-surface-card);
      border-radius: var(--radius-md);
      border: 1.5px solid transparent;
      cursor: pointer;
      font-family: var(--font-serif);
      font-size: 14px;
      color: var(--color-ink);
      transition: all var(--transition);
      white-space: nowrap;
    }
    .book-spine-mobile:hover {
      background: var(--color-surface-cream-strong);
    }
    .book-spine-mobile.active {
      background: var(--color-surface-cream-strong);
      border-color: var(--color-primary);
      color: var(--color-primary-active);
    }

    /* =========================================================
       Responsive
       ========================================================= */
    @media (max-width: 1023px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .shelf { display: none; }
      .shelf-mobile { display: flex; }
      .topbar-inner { padding: 0 var(--space-lg); }
      .reader-vocab-inner {
        grid-template-columns: 1fr 280px;
      }
      .reader-col {
        padding: var(--space-xl) var(--space-lg);
      }
      .chapter-title { font-size: 32px; }
    }

    @media (max-width: 767px) {
      .reader-vocab-inner {
        grid-template-columns: 1fr;
      }
      .vocab-col {
        border-left: none;
        border-top: 1px solid var(--color-hairline);
      }
      .vocab-header {
        position: static;
        background: var(--color-canvas);
        padding: var(--space-lg) var(--space-md) var(--space-sm);
      }
      .word-list {
        padding: 0 var(--space-md) var(--space-lg);
      }
      .word-item {
        position: static !important;
        left: auto;
        right: auto;
        margin-bottom: var(--space-xs);
      }
      .reader-col {
        padding: var(--space-lg) var(--space-md);
      }
      .chapter-title { font-size: 28px; }
      .topbar-inner {
        padding: 0 var(--space-md);
      }
      .progress-info { display: none; }
      .wordmark-sub { display: none; }
      .footer-inner {
        flex-direction: column;
        gap: var(--space-md);
        padding: 0 var(--space-md);
      }
      .btn-secondary { width: 100%; }
      .shelf-mobile { padding: var(--space-md); }
    }
  </style>

          { word: "confess", phonetic: "/kənˈfes/", pos: "v.", meaning: "坦白，承认", example: "He confessed to the crime." },
          { word: "misunderstand", phonetic: "/ˌmɪsʌndəˈstænd/", pos: "v.", meaning: "误会，误解", example: "I misunderstood your intentions." },
          { word: "apologize", phonetic: "/əˈpɒlədʒaɪz/", pos: "v.", meaning: "道歉", example: "He apologized for being late." },
          { word: "arrogant", phonetic: "/ˈærəɡənt/", pos: "adj.", meaning: "傲慢的，自大的", example: "His arrogant attitude annoyed everyone." },
          { word: "genuine", phonetic: "/ˈdʒenjuɪn/", pos: "adj.", meaning: "真正的，真诚的", example: "She showed genuine concern." },
          { word: "promise", phonetic: "/ˈprɒmɪs/", pos: "n./v.", meaning: "承诺，答应", example: "I promise to help you." },
          { word: "laugh", phonetic: "/lɑːf/", pos: "v./n.", meaning: "笑，大笑", example: "We all laughed at the joke." },
          { word: "ridiculous", phonetic: "/rɪˈdɪkjələs/", pos: "adj.", meaning: "荒谬的，可笑的", example: "That's a ridiculous idea." },
          { word: "conscience", phonetic: "/ˈkɒnʃəns/", pos: "n.", meaning: "良心，道德感", example: "His conscience told him to confess." },
          { word: "forgive", phonetic: "/fəˈɡɪv/", pos: "v.", meaning: "原谅，宽恕", example: "I forgive you for what you said." },
          { word: "innocent", phonetic: "/ˈɪnəsnt/", pos: "adj.", meaning: "无辜的，天真的", example: "The innocent boy knew nothing." }
        ]
      }
    ];

    let currentChapter = 0;

    /* =========================================================
       Render: wrap embedded English words with <span class="word">
       Long words matched first to avoid substring collisions.
       ========================================================= */
    function renderParagraphContent(text) {
      const chapter = chapters[currentChapter];
      let html = text;
      const sortedWords = [...chapter.words].sort((a, b) => b.word.length - a.word.length);
      const placeholders = [];
      sortedWords.forEach((w, i) => {
        const re = new RegExp("\\b" + w.word + "\\b", "g");
        html = html.replace(re, () => {
          const ph = "\u0001" + i + "\u0001";
          placeholders.push({ ph, word: w.word });
          return ph;
        });
      });
      placeholders.forEach(({ ph, word }) => {
        html = html.split(ph).join(
          '<span class="word" data-word="' + word + '" role="button" tabindex="0">' + word + "</span>"
        );
      });
      return html;
    }

    /* =========================================================
       Render: shelf (desktop + mobile)
       ========================================================= */
    function renderShelf() {
      const shelf = document.getElementById("shelf");
      const shelfMobile = document.getElementById("shelfMobile");

      const desktopHtml =
        '<div class="shelf-title">书目 · 共 ' + chapters.length + ' 章</div>' +
        '<div class="shelf-books">' +
        chapters
          .map(
            (ch, i) =>
              '<div class="book-spine ' +
              (i === 0 ? "active" : "") +
              '" data-idx="' +
              i +
              '" role="button" tabindex="0" title="第' +
              (i + 1) +
              "章 · " +
              ch.title +
              '">' +
              '<span class="book-spine-num">' +
              String(i + 1).padStart(2, "0") +
              "</span>" +
              '<span class="book-spine-text">' +
              ch.bookSpine +
              "</span>" +
              "</div>"
          )
          .join("") +
        "</div>" +
        '<div class="shelf-footer">点击书脊切换章节<br/>悬停正文单词联动词卡</div>';
      shelf.innerHTML = desktopHtml;

      const mobileHtml = chapters
        .map(
          (ch, i) =>
            '<div class="book-spine-mobile ' +
            (i === 0 ? "active" : "") +
            '" data-idx="' +
            i +
            '" role="button" tabindex="0">第' +
            (i + 1) +
            "卷 · " +
            ch.bookSpine +
            "</div>"
        )
        .join("");
      shelfMobile.innerHTML = mobileHtml;

      document
        .querySelectorAll(".book-spine, .book-spine-mobile")
        .forEach((el) => {
          el.addEventListener("click", () => {
            const idx = parseInt(el.dataset.idx, 10);
            if (idx !== currentChapter) renderChapter(idx);
          });
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              const idx = parseInt(el.dataset.idx, 10);
              if (idx !== currentChapter) renderChapter(idx);
            }
          });
        });
    }

    /* =========================================================
       Render: chapter content (center + right + topbar + footer)
       ========================================================= */
    function renderChapter(idx) {
      currentChapter = idx;
      const ch = chapters[idx];

      // topbar progress
      document.getElementById("curChapterNum").textContent = idx + 1;
      document.getElementById("totalChapterNum").textContent = chapters.length;
      document.getElementById("progressFill").style.width =
        ((idx + 1) / chapters.length) * 100 + "%";

      // shelf active state
      document.querySelectorAll(".book-spine").forEach((el, i) => {
        el.classList.toggle("active", i === idx);
      });
      document.querySelectorAll(".book-spine-mobile").forEach((el, i) => {
        el.classList.toggle("active", i === idx);
      });

      // center reader
      const readerInner = document.getElementById("readerInner");
      const paragraphsHtml = ch.paragraphs
        .map((p) => {
          if (typeof p === "string") {
            return "<p>" + renderParagraphContent(p) + "</p>";
          } else if (p.dialogue) {
            return (
              '<p class="dialogue">' + renderParagraphContent(p.dialogue) + "</p>"
            );
          }
          return "";
        })
        .join("");
      readerInner.innerHTML =
        '<div class="chapter-eyebrow">CHAPTER ' +
        String(idx + 1).padStart(2, "0") +
        "</div>" +
        '<h1 class="chapter-title"><span class="num">第' +
        (idx + 1) +
        "章</span> · " +
        ch.title +
        "</h1>" +
        '<div class="chapter-meta">' +
        '<span class="meta-item coral">本章 ' +
        ch.words.length +
        " 词汇</span>" +
        '<span class="meta-divider"></span>' +
        '<span class="meta-item">约 ' +
        ch.paragraphs.length +
        " 段</span>" +
        '<span class="meta-divider"></span>' +
        '<span class="meta-item">字里行间 · 沉浸式阅读</span>' +
        "</div>" +
        '<div class="chapter-body">' +
        paragraphsHtml +
        "</div>" +
        '<div class="chapter-end">— 卷 终 —</div>';

      // reset scroll
      const readerVocab = document.getElementById("readerVocab");
      readerVocab.scrollTo({ top: 0, behavior: "auto" });

      // right vocab header + word list (items rendered static first, then absolute-positioned by alignVocab)
      const vocabHeader = document.getElementById("vocabHeader");
      vocabHeader.innerHTML =
        '<div class="vocab-eyebrow">本章词汇</div>' +
        '<div class="vocab-count">' +
        ch.words.length +
        " <span>words</span></div>";

      const wordList = document.getElementById("wordList");
      wordList.innerHTML =
        "<ul>" +
        ch.words
          .map(
            (w) =>
              '<li class="word-item" data-word="' +
              w.word +
              '" tabindex="0">' +
              '<div class="word-item-head">' +
              '<span class="word-item-word">' +
              w.word +
              "</span>" +
              '<span class="word-item-pos">' +
              w.pos +
              "</span>" +
              "</div>" +
              '<div class="word-item-meaning">' +
              w.meaning +
              "</div>" +
              "</li>"
          )
          .join("") +
        "</ul>";

      // footer
      document.getElementById("footerChapterTitle").textContent =
        "第" + (idx + 1) + "章 · " + ch.title;
      document.getElementById("prevBtn").disabled = idx === 0;
      document.getElementById("nextBtn").disabled = idx === chapters.length - 1;

      // align vocab items to text positions (rAF twice to ensure fonts/layout settled)
      requestAnimationFrame(() => {
        requestAnimationFrame(alignVocabToText);
      });

      bindWordInteractions();
    }

    /* =========================================================
       Align each vocab item to the vertical position where its
       word first appears in the chapter body. If two items would
       overlap, the later one is pushed down so they stack vertically.
       ========================================================= */
    function alignVocabToText() {
      const wordList = document.getElementById("wordList");
      if (!wordList) return;
      const isMobile = window.matchMedia("(max-width: 767px)").matches;
      const items = wordList.querySelectorAll(".word-item");
      if (!items.length) return;

      // Mobile: fall back to static stack
      if (isMobile) {
        items.forEach((item) => {
          item.style.position = "static";
          item.style.top = "";
          item.style.left = "";
          item.style.right = "";
        });
        wordList.style.height = "auto";
        return;
      }

      const words = chapters[currentChapter].words;

      // 1. Reset to static so we can measure natural heights
      items.forEach((item) => {
        item.style.position = "static";
        item.style.top = "";
      });
      const itemHeights = Array.from(items).map((item) => item.offsetHeight);

      // 2. Find each word's first occurrence Y, relative to wordList's top
      const wordListTop = wordList.getBoundingClientRect().top;
      const positions = words.map((w) => {
        const el = document.querySelector(
          '.chapter-body .word[data-word="' + w.word + '"]'
        );
        if (!el) return { top: 0 };
        const rect = el.getBoundingClientRect();
        return { top: rect.top - wordListTop };
      });

      // 3. Position absolutely, push down if overlapping previous
      const GAP = 12;
      let lastBottom = -GAP;
      items.forEach((item, i) => {
        let top = positions[i].top;
        if (top < lastBottom + GAP) {
          top = lastBottom + GAP;
        }
        item.style.position = "absolute";
        item.style.top = top + "px";
        lastBottom = top + itemHeights[i];
      });

      // 4. Set wordList height so the scroll region matches the text column
      const chapterBody = document.querySelector(".chapter-body");
      const chapterEnd = document.querySelector(".chapter-end");
      let textBottom = 0;
      if (chapterEnd) {
        textBottom =
          chapterEnd.getBoundingClientRect().bottom - wordListTop + 32;
      } else if (chapterBody) {
        textBottom =
          chapterBody.getBoundingClientRect().bottom - wordListTop + 32;
      }
      const contentHeight = Math.max(textBottom, lastBottom + 64);
      wordList.style.height = contentHeight + "px";
    }

    /* =========================================================
       Interactions: hover/click linkage between text and vocab
       ========================================================= */
    function bindWordInteractions() {
      // inline word -> vocab highlight + popup
      document.querySelectorAll(".chapter-body .word").forEach((el) => {
        el.addEventListener("mouseenter", () => {
          const w = el.dataset.word;
          document
            .querySelectorAll('.word-item[data-word="' + w + '"]')
            .forEach((item) => item.classList.add("highlighted"));
        });
        el.addEventListener("mouseleave", () => {
          const w = el.dataset.word;
          document
            .querySelectorAll('.word-item[data-word="' + w + '"]')
            .forEach((item) => item.classList.remove("highlighted"));
        });
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          showPopup(el.dataset.word);
        });
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            showPopup(el.dataset.word);
          }
        });
      });

      // vocab item -> text highlight + popup + scroll into view
      document.querySelectorAll(".word-item").forEach((el) => {
        el.addEventListener("mouseenter", () => {
          const w = el.dataset.word;
          document
            .querySelectorAll('.chapter-body .word[data-word="' + w + '"]')
            .forEach((item) => item.classList.add("word-active"));
          const first = document.querySelector(
            '.chapter-body .word[data-word="' + w + '"]'
          );
          if (first) {
            const readerVocab = document.getElementById("readerVocab");
            const rect = first.getBoundingClientRect();
            const containerRect = readerVocab.getBoundingClientRect();
            const offset =
              rect.top - containerRect.top + readerVocab.scrollTop -
              containerRect.height / 2 +
              rect.height / 2;
            readerVocab.scrollTo({ top: offset, behavior: "smooth" });
          }
        });
        el.addEventListener("mouseleave", () => {
          const w = el.dataset.word;
          document
            .querySelectorAll('.chapter-body .word[data-word="' + w + '"]')
            .forEach((item) => item.classList.remove("word-active"));
        });
        el.addEventListener("click", () => {
          showPopup(el.dataset.word);
        });
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            showPopup(el.dataset.word);
          }
        });
      });
    }

    /* =========================================================
       Popup: word detail card
       ========================================================= */
    function showPopup(word) {
      const ch = chapters[currentChapter];
      const w = ch.words.find((x) => x.word === word);
      if (!w) return;
      document.getElementById("popupWord").textContent = w.word;
      const phoneticEl = document.getElementById("popupPhonetic");
      if (w.phonetic) {
        phoneticEl.textContent = w.phonetic;
        phoneticEl.style.display = "";
      } else {
        phoneticEl.style.display = "none";
      }
      document.getElementById("popupPos").textContent = w.pos;
      document.getElementById("popupMeaning").textContent = w.meaning;
      document.getElementById("popupExample").textContent = w.example;
      document.getElementById("popupOverlay").classList.add("show");
    }

    function hidePopup() {
      document.getElementById("popupOverlay").classList.remove("show");
    }

    document.getElementById("popupClose").addEventListener("click", hidePopup);
    document
      .getElementById("popupOverlay")
      .addEventListener("click", (e) => {
        if (e.target.id === "popupOverlay") hidePopup();
      });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") hidePopup();
    });

    /* =========================================================
       Chapter nav
       ========================================================= */
    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentChapter > 0) renderChapter(currentChapter - 1);
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      if (currentChapter < chapters.length - 1)
        renderChapter(currentChapter + 1);
    });

    /* =========================================================
       Keyboard shortcuts for chapter nav
       ========================================================= */
    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (document.getElementById("popupOverlay").classList.contains("show")) return;
      if (e.key === "ArrowLeft" && currentChapter > 0) {
        renderChapter(currentChapter - 1);
      } else if (
        e.key === "ArrowRight" &&
        currentChapter < chapters.length - 1
      ) {
        renderChapter(currentChapter + 1);
      }
    });

    /* =========================================================
       Re-align on resize and after fonts load
       ========================================================= */
    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(alignVocabToText, 100);
    });

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        requestAnimationFrame(alignVocabToText);
      });
    }

    /* =========================================================
       Init
       ========================================================= */
    renderShelf();
    renderChapter(0);
    // Final re-align after everything (images, fonts, layout) settles
    window.addEventListener("load", () => {
      requestAnimationFrame(alignVocabToText);
    });
  </script>
</body>
</html>
