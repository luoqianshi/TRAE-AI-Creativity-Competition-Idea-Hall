<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>这顿必须吃 - AI 饮食转盘</title>
    <style>
        /* ===================== 全局样式 ===================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #FFF5F5 0%, #FFF0E6 40%, #F0FFF4 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        /* ===================== 头部 ===================== */
        header {
            text-align: center;
            padding: 12px 0 8px;
        }

        header h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF6B6B, #FFA94D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
        }

        header p {
            font-size: 14px;
            color: #999;
            margin-top: 4px;
        }

        /* ===================== 主布局 ===================== */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 30px;
            align-items: start;
        }

        /* ===================== 左侧 - 转盘区域 ===================== */
        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .wheel-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        canvas#wheelCanvas {
            width: 100%;
            max-width: 420px;
            height: auto;
            aspect-ratio: 1;
            border-radius: 50%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12), 0 0 0 8px #fff, 0 0 0 10px #f0e0d0;
        }

        /* 指针（三角箭头） */
        .pointer {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 28px;
            color: #FF6B6B;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.25));
            line-height: 1;
            pointer-events: none;
        }

        /* 旋转按钮 */
        #spinBtn {
            padding: 14px 60px;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            letter-spacing: 2px;
        }

        #spinBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.5);
        }

        #spinBtn:active {
            transform: translateY(0);
        }

        #spinBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 结果展示 */
        #result {
            font-size: 28px;
            font-weight: 700;
            color: #FF6B6B;
            min-height: 48px;
            line-height: 48px;
            text-align: center;
            transition: all 0.3s;
            padding: 8px 24px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            min-width: 200px;
        }

        #result .highlight {
            display: inline-block;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ===================== 右侧 - 面板区域 ===================== */
        .panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .panel:not(:last-child) {
            margin-bottom: 16px;
        }

        .panel h3 {
            font-size: 16px;
            font-weight: 700;
            color: #555;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #FFF0E6;
        }

        /* --- 快捷模式按钮 --- */
        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .mode-btn {
            padding: 10px 0;
            border: 2px solid #eee;
            border-radius: 12px;
            background: #fff;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn:hover {
            border-color: #FFA94D;
            color: #FF8E53;
            background: #FFF8F3;
        }

        .mode-btn:active {
            transform: scale(0.96);
        }

        .mode-btn .icon {
            display: block;
            font-size: 20px;
            margin-bottom: 2px;
        }

        /* --- 自定义选项 --- */
        .add-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .add-row input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .add-row input:focus {
            border-color: #FFA94D;
        }

        .add-row button {
            padding: 10px 18px;
            background: linear-gradient(135deg, #FFA94D, #FF8E53);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s;
        }

        .add-row button:hover {
            opacity: 0.85;
        }

        .option-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 140px;
            overflow-y: auto;
            padding: 4px 0;
        }

        .option-list li {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            background: #F5F5F5;
            border-radius: 20px;
            font-size: 13px;
            color: #555;
            transition: background 0.2s;
        }

        .option-list li .del-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: none;
            background: #ddd;
            color: #999;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1;
        }

        .option-list li .del-btn:hover {
            background: #FF6B6B;
            color: #fff;
        }

        .reset-btn {
            margin-top: 8px;
            padding: 6px 16px;
            background: transparent;
            border: 1.5px dashed #ccc;
            border-radius: 8px;
            font-size: 13px;
            color: #999;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            border-color: #FFA94D;
            color: #FF8E53;
        }

        /* --- AI 生成 --- */
        .ai-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ai-form input {
            padding: 10px 14px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .ai-form input:focus {
            border-color: #A29BFE;
        }

        .ai-form .ai-gen-btn {
            padding: 10px;
            background: linear-gradient(135deg, #A29BFE, #6C5CE7);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .ai-form .ai-gen-btn:hover {
            opacity: 0.85;
        }

        .ai-results {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .ai-results .ai-item {
            padding: 6px 12px;
            background: #F3F0FF;
            border-radius: 20px;
            font-size: 13px;
            color: #6C5CE7;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            user-select: none;
        }

        .ai-results .ai-item:hover {
            background: #EDE7FF;
            border-color: #A29BFE;
        }

        .ai-results .ai-item.added {
            background: #E8F5E9;
            color: #4CAF50;
            border-color: #4CAF50;
            cursor: default;
        }

        .ai-hint {
            font-size: 12px;
            color: #aaa;
            margin-top: 6px;
            text-align: center;
        }

        /* ===================== 响应式设计 ===================== */
        @media (max-width: 860px) {
            .container {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            canvas#wheelCanvas {
                max-width: 340px;
            }

            header h1 {
                font-size: 26px;
            }

            #spinBtn {
                padding: 12px 48px;
                font-size: 18px;
            }

            #result {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            canvas#wheelCanvas {
                max-width: 300px;
            }

            header h1 {
                font-size: 22px;
                letter-spacing: 2px;
            }

            #spinBtn {
                padding: 10px 36px;
                font-size: 16px;
            }

            #result {
                font-size: 20px;
                padding: 6px 16px;
            }

            .panel {
                padding: 14px;
            }

            .mode-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ===================== 头部 ===================== -->
    <header>
        <h1>这顿必须吃</h1>
        <p>—— 吃饭选择困难症终结者</p>
    </header>

    <!-- ===================== 主体 ===================== -->
    <div class="container">

        <!-- ===== 左侧：转盘 ===== -->
        <section class="wheel-section">
            <div class="wheel-wrapper">
                <canvas id="wheelCanvas" width="420" height="420"></canvas>

        <!-- ===== 右侧：面板 ===== -->
        <aside>

            <!-- 快捷模式 -->
            <div class="panel">
                <h3>&#x26A1; 快捷模式</h3>
                <div class="mode-grid">
                    <button class="mode-btn" data-mode="casual">

                    </button>

                        <span class="icon">&#x1F37A;</span>放纵一下
                    </button>
                </div>
            </div>

            <div class="panel">
                <h3>&#x270F;&#xFE0F; 自定义选项</h3>

                <div class="ai-hint">点击候选食物可添加到转盘</div>
            </div>

        </aside>
    </div>

    <script>
        /* ================================================================
               这顿必须吃 - 核心 JavaScript

        // ===================== 配置常量 =====================

        /** 默认的 8 个食物选项 */
        const DEFAULT_OPTIONS = [

        /** 转盘色板（8 种基础色，超出部分循环使用） */
        const COLORS = [

            '#81ECEC', '#74B9FF', '#A29BFE', '#FD79A8',
            '#FDCB6E', '#00B894', '#E84393', '#6C5CE7'
        ];

        /** 快捷模式预设 */

            healthy: ['鸡胸肉沙拉', '全麦三明治', '水果酸奶碗', '藜麦饭', '清蒸鱼', '荞麦面', '五谷杂粮', '蔬菜汤'],
            budget: ['兰州拉面', '沙县小吃', '黄焖鸡米饭', '蛋炒饭', '煎饼果子', '肉夹馍', '热干面', '酸辣粉'],
            indulge: ['重庆火锅', '韩式烤肉', '炸鸡啤酒', '芝土披萨', '麻辣小龙虾', '铁板牛排', '部队锅', '冰淇淋'],
        };

        /** AI 饮食推荐池（每条含名称、预算等级、口味、心情） */
        const AI_FOOD_POOL = [
            // ---- 低预算 ----
            { name: '兰州拉面', budget: '低', taste: ['清淡'], mood: ['随便', '饿'] },
            { name: '沙县小吃', budget: '低', taste: ['清淡'], mood: ['随便', '饿'] },
            { name: '黄焖鸡米饭', budget: '低', taste: ['辣', '鲜'], mood: ['饿', '开心'] },
            { name: '蛋炒饭', budget: '低', taste: ['清淡'], mood: ['随便', '饿'] },
            { name: '酸辣粉', budget: '低', taste: ['酸', '辣'], mood: ['饿', '随便'] },
            { name: '热干面', budget: '低', taste: ['鲜'], mood: ['随便', '饿'] },

            { name: '肉夹馍', budget: '低', taste: ['鲜'], mood: ['饿'] },

            { name: '麻辣烫', budget: '中', taste: ['辣', '鲜'], mood: ['饿', '开心'] },
            { name: '米线', budget: '中', taste: ['鲜', '辣'], mood: ['随便', '饿'] },
            { name: '麻辣香锅', budget: '中', taste: ['辣', '鲜'], mood: ['开心', '饿'] },
            { name: '石锅拌饭', budget: '中', taste: ['鲜', '辣'], mood: ['开心', '随便'] },
            { name: '日式拉面', budget: '中', taste: ['鲜'], mood: ['开心', '随便'] },
            { name: '寿司拼盘', budget: '中', taste: ['清淡', '鲜'], mood: ['开心'] },

            { name: '酸菜鱼', budget: '中', taste: ['酸', '辣'], mood: ['开心', '随便'] },
            { name: '水煮鱼', budget: '中', taste: ['辣', '鲜'], mood: ['开心', '饿'] },
            { name: '咖喱饭', budget: '中', taste: ['鲜', '甜'], mood: ['随便', '开心'] },

            { name: '汉堡薯条', budget: '中', taste: ['鲜'], mood: ['开心', '随便'] },
            { name: '砂锅粥', budget: '中', taste: ['清淡', '鲜'], mood: ['随便', '饿'] },
            { name: '生煎包', budget: '中', taste: ['鲜'], mood: ['饿'] },

            { name: '螺蛳粉', budget: '中', taste: ['酸', '辣', '鲜'], mood: ['开心', '随便'] },
            // ---- 高预算 ----
            { name: '重庆火锅', budget: '高', taste: ['辣', '鲜'], mood: ['开心', '饿'] },
            { name: '韩式烤肉', budget: '高', taste: ['鲜', '辣'], mood: ['开心', '饿'] },

            { name: '海鲜大餐', budget: '高', taste: ['清淡', '鲜'], mood: ['开心', '饿'] },

            { name: '椰子鸡', budget: '高', taste: ['清淡', '甜'], mood: ['开心', '随便'] },
            // ---- 甜品饮品 ----
            { name: '奶茶', budget: '低', taste: ['甜'], mood: ['开心', '随便'] },
            { name: '冰激凌', budget: '低', taste: ['甜'], mood: ['开心'] },
            { name: '蛋糕', budget: '中', taste: ['甜'], mood: ['开心'] },
            { name: '双皮奶', budget: '低', taste: ['甜'], mood: ['开心', '随便'] },
            { name: '杨枝甘露', budget: '中', taste: ['甜', '酸'], mood: ['开心'] },
        ];

        /** 口味关键词同义词映射 */
        const TASTE_MAP = {
            '辣': ['辣', '麻辣', '香辣', '辛辣'],
            '清淡': ['清淡', '清', '淡', '不辣'],
            '酸': ['酸', '酸甜', '酸辣'],
            '甜': ['甜', '甜品', '甜蜜'],
            '鲜': ['鲜', '鲜美', '咸']
        };

        // ===================== 状态变量 =====================

        /** 当前转盘选项列表 */
        let options = [...DEFAULT_OPTIONS];

        /** 当前旋转弧度（累加） */
        let currentAngle = 0;

        /** 是否正在旋转中 */
        let isSpinning = false;

        // ===================== DOM 引用 =====================

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultEl = document.getElementById('result');
        const optionList = document.getElementById('optionList');
        const optionInput = document.getElementById('optionInput');
        const addOptionBtn = document.getElementById('addOptionBtn');
        const resetBtn = document.getElementById('resetBtn');
        const aiGenerateBtn = document.getElementById('aiGenerateBtn');
        const aiResults = document.getElementById('aiResults');
        const aiBudget = document.getElementById('aiBudget');
        const aiTaste = document.getElementById('aiTaste');
        const aiMood = document.getElementById('aiMood');
        const aiRestrict = document.getElementById('aiRestrict');

        // 快捷模式按钮
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => applyQuickMode(btn.dataset.mode));
        });

        // ===================== 转盘绘制 =====================

        /**
         * 获取选项对应的颜色（超出色板则循环）
         */
        function getColor(index) {
            return COLORS[index % COLORS.length];
        }

        /**
         * 绘制整个转盘
         */
        function drawWheel() {
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const radius = Math.min(cx, cy) - 12;
            const n = options.length;
            const segAngle = (2 * Math.PI) / n;

            ctx.clearRect(0, 0, w, h);

            // --- 绘制外圈阴影 ---
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, radius + 6, 0, 2 * Math.PI);
            ctx.shadowColor = 'rgba(0,0,0,0.1)';
            ctx.shadowBlur = 20;
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fill();
            ctx.restore();

            // --- 绘制各扇形 ---
            for (let i = 0; i < n; i++) {
                const start = -Math.PI / 2 + i * segAngle + currentAngle;
                const end = start + segAngle;

                // 扇形
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, start, end);
                ctx.closePath();
                ctx.fillStyle = getColor(i);
                ctx.fill();

                // 扇形边线
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // --- 绘制文字 ---
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(start + segAngle / 2);

                // 字号自适应
                const maxWidth = radius * 0.55;
                let fontSize = Math.min(16, Math.max(11, (radius * segAngle * 0.55)));
                fontSize = Math.min(fontSize, 16);
                ctx.font = `bold ${fontSize}px 'Microsoft YaHei', 'PingFang SC', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // 文字阴影（提高可读性）
                ctx.shadowColor = 'rgba(0,0,0,0.35)';
                ctx.shadowBlur = 4;
                ctx.fillStyle = '#fff';

                // 限制文字长度，过长则省略
                let text = options[i];
                if (text.length > 6) {
                    text = text.slice(0, 5) + '…';
                }

                ctx.fillText(text, radius * 0.58, 0);
                ctx.restore();
            }

            // --- 中心圆 ---
            ctx.beginPath();
            ctx.arc(cx, cy, 22, 0, 2 * Math.PI);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.strokeStyle = '#f0e0d0';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 中心小装饰
            ctx.beginPath();
            ctx.arc(cx, cy, 10, 0, 2 * Math.PI);
            ctx.fillStyle = '#FF6B6B';
            ctx.fill();
        }

        // ===================== 转盘旋转 =====================

        /**
         * 计算当前指针（顶部）指向的是第几个选项
         */
        function getSelectedIndex() {
            const n = options.length;
            const segAngle = (2 * Math.PI) / n;
            // 指针在 -PI/2（顶部），换算为索引
            const adjusted = ((2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI));
            return Math.floor(adjusted / segAngle) % n;
        }

        /**
         * 执行旋转动画
         */
        function spinWheel() {
            if (isSpinning) return;
            if (options.length === 0) {
                resultEl.textContent = '请先添加选项！';
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            resultEl.textContent = '转起来啦...';

            // 随机目标：5~8 圈 + 随机偏移
            const fullRotations = (5 + Math.random() * 3) * 2 * Math.PI;
            const randomOffset = Math.random() * 2 * Math.PI;
            const totalSpin = fullRotations + randomOffset;

            const startAngle = currentAngle;
            const targetAngle = startAngle + totalSpin;
            const duration = 3500 + Math.random() * 1000; // 3.5 ~ 4.5 秒
            const startTime = performance.now();

            function animate(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // easeOutCubic：减速效果
                const ease = 1 - Math.pow(1 - progress, 3);

                currentAngle = startAngle + totalSpin * ease;
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    currentAngle = targetAngle;
                    drawWheel();
                    isSpinning = false;
                    spinBtn.disabled = false;
                    showResult();
                }
            }

            requestAnimationFrame(animate);
        }

        /**
         * 显示旋转结果
         */
        function showResult() {
            const idx = getSelectedIndex();
            const selected = options[idx];
            resultEl.innerHTML = `今天就吃：<span class="highlight">${selected}</span> 🎉`;
        }

        // ===================== 选项管理 =====================

        /**
         * 刷新选项列表 UI
         */
        function renderOptionList() {
            optionList.innerHTML = '';
            options.forEach((opt, i) => {
                const li = document.createElement('li');
                li.textContent = opt;
                const delBtn = document.createElement('button');
                delBtn.className = 'del-btn';
                delBtn.textContent = '×';
                delBtn.addEventListener('click', () => removeOption(i));
                li.appendChild(delBtn);
                optionList.appendChild(li);
            });
        }

        /**
         * 添加一个新选项
         */
        function addOption(name) {
            const trimmed = name.trim();
            if (!trimmed) return;
            if (options.includes(trimmed)) {
                alert('该选项已存在！');
                return;
            }
            if (trimmed.length > 20) {
                alert('名称不能超过 20 个字');
                return;
            }
            options.push(trimmed);
            applyChange();
        }

        /**
         * 删除指定索引的选项
         */
        function removeOption(index) {
            if (options.length <= 2) {
                alert('至少保留 2 个选项');
                return;
            }
            options.splice(index, 1);
            applyChange();
        }

        /**
         * 恢复默认选项
         */
        function resetOptions() {
            options = [...DEFAULT_OPTIONS];
            applyChange();
        }

        /**
         * 选项变更后的统一处理
         */
        function applyChange() {
            renderOptionList();
            drawWheel();
            resultEl.textContent = options.length >= 2
                ? '选项已更新，点「开始转」试试'
                : '请至少添加 2 个选项';
        }

        // ===================== 快捷模式 =====================

        /**
         * 应用快捷模式预设
         */
        function applyQuickMode(mode) {
            const preset = QUICK_MODES[mode];
            if (!preset) return;
            options = [...preset];
            applyChange();
            // 提示
            const labels = {
                casual: '随便吃点',
                healthy: '健康一点',
                budget: '省钱模式',
                indulge: '放纵一下'
            };
            resultEl.textContent = `已切换到「${labels[mode] || mode}」模式，转转看！`;
        }

        // ===================== AI 生成功能 =====================

        /**
         * 解析用户输入的关键词
         */
        function parseKeywords(input) {
            if (!input || !input.trim()) return [];
            const raw = input.trim();
            // 按常见分隔符拆分
            const parts = raw.split(/[,，、\s/\/]+/).filter(Boolean);
            return parts.map(p => p.trim().toLowerCase());
        }

        /**
         * 判断口味是否匹配
         */
        function matchTaste(foodTastes, userKeywords) {
            if (userKeywords.length === 0) return true;
            return userKeywords.some(kw => {
                return foodTastes.some(ft => {
                    const synonyms = TASTE_MAP[ft] || [ft];
                    return synonyms.some(s => kw.includes(s) || s.includes(kw));
                });
            });
        }

        /**
         * 判断预算是否匹配
         */
        function matchBudget(foodBudget, userKeywords) {
            if (userKeywords.length === 0) return true;
            // 根据用户关键词推测预算等级
            const lowKws = ['低', '少', '省', '便宜', '平价', '30', '20', '10'];
            const highKws = ['高', '贵', '多', '不限', '大餐', '100', '200', '豪华'];
            let userLevel = '中';

            const hasLow = userKeywords.some(kw => lowKws.some(lk => kw.includes(lk)));
            const hasHigh = userKeywords.some(kw => highKws.some(hk => kw.includes(hk)));

            if (hasLow && !hasHigh) userLevel = '低';
            else if (hasHigh && !hasLow) userLevel = '高';
            // 如果都有或都没有，默认为中/全匹配

            if (userLevel === '中') return true; // 中等预算匹配所有
            return foodBudget === userLevel;
        }

        /**
         * 将 AI 生成的食物加入转盘
         */
        function addAIToWheel(name) {
            if (options.includes(name)) {
                alert(`「${name}」已在转盘中`);
                return;
            }
            if (options.length >= 30) {
                alert('转盘选项已达上限（30个）');
                return;
            }
            options.push(name);
            applyChange();

            // 标记已添加
            document.querySelectorAll('.ai-item').forEach(el => {
                if (el.dataset.name === name) {
                    el.classList.add('added');
                    el.textContent = name + ' ✓';
                }
            });
        }

        /**
         * AI 推荐生成逻辑（基于规则模拟）
         */
        function generateAI() {
            const budgetRaw = aiBudget.value.trim();
            const tasteRaw = aiTaste.value.trim();
            const moodRaw = aiMood.value.trim();
            const restrictRaw = aiRestrict.value.trim();

            // 提取关键词
            const budgetKws = parseKeywords(budgetRaw);
            const tasteKws = parseKeywords(tasteRaw);
            const moodKws = parseKeywords(moodRaw);
            const restrictKws = parseKeywords(restrictRaw);

            // 对每个食物评分
            const scored = AI_FOOD_POOL.map(food => {
                let score = 0;

                // 预算匹配 (0~2分)
                if (matchBudget(food.budget, budgetKws)) {
                    score += 2;
                }

                // 口味匹配 (0~3分)
                if (matchTaste(food.taste, tasteKws)) {
                    score += 3;
                } else if (tasteKws.length > 0) {
                    score -= 1;
                }

                // 心情匹配 (0~2分)
                if (moodKws.length > 0) {
                    const moodMatch = food.mood.some(fm =>
                        moodKws.some(mk => fm.includes(mk) || mk.includes(fm))
                    );
                    if (moodMatch) score += 2;
                } else {
                    score += 1; // 没填心情一律给 1 分保底
                }

                // 忌口过滤
                if (restrictKws.length > 0) {
                    const restricted = restrictKws.some(rk => {
                        if (rk.includes('辣') && food.taste.includes('辣')) return true;
                        if (rk.includes('肉') && ['烤肉', '牛排', '小龙虾', '炸鸡', '汉堡', '烤鱼'].some(n => food.name.includes(n))) return true;
                        if (rk.includes('海鲜') && ['海鲜', '小龙虾', '烤鱼', '酸菜鱼', '水煮鱼', '椰子鸡'].some(n => food.name.includes(n))) return true;
                        if (rk.includes('甜') && food.taste.includes('甜')) return true;
                        return false;
                    });
                    if (restricted) {
                        score = -999; // 排除
                    }
                }

                return { ...food, score };
            });

            // 按分数降序排列
            scored.sort((a, b) => b.score - a.score);

            // 取前 6 个（排除负数）
            const top = scored.filter(f => f.score > -10).slice(0, 6);

            // 如果没有任何匹配，给出兜底推荐
            let recommendations;
            if (top.length === 0) {
                recommendations = ['番茄炒蛋', '蛋炒饭', '清汤面', '白粥配咸菜', '饺子', '馄饨'];
            } else {
                recommendations = top.map(f => f.name);
            }

            // 渲染结果
            aiResults.innerHTML = '';
            recommendations.forEach(name => {
                const span = document.createElement('span');
                span.className = 'ai-item';
                span.dataset.name = name;
                span.textContent = name;

                // 检查是否已在转盘中
                if (options.includes(name)) {
                    span.classList.add('added');
                    span.textContent = name + ' ✓';
                }

                span.addEventListener('click', () => {
                    if (!span.classList.contains('added')) {
                        addAIToWheel(name);
                    }
                });

                aiResults.appendChild(span);
            });
        }

        // ===================== 事件绑定 =====================

        // 旋转按钮
        spinBtn.addEventListener('click', spinWheel);

        // 添加选项
        addOptionBtn.addEventListener('click', () => {
            addOption(optionInput.value);
            optionInput.value = '';
            optionInput.focus();
        });

        optionInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                addOption(optionInput.value);
                optionInput.value = '';
            }
        });

        // 恢复默认
        resetBtn.addEventListener('click', resetOptions);

        // AI 生成
        aiGenerateBtn.addEventListener('click', generateAI);

        // AI 输入框支持回车触发
        [aiBudget, aiTaste, aiMood, aiRestrict].forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') generateAI();
            });
        });

        // ===================== 初始化 =====================

        renderOptionList();
        drawWheel();
    </script>
</body>
</html>
