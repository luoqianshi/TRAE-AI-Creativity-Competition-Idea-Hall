<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bgGradDog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="55" fill="url(#bgGradDog)" stroke="#8b6914" stroke-width="2"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#8b6914" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- 狗头部（圆形较友好） -->
  <ellipse cx="60" cy="58" rx="26" ry="25" fill="#c68642" stroke="#8b4513" stroke-width="2"/>
  
  <!-- 耳朵（下垂） -->
  <ellipse cx="38" cy="45" rx="10" ry="18" fill="#8b4513" stroke="#5c2a0a" stroke-width="1.5" transform="rotate(-20 38 45)"/>
  <ellipse cx="82" cy="45" rx="10" ry="18" fill="#8b4513" stroke="#5c2a0a" stroke-width="1.5" transform="rotate(20 82 45)"/>
  <ellipse cx="38" cy="48" rx="6" ry="12" fill="#a0522d" transform="rotate(-20 38 48)"/>
  <ellipse cx="82" cy="48" rx="6" ry="12" fill="#a0522d" transform="rotate(20 82 48)"/>
  
  <!-- 脸部中心（较浅） -->
  <ellipse cx="60" cy="60" rx="16" ry="15" fill="#d4a574"/>
  
  <!-- 眼睛 -->
  <circle cx="52" cy="52" r="4" fill="#fff"/>
  <circle cx="68" cy="52" r="4" fill="#fff"/>
  <circle cx="52" cy="53" r="2.5" fill="#5c3a1a"/>
  <circle cx="68" cy="53" r="2.5" fill="#5c3a1a"/>
  <circle cx="51" cy="52" r="0.8" fill="#fff"/>
  <circle cx="67" cy="52" r="0.8" fill="#fff"/>
  
  <!-- 眉毛 -->
  <path d="M47 47 Q52 45 Q57 47" fill="none" stroke="#5c2a0a" stroke-width="1.2"/>
  <path d="M63 47 Q68 45 Q73 47" fill="none" stroke="#5c2a0a" stroke-width="1.2"/>
  
  <!-- 鼻子 -->
  <ellipse cx="60" cy="62" rx="5" ry="4" fill="#2a1810"/>
  <ellipse cx="58" cy="61" rx="1.2" ry="0.8" fill="#fff" opacity="0.6"/>
  
  <!-- 嘴部区域 -->
  <ellipse cx="60" cy="70" rx="10" ry="8" fill="#e8c49a"/>
  
  <!-- 嘴 -->
  <path d="M60 68 L60 72" stroke="#2a1810" stroke-width="1"/>
  <path d="M60 72 Q55 75 Q52 73" fill="none" stroke="#2a1810" stroke-width="1"/>
  <path d="M60 72 Q65 75 Q68 73" fill="none" stroke="#2a1810" stroke-width="1"/>
  
  <!-- 舌头 -->
  <ellipse cx="60" cy="75" rx="3" ry="4" fill="#ff6b6b" opacity="0.8"/>
  
  <!-- 胡须 -->
  <g stroke="#5c3a1a" stroke-width="0.6" opacity="0.5">
    <line x1="50" y1="69" x2="40" y2="67"/>
    <line x1="50" y1="71" x2="40" y2="73"/>
    <line x1="70" y1="69" x2="80" y2="67"/>
    <line x1="70" y1="71" x2="80" y2="73"/>
  </g>
  
  <!-- 等级标识 -->
  <circle cx="60" cy="100" r="8" fill="#d4a574" stroke="#8b6914" stroke-width="1.5"/>
  <text x="60" y="104" text-anchor="middle" font-family="serif" font-size="10" font-weight="bold" fill="#5c4a3a">狗</text>
</svg>
