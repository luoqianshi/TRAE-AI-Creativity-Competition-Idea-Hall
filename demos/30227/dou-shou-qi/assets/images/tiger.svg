  <path d="M78 38 L85 25 L72 30 Z" fill="#e8a95c" stroke="#8b4513" stroke-width="1.5"/>
  <path d="M42 33 L40 28 L45 30 Z" fill="#c68642"/>
  <path d="M78 33 L80 28 L75 30 Z" fill="#c68642"/>
  
