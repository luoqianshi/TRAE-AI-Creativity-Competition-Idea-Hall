  <ellipse cx="68" cy="52" rx="4" ry="5" fill="#fff"/>
  <ellipse cx="52" cy="53" rx="2" ry="3" fill="#ffd700"/>
  <ellipse cx="68" cy="53" rx="2" ry="3" fill="#ffd700"/>
  <circle cx="52" cy="54" r="1" fill="#000"/>
