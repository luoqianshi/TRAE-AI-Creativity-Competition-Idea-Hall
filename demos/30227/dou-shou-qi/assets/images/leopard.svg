  </defs>
  <circle cx="60" cy="60" r="55" fill="url(#bgGradLeopard)" stroke="#8b6914" stroke-width="2"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#8b6914" stroke-width="1" stroke-dasharray="3,2"/>
  
