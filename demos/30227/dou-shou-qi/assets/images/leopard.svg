  <!-- 眼睛 -->
  <ellipse cx="52" cy="52" rx="4" ry="5" fill="#fff"/>
  <ellipse cx="68" cy="52" rx="4" ry="5" fill="#fff"/>
  <ellipse cx="52" cy="53" rx="2.5" ry="3.5" fill="#8b6914"/>
  <ellipse cx="68" cy="53" rx="2.5" ry="3.5" fill="#8b6914"/>
  <ellipse cx="52" cy="53" rx="1" ry="2" fill="#000"/>
  <ellipse cx="68" cy="53" rx="1" ry="2" fill="#000"/>
  
  <!-- 鼻子 -->
  <path d="M56 62 Q60 60 Q64 62 Q60 66 Q56 62 Z" fill="#5c3a1a"/>
  
