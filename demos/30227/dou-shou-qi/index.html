<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗兽棋 - 对战</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <!-- 游戏标题 -->
        <div class="game-header">
            <h1 class="game-title">斗兽棋</h1>
            <p class="game-subtitle">丛林争霸 · 智慧对决</p>
            <a href="rules.html" class="btn-rules">📖 查看游戏规则</a>
        </div>

        <!-- 玩家信息面板 -->
        <div class="players-panel">
            <div class="player-card player-red" id="playerRed">
                <div class="player-avatar">
                    <span class="avatar-icon">🦁</span>
                </div>
                <div class="player-info">
                    <span class="player-name">红方</span>
                    <span class="player-status" id="redStatus">等待中</span>
                </div>
                <div class="pieces-count">剩余：<span id="redCount">8</span></div>
            </div>

            <div class="game-status">
                <div class="turn-indicator" id="turnIndicator">
                    <span class="turn-label">当前回合</span>
                    <span class="turn-player" id="turnPlayer">红方</span>
                </div>
                <button class="btn-restart" id="btnRestart">重新开始</button>
            </div>

            <div class="player-card player-blue" id="playerBlue">
                <div class="player-avatar">
                    <span class="avatar-icon">🐯</span>
                </div>
                <div class="player-info">
                    <span class="player-name">蓝方</span>
                    <span class="player-status" id="blueStatus">等待中</span>
                </div>
                <div class="pieces-count">剩余：<span id="blueCount">8</span></div>
            </div>
        </div>

        <!-- 棋盘区域 -->
        <div class="board-wrapper">
            <div class="board" id="board">
                <!-- 棋盘格由JS生成 -->
            </div>
        </div>

        <!-- 操作提示 -->
        <div class="action-hint" id="actionHint">
            <span>点击棋子选择，点击高亮格子移动</span>
        </div>

        <!-- 棋子说明 -->
        <div class="pieces-guide">
            <h3>棋子等级</h3>
            <div class="pieces-list">
                <div class="piece-item">
                    <img src="assets/images/elephant.svg" alt="象">
                    <span>象 · 等级8</span>
                    <span class="piece-note">最强，但怕鼠</span>
                </div>
                <div class="piece-item">
                    <img src="assets/images/lion.svg" alt="狮">
                    <span>狮 · 等级7</span>
                    <span class="piece-note">可横向跳河</span>
                </div>
                <div class="piece-item">
                    <img src="assets/images/tiger.svg" alt="虎">
                    <span>虎 · 等级6</span>
                    <span class="piece-note">可纵向跳河</span>
                </div>
                <div class="piece-item">
                    <img src="assets/images/leopard.svg" alt="豹">
                    <span>豹 · 等级5</span>
                </div>
                <div class="piece-item">
                    <img src="assets/images/wolf.svg" alt="狼">
                    <span>狼 · 等级4</span>
                </div>
                <div class="piece-item">
                    <img src="assets/images/dog.svg" alt="狗">
                    <span>狗 · 等级3</span>
                </div>
                <div class="piece-item">
                    <img src="assets/images/cat.svg" alt="猫">
                    <span>猫 · 等级2</span>
                </div>
                <div class="piece-item">
                    <img src="assets/images/rat.svg" alt="鼠">
                    <span>鼠 · 等级1</span>
                    <span class="piece-note">最小，可吃象，可入水</span>
                </div>
            </div>

            <h3>特殊地形</h3>
            <div class="terrain-list">
                <div class="terrain-item">
                    <div class="terrain-icon terrain-den"></div>
                    <span>兽穴：对方进入即败</span>
                </div>
                <div class="terrain-item">
                    <div class="terrain-icon terrain-trap"></div>
                    <span>陷阱：对方进入后任人鱼肉</span>
                </div>
                <div class="terrain-item">
                    <div class="terrain-icon terrain-river"></div>
                    <span>河流：只有鼠能进入</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 胜利弹窗 -->
    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2 id="winTitle">🎉 游戏结束</h2>
            <p id="winMessage">红方获胜！</p>
            <button class="btn-restart" id="btnModalRestart">再来一局</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
