<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出片教练 - AI拍照姿势助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #FF6B9D;
            --secondary-color: #C084FC;
            --accent-color: #34D399;
            --text-dark: #1F2937;
            --text-light: #6B7280;
            --bg-light: #FDF2F8;
            --bg-white: #FFFFFF;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
            background: linear-gradient(135deg, #FDF2F8 0%, #EEF2FF 50%, #ECFDF5 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
        }

        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .main-content {
            padding-top: 70px;
            padding-bottom: 50px;
        }

        .demo-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .demo-container {
                grid-template-columns: 1fr;
            }
        }

        .phone-mockup {
            width: 340px;
            height: 680px;
            background: linear-gradient(180deg, #1F2937 0%, #374151 100%);
            border-radius: 44px;
            padding: 22px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 100px;
            margin: 0 auto;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #FFFFFF 0%, #F9FAFB 100%);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .screen-header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .screen-header .icon {
            font-size: 20px;
        }

        .camera-preview {
            flex: 1;
            background: linear-gradient(135deg, #E0E7FF 0%, #FCE7F3 100%);
            position: relative;
            overflow: hidden;
        }

        .pose-guide {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            padding: 60px 20px 20px;
        }

        .pose-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .pose-title {
            font-size: 14px;
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .pose-description {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .pose-animation {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #FDF2F8, #EEF2FF);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        .stick-figure {
            font-size: 60px;
            animation: pose-change 3s ease-in-out infinite;
        }

        @keyframes pose-change {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        .pose-tips {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tip-tag {
            background: var(--bg-light);
            color: var(--primary-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
        }

        .guide-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .guide-lines {
            width: 200px;
            height: 280px;
            border: 2px dashed rgba(255, 107, 157, 0.5);
            border-radius: 10px;
            position: relative;
        }

        .guide-lines::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 107, 157, 0.3);
        }

        .guide-lines::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(255, 107, 157, 0.3);
        }

        .guide-dots {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            border-radius: 50%;
        }

        .guide-dots:nth-child(1) { top: 30%; left: 20%; }
        .guide-dots:nth-child(2) { top: 30%; right: 20%; }
        .guide-dots:nth-child(3) { bottom: 35%; left: 30%; }
        .guide-dots:nth-child(4) { bottom: 35%; right: 30%; }

        .control-panel {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
        }

        .panel-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 2px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 15px;
        }

        .scenario-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .scenario-btn {
            padding: 14px 12px;
            background: var(--bg-light);
            border: 2px solid transparent;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .scenario-btn:hover, .scenario-btn.active {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-color: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.3);
        }

        .scenario-btn .icon {
            font-size: 24px;
            margin-bottom: 6px;
            display: block;
        }

        .scenario-btn .label {
            font-size: 12px;
            font-weight: 500;
        }

        .style-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .style-btn {
            padding: 10px 20px;
            background: white;
            border: 2px solid #E5E7EB;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .style-btn:hover, .style-btn.active {
            border-color: var(--primary-color);
            background: var(--bg-light);
            color: var(--primary-color);
        }

        .pose-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .pose-option {
            padding: 16px;
            background: var(--bg-light);
            border: 2px solid transparent;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pose-option:hover, .pose-option.active {
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.15);
        }

        .pose-option .pose-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .pose-option .pose-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .pose-option .pose-desc {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 4px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 4px 20px rgba(255, 107, 157, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(255, 107, 157, 0.4);
        }

        .btn-secondary {
            background: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-secondary:hover {
            background: var(--bg-light);
        }

        .feedback-panel {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #ECFDF5 0%, #FDF2F8 100%);
            border-radius: 16px;
            display: none;
        }

        .feedback-panel.active {
            display: block;
        }

        .feedback-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .feedback-icon {
            width: 36px;
            height: 36px;
            background: var(--accent-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .feedback-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .feedback-text {
            font-size: 13px;
            color: var(--text-light);
            line-height: 1.6;
        }

        .feature-toggles {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #E5E7EB;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 10px 15px;
            background: var(--bg-light);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .toggle-item:hover, .toggle-item.active {
            background: var(--primary-color);
            color: white;
        }

        .toggle-item .toggle-icon {
            font-size: 16px;
        }

        .toggle-item .toggle-label {
            font-size: 12px;
            font-weight: 500;
        }

        .current-pose-info {
            margin-top: 20px;
            padding: 16px;
            background: #F3F4F6;
            border-radius: 12px;
        }

        .current-pose-info h4 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .current-pose-info p {
            font-size: 12px;
            color: var(--text-light);
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .phone-mockup {
                width: 280px;
                height: 560px;
                padding: 18px;
            }
            
            .scenario-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <div class="logo">
                <div class="logo-icon">📸</div>
                <span class="logo-text">出片教练</span>
            </div>
            <div style="color: var(--primary-color); font-weight: 500; font-size: 14px;">AI拍照姿势助手</div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="demo-container">
                <div class="phone-wrapper">
                    <div class="phone-mockup">
                        <div class="phone-screen">
                            <div class="screen-header">
                                <h2>AI姿势指导</h2>
                                <span class="icon">✨</span>
                            </div>
                            
                            <div class="camera-preview">
                                <div class="guide-overlay">
                                    <div class="guide-lines">
                                        <div class="guide-dots"></div>
                                        <div class="guide-dots"></div>
                                        <div class="guide-dots"></div>
                                        <div class="guide-dots"></div>
                                    </div>
                                </div>
                                
                                <div class="pose-guide">
                                    <div class="pose-card">
                                        <div class="pose-title" id="poseTitle">自然站姿</div>
                                        <div class="pose-description" id="poseDesc">身体微微侧转，重心放在后腿，手臂自然下垂</div>
                                        <div class="pose-animation">
                                            <span class="stick-figure" id="poseFigure">🧍‍♀️</span>
                                        </div>
                                        <div class="pose-tips" id="poseTips">
                                            <span class="tip-tag">眼神自然</span>
                                            <span class="tip-tag">肩膀放松</span>
                                            <span class="tip-tag">微笑</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="control-panel">
                    <h3 class="panel-title">拍照设置</h3>

                    <div class="section">
                        <div class="section-label">选择场景</div>
                        <div class="scenario-grid">
                            <button class="scenario-btn active" data-scenario="travel">
                                <span class="icon">🌊</span>
                                <span class="label">旅行</span>
                            </button>
                            <button class="scenario-btn" data-scenario="cafe">
                                <span class="icon">☕</span>
                                <span class="label">探店</span>
                            </button>
                            <button class="scenario-btn" data-scenario="fashion">
                                <span class="icon">👗</span>
                                <span class="label">穿搭</span>
                            </button>
                            <button class="scenario-btn" data-scenario="couple">
                                <span class="icon">❤️</span>
                                <span class="label">情侣</span>
                            </button>
                            <button class="scenario-btn" data-scenario="friends">
                                <span class="icon">👯</span>
                                <span class="label">闺蜜</span>
                            </button>
                            <button class="scenario-btn" data-scenario="solo">
                                <span class="icon">📸</span>
                                <span class="label">自拍</span>
                            </button>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-label">风格偏好</div>
                        <div class="style-options">
                            <button class="style-btn active" data-style="casual">法式松弛</button>
                            <button class="style-btn" data-style="korean">韩系街拍</button>
                            <button class="style-btn" data-style="japanese">日系清新</button>
                            <button class="style-btn" data-style="vacation">度假风</button>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-label">推荐姿势</div>
                        <div class="pose-options">
                            <button class="pose-option active" data-pose="standing">
                                <span class="pose-icon">🧍‍♀️</span>
                                <span class="pose-name">自然站姿</span>
                                <span class="pose-desc">轻松自然</span>
                            </button>
                            <button class="pose-option" data-pose="sitting">
                                <span class="pose-icon">🧘‍♀️</span>
                                <span class="pose-name">优雅坐姿</span>
                                <span class="pose-desc">温柔气质</span>
                            </button>
                            <button class="pose-option" data-pose="walking">
                                <span class="pose-icon">🚶‍♀️</span>
                                <span class="pose-name">动态行走</span>
                                <span class="pose-desc">动感活力</span>
                            </button>
                            <button class="pose-option" data-pose="interaction">
                                <span class="pose-icon">🤝</span>
                                <span class="pose-name">互动姿势</span>
                                <span class="pose-desc">自然互动</span>
                            </button>
                        </div>
                    </div>

                    <div class="feature-toggles">
                        <div class="toggle-item active" data-toggle="grid">
                            <span class="toggle-icon">📐</span>
                            <span class="toggle-label">构图辅助</span>
                        </div>
                        <div class="toggle-item" data-toggle="timer">
                            <span class="toggle-icon">⏱️</span>
                            <span class="toggle-label">倒计时</span>
                        </div>
                        <div class="toggle-item" data-toggle="sound">
                            <span class="toggle-icon">🔊</span>
                            <span class="toggle-label">语音提示</span>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-secondary" onclick="resetPose()">重置</button>
                        <button class="btn btn-primary" onclick="startGuide()">开始指导</button>
                    </div>

                    <div class="feedback-panel" id="feedbackPanel">
                        <div class="feedback-header">
                            <div class="feedback-icon">🎯</div>
                            <span class="feedback-title">AI姿势分析</span>
                        </div>
                        <div class="feedback-text" id="feedbackText">正在分析您的姿势，请保持当前姿势...</div>
                    </div>

                    <div class="current-pose-info">
                        <h4>当前姿势详情</h4>
                        <p id="poseDetail">身体角度：30° | 手臂位置：自然下垂 | 头部方向：微侧 | 表情：微笑</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const poses = {
            standing: {
                title: '自然站姿',
                desc: '身体微微侧转，重心放在后腿，手臂自然下垂',
                figure: '🧍‍♀️',
                tips: ['眼神自然', '肩膀放松', '微笑'],
                detail: '身体角度：30° | 手臂位置：自然下垂 | 头部方向：微侧 | 表情：微笑'
            },
            sitting: {
                title: '优雅坐姿',
                desc: '侧身坐在椅子边缘，身体微微前倾，一手搭在腿上',
                figure: '🧘‍♀️',
                tips: ['背部挺直', '眼神柔和', '手姿优雅'],
                detail: '身体角度：45° | 手臂位置：搭在腿上 | 头部方向：正视 | 表情：平静'
            },
            walking: {
                title: '动态行走',
                desc: '自然迈步，身体随步伐微微摆动，眼神看向前方',
                figure: '🚶‍♀️',
                tips: ['步伐轻盈', '身体放松', '自然摆臂'],
                detail: '身体角度：15° | 手臂位置：摆动中 | 头部方向：前方 | 表情：自然'
            },
            interaction: {
                title: '互动姿势',
                desc: '与同伴自然互动，可以牵手、对视或搭肩',
                figure: '🤝',
                tips: ['眼神交流', '自然微笑', '身体靠近'],
                detail: '身体角度：面对面 | 手臂位置：互动中 | 头部方向：对方 | 表情：开心'
            }
        };

        const scenarios = {
            travel: { name: '旅行打卡', bg: '#E0E7FF' },
            cafe: { name: '探店拍照', bg: '#FED7AA' },
            fashion: { name: '穿搭记录', bg: '#FCE7F3' },
            couple: { name: '情侣合照', bg: '#FECACA' },
            friends: { name: '闺蜜合照', bg: '#BBF7D0' },
            solo: { name: '独自拍照', bg: '#C7D2FE' }
        };

        function updatePoseDisplay(poseKey) {
            const pose = poses[poseKey];
            document.getElementById('poseTitle').textContent = pose.title;
            document.getElementById('poseDesc').textContent = pose.desc;
            document.getElementById('poseFigure').textContent = pose.figure;
            document.getElementById('poseDetail').textContent = pose.detail;
            
            const tipsContainer = document.getElementById('poseTips');
            tipsContainer.innerHTML = '';
            pose.tips.forEach(tip => {
                const span = document.createElement('span');
                span.className = 'tip-tag';
                span.textContent = tip;
                tipsContainer.appendChild(span);
            });
        }

        document.querySelectorAll('.scenario-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const scenario = btn.dataset.scenario;
                const cameraPreview = document.querySelector('.camera-preview');
                cameraPreview.style.background = scenarios[scenario].bg;
            });
        });

        document.querySelectorAll('.style-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        document.querySelectorAll('.pose-option').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.pose-option').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                updatePoseDisplay(btn.dataset.pose);
            });
        });

        document.querySelectorAll('.toggle-item').forEach(item => {
            item.addEventListener('click', () => {
                item.classList.toggle('active');
            });
        });

        function resetPose() {
            document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.scenario-btn[data-scenario="travel"]').classList.add('active');
            
            document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.style-btn[data-style="casual"]').classList.add('active');
            
            document.querySelectorAll('.pose-option').forEach(b => b.classList.remove('active'));
            document.querySelector('.pose-option[data-pose="standing"]').classList.add('active');
            
            updatePoseDisplay('standing');
            
            const cameraPreview = document.querySelector('.camera-preview');
            cameraPreview.style.background = 'linear-gradient(135deg, #E0E7FF 0%, #FCE7F3 100%)';
            
            document.getElementById('feedbackPanel').classList.remove('active');
        }

        function startGuide() {
            const feedbackPanel = document.getElementById('feedbackPanel');
            const feedbackText = document.getElementById('feedbackText');
            
            feedbackPanel.classList.add('active');
            
            const messages = [
                '正在分析您的姿势，请保持当前姿势...',
                '检测到身体角度：30°，非常标准！',
                '手臂位置：自然下垂，放松自然',
                '头部方向：微微侧转，角度完美',
                '表情：微笑自然，状态很好！',
                '姿势评分：95分！准备拍摄...'
            ];
            
            let index = 0;
            const interval = setInterval(() => {
                feedbackText.textContent = messages[index];
                index++;
                if (index >= messages.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        feedbackText.textContent = '姿势完美！点击拍照按钮完成拍摄';
                    }, 500);
                }
            }, 1200);
        }

        updatePoseDisplay('standing');
    </script>
</body>
</html>
