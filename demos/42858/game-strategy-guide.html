  const rating = (7 + Math.random() * 2.5).toFixed(1);
  const difficulty = Math.floor(4 + Math.random() * 6);
  
  return {
    name: gameName,
    genre: genre,

    ],
    bosses: [
      { name: 'BOSS 1', difficulty: 4, hp: 3000, attack: 5, defense: 4, speed: 5, weak: '待补充' },
      { name: 'BOSS 2', difficulty: 6, hp: 5000, attack: 7, defense: 6, speed: 6, weak: '待补充' },
      { name: '最终 BOSS', difficulty: 9, hp: 10000, attack: 9, defense: 8, speed: 7, weak: '待补充' }
    ],
    tips: [
      { title: '初期建议', content: '优先熟悉游戏基本操作，不要急于挑战高难度内容。' },
      { title: '资源管理', content: '合理分配游戏内资源，优先升级核心装备和技能。' },
      { title: '探索技巧', content: '仔细探索每个区域，隐藏道具和支线任务往往提供重要奖励。' }
    ],
    difficultyCurve: [
      { chapter: '第一章', value: 2 },
      { chapter: '第二章', value: 5 },
      { chapter: '第三章', value: 7 },
      { chapter: '终章', value: 9 }
    ]
  };
}

// ===== UI Logic =====
let currentGame = null;
let difficultyChart = null;
let bossChart = null;

function showProgress() {
  document.getElementById('progressSection').classList.add('active');
  document.getElementById('resultsSection').classList.remove('active');
  const fill = document.getElementById('progressFill');
  const text = document.getElementById('progressText');
  const steps = [
    { pct: 15, text: '正在检索游戏数据库...' },
    { pct: 35, text: '分析核心游戏机制...' },
    { pct: 55, text: '生成流程攻略...' },
    { pct: 75, text: '整理 BOSS 战数据...' },
    { pct: 90, text: '优化技巧与 Build 建议...' },
    { pct: 100, text: '拆解完成！' }
  ];
  let i = 0;
  const interval = setInterval(() => {
    if (i >= steps.length) {
      clearInterval(interval);
      setTimeout(() => showResults(), 400);
      return;
    }
    fill.style.width = steps[i].pct + '%';
    text.textContent = steps[i].text;
    i++;
  }, 350);
}

function showResults() {
  document.getElementById('progressSection').classList.remove('active');
  document.getElementById('resultsSection').classList.add('active');
  renderOverview();
  renderMechanics();
  renderWalkthrough();
  renderBosses();
  renderTips();
  setTimeout(() => {
    renderDifficultyChart();
    renderBossChart();
    renderMechanicsDiagram();
  }, 100);
}

function renderOverview() {
  const g = currentGame;
  const grid = document.getElementById('overviewGrid');
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-value">${g.rating}</div><div class="stat-label">媒体评分</div></div>
    <div class="stat-card"><div class="stat-value">${g.difficulty}/10</div><div class="stat-label">难度等级</div></div>
    <div class="stat-card"><div class="stat-value">${g.genre}</div><div class="stat-label">游戏类型</div></div>
    <div class="stat-card"><div class="stat-value">${g.playtime}</div><div class="stat-label">通关时长</div></div>
  `;
  document.getElementById('gameDesc').textContent = g.desc;
  const tagsEl = document.getElementById('gameTags');
  tagsEl.innerHTML = g.tags.map(t => `<span class="tag">${t}</span>`).join('');
}

function renderMechanics() {
  const container = document.getElementById('mechanicsContent');
  container.innerHTML = currentGame.mechanics.map(m => `
    <div class="card">
      <h3>${m.name}</h3>
      <p>${m.desc}</p>
    </div>
  `).join('');
}

function renderMechanicsDiagram() {
  const g = currentGame;
  let diagram = 'graph TD\n';
  g.mechanics.forEach((m, i) => {
    diagram += `  M${i}[${m.name}]\n`;
  });
  diagram += '  P[玩家]\n';
  g.mechanics.forEach((_, i) => {
    diagram += `  P --> M${i}\n`;
  });
  const el = document.getElementById('mechanicsDiagram');
  el.textContent = diagram;
  mermaid.init(undefined, el);
}

function renderWalkthrough() {
  const container = document.getElementById('walkthroughContent');
  container.innerHTML = `
    <div class="timeline">
      ${currentGame.walkthrough.map(w => `
        <div class="timeline-item">
          <h4>${w.phase}</h4>
          <p>${w.content}</p>
        </div>
      `).join('')}
    </div>
  `;
}

function renderBosses() {
  const container = document.getElementById('bossContent');
  let html = '<div class="table-wrap"><table><thead><tr><th>BOSS 名称</th><th>难度</th><th>HP</th><th>攻击</th><th>防御</th><th>速度</th><th>弱点</th></tr></thead><tbody>';
  currentGame.bosses.forEach(b => {
    html += `<tr><td><strong style="color:var(--accent)">${b.name}</strong></td><td>${b.difficulty}</td><td>${b.hp}</td><td>${b.attack}</td><td>${b.defense}</td><td>${b.speed}</td><td>${b.weak}</td></tr>`;
  });
  html += '</tbody></table></div>';
  
  html += currentGame.bosses.map(b => `
    <div class="card">
      <h3>${b.name}</h3>
      <div class="rating">
        <span>难度：</span>
        <span class="stars">${'★'.repeat(Math.floor(b.difficulty/2))}${'☆'.repeat(5-Math.floor(b.difficulty/2))}</span>
        <span class="rating-score">${b.difficulty}/10</span>
      </div>
      <p style="margin-top:0.5rem">弱点：${b.weak} | 建议等级：${b.difficulty >= 8 ? '高' : b.difficulty >= 5 ? '中' : '低'}</p>
    </div>
  `).join('');
  
  container.innerHTML = html;
}

function renderTips() {
  const container = document.getElementById('tipsContent');
  container.innerHTML = currentGame.tips.map(t => `
    <div class="card">
      <h3>${t.title}</h3>
      <p>${t.content}</p>
    </div>
  `).join('');
}

function renderDifficultyChart() {
  const el = document.getElementById('chart-difficulty');
  if (!el) return;
  if (difficultyChart) difficultyChart.dispose();
  difficultyChart = echarts.init(el, null, { renderer: 'svg' });
  const data = currentGame.difficultyCurve;
  const style = getComputedStyle(document.documentElement);
  const accent = style.getPropertyValue('--accent').trim();
  const accent2 = style.getPropertyValue('--accent2').trim();
  const muted = style.getPropertyValue('--muted').trim();
  const bg2 = style.getPropertyValue('--bg2').trim();
  
  difficultyChart.setOption({
    animation: false,
    tooltip: { trigger: 'axis', appendToBody: true },
    grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
    xAxis: {
      type: 'category',
      data: data.map(d => d.chapter),
      axisLine: { lineStyle: { color: muted } },
      axisLabel: { color: muted }
    },
    yAxis: {
      type: 'value',
      max: 10,
      axisLine: { lineStyle: { color: muted } },
      axisLabel: { color: muted },
      splitLine: { lineStyle: { color: bg2 } }
    },
    series: [{
      type: 'line',
      data: data.map(d => d.value),
      smooth: true,
      lineStyle: { color: accent, width: 3 },
      areaStyle: {
        color: {
          type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
          colorStops: [
            { offset: 0, color: accent + '44' },
            { offset: 1, color: accent + '05' }
          ]
        }
      },
      itemStyle: { color: accent2 },
      symbolSize: 8
    }]
  });
  window.addEventListener('resize', () => difficultyChart.resize());
}

function renderBossChart() {
  const el = document.getElementById('chart-boss');
  if (!el) return;
  if (bossChart) bossChart.dispose();
  bossChart = echarts.init(el, null, { renderer: 'svg' });
  const bosses = currentGame.bosses.slice(0, 6);
  const style = getComputedStyle(document.documentElement);
  const accent = style.getPropertyValue('--accent').trim();
  const accent2 = style.getPropertyValue('--accent2').trim();
  const muted = style.getPropertyValue('--muted').trim();
  
  bossChart.setOption({
    animation: false,
    tooltip: { trigger: 'item', appendToBody: true },
    legend: { data: bosses.map(b => b.name), textStyle: { color: muted }, bottom: 0 },
    radar: {
      indicator: [
        { name: '难度', max: 10 },
        { name: '攻击', max: 10 },
        { name: '防御', max: 10 },
        { name: '速度', max: 10 }
      ],
      axisName: { color: muted },
      splitArea: { areaStyle: { color: ['transparent'] } },
      axisLine: { lineStyle: { color: muted + '44' } },
      splitLine: { lineStyle: { color: muted + '33' } }
    },
    series: [{
      type: 'radar',
      data: bosses.map((b, i) => ({
        value: [b.difficulty, b.attack, b.defense, b.speed],
        name: b.name,
        lineStyle: { color: i % 2 === 0 ? accent : accent2 },
        itemStyle: { color: i % 2 === 0 ? accent : accent2 },
        areaStyle: { color: i % 2 === 0 ? accent + '22' : accent2 + '22' }
      }))
    }]
  });
  window.addEventListener('resize', () => bossChart.resize());
}

// ===== Event Listeners =====
document.getElementById('generateBtn').addEventListener('click', () => {
  const name = document.getElementById('gameNameInput').value.trim();
  if (!name) return;
  currentGame = gameDatabase[name] || generateGenericGame(name);
  showProgress();
});

document.getElementById('gameNameInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') document.getElementById('generateBtn').click();
});

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.getElementById('gameNameInput').value = chip.dataset.game;
    document.getElementById('generateBtn').click();
  });
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'overview') setTimeout(renderDifficultyChart, 50);
    if (btn.dataset.tab === 'boss') setTimeout(renderBossChart, 50);
    if (btn.dataset.tab === 'mechanics') setTimeout(renderMechanicsDiagram, 50);
  });
});

// Init mermaid
mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
</script>
</body>
</html>
