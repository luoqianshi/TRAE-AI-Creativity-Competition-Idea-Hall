<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADHD Focus Flow - 日程专注助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', 'Nunito', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #faf5ff 50%, #fff7ed 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }
        
        .btn-bounce {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .btn-bounce:hover {
            transform: scale(1.05);
        }
        
        .btn-bounce:active {
            transform: scale(0.95);
        }
        
        .priority-high { border-left: 4px solid #ef4444; }
        .priority-medium { border-left: 4px solid #f59e0b; }
        .priority-low { border-left: 4px solid #10b981; }
        
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes confetti {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
        }
        
        .animate-breathe {
            animation: breathe 4s ease-in-out infinite;
        }
        
        .animate-pulse-ring {
            animation: pulse-ring 2s ease-out infinite;
        }
        
        .animate-slideIn {
            animation: slideIn 0.4s ease-out forwards;
        }
        
        .animate-confetti {
            animation: confetti 1s ease-out forwards;
        }
        
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        
        .category-work { background-color: #dbeafe; color: #1e40af; }
        .category-personal { background-color: #fce7f3; color: #be185d; }
        .category-study { background-color: #dcfce7; color: #166534; }
        .category-other { background-color: #fef3c7; color: #92400e; }
    </style>
</head>
<body class="text-gray-800">
    <div id="app"></div>

    <script>
        const STORAGE_KEYS = {
            TASKS: 'adhd_tasks',
            DONE_LIST: 'adhd_done_list',
            FOCUS_SESSIONS: 'adhd_focus_sessions',
            SETTINGS: 'adhd_settings'
        };

        const CATEGORIES = [
            { id: 'work', name: '工作', color: 'category-work' },
            { id: 'personal', name: '个人', color: 'category-personal' },
            { id: 'study', name: '学习', color: 'category-study' },
            { id: 'other', name: '其他', color: 'category-other' }
        ];

        const PRIORITIES = [
            { id: 'high', name: '高', color: 'bg-red-100 text-red-600' },
            { id: 'medium', name: '中', color: 'bg-amber-100 text-amber-600' },
            { id: 'low', name: '低', color: 'bg-green-100 text-green-600' }
        ];

        const initialSettings = {
            focusDuration: 25,
            shortBreak: 5,
            longBreak: 15,
            autoStartBreak: false,
            soundEnabled: true
        };

        function loadFromStorage(key, defaultValue) {
            try {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : defaultValue;
            } catch {
                return defaultValue;
            }
        }

        function saveToStorage(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {
                console.error('Storage save error:', e);
            }
        }

        const tasks = loadFromStorage(STORAGE_KEYS.TASKS, [
            { id: '1', title: '完成项目报告', description: '整理Q1数据分析', priority: 'high', category: 'work', completed: false, createdAt: Date.now(), dueDate: null },
            { id: '2', title: '阅读学习资料', description: '阅读《深度思考》第三章', priority: 'medium', category: 'study', completed: false, createdAt: Date.now(), dueDate: null },
            { id: '3', title: '整理桌面', priority: 'low', category: 'personal', completed: false, createdAt: Date.now(), dueDate: null },
            { id: '4', title: '回复邮件', priority: 'medium', category: 'work', completed: false, createdAt: Date.now(), dueDate: null }
        ]);

        const doneList = loadFromStorage(STORAGE_KEYS.DONE_LIST, [
            { id: 'd1', taskId: 'old1', taskTitle: '完成会议记录', completedAt: Date.now() - 86400000 },
            { id: 'd2', taskId: 'old2', taskTitle: '运动30分钟', completedAt: Date.now() - 86400000 * 2 }
        ]);

        const focusSessions = loadFromStorage(STORAGE_KEYS.FOCUS_SESSIONS, []);
        const settings = loadFromStorage(STORAGE_KEYS.SETTINGS, initialSettings);

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        let currentPage = 'home';
        let selectedTaskId = null;
        let timerInterval = null;
        let timerSeconds = settings.focusDuration * 60;
        let isTimerRunning = false;
        let isFocusMode = true;
        let breathePhase = 'inhale';

        function playSound(type) {
            if (!settings.soundEnabled) return;
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            if (type === 'complete') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime);
                oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.2);
                oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.4);
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.8);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.8);
            } else if (type === 'click') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.1);
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function getTodayDoneCount() {
            const today = new Date().setHours(0, 0, 0, 0);
            return doneList.filter(item => item.completedAt >= today).length;
        }

        function getTotalFocusMinutes() {
            return focusSessions.filter(s => s.completed).reduce((acc, s) => acc + Math.floor(s.duration / 60), 0);
        }

        function renderHeader() {
            return `
                <header class="fixed top-0 left-0 right-0 z-50 glass-card border-b border-white/50">
                    <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
                        <button onclick="navigateTo('home')" class="flex items-center gap-2 btn-bounce">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-green-400 to-purple-500 flex items-center justify-center text-white font-bold text-lg">F</div>
                            <span class="font-bold text-lg text-gray-700 hidden sm:block">Focus Flow</span>
                        </button>
                        <button onclick="showSettings()" class="p-2 rounded-full hover:bg-gray-100 btn-bounce">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </button>
                    </div>
                </header>
            `;
        }

        function renderNavigation() {
            const navItems = [
                { id: 'home', icon: '🏠', label: '首页' },
                { id: 'tasks', icon: '📝', label: '任务' },
                { id: 'focus', icon: '⏱️', label: '专注' },
                { id: 'relax', icon: '🧘', label: '放松' },
                { id: 'done', icon: '✅', label: '完成' }
            ];
            
            return `
                <nav class="fixed bottom-0 left-0 right-0 z-50 glass-card border-t border-white/50">
                    <div class="max-w-lg mx-auto px-2 py-2 flex justify-around">
                        ${navItems.map(item => `
                            <button onclick="navigateTo('${item.id}')" class="flex flex-col items-center gap-1 px-4 py-2 rounded-xl transition-all duration-300 ${currentPage === item.id ? 'bg-gradient-to-br from-green-100 to-purple-100 text-green-600' : 'text-gray-400 hover:text-gray-600 hover:bg-gray-50'}">
                                <span class="text-xl">${item.icon}</span>
                                <span class="text-xs font-medium">${item.label}</span>
                            </button>
                        `).join('')}
                    </div>
                </nav>
            `;
        }

        function renderHome() {
            const pendingTasks = tasks.filter(t => !t.completed);
            const todayDone = getTodayDoneCount();
            const totalFocus = getTotalFocusMinutes();
            
            return `
                <div class="animate-slideIn">
                    <div class="mb-6">
                        <h1 class="text-3xl font-bold text-gray-800 mb-2">你好，今天很棒！</h1>
                        <p class="text-gray-500">让我们开始专注的一天</p>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="glass-card rounded-2xl p-4 flex flex-col items-center justify-center">
                            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-amber-100 to-orange-100 flex items-center justify-center mb-2">
                                <span class="text-2xl">📊</span>
                            </div>
                            <span class="text-2xl font-bold text-gray-800">${pendingTasks.length}</span>
                            <span class="text-sm text-gray-500">待办任务</span>
                        </div>
                        <div class="glass-card rounded-2xl p-4 flex flex-col items-center justify-center">
                            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-green-100 to-emerald-100 flex items-center justify-center mb-2">
                                <span class="text-2xl">✅</span>
                            </div>
                            <span class="text-2xl font-bold text-gray-800">${todayDone}</span>
                            <span class="text-sm text-gray-500">今日完成</span>
                        </div>
                        <div class="glass-card rounded-2xl p-4 flex flex-col items-center justify-center">
                            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-100 to-indigo-100 flex items-center justify-center mb-2">
                                <span class="text-2xl">⏱️</span>
                            </div>
                            <span class="text-2xl font-bold text-gray-800">${totalFocus}</span>
                            <span class="text-sm text-gray-500">专注分钟</span>
                        </div>
                        <div class="glass-card rounded-2xl p-4 flex flex-col items-center justify-center">
                            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-purple-100 to-pink-100 flex items-center justify-center mb-2">
                                <span class="text-2xl">🎉</span>
                            </div>
                            <span class="text-2xl font-bold text-gray-800">${doneList.length}</span>
                            <span class="text-sm text-gray-500">总完成数</span>
                        </div>
                    </div>
                    
                    <div class="mb-4 flex items-center justify-between">
                        <h2 class="text-lg font-bold text-gray-700">今日任务</h2>
                        <button onclick="navigateTo('tasks')" class="text-sm text-green-600 font-medium hover:text-green-700">查看全部</button>
                    </div>
                    
                    <div class="space-y-3 mb-4">
                        ${pendingTasks.slice(0, 3).map(task => `
                            <div class="glass-card rounded-xl p-4 flex items-center justify-between priority-${task.priority}">
                                <div class="flex-1 min-w-0">
                                    <h3 class="font-semibold text-gray-800 truncate">${task.title}</h3>
                                    <div class="flex items-center gap-2 mt-1">
                                        <span class="text-xs px-2 py-0.5 rounded-full ${CATEGORIES.find(c => c.id === task.category)?.color || 'category-other'}">
                                            ${CATEGORIES.find(c => c.id === task.category)?.name || '其他'}
                                        </span>
                                        <span class="text-xs px-2 py-0.5 rounded-full ${PRIORITIES.find(p => p.id === task.priority)?.color || 'bg-gray-100 text-gray-600'}">
                                            ${PRIORITIES.find(p => p.id === task.priority)?.name || '中'}
                                        </span>
                                    </div>
                                </div>
                                <button onclick="startFocus('${task.id}')" class="ml-3 p-2 rounded-full bg-gradient-to-br from-green-400 to-green-500 text-white btn-bounce">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                </button>
                            </div>
                        `).join('')}
                        ${pendingTasks.length === 0 ? `
                            <div class="glass-card rounded-xl p-8 text-center">
                                <span class="text-4xl mb-3 block">🎉</span>
                                <p class="text-gray-500">没有待办任务，去放松一下吧！</p>
                            </div>
                        ` : ''}
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="navigateTo('focus')" class="glass-card rounded-xl p-4 flex items-center gap-3 btn-bounce bg-gradient-to-r from-green-50 to-emerald-50">
                            <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center">
                                <span class="text-xl">⏱️</span>
                            </div>
                            <div class="text-left">
                                <span class="block font-semibold text-gray-800">快速专注</span>
                                <span class="block text-xs text-gray-500">${settings.focusDuration}分钟</span>
                            </div>
                        </button>
                        <button onclick="navigateTo('relax')" class="glass-card rounded-xl p-4 flex items-center gap-3 btn-bounce bg-gradient-to-r from-purple-50 to-pink-50">
                            <div class="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center">
                                <span class="text-xl">🧘</span>
                            </div>
                            <div class="text-left">
                                <span class="block font-semibold text-gray-800">放松训练</span>
                                <span class="block text-xs text-gray-500">缓解压力</span>
                            </div>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderTasks() {
            const pendingTasks = tasks.filter(t => !t.completed);
            const completedTasks = tasks.filter(t => t.completed);
            
            return `
                <div class="animate-slideIn">
                    <div class="flex items-center justify-between mb-4">
                        <h1 class="text-2xl font-bold text-gray-800">任务管理</h1>
                        <button onclick="showAddTaskModal()" class="p-2 rounded-full bg-gradient-to-br from-green-400 to-green-500 text-white btn-bounce">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                        </button>
                    </div>
                    
                    <div class="flex gap-2 mb-4 overflow-x-auto scrollbar-hide pb-2">
                        <button onclick="filterTasks('all')" class="px-4 py-2 rounded-full bg-gray-800 text-white text-sm font-medium whitespace-nowrap">全部</button>
                        <button onclick="filterTasks('pending')" class="px-4 py-2 rounded-full bg-gray-100 text-gray-600 text-sm font-medium whitespace-nowrap hover:bg-gray-200">待完成</button>
                        ${CATEGORIES.map(cat => `
                            <button onclick="filterTasks('${cat.id}')" class="px-4 py-2 rounded-full ${cat.color} text-sm font-medium whitespace-nowrap">${cat.name}</button>
                        `).join('')}
                    </div>
                    
                    <div class="space-y-3 mb-4">
                        ${pendingTasks.map((task, index) => `
                            <div class="glass-card rounded-xl p-4 flex items-center gap-3 priority-${task.priority} animate-slideIn" style="animation-delay: ${index * 0.05}s">
                                <button onclick="toggleTask('${task.id}')" class="w-6 h-6 rounded-full border-2 ${task.completed ? 'bg-green-500 border-green-500' : 'border-gray-300'} flex items-center justify-center flex-shrink-0">
                                    ${task.completed ? '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>' : ''}
                                </button>
                                <div class="flex-1 min-w-0">
                                    <h3 class="font-semibold text-gray-800 truncate ${task.completed ? 'line-through text-gray-400' : ''}">${task.title}</h3>
                                    ${task.description ? `<p class="text-sm text-gray-500 truncate mt-0.5">${task.description}</p>` : ''}
                                    <div class="flex items-center gap-2 mt-2">
                                        <span class="text-xs px-2 py-0.5 rounded-full ${CATEGORIES.find(c => c.id === task.category)?.color || 'category-other'}">
                                            ${CATEGORIES.find(c => c.id === task.category)?.name || '其他'}
                                        </span>
                                        <span class="text-xs px-2 py-0.5 rounded-full ${PRIORITIES.find(p => p.id === task.priority)?.color || 'bg-gray-100 text-gray-600'}">
                                            ${PRIORITIES.find(p => p.id === task.priority)?.name || '中'}
                                        </span>
                                    </div>
                                </div>
                                <div class="flex items-center gap-1">
                                    <button onclick="startFocus('${task.id}')" class="p-2 rounded-full hover:bg-green-50 text-green-600 btn-bounce">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                        </svg>
                                    </button>
                                    <button onclick="editTask('${task.id}')" class="p-2 rounded-full hover:bg-gray-50 text-gray-600 btn-bounce">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                        </svg>
                                    </button>
                                    <button onclick="deleteTask('${task.id}')" class="p-2 rounded-full hover:bg-red-50 text-red-500 btn-bounce">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                        ${pendingTasks.length === 0 ? `
                            <div class="glass-card rounded-xl p-8 text-center">
                                <span class="text-4xl mb-3 block">📝</span>
                                <p class="text-gray-500">没有待办任务，点击右上角添加</p>
                            </div>
                        ` : ''}
                    </div>
                    
                    ${completedTasks.length > 0 ? `
                        <div class="mt-6">
                            <h2 class="text-lg font-bold text-gray-700 mb-3">已完成</h2>
                            <div class="space-y-2">
                                ${completedTasks.map(task => `
                                    <div class="glass-card rounded-xl p-3 flex items-center gap-3 opacity-60">
                                        <button onclick="toggleTask('${task.id}')" class="w-5 h-5 rounded-full bg-green-500 border-2 border-green-500 flex items-center justify-center flex-shrink-0">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-white" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
                                        </button>
                                        <span class="text-sm text-gray-500 line-through flex-1">${task.title}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const today = new Date();
            if (date.toDateString() === today.toDateString()) {
                return '今天 ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            }
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            if (date.toDateString() === yesterday.toDateString()) {
                return '昨天';
            }
            return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
        }

        function saveTask(taskId) {
            const title = document.getElementById('task-title').value.trim();
            if (!title) {
                alert('请输入任务标题');
                return;
            }
            
            const desc = document.getElementById('task-desc').value.trim();
            
            if (taskId) {
                const index = tasks.findIndex(t => t.id === taskId);
                if (index !== -1) {
                    tasks[index] = {
                        ...tasks[index],
                        title,
                        description: desc,
                        priority: window.selectedPriority,
                        category: window.selectedCategory
                    };
                }
            } else {
                tasks.unshift({
                    id: generateId(),
                    title,
                    description: desc,
                    priority: window.selectedPriority,
                    category: window.selectedCategory,
                    completed: false,
                    createdAt: Date.now(),
                    dueDate: null
                });
            }
            
            saveToStorage(STORAGE_KEYS.TASKS, tasks);
            playSound('click');
            closeModal();
            render();

                    if (isFocusMode) {
                        const session = {
                            id: generateId(),
                            taskId: selectedTaskId,
                            duration: settings.focusDuration * 60,
                            startTime,
                            endTime: Date.now(),
                            completed: true
                        };
                        focusSessions.push(session);
                        saveToStorage(STORAGE_KEYS.FOCUS_SESSIONS, focusSessions);
                        
                        if (selectedTaskId) {
                            toggleTask(selectedTaskId);
                        }
                        
                        isFocusMode = false;
                        timerSeconds = settings.shortBreak * 60;
                        render();
                    } else {
                        isFocusMode = true;
                        timerSeconds = settings.focusDuration * 60;
                        render();
                    }
                }
                
                if (document.getElementById('app')) {
                    const timerDisplay = document.querySelector('.font-mono.text-5xl');
                    if (timerDisplay) timerDisplay.textContent = formatTime(timerSeconds);
                }
            }, 1000);
        }

        function startBreathingExercise() {
            breathePhase = 'inhale';
            let phaseTime = 4;
            
            timerInterval = setInterval(() => {
                phaseTime--;
                
                if (phaseTime <= 0) {
                    if (breathePhase === 'inhale') {
                        breathePhase = 'hold';
                        phaseTime = 4;
                    } else if (breathePhase === 'hold') {
                        breathePhase = 'exhale';
                        phaseTime = 4;
                    } else {
                        breathePhase = 'inhale';
                        phaseTime = 4;
                    }
                    
                    const phaseDisplay = document.querySelector('.text-2xl.font-bold.text-white');
                    if (phaseDisplay) {
                        phaseDisplay.textContent = breathePhase === 'inhale' ? '吸气' : breathePhase === 'hold' ? '保持' : '呼气';
                    }
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            isFocusMode = true;
            breathePhase = 'inhale';
            timerSeconds = settings.focusDuration * 60;
            playSound('click');
            render();
        }

        function toggleSound() {
            settings.soundEnabled = !settings.soundEnabled;
            saveToStorage(STORAGE_KEYS.SETTINGS, settings);
            playSound('click');
            render();
        }

        function showSettings() {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/30 backdrop-blur-sm animate-slideIn';
            modal.innerHTML = `
                <div class="glass-card rounded-2xl p-6 w-full max-w-md">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">设置</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">专注时长（分钟）</label>
                            <input type="number" id="focus-duration" value="${settings.focusDuration}" min="5" max="60" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-green-400 focus:ring-2 focus:ring-green-100 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">短休息时长（分钟）</label>
                            <input type="number" id="short-break" value="${settings.shortBreak}" min="1" max="30" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-green-400 focus:ring-2 focus:ring-green-100 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">长休息时长（分钟）</label>
                            <input type="number" id="long-break" value="${settings.longBreak}" min="5" max="60" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-green-400 focus:ring-2 focus:ring-green-100 outline-none">
                        </div>
                        <div class="flex items-center justify-between py-2">
                            <span class="text-sm font-medium text-gray-700">启用声音</span>
                            <button onclick="toggleSettingsSound()" id="settings-sound-btn" class="w-12 h-6 rounded-full ${settings.soundEnabled ? 'bg-green-500' : 'bg-gray-300'} relative btn-bounce">
                                <div class="w-5 h-5 rounded-full bg-white absolute top-0.5 ${settings.soundEnabled ? 'left-6' : 'left-0.5'} transition-all"></div>
                            </button>
                        </div>
                        <div class="flex gap-3 pt-2">
                            <button onclick="closeModal()" class="flex-1 py-3 rounded-xl border border-gray-200 text-gray-600 font-medium btn-bounce">取消</button>
                            <button onclick="saveSettings()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-green-400 to-emerald-500 text-white font-medium btn-bounce">保存</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function toggleSettingsSound() {
            settings.soundEnabled = !settings.soundEnabled;
            const btn = document.getElementById('settings-sound-btn');
            const knob = btn.querySelector('div');
            btn.className = `w-12 h-6 rounded-full ${settings.soundEnabled ? 'bg-green-500' : 'bg-gray-300'} relative btn-bounce`;
            knob.className = `w-5 h-5 rounded-full bg-white absolute top-0.5 ${settings.soundEnabled ? 'left-6' : 'left-0.5'} transition-all`;
            playSound('click');
        }

        function saveSettings() {
            settings.focusDuration = parseInt(document.getElementById('focus-duration').value) || 25;
            settings.shortBreak = parseInt(document.getElementById('short-break').value) || 5;
            settings.longBreak = parseInt(document.getElementById('long-break').value) || 15;
            saveToStorage(STORAGE_KEYS.SETTINGS, settings);
            playSound('click');
            closeModal();
            render();
        }

        function toggleBreathing() {
            toggleTimer();
        }

        function navigateTo(page) {
            currentPage = page;
            render();
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;
            
            let content = '';
            switch (currentPage) {
                case 'home': content = renderHome(); break;
                case 'tasks': content = renderTasks(); break;
                case 'focus': content = renderFocus(); break;
                case 'relax': content = renderRelax(); break;
                case 'done': content = renderDone(); break;
            }
            
            app.innerHTML = `
                ${renderHeader()}
                <main class="max-w-lg mx-auto px-4 py-4 pt-20 pb-24">
                    ${content}
                </main>
                ${renderNavigation()}
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            render();
        });
    </script>
</body>
</html>
