const TIMES=['清晨','上午','下午','傍晚','深夜','凌晨'];
const G={on:false,st:'explore',sc:'entrance',fr:0,stT:0,ap:6,mxAp:6,day:1,ti:0,rel:{trust:0,emotion:0,fear:0,empathy:0},dlg:null,pC:0,walkAp:0};
const P={x:12*DS,y:10*DS,dir:'down',mv:false};
const K={};

document.addEventListener('keydown',e=>{K[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});
document.addEventListener('keyup',e=>{K[e.key.toLowerCase()]=false});

function canGo(x,y){
    const sc=SCENES[G.sc];if(!sc)return false;
    const pts=[[x+6,y+6],[x+DS-6,y+6],[x+6,y+DS-4],[x+DS-6,y+DS-4]];
    for(const[px,py]of pts){const tx=px/DS|0,ty=py/DS|0;if(tx<0||tx>=MCOLS||ty<0||ty>=MROWS)return false;if(!WL.has(sc.map[ty]?.[tx]))return false}
    for(const n of sc.npcs){if(Math.hypot(x-n.x*DS,y-n.y*DS)<DS*0.7)return false}
    return true;
}

function useAP(n){
    G.ap=Math.max(0,G.ap-n);
    document.getElementById('ap').style.width=G.ap/G.mxAp*100+'%';
    if(G.ap<=0)advanceTime();
}
function advanceTime(){
    G.ti++;
    if(G.ti>=TIMES.length){G.ti=0;G.day++}
    G.ap=G.mxAp;
    document.getElementById('ap').style.width='100%';
    document.getElementById('tm').textContent='第'+G.day+'天 · '+TIMES[G.ti];
    showNf('第'+G.day+'天 · '+TIMES[G.ti]+' — 新的时段开始了');
}
function update(){
    if(!G.on||G.st!=='explore')return;
    G.fr++;if(G.pC>0)G.pC--;
    let dx=0,dy=0,spd=3;
    if(K['w']||K['arrowup']){dy=-spd;P.dir='up'}
    if(K['s']||K['arrowdown']){dy=spd;P.dir='down'}
    if(K['a']||K['arrowleft']){dx=-spd;P.dir='left'}
    if(K['d']||K['arrowright']){dx=spd;P.dir='right'}
    if(dx&&dy){dx*=.707;dy*=.707}
    P.mv=dx!==0||dy!==0;
    if(dx&&canGo(P.x+dx,P.y))P.x+=dx;
    if(dy&&canGo(P.x,P.y+dy))P.y+=dy;
    if(P.mv){G.stT++;if(G.stT%10===0)playSfx('step');G.walkAp++;if(G.walkAp>=150){G.walkAp=0;useAP(1)}}else{G.stT=0;G.walkAp=0}

    if(G.pC<=0){const sc=SCENES[G.sc];for(const p of sc.portals){const px=p.x*DS,py=p.y*DS,pw=p.w*DS,ph=p.h*DS;if(P.x<px+pw&&P.x+DS>px&&P.y<py+ph&&P.y+DS>py){G.pC=30;goScene(p.to,p.sx,p.sy);break}}}

    if(K['e']||K[' ']){K['e']=K[' ']=false;const sc=SCENES[G.sc];for(const n of sc.npcs){if(Math.hypot(P.x-n.x*DS,P.y-n.y*DS)<DS*2){startDlg(n);break}}}
    if(K['r']){K['r']=false;document.getElementById('rp').classList.toggle('on')}

    const pl=document.getElementById('pl'),pr=document.getElementById('pr');
    const sc2=SCENES[G.sc];
    if(G.sc==='entrance'){pl.textContent='◄ 图书馆';pr.textContent='广场 ►'}
    else if(G.sc==='library'){pl.textContent='';pr.textContent='出口 ►'}
    else if(G.sc==='square'){pl.textContent='◄ 入口';pr.textContent=''}
    pl.classList.toggle('on',P.x<DS*5&&pl.textContent);
    pr.classList.toggle('on',P.x>(MCOLS-5)*DS&&pr.textContent);
}

function goScene(to,sx,sy){
    playSfx('door');
    const fd=document.getElementById('fd');fd.classList.add('on');
    setTimeout(()=>{
        G.sc=to;P.x=sx*DS;P.y=sy*DS;
        const sc=SCENES[to];
        document.getElementById('loc').textContent=sc.name;
        document.getElementById('tm').textContent='第'+G.day+'天 · '+TIMES[G.ti];
        useAP(1);
        showNf('到达: '+sc.name);
        setTimeout(()=>fd.classList.remove('on'),150);
    },250);
}

function startDlg(npc){
    if(!npc.dlg||!npc.dlg.length)return;
    playSfx('book');G.st='dialogue';G.dlg={npc,idx:0};
    showLine(npc.dlg[0]);
}
function showLine(ln){
    const bx=document.getElementById('dlg'),nm=document.getElementById('dn'),tx=document.getElementById('dt'),cl=document.getElementById('cl'),dh=document.getElementById('dh');
    bx.classList.add('on');nm.textContent=ln.sp;tx.textContent='';cl.innerHTML='';dh.style.display='none';
    let i=0;const iv=setInterval(()=>{if(i<ln.txt.length){tx.textContent+=ln.txt[i++]}else{clearInterval(iv);
    if(ln.ch){ln.ch.forEach(c=>{const b=document.createElement('button');b.className='CB';b.textContent=c.txt;b.onclick=()=>pickCh(c);cl.appendChild(b)})}else{dh.style.display='block'}}},20);
}
function pickCh(ch){
    playSfx('coin');
    if(ch.eff)for(const[k,v]of Object.entries(ch.eff)){if(k in G.rel){G.rel[k]+=v;const m={trust:'v1',emotion:'v2',fear:'v3',empathy:'v4'};if(m[k])document.getElementById(m[k]).textContent=G.rel[k]}}
    const{npc,idx}=G.dlg;if(idx+1<npc.dlg.length){G.dlg.idx++;showLine(npc.dlg[G.dlg.idx])}else endDlg();
}
function endDlg(){G.st='explore';G.dlg=null;document.getElementById('dlg').classList.remove('on');useAP(1)}

function showNf(t){const e=document.getElementById('nf');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1200)}

function render(){
    const sc=SCENES[G.sc];if(!sc)return;
    const img=IMG[sc.ts]||null;
    CTX.fillStyle='#0a0a14';CTX.fillRect(0,0,960,640);

    const camX=Math.max(0,Math.min(P.x-480+DS/2,MCOLS*DS-960));
    const camY=Math.max(0,Math.min(P.y-320+DS/2,MROWS*DS-640));

    CTX.save();CTX.translate(-camX,-camY);

    const stX=Math.max(0,camX/DS|0),stY=Math.max(0,camY/DS|0);
    const enX=Math.min(MCOLS,(camX+960)/DS+1|0),enY=Math.min(MROWS,(camY+640)/DS+1|0);

    for(let y=stY;y<enY;y++)for(let x=stX;x<enX;x++){
        const t=sc.map[y]?.[x]||0;dT(CTX,img,t,x*DS,y*DS);
        const o=sc.obj[y]?.[x]||0;if(o>0)dT(CTX,img,o,x*DS,y*DS);
    }

    const allSprites=[...sc.npcs.map(n=>({x:n.x*DS,y:n.y*DS,type:'npc',data:n})),{x:P.x,y:P.y,type:'player'}];
    allSprites.sort((a,b)=>a.y-b.y);

    for(const s of allSprites){
        if(s.type==='player'){
            const fr=P.mv?(G.fr/8|0)%4:0;
            drawChar(CTX,P.x,P.y,'#4060a0',P.dir,fr,true);
        }else{
            drawChar(CTX,s.x,s.y,s.data.col,'down',0,false);
            CTX.fillStyle='#f0c040';CTX.font='10px "Press Start 2P"';CTX.textAlign='center';
            CTX.fillText(s.data.name,s.x+DS/2,s.y-8);
            const d=Math.hypot(P.x-s.x,P.y-s.y);
            if(d<DS*2.5){CTX.fillStyle='#f0c040';CTX.font='12px "Press Start 2P"';CTX.fillText('E',s.x+DS/2,s.y-20)}
        }
    }

    for(const p of sc.portals){
        const px=p.x*DS,py=p.y*DS,pw=p.w*DS,ph=p.h*DS;
        const a=.2+Math.sin(G.fr*.08)*.1;
        CTX.fillStyle=`rgba(80,160,255,${a})`;CTX.fillRect(px,py,pw,ph);
        CTX.strokeStyle='rgba(100,180,255,0.5)';CTX.lineWidth=2;CTX.strokeRect(px+2,py+2,pw-4,ph-4);
        if(G.fr%4<2){const cx=px+pw/2,cy=py+ph/2;CTX.fillStyle='#fff';CTX.font='bold 20px monospace';CTX.textAlign='center';CTX.textBaseline='middle';CTX.fillText(p.x<MCOLS/2?'◄':'►',cx,cy)}
    }

    const grd=CTX.createRadialGradient(P.x+DS/2,P.y+DS/2,80,P.x+DS/2,P.y+DS/2,300);
    grd.addColorStop(0,'rgba(255,250,220,0.04)');grd.addColorStop(1,'rgba(0,0,0,0.15)');
    CTX.fillStyle=grd;CTX.fillRect(camX,camY,960,640);

    CTX.restore();
}

function drawChar(c,x,y,col,dir,fr,isP){
    const s=DS,w=DS,h=DS;
    c.fillStyle='rgba(0,0,0,0.25)';c.beginPath();c.ellipse(x+s/2,y+h-4,s/3,5,0,0,Math.PI*2);c.fill();
    c.fillStyle=col;c.fillRect(x+s*.2,y+h*.3,s*.6,h*.35);
    const skinC=isP?'#ffd8b4':'#ffe0c8';
    c.fillStyle=skinC;c.fillRect(x+s*.25,y+h*.05,s*.5,h*.3);
    if(!isP){c.fillStyle='#d0d0e0';c.fillRect(x+s*.15,y+h*.05,s*.2,h*.45);c.fillRect(x+s*.65,y+h*.05,s*.2,h*.45)}
    else{c.fillStyle='#382818';c.fillRect(x+s*.22,y,s*.56,h*.1)}
    c.fillStyle='#222';
    if(dir==='left'){c.fillRect(x+s*.32,y+h*.15,s*.08,h*.06)}
    else if(dir==='right'){c.fillRect(x+s*.6,y+h*.15,s*.08,h*.06)}
    else{c.fillRect(x+s*.35,y+h*.15,s*.07,h*.06);c.fillRect(x+s*.58,y+h*.15,s*.07,h*.06)}
    const lo=isP?(fr%2?2:-2):0;
    c.fillStyle=isP?'#203060':'#504070';
    c.fillRect(x+s*.28,y+h*.65,s*.18,h*.35+lo);c.fillRect(x+s*.54,y+h*.65,s*.18,h*.35-lo);
    c.fillStyle='#181828';c.fillRect(x+s*.25,y+h-.3,s*.22,.3);c.fillRect(x+s*.53,y+h-.3,s*.22,.3);
    if(isP){c.fillStyle='#382818';c.fillRect(x+s*.25,y+h*.02,s*.5,h*.06)}
}

function loop(){update();render();requestAnimationFrame(loop)}

document.getElementById('sb').addEventListener('click',()=>{
    initA();G.on=true;document.getElementById('ts').classList.add('off');
    const bm=document.getElementById('bm');bm.classList.add('on');setTimeout(()=>bm.classList.remove('on'),3000);
    console.log('游戏开始！');
});

ldImg('dungeon',A.dungeon);
ldImg('town',A.town);
loop();
