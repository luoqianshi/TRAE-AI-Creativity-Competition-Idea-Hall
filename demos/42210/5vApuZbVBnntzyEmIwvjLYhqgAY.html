<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>果时令 - 当季水果指南</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .date-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .date-card .today {
      font-size: 1.5rem;
      color: #666;
      margin-bottom: 8px;
    }

    .date-card .season {
      font-size: 2rem;
      font-weight: 600;
      color: #667eea;
    }

    .section {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .section-title {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .section-title .icon {
      width: 24px;
      height: 24px;
      margin-right: 10px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
    }

    .section-title .icon.hot {
      background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
    }

    .section-title .icon.warning {
      background: linear-gradient(135deg, #ffa502, #ff7f50);
    }

    .section-title .icon.coming {
      background: linear-gradient(135deg, #4ecdc4, #44a08d);
    }

    .fruit-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .fruit-card {
      background: linear-gradient(145deg, #f8f9fa, #e9ecef);
      border-radius: 12px;
      padding: 16px 8px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .fruit-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .fruit-icon {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }

    .fruit-name {
      font-size: 0.9rem;
      font-weight: 500;
      color: #333;
    }

    .fruit-desc {
      font-size: 0.7rem;
      color: #888;
      margin-top: 4px;
    }

    .footer {
      text-align: center;
      color: rgba(255,255,255,0.8);
      margin-top: 30px;
      font-size: 0.9rem;
    }

    .feature-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(255,255,255,0.2);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin: 4px;
    }

    .feature-badge span {
      margin-right: 5px;
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 1.8rem;
      }

      .fruit-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🍎 果时令</h1>
      <p>新鲜水果，应季而食</p>
      <div style="margin-top: 15px;">
        <span class="feature-badge"><span>✅</span>当季推荐</span>
        <span class="feature-badge"><span>💰</span>高性价比</span>
        <span class="feature-badge"><span>🍓</span>新鲜美味</span>
      </div>
    </div>

    <div class="date-card" id="dateCard">
      <div class="today" id="todayDate"></div>
      <div class="season" id="currentSeason"></div>
    </div>

    <div class="section">
      <div class="section-title">
        <span class="icon hot">🔥</span>
        <span>当季热销</span>
      </div>
      <div class="fruit-grid" id="inSeasonFruits"></div>
    </div>

    <div class="section">
      <div class="section-title">
        <span class="icon warning">⏰</span>
        <span>即将下市</span>
      </div>
      <div class="fruit-grid" id="endingFruits"></div>
    </div>

    <div class="section">
      <div class="section-title">
        <span class="icon coming">🌱</span>
        <span>即将上市</span>
      </div>
      <div class="fruit-grid" id="comingFruits"></div>
    </div>

    <div class="footer">
      <p>让吃水果变得简单</p>
      <p style="font-size: 0.8rem; margin-top: 5px; opacity: 0.7;">果时令 · 应季而食</p>
    </div>
  </div>

  <script>
    const fruitsData = {
      spring: {
        inSeason: [
          { name: '草莓', emoji: '🍓', desc: '酸甜多汁' },
          { name: '菠萝', emoji: '🍍', desc: '香气浓郁' },
          { name: '芒果', emoji: '🥭', desc: '香甜软糯' },
          { name: '樱桃', emoji: '🍒', desc: '鲜美可口' },
          { name: '枇杷', emoji: '🍑', desc: '润肺止咳' },
          { name: '山竹', emoji: '🫐', desc: '清凉降火' }
        ],
        ending: [
          { name: '柑橘', emoji: '🍊', desc: '维C丰富' },
          { name: '甘蔗', emoji: '🌿', desc: '清甜解渴' }
        ],
        coming: [
          { name: '西瓜', emoji: '🍉', desc: '消暑必备' },
          { name: '荔枝', emoji: '🧊', desc: '果肉晶莹' },
          { name: '桃子', emoji: '🍑', desc: '桃香四溢' }
        ]
      },
      summer: {
        inSeason: [
          { name: '西瓜', emoji: '🍉', desc: '消暑必备' },
          { name: '荔枝', emoji: '🧊', desc: '果肉晶莹' },
          { name: '桃子', emoji: '🍑', desc: '桃香四溢' },
          { name: '葡萄', emoji: '🍇', desc: '颗颗饱满' },
          { name: '蓝莓', emoji: '🫐', desc: '花青素丰富' },
          { name: '哈密瓜', emoji: '🍈', desc: '甜蜜多汁' }
        ],
        ending: [
          { name: '草莓', emoji: '🍓', desc: '季末特惠' },
          { name: '菠萝', emoji: '🍍', desc: '抓紧品尝' }
        ],
        coming: [
          { name: '苹果', emoji: '🍎', desc: '营养丰富' },
          { name: '梨', emoji: '🍐', desc: '润肺生津' },
          { name: '石榴', emoji: '🍒', desc: '籽粒饱满' }
        ]
      },
      autumn: {
        inSeason: [
          { name: '苹果', emoji: '🍎', desc: '营养丰富' },
          { name: '梨', emoji: '🍐', desc: '润肺生津' },
          { name: '石榴', emoji: '🍒', desc: '籽粒饱满' },
          { name: '柿子', emoji: '🍅', desc: '软糯香甜' },
          { name: '山楂', emoji: '🫒', desc: '开胃消食' },
          { name: '冬枣', emoji: '🌰', desc: '脆甜可口' }
        ],
        ending: [
          { name: '西瓜', emoji: '🍉', desc: '季末清仓' },
          { name: '葡萄', emoji: '🍇', desc: '即将下架' }
        ],
        coming: [
          { name: '橙子', emoji: '🍊', desc: '维C之王' },
          { name: '柚子', emoji: '🍋', desc: '清香爽口' },
          { name: '猕猴桃', emoji: '🥝', desc: '酸甜可口' }
        ]
      },
      winter: {
        inSeason: [
          { name: '橙子', emoji: '🍊', desc: '维C之王' },
          { name: '柚子', emoji: '🍋', desc: '清香爽口' },
          { name: '猕猴桃', emoji: '🥝', desc: '酸甜可口' },
          { name: '香蕉', emoji: '🍌', desc: '方便快捷' },
          { name: '木瓜', emoji: '🥭', desc: '美容养颜' },
          { name: '甘蔗', emoji: '🌿', desc: '清甜解渴' }
        ],
        ending: [
          { name: '苹果', emoji: '🍎', desc: '库存有限' },
          { name: '梨', emoji: '🍐', desc: '即将下市' }
        ],
        coming: [
          { name: '草莓', emoji: '🍓', desc: '春季首发' },
          { name: '菠萝', emoji: '🍍', desc: '热带风情' },
          { name: '樱桃', emoji: '🍒', desc: '新鲜上市' }
        ]
      }
    };

    function getSeason(month) {
      if (month >= 3 && month <= 5) return 'spring';
      if (month >= 6 && month <= 8) return 'summer';
      if (month >= 9 && month <= 11) return 'autumn';
      return 'winter';
    }

    function getSeasonName(season) {
      const names = { spring: '🌸 春季', summer: '☀️ 夏季', autumn: '🍂 秋季', winter: '❄️ 冬季' };
      return names[season];
    }

    function formatDate(date) {
      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const weekDay = weekDays[date.getDay()];
      return `${year}年${month}月${day}日 ${weekDay}`;
    }

    function renderFruits(containerId, fruits) {
      const container = document.getElementById(containerId);
      container.innerHTML = fruits.map(fruit => `
        <div class="fruit-card">
          <div class="fruit-icon">${fruit.emoji}</div>
          <div class="fruit-name">${fruit.name}</div>
          <div class="fruit-desc">${fruit.desc}</div>
        </div>
      `).join('');
    }

    function init() {
      const today = new Date();
      const month = today.getMonth() + 1;
      const season = getSeason(month);
      const seasonName = getSeasonName(season);
      const data = fruitsData[season];

      document.getElementById('todayDate').textContent = formatDate(today);
      document.getElementById('currentSeason').textContent = seasonName;

      renderFruits('inSeasonFruits', data.inSeason);
      renderFruits('endingFruits', data.ending);
      renderFruits('comingFruits', data.coming);
    }

    init();
  </script>
</body>
</html>
