    <!-- ═══ Interactive Scripts ═══ -->
    <script>
    // ── Mood Selection ──
    function selectMood(btn, mood) {
      const allBtns = btn.parentElement.querySelectorAll('button');
      allBtns.forEach(b => {
        b.querySelector('span').style.opacity = '0.85';
        b.querySelector('span').style.transform = 'scale(1)';
        b.querySelector('span').style.boxShadow = 'none';
      });
      const circle = btn.querySelector('span');
      circle.style.opacity = '1';
      circle.style.transform = 'scale(1.2)';
      circle.style.boxShadow = '0 0 16px ' + getComputedStyle(circle).backgroundColor;
      circle.style.transition = 'all 250ms ease';
    }

    // ── Mood hover effects ──
    document.querySelectorAll('[onclick^="selectMood"]').forEach(btn => {
      btn.addEventListener('mouseenter', () => {
        const circle = btn.querySelector('span');
        if (circle.style.opacity !== '1') {
          circle.style.transform = 'scale(1.1)';
        }
      });
      btn.addEventListener('mouseleave', () => {
        const circle = btn.querySelector('span');
        if (circle.style.opacity !== '1') {
          circle.style.transform = 'scale(1)';
        }
      });
    });

    // ── Real-time Clock ──
    function updateTime() {
      const now = new Date();
      const h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');

      let timePrefix = '';
      let context = '';

      if (h >= 0 && h < 5) {
        timePrefix = '凌晨';
        context = '世界很安静';
      } else if (h >= 5 && h < 8) {
        timePrefix = '清晨';
        context = '新的一天开始了';
      } else if (h >= 8 && h < 11) {
        timePrefix = '上午';
        context = '希望今天一切顺利';
      } else if (h >= 11 && h < 13) {
        timePrefix = '中午';
        context = '记得好好吃饭';
      } else if (h >= 13 && h < 17) {
        timePrefix = '下午';
        context = '阳光正好';
      } else if (h >= 17 && h < 19) {
        timePrefix = '傍晚';
        context = '忙碌了一天，辛苦了';
      } else if (h >= 19 && h < 22) {
        timePrefix = '晚上';
        context = '夜色温柔';
      } else {
        timePrefix = '深夜';
        context = '世界很安静';
      }

      document.getElementById('timeDisplay').textContent = timePrefix + ' ' + String(h).padStart(2, '0') + ':' + m;
      document.getElementById('contextText').textContent = context;
    }

    updateTime();
    setInterval(updateTime, 30000);

    // ── Diary card hover ──
    document.querySelectorAll('section div[style*="border-radius: var(--radius-lg)"]').forEach(card => {
      card.addEventListener('mouseenter', () => {
        card.style.background = 'var(--color-bg-card-hover)';
        card.style.borderColor = 'var(--border-color-hover)';
      });
      card.addEventListener('mouseleave', () => {
        card.style.background = 'var(--color-bg-card)';
        card.style.borderColor = 'var(--border-color)';
      });
    });
    </script>
