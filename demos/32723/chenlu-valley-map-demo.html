<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>晨露谷 · 地图版 Demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #efe6cf;
      --panel: rgba(255, 251, 242, 0.94);
      --line: #d9ca9e;
      --ink: #283126;
      --muted: #697160;
      --green: #5c7c4d;
      --green-deep: #40583b;
      --gold: #bd8d4f;
      --warn: #a35d48;
      --good: #4f7a57;
      --shadow: rgba(49, 39, 22, 0.16);
      --font: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06)),
        repeating-linear-gradient(90deg, rgba(126, 164, 96, 0.08) 0 1px, transparent 1px 28px),
        repeating-linear-gradient(0deg, rgba(126, 164, 96, 0.08) 0 1px, transparent 1px 28px),
        var(--bg);
    }

    button, textarea, select { font: inherit; }

    .app {
      width: min(1500px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(760px, 1.35fr) minmax(360px, 460px);
      gap: 16px;
    }

    .shell, .side {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 18px 44px var(--shadow);
      overflow: hidden;
    }

    .shell {
      display: grid;
      grid-template-rows: auto minmax(420px, 1fr) auto;
      min-height: calc(100vh - 32px);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(246, 236, 210, 0.94);
    }

    h1, h2, p { margin: 0; }

    .title {
      font-size: 24px;
      line-height: 1.15;
    }

    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #445a3e;
      color: #fbf8ef;
      background: linear-gradient(180deg, #5d7f52, #476741);
      box-shadow: 0 3px 0 #304b2e;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease, box-shadow 120ms ease;
    }

    .btn:hover { filter: brightness(1.03); }
    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #304b2e;
    }

    .btn.secondary {
      color: #384236;
      border-color: #c8b78d;
      background: linear-gradient(180deg, #f9f2dc, #ebdfbf);
      box-shadow: 0 3px 0 #d5c493;
    }

    .speed {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .speed select {
      min-height: 36px;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fffdf8;
      color: var(--ink);
    }

    .stage {
      position: relative;
      min-height: 420px;
      background: #e7ddc1;
      overflow: hidden;
    }

    .map-viewport {
      position: absolute;
      inset: 0;
      overflow: auto;
      background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,0.18), transparent 45%),
        #dfd4b3;
    }

    .map-board {
      position: relative;
      width: min(100%, 980px);
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      min-height: 420px;
      background: #cfc39e;
    }

    .map-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      user-select: none;
      pointer-events: none;
    }

    .route-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .location-layer,
    .actor-layer {
      position: absolute;
      inset: 0;
    }

    .marker {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 28px;
      min-height: 28px;
      border-radius: 999px;
      border: 2px solid rgba(255, 251, 244, 0.88);
      background: rgba(61, 86, 52, 0.94);
      box-shadow: 0 6px 18px rgba(22, 34, 23, 0.24);
      cursor: pointer;
    }

    .marker::after {
      content: attr(data-label);
      position: absolute;
      left: 50%;
      top: calc(100% + 8px);
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 12px;
      line-height: 1;
      padding: 6px 8px;
      border-radius: 999px;
      color: #2f392f;
      background: rgba(255, 251, 243, 0.92);
      border: 1px solid rgba(204, 190, 152, 0.9);
      box-shadow: 0 5px 14px rgba(62, 52, 33, 0.15);
    }

    .marker.current {
      background: rgba(187, 108, 77, 0.95);
    }

    .marker.target {
      background: rgba(102, 144, 179, 0.96);
    }

    .actor {
      position: absolute;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, #ffe2ad 0 28%, #557552 29% 58%, #2d3d2f 59% 100%);
      border: 2px solid rgba(255,255,255,0.92);
      box-shadow: 0 10px 18px rgba(16, 28, 17, 0.3);
      transition: left 680ms ease, top 680ms ease;
    }

    .actor::after {
      content: "阿禾";
      position: absolute;
      left: 50%;
      top: calc(100% + 8px);
      transform: translateX(-50%);
      white-space: nowrap;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 12px;
      color: #314032;
      background: rgba(255, 251, 244, 0.92);
      border: 1px solid rgba(206, 191, 152, 0.9);
    }

    .bubble {
      position: absolute;
      left: 18px;
      top: 18px;
      max-width: min(520px, calc(100% - 36px));
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(67, 82, 58, 0.18);
      background: rgba(255, 252, 244, 0.92);
      box-shadow: 0 10px 28px rgba(51, 62, 41, 0.2);
      font-size: 14px;
      line-height: 1.6;
      z-index: 2;
    }

    .ticker {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      background: rgba(244, 237, 218, 0.94);
      min-height: 54px;
      font-size: 14px;
      line-height: 1.6;
      color: #394439;
    }

    .side {
      min-height: calc(100vh - 32px);
      max-height: calc(100vh - 32px);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: auto;
    }

    .section {
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(208, 192, 151, 0.78);
      background: rgba(255, 252, 244, 0.84);
    }

    .section h2 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      padding: 10px;
      border-radius: 10px;
      background: rgba(246, 239, 223, 0.92);
      border: 1px solid rgba(216, 200, 160, 0.9);
    }

    .stat .k {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .stat .v {
      font-size: 20px;
      font-weight: 700;
    }

    .bars {
      display: grid;
      gap: 10px;
    }

    .bar-row {
      display: grid;
      gap: 6px;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .meter {
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(198, 184, 144, 0.9);
      background: #f1e9d2;
    }

    .meter > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #77af61, #4d7d4f);
    }

    .meter.hunger > span { background: linear-gradient(90deg, #d6ab53, #ba7941); }
    .meter.trust > span { background: linear-gradient(90deg, #72a9c7, #5972b4); }

    .hint-form {
      display: grid;
      gap: 10px;
    }

    textarea {
      width: 100%;
      min-height: 86px;
      resize: vertical;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fffdf8;
      color: var(--ink);
      line-height: 1.55;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .plan, .inventory, .diaries, .logs {
      display: grid;
      gap: 8px;
    }

    .list-item {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(247, 241, 226, 0.9);
      border: 1px solid rgba(214, 200, 161, 0.88);
      line-height: 1.55;
      font-size: 14px;
    }

    .list-item small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #f3ecd5;
      border: 1px solid #dfcfa4;
      font-size: 13px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 12px;
      color: #3d4a3c;
      background: rgba(95, 127, 83, 0.1);
      border: 1px solid rgba(95, 127, 83, 0.2);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
    }

    .dot.current { background: rgba(187, 108, 77, 0.95); }
    .dot.target { background: rgba(102, 144, 179, 0.96); }
    .dot.route { background: rgba(255, 247, 220, 0.95); border: 1px solid rgba(183, 146, 96, 0.9); }

    @media (max-width: 1160px) {
      .app { grid-template-columns: 1fr; }
      .shell { min-height: auto; }
      .side {
        min-height: auto;
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="shell">
      <div class="topbar">
        <div>
          <h1 class="title">晨露谷 · 地图版 Demo</h1>
          <p class="sub">直接使用你给的世界地图图做底图。角色会在地图上的各区域之间移动，你可以递一句直觉，也可以点地图标记给它一个去向念头。</p>
        </div>
        <div class="controls">
          <button class="btn" id="toggleBtn">开始自动演示</button>
          <button class="btn secondary" id="stepBtn">单步推进</button>
          <button class="btn secondary" id="resetBtn">重新开档</button>
          <label class="speed">速度
            <select id="speedSelect">
              <option value="1350">慢</option>
              <option value="900" selected>中</option>
              <option value="560">快</option>
            </select>
          </label>
        </div>
      </div>

      <div class="stage">
        <div class="bubble" id="thoughtBubble">天刚亮，阿禾在东边农场醒来，先看看今天该往哪边走。</div>
        <div class="map-viewport">
          <div class="map-board" id="mapBoard">
            <img
              class="map-image"
              id="mapImage"
              alt="晨露谷地图"
              src="../文档/assets/ChatGPT%20Image%202026年6月9日%2021_57_12.png"
            >
            <svg class="route-layer" id="routeLayer" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
            <div class="location-layer" id="locationLayer"></div>
            <div class="actor-layer">
              <div class="actor" id="actor"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="ticker" id="ticker">等你开始演示，地图上的角色就会自己跑一天。</div>
    </main>

    <aside class="side">
      <section class="section">
        <h2>当前状态</h2>
        <div class="stats" id="statsGrid"></div>
      </section>

      <section class="section">
        <h2>体力与信任</h2>
        <div class="bars">
          <div class="bar-row">
            <div class="bar-label"><span>体力</span><span id="energyText">0%</span></div>
            <div class="meter"><span id="energyBar" style="width:0%"></span></div>
          </div>
          <div class="bar-row">
            <div class="bar-label"><span>饥饿</span><span id="hungerText">0%</span></div>
            <div class="meter hunger"><span id="hungerBar" style="width:0%"></span></div>
          </div>
          <div class="bar-row">
            <div class="bar-label"><span>信任</span><span id="trustText">0%</span></div>
            <div class="meter trust"><span id="trustBar" style="width:0%"></span></div>
          </div>
        </div>
        <div class="legend">
          <span class="tag"><span class="dot current"></span> 当前所在</span>
          <span class="tag"><span class="dot target"></span> 当前目标</span>
          <span class="tag"><span class="dot route"></span> 本轮路线</span>
        </div>
      </section>

      <section class="section">
        <h2>递一句直觉</h2>
        <form class="hint-form" id="hintForm">
          <textarea id="hintInput" placeholder="例如：今天先去镇上把作物卖掉；或者：傍晚去缓川河岸散散心。"></textarea>
          <div class="row">
            <span class="muted" id="hintStatus">角色会在下一个规划点决定听不听。</span>
            <button class="btn" type="submit">提交直觉</button>
          </div>
        </form>
      </section>

      <section class="section">
        <h2>地图快捷念头</h2>
        <p class="muted">点地图上的地点标记，会自动生成一句“去那里”的直觉。</p>
      </section>

      <section class="section">
        <h2>当前计划</h2>
        <div class="plan" id="planList"></div>
      </section>

      <section class="section">
        <h2>库存</h2>
        <div class="inventory" id="inventoryList"></div>
      </section>

      <section class="section">
        <h2>最近日记</h2>
        <div class="diaries" id="diaryList"></div>
      </section>

      <section class="section">
        <h2>运行记录</h2>
        <div class="logs" id="logList"></div>
      </section>
    </aside>
  </div>

  <script>
    window.ChenluMapDemoCore = (() => {
      const LOCATIONS = {
        forest: { label: "雾林", x: 0.14, y: 0.14, kind: "wander" },
        mine: { label: "回音矿洞", x: 0.50, y: 0.17, kind: "mine" },
        north_road: { label: "北山旧道", x: 0.64, y: 0.08, kind: "wander" },
        pasture: { label: "山坡牧场", x: 0.81, y: 0.15, kind: "wander" },
        town: { label: "栖溪镇中心", x: 0.42, y: 0.40, kind: "sell" },
        riverbank: { label: "缓川河岸", x: 0.67, y: 0.47, kind: "wander" },
        east_farm: { label: "东边农场", x: 0.90, y: 0.49, kind: "farm" },
        station: { label: "谷口车站", x: 0.41, y: 0.69, kind: "wander" },
        bay: { label: "西海湾", x: 0.05, y: 0.42, kind: "wander" },
        farmhouse: { label: "农舍", x: 0.86, y: 0.48, kind: "rest" },
        shop: { label: "杂货铺", x: 0.36, y: 0.42, kind: "buy" }
      };

      const ACTIONS = ["move", "harvest", "water", "plant", "sell_all", "buy_food", "rest", "wander", "sleep", "eat"];

      const CROP_META = {
        parsnip: { name: "防风草", sell: 35, seed: "parsnip_seed", food: 0.18 },
        potato: { name: "土豆", sell: 80, seed: "potato_seed", food: 0.26 },
        strawberry: { name: "草莓", sell: 120, seed: "strawberry_seed", food: 0.30 }
      };

      const ITEM_META = {
        parsnip_seed: { name: "防风草种子", buy: 20 },
        potato_seed: { name: "土豆种子", buy: 50 },
        strawberry_seed: { name: "草莓种子", buy: 100 },
        bread: { name: "面包", buy: 15, food: 0.38 }
      };

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function pad2(value) {
        return String(value).padStart(2, "0");
      }

      function timeLabel(minutes) {
        const total = ((minutes % 1440) + 1440) % 1440;
        return `${pad2(Math.floor(total / 60))}:${pad2(total % 60)}`;
      }

      function seasonLabel(state) {
        return `${state.season} · 第 ${state.day} 天`;
      }

      function createInitialState() {
        return {
          day: 1,
          season: "春",
          year: 1,
          weather: "晴",
          timeMinutes: 390,
          energy: 0.85,
          hunger: 0.24,
          trust: 0.45,
          money: 120,
          location: "farmhouse",
          actorPos: { x: LOCATIONS.farmhouse.x, y: LOCATIONS.farmhouse.y },
          phase: "planning",
          targetLocation: "",
          route: [],
          plan: [],
          thought: "东边农场这边的活总得先顾住，再看今天要不要往镇上走。",
          ticker: "新的一天开始了。",
          pendingIntuition: null,
          lastIntuitionResult: null,
          intuitionLedger: null,
          hintSeq: 1,
          todayEvents: [],
          diaries: [
            { day: 0, text: "这地方真大。先把农场收拾出个样子，再慢慢认识这座谷。" }
          ],
          logs: [],
          inventory: {
            parsnip: 1,
            potato: 0,
            strawberry: 0,
            parsnip_seed: 3,
            potato_seed: 1,
            strawberry_seed: 0,
            bread: 2
          },
          farm: {
            ready: 2,
            watered: false,
            emptyPlots: 2
          }
        };
      }

      function addLog(state, text, kind = "info") {
        state.logs.unshift({ text, kind, stamp: `${seasonLabel(state)} ${timeLabel(state.timeMinutes)}` });
        state.logs = state.logs.slice(0, 18);
      }

      function submitIntuition(state, text) {
        const clean = String(text || "").trim();
        if (!clean) return null;
        const intuition = { id: `i${state.hintSeq++}`, text: clean };
        state.pendingIntuition = intuition;
        addLog(state, `你递来一句直觉：“${clean}”`, "hint");
        return intuition;
      }

      function locationPrompt(locationId) {
        const loc = LOCATIONS[locationId];
        if (!loc) return "";
        if (locationId === "town") return "今天去栖溪镇中心转转，顺便把收成卖掉";
        if (locationId === "shop") return "今天去杂货铺补一点种子和面包";
        if (locationId === "east_farm") return "今天先回东边农场把地里的活做稳";
        if (locationId === "farmhouse") return "今天别硬撑，早点回农舍休息";
        if (locationId === "riverbank") return "傍晚去缓川河岸散散心";
        return `今天去${loc.label}看看`;
      }

      function interpretIntuition(text) {
        const raw = String(text || "").trim();
        if (!raw) return { intent: "none", target: "" };
        if (/[卖镇中心赶集现钱]/.test(raw)) return { intent: "sell", target: "town" };
        if (/[杂货铺补货买面包买种子]/.test(raw)) return { intent: "buy", target: "shop" };
        if (/[东边农场农舍田地收割浇水播种]/.test(raw)) return { intent: "farm", target: "east_farm" };
        if (/[休息早点回家农舍睡]/.test(raw)) return { intent: "rest", target: "farmhouse" };
        if (/[缓川河岸河边散心走走]/.test(raw)) return { intent: "wander", target: "riverbank" };
        if (/[雾林]/.test(raw)) return { intent: "wander", target: "forest" };
        if (/[车站]/.test(raw)) return { intent: "wander", target: "station" };
        if (/[海湾]/.test(raw)) return { intent: "wander", target: "bay" };
        if (/[矿洞]/.test(raw)) return { intent: "mine", target: "mine" };
        return { intent: "none", target: "" };
      }

      function chooseSeedToPlant(state) {
        if ((state.inventory.parsnip_seed || 0) > 0) return "parsnip";
        if ((state.inventory.potato_seed || 0) > 0) return "potato";
        if ((state.inventory.strawberry_seed || 0) > 0) return "strawberry";
        return "";
      }

      function produceCount(state) {
        return (state.inventory.parsnip || 0) + (state.inventory.potato || 0) + (state.inventory.strawberry || 0);
      }

      function respondToIntuition(state, rng = Math.random) {
        if (!state.pendingIntuition) return null;
        const intuition = state.pendingIntuition;
        const parsed = interpretIntuition(intuition.text);
        let accept = false;
        let reason = "这念头先压着，眼前还有更急的事。";

        if (parsed.intent === "sell") {
          accept = produceCount(state) + state.farm.ready > 0 && state.trust >= 0.30;
          reason = accept ? "手里如果有收成，去镇上换钱确实最实在。" : "现在去赶集有点空手上阵，先不急。";
        } else if (parsed.intent === "buy") {
          accept = state.money >= 15 && state.trust >= 0.34;
          reason = accept ? "补点面包和种子，心里会更踏实。" : "这会儿钱得省着花，先看看再说。";
        } else if (parsed.intent === "farm") {
          accept = state.trust >= 0.25;
          reason = accept ? "农场总归是根本，先把地里的事做好。" : "我心里也知道该顾农场，但还想再掂量一下顺序。";
        } else if (parsed.intent === "rest") {
          accept = state.energy <= 0.6 || state.trust >= 0.66 || rng() > 0.5;
          reason = accept ? "硬撑并不体面，回农舍缓口气也值当。" : "今天身上还扛得住，先再走两步。";
        } else if (parsed.intent === "wander") {
          accept = state.energy > 0.38 && state.trust >= 0.42;
          reason = accept ? `去${LOCATIONS[parsed.target].label}转一圈，说不定心气会顺些。` : "今天先不散了，免得把正事晾着。";
        } else if (parsed.intent === "mine") {
          accept = false;
          reason = "矿洞现在还只是地图里的地方，这版 demo 还没把挖矿做进去。";
        } else {
          accept = state.trust >= 0.7 && rng() > 0.45;
          reason = accept ? "这念头说不清，但也许值得试试。" : "这句直觉太空，我还抓不住它的分量。";
        }

        state.lastIntuitionResult = {
          id: intuition.id,
          text: intuition.text,
          intent: parsed.intent,
          target: parsed.target,
          accept,
          reason
        };
        state.intuitionLedger = {
          text: intuition.text,
          intent: parsed.intent,
          target: parsed.target,
          accepted: accept,
          helpful: false
        };
        state.pendingIntuition = null;
        addLog(state, `阿禾对直觉的回应：${reason}`, accept ? "good" : "warn");
        return state.lastIntuitionResult;
      }

      function makeStep(action, params, reason) {
        return { action, params: params || {}, reason: reason || "" };
      }

      function routeTo(fromId, toId) {
        if (!toId || !LOCATIONS[toId]) return [];
        if (fromId === toId) return [toId];
        return [toId];
      }

      function decidePlan(state, rng = Math.random) {
        const intuition = respondToIntuition(state, rng);
        const plan = [];
        let target = "";

        if (state.timeMinutes >= 1200 || state.energy <= 0.16) {
          target = "farmhouse";
          if (state.location !== "farmhouse") plan.push(makeStep("move", { to: "farmhouse" }, "天色晚了，先回农舍。"));
          plan.push(makeStep("sleep", {}, "今天该收掉了。"));
        } else if (state.hunger >= 0.72 && ((state.inventory.bread || 0) > 0 || produceCount(state) > 0)) {
          plan.push(makeStep("eat", {}, "先垫一口，不然走不动。"));
          target = state.location;
        } else if (state.intuitionLedger?.accepted && state.intuitionLedger.intent === "sell") {
          if (state.farm.ready > 0) {
            if (state.location !== "east_farm") plan.push(makeStep("move", { to: "east_farm" }, "先回东边农场把熟的收上。"));
            plan.push(makeStep("harvest", {}, "熟了的不收就亏了。"));
          }
          if (state.location !== "town") plan.push(makeStep("move", { to: "town" }, "照那句念头去镇中心。"));
          plan.push(makeStep("sell_all", {}, "把今天能卖的先卖掉。"));
          target = "town";
        } else if (state.farm.ready > 0) {
          if (state.location !== "east_farm") plan.push(makeStep("move", { to: "east_farm" }, "先回农场。"));
          plan.push(makeStep("harvest", {}, "熟的先收下来。"));
          if (produceCount(state) + state.farm.ready >= 2) {
            plan.push(makeStep("move", { to: "town" }, "带去镇中心换点现钱。"));
            plan.push(makeStep("sell_all", {}, "卖掉收成。"));
            target = "town";
          } else {
            target = "east_farm";
          }
        } else if (!state.farm.watered) {
          if (state.location !== "east_farm") plan.push(makeStep("move", { to: "east_farm" }, "回地里补水。"));
          plan.push(makeStep("water", {}, "地不能干着。"));
          target = "east_farm";
        } else if (state.farm.emptyPlots > 0 && chooseSeedToPlant(state)) {
          if (state.location !== "east_farm") plan.push(makeStep("move", { to: "east_farm" }, "回去把空地续上。"));
          plan.push(makeStep("plant", { crop: chooseSeedToPlant(state) }, "趁还有种子，先把地补齐。"));
          target = "east_farm";
        } else if (state.intuitionLedger?.accepted && state.intuitionLedger.intent === "buy") {
          if (state.location !== "shop") plan.push(makeStep("move", { to: "shop" }, "去杂货铺补货。"));
          plan.push(makeStep("buy_food", {}, "顺手补一点面包和种子。"));
          target = "shop";
        } else if (state.intuitionLedger?.accepted && state.intuitionLedger.intent === "rest") {
          if (state.location !== "farmhouse") plan.push(makeStep("move", { to: "farmhouse" }, "先回农舍。"));
          plan.push(makeStep("rest", {}, "歇一会儿，把劲续回来。"));
          target = "farmhouse";
        } else if (state.intuitionLedger?.accepted && state.intuitionLedger.intent === "wander" && state.intuitionLedger.target) {
          if (state.location !== state.intuitionLedger.target) {
            plan.push(makeStep("move", { to: state.intuitionLedger.target }, `去${LOCATIONS[state.intuitionLedger.target].label}转转。`));
          }
          plan.push(makeStep("wander", { at: state.intuitionLedger.target }, "换口气，让脑子松一点。"));
          target = state.intuitionLedger.target;
        } else if (state.money < 30) {
          if (state.location !== "shop") plan.push(makeStep("move", { to: "shop" }, "去铺子看看最便宜还能补点什么。"));
          plan.push(makeStep("buy_food", {}, "不敢多买，先备一点面包。"));
          target = "shop";
        } else {
          const fallback = state.energy > 0.45 ? "riverbank" : "farmhouse";
          if (state.location !== fallback) {
            plan.push(makeStep("move", { to: fallback }, fallback === "riverbank" ? "去缓川河岸转一圈。" : "先回农舍缓缓。"));
          }
          plan.push(makeStep(fallback === "riverbank" ? "wander" : "rest", { at: fallback }, fallback === "riverbank" ? "让心里透透气。" : "先歇一下再说。"));
          target = fallback;
        }

        const cleaned = plan.filter(step => ACTIONS.includes(step.action)).slice(0, 5);
        state.plan = cleaned;
        state.targetLocation = target;
        state.route = target ? routeTo(state.location, target) : [];
        state.thought = buildThought(state, intuition, cleaned);
        state.ticker = cleaned.length
          ? `阿禾准备：${cleaned.map(step => step.reason).join(" / ")}`
          : "阿禾暂时还没拿定主意。";
        addLog(state, `新计划：${cleaned.map(step => step.action).join(" → ") || "无"}`, "plan");
        return { plan: cleaned, thought: state.thought, intuitionResult: intuition };
      }

      function buildThought(state, intuition, plan) {
        if (intuition?.accept) {
          return `“${intuition.text}”这念头今天倒像是说中了。${plan[0]?.reason || "先照着走一步。"}`
        }
        if (intuition && !intuition.accept) {
          return `${intuition.reason} 今天还是按我自己这套来。`;
        }
        if (state.farm.ready > 0) return "地图再大，也得先把东边农场里熟的东西收下来。";
        if (!state.farm.watered) return "地里要是忘了浇，明天就得后悔。";
        if (state.energy < 0.35) return "脚底有点发空，今天别把自己耗得太狠。";
        return "谷里路这么多，往哪边走都像一种心情。";
      }

      function advanceClock(state, minutes, energyDelta, hungerDelta) {
        state.timeMinutes += minutes;
        state.energy = clamp(state.energy + energyDelta, 0, 1);
        state.hunger = clamp(state.hunger + hungerDelta, 0, 1);
      }

      function moveActor(state, to) {
        if (!LOCATIONS[to]) return;
        state.location = to;
        state.actorPos = { x: LOCATIONS[to].x, y: LOCATIONS[to].y };
      }

      function applyAction(state, step) {
        const result = { action: step.action, endsDay: false };
        switch (step.action) {
          case "move": {
            const to = step.params.to;
            moveActor(state, to);
            state.route = routeTo(state.location, to);
            advanceClock(state, 40, -0.05, 0.05);
            state.todayEvents.push(`去了${LOCATIONS[to].label}`);
            state.ticker = `阿禾正在往${LOCATIONS[to].label}走。`;
            addLog(state, `阿禾从地图上动身去了${LOCATIONS[to].label}。`);
            break;
          }
          case "harvest": {
            const qty = state.farm.ready;
            if (qty > 0) {
              state.inventory.parsnip = (state.inventory.parsnip || 0) + qty;
              state.farm.ready = 0;
              advanceClock(state, 45, -0.08, 0.06);
              state.todayEvents.push(`在东边农场收下了 ${qty} 份作物`);
              state.ticker = "阿禾把东边农场里熟透的作物收了下来。";
              addLog(state, `今天在东边农场收下了 ${qty} 份作物。`, "good");
              if (state.intuitionLedger?.accepted && state.intuitionLedger.intent === "farm") state.intuitionLedger.helpful = true;
            } else {
              advanceClock(state, 15, -0.02, 0.02);
              addLog(state, "阿禾回地里看了一圈，今天没有彻底熟透的。");
            }
            break;
          }
          case "water": {
            if (!state.farm.watered) {
              state.farm.watered = true;
              advanceClock(state, 35, -0.06, 0.05);
              state.todayEvents.push("给农场的地浇了水");
              state.ticker = "地里的水总算补上了。";
              addLog(state, "阿禾把地里的水补齐了。", "good");
              if (state.intuitionLedger?.accepted && state.intuitionLedger.intent === "farm") state.intuitionLedger.helpful = true;
            } else {
              advanceClock(state, 10, -0.01, 0.02);
              addLog(state, "阿禾看了看田，今天已经浇过了。");
            }
            break;
          }
          case "plant": {
            const crop = step.params.crop || chooseSeedToPlant(state);
            const seed = CROP_META[crop]?.seed;
            if (crop && seed && state.farm.emptyPlots > 0 && (state.inventory[seed] || 0) > 0) {
              state.inventory[seed] -= 1;
              state.farm.emptyPlots -= 1;
              advanceClock(state, 28, -0.05, 0.04);
              state.todayEvents.push(`种下了${CROP_META[crop].name}`);
              state.ticker = `阿禾把${CROP_META[crop].name}种进了东边农场。`;
              addLog(state, `阿禾在东边农场种下了${CROP_META[crop].name}。`, "good");
              if (state.intuitionLedger?.accepted && state.intuitionLedger.intent === "farm") state.intuitionLedger.helpful = true;
            } else {
              advanceClock(state, 12, -0.01, 0.02);
              addLog(state, "阿禾想补种，但空地和种子没能正好对上。", "warn");
            }
            break;
          }
          case "sell_all": {
            let gained = 0;
            ["parsnip", "potato", "strawberry"].forEach(key => {
              const qty = state.inventory[key] || 0;
              if (qty > 0) {
                gained += qty * CROP_META[key].sell;
                state.inventory[key] = 0;
              }
            });
            if (gained > 0) {
              state.money += gained;
              advanceClock(state, 30, -0.02, 0.03);
              state.todayEvents.push(`在镇中心卖掉了收成，进账 ${gained} 金`);
              state.ticker = `阿禾在镇中心换回了 ${gained} 金。`;
              addLog(state, `今天在栖溪镇中心卖出收成，进账 ${gained} 金。`, "good");
              if (state.intuitionLedger?.accepted && state.intuitionLedger.intent === "sell") state.intuitionLedger.helpful = true;
            } else {
              advanceClock(state, 12, -0.01, 0.02);
              addLog(state, "阿禾到了镇上才发现手里压根没什么可卖。", "warn");
            }
            break;
          }
          case "buy_food": {
            let bought = [];
            if (state.money >= ITEM_META.bread.buy) {
              state.money -= ITEM_META.bread.buy;
              state.inventory.bread = (state.inventory.bread || 0) + 1;
              bought.push("面包");
            }
            if (state.money >= ITEM_META.parsnip_seed.buy) {
              state.money -= ITEM_META.parsnip_seed.buy;
              state.inventory.parsnip_seed = (state.inventory.parsnip_seed || 0) + 1;
              bought.push("防风草种子");
            }
            advanceClock(state, 24, -0.02, 0.03);
            if (bought.length) {
              state.todayEvents.push(`在杂货铺买了${bought.join("、")}`);
              state.ticker = `阿禾在杂货铺补了${bought.join("、")}。`;
              addLog(state, `阿禾在杂货铺补了${bought.join("、")}。`);
              if (state.intuitionLedger?.accepted && state.intuitionLedger.intent === "buy") state.intuitionLedger.helpful = true;
            } else {
              addLog(state, "阿禾摸了摸口袋，最后什么也没补成。", "warn");
            }
            break;
          }
          case "eat": {
            if ((state.inventory.bread || 0) > 0) {
              state.inventory.bread -= 1;
              advanceClock(state, 18, 0.07, -0.28);
              state.todayEvents.push("吃了面包");
              state.ticker = "阿禾吃了点面包，脸色缓过来一些。";
              addLog(state, "阿禾先用面包垫了肚子。", "good");
            } else {
              const edible = ["parsnip", "potato", "strawberry"].find(key => (state.inventory[key] || 0) > 0);
              if (edible) {
                state.inventory[edible] -= 1;
                advanceClock(state, 16, 0.05, -(CROP_META[edible].food || 0.2));
                state.todayEvents.push(`吃了${CROP_META[edible].name}`);
                addLog(state, `阿禾顺手吃了一个${CROP_META[edible].name}。`, "good");
              } else {
                advanceClock(state, 10, -0.01, 0.03);
                addLog(state, "阿禾翻了翻包，没找到能垫肚子的。", "warn");
              }
            }
            break;
          }
          case "rest": {
            advanceClock(state, 30, 0.15, 0.02);
            state.todayEvents.push("回农舍歇了一会儿");
            state.ticker = "阿禾回到农舍缓了缓，心口也顺了些。";
            addLog(state, "阿禾在农舍安静歇了一会儿。", "good");
            if (state.intuitionLedger?.accepted && state.intuitionLedger.intent === "rest") state.intuitionLedger.helpful = true;
            break;
          }
          case "wander": {
            const at = step.params.at || state.location;
            advanceClock(state, 26, -0.03, 0.04);
            state.todayEvents.push(`去了${LOCATIONS[at].label}散心`);
            state.ticker = `阿禾在${LOCATIONS[at].label}慢慢转了一圈。`;
            addLog(state, `阿禾去${LOCATIONS[at].label}转了转。`);
            if (state.intuitionLedger?.accepted && state.intuitionLedger.intent === "wander") state.intuitionLedger.helpful = true;
            break;
          }
          case "sleep": {
            if (state.location !== "farmhouse") {
              moveActor(state, "farmhouse");
            }
            state.todayEvents.push("夜里回农舍睡下");
            state.ticker = "天彻底黑了，阿禾回农舍歇下了。";
            addLog(state, "阿禾回农舍收掉了今天。");
            result.endsDay = true;
            break;
          }
          default:
            advanceClock(state, 10, -0.01, 0.02);
        }

        state.energy = clamp(state.energy, 0, 1);
        state.hunger = clamp(state.hunger, 0, 1);
        if (state.timeMinutes >= 1260 && step.action !== "sleep") result.endsDay = true;
        if (state.energy <= 0.04) {
          state.money = Math.max(0, state.money - 10);
          state.todayEvents.push("体力见底，只能提前收工");
          addLog(state, "阿禾体力见底，只能狼狈地提前回去。", "warn");
          result.endsDay = true;
        }
        return result;
      }

      function reflectDay(state) {
        let delta = 0;
        if (state.intuitionLedger?.accepted && state.intuitionLedger.helpful) delta += 0.06;
        else if (state.intuitionLedger?.accepted && !state.intuitionLedger.helpful && state.intuitionLedger.intent !== "none") delta -= 0.03;
        state.trust = clamp(state.trust + delta, 0, 1);

        const events = state.todayEvents.length ? state.todayEvents.slice(0, 4).join("，") : "今天平平稳稳地过去了";
        const diary =
          `第 ${state.day} 天。${events}。` +
          (state.money >= 160 ? "手头终于松快一点。" : state.energy < 0.3 ? "人是累了点。" : "日子还算在掌心里。") +
          (state.intuitionLedger
            ? state.intuitionLedger.accepted
              ? (state.intuitionLedger.helpful ? "那句直觉今天确实帮上了忙。" : "我试着听了那句直觉，但收效一般。")
              : "那句直觉我没照做，心里暂时还是更信自己这套。"
            : "今天没有额外的念头来搅局。");

        state.diaries.unshift({ day: state.day, text: diary });
        state.diaries = state.diaries.slice(0, 5);
        addLog(state, `睡前反思完成，信任变化 ${delta >= 0 ? "+" : ""}${delta.toFixed(2)}。`, delta >= 0 ? "good" : "warn");
        state.thought = delta > 0
          ? "夜里想起来，那句念头今天好像真替我省了点弯路。"
          : "躺下以后再回看一天，才知道哪些路是该走的。";
      }

      function startNextDay(state) {
        state.day += 1;
        state.timeMinutes = 390;
        state.energy = clamp(Math.max(state.energy, 0.25) + 0.56, 0, 1);
        state.hunger = clamp(state.hunger + 0.14, 0, 1);
        state.weather = ["晴", "晴", "多云", "微风"][state.day % 4];
        state.location = "farmhouse";
        state.actorPos = { x: LOCATIONS.farmhouse.x, y: LOCATIONS.farmhouse.y };
        state.phase = "planning";
        state.targetLocation = "";
        state.route = [];
        state.plan = [];
        state.todayEvents = [];
        state.lastIntuitionResult = null;
        state.intuitionLedger = null;
        state.farm.ready = Math.min(3, state.farm.ready + 1);
        state.farm.watered = false;
        state.farm.emptyPlots = clamp(state.farm.emptyPlots + (state.day % 2 === 0 ? 1 : 0), 0, 3);
        state.ticker = `第 ${state.day} 天清晨，天气${state.weather}。`;
        addLog(state, `第 ${state.day} 天开始了，天气${state.weather}。`, "plan");
      }

      function stepSimulation(state, rng = Math.random) {
        if (state.phase === "planning") {
          state.phase = "acting";
          return { phase: "planning", ...decidePlan(state, rng) };
        }

        if (state.phase === "acting") {
          const step = state.plan.shift() || makeStep("sleep", {}, "今天就先到这里。");
          const applied = applyAction(state, step);
          if (applied.endsDay) {
            reflectDay(state);
            startNextDay(state);
            return { phase: "ended_day", action: step };
          }
          if (!state.plan.length) state.phase = "planning";
          return { phase: "acting", action: step };
        }

        state.phase = "planning";
        return { phase: "idle" };
      }

      function simulateUntilNextDay(state, rng = Math.random, limit = 80) {
        const startDay = state.day;
        let count = 0;
        while (state.day === startDay && count < limit) {
          stepSimulation(state, rng);
          count += 1;
        }
        return count;
      }

      return {
        LOCATIONS,
        ACTIONS,
        CROP_META,
        ITEM_META,
        createInitialState,
        submitIntuition,
        locationPrompt,
        interpretIntuition,
        decidePlan,
        applyAction,
        stepSimulation,
        simulateUntilNextDay,
        seasonLabel,
        timeLabel
      };
    })();
  </script>

  <script>
    (() => {
      const core = window.ChenluMapDemoCore;
      const thoughtBubble = document.getElementById("thoughtBubble");
      const ticker = document.getElementById("ticker");
      const statsGrid = document.getElementById("statsGrid");
      const energyBar = document.getElementById("energyBar");
      const hungerBar = document.getElementById("hungerBar");
      const trustBar = document.getElementById("trustBar");
      const energyText = document.getElementById("energyText");
      const hungerText = document.getElementById("hungerText");
      const trustText = document.getElementById("trustText");
      const hintForm = document.getElementById("hintForm");
      const hintInput = document.getElementById("hintInput");
      const hintStatus = document.getElementById("hintStatus");
      const planList = document.getElementById("planList");
      const inventoryList = document.getElementById("inventoryList");
      const diaryList = document.getElementById("diaryList");
      const logList = document.getElementById("logList");
      const toggleBtn = document.getElementById("toggleBtn");
      const stepBtn = document.getElementById("stepBtn");
      const resetBtn = document.getElementById("resetBtn");
      const speedSelect = document.getElementById("speedSelect");
      const actor = document.getElementById("actor");
      const routeLayer = document.getElementById("routeLayer");
      const locationLayer = document.getElementById("locationLayer");

      let state = core.createInitialState();
      let timer = null;

      function seededRandomFactory(seed) {
        let x = seed >>> 0;
        return () => {
          x ^= x << 13;
          x ^= x >>> 17;
          x ^= x << 5;
          return ((x >>> 0) % 1000) / 1000;
        };
      }

      let rng = seededRandomFactory(77);

      function percent(value) {
        return `${Math.round(value * 100)}%`;
      }

      function moneyLabel(value) {
        return `${value} 金`;
      }

      function actionName(action) {
        return {
          move: "移动",
          harvest: "收割",
          water: "浇水",
          plant: "播种",
          sell_all: "卖收成",
          buy_food: "买补给",
          rest: "休息",
          wander: "闲逛",
          sleep: "睡觉",
          eat: "吃东西"
        }[action] || action;
      }

      function itemName(key) {
        return core.CROP_META[key]?.name || core.ITEM_META[key]?.name || key;
      }

      function locationName(key) {
        return core.LOCATIONS[key]?.label || key;
      }

      function renderStats() {
        const items = [
          { key: "日期", value: core.seasonLabel(state) },
          { key: "时间", value: core.timeLabel(state.timeMinutes) },
          { key: "天气", value: state.weather },
          { key: "位置", value: locationName(state.location) },
          { key: "金币", value: moneyLabel(state.money) },
          { key: "阶段", value: state.phase === "planning" ? "规划中" : "执行中" }
        ];
        statsGrid.innerHTML = items.map(item => `
          <div class="stat">
            <div class="k">${item.key}</div>
            <div class="v">${item.value}</div>
          </div>
        `).join("");

        energyBar.style.width = percent(state.energy);
        hungerBar.style.width = percent(state.hunger);
        trustBar.style.width = percent(state.trust);
        energyText.textContent = percent(state.energy);
        hungerText.textContent = percent(state.hunger);
        trustText.textContent = percent(state.trust);
      }

      function renderPlan() {
        if (!state.plan.length) {
          planList.innerHTML = `<div class="list-item">下一步还没定。<small>角色会在下一个规划点重新思考。</small></div>`;
          return;
        }
        planList.innerHTML = state.plan.map((step, index) => `
          <div class="list-item">
            <strong>${index + 1}. ${actionName(step.action)}</strong>
            <small>${step.reason}</small>
          </div>
        `).join("");
      }

      function renderInventory() {
        const keys = ["parsnip", "potato", "strawberry", "parsnip_seed", "potato_seed", "strawberry_seed", "bread"];
        const farmBits = [
          `待收作物 × ${state.farm.ready}`,
          `空地 × ${state.farm.emptyPlots}`,
          state.farm.watered ? "今日已浇水" : "今日未浇水"
        ];
        inventoryList.innerHTML = [
          ...keys.map(key => `<div class="pill">${itemName(key)} × ${state.inventory[key] || 0}</div>`),
          ...farmBits.map(text => `<div class="pill">${text}</div>`)
        ].join("");
      }

      function renderDiaries() {
        diaryList.innerHTML = state.diaries.map(entry => `
          <div class="list-item">
            <strong>第 ${entry.day} 天</strong>
            <small>${entry.text}</small>
          </div>
        `).join("");
      }

      function renderLogs() {
        logList.innerHTML = state.logs.map(entry => `
          <div class="list-item">
            ${entry.text}
            <small>${entry.stamp}</small>
          </div>
        `).join("");
      }

      function renderHintStatus() {
        if (state.pendingIntuition) {
          hintStatus.textContent = `已挂起：${state.pendingIntuition.text}`;
          return;
        }
        if (state.lastIntuitionResult) {
          hintStatus.textContent = `最近回应：${state.lastIntuitionResult.reason}`;
          return;
        }
        hintStatus.textContent = "角色会在下一个规划点决定听不听。";
      }

      function renderText() {
        thoughtBubble.textContent = state.thought;
        ticker.textContent = state.ticker;
        renderStats();
        renderPlan();
        renderInventory();
        renderDiaries();
        renderLogs();
        renderHintStatus();
      }

      function renderLocations() {
        const target = state.targetLocation;
        locationLayer.innerHTML = Object.entries(core.LOCATIONS).map(([id, loc]) => `
          <button
            class="marker ${state.location === id ? "current" : ""} ${target === id ? "target" : ""}"
            data-id="${id}"
            data-label="${loc.label}"
            style="left:${loc.x * 100}%; top:${loc.y * 100}%"
            title="点一下，给阿禾一个“去${loc.label}”的直觉"
          ></button>
        `).join("");

        locationLayer.querySelectorAll(".marker").forEach(button => {
          button.addEventListener("click", () => {
            const id = button.dataset.id;
            const text = core.locationPrompt(id);
            if (!text) return;
            core.submitIntuition(state, text);
            renderAll();
          });
        });
      }

      function renderActor() {
        actor.style.left = `${state.actorPos.x * 100}%`;
        actor.style.top = `${state.actorPos.y * 100}%`;
      }

      function renderRoute() {
        const start = core.LOCATIONS[state.location] || { x: state.actorPos.x, y: state.actorPos.y };
        const target = core.LOCATIONS[state.targetLocation];
        if (!target) {
          routeLayer.innerHTML = "";
          return;
        }
        const sx = start.x * 1000;
        const sy = start.y * 1000;
        const tx = target.x * 1000;
        const ty = target.y * 1000;
        const mx = (sx + tx) / 2;
        const my = Math.min(sy, ty) - 60;
        routeLayer.innerHTML = `
          <path
            d="M ${sx} ${sy} Q ${mx} ${my} ${tx} ${ty}"
            fill="none"
            stroke="rgba(255, 247, 220, 0.95)"
            stroke-width="10"
            stroke-linecap="round"
            stroke-dasharray="18 18"
          ></path>
          <path
            d="M ${sx} ${sy} Q ${mx} ${my} ${tx} ${ty}"
            fill="none"
            stroke="rgba(179, 143, 91, 0.78)"
            stroke-width="3"
            stroke-linecap="round"
            stroke-dasharray="18 18"
          ></path>
        `;
      }

      function renderAll() {
        renderText();
        renderLocations();
        renderActor();
        renderRoute();
      }

      function stepOnce() {
        const result = core.stepSimulation(state, rng);
        if (result.phase === "planning") {
          state.ticker = `阿禾想了想：${state.thought}`;
        } else if (result.phase === "ended_day") {
          state.ticker = `第 ${state.day - 1} 天结束，新的一天开始了。`;
        }
        renderAll();
      }

      function startAuto() {
        stopAuto();
        timer = setInterval(stepOnce, Number(speedSelect.value));
        toggleBtn.textContent = "暂停自动演示";
      }

      function stopAuto() {
        if (timer) clearInterval(timer);
        timer = null;
        toggleBtn.textContent = "开始自动演示";
      }

      toggleBtn.addEventListener("click", () => {
        if (timer) stopAuto();
        else startAuto();
      });

      stepBtn.addEventListener("click", () => {
        stopAuto();
        stepOnce();
      });

      resetBtn.addEventListener("click", () => {
        stopAuto();
        state = core.createInitialState();
        rng = seededRandomFactory(77);
        renderAll();
      });

      speedSelect.addEventListener("change", () => {
        if (timer) startAuto();
      });

      hintForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = hintInput.value.trim();
        if (!text) return;
        core.submitIntuition(state, text);
        hintInput.value = "";
        renderAll();
      });

      renderAll();
    })();
  </script>
</body>
</html>
