<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数字化交付系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@6.4.4/dist/antd.min.css" />
    <style>
        /* ===== 继承并适配卡片视图 ===== */
        * {
            box-sizing: border-box;
        }
        body {
            background: #0b1a2f;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }
        #root {
            height: 100vh;
            overflow: hidden;
        }
        .layout-container {
            height: 100vh;
            background: linear-gradient(145deg, #0b1a2f 0%, #13263f 100%);
            transition: background 0.3s;
        }

        /* ===== CSS 变量（仅控制颜色） ===== */
        :root {
            --bg-primary: #0b1a2f;
            --bg-secondary: #13263f;
            --bg-header: rgba(13, 30, 50, 0.85);
            --bg-sider: rgba(13, 30, 50, 0.75);
            --bg-card: rgba(18, 38, 60, 0.7);
            --border-color: rgba(43, 140, 255, 0.15);
            --text-primary: #e8f0fe;
            --text-secondary: #8ab4f8;
            --text-muted: #5a7a9a;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
            --table-header-bg: rgba(43, 140, 255, 0.06);
            --table-row-hover: rgba(43, 140, 255, 0.04);
            --table-row-selected: rgba(43, 140, 255, 0.08);
            --drawer-bg: #0b1a2f;
            --primary-color: #2b8cff;
            --primary-gradient: linear-gradient(135deg, #1a6bff, #2b8cff);
            --header-selector-bg: rgba(255, 255, 255, 0.05);
            --header-selector-border: rgba(43, 140, 255, 0.25);
            --header-selector-text: #e8f0fe;
            --btn-border: rgba(43, 140, 255, 0.2);
            --btn-bg: rgba(255, 255, 255, 0.03);
            --btn-text: #c8d8e8;
            --tag-bg: rgba(43, 140, 255, 0.12);
            --tag-text: #8ab4f8;
        }
        [data-theme="light-fresh"] {
            --bg-primary: #f0f4f8;
            --bg-secondary: #ffffff;
            --bg-header: rgba(255, 255, 255, 0.85);
            --bg-sider: rgba(255, 255, 255, 0.9);
            --bg-card: rgba(255, 255, 255, 0.9);
            --border-color: rgba(10, 104, 255, 0.1);
            --text-primary: #0a2540;
            --text-secondary: #1a5a8a;
            --text-muted: #7a8a9a;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --table-header-bg: rgba(10, 104, 255, 0.04);
            --table-row-hover: rgba(10, 104, 255, 0.02);
            --table-row-selected: rgba(10, 104, 255, 0.06);
            --drawer-bg: #f8fafc;
            --primary-color: #1677ff;
            --primary-gradient: linear-gradient(135deg, #1677ff, #4096ff);
            --header-selector-bg: rgba(0, 0, 0, 0.04);
            --header-selector-border: rgba(10, 104, 255, 0.2);
            --header-selector-text: #0a2540;
            --btn-border: rgba(10, 104, 255, 0.15);
            --btn-bg: rgba(255, 255, 255, 0.5);
            --btn-text: #0a2540;
            --tag-bg: rgba(10, 104, 255, 0.08);
            --tag-text: #1a5a8a;
        }
        [data-theme="dark-classic"] {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-header: rgba(10, 10, 10, 0.95);
            --bg-sider: rgba(10, 10, 10, 0.92);
            --bg-card: rgba(20, 20, 20, 0.8);
            --border-color: rgba(0, 150, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #66b3ff;
            --text-muted: #8a8a8a;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --table-header-bg: rgba(0, 150, 255, 0.08);
            --table-row-hover: rgba(0, 150, 255, 0.05);
            --table-row-selected: rgba(0, 150, 255, 0.1);
            --drawer-bg: #0a0a0a;
            --primary-color: #0a68ff;
            --primary-gradient: linear-gradient(135deg, #0a68ff, #3b8aff);
            --header-selector-bg: rgba(255, 255, 255, 0.06);
            --header-selector-border: rgba(0, 150, 255, 0.25);
            --header-selector-text: #ffffff;
            --btn-border: rgba(0, 150, 255, 0.2);
            --btn-bg: rgba(255, 255, 255, 0.04);
            --btn-text: #ffffff;
            --tag-bg: rgba(0, 150, 255, 0.15);
            --tag-text: #66b3ff;
        }

        /* ===== 布局与通用样式（与基准一致） ===== */
        .layout-container {
            background: var(--bg-secondary);
        }
        .site-header {
            background: var(--bg-header) !important;
            border-bottom: 1px solid var(--border-color) !important;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);  
            padding: 0 20px;
            display: flex;
            align-items: center;
            height: 48px;
            z-index: 10;
            flex-shrink: 0;
        }
        .sider {
            background: var(--bg-sider) !important;
            border-right: 1px solid var(--border-color) !important;
            box-shadow: 4px 0 30px rgba(0, 0, 0, 0.1);
            height: 100%;
            overflow: hidden;
            flex-shrink: 0;
        }
        .content-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            border-radius: 12px;
            padding: 16px 18px;
            min-height: 300px;
            height: 100%;
        }
        .sider .ant-menu,
        .sider .ant-menu-submenu-title,
        .sider .ant-menu-item {
            color: var(--text-secondary) !important;
        }
        .sider .ant-menu-item-selected {
            background: var(--table-row-selected) !important;
            color: var(--text-primary) !important;
            border-right-color: var(--text-secondary);
        }
        .sider .ant-menu-item:hover {
            color: var(--text-primary) !important;
        }
        .sider .ant-menu-submenu-open>.ant-menu-submenu-title {
            color: var(--text-primary) !important;
        }
        .sider-group-title {
            color: var(--text-secondary);
            border-bottom-color: var(--border-color);
        }
        .sider-group-title .anticon {
            color: var(--text-secondary);
        }
        .ant-menu-inline-collapsed .ant-menu-submenu-popup {
            background: var(--bg-sider) !important;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }
        .ant-menu-inline-collapsed .ant-menu-submenu-popup .ant-menu-item {
            color: var(--text-secondary) !important;
        }
        .ant-menu-inline-collapsed .ant-menu-submenu-popup .ant-menu-item-selected {
            background: var(--table-row-selected) !important;
            color: var(--text-primary) !important;
        }
        .ant-menu-inline-collapsed .ant-menu-submenu-popup .ant-menu-item:hover {
            color: var(--text-primary) !important;
        }

        .ant-table {
            background: transparent;
            color: var(--text-primary);
        }
        .ant-table-thead>tr>th {
            background: var(--table-header-bg) !important;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(43, 140, 255, 0.08);
            padding: 8px 12px !important;
            font-size: 13px;
        }
        .ant-table-tbody>tr>td {
            padding: 8px 12px !important;
            border-bottom: 1px solid rgba(43, 140, 255, 0.04);
            color: var(--text-primary);
        }
        .ant-table-tbody>tr:hover>td {
            background: var(--table-row-hover) !important;
        }
        .ant-table-tbody>tr.ant-table-row-selected>td {
            background: var(--table-row-selected) !important;
        }
        .ant-table-tbody>tr>td .ant-tag {
            background: var(--tag-bg);
            color: var(--tag-text);
            border: none;
        }
        .ant-table-tbody>tr>td .ant-tag-green {
            background: rgba(82, 196, 26, 0.15);
            color: #7bed7b;
        }
        .ant-table-tbody>tr>td .ant-tag-red {
            background: rgba(245, 34, 45, 0.12);
            color: #ff7a7a;
        }
        .ant-table-tbody>tr>td .ant-tag-orange {
            background: rgba(250, 173, 20, 0.12);
            color: #facc6a;
        }
        .ant-table-tbody .ant-btn-text {
            color: var(--text-secondary) !important;
        }
        .ant-table-tbody .ant-btn-text:hover {
            color: var(--text-primary) !important;
        }
        .ant-table-tbody .ant-btn-dangerous {
            color: #ff7a7a !important;
        }

        .ant-pagination {
            color: var(--text-secondary);
        }
        .ant-pagination-item {
            background: transparent;
            border: 1px solid rgba(43, 140, 255, 0.15);
            color: var(--text-secondary);
        }
        .ant-pagination-item-active {
            border-color: var(--text-secondary) !important;
            background: var(--text-secondary) !important;
        }
        .ant-pagination-item-active a {
            color: var(--bg-primary) !important;
        }
        .ant-pagination-prev .ant-pagination-item-link,
        .ant-pagination-next .ant-pagination-item-link {
            color: var(--text-secondary);
            border: 1px solid rgba(43, 140, 255, 0.15);
            background: transparent;
        }
        .ant-pagination-options .ant-select-selector {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid rgba(43, 140, 255, 0.15) !important;
            color: var(--text-secondary) !important;
        }
        .ant-pagination-options .ant-select-arrow {
            color: #5a7a9a;
        }

        .table-toolbar {
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .table-toolbar .ant-btn {
            border-radius: 16px;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: var(--btn-text);
            height: 30px;
            font-size: 13px;
            padding: 0 14px;
        }
        .table-toolbar .ant-btn-primary {
            background: var(--primary-gradient);
            border: none;
            box-shadow: 0 2px 12px rgba(43, 140, 255, 0.2);
            color: #fff;
        }
        .table-toolbar .ant-btn-primary:hover {
            box-shadow: 0 4px 20px rgba(43, 140, 255, 0.35);
            transform: translateY(-1px);
        }
        .table-toolbar .ant-input-search .ant-input {
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(43, 140, 255, 0.12);
            color: var(--text-primary);
            height: 30px;
        }
        .table-toolbar .ant-input-search .ant-input::placeholder {
            color: #5a7a9a;
        }
        .table-toolbar .ant-input-search .ant-input:focus {
            border-color: var(--text-secondary);
            box-shadow: 0 0 0 2px rgba(43, 140, 255, 0.1);
        }

        .breadcrumb-path {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(43, 140, 255, 0.08);
        }
        .breadcrumb-path .ant-breadcrumb {
            font-size: 13px;
        }
        .breadcrumb-path .ant-breadcrumb li {
            color: var(--text-secondary) !important;
        }
        .breadcrumb-path .ant-breadcrumb li:last-child {
            color: var(--text-primary) !important;
        }

        .detail-drawer .ant-drawer-header {
            background: var(--bg-header) !important;
            border-bottom: 1px solid var(--border-color);
        }
        .detail-drawer .ant-drawer-title {
            color: var(--text-primary);
        }
        .detail-drawer .ant-drawer-close {
            color: var(--text-secondary);
        }
        .detail-drawer .ant-drawer-body {
            background: var(--drawer-bg);
        }
        .detail-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 14px;
            margin-bottom: 6px;
        }
        .detail-item .label {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 1px;
        }
        .detail-item .value {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
        }
        .detail-collapse .ant-collapse {
            background: transparent;
            border: none;
        }
        .detail-collapse .ant-collapse-item {
            border-bottom: 1px solid var(--border-color);
        }
        .detail-collapse .ant-collapse-header {
            color: var(--text-primary) !important;
            font-weight: 500;
            padding: 10px 0 !important;
            font-size: 14px;
        }
        .detail-collapse .ant-collapse-content {
            background: transparent;
            border-top: none;
        }
        .detail-collapse .ant-collapse-content-box {
            padding: 6px 0 12px 0 !important;
        }
        .doc-list-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(43, 140, 255, 0.04);
            color: var(--text-primary);
        }
        .doc-list-item:last-child {
            border-bottom: none;
        }
        .doc-list-item .doc-name {
            flex: 1;
            color: var(--text-primary);
        }
        .doc-list-item .doc-type {
            color: var(--text-muted);
            font-size: 12px;
        }
        .realtime-value {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            background: rgba(43, 140, 255, 0.1);
            font-weight: 600;
            color: var(--text-secondary);
        }
        .realtime-value.online {
            background: rgba(82, 196, 26, 0.15);
            color: #7bed7b;
        }
        .realtime-value.offline {
            background: rgba(245, 34, 45, 0.12);
            color: #ff7a7a;
        }
        .drawer-status-tip {
            padding: 6px 12px;
            background: rgba(43, 140, 255, 0.04);
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-secondary);
            border-left: 3px solid var(--text-secondary);
        }
        .ant-collapse-extra {
            color: var(--text-muted) !important;
        }
        .ant-collapse-header-text {
            color: var(--text-primary);
        }
        .ant-tag-blue {
            background: var(--tag-bg);
            color: var(--tag-text);
        }
        .logo-area .logo-text {
            color: var(--text-primary);
        }
        .logo-area .logo-icon {
            color: var(--text-secondary);
        }
        .header-selector .ant-select-selector {
            border-color: var(--header-selector-border) !important;
            background: var(--header-selector-bg) !important;
            color: var(--header-selector-text) !important;
            border-radius: 20px !important;
        }
        .header-selector .ant-select-arrow {
            color: var(--text-secondary) !important;
        }
        .header-selector .ant-select-selection-item {
            color: var(--header-selector-text) !important;
        }

        .theme-switcher {
            margin-left: auto;
            display: flex;
            align-items: center;
        }
        .theme-switcher .ant-btn {
            border-radius: 16px !important;
            border: 1px solid var(--btn-border) !important;
            background: var(--btn-bg) !important;
            color: var(--btn-text) !important;
            height: 30px !important;
            padding: 0 14px !important;
            font-size: 13px !important;
            display: flex !important;
            align-items: center !important;
            gap: 4px !important;
        }
        .theme-switcher .ant-btn:hover {
            border-color: var(--text-secondary) !important;
            color: var(--text-primary) !important;
        }
        .theme-dropdown .ant-dropdown-menu-item {
            color: var(--text-primary) !important;
        }
        .theme-dropdown .ant-dropdown-menu-item:hover {
            background: var(--table-row-hover) !important;
        }
        .theme-dropdown .ant-dropdown-menu-item-selected {
            background: var(--table-row-selected) !important;
            color: var(--primary-color) !important;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(43, 140, 255, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(43, 140, 255, 0.5);
        }
        .ant-layout-sider-trigger {
            background: var(--bg-sider) !important;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        .ant-layout-sider-trigger:hover {
            color: var(--text-primary);
        }
        .ant-table-small .ant-table-thead>tr>th,
        .ant-table-small .ant-table-tbody>tr>td {
            padding: 6px 10px !important;
        }
        .ant-table-small .ant-table-tbody>tr>td {
            font-size: 13px;
        }
        .site-layout-content {
            padding: 12px 16px 16px 16px;
            height: 100%;
            overflow-y: auto;
            background: transparent;
        }

        /* ----- 属性定义侧边栏样式（浏览 & 编辑） ----- */
        .attr-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(43, 140, 255, 0.04);
        }
        .attr-item:last-child {
            border-bottom: none;
        }
        .attr-item .attr-name {
            font-weight: 500;
            color: var(--text-primary);
            flex: 0 0 100px;
        }
        .attr-item .attr-detail {
            color: var(--text-secondary);
            font-size: 13px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .attr-item .attr-detail .tag-fixed {
            background: rgba(43, 140, 255, 0.15);
            color: var(--text-secondary);
            border-radius: 10px;
            padding: 0 8px;
            font-size: 11px;
        }
        .attr-item .attr-detail .tag-dynamic {
            background: rgba(250, 173, 20, 0.15);
            color: #facc6a;
            border-radius: 10px;
            padding: 0 8px;
            font-size: 11px;
        }
        .attr-item .attr-detail .attr-type {
            color: var(--text-muted);
        }
        .attr-item .attr-detail .attr-required {
            color: #ff7a7a;
            font-size: 12px;
        }
        .attr-item .attr-detail .attr-default {
            color: var(--text-muted);
            font-size: 12px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .ant-tag {
            font-size: 12px;
        }

        .edit-attr-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(43, 140, 255, 0.04);
        }
        .edit-attr-item:last-child {
            border-bottom: none;
        }
        .edit-attr-item .ant-form-item {
            margin-bottom: 0;
            flex: 1;
        }
        .edit-attr-item .ant-form-item .ant-input,
        .edit-attr-item .ant-form-item .ant-select-selector {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--border-color);
            color: var(--text-primary);
        }
        .edit-attr-item .ant-form-item .ant-input:focus,
        .edit-attr-item .ant-form-item .ant-select-selector:focus {
            border-color: var(--text-secondary);
            box-shadow: 0 0 0 2px rgba(43, 140, 255, 0.1);
        }
        .edit-attr-item .ant-form-item .ant-select-arrow {
            color: var(--text-secondary);
        }
        .edit-attr-item .ant-btn {
            color: var(--text-secondary);
        }
        .edit-attr-item .ant-btn:hover {
            color: var(--text-primary);
        }
        .edit-attr-item .ant-btn-dangerous {
            color: #ff7a7a;
        }
        .edit-attr-item .ant-btn-dangerous:hover {
            color: #ff4d4f;
        }
        .edit-footer {
            margin-top: 16px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }
        .edit-footer .ant-btn {
            border-radius: 16px;
        }
        .edit-footer .ant-btn-primary {
            background: var(--primary-gradient);
            border: none;
        }
        .add-attr-btn {
            margin: 8px 0;
        }
        .add-attr-btn .ant-btn {
            border-radius: 16px;
            border-color: var(--border-color);
            color: var(--text-secondary);
        }
        .add-attr-btn .ant-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        /* ===== 位号专用样式 ===== */
        .tag-panel-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .tag-panel-table th,
        .tag-panel-table td {
            padding: 4px 8px;
            border-bottom: 1px solid rgba(43, 140, 255, 0.06);
            text-align: left;
            color: var(--text-primary);
        }
        .tag-panel-table th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 12px;
            background: rgba(43, 140, 255, 0.03);
        }
        .tag-panel-table .clickable {
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: underline dotted;
        }
        .tag-panel-table .clickable:hover {
            color: var(--text-primary);
        }
        .tag-panel-table .tag-edit-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 4px;
            padding: 2px 6px;
            width: 100%;
            font-size: 13px;
        }
        .tag-panel-table .tag-edit-input:focus {
            border-color: var(--text-secondary);
            outline: none;
            box-shadow: 0 0 0 2px rgba(43, 140, 255, 0.1);
        }
        .tag-action-btn {
            border-radius: 12px;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: var(--btn-text);
            height: 26px;
            font-size: 12px;
            padding: 0 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .tag-action-btn:hover {
            border-color: var(--text-secondary);

        const DataSelectionModal = ({ visible, title, data, columns, selectedKey, onConfirm, onCancel, searchKeyword,

            const rowSelection = {
                type: 'radio',
                selectedRowKeys: selectedKey ? [selectedKey] : [],
                onChange: (selectedRowKeys) => {
                    if (selectedRowKeys.length > 0) {
                        onConfirm(selectedRowKeys[0]);
                    }
                },
            };

            return (
                <Modal
                    title={title}
                    open={visible}
                    onCancel={onCancel}
                    footer={[
                        <Button key="cancel" onClick={onCancel}>取消</Button>,
                        <Button key="confirm" type="primary" onClick={() => {
                                if (selectedKey) {
                                    onConfirm(selectedKey);
                                } else {
                                    message.warning('请先选择一项数据');
                                }
                            }}>确认</Button>
                    ]}
                    width={700}
                    className="select-modal"
                >
                    <Search
                        placeholder="搜索..."
                        value={searchKeyword}
                        onChange={(e) => onSearch(e.target.value)}
                        style={{ marginBottom: 12 }}
                    />
                    <Table
                        columns={columns}
                        dataSource={data}
                        rowKey="key"
                        rowSelection={rowSelection}
                        pagination={false}
                        size="small"
                        scroll={{ y: 300 }}
                        onRow={(record) => ({
                            onClick: () => {
                                if (selectedKey !== record.key) {
                                    onConfirm(record.key);
                                }
                            },
                        })}
                    />
                </Modal>
            );
        };

        // ===== 主应用 =====

            const renderBrowseDetail = useCallback(() => {

                if (modelMenuKeys.includes(selectedKey)) {
                    const className = findMenuItemLabel(currentGroup, selectedKey) || '未命名类';
                    const fixedAttrsView = [

                        { name: '名称', type: 'string', required: true, default: '' },
                        { name: '型号', type: 'string', required: false, default: '' },

                                                {attr.default && <span className="attr-default">默认: {attr.default}</span>}

                const {
                    code, name, model, version, status, createTime,
                    location, videoMonitor,
                    realtime = {},
                    system, circuit,
                    serviceType, serviceScope,
                    controlledBy = [], controls = [],
                    history = [],
                    documents = [],
                    ...restProps
                } = detailRecord;

                const baseProps = { code, name, model, version, status, createTime, ...restProps };
                const baseEntries = Object.entries(baseProps).filter(([k]) => k !== 'key');

                                    <div className="label">系统</div>
                                    <div className="value">{system || '未指定'}</div>
                                </div>
                                <div className="detail-item">
                                    <div className="label">回路/管路</div>
                                    <div className="value">{circuit || '未指定'}</div>
                                </div>
                            </Panel>

                            <Panel header="服务类型" key="service" extra={<ThunderboltOutlined />}>

                                    <div className="label">服务类型</div>
                                    <div className="value">{serviceType || '未指定'}</div>
                                </div>
                                <div className="detail-item">
                                    <div className="label">服务范围</div>
                                    <div className="value">{serviceScope || '未指定'}</div>
                                </div>
                            </Panel>

                            <Panel header="控制关系" key="control" extra={<ControlOutlined />}>

                                                    ''}</div>
                                            </div>

                                        <div className="detail-item"><div className="value">无</div></div>

                                            <div className="value">{item.desc}</div>
                                        </div>
                                    ))
                                ) : (
                                    <div className="detail-item"><div className="value">暂无履历</div></div>
                                )}

                            <Panel header="图文资料" key="doc" extra={<FileTextOutlined />}>
                                {documents.length > 0 ? (
                                    documents.map((doc, idx) => (
                                        <div key={idx} className="doc-list-item">
                                            <FileTextOutlined style={{ color: '#2b8cff' }} />
                                            <span className="doc-name">{doc.name}</span>
                                            <span className="doc-type">{doc.type}</span>
                                        </div>
                                    ))
                                ) : (
                                    <div className="detail-item"><div className="value">暂无文档</div></div>
                                )}
                            </Panel>
                        </Collapse>
                    </div>
                );
            }, [isTagMenu, selectedKey, currentGroup, detailRecord, renderTagBrowsePanels, renderTagCardView, viewMode]);

            // ===== 编辑侧边栏入口 =====
            const renderEditDetail = useCallback(() => {
                if (isTagMenu) {
                    const tagData = editRecord;
                    if (!tagData || !tagData.code) {
                        return <div style={{ textAlign: 'center', padding: 40, color: '#5a7a9a' }}>请选择一条位号数据</div>;
                    }
                    if (!tagEditData || tagEditData.code !== tagData.code) {
                        setTagEditData(tagData);
                    }
                    const effectiveData = tagEditData || tagData;

                    if (viewMode === 'card') {
                        return renderTagCardView(effectiveData);
                    } else {
                        return renderTagEditPanels(effectiveData, setTagEditData);
                    }
                }

                // 数据模型管理编辑
                if (modelMenuKeys.includes(selectedKey)) {
                    const className = findMenuItemLabel(currentGroup, selectedKey) || '未命名类';
                    const addDynamicAttr = () => {
                        setDynamicAttrs([...dynamicAttrs, { name: '新属性', type: 'string', required: false, default: '' }]);
                    };
                    const removeDynamicAttr = (index) => {
                        const newList = [...dynamicAttrs];
                        newList.splice(index, 1);
                        setDynamicAttrs(newList);
                    };
                    const updateDynamicAttr = (index, field, value) => {
                        const newList = [...dynamicAttrs];
                        newList[index][field] = value;
                        setDynamicAttrs(newList);
                    };
                    const updateFixedAttr = (index, field, value) => {
                        const newList = [...fixedAttrs];
                        newList[index][field] = value;
                        setFixedAttrs(newList);
                    };
                    const handleSave = () => {
                        message.success('属性定义已保存 (模拟)');
                        setEditVisible(false);
                    };

                    return (
                        <div className="detail-collapse">
                            <div style={{ marginBottom: 16 }}>

                                    编辑属性 - {className}

                            <Collapse defaultActiveKey={['fixed', 'dynamic']} expandIconPosition="end" size="small">

                                        <div key={idx} className="edit-attr-item">
                                            <FormItem style={{ flex: '0 0 80px', marginBottom: 0 }}>
                                                <Input value={attr.name} onChange={(e) => updateFixedAttr(idx, 'name', e.target
                                                        .value)} placeholder="属性名" size="small" />
                                            </FormItem>
                                            <FormItem style={{ flex: '0 0 100px', marginBottom: 0 }}>
                                                <Select value={attr.type} onChange={(v) => updateFixedAttr(idx, 'type', v)}
                                                    size="small">
                                                    <Option value="string">string</Option>
                                                    <Option value="integer">integer</Option>
                                                    <Option value="float">float</Option>
                                                    <Option value="boolean">boolean</Option>
                                                    <Option value="datetime">datetime</Option>
                                                    <Option value="date">date</Option>
                                                    <Option value="enum">enum</Option>
                                                </Select>
                                            </FormItem>
                                            <FormItem style={{ flex: '0 0 60px', marginBottom: 0 }}>
                                                <Select value={attr.required} onChange={(v) => updateFixedAttr(idx, 'required',
                                                        v)} size="small">
                                                    <Option value={true}>必填</Option>
                                                    <Option value={false}>可选</Option>
                                                </Select>
                                            </FormItem>
                                            <FormItem style={{ flex: '1', marginBottom: 0 }}>
                                                <Input value={attr.default} onChange={(e) => updateFixedAttr(idx, 'default', e
                                                        .target.value)} placeholder="默认值" size="small" />
                                            </FormItem>
                                            <Tag className="tag-fixed" style={{ flexShrink: 0 }}>固定</Tag>
                                        </div>
                                    ))}
                                </Panel>
                                <Panel header="EAV 动态属性" key="dynamic" extra={<Tag color="orange">{dynamicAttrs.length} 项</Tag>}>

                                        <div key={idx} className="edit-attr-item">
                                            <FormItem style={{ flex: '0 0 80px', marginBottom: 0 }}>
                                                <Input value={attr.name} onChange={(e) => updateDynamicAttr(idx, 'name', e.target
                                                        .value)} placeholder="属性名" size="small" />
                                            </FormItem>
                                            <FormItem style={{ flex: '0 0 100px', marginBottom: 0 }}>
                                                <Select value={attr.type} onChange={(v) => updateDynamicAttr(idx, 'type', v)}
                                                    size="small">
                                                    <Option value="string">string</Option>
                                                    <Option value="integer">integer</Option>
                                                    <Option value="float">float</Option>
                                                    <Option value="boolean">boolean</Option>
                                                    <Option value="datetime">datetime</Option>
                                                    <Option value="date">date</Option>
                                                    <Option value="enum">enum</Option>

                                                <Select value={attr.required} onChange={(v) => updateDynamicAttr(idx, 'required',

                                                    <Option value={true}>必填</Option>
                                                    <Option value={false}>可选</Option>
                                                </Select>
                                            </FormItem>
                                            <FormItem style={{ flex: '1', marginBottom: 0 }}>
                                                <Input value={attr.default} onChange={(e) => updateDynamicAttr(idx, 'default', e
                                                        .target.value)} placeholder="默认值" size="small" />
                                            </FormItem>
                                            <Tooltip title="删除动态属性">
                                                <Button type="text" icon={<DeleteOutlined />} danger size="small" onClick={() =>
                                                        removeDynamicAttr(idx)} />
                                            </Tooltip>
                                        </div>
                                    ))}
                                    <div className="add-attr-btn">
                                        <Button type="dashed" icon={<PlusOutlined />} onClick={addDynamicAttr} size="small">
                                            添加动态属性
                                        </Button>
                                    </div>
                                </Panel>
                            </Collapse>
                            <div className="edit-footer">
                                <Button onClick={() => setEditVisible(false)}>取消</Button>
                                <Button type="primary" onClick={handleSave}>保存</Button>
                            </div>
                        </div>
                    );
                }

                return <div style={{ textAlign: 'center', padding: 40, color: '#5a7a9a' }}>当前功能不支持编辑</div>;
            }, [isTagMenu, selectedKey, editRecord, tagEditData, renderTagEditPanels, renderTagCardView, viewMode,
                modelMenuKeys, currentGroup, fixedAttrs, dynamicAttrs, setFixedAttrs, setDynamicAttrs
            ]);

            // ===== 处理空间选择 =====
            const handleSpaceSelect = (key) => {
                const selected = mockSpaces.find(s => s.key === key);
                if (selected) {
                    setTagEditData(prev => ({
                        ...prev,
                        space: {
                            code: selected.code,
                            name: selected.name,
                            attrs: selected.attrs || {}
                        }
                    }));
                    setSpaceModalVisible(false);
                    message.success(`已关联空间: ${selected.name}`);
                }
            };

            // ===== 处理回路选择 =====
            const handleCircuitSelect = (key) => {
                const selected = mockCircuits.find(c => c.key === key);
                if (selected) {
                    setTagEditData(prev => ({
                        ...prev,
                        circuit: {
                            sysCode: selected.sysCode,
                            sysName: selected.sysName,
                            circuitCode: selected.circuitCode,
                            circuitName: selected.circuitName,
                            attrs: selected.attrs || {}
                        }
                    }));
                    setCircuitModalVisible(false);
                    message.success(`已关联回路: ${selected.circuitName}`);
                }
            };

            // ===== 浏览/编辑操作 =====
            const handleBrowse = useCallback((record, e) => {
                if (e) e.stopPropagation();
                const fullData = getTagDetailByCode(record.code);
                setDetailRecord(fullData);
                setDetailVisible(true);
            }, []);

            const handleEdit = useCallback((record, e) => {
                if (e) e.stopPropagation();
                const fullData = getTagDetailByCode(record.code);
                setEditRecord(fullData);
                setTagEditData(fullData);
                setEditVisible(true);
            }, []);

            const handleStatusChange = useCallback((record, key, e) => {
                if (e) e.stopPropagation();
                message.info(`状态切换为 ${key} (${record.code})`);
            }, []);

                if (type === 'browse') {
                    setDetailVisible(false);
                    setDetailRecord(null);
                } else {
                    setEditVisible(false);
                    setEditRecord(null);
                    setTagEditData(null);
                }
            };

                message.success('位号数据已保存 (模拟)');
                setEditVisible(false);

                    key: 'action',
                    fixed: 'right',
                    width: 180,
                    render: (_, record) => (
                        <Space size="small" onClick={(e) => e.stopPropagation()}>
                            <Tooltip title="浏览">
                                <Button type="text" icon={<EyeOutlined />} size="small" onClick={(e) => handleBrowse(record,
                                    e)} />
                            </Tooltip>
                            <Tooltip title="编辑">
                                <Button type="text" icon={<EditOutlined />} size="small" onClick={(e) => handleEdit(record,
                                    e)} />
                            </Tooltip>
                            <Popconfirm
                                title="确认删除？"
                                onConfirm={() => message.success(`已删除 ${record.code}`)}
                                okText="确认"
                                cancelText="取消"
                                onClick={(e) => e && e.stopPropagation()}
                            >
                                <Tooltip title="删除">
                                    <Button type="text" icon={<DeleteOutlined />} size="small" danger onClick={(e) => e && e
                                            .stopPropagation()} />
                                </Tooltip>
                            </Popconfirm>
                            <Dropdown
                                menu={{
                                    items: [
                                        { key: '发布', label: <span>发布</span> },
                                        { key: '草稿', label: <span>草稿</span> },
                                        { key: '停用', label: <span>停用</span> },
                                    ],
                                    onClick: ({ key }) => handleStatusChange(record, key),
                                }}
                                trigger={['click']}
                            >
                                <Button type="text" size="small" onClick={(e) => e && e.stopPropagation()}>
                                    状态 <DownOutlined />
                                </Button>
                            </Dropdown>
                        </Space>
                    )
                };
                return [...baseCols, actionCol];
            }, [tableColumns, handleBrowse, handleEdit, handleStatusChange]);

            const rowSelection = {
                selectedRowKeys,
                onChange: (keys) => setSelectedRowKeys(keys),
                selections: [Table.SELECTION_ALL, Table.SELECTION_INVERT, Table.SELECTION_NONE],
            };

            // 工具栏
            const handleNew = () => message.info('新建功能 (模拟)');
            const handleImport = () => message.info('导入功能 (模拟)');
            const handleExport = () => message.info('导出功能 (模拟)');
            const handleDelete = () => {
                if (selectedRowKeys.length === 0) {
                    message.warning('请先选择数据');
                    return;
                }
                Modal.confirm({
                    title: '确认删除',
                    content: `确定要删除选中的 ${selectedRowKeys.length} 条数据吗？`,
                    onOk: () => {
                        message.success(`已删除 ${selectedRowKeys.length} 条数据`);
                        setSelectedRowKeys([]);
                    }
                });
            };
            const statusItems = [
                { key: '草稿', label: <span>草稿</span> },
                { key: '审核', label: <span>审核</span> },
                { key: '发布', label: <span>发布</span> },
                { key: '修改', label: <span>修改</span> },
                { key: '停用', label: <span>停用</span> },
            ];
            const handleBatchStatusChange = ({ key }) => {
                if (selectedRowKeys.length === 0) {
                    message.warning('请先选择数据');
                    return;
                }
                message.success(`已将选中的 ${selectedRowKeys.length} 条数据状态切换为「${key}」`);
            };

            const pagination = {
                showSizeChanger: true,
                showQuickJumper: true,
                showTotal: (total) => `共 ${total} 条`,
                defaultPageSize: 5,
                pageSizeOptions: ['5', '10', '20'],
                size: 'small',
            };

            const onSearch = (value) => setSearchText(value.trim());

            // 主题切换
            const themeItems = Object.entries(THEMES).map(([key, val]) => ({
                key,
                label: <span>{val.icon} {val.label}</span>,
            }));

            const handleThemeChange = ({ key }) => {
                setCurrentTheme(key);
                message.success(`已切换至 ${THEMES[key].label} 主题`);
            };

            const currentThemeConfig = THEMES[currentTheme] || THEMES['dark-tech'];

            // 空间/回路选择弹窗列
            const spaceColumns = [
                { title: '编码', dataIndex: 'code', key: 'code' },
                { title: '名称', dataIndex: 'name', key: 'name' },
                { title: '楼层', dataIndex: ['attrs', '楼层'], key: 'floor' },
                { title: '区域', dataIndex: ['attrs', '区域'], key: 'zone' },
                { title: '用途', dataIndex: ['attrs', '用途'], key: 'purpose' },
            ];

            const circuitColumns = [
                { title: '系统编码', dataIndex: 'sysCode', key: 'sysCode' },
                { title: '系统名称', dataIndex: 'sysName', key: 'sysName' },
                { title: '回路编码', dataIndex: 'circuitCode', key: 'circuitCode' },
                { title: '回路名称', dataIndex: 'circuitName', key: 'circuitName' },
                { title: '额定容量', dataIndex: ['attrs', '额定容量'], key: 'capacity' },
                { title: '电压等级', dataIndex: ['attrs', '电压等级'], key: 'voltage' },
            ];

            // 双击简式卡片弹窗
            const renderQuickModal = () => {
                if (!quickModalData) return null;
                const entries = Object.entries(quickModalData);
                return (
                    <div className="quick-card-grid">
                        {entries.map(([k, v]) => (
                            <div key={k} className="quick-card-item">
                                <div className="q-label">{k}</div>
                                <div className="q-value">{String(v)}</div>
                            </div>
                        ))}
                    </div>
                );
            };

            return (
                <ConfigProvider
                    theme={{
                        token: currentThemeConfig.token,
                        components: currentThemeConfig.components,
                    }}
                >
                    <Layout className="layout-container">
                        <Header className="site-header">
                            <div className="logo-area">
                                <span className="logo-icon"><BuildOutlined /></span>
                                <span className="logo-text" style={{ marginLeft: '15px' }}> 数字化交付</span>
                            </div>
                            <Select
                                className="header-selector"
                                value={currentGroupKey}
                                onChange={handleGroupChange}
                                style={{left: 100, width: 180 }}
                                placeholder="选择业务入口"
                            >
                                {menuGroups.map(group => (
                                    <Option key={group.key} value={group.key}>
                                        <Space>{group.icon}{group.label}</Space>
                                    </Option>
                                ))}
                            </Select>
                            <div className="theme-switcher">
                                <Dropdown
                                    menu={{
                                        items: themeItems,
                                        onClick: handleThemeChange,
                                        selectable: true,
                                        selectedKeys: [currentTheme],
                                    }}
                                    trigger={['click']}
                                    placement="bottomRight"
                                    overlayClassName="theme-dropdown"
                                >
                                    <Button size="small">
                                        <span style={{ marginRight: 4 }}>{currentThemeConfig.icon}</span>
                                        {currentThemeConfig.label}
                                    </Button>
                                </Dropdown>
                            </div>
                        </Header>

                        <Layout style={{ height: 'calc(100vh - 48px)' }}>
                            <Sider
                                collapsible
                                collapsed={collapsed}
                                onCollapse={handleCollapse}
                                width={200}
                                collapsedWidth={48}
                                theme="dark"
                                className="sider"
                                style={{ height: '100%', overflow: 'hidden' }}
                            >
                                <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
                                    <div className="sider-group-title">
                                        {currentGroup.icon}<span>{currentGroup.label}</span>
                                    </div>
                                    <Menu
                                        mode="inline"
                                        items={menuItems}
                                        selectedKeys={[selectedKey]}
                                        openKeys={openKeys}
                                        onOpenChange={handleOpenChange}
                                        onSelect={handleMenuSelect}
                                        inlineCollapsed={collapsed}
                                        style={{
                                            borderRight: 'none',
                                            flex: 1,
                                            overflow: 'auto',
                                            background: 'transparent',
                                            fontSize: 13,
                                        }}
                                        expandIcon={({ isOpen }) => (
                                            isOpen ? <MenuFoldOutlined style={{ fontSize: 12 }} /> :
                                            <MenuUnfoldOutlined style={{ fontSize: 12 }} />
                                        )}
                                    />
                                </div>
                            </Sider>

                            <Layout style={{ background: 'transparent', height: '100%', overflow: 'hidden' }}>
                                <Content className="site-layout-content">
                                    <div className="content-card">
                                        <div className="breadcrumb-path">
                                            <Space direction="vertical" size={2} style={{ width: '100%' }}>
                                                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                                    <Title level={5} style={{ margin: 0, fontWeight: 500, color: 'var(--text-primary)' }}>
                                                        {selectedLabel}
                                                    </Title>
                                                    <Tag color="var(--primary-color)" style={{ borderRadius: 10, background: 'rgba(43,140,255,0.15)', border: 'none', fontSize: 11 }}>
                                                        当前功能
                                                    </Tag>
                                                    {isTagMenu && (
                                                        <Tag color="green" style={{ borderRadius: 10, fontSize: 11 }}>
                                                            位号模式
                                                        </Tag>
                                                    )}
                                                </div>
                                                <Breadcrumb
                                                    items={selectedPath.map((label, idx) => ({
                                                        title: idx === selectedPath.length - 1 ?
                                                            <Text strong style={{ color: 'var(--text-primary)' }}>{label}</Text> :
                                                            <Text style={{ color: 'var(--text-secondary)' }}>{label}</Text>,
                                                    }))}
                                                    style={{ fontSize: 12 }}
                                                />
                                                <Divider style={{ margin: '6px 0 0 0', borderColor: 'var(--border-color)' }} />
                                            </Space>
                                        </div>

                                        <div className="table-toolbar">
                                            <Space wrap size={4}>
                                                <Button type="primary" icon={<PlusOutlined />} onClick={handleNew} size="small">新建</Button>
                                                <Button icon={<ImportOutlined />} onClick={handleImport} size="small">导入</Button>
                                                <Button icon={<ExportOutlined />} onClick={handleExport} size="small">导出</Button>
                                                <Button icon={<DeleteOutlined />} danger onClick={handleDelete} size="small">删除</Button>
                                                <Dropdown
                                                    menu={{ items: statusItems, onClick: handleBatchStatusChange }}
                                                    trigger={['click']}
                                                >
                                                    <Button size="small">状态 <DownOutlined /></Button>
                                                </Dropdown>
                                                <Search
                                                    placeholder="搜索"
                                                    allowClear
                                                    onSearch={onSearch}
                                                    onChange={(e) => { if (!e.target.value) setSearchText(''); }}
                                                    style={{ width: 160 }}
                                                    size="small"
                                                    prefix={<SearchOutlined />}
                                                />
                                                <span style={{ marginLeft: 4, color: 'var(--text-muted)', fontSize: 12 }}>
                                                    已选 {selectedRowKeys.length} 项
                                                </span>
                                            </Space>
                                        </div>

                                        <Table
                                            rowSelection={rowSelection}
                                            columns={columnsWithAction}
                                            dataSource={filteredData}
                                            pagination={pagination}
                                            bordered={false}
                                            size="small"
                                            striped={false}
                                            scroll={{ x: 'max-content' }}
                                            style={{ background: 'transparent' }}
                                        />
                                    </div>
                                </Content>
                            </Layout>
                        </Layout>
                    </Layout>

                    {/* 浏览侧边栏 */}
                    <Drawer
                        title={isTagMenu ? "位号详情 (浏览)" : "对象详情"}
                        placement="right"
                        onClose={() => onDrawerClose('browse')}
                        open={detailVisible}
                        width={isTagMenu && viewMode === 'card' ? 1200 : (isTagMenu ? 520 : 420)}
                        className="detail-drawer"
                        styles={{
                            body: { padding: '14px 16px', background: 'var(--drawer-bg)' },
                            header: { borderBottom: '1px solid var(--border-color)', background: 'var(--bg-header)' },
                        }}
                        extra={
                            isTagMenu ? (
                                <Button onClick={toggleViewMode} style={{ borderRadius: 16 }}>
                                    {viewMode === 'collapse' ? '卡片视图' : '折叠视图'}
                                </Button>
                            ) : null
                        }
                    >
                        {renderBrowseDetail()}
                    </Drawer>

                    {/* 编辑侧边栏 */}
                    <Drawer
                        title={isTagMenu ? "位号详情 (编辑)" : "编辑属性定义"}
                        placement="right"
                        onClose={() => onDrawerClose('edit')}
                        open={editVisible}
                        width={isTagMenu && viewMode === 'card' ? 1200 : (isTagMenu ? 580 : 480)}
                        className="detail-drawer"
                        styles={{
                            body: { padding: '14px 16px', background: 'var(--drawer-bg)' },
                            header: { borderBottom: '1px solid var(--border-color)', background: 'var(--bg-header)' },
                        }}
                        extra={
                            isTagMenu ? (
                                <Space>
                                    <Button onClick={toggleViewMode} style={{ borderRadius: 16 }}>
                                        {viewMode === 'collapse' ? '卡片视图' : '折叠视图'}
                                    </Button>
                                    <Button type="primary" onClick={handleSaveTagEdit} style={{ borderRadius: 16 }}>
                                        <CheckOutlined /> 保存
                                    </Button>
                                </Space>
                            ) : null
                        }
                    >
                        {renderEditDetail()}
                    </Drawer>

                    {/* 双击简式卡片弹窗 */}
                    <Modal
                        title={quickModalTitle || '详情'}
                        open={quickModalVisible}
                        onCancel={() => setQuickModalVisible(false)}
                        width={420}
                        className="quick-card-modal"
                        footer={[
                            <Button key="close" onClick={() => setQuickModalVisible(false)}>
                                关闭
                            </Button>
                        ]}
                    >
                        {renderQuickModal()}
                    </Modal>

                    {/* 空间选择弹窗 */}
                    <DataSelectionModal
                        visible={spaceModalVisible}
                        title="选择空间"
                        data={mockSpaces.filter(s => s.name.includes(spaceSearchKeyword) || s.code.includes(spaceSearchKeyword))}
                        columns={spaceColumns}
                        selectedKey={selectedSpaceKey}
                        onConfirm={(key) => {
                            setSelectedSpaceKey(key);
                            handleSpaceSelect(key);
                        }}
                        onCancel={() => {
                            setSpaceModalVisible(false);
                            setSelectedSpaceKey(null);
                            setSpaceSearchKeyword('');
                        }}
                        searchKeyword={spaceSearchKeyword}
                        onSearch={setSpaceSearchKeyword}
                    />

                    {/* 回路选择弹窗 */}
                    <DataSelectionModal
                        visible={circuitModalVisible}
                        title="选择回路"
                        data={mockCircuits.filter(c => c.circuitName.includes(circuitSearchKeyword) || c.circuitCode.includes(
                            circuitSearchKeyword))}
                        columns={circuitColumns}
                        selectedKey={selectedCircuitKey}
                        onConfirm={(key) => {
                            setSelectedCircuitKey(key);
                            handleCircuitSelect(key);
                        }}
                        onCancel={() => {
                            setCircuitModalVisible(false);
                            setSelectedCircuitKey(null);
                            setCircuitSearchKeyword('');
                        }}
                        searchKeyword={circuitSearchKeyword}
                        onSearch={setCircuitSearchKeyword}
                    />
                </ConfigProvider>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
