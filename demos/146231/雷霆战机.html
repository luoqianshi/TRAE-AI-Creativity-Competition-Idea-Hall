<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷霆战机 - Thunder Fighter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Microsoft YaHei', sans-serif;
  overflow: hidden;
}
#gameContainer {
  position: relative;
  width: 480px;
  height: 720px;
  box-shadow: 0 0 50px rgba(0, 150, 255, 0.3);
  border: 2px solid #0066cc;
  border-radius: 8px;
  overflow: hidden;
}
#gameCanvas {
  display: block;
  background: #000011;
}
/* 开始界面 */
#startScreen {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(180deg, #000022 0%, #001133 50%, #000022 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
#startScreen h1 {
  font-size: 48px;
  color: #00ccff;
  text-shadow: 0 0 20px #00ccff, 0 0 40px #0088ff;
  margin-bottom: 10px;
  letter-spacing: 8px;
  animation: titleGlow 2s ease-in-out infinite alternate;
}
@keyframes titleGlow {
  from { text-shadow: 0 0 20px #00ccff, 0 0 40px #0088ff; }
  to { text-shadow: 0 0 30px #00ffff, 0 0 60px #00aaff, 0 0 80px #0066ff; }
}
#startScreen .subtitle {
  color: #6699cc;
  font-size: 14px;
  margin-bottom: 40px;
  letter-spacing: 4px;
}
/* 飞机选择 */
#planeSelect {
  display: flex;
  gap: 20px;
  margin-bottom: 30px;
}
.plane-option {
  width: 100px;
  height: 120px;
  border: 2px solid #336699;
  border-radius: 10px;
  background: rgba(0, 50, 100, 0.3);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}
.plane-option:hover {
  border-color: #00ccff;
  background: rgba(0, 100, 200, 0.4);
  transform: translateY(-5px);
  box-shadow: 0 5px 20px rgba(0, 200, 255, 0.3);
}
.plane-option.selected {
  border-color: #00ff88;
  background: rgba(0, 255, 100, 0.2);
  box-shadow: 0 0 20px rgba(0, 255, 100, 0.4);
}
.plane-option canvas {
  width: 60px;
  height: 60px;
}
.plane-option .plane-name {
  color: #aaccff;
  font-size: 12px;
  margin-top: 8px;
}
.plane-option .plane-desc {
  color: #6688aa;
  font-size: 10px;
  margin-top: 4px;
}
/* 难度选择 */
#difficultySelect {
  display: flex;
  gap: 15px;
  margin-bottom: 30px;
}
.difficulty-btn {
  padding: 8px 20px;
  border: 2px solid #336699;
  border-radius: 20px;
  background: rgba(0, 50, 100, 0.3);
  color: #aaccff;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
}
.difficulty-btn:hover {
  border-color: #00ccff;
  color: #00ccff;
}
.difficulty-btn.selected {
  border-color: #00ff88;
  color: #00ff88;
  background: rgba(0, 255, 100, 0.2);
}
.difficulty-label {
  color: #6699cc;
  font-size: 14px;
  margin-bottom: 10px;
}
/* 开始按钮 */
#startBtn {
  padding: 15px 60px;
  font-size: 20px;
  background: linear-gradient(180deg, #0088ff 0%, #0044aa 100%);
  border: none;
  border-radius: 30px;
  color: white;
  cursor: pointer;
  letter-spacing: 5px;
  transition: all 0.3s;
  box-shadow: 0 5px 20px rgba(0, 100, 255, 0.5);
}
#startBtn:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 30px rgba(0, 150, 255, 0.7);
}
#startBtn:active {
  transform: scale(0.98);
}
/* 最高分 */
#highScoreDisplay {
  margin-top: 20px;
  color: #ffcc00;
  font-size: 16px;
  text-shadow: 0 0 10px rgba(255, 200, 0, 0.5);
}
/* 操作说明 */
#instructions {
  margin-top: 30px;
  color: #557799;
  font-size: 12px;
  text-align: center;
  line-height: 1.8;
}
/* 游戏结束界面 */
#gameOverScreen {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 20, 0.9);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
#gameOverScreen h2 {
  font-size: 42px;
  color: #ff3366;
  text-shadow: 0 0 20px #ff3366;
  margin-bottom: 30px;
  letter-spacing: 5px;
}
#finalScore {
  color: #ffcc00;
  font-size: 28px;
  margin-bottom: 10px;
}
#newHighScore {
  color: #00ff88;
  font-size: 20px;
  margin-bottom: 20px;
  animation: newHighPulse 0.8s ease-in-out infinite alternate;
  display: none;
}
@keyframes newHighPulse {
  from { transform: scale(1); }
  to { transform: scale(1.1); }
}
#gameStats {
  color: #aaccff;
  font-size: 14px;
  line-height: 2;
  margin-bottom: 30px;
  text-align: center;
}
#restartBtn {
  padding: 12px 50px;
  font-size: 18px;
  background: linear-gradient(180deg, #00cc66 0%, #008844 100%);
  border: none;
  border-radius: 25px;
  color: white;
  cursor: pointer;
  letter-spacing: 4px;
  transition: all 0.3s;
  box-shadow: 0 5px 20px rgba(0, 200, 100, 0.5);
}
#restartBtn:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 30px rgba(0, 255, 100, 0.6);
}
/* 暂停界面 */
#pauseScreen {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 20, 0.85);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
#pauseScreen h2 {
  font-size: 36px;
  color: #00ccff;
  margin-bottom: 40px;
  letter-spacing: 5px;
}
.pause-btn {
  width: 200px;
  padding: 12px;
  margin: 8px;
  font-size: 16px;
  background: rgba(0, 100, 200, 0.3);
  border: 2px solid #0088cc;
  border-radius: 25px;
  color: #aaddff;
  cursor: pointer;
  transition: all 0.3s;
}
.pause-btn:hover {
  background: rgba(0, 150, 255, 0.5);
  border-color: #00ccff;
  color: white;
}
/* HUD */
#hud {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  padding: 10px 15px;
  display: none;
  justify-content: space-between;
  align-items: flex-start;
  z-index: 5;
  pointer-events: none;
}
#hudLeft {
  color: #aaddff;
  font-size: 13px;
  line-height: 1.6;
}
#hudRight {
  text-align: right;
  color: #ffcc00;
  font-size: 13px;
  line-height: 1.6;
}
#scoreDisplay {
  font-size: 20px;
  font-weight: bold;
  text-shadow: 0 0 10px rgba(255, 200, 0, 0.5);
}
#comboDisplay {
  color: #ff6600;
  font-size: 16px;
  font-weight: bold;
  display: none;
  text-shadow: 0 0 10px rgba(255, 100, 0, 0.5);
}
/* 状态栏图标 */
.status-icons {
  display: flex;
  gap: 8px;
  margin-top: 5px;
}
.status-icon {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: bold;
  opacity: 0;
  transition: opacity 0.3s;
}
.status-icon.active {
  opacity: 1;
  animation: statusPulse 1s ease-in-out infinite alternate;
}
@keyframes statusPulse {
  from { transform: scale(1); }
  to { transform: scale(1.1); }
}
#shieldIcon {
  background: rgba(0, 255, 100, 0.3);
  border: 2px solid #00ff66;
  color: #00ff66;
}
#magnetIcon {
  background: rgba(200, 100, 255, 0.3);
  border: 2px solid #cc66ff;
  color: #cc66ff;
}
/* 血条 */
#healthBar {
  width: 120px;
  height: 12px;
  background: rgba(100, 0, 0, 0.5);
  border: 1px solid #ff3333;
  border-radius: 6px;
  overflow: hidden;
  margin-top: 4px;
}
#healthFill {
  height: 100%;
  background: linear-gradient(90deg, #ff3333, #ff6666);
  transition: width 0.3s;
  border-radius: 6px;
}
/* 炸弹数量 */
#bombCount {
  color: #ff9900;
}
/* 技能条 */
#skillBar {
  width: 120px;
  height: 10px;
  background: rgba(50, 0, 80, 0.5);
  border: 1px solid #cc66ff;
  border-radius: 5px;
  overflow: hidden;
  margin-top: 4px;
  position: relative;
}
#skillFill {
  height: 100%;
  background: linear-gradient(90deg, #9933ff, #cc66ff, #ff99ff);
  transition: width 0.2s;
  border-radius: 5px;
}
#skillLabel {
  color: #cc99ff;
  font-size: 11px;
  margin-top: 2px;
}
#skillReady {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #ffffff;
  font-size: 10px;
  font-weight: bold;
  text-shadow: 0 0 5px #cc66ff;
  display: none;
}

/* 成就通知 */
#achievementNotify {
  position: absolute;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: linear-gradient(135deg, #1a1a3e, #2a1a4e);
  border: 2px solid #ffcc00;
  border-radius: 12px;
  padding: 12px 20px;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 0 30px rgba(255, 200, 0, 0.5);
  transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  pointer-events: none;
}
#achievementNotify.show {
  transform: translateX(-50%) translateY(0);
}
#achievementIcon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ffcc00, #ff9900);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 0 15px rgba(255, 200, 0, 0.6);
}
#achievementText {
  text-align: left;
}
#achievementTitle {
  color: #ffcc00;
  font-size: 12px;
  font-weight: bold;
}
#achievementName {
  color: #ffffff;
  font-size: 15px;
  font-weight: bold;
  margin-top: 2px;
}

/* 剧情动画 */
#storyScreen {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #000;
  display: none;
  z-index: 15;
  overflow: hidden;
}
#storyText {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #00ccff;
  font-size: 18px;
  text-align: center;
  line-height: 2;
  max-width: 380px;
  opacity: 0;
  transition: opacity 1s;
  text-shadow: 0 0 10px #00ccff;
}
#storySkip {
  position: absolute;
  bottom: 30px;
  right: 30px;
  color: #666;
  font-size: 12px;
  cursor: pointer;
  z-index: 5;
}
#storySkip:hover {
  color: #aaa;
}

/* 成就面板 */
#achievementPanel {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 400px;
  max-height: 500px;
  background: linear-gradient(180deg, #0a0a2e, #1a0a3e);
  border: 2px solid #6666aa;
  border-radius: 15px;
  padding: 20px;
  z-index: 12;
  display: none;
  overflow-y: auto;
}
#achievementPanel h3 {
  color: #ffcc00;
  text-align: center;
  margin-bottom: 15px;
  font-size: 20px;
  letter-spacing: 3px;
}
.achievement-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  margin-bottom: 8px;
  background: rgba(50, 50, 100, 0.3);
  border-radius: 8px;
  border: 1px solid #444477;
  transition: all 0.3s;
}
.achievement-item.unlocked {
  border-color: #ffcc00;
  background: rgba(100, 80, 0, 0.3);
}
.achievement-item .ach-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #333355;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.achievement-item.unlocked .ach-icon {
  background: linear-gradient(135deg, #ffcc00, #ff9900);
  box-shadow: 0 0 10px rgba(255, 200, 0, 0.5);
}
.achievement-item .ach-info {
  flex: 1;
}
.achievement-item .ach-name {
  color: #666;
  font-size: 13px;
  font-weight: bold;
}
.achievement-item.unlocked .ach-name {
  color: #ffcc00;
}
.achievement-item .ach-desc {
  color: #555;
  font-size: 11px;
  margin-top: 2px;
}
.achievement-item.unlocked .ach-desc {
  color: #aaa;
}
#closeAchBtn {
  display: block;
  margin: 15px auto 0;
  padding: 8px 30px;
  background: rgba(100, 100, 200, 0.3);
  border: 1px solid #6666aa;
  border-radius: 20px;
  color: #aaccff;
  cursor: pointer;
  font-size: 13px;
}
#closeAchBtn:hover {
  background: rgba(100, 100, 200, 0.5);
}

/* 游戏评价 */
#gameRating {
  font-size: 24px;
  color: #ffcc00;
  margin: 15px 0;
  letter-spacing: 8px;
  text-shadow: 0 0 15px rgba(255, 200, 0, 0.7);
}
#ratingDesc {
  color: #aaddff;
  font-size: 13px;
  margin-bottom: 10px;
}

/* 音效开关 */
#soundToggle {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(0, 50, 100, 0.5);
  border: 1px solid #336699;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  z-index: 20;
  color: #66aadd;
  transition: all 0.3s;
}
#soundToggle:hover {
  background: rgba(0, 100, 200, 0.5);
}

/* 主菜单成就按钮 */
#achievementBtn {
  margin-top: 15px;
  padding: 8px 25px;
  background: rgba(100, 50, 150, 0.3);
  border: 1px solid #9966cc;
  border-radius: 20px;
  color: #cc99ff;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.3s;
}
#achievementBtn:hover {
  background: rgba(150, 80, 200, 0.4);
  border-color: #cc99ff;
}

/* 大招特效文字 */
#ultimateText {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 48px;
  color: #ffcc00;
  text-shadow: 0 0 20px #ff6600, 0 0 40px #ff3300;
  z-index: 8;
  pointer-events: none;
  opacity: 0;
  letter-spacing: 10px;
}
#ultimateText.show {
  animation: ultimateFlash 1.5s ease-out forwards;
}
@keyframes ultimateFlash {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
  30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
  70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
}
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="480" height="720"></canvas>
  
  <!-- 音效开关 -->
  <div id="soundToggle">🔊</div>
  
  <!-- 成就通知 -->
  <div id="achievementNotify">
    <div id="achievementIcon">🏆</div>
    <div id="achievementText">
      <div id="achievementTitle">成就解锁</div>
      <div id="achievementName">初次上阵</div>
    </div>
  </div>
  
  <!-- 剧情动画 -->
  <div id="storyScreen">
    <div id="storyText"></div>
    <div id="storySkip">点击跳过 ▶</div>
  </div>
  
  <!-- 成就面板 -->
  <div id="achievementPanel">
    <h3>🏆 成就列表</h3>
    <div id="achievementList"></div>
    <button id="closeAchBtn">关闭</button>
  </div>
  
  <!-- 大招特效文字 -->
  <div id="ultimateText">雷霆万钧</div>
  
  <!-- 开始界面 -->
  <div id="startScreen">
    <h1>雷霆战机</h1>
    <div class="subtitle">THUNDER FIGHTER</div>
    
    <div class="difficulty-label">选择战机</div>
    <div id="planeSelect">
      <div class="plane-option selected" data-plane="0">
        <canvas id="plane0Preview" width="60" height="60"></canvas>
        <div class="plane-name">闪电</div>
        <div class="plane-desc">均衡型</div>
      </div>
      <div class="plane-option" data-plane="1">
        <canvas id="plane1Preview" width="60" height="60"></canvas>
        <div class="plane-name">烈焰</div>
        <div class="plane-desc">高火力</div>
      </div>
      <div class="plane-option" data-plane="2">
        <canvas id="plane2Preview" width="60" height="60"></canvas>
        <div class="plane-name">幻影</div>
        <div class="plane-desc">散射型</div>
      </div>
    </div>
    
    <div class="difficulty-label">选择难度</div>
    <div id="difficultySelect">
      <div class="difficulty-btn" data-diff="easy">简单</div>
      <div class="difficulty-btn selected" data-diff="normal">普通</div>
      <div class="difficulty-btn" data-diff="hard">困难</div>
    </div>
    
    <button id="startBtn">开始游戏</button>
    
    <div id="highScoreDisplay">最高分: <span id="highScoreValue">0</span></div>
    
    <button id="achievementBtn">🏆 成就</button>
    
    <div id="instructions">
      方向键 / WASD 移动<br>
      空格 炸弹 | Shift 大招 | P 暂停<br>
      拾取道具增强战力，击败Boss通关！
    </div>
  </div>
  
  <!-- 游戏结束界面 -->
  <div id="gameOverScreen">
    <h2>游戏结束</h2>
    <div id="finalScore">得分: 0</div>
    <div id="newHighScore">★ 新纪录！★</div>
    <div id="gameRating">S</div>
    <div id="ratingDesc">传奇飞行员</div>
    <div id="gameStats">
      击杀敌机: <span id="killCount">0</span><br>
      最高连击: <span id="maxCombo">0</span><br>
      到达关卡: <span id="reachedLevel">1</span><br>
      命中率: <span id="accuracyStat">0%</span><br>
      获得成就: <span id="achievementCount">0</span> 个
    </div>
    <button id="restartBtn">重新开始</button>
  </div>
  
  <!-- 暂停界面 -->
  <div id="pauseScreen">
    <h2>游戏暂停</h2>
    <button class="pause-btn" id="resumeBtn">继续游戏</button>
    <button class="pause-btn" id="pauseAchBtn">🏆 查看成就</button>
    <button class="pause-btn" id="quitBtn">返回主菜单</button>
  </div>
  
  <!-- HUD -->
  <div id="hud">
    <div id="hudLeft">
      <div>生命</div>
      <div id="healthBar"><div id="healthFill" style="width:100%"></div></div>
      <div id="skillLabel">大招 [Shift]</div>
      <div id="skillBar"><div id="skillFill" style="width:0%"></div><div id="skillReady">就绪!</div></div>
      <div id="bombCount">炸弹: 3</div>
      <div class="status-icons">
        <div class="status-icon" id="shieldIcon">S</div>
        <div class="status-icon" id="magnetIcon">M</div>
      </div>
    </div>
    <div id="hudRight">
      <div id="scoreDisplay">0</div>
      <div id="comboDisplay"></div>
      <div style="color:#6699cc;font-size:11px;">最高分: <span id="hudHighScore">0</span></div>
      <div style="color:#6699cc;font-size:11px;">关卡: <span id="levelDisplay">1</span></div>
    </div>
  </div>
</div>

<script>
// ==================== 游戏配置 ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// 难度配置
const DIFFICULTY = {
  easy:   { speedMul: 0.7, hpMul: 0.7, fireMul: 0.7, spawnMul: 0.8, scoreMul: 1.0, name: '简单' },
  normal: { speedMul: 1.0, hpMul: 1.0, fireMul: 1.0, spawnMul: 1.0, scoreMul: 1.5, name: '普通' },
  hard:   { speedMul: 1.4, hpMul: 1.3, fireMul: 1.4, spawnMul: 1.3, scoreMul: 2.0, name: '困难' }
};

let currentDifficulty = 'normal';
let selectedPlane = 0;

// 游戏状态
let gameState = 'menu'; // menu, playing, paused, gameover
let score = 0;
let highScore = parseInt(localStorage.getItem('thunderHighScore') || '0');
let killCount = 0;
let maxCombo = 0;
let currentLevel = 1;
let screenShake = 0;
let bulletsFired = 0;
let bulletsHit = 0;

// 音效系统
let soundEnabled = localStorage.getItem('thunderSound') !== 'false';
let audioCtx = null;

// 成就系统

// ==================== 玩家类 ====================
class Player {
  constructor(type) {
    this.type = type;
    this.config = PLANE_TYPES[type];
    this.x = W / 2;
    this.y = H - 80;
    this.width = 40;
    this.height = 48;
    this.speed = 5;
    this.maxHp = 100;
    this.hp = 100;
    this.bombs = 3;
    this.powerLevel = 1; // 1-5
    this.fireTimer = 0;
    this.invincible = 0; // 受伤无敌时间
    this.shieldTime = 0; // 护盾时间
    this.magnetTime = 0; // 磁铁时间
    this.thrusterFrame = 0;
  }

  update(dt) {
    // 移动
    let dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
    if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
    
    if (dx !== 0 && dy !== 0) {
      dx *= 0.707;
      dy *= 0.707;
    }
    
    this.x += dx * this.speed;
    this.y += dy * this.speed;
    
    // 边界限制
    this.x = Math.max(this.width/2, Math.min(W - this.width/2, this.x));
    this.y = Math.max(this.height/2, Math.min(H - this.height/2, this.y));
    
    // 射击
    this.fireTimer -= dt;
    if (this.fireTimer <= 0) {
      this.fire();
      this.fireTimer = this.config.fireRate;
    }
    
    // 计时器
    if (this.invincible > 0) this.invincible -= dt;
    if (this.shieldTime > 0) this.shieldTime -= dt;
    if (this.magnetTime > 0) this.magnetTime -= dt;
    
    this.thrusterFrame += dt * 0.02;
    
    // 磁铁效果
    if (this.magnetTime > 0) {
      for (let item of items) {
        let dx = this.x - item.x;
        let dy = this.y - item.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 200 && dist > 0) {
          item.x += (dx / dist) * 4;
          item.y += (dy / dist) * 4;
        }
      }
    }
  }

  fire() {
    const p = this.powerLevel;
    const speed = this.config.bulletSpeed;
    const dmg = this.config.bulletDamage;
    const color = this.config.bulletColor;
    
    switch(this.config.bulletPattern) {
      case 'single':
        if (p >= 1) playerBullets.push(new Bullet(this.x, this.y - 20, 0, -speed, dmg, color, 4));
        if (p >= 3) {
          playerBullets.push(new Bullet(this.x - 12, this.y - 15, 0, -speed, dmg, color, 3));
          playerBullets.push(new Bullet(this.x + 12, this.y - 15, 0, -speed, dmg, color, 3));
        }
        if (p >= 5) {
          playerBullets.push(new Bullet(this.x - 20, this.y - 10, -1, -speed, dmg*0.8, color, 3));
          playerBullets.push(new Bullet(this.x + 20, this.y - 10, 1, -speed, dmg*0.8, color, 3));
        }
        break;
      case 'double':
        if (p >= 1) {
          playerBullets.push(new Bullet(this.x - 8, this.y - 20, 0, -speed, dmg, color, 4));
          playerBullets.push(new Bullet(this.x + 8, this.y - 20, 0, -speed, dmg, color, 4));
        }
        if (p >= 3) {
          playerBullets.push(new Bullet(this.x - 18, this.y - 15, 0, -speed, dmg*0.7, color, 3));
          playerBullets.push(new Bullet(this.x + 18, this.y - 15, 0, -speed, dmg*0.7, color, 3));
        }
        if (p >= 5) {
          playerBullets.push(new Bullet(this.x - 5, this.y - 22, -0.5, -speed, dmg, color, 3));
          playerBullets.push(new Bullet(this.x + 5, this.y - 22, 0.5, -speed, dmg, color, 3));
        }
        break;
      case 'spread':
        if (p >= 1) {
          playerBullets.push(new Bullet(this.x, this.y - 20, 0, -speed, dmg, color, 4));
          playerBullets.push(new Bullet(this.x, this.y - 20, -2, -speed*0.9, dmg*0.8, color, 3));
          playerBullets.push(new Bullet(this.x, this.y - 20, 2, -speed*0.9, dmg*0.8, color, 3));
        }
        if (p >= 3) {
          playerBullets.push(new Bullet(this.x - 10, this.y - 15, -3, -speed*0.85, dmg*0.7, color, 3));
          playerBullets.push(new Bullet(this.x + 10, this.y - 15, 3, -speed*0.85, dmg*0.7, color, 3));
        }
        if (p >= 5) {
          playerBullets.push(new Bullet(this.x, this.y - 20, -4, -speed*0.8, dmg*0.6, color, 3));
          playerBullets.push(new Bullet(this.x, this.y - 20, 4, -speed*0.8, dmg*0.6, color, 3));
        }
        break;
    }
    bulletsFired++;
    playSound('shoot');
  }

  takeDamage(dmg) {
    if (this.invincible > 0) return;
    
    if (this.shieldTime > 0) {
      // 护盾抵挡
      this.shieldTime = 0;
      this.invincible = 1000;
      createExplosion(this.x, this.y, '#00ff66', 20);
      shockwaves.push({ x: this.x, y: this.y, radius: 0, maxRadius: 80, color: '#00ff66' });
      screenShake = 10;
      return;
    }
    
    this.hp -= dmg;
    this.invincible = 1500;
    screenShake = 15;
    createExplosion(this.x, this.y, '#ff3333', 15);
    
    if (this.hp <= 0) {
      this.hp = 0;
      gameOver();
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    // 闪烁（受伤无敌时）
    if (this.invincible > 0 && Math.floor(this.invincible / 100) % 2 === 0) {
      ctx.globalAlpha = 0.5;
    }
    
    const mainColor = this.config.color;
    const darkColor = this.config.accentColor;
    const glowColor = this.config.bulletColor;
    
    // 引擎喷射
    const flameSize = 10 + Math.sin(this.thrusterFrame * 12) * 4;
    const gradient = ctx.createRadialGradient(0, 22, 0, 0, 25, flameSize + 12);
    gradient.addColorStop(0, glowColor);
    gradient.addColorStop(0.4, mainColor);
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.moveTo(-10, 20);
    ctx.lineTo(-7, 20 + flameSize);
    ctx.lineTo(-3, 20 + flameSize * 0.7);
    ctx.lineTo(0, 20 + flameSize);
    ctx.lineTo(3, 20 + flameSize * 0.7);
    ctx.lineTo(7, 20 + flameSize);
    ctx.lineTo(10, 20);
    ctx.closePath();
    ctx.fill();
    
    // 肩部装甲（外层）
    ctx.fillStyle = darkColor;
    ctx.beginPath();
    ctx.moveTo(-22, 0);
    ctx.lineTo(-26, 8);
    ctx.lineTo(-20, 16);
    ctx.lineTo(-14, 14);
    ctx.lineTo(-12, 6);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(22, 0);
    ctx.lineTo(26, 8);
    ctx.lineTo(20, 16);
    ctx.lineTo(14, 14);
    ctx.lineTo(12, 6);
    ctx.closePath();
    ctx.fill();
    
    // 肩甲上的武器/导弹舱
    ctx.fillStyle = '#222233';
    ctx.fillRect(-24, 4, 6, 8);
    ctx.fillRect(18, 4, 6, 8);
    ctx.fillStyle = glowColor;
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 5;
    ctx.fillRect(-23, 6, 4, 2);
    ctx.fillRect(19, 6, 4, 2);
    ctx.shadowBlur = 0;
    
    // 主体躯干（机甲胸甲）
    ctx.fillStyle = mainColor;
    ctx.beginPath();
    ctx.moveTo(0, -22);
    ctx.lineTo(-8, -18);
    ctx.lineTo(-14, -5);
    ctx.lineTo(-16, 8);
    ctx.lineTo(-10, 18);
    ctx.lineTo(-4, 20);
    ctx.lineTo(4, 20);
    ctx.lineTo(10, 18);
    ctx.lineTo(16, 8);
    ctx.lineTo(14, -5);
    ctx.lineTo(8, -18);
    ctx.closePath();
    ctx.fill();
    
    // 胸甲深色分层
    ctx.fillStyle = darkColor;
    ctx.beginPath();
    ctx.moveTo(0, -15);
    ctx.lineTo(-6, -10);
    ctx.lineTo(-8, 0);
    ctx.lineTo(-6, 10);
    ctx.lineTo(6, 10);
    ctx.lineTo(8, 0);
    ctx.lineTo(6, -10);
    ctx.closePath();
    ctx.fill();
    
    // 核心能量炉（发光）
    const coreGlow = 0.6 + Math.sin(this.thrusterFrame * 8) * 0.3;
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 12;
    ctx.fillStyle = glowColor;
    ctx.globalAlpha = coreGlow;
    ctx.beginPath();
    ctx.arc(0, -2, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    
    // 核心外圈
    ctx.strokeStyle = mainColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -2, 7, 0, Math.PI * 2);
    ctx.stroke();
    
    // 头部/驾驶舱模块
    ctx.fillStyle = darkColor;
    ctx.beginPath();
    ctx.moveTo(0, -28);
    ctx.lineTo(-7, -22);
    ctx.lineTo(-6, -15);
    ctx.lineTo(6, -15);
    ctx.lineTo(7, -22);
    ctx.closePath();
    ctx.fill();
    
    // 头部传感器（眼睛，发光）
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 8;
    ctx.fillStyle = glowColor;
    ctx.fillRect(-5, -20, 10, 3);
    ctx.shadowBlur = 0;
    
    // 头部天线
    ctx.strokeStyle = darkColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-4, -28);
    ctx.lineTo(-6, -34);
    ctx.moveTo(4, -28);
    ctx.lineTo(6, -34);
    ctx.stroke();
    
    ctx.fillStyle = glowColor;
    ctx.beginPath();
    ctx.arc(-6, -34, 2, 0, Math.PI * 2);
    ctx.arc(6, -34, 2, 0, Math.PI * 2);
    ctx.fill();
    
    // 手臂/推进器模块
    ctx.fillStyle = darkColor;
    ctx.fillRect(-18, 8, 6, 12);
    ctx.fillRect(12, 8, 6, 12);
    
    // 腿部/下腹装甲
    ctx.fillStyle = mainColor;
    ctx.beginPath();
    ctx.moveTo(-8, 15);
    ctx.lineTo(-10, 22);
    ctx.lineTo(-4, 24);
    ctx.lineTo(4, 24);
    ctx.lineTo(10, 22);
    ctx.lineTo(8, 15);
    ctx.closePath();
    ctx.fill();
    
    // 装甲分割线
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-14, -5);
    ctx.lineTo(-10, 18);
    ctx.moveTo(14, -5);
    ctx.lineTo(10, 18);
    ctx.moveTo(0, -22);
    ctx.lineTo(0, 20);
    ctx.stroke();
    
    ctx.restore();
    
    // 护盾效果
    if (this.shieldTime > 0) {
      ctx.save();
      ctx.translate(this.x, this.y);
      const pulseSize = 35 + Math.sin(Date.now() * 0.01) * 5;
      const alpha = 0.4 + Math.sin(Date.now() * 0.008) * 0.2;
      
      ctx.strokeStyle = `rgba(0, 255, 100, ${alpha})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, pulseSize, 0, Math.PI * 2);
      ctx.stroke();
      
      ctx.fillStyle = `rgba(0, 255, 100, 0.1)`;
      ctx.beginPath();
      ctx.arc(0, 0, pulseSize, 0, Math.PI * 2);
      ctx.fill();
      
      // 护盾纹理
      ctx.strokeStyle = `rgba(0, 255, 100, ${alpha * 0.5})`;
      ctx.lineWidth = 1;
      for (let i = 0; i < 6; i++) {
        const angle = (Date.now() * 0.001 + i * Math.PI / 3) % (Math.PI * 2);
        ctx.beginPath();
        ctx.arc(0, 0, pulseSize - 3, angle, angle + 0.5);
        ctx.stroke();
      }
      ctx.restore();
    }
    
    // 磁铁效果
    if (this.magnetTime > 0) {
      ctx.save();
      ctx.translate(this.x, this.y);
      const rotAngle = Date.now() * 0.002;
      
      ctx.strokeStyle = 'rgba(200, 100, 255, 0.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 5]);
      ctx.beginPath();
      ctx.arc(0, 0, 50, rotAngle, rotAngle + Math.PI * 1.5);
      ctx.stroke();
      
      ctx.strokeStyle = 'rgba(200, 100, 255, 0.3)';
      ctx.beginPath();
      ctx.arc(0, 0, 70, -rotAngle, -rotAngle + Math.PI);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  }
}

// ==================== 子弹类 ====================
class Bullet {
  constructor(x, y, vx, vy, damage, color, size) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.damage = damage;
    this.color = color;
    this.size = size || 4;
    this.alive = true;
  }
  
  update(dt) {
    this.x += this.vx * dt * 0.06;
    this.y += this.vy * dt * 0.06;
    if (this.x < -10 || this.x > W + 10 || this.y < -10 || this.y > H + 10) {
      this.alive = false;
    }
  }
  
  draw() {
    ctx.save();
    // 发光效果
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    
    // 核心
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ==================== 敌机类 ====================
class Enemy {
  constructor(type, x, y) {
    const diff = DIFFICULTY[currentDifficulty];
    this.type = type;
    this.config = ENEMY_TYPES[type];
    this.x = x;
    this.y = y;
    this.width = this.config.width;
    this.height = this.config.height;
    this.maxHp = Math.ceil(this.config.hp * diff.hpMul * (1 + currentLevel * 0.1));
    this.hp = this.maxHp;
    this.speed = this.config.speed * diff.speedMul;
    this.score = Math.floor(this.config.score * diff.scoreMul);
    this.fireTimer = Math.random() * this.config.fireRate / diff.fireMul;
    this.alive = true;
    this.movePattern = Math.floor(Math.random() * 3); // 0-直线, 1-左摆, 2-右摆
    this.moveTimer = 0;
    this.startX = x;
  }
  
  update(dt) {
    this.moveTimer += dt;
    
    // 移动模式
    switch(this.movePattern) {
      case 0: // 直线
        this.y += this.speed * dt * 0.06;
        break;
      case 1: // 左摆
        this.y += this.speed * dt * 0.06;
        this.x = this.startX + Math.sin(this.moveTimer * 0.003) * 50;
        break;
      case 2: // 右摆
        this.y += this.speed * dt * 0.06;
        this.x = this.startX + Math.sin(this.moveTimer * 0.003 + Math.PI) * 50;
        break;
    }
    
    // 射击
    if (this.config.fireRate > 0) {
      this.fireTimer -= dt;
      if (this.fireTimer <= 0) {
        this.fire();
        this.fireTimer = this.config.fireRate / DIFFICULTY[currentDifficulty].fireMul;
      }
    }
    
    // 超出屏幕
    if (this.y > H + 50) {
      this.alive = false;
    }
  }
  
  fire() {
    const speed = this.config.bulletSpeed * DIFFICULTY[currentDifficulty].speedMul;
    if (this.type === 1) {
      // 中型：单发
      enemyBullets.push(new Bullet(this.x, this.y + this.height/2, 0, speed, 10, '#ff6600', 5));
    } else if (this.type === 2) {
      // 大型：三发扇形
      enemyBullets.push(new Bullet(this.x, this.y + this.height/2, 0, speed, 15, '#cc33ff', 6));
      enemyBullets.push(new Bullet(this.x, this.y + this.height/2, -1.5, speed, 10, '#cc33ff', 5));
      enemyBullets.push(new Bullet(this.x, this.y + this.height/2, 1.5, speed, 10, '#cc33ff', 5));
    } else if (this.type === 3) {
      // 精英：双向
      enemyBullets.push(new Bullet(this.x - 10, this.y + this.height/2, -0.5, speed, 8, '#33ffcc', 4));
      enemyBullets.push(new Bullet(this.x + 10, this.y + this.height/2, 0.5, speed, 8, '#33ffcc', 4));
    }
  }
  
  takeDamage(dmg) {
    this.hp -= dmg;
    // 击中特效
    particles.push({
      x: this.x + (Math.random() - 0.5) * this.width,
      y: this.y + (Math.random() - 0.5) * this.height,
      vx: (Math.random() - 0.5) * 3,
      vy: (Math.random() - 0.5) * 3,
      life: 300,
      maxLife: 300,
      color: '#ffff00',
      size: 3
    });
    
    if (this.hp <= 0) {
      this.die();
    }
  }
  
  die() {
    this.alive = false;
    score += this.score;
    killCount++;
    
    // 连击
    combo++;
    comboTimer = 2000;
    if (combo > maxCombo) maxCombo = combo;
    if (combo >= 5) {
      score += Math.floor(this.score * 0.1 * Math.min(combo, 20));
    }
    
    // 增加大招能量
    const energyGain = [1, 2, 5, 3][this.type] || 2;
    addUltimateEnergy(energyGain);
    
    // 爆炸特效
    createExplosion(this.x, this.y, this.config.color, this.type === 2 ? 30 : 20);
    playSound('explosion');
    if (this.type >= 2) {
      shockwaves.push({ x: this.x, y: this.y, radius: 0, maxRadius: 60, color: this.config.color });
      screenShake = this.type === 2 ? 8 : 5;
    }
    
    // 检查成就
    checkAchievements();
    
    // 掉落道具
    this.dropItem();
  }
  
  dropItem() {
    let dropChance = 0.15; // 基础掉落率
    if (this.type === 1) dropChance = 0.25;
    if (this.type === 2) dropChance = 0.6;
    if (this.type === 3) dropChance = 0.4;
    
    if (Math.random() < dropChance) {
      const rand = Math.random();
      let type;
      if (rand < 0.35) type = 0; // 火力
      else if (rand < 0.55) type = 1; // 生命
      else if (rand < 0.70) type = 2; // 炸弹
      else if (rand < 0.85) type = 3; // 护盾
      else type = 4; // 磁铁
      
      items.push(new Item(this.x, this.y, type));
    }
  }
  
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    const c = this.config.color;
    const darkC = this.type === 0 ? '#aa3333' :
                  this.type === 1 ? '#cc6600' :
                  this.type === 2 ? '#8800aa' : '#009988';
    const eyeColor = '#ff0000';
    
    // 根据类型绘制不同机甲
    if (this.type === 0) {
      // 小型侦察机甲 - 小巧灵活
      // 推进器
      ctx.fillStyle = '#ff6600';
      ctx.globalAlpha = 0.7;
      ctx.beginPath();
      ctx.moveTo(-4, -12);
      ctx.lineTo(-6, -18);
      ctx.lineTo(-2, -15);
      ctx.lineTo(0, -20);
      ctx.lineTo(2, -15);
      ctx.lineTo(6, -18);
      ctx.lineTo(4, -12);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
      
      // 主体
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.moveTo(0, 14);
      ctx.lineTo(-10, 8);
      ctx.lineTo(-12, 0);
      ctx.lineTo(-8, -10);
      ctx.lineTo(8, -10);
      ctx.lineTo(12, 0);
      ctx.lineTo(10, 8);
      ctx.closePath();
      ctx.fill();
      
      // 装甲细节
      ctx.fillStyle = darkC;
      ctx.fillRect(-6, -6, 12, 10);
      
      // 红色单眼传感器
      ctx.shadowColor = eyeColor;
      ctx.shadowBlur = 6;
      ctx.fillStyle = eyeColor;
      ctx.fillRect(-4, -4, 8, 3);
      ctx.shadowBlur = 0;
      
      // 小翼/推进臂
      ctx.fillStyle = darkC;
      ctx.beginPath();
      ctx.moveTo(-12, -2);
      ctx.lineTo(-16, 2);
      ctx.lineTo(-14, 6);
      ctx.closePath();
      ctx.moveTo(12, -2);
      ctx.lineTo(16, 2);
      ctx.lineTo(14, 6);
      ctx.closePath();
      ctx.fill();
      
    } else if (this.type === 1) {
      // 中型突击机甲 - 有双臂炮
      // 背包推进器
      ctx.fillStyle = '#ff6600';
      ctx.globalAlpha = 0.6;
      ctx.fillRect(-8, -20, 4, 8);
      ctx.fillRect(4, -20, 4, 8);
      ctx.globalAlpha = 1;
      
      // 主体躯干
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.moveTo(0, 20);
      ctx.lineTo(-14, 12);
      ctx.lineTo(-16, 0);
      ctx.lineTo(-12, -12);
      ctx.lineTo(-6, -18);
      ctx.lineTo(6, -18);
      ctx.lineTo(12, -12);
      ctx.lineTo(16, 0);
      ctx.lineTo(14, 12);
      ctx.closePath();
      ctx.fill();
      
      // 胸部装甲
      ctx.fillStyle = darkC;
      ctx.fillRect(-8, -8, 16, 14);
      
      // 双眼传感器
      ctx.shadowColor = eyeColor;
      ctx.shadowBlur = 6;
      ctx.fillStyle = eyeColor;
      ctx.fillRect(-6, -5, 4, 3);
      ctx.fillRect(2, -5, 4, 3);
      ctx.shadowBlur = 0;
      
      // 双臂炮
      ctx.fillStyle = darkC;
      ctx.fillRect(-18, -4, 6, 14);
      ctx.fillRect(12, -4, 6, 14);
      
      // 炮口
      ctx.fillStyle = '#333333';
      ctx.fillRect(-17, 8, 4, 4);
      ctx.fillRect(13, 8, 4, 4);
      
      // 腿部
      ctx.fillStyle = c;
      ctx.fillRect(-8, 14, 6, 8);
      ctx.fillRect(2, 14, 6, 8);
      
    } else if (this.type === 2) {
      // 重型轰炸机甲 - 厚重装甲
      // 大型推进器
      ctx.fillStyle = '#ff6600';
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.moveTo(-15, -28);
      ctx.lineTo(-10, -38);
      ctx.lineTo(-5, -32);
      ctx.lineTo(0, -40);
      ctx.lineTo(5, -32);
      ctx.lineTo(10, -38);
      ctx.lineTo(15, -28);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
      
      // 厚重肩甲
      ctx.fillStyle = darkC;
      ctx.beginPath();
      ctx.moveTo(-28, -5);
      ctx.lineTo(-32, 5);
      ctx.lineTo(-26, 18);
      ctx.lineTo(-18, 15);
      ctx.lineTo(-16, -2);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(28, -5);
      ctx.lineTo(32, 5);
      ctx.lineTo(26, 18);
      ctx.lineTo(18, 15);
      ctx.lineTo(16, -2);
      ctx.closePath();
      ctx.fill();
      
      // 肩甲导弹舱
      ctx.fillStyle = '#333344';
      ctx.fillRect(-30, 0, 6, 10);
      ctx.fillRect(24, 0, 6, 10);
      ctx.fillStyle = eyeColor;
      ctx.fillRect(-29, 3, 4, 2);
      ctx.fillRect(25, 3, 4, 2);
      
      // 主体
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.moveTo(0, 28);
      ctx.lineTo(-18, 20);
      ctx.lineTo(-20, 5);
      ctx.lineTo(-16, -15);
      ctx.lineTo(-8, -28);
      ctx.lineTo(8, -28);
      ctx.lineTo(16, -15);
      ctx.lineTo(20, 5);
      ctx.lineTo(18, 20);
      ctx.closePath();
      ctx.fill();
      
      // 胸部重甲
      ctx.fillStyle = darkC;
      ctx.beginPath();
      ctx.moveTo(0, 18);
      ctx.lineTo(-12, 10);
      ctx.lineTo(-10, -10);
      ctx.lineTo(10, -10);
      ctx.lineTo(12, 10);
      ctx.closePath();
      ctx.fill();
      
      // 核心反应堆
      const corePulse = 0.5 + Math.sin(Date.now() * 0.006) * 0.4;
      ctx.shadowColor = '#ff00ff';
      ctx.shadowBlur = 15;
      ctx.fillStyle = `rgba(255, 0, 255, ${corePulse})`;
      ctx.beginPath();
      ctx.arc(0, 2, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      ctx.strokeStyle = '#ff66ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 2, 9, 0, Math.PI * 2);
      ctx.stroke();
      
      // 头部传感器阵列
      ctx.fillStyle = darkC;
      ctx.fillRect(-6, -25, 12, 6);
      ctx.shadowColor = eyeColor;
      ctx.shadowBlur = 8;
      ctx.fillStyle = eyeColor;
      ctx.fillRect(-5, -23, 10, 2);
      ctx.shadowBlur = 0;
      
      // 粗壮腿部
      ctx.fillStyle = c;
      ctx.fillRect(-12, 22, 8, 10);
      ctx.fillRect(4, 22, 8, 10);
      
      // 装甲分割线
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, -28);
      ctx.lineTo(0, 28);
      ctx.stroke();
      
    } else {
      // 精英高速机甲 - 流线型设计
      // 双推进器
      ctx.fillStyle = '#00ffcc';
      ctx.globalAlpha = 0.7;
      ctx.beginPath();
      ctx.moveTo(-8, -22);
      ctx.lineTo(-10, -32);
      ctx.lineTo(-5, -28);
      ctx.lineTo(-3, -22);
      ctx.closePath();
      ctx.moveTo(8, -22);
      ctx.lineTo(10, -32);
      ctx.lineTo(5, -28);
      ctx.lineTo(3, -22);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
      
      // 主体（尖锐流线型）
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.moveTo(0, 26);
      ctx.lineTo(-14, 15);
      ctx.lineTo(-18, 0);
      ctx.lineTo(-14, -15);
      ctx.lineTo(-6, -24);
      ctx.lineTo(0, -20);
      ctx.lineTo(6, -24);
      ctx.lineTo(14, -15);
      ctx.lineTo(18, 0);
      ctx.lineTo(14, 15);
      ctx.closePath();
      ctx.fill();
      
      // 深色装甲层
      ctx.fillStyle = darkC;
      ctx.beginPath();
      ctx.moveTo(0, 18);
      ctx.lineTo(-10, 10);
      ctx.lineTo(-12, -5);
      ctx.lineTo(-8, -15);
      ctx.lineTo(8, -15);
      ctx.lineTo(12, -5);
      ctx.lineTo(10, 10);
      ctx.closePath();
      ctx.fill();
      
      // 中央能量核心
      const eliteGlow = 0.6 + Math.sin(Date.now() * 0.008) * 0.3;
      ctx.shadowColor = c;
      ctx.shadowBlur = 12;
      ctx.fillStyle = `rgba(0, 255, 200, ${eliteGlow})`;
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      // 头部独角设计
      ctx.fillStyle = darkC;
      ctx.beginPath();
      ctx.moveTo(0, -28);
      ctx.lineTo(-4, -22);
      ctx.lineTo(4, -22);
      ctx.closePath();
      ctx.fill();
      
      // 发光的眼
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#00ffff';
      ctx.fillRect(-5, -18, 10, 2);
      ctx.shadowBlur = 0;
      
      // 侧翼/稳定翼
      ctx.fillStyle = darkC;
      ctx.beginPath();
      ctx.moveTo(-18, -5);
      ctx.lineTo(-24, 0);
      ctx.lineTo(-20, 8);
      ctx.lineTo(-16, 6);
      ctx.closePath();
      ctx.moveTo(18, -5);
      ctx.lineTo(24, 0);
      ctx.lineTo(20, 8);
      ctx.lineTo(16, 6);
      ctx.closePath();
      ctx.fill();
    }
    
    ctx.restore();
    
    // 血条（非满血时显示）
    if (this.hp < this.maxHp) {
      const barWidth = this.width;
      const barHeight = 4;
      const barX = this.x - barWidth / 2;
      const barY = this.y - this.height / 2 - 8;
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fillRect(barX, barY, barWidth, barHeight);
      
      ctx.fillStyle = '#ff3333';
      ctx.fillRect(barX, barY, barWidth * (this.hp / this.maxHp), barHeight);
    }
  }
}

// ==================== Boss类 ====================
class Boss {
  constructor(level) {
    const diff = DIFFICULTY[currentDifficulty];
    this.level = level;
    this.bossType = (level - 1) % 3; // 0-火焰型, 1-冰霜型, 2-雷电型
    this.x = W / 2;
    this.y = -100;
    this.targetY = 100;
    this.width = 120;
    this.height = 100;
    this.maxHp = Math.ceil(100 * level * diff.hpMul);
    this.hp = this.maxHp;
    this.speed = 2;
    this.score = Math.floor(5000 * level * diff.scoreMul);
    this.phase = 0; // 0-入场, 1-战斗
    this.attackPattern = 0;
    this.attackTimer = 0;
    this.moveTimer = 0;
    this.moveDir = 1;
    this.alive = true;
    // 三种Boss配色
    this.bossConfigs = [
      { name: '烈焰', color: '#ff3300', accent: '#ff6600', glow: '#ffff00' },
      { name: '寒冰', color: '#00ccff', accent: '#0088ff', glow: '#aaddff' },
      { name: '雷霆', color: '#cc00ff', accent: '#9933ff', glow: '#ff99ff' }
    ];
    this.config = this.bossConfigs[this.bossType];
    this.color = this.config.color;
  }
  
  update(dt) {
    if (this.phase === 0) {
      // 入场
      this.y += 1.5;
      if (this.y >= this.targetY) {
        this.y = this.targetY;
        this.phase = 1;
        playSound('boss');
        screenShake = 15;
      }
      return;
    }
    
    // 左右移动
    this.moveTimer += dt;
    this.x += this.moveDir * this.speed * dt * 0.05;
    if (this.x < 80) { this.x = 80; this.moveDir = 1; }
    if (this.x > W - 80) { this.x = W - 80; this.moveDir = -1; }
    
    // 攻击
    this.attackTimer -= dt;
    if (this.attackTimer <= 0) {
      this.attack();
      this.attackTimer = 1500 / DIFFICULTY[currentDifficulty].fireMul;
      this.attackPattern = (this.attackPattern + 1) % 3;
    }
  }
  
  attack() {
    const bs = 4 * DIFFICULTY[currentDifficulty].speedMul;
    
    switch(this.attackPattern) {
      case 0: // 扇形弹幕
        for (let i = -4; i <= 4; i++) {
          const angle = Math.PI / 2 + i * 0.15;
          enemyBullets.push(new Bullet(
            this.x, this.y + 40,
            Math.cos(angle) * bs, Math.sin(angle) * bs,
            12, this.color, 6
          ));
        }
        break;
      case 1: // 追踪弹
        if (player) {
          const dx = player.x - this.x;
          const dy = player.y - this.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          enemyBullets.push(new Bullet(
            this.x - 30, this.y + 30,
            (dx / dist) * bs * 1.2, (dy / dist) * bs * 1.2,
            15, '#ff0000', 8
          ));
          enemyBullets.push(new Bullet(
            this.x + 30, this.y + 30,
            (dx / dist) * bs * 1.2, (dy / dist) * bs * 1.2,
            15, '#ff0000', 8
          ));
        }
        break;
      case 2: // 圆形弹幕
        const bulletCount = 12;
        for (let i = 0; i < bulletCount; i++) {
          const angle = (i / bulletCount) * Math.PI * 2 + this.moveTimer * 0.001;
          enemyBullets.push(new Bullet(
            this.x, this.y,
            Math.cos(angle) * bs * 0.8, Math.sin(angle) * bs * 0.8,
            10, this.color, 5
          ));
        }
        break;
    }
  }
  
  takeDamage(dmg) {
    this.hp -= dmg;
    
    // 击中特效
    for (let i = 0; i < 3; i++) {
      particles.push({
        x: this.x + (Math.random() - 0.5) * this.width,
        y: this.y + (Math.random() - 0.5) * this.height,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        life: 400,
        maxLife: 400,
        color: '#ffff00',
        size: 4
      });
    }
    
    if (this.hp <= 0) {
      this.die();
    }
  }
  
  die() {
    this.alive = false;
    score += this.score;
    killCount++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    
    // 大爆炸
    screenShake = 30;
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        createExplosion(
          this.x + (Math.random() - 0.5) * 80,
          this.y + (Math.random() - 0.5) * 60,
          this.color, 40
        );
        shockwaves.push({
          x: this.x + (Math.random() - 0.5) * 40,
          y: this.y + (Math.random() - 0.5) * 30,
          radius: 0, maxRadius: 100, color: this.color
        });
      }, i * 150);
    }
    
    // 掉落多个道具
    for (let i = 0; i < 3; i++) {
      setTimeout(() => {
        const rand = Math.random();
        let type;
        if (rand < 0.3) type = 0;
        else if (rand < 0.5) type = 1;
        else if (rand < 0.7) type = 2;
        else if (rand < 0.85) type = 3;
        else type = 4;
        items.push(new Item(this.x + (Math.random()-0.5)*60, this.y, type));
      }, i * 200);
    }
    
    // 进入下一关
    setTimeout(() => {
      currentLevel++;
      levelTimer = 0;
    }, 2000);
  }
  
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    
    const c = this.color;
    const darkC = '#1a1a2e';
    const metalC = '#333344';
    
    // Boss主体发光
    ctx.shadowColor = c;
    ctx.shadowBlur = 25;
    
    // 巨型推进器（背包）
    ctx.fillStyle = darkC;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.moveTo(-35, -50);
    ctx.lineTo(-40, -80);
    ctx.lineTo(-25, -75);
    ctx.lineTo(-20, -50);
    ctx.closePath();
    ctx.moveTo(35, -50);
    ctx.lineTo(40, -80);
    ctx.lineTo(25, -75);
    ctx.lineTo(20, -50);
    ctx.closePath();
    ctx.fill();
    
    // 推进器火焰
    const flameH = 15 + Math.sin(Date.now() * 0.01) * 5;
    const flameGrad = ctx.createLinearGradient(0, -80, 0, -80 - flameH);
    flameGrad.addColorStop(0, c);
    flameGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = flameGrad;
    ctx.beginPath();
    ctx.moveTo(-38, -80);
    ctx.lineTo(-32, -80 - flameH);
    ctx.lineTo(-27, -80);
    ctx.closePath();
    ctx.moveTo(38, -80);
    ctx.lineTo(32, -80 - flameH);
    ctx.lineTo(27, -80);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    
    // 巨型肩甲
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(-55, -20);
    ctx.lineTo(-70, -5);
    ctx.lineTo(-65, 20);
    ctx.lineTo(-50, 25);
    ctx.lineTo(-45, 0);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(55, -20);
    ctx.lineTo(70, -5);
    ctx.lineTo(65, 20);
    ctx.lineTo(50, 25);
    ctx.lineTo(45, 0);
    ctx.closePath();
    ctx.fill();
    
    // 肩甲上的导弹发射器
    ctx.fillStyle = metalC;
    ctx.fillRect(-62, -10, 10, 20);
    ctx.fillRect(52, -10, 10, 20);
    
    // 导弹发射口（发光）
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#ff3333';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(-57, -6 + i * 7, 2, 0, Math.PI * 2);
      ctx.arc(57, -6 + i * 7, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    
    // 主体躯干（大型机甲胸甲）
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(0, 55);
    ctx.lineTo(-35, 40);
    ctx.lineTo(-45, 15);
    ctx.lineTo(-40, -15);
    ctx.lineTo(-30, -40);
    ctx.lineTo(-15, -50);
    ctx.lineTo(15, -50);
    ctx.lineTo(30, -40);
    ctx.lineTo(40, -15);
    ctx.lineTo(45, 15);
    ctx.lineTo(35, 40);
    ctx.closePath();
    ctx.fill();
    
    ctx.shadowBlur = 0;
    
    // 深色胸甲内层
    ctx.fillStyle = darkC;
    ctx.beginPath();
    ctx.moveTo(0, 45);
    ctx.lineTo(-25, 32);
    ctx.lineTo(-30, 5);
    ctx.lineTo(-22, -25);
    ctx.lineTo(22, -25);
    ctx.lineTo(30, 5);
    ctx.lineTo(25, 32);
    ctx.closePath();
    ctx.fill();
    
    // 中央巨型能量核心
    const coreGlow = 0.5 + Math.sin(Date.now() * 0.004) * 0.4;
    ctx.shadowColor = c;
    ctx.shadowBlur = 30;
    
    // 核心外圈（六边形装甲）
    ctx.strokeStyle = c;
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
      const x = Math.cos(angle) * 22;
      const y = Math.sin(angle) * 22 + 5;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
    
    // 核心内部
    const coreGrad = ctx.createRadialGradient(0, 5, 0, 0, 5, 18);
    coreGrad.addColorStop(0, '#ffffff');
    coreGrad.addColorStop(0.3, c);
    coreGrad.addColorStop(1, darkC);
    ctx.fillStyle = coreGrad;
    ctx.globalAlpha = coreGlow;
    ctx.beginPath();
    ctx.arc(0, 5, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    
    // 核心内部旋转的能量纹
    ctx.strokeStyle = c;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.6;
    const rotAngle = Date.now() * 0.002;
    for (let i = 0; i < 3; i++) {
      const a = rotAngle + i * Math.PI * 2 / 3;
      ctx.beginPath();
      ctx.arc(0, 5, 10, a, a + Math.PI * 0.6);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    
    // 头部模块
    ctx.fillStyle = darkC;
    ctx.beginPath();
    ctx.moveTo(0, -55);

    ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);

}

// ==================== 道具类 ====================
class Item {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type; // 0-火力, 1-生命, 2-炸弹, 3-护盾, 4-磁铁
    this.width = 24;
    this.height = 24;
    this.speed = 2;
    this.alive = true;
    this.bobOffset = Math.random() * Math.PI * 2;
    this.rotAngle = 0;
  }
  
  update(dt) {
    this.y += this.speed * dt * 0.06;
    this.bobOffset += dt * 0.005;
    this.rotAngle += dt * 0.003;
    
    if (this.y > H + 30) {
      this.alive = false;
    }
  }
  
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y + Math.sin(this.bobOffset) * 3);
    
    let color, symbol;
    switch(this.type) {
      case 0: color = '#ff6600'; symbol = 'P'; break;
      case 1: color = '#ff3366'; symbol = '♥'; break;
      case 2: color = '#ffcc00'; symbol = 'B'; break;
      case 3: color = '#00ff66'; symbol = 'S'; break;
      case 4: color = '#cc66ff'; symbol = 'M'; break;
    }
    
    // 外发光
    ctx.shadowColor = color;
    ctx.shadowBlur = 15;
    
    // 背景圆
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI * 2);
    ctx.fill();
    
    // 边框
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI * 2);
    ctx.stroke();
    
    // 旋转的装饰环
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, 18, this.rotAngle, this.rotAngle + Math.PI * 1.5);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    
    ctx.shadowBlur = 0;
    
    // 符号
    ctx.fillStyle = color;
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(symbol, 0, 0);
    
    ctx.restore();
  }
  
  collect() {
    this.alive = false;
    const diff = DIFFICULTY[currentDifficulty];
    itemsCollected++;
    playSound('item');
    checkAchievements();
    
    switch(this.type) {
      case 0: // 火力提升
        if (player.powerLevel < 5) {
          player.powerLevel++;
        } else {
          score += 500;
        }
        createExplosion(this.x, this.y, '#ff6600', 10);
        break;
      case 1: // 生命恢复
        player.hp = Math.min(player.maxHp, player.hp + 30);
        createExplosion(this.x, this.y, '#ff3366', 10);
        break;
      case 2: // 炸弹
        player.bombs++;
        createExplosion(this.x, this.y, '#ffcc00', 10);
        break;
      case 3: // 护盾
        player.shieldTime = 8000; // 8秒
        createExplosion(this.x, this.y, '#00ff66', 15);
        break;
      case 4: // 磁铁
        player.magnetTime = 10000; // 10秒
        createExplosion(this.x, this.y, '#cc66ff', 15);
        break;
    }
  }
}

// ==================== 粒子/爆炸 ====================
function createExplosion(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 2;
    particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 500 + Math.random() * 300,
      maxLife: 800,
      color: color,
      size: Math.random() * 4 + 2
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt * 0.06;
    p.y += p.vy * dt * 0.06;
    p.vx *= 0.98;
    p.vy *= 0.98;
    p.life -= dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function drawParticles() {
  for (let p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ==================== 冲击波 ====================
function updateShockwaves(dt) {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i];
    s.radius += (s.maxRadius - s.radius) * 0.1;
    if (s.radius >= s.maxRadius * 0.95) {
      shockwaves.splice(i, 1);
    }
  }
}

function drawShockwaves() {
  for (let s of shockwaves) {
    const alpha = 1 - s.radius / s.maxRadius;
    ctx.strokeStyle = s.color;
    ctx.globalAlpha = alpha * 0.6;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ==================== 生成敌机 ====================
function spawnEnemies(dt) {
  if (boss) return; // Boss战期间不生成普通敌机
  
  const diff = DIFFICULTY[currentDifficulty];
  spawnTimer -= dt;
  
  // 基础生成间隔
  let baseInterval = 1500 / diff.spawnMul;
  // 随关卡加快
  baseInterval /= (1 + currentLevel * 0.1);
  
  if (spawnTimer <= 0) {
    spawnTimer = baseInterval + Math.random() * 500;
    
    // 敌机类型权重（随关卡变化）
    const weights = [
      60 - currentLevel * 3,  // 小型
      25 + currentLevel * 2,  // 中型
      8 + currentLevel,       // 大型
      5 + currentLevel * 0.5  // 精英
    ];
    
    const totalWeight = weights.reduce((a, b) => a + b, 0);
    let rand = Math.random() * totalWeight;
    let type = 0;
    for (let i = 0; i < weights.length; i++) {
      rand -= weights[i];
      if (rand <= 0) { type = i; break; }
    }
    
    const config = ENEMY_TYPES[type];
    const x = 30 + Math.random() * (W - 60);
    enemies.push(new Enemy(type, x, -30));
  }
  
  // 关卡进度（每60秒出Boss）
  levelTimer += dt;
  if (levelTimer >= 60000 && !boss) {
    boss = new Boss(currentLevel);
  }
}

// ==================== 碰撞检测 ====================
function checkCollisions() {
  // 玩家子弹 vs 敌机
  for (let bullet of playerBullets) {
    if (!bullet.alive) continue;
    
    for (let enemy of enemies) {
      if (!enemy.alive) continue;
      if (Math.abs(bullet.x - enemy.x) < enemy.width/2 + bullet.size &&
          Math.abs(bullet.y - enemy.y) < enemy.height/2 + bullet.size) {
        enemy.takeDamage(bullet.damage);
        bullet.alive = false;
        bulletsHit++;
        playSound('hit');
        break;
      }
    }
    
    // vs Boss
    if (bullet.alive && boss && boss.alive && boss.phase === 1) {
      if (Math.abs(bullet.x - boss.x) < boss.width/2 + bullet.size &&
          Math.abs(bullet.y - boss.y) < boss.height/2 + bullet.size) {
        boss.takeDamage(bullet.damage);
        bullet.alive = false;
        bulletsHit++;
        playSound('hit');
      }
    }
  }
  
  // 敌机子弹 vs 玩家
  if (player) {
    for (let bullet of enemyBullets) {
      if (!bullet.alive) continue;
      if (Math.abs(bullet.x - player.x) < player.width/2 - 5 + bullet.size &&
          Math.abs(bullet.y - player.y) < player.height/2 - 5 + bullet.size) {
        player.takeDamage(bullet.damage);
        bullet.alive = false;
      }
    }
    
    // 敌机 vs 玩家（碰撞）
    for (let enemy of enemies) {
      if (!enemy.alive) continue;
      if (Math.abs(enemy.x - player.x) < (enemy.width + player.width) / 2 - 5 &&
          Math.abs(enemy.y - player.y) < (enemy.height + player.height) / 2 - 5) {
        player.takeDamage(20);
        enemy.takeDamage(5);
      }
    }
    
    // Boss碰撞
    if (boss && boss.alive && boss.phase === 1) {
      if (Math.abs(boss.x - player.x) < (boss.width + player.width) / 2 - 10 &&
          Math.abs(boss.y - player.y) < (boss.height + player.height) / 2 - 10) {
        player.takeDamage(30);
      }
    }
    
    // 道具 vs 玩家
    for (let item of items) {
      if (!item.alive) continue;
      if (Math.abs(item.x - player.x) < player.width/2 + item.width/2 &&
          Math.abs(item.y - player.y) < player.height/2 + item.height/2) {
        item.collect();
      }
    }
  }
}

// ==================== 炸弹 ====================
function useBomb() {
  if (!player || player.bombs <= 0) return;
  
  player.bombs--;
  bombsUsed++;
  screenShake = 25;
  playSound('bomb');
  
  // 清除所有敌机子弹
  for (let b of enemyBullets) {
    createExplosion(b.x, b.y, '#ffffff', 5);
    b.alive = false;
  }
  
  // 对所有敌机造成伤害
  for (let enemy of enemies) {
    if (enemy.alive) {
      enemy.takeDamage(5);
    }
  }
  
  // 对Boss造成伤害
  if (boss && boss.alive) {
    boss.takeDamage(20);
  }
  
  // 全屏冲击波
  shockwaves.push({ x: W/2, y: H/2, radius: 0, maxRadius: 400, color: '#ffcc00' });
  
  // 粒子效果
  for (let i = 0; i < 50; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 8 + 3;
    particles.push({
      x: W/2, y: H/2,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 800, maxLife: 800,
      color: '#ffcc00',
      size: Math.random() * 5 + 2
    });
  }
}

// ==================== 背景星空 ====================
function drawBackground(dt) {
  ctx.fillStyle = '#000011';
  ctx.fillRect(0, 0, W, H);
  
  for (let star of stars) {
    star.y += star.speed * (star.layer + 1) * 0.5 * dt * 0.06;
    if (star.y > H) {
      star.y = 0;
      star.x = Math.random() * W;
    }
    
    const alpha = 0.3 + star.layer * 0.25 + Math.sin(Date.now() * 0.002 + star.x) * 0.2;
    ctx.fillStyle = `rgba(200, 220, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ==================== 游戏循环 ====================
let lastTime = 0;

function gameLoop(timestamp) {
  const dt = Math.min(timestamp - lastTime, 50);
  lastTime = timestamp;
  
  if (gameState === 'playing') {
    update(dt);
  }
  
  draw(dt);
  
  requestAnimationFrame(gameLoop);
}

function update(dt) {
  // 连击计时器
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) {
      combo = 0;
    }
  }
  
  // 屏幕震动衰减
  if (screenShake > 0) screenShake *= 0.9;
  
  // 更新玩家
  player.update(dt);
  
  // 更新子弹
  for (let b of playerBullets) b.update(dt);
  for (let b of enemyBullets) b.update(dt);
  playerBullets = playerBullets.filter(b => b.alive);
  enemyBullets = enemyBullets.filter(b => b.alive);
  
  // 生成敌机
  spawnEnemies(dt);
  
  // 更新敌机
  for (let e of enemies) e.update(dt);
  enemies = enemies.filter(e => e.alive);
  
  // 更新Boss
  if (boss) {
    boss.update(dt);
    if (!boss.alive) boss = null;
  }
  
  // 更新道具
  for (let item of items) item.update(dt);
  items = items.filter(i => i.alive);
  
  // 更新粒子/冲击波
  updateParticles(dt);
  updateShockwaves(dt);
  
  // 碰撞检测
  checkCollisions();
  
  // 更新最高分
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('thunderHighScore', highScore.toString());
  }
  
  // UI
  updateHUD();
}

function draw(dt) {
  ctx.save();
  
  // 屏幕震动
  if (screenShake > 0.5) {
    ctx.translate(
      (Math.random() - 0.5) * screenShake,
      (Math.random() - 0.5) * screenShake
    );
  }
  
  // 背景
  drawBackground(dt);
  
  // 道具
  for (let item of items) item.draw();
  
  // 敌机
  for (let e of enemies) e.draw();
  
  // Boss
  if (boss) boss.draw();
  
  // 子弹
  for (let b of playerBullets) b.draw();
  for (let b of enemyBullets) b.draw();
  
  // 玩家
  if (player && gameState !== 'menu') player.draw();
  
  // 粒子
  drawParticles();
  
  // 冲击波
  drawShockwaves();
  
  ctx.restore();
}

// ==================== 游戏流程 ====================
function startGame() {
  gameState = 'playing';
  score = 0;
  killCount = 0;
  maxCombo = 0;
  currentLevel = 1;
  combo = 0;
  comboTimer = 0;
  spawnTimer = 0;
  levelTimer = 0;
  screenShake = 0;
  bulletsFired = 0;
  bulletsHit = 0;
  bombsUsed = 0;
  itemsCollected = 0;
  ultimatesUsed = 0;
  ultimateEnergy = 0;
  ultimateActive = false;

  enemyBullets = [];
  enemies = [];
  items = [];

  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('pauseScreen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  
  updateSkillBar();
  initAudio();
}

function gameOver() {
  gameState = 'gameover';
  
  // 检查成就
  checkAchievements();
  
  // 更新最高分
  const isNewHigh = score > parseInt(localStorage.getItem('thunderHighScore') || '0');
  if (isNewHigh) {
    highScore = score;
    localStorage.setItem('thunderHighScore', score.toString());
  }
  
  // 计算评价
  calculateRating();
  
  // 命中率
  const accuracy = bulletsFired > 0 ? Math.round((bulletsHit / bulletsFired) * 100) : 0;
  
  document.getElementById('finalScore').textContent = '得分: ' + score.toLocaleString();
  document.getElementById('killCount').textContent = killCount;
  document.getElementById('maxCombo').textContent = maxCombo;
  document.getElementById('reachedLevel').textContent = currentLevel;
  document.getElementById('accuracyStat').textContent = accuracy + '%';
  document.getElementById('achievementCount').textContent = unlockedAchievements.length + '/' + ACHIEVEMENTS.length;
  document.getElementById('newHighScore').style.display = isNewHigh ? 'block' : 'none';
  document.getElementById('gameOverScreen').style.display = 'flex';
  document.getElementById('hud').style.display = 'none';
  
  playSound('explosion');
}

function pauseGame() {
  if (gameState !== 'playing') return;
  gameState = 'paused';
  document.getElementById('pauseScreen').style.display = 'flex';
}

function resumeGame() {
  if (gameState !== 'paused') return;
  gameState = 'playing';
  document.getElementById('pauseScreen').style.display = 'none';
  lastTime = performance.now();
}

function returnToMenu() {
  gameState = 'menu';
  document.getElementById('pauseScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('startScreen').style.display = 'flex';
  document.getElementById('highScoreValue').textContent = highScore.toLocaleString();
}

  ctx2.lineTo(7, -16);
  ctx2.closePath();
  ctx2.fill();
  
  // 胸甲深色
  ctx2.fillStyle = darkColor;
  ctx2.beginPath();
  ctx2.moveTo(0, -13);
  ctx2.lineTo(-5, -8);
  ctx2.lineTo(-7, 0);
  ctx2.lineTo(-5, 8);
  ctx2.lineTo(5, 8);
  ctx2.lineTo(7, 0);
  ctx2.lineTo(5, -8);
  ctx2.closePath();
  ctx2.fill();
  
  // 核心能量炉
  ctx2.shadowColor = glowColor;
  ctx2.shadowBlur = 8;
  ctx2.fillStyle = glowColor;
  ctx2.beginPath();
  ctx2.arc(0, -1, 4, 0, Math.PI * 2);
  ctx2.fill();
  ctx2.shadowBlur = 0;
  
  // 头部模块
  ctx2.fillStyle = darkColor;
  ctx2.beginPath();
  ctx2.moveTo(0, -26);
  ctx2.lineTo(-6, -20);
  ctx2.lineTo(-5, -13);
  ctx2.lineTo(5, -13);
  ctx2.lineTo(6, -20);
  ctx2.closePath();
  ctx2.fill();
  
  // 发光眼睛
  ctx2.shadowColor = glowColor;
  ctx2.shadowBlur = 6;
  ctx2.fillStyle = glowColor;
  ctx2.fillRect(-4, -18, 8, 2);
  ctx2.shadowBlur = 0;
  
  // 天线
  ctx2.strokeStyle = darkColor;
  ctx2.lineWidth = 1.5;
  ctx2.beginPath();
  ctx2.moveTo(-3, -26);
  ctx2.lineTo(-5, -31);
  ctx2.moveTo(3, -26);
  ctx2.lineTo(5, -31);
  ctx2.stroke();
  
  ctx2.fillStyle = glowColor;
  ctx2.beginPath();
  ctx2.arc(-5, -31, 1.5, 0, Math.PI * 2);
  ctx2.arc(5, -31, 1.5, 0, Math.PI * 2);
  ctx2.fill();
  
  ctx2.restore();
}

document.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  
  if (e.code === 'Space' && gameState === 'playing') {
    e.preventDefault();
    useBomb();
  }
  
  if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight') && gameState === 'playing') {
    e.preventDefault();
    useUltimate();
  }
  
  if (e.code === 'KeyP') {
    if (gameState === 'playing') pauseGame();
    else if (gameState === 'paused') resumeGame();
  }
  
  if (e.code === 'Escape') {
    if (gameState === 'playing') pauseGame();
  }
});

});

// ==================== 音效系统 ====================
function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { return; }
  }
}

function playSound(type) {
  if (!soundEnabled || !audioCtx) return;
  
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  switch(type) {
    case 'shoot':
      osc.type = 'square';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.start(now);
      osc.stop(now + 0.06);
      break;
    case 'explosion':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
      break;
    case 'hit':
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
      break;
    case 'item':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
      break;
    case 'bomb':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(100, now);
      osc.frequency.exponentialRampToValueAtTime(20, now + 0.5);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.start(now);
      osc.stop(now + 0.5);
      break;
    case 'achievement':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, now);
      osc.frequency.setValueAtTime(659, now + 0.1);
      osc.frequency.setValueAtTime(784, now + 0.2);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc.start(now);
      osc.stop(now + 0.4);
      break;
    case 'ultimate':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(80, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.8);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      osc.start(now);
      osc.stop(now + 0.8);
      break;
    case 'boss':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.linearRampToValueAtTime(80, now + 0.5);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc.start(now);
      osc.stop(now + 0.6);
      break;
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  localStorage.setItem('thunderSound', soundEnabled.toString());
  document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
  if (soundEnabled) initAudio();
}

// ==================== 成就系统 ====================
function checkAchievements() {
  for (let ach of ACHIEVEMENTS) {
    if (!unlockedAchievements.includes(ach.id) && ach.check()) {
      unlockAchievement(ach);
    }
  }
}

function unlockAchievement(ach) {
  unlockedAchievements.push(ach.id);
  localStorage.setItem('thunderAchievements', JSON.stringify(unlockedAchievements));
  
  // 显示通知
  document.getElementById('achievementIcon').textContent = ach.icon;
  document.getElementById('achievementName').textContent = ach.name;
  const notify = document.getElementById('achievementNotify');
  notify.classList.add('show');
  playSound('achievement');
  
  setTimeout(() => {
    notify.classList.remove('show');
  }, 3000);
}

function showAchievementPanel() {
  const list = document.getElementById('achievementList');
  list.innerHTML = '';
  
  for (let ach of ACHIEVEMENTS) {
    const unlocked = unlockedAchievements.includes(ach.id);
    const div = document.createElement('div');
    div.className = 'achievement-item' + (unlocked ? ' unlocked' : '');
    div.innerHTML = `
      <div class="ach-icon">${unlocked ? ach.icon : '🔒'}</div>
      <div class="ach-info">
        <div class="ach-name">${ach.name}</div>
        <div class="ach-desc">${ach.desc}</div>
      </div>
    `;
    list.appendChild(div);
  }
  
  document.getElementById('achievementPanel').style.display = 'block';
}

function hideAchievementPanel() {
  document.getElementById('achievementPanel').style.display = 'none';
}

// ==================== 大招系统 ====================
function addUltimateEnergy(amount) {
  if (ultimateActive) return;
  ultimateEnergy = Math.min(ultimateMaxEnergy, ultimateEnergy + amount);
  updateSkillBar();
}

function useUltimate() {
  if (ultimateEnergy < ultimateMaxEnergy || ultimateActive || !player) return;
  
  ultimateEnergy = 0;
  ultimateActive = true;
  ultimatesUsed++;
  playSound('ultimate');
  
  // 显示大招文字
  const ultText = document.getElementById('ultimateText');
  ultText.classList.remove('show');
  void ultText.offsetWidth;
  ultText.classList.add('show');
  
  // 全屏震动
  screenShake = 40;
  
  // 清屏效果 - 对所有敌人造成大量伤害
  for (let enemy of enemies) {
    if (enemy.alive) {
      enemy.takeDamage(20);
    }
  }
  
  // 对Boss造成大量伤害
  if (boss && boss.alive) {
    boss.takeDamage(50);
  }
  
  // 清除所有敌机子弹
  for (let b of enemyBullets) {
    createExplosion(b.x, b.y, '#ffff00', 5);
    b.alive = false;
  }
  
  // 巨型冲击波
  shockwaves.push({ x: W/2, y: H/2, radius: 0, maxRadius: 500, color: '#ffcc00' });
  
  // 大量粒子
  for (let i = 0; i < 100; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 10 + 5;
    particles.push({
      x: W/2, y: H/2,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1000, maxLife: 1000,
      color: ['#ffcc00', '#ff6600', '#ffff00', '#ffffff'][Math.floor(Math.random()*4)],
      size: Math.random() * 6 + 3
    });
  }
  
  // 玩家临时无敌
  player.invincible = 2000;
  
  setTimeout(() => {
    ultimateActive = false;
  }, 500);
  
  updateSkillBar();
  checkAchievements();
}

function updateSkillBar() {
  const percent = (ultimateEnergy / ultimateMaxEnergy) * 100;
  document.getElementById('skillFill').style.width = percent + '%';
  document.getElementById('skillReady').style.display = ultimateEnergy >= ultimateMaxEnergy ? 'block' : 'none';
}

// ==================== 剧情动画 ====================
const STORY_LINES = [
  '公元2157年...',
  '外星机械军团入侵地球',
  '人类最后的希望',
  '是你——雷霆战机驾驶员',
  '出发吧！为了人类的未来！'
];

function playStory() {
  initAudio();
  const screen = document.getElementById('storyScreen');
  const text = document.getElementById('storyText');
  screen.style.display = 'block';
  
  let lineIndex = 0;
  
  function showNextLine() {
    if (lineIndex >= STORY_LINES.length) {
      startGame();
      screen.style.display = 'none';
      return;
    }
    
    text.style.opacity = '0';
    setTimeout(() => {
      text.textContent = STORY_LINES[lineIndex];
      text.style.opacity = '1';
      lineIndex++;
      setTimeout(showNextLine, 2000);
    }, 500);
  }
  
  showNextLine();
  
  // 点击跳过
  screen.onclick = () => {
    screen.style.display = 'none';
    startGame();
  };
}

// ==================== 评价系统 ====================
function calculateRating() {
  let score_ = 0;
  
  // 分数评价
  if (score >= 50000) score_ += 30;
  else if (score >= 20000) score_ += 20;
  else if (score >= 10000) score_ += 15;
  else if (score >= 5000) score_ += 10;
  else score_ += 5;
  
  // 关卡评价
  if (currentLevel >= 5) score_ += 25;
  else if (currentLevel >= 3) score_ += 18;
  else if (currentLevel >= 2) score_ += 12;
  else score_ += 5;
  
  // 连击评价
  if (maxCombo >= 20) score_ += 20;
  else if (maxCombo >= 10) score_ += 15;
  else if (maxCombo >= 5) score_ += 10;
  else score_ += 5;
  
  // 击杀评价
  if (killCount >= 100) score_ += 15;
  else if (killCount >= 50) score_ += 12;
  else if (killCount >= 20) score_ += 8;
  else score_ += 5;
  
  // 评级
  let rating, desc;
  if (score_ >= 90) { rating = 'S'; desc = '传奇飞行员'; }
  else if (score_ >= 75) { rating = 'A'; desc = '王牌飞行员'; }
  else if (score_ >= 60) { rating = 'B'; desc = '优秀飞行员'; }
  else if (score_ >= 40) { rating = 'C'; desc = '合格飞行员'; }
  else { rating = 'D'; desc = '新手飞行员'; }
  
  document.getElementById('gameRating').textContent = rating;
  document.getElementById('ratingDesc').textContent = desc;
}
