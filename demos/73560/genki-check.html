<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元气打卡 - 每日可爱待办清单</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
  
  :root {
    --pink-light: #FFF0F5;
    --pink-main: #FF8FAB;
    --pink-deep: #FF5C8A;
    --peach: #FFB5A7;
    --cream: #FFF8F0;
    --mint: #B8F0D8;
    --mint-deep: #6DD5A0;
    --sky: #A8D8FF;
    --sky-deep: #5CB8E4;
    --lavender: #E0C3FC;
    --yellow: #FFE066;
    --yellow-deep: #FFD000;
    --orange: #FFB347;
    --text-dark: #4A3548;
    --text-mid: #7A6575;
    --text-light: #B8A0B2;
    --white: #FFFFFF;
    --shadow-soft: 0 4px 20px rgba(255, 143, 171, 0.15);
    --shadow-card: 0 8px 32px rgba(255, 92, 138, 0.1);
    --shadow-float: 0 12px 40px rgba(255, 92, 138, 0.2);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--pink-light);
    color: var(--text-dark);
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* Animated background blobs */
  .bg-blobs {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    animation: blobFloat 12s ease-in-out infinite;
  }
  .blob-1 {
    width: 400px; height: 400px;
    background: var(--pink-main);
    top: -100px; right: -100px;
    animation-delay: 0s;
  }
  .blob-2 {
    width: 350px; height: 350px;
    background: var(--mint);
    bottom: -80px; left: -80px;
    animation-delay: -4s;
  }
  .blob-3 {
    width: 300px; height: 300px;
    background: var(--sky);
    top: 40%; left: 50%;
    animation-delay: -8s;
  }
  .blob-4 {
    width: 250px; height: 250px;
    background: var(--yellow);
    top: 20%; right: 30%;
    animation-delay: -6s;
  }

  @keyframes blobFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(30px, -40px) scale(1.05); }
    50% { transform: translate(-20px, 20px) scale(0.95); }
    75% { transform: translate(15px, 35px) scale(1.02); }
  }

  /* Floating decorations */
  .floating-deco {
    position: fixed;
    pointer-events: none;
    z-index: 1;
    font-size: 24px;
    animation: decoFloat 8s ease-in-out infinite;
    opacity: 0.6;
  }
  .deco-1 { top: 10%; left: 5%; animation-delay: 0s; }
  .deco-2 { top: 25%; right: 8%; animation-delay: -2s; }
  .deco-3 { bottom: 20%; left: 10%; animation-delay: -4s; }
  .deco-4 { top: 60%; right: 5%; animation-delay: -6s; }
  .deco-5 { bottom: 35%; right: 15%; animation-delay: -3s; }
  .deco-6 { top: 45%; left: 3%; animation-delay: -5s; }
  .deco-7 { top: 80%; left: 20%; animation-delay: -1s; }
  .deco-8 { top: 15%; left: 45%; animation-delay: -7s; }

  @keyframes decoFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-15px) rotate(5deg); }
    50% { transform: translateY(10px) rotate(-3deg); }
    75% { transform: translateY(-8px) rotate(4deg); }
  }

  /* Main container */
  .container {
    position: relative;
    z-index: 2;
    max-width: 460px;
    margin: 0 auto;
    padding: 20px 16px 100px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 30px 0 20px;
    animation: slideDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo-wrapper {
    position: relative;
    display: inline-block;
    margin-bottom: 12px;
  }
  .logo-icon {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, var(--pink-main), var(--peach));
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    box-shadow: var(--shadow-float);
    transform: rotate(-3deg);
    animation: logoBounce 3s ease-in-out infinite;
  }
  @keyframes logoBounce {
    0%, 100% { transform: rotate(-3deg) scale(1); }
    50% { transform: rotate(3deg) scale(1.05); }
  }
  .logo-sparkle {
    position: absolute;
    font-size: 16px;
    animation: sparkle 2s ease-in-out infinite;
  }
  .sparkle-1 { top: -8px; right: -12px; animation-delay: 0s; }
  .sparkle-2 { top: 10px; left: -16px; animation-delay: -0.7s; }
  .sparkle-3 { bottom: -5px; right: -8px; animation-delay: -1.4s; }
  @keyframes sparkle {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  .header h1 {
    font-size: 28px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--pink-deep), var(--orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .header .subtitle {
    font-size: 14px;
    color: var(--text-mid);
    font-weight: 300;
    letter-spacing: 1px;
  }

  /* Date bar */
  .date-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--white);
    border-radius: 20px;
    padding: 14px 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-card);
    animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .date-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .date-emoji {
    font-size: 28px;
  }
  .date-text .day {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-dark);
  }
  .date-text .weekday {
    font-size: 12px;
    color: var(--text-light);
  }
  .date-right .streak-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    color: var(--white);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 20px;
    box-shadow: 0 4px 12px rgba(255, 179, 71, 0.3);
  }

  /* Progress ring */
  .progress-section {
    display: flex;
    align-items: center;
    gap: 20px;
    background: var(--white);
    border-radius: 24px;
    padding: 20px 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-card);
    animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
  }
  .progress-ring-wrapper {
    position: relative;
    width: 80px;
    height: 80px;
    flex-shrink: 0;
  }
  .progress-ring {
    transform: rotate(-90deg);
  }
  .progress-ring-bg {
    fill: none;
    stroke: var(--pink-light);
    stroke-width: 8;
  }
  .progress-ring-fill {
    fill: none;
    stroke: url(#progressGradient);
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 201;
    stroke-dashoffset: 201;
    transition: stroke-dashoffset 1s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .progress-percent {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 22px;
    font-weight: 900;
    color: var(--pink-deep);
  }
  .progress-info {
    flex: 1;
  }
  .progress-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .progress-desc {
    font-size: 12px;
    color: var(--text-light);
    line-height: 1.5;
  }
  .progress-bar-mini {
    width: 100%;
    height: 6px;
    background: var(--pink-light);
    border-radius: 3px;
    margin-top: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink-main), var(--orange));
    border-radius: 3px;
    width: 0%;
    transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Category tabs */
  .category-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    overflow-x: auto;
    padding: 2px 0;
    animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s both;
  }
  .category-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
    user-select: none;
  }
  .cat-tab.active {
    background: var(--white);
    box-shadow: var(--shadow-soft);
  }
  .cat-tab:not(.active) {
    background: rgba(255,255,255,0.5);
    color: var(--text-mid);
  }
  .cat-tab:hover:not(.active) {
    background: rgba(255,255,255,0.8);
  }
  .cat-tab .cat-emoji {
    font-size: 16px;
  }
  .cat-tab .cat-count {
    font-size: 10px;
    background: var(--pink-light);
    color: var(--pink-deep);
    padding: 2px 6px;
    border-radius: 10px;
    font-weight: 700;
  }

  /* Add task */
  .add-task-section {
    margin-bottom: 16px;
    animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s both;
  }
  .add-task-btn {
    width: 100%;
    padding: 14px 20px;
    background: linear-gradient(135deg, var(--pink-main), var(--pink-deep));
    color: var(--white);
    border: none;
    border-radius: 20px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans SC', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 6px 24px rgba(255, 92, 138, 0.3);
    transition: all 0.3s ease;
  }
  .add-task-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(255, 92, 138, 0.4);
  }
  .add-task-btn:active {
    transform: translateY(0) scale(0.98);
  }
  .add-task-btn .btn-plus {
    font-size: 20px;
    width: 28px; height: 28px;
    background: rgba(255,255,255,0.25);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Add task form */
  .add-form {
    display: none;
    background: var(--white);
    border-radius: 24px;
    padding: 20px;
    box-shadow: var(--shadow-float);
    margin-bottom: 16px;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .add-form.visible { display: block; }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .form-input {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid var(--pink-light);
    border-radius: 16px;
    font-size: 14px;
    font-family: 'Noto Sans SC', sans-serif;
    color: var(--text-dark);
    outline: none;
    transition: all 0.3s ease;
    background: var(--cream);
  }
  .form-input:focus {
    border-color: var(--pink-main);
    box-shadow: 0 0 0 4px rgba(255, 143, 171, 0.15);
  }
  .form-input::placeholder {
    color: var(--text-light);
  }
  .form-options {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .form-option {
    padding: 8px 14px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 500;
    border: 2px solid var(--pink-light);
    background: transparent;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: 'Noto Sans SC', sans-serif;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .form-option.selected {
    border-color: var(--pink-main);
    background: var(--pink-light);
    color: var(--pink-deep);
  }
  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .form-cancel {
    flex: 1;
    padding: 12px;
    border: 2px solid var(--pink-light);
    border-radius: 16px;
    background: transparent;
    color: var(--text-mid);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    transition: all 0.3s ease;
  }
  .form-cancel:hover {
    border-color: var(--text-light);
  }
  .form-submit {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--pink-main), var(--pink-deep));
    color: var(--white);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    box-shadow: 0 4px 16px rgba(255, 92, 138, 0.3);
    transition: all 0.3s ease;
  }
  .form-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(255, 92, 138, 0.4);
  }

  /* Task list */
  .task-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .task-card {
    background: var(--white);
    border-radius: 20px;
    padding: 16px 18px;
    box-shadow: var(--shadow-card);
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    animation: taskAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    position: relative;
    overflow: hidden;
  }
  @keyframes taskAppear {
    from { opacity: 0; transform: translateX(-20px) scale(0.95); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }
  .task-card.completed {
    opacity: 0.6;
  }
  .task-card.completed .task-text {
    text-decoration: line-through;
    color: var(--text-light);
  }
  .task-card.completing {
    animation: taskComplete 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes taskComplete {
    0% { transform: scale(1); }
    30% { transform: scale(1.03); }
    100% { transform: scale(1); opacity: 0.6; }
  }
  .task-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0;
    width: 4px;
    height: 100%;
    border-radius: 0 4px 4px 0;
  }
  .task-card[data-cat="work"]::before { background: var(--sky-main); background: var(--sky); }
  .task-card[data-cat="life"]::before { background: var(--pink-main); }
  .task-card[data-cat="study"]::before { background: var(--mint); }
  .task-card[data-cat="health"]::before { background: var(--orange); }

  /* Checkbox */
  .task-check {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 3px solid var(--pink-light);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    margin-top: 2px;
  }
  .task-check:hover {
    border-color: var(--pink-main);
    transform: scale(1.1);
  }
  .task-check.checked {
    background: linear-gradient(135deg, var(--mint-deep), var(--mint));
    border-color: transparent;
    animation: checkBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes checkBounce {
    0% { transform: scale(0.8); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .task-check .check-icon {
    font-size: 14px;
    opacity: 0;
    transform: scale(0);
    transition: all 0.3s ease;
  }
  .task-check.checked .check-icon {
    opacity: 1;
    transform: scale(1);
  }

  .task-content {
    flex: 1;
    min-width: 0;
  }
  .task-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .task-emoji {
    font-size: 16px;
  }
  .task-text {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-dark);
    transition: all 0.3s ease;
  }
  .task-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
  }
  .task-tag {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 10px;
    font-weight: 500;
  }
  .tag-work { background: #E3F2FD; color: #1976D2; }
  .tag-life { background: var(--pink-light); color: var(--pink-deep); }
  .tag-study { background: #E8F5E9; color: #388E3C; }
  .tag-health { background: #FFF3E0; color: #F57C00; }
  .task-time {
    font-size: 11px;
    color: var(--text-light);
  }
  .task-priority {
    font-size: 11px;
    color: var(--pink-deep);
    font-weight: 500;
  }

  /* Celebration overlay */
  .celebration {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 100;
    display: none;
  }
  .celebration.active { display: block; }
  .confetti {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    animation: confettiFall 2s ease-out forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 460px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px 24px 0 0;
    padding: 12px 20px 28px;
    display: flex;
    justify-content: space-around;
    z-index: 50;
    box-shadow: 0 -4px 24px rgba(255, 143, 171, 0.1);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.3s ease;
    padding: 4px 12px;
    border-radius: 12px;
  }
  .nav-item:hover {
    background: var(--pink-light);
  }
  .nav-item.active .nav-icon {
    transform: scale(1.1);
  }
  .nav-item.active .nav-label {
    color: var(--pink-deep);
    font-weight: 700;
  }
  .nav-icon {
    font-size: 24px;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .nav-label {
    font-size: 11px;
    color: var(--text-light);
    font-weight: 400;
    transition: all 0.3s ease;
  }

  /* Toast message */
  .toast {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--white);
    padding: 12px 24px;
    border-radius: 20px;
    box-shadow: var(--shadow-float);
    font-size: 14px;
    font-weight: 500;
    z-index: 200;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  /* Motivational banner */
  .motivation-banner {
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    border-radius: 20px;
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 6px 24px rgba(255, 179, 71, 0.25);
    animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.55s both;
  }
  .motivation-emoji {
    font-size: 32px;
    animation: wave 2s ease-in-out infinite;
  }
  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(15deg); }
    75% { transform: rotate(-10deg); }
  }
  .motivation-text {
    font-size: 14px;
    font-weight: 700;
    color: var(--white);
    line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  /* Responsive */
  @media (max-width: 480px) {
    .container { padding: 16px 12px 100px; }
    .header h1 { font-size: 24px; }
    .progress-section { padding: 16px 18px; gap: 16px; }
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    animation: fadeIn 0.6s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .empty-emoji {
    font-size: 48px;
    margin-bottom: 12px;
    animation: bounce 2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .empty-text {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-mid);
    margin-bottom: 4px;
  }
  .empty-sub {
    font-size: 12px;
    color: var(--text-light);
  }

  /* Delete button */
  .task-delete {
    width: 24px; height: 24px;
    border-radius: 8px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    opacity: 0;
    transition: all 0.3s ease;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .task-card:hover .task-delete {
    opacity: 0.5;
  }
  .task-delete:hover {
    opacity: 1 !important;
    background: var(--pink-light);
  }
</style>
</head>
<body>

<!-- Animated background -->
<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
</div>

<!-- Floating decorations -->
<div class="floating-deco deco-1">🌸</div>
<div class="floating-deco deco-2">☁️</div>
<div class="floating-deco deco-3">⭐</div>
<div class="floating-deco deco-4">🦋</div>
<div class="floating-deco deco-5">🎀</div>
<div class="floating-deco deco-6">💫</div>
<div class="floating-deco deco-7">🌈</div>
<div class="floating-deco deco-8">🍀</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Celebration -->
<div class="celebration" id="celebration"></div>

<!-- Main content -->
<div class="container">
  
  <!-- Header -->
  <header class="header">
    <div class="logo-wrapper">
      <div class="logo-icon">📝</div>
      <span class="logo-sparkle sparkle-1">✨</span>
      <span class="logo-sparkle sparkle-2">⭐</span>
      <span class="logo-sparkle sparkle-3">💖</span>
    </div>
    <h1>元气打卡</h1>
    <p class="subtitle">每天进步一点点就很棒 ✨</p>
  </header>

  <!-- Date bar -->
  <div class="date-bar">
    <div class="date-left">
      <div class="date-emoji">🌞</div>
      <div class="date-text">
        <div class="day" id="dateDay"></div>
        <div class="weekday" id="dateWeekday"></div>
      </div>
    </div>
    <div class="date-right">
      <div class="streak-badge">🔥 <span id="streakCount">7</span>天连续打卡</div>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-section">
    <div class="progress-ring-wrapper">
      <svg class="progress-ring" width="80" height="80">
        <defs>
          <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FF8FAB"/>
            <stop offset="100%" style="stop-color:#FFB347"/>
          </linearGradient>
        </defs>
        <circle class="progress-ring-bg" cx="40" cy="40" r="32"/>
        <circle class="progress-ring-fill" id="progressRing" cx="40" cy="40" r="32"/>
      </svg>
      <div class="progress-percent" id="progressPercent">0%</div>
    </div>
    <div class="progress-info">
      <div class="progress-title" id="progressTitle">今日进度</div>
      <div class="progress-desc" id="progressDesc">已完成 0/0 个任务，加油哦~</div>
      <div class="progress-bar-mini">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
    </div>
  </div>

  <!-- Motivation -->
  <div class="motivation-banner">
    <div class="motivation-emoji">🐾</div>
    <div class="motivation-text" id="motivationText">新的一天开始啦！<br>把小目标一个个完成吧~</div>
  </div>

  <!-- Category tabs -->
  <div class="category-tabs" id="categoryTabs">
    <div class="cat-tab active" data-cat="all">
      <span class="cat-emoji">📋</span>
      <span>全部</span>
      <span class="cat-count" id="countAll">0</span>
    </div>
    <div class="cat-tab" data-cat="work">
      <span class="cat-emoji">💼</span>
      <span>工作</span>
      <span class="cat-count" id="countWork">0</span>
    </div>
    <div class="cat-tab" data-cat="study">
      <span class="cat-emoji">📖</span>
      <span>学习</span>
      <span class="cat-count" id="countStudy">0</span>
    </div>
    <div class="cat-tab" data-cat="life">
      <span class="cat-emoji">🌸</span>
      <span>生活</span>
      <span class="cat-count" id="countLife">0</span>
    </div>
    <div class="cat-tab" data-cat="health">
      <span class="cat-emoji">🏃</span>
      <span>健康</span>
      <span class="cat-count" id="countHealth">0</span>
    </div>
  </div>

  <!-- Add task button -->
  <div class="add-task-section">
    <button class="add-task-btn" id="addTaskBtn">
      <span class="btn-plus">+</span>
      添加新任务
    </button>
  </div>

  <!-- Add form -->
  <div class="add-form" id="addForm">
    <input class="form-input" id="taskInput" type="text" placeholder="今天要完成什么呢~" maxlength="50" />
    <div class="form-options" id="formOptions">
      <button class="form-option" data-cat="work">💼 工作</button>
      <button class="form-option" data-cat="study">📖 学习</button>
      <button class="form-option" data-cat="life">🌸 生活</button>
      <button class="form-option" data-cat="health">🏃 健康</button>
    </div>
    <div class="form-actions">
      <button class="form-cancel" id="formCancel">取消</button>
      <button class="form-submit" id="formSubmit">添加任务 🎉</button>
    </div>
  </div>

  <!-- Task list -->
  <div class="task-list" id="taskList"></div>

</div>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <div class="nav-item active">
    <div class="nav-icon">🏠</div>
    <div class="nav-label">首页</div>
  </div>
  <div class="nav-item">
    <div class="nav-icon">📊</div>
    <div class="nav-label">统计</div>
  </div>
  <div class="nav-item">
    <div class="nav-icon">🏆</div>
    <div class="nav-label">成就</div>
  </div>
  <div class="nav-item">
    <div class="nav-icon">⚙️</div>
    <div class="nav-label">设置</div>
  </div>
</nav>

<script>
// ===== Data =====
const categoryConfig = {
  work:  { emoji: '💼', label: '工作', tagClass: 'tag-work',  emojis: ['💻','📊','📧','📝','🎯'] },
  study: { emoji: '📖', label: '学习', tagClass: 'tag-study', emojis: ['📚','🎓','💡','🔬','✏️'] },
  life:  { emoji: '🌸', label: '生活', tagClass: 'tag-life',  emojis: ['🛒','🍳','🏠','🎵','🧹'] },
  health:{ emoji: '🏃', label: '健康', tagClass: 'tag-health', emojis: ['💧','🧘','🏋️','🥗','😴'] },
};

const defaultTasks = [
  { id: 1, text: '完成周报提交', category: 'work', completed: false, time: '09:00' },
  { id: 2, text: '阅读30分钟技术文章', category: 'study', completed: true, time: '10:00' },
  { id: 3, text: '喝满8杯水', category: 'health', completed: false, time: '全天' },
  { id: 4, text: '整理桌面和书架', category: 'life', completed: false, time: '14:00' },
  { id: 5, text: '复习算法笔记', category: 'study', completed: true, time: '15:00' },
  { id: 6, text: '下楼散步30分钟', category: 'health', completed: false, time: '18:00' },
  { id: 7, text: '给植物浇水', category: 'life', completed: false, time: '19:00' },
];

const motivations = [
  '新的一天开始啦！<br>把小目标一个个完成吧~',
  '你比昨天更棒了！<br>继续保持元气满满哦 ✨',
  '每完成一个小任务<br>都是对自己的肯定 💪',
  '今天也要开开心心地<br>把事情做完呀 🌟',
  '慢慢来，比较快~<br>一步一个脚印就很好 🌸',
];

// ===== State =====
let tasks = JSON.parse(JSON.stringify(defaultTasks));
let currentFilter = 'all';
let nextId = 100;
let selectedCategory = 'life';

// ===== DOM =====
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

const dateDayEl = $('#dateDay');
const dateWeekdayEl = $('#dateWeekday');
const taskListEl = $('#taskList');
const addTaskBtn = $('#addTaskBtn');
const addForm = $('#addForm');
const taskInput = $('#taskInput');
const formCancel = $('#formCancel');
const formSubmit = $('#formSubmit');
const toastEl = $('#toast');
const celebrationEl = $('#celebration');
const progressRing = $('#progressRing');
const progressPercent = $('#progressPercent');
const progressDesc = $('#progressDesc');
const progressBarFill = $('#progressBarFill');
const motivationText = $('#motivationText');
const categoryTabs = $('#categoryTabs');

// ===== Init =====
function init() {
  setDate();
  setRandomMotivation();
  renderTasks();
  updateProgress();
  bindEvents();
  // Animate progress after a short delay
  setTimeout(() => {
    const completed = tasks.filter(t => t.completed).length;
    const total = tasks.length;
    const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
    updateProgressRing(pct);
  }, 600);
}

function setDate() {
  const now = new Date();
  const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  dateDayEl.textContent = `${months[now.getMonth()]} ${now.getDate()}日`;
  dateWeekdayEl.textContent = `${weekdays[now.getDay()]} · ${now.getFullYear()}`;
}

function setRandomMotivation() {
  const idx = Math.floor(Math.random() * motivations.length);
  motivationText.innerHTML = motivations[idx];
}

// ===== Events =====
function bindEvents() {
  addTaskBtn.addEventListener('click', () => {
    addForm.classList.toggle('visible');
    if (addForm.classList.contains('visible')) {
      taskInput.focus();
    }
  });

  formCancel.addEventListener('click', () => {
    addForm.classList.remove('visible');
    taskInput.value = '';
    resetFormOptions();
  });

  formSubmit.addEventListener('click', addTask);

  taskInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
  });

  $$('.form-option').forEach(opt => {
    opt.addEventListener('click', () => {
      $$('.form-option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      selectedCategory = opt.dataset.cat;
    });
  });

  categoryTabs.addEventListener('click', (e) => {
    const tab = e.target.closest('.cat-tab');
    if (!tab) return;
    $$('.cat-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.cat;
    renderTasks();
  });
}

function resetFormOptions() {
  $$('.form-option').forEach(o => o.classList.remove('selected'));
  selectedCategory = 'life';
}

// ===== Task operations =====
function addTask() {
  const text = taskInput.value.trim();
  if (!text) {
    showToast('📝 请输入任务内容~');
    taskInput.focus();
    return;
  }
  
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const mins = String(now.getMinutes()).padStart(2, '0');
  
  const task = {
    id: nextId++,
    text,
    category: selectedCategory,
    completed: false,
    time: `${hours}:${mins}`,
  };
  
  tasks.unshift(task);
  taskInput.value = '';
  addForm.classList.remove('visible');
  resetFormOptions();
  renderTasks();
  updateProgress();
  showToast('🎉 任务添加成功！元气满满~');
}

function toggleTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  
  task.completed = !task.completed;
  
  const card = document.querySelector(`.task-card[data-id="${id}"]`);
  
  if (task.completed) {
    card.classList.add('completing');
    showToast('太棒了！完成一个任务~ 🎉');
    celebrate();
    
    // Check if all tasks done
    const allDone = tasks.every(t => t.completed);
    if (allDone && tasks.length > 0) {
      setTimeout(() => {
        showToast('🎊 全部完成！今天你是大赢家！');
        celebrate();
        setTimeout(celebrate, 300);
      }, 800);
    }
  } else {
    showToast('重新加油~ 💪');
  }
  
  setTimeout(() => {
    renderTasks();
    updateProgress();
  }, 400);
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  renderTasks();
  updateProgress();
  showToast('任务已删除~');
}

// ===== Render =====
function renderTasks() {
  const filtered = currentFilter === 'all' 
    ? tasks 
    : tasks.filter(t => t.category === currentFilter);
  
  // Update counts
  const counts = { all: tasks.length, work: 0, study: 0, life: 0, health: 0 };
  tasks.forEach(t => { counts[t.category]++; });
  $('#countAll').textContent = counts.all;
  $('#countWork').textContent = counts.work;
  $('#countStudy').textContent = counts.study;
  $('#countLife').textContent = counts.life;
  $('#countHealth').textContent = counts.health;
  
  if (filtered.length === 0) {
    taskListEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-emoji">🐱</div>
        <div class="empty-text">还没有任务哦~</div>
        <div class="empty-sub">点击上方按钮添加你的第一个任务吧</div>
      </div>
    `;
    return;
  }
  
  taskListEl.innerHTML = filtered.map((task, i) => {
    const cat = categoryConfig[task.category];
    const emoji = cat.emojis[task.id % cat.emojis.length];
    return `
      <div class="task-card ${task.completed ? 'completed' : ''}" data-id="${task.id}" data-cat="${task.category}" style="animation-delay: ${i * 0.06}s">
        <div class="task-check ${task.completed ? 'checked' : ''}" onclick="toggleTask(${task.id})">
          <span class="check-icon">✓</span>
        </div>
        <div class="task-content">
          <div class="task-header">
            <span class="task-emoji">${emoji}</span>
            <span class="task-text">${escapeHtml(task.text)}</span>
          </div>
          <div class="task-meta">
            <span class="task-tag ${cat.tagClass}">${cat.label}</span>
            <span class="task-time">⏰ ${task.time}</span>
          </div>
        </div>
        <button class="task-delete" onclick="deleteTask(${task.id})" title="删除">✕</button>
      </div>
    `;
  }).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== Progress =====
function updateProgress() {
  const completed = tasks.filter(t => t.completed).length;
  const total = tasks.length;
  const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
  
  progressPercent.textContent = `${pct}%`;
  progressDesc.textContent = `已完成 ${completed}/${total} 个任务，${getEncouragement(pct)}`;
  progressBarFill.style.width = `${pct}%`;
  updateProgressRing(pct);
}

function updateProgressRing(pct) {
  const circumference = 2 * Math.PI * 32; // ~201
  const offset = circumference - (circumference * pct / 100);
  progressRing.style.strokeDashoffset = offset;
}

function getEncouragement(pct) {
  if (pct === 0) return '加油哦~';
  if (pct < 30) return '好的开始！';
  if (pct < 50) return '继续冲呀~';
  if (pct < 80) return '快要一半啦！';
  if (pct < 100) return '就差一点了！';
  return '完美通关！！';
}

// ===== Toast =====
function showToast(message) {
  toastEl.innerHTML = message;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2500);
}

// ===== Celebration =====
function celebrate() {
  celebrationEl.classList.add('active');
  const colors = ['#FF8FAB', '#FFB5A7', '#B8F0D8', '#A8D8FF', '#FFE066', '#FFB347', '#E0C3FC'];
  
  for (let i = 0; i < 30; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.top = '-10px';
    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.width = (Math.random() * 8 + 6) + 'px';
    confetti.style.height = confetti.style.width;
    confetti.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
    confetti.style.animationDelay = (Math.random() * 0.5) + 's';
    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    celebrationEl.appendChild(confetti);
  }
  
  setTimeout(() => {
    celebrationEl.classList.remove('active');
    celebrationEl.innerHTML = '';
  }, 3000);
}

// ===== Start =====
init();
</script>
</body>
</html>
