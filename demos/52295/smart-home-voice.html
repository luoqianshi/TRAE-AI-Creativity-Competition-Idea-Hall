<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智能家居语音控制面板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #fff;
    padding: 20px;
  }
  .container { max-width: 920px; margin: 0 auto; }
  header { text-align: center; padding: 24px 0 16px; }
  h1 { font-size: 1.8em; margin-bottom: 6px; }
  .subtitle { opacity: 0.85; font-size: 14px; }

  .voice-panel {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 24px;
    text-align: center;
    margin-bottom: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .mic-btn {
    width: 84px; height: 84px; border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
    color: #fff; font-size: 36px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(238, 90, 111, 0.4);
    transition: transform 0.2s;
  }
  .mic-btn:hover { transform: scale(1.05); }
  .mic-btn.listening {
    animation: pulse 1.2s infinite;
    background: linear-gradient(135deg, #4ecdc4, #44a08d);
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(78, 205, 196, 0.7); }
    70% { box-shadow: 0 0 0 20px rgba(78, 205, 196, 0); }
    100% { box-shadow: 0 0 0 0 rgba(78, 205, 196, 0); }
  }
  .voice-status { margin-top: 14px; font-size: 15px; min-height: 24px; }
  .recognized {
    margin-top: 8px; padding: 8px 12px;
    background: rgba(0, 0, 0, 0.2); border-radius: 10px;
    font-size: 16px; font-weight: bold; min-height: 34px;
  }
  .cmd-buttons {
    margin-top: 16px; display: flex; flex-wrap: wrap;
    gap: 6px 8px; justify-content: center;
  }
  .cmd-btn {
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff; padding: 7px 12px; border-radius: 18px;
    font-size: 13px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, transform 0.1s;
  }
  .cmd-btn:hover { background: rgba(255, 255, 255, 0.3); }
  .cmd-btn:active { transform: scale(0.95); background: rgba(78, 205, 196, 0.4); }
  .cmd-btn.scene {
    background: linear-gradient(135deg, rgba(255, 107, 107, 0.45), rgba(238, 90, 111, 0.45));
    border-color: rgba(255, 255, 255, 0.45);
  }

  /* ===== 房子平面图 ===== */
  .floorplan-wrap {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .floorplan-title {
    text-align: center; font-size: 14px; margin-bottom: 8px; opacity: 0.9;
  }
  .floorplan {
    width: 100%; height: auto; display: block;
    max-height: 620px;
  }
  .room { fill: rgba(255, 255, 255, 0.12); stroke: #fff; stroke-width: 2.5; transition: fill 0.25s; }
  .room-label {
    fill: #fff; font-size: 13px; font-weight: bold;
    text-anchor: middle; pointer-events: none;
    font-family: "Microsoft YaHei", sans-serif;
  }
  .room-area {
    fill: #fff; font-size: 10px;
    text-anchor: middle; pointer-events: none; opacity: 0.75;
    font-family: "Microsoft YaHei", sans-serif;
  }
  .door-arc { fill: none; stroke: #fff; stroke-width: 1.5; stroke-dasharray: 4 3; opacity: 0.7; }
  .device-icon {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s;
    transform-box: fill-box;
    transform-origin: center;
  }
  .device-icon:hover { transform: scale(1.15); }
  .device-icon:active { transform: scale(0.9); }
  .device-bg { fill: rgba(0, 0, 0, 0.25); stroke: rgba(255, 255, 255, 0.35); stroke-width: 1.5; }
  .device-icon.on .device-bg { fill: rgba(255, 220, 100, 0.35); stroke: #ffeb8a; }
  .device-icon.on .device-emoji { filter: drop-shadow(0 0 6px #ffeb8a); }
  .device-emoji { font-size: 22px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .device-emoji.big { font-size: 26px; }

  /* 灯开时整个房间变亮黄色 */
  .room.lit { fill: rgba(255, 225, 120, 0.28); }
  /* 空调开时小雪花动画 */
  .ac-cool { fill: #4ecdc4; font-size: 12px; text-anchor: middle; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .device-icon.on .ac-cool { opacity: 0.9; }
  /* 窗帘状态文字 */
  .curtain-line { stroke: #fff; stroke-width: 2; opacity: 0.75; }
  .device-icon.on .curtain-line { stroke: #ffeb8a; stroke-width: 2.5; }
  /* 音响播放时的音波 */
  .sound-wave { fill: none; stroke: #4ecdc4; stroke-width: 2; opacity: 0; }
  .device-icon.on .sound-wave { animation: wave 1.3s infinite ease-out; }
  @keyframes wave {
    0%   { opacity: 0.9; transform: scale(0.4); }
    100% { opacity: 0; transform: scale(1.4); }
  }
  .sound-wave.w2 { animation-delay: 0.5s; }
  .sound-wave.w3 { animation-delay: 0.9s; }

  .log-panel {
    background: rgba(0, 0, 0, 0.3);
    border-radius: 15px; padding: 18px;
  }
  .log-title { font-size: 14px; margin-bottom: 8px; opacity: 0.85; }
  .log-list { list-style: none; max-height: 140px; overflow-y: auto; font-size: 13px; line-height: 1.8; }
  .log-list li { opacity: 0.92; }
  .log-list li::before { content: "▸ "; color: #4ecdc4; }

  @media (max-width: 640px) {
    body { padding: 12px; }
    header { padding: 16px 0 12px; }
    h1 { font-size: 1.4em; }
    .subtitle { font-size: 12px; }
    .voice-panel { padding: 18px 14px; }
    .mic-btn { width: 68px; height: 68px; font-size: 28px; }
    .recognized { font-size: 14px; padding: 7px 10px; }
    .cmd-btn { font-size: 12px; padding: 6px 10px; }
    .floorplan-wrap { padding: 12px; border-radius: 16px; }
    .room-label { font-size: 11px; }
    .room-area { font-size: 9px; }
    .device-emoji { font-size: 18px; }
    .device-emoji.big { font-size: 22px; }
    .ac-cool { font-size: 10px; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>🏠 智能家居语音控制面板</h1>
    <p class="subtitle">144㎡ · 3室2厅1厨2卫1阳台 · 点击图标或用语音控制</p>
  </header>

  <div class="voice-panel">
    <button class="mic-btn" id="micBtn">🎤</button>
    <div class="voice-status" id="voiceStatus">点击麦克风开始语音控制</div>
    <div class="recognized" id="recognizedText">—</div>
    <div class="cmd-buttons" id="cmdButtons"></div>
  </div>

  <div class="floorplan-wrap">
    <div class="floorplan-title">📐 房子平面图 · 点击图标切换状态</div>
    <!-- viewBox: 600x600, 1m = 50px, 房屋 12m×12m -->
    <svg class="floorplan" id="floorplan" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">

      <!-- 外墙（稍微粗一点的阴影边框） -->
      <rect x="6" y="6" width="588" height="588" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3" rx="10"/>

      <!-- ========== 房间 ========== -->
      <!-- 主卧 (x=20,y=20,w=200,h=200) 4m×4m 左上 -->
      <rect class="room" id="room-master" x="20" y="20" width="200" height="200" rx="4"/>
      <text class="room-label" x="120" y="110">主 卧</text>
      <text class="room-area" x="120" y="130">16㎡</text>

      <!-- 主卫 (x=220,y=20,w=100,h=200) 2m×4m -->
      <rect class="room" id="room-bath1" x="220" y="20" width="100" height="200" rx="4"/>
      <text class="room-label" x="270" y="110">主 卫</text>
      <text class="room-area" x="270" y="130">8㎡</text>

      <!-- 次卧1 (x=320,y=20,w=150,h=200) 3m×4m -->
      <rect class="room" id="room-br1" x="320" y="20" width="150" height="200" rx="4"/>
      <text class="room-label" x="395" y="110">次卧 1</text>
      <text class="room-area" x="395" y="130">12㎡</text>

      <!-- 次卧2 (x=470,y=20,w=110,h=200) 3m×4m（右侧微调）-->
      <rect class="room" id="room-br2" x="470" y="20" width="110" height="200" rx="4"/>
      <text class="room-label" x="525" y="110">次卧 2</text>
      <text class="room-area" x="525" y="130">12㎡</text>

      <!-- 客厅 (x=20,y=220,w=300,h=220) 6m×4.4m -->
      <rect class="room" id="room-living" x="20" y="220" width="300" height="220" rx="4"/>
      <text class="room-label" x="170" y="315">客 厅</text>
      <text class="room-area" x="170" y="335">26㎡</text>

      <!-- 餐厅 (x=320,y=220,w=150,h=220) 3m×4.4m -->
      <rect class="room" id="room-dining" x="320" y="220" width="150" height="220" rx="4"/>
      <text class="room-label" x="395" y="315">餐 厅</text>
      <text class="room-area" x="395" y="335">13㎡</text>

      <!-- 厨房 (x=470,y=220,w=110,h=220) 2.2m×4.4m -->
      <rect class="room" id="room-kitchen" x="470" y="220" width="110" height="220" rx="4"/>
      <text class="room-label" x="525" y="315">厨 房</text>
      <text class="room-area" x="525" y="335">10㎡</text>

      <!-- 次卫 (x=20,y=450,w=130,h=130) 2.6m×2.6m -->
      <rect class="room" id="room-bath2" x="20" y="450" width="130" height="130" rx="4"/>
      <text class="room-label" x="85" y="510">次 卫</text>
      <text class="room-area" x="85" y="530">7㎡</text>

      <!-- 阳台 (x=160,y=450,w=420,h=130) 8.4m×2.6m -->
      <rect class="room" id="room-balcony" x="160" y="450" width="420" height="130" rx="4"/>
      <text class="room-label" x="370" y="510">阳 台</text>
      <text class="room-area" x="370" y="530">22㎡</text>

      <!-- 门（简单虚线弧线表示门的开启方向） -->
      <path class="door-arc" d="M 100 220 A 40 40 0 0 1 140 250"/>
      <path class="door-arc" d="M 270 220 A 30 30 0 0 1 300 240"/>
      <path class="door-arc" d="M 395 220 A 30 30 0 0 1 425 240"/>
      <path class="door-arc" d="M 525 220 A 30 30 0 0 1 555 240"/>
      <path class="door-arc" d="M 170 440 A 30 30 0 0 1 200 470"/>
      <path class="door-arc" d="M 395 440 A 30 30 0 0 1 425 470"/>
      <path class="door-arc" d="M 525 440 A 30 30 0 0 1 555 470"/>
      <path class="door-arc" d="M 150 450 A 30 30 0 0 0 120 480"/>

      <!-- ========== 设备图标：灯 💡 ========== -->
      <!-- 主卧灯 -->
      <g class="device-icon" data-type="light" data-room="master" data-name="主卧灯">
        <rect class="device-bg" x="78" y="50" width="50" height="38" rx="19"/>
        <text class="device-emoji" x="103" y="69">💡</text>
        <text class="ac-cool" x="103" y="96">ON</text>
      </g>
      <!-- 主卫灯 -->
      <g class="device-icon" data-type="light" data-room="bath1" data-name="主卫灯">
        <rect class="device-bg" x="245" y="50" width="50" height="38" rx="19"/>
        <text class="device-emoji" x="270" y="69">💡</text>
      </g>
      <!-- 次卧1灯 -->
      <g class="device-icon" data-type="light" data-room="br1" data-name="次卧1灯">
        <rect class="device-bg" x="370" y="50" width="50" height="38" rx="19"/>
        <text class="device-emoji" x="395" y="69">💡</text>
      </g>
      <!-- 次卧2灯 -->
      <g class="device-icon" data-type="light" data-room="br2" data-name="次卧2灯">
        <rect class="device-bg" x="500" y="50" width="50" height="38" rx="19"/>
        <text class="device-emoji" x="525" y="69">💡</text>
      </g>
      <!-- 客厅灯 -->
      <g class="device-icon" data-type="light" data-room="living" data-name="客厅灯">
        <rect class="device-bg" x="145" y="245" width="50" height="38" rx="19"/>
        <text class="device-emoji" x="170" y="264">💡</text>
      </g>
      <!-- 餐厅灯 -->
      <g class="device-icon" data-type="light" data-room="dining" data-name="餐厅灯">
        <rect class="device-bg" x="370" y="245" width="50" height="38" rx="19"/>
        <text class="device-emoji" x="395" y="264">💡</text>
      </g>
      <!-- 厨房灯 -->
      <g class="device-icon" data-type="light" data-room="kitchen" data-name="厨房灯">
        <rect class="device-bg" x="500" y="245" width="50" height="38" rx="19"/>
        <text class="device-emoji" x="525" y="264">💡</text>
      </g>
      <!-- 次卫灯 -->
      <g class="device-icon" data-type="light" data-room="bath2" data-name="次卫灯">
        <rect class="device-bg" x="50" y="470" width="50" height="38" rx="19"/>
        <text class="device-emoji" x="75" y="489">💡</text>
      </g>
      <!-- 阳台灯 -->
      <g class="device-icon" data-type="light" data-room="balcony" data-name="阳台灯">
        <rect class="device-bg" x="350" y="470" width="50" height="38" rx="19"/>
        <text class="device-emoji" x="375" y="489">💡</text>
      </g>

      <!-- ========== 空调 ❄️ ========== -->
      <!-- 主卧空调 -->
      <g class="device-icon" data-type="ac" data-room="master" data-name="主卧空调">
        <rect class="device-bg" x="158" y="50" width="60" height="38" rx="19"/>
        <text class="device-emoji" x="188" y="69">❄️</text>
        <text class="ac-cool" x="188" y="96">26°</text>
      </g>
      <!-- 次卧1空调 -->
      <g class="device-icon" data-type="ac" data-room="br1" data-name="次卧1空调">
        <rect class="device-bg" x="275" y="160" width="60" height="38" rx="19"/>
        <text class="device-emoji" x="305" y="179">❄️</text>
        <text class="ac-cool" x="305" y="206">26°</text>
      </g>
      <!-- 次卧2空调 -->
      <g class="device-icon" data-type="ac" data-room="br2" data-name="次卧2空调">
        <rect class="device-bg" x="430" y="160" width="60" height="38" rx="19"/>
        <text class="device-emoji" x="460" y="179">❄️</text>
        <text class="ac-cool" x="460" y="206">26°</text>
      </g>
      <!-- 客厅空调 -->
      <g class="device-icon" data-type="ac" data-room="living" data-name="客厅空调">
        <rect class="device-bg" x="20" y="280" width="60" height="38" rx="19"/>
        <text class="device-emoji" x="50" y="299">❄️</text>
        <text class="ac-cool" x="50" y="326">26°</text>
      </g>
      <!-- 餐厅空调 -->
      <g class="device-icon" data-type="ac" data-room="dining" data-name="餐厅空调">
        <rect class="device-bg" x="320" y="280" width="60" height="38" rx="19"/>
        <text class="device-emoji" x="350" y="299">❄️</text>
        <text class="ac-cool" x="350" y="326">26°</text>
      </g>

      <!-- ========== 窗帘 🪟 ========== -->
      <!-- 主卧窗帘（靠上沿） -->
      <g class="device-icon" data-type="curtain" data-room="master" data-name="主卧窗帘">
        <rect class="device-bg" x="158" y="160" width="60" height="38" rx="19"/>
        <text class="device-emoji" x="188" y="179">🪟</text>
      </g>
      <!-- 客厅窗帘（靠左沿大窗） -->
      <g class="device-icon" data-type="curtain" data-room="living" data-name="客厅窗帘">
        <rect class="device-bg" x="220" y="400" width="60" height="38" rx="19"/>
        <text class="device-emoji" x="250" y="419">🪟</text>
      </g>
      <!-- 次卧1窗帘 -->
      <g class="device-icon" data-type="curtain" data-room="br1" data-name="次卧1窗帘">
        <rect class="device-bg" x="370" y="160" width="50" height="38" rx="19"/>
        <text class="device-emoji" x="395" y="179">🪟</text>
      </g>
      <!-- 次卧2窗帘 -->
      <g class="device-icon" data-type="curtain" data-room="br2" data-name="次卧2窗帘">
        <rect class="device-bg" x="500" y="160" width="50" height="38" rx="19"/>
        <text class="device-emoji" x="525" y="179">🪟</text>
      </g>
      <!-- 阳台窗帘 -->
      <g class="device-icon" data-type="curtain" data-room="balcony" data-name="阳台窗帘">
        <rect class="device-bg" x="510" y="470" width="60" height="38" rx="19"/>
        <text class="device-emoji" x="540" y="489">🪟</text>
      </g>

      <!-- ========== 音响 🔊（音乐 + 闹钟） ========== -->
      <!-- 客厅音响（主要音乐播放） -->
      <g class="device-icon" data-type="music" data-room="living" data-name="客厅音响">
        <circle class="device-bg" cx="120" cy="400" r="26"/>
        <text class="device-emoji big" x="120" y="400">🔊</text>
        <circle class="sound-wave" cx="120" cy="400" r="22"/>
        <circle class="sound-wave w2" cx="120" cy="400" r="22"/>
        <circle class="sound-wave w3" cx="120" cy="400" r="22"/>
      </g>
      <!-- 主卧音响（闹钟+音乐） -->
      <g class="device-icon" data-type="alarm" data-room="master" data-name="主卧闹钟">
        <circle class="device-bg" cx="70" cy="180" r="24"/>
        <text class="device-emoji big" x="70" y="180">⏰</text>
        <circle class="sound-wave" cx="70" cy="180" r="20"/>
        <circle class="sound-wave w2" cx="70" cy="180" r="20"/>
      </g>
      <!-- 厨房音响 -->
      <g class="device-icon" data-type="music" data-room="kitchen" data-name="厨房音响">
        <circle class="device-bg" cx="525" cy="410" r="22"/>
        <text class="device-emoji big" x="525" y="410">🔊</text>
        <circle class="sound-wave" cx="525" cy="410" r="18"/>
        <circle class="sound-wave w2" cx="525" cy="410" r="18"/>
      </g>

      <!-- 面积总览小标签 -->
      <text x="580" y="590" text-anchor="end" fill="#fff" font-size="11" opacity="0.7" font-family="Microsoft YaHei">总面积约 144 ㎡</text>

    </svg>
  </div>

  <div class="log-panel">
    <div class="log-title">📋 操作日志</div>
    <ul class="log-list" id="logList"></ul>
  </div>

</div>

<script>
  // ========== 设备状态 ==========
  // 灯：9 盏，空调：5 台，窗帘：5 组，音乐：2 个（客厅/厨房），闹钟：1 个（主卧）
  const devices = {
    // 灯
    light_master:  { type: "light",   name: "主卧灯",    room: "master",  on: false },
    light_bath1:   { type: "light",   name: "主卫灯",    room: "bath1",   on: false },
    light_br1:     { type: "light",   name: "次卧1灯",   room: "br1",     on: false },
    light_br2:     { type: "light",   name: "次卧2灯",   room: "br2",     on: false },
    light_living:  { type: "light",   name: "客厅灯",    room: "living",  on: false },
    light_dining:  { type: "light",   name: "餐厅灯",    room: "dining",  on: false },
    light_kitchen: { type: "light",   name: "厨房灯",    room: "kitchen", on: false },
    light_bath2:   { type: "light",   name: "次卫灯",    room: "bath2",   on: false },
    light_balcony: { type: "light",   name: "阳台灯",    room: "balcony", on: false },
    // 空调
    ac_master:     { type: "ac",      name: "主卧空调",  room: "master",  on: false, temp: 26 },
    ac_br1:        { type: "ac",      name: "次卧1空调", room: "br1",     on: false, temp: 26 },
    ac_br2:        { type: "ac",      name: "次卧2空调", room: "br2",     on: false, temp: 26 },
    ac_living:     { type: "ac",      name: "客厅空调",  room: "living",  on: false, temp: 26 },
    ac_dining:     { type: "ac",      name: "餐厅空调",  room: "dining",  on: false, temp: 26 },
    // 窗帘
    curtain_master:  { type: "curtain", name: "主卧窗帘",  room: "master",  on: false },
    curtain_living:  { type: "curtain", name: "客厅窗帘",  room: "living",  on: false },
    curtain_br1:     { type: "curtain", name: "次卧1窗帘", room: "br1",     on: false },
    curtain_br2:     { type: "curtain", name: "次卧2窗帘", room: "br2",     on: false },
    curtain_balcony: { type: "curtain", name: "阳台窗帘",  room: "balcony", on: false },
    // 音乐
    music_living:  { type: "music",   name: "客厅音响",  room: "living",  on: false },
    music_kitchen: { type: "music",   name: "厨房音响",  room: "kitchen", on: false },
    // 闹钟
    alarm_master:  { type: "alarm",   name: "主卧闹钟",  room: "master",  on: false }
  };

  // ========== Web Audio ==========
  let audioCtx = null, musicTimer = null, musicStep = 0;
  const happyMelody = [523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880.00, 698.46, 523.25, 659.25, 783.99, 1046.50, 783.99, 659.25, 587.33, 523.25];
  const musicNoteMs = 260;

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function playNote(freq, dur, type, vol) {
    const ctx = ensureAudio(); if (!ctx) return;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur);
  }
  function playMusicTick() {
    const f = happyMelody[musicStep % happyMelody.length];
    playNote(f, musicNoteMs / 1000 * 0.9, "triangle", 0.15);
    if (musicStep % 2 === 0) playNote(f / 2, musicNoteMs / 1000 * 0.9, "sine", 0.08);
    musicStep++;
  }
  function startMusic() {
    if (musicTimer) return;
    ensureAudio();
    playMusicTick();
    musicTimer = setInterval(playMusicTick, musicNoteMs);
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }
  function playAlarmBeep() {
    const ctx = ensureAudio(); if (!ctx) return;
    const pattern = [880, 0, 880, 0, 880, 0, 0, 0];
    let t = 0;
    pattern.forEach(f => {
      if (f > 0) {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = "square"; osc.frequency.value = f;
        gain.gain.setValueAtTime(0, ctx.currentTime + t);
        gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + t + 0.02);
        gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + t + 0.18);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + t); osc.stop(ctx.currentTime + t + 0.2);
      }
      t += 0.22;
    });
    setTimeout(() => {
      let t2 = 0;
      pattern.forEach(f => {
        if (f > 0) {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.type = "square"; osc.frequency.value = f;
          gain.gain.setValueAtTime(0, ctx.currentTime + t2);
          gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + t2 + 0.02);
          gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + t2 + 0.18);
          osc.connect(gain).connect(ctx.destination);
          osc.start(ctx.currentTime + t2); osc.stop(ctx.currentTime + t2 + 0.2);
        }
        t2 += 0.22;
      });
    }, 1800);
  }

  // ========== 渲染 ==========
  const svg = document.getElementById("floorplan");
  const logList = document.getElementById("logList");
  const recognizedText = document.getElementById("recognizedText");

  function log(msg) {
    const li = document.createElement("li");
    const t = new Date().toLocaleTimeString("zh-CN");
    li.textContent = `[${t}] ${msg}`;
    logList.insertBefore(li, logList.firstChild);
    // 最多保留 30 条
    while (logList.children.length > 30) logList.removeChild(logList.lastChild);
  }

  function render() {
    // 所有设备图标
    svg.querySelectorAll(".device-icon").forEach(g => {
      const type = g.dataset.type;
      const room = g.dataset.room;
      const key = `${type}_${room}`;
      const d = devices[key];
      if (!d) return;
      if (d.on) g.classList.add("on"); else g.classList.remove("on");

      // 空调温度文字
      if (type === "ac") {
        const coolEl = g.querySelector(".ac-cool");
        if (coolEl) coolEl.textContent = d.temp + "°";
      }
    });

    // 房间被灯点亮效果：有至少一盏灯开
    const rooms = ["master", "bath1", "br1", "br2", "living", "dining", "kitchen", "bath2", "balcony"];
    rooms.forEach(room => {
      const lightKey = `light_${room}`;
      const roomEl = svg.querySelector(`#room-${room}`);
      if (roomEl) {
        if (devices[lightKey] && devices[lightKey].on) roomEl.classList.add("lit");
        else roomEl.classList.remove("lit");
      }
    });
  }

  function setDevice(key, on, extra) {
    const d = devices[key];
    if (!d) return;
    const stateChanged = d.on !== on || (extra && extra.temp !== undefined);
    if (!stateChanged && !extra) return;

    const oldOn = d.on;
    d.on = on;
    if (d.type === "ac" && extra && extra.temp !== undefined) d.temp = extra.temp;

    // 控制音乐和闹钟的音频
    if (d.type === "music" && on) startMusic();
    if (d.type === "alarm" && on && !oldOn) playAlarmBeep();

    // 如果所有 music 都关了则停音乐
    if (d.type === "music" && !on) {
      const anyMusicOn = Object.values(devices).some(x => x.type === "music" && x.on);
      if (!anyMusicOn) stopMusic();
    }

    log(`${d.name} ${on ? "开启" : "关闭"}${d.type === "ac" && on ? " · " + d.temp + "°C" : ""}`);
    render();
  }

  // 点击设备图标切换
  svg.querySelectorAll(".device-icon").forEach(g => {
    g.addEventListener("click", () => {
      const type = g.dataset.type;
      const room = g.dataset.room;
      const key = `${type}_${room}`;
      const d = devices[key];
      if (!d) return;
      if (d.type === "ac") {
        setDevice(key, !d.on, { temp: d.temp });
      } else {
        setDevice(key, !d.on);
      }
    });
  });

  // ========== 快捷按钮 ==========
  const cmdButtons = document.getElementById("cmdButtons");
  const quickCommands = [
    { text: "我回来了",   scene: true },
    { text: "我要睡觉了", scene: true },
    { text: "全屋开灯",   scene: false },
    { text: "全屋关灯",   scene: false },
    { text: "空调 26 度", scene: false },
    { text: "打开窗帘",   scene: false },
    { text: "关闭窗帘",   scene: false },
    { text: "播放音乐",   scene: false },
    { text: "停音乐",     scene: false },
    { text: "设闹钟",     scene: false }
  ];
  quickCommands.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "cmd-btn" + (c.scene ? " scene" : "");
    btn.textContent = c.text;
    btn.addEventListener("click", () => handleCommand(c.text));
    cmdButtons.appendChild(btn);
  });

  // ========== 场景 / 指令 ==========
  function allLights(on) {
    Object.keys(devices).forEach(k => { if (devices[k].type === "light") setDevice(k, on); });
  }
  function allAC(on, temp) {
    Object.keys(devices).forEach(k => {
      if (devices[k].type === "ac") setDevice(k, on, temp ? { temp } : null);
    });
  }
  function allCurtains(on) {
    Object.keys(devices).forEach(k => { if (devices[k].type === "curtain") setDevice(k, on); });
  }
  function allMusic(on) {
    Object.keys(devices).forEach(k => { if (devices[k].type === "music") setDevice(k, on); });
  }

  function handleCommand(text) {
    const t = text.trim();
    recognizedText.textContent = `"${t}"`;

    if (t.includes("我回来") || t.includes("回家") || t.includes("到家")) {
      log("🚪 场景：我回来了 → 开启全屋");
      allLights(true);
      allAC(true, 26);
      allCurtains(true);
      allMusic(true);
      return;
    }
    if (t.includes("睡觉") || t.includes("晚安") || t.includes("休息")) {
      log("🌙 场景：我要睡觉了 → 关灯拉帘设闹钟");
      allLights(false);
      allCurtains(false);
      allMusic(false);
      setDevice("alarm_master", true);
      return;
    }

    // 空调温度指令
    const matchTemp = t.match(/(\d{2})\s*度/);
    if (matchTemp) {
      const temp = parseInt(matchTemp[1], 10);
      allAC(true, temp);
      return;
    }
    if (t.includes("开空调")) { allAC(true, 26); return; }
    if (t.includes("关空调")) { allAC(false); return; }

    if (t.includes("全屋开") || (t.includes("开灯") && (t.includes("全屋") || t.includes("所有")))) { allLights(true); return; }
    if (t.includes("全屋关") || (t.includes("关灯") && (t.includes("全屋") || t.includes("所有")))) { allLights(false); return; }
    if (t === "开灯") { allLights(true); return; }
    if (t === "关灯") { allLights(false); return; }

    if (t.includes("打开窗帘") || t.includes("拉开窗帘") || (t.includes("开窗帘") && !t.includes("关"))) { allCurtains(true); return; }
    if (t.includes("关窗帘") || t.includes("拉上窗帘")) { allCurtains(false); return; }

    if (t.includes("播放音乐") || t.includes("放音乐") || t.includes("来点音乐")) { allMusic(true); return; }
    if (t.includes("暂停") || t.includes("停音乐") || t.includes("关音乐")) { allMusic(false); return; }

    if (t.includes("闹钟")) { setDevice("alarm_master", true); return; }

    // 单个房间灯（可选，简单支持）
    const roomMap = { "主卧": "master", "客厅": "living", "餐厅": "dining", "厨房": "kitchen", "主卫": "bath1", "次卫": "bath2", "次卧1": "br1", "次卧2": "br2", "阳台": "balcony" };
    for (const word in roomMap) {
      if (t.includes(word)) {
        if (t.includes("灯")) {
          if (t.includes("开") || t.includes("点亮")) setDevice(`light_${roomMap[word]}`, true);
          else if (t.includes("关")) setDevice(`light_${roomMap[word]}`, false);
          return;
        }
      }
    }

    log(`未识别指令：${t}`);
  }

  // ========== 语音识别 ==========
  const micBtn = document.getElementById("micBtn");
  const voiceStatus = document.getElementById("voiceStatus");
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "zh-CN";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onstart = () => {
      micBtn.classList.add("listening");
      voiceStatus.textContent = "正在聆听...请说话";
    };
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      handleCommand(transcript);
    };
    recognition.onerror = (event) => { voiceStatus.textContent = "识别出错：" + event.error; };
    recognition.onend = () => {
      micBtn.classList.remove("listening");
      voiceStatus.textContent = "点击麦克风继续语音控制";
    };
    micBtn.addEventListener("click", () => {
      try { recognition.start(); } catch (e) { voiceStatus.textContent = "请稍候，再点击一次"; }
    });
  } else {
    voiceStatus.innerHTML = "⚠️ 当前浏览器不支持语音识别，请用 Chrome/Edge";
    micBtn.disabled = true;
  }

  // 初始化
  render();
  log("系统已就绪 · 共 9 盏灯 / 5 台空调 / 5 组窗帘 / 2 个音响 / 1 个闹钟");
</script>
</body>
</html>
