<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国武将对战 - 乱世英雄谱</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1818 50%, #1a1a1a 100%);
            color: white;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 48px;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 0;
        }
        .header p {
            color: #ccc;
            margin-top: 5px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 25px;
            font-size: 18px;
            background: rgba(139, 0, 0, 0.5);
            border: 2px solid #FFD700;
            color: #FFD700;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .tab-btn:hover, .tab-btn.active {
            background: #8B0000;
            color: white;
            transform: scale(1.05);
        }
        .content {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
        }
        .content.active {
            display: block;
        }
        .team-area {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .team-box {
            width: 45%;
            min-width: 280px;
            border: 2px solid #FFD700;
            border-radius: 10px;
            padding: 20px;
            background: rgba(139, 0, 0, 0.2);
        }
        .team-box h3 {
            color: #FFD700;
            text-align: center;
            margin-top: 0;
        }
        .team-list {
            min-height: 150px;
            border: 1px dashed #FFD700;
            border-radius: 5px;
            padding: 10px;
        }
        .team-item {
            background: rgba(255, 215, 0, 0.1);
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .action-buttons {
            text-align: center;
            margin-bottom: 30px;
        }
        .action-btn {
            padding: 12px 35px;
            font-size: 16px;
            background: #8B0000;
            border: 2px solid #FFD700;
            color: #FFD700;
            cursor: pointer;
            border-radius: 8px;
            margin: 0 10px;
            transition: all 0.3s;
        }
        .action-btn:hover:not(:disabled) {
            transform: scale(1.05);
            background: #A52A2A;
        }
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }
        .card {
            background: #2d2d2d;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .card:hover {
            border-color: #FFD700;
            transform: translateY(-5px);
        }
        .card.selected {
            border-color: #66ff66;
            background: rgba(102, 255, 102, 0.1);
        }
        .card.selected-enemy {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
        }
        .mode-btn {
            padding: 8px 20px;
            font-size: 14px;
            background: rgba(139, 0, 0, 0.5);
            border: 2px solid #444;
            color: #ccc;
            cursor: pointer;
            border-radius: 5px;
            margin: 0 5px;
            transition: all 0.3s;
        }
        .mode-btn.active {
            border-color: #FFD700;
            color: #FFD700;
            background: rgba(139, 0, 0, 0.8);
        }
        .card-name {
            font-size: 20px;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 10px;
        }
        .card-stats {
            font-size: 12px;
            color: #ccc;
            line-height: 1.5;
        }
        .card-skills {
            font-size: 11px;
            color: #FFD700;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #444;
            line-height: 1.4;
        }
        .battle-area {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .battle-side {
            width: 45%;
            min-width: 300px;
        }
        .battle-card {
            background: #2d2d2d;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        .battle-card.alive {
            border-color: #FFD700;
        }
        .battle-card.dead {
            opacity: 0.5;
            filter: grayscale(100%);
        }
        .battle-card.selected {
            border-color: #00ff00;
            box-shadow: 0 0 15px #00ff00;
        }
        .skill-btn {
            margin-top: 10px;
            padding: 5px 15px;
            background: #8B0000;
            border: 1px solid #FFD700;
            color: #FFD700;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            width: 100%;
        }
        .skill-btn:hover {
            background: #A52A2A;
        }
        .target-btn {
            margin-top: 10px;
            padding: 5px 15px;
            background: rgba(255, 0, 0, 0.6);
            border: 1px solid #ff4444;
            color: #ff4444;
            border-radius: 5px;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        .target-btn:hover {
            background: rgba(255, 0, 0, 0.8);
        }
        .skill-info {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #444;
            font-size: 11px;
        }
        .hp-bar {
            height: 20px;
            background: #444;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff6600, #ffff00);
            transition: width 0.5s ease;
        }
        .log-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid #444;
            border-radius: 5px;
            padding: 15px;
            height: 250px;
            overflow-y: auto;
            font-size: 14px;
        }
        .log-entry {
            margin-bottom: 5px;
            padding: 3px 0;
            border-bottom: 1px solid #333;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #2d2d2d;
            border: 2px solid #FFD700;
            border-radius: 10px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h2 {
            color: #FFD700;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            color: #ccc;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(139, 0, 0, 0.3);
            border: 1px solid #FFD700;
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
        }
        .form-group textarea {
            resize: vertical;
        }
        .victory {
            text-align: center;
            font-size: 36px;
            color: #FFD700;
            animation: glow 1s infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px #FFD700; }
            to { text-shadow: 0 0 30px #FFD700, 0 0 50px #FFD700; }
        }
        .delete-btn {
            background: #8B0000;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
        }
        .delete-btn:hover {
            background: #A52A2A;
        }
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .camp-btn {
            padding: 5px 15px;
            font-size: 13px;
            background: rgba(139, 0, 0, 0.3);
            border: 1px solid #444;
            color: #ccc;
            cursor: pointer;
            border-radius: 5px;
        }
        .camp-btn.active {
            border-color: #FFD700;
            color: #FFD700;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚔️ 乱世英雄谱 ⚔️</h1>
        <p>三国武将AI对战游戏</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('home')">🏠 首页</button>
        <button class="tab-btn" onclick="showTab('battle')">⚔️ 战斗</button>
        <button class="tab-btn" onclick="showTab('collection')">📖 武将图鉴</button>
        <button class="tab-btn" onclick="toggleMusic()">🔊 战场音乐</button>
        <button class="tab-btn" onclick="showCreate()">➕ 创建武将</button>
    </div>

    <div id="home" class="content active">
        <div class="team-area">
            <div class="team-box">
                <h3>🔵 我方队伍</h3>
                <div class="team-list" id="player-team">点击选择武将</div>
            </div>
            <div class="team-box">
                <h3>🔴 敌方队伍</h3>
                <div class="team-list" id="enemy-team">敌方武将</div>
            </div>
        </div>

        <div class="action-buttons">
            <div style="margin-bottom: 15px;">
                <button class="mode-btn active" onclick="setSelectMode('player')">选择我方武将</button>
                <button class="mode-btn" onclick="setSelectMode('enemy')">选择敌方武将</button>
            </div>
            <div style="margin-bottom: 15px;">
                <button class="mode-btn active" onclick="setBattleMode('1v1')">⚔️ 1v1 单挑</button>
                <button class="mode-btn" onclick="setBattleMode('3v3')">🛡️ 3v3 团战</button>
            </div>
            <button class="action-btn" onclick="randomTeam()">🎲 随机选将</button>
            <button class="action-btn" onclick="clearTeam()">🗑️ 清空队伍</button>
            <button class="action-btn" onclick="startBattle()" id="start-btn" disabled>🚀 开始对战</button>
        </div>

        <div class="card-grid" id="card-grid"></div>
    </div>

    <div id="battle" class="content">
        <div class="battle-area">
            <div class="battle-side">
                <h3 style="color: #66ff66;">🔵 我方队伍</h3>
                <div id="player-cards"></div>
            </div>
            <div class="battle-side">
                <h3 style="color: #ff6666;">🔴 敌方队伍</h3>
                <div id="enemy-cards"></div>
            </div>
        </div>
        <div style="text-align:center;margin-bottom:20px;">
            <div id="turn-info" style="font-size:20px;color:#FFD700;margin-bottom:10px;">我方回合 - 选择武将发动战法</div>
            <button id="cancel-btn" class="action-btn" onclick="cancelSelection()" style="display:none;">取消选择</button>
        </div>
        <div class="log-box" id="battle-log">
            <div class="log-entry">战斗开始！</div>
        </div>
        <div id="victory" style="display:none;">
            <div class="victory" id="victory-text"></div>
            <div class="action-buttons">
                <button class="action-btn" onclick="goHome()">返回首页</button>
            </div>
        </div>
    </div>

    <div id="collection" class="content">
        <div class="filter-bar">
            <button class="camp-btn active" onclick="filterGenerals('all')">全部</button>
            <button class="camp-btn" onclick="filterGenerals('魏')">🇷🇺 魏国</button>
            <button class="camp-btn" onclick="filterGenerals('蜀')">🇩🇪 蜀国</button>
            <button class="camp-btn" onclick="filterGenerals('吴')">🇯🇵 吴国</button>
            <button class="camp-btn" onclick="filterGenerals('独')">⚪ 群雄</button>
        </div>
        <div class="card-grid" id="collection-grid"></div>
    </div>

    <div class="modal" id="create-modal">
        <div class="modal-content">
            <h2>创建自定义武将</h2>
            <div class="form-group">
                <label>武将名称</label>
                <input type="text" id="c-name" placeholder="请输入武将名称">
            </div>
            <div class="form-group">
                <label>阵营</label>
                <select id="c-camp">
                    <option value="蜀">蜀</option>
                    <option value="魏">魏</option>
                    <option value="吴">吴</option>
                    <option value="独">独</option>
                </select>
            </div>
            <div class="form-group">
                <label>属性 (生命值,攻击,防御,速度)</label>
                <input type="text" id="c-stats" placeholder="300,100,80,70">
            </div>
            <div class="form-group">
                <label>主动战法名称</label>
                <input type="text" id="c-active-name" placeholder="例：破军斩">
            </div>
            <div class="form-group">
                <label>主动战法描述</label>
                <textarea id="c-active-desc" placeholder="例：对敌方单体造成200%物理伤害" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>被动战法名称</label>
                <input type="text" id="c-passive-name" placeholder="例：战神之怒">
            </div>
            <div class="form-group">
                <label>被动战法描述</label>
                <textarea id="c-passive-desc" placeholder="例：受到伤害时回复50%生命值" rows="3"></textarea>
            </div>
            <div class="action-buttons">
                <button class="action-btn" onclick="createGeneral()">创建</button>
                <button class="action-btn" onclick="hideCreate()">取消</button>
            </div>
        </div>
    </div>

    <script>
        const generals = {
            "曹操": { name: "曹操", camp: "魏", hp: 300, attack: 95, defense: 85, speed: 78, activeSkill: { name: "短歌行", desc: "对敌方单体造成200%物理伤害，并为自己附加等同于该伤害50%的护盾" }, passiveSkill: { name: "奸雄", desc: "受到伤害时回复50%生命值，并对攻击者造成30%直接反击" } },
            "司马懿": { name: "司马懿", camp: "魏", hp: 324, attack: 73, defense: 88, speed: 68, activeSkill: { name: "鹰视狼顾", desc: "对敌方单体造成200%法术伤害，并强行吸取目标50%的基础防御力" }, passiveSkill: { name: "隐忍反馈", desc: "受到伤害时将30%转化为永久攻击力，并有50%概率使攻击者虚弱" } },
            "刘备": { name: "刘备", camp: "蜀", hp: 300, attack: 78, defense: 70, speed: 62, activeSkill: { name: "桃园结义", desc: "治疗我方单体目标200%生命值，并使其受到的所有伤害降低50%，持续2回合" }, passiveSkill: { name: "唯贤德聚", desc: "队友受攻击时替其分担50%伤害，并对攻击者造成30%圣光反击" } },
            "关羽": { name: "关羽", camp: "蜀", hp: 320, attack: 105, defense: 80, speed: 70, activeSkill: { name: "单刀赴会", desc: "对敌方单体造成200%物理伤害，此攻击强行忽视目标50%的防御力" }, passiveSkill: { name: "武圣威严", desc: "受击时下一次主动战法暴击率提升50%，并对攻击者造成30%无视阻挡反击" } },
            "张飞": { name: "张飞", camp: "蜀", hp: 350, attack: 100, defense: 75, speed: 65, activeSkill: { name: "喝退雄兵", desc: "对敌方单体造成200%物理伤害，并强行嘲讽目标，被嘲讽目标输出降低50%" }, passiveSkill: { name: "当阳长吼", desc: "受到伤害时50%转化为狂怒值，且每次受击对敌方随机单体造成30%声波震慑反击" } },
            "赵云": { name: "赵云", camp: "蜀", hp: 280, attack: 90, defense: 70, speed: 95, activeSkill: { name: "惊雷七突", desc: "造成200%物理伤害，施法期间自身获得50%绝对闪避率" }, passiveSkill: { name: "一身是胆", desc: "自身拥有50%常驻闪避率，闪避或受击时造成30%看破反击伤害" } },
            "黄忠": { name: "黄忠", camp: "蜀", hp: 270, attack: 110, defense: 65, speed: 60, activeSkill: { name: "定点狙击", desc: "精准狙击敌方后排单体，造成200%物理伤害，且额外附带50%爆伤加成" }, passiveSkill: { name: "老当益壮", desc: "受到后排攻击时伤害降低50%，并立即回敬一箭造成30%穿心反击" } },
            "诸葛亮": { name: "诸葛亮", camp: "蜀", hp: 260, attack: 85, defense: 75, speed: 72, activeSkill: { name: "火烧新野", desc: "造成200%法术伤害，并有50%几率使目标陷入混乱状态" }, passiveSkill: { name: "神算八阵", desc: "受主动战法攻击时有50%几率无效化，并将30%伤害以雷击形式反弹敌方全体" } },
            "孙权": { name: "孙权", camp: "吴", hp: 306, attack: 66, defense: 85, speed: 74, activeSkill: { name: "制衡天下", desc: "造成200%物理伤害并净化自身，每净化一个负面效果暴击率提升50%" }, passiveSkill: { name: "坐断江东", desc: "受到伤害时有50%概率转化为等额护盾，并对敌方血量最低单位造成30%精准反击" } },
            "周瑜": { name: "周瑜", camp: "吴", hp: 275, attack: 88, defense: 70, speed: 80, activeSkill: { name: "火烧赤壁", desc: "对敌方单体造成200%法术伤害，并使其受治疗效果降低50%" }, passiveSkill: { name: "谈笑樯橹", desc: "受到伤害时负面抗性提升50%，并引燃攻击者使其下回合受到30%烈火反噬" } },
            "吕布": { name: "吕布", camp: "独", hp: 340, attack: 120, defense: 70, speed: 85, activeSkill: { name: "戮神戟法", desc: "造成200%物理伤害并进入霸体状态，自身吸血率提升50%，持续1回合" }, passiveSkill: { name: "人中吕布", desc: "自身拥有50%常驻全伤害减免，受击时对攻击者及其相邻单位造成30%大范围横扫反击" } },
            "貂蝉": { name: "貂蝉", camp: "独", hp: 250, attack: 75, defense: 65, speed: 88, activeSkill: { name: "闭月羞花", desc: "造成200%法术伤害，并使目标在接下来1回合内速度降低50%" }, passiveSkill: { name: "美人离间", desc: "受控制时有50%几率免疫，且每次受击后魅惑攻击者对其队友造成30%内讧伤害" } }
        };

        let playerTeam = [];
        let enemyTeam = [];
        let battleRunning = false;
        let selectMode = 'player';
        let battleMode = '1v1';
        let selectedAttacker = null;
        let isPlayerTurn = true;
        let currentCampFilter = 'all';

        function showTab(tab) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            if (event) event.target.classList.add('active');
            if (tab === 'collection') renderCollection();
        }

        function renderCards() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            Object.values(generals).forEach(g => {
                const card = document.createElement('div');
                let className = 'card';
                if (playerTeam.find(p => p.name === g.name)) className += ' selected';
                else if (enemyTeam.find(e => e.name === g.name)) className += ' selected-enemy';
                card.className = className;
                card.innerHTML = `<div class="card-name">${g.name}</div><div class="card-stats">${g.camp} | 生命值:${g.hp} 攻击:${g.attack} 防御:${g.defense}</div><div class="card-skills">⚔️ ${g.activeSkill.name} | 🛡️ ${g.passiveSkill.name}</div>`;
                card.onclick = () => selectGeneral(g);
                grid.appendChild(card);
            });
        }

        function selectGeneral(g) {
            const maxCount = battleMode === '1v1' ? 1 : 3;
            if (selectMode === 'player') {
                const idx = playerTeam.findIndex(p => p.name === g.name);
                if (idx > -1) {
                    playerTeam.splice(idx, 1);
                } else if (playerTeam.length < maxCount && !enemyTeam.find(e => e.name === g.name)) {
                    playerTeam.push({ ...g, currentHp: g.hp });
                }
            } else {
                const idx = enemyTeam.findIndex(e => e.name === g.name);
                if (idx > -1) {
                    enemyTeam.splice(idx, 1);
                } else if (enemyTeam.length < maxCount && !playerTeam.find(p => p.name === g.name)) {
                    enemyTeam.push({ ...g, currentHp: g.hp });
                }
            }
            updateTeams();
            renderCards();
        }

        function setSelectMode(mode) {
            selectMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            if (event) event.target.classList.add('active');
        }

        function setBattleMode(mode) {
            battleMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            if (event) event.target.classList.add('active');
            clearTeam();
        }

        function updateTeams() {
            const pt = document.getElementById('player-team');
            const et = document.getElementById('enemy-team');
            pt.innerHTML = playerTeam.map(p => `<div class="team-item">${p.name}</div>`).join('') || '点击选择武将';
            et.innerHTML = enemyTeam.map(e => `<div class="team-item">${e.name}</div>`).join('') || '敌方武将';
            const requiredCount = battleMode === '1v1' ? 1 : 3;
            document.getElementById('start-btn').disabled = playerTeam.length !== requiredCount || enemyTeam.length !== requiredCount;
        }

        function randomTeam() {
            const all = Object.values(generals);
            const shuffled = all.sort(() => Math.random() - 0.5);
            const count = battleMode === '1v1' ? 1 : 3;
            playerTeam = shuffled.slice(0, count).map(g => ({ ...g, currentHp: g.hp }));
            enemyTeam = shuffled.slice(count, count * 2).map(g => ({ ...g, currentHp: g.hp }));
            updateTeams();
            renderCards();
        }

        function clearTeam() {
            playerTeam = [];
            enemyTeam = [];
            selectMode = 'player';
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            const modeBtns = document.querySelectorAll('.mode-btn');
            if (modeBtns.length > 0) modeBtns[0].classList.add('active');
            updateTeams();
            renderCards();
        }

        function startBattle() {
            battleRunning = true;
            isPlayerTurn = true;
            selectedAttacker = null;
            showTab('battle');
            renderBattleCards();
            addLog('⚔️ 战斗开始！');
            updateTurnInfo();
        }

        function updateTurnInfo() {
            const info = document.getElementById('turn-info');
            const cancelBtn = document.getElementById('cancel-btn');
            if (isPlayerTurn) {
                if (selectedAttacker !== null) {
                    info.textContent = `已选择 ${playerTeam[selectedAttacker].name} - 请选择敌方目标`;
                    cancelBtn.style.display = 'inline-block';
                } else {
                    info.textContent = '🔵 我方回合 - 选择武将发动战法';
                    cancelBtn.style.display = 'none';
                }
            } else {
                info.textContent = '🔴 敌方回合 - 敌方行动中...';
                cancelBtn.style.display = 'none';
            }
        }

        function renderBattleCards() {
            document.getElementById('player-cards').innerHTML = playerTeam.map((g, i) => {
                const isSelected = selectedAttacker === i;
                const hpPercent = (g.currentHp / g.hp) * 100;
                return `
                <div class="battle-card ${g.currentHp > 0 ? 'alive' : 'dead'} ${isSelected ? 'selected' : ''}" onclick="selectAttacker(${i})">
                    <div class="hp-bar"><div class="hp-fill" style="width:${hpPercent}%"></div></div>
                    <div style="font-weight:bold;font-size:18px;">${g.name}</div>
                    <div style="font-size:12px;color:#ccc;">生命值:${g.currentHp}/${g.hp} | 攻击:${g.attack}</div>
                    <div class="skill-info">
                        <div style="font-size:11px;color:#FFD700;margin-top:5px;">⚔️ ${g.activeSkill.name}</div>
                        <div style="font-size:10px;color:#888;margin-top:2px;">${g.activeSkill.desc}</div>
                    </div>
                    ${g.currentHp > 0 && isPlayerTurn && !selectedAttacker ? `<button class="skill-btn" onclick="event.stopPropagation();selectAttacker(${i})">发动 ${g.activeSkill.name}</button>` : ''}
                </div>
            `}).join('');

            document.getElementById('enemy-cards').innerHTML = enemyTeam.map((g, i) => {
                const hpPercent = (g.currentHp / g.hp) * 100;
                return `
                <div class="battle-card ${g.currentHp > 0 ? 'alive' : 'dead'}" onclick="selectTarget(${i})">
                    <div class="hp-bar"><div class="hp-fill" style="width:${hpPercent}%"></div></div>
                    <div style="font-weight:bold;font-size:18px;">${g.name}</div>
                    <div style="font-size:12px;color:#ccc;">生命值:${g.currentHp}/${g.hp} | 防御:${g.defense}</div>
                    <div class="skill-info">
                        <div style="font-size:11px;color:#ff4444;margin-top:5px;">⚔️ ${g.activeSkill.name}</div>
                        <div style="font-size:10px;color:#888;margin-top:2px;">${g.activeSkill.desc}</div>
                    </div>
                    ${g.currentHp > 0 && selectedAttacker !== null && isPlayerTurn ? `<div class="target-btn">点击选择目标</div>` : ''}
                </div>
            `}).join('');
        }

        function selectAttacker(idx) {
            if (!isPlayerTurn || playerTeam[idx].currentHp <= 0) return;
            selectedAttacker = idx;
            updateTurnInfo();
            renderBattleCards();
        }

        function selectTarget(idx) {
            if (!isPlayerTurn || selectedAttacker === null || enemyTeam[idx].currentHp <= 0) return;
            const attacker = playerTeam[selectedAttacker];
            const target = enemyTeam[idx];
            executeSkill(attacker, target);
            selectedAttacker = null;
            isPlayerTurn = false;
            updateTurnInfo();
            checkWin();
            setTimeout(enemyTurn, 1500);
        }

        function cancelSelection() {
            selectedAttacker = null;
            updateTurnInfo();
            renderBattleCards();
        }

        function executeSkill(attacker, target) {
            const skillName = attacker.activeSkill.name;
            const isPlayer = playerTeam.includes(attacker);
            const myTeam = isPlayer ? playerTeam : enemyTeam;
            const enemyTeamRef = isPlayer ? enemyTeam : playerTeam;
            
            let defenseMultiplier = 0.4;
            let damageMultiplier = 2;
            
            if (attacker.name === '关羽') defenseMultiplier = 0.2;
            
            const baseDamage = attacker.attack - Math.floor(target.defense * defenseMultiplier);
            let damage = Math.max(1, Math.floor(baseDamage * damageMultiplier));
            
            if (attacker.name === '吕布') {
                const heal = Math.floor(damage * 0.5);
                attacker.currentHp = Math.min(attacker.hp, attacker.currentHp + heal);
            }
            
            if (attacker.name === '刘备') {
                const aliveTeammates = myTeam.filter(p => p.currentHp > 0 && p.name !== attacker.name);
                if (aliveTeammates.length > 0) {
                    const lowestHp = aliveTeammates.reduce((min, p) => p.currentHp < min.currentHp ? p : min);
                    const heal = Math.floor(damage * 2);
                    lowestHp.currentHp = Math.min(lowestHp.hp, lowestHp.currentHp + heal);
                    addLog(`${attacker.name}发动【${skillName}】，为${lowestHp.name}回复${heal}点生命！`);
                    renderBattleCards();
                    return;
                }
            }
            
            target.currentHp = Math.max(0, target.currentHp - damage);
            
            let logMsg = `${attacker.name}发动【${skillName}】，对${target.name}造成${damage}点伤害！`;
            
            if (attacker.name === '曹操') {
                const shield = Math.floor(damage * 0.5);
                logMsg += ` 获得${shield}点护盾！`;
            }
            
            if (attacker.name === '司马懿') {
                const stealDef = Math.floor(target.defense * 0.5);
                attacker.defense += stealDef;
                target.defense = Math.floor(target.defense * 0.5);
                logMsg += ` 吸取${stealDef}点防御力！`;
            }
            
            if (attacker.name === '关羽') {
                logMsg += ` 无视50%防御！`;
            }
            
            if (attacker.name === '张飞') {
                logMsg += ` 嘲讽${target.name}，输出降低50%！`;
            }
            
            if (attacker.name === '赵云') {
                attacker.dodgeRate = (attacker.dodgeRate || 0) + 0.5;
                logMsg += ` 获得50%绝对闪避率！`;
            }
            
            if (attacker.name === '黄忠') {
                const extraDamage = Math.floor(damage * 0.5);
                target.currentHp = Math.max(0, target.currentHp - extraDamage);
                logMsg += ` 附加${extraDamage}点爆伤！`;
            }
            
            if (attacker.name === '诸葛亮') {
                if (Math.random() < 0.5) {
                    logMsg += ` ${target.name}陷入混乱！`;
                }
            }
            
            if (attacker.name === '周瑜') {
                logMsg += ` ${target.name}受治疗效果降低50%！`;
            }
            
            if (attacker.name === '貂蝉') {
                target.speed = Math.floor(target.speed * 0.5);
                logMsg += ` ${target.name}速度降低50%！`;
            }
            
            addLog(logMsg);
            renderBattleCards();
            
            triggerPassiveSkill(target, attacker, isPlayer, damage);
        }

        function triggerPassiveSkill(victim, attacker, isPlayerVictim, originalDamage) {
            if (victim.currentHp <= 0) return;
            
            const myTeam = isPlayerVictim ? playerTeam : enemyTeam;
            const enemyTeamRef = isPlayerVictim ? enemyTeam : playerTeam;
            const skillName = victim.passiveSkill.name;
            const counterDamage = Math.floor(originalDamage * 0.3);
            
            let logMsg = '';
            
            if (victim.name === '曹操') {
                const heal = Math.floor(originalDamage * 0.5);
                victim.currentHp = Math.min(victim.hp, victim.currentHp + heal);
                attacker.currentHp = Math.max(0, attacker.currentHp - counterDamage);
                logMsg = `${victim.name}触发【${skillName}】，回复${heal}点生命，反击${counterDamage}点伤害！`;
            }
            
            if (victim.name === '司马懿') {
                victim.attack += Math.floor(originalDamage * 0.3);
                attacker.currentHp = Math.max(0, attacker.currentHp - counterDamage);
                if (Math.random() < 0.5) {
                    logMsg = `${victim.name}触发【${skillName}】，攻击力+${Math.floor(originalDamage * 0.3)}，${attacker.name}陷入虚弱！`;
                } else {
                    logMsg = `${victim.name}触发【${skillName}】，攻击力+${Math.floor(originalDamage * 0.3)}！`;
                }
            }
            
            if (victim.name === '关羽') {
                attacker.currentHp = Math.max(0, attacker.currentHp - counterDamage);
                logMsg = `${victim.name}触发【${skillName}】，无视阻挡反击${counterDamage}点伤害！`;
            }
            
            if (victim.name === '张飞') {
                attacker.currentHp = Math.max(0, attacker.currentHp - counterDamage);
                logMsg = `${victim.name}触发【${skillName}】，声波震慑反击${counterDamage}点伤害！`;
            }
            
            if (victim.name === '赵云') {
                if (Math.random() < 0.5) {
                    logMsg = `${victim.name}触发【${skillName}】，成功闪避！`;
                    victim.currentHp = Math.min(victim.hp, victim.currentHp + originalDamage);
                } else {
                    attacker.currentHp = Math.max(0, attacker.currentHp - counterDamage);
                    logMsg = `${victim.name}触发【${skillName}】，看破反击${counterDamage}点伤害！`;
                }
            }
            
            if (victim.name === '黄忠') {
                attacker.currentHp = Math.max(0, attacker.currentHp - counterDamage);
                logMsg = `${victim.name}触发【${skillName}】，穿心反击${counterDamage}点伤害！`;
            }
            
            if (victim.name === '诸葛亮') {
                if (Math.random() < 0.5) {
                    victim.currentHp = Math.min(victim.hp, victim.currentHp + originalDamage);
                    logMsg = `${victim.name}触发【${skillName}】，技能无效化！`;
                } else {
                    const splashDamage = Math.floor(counterDamage / enemyTeamRef.length);
                    enemyTeamRef.forEach(e => {
                        if (e.currentHp > 0) {
                            e.currentHp = Math.max(0, e.currentHp - splashDamage);
                        }
                    });
                    logMsg = `${victim.name}触发【${skillName}】，雷击反弹敌方全体，每人${splashDamage}点伤害！`;
                }
            }
            
            if (victim.name === '孙权') {
                if (Math.random() < 0.5) {
                    logMsg = `${victim.name}触发【${skillName}】，伤害转化为护盾！`;
                } else {
                    const lowestHp = enemyTeamRef.reduce((min, e) => e.currentHp < min.currentHp ? e : min);
                    lowestHp.currentHp = Math.max(0, lowestHp.currentHp - counterDamage);
                    logMsg = `${victim.name}触发【${skillName}】，精准反击${lowestHp.name}${counterDamage}点伤害！`;
                }
            }
            
            if (victim.name === '周瑜') {
                attacker.currentHp = Math.max(0, attacker.currentHp - counterDamage);
                logMsg = `${victim.name}触发【${skillName}】，烈火反噬${attacker.name}${counterDamage}点伤害！`;
            }
            
            if (victim.name === '吕布') {
                attacker.currentHp = Math.max(0, attacker.currentHp - counterDamage);
                logMsg = `${victim.name}触发【${skillName}】，横扫反击${counterDamage}点伤害！`;
            }
            
            if (victim.name === '貂蝉') {
                const teammates = myTeam.filter(t => t.name !== victim.name && t.currentHp > 0);
                if (teammates.length > 0) {
                    const randomTeammate = teammates[Math.floor(Math.random() * teammates.length)];
                    randomTeammate.currentHp = Math.max(0, randomTeammate.currentHp - counterDamage);
                    logMsg = `${victim.name}触发【${skillName}】，魅惑${attacker.name}攻击队友${randomTeammate.name}，造成${counterDamage}点伤害！`;
                }
            }
            
            if (logMsg) {
                addLog(logMsg);
                renderBattleCards();
                checkWin();
            }
        }

        function enemyTurn() {
            if (!battleRunning) return;
            const attackers = enemyTeam.filter(e => e.currentHp > 0);
            const targets = playerTeam.filter(p => p.currentHp > 0);
            if (attackers.length === 0 || targets.length === 0) return;
            
            const attacker = attackers[Math.floor(Math.random() * attackers.length)];
            const target = targets[Math.floor(Math.random() * targets.length)];
            
            executeSkill(attacker, target);
            checkWin();
            
            isPlayerTurn = true;
            selectedAttacker = null;
            updateTurnInfo();
        }

        function checkWin() {
            const pAlive = playerTeam.filter(p => p.currentHp > 0).length;
            const eAlive = enemyTeam.filter(e => e.currentHp > 0).length;
            if (pAlive === 0) {
                battleRunning = false;
                document.getElementById('victory-text').textContent = '💀 敌方胜利！';
                document.getElementById('victory').style.display = 'block';
            } else if (eAlive === 0) {
                battleRunning = false;
                document.getElementById('victory-text').textContent = '🎉 我方胜利！';
                document.getElementById('victory').style.display = 'block';
            }
        }

        function addLog(msg) {
            const log = document.getElementById('battle-log');
            log.innerHTML += `<div class="log-entry">${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        function goHome() {
            document.getElementById('victory').style.display = 'none';
            showTab('home');
        }

        function filterGenerals(camp) {
            currentCampFilter = camp;
            document.querySelectorAll('.camp-btn').forEach(b => b.classList.remove('active'));
            if (event) event.target.classList.add('active');
            renderCollection();
        }

        function renderCollection() {
            const grid = document.getElementById('collection-grid');
            grid.innerHTML = '';
            Object.values(generals).forEach(g => {
                if (currentCampFilter !== 'all' && g.camp !== currentCampFilter) return;
                const card = document.createElement('div');
                card.className = 'card';
                const isCustom = g.isCustom || false;
                card.innerHTML = `<div class="card-name">${g.name}</div><div class="card-stats">${g.camp} | 生命值:${g.hp} 攻击:${g.attack} 防御:${g.defense} 速度:${g.speed}</div><div style="font-size:12px;color:#FFD700;margin-top:10px;">⚔️ ${g.activeSkill.name}: ${g.activeSkill.desc}</div><div style="font-size:12px;color:#66ff66;margin-top:5px;">🛡️ ${g.passiveSkill.name}: ${g.passiveSkill.desc}</div>`;
                if (isCustom) {
                    const delBtn = document.createElement('button');
                    delBtn.textContent = '🗑️ 删除';
                    delBtn.className = 'delete-btn';
                    delBtn.onclick = () => deleteGeneral(g.name);
                    card.appendChild(delBtn);
                }
                grid.appendChild(card);
            });
        }

        function deleteGeneral(name) {
            if (confirm(`确定删除武将「${name}」吗？`)) {
                delete generals[name];
                playerTeam = playerTeam.filter(p => p.name !== name);
                enemyTeam = enemyTeam.filter(e => e.name !== name);
                updateTeams();
                renderCards();
                renderCollection();
            }
        }

        function showCreate() {
            document.getElementById('create-modal').classList.add('active');
        }

        function hideCreate() {
            document.getElementById('create-modal').classList.remove('active');
        }

        function createGeneral() {
            const name = document.getElementById('c-name').value.trim();
            const camp = document.getElementById('c-camp').value;
            const statsStr = document.getElementById('c-stats').value.trim();
            const stats = statsStr.split(/[,，]/).map(s => parseInt(s.trim())).filter(n => !isNaN(n));
            const activeName = document.getElementById('c-active-name').value.trim() || '自定义技能';
            const activeDesc = document.getElementById('c-active-desc').value.trim() || '对敌方单体造成200%伤害';
            const passiveName = document.getElementById('c-passive-name').value.trim() || '被动技能';
            const passiveDesc = document.getElementById('c-passive-desc').value.trim() || '受到伤害时回复50%生命值';
            
            if (!name) {
                alert('请填写武将名称');
                return;
            }
            
            if (stats.length !== 4) {
                alert('属性格式不正确！请输入4个数字，用逗号或中文逗号分隔，例如：300,100,80,70');
                return;
            }
            
            generals[name] = { name, camp, hp: stats[0], attack: stats[1], defense: stats[2], speed: stats[3], activeSkill: { name: activeName, desc: activeDesc }, passiveSkill: { name: passiveName, desc: passiveDesc }, isCustom: true };
            hideCreate();
            renderCards();
        }

        let audioCtx = null;
        let isPlaying = false;
        let intervals = [];

        function toggleMusic() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                if (isPlaying) {
                    isPlaying = false;
                    if (event) event.target.textContent = '🔊 战场音乐';
                    intervals.forEach(clearInterval);
                    intervals = [];
                } else {
                    isPlaying = true;
                    if (event) event.target.textContent = '🔇 停止音乐';
                    playEpicMusic();
                }
            } catch (e) {
                console.error('音频播放失败:', e);
                alert('音频播放失败，请检查浏览器设置');
            }
        }

        function playEpicMusic() {
            if (!isPlaying || !audioCtx) return;

            const C3 = 130.81, D3 = 146.83, E3 = 164.81, F3 = 174.61, G3 = 196.00, A3 = 220.00, B3 = 246.94;
            const C4 = 261.63, D4 = 293.66, E4 = 329.63, F4 = 349.23, G4 = 392.00, A4 = 440.00, B4 = 493.88;
            const C5 = 523.25, D5 = 587.33, E5 = 659.25, F5 = 698.46, G5 = 783.99, A5 = 880.00;

            const melody = [
                G5, E5, G5, A5, G5, E5, C5, D5,
                E5, G5, E5, C5, D5, C5, G4, A4,
                G5, E5, G5, A5, G5, E5, C5, D5,
                E5, G5, E5, C5, D5, C5, G4, C5
            ];

            const chords = [
                [C3, E3, G3], [F3, A3, C4], [G3, B3, D4], [C4, E4, G4],
                [C3, E3, G3], [F3, A3, C4], [G3, B3, D4], [C3, E3, G3]
            ];

            const bassLine = [C3, F3, G3, C4, C3, F3, G3, C3, C3, F3, G3, C4, C3, F3, G3, C3];

            let beat = 0;
            let melodyIdx = 0;
            let chordIdx = 0;
            let bassIdx = 0;

            const playDrum = (type) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const now = audioCtx.currentTime;

                if (type === 'kick') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(80, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                } else if (type === 'snare') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                } else if (type === 'hihat') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                }

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            };

            const playWarDrum = () => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const now = audioCtx.currentTime;

                osc.type = 'sine';
                osc.frequency.setValueAtTime(50, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);

                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            };

            const playNote = (freq, type = 'sine', vol = 0.15, duration = 0.25) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const now = audioCtx.currentTime;

                osc.type = type;
                osc.frequency.value = freq;

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(vol, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + duration);
            };

            const playChord = (notes) => {
                notes.forEach((note, i) => {
                    playNote(note, 'triangle', 0.08 - i * 0.02, 0.5);
                });
            };

            const playBass = (freq) => {
                playNote(freq, 'sawtooth', 0.15, 0.5);
            };

            const playHorn = (freq) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const now = audioCtx.currentTime;

                osc.type = 'sawtooth';
                osc.frequency.value = freq;

                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.15, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 1);
            };

            const loop = setInterval(() => {
                if (!isPlaying) {
                    clearInterval(loop);
                    return;
                }

                if (beat % 8 === 0) playWarDrum();
                if (beat % 4 === 0) playDrum('kick');
                if (beat % 4 === 2) {
                    playDrum('kick');
                    playDrum('snare');
                }
                playDrum('hihat');

                if (beat % 2 === 0) {
                    playChord(chords[chordIdx % chords.length]);
                    chordIdx++;
                }

                if (beat % 2 === 0) {
                    playBass(bassLine[bassIdx % bassLine.length]);
                    bassIdx++;
                }

                if (beat % 1 === 0) {
                    playNote(melody[melodyIdx % melody.length], 'sawtooth', 0.12, 0.25);
                    melodyIdx++;
                }

                if (beat % 8 === 0) {
                    playHorn(melody[melodyIdx % melody.length]);
                }

                beat++;
            }, 250);

            intervals.push(loop);
        }

        renderCards();
    </script>
</body>
</html>
