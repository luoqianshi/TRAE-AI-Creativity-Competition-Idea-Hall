<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>剪韵 - 非遗剪纸互动体验</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #FDF8F3 0%, #F5EDE4 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #2C1810;
        }
        
        /* ===== 首页 ===== */
        .landing-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }
        
        .logo {
            width: 120px; height: 120px;
            margin-bottom: 2rem;
            position: relative;
        }
        
        .logo-paper {
            width: 100%; height: 100%;
            background: #C41E3A;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(196, 30, 58, 0.3);
        }
        
        .logo-pattern {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; height: 80%;
            border: 3px solid #FDF8F3;
            border-radius: 50%;
        }
        
        .logo-pattern::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50%; height: 50%;
            border: 2px solid #FDF8F3;
            border-radius: 50%;
        }
        
        .logo-pattern::after {
            content: '';
            position: absolute;
            top: 20%; left: 50%;
            transform: translateX(-50%);
            width: 2px; height: 60%;
            background: #FDF8F3;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #C41E3A;
            margin-bottom: 0.5rem;
            letter-spacing: 0.1em;
        }
        
        .subtitle {
            font-size: 1rem;
            color: #8B7355;
            margin-bottom: 2rem;
        }
        
        .how-to-play {
            background: white;
            border-radius: 16px;
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            max-width: 400px;
            text-align: left;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        
        .how-to-play h3 {
            color: #C41E3A;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            text-align: center;
        }
        
        .how-to-play ol {
            padding-left: 1.2rem;
            color: #8B7355;
            line-height: 2;
        }
        
        .how-to-play li {
            margin-bottom: 0.3rem;
        }
        
        .start-btn {
            background: linear-gradient(135deg, #C41E3A 0%, #A01830 100%);
            color: white;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(196, 30, 58, 0.4);
            transition: all 0.3s ease;
        }
        
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(196, 30, 58, 0.5);
        }
        
        /* ===== 游戏页面 ===== */
        .game-page {
            display: none;
            min-height: 100vh;
        }
        
        .game-header {
            background: linear-gradient(135deg, #C41E3A 0%, #A01830 100%);
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .game-title { font-size: 1.2rem; font-weight: 600; }
        
        .game-actions { display: flex; gap: 0.5rem; }
        
        .icon-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .icon-btn:hover { background: rgba(255,255,255,0.2); }
        
        .game-body {
            padding: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* 步骤引导 */
        .step-guide {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        
        .step-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            background: #F5EDE4;
            color: #8B7355;
        }
        
        .step-item.active {
            background: #C41E3A;
            color: white;
        }
        
        .step-num {
            width: 20px; height: 20px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
        }
        
        /* 提示信息 */
        .hint-box {
            background: #FFF8E7;
            border: 1px solid #F0D78C;
            border-radius: 12px;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 0.9rem;
            color: #8B7355;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        /* 画布区域 */
        .canvas-area {
            background: white;
            border-radius: 16px;
            padding: 1rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 1rem;
        }
        
        .canvas-label {
            text-align: center;
            font-size: 0.85rem;
            color: #8B7355;
            margin-bottom: 0.5rem;
        }
        
        .canvas-label .fold-tag {
            display: inline-block;
            background: #C41E3A;
            color: white;
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }
        
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            aspect-ratio: 1;
            background: #F5EDE4;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #D4C4B0;
        }
        
        #paperCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }
        
        /* 工具栏 */
        .toolbar {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        
        .tool-btn {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 2px solid #D4C4B0;
            background: white;
            color: #2C1810;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        
        .tool-btn:hover { border-color: #C41E3A; color: #C41E3A; }
        .tool-btn.active { background: #C41E3A; color: white; border-color: #C41E3A; }
        
        /* 控制按钮 */
        .control-bar {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .control-btn {
            padding: 0.8rem 2rem;
            border-radius: 25px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #C41E3A 0%, #A01830 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(196, 30, 58, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(196, 30, 58, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: #8B7355;
            border: 2px solid #D4C4B0;
        }
        
        .btn-secondary:hover { border-color: #C41E3A; color: #C41E3A; }
        
        /* 结果页面 */
        .result-page {
            display: none;
            text-align: center;
            padding: 2rem 1rem;
        }
        
        .result-title {
            font-size: 1.5rem;
            color: #C41E3A;
            margin-bottom: 0.5rem;
        }
        
        .result-desc {
            color: #8B7355;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        
        .result-canvas {
            max-width: 500px;
            margin: 0 auto 1.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            background: #F5EDE4;
            padding: 1rem;
        }
        
        #resultCanvas {
            width: 100%;
            display: block;
            border-radius: 8px;
        }
        
        .result-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in { animation: fadeIn 0.5s ease forwards; }
        
        /* 响应式 */
        @media (max-width: 600px) {
            .title { font-size: 2rem; }
            .how-to-play { padding: 1rem; margin: 0 1rem 1.5rem; }
            .game-body { padding: 0.8rem; }
            .control-btn { padding: 0.7rem 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- 首页 -->
    <div class="landing-page" id="landingPage">
        <div class="logo">
            <div class="logo-paper">
                <div class="logo-pattern"></div>
            </div>
        </div>
        <h1 class="title">剪韵</h1>
        <p class="subtitle">非遗剪纸互动体验</p>
        
        <div class="how-to-play">
            <h3>怎么玩？</h3>
            <ol>
                <li>想象一张<strong>对折的红纸</strong>，中间是折痕虚线</li>
                <li>在右半边<strong>画线</strong>，左半边会实时镜像显示</li>
                <li>点击<strong>"展开作品"</strong>，看到完整的对称剪纸！</li>
            </ol>
        </div>
        
        <button class="start-btn" onclick="startGame()">开始体验</button>
    </div>
    
    <!-- 游戏页面 -->
    <div class="game-page" id="gamePage">
        <div class="game-header">
            <div class="game-title">剪韵 - 非遗剪纸</div>
            <div class="game-actions">
                <button class="icon-btn" onclick="backToHome()" title="返回">✕</button>
            </div>
        </div>
        
        <div class="game-body">
            <!-- 步骤引导 -->
            <div class="step-guide">
                <div class="step-item active" id="step1">
                    <span class="step-num">1</span>
                    <span>画图案</span>
                </div>
                <div class="step-item" id="step2">
                    <span class="step-num">2</span>
                    <span>展开看效果</span>
                </div>
                <div class="step-item" id="step3">
                    <span class="step-num">3</span>
                    <span>保存分享</span>
                </div>
            </div>
            
            <!-- 提示 -->
            <div class="hint-box" id="hintBox">
                在右半边红纸上画线，左半边会实时镜像！画完后点击"展开作品"看完整效果
            </div>
            
            <!-- 画布区域 -->
            <div class="canvas-area">
                <div class="canvas-label">
                    对折的红纸（虚线为折痕，左半边实时镜像）
                    <span class="fold-tag">已折叠</span>
                </div>
                <div class="canvas-container">
                    <canvas id="paperCanvas"></canvas>
                </div>
                
                <!-- 工具栏 -->
                <div class="toolbar">
                    <button class="tool-btn active" onclick="selectTool('pen')" id="toolPen">✏️ 画笔</button>
                    <button class="tool-btn" onclick="selectTool('eraser')" id="toolEraser">🧹 橡皮</button>
                    <button class="tool-btn" onclick="clearCanvas()">🗑️ 清空</button>
                </div>
            </div>
            
            <!-- 控制按钮 -->
            <div class="control-bar">
                <button class="control-btn btn-secondary" onclick="resetPaper()">重置</button>
                <button class="control-btn btn-primary" onclick="unfoldPaper()">✨ 展开作品</button>
            </div>
        </div>
    </div>
    
    <!-- 结果页面 -->
    <div class="result-page" id="resultPage">
        <h2 class="result-title">🎉 你的剪纸作品完成了！</h2>
        <p class="result-desc">这就是对称折叠的魔法——你只在半边画，展开后变成完整的图案</p>
        <div class="result-canvas">
            <canvas id="resultCanvas"></canvas>
        </div>
        <div class="result-actions">
            <button class="control-btn btn-secondary" onclick="backToGame()">再玩一次</button>
            <button class="control-btn btn-primary" onclick="saveWork()">💾 保存作品</button>
        </div>
    </div>

    <script>
        // ==================== 全局变量 ====================
        let canvas, ctx;
        let resultCanvas, resultCtx;
        let isDrawing = false;
        let currentTool = 'pen';
        let cutPaths = [];  // 存储所有剪裁路径（用于展开时重新渲染）
        let currentPath = [];
        let paperSize = { width: 0, height: 0 };
        let paperPadding = 30;  // 纸张边距
        
        // ==================== 初始化 ====================
        function init() {
            canvas = document.getElementById('paperCanvas');
            ctx = canvas.getContext('2d');
            resultCanvas = document.getElementById('resultCanvas');
            resultCtx = resultCanvas.getContext('2d');
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // 鼠标事件
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);
            
            // 触摸事件
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);
            
            drawFoldedPaper();
        }
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            
            paperSize = { width: rect.width, height: rect.height };
            
            drawFoldedPaper();
            redrawCutsOnFoldedPaper();
        }
        
        // ==================== 绘制对折纸张（只显示右半边） ====================
        function drawFoldedPaper() {
            const w = paperSize.width;
            const h = paperSize.height;
            const dpr = window.devicePixelRatio || 1;
            
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.scale(dpr, dpr);
            
            // 背景
            ctx.fillStyle = '#F5EDE4';
            ctx.fillRect(0, 0, w, h);
            
            // 纸张阴影
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;
            
            const paperW = w - paperPadding * 2;
            const paperH = h - paperPadding * 2;
            const foldX = paperPadding + paperW / 2;
            
            // 绘制完整纸张（左右两半）
            ctx.fillStyle = '#C41E3A';
            ctx.fillRect(paperPadding, paperPadding, paperW, paperH);
            
            ctx.shadowColor = 'transparent';
            
            // 纸张纹理（左右两半）
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1;
            for (let i = 0; i < paperW; i += 3) {
                ctx.beginPath();
                ctx.moveTo(paperPadding + i, paperPadding);
                ctx.lineTo(paperPadding + i, paperPadding + paperH);
                ctx.stroke();
            }
            
            // 中心折痕虚线
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 5]);
            ctx.beginPath();
            ctx.moveTo(foldX, paperPadding);
            ctx.lineTo(foldX, paperPadding + paperH);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 左半边提示（镜像预览区）
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('镜像预览', paperPadding + paperW * 0.25, paperPadding + paperH / 2);
            
            // 右半边提示（绘制区）
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('在这半边画', paperPadding + paperW * 0.75, paperPadding + paperH / 2);
        }
        
        // ==================== 在对折纸张上绘制剪裁效果 ====================
        function redrawCutsOnFoldedPaper() {
            if (cutPaths.length === 0) return;
            
            const paperW = paperSize.width - paperPadding * 2;
            const foldX = paperPadding + paperW / 2;
            
            // 使用 destination-out 在红纸上"挖洞"
            ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = 'rgba(0,0,0,1)';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 4;
            
            cutPaths.forEach(path => {
                if (path.length < 2) return;
                
                // 右半边（原始路径）
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                for (let i = 1; i < path.length; i++) {
                    ctx.lineTo(path[i].x, path[i].y);
                }
                ctx.stroke();
                
                // 左半边（镜像路径）
                ctx.beginPath();
                ctx.moveTo(2 * foldX - path[0].x, path[0].y);
                for (let i = 1; i < path.length; i++) {
                    ctx.lineTo(2 * foldX - path[i].x, path[i].y);
                }
                ctx.stroke();
            });
            
            ctx.globalCompositeOperation = 'source-over';
        }
        
        // ==================== 绘制交互 ====================
        function startDrawing(e) {
            isDrawing = true;
            const pos = getPosition(e);
            currentPath = [pos];
        }
        
        function draw(e) {
            if (!isDrawing) return;
            const pos = getPosition(e);
            currentPath.push(pos);
            
            const paperW = paperSize.width - paperPadding * 2;
            const foldX = paperPadding + paperW / 2;
            const prevPos = currentPath[currentPath.length - 2];
            
            // 实时绘制：在右半边红纸上"挖洞"
            ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = 'rgba(0,0,0,1)';
            ctx.lineWidth = currentTool === 'eraser' ? 15 : 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // 右半边（原始笔画）
            ctx.beginPath();
            ctx.moveTo(prevPos.x, prevPos.y);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            
            // 左半边（镜像笔画）
            ctx.beginPath();
            ctx.moveTo(2 * foldX - prevPos.x, prevPos.y);
            ctx.lineTo(2 * foldX - pos.x, pos.y);
            ctx.stroke();
            
            ctx.globalCompositeOperation = 'source-over';
        }
        
        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            if (currentPath.length > 1) {
                cutPaths.push([...currentPath]);
            }
            currentPath = [];
            
            if (cutPaths.length > 0) {
                document.getElementById('hintBox').textContent = '画好了？点击"展开作品"看完整效果！';
                document.getElementById('hintBox').style.animation = 'none';
            }
        }
        
        function getPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            const dpr = window.devicePixelRatio || 1;
            
            return {
                x: (clientX - rect.left) * dpr,
                y: (clientY - rect.top) * dpr
            };
        }
        
        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            startDrawing({ clientX: touch.clientX, clientY: touch.clientY });
        }
        
        function handleTouchMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            draw({ clientX: touch.clientX, clientY: touch.clientY });
        }
        
        // ==================== 展开作品 ====================
        function unfoldPaper() {
            if (cutPaths.length === 0) {
                alert('纸还是空白的哦，先画点什么再展开吧！');
                return;
            }
            
            const w = paperSize.width;
            const h = paperSize.height;
            const dpr = window.devicePixelRatio || 1;
            const paperW = w - paperPadding * 2;
            const paperH = h - paperPadding * 2;
            const halfW = paperW / 2;
            const foldX = paperPadding + halfW;
            
            // 结果画布尺寸
            const resultW = paperW + 40;
            const resultH = paperH + 40;
            
            resultCanvas.width = resultW * dpr;
            resultCanvas.height = resultH * dpr;
            resultCanvas.style.width = resultW + 'px';
            resultCanvas.style.height = resultH + 'px';
            
            resultCtx.setTransform(1, 0, 0, 1, 0, 0);
            resultCtx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
            resultCtx.scale(dpr, dpr);
            
            // 背景
            resultCtx.fillStyle = '#F5EDE4';
            resultCtx.fillRect(0, 0, resultW, resultH);
            
            const centerX = resultW / 2;
            const topY = 20;
            
            // ========== 创建右半边离屏画布（正常） ==========
            const rightCanvas = document.createElement('canvas');
            rightCanvas.width = halfW * dpr;
            rightCanvas.height = paperH * dpr;
            const rightCtx = rightCanvas.getContext('2d');
            
            // 绘制红纸
            rightCtx.fillStyle = '#C41E3A';
            rightCtx.fillRect(0, 0, rightCanvas.width, rightCanvas.height);
            
            // 纹理
            rightCtx.strokeStyle = 'rgba(255,255,255,0.15)';
            rightCtx.lineWidth = 1;
            for (let i = 0; i < halfW; i += 3) {
                rightCtx.beginPath();
                rightCtx.moveTo(i * dpr, 0);
                rightCtx.lineTo(i * dpr, paperH * dpr);
                rightCtx.stroke();
            }
            
            // 剪裁挖洞（路径坐标相对于折痕的偏移）
            rightCtx.globalCompositeOperation = 'destination-out';
            rightCtx.strokeStyle = 'rgba(0,0,0,1)';
            rightCtx.lineCap = 'round';
            rightCtx.lineJoin = 'round';
            rightCtx.lineWidth = 4 * dpr;
            
            cutPaths.forEach(path => {
                if (path.length < 2) return;
                rightCtx.beginPath();
                rightCtx.moveTo(path[0].x - foldX, path[0].y - paperPadding);
                for (let i = 1; i < path.length; i++) {
                    rightCtx.lineTo(path[i].x - foldX, path[i].y - paperPadding);
                }
                rightCtx.stroke();
            });
            rightCtx.globalCompositeOperation = 'source-over';
            
            // ========== 创建左半边离屏画布（镜像，与绘制阶段一致） ==========
            const leftCanvas = document.createElement('canvas');
            leftCanvas.width = halfW * dpr;
            leftCanvas.height = paperH * dpr;
            const leftCtx = leftCanvas.getContext('2d');
            
            // 绘制红纸
            leftCtx.fillStyle = '#C41E3A';
            leftCtx.fillRect(0, 0, leftCanvas.width, leftCanvas.height);
            
            // 纹理
            leftCtx.strokeStyle = 'rgba(255,255,255,0.15)';
            leftCtx.lineWidth = 1;
            for (let i = 0; i < halfW; i += 3) {
                leftCtx.beginPath();
                leftCtx.moveTo(i * dpr, 0);
                leftCtx.lineTo(i * dpr, paperH * dpr);
                leftCtx.stroke();
            }
            
            // 剪裁挖洞（镜像路径，与绘制阶段用相同的镜像公式 2*foldX - x）
            leftCtx.globalCompositeOperation = 'destination-out';
            leftCtx.strokeStyle = 'rgba(0,0,0,1)';
            leftCtx.lineCap = 'round';
            leftCtx.lineJoin = 'round';
            leftCtx.lineWidth = 4 * dpr;
            
            cutPaths.forEach(path => {
                if (path.length < 2) return;
                leftCtx.beginPath();
                // 镜像公式与绘制阶段一致：2 * foldX - path.x，再减去左半边起始位置 paperPadding
                const rx = 2 * foldX - path[0].x - paperPadding;
                const ry = path[0].y - paperPadding;
                leftCtx.moveTo(rx, ry);
                for (let i = 1; i < path.length; i++) {
                    leftCtx.lineTo(2 * foldX - path[i].x - paperPadding, path[i].y - paperPadding);
                }
                leftCtx.stroke();
            });
            leftCtx.globalCompositeOperation = 'source-over';
            
            // ========== 绘制到结果画布（直接放置，不再翻转） ==========
            // 左半边
            resultCtx.drawImage(leftCanvas, 0, 0, halfW * dpr, paperH * dpr, centerX - halfW, topY, halfW, paperH);
            
            // 右半边
            resultCtx.drawImage(rightCanvas, 0, 0, halfW * dpr, paperH * dpr, centerX, topY, halfW, paperH);
            
            // 中心折痕线
            resultCtx.strokeStyle = 'rgba(255,255,255,0.4)';
            resultCtx.lineWidth = 2;
            resultCtx.setLineDash([8, 4]);
            resultCtx.beginPath();
            resultCtx.moveTo(centerX, topY);
            resultCtx.lineTo(centerX, topY + paperH);
            resultCtx.stroke();
            resultCtx.setLineDash([]);
            
            // 更新步骤
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
            
            // 显示结果页面
            document.getElementById('gamePage').style.display = 'none';
            document.getElementById('resultPage').style.display = 'block';
            document.getElementById('resultPage').classList.add('fade-in');
        }
        
        // ==================== 工具选择 ====================
        function selectTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tool === 'pen' ? 'toolPen' : 'toolEraser').classList.add('active');
            canvas.style.cursor = tool === 'eraser' ? 'cell' : 'crosshair';
        }
        
        // ==================== 控制功能 ====================
        function clearCanvas() {
            cutPaths = [];
            drawFoldedPaper();
            document.getElementById('hintBox').textContent = '在右半边红纸上画线，左半边会实时镜像！画完后点击"展开作品"看完整效果';
            document.getElementById('hintBox').style.animation = 'pulse 2s infinite';
        }
        
        function resetPaper() {
            clearCanvas();
        }
        
        function saveWork() {
            const link = document.createElement('a');
            link.download = '剪韵-我的剪纸作品.png';
            link.href = resultCanvas.toDataURL('image/png');
            link.click();
        }
        
        // ==================== 页面导航 ====================
        function startGame() {
            document.getElementById('landingPage').style.display = 'none';
            document.getElementById('gamePage').style.display = 'block';
            document.getElementById('gamePage').classList.add('fade-in');
            setTimeout(init, 100);
        }
        
        function backToHome() {
            document.getElementById('gamePage').style.display = 'none';
            document.getElementById('landingPage').style.display = 'flex';
            clearCanvas();
        }
        
        function backToGame() {
            document.getElementById('resultPage').style.display = 'none';
            document.getElementById('gamePage').style.display = 'block';
            document.getElementById('step1').classList.add('active');
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.remove('active');
            clearCanvas();
        }
    </script>
</body>
</html>
