<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream-Dex · 梦境图鉴</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-1: #FAF6EF; --paper-2: #F5F0E6; --paper-3: #EFE9DB; --paper-4: #E6DFCC;
            --ink-1: #2A2A2A; --ink-2: #4A4A4A; --ink-3: #6B6B6B; --ink-4: #8A8A8A;
            --mist-1: #D6DCE5; --mist-2: #BFC7D2; --mist-3: #A6B0BE; --mist-soft: rgba(191, 199, 210, 0.35);
            --gold-1: #C9A962; --gold-2: #DDB97A; --gold-3: #E8C88B; --gold-soft: rgba(201, 169, 98, 0.18);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1); --ease-in-out-expo: cubic-bezier(0.87, 0, 0.13, 1);
            --ease-spring: cubic-bezier(0.22, 1.2, 0.36, 1); --ease-breath: cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-soft: 0 2px 12px rgba(42, 42, 42, 0.06); --shadow-mid: 0 8px 32px rgba(42, 42, 42, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100vh; }
        body { font-family: 'Noto Serif SC', serif; background: var(--paper-1); color: var(--ink-1); line-height: 1.75; overflow-x: hidden; position: relative; -webkit-font-smoothing: antialiased; }
        body::before { content: ''; position: fixed; inset: 0; background-image: radial-gradient(ellipse at 20% 30%, rgba(191, 199, 210, 0.15) 0%, transparent 50%), radial-gradient(ellipse at 80% 70%, rgba(201, 169, 98, 0.08) 0%, transparent 50%), radial-gradient(ellipse at 50% 50%, rgba(232, 200, 200, 0.06) 0%, transparent 70%); pointer-events: none; z-index: 0; }
        body::after { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.3 0 0 0 0 0.3 0 0 0 0 0.3 0 0 0 0 0.06 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); opacity: 1; pointer-events: none; z-index: 1; mix-blend-mode: multiply; }
        .ink-bg { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
        .ink-particle { position: absolute; background: radial-gradient(circle, var(--ink-3) 0%, transparent 70%); border-radius: 50%; opacity: 0; animation: floatDrift 25s var(--ease-breath) infinite; will-change: transform, opacity; }
        @keyframes floatDrift { 0% { transform: translate(0, 0) scale(0.8); opacity: 0; } 15% { opacity: 0.35; } 50% { transform: translate(40px, -100px) scale(1.1); opacity: 0.15; } 85% { opacity: 0.25; } 100% { transform: translate(-30px, -200px) scale(0.9); opacity: 0; } }

        /* ==================== 首页 Hero ==================== */
        .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 3rem 1.5rem; position: relative; z-index: 10; }
        .hero-inner { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; max-width: 640px; width: 100%; }
        .hero-brand { font-family: 'Ma Shan Zheng', serif; font-size: 1rem; color: var(--gold-1); letter-spacing: 0.5em; opacity: 0; animation: fadeSlideUp 1.4s var(--ease-out-expo) 0.2s forwards; }
        .hero-divider { width: 40px; height: 1px; background: linear-gradient(to right, transparent, var(--gold-1), transparent); margin: 0 auto; opacity: 0; animation: fadeSlideUp 1.4s var(--ease-out-expo) 0.4s forwards; }
        .hero-title { font-family: 'ZCOOL XiaoWei', serif; font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 400; color: var(--ink-1); letter-spacing: 0.08em; line-height: 1.6; opacity: 0; animation: fadeSlideUp 1.4s var(--ease-out-expo) 0.6s forwards; position: relative; }
        .hero-title .verse { display: block; }
        .hero-title .accent { color: var(--gold-1); position: relative; }
        .hero-subtitle { font-size: clamp(0.9rem, 1.4vw, 1.05rem); color: var(--ink-3); max-width: 520px; line-height: 2.2; font-weight: 300; opacity: 0; animation: fadeSlideUp 1.4s var(--ease-out-expo) 0.9s forwards; }
        .hero-subtitle .line { display: block; }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .record-btn-container { position: relative; margin-top: 1.5rem; margin-bottom: 0.5rem; opacity: 0; animation: fadeSlideUp 1.4s var(--ease-out-expo) 1.2s forwards; }
        .record-glow { position: absolute; inset: -30px; border-radius: 50%; background: radial-gradient(circle, var(--gold-soft) 0%, transparent 70%); opacity: 0; pointer-events: none; z-index: 0; }
        .record-btn-container.active .record-glow { opacity: 1; }
        .record-ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--mist-2); opacity: 0; pointer-events: none; }
        .record-btn-container.active .record-ring { animation: ringPulse 2s var(--ease-breath) infinite; opacity: 0.6; }
        .record-ring:nth-child(2) { animation-delay: 0.4s; }
        .record-ring:nth-child(3) { animation-delay: 0.8s; }
        @keyframes ringPulse { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }

        .record-btn { position: relative; width: 180px; height: 180px; border-radius: 50%; border: none; background: radial-gradient(circle at 30% 30%, var(--paper-1) 0%, var(--paper-3) 50%, var(--paper-4) 100%); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.4s var(--ease-spring), box-shadow 0.4s var(--ease-spring), background 0.4s ease; box-shadow: var(--shadow-soft), var(--shadow-mid), inset 0 2px 20px rgba(255, 255, 255, 0.8), inset 0 -2px 20px rgba(139, 139, 139, 0.06); z-index: 1; will-change: transform; user-select: none; -webkit-tap-highlight-color: transparent; }
        .record-btn::before { content: ''; position: absolute; inset: 8px; border-radius: 50%; border: 1px solid var(--mist-2); opacity: 0.4; pointer-events: none; }
        .record-btn:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 12px 40px rgba(42, 42, 42, 0.12), 0 4px 16px rgba(42, 42, 42, 0.06), inset 0 2px 20px rgba(255, 255, 255, 0.8), inset 0 -2px 20px rgba(139, 139, 139, 0.06); }
        .record-btn:active, .record-btn.pressed { transform: scale(0.96); background: radial-gradient(circle at 30% 30%, #F7F1E3 0%, #E5D8C8 50%, #D8C8B0 100%); }
        .record-btn.generating { transform: scale(1); background: radial-gradient(circle at 30% 30%, #FFF4DE 0%, #F5E8C8 50%, #E8D5A8 100%); }
        .mic-icon { width: 44px; height: 44px; margin-bottom: 0.6rem; opacity: 0.75; transition: all 0.4s ease; stroke: var(--ink-2); stroke-width: 1.2; fill: none; }
        .record-btn.pressed .mic-icon, .record-btn.generating .mic-icon { opacity: 1; transform: scale(1.1); stroke: var(--gold-1); }
        .record-btn-text { font-family: 'ZCOOL XiaoWei', serif; font-size: 0.95rem; color: var(--ink-2); letter-spacing: 0.15em; margin-bottom: 0.1rem; transition: color 0.4s ease; }
        .record-btn-hint { font-size: 0.72rem; color: var(--ink-4); letter-spacing: 0.1em; margin-top: 0.1rem; opacity: 0.8; }

        .status-text { min-height: 28px; font-family: 'ZCOOL XiaoWei', serif; font-size: 1rem; color: var(--ink-3); letter-spacing: 0.15em; opacity: 0; transition: opacity 0.6s var(--ease-out-expo); text-align: center; line-height: 1.6; padding: 0 1rem; }
        .status-text.visible { opacity: 1; }

        .hero-footer { font-size: 0.85rem; color: var(--ink-4); letter-spacing: 0.2em; text-align: center; max-width: 90%; line-height: 2; opacity: 0; animation: fadeSlideUp 1.4s var(--ease-out-expo) 1.5s forwards; margin-top: 1.5rem; }
        .hero-footer .seal { display: inline-block; color: var(--gold-1); padding: 0.1rem 0.6rem; border: 1px solid var(--gold-1); font-size: 0.75rem; letter-spacing: 0.3em; }

        /* ==================== 漂浮梦书 ==================== */
        .floating-book { position: fixed; top: 30px; right: 30px; width: 90px; height: 125px; cursor: pointer; z-index: 1000; transition: transform 0.5s var(--ease-spring); opacity: 0; animation: bookAppear 1.5s var(--ease-out-expo) 1.8s forwards, bookFloatY 8s var(--ease-breath) infinite 2s; will-change: transform; -webkit-tap-highlight-color: transparent; }
        @keyframes bookAppear { from { opacity: 0; transform: translateY(-20px) scale(0.8); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes bookFloatY { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
        .floating-book:hover { transform: translateY(-8px) scale(1.05) rotate(0deg) !important; }
        .book-cover { width: 100%; height: 100%; background: linear-gradient(145deg, var(--paper-2) 0%, var(--paper-3) 40%, var(--paper-4) 100%); border-radius: 3px 8px 8px 3px; box-shadow: 4px 8px 24px rgba(42, 42, 42, 0.15), inset 2px 0 0 rgba(139, 139, 139, 0.2), inset -1px 0 0 rgba(255, 255, 255, 0.6); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0.5rem 0.3rem; overflow: hidden; }
        .book-cover::before { content: ''; position: absolute; left: 6px; top: 12px; bottom: 12px; width: 2px; background: linear-gradient(to bottom, transparent 0%, var(--gold-1) 20%, var(--gold-2) 50%, var(--gold-1) 80%, transparent 100%); opacity: 0.6; }
        .book-cover::after { content: ''; position: absolute; right: 4px; top: 8px; bottom: 8px; width: 1px; background: repeating-linear-gradient(to bottom, rgba(139, 139, 139, 0.3) 0px, rgba(139, 139, 139, 0.3) 3px, transparent 3px, transparent 6px); }
        .book-title { font-family: 'ZCOOL XiaoWei', serif; font-size: 0.8rem; font-weight: 400; color: var(--ink-2); writing-mode: vertical-rl; letter-spacing: 0.25em; margin-bottom: 0.5rem; line-height: 1.8; }
        .book-seal { font-family: 'Ma Shan Zheng', serif; font-size: 0.55rem; color: var(--gold-1); writing-mode: vertical-rl; padding: 3px 5px; border: 1px solid var(--gold-1); letter-spacing: 0.2em; opacity: 0.85; }

        /* ==================== 图鉴 Overlay ==================== */
        .dex-overlay { position: fixed; inset: 0; background: rgba(250, 246, 239, 0); z-index: 2000; opacity: 0; visibility: hidden; transition: opacity 0.6s var(--ease-out-expo), visibility 0.6s var(--ease-out-expo), background 0.6s var(--ease-out-expo); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); overflow: hidden; }
        .dex-overlay.open { opacity: 1; visibility: visible; background: rgba(250, 246, 239, 0.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

        .dex-topbar { position: absolute; top: 0; left: 0; right: 0; width: 100%; padding: clamp(12px, 2vh, 20px) clamp(16px, 3vw, 32px); display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 2030; flex-shrink: 0; }
        .dex-back { display: inline-flex; align-items: center; gap: 8px; padding: clamp(8px, 1.2vh, 12px) clamp(14px, 2vw, 22px); min-height: 44px; border: 1px solid var(--mist-2); border-radius: 999px; background: rgba(250, 246, 239, 0.8); color: var(--ink-2); font-family: 'Ma Shan Zheng', serif; font-size: clamp(0.85rem, 1.3vw, 1rem); letter-spacing: 0.15em; cursor: pointer; transition: all 0.4s var(--ease-spring); }
        .dex-back:hover { background: var(--paper-2); border-color: var(--gold-1); color: var(--gold-1); box-shadow: 0 4px 20px var(--gold-soft); transform: translateY(-2px); }
        .dex-back-icon { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.5; fill: none; transition: transform 0.5s var(--ease-spring); }
        .dex-back:hover .dex-back-icon { transform: translateX(-4px); }
        .dex-title { font-family: 'Ma Shan Zheng', serif; font-size: clamp(0.95rem, 1.5vw, 1.1rem); color: var(--ink-3); letter-spacing: 0.25em; opacity: 0.75; }
        .dex-top-spacer { width: 120px; flex-shrink: 0; }

        .dex-reading { flex: 1 1 auto; width: 100%; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 16px 120px; position: relative; z-index: 2010; }
        .swipe-hint { position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%); font-family: 'ZCOOL XiaoWei', serif; font-size: 0.8rem; color: var(--ink-4); opacity: 0.6; letter-spacing: 0.2em; pointer-events: none; z-index: 2025; }

        /* ==================== 书本容器（新结构） ==================== */
        .book-stage { width: min(96vw, 1280px); height: min(78vh, 760px); position: relative; z-index: 2010; flex-shrink: 0; }
        .book-container { position: relative; width: 100%; height: 100%; perspective: 2000px; perspective-origin: center center; touch-action: pan-y; }
        .book-shell { width: 100%; height: 100%; position: relative; z-index: 1; background: transparent; }
        .book-spine { position: absolute; left: 50%; top: 0; bottom: 0; width: 14px; transform: translateX(-50%); background: linear-gradient(to right, rgba(139, 139, 139, 0.08) 0%, var(--paper-3) 30%, rgba(139, 139, 139, 0.18) 50%, var(--paper-3) 70%, rgba(139, 139, 139, 0.08) 100%); z-index: 3; pointer-events: none; }

        .book-page-left, .book-page-right { position: absolute; top: 0; width: 50%; height: 100%; z-index: 2; overflow: hidden; }
        .book-page-left { left: 0; background: linear-gradient(135deg, var(--paper-1) 0%, var(--paper-2) 50%, var(--paper-3) 100%); border-radius: 6px 2px 2px 6px; box-shadow: -10px 10px 40px rgba(42, 42, 42, 0.1), inset -30px 0 60px rgba(139, 139, 139, 0.06), inset 4px 0 0 rgba(255, 255, 255, 0.4); }
        .book-page-right { right: 0; background: linear-gradient(225deg, var(--paper-1) 0%, var(--paper-2) 50%, var(--paper-3) 100%); border-radius: 2px 6px 6px 2px; box-shadow: 10px 10px 40px rgba(42, 42, 42, 0.1), inset 30px 0 60px rgba(139, 139, 139, 0.06), inset -4px 0 0 rgba(255, 255, 255, 0.4); }

        .page-content { width: 100%; height: 100%; padding: 2rem; display: flex; flex-direction: column; position: relative; box-sizing: border-box; }
        .dream-illustration { flex: 1 1 auto; min-height: 0; background: var(--paper-2); border-radius: 8px; overflow: hidden; position: relative; box-shadow: inset 0 0 60px rgba(139, 139, 139, 0.08), 0 4px 24px rgba(42, 42, 42, 0.08); }
        .dream-illustration::before { content: ''; position: absolute; inset: 12px; border: 1px solid rgba(201, 169, 98, 0.25); border-radius: 6px; pointer-events: none; z-index: 3; }
        .dream-illustration svg, .dream-illustration img { width: 100%; height: 100%; display: block; object-fit: cover; }
        .dream-illustration img {
            filter: saturate(0.93) brightness(1.02) contrast(1.04);
            position: relative;
            z-index: 1;
        }
        .dream-illustration::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            background: radial-gradient(ellipse at 50% 55%, transparent 45%, rgba(42, 42, 42, 0.18) 100%);
        }

        .dream-info { flex: 1 1 auto; display: flex; flex-direction: column; gap: 0.75rem; padding-right: 0.75rem; margin-right: -0.75rem; overflow-y: auto; min-height: 0; }
        .dream-info::-webkit-scrollbar { width: 4px; }
        .dream-info::-webkit-scrollbar-track { background: transparent; }
        .dream-info::-webkit-scrollbar-thumb { background: var(--mist-2); border-radius: 3px; }
        .dream-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; font-family: 'Ma Shan Zheng', serif; font-size: 0.8rem; color: var(--ink-3); letter-spacing: 0.15em; opacity: 0.8; }
        .dream-meta .dream-date { color: var(--gold-1); opacity: 0.9; }
        .dream-title { font-family: 'ZCOOL XiaoWei', serif; font-size: clamp(1.25rem, 2.2vw, 1.7rem); font-weight: 400; color: var(--ink-1); margin-bottom: 0.8rem; letter-spacing: 0.08em; position: relative; padding-bottom: 1rem; line-height: 1.4; }
        .dream-title::after { content: ''; position: absolute; bottom: 0; left: 0; width: 60px; height: 2px; background: linear-gradient(to right, var(--gold-1), transparent); }
        .dream-keywords { display: flex; flex-wrap: wrap; gap: 0.4rem 0.5rem; margin-bottom: 1rem; }
        .keyword-tag { display: inline-block; padding: 0.25rem 0.75rem; background: linear-gradient(135deg, rgba(250, 246, 239, 0.8), rgba(232, 216, 180, 0.35)); border: 1px solid rgba(201, 169, 98, 0.25); border-radius: 999px; font-size: 0.75rem; color: var(--ink-2); letter-spacing: 0.1em; font-family: 'Ma Shan Zheng', serif; }
        .dream-description p { font-size: clamp(0.82rem, 1.2vw, 0.92rem); line-height: 2; color: var(--ink-2); letter-spacing: 0.05em; margin-bottom: 1rem; }
        .dream-reading { margin-top: 0.5rem; padding: 0.8rem 1rem; background: linear-gradient(135deg, rgba(250, 246, 239, 0.7), rgba(232, 200, 200, 0.1)); border-left: 3px solid var(--gold-1); border-radius: 3px; margin-bottom: 0.8rem; }
        .dream-reading .reading-label, .dream-inspiration .inspiration-label { font-family: 'Ma Shan Zheng', serif; font-size: 0.75rem; color: var(--gold-1); margin-bottom: 0.4rem; letter-spacing: 0.2em; display: flex; align-items: center; gap: 0.5rem; }
        .dream-reading .reading-label::before, .dream-inspiration .inspiration-label::before { content: ''; width: 12px; height: 1px; background: var(--gold-1); opacity: 0.5; }
        .dream-reading p { font-size: clamp(0.8rem, 1.15vw, 0.9rem); line-height: 1.9; color: var(--ink-3); font-style: italic; }
        .dream-inspiration { margin-top: 0.3rem; padding: 0.8rem 1rem; background: linear-gradient(135deg, rgba(201, 169, 98, 0.08), rgba(201, 169, 98, 0.04)); border-radius: 4px; }
        .inspiration-text { font-family: 'Ma Shan Zheng', serif; font-size: clamp(0.85rem, 1.2vw, 0.95rem); color: var(--ink-2); line-height: 1.9; letter-spacing: 0.1em; }

        /* ==================== 翻页层（只有它会 rotate） ==================== */
        .turning-page { position: absolute; top: 0; width: 50%; height: 100%; z-index: 5; pointer-events: none; opacity: 0; transform-style: preserve-3d; transition: opacity 0.3s ease; }
        .turning-page.right { right: 0; transform-origin: left center; background: linear-gradient(135deg, var(--paper-1) 0%, var(--paper-2) 50%, var(--paper-3) 100%); border-radius: 2px 6px 6px 2px; box-shadow: 10px 10px 40px rgba(42, 42, 42, 0.15), inset 30px 0 60px rgba(139, 139, 139, 0.05); }
        .turning-page.left { left: 0; transform-origin: right center; background: linear-gradient(225deg, var(--paper-1) 0%, var(--paper-2) 50%, var(--paper-3) 100%); border-radius: 6px 2px 2px 6px; box-shadow: -10px 10px 40px rgba(42, 42, 42, 0.15), inset -30px 0 60px rgba(139, 139, 139, 0.05); }
        .turning-page.anim-next { animation: flipNext 0.85s var(--ease-in-out-expo) forwards; }
        .turning-page.anim-prev { animation: flipPrev 0.85s var(--ease-in-out-expo) forwards; }
        @keyframes flipNext { 0% { transform: rotateY(0deg); opacity: 0; } 3% { opacity: 1; } 100% { transform: rotateY(-180deg); opacity: 0; } }
        @keyframes flipPrev { 0% { transform: rotateY(0deg); opacity: 0; } 3% { opacity: 1; } 100% { transform: rotateY(180deg); opacity: 0; } }

        /* ==================== 底部控件 ==================== */
        .dex-bottombar { position: absolute; bottom: 0; left: 0; right: 0; width: 100%; padding: clamp(8px, 1.5vh, 14px) clamp(16px, 3vw, 32px); display: flex; align-items: center; justify-content: center; gap: clamp(12px, 2vw, 24px); flex-shrink: 0; z-index: 2030; }
        .page-nav-btn { display: inline-flex; align-items: center; gap: 6px; padding: clamp(8px, 1.2vh, 12px) clamp(14px, 2vw, 22px); min-height: 44px; border: 1px solid var(--mist-2); border-radius: 999px; background: rgba(250, 246, 239, 0.85); color: var(--ink-2); font-family: 'Ma Shan Zheng', serif; font-size: clamp(0.85rem, 1.2vw, 0.95rem); letter-spacing: 0.2em; cursor: pointer; transition: all 0.4s var(--ease-spring); white-space: nowrap; }
        .page-nav-btn:hover:not(:disabled) { background: var(--paper-2); border-color: var(--gold-1); color: var(--gold-1); box-shadow: 0 4px 20px var(--gold-soft); transform: translateY(-2px); }
        .page-nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .page-nav-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.5; fill: none; transition: transform 0.4s var(--ease-spring); }
        .page-indicator { font-family: 'Ma Shan Zheng', serif; font-size: clamp(0.9rem, 1.3vw, 1rem); color: var(--ink-3); min-width: 80px; text-align: center; letter-spacing: 0.15em; padding: 6px 14px; border: 1px solid rgba(201, 169, 98, 0.25); border-radius: 12px; background: rgba(250, 246, 239, 0.6); }
        .page-indicator .num { color: var(--gold-1); font-size: 1.15em; }

        /* ==================== 响应式 ==================== */
        @media (max-width: 820px) {
            .dex-reading { padding: 80px 8px 120px; }
            .book-container { width: min(96vw, 540px); height: auto; perspective: 1500px; }
            .book-spine { display: none; }
            .book-page-left, .book-page-right { position: relative; width: 100%; height: auto; border-radius: 6px; box-shadow: 0 6px 24px rgba(42, 42, 42, 0.08); }
            .book-page-left { height: 48vh; min-height: 300px; margin-bottom: 10px; }
            .book-page-right { height: auto; min-height: 30vh; max-height: none; }
            .page-content { padding: 1rem 1rem; }
            .dream-title { font-size: 1.3rem; }
            .dream-description { font-size: 0.82rem; }
            .turning-page { display: none; }
        }
        @media (max-width: 520px) {
            .floating-book { width: 60px; height: 88px; top: 12px; right: 12px; }
            .book-title { font-size: 0.55rem; }
            .book-seal { font-size: 0.4rem; }

    const key = (dream && dream.imageKey) || 'deer';
    const urls = DREAM_IMAGE_SOURCES[key] || [];
    // 优先尝试外部图片；加载失败则由 JS 自动替换为 SVG fallback
    // 如果没有外部源（urls.length === 0）则直接 SVG fallback
    if (urls.length > 0) {
        const url = urls[0];
        // 使用 div.img + onerror 调用全局 fallback 函数
        return `<div class="dream-img-wrap" data-key="${key}" style="width:100%; height:100%; position:relative; overflow:hidden;">
            <img src="${url}" alt="${key}" style="width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition: opacity 0.6s ease;" onload="dreamImageLoaded(this)" onerror="dreamImageFallback(this)">
            <div class="dream-img-placeholder" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, #FAF6EF 0%, #E8E0D5 100%);">
                <svg width="100%" height="100%" viewBox="0 0 500 380" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
                    <rect width="500" height="380" fill="#F5F0E6"/>
                    <text x="250" y="190" font-family="ZCOOL XiaoWei, serif" font-size="18" fill="#8B7355" text-anchor="middle" opacity="0.45">梦正在加载...</text>
                </svg>
            </div>
        </div>`;
    }
    return svgFallback(key);
}

// 图片加载成功 -> 淡入
function dreamImageLoaded(img) {
    try {
        img.style.opacity = '1';
        const ph = img.parentNode.querySelector('.dream-img-placeholder');
        if (ph) {
            setTimeout(() => { if (ph.parentNode) ph.remove(); }, 700);
        }
    } catch(e) {}
}

// 图片加载失败 -> 回退到 SVG fallback
function dreamImageFallback(img) {
    try {
        const wrap = img.parentNode;
        const key = wrap.getAttribute('data-key') || 'deer';
        wrap.innerHTML = svgFallback(key);
    } catch(e) {
        try {
            const wrap = img.parentNode;
            wrap.innerHTML = svgDeer();
        } catch(err) {}
    }
}

/* ============================================================
 * 图鉴渲染 / 翻页 / 滑动 / 键盘 / 按钮交互
 * ============================================================ */
let currentPage = 0;
let isFlipping = false;

function cnNum(n) {
    const map = ['零','一','二','三','四','五','六','七','八','九','十'];
    return map[n] || String(n);
}

function renderDreamInfo(dream) {
    const keywordsHtml = (dream.emotionKeywords || []).map(k => `<span class="keyword-tag">${k}</span>`).join('');
    return `
<div class="dream-meta"><span class="dream-date">${dream.date}</span><span>第 ${cnNum(currentPage+1)} 页</span></div>
<h2 class="dream-title">${dream.title}</h2>
<div class="dream-keywords">${keywordsHtml}</div>
<div class="dream-description"><p>${dream.dreamDescription || ''}</p></div>
<div class="dream-reading"><div class="reading-label">解梦 · 低语</div><p>${dream.playfulReading || ''}</p></div>
<div class="dream-inspiration"><div class="inspiration-label">灵感 · 一句话</div><p class="inspiration-text">「${dream.inspiration || ''}」</p></div>
`;
}

function updateIndicatorAndButtons() {
    const indicator = document.getElementById('pageIndicator');
    if (indicator) indicator.innerHTML = `<span class="num">${currentPage + 1}</span> / ${Math.max(dreams.length, 1)}`;
    const prevBtn = document.getElementById('prevBtn'), nextBtn = document.getElementById('nextBtn');
    if (prevBtn) prevBtn.disabled = currentPage <= 0 || isFlipping;
    if (nextBtn) nextBtn.disabled = currentPage >= dreams.length - 1 || isFlipping;
}

function renderDreamPage(index) {
    const d = dreams[index];
    if (!d) return;
    const ill = document.getElementById('dreamIllustration');
    const info = document.getElementById('dreamInfo');
    if (ill) ill.innerHTML = drawDreamImage(d);
    if (info) info.innerHTML = renderDreamInfo(d);
    updateIndicatorAndButtons();
}

function handlePageTurn(direction) {
    if (isFlipping) return;
    if (!dreams.length) return;
    const target = direction === 'prev' ? currentPage - 1 : currentPage + 1;
    if (target < 0 || target > dreams.length - 1) return;

    isFlipping = true;
    const turning = document.getElementById('turningPage');
    // 根据方向选择翻页动画
    if (turning) {
        turning.className = 'turning-page ' + (direction === 'next' ? 'right anim-next' : 'left anim-prev');
        turning.style.opacity = '1';
    }
    updateIndicatorAndButtons();
    // 动画中途更新内容，等动画结束清层
    setTimeout(() => {
        currentPage = target;
        renderDreamPage(currentPage);
    }, 450);
    setTimeout(() => {
        if (turning) {
            turning.className = 'turning-page right';
            turning.style.opacity = '0';
        }
        isFlipping = false;
        updateIndicatorAndButtons();
    }, 950);
}

function openDex(targetIndex) {
    const overlay = document.getElementById('dexOverlay');
    if (!overlay) return;
    if (typeof targetIndex === 'number' && targetIndex >= 0 && targetIndex < dreams.length) {
        currentPage = targetIndex;
    }
    overlay.classList.add('open');
    renderDreamPage(currentPage);
    console.log('open dex at page:', currentPage);
}

function closeDex() {
    const overlay = document.getElementById('dexOverlay');
    if (!overlay) return;
    overlay.classList.remove('open');
    // 关闭后，让 hero 内容优雅地恢复
    const heroInner = document.querySelector('.hero-inner');
    if (heroInner) {
        heroInner.style.transition = 'opacity 0.7s ease, transform 0.7s ease';
        heroInner.style.opacity = '1';
        heroInner.style.transform = 'none';
    }
}

/* ============================================================
 * 滑动 / 键盘
 * ============================================================ */
function bindSwipeEvents() {
    const container = document.getElementById('bookContainer');
    if (!container) return;
    let startX = 0, startY = 0, dx = 0, dy = 0, swiping = false;
    const threshold = 60;
    container.addEventListener('touchstart', (e) => {
        if (!e.touches || !e.touches[0]) return;
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        dx = 0; dy = 0; swiping = true;
    }, { passive: true });
    container.addEventListener('touchmove', (e) => {
        if (!swiping || !e.touches || !e.touches[0]) return;
        dx = e.touches[0].clientX - startX;
        dy = e.touches[0].clientY - startY;
    }, { passive: true });
    container.addEventListener('touchend', () => {
        if (!swiping) return;
        swiping = false;
        if (Math.abs(dx) >= threshold && Math.abs(dx) > Math.abs(dy)) {
            if (dx < 0) handlePageTurn('next');
            else handlePageTurn('prev');
        }
    });

    // 桌面端鼠标拖拽
    let mStartX = 0, mDx = 0, mDown = false;
    container.addEventListener('mousedown', (e) => { mStartX = e.clientX; mDx = 0; mDown = true; });
    window.addEventListener('mousemove', (e) => { if (mDown) mDx = e.clientX - mStartX; });
    window.addEventListener('mouseup', () => {
        if (!mDown) return;
        mDown = false;
        if (Math.abs(mDx) >= threshold) {
            if (mDx < 0) handlePageTurn('next');
            else handlePageTurn('prev');
        }
    });
}

/* ============================================================
 * 首页语音按钮
 * ============================================================ */
let isRecordingActive = false;

function setStatus(text) {
    const el = document.getElementById('statusText');
    if (!el) return;
    if (text) { el.textContent = text; el.classList.add('visible'); }
    else { el.textContent = ''; el.classList.remove('visible'); }
}

function setBtnText(text) {
    const el = document.getElementById('recordBtnText');
    if (el) el.textContent = text;
}

function startDreamInput() {
    if (isRecordingActive) return;
    isRecordingActive = true;
    const btn = document.getElementById('recordBtn');
    const container = document.getElementById('recordContainer');
    if (btn) btn.classList.add('pressed');
    if (container) container.classList.add('active');
    setBtnText('你的故事正在被听见');
    setStatus('');
    console.log('record button pressed');
}

function finishDreamInput() {
    if (!isRecordingActive) return;
    isRecordingActive = false;
    const btn = document.getElementById('recordBtn');
    const container = document.getElementById('recordContainer');
    if (btn) { btn.classList.remove('pressed'); btn.classList.add('generating'); }
    if (container) container.classList.remove('active');
    setBtnText('梦里的雾正在慢慢散开');
    setStatus('一页新的梦正在落到纸上');
    console.log('record button released, generating mock dream');
    // 生成 mock 梦境并打开图鉴
    setTimeout(() => generateMockDream(), 1000);
}

function generateMockDream() {
    // 简单循环使用已有的梦境标题（不依赖网络）
    const idx = (dreams.length || 0) % imageKeys.length;
    const newDream = {
        id: 'dream-mock-' + Date.now(),
        title: mockTitles[idx],
        date: '今晨 · 还没来得及忘',
        emotionKeywords: ['新鲜', '温度刚好', '想把它写成信'],
        dreamDescription: '你按下按钮，一段昨夜还没散去的梦，被轻轻折叠，放进图鉴这一页。纸页上，墨色还在慢慢铺开。',
        playfulReading: '你不需要立刻读懂它。它会像一个旧书包，陪着你走一段路，等你想起它时，轻轻打开。',
        inspiration: '每一个按下按钮的清晨，都可能有一页新梦正在落向你。',
        imageKey: imageKeys[idx],
        voiceWaveData: [0.5, 0.6, 0.7, 0.5, 0.8, 0.4, 0.6, 0.7]
    };
    dreams.push(newDream);
    console.log('mock dream generated, total dreams:', dreams.length);
    // 稍等片刻后触发完整过渡动画
    setTimeout(() => triggerDreamTransition(dreams.length - 1), 800);
}

function triggerDreamTransition(targetIndex) {
    console.log('starting dream transition to page:', targetIndex);
    const floatingBook = document.getElementById('floatingBook');
    const mistOverlay = document.getElementById('mistOverlay');
    const bookStage = document.getElementById('bookTransitionStage');
    const dexOverlay = document.getElementById('dexOverlay');
    const btn = document.getElementById('recordBtn');

    // 1. 重置所有状态，清除之前残留
    if (btn) btn.classList.remove('generating');
    setBtnText('按住，让昨夜浮现');
    setStatus('');

    // 2. 隐藏浮动书（开始过渡，浮动书消失）
    if (floatingBook) floatingBook.classList.add('transitioning');

    // hero 内容柔和淡出（给用户"沉入梦境"的感觉）
    const hero = document.getElementById('hero');
    const heroInner = hero ? hero.querySelector('.hero-inner') : null;
    if (heroInner) {
        heroInner.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
        heroInner.style.opacity = '0';
        heroInner.style.transform = 'scale(0.97)';
    }

    // 3. 显示墨迹凝聚层
    if (mistOverlay) {
        // 文字改为当前梦境标题
        const mistWord = document.getElementById('mistWord');
        if (mistWord) mistWord.textContent = mockTitles[targetIndex % mockTitles.length];
        mistOverlay.classList.add('active');
    }

    // 4. 墨迹出现后（约 500ms），将过渡书页定位到浮动书原位并激活
    setTimeout(() => {
        if (bookStage) {
            // 书页从浮动书原位（top:30, right:30）缩小版出现，然后放大并移动到中心
            bookStage.style.top = '30px';
            bookStage.style.right = '30px';
            bookStage.style.left = 'auto';
            bookStage.style.bottom = 'auto';
            bookStage.style.transform = 'scale(0.45)';
            bookStage.style.opacity = '1';
            // 触发 reflow 后开始主动画
            bookStage.offsetHeight;
            bookStage.classList.add('active');
        }
        // 墨迹层文字淡出
        const mistWord = document.getElementById('mistWord');
        if (mistWord) {
            mistWord.style.transition = 'opacity 0.4s ease';
            mistWord.style.opacity = '0';
        }
    }, 500);

    // 5. 书页放大动画中途（约 1100ms），dex overlay 淡入背景
    setTimeout(() => {
        if (dexOverlay) {
            // 预先渲染内容
            renderDreamPage(targetIndex);
            dexOverlay.classList.remove('open');
            dexOverlay.classList.add('opening');
            // 隐藏过渡书页（dex overlay 接管显示）
            if (bookStage) {
                bookStage.classList.remove('active');
                bookStage.classList.add('fading');
            }
        }
    }, 1100);

    // 6. 过渡结束，清除所有过渡层（约 2200ms）
    setTimeout(() => {
        if (mistOverlay) mistOverlay.classList.remove('active');
        if (bookStage) {
            bookStage.classList.remove('active', 'fading');
            bookStage.style.opacity = '0';
            bookStage.style.transform = '';
        }
        if (dexOverlay) {
            // 将 opening 切换为 open（全功能状态）
            dexOverlay.classList.remove('opening');
            dexOverlay.classList.add('open');
            // 移除内容层的临时动画（让用户可以正常翻页）
            setTimeout(() => {
                const di = document.getElementById('dreamInfo');
                if (di) {
                    di.querySelectorAll('.dream-meta,.dream-title,.dream-keywords,.dream-description,.dream-reading,.dream-inspiration').forEach(el => {
                        el.style.animation = 'none';
                        el.style.opacity = '1';
                        el.style.transform = 'none';
                    });
                }
                const ill = document.getElementById('dreamIllustration');
                if (ill) {
                    ill.style.animation = 'none';
                    ill.style.opacity = '1';
                }
            }, 600);
        }
        // 恢复浮动书显示（移出 transitioning class）
        if (floatingBook) floatingBook.classList.remove('transitioning');
        console.log('dream transition complete, dex open');
    }, 2200);
}

function bindRecordButton() {
    const btn = document.getElementById('recordBtn');
    if (!btn) return;
    // pointerdown / up / leave
    btn.addEventListener('pointerdown', (e) => {
        if (e.cancelable) e.preventDefault();
        startDreamInput();
    });
    btn.addEventListener('pointerup', () => finishDreamInput());
    btn.addEventListener('pointerleave', () => finishDreamInput());
    btn.addEventListener('pointercancel', () => finishDreamInput());
    // 备用：click（移动端点击即可触发）
    btn.addEventListener('click', (e) => {
        // 如果之前已经是 pointerup 触发完成，click 时不重复
        if (!isRecordingActive) {
            startDreamInput();
            setTimeout(() => finishDreamInput(), 200);
        }
    });
    // 禁用系统上下文菜单，防止长按弹菜单
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
}

/* ============================================================
 * 背景漂浮粒子
 * ============================================================ */
function initInkParticles() {
    const container = document.getElementById('inkBg');
    if (!container) return;
    const colors = ['#D8C898','#C9A962','#B8B5AC','#A8B5C4'];
    for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.style.cssText = `position:absolute;width:${3 + Math.random()*6}px;height:${3 + Math.random()*6}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${colors[i % colors.length]};opacity:${0.05 + Math.random()*0.1};border-radius:50%;filter:blur(${1+Math.random()*2}px);animation:floatDrift ${15+Math.random()*15}s cubic-bezier(0.4,0,0.2,1) infinite;animation-delay:-${Math.random()*10}s;pointer-events:none;`;
        container.appendChild(p);
    }
}

/* ============================================================
 * 主初始化
 * ============================================================ */
function initEvents() {
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const floatingBook = document.getElementById('floatingBook');
    const backBtn = document.getElementById('dexBack');

    if (prevBtn) prevBtn.addEventListener('click', () => handlePageTurn('prev'));
    if (nextBtn) nextBtn.addEventListener('click', () => handlePageTurn('next'));
    if (floatingBook) {
        floatingBook.addEventListener('click', () => openDex(dreams.length - 1));
        floatingBook.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDex(dreams.length - 1); }
        });
    }
    if (backBtn) backBtn.addEventListener('click', closeDex);

    document.addEventListener('keydown', (e) => {
        const overlay = document.getElementById('dexOverlay');
        const isOpen = overlay && (overlay.classList.contains('open') || overlay.classList.contains('opening'));
        if (isOpen) {
            if (e.key === 'ArrowLeft') handlePageTurn('prev');
            else if (e.key === 'ArrowRight') handlePageTurn('next');
            else if (e.key === 'Escape') closeDex();
        }
    });
}

function initApp() {
    initInkParticles();
    bindRecordButton();
    initEvents();
    bindSwipeEvents();
    updateIndicatorAndButtons();
    console.log('dream-dex app ready, total dreams:', dreams.length);
}

window.addEventListener('DOMContentLoaded', initApp);
</script>
