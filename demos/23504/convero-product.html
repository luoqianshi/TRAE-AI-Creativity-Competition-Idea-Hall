:root {
  --background: #212121;
  --foreground: #ececec;
  --surface: #2f2f2f;
  --surface-hover: #383838;
  --border: #424242;
  --border-light: #3a3a3a;
  --text-primary: #ececec;
  --text-secondary: #b4b4b4;
  --text-tertiary: #8e8e8e;
  --accent-green: #4caf50;
  --accent-blue: #378add;
  --accent-amber: #ef9f27;
  --accent-gray: #888780;
}

html {
  --lightningcss-light: ;
  --lightningcss-dark: initial;
  color-scheme: dark;
}

body {

  color: var(--foreground);
  font-family: var(--font-sans), system-ui, -apple-system, sans-serif;
}

::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: none;
}

::-webkit-scrollbar-thumb {
  background: #4a4a4a;
  border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
  background: #5a5a5a;
}

@keyframes pulse-dot {
  0%, 100% {
    opacity: 1;
  }

  50% {
    opacity: .4;
  }
}

.animate-pulse-dot {
  animation: 1.5s ease-in-out infinite pulse-dot;
}

@keyframes fade-in {
  from {
    opacity: 0;
    transform: translateY(4px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.animate-fade-in {
  animation: .3s ease-out fade-in;
}

@keyframes slide-in-right {
  from {
    transform: translateX(100%);
  }

  to {
    transform: translateX(0);
  }
}

.animate-slide-in-right {
  animation: .3s ease-out slide-in-right;
}

.scrollbar-thin::-webkit-scrollbar {
  width: 3px;
}

.scrollbar-thin::-webkit-scrollbar-track {
  background: none;
}

.scrollbar-thin::-webkit-scrollbar-thumb {
  background: #3a3a3a;
  border-radius: 2px;
}

.scrollbar-thin::-webkit-scrollbar-thumb:hover {
  background: #4a4a4a;
}

.prose-dark p {
  margin: 0 0 .5em;
}

.prose-dark p:last-child {

}

.prose-dark strong {
  color: #ececec;
  font-weight: 600;
}

  margin: .6em 0 .3em;

}

  margin: .3em 0;
  padding-left: 1.2em;
}

.prose-dark li {
  margin: .15em 0;
}

.prose-dark code {
  background: #3a3a3a;
  border-radius: 3px;
  padding: .1em .3em;
  font-size: .85em;
}

.prose-dark blockquote {
  color: #8e8e8e;
  border-left: 2px solid #444;
  padding-left: .8em;
}

.prose-dark table {
  border-collapse: collapse;
  width: 100%;
  margin: .5em 0;
}

.prose-dark th, .prose-dark td {
  text-align: left;
  border: 1px solid #444;
  padding: .4em .7em;

.prose-dark th {
  color: #ececec;
  background: #2a2a2a;

.prose-dark tr:nth-child(2n) {
  background: #1e1e1e;

    return `<span class="w-1 h-1 rounded-full shrink-0 inline-block ${active ? 'bg-[#666] animate-pulse-dot' : 'bg-[#3a3a3a]'}"></span>`;
  }

  // 置信度徽章（含 hover 释义卡，复刻 ConfidenceBadge）
  function confBadge(level, reason) {
    const c = LEVELS[level];
    if (!c) return '';
    const card = reason
      ? `<span class="block text-[12px] text-white/90 leading-relaxed">${reason}</span><span class="mt-1.5 block text-[11px] text-white/40 leading-relaxed">确信度${c.label} · ${c.def}</span>`
      : `<span class="block text-[12px] text-white/80 leading-relaxed">确信度${c.label} · ${c.def}</span>`;
    return `<span class="relative inline-flex align-middle group/conf">
      <span class="inline-flex items-center rounded px-1.5 py-0.5 text-[11px] font-medium bg-white/10 text-white/90 cursor-default">${c.label}</span>
      <span class="absolute top-full left-0 z-30 hidden pt-1.5 group-hover/conf:block">
        <span class="block w-60 rounded-lg border border-[#3a3a3a] bg-[#1c1c1c] px-3 py-2 text-left shadow-xl">${card}</span>
      </span>
    </span>`;
  }

  // 取一组理由里最低的置信度（轮次卡的整体置信度）
  function overall(agent) {
    if (!agent.points || !agent.points.length) return null;
    let lowest = agent.points[0];
    for (const p of agent.points) if (ORDER[p.confidence] < ORDER[lowest.confidence]) lowest = p;
    return { level: lowest.confidence, reason: lowest.confidence_reason || lowest.reason || agent.boundary };
  }

  function roundConclusion(r) {
    const col = (name, agent) => {
      const o = overall(agent);
      return `
      <div class="flex flex-col gap-0.5">
        <div class="flex items-center gap-1.5">
          <span class="text-xs text-[#888] font-medium">${name}</span>${o ? confBadge(o.level, o.reason) : ''}
        </div>
        <span class="text-xs text-[#d4d4d4]">${agent.conclusion}</span>
      </div>`;
    };
    return `<div class="grid grid-cols-2 gap-x-4">${col(NAME_A, r.A)}${col(NAME_B, r.B)}</div>`;
  }

  function watchBtn(roundNum) {
    return `<button data-watch="${roundNum}" class="text-xs text-[#777] hover:text-[#999] transition-colors">围观</button>`;
  }

  function activeBlock(roundNum, phase) {
    const lbl = phase === 0 ? '思考中' : '完成';
    const active = phase === 0;
    const agentRow = (name) => `
      <div class="flex items-center gap-1.5">${dot(active)}
        <span class="text-xs text-[#b4b4b4]">${name}</span>
        <span class="text-xs text-[#888]">${lbl}</span>
      </div>`;
    const cRow = phase === 1 ? `
      <div class="mt-2 pt-2 border-t border-[#272727] flex items-center gap-1.5">${dot(true)}
        <span class="text-xs text-[#b4b4b4]">裁判</span>
        <span class="text-xs text-[#888]">总结中</span>
      </div>` : '';
    return `
      <div class="bg-[#1a1a1a] border border-[#222] rounded-xl px-4 py-3 animate-fade-in">
        <div class="flex items-center justify-between mb-2.5">
          <span class="text-xs text-[#888]">${CN[roundNum]}轮讨论中</span>${watchBtn(roundNum)}
        </div>
        <div class="grid grid-cols-2 gap-3">${agentRow(NAME_A)}${agentRow(NAME_B)}</div>
        ${cRow}
      </div>`;
  }

  function completedBlock(roundNum, r) {
    return `
      <div class="bg-[#1a1a1a] border border-[#222] rounded-xl px-4 py-3 animate-fade-in">
        <div class="flex items-center justify-between mb-2.5">
          <div class="flex items-center gap-2">
            <span class="text-xs text-[#888]">${CN[roundNum]}轮</span>
            <span class="w-1.5 h-1.5 rounded-full shrink-0 bg-[#EF9F27]"></span>
          </div>${watchBtn(roundNum)}
        </div>
        ${roundConclusion(r)}
      </div>`;
  }
  const connector = `<div class="flex justify-start pl-[19px] my-1"><div class="w-px h-3 bg-[#2e2e2e]"></div></div>`;

  function finalCard(f) {
    return `
      <div class="relative w-full max-w-3xl mx-auto animate-fade-in">
        <div class="space-y-2">
          <div class="flex items-center px-0.5">
            <span class="inline-flex items-center rounded-full bg-[#2e2510] border border-[#4a3a1a] px-2.5 py-0.5"><span class="text-xs font-medium text-[#EF9F27]">有分歧</span></span>
          </div>
          <div class="rounded-xl border border-[#2c2c2c] bg-[#1e1e1e] overflow-hidden">
            <div class="px-3 py-2 text-xs text-[#888] border-b border-[#272727]">两边在「${f.topic}」上看法不同</div>
            <div class="grid grid-cols-2 divide-x divide-[#3a3a3a]">
              <div class="p-3 space-y-2.5">
                <div><div class="text-xs font-medium text-[#b49bff] mb-1">${NAME_A}</div><p class="text-sm font-medium text-[#ececec]">${f.posA}</p></div>
                <div><div class="text-xs text-[#888] mb-0.5">成立前提</div><p class="text-xs text-[#b4b4b4] leading-relaxed">${f.premA}</p></div>
              </div>
              <div class="p-3 space-y-2.5">
                <div><div class="text-xs font-medium text-[#6bb8ff] mb-1">${NAME_B}</div><p class="text-sm font-medium text-[#ececec]">${f.posB}</p></div>
                <div><div class="text-xs text-[#888] mb-0.5">成立前提</div><p class="text-xs text-[#b4b4b4] leading-relaxed">${f.premB}</p></div>
              </div>
            </div>
            <div class="px-3 py-2.5 border-t border-[#272727]"><span class="text-xs text-[#888]">为什么没达成一致 </span><span class="text-xs text-[#8e8e8e] leading-relaxed">${f.reason}</span></div>
          </div>
          <div class="rounded-xl border border-[#2c2c2c] bg-[#1e1e1e] overflow-hidden">
            <div class="px-4 py-2.5 bg-[#1a1a1a] border-b border-[#2c2c2c]"><h4 class="text-xs font-medium text-[#ececec]">综合建议</h4></div>
            <div class="px-4 py-3"><p class="text-[15px] leading-relaxed text-[#d4d4d4] whitespace-pre-wrap">${f.conclusion}</p></div>
          </div>
        </div>
      </div>`;
  }

  // ---------- 围观详情面板 ----------
  const chatIcon = `<svg class="w-4 h-4 text-[#8e8e8e]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 01-.825-.242m9.345-8.334a2.126 2.126 0 00-.476-.095 48.64 48.64 0 00-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0011.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155"/></svg>`;
  const closeIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-[#8e8e8e]"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>`;

  function agentBody(agent) {
    const pts = agent.points
      .map(
        (p) =>
          `<div class="flex items-baseline gap-1.5 flex-wrap"><span>${p.content}</span>${confBadge(p.confidence, p.reason)}</div>`
      )
      .join('');
    return `<div class="text-[13px] text-[#d4d4d4] leading-relaxed space-y-2">
      <p><span class="font-semibold text-[#ececec]">结论</span>：${agent.conclusion}</p>
      <div class="flex"><span class="font-semibold text-[#ececec] shrink-0">理由：</span><div class="space-y-1">${pts}</div></div>
      ${agent.boundary ? `<p><span class="font-semibold text-[#ececec]">边界</span>：${agent.boundary}</p>` : ''}
    </div>`;
  }
  function agentMessage(which, agent) {
    const dotColor = which === 'A' ? 'bg-[#a78bfa]' : 'bg-[#60a5fa]';
    const nameColor = which === 'A' ? 'text-[#a78bfa]' : 'text-[#60a5fa]';
    const name = which === 'A' ? NAME_A : NAME_B;
    return `<div class="mb-4">
      <div class="flex items-center gap-1.5 mb-1.5"><span class="inline-block h-2 w-2 rounded-full shrink-0 ${dotColor}"></span><span class="text-xs font-medium ${nameColor}">${name}</span></div>
      <div class="rounded-2xl rounded-tl-md bg-[#2a2a2a] px-3.5 py-2.5">${agentBody(agent)}</div>
    </div>`;
  }
  function messageC(text) {
    return `<div class="mb-4">
      <div class="flex items-center gap-1.5 mb-1.5"><span class="inline-block h-2 w-2 rounded-full shrink-0 bg-[#f59e0b]"></span><span class="text-xs font-medium text-[#f59e0b]">裁判</span></div>
      <div class="w-full rounded-2xl bg-[#2a2518] border border-[#3d351e] px-3.5 py-2.5"><div class="text-[13px] text-[#d4d4d4] leading-relaxed">${mdLite(text)}</div></div>
    </div>`;
  }

  function buildPanelBody() {
    let html = '';
    const total = state.done + (state.activeRound ? 1 : 0);
    for (let n = 1; n <= total; n++) {
      const r = ROUNDS[n - 1];
      const isDone = n <= state.done;
      const status = isDone ? `${CN[n]}轮讨论结束，存在分歧` : `${CN[n]}轮讨论中...`;
      const header = `<div class="flex items-center gap-2 mb-4 mt-2">${chatIcon}<span class="text-sm font-medium text-[#b4b4b4]">${status}</span></div>`;
      let body;
      if (isDone) {
        body = agentMessage('A', r.A) + agentMessage('B', r.B) + messageC(r.judge);
      } else {
        body = `<div class="mb-4 text-[12px] text-[#888]">双方正在作答…</div>`;
      }
      const divider = n < total ? `<div class="border-b border-[#272727] my-4"></div>` : '';
      html += `<div id="demo-panel-round-${n}">${header}${body}${divider}</div>`;
    }
    if (total === 0) html = `<div class="text-sm text-[#888] text-center py-8">讨论尚未开始</div>`;
    return html;
  }

  function openPanel(targetRound) {
    closePanel();
    const ov = document.createElement('div');
    ov.id = 'demo-panel-overlay';
    ov.style.cssText = 'position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;';
    ov.innerHTML = `
      <div id="demo-panel-backdrop" style="position:absolute;inset:0;background:rgba(0,0,0,.45)"></div>
      <div style="position:relative;width:440px;max-width:92vw;height:100%;" class="flex flex-col bg-[#1c1c1c] border-l border-[#272727] animate-slide-in-right">
        <div class="h-12 flex items-center justify-between px-4 shrink-0 border-b border-[#272727]">
          <span class="text-sm font-medium text-[#ececec]">讨论详情</span>
          <button id="demo-panel-close" class="flex h-7 w-7 items-center justify-center rounded-md hover:bg-[#2a2a2a] transition-colors">${closeIcon}</button>
        </div>
        <div id="demo-panel-scroll" class="flex-1 overflow-y-auto px-4 py-4">${buildPanelBody()}</div>
      </div>`;
    document.body.appendChild(ov);
    ov.querySelector('#demo-panel-backdrop').addEventListener('click', closePanel);
    ov.querySelector('#demo-panel-close').addEventListener('click', closePanel);
    const target = ov.querySelector('#demo-panel-round-' + targetRound);
    if (target) target.scrollIntoView({ block: 'start' });
  }
  function closePanel() {
    const ov = document.getElementById('demo-panel-overlay');
    if (ov) ov.remove();
  }

  let running = false;
  async function runDemo(mainEl) {
    if (running) return;
    running = true;
    state.done = 0;
    state.activeRound = 0;

    mainEl.innerHTML = `
      <div class="flex flex-col gap-6 px-4 py-6">
        <div class="w-full max-w-3xl mx-auto flex flex-col gap-6">
          <div class="flex flex-col gap-6">
            <div class="flex justify-end scroll-mt-4">
              <div class="max-w-[80%] rounded-2xl rounded-tr-md bg-[#1a3a5c]/70 px-4 py-3">
                <p class="text-[15px] text-[#ececec]">${QUESTION}</p>
              </div>
            </div>
            <div id="demo-process" class="w-full max-w-3xl mx-auto"></div>
            <div id="demo-final"></div>
          </div>
        </div>
      </div>`;

    const proc = mainEl.querySelector('#demo-process');
    // 围观按钮（事件委托）
    proc.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-watch]');
      if (btn) openPanel(parseInt(btn.getAttribute('data-watch'), 10));
    });

    let completedHTML = '';
    function refreshPanel() {
      if (document.getElementById('demo-panel-overlay')) {
        document.getElementById('demo-panel-scroll').innerHTML = buildPanelBody();
      }
    }

    for (let i = 0; i < ROUNDS.length; i++) {
      const roundNum = i + 1;
      state.activeRound = roundNum;
      const pre = completedHTML ? completedHTML + connector : '';
      proc.innerHTML = pre + activeBlock(roundNum, 0);
      mainEl.scrollTop = mainEl.scrollHeight;
      refreshPanel();
      await sleep(1300);
      proc.innerHTML = pre + activeBlock(roundNum, 1);
      await sleep(1100);
      completedHTML += (completedHTML ? connector : '') + completedBlock(roundNum, ROUNDS[i]);
      proc.innerHTML = completedHTML;
      state.done = roundNum;
      state.activeRound = 0;
      refreshPanel();
      mainEl.scrollTop = mainEl.scrollHeight;
      await sleep(500);
    }

    await sleep(300);
    mainEl.querySelector('#demo-final').innerHTML = finalCard(FINAL);
    mainEl.scrollTop = mainEl.scrollHeight;
    running = false;
  }

  function init() {
    const ta = document.querySelector('textarea');
    const main = document.querySelector('main');
    if (!ta || !main) return;

    const toolbar =
      [...document.querySelectorAll('div')].find(
        (d) => /讨论模式/.test(d.textContent || '') && /mt-1\.5/.test(d.className || '')
      ) || ta.closest('.max-w-3xl') || ta.parentElement;

    const wrap = document.createElement('div');
    wrap.className = 'w-full max-w-3xl mx-auto flex justify-center';
    wrap.style.marginTop = '60px';
    wrap.innerHTML =
      `<button id="demo-chip" class="text-sm text-[#b4b4b4] bg-[#1f1f1f] hover:bg-[#262626] border border-[#2c2c2c] rounded-full px-4 py-2 transition-colors">试试：${QUESTION}</button>`;
    toolbar.parentElement.insertBefore(wrap, toolbar.nextSibling);

    document.getElementById('demo-chip').addEventListener('click', () => runDemo(main));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body></html>
