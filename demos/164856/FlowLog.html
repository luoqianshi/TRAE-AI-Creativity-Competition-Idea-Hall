<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowLog - 对话式碎片化日志</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-primary: #F9F6F0;
  --bg-card: #FFFFFF;
  --text-primary: #1E1E1E;
  --text-secondary: #7A7571;
  --border-color: #E6E1DA;
  --accent: #D06A4C;
  --accent-hover: #B55437;
  --accent-light: #F4EFE6;
  --shadow-soft: 0 4px 20px -2px rgba(120, 110, 100, 0.08);
  --shadow-card: 0 2px 12px -2px rgba(120, 110, 100, 0.06);
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-drawer: 32px 0 0 32px;
  --transition: all 0.2s ease-in-out;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.app-container {
  display: flex;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

.main-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
}

.main-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 32px 16px;
  flex-shrink: 0;
}

.header-left {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.app-title {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 28px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.5px;
}

.app-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.display-count-wrapper {
  display: flex;
  align-items: center;
  gap: 8px;
}

.display-count-label {
  font-size: 13px;
  color: var(--text-secondary);
}

.display-count-select {
  padding: 6px 12px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  background-color: var(--bg-card);
  color: var(--text-primary);
  font-size: 13px;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
}

.display-count-select:hover {
  border-color: var(--accent);
}

.display-count-select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(208, 106, 76, 0.1);
}

.icon-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  background-color: var(--bg-card);
  color: var(--text-primary);
  font-size: 13px;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
}

.icon-btn:hover {
  background-color: var(--accent-light);
  border-color: var(--accent);
  color: var(--accent-hover);
}

.drawer-toggle-btn svg {
  color: inherit;
}

.log-list-container {
  flex: 1;
  overflow-y: auto;
  padding: 0 32px 16px;
  scroll-behavior: smooth;
}

.log-list-container::-webkit-scrollbar {
  width: 6px;
}

.log-list-container::-webkit-scrollbar-track {
  background: transparent;
}

.log-list-container::-webkit-scrollbar-thumb {
  background-color: var(--border-color);
  border-radius: 3px;
}

.log-list-container::-webkit-scrollbar-thumb:hover {
  background-color: var(--text-secondary);
}

.log-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.day-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.day-header {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-secondary);
  padding: 8px 4px;
  position: sticky;
  top: 0;
  background-color: var(--bg-primary);
  z-index: 1;
}

.log-card {
  position: relative;
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  box-shadow: var(--shadow-card);
  transition: var(--transition);
}

.log-card:hover {
  box-shadow: var(--shadow-soft);
  border-color: #d9d3ca;
}

.log-card:hover .log-actions {
  opacity: 1;
}

.log-time {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 6px;
  font-weight: 500;
}

.log-content {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-primary);
  white-space: pre-wrap;
  word-break: break-word;
}

.log-content.editing {
  display: none;
}

.log-edit-textarea {
  width: 100%;
  min-height: 80px;
  padding: 12px;
  border: 1px solid var(--accent);
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-primary);
  background-color: var(--bg-primary);
  resize: vertical;
  font-family: inherit;
  transition: var(--transition);
}

.log-edit-textarea:focus {
  outline: none;
  box-shadow: 0 0 0 3px rgba(208, 106, 76, 0.1);
}

.log-edit-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 8px;
}

.log-actions {
  position: absolute;
  top: 12px;
  right: 12px;
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: var(--transition);
}

.log-action-btn {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 8px;
  background-color: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
}

.log-action-btn:hover {
  background-color: var(--accent-light);
  color: var(--accent-hover);
}

.log-action-btn.delete-btn:hover {
  background-color: #fee2e2;
  color: #dc2626;
}

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  min-height: 300px;
  color: var(--text-secondary);
}

.empty-icon {
  margin-bottom: 16px;
  opacity: 0.4;
}

.empty-text {
  font-size: 16px;
  font-weight: 500;
  margin-bottom: 4px;
}

.empty-hint {
  font-size: 13px;
  opacity: 0.7;
}

.input-area {
  padding: 16px 32px 24px;
  flex-shrink: 0;
  background: linear-gradient(to top, var(--bg-primary) 80%, transparent);
}

.input-wrapper {
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-soft);
  overflow: hidden;
  transition: var(--transition);
}

.input-wrapper:focus-within {
  border-color: #d9d3ca;
  box-shadow: 0 4px 24px -2px rgba(120, 110, 100, 0.12), 0 0 0 3px rgba(208, 106, 76, 0.08);
}

.log-input {
  width: 100%;
  padding: 16px 20px 12px;
  border: none;
  outline: none;
  resize: none;
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-primary);
  background-color: transparent;
  font-family: inherit;
}

.log-input::placeholder {
  color: var(--text-secondary);
  opacity: 0.6;
}

.input-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 16px 12px 20px;
}

.input-hint {
  font-size: 12px;
  color: var(--text-secondary);
  opacity: 0.7;
}

.submit-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  border: none;
  border-radius: var(--radius-lg);
  background-color: var(--accent);
  color: white;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
}

.submit-btn:hover {
  background-color: var(--accent-hover);
  transform: translateY(-1px);
}

.submit-btn:active {
  transform: translateY(0);
}

.submit-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.drawer-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 480px;
  max-width: 90vw;
  height: 100vh;
  background-color: var(--bg-card);
  border-radius: var(--radius-drawer);
  box-shadow: -8px 0 32px -4px rgba(120, 110, 100, 0.12);
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 100;
  display: flex;
  flex-direction: column;
}

.drawer-panel.open {
  transform: translateX(0);
}

.drawer-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(30, 30, 30, 0.2);
  opacity: 0;
  visibility: hidden;
  transition: var(--transition);
  z-index: 99;
}

.drawer-overlay.open {
  opacity: 1;
  visibility: visible;
}

.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 28px 16px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
}

.drawer-title {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--text-primary);
}

.close-drawer-btn {
  padding: 6px;
  width: 32px;
  height: 32px;
  justify-content: center;
}

.drawer-filters {
  padding: 16px 24px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
}

.filter-row {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
}

.filter-row:last-child {
  margin-bottom: 0;
}

.filter-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.filter-label {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
}

.date-input {
  padding: 8px 12px;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  font-size: 13px;
  color: var(--text-primary);
  background-color: var(--bg-primary);
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
}

.date-input:hover {
  border-color: var(--accent);
}

.date-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(208, 106, 76, 0.1);
}

.quick-filters {
  flex-wrap: wrap;
}

.quick-filter-btn {
  flex: 1;
  min-width: fit-content;
  padding: 6px 12px;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  background-color: var(--bg-primary);
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
}

.quick-filter-btn:hover {
  border-color: var(--accent);
  color: var(--accent-hover);
}

.quick-filter-btn.active {
  background-color: var(--accent-light);
  border-color: var(--accent);
  color: var(--accent-hover);
  font-weight: 500;
}

.filter-actions {
  justify-content: flex-end;
}

.primary-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border: none;
  border-radius: var(--radius-lg);
  background-color: var(--accent);
  color: white;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
}

.primary-btn:hover {
  background-color: var(--accent-hover);
}

.secondary-btn {
  padding: 8px 16px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  background-color: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
}

.secondary-btn:hover {
  border-color: var(--text-secondary);
  color: var(--text-primary);
}

.drawer-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px 24px;
}

.drawer-content::-webkit-scrollbar {
  width: 6px;
}

.drawer-content::-webkit-scrollbar-track {
  background: transparent;
}

.drawer-content::-webkit-scrollbar-thumb {
  background-color: var(--border-color);
  border-radius: 3px;
}

.archive-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.archive-day-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.archive-day-header {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
  padding: 4px 0;
}

.archive-log-item {
  padding: 10px 14px;
  background-color: var(--bg-primary);
  border-radius: 12px;
  border: 1px solid var(--border-color);
}

.archive-log-time {
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}

.archive-log-content {
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-primary);
  white-space: pre-wrap;
  word-break: break-word;
}

.archive-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 200px;
  color: var(--text-secondary);
  font-size: 14px;
}

.drawer-footer {
  padding: 12px 24px;
  flex-shrink: 0;
  border-top: 1px solid var(--border-color);
  text-align: center;
}

.archive-count {
  font-size: 12px;
  color: var(--text-secondary);
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  padding: 12px 24px;
  background-color: var(--text-primary);
  color: white;
  border-radius: var(--radius-lg);
  font-size: 13px;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 1000;
  pointer-events: none;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.toast.success {
  background-color: #059669;
}

.toast.error {
  background-color: #dc2626;
}
  </style>
</head>
<body>
  <div class="app-container">
    <main class="main-panel" id="mainPanel">
      <header class="main-header">
        <div class="header-left">
          <h1 class="app-title">FlowLog</h1>
          <p class="app-subtitle">记录每一个思想碎片</p>
        </div>
        <div class="header-right">
          <div class="display-count-wrapper">
            <label for="displayCount" class="display-count-label">显示</label>
            <select id="displayCount" class="display-count-select">
              <option value="5">5 条</option>
              <option value="10" selected>10 条</option>
              <option value="20">20 条</option>
              <option value="50">50 条</option>
            </select>
          </div>
          <button id="toggleDrawerBtn" class="icon-btn drawer-toggle-btn" title="查看历史归档">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>历史归档</span>
          </button>
        </div>
      </header>

      <div class="log-list-container" id="logListContainer">
        <div class="log-list" id="logList">
        </div>
        <div class="empty-state" id="emptyState" style="display: none;">
          <div class="empty-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="12" y1="18" x2="12" y2="12"></line>
              <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
          </div>
          <p class="empty-text">还没有日志记录</p>
          <p class="empty-hint">在下方输入框开始记录吧</p>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="logInput"
            class="log-input"
            placeholder="记录此刻的想法... (Enter 发送，Ctrl+Enter 换行)"
            rows="3"
          ></textarea>
          <div class="input-actions">
            <span class="input-hint">Enter 提交 · Ctrl+Enter 换行</span>
            <button id="submitBtn" class="submit-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
              <span>发送</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <aside class="drawer-panel" id="drawerPanel">
      <div class="drawer-header">
        <h2 class="drawer-title">历史归档</h2>
        <button id="closeDrawerBtn" class="icon-btn close-drawer-btn" title="关闭">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="drawer-filters">
        <div class="filter-row">
          <div class="filter-item">
            <label class="filter-label">开始日期</label>
            <input type="date" id="startDate" class="date-input">
          </div>
          <div class="filter-item">
            <label class="filter-label">结束日期</label>
            <input type="date" id="endDate" class="date-input">
          </div>
        </div>
        <div class="filter-row quick-filters">
          <button class="quick-filter-btn" data-range="week">最近一周</button>
          <button class="quick-filter-btn" data-range="month">最近一月</button>
          <button class="quick-filter-btn" data-range="quarter">最近一季</button>
          <button class="quick-filter-btn" data-range="year">最近一年</button>
        </div>
        <div class="filter-row filter-actions">
          <button id="clearFilterBtn" class="secondary-btn">清除筛选</button>
          <button id="copyBtn" class="primary-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>复制</span>
          </button>
        </div>
      </div>

      <div class="drawer-content">
        <div class="archive-list" id="archiveList">
        </div>
        <div class="archive-empty" id="archiveEmpty" style="display: none;">
          <p>暂无符合条件的日志</p>
        </div>
      </div>

      <div class="drawer-footer">
        <span id="archiveCount" class="archive-count">共 0 条记录</span>
      </div>
    </aside>

    <div class="drawer-overlay" id="drawerOverlay"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
class FlowLogDB {
  constructor() {
    this.dbName = 'FlowLogDB';
    this.storeName = 'logs';
    this.db = null;
    this.dbVersion = 1;
  }

  async init() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(this.dbName, this.dbVersion);

      request.onerror = () => reject(request.error);
      request.onsuccess = () => {
        this.db = request.result;
        resolve();
      };

      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(this.storeName)) {
          const store = db.createObjectStore(this.storeName, { keyPath: 'id' });
          store.createIndex('timestamp', 'timestamp', { unique: false });
        }
      };
    });
  }

  async addLog(content) {
    const now = new Date();
    const log = {
      id: now.getTime().toString(),
      timestamp: this.formatTimestamp(now),
      content: content.trim()
    };

    return new Promise((resolve, reject) => {
      const transaction = this.db.transaction([this.storeName], 'readwrite');
      const store = transaction.objectStore(this.storeName);
      const request = store.add(log);

      request.onsuccess = () => resolve(log);
      request.onerror = () => reject(request.error);
    });
  }

  async updateLog(id, content) {
    return new Promise((resolve, reject) => {
      const transaction = this.db.transaction([this.storeName], 'readwrite');
      const store = transaction.objectStore(this.storeName);
      const getRequest = store.get(id);

      getRequest.onsuccess = () => {
        const log = getRequest.result;
        if (log) {
          log.content = content.trim();
          const putRequest = store.put(log);
          putRequest.onsuccess = () => resolve(log);
          putRequest.onerror = () => reject(putRequest.error);
        } else {
          reject(new Error('Log not found'));
        }
      };

      getRequest.onerror = () => reject(getRequest.error);
    });
  }

  async deleteLog(id) {
    return new Promise((resolve, reject) => {
      const transaction = this.db.transaction([this.storeName], 'readwrite');
      const store = transaction.objectStore(this.storeName);
      const request = store.delete(id);

      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  async getRecentLogs(limit) {
    return new Promise((resolve, reject) => {
      const transaction = this.db.transaction([this.storeName], 'readonly');
      const store = transaction.objectStore(this.storeName);
      const index = store.index('timestamp');
      const request = index.openCursor(null, 'prev');

      const logs = [];
      request.onsuccess = () => {
        const cursor = request.result;
        if (cursor && logs.length < limit) {
          logs.push(cursor.value);
          cursor.continue();
        } else {
          resolve(logs);
        }
      };
      request.onerror = () => reject(request.error);
    });
  }

  async getLogsByDateRange(startDate, endDate) {
    return new Promise((resolve, reject) => {
      const transaction = this.db.transaction([this.storeName], 'readonly');
      const store = transaction.objectStore(this.storeName);
      const index = store.index('timestamp');

      const startStr = startDate + ' 00:00:00';
      const endStr = endDate + ' 23:59:59';

      const range = IDBKeyRange.bound(startStr, endStr);
      const request = index.getAll(range);

      request.onsuccess = () => {
        const logs = request.result.sort((a, b) => a.timestamp.localeCompare(b.timestamp));
        resolve(logs);
      };
      request.onerror = () => reject(request.error);
    });
  }

  async getAllLogs() {
    return new Promise((resolve, reject) => {
      const transaction = this.db.transaction([this.storeName], 'readonly');
      const store = transaction.objectStore(this.storeName);
      const request = store.getAll();

      request.onsuccess = () => {
        const logs = request.result.sort((a, b) => a.timestamp.localeCompare(b.timestamp));
        resolve(logs);
      };
      request.onerror = () => reject(request.error);
    });
  }

  formatTimestamp(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');
    return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
  }
}

class FlowLogApp {
  constructor() {
    this.db = new FlowLogDB();
    this.displayCount = 10;
    this.drawerOpen = false;
    this.currentFilter = { startDate: null, endDate: null, activeRange: null };
  }

  async init() {
    await this.db.init();
    this.bindEvents();
    this.loadRecentLogs();
    this.loadArchiveLogs();
  }

  bindEvents() {
    const logInput = document.getElementById('logInput');
    const submitBtn = document.getElementById('submitBtn');
    const displayCountSelect = document.getElementById('displayCount');
    const toggleDrawerBtn = document.getElementById('toggleDrawerBtn');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const startDateInput = document.getElementById('startDate');
    const endDateInput = document.getElementById('endDate');
    const clearFilterBtn = document.getElementById('clearFilterBtn');
    const copyBtn = document.getElementById('copyBtn');

    logInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.ctrlKey && !e.shiftKey) {
        e.preventDefault();
        this.submitLog();
      }
    });

    submitBtn.addEventListener('click', () => this.submitLog());

    displayCountSelect.addEventListener('change', (e) => {
      this.displayCount = parseInt(e.target.value);
      this.loadRecentLogs();
    });

    toggleDrawerBtn.addEventListener('click', () => this.toggleDrawer(true));
    closeDrawerBtn.addEventListener('click', () => this.toggleDrawer(false));
    drawerOverlay.addEventListener('click', () => this.toggleDrawer(false));

    startDateInput.addEventListener('change', () => {
      this.currentFilter.activeRange = null;
      this.updateQuickFilterButtons();
      this.loadArchiveLogs();
    });

    endDateInput.addEventListener('change', () => {
      this.currentFilter.activeRange = null;
      this.updateQuickFilterButtons();
      this.loadArchiveLogs();
    });

    clearFilterBtn.addEventListener('click', () => this.clearFilters());

    copyBtn.addEventListener('click', () => this.copyToClipboard());

    document.querySelectorAll('.quick-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const range = btn.dataset.range;
        this.setQuickFilter(range);
      });
    });
  }

  async submitLog() {
    const logInput = document.getElementById('logInput');
    const content = logInput.value.trim();

    if (!content) return;

    try {
      await this.db.addLog(content);
      logInput.value = '';
      logInput.style.height = 'auto';
      await this.loadRecentLogs();
      await this.loadArchiveLogs();
    } catch (error) {
      console.error('Failed to add log:', error);
      this.showToast('保存失败', 'error');
    }
  }

  async loadRecentLogs() {
    try {
      const logs = await this.db.getRecentLogs(this.displayCount);
      this.renderLogList(logs);
    } catch (error) {
      console.error('Failed to load logs:', error);
    }
  }

  renderLogList(logs) {
    const logList = document.getElementById('logList');
    const emptyState = document.getElementById('emptyState');

    if (logs.length === 0) {
      logList.innerHTML = '';
      emptyState.style.display = 'flex';
      return;
    }

    emptyState.style.display = 'none';

    const grouped = this.groupLogsByDay(logs, true);
    let html = '';

    for (const [day, dayLogs] of Object.entries(grouped)) {
      html += `
        <div class="day-group">
          <div class="day-header">${this.formatDayHeader(day)}</div>
          ${dayLogs.map(log => this.renderLogCard(log)).join('')}
        </div>
      `;
    }

    logList.innerHTML = html;
    this.bindLogCardEvents();
  }

  renderLogCard(log) {
    const time = log.timestamp.split(' ')[1].substring(0, 5);
    return `
      <div class="log-card" data-id="${log.id}">
        <div class="log-actions">
          <button class="log-action-btn edit-btn" title="编辑">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </button>
          <button class="log-action-btn delete-btn" title="删除">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
        <div class="log-time">${time}</div>
        <div class="log-content">${this.escapeHtml(log.content)}</div>
      </div>
    `;
  }

  bindLogCardEvents() {
    const logCards = document.querySelectorAll('.log-card');

    logCards.forEach(card => {
      const id = card.dataset.id;
      const editBtn = card.querySelector('.edit-btn');
      const deleteBtn = card.querySelector('.delete-btn');
      const contentEl = card.querySelector('.log-content');

      editBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        this.enterEditMode(card, id);
      });

      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        this.deleteLog(id);
      });

      contentEl.addEventListener('dblclick', () => {
        this.enterEditMode(card, id);
      });
    });
  }

  enterEditMode(card, id) {
    const contentEl = card.querySelector('.log-content');
    const currentContent = contentEl.textContent;

    const editContainer = document.createElement('div');
    editContainer.className = 'log-edit-container';
    editContainer.innerHTML = `
      <textarea class="log-edit-textarea" rows="3">${this.escapeHtml(currentContent)}</textarea>
      <div class="log-edit-actions">
        <button class="secondary-btn cancel-edit-btn">取消</button>
        <button class="primary-btn save-edit-btn">保存</button>
      </div>
    `;

    contentEl.style.display = 'none';
    contentEl.after(editContainer);

    const textarea = editContainer.querySelector('.log-edit-textarea');
    const saveBtn = editContainer.querySelector('.save-edit-btn');
    const cancelBtn = editContainer.querySelector('.cancel-edit-btn');

    textarea.focus();
    textarea.setSelectionRange(textarea.value.length, textarea.value.length);

    const save = async () => {
      const newContent = textarea.value.trim();
      if (newContent && newContent !== currentContent) {
        try {
          await this.db.updateLog(id, newContent);
          await this.loadRecentLogs();
          await this.loadArchiveLogs();
          this.showToast('已更新', 'success');
        } catch (error) {
          console.error('Failed to update log:', error);
          this.showToast('更新失败', 'error');
        }
      } else {
        contentEl.style.display = '';
        editContainer.remove();
      }
    };

    const cancel = () => {
      contentEl.style.display = '';
      editContainer.remove();
    };

    saveBtn.addEventListener('click', save);
    cancelBtn.addEventListener('click', cancel);

    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        cancel();
      }
    });

    textarea.addEventListener('blur', () => {
      setTimeout(() => {
        if (document.body.contains(editContainer)) {
          save();
        }
      }, 150);
    });
  }

  async deleteLog(id) {
    if (!confirm('确定要删除这条日志吗？')) return;

    try {
      await this.db.deleteLog(id);
      await this.loadRecentLogs();
      await this.loadArchiveLogs();
      this.showToast('已删除', 'success');
    } catch (error) {
      console.error('Failed to delete log:', error);
      this.showToast('删除失败', 'error');
    }
  }

  toggleDrawer(open) {
    const drawerPanel = document.getElementById('drawerPanel');
    const drawerOverlay = document.getElementById('drawerOverlay');

    this.drawerOpen = open;

    if (open) {
      drawerPanel.classList.add('open');
      drawerOverlay.classList.add('open');
    } else {
      drawerPanel.classList.remove('open');
      drawerOverlay.classList.remove('open');
    }
  }

  setQuickFilter(range) {
    const now = new Date();
    let startDate = new Date();

    switch (range) {
      case 'week':
        startDate.setDate(now.getDate() - 7);
        break;
      case 'month':
        startDate.setMonth(now.getMonth() - 1);
        break;
      case 'quarter':
        startDate.setMonth(now.getMonth() - 3);
        break;
      case 'year':
        startDate.setFullYear(now.getFullYear() - 1);
        break;
    }

    const startStr = this.formatDateForInput(startDate);
    const endStr = this.formatDateForInput(now);

    document.getElementById('startDate').value = startStr;
    document.getElementById('endDate').value = endStr;

    this.currentFilter = {
      startDate: startStr,
      endDate: endStr,
      activeRange: range
    };

    this.updateQuickFilterButtons();
    this.loadArchiveLogs();
  }

  clearFilters() {
    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';
    this.currentFilter = { startDate: null, endDate: null, activeRange: null };
    this.updateQuickFilterButtons();
    this.loadArchiveLogs();
  }

  updateQuickFilterButtons() {
    document.querySelectorAll('.quick-filter-btn').forEach(btn => {
      if (btn.dataset.range === this.currentFilter.activeRange) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
  }

  async loadArchiveLogs() {
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;

    let logs;
    try {
      if (startDate && endDate) {
        logs = await this.db.getLogsByDateRange(startDate, endDate);
      } else {
        logs = await this.db.getAllLogs();
      }

      this.renderArchiveList(logs);
      document.getElementById('archiveCount').textContent = `共 ${logs.length} 条记录`;
    } catch (error) {
      console.error('Failed to load archive logs:', error);
    }
  }

  renderArchiveList(logs) {
    const archiveList = document.getElementById('archiveList');
    const archiveEmpty = document.getElementById('archiveEmpty');

    if (logs.length === 0) {
      archiveList.innerHTML = '';
      archiveEmpty.style.display = 'flex';
      return;
    }

    archiveEmpty.style.display = 'none';

    const grouped = this.groupLogsByDay(logs, false);
    let html = '';

    for (const [day, dayLogs] of Object.entries(grouped)) {
      html += `
        <div class="archive-day-group">
          <div class="archive-day-header">${this.formatDayHeader(day)}</div>
          ${dayLogs.map(log => this.renderArchiveItem(log)).join('')}
        </div>
      `;
    }

    archiveList.innerHTML = html;
  }

  renderArchiveItem(log) {
    const time = log.timestamp.split(' ')[1].substring(0, 5);
    return `
      <div class="archive-log-item">
        <div class="archive-log-time">${time}</div>
        <div class="archive-log-content">${this.escapeHtml(log.content)}</div>
      </div>
    `;
  }

  async copyToClipboard() {
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;

    let logs;
    try {
      if (startDate && endDate) {
        logs = await this.db.getLogsByDateRange(startDate, endDate);
      } else {
        logs = await this.db.getAllLogs();
      }

      const text = this.formatExportText(logs);

      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else if (window.__TAURI__) {
        if (window.__TAURI__.clipboardManager) {
          await window.__TAURI__.clipboardManager.writeText(text);
        } else if (window.__TAURI__.clipboard) {
          await window.__TAURI__.clipboard.writeText(text);
        } else {
          throw new Error('Tauri clipboard API not available');
        }
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }

      this.showToast('已复制到剪贴板', 'success');
    } catch (error) {
      console.error('Failed to copy:', error);
      this.showToast('复制失败', 'error');
    }
  }

  formatExportText(logs) {
    if (logs.length === 0) return '';

    const grouped = this.groupLogsByDay(logs, false);
    const parts = [];

    for (const [day, dayLogs] of Object.entries(grouped)) {
      parts.push(`[记录时间: ${day}]`);
      dayLogs.forEach(log => {
        parts.push(log.content);
      });
      parts.push('---');
    }

    if (parts.length > 0 && parts[parts.length - 1] === '---') {
      parts.pop();
    }

    return parts.join('\n');
  }

  groupLogsByDay(logs, reverse = false) {
    const grouped = {};

    logs.forEach(log => {
      const day = log.timestamp.split(' ')[0];
      if (!grouped[day]) {
        grouped[day] = [];
      }
      grouped[day].push(log);
    });

    const days = Object.keys(grouped).sort((a, b) => {
      return reverse ? b.localeCompare(a) : a.localeCompare(b);
    });

    const result = {};
    days.forEach(day => {
      result[day] = grouped[day].sort((a, b) => {
        return reverse ? b.timestamp.localeCompare(a.timestamp) : a.timestamp.localeCompare(b.timestamp);
      });
    });

    return result;
  }

  formatDayHeader(dayStr) {
    const date = new Date(dayStr + 'T00:00:00');
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);

    const target = new Date(date);
    target.setHours(0, 0, 0, 0);

    if (target.getTime() === today.getTime()) {
      return '今天 · ' + this.formatDateChinese(dayStr);
    } else if (target.getTime() === yesterday.getTime()) {
      return '昨天 · ' + this.formatDateChinese(dayStr);
    }

    return this.formatDateChinese(dayStr);
  }

  formatDateChinese(dayStr) {
    const [year, month, day] = dayStr.split('-');
    const date = new Date(dayStr + 'T00:00:00');
    const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    return `${year}年${parseInt(month)}月${parseInt(day)}日 ${weekdays[date.getDay()]}`;
  }

  formatDateForInput(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = `toast show ${type}`;

    setTimeout(() => {
      toast.className = 'toast';
    }, 2000);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const app = new FlowLogApp();
  app.init();
  window.flowlogApp = app;
});
  </script>
