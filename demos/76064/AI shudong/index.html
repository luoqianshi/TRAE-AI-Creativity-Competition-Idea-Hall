<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>心灵树洞 - AI心理支持</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="nav-brand">
                <span class="brand-icon">🌳</span>
                <span class="brand-name">心灵树洞</span>
            </div>
            <div class="nav-links">
                <button class="nav-link active" data-page="home">首页</button>
                <button class="nav-link" data-page="treehole">树洞</button>
                <button class="nav-link" data-page="records">记录</button>
                <button class="nav-link" data-page="knowledge">知识</button>
            </div>
        </nav>

        <main class="main-content">
            <div id="page-home" class="page active">
                <header class="home-header">
                    <div class="greeting">
                        <h1><span id="greeting-text">你好</span>，亲爱的朋友</h1>
                        <p id="date-text">今天是美好的一天</p>
                    </div>
                    <div class="mood-section">
                        <h3>今天的心情如何？</h3>
                        <div class="mood-grid">
                            <button class="mood-card" data-mood="happy">
                                <span class="mood-emoji">😊</span>
                                <span class="mood-label">开心</span>
                            </button>
                            <button class="mood-card" data-mood="sad">
                                <span class="mood-emoji">😢</span>
                                <span class="mood-label">难过</span>
                            </button>
                            <button class="mood-card" data-mood="angry">
                                <span class="mood-emoji">😤</span>
                                <span class="mood-label">生气</span>
                            </button>
                            <button class="mood-card" data-mood="anxious">
                                <span class="mood-emoji">😰</span>
                                <span class="mood-label">焦虑</span>
                            </button>
                            <button class="mood-card" data-mood="calm">
                                <span class="mood-emoji">😌</span>
                                <span class="mood-label">平静</span>
                            </button>
                            <button class="mood-card" data-mood="confused">
                                <span class="mood-emoji">😕</span>
                                <span class="mood-label">困惑</span>
                            </button>
                        </div>
                        <textarea 
                            id="mood-note" 
                            placeholder="写下此刻的心情..." 
                            maxlength="100"
                        ></textarea>
                        <button id="save-mood-btn" class="save-btn">记录心情</button>
                    </div>
                </header>

                <section class="shortcuts">
                    <h3>快捷入口</h3>
                    <div class="shortcut-grid">
                        <button class="shortcut-card" data-page="treehole">
                            <span class="shortcut-icon">🌳</span>
                            <span class="shortcut-text">去树洞倾诉</span>
                        </button>
                        <button class="shortcut-card" data-page="records">
                            <span class="shortcut-icon">📝</span>
                            <span class="shortcut-text">查看记录</span>
                        </button>
                        <button class="shortcut-card" data-page="knowledge">
                            <span class="shortcut-icon">📚</span>
                            <span class="shortcut-text">心理知识</span>
                        </button>
                        <button class="shortcut-card" data-page="treehole">
                            <span class="shortcut-icon">💬</span>
                            <span class="shortcut-text">开始聊天</span>
                        </button>
                    </div>
                </section>

                <section class="recent-chats">
                    <h3>最近对话</h3>
                    <div id="recent-chats-list" class="chat-list">
                        <div class="empty-state">
                            <span class="empty-icon">💭</span>
                            <p>还没有对话记录，去树洞说说吧</p>
                        </div>
                    </div>
                </section>
            </div>

            <div id="page-treehole" class="page">
                <div class="treehole-container">
                    <div id="chat-messages" class="chat-messages">
                        <div class="welcome-message">
                            <div class="welcome-avatar">🌳</div>
                            <h3>欢迎来到心灵树洞</h3>
                            <p>在这里，你可以放心地倾诉任何心事，我会认真倾听并陪伴你。</p>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input 
                            id="chat-input" 
                            type="text" 
                            placeholder="说说你的心事..." 
                            maxlength="500"
                        >
                        <button id="send-btn" class="send-btn">
                            <span>➤</span>
                        </button>
                    </div>
                </div>
            </div>

            <div id="page-records" class="page">
                <div class="records-tabs">
                    <button class="tab-btn active" data-tab="mood">心情记录</button>
                    <button class="tab-btn" data-tab="chat">对话记录</button>
                </div>
                <div id="records-content" class="records-content">
                    <div id="mood-records" class="records-list active">
                        <div class="empty-state">
                            <span class="empty-icon">📝</span>
                            <p>还没有心情记录</p>
                        </div>
                    </div>
                    <div id="chat-records" class="records-list">
                        <div class="empty-state">
                            <span class="empty-icon">💬</span>
                            <p>还没有对话记录</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="page-knowledge" class="page">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input 
                        id="search-input" 
                        type="text" 
                        placeholder="搜索心理知识..."
                    >
                </div>
                <div class="category-bar">
                    <button class="category-btn active" data-category="全部">全部</button>
                    <button class="category-btn" data-category="情绪管理">情绪管理</button>
                    <button class="category-btn" data-category="自我成长">自我成长</button>
                    <button class="category-btn" data-category="人际关系">人际关系</button>
                    <button class="category-btn" data-category="健康生活">健康生活</button>
                </div>
                <div id="articles-list" class="articles-list">
                </div>
                <div id="article-detail" class="article-detail hidden">
                    <button id="close-article-btn" class="close-btn">✕</button>
                    <img id="article-cover" src="" alt="文章封面">
                    <h2 id="article-title"></h2>
                    <div class="article-meta">
                        <span id="article-category" class="category-tag"></span>
                        <span id="article-date"></span>
                    </div>
                    <div id="article-content"></div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>🌳 心灵树洞 - 陪伴你度过每一个时刻</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
