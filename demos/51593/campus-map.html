          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
      </div>

      <!-- Status Bar -->
      <div class="status-bar">
        <div class="status-chip">
          <div class="status-dot"></div>
          <span id="buildingCount">--</span> 栋建筑已标注
        </div>
      </div>

      <!-- Info Panel -->
      <div class="info-panel" id="infoPanel">
        <button class="info-close" onclick="closeInfo()">✕</button>
        <div class="info-header">
          <div class="info-icon" id="infoIcon"></div>
          <div>
            <div class="info-title" id="infoTitle"></div>
            <div class="info-cat" id="infoCat"></div>
          </div>
        </div>
        <div class="info-body" id="infoBody"></div>
        <div class="info-stats" id="infoStats"></div>
        <div class="info-actions">
          <button class="btn btn-primary" onclick="navigateTo()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
            导航前往
          </button>
          <button class="btn btn-ghost" onclick="closeInfo()">关闭</button>
        </div>
      </div>

      <!-- Toast -->
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
// ========== Building Data ==========
const buildings = [
  { id: 'teaching-a', name: '教学楼A', cat: 'teaching', catName: '教学', icon: '📚', color: '#a855f7',
    shape: 'rect', x: 130, y: 230, w: 100, h: 70,
    desc: '主要教学区域，配备多媒体教室24间，支持智慧教学系统。',
    stats: [{ label: '教室数量', value: '24间' }, { label: '容纳人数', value: '1200人' }] },
  { id: 'teaching-b', name: '教学楼B', cat: 'teaching', catName: '教学', icon: '📚', color: '#a855f7',
    shape: 'rect', x: 250, y: 230, w: 90, h: 70,
    desc: '理科教学楼，含物理、化学实验室及阶梯教室。',
    stats: [{ label: '教室数量', value: '18间' }, { label: '实验室', value: '6间' }] },
  { id: 'teaching-c', name: '教学楼C', cat: 'teaching', catName: '教学', icon: '📚', color: '#a855f7',
    shape: 'rect', x: 130, y: 320, w: 100, h: 70,
    desc: '文科教学楼，含语言教室与研讨室。',
    stats: [{ label: '教室数量', value: '20间' }, { label: '研讨室', value: '8间' }] },
  { id: 'library', name: '图书馆', cat: 'study', catName: '学习', icon: '📖', color: '#22d3ee',
    shape: 'rect', x: 280, y: 320, w: 120, h: 90,
    desc: '校图书馆，藏书80万册，设自习区、电子阅览室与研讨间，24小时开放。',
    stats: [{ label: '藏书量', value: '80万册' }, { label: '座位数', value: '800座' }] },
  { id: 'lab', name: '实验楼', cat: 'study', catName: '学习', icon: '🔬', color: '#2dd4bf',
    shape: 'rect', x: 530, y: 230, w: 100, h: 70,
    desc: '综合实验楼，涵盖计算机、生物、材料等多个学科实验室。',
    stats: [{ label: '实验室', value: '15间' }, { label: '设备总值', value: '2000万' }] },
  { id: 'admin', name: '行政楼', cat: 'admin', catName: '行政', icon: '🏛️', color: '#818cf8',
    shape: 'rect', x: 680, y: 230, w: 110, h: 70,
    desc: '学校行政办公中心，含教务处、学工处、财务处等。',
    stats: [{ label: '办公部门', value: '12个' }, { label: '楼层', value: '6层' }] },
  { id: 'dorm-1', name: '1号宿舍楼', cat: 'dorm', catName: '生活', icon: '🏠', color: '#f472b6',
    shape: 'rect', x: 130, y: 480, w: 80, h: 60,
    desc: '男生宿舍楼，6人间，配备空调、独立卫浴与公共洗衣房。',
    stats: [{ label: '房间数', value: '120间' }, { label: '入住人数', value: '720人' }] },
  { id: 'dorm-2', name: '2号宿舍楼', cat: 'dorm', catName: '生活', icon: '🏠', color: '#f472b6',
    shape: 'rect', x: 230, y: 480, w: 80, h: 60,
    desc: '女生宿舍楼，6人间，配备空调、独立卫浴与公共洗衣房。',
    stats: [{ label: '房间数', value: '120间' }, { label: '入住人数', value: '720人' }] },
  { id: 'dorm-3', name: '3号宿舍楼', cat: 'dorm', catName: '生活', icon: '🏠', color: '#f472b6',
    shape: 'rect', x: 330, y: 480, w: 80, h: 60,
    desc: '研究生宿舍楼，4人间，配备独立书桌与高速网络。',
    stats: [{ label: '房间数', value: '80间' }, { label: '入住人数', value: '320人' }] },
  { id: 'canteen', name: '学生食堂', cat: 'life', catName: '生活', icon: '🍴', color: '#fbbf24',
    shape: 'rect', x: 530, y: 480, w: 110, h: 70,
    desc: '三层学生食堂，含中餐、西餐、清真窗口与咖啡厅，支持刷脸支付。',
    stats: [{ label: '就餐位', value: '1500个' }, { label: '窗口数', value: '24个' }] },
  { id: 'mart', name: '校园超市', cat: 'life', catName: '生活', icon: '🛒', color: '#fbbf24',
    shape: 'rect', x: 670, y: 480, w: 70, h: 50,
    desc: '校园便利店，24小时营业，提供日用品、文具与快递代收。',
    stats: [{ label: '营业时间', value: '24h' }, { label: '商品数', value: '3000+' }] },
  { id: 'gym', name: '体育馆', cat: 'sport', catName: '运动', icon: '🏀', color: '#34d399',
    shape: 'rect', x: 770, y: 230, w: 100, h: 80,
    desc: '室内体育馆，含篮球场、羽毛球场、游泳池与健身房。',
    stats: [{ label: '场地数', value: '8个' }, { label: '泳池', value: '标准池' }] },
  { id: 'field', name: '田径操场', cat: 'sport', catName: '运动', icon: '🏃', color: '#34d399',
    shape: 'ellipse', cx: 800, cy: 100, rx: 80, ry: 55,
    desc: '标准400米塑胶跑道田径场，含足球场与看台，可容纳3000人。',
    stats: [{ label: '跑道', value: '400m' }, { label: '看台', value: '3000座' }] },
  { id: 'hospital', name: '校医院', cat: 'life', catName: '生活', icon: '🏥', color: '#f87171',
    shape: 'rect', x: 440, y: 480, w: 70, h: 50,
    desc: '校医院，设内科、外科、口腔科与药房，24小时急诊。',
    stats: [{ label: '科室', value: '6个' }, { label: '急诊', value: '24h' }] },
];

const categories = [
  { id: 'all', name: '全部', icon: '🗺️' },
  { id: 'teaching', name: '教学', icon: '📚' },
  { id: 'study', name: '学习', icon: '📖' },
  { id: 'dorm', name: '宿舍', icon: '🏠' },
  { id: 'life', name: '生活', icon: '🍴' },
  { id: 'sport', name: '运动', icon: '🏀' },
  { id: 'admin', name: '行政', icon: '🏛️' },
];

let currentCat = 'all';
let activeBuilding = null;
let mapScale = 1;
let myLocX = 500, myLocY = 350;

// ========== Init ==========
function init() {
  renderCategories();
  renderBuildingList();
  renderBuildingsOnMapFixed();
  document.getElementById('buildingCount').textContent = buildings.length;
  setTimeout(() => {
    document.getElementById('loader').classList.add('hide');
  }, 800);
}

// ========== Render Categories ==========
function renderCategories() {
  const container = document.getElementById('categoryTabs');
  container.innerHTML = categories.map(c =>
    `<div class="cat-tab ${c.id === currentCat ? 'active' : ''}" onclick="selectCategory('${c.id}')">${c.icon} ${c.name}</div>`
  ).join('');
}

function selectCategory(catId) {
  currentCat = catId;
  renderCategories();
  filterBuildings();
}

// ========== Render Building List ==========
function renderBuildingList(filter = '') {
  const container = document.getElementById('buildingList');
  let list = buildings;
  if (currentCat !== 'all') list = list.filter(b => b.cat === currentCat);
  if (filter) {
    const f = filter.toLowerCase();
    list = list.filter(b =>
      b.name.toLowerCase().includes(f) ||
      b.catName.includes(filter) ||
      b.desc.includes(filter)
    );
  }
  if (list.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--muted);font-size:13px;">未找到相关建筑</div>';
    return;
  }
  container.innerHTML = list.map(b => `
    <div class="building-item ${activeBuilding === b.id ? 'active' : ''}" onclick="selectBuilding('${b.id}')">
      <div class="building-icon" style="background:${b.color}22;border:1px solid ${b.color}44;">${b.icon}</div>
      <div class="building-info">
        <div class="building-name">${b.name}</div>
        <div class="building-desc">${b.catName} · ${b.desc.slice(0, 18)}...</div>
      </div>
    </div>
  `).join('');
}

function filterBuildings() {
  const val = document.getElementById('searchInput').value;
  renderBuildingList(val);
}

// ========== Render Buildings on Map ==========
function getGradId(cat) {
  const map = { teaching: 'gradTeaching', study: 'gradLib', dorm: 'gradDorm', life: 'gradCanteen', sport: 'gradSport', admin: 'gradAdmin' };
  return map[cat] || 'gradTeaching';
}

function renderBuildingsOnMapFixed() {
  const group = document.getElementById('buildingsGroup');
  group.innerHTML = buildings.map(b => {
    let shapeHtml = '';
    let labelX, labelY;
    const gradId = getGradId(b.cat);
    if (b.shape === 'rect') {
      shapeHtml = `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="8"
        fill="url(#${gradId})" stroke="${b.color}" stroke-width="1.5" opacity="0.9"/>`;
      labelX = b.x + b.w / 2;
      labelY = b.y + b.h / 2 + 4;
    } else if (b.shape === 'ellipse') {
      shapeHtml = `<ellipse cx="${b.cx}" cy="${b.cy}" rx="${b.rx}" ry="${b.ry}"
        fill="url(#${gradId})" stroke="${b.color}" stroke-width="1.5" opacity="0.9"/>`;
      labelX = b.cx;
      labelY = b.cy + 4;
    }
    return `
      <g class="building-shape" id="shape-${b.id}" onclick="selectBuilding('${b.id}')">
        ${shapeHtml}
        <text class="building-tag" x="${labelX}" y="${labelY}">${b.name}</text>
      </g>
    `;
  }).join('');
}

// ========== Select Building ==========
function selectBuilding(id) {
  // Remove previous active
  document.querySelectorAll('.building-shape.active').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.building-item.active').forEach(el => el.classList.remove('active'));

  const b = buildings.find(x => x.id === id);
  if (!b) return;

  activeBuilding = id;

  // Highlight on map
  const shape = document.getElementById('shape-' + id);
  if (shape) shape.classList.add('active');

  // Highlight in list
  const items = document.querySelectorAll('.building-item');
  items.forEach(item => {
    if (item.getAttribute('onclick') === `selectBuilding('${id}')`) {
      item.classList.add('active');
      item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  });

  // Show info panel
  showInfoPanel(b);
}

function showInfoPanel(b) {
  const panel = document.getElementById('infoPanel');
  document.getElementById('infoIcon').innerHTML = b.icon;
  document.getElementById('infoIcon').style.background = b.color + '22';
  document.getElementById('infoIcon').style.border = '1px solid ' + b.color + '44';
  document.getElementById('infoTitle').textContent = b.name;
  document.getElementById('infoCat').textContent = b.catName;
  document.getElementById('infoBody').textContent = b.desc;
  document.getElementById('infoStats').innerHTML = b.stats.map(s => `
    <div class="info-stat">
      <div class="info-stat-label">${s.label}</div>
      <div class="info-stat-value" style="color:${b.color};">${s.value}</div>
    </div>
  `).join('');
  panel.classList.add('show');
}

function closeInfo() {
  document.getElementById('infoPanel').classList.remove('show');
  document.querySelectorAll('.building-shape.active').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.building-item.active').forEach(el => el.classList.remove('active'));
  activeBuilding = null;
  document.getElementById('pathGroup').innerHTML = '';
}

// ========== Navigate ==========
function navigateTo() {
  if (!activeBuilding) return;
  const b = buildings.find(x => x.id === activeBuilding);
  if (!b) return;

  const targetX = b.shape === 'rect' ? b.x + b.w / 2 : b.cx;
  const targetY = b.shape === 'rect' ? b.y + b.h / 2 : b.cy;

  // Show my location
  myLocX = 500; myLocY = 600;
  const locEl = document.getElementById('myLocation');
  locEl.style.display = '';
  locEl.setAttribute('transform', `translate(${myLocX}, ${myLocY})`);

  // Draw path
  const pathGroup = document.getElementById('pathGroup');
  const midX = (myLocX + targetX) / 2;
  const midY = Math.min(myLocY, targetY) - 40;
  pathGroup.innerHTML = `
    <path class="path-line" d="M ${myLocX} ${myLocY} Q ${midX} ${midY} ${targetX} ${targetY}"/>
    <circle cx="${targetX}" cy="${targetY}" r="8" fill="${b.color}" filter="url(#glowFilter)">
      <animate attributeName="r" values="6;10;6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  `;

  showToast('🧭 正在导航至 ' + b.name);
}

// ========== Zoom ==========
function zoomMap(factor) {
  const svg = document.getElementById('mapSvg');
  mapScale = Math.max(0.5, Math.min(3, mapScale * factor));
  svg.style.transform = `scale(${mapScale})`;
}

function resetView() {
  mapScale = 1;
  document.getElementById('mapSvg').style.transform = 'scale(1)';
  document.getElementById('pathGroup').innerHTML = '';
  document.getElementById('myLocation').style.display = 'none';
  showToast('视角已重置');
}

// ========== Locate Me ==========
function locateMe() {
  myLocX = 480 + Math.random() * 40;
  myLocY = 580 + Math.random() * 40;
  const locEl = document.getElementById('myLocation');
  locEl.style.display = '';
  locEl.setAttribute('transform', `translate(${myLocX}, ${myLocY})`);
  showToast('📍 已定位到您的位置');
}

// ========== Toast ==========
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ========== Mobile sidebar ==========
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ========== Pan support (drag) ==========
let isDragging = false, startX, startY, panX = 0, panY = 0;
const svgEl = document.getElementById('mapSvg');
svgEl.addEventListener('mousedown', startDrag);
svgEl.addEventListener('mousemove', doDrag);
svgEl.addEventListener('mouseup', endDrag);
svgEl.addEventListener('mouseleave', endDrag);
svgEl.addEventListener('touchstart', e => { if (e.touches.length === 1) startDrag(e.touches[0]); });
svgEl.addEventListener('touchmove', e => { if (e.touches.length === 1) { doDrag(e.touches[0]); e.preventDefault(); } }, { passive: false });
svgEl.addEventListener('touchend', endDrag);

function startDrag(e) {
  if (e.target.closest('.building-shape')) return;
  isDragging = true;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
}
function doDrag(e) {
  if (!isDragging) return;
  panX = e.clientX - startX;
  panY = e.clientY - startY;
  svgEl.style.transform = `translate(${panX}px, ${panY}px) scale(${mapScale})`;
}
function endDrag() { isDragging = false; }

// ========== Start ==========
init();
</script>
</body>
</html>
