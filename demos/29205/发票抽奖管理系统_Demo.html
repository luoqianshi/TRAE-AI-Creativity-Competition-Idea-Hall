<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发票抽奖管理系统 - 交互 Demo</title>
    <style>
        :root {
            --deep-navy: #1a2332;
            --deep-navy-light: #243447;
            --teal: #2d8b8b;
            --teal-light: #3aa8a8;
            --seafoam: #a8dadc;
            --cream: #f1faee;
            --cream-dim: rgba(241, 250, 238, 0.7);
            --success: #4caf7d;
            --warning: #e9c46a;
            --danger: #e76f51;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(145deg, #0f1419 0%, #1a2332 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            color: var(--cream);
        }

        .phone-frame {
            width: 380px;
            max-width: 100%;
            height: 780px;
            background: var(--deep-navy);
            border-radius: 44px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.5), inset 0 0 0 12px #0f1419;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #0f1419;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 100;
        }

        .app-header {
            background: var(--deep-navy);
            padding: 50px 24px 24px;
            border-bottom: 1px solid rgba(168, 218, 220, 0.1);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .greeting h1 {
            font-size: 1.1em;
            font-weight: 500;
            color: var(--cream-dim);
            margin-bottom: 4px;
        }

        .greeting p {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--cream);
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--teal), var(--seafoam));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--deep-navy);
        }

        .stats-card {
            background: linear-gradient(135deg, var(--teal) 0%, #236b6b 100%);
            border-radius: 20px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .stats-card::before {
            content: '';
            position: absolute;
            top: -40px;
            right: -40px;
            width: 140px;
            height: 140px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }

        .stats-card::after {
            content: '';
            position: absolute;
            bottom: -30px;
            right: 30px;
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }

        .stats-label {
            font-size: 0.85em;
            color: rgba(255,255,255,0.85);
            margin-bottom: 8px;
        }

        .stats-value {
            font-size: 2.2em;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .stats-row {
            display: flex;
            gap: 20px;
        }

        .stats-item {
            flex: 1;
        }

        .stats-item .num {
            font-size: 1.3em;
            font-weight: 700;
        }

        .stats-item .label {
            font-size: 0.75em;
            color: rgba(255,255,255,0.75);
            margin-top: 2px;
        }

        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scrollbar-width: none;
        }

        .app-body::-webkit-scrollbar { display: none; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 1.1em;
            font-weight: 700;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(168, 218, 220, 0.08);
            color: var(--cream-dim);
            border: none;
            font-family: inherit;
        }

        .tab.active {
            background: var(--teal);
            color: white;
        }

        .tab:hover:not(.active) {
            background: rgba(168, 218, 220, 0.15);
        }

        .invoice-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 100px;
        }

        .invoice-card {
            background: var(--deep-navy-light);
            border-radius: 18px;
            padding: 18px;
            border: 1px solid rgba(168, 218, 220, 0.08);
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .invoice-card:hover {
            transform: translateY(-2px);
            border-color: rgba(45, 139, 139, 0.3);
        }

        .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .merchant {
            font-weight: 700;
            font-size: 1em;
            color: var(--cream);
        }

        .amount {
            font-weight: 800;
            font-size: 1.15em;
            color: var(--seafoam);
        }

        .invoice-meta {
            display: flex;
            gap: 12px;
            font-size: 0.8em;
            color: var(--cream-dim);
            margin-bottom: 14px;
        }

        .meta-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .invoice-meta {
            flex-wrap: wrap;
        }

        .invoice-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px 14px;
            border-radius: 12px;
            border: none;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--teal);
            color: white;
        }

        .btn-primary:hover {
            background: var(--teal-light);
        }

        .btn-primary:disabled {
            background: rgba(45, 139, 139, 0.3);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(168, 218, 220, 0.1);
            color: var(--cream);
        }

        .btn-secondary:hover {
            background: rgba(168, 218, 220, 0.18);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
        }

        .status-pending {
            background: rgba(233, 196, 106, 0.15);
            color: var(--warning);
        }

        .status-done {
            background: rgba(76, 175, 125, 0.15);
            color: var(--success);
        }

        .status-winning {
            background: rgba(231, 111, 81, 0.15);
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--cream-dim);
        }

        .empty-state .icon {
            font-size: 3em;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 0.95em;
        }

        .fab {
            position: absolute;
            bottom: 100px;
            right: 24px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--teal), var(--teal-light));
            border: none;
            color: white;
            font-size: 1.8em;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(45, 139, 139, 0.4);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .fab:hover {
            transform: scale(1.08);
        }

        .bottom-nav {
            background: var(--deep-navy);
            border-top: 1px solid rgba(168, 218, 220, 0.1);
            padding: 14px 28px 28px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--cream-dim);
            cursor: pointer;
            transition: color 0.2s;
            font-size: 0.75em;
        }

        .nav-item.active {
            color: var(--teal);
        }

        .nav-item .icon {
            font-size: 1.6em;
        }

        .modal {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 20, 25, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--deep-navy-light);
            width: 100%;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 28px 24px 40px;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
        }

        .modal.show .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 1.25em;
            font-weight: 700;
        }

        .close-btn {
            background: rgba(168, 218, 220, 0.1);
            border: none;
            color: var(--cream);
            width: 36px;
            height: 36px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.2em;
        }

        .upload-zone {
            border: 2px dashed rgba(168, 218, 220, 0.25);
            border-radius: 20px;
            padding: 40px 24px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(168, 218, 220, 0.03);
        }

        .upload-zone:hover {
            border-color: var(--teal);
            background: rgba(45, 139, 139, 0.08);
        }

        .upload-zone .icon {
            font-size: 2.5em;
            margin-bottom: 12px;
        }

        .upload-zone p {
            color: var(--cream);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .upload-zone span {
            font-size: 0.8em;
            color: var(--cream-dim);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 0.85em;
            color: var(--cream-dim);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(168, 218, 220, 0.15);
            background: rgba(168, 218, 220, 0.05);
            color: var(--cream);
            font-size: 1em;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--teal);
        }

        .form-input::placeholder {
            color: rgba(241, 250, 238, 0.35);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: var(--teal);
            color: white;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            font-family: inherit;
        }

        .submit-btn:hover {
            background: var(--teal-light);
        }

        .toast {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--deep-navy-light);
            color: var(--cream);
            padding: 14px 22px;
            border-radius: 14px;
            font-size: 0.9em;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(168, 218, 220, 0.1);
            opacity: 0;
            transition: all 0.3s;
            z-index: 300;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 420px) {
            .phone-frame {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
            body { padding: 0; }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="notch"></div>

        <header class="app-header">
            <div class="header-top">
                <div class="greeting">
                    <h1>下午好，</h1>
                    <p>我的发票</p>
                </div>
                <div class="avatar">U</div>
            </div>
            <div class="stats-card">
                <div class="stats-label">本月累计抽奖金额</div>
                <div class="stats-value">¥<span id="totalAmount">1,247.00</span></div>
                <div class="stats-row">
                    <div class="stats-item">
                        <div class="num" id="invoiceCount">4</div>
                        <div class="label">已录入发票</div>
                    </div>
                    <div class="stats-item">
                        <div class="num" id="drawCount">2</div>
                        <div class="label">已参与抽奖</div>
                    </div>
                    <div class="stats-item">
                        <div class="num" id="winCount">0</div>
                        <div class="label">中奖次数</div>
                    </div>
                </div>
            </div>
        </header>

        <main class="app-body">
            <div class="section-header">
                <h2 class="section-title">发票列表</h2>
            </div>

            <div class="filter-tabs">
                <button class="tab active" data-filter="all">全部</button>
                <button class="tab" data-filter="pending">待抽奖</button>
                <button class="tab" data-filter="done">已抽奖</button>
            </div>

            <div class="invoice-list" id="invoiceList">
                <!-- 发票卡片由 JS 生成 -->
            </div>
        </main>

        <button class="fab" id="addBtn" aria-label="添加发票">+</button>

        <nav class="bottom-nav">
            <div class="nav-item active">
                <span class="icon">📋</span>
                <span>发票</span>
            </div>
            <div class="nav-item">
                <span class="icon">🎁</span>
                <span>抽奖</span>
            </div>
            <div class="nav-item">
                <span class="icon">📊</span>
                <span>统计</span>
            </div>
            <div class="nav-item">
                <span class="icon">⚙️</span>
                <span>设置</span>
            </div>
        </nav>

        <div class="modal" id="uploadModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">录入新发票</h3>
                    <button class="close-btn" id="closeModal">×</button>
                </div>
                <div class="upload-zone" id="uploadZone">
                    <div class="icon">📷</div>
                    <p>拍照或选择图片</p>
                    <span>支持 JPG、PNG、PDF 格式</span>
                </div>
                <div class="form-group">
                    <label class="form-label">商家名称</label>
                    <input type="text" class="form-input" id="merchantInput" placeholder="例如：星巴克咖啡">
                </div>
                <div class="form-group">
                    <label class="form-label">发票金额</label>
                    <input type="number" class="form-input" id="amountInput" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label class="form-label">开票地区</label>
                    <input type="text" class="form-input" id="regionInput" placeholder="例如：广东省">
                </div>
                <button class="submit-btn" id="submitBtn">确认录入</button>
            </div>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script>
        // 初始数据
        let invoices = [
            {
                id: 1,
                merchant: '星巴克咖啡',
                amount: 38.00,
                region: '广东省',
                date: '2026-06-15',
                status: 'pending',
                platform: '支付宝'
            },
            {
                id: 2,
                merchant: '滴滴出行',
                amount: 56.50,
                region: '北京市',
                date: '2026-06-14',
                status: 'done',
                platform: '云闪付'
            },
            {
                id: 3,
                merchant: '盒马鲜生',
                amount: 128.00,
                region: '上海市',
                date: '2026-06-12',
                status: 'pending',
                platform: '京东'
            },
            {
                id: 4,
                merchant: '美团外卖',
                amount: 145.50,
                region: '浙江省',
                date: '2026-06-10',
                status: 'winning',
                platform: '抖音',
                prize: '5元红包'
            }
        ];

        const statusMap = {
            pending: { text: '待抽奖', class: 'status-pending' },
            done: { text: '已抽奖', class: 'status-done' },
            winning: { text: '已中奖', class: 'status-winning' }
        };

        const MIN_DRAW_AMOUNT = 100;

        const PLATFORMS = ['支付宝', '京东', '云闪付', '抖音'];

        function getAvailablePlatforms(platform, amount) {
            if (amount < MIN_DRAW_AMOUNT) return [];
            return PLATFORMS.includes(platform) ? [platform] : [];
        }

        function getRandomPlatform() {
            return PLATFORMS[Math.floor(Math.random() * PLATFORMS.length)];
        }

        function formatMoney(num) {
            return num.toFixed(2);
        }

        function renderInvoices(filter = 'all') {
            const list = document.getElementById('invoiceList');
            const filtered = filter === 'all' ? invoices : invoices.filter(i => i.status === filter);

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <p>暂无${filter === 'pending' ? '待抽奖' : filter === 'done' ? '已抽奖' : ''}发票</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(inv => {
                const availablePlatforms = getAvailablePlatforms(inv.platform, inv.amount);
                const canDraw = inv.status === 'pending' && availablePlatforms.length > 0;
                return `
                <div class="invoice-card">
                    <div class="invoice-header">
                        <div>
                            <div class="merchant">${inv.merchant}</div>
                            <div class="invoice-meta">
                                <span class="meta-item">📍 ${inv.region}</span>
                                <span class="meta-item">📅 ${inv.date}</span>
                                <span class="meta-item">🌐 ${inv.platform}</span>
                                ${availablePlatforms.length > 0 ? `
                                    <span class="meta-item">🎰 可抽平台：${availablePlatforms.join('、')}</span>
                                ` : `
                                    <span class="meta-item">⚠️ 未满 ¥${MIN_DRAW_AMOUNT} 不可抽奖</span>
                                `}
                            </div>
                        </div>
                        <div class="amount">¥${formatMoney(inv.amount)}</div>
                    </div>
                    <div class="invoice-actions">
                        ${canDraw ? `
                            <button class="btn btn-primary" onclick="drawLottery(${inv.id})">
                                <span>🎰</span> 一键抽奖
                            </button>
                        ` : inv.status === 'pending' ? `
                            <span class="status-badge status-pending">不可抽奖</span>
                        ` : `
                            <span class="status-badge ${statusMap[inv.status].class}">
                                ${inv.status === 'winning' ? '🏆' : '✓'} ${statusMap[inv.status].text}${inv.prize ? ' · ' + inv.prize : ''}
                            </span>
                        `}
                        <button class="btn btn-secondary" onclick="showToast('已查询 ' + '${inv.platform}' + ' 结果')">
                            <span>🔍</span> 查结果
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        function updateStats() {
            const total = invoices.reduce((sum, i) => sum + i.amount, 0);
            document.getElementById('totalAmount').textContent = total.toLocaleString('zh-CN', { minimumFractionDigits: 2 });
            document.getElementById('invoiceCount').textContent = invoices.length;
            document.getElementById('drawCount').textContent = invoices.filter(i => i.status !== 'pending').length;
            document.getElementById('winCount').textContent = invoices.filter(i => i.status === 'winning').length;
        }

        function drawLottery(id) {
            const inv = invoices.find(i => i.id === id);
            if (!inv) return;

            if (inv.amount < MIN_DRAW_AMOUNT) {
                showToast('该发票未满 ¥' + MIN_DRAW_AMOUNT + '，不可参与抽奖');
                return;
            }

            // 模拟抽奖结果
            const isWin = Math.random() > 0.7;
            if (isWin) {
                inv.status = 'winning';
                inv.prize = '现金红包';
                showToast('🎉 恭喜中奖！' + inv.merchant + ' 抽奖成功');
            } else {
                inv.status = 'done';
                showToast('✓ 已参与 ' + inv.platform + ' 抽奖');
            }

            updateStats();
            renderInvoices(document.querySelector('.tab.active').dataset.filter);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // Tab 切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderInvoices(tab.dataset.filter);
            });
        });

        // 模态框
        const modal = document.getElementById('uploadModal');
        const addBtn = document.getElementById('addBtn');
        const closeBtn = document.getElementById('closeModal');

        addBtn.addEventListener('click', () => modal.classList.add('show'));
        closeBtn.addEventListener('click', () => modal.classList.remove('show'));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('show');
        });

        // 提交新发票
        document.getElementById('submitBtn').addEventListener('click', () => {
            const merchant = document.getElementById('merchantInput').value.trim();
            const amount = parseFloat(document.getElementById('amountInput').value);
            const region = document.getElementById('regionInput').value.trim();

            if (!merchant || !amount || !region) {
                showToast('请填写完整信息');
                return;
            }

            const newInvoice = {
                id: Date.now(),
                merchant,
                amount,
                region,
                date: new Date().toISOString().split('T')[0],
                status: 'pending',
                platform: getRandomPlatform()
            };

            invoices.unshift(newInvoice);
            updateStats();
            renderInvoices('all');

            // 重置表单
            document.getElementById('merchantInput').value = '';
            document.getElementById('amountInput').value = '';
            document.getElementById('regionInput').value = '';
            modal.classList.remove('show');

            showToast('✓ 发票录入成功');
        });

        // 上传区域点击：模拟 OCR 识别自动填充
        document.getElementById('uploadZone').addEventListener('click', () => {
            showToast('📷 OCR 识别中...');
            document.getElementById('merchantInput').value = '';
            document.getElementById('amountInput').value = '';
            document.getElementById('regionInput').value = '';

            setTimeout(() => {
                const mockData = [
                    { merchant: '京东超市', amount: 158.00, region: '北京市', platform: '京东' },
                    { merchant: '海底捞火锅', amount: 268.00, region: '上海市', platform: '支付宝' },
                    { merchant: '苏宁易购', amount: 89.00, region: '江苏省', platform: '云闪付' },
                    { merchant: '山姆会员店', amount: 399.00, region: '广东省', platform: '抖音' },
                    { merchant: '滴滴出行', amount: 56.50, region: '北京市', platform: '支付宝' }
                ];
                const data = mockData[Math.floor(Math.random() * mockData.length)];
                document.getElementById('merchantInput').value = data.merchant;
                document.getElementById('amountInput').value = data.amount;
                document.getElementById('regionInput').value = data.region;
                showToast('✓ OCR 识别完成，已自动填充');
            }, 1200);
        });

        // 初始化
        updateStats();
        renderInvoices();
    </script>
</body>
</html>
