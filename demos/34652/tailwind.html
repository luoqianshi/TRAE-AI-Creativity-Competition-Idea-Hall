<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随风骑tailwind</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tech: {
                            900: '#0f172a',
                            800: '#1e293b',
                            primary: '#06b6d4',
                            hover: '#0891b2'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* 确保页面占满全屏且无滚动条 */
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        /* 隐藏高德地图的 logo 和版权信息，保持界面干净（可选） */
        .amap-logo, .amap-copyright { display: none !important; }
    </style>
</head>
<body class="flex h-screen w-screen overflow-hidden bg-gray-100">

    <!-- 左侧控制面板 (深色科技风) -->
    <div class="w-80 md:w-96 bg-tech-900 text-white p-6 flex flex-col shadow-2xl z-10 relative">
        <!-- 应用标题 -->
        <div class="flex items-center space-x-3 mb-10 mt-4">
            <!-- 气流/风向 SVG 图标 -->
            <svg class="w-8 h-8 text-tech-primary animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
            <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-wider">
                tailwind
            </h1>
        </div>

        <!-- 输入区域 -->
        <div class="flex-1 space-y-6">
            <div>
                <label for="start-point" class="block text-sm font-medium text-gray-400 mb-2">起点</label>
                <input type="text" id="start-point" placeholder="请输入起点..." 
                    class="w-full bg-tech-800 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-tech-primary transition-all shadow-inner">
            </div>

            <div>
                <label for="end-point" class="block text-sm font-medium text-gray-400 mb-2">终点</label>
                <input type="text" id="end-point" placeholder="请输入终点..." 
                    class="w-full bg-tech-800 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-tech-primary transition-all shadow-inner">
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="mt-6 mb-2">
            <button id="generate-btn" 
                class="w-full bg-tech-primary hover:bg-tech-hover text-white font-bold py-3.5 px-4 rounded-lg shadow-[0_0_20px_rgba(6,182,212,0.5)] transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                生成顺风路线
            </button>
        </div>
        
        <!-- 错误提示区域 -->
        <div id="error-message" class="text-red-400 text-sm hidden mb-2 px-1">
            未能定位到输入地址，请尝试输入更具体的名称（如：西湖文体中心）。
        </div>

        <!-- 路线列表显示区域 -->
        <div class="flex-1 overflow-y-auto mt-2 pr-2 custom-scrollbar">
            <div id="route-list" class="space-y-4">
                <!-- 路线项将在这里动态生成 -->
            </div>
        </div>
    </div>

    <!-- 右侧地图显示区域 -->
    <div id="map-container" class="flex-1 h-full relative bg-gray-200"></div>

    <!-- 核心逻辑脚本 -->
    <script type="text/javascript">
        // ==========================================================
        // 【API 配置区】
        // ==========================================================
        // 1. 高德地图安全密钥
        window._AMapSecurityConfig = { 
            securityJsCode: '0ef58200f28c5421d16f2f081f09d6af',
        };
        // 2. 和风天气 Key
        const WIND_API_KEY = '9120c27a148e49269604bb9a6f913cc6‘
        // ==========================================================
    </script>

    <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=ad879a06c120c8f488e52842e7a0c17c&plugin=AMap.PlaceSearch,AMap.Riding"></script>

    <script>
        // 初始化高德地图
        const map = new AMap.Map('map-container', {
            zoom: 13,                             // 初始缩放级别
            center: [120.15507, 30.274084],       // 默认定位：杭州市中心 (西湖附近)
            mapStyle: 'amap://styles/macaron',    // 地图样式：马卡龙风格
        });

        // 初始化搜索插件，限定在杭州市
        const placeSearch = new AMap.PlaceSearch({
            city: '杭州市',
            citylimit: true
        });

        // 路线颜色数组，用于区分不同路线
        const routeColors = ['#06b6d4', '#8b5cf6', '#ec4899', '#f59e0b', '#6b7280'];
        let ridingInstance = null; // 保存骑行规划实例，以便清理

        // 格式化时间辅助函数
        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            if (h > 0) return `${h}小时${m}分钟`;
            return `${m}分钟`;
        }
        
        // 封装基于 Promise 的地址搜索函数
        function searchLocation(keyword) {
            return new Promise((resolve, reject) => {
                placeSearch.search(keyword, (status, result) => {
                    if (status === 'complete' && result.info === 'OK' && result.poiList && result.poiList.pois.length > 0) {
                        // 返回最匹配的第一个地点的经纬度
                        resolve(result.poiList.pois[0].location);
                    } else {
                        reject(new Error(`无法搜索到：${keyword}`));
                    }
                });
            });
        }

        // 封装获取路线中间点天气的函数
        async function fetchRouteWeather(lng, lat) {
            try {
                // 和风天气 API 坐标格式为 "经度,纬度"
                const location = `${lng.toFixed(2)},${lat.toFixed(2)}`;
                const url = `https://devapi.qweather.com/v7/weather/now?location=${location}&key=${WIND_API_KEY}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.code === '200' && data.now) {
                    return data.now;
                }
                return null;
            } catch (error) {
                console.error("获取天气数据失败:", error);
                return null;
            }
        }

        // 绑定“生成顺风路线”按钮事件
        document.getElementById('generate-btn').addEventListener('click', async () => {
            const startName = document.getElementById('start-point').value.trim();
            const endName = document.getElementById('end-point').value.trim();
            const btn = document.getElementById('generate-btn');
            const errorMsg = document.getElementById('error-message');
            const routeListContainer = document.getElementById('route-list');

            // 隐藏之前的错误信息
            errorMsg.classList.add('hidden');

            if (!startName || !endName) {
                errorMsg.innerText = '请先输入起点和终点！';
                errorMsg.classList.remove('hidden');
                return;
            }

            // 更新状态，清空残留数据
            btn.innerText = '正在检索地址...';
            btn.disabled = true;
            routeListContainer.innerHTML = '';
            
            if (ridingInstance) {
                ridingInstance.clear();
            }
            map.clearMap();

            try {
                // 并发搜索起点和终点坐标
                const [startLngLat, endLngLat] = await Promise.all([
                    searchLocation(startName),
                    searchLocation(endName)
                ]);

                btn.innerText = '正在规划路线...';

                // 调用骑行路线规划
                ridingInstance = new AMap.Riding({
                    map: null, 
                    panel: "", 
                    policy: 1, 
                });

                ridingInstance.search(startLngLat, endLngLat, async (status, result) => {
                    btn.innerText = '生成顺风路线';
                    btn.disabled = false;

                    if (status === 'complete' && result.routes && result.routes.length > 0) {
                        // 绘制起点和终点标记
                        new AMap.Marker({ position: startLngLat, map: map, title: '起点' });
                        new AMap.Marker({ position: endLngLat, map: map, title: '终点' });

                        // 使用 for...of 替代 forEach，以便在循环中使用 await
                        for (let index = 0; index < result.routes.length; index++) {
                            const route = result.routes[index];
                            const color = routeColors[index % routeColors.length];
                            
                            // 1. 计算路线中间点的经纬度
                            // 提取路线所有的点
                            const allPoints = [];
                            route.rides.forEach(ride => {
                                ride.path.forEach(p => {
                                    allPoints.push(p);
                                });
                            });
                            
                            // 获取中间那个点的坐标
                            let weatherInfoHtml = '';
                            if (allPoints.length > 0) {
                                const midIndex = Math.floor(allPoints.length / 2);
                                const midPoint = allPoints[midIndex];
                                
                                // 获取中间点的天气
                                const weatherData = await fetchRouteWeather(midPoint.lng, midPoint.lat);
                                if (weatherData) {
                                    weatherInfoHtml = `
                                        <p class="mt-2 pt-2 border-t border-gray-700 flex items-center text-tech-primary">
                                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                            当前风况：${weatherData.windDir} ${weatherData.windScale} 级（风向角: ${weatherData.wind360}°）
                                        </p>
                                    `;
                                }
                            }
                            
                            // 2. 渲染左侧面板列表
                            const distanceKm = (route.distance / 1000).toFixed(1);
                            const timeStr = formatTime(route.time);
                            
                            const routeItem = document.createElement('div');
                            routeItem.className = 'bg-tech-800 p-4 rounded-lg border border-gray-700 shadow-md hover:border-gray-500 transition-colors cursor-pointer';
                            routeItem.innerHTML = `
                                <div class="flex items-center justify-between mb-2">
                                    <div class="flex items-center space-x-2">
                                        <div class="w-3 h-3 rounded-full" style="background-color: ${color};"></div>
                                        <span class="font-bold text-white">路线 ${index + 1}</span>
                                    </div>
                                </div>
                                <div class="text-gray-400 text-sm space-y-1">
                                    <p>骑行距离：<span class="text-white font-medium">${distanceKm} 公里</span></p>
                                    <p>预计耗时：<span class="text-white font-medium">${timeStr}</span></p>
                                    ${weatherInfoHtml}
                                </div>
                            `;
                            routeListContainer.appendChild(routeItem);

                            // 3. 在地图上绘制多条路线
                            const polyline = new AMap.Polyline({
                                path: allPoints,
                                isOutline: true,
                                outlineColor: '#ffeeff',
                                borderWeight: 2,
                                strokeColor: color,
                                strokeOpacity: 0.8,
                                strokeWeight: 6,
                                strokeStyle: "solid",
                                lineJoin: 'round',
                                lineCap: 'round',
                                zIndex: 50 - index, 
                                map: map
                            });
                        }
                        
                        // 调整地图视野以包含所有路线
                        map.setFitView();
                        
                    } else {
                        errorMsg.innerText = '未找到合适的骑行路线，可能距离过远。';
                        errorMsg.classList.remove('hidden');
                    }
                });

            } catch (error) {
                // 捕获搜索失败的异常
                btn.innerText = '生成顺风路线';
                btn.disabled = false;
                errorMsg.innerText = '未能定位到输入地址，请尝试输入更具体的名称（如：西湖文体中心）。';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
