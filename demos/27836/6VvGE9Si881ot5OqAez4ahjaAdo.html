<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">俄罗斯方块</h1>
        
        <div class="game-main">
            <!-- 游戏画布 -->
            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="300" height="600"></canvas>
                <div id="gameOverlay" class="overlay">
                    <div class="overlay-content">
                        <h2 id="overlayTitle">俄罗斯方块</h2>
                        <p id="overlayText">点击开始游戏</p>
                        <button id="startBtn" class="btn btn-primary">开始游戏</button>
                    </div>
                </div>
            </div>
            
            <!-- 信息面板 -->
            <div class="info-panel">
                <!-- 下一个方块预览 -->
                <div class="preview-box">
                    <h3>下一个</h3>
                    <canvas id="previewCanvas" width="120" height="120"></canvas>
                </div>
                
                <!-- 分数信息 -->
                <div class="score-box">
                    <div class="score-item">
                        <span class="label">分数</span>
                        <span class="value" id="score">0</span>
                    </div>
                    <div class="score-item">
                        <span class="label">等级</span>
                        <span class="value" id="level">1</span>
                    </div>
                    <div class="score-item">
                        <span class="label">行数</span>
                        <span class="value" id="lines">0</span>
                    </div>
                    <div class="score-item">
                        <span class="label">最高分</span>
                        <span class="value" id="highScore">0</span>
                    </div>
                </div>
                
                <!-- 控制按钮 -->
                <div class="controls">
                    <button id="pauseBtn" class="btn btn-secondary">暂停</button>
                    <button id="restartBtn" class="btn btn-danger">重新开始</button>
                </div>
                
                <!-- 主题选择 -->
                <div class="theme-selector">
                    <h3>主题</h3>
                    <div class="theme-buttons">
                        <button class="theme-btn active" data-theme="classic">经典</button>
                        <button class="theme-btn" data-theme="modern">现代</button>
                        <button class="theme-btn" data-theme="neon">霓虹</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 移动端控制按钮 -->
        <div class="mobile-controls">
            <div class="control-row">
                <button class="mobile-btn" id="btnRotate">↑</button>
            </div>
            <div class="control-row">
                <button class="mobile-btn" id="btnLeft">←</button>
                <button class="mobile-btn" id="btnDown">↓</button>
                <button class="mobile-btn" id="btnRight">→</button>
            </div>
            <div class="control-row">
                <button class="mobile-btn wide-btn" id="btnDrop">快速下落</button>
            </div>
        </div>
        
        <!-- 操作说明 -->
        <div class="instructions">
            <h3>操作说明</h3>
            <ul>
                <li>← → 左右移动</li>
                <li>↑ 旋转方块</li>
                <li>↓ 加速下落</li>
                <li>空格 直接落底</li>
                <li>P 暂停/继续</li>
            </ul>
        </div>
    </div>
    
    <!-- 音效文件 -->
    <audio id="moveSound" preload="auto" src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2teleHoX2K3Qm9sdlo=">
    <audio id="rotateSound" preload="auto" src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2teleHoX2K3Qm9sdlo=">
    <audio id="clearSound" preload="auto" src="data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQGAACAf4qFfV1fdJivrJBhNjVgodDbq2EcBj+a2teleHoX2K3Qm9sdlo=">
    <audio id="dropSound" preload="auto" src="data:audio/wav;base64,UklGRmQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YRIHAACAfYqFfV1fdJivrJBhNjVgodDbq2EcBj+a2teleHoX2K3Qm9sdlo=">
    <audio id="gameOverSound" preload="auto" src="data:audio/wav;base64,UklGRkYAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQkGAACAf4qFfV1fdJivrJBhNjVgodDbq2EcBj+a2teleHoX2K3Qm9sdlo=">
    
    <script src="game.js"></script>
</body>
</html>
