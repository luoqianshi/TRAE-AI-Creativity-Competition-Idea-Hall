<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="邻里通（NeighborAI），面向一刻钟便民生活圈的智能社区服务助手。" />
  <title>邻里通 NeighborAI - 单文件演示版</title>
  <style>
/* =========================
   邻里通（NeighborAI）样式文件
   设计目标：现代科技感、毛玻璃卡片、柔和阴影、PC 优先并兼容移动端
   ========================= */

/* 全局变量：集中管理颜色、阴影和圆角，便于后续统一调整视觉风格 */
:root {
  --bg: #eef5ff;
  --bg-deep: #dbeafe;
  --text: #0f172a;
  --muted: #64748b;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --primary-soft: rgba(37, 99, 235, 0.1);
  --green: #10b981;
  --green-soft: rgba(16, 185, 129, 0.12);
  --orange: #f59e0b;
  --danger: #ef4444;
  --card: rgba(255, 255, 255, 0.78);
  --card-strong: rgba(255, 255, 255, 0.92);
  --border: rgba(148, 163, 184, 0.24);
  --shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
  --shadow-soft: 0 14px 36px rgba(15, 23, 42, 0.1);
  --radius-xl: 28px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
}

/* 基础重置：保证不同浏览器下布局和字体表现更一致 */
* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  min-height: 100vh;
  margin: 0;
  color: var(--text);
  font-family: "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  background:
    radial-gradient(circle at top left, rgba(37, 99, 235, 0.2), transparent 36%),
    linear-gradient(135deg, var(--bg), #f8fbff 46%, var(--bg-deep));
  overflow-x: hidden;
}

/* 确保 HTML hidden 属性拥有最高优先级，避免被组件样式覆盖 */
[hidden] {
  display: none !important;
}

button,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

/* 背景装饰：让页面在无图片资源的情况下也有丰富层次 */
.page-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
}

.glow {
  position: absolute;
  width: 360px;
  height: 360px;
  border-radius: 999px;
  filter: blur(12px);
  opacity: 0.34;
}

.glow-blue {
  top: 6%;
  left: 4%;
  background: #60a5fa;
}

.glow-green {
  right: 8%;
  bottom: 4%;
  background: #6ee7b7;
}

.grid-mask {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(15, 23, 42, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15, 23, 42, 0.05) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(circle at center, black, transparent 72%);
  opacity: 0.36;
}

/* 应用外壳：限制最大宽度，保证大屏不散、小屏不挤 */
.app-shell {
  width: min(1480px, calc(100% - 40px));
  min-height: 100vh;
  margin: 0 auto;
  padding: 24px 0;
}

/* 顶部导航栏：承载品牌信息和运行状态 */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-logo {
  display: grid;
  width: 52px;
  height: 52px;
  place-items: center;
  color: #ffffff;
  font-size: 24px;
  font-weight: 800;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--primary), #14b8a6);
  box-shadow: 0 16px 32px rgba(37, 99, 235, 0.28);
}

.brand h1,
.brand p,
.welcome-card h2,
.welcome-card p,
.map-header h2,
.section-title h3 {
  margin: 0;
}

.brand h1 {
  font-size: 24px;
  letter-spacing: 0.02em;
}

.brand p {
  margin-top: 4px;
  color: var(--muted);
  font-size: 14px;
}

.status-pills {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 10px;
}

.pill,
.intent-tag,
.result-count {
  display: inline-flex;
  align-items: center;
  min-height: 34px;
  padding: 7px 12px;
  color: var(--primary-dark);
  font-size: 13px;
  font-weight: 700;
  border: 1px solid rgba(37, 99, 235, 0.15);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.72);
  box-shadow: var(--shadow-soft);
}

.pill-soft {
  color: #047857;
  border-color: rgba(16, 185, 129, 0.2);
  background: rgba(236, 253, 245, 0.82);
}

/* 双栏主布局：左聊天 40%，右地图 60% */
.main-layout {
  display: grid;
  grid-template-columns: minmax(380px, 0.42fr) minmax(520px, 0.58fr);
  gap: 20px;
  height: calc(100vh - 116px);
  min-height: 680px;
}

.glass-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  background: var(--card);
  box-shadow: var(--shadow);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
}

/* 左侧聊天面板 */
.chat-panel {
  display: flex;
  min-height: 0;
  flex-direction: column;
  padding: 18px;
}

.welcome-card {
  padding: 22px;
  border: 1px solid rgba(37, 99, 235, 0.12);
  border-radius: var(--radius-lg);
  background:
    linear-gradient(135deg, rgba(37, 99, 235, 0.12), rgba(20, 184, 166, 0.08)),
    rgba(255, 255, 255, 0.62);
}

.eyebrow {
  display: inline-flex;
  margin-bottom: 10px;
  color: var(--primary-dark);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.welcome-card h2 {
  font-size: 24px;
  line-height: 1.28;
}

.welcome-card p {
  margin-top: 12px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

.quick-section {
  margin-top: 16px;
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.section-title h3 {
  font-size: 16px;
}

.text-button {
  color: var(--primary);
  font-size: 13px;
  font-weight: 700;
  border: 0;
  background: transparent;
}

.text-button:hover {
  color: var(--primary-dark);
}

.quick-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.quick-button {
  min-height: 44px;
  padding: 10px 12px;
  color: #1e293b;
  text-align: left;
  border: 1px solid rgba(148, 163, 184, 0.24);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.7);
  transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}

.quick-button:hover {
  border-color: rgba(37, 99, 235, 0.35);
  box-shadow: 0 12px 28px rgba(37, 99, 235, 0.13);
  transform: translateY(-2px);
}

/* 位置信息卡片：定位成功后展示用户当前坐标或反查地址 */
.location-info-card {
  display: grid;
  gap: 8px;
  margin-top: 14px;
  padding: 14px 16px;
  border: 1px solid rgba(16, 185, 129, 0.22);
  border-radius: var(--radius-md);
  background:
    linear-gradient(135deg, rgba(16, 185, 129, 0.13), rgba(37, 99, 235, 0.08)),
    rgba(255, 255, 255, 0.74);
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.07);
}

.location-info-card > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.location-label {
  color: #047857;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.04em;
}

.location-info-card strong {
  color: #0f172a;
  font-size: 14px;
}

.location-info-card p {
  margin: 0;
  color: #475569;
  font-size: 13px;
  line-height: 1.6;
}

.chat-history {
  display: flex;
  min-height: 0;
  flex: 1;
  flex-direction: column;
  gap: 14px;
  margin: 16px -4px 16px 0;
  padding-right: 6px;
  overflow-y: auto;
  scrollbar-color: rgba(37, 99, 235, 0.35) transparent;
}

.message {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.user-message {
  flex-direction: row-reverse;
}

.avatar {
  display: grid;
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  place-items: center;
  color: #ffffff;
  font-size: 12px;
  font-weight: 800;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), #06b6d4);
}

.user-message .avatar {
  background: linear-gradient(135deg, #0f172a, #475569);
}

.bubble {
  max-width: min(86%, 560px);
  padding: 12px 14px;
  color: #1e293b;
  line-height: 1.65;
  border: 1px solid rgba(148, 163, 184, 0.18);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.84);
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
}

.user-message .bubble {
  color: #ffffff;
  border-color: transparent;
  background: linear-gradient(135deg, var(--primary), #14b8a6);
}

.bubble p {
  margin: 0;
}

.bubble ul {
  margin: 8px 0 0;
  padding-left: 18px;
}

.bubble li {
  margin: 4px 0;
}

.input-card {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  padding: 12px;
  border: 1px solid rgba(148, 163, 184, 0.22);
  border-radius: var(--radius-lg);
  background: var(--card-strong);
}

#userInput {
  width: 100%;
  min-height: 54px;
  max-height: 150px;
  padding: 12px 14px;
  color: var(--text);
  resize: vertical;
  border: 0;
  outline: none;
  border-radius: var(--radius-md);
  background: rgba(241, 245, 249, 0.76);
}

.send-button {
  min-width: 92px;
  padding: 0 18px;
  color: #ffffff;
  font-weight: 800;
  border: 0;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--primary), #14b8a6);
  box-shadow: 0 14px 28px rgba(37, 99, 235, 0.25);
  transition: transform 0.18s ease, opacity 0.18s ease;
}

.send-button:hover {
  transform: translateY(-1px);
}

.send-button:disabled {
  cursor: not-allowed;
  opacity: 0.56;
  transform: none;
}

/* 右侧地图面板 */
.map-panel {
  display: grid;
  min-height: 0;
  grid-template-rows: auto minmax(360px, 1fr) auto;
  gap: 16px;
  padding: 18px;
}

.map-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.map-header h2 {
  font-size: 24px;
}

.result-count {
  color: #047857;
  border-color: rgba(16, 185, 129, 0.2);
  background: rgba(236, 253, 245, 0.82);
}

.map-wrap {
  position: relative;
  min-height: 360px;
  overflow: hidden;
  border: 1px solid rgba(148, 163, 184, 0.24);
  border-radius: var(--radius-xl);
  background: #dbeafe;
}

.map-canvas,
.mock-map {
  position: absolute;
  inset: 0;
}

/* 无高德 Key 时显示的演示地图，帮助用户打开即可看到完整流程 */
.mock-map {
  display: grid;
  place-items: center;
  background:
    linear-gradient(90deg, rgba(37, 99, 235, 0.12) 1px, transparent 1px),
    linear-gradient(rgba(37, 99, 235, 0.12) 1px, transparent 1px),
    radial-gradient(circle at center, #f8fbff 0, #dbeafe 62%, #bfdbfe 100%);
  background-size: 56px 56px, 56px 56px, auto;
}

.mock-user {
  position: relative;
  z-index: 2;
  padding: 10px 14px;
  color: #ffffff;
  font-size: 13px;
  font-weight: 800;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--primary), #14b8a6);
  box-shadow: 0 0 0 12px rgba(37, 99, 235, 0.12), 0 18px 40px rgba(37, 99, 235, 0.3);
}

.mock-marker {
  position: absolute;
  z-index: 3;
  transform: translate(-50%, -50%);
}

.mock-marker button {
  width: 34px;
  height: 34px;
  color: #ffffff;
  font-weight: 800;
  border: 3px solid #ffffff;
  border-radius: 999px;
  background: var(--danger);
  box-shadow: 0 10px 26px rgba(239, 68, 68, 0.26);
}

.mock-marker span {
  position: absolute;
  top: 40px;
  left: 50%;
  width: max-content;
  max-width: 160px;
  padding: 6px 9px;
  color: #0f172a;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid rgba(148, 163, 184, 0.2);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: var(--shadow-soft);
  transform: translateX(-50%);
}

.poi-list-wrap {
  min-height: 190px;
  padding: 16px;
  border: 1px solid rgba(148, 163, 184, 0.18);
  border-radius: var(--radius-lg);
  background: rgba(255, 255, 255, 0.62);
}

.poi-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  max-height: 220px;
  overflow-y: auto;
  padding-right: 4px;
}

.poi-card {
  display: grid;
  gap: 8px;
  padding: 14px;
  border: 1px solid rgba(148, 163, 184, 0.22);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.84);
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.06);
}

.poi-card strong {
  color: #0f172a;
}

.poi-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.poi-meta span {
  padding: 4px 8px;
  color: #334155;
  font-size: 12px;
  border-radius: 999px;
  background: rgba(226, 232, 240, 0.82);
}

.poi-address {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.55;
}

.empty-state {
  display: grid;
  grid-column: 1 / -1;
  min-height: 118px;
  place-items: center;
  color: var(--muted);
  text-align: center;
  border: 1px dashed rgba(148, 163, 184, 0.42);
  border-radius: 16px;
  background: rgba(248, 250, 252, 0.66);
}

.empty-state strong {
  color: #334155;
}

.loading-dot::after {
  display: inline-block;
  width: 1.2em;
  content: "";
  animation: dots 1.2s steps(4, end) infinite;
}

@keyframes dots {
  0%,
  20% {
    content: "";
  }
  40% {
    content: ".";
  }
  60% {
    content: "..";
  }
  80%,
  100% {
    content: "...";
  }
}

/* 中等屏幕：改为上下布局，地图仍保持足够高度 */
@media (max-width: 1120px) {
  .app-shell {
    width: min(100% - 28px, 980px);
  }

  .main-layout {
    grid-template-columns: 1fr;
    height: auto;
  }

  .chat-panel,
  .map-panel {
    min-height: 680px;
  }
}

/* 移动端：压缩间距，快捷按钮和推荐卡片改为单列 */
@media (max-width: 720px) {
  .app-shell {
    width: min(100% - 20px, 620px);
    padding: 14px 0;
  }

  .topbar,
  .map-header,
  .section-title {
    align-items: flex-start;
    flex-direction: column;
  }

  .status-pills {
    justify-content: flex-start;
  }

  .main-layout {
    gap: 14px;
  }

  .chat-panel,
  .map-panel {
    padding: 12px;
    border-radius: 22px;
  }

  .welcome-card h2,
  .map-header h2 {
    font-size: 21px;
  }

  .quick-grid,
  .poi-list {
    grid-template-columns: 1fr;
  }

  .input-card {
    grid-template-columns: 1fr;
  }

  .send-button {
    min-height: 48px;
  }

  .map-panel {
    grid-template-rows: auto 420px auto;
  }
}

</style>
</head>
<body>
  <!-- 背景装饰层：用于制造现代科技感和毛玻璃视觉氛围 -->
  <div class="page-bg" aria-hidden="true">
    <span class="glow glow-blue"></span>
    <span class="glow glow-green"></span>
    <span class="grid-mask"></span>
  </div>

  <div class="app-shell">
    <!-- 顶部导航栏：展示项目名称、定位状态和运行模式 -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">N</div>
        <div>
          <h1>邻里通</h1>
          <p>NeighborAI · 一刻钟便民生活圈助手</p>
        </div>
      </div>

      <div class="status-pills">
        <span id="locationStatus" class="pill">定位待授权</span>
        <span id="serviceStatus" class="pill pill-soft">演示模式</span>
      </div>
    </header>

    <!-- 主体区域：左侧聊天决策区，右侧地图展示区 -->
    <main class="main-layout">
      <section class="chat-panel glass-card" aria-label="AI 聊天区域">
        <div class="welcome-card">
          <span class="eyebrow">AI 社区生活决策助手</span>
          <h2>告诉我你的需求，我帮你找附近合适的生活服务。</h2>
          <p>
            例如买药、跑步、打印、修手机、夜宵、亲子活动等，系统会理解你的意图，
            结合距离和服务类型给出推荐，并在地图上标出位置。
          </p>
        </div>

        <!-- 快捷问题按钮：点击后自动发送问题 -->
        <div class="quick-section">
          <div class="section-title">
            <h3>推荐问题</h3>
            <button id="locateButton" class="text-button" type="button">重新定位</button>
          </div>
          <div id="quickQuestions" class="quick-grid"></div>
        </div>

        <!-- 位置信息卡片：浏览器定位成功后展示经纬度；接入高德后可展示反查地址 -->
        <div id="locationInfo" class="location-info-card" hidden>
          <div>
            <span class="location-label">当前位置</span>
            <strong id="locationTitle">定位成功</strong>
          </div>
          <p id="locationDetail">正在读取位置信息...</p>
        </div>

        <!-- 对话历史：用于呈现用户问题、系统状态和 AI 推荐结果 -->
        <div id="chatHistory" class="chat-history" aria-live="polite">
          <article class="message assistant-message">
            <div class="avatar">AI</div>
            <div class="bubble">
              <p>你好，我是邻里通。你可以问我“附近哪里可以买药？”或点击上方快捷问题开始。</p>
            </div>
          </article>
        </div>

        <!-- 输入区域：用户可输入自然语言需求 -->
        <form id="chatForm" class="input-card">
          <textarea
            id="userInput"
            rows="2"
            placeholder="请输入你的需求，例如：我发烧了，附近哪里可以买药？"
            aria-label="输入你的社区生活需求"
          ></textarea>
          <button id="sendButton" class="send-button" type="submit">
            <span>发送</span>
          </button>
        </form>
      </section>

      <section class="map-panel glass-card" aria-label="地图展示区域">
        <div class="map-header">
          <div>
            <span class="eyebrow">地图标注</span>
            <h2>附近推荐地点</h2>
          </div>
          <div id="resultCount" class="result-count">暂无结果</div>
        </div>

        <!-- 高德地图容器：有 Key 时显示真实地图，无 Key 时显示演示地图 -->
        <div class="map-wrap">
          <div id="map" class="map-canvas"></div>
          <div id="mockMap" class="mock-map" hidden>
            <div class="mock-user">你的位置</div>
            <div id="mockMarkers" class="mock-markers"></div>
          </div>
        </div>

        <!-- 推荐列表：与地图 Marker 同步展示 -->
        <div class="poi-list-wrap">
          <div class="section-title">
            <h3>推荐列表</h3>
            <span id="intentTag" class="intent-tag">等待提问</span>
          </div>
          <div id="poiList" class="poi-list">
            <div class="empty-state">
              <strong>还没有推荐结果</strong>
              <span>发送一个生活需求后，这里会展示附近地点。</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 配置必须先加载，业务脚本会从 window.NEIGHBOR_AI_CONFIG 中读取配置 -->
  <script>
/**
 * 邻里通（NeighborAI）前端配置文件
 *
 * 使用方式：
 * 1. 这是纯前端 Demo 配置，不依赖后端。

 */
window.NEIGHBOR_AI_CONFIG = {
  /**
   * 是否启用后端。
   * 纯前端 Demo 固定为 false。
   */
  USE_BACKEND: false,

  /**
   * 高德地图 JS API Key。
   * 纯前端 Demo 可以不填，不填时自动使用演示地图。
   */
  AMAP_JS_KEY: "",

  /**
   * 高德地图安全密钥。
   * 纯前端 Demo 可以不填。
   */
  AMAP_SECURITY_CODE: "",

  /**
   * 后端服务状态。
   * 纯前端 Demo 固定为关闭。
   */
  backend: {

    hasDeepSeek: false,
    hasAmapWebService: false,
    hasAmapJs: false
  },

  /**

   * 当用户拒绝定位或定位失败时，用于地图初始展示和演示数据生成。
   */
  DEFAULT_CITY: "北京",

  /**
   * 默认坐标。
   * 高德地图坐标顺序为 [经度, 纬度]。
   */
  DEFAULT_POSITION: [116.397428, 39.90923],

  /**
   * POI 搜索半径，单位为米。

  MAX_RESULTS: 6

  </script>
  <script>
/**
 * 邻里通（NeighborAI）核心脚本
 *
 * 功能覆盖：
 * 1. 文本聊天输入与快捷问题发送
 * 2. 浏览器 Geolocation API 定位
 * 3. DeepSeek 意图识别与自然语言推荐
 * 4. 高德地图 JS API POI 搜索与 Marker 展示
 * 5. 无 API Key 时自动启用本地演示数据，保证页面打开即可体验完整流程
 */

/* =========================
   配置与全局状态
   ========================= */

// 读取 config.js 中的配置；如果配置文件未加载，也提供安全默认值，避免脚本报错。
const CONFIG = window.NEIGHBOR_AI_CONFIG || {
  USE_BACKEND: false,
  AMAP_JS_KEY: "",
  AMAP_SECURITY_CODE: "",
  backend: {
    enabled: false,
    hasDeepSeek: false,
    hasAmapWebService: false,
    hasAmapJs: false
  },
  DEFAULT_CITY: "北京",
  DEFAULT_POSITION: [116.397428, 39.90923],
  SEARCH_RADIUS: 3000,
  MAX_RESULTS: 6
};

// 页面运行状态集中保存，便于各函数共享位置、地图和 Marker 数据。
const state = {
  map: null,
  amapReady: false,
  currentPosition: null,
  hasUserLocation: false,
  userMarker: null,
  poiMarkers: [],
  activeInfoWindow: null,
  isSending: false
};

// 常用 DOM 元素统一缓存，减少重复查询。
const dom = {
  locationStatus: document.querySelector("#locationStatus"),
  serviceStatus: document.querySelector("#serviceStatus"),
  locationInfo: document.querySelector("#locationInfo"),
  locationTitle: document.querySelector("#locationTitle"),
  locationDetail: document.querySelector("#locationDetail"),
  locateButton: document.querySelector("#locateButton"),
  quickQuestions: document.querySelector("#quickQuestions"),
  chatHistory: document.querySelector("#chatHistory"),
  chatForm: document.querySelector("#chatForm"),
  userInput: document.querySelector("#userInput"),
  sendButton: document.querySelector("#sendButton"),
  map: document.querySelector("#map"),
  mockMap: document.querySelector("#mockMap"),
  mockMarkers: document.querySelector("#mockMarkers"),
  resultCount: document.querySelector("#resultCount"),
  poiList: document.querySelector("#poiList"),
  intentTag: document.querySelector("#intentTag")
};

// 首页推荐问题，点击后会自动写入并发送。
const QUICK_QUESTIONS = [
  "附近哪里可以买药？",
  "附近哪里适合跑步？",
  "附近哪里能打印资料？",
  "附近哪里能修手机？",
  "附近哪里能吃夜宵？",
  "附近哪里适合带孩子玩？"
];

// 本地意图规则：当没有 DeepSeek Key 或接口失败时使用，保证 MVP 流程可稳定演示。
const LOCAL_INTENT_RULES = [
  { words: ["药", "发烧", "感冒", "退烧", "买药", "药店"], intent: "购药", keyword: "药店" },
  { words: ["跑步", "运动", "健身", "散步", "公园"], intent: "运动", keyword: "公园" },
  { words: ["打印", "复印", "资料", "证件照"], intent: "打印", keyword: "打印店" },
  { words: ["修手机", "手机坏", "换屏", "维修"], intent: "手机维修", keyword: "手机维修" },
  { words: ["夜宵", "吃饭", "宵夜", "烧烤", "小吃"], intent: "夜宵", keyword: "餐饮" },
  { words: ["孩子", "儿童", "亲子", "带娃", "游乐"], intent: "亲子活动", keyword: "儿童乐园" },
  { words: ["宠物", "疫苗", "猫", "狗"], intent: "宠物服务", keyword: "宠物医院" }
];

/* =========================
   初始化
   ========================= */

// 页面加载完成后初始化快捷按钮、地图和定位。
document.addEventListener("DOMContentLoaded", () => {
  renderQuickQuestions();
  bindEvents();
  updateServiceStatus();
  initMap();
  requestUserLocation();
});

// 绑定表单、定位按钮和键盘快捷键。
function bindEvents() {
  dom.chatForm.addEventListener("submit", event => {
    event.preventDefault();
    handleSend(dom.userInput.value.trim());
  });

  dom.locateButton.addEventListener("click", () => {
    requestUserLocation(true);
  });

  dom.userInput.addEventListener("keydown", event => {
    // Enter 发送，Shift + Enter 换行，符合聊天产品常见体验。
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      dom.chatForm.requestSubmit();
    }
  });
}

// 渲染快捷问题按钮。
function renderQuickQuestions() {
  dom.quickQuestions.innerHTML = QUICK_QUESTIONS.map(question => `
    <button class="quick-button" type="button" data-question="${escapeHtml(question)}">
      ${escapeHtml(question)}
    </button>
  `).join("");

  dom.quickQuestions.querySelectorAll(".quick-button").forEach(button => {
    button.addEventListener("click", () => {
      handleSend(button.dataset.question);
    });
  });
}

// 根据 Key 填写情况展示当前服务模式。
function updateServiceStatus() {
  const hasAmap = Boolean(CONFIG.backend?.hasAmapJs || CONFIG.AMAP_JS_KEY);

  if (hasAmap) {
    dom.serviceStatus.textContent = "前端地图演示";
  } else {
    dom.serviceStatus.textContent = "前端演示模式";
  }
}

/* =========================
   地图与定位
   ========================= */

// 初始化地图：有高德 Key 时加载真实地图，否则显示本地演示地图。
function initMap() {
  if (!CONFIG.AMAP_JS_KEY) {
    enableMockMap("未配置高德 Key，已启用演示地图");
    return;
  }

  if (CONFIG.AMAP_SECURITY_CODE) {
    window._AMapSecurityConfig = {
      securityJsCode: CONFIG.AMAP_SECURITY_CODE
    };
  }

  loadAmapScript()
    .then(() => {
      state.amapReady = true;
      state.map = new AMap.Map("map", {
        zoom: 15,
        center: CONFIG.DEFAULT_POSITION,
        viewMode: "2D",
        mapStyle: "amap://styles/whitesmoke"
      });
      dom.mockMap.hidden = true;
      dom.map.hidden = false;
      if (state.currentPosition) {
        setUserPosition([state.currentPosition.lng, state.currentPosition.lat], state.hasUserLocation ? "定位成功" : "默认位置", state.hasUserLocation);
      } else {
        setUserPosition(CONFIG.DEFAULT_POSITION, "默认位置");
      }
    })
    .catch(() => {
      enableMockMap("地图加载失败，已启用演示地图");
    });
}

// 动态加载高德地图 JS API，避免没有 Key 时页面出现无意义请求。
function loadAmapScript() {
  return new Promise((resolve, reject) => {
    if (window.AMap) {
      resolve();
      return;
    }

    const script = document.createElement("script");
    script.src = `https://webapi.amap.com/maps?v=2.0&key=${encodeURIComponent(CONFIG.AMAP_JS_KEY)}&plugin=AMap.PlaceSearch,AMap.Geocoder`;
    script.async = true;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

// 启用演示地图，并记录提示信息。
function enableMockMap(message) {
  state.amapReady = false;
  dom.map.hidden = true;
  dom.mockMap.hidden = false;
  state.currentPosition = {
    lng: CONFIG.DEFAULT_POSITION[0],
    lat: CONFIG.DEFAULT_POSITION[1]
  };
  dom.locationStatus.textContent = message;
}

// 请求浏览器定位；失败时保留默认位置，不阻断演示流程。
function requestUserLocation(isManual = false) {
  if (!navigator.geolocation) {
    dom.locationStatus.textContent = "浏览器不支持定位";
    setUserPosition(CONFIG.DEFAULT_POSITION, "默认位置");
    return;
  }

  dom.locationStatus.textContent = isManual ? "正在重新定位..." : "正在获取定位...";

  navigator.geolocation.getCurrentPosition(
    position => {
      const lngLat = [position.coords.longitude, position.coords.latitude];
      setUserPosition(lngLat, "定位成功", true);
    },
    () => {
      dom.locationStatus.textContent = "定位失败，使用默认位置";
      setUserPosition(CONFIG.DEFAULT_POSITION, "默认位置");
    },
    {
      enableHighAccuracy: true,
      timeout: 8000,
      maximumAge: 30000
    }
  );
}

// 设置用户位置，并同步更新真实地图或演示地图。
function setUserPosition(lngLat, label, shouldShowLocationInfo = false) {
  state.currentPosition = {
    lng: Number(lngLat[0]),
    lat: Number(lngLat[1])
  };
  state.hasUserLocation = shouldShowLocationInfo || state.hasUserLocation;
  dom.locationStatus.textContent = label;

  if (shouldShowLocationInfo) {
    renderLocationInfo();
  }

  if (state.amapReady && state.map) {
    const position = [state.currentPosition.lng, state.currentPosition.lat];
    state.map.setCenter(position);

    if (!state.userMarker) {
      state.userMarker = new AMap.Marker({
        position,
        title: "你的位置",
        anchor: "center",
        content: "<div style='padding:8px 12px;color:#fff;font-weight:800;border-radius:999px;background:linear-gradient(135deg,#2563eb,#14b8a6);box-shadow:0 0 0 10px rgba(37,99,235,.12)'>你的位置</div>"
      });
      state.map.add(state.userMarker);
    } else {
      state.userMarker.setPosition(position);
    }

    if (shouldShowLocationInfo) {
      reverseGeocode(position);
    }
  }
}

// 渲染定位成功后的基础位置信息；即使没有地图 Key，也会显示经纬度。
function renderLocationInfo(addressText = "") {
  if (!dom.locationInfo || !state.currentPosition) return;

  const lng = state.currentPosition.lng.toFixed(6);
  const lat = state.currentPosition.lat.toFixed(6);

  dom.locationInfo.hidden = false;
  dom.locationTitle.textContent = addressText ? "定位成功 · 已获取地址" : "定位成功 · 已获取坐标";
  dom.locationDetail.textContent = addressText
    ? `${addressText}（经度 ${lng}，纬度 ${lat}）`
    : `经度 ${lng}，纬度 ${lat}${CONFIG.AMAP_JS_KEY ? "，正在尝试解析详细地址..." : "。如需显示详细地址，请配置高德地图 Key。"}`;
}

// 纯前端 Demo 中，如果配置了高德 JS API Key，则尝试使用高德 JS API 插件反查地址。
function reverseGeocode(position) {
  if (!position) return;

  if (!state.amapReady || !window.AMap) return;

  AMap.plugin("AMap.Geocoder", () => {
    const geocoder = new AMap.Geocoder();

    geocoder.getAddress(position, (status, result) => {
      if (status !== "complete" || !result?.regeocode) {
        renderLocationInfo();
        return;
      }

      const address = result.regeocode.formattedAddress || "";
      const component = result.regeocode.addressComponent || {};
      const cityParts = [
        component.province,
        component.city && component.city !== component.province ? component.city : "",
        component.district
      ].filter(Boolean);

      renderLocationInfo(cityParts.length ? `${cityParts.join(" ")} · ${address}` : address);
    });
  });
}

/* =========================
   聊天主流程
   ========================= */

// 用户发送问题后的完整流程：展示消息、识别意图、搜索 POI、生成推荐、更新地图。
async function handleSend(question) {
  if (!question || state.isSending) return;

  state.isSending = true;
  dom.sendButton.disabled = true;
  dom.userInput.value = "";

  appendMessage("user", question);
  const loadingMessage = appendMessage("assistant", "<span class='loading-dot'>正在理解需求并搜索附近服务</span>", true);

  try {
    const intent = await parseIntent(question);
    dom.intentTag.textContent = `${intent.intent} · ${intent.keyword}`;

    const pois = await searchNearbyPois(intent.keyword);
    const rankedPois = rankPoisLocally(pois).slice(0, CONFIG.MAX_RESULTS);
    const answer = await generateRecommendation(question, intent, rankedPois);

    loadingMessage.querySelector(".bubble").innerHTML = answer;
    renderPoiList(rankedPois);
    renderMarkers(rankedPois);
  } catch (error) {
    console.error(error);
    loadingMessage.querySelector(".bubble").innerHTML = `
      <p>抱歉，当前推荐流程遇到问题。你可以稍后重试，或检查 API Key 与网络配置。</p>
    `;
  } finally {
    state.isSending = false;
    dom.sendButton.disabled = false;
    dom.userInput.focus();
  }
}

// 向聊天区追加消息。
function appendMessage(role, content, isHtml = false) {
  const message = document.createElement("article");
  message.className = `message ${role === "user" ? "user-message" : "assistant-message"}`;

  const avatarText = role === "user" ? "你" : "AI";
  const safeContent = isHtml ? content : `<p>${escapeHtml(content)}</p>`;

  message.innerHTML = `
    <div class="avatar">${avatarText}</div>
    <div class="bubble">${safeContent}</div>
  `;

  dom.chatHistory.appendChild(message);
  dom.chatHistory.scrollTop = dom.chatHistory.scrollHeight;
  return message;
}

/* =========================
   意图识别
   ========================= */

// 纯前端 Demo 使用本地关键词规则识别意图。
async function parseIntent(question) {
  return parseIntentLocally(question);
}

// 本地意图识别：通过关键词命中常见生活场景。
function parseIntentLocally(question) {
  const matched = LOCAL_INTENT_RULES.find(rule => {
    return rule.words.some(word => question.includes(word));
  });

  return matched ? {
    intent: matched.intent,
    keyword: matched.keyword
  } : {
    intent: "生活服务",
    keyword: "便利店"
  };
}

// 从大模型输出中提取 JSON，兼容模型偶尔添加代码块的情况。
function extractJson(text) {
  const match = text.match(/\{[\s\S]*\}/);
  return match ? match[0] : text;
}

/* =========================
   POI 搜索
   ========================= */

// 搜索附近 POI：有高德 JS API Key 时使用前端地图插件，否则使用本地演示数据。
async function searchNearbyPois(keyword) {
  if (state.amapReady && window.AMap && state.currentPosition) {
    return searchPoisByAmap(keyword);
  }

  return createMockPois(keyword);
}

// 使用高德 PlaceSearch 插件搜索周边地点。
function searchPoisByAmap(keyword) {
  return new Promise(resolve => {
    AMap.plugin("AMap.PlaceSearch", () => {
      const placeSearch = new AMap.PlaceSearch({
        pageSize: CONFIG.MAX_RESULTS,
        pageIndex: 1,
        extensions: "all",
        city: CONFIG.DEFAULT_CITY
      });

      const center = [state.currentPosition.lng, state.currentPosition.lat];

      placeSearch.searchNearBy(keyword, center, CONFIG.SEARCH_RADIUS, (status, result) => {
        if (status !== "complete" || !result?.poiList?.pois?.length) {
          resolve(createMockPois(keyword));
          return;
        }

        const pois = result.poiList.pois.map((poi, index) => ({
          id: poi.id || `amap-${index}`,
          name: poi.name,
          address: poi.address || "暂无详细地址",
          distance: Number(poi.distance || 0),
          location: {
            lng: Number(poi.location.lng),
            lat: Number(poi.location.lat)
          },
          business: poi.biz_ext?.open_time || poi.business_area || "营业信息以门店为准",
          type: poi.type || keyword,
          source: "amap"
        }));

        resolve(pois);
      });
    });
  });
}

// 生成演示 POI 数据：围绕当前位置产生一组可视化点位。
function createMockPois(keyword) {
  const baseLng = state.currentPosition?.lng || CONFIG.DEFAULT_POSITION[0];
  const baseLat = state.currentPosition?.lat || CONFIG.DEFAULT_POSITION[1];
  const names = buildMockNames(keyword);

  return names.map((name, index) => {
    const angle = (Math.PI * 2 * index) / names.length;
    const distance = 420 + index * 220;
    const lngOffset = Math.cos(angle) * distance / 95000;
    const latOffset = Math.sin(angle) * distance / 111000;

    return {
      id: `mock-${index}`,
      name,
      address: `社区生活圈 ${index + 1} 号街区附近`,
      distance,
      location: {
        lng: Number((baseLng + lngOffset).toFixed(6)),
        lat: Number((baseLat + latOffset).toFixed(6))
      },
      business: index % 2 === 0 ? "营业中 · 信息仅供演示" : "营业信息以门店为准",
      type: keyword,
      source: "mock"
    };
  });
}

// 根据搜索关键词生成更贴近场景的演示店名。
function buildMockNames(keyword) {
  const map = {
    "药店": ["安心大药房", "社区连锁药店", "康民药房", "便民健康药店", "仁和药房", "邻里药品超市"],
    "公园": ["口袋公园", "社区健身步道", "滨河慢跑公园", "城市绿道入口", "邻里运动广场", "晨跑小广场"],
    "打印店": ["快印图文中心", "邻里打印社", "校园图文快印", "便民复印店", "证件照打印中心", "社区文印室"],
    "手机维修": ["极速手机维修", "邻里数码维修", "换屏电池服务站", "手机电脑维修中心", "数码生活馆", "便民维修铺"],
    "餐饮": ["深夜小食堂", "社区夜宵档", "烧烤小馆", "便利简餐店", "邻里面馆", "暖心粥铺"],
    "儿童乐园": ["亲子活动中心", "儿童游乐空间", "社区童趣乐园", "亲子阅读馆", "儿童运动馆", "口袋游乐场"],
    "宠物医院": ["安心宠物医院", "邻里宠物诊所", "萌宠疫苗站", "宠物护理中心", "伴侣动物医院", "社区宠物服务站"]
  };

  return map[keyword] || ["社区便利店", "邻里服务站", "便民服务中心", "生活超市", "社区服务点", "综合生活馆"];
}

// 简单按距离排序，后续可扩展营业状态、评分等维度。
function rankPoisLocally(pois) {
  return [...pois].sort((a, b) => Number(a.distance || 999999) - Number(b.distance || 999999));
}

/* =========================
   推荐生成
   ========================= */

// 纯前端 Demo 使用本地模板生成推荐理由。
async function generateRecommendation(question, intent, pois) {
  if (!pois.length) {
    return "<p>暂时没有找到合适的附近地点，可以换个关键词再试。</p>";
  }

  return generateLocalRecommendation(intent, pois);
}

// 本地推荐模板：确保无 AI Key 时也能给出可读结果。
function generateLocalRecommendation(intent, pois) {
  const top = pois[0];
  const items = pois.slice(0, 3).map((poi, index) => `
    <li>
      <strong>${index + 1}. ${escapeHtml(poi.name)}</strong>，
      距离 ${formatDistance(poi.distance)}，${escapeHtml(poi.business)}。
    </li>
  `).join("");

  return `
    <p>已理解你的需求为 <strong>${escapeHtml(intent.intent)}</strong>，我用关键词 <strong>${escapeHtml(intent.keyword)}</strong> 搜索了附近地点。</p>
    <p>建议优先考虑 <strong>${escapeHtml(top.name)}</strong>，它距离最近，适合作为第一选择。</p>
    <ul>${items}</ul>
  `;
}

/* =========================
   结果渲染
   ========================= */

// 渲染右侧推荐列表。
function renderPoiList(pois) {
  dom.resultCount.textContent = `${pois.length} 个结果`;

  if (!pois.length) {
    dom.poiList.innerHTML = `
      <div class="empty-state">
        <strong>没有找到结果</strong>
        <span>可以尝试更换问题或扩大搜索范围。</span>
      </div>
    `;
    return;
  }

  dom.poiList.innerHTML = pois.map((poi, index) => `
    <article class="poi-card">
      <strong>${index + 1}. ${escapeHtml(poi.name)}</strong>
      <div class="poi-meta">
        <span>${formatDistance(poi.distance)}</span>
        <span>${escapeHtml(poi.type)}</span>
      </div>
      <div class="poi-address">${escapeHtml(poi.address)}</div>
      <div class="poi-address">${escapeHtml(poi.business)}</div>
    </article>
  `).join("");
}

// 渲染地图 Marker：真实地图与演示地图分别处理。
function renderMarkers(pois) {
  if (state.amapReady && state.map) {
    renderAmapMarkers(pois);
  } else {
    renderMockMarkers(pois);
  }
}

// 渲染高德地图 Marker。
function renderAmapMarkers(pois) {
  clearAmapMarkers();

  const bounds = [];
  if (state.currentPosition) {
    bounds.push([state.currentPosition.lng, state.currentPosition.lat]);
  }

  pois.forEach((poi, index) => {
    const position = [poi.location.lng, poi.location.lat];
    bounds.push(position);

    const marker = new AMap.Marker({
      position,
      title: poi.name,
      label: {
        content: `${index + 1}`,
        direction: "top"
      }
    });

    marker.on("click", () => {
      if (state.activeInfoWindow) state.activeInfoWindow.close();

      state.activeInfoWindow = new AMap.InfoWindow({
        content: `
          <div style="min-width:190px;padding:6px 4px">
            <strong>${escapeHtml(poi.name)}</strong>
            <p style="margin:6px 0;color:#64748b">${escapeHtml(poi.address)}</p>
            <p style="margin:0;color:#2563eb">${formatDistance(poi.distance)} · ${escapeHtml(poi.business)}</p>
          </div>
        `,
        offset: new AMap.Pixel(0, -28)
      });
      state.activeInfoWindow.open(state.map, position);
    });

    state.poiMarkers.push(marker);
  });

  state.map.add(state.poiMarkers);

  if (bounds.length > 1) {
    state.map.setFitView([...state.poiMarkers, state.userMarker].filter(Boolean), false, [70, 70, 70, 70]);
  }
}

// 清理旧的高德 Marker，避免重复叠加。
function clearAmapMarkers() {
  if (state.poiMarkers.length && state.map) {
    state.map.remove(state.poiMarkers);
  }
  state.poiMarkers = [];
}

// 渲染演示地图 Marker。
function renderMockMarkers(pois) {
  dom.mockMarkers.innerHTML = pois.map((poi, index) => {
    const positions = [
      [64, 35],
      [72, 58],
      [46, 68],
      [30, 44],
      [42, 25],
      [58, 74]
    ];
    const [left, top] = positions[index % positions.length];

    return `
      <div class="mock-marker" style="left:${left}%;top:${top}%">
        <button type="button" title="${escapeHtml(poi.name)}">${index + 1}</button>
        <span>${escapeHtml(poi.name)}</span>
      </div>
    `;
  }).join("");
}

/* =========================
   工具函数
   ========================= */

// 距离格式化：小于 1000 米显示米，大于等于 1000 米显示公里。
function formatDistance(distance) {
  const value = Number(distance || 0);
  if (value >= 1000) {
    return `${(value / 1000).toFixed(1)} 公里`;
  }
  return `${Math.round(value)} 米`;
}

// HTML 转义：避免用户输入或接口数据直接插入 HTML 带来风险。
function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

// 对模型返回的 HTML 做简单白名单清洗，仅保留计划中推荐回复需要的少量标签。
function sanitizeAllowedHtml(html) {
  const template = document.createElement("template");
  template.innerHTML = html;
  const allowedTags = new Set(["P", "UL", "LI", "STRONG", "BR"]);

  const walk = node => {
    [...node.children].forEach(child => {
      if (!allowedTags.has(child.tagName)) {
        child.replaceWith(document.createTextNode(child.textContent || ""));
        return;
      }

      [...child.attributes].forEach(attr => child.removeAttribute(attr.name));
      walk(child);
    });
  };

  walk(template.content);
  return template.innerHTML || html;
}
