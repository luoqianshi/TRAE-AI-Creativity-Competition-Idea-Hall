  <div class="conn-bar">
    <button id="btnRefreshPorts" title="刷新串口列表">刷新</button>
    <select id="portSelect"><option value="">-- 选择串口 --</option></select>
    <select id="baudSelect">
      <option value="9600">9600</option>
      <option value="115200" selected>115200</option>
      <option value="230400">230400</option>
      <option value="460800">460800</option>
      <option value="921600">921600</option>

<div class="main-grid">

  <!-- 关节控制面板 -->
  <div class="panel" id="jointPanel">
    <h2>关节控制</h2>
    <div id="jointSliders"></div>
    <div class="button-grid" style="margin-top:14px">
      <button class="btn btn-status" id="btnReadAll">读取所有位置</button>
      <button class="btn" id="btnSyncAll" style="background:#1a2a3a;border-color:var(--accent);color:var(--accent)">同步所有舵机</button>
    </div>
  </div>

  <!-- 操作面板 -->
  <div class="panel">
    <h2>快捷操作</h2>
    <div class="button-grid">
      <button class="btn btn-home" id="btnHome">复位 HOME</button>
      <button class="btn btn-stop" id="btnStop">急停 STOP</button>
      <button class="btn btn-status" id="btnStatus">状态 STATUS</button>
      <button class="btn btn-power" id="btnPowerOn">上电</button>
      <button class="btn btn-rest" id="btnRest">休息</button>
      <button class="btn btn-run" id="btnRun1">RUN 1 (动作序列)</button>
    </div>

    <h2 style="margin-top:20px">姿态执行 POSE</h2>
    <div class="pose-selector" id="poseSelector"></div>
    <div class="pose-time">
      <label>运动时间(ms):</label>
      <input type="number" id="poseTime" value="1000" min="100" max="10000" step="100">
      <button class="btn" id="btnExecPose" style="flex:1">执行姿态</button>
    </div>

    <h2 style="margin-top:20px">移动时间(ms)</h2>
    <div class="pose-time">
      <input type="number" id="moveTime" value="800" min="100" max="10000" step="100">
      <span style="font-size:0.8rem;color:var(--muted)">滑块拖动/同步时使用此时间</span>
    </div>
  </div>

  <!-- 日志面板 -->
  <div class="panel log-panel">
    <h2>通信日志</h2>

      <div class="log-line"><span class="log-info">等待连接串口...</span></div>
    </div>
    <div class="cmd-input-row">
      <input type="text" id="cmdInput" placeholder="输入自定义命令，如 MOVE 1 500 1000" autocomplete="off">
      <button id="btnSendCmd">发送</button>
    </div>
  </div>

</div>

<div class="footer">
  5-Axis Robotic Arm Control Panel · 通信协议: USART 115200 8N1 · 命令以 \r\n 结尾
</div>

<script>
// ==================== 关节配置 ====================
const JOINT_CONFIG = [
  { name: 'J1', id: 1, min: 0, max: 1000, home: 500, pos: 500 },
  { name: 'J2', id: 2, min: 0, max: 1000, home: 500, pos: 500 },
  { name: 'J3', id: 3, min: 0, max: 1000, home: 500, pos: 500 },
  { name: 'J4', id: 4, min: 0, max: 1000, home: 500, pos: 500 },
  { name: 'J5', id: 5, min: 0, max: 1000, home: 500, pos: 500 },
];

const POSE_NAMES = ['P0 HOME', 'P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'P7', 'P8', 'P9', 'P10', 'P11', 'P12', 'P13'];
let selectedPose = 0;
let port = null;
let reader = null;
let writer = null;
let readLoop = null;

// ==================== DOM 引用 ====================
const $ = (id) => document.getElementById(id);
const connDot = $('connDot');
const statusText = $('statusText');
const btnConnect = $('btnConnect');
const btnDisconnect = $('btnDisconnect');
const portSelect = $('portSelect');
const baudSelect = $('baudSelect');
const logArea = $('logArea');
const cmdInput = $('cmdInput');
const jointSliders = $('jointSliders');
const poseSelector = $('poseSelector');

// ==================== 日志 ====================
function log(type, text) {
  const now = new Date();
  const time = now.toTimeString().slice(0, 8);
  const div = document.createElement('div');
  div.className = 'log-line';
  div.innerHTML = `<span class="log-time">${time}</span><span class="log-${type}">${text}</span>`;
  logArea.appendChild(div);
  logArea.scrollTop = logArea.scrollHeight;
}

// ==================== 串口 ====================
async function refreshPorts() {
  try {
    const ports = await navigator.serial.getPorts();
    portSelect.innerHTML = '';
    if (ports.length === 0) {
      portSelect.innerHTML = '<option value="">-- 点击连接按钮选择串口 --</option>';
      return;
    }
    ports.forEach((p, i) => {
      const info = p.getInfo && p.getInfo();
      const label = (info && info.usbVendorId) ? `COM (USB VID:0x${info.usbVendorId.toString(16)})` : `已授权串口 ${i + 1}`;
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = label;
      portSelect.appendChild(opt);
    });
  } catch (e) {
    log('err', '获取串口列表失败: ' + e.message);
  }
}

async function connectSerial() {
  try {
    let selectedPort;
    // 始终先弹出浏览器原生串口选择器
    selectedPort = await navigator.serial.requestPort();
    await selectedPort.open({ baudRate: parseInt(baudSelect.value) });

    port = selectedPort;
    reader = port.readable.getReader();
    writer = port.writable.getWriter();

    const info = port.getInfo && port.getInfo();
    log('info', '串口已连接 [' + (baudSelect.value) + ' bps]');

    updateConnectionUI(true);
    startReadLoop();

    // 发送 PING 测试连接
    await sendCommand('PING');
  } catch (e) {
    log('err', '连接失败: ' + e.message);
    updateConnectionUI(false);
  }
}

async function disconnectSerial() {
  try {
    if (readLoop) { readLoop.cancel(); readLoop = null; }
    if (reader) { reader.releaseLock(); reader = null; }
    if (writer) { writer.releaseLock(); writer = null; }
    if (port) { await port.close(); port = null; }
    log('info', '串口已断开');
    updateConnectionUI(false);
  } catch (e) {
    log('err', '断开失败: ' + e.message);
  }
}

function updateConnectionUI(connected) {
  if (connected) {
    connDot.classList.add('connected');
    statusText.textContent = '已连接';
    btnConnect.style.display = 'none';
    btnDisconnect.style.display = '';
  } else {
    connDot.classList.remove('connected');
    statusText.textContent = '未连接';
    btnConnect.style.display = '';
    btnDisconnect.style.display = 'none';
  }
}

async function startReadLoop() {
  readLoop = new AbortController();
  const decoder = new TextDecoder();
  let buffer = '';

  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // 按行分割
      let idx;
      while ((idx = buffer.indexOf('\n')) !== -1) {
        const line = buffer.slice(0, idx).replace(/\r$/, '');
        buffer = buffer.slice(idx + 1);
        if (line.trim()) {
          log('rx', line);
          parseResponse(line);
        }
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      log('err', '读取错误: ' + e.message);
    }
  }
}

async function sendCommand(cmd) {
  if (!writer) {
    log('err', '未连接串口');
    return;
  }
  const encoder = new TextEncoder();
  const data = encoder.encode(cmd + '\r\n');
  log('tx', cmd);
  await writer.write(data);
}

function parseResponse(line) {
  // 解析 STATUS 返回: J1:500 J2:500 J3:500 J4:500 J5:500
  const statusMatch = line.match(/J1:(\d+)\s+J2:(\d+)\s+J3:(\d+)\s+J4:(\d+)\s+J5:(\d+)/);
  if (statusMatch) {
    for (let i = 0; i < 5; i++) {
      const pos = parseInt(statusMatch[i + 1]);
      JOINT_CONFIG[i].pos = pos;
      updateSliderUI(i);
    }
    return;
  }

  // 解析 READ n 返回: J1:500
  const readMatch = line.match(/J(\d):(\d+)/);
  if (readMatch && !statusMatch) {
    const idx = parseInt(readMatch[1]) - 1;
    if (idx >= 0 && idx < 5) {
      JOINT_CONFIG[idx].pos = parseInt(readMatch[2]);
      updateSliderUI(idx);
    }
    return;
  }
}

// ==================== 滑块 UI ====================
function buildJointSliders() {
  jointSliders.innerHTML = '';
  JOINT_CONFIG.forEach((j, i) => {
    const div = document.createElement('div');
    div.className = 'joint-item';
    div.innerHTML = `
      <span class="joint-label">${j.name}</span>
      <span class="joint-range">${j.min}~${j.max}</span>
      <div class="joint-slider-wrap">
        <input type="range" id="slider${i}" min="${j.min}" max="${j.max}" value="${j.pos}" step="1">
      </div>
      <span class="joint-value" id="val${i}">${j.pos}</span>
      <button class="joint-btn" data-idx="${i}" data-action="home">归零</button>
      <button class="joint-btn" data-idx="${i}" data-action="read">读取</button>
    `;
    jointSliders.appendChild(div);
  });

  // 滑块事件
  JOINT_CONFIG.forEach((j, i) => {
    const slider = document.getElementById('slider' + i);
    const valEl = document.getElementById('val' + i);
    slider.addEventListener('input', () => {
      j.pos = parseInt(slider.value);
      valEl.textContent = j.pos;
    });
    slider.addEventListener('change', () => {
      j.pos = parseInt(slider.value);
      const time = parseInt($('moveTime').value) || 800;
      sendCommand(`MOVE ${j.id} ${j.pos} ${time}`);
    });
  });

  // 按钮事件
  jointSliders.addEventListener('click', (e) => {
    const btn = e.target.closest('.joint-btn');
    if (!btn) return;
    const idx = parseInt(btn.dataset.idx);
    const action = btn.dataset.action;
    if (action === 'home') {
      JOINT_CONFIG[idx].pos = JOINT_CONFIG[idx].home;
      updateSliderUI(idx);
      const time = parseInt($('moveTime').value) || 800;
      sendCommand(`MOVE ${JOINT_CONFIG[idx].id} ${JOINT_CONFIG[idx].pos} ${time}`);
    } else if (action === 'read') {
      sendCommand(`READ ${JOINT_CONFIG[idx].id}`);
    }
  });
}

function updateSliderUI(idx) {
  const j = JOINT_CONFIG[idx];
  const slider = document.getElementById('slider' + idx);
  const valEl = document.getElementById('val' + idx);
  if (slider) slider.value = j.pos;
  if (valEl) valEl.textContent = j.pos;
}

// ==================== 姿态选择器 ====================
function buildPoseSelector() {
  poseSelector.innerHTML = '';
  POSE_NAMES.forEach((name, i) => {
    const btn = document.createElement('button');
    btn.className = 'pose-btn' + (i === selectedPose ? ' active' : '');
    btn.textContent = name;
    btn.addEventListener('click', () => {
      selectedPose = i;
      poseSelector.querySelectorAll('.pose-btn').forEach((b, j) => {
        b.classList.toggle('active', j === i);
      });
    });
    poseSelector.appendChild(btn);
  });
}

// ==================== 按钮事件 ====================
btnConnect.addEventListener('click', connectSerial);
btnDisconnect.addEventListener('click', disconnectSerial);
$('btnRefreshPorts').addEventListener('click', refreshPorts);

$('btnHome').addEventListener('click', async () => {
  const time = parseInt($('moveTime').value) || 800;
  for (let i = 0; i < 5; i++) {
    JOINT_CONFIG[i].pos = JOINT_CONFIG[i].home;
    updateSliderUI(i);
    await sendCommand(`MOVE ${JOINT_CONFIG[i].id} ${JOINT_CONFIG[i].pos} ${time}`);
    await new Promise(r => setTimeout(r, 100));
  }
  log('info', '逐步复位完成: J1~J5 → 500');
});
$('btnStop').addEventListener('click', () => sendCommand('STOP'));
$('btnStatus').addEventListener('click', () => sendCommand('STATUS'));

/* 上电按钮: 发送 PING 检测连接，然后逐步移动到休息位姿 */
$('btnPowerOn').addEventListener('click', async () => {
  await sendCommand('PING');
  await new Promise(r => setTimeout(r, 200));
  const time = 1000;
  const restPose = [479, 871, 977, 745, 496]; // J1..J5
  // 从 J5 到 J1 逐步上电
  for (let i = 4; i >= 0; i--) {
    JOINT_CONFIG[i].pos = restPose[i];
    updateSliderUI(i);
    await sendCommand(`MOVE ${JOINT_CONFIG[i].id} ${JOINT_CONFIG[i].pos} ${time}`);
    await new Promise(r => setTimeout(r, 150));
  }
  log('info', '上电完成 → 休息位姿');
});

/* 休息按钮: 从 J5 到 J1 逐步移动到休息位姿 */
$('btnRest').addEventListener('click', async () => {
  const time = parseInt($('moveTime').value) || 1000;
  const restPose = [479, 871, 977, 745, 496]; // J1..J5
  // 从 J5 到 J1 逐步执行
  for (let i = 4; i >= 0; i--) {
    JOINT_CONFIG[i].pos = restPose[i];
    updateSliderUI(i);
    await sendCommand(`MOVE ${JOINT_CONFIG[i].id} ${JOINT_CONFIG[i].pos} ${time}`);
    await new Promise(r => setTimeout(r, 150));
  }
  log('info', '休息位姿完成: J1=479 J2=871 J3=977 J4=745 J5=496');
});
$('btnRun1').addEventListener('click', () => {
  sendCommand('RUN 1 1000');
});
$('btnReadAll').addEventListener('click', () => sendCommand('STATUS'));
$('btnSyncAll').addEventListener('click', () => {
  const time = parseInt($('moveTime').value) || 800;
  let cmd = '';
  JOINT_CONFIG.forEach((j, i) => {
    cmd += `MOVE ${j.id} ${j.pos} ${time}\r\n`;
  });
  // 逐条发送
  const lines = cmd.trim().split('\r\n');
  (async () => {
    for (const line of lines) {
      await sendCommand(line);
      await new Promise(r => setTimeout(r, 50));
    }
  })();
});
$('btnExecPose').addEventListener('click', () => {
  const time = parseInt($('poseTime').value) || 1500;
  sendCommand(`POSE ${selectedPose} ${time}`);
});
$('btnSendCmd').addEventListener('click', () => {
  const cmd = cmdInput.value.trim();
  if (cmd) {
    sendCommand(cmd);
    cmdInput.value = '';
  }
});
cmdInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const cmd = cmdInput.value.trim();
    if (cmd) {
      sendCommand(cmd);
      cmdInput.value = '';
    }
  }
});

// ==================== 键盘快捷键 ====================
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return; // 不在输入框中响应
  switch (e.key.toLowerCase()) {
    case 'h': sendCommand('HOME'); break;
    case 's': sendCommand('STOP'); break;
    case 't': sendCommand('STATUS'); break;
    case 'r': $('btnRest').click(); break;
    case 'o': $('btnPowerOn').click(); break;
  }
});

// ==================== 初始化 ====================
function init() {
  buildJointSliders();
  buildPoseSelector();
  refreshPorts();

  // 检查 Web Serial API 支持
  if (!('serial' in navigator)) {
    log('err', '浏览器不支持 Web Serial API，请使用 Chrome/Edge 89+ 并开启 Experimental Web Platform features');
    btnConnect.disabled = true;
    btnConnect.textContent = '不支持';
  }
}

init();
</script>
