<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运转盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin-bottom: 40px;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.3), inset 0 0 10px rgba(0,0,0,0.2);
            position: relative;
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);
            overflow: hidden;
        }

        .wheel.spinning {
            transition: transform 6s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .wheel-section {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-section span {
            position: absolute;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            transform-origin: center center;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #ff6b6b;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -30px;
            left: -15px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #fff;
        }

        .spin-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.5);
            transition: all 0.3s ease;
            z-index: 5;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .spin-btn:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.7);
        }

        .spin-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .spin-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: translate(-50%, -50%);
        }

        .controls {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-color: #667eea;
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-add {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4);
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(17, 153, 142, 0.6);
        }

        .btn-remove {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-remove:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }

        .options-list {
            max-height: 150px;
            overflow-y: auto;
        }

        .option-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: background 0.3s ease;
        }

        .option-item:hover {
            background: #e9ecef;
        }

        .option-item span {
            font-size: 16px;
            color: #333;
            flex: 1;
        }

        .option-item .btn-delete {
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .option-item .btn-delete:hover {
            background: #c82333;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: #fff;
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            animation: rotateGradient 3s linear infinite;
        }

        @keyframes rotateGradient {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .modal-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .modal-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .modal-result {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 30px;
            padding: 15px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .modal-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .modal-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .color-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .color-dots span {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            animation: colorPulse 2s ease-in-out infinite;
        }

        @keyframes colorPulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .wheel-container {
                width: 300px;
                height: 300px;
            }

            .wheel-section span {
                font-size: 12px;
            }

            .spin-btn {
                width: 65px;
                height: 65px;
                font-size: 14px;
            }

            .controls {
                padding: 20px;
            }

            .input-group {
                flex-direction: column;
            }

            .btn {
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <h1>🎡 幸运转盘</h1>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
            <!-- 扇区将通过JavaScript动态生成 -->
        </div>
        <button class="spin-btn" id="spinBtn">旋转</button>
    </div>

    <div class="controls">
        <div class="input-group">
            <input type="text" id="newOption" placeholder="输入新选项..." maxlength="8">
            <button class="btn btn-add" id="addBtn">添加选项</button>
            <button class="btn btn-remove" id="removeBtn">删除选项</button>
        </div>
        <div class="options-list" id="optionsList">
            <!-- 选项列表将通过JavaScript动态生成 -->
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal">
            <div class="modal-icon">🎉</div>
            <h2 class="modal-title">恭喜你！</h2>
            <div class="modal-result" id="resultText"></div>
            <button class="modal-btn" id="closeModal">再来一次</button>
            <div class="color-dots">
                <span style="background: #ff6b6b;"></span>
                <span style="background: #4ecdc4;"></span>
                <span style="background: #45b7d1;"></span>
                <span style="background: #96ceb4;"></span>
                <span style="background: #ffeaa7;"></span>
            </div>
        </div>
    </div>

    <script>
        const colors = [
            '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4',
            '#ffeaa7', '#dfe6e9', '#fd79a8', '#a29bfe',
            '#00b894', '#e17055', '#0984e3', '#6c5ce7'
        ];

        let options = ['吃火锅', '看电影', '去露营', '打游戏', '逛书店', '喝咖啡', '健身', '宅家'];
        let currentRotation = 0;
        let isSpinning = false;

        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const addBtn = document.getElementById('addBtn');
        const removeBtn = document.getElementById('removeBtn');
        const newOptionInput = document.getElementById('newOption');
        const optionsList = document.getElementById('optionsList');
        const resultModal = document.getElementById('resultModal');
        const resultText = document.getElementById('resultText');
        const closeModal = document.getElementById('closeModal');

        function renderWheel() {
            wheel.innerHTML = '';
            const totalOptions = options.length;
            const anglePerOption = 360 / totalOptions;

            options.forEach((option, index) => {
                const section = document.createElement('div');
                section.className = 'wheel-section';
                section.style.background = colors[index % colors.length];
                section.style.transform = `rotate(${index * anglePerOption}deg)`;

                const text = document.createElement('span');
                text.textContent = option;
                const textAngle = (index * anglePerOption) + (anglePerOption / 2);
                text.style.transform = `rotate(${textAngle + 90}deg) translate(-50%, -50%)`;
                text.style.left = '50%';
                text.style.top = '20%';

                section.appendChild(text);
                wheel.appendChild(section);
            });
        }

        function renderOptionsList() {
            optionsList.innerHTML = '';
            options.forEach((option, index) => {
                const item = document.createElement('div');
                item.className = 'option-item';
                item.innerHTML = `
                    <span>${index + 1}. ${option}</span>
                    <button class="btn-delete" onclick="removeOption(${index})">删除</button>
                `;
                optionsList.appendChild(item);
            });
        }

        function addOption() {
            const value = newOptionInput.value.trim();
            if (value && !options.includes(value)) {
                options.push(value);
                newOptionInput.value = '';
                renderWheel();
                renderOptionsList();
            } else if (options.includes(value)) {
                alert('该选项已存在！');
            }
        }

        function removeOption(index) {
            if (options.length <= 2) {
                alert('至少需要保留2个选项！');
                return;
            }
            options.splice(index, 1);
            renderWheel();
            renderOptionsList();
        }

        function spinWheel() {
            if (isSpinning || options.length < 2) return;

            isSpinning = true;
            spinBtn.disabled = true;
            wheel.classList.add('spinning');

            const totalOptions = options.length;
            const anglePerOption = 360 / totalOptions;
            const randomIndex = Math.floor(Math.random() * totalOptions);
            const targetAngle = (360 - (randomIndex * anglePerOption) - (anglePerOption / 2)) + (360 * 5);
            const finalRotation = currentRotation + targetAngle;

            currentRotation = finalRotation;
            wheel.style.transform = `rotate(${finalRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                wheel.classList.remove('spinning');
                showResult(options[randomIndex]);
            }, 6000);
        }

        function showResult(result) {
            resultText.textContent = result;
            resultModal.classList.add('show');
        }

        function closeModalFunc() {
            resultModal.classList.remove('show');
        }

        addBtn.addEventListener('click', addOption);
        removeBtn.addEventListener('click', () => {
            if (options.length > 2) {
                options.pop();
                renderWheel();
                renderOptionsList();
            } else {
                alert('至少需要保留2个选项！');
            }
        });
        spinBtn.addEventListener('click', spinWheel);
        closeModal.addEventListener('click', closeModalFunc);
        newOptionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addOption();
        });
        resultModal.addEventListener('click', (e) => {
            if (e.target === resultModal) closeModalFunc();
        });

        renderWheel();
        renderOptionsList();
    </script>
</body>
</html>
