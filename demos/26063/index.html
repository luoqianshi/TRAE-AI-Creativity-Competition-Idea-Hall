<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档差异对比工具</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 文档差异对比工具</h1>
            <p class="subtitle">支持 DOCX、PDF、DOC、TXT 格式文档对比</p>
        </header>

        <main>
            <!-- 上传区域 -->
            <section class="upload-section">
                <div class="upload-card">
                    <div class="upload-card-header">
                        <span class="file-badge badge-original">原文档</span>
                        <span class="file-count" id="file1-name">未选择文件</span>
                    </div>
                    <div class="upload-area" id="upload-area-1">
                        <input type="file" id="file1" accept=".docx,.pdf,.doc,.txt" hidden>
                        <label for="file1" class="upload-label">
                            <div class="upload-icon">📁</div>
                            <p>点击或拖拽文件到此处</p>
                            <p class="upload-hint">支持 .docx .pdf .doc .txt</p>
                        </label>
                    </div>
                </div>

                <div class="vs-badge">VS</div>

                <div class="upload-card">
                    <div class="upload-card-header">
                        <span class="file-badge badge-modified">新文档</span>
                        <span class="file-count" id="file2-name">未选择文件</span>
                    </div>
                    <div class="upload-area" id="upload-area-2">
                        <input type="file" id="file2" accept=".docx,.pdf,.doc,.txt" hidden>
                        <label for="file2" class="upload-label">
                            <div class="upload-icon">📁</div>
                            <p>点击或拖拽文件到此处</p>
                            <p class="upload-hint">支持 .docx .pdf .doc .txt</p>
                        </label>
                    </div>
                </div>
            </section>

            <!-- 对比按钮 -->
            <div class="action-section">
                <button id="compare-btn" class="btn-compare" disabled>
                    <span class="btn-icon">🔍</span>
                    <span class="btn-text">开始对比</span>
                </button>
            </div>

            <!-- 下载按钮（对比完成后显示） -->
            <div id="download-section" class="action-section hidden">
                <button id="download-btn" class="btn-download">
                    <span class="btn-icon">📥</span>
                    <span class="btn-text">下载带颜色标记的差异文档</span>
                </button>
            </div>

            <!-- 加载状态 -->
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>正在分析文档差异...</p>
            </div>

            <!-- 错误提示 -->
            <div id="error-message" class="error-message hidden">
                <span class="error-icon">⚠️</span>
                <span id="error-text"></span>
            </div>

            <!-- 结果区域 -->
            <section id="result-section" class="result-section hidden">
                <!-- 统计信息 -->
                <div class="stats-panel">
                    <div class="stat-card stat-file1">
                        <h3 id="stats-file1-name">原文档</h3>
                        <p><span id="stats-file1-lines">0</span> 行</p>
                    </div>
                    <div class="stat-card stat-added">
                        <div class="stat-icon bg-green">+</div>
                        <div class="stat-info">
                            <span class="stat-number" id="stats-added">0</span>
                            <span class="stat-label">新增</span>
                        </div>
                    </div>
                    <div class="stat-card stat-modified">
                        <div class="stat-icon bg-yellow">~</div>
                        <div class="stat-info">
                            <span class="stat-number" id="stats-modified">0</span>
                            <span class="stat-label">修改</span>
                        </div>
                    </div>
                    <div class="stat-card stat-deleted">
                        <div class="stat-icon bg-red">-</div>
                        <div class="stat-info">
                            <span class="stat-number" id="stats-deleted">0</span>
                            <span class="stat-label">删除</span>
                        </div>
                    </div>
                    <div class="stat-card stat-file2">
                        <h3 id="stats-file2-name">新文档</h3>
                        <p><span id="stats-file2-lines">0</span> 行</p>
                    </div>
                </div>

                <!-- 图例 -->
                <div class="legend">
                    <h3>🎨 颜色说明</h3>
                    <div class="legend-items">
                        <div class="legend-item">
                            <span class="legend-color bg-added"></span>
                            <span class="legend-text">新增内容（绿色）</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color bg-deleted"></span>
                            <span class="legend-text">删除内容（红色）</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color bg-modified"></span>
                            <span class="legend-text">修改内容（黄色）</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color bg-unchanged"></span>
                            <span class="legend-text">相同内容</span>
                        </div>
                    </div>
                </div>

                <!-- 差异详情 -->
                <div class="diff-container">
                    <div class="diff-header">
                        <h3>📋 差异详情</h3>
                        <div class="diff-filters">
                            <button class="filter-btn active" data-filter="all">全部</button>
                            <button class="filter-btn" data-filter="added">新增</button>
                            <button class="filter-btn" data-filter="modified">修改</button>
                            <button class="filter-btn" data-filter="deleted">删除</button>
                            <button class="filter-btn" data-filter="changed">仅差异</button>
                        </div>
                    </div>
                    <div id="diff-content" class="diff-content">
                        <!-- 差异内容将在这里渲染 -->
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>文档差异对比工具 &copy; 2026 | V1.0.4</p>
        </footer>
    </div>

    <script>
    const APP_CONFIG = {
        softwareName: "文档差异对比工具",
        softwareVersion: "1.0.4"
    };
</script>
<script src="../static/js/app.js"></script>
</body>
</html>
