<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 代码片段速存工坊 - 前端开发者专用代码收藏工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --bg-card: #1c2128;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-orange: #d29922;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
            --accent-cyan: #56d4dd;
            --accent-pink: #db61a2;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #eaeef2;
            --bg-card: #ffffff;
            --border-color: #d0d7de;
            --text-primary: #1f2328;
            --text-secondary: #656d76;
            --text-muted: #8c959f;
            --accent-blue: #0969da;
            --accent-green: #1a7f37;
            --accent-orange: #9a6700;
            --accent-red: #cf222e;
            --accent-purple: #8250df;
            --accent-cyan: #0891b2;
            --accent-pink: #bf3989;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.2);
        }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            padding: 24px 32px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.3);
        }
        .title-group h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .title-group p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .theme-toggle-btn {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 20px;
        }
        .theme-toggle-btn:hover {
            background-color: var(--bg-card);
            border-color: var(--accent-blue);
            transform: scale(1.05);
        }
        .theme-toggle-btn:active {
            transform: scale(0.95);
        }
        .search-box {
            position: relative;
        }
        .search-box input {
            width: 320px;
            padding: 10px 16px 10px 40px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        .search-box input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue) 0%, #1f6feb 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.4);
        }
        .btn-secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background-color: var(--bg-card);
            border-color: var(--accent-blue);
        }
        .btn-danger {
            background-color: #ff7b72;
            color: white;
            border: none;
        }
        .btn-danger:hover {
            background-color: #ff5f56;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }
        .btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            justify-content: center;
        }
        .toolbar-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid transparent;
        }
        .copy-btn {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--border-color);
        }
        .copy-btn:hover {
            background-color: var(--bg-card);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }
        .favorite-btn {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--border-color);
        }
        .favorite-btn:hover {
            background-color: #fff9c4;
            border-color: #ffd700;
            color: #ffd700;
        }
        .favorite-btn.favorited {
            background-color: #fff9c4;
            border-color: #ffd700;
            color: #ffd700;
        }
        .delete-btn {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--border-color);
        }
        .delete-btn:hover {
            background-color: #ffebee;
            border-color: #ff7b72;
            color: #ff7b72;
        }
        .main-container {
            display: flex;
            height: calc(100vh - 96px);
        }
        .sidebar {
            width: 280px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header h2 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .sidebar-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }
        .sidebar-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        .sidebar-tab.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
            background-color: rgba(88, 166, 255, 0.08);
        }
        .tags-section {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .tags-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tag {
            padding: 4px 10px;
            background-color: var(--bg-tertiary);
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .tag:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }
        .tag.active {
            background-color: rgba(88, 166, 255, 0.15);
            color: var(--accent-blue);
            border-color: var(--accent-blue);
        }
        .tag-new {
            color: var(--accent-green);
            border-color: var(--accent-green);
        }
        .snippets-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .snippet-item {
            padding: 12px;
            margin-bottom: 6px;
            background-color: var(--bg-tertiary);
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .snippet-item:hover {
            border-color: var(--accent-blue);
            background-color: var(--bg-card);
        }
        .snippet-item.active {
            border-color: var(--accent-blue);
            background-color: rgba(88, 166, 255, 0.1);
        }
        .snippet-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }
        .snippet-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .snippet-language {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: var(--bg-secondary);
            color: var(--text-muted);
            margin-left: 8px;
        }
        .snippet-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .snippet-preview {
            font-size: 11px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 4px;
            line-height: 1.4;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-state p {
            font-size: 13px;
            line-height: 1.6;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .editor-tabs {
            display: flex;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .editor-tab {
            padding: 12px 24px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            position: relative;
        }
        .editor-tab.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }
        .editor-tab .badge {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 10px;
            padding: 1px 5px;
            background-color: var(--accent-orange);
            color: white;
            border-radius: 10px;
        }
        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .editor-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .select-lang {
            padding: 6px 12px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        .select-lang:focus {
            border-color: var(--accent-blue);
        }
        .select-tag {
            padding: 6px 12px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            cursor: pointer;
            min-width: 100px;
        }
        .select-tag:focus {
            border-color: var(--accent-blue);
        }
        .select-tag:hover {
            border-color: var(--accent-blue);
        }
        .editor-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }
        .editor-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            overflow: hidden;
        }
        .editor-panel:first-child {
            flex: 1;
        }
        .editor-panel:last-child {
            flex: 1;
        }
        .editor-resizer {
            width: 4px;
            background-color: var(--border-color);
            cursor: col-resize;
            position: relative;
            z-index: 10;
            transition: background-color 0.2s;
        }
        .editor-resizer:hover {
            background-color: var(--accent-blue);
        }
        .editor-resizer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 100%;
            cursor: col-resize;
        }
        .code-input {
            width: 100%;
            height: 100%;
            padding: 16px;
            background-color: var(--bg-primary);
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            tab-size: 4;
            box-sizing: border-box;
        }
        .code-preview {
            width: 100%;
            height: 100%;
            display: flex;
            background-color: var(--bg-primary);
            overflow: hidden;
            border-left: 1px solid var(--border-color);
            font-size: 14px;
            line-height: 1.6;
            box-sizing: border-box;
        }
        .preview-code-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }
        .preview-code-content::-webkit-scrollbar {
            width: 6px;
        }
        .preview-code-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .preview-code-content::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 3px;
        }
        .preview-code-content::-webkit-scrollbar-thumb:hover {
            background-color: var(--text-secondary);
        }
        .code-preview code {
            white-space: pre-wrap;
            word-break: break-all;
            display: block;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }
        .ai-panel {
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: height 0.3s;
            height: 300px;
        }
        .ai-panel.collapsed {
            height: 48px;
        }
        .ai-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }
        .ai-panel-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .ai-badge {
            font-size: 10px;
            padding: 2px 6px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: white;
            border-radius: 4px;
            font-weight: 600;
        }
        .ai-panel-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .ai-panel-toggle {
            font-size: 18px;
            color: var(--text-muted);
            transition: transform 0.3s;
        }
        .ai-panel.collapsed .ai-panel-toggle {
            transform: rotate(-90deg);
        }
        .ai-panel-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .ai-controls {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .ai-btn {
            padding: 8px 16px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ai-btn:hover {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
            background-color: rgba(163, 113, 247, 0.1);
        }
        .ai-btn.active {
            background-color: rgba(163, 113, 247, 0.2);
            border-color: var(--accent-purple);
            color: var(--accent-purple);
        }
        .ai-result {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            font-size: 13px;
            color: var(--text-primary);
        }
        .ai-result .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--accent-purple);
            padding: 40px;
        }
        .ai-result .loading span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent-purple);
            border-radius: 50%;
            animation: bounce 1s infinite;
        }
        .ai-result .loading span:nth-child(2) { animation-delay: 0.1s; }
        .ai-result .loading span:nth-child(3) { animation-delay: 0.2s; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .ai-analysis {
            margin-bottom: 20px;
        }
        .ai-analysis h4 {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-purple);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ai-analysis p {
            color: var(--text-secondary);
            margin-bottom: 8px;
            line-height: 1.7;
        }
        .ai-analysis code {
            background-color: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--accent-cyan);
        }
        .ai-code-block {
            background-color: var(--bg-primary);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .ai-code-header {
            padding: 8px 12px;
            background-color: var(--bg-tertiary);
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ai-code-content {
            padding: 12px;
            font-family: inherit;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            color: var(--text-primary);
        }
        .form-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .form-modal.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background-color: var(--bg-secondary);
            border-radius: 12px;
            width: 500px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            transform: translateY(-20px);
            transition: transform 0.3s;
        }
        .form-modal.active .modal-content {
            transform: translateY(0);
        }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .modal-close {
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }
        .modal-close:hover {
            color: var(--text-primary);
        }
        .modal-body {
            padding: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent-blue);
        }
        .form-group textarea {
            height: 80px;
            resize: vertical;
        }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;

        </div>

                <div class="version-compare-header">

                    <div class="version-compare-actions">
                        <button class="btn btn-sm btn-primary" id="restoreVersionBtn">恢复选中版本</button>
                        <button class="btn btn-sm btn-secondary" id="closeCompareBtn">关闭对比</button>
                    </div>
                </div>
                <div class="version-compare-container">
                    <div class="version-compare-left" id="versionLeft"></div>

                    <div class="version-compare-right" id="versionRight"></div>

    <script>
        const STORAGE_KEY = 'ai_code_snippets';
        const TAGS_STORAGE_KEY = 'ai_code_tags';
        const THEME_STORAGE_KEY = 'ai_code_theme';
        let AVAILABLE_TAGS = loadTags();
        let snippets = [];
        let currentSnippetId = null;
        let aiPanelExpanded = true;

        function loadTheme() {
            const saved = localStorage.getItem(THEME_STORAGE_KEY);
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
                updateThemeIcon(saved);
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';

            if (newTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }

            localStorage.setItem(THEME_STORAGE_KEY, newTheme);
            updateThemeIcon(newTheme);
            showToast(newTheme === 'light' ? '已切换到浅色主题' : '已切换到深色主题', 'success');
        }

        function updateThemeIcon(theme) {
            const themeIcon = document.querySelector('.theme-icon');
            if (themeIcon) {
                themeIcon.textContent = theme === 'light' ? '☀️' : '🌙';
            }
        }

        function loadTags() {
            const saved = localStorage.getItem(TAGS_STORAGE_KEY);
            if (saved) {
                return JSON.parse(saved);
            }
            return [
                'JavaScript', 'TypeScript', 'HTML', 'CSS',
                'Vue', 'React', '工具函数', '性能优化',
                '组件', '模板', '样式', '按钮', 'API', 'Hooks', '未分类'
            ];
        }

        function saveTags() {
            localStorage.setItem(TAGS_STORAGE_KEY, JSON.stringify(AVAILABLE_TAGS));
            renderTags();
            renderTagSelect();
            renderSnippetTagSelect();
        }

        function addTag(tagName) {
            tagName = tagName.trim();
            if (!tagName) {
                showToast('请输入标签名称', 'error');
                return;
            }
            if (AVAILABLE_TAGS.includes(tagName)) {
                showToast('标签已存在', 'error');
                return;
            }
            AVAILABLE_TAGS.push(tagName);
            saveTags();
            showToast('标签已添加', 'success');
            elements.tagInput.value = '';
            renderTagManageList();
        }

        function deleteTag(tagName) {
            if (tagName === '未分类') {
                showToast('默认标签不能删除', 'error');
                return;
            }
            const count = snippets.filter(function(s) { return s.tags.includes(tagName); }).length;
            if (count > 0) {
                if (!confirm('该标签下有 ' + count + ' 个代码片段，确定删除吗？删除后这些片段将归类为"未分类"')) {
                    return;
                }
                snippets.forEach(function(s) {
                    const index = s.tags.indexOf(tagName);
                    if (index !== -1) {
                        s.tags[index] = '未分类';
                    }
                });
                saveSnippets();
            }
            AVAILABLE_TAGS = AVAILABLE_TAGS.filter(function(t) { return t !== tagName; });
            saveTags();
            showToast('标签已删除', 'success');
            renderTagManageList();
        }

        function editTag(oldName, newName) {
            newName = newName.trim();
            if (!newName) {
                showToast('请输入新标签名称', 'error');
                return;
            }
            if (oldName === '未分类') {
                showToast('默认标签不能修改', 'error');
                return;
            }
            if (AVAILABLE_TAGS.includes(newName) && newName !== oldName) {
                showToast('标签已存在', 'error');
                return;
            }
            const index = AVAILABLE_TAGS.indexOf(oldName);
            if (index !== -1) {
                AVAILABLE_TAGS[index] = newName;
            }
            snippets.forEach(function(s) {
                const tagIndex = s.tags.indexOf(oldName);
                if (tagIndex !== -1) {
                    s.tags[tagIndex] = newName;
                }
            });
            saveTags();
            saveSnippets();
            showToast('标签已修改', 'success');
            renderTagManageList();
        }

        function openTagManagePanel() {
            renderTagManageList();
            elements.tagManagePanel.classList.add('active');
        }

        function closeTagManagePanel() {
            elements.tagManagePanel.classList.remove('active');
        }

        function renderTagManageList() {
            if (AVAILABLE_TAGS.length === 0) {
                elements.tagManageList.innerHTML = '<div class="tag-manage-empty">暂无标签</div>';
                return;
            }

            let html = '';
            AVAILABLE_TAGS.forEach(function(tag) {
                const count = snippets.filter(function(s) { return s.tags.includes(tag); }).length;
                const isDefault = tag === '未分类';
                html += '<div class="tag-manage-item">' +
                    '<div style="display: flex; align-items: center;">' +
                    '<span class="tag-manage-item-name">' + tag + '</span>' +
                    '<span class="tag-manage-item-count">(' + count + ')</span>' +
                    (isDefault ? '<span style="font-size: 11px; color: var(--text-muted); margin-left: 8px;">默认</span>' : '') +
                    '</div>' +
                    '<div class="tag-manage-item-actions">' +
                    (!isDefault ? '<button class="btn btn-sm btn-secondary" onclick="startEditTag(\'' + tag + '\')">编辑</button>' : '') +
                    (!isDefault ? '<button class="btn btn-sm btn-danger" onclick="deleteTag(\'' + tag + '\')">删除</button>' : '') +
                    '</div>' +
                    '</div>';
            });
            elements.tagManageList.innerHTML = html;
        }

        function startEditTag(tagName) {
            const items = elements.tagManageList.querySelectorAll('.tag-manage-item');
            items.forEach(function(item) {
                const nameSpan = item.querySelector('.tag-manage-item-name');
                if (nameSpan && nameSpan.textContent === tagName) {

        function createVersion(snippet) {
            const version = {
                id: Date.now().toString(),
                code: snippet.code,
                title: snippet.title,
                language: snippet.language,
                createdAt: Date.now()
            };
            if (!snippet.versions) {
                snippet.versions = [];
            }
            snippet.versions.unshift(version);
            if (snippet.versions.length > 20) {
                snippet.versions = snippet.versions.slice(0, 20);
            }
            return version;
        }

        function viewVersion(versionId) {
            if (!currentSnippetId) return;

            const snippet = snippets.find(function(s) { return s.id === currentSnippetId; });
            if (!snippet || !snippet.versions) return;

            const versionIndex = snippet.versions.findIndex(function(v) { return v.id === versionId; });
            if (versionIndex === -1) return;

            const currentCode = snippet.code;
            const versionCode = snippet.versions[versionIndex].code;

            const diff = computeDiff(versionCode, currentCode);

            elements.versionLeft.innerHTML = '<pre style="font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all;">' + diff.old + '</pre>';
            elements.versionRight.innerHTML = '<pre style="font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all;">' + diff.new + '</pre>';
            elements.versionCompare.classList.add('active');
        }

        function computeDiff(oldCode, newCode) {
            const oldLines = oldCode.split('\n');
            const newLines = newCode.split('\n');

            let oldHtml = '';
            let newHtml = '';

            const maxLines = Math.max(oldLines.length, newLines.length);
            for (let i = 0; i < maxLines; i++) {
                const oldLine = oldLines[i] || '';
                const newLine = newLines[i] || '';

                if (oldLine === newLine) {
                    oldHtml += escapeHtml(unescapeHtml(oldLine)) + '\n';
                    newHtml += escapeHtml(unescapeHtml(newLine)) + '\n';
                } else {
                    if (oldLine && !newLines.includes(oldLine)) {
                        oldHtml += '<span class="version-diff-remove">' + escapeHtml(unescapeHtml(oldLine)) + '</span>\n';
                    } else if (oldLine) {
                        oldHtml += '<span class="version-diff-remove">' + escapeHtml(unescapeHtml(oldLine)) + '</span>\n';
                    } else {
                        oldHtml += '\n';
                    }

                    if (newLine && !oldLines.includes(newLine)) {
                        newHtml += '<span class="version-diff-add">' + escapeHtml(unescapeHtml(newLine)) + '</span>\n';
                    } else if (newLine) {
                        newHtml += '<span class="version-diff-add">' + escapeHtml(unescapeHtml(newLine)) + '</span>\n';
                    } else {
                        newHtml += '\n';
                    }
                }
            }

            return { old: oldHtml, new: newHtml };
        }

            const versionIndex = snippet.versions.findIndex(function(v) { return v.id === versionId; });

            const version = snippet.versions[versionIndex];

        function syncScroll() {

                const previewScrollTop = scrollPercentage * (previewContent.scrollHeight - previewContent.clientHeight);
                previewContent.scrollTop = previewScrollTop;
            });

                const scrollPercentage = previewContent.scrollTop / (previewContent.scrollHeight - previewContent.clientHeight);

        function highlightCode(code, lang) {
            if (!code) return '';
            
            code = code.replace(/&/g, '&amp;');
            code = code.replace(/</g, '&lt;');
            code = code.replace(/>/g, '&gt;');

            const placeholder = '\uFFFC';
            const matches = [];
            
            if (lang === 'javascript' || lang === 'typescript') {
                code = code.replace(/\/\/.*/g, function(m) { matches.push(m); return placeholder + (matches.length - 1); });
                code = code.replace(/\/\*[\s\S]*?\*\//g, function(m) { matches.push(m); return placeholder + (matches.length - 1); });
                code = code.replace(/(['"`])((?:\\.|[^\\])*?)\1/g, function(m) { matches.push(m); return placeholder + (matches.length - 1); });
                code = code.replace(/\/(?!\/)(\\\/|[^\/\n])*\/[gimuy]*/g, function(m) { matches.push(m); return placeholder + (matches.length - 1); });
                
                const keywords = ['function', 'const', 'let', 'var', 'return', 'if', 'else', 'for', 'while', 'switch', 'case', 'break', 'continue', 'class', 'import', 'export', 'default', 'from', 'async', 'await', 'new', 'this', 'try', 'catch', 'throw', 'typeof', 'instanceof', 'extends', 'super', 'static', 'get', 'set', 'delete', 'in', 'of', 'void', 'yield'];
                keywords.forEach(function(kw) {
                    code = code.replace(new RegExp('\\b(' + kw + ')\\b', 'g'), '<span style="color: #ff7b72;">$1</span>');
                });
                
                code = code.replace(/\b(\d+\.?\d*)\b/g, '<span style="color: #ffa657;">$1</span>');
                code = code.replace(/\b([a-zA-Z_$][a-zA-Z0-9_$]*)\s*(?=\()/g, '<span style="color: #d2a8ff;">$1</span>');
                code = code.replace(/\b(true|false|null|undefined|NaN|Infinity)\b/g, '<span style="color: #ffa657;">$1</span>');
                
            } else if (lang === 'html') {
                code = code.replace(/&lt;!--[\s\S]*?--&gt;/g, function(m) { matches.push(m); return placeholder + (matches.length - 1); });
                code = code.replace(/(['"`])((?:\\.|[^\\])*?)\1/g, function(m) { matches.push(m); return placeholder + (matches.length - 1); });
                code = code.replace(/(&lt;\/?)([a-zA-Z][a-zA-Z0-9]*)/g, '$1<span style="color: #ff7b72;">$2</span>');
                code = code.replace(/\s([a-zA-Z][a-zA-Z0-9_-]*)\s*=/g, ' <span style="color: #79c0ff;">$1</span>=');
                code = code.replace(/&gt;/g, '<span style="color: #ff7b72;">&gt;</span>');
                
            } else if (lang === 'css') {
                code = code.replace(/\/\*[\s\S]*?\*\//g, function(m) { matches.push({text: m, color: '#8b949e'}); return placeholder + (matches.length - 1); });
                code = code.replace(/(['"`])((?:\\.|[^\\])*?)\1/g, function(m) { matches.push({text: m, color: '#a5d6ff'}); return placeholder + (matches.length - 1); });
                code = code.replace(/:\s*([^;{}]+)/g, function(m, v) { matches.push({text: v.trim(), color: '#a5d6ff'}); return ': ' + placeholder + (matches.length - 1); });
                
                code = code.replace(/\b([a-zA-Z-][a-zA-Z0-9-]*)\s*(?=:)/g, '<span style="color: #79c0ff;">$1</span>');
                code = code.replace(/([.#]?[a-zA-Z][a-zA-Z0-9_-]*)\s*(?=\{)/g, '<span style="color: #ffa657;">$1</span>');
                code = code.replace(/@([a-zA-Z-]+)/g, '<span style="color: #d2a8ff;">@$1</span>');
                code = code.replace(/::?([a-zA-Z-]+)/g, '<span style="color: #d2a8ff;">::$1</span>');
                code = code.replace(/!important/g, '<span style="color: #ff7b72;">!important</span>');
                
            } else if (lang === 'vue') {
                code = code.replace(/&lt;!--[\s\S]*?--&gt;/g, function(m) { matches.push(m); return placeholder + (matches.length - 1); });
                code = code.replace(/(['"`])((?:\\.|[^\\])*?)\1/g, function(m) { matches.push(m); return placeholder + (matches.length - 1); });
                code = code.replace(/(&lt;\/?)(template|script|style|component)/g, '$1<span style="color: #ff7b72;">$2</span>');
                code = code.replace(/\b(v-bind|v-model|v-if|v-for|v-show|v-on|v-else|v-else-if|v-slot|v-html|v-text|@|:)\b/g, '<span style="color: #ff7b72;">$1</span>');
                code = code.replace(/\{\{([^}]+)\}\}/g, '<span style="color: #ffa657;">{{$1}}</span>');
                code = code.replace(/\b(ref|reactive|computed|watch|onMounted|onUnmounted|defineProps|defineEmits|nextTick)\b/g, '<span style="color: #d2a8ff;">$1</span>');
                code = code.replace(/&lt;([a-zA-Z][a-zA-Z0-9-]*)/g, '&lt;<span style="color: #ff7b72;">$1</span>');
                
            } else if (lang === 'react') {
                code = code.replace(/\/\/.*/g, function(m) { matches.push(m); return placeholder + (matches.length - 1); });
                code = code.replace(/\/\*[\s\S]*?\*\//g, function(m) { matches.push(m); return placeholder + (matches.length - 1); });
                code = code.replace(/(['"`])((?:\\.|[^\\])*?)\1/g, function(m) { matches.push(m); return placeholder + (matches.length - 1); });
                
                code = code.replace(/\b(useState|useEffect|useCallback|useMemo|useRef|useContext|useReducer|useLayoutEffect|useImperativeHandle|useDebugValue)\b/g, '<span style="color: #d2a8ff;">$1</span>');
                code = code.replace(/\b(const|let|var|function|return|import|export|from|default|async|await|class|extends|new|this|try|catch|throw)\b/g, '<span style="color: #ff7b72;">$1</span>');
                code = code.replace(/&lt;([A-Z][a-zA-Z0-9]*)/g, '&lt;<span style="color: #ffa657;">$1</span>');
                code = code.replace(/&lt;([a-z][a-zA-Z0-9]*)/g, '&lt;<span style="color: #ff7b72;">$1</span>');
                code = code.replace(/\b(true|false|null|undefined)\b/g, '<span style="color: #ffa657;">$1</span>');
                code = code.replace(/\b(\d+\.?\d*)\b/g, '<span style="color: #ffa657;">$1</span>');
                
            } else if (lang === 'json') {
                code = code.replace(/(['"`])((?:\\.|[^\\])*?)\1/g, function(m) { matches.push(m); return placeholder + (matches.length - 1); });
                code = code.replace(/"([^"]+)":/g, '<span style="color: #79c0ff;">"$1"</span>:');
                code = code.replace(/: "([^"]+)"/g, ': <span style="color: #a5d6ff;">"$1"</span>');
                code = code.replace(/: (\d+\.?\d*)/g, ': <span style="color: #ffa657;">$1</span>');
                code = code.replace(/: (true|false|null)/g, ': <span style="color: #ffa657;">$1</span>');
                code = code.replace(/\[|\]/g, '<span style="color: #ff7b72;">$&</span>');
                code = code.replace(/\{|\}/g, '<span style="color: #ff7b72;">$&</span>');
            }

            code = code.replace(new RegExp(placeholder + '(\\d+)', 'g'), function(match, index) {
                var item = matches[index];
                if (typeof item === 'object') {
                    return '<span style="color: ' + item.color + ';">' + item.text + '</span>';
                }
                return '<span style="color: #a5d6ff;">' + item + '</span>';
            });

            return code;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function unescapeHtml(text) {
            const div = document.createElement('div');
            div.innerHTML = text;
            return div.textContent;
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;

            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';

            return (date.getMonth() + 1) + '/' + date.getDate();
        }

        function detectBugs(code, lang) {
            const bugs = [];

            if (lang === 'javascript' || lang === 'typescript') {
                if (code.includes('==') && !code.includes('===')) {
                    bugs.push({ severity: 'medium', message: '使用了 == 比较运算符，建议使用 === 避免类型转换问题' });
                }
                if (code.includes('eval(')) {
                    bugs.push({ severity: 'high', message: '使用 eval() 可能导致安全风险和调试困难' });
                }
                if (code.includes('var ') && !code.includes('let ') && !code.includes('const ')) {
                    bugs.push({ severity: 'low', message: '仍在使用 var 声明变量，建议改用 let 或 const' });
                }
                if (code.includes('innerHTML') && !code.includes('textContent')) {
                    bugs.push({ severity: 'medium', message: '直接使用 innerHTML 可能导致 XSS 攻击风险' });
                }
                if (code.match(/setTimeout\s*\([^,]+,\s*0\s*\)/)) {
                    bugs.push({ severity: 'low', message: 'setTimeout(fn, 0) 建议改用 requestAnimationFrame 或 queueMicrotask' });
                }
                if (!code.includes('try') && (code.includes('fetch') || code.includes('axios'))) {
                    bugs.push({ severity: 'medium', message: '网络请求缺少错误处理，建议添加 try-catch' });
                }
                if (code.includes('for (') && code.includes('forEach')) {
                    bugs.push({ severity: 'low', message: '检测到混合使用 for 循环和 forEach，考虑统一' });
                }
            }

            if (bugs.length === 0) {
                return '<div class="ai-analysis"><h4>✅ Bug 检测结果</h4>' +
                    '<p style="color: var(--accent-green);">🎉 太棒了！未检测到明显的 Bug</p>' +
                    '<p><strong>建议：</strong></p>' +
                    '<p>您的代码整体质量不错，建议继续关注：</p>' +
                    '<ul><li>边界条件处理</li><li>异步错误处理</li><li>性能优化点</li></ul></div>';
            }

            let html = '<div class="ai-analysis"><h4>🐛 Bug 检测报告</h4>';
            bugs.forEach(function(bug, index) {
                const color = bug.severity === 'high' ? 'var(--accent-red)' : bug.severity === 'medium' ? 'var(--accent-orange)' : 'var(--accent-yellow)';
                html += '<div class="ai-bug-item" style="border-left: 3px solid ' + color + '; padding: 8px 12px; margin: 8px 0; background: var(--bg-tertiary); border-radius: 4px;">' +
                    '<p><strong style="color: ' + color + ';">' + (bug.severity === 'high' ? '⚠️ 高危' : bug.severity === 'medium' ? '⚡ 中危' : '💡 建议') + '</strong></p>' +
                    '<p>' + bug.message + '</p></div>';
            });
            html += '</div>';
            return html;
        }

        function securityCheck(code, lang) {
            const issues = [];

            if (lang === 'javascript' || lang === 'typescript') {
                if (code.includes('eval(')) {
                    issues.push({ severity: 'critical', message: 'eval() 可能执行任意代码，是严重的安全隐患' });
                }
                if (code.includes('innerHTML')) {
                    issues.push({ severity: 'high', message: 'innerHTML 可能导致 XSS 跨站脚本攻击' });
                }
                if (code.match(/localStorage\.setItem/) && !code.includes('btoa') && !code.includes('encrypt')) {
                    issues.push({ severity: 'medium', message: 'localStorage 存储敏感数据存在风险，建议加密' });
                }
                if (code.includes('password') && !code.includes('btoa') && !code.includes('encrypt')) {
                    issues.push({ severity: 'high', message: '密码字段未加密处理，存在安全隐患' });
                }
                if (code.includes('document.cookie')) {
                    issues.push({ severity: 'medium', message: '直接读取 cookie 可能存在安全风险' });
                }
                if (code.includes('http://') && !code.includes('https://')) {
                    issues.push({ severity: 'medium', message: '使用了不安全的 HTTP 协议，建议使用 HTTPS' });
                }
                if (code.match(/SQL\s+SELECT|INSERT|UPDATE|DELETE/i) && !code.includes('?')) {
                    issues.push({ severity: 'critical', message: 'SQL 语句使用字符串拼接，存在 SQL 注入风险' });
                }
                if (code.includes('crypto') && code.includes('md5')) {
                    issues.push({ severity: 'medium', message: 'MD5 已被认为不安全，建议使用 SHA-256 或更强算法' });
                }
            }

            if (issues.length === 0) {
                return '<div class="ai-analysis"><h4>✅ 安全检测结果</h4>' +
                    '<p style="color: var(--accent-green);">🎉 未检测到明显的安全问题</p>' +
                    '<p><strong>安全建议：</strong></p>' +
                    '<ul><li>使用 HTTPS 协议</li><li>对用户输入进行验证和过滤</li><li>使用参数化查询</li><li>定期更新依赖库</li></ul></div>';
            }

            let html = '<div class="ai-analysis"><h4>🔒 安全检测报告</h4>';
            issues.forEach(function(issue) {
                const color = issue.severity === 'critical' ? 'var(--accent-red)' : issue.severity === 'high' ? 'var(--accent-orange)' : 'var(--accent-yellow)';
                html += '<div class="ai-security-item" style="border-left: 3px solid ' + color + '; padding: 8px 12px; margin: 8px 0; background: var(--bg-tertiary); border-radius: 4px;">' +
                    '<p><strong style="color: ' + color + ';">' + (issue.severity === 'critical' ? '🔴 严重' : issue.severity === 'high' ? '⚠️ 高危' : '💡 中危') + '</strong></p>' +
                    '<p>' + issue.message + '</p></div>';
            });
            html += '</div>';
            return html;
        }

        function performanceOptimization(code, lang) {
            const suggestions = [];

            if (lang === 'javascript' || lang === 'typescript') {
                if (code.includes('querySelectorAll') && code.match(/forEach|for\s*\(/)) {
                    suggestions.push({ priority: 'high', message: '频繁查询 DOM 元素，建议缓存选择器结果' });
                }
                if (code.includes('addEventListener') && !code.includes('removeEventListener')) {
                    suggestions.push({ priority: 'medium', message: '添加了事件监听但未清理，可能导致内存泄漏' });
                }
                if (code.includes('setInterval') && !code.includes('clearInterval')) {
                    suggestions.push({ priority: 'medium', message: '使用了 setInterval 但未清理，考虑使用 setTimeout 递归或清理定时器' });
                }
                if (code.match(/for\s*\([^)]+\)\s*\{\s*if/)) {
                    suggestions.push({ priority: 'medium', message: '循环中有条件判断，考虑使用 filter() 或 find() 替代' });
                }
                if (code.includes('JSON.parse') && code.includes('JSON.stringify')) {
                    suggestions.push({ priority: 'low', message: '频繁的 JSON 序列化/反序列化，考虑优化数据结构' });
                }
                if (code.match(/Array\.(from|of)\(/)) {
                    suggestions.push({ priority: 'low', message: '使用了 Array.from 或 Array.of，性能可进一步优化' });
                }
                if (code.includes('async') && code.includes('Promise.all')) {
                    suggestions.push({ priority: 'medium', message: 'Promise.all 并行执行是个好选择 👍' });
                }
                if (code.match(/const\s+\w+\s*=\s*\[\]\.concat|\w+\s*=\s*\[\]\.push/)) {
                    suggestions.push({ priority: 'low', message: '数组拼接考虑使用扩展运算符 [...arr1, ...arr2]' });
                }
            }

            if (suggestions.length === 0) {
                return '<div class="ai-analysis"><h4>⚡ 性能优化建议</h4>' +
                    '<p style="color: var(--accent-green);">🎉 您的代码性能表现良好</p>' +
                    '<p><strong>进一步优化方向：</strong></p>' +
                    '<ul><li>使用 Web Workers 处理耗时计算</li><li>考虑虚拟滚动处理大量数据</li><li>使用防抖节流优化频繁触发的事件</li><li>合理使用懒加载</li></ul></div>';
            }

            let html = '<div class="ai-analysis"><h4>⚡ 性能优化建议</h4>';
            suggestions.forEach(function(s) {
                const color = s.priority === 'high' ? 'var(--accent-red)' : s.priority === 'medium' ? 'var(--accent-orange)' : 'var(--accent-blue)';
                html += '<div style="border-left: 3px solid ' + color + '; padding: 8px 12px; margin: 8px 0; background: var(--bg-tertiary); border-radius: 4px;">' +
                    '<p><strong style="color: ' + color + ';">' + (s.priority === 'high' ? '🔴 高优先级' : s.priority === 'medium' ? '⚡ 中优先级' : '💡 低优先级') + '</strong></p>' +
                    '<p>' + s.message + '</p></div>';
            });
            html += '</div>';
            return html;
        }

        function generateExplanation(code, lang) {

                        '<p><strong>使用方法：</strong><code>const throttledFn = throttle(yourFunction, 100);</code></p>' +

        }

        function toggleComment() {
            const textarea = elements.codeInput;
            const lang = elements.langSelect.value;
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const code = textarea.value;

            let result = '';
            let newStart = start;
            let newEnd = end;

            if (start === end) {
                const lines = code.substring(0, start).split('\n');
                const currentLineNum = lines.length - 1;
                const allLines = code.split('\n');
                const lineStart = code.lastIndexOf('\n', start - 1) + 1;
                const lineEnd = code.indexOf('\n', start);
                const lineContent = lineEnd === -1 ? code.substring(lineStart) : code.substring(lineStart, lineEnd);

                let commentedLine = toggleLineComment(lineContent, lang);
                result = code.substring(0, lineStart) + commentedLine + (lineEnd === -1 ? '' : code.substring(lineEnd));

                if (commentedLine.length > lineContent.length) {
                    newStart = start + (commentedLine.length - lineContent.length);
                    newEnd = end + (commentedLine.length - lineContent.length);
                } else {
                    newStart = start - (lineContent.length - commentedLine.length);
                    newEnd = end - (lineContent.length - commentedLine.length);
                }
            } else {
                const selectedText = code.substring(start, end);
                const lines = selectedText.split('\n');

                const areAllCommented = lines.every(function(line) {
                    return isLineCommented(line, lang);
                });

                let processedLines;
                if (areAllCommented) {
                    processedLines = lines.map(function(line) {
                        return removeLineComment(line, lang);
                    });
                } else {
                    processedLines = lines.map(function(line) {
                        return addLineComment(line, lang);
                    });
                }

                const processedText = processedLines.join('\n');
                result = code.substring(0, start) + processedText + code.substring(end);

                if (processedText.length > selectedText.length) {
                    newEnd = end + (processedText.length - selectedText.length);
                } else {
                    newEnd = end - (selectedText.length - processedText.length);
                }
            }

            textarea.value = result;
            textarea.setSelectionRange(newStart, newEnd);
            updatePreview();
        }

        function addLineComment(line, lang) {
            const trimmed = line.trim();
            const indent = line.substring(0, line.length - trimmed.length);

            if (lang === 'javascript' || lang === 'typescript' || lang === 'vue' || lang === 'react') {
                return indent + '// ' + trimmed;
            } else if (lang === 'html') {
                return indent + '<!-- ' + trimmed + ' -->';
            } else if (lang === 'css') {
                return indent + '/* ' + trimmed + ' */';
            } else if (lang === 'json') {
                return indent + '// ' + trimmed;
            }
            return line;
        }

        function removeLineComment(line, lang) {
            const trimmed = line.trim();

            if (lang === 'javascript' || lang === 'typescript' || lang === 'vue' || lang === 'react') {
                if (trimmed.startsWith('// ')) {
                    return line.replace(/^\s*\/\/\s?/, '');
                }
            } else if (lang === 'html') {
                if (trimmed.startsWith('<!-- ') && trimmed.endsWith(' -->')) {
                    return line.replace(/^\s*<!--\s?/, '').replace(/\s?-->$/, '');
                }
            } else if (lang === 'css') {
                if (trimmed.startsWith('/* ') && trimmed.endsWith(' */')) {
                    return line.replace(/^\s*\/\*\s?/, '').replace(/\s?\*\/$/, '');
                }
            } else if (lang === 'json') {
                if (trimmed.startsWith('// ')) {
                    return line.replace(/^\s*\/\/\s?/, '');
                }
            }
            return line;
        }

        function toggleLineComment(line, lang) {
            if (isLineCommented(line, lang)) {
                return removeLineComment(line, lang);
            }
            return addLineComment(line, lang);
        }

        function isLineCommented(line, lang) {
            const trimmed = line.trim();

            if (lang === 'javascript' || lang === 'typescript' || lang === 'vue' || lang === 'react') {
                return trimmed.startsWith('//');
            } else if (lang === 'html') {
                return trimmed.startsWith('<!--');
            } else if (lang === 'css') {
                return trimmed.startsWith('/*');
            } else if (lang === 'json') {
                return trimmed.startsWith('//');
            }
            return false;
        }

            if (!currentSnippetId) {
                showToast('请先选择一个代码片段', 'error');
                return;
            }
            const snippet = snippets.find(function(s) { return s.id === currentSnippetId; });
            snippet.archived = true;
            snippet.updatedAt = Date.now();
            saveSnippets();
            showToast('已删除到回收站', 'success');
            currentSnippetId = null;
            elements.snippetTitleInput.value = '';
            elements.codeInput.value = '';
            updatePreview();
        });

        function restoreSnippet(id) {
            const snippet = snippets.find(function(s) { return s.id === id; });
            if (snippet) {
                snippet.archived = false;
                snippet.updatedAt = Date.now();
                saveSnippets();
                showToast('已恢复', 'success');
            }
        }

        function deleteSnippetPermanently(id) {
            if (confirm('确定要永久删除这个代码片段吗？此操作无法撤销。')) {
                snippets = snippets.filter(function(s) { return s.id !== id; });
                if (currentSnippetId === id) {
                    currentSnippetId = null;
                    elements.snippetTitleInput.value = '';
                    elements.codeInput.value = '';
                    updatePreview();
                }
                saveSnippets();
                showToast('已永久删除', 'success');
            }
        }

        elements.saveBtn.addEventListener('click', function() {
            const title = elements.snippetTitleInput.value.trim();
            const code = elements.codeInput.value.trim();

            if (!title) {
                showToast('请输入片段标题', 'error');
                return;
            }
            if (!code) {
                showToast('请输入代码内容', 'error');
                return;
            }

            if (currentSnippetId) {
                const snippet = snippets.find(function(s) { return s.id === currentSnippetId; });
                if (snippet.code !== code || snippet.title !== title || snippet.language !== elements.langSelect.value) {
                    createVersion(snippet);
                }
                snippet.title = title;
                snippet.code = code;
                snippet.language = elements.langSelect.value;
                snippet.updatedAt = Date.now();
                showToast('片段已更新', 'success');
            } else {
                const newSnippet = {
                    id: Date.now().toString(),
                    title: title,
                    code: code,
                    language: elements.langSelect.value,
                    tags: ['未分类'],
                    favorite: false,
                    archived: false,
                    createdAt: Date.now(),
                    updatedAt: Date.now(),
                    versions: [{
                        id: Date.now().toString(),
                        code: code,
                        title: title,
                        language: elements.langSelect.value,
                        createdAt: Date.now()
                    }]
                };
                snippets.push(newSnippet);
                currentSnippetId = newSnippet.id;
                showToast('片段已保存', 'success');
            }
            saveSnippets();
        });

        elements.themeToggleBtn.addEventListener('click', function() {
            toggleTheme();
        });

        elements.newSnippetBtn.addEventListener('click', function() {
            elements.modalTitle.value = '';
            elements.modalLang.value = 'javascript';
            elements.modalTag.value = '未分类';
            elements.modalCode.value = '';
            elements.newSnippetModal.classList.add('active');
        });

        function closeModal() {
            elements.newSnippetModal.classList.remove('active');
        }

        elements.closeModal.addEventListener('click', closeModal);
        elements.cancelModal.addEventListener('click', closeModal);

        elements.confirmModal.addEventListener('click', function() {
            const title = elements.modalTitle.value.trim();
            const code = elements.modalCode.value.trim();
            const lang = elements.modalLang.value;
            const tag = elements.modalTag.value;

            if (!title) {
                showToast('请输入片段标题', 'error');
                return;
            }
            if (!code) {
                showToast('请输入代码内容', 'error');
                return;
            }

            const newSnippet = {
                id: Date.now().toString(),
                title: title,
                code: code,
                language: lang,
                tags: [tag],
                favorite: false,
                archived: false,
                createdAt: Date.now(),
                updatedAt: Date.now()
            };
            snippets.push(newSnippet);
            currentSnippetId = newSnippet.id;
            saveSnippets();
            loadSnippet(newSnippet.id);
            closeModal();
            showToast('片段已创建', 'success');
        });

        elements.aiPanelHeader.addEventListener('click', function() {
            aiPanelExpanded = !aiPanelExpanded;
            if (aiPanelExpanded) {
                elements.aiPanel.classList.remove('collapsed');
            } else {
                elements.aiPanel.classList.add('collapsed');
            }
        });

        elements.aiAnalyzeBtn.addEventListener('click', function() {
            const code = elements.codeInput.value;
            const lang = elements.langSelect.value;
            if (!code) {
                showToast('请先输入或选择代码', 'error');
                return;
            }
            simulateAIProcessing('分析代码', code, lang);
        });

        elements.aiBugBtn.addEventListener('click', function() {
            const code = elements.codeInput.value;
            const lang = elements.langSelect.value;
            if (!code) {
                showToast('请先输入或选择代码', 'error');
                return;
            }
            simulateAIProcessing('Bug检测', code, lang);
        });

        elements.aiSecurityBtn.addEventListener('click', function() {
            const code = elements.codeInput.value;
            const lang = elements.langSelect.value;
            if (!code) {
                showToast('请先输入或选择代码', 'error');
                return;
            }
            simulateAIProcessing('安全检测', code, lang);
        });

        elements.aiPerformanceBtn.addEventListener('click', function() {
            const code = elements.codeInput.value;
            const lang = elements.langSelect.value;
            if (!code) {
                showToast('请先输入或选择代码', 'error');
                return;
            }
            simulateAIProcessing('性能优化', code, lang);
        });

        elements.aiExplainBtn.addEventListener('click', function() {
            const code = elements.codeInput.value;
            const lang = elements.langSelect.value;
            if (!code) {
                showToast('请先输入或选择代码', 'error');
                return;
            }
            simulateAIProcessing('生成说明', code, lang);
        });

        let isResizing = false;
        let startX = 0;
        let startWidth = 0;

        elements.tagsManageBtn.addEventListener('click', function() {
            openTagManagePanel();
        });

        elements.closeTagManagePanel.addEventListener('click', function() {
            closeTagManagePanel();
        });

        elements.snippetTagSelect.addEventListener('change', function() {
            updateSnippetTag(elements.snippetTagSelect.value);
        });

        elements.addTagBtn.addEventListener('click', function() {
            addTag(elements.tagInput.value);
        });

        elements.tagInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                addTag(elements.tagInput.value);
            }
        });

        elements.versionBtn.addEventListener('click', function() {
            openVersionPanel();
        });

        elements.closeVersionPanel.addEventListener('click', function() {
            closeVersionPanel();
        });

        elements.restoreVersionBtn.addEventListener('click', function() {
            const selectedVersion = document.querySelector('.version-item.selected');
            if (selectedVersion) {
                const versionId = selectedVersion.dataset.versionId;
                restoreVersion(versionId);
            }
        });

        elements.closeCompareBtn.addEventListener('click', function() {
            elements.versionCompare.classList.remove('active');
        });

        elements.editorResizer.addEventListener('mousedown', function(e) {
            isResizing = true;
            startX = e.clientX;
            startWidth = elements.editorPanel.offsetWidth;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', function(e) {
            if (!isResizing) return;

            const containerWidth = elements.editorPanel.parentElement.offsetWidth;
            const resizerWidth = elements.editorResizer.offsetWidth;
            const deltaX = e.clientX - startX;
            const newWidth = startWidth + deltaX;
            const minWidth = 100;
            const maxWidth = containerWidth - minWidth - resizerWidth;

            let finalWidth = Math.max(minWidth, Math.min(newWidth, maxWidth));
            let percentage = (finalWidth / (containerWidth - resizerWidth)) * 100;

            elements.editorPanel.style.flex = '0 0 ' + percentage + '%';
            elements.previewPanel.style.flex = '0 0 ' + (100 - percentage) + '%';
        });

        document.addEventListener('mouseup', function() {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            }
        });

        elements.editorResizer.addEventListener('touchstart', function(e) {
            isResizing = true;
            startX = e.touches[0].clientX;
            startWidth = elements.editorPanel.offsetWidth;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('touchmove', function(e) {
            if (!isResizing) return;

            const containerWidth = elements.editorPanel.parentElement.offsetWidth;
            const resizerWidth = elements.editorResizer.offsetWidth;
            const deltaX = e.touches[0].clientX - startX;
            const newWidth = startWidth + deltaX;
            const minWidth = 100;
            const maxWidth = containerWidth - minWidth - resizerWidth;

            let finalWidth = Math.max(minWidth, Math.min(newWidth, maxWidth));
            let percentage = (finalWidth / (containerWidth - resizerWidth)) * 100;

            elements.editorPanel.style.flex = '0 0 ' + percentage + '%';
            elements.previewPanel.style.flex = '0 0 ' + (100 - percentage) + '%';
        });

        document.addEventListener('touchend', function() {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            }
        });

        loadTheme();
        loadSnippets();
        renderSnippetTagSelect();
        syncScroll();
    </script>
</body>
</html>
