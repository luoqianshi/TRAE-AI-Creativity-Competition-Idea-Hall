function Ingest() {
  const [isDragging, setIsDragging] = useState(false);

  const handleDrop = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    setIsDragging(false);
    setUploading(true);
    setTimeout(() => { setUploading(false); setUploaded(true); }, 2000);
  };

  return h('div', null,
    h('div', { className: 'mb-6' },
      h('h1', { className: 'page-title' }, '资料入库'),

    h('div', {

      onDragOver: (e) => { e.preventDefault(); setIsDragging(true); },

      onDrop: handleDrop
    },
      h('div', { className: 'upload-icon' }, h(Icons.Upload)),

function Ask() {
  const [query, setQuery] = useState('');
  const [depth, setDepth] = useState('evidence');
  const [isLoading, setIsLoading] = useState(false);
  const [result, setResult] = useState(contextPacks[0]);

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!query.trim()) return;
    setIsLoading(true);
    await new Promise((resolve) => setTimeout(resolve, 1500));
    const matchedResult = contextPacks.find(cp => cp.query.toLowerCase().includes(query.toLowerCase())) || contextPacks[0];
    setResult(matchedResult);
    setIsLoading(false);
  };

  return h('div', null,
    h('div', { className: 'mb-6' },
      h('h1', { className: 'page-title' }, '研知问答'),
      h('p', { className: 'page-subtitle' }, '通过对话了解知识库信息，支持分层披露')
    ),
    h('div', { className: 'ask-grid' },
      h('div', { className: 'card' },
        h('h2', { className: 'section-title mb-4' }, '提问'),
        h('form', { onSubmit: handleSubmit, style: { display: 'flex', flexDirection: 'column', gap: '16px' } },
          h('textarea', { value: query, onChange: (e) => setQuery(e.target.value), placeholder: '输入你的问题，例如：LLM Agent 的记忆机制有哪些？', rows: 3, className: 'textarea' }),
          h('div', { className: 'form-row' },
            h('select', { value: depth, onChange: (e) => setDepth(e.target.value), className: 'depth-select' },
              h('option', { value: 'conclusion' }, '结论层 - 只返回核心结论'),
              h('option', { value: 'evidence' }, '证据层 - 结论 + 支持证据'),
              h('option', { value: 'sources' }, '来源层 - 证据 + 原始来源引用'),
              h('option', { value: 'context' }, '上下文层 - 完整上下文包')
            ),
            h('button', { type: 'submit', className: 'btn btn-primary', disabled: isLoading || !query.trim() },
              isLoading ? h(React.Fragment, null, h(Icons.Loader), '查询中...') : h(React.Fragment, null, h(Icons.Send), '查询')
            )
          )
        ),
        result ? h('div', { className: 'result-divider' },
          h('div', { className: 'result-header' },
            h('span', { style: { color: '#4f46e5' } }, h(Icons.MessageSquare)),
            h('h3', null, '查询结果'),
            h('span', { className: 'badge badge-gray' }, depthLabels[depth].label)
          ),
          h('div', { className: 'conclusion-box' },
            h('p', { className: 'conclusion-text' }, result.conclusion)
          ),
          (depth === 'evidence' || depth === 'sources' || depth === 'context') ? h('div', { className: 'evidence-block' },
            h('h4', null, '支持证据'),
            h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } },
              result.evidence.map((ev, idx) =>
                h('div', { key: idx, className: 'evidence-card' },
                  h('p', { className: 'evidence-card-text' }, ev.claim),
                  ev.page ? h('p', { className: 'evidence-card-meta' }, '来源: ' + ev.source + ', 页码 ' + ev.page) : null
                )
              )
            )
          ) : null,
          h('div', { className: 'confidence-row' },
            h('span', { style: { fontSize: '14px', color: '#4b5563' } }, '置信度:'),
            h('div', { className: 'confidence-bar' },
              h('div', { className: 'confidence-fill', style: { width: (result.confidence * 100) + '%' } })
            ),
            h('span', { className: 'confidence-value' }, Math.round(result.confidence * 100) + '%')
          )
        ) : null
      ),
      h('div', null,
        h('div', { className: 'sidebar-card' },
          h('h3', null, '示例问题'),
          h('div', null,
            ['LLM Agent 的记忆机制有哪些？', 'MCP 协议支持哪些工具类型？', '如何评估 Agent 系统的可靠性？', 'Skill Graph 如何实现上下文路由？'].map(q =>
              h('button', { key: q, className: 'example-btn', onClick: () => setQuery(q) }, q)
            )
          )
        ),
        h('div', { className: 'sidebar-card' },
          h('h3', null, '分层披露说明'),
          h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px', fontSize: '14px' } },
            h('div', { className: 'depth-info' },
              h('span', { className: 'depth-tag' }, '结论层'),
              h('span', { style: { color: '#4b5563' } }, '直接返回核心结论')
            ),
            h('div', { className: 'depth-info' },
              h('span', { className: 'depth-tag' }, '证据层'),
              h('span', { style: { color: '#4b5563' } }, '结论 + 支持证据')
            ),
            h('div', { className: 'depth-info' },
              h('span', { className: 'depth-tag' }, '来源层'),
              h('span', { style: { color: '#4b5563' } }, '证据 + 原始来源')
            ),
            h('div', { className: 'depth-info' },
              h('span', { className: 'depth-tag' }, '上下文层'),
              h('span', { style: { color: '#4b5563' } }, '完整上下文包')
            )
          )
        )
      )
    )
  );
}

function AgentAPI() {
  const [activeTab, setActiveTab] = useState('request');
  const [isSimulating, setIsSimulating] = useState(false);
  const [copied, setCopied] = useState(false);

  const exampleRequest = 'POST /api/query\nContent-Type: application/json\n\n{\n  "query": "LLM Agent 的记忆机制有哪些？",\n  "depth": "evidence",\n  "maxResults": 5\n}';

  const handleCopy = () => {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(exampleRequest).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      }).catch(() => {});
    }
  };

  const handleSimulate = async () => {
    setIsSimulating(true);
    await new Promise((resolve) => setTimeout(resolve, 2000));
    setIsSimulating(false);
    setActiveTab('response');
  };

  return h('div', null,
    h('div', { className: 'mb-6' },
      h('h1', { className: 'page-title' }, 'Agent API'),
      h('p', { className: 'page-subtitle' }, '通过 API 让 Agent 便捷调用研知库知识')
    ),
    h('div', { className: 'card mb-6' },
      h('h2', { className: 'section-title mb-4' }, 'API 概览'),
      h('div', { className: 'api-overview' },
        h('div', { className: 'api-field' },
          h('div', { className: 'field-label' }, '端点'),
          h('code', { className: 'field-value' }, 'POST /api/query')
        ),
        h('div', { className: 'api-field' },
          h('div', { className: 'field-label' }, '认证'),
          h('code', { className: 'field-value' }, 'API Key in Header')
        ),
        h('div', { className: 'api-field' },
          h('div', { className: 'field-label' }, '内容类型'),
          h('code', { className: 'field-value' }, 'application/json')
        ),
        h('div', { className: 'api-field' },
          h('div', { className: 'field-label' }, '返回格式'),
          h('code', { className: 'field-value' }, 'ContextPack JSON')
        )
      )
    ),
    h('div', { className: 'card', style: { padding: 0, overflow: 'hidden', marginBottom: '24px' } },
      h('div', { className: 'tabs' },
        h('button', { className: 'tab ' + (activeTab === 'request' ? 'active' : ''), onClick: () => setActiveTab('request') }, '请求示例'),
        h('button', { className: 'tab ' + (activeTab === 'response' ? 'active' : ''), onClick: () => setActiveTab('response') }, '响应示例')
      ),
      h('div', { className: 'tab-content' },
        activeTab === 'request' ?
          h('div', null,
            h('div', { className: 'code-header' },
              h('h3', { style: { fontWeight: 500, color: '#111827' } }, '请求格式'),
              h('button', { className: 'copy-btn', onClick: handleCopy },
                copied ? h(React.Fragment, null, h(Icons.Check), '已复制') : h(React.Fragment, null, h(Icons.Copy), '复制')
              )
            ),
            h('pre', { className: 'code-block' }, h('code', null, exampleRequest)),
            h('button', { className: 'btn btn-primary mt-6', onClick: handleSimulate, disabled: isSimulating },
              isSimulating ? h(React.Fragment, null, h(Icons.Loader), '模拟调用中...') : h(React.Fragment, null, h(Icons.Play), '模拟 API 调用')
            )
          ) :
          h('div', null,
            h('h3', { style: { fontWeight: 500, color: '#111827', marginBottom: '16px' } }, '响应格式 (ContextPack)'),
            h('pre', { className: 'code-block' }, h('code', null, JSON.stringify(contextPacks[0], null, 2)))
          )
      )
    ),
    h('div', { className: 'card' },
      h('h2', { className: 'section-title mb-4' }, 'depth 参数选项'),
      h('div', { className: 'depth-grid' },
        [{ value: 'conclusion', label: '结论层', desc: '只返回结论' },{ value: 'evidence', label: '证据层', desc: '结论 + 证据' },{ value: 'sources', label: '来源层', desc: '证据 + 来源' },{ value: 'context', label: '上下文层', desc: '完整上下文' }].map(opt =>
          h('div', { key: opt.value, className: 'depth-option' },
            h('code', { className: 'depth-code' }, opt.value),
            h('p', { className: 'depth-option-label' }, opt.label),
            h('p', { className: 'depth-option-desc' }, opt.desc)
          )
        )
      )
    )
  );
}

function ContextPackPage() {
  const [expanded, setExpanded] = useState('cp_001');

  return h('div', null,
    h('div', { className: 'mb-6' },
      h('h1', { className: 'page-title' }, '上下文包'),
      h('p', { className: 'page-subtitle' }, 'Agent 调用返回的结构化上下文包示例')
    ),
    h('div', { className: 'card mb-6' },
      h('h2', { className: 'section-title mb-4 cp-intro' },
        h('span', { className: 'cp-intro-icon' }, h(Icons.Package)),
        '什么是 Context Pack？'
      ),
      h('p', { className: 'context-text' }, 'Context Pack 是研知库返回给 Agent 的结构化上下文单元。它包含针对特定查询的核心结论、支持证据、来源引用和完整上下文，支持分层披露机制，让 Agent 可以按需获取不同深度的信息。')
    ),
    h('div', null,
      contextPacks.map(cp =>
        h('div', { key: cp.id, className: 'cp-card' },
          h('div', { className: 'cp-header', onClick: () => setExpanded(expanded === cp.id ? null : cp.id) },
            h('div', { className: 'cp-header-row' },
              h('div', { style: { flex: 1 } },
                h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '8px' } },
                  h('span', { className: 'badge badge-indigo cp-id' }, cp.id),
                  h('span', { className: 'cp-confidence' }, '置信度: ' + Math.round(cp.confidence * 100) + '%')
                ),
                h('h3', { className: 'cp-query' }, cp.query),
                h('p', { className: 'cp-conclusion-preview' }, cp.conclusion)
              ),
              h('button', { className: 'cp-toggle' }, expanded === cp.id ? h(Icons.ChevronUp) : h(Icons.ChevronDown))
            )
          ),
          expanded === cp.id ? h('div', { className: 'cp-body' },
            h('div', { className: 'cp-section' },
              h('h4', null, '核心结论'),
              h('div', { className: 'cp-conclusion-box' }, h('p', { className: 'cp-conclusion-text' }, cp.conclusion))
            ),
            h('div', { className: 'cp-section' },
              h('h4', null, '证据列表'),
              h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } },
                cp.evidence.map((ev, idx) =>
                  h('div', { key: idx, className: 'cp-evidence' },
                    h('p', { className: 'cp-evidence-text' }, ev.claim),
                    h('div', { className: 'cp-evidence-meta' },
                      h('span', null, '来源: ' + ev.source),
                      ev.page ? h('span', null, '页码: ' + ev.page) : null
                    )
                  )
                )
              )
            ),
            h('div', { className: 'cp-section' },
              h('h4', null, '置信度'),
              h('div', { className: 'cp-bar-row' },
                h('div', { className: 'cp-bar' },
                  h('div', { className: 'cp-bar-fill', style: { width: (cp.confidence * 100) + '%' } })
                ),
                h('span', { className: 'cp-confidence-text' }, cp.confidence.toFixed(2) + ' (' + Math.round(cp.confidence * 100) + '%)')
              )
            )
          ) : null
        )
      )
    )
  );
}

function App() {
  const [currentPage, setCurrentPage] = useState('dashboard');
  const handleNavigate = (page) => setCurrentPage(page);
  const renderPage = () => {
    switch (currentPage) {
      case 'dashboard': return h(Dashboard);
      case 'ingest': return h(Ingest);
      case 'library': return h(Library, { onNavigate: handleNavigate });
      case 'card': return h(KnowledgeCardPage);
      case 'ask': return h(Ask);
      case 'api': return h(AgentAPI);
      case 'context-pack': return h(ContextPackPage);
      default: return h(Dashboard);
    }
  };
  return h(Layout, { currentPage, onNavigate: handleNavigate }, renderPage());
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(App));
  </script>
</body>
