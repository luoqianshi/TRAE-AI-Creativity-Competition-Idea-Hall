<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情绪之树</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f0e1;
    font-family: "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* 左右两栏布局 */
  .main-layout {
    display: flex;
    width: 100%;
    min-height: 100vh;
  }
  .left-panel {
    width: 65%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 20px;
  }
  .right-panel {
    width: 35%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 30px;
    background: rgba(255,255,255,0.25);
    border-left: 1px solid rgba(0,0,0,0.06);
  }
  /* 滑块控件区域 */
  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.6);
    padding: 12px 28px;
    border-radius: 30px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .controls label {
    font-size: 16px;
    color: #5a4a3a;
    font-weight: bold;
    white-space: nowrap;
  }
  .controls input[type="range"] {
    width: 220px;
    accent-color: #4a7c3f;
    cursor: pointer;
  }
  .mood-text {
    font-size: 13px;
    color: #8a7a6a;
    min-width: 60px;
    text-align: center;
  }
  #canvas {
    display: block;
    margin-top: 10px;
  }

  /* ============ 模式切换标签 ============ */
  .mode-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .mode-tab {
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    border: 2px solid #bbb;
    background: #fff;
    color: #6a5a4a;
    font-family: inherit;
    transition: all 0.2s;
  }
  .mode-tab:hover {
    border-color: #4a7cc3;
  }
  .mode-tab.active {
    background: #4a7cc3;
    color: #fff;
    border-color: #4a7cc3;
  }

  /* ============ 模式内容区 ============ */
  .mode-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 1;
    transition: opacity 0.2s ease;
  }
  .mode-content.hidden {
    display: none;
  }
  .mode-content.fading {
    opacity: 0;
  }

  /* ============ 涂鸦区样式 ============ */
  .doodle-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .doodle-title {
    font-size: 18px;
    color: #5a4a3a;
    font-weight: bold;
    margin-bottom: 4px;
  }
  /* 画笔颜色选择器 */
  .color-picker {
    display: flex;
    gap: 10px;
    margin-bottom: 4px;
  }
  .color-dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: border-color 0.2s, transform 0.15s;
  }
  .color-dot:hover {
    transform: scale(1.15);
  }
  .color-dot.active {
    border-color: #5a4a3a;
    transform: scale(1.15);
  }
  /* 涂鸦画布 */
  #doodleCanvas {
    border: 2px solid #ccc;
    border-radius: 12px;
    background: #fff;
    cursor: crosshair;
    touch-action: none;
  }
  .doodle-hint {
    font-size: 13px;
    color: #9a8a7a;
    text-align: center;
    line-height: 1.5;
  }
  /* 按钮行 */
  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 4px;
  }
  .btn-analyze {
    padding: 8px 20px;
    background: #4a7cc3;
    color: #fff;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
  }
  .btn-analyze:hover {
    background: #3a6ab3;
  }
  .btn-clear {
    padding: 8px 20px;
    background: #fff;
    color: #6a5a4a;
    border: 2px solid #bbb;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .btn-clear:hover {
    border-color: #888;
  }

  /* ============ 天气模式样式 ============ */
  .weather-grid {
    display: grid;
    grid-template-columns: repeat(3, 90px);
    grid-template-rows: repeat(2, 100px);
    gap: 12px;
    justify-content: center;
  }
  .weather-card {
    width: 90px;
    height: 100px;
    background: #fff;
    border: 2px solid #ddd;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.25s, transform 0.25s;
  }
  .weather-card:hover {
    border-color: #4a7cc3;
    transform: translateY(-3px);
  }
  .weather-card:active {
    transform: scale(1.05);
  }
  .weather-card .emoji {
    font-size: 36px;
    line-height: 1;
  }
  .weather-card .label {
    font-size: 13px;
    color: #6a5a4a;
    margin-top: 6px;
  }

  /* ============ 颜色模式样式 ============ */
  .color-grid {
    display: grid;
    grid-template-columns: repeat(4, 50px);
    grid-template-rows: repeat(3, 50px);
    gap: 8px;
    justify-content: center;
  }
  .color-block {
    width: 50px;
    height: 50px;
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    transition: transform 0.15s;
    border: 4px solid transparent;
  }
  .color-block:hover {
    transform: scale(1.08);
  }
  .color-block.selected {
    border-color: rgba(0,0,0,0.5);
  }
  /* 选中标记：右下角白色小圆+黑色✓ */
  .color-block.selected::after {
    content: '✓';
    position: absolute;
    right: 2px;
    bottom: 2px;
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #333;
    line-height: 1;
  }
  .color-count {
    font-size: 13px;
    color: #9a8a7a;
    margin-top: 10px;
  }

  /* ============ 文字解读区（三种模式共用） ============ */
  .interpretation {
    margin-top: 16px;
    padding: 16px 20px;
    background: rgba(255,255,255,0.7);
    border-radius: 12px;
    max-width: 300px;
    min-height: 60px;
    font-size: 14px;
    color: #5a4a3a;
    line-height: 1.7;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .interpretation.visible {
    opacity: 1;
  }
</style>
</head>
<body>

<div class="main-layout">
  <!-- 左侧：树的画布 -->
  <div class="left-panel">
    <div class="controls">
      <label>树的情绪</label>
      <input type="range" id="moodSlider" min="0" max="100" value="80">
      <span class="mood-text" id="moodText">开心</span>
    </div>
    <canvas id="canvas"></canvas>
  </div>

  <!-- 右侧面板 -->
  <div class="right-panel">
    <!-- 模式切换标签 -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="doodle">🖌️ 涂鸦</button>
      <button class="mode-tab" data-mode="weather">☁️ 天气</button>
      <button class="mode-tab" data-mode="color">🎨 颜色</button>
    </div>

    <!-- 涂鸦模式内容区 -->
    <div class="mode-content" id="modeDoodle">
      <div class="doodle-section">
        <div class="doodle-title">涂鸦情绪分析</div>
        <!-- 画笔颜色选择器 -->
        <div class="color-picker" id="colorPicker"></div>
        <!-- 涂鸦画布 -->
        <canvas id="doodleCanvas" width="300" height="300"></canvas>
        <div class="doodle-hint">在这里随便画几笔，树能感受到你的心情</div>
        <!-- 按钮 -->
        <div class="btn-row">
          <button class="btn-analyze" id="btnAnalyze">分析我的涂鸦</button>
          <button class="btn-clear" id="btnClear">清除画布</button>
        </div>
      </div>
    </div>

    <!-- 天气模式内容区 -->
    <div class="mode-content hidden" id="modeWeather">
      <div class="weather-grid">
        <div class="weather-card" data-weather="sunny" data-mood="0.85" data-text="阳光洒在你的森林里，树感受到了温暖和明朗。">
          <span class="emoji">☀️</span><span class="label">晴天</span>
        </div>
        <div class="weather-card" data-weather="cloudy" data-mood="0.55" data-text="云朵静静地飘过，你的森林宁静而安详。">
          <span class="emoji">⛅</span><span class="label">多云</span>
        </div>
        <div class="weather-card" data-weather="rain" data-mood="0.35" data-text="雨滴轻轻落在叶片上，树感受到了淡淡的忧伤。">
          <span class="emoji">🌧️</span><span class="label">小雨</span>
        </div>
        <div class="weather-card" data-weather="storm" data-mood="0.15" data-text="风暴在你的森林中呼啸，树在风中颤抖，但也知道风雨会过去。">
          <span class="emoji">⛈️</span><span class="label">雷雨</span>
        </div>
        <div class="weather-card" data-weather="rainbow" data-mood="0.75" data-text="一道彩虹跨过你的森林，树在雨后的光芒中舒展。">
          <span class="emoji">🌈</span><span class="label">彩虹</span>
        </div>
        <div class="weather-card" data-weather="night" data-mood="0.45" data-text="夜幕降临，你的森林安静下来，树在星光中冥想。">
          <span class="emoji">🌙</span><span class="label">夜晚</span>
        </div>
      </div>
    </div>

    <!-- 颜色模式内容区 -->
    <div class="mode-content hidden" id="modeColor">
      <div class="color-grid" id="colorGrid"></div>
      <div class="color-count" id="colorCount">选择了 0/3 个颜色</div>
    </div>

    <!-- 文字解读区（三种模式共用） -->
    <div class="interpretation" id="interpretation"></div>
  </div>
</div>

<script>
// ============ 初始化画布 ============
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const slider = document.getElementById('moodSlider');
const moodText = document.getElementById('moodText');

// 画布尺寸自适应
function resize() {
  const leftPanel = document.querySelector('.left-panel');
  canvas.width = Math.min(leftPanel.clientWidth - 20, 800);
  canvas.height = Math.min(window.innerHeight - 90, 600);
}
resize();
window.addEventListener('resize', () => {
  resize();
  initGroundDecor();
});

// ============ 颜色工具 ============
// 枯黄 #b8860b → rgb(184,134,11)  翠绿 #4a7c3f → rgb(74,124,63)
const COLOR_DEAD = { r: 184, g: 134, b: 11 };
const COLOR_ALIVE = { r: 74, g: 124, b: 63 };

// 根据情绪值(0~1)插值颜色
function lerpColor(c1, c2, t) {
  return {
    r: Math.round(c1.r + (c2.r - c1.r) * t),
    g: Math.round(c1.g + (c2.g - c1.g) * t),
    b: Math.round(c1.b + (c2.b - c1.b) * t)
  };
}
function colorToStr(c, a) {
  return a !== undefined
    ? `rgba(${c.r},${c.g},${c.b},${a})`
    : `rgb(${c.r},${c.g},${c.b})`;
}

// ============ 树冠色块定义 ============
// 每个色块：x/y偏移(相对树冠中心)、半径、颜色偏移类型(0主色/1黄绿/2深绿)
const crownBlobs = [
  { dx: -55, dy: -30, r: 62, type: 0 },
  { dx:  50, dy: -25, r: 58, type: 1 },
  { dx:   0, dy: -60, r: 55, type: 0 },
  { dx: -30, dy: -75, r: 48, type: 2 },
  { dx:  35, dy: -70, r: 50, type: 1 },
  { dx: -65, dy: -55, r: 45, type: 2 },
  { dx:  60, dy: -55, r: 44, type: 0 },
  { dx:   0, dy: -35, r: 60, type: 0 },
  { dx: -20, dy: -90, r: 38, type: 1 },
  { dx:  20, dy: -85, r: 40, type: 2 },
  { dx: -45, dy: -10, r: 42, type: 1 },
  { dx:  45, dy: -10, r: 40, type: 2 },
];

// 根据色块类型和情绪值返回颜色
function getBlobColor(type, mood) {
  const base = lerpColor(COLOR_DEAD, COLOR_ALIVE, mood);
  if (type === 0) return base; // 主色
  if (type === 1) {
    // 黄绿偏移：偏黄
    return lerpColor(
      { r: 200, g: 170, b: 20 },
      { r: 120, g: 160, b: 50 },
      mood
    );
  }
  // 深绿偏移
  return lerpColor(
    { r: 140, g: 100, b: 10 },
    { r: 40, g: 90, b: 35 },
    mood
  );
}

// ============ 飘落叶子系统 ============
let fallingLeaves = [];
let nextLeafTime = 0; // 下一片叶子飘落的时间

// 生成一片飘落叶子
function spawnLeaf(time) {
  const cx = canvas.width / 2;
  const cy = canvas.height * 0.55 - 60;
  // 从树冠范围内随机位置出发
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.random() * 50;
  return {
    x: cx + Math.cos(angle) * dist,
    y: cy + Math.sin(angle) * dist * 0.6,
    vx: (Math.random() - 0.5) * 0.6,
    vy: 0.3 + Math.random() * 0.4,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.06,
    size: 6 + Math.random() * 5,
    swayPhase: Math.random() * Math.PI * 2,
    swayAmp: 0.3 + Math.random() * 0.5,
    born: time,
    // 叶子颜色随机偏移
    colorType: Math.floor(Math.random() * 3)
  };
}

// ============ 地面装饰（落叶+小花）============
// 预生成地面装饰位置，避免每帧随机
const groundLeaves = [];
const groundFlowers = [];
function initGroundDecor() {
  groundLeaves.length = 0;
  groundFlowers.length = 0;
  for (let i = 0; i < 8; i++) {
    groundLeaves.push({
      x: canvas.width * 0.15 + Math.random() * canvas.width * 0.7,
      y: canvas.height * 0.82 + Math.random() * 20,
      rot: Math.random() * Math.PI * 2,
      size: 5 + Math.random() * 4,
      colorType: Math.floor(Math.random() * 3)
    });
  }
  for (let i = 0; i < 5; i++) {
    const flowerColors = ['#e8607a', '#f0a040', '#d070d0', '#f0d050', '#70b0f0'];
    groundFlowers.push({
      x: canvas.width * 0.1 + Math.random() * canvas.width * 0.8,
      y: canvas.height * 0.83 + Math.random() * 15,
      size: 4 + Math.random() * 3,
      color: flowerColors[Math.floor(Math.random() * flowerColors.length)]
    });
  }
}
initGroundDecor();

// ============ 绘制函数 ============

// 绘制地面
function drawGround(mood) {
  const groundY = canvas.height * 0.82;
  const grassColor = lerpColor(
    { r: 180, g: 160, b: 80 },
    { r: 120, g: 170, b: 80 },
    mood
  );
  const bottomColor = lerpColor(grassColor, { r: 80, g: 120, b: 50 }, 0.3);
  const grad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
  grad.addColorStop(0, colorToStr(grassColor));
  grad.addColorStop(1, colorToStr(bottomColor));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  for (let x = 0; x <= canvas.width; x += 40) {
    ctx.lineTo(x, groundY + Math.sin(x * 0.02) * 4);
  }
  ctx.lineTo(canvas.width, canvas.height);
  ctx.lineTo(0, canvas.height);
  ctx.closePath();
  ctx.fill();
}

// 绘制树干（略有弯曲、有树皮纹理）
function drawTrunk() {
  const cx = canvas.width / 2;
  const groundY = canvas.height * 0.82;
  const trunkBottom = groundY - 2;
  const trunkTop = groundY - 180;

  ctx.save();
  // 主树干路径——略有弯曲
  ctx.beginPath();
  ctx.moveTo(cx - 22, trunkBottom);
  ctx.quadraticCurveTo(cx - 18, trunkBottom - 90, cx - 12, trunkTop);
  ctx.lineTo(cx + 12, trunkTop);
  ctx.quadraticCurveTo(cx + 18, trunkBottom - 90, cx + 22, trunkBottom);
  ctx.closePath();

  // 树干渐变
  const trunkGrad = ctx.createLinearGradient(cx - 22, 0, cx + 22, 0);
  trunkGrad.addColorStop(0, '#6b4226');
  trunkGrad.addColorStop(0.3, '#8b5e3c');
  trunkGrad.addColorStop(0.7, '#7a4f30');
  trunkGrad.addColorStop(1, '#5a3520');
  ctx.fillStyle = trunkGrad;
  ctx.fill();

  // 树皮纹理——几条深色横线
  ctx.strokeStyle = 'rgba(60,30,10,0.25)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 6; i++) {
    const ty = trunkBottom - 25 - i * 25;
    const bendOffset = Math.sin(i * 0.8) * 3;
    ctx.beginPath();
    ctx.moveTo(cx - 16 + bendOffset, ty);
    ctx.quadraticCurveTo(cx + bendOffset, ty - 3, cx + 16 + bendOffset, ty + 1);
    ctx.stroke();
  }

  // 两个小树枝
  ctx.strokeStyle = '#6b4226';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 8, trunkTop + 40);
  ctx.quadraticCurveTo(cx - 40, trunkTop + 10, cx - 50, trunkTop - 10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + 8, trunkTop + 50);
  ctx.quadraticCurveTo(cx + 35, trunkTop + 25, cx + 45, trunkTop + 5);
  ctx.stroke();

  ctx.restore();
}

// 浮动幅度倍率（分析后临时增大）
let floatMultiplier = 1;

// 绘制树冠色块（带浮动动画）
function drawCrown(time, mood) {
  const cx = canvas.width / 2;
  const cy = canvas.height * 0.55 - 30;

  crownBlobs.forEach((blob, i) => {
    // 微风浮动：每个色块相位不同，产生波浪感
    const floatY = Math.sin(time * 0.0015 + i * 0.7) * 3 * floatMultiplier;
    const floatX = Math.cos(time * 0.001 + i * 0.5) * 1.5 * floatMultiplier;

    const bx = cx + blob.dx + floatX;
    const by = cy + blob.dy + floatY;
    const color = getBlobColor(blob.type, mood);

    // 绘制圆形色块，边缘略透明模拟手绘感
    const grad = ctx.createRadialGradient(bx - blob.r * 0.2, by - blob.r * 0.2, blob.r * 0.1, bx, by, blob.r);
    grad.addColorStop(0, colorToStr(color, 0.95));
    grad.addColorStop(0.7, colorToStr(color, 0.85));
    grad.addColorStop(1, colorToStr(color, 0.5));

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(bx, by, blob.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

// 绘制单片叶子形状
function drawLeafShape(x, y, size, rotation, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);
  ctx.fillStyle = color;
  ctx.beginPath();
  // 叶子是两个贝塞尔曲线构成的椭圆尖形
  ctx.moveTo(0, -size);
  ctx.bezierCurveTo(size * 0.6, -size * 0.5, size * 0.5, size * 0.3, 0, size);
  ctx.bezierCurveTo(-size * 0.5, size * 0.3, -size * 0.6, -size * 0.5, 0, -size);
  ctx.fill();
  // 叶脉
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(0, -size * 0.8);
  ctx.lineTo(0, size * 0.7);
  ctx.stroke();
  ctx.restore();
}

// 绘制地面装饰（落叶+小花）
function drawGroundDecor(mood) {
  // 地面落叶
  groundLeaves.forEach(leaf => {
    const color = getBlobColor(leaf.colorType, mood);
    drawLeafShape(leaf.x, leaf.y, leaf.size, leaf.rot, colorToStr(color, 0.7));
  });
  // 小花
  groundFlowers.forEach(flower => {
    const { x, y, size, color } = flower;
    // 花瓣
    ctx.fillStyle = color;
    for (let p = 0; p < 5; p++) {
      const angle = (p / 5) * Math.PI * 2 - Math.PI / 2;
      ctx.beginPath();
      ctx.ellipse(
        x + Math.cos(angle) * size * 0.6,
        y + Math.sin(angle) * size * 0.6,
        size * 0.5, size * 0.35,
        angle, 0, Math.PI * 2
      );
      ctx.fill();
    }
    // 花心
    ctx.fillStyle = '#f5e060';
    ctx.beginPath();
    ctx.arc(x, y, size * 0.3, 0, Math.PI * 2);
    ctx.fill();
  });
}

// 绘制飘落中的叶子
function drawFallingLeaves(time, mood) {
  fallingLeaves.forEach(leaf => {
    const color = getBlobColor(leaf.colorType, mood);
    drawLeafShape(leaf.x, leaf.y, leaf.size, leaf.rotation, colorToStr(color, 0.85));
  });
}

// ============ 情绪easing动画状态 ============
let moodAnimating = false;       // 是否正在做easing过渡
let moodAnimStart = 0;           // 过渡开始时间
let moodAnimFrom = 0;            // 起始情绪值(0~1)
let moodAnimTo = 0;              // 目标情绪值(0~1)
const MOOD_ANIM_DURATION = 1500; // 过渡时长1.5秒

// 缓动函数：ease-in-out
function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
}

// 启动情绪过渡动画
function startMoodAnimation(targetMood) {
  moodAnimFrom = slider.value / 100;
  moodAnimTo = targetMood;
  moodAnimStart = performance.now();
  moodAnimating = true;
  // 浮动幅度临时增大到2倍
  floatMultiplier = 2;
}

// ============ 主动画循环 ============
let lastTime = 0;

// ============ 天气环境特效状态 ============
let currentWeather = null;     // 当前天气类型：null / 'sunny'/'cloudy'/'rain'/'storm'/'rainbow'/'night'
let effectAlpha = 0;           // 特效透明度 0~1
let effectTimer = 0;           // 特效已持续时间(ms)
let effectFadeOut = false;     // 是否正在消退
let weatherParticles = [];     // 天气粒子数组
let lightningAlpha = 0;        // 闪电白光透明度
let lightningTimer = 0;        // 距上次闪电的毫秒数
let nextLightning = 3000 + Math.random() * 3000; // 下次闪电等待时间
let nightStars = [];           // 夜晚星星位置（首次激活时生成）
let cloudPositions = [];       // 云朵位置（多云模式）
// 初始化云朵
for (let i = 0; i < 3; i++) {
  cloudPositions.push({
    x: Math.random() * 800,
    y: 30 + Math.random() * 60,
    rx: 40 + Math.random() * 20,
    ry: 12 + Math.random() * 6,
    phase: Math.random() * Math.PI * 2,
    speed: 0.8 + Math.random() * 0.4
  });
}

// ============ 天气环境特效：更新与绘制 ============

// 更新天气特效状态
function updateWeatherEffect(time, dt) {
  if (!currentWeather) return;

  // 累计特效持续时间
  effectTimer += dt;

  // 30秒后开始消退
  if (effectTimer >= 30000 && !effectFadeOut) {
    effectFadeOut = true;
  }

  // 消退逻辑：2秒内从当前值降到0
  if (effectFadeOut) {
    effectAlpha -= dt / 2000;
    if (effectAlpha <= 0) {
      effectAlpha = 0;
      currentWeather = null;
      weatherParticles = [];
      effectFadeOut = false;
      effectTimer = 0;
      lightningAlpha = 0;
      lightningTimer = 0;
      // 恢复浮动幅度（雷雨模式可能修改过）
      if (!moodAnimating) floatMultiplier = 1;
      return;
    }
  } else if (effectAlpha < 1) {
    // 渐显：0.8秒内从0到1
    effectAlpha = Math.min(1, effectAlpha + dt / 800);
  }

  // 更新现有粒子位置
  const groundY = canvas.height * 0.82;
  weatherParticles = weatherParticles.filter(p => {
    p.life -= dt;
    if (p.life <= 0) return false;

    if (p.type === 'rain') {
      p.x += p.vx * dt / 1000;
      p.y += p.vy * dt / 1000;
      if (p.y > groundY) return false;
    } else if (p.type === 'ripple') {
      p.age += dt;
      if (p.age > p.maxAge) return false;
      p.radius = (p.age / p.maxAge) * p.maxRadius;
      p.alpha = 0.5 * (1 - p.age / p.maxAge);
    } else if (p.type === 'lightdot') {
      p.x += p.vx * dt / 1000;
      p.y += p.vy * dt / 1000;
      p.alpha = 0.5 + 0.3 * Math.sin(time * 0.003 + p.phase);
    } else if (p.type === 'firefly') {
      // 随机游走+目标点
      const dx = p.targetX - p.x;
      const dy = p.targetY - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 5) {
        const cx = canvas.width / 2;
        const cy = canvas.height * 0.55 - 60;
        p.targetX = cx + (Math.random() - 0.5) * 300;
        p.targetY = cy + (Math.random() - 0.5) * 200;
      } else {
        p.x += (dx / dist) * p.speed * dt / 1000;
        p.y += (dy / dist) * p.speed * dt / 1000;
      }
      p.alpha = 0.5 + 0.4 * Math.sin(time * 0.002 * p.flickerSpeed + p.phase);
    } else if (p.type === 'colordot') {
      p.x += p.vx * dt / 1000;
      p.y += p.vy * dt / 1000;
      p.alpha = 0.4 + 0.3 * Math.sin(time * 0.002 + p.phase);
    }
    return true;
  });

  // 根据天气类型补充新粒子
  if (currentWeather === 'rain') {
    const rainCount = weatherParticles.filter(p => p.type === 'rain').length;
    if (rainCount < 40) {
      for (let i = 0; i < 2 + Math.floor(Math.random() * 2); i++) {
        weatherParticles.push({
          type: 'rain', x: Math.random() * canvas.width, y: -10 - Math.random() * 30,
          vx: -4 - Math.random() * 2, vy: 400 + Math.random() * 200, life: 3000
        });
      }
    }
    if (weatherParticles.filter(p => p.type === 'ripple').length < 5 && Math.random() < 0.3) {
      weatherParticles.push({
        type: 'ripple', x: canvas.width * 0.1 + Math.random() * canvas.width * 0.8,
        y: groundY + Math.random() * 10, radius: 0, maxRadius: 8 + Math.random() * 4,
        alpha: 0.5, age: 0, maxAge: 1000 + Math.random() * 500, life: 1500
      });
    }
  } else if (currentWeather === 'storm') {
    const rainCount = weatherParticles.filter(p => p.type === 'rain').length;
    if (rainCount < 50) {
      for (let i = 0; i < 4 + Math.floor(Math.random() * 2); i++) {
        weatherParticles.push({
          type: 'rain', x: Math.random() * canvas.width, y: -10 - Math.random() * 30,
          vx: -6 - Math.random() * 3, vy: 700 + Math.random() * 200, life: 3000, thick: true
        });
      }
    }
    if (weatherParticles.filter(p => p.type === 'ripple').length < 8 && Math.random() < 0.5) {
      weatherParticles.push({
        type: 'ripple', x: canvas.width * 0.1 + Math.random() * canvas.width * 0.8,
        y: groundY + Math.random() * 10, radius: 0, maxRadius: 8 + Math.random() * 4,
        alpha: 0.5, age: 0, maxAge: 1000 + Math.random() * 500, life: 1500
      });
    }
    // 闪电计时
    lightningTimer += dt;
    if (lightningTimer > nextLightning - 300 && lightningTimer < nextLightning - 200) {
      lightningAlpha = Math.max(lightningAlpha, 0.03);
    }
    if (lightningTimer >= nextLightning) {
      lightningAlpha = 0.4 + Math.random() * 0.2;
      lightningTimer = 0;
      nextLightning = 3000 + Math.random() * 3000;
    }
    if (lightningAlpha > 0) {
      lightningAlpha -= dt / 50;
      if (lightningAlpha < 0) lightningAlpha = 0;
    }
    // 雷雨：树冠摇晃更剧烈（非easing过渡期间）
    if (!moodAnimating) floatMultiplier = 1 + 2 * effectAlpha;
  } else if (currentWeather === 'sunny') {
    if (weatherParticles.filter(p => p.type === 'lightdot').length < 5) {
      const cx = canvas.width / 2, cy = canvas.height * 0.55 - 60;
      weatherParticles.push({
        type: 'lightdot', x: cx + (Math.random() - 0.5) * 120, y: cy - 40 - Math.random() * 60,
        vx: (Math.random() - 0.5) * 10, vy: -8 - Math.random() * 12,
        alpha: 0.7, phase: Math.random() * Math.PI * 2, life: 4000 + Math.random() * 2000
      });
    }
  } else if (currentWeather === 'rainbow') {
    if (weatherParticles.filter(p => p.type === 'colordot').length < 15) {
      const cx = canvas.width / 2, cy = canvas.height * 0.55 - 60;
      const rc = ['#e03030','#f09030','#f5d030','#40a040','#3070d0','#8040c0'];
      weatherParticles.push({
        type: 'colordot', x: cx + (Math.random() - 0.5) * 200, y: cy - 80 + (Math.random() - 0.5) * 100,
        vx: (Math.random() - 0.5) * 8, vy: -5 - Math.random() * 10,
        alpha: 0.5, phase: Math.random() * Math.PI * 2,
        color: rc[Math.floor(Math.random() * rc.length)], life: 5000 + Math.random() * 3000
      });
    }
  } else if (currentWeather === 'night') {
    if (weatherParticles.filter(p => p.type === 'firefly').length < 8) {
      const cx = canvas.width / 2, cy = canvas.height * 0.55 - 60;
      weatherParticles.push({
        type: 'firefly', x: cx + (Math.random() - 0.5) * 200, y: cy + (Math.random() - 0.5) * 150,
        targetX: cx + (Math.random() - 0.5) * 300, targetY: cy + (Math.random() - 0.5) * 200,
        speed: 30 + Math.random() * 30, alpha: 0.8, phase: Math.random() * Math.PI * 2,
        flickerSpeed: 1 + Math.random() * 2, life: 30000
      });
    }
    if (nightStars.length === 0) {
      for (let i = 0; i < 12; i++) {
        nightStars.push({
          x: Math.random() * canvas.width, y: 10 + Math.random() * (canvas.height * 0.4),
          size: 1 + Math.random(), phase: Math.random() * Math.PI * 2, speed: 2 + Math.random() * 3
        });
      }
    }
  }
}

// 绘制天气特效
function drawWeatherEffect(mood) {
  if (!currentWeather || effectAlpha <= 0) return;
  const w = canvas.width, h = canvas.height, ea = effectAlpha;

  if (currentWeather === 'sunny') {
    const cx = w / 2, cy = h * 0.55 - 30;
    ctx.save();
    for (let i = 0; i < 4; i++) {
      ctx.strokeStyle = `rgba(255,230,150,${0.12 * ea})`;
      ctx.lineWidth = 8 + i * 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(cx - 60 + i * 40, cy - 40);
      ctx.stroke();
    }
    const grad = ctx.createRadialGradient(cx, cy - 50, 10, cx, cy - 30, 120);
    grad.addColorStop(0, `rgba(255,240,180,${0.15 * ea})`);
    grad.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
    weatherParticles.forEach(p => {
      if (p.type === 'lightdot') {
        ctx.fillStyle = `rgba(255,240,180,${0.7 * ea * p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2 + Math.random(), 0, Math.PI * 2);
        ctx.fill();
      }
    });
    ctx.restore();
  }

  else if (currentWeather === 'cloudy') {
    ctx.fillStyle = `rgba(200,200,210,${0.06 * ea})`;
    ctx.fillRect(0, 0, w, h);
    const t = performance.now();
    cloudPositions.forEach(cloud => {
      const cx = (cloud.x + Math.sin(t * 0.001 / cloud.speed + cloud.phase) * 60) % (w + 100);
      ctx.fillStyle = `rgba(240,240,245,${0.6 * ea})`;
      ctx.beginPath();
      ctx.ellipse(cx, cloud.y, cloud.rx, cloud.ry, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  else if (currentWeather === 'rain') {
    ctx.fillStyle = `rgba(180,190,210,${0.1 * ea})`;
    ctx.fillRect(0, 0, w, h);
    weatherParticles.forEach(p => {
      if (p.type === 'rain') {
        ctx.strokeStyle = `rgba(150,180,220,${0.5 * ea})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + p.vx * 0.02, p.y + 15 + Math.random() * 10);
        ctx.stroke();
      } else if (p.type === 'ripple') {
        ctx.strokeStyle = `rgba(150,170,200,${p.alpha * ea})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.radius, p.radius * 0.3, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    });
  }

  else if (currentWeather === 'storm') {
    ctx.fillStyle = `rgba(40,30,60,${0.30 * ea})`;
    ctx.fillRect(0, 0, w, h);
    weatherParticles.forEach(p => {
      if (p.type === 'rain') {
        ctx.strokeStyle = `rgba(200,210,230,${0.6 * ea})`;
        ctx.lineWidth = p.thick ? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + p.vx * 0.02, p.y + 20 + Math.random() * 10);
        ctx.stroke();
      } else if (p.type === 'ripple') {
        ctx.strokeStyle = `rgba(150,170,200,${p.alpha * ea})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.radius, p.radius * 0.3, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    });
    if (lightningAlpha > 0) {
      ctx.fillStyle = `rgba(255,255,255,${lightningAlpha})`;
      ctx.fillRect(0, 0, w, h);
    }
  }

  else if (currentWeather === 'rainbow') {
    const cx = w / 2 + 30, cy = h * 0.55 - 20;
    const bands = [
      { c: [224,48,48], o: 0 }, { c: [240,144,48], o: 7 }, { c: [245,208,48], o: 14 },
      { c: [64,160,64], o: 21 }, { c: [48,112,208], o: 28 }, { c: [128,64,192], o: 35 }
    ];
    ctx.save();
    bands.forEach(b => {
      ctx.strokeStyle = `rgba(${b.c[0]},${b.c[1]},${b.c[2]},${0.25 * ea})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(cx, cy, 140 - b.o, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    });
    // 树冠边缘微光
    const blobCx = w / 2, blobCy = h * 0.55 - 30;
    crownBlobs.forEach(blob => {
      const color = getBlobColor(blob.type, mood);
      ctx.strokeStyle = colorToStr(color, 0.2 * ea);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(blobCx + blob.dx, blobCy + blob.dy, blob.r + 2, 0, Math.PI * 2);
      ctx.stroke();
    });
    weatherParticles.forEach(p => {
      if (p.type === 'colordot') {
        const hex = p.color;
        const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        ctx.fillStyle = `rgba(${r},${g},${b},${0.6 * ea * p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2 + Math.random(), 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(${r},${g},${b},${0.15 * ea * p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    });
    ctx.restore();
  }

  else if (currentWeather === 'night') {
    ctx.fillStyle = `rgba(20,15,50,${0.25 * ea})`;
    ctx.fillRect(0, 0, w, h);
    const t = performance.now();
    nightStars.forEach(star => {
      const a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 0.001 / star.speed + star.phase));
      ctx.fillStyle = `rgba(255,255,255,${a * ea})`;
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = `rgba(255,255,255,${a * 0.5 * ea})`;
      ctx.lineWidth = 0.5;
      const len = star.size * 3;
      ctx.beginPath();
      ctx.moveTo(star.x - len, star.y); ctx.lineTo(star.x + len, star.y);
      ctx.moveTo(star.x, star.y - len); ctx.lineTo(star.x, star.y + len);
      ctx.stroke();
    });
    weatherParticles.forEach(p => {
      if (p.type === 'firefly') {
        ctx.fillStyle = `rgba(180,240,100,${0.15 * ea * p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(180,240,100,${0.8 * ea * p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 + Math.random(), 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }
}

// ============ 主动画循环 ============
function animate(time) {
  if (!lastTime) lastTime = time;
  const dt = Math.min(time - lastTime, 100);  // 限制最大步长100ms
  lastTime = time;

  // ---- 情绪easing过渡 ----
  if (moodAnimating) {
    const elapsed = time - moodAnimStart;
    const progress = Math.min(elapsed / MOOD_ANIM_DURATION, 1);
    const easedProgress = easeInOut(progress);
    const currentMood = moodAnimFrom + (moodAnimTo - moodAnimFrom) * easedProgress;
    slider.value = Math.round(currentMood * 100);
    if (progress >= 1) {
      moodAnimating = false;
      floatMultiplier = 1;
    }
  }

  const mood = slider.value / 100;

  // 更新情绪文字
  if (mood < 0.25) moodText.textContent = '低落';
  else if (mood < 0.5) moodText.textContent = '一般';
  else if (mood < 0.75) moodText.textContent = '不错';
  else moodText.textContent = '开心';

  // 更新天气特效
  updateWeatherEffect(time, dt);

  // 清空画布
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 绘制各层（地面 → 地面装饰 → 树干 → 树冠 → 天气特效 → 飘落叶子 → 特效覆盖）
  drawGround(mood);
  drawGroundDecor(mood);
  drawTrunk();
  drawCrown(time, mood);

  // 天气特效层（在树冠之后、飘落叶子之前）
  drawWeatherEffect(mood);

  // ---- 飘落叶子逻辑 ----
  // 小雨/雷雨时落叶频率翻倍
  const leafInterval = (currentWeather === 'rain' || currentWeather === 'storm')
    ? 1000 + Math.random() * 1000
    : 2000 + Math.random() * 2000;
  if (time > nextLeafTime) {
    fallingLeaves.push(spawnLeaf(time));
    nextLeafTime = time + leafInterval;
  }

  const groundY = canvas.height * 0.84;
  fallingLeaves = fallingLeaves.filter(leaf => {
    leaf.x += leaf.vx + Math.sin(time * 0.003 + leaf.swayPhase) * leaf.swayAmp;
    leaf.y += leaf.vy;
    leaf.rotation += leaf.rotSpeed;
    if (leaf.y >= groundY) {
      leaf.y = groundY;
      leaf.vy = 0;
      leaf.vx = 0;
      leaf.rotSpeed = 0;
      leaf.swayAmp = 0;
      return (time - leaf.born) < 8000;
    }
    return true;
  });

  drawFallingLeaves(time, mood);

  // 夜晚/闪电等覆盖层（在飘落叶子之后）
  if (currentWeather === 'night' && effectAlpha > 0) {
    // 夜晚暗色覆盖已在drawWeatherEffect中处理
  }

  requestAnimationFrame(animate);
}

// 启动动画
requestAnimationFrame(animate);

// ============ 涂鸦情绪分析功能 ============
// ================================================================

// ---- 涂鸦画布初始化 ----
const doodleCanvas = document.getElementById('doodleCanvas');
const doodleCtx = doodleCanvas.getContext('2d');
doodleCtx.lineCap = 'round';
doodleCtx.lineJoin = 'round';
doodleCtx.lineWidth = 3;

// ---- 画笔颜色选择器 ----
const penColors = [
  { color: '#5a3a2a', name: '深棕' },
  { color: '#d03030', name: '红色' },
  { color: '#e08020', name: '橙色' },
  { color: '#3070c0', name: '蓝色' },
  { color: '#30a040', name: '绿色' },
  { color: '#222222', name: '黑色' },
];
let currentPenColor = penColors[0].color;

// 生成颜色小圆点
const colorPickerEl = document.getElementById('colorPicker');
penColors.forEach((pc, idx) => {
  const dot = document.createElement('div');
  dot.className = 'color-dot' + (idx === 0 ? ' active' : '');
  dot.style.background = pc.color;
  dot.title = pc.name;
  dot.addEventListener('click', () => {
    currentPenColor = pc.color;
    // 更新active状态
    colorPickerEl.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
    dot.classList.add('active');
  });
  colorPickerEl.appendChild(dot);
});

// ---- 绘制数据记录 ----
// 记录所有绘制点：{ x, y, time }，以及笔画段信息
let drawPoints = [];       // 所有点
let strokes = [];          // 每段笔画的点数组
let currentStroke = null;  // 当前正在画的笔画
let isDrawing = false;

// ---- 涂鸦绘制交互 ----
function getDoodlePos(e) {
  const rect = doodleCanvas.getBoundingClientRect();
  if (e.touches) {
    return {
      x: e.touches[0].clientX - rect.left,
      y: e.touches[0].clientY - rect.top
    };
  }
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

function startDraw(e) {
  e.preventDefault();
  isDrawing = true;
  const pos = getDoodlePos(e);
  const now = performance.now();
  doodleCtx.strokeStyle = currentPenColor;
  doodleCtx.beginPath();
  doodleCtx.moveTo(pos.x, pos.y);
  // 开始新笔画
  currentStroke = [{ x: pos.x, y: pos.y, time: now }];
  drawPoints.push({ x: pos.x, y: pos.y, time: now });
}

function moveDraw(e) {
  if (!isDrawing) return;
  e.preventDefault();
  const pos = getDoodlePos(e);
  const now = performance.now();
  doodleCtx.lineTo(pos.x, pos.y);
  doodleCtx.stroke();
  doodleCtx.beginPath();
  doodleCtx.moveTo(pos.x, pos.y);
  // 记录点
  currentStroke.push({ x: pos.x, y: pos.y, time: now });
  drawPoints.push({ x: pos.x, y: pos.y, time: now });
}

function endDraw(e) {
  if (!isDrawing) return;
  isDrawing = false;
  if (currentStroke && currentStroke.length > 0) {
    strokes.push(currentStroke);
  }
  currentStroke = null;
}

// 鼠标事件
doodleCanvas.addEventListener('mousedown', startDraw);
doodleCanvas.addEventListener('mousemove', moveDraw);
doodleCanvas.addEventListener('mouseup', endDraw);
doodleCanvas.addEventListener('mouseleave', endDraw);
// 触摸事件
doodleCanvas.addEventListener('touchstart', startDraw, { passive: false });
doodleCanvas.addEventListener('touchmove', moveDraw, { passive: false });
doodleCanvas.addEventListener('touchend', endDraw);

// ---- 清除画布按钮 ----
document.getElementById('btnClear').addEventListener('click', () => {
  doodleCtx.clearRect(0, 0, doodleCanvas.width, doodleCanvas.height);
  drawPoints = [];
  strokes = [];
  currentStroke = null;
  // 不清除分析结果
});

// ---- 情绪推断引擎 ----
function analyzeDoodle() {
  if (drawPoints.length < 5) {
    return { mood: 0.5, text: '画得太少了，树还感受不到你的心情，再多画几笔吧。' };
  }

  // 特征1：笔画速度（总路径长度 / 总耗时）
  let totalPathLen = 0;
  let totalTime = 0;
  strokes.forEach(stroke => {
    for (let i = 1; i < stroke.length; i++) {
      const dx = stroke[i].x - stroke[i - 1].x;
      const dy = stroke[i].y - stroke[i - 1].y;
      totalPathLen += Math.sqrt(dx * dx + dy * dy);
      const dt = stroke[i].time - stroke[i - 1].time;
      totalTime += dt;
    }
  });
  const speed = totalTime > 0 ? (totalPathLen / totalTime) * 1000 : 0; // px/s
  let speedScore;
  if (speed > 200) speedScore = 0.3;
  else if (speed >= 80) speedScore = 0.6;
  else speedScore = 0.8;

  // 特征2：画面密度（20x20网格，统计有笔触的格子比例）
  const gridCols = 20, gridRows = 20;
  const cellW = doodleCanvas.width / gridCols;
  const cellH = doodleCanvas.height / gridRows;
  const visitedCells = new Set();
  drawPoints.forEach(p => {
    const col = Math.min(Math.floor(p.x / cellW), gridCols - 1);
    const row = Math.min(Math.floor(p.y / cellH), gridRows - 1);
    if (col >= 0 && row >= 0) visitedCells.add(row * gridCols + col);
  });
  const density = visitedCells.size / (gridCols * gridRows);
  let densityScore;
  if (density > 0.4) densityScore = 0.8;
  else if (density >= 0.15) densityScore = 0.6;
  else densityScore = 0.4;

  // 特征3：线条方向倾向（所有线段dy之和与dx绝对值之和的比值）
  let sumDy = 0;
  let sumAbsDx = 0;
  strokes.forEach(stroke => {
    for (let i = 1; i < stroke.length; i++) {
      sumDy += stroke[i].y - stroke[i - 1].y;
      sumAbsDx += Math.abs(stroke[i].x - stroke[i - 1].x);
    }
  });
  let directionScore;
  if (sumAbsDx > 0) {
    const ratio = sumDy / sumAbsDx;
    if (ratio < -0.1) directionScore = 0.8;      // 多数向上→积极
    else if (ratio > 0.1) directionScore = 0.3;   // 多数向下→低落
    else directionScore = 0.5;                     // 无明显倾向
  } else {
    directionScore = 0.5;
  }

  // 特征4：反复描画（距离<10px且时间差<500ms的点对数量）
  let overlapCount = 0;
  // 采样检测，避免O(n^2)过大
  const sampleStep = Math.max(1, Math.floor(drawPoints.length / 200));
  for (let i = 0; i < drawPoints.length; i += sampleStep) {
    for (let j = i + sampleStep; j < drawPoints.length; j += sampleStep) {
      const dx = drawPoints[i].x - drawPoints[j].x;
      const dy = drawPoints[i].y - drawPoints[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const dt = Math.abs(drawPoints[i].time - drawPoints[j].time);
      if (dist < 10 && dt < 500) overlapCount++;
    }
  }
  // 归一化：根据采样数调整阈值
  const maxOverlap = Math.max(drawPoints.length / sampleStep, 1) * 2;
  const overlapRatio = Math.min(overlapCount / maxOverlap, 1);
  let overlapScore;
  if (overlapRatio < 0.2) overlapScore = 0.7;
  else if (overlapRatio < 0.5) overlapScore = 0.5;
  else overlapScore = 0.3;

  // 特征5：线条连贯性（笔画段数与平均每段长度）
  const strokeCount = strokes.length;
  let avgStrokeLen = strokeCount > 0 ? totalPathLen / strokeCount : 0;
  let coherenceScore;
  if (strokeCount < 5 && avgStrokeLen > 100) coherenceScore = 0.8;
  else if (strokeCount > 10 && avgStrokeLen < 40) coherenceScore = 0.3;
  else coherenceScore = 0.5;

  // 加权求和
  const finalMood =
    speedScore * 0.25 +
    densityScore * 0.20 +
    directionScore * 0.25 +
    overlapScore * 0.15 +
    coherenceScore * 0.15;

  // 文字解读
  let text;
  if (finalMood < 0.2) text = '你的笔触沉重而急促，树感受到了你内心的风暴。没关系，树在这里。';
  else if (finalMood < 0.4) text = '你的笔触有些犹豫，树感到了一阵不安的风。它轻轻摇了摇叶子回应你。';
  else if (finalMood < 0.6) text = '你的笔触平稳而克制，树在水墨般的宁静中轻轻呼吸。';
  else if (finalMood < 0.8) text = '你的笔触舒展而轻快，树感到温暖的阳光洒在叶片上。';
  else text = '你的笔触充满活力，树开心中绽放了几朵新的花苞!';

  return { mood: finalMood, text };
}

// ---- 分析按钮事件 ----
const interpretationEl = document.getElementById('interpretation');

document.getElementById('btnAnalyze').addEventListener('click', () => {
  const result = analyzeDoodle();

  // 显示文字解读（淡入）
  interpretationEl.classList.remove('visible');
  // 先移除再重新添加，触发新的淡入动画
  setTimeout(() => {
    interpretationEl.textContent = result.text;
    interpretationEl.classList.add('visible');
  }, 50);

  // 启动情绪过渡动画（1.5秒easing）
  startMoodAnimation(result.mood);
});

// ================================================================
// ============ 模式切换系统 ============
// ================================================================

const modeTabs = document.querySelectorAll('.mode-tab');
const modeContents = {
  doodle: document.getElementById('modeDoodle'),
  weather: document.getElementById('modeWeather'),
  color: document.getElementById('modeColor'),
};
let currentMode = 'doodle';

// 切换模式的核心函数
function switchMode(mode) {
  if (mode === currentMode) return;
  currentMode = mode;

  // 更新标签active状态
  modeTabs.forEach(tab => {
    tab.classList.toggle('active', tab.dataset.mode === mode);
  });

  // 淡出当前内容
  Object.values(modeContents).forEach(el => {
    el.classList.add('fading');
  });

  // 200ms后切换显示
  setTimeout(() => {
    Object.entries(modeContents).forEach(([key, el]) => {
      if (key === mode) {
        el.classList.remove('hidden', 'fading');
      } else {
        el.classList.add('hidden');
        el.classList.remove('fading');
      }
    });
  }, 200);

  // 记忆到localStorage
  localStorage.setItem('lastMode', mode);
}

// 标签点击事件
modeTabs.forEach(tab => {
  tab.addEventListener('click', () => {
    switchMode(tab.dataset.mode);
  });
});

// 页面加载时恢复上次模式
(function restoreMode() {
  const saved = localStorage.getItem('lastMode');
  if (saved && modeContents[saved]) {
    // 直接切换，不做动画
    currentMode = saved;
    modeTabs.forEach(tab => {
      tab.classList.toggle('active', tab.dataset.mode === saved);
    });
    Object.entries(modeContents).forEach(([key, el]) => {
      if (key === saved) {
        el.classList.remove('hidden', 'fading');
      } else {
        el.classList.add('hidden');
        el.classList.remove('fading');
      }
    });
  }
})();

// ================================================================
// ============ 天气模式交互 ============
// ================================================================

document.querySelectorAll('.weather-card').forEach(card => {
  card.addEventListener('click', () => {
    const mood = parseFloat(card.dataset.mood);
    const text = card.dataset.text;
    const weather = card.dataset.weather;

    // 启动情绪过渡
    startMoodAnimation(mood);

    // 显示解读文字（淡入）
    interpretationEl.classList.remove('visible');
    setTimeout(() => {
      interpretationEl.textContent = text;
      interpretationEl.classList.add('visible');
    }, 50);

    // 设置天气环境特效
    currentWeather = weather;
    effectAlpha = 0;
    effectTimer = 0;
    effectFadeOut = false;
    weatherParticles = [];
    lightningTimer = 0;
    nextLightning = 3000 + Math.random() * 3000;
    lightningAlpha = 0;
    // 切换天气时重新生成星星（如果切到夜晚）
    if (weather !== 'night') nightStars = [];
  });
});

// ================================================================
// ============ 颜色模式交互 ============
// ================================================================

const COLOR_SCORES = [
  { color: '#e03030', name: '红色', score: -0.30 },
  { color: '#f09030', name: '橙色', score: +0.20 },
  { color: '#f5d030', name: '黄色', score: +0.30 },
  { color: '#40a040', name: '绿色', score: +0.40 },
  { color: '#3070d0', name: '蓝色', score:  0.00 },
  { color: '#8040c0', name: '紫色', score:  0.00 },
  { color: '#f070a0', name: '粉色', score: +0.30 },
  { color: '#8b5a30', name: '棕色', score: -0.10 },
  { color: '#222222', name: '黑色', score: -0.40 },
  { color: '#f8f8f8', name: '白色', score: +0.10 },
  { color: '#909090', name: '灰色', score: -0.20 },
  { color: '#3080a0', name: '青色', score: -0.05 },
];

let selectedColorIndices = []; // 已选颜色索引
const colorGridEl = document.getElementById('colorGrid');
const colorCountEl = document.getElementById('colorCount');

// 生成12个颜色方块
COLOR_SCORES.forEach((cs, idx) => {
  const block = document.createElement('div');
  block.className = 'color-block';
  block.style.background = cs.color;
  block.title = cs.name;
  // 白色方块加边框区分
  if (cs.color === '#f8f8f8') {
    block.style.border = '4px solid #ddd';
  }
  block.dataset.index = idx;

  block.addEventListener('click', () => {
    const i = parseInt(block.dataset.index);
    if (selectedColorIndices.includes(i)) {
      // 取消选择
      selectedColorIndices = selectedColorIndices.filter(x => x !== i);
      block.classList.remove('selected');
    } else {
      // 选满3个后不允许再选
      if (selectedColorIndices.length >= 3) return;
      selectedColorIndices.push(i);
      block.classList.add('selected');
    }
    // 更新计数
    colorCountEl.textContent = `选择了 ${selectedColorIndices.length}/3 个颜色`;

    // 选满3个自动触发分析
    if (selectedColorIndices.length === 3) {
      analyzeColorSelection();
    }
  });

  colorGridEl.appendChild(block);
});

// 颜色模式分析逻辑
function analyzeColorSelection() {
  const selected = selectedColorIndices.map(i => COLOR_SCORES[i]);
  // 计算基础平均分
  let avgScore = selected.reduce((sum, s) => sum + s.score, 0) / selected.length;

  // 特殊组合加成检测
  const hasBlack = selected.some(s => s.score === -0.40);
  const hasYellow = selected.some(s => s.score === +0.30);
  const hasGray = selected.some(s => s.score === -0.20);
  const hasPink = selected.some(s => s.score === +0.30);

  let bonusBlackYellow = false;
  let bonusGrayPink = false;

  if (hasBlack && hasYellow) {
    avgScore += 0.08;
    bonusBlackYellow = true;
  }
  if (hasGray && hasPink) {
    avgScore += 0.08;
    bonusGrayPink = true;
  }

  // 映射到0~1
  let moodValue = (avgScore + 1) / 2;
  moodValue = Math.max(0, Math.min(1, moodValue));

  // 启动情绪过渡
  startMoodAnimation(moodValue);

  // 生成文字解读
  let text;
  if (moodValue < 0.2) text = '你选择的颜色沉淀着风暴的能量，树在风中弯下了腰，但它不会折断。';
  else if (moodValue < 0.4) text = '你的色彩有些暗淡，树感受到了一阵微凉的风。没关系，阴天也是森林需要的天气。';
  else if (moodValue < 0.6) text = '你的颜色平和而安静，树在淡淡的天光下轻轻呼吸。';
  else if (moodValue < 0.8) text = '你的色彩温暖而明亮，树感到花瓣在枝头蠢蠢欲动。';
  else text = '你的颜色在唱歌！树开心地绽放了，整片森林都亮了起来。';

  // 追加特殊组合文案
  if (bonusBlackYellow) text += '但你选的黑色里藏着一小束光。';
  if (bonusGrayPink) text += '在疲惫的灰色旁边，有一抹温柔在悄悄生长。';

  // 显示解读文字（淡入）
  interpretationEl.classList.remove('visible');
  setTimeout(() => {
    interpretationEl.textContent = text;
    interpretationEl.classList.add('visible');
  }, 50);
}
</script>
