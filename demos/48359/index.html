<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盲文乐谱AI校对工具</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#6366f1;--primary-light:#818cf8;--primary-dark:#4f46e5;--primary-glow:rgba(99,102,241,.15);
  --accent:#f59e0b;--accent-light:#fbbf24;--accent-glow:rgba(245,158,11,.15);
  --bg:#0f0e17;--bg-card:#1a1930;--bg-card-hover:#221f3a;--bg-elevated:#252347;
  --text:#fffffe;--text-secondary:#a7a9be;--text-muted:#6b6d82;
  --success:#10b981;--error:#ef4444;--warning:#f59e0b;
  --border:rgba(255,255,255,.06);--border-active:rgba(99,102,241,.4);
  --radius:12px;--radius-lg:20px;--radius-sm:8px;
  --shadow:0 4px 24px rgba(0,0,0,.3);--shadow-lg:0 8px 48px rgba(0,0,0,.4);
  --font-body:'Noto Sans SC',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace;
  --transition:all .3s cubic-bezier(.4,0,.2,1);
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 20% 10%,rgba(99,102,241,.08),transparent),radial-gradient(ellipse 60% 50% at 80% 90%,rgba(245,158,11,.05),transparent);pointer-events:none;z-index:0}

/* NAV */
.nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);background:rgba(15,14,23,.85);border-bottom:1px solid var(--border);padding:0 2rem}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px}
.nav-brand{display:flex;align-items:center;gap:.75rem}
.nav-logo{width:40px;height:40px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:700;color:#fff;box-shadow:0 2px 12px rgba(99,102,241,.3)}
.nav-title{font-size:1.125rem;font-weight:700;letter-spacing:-.02em}
.nav-subtitle{font-size:.75rem;color:var(--text-muted);font-weight:400}
.nav-status{display:flex;align-items:center;gap:.5rem;font-size:.8125rem;color:var(--success)}
.nav-status::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* LAYOUT */
.container{max-width:1400px;margin:0 auto;padding:1.5rem 2rem 4rem;position:relative;z-index:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.grid-full{grid-column:1/-1}
@media(max-width:900px){.grid{grid-template-columns:1fr}.container{padding:1rem}}

/* CARD */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;transition:var(--transition);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(99,102,241,.3),transparent);opacity:0;transition:var(--transition)}
.card:hover::before{opacity:1}
.card:hover{border-color:var(--border-active);background:var(--bg-card-hover)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.card-title{font-size:1rem;font-weight:600;display:flex;align-items:center;gap:.5rem}
.card-title .icon{font-size:1.25rem}
.card-badge{font-size:.6875rem;padding:.25rem .625rem;border-radius:999px;font-weight:500}
.badge-primary{background:var(--primary-glow);color:var(--primary-light)}
.badge-accent{background:var(--accent-glow);color:var(--accent-light)}
.badge-success{background:rgba(16,185,129,.12);color:var(--success)}
.badge-error{background:rgba(239,68,68,.12);color:var(--error)}

/* UPLOAD */
.upload-zone{border:2px dashed rgba(99,102,241,.25);border-radius:var(--radius);padding:2.5rem 1.5rem;text-align:center;cursor:pointer;transition:var(--transition);position:relative}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--primary);background:var(--primary-glow)}
.upload-zone .upload-icon{font-size:2.5rem;margin-bottom:.75rem;display:block}
.upload-zone .upload-text{font-size:.9375rem;color:var(--text-secondary);margin-bottom:.5rem}
.upload-zone .upload-hint{font-size:.75rem;color:var(--text-muted)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-progress{margin-top:1rem;display:none}
.upload-progress.active{display:block}
.progress-bar{height:6px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:999px;width:0;transition:width .3s ease}
.progress-info{display:flex;justify-content:space-between;margin-top:.5rem;font-size:.75rem;color:var(--text-muted)}

/* PROOFREADING RESULTS */
.results-list{display:flex;flex-direction:column;gap:.75rem;max-height:420px;overflow-y:auto;padding-right:.5rem}
.results-list::-webkit-scrollbar{width:4px}
.results-list::-webkit-scrollbar-track{background:transparent}
.results-list::-webkit-scrollbar-thumb{background:var(--primary-dark);border-radius:999px}
.result-item{display:grid;grid-template-columns:auto 1fr auto;gap:.75rem;align-items:start;padding:1rem;background:var(--bg-elevated);border-radius:var(--radius);border:1px solid var(--border);transition:var(--transition);cursor:pointer}
.result-item:hover{border-color:var(--border-active);transform:translateX(4px)}
.result-item.speaking{border-color:var(--accent);box-shadow:0 0 16px var(--accent-glow)}
.result-position{font-family:var(--font-mono);font-size:.75rem;padding:.25rem .5rem;border-radius:var(--radius-sm);background:var(--primary-glow);color:var(--primary-light);white-space:nowrap;font-weight:600}
.result-body{min-width:0}
.result-type{font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25rem}
.result-type.error{color:var(--error)}.result-type.warning{color:var(--warning)}.result-type.info{color:var(--primary-light)}
.result-original{font-size:.8125rem;color:var(--text-muted);margin-bottom:.125rem;font-family:var(--font-mono)}
.result-suggestion{font-size:.8125rem;color:var(--success);font-family:var(--font-mono)}
.result-action{font-size:1.25rem;opacity:.4;transition:var(--transition);cursor:pointer;padding:.25rem}
.result-item:hover .result-action{opacity:1;color:var(--accent)}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text-muted)}
.empty-state .empty-icon{font-size:3rem;margin-bottom:1rem;opacity:.5}
.empty-state p{font-size:.875rem}

/* VOICE CONTROL */
.voice-controls{display:flex;flex-direction:column;gap:1.25rem}
.voice-btn-row{display:flex;gap:.75rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.625rem 1.25rem;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-elevated);color:var(--text);font-size:.875rem;font-weight:500;cursor:pointer;transition:var(--transition);font-family:var(--font-body)}
.btn:hover{border-color:var(--border-active);background:var(--primary-glow)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#000}
.btn-accent:hover{background:var(--accent-light)}
.btn-sm{padding:.375rem .75rem;font-size:.8125rem}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.voice-speed{display:flex;align-items:center;gap:.75rem}
.voice-speed label{font-size:.8125rem;color:var(--text-secondary);white-space:nowrap}
.voice-speed input[type=range]{flex:1;accent-color:var(--primary);height:4px}
.voice-speed .speed-val{font-family:var(--font-mono);font-size:.8125rem;color:var(--primary-light);min-width:2.5rem;text-align:right}
.voice-status{font-size:.8125rem;color:var(--text-muted);display:flex;align-items:center;gap:.5rem}
.voice-status .dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted)}
.voice-status.playing .dot{background:var(--success);animation:pulse 1s infinite}

/* BRAILLE REFERENCE */
.braille-tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.braille-tab{padding:.375rem .875rem;border-radius:var(--radius-sm);font-size:.8125rem;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-secondary);transition:var(--transition);font-family:var(--font-body)}
.braille-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.braille-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:.5rem}
.braille-item{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.625rem .5rem;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);transition:var(--transition);cursor:pointer}
.braille-item:hover{border-color:var(--primary);background:var(--primary-glow);transform:translateY(-2px)}
.braille-dots{font-size:1.5rem;line-height:1;font-family:var(--font-mono)}
.braille-label{font-size:.6875rem;color:var(--text-muted);text-align:center}

/* HISTORY */
.history-list{display:flex;flex-direction:column;gap:.5rem;max-height:360px;overflow-y:auto;padding-right:.5rem}
.history-list::-webkit-scrollbar{width:4px}
.history-list::-webkit-scrollbar-track{background:transparent}
.history-list::-webkit-scrollbar-thumb{background:var(--primary-dark);border-radius:999px}
.history-item{display:grid;grid-template-columns:1fr auto auto;gap:.75rem;align-items:center;padding:.875rem 1rem;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);transition:var(--transition);cursor:pointer}
.history-item:hover{border-color:var(--border-active);background:var(--bg-card-hover)}
.history-name{font-size:.875rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-meta{font-size:.6875rem;color:var(--text-muted);margin-top:.125rem}
.history-errors{font-family:var(--font-mono);font-size:.75rem;padding:.25rem .5rem;border-radius:var(--radius-sm)}
.history-errors.zero{background:rgba(16,185,129,.1);color:var(--success)}
.history-errors.few{background:var(--accent-glow);color:var(--accent-light)}
.history-errors.many{background:rgba(239,68,68,.1);color:var(--error)}
.history-status{font-size:.6875rem;padding:.25rem .5rem;border-radius:999px}
.status-done{background:rgba(16,185,129,.1);color:var(--success)}
.status-pending{background:var(--accent-glow);color:var(--accent-light)}
.history-clear{margin-top:.75rem}

/* STATS BAR */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}
@media(max-width:600px){.stats-bar{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;text-align:center}
.stat-value{font-size:1.75rem;font-weight:700;font-family:var(--font-mono);background:linear-gradient(135deg,var(--primary-light),var(--accent-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-label{font-size:.75rem;color:var(--text-muted);margin-top:.25rem}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
.fade-in{animation:fadeIn .5s ease both}
.fade-in-1{animation-delay:.05s}.fade-in-2{animation-delay:.1s}.fade-in-3{animation-delay:.15s}.fade-in-4{animation-delay:.2s}

/* TOAST */
.toast-container{position:fixed;top:80px;right:1.5rem;z-index:200;display:flex;flex-direction:column;gap:.5rem}
.toast{padding:.75rem 1.25rem;border-radius:var(--radius-sm);font-size:.8125rem;animation:fadeIn .3s ease;border:1px solid var(--border);backdrop-filter:blur(12px)}
.toast-success{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.3);color:var(--success)}
.toast-error{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.3);color:var(--error)}
.toast-info{background:var(--primary-glow);border-color:rgba(99,102,241,.3);color:var(--primary-light)}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-brand">
      <div class="nav-logo">♫</div>
      <div>
        <div class="nav-title">盲文乐谱AI校对工具</div>
        <div class="nav-subtitle">Braille Music Proofreader</div>
      </div>
    </div>
    <div class="nav-status">AI 引擎就绪</div>
  </div>
</nav>

<div class="container">
  <div class="stats-bar fade-in">
    <div class="stat-card"><div class="stat-value" id="statFiles">0</div><div class="stat-label">已处理文件</div></div>
    <div class="stat-card"><div class="stat-value" id="statErrors">0</div><div class="stat-label">发现错误</div></div>
    <div class="stat-card"><div class="stat-value" id="statFixed">0</div><div class="stat-label">已修正</div></div>
    <div class="stat-card"><div class="stat-value" id="statAccuracy">--%</div><div class="stat-label">准确率</div></div>
  </div>

  <div class="grid">
    <!-- UPLOAD -->
    <div class="card fade-in fade-in-1">
      <div class="card-header">
        <div class="card-title"><span class="icon">📄</span> 乐谱上传</div>
        <span class="card-badge badge-primary">BXML / BRF</span>
      </div>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept=".bxml,.brf,.bsq,.txt">
        <span class="upload-icon">⬆️</span>
        <div class="upload-text">拖拽乐谱文件到此处，或点击选择文件</div>
        <div class="upload-hint">支持 BXML、BRF、BSQ 格式，最大 50MB</div>
      </div>
      <div class="upload-progress" id="uploadProgress">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-info"><span id="progressText">正在分析乐谱...</span><span id="progressPercent">0%</span></div>
      </div>
    </div>

    <!-- VOICE -->
    <div class="card fade-in fade-in-2">
      <div class="card-header">
        <div class="card-title"><span class="icon">🔊</span> 语音反馈</div>
        <span class="card-badge badge-accent" id="voiceBadge">待命</span>
      </div>
      <div class="voice-controls">
        <div class="voice-btn-row">
          <button class="btn btn-primary" id="btnPlay" disabled>▶ 播放全部</button>
          <button class="btn" id="btnPause" disabled>⏸ 暂停</button>
          <button class="btn" id="btnPrev" disabled>⏮ 上一条</button>
          <button class="btn" id="btnNext" disabled>⏭ 下一条</button>
        </div>
        <div class="voice-speed">
          <label>语速</label>
          <input type="range" id="speedRange" min="0.5" max="2" step="0.1" value="1">
          <span class="speed-val" id="speedVal">1.0x</span>
        </div>
        <div class="voice-status" id="voiceStatus"><span class="dot"></span>等待校对结果...</div>
      </div>
    </div>

    <!-- RESULTS -->
    <div class="card grid-full fade-in fade-in-3">
      <div class="card-header">
        <div class="card-title"><span class="icon">🔍</span> 校对结果</div>
        <span class="card-badge badge-success" id="resultCount">0 项</span>
      </div>
      <div class="results-list" id="resultsList">
        <div class="empty-state">
          <div class="empty-icon">🎵</div>
          <p>上传乐谱文件后，AI 将自动校对并在此展示结果</p>
        </div>
      </div>
    </div>

    <!-- BRAILLE REFERENCE -->
    <div class="card fade-in fade-in-3">
      <div class="card-header">
        <div class="card-title"><span class="icon">🔣</span> 盲文符号参考</div>
      </div>
      <div class="braille-tabs">
        <button class="braille-tab active" data-tab="letters">字母</button>
        <button class="braille-tab" data-tab="numbers">数字</button>
        <button class="braille-tab" data-tab="music">音乐符号</button>
      </div>
      <div class="braille-grid" id="brailleGrid"></div>
    </div>

    <!-- HISTORY -->
    <div class="card fade-in fade-in-4">
      <div class="card-header">
        <div class="card-title"><span class="icon">📋</span> 历史记录</div>
        <span class="card-badge badge-primary" id="historyCount">0 条</span>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty-state">
          <div class="empty-icon">📂</div>
          <p>暂无校对记录</p>
        </div>
      </div>
      <button class="btn btn-sm history-clear" id="btnClearHistory" style="display:none">清除全部记录</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const BRAILLE_DATA={
  letters:[
    {dots:'⠁',label:'A'},{dots:'⠃',label:'B'},{dots:'⠉',label:'C'},{dots:'⠙',label:'D'},
    {dots:'⠑',label:'E'},{dots:'⠋',label:'F'},{dots:'⠛',label:'G'},{dots:'⠓',label:'H'},
    {dots:'⠊',label:'I'},{dots:'⠚',label:'J'},{dots:'⠅',label:'K'},{dots:'⠇',label:'L'},
    {dots:'⠍',label:'M'},{dots:'⠝',label:'N'},{dots:'⠕',label:'O'},{dots:'⠏',label:'P'},
    {dots:'⠟',label:'Q'},{dots:'⠗',label:'R'},{dots:'⠎',label:'S'},{dots:'⠞',label:'T'},
    {dots:'⠥',label:'U'},{dots:'⠧',label:'V'},{dots:'⠺',label:'W'},{dots:'⠭',label:'X'},
    {dots:'⠽',label:'Y'},{dots:'⠵',label:'Z'}
  ],
  numbers:[
    {dots:'⠁',label:'1'},{dots:'⠃',label:'2'},{dots:'⠉',label:'3'},{dots:'⠙',label:'4'},
    {dots:'⠑',label:'5'},{dots:'⠋',label:'6'},{dots:'⠛',label:'7'},{dots:'⠓',label:'8'},
    {dots:'⠊',label:'9'},{dots:'⠚',label:'0'},{dots:'⠼',label:'数字号'},{dots:'⠲',label:'.'},
    {dots:'⠂',label:','},{dots:'⠌',label:'/'},{dots:'⠒',label:':'},{dots:'⠤',label:'-'}
  ],
  music:[
    {dots:'⠐',label:'低音标记'},{dots:'⠈',label:'高音标记'},{dots:'⠑',label:'全音符'},
    {dots:'⠓',label:'二分音符'},{dots:'⠚',label:'四分音符'},{dots:'⠆',label:'八分音符'},
    {dots:'⠒',label:'十六分音符'},{dots:'⠣',label:'升号'},{dots:'⠩',label:'降号'},
    {dots:'⠡',label:'还原号'},{dots:'⠱',label:'高音谱号'},{dots:'⠻',label:'低音谱号'},
    {dots:'⠼',label:'拍号标记'},{dots:'⠷',label:'小节线'},{dots:'⠾',label:'终止线'},{dots:'⠫',label:'连音线'}
  ]
};

const MOCK_ERRORS=[
  {position:'第3小节·第2拍',type:'error',original:'⠚⠑ (预期四分音符E)',suggestion:'⠓⠑ (应为二分音符E)',desc:'音符时值与上下文不匹配'},
  {position:'第7小节·第1拍',type:'warning',original:'⠼⠙⠲⠙ (4/4拍号)',suggestion:'⠼⠉⠲⠙ (3/4拍号)',desc:'拍号与后续小节音符总数不一致'},
  {position:'第12小节·第3拍',type:'error',original:'⠣⠛ (升G)',suggestion:'⠡⠛ (还原G)',desc:'前一小节已有还原记号，此处升号疑为误标'},
  {position:'第15小节·第1拍',type:'info',original:'⠱ (高音谱号)',suggestion:'确认是否需切换为 ⠻ (低音谱号)',desc:'音域低于中央C，建议检查谱号'},
  {position:'第18小节·第4拍',type:'error',original:'⠚⠋ (四分音符F)',suggestion:'⠚⠑ (应为四分音符E)',desc:'与和声进行冲突，疑似点位错误'},
  {position:'第22小节·第2拍',type:'warning',original:'⠆⠉ (八分音符C)',suggestion:'⠚⠉ (应为四分音符C)',desc:'节奏型与相邻小节不一致'},
  {position:'第28小节·第1拍',type:'error',original:'⠾ (终止线)',suggestion:'⠷ (小节线)',desc:'乐曲中段不应出现终止线'},
  {position:'第31小节·第3拍',type:'info',original:'⠫ (连音线)',suggestion:'确认连音范围是否覆盖至第33小节',desc:'连音线终点标记缺失'}
];

let state={
  results:[],history:JSON.parse(localStorage.getItem('braille_history')||'[]'),
  isPlaying:false,currentIdx:-1,speakTimer:null,speed:1
};

const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);

function init(){
  renderBraille('letters');
  renderHistory();
  updateStats();
  bindEvents();
}

function bindEvents(){
  const zone=$('#uploadZone'),fi=$('#fileInput');
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragover')});
  zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('dragover');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0])});
  fi.addEventListener('change',e=>{if(e.target.files.length)handleFile(e.target.files[0])});

  $$('.braille-tab').forEach(t=>t.addEventListener('click',()=>{
    $$('.braille-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');renderBraille(t.dataset.tab);
  }));

  $('#speedRange').addEventListener('input',e=>{
    state.speed=parseFloat(e.target.value);
    $('#speedVal').textContent=state.speed.toFixed(1)+'x';
  });

  $('#btnPlay').addEventListener('click',playAll);
  $('#btnPause').addEventListener('click',pausePlay);
  $('#btnPrev').addEventListener('click',()=>navigateResult(-1));
  $('#btnNext').addEventListener('click',()=>navigateResult(1));
  $('#btnClearHistory').addEventListener('click',clearHistory);
}

function handleFile(file){
  const prog=$('#uploadProgress'),fill=$('#progressFill'),text=$('#progressText'),pct=$('#progressPercent');
  prog.classList.add('active');
  fill.style.width='0%';
  text.textContent=`正在分析: ${file.name}`;
  toast('info',`开始处理 ${file.name}`);

  let p=0;
  const iv=setInterval(()=>{
    p+=Math.random()*18+5;
    if(p>=100){p=100;clearInterval(iv);text.textContent='校对完成';finishProofread(file.name)}
    fill.style.width=Math.min(p,100)+'%';
    pct.textContent=Math.round(p)+'%';
    if(p<30)text.textContent=`正在解析盲文点位: ${file.name}`;
    else if(p<60)text.textContent=`AI 语义分析中...`;
    else if(p<90)text.textContent=`校验和声与节奏规则...`;
    else text.textContent='生成校对报告...';
  },300);
}

function finishProofread(fname){
  state.results=MOCK_ERRORS.map((e,i)=>({...e,id:Date.now()+i}));
  renderResults();
  enableVoiceControls();
  const entry={name:fname,time:new Date().toLocaleString('zh-CN'),errors:state.results.length,status:Math.random()>.4?'已校对':'待确认'};
  state.history.unshift(entry);
  localStorage.setItem('braille_history',JSON.stringify(state.history));
  renderHistory();updateStats();
  toast('success',`校对完成：发现 ${state.results.length} 处问题`);
}

function renderResults(){
  const list=$('#resultsList');
  if(!state.results.length){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">🎵</div><p>上传乐谱文件后，AI 将自动校对并在此展示结果</p></div>';
    $('#resultCount').textContent='0 项';return;
  }
  $('#resultCount').textContent=state.results.length+' 项';
  list.innerHTML=state.results.map((r,i)=>`
    <div class="result-item" data-idx="${i}" onclick="speakOne(${i})">
      <span class="result-position">${r.position}</span>
      <div class="result-body">
        <div class="result-type ${r.type}">${r.type==='error'?'错误':r.type==='warning'?'警告':'提示'}</div>
        <div class="result-original">原文: ${r.original}</div>
        <div class="result-suggestion">建议: ${r.suggestion}</div>
      </div>
      <span class="result-action" title="朗读">🔊</span>
    </div>
  `).join('');
}

function renderBraille(tab){
  const grid=$('#brailleGrid');
  grid.innerHTML=BRAILLE_DATA[tab].map(b=>`
    <div class="braille-item" onclick="toast('info','已复制: ${b.label} (${b.dots})')">
      <span class="braille-dots">${b.dots}</span>
      <span class="braille-label">${b.label}</span>
    </div>
  `).join('');
}

function renderHistory(){
  const list=$('#historyList'),cnt=$('#historyCount'),btn=$('#btnClearHistory');
  cnt.textContent=state.history.length+' 条';
  if(!state.history.length){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">📂</div><p>暂无校对记录</p></div>';
    btn.style.display='none';return;
  }
  btn.style.display='';
  list.innerHTML=state.history.map(h=>{
    const ec=h.errors===0?'zero':h.errors<=3?'few':'many';
    const sc=h.status==='已校对'?'status-done':'status-pending';
    return `<div class="history-item">
      <div><div class="history-name">${h.name}</div><div class="history-meta">${h.time}</div></div>
      <span class="history-errors ${ec}">${h.errors} 处</span>
      <span class="history-status ${sc}">${h.status}</span>
    </div>`;
  }).join('');
}

function updateStats(){
  const total=state.history.length;
  const errs=state.history.reduce((s,h)=>s+h.errors,0);
  const fixed=Math.round(errs*.72);
  $('#statFiles').textContent=total;
  $('#statErrors').textContent=errs;
  $('#statFixed').textContent=fixed;
  $('#statAccuracy').textContent=total?Math.round(72+Math.random()*15)+'%':'--%';
}

function enableVoiceControls(){
  $('#btnPlay').disabled=false;$('#btnPause').disabled=false;
  $('#btnPrev').disabled=false;$('#btnNext').disabled=false;
  $('#voiceStatus').className='voice-status';
  $('#voiceStatus').innerHTML='<span class="dot"></span>就绪，点击播放朗读全部错误';
  $('#voiceBadge').textContent=state.results.length+' 条';
}

function playAll(){
  if(!state.results.length)return;
  state.isPlaying=true;state.currentIdx=0;
  $('#voiceBadge').textContent='播放中';
  $('#voiceStatus').className='voice-status playing';
  $('#voiceStatus').innerHTML='<span class="dot"></span>正在朗读...';
  highlightResult(0);speakCurrent();
}

function speakCurrent(){
  if(!state.isPlaying||state.currentIdx>=state.results.length){pausePlay();return}
  const r=state.results[state.currentIdx];
  const txt=`第${state.currentIdx+1}条，位置${r.position}，${r.type==='error'?'错误':r.type==='warning'?'警告':'提示'}。原文：${r.original}。建议：${r.suggestion}`;
  if('speechSynthesis'in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='zh-CN';u.rate=state.speed;
    u.onend=()=>{state.currentIdx++;if(state.isPlaying){highlightResult(state.currentIdx);setTimeout(()=>speakCurrent(),300)}};
    speechSynthesis.speak(u);
  }else{
    setTimeout(()=>{state.currentIdx++;if(state.isPlaying){highlightResult(state.currentIdx);speakCurrent()}},1500/state.speed);
  }
}

function speakOne(idx){
  state.currentIdx=idx;highlightResult(idx);
  const r=state.results[idx];
  const txt=`位置${r.position}，${r.type==='error'?'错误':r.type==='warning'?'警告':'提示'}。原文：${r.original}。建议：${r.suggestion}`;
  if('speechSynthesis'in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);u.lang='zh-CN';u.rate=state.speed;
    speechSynthesis.speak(u);
  }
  toast('info',`朗读: ${r.position}`);
}

function highlightResult(idx){
  $$('.result-item').forEach((el,i)=>el.classList.toggle('speaking',i===idx));
  const target=$(`.result-item[data-idx="${idx}"]`);
  if(target)target.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function pausePlay(){
  state.isPlaying=false;
  if('speechSynthesis'in window)speechSynthesis.cancel();
  $('#voiceBadge').textContent=state.results.length+' 条';
  $('#voiceStatus').className='voice-status';
  $('#voiceStatus').innerHTML='<span class="dot"></span>已暂停';
  $$('.result-item').forEach(el=>el.classList.remove('speaking'));
}

function navigateResult(dir){
  if(!state.results.length)return;
  state.currentIdx=Math.max(0,Math.min(state.results.length-1,state.currentIdx+dir));
  highlightResult(state.currentIdx);speakOne(state.currentIdx);
}

function clearHistory(){
  state.history=[];localStorage.removeItem('braille_history');
  renderHistory();updateStats();toast('success','历史记录已清除');
}

function toast(type,msg){
  const c=$('#toastContainer');
  const el=document.createElement('div');
  el.className=`toast toast-${type}`;el.textContent=msg;
  c.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(20px)';el.style.transition='all .3s ease';setTimeout(()=>el.remove(),300)},3000);
}

init();
</script>
</body>
</html>
