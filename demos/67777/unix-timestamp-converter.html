<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unix 时间戳转换工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f7fa;
    color: #333;
    padding: 40px 20px;
    min-height: 100vh;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 36px 48px;
  }

  /* Row styles */
  .row {
    display: flex;
    align-items: center;
    padding: 20px 0;
    gap: 10px;
    flex-wrap: wrap;
  }

  .row + .row {
    border-top: 1px solid #eee;
  }

  .label {
    font-size: 14px;
    color: #555;
    white-space: nowrap;
    min-width: 200px;
    text-align: right;
    padding-right: 16px;
  }

  /* Input & select */
  input[type="text"], input[type="number"] {
    border: 1px solid #d9d9d9;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus, input[type="number"]:focus {
    border-color: #1890ff;
    box-shadow: 0 0 0 2px rgba(24,144,255,0.15);
  }

  .ts-input { width: 180px; }
  .date-input { width: 220px; }
  .year-input { width: 70px; text-align: center; }
  .unit-input { width: 60px; text-align: center; }
  .hour-input, .min-input, .sec-input { width: 55px; text-align: center; }
  .output-input { width: 240px; background: #fafafa; color: #666; }

  select {
    border: 1px solid #d9d9d9;
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 14px;
    outline: none;
    background: #fff;
    cursor: pointer;
  }
  select:focus { border-color: #1890ff; }

  /* Buttons */
  button {
    border: 1px solid #d9d9d9;
    border-radius: 4px;
    padding: 6px 18px;
    font-size: 14px;
    cursor: pointer;
    background: #fff;
    transition: all 0.2s;
    color: #333;
  }
  button:hover {
    border-color: #1890ff;
    color: #1890ff;
  }

  /* Current timestamp display */
  .current-ts {
    font-size: 18px;
    font-weight: 600;
    color: #e74c3c;
    letter-spacing: 1px;
    min-width: 140px;
    text-align: center;
  }

  /* Unit label */
  .unit-label {
    font-size: 14px;
    color: #888;
    margin-left: 2px;
  }

  /* Static unit suffix */
  .suffix {
    font-size: 14px;
    color: #555;
  }
</style>
</head>
<body>

<div class="container">

  <!-- Row 1: Current timestamp -->
  <div class="row" style="justify-content: center; gap: 16px;">
    <span class="label" style="min-width:auto;text-align:left;">现在的Unix时间戳(Unix timestamp)是：</span>
    <span class="current-ts" id="liveTimestamp">--</span>
    <button onclick="startClock()">开始</button>
    <button onclick="stopClock()">停止</button>
    <button onclick="refreshClock()">刷新</button>
  </div>

  <!-- Row 2: Timestamp -> Time -->
  <div class="row">
    <span class="label">Unix时间戳（Unix timestamp）</span>
    <input type="text" class="ts-input" id="tsInput" value="1782981580" placeholder="输入时间戳">
    <select id="tsUnit1"><option value="s">秒</option><option value="ms">毫秒</option></select>
    <button onclick="tsToTime()">转换</button>
    <input type="text" class="output-input" id="timeOutput" readonly placeholder="转换结果">
  </div>

  <!-- Row 3: Time -> Timestamp (single input) -->
  <div class="row">
    <span class="label">时间（年/月/日 时:分:秒）</span>
    <input type="text" class="date-input" id="dateInput" placeholder="2026/07/02 16:43:55">
    <button onclick="timeToTs()">转换成Unix时间戳</button>
    <input type="text" class="output-input" id="tsOutput1" readonly placeholder="转换结果">
    <select id="tsUnit2"><option value="s">秒</option><option value="ms">毫秒</option></select>
  </div>

  <!-- Row 4: Time -> Timestamp (split inputs) -->
  <div class="row">
    <span class="label">时间</span>
    <input type="number" class="year-input" id="yearInput" value="2026" min="1970" max="9999">
    <span class="suffix">年</span>
    <input type="number" class="unit-input" id="monthInput" placeholder="月" min="1" max="12">
    <span class="suffix">月</span>
    <input type="number" class="unit-input" id="dayInput" placeholder="日" min="1" max="31">
    <span class="suffix">日</span>
    <input type="number" class="hour-input" id="hourInput" placeholder="时" min="0" max="23">
    <span class="suffix">时</span>
    <input type="number" class="min-input" id="minInput" placeholder="分" min="0" max="59">
    <span class="suffix">分</span>
    <input type="number" class="sec-input" id="secInput" placeholder="秒" min="0" max="59">
    <span class="suffix">秒</span>
    <button onclick="splitTimeToTs()">转换Unix时间戳</button>
    <input type="text" class="output-input" id="tsOutput2" readonly placeholder="转换结果" style="width:160px;">
    <select id="tsUnit3"><option value="s">秒</option><option value="ms">毫秒</option></select>
  </div>

</div>

<script>
// ========== Live Clock ==========
let clockTimer = null;

function updateLive() {
  const now = Date.now();
  document.getElementById('liveTimestamp').textContent = Math.floor(now / 1000);
}

function startClock() {
  stopClock();
  updateLive();
  clockTimer = setInterval(updateLive, 1000);
}

function stopClock() {
  if (clockTimer) {
    clearInterval(clockTimer);
    clockTimer = null;
  }
}

function refreshClock() {
  updateLive();
}

// Auto-start
startClock();

// ========== Conversion Helpers ==========

function formatDateTime(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  const h = String(date.getHours()).padStart(2, '0');
  const mi = String(date.getMinutes()).padStart(2, '0');
  const s = String(date.getSeconds()).padStart(2, '0');
  return `${y}/${m}/${d} ${h}:${mi}:${s}`;
}

// ========== Timestamp -> Time ==========
function tsToTime() {
  const val = document.getElementById('tsInput').value.trim();
  const unit = document.getElementById('tsUnit1').value;
  if (!val) return;
  let ts = parseInt(val, 10);
  if (isNaN(ts)) { alert('请输入有效数字'); return; }
  if (unit === 'ms') ts = Math.floor(ts / 1000);
  const date = new Date(ts * 1000);
  if (isNaN(date.getTime())) { alert('无效的时间戳'); return; }
  document.getElementById('timeOutput').value = formatDateTime(date);
}

// Enter key support
document.getElementById('tsInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') tsToTime();
});

// ========== Time (single input) -> Timestamp ==========
function timeToTs() {
  const val = document.getElementById('dateInput').value.trim();
  if (!val) return;
  // Support multiple formats
  const date = new Date(val.replace(/\//g, '-'));
  if (isNaN(date.getTime())) { alert('无效的日期格式，请使用 年/月/日 时:分:秒 格式'); return; }
  const unit = document.getElementById('tsUnit2').value;
  const ts = unit === 'ms' ? date.getTime() : Math.floor(date.getTime() / 1000);
  document.getElementById('tsOutput1').value = ts;
}

document.getElementById('dateInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') timeToTs();
});

// ========== Split inputs -> Timestamp ==========
function splitTimeToTs() {
  const y = parseInt(document.getElementById('yearInput').value, 10);
  const mo = parseInt(document.getElementById('monthInput').value, 10);
  const d = parseInt(document.getElementById('dayInput').value, 10);
  const h = parseInt(document.getElementById('hourInput').value, 10) || 0;
  const mi = parseInt(document.getElementById('minInput').value, 10) || 0;
  const s = parseInt(document.getElementById('secInput').value, 10) || 0;

  if (isNaN(y) || isNaN(mo) || isNaN(d)) { alert('请至少填写 年、月、日'); return; }

  const date = new Date(y, mo - 1, d, h, mi, s);
  if (isNaN(date.getTime())) { alert('无效的日期时间'); return; }

  const unit = document.getElementById('tsUnit3').value;
  const ts = unit === 'ms' ? date.getTime() : Math.floor(date.getTime() / 1000);
  document.getElementById('tsOutput2').value = ts;
}
</script>

</body>
</html>
