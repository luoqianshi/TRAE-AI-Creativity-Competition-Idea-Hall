<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>东方快车 — 沉浸式文字扮演</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-dark: #0d0703; --bg-panel: #1a0f08; --bg-chat: #120a05;
    --gold: #c9a84c; --gold-dim: #8b6914; --wood: #4a2c0a; --wood-light: #6b4423;
    --cream: #e8d5b7; --cream-dim: #a89880; --red: #8b2500; --red-bright: #c0392b;
    --text: #d4c5b2; --text-dim: #887766; --border: #2a1808; --input-bg: #1a0e05;
    --font-main: 'Georgia', 'Times New Roman', serif;
    --font-ui: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  body {
    background: var(--bg-dark); color: var(--text); font-family: var(--font-main);
    height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    background-image: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.05) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(139,37,0,0.04) 0%, transparent 50%);
  }
  .top-bar {
    height: 52px; background: linear-gradient(180deg, #1a0f08 0%, #120a05 100%);
    border-bottom: 1px solid var(--gold-dim); display: flex; align-items: center;
    padding: 0 20px; gap: 16px; flex-shrink: 0;
  }
  .top-bar .logo { font-size: 18px; font-weight: bold; color: var(--gold); letter-spacing: 3px; }
  .top-bar .logo span { color: var(--cream-dim); font-size: 12px; letter-spacing: 1px; margin-left: 8px; }
  .top-bar .divider { flex: 1; }
  .top-bar .stage-badge { background: #1a0e05; border: 1px solid var(--gold-dim); color: var(--gold); padding: 4px 14px; border-radius: 3px; font-size: 13px; font-family: var(--font-ui); }
  .top-bar .btn { background: transparent; border: 1px solid var(--cream-dim); color: var(--cream-dim); padding: 5px 14px; border-radius: 3px; cursor: pointer; font-size: 12px; font-family: var(--font-ui); transition: all 0.3s; }
  .top-bar .btn:hover { border-color: var(--gold); color: var(--gold); }
  .top-bar .btn.api-btn { border-color: var(--red); color: var(--red-bright); }
  .top-bar .btn.api-btn.active { border-color: #4caf50; color: #4caf50; }
  .main-container { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 260px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--gold); letter-spacing: 2px; font-family: var(--font-ui); }
  .char-list { flex: 1; overflow-y: auto; padding: 4px; }
  .char-list::-webkit-scrollbar { width: 4px; }
  .char-list::-webkit-scrollbar-thumb { background: var(--wood); border-radius: 2px; }
  .char-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 2px 0; border-radius: 4px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; position: relative; }
  .char-card:hover { background: rgba(201,168,76,0.08); border-color: var(--wood); }
  .char-card.active { background: rgba(201,168,76,0.12); border-color: var(--gold-dim); }
  .char-card .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--wood); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; border: 2px solid var(--wood-light); }
  .char-card.active .avatar { border-color: var(--gold); }
  .char-card .info { flex: 1; min-width: 0; }
  .char-card .name { font-size: 13px; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .char-card .role { font-size: 11px; color: var(--cream-dim); margin-top: 2px; }
  .char-card .new-msg { width: 8px; height: 8px; background: var(--red-bright); border-radius: 50%; position: absolute; top: 12px; right: 12px; display: none; }
  .char-card .new-msg.show { display: block; }
  .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-header { padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--bg-panel); display: flex; align-items: center; gap: 10px; }
  .chat-header .char-name { font-size: 16px; color: var(--gold); }
  .chat-header .char-role { font-size: 12px; color: var(--cream-dim); }
  .chat-messages { flex: 1; overflow-y: auto; padding: 20px; background: var(--bg-chat); background-image: linear-gradient(rgba(201,168,76,0.02) 1px, transparent 1px); background-size: 100% 40px; }
  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--wood); border-radius: 3px; }
  .msg { margin-bottom: 16px; animation: fadeIn 0.4s ease; max-width: 80%; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { margin-left: auto; }
  .msg.char { margin-right: auto; }
  .msg.system { max-width: 100%; text-align: center; }
  .msg .sender { font-size: 11px; color: var(--cream-dim); margin-bottom: 4px; font-family: var(--font-ui); }
  .msg.user .sender { text-align: right; }
  .msg .bubble { padding: 12px 16px; border-radius: 6px; line-height: 1.7; font-size: 14px; }
  .msg.user .bubble { background: rgba(201,168,76,0.12); border: 1px solid rgba(201,168,76,0.2); color: var(--cream); border-bottom-right-radius: 2px; }
  .msg.char .bubble { background: var(--bg-panel); border: 1px solid var(--border); color: var(--cream); border-bottom-left-radius: 2px; }
  .msg.system .bubble { background: transparent; color: var(--gold-dim); font-style: italic; font-size: 13px; border: none; }
  .input-area { padding: 14px 20px; background: var(--bg-panel); border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .input-area input { flex: 1; background: var(--input-bg); border: 1px solid var(--border); color: var(--cream); padding: 10px 16px; border-radius: 4px; font-size: 14px; font-family: var(--font-main); outline: none; transition: border-color 0.3s; }
  .input-area input:focus { border-color: var(--gold-dim); }
  .input-area input::placeholder { color: var(--text-dim); }
  .input-area button { background: var(--gold-dim); border: none; color: #fff; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 13px; font-family: var(--font-ui); font-weight: 600; transition: all 0.3s; letter-spacing: 1px; }
  .input-area button:hover { background: var(--gold); }
  .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; animation: fadeIn 0.3s; }
  .modal { background: var(--bg-panel); border: 1px solid var(--gold-dim); border-radius: 8px; padding: 30px; max-width: 440px; width: 90%; }
  .modal h3 { color: var(--gold); margin-bottom: 16px; font-size: 18px; }
  .modal p { color: var(--cream-dim); margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
  .modal input { width: 100%; background: var(--input-bg); border: 1px solid var(--border); color: var(--cream); padding: 10px 14px; border-radius: 4px; font-size: 14px; font-family: var(--font-main); outline: none; margin-bottom: 12px; }
  .modal input:focus { border-color: var(--gold-dim); }
  .modal .btn-row { display: flex; gap: 10px; justify-content: flex-end; }
  .modal .btn { padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 13px; font-family: var(--font-ui); border: none; transition: all 0.3s; }
  .modal .btn-primary { background: var(--gold-dim); color: #fff; }
  .modal .btn-primary:hover { background: var(--gold); }
  .modal .btn-secondary { background: transparent; border: 1px solid var(--cream-dim); color: var(--cream-dim); }
  .modal .btn-secondary:hover { border-color: var(--cream); color: var(--cream); }
  @media (max-width: 768px) { .sidebar { width: 200px; } .msg { max-width: 90%; } }
  @media (max-width: 500px) { .sidebar { display: none; } }
</style>
</head>
<body>
<div class="top-bar">
  <div class="logo">东方快车 <span>MURDER ON ORIENT EXPRESS</span></div>
  <div class="divider"></div>
  <div class="stage-badge" id="stageBadge">登车</div>
  <button class="btn api-btn" id="apiBtn" onclick="toggleApiModal()">⚙ API</button>
  <button class="btn" onclick="resetGame()">重置</button>
</div>
<div class="main-container">
  <div class="sidebar">
    <div class="sidebar-header">乘客名录</div>
    <div class="char-list" id="charList"></div>
  </div>
  <div class="chat-area">
    <div class="chat-header">
      <span class="char-name" id="chatCharName">车厢</span>
      <span class="char-role" id="chatCharRole">东方快车 · 伊斯坦布尔 → 巴黎</span>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="输入你的话..." onkeydown="if(event.key==='Enter')sendMessage()"/>
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="apiModal" style="display:none">
  <div class="modal">
    <h3>DeepSeek API 配置</h3>
    <p>输入你的 DeepSeek API Key 即可启用 AI 实时对话。留空则使用演示模式（预设回复）。</p>
    <input type="text" id="apiKeyInput" placeholder="sk-xxxxxxxxxxxxxxxx"/>
    <p style="font-size:12px;color:var(--text-dim)">获取 Key: <a href="https://platform.deepseek.com" target="_blank" style="color:var(--gold-dim)">platform.deepseek.com</a></p>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="toggleApiModal()">取消</button>
      <button class="btn btn-primary" onclick="saveApiKey()">保存</button>
    </div>
  </div>
</div>
<script src="orient-express.js"></script>
</body>
</html>
